  );\n```\n\n当你在浏览器中查看此脚本时，你应该看到类似于图 28.5 的内容。\n\n图 28.5 来自搜索的 JSON 输出。\n\n\n\n\n\
  # 如何配置 Apache 以检测并防止客户端的滥用行为\n\n- 如何配置基于名称的虚拟主机、基于 IP 的虚拟主机以及两者之间的区别\n- 虚拟主机对 DNS\
  \ 的依赖\n- 如何设置扩展的 cookie-cutter 虚拟主机\n\n本与管理相关的章节侧重于提高你 Apache 服务器的性能和可扩展性。此外，你将学习基于名称和基于\
  \ IP 的虚拟主机，以及与 `Domain Name System`（DNS）相关的问题以及网络浏览器本身的问题。本章还解释了你可以用于隔离各个客户端的各种机制以及相关的安全权衡。\n\
  \n## 性能与可扩展性问题\n\n本节涵盖了可扩展性问题以及如何防止这些问题。本节更像是一份“不要这样做”列表，解释了可能会降低性能或阻止服务器扩展的限制因素。你还将学习如何对\
  \ Apache 进行主动调优以获得最佳性能。\n\n### 操作系统限制\n\n多个操作系统的因素限制了 Apache 的性能。这些因素与进程创建、内存限制以及同时打开的文件或连接的最大数量有关。\n\
  \n> 注意\n> UNIX 的 `ulimit` 命令允许你按进程为单位设置本节中涵盖的若干限制。有关 `ulimit` 语法的详细信息，请参考你的操作系统文档。\n\
  \n### 进程\n\nApache 提供了相关设置以防止服务器进程和线程的数量超过某些限制。这些设置会影响可扩展性，因为它们限制了到 Web 服务器的并发连接数，从而影响了你从一台服务器上同时服务的访问者数量。\n\
  \n`Apache 多处理模块` (MPM) 设置反过来受到限制进程和线程数量的操作系统设置的约束。如何更改这些限制取决于操作系统。在 Linux 内内核中，这需要更改\
  \ `/proc/sys/kernel/threads-max` 文件中定义的 `NR_TASKS`。你可以使用此命令读取文件内容：\n\n```\ncat /proc/sys/kernel/threads-max\n\
  ```\n\n你可以使用此命令向文件写入：\n\n```\necho value > /proc/sys/kernel/threads-max\n```\n\n\
  在 Linux 中（与大多数 UNIX 版本不同），线程和进程之间存在映射关系，从操作系统的角度来看是相似的。\n\n在 Solaris 中，可以在 `/etc/system`\
  \ 文件中更改这些参数。这些更改不需要重新编译内核，但可能需要重启才能生效。你可以通过更改 `max_nprocs` 条目来更改进程总数，并通过 `maxuproc`\
  \ 更改允许特定用户的进程数。\n\n### 文件描述符\n\n每当进程打开文件（或套接字）时，就会分配一个名为 `file descriptor` 的结构，直到文件被关闭。操作系统限制了给定进程可以打开的文件描述符数量，从而限制了\
  \ Web 服务器可以拥并发连接数。如何更改这些设置取决于操作系统。在 Linux 系统上，你可以读取或修改 `/proc/sys/fs/file-max`。在\
  \ Solaris 系统上，你必须编辑 `/etc/system` 文件中的 `rlim_fd_max` 值。此更改需要重启才能生效。\n\n你可以在 [`httpd.apache.org/docs/2.4/vhosts/fd-limits.html`](http://httpd.apache.org/docs/2.4/vhosts/fd-limits.html)\
  \ 找到更多信息。\n\n### 控制外部进程\n\nApache 提供了几个指令来控制外部进程使用的资源量。此类进程包括从服务器派生的 CGI 脚本和通过服务器包含执行的程序，但并不包括使用模块版本调用的\
  \ PHP 脚本，因为模块是服务器进程的一部分。\n\n> 注意\n> 遵循本书初始章节中的安装指南将导致 PHP 以模块形式安装。因此，这些指令将不适用于你的情况，除非你自行修改了安装类型，或者你处于\
  \ PHP 未以模块形式安装的虚拟主机情中。然而，在后一种情况下，你很可能无法修改这些指令。\n\n对以下 Apache 指令（在 `httpd.conf` 中使用）的支持仅在\
  \ UNIX 上可用，且随系统而异：\n\n- `RLimitCPU`：接受两个参数：进程允许的 CPU 时间（以秒为单位）的软限制和硬限制。如果使用 `max`\
  \ 关键字，则表示操作系统允许的最大设置。硬限制是可选的。软限制可以在重启之间更改，而硬限制指定了该设置允许的最大值。\n- `RLimitMem`：语法与 `RLimitCPU`\
  \ 相同，但该指令指定了每个进程使用的内存量（以字节为单位）。\n- `RLimitNProc`：语法与 `RLimitCPU` 相同，但该指令指定了进程数量。\n\
  \n三个指令有助于防止恶意或编写糟糕的程序失控运行。\n\n## 与性能相关的 Apache 设置\n\n本节介绍了影响性能的各种 Apache 设置。\n\n\
  ### 文件系统访问\n\n从资源的角度来看，访问磁盘上的文件是一个昂贵的过程，因此你应该尝试尽量减少提供请求所需的磁盘访问次数。符号链接、按目录配置文件和内容协商是影响磁盘访问次数的某些因素：\n\
  \n- **符号链接**：在 UNIX 中，`symbolic link`（或 `symlink`）是指向另一个文件的特殊类型文件。它是通过 UNIX 的 `ln`\
  \ 命令创建的，对于让文件出现在不同的地方非常有用。`Options` 指令允许的两个参数是 `FollowSymLinks` 和 `SymLinksIfOwnerMatch`。默认情况下，Apache\
  \ 不跟踪符号链接，因为它们可以被用来绕过安全设置。例如，你可以从网站的公共部分到原本无法通过 Web 访问的受限文件或目录创建符号链接。因此，默认情况下，Apache\
  \ 还需要执行一个检查以验证该文件是否为符号链接。如果存在 `SymLinksIfOwnerMatch`，则当创建符号链接的用户拥有目标文件时，它会跟踪符号链接。由于这些测试必须对每个路径元素和每个引用文件系统对象的路径执行，它们可能会给你的系统带来负担。如果你控制内容的创建，你应该在配置中添加\
  \ `Options +FollowSymLinks` 指令并避免使用 `SymLinksIfOwnerMatch` 参数。这样，测试就不会发生，性能也不会受到影响。\n\
  - **按目录配置文件**：如第 3 章中“安装和配置 Apache”所述，可以拥有按目录配置文件。这些文件通常命名为 `.htaccess`，提供了一种配置服务器的方便方法并允许某种程度的委托管理。然而，如果启用了此功能，Apache\
  \ 必须在通往请求文件路径的每个目录中查找这些文件，导致负担的文件系统访问。如果你不需要按目录配置文件，可以通过在配置中添加 `AllowOverride none`\
  \ 来禁用此功能。这样做可以避免访问文件系统查找 `.htaccess` 文件相关的性能损失。\n\n\n\n\n\n- **内容协商（Content negotiation）**—Apache\
  \ 可以根据客户端的语言或偏好提供不同版本的文档。这可以使用与语言相关的特定扩展名来实现，在这种情况下，Apache 必须在每次请求时访问文件系统以寻找此类扩展名的文件。如果您需要使用内容协商，请确保至少使用类型映射文件（type-map\
  \ file），以尽量减少对磁盘的访问。用于国际化的 Apache 内容协商的一些应用程序替代方案，可以在第 27 章中的“应用程序本地化”中找到。\n\n-\
  \ **评分文件（Scoreboard file）**—这是旧版操作系统上，Apache 主进程用于与其子进程通信的特殊文件。您可以使用 `ScoreBoardFile`\
  \ 指令指定其位置，但大多数现代平台不需要使用此文件。如果需要此文件，将其放置在 RAM 磁盘（内存磁盘）上可能会获得性能提升。`RAM disk` 是一种允许将部分系统内存作为文件系统的机制。创建\
  \ RAM 磁盘的细节因系统而异。\n\n## 网络与状态设置\n\n某些选项可能会降低性能：\n\n- **HostnameLookups**—当 `HostnameLookups`\
  \ 设置为 `on` 或 `double` 时，Apache 在每次客户端发出请求时都会执行 DNS 查询以获取客户端的主机名。这种频繁查找会在响应过程中引入延迟。该指令的默认设置为\
  \ `off`。如果您想获取请求者的主机名，可以以后使用日志解析器离线对请求日志进行处理，而不是实时处理。\n\n- **Accept 机制（Accept mechanism）**—Apache\
  \ 使用不同的机制来控制 Apache 子进程如何仲裁请求。最佳取决于取决于平台和处理器数量。您可以在[`httpd.apache.org/docs-2.4/misc/perf-tuning.html`](http://httpd.apache.org/docs-2.4/misc/perf-tuning.html)\
  \ 更多信息。\n\n- **mod_status**—此模块收集有关服务器、连接和请求的统计信息，这会降低 Apache。为了获得最佳性能，请禁用此模块，或至少确保\
  \ `ExtendedStatus` 设置为默认值 `off`。\n\n## 使用 ApacheBench 进行负载测试\n\n您可以使用基准测试和流量生成工具来测试网站的性能。有许多商业和开源工具，每种工具的复杂程度不相同。通常，很难准确模拟真实世界的请求流量，因为访问者有不同的导航模式，使用不同速度的连接访问互联网，如果下载时间太长会停止下载，如果不耐烦会反复点击刷新按钮等。因此，某些工具会记录实际网络流量以备以后回放。\n\
  \n然而，为了快速（但准确）了解有关服务器处理高流量能力的基本信息，Apache 服务器带有一个简单实用的负载测试工具，称为 ApacheBench，或 `ab`。您可以在\
  \ Apache 分发包的 `bin` 目录下找到它。\n\n该工具允许您对某个 URL 发起多次请求并显示结果摘要。以下命令请求 Google 主页 1000\
  \ 次，在任何时刻有 10 个并发客户端：\n\n点击此处查看代码图像\n\n```\n/usr/local/apache2/bin/ab -n 1000 -c\
  \ 10 http://www.google.com/\n```\n\n***\n\n注意\n\n如果您在不带任何参数的情况下调用 `ab`，将获得命令行选项和语法的完整列表。此外，除非指定了特定页面，否则目标\
  \ URL 末尾的斜杠是必须的。\n\n***\n\n结果将类似于所示：\n\n点击此处查看代码图像\n\n```\nThis is ApacheBench,\
  \ Version 2.3 <$Revision: 655654 $>\n\nCopyright 1996 Adam Twiss, Zeus Technology\
  \ Ltd, http://www.zeustech.net/\n\nLicensed to The Apache Software Foundation, http://www.apache.org/\n\
  \nBenchmarking www.google.com (be patient)\n\nCompleted 100 requests\n\nCompleted\
  \ 200 requests\n\nCompleted 300 requests\n\nCompleted 400 requests\n\nCompleted\
  \ 500 requests\n\nCompleted 600 requests\n\nCompleted 700 requests\n\nCompleted\
  \ 800 requests\n\nCompleted 900 requests\n\nFinished 1000 requests\n\nServer Software:\
  \         gws\n\nServer Hostname:         www.google.com\n\nServer Port:       \
  \     80\n\nDocument Path:           /\n\nDocument Length:        11955 bytes\n\n\
  Concurrency Level:      10\n\nTime taken for tests:    50.751 seconds\n\nComplete\
  \ requests:      1000\n\nFailed requests:         669\n\n    (Connect: 0, Receive:\
  \ 0, Length: 669, Exceptions: 0)\n\nWrite errors:           0\n```\n\n\n\n\n提供内容最快的方法就是不提供！这可以通过使用适当的\
  \ HTTP Header 来实现，指令客户端和代理服务器请求资源的有效性时间。通过这种方式，某些出现在多个页面中但并不频繁更改的资源（例如 Logo 或导航按钮）在一段时间内仅传输一次。\n\
  \n此外，你可以在 Apache `2.x` 中使用 `mod_cache` 来缓存动态内容，这样就无需为每个请求重新创建内容。这可能是一个巨大的性能提升，因为动态内容通常需要访问数据库、处理模板等，这些操作会消耗大量资源。\n\
  \n## Note\n\nApache 2.4 具有许多缓存功能，这些功能在之前的早期版本中被认为是实验性的。有关此主题的更多信息，请参阅 Apache 缓存指南：[`httpd.apache.org/docs/2.4/caching.html`](http://httpd.apache.org/docs/2.4/caching.html)。\n\
  \n## 减少传输数据\n\n减少服务器负载的另一种方法是减少传输到客户端的数据量。这反过来会让你的客户端网站运行得更快，特别是是在慢速连接上。你可以通过以下几点来实现：\n\
  \n- 减少图片数量。\n- 减小图片尺寸。\n- 压缩大型可下载文件。\n- 预压缩静态 HTML 并使用内容协商。\n- 使用 `mod_deflate`\
  \ 压缩 HTML 内容。如果 CPU 性能可用且客户端通过慢速链路连接，这将非常有用。内容交付得更快，进程也能更早地释放以响应额外的请求。\n\n## 网络设置\n\
  \nHTTP 1.1 允许在单个连接上提供多个请求。HTTP 1.0 通过 keepalive 扩展也实现了相同的功能。`KeepAliveTimeout` 指令允许你指定服务器在关闭空闲连接之前等待的最秒数。增加超时时间意味着增加了连接被重用的机会。然而，它在等待期间也会占用连接和\
  \ Apache 进程，正如本章前面讨论的，这可能会降低性能。\n\n## 防止滥用\n\n*拒绝服务* (DoS) 攻击通过大量并发请求淹没你的 Web 服务器，从而减慢服务器速度或完全阻止访问。通常情况下，DoS\
  \ 攻击很难防止，通常处理此类攻击最有效的方法是在网络或操作系统层面。一个例子是阻止特定地址向服务器发送请求；虽然你可以在 Web 服务器级别阻止地址，但在网络防火墙/路由器或操作系统网络过滤器处阻止它们效率更高。\n\
  \n其他类型的滥用包括发送极大的请求或开启许多并发连接。你可以限制请求大小和超时时间来尽量减少攻击的影响。默认请求超时时间为 300 秒，但你可以通过 `TimeOut`\
  \ 指令进行更改。许多指令允许你控制请求体和头部的大小：`LimitRequestBody`、`LimitRequestFields`、`LimitRequestFieldSize`、`LimitRequestLine`\
  \ 和 `LimitXMLRequestBody`。\n\n### Robots\n\n*Robots*（机器人）、*网络蜘蛛*（web spiders）和*网络爬虫*（web\
  \ crawlers）是描述一类程序的名称，它们访问你网站的页面，递归地遵循网站链接。搜索引擎使用这些程序扫描互联网上的 Web 服务器，下载其内容并建立索引。真实用户使用此类程序下载整个网站或网站的部分以便以后离线浏览。通常情况下，这些程序表现良好，但有时它们可能具有攻击性，用过多的并发连接淹没你的网站，或者陷入循环循环。\n\
  \n表现良好的蜘蛛会请求一个名为 `robots.txt` 的特殊文件，该文件包含了关于如何访问你的网站以及网站哪些部分对它们不可用的指令。你可以在 [`www.robotstxt.org/`](http://www.robotstxt.org/)\
  \ 找到文件的语法。\n\n通过在 Web 服务器的文档根目录下放置一个格式适当的 `robots.txt` 文件，你可以控制蜘蛛的活动。此外，你可以在路由器或操作系统层面停止请求。\n\
  \n### 实现虚拟主机\n\n第一代 Web 服务器设计用于处理单个站点的内容。在同一台机器上托管多个网站的标准方法是为每个站点安装和配置单独 Web 服务器实例。随着互联网的增长，托管多个网站的需求也随之增长，一种更高效的解决方案被开发出来：虚拟主机。虚拟主机允许单个\
  \ Apache 实例提供不同的网站，通过域名或 IP 地址进行识别。*基于 IP 的*虚拟主机意味着每个域名被分配不同的 IP 地址；*基于名称的*虚拟主机意味着多个域名共享同一个\
  \ IP 地址。\n\nWeb 客户端使用 DNS 将主机名转换为 IP 地址反之亦然。可以存在多种映射关系：\n\n- **一对一**——每个主机名被分配一个唯一的\
  \ IP 地址。这是基于 IP 的虚拟主机的基础。\n- **一多**——一个主机名分配给多个 IP 地址。这对于使用多个 Apache 实例提供同一个网站非常有用。如果每个服务器都安装在不同的机器上，则可以在它们之间平衡网络流量，提高可扩展性。\n\
  - **多对一**——你可以将相同的 IP 地址分配给多个主机名。客户端通过请求中的 `Host:` 头部来指定它正在访问的网站。这是基于名称的虚拟主机的基础。\n\
  \n## Note\n\n当存在多对一映射时，通常可以配置 DNS 服务器为每个 DNS 查询响应不同的 IP 地址，这有助于分配负载。这被称为*轮询 DNS*\
  \ (round-robin DNS)。然而，如果你有机会使用负载均衡设备而不是依赖 DNS 服务器，这样做将缓解 Web 服务器绑定到 DNS 服务器时可能出现的任何问题。使用负载均衡器还可以消除高流量导致\
  \ DNS 服务器崩溃的可能性。\n\n### 基于 IP 的虚拟主机\n\n最简单的虚拟主机配置是每个主机分配一个唯一的 IP 地址。每个 IP 地址将 Apache\
  \ 处理的 HTTP 请求映射到各自 `VirtualHost` 容器中的独立内容树，如下代码所示：\n\n点击此处查看图片\n\n```\nListen 192.168.128.10:80\n\
  Listen 192.168.129.10:80\n\n<VirtualHost 192.168.128.10:80>\n\t DocumentRoot /usr/local/apache2/htdocs/host1\n\
  \t [针对此主机的配置]\n</VirtualHost>\n\n<VirtualHost 192.168.129.10:80>\n\t DocumentRoot\
  \ /usr/local/apache2/htdocs/host2\n\t [针对此主机的配置]\n</VirtualHost>\n```\n\n如果给定的虚拟主机没有指定\
  \ `DocumentRoot` 或任何其他配置，则将使用任何 `<VirtualHost>` 之外的全局设置。在示例中，每个虚拟主机都有自己的 `DocumentRoot`。当请求到达时，Apache\
  \ 使用目标 IP 地址将请求引导到相应的主机。例如，如果请求来自 192.168.128.10，Apache 将从 `/usr/local/apache2/htdocs/host1`\
  \ 返回文档。\n\n\n\n\n\n如果宿主机操作系统无法解析作为 `VirtualHost` 容器名称的 IP 地址，且没有 `ServerName` 指令，Apache\
  \ 会在服务器启动时报错，提示它无法将 IP 地址映射到主机名。此报错并非致命错误。Apache 仍会运行，但该错误表明 DNS 配置可能需要某些调整，以便 浏览器能够找到你的服务器。你可以使用`完全限定域名`\
  \ (FQDN) 而不是 IP 地址作为 `VirtualHost` 容器名称和 `Listen` 指令的绑定（如果该域名在 DNS 中解析为在机器上配置的 IP\
  \ 地址，且 Apache 可以绑定到它）。\n\n## 基于名称的虚拟主机\n\n为了减少虚拟主机对 IP 地址的消耗，HTTP/1.1 协议版本引入了 `Host`\
  \ 请求头，它允许浏览器指定请求指向的精确主机。这使得多个主机名可以共享同一个 IP 地址。现在的大多数浏览器都支持 HTTP/1.1。\n\n> 注意：除非在严格控制的情况下，否则你不能对基于名称的虚拟主机使用\
  \ SSL。更多信息请参见 [`httpd.apache.org/docs/2.4/ssl/ssl_faq.html#vhosts`](http://httpd.apache.org/docs/2.4/ssl/ssl_faq.html#vhosts)。不过，你可以在基于\
  \ IP 的虚拟主机使用 SSL。\n\n列表 29.1 显示了来自 Mozilla Firefox 浏览器的一组典型请求头。如果 URL 中输入了端口号，它也将成为\
  \ `Host` 请求头内容的一部分。\n\n**列表 29.1** 请求头\n\n点击此处查看代码图像\n\n```\nGET / HTTP/1.1\nAccept:\
  \ image/gif, image/x-xbitmap, image/jpeg, image/pjpeg, */*\nAccept-Language: en-us\n\
  Accept-Encoding: gzip, deflate\nMozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/535.7\
  \ (KHTML, like Gecko)\n  Chrome/16.0.912.75 Safari/535.7\nHost: host1.example.com\n\
  Connection: Keep-Alive\n```\n\nApache 使用 `Host:` 头来处理多个主机名共享单个 IP 地址的配置——即本章前面概述的多对一场景——因此描述为`基于名称的虚拟主机`。\n\
  \n在 Apache 2.4 之前，使用 `NameVirtualHost` 指令可以让你指定 IP 地址和端口组合，服务器通过这些组合接收基于名称的虚拟机的请求。在\
  \ Apache 2.2 及之前的版本中，这是基于名称的虚拟机的强制指令。\n\n> 注意：如果你正在使用 Apache 2.4，则不需要 `NameVirtualHost`\
  \ 指令；相反，只需确保在 `VirtualHost` 容器中匹配了正确的 IP 和 `ServerName` 即可。\n\n列表 29.2 显示 Apache\
  \ 根据 `Host` 头的内容将所有连接调度到 192.168.128.10。\n\n**列表 29.2** 基于名称的虚拟主机\n\n点击此处查看代码图像\n\
  \n## 仅在预 Apache 2.4 时代使用 NameVirtualHost\n\n```\nNameVirtualHost 192.168.128.10\n\
  Listen 192.168.128.10:80\n<VirtualHost 192.168.128.10>\n    ServerName host1.example.com\n\
  \    DocumentRoot /usr/local/apache2/htdocs/host1\n</VirtualHost>\n<VirtualHost\
  \ 192.168.128.10>\n    ServerName host2.example.com\n    DocumentRoot /usr/local/apache2/htdocs/host2\n\
  </VirtualHost>\n```\n\n对于每一个解析到 192.168.128.10 的主机名，Apache 都可以支持另一个基于名称的虚拟主机。如果针对该\
  \ IP 地址的请求对应的主机名未包含配置文件中，例如 [host3.example.com](http://host3.example.com)，Apache\
  \ 仅会将该请求关联到配置文件中的第一个容器；在这种情况下，即 [host1.example.com](http://host1.example.com)。对于未带有\
  \ `Host` 头的请求也采用相同的行为：配置文件中的第一个容器将接收该请求。\n\n来自 `example.com` 域名的终端用户可能将其机器设置为 `example.com`\
  \ 为默认域名。在这种情况下，他可能会将浏览器直接到 [`host1/`](http://host1/) 而不是完全限定的 [`host1.example.com/`](http://host1.example.com/)。`Host`\
  \ 头将仅包含 `host1` 而不是 [host1.example.com](http://host1.example.com)。为了确保正确的虚拟主机容器接收请求，你可以使用\
  \ `ServerAlias` 指令，如列表 29.3 所示。\n\n**列表 29.3** ServerAlias\n\n点击此处查看代码图像\n\n```\n\
  NameVirtualHost 192.168.128.10\nListen 192.168.128.10:80\n<VirtualHost 192.168.128.10>\n\
  \    ServerName host1.example.com\n    DocumentRoot /usr/local/apache2/htdocs/host1\n\
  </VirtualHost>\n<VirtualHost 192.168.128.10>\n    ServerName host2.example.com\n\
  \    DocumentRoot /usr/local/apache2/htdocs/host2\n</VirtualHost>\n```\n\n事实上，你可以为\
  \ `ServerAlias` 提供一个空格分隔的列表，包含可能出现在 `Host` 头中的其他名称，这样就不需要单独的 `VirtualHost` 容器。HTTP/1.1\
  \ 强制使用 `Host` 头。在基于名称的虚拟主机早期，`Host` 头被视为一种权衡：不发送 `Host` 头的旧浏览器仍然在使用。\n\n对于每一个解析到\
  \ 192.168.128.10 的主机名，Apache 都可以支持另一个基于名称的虚拟主机。来自 `example.com` 域的终端用户可能将其机器设置为\
  \ `example.com` 为其默认域名。在这种情况下，他可能会将浏览器直接到 [`host1/`](http://host1/) 而不是完全限定的 [`host1.example.com/`](http://host1.example.com/)。`Host`\
  \ 头将仅包含 `host1` 而不是 [host1.example.com](http://host1.example.com)。为了确保正确的虚拟主机容器接收请求，你可以使用\
  \ `ServerAlias` 指令，如列表 29.3 所示。\n\n**列表 29.3** ServerAlias\n\n```\nNameVirtualHost\
  \ 192.168.128.10\nListen 192.168.128.10:80\n<VirtualHost 192.168.128.10>\n    ServerName\
  \ host1.example.com\n    DocumentRoot /usr/local/apache2/htdocs/host1\n</VirtualHost>\n\
  <VirtualHost 192.168.128.10>\n    ServerName host2.example.com\n    DocumentRoot\
  \ /usr/local/apache2/htdocs/host2\n</VirtualHost>\n```\n\n## 批量虚拟主机\n\n在之前的列表中，`DocumentRoot`\
  \ 指令遵循简单的模式：\n\n点击此处查看代码图像\n\n```\nDocumentRoot /usr/local/apache2/htdocs/hostname\n\
  ```\n\n其中 `hostname` 是 `ServerName` 中使用的 FQDN 的主机部分。对于少数虚拟主机，这种配置是可以的。但如果有几十、上百个这样的虚拟主机呢？配置文件将变得难以维护。Apache\
  \ 通过 `mod_vhost_alias` 为批量虚拟主机提供了一个很好的解决方案。你可以使用 `VirtualDocumentRoot` 指令中的模式匹配规则配置\
  \ Apache 将虚拟主机请求映射到不同的内容树。此功能对于希望为每个用户提供虚拟主机的互联网服务提供商 (ISP) 特别有用。以下示例提供了一个简单的虚拟主机配置：\n\
  \n点击此处查看代码图像\n\n```\nVirtualDocumentRoot /usr/local/apache2/htdocs/%1\n```\n\n示例\
  \ `VirtualDocumentRoot` 中使用的 `%1` 令牌将被替换为 FQDN 的第一部分。`mod_vhost_alias` 指令有一种语言，可以将\
  \ FQDN 组件映射到文件系统位置，包括 FQDN 内部的字符。\n\n如果消除了所有的 `VirtualHost` 容器并将我们的配置简化为所示，服务器将为\
  \ `/usr/local/apache2/htdocs` 目录下的任何子目录提供服务。如果 FQDN 的主机部分匹配为子目录，Apache 在翻译请求时会在那里查找内容。\n\
  \n尽管虚拟主机通常会从主服务器上下文继承指令，但某些指令（例如 `Alias` 指令）不会传递。例如，虚拟主机不会继承此文件系统映射：\n\n点击此处查看代码图像\n\
  \n```\nAlias /icons /usr/local/apache2/icons\n```\n\n\n\n\n\n以下代码所示的 `VirtualScriptAlias`\
  \ 指令将对 `/cgi-bin` 下任何资源的请求视为包含 CGI 脚本：\n\n点击此处查看代码图像\n\n# 仅在 Apache 2.4 之前使用 NameVirtualHost\n\
  \n```\nNameVirtualHost 192.168.128.10\nListen 192.168.128.10:80\nVirtualDocumentRoot\
  \ /usr/local/apache2/htdocs/%1/docs\nVirtualScriptAlias /usr/local/apache2/htdocs/%1/cgi-bin\n\
  ```\n\n注意，`cgi-bin` 是该指令的一个特殊标记；将目录直接命名为 `cgi` 是不起作用的；必须是 `cgi-bin`。\n\n对于基于 IP\
  \ 的虚拟主机需求，这些指令有变体：`Virtual-DocumentRootIP` 和 `VirtualScriptAliasIP`。\n\n### 总结\n\
  \n本章提供了有关影响扩展性和性能的 Apache 和操作系统设置信息。在大多数情况下，网站性能问题与动态内容生成和数据库访问有关。编写高效的脚本可以帮助缓解这些类别中的问题。硬件相关的改进，如高质量的网络卡和驱动程序、增加内存以及磁盘阵列也可以提供增强的性能。\n\
  \n关于虚拟主机，你可以以多种方式配置 Apache 来处理虚拟主机。无论你需要大量的“模版化”虚拟主机、一组多样化的不同虚拟主机配置，还是由于你可使用的 IP\
  \ 地址有限，都有方法可以为你的应用程序配置 Apache。基于名称的虚拟主机是在不耗尽 IP 地址的情况下部署虚拟主机的常用技术。基于 IP 的虚拟主机是另一种方法，当你有足够的\
  \ IP 地址并希望保持配置整洁、实现 IP 地址与虚拟主机的一一平衡时使用。此外，如果你无法更改 DNS 配置，还可以为你的虚拟主机使用独立的端口号作为补救措施。\n\
  \n### 问答\n\n**Q. 我如何衡量我的网站是否足够快？**\n\n**A.** 许多开发者在本地或通过内部网络测试他们的网站，但如果你运行的是公共网站，很有可能你的很多用户将通过慢速连接访问它。尝试从拨号账户访问你的网站，并确保你的页面加载速度足够快，经验法是页面加载时间应在三秒以内。\n\
  \n**Q. 如何在保持服务连续的同时，将现有的基于名称的虚拟主机迁移到自己的机器？**\n\n**A.** 如果虚拟主机注定要移动到相邻机器（根据定义，机器不能具有相同的\
  \ IP 地址），则需要采取额外措施。常见的做法是执行以下操作，尽管这些步骤有许多变体：\n\n1. 将 DNS 映射的存活时间（`TTL`）设置成非常小的值。这会增加客户端查询主机名的频率。\n\
  2. 在旧主机上配置新 IP 地址的 IP 别名。\n3. 配置虚拟主机的内容，使其由基于名称和基于 IP 地址的虚拟主机共同提供。\n4. 在旧 IP 地址对虚拟主机的请求减少（由于\
  \ DNS 缓存过期的旧查询）后，迁移服务器。\n\n**Q. 我可以混合使用基于 IP 和基于名称的虚拟主机吗？**\n\n**A.** 可以。如果绑定了多个\
  \ IP 地址，你可以以不同的方式分配它们的使用。一组基于名称的虚拟主机可以关联到每个 IP 上；只需为每个 IP 使用单独的 `NameVirtualHost`\
  \ 指令（Apache 2.4 之前）或一组受控的 `ServerName` 指令即可。例如，一个 IP 可以专门作为 SSL 的基于 IP 的虚拟主机，而另一个\
  \ IP 则可以专门用于一组基于名称的虚拟主机。\n\n### 工作坊\n\n本工作坊旨在帮助你复习所学内容。\n\n### 测验\n\n**1.** 列举一些可能影响\
  \ Apache 性能的 Apache 设置。\n**2.** 列举一些可能限制扩展性和性能的操作系统设置。\n**3.** 列举一些提高性能的方法。\n**4.**\
  \ 在 `VirtualHost` 容器中，`ServerName` 指令是必需的吗？\n\n### 答案\n\n**1.** 可能影响性能的 Apache 设置包括\
  \ `Options` 指令的 `FollowSymLinks` 和 `SymLinksIfOwnerMatch` 参数、启用每个目录配置文件、主机名查询、拥有记分文件以及使用\
  \ `mod_status` 进行统计收集。\n**2.** 可能影响扩展性和性能的操作系统设置包括进程数量限制、打开的文件描述符限制以及每个进程允许的内存。\n\
  **3.** 以下是一些提高性能的建议：通过硬件负载均衡器或反向代理进行负载均衡、数据压缩、缓存、将文件映射到内存以及静态编译模块。\n**4.** 只有在使用基于名称的虚拟主机时，`VirtualHost`\
  \ 容器才需要 `ServerName` 指令。`Host` 头部的内容与 `ServerName` 指令的内容进行比较。\n\n## 第 30 章设置安全服务器\n\
  \n* *\n\n***在本章中你将学习：***\n\n- **SSL/TLS 协议族及其底层密码学概念**\n- **什么是安全证书以及如何创建和管理它们**\n\
  - **如何激活 Apache 模块 mod_ssl`\n\n* *\n\n本章介绍了如何设置能够处理安全交易的 Apache 服务器。如果你使用的是托管商的共享服务器空间，你无法访问这些配置选项；设置安全服务器的过程是特定于供应商的，通常不是你能完成的。然而，如果你拥有服务器的\
  \ root 权限，本章将教你安全服务器的基础知识。\n\n## 安全性\n\n若干类型的互联网相关交易需要高水平的安全。这些包括金融交易（如银行业务和电子商务），以及任何敏感信息的交换（如医疗记录和公司文档）。互联网上的安全交易需要三个主要要素：\n\
  \n- **机密性**——如果你正在传输或访问敏感信息（如信用卡号或个人病史），你绝对不想陌生人获取它。\n- **完整性**——传输的信息必须免受外部操纵——如果你在线下了一个购买\
  \ 100 股股票的订单，你不希望有人拦截并将其改为购买 1000 股的订单。\n- **身份验证**——你需要信任与你通信的组织或个人确实是他们所声称的。\n\
  \n### SSL 协议\n\nSSL 代表 *Secure Sockets Layer*（安全套接层），TLS 代表 *Transport Layer Security*（传输层安全）。这两个协议族最初设计为\
  \ HTTP 交易提供安全性，但它们也可以用于许多其他  协议，如 `IMAP`（互联网消息访问协议）和 `NNTP`（网络新闻传输协议）。运行在 SSL 之上的\
  \ HTTP 称为 *Secure HTTP*（安全 HTTP）。\n\n\n\n\n\nNetscape 在 1994 年发布了 SSL 2 版本，并在 1995\
  \ 年发布了 SSL 3 版本。TLS 是 IETF（互联网工程任务组）的标准，旨在将 SSL 标准化为一种互联网协议，但它只是对 SSL 3 版本的修改，增加了少量功能并进行了细小的清理。TLS\
  \ 缩写是微软和 Netscape 针对协议命名进行争论的结果，因为每家公司都提出了了自己的名称。然而，这个名称并没有流行起来，大多数人简单地将这些协议称为 SSL。除非另有说明，本章的其余部分将\
  \ SSL/TLS 称为 `SSL`。\n\n你通过将 URI（统一资源标识符）协议部分中的 `http` 替换为 `https` 来指定你想使用 SSL 连接到服务器。基于\
  \ SSL 的 HTTP 默认端口是 443。\n\n接下来的章节将解释 SSL 如何满足前述的机密性、完整性和身份验证需求。你还将学习一些 SSL 核心的底层数学和密码原理。\n\
  \n## 解决机密性需求\n\nSSL 协议通过加密数据来保护数据。`Encryption`（加密）是将消息（即 `plaintext` 明文）转换为新的加密消息（即\
  \ `ciphertext` 密文）的过程。虽然明文所有人都可以阅读，但密文对于任何可能截获它的人来说都是完全不可见的。解密是相反的过程，它将密文转换回原始明文。\n\
  \n通常，加密和解密过程涉及一个额外信息：`key`（密钥）。如果发送者和接收者共享同一个密钥，则该过程被称为 `symmetric cryptography`（对称加密）。如果发送者和接收者拥有不同的互补密钥，则该过程称为\
  \ `asymmetric`（非对称或公钥加密）。\n\n### 对称加密\n\n如果加密和解密消息使用的密钥是同一个，该过程被称为对称加密。`DES`、`Triple\
  \ DES`、`RC4` 和 `RC2` 是用于对称密钥加密的算法。这些许多算法具有不同的密钥长度，以位为单位。通常，给定一个算法，密钥的位数越高，算法越安全，但由于执行算法的计算需求增加，运行速度也越慢。\n\
  \n与公钥加密相比，对称加密相对较，这将在下一节中解释。然而，对称加密有两个主要缺点：之一必须定期更换密钥，以避免让监听者获取使用相同密钥加密的大量材料。另一个问题是密钥分发问题：如何安全地将密钥交给每个参与方？这是对称加密最初的限制因素之一；该问题通过让人们定期带着装满密钥的箱子四处旅行得以解决。随后公钥加密出现了。\n\
  \n### 公钥加密\n\n公钥加密采取了与其对称前身不同的方法。它不是让双方共享同一个密钥，而是存在一对密钥：一个是公钥，另一个是私钥。公钥可以广泛分发，而所有者则对私钥保持保密。这两个密钥是\
  \ `complementary`（互补的）——使用其中一个密钥加密的消息只能通过另一个密钥解密。\n\n使用这种方法，任何想要向你发送安全消息的人都可以使用你的公钥对消息进行加密，确保只有私钥的所有者（即你）才能进行解密。即使监听者获取了公钥，他也无法解密发给你的通信。事实上，你希望公钥尽可能地可用，以便更多人能向你发送加密消息。公钥加密还可以用于提供消息完整性和身份验证。拥有公钥的人会将这些密钥放置在公钥服务器上，或者简单地将密钥发送给他们想要进行安全电子邮件交换的人。使用适当的软件工具（如\
  \ `PGP` 或 `GnuPG`），发送者根据接收者的公钥对发出的消息进行加密。\n\n只有私钥所有者才能解密发给她的消息这一断言意味着，根据目前的密码学知识和计算能力的可用性，仅凭暴力破解无法在合理的时间范围内破解加密；然而，如果底层算法或其实现存在缺陷，这种攻击是可能的。\n\
  \n> 注意\n> 公钥加密类似于分发许多完全相同的挂锁并保留主钥匙。任何想向你发送私密消息的人都可以通过将消息放在保险箱中，并使用其中一个挂锁（公钥）将其锁好，然后发送给你。只有你拥有相应的钥匙（私钥）来打开那个锁（解密消息）。\n\
  \nSSL 协议在初始握手阶段使用公钥加密来安全地交换对称密钥，然后这些密钥可以被用于加密通信。\n\n## 解决完整性需求\n\n数据完整性通过对消息内容进行特殊计算并将结果与消息本身存储在一起来维护。当消息到达目的地时，接收者会执行相同的计算并比较结果。如果消息内容发生了变化，计算结果将不同——你就会知道有人篡改了它。\n\
  \n摘要算法（Digest algorithms）执行的就是这一过程：创建消息摘要。`message digest`（消息摘要）是一种创建任意消息的固定长度表示的方法，它可以唯一地标识消息（类似于指纹）。良好的消息摘要算法至少在实际用途中应该是不可逆的且具有抗碰撞性的。`Irreversible`（不可逆）意味着无法从摘要中获取原始消息，而\
  \ `collision resistant`（抗碰撞）意味着任何两个不同的消息不具有相同的摘要。摘要算法的示例包括 `MD5`（Message Digest）和\
  \ `SHA`（Secure Hash）。\n\n然而，单凭消息摘要不能保证消息的完整性——攻击者可以同时更改文本*以及*消息摘要。`message authentication\
  \ codes`（消息认证码，简称 `MACs`）与消息摘要相似，但在过程中包含了一个共享秘密密钥。算法的结果取决于消息和所使用的密钥。由于攻击者无法获取密钥，他无法同时修改消息和摘要。`HMAC`（哈希消息认证码）是消息认证码算法的一个示例。\n\
  \nSSL 协议使用 MAC 码防止重放攻击并确保传输信息的完整性。\n\n## 解决身份验证需求\n\nSSL 使用证书来验证通信双方的身份。公钥加密可用于对消息进行数字签名。事实上，只需用你的私钥对消息进行加密，就能向接收者保证消息来自你。其他数字签名算法涉及先计算消息的摘要，然后对该摘要进行签名。\n\
  \n你可以确定创建这对公钥和私钥的人是发送消息的人，但你如何将该密钥与现实世界中你可以信任的人或组织联系起来呢？攻击者可能会冒充发送者的身份并分发另一个公钥，并声称它是合法的密钥。\n\
  \n\n\n\n可以通过数字证书来实现信任。`Digital certificates` 是包含公钥和其所有者信息（名称、地址等）的电子文档。为了使其有效，证书必须由受信任的第三方（`certification\
  \ authority`，或 `CA`）签名，由该机构证明这些信息是正确的。有许多不同类型的 `CAs`，将在本章稍后部分描述。其中一些是商业实体，为在互联网上开展业务的公司提供认证服务。提供内部认证服务的公司会创建其他\
  \ `CAs`。\n\n`CA` 保证证书中的信息是正确的，并且密钥确实属于该个人或组织。证书有有效期，可能会过期或被撤销。证书可以成链，以便对认证过程授权。例如，一个受信任的实体可以认证公司，而公司又可以负责认证自己的员工。\n\
  \n如果整个过程要有效且受信任，证书颁发机构必须在发布证书之前要求的个人和组织提供适当的身份证明。\n\n默认情况下，浏览器包含一组用于受信任证书颁发者的根证书。\n\
  \n### SSL 与证书\n\n定义证书的主要标准是 `X.509`，它针对互联网使用进行了适配。一个 `X.509` 证书包含以下信息：\n\n• `Issuer`——证书签名者的名称\n\
  • `Subject`——持有被认证密钥的个人\n• `Subject public key`——主体的公钥\n• `Control information`——此类数据，如证书有效的日期\n\
  • `Signature`——涵盖上述数据的签名\n\n你可以通过使用浏览器连接到安全服务器来检查真实的证书。如果连接成功，浏览器的状态栏将添加一个小锁图标或其他视觉提示。根据你使用的浏览器，你应该能够点击代表性图标来查看有关\
  \ SSL 连接和远程服务器证书的信息。在下面的示例中，检查了 `https://www.amazon.com/` 的 SSL 证书。你可以看到证书的发行者是\
  \ `VeriSign`（参见图 30.1）。页面及其资源能够无缝下载，因为 `VeriSign` 是受信任的证书颁发机构。\n\n![image](img/30fig01.jpg)\n\
  \n**图 30.1 在 [www.amazon.com](http://www.amazon.com) 使用的 SSL 证书。**\n\n在图 30.1 所示证书中，`Subject`\
  \ 是一个位于美国华盛顿州西雅图实体 `Amazon.com, Inc.`。该实体的通用名称是 `www.amazon.com`。\n\n### SSL 协议总结\n\
  \n你已经看到了 SSL 如何实现机密性、完整性和身份验证。如果整个过程要有效且受信任，证书颁发机构必须在发布证书之前要求的个人和组织提供适当的身份证明。\n\n\
  客户端和服务器建立 SSL 连接的过程涉及以下步骤（通常称为“握手”）：\n\n1. 客户端发起到服务器的连接。\n2. 服务器响应其证书。\n3. 客户端根据其根证书列表验证证书。\n\
  4. 客户端生成会话密钥并将其加密发送给服务器。\n5. 双方对会话密钥密钥。\n6. 所有通信都使用会话密钥进行加密。\n\n### 获取和安装 SSL 工具\n\
  \n默认情况下，浏览器包含一组用于受信任证书颁发者的根证书。定义证书的主要标准是 `X.509`，它针对互联网使用进行了适配。\n\n#### OpenSSL\n\
  \n如果你运行较新的 Linux 或 FreeBSD 发行版，系统中可能已经安装了 OpenSSL。如果你需要安装 OpenSSL，可以从 OpenSSL 网站下载源码。UNIX/Linux\
  \ 用户会发现 OpenSSL 的安装与其他系统工具类似，即使用会话密钥。\n\n下载文件后，将其解压并 `cd` 进入创建的目录（将以下命令中的 `-version`\
  \ 替换为你特定的当前 OpenSSL 版本）：\n\n```bash\ngunzip < openssl-version.tar.gz | tar xvf -\n\
  cd openssl-version\n```\n\n完整的安装说明可以在 `INSTALL` 文件中找到，但简而言之，`config` 脚本帮助你构建软件，随后是\
  \ `make` 和 `make install`。\n\n##### 对于 Windows 用户\n\nWindows 用户会发现目前没有免费分发的二进制文件。因此，Windows\
  \ 用户必须从源码编译 Apache 以来构建 `mod_ssl` 模块。`mod_ssl` 模块依赖于 OpenSSL 库，因此需要一个有效的 OpenSSL\
  \ 安装。\n\n#### `mod_ssl` Apache 模块\n\n过去，由于出口限制，Apache 的 SSL 扩展必须单独分发。目前，`mod_ssl`\
  \ 包含在 Apache 2.2 及以上版本中，但仅作为源码分发的一部分。虽然这对于 UNIX/Linux 用户来说不是问题，但 Windows 用户会发现他们必须从源码编译\
  \ Apache 来构建 `mod_ssl` 模块。\n\n\n\n\n在下载预编译的安装二进制执行文件时，请务必选择文件名中包含 `openssl` 的版本。例如，`httpd-2.2.22-win32-x86-openssl-0.9.8t.msi`\
  \ 是 Apache 2.2.22 的 Windows 安装程序名称。\n\n### 注意\n在写作时，Apache 2.4 还没有 Windows 二进制发行版。如果有，预计它将遵循此命名规范。\n\
  \n如果你想从源码编译 OpenSSL 和带有 `mod_ssl` 的 Apache，请参考 Apache 文档 [`httpd.apache.org/docs/2.4/platform/win_compiling.html`](http://httpd.apache.org/docs/2.4/platform/win_compiling.html)。再次强调，这些说明超出了本书的范围，但如果你选择该路径，它们将为你提供所需的所有信息。从源码编译的核心要求如下：\n\
  \n- 已安装的 OpenSSL 工具包\n- Microsoft Visual C++ 5.0 或更高版本\n- Windows Platform SDK\n\
  - `awk` 实用（`awk`、`gawk` 或类似工具）\n\n#### 对于 UNIX/Linux 用户\n第 3 章“安装和配置 Apache](#ch03.html_ch03)”中使用的源码分发已经包含了使用\
  \ `mod_ssl` 所需的文件。因此，UNIX/Linux 用户要使用 `mod_ssl`，只需要再次遵循 `configure` 和 `make/make\
  \ install` 过程，并在 `configure` 命令中添加以下内容：\n\n```\n--enable-ssl --with-ssl=/usr/local/ssl/\n\
  ```\n\n这假设你将 OpenSSL 安装在了列出的位置；如果它位于服务器上的另一个目录，只需替换上述命令中的位置即可。\n\n如果你将 `mod_ssl`\
  \ 静态编译进 Apache，可以通过执行以下命令来检查它是否存在，该命令会提供已编译模块的列表：\n\n```\n/usr/local/apache2/bin/httpd\
  \ -l\n```\n\n### 注意\n上述命令假设你将 Apache 安装在 `/usr/local/apache2` 目录下。\n\n如果 `mod_ssl`\
  \ 是作为动态加载模块编译的，则必须在 Apache 配置文件（`httpd.conf`）中添加或取消注释以下行：\n\n```\nLoadModule ssl_module\
  \ modules/libmodssl.so\n```\n\n当你完成对 `httpd.conf` 文件的修改后，重启 Apache 使更改生效。如果你在重启后查看\
  \ `error_log`，`mod_ssl` 将成为你服务器签名的一部分，如下：\n\n```\nApache/2.4.1 (Unix) mod_ssl/2.4.1\
  \ OpenSSL/0.9.8t PHP/5.4.0\n```\n\n### 管理证书\n安装并配置 OpenSSL 和 `mod_ssl` 之后，实现工作 SSL\
  \ 服务器的下一步是创建服务器证书。本节详细解释了如何使用 `openssl` 命令行工具创建和管理证书及密钥。如果你为电子商务网站使用 SSL，加密可以保护客户数据免受窃听，而证书允许客户验证你确实是你声称的身份。\n\
  \n### 注意\n示例引用 UNIX 版本的命令行程序 `openssl`。如果你在 Windows 下运行，你需要使用 `openssl.exe`，并将示例中的路径更改为反斜杠而非正斜杠。此外，如果你将\
  \ OpenSSL 安装在与此处列出的不同的目录中，只需在示例中替换该目录即可。\n\n#### 创建密钥对\n在创建证书请求之前，你必须有一对公钥/私钥。假设你想创建的证书的\
  \ FQDN 为 `www.example.com`。你可以通过执行以下命令创建密钥：\n\n```\nopenssl genrsa –des3 -out www.example.com.key\
  \ 1024\n```\n\n- `genrsa` 选项指示 OpenSSL 你想生成密钥对。\n- `-des3` 选项表示私钥应该被加密并受密码保护。\n\
  - `-out` 选项指示存储结果的位置。\n- `1024` 表示生成的密钥的位数。\n\n调用此命令的结果如下：\n\n```\nGenerating RSA\
  \ private key, 1024 bit long modulus\n..............++++++\n.......................++++++\n\
  e is 65537 (0x10001)\nEnter pass phrase for www.example.com.key:\n```\n\n如你所见，系统要求你提供密码；请选择一个安全的密码。密码对于保护私钥是必要的，每当你想启动服务器时都会被要求输入。\n\
  \n### 提示\n你可以选择不对密钥进行密码保护。这很方便，因为在重启期间不需要输入密码，但这是极不安全的。在任何情况下，你都可以在生成阶段省略 `-des3`\
  \ 选项或执行以下命令来取消密钥保护：\n\n```\nopenssl genrsa -out www.example.com.key 1024\n```\n\n\
  备份 `www.example.com.key` 文件是一个好主意。你可以通过以下命令了解密钥的内容：\n\n```\nopenssl rsa -in www.example.com.key\
  \ -text\n```\n\n#### 创建签名请求\n要让 CA 颁发证书，你必须提交签名请求。要创建请求，执行以下命令：\n\n```\nopenssl\
  \ req -new -key www.example.com.key -out www.example.com.csr\n```\n\n系统提示输入将包含证书的信息。你即将输入的内容被称为区分名称（Distinguished\
  \ Name 或 DN）。有很多字段，但你可以留一些空白：\n\n- Country Name（国家两位代码）[US]\n- State or Province\
  \ Name（州全称）[CA]\n- Locality Name（城市）[San Francisco]\n- Organization Name（组织名称）[Internet\
  \ Widgits Ltd]\n- Organizational Unit Name（部门名称）[]\n- Common Name（通用名称）[www.example.com]\n\
  - Email Address（电子邮件地址）[administrator@example.com]\n\nChallenge password []\nOptional\
  \ company name []\n\n`Common Name` 字段条目与访问你网站的用户输入的地址匹配非常。这是浏览器对远程服务器证书执行的检查之一。如果名称不匹配，浏览器将向用户发出不匹配的警告。\n\
  \n证书现在存储在 `www.example.com.csr` 中。你可以通过以下命令了解证书的内容：\n\n```\nopenssl req -noout -text\
  \ -in www.example.com.csr\n```\n\n现在可以将证书签名请求文件提交给 CA 处理。VeriSign、Thawte 和 Network\
  \ Solutions 是这些 CA，但有很多 CA 可供。你可以在它们的产品网站上了解有关 VeriSign、Thawte 和 Network Solutions\
  \ 的提交程序：\n\n- **VeriSign**—[http://www.verisign.com/ssl/]\n- **Thawte**—[http://www.thawte.com/ssl/web-server-ssl-certificates/]\n\
  - **Network Solutions**—[http://www.networksolutions.com/SSL-certificates/]\n\n\n\
  \n\n你也可以创建一个自签名证书。也就是说，你既是证书的颁发者，也是证书的主体。虽然这对于商业网站没有用，但它可以让你在测试 `mod_ssl` 的安装的同时，并在等待\
  \ CA 颁发官方证书期间拥有安全的 Web 服务器：\n\n点击此处查看代码图片\n\n```bash\nopenssl x509 -req -days 30\
  \ -in www.example.com.csr -signkey www.example.com.key -out www.example.com.cert\n\
  ```\n\n你需要将证书 `www.example.com.cert`（无论是 CA 返回的证书还是你的自签名证书）复制到 `/usr/local/ssl/openssl/certs/`，并将密钥复制到\
  \ `/usr/local/ssl/openssl/private/`。\n\n执行以下命令来保护你的密钥文件：\n\n```bash\nchmod 400 www.example.com.key\n\
  ```\n\n此命令使得仅 root 用户可以读取该密钥。\n\n### SSL 配置\n\n前面的章节介绍了 SSL 背后的（并非基础的）概念，你已经学习了如何生成密钥和证书。现在，你可以配置\
  \ Apache 以支持 SSL。正如你在本章早期学到的，`mod_ssl` 模块必须静态编译，或者如果你将其编译为可加载模块，则在 `httpd.conf`\
  \ 文件中必须存在 `LoadModule` 指令。\n\nApache 2.2 及更高版本带有一个专门用于运行 SSL 感知服务器的“extra”配置文件。要使用此额外文件，只需取消\
  \ `httpd.conf` 中该行的注释：\n\n```apache\nInclude conf/extra/httpd-ssl.conf\n```\n\n\
  接下来，修改 `httpd-ssl.conf` 中的标准配置片段，当然，要将信息替换为你自己的：\n\n点击此处查看代码图片\n\n```apache\nUseCanonicalName\
  \ On\n<VirtualHost www.example.com:443>\n  ServerName www.example.com\n  SSLEngine\
  \ on\n  SSLCertificateFile /usr/local/ssl/openssl/certs/www.example.com.cert\n \
  \ SSLCertificateKeyFile /usr/loca/ssl/openssl/certs/www.example.com.key\n</VirtualHost>\n\
  ```\n\n此片段配置了一个新的虚拟主机，它将监听 443 端口（HTTPS 的默认端口）；你通过 `SSLEngine` 指令在该虚拟主机上启用 SSL。`SSLCertificateFile`\
  \ 和 `SSLCertificateKeyfile` 指令指明了服务器证书以及包含关联密钥的文件的位置。\n\n### 启动服务器\n\n之前的 Apache\
  \ 版本要求在你想要以安全模式启动 Apache 时执行 `apachectl startssl` 命令。然而，考虑到上一节定义的配置方法，以安全模式启动 Apache\
  \ 与不带 SSL 启动 Apache 无异：执行 `apachectl start` 命令。只要按照前面的说明通过指令在 `httpd.conf` 中包含了\
  \ `httpd-ssl.conf` 文件，Apache 就会启动启用 SSL 的服务器。如果你的服务器已经在运行并重启，如果密钥受密码保护，系统会提示你输入密码。在输入正确的密码后，Apache\
  \ 将启动，你应该能够使用 https://www.example.com/ URL 安全地连接到它。当然，请替换为你自己的域名。如果你无法成功启动服务器，请检查\
  \ Apache 错误日志以寻找可能出现问题的线索。例如，如果你无法绑定到端口，请确保没有另一个 Apache 实例已经在运行。你必须拥有管理员权限才能绑定到端口\
  \ 443。\n\n### 总结\n\n本章解释了 SSL 协议和 `mod_ssl`（实现 SSL 支持的 Apache 模块）的基础知识。你介绍了安装和配置\
  \ OpenSSL 以及 `mod_ssl`，以及如何使用 `openssl` 命令行工具进行证书和密钥的生成与管理。你可以访问 [`httpd.apache.org/docs/2.4/mod/mod_ssl.html`](http://httpd.apache.org/docs/2.4/mod/mod_ssl.html)\
  \ `mod_ssl` 参考文档获取深入的语法说明和额外的配置信息。请记住，SSL 只是维护安全服务器的一部分，还包括应用安全补丁、操作系统配置、访问控制、物理安全等。\n\
  \n### 问答\n\n**Q. 我可以在基于名称的虚拟主机中使用 SSL 吗？**\n\n**A.** 经常出现一个问题是如何让基于名称的虚拟主机支持 SSL。答案正如\
  \ 第 29 章 中提到的“Apache 性能调优与虚拟主机” 所述，你目前不能。基于名称的虚拟主机依赖于 HTTP 请求的 `Host` 头，但证书验证发生在\
  \ SSL 连接建立时，此时无法发送任何 HTTP 请求。有一种协议可以将现有的 HTTP 连接升级到 TLS，但目前大多数浏览器都不支持该协议（参阅 RFC\
  \ 2817，地址为 [`www.rfc-editor.org/rfc/rfc2817.txt`](http://www.rfc-editor.org/rfc/rfc2817.txt)）。\n\
  \n**Q. 我可以在其他协议中使用 SSL 吗？**\n\n**A.** `mod_ssl` 模块将 SSL 协议实现为过滤器。使用相同 Apache 服务器的其他协议可以轻松利用\
  \ SSL。\n\n### 工作坊\n\n工作坊旨在帮助你回顾所学内容。\n\n#### 测验\n\n1. 列出三个确保安全运行的要求。\n2. 如何启动 SSL\
  \ 实例？\n\n#### 答案\n\n1. 机密性、完整性和身份验证。\n2. 只要通过指令在 `httpd.conf` 中包含了 `httpd-ssl.conf`\
  \ 文件，并执行 `apachectl start` 命令。\n\n## 第 31 章：优化与调优 MySQL\n\n* *\n\n***在本章中，你将学习到：***\n\
  \n- MySQL 服务器的基础硬件和软件优化技巧\n- MySQL 服务器的关键启动参数\n- 如何使用 `OPTIMIZE TABLE` 命令\n- 如何使用\
  \ `EXPLAIN` 命令\n- 如何使用 `FLUSH` 命令清理表、缓存和日志文件\n- 如何使用 `SHOW` 命令检索数据库、表和索引的信息\n- 如何使用\
  \ `SHOW` 命令查找系统状态\n\n* *\n\n对 MySQL 服务器进行适当的维护将使其运行顺畅且无故障。系统的优化由硬件维护和软件调优组成。\n\n\
  * *\n\n> 注意\n\n关于维护和管理 MySQL 服务器的其他方法，请考虑 MySQL Workbench 产品。你可以在 [`www.mysql.com/products/workbench/`](http://www.mysql.com/products/workbench/)\
  \ 获取此功能图形界面的信息和截图。\n\n## 构建优化平台\n\n设计结构良好、规范化的数据库模式只是优化拼图的一部分（尽管很重要的一部分）。另一部分是构建和调优托管数据库的服务器。考虑服务器的四个主要组件：CPU、内存、硬盘和操作系统。这些组件中的每一个都必须跟上速度，否则无论设计或编程都无法让数据库变快：\n\
  \n- **CPU**——CPU 越快，MySQL 处理数据就越快。这没有真正的秘密，但 3.0GHz 的处理器比 1.0GHz 的处理器快得多。随着处理器速度不断提高且价格合理，获得高性价比并不困难。\n\
  - **内存**——在你的机器中安装尽可能多的内存。内存永远不嫌多，而且内存很廉。充足的内存可以平衡缓慢的 CPU。\n\n\n\n\n- **硬盘**——合适的硬盘应该既足够大又足够快，以能够容纳你的数据库服务器及其流量。硬盘速度的一个重要衡量标准是其\
  \ `seek time`（寻道时间），即硬盘旋转并找到特定信息所需的时间。寻道时间以毫秒为单位，桌面级硬盘的平均磁盘寻道时间约为 8 或 9 毫秒，服务器则约为\
  \ 3 到 5 毫秒。购买硬盘时，确保它足够大以容纳你最终存储在数据库中的所有数据，并且速度足够快可以快速找到它们。\n\n- **操作系统**——如果你使用的操作系统是一个资源消耗大户（例如，`Windows`），你有两个选择：购买足够的资源以至于这个问题变得无关紧要，或者使用一个不会耗尽你所有资源的操作系统。\n\
  \n无论你是自己购买这些组件来组装机器，还是为定制化服务器购买托管解决方案进行购物，只要你在系统层面上将正确的组件组合在一起，就已经向整体服务器优化迈出了几步。\n\
  \n注意\n\n`MySQL` 表类型的选择——`MyISAM` 或 `InnoDB`——也是一种优化选项。根据你的选择，你将获得各种额外的优化支持。我建议查看\
  \ `MySQL` 手册（`http://dev.mysql.com/doc/refman/5.5/en/optimization.html`）中针对特定表的优化技巧，以及\
  \ `MySQL` 性能博客（http://www.mysqlperformanceblog.com/）。\n\n### 对你的数据库服务器进行基准测试\n\n\
  你可以使用 `benchmark()` `MySQL` 函数对服务器速度进行快速测试，以查看处理给定表达式需要多久。例如，你可以将测试表达式设为简单的内容，如\
  \ `10+10`，或者复杂的内容，例如提取日期部分并进行高级计算。\n\n无论表达式的结果如何，`benchmark()` 的结果始终为 0。`benchmark()`\
  \ 的目的不是获取表达式的结果，而是为了查看重复特定次数该表达式需要多长时间。例如，以下命令执行了一百万次表达式 `10+10`：\n\n```sql\nselect\
  \ benchmark(1000000,10+10);\n```\n\n该命令在我其中一个测试系统上的执行结果如下：\n\n```\n+--------------------------+\n\
  | benchmark(1000000,10+10) |\n+--------------------------+\n|                  \
  \     0 |\n+--------------------------+\n1 row in set (0.04sec)\n```\n\n该命令同样执行了一百万次日期提取表达式：\n\
  \n点击此处查看代码图片\n\n```sql\nselect benchmark(1000000, extract(year from now()));\n```\n\
  \n该命令在我其中一个测试系统上的结果如下：\n\n点击此处查看代码图片\n\n```\n+----------------------------------------------+\n\
  | benchmark(1000000, extract(year from now())) |\n+----------------------------------------------+\n\
  |                                            0 |\n+----------------------------------------------+\n\
  1 row in set (0.09sec)\n```\n\n重要的数字是秒单位的时间，即函数执行的经过时间；第一个测试花费了 0.04 秒，第二个花费了 0.09\
  \ 秒。你可能想在一天中的不同时间（当服务器处于不同负载时）多次运行相同的 `benchmark()`，以便更好地了解服务器的性能情况，并尝试一些比这些简单示例让服务器处理更沉重的基准测试。\n\
  \n### MySQL 启动选项\n\n`MySQL` 管理员可以微调大量的服务器参数，其中许多普通用户永远都不需要使用。坦率地说，如果你在虚拟主机环境中运行\
  \ `MySQL`，除了请求更改服务器设置外，你无法使用这些信息。为了不让你被信息完全淹没，本节仅包含用于精细调优 `MySQL` 服务器的常用启动选项。\n\n\
  注意\n\n你可以在 `MySQL` 手册（http://dev.mysql.com/doc/refman/5.5/en/server-system-variables.html）中阅读更多内容。\n\
  \n当你启动 `MySQL` 时，会加载名为 `my.cnf` 的配置文件。该文件包含了从端口号到缓冲区大小等信息，但可以被命令行启动选项覆盖。\n\n在 `MySQL`\
  \ 安装目录的 `support-files` 子目录中（或 Windows 上的安装目录本身），你会找到示例配置文件，每个文件都针对特定的已内存范围进行了调优：\n\
  \n- `my-small.cnf`——适用于 RAM 少于 64MB 偶尔使用 `MySQL` 的系统。\n- `my-medium.cnf`——适用于 RAM\
  \ 为 64MB 到 128MB 的系统。\n- `my-large.cnf`——适用于 RAM 为 128MB 到 512MB 的系统。\n- `my-huge.cnf`——适用于\
  \ RAM 为 1GB 到 2GB 的系统。\n\n#### 关键启动参数\n\n两个主要参数对影响最大：`key_buffer_size` 和 `table_cache`。\n\
  \n`key_buffer_size` 的值是缓冲区的大小。缓冲区越大，SQL 命令完成得越快。检查缓冲区实际性能的简单方法是检查四个变量：`key_read_requests`、`key_reads`、`key_write_requests`\
  \ 和 `key_writes`。你可以通过执行 `SHOW STATUS` 命令找到这些变量的值。\n\n返回的是长变量列表，按字母顺序排列。找到类似下面的行：\n\
  \n```\n+----------------------++\n| Key_read_requests     |      1012771 |\n+----------------------++\n\
  | Key_reads             |          9326 |\n+----------------------++\n| Key_write_requests\
  \    |        48487 |\n+----------------------++\n| Key_writes            |    \
  \      2287 |\n+----------------------++\n```\n\n如果你将 `key_reads` 的值除以 `key_read_requests`\
  \ 的值，结果应小于 0.01。同样，如果你将 `key_writes` 的值除以 `key_write_requests` 的值，结果应小于 1。使用之前的值的结果分别为\
  \ 0.000915861721998 和 0.047167281951863；都在接受范围内。\n\n另一个重要的服务器参数是 `table_cache`，它是所有线程打开的表数量。默认值为\
  \ 64，但你可能需要调整这个数字。通过 `SHOW STATUS` 命令，在输出中查找名为 `open_tables` 的变量。如果这个数字很大，则应该增加\
  \ `table_cache` 的值。\n\n\n\n\nMySQL 安装程序附带的示例配置文件使用了 `key_buffer_size` 和 `table_cache`\
  \ 的各种组合。你可以将这些组合作为你任何需要修改的基准。每当你修改配置时，都必须重启服务器才能使更改生效——有时在并不不知道更改后果的情况下进行。在这种情况下，务必在将更改应用到生产环境之前，在开发环境中尝试你的修改。\n\
  \n### 优化你的表结构\n\n优化的表结构不同于设计良好的表。表结构优化涉及在删除后回收未使用的空间，并在进行结构修改后对表进行基本清理。`OPTIMIZE\
  \ TABLE SQL` 命令负责处理此工作，其语法如下：\n\n```\nOPTIMIZE TABLE table_name[,table_name]\n```\n\
  \n例如，如果你想优化 `testDB` 数据库中的 `grocery_inventory` 表，请使用：`OPTIMIZE TABLE grocery_inventory`。你可能会看到显示为“OK”的状态消息，或者显示“Table\
  \ does not support optimize, doing recreate + analyze instead”（表不支持优化，正在改为重建+分析）。这两种都是好的，因为结果是相同的——你的表已经优化。\n\
  \n请注意，表在优化期间会被锁定，因此如果你的表很大，请在计划的停机时间或系统流量较小时执行优化。\n\n### 优化你的查询\n\n查询优化与索引的恰当使用有关。`EXPLAIN`\
  \ 命令检查给定的 `SELECT` 语句，以查看它是否已经尽可能地进行了优化，并尽可能在地方使用了索引。在查看涉及 `JOIN` 的复杂查询时，这被证明是尤为有用的。`EXPLAIN`\
  \ 的语法如下：\n\n```\nEXPLAIN SELECT statement\n```\n\n`EXPLAIN` 命令的输出是一个包含以下列的信息表：\n\
  \n- `id`—选择标识符 ID。\n- `select_type`—`SELECT` 语句的类型，共有几种类型。\n- `table`—表名。\n- `type`—连接类型，共有几种类型。\n\
  - `possible_keys`—此列指示 MySQL 可以使用哪些索引来查找此表中的行。如果结果为 `NULL`，则没有索引可以帮助此查询。此时，你应该查看你的表结构，看看是否可以创建任何可以提高此查询性能的索引。\n\
  - `key`—此查询中实际使用的键，如果没有使用索引，则为 `NULL`。\n- `key_len`—使用的键的长度，如果有的话。\n- `ref`—与 `key`\
  \ 一起用于检索结果的任何列。\n- `rows`—MySQL 执行查询必须检查的行数。\n- `Extra`—关于 MySQL 如何执行查询的附加信息。有几种选项，例如\
  \ `Using index`（使用了索引）和 `Where`（使用了 `WHERE` 子句）。\n\n对于“选择所有”（select all）查询，你所做的优化不多，除非添加一个带有主键的\
  \ `WHERE` 子句。此时 `possible_keys` 列将显示 `PRIMARY`，`Extra` 列将显示 `Where`。\n\n在对涉及 `JOIN`\
  \ 的语句使用 `EXPLAIN` 时，衡量查询优化的一种快速方法是查看 `rows` 列中的值。假设你的结果是 2 和 1；将这些数字相乘，你的答案就是 2。这是\
  \ MySQL 为了产生查询结果必须查看的行数。你希望这个数字越低越好，而 2 已经是最低了。\n\n关于 `EXPLAIN` 命令的更多信息，请访问 MySQL\
  \ 手册：[`dev.mysql.com/doc/refman/5.5/en/using-explain.html`](http://dev.mysql.com/doc/refman/5.5/en/using-explain.html)。\n\
  \n### 使用 `FLUSH` 命令\n\n拥有特定数据库 reload 权限的用户可以使用 `FLUSH` 命令来清理 MySQL 使用的内部缓存。通常，只有\
  \ root 级用户具有发布 `FLUSH` 等管理命令的权限。\n\n`FLUSH` 的语法如下：\n\n```\nFLUSH flush_option\n\
  ```\n\n`FLUSH` 命令有九种不同的选项，以下是最常见的几种：\n\n- `PRIVILEGES`\n- `TABLES`\n- `HOSTS`\n\
  - `LOGS`\n\n你曾在添加新用户后使用过 `FLUSH PRIVILEGES` 命令。该命令仅是重新加载你的 MySQL 数据库中的权限表，使更改在不停止和重启\
  \ MySQL 的情况下生效。当你发布 `FLUSH PRIVILEGES` 命令时，`Query OK` 响应确保了清理过程顺顺利完成的。例如，该过程在命令行界面中看起来如下：\n\
  \n```\nmysql> FLUSH PRIVILEGES;\n\nQuery OK, 0 rows affected (0.10 sec)\n```\n\n\
  `FLUSH TABLES` 命令关闭所有当前打开或正在使用的表，基本上在你的 MySQL 服务器重新开始工作之前提供几毫秒的喘息。当你的缓存为空时，MySQL\
  \ 可以更好地利用可用内存。再次，你正在寻找 `Query OK` 响应：\n\n```\nmysql> FLUSH TABLES;\n\nQuery OK,\
  \ 0 rows affected (0.21 sec)\n```\n\n`FLUSH HOSTS` 命令专门用于主机缓存表。如果你无法连接到你的 MySQL\
  \ 服务器，常见原因是特定主机的最大连接数已达到，并抛出错误。当 MySQL 看到连接出现大量错误时，它假设出现了问题并阻止任何额外的连接。`FLUSH HOSTS`\
  \ 命令重置此过程并再次允许：\n\n```\nmysql> FLUSH HOSTS;\n\nQuery OK\n```\n\n`FLUSH LOGS` 命令关闭并重新打开所有日志文件。如果日志文件变成了一种负担，并且你需要一个新的，此命令会创建一个新的日志文件。在一个文件中筛选一年的日志条目是一项工程，所以尝试每月刷新一次日志：\n\
  \n```\nmysql> FLUSH LOGS;\n\nQuery OK, 0 rows affected (0.04 sec)\n```\n\n关于 `FLUSH`\
  \ 的更多信息，请访问 MySQL 手册：[`dev.mysql.com/doc/refman/5.5/en/flush.html`](http://dev.mysql.com/doc/refman/5.5/en/flush.html)。\n\
  \n### 使用 `SHOW` 命令\n\n`SHOW` 命令有多种用途，并产生大量关于你的 MySQL 数据库、用户和表的有用信息。根据你的权限，某些 `SHOW`\
  \ 命令对你不可用或仅提供极少的信息。root 级用户可以使用所有的 `SHOW` 命令并获得最全面的结果。`SHOW` 的常见用法包括以下，你很快就会详细学习：\n\
  \n```\nSHOW GRANTS FOR user\nSHOW DATABASES [LIKE something]\nSHOW [OPEN] TABLES\
  \ [FROM database_name] [LIKE something]\nSHOW CREATE TABLE table_name\nSHOW [FULL]\
  \ COLUMNS FROM table_name [FROM database_name] [LIKE something]\nSHOW INDEX FROM\
  \ table_name [FROM database_name]\nSHOW TABLE STATUS [FROM db_name] [LIKE something]\n\
  SHOW STATUS [LIKE something]\nSHOW VARIABLES [LIKE something]\n```\n\n`SHOW GRANTS`\
  \ 命令显示特定用户在特定主机上的权限。这是检查用户当前状态的简单方法，特别是当你有修改用户权限的请求时。通过 `SHOW GRANTS`，你可以先检查该用户是否已经拥有请求的权限。例如，检查我们在本书早期创建的\
  \ `joeuser` 用户的权限：\n\n```\nSHOW GRANTS FOR joeuser@localhost;\n```\n\n此查询的结果如下：\n\
  \n```\n+----------------------------------------------------------------\n| Grants\
  \ for joeuser@localhost                    |\n+----------------------------------------------------------------\n\
  | GRANT ALL PRIVILEGES ON *.* TO 'joeuser'@'localhost' IDENTIFIED|\n| BY  PASSWORD\
  \ ' *13883BDDBE566ECEFF0501CDE9B293303116521A'  |\n+----------------------------------------------------------------+\n\
  ```\n\n\n\n如果你不是 root 级用户或 `joeuser` 用户，你将收到错误；除非你是 root 级用户，否则你只能看到与你自己相关的信息。例如，`joeuser`\
  \ 用户不允许查看 root 级用户的信息：\n\n```\nSHOW GRANTS FOR root@localhost;\n```\n\n此查询将导致以下错误消息：\n\
  \n点击此处查看代码图像\n\n```\nERROR 1044: Access denied for user:'joeuser@localhost' to database\
  \ 'mysql'\n```\n\n在本章节的剩余部分，请注意你的权限级别。如果你不是 root 级用户，某些这些命令对你是不可用的，或者仅显示有限的信息。\n\
  \n以下是一些常用的 `SHOW` 命令；欲更多信息，请参阅 MySQL 手册 [`dev.mysql.com/doc/refman/5.5/en/show.html`](http://dev.mysql.com/doc/refman/5.5/en/show.html)。\n\
  \n### 获取数据库和表的信息\n\n在本书之前的章节中，你已经使用了一些基本的 `SHOW` 命令来查看 MySQL 服务器上的数据库和表列表。作为复习，`SHOW\
  \ DATABASES` 命令正是此用——它列出你 MySQL 服务器上所有的数据库。这里是一个结果示例：\n\n```\n+-------------------+\n\
  | Database          |\n+-------------------+\n| testDB            |\n| mysql   \
  \          |\n+-------------------+\n2 rows in set (0.00 sec)\n```\n\n在你选择了一个数据库进行操作后，你也可以使用\
  \ `SHOW` 来列出数据库中的表。此示例是在选择了 `testDB` 后运行 `SHOW DATABASES` 查询的结果。（你的表列表可能会有所不同。）\n\
  \n```\n+---------------------+\n| Tables_in_testDB   |\n+---------------------+\n\
  | grocery_inventory  |\n| email             |\n| master_name       |\n| myTest \
  \           |\n| testTable         |\n+---------------------+\n5 rows in set (0.01\
  \ sec)\n```\n\n如果你在 `SHOW TABLES` 命令中添加 `OPEN`，你将获得表缓存中所有表的列表，并显示它们被缓存和使用的次数：\n\n\
  ```\nSHOW OPEN TABLES;\n```\n\n结果看起来像这样：\n\n点击此处查看代码图像\n\n```\n+----------+-------------------+--------+-------------+\n\
  | Database | Table             | In_use | Name_locked |\n+----------+-------------------+--------+-------------+\n\
  | mysql    | procs_priv         | 0      | 0 |\n| mysql    | db                |\
  \ 0      | 0 |\n| mysql    | host              | 0      | 0 |\n| testdb   | grocery_inventory\
  \ | 0      | 0 |\n| mysql    | user              | 0      | 0 |\n| mysql    | tables_priv\
  \       | 0      | 0 |\n| mysql    | columns_priv      | 0      | 0 |\n+----------+-------------------+--------+-------------+\n\
  7 rows in set (0.00 sec)\n```\n\n将此信息与你在本章节之前学到的 `FLUSH TABLES` 命令结合使用，有助于保持数据库运行顺畅。如果\
  \ `SHOW OPEN TABLES` 显示表被缓存了多次但未使用，请尽管使用 `FLUSH TABLES` 来释放那部分内存。\n\n#### 获取表结构\n\
  \n一个非常有用的命令是 `SHOW CREATE TABLE`，它的作用正如其名；它向你显示用于创建特定表的 SQL 语句：\n\n```\nSHOW CREATE\
  \ TABLE grocery_inventory;\n```\n\n上述命令导致以下结果：\n\n点击此处查看代码图像\n\n```\n+--------------------+-----------------------------+\n\
  | Table              | Create Table                |\n|+--------------------+-------------------------------+\n\
  | grocery_inventory | CREATE TABLE 'grocery_inventory' (\n  'id' int(11) NOT NULL\
  \ auto_increment,\n  'item_name' varchar(50) NOT NULL default \"\",\n  'item_desc'\
  \ text,\n  'item_price' float NOT NULL default '0',\n  'curr_qty' int(11) NOT NULL\
  \ default '0',\n  PRIMARY KEY  ('id')\n  ) ENGINE=InnoDB DEFAULT CHARSET=latin1\n\
  +--------------------+-----------------------------+\n1 row in set (0.00 sec)\n\
  ```\n\n这本质上与你导出表架构（dump the table schema）时获得的信息相同，但如果你只是为了对特定的表创建语句进行提醒或简单参考，可以使用\
  \ `SHOW CREATE TABLE` 命令快速获取。\n\n如果你需要知道表的结构，但不一定需要创建它的 SQL，你可以使用 `SHOW COLUMNS`\
  \ 命令，如下：\n\n```\nSHOW COLUMNS FROM grocery_inventory;\n```\n\n此查询将产生类似的结果：\n\n点击此处查看代码图像\n\
  \n```\n+------------+-------------------+------+------+------+\n| Field      | Type\
  \        | Null | Key | Extra |\n+------------+-------------------+------+------+------+\n\
  | id         | int(11)     | NO   | PRI | auto_increment |\n| item_name  | varchar(50)\
  \ | NO   |     |             |\n| item_desc  | text        | YES  |     |      \
  \       |\n| item_price | float       | NO   |     |             |\n| curr_qty \
  \  | int(11)     | NO   |     |             |\n+------------+-------------------+------+------+------+\n\
  ```\n\n#### 注意\n\n`SHOW COLUMNS` 和 `DESCRIBE` 命令是彼此别名，因此的功能相同。\n\n#### 注意\n\n`SHOW\
  \ INDEX` 命令显示特定表中存在的所有索引信息。语法如下：\n\n点击此处查看代码图像\n\n```\nSHOW INDEX FROM grocery_inventory;\n\
  ```\n\n#### 注意\n\n另一个产生满结果的宽表的命令是 `SHOW TABLE STATUS` 命令，其语法如下：\n\n点击此处查看代码图像\n\n\
  ```\nSHOW TABLE STATUS FROM testdb LIKE 'grocery_inventory';\n```\n\n\n\n\n\n你可以在\
  \ MySQL 手册中找到 `SHOW STATUS` 变量的完整列表及其值的解释，地址为：[`dev.mysql.com/doc/refman/5.5/en/server-status-variables.html`](http://dev.mysql.com/doc/refman/5.5/en/server-status-variables.html)。\n\
  \n`SHOW VARIABLES` 命令产生 325 个结果，这些结果控制 MySQL 的常规运行，并包含以下有用的小知识：\n\n- `connect_timeout`—显示\
  \ MySQL 服务器在连接尝试期间放弃之前等待的秒数。\n- `max_connections`—在拒绝连接之前，允许同时到 MySQL 的最大连接数。\n\
  - `port`—MySQL 运行的端口。\n- `table_type`—MySQL 的表类型。\n- `version`—MySQL 版本号。\n\n你可以在\
  \ MySQL 手册中找到 `SHOW VARIABLES` 结果返回的变量完整列表及其值的解释，地址为：[`dev.mysql.com/doc/refman/5.5/en/show-variables.html`](http://dev.mysql.com/doc/refman/5.5/en/show-variables.html)。在了解已有的值后，你可以在\
  \ MySQL 配置文件或启动命令中更改它们。\n\n### 总结\n\n运行优化的 MySQL 服务器始于所使用的的硬件和操作系统。你的系统 CPU 应该足够快，并且你应该有足够的可用内存在\
  \ CPU 力不从心时填补空白。如果 MySQL 与进程（如 Web 服务器）共享资源，这一点尤为真实。\n\n此外，所使用的硬盘也很重要，因为较小的硬盘限制了你可以在数据库中存储的信息量。硬盘的寻道时间（seek\
  \ time）非常重要。缓慢的寻道会导致服务器整体性能变慢。你的操作系统不应该过度消耗，应该与 MySQL 共享资源，而不是自己占用所有资源。\n\nMySQL\
  \ 的一些关键启动参数是 `key_buffer_size` 和 `table_cache` 的值等。你可以在示例 MySQL 配置文件中找到基准值，也可以修改这些变量的值并观察服务器性能，以查看是否为你的环境找到了正确的结果。\n\
  \n除了硬件和软件优化之外，还有表以及 `SELECT` 查询的优化。使用 `OPTIMIZE` 命令进行表优化可以让你回收未使用的空间。你可以通过 `EXPLAIN`\
  \ 命令查看你的查询优化得如何（或如何）。输出结果显示了索引是否以及何时被使用，以及你是否可以使用任何索引来加速指定的查询。\n\n关注你的 MySQL 服务器可以确保它继续顺利运行。基础管理命令（如\
  \ `FLUSH` 和 `SHOW`）帮助你识别并快速修复潜在问题。所有这些命令的设计旨在为 MySQL 在高负载下提供几毫秒的的休息时间和喘息空间。大量的 `SHOW`\
  \ 命令显示有关数据库、表和索引的结构信息，以及系统的运行情况。\n\n### 问答\n\n**Q. MySQL 可以利用单台服务器上的多个 CPU 吗？**\n\
  \n**A. 完全可以。如果你的操作系统支持多个 CPU，MySQL 就会利用它们。然而，使用多处理器对 MySQL 的性能和调优取决于操作系统。\n\n**Q.\
  \ 使用 `OPTIMIZE` 命令需要什么种权限级别？**\n\n**A.** 任何对表拥有 `INSERT` 权限的用户都可以执行 `OPTIMIZE` 命令。如果用户只有\
  \ `SELECT` 权限，则 `OPTIMIZE` 命令将不会执行。\n\n### 工作坊\n\n该工作坊旨在帮助你回顾所学内容，并开始学习如何将知识付诸实践。\n\
  \n#### 验测\n\n**1.** 哪个 MySQL 函数允许你多次运行一个表达式以找到迭代的速度？\n\n**2.** 哪个 SQL 命令可以清理你的表结构？\n\
  \n**3.** 哪个 `FLUSH` 命令可以重置 MySQL 日志文件？\n\n**4.** 为了快速确定 MySQL 是否支持 InnoDB 表，你会使用\
  \ `SHOW STATUS` 还是 `SHOW VARIABLES`？\n\n**5.** 写一个 SQL 语句，让你能够看到创建名为 `myTable` 的表所使用的\
  \ SQL 语句。\n\n#### 答案\n\n**1.** `benchmark()` 函数\n\n**2.** `OPTIMIZE`\n\n**3.** `FLUSH\
  \ LOGS`\n\n**4.** `SHOW VARIABLES`\n\n**5.** `SHOW CREATE TABLE myTable`\n\n####\
  \ 活动\n\n**1.** 如果你拥有服务器的 root 级权限，更改 `key_buffer_size` 和 `table_cache` 的值，并在每次更改后运行\
  \ `benchmark()` 函数，以查看执行时间的差异。\n\n**2.** 对你在数据库中创建的所有表使用 `OPTIMIZE` 以清理任何结构问题。\n\
  \n**3.** 使用 `SHOW STATUS` 命令获取有关你的 MySQL 服务器的信息，然后发出 `FLUSH` 命令。\n\n## 第 32 章软件升级\n\
  \n* * *\n\n在本章中，你将学习以下内容：\n\n- 如何跟进最新软件\n- 如何进行 MySQL 版本升级\n- 如何进行 Apache 版本升级\n\
  - 如何进行 PHP 版本升级\n\n* * *\n\n在书中，你一直被提醒关注 PHP、Apache 和 MySQL，并留意更新。在这个简短的章节中，你学习如何在正常情况下更新已安装的软件，而不破坏系统。\n\
  \n## 保持动态\n\n你应该已经收藏了 Apache、PHP 和 MySQL 的网站。如果你访问网站的主要目的是获取更新信息，你可以始终订阅仅公告的邮件列表：\n\
  \n- 关于 PHP 通知，请访问 [`www.php.net/mailing-lists.php`](http://www.php.net/mailing-lists.php)\
  \ 并订阅公告列表。\n- 关于 MySQL 通知，请访问 [`lists.mysql.com/`](http://lists.mysql.com/) 并订阅\
  \ MySQL 列表。\n- 关于 Apache 通知，请访问 [`www.apache.org/foundation/mailinglists.html`](http://www.apache.org/foundation/mailinglists.html)\
  \ 并订阅 Apache 新闻公告列表。\n\n#### 何时升级\n\n正如第一部分](#part01.html_part01)，“入门与运行](#part01.html_part01)”（安装章节）所示，修订和小版本变化总在开发者认为需要时发生——而不是根据任何特定的计划。但仅仅因为发生了小版本变化，并不意味着你应该立即跑出去升级软件。然而，有时你应该尽快升级。\n\
  \n> **提示** \n> 软件发布通常遵循主.小.修订的格式；例如，PHP 5.4.0 是主版本 5、小版本 4、修订版 0。修订的变化在性质上确实是“微小的”，但该发布版本被称为修订。\n\
  \n\n\n\n\n你应当立即升级软件的主要场景是发布了安全修复。通常情况下，安全问题在被利用之前是不会发现的——有时是在测试环境中，但有时是由一个只想给世界制造麻烦的恶意用户发现的。在验证了安全问题后，你可以确定它将成为开发者修复的首要任务，很快你就会看到升级公告。当这种情况发生时，你应该立即升级，即使你没有使用导致安全问题的特定元素。漏洞就是漏洞。为什么要留它处于未覆盖的状态呢？\n\
  \n以下是 Apache 更新日志（changelog）的示例，记录了版本 2.0.61 和 2.0.63 之间发生的变更（版本 2.0.62 未向公众发布），这表明了需要升级：\n\
  \n点击此处查看代码图像\n\nSECURITY: CVE-2007-6388 (cve.mitre.org)\n\nmod_status: 确保刷新参数为数值，以防止因重定向到其他\
  \ URL 导致可能的 XSS 攻击。\n\n一个好的经验法是，如果更新日志中任何地方出现 `security` 一词，你就应该升级。在 PHP 5 的更新日志中（[`www.php.net/ChangeLog-5.php`](http://www.php.net/ChangeLog-5.php)），相关的修复被组合在一起，由于其重要性往往位于列表顶部。\n\
  \n然而，如果发布只是一个维护版本，意味着它包含了正常开发中的错误修复和改进，你可能不需要丢弃一切并升级。以下是 Apache 和 PHP 更新日志中维护项的一些示例：\n\
  \n点击此处查看代码图像\n\nmpm_winnt: 允许在 MaxClients 高于 257 时以更具响应的方式关闭服务器。\n\n修复 bug #43137\
  \ (`rmdir()` 和 `rename()` 不清除 `stat`)。\n\n如果列表中的变更与你的工作或环境无关，你可以将升级推迟到计划中的停机时间。例如，如果\
  \ PHP 维护发布中的所有错误修复都与你的平台有关，且你在 Linux 上运行 PHP，你可以轻松地放下这项任务。\n\n即使你不立即升级软件，保持在当前生产版本的几个修订内也是一个好主意。此之后，新功能的添加或修复的错误更有可能与你的工作相关。\n\
  \n### 升级 MySQL\n\n无论你使用 UNIX/Linux 还是 Windows，升级 MySQL 版本都是简单的：只要不存在其他版本。\n\n###\
  \ 注意\n在升级到新版本的 MySQL 之前，务必备份现有数据库。\n\n在同一版本内进行 MySQL 更新是非常简单的；5.4 是一个版本，5.5 是另一个版本，以此此类推。这意味着升级\
  \ 5.5.x 系列中的任何版本就像最初安装软件一样简单。对于 Windows 安装程序，这对你来说是不可见的，但确实发生了。从二进制发行安装的 UNIX/Linux\
  \ 用户只需在安装过程中将 `mysql` 符号链接到新的解压目录即可。\n\n如果你在升级过程中遇到问题，请参考 [`dev.mysql.com/doc/refman/5.5/en/upgrading.html`](http://dev.mysql.com/doc/refman/5.5/en/upgrading.html)\
  \ 中的故障排除提示。然而，在多个平台上升级 MySQL 小版本总是无痛苦的。\n\n### 注意\n如果在升级时更改了字符集，你必须运行以下命令来调整你的现有数据：\n\
  \n点击此处查看代码图像\n\n```bash\nmyisamchk -r -q --set-collation=new_collation_name\n```\n\
  \n### 升级 Apache\n\n与 MySQL 类似，升级或重建 Apache 遵循与最初安装相同的流程。Windows 用户受益于自动检测之前的版本、移除核心组件并安装新组件的安装程序。然而，Windows\
  \ 安装程序将保留现有配置文件。你需要负责升级任何特定版本的模块。\n\n对于 UNIX/Linux 用户，过程也遵循原始安装相同的路径。当你解压新发行版时，它会创建一个以新版本命名的目录。例如，如果你之前的版本是\
  \ 2.2.17 且正在升级到 2.4.1，你的目录将分别命名为 `httpd-2.2.17` 和 `httpd-2.4.1`。\n\nApache 的实际安装目录由你在运行\
  \ `configure` 脚本时决定，例如：\n\n```bash\n./configure --prefix=/usr/local/apache2\n```\n\
  \n运行 `configure` 脚本构建新版本的 Apache 后，像最初安装 Apache 时一样执行 `make` 和 `make install` 过程。\n\
  \n现在，如果你想直接在旧版本上安装新版本的 Apache，你可以这样做——即使旧的 `httpd` 二进制文件仍在运行。只需确保备份你的配置文件，以防出错。然而，如果你更倾向于在不同的目录中安装新版本，那也可以的；你只需要对新的\
  \ `httpd.conf` 进行所有适当的编辑。选择哪种方法取决于你。\n\n在 UNIX/Linux 上升级 Apache 后，你还应该重构你的 PHP 模块。Windows\
  \ 用户没有模块需要重建，但应该确保 `httpd.conf` 中仍然存在 PHP 相关的更改。\n\n### 在不升级的情况下修改 Apache\n\n假设你需要为\
  \ Apache 添加或删除功能，但不想升级到新版本。例如添加一个新模块或升级系统使用的 OpenSSL 版本。\n\n在这种情况下，UNIX/Linux 用户应该进入现有的源码目录（使用前面的示例中的\
  \ `httpd-2.2.17`），并输入 `make clean`。这本质上会重置 Makefile，以便你能够重建 Apache 而不依赖之前的缓存值。执行\
  \ `make clean` 命令后，使用新参数运行 `configure` 脚本，并再次执行 `make` 和 `make install` 过程。在这种情况下，你不需要重建\
  \ PHP 模块。\n\nWindows 用户通过取消注释 `httpd.conf` 中的相应行，或在这些行不存在时添加它们来激活预构建的模块。\n\n###\
  \ 升级 PHP\n\n鉴于 UNIX/Linux 用户可以通过各种构建选项为 PHP 添加这么多功能，你升级或修改 PHP 的频率可能高于 Apache 或\
  \ MySQL。无论你是升级到新的修订版本或小版本，还是仅仅添加功能（或移除不再需要的功能），修改现有版本的步骤与最初安装完全相同：`configure`、`make`、`make`。`make\
  \ install` 步骤将 PHP 模块放在 Apache 目录树适当的位置。在新模块到位后，重启 Apache——即可使用新版本的 PHP。\n\n当你将\
  \ PHP 升级到新版本时，解压发行包会得到一个完全不同的目录树，其取决于新版本号。在新目录结构内执行 `configure`、`make`、`make install`\
  \ 步骤将构建出一个独立的 PHP 模块。\n\n\n\n\nWindows 用户有一套不同的任务需要执行：向现有模块中添加新功能只需通过取消 `php.ini`\
  \ 中对应模块条目的注释来激活该模块，然后重启 Apache 即可。升级到新的小版本需要你下载一个新的发行文件。该文件的内容将解压到一个以其所代表的版本命名的目录中。然后，你必须按照安装所需的步骤操作，涉及\
  \ `php.ini` 的配置，因为每个版本产生的文件都不同。最后，更改 Apache `httpd.conf` 文件中任何 PHP 相关的路径名称并重启服务器。新版本的\
  \ PHP 应该就会被投入使用了。\n\n## 使用 PECL 和 PEAR 扩展 PHP\n\n你可以从 PECL（PHP 扩展社区库，地址为 [`pecl.php.net/`](http://pecl.php.net/)））和\
  \ PEAR（PHP 扩展和应用程序仓库，地址为 [`pear.php.net/`](http://pear.php.net/)）中获取丰富的用户创建的扩展和应用程序。这些网站受规则和样式指南的管理，因此你从这些网站下载的所有内容都是高水平的。\n\
  \n如果你正在为你的 PHP 安装寻找额外的扩展，请查看 PECL。如果你正在寻找可以集成到你的应用程序中的开源代码库，请查看 PEAR。\n\n### 总结\n\
  \n本简短章节为保持 MySQL、Apache 和 PHP 安装的更新提供了一些指南。你学习了去哪里查找更新，以及如何权衡升级到新版本的重要性。此外，你还学习了升级或修改\
  \ MySQL、Apache 和 PHP 的逐步流程。\n\n### 工作坊\n\n工作坊旨在帮助你回顾所学内容，并开始将知识付实践。\n\n### 测验\n\n\
  1.** 你如何描述主版本为 3、小版本为 4、修订版本为 14 的软件？\n\n2.** 认为升级到任何软件新小版本的主要原因是什么？\n\n3.** 用什么命令可以清理之前的\
  \ `makefiles` 和缓存设置？\n\n## 答案\n\n1.** 完整的版本号将是 3.4.14。\n\n2.** 开发者发现并修复的安全问题。\n\n\
  3.** `make clean` 命令。 \n\n## 活动\n\n当你读到这一章时，很有可能是 PHP、MySQL 和 Apache 中至少有一个或多个版本的版本号与你在\
  \ CD 盘中附带的、或者你在书初下载并安装的版本不同。因此，如果你有升级的权限（也就是说，如果你没有使用虚拟主机环境），只需选择其中一项（或多项）技术并完成升级过程即可。\n\
  \n## 第 33 章。使用应用程序框架\n\n***\n\n在本简短章节中，你将学习包括以下内容：\n\n• 什么是应用程序框架以及它如何能够帮助你\n• 软件架构中模型-视图-控制器（MVC）模式的原理\n\
  • 考虑并安装一些流行的 PHP 应用程序框架\n\n***\n\n本书已经教了你在网站内创建动态功能的基础知识，无论是用于增加功能或显示动态数据的单个脚本，还是以某种一致方式钩接以产生\
  \ Web 应用程序的一系列脚本。当你准备好转向更大的项目时，你可能想要使用他人肯定已经在其项目中使用过的功能，而你既没有时间也没有兴趣重复轮子，这时应用程序框架将成为你的新好朋友。\n\
  \n## 理解应用程序框架\n\n直击本质，应用程序框架无非一组库和模板，它们让你能够快速开发功能丰富的动态网站和 Web 应用程序，而无需从头构建每一个拼图碎片。如果你还记得在第五部分的章节中，“基础项目](#part05.html_part05)”，我总是注意说明示例展示的是实现总体目标的众多脚本创建方法之一。使用应用程序框架允许你说：“我知道有很多种创建登录序列（或购物车、讨论论坛等）的方法，与其与其从头开始，我将采用[应用程序框架]的方法来处理。”\n\
  \n除了复用稳定代码库来实现通用功能的明显优势外，使用框架还帮助开发者遵循一致的软件架构模式。对于 PHP 框架来说，该模式通常是模型-视图-控制器（MVC）模式，你将在下一节中学习更多相关内容。遵循框架（从而遵循某种软件架构）的另一个方面是能够为你的应用程序实现稳定且一致的三层架构。在三层架构中，你有一个表示客户端的物理层，然后是受你控制和管理的应用层和数据库。换句话说，用户的\
  \ Web 浏览器或移动设备（客户端）直接连接到你的应用程序——通常是它的表现层，即你在浏览器中看到的内容——然后它反向访问数据库检索待显示的数据。\n\n重要的是，某些内容管理系统——本身就是可安装的软件软件包，例如\
  \ WordPress ([`www.wordpress.org/`](http://www.wordpress.org/))、Drupal ([`www.drupal.org/`](http://www.drupal.org/))\
  \ 和 Joomla ([`www.joomla.org/`](http://www.joomla.org/))——并不是应用程序框架，但你可以以这种方式安装和自定义应用程序，从而创建你自己的版本同时复用其丰富的代码库。\n\
  \n### 使用 MVC 模式\n\n任何软件架构模式的目标之一都是在组件之间提供一致的结构、元素以及属性，以便确保那些开发和维护应用程序的人能够理解其内部运作。考虑一下一个人在不遵循任何架构模式的情况下独立编写应用程序的情况：当新成员加入团队，或者原作者离开时会发生什么？如果没有基础且共享的知识体系（例如遵循通用架构模式），将花费大量时间让新成员进入状态，这还未触及他在一致审计、测试和维护这些杂乱代码方面面临的问题。\n\
  \nMVC 软件架构模式已为 Web 应用程序准备就绪，事实上许多应用程序（或只是动态网站）在不刻意努力的情况下遵循了这种模式的某种版本。图 33.1 基本地说明了\
  \ MVC 概念，实线表示三个组件之间的直接关联，虚线表示某些部分之间有时存在的间接关联。\n\n```\n![image](img/33fig01.jpg)\n\
  ```\n\n**图 33.1 MVC 模式可视化。**\n\n通常，这三个组件可以定义如下：\n\n• **模型（Model）**——存储并分离数据。它本身不是数据库，而是你迄到为止脚本中那些访问数据库并从中提取信息、然后将其显示给用户的部分。\n\
  \n• **视图（View）**——模型中数据的视觉表示。这些就像是你迄到为止脚本中那些仅仅负责显示你从数据库检索出的数据的部分。\n\n\n\n\n\n- `Controller`（控制器）——用户在系统中触发操作的方式。它通常被称为应用程序的“大脑”，决定了如何使用模型（model）来实现该操作的成功结果。\n\
  \n这里是另一种思考 MVC 应用中流的方式。假设在线商店的一位用户正在查看一个商品页面，并想将该商品加入购物车：\n\n1. 用户用鼠标点击页面上的提交按钮。\n\
  2. 控制器接收表单操作并向模型发送信息。\n3. 为了向用户展示已发生了某项操作和数据变化，视图（view）与模型通信以获取数据并显示给用户。\n4. 控制器等待更多的用户操作，此时循环将重复。\n\
  \n本章讨论的每种 PHP 框架都能让你轻松地将 MVC 模式应用到你的软件应用程序中。许多其他 PHP 框架也是如此，尽管你可能不会选择遵循该模式，但建议你这样做，以便对应用程序进行更易测试、开发、部署和持续维护。\n\
  \n> **注意**\n> 欲了解更多关于 MVC 模式的示例和解释，请参阅 Jeff Atwood 编写且简洁的博客文章“理解模型-视图-控制器”，地址为：[`www.codinghorror.com/blog/2008/05/understanding-model-view-controller.html`](http://www.codinghorror.com/blog/2008/05/understanding-model-view-controller.html)。\n\
  \n## 安装和使用 PHP 框架\n\n在编写本文时，全球开发者使用的超过 30 种 PHP 框架。要选取几个进行一般性讨论并非易事，但本章中提到的这些框架具有（相对）较长的历史，并拥有活跃的开发者社区和相当大的采纳率。事实上，当你为自己的目的评估框架时，应该考虑三个与代码本身无关的特征：它是否已经存在段时间并且运行稳定？人们是否在使用在使用它？母公司或开发者群体是否在积极维护它？\n\
  \n选择时的其他考虑因素包括：\n\n- 确定该框架是否最适合你正在创建的应用程序类型；某些框架非常适合电子商务，某些适合内容发布，而某些则者兼顾。\n- 确定该框架是否为你提供了使用软件架构模式的机会，如果是，它是否是你想要使用的模式。\n\
  - 确定该框架是否需要额外的 PHP 模块或服务器库。如果需要，但你无法控制服务器，因此无法修改库和模块，那么该框架对你不适用。\n\n接下来的几节介绍了三个流行的开源\
  \ PHP 应用程序框架：`Zend`、`CakePHP` 和 `CodeIgniter`。再次，这些不是唯一可能的框架；事实上，`Symfony` ([`www.symfony.com/`](http://www.symfony.com/))\
  \ 和 `Yii` ([`www.yiiframework.com/`](http://www.yiiframework.com/)) 完全可以被纳入“最优秀”列表。\n\
  \n> **注意**\n> 维基百科维护了一份全面的 PHP 框架列表，地址为：[`en.wikipedia.org/wiki/Comparison_of_web_application_frameworks#PHP`](http://en.wikipedia.org/wiki/Comparison_of_web_application_frameworks#PHP)。\n\
  \n## 考虑 Zend Framework\n\n如果你正在开发企业级的 PHP 应用程序，认真考虑从 `Zend Framework` ([`framework.zend.com/`](http://framework.zend.com/))\
  \ 开始。你可能听过 `Zend`，它是 `Zend Framework` 背后的公司，因为它的创始人几乎从 PHP 语言创建之初就是该语言的贡献者。核心 PHP\
  \ 引擎通常被称为 `the Zend engine`。换句话说，如果按照我之前提到的标准来评估 `Zend Framework`，你很难找到比它更稳定、历史更久，或有更多人积极开发该框架及基于它开发应用程序的框架。\n\
  \n尽管软件名为 `Zend Framework`，而且它确实是一个框架，但你可能也会听到它被称为`组件库`，因为你可以从一组松耦合的组件中进行挑选和组装，而不是实现一个结构化、架构良好的应用程序。例如，`Zend`\
  \ 的独立组件处理数据库连接和性能分析、国际化和本地化、身份验证、授权和会话管理、Web 服务消费与暴露以及邮件功能等（仅列举）。\n\n框架由组件组成完全不是一个负面评价，但它值得提醒人们：使用框架和遵循架构模式的目标之一是为了便于维护——你的应用程序可以保持整洁（如果找不到更好的词，就可以这么说）。如果你的应用程序包含一个框架组件库，而你只使用了其中一个，你可能会问自己维护该框架（更新、补丁等）的开销是否值得。你的答案会各不相同，只有你自己才知道哪个决定对你是正确的。\n\
  \n要根据你在书中一直使用的 `PHP`、`Apache` 和 `MySQL` 安装环境下载并安装 `Zend Framework`，请先访问 [`framework.zend.com/manual/en/requirements.introduction.html`](http://framework.zend.com/manual/en/requirements.introduction.html)\
  \ 上的 `requirements.introduction.html`（要求介绍）页面，确保你拥有正确的 `PHP` 版本以及任何辅助库和模块。如果是的话，前往\
  \ [`framework.zend.com/download/latest`](http://framework.zend.com/download/latest)\
  \ 获取软件 `Full` 或 `Minimal` 版本的链接。获取你选择的格式的发行包后，只需根据其中包含的说明进行解压即可。（简而言之，你提取一个目录并将其放入现有的文件系统中）。位于\
  \ [`framework.zend.com/manual/en/learning.quickstart.html`](http://framework.zend.com/manual/en/learning.quickstart.html)\
  \ 的 `Zend Framework QuickStart Guide` 将通过创建示例应用程序，引导你完成使用该框架及其组件的过程。\n\n## 考虑 CakePHP\n\
  \n另一个拥有强大用户和开发者社区的长期且稳定的 PHP 框架是 `CakePHP` ([`www.cakephp.org/`](http://www.cakephp.org/))。其核心，`CakePHP`\
  \ 是一个 MVC 框架，具有常用功能的组件，如数据库连接、身份验证、授权、会话管理以及 Web 服务消费与暴露——这些都与 `Zend Framework`\
  \ 以及许多其他框架非常相似。\n\n`CakePHP` 最大的卖点之一是易用性（或易于集成），同时不会让其简单性阻碍功能丰富的开发和企业部署。与 `Zend\
  \ Framework` 一样，你不需要处理自定义配置文件，只需下载并安装框架即可开始快速开发。从新用户的角度来看，`CakePHP` 因拥有详细且友好的文档以及多媒体教程（除了标准的开发者论坛外）而加分。\n\
  \n要根据你在书中一直使用的 `PHP`、`Apache` 和 `MySQL` 安装环境下载并安装 `CakePHP`，请先访问 `CakePHP Cookbook`（也称为文档）的\
  \ [`book.cakephp.org/2.0/en/installation.html`](http://book.cakephp.org/2.0/en/installation.html)\
  \ 安装页面，确保你拥有正确的 `PHP` 版本以及任何辅助库和模块。如果是的话，从页面下方的链接或网站主页下载当前版本。\n\n\n\n\n\n在你获得发行包后，只需将其解压到你的\
  \ Web 服务器文档根目录中。在开发或生产环境中使用 CakePHP，你有几种不同的选项，这些选项在 [`book.cakephp.org/2.0/en/installation.html`](http://book.cakephp.org/2.0/en/installation.html)\
  \ 的食指南中都有讨论。一旦安装了 CakePHP，请前往 [`book.cakephp.org/2.0/en/getting-started.html`](http://book.cakephp.org/2.0/en/getting-started.html)\
  \ 中的快速上手指南，了解如何使用 CakePHP 创建示例应用程序的步骤。\n\n## 考虑 CodeIgniter\n\n尽管 CakePHP 被誉为易于使用（事实也如此），但对于真正的初学者来说，CodeIgniter\
  \ ([`www.codeigniter.com`](http://www.codeigniter.com)) 是一个很好的起点。虽然它功能丰富，但其功能侧重于交付内容，而不是商业或其他事务处理过程。这完全不是坏事，因为在架构合理的软件中以易于的方式交付内容始终是一个加分项。我可能不会在企业中使用\
  \ CodeIgniter，但许多 Web 开发人员在从未进入企业领域的情况下，通过大量的满意客户过着优渥的生活。所以，再次选择适合你的框架。\n\n除了是一个\
  \ MVC 框架外，CodeIgniter 还处理许多常见功能，如数据库连接、身份验证、授权、会话管理、本地化、图像处理以及 Web 服务的消费和暴露等——与本章讨论的其他框架类似。同样，与所讨论的其他框架一样，安装包括下载并安装框架，并立即（且快速）开始开发。与\
  \ CakePHP 一样，CodeIgniter 在拥有详细且用户友好的文档以及多媒体教程（除了标准的开发者论坛）方面赢得了高分。\n\n要与你已经在本书书中使用的现有\
  \ PHP、Apache 和 MySQL 安装一起下载并安装 CodeIgniter，请先前往文档中 [`codeigniter.com/user_guide/general/requirements.html`](http://codeigniter.com/user_guide/general/requirements.html)\
  \ 的服务器要求页面，以确保你拥有正确版本的 `PHP` 以及任何辅助库和模块。如果是，请从 [`codeigniter.com/downloads/`](http://codeigniter.com/downloads/)\
  \ 的下载页面下载当前版本。\n\n### 总结\n\n本简短章节向你介绍了使用应用程序框架的概念，特别是一种使用模型-视图-控制器（MVC）软件架构模式的框架。在阅读三个流行的\
  \ `PHP` 应用框架（Zend、CakePHP 和 CodeIgniter）之前，你学习了如何评估框架以用于你自己的应用程序开发的基础知识。\n\n###\
  \ 工作坊\n\n该工作坊旨在帮助你回顾所学内容并开始将知识付诸实践。\n\n### 测验\n\n**1。** 使用应用程序框架有哪些益处？\n\n**2。**\
  \ 在 MVC 模式中，模型的作用是什么？\n\n**3。** 你必须必须使用应用程序框架吗？\n\n### 答案\n\n**1。** 在稳定的代码库上工作，遵循软件架构模式，并且不重复造轮。\n\
  \n**2。** 模型存储并将数据与控制和视图组件分离来。\n\n**3。** 完全不需要。事实上，书中的没有任何内容（它涵盖了使用 `PHP` 和 `MySQL`\
