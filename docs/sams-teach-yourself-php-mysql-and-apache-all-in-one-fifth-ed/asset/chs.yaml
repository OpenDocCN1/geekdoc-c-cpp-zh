  \ `SELECT` 语句中使用函数来获取函数结果。或者你可以通过拼接两个字段来增强你的 `SELECT` 结果。以下示例并非 MySQL 字符串函数的完整库。更多信息，请参阅\
  \ MySQL 手册：http://dev.mysql.com/doc/refman/5.5/en/string-functions.html\n\n####\
  \ 长度与拼接函数\n\n长度和拼接函数组关注字符串的长度以及字符串的拼接。长度函数包括 `LENGTH()`、`OCTET_LENGTH()`、`CHAR_LENGTH()`\
  \ 和 `CHARACTER_LENGTH()`，它们的作用相同：计算字符串中的字符数。\n\n```sql\nSELECT LENGTH('This is cool!');\n\
  ```\n\n结果是：\n\n```\n+-------------------------+\n| LENGTH('This is cool!') |\n+-------------------------+\n\
  |                      13 |\n+-------------------------+\n1 row in set (0.00 sec)\n\
  ```\n\n有趣从 `CONCAT()` 函数开始，它可以拼接两个或多个字符串：\n\n```sql\nSELECT CONCAT('My', 'S', 'QL');\n\
  ```\n\n查询结果如下：\n\n```\n+-------------------------+\n| CONCAT('My', 'S', 'QL') |\n\
  +-------------------------+\n| MySQL                   |\n+-------------------------+\n\
  1 row in set (0.00 sec)\n```\n\n想象在一个分为 `firstname` 和 `lastname` 字段的表使用此函数。与其使用两个字符串，不如使用两个字段名来拼接\
  \ `firstname` 和 `lastname`。通过拼接字段，你可以减少应用程序中实现相同结果所需的代码行：\n\n```sql\nSELECT CONCAT(firstname,\
  \ lastname) FROM master_name;\n```\n\n查询结果如下：\n\n```\n+-----------------------------+\n\
  | CONCAT(firstname, lastname) |\n+-----------------------------+\n| JohnSmith  \
  \                 |\n| JaneSmith                   |\n| JimboJones             \
  \     |\n+-----------------------------+\n```\n\n\n\n\n| AndySmith |\n| ChrisJones\
  \ |\n| AnnaBell |\n| JimmyCarr |\n| AlbertSmith |\n| JohnDoe |\n\n9 rows in set\
  \ (0.00 sec)\n\n* * *\n\n提示\n\n如果你在函数中使用字段名而不是字符串，请不要将字段名包含在引号内。如果你这样做，MySQL 会将该字符串视为字面量。在\
  \ `CONCAT()` 示例中，如下所示：\n\n点击此处查看代码图片\n\n```sql\nSELECT CONCAT('firstname', 'lastname')\
  \ FROM master_name;\n```\n\n你将得到以下结果：\n\n+---------------------------------+\n|\
  \ CONCAT('firstname', 'lastname') |\n+---------------------------------+\n| firstnamelastname             |\n\
