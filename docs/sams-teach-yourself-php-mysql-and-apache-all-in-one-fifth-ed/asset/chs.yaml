  \n## 使用 `UPDATE` 命令修改记录\n\n`UPDATE` 是用于修改现有记录或一组记录中一个或多个列内容的 SQL 命令。最基础的 `UPDATE`\
  \ 语法如下：\n\n```sql\nUPDATE table_name\nSET column1='new value',\ncolumn2='new value2'\n\
  [WHERE some_condition_is_true]\n```\n\n更新记录的指南与插入记录时使用的指南相似：你输入的数据必须与字段的数据类型相匹配，并且你必须将字符串包含在单引号或双引号中，并在必要时进行转义。\n\
  \n例如，假设你有一个名为 `fruit` 的表，其中包含一个 ID（id）、一个水果名称（fruit_name）以及水果状态（`ripe` 成熟或 `rotten`\
  \ 腐烂）：\n\n```\n+----+------------+--------+\n| id | fruit_name | status |\n+----+------------+--------+\n\
  |  1 | apple       | ripe   |\n|  2 | orange      | rotten |\n|  3 | grape     \
  \  | ripe   |\n|  4 | banana     | rotten |\n+----+------------+--------+\n4 rows\
  \ in set (0.00 sec)\n```\n\n要将水果状态更新为 `ripe`，请使用：\n\n```sql\nUPDATE fruit SET status\
  \ = 'ripe';\n```\n\n你将收到来自数据库的响应：\n\n点击此处查看代码图片\n\n```\nQuery OK, 2 rows affected\
  \ (0.00 sec)\nRows matched: 4  Changed: 2  Warnings: 0\n```\n\n仔细观察查询结果。从 `Query\
  \ OK` 消息可以看出，操作是成功的。还要注意，只有两行受到了影响——如果你尝试将某列的值设置为其当前已有的值，则该列不会发生更新。\n\n响应的第二行显示匹配了四行，但只有两行被更改。如果你想知道匹配了什么，答案很简单：因为你没有指定特定的匹配条件，所以匹配结果是\
  \ `all rows`（所有行）。\n\n在更新表时你必须小心并使用条件，除非你确实打算将所有记录的所有列都更改为相同的值。为了说明起见，假设表中 *grape*（葡萄）一行的单词拼写错误了，你想使用\
  \ `UPDATE` 来纠正这个错误：\n\n```sql\nUPDATE fruit SET fruit_name = 'grape';\n```\n\n这个查询将产生可怕的后果：\n\
  \n```\nQuery OK, 4 rows affected (0.00 sec)\nRows matched: 4  Changed: 4  Warnings:\
  \ 0\n```\n\n当你看到结果时，你*应该*感到非常恐惧：四条记录中的四条都被更改了，而不是仅仅是你想要修改的某一条，这意味着你的 `fruit` 表现在看起来像所示：\n\
  \n```\n+----+------------+--------+\n| id | fruit_name | status |\n+----+------------+--------+\n\
  |  1 | grape       | ripe   |\n|  2 | grape       | ripe   |\n|  3 | grape     \
  \  | ripe   |\n|  4 | grape       | ripe   |\n+----+------------+--------+\n4 rows\
  \ in set (0.00 sec)\n```\n\n你所有的水果记录现在都是葡萄。虽然你试图纠正一个字段的拼写，但由于你没有指定条件，所有字段都被更改了。\n\
  \n在向用户分配 `UPDATE` 权限时，考虑一下你赋予他人的责任——稍有不慎，你的整个表可能都会变成葡萄。在前面的示例中，你可以在 `WHERE` 子句中使用\
  \ `id` 或 `fruit_name` 字段，正如将在下一节中看到的。\n\n### 条件 `UPDATE`\n\n执行条件 `UPDATE` 意味着你正在使用\
  \ `WHERE` 子句来匹配特定记录。在 `UPDATE` 语句中使用 `WHERE` 子句与在 `SELECT` 语句中使用 `WHERE` 子句一样。可以使用所有相同的比较和逻辑运算符，例如\
  \ `equal to`、`greater than`、`OR` 和 `AND`。假设假设 `fruit` 表没有完全充满葡萄，而是包含四条记录，其中一条存在拼写错误（`grappe`\
  \ 而不是 `grape`）。修复拼写错误的 `UPDATE` 语句如下：\n\n点击此处查看代码图片\n\n```sql\nUPDATE fruit SET\
  \ fruit_name = 'grape' WHERE fruit_name = 'grappe';\n```\n\n在这种情况下，只有一行被匹配且只有一行被更改，如结果所示：\n\
  \n```\nQuery OK, 1 row affected (0.00 sec)\nRows matched: 1  Changed: 1  Warnings:\
  \ 0\n```\n\n你的 `fruit` 表应该是完好无损的，所有水果名称拼写都是正确的：\n\n```sql\nSELECT * FROM fruit;\n\
  ```\n\n此 `SELECT` 查询显示了以下内容：\n\n```\n+----+------------+--------+\n| id | fruit_name\
  \ | status |\n+----+------------+--------+\n|  1 | apple       | ripe   |\n|  2\
  \ | pear        | ripe   |\n|  3 | banana      | ripe   |\n|  4 | grape       |\
  \ ripe   |\n+----+------------+--------+\n4 rows in set (0.00 sec)\n```\n\n### 在\
  \ `UPDATE` 中使用现有列值\n\n`UPDATE` 的另一个功能是可以使用记录中的当前值作为基值。例如，回到 `grocery_inventory`\
  \ 表，该表结构所示：\n\n点击此处查看代码图片\n\n```\n+----+-------------+--------------------------------------+----------+\n\
  | id | item_name   | item_desc               | item_price | curr_qty |\n+----+-------------+--------------------------------------+----------+\n\
  |  1 | Apples      | Beautiful, ripe apples.  | 0.25      | 1000     |\n|  2 | Bunches\
  \ of Grapes  | Seedless grapes.         | 2.99      | 500      |\n|  3 | Bottled\
  \ Water (6-pack) | 500ml spring water.  | 2.29      | 250      |\n|  4 | Bottled\
  \ Water (12-pack) | 500ml spring water.  | 4.49      | 500      |\n|  5 | Bananas\
  \     | Bunches, green.         | 1.99      | 150      |\n|  6 | Pears       | Anjou,\
  \ nice and sweet.  | 0.5       | 500      |\n|  7 | Avocado     | Large Haas variety.\
  \     | 0.99      | 750      |\n+----+-------------+--------------------------------------+----------+\n\
  7 rows in set (0.00 sec)\n```\n\n当有人购买产品时，例如苹果（`id` = `1`），库存表应该相应更新。然而，你不知道要在 `curr_qty`\
  \ 列中输入什么数字，只卖了一个。在这种情况下，使用该列的值并减 1：\n\n点击此处查看代码图片\n\n```sql\nUPDATE grocery_inventory\
  \ SET curr_qty = curr_qty - 1 WHERE id = 1;\n```\n\n此查询应赋予 `curr_qty` 列一个新的值 `999`，事实如此：\n\
  \n```sql\nSELECT * FROM grocery_inventory;\n```\n\n`SELECT` 查询显示了新的库存：\n\n点击此处查看代码图片\n\
  \n```\n+----+-------------+--------------------------------------+----------+\n\
  | id | item_name   | item_desc               | item_price | curr_qty |\n+----+-------------+--------------------------------------+----------+\n\
  |  1 | Apples      | Beautiful, ripe apples.  | 0.25      | 999      |\n|  2 | Bunches\
  \ of Grapes  | Seedless grapes.         | 2.99      | 500      |\n|  3 | Bottled\
  \ Water (6-pack) | 500ml spring water.  | 2.29      | 250      |\n|  4 | Bottled\
  \ Water (12-pack) | 500ml spring water.  | 4.49      | 500      |\n|  5 | Bananas\
  \     | Bunches, green.         | 1.99      | 150      |\n|  6 | Pears       | Anjou,\
  \ nice and sweet.  | 0.5       | 500      |\n|  7 | Avocado     | Large Haas variety.\
  \     | 0.99      | 750      |\n+----+-------------+--------------------------------------+----------+\n\
  ```\n\n## 使用 `REPLACE` 命令\n\n修改记录的另一种方法是使用 `REPLACE` 命令，它与 `INSERT` 命令非常相似。\n\n\
  点击此处查看代码图片\n\n```sql\nREPLACE INTO table_name (column list) VALUES (column values);\n\
  ```\n\n\n\n\n`REPLACE` 语句的工作原理如下：如果你要插入表中的记录包含一个与表中已有的记录相匹配的主键值，则表中的该记录将被列删除，并在该位置插入新记录。\n\
  \n### 注意\n\n`REPLACE` 命令是 MySQL 针对 ANSI SQL 的特定扩展。该命令模拟了对特定记录的 `DELETE` 和重新 `INSERT`\
  \ 操作。换句话说，你只需花一条命令的就获得了两个操作。\n\n使用 `grocery_inventory` 表，以下命令替换了 `Apples` 的条目：\n\
  \n点击此处查看代码图像\n\n```sql\nREPLACE INTO grocery_inventory VALUES\n (1, 'Granny Smith\
  \ Apples', 'Sweet!', '0.50', 1000);\n```\n\n你应该看到以下结果：\n\n```\nQuery OK, 2 rows\
  \ affected (0.00 sec)\n```\n\n在查询结果中，注意结果显示为 `2 rows affected`。在这种情况下，因为 `id` 是主键，且在\
  \ `grocery_inventory` 表中有一个匹配的值，因此原始行被删除，新行被插入：`2 rows affected`。\n\n使用 `SELECT`\
  \ 查询来验证该条目是否正确，结果它是正确的：\n\n点击此处查看代码图像\n\n```\n+----+-------------------------+-------------------------+------------+----------+\n\
  | id | item_name               | item_desc               | item_price | curr_qty\
  \ |\n+----+-------------------------+-------------------------+------------+----------+\n\
  | 1  | Granny Smith Apples     | Sweet!                  | 0.50       | 1000   \
  \  |\n| 2  | Bunches of Grapes      | Seedless grapes.        | 2.99       | 500\
  \      |\n| 3  | Bottled Water (6-pack)  | 500ml spring water.    | 2.29       |\
  \ 250      |\n| 4  | Bottled Water (12-pack) | 500ml spring water.    | 4.49   \
  \    | 500      |\n| 5  | Bananas                 | Bunches, green.          | 1.99\
  \       | 150      |\n| 6  | Pears                   | Anjou, nice and sweet.  |\
  \ 0.5        | 500      |\n| 7  | Avocado                 | Large Haas variety.\
  \      | 0.99       | 750      |\n+----+-------------------------+-------------------------+------------+----------+\n\
  7 rows in set (0.00 sec)\n```\n\n如果你使用 `REPLACE` 语句，且新记录中主键的值与表中已有的主键值不匹配，则该记录将直接插入，仅影响了一行。\n\
  \n## 使用 `DELETE` 命令\n\n基础的 `DELETE` 语法如下：\n\n```sql\nDELETE FROM table_name\n[WHERE\
  \ some_condition_is_true]\n[LIMIT rows]\n```\n\n注意，`DELETE` 命令中没有使用列指定——当你使用 `DELETE`\
  \ 时，整条记录会被移除。你可能还记得本章早些时候关于 `fruit` 表中葡萄的失误，当时在不指定条件的情况下更新表会导致所有记录被更新。在使用 `DELETE`\
  \ 时，你必须同样小心。\n\n假设在名为 `fruit` 的表中具有以下结构和数据：\n\n```\n+----+------------+--------\n\
  | id | fruit_name | status |\n+----+------------+--------\n| 1  | apple      | ripe\
  \   |\n| 2  | pear       | rotten |\n| 3  | banana     | ripe   |\n| 4  | grape\
  \      | rotten |\n+----+------------+--------\n4 rows in set (0.00 sec)\n```\n\n\
  以下语句删除了表中的所有记录：\n\n```sql\nDELETE FROM fruit;\n```\n\n你始终可以通过尝试从表中 `SELECT` 数据来验证删除操作。如果你在删除所有记录后执行了此命令：\n\
  \n```\nSELECT * FROM fruit;\n# Empty set (0.00 sec)\n```\n\n#### 条件 `DELETE`\n\n\
  条件 `DELETE` 语句与条件 `SELECT` 或 `UPDATE` 语句一样，意味着你正在使用 `WHERE` 子句来匹配特定的记录。你拥有可以使用全范围的比较和逻辑运算符，因此你可以自由选择想要删除哪些记录。\n\
  \n从 `fruit` 表中删除所有状态为 `rotten`（腐烂）记录的典型示例：\n\n点击此处查看代码图像\n\n```sql\nDELETE FROM\
  \ fruit WHERE status = 'rotten';\n```\n\n删除了两条记录：\n\n```\nQuery OK, 2 rows affected\
  \ (0.00 sec)\n```\n\n只剩下 `ripe`（熟的）水果：\n\n```\n+----+------------+--------\n| id\
  \ | fruit_name | status |\n+----+------------+--------\n| 1  | apple      | ripe\
  \   |\n| 3  | banana     | ripe   |\n+----+------------+--------\n2 rows in set\
  \ (0.00 sec)\n```\n\n你也可以在 `DELETE` 语句中使用 `ORDER BY` 子句；请看添加了 `ORDER BY` 结构后的基础\
  \ `DELETE` 语法：\n\n```sql\nDELETE FROM table_name\n[WHERE some_condition_is_true]\n\
  [ORDER BY some_column [ASC | DESC]]\n[LIMIT rows]\n```\n\n乍看之下，你可能会奇怪：“`ORDER BY`\
  \ 有什么用？”。看看带有 `ORDER BY` 子句的 `DELETE` 语句如何在其结构中应用排序：\n\n```sql\nDELETE FROM table_name\n\
