  \n尽管格式字符串看起来很深奥，但构建它很容易。如果你想在格式中添加一个包含也是格式代码的字母的字符串，可以在这些字符前面放置一个反斜杠（`\\`）来对其进行转义。对于转义后会变成控制字符的字符，你必须转义其前面的反斜杠。例如，`\\\
