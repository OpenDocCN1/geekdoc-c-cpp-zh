  \ *\n\n* * *\n\n### 注意\n\n要了解更多关于 JSON 的信息，请访问 [`www.json.org`](http://www.json.org)。首次创建\
  \ JSON 时一个非常有用的工具是 [`json.parser.online.fr/`](http://json.parser.online.fr/)  JSON\
  \ 解析器，它可以允许你粘贴文本并查找（以及修复）语法错误。\n\n* * *\n\n一旦你有了一些 JSON，可以使用 PHP 的 `json_decode()`\
  \ 函数将格式良好的数据转换为对象，就像你之前在 SimpleXML 示例中所做的那样。列表 28.5 使用了一些短代码来加载一些 JSON 数据并显示存储在对象中的数据层次结构。\n\
  \n列表 28.5 加载并显示 JSON 数据\n\n点击此处查看代码图片\n\n* * *\n\n```php\n1: <?php\n2: $theData\
  \ = file_get_contents(\"books.xml\");\n3: echo \"<pre>\";\n4: print_r(json_decode($theData));\n\
  5: echo \"</pre>\";\n6: ?>\n```\n\n* * *\n\n第 2 行使用 `file_get_contents()` 加载 `books.txt`（一个包含\
  \ 列表 28.4 所示 JSON 数据的文本文件）到名为 `$theData` 的对象中。在第 4 行，`print_r()` 函数输出存储在对象中的解码 JSON\
