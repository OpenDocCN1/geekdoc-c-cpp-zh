  \ 章 应用程序本地化（Localization）\n\n* *\n\n在本章中，你学习了以下内容：\n\n- 如何识别并准备字符集\n- 如何准备你的应用程序以生成本地化站点\n\
  \n* *\n\n对于不同语言的使用者来说，使用 PHP 和 MySQL 创建网站是非常简单的。将应用程序准备好用于多个环境被称为国际化（internationalization），而为每个环境自定义代码被称为本地化（localization）。\n\
  \n## 关于国际化和本地化\n\n首先，重要的是理解国际化或本地化等同于翻译。事实上，你可以拥有一个完全翻译的网站——无论是德语、日语还是任何语言——但它并不意味着它是国际化或本地化的。国际化的关键方面包括：\n\
  \n- 外部化所有字符串、图标和图形\n- 修改格式函数（日期、数字等）\n\n当你构建了应用程序，使得字符串、函数、类和其他脚本在一个地方被管理或被外部化——并且格式函数可以根据每个环境更改——就可以开始本地化过程。\n\
  \n### 活动\n\n**1.** 创建一个使用环境变量记录访问情况的脚本。\n\n**2.** 在本章较早之前，你学习了如何……（文本截断）。\n\n\n\n\
  \n字符集通常被称为`单字节`（single-byte）或`多字节`（multibyte），指的是定义语言中字符关系所需的字节数。英语、德语和法语（以及许多其他语言）都是单字节语言；表示字母\
  \ `a` 或数字 `9` 等字符仅需 `1` 个字节。单字节字符集最多包含 256 个字符，包括整个 ASCII 字符、带重音字符以及格式所需的其他字符。\n\
  \n多字节字符集包含超过 256 个字符，并将所有单字节字符作为子集。多字节语言包括繁体和简体中文、日语、韩语、泰语、阿拉伯语、希伯来语等。这些语言需要超过 `1`\
  \ 个字节来表示一个字符。一个很好的例子是日本首都 `Tokyo`。在英语中，它由四个不同的字符拼写，总共占用 5 个字节。但在日语中，这个词由两个音节 `tou`\
  \ 和 `kyou` 表示，每个音节使用 `2` 个字节，总共使用 4 个字节。\n\n这是对字符集及其背后技术的完全简化，但其相关性在于：为了正确解释并以预期的语言显示网页文本，需要你告诉网络浏览器使用哪种字符集。这是通过在所有内容之前发送适当的标头来实现的。\n\
  \n如果你有一组包含日语文本的页面，且没有发送关于语言和字符集的正确标头，那么这些页面在主语言不是日语的网页浏览器中将显示错误。换句话说，由于没有包含字符集信息，浏览器将假设使用它自己的默认字符集来渲染文本。例如，如果你的日语页面使用\
  \ `Shift_JIS` 或 `UTF-8` 字符集，而你的浏览器被设置为 `ISO-8859-1`，你的浏览器将尝试使用单字节的 `ISO-8859-1`\
  \ 字符集来渲染日语文本。在这种情况下，除非标头提醒它使用 `Shift_JIS` 或 `UTF-8` 并且你的操作系统上安装了适当的库和语言包，否则将失败得非常惨惨。\n\
  \n***\n\n### 提示\n\n`Mojibake`（乱码）是这类无法识别的字符的术语。更多信息请参阅 [`en.wikipedia.org/wiki/Mojibake`](http://en.wikipedia.org/wiki/Mojibake)。\n\
  \n***\n\n涉及的标头是 `Content-type` 和 `Content-language` 标头，它们也可以设置为 `HTML5` 标签属性。由于你拥有处理动态环境的所有工具，最好在发送文本之前既发送适当的标头，并在文档中打印正确的\
  \ `HTML5` 属性标签。以下是 `header()` 函数为英文站点输出正确字符信息的示例：\n\n点击此处查看代码图像\n\n```\nheader(\"\
  Content-Type: text/html;charset=ISO-8859-1\");\nheader(\"Content-Language: en\"\
  );\n```\n\n随附的 `HTML5` 标签如下：\n\n```html\n<html lang=\"en\">\n<meta charset=\"ISO-8859-1\"\
  >\n```\n\n德语网站将使用相同的字符集但不同的语言代码：\n\n点击此处查看代码图像\n\n```\nheader(\"Content-Type: text/html;charset=ISO-8859-1\"\
  );\nheader(\"Content-Language: de\");\n```\n\n随附的 `HTML5` 标签如下：\n\n```html\n<html\
  \ lang=\"de\">\n<meta charset=\"ISO-8859-1\">\n```\n\n日语网站使用不同的字符集和不同的语言代码：\n\n\
  点击此处查看代码图像\n\n```\nheader(\"Content-Type: text/html;charset=Shift_JIS\");\nheader(\"\
  Content-Language: ja\");\n```\n\n随附的 `HTML5` 标签如下：\n\n```html\n<html lang=\"ja\"\
  >\n<meta charset=\"Shift_JIS\">\n```\n\n### 环境修改\n\n根据本书安装章节中定义的环境，你不需要为了处理本地化网站而更改环境。虽然你可以在\
  \ Apache、PHP 和 MySQL 中使用多个与语言相关的设置来适应本地化网站，但你也可以在不对配置进行任何语言相关更改的情况下，完成本章中的所有任务。仅供你参考，接下来的几节将引导你指向使用\
  \ Apache、PHP 和 MySQL 进行国际化的适当文档。\n\n#### Apache 的配置更改\n\n在第 29 章“ Apache 性能调优与虚拟主机”中，你将学习到使用\
  \ `mod_mime` 或 `mod_negotiation` 模块以及 `AddLanguage` 和 `AddCharset` 指令（等）进行内容协商的概念。当你手动更改文件扩展并希望\
  \ Apache 根据该扩展解释要使用的字符集时，就会使用这些指令。然而，这不是本章讨论的内容。你希望你所有的本地化网站具有相同的相同命名规范（例如 `index.html`\
  \ 和 `company_info.html`），而不需要手动创建多个具有不同语言扩展的页面来适应翻译后的文件。你关于网站本地化的目标是让一组填充有适当翻译文本的页面从一个\
  \ Web 服务器上运行。\n\n***\n\n### 注意\n\n基于 Apache 的内容协商使用带有语言命名规范的多个文件并没有问题。它不是本章的重点。你可以通过\
  \ [`httpd.apache.org/docs/2.2/misc/negotiation.html`](http://httpd.apache.org/docs/2.2/misc/negotiation.html)\
  \ 了解更多关于 Apache 内容协商的信息。\n\n***\n\n#### PHP 的配置更改\n\n与 Apache 一样，本章中的任务不需要对 PHP\
  \ 进行配置更改。然而，如果你想，可以使用许多与处理多字节相关的函数。这些函数位于 [`www.php.net/mbstring`](http://www.php.net/mbstring)\
  \ 并且在配置过程中必须启用（Windows 用户在 `php.ini` 中启用 `php_mbstring.dll`）：\n\n```\nmbstring=LANG\n\
  ```\n\n在这里，`LANG` 是一个语言代码，例如日语的 `ja`、中文的 `cn` 等。或者，你可以使用此行启用所有可用语言：\n\n```\nmbstring=all\n\
  ```\n\n当你在 PHP 中启用 `mbstring` 函数时，可以在 `php.ini` 配置文件中设置多个选项来正确使用这些函数。启用后，你可以使用超过\
  \ 40 个处理多字节输入的 `mbstring` 函数。\n\n#### MySQL 的配置更改\n\n本章使用的本地化示例不需要对 MySQL 进行显式更改。MySQL\
  \ 使用的默认字符集是 `ISO-8859-1`，但这并不意味着你只能在数据库表中存储单字节字符。有关 MySQL 当前语言元素的更多信息，请参阅 MySQL\
  \ 手册：[`dev.mysql.com/doc/refman/5.5/en/globalization.html`](http://dev.mysql.com/doc/refman/5.5/en/globalization.html)。\n\
  \n### 创建本地化页面结构\n\n在本节中，你将查看一个本地化欢迎页的功能示例，该页面使用 PHP 允许用户选择目标语言并接收相应的文本。本节的目标是展示外部化脚本中所用字符串的示例，这是国际化的特征之一。\n\
  \n该过程涉及三个元素：\n\n• 创建并使用发送特定区域信息的主文件\n\n\n\n\n\n- 创建并使用主文件，根据所选的语言区域显示信息\n- 使用脚本本身\n\
  \nListing 27.1 显示了用于发送特定区域头部信息的主文件内容。\n\n**Listing 27.1** 语言定义文件 点击此处查看代码图像\n\n\
