  \ name=\"submit\" value=\"submit\">Go!</button>\n</form>\n</body>\n</html>\n```\n\
  \n\n\n\n我们现在有一个表单，它可以向自身发送 `month` 和 `year` 参数，并将默认设为当前的月份年份，或之前选择的月份年份。如果你将此列表保存为\
  \ `dateselector.php`，将其放在 Web 服务器的文档根目录下，并使用网络浏览器访问它，你应该能看到类似图 24.1 的内容。（你的月份和年份可能有所不同。）\n\
  \n![image](img/24fig01.jpg)\n\n图 24.1 日历表单。\n\n##### 创建日历表格\n\n我们现在需要创建一个表格并填充所选月份的日期。我们在列表\
