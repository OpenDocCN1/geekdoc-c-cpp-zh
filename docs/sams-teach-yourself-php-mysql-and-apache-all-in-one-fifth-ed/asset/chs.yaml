  \n## [3]. 为什么你仍然对将用于数据库查询的值继续使用 `mysqli_real_escape_string()`？\n\n### 答案\n\n**[1].**\
  \ `strtoupper()`\n\n**[2].** 推测你将会有具有多种颜色和多种尺寸的商品。因此，`item_id` 不是唯一键。此外，商品可能具有相同的颜色或尺寸，因此\
  \ `item_color` 和 `item_size` 字段也不得是主键或唯一键。\n\n**[3].** 你应该使用 `mysqli_real_escape_string()`\
  \ 来确保来自用户且将用于数据库查询的值是安全的，无论你创建了一个脚本、十个脚本还是百个脚本。\n\n### 活动\n\n**1.** 通过在 MySQL 中执行你自己的查询，再创建三个类别，每个类别包含一或两个商品。\n\
  \n**2.** 为你商店中的每件商品制作一些图像（或使用知识共享许可的图像），并将它们放在服务器的 `images` 目录。这需要对 `showitem.php`\
  \ 脚本进行一项更改：在生成的 `<img/>` 标签的文件路径中添加 `image` 目录。\n\n## 第 23 章. 创建购物车机制\n\n在本章中，你将学习以下内容：\n\
  \n- 如何为在线商店的购物车和结算部分创建关系表\n- 如何创建添加和移除购物车商品的脚本\n- 处理事务的一些方法，以及如何创建你的结账流程\n\n在本章中，你把购物车机制和结账程序集成到你在第\
  \ 22 章中创建的“创建在线商店”基础商店展示中。你将学习创建相关数据库表的方法，以及添加和删除购物车商品的脚本中包含的内容。本章使用的示例再次代表了完成这些任务的无限可能中的几种，旨在作为工作示例，而不是构建在线商店的最终指南。\n\
  \n### 规划和创建数据库表\n\n由于本章的目标是为用户提供选择和订单商品的方法，你可以想象这些表是什么样的——首先，你需要一个表来存储购物车信息。除了购物车表外，你还需要一个表来存储订单，以及一个表来存储每个订单中购买的商品。\n\
  \n使用以下 SQL 语句创建了三个新表，从 `store_shoppertrack` 表开始。该表用于存储用户将商品添加到购物车中的信息。\n\n**注意**\n\
  用于定义这些表的字段长度是根据选择选择的，以适应几种可能的输入。可以根据你的特定需求随时修改长度。\n\n点击此处查看代码图像\n\n```sql\nCREATE\
  \ TABLE store_shoppertrack (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    session_id VARCHAR (32),\n    sel_item_id INT,\n    sel_item_qty SMALLINT,\n\
  \    sel_item_size VARCHAR(25),\n    sel_item_color VARCHAR(25),\n    date_added\
  \ DATETIME\n);\n```\n\n在该表中，唯一的键是用于记录的 `id` 字段。`session_id` 不能是唯一的；否则，用户只能从你的商店购买一件商品，这不是良好的业务实践。\n\
  \n存储在 `session_id` 字段的值标识用户；它匹配分配给该特定用户的 PHP 会 ID 值。`sel_*` 字段持有用户的选择：所选商品、所选商品数量以及选选颜色和尺寸。最后，还有一个\
  \ `date_added` 字段。很多时候，用户将商品放入购物车但从未通过结账流程。这种做法会在你的跟踪表中留下零散的商品，你可能想定期清理它们。例如，你可能想删除所有超过一周的购物车商品——这就是\
  \ `date_added` 字段派用场的地方。\n\n下一个表存储订单信息：\n\n点击此处查看代码图像\n\n```sql\nCREATE TABLE store_orders\
  \ (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n    order_date DATETIME,\n\
  \    order_name VARCHAR (100),\n    order_address VARCHAR (255),\n    order_city\
  \ VARCHAR (50),\n    order_state CHAR(2),\n    order_zip VARCHAR(10),\n    order_tel\
  \ VARCHAR (25),\n    order_email VARCHAR (100),\n    item_total FLOAT (6,2),\n \
  \   shipping_total FLOAT (6,2),\n    authorization VARCHAR (50),\n    status ENUM('processed',\
  \ 'pending')\n);\n```\n\n`store_orders` 中唯一的键是 `id` 字段。最后一个表持有行项目，即 `store_items`：\n\
  \n点击此处查看代码图像\n\n```sql\nCREATE TABLE store_items (\n    id INT NOT NULL PRIMARY\
  \ KEY AUTO_INCREMENT,\n    order_id INT,\n    sel_item_id INT,\n    sel_item_qty\
  \ SMALLINT,\n    sel_item_size VARCHAR(25),\n    sel_item_color VARCHAR(25),\n \
  \   sel_item_price FLOAT(6,2)\n);\n```\n\n`sel_*` 字段看起来很熟悉。除了 `sel_item_price` 之外，它们与\
  \ `store_shoppertrack` 表中的相同。该表的主键是 `id`，`order_id` 字段将每个行项目关联到 `store_orders` 中的相应记录。\n\
