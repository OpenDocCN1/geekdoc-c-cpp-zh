  \ 查询的示例示例。`JOIN` 关键字是 SQL 的实际组成部分，允许你构建更复杂的查询。\n\n### 使用 `JOIN`\n\n你可以在 MySQL 中使用多种类型的\
  \ `JOIN`，它们都指的是表组合的顺序以及结果的显示方式。用于 `fruit` 和 `color` 表使用的 `JOIN` 类型是 `INNER JOIN`，尽管它没有显式地写出来。要使用正确的\
  \ `INNER JOIN` 语法重写 SQL 语句，可以使用以下语句：\n\n```sql\nSELECT fruitname, colorname FROM\
  \ fruit\nINNER JOIN color ON fruit.id = color.id;\n```\n\n你的结果集看起来如下：\n\n+-----------+-----------+\n\
  | fruitname | colorname |\n+-----------+-----------+\n| apple     | red |\n| orange\
