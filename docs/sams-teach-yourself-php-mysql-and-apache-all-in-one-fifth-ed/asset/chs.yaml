  \n## 变量作用域\n\n在函数内部声明的变量对于该函数是局部的。换句话说，它在函数外部或其它函数内部是不可用的。在较大的项目中，这可以防止你在不同的函数中声明同名的变量时，意外覆盖了变量的内容。\n\
  \n同样，在函数外部声明的变量默认在函数内部是不可用的。让我们在 Listing 7.6 中看看这种情况。\n\n**Listing 7.6** 在函数外部定义的变量在函数内部无效\n\
  \n点击此处查看代码图像\n\n* * *\n\n```php\n1: <?php\n2: $life = 42;\n3: function meaningOfLife()\n\
  4: {\n5:      echo \"The meaning of life is \".$life;\n6: }\n7: meaningOfLife();\n\
  ```\n\n正如你预期的，`meaningOfLife()` 函数无法访问第 2 行的 `$life` 变量；当函数尝试打印它时，`$life` 是空的。总的来说，这是好事，因为可以防止同名变量之间的冲突，而且如果函数需要外部信息，它可以始终请求参数。有时，你可能希望在函数内部访问一个重要的变量，而不是将其作为参数传递。这就是\
  \ `global` 语句大用用场。Listing 7.7 使用 `global` 恢复宇宙的秩序。\n\n**Listing 7.7** 使用 global\
  \ 语句访问全局变量\n\n点击此处查看代码图像\n\n* * *\n\n```php\n1: <?php\n2: $life=42;\n3: function\
  \ meaningOfLife()\n4: {\n5:      global $life;\n6:      echo \"The meaning of life\
  \ is \".$life\";\n7: }\n8: meaningOfLife();\n9: ?>\n```\n\n\n\n\n在每个需要访问特定命名全局变量的内部，你都需要使用\
  \ `global` 语句。但要小心：如果你在函数内部操作了变量的内容，该变量的值将会在整个脚本中改变。\n\n你可以通过用逗号分隔想要访问的每个变量，一次性使用\
  \ `global` 语句声明多个变量：\n\n```\nglobal $var1, $var2, $var3;\n```\n\n* *\n\n## 注意事项\n\
  \n通常，参数是调用代码传递的任何值的副本；在函数中更改它对函数块之外没有影响。然而，在函数内部更改全局变量会改变原始值而非副本。请谨慎地使用 `global`\
  \ 语句。\n\n* *\n\n## 使用 `static` 语句在函数调用之间保存状态\n\n函数内部的局部变量拥有短暂但快乐的生命周期——它们在函数被调用时产生，在执行结束时死亡，正如它们应该的那样。然而，你可能想给函数一种基础的记忆。\n\
  \n假设你希望一个函数跟踪自己被调用的次数，以便通过脚本创建带编号的标题。当然，你可以使用 `global` 语句来实现此，如 Listing 7.8 所示。\n\
  \n**Listing 7.8** 使用 global 语句在函数调用之间记住变量的值\n\n点击此处查看代码图像\n\n* *\n\n```php\n1: \
  \ <?php\n2:  $num_of_calls = 0;\n3:  function numberedHeading($txt)\n4:  {\n5: \
  \     global $num_of_calls;\n6:      $num_of_calls++;\n7:      echo \"<h1>\".$num_of_calls.\"\
  \ \".$txt.\"</h1>\";\n8:  }\n9:  numberedHeading(\"Widgets\");\n10: echo \"<p>We\
  \ build a fine range of widgets.</p>\";\n11: numberedHeading(\"Doodads\");\n12:\
  \ echo \"<p>Finest in the world.</p>\";\n13: ?>\n```\n\n* *\n\n将这些行放入名为 `numberedheading.php`\
  \ 的文本文件中，并将此文件放在你的 Web 服务器文档根目录下。当你通过通过浏览器访问此脚本时，它看起来应该像 Figure 7.6。\n\n![image](img/07fig06.jpg)\n\
  \n**Figure 7.6 使用 global 语句跟踪函数被调用的次数。**\n\n这起到了作用。Listing 7.8 在第 2 行声明了变量 `$num_of_calls`，位于函数\
  \ `numberedHeading()` 之外。第 5 行通过使用 `global` 语句使该变量函数可用。\n\n每次调用 `numberedHeading()`，`$num_of_calls`\
  \ 的值就会增加（第 6 行）。然后你可以打印出带有正确递编号的标题。\n\n然而，这不是最优雅的解决方案。使用 `global` 语句的函数无法作为独立的代码块来读取。在读取或重用它们时，我们需要留意它们所操作的全局变量。\n\
  \n这就是 `static` 语句有用之处。如果你在函数内部结合 `static` 语句声明变量，该变量将保持为函数局部的，并且函数会“记住”从一次执行到下一次执行的变量值。Listing\
  \ 7.9 适配了来自 Listing 7.8 的代码以使用 `static` 语句。\n\n**Listing 7.9** 使用 static 语句在函数调用之间记住变量的值\n\
  \n点击此处查看代码图像\n\n* *\n\n```php\n1:  <?php\n2:  function numberedHeading($txt)\n3:\
  \  {\n4:      static $num_of_calls = 0;\n5:      $num_of_calls++;\n6:      echo\
  \ \"<h1>\".$num_of_calls.\" \". $txt.\"</h1>\";\n7:  }\n8:  numberedHeading(\"Widgets\"\
  );\n9:  echo \"<p>We build a fine range of widgets.</p>\";\n10: numberedHeading(\"\
  Doodads\");\n11: echo \"<p>Finest in the world.</p>\";\n12: ?>\n```\n\n* *\n\n`numberedHeading()`\
  \ 函数变得完全自包含了。当在第 4 行声明 `$num_of_calls` 变量时，会给它分配一个初始值。该赋值是在第 8 行第一次调用函数时进行的。当函数在第\
  \ 10 行被第二次调用时，此初始赋值被忽略。相反，代码记得 `$num_of_calls` 的上一个值。你现在可以将 `numberedHeading()`\
  \ 函数粘贴到其他脚本中，而不必担心全局变量。尽管 Listing 7.9 的输出与 Listing 7.8 相同，但代码更优雅。\n\n### 关于参数的更多内容\n\
  \n你已经见过如何向函数传递参数，但还有很多内容需要介绍。本节介绍了为参数提供默认值的技术，并探索了通过引用而非值传递变量的方法。这意味着函数获得原始值的别名而非副本。\n\
  \n#### 为参数设置默认值\n\nPHP 提供了一个巧妙的功能来帮助构建灵活函数。直到现在，你听到某些函数需要一个或多个参数。通过使某些参数变为可选，可以让你的函数不那么\
  \ {。Listing 7.10 创建一个实用的函数，将字符串封装在 HTML `span` 元素中。为了让用户有机会更改 `font-size` 样式，除了字符串之外（第\
  \ 2 行），你要求一个 `$fontsize` 参数。\n\n**Listing 7.10** 需要两个参数\n\n点击此处查看代码图像\n\n* *\n\n\
  ```php\n1:  <?php\n2:  function fontWrap($txt, $fontsize)\n3:  {\n4:      echo \"\
  <span style=\\\"font-size:$fontsize\\\">\".$txt.\"</span>\";\n5:  }\n6:  fontWrap(\"\
  A Heading\",\"24pt\");\n7:  fontWrap(\"some body text\",\"16pt\");\n8:  fontWrap(\"\
  smaller body text\",\"12pt\");\n9:  fontWrap(\"even body text\",\"10pt\");\n10:\
  \ ?>\n```\n\n#### 向函数传递引用\n\n当你向函数传递参数时，它们作为参数变量存储。在函数体内部对这些变量的更改对于该函数是局部的，如 Listing\
  \ 7.12 所示。\n\n**Listing 7.12** 通过值传递参数\n\n点击此处查看代码图像\n\n* *\n\n```php\n1:  <?php\n\
  2:  function addFive($num)\n3:  {\n4:      $num += 5;\n5:  }\n6: $orignum = 10;\n\
  7: addFive($orignum);\n8: echo $orignum;\n9: ?>\n```\n\n\n\n\n将这些行写入一个名为 `addfive.php`\
  \ 的文本文件中，并将该文件放在你的 Web 服务器文档根目录中。当你通过网络浏览器访问此脚本时，它产生如下输出：\n\n10\n\n`addFive()` 函数接受单个数值值并对其加\
  \ `5`，但它不返回任何内容。第 6 行将一个值赋值给变量 `$orignum`，第 7 行将该变量传递给 `addFive()`。`$orignum` 内容的副本存储在变量\
  \ `$num` 中。尽管 `$num` 增加了 `5`，但这对 `$orignum` 的值没有产生影响。当打印 `$orignum` 时，你会发现它的值仍然是\
  \ `10`。默认情况下，传递给函数的变量是通过值传递的。也就是说，系统会创建变量值的本地副本。\n\n你可以通过为你的原始变量创建引用来更改这种行为。你可以将引用理解为指向变量的指示牌。在使用引用时，你实际上是在操作它所指向的值。\n\
  \n代码列表 7.13 显示了这种技术的应用。当你通过引用向函数传递参数时（如第 7 行所示），你传递的变量内容（`$orignum`）会被参数变量访问并在函数内部进行处理，而不仅仅是变量值的副本（`10`）。在这些情况下，对参数进行的任何更改都会改变原始变量的值。你可以通过在函数定义中的参数名上添加取地址符号\
  \ `&` 来通过引用传递参数，如第 2 行所示。\n\n**代码列表 7.13** 使用函数定义通过引用向函数传递参数\n\n点击此处查看代码图像\n\n```\n\
  1: <?php\n2: function addFive(&$num)\n3: {\n4:      $num += 5;\n5: }\n6: $orignum\
  \ = 10;\n7: addFive($orignum);\n8: echo $orignum;\n9: ?>\n```\n\n将这些行写入一个名为 `addfive2.php`\
  \ 的文本文件中，并将该文件放在你的 Web 服务器文档根目录中。当你通过网络浏览器访问此脚本时，它产生如下输出：\n\n15\n\n### 测试函数是否存在\n\
  \n你并不总是能在尝试调用函数之前就知道某个函数是否存在。不同版本的 PHP 引擎可能包含不同的功能，如果你正在编写一个可能在多个服务器上运行的脚本，你可能想要验证关键功能是否可用。例如，你可能希望在\
  \ MySQL 相关函数可用时使用 MySQL 的代码，否则简单地将数据记录到文本文件中。\n\n你可以使用 `function_exists()` 来检查函数的可用性。`function_exists()`\
  \ 需要一个代表函数名的字符串。如果可以找到该函数，它返回 `true`，否则返回 `false`。\n\n代码列表 7.14 显示了 `function_exists()`\
  \ 的应用，并阐述了在本章中涵盖的一些其他主题。\n\n**代码列表 7.14** 测试函数是否存在\n\n点击此处查看代码图像\n\n```\n1:  <?php\n\
  2:  function tagWrap($tag, $txt, $func = \"\")\n3:  {\n4:      if ((empty($txt))\
  \ && (function_exists($func))) {\n5:          $txt = $func($txt);\n6:          return\
  \ \"<\".$tag.\">\".$txt.\"</\".$tag.\"><br/>\";\n7:      } else {\n8:          return\
  \ \"<strong>\".$txt.\"</strong><br/>\";\n9:      }\n10: }\n11:\n12: function underline($txt)\n\
  13: {\n14:     return \"<span style=\\\"text-decoration:underline;\\\">\".$txt.\"\
  </span>\";\n15: }\n16: echo tagWrap('strong', 'make me bold');\n17: echo tagWrap('em',\
  \ 'underline and italicize me', \"underline\");\n18: echo tagWrap('em', 'make me\
  \ italic and quote me',\n19: create_function('$txt', 'return \"&quot;$txt&quot;\"\
  ;'));\n20: ?>\n```\n\n代码列表 7.14 定义了两个函数：`tagWrap()`（第 2 行）和 `underline()`（第 12 行）。`tagWrap()`\
  \ 函数接受三个字符串：标签、要格式化的文本以及一个可选的函数名。它返回一个格式化后的字符串。`underline()` 函数需要一个参数——要格式化的文本——并返回包裹在带有适当样式属性的\
  \ `<span>` 标签中的文本。\n\n当你第一次在第 16 行调用 `tagWrap()` 时，你向它传递了字符串 `strong` 和字符串 `\"make\
  \ me bold\"`。\n\n\n\n\n\n**[3].** 它输出 `50`。`tenTimes()` 函数无法访问全局变量 `$number`。当它被调用时，它操作的是它自身的局部\
  \ `$number` 变量。\n\n**[4].** 它输出 `500`。这个示例使用了 `global` 语句，这允许 `tenTimes()` 函数访问\
  \ `$number` 变量。\n\n**[5].** 它输出 `500`。通过在参数变量 `$n` 前添加引用符号 `&`，你可以确保该参数是通过引用传递的。`$n`\
  \ 和 `$number` 指向同一个值，因此当你访问 `$number` 时，对 `$n` 的任何更改都会反映出来。\n\n### 活动\n\n1. 复习创建一个接受参数、处理这些值并返回字符串的函数语法。\n\
  2. 创建一个接受四个字符串变量，并返回一个包含 HTML 表格元素的字符串，并将每个变量封装在它自己的单元格中。\n\n# 第 8 章：数组操作\n\n在本章中，你将学习以下内容：\n\
  \n- **如何创建关联数组和多维数组**\n- **如何使用 PHP 内置的无数数组相关函数**\n\n数组用于存储和组织数据。PHP 包含了许多函数，允许你创建、修改和处理数组，你将在书中描述的程序化编程方法经常使用这些函数。\n\
  \n## 什么是数组？\n\n你已经在本书之前的章节中学习并并了标量变量，因此你知道这些变量是用来存储值的。但标量变量一次只能存储一个值——`$color` 变量只能持有\
  \ `red` 或 `blue` 值，以此此类推，但它不能用于存储彩虹中的颜色列表。而数组是一种特殊的变量类型，允许你存储任意数量的值，包括彩虹中的全部七种颜色。\n\
  \n> 注意\n> 尽管你可以在数组中存储任意数量的值，但某些数组函数有 100,000 个值的上限。如果你在数组中存储了大量数据，请务必阅读你想要使用的数组函数的\
  \ PHP 手目，并确认该函数在处理数据时是否有上限。\n\n数组是有索引的，这意味着每个条目由一个 `key`（键）和一个 `value`（值）组成。键是索引位置，从\
  \ 0 开始，随着数组中每个新元素的加入而递增 1。值是你与该位置关联的任何值——字符串、整数或你想要的任何内容。将数组想象成一个文件柜，将每个键值对想象成一个文件夹。键是写在文件夹顶部的标签，而值是里面的内容。在下一节创建数组时，你将看到这种结构的实际应用。\n\
  \n## 创建数组\n\n你可以使用 `array()` 函数或数组运算符 `[]` 来创建数组。当你想要一次性创建一个新数组并填充多个多个元素时，通常使用 `array()`\
  \ 函数。当你想要从一开始就创建一个只有一个元素的新数组，或者想要向现有的数组元素添加元素时，通常使用数组运算符。\n\n下面的代码片段显示了如何使用 `array()`\
  \ 函数创建一个名为 `$rainbow` 的数组，其中包含了它的各种颜色：\n\n```php\n$rainbow = array(\"red\", \"orange\"\
  , \"yellow\", \"green\", \"blue\", \"indigo\", \"violet\");\n```\n\n下一个片段显示了使用数组运算符增量地创建同一个数组：\n\
  \n```php\n$rainbow[] = \"red\";\n$rainbow[] = \"orange\";\n$rainbow[] = \"yellow\"\
  ;\n$rainbow[] = \"green\";\n$rainbow[] = \"blue\";\n$rainbow[] = \"indigo\";\n$rainbow[]\
  \ = \"violet\";\n```\n\n这两个片段都创建了一个名为 `$rainbow` 的七元素数组，值从索引位置 0 开始到索引位置 6 结束。如果你想写得字面化，可以指定索引位置，如下代码所示：\n\
  \n```php\n$rainbow[0] = \"red\";\n$rainbow[1] = \"orange\";\n$rainbow[2] = \"yellow\"\
  ;\n$rainbow[3] = \"green\";\n$rainbow[4] = \"blue\";\n$rainbow[5] = \"indigo\";\n\
  $rainbow[6] = \"violet\";\n```\n\n然而，在未指定位置时 PHP 会为你处理这些编号，这消除了在顺序重要时可能错误编号元素的可能性，例如所示：\n\
  \n```php\n$rainbow[0] = \"red\";\n$rainbow[1] = \"orange\";\n$rainbow[2] = \"yellow\"\
  ;\n$rainbow[5] = \"green\";\n$rainbow[6] = \"blue\";\n$rainbow[7] = \"indigo\";\n\
  $rainbow[8] = \"violet\";\n```\n\n无论你最初是使用 `array()` 函数还是数组运算符创建数组，你仍然可以使用数组运算符向其添加元素。在下面的代码片段的第一行中向数组添加了六个元素，在第二行在数组末尾又添加了一个元素：\n\
  \n```php\n$rainbow = array(\"red\", \"orange\", \"yellow\", \"green\", \"blue\"\
  , \"indigo\");\n$rainbow[] = \"violet\";\n```\n\n本节使用的示例是数字索引数组，这可能是你见过的最常见的类型。在接下来的两个节中，你将学习两种数组：关联数组和多维数组。\n\
  \n#### 创建关联数组\n\n数字索引数组使用索引位置作为键——0, 1, 2 等，而关联数组使用实际的键。下面的示例通过创建一个包含四个元素的数组 `$character`\
  \ 演示了这一点：\n\n\n\n```php\n$character = array(\n    \"name\" => \"Bob\",\n    \"occupation\"\
  \ => \"superhero\",\n    \"age\" => 30,\n    \"special power\" => \"x-ray vision\"\
  \n);\n```\n\n`$character` 数组中的四个键是 `name`、`occupation`、`age` 和 `special power`。关联的值分别是\
  \ `Bob`、`superhero`、`30` 和 `x-ray vision`。你可以使用特定键引用关联数组的特定元素，如示例所示：\n\n```php\n\
  echo $character['occupation'];\n```\n\n该片段的输出是：\nsuperhero\n\n与数字索引数组一样，你可以使用数组运算符向关联数组添加元素：\n\
  \n```php\n$character['supername'] = \"Mega X-Ray Guy\";\n```\n\n这个示例添加了一个名为 `supername`\
  \ 的键，其值为 `Mega X-Ray Guy`。关联数组与数字索引数组唯一的区别在于键名。在数字索引数组中，键名是数字。在关联数组中，键名是有意义的单词。\n\
  \n#### 创建多维数组\n\n前两种数组存储字符串和整数，而第三种类型存储其他数组。如果一组键值对构成一个维度，那么多维数组包含多组键值对。例如，列表 8.1\
  \ 定义了一个名为 `$characters` 的多维数组，其每个元素包含一个关联数组。这听起来可能混乱，但实际上是一个包含另一个数组的数组。\n\n**列表\
  \ 8.1 定义多维数组**\n\n```php\n<?php\n$characters = array(\n    array(\n        \"name\"\
  \ => \"Bob\",\n        \"occupation\" => \"superhero\",\n        \"age\" => 30,\n\
  \        \"special power\" => \"x-ray vision\"\n    ),\n    array(\n        \"name\"\
  \ => \"Sally\",\n        \"occupation\" => \"superhero\",\n        \"age\" => 24,\n\
  \        \"special power\" => \"superhuman strength\"\n    ),\n    array(\n    \
  \    \"name\" => \"Jane\",\n        \"occupation\" => \"arch villain\",\n      \
  \  \"age\" => 45,\n        \"special power\" => \"nanotechnology\"\n    )\n);\n\
  ```\n\n\n\n\n\n```php\n20:         )\n21:         );\n22: ?>\n```\n\n在第 2 行，`$characters`\
  \ 数组使用 `array()` 函数初始化。第 3–8 行表示第一个元素，第 9–14 行表示第二个元素，第 15–20 行表示第三个元素。这些元素可以通过\
  \ `$characters[0]`、`$characters[1]` 和 `$characters[2]` 来引用。\n\n每个元素都是关联数组，本身包含四个元素：`name`、`occupation`、`age`\
  \ 和 `special_power`。\n\n然而，如果你尝试像这样打印主元素：\n\n```php\necho $characters[1];\n```\n\
  \n输出将是：\n\n`Array`\n\n因为主元素确实包含一个数组作为其内容。要真正获取你想要的内容（即内部数组元素中找到特定信息），你需要访问主元素的索引位置，加上你想要查看的值的关联名称。\n\
  \n看这个示例：\n\n```php\necho $characters[1]['occupation'];\n```\n\n它打印出：\n\n`superhero`\n\
  \n如果你将以下代码添加到 Listing 8.1 代码的末尾，它将打印每个元素中存储的信息，并在浏览器中额外显示一行以供参考：\n\n点击此处查看代码图像\n\
  \n```php\nforeach ($characters as $c) {\n    while (list($k, $v) = each ($c)) {\n\
  \        echo \"$k ... $v <br/>\";\n    }\n    echo \"<hr/>\";\n}\n```\n\n`foreach`\
  \ 循环针对主数组元素 `$characters`。它遍历此数组并将临时名称 `$c` 分配给每个位置包含的元素。接下来，代码开始了一个 `while` 循环。该循环使用两个函数来提取内部数组的内容。首先，`list()`\
  \ 函数命名了占位变量 `$k` 和 `$v`，这些变量将由从 `each()` 函数收集的键和值填充。`each()` 函数查看 `$c` 数组的每个元素并相应提取信息。\n\
  \n`echo` 语句简单地打印使用 `each()` 函数从 `$c` 数组中提取的每个键和值（`$k` 和 `$v`），并为了显示目的添加了换行符。图 8.1\
  \ 显示该文件 `mdarray.php` 的结果。\n\n![image](img/08fig01.jpg)\n\n**图 8.1 遍历多维数组。**\n\n\
  ## 一些数组相关的结构和函数\n\nPHP 构建了 70 多个数组相关的函数，你可以在 [`www.php.net/array`](http://www.php.net/array)\
  \ 详细阅读。本节简要描述了一些常用（且有用）的函数：\n\n*   `count()` 和 `sizeof()`——这两个函数都计算数组中的元素数量；它们是彼此的别名。给定以下数组：\n\
  \n点击此处查看代码图像\n\n```php\n$colors = array(\"blue\", \"black\", \"red\", \"green\"\
  );\n```\n\n`count($colors);` 和 `sizeof($colors);` 都返回值 `4`。\n\n*   `each()` 和 `list()`——这些函数（嗯，`list()`\
  \ 是一个看起来像函数的语言结构）通常一起出现，用于遍历数组并返回其键和值。你之前见过这个示例，其中我们遍历了 `$c` 数组并打印了它的内容。\n\n*  \
  \ `foreach()`——这个控制结构（看起来像一个函数）用于遍历数组，将元素的值赋值给指定的变量，正如你在上一节看到的那样。\n\n*   `reset()`——此函数将指针重置为数组的开头，例如所示：\n\
  \n```php\nreset($character);\n```\n\n当你对数组进行多次操作（如排序、提取值等）时，这个函数非常有用。\n\n*   `array_push()`——此函数向现有数组的末尾添加一个或多个元素，例如所示：\n\
  \n点击此处查看代码图像\n\n```php\narray_push($existingArray, \"element 1\", \"element 2\"\
  , \"element 3\");\n```\n\n*   `array_pop()`——此函数从现有数组中删除（并返回）最后一个元素，例如所示：\n\n点击此处查看代码图像\n\
  \n```php\n$last_element = array_pop($existingArray);\n```\n\n*   `array_unshift()`——此函数向现有数组的开头添加一个或多个元素，例如所示：\n\
  \n点击此处查看代码图像\n\n```php\narray_unshift($existingArray, \"element 1\", \"element 2\"\
  );\n```\n\n*   `array_shift()`——此函数从现有数组中删除（并返回）第一个元素，例如所示：\n\n点击此处查看代码图像\n\n```php\n\
  $first_element = array_shift($existingArray);\n```\n\n*   `array_merge()`——此函数合并两个或多个数组，例如所示：\n\
  \n点击此处查看代码图像\n\n```php\n$newArray = array_merge($array1, $array2);\n```\n\n*   `array_keys()`——此函数返回包含给定数组所有键的数组，例如所示：\n\
  \n点击此处查看代码图像\n\n```php\n$keysArray = array_keys($existingArray);\n```\n\n*   `array_values()`——此函数返回包含给定数组所有值的数组，例如所示：\n\
  \n点击此处查看代码图像\n\n```php\n$valuesArray = array_values($existingArray);\n```\n\n* \
  \  `shuffle()`——此函数随机化给定数组的元素。该语法简单如下：\n\n```php\nshuffle($existingArray);\n```\n\
  \n这些函数的简要介绍只是冰一角。然而，数组和数组函数贯穿本书，你很快就会熟悉。\n\n### 总结\n\n本介绍了数组的概念，包括如何创建和引用。三种数组类型是数值索引数组、关联数组和多维数组。此外，你看到了一些内置函数的示例。你可以使用这些函数来修改现有数组，有时也会创建新的。\n\
  \n### 问答\n\nQ：**多维数组可以有多少个维度？**\n\n答：你可以在多维数组中创建任何你能管理的维度，但记住维度越多，管理越困难。如果数据维度很多，建议考虑是否应该以其他方式存储，例如数据库。\n\
  \nQ：**如果我只是在创建一个表单，我为什么要关心数组？**\n\n答：即使在最基本的客户端-服务器交互中（如网站上的表单），数组也是很有用的。你将在第 1\
  \ 章“处理表单(#ch11.html_ch11)”中学习更多知识，但在处理该章节的信息之前，请记住：如果你的表单包含任何允许用户选择多个选项的选框或列表，这些数据将以数组的形式发送到表单。如果你想处理这些数据，你需要将其从数组中提取出来，本章展示了一些基础示例。\n\
  \n### 实验\n\n实验旨在帮助你回顾所学知识并开始付实践。\n\n#### 测验\n\n1. 你使用哪种结构来定义数组？\n2. 你使用哪个函数来合并两个数组？\n\
  \n#### 答案\n\n1. `array()`\n2. `array_merge()`\n\n#### 活动\n\n\n\n\n\n1. 复习定义多维数组以及引用其项的过程。\n\
  \n2. 创建一个按类型分类的电影多维数组。这应该是一个关联数组的形式，以类型作为键，例如 `Science Fiction`、`Action`、`Adventure`等。数组的每个元素都应该是一个包含电影名称的数组，例如\
  \ `Alien`、`Terminator 3`、`Star Wars`等。创建数组后，遍历它们并打印每个类型的名称及其关联的电影。\n\n# 第 9 章：使用对象工作\n\
  \n在本章中，你将学习以下内容：\n\n- **对象的内存结构**\n- **如何创建和操作对象以及它们包含的数据**\n\n程序员使用对象来存储和组织数据。面向对象编程是一种编程类型，程序（或应用程序）的结构是围绕这些对象及其关系和交互而设计的。面向对象编程的结构存在于许多编程语言中，在\
  \ PHP 中也显而易见。事实上，许多 PHP 程序员——尤其是那些具有深厚面向对象编程背景的人——选择以面向对象的方式开发 PHP 应用程序。\n\n然而，在\
  \ PHP 中，并不要求你以面向对象的方式编写脚本。许多 PHP 脚本，实际上本书中的大部分脚本都是过程化和函数化的，而不是面向对象的。也就是说，重点在于在创建过程中逐步使用变量、数据、控制结构以及子程序和函数。之所以之所以，，仅仅是因为：如果你对编程完全是新手，那么在处理一个本身就有大量书籍介绍的编程范式之前，在过程化编程和语言基础方面获得经验是关重要的。本章将让你简要了解对象世界，因为在你继续积累更多技能和经验时，这是一个需要熟悉的重要数据类型和概念。\n\
  \n> 注意\n如果你是带有面向对象编程背景学习 PHP 的，本章将帮助你理解 PHP 中的对象模型。\n\n## 创建对象\n\n如果你从未遇到过对象的概念，那么解释对象的概念会有点困难，因为它本质上是抽象的：它是某种理论上的容器——包含变量、函数等——存在于一个名为\
  \ `class` 的模板化结构中。虽然很容易具象化一个标量变量（例如值为 `red` 的 `$color`）或一个包含三个或四个不同元素的数组 `$character`），但有些人发现在具象化对象时感到很困难。\n\
  \n现在，尝试将对象想象成一个两边都有输入和输出的小盒子。输入机制是 `methods`，而方法具有属性。在这一节中，我们将查看类、方法和属性如何协同工作产生各种输出。\n\
  \n> 注意\n如果类的概念对你来说完全陌星，你可以通过阅读 PHP 手册中的“Classes and Objects”章节来补充你的知识。你可以在 [`www.php.net/manual/en/language.oop5.php`](http://www.php.net/manual/en/language.oop5.php)\
  \ 找到它。\n\n如前所述，对象存在于一个名为 `class` 的结构中。在每个类中，你定义了一组特征。例如，假设你创建了一个 `automobile` 类。在\
  \ `automobile` 类中，你可能有 `color`、`make` 和 `model` 特征。每个 `automobile` 对象使用所有的特征，但每个对象将特征初始化为不同的值，例如\
  \ `silver`、`Mazda` 和 `Protege5`，或者 `red`、`Porsche` 和 `Boxter`。\n\n使用对象的目的是创建可重用的代码。因为类结构紧密但自包含且相互独立，你可以将它们从一个应用程序复用到另一个应用程序。例如，假设你为一个项目编写了一个文本格式化类，并决定可以在另一个项目中使用该类。因为类只是一组特征，你可以获取这些代码并将其用于第二个项目，通过特定于第二个应用程序的方法对其进行调用，但使用现有代码的内部机制来实现新的结果。\n\
  \n创建对象是简单的；你只需要声明它的存在即可：\n\n```php\nclass myClass {\n    //code will go here\n}\n\
  ```\n\n现在你有了一个类，就可以创建一个新的对象实例了：\n\n```php\n$object1 = new myClass();\n```\n\n在 列表\
  \ 9.1 中，你有证明你的对象已经存在，尽管里面什么都没有——它只是被命名了。\n\n**列表 9.1** 证明你的对象存在\n\n点击此此处查看代码图片\n\
  \n```php\n1:  <?php\n2:  class myClass {\n3:      //code will go here\n4:  }\n5:\
  \  $object1 = new myClass();\n6:  echo \"\\$object1 is an \".gettype($object1).\"\
  .<br/>\";\n7:\n8:  if (is_object($object1)) {\n9:      echo \"Really! I swear \\\
  $object1 is an object!\";\n10: }\n11: ?>\n```\n\n如果你将此代码保存为 `proofofclass.php`，将其放在文档根目录下，并使用网络浏览器访问它，你将在屏幕上看到以下内容：\n\
  \n点击此此处查看代码图片\n\n$object1 is an object.\n\nReally! I swear $object1 is an object!\n\
  \n这不是一个特别实用的类，因为它什么都没做，但它是有效的并向你展示了第 2–5 行类模板是如何工作的。第 8–10 行使用 `is_object()` 函数测试某个东西是否为对象；在这种情况下，*某个东西*就是\
  \ `$object1`。因为 `is_object()` 的测试结果为 `true`，`if` 语句中的字符串被打印到屏幕上。\n\n接下来，你学习在类模板中使用对象属性和方法。\n\
  \n### 对象的属性\n\n在对象内部定义的变量被称为 `properties`（属性）。在类的顶部声明变量是标准做法。这些属性可以是值、数组，甚至是其他对象。下面的代码段在类内部使用了简单的标量变量，并以\
  \ `public` 关键字前缀：\n\n```php\nclass myCar {\n    public$color = \"silver\";\n   \
  \ public$make = \"Mazda\";\n    public$model = \"Protege5\";\n}\n```\n\n> 注意\n在变量名之前使用\
  \ `public`、`protected` 或 `private`，你可以指示类成员（变量）是否可以在任何地方访问（public）、类内部或父类内部（protected），或仅限类本身（private）。\n\
  \n现在当你创建一个 `myCar` 对象时，它将始终拥有这些属性。列表 9.2 向你展示了如何在声明并赋值后访问属性。\n\n**列表 9.2** 显示属性\n\
  \n点击此此处查看代码图片\n\n```php\n1:  <?php\n2:  class myCar {\n3:      public$color = \"\
  silver\";\n4:      public$make = \"Mazda\";\n5:      public$model = \"Protege5\"\
  ;\n6:  }\n7:  $car = new myCar();\n8:  echo \"I drive a: \".$car -> color.\" \"\
  .$car -> make.\" \".$car -> model;\n9: ?>\n```\n\n如果你将此代码保存为 `objproperties.php`，将其放在文档根目录下，并使用网络浏览器访问它，你将在屏幕上看到以下内容：\n\
  \nI drive a: silver Mazda Protege5\n\n由于开一辆银色的 Mazda Protege5 的概率很低，你想修改 `myCar`\
  \ 对象的属性。列表 9.3 向你展示了如何这样做。\n\n**列表 9.3** 修改对象属性\n\n点击此此处查看代码图片\n\n```php\n1:  <?php\n\
  2:  class myCar {\n3:      public$color = \"silver\";\n4:      public$make = \"\
  Mazda\";\n5:      public$model = \"Protege5\";\n6:  }\n7:  $car = new myCar();\n\
  8:  $car -> color = \"red\";\n9:  $car -> make = \"Porsche\";\n10: $car -> model\
  \ = \"Boxter\";\n```\n\n\n\n\n```php\n11: echo \"I drive a: \".$car -> color.\"\
  \ \".$car -> make.\" \".$car -> model;\n12: ?>\n```\n\n如果你将此代码保存为 `objproperties2.php`，将其放在文档根目录下，并使用\
  \ 浏览器访问它，你将在屏幕上看到以下内容：\n\n我开着一辆：红色的保时捷 Boxster\n\n### 注意\n\n在此例中，即使 `$color`、`$make`\
  \ 和 `$model` 属性在声明时没有初始值，第 8–10 行也会为它们赋值。只要属性已经声明，你就可以在稍后的时候使用它们（无论是否有初始值）。\n\n\
  列表 9.3 的目的是为了，只要你有一个定义良好的属性类，你仍然轻松地更改属性的值以适应你的需求。\n\n### 对象方法\n\n方法为你的对象添加功能。你的对象不再仅仅是停留在那里，死命守护着它们的属性——它们实际上会做一些事情！列表\
  \ 9.4 展示了这一点。\n\n**列表 9.4** 带有方法的类\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: class myClass\
  \ {\n3:     function sayHello() {\n4:             echo \"HELLO!\";\n5:     }\n6:\
  \ }\n7: $object1 = new myClass();\n8: $object1 -> sayHello();\n9: ?>\n```\n\n虽然这不是一个最刺激的动作示例，但如果你将此代码保存为\
  \ `helloclass.php`，将其放在文档根目录下，并使用 浏览器访问它，你将在屏幕上看到以下内容：\n\nHELLO!\n\n方法看起来和作用起来像普通函数，但它定义在类的框架之内。`->`\
  \ 运算符用于在脚本上下文中调用对象方法。如果对象中存储了任何变量，该方法将能够为了自己的目的访问这些变量，如 列表 9.5 所示。\n\n**列表 9.5**\
  \ 在方法内部访问类属性\n\n点击此处查看代码图像\n\n```php\n1:  <?php\n2:  class myClass {\n3:      public$name\
  \ = \"Jimbo\";\n4:      function sayHello() {\n5:             echo \"HELLO! My name\
  \ is \".$this->name;\n6:      }\n7:  }\n8:  $object1 = new myClass();\n9:  $object1\
  \ -> sayHello();\n10: ?>\n```\n\n如果你将此代码保存为 `helloclass2.php`，将其放在文档根目录下，并使用 浏览器访问它，你将在屏幕上看到以下内容：\n\
  \nHELLO! My name is Jimbo\n\n特殊变量 `$this` 用于引用当前实例化的对象，正如你在第 5 行所示。每当对象引用自身时，你必须使用\
  \ `$this` 变量。将 `$this` 变量与 `->` 运算符结合，可以在类内部访问类中的任何属性或方法。\n\n关于操作对象属性基础知识的最后一个小知识是如何从方法内部更改属性。之前，属性的值是在包含它的方法之外更改的。列表\
  \ 9.6 展示了如何从方法内部进行更改。\n\n**列表 9.6** 从方法内部更改属性的值\n\n点击此处查看代码图像\n\n```php\n1: <?php\n\
  2: class myClass {\n3:     public$name = \"Jimbo\";\n4:     function setName($n)\
  \ {\n5:             $this->name = $n;\n6:     }\n7:     function sayHello() {\n\
  8:             echo \"HELLO! My name is \".$this->name;\n9:     }\n10: }\n11: $object1\
  \ = new myClass();\n12: $object1 -> setName(\"Julie\");\n13: $object1 -> sayHello();\n\
  14: ?>\n```\n\n如果你将此代码保存为 `helloclass3.php`，将其放在文档根目录下，并使用 浏览器访问它，你将在屏幕上看到以下内容：\n\
  \nHELLO! My name is Julie\n\n为什么为什么？因为在第 4–6 行创建了一个名为 `setName()` 的新函数。当它在第 12 行被调用时，它更改了\
  \ `$name` 的值。\n\n### 构造函数\n\n构造函数是存在于类中的函数，并在创建类的新实例时自动被调用。使用构造函数允许你为类提供参数。\n\n\
  ## 对象继承\n\n在学习了对象、属性和方法的基础知识后，你就可以开始继承了。类的继承正如其名：一个类继承自它的父类。列表 9.7 展示了一个示例。\n\n\
  **列表 9.7** 继承自父类的类\n\n点击此处查看代码图像\n\n```php\n1:  <?php\n2:  class myClass {\n3: \
  \     public$name = \"Matt\";\n4:      function myClass($n) {\n5:             $this->name\
  \ = $n;\n6:      }\n7:      function sayHello() {\n8:             echo \"HELLO!\
  \ My name is \".$this->name;\n9:      }\n10: }\n11: class childClass extends myClass\
  \ {\n12: // 在此处编写代码\n13: }\n14: $object1 = new myClass(\"Baby Matt\");\n15: $object1\
  \ -> sayHello();\n16: ?>\n```\n\n列表 9.8 展示了子类如何覆盖父类方法的最后一个示例。\n\n**列表 9.8** 子类覆盖其父类的方法\n\
  \n点击此处查看代码图像\n\n```php\n1:  <?php\n2:  class myClass {\n3:      public$name = \"\
  Matt\";\n4:      function myClass($n) {\n5:             $this->name = $n;\n6:  \
  \    }\n7:      function sayHello() {\n8:             echo \"HELLO! My name is \"\
  .$this->name;\n9:      }\n10: }\n11: class childClass extends myClass {\n12:   \
  \  function sayHello() {\n13:             echo \"I will not tell you my name.\"\
  ;\n14:     }\n15: }\n16: $object1 = new childClass(\"Baby Matt\");\n17: $object1\
  \ -> sayHello();\n18: ?>\n```\n\n此代码相对于 列表 9.7 的唯一变化是新增的第 12–14 行。在这些行中，创建了一个名为\
  \ `sayHello()` 的函数，它不再打印 `HELLO! My name is...`，而是打印 `I will not tell you my name.`。由于\
  \ `sayHello()` 函数现在存在于 `childClass` 中，且第 16 行的是 `childClass`，因此使用的是它的 `sayHello()`\
  \ 版本。\n\n\n\n\n\n像大多数面向对象编程的元素一样，继承在尝试让代码具有灵活性时非常有用。假设你创建了一个文本格式化类，用于组织和存储数据、将其格式化为\
  \ HTML，并将结果输出到浏览器——这是你个人的杰作之作。现在，假设你有一个客户想使用这个概念，但他不想将内容格式化为 HTML 并发送到浏览器，而是想格式化为纯文本并保存到文本文件中。没问题；你只需要添加几个方法和属性就搞定了。最后，客户又回来了，说他真的想将数据格式化并作为电子邮件发送——然后，见鬼了，为什么不干脆创建\
  \ XML 格式的文件呢？\n\n尽管你可能气得想抓头发，但你的处境其实并不糟糕。如果你将编译和存储类与格式化类分离来——为每种不同的交付方式（HTML、文本、电子邮件、XML）各准备一个类——你本质上就拥有了父子关系。将父类视为持有编译和存储方法的类。格式化类就是子类：它们继承父类的信息，并根据自身的功能输出结果。大家共赢。\n\
  \n### 总结\n\n本章为处理面向对象代码奠定了基础。这些内容完全没有涵盖面向对象编程的所有方面。大学里教授有一整系列关于这个主题的课程（这里不是指编程上的“类”），所以你可以想象这些页面内容有点单薄。不过，你确实学会了创建类并从类中实例化对象。你学会了如何创建和访问类的属性和方法，如何构建新类，以及如何从父类继承特性。这已经很不错了！\n\
  \n### 问答\n\n**Q. 为什么我在属性声明中看到的是 `var` 而不是 `public`、`private` 或 `protected`？**\n\n\
  **A.** 在 PHP 的早期版本中，`var` 用于在类中声明属性。为了向后兼容，如果你使用的代码中仍包含 `var`，它会被视为 `public` 且不会引起错误（除非你想让成为\
  \ `private` 或 `protected` 属性）。\n\n**Q. 为了成为优秀的 PHP 程序员甚至为了完成这本书，我必须理解面向对象编程吗？**\n\
  \n**A.** 完全不需要。事实上，此书中的项目本质上是过程化或函数化的，并不包含面向对象编程。面向对象编程是一种组织方法，旨在提高构成特定应用程序代码的可重用性和扩展性。在开发的初始阶段，你可能对项目的了解还不足，无法完全为面向对象设计进行规划。当项目完成——或者至少接近一个稳固的状态时——你可能会开始看到可以采用面向对象方法的领域，并可能开始将你的代码组合成类、属性和方法。但在大多数情况下，你不会以面向对象的方式编写执行特定职责的简单脚本，除非你的背景确实如此且这对你来说是理所当然的。关于\
  \ PHP 对象模型的更多信息，请参阅 PHP 手册的相应部分：[`www.php.net/manual/en/language.oop5.php`](http://www.php.net/manual/en/language.oop5.php)。\n\
  \n### 工作坊\n\n工作坊旨在帮助你复习所学内容并开始将知识付诸实践。\n\n#### 测验\n\n**[1].** 如何声明一个名为 `emptyClass`\
  \ 且没有方法或属性的类？\n\n**[2].** 你如何为构造方法选择名称？\n\n**[3].** 如果一个变量被声明为 `private`，它可以在哪里使用？\n\
  \n#### 答案\n\n**[1].** 使用 `class` 关键字：\n\n```php\nclass emptyClass {\n\n}\n```\n\n\
  **[2].** 你不需要——构造方法的命名与其所属的类同名。\n\n**[3].** 声明为 `private` 的变量只能在类内部使用。\n\n#### 活动\n\
  \n**1.** 创建一个名为 `baseCalc()` 的类，存储两个数字作为属性。接着创建一个 `calculate()` 方法将数字打印到浏览器。\n\n\
  **2.** 现在创建名为 `addCalc()`、`subCalc()`、`mulCalc()` 和 `divCalc()` 的类，它们继承 `baseCalc()`\
  \ 的功能，但重写 `calculate()` 方法并将相应的总和打印到浏览器。\n\n# 第三部分：参与代码编写\n\n# 第 10 章：处理字符串、日期和时间\n\
  \n***在本章中，你将学习到以下内容：***\n\n- **如何格式化字符串**\n- **如何确定字符串的长度**\n- **如何在字符串中查找子字符串**\n\
  - **如何将字符串拆分为各个组件部分**\n- **如何删除字符串首尾的空格**\n- **如何替换子字符串**\n- **如何更改字符串的大小写**\n-\
  \ **如何获取当前日期和时间**\n- **如何获取有关日期时间的信息**\n- **如何格式化日期时间信息**\n- **如何测试日期的有效性**\n- **如何设置日期和时间**\n\
  \n无论你的网页内容多么丰富，它的核心只是告诉浏览器如何渲染内容的 HTML。因此，PHP 提供了许多用于格式化字符串的函数，并非偶然。同样，日期和时间是生活中如此的一部分，以至于使用它们变得很容易。然而，由于格里哥历的特性难以处理，PHP\
  \ 提供了强大的工具让日期操作变成了一项简单的任务。\n\n在处理字符串、日期和时间方面，有许多 PHP 函数供你使用，本章甚至还没有涵盖所有的函数。然而，本章确实为使用基础字符串、日期和时间奠定了基础，并让你了解如何在代码中开始思考这类函数。经验法是：如果你想转换、处理或显示字符串、日期或时间，在先访问\
  \ PHP 手册之前不要自己编写解决方案，因为很有可能已经存在适用于你任务的函数。\n\n## 使用 PHP 格式化字符串\n\n在此为止，你只是直接将要显示的字符串以原始状态打印到浏览器。PHP\
  \ 提供了两个允许应用格式化的函数，无论是将浮点数保留到给定的小位数、定义字段内的对齐，还是根据不同的数字系统显示数据。在本节中，你将学习 `printf()`\
  \ 和 `sprintf()` 提供的一些格式化选项。\n\n#### 使用 `printf()`\n\n如果你有任何 C 类编程语言的经验，你可能熟悉 `printf()`\
  \ 函数的概念。`printf()` 函数需要一个字符串参数，被称为*格式字符串*。它还接受不同类型的附加参数，你将在稍后了解到。格式控制字符串包含了关于如何显示这些附加参数的指令。例如，下面的片段使用\
  \ `printf()` 将整数作为八进制（或基 8）数字输出：\n\n```php\n<?php\n\nprintf(\"This is my number:\
  \ %o\", 55);\n\n// 输出 \"This is my number: 67\"\n\n?>\n```\n\n\n\n\n\n```php\n<?php\n\
  printf(\"First number: %f<br/>Second number: %f<br/>\", 55, 66);\n// Prints:\n//\
  \ First number: 55.000000\n// Second number: 66.000000\n?>\n```\n\n第一个转换说明符对应 `printf()`\
  \ 的第一个附加参数，即 `55\\.`。第二个转换说明符对应 `66`。百分比符号后面的 `f` 要求将数据视为浮点数。转换说明符的这被称为`类型指定符`（type\
  \ specifier）。\n\n## `printf()` 和类型指定符\n\n你已经遇到过两个类型指定符：`o`（将整数显示为八进制）和 `f`（将整数显示为浮点数）。表\
  \ 10.1 列出了其他可类型指定符。\n\n**表 10.1 类型指定符**\n\n![image](img/10tab01.jpg)\n\n列表 10.1\
  \ 使用 `printf()` 根据 表 10.1 中列出的某些类型指定符显示单个数字。注意，该列表不仅向格式控制字符串中添加了转换说明符，包含的任何额外文本也会打印。\n\
  \n**列表 10.1** 演示某些类型指定符\n\n点击此处查看代码图像\n\n* * *\n\n```php\n1:  <?php\n2:  $number\
  \ = 543;\n3:  printf(\"Decimal: %d<br/>\", $number);\n4:  printf(\"Binary: %b<br/>\"\
  , $number);\n5:  printf(\"Double: %f<br/>\", $number);\n6:  printf(\"Octal: %o<br/>\"\
  , $number);\n7:  printf(\"String: %s<br/>\", $number);\n8:  printf(\"Hex (lower):\
  \ %x<br/>\", $number);\n9:  printf(\"Hex (upper): %X<br/>\", $number);\n10: ?>\n\
  ```\n\n* * *\n\n将这些行放入名为 `printftest.php` 的文本文件中，并将此文件放在你的 Web 服务器文档根目录下。当你通过浏览器访问此脚本时，它看起来应该像\
  \ 图 10.1。如你所示，`printf()`是将数据从一种数字系统转换为另一种并输出结果的快速方法。\n\n![image](img/10fig01.jpg)\n\
  \n**图 10.1 演示转换说明符。**\n\n在 HTML 中指定颜色时，你组合三个 00 到 FF 之间的十六进制数，代表红、绿、蓝的值。你可以使用 `printf()`\
  \ 将 0 到 255 之间的三个十进制数转换为相应的十六进制数：\n\n```php\n<?php\n$red = 204;\n$green = 204;\n\
  $blue = 204;\nprintf(\"#%X%X%X\", $red, $green, $blue);\n// prints \"#CCCCCC\"\n\
  ?>\n```\n\n虽然你可以使用类型指定符将十进制转换为十六进制数，但你不能用它来确定每个参数的输出应该占据多少字符。在 HTML 颜色代码中，每个十六进制数应该填充为两个字符，如果你将上一个片段中的\
  \ `$red`、`$green` 和 `$blue` 变量改为 1，就会出现问题。你最终得到的输出是 `#111`。你可以通过使用填充填充指定符（padding\
  \ specifier）来强制输出前导零。\n\n### 使用填充指定符填充输出\n\n你可以要求输出由开头字符进行填充。填充指定符应直接跟在开始转换说明符的百分比符号后面。要用开头零填充输出，填充指定符应由一个零加上你希望输出占据的字符数组成。如果输出占据的字符少于此总数，则用零填充差异：\n\
  \n```php\n<?php\nprintf(\"%04d\", 36);\n// prints \"0036\"\n?>\n```\n\n要用开头空格填充输出，填充指定符应由一个空格字符加上输出应该占据的字符数组成：\n\
  \n```php\n<?php\nprintf(\"% 4d\", 36)\n// prints \"  36\"\n?>\n```\n\n* * *\n\n\
  提示\n\n浏览器不会在 HTML 文档中显示多个空格。你可以通过在输出周围放置 `<pre>` 标签来强制显示空格和换行：\n\n点击此处查看代码图像\n\n\
  ```html\n<pre>\n<?php\necho \"The      spaces       will be visible\";\n?>\n</pre>\n\
  ```\n\n如果你想将整个文档格式化为文本，可以使用 `header()` 函数更改 Content-Type 头部：\n\n```\nheader(\"Content-Type:\
  \ text/plain\");\n```\n\n记住，你的脚本必须没有向浏览器发送任何输出，`header()` 函数才能按预期方式工作。\n\n* * *\n\
  \n你可以在填充指定符中使用除空格或零以外的任何字符，方法是在一个单引号后跟你想要使用的字符：\n\n```php\n<?php\nprintf (\"%'x\"\
  , 36);\n// prints \"xxxx36\"\n?>\n```\n\n你现在已经有了完成示例所需的工具。\n\n### 指定宽度\n\n你可以指定你的输出所处的的范围（即空格数量）。`字段指定符`（field\
  \ specifier）是一个整数，应该放置在开始转换说明符的百分比符号之后（假设没有定义填充指定符）。为了使空格可见，请将输出放在 `<pre>` 中：\n\n\
  ```html\n<pre>\n<?php\nprintf(\"%20s\", \"Books\");\nprintf(\"%20s\", \"CDs\");\n\
  printf(\"%20s\", \"DVDs\");\nprintf(\"%20s\", \"Games\");\nprintf(\"%20s\", \"Magazines\"\
  );\n?>\n</pre>\n```\n\n图 10.2 显示此片段的输出。\n\n![image](img/10fig02.jpg)\n\n**图 10.2\
  \ 字段宽度对齐。**\n\n默认情况下，输出在你指定的字段内是右对齐。你可以通过在字段指定符前面加一个连字符来使其左对齐。注意，对齐适用于任何数字。换句话说，小数点之前的部分将紧贴字段末尾。\n\
  \n### 指定精度\n\n如果你想以浮点格式输出数据，可以指定你想舍入的精度。这在处理货币时特别有用。精度标识符应该放在类型指定符之前。它由一个小数点加上小数位数组成。\n\
  \n```php\n<?php\nprintf(\"%.2f\", 5.3333);\n// prints \"5.33\"\n?>\n```\n\n* * *\n\
  \n注意\n\n在 C 语言中，可以使用精度指定符配合 `printf()` 指定十进制输出的填充。精度对十进制输出没有影响。使用填充指定符为整数添加前导零。\n\
  \n* * *\n\n## 转换说明符：回顾\n\n表 10.2 列出了构成转换说明符的组件，按包含的顺序排列。注意，同时使用填充指定符和字段指定符是困难的。你应该选择使用其中一个而不是两者都用。\n\
  \n**表 10.2 转换说明符的组件**\n\n![image](img/10tab02.jpg)\n\n列表 10.2 使用 `printf()` 输出产品列表。\n\
  \n**列表 10.2 使用 printf() 格式化价格列表**\n\n```php\n<?php\n$products = array(\n    \"Green\
  \ armchair\" => \"222.4\",\n    \"Candlestick\" => \"4\",\n    \"Coffee table\"\
  \ => \"80.6\"\n);\necho \"<pre>\";\nprintf(\"%-20s%20s\\n\", \"Name\", \"Price\"\
  );\nprintf(\"%'-40s\\n\", \"\");\nforeach ($products as $key=>$val) {\n    printf(\
  \ \"%-20s%20.2f\\n\", $key, $val );\n}\necho \"</pre>\";\n?>\n```\n\n\n\n该列表首先在第\
  \ 2 到第 4 行定义了一个包含产品名称和价格的关联数组。第 5 行打印了 `pre` 元素的起始标签，以便浏览器能够识别空格和换行符。第 6 行的第一次 `printf()`\
  \ 调用使用了以下格式控制字符串：\n\n```\n\"%-20s%20s\\n\"\n```\n\n格式控制字符串中的第一个转换规范符（`\"%-20s\"\
  `）定义了一个 20 个字符的宽度指定符，且输出左对齐。同时也使用了字符串类型指定符。第二个转换规范符（`\"%20s\"`）设置了右对齐的字段宽度。此 `printf()`\
  \ 调用输出了我们的字段头。\n\n第 7 行的第二个 `printf()` 调用绘制包含 `-` 字符的行，宽度为 40 个字符。你通过填充指定符来实现，它向空字符串添加填充。\n\
  \n### 使用循环格式化输出\n\n第 9 行的最后一个 `printf()` 调用是 `foreach` 语句的一部分，该语句遍历产品数组。代码在这里使用了两个转换规范符——第一个（`\"\
  %–20s\"`）将产品名称作为字符串在 20 个字符的字段内左对齐打印，第二个（`\"%20.2f\"`）使用字段宽度指定符确保输出在 20 个字符的字段内右对齐。它还使用了精度指定符来确保输出保留两位小数。\n\
  \n将这些行放入存名为 `printftest2.php` 的文本文件中，并将此文件放置在你的 Web 服务器文档根目录中。当你通过 浏览器访问此脚本时，它看起来应该像图\
  \ 10.3。\n\n![image](img/10fig03.jpg)\n\n**图 10.3 使用 printf() 格式化的产品和价格。**\n\n####\
  \ 参数交换\n\n假设你正在向浏览器打印日期。如下所示所示，假设日期存储在一个多维数组中，并且正在使用 `printf()` 来格式化输出：\n\n点击此处查看代码图像\n\
  \n```php\n<?php\n\n$dates = array(\n    array('mon'=> 12, 'mday'=>25, 'year'=>2011),\n\
  \    array('mon'=>  1, 'mday'=>23, 'year'=>2012),\n    array('mon'=> 10, 'mday'=>29,\
  \ 'year'=>2011)\n);\n\n$format = include(\"local_format.php\");\n\nforeach($dates\
  \ as $date) {\n    printf(\"$format\", $date['mon'], $date['mday'], $date['year']);\n\
  }\n\n?>\n```\n\n在前面的代码段中，格式控制字符串来自名为 `local_format.php` 的包含文件。假设该文件仅包含\n\n```php\n\
  <?php\n\nreturn \"%02d/%02d/%d<br/>\";\n\n?>\n```\n\n输出将以 `mm/dd/yyyy:` 的格式呈现：\n\
  \n12/25/2011\n\n01/23/2012\n\n10/29/2011\n\n现在想象你正在为一个欧洲网站安装脚本，该网站日期的常见表示方式是日在月份之前\
  \ (dd/mm/yyyy)。假设核心代码已经写死且无法更改。你该怎么办？幸运的是，你现在可以通过更改格式控制代码内部的 `return` 语句来改变参数呈现的顺序，将其改为：\n\
  \n```php\nreturn \"%2\\$02d/%1\\$02d/%3\\$d<br/>\";\n```\n\n你可以在标记每个转换规范符的初始百分比字符之后插入感兴趣的参数编号，后面跟一个转义的美元符号\
  \ ($) 字符。因此，在片段中，你要求第二个参数呈现为\n\n`%2\\$02d`\n\n随后是第一个参数：\n\n`%1\\$02d`\n\n并以第三个参数结束：\n\
  \n`%3\\$d`\n\n新代码的结果是英式格式的日期列表：\n\n25/12/2011\n\n23/01/2012\n\n29/10/2011\n\n####\
  \ 存储格式化字符串\n\n`printf()` 函数将数据输出到浏览器，这意味着结果对你的脚本是不可用的。然而，你可以使用 `sprintf()` 函数，它的用法与\
  \ `printf()` ，不同在于它返回一个可以存储在变量中供稍后使用的字符串。以下片段使用 `sprintf()` 将双浮数四舍五入到两位小数，并将结果存储在\
  \ `$cash` 中：\n\n```php\n<?php\n\n$cash = sprintf(\"%.2f\", 21.334454);\n\necho \"\
  You have \\$$cash to spend.\";\n\n// 打印 \"You have $21.33 to spend.\"\n\n?>\n```\n\
  \n`sprintf()` 的一个特殊用法是将格式化后的数据写入文件——你可以调用 `sprintf()` 并将其返回值赋值给变量，然后可以使用 `fputs()`\
  \ 将其打印到文件。\n\n## 在 PHP 中研究字符串\n\n你并不总是了解正在处理的数据的一切。字符串可能来自许多来源，包括用户输入、数据库、文件和网页。在开始处理来自外部源的数据之前，你通常需要获取更多关于数据的信息。PHP\
  \ 提供了许多函数，允许你获取有关字符串的信息。\n\n#### 关于字符串索引的说明\n\n本书在提到字符串时经常使用*索引*（index）一词。你已经在与字符串相关的方面遇到过这个词。你已经在数组的上下文中遇到过这个词，如\
  \ 8 章。 事实上，字符串和数组并不不同，你可以像访问数组元素一样访问字符串的字符：\n\n```php\n<?php\n\n$test = \"coder\"\
  ;\n\necho $test[0]; // 输出 c\n\necho $test[4]; // 输出 r\n\n?>\n```\n\n请记住，当我们在讨论字符串的位置或索引时，字符的数组元素的索引值为\
  \ `0` 而不是 `1`。\n\n#### 使用 strlen() 获取字符串长度\n\n你可以使用 `strlen()` 函数确定字符串的长度。该函数接受字符串作为参数，并返回字符串中字符的个数。`strlen()`\
  \ 可能用于检查用户输入，如下片段所示，它测试了一个成员代码：\n\n```php\n<?php\n\n$membership = \"AB7\";\n\nif\
  \ (strlen($membership) == 4) {\n    echo \"<p>Thank you!</p>\";\n} else {\n    echo\
  \ \"<p>Your membership must be four characters long.</p>\";\n}\n\n?>\n```\n\n只有当\
  \ `$membership` 拥有长度为四的字符串时，用户才会收到感谢信息。\n\n你可以使用 `strstr()` 函数测试一个字符串是否存在于另一个字符串中。该函数需要两个参数：源字符串和你想在其中查找的子字符串。如果找不到子字符串，该函数返回\
  \ `false`；否则，它返回从子字符串开始的源字符串部分。对于下面的示例，假设你想对包含字符串 `AB` 的成员代码进行不同的处理：\n\n```php\n\
  <?php\n\n$membership = \"AB7\";\n\nif (strstr($membership, \"AB\")) {\n    echo\
  \ \"<p>Your membership expires soon!</p>\";\n} else {\n    echo \"<p>Thank you!</p>\"\
  ;\n}\n\n?>\n```\n\n因为 `$membership` 变量的值包含子字符串 `AB`，`strstr()` 函数返回 `AB7`。该函数在测试时为\
  \ `true`，因此代码打印了相应的消息，“Your membership expires soon!”。但如果你搜索 `\"pab7\"` 会怎样？由于 `strstr()`\
  \ 是区分大小写的，`AB` 将无法被找到。`if` 语句的原始测试将失败，并在浏览器打印默认消息（`Thank you!`）。如果你想在字符串中搜索 `AB`\
  \ 或 `ab`，你必须使用 `strstr()` 代替 `substr()`；该函数的用法完全相同，但它的搜索不区分大小写。\n\n#### 使用 strpos()\
  \ Find 子字符串的位置\n\n\n\n\n\n`strpos()` 函数可以告诉你一个字符串是否存在于另一个较大的字符串中，以及它所在的位置。`strpos()`\
  \ 函数需要两个参数：源字符串和你要查找的子字符串。该函数还接受一个可选的第三参数，一个表示从哪个索引开始的整数。如果子字符串不存在，`strpos()` 返回\
  \ `false`；否则，它返回子字符串开始的索引。以下片段使用 `strpos()` 来确保字符串以 `mz` 开头：\n\n点击此处查看代码图片\n\n```php\n\
  <?php\n$membership = \"mz00xyz\";\n\nif (strpos($membership, \"mz\") === 0) {\n\
  \   echo \"Hello mz!\";\n}\n?>\n```\n\n注意为了获得预期结果而必须采用的小技巧。尽管 `strpos()` 函数在字符串中找到了\
  \ `mz`，但它找到的是第一个元素——即 0 位置。返回 0 在 `if` 条件测试中会被解析为 `false`。为了绕过这个问题，代码使用了全等运算符 `===`，当左右操作数等值且类型相同时（在本例中正是如此），它将返回\
  \ `true`。\n\n这只是旨在用于“大海捞针”的与字符串相关函数的多种变体之一。访问该函数的 PHP 手册页面，可以找到许多其他相关函数的链接。\n\n\
  ### 使用 `substr()` 提取字符串的一部分\n\n`substr()` 函数根据你所查找的字符的起始索引和长度返回字符串。此函数需要两个参数：源字符串和起始索引。使用这些参数，函数将返回从起始索引到搜索字符串结尾的所有字符。你也可以（可选地）提供第三个参数——一个表示要返回字符串长度的整数。如果存在第三个参数，`substr()`\
  \ 只返回从起始索引开始的指定数量字符：\n\n点击此处查看代码图片\n\n```php\n<?php\n$test = \"phpcoder\";\n\necho\
  \ substr($test,3).\"<br/>\";  // 输出 \"coder\"\necho substr($test,3,2).\"<br/>\"\
  ; // 输出 \"co\"\n?>\n```\n\n如果你向 `substr()` 传递一个负数作为第二个（起始索引）参数，它将从字符串末尾而不是开头开始计数。以下片段向提交了以\
  \ `.fr` 结尾电子邮件地址的人写入特定消息：\n\n点击此处查看代码图片\n\n```php\n<?php\n$test = \"pierre@wanadoo.fr\"\
  ;\n\nif ($test = substr($test, -3) == \".fr\") {\n   echo \"<p>Bonjour! Nous avons\
  \ des prix spéciaux de vous.</p>\";\n} else {\n   echo \"<p>Welcome to our store.</p>\"\
  ;\n}\n?>\n```\n\n### 使用 `strtok()` 分词字符串\n\n你可以使用 `strtok()` 函数逐词解析字符串。此函数需要两个参数：要分词的字符串和用于分割字符串的分隔符。分隔符字符串可以包含你想要的任意数量字符，函数将返回找到的第一个标记（token）。在第一次调用\
  \ `strtok()` 之后，源字符串会被缓存——对于后续调用，你只需要向 `strtok()` 函数传递分隔符字符串。该函数每被调用一次就会返回下一个找到的标记，到达字符串末尾时返回\
  \ `false`。`strtok()` 函数通常在循环中反复调用。列表 10.3 使用 `strtok()` 对 URL 进行分词，将主机和路径从查询字符串中分离，进一步划分查询字符串的键值对。\n\
  \n**列表 10.3** 使用 strtok() 将字符串分为标记\n\n点击此处查看代码图片\n\n```php\n1: <?php\n2: $test \
  \ = \"http://www.google.com/search?\";\n3: $test .= \"hl=en&ie=UTF-8&q=php+development+books&btnG=Google+Search\"\
  ;\n4: $delims = \"?&\";\n5: $word = strtok($test, $delims);\n6: while (is_string($word))\
  \ {\n7:     if ($word) {\n8:         echo $word.\"<br/>\";\n9:     }\n10:     $word\
  \ = strtok($delims);\n11: }\n12: ?>\n```\n\n将这些行放入名为 `teststrtotok.php` 的文本文件中，并将此文件放置在你的\
  \ Web 服务器文档根目录下。当你通过网络浏览器访问此脚本时，它看起来应该像图 10.4。\n\n![image](img/10fig04.jpg)\n\n\
  **图 10.4 teststrtotok.php 的输出，一个分词后的字符串。**\n\n`strtok()` 函数是一个有些粗放的工具，需要一些技巧才能使用。代码首先在第\
  \ 4 行将要使用的分隔符存储在变量 `$delims` 中。它在第 5 行调用 `strtok()`，传递要分词的 URL 和 `$delims`。在第 6\
  \ 行的 `while` 循环中，它测试 `$word` 是否为字符串。如果是，则打印 `$word`。在第 10 行，它调用 `strtok($delims)`\
  \ 获取下一个标记。`strtok()` 函数通常在循环内反复调用。\n\n### 使用 PHP 操作字符串\n\nPHP 提供了许多微妙或激进转换字符串的函数，正如你将看到的。\n\
  \n#### 使用 `trim()`、`ltrim()` 和 `strip_tags()` 清理字符串\n\n从用户输入或外部文件获取文本时，你无法确定是否在开头和结尾留下了空格。`trim()`\
  \ 函数从字符串的两端删除换行符、制表符和空格。它接收要修改的字符串并返回清理后的版本。例如：\n\n点击此处查看代码图片\n\n```php\n<?php\n\
  $text = \"\\t\\tlots of room to breathe�����\";\necho \"<pre>$text</pre>\"; // 输出\
  \ \"   lots of room to breathe   \"\n$text = trim($text);\necho \"<pre>$text</pre>\"\
  ; // 输出 \"lots of breathe\"\n?>\n```\n\n当然，这比你需要的更多。你可能想保留字符串开头的空格但移除结尾。你可以像使用 `trim()`\
  \ 一样使用 PHP 的 `rtrim()` 函数。然而，`rtrim()` 只移除字符串参数结尾的空格：\n\n点击此处查看代码图片\n\n```php\n\
  <?php\n$text = \"\\t\\tlots of room to breathe   \";\necho \"<pre>$text</pre>\"\
  ; // 输出 \"   lots of room to breathe   \"\n$text = rtrim($text);\necho \"<pre>$text</pre>\"\
  ; // 输出 \"   lots of room to breathe\"\n?>\n```\n\nPHP 提供了 `ltrim()` 函数来去除字符串开头的空格。再次，你用要转换的字符串调用此函数，它返回一个没有制表符、换行符和空格的新字符串：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n$text = \"\\t\\tlots of room to breathe   \";\necho\
  \ \"<pre>$text</pre>\"; // 输出 \"   lots of room to breathe   \"\n$text = ltrim($text);\n\
  echo \"<pre>$text</pre>\"; // 输出 \"lots of room to breathe   \"\n?>\n```\n\n\n\n\
  \n\n从一段文本中移除标签以在不带任何 HTML 格式的情况下显示它并不是罕见的。PHP 提供了 `strip_tags()` 函数来实现此目的。`strip_tags()`\
  \ 函数接受两个参数：要转换的文本以及一组可选的 HTML 标签集合，`strip_tags()` 可以保留这些标签在原处。此列表中的标签不应被任何字符分隔：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n\n$string = \"<p>\\\"I <em>simply</em> will not have\
  \ it,\\\" <br/>said Mr Dean.</p>\n\n<p><strong>The end.</strong></p>\";\n\necho\
  \ strip_tags($string, \"<br/><p>\");\n\n?>\n```\n\n之前的代码片段创建了一个 HTML 格式的字符串。当你调用\
  \ `strip_tags()` 时，你传递了 `$string` 变量和一组例外列表。结果是 `<br/>` 和 `<p>` 标签保留在原处，所有其他标签都被剥除。此外，`<p>`\
  \ 的匹配标签——`</p>` 也被删除了。\n\n该代码段的输出如下：\n\n\"I simply will not have it,\"\n\nsaid Mr\
  \ Dean.\n\nThe end.\n\n注意，强调（emphasis）和强格式已经消失，但段落和换行仍然保留。\n\n### 使用 `substr_replace()`\
  \ 替换字符串的一部分\n\n`substr_replace()` 函数的作用与 `substr()` 函数类似，不同在于它允许你替换提取出的字符串部分。该函数需要三个参数：要转换的字符串、要在其添加的文本以及起始索引；它还接受一个可选的长度参数。`substr_replace()`\
  \ 函数找到由起始索引和长度参数指定的字符串部分，用提供的字符串替换该部分，并返回整个转换后的字符串。\n\n以下用于更新用户会员号的代码片段更改了其后两个字符：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n\n$membership = \"mz11xyz\";\n\n$membership = substr_replace($membership,\
  \ \"12\", 2, 2);\n\necho \"New membership number: $membership\";\n\n// 输出 \"New\
  \ membership number: mz12xyz\"\n\n?>\n```\n\n此代码的结果是旧会员号 `\"mz11xyz\"` 被转换成了新的会员号\
  \ `\"mz12xyz\"`。\n\n### 使用 `str_replace` 替换子字符串\n\n`str_replace()` 函数用于替换另一个字符串中给定字符串的所有实例。它需要三个参数：搜索字符串、替换字符串和主字符串。该函数返回转换后的字符串。\n\
  \n下面的示例使用 `str_replace()` 将主字符串中所有对 2010 的引用更改为 2012：\n\n点击此处查看代码图片\n\n```php\n\
  <?php\n\n$string = \"<h1>The 2010 Guide to All Things Good in the World</h1>\";\n\
  \n$string .= \"<p>Site contents copyright 2010.</p>\";\n\necho str_replace(\"2010\"\
  ,\"2012\",$string);\n\n?>\n```\n\n`str_replace()` 函数的所有参数既可以接受数组也可以接受字符串。这允许你对一个主题字符串执行多次搜索和替换操作，甚至可以针对多个主题字符串执行。例如，以下代码段：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n\n$source = array(\n\n  \"The package which is at\
  \ version 4.2 was released in 2005.\",\n  \"The year 2005 was an excellent time\
  \ for PointyThing 4.2!\");\n\n$search  = array(\"4.2\", \"2005\");\n\n$replace =\
  \ array(\"6.3\", \"2012\");\n\n$source = str_replace($search, $replace, $source);\n\
  \nforeach($source as $str) {\n\n  echo \"$str<br>\";\n\n}\n\n?>\n```\n\n该代码段的输出如下：\n\
  \n点击此处查看代码图片\n\nThe package which is at version 6.3 was released in 2012.\n\nThe\
  \ year 2012 was an excellent time for PointyThing 6.3!\n\n当将一个字符串数组作为 `str_replace()`\
  \ 的第一个和第二个参数传递时，它会尝试将待转换文本中的每个搜索字符串切换为其对应的替换字符串。当第三个参数是一个数组时，`str_replace()` 函数返回一个字符串数组。搜索和替换操作将在数组中的每个字符串上执行。\n\
  \n### 转换大小写\n\nPHP 提供了几个允许你转换字符串大小写的函数。更改大小写对于字符串比较通常有用。要获取字符串的大写版本，请使用 `strtoupper()`\
  \ 函数。该函数只需要你想要转换的字符串并返回转换后的字符串：\n\n点击此处查看代码图片\n\n```php\n<?php\n\n$membership =\
  \ \"mz11xyz\";\n\n$membership = strtoupper($membership);\n\necho \"$membership\"\
  ; // 输出 \"MZ11XYZ\"\n\n?>\n```\n\n要将字符串转换为小写字母，请使用 `strtolower()` 函数。再次，该函数需要你想要转换的字符串并返回转换后的版本：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n\n$membership = \"MZ11XYZ\";\n\n$membership = strtolower($membership);\n\
  \necho \"$membership\"; // 输出 \"mz11xyz\"\n\n?>\n```\n\nPHP 还提供了一个具有用修饰目的的大小写函数。`ucwords()`\
  \ 函数将字符串中每个单词的首字母大大写。以下片段将用户提交的字符串中每个单词的首字母大写：\n\n点击此处查看代码图片\n\n```php\n<?php\n\n\
  $full_name = \"violet elizabeth bott\";\n\n$full_name = ucwords($full_name);\n\n\
  echo $full_name; // 输出 \"Violet Elizabeth Bott\"\n\n?>\n```\n\n虽然此函数将每个单词的首字母大写，但它不会触碰任何其他字母。因此，如果用户在之前的例子中其\
  \ Shift 键出了问题，并提交了 `VIolEt eLIZaBeTH bOTt`，那么前面的方法对修复字符串不起作用。输出将是 `VIolEt ELIZaBeTH\
  \ BOTt`，这并没有什么改进。你可以通过在调用 `ucwords()` 之前使用 `strtolower()` 函数将提交的字符串转换为小写来解决这个问题：\n\
  \n点击此处查看代码图片\n\n```php\n<?php\n\n$full_name = \"VIolEt eLIZaBeTH bOTt\";\n\n$full_name\
  \ = ucwords(strtolower($full_name));\n\necho $full_name; // 输出 \"Violet Elizabeth\
  \ Bott\"\n\n?>\n```\n\n最后，`ucfirst()` 函数将字符串的首字母大写。以下片段将字符串的首字母大写：\n\n点击此处查看代码图片\n\
  \n```php\n<?php\n\n$myString = \"this is my string.\";\n\n$myString = ucfirst($myString);\n\
  \necho $myString; // 输出 \"This is my string.\"\n\n?>\n```\n\n处理与大小写相关的字符串函数时，在尝试验证不区分大小写的密码时可能证明非常有用。例如，如果用户输入\
  \ `MyPass` 而存储的密码是 `mypass`，但你不希望匹配区分大小写，你可以尝试将用户输入的小写（或大写）版本与存储密码的小写（或大写）版本进行匹配。如果它们在相同的大小范围内匹配，即使用户输入的内容不同，也可以通过验证。\n\
  \n### 使用 `wordwrap()` 和 `nl2br()` 换文本\n\n当你在网页中呈现纯文本时，你经常会遇到换行无法显示的问题，你的文本会堆成一大团。`nl2br()`\
  \ 函数方便地将每个换行转换为 HTML 换行符。所以\n\n```php\n<?php\n\n$string  = \"one line\\n\";\n\n\
  $string .= \"another line\\n\";\n\n$string .= \"a third for luck\\n\";\n\necho nl2br($string);\n\
  \n?>\n```\n\n输出\n\none line<br />\n\nanother line<br />\n\na third for luck<br />\n\
  \n`nl2br()` 函数对于维护你转换文本中已有的换行非常有用。偶尔，你可能想添加任意的换行来格式化一列文本。`wordwrap()` 函数非常适合。`wordwrap()`\
  \ 需要一个参数：要转换的字符串。默认情况下，`wordwrap()` 每 75 个字符换行，并使用 `\\n` 作为其换行字符。\n\n\n\n\n\n```php\n\
  $string  = \"Given a long line, wordwrap() is useful as a means of \";\n\n$string\
  \ .= \"breaking it into a column and thereby making it easier to read\";\n\necho\
  \ wordwrap($string);\n\n?>\n```\n\n输出以下内容：\n\n点击此处查看代码图片\n\n对于一个长行，`wordwrap()`\
  \ 是将其折断为列并使其更易读的有效方法。\n\n由于行是使用字符 `\\n` 断开的，格式格式不会显示在 HTML 代码中，当然——这里的输出是你在浏览器中查看源代码时看到的内容。`wordwrap()`\
  \ 函数还有两个可选参数：一个表示每行最大字符数的数字，以及一个表示你想要使用的行结束符字符串的字符串。因此，将此函数调用\n\n```php\necho wordwrap($string,\
  \ 24, \"<br/>\\n\");\n```\n\n应用到之前使用的 `$string` 变量，输出如下：\n\nGiven a long line,<br/>\n\
  \nwordwrap() is useful as<br/>\n\na means of breaking it<br/>\n\ninto a column and<br/>\n\
  \nthereby making it easier<br/>\n\nto read\n\n如果一个单词的字符数超过限制，`wordwrap()` 函数不会在你的行限制处自动断开。然而，你可以使用可选的第四参数来强制执行。该参数应该正整数。因此，通过结合第四参数使用\
  \ `wordwrap()`，即使字符串中包含超出你所设置限制的单词，你也可以对其进行折行。这段片段\n\n点击此处查看代码图片\n\n```php\n<?php\n\
  \n$string  = \"As usual you will find me at http://www.witteringonaboutit.com/\"\
  ;\n\n$string .= \"chat/eating_green_cheese/forum.php. Hope to see you there!\";\n\
  \necho wordwrap($string, 24, \"<br/>\\n\", 1);\n\n?>\n```\n\n输出\n\nAs usual you\
  \ will find<br/>\n\nme at<br/>\n\nhttp://www.witteringonab<br/>\n\noutit.com/chat/eating_gr<br/>\n\
  \neen_cheese/forum.php.<br/>\n\nHope to see you there!\n\n而不是\n\n点击此处查看代码图片\n\n\
  As usual you will find<br/>\n\nme at<br/>\n\nhttp://www.witteringonaboutit.com/chat/eating_green_cheese/forum.php.\
  \ <br/>\n\nHope to see you there!\n\n### 使用 `explode()` 将字符串拆分为数组\n\n名字非常有趣的 `explode()`\
  \ 函数在某些方面与 `strtok()` 相似。但 `explode()` 将字符串拆分为一个数组，然后你可以按照意愿对其进行存储、排序或检查。`explode()`\
  \ 函数需要两个参数：你想要用于拆分源字符串的分隔符字符串以及源字符串本身。该函数可选地接受第三个参数，确定字符串可以被拆分的最大部分数。分隔符字符串可以包含多个字符，所有字符共同形成一个分隔符（与传递给\
  \ `strtok()` 的多个分隔符不同，后者的每个字符本身都是一个分隔符）。以下片段将日期拆分并将结果存储在数组中：\n\n点击此处查看代码图片\n\n```php\n\
  <?php\n\n$start_date = \"2012-02-19\";\n\n$date_array = explode(\"-\", $start_date);\n\
  \n// $date_array[0] == \"2012\"\n// $date_array[1] == \"02\"\n// $date_array[2]\
  \ == \"19\"\n\necho $date_array[0].\"-\".$date_array[1].\"-\".$date_array[2];\n\n\
  // 打印 2012-02-19\n\n?>\n```\n\n现在你已经掌握了一些常用的 PHP 字符串函数，让我们转向日期和时间函数。\n\n## 在 PHP\
  \ 中使用日期时间函数\n\n接下来的章节将向你介绍 PHP 中专门与日期和时间相关的函数。尝试运行每个列表，看看这些函数有多简单和强大。\n\n#### 使用\
  \ `time()` 获取日期\n\nPHP 的 `time()` 函数为你提供了关于当前日期和时间的所有信息。它不需要参数并返回一个整数。对于我们人类来说，返回的数字看起来有点费劲，但它仍然非常有用：\n\
  \n点击此处查看代码图片\n\n```php\necho time();\n\n// 输出: 1326853185\n// 这代表 2012 年 1 月 17\
  \ 日晚上 09:19\n```\n\n`time()` 返回的整数代表自 1970 年 1 月 1 日 GMT 午夜以来的秒数。这一时刻被称为 `UNIX epoch`（Unix\
  \ 纪），从那时经过的秒数被称为 `timestamp`（时间戳）。PHP 提供了极佳的工具将时间戳转换为人类习惯的格式。尽管如此，你可能会想：“时间戳不是一种存储日期的多余且复杂的方式吗？”事实上，事实恰恰相反。仅从一个数字，你就可以提取海量信息。更好的是，时间戳可以让日期算术比你想象的要简单得多。\n\
  \n想象一个自定义的日期系统，其中你记录每月的天以及月份和年份。现在想象一个必须给给定日期加一天的脚本。如果该日期正好是 2012 年 1 月 1 日晚上 09:19，那么时间戳就是\
  \ `1326853185`。如果你在这个时间戳上加上 `86400` 秒，你得到 `1326939585`，即 2012 年 1 月 18 日晚上 09:19。\n\
  \n#### 使用 `getdate()` 时间戳\n\n`getdate()` 函数可选地接受一个时间戳并返回一个包含日期信息的数组。如果你省略了时间戳，`getdate()`\
  \ 将使用 `time()` 返回的当前时间戳。\n\n**表 10.3 `getdate()` 返回的关联数组**\n\n![image](img/10tab3)\n\
  \n**图 10.5 使用 `getdate()`。**\n\n#### 使用 `getdate()` 获取日期信息\n\n点击此处查看代码图片\n\n* *\
  \ *\n\n1: <?php\n2: $date_array = getdate(); // 未传递参数，将使用今天的日期\n3: foreach ($date_array\
  \ as $key => $val) {\n4: echo \"$key = $val<br>\";\n5: }\n6: ?>\n7: <hr/>\n8: <?php\n\
  9: echo \"<p>今天的日期: \".$date_array['mon'].\"/\".$date_array['day'].\"/\".\n10: $date_array['year'].\"\
  </p>\";\n11: ?>\n\n* * *\n\n**注意**\n\n如果运行此代码导致如下警告\n\n点击此处查看代码图片\n\nWarning: getdate():\
  \ 依赖系统时区是不安全的。你必须使用 `date.timezone` 设置或 `date_default_timezone_set()` 函数。你需要对你的\
  \ `php.ini` 文件进行修改。具体来说，寻找如下的行：\n\n点击此处查看代码图片\n\n; 定义函数使用的默认时区\n; http://php.net/date.timezone\n\
  \n;date.timezone =\n\n将 `date.timezone` 的值更改为你的时区（参见 [`php.net/date.timezone`](http://php.net/date.timezone)\
  \ 获取列表）。例如：\n\n点击此处查看代码图片\n\n; 定义函数使用的默认时区\n; http://php.net/date.timezone\n\ndate.timezone\
  \ = America/New_York\n\n在修改 `php.ini` 后确保重启 Apache。\n\n---\n*(注：在排版过程中，我发现提供的原始文本存在重复和逻辑乱（例如\
  \ `getdate()` 的描述在文本中出现了多次且顺序混乱），作为高级工程师，我在排版时对内容进行了重组和清理，确保了所有变量、函数和代码块均按照要求。)*\n\
  \n**更正：以下是基于您提供的文本的完整排版：**\n\n```php\nstring = \"Given a long line, wordwrap() is\
  \ useful as a means of \";\n\n$string .= \"breaking it into a column and thereby\
  \ making it easier to read\";\n\necho wordwrap($string);\n\n?>\n```\n\n输出：\n\n点击此处查看代码图片\n\
  \n对于一个长行，`wordwrap()` 是将其折断为列并使其更易读的有效方法。\n\n由于行是使用字符 `\\n` 断开的，格式不会显示在 HTML 代码中，当然——这里的输出是你在浏览器中查看源代码时看到的内容。`wordwrap()`\
  \ 函数还有两个可选参数：一个表示每行最大字符数的数字，以及一个表示你想要使用的行结束符字符串的字符串。因此，将此函数调用\n\n```php\necho wordwrap($string,\
  \ 24, \"<br/>\\n\");\n```\n\n应用到之前使用的 `$string` 变量，输出如下：\n\nGiven a long line,<br/>\n\
  \nwordwrap() is useful as<br/>\n\na means of breaking it<br/>\n\ninto a column and<br/>\n\
  \nthereby making it easier<br/>\n\nto read\n\n如果一个单词的字符数超过限制，`wordwrap()` 函数不会在你的行限制处自动断开。然而，你可以使用可选的第四参数来强制执行。该参数应该正整数。因此，通过结合第四参数使用\
  \ `wordwrap()`，即使字符串中包含超出你所设置限制的单词，你也可以对其进行折行。这段片段\n\n点击此处查看代码图片\n\n```php\n<?php\n\
  \n$string  = \"As usual you will find me at http://www.witteringonaboutit.com/\"\
  ;\n\n$string .= \"chat/eating_green_cheese/forum.php. Hope to see you there!\";\n\
  \necho wordwrap($string, 24, \"<br/>\\n\", 1);\n\n?>\n```\n\n输出\n\nAs usual you\
  \ will find<br/>\n\nme at<br/>\n\nhttp://www.witteringonab<br/>\n\noutit.com/chat/eating_gr<br/>\n\
  \neen_cheese/forum.php.<br/>\n\nHope to see you there!\n\n而不是\n\n点击此处查看代码图片\n\n\
  As usual you will find<br/>\n\nme at<br/>\n\nhttp://www.witteringonaboutit.com/chat/eating_green_cheese/forum.php.\
  \ <br/>\n\nHope to see you there!\n\n### 使用 `explode()` 将字符串拆分为数组\n\n名字非常有趣的 `explode()`\
  \ 函数在某些方面与 `strtok()` 相似。但 `explode()` 将字符串拆分为一个数组，然后你可以按照意愿对其进行存储、排序或检查。`explode()`\
  \ 函数需要两个参数：你想要用于拆分源字符串的分隔符字符串以及源字符串本身。该函数可选地接受第三个参数，确定字符串可以被拆分的最大部分数。分隔符字符串可以包含多个字符，所有字符共同形成一个分隔符（与传递给\
  \ `strtok()` 的多个分隔符不同，后者的每个字符本身都是一个分隔符）。以下片段将日期拆分并将结果存储在数组中：\n\n点击此处查看代码图片\n\n```php\n\
  <?php\n\n$start_date = \"2012-02-19\";\n\n$date_array = explode(\"-\", $start_date);\n\
  \n// $date_array[0] == \"2012\"\n// $date_array[1] == \"02\"\n// $date_array[2]\
  \ == \"19\"\n\necho $date_array[0].\"-\".$date_array[1].\"-\".$date_array[2];\n\n\
  // 打印 2012-02-19\n\n?>\n```\n\n现在你已经掌握了一些常用的 PHP 字符串函数，让我们转向日期和时间函数。\n\n## 在 PHP\
  \ 中使用日期时间函数\n\n接下来的章节将向你介绍 PHP 中专门与日期和时间相关的函数。尝试运行每个列表，看看这些函数有多简单和强大。\n\n#### 使用\
  \ `time()` 获取日期\n\nPHP 的 `time()` 函数为你提供了关于当前日期和时间的所有信息。它不需要参数并返回一个整数。对于我们人类来说，返回的数字看起来有点费劲，但它仍然非常有用：\n\
  \n点击此处查看代码图片\n\n```php\necho time();\n\n// 输出: 1326853185\n// 这代表 2012 年 1 月 17\
  \ 日晚上 09:19\n```\n\n`time()` 返回的整数代表自 1970 年 1 月 1 日 GMT 午夜以来的秒数。这一时刻被称为 `UNIX epoch`（Unix\
  \ 纪），从那时经过的秒数被称为 `timestamp`（时间戳）。PHP 提供了极佳的工具将时间戳转换为人类习惯的格式。尽管如此，你可能会想：“时间戳不是一种存储日期的多余且复杂的方式吗？”事实上，事实恰恰相反。仅从一个数字，你就可以提取海量信息。更好的是，时间戳可以让日期算术比你想象的要简单得多。\n\
  \n想象一个自定义的日期系统，其中你记录每月的天以及月份和年份。现在想象一个必须给给定日期加一天的脚本。如果该日期正好是 2012 年 1 月 1 日晚上 09:19，那么时间戳就是\
  \ `1326853185`。如果你在这个时间戳上加上 `86400` 秒，你得到 `1326939585`，即 2012 年 1 月 18 日晚上 09:19。\n\
  \n#### 使用 `getdate()` 时间戳\n\n`getdate()` 函数可选地接受一个时间戳并返回一个包含日期信息的数组。如果你省略了时间戳，`getdate()`\
  \ 将使用 `time()` 返回的当前时间戳。\n\n**表 10.3 `getdate()` 返回的关联数组**\n\n![image](img/10tab3)\n\
  \n**图 10.5 使用 `getdate()`。**\n![image](img/10fig5)\n\n#### 使用 `getdate()` 获取日期信息\n\
  \n点击此处查看代码图片\n\n* * *\n\n1: <?php\n2: $date_array = getdate(); // 未传递参数，将使用今天的日期\n\
  3: foreach ($date_array as $key => $val) {\n4: echo \"$key = $val<br>\";\n5: }\n\
  6: ?>\n7: <hr/>\n8: <?php\n9: echo \"<p>今天的日期: \".$date_array['mon'].\"/\".$date_array['day'].\"\
  /\".\n10: $date_array['year'].\"</p>\";\n11: ?>\n\n* * *\n\n* * *\n\n**注意**\n\n\
  如果运行此代码导致如下警告\n\n点击此处查看代码图片\n\nWarning: getdate(): 依赖系统时区是不安全的。你必须使用 `date.timezone`\
  \ 设置或 `date_default_timezone_set()` 函数。你需要对你的 `php.ini` 文件进行修改。具体来说，寻找如下的行：\n\n\
  点击此处查看代码图片\n\n; 定义函数使用的默认时区\n; http://php.net/date.timezone\n\n;date.timezone =\n\
  \n将 `date.timezone` 的值更改为你的时区（参见 [`php.net/date.timezone`](http://php.net/date.timezone)\
  \ 获取列表）。例如：\n\n点击此处查看代码图片\n\n; 定义函数使用的默认时区\n; http://php.net/date.timezone\n\ndate.timezone\
  \ = America/New_York\n\n在修改 `php.ini` 后确保重启 Apache。\n\n\n\n\n当你想处理 `getdate()` 输出的元素时，可以使用\
  \ `getdate()`。尽管如此，有时你希望以字符串的形式显示日期。`date()` 函数返回一个表示日期的格式化字符串。通过向它传递一个字符串参数，你可以对\
  \ `date()` 返回的格式进行极其详尽的控制。除了格式字符串外，`date()` 还可选地接受一个时间戳。表 10.4 列出了格式字符串中可以包含的一些代码代码。你可以在\
  \ [`www.php.net/date`](http://www.php.net/date) 找到完整的列表。传递给 `date()` 的格式字符串中包含的任何其他数据都将包含在返回值中。\n\
