  \ 和 MySQL 知识创建了一个个人通讯录。你学习了如何创建数据库表以及用于记录添加、删除和简单查看的脚本。你还学习了如何添加关联到单个条目的多个记录。\n\n\
  ### 问答\n**Q. 如果我想为地址录添加额外的部分（例如个人的生日或其他信息），我该怎么办？**\n\n**A.** 地址、电话、传真、电子邮件和个人备注使用了不同的表，因为一个人可能拥有多条包含此类类型信息的记录。以人的生日为例，一个人只有一个生日，因此使用关系型数据库就大材小用了，因为每个用户只会存在一条记录。所以，若要添加生日，你应该在\
  \ `master_name` 表中添加一个字段。至于添加其他信息的表，请问问自己一个人是否只会有一个该信息的实例（例如生日）或有多个实例（例如电子邮件地址）。如果是后者，请创建一个类似于\
  \ `address`、`telephone`、`fax`、`email` 或 `personal_notes` 的表，这些表使用 `master_id` 作为外键。\n\
  \n#### Workshop\n工作坊旨在帮助你复习所学内容并开始将知识付诸实践。\n\n#### 测验\n1. **当你通过查询字符串传递变量时，它属于哪个全局变量？**\n\
  2. **在 `address`、`email`、`telephone` 和 `fax` 表中，对于 `master_name` 表中的每个人可以拥有多少条记录？**\n\
  3. **附加记录是通过哪个数据库字段关联到主记录的？**\n\n#### 答案\n1. **`$_GET` 全局变量。**\n2. **数量随你心——它是关系式的！**\n\
  3. **`master_id` 字段。**\n\n#### 活动\n1. 遍历每一个管理脚本并修改代码，以便在每个屏幕底部打印指向菜单的链接。\n2. 使用第二个版本的\
