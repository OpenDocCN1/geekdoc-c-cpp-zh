  \ 73 行开始的最后一个 `for` 语句中。\n\n在第 73 行中，我们初始化了一个名为 `$count` 的变量，并确保循环在 42 次迭代后结束。这是为了确保我们有足够的单元来填充日期信息，考虑到月份在开始和结束可能有不完整的周（行）。\n\
  \n在这个 `for` 循环内部，我们使用 `getdate()` 将 `$start` 变量转换为日期数组，并将结果赋值 `$dayArray`（第 73 行）。尽管\
  \ `$start` 在循环执行时是月份的第一天，但我们每次迭代都会将其增加 `ADAY`（24 小时）（见第 85 行）。\n\n在第 75 行，我们使用取模运算符对\
  \ `$count` 变量与 7 进行测试。因此，该 `if` 语句的代码块只会在 `$count` 为 0 或 7 的倍数时运行。这是我们判断是应该结束循环还是开启新行（行代表周）的方法。\n\
  \n在确定处于第一次迭代或行的末尾之后，我们可以在第 76 行进行另一个测试。如果 `$dayArray` 中的 `mon`（月份数字）元素不再等于 `$month`\
  \ 变量，说明我们完成了。记住 `$dayArray` 包含了关于 `$start` 时间戳的信息，即我们正在显示的月份当前位置。当 `$start` 超过当前月份时，`dayArray[\"\
  mon\"]` 将持有与用户输入的 `$month` 不同的数字。我们的取模测试表明我们处于行的末尾，而进入新月份意味着我们可以离开循环。然而，如果我们仍然处于正在显示的月份中，我们会在第\
  \ 79 行结束行并开启新行。\n\n在接下来第 82 行的 `if` 语句中，我们决定是否将日期信息写入单元格。并不是每个月份都从周日开始，因此我们的行可能会包含一个或两个空单元格。同样，很少有月份会在行的末尾结束，因此在我们关闭表格之前，我们也可能剩下几个空单元格。\n\
  \n\n\n\n显示日历已经很好，但只需额外添加几行代码，你就可以它具有交互性——也就是说，你可以在指定的日期添加并查看事件。首先，让我们创建一个简单的数据库表来存储事件信息。为了简单起见，这些事件将只发生在某一天，并且只显示它们的开始日期和时间。虽然你可以将事件条目设计得尽可能复杂，但这个示例只是为了展示涉及的基本流程。\n\
  \n`calendar_events` 表将包含开始日期和时间、事件标题以及事件简短描述字段：\n\n点击此处查看代码图片\n\n```sql\nCREATE\
  \ TABLE calendar_events (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n   \
  \ event_title VARCHAR (25),\n    event_shortdesc VARCHAR (255),\n    event_start\
  \ DATETIME\n);\n```\n\n我们可以使用代码列表 24.3 中的代码作为基础（名为 `showcalendar.php` 的脚本）。在这个新的脚本中，我们作为日历显示的一部分，添加了一个指向弹出窗口的链接。每个日期都是一个链接；弹出窗口调用另一个脚本，显示事件的全文，并提供添加事件的能力。首先，在\
  \ `<head>` 区域、`<body>` 标签开始之前添加以下 JavaScript 代码，即在代码列表 24.3 中原始脚本的第 36 行之后：\n\n\
  点击此处查看代码图片\n\n```javascript\n<script type=\"text/javascript\">\nfunction eventWindow(url)\
  \ {\n    event_popupWin = window.open(url, 'event', 'resizable=yes, scrollbars=yes,\n\
  \             toolbar=no,width=400,height=400');\n    event_popupWin.opener = self;\n\
  }\n</script>\n```\n\n此 JavaScript 函数定义了一个 400×400 的窗口，将调用我们提供的 URL。我们使用此 JavaScript\
  \ 函数替换代码列表 24.3 中原始脚本的第 85 行；我们现在将日期显示封装在这个指向基于 JavaScript 的弹出窗口的链接中，该链接调用名为 `event.php`\
