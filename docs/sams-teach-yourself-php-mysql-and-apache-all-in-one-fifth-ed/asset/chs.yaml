  ```sql\nSELECT CONCAT_WS(' ', firstname, lastname) AS fullname FROM master_name;\n\
  ```\n\n通过此方法，你得到以下结果：\n\n+--------------+\n| fullname       |\n+--------------+\n\
  | John Smith      |\n| Jane Smith      |\n| Jimbo Jones    |\n| Andy Smith      |\n\
