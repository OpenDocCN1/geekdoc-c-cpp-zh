  \n### 总结\n\n在本章中，你学习了一些允许你控制字符串的函数。你学习了如何使用 `printf()` 和 `sprintf()` 格式化字符串。你应该能够使用这些函数创建既转换又格式化数据的字符串。你学习了调查字符串的函数。你应该能够使用\
  \ `strlen()` 发现字符串的长度，使用 `strpos()` 确定子字符串的存在，并使用 `substr()` 提取子字符串。你应该能够使用 `strtok()`\
  \ 分词字符串。\n\n\n\n\n# A. 你将在第 16 章“学习基础 SQL 命令”中学习 MySQL 日期时间函数，但通常情况下，经验法是如果你从数据库中提取日期和时间并想要执行与日期相关的操作（例如计算时间或将时间从一种类型转换为另一种类型），让数据库为你完成这些工作。但并不阻止你对从数据库提取的数据使用\
  \ PHP 日期时间函数。\n\n## 测验\n\n**1.** 使用 `printf()` 时你会使用哪种转换说明符将整数格式化为双精度浮点数？请出转换整数\
  \ `33` 的完整语法。\n\n**2.** 你将如何对第 1 题中的转换进行零填充，使得小数点之前的部分长度为四个字符？\n\n**3.** 你将如何为你在前几个问题中格式化的浮点数指定两位小数的精度？\n\
  \n**4.** 你将使用哪个函数从字符串中提取子字符串？\n\n**5.** 你可以如何移除字符串开头的空白字符？\n\n**6.**** 你将如何将一个由分隔符划分的字符串拆子字符串数组？\n\
  \n**7.** 使用 PHP，如何获取代表当前日期和时间的 UNIX 时间戳？\n\n**8.** 哪一个 PHP 函数接受时间戳并返回一个表示给定日期的关联数组？\n\
  \n**9.** 你使用哪一个 PHP 函数来格式化日期信息？\n\n**10.** 你可以使用哪一个 PHP 函数来检查日期的有效性？\n\n## 答案\n\n\
  **1.** 转换说明符 `f` 用于将整数格式化为双精度浮点数：\n\n```\nprintf(\"%f\", 33);\n```\n\n**2.** 你可以使用填充说明符对\
  \ `printf()` 的输出进行零填充——即一个空格或零，后跟一个代表你想填充字符数量的数字：\n\n```\nprintf(\"%04f\", 33);\n\
  ```\n\n**3.** 精度说明符由一个点 (`.`) 后跟一个表示你想要应用的精度的数字组成。你应该将精度说明符放在转换说明符之前：\n\n```\nprintf(\"\
  %04.2f\", 33);\n```\n\n**4.** `substr()` 函数提取并返回子字符串。\n\n**5.** `ltrim()` 函数移除字符串开头的空白字符。\n\
  \n**6.** `explode()` 函数将字符串拆分为数组。\n\n**7.** 使用 `time()`。\n\n**8.** `getdate()` 函数返回一个关联数组，其元素包含给定日期的各个方面。\n\
  \n**9.** 使用 `date()`。\n\n**10.** 你可以使用 `checkdate()` 函数检查日期的有效性。\n\n## 活动\n\n**1.**\
  \ 创建一个接受用户全名和电子邮件地址的反馈表单。使用大小写转换函数将用户提交的每个名字的首字母大写，并将结果打印回浏览器上。检查用户的电子邮件地址是否包含 `@`\
  \ 符号，否则打印警告。\n\n**2.** 创建一个包含双精度浮点数和整数的数组。遍历数组，将每个元素转换为精度为 2 的浮点数。在 20 个字符的字段内使输出结果右对齐。\n\
  \n**3.** 创建一个生日倒计时脚本。给定月份、日期和年的表单输入，输出一条消息告诉用户距离大日子还有多少天、几小时、几分钟和秒。\n\n# 第 11 章.表单操作\n\
  \n***在本章中，你将学习以下内容：***\n\n- 如何从表单字段中获取信息\n- 如何处理允许多项选择的表单元素\n- 如何创建一个包含 HTML 表单和处理其提交的\
  \ PHP 代码的单个文档\n- 如何使用隐藏字段保存状态\n- 如何将用户重定向到新页面\n- 如何构建可以发送邮件的 HTML 表单和 PHP 代码\n-\
  \ 如何构建可以上传文件的 HTML 表单\n\n\n\n\n\n上一个示例展示了如何从 HTML 元素收集信息，每个元素名称提交一个值，例如文本字段、文本区域和单选按钮。但在处理复选框（checkbox）等元素时，你会遇到一个问题，因为用户可能会选择一个或多个项目。如果你为\
  \ `checkbox INPUT` 元素命名一个普通名称，如下所示\n\n点击此处查看代码图像\n\n```html\n<input type=\"checkbox\"\
  \ id=\"products\" name=\"products\">\n```\n\n接收此数据的脚本将只能访问与该名称对应的单个值（`$_POST['products']`）（因此仅是用户选定的列表中的第一个复选框）。你可以通过重命名此类元素来更改这种行为，使其名称以一对空方括号\
  \ `[]` 结尾。列表 11.3 正是这样操作的。\n\n**列表 11.3** 包含多个复选框的 HTML 表单\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```html\n1:  <!DOCTYPE html>\n2:  <<html>\n3:  <head>\n4:  <title>带有复选框的\
  \ HTML 表单</title>\n5:  </head>\n6:  <body>\n7:  <form action=\"send_formwithcb.php\"\
  \ method=\"POST\">\n8:  <p><label>Name:</label><br/>\n9:  <input type=\"text\" name=\"\
  user\" /></p>\n10: <fieldset>\n11: <legend>选择一些产品:</legend><br/>\n12: <input type=\"\
  checkbox\" id=\"tricorder\"\n13:          name=\"products[]\" value=\"Tricorder\"\
  >\n14:          <label for=\"tricorder\">Tricorder</label><br/>\n15: \n16: <input\
  \ type=\"checkbox\" id=\"ORAC_AI\"\n17:          name=\"products[]\" value=\"ORAC\
  \ AI\">\n18:          <label for=\"ORAC_AI\">ORAC AI</label><br/>\n19: \n20: <input\
  \ type=\"checkbox\" id=\"HAL_2000\"\n21:          name=\"products[]\" value=\"HAL\
  \ 2000\">\n22:          <label for=\"HAL_2000\">HAL 2000</label><br/>\n23: </fieldset>\n\
  24: <button type=\"submit\" name=\"submit\" value=\"submit\">提交表单</button>\n25:\
  \ </form>\n26: </body>\n27: </html>\n```\n\n* * *\n\n将这些行放入名为 `formwithcb.html`\
  \ 的文本文件中，并将该文件放置在 Web 服务器的文档根目录下。接下来，在处理表单输入的脚本中，你会发现所有名为 `\"products[]\"` 的已选复选框的值都可以在一个名为\
  \ `$_POST['products']` 的数组可用。第 12 行到第 22 行指示了每个复选框。用户的选择可用的这一点在列表 11.4 中的数组中得到了演示。\n\
  \n**列表 11.4** 从列表 11.3 中的表单读取输入\n\n点击此处查看代码图像\n\n* * *\n\n```html\n1:  <!DOCTYPE\
  \ html>\n2:  <html>\n3:  <head>\n4:  <title>读取复选框</title>\n5:  </head>\n6:  <body>\n\
  7:  <p>欢迎, <strong><?php echo $_POST['user']; ?></strong>!</p>\n8:  <p>您的产品选择是：\n\
  9:  <?php\n10: if (!empty($_POST['products'])) {\n11:     echo \"<ul>\";\n12:  \
  \   foreach ($_POST['products'] as $value) {\n13:         echo \"<li>$value</li>\"\
  ;\n14:     }\n15:     echo \"</ul>\";\n16: } else {\n17:     echo \"无\";\n18: }\n\
  19: ?>\n20: </body>\n21: </html>\n```\n\n* * *\n\n将这些行放入名为 `send_formwithcb.php`\
  \ 的文本文件中，并将该文件放置在 Web 服务器的文档根目录下。现在用浏览器访问表单（`formwithcb.html`）并勾选一些复选框。图 11.2 显示了一个示例。\n\
  \n![image](img/11fig02)\n\n**图 11.2** 在 11.3 中创建的表单。\n\n列表 11.3 的第 7 行访问了 `$_POST['user']`\
  \ 变量。在第 10 行，脚本测试了 `$_POST['products']`。`$_POST['products']` 存在。在第 12 行，`checkbox`\
  \ 的 `value` 变成了 `$_POST['products']`，如图 11.3 所示。\n\n![image](img/11fig02)\n\n**图\
  \ 11.3** `send_formwithcb.php` 的示例输出\n\n`checkbox INPUT` 特别适用于复选框，但它也适用于其他元素。如果你为\
  \ `checkbox` 元素命名一个普通名称，如下所示\n\n```html\n<input type=\"checkbox\" id=\"products\"\
  \ name=\"products\">\n```\n\n你可以通过重命名此类元素来更改这种行为，使其名称以一对空方括号 `[]` 结尾。列表 11.3 正是这样操作的。\n\
  \n### 在单页组合 HTML 和 PHP\n\n在某些情况下，你可能希望将 PHP 包含在页面中。例如，如果你使用 `SELECT` 元素，只要名称以方括号结尾，列表\
  \ 11.5 就会创建 HTML。\n\n**列表 11.5** 一个自调用的 HTML 表单\n\n点击此处查看代码图像\n\n* * *\n\n```html\n\
  1:  <!DOCTYPE html>\n2:  <html>\n3:  <head>\n4:  <title>自调用的表单</title>\n5:  </head>\n\
  6:  <body>\n7:  <form action=\"<?php echo $_SERVER['PHP_SELF']; ?>\" method=\"POST\"\
  >\n8:  <p><label for=\"guess\">输入你的猜想:</label><br/>\n9:  <input type=\"text\" id=\"\
  guess\" name=\"guess\" /></p>\n10: <button type=\"submit\" name=\"submit\" value=\"\
  submit\">提交</button>\n11: </form>\n12: </body>\n13: </html>\n```\n\n* * *\n\n此脚本的\
  \ action 是 `$_SERVER['PHP_SELF']`，如图 11.3 所示。这个全局变量代表当前脚本的名称。换句话说，action 告诉脚本加载自身。列表\
  \ 11.5 没有产生任何输出，但如果你将脚本上传到 Web 服务器、访问页面并查看源代码，你会发现表单的 action 现在包含了脚本的名称。\n\n在列表\
  \ 11.6 中，你开始构建页面的 PHP 元素。\n\n**列表 11.6** 一个 PHP 猜想脚本\n\n* * *\n\n```php\n1:  <?php\n\
  2:  $num_to_guess = 42;\n3:  if (!isset($_POST['guess'])) {\n4:      $message =\
  \ \"欢迎来到猜机器！\";\n5:  } elseif (!is_numeric($_POST['guess'])) { // 不是数字\n6:     \
  \ $message = \"我不理解那个回答。\";\n7:  } elseif ($_POST['guess'] == $num_to_guess) { //\
  \ 匹配了！\n8:      $message = \"做得好！\";\n9:  } elseif ($_POST['guess'] > $num_to_guess)\
  \ {\n10:     $message = $_POST['guess'].\"太大了！尝试小一点数字。\";\n11: } elseif ($_POST['guess']\
  \ < $num_to_guess) {\n12:     $message = $_POST['guess'].\"太小了！尝试大一点。\";\n13: }\
  \ else { // 其他条件\n14:     $message = \"我太困惑了。\";\n15: }\n16: ?>\n```\n\n\n\n\n\n\
  首先，你必须定义用户猜测的数字，这在第 2 行通过将 `42` 赋值给变量 `$num_to_guess` 来。接下来，你必须确定表单是否已经提交。你可以通过检查变量\
  \ `$_POST['guess']` 是否存在来测试提交情况，只有在表单脚本被提交后（无论字段中是否有值），该变量才可用。如果 `$_POST['guess']`\
  \ 的值不存在，那么你可以安全地假设用户是在没有提交表单的情况下进入页面的。如果该值*存在*，你可以测试它包含的值。对 `$_POST['guess']` 变量存在的测试发生在第\
  \ 3 行。\n\n第 3 行到 15 行表示了一个 `if...elseif...else` 控制结构。根据表单提交了什么（如果有的话），这些条件在任何给定时刻都只有一个为真。根据不同的条件，不同的值会被赋值给\
  \ `$message` 变量。然后，该变量会在第 23 行的显示列表 11.6 中打印到屏幕上，该部分是脚本的 HTML 部分。\n\n**列表 11.6**\
  \ 一个 PHP 数字猜数字脚本（续）\n\n点击此处查看代码图像\n\n* * *\n\n```\n17: <!DOCTYPE html>\n18: <html>\n\
  19: <head>\n20: <title>A PHP number guessing script</title>\n21: </head>\n22: <body>\n\
  23: <h1><?php echo $message; ?></h1>\n24: <form action=\"<?php echo $_SERVER['PHP_SELF'];\
  \ ?>\" method=\"POST\">\n25: <p><label for=\"guess\">Type your guess here:</label><br/>\n\
  26: <input type=\"text\" is=\"guess\" name=\"guess\" /></p>\n27: <button type=\"\
  submit\" name=\"submit\" value=\"submit\">Submit</button>\n28: </form>\n29: </body>\n\
  30: </html>\n```\n\n* * *\n\n将 PHP 和 HTML 代码（显示列表 11.6 中的所有行）放入名为 `numguess.php`\
  \ 的文本文件中，并将此文件放在你的 Web 服务器文档根目录下。现在用 浏览器访问该脚本，你应该能看到类似图 11.4 的内容。\n\n![image](img/11fig04.jpg)\n\
  \n**图 11.4** 在显示列表 11.6 中创建的表单。**\n\n你仍然可以再添加一些内容，但你可能已经看出将代码交给设计师进行美化处理是多么简单。设计师可以完成她的工作，而无需以任何方式干扰编程——PHP\
  \ 代码位于顶部，其余部分几乎全是 HTML。\n\n## 使用隐藏字段保存状态\n\n显示列表 11.6 中的脚本没有办法知道用户进行了多少次猜测，但你可以使用隐藏字段来跟踪这个值。隐藏字段的行为与文本字段相同，不同之处除非查看包含它的文档的\
  \ HTML 源代码，否则用户看不到它。\n\n获取原始的 `numguess.php` 脚本并将其保存为 `numguess2.php` 副本。在新版本中，在变量\
  \ `$num_to_guess` 的初始赋值之后添加一行：\n\n点击此处查看代码图像\n\n```\n$num_tries = (isset($_POST['num_tries']))\
  \ ? $num_tries + 1 : 1;\n```\n\n这一行初始化了一个名为 `$num_tries` 的变量并为其赋了一个值。如果表单尚未提交（如果\
  \ `$_POST['num_tries']` 为空），则变量 `$num_tries` 的值为 `1`，因为你是第一次尝试猜测数字。如果表单已经发送，则新值是\
  \ `$_POST['num_tries']` 的值加 1。\n\n下一个变化发生在 HTML 级 H1 标题之后：\n\n点击此处查看代码图像\n\n```html\n\
  <p><strong>猜数字：</strong> <?php echo $num_tries; ?></p>\n```\n\n这一行新代码简单地将 `$num_tries`\
  \ 的当前值打印到屏幕上。\n\n最后，在表单提交按钮的 HTML 代码之前，添加隐藏字段。该字段保存了递增后的 `$num_tries` 值：\n\n点击此处查看代码图像\n\
  \n```html\n<input type=\"hidden\" name=\"num_tries\" value=\"<?php echo $num_tries;\
  \ ?>\"/>\n```\n\n显示列表 11.7 显示了完整的脚本。\n\n**列表 11.7** 使用隐藏字段保存状态\n\n点击此处查看代码图像\n\n\
  * * *\n\n```\n1:  <?php\n2:  $num_to_guess = 42;\n3:  $num_tries = (isset($_POST['num_tries']))\
  \ ? $num_tries + 1 : 1;\n4:  if (isset($_POST['num_tries'])) {\n5:  $guess = $_POST['guess'];\n\
  6:    if (is_numeric($guess)) {\n7:      if ($guess == $num_to_guess) {\n8:    \
  \    $message = \"Well done!\";\n9:      } elseif ($guess > $num_to_guess) {\n10:\
  \       $message = \"too big! Try a smaller number.\";\n11:     } else {\n12:  \
  \     $message = \"too small! Try a larger number.\";\n13:     }\n14:  } else {\n\
  15:    $message = \"I don't understand that.\";\n16:  }\n17: }\n18:\n19: <!DOCTYPE\
  \ html>\n20: <html>\n21: <head>\n22: <title>A PHP number guessing script</title>\n\
  23: </head>\n24: <body>\n25: <h1><?php echo $message; ?></h1>\n26: <form action=\"\
  <?php echo $_SERVER['PHP_SELF']; ?>\" method=\"POST\">\n27: <p><label for=\"guess\"\
  >Type your guess here:</label><br/>\n28: <input type=\"text\" is=\"guess\" name=\"\
  guess\" /></p>\n29: <button type=\"submit\" name=\"submit\" value=\"submit\">Submit</button>\n\
  30: </form>\n31: </body>\n32: </html>\n```\n*(注：原文中的代码块是碎片化的；我根据提供的行号和变量进行了重构以保持清晰)*\n\
  \n## 重定向用户\n\n我们简单的脚本仍然有一个主要缺点：无论用户猜得否，表单都会重新加载。然而，你可以将用户重定向到一个页面，从而解决这个问题。\n\n\
  当服务器与客户端通信时，必须先发送有关文档信息的头部。PHP 通常会为你处理这些，但你可以选择使用 PHP 的 `header()` 函数发送自己的头部。一旦内容被发送到浏览器，PHP\
  \ 就会发送头部，之后你再也无法发送任何内容了。如果你打算在脚本中使用 `header()` 函数，必须确保在此之前没有任何输出。你还应该检查你可能使用的任何库。\n\
  \n显示列表 11.8 显示了 PHP 向浏览器发送典型头部，从第 3 行开始，响应第 1 行的请求。\n\n```\n1: HTTP/1.1 200 OK\n\
  2: Date: Sun, 29 Jan 2012 15:50:28 PST\n3: Server: Apache/2.2.21 (Win32) PHP/5.4.0\n\
  4: X-Powered-By: PHP/5.4.0\n5: Connection: close\n6: Content-Type: text/html\n```\n\
  \n* * *\n\n通过发送 `Location` 头部而不是 PHP 的默认头部，你可以导致浏览器重定向到一个新页面，例如：\n\n点击此处查看代码图像\n\
  \n```php\nheader(\"Location: http://www.samspubing.com\");\n```\n\n假设你已经创建了一个名为\
  \ `congrats.html` 的令人悦快的页面，我们可以修改猜数字脚本，在用户猜对时对其进行重定向，如显示列表 11.9 所示。此与显示列表 11.7 之间的唯一变化发生在第\
  \ 8 行的 `elseif` 子句之后。\n\n**列表 11.9** 使用 header() 重定向用户\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```php\n<?php\n  $num_to_guess = 42;\n  $num_tries = (isset($_POST['num_tries']))\
  \ ? $num_tries + 1 : 1;\n  if (!isset($_POST['guess'])) {\n    $message = \"欢迎来到猜数字机器！\"\
  ;\n  } elseif (!is_numeric($_POST['guess'])) { // 不是数字\n      $message = \"我不理解这个回复。\"\
  ;\n  } elseif ($_POST['guess'] == $num_to_guess) { // 匹配成功！\n      header(\"Location:\
  \ congrats.html\");\n      exit;\n  } elseif ($_POST['guess'] > $num_to_guess) {\n\
  \    $message = $_POST['guess'].\"太大了！试着小一点。\";\n  } elseif ($_POST['guess'] < $num_to_guess)\
  \ {\n    $message = $_POST['guess'].\"太小了！试着大一点。\";\n  } else  { // 其他情况\n    $message\
  \ = \"我简直被搞懵了。\";\n  }\n?>\n\n<!DOCTYPE html>\n<html>\n<head>\n  <title>一个 PHP 猜数字脚本</title>\n\
  </head>\n<body>\n<h1><?php echo $message; ?></h1>\n<p><strong>猜数字：</strong> <?php\
  \ echo $num_tries; ?></p>\n<form action=\"<?php echo $_SERVER['PHP_SELF']; ?>\"\
  \ method=\"POST\">\n<p><label for=\"guess\">在此处输入你的猜想：</label><br/>\n<input type=\"\
  text\" id=\"guess\" name=\"guess\" /></p>\n<input type=\"hidden\" name=\"num_tries\"\
  \ value=\"<?php echo $num_tries; ?>\"/>\n<button type=\"submit\" name=\"submit\"\
  \ value=\"submit\">提交</button>\n</form>\n</body>\n</html>\n```\n\n第 8 行 `if` 语句的\
  \ `elseif` 子句现在会让浏览器将用户重定向到一个名为 `congrats.html` 的页面。第 10 行的 `exit` 语句立即结束此脚本的执行和输出，这确保了当前页的所有输出都被中断。\n\
  \n## 在表单提交时发送邮件\n\n你已经了解了如何获取表单响应并将结果打印到屏幕上，所以距离将这些响应通过电子邮件发送出去只有一步之遥。然而，在学习发送邮件之前，请先阅读下一节，以确保你的系统已正确配置。\n\
  \n### `mail()` 函数的系统配置\n\n在用 `mail()` 函数发送邮件之前，你需要在 `php.ini` 文件中设置几个指令，以便该函数能够正常工作。使用文本编辑器打开\
  \ `php.ini` 并查找以下几行：\n\n点击此处查看代码图像\n\n```ini\n[mail function]\n; 仅限 Win32 使用。\n\
  ; http://php.net/smtp\nSMTP = localhost\n; http://php.net/smtp-port\nsmtp_port =\
  \ 25\n; 仅限 Win32 使用。\n; http://php.net/sendmail-from\n;sendmail_from = me@example.com\n\
  ; 仅限 Unix。你也可以提供参数（默认: \"sendmail -t -i\"）。\n; http://php.net/sendmail-path\n;sendmail_path\
  \ =\n```\n\n如果你使用 Windows 作为 Web 服务器平台，那么前两个指令适用于你。为了让 `mail()` 函数发送邮件，它必须能够访问一个有效的发邮件服务器。如果你计划使用自己选择的发邮件服务器，`php.ini`\
  \ 中的条目可能如下所示：\n\n```ini\nSMTP = smtp.yourisp.net\n```\n\n第二个配置指令是 `sendmail_from`，它是用于发件邮件中\
  \ `From` 头部部的邮箱地址。你可以在邮件脚本本身中覆盖它，但通常它作为默认值运行，如例所示：\n\n点击此处查看代码图像\n\n```ini\nsendmail_from\
  \ = youraddress@yourdomain.com\n```\n\n对于 Windows 用户来说，一个通用的规则是：无论你在该机器的邮件客户端中设置了什么发邮件服务器，你都应该将其作为\
  \ `php.ini` 中 `SMTP` 的值。\n\n如果你的 Web 服务器运行在 Linux/UNIX 平台上，你使用的是该特定机器的 `sendmail`\
  \ 功能。在这种情况下，只有最后一个指令适用于你：`sendmail_path`。默认值是 `sendmail -t -i`，但如果 `sendmail` 位于特殊位置，或者你需要指定不同的参数，请尽管如是，如下例所示（该示例未使用真实值）：\n\
  \n点击此处查看代码图像\n\n```ini\nsendmail_path = /opt/sendmail -arguments\n```\n\n在任何平台上对\
  \ `php.ini` 进行任何更改后，你必须重启 Web 服务器进程以使更改生效。\n\n## 创建表单\n\n在列表 11.10 中，你看到了创建一个名为\
  \ `feedback.html` 的简单表单的基础 HTML 代码。该表单的 `action` 设置为 `sendmail.php`，你将在下一节中创建它。`feedback.html`\
  \ 中的字段非常简单：第 8 行和第 9 行创建一个名称字段和标签，第 10 行和第 11 行创建一个回信地址字段。\n\n**11.10 创建简单表单**\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>邮件单</title>\n\
  </head>\n<body>\n<form action=\"sendmail.php\" method=\"POST\">\n<p><label for=\"\
  name\">在此处输入你的姓名：</label><br/>\n<input type=\"text\" id=\"name\" name=\"name\" /></p>\n\
  <p><label for=\"email\">你的邮箱地址：</label><br/>\n<input type=\"text\" id=\"email\"\
  \ name=\"email\" /></p>\n<p><label for=\"msg\">消息：</label><br/>\n<textarea id=\"\
  msg\" name=\"msg\" cols=\"30\" rows=\"5\"></textarea></p>\n<button type=\"submit\"\
  \ name=\"submit\" value=\"send\">发送消息</button>\n</form>\n</body>\n</html>\n```\n\
  \n将列表 11.10 所示的所有行放入名为 `feedback.html` 的文件中，并将其放置在 Web 服务器根目录下。现在通过浏览器访问该脚本，你应该看到类似图\
  \ 11.5](ch11.html_fig05)所示的内容。\n\n![image](img/11fig05.jpg)\n\n**图 11.5 列表 11.10\
  \ 创建的表单。**\n\n在下一节中，你将创建一个发送表单的脚本。\n\n## 创建发送邮件的脚本\n\n它与列表 11.4 在概念上略有不同，后者只是将响应打印到屏幕上。在列表\
  \ 11.11 所示的脚本中，除了将响应打印到屏幕外，你还将它们发送到邮箱地址。\n\n**11.11 发送反馈表单**\n\n点击此处查看代码图像\n\n```php\n\
  <?php\n  //开始构建邮件字符串\n  $msg  = \"姓名:\"._POST['name'].\"\\n\";\n  $msg .= \"邮箱:\"\
  ._POST['email'].\"\\n\";\n  $msg .= \"消息: \".$POST['message'].\"\\n\";\n\n  //设置邮件\n\
  \  $recipient = \"you@yourdomain.com\";\n  $subject = \"表单提交结果\";\n  $mailheaders\
  \ = \"From: 我的网站 <defaultaddress@yourdomain.com> \\n\";\n  $mailheaders .= \"Reply-To:\
  \ \".$POST['email'];\n\n  //发送邮件\n  mail($recipient, $subject, $msg, $mailheaders);\n\
  ?>\n```\n\n\n\n\n\n第 3 到 5 行创建了 `$msg` 变量，这是一个包含用户在表单字段中输入值的字符串（以及为了保险起见的一些标签文本）。该字符串构成了邮件的正文。注意在第\
  \ 4 和第 5 行向 `$msg` 变量添加内容时使用了连接操作符（`.=`）。\n\n第 8 和第 9 行是用于邮件收件人和邮件主题的硬编码变量。显然，请将\
  \ `you@yourdomain.com` 替换为你自己的电子邮箱地址。如果你想更改主题，也可以随意修改！\n\n第 10 和第 11 行设置了一些邮件表头，即\
  \ `From:` 和 `Reply-to:` 表头。你可以在 `From:` 表头中放入任何值；这是当你收到这封邮件时，显示在电子邮件应用程序的“发件人”或“发送者”列中的信息。\n\
  \n### 注意事项\n如果你的出站邮件服务器是 Windows 机器，你应该将换行符 `\\n` 替换为 `\\r\\n`。\n\n`mail()` 函数使用五个参数：收件者、主题、消息、任何额外的邮件表头以及任何额外的\
  \ sendmail 参数。在我们的示例中，只使用了前四个参数。这些参数的顺序在第 14 行所示。\n\n将这些行放入名为 `sendmail.php` 的文本文件中，并将该文件放在你的\
  \ Web 服务器的文档根目录下。使用你的网络浏览器返回表单，输入一些信息并点击提交按钮。你应该会在浏览器中看到类似图 11.6 的内容。\n\n![image](img/11fig06.jpg)\n\
  **图 11.6 sendmail.php 的示例结果。**\n\n如果你之后检查你的电子邮箱，应该会有一封邮件在候你。它看起来可能像图 11.7 所示。\n\n\
  ![image](img/11fig07.jpg)\n**图 11.7 从 sendmail.php 发送的邮件。**\n\n### 备注\n此示例不包含对表单元素的任何服务器端验证，只是假设用户已在表单中输入了值。在实际情况下，你应该在处理邮件之前，通过\
  \ JavaScript 或 HTML5 表单验证来检查在表单中输入的值是否存在以及是否有效。\n\n### 使用 HTML 格式化你的邮件\n发送 HTML\
  \ 格式邮件的“技巧”根本并不是技巧。事实上，它只涉及编写实际的 HTML 并修改 `mail()` 函数发送的表头。在列表 11.12 中（列表 11.11\
  \ 的变体），在第 12–14 行和第 18–19 行中进行了更改。\n\n**列表 11.12 发送简单的反馈表单：HTML 版本**\n\n点击此处查看代码图像\n\
  \n```php\n1:  <?php\n2:  //开始构建邮件字符串\n3:  $msg  = \"<p><<strong>>Name:</strong>\
  \    \".$_POST['name'].\"</p>\";\n4:  $msg .= \"<p><<strong>>E-Mail:</strong>  \"\
  .$_POST['email'].\"</p>\";\n5:  $msg .= \"<p><<strong>>Message:</strong> \".$_POST['message'].\"\
  </p>\";\n6:\n7:  //设置邮件\n8:  $recipient = \"you@yourdomain.com\";\n9:  $subject\
  \ = \"Form Submission Results\";\n10: $mailheaders  = \"MIME-Version: 1.0\\r\\n\"\
  ;\n11: $mailheaders .= \"Content-type: text/html; charset=ISO-8859-1\\r\\n\";\n\
  12: $mailheaders  = \"From: My Web Site <defaultaddress@yourdomain.com> \\n\";\n\
  13: $mailheaders .= \"Reply-To: \".$_POST['email'];\n14:\n15: //发送邮件\n16: mail($recipient,\
  \ $subject, $msg, $mailheaders);\n17: ?>\n18: <!DOCTYPE html>\n19: <html>\n20: <head>\n\
  21: <title>Sending the Simple Feedback Form - HTML Version</title>\n22: </head>\n\
  23: <body>\n24: <p>Thanks, <strong><?php echo $_POST['name']; ?></strong>,\n25:\
  \     for your message.</p>\n26: <p>Your e-mail address:\n27:     <strong><?php\
  \ echo $_POST['email']; ?></strong></p>\n28: <p>Your message: <br/> <?php echo $_POST['message'];\
  \ ?> </p>\n29: </body>\n30: </html>\n```\n\n在第 3–5 行中，消息字符串现在包含了 HTML 代码。额外的表头在第\
  \ 10–11 行中创建，将 Mime Version 表头设置为 1.0，并将 Content-type 表头设置为 `text/html`，字符集为 `text/html`。当在支持\
  \ HTML 的客户端中打开时，消息字符串中的 HTML 将按预期显示，如图 11.8 所示。\n\n![image](img/11fig08.jpg)\n**图\
  \ 11.8 从列表 11.12 发送的邮件。**\n\n## 处理文件上传\n到此为止，你已经查看了简单的表单输入。然而，网络浏览器支持文件上传，PHP 自然也支持。。在本节中，你将检查\
  \ PHP 提供的用于处理此类输入的功能。关于上传文件的信息将通过 `$_FILES` 超全局变量提供给你，该变量通过名称进行索引。\n\n![image](img/11tab01.jpg)\n\
  **表 11 上传变量**\n\n#### 创建上传表单\n首先，你必须创建一个 HTML 表单来处理文件。HTML 表单必须包含 `ENCTYPE` 参数：`enctype=\"\
  multipart/form-data\"`。html```1: <!DOCTYPE html>\n2: <html>\n3: <head>\n4: <title>Simple\
  \ upload form</title>\n5: </head>\n6: <body>\n7: <form action=\"do_upload.php\"\
  \ enctype=\"multipart/form-data\" method=\"POST\">\n8: <input type=\"hidden\" name=\"\
  FILE_SIZE\" value=\"1048576\" />\n9: <p><label for=\"fileupload\">File to Upload:</label>\n\
  10: <input type=\"file\" id=\"fileupload\" name=\"fileupload\" /></p>\n11: <button\
  \ type=\"submit\" name=\"submit\" value=\"Upload\">button>\n12: </form>\n13: </body>\n\
  14: </html>\n```\n**列表 11.13 简单的上传表单**\n\n正如你所见，上传限制在第 8 行的 1MB（或 1048576 字节），文件上传字段的名为\
  \ `fileupload`，如第 8 行所示。将此列表保存为名为 `fileupload.html` 的文本文件，并将该文件放在你的 Web 服务器的文档根目录下。使用浏览器访问此表单，你应该看到类似图\
  \ 11.9 的内容。\n\n![image](img/11fig09.jpg)\n**图 11.9 由列表 11.13 创建的表单。**\n\n此表单调用 `do_upload.php`\
  \ 脚本，你接下来将创建它。\n\n#### 创建上传脚本\n如果你记得 `$_FILES` 的信息，你就拥有编写简单的文件上传脚本所需的所有信息。该脚本是列表\
  \ 11.14 中创建的表单的后端。\n\n**列表 11.14 文件上传脚本**\n\n```php\n1:  <?php\n2:  $file_dir =\
  \ \"/path/to/upload/directory\";\n3:\n4:  foreach($_FILES as $file_name => $file_array)\
  \ {\n5:      echo \"path: \".$file_array['tmp_name'].\"<br/>\\n\";\n6:      echo\
  \ \"name: \".$file_array['name'].\"<br/>\\n\";\n7:      echo \"type: \".$file_array['type'].\"\
  <br/>\\n\";\n8:      echo \"size: \".$file_array['size'].\"<br/>\\n\";\n9:\n10:\
  \     if (is_uploaded_file($file_array['tmp_name'])) {\n11:         move_uploaded_file($file_array['tmp_name'],\n\
  12:             \"$file_dir/\".$file_array['name'])\n```\n\n\n\n\n```php\n13:  \
  \           or die (\"Couldn't move file\");\n14:             echo \"File was moved!\"\
  ;\n15:     } else {\n16:         echo \"No file found.\";\n17:     }\n18: }\n19:\
  \ ?>\n```\n\n在 Listing 11.14 中，你首先在第 2 行创建了 `$file_dir` 变量来存储路径信息。该路径应该是系统中存在的，并且\
  \ Web 服务器用户（例如 `httpd`、`www`、`nobody`）必须对其拥有写入权限。\n\n***\n\n### 注意事项\n\n第 2 行使用的路径是\
  \ Linux/UNIX 路径。Windows 用户应使用包含盘器的路径，如下：\n\n```\n$file_dir = \"C:\\Users\\You\\\
  Desktop\";\n```\n\n***\n\n第 4 行开始了一个 `foreach` 语句，该语句循环遍历 `$_FILES` 数组中的每一个元素。使用\
  \ `foreach` 循环而不是 `if` 语句是为了使脚本能够扩展，以处理同一页面上的多个上传。从第 4 行开始的 `foreach` 循环将上传的文件名存储在\
  \ `$file_name` 变量中，将文件信息存储在 `$file_array` 变量中。然后你可以输出有关上传的信息。\n\n在将上传的文件从临时位置移动到第\
  \ 2 行指定的的位置之前，首先检查文件是否存在（已上传）。代码在第 10 行使用 `is_uploaded_file()` 函数执行了此操作。该函数接受上传文件的路径，并仅在所涉及的文件是有效的上传文件时才返回\
  \ `true`。因此，此函数增强了你脚本的安全性。\n\n假设一切顺利，文件在第 11 行到第 13 行从其临时位置复制到新目录。另一个函数 `move_uploaded_file()`\
  \ 被用于此目的。该函数将文件从一个地方复制到另一个地方，并会首先执行与 `is_uploaded_file()` 相同的安全检查。`move_uploaded_file()`\
  \ 函数需要源文件的路径和目标文件的路径。如果移动成功，它返回 `true`；如果文件不是有效的上传文件或找不到文件，则返回 `false`。\n\n***\n\
  \n### 警告\n\n注意上传的文件名。像 Mac OS 和 Windows 等操作系统在文件命名方面非常宽松，因此要预料上传的文件可能带有空格、引号以及各种其他意外之外的字符。因此，过滤文件名是一个极好主意。\n\
  \n将 Listing 11.14 中的所有代码放入名为 `do_upload.php` 的文本文件中，并将该文件放在你的 Web 服务器文档根目录下。使用网络浏览器返回表单，然后尝试上传文件。如果成功，你应该会在浏览器中看到类似图\
  \ 11.10 的内容。\n\n![image](img/11fig10.jpg)\n\n**图 11.10 来自 Listing 11.14 的示例结果。**\n\
  \n### 总结\n\n现在真的变得非常有趣了。当然，还有一些内容缺失，但书中还有很多内容。既然你已经可以从用户那里获取信息，如果能对这些信息做什么就太好了——也许将其写入文件？那是下一章节的主题。\n\
  \n在本章中，你学习了如何处理各种超全局变量和表单输入。你还学习了如何向客户端发送原始头以重定向浏览器。你学习了如何从表单提交获取列表信息，以及如何使用隐藏字段在脚本调用与调用之间传递信息。你还学习了如何通过电子邮件发送表单结果，以及如何使用\
  \ PHP 脚本通过网络浏览器上传文件。\n\n### 问答\n\n**Q. 当我在网上提交其他表单时，有时会在指向下一个页面的 URL 中看到输入的所有值。这是为什么？**\n\
  \n**A.** 如果你提交了一个表单（例如 Google 搜索），并且你看到的下一个 URL 包含了你输入的值，例如搜索“cheese”，这可能会产生如下的\
  \ URL：\n\n`https://www.google.com/#hl=en&output=search&q=cheese`\n\n那么你看到的是使用 `GET`\
  \ 而不是 `POST` 动作的表单输出。在这种情况下，至少有两个字段——一个隐藏字段，称为“output”，另一个是你可见的，称为“q”（推测是 query\
  \ 的含义。“cheese”的值就是你在 `INPUT` 字段中输入的值。\n\n**Q. 为什么我需要在表单上限制上传大小？**\n\n**A.** 如果在设计用于上传文件的表单中不限制上传大小，你可能会导致用户执行一个他们永远无法完成的操作，这可能会冻结他们的系统和你的系统。考虑一下当你正准备接受数字图像上传的情况。\n\
  \n### 工作坊\n\n该工作坊旨在帮助你复习所学内容。\n\n### 测验\n\n1. 你使用哪个变量来查找脚本的名称？\n2. 哪个内置数组包含了所有通过\
  \ `POST` 提交的值？\n3. 哪个内置数组包含了所有作为文件提交的值？\n4. 你使用哪个函数将浏览器重定向到新页面？\n5. `mail()` 函数使用的五个参数是什么？\n\
  6. 在客户端，你如何限制用户可以提交的文件大小？\n\n### 答案\n\n1. `$_SERVER['PHP_SELF']`\n2. `$_POST`\n\
  3. `$_FILES`\n4. `header()`\n5. 接收者、主题、消息字符串、额外头以及额外参数。\n6. 在你的表单中使用名为 `FILE_SIZE`\
  \ 的隐藏字段。\n\n### 活动\n\n1. 创建一个计算器脚本，使用户能够提交两个数字并选择一种操作（加法、乘法、除法或减法）对这些数字进行运算。\n2.\
  \ 使用你在活动 1 中创建的脚本配合隐藏字段，存储并显示用户提交的请求次数。\n\n\n\n\n\n在设置 cookie 后，只有源主机可以读取该数据，这确保了用户的隐私得到尊重。此外，用户可以配置浏览器，在接收到所有\
  \ cookie 时通知他们，甚至拒绝所有的 cookie 请求。因此，使用 cookie 应当适度，且在没有先警告用户的情况下，不应将其视为环境设计中的核心元素。\n\
  \n## Cookie 的结构\n\n设置 cookie 的 PHP 脚本可能会发送类似于所示的头部：\n\n点击此处查看代码图像\n\n```\nHTTP/1.1\
  \ 200 OK\nDate: Wed, 18 Jan 2012 10:50:58 GMT\nServer: Apache/2.2.21 (Unix) PHP/5.4.0\n\
  X-Powered-By: PHP/5.4.0\nSet-Cookie: vegetable=artichoke; path=/; domain=yourdomain.com\n\
  Connection: close\nContent-Type: text/html\n```\n\n如你所见，此 `Set-Cookie` 头部包含一个名称/值对、一个路径和一个域名。如果设置了，`expiration`\
  \ 字段提供了浏览器应该“忘记” cookie 值的日期。如果没有设置过期日期，cookie 将在用户会话结束时过期——即用户关闭浏览器时。\n\n`path`\
  \ 和 `domain` 字段共同工作：`path` 是 `domain` 上的一个目录，cookie 应该在该目录之下的被发送回服务器。如果路径为 `\"/\"\
  `（这很常见），意味着文档根目录下的任何文件都可以读取该 cookie。如果路径为 `/products/`，则 cookie 只能被网站中 `/products`\
  \ 目录下的文件读取。\n\n`domain` 字段表示允许基于 cookie 通的互联网域名。例如，如果你的域名是 `www.yourdomain.com`\
  \ 且你使用 `www.yourdomain.com` 作为 cookie 的域名值，则该 cookie 仅在浏览 `www.domain.com` 网站时有效。如果你在用户浏览过程中将其引导到类似\
  \ `www2.domain.com` 或 `billing.domain.com` 的某些域名，可能会产生问题，因为原始 cookie 将不再有效。因此，通常的做法是在\
  \ cookie 定义中将域名插槽的值简单以点开头，而省略主机名（例如 `.domain.com`）。通过这种方式，cookie 对该域名上的所有主机都有效。域名不能与发送\
  \ cookie 的域名不同；否则，cookie 将无法正常工作（如果还能工作的话），或者浏览器将完全拒绝该 cookie。\n\n## 访问 Cookie\n\
  \n如果你的网页浏览器配置为存储 cookie，它会保留基于 cookie 的信息，直到过期日期。如果用户将浏览器指向任何匹配 cookie 路径和域名的页面，它会将\
  \ cookie 重新发送到服务器。浏览器的头部可能看起来如下：\n\n点击此处查看代码图像\n\n```\nGET / HTTP/1.0\nConnection:\
  \ Keep-Alive\nUser-Agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) AppleWebKit/537.36\
  \ (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36\nHost: www.yourdomain.com\n\
  ```\n\n随后，PHP 脚本就可以通过环境变量 `HTTP_COOKIE` 中的内容，或者作为 `$_COOKIE` 超全局变量的一部分来访问 cookie，你可以通过三种方式访问它：\n\
  \n点击此处查看代码图像\n\n```\necho $_SERVER['HTTP_COOKIE']; // 将打印 \"vegetable=artichoke\"\
  \necho getenv('HTTP_COOKIE'); // 将打印 \"vegetable=artichoke\"\necho $_COOKIE['vegetable'];\
  \ // 将打印 \"artichoke\"\n```\n\n## 使用 PHP 设置 Cookie\n\n你可以通过两种方式在 PHP 脚本中设置 cookie。首先，你可以使用\
  \ `header()` 函数来设置 `Set-Cookie` 头部。`header()` 函数需要一个字符串，该字符串将被包含在服务器响应的头部部分。因为头部会自动为你发送，所以必须在向浏览器发送任何输出之前调用\
  \ `header()`：\n\n点击此处查看代码图像\n\n```php\nheader(\"Set-Cookie: vegetable=artichoke;\
  \ expires=Thu, 19-Jan-2012 14:39:58 GMT; path=/; domain=yourdomain.com\");\n```\n\
  \n虽然并不困难，但这种设置 cookie 的方法需要你构建头部字符串。尽管像示例这样格式化日期并对名称/值对进行编码并不是特别困难的任务，但 PHP 提供了一个恰恰可以完成此工作的函数：`setcookie()`。`setcookie()`\
  \ 函数的作用正如其名称所示——输出一个 `Set-Cookie` 头部。出于如此，它应该在向浏览器发送任何其他内容之前调用。该函数接受 cookie 名称、cookie\
  \ 值、UNIX 戳格式的过期日期、路径、域名以及一个整数（如果 cookie 仅通过安全连接发送，则该整数应被设置为 `1`）。除了第一个参数（cookie\
  \ 名称）外，该函数的所有参数都是可选的。\n\n列表 `12.1`（见下文）使用了 `setcookie()` 来设置一个 cookie。\n\n#### 列表\
  \ 12.1 设置并打印 Cookie 值\n\n点击此处查看代码图像\n\n```php\n<?php\nsetcookie(\"vegetable\", \"\
  artichoke\", time()+3600, \"/\", \".domain.com\", 0);\n\nif (isset($_COOKIE['vegetable']))\
  \ {\n    echo \"<p>再次好！你选择了 \".$COOKIE['vegetable'].</p>\";\n} else {\n    echo\
  \ \"<p>你好，可能是你第一次访问。</p>\";\n}\n?>\n```\n\n即使列表 12.1 在脚本首次运行时设置了 cookie（第 2 行），`$_COOKIE['vegetable']`\
  \ 变量此时也不会创建。由于 cookie 只有在浏览器将其发送到服务器时才被读取，在用户访问该域名内的页面之前，你无法读取它。\n\n第 2 行将 cookie\
  \ 名称设置为 `\"vegetable\"`，并将 cookie 值设置为 `\"artichoke\"`。`time()` 函数获取当前时间并加上 `3600`（3600\
  \ 秒即一小时）。此总和代表过期日期。代码定义的路径为 `\"/\"`，这意味着该服务器环境内的任何页面都可以发送 cookie。域名参数设置为 `\".domain.com\"\
  `（如果你在 `localhost` 上工作，应进行适用于你自己的更改或留空），这意味着 cookie 将发送到该组的任何服务器。最后，代码向 `setcookie()`\
  \ 传递 `0`，表示可以在不环境中发送 cookie。\n\n向 `setcookie()` 的字符串参数传递空字符串 `\"\"` 或向整数字段传递 `0`\
  \ 会导致这些参数被忽略。\n\n### 注意事项\n在 cookie 中动态创建过期时间时（如列表 12.1 所示），请注意过期时间是通过向运行 Apache\
  \ 和 PHP 的机器当前系统时间增加特定的秒数创建的。如果此系统钟不准确，机器可能会发送一个已经过期的 cookie。\n\n你可以在大多数现代网页浏览器中查看你的\
  \ cookie。图 12.1 显示了列表 12.1 存储的 cookie 信息。cookie 名称、内容和过期日期符合预期；域名名在你自己的域名上运行此脚本时会有不同。\n\
  \n![image](img/12fig01.jpg)\n\n**图 12.1 在网页浏览器中查看存储的 cookie。**\n\n\n\n\n然而，这种方法并不总是有效，你不应该依赖它。相反，要删除\
  \ cookie，最安全的方法是设置 cookie 时指定一个你确定已经过期的日期：\n\n点击此处查看代码图像\n\n```php\nsetcookie(\"\
  vegetable\", \"\", time()-60, \"/\", \".yourdomain.com\", 0);\n```\n\n同时，确保在调用 `setcookie()`\
  \ 时，使用了与最初设置 cookie 时相同的 `path`、`domain` 和 `secure` 参数。\n\n## Session（会话）概述\n\n\
  Session 函数为用户提供一个唯一标识符，该标识符可以用于存储和获取与该 ID 关联的信息。当访问访问启用了 session 的页面时，系统会分配一个新的标识符，或者将用户与之前访问时已建立的标识符重新关联。任何与会话关联的变量都可以通过\
  \ `$_SESSION` 超全局变量供你的代码使用。\n\nSession 状态通常存储在临时文件中，尽管你可以使用名为 `session_set_save_handler()`\
  \ 的函数来实现数据库存储或其他服务器端存储方法。`session_set_save_handler()` 的使用以及对其他高级会话功能的讨论超出了本书的范范围，但你可以在\
  \ PHP 手册的 sessions 部分找到此处未讨论的所有条目的更多详细信息。\n\n## 启动 Session\n\n要使用会话，你需要显式地启动或恢复该会话，*除非*你更改了\
  \ `php.ini` 配置文件。默认情况下，session 不会自动启动。如果你想通过这种方式启动会话，你必须在 `php.ini` 文件中找到以下行，并将值从\
  \ `0` 更改为 `1`（并重启 Web 服务器）：\n\n```ini\nsession.auto_start = 0\n```\n\n通过将 `session.auto_start`\
  \ 的值更改为 `1`，你可以确保每个 PHP 文档都会启动会话。如果你不更改此设置，则需要在每个脚本中调用 `session_start()` 函数。\n\n\
  会话启动后，你就可以通过 `session_id()` 函数立即访问用户的会 ID。`session_id()` 函数允许你设置或检索会 ID。列表 12.2\
  \ 启动了一个会话并将会 ID 打印到浏览器。\n\n**列表 12.2** 启动或恢复会话\n\n点击此处查看代码图像\n\n```php\n1: <?php\n\
  2: session_start();\n3: echo \"<p>Your session ID is \".session_id().\".</p>\";\n\
  4: ?>\n```\n\n当从浏览器首次运行此脚本（我们称其为 `session_checkid.php`）时，第 2 行的 `session_start()`\
  \ 函数调用会生成一个会 ID。如果稍后重新加载或访问脚本，则会为用户分配相同的会 ID。此操作假设用户已启用了 cookie。例如，当我第一次运行此脚本时，输出如下：\n\
  \n点击此处查看代码图像\n\nYour session ID is 8jou17in51d08e5onsjkbles16.\n\n当我重新刷新页面时，输出仍然是\n\
  \n点击此处查看代码图像\n\nYour session ID is 8jou17in51d08e5onsjkbles16.\n\n因为我启用了 cookie\
  \ 且会 ID 仍然存在。\n\n由于 `start_session()` 在首次启动会话时会尝试设置 cookie，因此必须在向浏览器输出任何其他内容之前调用此函数。如果你不遵守此规则，你的会将无法设置，并且可能会在页面上看到警告。\n\
  \n只要 浏览器处于激活状态，会就会保持有效。当用户重启浏览器时，cookie 将不再存储。你可以通过更改 `php.ini` 文件中的 `session.cookie_lifetime`\
  \ 设置来改变此行为。默认值为 `0`，但你可以设置以秒为单位的有效期。\n\n## 使用 Session 变量\n\n在每个 PHP 文档中访问唯一的 session\
  \ 标识符只是会功能的开始。启动 session 后，你可以在 `$_SESSION` 超全局变量中存储任意数量的变量，然后在启用了 session 的页面上访问它们。\n\
  \n列表 12.3 向 `$_SESSION` 超全局变量添加了两个变量：`product1` 和 `product2`（第 3 和第 4 行）。\n\n**列表\
  \ 12.3** 在会话中存储变量\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: session_start();\n3: $_SESSION['product1']\
  \ = \"Sonic Screwdriver\";\n4: $_SESSION['product2'] = \"HAL 2000\";\n5: echo \"\
  The products have been registered.\";\n6: ?>\n```\n\n列表 12.3 中的魔力直到用户移动到新页面时才会显现。列表\
  \ 12.4 创建了一个独立的 PHP 脚本，访问存储在 `$_SESSION` 超全局变量中的变量。\n\n**列表 12.4** 访问已存储的 Session\
  \ 变量\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: session_start();\n3: ?>\n4: <p>Your products\
  \ are:</p>\n5: <ul>\n6: <li><?php echo $_SESSION['product1']; ?></li>\n7: <li><?php\
  \ echo $_SESSION['product2']; ?></li>\n8: </ul>\n```\n\n图 12.2 显示了新页面上的 `$_SESSION['product1']`\
  \ 和 `$_SESSION['product2']`。\n\n**图 12.2** 访问会话变量\n\n这不是一个非常有趣的示例，但它展示了如何访问会话变量。在后台，PHP\
  \ 将信息写入文件。你可以通过使用 `session_path()` 找到它。该函数可选地接受一个路径并写入会话文件。如果你向它传递参数，它将返回当前目录。在我的系统上，它打印\
  \ `/tmp`：\n\n```\nsess_8jou17in51d08e5onsjkbles16\n```\n\n当值被放入 `$_SESSION` 超全局变量时，PHP\
  \ 将变量名和值写入文件。这些信息可以被读取和恢复——正如你所看到的。将变量添加到超全局变量后，你可以在脚本执行期间随时更改其值，但在重新赋值给变量之前，更改的值不会反映在全局设置中。\n\
  \n列表 12.3 演示了向 `$_SESSION` 超全局变量添加变量的过程。然而，这个示例并不灵活。理想情况下，你应该能够注册不同数量的值。例如，你可能想让用户从列表中选择。在这种情况下，你可以使用\
  \ `serialize()` 函数将数组存储在会话中。列表 12.5 创建了一个允许用户选择多个产品的表单。你使用会话变量来创建一个原始的购物车。\n\n**列表\
  \ 12.5** 将数组变量添加到会话变量\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: session_start();\n3:\
  \ ?>\n4: <!DOCTYPE html>\n5: <html>\n6: <head>\n7: <title>Storing an array with\
  \ a session</title>\n8: </head>\n9: <body>\n10: <h1>Product Choice Page</h1>\n11:\
  \ <?php\n12: if (isset($_POST['form_products'])) {\n13:   if (!empty($_SESSION['products']))\
  \ {\n14:       $products = array_unique(\n15:       array_merge(unserialize($_SESSION['products']),\n\
  ```\n\n\n\n\n```php\n16:           $_POST['form_products']));\n17:           $_SESSION['products']\
  \ = serialize($products);\n18:     } else {\n19:           $_SESSION['products']\
  \ = serialize($_POST['form_products']);\n20:     }\n21:     echo \"<p>Your products\
  \ have been registered!</p>\";\n22: }\n23: ?>\n<form method=\"post\" action=\"<?php\
  \ echo $_SERVER['PHP_SELF']; ?>\">\n<p><label for=\"form_products\">Select some\
  \ products:</label><br />\n<select id=\"form_products\" name=\"form_products[]\"\
  \ multiple=\"multiple\"\n    size=\"3\">\n<option value=\"Sonic Screwdriver\">Sonic\
  \ Screwdriver</option>\n<option value=\"Hal 2000\">Hal 2000</option>\n<option value=\"\
  Tardis\">Tardis</option>\n<option value=\"ORAC\">ORAC</option>\n<option value=\"\
  Transporter bracelet\">Transporter bracelet</option>\n</select></p>\n<button type=\"\
  submit\" name=\"submit\" value=\"choose\">Submit Form</button>\n</form>\n<p><a href=\"\
  session1.php\">go to content page</a></p>\n</body>\n</html>\n```\n\n该列举列表通过在第 2\
  \ 行调用 `session_start()` 来启动或恢复会话。此调用可以访问任何之前设置的会话变量。HTML 表单始于第 24 行，并在第 26 行创建了一个名为\
  \ `form_products[]` 的 `SELECT` 元素，其中包含若干个产品的 `OPTION` 元素。\n\n### 注意\n\n请记住，允许多项选择的\
  \ HTML 表单元素（如复选框和多选列表）应该在其 `NAME` 属性的值后面添加方括号。这使得用户的选择能够以数组的形式提供给 PHP。\n\n从第 11\
  \ 行开始的 PHP 代码块测试了 `$_POST['form_products']` 数组是否存在（第 12 行）。如果该变量存在，你就可以假设表单已经提交，并且信息已经存储在\
  \ `$_SESSION` 超全局变量中。\n\n第 12 行测试了名为 `$_SESSION['products']` 的数组。如果该数组存在，说明它是在之前访问此脚本时填充的，因此代码将其与\
  \ `$_POST['form_products']` 数组合并，提取唯一元素，并将结果重新赋值给 `$products` 数组（第 14–16 行）。然后，$products`\
  \ 数组在第 17 行被添加到 `$_SESSION` 超全局变量中。\n\n第 35 行包含一个指向另一个脚本的链接，该脚本将演示如何访问用户选择的产品。这个新脚本在列表\
  \ 12.6 中创建，在此期间，你可以将列表 12.5 中的代码保存为 `arraysession.php`。\n\n继续查看列表 12.6，你将看到如何访问在\
