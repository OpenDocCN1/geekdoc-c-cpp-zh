  \n请记住，允许多项选择的 HTML 表单元素（如复选框和多选列表）应该在其 `NAME` 属性的值后面添加方括号。这使得用户的选择能够以数组的形式提供给 PHP。\n\
  \n\n\n\n你可以将这些功能元素中的每一个存储在会话（session）中。当用户登录时，应用程序会将所有相关值加载到用户的会话中，并对后的每个页面做出相应的响应。如果用户决定更改偏好，她可以在登录状态下进行——你甚至可以根据会话中存储的项目来预填充一个“偏好”表单，而无需返回数据库检索这些内容。如果用户在登录期间更改了任何偏好，只需用新的选择替换\
  \ `$_SESSION` 全局变量中存储的值即可——无需强制用户注销并重新登录。\n\n### 总结\n\n在本章中，你学习了在无状态协议中保存状态的各种方法，包括设置\
  \ cookie 和启动会话。所有保存状态的方法都使用了某种形式的 cookie 或查询字符串，有时会结合文件或数据库的使用。这些方法都有其优缺点和缺点。\n\n\
  你学到单的 cookie 本身在本质上不可靠，而且无法存储大量信息。然而，它可以持续很长时间。将信息写入文件或数据库的方法会在速度上产生一定的成本，并且在热门网站上可能会成为问题；这是需要你与系统管理员探讨的话题。\n\
  \n关于会话本身，你学习了如何使用 `session_start()` 来启动或恢复会话。在会话期间，你学习了如何向 `$_SESSION` 全局变量中添加变量、检查它们是否存在、在需要时取消它们以及销毁整个会话。\n\
  \n### 问答\n\n**Q. 如果用户禁用了 cookie，我的应用程序会发生什么？**\n\n**A.** 简单来说，如果你的应用程序严重依赖 cookie\
  \ 而用户禁用了 cookie，那么你的应用程序将无法工作。不过，你可以尽力，通过宣布你打算使用 cookie 来警告用户 cookie 即到来，并在对应用程序执行任何“重要”操作之前检查\
  \ cookie 是否启用。当然，这种想法是：即使用户忽略了你关于必须开启 cookie 才能使用应用程序的提示，但如果你的 cookie 测试失败，明确禁止用户执行操作，也能引起他们的注意！\n\
  \n**Q. 我是否应该注意会话函数的任何陷阱？**\n\n**A.** 会话函数通常是可靠的。但是，请记住，cookie 无法跨域读取。因此，如果你的项目在同一台服务器上使用了多个域名名（例如作为电子商务环境的一部分），你可能需要通过在\
  \ `php.ini` 文件中将 `session.use_cookies` 指令设置为 `0` 来考虑禁用会话 cookie。\n\n### 工作坊\n\n\
  该工作坊旨在帮助你回顾所学内容并开始将知识付实践。\n\n### 测验\n\n**1.** 在 PHP 脚本中你会使用哪个函数来启动或恢复会话？\n\n**2.**\
  \ 哪个函数可以返回当前会话的 ID？\n\n**3.** 如何结束会话并擦除其所有痕迹以备将来访问？\n\n### 答案\n\n**1.** 你可以在脚本中使用\
  \ `session_start()` 函数来启动会话。\n\n**2.** 你可以使用 `session_id()` 函数访问会话的 ID。\n\n**3.**\
  \ `session_destroy()` 函数会移除未来请求的所有会话痕迹。\n\n### 活动\n\n• 创建一个使用会话函数的脚本，跟踪用户访问了环境中的哪些页面。\n\
  \n• 创建一个新脚本，为用户列出她在环境中访问的所有页面以及访问时间。\n\n## 第 13 章.文件与目录的操作\n\n* * *\n\n在本章中，你将学习以下内容：\n\
  \n- **如何在你的文档中包含其他文件**\n- **如何测试文件和目录是否存在**\n- **在处理文件之前如何打开它**\n- **如何从文件中读取数据**\n\
  - **如何向文件写入或追加内容**\n- **如何锁定文件**\n- **如何操作目录**\n- **如何向外部应用程序管道（pipe）传输数据**\n- **如何发送\
  \ shell 命令并在浏览器中显示结果**\n\n* * *\n\n测试文件是否存在、从文件中读取内容以及向其写入内容是任何丰富编程语言的重要特性。PHP 也不例外，因为它提供了让这些过程变得简单直接的函数。此外，由于\
  \ PHP、Apache 和 MySQL 并不是你机器上唯一的应用程序，你有时需要从 PHP 代码内部访问那些其他应用程序，本章将向你展示如何进行操作。\n\n\
  ## 包含文件\n\n`include` 语句允许你将其他文件（通常是其他 PHP 脚本）整合到你的 PHP 文档中。这些包含的文件中的 PHP 代码将像主文档的一部分一样被执行。这对于在多个页面中包含代码库非常有用。\n\
  \n例如，假设你创建了一个非常有用的函数。如果没有 `include` 语句，你唯一的选择是将你的新函数粘贴到每个需要使用它的文档中。当然，如果你发现了一个 bug\
  \ 或想添加一个功能，你必须找到每个粘贴了该函数的页面并进行修改——一遍又一遍。`include` 语句让你免于了这种苦差工作。你可以将新创建的函数添加到单个文档中（例如\
  \ `myinclude.php`），并在运行时读取它。\n\n`include` 语句需要一个参数：要包含的文件的相对路径。示例 13.1 创建了一个使用 `include`\
  \ 的简单 PHP 脚本。\n\n```php\n<?php\ninclude 'myinclude.php';\n?>\n```\n\n示例 13.1 中的\
  \ `include` 语句包含了 `myinclude.php`，其内容可以在示例 13.2 中看到。\n\n```\nI have been included!!\n\
  ```\n\n将示例 13.1 的内容放入文件 `test_include.php` 中，将示例 13.2 的内容放入文件 `myinclude.php` 中。将这两个文件都放在你的\
  \ Web 服务器根目录下。当你通过浏览器访问 `test_include.php` 时，屏幕上的输出如下：\n\nI have been included!!\n\
  \n这可能让你觉得很奇怪，因为你正在 PHP 代码块中包含纯文本。事实上，包含文件的内容默认以文本形式显示。如果你想在包含文件中执行 PHP 代码，必须将其封装在\
  \ PHP 开始和结束标签之间。示例 13.3 修改了 `myinclude.php` 的内容，以便在包含文件中执行代码。\n\n```php\n<?php\n\
  echo \"I have been included!<br/>\";\necho \"But now I can add up...  4 + 4 = \"\
  .(4 + 4);\n?>\n```\n\n将示例 13.3 的内容放入文件 `myinclude2.php`，并更改 `test_include.php` 中包含的文件的值指向这个新文件。将这两个文件都放在你的\
  \ Web 服务器根目录下。现在，当你通过浏览器访问 `test_include.php` 时，屏幕上的输出如下：\n\nI have been included!!\n\
  \nBut now I can add up... 4 + 4 = 8\n\n你看到数字 8 的唯一方法是 4 加 4 的代码被作为 PHP 执行了，而它确实执行了。\n\
  \n\n\n\nPHP 中包含的文件可以像函数一样返回结果。与函数一样，使用 `return` 语句会结束被包含文件中代码的执行。此外，将不再包含任何额外的 HTML\
  \ 内容。列表 13.4 和 13.5 展示了如何包含一个文件并将其返回值赋值给变量。\n\n**列表 13.4** 使用 include 执行 PHP 并赋值返回值\n\
  \n点击此处查看代码图像\n\n```php\n<?php\n$addResult = include 'returnvalue.php';\necho \"\
  The include file returned \".$addResult;\n?>\n```\n\n**列表 13.5** 一个返回值的值的包含文件\n\n\
  点击此处查看代码图像\n\n```php\n<?php\n$retval = ( 4 + 4 );\nreturn $retval;\n?>\n这段 HTML\
  \ 永远不会显示，因为它位于一个 return 语句之后！\n```\n\n将 列表 13.4 的内容放入名为 `test_returnvalue.php` 的文件中；将\
  \ 列表 13.5 的内容放入名为 `returnvalue.php` 的文件中。将这两个文件都放在你的 Web 服务器文档根目录下。当你通过浏览器访问 `test_returnvalue.php`\
  \ 时，输出如下：\n\nThe include file returned 8.\n\n正如 列表 13.5 第 5 行字符串所示，如果包含文件中存在 PHP\
  \ 块，则 PHP 块之外的任何内容都不会显示。\n\n### 在控制结构中使用 `include`\n\n如果你在条件语句中使用 `include` 语句，它会被像其他代码一样被处理——只有在满足条件时才会包含文件。例如，以下代码段中的\
  \ `include` 语句永远不会被调用：\n\n点击此处查看代码图像\n\n```php\n$test = \"1\";\nif ($test == \"\
  2\") {\n    include 'file.txt'; // 不会被包含\n}\n```\n\n如果你在循环中使用 `include` 语句，文件会在每次循环迭代时被字面地包含。列表\
  \ 13.6 通过在 `for` 循环中使用 `include` 语句说明了这一概念。`include` 语句在每次迭代中都会引用不同的文件。\n\n**列表\
  \ 13.6** 在循环中使用 include\n\n点击此处查看代码图像\n\n```php\n<?php\nfor ($x = 1; $x<=3; $x++)\
  \ {\n    $incfile = \"incfile\".$x.\".txt\";\n    echo \"Attempting to include \"\
  .$incfile.\"<br/>\";\n    include $incfile;\n    echo \"<hr/>\";\n}\n?>\n```\n\n\
  将 列表 13.6 的内容保存到名为 `loopy_include.php` 的文件中，并将其放在 Web 服务器的文档根目录下，同还有三个不同的文件：`incfile1.txt`、`incfile2.txt`\
  \ 和 `incfile3.txt`。如果我们假设这些文件每个仅包含其自身名称的确认，则输出应该像 图 13.1。\n\n![image](img/13fig01.jpg)\n\
  \n**图 13.1 loopy_include.php 的输出。**\n\n尽管这段代码运行良好，但正如下一个小节所讨论的，这种这样使用 `include`\
  \ 函数有时并不是一个非常好的主意。\n\n## 使用 `include_once`\n\n在你的代码中使用多个不同的代码库引起的一个问题是：对同一个文件调用两次\
  \ `include` 的危险。这有时在较大的项目中会发生，当不同的库文件对公共文件调用 `include` 时。两次包含同一个文件会导致函数和类的重复声明，从而让\
  \ PHP 引擎感到非常困扰。\n\n这种情况通过使用 `include_once` 语句代替 `include` 语句来解决。`include_once` 语句需要一个包含文件的路径，并且在第一次被调用时的行为与\
  \ `include` 语句相同。然而，如果在脚本执行期间再次对同一个文件调用 `include_once`，则该文件不会再次被包含。这使得 `include_once`\
  \ 成为创建可重用代码库的工具！\n\n### `include_path` 指令\n\n使用 `include` 和 `include_once` 访问你的代码库可以增加项目的灵活性和重用性。然而，仍然会有需要解决的问题。特别是可移植性，如果你硬编码了包含文件的路径，可能会受到影响。想象你创建了一个\
  \ `lib` 目录并在整个项目中引用它：\n\n点击此处查看代码图像\n\n```php\ninclude_once '/home/user/bob/htdocs/project4/lib/mylib.inc.php';\n\
  ```\n\n当你将项目移动到新服务器时，如果这些路径在百个或更多文件中都是被硬编码的，你可能会发现你必须更改一百或更多个 `include` 路径。你可以通过设置\
  \ `include_path` 来逃避这种命运。\n\n\n\n\n`is_readable()` 函数告诉你是否可以读取一个文件。在 UNIX 系统上，你可能可以看到一个文件，但仍因为其用户权限而被禁止读取其内容。`is_readable()`\
  \ 函数接受一个字符串格式的文件路径，并返回一个布尔值：\n\n```php\nif (is_readable('test.txt')) {\n    echo\
  \ \"test.txt is readable\";\n}\n```\n\n`is_writable()` 函数告诉你是否拥有写入该文件的适当权限。与 `is_readable()`\
  \ 一样，`is_writable()` 函数也需要文件路径并返回一个布尔值。\n\n```php\nif (is_writable('test.txt'))\
  \ {\n    echo \"test.txt is writable\";\n}\n```\n\n`is_executable()` 函数告诉你是否可以执行给定文件，这取决于你的平台，取决于文件的权限或扩展名。该函数接受文件路径并返回一个布尔值。\n\
  \n```php\nif (is_executable('test.txt')) {\n    echo \"test.txt is executable\"\
  ;\n}\n```\n\n关于权限的信息并不是你可能需要了解文件的全部信息。下一节将展示如何确定文件大小。\n\n### 使用 `filesize()` 确定文件大小\n\
  \n给定文件路径，`filesize()` 函数尝试确定并返回其以字节（bytes）计算的大小。如果遇到问题，它返回 `false`：\n\n点击此处查看代码图像\n\
  \n```php\necho \"The size of test.txt is \".filesize('test.txt');\n```\n\n在你想将文件附加到电子邮件或向用户流式传输文件的情况下，找到特定的文件大小是非常重要的——你需要知道大小以便正确创建标头（对于邮件而言）或知道何时停止向用户发送字节（对于流而言）。对于更通用的用途，你可能想要获取文件大小，以便在用户尝试从你的网站下载巨大的应用程序或高分辨率照片之前显示它。\n\
  \n### 获取有关文件的日期信息\n\n有时你需要知道文件最后一次写入或访问的时间。PHP 提供了几个可以提供此类信息的函数。\n\n你可以使用 `fileatime()`\
  \ 函数获取文件的最后访问时间。该函数需要文件路径并返回文件最后访问的日期。*访问*文件意味着对其读取或写入文件。所有日期信息函数返回的日期都是时间戳——即自\
  \ 1970 年 1 月 1 日以来的秒数。书中的示例使用 `date()` 函数将此值转换为人类可读的格式：\n\n点击此处查看代码图像\n\n```php\n\
  $atime = fileatime(\"test.txt\");\necho \"test.txt was last accessed on \".date(\"\
  D d M Y g:i A\", $atime);\n// Sample output: test.txt was last changed on Sat 26\
  \ Apr 2008 12:52 PM\n```\n\n你可以使用 `filemtime()` 函数发现文件的修改日期，该函数需要文件路径并返回 UNIX epoch\
  \ 格式的日期。*修改*文件意味着以某种方式更改其内容：\n\n点击此处查看代码图像\n\n```php\n$mtime = filemtime(\"test.txt\"\
  );\necho \"test.txt was last modified on \".date(\"D d M Y g:i A\", $mtime);\n//\
  \ Sample output: test.txt was last modified on Wed 18 Jan 2012 7:11 PM\n```\n\n\
  PHP 允许允许你使用 `filectime()` 函数测试文档的更改时间。在 UNIX 系统上，更改时间在文件内容被修改或对其权限或所有权进行更改时设置的。在其他平台上，`filectime()`\
  \ 返回创建日期：\n\n点击此处查看代码图像\n\n```php\nmtime = filemtime(\"test.txt\");\necho \"test.txt\
  \ was last modified on \".date(\"D d M Y g:i A\", $mtime);\n// Sample output: test.txt\
  \ was last modified on Wed 18 Jan 2012 7:11 PM\n```\n\n### 创建执行多个文件测试的函数\n\n列表 13.7\
  \ 创建了一个函数，将刚刚讨论的文件相关函数整合到一个脚本中。\n\n**列表 13.7** 输出多个文件测试结果的函数\n\n点击此处查看代码图像\n\n*\
  \ *\n\n```php\n1:  <?php\n2:  function outputFileTestInfo($f) {\n3:      if (!file_exists($f))\
  \ {\n4:            echo \"<p>$f does not exist</p>\";\n5:            return;\n6:\
  \      }\n7:      echo \"<p>$f is \".is_file($f) ? \"\" : \"not\").\" file</p>\"\
  ;\n8:      echo \"<p>$f is \".is_dir($f) ? \"\" : \"not\").\" directory</p>\";\n\
  9:      echo \"<p>$f is \".is_readable($f) ? \"\" : \"not\").\" readable</p>\";\n\
  10:     echo \"<p>$f is \".is_writable($f) ? \"\" : \"not\").\" writable</p>\";\n\
  11:     echo \"<p>$f is \".is_executable($f) ? \"\" : \"not\").\" executable</p>\"\
  ;\n12:     echo \"<p>$f is \".filesize($f) ? \"\" : \"not\").\" bytes</p>\";\n13:\
  \     echo \"<p>$f was last accessed on \".date(\"D d M Y g:i A\", $atime($f)).\"\
  </p>\";\n14:     echo \"<p>$f was last modified on \".date(\"D d M Y g:i A\", $mtime($f)).\"\
  </p>\";\n15:     echo \"<p>$f was last changed on \".date(\"D d M Y g:i A\", $ctime($f)).\"\
  </p>\";\n16: }\n17:\n17: $file = \"test.txt\";\n18: outputFileTestInfo($file);\n\
  19: ?>\n```\n\n\n\n\n\n如果由于任何原因无法打开文件，`fopen()` 函数将返回 `false`。因此，在继续处理该文件之前，测试该函数的返回值是一个好主意。你可以使用\
  \ `if` 语句来实现：\n\n```\nif ($fp = fopen(\"test.txt\", \"w\")) {\n    // 对 $fp 资源进行某些操作\n\
  }\n```\n\n或者，你也可以使用逻辑运算符在无法打开核心文件时结束执行：\n\n点击此处查看代码图片\n\n```php\n($fp = fopen(\"\
  test.txt\", \"w\")) or die(\"Couldn't open file, sorry\");\n```\n\n如果 `fopen()`\
  \ 函数返回 `true`，则表达式的其余部分将不会被解析，`die()` 函数（它向浏览器写入消息并结束脚本）将永远不会执行。反之，`or` 运算符右侧的部分会被解析，并调用\
  \ `die()` 函数。\n\n假设一切顺利且你继续操作已打开的文件，你应该记得在完成后将其关闭。你可以通过调用 `fclose()` 来实现，该函数需要从成功的\
  \ `fopen()` 调用返回的文件资源作为参数：\n\n```php\nfclose($fp);\n```\n\n现在，可用资源（`$fp`）对你来说不可用了。\n\
  \n## 从文件中读取\n\nPHP 提供了许多从文件中读取数据的函数。这些函数允许你按字节、按整行，甚至按单个字符进行读取。\n\n#### 使用 `fgets()`\
  \ 和 `feof()` 从文件中读取行\n\n当你打开一个文件进行读取时，你可能想按行访问它。要从打开的文件中读取一行，你可以使用 `fgets()` 函数，它需要\
  \ `fopen()` 返回的文件资源作为参数。你还必须向 `fgets()` 传递一个整数作为第二个参数，该整数指定了函数在先遇到行尾或文件末尾之前应该读取的字节数。`fgets()`\
  \ 函数会读取文件，直到遇到换行符（`\"\\n\"`）、长度参数指定的字节数或文件末尾——以先到者为准：\n\n点击此处查看代码图片\n\n```php\n\
  $line = fgets($fp, 1024); // 其中 $fp 是 fopen() 返回的文件资源\n```\n\n虽然你可以用 `fgets()` 读取行，但你需要某种方法来判断何时到达文件末尾。`feof()`\
  \ 函数通过在到达文件末尾时返回 `true` 否则返回 `false` 来实现这一点。`feof()` 函数需要一个文件资源作为参数：\n\n点击此处查看代码图片\n\
  \n```php\nfeof($fp); // 其中 $fp 是 fopen() 返回的文件资源\n```\n\n现在你有足够的信息来逐行读取文件，如列表 13.8\
  \ 所示。\n\n**列表 13.8** 打开并逐行读取文件\n\n点击此处查看代码图片\n\n* * *\n\n```php\n1: <?php\n2: $filename\
  \ = \"test.txt\";\n3: $fp = fopen($filename, \"r\") or die(\"Couldn't open $filename\"\
  );\n4: while (!feof($fp)) {\n5:     $line = fgets($fp, 1024);\n6:     echo $line.\"\
  <br/>\";\n7: }\n8: ?>\n```\n\n* * *\n\n如果将此代码保存到 Web 服务器的文档根目录下的 `readlines.php`\
  \ 并通过浏览器运行，输出将类似于图 13.3（尽管你的文本文件内容可能不同）。\n\n![image](img/13fig03.jpg)\n\n**图 13.3\
  \ readlines.php 的输出。**\n\n代码在第 3 行调用了 `fopen()`，使用你想要读取的文件名作为其参数。`or die()` 结构用于确保在无法读取文件时结束脚本执行。这通常发生在文件不存在或文件权限不允许读取该文件时。\n\
  \n文件内容的实际读取发生在第 4 行的 `while` 语句中。`while` 语句的测试表达式在每次迭代中都会调用 `feof()`，并在返回 `true`\
  \ 时结束循环。换句话说，循环将持续到到达文件末尾。在代码块内部，第 5 行的 `fgets()` 从文件中提取出一行（或 1024 字节，以先到者为准）。结果赋值给\
  \ `$line` 并在第 6 行打印到浏览器，为了可读性添加了 `<br/>` 标签。\n\n#### 使用 `fread()` 从文件中读取任意长度的数据\n\
  \n与其按行读取文本，你可以选择按任意定义的块读取文件。`fread()` 函数接受一个文件资源作为参数，以及你想要读取的字节数。`fread()` 函数返回你请求的数据量，除非先到达文件末尾：\n\
  \n```php\n$chunk = fread($fp, 16);\n```\n\n列表 13.9 修正了之前的示例，使其以 8 字节为块读取数据。\n\n\
  **列表 13.9** 使用 `fread()` 读取文件\n\n点击此处查看代码图片\n\n* * *\n\n```php\n1: <?php\n2: $filename\
  \ = \"test.txt\";\n3: $fp = fopen($filename, \"r\") or die(\"Couldn't open $filename\"\
  );\n4: while (!feof($fp)) {\n5:     $chunk = fread($fp, 8);\n6:     echo $chunk.\"\
  <br/>\";\n7: }\n8: ?>\n```\n\n* * *\n\n如果将此代码保存到 Web 服务器的文档根目录下的 `readlines2.php`\
  \ 并通过浏览器运行，输出将类似于图 13.4。\n\n![image](img/13fig04.jpg)\n\n**图 13.4 readlines2.php\
  \ 的输出。**\n\n`fread()` 函数允许你定义获取的数据量而不是按行。`fseek()` 函数允许你更改文件中的位置。它需要一个文件资源和一个表示从文件开始偏移的整数。\n\
  \n#### 使用 `fgetc()` 从文件中读取字符\n\n`fgetc()` 函数与 `fgets()` 类似，但它每次调用时只从文件中返回单个字符。由于字符的大小始终为\
  \ 1 字节，`fget()` 不需要长度参数。你只需要向它传递一个文件资源：\n\n```php\n$char = fgetc($fp);\n```\n\n\
  列表 13.11 创建了一个循环，逐字符读取 `test.txt` 文件，并将每个字符单独输出到浏览器上。\n\n**列表 13.11** 使用 `fgetc()`\
  \ 读取文件\n\n点击此处查看代码图片\n\n* * *\n\n```php\n1: <?php\n2: $filename = \"test.txt\";\n\
  3: $fp = fopen($filename, \"r\") or die(\"Couldn't open $filename\");\n4: while\
  \ (!feof($fp)) {\n5:     $char = fgetc($fp);\n6:     echo $char.\"<br/>\";\n7: }\n\
  8: ?>\n```\n\n* * *\n\n\n\n\n\n## 使用 `file_get_contents()` 读取文件内容\n\n现在你已经掌握了如何使用\
  \ `fopen()` 创建文件资源并对该资源执行一个或多个操作，你就可以跳过这些客套话，直接使用 `file_get_contents()` 将整个文件读取到字符串中进入正题。例如，以下单行代码将名为\
  \ `test.txt` 的文件内容读取到变量 `$contents` 中：\n\n```php\n$contents = file_get_contents(\"\
  test.txt\");\n```\n\n该函数还为你提供了其他可能性；以下显示了调用 `file_get_contents()` 时的可用选项：\n\n点击此处查看代码图片\n\
  \n```php\nfile_get_contents ($filename [$use_include_path [, $context [, $offset\
  \ [, $maxlen ]]);\n```\n\n这些额外的选项描述如下：\n\n- `use_include_path`—布尔值，指示函数是否应该在整个 `include_path`\
  \ 中搜索文件名。\n- `context`—由 `stream_context_create()` 创建的上下文资源；如果不需要则使用 `NULL`。\n-\
  \ `offset`—开始读取的位置，例如 `5` 表示文件中的第 5 个字符。请注意，虽然你可以对 `file_get_contents()` 处理非本地文件（如\
  \ URL），但在这些情况下无法使用 `offset`。\n- `maxlen`—要读取的数据最大长度，以字节为单位。默认读取所有数据。\n\n如果你的脚本中不需要之前函数提供的细粒度控制，那么\
  \ `file_get_contents()` 就能很好地满足你的基础文件读取需求。\n\n## 向文件写入或追加内容\n\n写入文件和追加文件的过程是相同的——区别在于调用\
  \ `fopen()` 函数时使用的模式。当你向文件写入时，在调用 `fopen()` 时使用模式参数 `\"w\"`：\n\n```php\n$fp = fopen(\"\
  test.txt\", \"w\");\n```\n\n所有后续写入都从文件开始开始。如果文件不存在，则会创建它。如果文件已存在，任何先的内容将被破坏并被你写入的数据替换。\n\
  \n当你向文件追加内容时，在 `fopen()` 调用中使用模式参数 `\"a\"`：\n\n```php\n$fp = fopen(\"test.txt\"\
  , \"a\");\n```\n\n对文件的任何后续写入都将添加到现有内容的末尾，但如果你尝试向不存在的文件追加内容，则会先创建文件。\n\n### 使用 `fwrite()`\
  \ 或 `fputs()` 写入文件\n\n`fwrite()` 函数接受一个文件资源和一个字符串，然后将该字符串写入文件。`fputs()` 函数的工作方式完全相同：\n\
  \n```php\nfwrite($fp, \"hello world\");\nfputs($fp, \"hello world\");\n```\n\n向文件写入内容就是这么简单。列表\
  \ 13.12 使用 `fwrite()` 输出到文件。然后它使用 `fputs()` 向同一个文件追加了一个额外的字符串。\n\n**列表 13.12** 向文件写入和追加内容\n\
  \n点击此处查看代码图片\n\n***\n\n```php\n1: <?php\n2: $filename = \"test.txt\";\n3: echo \"\
  <p>Writing to \".$filename.\" ... </p>\";\n4: $fp = fopen($filename, \"w\") or die(\"\
  Couldn't open $filename\");\n5: fwrite($fp, \"Hello world\\n\");\n6: fclose($fp);\n\
  7: echo \"<p>Appending to \".$filename.\" ...</p>\";\n8: $fp = fopen($filename,\
  \ \"a\") or die(\"Couldn't open $filename\");\n9: fputs($fp, \"And another thing\\\
  n\");\n10: fclose($fp);\n11: ?>\n```\n\n***\n\n此脚本从你的 Web 浏览器运行时，其屏幕输出如下：\n\nWriting\
  \ to test.txt ...\n\nAppending to test.txt ...\n\n如果你打开 `test.txt` 文件或使用 `readlines.php`\
  \ 读取其内容，你会发现文件现在包含了以下内容：\n\nHello world\n\nAnd another thing\n\n## 使用 `file_put_contents()`\
  \ 写入文件内容\n\n与之前讨论的 `file_get_contents()` 函数类似，`file_put_contents()` 函数是一种更精简的文件操作方法。具体而言，`file_put_contents()`\
  \ 直接模拟了接连续调用 `fopen()`、`fwrite()` 和 `fclose()` 的过程，以将数据写入文件。\n\n以下显示了调用 `file_put_contents()`\
  \ 时的可用参数：\n\n点击此处查看代码图片\n\n```php\nfile_put_contents ($filename, $data [, $flags\
  \ [, $context]]);\n```\n\n这些额外的选项描述如下：\n\n- `data`—包含写入数据的字符串或数组。\n- `flags`—一个或多个\
  \ `FILE_USE_INCLUDE_PATH`（是否在 `include_path` 中查找目标文件）、`FILE_APPEND`（如果文件已存在是否向文件追加数据）以及\
  \ `LOCK_EX`（是否在写入目标文件时获取排斥锁），这些标志可以使用 `|` 运算符组合。\n- `context`—由 `stream_context_create()`\
  \ 创建的上下文资源；如果不需要则使用 `NULL`。\n\n如果你使用 `file_put_contents()` 重写之前的示例，它看起来会像 列表 13.13：\n\
  \n**列表 13.13** 向文件写入和追加内容\n\n点击此处查看代码图片\n\n***\n\n```php\n1: <?php\n2: $filename\
  \ = \"test.txt\";\n3: echo \"<p>Writing to \".$filename.\" ... </p>\";\n4: file_put_contents($filename,\
  \ \"Hello world\\n\");\n5: echo \"<p>Appending to \".$filename.\" ...</p>\";\n6:\
  \ file_put_contents($filename, \"And another thing\\n\", FILE_APPEND);\n7: ?>\n\
  ```\n\n\n\n\n[content]\n`mode` 参数仅对 UNIX 系统起作用。`mode` 应该由三个 0 到 7 之间的数字组成，分别代表目录所有者、组和所有人的权限。`mkdir()`\
  \ 函数在成功创建目录时返回 `true`，在未成功时返回 `false`。如果 `mkdir()` 失败，通常是因为包含该目录的权限阻止了具有脚本用户 ID\
  \ 的进程进行写入。\n\n如果你不熟悉设置 UNIX 目录权限，你可能会发现以下示例之一符合你的需求。除非你确实需要你的目录对所有人可写，否则你可能应该使用\
  \ `0755`，它允许所有人读取你的目录但不能进行写入：\n\n点击此处查看代码图像\n\n```php\nmkdir(\"testdir\", 0777);\
  \ // 全局读/写/执行权限\n\nmkdir(\"testdir\", 0755); // 全员/组：读/执行；所有者：读/写/执行\n```\n\n##\
  \ 使用 `rmdir()` 删除目录\n\n`rmdir()` 函数允许你从文件系统中删除目录，前提是运行脚本的进程有权这样做，并且该目录是空的。`rmdir()`\
  \ 函数仅需要一个表示要删除目录路径的字符串。\n\n```php\nrmdir(\"testdir\");\n```\n\n## 使用 `opendir()`\
  \ 打开目录进行读取\n\n在读取目录内容之前，你必须先获取目录资源。你可以通过 `opendir()` 函数来实现。`opendir()` 函数需要一个表示要打开的目录路径的字符串。`opendir()`\
  \ 函数返回一个目录句柄，除非目录不存在或不可读；在这种情况下它将返回 `false`：\n\n```php\n$dh = opendir(\"testdir\"\
  );\n```\n\n在这种情况下，`$dh` 是打开目录的目录句柄。\n\n## 使用 `readdir()` 读取目录内容\n\n就像使用 `fgets()`\
  \ 函数从文件中读取一行一样，你可以使用 `readdir()` 从目录中读取文件名或目录名。`readdir()` 函数需要一个目录句柄并返回一个包含项目名称的字符串。如果到达目录末，`readdir()`\
  \ 返回 `false`。注意，`readdir()` 只返回条目的名称，而不是完整路径。列表 13.14 显示了目录的内容。\n\n**列表 13.14**\
  \ 使用 readdir() 列出目录内容\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: $dirname = \".\";\n\
  3 : $dh = opendir($dirname) or die(\"Couldn't open directory\");\n4:\n5: while (!(($file\
  \ = readdir($dh)) === false ) ) {\n6:      if (is_dir(\"$dirname/$file\")) {\n7:\
  \                echo \"(D) \";\n8:      }\n9:      echo $file.\"<br/>\";\n10: }\n\
  11: closedir($dh);\n12: ?>\n```\n\n如果将此代码保存到 Web 服务器的根目录并命名为 `readdir.php`并通过浏览器运行，输出将看起来像图\
  \ 13.7。\n\n![image](img/13fig07.jpg)\n\n**图 13.7 readdir.php 的输出。**\n\n列表 13.14\
  \ 在第 3 行使用 `opendir()` 函数打开目录进行读取，并在第 5 行开始使用 `while` 语句循环遍历每个元素。它作为 `while` 语句测试表达式的一部分调用\
  \ `readdir()`，并将结果赋值给变量 `$file`。\n\n在 `while` 语句的体内部，变量 `$dirname` 与变量 `$file` 结合使用以创建一个完整的文件路径，然后在第\
  \ 6 行对其进行测试。如果路径代表一个目录，代码将在第 7 行向浏览器打印 `D`。最后，在第 9 行打印文件名（或目录名）。\n\n列表 13.14 在 `while`\
  \ 语句的测试中使用了一种审慎的构造方法。大多数 PHP 程序员（包括我在内）会使用类似下面的代码：\n\n```php\nwhile ($file = readdir($dh))\
  \ {\n      echo $file.\"<br/>\";\n}\n```\n\n在这种情况下，将对 `readdir()` 返回的值进行测试，由于任何除\
  \ `\"0\"` 以外的字符串都会解析为 `true`，所以应该不会有问题。然而，想象一个包含四个文件的目录：`0`、`1`、`2` 和 `3`。在我的系统中，上述代码的输出如下：\n\
  \n```\n.\n..\n```\n\n当循环到达名为 `0` 的文件时，`readdir()` 返回的字符串解析为 `false`，导致循环结束。列表 13.14\
  \ 中的方法使用 `===` 来检查 `readdir()` 返回的返回值是否完全等于 false。结果 `0` 仅在测试中会被解析为 false，因此规避了这个问题。\n\
  \n> **注意**\n> 如果你发现目录列表中的项目顺序是随机的，那是因为顺序是由文件系统决定的。如果你希望按特定排列，你需要对内容进行排序。\n\n## 使用\
  \ `popen()` 打开进程的输入输出\n\n在本章之前，你已经学习了如何使用 `fopen()` 打开文件进行读取。现在，你看到可以通过 `popen()`\
  \ 函数打开管道。`popen()` 的用法如下：\n\n```php\n$file_pointer = popen(\"some command\",\n```\n\
  \n`mode` 为 `r`（读取）或 `w`（写入）。列表 13.15 尝试打开一个不存在的文件。\n\n```php\n1: <?php\n2: $file_pointer\
  \ = popen(\"/path/to/fakefile\", \"r\");\n3: $read = fread($file_pointer,2096);\n\
  4: echo $read;\n5: pclose($file_pointer);\n6: ?>\n```\n\n列表 13.15 在第 2 行调用 `popen()`\
  \ 函数，在第 3 行读取 `$file_pointer` 中的内容，并在第 4 行输出。最后，在第 5 行关闭文件。\n\n列表 13.16 也使用 `popen()`\
  \ 读取输出；在此例中，是 `who` 的输出。\n\n**列表 13.16** 使用 popen() 读取 UNIX 命令的输出（仅 UNIX）\n\n点击此处查看代码图像\n\
  \n```php\n1: <?php\n2: $handle = popen(\"who\", \"r\");\n3: while (!feof($handle))\
  \ {\n4:    $line = fgets($handle,1024);\n5:    if (strlen($line) >= 1) {\n6:   \
  \     echo $line;\n7:    }\n8: }\n9: pclose($handle);\n10: ?>\n```\n\n在第 2 行，当使用\
  \ `popen()` 读取时会返回一个文件指针。第 3 行开始一个 `while` 循环，读取每一行输出，并在第 5 行判断如果 `$line` 的长度大于或等于\
  \ 1，则在第 6 行输出它。在第 9 行关闭连接。如果你将此代码保存为 `popen_who.php`，将其放在根目录并通过浏览器访问，你将看到类似下面的内容（显示你的实际信息，而不是我的）：\n\
  \n点击此处查看代码图像\n\n```\njulie pts/0 Mar 14 06:19 (adsl-206-120-158.dsl.snfc21.net)\n\
  ```\n\n列表 13.17 显示了如何使用 `popen()` 的写入模式将数据传递给外部应用程序。在此例中，外部应用程序是 `column`。脚本的目标是将多维数组的元素以表格格式输出。\n\
  \n**列表 13.17** 使用 popen() 向 UNIX 命令传递数据（仅限 UNIX）\n\n点击此处查看代码图像\n\n```php\n1: <?php\n\
  2: $products = array(\n3:   array(\"HAL 20000\", 2, \"red\"),\n4:   array(\"Tricorder\"\
  , 3, \"blue\"),\n5:   array(\"ORAC AI\", 1, \"pink\"),\n6:   array(\"Sonic Screwdriver\"\
  , 1, \"orange\")\n7: );\n8: ?>\n```\n\n\n\n\n```php\n9: $handle = popen(\"column\
  \ -tc 3 -s / > /somepath/purchases.txt\", \"w\");\n\n10: foreach ($products as $p)\
  \ {\n11:     fputs($handle, join('/',$p).\"\\n\");\n12: }\n13: pclose($handle);\n\
  14: echo \"done\";\n15: ?>\n```\n\n第 2–7 行定义了一个名为 `$products` 的多维数组，其中包含四个代表产品的项目，包含名称、数量和颜色。第\
  \ 9 行使用写入格式的 `popen()` 向 `column` 应用程序发送命令。该命令向 `column` 程序发送参数，告诉它将输入格式化为三列表格，并使用\
  \ `/` 作为字段分隔符。输出被发送到名为 `purchases.txt` 的文件中。（请确保将路径更改为系统上存在的路径。）\n\n第 10–12 行使用\
  \ `foreach` 遍历 `$products` 数组，并将每个元素发送到打开的文件指针。随后使用 `join()` 函数将数组转换为字符串，并追加指定的分隔符。代码在第\
  \ 13 行关闭了打开的文件指针，并在第 14 行向屏幕打印状态消息。\n\n如果你将此代码保存为 `popen_column.php`，将其放在文档根目录下，并使用网络浏览器访问它，它应该会在指定位置创建一个文件。查看我机器上创建的文件，我看到了以下文本：\n\
  \n```\nHAL 2000          2  red\nTricorder         3  blue\nORAC AI           1\
  \  pink\nSonic Screwdriver  1  orange\n```\n\n你的系统中可能存在也不存在 `column` 程序，但本节说明了向应用程序打开管道的逻辑和语法。欢迎使用你可用的其他程序尝试这种逻辑。\n\
  \n## 使用 `exec()` 运行命令\n\n`exec()` 函数是可以用来将命令传递给 shell（壳）的几个函数之一。`exec()` 函数需要一个表示你想要运行的命令路径的字符串，并可选地接受一个包含命令输出的数组变量以及一个包含返回值（1\
  \ 或 0）的标量变量。例如：\n\n点击此处查看代码图像\n\n```php\nexec(\"/path/to/somecommand\", $output_array,\
  \ $return_val);\n```\n\n列表 13.18 使用 `exec()` 函数通过基于 shell 的 `ls` 命令生成目录列表。\n\n**列表\
  \ 13.18** 使用 exec() 和 ls 生成目录列表（仅限 UNIX）\n\n点击此处查看代码图像\n\n```php\n1: <?php\n2: exec(\"\
  ls -al .\", $output_array, $return_val);\n3: echo \"Returned \".$return_val.\"<br/><pre>\"\
  ;\n4: foreach ($output_array as $o) {\n5:     echo $o.\"\\n\";\n6: }\n7: echo \"\
  </pre>\";\n8: ?>\n```\n\n第 2 行使用 `exec()` 函数发了 `ls` 命令。命令的输出被放置在 `$output_array`\
  \ 数组中，返回值放置在 `$return_val` 变量中。第 3 行简单地打印返回值，而第 4–6 行的 `foreach` 循环则打印 `$output_array`\
  \ 中的每个元素。\n\n#### 注意\n\n第 3 行中的字符串包含一个起始 `<pre>` 标签，第 7 行提供一个结束标签。这仅仅是为了确保你的目录列表使用\
  \ HTML 预格式文本是可读的。\n\n如果你将此代码保存为 `exec_ls.php`，将其放在文档根目录下，并使用网络浏览器访问它，你将看到类似图 13.8\
  \ 的内容（当然，是你的实际信息，而不是我的）。\n\n![image](img/13fig08.jpg)\n\n**图 13.8 exec_ls.php 的输出。**\n\
  \n尽管 PHP 非常出色，但你有时可能想在你的基于 PHP 的应用程序中集成某种功能，而其他人已经用 Perl 写了相同功能的代码。在这种情况下，不需要重新发明轮子；你只需使用\
  \ `exec()` 访问现有的脚本并利用其功能。然而，请记住，调用外部进程始终会在时间和内存使用方面为你的脚本增加一些额外的开销。\n\n## 使用 `system()`\
  \ 或 `passthru()` 运行命令\n\n`system()` 函数与 `exec()` 函数相似，它启动一个外部应用程序，并利用标量变量来存储返回值：\n\
  \n```php\nsystem(\"/path/to/somecommand\", $return_val);\n```\n\n`system()` 函数与\
  \ `exec()` 不同之处在于它可以直接将信息输出到浏览器，而无需程序干预。以下代码段使用 `system()` 打印 `man` 命令的帮助页，并使用 `<pre>`\
  \ 标签格式格式：\n\n```php\n<?php\necho \"<pre>\";\nsystem(\"man\", $return_val);\necho\
  \ \"</pre>\";\n?>\n```\n\n同样，`passthru()` 函数遵循 `system()` 的语法，但行为不同。当你使用 `passthru()`\
  \ 时，任何输出都不会经过缓冲；这适用于二进制数据而非简单的文本。列表 13.19 使用 passthru() 输出二进制数据\n\n点击此处查看代码图像\n\n\
  ```php\n1: <?php\n2: if (isset($_GET['imagenage']) && file_exists($_GET['imagenage']))\
  \ {\n3:     header(\"Content-type: image/gif\");\n4:     passthru($_GET['imagenage']);\n\
  5: } else {\n6:     echo \"The image \".$GET['imagenage'].\"could not be found\"\
  ;\n7: }\n8: ?>\n```\n\n#### 注意\n\n脚本中使用的 shell 工具 `column`、`scale` 和 `ppmtogif`\
  \ 可能未安装在你的系统中。如果没有，你可以从你的发行版中安装，但在这里只是为了理解使用 `passthru()` 的概念。\n\n如果你将此文件保存为 `getbinary.php`，将其放在文档根目录下，并像下面所示在\
  \ HTML 中调用它：\n\n点击此处查看代码图像\n\n```html\n<img src=\"getbinary.php=<?php echo urlencode(\"\
  test.gif\") ?>\">\n```\n\n\n\n\n你还学习了与系统及其外部应用程序通信的各种方法。虽然 PHP 是一门快速且健壮的语言，但你可能会发现直接利用\
  \ C 或 Perl 等其他语言的预存脚本在成本和时间上更高效。你可以使用 `popen()`、`exec()`、`system()` 和 `passthru()`\
  \ 函数来访问这些外部应用程序。\n\n你学习了如何使用 `popen()` 将数据管道到命令中，这对于从标准输入接收数据的应用程序非常有用，并且当你想要在应用程序发送数据时对其进行解析。你还学习了如何使用\
  \ `exec()` 和 `system()` 将命令传递给 shell 并获取用户输入。你还学习了使用 `passthru()` 函数来接受 shell 命令结果的二进制数据。\n\
  \n现在你已经可以更深入地操作文件系统，从而保存和访问大量数据。然而，如果你需要从大文件中查找数据，此类脚本会变得非常缓慢。出现这种情况，你应该考虑数据库系统，我们很快就会介绍。\n\
  \n### Q&A\n\n**Q. include 语句会减慢我的脚本速度吗？**\n\n**A.** 因为包含的文件必须由引擎打开并解析，这会增加一些开销。然而，可重用代码库带来的处通常大于相对较低的性能开销。\n\
  \n**Q. 如果文件无法打开进行读写，我应该始终结束脚本执行吗？**\n\n**A.** 你应该始终考虑到这种可能性。如果你的脚本绝对依赖你想要处理的文件，你可能想使用\
  \ `die()` 函数向浏览器写入一条信息丰富的错误消息。在不关键的情况下，你仍然需要允许失败的发生，也许通过将其添加到日志文件中。\n\n**Q. 我可以在哪里获得更多关于网络安全的信息？**\n\
  \n**A.** 关于网络安全的一个权威介绍是由 Lincoln Stein 编写的《万维网安全常见问题解答》文档，你可以在 [http://www.w3.org/Security/Faq/]\
  \ 找到它。\n\n### Workshop\n\n本工作坊旨在帮助你复习所学内容，并开始将知识付诸实践。\n\n#### Quiz\n\n**1.** 你使用什么函数将库代码添加到当前运行的脚本中？\n\
  \n**2.** 你使用什么函数来检查文件系统中是否存在某个文件？\n\n**3.** 你如何确定文件的大小？\n\n**4.** 你使用什么函数打开一个文件进行读写？\n\
  \n**5.** 你使用什么函数从文件中读取一行数据？\n\n**6.** 你如何判断何时到达了文件末尾？\n\n**7.** 你使用什么函数向文件写入一行数据？\n\
  \n**8.** 你如何打开一个目录进行读取？\n\n**9.** 在你打开一个目录进行读取后，你使用什么函数来读取目录项的名称？\n\n**10.** 你使用哪个函数打开指向进程的管道？\n\
  \n**11.** 在打开连接后，你如何从进程中读取数据？写入数据又是怎样的？\n\n**12.** 你如何转义用户输入，以便在传递给 shell 命令之前使其更安全一点？\n\
  \n#### Answers\n\n**1.** 你可以使用 `require` 或 `include` 语句将 PHP 文件整合到当前文档中。你也可以使用 `include_once`\
  \ 或 `require_once`。\n\n**2.** 你可以使用 `file_exists()` 函数测试文件是否存在。\n\n**3.** `filesize()`\
  \ 函数以字节为单位返回文件的大小。\n\n**4.** `fopen()` 函数打开文件。它接受文件路径和一个代表模式的字符。它返回一个文件资源。\n\n**5.**\
  \ `fgets()` 函数读取数据直到你传递给它的缓冲区大小、行尾或文档末尾（以先者为准）。\n\n**6.** 当所传递的文件资源到达文件末尾时，`feof()`\
  \ 函数返回 `true`。\n\n**7.** 你可以使用 `fputs()` 函数向文件写入数据。\n\n**8.** 你可以使用 `opendir()`\
  \ 打开一个目录进行读取。\n\n**9.** 在打开目录后，你使用 `readdir()` 函数读取目录项的名称。\n\n**10.** 你使用 `popen()`\
  \ 函数打开指向进程的管道。\n\n**11.** 在打开连接后，你可以使用 `fgets()` 从进程读取数据。写入数据则可以使用 `fputs()`。\n\n\
  **12.** 你可以在将输入传递给 shell 命令之前，使用 `escapescmd()` 或 `escapeshellarg()` 来进行转义以提高安全性。\n\
  ## 第 14 章 处理图像\n\n* *\n\n在本章中，你将学习以下内容：\n\n- 如何修改 PHP 以扩展图像功能\n- 如何创建新图像\n- 如何修改现有图像\n\
  \n* *\n\n标准的 PHP 安装包含许多创建和处理图像的内置函数。常见的用途包括创建图表和图形以及对现有图像进行修改。通过一些调整，你可以进一步扩展这些功能。\n\
  \n本章介绍了使用 PHP 函数创建和处理图像的基础知识。\n\n## 理解图像创建过程\n\n使用 PHP 创建图像不像使用绘图程序（例如 Sumo Paint、Corel\
  \ DRAW 或 Windows 画）：没有通过点击或拖拽油漆桶到空间来填充图像。同样，也没有“另存为”功能可以让绘图程序仅在你要求时就自动创建 GIF、JPEG、PNG\
  \ 等。\n\n相反，你必须成为绘图应用程序。作为程序员，你必须告诉 PHP 引擎每一步要做什么。你负责使用各个 PHP 函数来定义颜色、绘制和填充形状、调整图像大小并将图像保存为特定的文件类型。然而，如果你理解了每一步并按顺序完成任务，这并没有想象中那么困难。\n\
  \n* *\n\n注意\n\n本章的示例并不是最有趣的，但书页能容纳的内容有限（尤其是当书是黑白打印时）。请放心，这些示例涵盖了处理 PHP 图像函数所需的基础知识。\n\
  \n* *\n\n关于颜色的说明\n\n在图像相关脚本中定义颜色时，我们使用 RGB 色彩系统。通过对红、绿、蓝（R、G、B）每个项目使用 `0` 到 `255`\
  \ 的十进制值，你可以定义特定的颜色。`0` 表示没有该特定颜色，而 `255` 表示该颜色的最高量。\n\n\n\n例如，纯红色的 RGB 值为 `(255,0,0)`，或者说是红色值的全部分配，没有绿色和蓝色。同样地，纯绿色的值为\
  \ `(0,255,0)`，纯蓝色的值为 `(0,0,255)`。白色的 RGB 值为 `(255,255,255)`，黑色的 RGB 值为 `(0,0,0)`。一种漂亮的紫色\
  \ RGB 值为 `(153,51,153)`，浅灰色的 RGB 值为 `(204,204,204)`。作为参考，你可以在 [`en.wikipedia.org/wiki/Web_colors`](http://en.wikipedia.org/wiki/Web_colors)\
  \ 查看颜色及其 RGB 值的列表。\n\n***\n\n### 对 PHP 进行必要的修改\n\n当前版本的 PHP 分发版包含了 Thomas Boutell\
  \ 的 GD 图形库的绑定版本。该库的引入消除了下载和安装几个第三方库的需要，但该库需要在安装时进行激活。\n\n为了在安装时启用 GD 库，Linux/UNIX\
  \ 用户在准备构建 PHP 时必须在 `configure` 参数中添加以下内容：\n\n```\n--with-gd\n```\n\n再次运行 PHP `configure`\
  \ 程序后，你必须像在第 4 章“安装和配置 PHP](#ch04.html_ch04)”中那样经过 `make` 和 `make install`过程。想要启用\
  \ GD 的 Windows 用户只需要像你在第 4 章](#ch04.html_ch04）中学的那样，在 `php.ini` 文件中激活 `php_gd2.dll`\
  \ 扩展。\n\n使用 GD 库时，你仅限于处理 GIF 文件。处理 GIF 文件可能完美符合你的需求，但如果你要在 Linux/UNIX 上创建 JPEG 或\
  \ PNG 文件，你必须下载并安装此处列出的库，并对你的 PHP 安装进行一些修改。（这些库在 Windows 安装中已包含并启用。）\n\n- JPEG 库，来自\
  \ [`www.ijg.org/`](http://www.ijg.org/)。\n- PNG 库，来自 [`www.libpng.org/pub/png/libpng.html`](http://www.libpng.org/pub/png/libpng.html)。\n\
  - 如果你正在处理 PNG 文件，还应该安装 zlib 库，来自 [`www.zlib.net/`](http://www.zlib.net/)。\n\n按照这些网站上的说明安装库。安装完成后，Linux/UNIX\
  \ 用户必须重新配置并重建 PHP，首先在 PHP `configure` 参数中添加以下内容（假设你想使用所有三个；如果不是，只需添加相应的即可）：\n\n\
  ```\n--with-jpeg-dir=[path to jpeg directory]\n--with-png-dir=[path to PNG directory]\n\
  --with-zlib=[path to zlib directory]\n```\n\n再次运行 PHP `configure` 程序后，你需要像在第 4 章中那样经过\
  \ `make` 和 `make install`过程。你的库随后就会被激活并准备好使用。\n\n## 绘制新图像\n\n用于创建新图像的基本 PHP 函数称为\
  \ `ImageCreate()`，但创建图像并不是调用该函数那么简单。创建图像是一个逐步过程，涉及使用几个不同的 PHP 函数。\n\n创建图像始于 `ImageCreate()`\
  \ 函数，但该函数所做的只是为你的新图像留留一个画布区域。以下行代码创建了一个宽 300 像素、高 300 像素的绘制区域：\n\n```\n$myImage\
  \ = ImageCreate(300,300);\n```\n\n画布定义后，你接下来应该为该新图像定义几种颜色。以下示例使用 `ImageColorAllocate()`\
  \ 函数和 RGB 值定义了这样的五种颜色（分别为黑色、白色、红色、绿色和蓝色）：\n\n点击此处查看代码图像\n\n```\n$black = ImageColorAllocate($myImage,\
  \ 0, 0, 0);\n$white = ImageColorAllocate($myImage, 255, 255, 255);\n$red  = ImageColorAllocate($myImage,\
  \ 255, 0, 0);\n$green = ImageColorAllocate($myImage, 0, 255, 0);\n$blue = ImageColorAllocate($myImage,\
  \ 0, 0, 255);\n```\n\n***\n\n#### 注意\n\n在你的脚本中，你分配的第一个颜色将用作图像的背景颜色。在这种情况下，背景颜色将是黑色。你也可以将变量命名为\
  \ `$background_color` 或其他具有语境意义的名字。\n\n***\n\n现在你已经知道了设置绘制画布和分配颜色的基础知识，你可以继续学习绘制形状并将图像实际输出到网络浏览器了。\n\
  \n#### 绘制形状和线条\n\n几个 PHP 函数可以帮助你在画布上绘制形状和线条：\n\n- `ImageEllipse()` 用于绘制椭圆。\n- `ImageArc()`\
  \ 用于绘制部分椭圆。\n- `ImagePolygon()` 用于绘制多边形。\n- `ImageRectangle()` 用于绘制矩形。\n- `ImageLine()`\
  \ 用于绘制直线。\n\n使用这些函数需要提前考虑，因为你必须设置想要开始和结束的点。\n\n```\n1: <?php\n2: //创建画布\n3: $myImage\
  \ = ImageCreate(300,300);\n4: \n5: //为画布设置颜色\n6: $black = ImageColorAllocate($myImage,\
  \ 0, 0, 0);\n7: $white = ImageColorAllocate($myImage, 255, 255, 255);\n8: $red =\
  \ ImageColorAllocate($myImage, 255, 0, 0);\n9: $green = ImageColorAllocate($myImage,\
  \ 0, 255, 0);\n10: $blue = ImageColorAllocate($myImage, 0, 0, 255);\n11: \n12: //绘制一些矩形\n\
  13: ImageRectangle($myImage, 15, 15, 95, 155);\n14: ImageRectangle($myImage, 95,\
  \ 155, 175, 295);\n15: ImageRectangle($myImage, 175, 15, 255, 155);\n16: \n17: //将图像输出到浏览器\n\
  18: header (\"Content-type: image/png\");\n19: ImagePng($myImage);\n20: \n21: //清理工作\n\
  22: ImageDestroy($myImage);\n23: ?>\n```\n\n#### 使用颜色填充\n\n`列表 14.1` 的输出仅产生了矩形的轮廓。PHP\
  \ 也有设计用于填充区域的图像函数：\n\n- `ImageFilledEllipse()` 用于填充椭圆。\n- `ImageFilledArc()` 用于填充部分椭圆。\n\
  - `ImageFilledPolygon()` 用于填充多边形。\n\n\n\n\n\n• `ImageFilledRectangle()` 用于填充矩形。\n\
  \n使用这些函数的方式与使用它们非填充对应的函数完全一样。在列表 14.2 中，非填充函数被替换为用于填充区域的函数。换句话说，只有第 13–15 行发生了变化。\n\
  \n**列表 14.2** 创建带有颜色填充的新图像\n\n点击此处查看代码图像\n\n* * *\n\n```php\n1:  <?php\n2:  //create\
  \ the canvas\n3:  $myImage = ImageCreate(300,300);\n4:\n5:  //set up some colors\
  \ for use on the canvas\n6:  $black = ImageColorAllocate($myImage, 0, 0, 0);\n7:\
  \  $white = ImageColorAllocate($myImage, 255, 255, 255);\n8:  $red  = ImageColorAllocate($myImage,\
  \ 255, 0, 0);\n9:  $green = ImageColorAllocate($myImage, 0, 255, 0);\n10: $blue\
  \ = ImageColorAllocate($myImage, 0, 0, 255);\n11:\n12: //draw some rectangles\n\
  13: ImageFilledRectangle($myImage, 15, 15, 95, 155, $red);\n14: ImageFilledRectangle($myImage,\
  \ 95, 155, 175, 295, $white);\n15: ImageFilledRectangle($myImage, 175, 15, 255,\
  \ 155, $red);\n16:\n17: //output the image to the browser\n18: header (\"Content-type:\
  \ image/png\");\n19: ImagePng($myImage);\n20:\n21: //clean up after yourself\n22:\
  \ ImageDestroy($myImage);\n23: ?>\n```\n\n* * *\n\n将此列表保存为 `imagecreatefill.php`\
  \ 并将其放在 Web 服务器的文档根目录下。访问时，它看起来 own 类似于图 14.2，但是有颜色的。\n\n![image](img/14fig02.jpg)\n\
  \n**图 14.2 带有三个绘制并填充的矩形的画布。**\n\n#### 制作复杂的饼图\n\n之前的示例有点无聊，但它们向你介绍了创建图像的基本流程：定义画布、定义颜色，然后进行绘制和填充。你可以使用相同的事件序列扩展你的脚本以创建图表和图形，并使用静态或动态数据作为数据点。列表\
  \ 14.3 绘制了一个基础饼图。第 1–10 行与之前的列表相似，因为它们只是设置了画布大小和要使用的颜色。\n\n**列表 14.3** 基础饼图\n\n\
  点击此处查看代码图像\n\n* * *\n\n```php\n1:  <?php\n2:  //create the canvas\n3:  $myImage\
  \ = ImageCreate(300,300);\n4:\n5:  //set up some colors for use on the canvas\n\
  6:  $white = ImageColorAllocate($myImage, 255, 255, 255);\n7:  $red  = ImageColorAllocate($myImage,\
  \ 255, 0, 0);\n8:\n9:  $green = ImageColorAllocate($myImage, 0, 255, 0);\n10:\n\
  11:  $blue = ImageColorAllocate($myImage, 0, 0, 255);\n12:\n13:  //draw a pie\n\
  14:  ImageFilledArc($myImage, 100, 100, 200, 150, 0, 90, $red, IMG_ARC_PIE);\n15:\
  \  ImageFilledArc($myImage, 100, 100, 200, 150, 90, 180 , $green,   IMG_ARC_PIE);\n\
  16:  ImageFilledArc($myImage, 100, 100, 200, 150, 180, 360 , $blue,   IMG_ARC_PIE);\n\
  17:\n18:  //output the image to the browser\n19:  header (\"Content-type: image/png\"\
  );\n20:  ImagePng($myImage);\n21:\n22:  //clean up after yourself\n23:  ImageDestroy($myImage);\n\
  24:  ?>\n```\n\n* * *\n\n由于第一个定义的颜色是白色，画布的颜色将是白色。\n\n第 12–14 行使用了 `ImageFilledArc()`\
  \ 函数，它有几个属性：\n- 图像标识符\n- 以 x 为中心点的部分椭圆\n- 以 y 为中心点的部分椭圆\n- 部分椭圆的宽度\n- 部分椭圆的高度\n\
  - 部分椭圆的起始点\n- 部分椭圆的终点\n- 颜色\n- 样式 参见列表 14.3 中的第 14 行：\n\n```php\n14: ImageFilledArc($myImage,\
  \ 100, 100, 200, 150, 0, 90, $red, IMG_ARC_PIE);\n```\n\n圆弧应该用定义的 `$blue` 颜色填充。`IMG_ARC_PIE`\
  \ 样式是几个内置样式之一，用于显示填充。注意：你可以在 [PHP 手册](https://www.php.net/manual/en/function.imagefilledarc.php)\
  \ 中学习所有与圆弧相关的常量。\n\n* * *\n\n将此列表保存为 `imagefilledarc.php` 并将其放在服务器的文档根目录下。访问时，它看起来应该类似于图\
  \ 14.2，但是有颜色的。\n\n![image](img/14fig03)\n\n**图 14.3 简单的饼图。**\n\n你可以扩展列表 14.3 中的代码并赋予饼图\
  \ 3D 外观。为了这样做，你需要定义更多的颜色，只要它们比基础颜色更浅即可。以下定义了较浅的颜色：\n\n```php\n$lt_red = ImageColorAllocate($myImage,\
  \ 255, 150, 150);\n$lt_green = ImageColorAllocate($myImage, 150, 255, 150);\n$lt_blue\
  \ = ImageColorAllocate($myImage, 150, 150, 255);\n```\n\n为了创建阴影效果，你使用 `for` 循环在点\
  \ (100,110) 处添加一系列小的圆弧，使用较浅的颜色：\n\n```php\nfor ($i = 110;$i > 100;$i--) {\n  ImageFilledArc\
  \ ($myImage, 100, 100, 200, 150, 0, 90, $lt_red, IMG_ARC_PIE);\n  ImageFilledArc\
