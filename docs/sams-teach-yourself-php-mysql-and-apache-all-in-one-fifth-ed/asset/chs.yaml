  \ 28.4 的内容。\n\n图 28.4 JSON 格式的数据。要创建此此数据的格式化版本，你可以像这样访问记录中的元素：\n\n- `$theData->book->title`\
  \ 获取标题\n- `$theData->book->author` 获取作者\n- `$theData->book->publisher_name` 获取出版社名称\n\
  - `$theData->book->publisher_city` 获取出版城市\n- `$theData->book->publisher_year` 获取出版年份\n\
  \n如之前提到的，消费 JSON 的最流行方法之一是 API 的输出。以下 URL 包含一个使用两个变量访问 Google 搜索的示例 API：`v` 用于 API\
  \ 版本（此情况下为 1.0），`q` 用于搜索词（此情况下为 PHP）：\n\n点击此处查看代码图片\n\n`http://ajax.googleapis.com/ajax/services/search?v=1.0&q=PHP`\n\
  \n将 列表 28.5 的第 2 行改为以下内容，并将文件保存为 `json_google_dump.php`，将其放置在 Web 服务器的文档根目录下：\n\n\
