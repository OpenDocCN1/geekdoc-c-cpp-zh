  \n\n\n# 21 常见问答. 为什么脚本对表单中的值使用 `mysqli_real_escape_string()` 函数？\n\n## 回答\n\n**1.**\
  \ 通过 `$_GET` 全局变量，其命名为 `$_GET['topic_id']` 的值。\n\n**2.** 就像 `replytopost.php` 脚本一样，我们可以消除消息显示，直接将用户重定向到她刚刚创建的主题，以其完整姿态展示新主题和帖子。\n\
  \n**3.** `mysqli_real_escape_string()` 函数通过为插入到数据库表的字符串准备“安全”的字符串来防止 SQL 注入攻击。\n\
  \n## 活动\n\n**1.** 你会发现这些页面实际上并没有真正通过任何导航方式连接在一起。获取这些基础框架脚本并为它们应用一些导航流。确保用户始终能够从任何给定页面添加主题或返回主题列表，例如。\n\
  \n**2.** 使用问答部分提供的信息，将多个论坛整合并显示到你整洁的小讨论板中。在此期间，应用一些文本样式和颜色来让这些单调的示例变得生动。\n\n## 第\
  \ 22 章 创建在线商店\n\n***在本章中，你将学习到以下内容：***\n\n• 为在线商店创建关系表\n• 创建显示商店分类的脚本\n• 创建显示单个商品的脚本\n\
  \n在这一简短的章节中，你将创建一个通用的在线商店界面。与之前的项目章节一样，你将学习如何创建相关的数据库表以及向用户显示信息的脚本。本章使用的示例代表了完成这些任务的无限可能之一，旨在提供知识基础，而不是完成此任务的确定方法。\n\
  \n### 规划和创建数据库表\n\n在处理为在线商店创建数据库表之前，考虑一下现实中的购物过程。当你走进一家商店时，物品是以某种方式排序的：硬件设备和婴儿服没有混合在一起，电子产品和洗衣液没有并排放在一起，此类推。将这些知识应用于数据库规范化，你已经可以看到你需要一个表来存储分类，一个表来存储商品。在这个简单的商店中，每个商品都属于一个分类。\n\
  \n接下来，考虑商品本身。根据你拥有的商店类型，你的商品可能有也可能没有颜色，可能有也可能没有尺寸。但你所有的商品都将有一个名称、描述和价格。同样，从规范化的角度考虑，你可以想象你可能有一个通用的商品表，以及两个与通用商品表相关的额外表。\n\
  \n表 22.1 显示了用于你的在线商店的示例表名和字段名。稍后，你将创建实际的 SQL 语句，但首先你应该查看这些信息并尝试理解它们之间的关系。问问自己哪些字段应该是主键或唯一键。\n\
  \n**表 22.1 商店表和字段名**\n\n![image](img/22tab01.jpg)\n\n如接下来的 SQL 语句所示，`store_categories`\
  \ 表除了 `id` 字段外还有两个字段：`cat_title` 和 `cat_desc`分别对应标题和描述。`id` 字段是主键，`cat_title` 是唯一字段，因为没有理由会有两个完全相同的分类：\n\
  \n点击此处查看代码图片\n\n```sql\nCREATE TABLE store_categories (\n    id INT NOT NULL PRIMARY\
  \ KEY AUTO_INCREMENT,\n    cat_title VARCHAR (50) UNIQUE,\n    cat_desc TEXT\n);\n\
  ```\n\n接下来我们处理 `store_items` 表，它除了 `id` 字段外还有五个字段——这些都不是唯一键。字段的定义是随意的；长度取决于你的商店。`cat_id`\
  \ 字段将商品关联到 `store_categories` 表中的某个分类，因为你可能为每个分类想要多个商品。`item_title`、`item_price`\
  \ 和 `item_desc` 字段自言自明。`item_image` 字段持有文件名，当你需要显示商品信息时使用 `<img>` 标签。点击此处查看代码图片\n\
  \n```sql\nCREATE TABLE store_items (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    cat_id INT NOT NULL,\n    item_title VARCHAR (75),\n    item_price FLOAT (2),\n\
  \    item_desc TEXT,\n    item_image VARCHAR (50)\n);\n```\n\n这些是商店所需的所有表。在第 23\
  \ 章](#ch23.html_ch23)，你将学习如何使用 SQL 过滤器显示商品。在第 20 章](#ch20.html_ch20)，你学习了如何使用 PHP\
  \ 表单添加记录。现在，你只需通过 MySQL 监控器或其他界面发布 MySQL 查询，为表添加信息。\n\n### 向 `store_categories`\
