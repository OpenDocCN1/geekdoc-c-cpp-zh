  \n**图 19.7 邮件已发送！**\n\n![image](img/19fig08.jpg)\n\n**图 19.8 邮件安全送达。**\n\n### 总结\n\
  \n在本章中，你将基础的 PHP 和 MySQL 知识应用于创建个人邮件列表。内容包括数据库表创建、订阅和取消订阅机制，以及发送邮件的表单和脚本。\n\n###\
  \ 问答\n\n**问：我如何减轻邮件服务器的负担？**\n\n**答：** 除了研究封装好的邮件列表软件外，你可以跳过 `mail()` 函数，通过套接连接直接与你的\
  \ SMTP 服务器通信。PHP 手册中关于 `fsockopen()` 函数（([`www.php.net/fsockopen`](http://www.php.net/fsockopen))以及其他开发者资源网站都有此类示例。\n\
  \n**问：退信邮件去哪里了？**\n\n**答：** 与任何电子邮件一样（而不仅仅在本章描述的方式发送的邮件），退信会发送你在 `From:` 或 `Reply-to:`\
  \ 邮件标头指定的任何地址。\n\n### 工作坊\n\n工作坊旨在帮助你复习所学内容并开始实践知识。\n\n#### 测验\n\n**1。** 哪个 PHP\
  \ 函数发送邮件？\n\n**2。** 为什么在列表 19.1 中将 `$mysqli` 命名为全局变量？\n\n**3。** 哪个 PHP 函数调用导致脚本根据需要运行足够长时间？\n\
  \n#### 答案\n\n**1。** 这不是脑筋急转弯。是 `mail()` 函数！\n\n**2。** 因为变量 `$mysqli` 是包含在一个脚本中供另一个脚本使用的函数中创建并赋值的，因此该变量必须声明为全局，以确保它在创建它的函数范围之外可以使用。\n\
  \n**3。** `set_time_limit(0)`\n\n#### 活动\n\n**1.** 修改 `manage.php` 脚本，在执行任何操作时，将用户的电子邮件作为响应消息的一部分显示出来。\n\
  \n**2.** 修改 `sendmymail.php` 脚本，添加额外的表单字段，这些字段将与消息字符串本身中的章节标题对应。记住，当表单提交时，这些字符串必须合并成一个发送给\
  \ `mail()` 函数的单一消息字符串。\n\n## 第 20 章 创建在线通讯录\n\n***\n\n**在本章中，你将学习以下内容：**\n\n- **如何为在线通讯录创建关系型表**\n\
  \n- **如何创建添加和删除通讯录记录的表单和脚本**\n\n- **如何创建查看记录的表单和脚本**\n\n***\n\n在本章中，你将创建一个可管理的在线通讯录。你将学习如何创建相关的数据库表，以及用于添加、删除和查看数据库记录的表单和脚本。\n\
  \n***\n\n### 注意\n\n这些基础概念是开发任何使用 CRUD 功能（创建、读取、更新、删除）应用程序的基础，而这正是许多 Web 应用的核心。\n\
  \n***\n\n### 规划和创建表\n\n当你考虑到通讯录时，显而易见的字段会入脑：姓名、地址、电子邮件。然而，如果你看纸质通讯录，可能会注意到有多个条目。在在线通讯录中，你使用表来消除信息的冗余和重复。表\
  \ 20.1 显示了示例的字段名。\n\n**表 20.1 通讯录表和字段名**\n\n![image](img/20tab01.jpg)\n\n注意日期相关字段的使用；每个表都有\
  \ `date_added` 和 `date_modified`。\n\n以下语句中文本字段的长度是任意的；你可以在允许定义的范围内将其设置为你想要的长或短。\n\
  \n以下 SQL 语句创建了 `master_name` 表：\n\n点击此处查看代码\n\n```sql\nCREATE TABLE master_name\
  \ (\n  id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n  date_added DATETIME,\n  date_modified\
  \ DATETIME,\n  f_name VARCHAR (75),\n  l_name VARCHAR (75)\n);\n```\n\n接下来，你创建辅助表，它们都关联到\
  \ `master_name` 表。例如，`address` 表具有基础的主键 `id` 字段、`date_added` 字段和 `date_modified`\
  \ 字段，以及建立关系的字段——`master_id` 字段。\n\n`master_id` 等于 `master_name` 表中的 `id` 字段，匹配该地址所属的人。`master_id`\
  \ 字段不是唯一键，因为假设一个人可能有多个地址条目是完全合理的。这体现在 `type` 字段中，该字段被定义为包含三个选项的枚举：`home`、`work`\
  \ 或 `other`。一个人可能拥有所有类型中的一个或多个，因此除了主键 `id` 之外，此表中没有其他键。假设此特定的通讯录仅包含美国地址，使用 `address`、`city`、`state`\
  \ 和 `zipcode` 字段来完善表：\n\n点击此处查看代码\n\n```sql\nCREATE TABLE address (\n```\n\n\n\n\
  \n\n```sql\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n    master_id INT NOT\
  \ NULL,\n    date_added DATETIME,\n    date_modified DATETIME,\n    address VARCHAR\
  \ (255),\n    city VARCHAR (30),\n    state CHAR (2),\n    zipcode VARCHAR (10),\n\
  \    type ENUM ('home', 'work', 'other')\n);\n```\n\n`telephone`、`fax` 和 `email`\
  \ 表都是基于相同主题的变体：\n\n点击此处查看代码图片\n\n```sql\nCREATE TABLE telephone (\n    id INT NOT\
  \ NULL PRIMARY KEY AUTO_INCREMENT,\n    master_id INT NOT NULL,\n    date_added\
  \ DATETIME,\n    date_modified DATETIME,\n    tel_number VARCHAR (25),\n    type\
  \ ENUM ('home', 'work', 'other')\n);\n\nCREATE TABLE fax (\n    id INT NOT NULL\
  \ PRIMARY KEY AUTO_INCREMENT,\n    master_id INT NOT NULL,\n    date_added DATETIME,\n\
  \    date_modified DATETIME,\n    fax_number VARCHAR (25),\n    type ENUM ('home',\
  \ 'work', 'other')\n);\n\nCREATE TABLE email (\n    id INT NOT NULL PRIMARY KEY\
  \ AUTO_INCREMENT,\n    master_id INT NOT NULL,\n    date_added DATETIME,\n    date_modified\
  \ DATETIME,\n    email VARCHAR (150),\n    type ENUM ('home', 'work', 'other')\n\
  );\n```\n\n`personal_notes` 表也遵循类似的模式，不同之处 `master_id` 是唯一键，并且每个人员只允许一条 `notes`\
  \ 记录：\n\n点击此处查看代码图片\n\n```sql\nCREATE TABLE personal_notes (\n    id int NOT NULL\
  \ PRIMARY KEY AUTO_INCREMENT,\n    master_id INT NOT NULL UNIQUE,\n    date_added\
  \ DATETIME,\n    date_modified DATETIME,\n    note TEXT\n);\n```\n\n现在你的表已经创建好了，你可以开始编写管理和查看记录的表单和脚本。\n\
  \n### 为常用函数创建一个包含文件\n\n在第 19 章“管理简单的邮件列表”中，使用了一个常用函数的包含文件来使脚本更加简洁。本章也是如此的。虽然常用函数文件中唯一的内容是数据库连接函数，但这个过程有两个目的：使你的脚本更加简洁，并且当数据库连接信息发生变化时，消除了在多个文件中修改数据库连接信息的需要。列表\
  \ 20.1 包含了本章脚本共享的代码。\n\n**列表 20.1** 包含文件中的常用函数\n\n点击此处查看代码图片\n\n```php\n1:  <?php\n\
  2:  function doDB() {\n3:      global $mysqli;\n4:\n5:      //连接到服务器并选择数据库；你可能需要它\n\
