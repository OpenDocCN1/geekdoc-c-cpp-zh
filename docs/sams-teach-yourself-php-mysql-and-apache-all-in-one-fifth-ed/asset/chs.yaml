  \ 25 行所示。\n\n### 注意\n\n你可以在 PHP 手册中关于 heredoc 和其他字符串格式的内容通过 [`www.php.net/manual/en/language.types.string.php`](http://www.php.net/manual/en/language.types.string.php)\
  \ 了解更多信息。\n\n\n\n\n\n在第 26 行，如果 `$_POST` 存在为 `true` 且 `$_POST['action']` 的值为 `\"\
  sub\"`，你就知道用户正尝试订阅。要订阅，用户需要一个电子邮件地址，因此在第 28–30 行检查是否存在。如果没有地址，则将用户重定向回表单。\n\n然而，如果存在地址，在第\
  \ 34 行调用 `doDB()` 函数（存储在 `ch19_include.php` 中）连接到数据库，以便你可以执行查询。在第 36 行，你调用了我们的第二个自定义函数：`emailChecker()`。该函数接收一个输入（在此情况下为\
  \ `$_POST['email']`）并对其进行处理。如果你回看 Listing 19.1 的第 21–25 行，你会看到 `emailChecker()`\
  \ 函数内部的代码会执行一个查询，尝试在 `subscribers` 表中查找包含传递给函数的电子邮件地址记录的 `id` 值。该函数随后返回结果集，即 `$check_res`，供在较大的脚本中使用。\n\
  \n### 注意事项\n注意 Listing 19.1 中两个自定义函数开头的全局变量定义。这些变量需要与整个脚本共享，因此被声明为全局（global）。\n\n\
  跳转到 Listing 19.2 的第 39 行查看 `$check_res` 变量是如何使用的：计算 `$check_res` 变量引用的记录数，以确定电子邮件地址是否已存在于表中。如果行数小于\
  \ 1，则该地址不在列表中，可以添加。记录添加后，响应存储在第 44–48 行中，而失败消息（如果地址已在表中）存储在第 54 行。此时，脚本将跳出 `if...else`\
  \ 结构，跳到第 101 行，并继续打印当前存储在 `$display_block` 中的 HTML。你将在稍后测试此功能。\n\n最后一种输入组合发生在 `$_POST`\
  \ 存在为 `true` 且 `$_POST['action']` 变量的值为 `\"unsub\"` 时。在这种情况下，用户正尝试取消订阅。要取消订阅，需要现有的电子邮件地址，因此在第\
  \ 59–61 行检查是否存在。如果没有地址，则将用户返回表单。\n\n如果存在地址，在第 64 行调用 `doDB()` 函数连接到数据库。然后，在第 67\
  \ 行，你调用 `emailChecker()`，它再次返回结果集 `$check_res`。第 70 行统计结果集中的记录数，以确定电子邮件地址是否已存在于表中。如果行数小于\
  \ 1，则该地址不在列表中，无法取消订阅。\n\n在这种情况下，响应消息存储在第 75–76 行中。然而，如果行数不小于 1，则用户已取消订阅（记录被删除），响应存储在第\
