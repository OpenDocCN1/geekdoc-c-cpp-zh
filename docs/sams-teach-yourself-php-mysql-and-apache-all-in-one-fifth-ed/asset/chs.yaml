  | firstnamelastname            |\n| firstnamelastname            |\n| firstnamelastname            |\n\
  | firstnamelastname            |\n| firstnamelastname            |\n+---------------------------------+\n\
  9 rows in set (0.00 sec)\n\n* * *\n\n如果名字之间有某种分隔符，`CONCAT()` 函数将非常有用，而下一个函数派上了用场：`CONCAT_WS()`。\n\
  \n正如你可能已经发现的那样，`CONTACT_WS()` 代表 *concatenate with separator*（带分隔符的连接）。分隔符可以是你选择的任何字符，但下面的示例使用了空格：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT CONCAT_WS(' ', firstname, lastname) FROM master_name;\n\
  ```\n\n此查询导致了如下结果：\n\n+-------------------------------------+\n| CONCAT_WS(' ',\
  \ firstname, lastname) |\n+-------------------------------------+\n| John Smith              |\n\
