  \ 针对被跟踪页面的自定义访问报告。**\n\n这种跟踪方式比翻阅 Apache 访问日志要简单得多，我不建议完全用数据库驱动的系统取代你的访问日志。那样数据库连接的开销太大了，即使\
  \ MySQL 在你的系统上运行得非常好。相反，请将你的页面跟踪针对某些特别重要的内容。\n\n### 总结\n\n本章解释了如何记录关于 Apache 生成的请求和错误的特定信息。你可以将日志存储在文件或数据库中，或者将它们传递给外部程序。你学习了用于管理、处理和分析日志的各种工具，包括\
  \ Apache 自带的工具和第三方提供的工具。\n\n在本章中，你还学习了一种使用 PHP 代码段和 MySQL 数据库来对特定页面进行简单访问跟踪的易方法。这些信息通过用\
  \ PHP 构建的易于理解的访问报告显示出来。\n\n### 问答\n\n**Q. 为什么我不想记录图像？**\n\n**A.** 在负载密集的服务器上，记录可能会成为瓶颈。如果记录的目的是统计访问人数并分析他们对网站的使用情况，你可以通过只记录\
