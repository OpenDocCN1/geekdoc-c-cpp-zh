  \ `NAME` 属性的值后面添加方括号。这使得用户的选择能够以数组的形式提供给 PHP。\n\n### 在已注册用户的环境中使用会话\n\n你目前为止看到的示例已经让你接触了会话，但可能需要对在实际环境中使用会话进行额外的解释。以下两个章节概述了常见的示例。\n\
  \n请记住，允许多项选择的 HTML 表单元素（如复选框和多选列表）应该在其 `NAME` 属性的值后面添加方括号。这使得用户的选择能够以数组的形式提供给 PHP。\n\
