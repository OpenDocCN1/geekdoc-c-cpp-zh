  Content-Language: \".LANGCODE);\n34:  ?>\n```\n\nListing 27.1 的第 2–8 行设置了存储用户所选语言所需的会话值。\n\
  \n### 注意\n\n在接下来的段落列出的 `define_lang.php` 或 `lang_strings.php` 文件中没有使用 `session_start()`\
  \ 函数，因为这些文件是通过主文件中的 `include()` 函数包含的。你很快将创建的主文件会调用 `session_start()` 函数，该函数对于这些包含的文件同样有效。\n\
  \n如果不存在会话值，将使用英语语言区域设置。如果你的网站默认是德国网站，你可以修改此文件以默认使用德语语言区域。该脚本通过在第 6 行将 `$currLang`\
  \ 的值设置为此输入的结果，为下一个脚本（包含输入选择机制）做好了准备。\n\n从第 10 行开始的 `switch` 语句包含几个 `case` 语句，为常量变量\
  \ `CHARSET` 和 `LANGCODE` 分配适当的值。第 32–33 行在动态创建并发送 `Content-type` 和 `Content-language`\
  \ 头部时，首次使用了这些变量。\n\n将此文件保存为 `define_lang.php` 并将其放在 浏览器的文档根目录下。此文件定义了下一个脚本（即实际显示脚本）中使用的常量。这些常量是\
  \ `CHARSET` 和 `LANGCODE`，分别对应每个语言区域的字符集和语言代码。显示脚本使用这些常量来创建关于字符集和语言代码的适当 `META` 标签。尽管此脚本发送了头部，但确保它们是页面本身是一个好主意，有助于表单的任何必要输入。\n\
  \nListing 27.2 创建了一个函数，仅用于存储显示脚本中使用的外部化字符串。此示例使用了两个：一个欢迎用户进入页面（`WELCOME_TXT`），另一个用于介绍语言选择（`CHOOSE_TXT`）。\n\
  \n**Listing 27.2** 字符串定义 点击此处查看代码图像\n\n```php\n1:  <?php\n2:  function defineStrings()\
  \ {\n3:   switch($_SESSION['lang']) {\n4:       case \"en\":\n5:           define(\"\
  WELCOME_TXT\",\"Welcome!\");\n6:           define(\"CHOOSE_TXT\",\"Choose Language\"\
  );\n7:       break;\n8:\n9:       case \"de\":\n10:          define(\"WELCOME_TXT\"\
  ,\"Willkommen!\");\n11:          define(\"CHOOSE_TXT\",\"Sprache auswählen\");\n\
  12:      break;\n13:\n14:      case \"ja\":\n15:          define(\"WELCOME_TXT\"\
  ,\"[printable characters]\");\n16:          define(\"CHOOSE_TXT\",\"[printable characters]\"\
  );\n17:      break;\n18:\n19:      default:\n20:          define(\"WELCOME_TXT\"\
  ,\"Welcome!\");\n21:          define(\"CHOOSE_TXT\",\"Choose Language\");\n22: \
  \     break;\n23:  }\n24: }\n25: ?>\n```\n\n使用随书附带的 CD 中的 `lang_strings.php` 文件来使用此处无法显示的实际日语字符。将此文件放在\
  \ 浏览器的文档根目录下。此文件定义了显示脚本中使用的两个常量 `WELCOME_TXT` 和 `CHOOSE_TXT`。这些常量定义在 `defineStrings()`\
  \ 函数的上下文中，尽管你也可以同样容易地将该文件变为函数之外的 `switch` 语句。为了组织以及在解释显示脚本时，我简单地将其放在函数中。\n\n最后，是时候创建显示脚本了。记住，国际化的一个关键要素是将所有字符串外部化，这样只需要使用一个主文件。Listing\
  \ 27.3 就是这样一个示例。\n\n**Listing 27.3** 本地化欢迎脚本 点击此处查看代码图像\n\n```php\n1:  <?php\n2:\
  \  session_start();\n3:  include 'define_lang.php';\n4:  include 'lang_strings.php';\n\
  5:  defineStrings();\n6:  ?>\n7:  <!DOCTYPE html>\n8:  <html lang=\"<?php echo LANGCODE;\
  \ ?>\">\n9:  <head>\n10:   <title><?php echo WELCOME_TXT; ?></title>\n11: <meta\
  \ charset=\"<?php echo CHARSET; ?>\" />\n12: <body>\n13: <h1 style=\"text-align:\
  \ center;\"><?php echo WELCOME_TXT; ?></h1>\n14: <p style=\"text-align: center;\
  \ font-weight: bold;\">\n15:   <?php echo CHOOSE_TXT; ?><br/><br/>\n16: <a href=\"\
  <?php echo $_SERVER['PHP_SELF'].\"?lang=en\"; ?>\">\n17:      <img src=\"en_flag.gif\"\
  \ alt=\"English\" />\n18: <a href=\"<?php echo $_SERVER['PHP_SELF'].\"?lang=de\"\
  ; ?>\">\n19:      <img src=\"de_flag.gif\" alt=\"German\"/></a\n20: <a href=\"<?php\
  \ echo $_SERVER['PHP_SELF'].\"?lang=ja\"; ?>\">\n21:      <img src=\"ja_flag.gif\"\
  \ alt=\"Japanese\"/></a\n22: </p>\n23: </body>\n24: </html>\n```\n\n注意 Listing 27.3\
  \ 是一个基础模板，因为所有语言相关的元素都已经在 `define_lang.php` 或 `lang_strings.php` 文件中外部化了。\n\n\n\n\
  \n在选择另一种语言之前，默认是英语；因此，`Welcome` 和 `Choose Language` 文本以英文显示。当用户点击德国旗时，会看到图 27.2；当用户点击日本旗时，会看到图\
  \ 27.3。\n\n![image](img/27fig02.jpg)\n\n**图 27.2 查看德国页面。**\n\n![image](img/27fig03.jpg)\n\
  \n**图 27.3 查看日语页面。**\n\n提供网站本地化版本的公司和组织通常会对如何表示区域选择进行长时间讨论——国旗、国家名称、语言名称等。并没有标准的答案，但请记住使用国旗是不受鼓励的。如何显示语言选择绝对是一项业务决策，但如果你已经完成了字符串、文本和图像的外部化过程，并创建了一个准备好进行本地化的国际化网站模板，那么区域选择的格式就是你最不需要担心的问题了。\n\
  \n### 使用 `gettext()` 本地化应用程序\n\n之前的章节带你介绍了应用程序国际化和本地化的基本方法。更高级的方法是使用名为 `gettext()`\
  \ 的内置 PHP 函数，它是连接 GNU `gettext` 包的某种网关（一种 API 或应用程序编程接口）。\n\n***\n\n注意\n\n关于 GNU\
  \ `gettext` 的更多信息，请参阅 [`www.gnu.org/software/gettext/gettext.htm`](http://www.gnu.org/software/gettext/gettext.htm)。\n\
  \n***\n\n使用 `gettext` 及其 PHP 相关函数需要翻译目录文件符合特定格式。这些文件的流行跨平台编辑器是 Poedit（参见 [`www.poedit.com/`](http://www.poedit.com/)\
  \ )）。一旦创建了翻译目录模板（填充了你外部化的字符串），你就可以将模板交给你雇佣的翻译人员，或者通过众包服务（如 Transifex ([`www.transifex.net/`](https://www.transifex.net/))\
  \ 或 Get Localization ([`www.getlocalization.com/`](http://www.getlocalization.com/))）。拿到完成的目录文件后，你可以将其放在\
  \ Web 服务器文档根目录下的目录中，并开始使用 `gettext` 函数的过程。\n\n你可以在 PHP 手册的 [`www.php.net/gettext`](http://www.php.net/gettext)\
  \ 中学习更多关于 `gettext` 和 PHP `gettext` 相关函数的知识，但通常过程如下：\n\n• 使用 `putenv()` 为区域设置 `LC_ALL`\
  \ 环境变量。\n\n• 使用 `setlocale()` 为 `LC_ALL` 设置一个值（参见 [`www.php.net/setlocale`](http://www.php.net/setlocale)）。\n\
  \n• 使用 `bindtextdomain()` 为给定的域设置翻译目录的位置（在本例中，域是指标识应用程序的名称，而不是像 [www.mydomain.com](http://www.mydomain.com)\
  \ 这样的域名；参见 [`www.php.net/bindtextdomain`](http://www.php.net/bindtextdomain)）。\n\
  \n• 使用 `textdomain()` 设置 `gettext` 使用的默认域（参见 [`www.php.net/textdomain`](http://www.php.net/textdomain)）。\n\
  \n• 从现在起，使用 `gettext(\"some string\")` 或 `_(\"some string\")` 来调用该字符串的 `gettext`\
  \ 翻译。因此，如果你有一个将 `\"Welcome\"` 分配德语翻译字符串 `\"Willkommen!\"` 的翻译目录，并且所有环境变量都已为德语正确设置，以下代码将输出“Willkommen!”：\n\
  \n```\necho _(\"Welcome\");\n```\n\n一旦你掌握了应用程序国际化和本地化的基础，如果你打算开发一个供许多不同语言的使用者使用的应用程序，我建议研究基于\
  \ `gettext` 的本地化框架和众包翻译服务（除非你手头有大量的母语者，或者有大量的资金投入到翻译服务中）。\n\n### 总结\n\n本章向你介绍了国际化和本地化的基础知识。你学习了创建国际化网站的两个关键：所有的字符串、文本和图形都是经过外部化的，数字、货币和日期格式也是如此。你还了解到到国际化和本地化都不等同于文本翻译；翻译只是本地化的部分内容。\n\
  \n你还学习了一点字符集知识：它们可以是单字节或多字节的。你还学习了发送适当语言相关头部的重要性，以便你的网络浏览器能够正确解释并显示你的文本。\n\n你还创建了一个如何存储区域相关会话变量的实用示例，以确定并将本地化字符串发送到预定义的模板中。此模板可以被所有区域使用，因为每个元素都已外部化。作为额外奖励，你学习了使用应用程序框架进行本地化的一个高级步骤，即使用\
  \ PHP 的 `gettext` 函数。\n\n### 问答\n\n**Q. 如何使用 PHP 本地化数字、日期和货币？**\n\n**A.** 这两个函数在这方面将对你非常有用：`number_format()`\
  \ 和 `date()`。你已经学习过 `date()` 函数。要在本地化环境中使用它，你只需要根据区域设置重新排列月份、日期和年份元素（MM-DD-YYYY,\
  \ DD-MM-YYYY 等）。`number_format()` 函数用于数字和货币；它根据区域设置将千分位分组逗号、句号或空格。访问 [`www.php.net/number_format`](http://www.php.net/number_format)\
  \ 查看可能的用途。\n\n### 工作坊\n\n工作坊旨在帮助你复习所学内容并付诸实践。\n\n#### 测验\n\n**1. 我如何使用 PHP 本地化数字、日期和货币？**\n\
  \n**2. 哪些与字符编码相关的头部是至关重要的？**\n\n**3. 除了文本字符串，国际化站点时还有哪些内容元素需要注意？**\n\n#### 答案\n\n\
  **1.** 英语是单字节还是多字节语言？日语呢？**\n\n**2.** 带有字符集指示的 `Content-Type` 以及 `Content-Language`。\n\
  \n**3.** 日期、货币和数字格式是其他需要注意的内容元素。\n\n#### 活动\n\n**1.** 使用 Google 翻译（或你自己的知识）在本章创建的语言定义和显示文件中添加几种语言的“Welcome!”消息。\n\
  \n**2.** 由于国旗的图形表示在选择语言时并不理想，请将本章示例文件中基于旗帜的语言选择改为更合适的方式。\n\n## 第 28 章与 XML 和 JSON\
  \ 工作\n\n***\n\n***在本章中，你将学习以下内容：***\n\n• **如何创建基础 XML 文档结构**\n\n• **如何使用 DOM 函数在\
  \ PHP 中访问 XML**\n\n• **如何使用 SimpleXML 函数在 PHP 中访问 XML**\n\n• **如何处理 JSON 数据**\n\n\
  ***\n\n本章向你介绍了如何通过 PHP 处理 XML 文档和 JSON 数据，但绝非详尽——仅 XML 就可以写好几本书。然而，对于接触 XML、通过 PHP\
  \ 操作 XML 以及接收和处理 JSON 数据的人来说，某些函数集比其他的更容易上手；本章将向你介绍其中一些。\n\n### 什么是 XML?\n\n\n\n\
  \n\n`XML` 的名称源于该语言的全称 `Extensible Markup Language`（扩展标记语言）。尽管名称中包含 `markup`（标记），但不要像对待\
  \ HTML 那样对待 XML。`XML` 用于在你自定义的标签对之间存储和交换数据，而 HTML 是一种演示语言，允许你界定所看文档的结构和呈现，无论其中包含什么数据。\n\
  \n## XML 文档的基本结构\n\nXML 文档包含两个主要元素：引导（prolog）和主体（body）。`prolog` 包含 XML 声明以及你想要添加的任何处理指令和注释。\n\
  \n注意\n要了解 XML 文档的完整定义，请阅读 [`www.w3.org/TR/REC-xml`](http://www.w3.org/TR/REC-xml)\
  \ 中的 XML 规范。\n\n以下代码片段是一个有效的引导：\n\n```xml\n<?xml version=\"1.0\" ?>\n<!-- Sample\
  \ XML document -->\n```\n\n引导之后是内容结构。XML 是层次级结构，就像书一样——书有标题和章节，每个章节包含段落，等等。一个 XML\
  \ 文档中只有一个根元素。继续用书的例子来说，该元素可能被称为 `Books`，而标签 `<Books></Books>` 包围了所有其他信息：\n\n```xml\n\
  <Books>\n```\n\n接下来，向你的文档添加任何后续元素——称为 `children`（子元素）。继续用书的例子，你需要一个主书元素，然后在其中包含标题、作者和出版信息的元素。将这些子元素命名为\
  \ `Title`、`Author` 和 `PublishingInfo`。但出版信息可能包含多于一条信息；你需要出版者名称、地点和年份。这没问题。只需在你的父元素中创建另一组子元素（该父元素恰好也是根元素的子元素）即可。例如，仅仅\
  \ `<PublishingInfo>` 元素可能如下：\n\n```xml\n<PublishingInfo>\n    <PublisherName>Sams\
  \ Publishing</PublisherName>\n    <PublisherCity>Indianapolis</PublisherCity>\n\
  \    <PublishedYear>2012</PublishedYear>\n</PublishingInfo>\n```\n\n总而言之，一个包含一个条目的示例\
  \ `books.xml` 文档可能如下：\n\n```xml\n<?xml version=\"1.0\" ?>\n<!--Sample XML document\
  \ -->\n<Books>\n    <Book>\n        <Title>A Very Good Book</Title>\n        <Author>Jane\
  \ Doe</Author>\n        <PublishingInfo>\n            <PublisherName>Sams Publishing</PublisherName>\n\
  \            <PublisherCity>Indianapolis</PublisherCity>\n            <PublishedYear>2012</PublishedYear>\n\
  \        </PublishingInfo>\n    </Book>\n</Books>\n```\n\n记住创建有效 XML 文档的两个重要规则：\n\
  \n- XML 是大小敏感的，因此 `<Book>` 和 `<book>` 被视为不同的元素。\n- 所有的 XML 标签必须正确关闭，XML 标签必须正确嵌套，且不允许标签重叠。\n\
  \n向 `books.xml` 文件添加一些占位条目，并将其放置在 Web 服务器的文档根目录下，以供随后的示例使用。你将在本章显示的不同接口示例中使用同一个\
  \ XML 文件。\n\n## 你在什么时候会使用 XML 和 PHP？\n\n对这个问题的简短（且带点讽刺的）回答是“任何你想的时候”，但认真的回答是正如你想象的，比这要复杂一点。在本节的开头，我提到\
  \ XML 定义并携带内容。这仍然是事实。但在“现实生活中”这看起来是什么样的呢？\n\n本章的示例使用 XML 存储一个小型书籍目录。想象一个存储在私有数据库格式中的大型书籍目录，但该格式具有输出\
  \ XML 格式数据的能力。如果你需要获取该书籍目录，但无意购买或使用存储它的私有软件，那么 XML 将是答案——将 XML 用作数据交换格式。存储在私有格式或以排除第三方（即你）直接访问的方式存储这些数据的所有者，会将目录导出为\
  \ XML 格式。然后你就可以使用本章描述的格式之一，以你意愿的方式解析并显示该 XML。\n\n接下来，你将学习使用两类不同的函数族——DOM 函数和 SimpleXML\
  \ 函数来解析 XML 文档。虽然它们产生相同的结果（解析 XML 文档以提供你稍后在脚本中使用的数据），但它们的方法的方法略有不同。例如，虽然 SimpleXML\
  \ 函数的使用比 DOM 函数要简单得多（正如你在阅读完代码列表后看到的），但在处理大文件时会有性能损失，因为在你可以开始处理之前，整个 XML 文档会被加载到内存中并进行解析。每种选择都有权衡，这就是为什么本章简单地向你介绍了两组函数，并留给你自己发现什么对你和你的开发情况真正有效（或无效）。\n\
  \n### 使用 DOM 函数在 PHP 中访问 XML\n\nDOM-XML 扩展从 PHP 4 版本起就是 PHP 的一部分，但在 PHP 5 中经过了完全重构。主要的变化是将\
  \ DOM 功能包含在 PHP 的默认安装中，这意味着使用这些函数不再需要安装或配置额外的库或扩展。\n\n注意\n`DOM` 代表 `Document Object\
  \ Model`（文档对象模型）。有关关于 DOM 的更多信息，请访问 [`www.w3.org/TR/DOM-Level-2-Core/core.html`](http://www.w3.org/TR/DOM-Level-2-Core/core.html)。\n\
  \nDOM 函数的目的是允许你使用 DOM API 处理存储在 XML 文档中的数据。最基本的 DOM 函数是 `DOMDocument->load()`，它从文件内容创建一个新的\
  \ DOM 树。创建 DOM 树后，你可以使用其他 DOM 函数来操作数据。在列表 28.1 中，使用 DOM 函数遍历 DOM 树并检索存储的值，以备后用。\n\
  \n#### 28.1 遍历 XML 文档\n\n```php\n<?php\n$dom = new DomDocument;\n$dom->load(\"books.xml\"\
  );\nforeach ($dom->documentElement as $books) {\n    if ($books->nodeType == 1 &&\
  \ $books->nodeName == \"Book\") {\n        foreach ($books->childNodes as $theBook)\
  \ {\n            if ($theBook->nodeType == 1 && $theBook->nodeName == \"Title\"\
  ) {\n                $theBookTitle = $theBook->textContent;\n            }\n   \
  \         if ($theBook->nodeType == 1 && $theBook->nodeName == \"Author\") {\n \
  \               $theBookAuthor = $theBook->textContent;\n            }\n       \
  \     if ($theBook->nodeType == 1 && $theBook->nodeName == \"PublishingInfo\") {\n\
  \                foreach ($theBook->childNodes as $thePublishInfo) {\n         \
  \           if ($thePublishInfo->nodeType == 1 && $thePublishInfo->nodeName == \"\
  PublisherName\") {\n                        $theBookPublisher = $thePublishInfo->textContent;\n\
  \                    }\n                    if ($thePublishInfo->nodeType == 1 &&\
  \ $thePublishInfo->nodeName == \"PublishedYear\") {\n                        $theBookPublishedYear\
  \ = $thePublishInfo->textContent;\n                    }\n                }\n  \
  \          }\n        }\n    }\n}\n\necho \"\n    <p><em\".$theBookTitle.\"</em>\n\
  \    by \".$theBookAuthor.\"<br/>\n    published by \".$theBookPublisher.\" in \"\
  .$theBookPublishedYear.\"</p>\";\n\nunset($theBookTitle);\nunset($theBookAuthor);\n\
  unset($theBookPublisher);\nunset($theBookPublishedYear);\n}\n```\n\n\n\n\n\n48:\
  \ `?>`\n\n第 2 行创建一个新的 DOM 文档，第 3 行将 `books.xml` 的内容加载到此文档中。正如后续行所示，现在可以通过 `$dom`\
  \ 访问文档树。第 5 行开始遍历文档树的主循环，它将文档的每个节点放入一个名为 `$books` 的数组中。\n\n第 6 行寻找名为 `Book` 的元素，如果找到，则继续处理。`<Book></Book>`\
  \ 标签对包裹了 `books.xml` 文件中的每条书籍条目。如果继续处理，第 8 行将所有子节点收集到名为 `$theBook` 的数组中，第 9–12 行和\
  \ 14–17 行分别查找特定节点 `Title` 和 `Author`，并将这些值放入变量 `$theTitle` 和 `$theAuthor` 中以供以后使用。\n\
  \n第 19 行开始了一条类似的语句，因为该行寻找一个名为 `Publishing Info` 的节点，而你知道 `<PublishingInfo></PublishingInfo>`\
  \ 标签包含自己的一组子节点，因此需要另一个循环结构来获取下一层级的信息。在第 22 行，找到了子节点并将其放入名为 `$thePublishingInfo`\
  \ 的数组中，第 23–26 行和 28–32 行分别查找特定节点 `PublisherName` 和 `PublishedYear`，并将这些值放入变量 `$thePublisher`\
  \ 和 `$thePublishedYear` 中以供使用。\n\n第 8 行创建的循环在第 35 行关闭后，第 37–40 行使用存储在 `$theTitle`、`$theAuthor`、`$thePublisher`\
  \ 和 `$thePublishedYear` 变量中的值向浏览器输出标记字符串。在使用这些值后，它们在第 42–45 行被取消，循环继续处理中的下一个 `Book`\
  \ 条目。\n\n将此列表保存为 `domexample.php` 并将其放在 Web 服务器的文档根目录下。通过浏览器查看时，你应该能看到类似于图 28.1\
  \ (#ch28.html_ch28fig01)。\n\n![image](img/28fig01.jpg)\n\n图 28.1 使用 DOM 函数提取并显示的文本。\n\
  \n要查看 PHP 中所有与 DOM 相关的类、方法和相关函数的完整列表，请访问 PHP 手册 [`www.php.net/dom`](http://www.php.net/dom)。\n\
  \n在下一节中，你将使用相同的 `books.xml` 文件，但使用 SimpleXML 系列函数而不是 DOM 来检索并显示其值。\n\n### 使用 SimpleXML\
  \ 函数在 PHP 中访问 XML\n\nSimpleXML 在 PHP 中默认启用，不需要安装或配置步骤。它正如 PHP 手册描述的“非常简单且易用的工具”，同时仍然非常强大。\n\
  \n与 DOM 函数族不同，SimpleXML 只有几个函数和方法。最基本的 SimpleXML 函数将 XML 数据解析为对象，你可以直接访问和操作该对象，而无需特定函数（换句话说，就像处理任何对象一样）。你需要了解的第一个函数是\
  \ `simplexml_load_file()`，它加载文件并根据数据创建一个对象：\n\n点击此处查看代码图像](#images.html_p546pro01)\n\
  \n```\n$object_with_data = simplexml_load_file(\"somefile.xml\");\n```\n\n列表 28.2\
  \ (#ch28.html_ch28ex02) 使用一小段代码创建一个 SimpleXML 对象，然后显示对象中存储的数据层级结构。\n\n#### 列表 28.2\
  \ 使用 SimpleXML 加载并显示数据\n\n点击此处查看代码图像](#images.html_p28pro02)\n\n```php\n<?php\n\
  $theData = simplexml_load_file(\"books.xml\");\necho \"<pre>\";\nprint_r($theData);\n\
  echo \"</pre>\";\n?>\n```\n\n第 2 行使用 `simplexml_load_file()` 将 `books.xml` 的内容加载到名为\
  \ `$theData` 的对象中。在第 4 行，`print_r()` 函数输出对象中存储的数据的可读版本，并被 `<pre></pre>` 标签对包裹。\n\
  \n将此列表保存为 `simplexml_dump.php` 并将其放在 Web 服务器的文档根目录下。通过浏览器查看时，你应该能看到类似于图 28.2 (#ch28.html_ch28fig02)。\n\
  \n![image](img/28fig02.jpg)\n\n图 28.2 从 SimpleXML 对象转出的数据。\n\n转储数据并不特别神奇，但它确实向你展示了对象的结构，这反过来让你知道如何以分层方式访问数据。例如，`simplexml_dump.php`\
  \ 的输出显示了书籍条目：\n\n点击此处查看代码图像](#images.html_p547pro01)\n\n```\n[0] => SimpleXMLElement\
  \ Object\n(\n    [Title] => A Very Good Book\n    [Author] => Jane Doe\n    [PublishingInfo]\
  \ => SimpleXMLElement Object\n    (\n        [PublisherName] => Sams Publishing\n\
  \        [PublisherCity] => Indianapolis\n        [PublishedYear] => 2012\n    )\n\
  )\n```\n\n要直接引用它，使用以下内容：\n\n- `$theData->Book->Title` 获取 Title\n- `$theData->Book->Author`\
  \ 获取 Author\n- `$theData->Book->PublishingInfo->PublisherName` 获取 Publisher\n- `$theData->Book->PublishingInfo->PublisherCity`\
  \ 获取 City\n- `$theData->Book->PublishingInfo->PublishedYear` 获取 Year\n\n但由于你可能想遍历所有记录而不仅仅是第一条，语法略有不同，如列表\
  \ 28.3 (#ch28.html_ch28fig3 所示。\n\n```php\n<?php\n$theData = simplexml_load_file(\"\
  books.xml\");\nforeach($theData->Book as $Book) {\n    echo \"<pre>\";\n    echo\
  \ \"<p>\".$Book->Title.\"</p>\";\n    echo \"<em>\".$Book->Author.\"</em>\";\n \
  \   echo \"<b> (\".$Book->PublishingInfo->PublisherName.\")</b>\";\n    echo \"\
  <b> (\".$Book->PublishingInfo->PublisherCity.\")</b>\";\n    echo \"<b> (\".$Book->PublishingInfo->PublishedYear.\"\
  ))</b>\";\n    echo \"</pre>\";\n}\n?>\n```\n\n\n\n\n使用 JSON，你可以拥有键/值对集合（形式为对象），你还可以拥有一个有序的值列表（形式为数组）。如果你将本章节早前面提到的\
  \ `books.xml` 文件中的一个条目重新转换为 JSON 格式，它可能看起来像下面的代码段：\n\n点击此处查看代码图片\n\n```json\n{\n\
  \  \"book\":[\n    {\n      \"title\":\"A Very Good Book\",\n      \"author\":\"\
  Jane Doe\",\n      \"publisher_name\":\"Sams Publishing\",\n      \"publisher_city\"\
  :\"Indianapolis\",\n      \"publisher_year\":\"2012\"\n    }\n  ]\n}\n```\n\n添加另外两个条目将为你提供类似\
  \ 列表 28.4 所示的 JSON 格式数据。\n\n列表 28.4 JSON 格式的图书数据\n\n点击此处查看代码图片\n\n* * *\n\n```json\n\
