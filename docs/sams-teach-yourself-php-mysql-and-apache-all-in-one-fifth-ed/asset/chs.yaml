  \ PHP 日期相关的函数。在本章中，你学习了如何使用日期相关函数、如何构建一个类以及如何使用 cookie 来验证用户输入。\n\n### 问答\n**Q.\
  \ 有用于转换的函数吗？**\n**A.** 有的，PHP 提供了一整套函数。\n\n### 工作坊\n工作坊旨在帮助你复习所学内容并付诸实践。\n\n###\
  \ 测验\n**1. 我们使用什么函数进行跟踪？**\n**2. 我们使用什么函数进行授权？**\n**3. 为什么这些变量被声明为公共（public）？**\n\
  \n### 答案\n**1.** `mktime()`\n**2.** `getdate()`\n**3.** 公共变量\n\n### 活动\n**1.** 修改日历显示以显示直到\
  \ 12 月的一整年。\n**2.** 修改事件创建脚本以使用 `date_pulldown` 类。\n\n# 第 25 章限制应用程序的访问\n\n在本章中，你将学习：\n\
  \n- 如何根据用户、客户端 IP 地址、域名和浏览器版本限制访问\n- 如何使用 Apache 提供的用户工具\n- 如何存储和检索 cookie 信息\n\
  - 如何使用 cookie 进行身份验证\n\n本章解释了如何使用 Apache 根据用户身份或请求信息来限制访问。在应用端，你可以创建自己的用户验证机制并通过\
  \ cookie 进行检查。\n\n### 身份验证概述\n授权和身份验证是许多网站的要求。在继续之前，我们来看几个定义。\n\n*身份验证*用于建立通信双方的身份。你可以通过你所知的（如密码或\
  \ cookie）、通过你拥有的实体（如身份卡或钥匙）、通过你固有的特征（如指纹或视网膜）或这些元素的任何组合来验证身份。在网站上下文中，身份验证通常限制为密码和证书的使用。\n\
  \n*授权*涉及对资源的保护。你可以根据多个因素授权访问，例如用户所在的 IP 地址、浏览器类型、用户尝试访问的内容以及用户是谁（之前已通过身份验证确定）。\n\
  \n\n\n\n\n3. 客户端读取响应并提示用户输入所需的用户名和密码（通常会弹出一个对话框）。\n\n4. 客户端再次尝试访问网页，这次会将用户名和密码作为\
  \ HTTP 请求的一部分进行传输。客户端会记住用户名和密码，并在后续对同一站点的请求中传输它们，因此用户不需要为每次请求都重新输入。\n\n5. Apache\
  \ 检查凭据的有效性，并根据用户身份和其他访问规则授权或拒绝访问。\n\n在基础认证（basic authentication）方案中，用户名和密码以明文形式作为\
  \ HTTP 请求头的一部分传输。这构成了安全风险，因为攻击者可以轻松窥视服务器与浏览器之间的对话，获取用户名和密码，并在之后自由地使用它们。\n\n摘要认证（digest\
  \ authentication）提供了更高的安全性，因为它传输的是摘要值而不是明文密码。摘要值基于多个参数的组合，包括用户名、密码和请求方法。服务器可以独立计算摘要值，并验证客户端知道密码，即使密码本身没有通过网络传输。\n\
  \n***\n\nNote\n\n`digest algorithm`（摘要算法）是一种数学操作，它接收一个文本并返回另一个文本（即摘要），该摘要能唯一地标识原始文本。一个良好的摘要算法应该确保，至少在实际用途中，不同的输入文本会产生不同的摘要，且无法从摘要中推导出原始输入文本。`MD5`\
  \ 是一种常用摘要算法的名称。\n\n***\n\n由于浏览器对摘要认证的支持可能存在差异，你可能希望将其使用限制在你可以控制客户端浏览器软件的场景中，例如在企业内网中。\n\
  \n无论如何，对于摘要认证和基础认证，请求的信息本身都是不受保护地在网络上传输的。安全网站访问的更好选择是使用 HTTP over SSL 协议，如第 30 章“设置安全的\
  \ Web 服务器”中所示。\n\n## 用户管理方法\n\n当认证模块从客户端接收到用户名和密码时，它需要验证这些信息对于现有用户库来说是有效的。用户名和密码可以通过多种方式存储，包括\
  \ Apache 提供的基于文件和数据库的机制。第三方模块提供了额外机制的支持，例如`轻量级目录访问协议` (`LDAP`）和`网络信息服务` (`NIS`）。\n\
  \n### Apache 认证模块功能\n\nApache 提供了执行认证和访问控制的基本框架和指令。认证模块提供支持针对特定的后端方法（文件、数据库等）验证密码。用户可以可选地组织成组，从而简化访问控制规则的管理。\n\
  \nApache 提供了三个与认证相关的内置指令，可以与任何认证模块配合：`AuthName`、`AuthType` 和 `Require`。\n\n`AuthName`\
  \ 接受字符串参数，即认证域（realm）的名称。`realm` 是 Web 服务器中你请求密码的逻辑区域。它会显示在浏览器的弹出窗口中。\n\n`AuthType`\
  \ 指定浏览器认证的类型：基础（basic）或摘要（digest）。\n\n`Require` 允许你指定允许访问的用户或组列表。语法为 `Require user`\
  \ 后跟一个或多个用户名，或者 `Require group` 后跟一个或多个组名。例如：\n\n```\nRequire user joe bob\n```\n\
  \n或\n\n```\nRequire group employee contractor\n```\n\n如果你想允许任何提供有效用户名和密码的人访问，可以如下如下操作：\n\
  \n```\nRequire valid-user\n```\n\n通过上述指令，你可以控制谁可以访问特定的虚拟主机、目录、文件等。虽然认证和授权是两个不同的概念，但在实践中，它们在\
  \ Apache 是交织的。访问是根据特定的用户身份或组组成授予的。某些第三方模块（例如某些基于 LDAP 的模块）允许认证和授权之间有更清晰的分离。\n\n\
  Apache 自的认证模块提供了：\n\n- **后端存储**——提供包含用户名和组信息的文本或数据库文件\n- **用户管理**——提供在后端存储中创建和管理用户及组的工具\n\
  - **权威信息**——指定模块的结果是否具有权威性\n\n***\n\nNote\n\n有时用户将不会被允许访问特定域，因为在模块提供的用户数据库中未找到其信息，或者因为没有认证规则匹配其信息。在这种情况下，会发生两种情况之一：\n\
  \n- 如果模块指定其结果为权威的，则用户被拒绝访问，Apache 返回错误。\n- 如果模块指定其结果为非权威的，其他模块可以尝试对用户进行认证。\n\n这让你拥有一个了解大多数用户的主授权模块，并拥有可以认证其余用户的附加模块。\n\
  \n***\n\n## 基于文件的认证\n\n`mod_auth` Apache 模块通过包含用户名和密码的文本文件提供基础认证，类似于传统的 UNIX 认证通过\
  \ `/etc/passwd` 和 `/etc/groups` 文件工作的方式。\n\n### 后端存储\n\n使用后端存储方法时，你需要指定包含用户名和密码列表的文件，可选地指定包含组列表的文件。\n\
  \n`users` 文件是一个 UNIX 风格的密码文件，包含用户名称和加密后的密码。在 UNIX 上使用 `crypt` 算法，条目如下：\n\n```\n\
  admin:iFrlxqg0Q6RQ6\n```\n\n在 Windows 上，使用 `MD5` 算法，它们看起来像这样：\n\n```\nadmin:$apr1$Ug3.....$jVTedbQWBKTfXsn5jK6UX/\n\
  ```\n\n`groups` 文件包含组列表以及属于每个组的用户，用户之间用空格分隔，例如：\n\n```\nweb: admin Daniel\n```\n\
  \n`AuthUserFile` 和 `AuthGroupFile` 指令接受路径参数，指向 `users` 文件和 `groups` 文件。`groups`\
  \ 文件是可选的。### 用户管理\n\nApache 分发包含了 UNIX 上的 `htpasswd` 工具和 Windows 上的 `htpasswd.exe`；它们旨在帮助你管理密码文件。两个版本功能上是相同的，但\
  \ Windows 版本使用了不同的方法加密密码。加密对用户和管理员是透明的。在 Linux/UNIX 上，当你第一次添加用户时，需要输入：\n\n```\n\
  /usr/local/apache2/bin/htpasswd -c file userid\n```\n\n其中 `file` 是包含用户名和密码列表的密码文件，`userid`\
  \ 是你想添加的用户名。随后会提示输入密码，并创建文件。例如，在 Linux/UNIX 上，命令：\n\n```\n/usr/local/apache2/bin/htpasswd\
  \ -c /usr/local/apache2/conf/htusers admin\n```\n\n创建密码文件 `/usr/local/apache2/conf/htusers`\
  \ 并添加 `admin` 用户。\n\nWindows 上存在类似的功能，命令行操作可能如下：\n\n```\nhtpasswd -c \"C:\\Program\
  \ Files\\Apache Software Foundation\\Apache2.2\\conf\\htusers\" admin\n```\n\n`-c`\
  \ 命令行选项告诉 `htpasswd` 执行文件它应该创建文件。当你向现有的密码文件添加用户时，不要使用 `-c` 选项；如果这样做，文件将被覆盖。\n\n\n\
  \n\n将密码文件存储在文档根目录之外，使其无法通过 Web 浏览器访问是非常关重要的。否则，攻击者可能会下载该文件并获取你的用户名和密码列表。虽然密码经过了加密，但一旦获取了该文件，就可能进行暴力破解来尝试猜测它们。\n\
  \n### 使用 `mod_auth`\n\n列表 25.1 显示了一个配置示例，该示例限制了对文档根目录下 `private` 目录的访问，仅允许 `htusers`\
  \ 密码文件中通过身份验证的用户。请注意，此处包含可选的 `AuthGroupFile` 指令。\n\n**列表 25.1** 基于文件的认证示例\n\n点击此处查看代码图片\n\
  \n```\n1: <Directory /usr/local/apache2/htdocs/private>\n2: AuthType Basic\n3: AuthName\
  \ \"Private Area\"\n4: AuthUserFile /usr/local/apache2/conf/htusers\n5: Require\
  \ valid-user\n6: </Directory>\n```\n\n#### 数据库文件级访问控制\n\n将用户名和密码存储在明文文件中虽然方便，但这种方法的可扩展性不好。Apache\
  \ 需要顺序打开并读取文件以查找特定用户。当用户数量增加时，此操作将变得非常耗时。`mod_auth_dbm` 模块允许你用索引数据库文件替换文本文件，它可以处理多得多的用户而不会导致性能下降。`mod_auth_dbm`\
  \ 模块包含在 Apache 中，但默认未启用。在配置 Apache 使用 `--enable-module=dbm` 选项进行构建时，会启用该模块。\n\n\
  ##### 后端存储\n\n`mod_auth_dbm` 模块提供了两个指令 `AuthDBMUserFile` 和 `AuthDBMGroupFile`，它们指向包含用户名和组的数据库文件。与明文文件不同，这两个指令可以指向同一个文件，该文件同时包含用户和组。\n\
  \n##### 用户管理\n\nApache 为 UNIX 和 Windows 用户都提供了一个名为 `htdbm` 的工具，允许你创建和管理存储在数据库文件中的用户和组。\n\
  \n你可以在 Apache 分发版的 `bin` 目录中找到该工具；进入后，要向新数据库添加用户，请输入以下命令：\n\n```\nhtdbm –c databasename\
  \ userid\n```\n\n系统会提示你输入密码，然后用户会被添加到新的数据库文件中。\n\n如果你需要删除用户 `daniel`，可以执行以下命令：\n\
  \n```\nhtdbm –x databasename daniel\n```\n\n你可以通过在不带任何参数的情况下调用 `htdbm` 来获取完整的语法信息。\n\
  \n### 使用 Apache 进行访问控制\n\n默认启用的 `mod_authz_host` 模块允许你根据客户端请求的参数（例如特定标头的存在或客户端的\
  \ IP 地址或主机名）限制对资源的访问。\n\n#### 实现访问规则\n\n你可以使用 `Allow` 和 `Deny` 指令来指定访问规则。这些指令中的每一个都接受参数列表，如\
  \ IP 地址、环境变量和域名。\n\n##### 通过 IP 地址允许/拒绝访问\n\n你可以根据客户端的 IP 地址来拒绝或授予其访问权限：\n\n```\n\
  Allow from 10.0.0.1\nDeny from 10.0.0.2\n10.0.0.3\n```\n\n你还可以通过部分 IP 地址或网络/掩码对来指定\
  \ IP 地址范围。此外，你还可以指定 IP 地址的前 1、2 或 3 个字节。任何包含这些字节的 IP 地址都将匹配此规则。\n\n```\nDeny from\
  \ 10.0\nAllow from 10.0.0\n10.0.0.1\n```\n\n你也可以使用 IP 地址和子掩码；IP 地址指定网络，掩码指定哪些位属于网络，哪些位属于节点。\n\
  \n```\nAllow from 10.0.0.0/255.255.255.0\nDeny from 10.0.0.1\n10.0.0.2\n10.0.0.254\n\
  ```\n\n你也可以通过高位位指定网络掩码。例如，你可以将之前的规则写为：\n\n```\nAllow from 10.0.0.0/24\n```\n\n#####\
  \ 通过域名允许/拒绝访问\n\n你可以根据特定的主机名或部分域名来控制访问。例如，`Allow from example.com` 会匹配 `www.example.com`、`foo.example.com`\
  \ 等。\n\n注意：启用基于域名的访问规则会强制 Apache 对客户端进行 DNS 查找，从而绕过 `HostNameLookups` 指令。这会对性能产生影响。\n\
  \n##### 基于环境变量允许/拒绝访问\n\n你可以通过在变量名前前加上字符串 `env=`，根据某些环境变量的存在来指定访问规则。你可以使用此功能来授予或拒绝某些浏览器或浏览器版本的访问，以防止特定站点链接到你的资源。为了使此示例按预期工作，客户端需要传输\
  \ `User-Agent` 标头。\n\n例如：\n\n```\nDeny from env=iexorer\n```\n\n由于客户端发送了 `User-Agent`\
  \ 标头，它可能被省略或操纵，但大多数用户不会这样做，这种技术在大多数情况下都有效。\n\n##### 对所有客户端允许/拒绝访问\n\n关键字 `all` 匹配所有客户端。你可以指定\
  \ `Allow from all` 或 `Deny from all` 来授予或拒绝所有客户端的访问。\n\n#### 访问规则的评估\n\n你可以拥有多个\
  \ `Allow` 和 `Deny` 访问规则。你可以使用 `Order` 指令选择规则的评估顺序。后评估规则具有更高的优先级。`Order` 接受参数，可以是\
  \ `Deny,Allow`、`Allow,Deny` 或 `Mutual-Failure`。`Deny,Allow` 是 `Order` 指令的默认值。\n\n\
  ##### Deny,Allow\n\n`Deny,Allow` 指定 `Deny` 指令在 `Allow` 指令之前评估。在 `Deny,Allow` 模式，如果没有\
  \ `Allow` 或 `Deny` 指令，或者客户端不匹配任何规则，默认授予访问。如果客户端匹配 `Deny` 规则，则被拒绝，除非它也匹配 `Allow`\
  \ 规则，因为 `Allow` 指令最后评估且具有优先级。\n\n列表 25.2 显示了如何配置 Apache，允许来自内部网络或 `example.com`\
  \ 域名的客户端访问 `/private` ，并拒绝其他人的访问。\n\n**列表 25.2** Deny,Allow 访问控制示例\n\n点击此处查看代码图片\n\
  \n```\n1: <Location /private>\n2: Order Deny,Allow\n3: Deny from all\n4: Allow from\
  \ 10.0.0.0/255.255.255.0 example.com\n5: </Location>\n```\n\n##### Allow,Deny\n\n\
  `Allow,Deny` 指定 `Allow` 指令在 `Deny` 指令之前评估。在 `Allow,Deny` 模式下，如果没有 `Allow` 或 `Deny`\
  \ 指令，或者客户端不匹配任何规则，默认拒绝访问。如果客户端匹配 `Allow` 规则，则授予访问，除非它也匹配 `Deny` 规则，因为 `Deny` 规则具有优先级。\n\
  \n注意：存在 `Order Allow,Deny` 但没有任何 `Allow` 或 `Deny` 规则会导致对指定资源的请求被拒绝，因为默认行为是拒绝访问。\n\
  \n列表 25.3 允许除特定主机以外的所有人的访问。\n\n**列表 25.3** Allow,Deny 访问控制示例\n\n```\n1: <Location\
  \ /some/location/>\n2: Order Allow,Deny\n3: Allow from all\n4: Deny from host.example.com\n\
  5: </Location>\n```\n\n##### Mutual-Failure\n\n在 `Mutual-Failure` 的情况下，只有当主机匹配 `Allow`\
  \ 指令且不匹配任何 `Deny` 指令时，才会被授予访问。\n\n### 结合 Apache 访问方法\n\n在之前的节中，你学习了如何根据用户身份或请求信息来限制访问。`Satisfy`\
  \ 指令允许你决定是否需要同时满足两种访问限制才能授予访问。`Satisfy` 接受一个参数，可以是 `all` 或 `any`。\n\n\n\n`Satisfy\
  \ all` 意味着客户端提供了有效的用户名和密码*并且*通过了访问限制，将被授予访问权限。`Satisfy any` 意味着客户端提供了有效的用户名和密码*或者*通过了访问限制，将被授予访问权限。\n\
  \n为什么这个指令有用？例如，你可能希望向来自内部信任地址的用户免费开放你的网站访问，但要求来自互联网的用户提供有效的用户名和密码。列表 25.4 正好演示了这一点。\n\
  \n**列表 25.4** 混合身份验证与访问控制规则\n\n点击此处查看代码图像\n\n```\n1: <Location /restricted>\n2:\
  \ Allow from 10.0.0.0/255.255.255.0\n3: AuthType Basic\n4: AuthName \"Intranet\"\
  \n5: AuthUserFile /usr/local/apache2/conf/htusers\n6: Require valid-user\n7: Satisfy\
  \ any\n8: </Location>\n```\n\n## Note\n\n基于连接或请求信息的访问控制并不是完全安全的。虽然它为大多数情况提供了适当的保护，但这些规则依赖于你的\
  \ DNS 服务器和网络基础设施的完整性。如果攻击者控制了你的 DNS 服务器，或者你的路由器或防火墙配置不当，他可以轻松更改授权的域名记录以指向他的机器，或者伪装成来自授权的\
  \ IP 地址。\n\n## 基于 HTTP 方法限制访问\n\n通常情况下，你希望访问控制指令适用于所有类型的客户端请求，这是默认行为。但在某些情况下，你可能只想将身份验证和访问规则应用于某些特定的\
  \ HTTP 方法，例如 `GET` 和 `HEAD`。\n\n`<Limit>` 容器接受方法列表，并包含包含这些方法的请求的指令。你可以使用的完整方法列表有\
  \ `GET`、`POST`、`PUT`、`DELETE`、`CONNECT`、`OPTIONS`、`PATCH`、`PROPFIND`、`PROPPATCH`、`MKCOL`、`COPY`、`MOVE`、`LOCK`\
  \ 和 `UNLOCK`。\n\n`<LimitExcept>` 部分提供了补充功能，包含适用于不包含列出方法的请求的指令。\n\n列表 25.5 显示了默认\
  \ Apache 配置文件中的示例。`<Limit>` 和 `<LimitExcept>` 部分允许只读方法，但拒绝对任何可以修改文件系统内容的方法的请求，例如\
  \ `PUT`。有关此处可用的无数种选项，请参阅 Apache 文档 [`httpd.apache.org/docs-2.2/mod/core.html`](http://httpd.apache.org/docs-2.2/mod/core.html)。\n\
  \n**列表 25.5** 基于规则限制访问\n\n点击此处查看代码图像\n\n```\n1: <Directory /home/*/public_html>\n\
  2:   AllowOverride FileInfo AuthConfig Limit\n3:   Options MultiViews Indexes SymLinksIfOwnerMatch\
  \ IncludesNoExec\n4:   <Limit GET POST OPTIONS PROPFIND>\n5:     Order Allow,Deny\n\
  6:     Allow from all\n7:   </Limit>\n8:   <LimitExcept GET POST OPTIONS PROPFIND>\n\
  9:     Order Deny,Allow\n10:    Deny from all\n11:  </LimitExcept>\n12: </Directory>\n\
  ```\n\n在下一节中，你将学习根据 cookie 中发现的信息在应用端限制访问。\n\n## 基于 Cookie 值限制访问\n\n在第 12 章“处理 Cookie\
  \ 和用户会话”中，你学习了 cookie 的结构以及如何在 PHP 中设置和访问 cookie 变量。接下来的几节展示了 cookie 用于身份验证的一些实际用途。\n\
  \n假设你想创建一个登录表单，根据数据库检查值。如果用户已授权，你就发送一个说明此点的 cookie。然后，对于你只想限制给授权用户的所有页面，你检查特定的 cookie。如果\
  \ cookie 存在，用户就可以查看页面。如果 cookie 不存在，用户将被送回登录表单，或者在屏幕上打印有关访问限制的消息。接下来的几节将详细介绍这些每一个步骤。\n\
  \n### 创建授权用户表\n\n当你将用户账户集成到基于 Web 的应用程序时，通常会在数据库表中存储用户特定的信息。该表中的信息随后可以用于授权用户，并授予他们访问网站专门为这些“特殊”用户区域的权限。\n\
  \n以下创建表命令在你的 MySQL 数据库中创建一个名为 `auth_users` 的表，包含 ID、名字、姓氏、电子邮件地址、用户名和密码的字段：\n\n\
  点击此处查看代码图像\n\n```\nCREATE TABLE auth_users (\n    id int NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    f_name VARCHAR(50),\n    l_name VARCHAR(50),\n    email VARCHAR(100),\n   \
  \ username VARCHAR(50),\n    password VARCHAR(255)\n);\n```\n\n\n\n\n```php\n//use\
  \ mysqli_real_escape_string to clean the input\n$username = mysqli_real_escape_string($mysqli,\
  \ $_POST['username']);\n$password = mysqli_real_escape_string($mysqli, $_POST['password']);\n\
  \n//create and issue the query\n$sql = \"SELECT f_name, l_name FROM auth_users WHERE\n\
  \        username = '\".$username.\"' AND\n        password = PASSWORD('\".$password.\"\
  ')\";\n$result = mysqli_query($mysqli, $sql) or die(mysqli_error($mysqli));\n\n\
  //get the number of rows in the result set; should be 1 if a match\nif (mysqli_num_rows($result)\
  \ == 1) {\n    //if authorized, get the values of f_name l_name\n    while ($info\
  \ = mysqli_fetch_array($result)) {\n        $f_name = stripslashes($info['f_name']);\n\
  \        $l_name = stripslashes($info['l_name']);\n    }\n\n    //set authorization\
  \ cookie\n    setcookie(\"auth\", \"1\", 0, \"/\", \"yourdomain.com\", 0);\n\n \
  \   //create display string\n    $display_block = \"\n    <p>\".$f_name.\" \".$l_name.\"\
  \ is authorized!</p>\n    <p>Authorized Users' Menu:</p>\n    <ul>\n    <li><a href=\\\
  \"secretpage.php\\\">secret page</a></li>\n    </ul>\";\n} else {\n    //redirect\
  \ back to login form if not authorized\n    header(\"Location: userlogin.html\"\
  );\n    exit;\n}\n//close connection to MySQL\nmysqli_close($mysqli);\n?>\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>User Login</title>\n</head>\n<body>\n<?php echo\
  \ $display_block; ?>\n</body>\n</html>\n```\n\n将这些行放入到名为 `userlogin.php` 的文本文件中，修改第\
  \ 32 行将 `\"yourdomain.com\"` 改为你的实际域名，并将此文件放置在你的 Web 服务器的文档根目录下。稍后你将尝试运行，但让我们先检查一下脚本在做什么。\n\
  \n第 3 行检查两个必需的字段——即表单中唯一的两个字段：`$_POST['username']` 和 `$_POST['password']`。如果这两个字段任一不存在，脚本会将用户重定向回原始登录表单。如果这两个字段*确实*存在，脚本将移动到第\
  \ 9 行，连接到数据库服务器，准备发布 SQL 查询以检查用户的身份真实性。不过，在发布查询之前，第 13 行和第 14 行对用户输入进行了清理。清理完成后，查询及其执行位于第\
  \ 17–20 行中。请注意，该查询会将从表单获取的密码哈希值与表中存储的密码进行比对。这两个元素必须相互匹配，并且属于指定的用户名，才能授权该用户。\n\n\
  第 23 行通过计算结果集中的行数来测试查询结果。如果用户名和密码对代表有效的登录，则行数应恰好为 1。如果是此类情况，则在第 26–29 行中使用 `mysqli_fetch_array()`\
  \ 函数来提取用户的姓和名。这些名称仅用于美观考虑。\n\n第 32 行设置了授权 cookie。cookie 的名称为 `auth`，值为 `1`。如果在时间槽中填入\
  \ `0`，则 cookie 的有效期将持续到该用户的浏览器会话开启。当用户关闭浏览器时，cookie 就会过期。第 35–40 行创建了一个用于显示的消息，其中包含指向你稍后创建的文件的链接。\n\
  \n最后，第 41–45 行处理失败的登录尝试。在这种情况下，用户将被简单地重定向回原始登录表单。\n\n现在请访问登录表单并输入有效值吧。\n\n\n\n\n\
  \n## 问题\n\n**3.** 哪个函数设计用于让你在访问者的浏览器上设置 cookie？\n\n### 答案\n\n**1.** 数据库文件具有更强的扩展性，因为它们可以被索引，并且还可以进行聚类以增强健壮性。这意味着\
  \ Apache 不需要按顺序读取文件直到找到某个特定用户的匹配项，而是可以直接跳转到精确位置。\n\n**2.** 缺点之一是信息以明文形式在网络上传输。这意味着，除非你正在使用\
  \ `SSL`，否则攻击者可能会读取你的浏览器发送到服务器的封包并窃取你的密码。另一个缺点是 `HTTP` 身份验证没有提供自定义登录的方法（区域名称 realm\
  \ name 除外）。网站通常使用 `HTML` 表单和 cookie 实现自定义的登录机制。\n\n**3.** `setcookie()` 函数允许你设置\
  \ cookie（尽管你也可以使用 `header()` 函数输出 `Set-Cookie` 头部）。\n\n### 活动\n\n在你的开发服务器上练习各种类型的身份验证——包括基于服务器的和使用\
  \ `PHP` 的验证。感受一下基础 `HTTP` 身份验证与你自己设计的机制之间的区别。\n\n## 第 26 章：日志记录与监控 Web 服务器活动\n\n\
  在本章中，你将学习以下内容：\n\n- 如何理解 `Apache` 日志格式和日志级别\n- 如何轮转和分析 `Apache` 日志\n- 如何解释日志中可能出现的常见错误\n\
  - 如何创建脚本将特定项目记录到数据库表中\n- 如何基于这些日志表创建自定义报告\n\n本章描述了 `Apache` 日志系统的工作原理，以及你如何对其进行自定义（存储哪些信息以及存储在何处）。此外，还将学习一种使用\
  \ `PHP` 和 `MySQL` 的快速方法，在 `Apache` 日志文件之外记录你感兴趣的特定项目。\n\n## 标准 Apache 访问日志\n\n使用\
  \ `Apache` 的基本日志功能，你可以通过记录对托管网站的服务器的访问来跟踪谁访问了你的网站。你可以记录浏览器请求和服务器响应的各个方面，包括客户端的 `IP`\
  \ 地址、用户以及访问的资源。创建请求日志需要分三个步骤：\n\n1. 定义你想记录的*内容*——你的日志格式。\n2. 定义你想将其记录在*何处*——你的日志文件、数据库或外部程序。\n\
  3. 定义*是否*要记录——条件日志记录规则。\n\n接下来的几节将详细介绍这些步骤。\n\n#### 定义要记录的内容\n\n除了记录与请求相关的几乎每个方面外，你还可以通过创建日志格式来定义你的日志条目的显示方式。*日志格式*是一个包含混合文本和日志格式化指令的字符串。日志格式化指令以\
  \ `%` 开头，后跟指令名称或标识符，通常是一个表示要记录的信息片段的字母。\n\n当 `Apache` 记录一个请求时，它会扫描字符串并为每个指令替换值。例如，如果日志格式为\
  \ `This is the client address %a`，则日志条目类似于 `This is the client address 10.0.0.2`。也就是说，日志指令\
  \ `%a` 替换了发起请求的客户端的 `IP` 地址。表 26.1 提供了所有格式化指令的完整列表。\n\n**表 26.1 日志格式化指令**\n\n![image](img/26tab01.jpg)\n\
  \n*常用日志格式*（CLF）是一种标准的日志格式。大多数网站都可以使用这种格式记录请求，许多日志处理和报告工具也能理解这种格式。它的格式如下：\n\n`\"\
  %h %l %u %t \\\"%r\\\" %>s %b\"`\n\n也就是说，它包含了客户端的主机名或 `IP` 地址、通过 `identd` 获取的远程用户、通过\
  \ `HTTP` 身份验证的远程用户、提供请求的时间、请求文本、状态码以及所提供内容的字节大小。\n\n> 注意\n> 你可以在原始 `W3C` 服务器的文档中阅读常用日志格式：[`www.w3.org/Daemon/User/Config/Logging.html`](http://www.w3.org/Daemon/User/Config/Logging.html)。\n\
  \n以下是一个 CLF 条目示例：\n\n点击此处查看代码图片\n\n```\n10.0.0.1 - - [19/Jan/2012:17:32:43 -0500]\
  \ \"GET / HTTP/1.0\" 200 1101\n```\n\n你现在已准备好学习如何使用 `LogFormat` 指令定义日志格式。该指令接受两个参数：第一个参数是日志字符串，第二个参数是与该日志字符串关联的别名。\n\
  \n例如，来自默认 `Apache` 配置文件的以下指令定义了 CLF 并赋予其别名 `common`：\n\n```\nLogFormat \"%h %l %u\
  \ %t \\\"%r\\\" %>s %b\" common\n```\n\n你也可以只用一个参数使用 `LogFormat` 指令，即日志格式字符串或别名。这样做的效果是为\
  \ `TransferLog` 指令所使用的日志格式设置默认值，该指令详见定义记录在何处。\n\n#### 定义记录在何处\n\n在记录记录与请求相关的几乎每个方面的同时，你还可以通过创建日志格式来定义你的日志条目的显示方式。*日志格式*是一个包含混合文本和日志格式化指令的字符串。日志格式化指令以\
  \ `%` 开头，后跟指令名称或标识符，通常是一个表示要记录的信息片段的字母。\n\n当 `Apache` 记录一个请求时，它会扫描字符串并为每个指令替换值。例如，如果日志格式为\
  \ `This is the client address %a`，则日志条目类似于 `This is the client address 10.0.0.2`。也就是说，日志指令\
  \ `%a` 替换了发起请求的客户端的 `IP` 地址。表 26.1 提供了所有格式化指令的完整列表。\n\n（注：此处原文逻辑似乎将“Defining What\
  \ to Log”和“Defining Where to Log”的部分内容发生了某种重复或错位，已按原文结构翻译）\n\n#### HostNameups 指令\n\
  \n当客户端发起请求时，`Apache` 只知道 `IP` 地址。`Apache` 必须执行所谓的*反 DNS 查询*来查找与 `IP` 关联的主机名。这种操作非常耗时，并给请求引入延迟。`HostNameups`\
  \ 指令允许你控制是否执行反 DNS 查询。\n\n`HostNameups` 指令可以接受以下参数之一：`on`、`off` 或 `double`。默认值为\
  \ `off`。`double` 查询意味着 Apache 先从 IP 查找主机名，再从主机名查找 IP。如果你在 `Allow` 和 `Deny` 规则中使用主机名，这种过程是必要的，详见\
  \ [`httpd.apache.org/docs-2.2/dns-caveats.html`](http://httpd.apache.org/docs-2.2/dns-caveats.html)。如果你开启它，Apache\
  \ 会记录主机名。这会对服务器产生额外的负载，你在决定开启 `HostNameups` 时应该注意这一点。\n\n如果你选择关闭 `HostNameups`（中高流量网站的建议），`Apache`\
  \ 只记录相关的 `IP` 地址。有很多工具可以解析日志中的 `IP` 地址。参见管理日志。此外，结果通过环境变量 `REMOTE_HOST` 传递给 CGI\
  \ 脚本。\n\n#### IdentityCheck 指令\n\n在章节开头，你学习了如何使用 `%l` 日志格式化指令通过 `identd` 协议记录远程用户名。`IdentityCheck`\
  \ 指令接受 `on` 或 `off` 值，以启用或禁用该值的检查并将其包含在日志中。由于该信息不可靠且检查耗时长，它默认关闭，并且可能永远不应该启用。`%l`\
  \ 被提到是因为它是 CLF 的一部分。关于 `identd` 协议的更多信息，请参阅 RFC 1413 [`www.rfc-editor.org/rfc/rfc1413.txt`](http://www.rfc-editor.org/rfc/rfc1413.txt)。\n\
  \n#### 状态码\n\n你可以指定是否在日志条目中记录特定元素。在章节开头，你了解到日志指令以 `%` 开头，后跟指令标识符。在它们之间，你可以插入一个用逗号分隔的状态码列表。如果请求状态是列出的代码之一，则记录该参数；否则记录\
  \ `-`。\n\n\n\n\n\n例如，以下指令标识符会记录格式错误请求（状态码 400）以及未实现方法的请求（状态码 501）的浏览器名称和版本。这些信息对于追踪哪些客户端正在访问您的网站可能很有用。\n\
  \n```\n%400,501{User-agent}i\n```\n\n你可以在方法列表前加一个 `!`，以便如果这些方法已实现，则记录该参数：\n\n```\n\
  %!400,501{User-agent}i\n```\n\n## 定义日志位置\n\n日志到文件是 Apache 记录请求的默认方式。你可以使用 `TransferLog`\
  \ 和 `CustomLog` 指令来定义文件名。\n\n`TransferLog` 指令接受一个文件参数，并使用由带有单个参数（别名或格式字符串）的 `LogFormat`\
  \ 指令定义的最新日志格式。如果没有日志格式，它将默认使用 CLF（常见日志格式）。\n\n以下示例显示了如何使用 `LogFormat` 和 `TransferLog`\
  \ 指令定义一个基于 CLF 但包含浏览器名称的日志格式：\n\n点击此处查看代码图像\n\n```\nLogFormat \"%h %l %u %t \\\"\
  %r\\\" %>s %b \\\"%{User-agent}i\\\"\"\nTransferLog logs/access_log\n```\n\n`CustomLog`\
  \ 指令允许你显式指定日志格式。它至少接受两个参数：日志格式和一个目标文件。日志格式可以指定为别名，也可以直接指定为日志字符串。\n\n例如，以下指令：\n\n\
  点击此处查看代码图像\n\n```\nLogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{User-agent}i\\\
  \"\" myformat\nCustomLog logs/access_log myformat\n```\n\n以及\n\n点击此处查看代码图像\n\n```\n\
  CustomLog logs/access_log \"%h %l %u %t \\\"%r\\\" %>s %b \\\"%{User-agent}i\\\"\
  \"\n```\n\n它们是等价的。\n\n`CustomLog` 指令接受环境变量作为第三个参数。如果环境变量存在，则记录条目；否则不记录。如果通过在变量前加\
  \ `!` 来取反环境变量，则当该变量**不存在**时记录条目。\n\n以下示例显示了如何避免在日志中记录 GIF 和 JPEG 格式的图像：\n\n点击此处查看代码图像\n\
  \n```\nSetEnvIf Request_URI \"(\\.gif|\\.jpg)$\" image\nCustomLog logs/access_log\
  \ common env=!image\n```\n\n***\n\n注意\n\n在此处及 `httpd.conf` 文件的其他区域用于模式匹配的正则表达式遵循与\
  \ PHP 及其他编程语言中正则表达式相同的格式。\n\n***\n\n`TransferLog` 和 `CustomLog` 指令均接受一个以管道符号 `|`\
  \ 前缀的可执行程序作为参数。Apache 将日志条目写入该程序的标准输入。该程序反过来通过将条目记录到数据库、传输到另一个系统等方式处理输入。\n\n如果程序由于某些原因崩溃，服务器会确保它重启。如果服务器停止，程序也会停止。与\
  \ Apache 捆绑并在本章稍后介绍的 `rotatelogs` 工具就是一个日志程序示例。\n\n作为一般原则，除非你对使用特定程序有特殊需求，否则记录日志到磁盘文件并在稍后（可能在不同的机器上）进行日志的处理、合并、分析等操作更为简单且更可靠。\n\
  \n***\n\n注意\n\n确保你用于记录请求的程序是安全的，因为它是以启动 Apache 的用户身份运行的。在 UNIX 上，这通常意味着 root，因为外部程序在服务器将用户\
  \ ID 更改为 `User` 指令的值（通常为 `nobody` 或 `www`）之前启动。\n\n***\n\n### 标准 Apache 错误日志\n\n\
  除了客户端请求，还可以配置 Apache 错误消息和调试信息。除了 Apache 自身生成的错误，还可以记录 CGI 错误。\n\n每个错误日志条目都带有错误发生时间和客户端\
  \ IP 地址或主机名（如果可用）。与 HTTP 请求日志一样，你可以将错误信息记录到文件或程序。在 UNIX 系统上，你还可以记录到 `syslog` 守护进程。在\
  \ Windows 上，错误可以记录在 Windows 事件日志中，然后可以通过 Windows 事件查看器查看。使用 `ErrorLog` 指令来定义你希望日志去向。\n\
  \n### 将错误记录到文件\n\n文件参数指示错误日志文件的路径。如果路径是相对的，则假设相对于服务器根目录。默认情况下，错误日志文件位于 `logs` 目录，在\
  \ UNIX 上名为 `error_log`，在 Windows 上名为 `error.log`。以下是一个示例：\n\n```\nErrorLog logs/my_error_log\n\
  ```\n\n### 将错误记录到程序\n\n你可以指定程序的路径，并以管道 `|` 前缀。Apache 将错误记录到程序的标准输入，由程序进一步处理它们。以下是一个示例：\n\
  \n```\nErrorLog \"|/usr/local/bin/someprogram\"\n```\n\n### `syslog` 守护进程参数\n\n\
  在 UNIX 系统上，如果你指定 `syslog` 作为参数，可以将错误消息记录到 UNIX 系统日志守护进程 `syslogd`。默认情况下，错误被记录到 `syslog`。通过提供\
  \ `syslog:`facility 作为参数可以指定设施。syslog 设施示例包括 `mail`、`uucp`、`local0`、`local1` 等。完整列表请查看\
  \ `syslog` 文档。以下是记录到 syslog 的示例：\n\n```\nErrorLog syslog:local6\n```\n\nApache 提供的错误信息具有多个级别。你可以选择只记录重要消息而忽略次要消息。`LogLevel`\
  \ 指令接受一个错误级别参数。只有该级别或更高级别的错误会被记录。\n\n表 26.2 指定了 Apache 的有效值。默认情况下，LogLevel 的值为 `warn`。这对于大多数\
  \ Apache 安装都是足够的。如果你正在调试特定的配置，可以将级别改为 `debug`。\n\n**表 26.2 Apache 说明的 LogLevel 选项**\n\
  \n![image](img/26tab02.jpg)\n\n### 管理 Apache 日志\n\nApache 提供了多种管理日志的工具。这里还提到了其他\
  \ Apache 第三方工具。由于 Apache 可以以 CLF 格式记录请求，你也可以配合 Apache 使用通用日志工具。在本章之前，你学习了如何使用 `HostNameLookups`\
  \ 指令在处理请求时启用或禁用主机名解析。如果 `HostNameLookups` 设置为 `off`（默认值），日志文件仅包含 IP 地址。随后你可以使用 UNIX\
  \ 上的命令行工具 `logresolve` 或 Windows 上的 `logresolve.exe` 处理日志文件并将 IP 地址转换为主机名。\n\n`logresolve`\
  \ 工具从标准输入读取日志条目并将结果输出到标准输出。要从文件读取和写入，你可以在 UNIX 和 Windows 上使用重定向：\n\n```\nlogresolve\
  \ < access.log > resolved.log\n```\n\n这些工具非常高效，因为它们可以缓存结果，并且在为客户端提供服务时不会产生延迟。\n\n\
  ### 日志轮转\n\n对于流量大的网站，访问日志文件会迅速增大。你应该拥有一种机制定期对日志轮转，在定义的间隔内归档并压缩旧日志。\n\n在 Apache 运行时时不删除日志文件，因为服务器正在直接写入它们。解决方案是使用一个中间程序来记录请求。该程序反过来负责日志的轮转。\n\
  \n\n\n\nApache 在 UNIX 上提供了 `rotatelogs` 程序，在 Windows 上提供了 `rotatelogs.exe` 用于此目的。它接受三个参数：文件名、以秒为单位的滚动间隔，以及一个相对于\
  \ UTC（协调世界时）的可偏移分钟。\n\n### 示例\n\n点击此处查看代码图像\n\n```\nTransferLog \"|bin/rotatelogs\
  \ /var/logs/apachelog 86400\"\n```\n\n这会每天创建一个新的日志文件，并将当前日志移动到 `/var/logs` 目录。（命令末尾的\
  \ `86400` 是一天包含的秒数。）\n\n### 注意事项\n\n如果程序的路径包含空格，你可能需要通过在前面加上反斜杠 `\\` 来进行转义——例如，`My\\\
  \ Documents`。这在 Windows 平台上尤为常见。\n\n如果文件名包含以 `%` 前缀的选项，则该名称被视为 `strftime` 函数的输入，该函数会将\
  \ `%` 选项转换为时间值。`rotatelogs` 实用程序的帮助页面包含了完整的选项列表，但这里有一个示例：\n\n点击此处查看代码图像\n\n```\n\
  TransferLog \"|bin/rotatelogs /var/logs/apachelog%m_%d_%y 86400\"\n```\n\n此命令将当前的月份、日期和年份添加到日志文件名中。\n\
  \n如果名称不包含任何 `%` 格式的选项，则当前时间（秒）将被添加到存档文件的名称中。\n\n### 日志分析\n\n无论你只有一个服务器和日志文件，还是一个产生自己的日志文件的服务器集群，在收集日志后，你都可以对其进行分析并获取有关流量和访问者行为的信息。\n\
  \n有很多商业、共享软件和免费应用程序用于服务器日志分析和报告。两个流行的开源应用程序是 Webalizer ([http://www.mrunix.net/webalizer/])\
  \ 和 awstats ([http://awstats.sourceforge.net/])。\n\nWusage 是一个不错的、廉价商业替代方案，位于 [http://www.boutell.com/wusage/]。\n\
  \n### 监控错误日志\n\n如果你在 UNIX 系统上运行 Apache，可以使用 `tail` 命令行工具实时监控访问日志和错误日志中的条目。语法如下：\n\
  \n```bash\ntail -f logname\n```\n\n其中 `logname` 是 Apache 日志文件的路径。它会在屏幕上打印日志文件的最后几行，并在条目被添加到文件时继续打印。\n\
  \n你可以找到其他程序，它们通过扫描你的错误日志文件来识别特定错误、格式错误的请求等并对其进行报告，帮助你快速识别问题。ScanErrLog 就是其中一个程序；你可以在\
  \ [`www.librelogiciel.com/software/`](http://www.librelogiciel.com/software/) 找到它。\n\
  \n#### 将自定义信息到数据库\n\n在 MySQL 中创建你自己的日志表，并结合 PHP 代码段，可以帮助你捕捉网站特定页面的访问相关信息。使用这些信息，你可以创建自定义报告。这种方法比翻阅\
  \ Apache 日志文件要简单得多，特别是当你只需要搜索访问信息的子集时。以下章节概述了这一过程的简单版本。\n\n#### 创建数据库表\n\n你的自定义日志方法的第一步是创建数据库表。下面的创建表命令在你的\
  \ MySQL 数据库中创建一个名为 `access_tracker` 的表，包含 ID、页面标题、用户代理和访问日期的字段：\n\n点击此处查看代码图像\n\n\
  ```sql\nCREATE TABLE access_tracker (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    page_title VARCHAR(50),\n    user_agent TEXT,\n    date_accessed DATE\n);\n\
  ```\n\n接下来，你创建写入此表的代码段。\n\n#### 创建 PHP 代码段\n\n正如你可能已经收集到的，`code snippet` 仅仅意味着`一段代码`。换句话说，它不属于长脚本，只是为了一个简单的目的。在这种情况下，列表\
  \ 26.1 中的代码段向 `access_tracker` 表写入了一些基本信息。\n\n**列表 26.1** 用于访问跟踪的代码段\n\n点击此处查看代码图像\n\
