  \ ($myImage, 100, 100, 200, 150, 180, 360, $lt_blue, IMG_ARC_PIE);\n}\n```\n\n列表\
  \ 14.4 显示了用于 3D 饼图的代码。\n\n**列表 14.4** 3D 饼图\n\n点击此处查看代码图像\n\n* * *\n\n```php\n1:\
