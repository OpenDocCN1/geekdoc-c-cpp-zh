  \n列表 19.2 可能很长，但并不复杂。事实上，如果不是因为第 2 行包含了 `ch19_include.php` 中的用户自定义函数，它可能会更长。\n\n\
  第 4 行开始脚本的主逻辑。因为脚本执行了多个操作，你需要确定它正在尝试哪种操作。如果 `$_POST` 为 `false`，你就知道用户还没有提交表单；因此，你必须向用户显示表单。\n\
