  \n我们之所以将输出代码拆分为四个方法，而不是简单地创建一个代码块是什么？当我们构建一个类时，我们考虑了两种类型的程序员：一种是想要实例化 `date_pulldown`\
  \ 对象的程序员，另一类是想要通过子类化 `date_pulldown` 类来完善其功能的程序员。\n\n对于前者，我们希望为类的功能提供一个简单清晰的接口。程序员可以实例化对象、设置其日期并调用\
  \ `output()` 方法。对于后者，我们希望能够方便地更改类功能中的离散元素。如果将所有输出代码放在一个方法中，将迫使需要微调输出的子类去复制许多完全可用的代码。通过将这些代码拆分为离散的方法，我们允许子类在不干扰整体的情况下更改功能的有限方面。例如，如果子类需要将年份下拉列表表示为两个单选按钮，你只需要重写\
