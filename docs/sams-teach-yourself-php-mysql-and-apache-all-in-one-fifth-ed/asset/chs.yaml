  <?php\necho date('l tj'); //打印周二 3 号\n?>\n```\n\n### 其它字符串、日期和时间函数\n\nPHP 并不缺乏函数，特别是对于常见项目如字符串和日期。值得你书签手册中的章节：\n\
  \n- “字符串” [`www.php.net/manual/en/string.php`](http://www.php.net/manual/en/string.php)\n\
