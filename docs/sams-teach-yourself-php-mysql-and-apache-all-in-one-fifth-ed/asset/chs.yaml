  \n```php\n<?php\necho date('l tj'); //打印周二 3 号\n?>\n```\n\n另请注意，`date()` 函数根据你的时区返回信息。如果你想以\
  \ GMT 格式化日期，可以使用 `gmdate()` 函数，它的工作方式完全相同。\n\n#### 使用 `mktime()` 创建时间戳\n\n你已经可以获取有关当前时间的信息，但尚无法处理任意日期。`mktime()`\
  \ 返回一个时间戳，然后你可以将其与 `date()` 或 `getdate()` 使用。`mktime()` 接受最多六个整数参数，顺序如下：\n\n- 小时\n\
  - 分\n- 秒\n- 月\n- 日\n- 年\n\n代码列表 10.6 使用 `mktime()` 获取一个时间戳，然后将其用于 `date()` 函数。\n\
