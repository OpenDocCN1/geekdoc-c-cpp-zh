  \n### 注意\n\n函数的命名规则与变量的命名规则相似，你已经在 第 5 章 “PHP 的构建模块”中学习过这些。名称不能包含空格，并且必须以字母或下划线开头。与变量一样，你的函数名应当意义且风格统一。函数名的大小写是你可以为代码添加的一种风格点缀；在名称中使用混合大小（例如\
  \ `MyFunction()` 或 `handleDifficultTask()`）会让你的代码更容易阅读。你可能会听到这种命名约定被称为驼峰命名（CamelCase）或小驼峰命名（lower\
