  ## 读者服务\n访问我们的网站并在 [informit.com/register](http://informit.com/register) 注册本书，以便方便获取该书可能的任何更新、下载或错误说明。\n\
  \n## 引言\n欢迎阅读 *Sams Teach Yourself PHP, MySQL, and Apache All in One, Fifth Edition*。我很高兴地报告，PHP\
  \ 语言及其开发者和用户社区每天都在增长——因此需要对这本书进行更新。\n\n\n\n\n\n自本书上一版以来，`PHP 4` 的“生命终结”终于到来；在 `GoPHP5`\
  \ 计划的帮助下，网络托管提供商和应用程序开发者将他们的服务和代码从 `PHP 4` 特有的功能和编码实践迁移到了充满速度且功能集更强大的 `PHP 5` 世界。与上一版相同，本版中的所有代码均基于编写本书时可用的最新版本的\
  \ `PHP`（在本例中为 `5.4.0`）。\n\n你们中的某些人可能听说过 `PHP 6`，或者见过某些吹捧 `PHP 6` 为核心语言的书籍。事实上，一个名为\
  \ `PHP 6` 的语言版本从未出现——计划在版本 6 中发布的功能已分别添加到了 `PHP 5.3` 和 `PHP 5.4` 中。所以，不要担心；如果你听到\
  \ `PHP 6` 但在网上或 `PHP.net` 网站上找不到任何关于它的信息，说明你并没有错过了任何内容。\n\n在本书中，你将学习配置和管理 `Apache`\
  \ Web 服务器所需的概念、`PHP` 编程基础，以及使用和管理 `MySQL` 关系数据库系统的方法。本书的总目标是为你提供所需的基础，以理解这些技术是如何无缝集成在一起的，并让你获得有关如何将它们集成到功能完备的网站和应用程序中的实用知识。本书应该是迈向更高级网站开发的第一步——而不是唯一的一步。\n\
  \n### 谁应该读本书？\n\n本书面向对 Web 开发环境工作概念有一般理解的人，无论该环境是 `Linux/UNIX`、`Windows` 还是 `Mac\
  \ OS X`。安装和配置说明假设你熟悉自己的操作系统以及构建（在 `Linux/UNIX` 系统上）或安装（在 `Windows` 和 `Mac OS X`\
  \ 系统上）软件的基本方法。\n\n深入 `PHP` 编程的课程假设你对该语言没有任何基础。然而，如果你具有其他编程语言的经验，例如 `ASP`（Active\
  \ Server Pages）、`JSP`（Java Server Pages）、`Ruby` 或 `Perl`，由于你熟悉变量、控制结构、函数、对象等此类编程元素，你会发现学习过程容易得多。同样，如果你使用过其他数据库（如\
  \ `Oracle` 或 `Microsoft SQL Server`），你已经为学习 `MySQL` 相关课程奠定了坚实的基础。\n\n唯一的要求是你已经理解了如何使用\
  \ `HTML` 创建静态网页内容。如果你刚开始进入 Web 开发的大门，你仍然可以使用这本书，但你应该考虑先学习一遍 `HTML` 教程。如果你能熟练创建基础页面，那就没问题。\n\
  \n### 本书的组织结构\n\n本书分为六部分，对应于特定的主题组。你应该紧接着阅读每个部分中的章节，每章都建立在之前章节提供的信息之上：\n\n• **第一部分**，“[`快速上手与运行`，”提供了一个安装的快速入门指南，并带你深入完成\
  \ `MySQL`、`Apache` 和 `PHP` 的安装和配置。在继续后续之前，你需要至少完成这些指令中一个版本的说明——无论是快速启动安装还是较详细的说明——*除非你已经通过托管提供商获取了这些技术的运行中的安装版本*。即使你不需要在开发环境中安装和配置\
  \ `MySQL`、`Apache` 和 `PHP`，你仍然应该浏览这些课程，以便理解它们相互作用的基本知识。\n\n• **第二部分**，“[`PHP 语言结构`]”致力于教授你\
  \ `PHP` 语言的基础，包括数组和对象等结构性元素。示例将让你养成编写代码、将其上传到服务器并测试结果的习惯。\n\n• **第三部分**，“[`深入代码世界`]”由涵盖中级应用开发主题的章节组成，包括处理表单和文件、限制访问以及完成其他介绍特定概念的小型项目。\n\
  \n• **第四部分**，“[`PHP 与 MySQL 集成`]”包含了致力于通用数据库操作的章节，例如数据库规范化，以及使用 `PHP` 连接并操作 `MySQL`。其中包含了一个基础的\
  \ `SQL` 入门教程，其中还包含了 `MySQL` 特有的函数和其他信息。\n\n• **第五部分**，“[`基础项目`]”由使用 `PHP` 和 `MySQL`\
  \ 执行特定任务的章节组成，整合了目前获得的所有知识。项目包括地址录、讨论论坛和基础在线商店等。这些示例是在黑白环境下构建的，这意味着视觉显示是极简的。这使你专注于构建结构时涉及的编程和逻辑，而不是让这些项目在视觉上美观。\n\
  \n• **第六部分**，“[`管理与微调`]”致力于 `Apache` 和 `MySQL` 的管理和调优。它还包含了关于虚拟主机和设置安全 Web 服务器的信息。\n\
  \n如果你发现自己已经熟悉某个主题，可以跳到下一章。然而，在某些情况下，章节会引用之前章节中学习的特定概念，因此请注意，你可能需要浏览一下跳过的章节，以确保你的开发环境与本书保持一致。\n\
  \n在许多章节的末尾，有几个测验题来测试你对材料的学习程度。额外的活动提供了另一种应用章节中所学信息的方法，并引导你在下一章中使用这些新学到的知识。\n\n###\
  \ 关于本书的源代码\n\n章节列表中出现的所有代码都可以在随附的 CD-ROM 中获得。你也可以从作者的网站 `http://www.thickbook.com/`\
  \ 下载源码包。\n\n亲自输入代码可以获得产生拼写错误、导致错误以及执行令人厌烦的分号跟踪任务的宝用经验。然而，如果你想跳过这一节直接将运行的代码上传到你的网站，请尽管如此！\n\
  \n### 本书使用的约定\n\n本书使用不同的字体来区分代码和普通英语，并帮助你识别重要概念。在整个章节中，代码、命令以及你在屏幕上看到的文本将以`计算机字体`显示。新术语会在文中定义处以斜体出现。此外，图标伴随特殊信息块：\n\
  \n**注意**：注意提供了与当前主题相关的有趣信息。\n\n**提示**：提示提供了建议或教授执行任务更简单的方法。\n\n**警告**：警告你注意潜在的陷阱并解释如何避免它们。\n\
  \n# 第一部分：快速上手与运行\n\n## 第 1 章 使用 XAMPP 的安装快速启动指南\n\n万你想快速开始，本简短章节将带你通过全功能跨平台安装包 `XAMPP`\
  \ 完成安装。接下来的三个章节将分别解释如何从互联网获取并安装 `MySQL`、`Apache` 和 `PHP`，以便你可以确保你的版本是最新的。此外，接下来的三个章节还包含了关于每一步的扩展解释信息以及理解这些技术如何协同工作的其他重要信息。\n\
  \n\n\n\n你应该熟悉接下来的三个章节中每种技术的扩展信息。然而，如果你只是想在本地机器上*开始*进行工作，那也可以的。\n\n### 使用第三方安装包\n\
  \n第三方安装包是由除原始创建者以外的 la 或组织提供的程序包。在本章中，你将学习如何使用 XAMPP 安装包在操作系统（Linux/UNIX、Windows\
  \ 或 Mac）上同时安装 PHP、MySQL 和 Apache，无论你使用的是哪种操作系统（Linux/UNIX、Windows 或 Mac）。\n\n除了我多年作为\
  \ XAMPP 用户的经验外，我选择在这一章中使用它是因为它名称中的“X”：这个 X 表示它是 AMPP（或 Apache、MySQL、PHP 和 Perl）的跨平台安装版本。（Perl\
  \ 不是本书的主题，所以只需将其看作额外奖励即可。）\n\n针对 Apache、MySQL 和 PHP，还有两个非常好的其他第三方安装包，它们是针对特定操作系统的：\n\
  \n• **WAMP**——在 Windows 上安装 Apache、MySQL 和 PHP。更多信息请参阅 [`www.wampserver.com/`](http://www.wampserver.com/)。\n\
  \n• **MAMP**——在 Mac 上安装 Apache、MySQL 和 PHP。更多信息请参阅 [`www.mamp.info/`](http://www.mamp.info/)。\n\
  \n使用第三方安装包的一个潜在缺点是，封装在一起的核心技术版本总是落后几个修订版本。这是因为创建和测试捆绑包本身需要投入大量工作，以确保这些技术的最新版本之间不存在冲突；它还必须经过质量保证过程。然而，这个过程的优点是，当你使用捆绑的安装程序安装这些技术时，升级过程只需要运行新的安装程序——它会为你处理删除和更新所有文件。\n\
  \n接下来的三个部分描述了 XAMPP 的基本安装过程。你只需要阅读适用于你操作系统的章节。但是，请务必阅读本章末尾的“安全 XAMPP`；它适用于所有的操作系统。\n\
  \n### 在 Linux/UNIX 上安装 XAMPP\n\n尽管以下指令在 Ubuntu Linux 系统上测试过，但对于所有其他 Linux 或商业 UNIX\
  \ 发行版的默认安装，步骤都是相同的。如果你在编译过程中遇到意外的错误消息，请联系你的系统管理员或参考你特定操作系统的文档。\n\n如果你使用的是书中 CD-ROM\
  \ 包含的 XAMPP 版本，请以超级用户启动（或者登录 `root` 或从普通系统用户执行 `su`），并将 CD-ROM 挂载到文件系统的 `/mnt` 下：\n\
  \n点击此处查看代码图像\n\n```\nmount /dev/cdrom /mnt -t iso9660\n```\n\n现在你已经可以访问 CD-ROM 上的\
  \ XAMPP 文件，如果你已经从 [`www.apachefriends.org/en/xampp-linux.html`](http://www.apachefriends.org/en/xampp-linux.html)\
  \ 下载了最新版本，请继续特定的安装步骤。\n\n作为超级用户，将文件从 CD-ROM 上的 XAMPP 目录（或你的下载位置）复制到 `/opt` 目录。在\
  \ `/opt` 目录中，提取你下载的文件：\n\n点击此处查看代码图像\n\n```\ntar xvfz xampp-linux-VERSION-NUMBER.tar.gz\
  \ -C /opt\n```\n\n***\n\n注意\n\n本书编写时 XAMPP 的版本号为 1.8.0-beta2，因此文件名为 `xampp-linux-1.8.0-beta2.tar.gz`。后续版本将不同的文件名，请根据此调整命令。\n\
  \n***\n\n这将创建一个名为 `/opt/lampp` 的目录，XAMPP 安装在其中。要启动 XAMPP，首先切换到新目录：\n\n```\ncd lampp\n\
  ```\n\n执行以下命令启动 XAMPP（这将启动 Apache 和 MySQL）：\n\n```\n./lampp start\n```\n\n你将看到类似所示的消息：\n\
  \n点击此处查看代码图像\n\n```\nStarting XAMPP for Linux 1.8.0...\nXAMPP: Starting Apache with\
  \ SSL (and PHP5)...\nXAMPP: Starting MySQL...\nXAMPP: Starting ProFTPD...\nXAMPP\
  \ for Linux started.\n```\n\n要测试 Web 服务器是否正在运行，打开网页浏览器并输入 `http://localhost/xampp/index.php`。XAMPP\
  \ 服务的菜单应该显示，如图 1.1 所示。\n\n![image](img/01fig01.jpg)\n\n**图 1.1 XAMPP 菜单页面。**\n\n\
  就是如此；XAMPP 已经在你的机器上安装了 Apache、PHP 和 MySQL，当查看 http://localhost/xampp/index.php 时，你可以通过左侧列中的链接查看服务状态并阅读更多关于它的信息。\n\
  \n要停止 XAMPP 及其服务，你可以随时从命令行执行以下命令：\n\n```\n/opt/lampp/lampp stop\n```\n\n请务必阅读本章末尾的“安全\
  \ XAMPP`。\n\n### 在 Windows 上安装 XAMPP\n\n在 CD-ROM 上的 XAMPP 安装文件经过了测试，适用于 Windows。\n\
  \n要使用 XAMPP 安装文件，首先将 CD-ROM 插入电脑；如果你是从 [`www.apachefriends.org/en/xampp-windows`](http://www.apachefriends.org/en/xampp-windows)\
  \ 下载的该版本，双击文件启动安装程序。\n\n***\n\n注意\n\n由于 Windows 操作系统的细微差别以及可能安装的安全实践和程序，如果安装步骤进展不顺利，请访问\
  \ Windows 用户的 XAMPP FAQ [`www.apachefriends.org/en/faq-xampp-windows`](http://www.apachefriends.org/en/faq-xampp-windows)。\n\
  \n你首先会被要求选择语言；英语是默认。选择语言并点击 OK 按钮后，你将看到安装程序的欢迎界面，如图 1.2 所示。\n\n![image](img/01fig02.jpg)\n\
  \n**图 1.2 XAMPP 安装界面。**\n\n***\n\n本书时 XAMPP 版本号为 1.7.7，因此安装向导显示该数字。后续版本将不同的数字，但过程将相似。\n\
  \n***\n\n点击 Next 继续安装过程。与大多数向导安装一样，在进入下一步之前，你需要选择安装位置和一些安装选项。XAMPP 安装也不例外；你应该保持默认安装位置和默认安装选项并点击\
  \ Next 跳过每个屏幕。此时，安装过程本身发生，如图 1.3 所示。\n\n![image](img/01fig03.jpg)\n\n**图 1.3 XAMPP\
  \ 安装正在解压文件。**\n\n当安装过程完成后，安装程序会提示该状态；点击 Finish 完成安装。在 XAMPP 安装过程完全关闭之前，它会询问你是否启动管理已安装服务的控制面板，如图\
  \ 1.4 所示。\n\n![image](img/01fig04.jpg)\n\n**图 1.4 XAMPP 安装完成。**\n\n\n\n\nXAMPP 控制面板如图图\
  \ 1.5 所示，它可以允许你一键启动和停止运行在你的机器上的 Apache 和 `MySQL` 服务的进程。如果你只是为了开发目的而在本地机器上运行这些服务器进程，你可能只想在需要时才开启它们；控制面板允许你快速实现这一操作。\n\
  \n![image](img/01fig05.jpg)\n\n**图 1.5 XAMPP 控制面板。**\n\n要测试 Web 服务器是否正在运行，请打开浏览器并输入\
  \ `http://localhost/xampp/xampp.php`。XAMPP 服务菜单应该显示出来，如图图 1.6 所示。\n\n![image](img/01fig06.jpg)\n\
  \n**图 1.6 XAMPP 菜单页面。**\n\n就是这些；XAMPP 已经在你的机器上安装了 `Apache`、`PHP` 和 `MySQL`，在查看 `http://localhost/xampp`\
  \ 时，你可以通过左列的链接查看服务状态并阅读更多相关信息。\n\n请务必阅读本书末尾的“加固 XAMPP”，获取更多关于加固你的 XAMPP 机器的信息（即使仅用于开发）。\n\
  \n### 在 Mac OS X 上安装 XAMPP\n\n光盘随附的 XAMPP 安装文件已通过测试，适用于 Mac OS X 1.4 及更高版本。不支持更早的\
  \ Mac OS X 版本。\n\n要使用光盘中的 XAMPP 安装文件，请先将光盘插入你的 Mac；它应该会自动运行。如果没有自动运行，请双击 CD-ROM\
  \ 驱动器图标，并导航到包含 XAMPP 安装文件的目录。\n\n现在你已经有了光盘上的 XAMPP 文件，或者如果你已经从 [`www.apachefriends.org/en/xampp-mac.html`](http://www.apachefriends.org/en/xampp-mac.html)\
  \ 下载了最新版本，请双击 DMG 镜像。你将看到一个类似于图 1.7 所示的屏幕。\n\n![image](img/01fig07.jpg)\n\n**图 1.7\
  \ 在 Mac 上安装 XAMPP 的说明。**\n\n***\n\n注意\n\n编写时 Mac 用户的 XAMPP 版本号为 1.7.3，因此安装包显示该数字。后续版本会有不同的数字，但过程将类似。\n\
  \n***\n\n按照屏幕上的指令将 XAMPP 文件夹拖到 Applications（应用程序）文件夹。在文件夹和文件复制后，你可以在 `/Applications/XAMPP`\
  \ 文件夹中找到 XAMPP 控制面板的链接，如图图 1.8 所示。\n\n![image](img/01fig08.jpg)\n\n**图 1.8 找到 XAMPP\
  \ 控制面板的链接。**\n\n双击此链接启动 XAMPP 控制面板，通过它你可以启动和停止运行在你的机器上的 `Apache` 和 `MySQL` 服务进程。如果你只是为了开发目的而在本地机器上运行这些服务器进程，你可能只想在需要时才开启它们；控制面板允许你快速实现这一操作。\n\
  \n要测试 Web 服务器是否正在运行，请打开浏览器并输入 `http://localhost/xampp/index.php`。XAMPP 服务菜单应该显示出来，如图图\
  \ 1.9 所示。\n\n![image](img/01fig09.jpg)\n\n**图 1.9 XAMPP 菜单页面。**\n\n就是这些；XAMPP 已经在你的机器上安装了\
  \ `Apache`、`PHP` 和 `MySQL`，在查看 `http://localhost/xampp/index.php` 时，你可以通过左列的链接查看服务状态并阅读更多相关信息。\n\
  \n请务必接下阅读“加固 XAMPP”，获取更多关于加固你的 XAMPP 机器的信息（即使仅用于开发）。\n\n### 加固 XAMPP\n\nXAMPP 的主要目的是为开发环境中的\
  \ `Apache`、`MySQL` 和 `PHP` 提供一种快速方便的安装方法。这种快速方便安装的权衡之一是某些安全设置是不完整的——或者说，至少由用户来决定它们是否足够重要而需要设置。\n\
  \n直接使用（虚拟）开箱即用的安装版本，以下是一些潜在的安全问题：\n\n- `MySQL` 管理员用户没有密码。（可以使用空密码。）\n- `MySQL` 和\
  \ `Apache` 以相同的用户运行（nobody；仅适用于 Linux/UNIX 和 Mac）。\n- 除非你专门通过个人防火墙禁止了访问，否则某些服务可以被网络访问。\n\
  \n然而，XAMPP 为每个操作系统都提供了一个实用程序，你可以运行它并按照步骤即使在开发环境中加固你的 XAMPP 系统，具体如下：\n\n- 在 Linux/UNIX\
  \ 上，在命令行中输入以下内容运行实用程序：\n\n```bash\n# /opt/lampp/lampp security\n```\n\n- 在 Windows\
  \ 上，导航到 `http://localhost/xampp/index.php` 并打开安全台。\n\n- 在 Mac 上，打开终端并输入以下：\n\n```bash\n\
  # /Applications/xampp/lampp security\n```\n\n### 故障排除\n\n本章中的步骤已针对光盘版本通过测试。如果你遇到安装问题，请先检查是否完全按照本章的步骤操作。然后，检查\
  \ XAMPP 网站 [`www.apachefriends.org/`](http://www.apachefriends.org/)。\n\n如果这些过程仍然不起作用，并且你想尝试其他合一安装包，可以尝试\
  \ WAMP 和 MAMP（在本章开头提到）。\n\n## 第 2 章 安装和配置 MySQL\n\n***\n\n在本章中，你将学习以下内容：***\n\n\
  - 如何安装 `MySQL`\n- 运行 `MySQL` 的基本安全指南\n- 如何使用 `MySQL` 用户权限系统***\n\n这是设置开发环境三个安装相关章节中的第一个。我们首先处理\
  \ `MySQL` 安装是因为在某些系统中，如果在 `PHP` 中使用 `MySQL`，则需要构建一些模块的一部分。\n\n### MySQL 的当前和未来版本\n\
  \n本章中的安装说明指的是 `MySQL` 社区版 5.5.21，该软件的当前生产版本。此版本号可以读作“主版本 5 的小版本 5 的修订号 21”。修订版本和小版本并不遵循固定的发布计划。当代码中增加了增强或修复并经过彻底测试时，就会发布具有新修订号或小版本号的版本。\n\
  \n当你购买本书时，版本号可能已变为 5.5.22 或更高。如果是这样，请阅读 [`dev.mysql.com/doc/refman/5.5/en/news-5-5-x.html`](http://dev.mysql.com/doc/refman/5.5/en/news-5-5-x.html)\
  \ 中的列表以了解任何安装/配置过程的变化。这些过程构成了本章的大部分。\n\n\n\n\n\nMySQL AB 是开发、维护和发行 MySQL 数据库服务器的公司名称；通过一系列收购（太阳微型系统收购了\
  \ MySQL AB，甲骨文公司收购了太阳微型系统），数据库巨头 Oracle 现在拥有了 MySQL。然而，该软件的 MySQL 社区版仍然开源，由开源开发人员支持，并可以在\
  \ MySQL 网站 [`www.mysql.com/`](http://www.mysql.com/) 免费获取。适用于所有平台的二进制发行版、适用于 Mac\
  \ OS X 的安装包，以及适用于 Linux/UNIX 平台的 RPM 包和源码文件均可获得。\n\n## Note\nLinux 和 Mac OS X 发行版通常包含某个版本的开源\
  \ MySQL 软件，尽管这些版本通常比当前发布版后几个修订或次要版本。\n\n本章的安装说明基于官方的 MySQL 5.5.x 社区版发行版。你可以从 [`dev.mysql.com/downloads/mysql/5.5.html`](http://dev.mysql.com/downloads/mysql/5.5.html)\
  \ 下载所有文件，并且可以在随书附带的 CD 中找到截至本文编写的所有版本。\n\n### 在 Linux/UNIX 上安装 MySQL\n在 Linux/UNIX\
  \ 上安装 MySQL 的过程非常简单，无论你是使用 RPM 包还是安装二进制文件。如果你通过 RPM 安装，会有针对特定平台的 RPM 包，例如适用于 SuSE\
  \ 以及运行在不同处理器类型（如 x86 32 位和 64 位）上的通用 Linux 的 RPM。\n\n要从 RPM 进行极简安装，你需要从 [`dev.mysql.com/downloads/mysql/5.5.html`](http://dev.mysql.com/downloads/mysql/5.5.html)\
  \ 下载页面获取两个文件（或从随书附带的 CD-ROM 获取）：\n\n• `MySQL-server-type-VERSIONNUMBER.PLATFORM.rpm`——MySQL\
  \ 服务器\n• `MySQL-client-type-VERSIONNUMBER.PLATFORM.rpm`——标准 MySQL 客户端库\n\n要从 RPM\
  \ 执行极简安装，请在提示符处输入以下命令：\n\n点击此处查看代码图像\n\n```\nrpm -i MySQL-server-VERSION.i386.rpm\
  \ MySQL-client-VERSION.i386.rpm\n```\n\n## Note\n将文件名中的 `VERSIONNUMBER` 替换为你下载的实际版本，并将\
  \ `PLATFORM` 替换为你正在使用的平台短名称。例如，适用于通用 Linux 发行版的当前 MySQL 5.5 服务器 RPM 为 `MySQL-server-5.5.21-1.linux2.6.i386.rpm`，客户端库\
  \ RPM 为 `MySQL-client-5.5.21-1.linux2.6.i386.rpm`。\n\n如果要从 Debian 包安装，你需要从 [`dev.mysql.com/downloads/mysql/5.5.html`](http://dev.mysql.com/downloads/mysql/5.5.html)\
  \ 下载页面获取 `*.deb` 文件（或从随书附带的 CD-ROM 获取）。然后在提示符处输入以下命令：\n\n点击此处查看代码图像\n\n```\ndpkg\
  \ -i mysql-VERSION-debian6.0-i686.deb\n```\n\n另一种无痛（且非常常见）的安装方法是从二进制发行版安装 MySQL。这种方法需要\
  \ `gunzip` 和 `tar` 工具来解压缩和解包发行版，并且还需要在系统上创建组和用户的能力。二进制发行版安装过程中的第一系列命令将让你添加一个组和一个用户并解包发行版，如下：\n\
  \n点击此处查看代码图像\n\n```\ngroupadd mysql\nuseradd –r -g mysql mysql\ncd /usr/local\n\
  tar zxvf /path/to/mysql-VERSION-PLATFORM.tar.gz\n```\n\n## Note\n将文件名中的 `VERSION-PLATFORM`\
  \ 替换为你下载的实际版本。例如，当前的 MySQL 5.5 通用 Linux 二进制文件为 `mysql-5.5.21-1-linux2.6.i386.tar`。\n\
  \n接下来，指令让你创建一个较短的符号链接：\n\n```\nln -s mysql-VERSION-PLATFORM mysql\ncd mysql\n```\n\
  \n在解包后，`README` 和 `INSTALL` 文件将引导你完成所选 MySQL 版本的剩余的安装过程。通常情况下，会使用以下系列命令：\n\n点击此处查看代码图像\n\
  \n```\nscripts/mysql_install_db --user=mysql\nchown -R root .\nchown -R mysql mysql_data\n\
  chgrp -R mysql .\nbin/mysqld_safe --user=mysql &\n```\n\n你现在已准备好启动 MySQL 服务器，因此请跳到本章的“基本安全指南”部分学习如何添加密码和用户。如果你在安装过程中遇到任何问题，请检查“排查你的安装中的问题”部分。\n\
  \n### 在 Mac OS X 上安装 MySQL\nMac OS X 的 MySQL 安装过程非常简单——有一个适用于 Mac OS X 的安装包。前往 [`dev.mysql.com/downloads/mysql/5.5.html`](http://dev.mysql.com/downloads/mysql/5.5.html)\
  \ MySQL 下载页面并选择 Mac OS X。\n\n\n\n\n\n访问 [MySQL 下载页面](http://dev.mysql.com/downloads/mysql/5.5.html)(http://dev.mysql.com/downloads/mysql/5.5.html)\
  \ 并从下拉菜单中选择 Windows 选项。下载适用于系统（32 位或 64 位）的 Windows MSI 安装程序文件。当文件下载完成（或从本书的 CD-ROM\
  \ 光盘中复制）后，双击该文件开始安装过程。\n\n以下步骤详细介绍了在 Windows 7 上安装 MySQL 5.5.21 的具体方法；无论您的 Windows\
  \ 环境如何，安装序列都遵循相同的步骤。\n\n***\n\n### 注意\n\nWindows 用户也可以 ZIP 归档版本。如果您想安装 ZIP 归档版本，请务必阅读\
  \ [MySQL 手册](http://dev.mysql.com/doc/refman/5.5/en/windows-choosing-package.html)(http://dev.mysql.com/doc/refman/5.5/en/windows-choosing-package.html)\
  \ 中的描述和说明。\n\n***\n\n### 安装序列\n\n直接进入安装序列，请按照以下步骤操作：\n\n1. **双击 `*.msi` 文件以开始安装序列。**\
  \ 您将看到 MySQL 安装向导的第一个界面，如图 2.5 所示。点击 Next（下一步）继续。\n\n![image](img/02fig05.jpg)\n\
  \n**图 2.5 Windows MySQL 安装向导的第一步。**\n\n2. **同意条款和条件后，系统会要求您选择安装类型——典型（Typical）、自定义（Custom）或完整（Complete）（参见图\
  \ 2.6）。自定义选项允许您选择要安装的 MySQL 组件，而完整选项会安装所有的 MySQL 组件，范围从文档到基准测试套件应有包含。典型安装方法适用于大多数用户，因为它包含了客户端、服务器以及用于常规管理\
  \ MySQL 安装的众多工具。选择“典型”作为安装方法并点击 Next（下一步）继续。**\n\n![image](img/02fig06.jpg)\n\n\
  **图 2.6 选择安装类型。**\n\n3. **在下一个屏幕中确认您的选择并点击 Install（安装）按钮继续。** 安装程序将接管并将文件安装到相应的位置。\n\
  \n4. **当安装完成后，您可以选择继续进入 MySQL 实例配置向导。** 强烈建议使用此向导，因为它会根据您的特定需求创建一个自定义的 `my.ini`\
  \ 文件。要继续 MySQL 实例配置向导，请勾选 Launch the MySQL Instance Configuration Wizard（启动 MySQL\
  \ 实例配置向导）框并点击 Finish（完成）按钮，如图 2.7 所示。\n\n![image](img/02fig07.jpg)\n\n**图 2.7 MySQL\
  \ 已安装。现在继续进入 MySQL 实例配置向导。**\n\n5. **当看到 MySQL 实例配置向导欢迎界面时，点击 Next（下一步）按钮进入向导的下一步。**\
  \ 您将看到两种服务器配置选项：详细（Detailed）和标准（Standard）。我们使用详细配置选项，以便您可以查看所有可用的选项。如果您决定选择标准配置选项，则必须手动修改生成的\
  \ `my.ini` 文件。\n\n6. **下一步确定 MySQL 配置的类型，如图 2.8 所示。**\n\n![image](img/02fig08.jpg)\n\
  **图 2.8 选择服务器类型。**\n\n7. **下一个配置选项涉及磁盘使用情况，如图 2.9 所示。**\n\n![image](img/02fig09.jpg)\n\
  **图 2.9 调整磁盘使用。**\n\n8. **下一步确定并发连接的数量。**\n\n9. **接下来是网络选项（Networking Options）屏幕。**\n\
  \n10. **网络选项之后是字符集选项。**\n\n11. **最后一步涉及将 MySQL 配置为服务。**\n\n\n\n\n\n### 13. 安全选项（Security\
  \ Options）配置界面是所有界面中最重要的。如图 2.10\n\n**图 2.10 在 MySQL 配置期间为 root 创建密码。**\n\n### 14.\
  \ 配置序列还剩最后一步，即点击 `Execute` 按钮启动进程。在向导完成各种配置步骤后，你将看到一个确认界面，如图 2.11\n\n**图 2.11 MySQL\
  \ 配置向导完成任务。**\n\n安装和配置向导的完成将产生一个运行中的 MySQL 服务以及 `C:\\Program Files\\MySQL\\MySQL\
  \ Server 5.5\\` 目录下的自定义 `my.ini` 文件。\n\n> 提示\n你可以使用任何文本编辑器手动编辑 `my.ini` 文件。进行更改后，必须重启\
  \ MySQL 服务器。\n\n现在 MySQL 已经启动，请跳到本章后后的“基础安全指南”部分。如果你在安装过程中遇到任何问题，请检查“排除安装故障”部分。\n\
  \n### 排除安装故障\n\n如果你在安装 MySQL 期间遇到任何问题，你应该首先查看的地方是 MySQL 手册中的附录 A，“问题与常见错误”，地址位于\
  \ [`dev.mysql.com/doc/refman/5.5/en/problems.html`](http://dev.mysql.com/doc/refman/5.5/en/problems.html)。\n\
  \n以下是一些常见安装问题之一：\n\n- 在 Linux/UNIX 和 Mac OS X 上，权限不正确将导致你无法启动 MySQL 进程。如果是这种情况，请确保已更改所有者和组以匹配安装说明中指定的内容。\n\
  - 如果在连接 MySQL 时看到 `Access denied` 消息，请确保你使用的是正确的用户名和密码。\n- 如果看到 `Can't connect to\
  \ server` 消息，请确保 MySQL 进程正在运行。\n\n如果在阅读了 MySQL 手册中的附录 A 后仍然遇到困难，向 MySQL 邮件列表发送电子邮件（更多信息请参见\
  \ [`lists.mysql.com/`](http://lists.mysql.com/)）可能会有所结果。你也可以从 MySQL AB 购买支持合同。\n\
  \n### 基础安全指南\n\n无论你是在 Windows、Linux/UNIX 还是 Mac OS X 上运行 MySQL，无论你是自己管理服务器还是使用互联网服务提供商提供的系统，你都必须理解基础安全指南。如果你通过互联网服务提供商访问\
  \ MySQL，作为非 root `user`，有几个服务器安全方面是你是不应该能够修改或绕过的。遗憾的是，许多互联网服务提供商并不重视安全指南，导致其客户暴露在风险之中——而且大多数情况下并不知道这些风险。\n\
  \n#### 启动 MySQL\n\n确保 MySQL 开始于服务器启动程序。如果你不是服务器管理员，你无法更改此设置，但你完全可以检查并向你的互联网服务提供商报告漏洞。\n\
  \n如果你的 MySQL 安装在 Linux/UNIX 或 Mac OS X 上，你主要关注的 MySQL 进程的所有者——它不应为 `root`。以非 root\
  \ `user`（如 `mysql` 或 `database`）运行进程可以限制恶意人员访问服务器并覆盖文件的能力。\n\n> 提示\n你可以在 Linux/UNIX\
  \ 或 Mac OS X 系统上使用 `ps`（进程状态）命令来验证进程的所有者。\n\n如果你发现系统上的 MySQL 以 `root` 身份运行，请立即联系你的互联网服务提供商并投诉。如果你是服务器管理员，应该以非\
  \ root `user` 启动 MySQL 进程，或者在启动命令行中指定首选用户名：\n\n```\nmysqld --user=non_root_user_name\n\
  ```\n\n例如，如果你想以用户 `mysql` 运行 MySQL，请使用此命令：\n\n```\nmysqld --user=mysql\n```\n\n\
  然而，启动 MySQL 的推荐方法是通过 MySQL 安装 `bin` 目录下的 `mysqld_safe` 启动脚本：\n\n```\nbin/mysqld_safe\
  \ --user=mysql &\n```\n\n#### 安全你的 MySQL 连接\n\n你可以通过多种方式连接到 MySQL 监控器（命令行界面）或其他\
  \ MySQL 应用程序，每种方式都有自己的安全风险。如果 MySQL 安装在你自己的工作站上，与那些必须通过网络连接服务器的用户相比，你的担心会少很多。\n\n\
  如果 MySQL 安装在工作站上，你最大的安全担忧是离开工作站时让 MySQL 监控器或 MySQL GUI 管理工具处于运行。在这种情况下，任何人都可以走过来删除数据、插入虚假数据或关闭服务器。如果你必须在公共区域离开工作站，请使用带有密码的屏幕保护程序或锁屏机制。\n\
  \n如果 MySQL 安装在网络外的服务器上，连接的安全应该是关注点。与通过互联网传输的任何数据一样，数据可能会被拦截。如果传输未加密，拦截数据的人可以组合并使用这些信息。防止这种情况发生的方法之一是通过安全连接（如\
  \ Secure Shell (SSH)）连接 MySQL，所有与远程机器之间的传输都是加密的。同样，如果你使用基于 Web 的管理界面，例如强烈推荐的 phpMyAdmin（更多信息请参见\
  \ [`www.phpmyadmin.net/`](http://www.phpmyadmin.net/)，并注意 phpMyAdmin 是作为第 1 章“基于\
  \ XAMPP 的快速上手安装指南”或你互联网服务提供商使用的工具的一部分安装的），通过安全的 HTTP 连接访问该工具。\n\n在下一节中，你将学习 MySQL\
  \ 权限系统，它有助于进一步保护你的数据库。\n\n### 引入 MySQL 权限系统\n\nMySQL 权限系统始终开启。在第一次尝试连接时以及随后的每个操作中，MySQL\
  \ 都会检查以下三点：\n\n- 你从哪里访问（你的主机）\n- 你说你是谁（你的用户名和密码）\n- 你被做什么（你的命令权限）\n\n所有这些信息都存储在名为\
  \ `mysql` 的数据库中，该数据库在安装 MySQL 时自动创建。`mysql` 数据库中有几个与权限相关的表，例如：\n\n- `columns_priv`\
  \ 定义表内特定字段的用户权限\n- `db` 定义服务器上所有数据库的权限\n- `host` 定义允许连接到特定数据库的主机\n- `procs_priv`\
  \ 定义针对存储过程的用户权限\n- `tables_priv` 定义特定数据库内特定表的权限\n- `user` 定义针对特定用户的命令权限\n\n\n\n\n\
  在本章的后续部分，当你向 MySQL 添加一些用户时，这些表将对你变得更加重要。现在，只需记住这些表是存在的，并且它们必须包含相关数据，用户才能完成操作。\n\n\
  ## 理解两步验证过程\n\n正如你所学到的，MySQL 在验证过程中会检查三项内容。与这三项相关的操作分两步执行：\n\n1. MySQL 查看你连接的主机以及你使用的用户名和密码对。如果你的主机允许连接，密码对你的用户名是正确的，且用户名与分配给该主机的用户名匹配，MySQL\
  \ 将进入第二步。\n\n2. 对于你尝试使用的任何 `SQL` 命令，MySQL 都会验证你的用户是否有权限对该数据库、表和字段执行该操作。\n\n如果步骤\
  \ `1` 失败，你将看到相关的错误信息且无法继续执行步骤 `2` 。例如，假设你使用用户名 `joe` 和密码 `abc123` 连接到 MySQL，并想要访问名为\
  \ `myDB` 的数据库。如果由于以下原因导致任何连接变量不正确，你将收到错误消息：\n\n- 你的密码错误。\n- 用户名 `joe` 不存在。\n- 用户\
  \ `joe` 无法从 `localhost` 连接。\n- 用户 `joe` 可以从 `localhost` 连接，但无法使用 `myDB` 数据库。\n\n\
  你可能会看到如下错误：\n\n点击此处查看代码图片\n\n```\nmysql -h localhost -u joe -pabc123 test\n\nError\
  \ 1045: Access denied for user: 'joe@localhost' (Using password: YES)\n```\n\n如果密码为\
  \ `abc123` 的用户 `joe` 被允许从 `localhost` 连接到 `myDB` 数据库，MySQL 将在过程的步骤 `2` 中检查 `joe`\
  \ 可以执行的操作。为了我们的目的，假设 `joe` 被允许查询数据但不允许插入数据。事件和错误的发生顺序如下：\n\n点击此处查看代码图片\n\n```\n\
  mysql -h localhost -u joe -pabc123 test\n\nReading table information for completion\
  \ of table and column names\n\nYou can use -A 关闭此功能以获得更快的启动\n\nWelcome to the MySQL\
  \ monitor.  Commands end with ; or \\g.\n\nYour MySQL connection id is 12 to server\
  \ version: 5.5.21-log\n\nType 'help;' or '\\h' for help. Type '\\c' to clear the\
  \ buffer.\n\nmysql> SELECT * FROM test_table;\n\n+----+------------+\n| id | test_field\
  \ |\n+----+------------+\n|  1 | blah       |\n|  2 | blah blah  |\n+----+------------+\n\
  2 rows in set (0.0 sec)\n\nmysql> INSERT INTO test_table VALUES ('', 'my text');\n\
  \nError 1044: Access denied for user: 'joe@localhost' (Using password: YES)\n```\n\
  \n基于操作的权限在具有多个管理级别的应用程序中很常见。例如，如果你创建了一个包含个人财务数据的应用程序，你可能只向初级员工授予 `SELECT` 权限，但向具有安全权限的执行级员工授予\
  \ `INSERT` 和 `DELETE` 权限。\n\n在大多数通过互联网服务提供商访问 MySQL 的情况下，你只有一个用户和一个数据库可用。默认情况下，该用户拥有访问该数据库中所有表的权限，并允许执行所有命令。在这种情况下，作为开发者的你的责任是通过编程编程创建一个安全的应用程序。\n\
  \n然而，如果你是你自己服务器的管理员，或者你的互联网服务提供商允许你添加任意数量的数据库和用户并修改用户的访问权限，你可以按照后续小节所述的方法进行。\n\n\
  ## 向 MySQL 添加用户\n\n通过第三方应用程序管理服务器可能为你提供一种使用向导式过程或图形界面添加用户的简单方法。然而，通过 MySQL 监控器添加用户并不困难，特别是如果你理解你刚刚学到的\
  \ MySQL 安全检查点。\n\n添加新用户最简单的方法是使用 `GRANT` 命令。通过以 `root` 用户身份连接 MySQL，你可以发布一个命令来设置新用户。另一种方法是在\
  \ `mysql` 数据库中的所有相关表中发布 `INSERT` 语句，这要求你了解用于存储权限的表中的所有字段。这种方法同样有效，但比简单的 `GRANT`\
  \ 命令更复杂。`GRANT` 命令的简单语法所示：\n\n```\nGRANT privileges\nON databasename.tablename\n\
  TO username@host\nIDENTIFIED BY \"password\";\n```\n\n以下你可以授予的一些常用权限。（如需完整列表，请参阅\
  \ MySQL 手册中的 `GRANT` 条目：[`dev.mysql.com/doc/refman/5.5/en/grant.html`](http://dev.mysql.com/doc/refman/5.5/en/grant.html)）\n\
  \n- `ALL`—赋予用户所有常用权限。\n- `ALTER`—用户可以更改（修改）表、列和索引。\n- `CREATE`—用户可以创建数据库和表。\n- `DELETE`—用户可以删除表中的记录。\n\
  - `DROP`—用户可以删除（移除）表和数据库。\n- `FILE`—用户可以读取和写入文件；此权限用于导入或转储数据。\n- `INDEX`—用户可以添加或删除索引。\n\
  - `INSERT`—用户可以向表中添加记录。\n- `PROCESS`—用户可以查看和停止进程。\n- `RELOAD`—用户可以执行 `FLUSH` 语句。\n\
  - `SELECT`—用户可以从表中查询记录。\n- `SHUTDOWN`—用户可以关闭服务器。\n- `UPDATE`—用户可以更新（修改）表中的记录。\n\n\
  例如，你想创建一个密码为 `abc123` 的用户 `joe`，并对 `myDB` 数据库中的所有表授予 `SELECT` 和 `INSERT` 权限，你想让该用户从任何主机连接，请使用此命令：\n\
  \n```\nGRANT SELECT, INSERT\nON myDB.*\nTO joe@\"%\"\nIDENTIFIED BY \"abc123\";\n\
  ```\n\n注意通配符 `*` 和 `%`。通配符代表值。在此示例中，`*` 代表整个表列表，`%` 代表主机列表。\n\n这是另一个使用 `GRANT` 命令添加用户的示例，这次是为密码为\
  \ `45sd11` 的用户 `jane` 授予 `myCompany` 数据库中 `employees` 表的 `ALL` 权限。该用户只能从特定的主机连接：\n\
  \n```\nGRANT ALL\nON myCompany.employees\nTO jane@janescomputer.com\nIDENTIFIED\
  \ BY \"45sd11\";\n```\n\n如果你知道 `janescomputer.com` 的 IP 地址为 `63.124.45.2`，你可以在命令的主机部分替换该地址，如下：\n\
  \n```\nGRANT ALL\nON myCompany.employees\nTO jane@63.124.45.2\nIDENTIFIED BY \"\
  45sd11\";\n```\n\n关于添加用户的一点：始终使用密码，并确保密码是足够安全的！\n\n如果你使用 `GRANT` 命令添加用户，更改将立即生效。为了绝对确保这一点，你可以在\
  \ MySQL 监控器中执行 `FLUSH PRIVILEGES` 命令来重新加载权限表。\n\n## 移除用户权限\n\n移除权限与添加一样简单；不是使用 `GRANT`\
  \ 命令而是使用 `REVOKE`。`REVOKE` 命令语法如下：\n\n```\nREVOKE privileges\nON databasename.tablename\n\
  FROM username@hostname;\n```\n\n正如可以使用 `INSERT` 命令授予权限一样，你也可以通过发布 `DELETE` 命令从 `mysql`\
  \ 数据库删除记录来撤销权限。然而，这要求你熟悉字段和表，使用 `REVOKE` 要简单安全得多。\n\n要移除用户 `john` 在 `myCompany`\
  \ 数据库中执行 `INSERT` 操作的能力，你需要执行此 `REVOKE` 语句：\n\n```\nREVOKE INSERT\nON myCompany.tablename\n\
  FROM john@hostname;\n```\n\n\n\n对权限表中数据的更改会立即生效，但为了让服务器感知到更改，请在 MySQL 监器中执行 `FLUSH\
  \ PRIVILEGES` 命令。\n\n### 总结\n\n得益于基于向导的安装方法，在 Windows 和 Mac OS 上安装 MySQL 是一个简单的过程。Linux/UNIX\
  \ 用户没有向导式的安装过程，但遵循一组简单的命令来解压 MySQL 客户端和服务器二进制文件并不困难。Linux/UNIX 用户也可以使用 RPM 进行安装。\n\
  \n安全始终是重中之重，你可以采取几个步骤来确保 MySQL 安装的安全与可靠。即使你不是服务器的管理员，也应该能够识别安全漏洞，并向服务器管理员反映。\n\n\
  MySQL 服务器永远不要以 `root` 用户身份运行。此外，MySQL 内部的命名用户应该始终拥有密码，并且它们的访问权限应该经过良好的定义。\n\nMySQL\
  \ 在处理每个请求时都会通过一个两步过程使用权限表。MySQL 需要知道你是谁以及你从哪里连接，这些信息中的每个部分必须与其权限表中的条目匹配。此外，你所使用的身份用户必须具有执行你正在进行的请求类型所需的特定权限。\n\
  \n你可以使用 `GRANT` 命令添加用户权限，该命令使用简单的语法向 `mysql` 数据库中的 `user` 表添加条目。`REVOKE` 命令同样简单，用于移除这些权限。\n\
  \n### 问答\n\n**Q. 如何完全删除一个用户？`REVOKE` 命令仅消除了权限。**\n\n**A.** 要要从权限表中完全删除一个用户，你必须从\
  \ `mysql` 数据库的 `user` 表中执行特定的 `DELETE` 查询。\n\n**Q. 如果我告诉我的互联网服务提供商停止以 root 身份运行\
  \ MySQL，但他们拒绝了怎么办？**\n\n**A.** 更换供应商。如果你的互联网服务提供商不认为以 `root` 用户身份运行数据库这样重要的程序存在风险，并且不听取你的请求，请寻找其他供应商。有些供应商的方案低至每月\
  \ 2.95 美元（甚至免费），他们不会以 `root` 用户身份运行重要进程。\n\n### 工作坊\n\n本工作坊旨在帮助你回顾所学内容，并开始将知识付诸实践。\n\
  \n### 测验\n\n**1.** 正确或错误：SSH 是从远程主机安全连接到 MySQL 的完全可以的方法。\n\n**2.** MySQL 在每次发出请求时会检查哪三项信息？\n\
  \n**3.** 你会使用什么命令为 `localhost` 上名为 `bill` 的用户授予 `BillDB` 数据库中所有表的 `SELECT`、`INSERT`\
  \ 和 `UPDATE` 权限？此外，该语句中缺少了什么出于安全目的建议的信息？\n\n### 答案\n\n**1.** 正确。SSH 加密了主机之间的数据，因此使你能够安全地连接到服务器。\n\
  \n**2.** 你是谁、你从何处访问、以及你被允许执行哪些操作。\n\n**3.** 命令如下：\n\n```\nGRANT SELECT, INSERT,\
  \ UPDATE\nON BillDB.*\nTO bill@localhost;\n```\n\n缺失的重要部分是用户的密码。\n\n### 活动\n\n**1.**\
  \ 想想你可能想要在表级别限制命令访问的情况。例如，你不会希望实习级管理员拥有公司数据库的关机权限。\n\n**2.** 如果你在 MySQL 中拥有管理权限，执行几个\
  \ `GRANT` 命令来创建虚拟用户。你命名的表和数据库实际上是否存在并不重要。\n\n**3.** 使用 `REVOKE` 移除你在活动 2 中创建的用户的某些权限。\n\
  \n## 第 3 章 安装与配置 Apache\n\n在本章中，你将学习到以下内容：\n\n- 如何安装 Apache 服务器\n- 如何对 Apache 进行配置更改\n\
  - Apache 日志和配置文件存储在什么位置\n\n在本章中，你将安装 Apache Web 服务器并熟悉其主要组件，包括日志和配置文件。\n\n### Apache\
  \ 的当前和未来版本\n\n[`httpd.apache.org`](http://httpd.apache.org)  Apache HTTPD 服务器网站显示了\
  \ Apache 2.0.x、Apache 2.2.x 和 Apache 2.4.x 版本的发布公告。你可以从版本号理解，Apache 2.0.x 是这三个版本中最旧的。Apache\
  \ 软件基金维护所有三个版本，但 Apache 2.4.x 中的功能包含了最新且最特性；它是本章中使用的版本。然而，如果你选择安装（或已经在本地或外部开发环境中安装了）Apache\
  \ 2.2.x 甚至 Apache 2.0.x，书中的所有 PHP 和 MySQL 代码仍将按照描述正常工作。事实上，你会发现许多托管提供商在使用 Apache\
  \ 2.0.x——甚至不是 Apache 2.2.x，更不用说最新的 Apache 2.4.x 分支。如果你在安装过程中遇到任何问题，请检查变更日志。\n\n\
  Apache 软件基金使用小版本和修订号进行包含安全修复的更新。小版本或修订发布不遵循固定计划。当增强或修复被添加到代码中并经过充分测试时，Apache 软件基金会发布新版本。\n\
  \n当你购买此书时，版本号可能已变为 2.4.1。如果是，请阅读 [`httpd.apache.org/download.cgi`](http://httpd.apache.org/download.cgi)\
  \ 下载区域提供的变更列表，以获取任何安装更改。这些过程构成了本章的主要内容。\n\n尽管在版本更新之间安装指令可能会更改，但请始终检查你安装和维护的软件的变更日志。如果在阅读本书期间发生了小版本或修订更改，但变更日志未说明安装更改，只需在心中并在出现的地方替换新版本号即可。\n\
  \n### 选择合适的安装方法\n\n在建立基础 Apache 安装方面，你有多种选择。Apache 是开源的，这意味着你可以访问软件的完整源代码，从而使你能够构建自己的自定义服务器。此外，大多数现代\
  \ UNIX 平台都有预编译的 Apache 二进制发行版。最后，Apache 已经包含在各种 Linux 发行版中，你甚至可以从供应商购买带有软件包的商业版本。本章中的示例教你如何在\
  \ Linux/UNIX 上从源码编译 Apache，以及在 Windows 系统上运行 Apache 时如何使用安装程序。\n\n#### 从源码编译\n\n\
  从源码编译提供了最大的灵活性，因为它允许你构建自定义服务器、移除不需要的模块并使用第三方模块扩展服务器。从源码编译 Apache 使你能够轻松升级到最新版本并快速应用安全补丁，而供应商提供的更新版本可能需要几天或几周才会出现。对于简单的安装，从源码编译\
  \ Apache 的过程并不困难，但在涉及第三方模块和库时，复杂性会增加。\n\n#### 安装二进制文件\n\n\n\n\nLinux/UNIX 二进制安装包可以从供应商处获得，也可以从\
  \ Apache 软件基金会网站下载。二进制安装为系统管理知识有限或没有特殊配置需求的用户提供了一种方便的 Apache 安装方法。第三方商业供应商提供预封装的\
  \ Apache 安装包，并附带应用程序服务器、额外模块、支持等。Apache 软件基金会为 Windows 系统提供了一个安装程序——在这些平台上，编译器不像在\
  \ Linux/UNIX 系统那样常见。\n\n## 在 Linux/UNIX 上安装 Apache\n\n本节解释了如何在 Linux/UNIX 上安装全新的\
  \ Apache 2.4.1 版本。从源码成功安装 Apache 所需的通用步骤如下：\n\n1. 下载软件。\n2. 运行配置脚本。\n3. 编译代码并安装。\n\
  \n接下来的章节将详细描述这些步骤。\n\n### 下载 Apache 源码\n\nApache 官方下载站点位于 [`httpd.apache.org/download.cgi`](http://httpd.apache.org/download.cgi)。你可以找到多个版本的\
  \ Apache 源码，并采用不同的压缩方法进行打包。分发文件首先使用 `tar` 工具打包，然后使用 `gzip` 工具或 `compress` 工具进行压缩。如果你的系统中安装了\
  \ `gunzip` 工具，请下载 `*.tar.gz` 版本。该工具在 FreeBSD 和 Linux 等开源操作系统中默认已安装。如果你的系统中不存在 `gunzip`，请下载\
  \ `*.tar.Z` 文件。（许多商业 UNIX 操作系统的默认安装中不包含它。）\n\n你想要下载的文件命名类似于 `httpd-VERSION.tar.gz`，其中\
  \ `VERSION` 是 Apache 的最新发布版本。例如，Apache 2.4.1 版本以名为 `httpd-2.4.1.tar.gz` 的文件发布。将下载的文件保留在留给源码文件的目录中，例如\
  \ `/usr/src/` 或 `/usr/local/src/`。\n\n### 解压源码\n\n如果你下载了使用 `gzip` 压缩的 tar 包（后缀为\
  \ `tar.gz`），你可以使用 `gunzip` 工具（`gzip` 分发的一部分）进行解压。\n\n注意\n\n`Tarball` 是使用 `tar` 工具打包的软件的常用别名。\n\
  \n你可以通过输入以下命令来解压并解包软件：\n\n```\ngunzip < httpd-2.4*.tar.gz | tar xvf -\n```\n\n解压\
  \ tar 包会创建一个目录结构，顶层目录名为 `httpd-VERSION`。将当前目录切换到此顶层目录，为配置软件做准备。\n\n### 准备构建 Apache\n\
  \n你可以通过顶层分发目录下的 `configure` 脚本指定生成的二进制文件具有哪些功能。默认情况下，Apache 以一组静态编译的标准模块进行编译，并安装在\
  \ `/usr/local/apache2` 目录。如果你对这些设置满意，可以执行以下命令来配置 Apache：\n\n```bash\n./configure\n\
  ```\n\n然而，为了给 第 4 章 中的“安装和配置 PHP”阶段的 PHP 安装做准备，你需要确保 `mod_so` 已编译进 Apache。该模块以 UNIX\
  \ 共享对象（`*.so`）格式命名，允许在 Apache 中使用如 PHP 之类的动态模块。要配置 Apache 将自己安装在特定位置（在此例中 `/usr/local/apache2/`）并启用\
  \ `mod_so` 使用，请执行以下命令：\n\n```bash\n./configure --prefix=/usr/local/apache2 --enable-so\n\
  ```\n\n`configure` 脚本目的是确定所有与查找库、编译时选项、平台特定差异等的问题，并创建一组名为 `makefiles` 的特殊文件。`Makefiles`\
  \ 包含执行不同任务（称为 `targets`）的指令，例如构建 Apache。`make` 工具读取这些文件并执行目标任务。如果一切顺利，执行 `configure`\
  \ 后，你将看到一组与刚刚执行的各种检查相关的消息，并返回提示符：\n\n```\n...\nconfigure ok\ncreating test/Makefile\n\
  config.status: creating docs/conf/httpd.conf\n...\nconfig.status: executing default\
  \ commands\n```\n\n如果 `configure` 脚本失败，将出现警告，提醒你跟踪必须安装的额外软件，例如编译器或库。在安装任何缺失的软件后，你可以删除顶层目录下的\
  \ `config.log` 和 `config.status` 文件，然后再次尝试 `configure` 命令。\n\n注意\n\n如果配置过程结束时出现提示你未安装\
  \ APR 的警告，请访问 httpd://apr.apache.org/ 并下载 APR 和 APR-util 软件包，将它们解压到你的 `httpd-VERSION`\
  \ 源码目录的 `srclib` 子目录下。安装完成后，重新运行 `configure` 命令。\n\n同样，如果配置过程结束时出现提示你未安装 PCRE 的警告，请访问\
  \ [`www.pcre.org`](http://www.pcre.org) 下载文件，并根据网站上的说明在你的系统中安装。安装完成后，重新运行 configure\
  \ 命令。\n\n这两项要求都是 Apache 2.4 要求的变更，不同于 Apache 2.2。\n\n### 构建并安装 Apache\n\n`make`\
  \ 工具读取存储在 `makefiles` 中的信息并构建服务器和模块。在命令行中输入 `make` 来构建 Apache。你将看到几条指示编译进度的消息，然后回到提示符。编译完成后，可以在提示符处输入\
  \ `make install` 来安装 Apache。makefiles 会安装文件和目录并返回提示符：\n\n```\n...\nInstalling header\
  \ files\nInstalling build system files\nInstalling man pages and online manual\n\
  ...\nmake[1]: Leaving directory '/usr/local/bin/httpd-2'\n```\n\nApache 分发文件现在应该位于\
  \ `/usr/local/apache2`，正如 `configure` 命令中 `--prefix` 选项所指定的。要测试 `httpd` 二进制文件是否构建正确，在提示符处输入：\n\
  \n```bash\n/usr/local/apache2/bin/httpd -v\n```\n\n你应该能看到以下输出（你的版本和构建日期会有不同）：\n\n\
  ```\nServer version: Apache/2.4.1 (Unix)\nServer built: March 12 2012 11:47:22\n\
  ```\n\n除非你想学习如何在 Mac OS X 或 Windows 上安装 Apache，否则请跳转到“Apache 配置结构”章节了解 Apache 配置文件。\n\
  \n### 在 Mac OS X 上安装 Apache\n\n幸运的是，Mac OS X 已经安装了 Apache！默认情况下，Apache 服务器二进制文件位于\
  \ `/usr/sbin/httpd`。配置文件（如 `httpd.conf`，Apache 的主配置文件）位于 `/etc/httpd`。由于 Apache\
  \ 已经准备就绪并完全准备可以使用 PHP，请跳转到“Apache 配置结构”章节了解更多关于 Apache 配置文件的信息及其使用方法。\n\n注意\n\n\
  如果你想在 Mac OS X 上使用一体化软件包安装程序，可以像第 1 章](#ch01.html_ch01)中“使用 XAMPP 的快速入门指南”所示那样操作，或者从\
  \ [`www.mamp.info`](http://www.mamp.info) 下载 MAMP 软件包。\n\n### 在 Windows 上安装 Apache\n\
  \n注意\n\n\n\n\n在编写此时，Apache `2.4.x` 尚未提供 Windows 版本。因此，后续指令适用于 Apache `2.2.x`。当 Apache\
  \ `2.4.x` 发布后，其安装过程将会类似。\n\nApache `2.2` 运行在大多数 Windows 平台上，并且比之前的 Windows 版本提供了更高的性能和稳定性能。你可以从源码编译\
  \ Apache，但由于没有许多 Windows 用户拥有编译器，本节将主要介绍 MSI 安装程序版本。\n\n在安装 Apache 之前，请确保你的机器上没有正在运行\
  \ Web 服务器（例如，之前版本的 Apache 或 Microsoft Internet 信息服务 IIS）。你可能需要卸载或禁用现有的服务器。你可以运行多个\
  \ Web 服务器，但它们必须在不同的地址和端口组合上。\n\n在下载安装程序之前，请花一点时间——一个非常重要的时刻——在下载页面（位于 [`httpd.apache.org/download.cgi`](http://httpd.apache.org/download.cgi)）上寻找名为“如果您正在下载\
  \ Win32 发行版，请阅读这些重要说明”的声明。这些说明的直接 URL 为 [`www.apache.org/dist/httpd/binaries/win32/README.html`](http://www.apache.org/dist/httpd/binaries/win32/README.html)。\n\
  \nApache 软件基金为想要运行 Apache 服务器版本的 Windows 用户维护了此页面。在该页面上，针对几乎每种仍在使用的 Windows 变体说明，阅读所呈现的信息对你是有益的。我保证，如果你将\
  \ Apache 作为生产服务器或开发服务器运行，你将在说明页面上找到相关信息。\n\n当你准备好开始安装时，寻找标记为 Win32 Binary including\
  \ OpenSSL(MSI Installer) 的链接。下载安装程序后，双击该文件开始安装过程。你将看到一个欢迎界面，如图 3.1 所示。\n\n![image](img/03fig01.jpg)\n\
  \n**图 3.1 Windows 安装程序欢迎界面。**\n\n点击“下一步”继续安装过程，你将会被提示接受 Apache 许可协议。基本上，该许可协议表示你可以对软件做任何你想做的事——包括进行专有修改——但不能声称它是你编写的，不过请务必阅读许可协议以完全理解这些条款。\n\
  \n接受许可协议后，安装程序将向你展示 Apache 的简要介绍。随后，它要求你提供有关你计算机的基本信息，如图 3.2 所示。这包括服务器的完整网络地址（例如\
  \ `mycomputer.mydomain.com`）和管理员的电子邮件。服务器名称是客户端访问服务器时使用的名称，管理员电子邮件会被添加到错误消息中，以便访问者在出现问题时知道如何联系你。\n\
  \n![image](img/03fig02.jpg)\n\n**图 3.2 基本信息屏幕。**\n\n在此屏幕上，你会被提示选择应该安装哪些安装快捷方式——是作为服务启动\
  \ Apache 的快捷，还是手动启动 Apache 的快捷。将 Apache 作为服务安装会导致它在每次 Windows 启动时运行，你可以通过标准的 Windows\
  \ 服务管理工具对其进行控制。为当前用户安装 Apache 需要你手动启动 Apache，并将 Apache 监听请求的默认端口设置为 8080（而不是 80）。选择相应的单选按钮并点击“下一步”继续。\n\
  \n**提示**\n\n如果你的机器没有完整的网络地址，请使用 `localhost` 或 `127.0.0.1` 作为服务器名称。\n\n下一个屏幕允许你选择安装类型：典型或自定义。*典型安装*意味着安装\
  \ Apache 二进制文件和文档，但不安装头文件和库文件。除非你计划编译自己的模块，否则这是最佳选择。\n\n*自定义安装*允许你选择是否安装头文件或文档。在选择了目标安装目录（默认路径为\
  \ `c:\\Program Files (x86)\\Apache Software Foundation\\Apache 2.2`）后，程序将继续安装过程。如果一切顺利，它将向你展示最终的界面，如图\
  \ 3.3 所示。\n\n![image](img/03fig03.jpg)\n\n**图 3.3 安装成功屏幕。**\n\n在下一节中，你将学习 Apache\
  \ 配置文件并最终启动你的新服务器。\n\n### Apache 配置文件结构\n\nApache 将所有的配置信息存储在文本文件中。主文件是 `httpd.conf`。该文件包含指令和容器，允许你自定义\
  \ Apache 安装。*指令*（Directives）配置 Apache 的特定设置，例如授权、性能和网络参数。*容器*（Containers）指定了这些设置所指的上下文。例如，授权配置可以指向整个服务器、某个目录或单个文件。\n\
  \n#### 指令\n\n以下规则适用于 Apache 指令语法：\n\n- 指令参数紧跟在指令名之后。\n- 指令参数之间用空格分隔。\n- 参数的数量和类型随指令而异；某些指令没有参数。\n\
  - 一个指令占据一行，但你可以通过在上一行的末尾添加反斜杠字符（`\\`）来在另一行继续。\n- 井号（`#`）应该位于指令之前，并且必须单独成一行。\n\n\
  Apache 服务器文档提供了指令的快速参考，地址为 [`httpd.apache.org/docs/2.4/mod/quickreference.html`](http://httpd.apache.org/docs/2.4/mod/quickreference.html)。你很快就会学习一些基础指令，但你应该通过在线文档来补充知识。\n\
  \nApache 指令文档通常遵循以下模型：\n\n- **Description（描述）**：此条目提供了指令的简要描述。\n- **Syntax（语法）**：此条目解释了指令选项的格式。强制参数用斜体表示，可选参数用斜体并加括号。\n\
  - **Default（默认值）**：如果指令有默认值，则显示在此处。\n- **Context（上下文）**：此条目详细说明了指令可以出现的容器或区域。下一节将解释容器。可能的值有\
  \ `server config`、`virtual host`、`directory` 和 `.htaccess`。\n- **Override（覆盖）**：Apache\
  \ 指令属于不同的类别。Override 字段指定了哪些指令类别可以出现在 .htaccess 目录配置文件中。\n- **Status（状态）**：此条目指示该指令是内置在\
  \ Apache 中的（`core`）、还是属于绑定的模块（取决于是否默认编译，分为 `base` 或 `extension`）、属于多处理模块（`MPM`）、或随\
  \ Apache 绑定但尚未准备在生产服务器中使用（`experimental`）。\n- **Module（模块）**：此条目指示该指令所属的模块。\n- **Compatibility（兼容性）**：此条目包含关于哪些\
  \ Apache 版本支持该指令的信息。\n\n文档中会在这些条目之后提供该指令的进一步说明，并在结尾处引用相关指令或文档。\n\n#### 容器\n\n指令容器也称为*区域*（sections），限制了指令生效的范围。如果指令不在容器内，它们属于默认的服务器范围（`server\
  \ config`），适用于整个服务器。\n\n这些是默认的 Apache 指令容器：\n\n\n\n\n\n- `<VirtualHost>`—`VirtualHost`\
  \ 指令指定一个虚拟服务器。Apache 允许你通过单一 Apache 安装来托管不同的网站。此容器内的指令适用于特定的网站。该指令接受域名或 IP 地址以及可选的端口作为参数。你可以在第\
  \ 29 章“Apache 性能调优与虚拟主机”中了解更多关于虚拟主机的知识。\n\n- `<Directory>`, `<DirectoryMatch>`—这些容器允许指令应用于文件系统中的某个目录或目录组。`Directory`\
  \ 容器接受目录或目录模式作为参数。其中包含的指令适用于指定的目录及其子目录。`DirectoryMatch` 容器允许指定正则表达式模式作为参数。例如，以下内容允许匹配\
  \ `www` 目录下所有二级子目录，且这些子目录由四个数字组成，例如以月份命名的目录（代表 2012 年 2 月的 `0212`）：\n\n```\n<DirectoryMatch\
  \ \"^/www/.*/[0-9]{4}\">\n```\n\n- `<Location>`, `<LocationMatch>`—这些容器允许指令应用于某些请求的\
  \ URL 或 URL 模式。它们与 `Directory` 对应的类似。`LocationMatch` 接受正则表达式作为参数。例如，以下内容匹配包含 `\"\
  /my/data\"` 或 `\"/your/data\"` 的目录：\n\n```\n<LocationMatch \"/(my|your)/data\">\n\
  ```\n\n- `<Files>`, `<FilesMatch>`—与 `Directory` 和 `Location` 容器类似，`Files` 部分允许指令应用于某些文件或文件模式。\n\
  \n容器包围指令，如列表 3.1 所示。\n\n**列表 3.1** 容器指令示例\n\n```\n1: <Directory \"/some/directory\"\
  >\n2: SomeDirective1\n3: SomeDirective2\n4: </Directory>\n5: <Location \"/downloads/*.html\"\
  >\n6: SomeDirective3\n7: </Location>\n8: <Files \"\\.(gif|jpg)\">\n9: SomeDirective4\n\
  10: </Files>\n```\n\n指令 `SomeDirective1` 和 `SomeDirective2` 适用于 `/some/directory`\
  \ 目录及其子目录。`SomeDirective3` 适用于指向 `/downloads/` URL 下扩展名为 `.html` 的页面。`SomeDirective4`\
  \ 适用于所有扩展名为 `.gif` 或 `.jpg` 的文件。\n\n### 条件评估\n\nApache 提供对条件容器的支持。包含这些容器中的指令仅在满足特定条件时才处理：\n\
  \n- `<IfDefine>`—如果向 Apache 可执行文件传递了特定的命令行开关，则处理此容器中的指令。列表 3.2 中的指令只有在向正在执行的 Apache\
  \ 二进制文件传递了 `-DMyModule` 开关时才会被处理。处理。你可以直接传递它，也可以通过修改 `apachectl` 脚本传递，如本章后面部分“Apache\
  \ 相关命令”节所述。\n\n`IfDefine` 容器还允许你取反参数。也就是说，`<IfDefine !MyModule>` 内部的指令（注意 `MyModule`\
  \ 名称前的感叹号）只有在没有作为命令行参数传递 `-DMyModule` 参数时才会被处理。\n\n- `<IfModule>`—只有在当作为参数传递的模块存在于\
  \ Web 服务器中时，`IfModule` 部分中的指令才会被处理。例如，Apache 带有一个默认的 `httpd.conf` 配置文件，提供了对不同 MPM\
  \ 支持。只有编译到 Apache 中的 MPM 配置会被处理，如列表 3.3 所示。该示例的目的是说明只有一组指令会被评估。\n\n**列表 3.2** IfDefine\
  \ 示例\n\n点击此处查看代码图像\n\n```\n1: <IfDefine MyModule>\n2: LoadModule my_module modules/libmymodule.so\n\
  3: </IfDefine>\n```\n\n**列表 3.3** IfModule 示例\n\n```\n1: <IfModule prefork.c>\n\
  2: StartServers           5\n3: MinSpareServers      5\n4: MaxSpareServers     \
  \ 10\n5: MaxClients           20\n6: MaxRequestsPerChild  0\n7: </IfModule>\n8:\n\
  9: <IfModule worker.c>\n10: StartServers           3\n11: MaxClients           8\n\
  12: MinSpareThreads      5\n13: MaxSpareThreads      10\n14: ThreadsPerChild   \
  \   25\n15: MaxRequestsPerChild  0\n16: </IfModule>\n```\n\n#### `ServerRoot` 指令\n\
  \n`ServerRoot` 指令接受单个参数：指向服务器所在位置的路径。如果你如本章前面所述在 Linux/UNIX 上从源码编译 Apache，则 `ServerRoot`\
  \ 为 `/usr/local/apache2`。如果你使用 Windows 安装程序，`ServerRoot` 为 `C:\\Program Files (x86)\\\
  Apache\\2.2\\`。对于 Mac OS 用户，`ServerRoot` 为 `/Library/WebServer/`。\n\n#### 每个目录的配置文件\n\
  \nApache 使用每个目录文件来允许指令存在于主配置文件之外。`AllowOverride` 指令控制这些组中的哪些出现在目录文件中。`AllowOverride`\
  \ 还可以接受 `All` 或 `None` 参数。`All` 意味着属于所有组的指令都可以出现在文件中。`None` 表示禁用该目录及其任何子目录的目录文件。列表\
  \ 3.4 显示了如何禁用整个服务器的目录文件。这可以提高性能并是 Apache 的默认配置。\n\n```\n1: <Directory />\n2: AllowOverride\
  \ none\n3: </Directory>\n```\n\n#### 注意事项\n\n启用目录文件会有性能损失。Apache 必须执行磁盘操作来查找这些文件，即使这些文件并不。\n\
  \n目录文件默认名为 `.htaccess`。这是出于历史原因；它们最初用于保护包含 HTML 的目录。\n\n`AccessFileName` 指令允许你将目录文件名从\
  \ `.htaccess` 更改为。它接受 Apache 在查找目录文件时使用的文件名列表。\n\n要确定是否可以在目录文件中覆盖某个指令，请检查指令语法中的\
  \ `Context:` 字段是否包含 `.htaccess`。Apache 指令属于不同的组，如指令描述中的 `Override` 字段所示。可能的值如下：\n\
  \n- `AuthConfig`—控制授权\n- `FileInfo`—控制文档类型\n- `Indexes`—控制目录索引\n- `Limit`—控制主机访问\n\
  - `Options`—控制特定的目录功能\n\n你可以通过 `AllowOverride` 指令控制哪些指令组出现在目录文件中。\n\n### Apache\
  \ 日志文件\n\nApache 默认包含两个日志。`access_log` 文件用于跟踪客户端请求。`error_log` 文件用于记录重要事件，例如错误或服务器重启。在第一次启动\
  \ Apache 之前，这些文件并不存在。在 Windows 平台上，文件名为 `access.log` 和 `error.log`。\n\n#### `access_log`\
  \ 文件\n\n\n\n\n\n当客户端向服务器请求文件时，Apache 会记录与该请求相关的几个参数，包括客户端的 IP 地址、请求的文档、HTTP 状态码以及当前时间。列表\
  \ 3.5 显示了 `access_log` 条目的示例。第 26 章“日志记录与监控 Web 服务器活动”将向你展示如何修改记录哪些参数。\n\n### 列表\
  \ 3.5 access_log 条目\n\n点击此处查看代码图片\n\n```\n1: 127.0.0.1 - - [12/Mar/202:08:33:25\
  \ -0700] \"GET / HTTP/1.1\" 200 44\n2: 127.0.0.1 - - [12/Mar/2012:08:33:25 -0700]\
  \ \"GET /favicon.ico HTTP/1.1\" 404 209\n```\n\n#### `error_log` 文件\n\n`error_log`\
  \ 文件包含了错误信息、启动信息以及服务器生命周期中的任何其他重大事件。当你遇到 Apache 问题时，这是首要查找的地方。列表 3.6 显示了 `error_log`\
  \ 条目的示例。\n\n### 列表 3.6 error_log 条目\n\n点击此处查看代码图片\n\n```\n1: Starting the Apache2.4\
  \ service [The Apache2.4 service is running.]\n2: Apache/2.4.1 (Unix) configured\
  \ -- resuming normal operations\n3: [Tue Mar 13 08:29:34 2012] [notice] Server built:\
  \ Mar 12 2012 11:47:22\n4: [Tue Mar 13 08:29:34 2012] [notice] Parent: Created child\
  \ process 3504\n5: [Tue Mar 13 08:29:35 2012] [notice] Child 3504: Child process\
  \ is running\n6: [Tue Mar 13 08:29:35 2012] [notice] Child 3504: Acquired the start\
  \ mutex.\n```\n\n#### 额外文件\n\n`httpd.pid` 文件包含正在运行的 Apache 服务器的进程 ID（PID）。你可以使用此数字手动向\
  \ Apache 发送信号，如下一节所述。`scoreboard` 文件存在于 Linux/UNIX Apache 中，用于基于进程的 MPM 与其子进程通信。通常情况下，你不需要担心这些文件。\n\
  \n### Apache 相关命令\n\nApache 分发包含多个可执行文件。本节仅涵盖服务器二进制文件和相关脚本。第 25 章“限制访问应用程序”和第 29\
  \ 章](#ch29.html_ch29)“Apache 性能调优与虚拟主机”涵盖了 Apache 分发中包含的其他实用工具。\n\n#### Apache 服务器二进制文件\n\
  \n在 Linux/UNIX 和 Mac OS X 上，Apache 可执行文件的文件名为 `httpd`，在 Windows 上为 `httpd.exe`。它接受多个命令行选项，其中一些在表\
  \ 3.1](#ch03.html_ch03tab1) 中描述。你可以在 Linux/UNIX 上输入 `/usr/local/apache2/bin/httpd\
  \ -h`，在 Mac OS X 上输入 `/sbin/httpd -h`，或在 Windows 命令提示符中输入 `httpd.exe -h` 获取完整的选项列表。\n\
  \n**表 3.1 部分 httpd 选项**\n（此处引用）\n\nApache 运行后，你可以使用 Linux/UNIX 和 Mac OS X  `kill`\
  \ 命令向父 Apache 进程发送信号。信号提供了一种向进程发送命令的机制。要发送信号，请执行以下命令：\n\n`kill -SIGNAL pid`\n\n\
  在此语法中，`pid` 是进程 ID，`SIGNAL` 是以下之一：\n\n- `HUP`—停止服务器\n- `USR1` 或 `WINCH`—平滑重启；使用哪种信号取决于操作系统\n\
  - `SIGHUP`—重启\n\n如果你对配置文件进行了一些更改并希望它们生效，必须向 Apache 通知配置已更改。这告诉 Apache 重新读取配置。普通重启会导致服务短暂暂停。平滑重启采取了不同的方法：每个为客户端服务的线程或进程都会继续处理请求，当它们完成后，会被杀死并由带有新配置的新线程或进程替换。这允许\
  \ Web 服务器无缝运行而无需停机。\n\n在 Windows 上，你可以使用 `httpd.exe` 可执行文件向 Apache 发送信号。这里列出了一些命令：\n\
  \n- `httpd.exe -k restart`—告诉 Apache 重启\n- `httpd.exe -k graceful`—告诉 Apache 执行平滑重启\n\
  - `httpd.exe -k stop`—告诉 Apache 停止\n\n你可以在 Apache 安装程序在开始菜单中访问这些命令的快捷方式。如果你将 Apache\
  \ 安装为服务，可以使用 Windows 启动或停止 Apache。\n\n#### Apache 控制脚本\n\n在 Linux/UNIX 和 Mac OS\
  \ X 上，可以使用 `httpd` 二进制文件通过 IP 地址控制 Apache。`apachectl` 工具通常可以配置 Apache。要使用 `apachectl`，输入：\n\
  \n`/usr/local/apache2/bin/apachectl`\n\n在此语法中，命令可以是 `stop`、`start`、`restart` 或 `graceful`。某些操作系统分发版提供了用于控制\
  \ Apache 的额外脚本；查看随分发的的 `apachectl`。\n\n### 首次启动 Apache\n\n在启动 Apache 之前，请验证配置文件\
  \ `httpd.conf` 中存在基本信息。以下章节描述了配置 Apache 并启动服务器所需的信息。\n\n#### 检查配置文件\n\n你可以使用喜欢的文本编辑器编辑\
  \ `httpd.conf` 文件。在 Linux/UNIX 和 Mac OS X 上，这可能是 `vi` 或 `emacs`。在 Windows 上，可以使用记事本或\
  \ WordPad。你必须以纯文本格式保存配置文件，这是 Apache 识别的格式。\n\n你可能需要更改两个参数来启动 Apache：服务器名称以及它监听的地址和端口。服务器名称是\
  \ Apache 在需要引用自身时（例如进行重定向时）使用的名称。\n\nApache 通常可以根据机器的 IP 地址判断出服务器名称，但并非总是。如果服务器没有有效的\
  \ DNS（域名系统）条目，你可能需要指定机器的 IP 地址之一。如果服务器没有连接网络（你可能想在独立机器上测试 Apache），可以使用值 `127.0.0.1`，这是环回地址。默认端口值为\
  \ `80`。如果机器的 `80` 端口已经运行了服务器，或者你没有管理员权限——在 Linux/UNIX 系统上，只有 `root` 用户可以绑定特权端口（端口号小于\
  \ 1024 的端口），你可能需要更改此值。可以使用 `Listen` 指令更改监听地址和端口值。`Listen` 指令接受端口号或 IP 地址加端口（用冒号分隔）。如果你仅指定端口，Apache\
  \ 将在所有可用 IP 地址上监听该端口。如果你提供了额外的 IP 地址，Apache 将仅在该地址和端口组合上监听。例如，`Listen 80` 告诉 Apache\
  \ 在端口 80 上监听所有 IP 地址。使用 `apachectl` 时，输入：\n\n`Listen 10.0.0.1:443` 某些操作系统分发版提供了控制\
  \ Apache 的脚本；查看随分发的 `apachectl`。\n\n\n\n\n\n在 Linux/UNIX 和 Mac OS X 平台上，你可以使用 `User`\
  \ 和 `Group` 指令来指定服务器以哪个用户和组 ID 运行。`nobody` 用户是大多数平台的良好选择。然而，HP-UX 平台在使用此用户 ID 时存在问题，因此你必须创建并使用不同的用户\
  \ ID，例如 `www`。\n\n## 启动 Apache\n\n在 Linux/UNIX 上启动 Apache，请切换到包含 `apachectl` 脚本的目录并执行以下命令：\n\
  \n点击此处查看代码\n\n```bash\n/usr/local/apache2/bin/apachectl start\n```\n\nMac OS X 用户可以在提示符中输入以下内容：\n\
  \n```bash\n/usr/sbin/httpd\n```\n\n在 Windows 上手动启动 Apache，请点击开始菜单中 Apache HTTP Server\
  \ 2.2 程序组内“Control Apache Server”部分中的“Start”链接。如果你是将 Apache 作为服务安装的，则你必须启动 Apache\
  \ 服务。\n\n如果一切顺利，你可以使用浏览器访问 Apache。将显示一个默认安装页面，如图 3.4 所示。如果你无法启动 Web 服务器或出现错误页面，请参阅后面的“故障排除”部分。确保你通过\
  \ `Listen` 指令指定的端口之一访问 Apache——通常是端口 80 或 8080。\n\n![image](img/03fig04.jpg)\n\n\
  图 3.4 Apache 已安装。\n\n## 故障排除\n\n以下章节描述了你在首次启动 Apache 时可能会遇到的几个常见问题。\n\n### 已存在 Web\
  \ 服务器\n\n如果机器上已经运行了一个服务器并正在监听相同的 IP 地址和端口组合，Apache 将无法成功启动。你会在错误日志看到一条目，指示 Apache\
  \ 无法绑定到端口：\n\n点击此处查看代码\n\n```text\n[crit] (48)Address already in use: make_sock:\
  \ could not bind...[alert] no\nlistening sockets available, shutting down\n```\n\
  \n要解决这个问题，你需要停止正在运行的服务器或更改 Apache 配置以监听不同的端口。\n\n### 无权限绑定到端口\n\n如果你没有管理员权限并尝试绑定到特权端口（0\
  \ 到 1024 之间），将得到错误：\n\n点击此处查看代码\n\n```text\n[crit] (13)Permission denied: make_sock:\
  \ could not bind to address 10.0.0.2:80\n[alert] no listening sockets available,\
  \ shutting down\n```\n\n要解决这个问题，你必须在启动 Apache 之前以管理员身份登录，或者更改端口号；8080 是常用的非特权端口。\n\
  \n### 拒绝访问\n\n如果你没有权限读取配置文件或写入日志文件，你可能无法启动 Apache。你将得到类似下面的错误：\n\n点击此处查看代码\n\n```text\n\
  (13)Permission denied: httpd: could not open error log file\n```\n\n如果构建和安装 Apache\
  \ 的用户与尝试运行它的用户不同，就会出现这个问题。\n\n### 组设置错误\n\n你可以配置 Apache 在特定的用户名和组下运行。Apache 对运行服务器的用户名和组有默认值。有时默认值无效，你将得到一个包含\
  \ `setgid: unable to set group id` 的错误。\n\n要在 Linux/UNIX 和 Mac OS X 上解决这个问题，你必须将配置文件中\
  \ `Group` 指令的值更改为有效值。检查 `/etc/groups` 文件以查看现有组。\n\n### 总结\n\n本章解释了在你的 Linux/UNIX、Mac\
  \ OS X 或 Windows 机器上安装和运行 Apache Web 服务器的不同方法。它涵盖了二进制安装和源码安装，并解释了基本的编译时选项。此外，你学习了服务器配置文件的位置以及用于修改\
  \ Apache 配置的命令语法。你了解了两个主要的日志文件：`access_log` 和 `error_log`。你还了解如何在 Linux/UNIX、Mac\
  \ OS X 和 Windows 平台上使用 Apache 控制脚本或 Apache 服务器二进制文件启动和停止服务器。\n\n### 问答\n\n**Q. 我如何启动一次干净的构建？**\n\
  \n**A.** 如果你需要从源码构建新的 Apache，并且不希望之前的构建结果影响新的构建，那么运行 `make clean` 命令始终是一个好主意。这样做可以清理任何现有的二进制文件、中间对象文件等。\n\
  \n**Q. 为什么每个目录的配置文件有用？**\n\n**A.** 虽然每个目录的配置文件对服务器性能有影响，但它们对于委托管理非常有用。因为每个目录的配置文件在每次发出请求时都会读取，所以当对配置进行更改时不需要重启服务器。你可以允许网站的用户自行进行配置更改，而无需授予他们管理员权限。通过这种方式，他们可以为主页的某些设置密码保护。\n\
  \n**Q. 你说的有效的 ServerName 指令是指什么？**\n\n**A.** DNS 系统将 IP 地址与域名关联。当服务器生成 URL 时，会返回\
  \ `ServerName` 的值。如果你在使用特定的域名，必须确保它包含在 DNS 系统中并对客户端可用。\n\n### 工作坊\n\n工作坊旨在帮助你复习所学内容并开始实践。\n\
  \n#### 验\n\n**1. 我如何指定安装 Apache 的位置？**\n\n**2. `<Location>` 和 `<Directory>` 节的主要区别是什么？**\n\
  \n**3. 重启和优雅重启的区别是什么？**\n\n#### 答案\n\n**1.** Linux/UNIX 用户可以使用 `configure` 脚本的 `--prefix`\
  \ 选项。如果该位置已有安装，配置文件将被保留，但二进制文件将被替换。在 Windows 上，此位置在安装向导中设置。\n\n**2.** `Directory`\
  \ 节引用文件系统对象；`Location` 节引用网页地址栏中的元素。\n\n**3.** 在普通重启期间，服务器被停止然后启动，会导致某些请求丢失。优雅重启允许\
  \ Apache 子进程继续提供当前服务，直到被运行新配置的子进程替换。\n\n### 活动\n\n1. 练习各种服务器关闭和重启程序。\n\n2. 进行某些更改，例如不同的端口分配和\
  \ `ServerName` 更改。\n\n## 第 4 章 安装和配置 PHP\n\n* *\n\n***在本章中，你将学习：***\n\n• **如何安装\
  \ PHP**\n\n• **如何测试你的 PHP 安装**\n\n• **出现问题时如何寻求帮助**\n\n• **PHP 语言基础**\n\n* * *\n\
  \n在本章中，你将获取、安装并配置 PHP，并对你的 Apache 安装进行一些更改。\n\n### PHP 的当前和未来版本\n\n本章中的安装指的是 PHP\
  \ 版本 5.4.0，这是该软件的当前版本。\n\nPHP 使用 使用修订和小版本来发布包含安全增强或错误修复的更新。这些发布不遵循固定的发布计划；当增强或修复被添加到代码并经过彻底测试时，PHP\
  \ 组就会发布带有新修订号的新版本。\n\n\n\n\n在你购买此书时，次要版本号可能已经变为 5.4.1 或更高版本。如果是这样，你应该查阅 [`www.php.net/ChangeLog-5.php`](http://www.php.net/ChangeLog-5.php)\
  \ 中的变更列表，以获取任何安装/配置过程的更改。这些过程构成了章的大部分。\n\n尽管在次要版本更新之间，安装说明不太可能发生变化，但请务必检查你安装和维护的软件的变更日志（changelog）。如果你在阅读本书时确实发生了修订，但变更日志中没有说明安装方面的变化，只需心中记住，并将安装说明及相关附图中出现旧版本号的地方替换为新版本号。\n\
  \n## 在 Linux/UNIX 上结合 Apache 构建 PHP\n\n本节探讨了在 Linux/UNIX 上通过 Apache 安装 PHP 的方法。对于任何类\
  \ Unix 的操作系统，该过程大体相同。虽然你可能能够为你的系统找到预编译的 PHP 版本，但从源码编译 PHP 可以让你对二进制文件中内置的特性具有更好的控制力。\n\
  \n要下载 PHP 分发文件，请访问 PHP 主页 [`www.php.net/`](http://www.php.net/) 并点击链接进入下载（Downloads）部分。获取最新版本的源码——在本示例中，我们使用的是\
  \ 5.4.0。你的分发包命名类似于 `php-VERSION.tar.gz`，其中 `VERSION` 是最新的发布版本号。该存档是一个压缩 tar 文件，因此你需要解压它：\n\
  \n点击此处查看代码图像\n\n```bash\ngunzip < php-VERSION.tar.gz | tar xvf -\n```\n\n将下载的文件保留在专门给源文件的目录中，例如\
  \ `/usr/src/` 或 `/usr/local/src/`。解压分发包后，你应该移动到 PHP 分发目录：\n\n```bash\ncd php-VERSION\n\
  ```\n\n在分发目录中，你会找到一个名为 `configure` 的脚本。该脚本接受从命令行运行 `configure` 脚本时提供的额外信息。这些命令行参数控制\
  \ PHP 支持的特性。本示例包含了安装带有 Apache 和 MySQL 支持的 PHP 所需的基础选项。我们将在本章后面以及整书中在需要时讨论一些可用的 `configure`\
  \ 选项。\n\n点击此处查看代码图像\n\n```bash\n./configure --prefix=/usr/local/php \\\n--with-mysqli=/usr/local/mysql/bin/mysql_config\
  \ \\\n--with-apxs2=/usr/local/apache2/bin/apxs\n```\n\n> 注意\n\n如果你安装 MySQL 或 Apache\
  \ 的位置与此处配置所示的路径不同，请确保在命令中替换为相应的目录路径。\n\n`configure` 脚本运行后，你将返回提示符符。例如：\n\n点击此处查看代码图像\n\
  \n...\n\n```\nGenerating files\nupdating cache ./config.cache\ncreating ./config.status\n\
  creating php5.spec\ncreating main/build-defs.h\ncreating scripts/phpize\ncreating\
  \ scripts/man1/phpize.1\ncreating scripts/php-config\ncreating scripts/man1/php-config.1\n\
  creating sapi/cli/php.1\ncreating main/php_config.h\ncreating main/internal_functions.c\n\
  creating main/internal_functions_cli.c\n+--------------------------------------------------------------------+\n\
  | License:                                                           |\n| This software\
  \ is subject to the PHP License, available in this      |\n| distribution in the\
  \ file LICENSE.  By continuing this installation |\n| process, you are bound by\
  \ the terms of this license agreement.   |\n| If you do not agree with the terms\
  \ of this license, you must abort |\n| the installation process at this point. \
  \                          |\n+--------------------------------------------------------------------+\n\
  Thank you for using PHP.\n```\n\n在提示符符下，执行 `make` 命令，接着执行 `make install` 命令。这些命令将结束\
  \ PHP 的编译和安装过程，并返回提示符：\n\n点击此处查看代码图像\n\n...\n\n```bash\nchmod 755 /usr/local/apache2/modules/libphp5.so\n\
  [activating module 'php5' in /usr/local/apache2/conf/httpd.conf]\nInstalling PHP\
  \ CLI binary:      /usr/local/php/bin/\nInstalling PHP CLI man page:      /usr/local/php/php/man/man1/\n\
  Installing PHP CGI binary:      /usr/local/php/bin/\nInstalling build environment:\
  \   /usr/local/php/lib/php/build/\nInstalling header files:         /usr/local/php/include/php/\n\
  Installing helper programs:      /usr/local/php/bin/\n  program: phpize\n  program:\
  \ php-config\nInstalling man pages:            /usr/local/php/php/man/man1/\n  page:\
  \ phpize.1\n  page: php-config.1\n...\n```\n\n你需要确保两个非常重要的文件被复制到正确的位置。首先，执行以下命令复制开发版本的\
  \ `php.ini`。你将在本章稍后的部分学习更多关于 `php.ini` 的信息：\n\n点击此处查看代码图像\n\n```bash\ncp php.ini-development\
  \ /usr/local/php/ini\n```\n\n接下来，将共享对象拷贝到其正确的位置（如果它尚未被放置），如 `make install` 的输出所示：\n\
  \n点击此处查看代码图像\n\n```bash\ncp libphp5.so /usr/local/apache2/modules/\n```\n\n你现在应该可以配置并运行\
  \ Apache 了。\n\n### Linux/UNIX 配置选项\n\n在上一节中，我们运行 `configure` 脚本时包含了一些决定 PHP 将包含特性的命令行参数。`configure`get\
  \ 本身提供了可用列表，包括我们使用的那些。在分发目录中，输入：\n\n```bash\n./configure --help\n```\n\n此命令会产生很长的列表，因此你可能想将其添加到文件中以便阅读：\n\
  \n点击此处查看代码图像\n\n```bash\n./configure --help > configoptions.txt\n```\n\n如果你在安装后发现想要添加到\
  \ PHP 的功能，只需重新运行配置和构建过程。这将创建新的 `libphp5.so` 并放入 Apache 目录。你只需要重启 Apache。\n\n###\
  \ 在 Linux/UNIX 上集成 PHP 与 Apache\n\n为了确保 PHP 和 Apache 协同工作，你需要在 `httpd.conf` 文件中检查并可能添加一些项目。首先，查找如下行：\n\
  \n点击此处查看代码图像\n\n```apache\nLoadModule php5_module modules/libphp5.so\n```\n\n如果该行不存在，或者行开头带有井号（`#`），你必须添加该行或删除\
  \ `#`。此行告诉 Apache 使用 PHP 构建过程创建的共享对象 (`libphp5.so`)。\n\n接下来，查找此部分：\n\n点击此处查看代码图像\n\
  \n```apache\n# AddType allows you to add to or override the MIME configuration\n\
  # file mime.types for specific file types.\n#\n```\n\n在该部分添加以下行：\n\n```apache\n\
  AddType application/x-httpd-php .php\n```\n\n该语句确保 PHP 引擎解析以 `.php` 结尾的文件。你的文件名选择可能不同；例如，你可能希望解析所有以\
  \ `*.html` 的文件。保存此文件并重启 Apache。当你查看 `error_log` 时，你应该看到类似下面的行：\n\n点击此处查看代码图像\n\n\
  ```log\n[Tue Mar 13 10:42:47 2012] [notice] Apache/2.4.1 (Unix) PHP/5.4.0 configured\n\
  ```\n\n\n\n\nPHP 现在已成为 Apache Web 服务器的一部分。如果你想学习如何在 Mac OS X 或 Windows 平台上安装 PHP，请继续阅读。否则，你可以直接跳转到“测试你的安装”章节。\n\
  \n## 在 Mac OS X 上安装 PHP\n\n在 Mac OS X 上通过 Apache 安装 PHP 有几种不同的选择，包括按照上一节描述的从源码编译。某些用户可能认为最简单的方法是从预编译的二进制包安装\
  \ PHP，例如来自 MacPorts（位于 [`www.macports.org/`](http://www.macports.org/)），或者作为 XAMPP\
  \ 全一体化安装包（如第 1 章”））或 MAMP（位于 [`www.mamp.info`](http://www.mamp.info)）。不过，如果你熟悉命令行，我建议按照上一节中的指令“在\
  \ Linux/UNIX 上使用 Apache 编译 PHP”进行操作。\n\n## 在 Windows 上安装 PHP\n\n在 Windows 上安装 PHP\
  \ 只需要下载发行文件。要下载 PHP 发行文件，请访问 PHP for Windows 主页 [`windows.php.net/`](http://windows.php.net/)，并点击链接进入下载页面。获取最新版本的线程安全（thread-safe）ZIP\
  \ 包——在本例中，我们使用的是 `5.4.0`。你的发行包名称将类似于 `php-VERSION.zip`，其中 `VERSION` 是最新的发布版本号。\n\
  \n文件下载到你的系统后，双击它以启动解压软件。该发行包已经设置好了相对路径，因此请将文件提取到名为 `C:\\php\\` 的新目录中，它将在该新目录下放置所有文件和子目录。\n\
  \n接下来，进入 `C:\\php\\` 目录，并将 `php.ini-development` 文件复制并命名为 `php.ini`。现在，为了让基础版本的\
  \ PHP 与 Apache 工作，你需要对 Apache 配置文件进行几处微调。\n\n> 注意\n> 在某些 Windows 系统上，你可能需要设置一个显式环境变量以确保\
  \ PHP 正确运行；设置它不会产生任何副作用，因此即使你不确定是否有必要，也可以放心地设置。关于如何将 PHP 目录添加到 `PATH` 环境变量的信息，请参阅\
  \ PHP FAQ 中的目录：[`www.php.net/manual/en/faq.installation.php#faq.installation.addtopath`](http://www.php.net/manual/en/faq.installation.php#faq.installation.addtopath)。\n\
  \n### 在 Windows 上整合 PHP 与 Apache\n\n为了确保 PHP 和 Apache 能够协同工作，你需要在 `httpd.conf` 文件中添加几项。首先，找到类似下面的部分：\n\
  \n点击此处查看代码图片\n\n```\n# 示例：\n\n# LoadModule foo_module modules/mod_foo.so\n\n#\n\n\
  LoadModule access_module modules/mod_access.so\n\n...\n\n#LoadModule vhost_alias_module\
  \ modules/mod_vhost_alias.so\n```\n\n在该节末尾，添加以下内容：\n\n点击此处查看代码图片\n\n```\nLoadModule\
  \ php5_module C:/php/php5apache2_2.dll\n```\n\n此外，添加以下内容以确保 Apache 知道 `php.ini`\
  \ 所在位置：\n\n```\nPHPIniDir \"C:/php/\"\n```\n\n接下来，查找此部分：\n\n点击此处查看代码图片\n\n```\n\
  #\n\n# AddType 允许你针对特定文件类型添加或覆盖 MIME 配置\n# 文件 mime.types。\n\n#\n```\n\n添加以下行：\n\n\
  点击此处查看代码图片\n\n```\nAddType application/x-httpd-php .php\n```\n\n此语句确保 PHP 引擎将解析以\
  \ `.php` 扩展结尾的文件。你选择的文件名可能有所不同；例如，你可能希望将所有的 `*.html` 文件解析为 PHP 文件。\n\n保存 `httpd.conf`\
  \ 文件并重启 Apache。服务器应该会在不出现警告的情况下启动；PHP 现在已成为 Apache Web 服务器的一部分。\n\n## php.ini 基础\n\
  \n在编译或安装 PHP 之后，你仍然可以通过 `php.ini` 文件更改它的行为。在 Linux/UNIX 系统上，该文件的默认位置是 `/usr/local/php/lib`\
  \ 或你在配置时使用的 PHP 安装位置下的 `lib` 子目录。在 Windows 系统上，此文件应该位于 `PHP` 目录或由 Apache `httpd.conf`\
  \ 文件中 `PHPIniDir` 值指定的另一个目录。\n\n`php.ini` 文件中的指令有两种形式：值（values）和标志（flags）。*值指令（Value\
  \ directives）*的形式为指令名称和一个由等号分隔的值。可能的取值随指令而异。*标志指令（Flag directives）*的形式为指令名称和一个由等号分隔的正项或负项术语。正项包括\
  \ `1`、`On`、`Yes` 和 `True`。负项包括 `0`、`Off`、`No` 和 `False`。空格会被忽略。\n\n> 注意\n> 在 Windows\
  \ 系统上，显式提供 `extension_dir` 的值非常重要。如果你将 PHP 安装在 `C:\\php`，在更改 `php.ini` 后需要重启服务器生效。\n\
  \n## 测试你的安装\n\n测试 PHP 安装的最简单方法是创建一个使用 `phpinfo()` 函数的小脚本。该函数会产生大量的配置信息。打开文本编辑器并输入以下内容：\n\
  \n```php\n<?php phpinfo();\n```\n\n将此文件保存为 `phpinfo.php` 并将其放置在 Web 服务器的根目录下——Mac\
  \ OS X 的 `htdocs` 子目录或 `/Library/WebServer/Documents`。使用浏览器访问此文件，你应该看到类似图 4.1 所示的内容。\n\
  \n![image](img/04fig01.jpg)\n\n**图 4.1 phpinfo() 的结果。**\n\n确切输出取决于你的操作系统、PHP 版本和配置选项。\n\
  \n\n\n\n\n[content]\n\n- 安装失败之前执行 `configure` 或 `make` 命令的任何输出\n- 导致问题的代码的一个相当完整的示例\n\
  \n为什么在向邮件列表提问时有这么多这些注意事项？首先，培养研究能力将使你受益终浅。一个优秀的研究人员通常能够快速、高效地解决问题。在技术列表中发布一个幼稚的问题通常会导致漫长的等待，最后只换来两条信息，让你去查阅归档，而你从初就应该从那里开始寻找答案。\n\
  \n其次，请记住，邮件列表并不等同于技术支持叫中心。没有人付钱来回答你的问题。尽管如此，你仍然可以使用一个令人印象深刻的人才和知识库，其中包含了 PHP 本身的一些创建者。一个好的问题及其答案将会被存档，以帮助其他程序员。提问一个已经被回答过几次的问题只会增加更多噪音。\n\
  \n话如此，不要害怕向列表发布问题。PHP 开发者是一个文明且乐于助助的群体，通过将问题引起社区的关注，你可能正在帮助其他人解决相同的问题。\n\n### PHP\
  \ 脚本基础\n\n让我们直接进入 PHP 脚本。首先，打开你最喜欢的文本编辑器。与 HTML 文档一样，PHP 文件由纯文本组成。你可以使用任何文本编辑器创建它们，大多数流行的\
  \ HTML 编辑器和编程 IDE（集成开发环境）都提供对 PHP 支持。\n\n***\n\n提示\n\n寻找 PHP 友好编辑器的 get 网站是 [`www.php-editors.com`](http://www.php-editors.com)。\n\
  \n***\n\n在列表 4.1 中输入示例，并将文件保存到你 Web 服务器的文档根目录下，使用类似 `first.php` 的名称。\n\n**列表 4.1**\
  \ 一个简单的 PHP 脚本\n\n***\n\n```\n1: <?php\n2:     echo \"<h1>Hello Web!</h1>\";\n3:\
  \ ?>\n```\n\n***\n\n如果你不是直接在为 PHP 脚本提供服务的机器上工作，则需要使用文件传输协议（FTP）或安全拷贝（SCP）客户端将你保存的文档上传到服务器。当文档在服务器上就位后，你应该能够使用浏览器访问它。如果一切顺利，你应该能看到脚本的输出。图\
  \ 4.2 显示了 `first.php` 脚本的输出。\n\n![image](img/04fig02.jpg)\n\n**图 4.2 成功：first.php\
  \ 的输出。**\n\n#### 开始和结束 PHP 语句块\n\n在编写 PHP 时，你需要通知 PHP 引擎你想让它执行你的命令。如果你不这样做，你写的代码将被误认为是\
  \ HTML 并输出到浏览器。你可以使用标记 PHP 代码块开始和结束的特殊标签将你的代码指定为 PHP。表 4.1 显示了四种这样的 PHP 分隔符标签。\n\
  \n**表 4.1 PHP 开始和结束标签**\n\n![image](img/04tab01.jpg)\n\n在表 4.1 的标签中，只有标准（standard）和\
  \ script 标签保证可以在任何配置上运行。你必须在 `php.ini` 文件中显式地启用短标签（short）和 ASP 风格标签。\n\n要激活短标签的识别，你必须确保\
  \ `php.ini` 中的 `short_open_tag` 关设置为 `On`：\n\n```\nshort_open_tag = On;\n```\n\n\
  要激活 ASP 风格标签的识别，你必须在 `php.ini` 中启用 `asp_tags` 设置：\n\n```\nasp_tags = On;\n```\n\n\
  ***\n\n注意\n\n为了确保代码的可移植性和可重用性，最好使用标准标签而不是短标签或 ASP 风格标签，原因很简单：服务器配置是唯一的——使用标准样式是因为你确信它可以作为任何配置的一部分而对其信赖。\n\
  \n***\n\n在你编辑了 `php.ini` 并重启 Apache 后，你应该能够在你的脚本中使用四种样式中的任何一种。这在很大程度上取决于喜好，尽管如果你打算在脚本中包含\
  \ XML，你应该禁用短标签（`<? ?>`）并使用标准标签（`<?php ?>`）。\n\n***\n\n警告字符序列 `<?` 告诉 XML 解析器预期有一个处理指令，因此通常包含在\
  \ XML 文档中。如果你在脚本中包含 XML 并启用了短标签，PHP 引擎可能会混淆 XML 处理指令和 PHP 开始标签。如果你打算在文档中加入 XML，请禁用短标签。\n\
  \n***\n\n让我们过一遍一些合法编写列表 4.1 中代码的方法。根据前面显示的配置更改，你可以使用见过的四种 PHP 开始和结束标签中的任何一种：\n\n\
  ```\n<?\necho \"Hello Web!\";\n?>\n```\n\n```php\n<?php\necho \"Hello Web!\";\n\
  ?>\n```\n\n```php\n<%\necho \"Hello Web!\";\n%>\n```\n\n```html\n<script language=\"\
  php\">\necho \"Hello Web!\";\n</script>\n```\n\n你也可以将单行 PHP 代码与 PHP 开始和结束标签放在同一行：\n\
  \n```php\n<?php echo \"Hello Web!\"; ?>\n```\n\n现在你已经知道如何定义一个 PHP 代码块了，让我们仔细查看列表\
  \ 4.1 中的代码。\n\n#### `echo` 和 `print()` 语句\n\n简单来说，你可以使用 `echo` 输出数据。在大多数情况下，使用 `echo`\
  \ 还是 `print()` 取于喜好。\n\n####  HTML 和 PHP\n\n列表 4.1 中的脚本是纯 PHP。你可以通过在 PHP 开始和结束标签之外添加\
  \ HTML 将其整合到 HTML 文档中，如列表 4.2 所示。\n\n**列表 4.2** 整合到 HTML 中的 PHP 脚本\n\n***\n\n```html\n\
  1: <!DOCTYPE html>\n2: <html>\n3: <head>\n4: <title>包含 PHP 的脚本</title>\n5: </head>\n\
  6: <body>\n7: <h1><?php echo \"hello world\";</h1>\n8: </body>\n9: </html>\n```\n\
  \n***\n\n正如你看到的，将 PHP 代码整合到主要的 HTML 文档中只需输入代码。PHP 引擎会忽略 PHP 打开和关闭标签之外的内容。如果你将列表\
  \ 4.2 的内容保存为 `helloworld.php`，将其置于文档根目录下，然后使用浏览器查看它，如图 4.3 所示，你将看到加粗标题 `hello world`\
  \ 字符串。如果你查看文档源，如图 4.4 所示，该列表看起来与一个普通的 HTML 文档完全一样。\n\n![image](img/04fig03.jpg)\n\
  \n**图 4.3 在浏览器中查看的 helloworld.php 输出。**\n\n![image](img/04fig04.jpg)\n\n**图 4.4\
  \ 作为 HTML 源代码的 helloworld.php 输出。**\n\n[/content]\n\n\n\n\n你在编写代码时看起来清晰的代码，在 6 个月后尝试修改它时可能看起来像是一团无法挽救的乱麻。在编写代码的同时添加注释可以节省你以后的时间，并让其他程序员更容易处理你的代码。\n\
  \n`comment`（注释）是脚本中 PHP 引擎忽略的文本。注释可以使代码更具可读性或对脚本进行标注。\n\n单行注释以两个正斜杠（`//`）开头——这是推荐的样式——或者以单个井号（`#`）开头。PHP\
  \ 引擎会忽略这些标记之后到行尾或 PHP 关闭标签之间的所有文本：\n\n```php\n// this is a comment\n\n#  this is\
  \ another comment\n```\n\n多行注释以正斜杠加星号（`/*`）开始，以星号加正斜杠（`*/`）结束：\n\n```php\n/*\n\n\
  this is a comment\n\nnone of this will\n\nbe parsed by the\n\nPHP engine\n\n*/\n\
  ```\n\n### 总结\n\n在本章中，你学习了如何在 Linux/UNIX、Mac OS X 或 Windows 上为 Apache 安装并配置 PHP\
  \ 5.4.0。你学习了 Linux/UNIX 编译脚本中的各种 `configure` 选项可以更改支持的功能。你学习了 `php.ini` 以及如何更改其指令的值。\n\
  \n通过使用 `phpinfo()` 函数，你测试了安装并生成了一份配置值列表。你使用文本编辑器创建了一个简单的 PHP 脚本。你检查了四组用于开始和结束 PHP\
  \ 代码块的标签。\n\n最后，你学习了如何使用 `echo` 和 `print` 语句将数据发送到浏览器，并将 HTML 和 PHP 结合在脚本中。在下一章中，你将使用这些技能测试\
  \ PHP 语言的一些基础构建模块，包括变量、数据类型和运算符。\n\n### 问答\n\n**Q. 本章涵盖了 Linux/UNIX、Mac OS X 或 Windows\
  \ 以及 Apache Web 服务器的安装。这意味着书中介绍的内容不适用于其他服务器和操作系统吗？**\n\n**A.** 不。PHP 的巨大优势之一是它可以在多个平台上运行。你可以在\
  \ PHP 手书中找到不同 Web 服务器的安装说明以及数据库支持的配置指令。虽然书中的示例专门针对针对 PHP、MySQL 和 Apache 的组合，但要使用不同的\
  \ Web 服务器或数据库运行这些示例，只需进行微调即可。\n\n**Q. 最好使用什么起始和结束标签？**\n\n**A.** 这在很大程度上取决于个人偏好。为了可移植性，优先使用标准标签（`<?php\
  \ ?>`）。\n\n**Q. 创建 PHP 代码时，我应该避免哪些编辑器？**\n\n**A.** 不要使用会为打印格式文本的文字处理器（例如 Microsoft\
  \ Word）。即使你将此类类型编辑器创建的文件保存为纯文本格式，隐藏字符也可能渗透到代码中。\n\n**Q. 我应该什么时候给代码加注释？**\n\n**A.**\
  \ 同样，这取决于个人偏好。一些短脚本即使在很长时间之后也是自解释的。但对于任何长度或复杂性的脚本，你都应该给代码注释。从长远来看，代码中的注释通常能节省你的时间和精力的。\n\
  \n### 工作坊\n\n工作坊旨在帮助你回顾所学知识并开始付诸实践。\n\n### 测验\n\n**[1].** 从 Linux/UNIX 操作系统，如何获取配置选项（即传递给\
  \ PHP 发行版中 `configure` 脚本的选项）的帮助？\n\n**[2].** 你应该在 Apache 配置文件中添加哪一行以确保识别 `.php`\
  \ 扩展？\n\n**[3].** PHP 的配置文件文件叫什么名字？\n\n**[4].** 浏览你网站的人能读取你成功安装的 PHP 脚本源代码吗？\n\n\
  ### 答案\n\n**[1].** 你可以通过调用 PHP 发行目录中的 `configure` 脚本并传递 `--help` 参数来获取配置选项的帮助：\n\
  \n```bash\n./configure --help\n```\n\n**[2].** 这一行确保 Apache 将以 `.php` 扩展结尾的文件视为\
  \ PHP 脚本：\n\n```apache\nAddType application/x-httpd-php .php\n```\n\n**[3].** PHP\
  \ 的配置文件名为 `php.ini`。\n\n**[4].** 不，用户只会看到你脚本的输出。\n\n### 活动\n\n**1.** 在你的系统上安装 PHP。如果已经安装，请检查你的\
  \ `php.ini` 文件并确认你的配置。\n\n**2.** 熟悉创建、上传和运行 PHP 脚本的过程。特别是，创建一个你自己的“Hello World”脚本。向其中添加\
  \ HTML 代码，并添加额外的 PHP 块。尝试不同的 PHP 分隔符标签。在你的配置中启用了哪些标签？查看你的 `php.ini` 文件以确认你的发现。别忘了给你的代码添加一些注释。\n\
  \n### 第二部分：PHP 语言结构\n\n## 第 5 章 PHP 的构建模块\n\n在本章中，你将学习以下内容：\n\n- 关于变量——它们是什么，为什么需要它们，以及如何使用它们\n\
  - 如何定义和访问变量\n- 关于数据类型\n- 关于一些常用的运算符\n- 如何使用运算符创建表达式\n- 如何定义和使用常量\n\n在本章中，你将亲手操作\
  \ PHP 语言的一些核心组件。对于你们初学编程的人士来说，有时可能会感到不知所措，但不要担心——你以后可以随时参考这一章。专注于概念，而不是背记特性，因为这些元素在脚本中会反复出现。最终你会理解的，即使第一次不是。\n\
  \n如果你已经是一个经验丰富的程序员，也应该至少扫读这一章，因为它涵盖了几个关于全局变量、数据类型的 PHP 特有功能。\n\n## 变量\n\n`variable`（变量）是一个你可以定义的特殊容器，它随后“持有”一个值，例如数字、字符串、对象、数组或布尔值。变量是编程的基础。没有变量，你将被迫硬编码脚本中使用的每个特定值。下面的硬编码语句将两个数字相加并打印结果，解决了一个简单的数学问题：\n\
  \n```php\necho (2 + 4);\n```\n\n然而，这段代码对于那些专门想知道 2 和 4 之和的人有用。为了突破这个限制，你可以编写一个脚本来计算另一组数字（例如\
  \ 3 和 5）的和。但这种编程方法显然是荒谬的，这就是变量大显身的时候。\n\n有了变量，你可以创建操作的模板（例如相两个数字），而无需担心变量代表的具体值。值在脚本运行时赋予变量，可能通过用户输入、数据库查询或脚本早期其他操作的结果。\n\
  \n变量由你选择的名称加上美元符号（`$`）组成。变量名可以包含字母、数字和下划线（`_`），但不能包含空格。名称必须以字母或下划线开头。以下列表显示了一些合法的变量：\n\
  \n`$a`\n\n`$a_longish_variable_name`\n\n`$2453`\n\n`$sleepyZZZZ`\n\n\n\n\n\n你的变量名应该具有意义性，并在风格上保持一致。例如，如果你的脚本处理名称和密码值，不要创建一个名为\
  \ `$n` 的变量表示名称，为密码创建一个名为 `$p` 的变量——除了你特定的那个时刻之外，这些名字对其他人来说并没有意义。如果你在几周后拿起该脚本，你可能会认为\
  \ `$n` 是 `number`（数字）的变量而不是 `name`（名称），认为 `$p` 代表 `page`（页面）而不是 `password`（密码）。如果同事必须修改你的脚本呢？那个人将如何知道\
  \ `$n` 和 `$p` 代表什么？你可以在脚本中使用任何你喜欢的命名规范，只要这些名称是描述性的，并遵循某种他人可以理解的模式即可。\n\n* * *\n\n\
  分号（`;`）——也称为 `instruction terminator`（指令终止符）——用于结束 PHP 语句。之前代码片段中的分号并不是变量名的一部分，而是用于结束声明该变量为“活跃”的语句。要声明一个变量，你只需要将其包含在脚本中即可。当你声明一个变量时，通常会在同一语句中为其赋值，如下所示：\n\
  \n```\n$num1 = 8;\n$num2 = 23;\n```\n\n前面的几行声明了两个变量，并使用赋值运算符（`=`）为它们赋值。你将在本章节后面的“\
  \ 运算符和表达式”部分中详细学习赋值。在为变量赋值后，你可以完全像处理值本身一样处理它们。换句话说：\n\n```\necho $num1;\n```\n\n\
  等同于\n\n```\necho 8;\n```\n\n只要 `$num1` 被赋值为 `8`。\n\n### 全局变量\n\n除了变量命名的规则外，还有关于变量可用性的规则。通常情况下，变量的赋值值只存在于其所属的函数或脚本中。例如，如果你有一个\
  \ `scriptA.php`，其中包含一个名为 `$name` 且值为 `joe` 的变量，而你想创建一个同样使用 `$name` 变量的 `scriptB.php`，你可以为第二个\
  \ `$name` 变量赋值为 `jane` 而不会影响 `scriptA.php` 中的变量。`$name` 变量的值对于每个脚本都是 `local`（局部）的，且赋值值之间是相互独立的。\n\
  \n然而，你也可以在脚本或函数将 `$name` 变量定义为 `global`（全局）。如果 `$name` 变量在 `scriptA.php` 和 `scriptB.php`\
  \ 中都被定义为全局变量，并且这些脚本相互连接（即一个脚本调用另一个或包含另一个），那么这个现在共享的 `$name` 变量将只有一个值。全局变量作用域的示例将在\
  \ 第 7 章 “使用函数”中进行详细解释。\n\n### 超全局变量\n\n除了你自己创建的全局变量外，PHP 还有几个预定义的变量，被称为 `superglobals`。这些变量始终存在，其值对你所有的脚本可用。以下每个超全局实际上都是其他变量的数组：\n\
  \n- `$_GET` 包含通过 `GET` 方法提供脚本的任何变量。\n- `$_POST` 包含通过 `POST` 方法提供脚本的任何变量。\n- `$_COOKIE`\
  \ 包含通过 cookie 提供的脚本的任何变量。\n- `$_FILES` 包含通过文件上传提供脚本的任何变量。\n- `$_SERVER` 包含标头、文件路径和脚本位置等信息。\n\
  - `$_ENV` 包含作为服务器环境一部分提供脚本的任何变量。\n- `$_REQUEST` 包含通过 `GET`、`POST` 或 `COOKIE` 输入机制提供脚本的任何变量。\n\
  - `$_SESSION` 包含当前注册在会中的任何变量。\n\n书中的示例在所有适用情况下都使用了超全局变量。使用超全局变量对于创建安全应用程序至关重要，因为它们减少了用户向脚本注入输入的可能性。通过编写脚本仅以你定义的方式接受你想要的内容（例如，来自使用\
  \ `POST` 方法的表单，或来自会话），你可以消除由编写松散的脚本所产生的问题。\n\n## 数据类型\n\n不同类型的数据占据的内存不同，在被脚本处理时可能会被区别对待。因此，某些编程语言要求程序员提前声明变量将包含什么类型的数据。相比之下，PHP\
  \ 是 `loosely typed`（弱类型）的，这意味着它在数据赋值给每个变量时自动确定数据类型。\n\n这种自动类型是一把双刃剑。一方面，这意味着变量可以被灵活使用——在某个实例中，变量可以包含一个字符串，然后在脚本稍后部分它可以包含一个整数或其他数据类型。另一方面，如果你在较大的脚本中明确预期一个变量包含一种数据类型，但实际上它包含的是完全不同的内容，这种灵活性可能会导致问题。例如，假设你创建了处理数组变量的代码。如果该变量实际上包含一个数值而没有数组结构，那么当代码尝试对该变量执行特定于数组的操作时，就会发生错误。\n\
  \n表 5.1 显示了 PHP 中可用的八种标准数据类型。\n\n**表 5.1 标准数据类型**\n\n![image](img/05tab01.jpg)\n\
  \n资源类型通常由处理外部应用程序或文件的函数返回。\n\n\n\n\n\n当在第 2 行声明变量 `$testing` 时，没有给它赋值，因此当在第 3 行测试该变量以检查它是否为\
  \ `NULL`（使用 `is_null()`）时，结果为 `1`（真）。\n\n***\n\n### 注意\n如果你配置了 PHP 显示所有通知（notice）、警告和错误，当你运行此脚本时将看到一条通知：\n\
  \n点击此处查看代码图像\n\nNotice: 未定义的变量：`testing` 位于文件 `/path/to/testtype.php` 的第 3 行\n\n\
  当使用 `php-development.ini` 而不是 `php-production.ini` 时，默认开启通知，这在调试脚本时非常有帮助。\n\n***\n\
  \n在检查 `$testing` 是否为 `NULL` 之后，使用 `=` 符号为 `$testing` 赋值，然后使用相应的 `is_*` 函数对变量 `istested`\
  \ 进行处理。第 5 行赋值给 `$testing` 变量的整数是一个整数或实数。简单来说，你可以将*整数*看作是一个不带小数点的数字。第 8 行赋值给 `$testing`\
  \ 变量的*字符串*是字符集合。在脚本中处理字符串时，它们应该始终被双引号或单引号（`\"` 或 `''`）包围。第 11 行赋值给 `$testing` 变量的*双精度*是一个浮点数（即包含小数点的数字）。第\
  \ 14 行赋值给 `$testing` 变量的*布尔值*可以有两个特殊值之一：`true` 或 `false`。在第 17 行，使用 `array()` 函数创建了一个数组，你将在第\
  \ 8 章“处理数组”中学习更多。这个特定的数组包含三个项目，脚本忠实地报告 `$testing` 的类型为数组。\n\n从第 20 行到脚本结束，没有重新给\
  \ `$testing` 赋值——仅测试了其类型。第 20 行和第 22 行分别测试 `$testing` 是否为数值或资源类型，由于它不是，因此没有向用户显示值。在第\
  \ 24 行，脚本再次测试 `$testing` 是否为数组，因为确实是，所以显示了值 `1`。\n\n### 使用 `settype()` 修改类型\n\n\
  PHP 还提供了 `settype()` 函数，用于更改变量的类型。要使用 `settype()`，你将要更改的变量和要转换到的新类型放在括号之间，并用逗号分隔元素，如下所示：\n\
  \n```\nsettype($variabletochange, 'new type');\n```\n\n列表 5.2 将值 `3.14`（一个浮点数）转换为本章检查的四种标准类型中的每一种。\n\
  \n**列表 5.2** 使用 `settype()` 修改变量类型\n\n点击此处查看代码图像\n\n***\n\n```php\n1:  <?php\n2:\
  \  $undecided = 3.14;\n\n3:  echo \"is \".$undecided.\" a double? \".is_double($undecided).\"\
  <br/>\"; // double\n4:  settype($undecided, 'string');\n5:  echo \"is \".$undecided.\"\
  \ a string? \".is_string($undecided).\"<br/>\"; // string\n6:  settype($undecided,\
  \ 'integer');\n7:  echo \"is \".$undecided.\" an integer? \".is_integer($undecided).\"\
  <br/>\"; //\n//    integer\n8:  settype($undecided, 'double');\n9:  echo \"is \"\
  .$undecided.\" a double? \".is_double($undecided).\"<br/>\"; // double\n10: settype($undecided,\
  \ 'bool');\n11: echo \"is \".$undecided.\" a boolean? \".is_bool($undecided).\"\
  <br/>\"; // boolean\n12: ?>\n```\n\n***\n\n***\n\n### 注意\n根据 PHP 手册，在浮点数的情况下返回的是\
  \ `\"double\"`，而不是简单的 `\"float\"`。你的眼睛没有欺骗你。\n\n***\n\n在每种情况下，我们都使用合适的 `is_*` 函数来确认新的数据类型，并使用\
  \ `echo` 将变量 `$undecided` 的值打印到浏览器。当我们第 6 行将字符串 `\"3.14\"` 转换为整数时，小数点之外的任何信息都会永远丢失。这就是为什么当我们在第\
  \ 8 行将其改回双精度后，`$undecided` 包含了 `3`。最后，在第 10 行，我们将 `$undecided` 转换为布尔值。除 `0` 之外的任何数字转换为布尔值都会变为\
  \ `true`。在 PHP 中打印布尔值时，`true` 表示 `1`，`false` 表示空字符串；因此在第 11 行，`$undecided` 被打印为\
  \ `1`。\n\n将这些行放入名为 `settype.php` 的文件中，并将此文件放在你的 Web 服务器文档根目录下。当你通过浏览器访问此脚本时，它会产生以下输出：\n\
  \nis 3.14 a double? 1\nis 3.14 a string? 1\n（此处省略了后续重复的原文，根据要求不重复输出重复的翻译内容）\n\n\
  ### 注意\n如果你配置了 PHP 显示所有通知、警告和错误，当你运行此脚本时将看到一条通知：\n\n点击此处查看代码图像\n\nNotice: 未定义的变量：`testing`\
  \ 位于文件 `/path/to/testtype.php` 的第 3 行\n\n（注：由于原文中存在大量重复的段落，根据“一定不要重复输出原文”的原则，此处仅保留核心逻辑翻译及结构）\n\
  \n### 通过强制转换（Casting）修改类型\n使用 `settype()` 更改变量类型与通过*强制转换*更改类型的主要区别在于，强制转换会创建一个副本，而保持原始值不变。例如，强制转换\
  \ `$undecided` 会创建一个副本，然后将其转换为转换时指定的类型并存储在变量 `$holder` 中。\n\n列表 5.3 修改变量类型\n\n\n\
  \n\n现在你已经了解了如何通过 `settype()` 或强制类型转换将变量的内容从一种类型转换为另一种类型，请考虑一下这为什么有用。这并不是一个你需要经常使用的过程，因为当脚本上下文需要更改时，PHP\
  \ 会自动为你完成变量类型转换。然而，这种自动转换是暂时的，你可能希望让变量持久地持有特定的数据类型，这就是为什么 PHP 给了你专门更改类型的能力。\n\n\
  例如，用户在 HTML 表单中输入的数字是以字符串类型提供给脚本的。如果你尝试将两个字符串相加（因为它们包含数字），PHP 会在加法发生过程中很好地将这些字符串转换为数字。所以\n\
  \n`\"30cm\" + \"40cm\"`\n\n结果为 `7`。\n\n***\n\n### 注意\n这里的通用术语 `number` 指的是整数和浮点数。如果用户输入是浮点形式，且相加的字符串是\
  \ `\"3.14cm\"` 和 `\"4.12cm\"`，那么提供的答案将是 `7.26`。\n\n***\n\n在将字符串转换为整数或浮点的过程中，PHP\
  \ 会忽略任何非数字字符。字符串会被截断，从第一个非数字字符开始之后的所有字符都会被忽略。因此，虽然 `\"30cm\"` 被转换为 `\"30\"`，但字符串\
  \ `\"6ft2in\"` 变成了 `6`，因为字符串的其余部分求值结果为 0`。\n\n你可能想自己清理用户输入并在脚本以特定方式使用它。假设用户被要求提交一个数字。我们可以通过声明变量并将用户的输入赋值给它来模拟：\n\
  \n```php\n$test = \"30cm\";\n```\n\n如你所示，用户给他的数字添加了单位——用户没有输入 `\"30\"`，而是输入了 `\"\
  30cm\"`。你可以通过强制转换为整数来确保用户输入是干净的：\n\n点击此处查看代码图片\n\n```php\n$newtest = (integer) $test;\n\
  \necho \"Your imaginary box has a width of $newtest centimeters.\";\n```\n\n产生的输出如下：\n\
  \n点击此处查看代码图片\n\nYour imaginary box has a width of 30 centimeters.\n\n如果用户输入没有经过强制转换，并且在打印关于盒子宽度的语句时使用了原始变量值\
  \ `$test` 代替 `$newtest`，结果将是：\n\n点击此处查看代码图片\n\nYour imaginary box has a width of\
  \ 30cm centimeters.\n\n这个输出看起来很奇怪；事实上，它看起来像是未经清理的复读用户输入（而这正是它的事实）。\n\n### 为什么要测试类型？\n\
  \n知道变量的类型可能有什么用？在编程中，经常会出现数据从另一个源（例如函数）传递给你的情况。在第 7 章中，你学习了如何创建函数；数据经常在一个或多个函数之间传递，因为它们可以接受调用它们的代码传入的参数。为了让函数处理给定的数据，最好的做法是先验证函数接收的是正确数据类型的值。例如，一个期望类型为\
  \ `resource` 的数据的函数在接收字符串时将无法良好工作。\n\n## 运算符与表达式\n\n根据你目前所学到的知识，你可以将数据分配给变量，甚至可以研究并更改变量的数据类型。但是，如果你无法操作已存储的数据，编程语言就没那么用。`Operators`（运算符）是用于操作变量中存储的数据的符号，使得可以使用一个或多个值产生一个新值，或者检查数据的有效性以确定条件中的下一步，等等。被运算符操作的值被称为\
  \ `operand`（操作数）。\n\n***\n\n### 注意\n`operator`（运算符）是一个符号或系列符号，当它与值结合使用时会执行一个操作，并通常产生一个新值。\n\
  \n`operand`（操作数）是一个与运算符结合的值。一个运算符通常有两个或多个操作数。\n\n***\n\n在这个简单的示例中，两个操作数与一个运算符结合产生了一个新值：\n\
  \n`(4 + 5)`\n\n整数 `4` 和 `5` 是操作数。加法运算符 (`+`) 对这些操作数进行操作，产生整数 `9`。运算符几乎位于两个操作数之间，尽管你将在本章稍后的部分看到少数例外。\n\
  \n操作数与运算符结合产生结果的组合被称为 `expression`（表达式）。虽然运算符及其操作数构成了表达式的基础，但表达式并不一定包含运算符。事实上，PHP\
  \ 中的表达式被定义为任何可以被用作值的内容。这包括整数常量（如 `654`）、变量（如 `$user`）以及函数调用（如 `is_int()`）。例如，表达式\
  \ `(4 + 5)` 由两个表达式（`4` 和 `5`）和一个运算符 (`+`) 组成。当表达式产生一个值时，通常说它 `resolve to`（解析为）该值。也就是说，在考虑所有子表达式时，该表达式可以被视为该值本身的代码。在这种情况下，表达式\
  \ `(4 + 5)` 解析为 `9`。\n\n***\n\n### 注意\n`expression`（表达式）是任何函数、值和运算符的组合，这些组合最终解析为一个值。根据经验法则，如果你可以像使用值一样使用它，它就是一个表达式。\n\
  \n***\n\n现在你已经掌握了基本原理，是时候浏览 PHP 中常用的运算符了。\n\n#### 赋值运算符\n\n你在每个声明变量的示例中看到了赋值运算符；赋值运算符由单个字符\
  \ `=` 组成。赋值运算符获取右操作数的值并将其赋值给左操作数。\n\n$name = \"Jimbo\"` 这个构造也是一个表达式。虽然一眼看上去赋值运算符只是改变了变量\
  \ `$name` 而产生值，但使用赋值运算符的语句总是解析为右操作数的副本。因此\n\n```php\necho $name = \"Jimbo\";\n```\n\
  \n向浏览器打印字符串 `\"Jimbo\"`，同时将值 `\"Jimbo\"` 赋值给变量 `$name`。\n\n#### 算术运算符\n\n`arithmetic\
  \ operators`（算术运算符）的作用正如你预期的——它们执行算术运算。表 5.2 列出了这些运算符以及用法示例和结果。\n\n**表 5.2 算术运算符**\n\
  \n![image](img/05tab02.jpg)\n\n加法运算符将右操作数加到左操作数。减法运算符从左操作数减去右操作数。除法运算符将左操作数除以右操作数。乘法运算符将左操作数乘以右操作数。模运算符返回左操作数除以右操作数的余数。\n\
  \n#### 拼接运算符\n\n拼接运算符由单个点 (`.`) 表示。该运算符将两个操作视为视为字符串并将右操作数附加左操作数之后。所以\n\n`\"hello\"\
  .\" world\"`\n\n返回\n\n`\"hello world\"`\n\n注意，单词之间的空格出现是因为第二个操作数有一个领先空格（`\" world\"\
  ` 而不是 `\"world\"`）。拼接运算符字面上将两个字符串连接在一起，而不添加任何填充。所以，如果你尝试拼接两个没有领先或尾空格的字符串，例如\n\n\
  `\"hello\".\"world\"`\n\n你将得到如下结果：\n\n`\"helloworld\"`\n\n\n\n\n无论在使用连接运算符时使用的操作数数据类型是什么，它们都会被视为字符串，且结果始终是字符串类型。在本书中，你将经常遇到连接操作，当某种类型的表达式结果必须与字符串结合时，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\n$cm = 212;\n\necho \"the width is \".($cm/100).\" meters\"\
  ;\n```\n\n### 组合赋值运算符\n\n虽然只有一个真正的赋值运算符，但 PHP 提供了许多组合运算符（combination operators），它们在转换左侧操作数并返回结果的同时，也会修改变量的原始值。按照规定，运算符会使用操作数但不会改变它们的原始值，但组合赋值运算符打破了这一规则。一个组合赋值运算符由一个标准运算符符号后跟一个等号组成。组合赋值运算符可以省去你在脚本中分两个不同步骤使用两个运算符的麻烦。例如，如果你有一个值为\
  \ `4` 的变量，并且你想将这个值增加 4，你可能会看到这样的代码：\n\n```\n$x = 4;\n$x = $x + 4; // $x 现在等于 8\n\
  ```\n\n然而，你也可以使用组合赋值运算符（`+=`）来相加并返回新值，如下：\n\n```\n$x = 4;\n$x += 4; // $x 现在等于 8\n\
  ```\n\n每个算术运算符以及连接运算符都有对应的组合赋值运算符。表 5.3 列出了这些新运算符，并展示了它们的用法示例。\n\n**表 5.3 一些组合赋值运算符**\n\
  \n![image](img/05tab03.jpg)\n\n表 5.3 中的每个示例都使用右侧操作数的值来转换 `$x` 的值。后续对 `$x` 使用将引用新值。例如\n\
  \n```\n$x = 4;\n$x += 4; // $x 现在等于 8\n$x += 4; // $x 现在等于 12\n$x -= 3; // $x 现在等于\
  \ 9\n```\n\n这些运算符贯穿于书中脚本之中。当你开始创建动态文本时，会经常看到组合连接赋值运算符。遍历脚本并向字符串中添加内容（例如动态构建表示表格的\
  \ HTML 标记），是使用组合赋值运算符的典型示例。\n\n### 自动递增和减少整数变量\n\n在 PHP 中编写代码时，你经常发现有必要递增或减少整数类型的变量。你通常需要在计算循环次数时这样做。你已经学习了两种实现此方法——要么使用加法运算符增加\
  \ `$x` 的值\n\n```\n$x = $x + 1; // $x 递增 1\n```\n\n或者使用组合赋值运算符\n\n```\n$x += 1; //\
  \ $x 递增 1\n```\n\n在这两种情况下，新值都会被赋值给 `$x`。由于这类表达式很常见，PHP 提供了一些特殊运算符，允许你对整数变量加上或减去整数常量\
  \ `1`，并将结果赋值给变量本身。这些被称为后置增（post-increment）和后置减（post-decrement）运算符。后置增运算符由附加变量名后的两个加号组成：\n\
  \n```\n$x++; // $x 递增 1\n```\n\n该表达式将变量 `$x` 所代表的值加 1。以同样的方式使用两个减号则会减少变量：\n\n```\n\
  $x--; // $x 减少 1\n```\n\n如果你在条件运算符结合使用后置增或后置减运算符，操作数只在第一次操作完成后才被修改：\n\n```\n$x =\
  \ 3;\n$y = $x++ + 3;\n```\n\n在此实例中，`$y` 先变为 `6`（3 + 3 的结果），然后 `$x` 递增。\n\n在某些情况下，你可能想在执行测试之前在测试表达式中递增或减少变量。PHP\
  \ 前置增（pre-increment）和前置减（pre-decrement）运算符来实现此目的。这些运算符的行为与后置增减运算符相同，但它们将加或减符号放在变量前面：\n\
  \n```\n++$x; // $x 递增 1\n--$x; // $x 减少 1\n```\n\n如果将这些运算符作为测试表达式的一部分，递增发生在测试之前。例如，在下一个片段中，`$x`\
  \ 在与 `4` 进行比较之前会被递增：\n\n```\n$x = 3;\n++$x < 4; // false\n```\n\n测试表达式返回 `false`，因为\
  \ `4` 并不小于 `4`。\n\n### 比较运算符\n\n比较运算符使用操作数执行比较测试，如果测试成功则返回布尔值 `true`，如果测试失败则返回 `false`。这种类型的表达式在脚本中使用控制结构（如\
  \ `if` 和 `while` 语句）时非常有用。本书在第 6 章“PHP 中的流程控制函数](#ch06.html_ch06)”中涵盖了 `if` 和 `while`\
  \ 语句。\n\n例如，要测试 `$x` 中的值是否小于 `5`，可以使用小于运算符作为表达式的一部分：\n\n```\n$x < 5\n```\n\n如果 `$x`\
  \ 包含 `3`，该表达式为 `true`。如果 `$x` 包含 `7`，则该表达式为 `false`。表 5.4 列出了比较运算符。\n\n**表 5.4 比较运算符**\n\
  \n![image](img/05tab04.jpg)\n\n这些运算符最常用于整数或浮点数。请务必理解 `==` 和 `=` 运算符之间的区别。`==` 测试相等性，而\
  \ `=` 运算符赋值。此外，记住 `===` 测试值和类型的相等。\n\n### 使用逻辑运算符创建复杂表达式\n\n逻辑运算符测试布尔值的组合。例如，`or`\
  \ 运算符（用两个竖线 `||` 或单词 `or` 表示）在左侧或右侧操作数为真时，返回布尔值 `true`：\n\n```\ntrue || false\n\
  ```\n\n此表达式返回 `true`。\n\n`and` 运算符（用两个和符号 `&&` 或单词 `and` 表示）仅在左右操作数均为真时才返回布尔值 `true`：\n\
  \n```\ntrue && false\n```\n\n此表达式返回 `false`。你不太使用逻辑运算符来测试布尔常量，因为测试两个或多个解析为布尔值的表达式更为合理。例如\n\
  \n```\n($x > 2) && ($x < 15)\n```\n\n如果 `$x` 包含大于 2 且小于 15 的值，则该表达式返回 `true`。在比较表达式中使用括号是为了使代码更易读，并指示表达式求值的优先级。表\
  \ 5.5 列出了逻辑运算符。\n\n**表 5.5 逻辑运算符**\n\n![image](img/05tab05.jpg)\n\n你可能会疑惑为什么 `or`\
  \ 和 `and` 运算符都有两个版本，这是一个很好的问题。答案在于运算符优先级，我们接下来将讨论。\n\n### 运算符优先级\n\n当你在表达式中使用运算符时，PHP\
  \ 引擎通常从左到右读取你的表达式。但是，对于使用多个运算符的复杂表达式，如果没有引导，PHP 引擎可能会被误导。首先考虑一个简单的例子：\n\n```\n4\
  \ + 5\n```\n\n这里没有混淆之处；PHP 仅仅将 4 加 5。但下面的包含两个运算符的片段又是呢：\n\n```\n4 + 5 * 2\n```\n\
  \n\n\n\n\n这带来了一个问题。`PHP` 应该是找到 `4` 和 `5` 的和，然后乘以 `2`，得到结果 `18` 吗？还是意味着 `4` 加上 `5`\
  \ 乘以 `2` 的结果，解析为 `14`？如果你简单地从左到右读取，前者是正确的。然而，`PHP` 对不同的运算符赋予了不同的优先级，因为乘法运算符的优先级高于加法运算符，因此该问题的第二种解决方案是正确的：`4`\
  \ 加上 `5` 乘以 `2` 的结果。\n\n然而，你可以通过在表达式周围加上括号来覆盖运算符优先级。在下面的片段中，加法表达式会在乘法表达式之前求值：\n\n\
  ```\n(4 + 5) * 2\n```\n\n无论复杂表达式中的运算符优先级如何，使用括号使你的代码更清晰都是一个好意，这可以避免产生某些错误，例如在购物车情况下对错误的小计应用销售税。以下是本章涵盖的运算符按优先级排序的列表（优先级最高的列在前面）：\n\
  \n`++`, `--`, `(cast)`\n\n`/`, `*`, `%`\n\n`+`, `-`\n\n`<`, `<=`, `=>`, `>`\n\n\
  `==`, `===`, `!=`\n\n`&&`\n\n`||`\n\n`=`, `+=`, `-=`, `/=`, `*=`, `%=`, `.=`\n\n\
  `and`\n\n`xor`\n\n`or`\n\n如你所示，`or` 的优先级低于 `||`，`and` 的优先级低于 `&&`，因此你可以使用低优先级的逻辑运算符来改变复杂测试表达式的读取方式。在下面的片段中，这两个表达式是等价的，但第二个更易读：\n\
  \n```\n$x and $y || $z\n$x && ($y || $z)\n```\n\n更进一步，下面的片段更加简单：\n\n```\n$x and\
  \ ($y or $z)\n```\n\n然而，所有三个示例都是等价的。优先级顺序是 `PHP` 中同时存在 `&&` 和 `and` 的唯一原因。`||` 和\
  \ `or` 也是如此。在大多数情况下，使用括号比利用这些运算符优先级差异的代码更清晰，产生的错误也更少。本书倾向于使用更常用的 `||` 和 `&&` 运算符，并依赖括号语句来设置特定的运算符优先级。\n\
  \n## 常量\n\n变量提供了一种灵活的数据存储方式，因为你可以在脚本执行的任何时候更改它们的值以及它们存储的数据类型。然而，如果你想处理一个在脚本执行过程中必须保持不变的值，你可以定义并使用一个\
  \ `constant`（常量）。你必须使用 `PHP` 内置的 `define()` 函数来创建常量，随后它无法更改，除非你显式地再次 `define()`\
  \ 它。要使用 `define()` 函数，请将常量名和你想给它的值放在括号内，并用逗号隔开：\n\n```\ndefine(\"YOUR_CONSTANT_NAME\"\
  , 42);\n```\n\n你想要设置的值可以是数字、字符串或布尔值。按照习惯，常量名应该使用大写字母。只需通过常量名访问常量；不需要美元符号符号。列表 5.4\
  \ 向你展示如何定义和访问常量。\n\n**列表 5.4** 定义和访问常量\n\n点击此处查看代码图像\n\n* *\n\n```\n1: <?php\n2:\
  \ define(\"THE_YEAR\", \"2012\");\n3: echo \"It is the year \".THE_YEAR;\n4: ?>\n\
  ```\n* *\n\n* *\n\n提示\n\n常量可以使用你脚本中的任何地方，包括存储在外部文件中的函数。\n\n* *\n\n注意在第 `3` 行中，使用了连接运算符将常量持有的值附加到字符串\
  \ `\"It is the year \"` 之后，因为 `PHP` 不区分引号内的常量和字符串。\n\n将这几行代码放入名为 `constant.php`\
  \ 的文本文件中，并将此文件放在你的 Web 服务器的文档根目录（web server document root）中。当你通过 Web 浏览器访问此脚本时，它会产生以下输出：\n\
  \nIt is the year 2012\n\n`define()` 函数还可以接受第三个布尔参数，决定常量名是否区分大小写。默认情况下，常量名是区分大小写的。然而，通过向\
  \ `define()` 函数传递 `true`，你可以更改这种行为。所以，如果你将我们的 `THE_YEAR` 常量设置为：\n\n```\ndefine(\"\
  THE_YEAR\", \"2012\", true);\n```\n\n你就可以在不考虑大小写的情况下访问它的值：\n\n```\necho the_year;\n\
  echo ThE_YeAr;\necho THE_YEAR;\n```\n\n前面的三个表达式是等价的，且结果都是 `2012`。此功能可以为处理我们代码的其他程序员使脚本更友好一点，因为当他们在访问我们已经定义的常量时，不需要考虑大小写。然而，考虑到其他常量*确实*是区分大小写的，这可能会增加困惑而不是减少困惑，因为程序员会忘记应该以何种方式处理哪些常量。除非你有迫切的理由这样做，否则最安全的办法是保持你的常量区分大小写，并使用大写字母定义它们，这是一个易于记忆（更不用说标准的）的约定。\n\
  \n#### 预定义常量\n\n`PHP` 自动为你提供了一些内置常量。例如，`__FILE__` 常量返回 `PHP` 正在读取的文件名；`__LINE__`\
  \ 常量返回当前行号。这些都是所谓的魔法常量的两个例子，因为它们不是静态定义的，而是根据它们使用的上下文而变化的。完整列表请参见 [`www.php.net/manual/language.constants.predefined.php`](http://www.php.net/manual/language.constants.predefined.php)。你还可以通过\
  \ `PHP_VERSION` 常量找出解释脚本的 `PHP` 版本，这在发送错误报告时包含版本信息可能非常有用。完整列表请参见 [`www.php.net/manual/language.constants.predefined.php`](http://www.php.net/manual/language.constants.predefined.php)。\n\
  \n### 总结\n\n本章介绍了 PHP 语言的一些基本功能。你学习了变量以及如何使用赋值运算符为它们赋值。你还学习了变量的作用域和全局变量。本章还涵盖了运算符，你学习了如何将一些常用的运算符组合成表达式。最后，你学习了如何定义和访问常量。\n\
  \n现在你已经掌握了一些基础知识，下一章将让你编写能够做出决策和重复任务的脚本，这会用到变量、表达式和运算符。\n\n### 问答\n\n问：*知道变量持有的数据类型有什么用？*\n\
  \n答：通常变量的数据类型限制了你可以对它做什么。例如，你不能对简单的字符串执行数组函数。同样，在数学计算中使用变量之前，你可能想确保该变量包含整数或浮点数，尽管\
  \ `PHP` 经常会通过更改数据类型来帮助你。\n\n问：*我应该遵守任何变量命名的习惯吗？*\n\n答：你的目标始终应该是让代码易于阅读和理解。像 `$ab123245`\
  \ 这样的变量没有说明它在你的脚本中的作用，而且容易导致拼写错误。保持变量名简短且具有描述性。\n\n名为 `$f` 的变量在你一个月后回到代码时，可能对你没有太大意义。而名为\
  \ `$filename` 的变量应该更有意义。\n\n问：*我应该学习运算符优先级表吗？*\n\n答：没有理由不学，但我建议把精力留给更有用的任务。通过在你的表达式中使用括号，你可以让代码易于阅读，同时定义自己的优先级顺序。\n\
  \n### 练习\n\n\n\n\n\n本工作坊旨在帮助你复习已学到的内容，并开始将知识付诸实践。\n\n## 测验\n\n**1.** 下列哪些变量名是无效的？\n\
  \n`$a_value_submitted_by_a_user`\n\n`$666666xyz`\n\n`$xyz666666`\n\n`$_____counter_____`\n\
  \n`$the first`\n\n`$file-name`\n\n**2.** 下述代码片段的输出是什么？\n\n```php\n$num = 33;\n(boolean)\
  \ $num;\necho $num;\n```\n\n**3.** 下述语句输出什么？\n\n```php\necho gettype(\"4\");\n```\n\
  \n**4.** 下述代码片段的输出是什么？\n\n```php\n$test_val = 5.5466;\nsettype($test_val, \"integer\"\
  );\necho $test_val;\n```\n\n**5.** 下列语句中哪个不包含表达式？\n\n```php\n4;\nis_int(44);\n5/12;\n\
  ```\n\n**6.** 问题 5 中的哪个语句包含运算符？\n\n**7.** 下述表达式返回什么值？\n\n```php\n5 < 2\n```\n返回的值将是什么数据类型？\n\
  \n## 答案\n\n**1.** 变量名 `$666666xyz` 是无效的，因为它没有以字母或下划线字符开头。 变量名 `$the first` 是无效的，因为它包含空格。`$file-name`\
  \ 也是无效的，因为它包含了非字母数字字符（`-`）。\n\n**2.** 该片段打印整数 `33`。强制转换为布尔值会产生存储在 `$num` 中值的转换副本。它并不会改变实际存储在该处的值。\n\
  \n**3.** 该语句输出字符串 `\"string\"`。\n\n**4.** 代码输出值 `5`。当将浮点数转换为整数时，小数点后的任何信息都会丢失。\n\
  \n**5.** 它们都是表达式，因为它们都能被解析为值。\n\n**6.** 语句 `5/12;` 包含一个除法运算符。\n\n**7.** 表达式解析为 `false`，这是一个布尔值。\n\
  \n## 练习活动\n\n**1.** 创建一个包含至少五个不同变量的脚本。为它们填充不同数据类型的值，并使用 `is_*` 系列函数测试并将类型打印到浏览器中。\n\
  \n**2.** 给两个变量赋值。使用比较运算符测试第一个值是否：\n• 与第二个值相同\n• 小于第二个值\n• 大于第二个值\n• 小于等于第二个值\n将每项测试的结果打印到浏览器。\n\
  更改赋值测试变量的值并再次运行脚本。\n\n## 第 6 章 PHP 中的流程控制函数\n\n***\n\n***在本章中，你将学习以下内容：***\n\n•\
  \ **如何使用 `if` 语句在测试表达式求值为为 `true` 时执行代码**\n• **当 `if` 语句的测试表达式求值为 `false` 时如何执行备选代码块**\n\
  • **如何使用 `switch` 语句根据测试表达式返回的值执行代码**\n• **如何使用 `while` 语句重复执行代码**\n• **如何使用 `for`\
  \ 语句编写更整洁的循环**\n• **如何跳出循环**\n• **如何在一个循环中嵌套另一个循环**\n• **如何在控制结构中使用 PHP 的开始和结束标签**\n\
  \n***\n\n在上一章中创建的脚本流只向单方向流动：即向前。也就是说，每次运行脚本时，相同的语句按相同的顺序执行。这并没有提供足够的灵活性，因为任何类型的动态编程至少需要一个或两个循环，更不用说继续之前检查某些条件的有效性了。你现在将学习让脚本能够适应情况的编程结构。\n\
  \n### 切换流程\n\n脚本评估条件并据此改变行为是常见的。这些决策使得你的 PHP 页面变得动态——即能够根据情况更改输出。与大多数编程语言一样， PHP\
  \ 允许你通过 `if` 语句来实现。\n\n### `if` 语句\n\n`if` 语句是控制随其后的语句（即单个语句或大括号内的代码块）执行的一种。`if`\
  \ 语句评估圆括号内的表达式。如果该表达式的结果为 `true` 值，则执行该语句。否则，该语句将完全跳过。这种功能允许脚本根据多种因素做出决策：\n\n```php\n\
  if (expression) {\n    // 如果表达式为真则执行代码\n}\n```\n\n**列表 6.1 if 语句**\n```php\n<?php\n\
  $mood = \"happy\";\nif ($mood == \"happy\") {\n    echo \"Hooray! I'm in a good\
  \ mood!\";\n}\n?>\n```\n在第 2 行将 `\"happy\"` 赋值给 `$mood`。在第 3 行，比较运算符 `==` 将 `$mood`\
  \ 的值与 `\"happy\"` 进行比较。如果它们匹配，表达式求值为 `true`，执行代码。将这些行放入 `testif.php` 并放入服务器根目录。通过浏览器访问此脚本时，它输出：Hooray!\
  \ I'm in a good mood!\n\n如果你将赋值给 `$mood` 的改为 `\"sad\"` 或除 `\"happy\"` 外的任何字符串并再次运行脚本，`if`\
  \ 语句中的表达式求值为 `false`，代码将被跳过。\n\n### 在 if 语句中使用 `else` 子\n\n在使用 `if` 语句时，你可能希望在表达式求值为\
  \ `false` 时定义一个备选代码块。可以通过在 `if` 语句后添加 `else` 以及另一个块来实现：\n\n```php\nif (expression)\
  \ {\n    // 如果表达式为真则执行代码\n} else {\n    // 在所有情况下都执行代码\n}\n```\n\n**列表 6.2 使用 else\
  \ 的 if 语句**\n```php\n<?php\n$mood = \"sad\";\nif ($mood == \"happy\") {\n    echo\
  \ \"Hooray! I'm in a good mood!\";\n} else {\n    echo \"I'm in a sad mood.\";\n\
  }\n?>\n```\n`else` 子修改了列表 6.1 中的示例，当值不等于 `\"happy\"` 时会执行默认代码块。注意第 2 行 `$mood` 的值为\
  \ `\"sad\"`，因此第 3 行的 `if` 语句求值为 `false`。这导致第一个代码块（第 4 行）被跳过。然而，`else` 之后的代码块被执行了*，并打印了替代消息：`I'm\
  \ in a sad mood.` 将这些行放入 `testifelse.php` 并放入服务器根目录。通过浏览器访问此脚本时，它产生如下输出：I'm in a\
  \ sad mood.\n\n\n\n\n\n你可以使用 `if...elseif...else` 子句在提供默认代码块（`elseif` 部分）之前测试多个表达式（`if...else`\
  \ 部分）：\n\n点击此处查看代码图片\n\n```php\nif (expression) {\n    // 如果表达式求值为真，则执行此代码\n} elseif\
  \ (another expression) {\n    // 如果之前的表达式失败，且此表达式求值为真，则执行此代码\n} else {\n    // 在所有其他情况下执行此代码\n\
  }\n```\n\n如果初始的 `if` 表达式求值不为 `true`，则第一个代码块被忽略。`elseif` 子句提供了另一个表达式进行求值。如果它求值为为\
  \ `true`，则执行其对应的代码块。否则，执行与 `else` 子句相关的代码块。你可以根据需要包含任意数量的 `elseif` 子句；如果你不需要默认操作，可以省略\
  \ `else` 子句。\n\n***\n\n### 注意\n\n`elseif` 子句也可以写成两个单词（`else if`）。你使用的语法取决于个人喜好，但\
  \ PEAR（PHP 扩展和应用程序库）和 PECL（PHP 扩展社区库）采用的编码标准使用的是 `elseif`。\n\n***\n\nListing 6.3\
  \ 为之前的示例添加了一个 `elseif` 子句。\n\n**Listing 6.3** 使用 else 和 elseif 的 if 语句\n\n点击此处查看代码图片\n\
  \n***\n\n```php\n1: <?php\n2:   $mood = \"sad\";\n3:   if ($mood == \"happy\") {\n\
  4:       echo \"Hooray! I'm in a good mood!\";\n5:   } elseif ($mood == \"sad\"\
  ) {\n6:       echo \"Awww. Don't be down!\";\n7:   } else {\n8:       echo \"I'm\
  \ neither happy nor sad, but $mood.\";\n9:   }\n10: ?>\n```\n\n***\n\n再次，如第 2 行所示，$mood`\
  \ 变量值为 `\"sad\"`。该值等于 `\"happy\"`，因此第 4 行的代码被忽略。第 5 行的 `elseif` 子句测试 `$mood` 的值与值\
  \ `\"sad\"` 之间的等价性，在这种情况下求值为 `true`。因此执行了第 6 行的代码。在第 7 到 9 行中，提供了默认行为，如果之前的测试条件全部为\
  \ `false`，则调用该行为。在这种情况下，我们只需打印包含 `$mood` 变量实际值的消息。\n\n将这些行放入名为 `testifelseif.php`\
  \ 的文本文件中并将文件放置在 Web 服务器的文档根目录下。当你通过浏览器访问此脚本时，它会产生以下输出：\n\nAwww. Don't be down!\n\
  \n将 `$mood` 的值改为 `\"iffy\"` 并运行脚本。它产生以下输出：\n\nI'm neither happy nor sad, but iffy.\n\
  \n#### `switch` 语句\n\n`switch` 语句是基于表达式求值改变执行流的另一种方式。通过将 `if` 语句与 `elseif` 使用，你可以像刚刚看到的那样评估多个表达式。然而，`switch`\
  \ 语句在表达式列表中仅求值一个表达式，根据特定的匹配代码选择正确的表达式。在 `if` 语句中作为一部分评估的表达式结果被解释为 `true` 或 `false`，而\
  \ `switch` 语句的表达式部分随后会与任意数量的值进行测试，以找到匹配：\n\n点击此处查看代码图片\n\n```php\nswitch (expression)\
  \ {\n    case result1:\n        // 如果表达式结果为 result1，则执行此操作\n        break;\n   \
  \ case result2:\n        // 如果表达式结果为 result2，则执行此操作\n        break;\n    default:\n\
  \        // 如果在此之前没有遇到 break 语句，则执行此\n}\n```\n\n`switch` 语句中使用的表达式通常只是变量，例如 `$mood`。在\
  \ `switch` 语句内部，你会找到许多 `case` 语句。每个 `case` 都会将一个值与 `switch` 表达式的值进行测试。如果 case 值等于表达式值，则执行\
  \ `case` 语句内部的代码。`break` 语句结束执行。如果省略了 `break` 语句，则将执行下一个 `case` 语句。\n\n#### 注意\n\
  \n在适当的地方包含 `break` 语句是非常重要的。如果没有 `break` 语句，程序将继续执行下一个 `case`。这绝对不是预期的输出，因此请务必在适当的地方包含\
  \ `break` 语句。\n\n\n\n\n\n将这些行写入名为 `testtern.php` 的文本文件中，并将此文件放置在你的 Web 服务器文档根目录下。当你通过\
  \ Web 浏览器访问此脚本时，它会产生以下输出：\n\n我的心情很低落。\n\n三元运算符可能很难阅读，但如果你只需要处理两种备选并并编写紧凑的代码，它非常有用。\n\
  \n## 循环\n\n到目前为止，你已经查看了脚本在执行哪些代码方面可以做出的决策。脚本还可以决定执行代码块的次数。循环语句专门设计用于让你能够执行重复性任务，因为它们会持续运行直到达到指定的条件或你显式地选择退出循环。\n\
  \n### `while` 语句\n\n`while` 语句的结构与基础的 `if` 语句相似，但具有循环的能力：\n\n```\nwhile (expression)\
  \ {\n    // 执行某些操作\n}\n```\n\n与 `if` 语句不同，`while` 语句只要表达式求值为 `true`，它就会一直执行，在需要时会反复执行。循环内代码块的每次执行被称为一次“迭代”（iteration）。在代码块内部，你通常会更改某些影响\
  \ `while` 语句表达式的内容；否则，你的循环将无限持续。例如，你可能会使用一个变量来计算迭代次数并采取相应的操作。列表 6.6 创建了一个 `while`\
  \ 循环，计算并打印到 24 的 2 的倍数。\n\n**列表 6.6** while 语句\n\n点击此处查看代码图像\n\n```\n1: <?php\n\
  2: $counter = 1;\n3: while ($counter <= 12) {\n4:     echo $counter.\" times 2 is\
  \ \".($counter * 2).\"<br />\";\n5:     $counter++;\n6: }\n7: ?>\n```\n\n此示例在第 2\
  \ 行初始化变量 `$counter` 值为 `1`。第 3 行的 `while` 语句测试 `$counter` 变量，只要 `$counter` 的值小于或等于\
  \ `12`，循环就会继续运行。在 `while` 语句的代码块中，`$counter` 的值乘以 2，并将结果打印到浏览器。在第 5 行中，`$counter`\
  \ 的值加 1。这一步至关重要，因为如果你不增加 `$counter` 变量的值，`while` 表达式永远不会解析为 `false`，循环也永远不会结束。\n\
  \n将这些行写入名为 `testwhile.php` 的文本文件中，并将此文件放置在你的 Web 服务器文档根目录下。当你通过 Web 浏览器访问此脚本时，它会产生以下输出：\n\
  \n1 times 2 is 2\n2 times 2 is 4\n3 times 2 is 6\n4 times 2 is 8\n5 times 2 is 10\n\
  6 times 2 is 12\n7 times 2 is 14\n8 times 2 is 16\n9 times 2 is 18\n10 times 2 is\
  \ 20\n11 times 2 is 22\n12 times 2 is 24\n\n### `do...while` 语句\n\n`do...while`\
  \ 语句看起来有点像倒过来的 `while` 语句。两者之间的本质区别在于，代码块是在真值测试*之前*执行，而不是之后：\n\n```\ndo  {\n   \
  \ // 要执行的代码\n requirements while (expression);\n```\n\n#### 注意事项\n\n`do...while`\
  \ 语句的测试表达式应始终以分号结束。\n\n当你希望代码块至少执行一次时（即使 `while` 表达式求值为 `false`），这种语句非常有用。列表 6.7\
  \ 创建了一个 `do...while` 语句。代码块至少会执行一次。\n\n**列表 6.7** do...while 语句\n\n```\n1: <?php\n\
  2: $num = 1;\n3: do {\n4:     echo \"The number is: \".$num.\"<br />\";\n5:    \
  \ $num++;\n6: } while (($num > 200) && ($num < 400));\n7: ?>\n```\n\n`do...while`\
  \ 语句测试变量 `$num` 是否包含大于 `200` 且小于 `400` 的值。第 2 行将 `$num` 初始化为 `1`，因此该表达式返回 `false`。尽管如此，在评估表达式之前，代码块至少执行一次，因此语句向浏览器打印了单行内容。\n\
  \n将这些行写入名为 `testdowhile.php` 的文本文件中，并将此文件放置在你的 Web 服务器文档根目录下。当你通过 Web 浏览器访问此脚本时，它会产生以下输出：\n\
  \nThe number is: 1\n\n如果你将第 2 行的 `$num` 的值改为 `300` 然后运行脚本，循环将显示\n\nThe number is:\
  \ 300\n\n并继续打印类似的行，数字递增，直到：\n\nThe number is: 399\n\n### `for` 语句\n\n任何你想用 `for`\
  \ 语句完成的操作都可以用 `while` 语句完成，但 `for` 语句通常更紧凑。在列表 6.6 中，你看到了 `while` 语句是如何初始化、测试和递增的。使用\
  \ `for` 语句，你可以在单行内实现这些：\n\n```\nfor (初始化; 测试表达式; 修改) {\n    // 要执行的代码\n}\n```\n\n\
  `for` 语句括号内的表达式用分号分隔。通常，第一个表达式初始化计数器，第二个表达式是循环测试，第三个表达式增加计数器。列表 6.8 显示了一个 `for`\
  \ 语句：\n\n**列表 6.8** 使用 for 语句\n\n点击此处查看代码图像\n\n```\n1: <?php\n2: for ($counter=1;\
  \ $counter<=12; $counter++) {\n3:     echo $counter.\" times 2 is \".($counter *\
  \ 2).\"<br />\";\n4: }\n5: ?>\n```\n\n将这些行写入名为 `testfor.php` 的文本文件中，并将此文件放置在你的 Web\
  \ 服务器文档根目录下。当你通过 Web 浏览器访问此脚本时，它会产生以下输出：\n\n1 times 2 is 2\n2 times 2 is 4\n3 times\
  \ 2 is 6\n4 times 2 is 8\n5 times 2 is 10\n6 times 2 is 12\n7 times 2 is 14\n8 times\
  \ 2 is 16\n9 times 2 is 18\n10 times 2 is 20\n11 times 2 is 22\n12 times 2 is 24\n\
  \n列表 6.6 和 6.8 的结果是相同的，但 `for` 语句使得列表 6.8 中的代码更加紧凑。因为 `$counter` 变量在语句开头就初始化并递增，循环的逻辑一目了然。也就是说，如第\
  \ 2 行所示，第一个表达式初始化 `$counter` 变量并赋值 `1`，测试表达式验证 `$counter` 是否包含小于或等于 `12` 的值，最后一个表达式增加\
  \ `$counter` 变量。这些项目都包含在单行代码中。\n\n\n\n\n\n`while` 和 `for` 语句都包含一个内置的测试表达式，你可以通过该表达式结束循环。然而，`break`\
  \ 语句允许你根据额外测试的结果跳出循环。这可以为错误提供一种保护。列表 6.9 创建了一个简单的 `for` 语句，它将一个大数除以一个递增的变量，并将结果打印到屏幕上。\n\
  \n**列表 6.9** 一个将 4000 除以 10 个递增数字的 for 循环\n\n点击此处查看代码图像\n\n```php\n<?php\nfor ($counter=1;\
  \ $counter <= 10; $counter++) {\n    $temp = 4000/$counter;\n    echo \"4000 divided\
  \ by \".$counter.\" is...\".$temp.\"<br />\";\n}\n?>\n```\n\n在第 2 行中，此示例初始化了变量 `$counter`\
  \ 并为其赋值了值 `1`。`for` 语句中的测试表达式验证了 `$counter` 的值小于或等于 `10`。在代码块内部，`4000` 除以 `$counter`，并将结果打印到浏览器。\n\
  \n将这些行放入名为 `testfor2.php` 的文本文件中，并将该文件放置在你的 Web 服务器的文档根目录下。当你通过 浏览器访问此脚本时，它会产生以下输出：\n\
  \n4000 divided by 1 is... 4000\n4000 divided by 2 is... 2000\n4000 divided by 3\
  \ is... 1333.33333333\n4000 divided by 4 is... 1000\n4000 divided by 5 is... 800\n\
  4000 divided by 6 is... 666.666666667\n4000 divided by 7 is... 571.428571429\n4000\
  \ divided by 8 is... 500\n4000 divided by 9 is... 444.444444444\n4000 divided by\
  \ 10 is... 400\n\n这看起来足够简单。但如果存放在 `$counter` 中的值来自用户输入呢？该值可能是负数，甚至是字符串。让我们取第一种情况，即用户输入的值为负数。将\
  \ `$counter` 的初始值从 `1` 改为 `-4` 会导致代码块在执行第五次时，`4000` 被除以 0。对于你的代码来说，除以 0 通常不是一个好主意，因为这种操作会导致“未定义”的答案。列表\
  \ 6.10 通过在 `$counter` 变量的值等于 `0` 时跳出循环来防止这种情况的发生。\n\n**列表 6.10** 使用 break 语句\n\n\
  点击此处查看代码图像\n\n```php\n<?php\n$counter = -4;\nfor (; $counter <= 10; $counter++)\
  \ {\n    if ($counter == 0) {\n        break;\n    } else {\n        $temp = 4000/$counter;\n\
  \        echo  \"4000 divided by \".$counter.\" is...\".$temp.\"<br />\";\n    }\n\
  }\n?>\n```\n\n> **注意**\n> 在 PHP 中将数字除以 0 不会导致致命错误。相反，PHP 会生成一个警告并继续执行。\n\n列表 6.10\
  \ 使用第 4 行所示的 `if` 语句在尝试使用该值进行数学运算之前测试 `$counter` 的值。如果 `$counter` 的值等于 `0`，`break`\
  \ 语句将立即停止代码块的执行，程序流将从 `for` 语句（第 11 行）之后继续。\n\n将这些行放入名为 `testfor3.php` 的文本文件中，并将该文件放置在你的\
  \ Web 服务器的文档根目录下。当你通过 浏览器访问此脚本时，它会产生以下输出：\n\n点击此处查看代码图像\n\n4000 divided by -4 is...\
  \ -1000\n4000 divided by -3 is... -1333.33333333\n4000 divided by -2 is... -2000\n\
  4000 divided by -1 is... -4000\n\n注意 `$counter` 变量是在第 2 行初始化的，位于 `for` 语句的括号之外。这种方法被用于模拟\
  \ `$counter` 的值在外部设置的情况。\n\n> **提示**\n> 你可以省略 `for` 语句中的任何表达式，但你必须记住保留分号。\n\n###\
  \ 使用 `continue` 语句跳过迭代\n\n`continue` 语句会结束当前迭代的执行，但不会导致整个循环结束。相反，下一次迭代立即开始。像列表 6.10\
  \ 那样使用 `break` 语句有些剧进。通过列表 6.11 中的 `continue` 语句，你可以在不结束循环的情况下避免除以 0 的错误。\n\n**列表\
  \ 6.11** 使用 continue 语句\n点击此处查看代码图像\n\n```php\n<?php\n$counter = -4;\nfor ($counter\
  \ <= 10; $counter++) {\n    if ($counter == 0) {\n        continue;\n    }\n   \
  \ $temp = 4000/$counter;\n    echo \"4000 divided by \".$counter.\" is...\".$temp.\"\
  <br />\";\n}\n?>\n```\n\n第 5 行将 `break` 语句替换为 `continue` 语句。如果 `$counter` 变量的值等于\
  \ `0`，则该迭代将被跳过，并开始下一次迭代。将这些行放入名为 `testcontinue.php` 的文本文件中，并将该文件放置在你的 Web 服务器的文档根目录下。当你通过\
  \ 浏览器访问此脚本时，它会产生以下输出：\n\n点击此处查看代码图像\n\n4000 divided by -4 is... -1000\n4000 divided\
  \ by -3 is... -1333.33333333\n4000 divided by -2 is... -2000\n4000 divided by -1\
  \ is... -4000\n4000 divided by 1 is... 4000\n4000 divided by 2 is... 2000\n4000\
  \ divided by 3 is... 1333.33333333\n4000 divided by 4 is... 1000\n4000 divided by\
  \ 5 is... 800\n4000 divided by 6 is... 666.666666667\n4000 divided by 7 is... 571.428571429\n\
  4000 divided by 8 is... 500\n4000 divided by 9 is... 444.444444444\n4000 divided\
  \ by 10 is... 400\n\n> **警告**\n> 使用 `break` 和 `continue` 语句可能会使代码更难以阅读，因为它们会增加包含它们的循环逻辑的复杂性。谨慎使用这些语句，或者通过代码注释向其他程序员（或你自己）说明你通过这些语句想要实现什么。\n\
  \n### 嵌套循环\n\n循环可以包含其他循环语句，只要逻辑有效且循环整洁。这种语句的组合在处理动态创建的 HTML 表格时特别有用。列表 6.12 使用两个\
  \ `for` 语句向浏览器打印乘法表。\n\n**列表 6.12** 嵌套两个 for 循环\n点击此处查看代码图像\n\n```php\n<?php\necho\
  \ \"<table style=\\\"border: 1px solid #000;\\\"> \\n\";\nfor ($y=1; $y<=12; $y++)\
  \ {\n    echo \"<tr> \\n\";\n    for ($x=1; $x<=12; $x++) {\n        echo \"<td\
  \ style=\\\"border: 1px solid #000; width: 25px; text-align:center;\\\">\";\n  \
  \      echo ($x * $y);\n        echo \"</td> \\n\";\n    }\n    echo \"</tr> \\\
  n\";\n}\necho \"</table>\";\n?>\n```\n\n在检查 `for` 循环之前，仔细观察列表 6.12 中的第 2 行：\n\n\
  点击此处查看代码图像\n\necho \"<table style=\\\"border: 1px solid #000;\\\"> \\n\"\n\n\n\n\
  \n\n外部 `for` 语句（第 3 行）初始化了一个名为 `$y` 的变量，并赋值初始值 `1`。这个 `for` 语句定义了一个表达式，用于验证 `$y`\
  \ 的值是否小于等于 `12`，然后定义了将使用的增量。在每次迭代中，代码块都会打印一个 `tr`（表格行）HTML 元素（第 4 行）并开始另一个 `for`\
  \ 语句（第 5 行）。这个内层循环初始化了一个名为 `$x` 的变量，并定义了与外层循环类似的表达式。每次迭代中，内层循环向浏览器打印一个 `td`（表格单元格）元素（第\
  \ 6 和第 7 行），以及 `$x` 乘以 `$y` 的结果（第 8 行）。第 9 行关闭表格单元格。当内层循环完成后，执行返回外层循环，外层在第 11 行关闭表格行，准备再次开始该过程。当外层循环完成后，结果将是一个格式整齐的乘法表。列表\
  \ 6.12 通过在第 13 行关闭表格来完成所有工作。\n\n将这些行放入名为 `testnestfor.php` 的文本文件中，并将此文件放置在你 Web\
  \ 服务器的文档根目录下。当你通过网络浏览器访问此脚本时，它看起来应该像图 6.1 所示。\n\n![image](img/06fig01.jpg)\n\n**图\
  \ 6.1 testnestfor.php 的输出。**\n\n## 代码块与浏览器输出\n\n在第 4 章的“安装和配置 PHP”中，你学习了可以使用 PHP\
  \ 的开始和结束标签随意地在 HTML 模式之间切换。在本章中，你发现可以根据你可以用 `if` 和 `switch` 语句控制的决策过程，向用户呈现不同的输出。本节结合了这两种技术。\n\
  \n想象有一个脚本，它仅当变量被设置为布尔值 `true` 时才输出一个取值表格。列表 6.13 显示了一个使用 `if` 语句代码块构建的简化 HTML 表格。\n\
  \n**列表 6.13** 包含多个 echo 语句的代码块\n\n点击此处查看代码图像\n\n```\n1: <?php\n2: $display_prices\
  \ = true;\n3: if ($display_prices) {\n4:    echo \"<table border=\\\"1\\\">\\n\"\
  ;\n5:    echo \"<tr><td colspan=\\\"3\\\">\";\n6:    echo \"today's prices in dollars\"\
  ;\n7:    echo \"</td></tr>\";\n8:    echo \"<tr><td>\\$14.00</td><td>\\$32.00</td><td>\\\
  $71.00</td></tr>\\n\";\n9:    echo \"</table>\";\n10: }\n11: ?>\n```\n\n**注意**\n\
  \n在第 8 行中，请注意美元符号 `$`，当它的意思是字面意思而不是变量声明的一部分时，必须用反斜杠进行转义，才能被解释为美元符号字符。\n\n如果 `$display_prices`\
  \ 的值在第 2 行设置为 `true`，则会打印表格。为了可读性，我们将输出分为多个 `echo()` 语句，并再次使用反斜杠来转义 HTML 输出中使用的任何引号。\n\
  \n将这些行放入名为 `testmultiecho.php` 的文本文件中，并将此文件放置在你 Web 服务器的文档根目录下。当你通过网络浏览器访问此脚本时，它看起来应该像图\
  \ 6.2 所示。\n\n![image](img/06fig02.jpg)\n\n**图 6.2 testmultiecho.php 的输出。**\n\n这种编码方式没有问题，但你可以通过简单地在代码块中切回\
  \ HTML 模式来节省打字时间。列表 6.14 正是如此。\n\n**列表 6.14** 在代码块内返回 HTML 模式\n\n点击此处查看代码图像\n\n\
  ```\n1: <?php\n2: $display_prices = true;\n3: if ($display_prices) {\n4: ?>\n5:\
  \ <table border=\"1\">\n6: <tr><td colspan=\"3\">today's prices in dollars</td></tr>\n\
  7: <tr><td>$14.00</td><td>$32.00</td><td>$71.00</td></tr>\n8: </table>\n9: <?php\n\
  10: }\n11: ?>\n```\n\n这里需要注意的是，第 4 行的 HTML 模式切换只有在满足 `if` 语句条件时才会发生。这可以节省转义引号以及将输出封装在\
  \ `echo()` 语句中的麻烦。然而，从长期来看，这种方法可能会影响代码的可读性。\n\n### 总结\n\n在本章中，你学习了控制结构：`if`、`elseif`、`else`\
  \ 和 `switch`。你学习了 `while` 和 `for` 循环以及如何使用 `break` 和 `continue`。你还学习了如何嵌套循环以及如何转义特殊字符。\n\
  \n### 工作坊\n\n工作坊旨在帮助你复习所学内容。\n\n### 验\n\n1 如何使用 `if` 语句，当整数 `$age` 在 `18` 到 `35`\
  \ 之间时打印“Youth message”？\n\n2 如何扩展第 1 题的代码，以便当 `$age` 在 `1` 到 `17` 之间时打印“Child message”？\n\
  \n3 如何创建一个 `while` 语句，递增并打印 1 到 49 之间的所有奇数？\n\n4 如何将你在第 3 题中创建的 `while` 语句转换为 `for`\
  \ 语句？\n\n### 答案\n\n1\n```php\n$age = 22;\nif ($age >= 18 && ($age <= 35)) {\n  \
  \  echo \"Youth message\";\n} else {\n    echo \"Generic message\";\n}\n```\n\n\
  2\n```php\n$age = 12;\nif ($age >= 18 && ($age <= 35)) {\n    echo \"Youth message\"\
  ;\n} elseif ($age >= 1 && ($age <= 17)) {\n    echo \"Child message\";\n} else {\n\
  \    echo \"Generic message\";\n}\n```\n\n3\n```php\n$num = 1;\nwhile ($num <= 49)\
  \ {\n    echo $num.\"<br />\";\n    $num += 2;\n}\n```\n\n4\n```php\nfor ($num =\
  \ 1; $num <= 49; $num += 2) {\n    echo $num.\"<br />\";\n}\n```\n\n\n\n\n\n1. \
  \ 复习控制结构的语法。思考你所学到的技术将如何帮助你的脚本编写。也许你开发的某些脚本思路能够根据用户输入以不同的方式运行，或者通过循环显示一个 HTML 表格。\n\
  \n2.  开始构建你将要使用的控制结构。暂时使用临时变量来模拟用户输入或数据库查询。\n\n# 第 7 章：使用函数\n\n***在本章中，你将学习以下内容：***\n\
  \n- **如何在脚本内部定义和调用函数**\n- **如何向函数传递值并接收其返回值**\n- **如何使用存储在变量中的字符串动态地调用函数**\n- **如何在函数内部访问全局变量**\n\
  - **如何给函数赋予“记忆”**\n- **如何通过引用向函数传递数据**\n- **如何在调用函数之前先验证该函数是否存在**\n\n函数是组织良好的脚本的核心，它们能让你的代码易于阅读和重用。没有函数，任何大型项目都将无法管理，因为重复代码的问题会拖慢开发进程。在整个章节中，你将研究函数，并学习函数可以帮助你避免重复性工作的方法。\n\
  \n## 什么是函数？\n\n你可以将函数看作一台输入/输出机器。这台机器接收你喂给它的原材料（输入），并对其进行处理产生产品（输出）。函数接受值，对其进行处理，然后执行某个操作（例如打印到浏览器）、返回一个新值，或两者兼顾。\n\
  \n如果你只需要烤一个蛋糕，你可能会在自己的厨房里用你的标准烤箱自己完成。但如果你需要烤成千上万个蛋糕，你可能会建造或购买一台特用的蛋糕机，用于大批量生产蛋糕。同样，在决定是否创建一个可重用的函数时，需要考虑的最重要因素是它在多大程度上可以节省你编写重复代码。\n\
  \n`function` 是一个自包含的代码块，可以由你的脚本调用。当被调用时，函数的代码将被执行并完成特定的任务。你可以向函数传递值，函数会根据需要正确使用这些值——存储、转换、显示它们，取决于函数被指示执行什么操作。完成后，函数还可以将一个值传回调用它的原始代码。\n\
  \n## 调用函数\n\n函数分为两种：语言内置的函数和你自己定义的函数。PHP 有数百个内置函数。查看下面的代码片段，作为函数使用的示例：\n\n```php\n\
  strtoupper(\"Hello Web!\");\n```\n\n此示例调用了 `strtoupper()` 函数，并向其传递了字符串 `\"Hello\
  \ Web!\"`。该函数随后执行将字符串内容更改为大写字母的操作。函数调用由函数名（在本例中为 `strtoupper`）后的括号组成。如果你想向函数传递信息，请将其放在这些括号之间。以这种方式传递给函数的信息被称为\
  \ `argument`（参数）。某些函数要求传递多个参数，并用逗号隔开：\n\n点击此处查看代码图片\n\n```php\nsome_function($an_argument,\
  \ $another_argument);\n```\n\n`strtoupper()` 是一个典型的函数，因为它会返回一个值。绝大多数函数在完成任务后都会返回一些信息；它们通常至少会告诉你任务是否成功。`strtoupper()`\
  \ 返回一个字符串值，因此它的用法需要一个变量来接收这个新字符串，如下所示：\n\n点击此处查看代码图片\n\n```php\n$new_string = strtoupper(\"\
  Hello Web!\");\n```\n\n你现在可以在代码中使用 `$new_string` 了，例如将其打印到屏幕上：\n\n```php\necho $new_string;\n\
  ```\n\n这段代码在屏幕上会产生以下文本：\n\nHELLO WEB!\n\n### 注意\n\n`print()` 和 `echo()` 实际上并不是函数，它们是设计用于向浏览器输出字符串的语言结构。然而，你分别可以在\
  \ PHP 函数列表中找到它们，地址分别为 `http://www.php.net/print` 和 `http://www.php.net/echo`。这些结构在功能上相似，可以互换使用。使用哪一个取决于个人喜好。\n\
  \n例如，`abs()` 函数需要一个带符号的数值，并返回该数字的绝对值。让我们在 列表 7.1 中尝试一下。\n\n**列表 7.1** 调用内置的 abs()\
  \ 函数\n\n点击此处查看代码图片\n\n```php\n1: <?php\n2: $num = -321;\n3: $newnum = abs($num);\n\
  4: echo $newnum;\n5: //打印 \"321\"\n6: ?>\n```\n\n此示例将值 `-321` 分配给变量 `$num`。然后将该变量传递给\
  \ `abs()` 函数，函数进行必要的计算并返回一个新值。代码将此赋值给变量 `$newnum` 并显示结果。\n\n将这些行放入名为 `abs.php` 的文本文件中，并将此文件放在你的\
  \ Web 服务器文档根目录下。当你通过网络浏览器访问此脚本时，它会产生以下内容：\n\n321\n\n事实上，列表 7.1 完全可以省略临时变量，直接将数字传递给\
