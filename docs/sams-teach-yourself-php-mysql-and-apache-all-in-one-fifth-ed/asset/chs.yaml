  \ 行），此时该商品应不再显示在用户的购物车中。试试看吧！\n\n## 支付方式与结账顺序\n\n在支付购物车中的商品时，存在多种交易方法。对你来说，“正确”的方法取决于你的业务——通过银行机构开设商户通常需要你拥有营业执照、转销许可或其他证明你是合法企业的材料。如果你只是一个有几个商品要卖的个人，你可能不想经历所有的文书工作。然而，你仍然有选择。\n\
  \n无论你选择哪种支付方式，有一点是可以定的：如果你通过 Web 传输信用卡信息，必须通过 SSL（安全套接层）连接进行。获取 SSL 证书并将其安装在你的系统中，将在第\
  \ 30 章“设置安全 Web 服务器”中介绍。你不需要在用户的整个购物过程中都使用这种安全连接，只需从获取敏感信息的点开始，例如将用户引导至结账表单时。\n\n\
  ### 创建结账表单\n\n在书的这里，你应该已经熟练掌握了创建简单的表单。在本章开头，你创建了 `store_orders` 表，其字段作为你表单的：\n\n\
  * `order_name`\n* `order_address`\n* `order_city`\n* `order_state`\n* `order_zip`\n\
  * `order_tel`\n* `order_email`\n\n此外，你的表单还需要信用卡号、过期日期和信用卡上的的字段。另一个很好的功能是重复用户的购物车内容并附带商品小计，这样客户就能记得他在为什么付费，以及订单的大致费用。在结账顺序的此时，你还提供了可能提供的任何运输选项。运费和销售税将在流程的下一步中计算。\n\
  \n从点击表单上的提交按钮开始，结账顺序取决于你正在使用的支付方法。下一节将介绍基本步骤，并对各种支付处理方法提供建议。\n\n### 执行结账操作\n\n如果你已通过银行获得了商户账户，你可以利用实时支付服务，例如\
  \ Authorize.Net 的支付网关服务或 PayPal 的 PayFlo 产品。有关这些服务的更多信息，请分别访问 [`www.authorize.net`](http://www.authorize.net)\
  \ 和 [`www.paypal.com/webapps/mpp/merchant`](https://www.paypal.com/webapps/mpp/merchant)。\n\
  \nPHP 不包含直接访问这些支付网关的内置函数，但当你拥有这些类型的商户服务账户时，你可以下载用于自己应用程序的脚本，或者获得提供应用程序开发者的 API 信息。\n\
  \n[Authorize.Net](http://Authorize.Net) 和 PayPal 是商户使用的多种交易网关中的两种——我在这里介绍它们是因为自从它们成立以来，我一直都成功使用过这两个网关服务。然而，请注意，你的银行通常会提供一份建议你使用的商户列表。因此，如果你偏离银行的优惠供应商列表，务必彻底研究你选择的供应商，以避免存款延迟并确保你获得了最优惠的交易。\n\
  \n选择交易处理器后，你的结账脚本应该遵循如下路径：\n\n1. 汇总商品总额，加上税费和运费。这得出了要从信用卡中授权的总金额。\n2. 对总额进行信用卡授权。\n\
  3. 你将收到来自卡片处理程序的成功或失败响应。如果响应为失败，向用户打印一条消息，交易结束。如果响应为成功，继续执行第 4 步。\n4. 将基本订单信息写入\
  \ `store_orders` 等表，包括你在成功授权后收到的授权代码。使用 `mysql_insert_id()` 获取此记录的 `id` 值。\n5. 对于与该用户关联的购物车每件商品，向\
  \ `store_orders_itemmap` 插入一条记录。每条记录都引用上一步收集的 `id`（作为 `order_id`）。\n6. 删除该用户的购物车商品。\n\
  7. 在屏幕上显示订单，用授权代码代替信用卡信息，以便用户可以打印并将其作为收据。你也可以通过电子邮件将此信息发送给用户。\n\n这里列出的步骤（除实际的支付授权代码外）与你整本书中一直在使用的简单步骤是相同的，没有理由让它们变得比必要的更复杂。\n\
  \n### 总结\n\n在本章中，你将基础 PHP 和 MySQL 知识应用于将购物车集成到第 22 章的商店面中。包括数据库表的创建、商品详情页的修改以及添加和删除购物车商品的新脚本。\n\
  \n### 问答\n\n**问：用户如何确保将商品加入购物车时它有货？**\n\n**答：如果修改 `items` 表以包含一个用于当前数量的字段，并在用户完成结账顺序时该数量根据购买的商品进行减少，那么在\
  \ `showitem.php` 脚本中，你可以生成一个剩余数量的下拉列表。当然，如果你处理的是成千上万种商品，下拉列表每次只能选 10 个也没关系。**\n\n\
  ### 工作坊\n\n工作坊旨在帮助你回顾所学内容并开始实践。\n\n### 测试\n\n1. 在从购物车中删除商品时，你认为查询为什么要验证话 ID？\n2.\
  \ 在加入购物车时，不将价格存储在隐藏字段的原因是什么？\n3. 为了处理不同的运输和账单地址，你需要对数据库和表单做什么？\n\n### 答案\n\n1. 用户应该只能删除他们自己的商品。\n\
  2. 如果你将价格存储在隐藏字段中，恶意用户可以在提交表单之前更改该值（将他想要的任何价格写入 `store_orders` 表中，而非实际价格）。\n3. 修改\
  \ `store_orders` 表中现有的地址相关字段，明确它们是用于运输还是账单的，然后在表中复制一组字段（并命名以指示它们用于运输或账单——取决于你之前没使用的那个），同时也修改表单和最终的\
  \ `INSERT` 语句。\n\n### 活动\n\n1. 即使你没有商户账户，也按照“创建结账表单”节的描述设置结账表单。忘记向此“结账”功能添加指向购物车（或商店任何其他页面）的链接。\n\
  \n\n\n\n\n## 2. 创建结账表单后，将订单信息和行项目保存到在本章初创建的数据库表中。此时无需担心商家账户或支付处理。只需让流程运行起来，使用户可以将项目保存到购物车，通过提供一些虚拟信用卡和地址信息进行结账，然后将这些基础订单信息存储在\
  \ `store_orders` 表中，并将订单项目存储在 `store_orders_items` 表中。\n\n## 第 24 章创建一个简单的日历\n\n\
  ***在本章中，你将学习以下内容：***\n\n• **如何构建一个简单的日历脚本**\n• **如何会在日历中查看和添加事件**\n• **如何构建类库以在\
  \ HTML 表单中生成日期下拉列表**\n\n本章整合了你迄为止学过的关于 PHP 语言以及构建小型 CRUD 应用（即创建、检索、更新和删除数据的应用程序）技能。在本章中，你将在创建一个小型日历应用的背景下继续学习。\n\
  \n#### 构建一个简单的显示日历\n\n你将使用第 10 章“处理字符串、日期和时间](#ch10.html_ch10)”中学过的日期和时间函数，构建一个显示\
  \ 1990 年到 2020 年之间任何月份日期的日历。这些是随机选择的，没有意义——如果你想，可以让日历范围从 1980 年到 2025 年，或者任何你认为合理的日期范围。用户可以使用下拉菜单选择月份和年份，所选月份的日期将根据星期排列。\n\
  \n在该脚本中，我们处理两个变量——一个用于月份，一个用于年份，由用户输入提供。这些信息用于根据所选月份的第一天构建时间戳。如果用户输入无效或缺失，默认值为当前月份的第一。\n\
  \n#### 检查用户输入\n\n当用户首次访问日历应用时，尚未提交信息。因此，我们必须确保脚本能够处理月份和年份变量未定义的情况。可以使用 `isset()`\
  \ 函数，因为如果传递给它的变量未定义，它将返回 `false`。不过，让我们使用 `getdate()` 函数，它不仅可以检查变量是否存在，还能对其进行有意义的操作，即验证它是否是一个日期。`代码列表\
  \ 24.1`(#ch24.html_ch24ex1) 显示了检查来自表单的 `month` 和 `year` 变量并基于它们构建时间戳的代码片段。\n\n```php\n\
  <?php\nif (!isset($_POST['month'])) || (!isset($_POST['year']))) {\n    $nowArray\
  \ = getdate();\n    $month = $nowArray['mon'];\n    $year = $nowArray['year'];\n\
  } else {\n    $month = $_POST['month'];\n    $year = $_POST['year'];\n}\n$start\
  \ = mktime (12, 0, 0, $month, 1, $year);\n$firstDayArray = getdate($start);\n?>\n\
  ```\n\n`代码列表 24.1`ch24.html_ch24ex1) 是一个较大脚本的片段，因此它不会产生任何输出。但它是理解的重要片段，这就是为什么它被放在这里准备进行解释。\n\
  \n在第 2 行的 `if` 语句中，我们测试了月份和年份是否由表单提供。如果月份和年份未定义，片段中随后使用的 `mktime()` 函数将无法从未 `month`\
  \ 和 `year` 创建有效日期。\n\n如果值存在，我们使用第 3 行的 `getdate()` 根据当前时间创建一个关联数组。然后我们使用数组的 `mon`\
  \ 和 `year` 元素（第 4 行和第 5 行）为 `$month` 和 `$year` 设置值。如果变量已从表单设置，我们将数据放入 `$month` 和\
  \ `$year` 变量中，以免触动原始 `$_POST` 全局变量中的值。\n\n现在我们确定 `$month` 和 `$year` 中有有效数据，可以使用\
  \ `mktime()` 为每月的第一天创建一个时间戳（第 10 行）。我们之后需要此时间戳的信息，因此在第 11 行，我们创建一个名为 `$firstDayArray`\
  \ 的变量，它将存储 `getdate()` 根据此时间戳返回的关联数组。\n\n#### 构建 HTML 表单\n\n现在我们需要创建一个界面，用户可以通过它可以查看特定月份和年份的数据。为此，我们使用\
  \ `SELECT` 元素。虽然我们可以在 HTML 中硬编码这些内容，但我们必须确保下拉列表默认为当前选中的月份，因此我们将动态创建这些下拉列表，并在适当的地方为\
  \ `OPTION` 元素添加 `SELECT` 属性。表单在 `代码列表 24.2`(#ch24.html_ch24ex02)中生成。\n\n```php\n\
  <?php\nif (!isset($_POST['month'])) || (!isset($_POST['year']))) {\n    $nowArray\
  \ = getdate();\n    $month = $nowArray['mon'];\n    $year = $nowArray['year'];\n\
  } else {\n    $month = $_POST['month'];\n    $year = $_POST['year'];\n}\n$start\
  \ = mktime (12, 0, 0, $month, 1, $year);\n$firstDayArray = getdate($start);\n?>\n\
