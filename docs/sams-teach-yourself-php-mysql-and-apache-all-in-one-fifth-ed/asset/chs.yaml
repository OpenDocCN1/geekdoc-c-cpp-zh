  ```\n1 row in set (0.00 sec)\n\n子串函数的许多常见用途之一是提取订单号的部分内容，以查找是谁下了订单。在某些应用程序中，系统被设计为自动生成包含日期、客户标识和其他信息的订单号。如果此订单号始终遵循特定模式（例如\
  \ `XXXX-YYYYY-ZZ`），你可以使用子串函数提取整体的各个部分。例如，如果 `ZZ` 始终代表订单发货的状态，你可以使用 `RIGHT()` 函数提取这些字符，并报告发往特定状态的订单数量。\n\
  \n## 字符串修改函数\n\nPHP 有许多用于修改字符串外观的函数，但如果你可以在 SQL 语句中完成此任务，那就越好——让数据库系统尽可能多地工作。\n\n\
  MySQL 的 `LCASE()` 和 `UCASE()` 函数可以将字符串转换为小写或大写：\n\n```sql\nSELECT LCASE('MYSQL');\n\
  ```\n\n此查询产生以下结果：\n\n```\n+----------------+\n| LCASE('MYSQL') |\n+----------------+\n\
  | mysql           |\n+----------------+\n```\n1 row in set (0.00 sec)\n\n若要转换为大写，请使用以下语句：\n\
  \n```sql\nSELECT UCASE('mysql');\n```\n\n此查询产生以下结果：\n\n```\n+----------------+\n\
  | UCASE('mysql') |\n+----------------+\n| MYSQL           |\n+----------------+\n\
  ```\n1 row in set (0.00 sec)\n\n> **提示**\n> `LCASE()` 和 `UCASE()` 函数的一个实际用途是当你针对存储在\
  \ MySQL 中的数据验证用户输入时——例如在用户登录表单的情况下。如果你希望登录过程看起来不区分大小写，你可以尝试将用户输入的大写（或小写）版本与表中存储数据的大写（或小写）版本进行匹配。\n\
  \n记住，如果你对字段名使用这些函数，请不要使用引号：\n\n点击此处查看代码图片\n\n```sql\nSELECT UCASE(lastname) FROM\
  \ master_name;\n```\n\n使用前述查询产生如下结果：\n\n```\n+-----------------+\n| UCASE(lastname)\
  \ |\n+-----------------+\n| BELL             |\n| CARR             |\n| DOE    \
  \          |\n| JONES            |\n| JONES            |\n| SMITH            |\n\
  | SMITH            |\n| SMITH            |\n| SMITH            |\n+-----------------+\n\
  ```\n9 rows in set (0.00 sec)\n\n另一个有趣的字符串处理函数是 `REPEAT()`，它的作用正顾名其义——按照指定的次数重复字符串：\n\
  \n```sql\nSELECT REPEAT(\"bowwow\", 4);\n```\n\n你应该看到这个结果：\n\n```\n+--------------------------+\n\
  | REPEAT(\"bowwow\", 4)      |\n+--------------------------+\n| bowwowbowwowbowwowbowwow\
  \ |\n+--------------------------+\n```\n1 row in set (0.00 sec)\n\n`REPLACE()` 函数将给定字符串的所有出现处替换为另一个字符串：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT REPLACE('bowwowbowwowbowwowbowwow', 'wow', 'WOW');\n\
  ```\n\n此查询产生以下：\n\n点击此处查看代码图片\n\n```\n+---------------------------------------------------+\n\
  | REPLACE('bowwowbowwowbowwowbowwow', 'wow', 'WOW') |\n+---------------------------------------------------+\n\
  | bowWOWbowWOWbowWOWbowWOW                          |\n+---------------------------------------------------+\n\
  ```\n1 row in set (0.00 sec)\n\n## 在 MySQL 中使用日期时间函数\n\n你可以在 `SELECT` 语句中使用 MySQL\
  \ 内置的日期相关函数（无论是否指定表）来获取函数的结果。或者你也可以对任何类型的字段使用函数：`date`、`datetime` 和 `timestamp`。根据所使用的字段类型，日期相关函数的结果有用程度不等。以下示例并非日期和时间相关函数的完整库。更多信息，请参阅\
  \ MySQL 手册 [`dev.mysql.com/doc/refman/5.5/en/date-time-functions.html`](http://dev.mysql.com/doc/refman/5.5/en/date-time-functions.html)。\n\
  \n### 日期操作\n\n`DAYOFWEEK()` 和 `WEEKDAY()` 函数执行类似的操作，但结果略有不同。这两个函数都能找到日期的星期索引，但区别在于起始日和位置。如果你使用\
  \ `DAYOFWEEK()`，一周的第一天是周日（位置为 1），一周的最后一天是周六（位置为 7）。\n\n```sql\nSELECT DAYOFWEEK('2023-10-22');\n\
  ```\n\n```\n+-------------------------\n| DAYOFWEEK('2023-10-22') |\n+-------------------------\n\
  | 4                      |\n+-------------------------\n```\n1 row in set (0.00\
  \ sec)\n\n同样，使用 `WEEKDAY()`：\n\n```sql\nSELECT WEEKDAY('2023-10-22');\n```\n\n产生以下结果：\n\
  \n```\n+-----------------------\n| WEEKDAY('2023-10-22') |\n+-----------------------\n\
  | 3                      |\n+-----------------------\n```\n1 row in set (0.00 sec)\n\
  \n`DAY()` 函数返回日期中的几：\n\n```sql\nSELECT DAY('2023-10-22');\n```\n\n```\n+------------------\n\
  | DAY('2023-10-22') |\n+------------------\n| 22               |\n+------------------\n\
  ```\n1 row in set (0.00 sec)\n\n`MONTH()` 函数返回月份：\n\n```sql\nSELECT MONTH('2023-10-22');\n\
  ```\n\n```\n+----------\n| MONTH('2023-10-22') |\n+----------\n| 10            \
  \     |\n+----------\n```\n1 row in set (0.00 sec)\n\n`YEAR()` 函数返回年份：\n\n```sql\n\
  SELECT YEAR('2023-10-22');\n```\n\n```\n+----------\n| YEAR('2023-10-22') |\n+----------\n\
  | 2023               |\n+----------\n```\n1 row in set (0.00 sec)\n\n`QUARTER()`\
  \ 函数返回季度：\n\n```sql\nSELECT QUARTER('2023-10-22');\n```\n\n```\n+----------\n| QUARTER('2023-10-22')\
  \ |\n+----------\n| 4                  |\n+----------\n```\n1 row in set (0.00 sec)\n\
  \n`LAST_DAY()` 函数返回月份最后一天：\n\n```sql\nSELECT LAST_DAY('2023-10-22');\n```\n\n```\n\
  +--------------------+\n| LAST_DAY('2023-10-22') |\n+--------------------+\n| 2023-10-31\
  \         |\n+--------------------+\n```\n1 row in set (0.00 sec)\n\n`DATEDIFF()`\
  \ 函数计算两个日期之间的天数：\n\n```sql\nSELECT DATEDIFF('2023-10-22', '2023-10-20');\n```\n\n\
  ```\n+----------------------+\n| DATEDIFF('2023-10-22', '2023-10-20') |\n+----------------------+\n\
  | 2                    |\n+----------------------+\n```\n1 row in set (0.00 sec)\n\
  \n`TIMESTAMPDIFF()` 函数计算两个时间之间的时间差：\n\n```sql\nSELECT TIMESTAMPDIFF(SECOND, '2023-10-22\
  \ 10:00:00', '2023-10-22 10:05:00');\n```\n\n```\n+----------------------------------------------------+\n\
  | TIMESTAMPDIFF(SECOND, '2023-10-22 10:00:00', '2023-10-22 10:05:00') |\n+----------------------------------------------------+\n\
  | 300                                                |\n+----------------------------------------------------+\n\
  ```\n1 row in set (0.00 sec)\n\n\n\n\n\n```\n+-----------------------+\n| Thursday\
  \             |\n| Monday               |\n| Thursday             |\n| Thursday\
  \             |\n| Wednesday           |\n| Thursday             |\n| Sunday   \
  \            |\n| Sunday               |\n+-----------------------+\n8 rows in set\
  \ (0.00 sec)\n```\n\n函数并不局限于 `WHERE` 子句——你也可以在 `ORDER BY` 子句中使用它们，例如所示：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT DAYNAME(date_ordered) FROM orders ORDER BY DAYOFWEEK(date_ordered);\n\
  ```\n\n### 处理月份和年份\n\n星期中的某天并不是日历的唯一部分，MySQL 也有专门针对月份和年份的函数。与 `DAYOFWEEK()` 和 `DAYNAME()`\
  \ 函数一样，`MONTH()` 和 `MONTHNAME()` 会返回给定日期的一年中的月份数字和月份名称。例如：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT MONTH('2012-01-09'), MONTHNAME('2012-01-09');\n```\n\n此查询产生以下结果：\n\n点击此处查看代码图片\n\
  \n```\n+---------------------+-------------------------+\n| MONTH('2012-01-09')\
  \ | MONTHNAME('2012-01-09') |\n+---------------------+-------------------------+\n\
  | 1                   | January                 |\n+---------------------+-------------------------+\n\
  1 row in set (0.00 sec)\n```\n\n在 `orders` 表上使用 `MONTHNAME()` 显示了的结果，但可能会显示大量重复数据：\n\
  \n```\n+-------------------------+\n| MONTHNAME(date_ordered) |\n+-------------------------+\n\
  | November               |\n| November               |\n| November             \
  \  |\n| November               |\n| November               |\n| November       \
  \        |\n| November               |\n| October               |\n+-------------------------+\n\
  8 rows in set (0.00 sec)\n```\n\n你可以使用 `DISTINCT` 来获取非重复的结果：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT DISTINCT MONTHNAME(date_ordered) FROM orders;\n```\n\n此查询产生类似这些的结果：\n\n```\n\
  +-------------------------+\n| MONTHNAME(date_ordered) |\n+-------------------------+\n\
  | November               |\n| October               |\n+-------------------------+\n\
  2 rows in set (0.00 sec)\n```\n\n处理年份时，`YEAR()` 函数返回给定日期的年份：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT DISTINCT YEAR(date_ordered) FROM orders;\n```\n\n此查询产生如下结果：\n\n```\n+--------------------+\n\
  | YEAR(date_ordered) |\n+--------------------+\n|             2011 |\n|        \
  \     2012 |\n+--------------------+\n1 row in set (0.00 sec)\n```\n\n### 处理周\n\n\
  周可能是一件复杂的事情——如果星期日是周的第一天且 12 月还没有结束，那么一年可能有 53 周。例如，2001 年 12 月 30 日是星期日：\n\n```sql\n\
  SELECT DAYNAME('2001-12-30');\n```\n\n这里是证明：\n\n```\n+-----------------------+\n\
  | DAYNAME('2001-12-30') |\n+-----------------------+\n| Sunday               |\n\
  +-----------------------+\n1 row in set (0.00 sec)\n```\n\n这一事实使得 2001 年 12 月 30\
  \ 日成为该年的第 53 周，你可以通过此查询看到：\n\n```sql\nSELECT WEEK('2001-12-30');\n```\n\n年份中的周显示得当：\n\
  \n```\n+--------------------+\n| WEEK('2001-12-30') |\n+--------------------+\n\
  |               53 |\n+--------------------+\n1 row in set (0.00 sec)\n```\n\n第\
  \ 53 周包含了 12 月 30 日和 31 日，且只有 2 天长；2002 年的第一周从 1 号开始。如果你希望你的周从周一开始，但仍然想找到年份中的某周，可选的第二个参数允许你更改起始日。`1`\
  \ 表示从周一开始的周。在以下示例中，周一起始使得 12 月 30 日成为 2001 年第 52 周的一部分，但 12 月 31 日仍然是 2001 年第 53\
  \ 周的一部分：\n\n```sql\nSELECT WEEK('2001-12-30',1);\n```\n\n此查询产生以下结果：\n\n```\n+----------------------+\n\
  | WEEK('2001-12-30',1) |\n+----------------------+\n|                52 |\n+----------------------+\n\
  1 row in set (0.00 sec)\n```\n\n而此查询：\n\n```sql\nSELECT WEEK('2001-12-31',1);\n\
  ```\n\n产生此结果：\n\n```\n+----------------------+\n| WEEK('2001-12-31',1) |\n+----------------------+\n\
  |                53 |\n+----------------------+\n1 row in set (0.00 sec)\n```\n\n\
  \n\n\n花些时间自己尝试一下日期格式选项；有很多选项，而且你会发现它们非常易上手。\n\n## 在 MySQL 中执行日期算术\n\nMySQL 提供了几个函数来帮助执行日期算术，在这些领域，让\
  \ MySQL 进行计算通常比让你的 PHP 脚本进行计算更高效。`DATE_ADD()` 和 `DATE_SUB()` 函数根据起始日期和间隔返回结果。这两个函数的语法如下如下：\n\
  \n```\nDATE_ADD(date,INTERVAL value type)\nDATE_SUB(date,INTERVAL value type)\n\
  ```\n\n表 16.3 显示了可能的类型及其预期的值格式。\n\n**表 16.3 日期算术中的值和类型**\n\n![image](img/16tab03.jpg)\n\
  \n例如，要找到今天加 21 天后的日期，请使用以下代码：\n\n```sql\nSELECT DATE_ADD(NOW(), INTERVAL 21 DAY);\n\
  ```\n\n我刚才运行的查询产生了以下结果：\n\n```\n+----------------------------------+\n| DATE_ADD(NOW(),\
  \ INTERVAL 21 DAY) |\n+----------------------------------+\n| 2012-01-31 21:02:16         |\n\
  +----------------------------------+\n1 row in set (0.02 sec)\n```\n\n使用 `DATE_SUB()`\
  \ 产生了此结果：\n\n```\n+----------------------------------+\n| DATE_SUB(NOW(), INTERVAL\
  \ 21 DAY) |\n+----------------------------------+\n| 2011-12-20 21:02:23         |\n\
  +----------------------------------+\n1 row in set (0.00 sec)\n```\n\n请像表 16.3 所示那样使用\
  \ `DAY` 表达式，尽管人们可能倾向于使用 `DAYS` 而不是 `DAY`。使用 `DAYS` 会导致错误：\n\n点击此处查看代码图片\n\n```\n\
  ERROR 1064: You have an error in your SQL syntax near 'DAYS)' at line 1\n```\n\n\
  如果你在 `DATE_ADD()` 或 `DATE_SUB()` 中使用 `date` 值而不是 `datetime` 值，结果将显示为 `date` 值，除非你使用了与小时、分、秒相关的表达式。在这种情况下，你的结果是一个\
  \ `datetime` 结果。\n\n例如，这里第一个查询的结果仍然是 `date` 字段，而第二个则变成了 `datetime`：\n\n```sql\n\
  SELECT DATE_ADD(\"2011-12-31\", INTERVAL 1 DAY);\n```\n\n此查询产生以下结果：\n\n```\n+----------------------------------------+\n\
  | DATE_ADD(\"2011-12-31\", INTERVAL 1 DAY) |\n+----------------------------------------+\n\
  | 2012-01-01                |\n+----------------------------------------+\n1 row\
  \ in set (0.00 sec)\n```\n\n而此查询：\n\n```sql\nSELECT DATE_ADD(\"2011-12-31\", INTERVAL\
  \ 12 HOUR);\n```\n\n产生了此结果：\n\n点击此处查看代码图片\n\n```\n+------------------------------------------+\n\
  | DATE_ADD(\"2011-12-31\", INTERVAL 12 HOUR) |\n+------------------------------------------+\n\
  | 2011-12-31 12:00:00         |\n+------------------------------------------+\n\
  1 row in set (0.00 sec)\n```\n\n你也可以使用 `+` 和 `-` 运算符执行日期算术，而不是使用 `DATE_ADD()` 和\
  \ `DATE_SUB()` 函数，例如这里：\n\n```sql\nSELECT \"2011-12-31\" + INTERVAL 1 DAY;\n```\n\
  \n此查询产生以下结果：\n\n```\n+-------------------------------+\n| \"2011-12-31\" + INTERVAL\
  \ 1 DAY |\n+-------------------------------+\n| 2012-01-01       |\n+-------------------------------+\n\
  1 row in set (0.00 sec)\n```\n\n## 特殊函数和转换功能\n\nMySQL 的 `NOW()` 函数返回当前的 `datetime`\
  \ 结果，适用于记录登录或访问时间的时间戳，以及许多其他任务。MySQL 还有其他几个功能类似的函数。\n\n`CURDATE()` 和 `CURRENT_DATE()`\
  \ 函数是同义词，它们都返回 `YYYY-MM-DD` 格式的当前日期：\n\n```sql\nSELECT CURDATE(), CURRENT_DATE();\n\
  ```\n\n此查询产生如下结果：\n\n```\n+------------+----------------+\n| CURDATE()  | CURRENT_DATE()\
  \ |\n+------------+----------------+\n| 2012-01-31 | 2012-01-31 |\n+------------+----------------+\n\
  ```\n\n同样，`CURTIME()` 和 `CURRENT_TIME()` 函数返回 `HH:MM:SS` 格式的当前时间：\n\n```sql\nSELECT\
  \ CURTIME(), CURRENT_TIME();\n```\n\n此查询产生如下结果：\n\n```\n+-----------+----------------+\n\
  | CURTIME()  | CURRENT_TIME() |\n+-----------+----------------+\n| 21:02:16 | 21:02:16\
  \ |\n```\n\n`NOW()`、`SYSDATE()` 和 `CURRENT_TIMESTAMP()` 函数返回 `datetime` 格式的值（`YYYY-MM-DD\
  \ HH:MM:SS`）：\n\n```sql\nSELECT NOW(), SYSDATE(), CURRENT_TIMESTAMP();\n```\n\n\
  此查询产生的结果如下：\n\n点击此处查看代码图片\n\n```\n+---------------------+---------------------+\n\
  | NOW()   | SYSDATE()   | CURRENT_TIMESTAMP() |\n+---------------------+---------------------+\n\
  | 2012-01-31 21:02:16 | 2012-01-31 21:02:16 | 2012-01-31 21:02:16 |\n+---------------------+---------------------+\n\
  ```\n\n### 总结\n\n在本章中，你学习了 SQL 的基础知识，从创建表到操作记录。创建表的命令需要三个重要的信息：表名、字段名和字段定义。字段定义非常重要，因为设计良好的表有助于提高数据库运行速度。MySQL\
  \ 有三类数据类型：数值、日期和时间以及字符串。\n\n\n\n\n`INSERT` 命令用于向表中添加记录，它指定了要填充的表和列名，然后定义了对应的值。在\
  \ `INSERT` 语句中放置值时，必须将字符串括在单引号或双引号内。`SELECT` SQL 命令用于从特定表中检索记录。`*` 字符允许你轻松地选择表中所有记录的所有字段，你也可以指定特定的列名。如果结果集过长，`LIMIT`\
  \ 子句提供了一种简单的方法来提取结果切片，你只需要指定起始位置和要返回的记录数。要对结果进行排序，使用 `ORDER BY` 子句来选择排序的列。排序可以针对整数、日期和字符串进行，并可按升序或降序排列。默认顺序是升序。如果不指定顺序，结果将按照它们在表中出现的顺序显示。\n\
  \n你可以使用 `WHERE` 子句来挑选和选择你想要返回的记录，以测试条件的有效性。`WHERE` 子句中使用比较运算符或逻辑运算符，有时会在复合语句中同时使用这两种类型。在一个语句中从多个表中选择记录属于高级高级操作，因为这种类型的语句——称为\
  \ `JOIN`——需要深思熟虑和规划才能产生正确的结果。常见的 `JOIN` 类型有 `INNER JOIN`、`LEFT JOIN` 和 `RIGHT JOIN`，尽管\
  \ MySQL 支持许多不同的 `JOIN`。你还学习了在处理多个表时，可以使用子查询来代替 `JOIN`。\n\n`UPDATE` 和 `REPLACE` 命令用于修改\
  \ MySQL 表中的现有数据。`UPDATE` 适用于更改特定列的值，以及根据特定条件更改多条记录的值。`REPLACE` 是 `INSERT` 的变体，它会删除并重新插入具有匹配主键的记录。在使用\
  \ `UPDATE` 更改列值时要小心，因为如果没有添加条件，会导致该列被更新到表中所有的记录。\n\n`DELETE` 命令非常简单：它从表中删除整条记录。这使得它具有危险性，因此请务必只给能够承担相应责任的用户授予\
  \ `DELETE` 权限。在使用 `DELETE` 时，你可以指定条件，以便只有当 `WHERE` 子句中的特定表达式为真时才会删除记录。此外，你还可以使用\
  \ `LIMIT` 子句删除表中较小规模的记录。如果你有一个异常巨大的表，删除部分内容比在巨大的表中删除每条记录更节省资源。\n\n你已经接触了对字符串、日期和时间执行操作的\
  \ MySQL 函数。如果你在 MySQL 中有想要拼接或统计字符数量的字符串，可以使用 `CONCAT()`、`CONCAT_WS()` 和 `LENGTH()`\
  \ 等函数。要对字符串进行填充或移除填充，使用 `RPAD()`、`LPAD()`、`TRIM()`、`LTRIM()` 和 `RTRIM()` 来获取所需的字符串。你还可以使用\
  \ `LOCATE()`、`SUBSTRING()`、`LEFT()` 和 `RIGHT()` 函数查找字符串在另一个字符串中的位置，或返回给定字符串的一部分。`LCASE()`、`UCASE()`、`REPEAT()`\
  \ 和 `REPLACE()` 等函数也会返回原始字符串的变体。MySQL 内置的日期时间函数可以通过在内部格式化日期时间并执行日期时间算术来减轻应用程序的负担。`DATE_FORMAT()`\
  \ 函数使用的格式选项提供了一种从任何类型的日期字段生成自定义显示字符串的简单方法。`DATE_ADD()` 和 `DATE_SUB()` 函数及其许多可用的间隔类型帮助你确定过去或未来的日期。此外，`DAY()`、`WEEK()`、`MONTH()`\
  \ 和 `YEAR()` 等函数对于提取日期部分用于 `WHERE` 或 `ORDER BY` 子句非常有用。\n\n### Q&A\n\n**Q. 我可以使用哪些字符来命名我的表和字段？字符限制是多少？**\n\
  \n**A.** 数据库、表或字段名的最大长度为 64 个字符。任何可以在目录名或文件名中使用的字符都可以用于数据库和表名，但 `/` 和 `.` 除外。设置这些限制是因为\
  \ MySQL 会在你的文件系统中创建目录和文件，这些内容对应于数据库和表名。字段名没有字符限制（长度除外）。\n\n**Q. 我可以在一个语句中使用多个函数吗，例如将拼接后的字符串全部转换为大写？**\n\
  \n**A.** 可以的。只需注意你的左括号和右括号即可。这个示例展示了如何将 `master_name` 表中拼接后的名和姓转换为大写：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT UCASE(CONCAT_WS(' ', firstname, lastname)) FROM master_name;\n\
  ```\n\n结果将如下：\n\n点击此处查看代码图片\n\n+--------------------------------------------+\n\
  | UCASE(CONCAT_WS(' ', firstname, lastname)) |\n+--------------------------------------------+\n\
  | JOHN SMITH                                |\n| JANE SMITH                    \
  \            |\n| JIMBO                                     |\n| ANDY SMITH    \
  \                            |\n| CHRIS JONES                               |\n\
  | ANNA BELL                                 |\n| JIMMY CARR                    \
  \            |\n| ALBERT SMITH                              |\n| JOHN DOE      \
  \                            |\n+--------------------------------------------+\n\
  9 rows in set (0.0 sec)\n\n如果你只想将姓转换为大写，请使用这个：\n\n点击此处查看代码图片\n\n```sql\nSELECT CONCAT_WS('\
  \ ', firstname, UCASE(lastname)) FROM master_name;\n```\n\n结果将如下：\n\n点击此处查看代码图片\n\
  \n+--------------------------------------------+\n| CONCAT_WS(' ', firstname, UCASE(lastname))\
  \ |\n+--------------------------------------------+\n| JOHN SMITH |\n| JANE SMITH\
  \ |\n| Jimbo JONES|\n| Andy SMITH |\n| Chris JONES|\n| ANNA BELL  |\n| Jimmy CARR\
  \  |\n| Albert SMITH|\n| John DOE   |\n+--------------------------------------------+\n\
  \n\n\n\n\n## [2]. `ENUM ('apple', 'pear', 'banana', 'cherry')`\n\n或\n\n`SET ('apple',\
  \ 'pear', 'banana', 'cherry')`\n\n## [3]. `LIMIT 0, 25` 和 `LIMIT 25, 25`\n\n## [4].\
  \ `LIKE 'Jo%'`\n\n## [5]. 在查询中使用 `table1.id` 代替 `id`。\n\n## [6]. `SELECT orders.order_name,\
  \ orders.order_date, items_ordered.item_description FROM orders LEFT JOIN items_ordered\
  \ ON orders.order_id = items_ordered.id;`\n\n## [7]. `SELECT LOCATE('grape', 'applepearbananagrape');`\n\
  \n## [8]. `SELECT RIGHT(\"applepearbananagrape\", 5);`\n\n### 活动\n花时间创建一些示例表，并练习使用基本的\
  \ `INSERT` 和 `SELECT` 命令。\n\n## 第 17 章.在 MySQL 中使用事务和存储过程\n\n在本章中，你将学习以下内容：\n\n\
  - 事务的基础知识以及如何在 MySQL 中使用事务\n- 存储过程的基础知识以及如何在 MySQL 中创建和访问它们\n\n在上一章中，你学习了 SQL 的基础知识，以及如何使用\
  \ MySQL 命令行界面发布查询并检索结果。仅凭这些知识，你就可以成功完成此书中剩余章节中的项目。然而，当你不断完善知识并考虑构建适用于企业环境的应用程序时，你可能需要更高级的策略来维护数据的完整性，并增强应用程序与\
  \ MySQL 的通信。\n\n虽然本书的剩余章节不包含本章的元素——为了保持示例尽可能简单，以便你的基础知识扎固——但你可以轻松地自己更新代码，以包含在本章中学到的信息。\n\
  \n## 什么是事务？\n*数据库事务*是一组查询，它们的执行方式必须确保：如果其中一个查询未能完全执行，则所有查询都失败。例如，假设有一组三个查询，第二个依赖于第一个的结果，第三个依赖于第二个的结果。如果第二个查询失败，你需要一种方法来撤销第一个查询的结果；同样，如果第三个查询失败，你还需要撤销第一个和第二个查询的结果。\n\
  \n通过在数据库驱动的应用程序中建立事务处理，你可以确保存储在数据库中的数据完整性。接下来的章节描述了通过命令行界面和 PHP 函数使用事务的过程。\n\n>\
  \ 注意\n在 MySQL 中使用 InnoDB 存储引擎时可以使用完全事务表。从 MySQL 5.5.5 开始，InnoDB 是新表的默认存储引擎（更多信息请参见\
  \ [`dev.mysql.com/doc/refman/5.5/en/innodb-default-se.html`](http://dev.mysql.com/doc/refman/5.5/en/innodb-default-se.html)）。如果你的表是\
  \ MyISAM 类型，它们将不会是完全事务的。\n\n### 事务中使用的基本语法\n在考虑在 MySQL 中事务时，你需要理解以下关键术语：\n\n- `COMMIT`—此命令发生在事务中系列查询的结束处，并且仅在所有必需查询都成功执行时才发布。\n\
  - `ROLLBACK`—此命令用于事务系列查询中的一个或多个查询失败时，并将受影响的表重置为事务之前的状态。\n\n回到讨论开始提到的场景，即三个相互依赖的查询，MySQL\
  \ 命令行界面中的事件序列可能如下所示：\n\n1. 发布 `BEGIN` 命令以开始新事务。\n2. 从 `table1` 中选择一个值并插入到 `table2`\
  \ 中。\n3. 如果无法从 `table1` 中选择值，发布 `ROLLBACK` 命令以确保事务结束且表恢复到之前的状态。\n4. 如果可以从 `table1`\
  \ 中选择值，则将该值插入到 `table2`。\n5. 如果向 `table2` 插入记录失败，发布 `ROLLBACK` 命令以确保事务结束且表恢复到之前的状态。\n\
  6. 如果可以向 `table1` 插入值，则将该值插入到 `table2`。\n7. 如果向 `table3` 插入记录失败，发布 `ROLLBACK` 命令以确保事务结束且表恢复到之前的状态。\n\
  8. 然而，如果向 `table3` 插入记录成功，发布 `COMMIT` 命令以确保事务结束且表得到相应的更新。\n\n有关 MySQL 事务内部工作机制的更多信息，请参阅\
  \ MySQL 手册 [`dev.mysql.com/doc/refman/5.5/en/sql-syntax-transactions.html`](http://dev.mysql.com/doc/refman/5.5/en/sql-syntax-transactions.html)。\n\
  \n下一节提供了一个用于库存和销售记录的事务示例。\n\n### 示例示例\n为了本示例，假设你创建了一个包含存储库存和销售记录表的在线商店。`CREATE`\
  \ 语句可能如下：\n\n```sql\nCREATE TABLE store_inventory (\n  id int PRIMARY KEY AUTO_INCREMENT,\n\
  \  item_name varchar(50),\n  item_price float,\n  item_qty int\n) ENGINE=InnoDB;\n\
  \nCREATE TABLE store_orders (\n  id int PRIMARY KEY AUTO_INCREMENT,\n  purchaser_name\
  \ varchar(50),\n  purchase_date datetime\n) ENGINE=InnoDB;\n\nCREATE TABLE store_orders_items\
  \ (\n  id int PRIMARY KEY AUTO_INCREMENT,\n  order_id int,\n  inventory_id int,\n\
  \  item_qty int\n) ENGINE=InnoDB;\n```\n\n在示例的 `store_inventory` 表中，你可以找到两条记录：\n\
  \n```\n+----+------------+------------++\n| id | item_name  | item_price | item_qty\
  \ |\n+----+------------+------------++\n| 1  | Great Book  | 19.99      | 10   \
  \   |\n| 2  | Awesome CD | 9.99       | 20      |\n+----+------------+------------++\n\
  ```\n\n如果购物者想通过你的在线商店购买两本 Great Book 和一个 Awesome CD，过程将如下：\n\n1. 用户填写在线表单并尝试支付购买，因此发布作为结账脚本部分的事务\
  \ `BEGIN` 命令：\n```sql\nBEGIN;\n```\n\n2. 减少 `store_inventory` 表中的物品数量：\n```sql\n\
  UPDATE store_inventory SET item_qty = item_qty - 2 WHERE id = 1;\nUPDATE store_inventory\
  \ SET item_qty = item_qty - 1 WHERE id = 2;\n```\n\n3. 向 `store_orders` 表添加记录：\n\
  ```sql\nINSERT INTO store_orders (purchaser_name, purchase_date)\nVALUES ('John\
  \ Smith', now());\n```\n\n4. 如果添加记录失败，发布 `ROLLBACK` 命令以重置可用数量：\n```sql\nROLLBACK;\n\
  ```\n\n5. 如果添加记录成功，获取刚刚添加的记录 ID 并将其用于你的查询中，通过向 `store_orders_items` 表插入记录来向销售记录添加行项目：\n\
  ```sql\nINSERT INTO store_orders_items (order_id, inventory_id, item_qty)\nVALUES\
  \ ('1', '1', '2');\nINSERT INTO store_orders_items (order_id, inventory_id, item_qty)\n\
  VALUES ('1', '2', '1');\n```\n\n6. 如果添加记录失败，发布 `ROLLBACK` 命令以重置可用数量并移除 `store_orders`\
  \ 中的记录：\n```sql\nROLLBACK;\n```\n\n\n\n\n\n## 7. 如果记录添加成功，但后续信用卡或其他支付方式的扣费失败，请执行\
  \ `ROLLBACK` 命令以重置物品可用数量，删除 `store_orders` 中的记录，并删除 `store_orders_items` 中的记录：\n\
  \n```sql\nROLLBACK;\n```\n\n## 8. 如果记录添加成功且后续信用卡或其他支付方式的扣费也成功，请执行 `COMMIT` 命令以确保所有更改都已存储并结束事务：\n\
  \n```sql\nCOMMIT;\n```\n\n当然，在线商店不会直接通过命令行界面与 MySQL 交互，而是通过像 PHP 这样的脚本语言进行。然而，如果你理解事务背后的流程，将其接入到\
  \ PHP 中就非常简单——发布之前列出的查询和命令与任何其他 PHP 到 MySQL 的通信没有区别，这些你将在第 18 章“使用 PHP 与 MySQL 交互”中学习到。\n\
  \n除了你在第 18 章中学到的信息外，如果你打算在脚本中使用事务，请务必查看 PHP 手册中的这些函数定义：\n\n• `mysqli_autocommit()`—[`www.php.net/mysqli_autocommit`](http://www.php.net/mysqli_autocommit)\n\
  • `mysqli_commit()`—[`www.php.net/mysqli_commit`](http://www.php.net/mysqli_commit)\n\
  • `mysqli_rollback()`—[`www.php.net/mysqli_rollback`](http://www.php.net/mysqli_rollback)\n\
  \n我还要反复强调的是，请查看 MySQL 手册以获取有关事务的更多信息，地址为：[`dev.mysql.com/doc/refman/5.5/en/sql-syntax-transactions.html`](http://dev.mysql.com/doc/refman/5.5/en/sql-syntax-transactions.html)，特别是讨论无法回滚的事务类型的区域——大部分是管理操作，但了解它们仍然很有用。\n\
  \n## 什么是存储过程？\n\n简单来说，存储过程是存储在数据库服务器而不是 Web 服务器上的 SQL 过程。你可能认为认为你没有在 Web 服务器上存储任何过程，但实际上你确实存储了：任何包含\
  \ SQL 查询的脚本都算作存储在 Web 服务器上的过程。例如，你的应用程序中每个选择、删除、更新或插入数据到表的查询——这些都是你已经在脚本中苦苦编写的代码——都可以作为存储过程存储在数据库中，并在脚本中以这种方式引用它们。\n\
  \n在代码中使用存储过程的支持者认为性能和维护是其这么做的关键原因：\n\n• **性能性能**——存储过程以预编译 SQL 的形式存在于数据库中，因此典型的两步走过程（编译和执行）变成了单步过程（执行）。\n\
  • **易于维护**——在某处（数据库）维护一条语句比在许多地方（例如你 Web 服务器上的所有脚本中）维护同一条语句要节省大量得多。此外，将所有语句存储在数据库中，而不是存储在\
  \ Web 服务器文档根目录的实际文本文件中，万一有人访问了你 Web 服务器上的文件，这又多了一层防线；那个人所拥有的只是调用存储过程的查询，而不是过程本身的逻辑。\n\
  \n一个有用存储过程示例是用于生成某种类型报告的 SQL 查询——无论是财务数据、销售库存还是其他；只需想象一个涉及大量处理的复杂查询。将这种类型的查询创建为存储过程符合存储过程的性能优势。如果你有一个在应用程序中经常使用的简单查询，为它创建一个存储过程将符合存储过程的维护优势。无论存储过程多么简单或复杂，创建和使用它的过程遵循相同的相同的流程。\n\
  \n此存储过程示例使用了以下表：\n\n点击此处查看代码图像\n\n```sql\nCREATE TABLE testSP (\n   id int not null\
  \ primary key auto_increment,\n   field_name varchar(25),\n   date_added datetime\n\
  ) ENGINE=InnoDB;\n```\n\n此表用于测试的值如下：\n\n+----+------------+---------------------+\n\
  | id | field_name | date_added           |\n+----+------------+---------------------+\n\
  |  1 | Value 1     | 2012-01-23 09:40:24 |\n|  2 | Value 2     | 2012-01-24 09:40:24\
  \ |\n|  3 | Value 3     | 2012-01-25 09:40:24 |\n|  4 | Value 4     | 2012-01-26\
  \ 09:40:24 |\n|  5 | Value 5     | 2012-01-27 09:40:24 |\n|  6 | Value 6     | 2012-01-30\
  \ 09:40:24 |\n|  7 | Value 7     | 2012-01-31 09:40:24 |\n|  8 | Value 8     | 2012-02-01\
  \ 09:40:24 |\n|  9 | Value 9     | 2012-02-02 09:40:24 |\n| 10 | Value 10    | 2012-02-03\
  \ 09:40:24 |\n+----+------------+-----+\n\n越过此示例进入存储过程语法，你必须确保 MySQL 知道你将使用的分隔符。此示例使用了\
  \ `//`：\n\n```sql\nDELIMITER //\nCREATE PROCEDURE sp1()\nBEGIN\n   SELECT * FROM\
  \ testSP WHERE date_added BETWEEN DATE_SUB(NOW(), INTERVAL 7 DAY) AND NOW();\nEND\
  \ //\nDELIMITER ;\n```\n\n要调用存储过程，使用 `CALL` 命令：\n\n```sql\nCALL sp1();\n```\n\n\
  存储过程的结果返回给你：\n\n+----+------------+---------------------+\n| id | field_name | date_added\
  \           |\n+----+------------+---------------------+\n|  1 | Value 1     | 2012-01-23\
  \ 09:40:24 |\n|  2 | Value 2     | 2012-01-24 09:40:24 |\n|  3 | Value 3     | 2012-01-25\
  \ 09:40:24 |\n|  4 | Value 4     | 2012-01-26 09:40:24 |\n|  5 | Value 5     | 2012-01-27\
  \ 09:40:24 |\n|  6 | Value 6     | 2012-01-30 09:40:24 |\n|  7 | Value 7     | 2012-01-31\
  \ 09:40:24 |\n+----+------------+-----+\n\n### 总结\n\n本章简要介绍了事务处理的概念以及在 MySQL 中使用\
  \ InnoDB 引擎存储过程。除了对这两个主题进行简要概述外，实际示例描述了这些高级主题。本章的总体目的是向你介绍一些你在独立开发企业级应用时应该理解的概念和关键字。当你学习此书中的示例并尝试改进基础查询时，请将这些想法记在脑海中。\n\
  \n### 问答\n\n**Q. *既然 MySQL 支持事务，现在我必须一直使用事务 吗？***\n\n**A.** 不一定，特别是如果你的应用程序或网站的动态部分是为了数据的动态*显示*而不是数据的动态*插入*。此外，如果数据的插入并不一定与任何财务或库存相关的操作相关，你也可以不使用事务。换句话说，如果你不使用事务且插入或更新查询失败，请确保你能接受这种失败——因为不会损失金钱或关键客户数据。\n\
  \n### 工作坊\n\n工作坊旨在帮助你复习所学内容并开始将知识付诸实践。\n\n#### 测验\n\n\n\n\n## **1.** 判断对错：MyISAM\
  \ 是 MySQL 中默认的且支持全事务的存储引擎。\n\n## **2.** 如果三步事务中的第二步失败了，你会执行什么命令？\n\n## **3.** 使用存储过程的两个优点是什么？\n\
  \n### 答案\n\n**1.** 错误。InnoDB 是默认存储引擎，并支持全事务。\n\n**2.** `ROLLBACK`\n\n**3.** 性能更好且易于维护\n\
  \n### 练习\n\n**1.** 想想一些可能需要事务的额外数据库交互类型，并创建一组类似于本章所示的表。在所有交互可能需要这些命令的逻辑位置，练习执行和回滚命令。\n\
  \n**2.** 创建一个存储过程（以及其所需的表），报告在两个指定日期之间发生的包含特定项目的所有销售交易。\n\n# 第 18 章 使用 PHP 与 MySQL\
  \ 交互\n\n***\n\n***在本章中，你将学习以下内容：***\n\n• **如何使用 PHP 连接 MySQL**\n\n• **如何通过 PHP 脚本插入和查询数据**\n\
  \n***\n\n现在你已经学习了 PHP 的基础知识以及操作 MySQL 的基础知识，已经准备好让它们相互交互了。将 PHP 想象成通往 MySQL 的通道：你在上一章中学到的命令在本章中发送给\
  \ MySQL 的命令是相同的，只不过这次是通过 PHP 发送它们。\n\n是使用 MySQL 函数还是 MySQLi 函数？\n\n如果你在几年前用过 PHP\
  \ 现在重新回来，或者使用过当前版本的 PHP 但使用的是非常旧版本的 MySQL，你*可能*使用过 `mysql_*` 系列函数。你还可能在互联网上到处发现使用\
  \ `mysql_*` 系列函数的代码示例。\n\n然而，自 MySQL 4.1.3 以来（现在已是 7 多年前了），数据库系统包含了需要 PHP 新通信方法的功能，这些功能都包含在\
  \ `mysqli_*` 系列函数中。\n\n本章以及书中其余部分的所有代码都使用 `mysqli_*` 系列函数。欲需更多信息，请参见 PHP 手册中的“MySQL\
  \ Improved Extension”章节，访问 [`www.php.net/mysqli`](http://www.php.net/mysqli)。\n\n\
  ## 使用 PHP 连接 MySQL\n\n为了成功使用 PHP 函数与 MySQL 通信，你必须在一个 Web 服务器可以连接的位置运行 MySQL（不一定与\
  \ Web 服务器在同一台机器上）。你还必须创建一个用户（带有密码），并且知道你想连接的数据库名称。如果你遵循了第 2 章“安装和配置 MySQL”和第 4 章“安装和配置\
  \ PHP”中的说明，你应该已经处理了这个问题。如果你在互联网服务供应商的托管包中使用 PHP 和 MySQL，请确保在继续之前你已经获得或创建了用户名、密码和数据库名称。\n\
  \n在本章的所有脚本示例中，数据库名称为 `testDB`，用户为 `joeuser`，密码为 `somepass`。在使用这些脚本时，请替换为你自己的信息。\n\
  \n***\n\n#### 注意\n\n本章中的所有代码（以及后续章节）都反映了 `mysqli_*` 系列函数的过程化用法。你也可以以面向对象的方式使用这些函数。欲需更多信息，请访问\
  \ PHP 手册 [`www.php.net/mysqli`](http://www.php.net/mysqli)。\n\n如果你是从面向对象的编程语言转向\
  \ PHP 的，或者具有面向对象的思维方式，我建议复习 PHP 手册中的面向对象功能，并在适当的地方进行替换——从概念上说，这些过程是非常相似的。\n\n然而，如果你是编程初学者，或者还没有接受面向对象的思维方式，学习过程化风格或在日常工作中使用它也没有问题。我在整本书中继续使用过程化编程，因为它被证明是新程序员理解流程的最佳方式。\n\
  \n***\n\n### 建立连接\n\n连接 MySQL 的基本语法如下：\n\n点击此处查看代码图像\n\n```php\n$mysqli = mysqli_connect(\"\
  hostname\", \"username\", \"password\", \"database\");\n```\n\n`$mysqli` 的值是函数的结果，用于后续函数中与\
  \ MySQL 通信。\n\n插入示例值后，连接代码看起来如下：\n\n点击此处查看代码图像\n\n```php\n$mysqli = mysqli_connect(\"\
  localhost\", \"joeuser\", \"somepass\", \"testDB\");\n```\n\n列表 18.1 是连接脚本的一个运行示例。它在第\
  \ 2 行创建一个新连接，然后测试是否发生了错误。如果发生错误，第 5 行打印错误消息并使用 `mysqli_connect_error()` 函数打印消息。如果没有发生错误，第\
  \ 8 行打印包含主机信息的消息。\n\n***\n\n**列表 18.1** 连接脚本\n\n\n\n\n```php\n$mysqli = mysqli_connect(\"\
  localhost\", \"joeuser\", \"somepass\", \"testDB\");\n\nif (mysqli_connect_errno())\
  \ {\n    printf(\"Connect failed: %s\\n\", mysqli_connect_error());\n    exit();\n\
  } else {\n    $sql = \"CREATE TABLE testTable\n            (id INT NOT NULL PRIMARY\
  \ KEY AUTO_INCREMENT,\n            testField VARCHAR(75))\";\n    $res = mysqli_query($mysqli,\
  \ $sql);\n\n    if ($res === TRUE) {\n        echo \"Table testTable successfully\
  \ created.\";\n    } else {\n        printf(\"Could not create table: %s\\n\", mysqli_error($mysqli));\n\
  \    }\n\n    mysqli_close($mysqli);\n}\n?>\n```\n\n* * *\n* * *\n\n注意\n\n当你通过脚本发布查询时，SQL\
  \ 语句末不需要分号。\n\n* * *\n\n在第 8 到 10 行中，构成 SQL 语句的文本被赋值给变量 `$sql`。这是随机的，你甚至不需要将 SQL\
  \ 查询的内容放置在单独的变量中。（在示例中这样写是为了让此过程的不同部分更加清晰。）\n\n`mysqli_query` 函数返回一个 `true` 或 `false`\
  \ 值，该值在第 13 行开始的 `if...else` 语句中进行检查。如果 `$res` 的值为 `true`，则会在屏幕上打印一条成功消息。如果你通过命令行界面访问\
  \ MySQL 来验证 `testTable` 表的创建，你将看到 `DESCRIBE testTable` 的如下输出：\n\n点击此处查看代码图片\n\n\
  ```\n+-----------+-------------+------+-----+---------+----------------+\n| Field\
  \     | Type        | Null | Key | Default | Extra           |\n+-----------+-------------+------+-----+---------+----------------+\n\
  | id        | int(11)     |      | PRI | NULL    | auto_increment |\n| testField\
  \ | varchar(75) | YES  |     | NULL    |                  |\n+-----------+-------------+------+-----+---------+----------------+\n\
  ```\n\n如果是这样，恭喜你；你已使用 PHP 在你的 MySQL 数据库中成功了一个表。\n\n然而，如果 `$res` 的值不是 `true` 且表未创建，则会出现由\
  \ `mysqli_error()` 函数生成的错误消息。\n\n### 获取错误消息\n\n花些时间熟悉 `mysqli_error()` 函数；它将成为你的朋友。当与\
  \ PHP 的 `die()` 函数配合使用时（该函数会直接在它出现的地方退出脚本），当你出错时，`mysqli_error()` 函数会返回一个有帮助的错误消息。\n\
  \n例如，现在你已经创建了一个名为 `testTable` 的表，你无法在不报错的情况下再次执行该脚本。尝试再次执行脚本；当你执行脚本时，你应该在 浏览器中看到类似下面的内容：\n\
  \n点击此处查看代码图片\n\n```\nCould not create table: Table 'testtable' already exists\n\
  ```\n\n太令人兴奋了！进入下一节开始向你的表中插入数据，很快你就能通过 PHP 检索并格式化它们了。\n\n###  MySQL 数据操作\n\n插入、更新、删除和检索数据都围绕着使用\
  \ `mysqli_query()` 函数展开，该函数执行你在 第 16 章“学习基础 SQL 命令”中学习的基础 SQL 查询。对于 `INSERT`、`UPDATE`\
  \ 和 `DELETE` 查询，在执行查询后不需要额外的脚本工作，因为你不需要显示任何结果（除非你想这么做的话）。当使用 `SELECT` 查询时，你有几种选项来显示查询检索到的数据。在介绍了关于\
  \ SQL 注入的重要信息之后，我们从基础知识开始，并插入一些数据，这样你稍后就有内容可以进行检索了。\n\n#### 避免 SQL 注入\n\n在列表 18.3\
  \ 的建表脚本中，SQL 查询中使用的数据被硬编码在脚本中。然而，在你可能构建的动态网站或基于 Web 的应用程序中，你大多数情况下会根据表单或其他过程的用户输入向表中\
  \ `INSERT` 数据，或从表中 `SELECT` 数据。如果你不注意这些用户输入并在将其用于查询之前对其进行清理，你就会受到 SQL 注入的威胁。\n\n\
  当恶意分子利用机会在你的表单字段中输入完整或部分的 SQL 查询，并假设当脚本处理这些查询时，安全性将被破坏且数据可能暴露时，就会发生 SQL 注入。\n\n\
  * * *\n\n注意\n\n著名的 XKCD 漫画（非正式被称为“Little Bobby Tables”漫画）完美地说明了 SQL 注入的问题。这张漫画在讨论论坛和其他编程相关的帮助网站上经常被引用，回答者在提供表单\
  \ [`xkcd.com/327/`](http://xkcd.com/327/) 的答案时会说：“忘记 Little Bobby Tables！”\n\n*\
  \ * *\n\n提示\n\n在你掌握了在 PHP 中操作 MySQL 的概念后，查看 PDO（PHP 数据对象）抽象层以进一步应用。\n\n#### 使用 PHP\
  \ 插入数据\n\n在游戏的现阶段插入数据最简单（最安全）的方法是简单硬编码 `INSERT` 语句，如列表 18.4 所示。\n\n**列表 18.4** 用于插入记录的脚本\n\
  \n点击此处查看代码图片\n\n* * *\n\n\n\n\n\n此脚本（用于插入记录）与代码列表 18.3 中创建表的脚本相比，唯一的区别在于第 8 行 `$sql`\
  \ 变量中存储的 SQL 查询，以及第 12 行和 14 行的文本修改。连接代码和发布查询的结构保持不变。事实上，访问 MySQL 的大多数过程化代码都属于这种代码模板。\n\
  \n将此脚本命名为 `mysqlinsert.php` 并将其放置在你的 Web 服务器上。运行此脚本将向 `testTable` 表添加一行。若要输入比脚本中显示的更多的记录，你可以列出一长串硬编码的\
  \ SQL 语句，并多次使用 `mysqli_query()` 执行这些语句；或者你也可以为记录添加脚本创建一个基于表单的界面，我们接下来将完成这一点。\n\n\
  要为此脚本创建表单，你只需要一个字段，因为 `id` 字段可以自动递增。表单的动作（action）是记录添加脚本的名称；我们称其为 `insert.php`。你的\
  \ HTML 表单可能类似于代码列表 18.5。\n\n**代码列表 18.5** 插入表单\n\n点击此处查看代码图像\n\n```html\n1:  <!DOCTYPE\
  \ html>\n2:  <html>\n3:  <head>\n4:  <title>Record Insertion Form</title>\n5:  </head>\n\
  6:  <body>\n7:  <form action=\"insert.php\" method=\"POST\">\n8:  <p><label for=\"\
  testfield\">Text to Add:</label><br/>\n9:  <input type=\"text\" id=\"testfield\"\
  \ name=\"testfield\" size=\"30\" /></p>\n10: <button type=\"submit\" name=\"submit\"\
  \ value=\"insert\">Insert Record</button>\n11: </form>\n12: </body>\n13: </html>\n\
  ```\n\n将此文件保存为 `insert_form.html` 并将其放入你 Web 服务器的文档根目录下。接下来，创建代码列表 18.6 所示的 `insert.php`\
  \ 脚本。表单中输入的值将替换 SQL 查询中的硬编码值，使用名为 `$_POST['testfield']` 的变量（当然，已防止 SQL 注入）。\n\n\
  **代码列表 18.6** 与表单使用的插入脚本\n\n点击此处查看代码图像\n\n```php\n1:  <?php\n2:  $mysqli = mysqli_connect(\"\
  localhost\", \"joeuser\", \"somepass\", \"testDB\");\n3:\n4:  if (mysqli_connect_errno())\
  \ {\n5:      printf(\"Connect failed: %s\\n\", mysqli_connect_error());\n6:    \
  \  exit();\n7:  } else {\n8:      $clean_text = mysqli_real_escape_string($mysqli,\
  \ $_POST['testfield']);\n9:      $sql = \"INSERT INTO testTable (testField)\n10:\
  \             VALUES ('\".$clean_text.\"')\";\n11:     $res = mysqli_query($mysqli,\
  \ $sql);\n12:\n13:     if ($res === TRUE) {\n14:             echo \"A record has\
  \ been inserted.\";\n15:     } else {\n16:             printf(\"Could not insert\
  \ record: %s\\n\", mysqli_error($mysqli));\n17:     }\n18:\n19:     mysqli_close($mysqli);\n\
  20:  }\n21:  ?>\n```\n\n此脚本与代码列表 18.4 中脚本之间的唯一区别是第 8 行，在该行对表单输入进行了清理以避免 SQL 注入；以及第\
  \ 10 行，在该行中使用清理后的字符串 `$clean_text` 代替上一个示例中的硬编码文本字符串。为了清理输入，我们使用 `mysqli_real_escape_string()`\
  \ 函数；该函数要求已经建立了连接，因此它被放置在 `if...else` 语句 `else` 部分的此处。\n\n将脚本保存为 `insert.php` 并将其放入你\
  \ Web 服务器的文档根目录下。在 Web 浏览器中，访问你创建的 HTML 表单。它看起来类似于图 18.1](#ch18.html_ch18fig01)。\n\
  \n![image](img/18fig01.jpg)\n**图 18.1** 添加记录的 HTML 表单。\n\n在“Text to Add”字段中输入一个字符串，如图\
  \ 18.2](#ch18.html_ch18fig2）所示。\n\n![image](img/18fig02.jpg)\n**图 18.2** 在表单中输入的文本。\n\
  \n最后，点击“Insert Record”按钮执行 `insert.php` 脚本并插入记录。如果成功，你将看到类似于图 18.3](#ch18.html_ch18fig3）的结果。\n\
  \n![image](img/18fig03.jpg)\n**图 18.3** 记录已成功添加。\n\n要验证通过 PHP 完成的工作，你可以使用 MySQL\
  \ 命令行界面通过 `SELECT` 查询查看表中的记录：\n\n```\nSELECT * FROM testTable;\n```\n输出应如下：\n```\n\
  +----+-----+\n| id | testField  |\n+----+-----+\n| 1 | some value  |\n| 2 | Little\
  \ Bobby |\n+----+-----+\n```\n行 (0.00 sec)\n\n接下来你将学习如何使用 PHP 获取和格式化结果，而不仅仅是命令行界面。\n\
  \n### 使用 PHP 获取数据\n\n由于你的 `testTable` 表中有几行数据，你可以编写一个 PHP 脚本来获取这些数据。从基础开始，我们编写一个发布\
  \ `SELECT` 查询的脚本，但不会让结果数据淹没你。只需获取行数。要实现这一点，使用 `mysqli_num_rows()` 函数；参见代码列表 18.7\
  \ 的第 12 行。\n\n**代码列表 18.7** 获取数据的脚本\n\n点击此处查看代码图像\n\n```php\n1:  <?php\n2:  $mysqli\
  \ = mysqli_connect(\"localhost\", \"joeuser\", \"somepass\", \"testDB\");\n3:\n\
  4:  if (mysqli_connect_errno()) {\n5:      printf(\"Connect failed: %s\\n\", mysqli_connect_error());\n\
  6:      exit();\n7:  } else {\n8:      $sql = \"SELECT * FROM testTable\";\n9: \
  \     $res = mysqli_query($mysqli, $sql);\n10:\n11:     if ($res) {\n12:       \
  \  $number_of_rows = mysqli_num_rows($res);\n13:         printf(\"Result set has\
  \ %d rows.\\n\", $number_of_rows);\n14:     } else {\n15:         printf(\"Could\
  \ not retrieve records: %s\\n\", mysqli_error($mysqli));\n16:     }\n17:\n18:  \
  \   mysqli_close($mysqli);\n19:  }\n20:  ?>\n```\n\n将此脚本保存为 `count.php` 并将其放入你的\
  \ Web 服务器根目录。在 Web 浏览器中访问它。你应该看到类似下面的信息（取决于你插入的记录数量）：\n\n结果集有 4 行。\n\n第 12 行使用 `mysqli_num_rows()`\
  \ 函数获取结果集（`$res`）的行数，并赋值给变量 `$number_of_rows`。第 13 行将其打印到浏览器。该数字应和你插入的记录数相等。\n\n\
  该列表中有一个之前没有的新函数。第 18 行显示了 `mysqli_result()` 函数的使用。在 `mysqli_close()` 关闭连接之前使用 `mysqli_result()`\
  \ 可以确保与查询和结果相关的内存供其他脚本使用。\n\n现在你知道表中某些记录（根据输出有四条），你可以获取这些记录的具体内容。你可以采用多种方法，但最简单的方法是以数组检索每行。\n\
  \n你使用 `while` 语句遍历结果集的每条记录，将每个字段的值放入特定的变量并在屏幕上显示结果。`mysqli_fetch_array()` 的语法如下：\n\
  \n```php\n$newArray = mysqli_fetch_array($result_set);\n```\n\n参考代码列表 18.8](#ch18.html_ch18ex08)\
  \ 中的示例脚本进行操作。\n\n**代码列表 18.8** 获取数据并显示结果的脚本\n\n点击此处查看代码图像\n\n```php\n1:  <?php\n\
  2:  $mysqli = mysqli_connect(\"localhost\", \"joeuser\", \"somepass\", \"testDB\"\
  );\n3:\n4:  if (mysqli_connect_errno()) {\n5:      printf(\"Connect failed: %s\\\
  n\", mysqli_connect_error());\n6:      exit();\n7:  } else {\n8:      $sql = \"\
  SELECT * FROM testTable\";\n9:      $res = mysqli_query($mysqli, $sql);\n10:\n11:\
  \     if ($res) {\n12:         while ($newArray = mysqli_fetch_array($res, MYSQLI_ASSOC))\
  \ {\n13:             $id  = $newArray['id'];\n14:             $testField = $newArray['testField'];\n\
  15:             echo \"The ID is \".$id.\" and the text is: \".$testField.\"<br/>\"\
  ;\n16:         }\n17:     } else {\n18:         printf(\"Could not retrieve records:\
  \ %s\\n\", mysqli_error($mysqli));\n19:     }\n20:\n21:     mysqli_free_result($res);\n\
  22:     mysqli_close($mysqli);\n23:  }\n24:  ?>\n```\n\n\n\n```php\n18:      printf(\"\
  Could not retrieve records: %s\\n\", mysqli_error($mysqli));\n19:      }\n20:\n\
  21:      mysqli_free_result($res);\n22:      mysqli_close($mysqli);\n23:  }\n24:?>\n\
  ```\n\n将此脚本保存为 `select.php`，将其放在你的 Web 服务器文档目录中，并通过浏览器访问它。你应该能看到为 `testTable` 中输入的每条记录显示的消息，如图\
  \ 18.4 所示。该消息是在第 12 到 15 行的 `while` 循环生成的。\n\n![image](img/18fig04.jpg)\n\n**图 18.4\
  \ 从 MySQL 中选取记录。**\n\n如你所见，仅需四个或五个 MySQLi 函数就可以创建一个整个数据库驱动的应用程序。本章仅仅接触了 PHP 配合 MySQL\
  \ 的皮毛；PHP 中还有许多 MySQLi 函数。\n\n### PHP 中的其他 MySQL 函数\n\n通过 PHP 的 MySQLi 接口可以使用超过\
  \ 100 个 MySQL 特定的函数。这些函数中的大多数只是获取数据的替代方法，或者用于收集有关相关表结构的信息。在本书中，特别是在稍后与项目相关的章节中，你将逐渐接触到\
  \ PHP 中更多 MySQL 特定的函数。然而，要查看完整的函数列表及实际用例，请访问 PHP 手册中的 MySQLi 部分：[`www.php.net/mysqli`](http://www.php.net/mysqli)。\n\
  \n### 总结\n\n使用 PHP 和 MySQL 创建动态数据库驱动的网站是轻而易举的。只需记住 PHP 函数本质上是通往数据库服务器的网关；任何可以使用\
  \ MySQL 命令行界面输入的内容，都可以配合 `mysqli_query()` 函数使用。你还学习了在从表单接收用户输入时避免 SQL 注入。\n\n要用\
  \ PHP 连接 MySQL，你需要知道 MySQL 用户名、密码和数据库名称。连接后，你可以使用 `mysqli_query()` 函数发布标准 SQL 命令。如果你发布了\
  \ `SELECT` 命令，可以使用 `mysqli_num_rows()` 统计结果集中返回的记录数。如果你想显示找到的数据，可以使用 `mysqli_fetch_array()`\
  \ 在循环中获取所有结果并在屏幕上显示。\n\n### 问答\n\n**Q. 在一个应用程序中同时使用 mysql_* 和 mysqli_* 函数可行？**\n\
  \n**A.** 如果构建 PHP 时同时启用了这两个库，你就可以使用任何一组函数与 MySQL 通通信。但请注意，如果你在高于 4.1.3 版本的 MySQL\
  \ 上使用 `mysql_*` 函数，将无法访问某些新功能。此外，如果你在整个应用程序中用法不一致，维护和更新应用程序将非常耗时，并产生不理想的结果。\n\n\
  ### 工作坊\n\n工作坊旨在帮助你回顾所学知识并开始将知识付实践。\n\n#### 测验\n\n**1.** 用于建立 PHP 和 MySQL 链接的主要函数是什么？需要哪些信息？\n\
  \n**2.** 哪个 PHP 函数获取 MySQL 错误消息的文本？\n\n**3.** 哪个 PHP 函数统计结果集中记录的数量？\n\n#### 答案\n\
  \n**1.** `mysqli_connect()` 函数创建到 MySQL 的连接，需要主机名、用户名和密码。\n\n**2.** `mysqli_error()`\
  \ 函数返回 MySQL 错误消息。\n\n**3.** `mysqli_num_rows()` 函数统计结果集中记录的数量。\n\n#### 活动\n\n1.\
  \ 使用 HTML 表单和 PHP 脚本，创建一个包含人员姓（first and last）字段的表。创建另一个脚本向表中添加记录。\n2. 一旦表中有了记录，就创建一个\
  \ PHP 脚本，按姓氏的字母顺序检索并显示这些记录。\n\n# 第五部分：基础项目\n\n## 第 19 章：管理简单的邮件列表\n\n***在本章中，你将学习到以下内容：***\n\
  \n• **如何创建订阅/取消订阅表单和脚本**\n• **如何为发送消息创建前端**\n• **如何创建发送消息的脚本**\n\n本章提供了几个实操小项目中的第一个，旨在整合你的\
  \ PHP 和 MySQL 知识。在本章中，你将学习如何创建一个受管理的分发列表，你可以用它向数据库中的电子邮件地址列表发送新闻或其他任何内容。\n\n###\
  \ 注意事项\n与书中的所有小型示例项目一样，这些项目可能并不完全是你计划用新的 PHP 和 MySQL 知识构建的内容。然而，我必须强调再强调的是，在本章及其他项目中显示的概念和示例，与你在开发任何使用\
  \ CRUD 功能（创建、读取、更新、删除）的应用程序时会遇到的情况类似。\n\n在本章中使用的邮件机制并不是为了替代邮件列表软件（后者是专门为批量消息设计的）。你应该只将在本章中构建的系统用于小型列表（少于几百个电子邮件地址）。\n\
  \n## 开发订阅机制\n\n你在较早的章节中学习过，规划是创建任何产品最重要的方面。在这种情况下，请考虑你的订阅机制所需的元素：\n\n• 用于存储电子邮件地址的表\n\
  • 用户添加或删除其电子邮件地址的方法\n• 用于发送消息的表单和脚本\n\n接下来的章节将逐描述描述项目。\n\n### 创建 `subscribers` 表\n\
  \n你实际上只需要 `subscribers` 表的一个字段：存储用户的电子邮件地址。然而，为了与其他表之间的一致性，并因为在 `where` 子句中引用 ID\
  \ 比引用长电子邮件地址要简单得多，你应该有一个 ID 字段。因此，在这种情况下，你的 MySQL 查询看起来如下：\n\n点击此处查看代码图像\n\n```sql\n\
  CREATE TABLE subscribers (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n  \
  \  email VARCHAR(150) UNIQUE\n);\n```\n\n*(注：由于原文文本在此处中断，后续关于 DESC 查询的描述未包含在排版范围内。)*\n\
  \n\n\n\n\n```php\n<?php\n// 连接到数据库的函数\nfunction doDB() {\n    global $mysqli;\n\n\
  \    // 连接到服务器并选择数据库\n    $mysqli = mysqli_connect(\"localhost\", \"joeuser\",\n\
  \        \"somepass\", \"testDB\");\n\n    // 如果连接失败，停止脚本执行\n    if (mysqli_connect_errno())\
  \ {\n        printf(\"Connect failed: %s\\n\", mysqli_connect_error());\n      \
  \  exit();\n    }\n}\n// 检查邮箱地址的函数\nfunction emailChecker($email) {\n    global\
  \ $mysqli, $safe_email, $check_res;\n\n    // 检查邮箱不在列表中\n    $safe_email = mysqli_real_escape_string($mysqli,\
  \ $email);\n    $check_sql = \"SELECT id FROM SUBSCRIBERS\n            WHERE email\
  \ = '\".$safe_email.\"'\n    $check_res = mysqli_query($mysqli, $check_sql)\n  \
  \      or die(mysqli_error($mysqli));\n}\n?>\n```\n\n第 3–15 行设置了第一个函数 `doDB()`，它仅仅是一个数据库连接函数。如果无法建立连接，当调用此函数时，脚本将退出；否则，它会让\
  \ `$mysqli` 的值对脚本的其他部分可用。\n\n第 17–26 行定义了一个名为 `emailChecker()` 的函数，它接收一个输入并返回一个输出——就像大多数函数一样。我们在脚本的上下文中查看这个函数，因为它会在列表\
  \ 19.2 中中遇到它。\n\n将此文件保存为 `ch19_include.php` 并将其放置在 Web 服务器上。在列表 19.2 中，你将看到如何在脚本需要时包含此文件。\n\
  \n### 创建订阅表单\n\n订阅表单实际上名为 `manage.php` 的合一表单和脚本，它可以处理订阅和取消订阅请求。列表 19.2 显示了 `manage.php`\
  \ 的代码，它使用了一些用户自定义函数来消除重复代码，并让你开始思考自己创建函数。代码看起来很长，但后面会有逐行描述（很多代码只是显示 HTML 表单，所以不用担心）。\n\
  \n**列表 19.2** 使用 manage.php 进行订阅和取消订阅\n\n点击此处查看代码图像\n\n```php\n<?php\ninclude 'ch19_include.php';\n\
  // 确定是否需要查看表单\nif (!$_POST) {\n    // 他们需要查看表单，所以创建表单块\n    $display_block = <<<END_OF_BLOCK\n\
  \    <form method=\"POST\" action=\"$_SERVER[PHP_SELF]\">\n\n    <p><label for=\"\
  email\">您的邮箱地址:</label><br/>\n    <input type=\"email\" id=\"email\" name=\"email\"\
