  \n### 总结\n\n本章简要向你介绍了使用图像和 PHP 时可以做的事情。强烈建议阅读 PHP 手册 [`www.php.net/image`](http://www.php.net/image)\
  \ 中的“图像函数”部分，这不仅是为了获得完整的图像相关函数列表，还为了关于它们在应用程序中使用的示例和讨论。\n\n在本章中，你学习了安装和使用用于处理图像的额外库（示例使用了\
  \ PNG，但你也得到了关于使用 GIF 和 JPG 的说明）。你学习了创建图像画布、分配颜色以及绘制和填充形状的基本步骤。你了解到你的绘图画布可以由现有图像组成，并且你可以合并图层，使最终图像成为合并图层的复合。此外，你还看到了在图像创建脚本中使用用户输入（在本例中为来自\
  \ HTML 表单的输入）是多么简单，以及如何在 HTML 代码中将脚本作为图像源。\n\n### 问答\n\n**Q. 如何使用动态数据来创建饼图的切片？**\n\
  \n**A.** 在创建任何图像时，起始点和绘制长度不需要静态指定——它们可以是变量，其值由数据库、用户输入或脚本内部的计算决定。例如，这段代码创建了一个红色的、填充的\
  \ 90 度弧：\n\n点击此处查看代码图像\n\n```\nImageFilledArc($myImage,50,50,100,50,0,90,$red,IMG_ARC_PIE);\n\
  ```\n\n你可以这样设置，使得饼图顶部的红色填充弧将五月份销售额占的百分比存储在名为 `$may_sales_pct` 的变量中。该行随后变为如下：\n\n\
  点击此处查看代码图像\n\n```\nImageFilledArc($myImage,50,50,100,50,0,$may_sales_pct,$red,IMG_ARC_PIE);\n\
  ```\n\n数字随后通过你脚本中的计算或数据库查询填充。请确保添加代码来验证所有的弧之和是否为 360 度。\n\n### 工作坊\n\n该工作坊旨在帮助你复习所学知识并开始实践。\n\
  \n#### 测验\n\n**1.** 纯黑色和纯白色，你会使用什么 RGB 值？\n\n**2.** 如何创建一个宽 300 像素、高 200 像素的新空白画布？\n\
  \n**3.** 使用什么函数来绘制多边形？填充的多边形呢？\n\n#### 答案\n\n**1.** (0,0,0) 是纯黑色，(255,255,255) 是纯白色。\n\
  \n**2.** 要创建一个宽 300 像素、高 200 像素的新空白画布，请使用以下：\n\n```\n$new_image = ImageCreate(300,200);\n\
  ```\n\n**3.** `ImagePolygon()` 和 `ImageFilledPolygon()`\n\n#### 活动\n\n**1.** 不要创建饼图，而是使用你的绘图技巧创建一个带有垂直或水平条形的柱状图，每个条形宽\
  \ 30 像素并填充相同的颜色，但长度不同。确保每个条形之间有 10 像素的间距。\n\n**2.** 通过添加表单前端来扩展第一步的功能，允许用户输入选择的数字。根据这些数字生成你的柱状图。\n\
  \n# 第四部分：PHP 与 MySQL 的集成\n\n## 第 15 章：理解数据库设计过程\n\n在本章中，你将学习到以下内容：\n\n• 良好的数据库设计的某些优点\n\
  • 三种表关系\n• 如何对数据库进行规范化\n• 如何实现良好的数据库设计过程\n\n在本章中，你学习了设计关系型数据库背后的原理。在完成这个以概念为章节后，你将直接开始学习基础命令。\n\
  \n### 良好的数据库设计的重要性\n\n良好的数据库设计对于高性能应用至关重要正如空气动力学车身对于汽车一样。没有优化的代码，你的数据库将无法高效运行。考虑关系和规范化（包括维护性）是设计的一部分。\n\
  \n具体来说，规范化是指为了减少重复和不一致而对数据进行结构化的。除了性能问题，还有维护问题——数据库应该是易于维护的。如果你有大量重复数据，其中一个实例发生变化，你必须更改所有出现的地方。例如，假设你负责维护一个学生及其参加课程的数据库。如果这\
  \ 35 个学生在同一门课程（我们称为高级数学），该课程名称会在表中出现 35 次。现在，如果老师决定将其改为“数学 IV”，你必须更改 35 条记录。如果数据库设计为课程名称出现在表中，而在学生记录中仅存储\
  \ ID，你只需要更改一条记录。\n\n经过规划和设计的数据库优点很多，理论上前期做得越多，以后做的就越少。重新设计数据库最糟糕的时间是应用程序发布后——尽管这种情况确实发生，而且代价高昂。\n\
  \n因此，在开始编写应用程序之前，花大量时间设计你的数据库。在本章的剩余部分中，你将学习更多关系和规范化，这是设计拼图的两个重要部分。\n\n#### 表的关系\n\
  \n表关系有几种形式：\n\n• 一对一关系 (#ch15.html_ch15seclev1)\n• 一对多关系 (#ch15.html_ch15seclev2)\n\
  • 多对多关系 (#ch15.html_ch15seclev3)\n\n例如，假设你有一个名为 `employees` 的表，包含每个人的社会安全号码、姓名和他们工作的部门。假设你还有一个独立的表名为\
  \ `departments`，包含所有可用部门的列表，由部门 ID 和名称组成。在 `employees` 表中，`Department ID` 字段与 `departments`\
  \ 表中的 ID 匹配。你可以在图 15.1 中看到这种关系。字段名称旁边的 `PK` 表示表的主键。\n\n\n\n\n\n# **图 15.1 员工表和部门表通过\
  \ `DeptID` 键关联。**\n\n在接下来的章节中，你将详细查看每种关系类型。\n\n## 一一对关系 (One-to-One Relationships)\n\
  \n在一对一关系中，键在相关表中仅出现一次。`employees` 表和 `departments` 表之间不存在一对一关系，因为许多员工无疑属于同一个部门。例如，如果公司为每位员工都分配一台电脑，则存在一对一关系。图\
  \ 15.2 显示了员工与计算机之间的一对一关系。\n\n![image](img/15fig02.jpg)\n\n**图 15.2 每位员工分配一台电脑。**\n\
  \n你数据库中的 `employees` 表和 `computers` 表看起来就像图 15.3 所示，它表示了一个一对一关系。\n\n![image](img/15fig03.jpg)\n\
  \n**图 15.3 数据模型中的一对一关系。**\n\n## 一对多关系 (One-to-Many Relationships)\n\n在一对多关系中，一个表中的键在相关表中出现多次。图\
  \ 15.1 所示的示例指示了员工与部门之间的连接，说明了一种一对多关系。现实世界中的例子是部门的组织架构图，如图 15.4 所示。\n\n![image](img/15fig04.jpg)\n\
  \n**图 15.4 一个部门包含许多名员工。**\n\n一对多关系是最常见的关系类型。另一个实际示例是在地址数据库中使用州缩写；每个州都有唯一的标识符（加利福尼亚州为\
  \ CA，宾夕法尼亚州为 PA 等），美国的每个地址都关联一个州。\n\n如果你在加利福尼亚州有 8 个朋友，在宾夕法尼亚州有 5 个朋友，你在表中仅使用了两个不同的缩写。一个缩写（CA）代表一个一对对八的关系，另一个缩写（PA）代表一个一对对五的关系。\n\
  \n## 多对多关系 (Many-to-Many Relationships)\n\n多对多关系在规范一化数据库的实际示例中经常引起问题，以至于简单地将多对多关系分解为一系列一对多关系是非常常见的。在多对多关系中，一个表的键值可以在相关表中出现多次。到目前为止，这听起来像是一对多关系，但这里有一个转折：反之亦然，这意味着第二个表中的主键也可以出现在第一个表中多次。\n\
  \n通过学生和课程的例子来这样思考这种关系：学生有一个 ID 和一个名称。课程有一个 ID 和一个名称。学生一次通常修超过一门课程，而一门课程总是包含多一个学生，正如你在图\
  \ 15.5 所示。\n\n![image](img/15fig05.jpg)\n\n**图 15.5 学生上课程，课程包含学生。**\n\n如你所见，这种关系并没有提供一种简单的关联表的方法。你的表可能看起来像图\
  \ 15.6 所示，似乎毫无关联。\n\n![image](img/15fig06.jpg)\n\n**图 15.6 学生表和课程表，互不相关。**\n\n为了实现理论上的多对多关系，你创建一个中间表，该表位于两个表之间，本质上将它们映射在一起。你可能会构建一个与图\
  \ 15.7 相似的表。\n\n![image](img/15fig07.jpg)\n\n**图 15.7 `students_classes_map` 表充当了中间节点。**\n\
  \n如果你将图 15.5 中的信息放入中间表中，你就可以创建像图 15.8 那样的表。\n\n![image](img/15fig08.jpg)\n\n**图\
  \ 15.8 填充了数据的 `students_classes_map` 表。**\n\n如你所见，许多学生和许多课程和谐地共存在于 `students_classes_map`\
  \ 表中。\n\n有了对这些关系类型的介绍，学习规范化应该应该是轻而易举的。\n\n## 理解规范化 (Understanding Normalization)\n\
  \n规范化仅仅是一组规则，当你担任数据库管理员时，它最终会让你的生活变得更容易。它是组织数据库的艺术，使得你的表在适当的地方相互关联，并且对于未来的增长具有灵活性。\n\
  \n规范化中使用的规则集称为 `normal forms`（范式）。如果你的数据库设计遵循第一组规则，则被视为`第一范式`。如果遵循了规范化的前三组规则，则说你的数据库处于`第三范式`。\n\
  \n在本章中，你将学习第一范式、第二范式和第三范式中的每条规则——这是九种不同规范化中最基础的规则——而且我希望你在创建自己的应用程序时遵循这些规则。在本章中，你使用了一组学生和课程数据库的示例表并将其提升到第三范式。\n\
  \n### 平表的问题 (Problems with the Flat Table)\n\n在进入第一范式之前，你必须从一个需要修复的东西开始。在数据库的情况下，它就是平表。在你的学生和课程数据库中，假设你的平表中有以下字段：\n\
  \n- StudentName—学生姓名。\n- CourseID1—学生修读的第一门课程的 ID。\n- CourseDescription1—学生修读的第一门课程的描述。\n\
  - CourseInstructor1—学生修读的第一门课程的讲师。\n- CourseID2—学生修读的第二门课程的 ID。\n- CourseDescription2—学生修读的第二门课程的描述。\n\
  - CourseInstructor2—学生修读的第二门课程的讲师。\n\n重复多次以涵盖学生可以修读的所有课程。根据你目前所学的知识，你应该能够识别出第一个问题区域：`CourseID`、`CourseDescription`\
  \ 和 `CourseInstructor` 列是重复组。消除冗余是规范化的第一步，因此接下来你把这个平表转换为第一范式。如果你的表保持扁平格式，你可能会有很多未声明的空间，并浪费了大量空间——这并不是高效的表设计。\n\
  \n## 第一范式 (First Normal Form)\n\n第一范式的规则如下：\n\n- 消除重复信息。\n- 为相关数据创建单独表。\n\n如果你思考学生和课程数据库中许多重复字段的平表设计，你可以识别出两个不同的主题：学生和课程。将你的学生和课程数据库转换为第一范式意味着你创建了两个表：一个用于学生，一个用于课程，如图\
  \ 15.9 所示。\n\n![image](img/15fig09.jpg)\n\n**图 15.9 将平表分解为两个表。**\n\n你的两个表现在表示一个学生对应多门课程的一对多关系。学生可以修读他们想要的任何数量课程，不再限于平表中存在的\
  \ `CourseID`/`CourseDescription`/`CourseInstructor` 分组。\n\n## 第二范式 (Second Normal\
  \ Form)\n\n下一步是将表放入第二范式。第二范式的规则如下：\n\n- 非键属性不依赖于主键的一部分。\n\n\n\n\n\n通俗地说，这意味着如果你表中的字段没有完全与主键相关，那么你就得做更多工作。在\
  \ `students-and-courses` 示例中，你需要将课程拆分到单独表中，并修改 `students_courses` 表。\n\n`CourseID`、`CourseDescription`\
  \ 和 `CourseInstructor` 可以变成一个名为 `courses` 的表，并以 `CourseID` 为主键。此时 `students_courses`\
  \ 表只需要包含两个字段：`StudentID` 和 `CourseID`。你可以在图 15.10 中看到这种新设计。\n\n![image](img/15fig10.jpg)\n\
  \n图 15.10 将你的表转换为第二范式。\n\n这种结构对你来说应该很熟悉，因为它是一个使用中间映射表的多对多关系。第三范式是你在这里看到的最后一种形式，你会发现它和前两个范式一样容易理解。\n\
  \n### 第三范式\n\n第三范式的规则如下：\n\n• 任何属性都不依赖于其他非键属性。\n\n这条规则简单意味着，你需要检查你的表，看看是否有更多字段可以进一步拆分且不依赖于键。考虑一下删除重复数据，你就会找到答案：教师。不可避免的是，一位老师会教授一门以上的课程。然而，`CourseInstructor`并不是任何类型的键。因此，如果你为了效率和维护，而拆分这些信息并创建一个独立的表（如图\
  \ 15.11 所示），那就是第三范式。\n\n![image](img/15fig11.jpg)\n\n图 15.11 将你的表转换为第三范式。\n\n第三范式通常足以消除冗余并允许灵活性和增长。下一节将提供关于数据库设计中涉及思维过程的一些建议，以及它在应用程序整体设计过程中的位置。\n\
  \n## 遵循设计流程\n\n应用设计中最大的问题是缺乏远见。对于数据库驱动的应用程序，设计过程必须对你的数据库进行彻底评估——它应该包含什么、数据之间如何关联，以及最重要的，它是否具有扩展性。\n\
  \n设计过程的一般步骤如下：\n\n• 定义目标。\n\n• 设计数据结构（表、字段）。\n\n• 辨别关系。\n\n• 定义并实现业务规则。\n\n• 创建应用程序。\n\
  \n创建应用程序是最后一步，而不是第一步。许多开发者拿出一个应用程序的想法并构建它，然后回过尝试让一组数据库表适应它。这种方法完全是反向的、低效的，并且会花费大量的时间和金。\n\
  \n在开始任何应用程序设计过程之前，坐下来好好讨论一下。如果你无法描述你的应用程序——包括目标、观众和目标市场——你还没有准备好构建它，更不用说建模数据库了。\n\
  \n当你能够向他人描述你应用程序的操作和细节，并让他们理解时，你就可以开始考虑想要创建的表了。从大扁表开始，因为在你写下它们之后，你新学的范式化技能就会介入。你将能够发现冗余并视觉化你的关系。随着经验的增加，你将减少这个过程中的步骤，但仔细且明确地执行这些步骤也没有任何问题。\n\
  \n下一步是进行范式化。从扁表到第一范式，如果可能，一直到第三范式。使用纸、铅笔、便利签或任何能帮助你视觉化表和关系的工具。在准备好创建表本身之前，在便利签上进行数据建模并不可耻的。此外，使用便利签比购买软件来为你完成要便宜得多；建模软件的价格从几百到几千美元不等。\n\
  \n在你获得初步数据模型后，从应用程序的角度来看它。或者从你正在构建的应用程序的用户的角度来看它。这就是你定义业务规则并查看你的数据模型是否失效的地方。在线注册应用程序的业务规则示例是：“每个用户必须有一个电子邮件地址，且该地址不能属于任何其他用户。”如果\
  \ `EmailAddress` 在你的数据模型中不是唯一字段，那么你的模型将根据业务规则而失效。\n\n只有将业务规则应用到你的数据模型之后，才能开始应用程序编程。你可以放心，你的数据模型是稳健的，你不会把自己程序到死胡同里。后者非常常见。\n\
  \n### 总结\n\n遵循正确的数据库设计是使你的应用程序高效、灵活且易于管理和维护的唯一途径。数据库设计的一个重要方面是使用表之间的关系，而不是将所有数据都丢进一个长扁文件中。关系的类型包括一比一、一对多和多对多。\n\
  \n使用关系来正确组织你的数据被称为范式化。范式化有多个级别，但主要的级别是第一、第二和第三范式。每个级别都有你必须遵守的一或两个规则。遵循所有规则有助于确保你的数据库组织良好且灵活。\n\
  \n若要将一个想法从诞生到实现，你应该遵循一个设计流程。这个过程本质上是在说“先思后行”。讨论规则、需求和目标，然后才创建最终版本的范式化表。\n\n### 问答\n\
  \n**问：只有三种范式吗？**\n\n**答：不，还有更多。** 额外的形式包括 Boyce-Codd 范式（BC 范式）、第四范式和第五范式。这些形式在实际应用开发中并不被遵循，因为这样做的好处会被人力成本抵消。更多信息，请参阅\
  \ [`en.wikipedia.org/wiki/Database_normalization`](http://en.wikipedia.org/wiki/Database_normalization)。\n\
  \n### 工作坊\n\n工作坊旨在帮助你回顾所学内容并开始实践。\n\n#### 测验\n\n1. 列出三种关系类型。\n\n2. 因为多对多关系在高效的数据库设计中很难表示，你应该做什么？\n\
  \n3. 列出几种你创建数据可视化的方法。\n\n#### 答案\n\n1. 一比一、一对多、多对多。\n\n2. 使用一系列中间映射表来创建一对多的关系。\n\
  \n3. 你可以使用各种工具，从便利签和线（便利签是表，线显示表与表之间的关系），到用于绘图软件，再到解释你的 SQL 语句并生成可视化的软件程序。\n\n####\
  \ 活动\n\n向一个使用电子表格和扁表的人解释每种范式。\n\n\n\n\n\n# 如何使用 `UPDATE` 和 `REPLACE` 命令修改现有记录\n\
  # 如何使用 `DELETE` 命令删除记录\n# 如何使用 MySQL 内置的字符串函数\n# 如何使用 MySQL 内置的日期和时间函数\n\n上一章解释了数据库设计过程的基础知识，本章提供了核心\
  \ SQL 语法的入门介绍，你将使用这些语法来创建和操作你的 MySQL 数据库表。这是一个实操章节，假设你能够直接向 MySQL 发送查询，可以通过 MySQL\
  \ 命令行界面或其他管理界面（例如 `phpMyAdmin`），`phpMyAdmin` 包含在通过第 1 章中快速启动过程提供的 XAMPP 安装中“XAMPP\
  \ 安装快速启动指南”。\n\n请注意，虽然这可能不是本书中最令人兴奋的章节，但它确实向你展示了许多在后续工作中会用到的基础和功能性示例。\n\n## 学习 MySQL\
  \ 数据类型\n\n在表中正确定义字段对你数据库的整体优化至关重要。你应该只使用真正需要的字段类型和长度；如果你知道自己只会使用 2 个字符，就不要将字段定义为\
  \ 10 个字符宽——即使这些字符未未使用，数据库也需要额外考虑 8 个字符。这些字段类型也被称为*数据类型*，即你存储在这些字段中的“数据类型”。\n\nMySQL\
  \ 使用了许多不同的数据类型，分为三类：数值类型、日期时间类型和字符串类型。请密切关注，因为正确定义数据类型比创建表过程任何其他部分都重要。\n\n### 数值数据类型\n\
  \nMySQL 使用所有标准的 ANSI SQL 数值数据类型。因此，如果你是从不同的数据库系统转向 MySQL 的，这些定义看起来会非常熟悉。以下列表显示了常见的数值数据类型及其描述：\n\
  \n> 注意\n`signed`（有符号）和 `unsigned`（无符号）术语用于数值数据类型列表。如果你还记得基础代数，你会回想起有符号整数可以是正整数或负整数，而无符号整数始终是非负整数。\n\
  \n- `INT`—普通大小的整数，可以是有符号或无符号的。如果有符号，允许的范围从 –2147483648 到 2147483647。如果是无符号，允许范围是从\
  \ 0 到 4294967295。你可以指定最多 11 位的宽度。\n- `TINYINT`—小整数，可以是有符号或无符号的。如果有符号，允许的范围是从 –128\
  \ 到 127。如果是无符号，允许范围是从 0 到 255。你可以指定最多 4 位的宽度。\n- `SMALLINT`—小整数，可以是有符号或无符号的。如果有符号，允许的范围是从\
  \ –32768 到 32767。如果是无符号，允许范围是从 0 到 65535。你可以指定最多 5 位的宽度。\n- `MEDIUMINT`—中等大小的整数，可以是有符号或无符号的。如果有符号，允许的范围是从\
  \ –8388608 到 8388607。如果是无符号，允许范围是从 0 到 16777215。你可以指定最多 9 位的宽度。\n- `BIGINT`—大整数，可以是有符号或无符号的。如果有符号，允许的范围是从\
  \ –9223372036854775808 到 9223372036854775807。如果是无符号，允许范围是从 0 到 18446744073709551615。你可以指定最多\
  \ 11 位的宽度。\n- `FLOAT(M,D)`—浮点数，不能是无符号的。你可以定义显示长度(`M`）和小数位数(`D`）。这不是强制要求的，默认值为 `10,2`，其中\
  \ `2` 是小数位数，`10` 是总位数（包括小数）。`FLOAT` 的小数精度可以达到 24 位。\n- `DOUBLE(M,D)`—双精度浮点数，不能是无符号的。你可以定义显示长度(`M`）和小数位数(`D`）。这不是强制要求的，默认将为\
  \ `16,4`，其中 `4` 是小数位数。`DOUBLE` 的小数精度可以达到 53 位。`REAL` 是 `DOUBLE` 的同义词。\n- `DECIMAL(M,D)`—未压缩的浮点数，不能是无符号的。在未压缩小数中，每个小数位对应\
  \ 1 字节。必须定义显示长度(`M`）和小数位数(`D`).`NUMERIC` 是 `DECIMAL` 的同义词。\n\n在所有 MySQL 数值数据类型中，你可能最经常使用\
  \ `INT`。如果你定义的字段比实际需要的小，可能会遇到问题；例如，如果你将 `ID` 字段定义为无符号的 `TINYINT`，如果 `ID` 是主键（因此是必填的），你无法成功插入第\
  \ 256 条记录。\n\n### 日期和时间类型\n\nMySQL 有多种数据类型用于存储日期和时间，这些数据类型在输入方面非常灵活。换句话说，你可以输入并不是真实日期的日期。总之，正确定义数据类型比创建表过程中的任何其他部分都重要。\n\
  \nMySQL 提供了多种数据类型来存储日期和时间，这些数据类型在输入方面具有很高的灵活性。MySQL 的日期和时间类型如下：\n\n- `DATE`— YYYY-MM-DD\
  \ 格式的日期，范围从 1000-01-01 到 9999-12-31。例如，1973-12-30。\n- `DATETIME`— YYYY-MM-DD HH:MM:SS\
  \ 格式的日期时间组合，范围从 1000-01-01 00:00:00 到 9999-12-31 23:59:59。例如，1973-12-30 15:30:00。\n\
  - `TIMESTAMP`— 从 1970 年 1 月 1 日 00:00:00 到 2038-01-19 03:14:07 的时间戳。你可以为 `TIMESTAMP`\
  \ 字段定义多个长度，默认长度为 14，其存储格式为 YYYYMMDDHHMMSS。`TIMESTAMP` 的其他定义还有 12 (YYMMDDHHMMSS)、8\
  \ (YYYYMMDD) 和 6 (YYMMDD)。\n- `TIME`—以 HH:MM:SS 格式存储时间。\n- `YEAR(M)`—以两位或四位数字格式存储年份。如果指定的长度为\
  \ 2（例如 `YEAR(2)`），`YEAR` 的范围是 1970 到 2066 (70 到 69)。如果指定的长度为 4，`YEAR` 的范围是 1901\
  \ 到 2155。默认长度为 4。\n\n你可能会比任何其他日期类型更频繁地使用 `DATETIME` 或 `DATE`。\n\n### 字符串类型\n\n虽然数值和日期类型很有趣，但你存储的大部分数据将是字符串格式。以下描述了\
  \ MySQL 中常见的字符串数据类型：\n\n- `CHAR(M)`—长度在 1 到 255 个字符之间的固定长度字符串（例如 `CHAR(5)`），存储时会根据指定的长度在右侧填充空格。定义长度不是强制的，但默认长度为\
  \ 1。\n- `VARCHAR(M)`—长度在 1 到 255 个字符之间的变长字符串；例如 `VARCHAR(25)`。在创建 `VARCHAR` 字段时，必须定义长度。\n\
  \n\n\n\n\n- `BLOB` 或 `TEXT`——最大长度为 65,535 个字符的字段。`BLOB` 是二进制大对象，用于存储大量二进制数据，如图像或其他类型的文件。定义为\
  \ `TEXT` 的字段也存储大量数据；两者的区别在于，对存储数据进行排序和比较在 `BLOB` 上是区分大小的，而在 `TEXT` 字段中不区分大小。你不需要为\
  \ `BLOB` 或 `TEXT` 指定长度。\n- `TINYBLOB` 或 `TINYTEXT`——最大长度为 255 个字符的 `BLOB` 或 `TEXT`\
  \ 列。你不需要为 `TINYBLOB` 或 `TINYTEXT` 指定长度。\n- `MEDIUMBLOB` 或 `MEDIUMTEXT`——最大长度为 16,777,215\
  \ 个字符的 `BLOB` 或 `TEXT` 列。你不需要为 `MEDIUMBLOB` 或 `MEDIUMTEXT` 指定长度。\n- `LONGBLOB` 或\
  \ `LONGTEXT`——最大长度为 4,294,967,295 个字符的 `BLOB` 或 `TEXT` 列。你不需要为 `LONGBLOB` 或 `LONGTEXT`\
  \ 指定长度。\n- `ENUM`——枚举，这是“列表”的一种高级说法。在定义 `ENUM` 时，你正在创建一个项目列表，必须从中选择一个值（或者可以为 `NULL`）。例如，如果你想让字段包含\
  \ A 或 B 或 C，你可以将 `ENUM` 定义为 `ENUM ('A', 'B', 'C')`，那么只有这些值（或 `NULL`）可以填充该字段。`ENUM`\
  \ 可以有 65,535 个不同的值。`ENUM` 使用索引来存储项目。\n\n### 注意\n`SET` 类型与 `ENUM` 类似，因为它也被定义为列表。但是，`SET`\
  \ 类型存储为完整值，而不是像 `ENUM` 那样存储为值的索引。\n\n你可能会比其他字段类型更频繁地使用 `VARCHAR` 和 `TEXT` 字段，`ENUM`\
  \ 也很有用。\n\n## 学习建表语法\n创建表的命令需要：\n- 表名\n- 字段名\n- 每个字段的定义\n\n通用的建表语法为：\n点击此处查看代码图片\n\
  \n```\nCREATE TABLE table_name (column_name column_type);\n```\n\n表名由你决定，但应该是一个反映该表用途的名称。例如，如果你有一个存储杂货店库存的表，你不会将表命名为\
  \ `s`。你可能会将其命名为 `grocery_inventory`（杂货库存）。同样地，你选择的字段名应该尽可能简洁，并与它们所服务的功能和存储的数据相关。例如，你可能会将存储商品名称的字段命名为\
  \ `item_name`，而不是 `n`。\n\n接下来的建表示例创建了一个通用的 `grocery_inventory` 表，包含 ID、商品名称、商品描述、商品价格和数量字段。每个字段都是不同类型：ID\
  \ 和数量字段存储整数，商品名称字段存储多达 50 个字符，商品描述字段存储多达 65,535 个字符的文本，商品价格字段包含一个浮点数：\n\n点击此处查看代码图片\n\
  \n```\nCREATE TABLE grocery_inventory (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    item_name VARCHAR (50) NOT NULL,\n    item_desc TEXT,\n    item_price FLOAT\
  \ NOT NULL,\n    curr_qty INT NOT NULL\n);\n```\n\n### 注意\n`id` 字段被定义为主键。你将在后面的章节中，通过创建作为示例应用程序部分的特定表来学习更多关于键的知识。此外，通过在示例中使用\
  \ `auto_increment` 作为该字段的属性，你是在告诉 MySQL 在插入记录时自动为你为 `id` 字段添加下一个可用的数字。\n\n每当无论什么类型的命令执行成功时，MySQL\
  \ 服务器都会响应 `Query OK`。否则，会显示错误消息，告诉你的查询在哪里出了问题。取决于你所使用的界面，你可能会看到或看不到这个特定的响应。然而，无论使用哪种界面，它都应该为你提供查询状态的某种指示。\n\
  \n## 使用 `INSERT` 命令\n创建一些表后，你使用 SQL 命令 `INSERT` 为这些表添加新记录。`INSERT` 的基本语法为：\n点击此处查看代码图片\n\
  \n```\nINSERT INTO table_name (column list) VALUES (column values);\n```\n\n在值的括号列表中，你必须将字符串包含在引号内。SQL\
  \ 标准使用单引号，但 MySQL 允许使用单引号或双引号。因此，如果你习惯在 Oracle 中工作（它强制使用单引号字符串），则不需要改变你的习惯。如果字符串内部包含所使用的引号类型，请记住对其进行转义。\n\
  \n### 注意\n整数周围不需要引号。\n\n以下是一个需要进行转义的字符串示例：\n`O'Connor said \"Boo\"`\n\n如果你用双引号包含字符串，`INSERT`\
  \ 语句如下所示：\n点击此处查看代码图片\n\n```\nINSERT INTO table_name (column_name) VALUES (\"O'Connor\
  \ said\");\n```\n\n如果你用单引号包含字符串，`INSERT` 语句如下所示：\n点击此处查看代码图片\n\n```\nINSERT INTO\
  \ table_name (column_name) VALUES ('O''Connor said');\n```\n\n#### 深入了解 `INSERT`\n\
  除了表名外，`INSERT` 语句由两个部分组成：列列表和值列表。值列表是实际所需的，但如果你省略了列列表，则必须为每个列提供值。以 `grocery_inventory`\
  \ 表为例，你有五个字段。你可以使用以下两种语句之一：\n\n- 列出除 id 以外的所有列的语句：\n点击此处查看代码图片\n\n```\nINSERT INTO\
  \ grocery_inventory (item_name, item_desc, item_price, curr_qty)\nVALUES (1, 'Apples',\
  \ 'Beautiful, ripe apples.', 0.25, 1000);\n```\n\n- 使用所有列但未显式命名的语句：\n点击此处查看代码图片\n\
  \n```\nINSERT INTO grocery_inventory VALUES (2, 'Bunches of Grapes', 'Seedless grapes.',\
  \ 2.99, 500);\n```\n\n尝试这两种语句看看结果。你应该得到成功的响应。现在对于一些有趣的 `INSERT` 使用方法：由于 `id` 在创建表时被定义为自动递增整数，你不需要在值列表中包含它。然而，如果你有特定的值不想列出（例如\
  \ `id`），那么你必须列出剩余列。例如，以下语句没有列出列，也没有为 `id` 提供值：\n点击此处查看代码图片\n\n```\nINSERT INTO grocery_inventory\n\
  ('Bottled Water (6-pack)', '500ml spring water.', 2.29, 250);\n```\n\n上述语句会产生错误，如下：\n\
  点击此处查看代码图片\n\n```\nERROR 1136: Column count doesn't match value count at row 1\n\
  ```\n\n由于在此查询中没有列出任何列，MySQL 期望所有列都出现在值列表中；由于你没有提供，查询会导致错误。如果你的目标是让 MySQL 通过自动递增\
  \ `id` 字段来完成工作，你可以使用以下两种语句之一：\n\n- 列出除 id 以外的所有列的语句：\n点击此处查看代码图片\n\n```\nINSERT\
  \ INTO grocery_inventory (item_name, item_desc, item_price, curr_qty)\nVALUES ('Bottled\
  \ Water (6-pack)', '500ml spring water.', 2.29, 250);\n```\n\n- 使用所有列但未显式命名，且为 id\
  \ 表明一个 `NULL` 条目（这样它就会为你填充）：\n点击此处查看代码图片\n\n```\nINSERT INTO grocery_inventory VALUES\
  \ (NULL, 'Bottled Water (12-pack)',\n'500ml spring water.', 4.49, 500);\n```\n\n\
  \n\n\n请继续尝试两种方法，以便你的 `grocery_inventory` 表总共有四条记录。对于 MySQL 来说，你使用哪种都没有区别，但正如所有取决于你个人喜好的事情一样，在应用程序开发中要保持一致。一致的结构便于你日后调试，因为你清楚预期会得到什么。\n\
  \n## 使用 SELECT 命令\n\n`SELECT` 是用于从表中检索记录的 SQL 命令。该命令的语法可以非常简单，也可以非常复杂，取决于你想要选择哪些字段、是否想从多个表中选择数据，以及你计划实施什么种条件。随着你对数据库编程变得越来越熟悉，你将学会增强\
  \ `SELECT` 语句，最终让你的数据库尽可能地完成工作，而不是让你的编程语言过度负载。\n\n最基本的 `SELECT` 语法如下：\n\n点击此处查看代码图片\n\
  \n```\nSELECT expressions_and_columns FROM table_name\n```\n\n`[WHERE some_condition_is_true]`\n\
  \n`[ORDER BY some_column [ASC | DESC]]`\n\n`[LIMIT offset, rows]`\n\n查看第一行：\n\n\
  点击此处查看代码图片\n\n```\nSELECT expressions_and_columns FROM table_name\n```\n\n一个实用的表达式是\
  \ `*` 符号，它代表“所有”。因此，要从 `grocery_inventory` 表选择所有内容（所有行、所有列），你的 SQL 语句将是\n\n```\n\
  SELECT * FROM grocery_inventory;\n```\n\n根据 `grocery_inventory` 表中数据量的大小，结果会有所不同，但结果可能看起来如下：\n\
  \n点击此处查看代码图片\n\n```\n+----+-------------------------+-------------------------+------------+----------+\n\
  | id | item_name             | item_desc             | item_price | curr_qty |\n\
  +----+-------------------------+-------------------------+------------+----------+\n\
  | 1  | Apples                | Beautiful, ripe apples. | 0.25       | 1000     |\n\
  | 2  | Bunches of Grapes      | Seedless grapes.        | 2.99       | 500     \
  \ |\n| 3  | Bottled Water (6-pack)  | 500ml spring water.   | 2.29       | 250 \
  \     |\n| 4  | Bottled Water (12-pack) | 500ml spring water.  | 4.49       | 500\
  \      |\n+----+-------------------------+-------------------------+------------+----------+\n\
  4 rows in set (0.00 sec)\n```\n\n注意\n\n此输出来自 MySQL 命令行界面；它创建了一个美观的格式化表格，第一行为列名作为结果集的一部分。如果你使用的是不同的\
  \ MySQL 界面，你的结果将看起来不同。（重点观察预期的数据，而不是界面差异。）\n\n如果你只想选择特定的列，请将 `*` 替换为逗号分隔的列名。以下语句仅从\
  \ `grocery_inventory` 表中选择 `id`、`item_name` 和 `curr_qty` 字段：\n\n点击此处查看代码图片\n\n```\n\
  SELECT id, item_name, curr_qty FROM grocery_inventory;\n```\n\n结果显示为：\n\n点击此处查看代码图片\n\
  \n```\n+----+-------------------------+----------+\n| id | item_name           \
  \  | curr_qty |\n+----+-------------------------+----------+\n| 1  | Apples    \
  \            | 1000     |\n| 2  | Bunches of Grapes      | 500      |\n| 3  | Bottled\
  \ Water (6-pack)  | 250      |\n| 4  | Bottled Water (12-pack) | 500      |\n+----+-------------------------+----------+\n\
  4 rows in set (0.00 sec)\n```\n\n### 排序 SELECT 结果\n\n`SELECT` 的结果按照它们插入表的顺序排列，不能将其依赖作为一个有意义的系统。如果你想以特定方式排序结果（例如按日期、ID\
  \ 等），请使用 `ORDER BY` 子句指定你的需求。在以下语句中，意图是按 `item_name` 进行字母数字排序结果：\n\n点击此处查看代码图片\n\
  \n```\nSELECT id, item_name, curr_qty FROM grocery_inventory\nORDER BY item_name;\n\
  ```\n\n成功！结果如下：\n\n点击此处查看代码图片\n\n```\n+----+-------------------------+----------+\n\
  | id | item_name             | curr_qty |\n+----+-------------------------+----------+\n\
  | 1  | Apples                | 1000     |\n| 4  | Bottled Water (12-pack) | 500\
  \      |\n| 3  | Bottled Water (6-pack)  | 250      |\n| 2  | Bunches of Grapes\
  \      | 500      |\n+----+-------------------------+----------+\n4 rows in set\
  \ (0 sec)\n```\n\n提示\n\n当从表中选择结果而不指定排序顺序时，结果可能按其键值排序，也可能不排序。这是因为 MySQL 会重用被删除行所占的空间。换句话说，如果你添加了\
  \ ID 值为 1 到 5 的记录，删除 ID 为 4 的记录，然后添加另一个记录（ID 6），记录在表中的出现顺序可能是：1, 2, 3, 6, 5。\n\n\
  `ORDER BY` 结果的默认排序是升序 (`ASC`)）；字符串从 A 到 Z 排序，整数从 0 开始，日期从旧到新排序。你也可以使用 `DESC` 指定降序排序：\n\
  \n点击此处查看代码图片\n\n```\nSELECT id, item_name, curr_qty FROM grocery_inventory\nORDER\
  \ BY item_name DESC;\n```\n\n以下是结果：\n\n点击此处查看代码图片\n\n```\n+----+-------------------------+----------+\n\
  | id | item_name             | curr_qty |\n+----+-------------------------+----------+\n\
  | 2  | Bunches of Grapes      | 500      |\n| 3  | Bottled Water (6-pack)  | 250\
  \      |\n| 4  | Bottled Water (12-pack) | 500      |\n| 1  | Apples           \
  \     | 1000     |\n+----+-------------------------+----------+\n4 rows in set (0.00\
  \ sec)\n```\n\n在不指定排序顺序的情况下从表中选择结果并不限于单个字段——只要用逗号分隔指定的任意数量的字段。\n\n### 限制你的结果\n\n\
  你可以使用 `LIMIT` 子句从 `SELECT` 查询中返回特定数量的记录。使用 `LIMIT` 子句有两个要求：`offset`（偏移量）和 `rows`（行数）。`offset`\
  \ 是起始位置，而 `number of rows` 自言自懂。\n\n假设 `grocery_inventory` 表中有两个或三条记录，并且你想按 `curr_qty`\
  \ 选择前两个的 ID、名称和数量。换句话说，你想选择库存最低的两个物品。以下单参数限制从位置 0 开始，到第二条记录：\n\n点击此处查看代码图片\n\n```\n\
  SELECT id, item_name, curr_qty FROM grocery_inventory\nORDER BY curr_qty LIMIT 2;\n\
  ```\n\n以下是结果：\n\n```\n+----+-------------------------+----------+\n| id | item_name\
  \             | curr_qty |\n+----+-------------------------+----------+\n| 3  |\
  \ Bottled Water (6-pack) | 250      |\n| 2  | Bunches of Grapes      | 500     \
  \ |\n+----+-------------------------+----------+\n2 rows in set (0.00 sec)\n```\n\
  \n`LIMIT` 子句在实际应用中可能非常有用。例如，你可以在一系列 `SELECT` 语句中使用 `LIMIT` 子句分步遍历结果（前两个物品、接下来的两个、再随后的两个）：\n\
  \n1. `SELECT * FROM grocery_inventory ORDER BY curr_qty LIMIT 0, 2;`\n2. `SELECT\
  \ * FROM grocery_inventory ORDER BY curr_qty LIMIT 2, 2;`\n3. `SELECT * FROM grocery_inventory\
  \ ORDER BY curr_qty LIMIT 4, 2;`\n\n如果你在查询中指定了偏移量和数但没有找到结果，不会看到错误——只有一个空结果集。例如，如果\
  \ `grocery_inventory` 表只有六条记录，`LIMIT` 偏移量为 `6` 的查询将不会产生结果。\n\n\n\n\n\n## 在查询中使用\
  \ `WHERE`\n\n你已经学习了许多从表中检索特定列的方法，但不是特定的行。这时 `WHERE` 子句派上用场了。从 `SELECT` 语法示例中，你可以看到\
  \ `WHERE` 用于指定特定的条件：\n\n点击此处查看代码图片\n\n```\nSELECT expressions_and_columns FROM table_name\n\
  [WHERE some_condition_is_true]\n```\n\n一个示例是检索数量为 500 的项目的所有记录：\n\n点击此处查看代码图片\n\n\
  ```sql\nSELECT * FROM grocery_inventory WHERE curr_qty = 500;\n```\n\n以下是结果：\n\n\
  点击此处查看代码图片\n\n+----+-------------------------+---------------------+------------+----------+\n\
  | id | item_name             | item_desc             | item_price | curr_qty |\n\
  +----+-------------------------+---------------------+------------+----------+\n\
  | 2  | Bunches of Grapes      | Seedless grapes.      | 2.99       | 500      |\n\
  | 4  | Bottled Water (12-pack) | 500ml spring water. | 4.49       | 500      |\n\
  +----+-------------------------+---------------------+------------+----------+\n\
  2 rows in set (0.00 sec)\n\n如前所示，如果你在 `WHERE` 子句中使用整数，则不需要引号。然而，字符串周围需要加引号，关于转义字符的规则与你在\
  \ `INSERT` 章节中学习到的规则是一致的。\n\n## 在 `WHERE` 子句中使用运算符\n\n你已经在 `WHERE` 子句中使用等号（`=`）来判断条件的真假——即某一个值是否等于另一个值。你可以使用许多类型的运算符，其中比较运算符和逻辑运算符是最常用的类型。表\
  \ 16.1 列出了比较运算符及其含义。\n\n**表 16.1 基础比较运算符及其含义**\n\n![image](img/16tab01.jpg)\n\n\
  这还有一个名为 `BETWEEN` 的方便运算符，它在进行整数或日期比较时非常有用，因为它搜索的是最小值和最大值之间的结果。例如：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT * FROM grocery_inventory WHERE item_price BETWEEN 1.50 AND 3.00;\n\
  ```\n\n以下是结果：\n\n点击此处查看代码图片\n\n+----+------------------------+---------------------+------------+----------+\n\
  | id | item_name             | item_desc             | item_price | curr_qty |\n\
  +----+------------------------+---------------------+------------+----------+\n\
  | 2  | Bunches of Grapes      | Seedless grapes.      | 2.99       | 500      |\n\
  | 3  | Bottled Water (6-pack) | 500ml spring water. | 2.29       | 250      |\n\
  +----+------------------------+---------------------+------------+----------+\n\
  2 rows in set (0.00 sec)\n\n其他运算符包括逻辑运算符，它允许你在 `WHERE` 子句中使用多个比较。基础逻辑运算符是 `AND`\
  \ 和 `OR`。使用 `AND` 时，子句中的所有比较必须为真才能检索结果，而使用 `OR` 则允许至少有一个比较为真。此外，你还可以使用 `IN` 运算符来指定你想要匹配的项列表。\n\
  \n## 使用 `LIKE` 进行字符串比较\n\n你之前学习过如何使用 `=` 或 `!=` 在 `WHERE` 子句中进行字符串匹配，但在比较字符串时，`WHERE`\
  \ 子句还有另一个有用的运算符：`LIKE` 运算符。该运算符使用两个字符作为模式匹配中的通配符：\n\n• `%`—匹配多个字符\n• `_`—匹配恰好一个字符\n\
  \n例如，如果你想在 `grocery_inventory` 表中查找名称以字母 `A` 开头的记录，你可以使用以下语句：\n\n点击此处查看代码图片\n\n\
  ```sql\nSELECT * FROM grocery_inventory WHERE item_name LIKE 'A%';\n```\n\n以下是结果：\n\
  \n点击此处查看代码图片\n\n+----+-----------+-------------------------+------------+----------+\n\
  | id | item_name | item_desc             | item_price | curr_qty |\n+----+-----------+-------------------------+------------+----------+\n\
  |  1 | Apples    | Beautiful, ripe apples. |      0.25 |     1000 |\n+----+-----------+-------------------------+------------+----------+\n\
  1 row in set (0.00 sec)\n\n> 注意\n> 除非对二进制字符串进行 `LIKE` 比较，否则比较是不区分大小写的。你可以使用 `BINARY`\
  \ 关键字强制进行大小敏感的比较。\n\n## 从多个表中选择数据\n\n你并不限于一次只能选择一个表。那会让应用程序编程变成一项漫长且枯燥的任务！当你从多个表选择数据时，你正在连接这些表。\n\
  \n假设你有两个表：`fruit` 和 `color`。你可以使用两个独立的 `SELECT` 语句从每个表选择所有行：\n\n```sql\nSELECT *\
  \ FROM fruit;\n```\n这可能会产生如下结果：\n\n+----+-----------+\n| id | fruitname |\n+----+-----------+\n\
  | 1  | Bunches of Grapes |\n| 2  | Bottled Water (12-pack) |\n| 3  | Bottled Water\
  \ (6-pack) |\n| 4  | Apples |\n+----+-----------+\n\n```sql\nSELECT * FROM color;\n\
  ```\n第二个查询可能会产生如下数据：\n\n+----+-----------+\n| id | colorname |\n+----+-----------+\n\
  | 1  | red |\n| 2  | orange |\n| 3  | purple |\n| 4  | yellow |\n+----+-----------+\n\
  \n当你想要同时从多个表选择数据时，`SELECT` 语句的语法会有不同。首先，你必须确保所有表出现在 `FROM` 子句中。以 `fruit` 和 `color`\
  \ 表为例，你真正想要的是这两个表中 ID 匹配的 `fruitname` 和 `colorname` 记录。这引出了查询的另一个细微之处：当两个表中的字段名称相同时，如何指定你具体想要哪个字段。\n\
  \n简单来说，将表名附加到字段名后面，例如：`tablename.fieldname`\n\n因此，从两个 ID 匹配的表中选择 `fruitname` 和 `colorname`\
  \ 的查询如下：\n\n点击此处查看代码图片\n\n```sql\nSELECT fruitname, colorname FROM fruit, color\
  \ WHERE fruit.id = color.id;\n```\n\n此查询为你产生了更好的结果：\n\n+-----------+-----------+\n\
  | fruitname | colorname |\n+-----------+-----------+\n\n\n\n\n\n| apple | red |\n\
  | orange | orange |\n| grape | purple |\n| banana | yellow |\n+-----------+-----------+\n\
  4 rows in set (0.00 sec)\n\n然而，如果你尝试选择在两个表中都出现且名称相同的列，你将得到歧义错误：\n\n点击此处查看代码图片\n\n\
  ```sql\nSELECT id, fruitname, colorname FROM fruit, color\nWHERE fruit.id = color.id;\n\
  ```\n\n此查询产生了以下错误：\n\n点击此处查看代码图片\n\n```\nERROR 1052: Column: 'id' in field list\
  \ is ambiguous\n```\n\n如果你想从 `fruit` 表中选择 ID，可以使用以下语句：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT fruit.id, fruitname, colorname FROM fruit,\ncolor WHERE fruit.id = color.id;\n\
  ```\n\n此查询产生了以下结果：\n\n+------+-----------+-----------+\n| id   | fruitname | colorname\
  \ |\n+------+-----------+-----------+\n|    1 | apple     | red |\n|    2 | orange\
