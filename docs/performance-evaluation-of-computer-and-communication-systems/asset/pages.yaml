  md: '# Palm Calculus 225


    In discrete time, $\lambda$ is also simply equal to the probability that there
    is a point

    at an arbitrary time


    $\lambda = \mathbb{P}(T_0 = 0) = \mathbb{P}(N(0) = 1) = \mathbb{P}(N(t) = 1) \quad
    (7.17)$


    where the latter is valid for any $t$, by stationarity.


    One can think of $\lambda$ as the (average) rate of the event clock.


    # Palm Expectation and Palm Probability


    Let $Y$ be a time output of the simulation, assumed to be integrable (for

    example because it is bounded). We define the expectation $E^Y(Y)$ as the con-

    diditional expectation of $Y$ given that a point occurs at time $t$


    $E^Y(Y) = E(Y \, | \; n \in \mathbb{Z}, \ T_n = t) \quad (7.18)$


    If $Y = X(t)$, where $X(t)$ and the simulation are jointly stationary, $E^X(X(t))$

    d not depend on $t$. For $t=0$, it is called


    > Definition 7.1 (Palm expectation)

    $E^0(X(0)) = E(X(0) \, | \; a point of the process $T_n$ occurs at time 0) \quad
    (7.19)$


    According to the labeling convention in (7.15), if there is a point of the

    process $T_n$, it must be $T_0$, i.e.


    $E^0(X(0)) = E(X(0) \, | \; T_n - 0)$


    Note that there is some ambiguity in the notation


    The Palm *probability* is defined similarly, namely as


    $P^0(X(0) \in \ W) = \mathbb{P}(X(0) \in \ W \, | \; a point of the process $T_n$
    occurs at time 0$


    For any measurable subset $W$ of the set of values of $X(t)$. In particular, we
    can

    write $P^0(T_0 = 0) = 1$.


    The interpretation of the definition is easy in discrete time, if, as is the case,

    we assume that the point process "simple". In other words, there cannot be

    more than one point at any instant $t$. In this case, (7.18) has to be taken

    at the usual sense of conditional probabilities:


    $E^Y(Y) = E(Y \, | \; N(t) = 1) = \frac{E(YN(t))}{E(N(t))} = \frac{E(YN(t))}{N(t)=1}
    \lambda$


    where $N(t) = 1$ if there is a point at time $t$, and 0 otherwise.'
