    # Station Function for Category 2


    For the general station in this category, the station function is somewhat complex.
    However, for the special case of FIFO stations with one or more servers, it has
    a simple closed form, given at the end of this section.


    General MSCCC Station. Recall the station parameters are:


    +   - $r(i)$: the service rate when the total number of customers is $i$

    - $S$: the mean service time (independent of the class),

    - $B$: the number of servers,

    - $G$: the number of token pools; $T_g$: the size of token pool $g$; $\mathcal{G}$:
    the mapping of the class to the token pool, i.e. $\mathcal{G}(c)$ when class $c$
    is associated with token pool $g$.


    The station function is


    ```

    $d(\vec{n}) = d(\vec{x}) = \frac{\prod_{\tilde{S}|\vec{n}|} \prod_{g=1} x_g!}{\prod_{c=1}
    n_c!}; \quad (8.39)$

    ```


    with $|\vec{n}| = \sum_{c=1} n_c$, $\vec{x} = (x_1, \dots, x_G)$ and $x_g = \sum_{c:\\mathcal{G}(c)}
    n_c$ (the number of customers associated with token pool $g$). The function $d(\\vec{x}
    \in \mathbb{Z}^G)$, recursively defined by $d(\vec{x}) = 0$ if $x_g \le 0$ for
    some $g$, $d(0,\dots,0) = 1$ and


    ```

    $d(\vec{x}) \times bs(\vec{x}) = \sum_{g=1}^G d(\vec{x}-\tilde{I}_g); \quad (8.40)$

    ```


    where $bs(\\vec{x})^{\def} = min(B, \sum_{g=1}^G min(x_g, T_g))$ is the number
    of busy servers and $\tilde{I}_g = (0,\dots,1,\dots,0)$ with 1 in position $g$.
    Note


    ```

    $min(x_g, T_g) \le B \quad d(\vec{x}) = \prod_{g=1}^G \frac{1}{x_g} \min(i, T_g)$

    ```'
