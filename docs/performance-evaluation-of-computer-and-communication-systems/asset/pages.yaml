    \ same variance.\n\n> ^{(12)} Generate $R$ iid samples $\tilde{X}$ from the distribution\
    \ of $T(\tilde{X})$ under $H_0$ and compute $\\hat{p}$ as the fraction of times\
    \ that $\tilde{X} > T(\\vec{x})$. We need $R$ large (on the order of 10,000) and\
    \ compute a confidence interval for $\\hat{p}$ using Theorem 2.4."
