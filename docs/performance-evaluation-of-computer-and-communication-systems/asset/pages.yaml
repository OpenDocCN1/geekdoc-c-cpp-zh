  md: '# Review


    (1) A confidence interval for the mean characterizes both the variability of the
    data and the accuracy of the measured average. In contrast, a confidence interval
    for the median does not give a good reflection of the variability of the data.
    Therefore, if we use the mean, we both need a confidence interval for the median
    and a certain measure of the variability (quantiles, as in a Box Plot). Mean and
    standard deviation give an accurate idea of the variability of the data, but only
    if the data is roughly normal. Otherwise, it should be rescaled through for example
    a Box-Cox transformation. Normality can be verified with a qq-plot.


    (5) The standard deviation gives an accurate idea of the accuracy of the mean
    if the data is normal, but also if the data set is large. The latter can be verified
    with a bootstrap method.


    (6) The geometric (resp. harmonic) mean is meaningful if the data is roughly normal
    in log (resp. ½) scale. A confidence interval for the geometric (resp. harmonic)
    mean is obtained as the exponential (resp. inverse) of the mean in log (resp.
    ½) scale.


    (7) All estimators in this chapter are valid only if the data points are independent
    (non-correlated). This assumption must be verified, either by designing the experiments
    in a randomized way, (as is the case with independent simulation runs), or by
    formal correlation analysis.


    (8) If you have a choice, use median and quantiles rather than mean and standard
    deviation, as the former are more robust to distributional hypotheses and outliers.
    Use prediction intervals based on order statistic rather than the classical mean
    and standard deviation. Use the Lorenz curve gap rather than Jain’s fairness index.


