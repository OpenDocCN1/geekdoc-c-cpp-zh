    QUESTION 8.3 What happens to the example of Figure 8.5 if the CPU processing time
    is reduced from 0.004 to 0.007(4)


    # 8.3 Classical Results for a Single Queue


    The single queue has received much attention, and there are analytical results
    available for a large class of systems with random arrivals and service. We give
    here a minimal, useful set of results. For more details on certain topics, the
    classical reference is [46] and [47]; a more compact and up-to-date textbook is
    [71]. We start with some notation and a generic result.


    # 8.3.1 Kendall''s Notation


    The classical notation for a queue, in its simplest form, is of the type A/S/B/K
    where:


    +   - A (character string) describes the type of arrival process: G stands for
    the most general arrival process, A=GI signifies that the arrival process is a
    point process with iid interarrival times, and M represents a Poisson arrival
    process.


    +   - S (character string) describes the type of service: G for the most general
    service process, S=GI means that the service times are iid and independent of
    the arrival process, S=M correspond to constant service times.


    +   - B and K are integers representing the number of servers and the capacity
    (maximum number of customers allowed in the system, queued + service). When K=∞,
    it may be omitted.


    +   - An the arrival time and Sn the service time of the nth customer, labeled
    in order of arrival. We assume that the sequence (An, Sn) is stationary with respect
    to the index n and that it can be interpreted as a stationary point process (i.e.
    the expectation of An+1—An is finite, see Theorem 7.9).


    (4)The disk A becomes the bottleneck. Decreasing the CPU processing time to 0.002
    does not improve the bound significantly.'
