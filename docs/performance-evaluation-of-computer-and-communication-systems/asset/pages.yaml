    \ analytical formulae. We discuss ANOVA, which is very simple when it applies.\
    \ Finally, we also study robust tests, i.e. tests that make very few assumptions\
    \ about the distribution of the data.\n\n# 4.1 The Neyman Pearson Framework\n\n\
    # 4.1.1 The Null Hypothesis and the Alternative\n\nWe are given a data sample\
    \ $x_i, i = 1, \\dots, n$, and we assume that the sample is the output generated\
    \ by some unknown model. We consider two possible hypotheses over the model, $H_0$\
    \ and $H_1$, and we would like to infer from the data of which of two is true.\
    \ In the Neyman-Pearson framework, the two hypotheses play different roles: $H_0$,\
    \ the *null hypothesis*, is the conservative one. We do not want to reject it\
    \ unless we are fairly sure. $H_1$ is the *alternative hypothesis*.\n\nWe are\
    \ most interested in the *nested model* setting: the model is parameterized by\
    \ a certain $\theta$ in some space $\\Theta$, and $H_0 \\overset{\text{def}}{=}\
    \ \\theta \\in \\Theta_0$ and $H_1 \\overset{\text{def}}{=} \\theta \\in \\Theta$,\
    \ where $\\Theta_0$ is a subset of $\\Theta$.\n\nIn Example 4.1, the model could\
    \ be: all data points for compiler option 0 (resp. 1) are generated as iid random\
    \ variables with some distribution $F_0$ ($F_1$). Then, $H_0$ is \"$F_0 = F_1$\"\
    \ and $H_1$ is \"$F_0$ and $F_1$ differ by a shift in location\". This is the\
    \ model used by the Wilcoxon Rank Sum test (see Example 4.20 for more details).\
    \ Here $\\Theta_0 = \\{(F_0, F_0)\\}$ is a CDF and $\\Theta = \\{(F_0, F_1)\\\
    }$, $F_0$ is a CDF and $F_1(x) = F_0(x-m), m \\in \\mathbb{R}$.\n\nAnother, commonly\
    \ used model, for the example could be: all data points for compiler option 0\
    \ (resp. 1) are generated as iid random variables with some normal distribution\
    \ $N_{\\mu_0,\\sigma^2}$ (resp. $N_{\\mu_1,\\sigma^2}$). Then, $H_0$ is \"$\\\
    mu_0 = \\mu_1$\" and $H_1$ is \"$\\mu_0 \\neq \\mu_1$\". This is the model used\
    \ by the so-called \"Analysis of variance\" (see Example 4.10 for more details).\
    \ Here, $\\Theta_0 = \\{\\(\\mu_0, \\mu_0, \\sigma > 0)\\}$ and $\\Theta = \\\
    {\\(\\mu_0, \\mu_1, \\sigma > 0)\\}$, and this second model makes more assumptions,\
    \ and is to be employed with more care.\n\n# Example 4.1 Nonpaired Data\n\nA simulation\
    \ study compares the execution time, on a log scale, with two compiler options.\
    \ See Figure 4.1 for some data. We would like to test the hypothesis that compiler\
    \ option 0 is better than one. For one parameter set, the two series of data come\
    \ from different experiments."
