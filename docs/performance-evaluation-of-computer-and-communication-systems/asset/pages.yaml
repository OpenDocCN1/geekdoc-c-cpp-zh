    # C.5 Conditional Gaussian Complement


    # C.5.1 Schur Complement


    Let $M$ be a square matrix, decomposed in blocks as $M = \begin{pmatrix} A & B
    \ C & D \end{pmatrix}$, where $A$ and $D$ are square matrices (but $B$ and $C$
    need not be square) and $A$ is invertible. The *Schur complement* of $A$ in $M$
    is defined as


    ```

    $S = D - CA^{-1}B$

    ```


    It has the following properties.


    +   (1) $\det(M) = \det(A)\det(S)$;


    +   (2) If either $M$ or $S$ is invertible then so is the other and $M^{-1}$ has
    the form $(S^{-1}, \star)$, where $\star$ stands for unspecified blocks of appropriate
    dimensions;


    +   (3) If $M$ is symmetric (resp. positive definite, positive semi-definite),
    then so is $S$.


