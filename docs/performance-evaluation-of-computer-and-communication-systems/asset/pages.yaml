    \ one uses $Z^{-1}$ instead of $Z$; we utilize the direct convention, called the\
    \ “mathematician’s z-transform”). The following interpretation of the generating\
    \ function is quite useful. According to Theorem 8.8, $G(\tilde{Z})$ is the normalizing\
    \ constant for the open network made of this station alone, free by independent\
    \ external Poisson processes of $Z_c$, one for each class $c$. Upon finishing\
    \ the service at this station, customers leave the network and disappear.\n\n\
    In the rest of this section, we give the station functions for the different stations\
    \ introduced earlier.\n\n# Station Function for Category 1\n\nLet $pop(B) \\overset{\t\
    ext{def}}{=} (n_1,\\dots,n_c)$, where $n_c$ is the number of class-c customers\
    \ at this station when the station buffer is in state $B$ (i.e. $n_c = \\sum_{i\\\
    in\\mathcal{I}} I(B_i=c)$). The station function\n\n```\n$f(\\tilde{n}) = \\sum_{c=1}^C\
    \ \\Psi(B) \\tilde{S}_c^C \\quad (8.33)\n```\n\nwhere the summation runs $\\tilde{B}$\
    \ over all station buffers $B$ for which the vector of populations is $\tilde{n}$.\
    \ $\\tilde{S}_c$ is the mean service time for class $c$ at this station, and $\\\
    Psi$ is the Whittle function of this station.\n\nNote that the station function\
    \ is *independent* of the insertion probabilities $\\gamma$. For example, the\
    \ stationary probability is the same whether the station is PS or LCFSPR, they\
    \ differ only by the insertion probabilities.\n\nIn the case where the Whittle\
    \ function is a balance function, i.e. $\\Psi(\\tilde{n}) = \\Phi(\\tilde{n})$,\
    \ the summation may sometimes be computed.\n\n+   1) If the station uses global\
    \ queuing as in the Global PS and Global LCFSPR examples, there are $\\frac{n!}{n_1!...dots\
    \ n_c}$ buffer states for a given population vector, with $n = |\\tilde{n}| =\
    \ \\sum_{c=1}^C n_c$. The station function\n\n```\n$f(\\tilde{n}) = \\frac{n!}{\\\
    prod_{c=1}^C n_c!} \\Phi(\\tilde{n}) \\prod_{c=1}^C \\tilde{S}_c^{C} \\quad (8.34)\n\
    ```\n\n+   2) If the station uses class queuing as in the Per Class PS and Per\
    \ Class LCFSPR examples, there is one buffer state for one population vector and\
    \ the station function\n\n```\n$f(\\tilde{n}) = \\Phi(\\tilde{n}) \\prod_{c=1}^C\
    \ \\tilde{S}_c^{C} \\quad (8.35)\n```\n\nPS/Global LCFSPR/Kelly station with constant\
    \ rate. In these cases we can ensure that the service rate is 1; for all of these\
    \ disciplines the station function is given by (8.34) with $\\Phi(\\tilde{n})\
    \ =1$. The generating function is\n\n```\n$G(\\tilde{Z}) = \\frac{1}{1-\\sum_{c=1}^C\
    \ \\tilde{S}_c Z_c} \\quad (8.36)\n```"
