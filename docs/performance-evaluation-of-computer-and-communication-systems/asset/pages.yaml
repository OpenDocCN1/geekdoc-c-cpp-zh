  md: "# 218 Palm Calculus, or the Importance of the Viewpoint\n\nEquation (7.4) shows\
    \ that, for this example, the difference in viewpoints is attributed to the cross-covariance\
    \ between sleep time and execution time. A positive (resp. negative) cross-covariance\
    \ implies the time-average is larger (resp. smaller) than the event average. In\
    \ Example 7.1, the cross-covariance is positive and we find a larger time-average.\
    \ If the sleep time and execution times are not-correlated, the two viewpoints\
    \ happen to produce the same metric.\n\n# 7.1.3 Two Event Clocks\n\nThere exist\
    \ formulas not for relating time and event averages, but also for relating various\
    \ event averages (see Theorem 7.7). We show in this section how such formulas\
    \ can be derived, using the following variant of the large time heuristic:\n\n\
    +   (1) formulate each performance metric as a long run ratio, as we would if\
    \ you were evaluating the metric in a discrete event simulation;\n(2) take the\
    \ formula for one event average viewpoint and break it down into pieces, where\
    \ each piece corresponds to the time interval between selected events of the second\
    \ viewpoint;\n(3) compare the two formulations.\n\n# Example 7.3 Stop and Go Protocol\n\
    \nA source sends packets to a destination. Error recovery is done by the stop\
    \ and go protocol, as follows. When a packet is sent, a timer, with a fixed value\
    \ $t_1$, is set. If the packet is acknowledged before $t_1$, transmission is successful.\
    \ Otherwise, the packet is retransmitted. The packet plus acknowledgement transmission\
    \ and processing has a constant duration equal to $t_0 < t_1$. The proportion\
    \ of successful transmissions (fresh or not) is not $1-\\alpha$. We assume the\
    \ source is greedy, i.e. that it always has a packet for transmission. Can we\
    \ compute the throughput $\theta$ of this protocol without making any further\
    \ assumptions? The answer is yes, using the large time heuristic.\n\nTo end, we\
    \ compare the average transmission times sampled with the two event clocks. The\
    \ former (clock “a”)) ticks at every transmission or re-transmission attempt;\
    \ the latter (clock “0”)) ticks at fresh arrivals. Accordingly, let $\tau_a$ be\
