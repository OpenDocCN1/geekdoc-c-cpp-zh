  md: '# How to Sample from a Distribution


    where $x$ is the unknown. The solution is $x = -\frac{\ln(1-p)}{\lambda}$. Thus
    a sample $X$ of the exponential distribution is obtained by letting $X = -\frac{\ln(1-U)}{\lambda}$,
    since $U$ and $1-U$ have the same distribution:


    ```

    $X = -\frac{\ln(U)}{\lambda} \\quad (6.9)$

    ```


    where $U$ is the output of the random number generator.


    # Application to integer random variables


    Assume that $N$ is a random variable with values in $\mathbb{N}$. Let $p_k = \mathbb{P}(N
    = k)$, then for $n \in \mathbb{N}$


    ```

    $F(n) = \sum_{k=0}^{n} p_k$

    ```


    and $x \in \mathbb{R}$


    > $if x < 0$, then $F(x) = 0$\nelse $F(x) = \mathbb{P}(N \le x) = \mathbb{P}(N
    \le |x|) = F(|x|)$


    We compute $F^{-1}(p)$, for $0 < p < 1$. Let $n$ be the smallest integer such
    that $p < F(n)$. The set $\{x : F(x) \le p\}$ is equal to $(-\infty, n)$ (Figure
    6.8); the supremum of this set is $n$, thus $F^{-1}(p) = n$. In other words, the
    pseudo inverse is given by


    ```

    $F^{-1}(p) = n \iff F(n-1) \le p < F(n) \\quad (6.10)$

    ```


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_214_0.png)


    Figure 6.8 Pseudo-Inverse of CDF $F(\cdot)$ of an integer-valued random variable.'
