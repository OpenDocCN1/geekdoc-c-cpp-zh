  md: '# 5.3.2 Information Criterion


    An alternative is to use an information criterion, which strikes a balance between
    model accuracy and the number of parameters.


    Akaike''s information criterion (AIC) is defined for any parametric model by


    ```

    AIC = -2l(\hat{\theta}) + 2k

    ```


    where $k$ is the dimension of the parameter $\theta$ and $\hat{\theta}$ is the
    estimated likelihood. It can be interpreted in an information theoretic sense
    as follows [105, Section 7.3]. Consider an independent replication of the sequence
    $Y_t$; the sequence $X_t$, when the optimal code estimates the distribution of
    $X_t$ from the sample $Y_t$, AIC thus measures the efficiency of our model to
    describe the data. The preferred model is the one with the smallest information
    criterion.


    For the linear regression model with $n$ data points and $p$ degrees of freedom
    for $\beta$, the parameter is $\theta = (\beta, \sigma)$, thus $k = p+1$. AIC
    can easily be computed and one obtains


    ```

    AIC = 2(p + n \ln \hat{\sigma})

    ```


    where $C = 2 + n(1 + \ln(2\pi))$ and $\hat{\sigma}$ is the MLE of $\sigma$, i.e.


    ```

    \hat{\sigma}^2 = (1 - \frac{P}{n})s^2

    ```


    In practice, the AIC had a tendency to overestimate the model order $k$. An alternative
    criterion is the Bayesian information criterion (BIC) [19. 97], which is defined
    for a linear regression model by


    ```

    BIC = -l(\hat{\theta}) + k \ln n

    ```


    where $n$ is the number of observations. One finds


    ```

    BIC = p \ln n + 2n \ln \hat{\sigma} + C''

    ```


    with $C'' = n(1 + \ln(2\pi)) + \ln n$ and $p$ is the number of degrees of freedom
    for the parameter of the linear regression model.


