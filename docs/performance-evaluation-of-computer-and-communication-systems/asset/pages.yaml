    which states that


    aggregation of state from micro to macro


    does not introduce non-feasible micro-states


    This is equivalent to saying that the set $M$ is fully connected, i.e. that any
    global micro-state can be reached from any initial condition in a finite number
    of transitions of the underlying Markov chain. This is generally true except in
    pathological cases where the order of customers is preserved throughout the network
    lifetime. Consider a cyclic network with only FIFO stations and one customer per
    class. The initial order of customers cannot be changed and only states in $M$
    that preserve the initial ordering are feasible. In such a network, the product
    form does hold, but formulas for macro states are different from those in this
    chapter as the number of micro-states providing one specific macro-state is smaller.


    # 8.8.4 Local Balance in Isolation


    The station function can be defined both at the micro and macro levels. For many,
    the station function at the micro level is a function $F(e)$, if it exists, the
    micro state $e$ of the function in isolation, so that $F(\emptyset) = 1$, where
    $\emptyset$ is the empty state. Moreover, the stationary probability of state
    $e$ in the station in isolation is $\eta(K)F(e)$, where $\eta(K)$ is a normalizing
    constant that depends on the total populations of customers $K_c$ for every class
    $c$, in the station in isolation.


    We say that a station satisfies the local balance in isolation if the following
    holds. For every micro-state $e$ and class $c$,


    > the departure rate out of state $e$ due to a class-c arrival = the arrival rate
    into state $e$ due to a class-c departure (8.96)


    In this formula, the rates are given with respect to the stationary probability
    of the station in isolation, as defined earlier. It follows that one must also
    have the departure rate out of state $c$


    > due to a departure or an internal transfer, of any class = the arrival rate
    into state $e$ (8.97)


    due to an arrival or an internal transfer, of any class


    where an internal transfer is a change of state without arrival departure (this
    is valid for insensitive stations, and is a change of phase for one customer in
    service). The collection of these equations is the local balance in isolation.
    If one finds a station function such that local balance in isolation holds, then
    this must be the stationary probability of the station in isolation, up to a multiplicative
    constant.'
