  md: "An estimator provides a random result: for every realization of the data set,\
    \ a different estimation is produced. The \"goodness\" of an estimator is captured\
    \ by the following definitions. here $\\hat{X}$ is the random data set, $T(\\\
    hat{X})$ corresponds to the expectation when the unknown fixed parameter value\
    \ is $\\theta$.\n\n+   - Unbiased estimator: $E_\theta(T(\\hat{X})) = \\theta$.\
    \ For example, the estimator $\\hat{\\sigma}^2_n$ of variance of a normal id sample\
    \ given by Theorem 2.3 is unbiased.\n\n+   - Consistent family of estimators:\
    \ $\\hat{P}_n(|T(\\hat{X}_n) - \\theta|) > \\epsilon - 0$ when the sample size\
    \ $n$ goes to $\\infty$. For example, the estimator $(\\hat{\\mu}_n, \\hat{\\\
    sigma}_n)$ of Theorem 2.3 is consistent. This follows from the law of large numbers.\n\
    \n# B.1.2 Maximum Likelihood Estimator (MLE)\n\nA commonly used method for deriving\
    \ estimators is that of maximum likelihood. The maximum likelihood estimator is\
    \ the value of $\\theta$ that maximizes the likelihood $f(x_1, ..., x_n \\| \\\
    theta)$. This definition makes sense if the maximum exists and is unique, which\
    \ is often true in practice. A formal set of conditions is the regularity condition\
    \ in Definition B.1.\n\nIn Section B.2, we get a result that shows that the MLE\
    \ for an id sample with finite variance is asymptotically unbiased, i.e. the bias\
    \ tends to 0 as the sample size increases. It is also consistent.\n\n# Example\
    \ B.2 MLE for id normal data\n\nConsider a sample $(x_1, ..., x_n)$ obtained from\
    \ a normal id random vector $(X_1, ..., X_n)$. The likelihood is given by (B.1).\
    \ We want to maximize it, $x_1, ..., x_n$ are given and $\\mu, v = \\sigma^2$\
    \ are the variables. For a given $v$, the maximum is reached when $\\hat{\\mu}_n\
    \ = \\frac{1}{n}\\sum_{i=1}^n x_i$; Let $\\mu$ have this value and find the value\
    \ of $v$ that maximizes the resulting expression, or to simplify the log. We then\
    \ have to maximize\n\n```\n$-\\frac{n}{2v} \\ln v - S_{x,v} + C \\quad (B.2)\n\
    ```\n\nwhere $S_{x,v} \\colone{\\text{def}}{=} \\sum_{i=1}^n (x_i - \\mu)^2$ and\
    \ $C$ is a constant with respect to $v$. This is a simple maximization problem\
    \ in one variable $v$, which can be solved by computing the derivative. We find\
    \ that there is a maximum for $v = \\hat{\\sigma}^2_n$. The maximum likelihood\
    \ estimator of $(\\mu, v)$ is thus precisely the estimator in Theorem 2.2.\n\n\
    We say that an estimation method is invariant by re-parametrization if a different\
    \ parametrization gives essentially the same estimator. More precisely, assume\
    \ that we have a method that produces some estimator $T(\\hat{X})$ for $\\theta$.\
    \ Assume that we re-parametrize the problem by considering that the parameter\
    \ is $\\phi(\\theta)$, where $\\phi$ is some invertible mapping. A normal id sample\
    \ can be parametrized by $\\theta = (\\mu, v)$ or by $\\phi(\\theta) = (\\mu,\
    \ \\sigma)$, with $v = \\sigma^2$. The method is invariant by re-parametrization\
    \ if the estimator of $\\phi(\\theta)$ is precisely"
