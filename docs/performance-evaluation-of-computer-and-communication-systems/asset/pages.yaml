  md: "# Use of Bootstrap Replicates\n\nWhen the residuals appear to be uncorrelated\
    \ but non-Gaussian, the prediction intervals may be either over- or under-estimated.\
    \ It is possible to avoid the problem by using a Monte Carlo method (Section 6.4),\
    \ as explained in the following.\n\nThe idea is to draw many independent predictions\
    \ for the residuals, from which we can derive predictions for the original data\
    \ (using reverse filters). There are several possibilities for generating independent\
    \ predictions for the residuals: one can fit a distribution, or use Bootstrap\
    \ replicates (i.e. re-sample from the residuals with replacement). We give an\
    \ algorithm using this latter solution.\n\nAlgorithm 5.1 A Monte Carlo computation\
    \ of prediction intervals at level $1-\\alpha$ for time series $Y_t$ using re-sampling\
    \ from residuals. We are given: a data set $Y_t$, a differencing and de-seasonalizing\
    \ filter $L$, and an ARMA filter $F$ such that the residuals $\\epsilon = F^{-1}LY_t$\
    \ appear to be i; the current time $t$, the lag $\\ell$ and the confidence level\
    \ $r_0$ is the algorithm's accuracy parameter.\n\n+   1: $R = [2r_0/\\alpha] -\
    \ 1$ $\triangleright$ For example $r_0 = 25, R = 999$\n2: compute the differenced\
    \ data $(x_1, \\dots, x_t) = L(y_1, \\dots, y_t)$n3: compute the residuals $(\\\
    epsilon_e, \\dots, \\epsilon_t) = F^{-1}(x_q, \\dots, x_t)$ where $q$ is an initial\
    \ value chosen to avoid initial inaccuracies due to differing or de-seasonalizing\
    \ (e.g. $q=$ length of impulse response of $L$)\n4: for $r = 1$ to $R$\n5: draw\
    \ $\\ell$ numbers with replacement from the sequence $(e_q, \\dots, e_t)$ and\
    \ call them $\\epsilon_{t+1}, \\dots, \\epsilon_{t+\\ell}$\n6: let $\\epsilon^r\
    \ = (\\epsilon_q, \\dots, \\epsilon_{t+1}, \\dots, \\epsilon_{t+\\ell})$n7: compute\
    \ $X_{t+1}^r$ using $(X_q, \\dots, X_t, X_{t+1}, \\dots, X_{t+\\ell}) = F(\\epsilon^r)$n8:\
    \ compute $Y_{t+1}^r, \\dots, Y_t^r$ using Proposition 5.2 with $X_{t+s}^r$ and\
    \ $Y_{t+s}^r$ in lieu of $X(s)$ and $Y(s)$\n9: end for\n10: $(Y_{(1)}, \\dots,\
    \ Y_{(R)}) = \text{sort } (Y_t^1, \\dots, Y_t^R)$n11: Prediction interval is $[Y_{(r_0)},\
    \ Y_{(R+1-r_0)}]\n\nThe algorithm is basic in that it provides no information\
    \ of its accuracy. A larger $r_0$ produces a better accuracy; a more sophisticated\
    \ algorithm would set $r_0$ to give less accuracy is small. Note that, as any\
    \ bootstrap method, will likely fail if the distribution of the residuals is heavy-tailed.\n\
    \nAn alternative to the bootstrap is to fit a parametric distribution to the residuals;\
    \ the algorithm is the same as Algorithm 5.1 except line 5 is changed by the generation\
    \ of a sample residual from its distribution."
