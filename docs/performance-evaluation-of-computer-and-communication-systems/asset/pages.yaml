  md: '# An Informal Introduction


    instance, the average queue length at the information server upon a request

    arrival can be defined as


    ```

    Q'''' := \frac{1}{N+1} \sum_{i=1}^{N} Q(T_i)$

    ```


    where $Q(t^-)$ - an event-average statistic - is the queue size just before time
    $t$.


    In contrast, a time-average statistic is obtained using the standard clock, assumed
    to have infinite accuracy (i.e. the standard clock ticks every $\delta$ time units,
    where $\delta$ is “infinitely small”). For example, the average queue length,
    defined by


    ```

    $Q := \frac{1}{T_N - T_0} \int_{T_0}^{T_N} Q(s) ds$

    ```


    is a time-average statistic.

    In processing parlance, event averages correspond to adaptive sampling.


    # Example 7.1 Gatekeeper


    A multitasking system receives jobs. Any arriving job is first processed by a
    “gatekeeper task”, which allocates the job to an available “application processor”.
    Due to power saving, the gatekeeper is available only at times, 0, 90, 100, 190,
    200... (in milliseconds). For example, a job that arrives at the time 20 ms is
    processed by the gatekeeper at the time 90 ms.

    A job that is processed by the gatekeeper at times 0, 100, 200... is also allocated
    to an application processor with an execution time of 1000 ms. In contrast, a
    job that is processed by the gatekeeper at times 90, 190... has an execution time
    of 5000 ms (Figure 7.1). We assume that there is neither queuing nor any additional
    delay. We are interested in the average job execution time, excluding the time
    waiting for the gatekeeper to wake up to process the job.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_234_0.png)


    Figure 7.1 Gatekeeper: jobs are dispatched to a processor with processing times
    equal to 5000 or 1000 ms.


    The system designer thinks that the average job execution time is


    ```

    $W_s = \frac{1000 + 5000}{2} = 3000$ ms

    ```


    since there are two application processors and this is the average of their execution
    times.'
