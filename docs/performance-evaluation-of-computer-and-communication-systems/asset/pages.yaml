    # 6.3 Computing the Accuracy of Stochastic Simulations


    A simulation program is expected to output certain quantities of interest. For
    example, for a simulation of the algorithm A it may be the average number of lost
    messages. The output of a stochastic simulation is random: two different simulation
    runs produce different outputs. Therefore, it is not sufficient to give a single
    simulation result; in addition, we need to provide the accuracy of our results.


    # 6.3.1 Independent Replications


    A simple and very efficient method for obtaining confidence intervals is to use
    replication. Perform n independent replications of the simulation, producing an
    output X1, ..., Xn. Be careful to have truly random seeds for the random number
    generators, for example by accessing the computer time (Section 6.5).


    # 6.3.2 Computing Confidence Intervals


    We have to choose whether we want a confidence interval for the median or for
    the mean. The former is straightforward to compute, and should thus be preferred
    in general.


    Methods for computing confidence intervals for medians and means are summarized
    in Section 2.2.


    # Example 6.7 Application to Example 6.2


    Figure 6.4 shows the time it takes to transfer all files as a function of the
    number of customers. The simulation outputs do not appear to be normal, forever
    we test whether n is large, by looking at the qq-plot of the bootstrap replicates.
    We find that it looks normal, and we can use the Student statistic. Out of curiosity,
    we also compute the bootstrap percentile estimate and find that both confidence
    intervals are very close, the bootstrap percentile estimate being slightly smaller.'
