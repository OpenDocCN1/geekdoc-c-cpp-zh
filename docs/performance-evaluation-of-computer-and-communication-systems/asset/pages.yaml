  md: 'The test has the following form: reject $H_0$ when $ls > K$ for some constant
    $K$. The $p$-value can be obtained using Monte Carlo simulation. The problem is
    now to compute $P(T > 2\ell)$ where $T$ is a random variable distributed according
    to


    ```

    $n \ln(s^2) - \sum_{i=1} n_i \ln(s_i^2)$

    ```


    and assuming that $H_0$ holds. Observe that all we need is to generate the random
    variables $s_i^2$. They are independent, and $Z_i = n_is_i$ is distributed as
    $\sigma_{i-1}^2$ (Corollary C.3). Note that $T$ is independent of specific value
    of the unknown but fixed parameter $\sigma$, and we can let $\sigma = 1$ in the
    Monte Carlo simulation, which provides (4.22). Alternatively, one can use the
    large sample asymptotic in Theorem 4.3, which gives (4.23).


    When $\ell=2$, we can rewrite the likelihood ratio statistic as


    ```

    $\ell = \frac{1}{2}[n_1 \ln(n_1F+n_2) - n_1 \ln(F)] + C$

    ```


    where $C$ is a constant term (assuming $n_1$ and $n_2$ are fixed) and $F = \frac{s_2^2}{s_1^2}$.
    The derivative of $\ell$ with respect to $F$ is


    ```

    $\frac{\partial \ell}{\partial F} = \frac{n_1n_2(F-1)}{2F(n_1F+n_2)}$

    ```


    thus $\ell$ decreases with $F$ for $F < 1$ and increases for $F > 1$. Consequently,
    the rejection region, defined as $\{\ell > K\}$, is also of the form $\{F < K_1$
    or $F > K_2\}$. Now define


    ```

    $f = \frac{s_2^2}{s_1^2}$

    ```


    Note that $f=FC''$, $C''$ is a constant, so the set $\{F < K_1$ or $F > K_2\}$
    is equal to the set $\{\eta f$ or $f > \xi\}$ with $\eta=C''K_1$ and $\xi=C''K_2$.
    Under $H_0$, the distribution of $F$ is Fisher with parameters $(n_1-1, n_2-1)$
    (Theorem C.7), so we have a Fisher test. The bounds $\eta$ and $\xi$ are classically
    classified by the conditions $F_{n_1-1,n_2-1}(\eta)=\frac{\eta}{2}$, $F_{n_1-1,n_2-1}(\xi)=1-\frac{\xi}{2}$.


    Last, by the property of the Fisher distribution, the particular choice of $\eta$
    and above is such that $\xi=\frac{1}{\eta}$, so the rejection region is also defined
    by $\{f > \xi$ or $f < \frac{1}{\xi}\}$. This is the same as $\{\max(f, \frac{1}{f})
    > \xi\}$, a suitable form to define a $p$-value (Section 4.1.3). Let $g=\max(f,
    \frac{1}{f})$ and $X \sim F_{m,n}$. We then have


    ```

    $\rho^{def} = P(\max(X, \frac{1}{X}) > g) = P(X < \frac{1}{g}) + P(X > g) = F_{n_1-1,n_2-1}(\frac{1}{g})
    + 1-F_{n_1-1,n_2-1}(\g)$

    ```


    which, together with $\frac{1}{g}$, gives $\min(f,\frac{1}{f})$, (4.24).'
