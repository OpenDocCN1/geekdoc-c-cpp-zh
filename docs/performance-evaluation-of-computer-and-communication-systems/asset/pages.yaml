  md: '# Example B.5 Lazy Normal iid Revisited


    Consider the log of the data in Figure 2.12, which appears to be normal. The model
    is $Y \sim N(\mu, \sigma^2)$, where $Y$ is the log of the data. Assume that we
    would be too lazy to compute a confidence interval for $\mu$ but that we are too
    lazy to apply the exact Student statistic in Theorem 2.3. For any $\mu$, we estimate
    the nuisance parameter $\sigma$, by maximizing the log-likelihood:


    ```

    $l(\mu, \sigma) = \frac{1}{2}(n \ln \sigma^2 + \frac{1}{\sigma^2} \sum(Y_i - \mu)^2)$

    ```


    We obtain


    ```

    $$\hat{\sigma}_n^2 = \frac{1}{n}\sum(Y_i - \mu)^2 = \frac{1}{n}S_{Y\mu} + (Y -
    \mu)^2$

    ```


    and thus


    ```

    $pl(\mu) \overset{\max}{=}pl(\mu, \sigma_{\mu}) = -\frac{n}{2}(\ln \sigma_{\mu}^2
    + 1)$

    ```


    In Figure B.1, we find $\hat{\mu}=1.510$ as the point that maximizes $pl(\mu)$.
    A 95%-confidence interval is obtained as the set $\{pl(\mu) \geq pl(\hat{\mu})-\frac{3.84}{2}\}$.
    We obtain the interval $[1.106, 1.915]$. Compare to the exact confidence interval
    obtained with Theorem 2.3, which is equal to $[1.103, 1.918]$: the difference
    is negligible.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_378_0.png)


    **Figure B.1** The profile log-likelihood for parameter $\mu$ of the log of the
    data in Figure 2.12. The confidence interval for $\mu$ is obtained by application
    of Theorem B.2.'
