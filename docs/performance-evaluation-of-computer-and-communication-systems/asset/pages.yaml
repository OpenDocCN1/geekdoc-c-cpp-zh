  md: "The maximum likelihood method is invariant by re-parametrization. It is because\
    \ the property of being a maximum is invariant by re-parametrization. It is an\
    \ important property in our context, since the model is usually not given a priori,\
    \ but has to be invented by the performance analysis.\n\nA method that provides\
    \ an unbiased estimator generally not be-variant by re-parametrization. For example,\
    \ $(\\mu_n, \\sigma_n^2)$ of Theorem 2.3 is an unbiased estimator of $(\\mu, \\\
    sigma^2)$, but $(\\hat{\\mu}_n, \\hat{\\sigma}_n)$ is a biased estimator of $(\\\
    mu, \\sigma)$-because usually $\\mathbb{E}(S^2) \neq \\mathbb{E}(S)^2$ if $S$\
    \ is non-random. Thus, the property of being unbiased is incompatible with re-parametrization,\
    \ and may thus be seen as an inadequate requirement for an estimator.\n\nFurthermore,\
    \ the maximum likelihood is also *invariant by reversible data transformation*.\
    \ i.e. the MLE of $\theta$ is the same whether we look at the data or a one-to-one\
    \ transformation, independent of $\theta$. More precisely, that $\\hat{X} = (X_i)_{i=1}^n$\
    \ has a joint PDF $f_{\\hat{X}}(\\vec{x})$, and let $\\hat{Y} = \\varphi(X)$,\
    \ where $\\varphi$ is one-to-one, differentiable mapping of $\theta$.\n\nTake\
    \ $\tilde{X}$ and estimate $\theta f_{\tilde{X}}(\\vec{x} \\mid \theta)$ with\
    \ respect to $\theta$, where $\\vec{x} = (x_i)_{i=1}^n$ is the available data.\
    \ If instead, we observe $y_i = \\varphi(x_i)$ for all $i$, we have to maximize\n\
    \n$f_{\\hat{Y}}(\\vec{y}) = \\frac{1}{|\\varphi'(\\vec{x})|}$ f_{\tilde{X}}(\\\
    vec{x} \\mid \theta)$\n\nwhere $|\\varphi'(\\vec{x})|$ is the absolute value of\
    \ the determinant of the differential of $\\varphi$ (i.e. the Jacobian matrix).\n\
    \nIn particular, the MLE is invariant by *re-scaling* of the data. For example,\
    \ if $Y_i$ is a log-normal sample (i.e. if $Y_i = e^{X_i}$, and $X_i \\sim \t\
    ext{iid } N_{\\mu,\\sigma^2}$), then the MLE of the parameters $\\mu, \theta$\
    \ can be obtained by estimating the mean and standard deviation of $\\ln(Y_i)$.\n\
    \n# B.1.3 Efficiency and an estimator Fisher Information\n\nThe efficiency of\
    \ an estimator $T(\tilde{X})$ of the parameter $\theta$ is defined as the expected\
    \ square error $\\mathbb{E}_{\theta}[(T(\tilde{X})-\theta)^2]$ (here, we assume\
    \ that $\theta$ takes values in some space $\\Theta$ where the norm is defined).\
    \ The efficiency can be reached by an estimator captured by the concept of Fisher\
    \ information, which now define. For the sake of simplifying, assume first that\
    \ $\theta \\in \\mathbb{R}$. The *observed information* is\n\n$J(\theta) = -\\\
    frac{\\partial^2 l(\theta)}{\\partial \theta^2}$\n\nwhere $l(\theta)$ is the *log-likelihood*,\
    \ defined by\n\nl(\theta) = \\ln f(x_1, \\dots, x_n \\mid \theta)$\n\nThe *Fisher\
    \ information*, or *expected information* is defined by\n\n$I(\theta) = \\mathbb{E}_{\t\
    heta}(J(\theta)) = \\mathbb{E}_{\theta}\\left(-\\frac{\\partial^2 l(\theta)}{\\\
    partial \theta^2}\right)$"
