    $$\Delta_5 = \frac{1-B^5}{\Delta_1} = \frac{(1-B)(1+B+B^2+B^3+B^4)}{1-B} = 1+B+B^2+B^3+B^4
    = R_5$ (D.21)$


    If $F$ and $G$ are FIR, $FG, F+G$ and $F-G$ are also FIR, but $\frac{F}{G}$ is
    (generally) not.


    # D.1.8 z Transform


    It is customary in signal processing to manipulate transforms rather than the
    filters themselves. By definition, the *transfer function* of the filter with
    impulse response $h$ is the power series


    $H(z) = h_0 + h_1z^{-1} + h_1z^{-2} + \dots$ (D.22)$


    i.e. it is the $z$ transform of the impulse response. This is considered a formal
    series, there is no worry about its convergence for any value of $z$. Note the
    use of $z^{-1}$ (customary in signal processing) rather than $z$ (customary in
    maths).


    It follows the rules on the calculus of filters that using transfer functions
    is the same as replacing $B$ by $z^{-1}$ everywhere.


    # Example D.5


    The transfer function of the filter


    $F = \frac{Q_0+Q_1B+\dots+Q_qB^q}{P_0+P_1B+\dots+P_pB^p}$ (D.23)$'
