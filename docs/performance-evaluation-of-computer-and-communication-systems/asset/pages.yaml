  md: '# CHAPTER 5


    # Forecasting


    Forecasting is a risky exercise, and involves many aspects that are well beyond
    the scope of this book. However, it is the engineer''s responsibility to forecast
    what can be forecast. For example, if the demand on a communication line is multiplied
    by 2 every 6 months, it is wise to provision a sufficient capacity to accommodate
    this exponential growth. We present a simple framework to understand what forecasting
    is. We emphasize the need to quantify the accuracy of a forecast with a prediction
    interval. For the how, there are many methods (perhaps because an exact forecast
    is essentially impossible). We focus on simple, generic methods that have been
    found to work well in a large variety of cases. A first method is linear regression;
    it is very simple to use (with a computer) and of quite general application. It
    gives decent forecasts as long as the data does not vary too much.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_160_0.png)


    Better predictions may be obtained by a combination of differencing, seasonalizing
    filters and linear time series models (ARMA and ARIMA processes - this is also
    called the Box-Jenkins method). We discuss how to avoid'
