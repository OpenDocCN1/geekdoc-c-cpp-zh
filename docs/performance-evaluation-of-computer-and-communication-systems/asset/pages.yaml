- img_proc: true
  md: "Here, $B_n$ is the $n \times n$ matrix\n\n```\n$B_n = \\begin{pmatrix} 0 &\
    \ 0 & 0 & \\dots \\ 1 & 0 & 0 & \\dots \\ 0 & 1 & 0 & \\dots \\ \\vdots & \\vdots\
    \ & \\vdots & \\dots \\ & & 0 & 0 \\ & & 1 & 0 \\end{pmatrix}$\n```\n\nObviously,\
    \ if $n = \\text{length}(X)$, then applying $B$ $n$ times to $X$ gives a sequence\
    \ of 0s; in matrix form:\n\n$(B_n)^n = 0 \\quad (D.3)\n\n# D.1.2 Filters\n\n+\
    \   **Definition D.1**\nA *filter* (also called “causal filter”, or “realizable\
    \ filter”) is any mapping, say $F$, from $S$ to itself that has the following\
    \ properties\n(1) A sequence of length $n$ is mapped to a sequence of the same\
    \ length.\n(2) There exists an infinite sequence of numbers $h_m, m = 0, 1, 2,\
    \ \\dots$ (called the filter’s *impulse response*) such that, for any $X \\in\
    \ S$,\n\n$(FX)_t = h_0X_t + h_1X_{t-1} + \\dots + h_{t-1}X_1 \\quad t=1, \\dots,\
    \ \\text{length}(X) \\quad (D.4)\n\n+   **Example D.1**\nThe backshift operator\
    \ $B$ is the filter with $h_0 = 0, h_1 = 1, h_2 = h_3 = \\dots = 0$.\nThe identical\
    \ mapping, Id, is the filter with $h_0 = 1, h_1 = 1, h_2 = \\dots = 0$.\nThe de-seasonalizing\
    \ filter of order $s$, $R_s$, is the filter with $h_0 = \\dots = h_{s-1} = 1,\
    \ h_m = 0$ for $m \\geq s$.\nThe differencing filter at lag $s$, $\\Delta_s$,\
    \ is the filter with $h_0 = 1, h_s = -1$ and $h_m = 0$ for $m \\neq 0$ and $m\
    \ \\neq s$.\n\nEquation (D.4) can also be expressed as\n\n```\n$F = \\sum_{m=0}^{\\\
    infty} h_m B^m \\quad (D.5)\n```\n\nwhere $B^0 = \\text{Id}$. Note that the summation\
    \ is only apparently infinite, for a sequence $X$ in $S$ of length $n$, we have\
    \ $FX = \\sum_{m=0}^{n-1} h_m B^m X$."
