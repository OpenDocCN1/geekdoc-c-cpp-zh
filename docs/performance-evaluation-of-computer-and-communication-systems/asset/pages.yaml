    network population vector is $\hat{K}$.


    Then, for $\hat{0} \le \hat{k} \le \hat{K}$,


    ```

    $P^1(\hat{k}|hat{K}) = \frac{\eta^1(\hat{K})\eta^2(\hat{K}-\hat{k})}{\eta(\hat{K})}
    \quad (8.86)$

    ```'
