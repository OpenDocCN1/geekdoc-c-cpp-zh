    \hat{\mu}_n\pm\frac{s_n}{\sqrt{n}} \quad (2.21)

    ```


    where $\eta$ is the $\frac{1+\gamma}{2}$ quantile of the normal distribution $N_{0,1}$,
    i.e. $N_{0,1}(\eta)=\frac{1+\gamma}{2}$. For example, $\eta=1.96$ for $\gamma=0.95$
    and $\eta=2.58$ for $\gamma=0.99$.'
