  md: "# What this tells us\n\nThough most practical systems are unlikely to fit the\
    \ assumptions of any of the models in this section, the analytical formulas do\
    \ explain patterns that are observed in practice. The models here are valid for\
    \ systems without feedback, since the arrival process is not influenced by the\
    \ state of the queuing system. Important features of such systems include:\n\n\
    +   * Non Linearity of Response Time. At low values of the utilization factor\
    \ $\rho$, the response time tends to increase slowly, and linearly with $\rho$.\
    \ In contrast, as $\rho$ approaches 1, the response time grows to $\\infty$ (Figure\
    \ 8.7). Consequently, the impact of a small traffic increase is dramatically different,\
    \ depending on the initial value of the utilization factor.\n\nQUESTION 8.8 What\
    \ happens to the system in Figure 8.7 if the traffic volume increases by 20%^{(10)}\n\
    \n+   * Variability Considered Harmful. The Pollaczek-Khinchine formula for the\
    \ mean in (8.7) shows that the response time and queue sizes increase with the\
    \ variability of the service time. See also Figure 8.8.\n\n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_297_0.png)\n\
    \n> **Figure 8.7** The average response time versus requests per second for a\
    \ database server modeled as an M/GI/1 queue. The time needed to process a request\
    \ is 0.1 s and its standard deviation is estimated to 0.03. The maximum load that\
    \ can be served if an average response time of 0.5 s is considered acceptable\
    \ is 8.8 requests per second. If the traffic volume increases by 10%, the response\
    \ time becomes 1.75; i.e. it is multiplied by a factor of 3.5.\n\n(10) The system\
    \ becomes unstable $\rho > 1$; in practice, it will lose requests, or enter congestion\
    \ collapse."
