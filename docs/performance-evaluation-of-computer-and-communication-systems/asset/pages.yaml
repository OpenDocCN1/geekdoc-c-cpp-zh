    # 8.6.5 Arrival Theorem and MVA Version 1


    **Mean Value Analysis** (MVA) is a method, developed in [86], that does not compute
    the normalizing constant and avoids potential overflow problems. There are many
    variants of it, see the discussion in [6].


    In this chapter, we give two versions. The first, described in this section, is
    very simple, but applies only to some station types, as it requires the ability
    to derive the response time from the Palm distribution of the queue size upon
    customer arrival. The second, described in Section 8.6.7, is more general and
    applies to all stations for which the equivalent service rate can be easily computed.


    MVA version 1 is based on the following theorem, which is a consequence of the
    product form theorem and the embedded subchain theorem of Palm Calculus (Theorem
    7.12).


    # Theorem 8.16 (Arrival Theorem)


    Consider a multi-class product form queuing network. The probability distribution
    of the number of customers seen by a customer just before arriving at station
    s is the stationary distribution of


    +   * the same network if the customer belongs to an open chain;

    * the network, with one customer less in its chain, if the customer belongs to
    a closed chain.


    Consider now a closed network where all stations are FIFO or IS with a constant
    rate, or are equivalent in the sense that they have the same station function
    as one of these (thus have the same equivalent service rate). Indeed, recall that
    stationary probabilities and throughput depend only on the station'
