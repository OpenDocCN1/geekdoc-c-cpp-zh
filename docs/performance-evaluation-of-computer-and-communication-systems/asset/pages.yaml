  md: '# Filters with Rational Transfer Function


    Thus for $t=1,\dots, \text{length}(X):$


    ```

    $P_0Y_t + P_1Y_{t-1} + \dots + P_pY_{t-p} = Q_0X_t + Q_1X_{t-1} + \dots + Q_qX_{t-q}
    \quad (D.27)$

    ```


    with the usual convention $Y_t = X_t$ for $t \leq 0$. Since $P_0 \neq 0$, this
    equation can be used to iteratively compute $Y_1 = \frac{Q_0X_1}{P_0}, Y_2 = \frac{Q_0X_2+Q_1X_1}{P_0},$
    etcc.,


    The impulse response of $F$ is usually computed by applying filter to a Dirac
    sequence. It may be computed by Taylor series expansion, using classical rules
    for Taylor series of functions of one real variable.


    # Example D.6


    The impulse response of filter $G = \frac{1-2B}{1-B^2}$ is obtained as follows.
    We use the rule $\frac{1}{1-x} = 1+x+x^2+\dots$ and obtain


    ```

    $$\frac{1-2B}{1-B^2} = (1-2B)(1+B^2+B^4+\dots)\n=1+B^2+B^4+B^6-2B-2B^3-2B^5-\dots\n-2B-B^2-2B^3+B^1-2B^3-\dots$

    ```


    Thus, the impulse response of $G$ is $(1,-2,1,-2,-1,-2,\dots)$.


    Note that, in general, a filter with a rational transfer function has an infinite
    impulse response.


    The inverse of the filter $F$ exists if $Q_0 \neq 0$ and is


    ```

    $F^{-1} = \frac{P_0+P_1B+\dots+P_pB^p}{Q_0+Q_1B+\dots+Q_qB^q} \quad (D.28)$

    ```


    i.e. it is obtained by exchanging numerator and denominator.


    # D.3.2 Poles and Zeros


    By definition, the **Poles** of a filter with rational transfer functions are
    the values of $z$, other than $0$, for which the transfer function is not defined.
    If the transfer function is in a form that cannot be simplified,$^{(3)}$ the poles
    are the zeros of the denominator. Similarly, the **Zeros** of the filter are the
    values of $z \neq 0$ such that $H(z)=0$.


    A filter with rational transfer function is stable if it has no pole or poles
    are all inside the unit disk, i.e. they have a modulus of less than 1. This follows
    from the definition of stability and standard results on the theory of Taylor
    series of rational fractions in one variable.


    The location of zeros is useful to assess the stability of the reverse filter.
    If it is invertible (i.e. $Q_0 \neq 0$), then the inverse filter is stable if
    all zeros of the original filter are within the unit disk.


    > i.e. of the form $\frac{P(z)}{Q(z)}$, where $p, q$ are polynomials with no common
    root'
