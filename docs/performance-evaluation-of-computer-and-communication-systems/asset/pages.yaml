    # 5.4 Differencing the Data


    A slightly more sophisticated alternative to the regression method is to combine
    two approaches: to first capture trends and periodic behavior by application of
    differencing or de-seasonalizing filters, and then to fit the filtered data to
    a time series stationary model that allows correlation. as we explain in this
    and the next section.


    # 5.4.1 Differencing and De-seasonalizing Filters


    Consider a time series $Y = (Y_1, \dots, Y_n)$. Contrary to linear regression
    model-, we require here that the indices are contiguous integers, $t = 1, \dots,
    n$. The'
