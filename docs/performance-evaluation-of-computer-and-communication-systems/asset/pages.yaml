  md: 'In the statistics literature, it is custom to describe an ARIMA(p,d,q)

    process $Y_t$ by writing


    ```

    $$(1-B)^d(1+A_1B+\cdots+A_pB^p)Y=(1+C_1B+\cdots+C_qB^q)\epsilon\quad(5.28)$

    ```


    which is the same as saying that $\Delta^d Y$ is a zero mean ARMA(p,q) process.


    By extension, we also call an ARMA process a process $Y_t$ such that $LY$ is an
    ARMA process where $L$ is a combination of differencing and de-seasonalizing filters.


    # 5.5.3 Fitting an ARMA Model


    Assume we have a time series, after differing and de-seasonalizing

    (and possible re-scaling), produces a time series $X_t$ that appears to be station-

    nary and close to Gaussian (it does not have wild dynamics), but is

    iid. We now think of fitting an ARMA model to $X_t$.


    The ACF and PACF plots can offer some bound of the orders $p$ and $q$ of the

    model, as tend to be exponential decay at lags larger than $p$ and $q$. Note

    that the samples ACF and PACF make sense only if the data appears to be

    generated from a stationary process. If the data comes from a non-stationary

    process, this may be grossly misleading (Figure 5.10).


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_179_0.png)


    **Figure 5.10** (a) Sample ACF of the internet traffic of Figure 5.1. The data
    does not appear to come from a stationary process so the sample ACF cannot be
    interpreted

    as an estimation of a true ACF (which does not exist). (b) Sample ACF of data

    differenced at lags 1 and 16. The sampled data appears to be stationary and the

    sample ACF decays rapidly. The differenced data appears to be suitable for modeling

    an an ARMA process.


    # Maximum Likelihood Estimation of an ARMA or ARIMA Model


    Once we have decided on orders $p$ and $q$, we need to estimate the parameters

    $\mu, \sigma, A_1, \dots, A_p, C_1, \dots, C_q$. As usual, this is done by maximum
    likelihood,

    which is simplified by the following result:'
