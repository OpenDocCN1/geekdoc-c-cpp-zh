    # 8.9.5 Conclusions


    Doubling the capacity does indeed reduce the waiting time by a factor of 2 during
    bursts of arrivals, and by a factor of 2 or more during the stationary regime.
    This is independent of whether the increase in capacity is obtained by increasing
    the number of servers or reducing the service time at the gate.


    These findings assume that the arrival rate is not impacted by the capacity increase
    and does not account for long-term effects. In the long run, a reduction in waiting
    time might attract more customers and this will in turn increase the waiting time.


    There is an optimal capacity $c^*$, for any target customer population size $K^*$
    (maximum number of customers that the ski resort can accommodate on the slopes),
    given by $c^* \approx \frac{K}{Z}$ where $Z$ is the mean time between visits to
    the gate. If the capacity is below $c^*$, the waiting time is large; increasing
    $c$ beyond $c^*$ brings little benefit to waiting time.


