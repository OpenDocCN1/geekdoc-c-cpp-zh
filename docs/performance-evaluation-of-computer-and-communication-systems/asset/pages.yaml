    We change models by letting $X''_{i,j} = X_{i,j} - \mu_0$ and we are back to the
    ANOVA framework.


    # 4.3.2 Testing for a Common Variance


    We often need to verify that the common variance assumption holds. Here too, a
    likelihood ratio test gives the answer. In the general case, the $p$-value of
    the test cannot be computed in closed form, so we use either Monte Carlo simulation
    or an asymptotic approximation. When the number of groups is 2, there is a closed
    form using the Fisher distribution.


    We are given a data set with $I$ groups $x_{i,j}, i=1, \dots, I, j=1, \dots, n_i$;
