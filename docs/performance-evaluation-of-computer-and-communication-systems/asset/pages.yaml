    # 2.3.1 What does i mean?


    Independent and identically distributed-ness is a property of a stochastic model,
    not of the data. When we say, by abuse of language, that the collected data set
    is $i$, we mean that we can do as if the collected data $x_1, \dots, x_n$ is a
    sample (i.e. a simulation output) for a sequence of random variables $X_1, \dots,
    X_n$ where $X_1, \dots, X_n$ are independent and all have the same (usually unknown)
    distribution with $F(cdot)$.


    To generate such a sample, we draw a random number from the distribution $F(\)$
    (see Section 6.6). Independence means that the random numbers generated at every
    step $i$ are discarded and not reused in the future steps $i+1, \dots$. Another
    way to think of independence is with conditional probabilities: for any set of
    real numbers $A$


