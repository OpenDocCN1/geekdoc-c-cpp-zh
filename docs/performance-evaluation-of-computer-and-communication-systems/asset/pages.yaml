    *fractional Brownian traffic* [74]. This is a simplified model that captures long
    range dependence, i.e. the often observed property of an auto-correlation function
    not decaying exponentially. This means that


    ```

    A(-t) = \lambda t + \sqrt{\lambda}B_H(t)

