- img_proc: true
  md: 'differencing filter at lag 1 is the mapping, denoted with $\Delta_1$, which
    forms a series $Y$ of finite length into a time series $X = \Delta_1 Y$ of equal
    length such that


    ```

    $X_t = (\Delta_1 Y)_t = Y_t - Y_{t-1} \quad t = 1, \dots, n$

    ```


    where by convention $Y_j = 0$ for $j \leq 0$. Note that this convention is not
    the best possible, but it simplifies the theory to a large extent. In practice,
    the implication is that the first term of the filtered series is not meaningful
    and should not be used for fitting a model (these terms are removed from the plots
    in Figure 5.7). Formally, we consider $\Delta_1$ to be a mapping from $\mathbb{R}^n$
    onto itself, i.e. it acts on the time series of any finite length.


    The differencing filter $\Delta_1$ is a discrete time equivalent of a derivative.
    If the data has a polynomial trend of degree $d \geq 1$, then $\Delta_1 Y$ has
    a trend of degree $d-1$. Thus, $d$ iterated applications of $\Delta_1$ to the
    data remove any polynomial trend of degree up to $d$.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_169_0.png)


    (a) Differencing at lag 1


    (b) Differencing at lag 16


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_169_1.png)


    (c) Differencing at lags 1 and 16


    **Figure 5.7** Differencing filters $\Delta_1$ and $\Delta_{16}$ applied to Example
    5.1 (first terms removed). The forecasts are made under the assumption that the
    differenced data is iid Gaussian with 0 mean. $\circ$=actual value of the future
    (not used for fitting the model).'
