  md: '# 2.1 Summarized Performance Data


    # 2.1.1 Histograms and Empirical CDF


    Assume that you have obtained a large set of results for the value of a performance
    metric. This can be fully described by the distribution of the data, and illustrated
    by a *histogram*. A histogram uses bins for the data values and plots on the $y$
    axis the proportion of data samples that fall in the bin on the $x$ axis, see
    Figure 2.1.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_43_0.png)


    **Figure 2.1** Data for Example 2.1. Measured execution times (ms) for 100 transactions
    with the old and new code.


    The *empirical cumulative distribution function* (ECDF) is an alternative to histograms,
    and sometimes facilitates comparisons. The ECDF of a data set $x_1,\dots,x_n$
    is the function $F$ defined by


    ```

    $F(x) = \frac{1}{n} \sum_{i=1}^{n} 1_{\{x_i \le x\}} \quad (2.1)

    ```


    so that $F(x)$ is the proportion of data samples that do not exceed $x$.'
