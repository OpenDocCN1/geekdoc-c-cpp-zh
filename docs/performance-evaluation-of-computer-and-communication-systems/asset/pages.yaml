    comprises one server and one 802.11 base station. Before deployment, performance
    evaluation tests are carried out, as shown in Figure 1.3(a). We see that the throughput
    reaches a maximum around 8 transactions per second.


    Joe concludes that the bottleneck is the wireless LAN and decides to buy and install
    2 more base stations. The results obtained after instal'
