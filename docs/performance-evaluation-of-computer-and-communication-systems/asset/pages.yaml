  md: '# Prediction Interval


    Sometimes we are interested in a different viewpoint and would like to characterize
    the variability of the data. We might for example like to summarize what can be
    expected for an arbitrary future (non-observed) transaction. This run time is
    random. A prediction interval at level $\gamma$ is an interval that we can compute
    by observing a revelation of $X_1, \dots, X_n$ such that, with probability $\gamma$,
    a future transaction will have a run time in this interval. If the common CDF
    of all $X_i$ is known, a prediction interval would be an inter-quantile, e.g.,
    $[m_{\alpha/2}, m_{1-\alpha/2}]$ with $\alpha = 1-\gamma$. For instance, if the
    distribution is normal with known parameters, a prediction interval at level 0.95
    would be $\mu \pm 1.96\sigma$. However, there is some additional uncertainty,
    due to the fact that we do not know the distribution, or its parameters a priori,
    and thus need to estimate it. The prediction interval captures both uncertainties.
    Formally, the definition is as follows.


    # Definition 2.2


    $X_1, \dots, X_n, X_{n+1}$ be a sequence of random variables. A prediction interval
    at level $\gamma$ is an interval of the form $[u(X_1, \dots, X_n), v(X_1, \dots,
    X_n)]$ such that


    ```

    $$\mathbb{P}(u(X_1, \dots, X_n) \le X_{n+1} \le v(X_1, \dots, X_n)) \ge \gamma
    \quad (2.31)$

    ```


    Note that the definition does not assume $X_i$ is iid, however we focus in this
    chapter on the id case (see Section 2.4.1 for a discussion of the more general
    case). The trick is now to find functions $u$ and $v$ that are *pivots*, i.e.
    their distribution is known even if the common distribution of the $X_i$ is not
    (or not entirely known).


    There is one general result, which in practice applies to sizes that are not too
    small ($n \ge 39$). It is given next.


    # 2.4.1 Prediction for an iid sample based on Order Statistic


    **Theorem 2.5 (General Independent and Identically Distributed Case)**nLet $X_1,
    \dots, X_n, X_{n+1}$ be an iid sequence and assume that the common distribution
    has a density. Let $X_{(1)}, \dots, X_{(n)}$ be the order statistic of $X_1, \dots,
    X_n$. For $1 \le j \le k \le n$:


    ```

    $$\mathbb{P}(X_{(j)}^{\alpha} \le X_{n+1} \le X_{(k)}^{\alpha}) = \frac{k-j}{n+1}
    \quad (2.32)$

    ```


    thus for $\alpha \ge \frac{1}{n+1}$, $[X_{(n+1)}^{(alpha)}, X_{(1)}^{(\alpha)}]$
    is a prediction interval at a level of at least $\gamma = 1-\alpha$.


    For example, with $n = 999$, a prediction interval at the level 0.95 ($\alpha
    = 0.05$) is $[X_{(25)}, X_{(975)}]$. This theorem is similar to the bootstrap
    result in Section 2.2.4, but is exact and much simpler.'
