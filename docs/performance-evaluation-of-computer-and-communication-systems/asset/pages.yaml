  md: "# 4.7 Review\n\n# 4.7.1 Tests are just Tests\n\n(1) The first test to perform\
    \ on any data is a visual exploration. In most cases, this is sufficient.\n\n\
    (2) Testing for a 0 mean or median is the same as computing a confidence interval\
    \ for the mean or the median.\n\n(3) Tests work only if the underlying assumptions\
    \ are verified (in particular, practically all tests, even robust ones, assume\
    \ that the data comes from an iid sample).\n\n(4) Some tests work under a larger\
    \ spectrum of assumptions (e.g. even if the data is not normal). These are called\
    \ robust tests, and should be preferred whenever possible.\n\n(5) Test whether\
    \ the same variance assumption holds. otherwise, use robust tests or asymptotic\
    \ results.\n\n(6) If you perform a large number of different tests on the same\
    \ data, the probability of rejecting $H_0$ is larger than any single test. So,\
    \ contrary to non-statistical tests, increasing the number of tests does not always\
    \ improve the decision.\n\n# 4.7.2 Review Questions\n\n4.1 What is the critical\
    \ region of a test?^{(8)}$\n\n4.2 What is a type-1 error? A type-2 error? The\
    \ size of a test?^{(9)}$\n\n4.3 What is the $p$-value of a test?^{(10)}$\n\n4.4\
    \ What are the hypotheses for ANOVA?^{(11)}$\n\n4.5 How do you compute a $p$-value\
    \ by Monte Carlo simulation?^{(12)}$\n\n> ^{(8)} Call $\\vec{x}$ the data used\
    \ for the test. The critical region $C$ is a set of possible values of $\\vec{x}$\
    \ such that, when $\\vec{x} \\in C$, we reject $H_0$.\n\n> ^{(9)} A type-1 error\
    \ occurs when the tests say “do not accept $H_0$” whereas the truth is $H_0$.\
    \ A type-2 error occurs when the tests say “accept $H_0$” whereas the truth is\
    \ $H_1$. The size of a test is such, that $H_0$ is true $P_0(C)$ - the worst case\
    \ having a probability of 1 error.\n\n> ^{(10)} It applies to tests where the\
    \ critical region is of the form $T(\tilde{X}) > m$ where $T(\tilde{X})$ is the\
    \ test statistic and $\\vec{x}$ is the data. The $p$-value is $T(\tilde{X}) >\
    \ T(\tilde{X})$, where $\tilde{X}$ is a hypothetical data set, generated under\
    \ the hypothesis $H_0$. We reject $H_0$ at size $\\alpha$ if $p > \\alpha$.\n\n\
