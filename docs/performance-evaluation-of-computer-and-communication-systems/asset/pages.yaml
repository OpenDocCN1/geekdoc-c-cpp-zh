  md: '# 3.4.7 Combinations of Distributions


    It is often difficult to find a distribution that fits both the tail and the body
    of the data. In such a case, one may use a combination of distributions, also
    called compound distribution.


    Given two distributions with CDFs $F_1$ and $F_2$ (resp. PDFs $f_1$ and $f_2$),
    a mixture distribution of $F_1$ and $F_2$ is a distribution with PDF


    ```

    $f(x) = pf_1(x) + (1-p)f_2(x)$

    ```


    with $p \in [0, 1]$. A mixture is interpreted by saying that a sample is drawn
    with probability $p$ from $F_1$ and with probability $1-p$ from $F_2$.


    We are more interested in a combination of mixture and truncation, i.e. in a combination
    for which the PDF has the form


    ```

    $f(x) = \alpha_1 I_{\{x\le a\}} f_1(x) + \alpha_2 I_{\{x\> a\}} f_2(x) \quad (3.21)$

    ```


    where $\alpha_1, \alpha_2 \ge 0$ and $\alpha \in \mathbb{R}$. This is useful for
    fitting a distribution separately to the tail and the body of the data set.


    Note that we do not necessarily have $\alpha_1 + \alpha_2 = 1$ in a pure mixture.
    Instead, one must have the normalizing condition


    ```

    $\alpha_1 F_1(a) + \alpha_2(1-F_2(a)) = 1 \quad (3.22)$

    ```


    thus by letting $p = \alpha_1 F_1(a)$ we may rewrite (3.21) as


    ```

    $f(x) = \frac{p}{F_1(a)} I_{\{x\le a\}} f_1(x) + \frac{1-p}{1-F_2(a)} I_{\{x\>
    a\}} f_2(x) \quad (3.23)$

    ```


    with $p \in [0, 1]$.


    Assume that the distributions $F_1, F_2$ depend on various parameters, which need
    to be fitted. Note that $p$ and $a$ need to be fitted as well. When utilizing
    MLE, one can somewhat simplify the fitting by observing that the maximum likelihood
    estimate must satisfy


    ```

    $$\hat{p} = \frac{n_1(a)}{n} \quad (3.24)$

    ```


    where $n_1(a)$ is the number of data points $\le a$.


    To see why, assume that we have a data set $x_i$ of $n$ data points, sorted in
    increasing order, so that $n_1(a) = \sum_{i=1}^n I_{\{x_i\le a\}$. The log-likelihood
    of the data is


    ```

    $$\ell = \sum_{i=1}^{n_1(a)} \ln f_1(x_i) + \sum_{i=n_1(a)+1}^n \ln f_2(x_i) +
    n_1(a)(\ln p - \ln F_1(a)) \n+ (n-n_1(a))(\ln(1-p) - \ln(1-F_2(a)))$

    ```


    and maximizing $\ell$ with respect to $p$ shows (3.24).'
