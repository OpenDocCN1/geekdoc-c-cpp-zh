  md: '# Simulation Techniques


    Once a system is classed as a stochastic recurrence, it can be simply simulated

    as a direct implementation of (6.1), for example in Matlab.


    QUESTION 6.6 Is the random waypoint model asymptotically stationary?^{(6)


    # Stochastic Recurrence Versus Discrete Event Simulation


    It is always possible to express a stochastic simulation as a stochastic recur-

    rence, as illustrated by the next example. Both representations may have very

    different memory and CPU requirements; which of the representations that is

    best depends on the problem at hand.


    # Example 6.6 Simple Server as a Stochastic Recurrence


    (Continuation of Example 6.4). Consider implementing the simple

    server in Example 6.4 as a stochastic recurrence. To simplify, assume

    that we are only interested in the mean queue length and not in the

    mean response time. This can be implemented as a stochastic recurrence-

    as follows. Let $X_n = (t_n, b_n, q_n, a_n, d_n)$ represent the state of the

    simulator just *after an arrival or a departure, $t_n$ = the simulated time

    at which this transition occurs, $b_n$ = buffer, $length$, $q_n$ = queueLengthCtr

    to the next arrival and $d_n$ = the time interval from this transi-

    to the next departure.


    Let $Z_n$ be a couple of random numbers, drawn independently of any-

    thing else, with a distribution that is uniform in (0, 1).

    The initial state is


    ```

    $t_0 = 0, b_0 = 0, q_0 = 0, a_0 = F^{-1}(u), d_0 = \infty$

    ```


    $u$ is a sample of the uniform distribution on (0, 1). The reason

    for the formula $a_0 = F^{-1}(u)$ is explained in Section 6.6: $a_0$ is a sample

    of the recurrence with CDF $F(\cdot)$.


    The recurrence is defined by $f((t, b, q, a, d), (z_1, z_2)) = (t'', b'', q'',
    a'', d'')$

    with


    ```

    if $a < d$ // this is an arrival

    $\Delta = a$

    $t'' = t + a$

    $b'' = b + 1$

    $q'' = q + b\Delta$

    $a'' = F^{-1}(z_1)$

    if $b = 0$ then $d'' = G^{-1}(z_2)$ else $d'' = d - d$

    ```


    > (6) For $v_{min} > 0$ it is asymptotically stationary. For $v_{min} = 0$ it
    is not: the model “freezes"

    (the number of waypoints per unit time tends to 0). See Chapter 7 for a justification.)'
