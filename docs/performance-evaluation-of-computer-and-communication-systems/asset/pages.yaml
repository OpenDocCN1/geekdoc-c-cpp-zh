    \ is a method that can be used to reduce the number of required runs in a Monte\
    \ Carlo simulation, when the events of interest (e.g. the failures) are rare.\
    \ The idea is to modify the distribution of the random variable to be simulated,\
    \ in a way such that the impact of the modification can be exactly compensated,\
