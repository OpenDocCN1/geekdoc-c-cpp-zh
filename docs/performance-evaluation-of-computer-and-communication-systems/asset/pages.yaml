    ```\n$\theta_{(j)} = \\frac{C}{j^{\\\\alpha}}$\n```\n\nwhere $C$ is some constant\
    \ and $\\alpha > 0$. In Zipf's original formulation, $\\alpha = 1$.\n\nWe now\
    \ show the relation to a Pareto distribution. Assume that we draw the $\theta$\
    \ at random (as we do in a load generator) by obtaining a certain random value\
    \ $X$, for object $i$, and letting $\theta_i = \\frac{N}{X_i}$. Assume that the\
    \ number of objects is large and $X_i$ marginal distribution is some fixed distribution\
    \ on $\\mathbb{R}$. with complementary distribution function $G(x)$. Let $X_{(i)}$\
    \ be the reverse order statistic, $X_{(1)} \\geq X_{(2)} \\geq \\dots$. We would\
    \ like to follow Zipf's law, i.e. for some constant $C:\n\n```\n$X_{(j)} = \\\
    frac{C}{j^{\\alpha}}$\n```\n\nLet us now consider the empirical complementary\
    \ distribution $G$, which is obtained by putting a point at each $X_i$, with probability\
    \ $\\frac{1}{N}$, where $N$ is the number of objects. More precisely:\n\n```\n\
    $\\hat{G}(x) = \\frac{1}{N} \\sum_{i=1}^{N} \\mathbb{1}_{{\\{X_{i} \\geq x\\}}$\n\
    ```\n\nThus, $G(X_{(i)}) = i/N$. Combined with (3.14) we find that whenever $x\
    \ = X_{(j)}$, we have $G(x) \\approx \\frac{K}{x^p}$, with $p=\\frac{1}{\\alpha}$\
    \ and $K=C/N$. If we take the empirical complementary CDF as an approximation\
    \ of the true true CDF, this means that the distribution of $X_i$ is Pareto with\
    \ index $p=\\frac{1}{\\alpha}$.\n\nIn other words, Zipf's law can be interpreted\
    \ as follows. The probability of choosing object $i$ is itself a random variable,\
    \ obtained by drawing from a Pareto distribution with tail index $p = \\frac{1}{\\\
    alpha}$, then re-scaling to make the sum of the probabilities 1.\n\n# 3.4.4 Hazard\
