    # 6.5.2 Holt-Winters Models


    Holt-Winters models are very simple, with few parameters. They have emerged empirically,
    but can be explained as ARIMA models with few parameters. Their interest lies
    in the simplicity of both fitting and forecasting. Holt-Winters models were originally
    introduced by Holt and Winters in [41] and [107], and later refined by Roberts
    in [89]. The presentation below follows that of the latter.


    # Exponentially Weighted Moving Average


    This was originally defined as an ad-hoc forecasting formula. The idea is to keep
    a running estimate $\hat{m}_t$ of the mean of the data, and to update it using
    the exponentially weighted moving average mechanism with parameter $\alpha$, defined


    ```

    $\hat{m}_t = (1 - \alpha)\hat{m}_{t-1} + \alpha Y_t$

    ```


    with initial condition $\hat{m}_0 = Y_1$. The point forecast is simply


    ```

    $\hat{Y}_t(\\ell) = \hat{m}_t$

    ```


    Proposition 5.7 ([89]) EWMA with parameter $\alpha$ is equivalent to modeling
    of the non-differenced time series with the ARIMA(0,1,1) model defined by


    ```

    $(1 - B)Y = (1 - (1 - \alpha)B)\epsilon$

    ```


    with $\epsilon_t \sim \text{iid} N(0, \sigma^2)$.


    A parameter can be found by fitting the ARIMA model as usual, using Theorem 5.6,
    i.e. by minimizing the one step ahead forecast error. There is no constraint on
    $\alpha$, though it is classically taken to be between 0 and 1.


    The variance $\sigma^2$ can be estimated using (5.29), which, together with Proposition
    5.6, EWMA works well only when the data has no trend or periodicity, see Figure
    5.13.


    QUESTION 5.1 What is EWMA for $\alpha = 0$? $a = 1^{(9)}$


    # Double Exponential Smoothing with Regression


    This is another simple model that can be used for data with trend but without
    season. Just as the simple EWMA, it is based on ad-hoc forecasting formulas that
    happen to correspond to ARIMA models. The idea is to keep a running estimate of
    both the mean level $\hat{m}_t$ and the trend $\hat{r}_t$. Further, a discounting


    > ^{(9)} $a=0$: a constant, equal to the initial value; $a=1$: no smoothing, $\hat{m}_t
    = Y_t$.'
