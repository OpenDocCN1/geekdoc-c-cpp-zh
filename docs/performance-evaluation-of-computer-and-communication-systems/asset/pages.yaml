  md: "# 354 Parametric Estimation, Large Sample Size\n\nFor an iid model, $X_1, \\\
    dots, l(\\theta) = \\sum l_1(x_i \\| \\theta)$ and $I(\\theta) = nI(\theta)$,\
    \ where $I_1(\\theta)$ is the Fisher information for a one-point sample $X_1$.\
    \ The Cramer-Rao Theorem states that the efficiency of any unbiased estimator\
    \ is lower bounded by $1/I(\\theta)$. Further, under the conditions in Definition\
    \ B.1, the MLE for an iid sample is asymptotically maximally efficient, i.e. $E(\\\
    left(\\||T(\\hat{X}) - \\theta\\\\|^2\\right)I(\\theta)$ tends to 1 as the sample\
    \ size goes to infinity.\n\nIn general, the parameter $\\theta$ is multi-dimensional,\
    \ i.e. it varies in an open subset $\\theta$ of $\\mathbb{R}^k$. Consequently,\
    \ $J$ and $I$ are symmetric matrices defined by\n\n```\n$[J(\\theta)]_{i,j} =\
    \ -\\frac{\\partial^2 l(\\theta)}{\\partial\\theta_i\\partial\\theta_j}$\n```\n\
    \nand\n\n```\n$I(\\theta)]_{i,j} = -E_\theta(\\frac{\\partial^2 l(\\theta)}{\\\
    partial\\theta_i\\partial\\theta_j})$\n```\n\nThe Cramer-Rao lower bound justifies\
    \ the name of \"information\". The variance of the MLE is of the order of the\
    \ Fisher information: the higher the information, the more the sample tells us\
    \ about the unknown parameter $\\theta$. The Fisher information is not the same\
    \ as entropy, used in information theory. There are some (complicated) relations\
    \ — see [30, Chapter 16].\n\nIn the next section, we give a more accurate result,\
    \ which can be used to provide approximate confidence intervals for large sample\
    \ sizes.\n\n# B.2 Asymptotic Confidence Intervals\n\nWe, need to assume some regularity\
    \ conditions. Assume that the sample comes from an iid sequence of length $n$\
    \ and further, that the following regularity conditions are met.\n\nDefinition\
    \ B.1\nThe regularity conditions for maximum likelihood asymptotics are [32]:\n\
    (1) The set of values of $\\theta$ is compact (closed and bounded) and the true\
    \ value $\\theta_0$ is not on the boundary.\n(2) (identifiability) For varying\
    \ of $\\theta$, the densities $f(\\bar{x} \\| \\theta)$ differ.\n(3) (regularity\
    \ $K$ of derivatives) There exist a neighborhood $B$ of $\\theta_0$ and a constant\
    \ $K$ such that for $\\theta \\in B$ and for all $i, j, k, n$:\n$\\frac{1}{n}E_\t\
    heta(\\frac{\\partial^3 l(\\theta)}{\\partial\\theta_i\\partial\\theta_j\\partial\\\
    theta_k}) \\leq K$\n\n(4) For $\\theta \\in B$, the Fisher information has full\
    \ rank."
  merge: -1
  pgno: 373
- img_proc: true
  md: "(5) For $\theta \\in B$, the interchanges of integration and derivation in\n\
    \n```\n$$\\int \\frac{\\partial f(\\bar{x})}{\\partial\\theta} dx = \\frac{\\\
    partial}{\\partial\\theta} \\int f(\\bar{x}|\\theta) dx$\\n$\\frac{\\partial^2\
    \ f(x|\\theta)}{\\partial\\theta_i\\partial\\theta_j} = \\frac{\\partial^2}{\\\
    partial\\theta_i\\partial\\theta_j} \\int f(\\bar{x}|\\theta) dx$$\n```\n\nare\
    \ valid.\n\nThe following theorem is proven in [32].\n\n# **Theorem B.1**\n\n\
    Under the conditions in Definition B.1, the MLE exists, converges almost surely\
    \ to the true value. Further $I(\\theta)^{1/2}(\\theta-\\thetatheta)$ converges\
    \ in distribution towards a standard normal distribution, as $n$ goes to infinity.\
    \ It follows that, asymptotically:\n\n+   (1) the distribution of $\\theta-\\\
    theta$ can be approximated by\n$N(0, I(\\theta)^{-\\1})$ or $N(0, J(\\theta)^{-\\\
    1})$\n\n+   (2) the distribution of $2(l(\\theta)-l(\\theta))$ can be approximated\
    \ by $\\chi^2_k$ (where $k$ is the dimension of $\\Theta$).\n\nThe quantity $2(l(\\\
    theta)-l(\\theta))$ is called the *likelihood ratio statistic*.\n\nIn the examples\
    \ seen in this book, the regularity conditions are always satisfied, as long as\
    \ the true value $\\theta$ lies within the interior of its domain, the derivatives\
    \ of $l(\\theta)$ are smooth (e.g. if the density $f(x|\\theta)$ has derivatives\
    \ at all orders) and the matrices $J(\\theta)$ and $I(\\theta)$ have full rank.\
    \ If the regularity conditions hold, we have an equivalent definition of Fisher\
    \ information:\n\n```\n$I(\\theta)_{i,j} = \\text{def} -E_{\\theta}\\frac{\\partial^2\
    \ l(\\theta)}{\\partial\\theta_i\\partial\\theta_j} = E_{\\theta}\\frac{\\partial\
    \ l(\\theta)}{\\partial\\theta_i}\\frac{\\partial l(\\theta)}{\\partial\\theta_j}$\n\
    ```\n\nThis follows from differentiating, with respect to $\\theta$, the identity\
    \ $\\int f(x\\theta)dx=1$.\n\nItem (2) is more approximate than item (1), but\
    \ does not require the second derivative of the likelihood to be computed.\n\n\
    Theorem B.1 also holds for non-iid cases, as long as the Fisher information goes\
    \ to infinity with the sample size.\n\n# **Example B.3** Fisher Information of\
    \ Normal iid Model\n\nAssume that $(X_i)_{i=1..n}$ is iid normal with the mean\
    \ $\\mu$ and the variance $\\sigma^2$. The observed information matrix is computed\
    \ from the likelihood function:\n\n```\n$J = \\frac{n}{\\sigma^2}\\frac{2n}{\\\
    sigma^4}(\\hat{\\mu}_n-\\mu) - \\frac{3}{\\sigma^4}(S_{xx}+n(\\hat{\\mu}_n-\\\
    mu)^2)$\n```"
