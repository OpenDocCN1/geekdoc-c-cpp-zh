    Figure 8.24 A Queuing Network model of Figure 8.23.


    The total number of customers is fixed and equal to $K$. Let $\lambda(K)$ be the
    throughput and the average waiting time at the gate. According to Little''s law


    ```

    $$\lambda(K)(W''(K) + S + Z) = K$$

    ```


    thus


    ```

    $W''(K) = \frac{K}{\lambda(K)} - S - Z$ (8.103)

    ```


    We compute $\lambda(K)$ by mean value analysis, which avoids computing the normalizing
    constants and the resulting overflow problems. Let $P(n|K)$ be the stationary
    probability that there are $n$ customers present (in service or waiting) at the
    FIFO station, when the total number of customers is $K$. The mean value analysis
    equations are (Section 8.6.5)


    ```

    $P(n|K) = P(n-1|K)\frac{\lambda(K)}{\mu^*(n)} \quad \text{if } n \geq 1$ (8.104)

    ```


    ```

    $P(0|K) = P(0|K-1)\frac{\lambda(K)}{\lambda^{[1]}(K)}$$ (8.105)

    ```


    ```

    $$\sum_{n=0}^{K} P(n|K) = 1$ (8.106)

    ```


    where $\mu^*(n)$ is the equivalent service rate of the FIFO station and $\lambda^{[1]}(K)$
    is the throughput of the complement of this station. Based on Table 8.1,


    ```

    $$\mu^*(n) = \frac{\min(n, B)}{S}$$

    ```


    The complement network is obtained by short circuiting the FIFO station; it consists
    of the IS station alone. Thus


    ```

    $$\lambda^{[1]}(K) = \frac{K}{Z}$$

    ```'
