- img_proc: true
  md: '# 214 Palm Calculus, or the Importance of the Viewpoint


    different values of the metric. Therefore, a metric definition should specify
    which clock, or viewpoint that is used, and the choice should be relevant for
    the specific issues being addressed.


    In the rest of the chapter, we formally present Palm calculus, i.e. we give a
    formal treatment of these intuitive definitions and formulas. This is a branch
    of probability that is not well known, though it is quite important for any measurement
    or simulation study, and can be presented quite simply. In essence, the Palm probability
    of an event is the conditional probability, given that some specific point process
    has a point. Making sense of this is simple in discrete time, but very complex
    in continuous time, as is often the case in the theory of stochastic processes.
    We do not dwell on formal mathematical constructions, but we do give formulas
    and exact conditions under which they apply.


    We introduce Feller''s paradox, an apparent contradiction in waiting times that
    can be explained by a difference in viewpoints. We provide useful for formulas
    such as the Rate Conversion Law and some of its consequences such as Little''s,
    Campbell''s shot noise, Neveu''s exchange and Palm''s inversion formulas. We discuss
    simulations defined as stochastic recurrences, show how this can simulations freeze
    and how to completely avoid transient (perfect simulation). Finally, we give practical
    formulas for computing Palm probabilities with Markov models observed along a
    subchain, and use these to derive the PASTA property.


    # 7.1 An Informal Introduction


    In this section, we present an intuitive treatment of event-versus-time averages
    and explain the use of event clocks. A formal treatment involving Palm calculus
    is given in Section 7.2.


    # 7.1.1 Event-versus-Time Averages


    Consider a discrete event simulation that runs for a long period of time, and
    for example, the request $T_0, T_1, \dots, T_N$ be a sequence of selected events,
    the request arrival times at an information server. Assume that we associate to
    the stream of selected events a clock that ticks at times $T_0, T_1, \dots, T_N$
    (the event clock). An event average is any performance metric that has its computed
    by sampling of the simulation state at times $T_n$, i.e. using the event clock.
    For'
