  md: '# ANNEX D


    # Digital Filters


    Here, we review all we need to know for Chapter 5 regarding causal digital filters.
    It is a very small subset of signal processing, without any Fourier transform.
    See for example [83] or [75] for a complete and traditional course.


    # D.1 Calculus of Digital Filters


    # D.1.1 Backshift Operator


    We consider data sequences of finite, but arbitrary length and call $S$ the set
    of all such sequences (i.e. $S = \bigcup_{n=1}^{\infty}\mathbb{R}^n$). We denote
    with length$(X)$ the number of elements in the sequence $X$.


    The backshift operator is the mapping $B$ from $S$ to itself defined by


    ```

    length(BX) = length(X)\n(BX)_1 = 0\n(BX)_t = X_{t-1} \quad t = 2, \dots, length(X)

    ```


    We usually view a sequence $X \in S$ as a column vector, so that we can view


    ```

    $B \begin{pmatrix} X_1 \ X_2 \ \ \ X_n \end{pmatrix} = \begin{pmatrix} 0 \ X_1
    \ \ \ X_{n-1} \end{pmatrix} \quad (D.1)$

    ```


    when length$(X) = n$.


    If we know that length$(X) \le n$, we can express the backshift operator as a
    matrix multiplication:


    ```

    $BX = B_n X \quad (D.2)$

    ```'
