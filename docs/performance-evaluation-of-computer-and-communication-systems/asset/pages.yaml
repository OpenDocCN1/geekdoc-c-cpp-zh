    # 6.2.2 Stochastic Recurrence


    This is another simulation method; it is usually a much more efficient than discrete
    event simulation, but requires more work on the model. A stochastic recurrence
    is a recurrence of the form


    ```

    X_0 = x_0

    X_{n+1} = f(X_n, Z_n)  (6.1)

    ```


    where X_n is the state of the system at the nth transition (X_n is in some arbitrary
    state space X), x_0 is a fixed, given state in X, Z_n is some stochastic process
    that can be simulated (e.g. a sequence of iid random variables, or a Markov chain),
    and f is a deterministic mapping. The simulated time T_n at which the nth transition
    occurs is assumed to be included in the state variable X_n.


    # Example 6.5 Random Waypoint


    The random waypoint is a model for a mobile point, and can be used to simulate
    the mobility pattern in Example 6.1. It is defined as follows. The state variable
    X_n = (M_n, T_n) where M_n is the position of the mobile at the nth transition
    (the nth ''waypoint'') and T_n is the time at which this destination is reached.
    The point M_n is chosen at random, uniformly in a convex area A. The speed at
    which the mobile travels to the next waypoint is also chosen at random uniformly
    in [v_min, v_max].


    The random waypoint model can be cast as a stochastic recurrence by letting Z_n
    = (M_{n+1}, V_{n+1}), where M_{n+1}, V_{n+1} are independent iid sequences, such
    that M_{n+1} is uniformly distributed in A and V_{n+1} in [v_min, v_max]. We have
    the stochastic recurrence


    ```

    X_{n+1} := (M_{n+1}, T_{n+1}) = (M_{n+1}, T_n + ||M_{n+1} - M_n||/V_n)

    ```


    > (3) Update Event-Based Counters.

    (2) Execute Event''s Actions.

    (3) Schedule Follow-Up Events.

    (4) It depends on the parameters. Let a (resp. b) be the mean of F(.) (resp. G(:)).
    The utilization factor of the queue is ρ = ρ/a. If ρ < 1 the system is stable
    and thus asymptotically stationary, else not (see Chapter 8).

    (5) Mean queue length: time-based. Mean response time: event-based.'
