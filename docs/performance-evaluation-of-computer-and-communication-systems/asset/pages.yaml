    The load intensity is determined by the number of user equivalents (UEs), each
    implemented as an independent thread of execution, on one or several machines
    the nature of the load is defined by a set of constraints on the arrival process,
    the distribution of request sizes and the correlation of successive requests to
    the same object, as described below. The parameters of the distributions were
