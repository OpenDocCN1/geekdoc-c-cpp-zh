  md: 'theorem claims that making a prediction for X is equivalent to making a prediction
    for Y. It is a direct consequence of Lemma D.1.


    Theorem D.2 (Conditional Distribution of Futures)

    Assume that $(y_1, \dots, y_t)^T = F(x_1, \dots, x_t)^T$ and let $\ell \ge 1$.

    Assume that $(X_{t+1}, \dots, X_{t+\ell})^T$ is a random sample drawn from the
    conditional distribution of $(X_{t+1}, \dots, X_{t+\ell})$ given that $X_1 = x_1,
    \dots, X_t = x_t$.

    Let


    $(y_1, \dots, y_t, y_{t+1}, \dots, y_{t+\ell})^T = F(x_1, \dots, x_t, x_{t+1},
    \dots, x_{t+\ell})^T$


    Then $(Y_{t+1}, \dots, Y_{t+\ell})$ is distributed according to the conditional
    distribution of $(Y_{t+1}, \dots, Y_{t+\ell})$ given that $Y_1 = y_1, \dots, Y_t
    = y_t$.


    We can derive explicit formulas for point predictions.


    # Corollary D.1 (Point Prediction) Define the $\ell$-point-ahead predictions by


    $\hat{X}_t(\ell) = E(X_{t+\ell} \mid X_1 = x_1, \dots, X_t = x_t)\n$\hat{Y}_t(\ell)
    = E(Y_{t+\ell} \mid Y_1 = y_1, \dots, Y_t = y_t)$


    then


    $(y_1, \dots, \hat{Y}_t(1), \dots, \hat{Y}_t(\ell))^T = F(x_1, \dots, x_t, \hat{X}_t(1),
    \dots, \hat{X}_t(\ell))^T$ (D.30)


    In particular,


    $\hat{Y}_t(\ell) = h_0\hat{X}_t(\ell) + h_1\hat{X}_t(\ell-1) + \dots + h_{\ell-1}\hat{X}_t(1)
    + h_{\ell}x_t + \dots + h_{2\ell-1}x_1$$ (D.31)


    and


    $\hat{Y}_t(\ell) = c_0\hat{X}_t(\ell) + c_1\hat{Y}_t(\ell-1) + \dots + c_{\ell-1}\hat{Y}_t(1)
    + c_{\ell}y_t + \dots + c_{2\ell-1}y_1$ (D.32)


    In the frequent case where $X_t$ is assumed to be ideal, we can deduce explicit
    results for the point prediction and mean square prediction errors:


    # Corollary D.2 Also assume that $X_t$ is iid with mean $\mu = E(X_t)$ and variance
    $\sigma^2 = Var(X_t)$. Then


    (1) (Point predictions)


    $(y_1, \dots, y_t, \hat{Y}_t(1), \dots, \hat{Y}_t(\ell))^T = F(x_1, \dots, x_t,
    \mu, \dots, \mu)^T$ (D.33)


    In particular,


    $\hat{Y}_t(\ell) = (h_0 + h_1 + \dots + h_{\ell-1})\mu + h_{\ell-1}x_t + \dots
    + h_{2\ell-1}x_1$ (D.34)


    and


    $\hat{Y}_t(\ell) = c_0\mu + c_1\hat{Y}_t(\ell-1) + \dots + c_{\ell-1}\hat{Y}_t(1)
    + c_{\ell}y_t + \dots + c_{2\ell-1}y_1$ (D.35)'
