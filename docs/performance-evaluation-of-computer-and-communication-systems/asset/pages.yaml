  md: "# Definitions for Queuing Networks\n\nNote the stationary probability in (8.30)\
    \ depends only on the traffic density $\rho_c = S\theta_c$, and not on the distribution\
    \ of service times. This is the insensitivity property; it applies only to Whittle\
    \ networks, but more generally to all service stations of category 1, hence the\
    \ name.\n\n# Category 2: MSCCC Station\n\nThis second category of stations contains,\
    \ as a special case, the FIFO stations with one or any fixed number of servers.\
    \ It is called Multiple Server with Concurrent Classes of Customers in reference\
    \ to [26], [53] and [11]. A slightly more general than presented here can be found\
    \ in [2].\n\nThe service requirement for all classes at this station (but the\
    \ parameter may be different at different stations) must be exponentially distributed\
    \ with the parameter If we relax this assumption, this station is no longer admissible\
    \ for multi-class product forming queuing networks. Thus, unlike category 1, this\
    \ station type is sensitive to the distribution of service requirements.\n\nThe\
    \ service discipline is as follows. There are $B$ servers and $G$ token pools.\
    \ Every class is associated with exactly one token pool, but there can be several\
    \ classes associated with the same token pool. The size of token pool $g$ is an\
    \ integer $T_g \\ge 1$.\n\n> A customer is “service” when one of the $B$ servers\
    \ becomes available and there is a free token in the pool $g$ to which this customer's\
    \ class is associated. There is a single queue in which customers are queued in\
    \ order of arrival; when a server becomes idle, the first eligible customer in\
    \ the queue, or to arrive, starts service, and both one server and one token of\
    \ the corresponding pool. The parameters such as $G$, B and the mapping $G$ of\
    \ classes to token pools may differ at every station.\n\nThe FIFO queue with $B$\
    \ servers is a special case with $G=1$ token pool, and $T_1 = B$.\n\nIn addition,\
    \ this station may have a variable service rate that depends on the total number\
    \ of customers in the station. The rate must be the same for all classes (rates\
    \ that depend on the population vector are not allowed, unlike for category 1\
    \ stations).\n\n# Example 8.6 A Dual-Core Machine\n\nFigure 8.11 illustrates a\
    \ simple model of a dual-core processor. Classes 1, 2 or 3 internal jobs and class\
    \ 4 internal jobs. All jobs use the dual-core processor, represented by station\
    \ 1. External jobs cycle through the system more than once. Internal jobs undergo\
    \ a random delay and a variable delay due to communication.\n\nThe processor can\
    \ serve up to 2 jobs in parallel, but some jobs require exclusive access to a\
    \ critical section and cannot be served together. This is represented by an MSCCC\
    \ with 2 servers and 2 token pools, sizes of 1 and 2. Jobs requiring access to\
    \ the critical section use the token of the first pool; other jobs use tokens\
    \ of the second pool (the second pool has no effect since its size is as large\
    \ as the number of servers, but it is required to fit in the general framework\
    \ of multi-class product forming queuing networks)."
