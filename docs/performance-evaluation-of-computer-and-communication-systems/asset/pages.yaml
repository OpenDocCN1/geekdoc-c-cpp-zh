  md: '# Methodology


    Perhaps the most difficult part when carrying out a performance evaluation is
    knowing where to start. In this chapter, we propose a methodology, i.e. a set
    of recommendations, that is valid for any performance evaluation study. We stress
    the importance of factors, in particular hidden ones, and the need to use the
    scientific method. We also discuss a few frequent performance patterns, as a means
    of quickly focusing on important issues.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_20_0.png)


    # 1.1 What is Performance Evaluation?


    In the context of this book, performance evaluation involves quantifying the service
    delivered by a computer or a communication system. For example, we might be interested
    in: comparing the power consumption of several server farm configurations; knowing
    the response time experienced by a customer performing a reservation over the
    Internet; comparing compilers for a multiprocessor machine.


    In all cases it is important to carefully define the load and the metric, and
    to be aware of the performance evaluation goals.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Methodology


    # 1.1.1 Load


    An important feature of computer or communication systems is that their performance
    depends dramatically on the workload (or simply load) that they are subjected
    to. The load characterizes the quantity and the nature of requests submitted to
    the system. Consider for instance the problem of quantifying the performance of
    a web server. We could characterize the load by a simple concept such as the number
    of requests per second. This is called the intensity of the workload. In general,
    the performance deteriorates when the intensity increases, but this deterioration
    is often sudden. The reason for this is the non-linearity of queuing systems -
    a performance pattern example that is discussed in Section 1.5 and Chapter 8.


    The performance of a system depends not only on the intensity of the workload,
    but also on its nature. On a web server, for example, all requests are not equivalent:
    some web server softwares perform well with get requests for frequently used objects,
    and well less with requests that require database access. For other web servers,
    things might be different. This issue is addressed by using standardized mixes
    of web server requests. These are generated by a benchmark, defined as a load
    generation process that intends to mimic a typical user behavior. Chapter 3 presents
    a study of how such a benchmark can be constructed.


    # 1.1.2 Metric


    A performance metric is a measurable quantity that precisely captures what we
    want to measure it can take on many forms. There is no general definition of a
    performance metric: it is system dependent, and its definition requires a good
    understanding of the system and its users. We will mention examples where the
    metric corresponds to throughput (the number of tasks completed per unit), power
    consumption (the integral of the electrical energy consumed by the system, per
    time unit), or response time (i.e. the time elapsed between a start and an end
    event). For each performance metric, we may be interested in the average, 95-percentile,
    worst-case, etc., as explained in Chapter 2.


    # Example 1.1 Windows versus Linux


    Chen and co-authors compare Windows to Linux in [25]. As metric, they use the
    CPU cycles, the number of instructions, the number of data read/write operations
    required by a typical job. The load was generated by various benchmarks: "syscall"
    generates elementary operations (system calls); "memory read" generates references
    to an array; an application benchmark runs a popular application.


    It is also important to be aware of the experimental conditions under which the
    metric is measured, as illustrated by the following example.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What is Performance Evaluation?


    # Example 1.2 Power Consumption


    The electrical power consumed by a computer or telecom equipment depends on how
    efficiently the equipment can take advantage of activity periods to save energy.
    One operator proposes the following metric as a measure of power consumption [29]:


    $P_{total} = 0.35 P_{max} + 0.4 P_{50} + 0.25 P_{sleep}$


    where $P_{total}$ is the power consumption when the equipment is running at full
    load, $P_{50}$ is when it is submitted to a load equal to 50% of its capacity
    and $P_{sleep}$ is when it is. The example uses weights (0.35, 0.4 and 0.25) that
    reflect our assumption of the proportion of time during which a given load typically
    occurs (for example, the full load condition is assumed to occur during 35% of
    the time).


    In this example, *utilization* is a parameter of the operating conditions. The
    utilization of a resource is defined as the proportion of time during which the
    resource is busy. The example also illustrates that it may be important to define
    which *sampling method* is used, i.e. when the measurements are taken. This is
    an integral part of the definition of the metric and we discuss this more detail
    in Chapter 7.


    A metric may be simple, i.e. expressed by a single number (e.g. the power consumption),
    or *multi-dimensional*, i.e. represented by a vector of numbers (e.g. power consumption,
    response time and throughput). When comparing two vectors of multi-dimensional
    metric values, one should compare the corresponding components (e.g. the power
    consumption of A versus the power consumption of B, the response time of A versus
    the response time of B, etc.). As such, it is possible that neither of the two
    vectors is better than the other. We say that the comparison of vectors is a *partial
    order*, as opposed to the comparison of numbers, which is a *complete order*.
    However it is useful to determine whether a vector is *non-dominated*, i.e. that
    no other vector (in the set of available results) is better. In a finite set of
    performance results expressed with a multi-dimensional metric, there is usually
    more than one non-dominated result. When comparing several configurations, only
    the non-dominated ones are of interest.


    # Example 1.3 Multi-dimensional Metric and Kiviat Diagram


    We measure the performance of a web server submitted to the load of a standard
    workbench. We compare 5 configurations, and obtain the results below.


    | Config | Pwer [W] | Response [ms] | Throughput [ps] |

    |---|---|---|--|

    | A | 23.5 | 3.78 | 42.2 |

    | B | 40.8 | 5.30 | 29.1 |

    | C | 92.7 | 4.03 | 22.6 |

    | D | 53.1 | 2.19 | 73.1 |

    | E | 54.7 | 5.92 | 24.3 |'
  merge: -1
