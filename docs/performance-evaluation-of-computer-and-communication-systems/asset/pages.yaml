    \ matrices $H$ and $K$ (with appropriate dimensions such that the matrices products\
    \ are valid)\n\n```\n$E(H\tilde{X}K) = HE(\tilde{X})K \\quad (C.4)$\n```\n\nFurther,\
    \ if $E(\\tilde{X}_i^2) < \\infty$ for each $i=1, \\dots, n$, the *covariance\
    \ matrix* of $X$ is defined by\n\n```\n$\\Omega = E((\tilde{X}-\\mu)(\tilde{X}-\\\
    mu)^T) \\quad (C.5)$\n```\n\nwith $\\mu = E(\\tilde{X})$. This is equivalent to\n\
    \n```\n$\\Omega_{i,j} = \\text{cov}(X_i, X_j) \\overset{\\text{def}}{=} E((X_i-E(X_i))(X_j-E(X_j)))\
    \ \\quad (C.6)$\n```\n\nfor all $i, j \\in \\{1, \\dots, n\\}$.\n\nFurther, for\
    \ any $\\tilde{u}, \\tilde{v} \\in \\mathbb{R}^n$\n\n```\n$E((\\tilde{u}^T(\\\
    tilde{X}-\\mu))(\\tilde{v}^T(\\tilde{X}-\\mu))) = \\tilde{u}^T\\Omega\\tilde{v}\
    \ \\quad (C.7)$\n```\n\nAlso\n\n```\n$\\Omega_{i,i} = \\text{var}(X_i) \\quad\
    \ (C.8)$\n```\n\nIf $\tilde{X}$ and $\\tilde{Y}$ are random vectors in $\\mathbb{R}^n$\
    \ with well defined covariance matrices, the *cross covariance matrix* of $\\\
