    # Point Predictions for an AR(p) Mean Process


    The formulae have simple closed forms when there is no differing or de-seasonalizing
    and the ARMA process is AR(p) with 0 mean. In such a case, $Y_t = X_t$ and (5.34)
    becomes (with the usual convention $y_s = 0$):


    ```

    $$\hat{Y}_t(\ell) = \sum_{j=1}^{\ell-1} A_j \hat{Y}_t(\ell - j) - \sum_{j=\ell}^{p}
    A_j y_{t-j+\ell} \quad \text{for } 1 \le \ell \le p$

    ```


    ```

    $$\hat{Y}_t(\ell) = \sum_{j=\ell}^{p} A_j y_{t-j+\ell} \quad \text{for } \ell
    > p$

    ```


    where $A_1, A_2, ... , A_p$ are the auto-regressive coefficients as in (5.21).
    As a result of this simplicity, AR processes are often used, e.g. when real time
    predictions are required.


    # Example 5.6 Internet Traffic, continued


    The differenced data in Figure 5.10 appears to be stationary and decaying ACF.
    We model it as a 0 mean ARMA(p,q) process with $p, q \le 20$ and fit the models
    to the data. The resulting models have small coefficients $A_m$ and $C_m$, except
    for $m$ close to 0 or over 16. We re-fit the model by forcing the parameters such
    that


    ```

    $A = (1, A_1, ... , A_p, 0, ... , 0, A_{16}, ... , A_{16+p})$\nC = (1, C_1, ...
    , C_p, 0, ... , 0, C_{16}, ... , C_{16+q})$

