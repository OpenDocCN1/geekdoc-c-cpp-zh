  md: "# Classical Results for a Single Queue\n\nQUESTION 8.5 Give an example of a\
    \ stable and an unstable single server queue\n$\\rho = 1^{(6)}$\n\n**M/G/1 Queue**\n\
    The arrival process is Poisson with parameter $\\lambda$. Moreover, the service\
    \ times are\ndependendent of each other and of the arrival process, with a general\
    \ distribution.\nFor $\rho < 1$ the queue is stable and for $\rho \\geq 1$ it\
    \ is unstable. Using the rate\nconservation law as in waiting time (Pollaczek-Khinchine\
    \ formula for transforms):\n\n```\n$L_W(s) = \\frac{s(1-\\rho)}{\\lambda + L_N(s)}}\
    \ \\quad (8.5)$\n```\n\nwhere $L_S$ is the Laplace-Stieltjes transform of the\
    \ service time. Note that, by\nPASTA, the waiting time has the same distribution\
    \ as the workload sampled\nat an arbitrary point in time.\n\nQUESTION 8.6 Give\
    \ the Laplace-Stieltjes transform $L_R$ of the response time.$^{(7)}$\nThe distribution\
    \ of the number of customers $N(t)$, at an arbitrary point\nin time, is obtained\
    \ by first computing the distribution of the number of cus-\ntomers seen at a\
    \ departure time, and using DSSA [46, 5.6]. The\ndistribution is known via its\
    \ $z$-transform^{(8)}$\n\n```\n$G_N(z) = (1-\\rho)(1-z)\\frac{L_S(\\lambda-\\\
    lambda z)}{L_S(\\lambda-\\lambda z)} \\quad (8.6)$\n```\n\n(This formula is also\
    \ called a Pollaczek-Khinchine formula for transforms.\nThe mean values of number\
    \ of customers in the system or in the waiting room\nas well as the mean response\
    \ times and waiting times are easily derived and\ngiven below.\n\n```\n$$\\begin{aligned}\
    \ \\tilde{N} &= \\frac{\\rho^2\\kappa}{1-\\rho} + \\rho \\quad \\text{with} \\\
    \ \\kappa = \\frac{1}{2}(1+\\frac{\\sigma_S^2}{S^2}) - \\frac{1}{2}(1+CoV_S) \\\
    \ \\tilde{N}_w &= \\frac{\\rho S(1-\\rho(1-\\kappa))}{1-\\rho} \\ \\tilde{R} &=\
    \ \\frac{\\rho}{1-\\rho} \\ \\tilde{W} &= \\frac{\\rho S_K}{1-\\rho} \\end{aligned}\
    \ \\quad (8.7)$\n```\n\nNote the importance of the coefficient of variation (CoV)\
    \ of the service time.\n\nQUESTION 8.7 Which of the quantities $\tilde{N}, \\\
    tilde{N}_w, \\tilde{R}, \\tilde{W}$ are Palm expect-\ntions^{(9)}$\n\n> (6)The\
    \ example in Question 8.4 is stable with $\\rho=1$. The M/M/1 queue with $\\rho=1$\
    \ is\nunstable.\n(7)The response time is the sum of the service time and the waiting\
    \ time, and they are\nindependent. Thus, $L_R(s)=L_S(s)L_W(s)$.\n(8)The $z$-transform,\
    \ $G_N(z)$ of an integer random variable $N$, is defined by $G_N(z)=\nE(z^N)$.\n\
    (9) $R, W$."
