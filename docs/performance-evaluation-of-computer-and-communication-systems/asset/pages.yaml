  md: "# # Parametric Estimation,\nLarge Sample Theory\n\n# ## B.1 Parametric Estimation\
    \ Theory\n\nIn this appendix, we give a large sample theory that is used for some\
    \ asymptotic confidence interval computations in Chapter 2 and for the general\
    \ framework of likelihood ratio tests in Chapter 4.\n\n# ### B.1.1 The Parametric\
    \ Estimation Framework\n\nConsider a data set $x_i, i = 1, \\dots, n$, which we\
    \ view as the realization of a stochastic system (in other words, the output of\
    \ a simulator). The framework of parametric estimation theory consists in assuming\
    \ that the parameters of the stochastic system are well-defined, but unknown to\
    \ the observer, who tries to estimate the system as well as possible, using the\
    \ data set.\n\nWe assume that the model has a density of probability, denoted\
    \ $f(x_1, \\dots, x_n \\mid \\theta)$, where $\theta$ is the parameter. It is\
    \ also called the *likelihood* of the observed data. An *estimator* of $\\theta$\
    \ is any function $T(\\cdot)$ of the observed data. A good estimator is one such\
    \ that, in average, $T(x_1, \\dots, x_n)$ is “close” to the true value $\theta$.\n\
    \n# #### Example B.1 iid Normal Data\n\nAssume that we can believe that our data\
    \ is iid and normal with the mean $\\mu$ and variance $\\sigma^2$. The likelihood\
    \ is\n\n```\n$$\\frac{1}{(\\sqrt{2\\pi}\\sigma)^n} \\exp\\left(-\\frac{1}{2}\\\
    sum_{i=1}^n\\frac{(x_i-\\\\mu)^2}{\\sigma^2}\\right) \\quad (B.1)$\n```\n\nand\
    \ $\\theta = (\\mu, \\sigma)$. An estimator of $\\theta$ is $\\theta = (\\hat{\\\
    mu}_n, \\hat{\\sigma}_n)$ given by Theorem 2.3. Another, slightly different estimator\
    \ is $\\theta_1 = (\\hat{\\mu}_n, s_n)$ given by Theorem 2.2."
