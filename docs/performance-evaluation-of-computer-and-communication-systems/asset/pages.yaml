  md: "# Definitions for Queuing Networks\n\nAssume that processing times and inter-arrival\
    \ times can be modeled as independent id exponential sequences. Thus, the first\
    \ (resp. second) case is modeled as one M/M/2 queue (resp. a collection of two\
