    In practice, the main reasons for non asymptotic stationarity are the following.


    +   (1) **Unstable models**: In a queuing system where the input rate is larger
    than the service capacity, the buffer occupancy grows unbounded. The longer the
    simulation is, the larger is the mean queue.

