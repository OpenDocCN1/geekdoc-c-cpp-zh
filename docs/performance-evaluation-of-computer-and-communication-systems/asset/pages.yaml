  md: '# D.1.6 AR($\infty$) Representation of Invertible Filter


    Let $F$ be an invertible filter and $Y=FX$. Let $g_0, g_1, \dots$ be the impulse
    response of $F^{-1}$. We have $X=F^{-1}Y$ for $t \ge 1$


    ```

    $X_t = g_0Y_t + g_1Y_{t-1} + \dots + g_{t-1}Y_1 \quad (1.14)$

    ```


    Note that $g_0 = \frac{1}{h_0}$, thus


    ```

    $Y_t = c_0X_t + c_1X_{t-1} + \dots + c_{t-1}X_1 \quad (1.15)$

    ```


    with


    ```

    $$\begin{aligned} c_0 &= h_0 \ c_m &= \frac{g_m}{g_0} = -g_mh_0 \quad \text{for
    } m=1, 2, \dots \end{aligned} \quad (1.16)$

    ```


    The sequence $c_0, c_1, c_2, \dots$ used in (D.15) is the AR($\infty$)$^{(1)}$
    representation of $F$. It can be used to compute the output $Y_t$ as a function
    of the past output and the current input $X_t$. This applies to any invertible
    filter.


    If $F^{-1}$ is FIR, then there exists a certain $q$ such that $c_m=0$ for $m \ge
    q$. The filter $F$ is called **auto-regressive** of order $q$: AR($$q$).


    # D.1.7 Calculus of Filters


    When the filter $F''$ is invertible, the composition $F(F''^{-1})$ is also denoted
    $\frac{F}{F''}$. There is no ambiguity if composition is commutative, namely


    ```

    $$\frac{F}{F''} = F(F''^{-1}) = (F''^{-1})F \quad (1.17)$

    ```


    We have defined the product and division of filters. It is straightforward to
    see that the addition and subtraction of filters are also filters. For example,
    the filter $F+F''$ has the impulse response $h_m+h''_m$ and the filter $-F$ has
    the impulse response $-h_m$.


    It is customary to denote the identity filter with 1. With this convention, we
    can write the differing filters as


    ```

    $$\Delta_s = 1 - B^s \quad (1.18)$

    ```


    and the de-seasonalizing filter as


    ```

    $R_s = 1 + B + \dots + B^s \quad (1.19)$

    ```


    We can also rewrite (D.13) as


    ```

    $$\frac{1}{\sum_{n=0}^{\infty} B^n} = 1 - B$

    ```'
