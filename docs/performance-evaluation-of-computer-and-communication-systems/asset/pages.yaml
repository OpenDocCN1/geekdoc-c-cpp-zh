    if there is a customer at position $i$, and 0 otherwise. Note that any positive
    function may be taken as a Whittle function; the converse is, i.e. any rate allocation
    algorithm does not necessarily derive from a Whittle function.


    One frequently considers the case


    ```

    $$\Psi(B) = \Phi(\vec{n})$ $$ (8.27)$

    ```


    where $\vec{n} = (n_1, \dots, n_C)$ with $n_c$ the number of class-c customers
    in $B$, and $\Phi(c)$ is an arbitrary positive function defined on $\mathbb{N}^C$.
    In other words, the Whittle function in such cases depends on the state of the
    station only through the numbers of customers (not their position in the buffer).
    The function $\Phi$ is called the *balance function*: the quantity $\frac{\gamma(i,
    B)}{\Phi(i)}$ is the rate allocated to class $c$. With the Whittle function, any
    positive $\Phi$ may be taken as a balance function, but the converse is not true.
    In other words, any rate allocation does not necessarily derive from a balance
    function.


