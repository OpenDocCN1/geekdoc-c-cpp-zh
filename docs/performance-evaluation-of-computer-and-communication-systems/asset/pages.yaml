  md: 'We compute the likelihood ratio statistic. The parameter is $\theta = \vec{p}$.

    Under $H_0$, there is only one possible value so $\theta_0 = q$. From (4.7), the
    likelihood

    is is


    ```

    $L_k(\tilde{p}) = C + \sum_{i=1}^k n_i \ln(p_i)$

    ```


    where $n_i = \sum_{i=1}^k \{B_i\}(x_k)$ and $C = n\ln(n!) - \sum_{i=1}^k n_i \ln(n_i!)$.
    $C$ is a constant

    and can be ignored from here. To find $\theta$, we have to maximize (4.8). subject

    to the constraint $\sum_{i=1}^k p_i = 1$. The function to maximize is in $p_i$,
    so

    we use the Lagrangian technique. The Lagrangian is


    ```

    $L(\tilde{p}, \lambda) = \sum_{i=1}^k n_i \ln(p_i) + \lambda (1 - \sum_{i=1}^k
    p_i)$

    ```


    The equations $\frac{\partial L}{\partial p_i} = 0$ give $n_i = \lambda p_i$.
    Consider the first case $n_i \neq 0$ for all $i$.

    We find $\lambda$ by the constraint $\sum_{i=1}^k p_i = 1$, which gives $\lambda
    = n$ and thus $\hat{p}_i = \frac{n_i}{n}$.

    Finally, the likelihood ratio is


    ```

    $L(H_1) - L(H_0) = \sum_{i=1}^k n_i \ln \frac{n_i}{q_i}$

    ```


    In the case where $n_i = 0$ for some $i$, the formula is the same if we adopt
    the

    convention in that, the term $n_i \ln \frac{n_i}{q_i}$ is replaced by $0$ whenever
    $n_i = 0$.

    We compute the $p$-value, which is equal to


    ```

    $$\mathbb{P} (\sum_{i=1}^k N_i \ln \frac{N_i}{q_i} > \sum_{i=1}^k n_i \ln \frac{n_i}{q_i})$

    ```


    where $\vec{N}$ has the multinomial distribution $M_{n,\vec{q}}$.

    For large $n$, Section 4.4 provides a simple approximation for the $p$-value.

    n$n$ is not large, there is no known closed form, but we can use the Monte

