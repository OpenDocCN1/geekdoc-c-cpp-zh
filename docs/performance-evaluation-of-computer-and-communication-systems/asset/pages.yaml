    Theorem 2.2

    Let $X_1,...,X_n$ be $n$ iid random variables, the common distribution which is
    assumed to have a well-defined mean $\mu$ and a variance $\sigma^2$. Let $\hat{\mu}_n$
    and $s_n^2$ be


