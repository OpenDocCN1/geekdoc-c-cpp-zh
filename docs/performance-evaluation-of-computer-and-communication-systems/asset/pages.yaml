    by reverse-transforming a confidence interval for the mean of the transformed
    data, we obtain a confidence interval for another type of mean (harmonic, etc.).
    More precisely, assume that we transform a data set $x_1, \dots, x_n$ by an inverse-ible
    (strictly monotonic) mapping $b(\cdot)$ to $y_1, \dots, y_n$; $y_i = b(x_i)$ and
    $x_i = b^{-1}(y_i)$ for $i=1, \dots, n$. We designated *transformed sample mean*
    the quantity $b^{-1}(\frac{1}{n}\sum_{i=1}^n y_i)$, the back-transform of the
    mean of the transformed data. Similarly, the *transformed distribution mean* of
    the distribution of a random variable $X$ is $b^{-1}(E(b(X)))$. When $b(\cdot)$
    is a Box-Cox transformation with index $s=-1,0$ or 2, we obtain the classical
    following definitions, valid for a positive data set $x_i=1, \dots, n$ or a positive
    random variable $X$:


    | Transformation | Transformed Sample Mean | Transformed Distribution Mean |

    | --- | --- | --- |

    | Harmonic | $b(x)=\frac{1}{x}$ | $\frac{1}{n}\sum_{i=1}^n\frac{1}{x_i}$ | $E(\frac{1}{X})$
    |

    | Geometric | $b(x)=\ln(x)$ | $\prod_{i=1}^n x_i^{1/n}$ | $e^{E(\ln X)}$ |

    | Quadratic | $b(x)=x^2$ | $\frac{1}{n}\sum_{i=1}^n x_i^2$ | $\sqrt{E(X^2)}$ |


    > **Theorem 2.7**

    A confidence interval for a transformed mean is obtained by the inverse transformation
    of a confidence interval for the mean of the transformed data.


    For example, a confidence interval for the geometric mean is the exponential of
    a confidence interval for the mean of the logarithms of the data.


    # 2.5 Which Summarization to use?


    The previous sections have presented various summarization methods. In this section,
    we discuss the use of these different methods. The methods differ in their objectives:
    *confidence intervals* for central value versus *prediction intervals*. The former
    quantify the accuracy of the estimated central value, the latter reflect reflect
    how variable the data is. Both aspects are related (the more variable the data
    is, the less accurate is the estimated central value) but they are not the same.'
