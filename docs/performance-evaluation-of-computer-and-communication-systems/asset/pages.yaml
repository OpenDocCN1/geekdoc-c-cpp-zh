    # 2.5.2 Compactness


    Assume we wish to obtain both a central value with confidence interval and a prediction
    interval for a given data set. If we use methods based on order statistics, we
    will obtain a confidence interval for the mean, and, say, a prediction interval
    at the level 95%. Variability and accuracy are given by different sample quantiles,
    and cannot be deduced from one another. Furthermore, if we are interested in 99%
    prediction intervals rather than 95%, we need to recompute new estimates of the
    quantiles. The same argument speaks in favor of quantifying the variability by
    means of the Lorenz curve.


    In contrast, if we employ methods based on mean and standard deviation, we obtain
    both confidence intervals and prediction intervals at any level with just 2 parameters
    (the sample mean and the sample standard deviation). In particular, the sample
    standard deviation gives an indication of both the accuracy of the estimator and
    the variability of the data. However, as we saw earlier, these estimators are
    meaningful only at a scale where the data is roughly normal.


    Also, the mean and the standard deviation are less complex to compute than estimators
    based on order statistics, which require sorting of the data. In particular, the
    mean and the standard deviation can be computed online, by keeping only 2 counters
    (sum of values and sum of squares). This reason is less valid today to some years
    ago, since there are sorting algorithms with complexity $n \ln(n)$.


