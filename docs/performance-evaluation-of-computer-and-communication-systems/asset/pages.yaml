  md: '# What is a Simulation?


    # Deterministic / Stochastic


    A deterministic simulation has no random components. It is employed when we want
    to verify a system where the environment is entirely known, maybe to determine
    the feasibility of a schedule, or to test the feasibility of an implementation.
    In most cases however, this is not sufficient. The environment of the system is
    better modeled with a random component, causing the output of the simulation to
    also be random.


    # Terminating / Non-terminating


    A terminating simulation ends when specific conditions occurs. For example, if
    we wish to evaluate the execution time of one sequence of operations in a well
    defined environment, we can run the sequence in the simulator and count the simulated
    time. A terminating simulation is typically used when


    +   - we are interested in the lifetime of a certain system

    - or when the inputs are time-dependent


    # Example 6.2 Joe''s Computer Shop


    We are interested in evaluating the time it takes to serve $n$ customers who request
    a file together at time 0. We run a simulation program that terminates at $T_1$
    when all users have had their request satisfied. This is a terminating simulation;
    its output is the time $T_1$.


    # Asymptotically Stationary / Non-stationarity


    This applies only to a non-terminating, stochastic simulation. Stationarity is
    a property of the stochastic model being simulated. For an in-depth discussion
    of stationarity, see Chapter 7.


    Very often, the state of the simulation depends on the *initial conditions* and
    for instance, if you simulate an information server and start with empty buffers,
    you are probably too optimistic, since a real server system that has been running
    for some time has many data structures that are not empty. Stationarity is a solution
    to the problem: if the simulator has a unique stationary regime, its distribution
    of state becomes independent of the initial condition.


    A stationary simulation is such that you gain no information of its age by analyzing
    it. For example, if you run a simulation and take a snapshot of the state of the
    system at times 10 and 10,000 seconds, there is no way to tell which of the two
    snapshots is at which.


    In practice, a non-terminating simulation is rarely exactly stationary, but can
    be *asymptotically stationary*. This means that the simulation becomes stationary
    after some simulated time.


    More precisely, a simulation program with time independent inputs can always be
    thought of as the simulation of a Markov chain. A Markov chain is a generic stochastic
    process such that, in order to simulate the future after time $t$, the only information
    required is the state of the system at time $t$.'
