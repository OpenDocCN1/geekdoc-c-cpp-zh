  md: '# The standard Pareto distribution with index $p > 0$ has CDF and PDF


    ```

    $F(x) = \left(1 - \frac{1}{x^p}\right)1_{\{x>0\}}\nf(x) = \frac{p}{x^{p+1}}1_{\{x\ge1\}}$

    ```


    i. the complementary CDF and the PDF follow a power law for $x \ge 1$ (see Table
    3.2). The general Pareto distribution is derived by a change of scale and has
    CDF $(1 - \frac{s}{x^p})1_{\{x\ge s\}}$ and PDF $\frac{ps}{x^{p+1}}1_{\{x\ge s\}}$
    for some $s>0$.


    For $p \le 2$, the Pareto distribution has infinite variance and for $p < 1$ it
    has an infinite mean. The Kurtosis index is not defined unless $p > 4$ and tends
    towards $\infty$ when $p \to 4$: its tail is called "heavy",see Section 3.5).
    Figure 3.11 shows the CDF of a Pareto distribution together with normal and log-normal
    distributions. The Zeta distribution is the integer analog of Pareto. It is defined
    for $n \in \mathbb{N}, n\ge1$, by


    ```

    $\P(X=n) = \frac{1}{n^{p+1}}\zeta(p+1)$

    ```


    where $\zeta(n+1)$ is a normalizing constant (Riemann’s zeta function).


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_107_0.png)


    **Figure 3.11** $P(x > x)$ versus $x$ on log-log scales, when $X$ is normal (dots),
    normal(solid) or Pareto (dashed). The three distributions have the same mean and
    99%-quantile.


    Zipf’s law is not a probability distribution, but is related to the Pareto distribution.
    It states that the popularity of objects is inversely proportional to rank, or
    more generally, to a power of rank. This can be interpreted as follows.


    We have a collection of $N$ objects. We choose an object from the collection atrandom,
    according to a certain stationary process. We refer to $\theta_j$ as the probability
    that object $j$ is chosen; this is our interpretation of the popularity of object
    $j$.'
