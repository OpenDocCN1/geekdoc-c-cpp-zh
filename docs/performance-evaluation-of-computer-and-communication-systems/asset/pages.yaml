  md: '# 226 Palm Calculus, or the Importance of the Viewpoint


    COMMENT: In continuous time, “there is a point at time $t$ has the probability
    0 and cannot be conditioned upon. However, it is possible to give a meaning to
    such a conditional expectation, similarly to the way one can define the conditional
    probability density function of a continuous random variable:


    ```

    E''(Y) = \lim_{\tau\to0} \frac{E(N(t, t+\tau))}{E(N(t, t+\tau))} \quad (7.20)

    ```


    Here, the limit is in the Radon-Nikodym theorem, defined as follows. For a given
    random variable $Y$, consider the measure $\mu$ defined for any subset $B$ of
    $\mathbb{R}$ by


    ```

    \mu(B) = \frac{1}{Y} \sum_{n\in Z} 1_{(T_n\in B)} \quad (7.21)

    ```


    where $\lambda$ is the intensity of the point process $T_n$. If $B$ is negligible
    (i.e. its Lebesgue measure, or length is 0), then there is no event in $B$ and
    $\mu(B)=0$. By the Radon-Nikodym theorem [91], there exists some function $g$
    on $\mathbb{R}$ such that for any $B$: $\mu(B) = \int_B g(t)dt$. The Palm expectation
    $E''(Y)$ is defined as $g(t)$. In other words, for a given random variable $Y$,
    $E''(Y)$ is defined as the function of $t$ that, for any $B$, satisfies,


    ```

    Y \sum_{(T_n\in B)} = \lambda \int_B E''(Y) dt \quad (7.22)

    ```


    # 7.2.3 Interpretation as Time and Event Averages


    In this section, we make the link with the intuitive treatment in Section 7.1.


    # Time Averages


    If $X(t)$ is jointly stationary with the simulation, it follows that the distribution
    of $X(t)$ is independent of $t$; it is called the *stationary distribution* of
    $X$.


    Assume that, in addition, $X(t)$ is ergodic, i.e. that time averages tend to expectations
    (which, is true for example on a discrete state space any state can be reached
    from any other state), for any bounded function $\phi$, we can estimate $E(\phi(X(t)))$
    by (in discrete time)


    ```

    E(\phi(X(t))) \approx \frac{1}{T} \sum_{t=1}^T o(X(t))

    ```


    when $T$ is large. An equivalent statement is that for any (measurable) subset
    $W$ of the set of values of $X(t)$


    ```

    P(X(t) \in W) \approx$ fraction of time that $X(t)$ is in the set $W$

    ```


    In other words, the time stationary distribution of $X(t)$ can be estimated by
    a time-average.'
