  md: "# Classical Results for a Single Queue\n\n# Mean Response Time\n\n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_298_0.png)\n\
    \n**Figure 8.8** the mean response time for an M/GI/1 queue, relative to the service\
    \ time, for different values of the coefficient of variation CoVs = $\\delta$:\
    \ from top to bottom: CoVs = 1.4, CoVs = 1 (M/M/1 queue) and CoVs = 0 (M/D/1 queue).\n\
    \n# 8.3.3 The Processor Sharing Queue, M/GI/1/PS\n\nThis is a special case of\
    \ the single server queue, with the *Processor Sharing (PS)* service discipline\
    \ instead of FIFO. We assume that the server divides itself equally into all present\
    \ customers; this is an idealization when $\\delta \rightarrow 0$ of the *round\
    \ robin* service discipline, where the server allocates time slices of $\\delta$\
    \ in turn to each present customer. If there are $N$ customers in the queue, the\
    \ residual service time for each of these decreases at a rate $\\frac{1}{N}$.\
    \ This is also called *egalitarian processor sharing*. Lynes's theorem applies\
    \ and the system is stable when $\rho < 1$.\n\nThe workload $W(t)$ is the same\
    \ as for FIFO queues, but the distribution of waiting times and of customers is\
    \ not equivalent. We give results for the simple case where all arrivals are Poisson\
    \ and service times are iid and independent of the arrival process. They are both\
    \ simple and striking. We assume $\rho < 1$. First, the stationary probability\
    \ is\n\n```\n$P(N(t) = k) = (1-\rho)^k \\quad (8.17)$\n```\n\nwhich shows in particular\
    \ that it depends on the service time distribution only through its mean (this\
    \ *insensitivity* property common to many queues in the theory of networks presented\
    \ in Section 8.4). It follows that\n\n```\n$$\\begin{cases} N = \\frac{\rho}{1-\\\
    rho} \\ R = \\frac{S}{1-\\rho} \\end{cases} \\quad (8.18)$\n```\n\nThe, average\
    \ response time $R_0$ of an arbitrary customer, conditional to its service time\
    \ $S_0$ satisfies [47]\n\n```\n$E^0(R_0 \\mid S_0 = x) = \\frac{x}{1-\\rho} \\\
    quad (8.19)$\n```"
