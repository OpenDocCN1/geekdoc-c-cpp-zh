  md: '# Seeding the Random Number Generator


    A safe way to make sure that replications are reasonably independent is to use
    the internal state of the generator at the end of the 1st replication as the seed
    for the second replication and so one. This way, if the generator has a long enough
    sequence, the different replications have no overlapping sequences.


    In practice, though, we often want independent replications to be run in parallel,
    so this mode of operation is not possible. A common practice is to take a truly
    random number as the seed, for example derived from the computer clock or user
    input with the mouse, see for example random.org.


    # 6.6 How to Sample from a Distribution


    In this section, we discuss methods for producing a sample $X$ for a random variable
    that has a known distribution. We assume that we have a random number generator,
    providing us with independent samples of the uniform distribution on $(0,1)$.
    We focus on two methods of general applicability: CDF inversion and rejection
    sampling.


    # 6.6.1 CDF Inversion


    The method of **CDF inversion**, also called the *percentile inversion method*,
    applies to real or integer valued random variables, when the CDF is easy to invert.


    > Theorem 6.1

    Let $F$ be the CDF of a random variable $X$ with values in $\mathbb{R}$. Define
    the pseudo-inverse, $F^{-1}$ of $F$, by


    $F^{-1}(p) = \sup\{x : F(x) \leq p\}$


    Let $U$ be a sample of a random variable with a uniform distribution on $(0,1)$;
    $F^{-1}(U)$ is a sample of $X$.


    Application to learn random variables


    In the case where $X$ has a positive density over some interval $I$, $F$ is continuous
    and strictly increasing on $I$, and the pseudo-inverse is the inverse of $F$,
    as in the next example. It is obtained by solving for $x$ in the equation $F(x)
    = p$, $x \in \text{Id}$.


    # Example 6.11 Exponential Random Variable


    The CDF of the *exponential distribution* with parameter $\lambda$ is $F(x) =
    1 - e^{-\lambda x}$. The pseudo-inverse (which in this case is the plain inverse)
    is obtained by solving the equation


    ```

    $1 - e^{-\lambda x} = p$

    ```'
