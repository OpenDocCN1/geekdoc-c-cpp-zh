  md: '# 6.6.3 Ad-Hoc Methods


    The methods of inversion and rejection sampling may be improved in some special
    cases. We mention in detail the case of the normal distribution, which is important
    to optimize because of its frequent use.


    # Sampling a Normal Random Variable


    The method of inversion cannot be directly used, as the CDF is hard to compute.
    An alternative is based on the method of change of variables, as given in the
    next proposition, the proof of which is by direct calculus.


    **Proposition 6.4** Let $(X,Y)$ be independent, standard normal random variables.
    Let


    ```

    R = \sqrt{X^2 + Y^2}

    \Theta = \arg(X + jY)

    ```


    R and $\Theta$ are independent, R has a Rayleigh distribution (i.e it is positive
    with the density $r e^{-r^2/2}$) and $\Theta$ is uniformly distributed on $[0,
    2\pi]$.


    The CDF of the Rayleigh distribution can easily be inverted: $F(r) = P(R \leq
    r) = 1 - e^{-r^2/2}$ and $F^{-1}(p) = \sqrt{-2\ln(1-p)}$. A sampling method for
    a couple of independent standard normal variables is thus **Box-Muller method**


    ```

    draw U \sim Unitif(0,1) and $\Theta \sim Unitif(0,2\pi)\nX = \sqrt{-2\ln(U)}

    X = R\cos(&;Theta), Y = R\sin(&;Theta)\nreturn(X,Y)

    ```


    # Correlated Normal Random Vectors


    We sample $X_1,\dots,X_n$ as a random vector with a zero mean and a covariance
    matrix $\Omega$. If the covariance matrix is diagonal (i.e. $\Omega_{i,j} = 0$
    for $i \neq j$), $X_s$ are independent and we can sample them one by one (or better,
    by two). We are interested in the case where there is some correlation.


    The method we show here is again based on a change of variables. There always
    exists a change of basis in $\mathbb{R}^n$ such that, in the new basis, the random
    vector has a diagonal covariance matrix. In fact, there are many bases (one of
    them is orthonormal and can be obtained by diagonalization of $\Omega$, which
    is much more expensive than the method we discuss next). An inexpensive and stable
    algorithm to obtain one triangular matrix $L$ such that $\Omega = LL^T$. Let $Y$
    be a standard normal vector (i.e an iid sequence of $n$ standard normal random
    variables). Further, let $X = LY$. The covariance matrix of $X$ is


    ```

    $E(XX^T) = E(LY(LY)^T) = E(L(YY^T)L^T) = LIL^T = LL^T = \Omega$

    ```


    Thus a sample of $X$ can be obtained by sampling $Y$ first and computing $LY$.
    Figure6.11 shows an example.'
