  md: 'The convergence of the latter series follows from the assumption that the filter
    is stable. Thus, for large t, the covariance does not depend on t. More formally,
    one can show that an ARMA process with Hypothesis 5.1 is asymptotically stationary
    ([19], [97]), as required since we want to model stationary data.


    Note in particular that


    ```

    var(X_t) \approx \sigma^2 \sum_{j=0} h_j^2 = \sigma^2 \left(1 + \sum_{j=1} h_j^2\right)
    \ge \sigma^2 \quad (5.27)

    ```


    thus the variance of the ARMA process is larger than that of the noise.


    For an MA(q) process, we have $h_j = C_j$ for $j = 1, \dots, q$, and $h_j = 0$
    for $j \ge q$, the ACF is 0 at lags $j \ge q$.


    **The Auto-Correlation Function (ACF)** is defined by $\rho_t = \gamma_t/\gamma_0$.
    The ACF departs from an iid process; indeed (i.e. $h_1 = h_2 = \dots = 0$), $\rho_t=0$
    for $t \ge 1$. The ACF can be computed from (5.26) but there are more efficient
    methods to exploit (5.23), see [105], which are implemented in standard packages.
    One also uses the *Partial Auto-Correlation Function* (PACF), which is defined
    in Section C.6 as the residual correlation of $X_{t+s}$ and $X_t$, provided that
    $X_{t+1}, \dots, X_{t+s-1}$ are known.


    Figure 5.9 shows the ACF and PACF of a few ARMA processes. They all decay exponentially.
    For an AR(p) process, the PACF is 0 at lags $t > p$.


    # ARIMA Process


    By definition, the random sequence $Y = (Y_1, Y_2, \dots)$ is an ARIMA(p,d,q)
    (Auto-Regressive Integrated Moving Average) process if differencing $Y$ times
    gives an ARMA(p,q) process (i.e. $X = \Delta^d Y$ is an ARMA process, where $\Delta_1$
    is the differencing lag at 1). For $d \ge 1$, an ARMA process is not stationary.


    > Furthermore, it can easily show that if the initial conditions $X_0, \dots,
    X_{-p}$ are not set to 0 as we do for the sake of simplicity, but are drawn from
    the Gaussian process with mean $\mu$ and covariance $\gamma_0$, then $X_t$ is
    (exactly) stationary. We ignore this subtlety in this chapter and consider only
    stationary processes.


    > Equality occurs only when $h_1 = h_2 = \dots = 0$, i.e. for the trivial case
    where $X_t = \epsilon_t$.


    > Some authors call autocrelation the property if the covariance matrix of $(X_t,
    \dots, X_{t+1})$ is invertible. For an AR process, this is always true, according
    to Corollary C.2.


    > This follows from the definition of PACF and the fact that $X_{t+s}$ is entirely
    determined by $X_{t-p}, \dots, X_{t+s-1}$.'
