    COMMENT: The theoretical Lorenz curve is defined for a probability distribution
    with a cumulative distribution function $F(-)$ and finite mean $\mu$ by


    ```

    $L(p) = \frac{1}{\mu}\int_{0}^{p} F^{-1}(q) dq \quad (2.13)

    ```


    where $F^{-1}$ is the pseudo-inverse [51, Theorem 3.1.2].


    ```

    $F^{-1}(q) = sup\{x : F(x) < p\} = \inf\{x : F(x) \geq q\}$

    ```


    If the CDF $F(-)$ is continuous and increasing, then $F^{-1}$ is the usual function
    inverse. In this case, the theoretical Lorenz gap is equal to


    ```

    $gap_{th} = p_{0} - L(p_{0})$

    ```


    with $p_{0} = F(\mu)$.


    The theoretical Lorenz curve is the limit of the Lorenz curve for an iid data
    sample from $F(-)$, when $n$ is large.


    # The Gini Coefficient


    The *Gini coefficient* is yet another fairness index, very widespread in economy,
    and by imitation, in computer and communication systems. Its definition is similar
    to that of the Lorenz curve, with the mean average deviation replaced by the **Mean
    Difference:**


    ```

    $MD = \frac{1}{n(n-1)} \sum_{i,j} |x_{i} - x_{j}| \quad (2.14)

    ```


    The Gini coefficient is defined as


    ```

    $Gini = \frac{MD}{2m} \quad (2.15)

    ```


    where $m$ is the empirical mean of the data set. It can be shown that it is equal
    to $2\times$ the area between the line of perfect equality and the Lorenz curve
    (the rescaling factor 2 causes it to lie between 0 and 1). In practice, the Gini
    coefficient can be computed with (2.11), which gives


    ```

    $Gini = \frac{2}{mn^{2}} \sum_{i=1}^{n} ix_{(i)} - 1 - \frac{1}{n} \quad (2.16)

    ```


    COMMENT: The theoretical Gini coefficient for a probability distribution with
    CDF $F(-)$ is defined by


    ```

    $Gini_{th} = 2 \int_{0}^{\infty} (q - L(q)) dq = 1 - 2 \int_{0}^{\infty} L(q)
    dq$

    ```


    where $L(-)$ is the theoretical Lorenz curve defined in (2.13).'
