    for some value of $c$ to be defined later and, as usual, $\bar{x} = \frac{1}{n}
    \sum_{i=1}^n X_i$ and $s_n^2 = \frac{1}{n} \sum_{i=1}^n (X_i - \bar{x})^2$.

    The size of the test is the maximum probability of $C$ for $\theta \in \Theta_0$.
    We have


    ```

    $P\left(\frac{\bar{X}}{s_n} > c \\middle|\ \mu = 0, \sigma\right) \approx 1 -
    N_{0,1}(c)$

    ```


    where $N_{0,1}$ is the CDF of the standard Gaussian distribution. Note that this
    is independent of $\sigma$ and therefore


    ```

    $\alpha = \sup(1 - N_{0,1}(c)) = 1 - N_{0,1}(c)$

    ```


    If we want a test size equal to 0.05, we need to take $c = 1.645$. For the data
    at hand the value of the test statistic $\sqrt{n}\bar{X} = 5.05 > c$, and we therefore
    reject $H_0$ and decide that the mean is positive.

    The power function is


    ```

    $\beta(\mu, \sigma) \ \overset{\text{def}}{=} P\left(\frac{\bar{X}}{s_n} > c \\middle|\
    \mu, \sigma\right) = P\left(\frac{\bar{X}}{s_n} - \mu > c - \sqrt{n}\frac{\mu}{s_n}
    \\middle|\ \mu, \sigma\right)\n\approx 1 - N_{0,1}(c - \sqrt{n}\frac{\mu}{s_n})
    \quad \quad (4.2)$

    ```


    Figure 4.2 plots the power as a function of $\mu$ when $c = 1.645$ and for $\sigma$
