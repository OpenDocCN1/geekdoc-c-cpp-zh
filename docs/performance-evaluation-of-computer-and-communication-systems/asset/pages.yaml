  md: '# Palm Calculus, or the Importance of the Viewpoint


    When computing or measuring a performance metric (as defined in Chapter 1), one
    should specify which observer''s viewpoint that is taken. For example, in a simulation
    study of an information server, one may be interested in the metric "worst case
    backlog", defined as the 95-percentile of the number of pending requests.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_232_0.png)


    One way to obtain this is to measure the queue of pending requests at request
    arrival epochs over a large number of arriving requests, and compute the 95-percentile
    of the resulting empirical distribution. An alternative is to measure the queue
    of pending requests at periodic intervals (say every second) over a long period
    of time and compute the 95-percentile of the resulting empirical distribution.
    The former method reflects the viewpoint of an arriving request, and the latter
    that of an observer at an arbitrary point in time. The former method evaluates
    the metric using a clock that ticks at every request arrival, whereas the latter
    uses a standard clock. Both methods will usually provide'
  merge: -1
