  md: "# M/M/1 Queue\n\nThis is a special case of the M/GI/1 queue where the service\
    \ times are exponentially distributed. Here it is possible to obtain stationary\
    \ probabilities in explicit (and simple) form, by directly solving the equilibrium\
    \ equations of the Markov process. One finds that the distribution of the number\
    \ of customers at an arbitrary point in time, when $\rho < 1$,\n\n```\n$$P(N(t)\
    \ = k) = (1-\\rho)\\rho^k$$\\quad (8.8)\n```\n\nand the distribution of the service\
    \ time of an arbitrary customer is given by\n\n```\n$$P^0(R_0 \\le x) = 1 - e^{-(1-\\\
    rho)x/S}$$ (8.9)\n```\n\nFurthermore, (8.7) applies with $\\kappa = 1$.\n\n# M/M/1/K\
    \ Queue\n\nThis is a modification of the M/M/1 queue where the total number of\
    \ customers is limited to $K$. If a customer arrives when the queue is full, this\
    \ customer is dropped. The M/GI/1 formula cannot be applied, but instead, one\
    \ can directly solve the equilibrium equations of the Markov process.\n\nThe system\
    \ has a stationary regime for *any* of $\rho$. The distribution of the number\
    \ of customers at an arbitrary point in time is\n\n```\n$$P(N=k) = \\eta\\rho^k\
    \ l_{(0\\le k\\le K)}$$ \\quad \\text{with} \\quad \\eta = \\begin{cases} 1-\\\
    rho & \\text{if } \\rho \\neq 1 \\ \\frac{1}{K+1} & \\text{if } \\rho=1 \\end{cases}$\n\
    ```\n\nBy PASTA, the probability that the system is full is equal to the loss\
    \ probability, i.e.\n\n```\n$$P^0(\\text{arriving customer is discarded}) = P(N(t)=K)\
    \ = \\frac{(1-\\rho)\\rho^K}{1-\\rho^{K+1}}$$\n```\n\n# GI/GI/1 Queue\n\nThis\
    \ is general single server queue where inter-arrival and service times are independent\
    \ of each other well as iid. In general, no closed solution exists, but numerical\
    \ procedures are available.\n\nOne approach is based on a following equation,\
    \ which is a stochastic recurrence:\n\n```\n$$W_n = (W_{n-1} + S_{n-1} - A_n +\
    \ A_{n-1})^+$$\n```\n\nwhere the notation $(x)^+$ means max$(x,0)$ and $W_n =\
    \ W(A_n)^+$ is the workload in the system just before the $nth$ arrival, i.e.\
    \ the waiting time for the $nth$ customer. (Here, $A_n$ is the arrival time and\
    \ $S_n$ the service time of the $nth$ customer). Let $C_n = A_n - A_{n-1} + S_n$.\
    \ Note that $C_n$ is iid and independent of $W_{n-1}$, thus\n\n```\n$$W_n \\overset{dist}{}(W_{n-1}\
    \ + C_n)^+$$ \\quad (8.10)\n```"
