  md: '# Choosing a Distribution


    In this section and the next, we review a number of simple guidelines that are
    useful for finding the right distribution. We illustrate in the following section
    how this can be used to build a load generator (SURGE).


    In this section and the next, a distribution signifies a probability distribution
    over the set of real numbers.


    # 3.4.1 Shape


    Perhaps the first attribute of interest is the shape of the distribution, or more
    precisely, of its PDF. We say that two distributions on $\mathbb{R}$, with CDFs
    $F(\cdot)$ and $G(\cdot)$, have the same **distribution shape** if they differ
    by a change of scale and location, i.e., there exists $m \in \mathbb{R}$ and $s
    > 0$ such that $G(sx+m) = F(x)$ for all $x \in \mathbb{R}$. This is equivalent
    to saying that there are some random variables $X, Y$ with distribution functions
    $F(\cdot), G(\cdot)$, and with $Y = sX+m$.


    For example, the normal distribution $N_{\mu,\sigma^2}$ and the standard normal
    distribution $N_{0,1}$ have the same shape, in other words, all normal distributions
    are essentially identical.


    When looking for a distribution, one may get a first feeling by plotting a histogram,
    which is a rough estimate of the PDF. Since most plotting tools automatically
    adapt the scales and origins on both axes, what one really obtains is a coarse
    estimate of the distribution.


    A distribution is usually defined with a number of parameters. When browsing a
    distribution catalog (e.g. on Wikipedia), it is important to distinguish the parameters
    that influence the shape and those that are simply location and scale parameters.
    For example, with the normal distribution $N_{\mu,\sigma^2}$, $\mu$ is a location
    parameter and $\sigma$ a scale parameter; if a random variable $X$ follows $X=\sigma
    Z+\mu$, where $Z \sim N_{0,1}$.


    In Tables 3.1 and 3.2, we give a small catalog of distributions that are often
    used in the context of this book. For each distribution, we give only the set
    of parameters that influences the shape. Other distributions can be derived by
    a change of location and scale. The effect of this on various formulas is straightforward.
    However, it is indicated in the table, for completeness.


    The **log-normal distribution** with parameters $\mu, \sigma > 0$ is defined as
    the distribution of $X=e^Z$ where $Z$ is Gaussian with mean $\mu$ and variance
    $\sigma^2$. It is often used as a rescaling of log scale, as was done in (3.2).
    Note that


    ```

    $X=e^{\sigma Z+\mu}=e^{\mu}e^{\sigma Z} \quad Z \sim N_{0,1}$

    ```


    Consequently $\mu$ corresponds to a scale parameter $s=e^\mu$. In contrast (unlike
    the normal distribution), $\sigma$ is a shape parameter. Table 3.1 gives properties
    of the standard log-normal distribution (i.e. for $\mu=0$; other values of $\mu$
    can be obtained by re-scaling). Figure 3.10 shows the shape of the log-normal
    distribution for various values of $\sigma$, rescaled such that the mean is consistently
    equal to 1.'
