    # Example 6.14 A Stochastic Geometry Example


    We want to sample the random vector $(X_1, X_2)$ that takes values in the rectangle
    $[0,1] \times [0,1]$ and whose distribution has a density proportional to $|X_1
    - X_2|$. We take $f_X =$ the uniform density over $[0,1] \times [0,1]$ and $f_X^Y(x_1,x_2)
    = |x_1-x_2|$. An upper bound on the ratio $\frac{f_X^Y(x_1,x_2)}{f_X(x_1,x_2)}$
    is 1. The sampling algorithm is


    ```

    do

    draw $U \sim \text{Unif}(0,1)\nuntil $U \le |X_1 - X_2|\nreturn(X_1, X_2)$

    ```


    Figure 6.10(b) shows an example. Note that we do not need to know the normalizing
    constant to apply the sampling algorithm.'
