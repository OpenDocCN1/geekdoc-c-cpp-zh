    # Beyond the Linear Case


    # Example 3.8 Joe''s Shop. Estimation of $\xi$


    In Example 3.6, we assumed that the value $\xi$ after which which congestion collapse
    occurs is known in advance. Now, we relax this assumption. Our model is now the
    same as (3.9), except that $\xi$ is also a parameter to be estimated.


    To do this, we apply the maximum likelihood estimation. We have to maximize the
    log-likelihood $\ell_2(a, b, d, \xi, \sigma)$ where $\hat{y}$, the data, is fixed.
    For a fixed $\xi$, we know the value of $(a, b, d, \sigma)$ that achieves the
    maximum, as we have a linear regression model. We plot the value of this maximum
    versus $\xi$ (Figure 3.8) and numerically find the maximum: it occurs for $\xi
    = 77$.


    To find a confidence interval, we use the asymptotic result in Theorem B.2. It
    states that a 95% confidence interval is obtained by solving $l(\xi) - l(\xi)
    \le 1.9207$, which gives $\xi \in [73, 80]$.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_98_0.png)


    **Figure 3.8** Log likelihood for Joes'' shop as a function of $\xi$.


    # 3.3 Linear Regression with $\ell^1$ Norm Minimization


    This is a variant of the linear regression model, but with Laplace instead of
    Gaussian noise. The theory is less simple, as we do not have explicit linear expressions.
    Nonetheless, it employs linear programming and is thus often tractable, with the
    benefit of an increased robustness to outliers.'
