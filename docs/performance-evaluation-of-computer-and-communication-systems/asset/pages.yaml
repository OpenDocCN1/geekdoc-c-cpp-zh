  md: "There are other methods for obtaining confidence intervals, but they involve\
    \ specific assumptions of the model and require some care; see for example [49].\n\
    \n# 6.3.3 Non-Terminating Simulations\n\nNon-terminating simulations should be\
    \ asymptotically stationary (Section 6.1.2). When you simulate such a model, you\
    \ should be careful to perform transient removal. This involves:\n\n+   - when\
    \ to start measuring the output (i.e. the time at which we consider that the simulation\
    \ has converged to its stationary regime)\n- when to stop the simulation.\n\n\
    Unfortunately, there is no simple, bullet-proof method to determine these two\
    \ times. In theory, convergence to the stationary regime is governed by the value\
    \ of the second eigenvalue modulus of the transition matrix of the Markov chain\
    \ that represents your simulation. In all very special cases, it is impossible\
    \ to estimate this value. A practical method for removing transients is to look\
    \ at the data produced by the simulation, and finally determine a time when the\
    \ simulation output does not seem to exhibit a clear trend behavior. For example,\
    \ in 6.1(a), the measurements could safely start at time t=1. This is the same\
    \ stationarity test with time series (Chapter 5).\n\nDetermining when to stop\
    \ a simulation is more trickery. The simulation should be large enough for transients\
    \ to be removable. After that, you need to estimate whether running the simulation\
    \ for a long time reduces the variance of the quantities that you are measuring.\
    \ In practice, this is hard to predict priori. A rule of thumb is to run the simulation\
    \ long enough so that the output looks Gaussian across several replications, but\
    \ not longer.\n\n# 6.4 Monte Carlo Simulation\n\nA Monte Carlo simulation is a\
    \ method for computing probabilities, expectations, or in general, integrals when\
    \ direct evaluations are impossible or too complex. It simply consists in estimating\
    \ the expectation as the mean of a number of independent replications.\n\nFormally,\
    \ we assume that we have a model for generating a data sequence $\tilde{X}$. The\
    \ sequence may be id or not. Further assume that we want to compute $\beta = E(\\\
    varphi(\tilde{X}))$. Note that this covers the case where we wish to compute a\
    \ probability: if $\\varphi(\tilde{x}) = 1_{(x \\in A)}$ for some set $A$, then\
    \ $\beta = P(\tilde{X} \\in A)$.\n\nA Monte Carlo simulation consists in generating\
    \ $R$ iid replicates $\tilde{X}^r, r=1, \\dots, R$. The Monte Carlo estimate of\
    \ $\beta$\n\n```\n\\beta = \\frac{1}{R} \\sum_{r=1}^{R} \\varphi(\\\tilde{X}^r)\
    \ \\quad (6.2)\n```"
