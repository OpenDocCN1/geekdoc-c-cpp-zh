  md: '# 6.5 Random Number Generators


    The simulation of any random process uses a basic function (such as rand in Matlab)
    that is assumed to return independent uniform random variables. Arbitrary distributions
    can be derived from there, as explained in Section 6.6.


    In fact, rand is a pseudo-random number generator. it produces a sequence of numbers
    that appearing to be random, but which is in perfectly deterministic, depending
    only on one initialization value of its internal states, called the seed. there
    are several methods to implement pseudo random generators, i.e. iterative processes
    where a small difference in the seed produces very different outputs.


    Simple random number generators are based on linear congruences of the type $x_n
    = ax_{n-1} \pmod m$. here, the internal state after $n$ calls to rand is the last
    output $x_n$; the seed is $x_0$. as any iterative algorithm, the sequence is periodic,
    for appropriate choices of $a$ and $m$, the period may be large.


    # Example 6.9 Linear Congruence


    A widespread obsolete generator (for example the default in ns2) has $a = 16,
    807$ and $m = 2^{31} - 1$. The sequence is $x_n = sa^n \pmod m$ where $s$ is the
    seed. $m$ is a prime number, and the smallest exponent $h$ such that $a^h \equiv
    1 \pmod m$. It follows that for any value of the seed $s$, the period of $x_n$
    is exactly $m - 1$. Figure 6.5 shows that the sequence $x_n$ indexed looks random.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_210_0.png)


    **Figure 6.5** 1000 successive numbers for the generator in Example 6.9. (a) qq-plot
    against the uniform distribution in (0,1), showing a perfect match, (b) an autocorrelation
    function, displaying no significant correlation at any lag, (c) lag plots at various
    lags, showing independence. Note that there is however correlation in dimensions
    higher than 2, see Example 6.10.'
