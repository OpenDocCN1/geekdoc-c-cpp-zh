  md: 'We say the vector $X_{i-1}, \dots, X_n$ is monotonic at index $i$ ($i \in \{2,
    \dots, n-1\}$) if


    $X_{i-1} \leq X_i \leq X_{i+1} \quad \text{or} \quad X_{i-1} \geq X_i \geq X_{i+1}$


    and we further say that there is a turning point at $i$ if the vector $X_i$ is
    not monotonic at $i$. Under $H_0$, the probability of a turning point at $i$ is
    $\frac{2}{3}$. To see why, list all possible cases for the relative orderings
    of $X_{i-1}, X_i, X_{i+1}$.


    More precisely, let $T$ be the number of turning points in $X_1, \dots, X_n$.
    It can be shown $[18,105]$ that, for large $n$, $T$ is approximately $N_{2n-4,
    \frac{16n-29}{90}}$. Thus, the $p$-value for large $n$ is approximately


    ```

    $p = 2 \left( 1 - N_{0.1} \sqrt{\frac{T''-2n-4}{16n-29}} \right) \quad (4.44)$

    ```


    # 4.6 Proofs


    We make a likelihood ratio test and compute the likelihood ratio statistic. We
    need to compute the maximum likelihood under $H_1$. The log-likelihood of the
    model is


    ```

    $l_X(\hat{\mu}, \sigma) = -\frac{1}{2} \left[ \sum_{i=1}^{I} \ln(2\pi) + \sum_{i=1}^{I}
    n_i \ln(\sigma_i) + \sum_{i=1}^{I} n_i \frac{(\hat{X}_{ij} - \mu_i)^2}{\sigma_i^2}
    \right] \quad (4.45)$

    ```


    To find the maximum under $H_1$, observe that the terms in the summation do not
    have cross dependencies. We thus maximize each of the $I$ terms separately. The
    maximum of the $i$th term is for $\mu_i = \hat{\mu}_i$, and $\sigma_i^2 = s_i^2$,
    and thus


    ```

    $l_X(H_1) = -\frac{1}{2} \left[ \sum_{i=1}^{I} \ln(2\pi) + \sum_{i=1}^{I} n_i
    \ln(s_i^2 + 1) \right] = -\frac{1}{2} \left[ \ln(2\pi) + n + 2 \sum_{i=1}^{I}
    n_i \ln(s_i) \right] \quad (4.46)$

    ```


    Under $H_0$, the likelihood is as in (4.45) with $\sigma_i$ replaced by the common
    value $\sigma$. To find the maximum, we use the ANOVA Theorem C.7. The maximum
    is obtained for $\mu_i = \hat{\mu}_i$ and $\sigma^2 = s^2$ and thus


    ```

    $l_X(H_0) = -\frac{1}{2} \left[ \sum_{i=1}^{I} \ln(2\pi) + \sum_{i=1}^{I} \frac{n_i}{s_i^2}
    \ln(s_i^2) \right] = -\frac{1}{2} \left[ \ln(2\pi) + n + 2n \ln(s) \right] \quad
    (4.47)$

    ```


    The test statistic is the likelihood ratio statistic $\ell = l_X(H_1) - l_X(H_0)$
    and thus


    ```

    $2\ell = n \ln(s^2) - \sum_{i=1}^{I} n_i \ln(s_i^2) \quad (4.48)$

    ```'
