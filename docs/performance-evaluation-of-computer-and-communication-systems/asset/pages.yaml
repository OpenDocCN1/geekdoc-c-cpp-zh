  md: "criterion. In practice though, likelihood ratio tests are asymptotically optimal,\
    \ in some sense, under very large sets of assumptions. They are very general,\
    \ easy to use and even to develop; therefore it is worth knowing. We often make\
    \ use of Monte Carlo simulations to compute the p-value of a test. This can sometimes\
