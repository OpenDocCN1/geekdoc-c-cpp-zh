    # 2.5.1 Robustness


    # Erroneous Distributional Hypotheses


    The confidence interval for the mean given by Theorem 2.2 requires that the central
    limit theorem applies, i.e.


    +   (1) that the common distribution has a finite variance, and

    (2) that the sample size $n$ is large enough.


    While these two assumptions often hold, it is important to test cases where they
    do not.

    Ideally, we would like to test whether the distribution of $T = \sum_{i=1}^{n}
    X_i$ is normal or not, but we cannot do this directly, since we have only one
    value of $T$. The bootstrap method can be used to solve this problem, as explained
    in the following example.


    # Example 2.7 Pareto Distribution


    This is a toy example where we generate artificial data, iid, from a Pareto distribution
    on $[1,+\infty)$. It is defined by its CDF equal to $F(c) := P(X > c)$ with $p
    = 1.25$; its mean is $5$, its variance is infinite (i.e. it is heavy-tailed) and
    its median is $1.74.

    Assume that we do not know that it comes from a heavy-tailed distribution and
    would like to use the asymptotic result in Theorem 2.2 to compute a confidence
    interval for the mean. We use the bootstrap method to verify convergence to the
    normal distribution, as follows. We are given a data sample $x_1, \dots, x_n$
    from the Pareto distribution. We draw $R$ replacements for each $r$ between $1$
    and $R$, we draw samples $X_i^r \ i=1, \dots, n$ with replacement from the list
    $(x_1, \dots, x_n)$ and let $T^r = \frac{1}{n} \sum_{i=1}^n X_i^r$. $T^r$ is the
    $r$th bootstrap replicate of $T$; we obtain a $qq$-plot of $T$, $r=1, \dots, R.

    If the distribution of $T$ is normal, the $qq$-plot should look normal as well.
    However, we see that this is not the case, which is an indication that the central
    limit theorem might not hold. Indeed, the confidence interval for the mean is
    not very good.


    The previous example shows a case where the confidence interval for the mean is
    not good. This is due to a distributional assumption being made, which is incorrect.
    In contrast, the confidence interval for the median is correct (Figure 2.14),
    as it does not require any distributional assumption (other than the iid hypothesis.'
