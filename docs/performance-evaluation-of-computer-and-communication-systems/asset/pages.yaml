    # 3.5 Heavy Tail


    # 3.5.1 Definition


    In Section 3.4.4, we have seen the definition of a fat tail, i.e. a distribution
    that has a vanishing hazard rate. In this section, we discuss an extreme case
    of a fat tail, called "heavy tail", which has unique, intuitive features. It is
    frequently found in models of file size and flows distributions.


    We use the following definition (which is the simplest). We say that the distribution
    on $(a, \infty)$, with CDF $F$, is heavy-tailed with index $0 < p < 2$ if there
    is some constant $k$ such that,


    ```

    $1-F(x) = \frac{k}{x^p} \quad (3.27)$

    ```


    Here, $f(x) \sim g(x)$ means that $f(x) = g(x)(1+\epsilon(x))$, with $\lim_{x\to\infty}
    \epsilon(x) = 0$.'
