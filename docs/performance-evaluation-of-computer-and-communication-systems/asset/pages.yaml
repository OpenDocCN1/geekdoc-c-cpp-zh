  md: "# Classical Results for a Single Queue\n\nIf $\rho < 1$, the system has a stationary\
    \ regime, and the stationary distribution of the waiting time $W$ must satisfy\n\
    \n```\n$W \\stackrel{dist}{=} (W - C)^+$ (8.11)\n```\n\nwhere $C$ is a random\
    \ variable with the same distribution as $A_n - A_{n-1} + S_n$. This expression\
    \ is called Lindley's equation. It is classical to use CDFs, which gives the following\
    \ equivalent form of (8.11):\n\n```\n$F_W(x) = \\int_{-\\infty}^{x} F_W(x-y)f_C(dy)\
    \ \\quad \\text{if } x < 0$ (8.12)\n```\n\nwhere $F_W$ is the CDF of waiting times\
    \ and $f_C$ is the PDF of $A_n - A_{n-1} + S_n$. Equation (8.11) is the Wiener-Hopf\
    \ type and and can be solved, in least many cases, using the theory of analytical\
    \ functions; see [46, Section 8.2].\n\nA second approach consists in solving (8.10)\
    \ directly by discretization. Pick a time step $\\delta$ and for $n \\in \\mathbb{N}$\
    \ and $k \\in \\mathbb{Z}$,\n\n```\n$w_k^n = P(W^n \\in (k\\delta, (k+1)\\delta))$\
    \ (8.13)\n$s_k^n = P(S^n \\in (k\\delta, (k+1)\\delta))$ (8.14)\n$a_k^n = P(-A_n\
    \ + A_{n-1} \\in (k\\delta, (k+1)\\delta))$ (8.15)\n```\n\nNote that $w_k^n =\
    \ s_k^n$ for $k < 0$ and $a_k = 0$ for $k > 0$. Moreover, the arrays $s$ and $a$\
    \ are independent of $n$. Equation (8.10) can be approximated by\n\n```\n$w_k^n\
    \ = (w^{n-1} * s * a)_k \\quad \\text{if } k > 0$\\n$w_k^n = \\sum_{i \\le 0}\
    \ (w^{n-1} * s * a)_i \\quad \\text{if } k < 0$ (8.16)\n```\n\n* is the discrete\
    \ convolution. The error is due to discretization and should decrease with $\\\
    delta$. In fact, (8.16) is exact for the modified system where we replaced the\
    \ service times and inter-arrival times by approximations that such an approximation\
    \ is used by default for the service time (Eq.(8.11)) and by excess for the inter-interval\
    \ time (Eq.(8.15)); thus the approximating system has a smaller $\\rho$ than the\
    \ original system. If the original system is stable, so is the approximating one,\
    \ and by Loynes' theorem, the iteration converges to the stationary distribution\
    \ of the waiting time. The method consists in numerically evaluating (8.16) until\
    \ the norm of the difference $w^n - w^{n-1}$ becomes small; the convolution can\
    \ be computed using the Fourier transform. See [39] for an example where this\
    \ method is used.\n\nA third type of method uses mixtures of exponentials to approximate\
    \ the distributions of service times as in Section 8.8.1. The stationary distributions\
    \ can then be computed explicitly; see [55] and [72]."
