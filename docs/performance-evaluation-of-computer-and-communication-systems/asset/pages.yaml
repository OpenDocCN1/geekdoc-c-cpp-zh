    $p$ is the distribution of $Z = \sum_{i=1}^{n} Z_i$, where $Z_i$ are iid random
    variables such that $Z_i=0$ or 1 and $P(Z_i=1)=p$. It is in other words the distribution
    of the successes in an experiment with $n$ trials and the individual success probability
    $p$. (The random variables $Z_i$ are called $Bernoulli$ random variables. $N_{0,1}$
    is the CDF of the Gaussian distribution with the mean 0 and variance 1.)


    For $n=10$, the theorem and the table in Section A state that a 95%-confidence
    interval for the median (estimated as $\frac{X_{(5)}+X_{(6)}}{2}$) is $[X_{(2)},X_{(9)}$.
    In other words, we obtain a confidence interval for the median of 10 results by
    removing the smallest and the largest values. Could it be simpler?


    Note that, for small values of $n$, no confidence interval is possible at the
    levels 0.95% or 0.99%. This is due to the probability that the true quantile is
    outside any of the observed data still be being large.


