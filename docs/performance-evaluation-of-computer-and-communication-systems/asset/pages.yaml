    # Theorem 7.3


    Let $X(t) = T^+(t) - t$ (time until next point, also called residual time), $Y(t)
    = t - T^-(t)$ (time since last point), $Z(t) = T^+(t) - T^-(t)$ (duration of current
    interval). For any $t$, the distributions of $X(t)$ and $Y(t)$ are equal, with
    PDF:


    ```

    $f_X(s) = f_Y(s) = \lambda \mathbb{P}(T_1 > s) = \lambda \int_s^{\infty} f_{T_1}^0(u)
    du \quad (7.28)$

    ```


    where $f_{T_1}^0$ is the Palm PDF of $T_1 - T_0$ (PDF of inter-arrival times)
    and $\lambda$ is the intensity of the point process. The PDF of $Z(t)$ is


    ```

    $f_Z(s) = \lambda s f_{T_1}^0(s) \quad (7.29)$

    ```


    In particular, it follows that


    ```

    $E(X(t)) = E(Y(t)) = \frac{1}{2} E^0(T_1^2)$ \ in continuous time \quad (7.30)$

    ```


    ```

    $E(X(t)) = E(Y(t)) = \frac{1}{2} E^0(T_1(T_1 + 1))$ \ in discrete time \quad (7.31)$

    ```


    ```

    $E(Z(t)) = \lambda E^0(T_1^2) \quad (7.32)$

    ```


    Note in discrete time, the theorem means that


    $\mathbb{P}(X(t) = s) = \mathbb{P}(Y(t) = s) = \lambda \mathbb{P}^0(T_1 \ge s)$
    and $\mathbb{P}(Z(t) = s) = \lambda s \mathbb{P}^0(s)$


    # Example 7.8 Poisson Process


    Assume $T_n$ is a Poisson process (see Section 7.6). We have $f_T^0(t) = e^{-\lambda
    t}$ and $\mathbb{P}^0(T_1 > s) = \mathbb{P}^0(T_1 \ge s) = e^{-\lambda s}$ thus
    $f_X(s) = f_Y(s) = f_T^0(s)$.


    This is expected, if we imagine that at every time, of duration $dt$, the Poisson
    process flips a coin and, with probability $\lambda dt$, that there is an arrival,
    independent of the past. Thus, the time $X(t)$ until the next arrival is independent
    of whether there is an arrival or not at time $t$, and the Palm distribution of
    $X(t)$ is the same as its time-average distribution. Note that this is specific
    to the Poisson process; processes without it do not have this feature.


    The distribution of $Z(t)$ has the density


    ```

    $f_Z^0(s) = \lambda^2 s e^{-\lambda s}$

