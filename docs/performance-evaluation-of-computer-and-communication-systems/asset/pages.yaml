  md: '# Model Fitting Criteria


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_90_0.png)


    Figure 3.4


    We summarize what we have learned so far as follows.


    # Fitting a Model to Data


    +   (1) Define a statistical model that contains both the deterministic part (the
    one we are interested in) and a model of the noise.


    +   (2) Estimate the parameters of the statistical model using maximum likelihood.
    If the number of data points is small, use a brute force approach (e.g fminsearch).
    If the number of data points is large, you may need to search the literature for
    efficient, possibly heuristic, optimization methods.


    +   (3) Validate the model fit by screening the residuals. either visually or
    through tests (Chapter 4). In practice, you will seldom obtain a perfect fit;
    however, large deviations indicate that the model might not be appropriate.


    # 3.1.2 Least Squares Correspond to Gaussian, Equal Variance


    A very frequent is when the statistical model has the form


    > $Y_i = f_i(\vec{\beta}) + \epsilon_i \quad \text{for } i = 1, \dots, \text{with
    } \epsilon_i \text{ iid} \sim N_{0,\sigma^2}$


    as in the previous examples (Models of Equations in (3.3) and (3.4)). The discrepancy
    between the explanatory model and the data is assumed to be Gaussian with equal
    variance. In some examples in the literature, the "equal variance" assumption
    is called homoscedasticity.


    The next theorem explains how to fit the explanatory model $y_i = f_i(\vec{\beta})$
    to our data assume that the error terms in our data are independent, Gaussian,
    and of equal amplitude. We have seen in the examples above that care must be taken
    when validating this assumption. In particular, some rescaling may be needed for
    an improved validation.'
