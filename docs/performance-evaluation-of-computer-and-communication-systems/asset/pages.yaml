  md: "# Parametric Estimation, Large Sample Theory\n\nand the expected information\
    \ matrix (Fisher's information) is\n\n```\n$I - \\begin{pmatrix} \\frac{n}{\\\
    sigma^2} & 0 \\ 0 & \\frac{2n}{\\sigma^2} \\end{pmatrix}$\n```\n\nThe following\
    \ corollary is used in practice. It follows immediately from the theorem.\n\n\
    **Corollary B.1 (Asymptotic Confidence Intervals)** When $n$ is large, approximate\
    \ confidence intervals can be obtained as follows:\n\n(1) For the $i$th component\
    \ of $\theta$, the interval is\n\n```\n$\\hat{\theta}_i \\pm \\eta \\sqrt{[I(\\\
    theta)^{-\\1}]_{i,i}} \\quad \\text{or} \\quad \\hat{\theta}_i \\pm \\eta \\sqrt{[J(\\\
    theta)^{-\\1}]_{i,i}}$\n```\n\nwhere $N_{0,1}(\\eta) = \\frac{1+\\gamma}{2}$ (e.g.\
    \ with $\\gamma=0.95$, $\\eta=1.96$).\n\n(2) If $\theta$ is in $\\mathbb{R}$,\
    \ the interval is defined implicitly as $\\{\\theta : l(\\theta) - \\frac{\\gamma}{2}\
    \ \\leq l(\\hat{\\theta})\\}$, where $\\chi^2_1(\\xi) = \\gamma$. For example,\
    \ with $\\gamma=0.95$, $\\xi=3.84$.\n\n# **Example B.4** Lazy Normal iid\n\nAssume\
    \ that our data comes from an iid normal model $X_i, i=1,\\dots,n$. We compare\
    \ the exact confidence interval for the mean (from Theorem 2.3) to the approximate\
    \ ones given by the corollary. The MLE of $(\\mu, \\sigma)$ is $(\\hat{\\mu}_n,\
    \ s_n)$. The exact confidence interval is\n\n```\n$\\hat{\\mu}_n \\pm \\eta \\\
    frac{\\sigma_n}{\\sqrt{n}}$\n```\n\nwith $\\hat{\\sigma}_n^2 = \\frac{s_n^2}{n-1}$\
    \ and $t_{n-1}(\\eta')=\\frac{1+\\gamma}{2}$. We now compute the approximate confidence\
    \ interval obtained from the Fisher information. We have\n\n```\n$I(\\mu, \\sigma)^{-\\\
    1} = \\begin{pmatrix} \\frac{\\sigma^2}{n} & 0 \\ 0 & \\frac{\\sigma^4}{2n} \\\
    end{pmatrix}$\n```\n\nthus the distribution of $(\\mu - \\hat{\\mu}_n, \\sigma\
    \ - s_n)$ is approximately normal with a $0$ mean and covariance matrix $\\begin{pmatrix}\
    \ \\sigma^2/n & 0 \\ 0 & \\sigma^4/2n \\end{pmatrix}$. It follows that $\\mu -\
    \ \\hat{\\mu}_n$ is approximately $N(0, \\frac{\\sigma^2}{n})$, and an approximate\
    \ confidence interval is\n\n```\n$\\hat{\\mu}_n \\pm \\eta \\frac{s_n}{\\sqrt{n}}$\n\
    ```\n\nwith $s_n = \\frac{s_n}{\\sqrt{n}}$ and $N_{0,1}(\\eta) = \\frac{1+\\gamma}{2}$."
