    \ in Chapter 8, the mean response\ntime of a request is given by the Pollaczek-Khintchine\
    \ formula\n\n```\n$R = \\rho + \\frac{\\sigma^2}{2(1-\\rho)}$\n```\n\nwhere $\\\
    mu$ is the mean and $\\sigma^2$ the variance, of $F$ (assuming both are\nfinite),\
    \ and $\\rho$ is the utilization factor (= request arrival rate $\\times\\mu$).\
    \ The\nresponse time thus depends only on the utilization and the mean\nsize of\
    \ the requests, but also on the coefficient of variation $C := \\frac{\\sigma}{\\\
    mu}$. As\nC grows, the response time goes to infinity. If the real data supports\n\
    the hypothesis that $F$ is heavy-tailed, the average response time is likely\n\
    to be high and the estimators of it are unstable.\n\n# **3.5.4** Testing for a\
    \ Heavy Tail\n\nThere are several methods for deciding whether a data set is heavy-tailed\
