  md: '# Summarized Performance Data


    Data sets may be compared by collecting their ECDFs. If one is consistently above
    the other, it may be considered to be superior, even though some points in the
    first set may be less good. This is called stochastic majorization. Figure 2.2
    demonstrates that the new data set clearly outperforms the old one. Note that
    the stochastic majorization is a partial order, as is the comparison of multi-dimensional
    metrics (Section 1.1.2).


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_44_0.png)


    Figure 2.2 Data of Example 2.1. Empirical distribution functions for the old (right
    curve) and the new (left curve) code. The new outperforms the old; the improvement
    is significant at the tail of the distribution.


    Assume that the data samples come from a well defined probability distribution:
    the histogram can be viewed as an estimate of the PDF of the distribution, and
    the ECDF as an estimate of the CDF.(11)


    # 2.1.2 Means, Medians and Quantiles


    Instead of considering entire histograms or ECDFs, one would often like to summarize,
    i.e. compress, the histogram into one or several numbers representing both average
    and variability. This is commonly done by either of the following methods:


    # Median and Quantile


    A median is a value that falls in the middle of the distribution, i.e. 50% of
    the data is below and 50% above. A p%-quantile leaves p% of the observation below
    and (100 - p)% above. The median gives some information about the average, while
    a commonly used plot is the box plot. It shows the median, the 25% and 75% quantiles
    (called “quartiles”) and the “outliers”, defined as data points that are a fixed
    fraction away from the quantiles (Figure 2.3).


    > (11)The CDF of the random variable X is a function defined by F(x) = P(X ≤ x).'
