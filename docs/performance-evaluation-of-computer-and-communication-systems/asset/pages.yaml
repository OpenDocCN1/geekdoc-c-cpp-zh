    \ n_i$ where $\\frac{n_i}{q_i}$ are our data set). For large values of the sample\
    \ size $n$ we can approximate $\beta$ by a $\\chi^2$ distribution (see Section\
    \ 4.4). For small values on the other hand, there is no analytic result.\n\nWe\
    \ use a Monte Carlo simulation to compute $p$. We generate $R$ iid replicates\
    \ $X_1^r,\\dots,X_n^r$ of the sequence $(r = 1, \\dots, R)$. This can be done\
    \ by employing the inversion method described in the present chapter. For each\
    \ replicate $r$, let\n\n```\n$N_i^r = \\sum_{k=1}^n \\{X_k^r = i\\} (6.4)$\n```\n\
    \nThe Monte Carlo estimate of $\\hat{p}$ is\n\n```\n$\\hat{p} = \\frac{1}{R} \\\
    sum_{r=1}^R \\{\\sum_{i=1}^n N_i \\ln \\frac{N_i}{q_i} > a\\} (6.5)$\n```\n\n\
    Assuming that $\\hat pR \\ge 6$, we can compute a confidence interval by using\
