  md: '# CHAPTER 4


    # Tests


    We use tests to decide whether a certain assertion on a model is true or not,
    for example whether the particular data set comes from a normal distribution.
    We have seen in Chapter 2 that visual tests may be used for such a purpose. Tests
    are meant to be a more objective way to reach the same goal.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_126_0.png)


    Tests are often used in empirical sciences to draw conclusions from noisy experiments.
    Though we use the same theories, our setting is somewhat different; we are concerned
    with the nested model setting, i.e. we want to decide whether a simpler model
    is good enough, or whether we need a more sophisticated one. Here, the question
    is asymmetric; if doubt, we give preference to the simpler model — this is the
    principle of parsimony. The Neyman Pearson framework is well suited for such a
    setting, and we thus restrict ourselves to it.


    There exists a large number of tests, and everyone can invent their own (this
    is perhaps a symptom of the absence of a simple, unequivocal optimality'
