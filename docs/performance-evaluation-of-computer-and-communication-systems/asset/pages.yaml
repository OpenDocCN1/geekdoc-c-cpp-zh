    au} \\in \\{0 \\dots T_1\\} \\times \\dots \\times \\{0 \\dots T_G\\}$, let\n\n\
    ```\n$D_{\\tilde{\tau}}(\\vec{X}) \\stackrel{\\text{\\\neq}}{=} \\sum_{\\tilde{x}\
    \ \\ge \\min(X_g, T_g)} \\frac{d(\\\tilde{x})}{g} X_{\\tilde{x}}^g$\n```\n\nso\
    \ that $D(\\\\vec{X}) = \\sum_{\\tilde{\tau} \\in \\{0 \\dots T_1\\} \\times \\\
