  md: '# Wilcox Rank Sum Test and Kruskal-Wallis


    The Wilcoxon rank sum test is used for testing equality of distribution in non-paired
    experiments. It tests


    $H_0$: the two samples come from the same continuous distribution against


    $H_1$: the distributions of the two samples are continuous and differ by a location
    shift


    Let $X_1^i, i = 1\dots, n_1$, and $X_2^i, i = 1\dots, n_2$, be the two iid sequences
    that the data is assumed to be a sample of. The Wilcoxon rank sum statistic $R$
    is the sum of the ranks of the first sample in the concatenated sample.


