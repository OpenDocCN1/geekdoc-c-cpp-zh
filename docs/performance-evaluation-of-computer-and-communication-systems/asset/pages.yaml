  md: "# Heavy Tail\n\nA heavy-tailed distribution has an infinite variance, and for\
    \ $p \\le 1$ an infinite mean.\n\n+   * The Pareto distribution with exponent\
    \ $p$ is heavy-tailed with index $p$ if $0 < p < 2$.\n* The log-normal distribution\
    \ is not heavy-tailed (its variance is always finite).\\n* The Cauchy distribution\
    \ (density $\\frac{1}{\\pi(1+x^2)}$) is heavy-tailed with index 1.\n\n# 3.5.2\
    \ Heavy Tail and Stable Distributions\n\nPerhaps the most striking feature of\
    \ heavy-tailed distributions is that the central limit theorem does not hold,\
    \ i.e. the aggregation of many heavy-tailed quantities does *not produce* a Gaussian\
    \ distribution.\n\nIndeed, if $X_i$ are iid with a finite variance $\\sigma^2$\
    \ and with a mean $\\mu$, then $\\frac{1}{n} \\sum_{i=1}^n (X_i - \\mu)$ tends\
    \ in distribution to the normal distribution $N_{0, \\sigma^2}$. In contrast,\
    \ if $X_i$ are iid, heavy-tailed with index $p$, then there exist constants $d_n$\
    \ such that\n\n```\n$\\frac{1}{n} \\sum_{i=1}^n X_i + d_n \\xrightarrow{\\text{distrib}}{n\
    \ \\to \\infty} S_p$\n```\n\n$S_p$ has a **stable distribution** with index $p$.\
    \ Stable distributions are defined for $0 < p \\le 2$, for $p = 2$ they are the\
    \ normal distributions. For $p < 2$, they are either constant or heavy-tailed\
    \ with index $p$. Furthermore, they have a property of closure under aggregation:\
    \ if $X_i$ are iid and stable with index $p$, then $\\frac{1}{n}(X_i + \\dots\
    \ + X_n)$ has the same distribution as the $X_s$, shifted by some $d_n$.\n\nThe\
    \ shape of a stable distribution with $p < 2$ is defined by one skewness parameter\
    \ $\\beta \\in [-1,1]$ (but the skewness index in the sense of Section 3.4.2 does\
    \ not exist). The standard distribution is defined by its index $p$, and by $\\\
    beta$ when $p < 2$. The general distribution is derived by a change of scale and\
    \ location. When $\\beta = 0$, the standard distribution is symmetric, otherwise\
    \ not. The standard distribution with skewness $-\\beta$ is the symmetric (by\
    \ change of sign) of the stable distribution with parameter $\\beta$. When $p\
    \ < 2$ and $\\\beta = 1$, the support of the stable distribution is $[0, +\\infty)$\
    \ (and when $\\beta = -1$ the support is $(-\\infty, 0]$); otherwise the support\
    \ is $\\mathbb{R}$.\n\nIn general, stable distributions that are not constant\
    \ have a continuous density, which it is not explicitly known ([93], [73]), see\
    \ Table 3.2. Note that the Pareto distribution is not stable.\n\nFigure 3.15 illustrates\
    \ the convergence of a sum of iid random variables to a stable distribution. In\
    \ practice, stable distributions may be difficult to work with, and are sometimes\
    \ replaced by heavy-tailed combinations, as in Example 3.11."
