  md: 'constraint on the parameters. We have $p+q$ coefficients, plus the mean $\mu$
    and the variance $\sigma^2$. Consequently, up to the constant $-N\ln(2\pi)$, which
    can be ignored, we have


    ```

    AIC = -N\ln\hat{\sigma}^2+2(p+q+2) \quad (5.30)

    ```


    Note that the AIC counts as degrees of freedom only for continuous parameters,
    and thus not count the number of times we applied differencing or de-seasonalizing
    to the original data. Among all the possible values of $p, q$ and possibly among
    several applications of differencing or de-seasonalizing filters, we choose the
    one that minimizes AIC.


    # Verification of Residuals


    The sequence of residuals $e = (e_1, e_2, ...)$ is an estimation of the non-observed
    innovation sequence $\epsilon$. It is obtained by


    ```

    $(e_1, e_2, ..., e_t) = F^{-1}(x_1-\mu, x_2-\mu, ..., x_t-\mu) \quad (5.31)

    ```


    where $(x_1, x_2, ...)$ is the differenced data and $F$ is the ARMA filter in
    (5.23). If the model fit is good, the residuals should be roughly independent.
    therefore the ACF and PACF of the residuals should be close to 0 at all lags.


    Note that the residuals can also be obtained from the following proposition (the
    proof of which easily follows from Corollary D.2


    # Proposition 5.5 (Innovation Formula)


    ```

    $\epsilon_t = X_t-\hat{X}_{t-1}(1) \quad (5.32)

    ```


    where $\hat{X}_{t-1}(1)$ is the one step ahead prediction at time $t-1$.


    Thus, to estimate the residuals, one can compute the one step ahead predictions
    for the available data $\hat{x}_{t-1}(1)$, using the forecasting formulae given
    next. The residuals are then


    ```

    $e_t = x_t-\hat{x}_{t-1}(1) \quad (5.33)

    ```


    # 5.5.4 Forecasting


    Once a model is fitted to the differenced data, forecasting is easily derived
    from Theorem D.2, given in appendix, and its corollaries. Essentially, Theorem
    D.2 state that predictions for $X$ and $Y$ are obtained by mapping predictions
    for $\epsilon$ by means of reverse filters. Since $\epsilon$ is ideal, predictions
    for $\epsilon$ are trivial: e.g. the point prediction $\hat{\epsilon}_t(h)$ is
    equal to the mean. One needs to be careful, though the first terms of the differenced
    series $X_t$ are not exactly known, and one should use recursive formulas that
    avoid the propagation of errors. This gives the following:'
