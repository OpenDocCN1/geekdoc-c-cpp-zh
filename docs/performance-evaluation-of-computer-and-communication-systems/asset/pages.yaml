  md: 'Define $\Delta X_t$ as $X_t-0$ if $t$ is not a point of the point process $T_n$
    and $\Delta X_{T_n} = X(T_n) - X(T_n^-)$, i.e. $\Delta X_t$ is the amplitude of
    the discontinuity at time $t$. Note that it follows


    $$X(t) = X(0) + \int_0^t X''(s) \ ds + \sum_{n\in \mathbb{N}} \Delta X_{T_n} 1_{\{t\le
    T_n\}}$ $\quad (7.34)$


    Theorem 7.4 (Rate Conservation Law [69])

    Assume that the point process $T_n$ and $X(t)$ are jointly stationary. If $E^0|\Delta_0|
    < \infty$ and $E|X''(0)| < \infty$ then


    $$E(X''(0)) + \lambda E^0(\Delta_0) = 0$


    where $\lambda$ is the intensity of the point process $T_n$ and $E^0$ is the expectation.


    The proof in continuous time can be found for example in [70]. We can interpret
    the theorem as follows.


    +   * $E(X''(0))$ (also equal to $E(X''(t))$ for all $t$) is the average rate
    of increase of the process $X(t)$, excluding jumps.

    * $E^0(\Delta_0)$ is the expected amplitude of any arbitrary jump. Thus, $\lambda
    E^0(\Delta_0)$ is the expected rate of increase due to jumps.

    * The theorem states that, if the system is stationary, the sum of all jumps is
    canceled out, in average.


    Remark. The theorem can be extended to somewhat to the cases where certain expectations
    are infinite, as follows [70]. Assume that the point process $T_n$ can be decomposed
    as the superposition of the stationary point processes $T_j$, $j=1,...,J$, and
    that these point processes have no points in common. Let $\Delta_j^X$ be the jump
    of $X(t)$ when $t$ is an instant of the point process $T_j$, i.e.


    $$X(t) = X(0) + \int_0^t X''(s) \ ds + \sum_{j\in \mathbb{N}} \Delta X_{T_j} 1_{\{t\le
    T_j\}}$ $\quad (7.35)$


    and $\Delta_j^X = 0$ whenever $t$ is not an instant of the point process $T_j$.


    Assume that $X''(t) \ge 0$ and the jumps of a point process are all positive or
    all negative. Precisely, assume that $\Delta_j^X \ge 0$ for $j=1,...,I$ and $\Delta_j^X
    \le 0$ for $j=I+1,...,J$. Finally, assume that $X(t)$ and the point process $T_j^2$
    are jointly stationary. Then


    $$E(X''(0)) + \sum_{j=1}^I \lambda_j E^j(\Delta_j^X) = - \sum_{j=i+1}^J \lambda_j
    E^j(\Delta_j^X)$ $\quad (7.36)$


    where $E^0$ is the Palm expectation with respect to the point process $T_j^n$
    and the equality holds even if some of the expectations are infinite.'
