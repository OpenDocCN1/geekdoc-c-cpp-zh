    \ Assume that we want a relative accuracy at least equal to some fixed value $\\\
    epsilon$ (for example $\\epsilon = 0.05$). This is achieved if\n\n```\n$\\frac{1.96\
    \ \\hat{\\sigma}}{\\hat{p}} \\le \\epsilon (6.7)$\n```"
