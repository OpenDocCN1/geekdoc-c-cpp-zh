    For the normal distribution $N_{\mu,\sigma^2}, cgf(s) = \mu s + \frac{\sigma^2}{2}s^2$
    thus all cumulants of order $k \ge 3$ are 0.


    QUESTION 3.4 Show that the $k$th cumulant of the convolution of $n$ distributions
    is the sum of the $k$th cumulants.$^{(5)}$


    # Skewness Index


    $\kappa_4$ is called **skewness** (sometimes also called skewness) is


    $$\gamma_1 := \frac{\kappa_3/\kappa_2^{3/2}}{\sigma^{33}}$


    The skewness index is insensitive to changes in scale (by a positive factor) or
    location. For a density that is symmetric around its mean, $\gamma_{2k+1}=0$;
    $\gamma_1$ can be taken as a measure of asymmetry of the distribution. When $\gamma_1>0$,
    the distribution is right-skewed, and vice-versa. If $\phi$ is convex, then $\phi(X)$
    has a greater skewness index than X.


    # Kurtosis Index


    $\kappa_4$ is called Kurtosis. The **Kurtosis index**, also called *excess Kurtosis*,
    is


    $$\gamma_2 := \frac{\kappa_4/\kappa_2^2}{\sigma^4}$


    The Kurtosis index is insensitive to changes in scale or location. It is used
    to measure departure from the normal distribution. When $\gamma_2>0$, the distribution
    has a sharper peak around the mean and heavier tail!; when $\gamma_2<0$, it has
    a flatter top and decays more abruptly. Note $\gamma_2 \ge -2$, with equality
    only if the distribution is degenerate, i.e. equal to a constant.


    The Kurtosis index gives some information concerning the distribution tail. When
    it is large and positive it indicates that the tail of tail is large. We see for
    example in Figure 3.10 and in Table 3.1 that the log-normal distribution has a
    larger tail for larger $\sigma$.


    # 3.4.3 Power Laws, Pareto Distribution and Zipf''s Law


    Power laws are often invoked in the context of workload generation. Generally
    speaking, a power law is any relation of the form $y=ax^b$ between variables $x$
    and $y$, where $a$ and $b$ are constants. In log scales, this gives a linear relation:
    $\ln y = \ln x + \ln a$. Power laws have often been found to hold, at least approximately,
    for the **complementary CDFs**^{(6)}$ of some variables such as file sizes or
    properties of objects. They are discovered by plotting the complementary CDF in
    log-log scales and verifying whether a linear relation exists. Depending on whether
    the distribution is continuous or discrete, we obtain the Pareto and Zeta distributions.


    > (5) By independence: $\ln E(e^{(X_1+\dots+X_n)}) = \sum \ln E(e^{X_i})$.


    > (6) The complementary CDF is $1-F(\cdot)$ where $F(\cdot)$ is the CDF.'
