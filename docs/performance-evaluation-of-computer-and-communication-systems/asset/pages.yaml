    # 2.4.3 The Normal Assumption


    qq-plots


    This is a simple method for verifying the normal assumption, based on visual inspection.
    A *probability plot*, also called qq-plot, compares two samples $X_i$, $Y_i$,
    $i=1, \dots, n$ in order to determine whether they come from the same distribution.
    Call $X_{(i)}$ the *order statistic*. obtained by sorting $X_i$, in increasing
    order. Then $X_{(1)} \le X_{(2)} \le \dots$. The qq-plot displays the points $(X_{(i)},
    Y_{(i)})$. If the points are approximately along a straight line, then the distributions
    of $X_i$ and $Y_i$ can be considered as the same, modulo a change of scale and
    location.


    Most, we use qq-plots to verify the distribution of $Y_i$ against a probability
    distribution $F$. To do so, we plot $(x_i, Y_{(i)})$ where $x_i$ is an estimation
    of the expected value $E(Y_{(i)})$, assuming the marginal of $Y_i$ is $F$. The
    exact value of $E(Y_{(i)})$ is hard to obtain, but a simple approximation (provided
    $F$ is strictly increasing) [32]


    ```

    $x_i := F^{-1}(\frac{i}{n+1})$

    ```


    A normal qq-plot is a qq-plot that $F=N_{0,1}$, and is often used to visually
    test for normality (Figure 2.13). More formal tests are the Jarque Bera test (Section
    4.5.1) and the goodness of fit tests Section 4.4.


