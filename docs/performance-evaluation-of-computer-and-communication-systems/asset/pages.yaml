    # Feller''s Paradox


    We continue to consider Example 7.9 and assume that Joe would like to verify the
    inspector''s reports by sampling one bus inter-arrival time. Joe arrives at time
    $t$ and measures $Z(t) = (time until next bus - time since last bus). By employing
    (7.32)


    ```

    $E(Z(t)) = \frac{1}{\lambda} + \lambda var^0(T_1 - T_0)$

    ```


    where $\lambda var^0(T_1 - T_0)$ is the variance of the inter-arrival time ($=
    \int_0^\infty s^2 f_T^0(s) ds-$). Thus, the average of Joe''s estimate is always
    larger than the inspector''s (which is equal to $\frac{1}{2}$) by a term corresponding
    to $\lambda var^0(T_1 - T_0)$. This is the case despite that both observers sample
    the same system (however with differing viewpoints). This systematic bias is known
    as *Feller''s paradox*. Intuitively, it occurs because a stationary observer (Joe)
    is more likely to fall in a large time interval.


    In this example, no other assumptions apart from stationarity were made for the
    process of bus arrivals. Thus, Feller''s paradox is true for any stationary point
    process.


