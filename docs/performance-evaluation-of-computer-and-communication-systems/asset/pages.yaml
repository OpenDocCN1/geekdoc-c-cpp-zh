  md: '# Proofs


    # D.7 Proofs


    # Lemma D.1


    The characteristic function of $Y_n^i$ is


    ```

    $$\phi_{Y_n^i}(\omega_2) = \mathbb{E}(e^{-j(\langle\omega_2, F_{21}x_1\rangle+\langle\omega_2,
    F_{22}X_n\rangle)}) = e^{-j\langle\omega_2, F_{21}x_1\rangle}\mathbb{E}(e^{-j\langle\omega_2,
    F_{22}X_n\rangle})$$

    = e^{-j\langle\omega_2, F_{21}x_1\rangle}\mathbb{E}(e^{-j\langle\omega_2, F_{22}X_n\rangle}
    \mid X_1 = x_1)$$

    := e^{-j\langle\omega_2, F_{21}x_1\rangle}h(x_1) := f(x_1) \quad (D.39)$

    ```


    where $\langle\cdot, \cdot\rangle$ is the inner product. Let $g(y_1) := f(F_1^{-1}y_1)$.
    We want to show that


    ```

    $g(y_1) = \mathbb{E}(e^{-j\langle\omega_2, Y_1\rangle} \mid Y_1 = y_1) \quad (D.40)$

    ```


    By definition of a conditional probability, this is equivalent to showing that
    for any $\omega_1 \in \mathbb{R}^{n_1}$


    ```

    $$\mathbb{E}(e^{-j\langle\omega_1, Y_1\rangle}g(Y_1)) = \mathbb{E}(e^{-j\langle\omega_1,
    Y_1\rangle} e^{-j\langle\omega_2, Y_2\rangle}) \quad (D.41)$

    ```


    Now, by definition of $g(\cdot)$.$


    ```

    $$\mathbb{E}(e^{-j\langle\omega_1, Y_1\rangle}g(Y_1)) = \mathbb{E}(e^{-j\langle\omega_1,
    Y_1\rangle} e^{-j\langle\omega_2, F_{21}F_1^{-1}Y_1\rangle}h(F_1^{-1}Y_1))$$

    $$= \mathbb{E}(e^{-j\langle\omega_1, F_1X_1\rangle} e^{-j\langle\omega_2, F_{21}X_1\rangle}h(X_1))$

    $$= \mathbb{E}(e^{-j\langle\omega_1, F_1X_1\rangle} e^{-j\langle\omega_2, F_{21}X_1\rangle}
    e^{-j\langle\omega_2, F_{22}X_n\rangle})$

    ```


    where the last equality is, by definition of $h(\cdot)$, a conditional expectation
    in (D.39). This shows (D.41) as desired.


    Note that the proof is simpler if $X_1, X_2$ have a density, but this may not
    always hold, even for Gaussian processes.


    # Theorem D.3


    The random vector $\vec{Y}_n = (Y_1, \dots, Y_n)^T$ is derived from the random
    vector $\vec{X}_n = (X_1, \dots, X_n)^T$ by $\vec{Y}_n = H_n\vec{X}_n$ where $H_n$
    is the matrix in (D.6), with $h_0 = 1$. Based on the formula of change of variable,


    ```

    $f_{\vec{X}_n}(x_1, \dots, x_n) = |det(H_n)|f_{\vec{Y}_n}(y)$

    ```


    and $det(H_n) = 1$.'
