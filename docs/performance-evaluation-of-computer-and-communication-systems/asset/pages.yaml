  md: "# 8.5 The Product-Form Theorem\n\n# 8.5.1 Product Form\n\nThe following theorem\
    \ gives the stationary probability of the number of customers in explicit form;\
    \ it is the main available result for queuing networks. The original proof is\
    \ in [10], and extension to any service stations that satisfies the local balance\
    \ property can be found in [78] and [44]. The proof that MSCCC satisfy the local\
    \ balance property is given in [53] and [11]. The proof that all Kelly-Whittle\
    \ stations satisfy the local balance property is novel and is provided in Section\
    \ 8.10 (see Section 8.8 for more details).\n\nConsider a multi-class network as\
    \ defined above. In particular, it uses Markov routing and all stations are Kelly-Whittle\
    \ or MSCCC. Assume that the aggregation condition in Section 8.8.3 holds.\n\n\
    Let $n^s$ be the number of class-c customers present in station $s$ and $\\vec{n}^s\
    \ = (n_1^s, \\dots, n_C^s)$. The stationary distribution of the number of customers,\
    \ if it exists, is given by\n\n```\n$P(\\vec{n}^1, \\dots, \\vec{n}^S) = \\prod_{s=1}^S\
    \ \\frac{1}{\\eta^s} \\left(f^s(\\vec{n}^s)\\right) \\prod_{c=1}^C (\theta_c^s)^{n_c^s}\
    \ \\quad (8.51)\n```\n\nwhere $\theta_c^s$ is the visit rate in (8.24), $f^s(\\\
    cdot)$ is the station function and $\\eta$ is a positive normalizing constant.\n\
    \nConversely, let $\\mathcal{E}$ be the set of all feasible population vectors\
    \ $\\vec{n} = (\\vec{n}^1, \\dots, \\vec{n}^S)$. If\n\n```\n$\\sum_{\\vec{n} \\\
    in \\mathcal{E}} \\prod_{s=1}^S f^s(\\vec{n}^s) \\prod_{c=1}^C (\\theta_c^s)^{n_c^s}\
    \ < \\infty \\quad (8.52)\n```\n\nthere exists a stationary probability.\n\nIn\
    \ the open network, any vector $(\\vec{n}^1, \\dots, \\vec{n}^S)$ is feasible,\
    \ whereas in the closed or mixed case, the set of feasible population vectors\
    \ $\\mathcal{E}$ is defined by the constraints on populations of closed chains,\
    \ i.e.\n\n```\n$\\sum_{s \\in \\mathcal{S}} n_c^s = K_C$\n```\n\nfor any closed\
    \ chain $C$, where $K_C$ is the (constant) number of customers in this chain.\n\
    \nNote that the station function depends only on the traffic intensities. In particular,\
    \ the stationary distribution is not affected by the variance of the service requirement,\
    \ for stations of Category 1 (recall that stations of Category 2 must have exponential\
    \ service requirement distributions)."
