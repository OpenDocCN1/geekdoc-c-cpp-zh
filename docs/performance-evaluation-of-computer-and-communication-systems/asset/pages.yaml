  md: "# Gaussian Random Vector\n\n# C.3 Gaussian Random Vector\n\n# C.3.1 Definition\
    \ and Main Properties\n\n> Definition C.1\nA random vector $\\vec{X}$ with values\
    \ in $\\mathbb{R}^n$ is a *Gaussian vector* if any of the following is true:\n\
    (1) For any non-random $u \\in \\mathbb{R}^n$, $u^T\\vec{X}$ is a normal random\
    \ variable.\n(2) $\\vec{X}$ is a non-random linear combination of $p$ iid normal\
    \ random variables, for some $p \\in \\mathbb{N}$\n(3) The expectation $\\vec{\\\
    mu}$ and covariance matrix $\\Omega$ of $\\vec{X}$ are well-defined and its *characteristic\
    \ function* is\n\n```\n$\\phi_{\\vec{X}}(\\vec{\\omega}) \\overset{\text{def}}{=}\
    \ E(e^{i\\vec{\\omega}^T\\vec{X}}) = e^{i\\vec{\\omega}^T\\vec{\\mu}-\\frac{1}{2}\\\
    vec{\\omega}^T\\Omega\\vec{\\omega}} \\quad (C.13)$\n```\n\nfor all $\\vec{\\\
    omega} \\in \\mathbb{R}^n$\n\n# Example C.2\n\nThe vector $(e_1, \\dots, e_n)^T$\
    \ with $e_i \\sim N(0, \\sigma^2)$, and $\\sigma \\neq 0$ is a Gaussian cvector,\
    \ called *white Gaussian noise*. It has $\\vec{\\mu} = 0$ and $\\Omega = \\sigma^2\
    \ Id$.\nThe vector\n\n```\n$\\vec{X} = \\begin{pmatrix} \\sqrt{a}e_1 \\ \\sqrt{b}e_2\
    \ \\ \\sqrt{a}e_1 + \\sqrt{b}e_2 \\end{pmatrix}$\n```\n\nis Gaussian with $\\\
    vec{\\mu} = 0$ and $\\Omega$ as in (C.12).\nThe constant (non-random) vector $\\\
    vec{X} = \\vec{\\mu}$ is Gaussian with covariance matrix $\\Omega = 0$.\n\nIt\
    \ follows immediately that any (non-random) linear combination of Gaussian vectors\
    \ is Gaussian. In particular, if $\\vec{X}$ is Gaussian and $A$ is a non-random\
    \ matrix, then $A\\vec{X}$ is Gaussian.\n\nGaussian vectors are entirely defined\
    \ by their first and second properties. In particular,\n\nLet $\\vec{X}$ (resp.\
    \ $\\vec{Y}$) be a Gaussian random vector in $\\mathbb{R}^n$ (resp. $\\mathbb{R}^p$).\
    \ $\\vec{X}$ and $\\vec{Y}$ are independent if and only if their cross-covariance\
    \ matrix is 0, i.e.\n\n```\n$\\cov(X_i, Y_j) = 0 \\quad$ for all $i = 1, \\dots,\
    \ n, j = 1, \\dots, p$\n```\n\nNote that this is specific to Gaussian vectors.\
    \ For non-Gaussian random vectors, independence implies non-correlation, but the\
    \ converse may not be true."
