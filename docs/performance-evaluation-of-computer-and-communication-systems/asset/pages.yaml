    # 8.6.7 MVA Version 2


    This is an algorithm which, like MVA version 1, avoids computing the normalizing
    constant, but which applies to fairly general types [84]. We give a version for
    single chain (but multi-class) networks. For networks with several chains, the
    complexity of this method is exponential in the number of chains, and more elaborate
    optimizations have been proposed: see [27] and [28] as well as [6] and the discussion
    therein.


    The starting point is the decomposition theorem, which states that one can replace
    a subnetwork by a single station if one manages to compute its throughput in short
    circuit. For example, using MVA version 1, one can compute the throughput of a
    subnetwork made of single-server FIFO or IS stations (or equivalent). Therefore,
    one can replace the set of all such stations in a network by a single station.


    MVA version 2 does the same for general stations in closed networks. This can
    be reduced to the simpler problem of how to compute the throughput of a network
    of 2 stations, with numerically known service rates. If we can solve this problem,
    we can replace the 2 stations by a new one. The service rate is then equal to
    the throughput (according to Thecrem 8.17), and we can iterate. This problem is
    solved by the next theorem. It uses the concept of networks in short-circuit.


    # Theorem 8.18 (Complement Network Theorem)


