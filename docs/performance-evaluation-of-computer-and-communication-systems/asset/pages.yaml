    # 2.3.3 What Happens if the iid assumption does not hold?


    If we compute a confidence interval (using a method that assumes iid data) when
    in fact the iid assumption does not hold, we introduce bias. Data arising from
    high resolution measurements are frequently positively correlated. In such cases,
    the confidence interval is too small; there is not much information in the data
    as it would have been iid. This is due to the data having a tendency to repeat
    itself; see Figure 2.9 for an example.


    Nevertheless, it may still be possible to obtain confidence intervals when the
    data does not appear to be iid. Two possible methods are:


    Sub-sampling. This involves selecting a fraction $p$ of the measured data, and
    verifying that the iid assumption can be made for this selection data. The hope
    is that correlation disappears between data samples that are far apart.


    A simple way would be to keep every pn data sample, where $n$ is the total number
    of points, but this is not recommended as a strict period may introduce unwanted
    anomalies (called aliasing). A better method is to decide independently for each
    data point, with probability $p$, whether it is sub-sampled or not.


    For example, in Figure 2.9, sub-sampling works for $p \le \frac{1}{4}$; the confidence
    interval for the median is much larger than if we were to (wrongly) assume the
    original data to be iid.


    Although sub-sampling is very simple and efficient, it does not always work. For
    instance, it does not work if the data set is small, or for some large data sets
    which remain correlated after repeated sub-sampling (such data sets are long-range
    dependent).


    Modeling. This is this complex complex but applies when sub sampling does not.
    It consists of fitting a parametric model appropriate to the type of data, and
    computing confidence intervals for the model parameters (for example according
    to Section B.1). We illustrate this method on the next example.


