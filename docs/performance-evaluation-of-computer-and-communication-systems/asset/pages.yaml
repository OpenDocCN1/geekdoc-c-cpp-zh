  md: "358 Parametric Estimation, Large Sample Theory\n\nQUESTION 2.1 Which of the\
    \ following are random variables: $\\hat{\theta}, l(\theta), l(\\hat{\theta})$\
    \ $J(\theta), I(\theta), J(\\hat{\theta}), I(\\hat{\theta})$?^{(1)}$\n\n# B.3\
    \ Confidence Interval in Presence of Nuisance Parameters\n\nIn many cases, the\
    \ parameter has the form $\theta = (\\mu, \nu)$, and we are interested only in\
    \ $\\mu$ (e.g. for a normal model: the mean) while the remaining $\nu$, which\
    \ still needs to be estimated, is a nuisance (e.g. the variance). In such cases,\
    \ we can use the following theorem to find confidence intervals.\n\nTheorem B.2\
    \ [[32]]\nUnder the conditions in Definition B.1, assume that $\\Theta = M \t\
    imes N$, where $M, N$ are open subsets of $\\mathbb{R}^p, \\mathbb{R}^q$. Thus\
    \ the parameter is $\theta = (\\mu, \nu)$ with $\\mu \\in M$ and $\nu \\in N$\
    \ ($p$ is the \"dimension\", or number of degrees of freedom, of $\\mu$).\nFor\
    \ any $\\mu$, let $\\hat{\nu}_\\mu$ be the solution\n\n```\n$l(\\mu, \\hat{\n\
    u}_\\mu) = \\max l(\\mu, \nu)$\n```\n\nand define the profile likelihood by\n\
    $pl(\\mu) \\overset{\text{def}}{=} \\max l(\\mu, \nu) = l(\\mu, \\hat{\nu}_\\\
    mu)$\n\nLet $(\\hat{\\mu}, \\hat{\nu})$ be the MLE if $l(\\mu, \nu)$ is the true\
    \ value of the parameter, the distribution of $2(pl(\\hat{\\mu}) - pl(\\mu))$\
    \ tends to $\\chi^2_p$.\nAn approximate confidence region for $\\mu$ at level\
    \ $\\gamma$\n\n```\n$$\\left\\{ \\hat{\\mu} \\in M : pl(\\mu) \\geq pl(\\hat{\\\
    mu}) - \\frac{\\gamma}{2} \\right\\right\\}$\n```\n\nwhere $\\chi^2_p(\\gamma)\
    \ = \\gamma$.\n\nThe theorem essentially states that we can find an approximate\
    \ confidence interval for the parameter of $\\mu$ by computing the profile log-likelihood\
    \ for all values of $\\mu$ around the estimated value. The estimated value is\
    \ the one that maximizes the profile log-likelihood. The profile likelihood is\
    \ obtained by fixing the parameter of interest $\\mu$ to some arbitrary value\
    \ and computing the MLE for the other parameters. A confidence interval is obtained\
    \ implicitly as the set of values of $\\mu$ for which the profile likelihood is\
    \ close to the maximum. In practice, all of this is done numerically.\n\n> (1)\
    \ In the classical, non-Bayesian framework: $\\hat{\theta}, l(\theta), J(\theta),\
    \ J(\\hat{\theta}), I(\\hat{\theta})$ are random variables; $\theta$ and $l(\t\
    heta)$ are non-random but unknown."
