    which is very close to $2lrs$.


    # 4.5 Other Tests


    # 4.5.1 Goodness of Fit Tests based on Ad-Hoc Pivots


    In addition to the Pearson $\chi^2$ test, the following two tests are often used.
    They apply to a continuous distribution, thus does not require the observations
    to be quantized. Assume that $X_i, i=1, \dots, n$, are iid samples. We want to
    test $H_0$: the distribution of $X_i$ is F against non $H_0$.


    We define the empirical distribution $F$ by


    ```

    $\hat{F}(x) \overset{\text{def}}{=} \frac{1}{n} \sum_{i=1}^n 1{X_i \leq x\ \quad
    (4.38)$

    ```


    # Kolmogorov-Smirnov


    The pivot is


    ```

    $T = \sup_{x} |\hat{F}(x) - F(x)|$

    ```


    It is not entirely obvious that the distribution of this random variable is independent
    of $F$, but it can be easily derived in the case where $F$ is continuous'
