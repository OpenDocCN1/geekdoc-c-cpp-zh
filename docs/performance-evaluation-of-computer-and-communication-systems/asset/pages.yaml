  md: '# Appendix: Quick Review of Markov Chains


    The state space can be partitioned in communication classes as follows: two states
    $i$ and $j$ are in the same communication class if $i=j$ or if the chain $S(t)$
    can go from $i$ to $j$ in a finite number of transitions (each transition must
    have a positive probability), vice-versa, from $j$ to $i$. A communication class
    is either recurrent (once the chain $S(t)$ has entered the class, it will remain
    in the class forever) or not, also called transient. If a class is transient,
    with probability 1, the chain will leave it and never return. States that belong
    to a transient class are also transient.


    Let $\pi$ be the row vector of probabilities at time $t$, i.e $\pi_i(t) = \mathbb{P}(S(t)=i)$.
    Then for all $t \in N$


    ```

    $$\pi(t) = \pi(0)Q''$

    ```


    For the chain $S(t)$ to be stationary, we need $\pi$ to be independent of $t$,
    which implies that $\pi$ satisfies the linear system


    ```

    $$\begin{cases} \pi = \pi Q \ \pi_i = 1 \end{cases}$

    ```


    It turns out that this is also sufficient, i.e if $\pi(0)$ is a solution to (7.59),
    then $S(t)$ is stationary. A solution to (7.59) is called a stationary probability
    of the Markov chain.


    Note that, since $Q$ is a stochastic matrix, any solution $\pi \in \mathbb{R}^S$
    of (7.59) is necessarily non-negative. Since $S$ is finite, the situation is simple:
    stationary probabilities correspond to recurrent classes. More precisely,


    +   - There is at least one recurrent class.


    +   - For every recurrent class $c$ there is one stationary probability vector
    $\pi^c$, such that $\pi^c_i > 0$ if $i \in c$, and $\pi^c_i = 0$ otherwise; any
    stationary probability is a weighted average of $\pi^c$''s.


    +   - If there is only one recurrent class, the chain is called irreducible. If
    the chain is irreducible, there is exactly one stationary probability, and vice-versa,
    i.e. if (7.59) has only one solution, the chain is irreducible.


    +   - The chain is ergodic in the wide sense^{(5)}$ if it is irreducible, and
    vice-versa.

    - If there is more than one recurrent class, the chain will eventually enter one
    recurrent class and remain forever. The probability that the chain enters recurrent
    class $c$ depends on the initial condition.


    +   - If $\pi$ is a stationary probability vector and $i$ is a transient state,
    $\pi_i = 0$.


    Thus, when $S$ is finite, there is always at least one stationary regime. If the
    chain $S(t)$ is not irreducible (i.e. not ergodic) there may be several stationary
    regimes and the stationary regime that the chain eventually enters may be


    > ^{(Some authors use a more restrictive definition and say that a finite-space
    Markov chain is "ergodic" if it is irreducible and aperiodic, see later. We prefer
    to use the general definition, which is that time averages tend to expectations.'
