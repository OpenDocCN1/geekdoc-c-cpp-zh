  md: '# Asymptotic Results


    tribution. It is defined by


    ```

    $pcs = \sum_{i=1}^l \frac{(n_i - nq_i(\theta))^2}{nq_i(\theta)} \quad (4.29)$

    ```


    Indeed, when $n$ is large we expect, under $H_0$ that $n_i - nq_i(\theta)$ is
    relatively small, i.e. that $\epsilon_i = \frac{n_i}{nq_i(\theta)} - 1$ is small.
    An approximation of $2ls$ is found from the second order development around $\epsilon
    = 0$: $\ln(1+\epsilon) = \epsilon - \frac{1}{2}\epsilon^2 + o(\epsilon^2)$ and
    thus


    ```

    $ls = \sum_{i=1}^l \frac{n_i}{nq_i(\theta)} \sum_{i=1}^l (1+\epsilon_i)q_i(\theta)\ln(1+\epsilon_i)\n=
    \sum_{i=1}^l ((\epsilon_i - \frac{1}{2}\epsilon_i^2 + o(\epsilon_i^2))(1+\epsilon_i)q_i(\theta))\n=
    \sum_{i=1}^l q_i(\theta)(1 - \frac{1}{2}\epsilon_i + o(\epsilon_i))(1+\epsilon_i)\n=
    \sum_{i=1}^l q_i(\theta)\epsilon_i + n \sum_{i=1}^l q_i(\theta)\frac{1}{2}\epsilon_i^2
    + n \sum_{i=1}^l o(\epsilon_i^2)$

    ```


    Note that $\sum q_i(\theta)\epsilon_i = 0$, thus


    ```

    $lrs \approx \frac{1}{2}pcs \quad (4.30)$

    ```


    The Pearson Chi-squared statistic was historically developed before the theory
    of likelihood ratio tests, which explains why it is commonly used.


    In summary, for large $n$, the composite goodness of fit is solved by computing
    either $2ls$ or $pcs$. The $p$-value is $1-\chi^2_{n-k_0-1}(2ls)$ or $1-\chi^2_{n-k_0-1}(pcs)$.
    If either is small, we reject $H_0$, i.e. we reject that the distribution of $X_i$
    comes from the family of distributions $F(\cdot|\theta)$


    # Simple Goodness of Fit Test


    This is a special case of the composite test. In this case, $q_2 = I-1$ and thus
    the $p$-value of the test (given in (4.11)) can be approximated for large $n$
    by $1-\chi^2_{T-1}(2ls)$ or $1-\chi^2_{T-1}(pcs)$. Also, the likelihood ratio
    statistic $\sum_{i=1}^k n_i \ln\frac{n_i}{nq_i}$ can be replaced by the Pearson-Chi-Squared
    statistic, equal to


    ```

    $pcs = \sum_{i=1}^l \frac{(n_i - nq_i(\theta))^2}{nq_i} \quad (4.31)$

    ```'
