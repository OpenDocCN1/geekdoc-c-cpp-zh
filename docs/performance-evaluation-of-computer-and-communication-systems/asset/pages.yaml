    # 7.43 Perfect Simulation of Stochastic Recurrence


    Assume that we are interested in simulating the process $Z(t)$. A simple method
    involves drawing a sample of $(Z_0, S_0)$ from the joint distribution with PDF
    $f_{Z_0, S_0}(z, s)$, then deciding that the simulation remains in this state
    for $S_0$, by drawing $Z_1, S_1$ from its conditional distribution given $(Z_0,
    S_0)$ and so on. For a stochastic recurrence satisfying the hypotheses of Theorem
    7.9, as the simulation time increases, the simulation enters its stationary regime
    and its state will be distributed according to the stationary distribution of
    $Z(t), S(t)$.


    It is possible to do better, and start the simulation directly in the stationary
    regime, i.c. avoid transients entirely. This is called *perfect simulation*. It
    is based on Palm''s inversion formula, which provides a means of sampling from
    the stationary distribution, as we explain now.'
