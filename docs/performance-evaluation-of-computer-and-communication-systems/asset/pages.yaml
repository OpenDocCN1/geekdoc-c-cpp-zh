    where $n=40, q=\frac{1}{512}$ and the array $\{\pm x_{j,k}\}$ given numerically
    by channel estimation (Table 6.2) shows a few examples, for $d=9$. The variables
    $X_j, j=0,\dots,d$, are independent. For large'
