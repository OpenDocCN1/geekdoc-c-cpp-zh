    \ a test\n\nLet $X_1, \\dots, X_n$ be a sequence of iid random variables that\
    \ take on values in the discrete set $\\{1, 2, \\dots, I\\}$. Let $q_i = P(X_i\
    \ = i)$, and $N_i = \\sum_{k=1}^k \\{X_k = i\\}$ (number of observations equal\
    \ to $i$). Assume that we want to compute\n\n```\n$p = \\hat{p} = \\left( \\sum_{i=1}^n\
