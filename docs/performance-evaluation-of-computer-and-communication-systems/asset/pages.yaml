  md: '# Example 7.5 Kilometer versus Time Clock: Cyclist’s Paradox


    A cyclist rides Swiss mountains; his speed is 10 km/h uphill and 50 km/h downhill.
    A journey is comprised of 50% uphill slopes and 50% down-hill slopes. At the end
    of the journey, the cyclist is disappointed to read on his speedometer an average
    speed of 16.7 km/h. Here, we have two ways of measuring the average speed: $\frac{10+50}{2}
    = 30$ km/h. Here, with the standard clock (speedometer), or with the kilometer
    clock (cyclist''s intuition). Let us use the large time heuristic.


    +   (1) Pick a unit of length (perhaps smaller than the kilometer) such that the
    cyclist’s speed is constant on a section of the trip, length $l$, and let $v_l$
    be the speed at the $l$th section of the trip, $l=1,\dots,L$, where $L$ is the
    trip length. The average speeds measured with the standard clock, $S_t$ and with
    the kilometer clock, $S_k$ are


    ```

    $S_t = \frac{L}{T}$

    S_k = \sum_{l=1}^{L} v_l \quad (7.12)$

    ```


    where $T$ is the trip duration.


    +   (2) Break $L$ into pieces corresponding to the km clock:


    ```

    $L = \sum_{l=1}^{L} \frac{1}{v_l}$

    S_t = \frac{L}{\sum_{l=1}^{L} v_l} \quad (7.13)$

    ```


    +   (3) Thus, $S_t$ (Eq. (7.13)) is the harmonic mean of $v_l$ whereas $S_k$ (Eq.
    (7.12)) is the arithmetic mean (Section 2.4.3). The harmonic mean is the inverse
    of the mean of the inverses. If the speed is not constant throughout the whole
    trip, the harmonic mean is smaller than the arithmetic mean [106], thus the cyclist’s
    intuition will always have a positive bias (leading to frustration).


    In this case, the large time heuristic does not give a closed-form relationship
    between the two averages; however, a closed-form relationship can be obtained
    for the two distributions of speeds. Using the method in Example 7.4, one obtains


    ```

    $f_t(v) = \eta \frac{1}{v} f_k(v) \quad (7.14)$

    ```


    where $f_t(v)$ (resp. $f_k(v)$) is the PDF of the speed, sampled with the standard
    clock (resp. km clock) and $\eta$ is a normalizing constant; $f_t puts more mass
    on the small values of the speed $v$. This is another explanation to the cyclist’s
    paradox.'
