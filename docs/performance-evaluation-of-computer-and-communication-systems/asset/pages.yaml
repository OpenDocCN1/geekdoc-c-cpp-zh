  md: '# Case Study


    We apply bottleneck analysis. Let $\lambda$ be the throughput of the skilift,
    $S$ the time spent serving one customer at the lift, $Z$ the time spent going
    up on the lift or down on the slope and $W$ the average waiting time at the lift.
    We have


    ```

    $$M(IF+S+Z) \quad V \n \frac{A}{c}$$

    ```


    and $S$ is assumed to be negligible as compared to $Z$. Consequently,


    ```

    $$W \geq \max\left(\frac{N}{c}-Z,0\right)$$

    ```


    Figure 8.23 shows the approximate bound as a function of $\frac{1}{c}$ for the
    sake of comparison with Figure 8.7. Points obtained by mean value analysis are
    also plotted and we see that the bound is in fact very good approximation.


    This strongly suggests that the function $f$ that maps $\frac{1}{c}$ to the average
    response time is convex; the graph of a convex function is below its chords, thus


    ```

    $$f\left(\frac{1}{2c}\right) < \frac{1}{2}\left(\frac{1}{c}\right)$$

    ```


    and doubling the capacity reduces the waiting time by more than 2.


    We also see that a key value is $c^*=\frac{N}{\lambda}$. Note that $\frac{1}{2}$
    is the rate at which one customer would arrive at the gate if there was no queue,
    thus $c^*$ is the rate of customers under the condition that the gate would not
    delay them. If $c$ is much larger than $c^*$, the waiting time is small, and doubling
    of the capacity would have little effect. For $c$ much smaller than $c^*$, the
    waiting time increases at an almost constant rate. We should target $c$ on the
    order of $c^*$. In other words, we should match the capacity of the gate to the
    “natural” rate $c^*$.


    QUESTION 8.15 Assume that the system is highly congested before doubling the capacity.
    What is the reduction in waiting time after doubling the capacity?^{(20)}$


    # 8.9.4 Queuing Network Analysis


    We can model the network in Figure 8.23 as a single class, closed product form
    queuing network as in Figure 8.24. There is no specific assumption on the time
    spent on the (“think time”); in contrast we need to assume that the service time
    at the gate is exponentially distributed. Let $S$ be the mean service time at
    the gate and $B$ the number of servers, so that $c=\frac{B}{S}$. The mean service
    time at the IS station is $Z$.


    > ^{(20)}For a highly congested system ($2c$ much smaller than $c^*$) the offset
    at 0 becomes negligible and the response time is almost linear in $\frac{1}{c}$.
    Thus, doubling the capacity reduces the waiting time by 2, roughly speaking –
    but the system remains congested after doubling the capacity.'
