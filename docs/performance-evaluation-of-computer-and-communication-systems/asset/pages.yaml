    We compute $\eta$ such that the size of the test is $\alpha$. Under $H_0, T(X)$
    has a student distribution $t_{n-1}$ (Theorem 2.3). Thus


    ```

    $\eta = t_{n-1}^{-1}\left(\frac{\alpha}{2}\right)$ $\quad (4.5)$

    ```


    For example, for $\alpha = 0.05$ and $n = 100$, $\eta = 1.98$. The p-value is


    ```

    $p^* = 2(1 - t_{n-1}(T(\tilde{X})))$ $\quad (4.6)$

