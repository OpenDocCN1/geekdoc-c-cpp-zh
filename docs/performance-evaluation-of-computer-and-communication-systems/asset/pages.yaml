  md: '# 1.3 Evaluation Methods


    Once goal, load, metric and factors are well defined, the performance evaluation
    can then proceed with a solution method, which usually falls within one of the
    three cases below. Which method use depends on the nature of the problem and the
    skills or taste of the evaluation team.


    +   - Measurement of the real system. As in physics, it is hard to carry out a
    measurement without disturbing the system. Some special hardware devices (e.g.
    optical splitters in network links) sometimes prevent any disturbances. If, in
    contrast, measurements are taken by the system itself, the impact has to be analyzed
    with caution. Measurements are not always possible (for, if the system does not
    yet exist).

    - Discrete Event Simulation: a simplified model of the system and its load are
    implemented in software. Time is simulated and flows several orders of magnitude
    slower than real time. The performance of interest is measured as on a real system,
    but measurement side-effects are usually not present. It is often easier than
    a measurement study, but not always. It is the most widespread method and is the
    subject of Chapter 6.

    - Analytical method: a mathematical model of the system is analyzed numerically.
    This is viewed by some as a special form of simulation. It is often much faster
    than a simulation, but sometimes requires assumptions to be made in order for
    the numerical procedures to be applicable. Analytical methods are frequently used
    to gain insight during a development phase, or also to learn fundamental facts
    about a system, which we call “patterns”. We demonstrate in Chapter 8 how certain
    performance analyses can be solved approximately in a very simple way, by means
    of bottleneck analysis.


    # 1.4 The Scientific Method


    The scientific method can be applied to any technical work, not only to performance
    evaluation. However, in the author’s experience, the lack of scientific methods
    is a prominent cause for failed performance studies. In short, the scientific
    method requires one not to believe in a conclusion unless it is thoroughly tested.


