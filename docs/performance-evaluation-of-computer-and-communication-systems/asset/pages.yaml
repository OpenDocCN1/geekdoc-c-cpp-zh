    # Testing for additive change of variable


    By an change of variable, we can extend the ANOVA framework to the case where
    $M_0 \subset M$ are affine (instead of linear) varieties of $\mathbb{R}^R$. This
    includes testing for a specific value. For example, we assume that the model


