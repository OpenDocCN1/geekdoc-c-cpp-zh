  md: '# Random Number Generators


    other generators with much longer periods, for example the “Mersenne Twister”
    [67] with a period of $2^{19,937}$ – 1. Such generators use chaotic sequences
    and combinations of them.


    There is no such thing as a perfect pseudo-random number generator; only truly
    random generators can be perfect. Such generators exist: for example, quantum
    mechanics generator is based on the fact that the state of a photon is believed
    to be truly random. For a general text on random numbers, see [59]; for software
    implementing generators, see [60] and L Euyer’s home page. For a general discussion
    of generators in the framework of simulation, see [40]. Figure 6.6 illustrates
    a potential problem where the random number generator does not have a long enough
    period.


    # Using a Random Number Generator in Parallel Streams


    For some (obsolete) generators, in Example 6.9, the selection of small seed values
    in parallel streams may introduce a strong correlation (when in fact we would
    like the streams to be independent).


    # Example 6.10 Parallel Streams with Incorrect Seeds


    Assume that we need to generate parallel streams of random numbers. This is very
    frequent in discrete event simulations; we may want to have one stream for the
    arrival process, and a second for the service process. Assume that we use the
    linear congruential generator of Example 6.9 and generate two streams $x_n$ and
    $x''_n$ with seeds $s=1$ and $s''=2$. Figure 6.7 shows the results: the two streams
    are strongly correlated. In contrast, tracking $s''$ the last value $x_N$ of the
    first stream does not give rise to this problem.


    As mentioned above, more modern generators do not have this problem either.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_212_0.png)


    **Figure 6.7 $x_n$ versus $x''_n$ for two streams generated by the linear congruential
    generator in Example 6.9. (a) Seed values are 1 and 2, (b) seed values are (1,
    last value of first stream).'
