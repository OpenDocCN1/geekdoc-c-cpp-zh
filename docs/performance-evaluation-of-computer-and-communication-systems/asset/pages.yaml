    The following example is important for understanding the difference between least
    square and $\ell^1$ norm minimization.


    # Example 3.5 Mean versus Median


    Assume that we want to fit a data set $y_i, i=1, \dots, I$ against a constant
    $\mu$.

    With least square fitting, we are looking for $\mu$ that minimizes $\sum_{i=1}^I(y_i
    - \mu)^2$. The solution is easily found to be $\mu = \frac{1}{I}\sum_{i=1}^I y_i$,
    i.e. $\mu$ is the sample mean.


    With $\ell^1$ norm minimization, we are looking for $\mu$ that minimizes $\sum_{i=1}^I|y_i
    - \mu|$. To see why, consider the mapping $f: \mu \to \sum|y_i - \mu|$. To simplify,
    consider the case where all values $y_i$ are defined and increase in order ($y_i
    < y_{i+1}$). The derivative $f''$ of $f$ is defined everywhere except points $y_i$,
    and for $y_i < \mu < y_{i+1}, f''(\mu) = i-(I-i) = 2i-I$. By continuity, if $I$
    is odd, $f$ decreases on $(-\infty, y_{(I+1)/2})$ and has a minimum for $\mu =
    y_{(I+1)/2}$, which is the sample median. If $I$ is even, $f$ is at a minimum
    for values in the interval $[y_{I/2}, y_{I/2+1}]$ and reaches the minimum at the
    sample median $y_{I/2}$


    In terms of computation, $\ell^1$ norm minimization is more complex than least
    squares, though both are tractable. For instance, the dependency on the parameter
    is linear, least square fitting consists in solving a linear system of equations
    whereas $\ell^1$ norm minimization uses linear programming (as shown in the next
    section).'
