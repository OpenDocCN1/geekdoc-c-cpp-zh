  md: '# PERFORMANCE EVALUATION OF COMPUTER AND COMMUNICATION SYSTEMS


    Jean-Yves Le Boudec


    Performance evaluation is a critical stage of software- hardware-system development
    that every computer engineer and scientist should master. Although requiring skills
    in mathematics, measurement techniques and simulation – performance evaluation
    is primarily an art; indeed, the most difficult stage in a performance analysis
    is defining the approach: once you know what to do, it is less difficult to define
    a plan of attack with your familiar software tools.


    We present a set of topics, which we believe should be part of every engineer''s
    intellectual toolkit. This includes the statistical exploitation of numerical
    results in an efficient and ethical way, for example: how to summarize variability
    or fairness; what transient removal in a simulation is; and how to make predictions
    from a time series. We also present well-known performance patterns, which helps
    to quickly bring the engineer to the main issues. For queuing theory, we focus
    on a set of very useful results, such as operational laws. A highlight of the
    book is the development of Palm calculus, also called “the importance of the viewpoint,”
    which is central to queuing theory. Indeed, this topic has so many applications
    to simulation and system analysis in general that it is a very good time investment.


    This book began as a set of lecture notes for a course at EPFL. It contains all
    the material needed by an engineer who wishes to master the theoretical foundations
    of performance evaluation and then evaluate the performance of a real computer
    or communication system.


    JEAN-YVES LE BOUDEC is professor at EPFL and fellow of the IEEE. He graduated
    from Ecole Normale Superieure de Saint-Cloud, Paris, and received his doctorate
    in 1984 from the University of Rennes, France. Before joining the EPFL in 1994,
    he worked at Bell Northern Research, Ottawa, Canada; and at the IBM Zurich Research
    Laboratory where he was manager of the Customer Premises Network Department. His
    interests are in the performance and architecture of communication systems. He
    is recipient of numerous awards, including the 2008 IEEE Communications Society
    William R. Bennett Prize in the Field of Communications Networking.


