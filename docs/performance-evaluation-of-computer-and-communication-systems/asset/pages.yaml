    # 7.4 Simulation Defined as Stochastic Recurrence


    # 7.4.1 Stochastic Recurrence, Modulated Process


    Recall (Chapter 6) that a stochastic recurrence is defined by a sequence $Z_n$,
    $n \in \mathbb{Z}$, (also called the modulator state at the $nth$ epoch) and a
    sequence $S_n > 0$, interpreted as the duration of the $nth$ epoch. The state
    space for $Z_n$ is arbitrary, and not necessarily finite or even countable. We
    assume that $(Z_n, S_n)$ is random, but stationary^{(2)}$ with respect to the
    index $n$. As usual, we do not assume any of independence.


    We are interested in the modulated process $(Z(t), S(t))$ defined by $Z(t) = Z_n,
    S(t) = S_n$ whenever $t$ belongs to the $nth$ epoch (i.e. when $T_n \le t < T_{n+1}$).
    We would like to apply Palm calculus to $(Z(t), S(t))$.


    # Example 7.14 Loss Channel Model


    A path on the network is modeled as a system, where the packet loss ratio at time
    $t$, $p(t)$ depends on a hidden state $Z(t) \in \{1, \dots, I\}$ (called the modulator
    state). During one epoch, the modulator remains in some fixed state, say $i$,
    and the packet loss ratio is constant, say $p_i$. At the end of an epoch, the
    modulator changes state and a new epoch starts.


    Once in a while, we send a probe packet on this path, and we measure the time
    average loss ratio $p$. How does it relate to $p_i$? Apply the inversion formula


    ```

    $$\tilde{p} = \frac{\sum_i \pi_i^0 p_i \tilde{S}_i}{\sum_i \pi_i^0 \tilde{S}_i}$$

    ```


    > (2)This means that the joint distribution of $(Z_n, S_n, \dots, Z_{n+m}, S_{n+m})$
    is independent of $m$.'
