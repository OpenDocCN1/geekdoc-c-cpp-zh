  md: '# Model Fitting Criteria


    answer is to require that the model minimizes some metric of the discrepancy between
    the explanatory model and the data. A very common metric is the mean square distance
    $\sum(y_i - f_i(t_i))^2$. The value of the growth rate $\alpha$ in the previous
