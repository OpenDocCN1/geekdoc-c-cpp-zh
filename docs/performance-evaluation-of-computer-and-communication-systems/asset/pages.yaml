    as as simple as possible, but the result is rather complex, as there exists description
    complexity.


    We give a unified treatment of queuing networks; we discuss items such as the
    MSCCCC station, a powerful model for concurrency in hardware or software, or Whittle
    networks, which are used to model bandwidth sharing in the Internet. This latter
    type of network is traditionally presented as a type of its own, a non product
    form queuing network. We demonstrate that it must not be so: all of these are
    instances of the general theory of multi-class product form queuing networks.
    Presenting the results in this way simplifies the student’s job, as there is only
    a single framework to learn, instead of several deparate results. It is also more
    powerful as it provides new ways of combining existing building blocks.


    Finally, we illustrate in an example how the four separate topics can be articulated
    and provide different insights in the same performance question.


    # 8.1 Deterministic Analysis


    # 8.1.1 Description of a Queuing System with Cumulative Functions


    A deterministic analysis is often very simple, and provides first insights in
    this toolbox queuing system. Perhaps the simplest, and most efficient tool in
    this is the use of cumulative functions for arrival and departure counts, which
    we explain now. For a deeper treatment, see [51] and [23].


    Consider a system that is viewed as a black box. We make no specific assumptions
    about its operation; it may be a network node, an information system, etc. The
    cumulative functions are


    +   * $A(t)$ (input function): amount of work that arrives into the time interval
    $[0, t]$.

    * $D(t)$ (output function): amount of work done in the time interval $[0, t]$.


    Assume there is some time $t_0 \le 0$ at which $A(t_0) = D(t_0) = 0$. We interpret
    $t_0$ as an instant when the system is empty. The main observations are the:


    +   * $Q(t) := A(t) - D(t)$ is the backlog (unfinished work) at time $t$.

    * Define $D(t) = \min\{u \ge 0 : A(t) \le D(t+u)\}$ (horizontal deviation on Figure
    8.1). If there is no loss of work (no incoming work is rejected) and if the system
    is in first, first out (FIFO), then $d(t)$ is the response time for a hypothetical
    atom of work that would arrive at time $t$.'
