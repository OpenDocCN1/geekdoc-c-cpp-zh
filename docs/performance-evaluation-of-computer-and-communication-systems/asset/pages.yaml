  md: 'We see, for example, that configuration A is better than B but that it is not
    better than D. There are two non-dominated configurations: A and D. A is better
    with regard to power consumption, whereas D is better when it comes to throughput
    and response time.


    The numerical values can be visualized on a Kiviat Diagram (also called Spider
    Plot) as in Figure 1.1.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_23_0.png)


    **Figure 1.1** A visualization of the data in Example 1.3 by means of a Kiviat
    Diagram. Configurations A and D are non-dominated.


    # 1.1.3 The Different Goals of Performance Evaluation


    The goal of a performance evaluation may either be a comparison of design alternatives.
    i.e. quantifying the improvement over some design option, or system dimensioning.
    i.e. determining the size of all system components for a given planned utilization.
    A comparison of designs requires a well-defined load model; however, the exact
    value of its intensity does not have to be identified. In contrast, system dimensioning
    requires a detailed estimation of the load intensity. As for all prediction exercises,
    this is very hazardous. For any performance evaluation, it is important to know
    whether the results depend on a workload prediction or not. Simple forecasting
    techniques are discussed in Chapter 5.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Example 1.4 Different Goals


    QUESTION 1.1 Determine the nature of the goal for each of the following performance
    evaluations statements:^{(1)}


    +   (1) PC configuration 1 is 25% faster than PC configuration 2 when running
    Photoshop.


    +   (2) For your video on demand application, the number of required servers is
    35, and the number of disk units is 68.


    +   (3) Using the new version of sendfile() increases the server throughput by
    51%.


    The benefit of a performance evaluation study has to be weighted against its cost
    as well as that of the system. In practice, detailed performance evaluations are
    carried out by product development units (system design). During operation, it
    is not economical (except for high systems as public communication networks) to
    do. Instead, manufacturers provide *engineering rules*, which capture the relation
    between the load intensity and performance. Example (2) of above Question 1.1
    is probably replaced by an engineering rule such as:


    # Example 1.5 Engineering Rule


    For your video-demand application, the number of required servers is given by
    $N_1 = \frac{R}{39.3+3.6}$ and the number of disk units by $N_2 = \frac{R}{19.0+2.4}$,
    where $R$ (resp. $B$) is the number of residential (resp. business) customers
    $[x]$ i.e. the smallest integer $\ge x$.


    This book deals with the techniques of performance evaluation that apply to all
    such cases. However, how to implement a high performance system (e.g. how to efficiently
    code a real time application in Linux) or how to design bug-free systems are *beyond*
    its scope.


    # 1.2 Factors


    After defining the goal, load and metric, one needs to establish a list of *factors*.
    These are the system elements or the load affecting the performance. One is tempted
    to focus only on the factor of interest, however, it is important to know all
    factors that may impact the performance measure, whether they are desired or not.


    # Example 1.6 Windows versus Linux, Continued


    In [25], Chen and co-authors consider the following external factors: background
    activity; multiple users; network activity. These were reduced to a minimum by
    shutting down the network and allowing only


    > ^{(1)}(1), (3) are comparisons of design options; (2) involves dimensioning.'
