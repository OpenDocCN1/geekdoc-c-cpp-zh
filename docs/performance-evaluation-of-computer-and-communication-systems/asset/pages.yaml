    = 1$. The first one, is obtained by the matlab commands $Z=randn(1,n)$ and $X=filter([1\
    -0.4\ +0.95], [1\ 0.4\ -0.45], Z)$.


    # ARMA Process as a Gaussian Process


    Since an ARMA process is defined by linear transformation of a Gaussian process
    $\epsilon_t$, it is itself a Gaussian process. Consequently it is entirely defined
    by its mean $E(X_t) = \mu$ and its covariance. The latter can be computed in many
    number of ways, which of the simplest is obtained by noticing that


    ```

    $X_t = \mu + h_0\epsilon_t + \dots + h_{t-1}\epsilon_1$

    ```


    where $h$ is the impulse response of the filter in (5.23). Note that, with our
    convention, $h_0 = 1$. It follows that, for $t \ge 1$ and $s \ge 0$, we have


    ```

    $cov(X_t, X_{t+s}) = \sigma^2 \sum_{j=0}^{t-1} h_j h_{j+s}$

    ```


    For large $t$


    ```

    $cov(X_t, X_{t+s}) \approx \sigma^2 \sum_{j=0}^{\infty} h_j h_{j+s}$

    ```'
