  md: '# 322 Queuing Theory for Those who cannot Wait


    acquires a class, which corresponds to the network path followed by the session
    (there is one class per possible path). A flow of class $c$ has a service requirement
    drawn from any distribution with finite mean $S_c$. The network shares its resources
    between paths according to "bandwidth" allocation strategy. Let $\mu_c(\vec{n})$
    be the rate allocated to class-c flows, where $\vec{n} = (n_1, \dots, n_c)$ and
    $n_c$ is the number of class $c$ flows present in the network. We assume that
    it is derived from a balance function $\Phi$, i.e.


    ```

    $$\mu_c(\vec{n}) = \frac{\Phi(\vec{n}-\vec{e}_c)}{\Phi(\vec{n})}$ (8.91)$

    ```


    All flows in the same class share the bandwidth allocated to this class fairly,
    i.e. according to processor sharing.

    When a flow completes, it either leaves the network, or mutates and becomes a
    session in think time. The think time duration has any distribution with a finite
