  md: '# 7.5 Application to Markov Chain Models and the PASTA Property


    In this section, we consider a stochastic process $S(t)$ (the state of the simulation)
    that can be expressed as a Markov chain, in discrete or continuous time. Formally,
    this means that the state at time $t$ contains all information for advancing the
    simulation. Most simulations we perform in computer fall within this framework,
    since the simulation program uses only information available in memory. This does
    not mean that Markov models are always the best models for analyzing a problem,
    as the state space may be prohibitively large. But it provides a convenient framework
    for reasoning about what we are doing, enough what the PASTA property means (Section
    7.5.2). In this section, we limit ourselves to Markov chains over a finite state
    space, as this provides considerable simplifications.


    In an appendix of this chapter (Section 7.6), we give a quick review of Markov
    chains. There are many very good books on the topic; see for example [21], [108]
    and [17].


    # 7.5.1 Embedded Sub-Chain


    If we observe a Markov chain just after some selected transitions, we obtain an
    *embedded sub-chain*, which is itself a discrete time Markov chain, clocked by
    the selected transitions. We explain in this section how to compute all elements
    of the embedded subchain, in particular the Palm probabilities for events observed
    with the clock of the embedded subchain.


    Consider first discrete time. $S(t)$ is a stationary Markov chain with ergodic
    state $S$. We are interested in observing the transitions of $S(t)$, which is
    equivalent to observing the process $(S(t-1), S(t))$. Note that this is also a
    Markov chain. Let $\mathcal{F}_0 \subset S^2$ be a subset of possible transitions,
