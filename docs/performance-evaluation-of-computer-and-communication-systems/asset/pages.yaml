    # Example 7.20 A Poisson Process that does not satisfy PASTA


    The PASTA theorem requires the event process to be Poisson and independent of
    the current state. Here is an example of a Poisson process that does not satisfy
    this assumption, and thus does not enjoy the PASTA property.


    Construct a simulation as follows. Requests arrive as a Poisson process of rate
    $\lambda$, into a single server queue. Let $T_n$ be the arrival time of the $n$th
    request. The service time of the $n$th request is assumed to be $\frac{1}{T_{n+1}-T_n}$.
    The service times are thus exponential with the mean but not independent of the
    arrival process. Assuming that the system is initially empty, there is 1 customer
    during half of the time, and 0 customers otherwise. Thus, time-average distribution
    of the queue length $X(t)$ is given by $P(X(t)=0) = P(X(t)=1) = 0.5$ and $P(X(t)=k)=0$
    for $k \ge 2$. In contrast, the queue is always empty when a customer arrives.
    The Palm distribution of the queue length before an arrival is different from
    the time average distribution of the queue length.


    The arrival process does not satisfy the independence assumption: at a time $t$
    when the queue is not empty, we know that there cannot be an arrival. The probability
    that an arrival occurs during a short time slot depends on the global state of
    the system.


    # Application to measurements


    The PASTA property shows that sampling a system at random observation instants,
    distributed like a Poisson or Bernoulli process, independent of the system state,
    provides an unbiased estimator of the time average distribution.


