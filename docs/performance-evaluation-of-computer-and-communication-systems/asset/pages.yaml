  md: '# Model Fitting


    In this chapter, we study how to derive a model from data, e.g. fitting a curve
    to a series of measurements. The method of least squares is widely used, and gives
    simple, often linear algorithms. However, it should be employed with care, as
    it leads to the hidden assumption that error terms are Gaussian with equal variance.
    We also discuss a less known alternative $l^1$ norm minimization, which implicitly
    assumes that error terms have a Laplace instead of Gaussian distribution. The
    resulting algorithms may be less simple, but are often tractable, as they correspond
    to convex (rather than linear) optimizations, and the method is more robust to
    outliers or wrong distributional assumptions.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_86_0.png)


    We deal in detail with the so-called “linear models”; here it is the dependence
    on the hidden parameters that is linear, not the model itself. This is a very
    rich family of models with a wide applicability. We discuss both least square
    and $l^1$ norm minimization in this context.


    Subsequently, we bring up the issue of fitting a distribution to a data set; we
    describe commonly used features that are helpful when selection an appropriate
    distribution: distribution shape, power laws, fat tail and heavy tail. The latter
    property is often encountered in practice and provides interesting (or annoying)
    properties. We illustrate the use of such features in a load generation tool.'
  merge: -1
  pgno: 86
