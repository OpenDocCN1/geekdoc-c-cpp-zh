    given distribution $F(.)$. A traditional method is to compare the empirical histogram,
    known as the simple goodness of fit test, as the null hypothesis applies for a
    given, fixed distribution $F(.)$ (as opposed to a family of distributions, which
    would give a composite goodness of fit).


    To compute the empirical, we partition the set of values of $\tilde{X}$ into bins
