  md: '# Gaussian Random Vectors in $\mathbb{R}^n$


    # C.1 Notation and a Few Results of Linear Algebra


    # C.1.1 Notation


    Unless otherwise specified, we view a vector in $\mathbb{R}^n$ as a column vector,
    and denote identifiers of vectors with an arrow, as in


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_382_0.png)


    The identity matrix is denoted with Id.


    Matrix transposition is denoted with $T$, giving, for example, $\vec{X}^T = (X_1,
    \dots, X_n)$ and $\vec{X} = (X_1, \dots, X_n)^T$.


    The *inner product* of $\vec{u}, \vec{v} \in \mathbb{R}^n$ is


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_382_1.png)


    The *norm* of $\vec{u}$ is, otherwise specified, the Euclidean norm, i.e.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_382_2.png)


    An *orthogonal matrix* $U$ is one that satisfies any one of the following equivalent
    properties:


    +   (1) its columns have unit norm and are orthogonal;


    +   (2) its rows have unit norm and are orthogonal;


    +   (3) $UU^T = Id;


    +   (4) $U^T U = Id;


    +   (5) $U$ has an inverse and $U^{-1} = U^T$.'
