  md: '# The Scientific Method


    a final statement. Following Popper''s philosophy of science [82], we claim that
    it is necessary for the performance analyst to take on two roles:


    +   (1) to make tentative statements, and


    +   (2) to design experiments attempting to invalidate them.


    # Example 1.10 ATM UBR better than ATM ABR


    In [66], the authors evaluate whether the ATM-UBR protocol is better than ATM-ABR
    (both alternative methods for managing switches used in communication networks).
    They employ a typical scientific method, by posing each potential conclusion as
    a hypothesis and designing experiments with the aim of invalidating them.


    ABSTRACT. We compare the performance of ABR and UBR for providing high-speed network
    connections for TCP traffic. We test the hypothesis that UBR with adequate buffering
    in the ATM switches results in better overall goodput for TCP traffic than explicit
    rate ABR for LAN connection. This is shown to be true in a wide selection of scenarios.
    Four phenomena that may lead to bad ABR performance are identified and we test
    each of these has a significant impact on TCP goodput. This reveals that the extra
    delay incurred in the ABR end-systems and the overhead of RM cells account for
    the difference in performance. We test whether it is better to use ABR for push
    congestion to the end-systems in a parking-lot scenario or whether we allow congestion
    to occur in the network. Finally, we test whether the presence of a “multiplexing
    loop” causes performance degradation for ABR and UBR. We find our original hypothesis
    to be true in all cases. We observe, however, that ABR is able to improve performance
    when the buffering inside the ABR part of the network is small compared to that
    available at the ABR end-systems. We also see that ABR allows the network to control
    fairness between end-systems.


    Other aspects of the scientific method are to:


    +   Give an evaluation of the accuracy of your quantitative results. Consider
    the measured data in Example 1.11. There is much variability in them, and claiming
    that the average response time is better with B than A is not sufficient. It is
    necessary to use uncertainty margins, or confidence intervals. Techniques for
    these are discussed in Chapter 2.


    +   Make the results of your performance evaluation easily reproducible. This
    implies that all assumptions should be made explicit and documented.


    +   Remove what can be removed. Often, at the end of a performance evaluation
    study, many results are found uninteresting. The correct thing to do would be
    to remove such results, but this seems difficult in practice !'
