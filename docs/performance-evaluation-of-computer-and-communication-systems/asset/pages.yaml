  md: '# Summarizing Performance Data and Confidence Intervals


    In most measurements or simulations, we obtain large amounts of data. Displaying
    the data correctly is important, and implies utilizing various graphical packages,
    or math packages with graphical capabilities (Different tools have varying capabilities,
    and produce graphics of different aesthetic value; but the most important is to
    use a tool that you are familiar with). Tools do not do everything and you need
    to know what to represent. Here, we discuss important and frequent summarizations
    that can be employed to display and compare data: the complete distribution; summarized
    quantities such as means, standard deviations, medians and tail quantiles; as
    well as fairness indices.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_42_0.png)


    We discuss certain properties of these summarizations and indices; they are not
    all equivalent, and some, though less frequently used, are preferable if one has
    a choice.'
