  md: '# 7.2 Palm Calculus


    Palm calculus is a branch of probability that applies to stationary points. We
    give an intuitive, but rigorous, treatment. A complete mathematical treatment
    can be found for example in [4] and [88] or in [95] in the context of continuous
    time Markov chains.


    # 7.2.1 Hypotheses


    We assume that we are observing the output of a simulation, which we interpret
    as a sample of a stochastic process $S(t)$. The time $t$ is either discrete or
    continuous. This process is stationary if, for any $n$, any sequence of $t_1 <
    t_2 < \dots < t_n$ and any time shift $u$, the joint distribution of $(S(t_1+u),
    S(t_2+u), \dots, S(t_n+u))$ is independent of $u$. In other words, the process
    does not change statistically as it gets older. In practice, stationarity occurs
    if the system has a stationary regime and we let the simulation run long enough
    (Chapter 6).


    We also assume that at every time $t$, we are able to make an observation $X(t)$
    from the simulation output. The value of $X(t)$ may be in any space. We assume
    that the process $X(t)$ is jointly stationary with the simulation state process
    $S(t)$ (i.e. $(X(t), S(t))$ is a stationary process). Note that even if the simulation
    is stationary, one might easily define outputs that are not jointly stationary
    (such as: $X(t)=$ the most recent arrival time at an information server). A sufficient
    condition for $X(t)$ to be jointly stationary with $S(t)$ is


    +   (1) at every time $t$, $X(t)$ can be computed from the present, the past and/or
    the future of the simulation state $S(t)$, and

    (2) $X(t)$ is invariant under a change of the origin of times.


    For example, if an information server can be assumed to be stationary, then $X(t)$
    elapsed since the last request arrival time and $X(t)=$ the queue size at time
    $t$ satisfy the conditions.


    # 7.2.2 Definitions


    # Point Process


    We introduce now the definition of a stationary point process. Intuitively, this
    is the sequence of times at which the simulation performs a transition in some
    specified period.


    Formally, a stationary point process in our setting is associated with a subset
    $\mathcal{F}_0$ of the set of all possible transitions of the simulation. It is
    made of all time instants $t$ at which the simulation carries out a transition
    in $\mathcal{F}_0$, i.e. such that $(S(t^-), S(t^+)) \in \mathcal{F}_0$.


    In practice, we do not need to specify $\mathcal{F}_0$ explicitly. In contrast,
    we have a simulation in steady state and we consider times at which something
    of a'
