    Comment: The *sample median* of a data set is defined as follows. Assume there
    are data points $x_1,\dots,x_n$. Sort the points in increasing order and obtain
    $x_{(1)} \le \dots \le x_{(n)}$. If $n$ is odd, the median is $x_{(n+1)/2}$, otherwise
    $\frac{1}{2}(x_{(k)}+x_{(k+1)})$. More generally, the sample *q-quantile* is defined
    as


    ```

    $x_{(k'')},x_{(k''+1)}$ with $k'' = |qn + (1-q)|$ and $k'' = [qn + (1-q)]$

