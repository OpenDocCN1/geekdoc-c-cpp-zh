    # 3.4.2 Skewness and Kurtosis


    These are indices that may be used to characterize a distribution shape. They
    are defined for a distribution that has finite moments up to 4. The definition
    employs the *cumulant generating function (cgf)* of the distribution of a real
    random variable $X$:


    > $cgf(s) := \ln E(e^{sX})$


    Assume that $E(e^{|s_0|X|}) < \infty$ also for some $s_0$ that the above is well-defined
    for real $s$ around $s=0$. This implies that all moments are finite. Then, by
    a Taylor expansion:


    ```

    $cgf(s) = \kappa_1s + \kappa_2\frac{s^2}{2} + \kappa_3\frac{s^3}{3} + \dots +
    \kappa_k\frac{s^k}{k!} + \dots$$

    ```


    where $\kappa_k = \frac{d^k}{ds^k} cgf(0)$ is called the *cumulant of order $k$*.
    The first four cumulants:


    ```

    $$\begin{aligned}&\kappa_1 &= E(X) \\kappa_2 &= E(X-E(X))^2 = var(X) \\kappa_3
    &= E(X-E(X))^3 \\kappa_4 &= E(X-E(X))^4 - 3var(X)^2 \end{aligned} \quad (3.13)$

    ```'
