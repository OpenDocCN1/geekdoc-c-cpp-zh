  md: '# Proposition 5.6 Assume that the differenced data X = LY is fitted to ARMA(p,q)
    model with the mean $\mu$ as in Definition 5.1.


    (1) The $\ell$-step ahead predictions at time $t$, $\hat{X}_t(\ell)$, of the differenced
    data can be obtained for $t \geq 1$ from the recursion


    ```

    $$\begin{aligned} \hat{X}_t(\ell) &= -\mu + \phi_1(\hat{X}_t(\ell-1) - \mu) +
    \dots + \phi_{\rho}(\hat{X}_t(\ell-\rho)) - \mu \ &= C_1\hat{e}_t(\ell-1) + \dots
    + C_q\hat{e}_t(\ell-q) \end{aligned}$$\n\hat{X}_t(\ell) &= \begin{cases} X_{t+\ell}
    & \text{if } \ell \geq 1 \text{ or } t+\ell \geq 1 \ \mu & \text{if } t+\ell \leq
    0 \end{cases}$\n\hat{e}_t(\ell) &= \begin{cases} X_{t+\ell}-\hat{X}_{t+\ell-1}(1)
    & \text{if } \ell \leq 0 \text{ and } t+\ell \geq 2 \ X_1-\\mu & \text{if } t+\ell=1
    \text{ and } \ell<0 \end{cases}$

    ```


    In the recursion, we allow $\ell \leq 0$ even though we are eventually interested
    only in $\ell \geq 1$.


    (2) Alternatively, $\hat{X}_t(\ell)$ can be computed as follows. Let $(c_0=1,
    c_1, c_2,\dots)$ be the impulse response of $F^{-1}$. In such case,


    ```

    $$\hat{X}_t(\ell) - \c_1(\hat{X}_t(\ell-1) - \mu) - \dots - c_{\ell-1}(\hat{X}_t(1)
    - \mu) - c_{\ell}(\hat{X}_t - \mu) - \dots - c_{t+\ell}(x_{t_0}-\mu) \ell \geq
    1 (5.34)$

    ```


    where $(x_0,\dots,x_t)$ is the differenced data observed up to time $t$, and where
    $t_0$ is the length of the impulse response of the differencing and de-seasonalizing
    filter $L$.


    (3) The $\ell$-step ahead predictions at time $t$, $\hat{Y}_t(\ell)$, of the non-differenced
    data, using Prediction 5.2.


    (4) Let $(d_0,d_1,d_2,\dots)$ be the impulse response of the filter $L^{-1}$ and
    $F$


    ```

    $MSE^2(\ell) = \sigma^2(d_0^2 + \dots + d_{\ell-1}^2) (5.35)$

    ```


    A 95% prediction interval for $Y_{t+\ell}$ is


    ```

    $$\hat{Y}_t(\ell) \pm 1.96 MSE(\\ell) (5.36)$

    ```


    We use two steps for computing the point predictions: first for $X_t$, then for
    $Y_t$. One can wonder why, since is possible to utilize a single step, based on
    the fact that $Y = L^{-1}F$. The reason is numerical stability: since the initial
    values of $X_t$ (or equivalently, the past values $Y_t$ for $s \leq 0$) are not
    known exactly, there is some numerical error in items 1 and 2. We assume that
    $F^{-1}$ is stable, $c_m \rightarrow 0$ for large $m$, and consequently the values
    of $x_t$ for small $t$ do not influence the final value of (5.34). Indeed, the
    non-differenced data $x_t$ for small values of $t$ is not exactly known, as we
    made the simplifying assumption that $y_s=0$ for $s \leq 0$. This is why we remove
    the first $t_0$ data points of $x$ in (5.34).'
