    \ - \\mu)^2}{2\\sigma^2}$\n```\n\n$C$ is some constant (independent of the parameter).\
    \ For a fixed $s$, it is maximized by the MLE for a Gaussian sample\n\n```\n$\\\
    hat{\\mu}_s = \\frac{1}{n} \\sum_{i} b_s(x_i)\\n$\\hat{\\sigma}_s^2 = \\frac{1}{n}\
