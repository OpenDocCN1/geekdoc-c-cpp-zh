    truncated to 20,000 (i.e. all data points larger than this value are removed from
    the data set).

    Here, $F_0$ is the log-normal distribution with parameters $\mu$ and $\sigma$.
    Instead of brute force optimization, we can gain more insight in the following
    manner. We have maximize $\ell(\mu, \sigma)$ over $\mu \in \mathbb{R}$, $\sigma
    > 0$, with


    ```

    $$\ell(\mu, \sigma) = -n \ln(\sigma) - \frac{1}{2\sigma^2} \sum_{i=1}^n (\ln x_i
    - \mu)^2 - n \ln N_{0,1}(\mu + \ln a)$

    $- \frac{n}{2} \ln(2\pi) - \sum_{i=1}^n \ln x_i$\n(3.17)

    ```


    We can ignore the last two terms, which do not depend on $(\mu, \sigma)$. We can
    also do a change of variables by taking $\sigma, z$ as parameters instead of $\sigma,
    \mu$, with


    ```

    $z = \frac{\ln a - \mu}{\sigma}$

    (3.18)

    ```


    For a fixed $z$, the optimization problem has a closed solution by computing the
    derivative with respect to $\sigma$; the maximum likelihood is obtained for $\sigma
    = \hat{\sigma}(z)$ with


    ```

    $$\hat{\sigma}(z) = -\frac{\beta z + \sqrt{4s^2 + \beta^2(4 + z^2)}}{2}$

    (3.19)

    ```


    with


    ```

    $$\beta = \ln a - y_1 \quad y_1 = \frac{1}{n} \sum_{i=1}^n \ln x_i \quad s^2 =
    \frac{1}{n} \sum_{i=1}^n (\ln x_i - y_1)^2$

    ```


    and the corresponding value of the likelihood (called "profile log-likelihood")
    (we omit the constant terms in (3.17)):


    ```

    $pl(z) = -n [\ln(\hat{\sigma}(z)) - \frac{1}{2\hat{\sigma}(z)^2}(z - \beta)^2
    + s^2] - \ln N_{0,1}(z)]$\n(3.20)

    ```


    We need to minimize the square bracket as a function of $z \in \mathbb{R}$. This
    cannot be done in closed form, but it is numerically simple as it is a function
    of only one variable. Figure 3.13(c) shows $pl(z)$. There is a unique maximum
    at $z=0.4276$, which, with (3.19) and (3.18), gives


    ```

    $$\hat{\mu} = 9.3428 \quad \hat{\sigma} = 1.3114$

    ```


    Compare this to the method that would ignore the truncation. Since MLE is invariant
    change of scale, we can use the log of the data; we would estimate $\mu$ by the
    sample mean of the log of the data, and $\sigma$ by the standard deviation, and
    would obtain


    ```

    $$\hat{\mu}_n = 8.6253 \quad \hat{\sigma}_n = 0.8960$

    ```'
