    defined over the state of feasible buffer states, that $\Psi(B) > 0$ and the service
    rate allocated to a user $i$ in position $i$ of the state buffer


    ```

    $$\Psi(remove(B, i))\n\gamma(i, B) = \Psi(B)$ $$ (8.26)$

