    # Discrete Event Simulation


    Simulations are often regarded as the simplest, though the most time-consuming,
    performance evaluation method. However, even a simple simulation program may cause
    problems, for instance if one is not aware of what stationarity means, or if one
    is unaware of the potential problems that arise when a simulation does not have
    a stationary regime. We start by discussing this simple but important issue; the
    related topic of freezing simulations is presented in another chapter (Section
    7.4).


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_194_0.png)


    Subsequently, we describe two commonly used techniques for implementing a simulation,
    discrete events and stochastic recurrences, and discuss how confidence intervals
    can be applied to such settings. Next, we bring up Monte Carlo simulations, viewed
    here as a method for computing integrals or probabilities, and potential pitfalls
    regarding random number generators. Finally, we present practical techniques for
    sampling from a distribution (CDF inversion, rejection sampling).'
