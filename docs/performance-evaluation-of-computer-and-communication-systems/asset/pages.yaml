  md: "Practical relevance means that the difference $\\mu-\\mu_0$ is important for\
    \ the system under consideration. It may well be the case that a difference is\
    \ statistically significant (e.g. with a very large data set) but practically\
    \ irrelevant, and vice versa (e.g. when the data set is small).\n\nIn some cases,\
    \ tests can be avoided by employing confidence intervals. This applies to matching\
    \ pairs in Example 4.2: a confidence interval for the mean can be readily obtained\
    \ by Theorem 2.2. At the level 0.05, the confidence interval is $[15.9, 36.2]$,\
    \ and we can conclude that $\\mu > 0$ (and further that we have a lower bound\
    \ on $\\mu$).\n\nMore generally, consider a generic model parameterized with some\
    \ $\theta \\in \\Theta$ $\\mathbb{R}$. For testing\n\n+   $\theta = \theta_0$\
    \ against $H_1: \theta \neq \theta_0$\n\nwe can take that as the rejection region\n\
    \n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_133_0.png)\n\nIf $\theta \\pm c$ is\
    \ a confidence interval at level $1-\\alpha$, then the size of this test is precisely\
    \ a. For such cases, we do not need to use tests, since we can simply use confidence\
    \ intervals as discussed in Chapter 2. However, it is often difficult, even impossible,\
    \ to reduce a test to the computation of confidence intervals, for instance with\
    \ unpaired data in Example 4.1 (though it is possible to use confidence sets rather\
    \ than confidence intervals).\n\n# 4.2 Likelihood Ratio Tests\n\nIn this introduction\
    \ we introduce a generic framework, very frequently used for constructing tests.\
    \ It does not give UMP tests (as this is, in general, not possible), but the tests\
    \ are asymptotically UMP (under the conditions of Theorem 4.3). We give the application\
    \ to simple tests for paired data and for good of fit. Note that deciding which\
    \ test is best is controversial, and the best tests, in the sense of UMP, are\
    \ not always the likelihood ratio tests [61]. Note also that the issue of criterion\
    \ to use in order to decide that a test is disputed [79]. In our context, likelihood\
    \ ratio tests are appealing as they are simple and generic.\n\n# 4.2.1 Definition\
    \ of Likelihood Ratio Tests\n\nAssumptions and Notations\n\nWe have a nested model\
    \ setting, with $H_0 \\stackrel{\text{def}}{=} \theta \\in \\Theta_0$ whereas\
    \ $H_1 \\stackrel{\text{def}}{=} \theta \\in \\Theta$ (random variable) $\tilde{X}$\
    \ and observed vector $\tilde{x}$ of $\tilde{X}$, we define:\n\n+   $l_\theta(\t\
    heta) \\stackrel{\text{def}}{=} f_{\tilde{X}}(\tilde{x} \\mid \theta)$ where $f_{\t\
    ilde{X}}(\\cdot \\mid \theta)$ is the probability density of the model, when the\
    \ parameter is $\theta$."
