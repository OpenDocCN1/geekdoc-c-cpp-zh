  md: 'certain kind happens; the only important criterion is to make sure that the
    firing of a point is entirely determined by observing only the simulation. For
    example, we can consider point process the request arrival times at an information
    server.


    Technically, we also need to assume that the simulation process is such that the
    point process is simple, i.e. that, with probability 1, two instants of the point
    process cannot be equal (this is true in practice if the simulation cannot have
    several transitions at the same time), and non explosive, i.e. the expected number
    of instants over any finite interval is finite. The above implies that the instances
    of the point process can be enumerated and described as an increasing sequence
    of (random) times $T_n$, where $n$ is an integer, and $T_n < T_{n+1}$.


    In continuous time, to avoid ambiguities, we assume that all processes are right
    continuous, so that if there is a transition at time $t$, $S(t)$ corresponds to
    the state of the simulation just after the transition.


    The sequence $T_n$ is (as a thought experiment) assumed to be infinite both in
    the present and past, i.e. the index $n$ spans $Z$. With the terminology of Section
    7.1, $(T_n)_{n\in Z}$ is the sequence of ticks of the event clock.


    # The Arbitrary Point in Time


    Since the simulation is in the stationary regime, we imagine that, at time 0,
    it has been running for quite time past. Since the point process is defined in
    terms of transitions of the simulation state $S(t)$, it is also stationary. It
    is convenient, and customary, to denote the time instants of the point process
    $T_n$ such that


    > $... T_{-2} < T_{-1} \leq 0 \leq T_1 < T_2 < ...$ (7.15)


    In other words, $T_0$ is the last instant of the point process before time 0,
    and $T_1$ the next instant starting from time 0. This convention is the one used
    by mathematicians to give a meaning to "an arbitrary point in time": we regard
    $t=0$ as our "random" time instant. Thus, in some sense, we fix the time arbitrarily.


    This differs from the convention used in many simulations, where $t=0$ is the
    beginning of our simulation. Our convention, in this chapter, is that $t=0$ is
    the beginning of the observation period for a simulation that has a stationary
    regime and has run long enough to be in a steady state.


    # Intensity


    The intensity $\lambda$ of the point process is defined as the expected number
    of points per time unit. We have assumed that there cannot be two points at the
    same instant. In discrete or continuous time, the intensity $\lambda$ is defined
    as the unique number $N(t, t+\tau)$ of points during any interval $[t, t+\tau]$
    satisfies [4]


    > $E(N(t, t+\tau)) = \lambda\tau$ (7.16)'
