    where $B_H$ is fractional Brownian motion, $\lambda$ the traffic intensity, and
    $a$ a variance parameter. Fractional Brownian motion is a Gaussian process, with
    mean $\lambda t$ and variance $\lambda t^{2H}$. $B_H(t)$ is self-similar in the
    sense that the process $B_H(kt)$ has the same distribution as $k^H B_H(t)$. Assume
    that the $A_s$ are independent. It follows from the properties of fractional Brownian
    motion that $A(-t)$ is also fractional Brownian traffic. Its mean is $u\lambda$
    and its variance is $u\lambda t^{2H}$, thus it has the intensity $u\lambda$ and
    the same variance parameter $a$. According to Reich''s formula, we


    ```

    D(1,1,u) = \max_{t\geq0} \left(\\frac{A(t)}{c_0 u} - t\right) = \max\left((\frac{\lambda}{c_0}
