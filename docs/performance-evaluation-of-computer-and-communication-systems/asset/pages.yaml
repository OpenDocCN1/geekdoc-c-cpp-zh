    # Jarque-Bera


    The *Jarque-Bera* statistic is used to test whether an iid sample comes from a
    normal distribution. It uses the skewness and kurtosis indices $\gamma_1$ and
    $\gamma_2$ defined in Section 3.4.2. The test statistic is equal to $\frac{n}{6}(\hat{\gamma}_1^2
    + \frac{\hat{\gamma}_2}{2})$, the distribution of which is asymptotically $\chi^2_2$
    for a large sample size $n$. In the formula, $\hat{\gamma}_1$ and $\hat{\gamma}_2$
    are the sample indices of skewness and kurtosis, obtained by replacing expectations
    by sample averages in (3.13).'
