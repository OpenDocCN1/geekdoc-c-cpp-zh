    \n# 8.3.4 Single Queue with B Servers\n\nThe multiple server queue is defined\
    \ by the fact that a maximum of $B$ customers can be served in parallel. Thus,\
    \ the workload decreases at a rate up to $\\min(N(t), B)$, where $N(t)$ is the\
    \ number of customers in the queue. The utilization $\rho$ is now defined by $\r\
    ho=\\frac{\\lambda}{B}$. The stability condition is less simple than single server\
    \ queue. When $\rho < 1$, there is a stationary regime but it may not be unique\
    \ [3, 2.3]. When $\rho > 1$ there is no stationary regime.\n\n# M/M B Queue\n\n\
    For a more specific system, there is more to be said. A frequently used system\
    \ is the M M B queue, the system with Poisson arrivals, $B$ servers, exponential\
    \ service times and FIFO discipline. The system can be studied directly by solving\
    \ for the stationary probability. Here, when $\rho < 1$ there is a unique stationary\
    \ regime, which is also asymptotically when we start from arbitrary initial conditions;\
    \ for $\rho \\geq 1$, there is no stationary regime.\n\nWhen $\rho < 1$, the stationary\
    \ probability is given by\n\n```\n$$\\mathbb{P}(N(t)=k)=\begin{cases} \\frac{(B\\\
    rho)^k}{k!} & \\text{if } 0 \\leq k \\leq B \\ \\frac{B^B\\rho^k}{B!} & \\text{if\
    \ } k > B \\end{cases}$; (8.21)\n```\n\nwith\n\n```\n$$\\eta^{-1}=\\sum_{i=0}^{B-1}\\\
    frac{(B\\rho)^i}{i!} + \\frac{(B\\rho)^B}{B!(1-\\rho)}$$\n```\n\nand the stationary\
    \ CDF of the waiting time for any arbitrary customer is\n\n```\n$$\\mathbb{P}(W_0\
    \ \\leq x)=\\rho^{B(1-\\rho)/S}$\n```\n\nwith\n\n```\n$$\\p=\\frac{1-u}{1-\\rho\
    \ u} \\quad \\text{and} \\quad u=\\frac{\\sum_{i=0}^{B-1}\\frac{(B\\rho)^i}{i!}}{\\\
    sum_{i=0}^{B}\\frac{(B\\rho)^i}{i!}}$\n```\n\nThe probability of finding all servers\
    \ busy at an arbitrary point in time or at a customer arrival is (Erlang-C formula):\n\
    \n```\n$$\\mathbb{P}(\\text{all servers busy})=\\mathbb{P}(N(t) \\geq B)=p$ (8.22)\n\
    ```\n\n> (11)When the service time $x$ is equal to the mean service time $S$."
