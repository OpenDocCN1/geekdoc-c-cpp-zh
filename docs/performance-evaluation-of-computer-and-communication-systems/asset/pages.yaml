    ploys a larger socket buffer (16 K Bytes). The conclusion thus becomes inverted:
    the throughput decreases with the mobility. The hidden factor influences the final
    result: all experiments with low speed are for small socket buffer sizes. The
    socket buffer size is a hidden factor.


    Hidden factors may be avoided by a proper randomization of the experiments. In
    the example above, a proper design would have distributed the socket buffer sizes
    randomly with respect to the speed. This may not always be possible as certain
    experimental conditions may be imposed upon us; in such cases, all factors have
    to be incorporated in the analysis. In Figure 1.2, we fitted a linear regression
    to the two figures, using the method explained in Chapter 3. The slope of the
    linear regression is negative when we explicit the hidden factor, demonstrating
    that the mobility decreases the throughput.


    The importance of hidden factors may be interpreted as our tendency to mix cause
    and correlation [77]. In Figure 1.2(a) the throughput is positively correlated
    with the speed, but this should not be interpreted as a causal relationship.


    In conclusion at this point, knowing all factors is tedious, and necessary task.
    In particular, all factors should be incorporated, whether they interest you or
    not (factors that you have no interest in are called *nuisance factors*. This
    implies that you have to know your system well, or be assisted by people who do.


    # 1.2.2 Simpson’s Paradox


    *Simpson’s reversal,* also denoted *Simpson’s paradox.* is a well known case of
    the problem of hidden factors, when the performance metric is a success probability.


