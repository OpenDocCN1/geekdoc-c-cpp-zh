  md: "Since $\tilde{X} = U^T X'$, it follows that any Gaussian random vector is a\
    \ linear combination of exactly $r$ independent normal random variables, where\
    \ $r$ is the rank of its covariance matrix. In practice, one obtains such representation\
    \ by means of Choleski factorization. Let $\\vec{\\epsilon}$ be a Gaussian white\
    \ noise with unit variance and let $\\hat{Y} = L\\vec{\\epsilon}$. Then $\\hat{Y}$\
    \ is a Gaussian vector with covariance $\\Omega$ and $0$ expectation (and $\\\
    hat{Y} + \\vec{\\mu}$ is a Gaussian vector with expectation $\\vec{\\mu}$, for\
    \ any non-random vector $\\vec{\\mu}$). This is used to simulate a random vector\
    \ with any desired covariance matrix.\n\n# Example C.3\n\nOne Choleski farization\
    \ of $\\Omega$ in (C.12) is $\\Omega = LL^T$ with\n\n```\n$L = \\begin{pmatrix}\
    \ \\sqrt{a} & 0 & 0 \\ 0 & \\sqrt{b} & 0 \\ \\sqrt{a} & \\sqrt{b} & 0 \\end{pmatrix}$\n\
    ```\n\nLet $\\epsilon = (\\epsilon_1, \\epsilon_2, \\epsilon_3)$ be Gaussian white\
