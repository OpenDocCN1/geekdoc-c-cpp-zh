    # 3.4.5 Fitting a Distribution


    Fitting a distribution to a dataset is often a two-step process. First, a qualitative
    analysis is performed, where one attempts to get a feeling for the distribution
    shape, using a histogram. Here, one tries to make statements about the shape,
    the hazard rate or the existence of power laws. These are obtained by appropriate
    plots (histograms, qq-plots, empirical CDFs, etc). One can also try to determine
    whether a heavy-tailed distribution is the right model, for example the test tool
    described in Section 3.5. The goal is to obtain a set of candidate families of
    distributions.


    The second step is to fit the parameters of the distribution. If the data set
    can be assumed to come from an id sequence, the method of choice is the maximum
    likelihood estimation (MLE), as explained in Section B.1.2, and illustrated in
    the next example. In particular, MLE is invariant to re-parametrization and change
    of scale.


    If, as is frequent in practice, the data set may not be assumed to come from an
    id sequence, then there is no simple method. The maximum likelihood estimation
    is often used in practice, but no confidence interval for the estimated parameters
    can be obtained.


    # 3.4.6 Censored Data


    When fitting the distribution parameters, it may be important to account for the
    fact that some very large or small data values are not present, due to impossibilities
    of the measurement system (e.g. flow size durations may not measure very long
    flows). In statistics, this is called censoring.


    A technique for accounting for censoring is as follows. Assume that we know that
    the data is truncated to a certain unknown maximum, called a. The distribution
    for the data can be described by the PDF


    ```

    fx(x) = \frac{1}{F_0(a)}1{x\le a\} \quad (3.15)

    ```


    where f_0 (resp. F_0) is the PDF (resp. CDF) of the truncated distribution. The
    explanation behind (3.15) lies in the theory of rejection sampling (Section 6.6.2)
    which states that when one rejects the data samples that do not satisfy a condition
    (here X ≤ a), one obtains a random variable with PDF proportional to the non censored
    PDF, restricted to the set of values given by the condition. The term $\frac{1}{F_0(a)}$
    is the normalizing constant.'
