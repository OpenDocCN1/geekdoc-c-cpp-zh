  md: '# Model Fitting


    Both figures show that visually appears to be a good fit in one scale is not so
    good in the other. Which one should we use?


    An answer to the question can be obtained from statistics. The idea is to add
    to the explanatory model a description of the “noise” (informally defined as the
    deviation between the explanatory model and the data), which gives us a statistical
    model. We can also think of the statistical model as a description of a simulator
    that was used to produce the data we have. Its parameters are well defined, but
    not known to us.


    The statistical model usually has a few more parameters than the explanatory model.
    The parameters of the statistical model are estimated using the classical approach
    of maximum likelihood. If we believe in the statistical model, this answers the
    previous question by stating that the criterion to be optimized is the likelihood.
    The belief in the model can be verified by examining residuals.


    # Example 3.3 Virus Spread Data, a Statistical Model


    Preceding continued. One statistical model for the virus spread data is


    ```

    $Y_i = a e^{\alpha t_i} + \epsilon_i \quad \text{with} \ \epsilon_i \sim N_{0,\sigma^2}
    \quad (3.3)$

    ```


    In words, we assume that the measured data $y_i$ is equal to the ideal value given
    by the explanatory model, plus a noise term $\epsilon_i$. Further, we assume that
    all noises are independent, Gaussian, and with equal variance. The parameter is
    $\theta = (a, \alpha, \sigma).

    In (3.3), we write $Y_i$ instead of $y_i$ to express that $Y_i$ is a random variable.
    We think of $y_i$ as being one sample produced by a simulator that implements
    (3.3).

    We will see in Section 3.1.2 the maximum likelihood estimator for this model that
    minimizes the mean square distance. Thus, with this model, we obtain for $\alpha$
    the value in Example 3.1.

    A second statistical model could be:


    ```

    $$\ln(Y_i) = \ln(a e^{\alpha t_i} + \epsilon_i) \quad \text{with} \ \epsilon_i
    \sim N_{0,\sigma^2} \quad (3.4)$

    ```


    In this case, we assume that the noise terms in log-scale have the same variance,
    that the noise is proportional to the measured value. Here too, the maximum likelihood
    estimator is obtained by minimizing the least square distance, and we then obtain
    for $\alpha$ the value in Example 3.2.

    We can validate either model by plotting the residuals (Figure 3.4).

    We clearly see that the residuals for the former model do not appear to be normally
    distributed, and the inverse is true for the latter model, which is one we should
    adopt. Therefore, an acceptable fitting is obtained by minimizing least squares
    in log-scale.'
  merge: -1
