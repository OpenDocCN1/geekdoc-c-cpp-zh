    # Theorem 8.5


    Forced Flows. We apply Campbell''s formula. Let $F(s,t)$ be the random function
    which returns 1 if $t \ge s$ and the last customer who arrived before or at $-t$
    is in node $k$ at time $s$, returns 0. By definition of intensity,


    ```

    $$\lambda_k = E(\sum_{n \in \mathbb{Z}} F(-A_n, 0))$$

    ```


    where $A_n$ is the point process of customer arrivals. Campbell''s formula applied
    to $F(-t,0)$ gives


    ```

    $E(\sum_{n \in \mathbb{Z}} F(A_n, 0)) = \lambda \sum_{t \in \mathbb{N}} E''(F(t,0))
    = \lambda \sum_{t \in \mathbb{N}} E^0(F(0,t))$$

    ```


    where the last part is based on stationarity. Thus


    ```

    $$\lambda_k = \lambda E^0(\sum_{t \in \mathbb{N}} F(0,t)) = \lambda V_k$$

    ```


    Total Response Time. Let $N$ (resp. $N_k$) be the expected number of customers
    in the service system (resp. in node $k$). We have $N = \sum_k N_k$. Apply Little''s
    and the Forced Flows laws.


    # Theorem 8.20


    We consider a Kelly-Whistle station in isolation, i.e. connected to a unit rate
    per class, with $K_c$ customers of class $c$ in total. We want to show that local
    balance holds at the micro-level ($(8.96). (8.97)$). The micro-state of the station
    is $(\mathcal{B}, \mathcal{J})$, where $B_i$ is the class of customer in position
    $i \in \mathcal{I}$ of the station buffer and $\mathcal{J}_i$ is the phase for
    this customer, in the phase-type representation of service times. If there is
    no customer in position $i$, we let $B_i = \mathcal{J}_i = -1$. We assume that
    the index set $\mathcal{I}$ is enumerable, and that the initial number of occupied
    positions is finite, so that it remains finite for ever.'
