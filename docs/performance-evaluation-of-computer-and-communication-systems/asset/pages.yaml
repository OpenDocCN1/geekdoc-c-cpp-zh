    with $P_0 \neq 0$ is precisely


    ```

    $H(z) = \frac{Q_0 + Q_1 z^{-1} + \dots + Q_q z^{-q}}{P_0 + P_1 z^{-1} + \dots
    + P_p z^{-p}} \quad (D.24)$

    ```


    You may find it more convenient to use $z$-transforms and thus transfer functions
    if you do not feel comfortable manipulating the backshift operator $B$ (and vice-versa):
    if you do not do like transfer functions, use the backshift operator instead.


    # D.2 Stability


    A filter $F$ with impulse response $h_n$ is called $stable^{(2)}$ if and only
    if


    ```

    $\sum_{n=0}^{\infty} |h_n| < \infty \quad (D.25)$

    ```


    For a sequence $X \in S$, let $||X||_{\infty} = max_{t=1,\dots,length(X)} |X_t|$.
    If $F$ is stable and $Y=FX$ then


    ```

    $||Y||_{\infty} \leq M ||X||_{\infty} \quad (D.26)$

    ```


    where $M = \sum_{n=0}^{\infty} |h_n|$. In other words, if the input to the filter
    has a bounded magnitude, so does the output. In contrast, if $F$ is not stable,
    the output of the filter may become infinitely large as the length of the input
    increases. A stable filter has an impulse response $h_n$ that decays quickly as
    $n \to \infty$.


    For example, the filter in (D.21) is stable (as is any FIR filter) and the filter
    in (D.20) is not stable.


    In practice, if a filter is not stable, we may experience numerical problems when
    computing its output (Figure D.1).


    # D.3 Filters with Rational Transfer Function


    # D.3.1 Definition


    Filters with Rational Transfer Function are filters of the form in (D.23), or,
    equivalently whose transfer function has the form in (D.24), with $P_0 \neq 0$.
    Many filters used in practice are of this type. Note that


    ```

    $\frac{Q_0 + Q_1 B + \dots + Q_q B^q}{P_0 + P_1 B + \dots + P_p B^p} = \frac{Q''_0
    + Q''_1 B + \dots + Q''_q B^q}{P''_0 + P''_1 B + \dots + P''_p B^p}$

    ```


    with $Q''_m = \frac{Q_m}{P_0}$ and $P''_m = \frac{P_m}{P_0}$, so we can easily
    assume that $P_0 = 1$.


    > (2)or Bounded Input, Bounded Output (BIBO)-stable.'
