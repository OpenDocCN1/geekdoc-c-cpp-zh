  md: '# Event Averages


    We can interpret the Palm expectation and Palm probability as event averages if
    the process $X(t)$ is ergodic (note however that Palm calculus does not require
    ergodicity). Indeed, it follows from the definition of the Palm expectation that


    ```

    $E^0(\phi(X(0))) \approx \frac{1}{N} \sum_{n=1}^{N} \phi(X(T_n))$

    ```


    for large $N$.


    It can be shown [4] that if the process $X(t)$ is ergodic and integrable, then


    ```

    $\lim_{N\to\infty} \frac{1}{N} \sum_{n=1}^{N} \phi(X(T_n)) = E^0(\phi(X^0))$

    ```


    An equivalent statement is that, for any (measurable) subset $W$ of the set of
    values $X(t)$


    ```

    $P^0(X(t) \in W) = P^0(X(0) \in W) \approx$ fraction of points of the point process
    at which $X(t)$ is in $W$

    ```


    Thus the Palm expectation and the Palm probability can be interpreted as event
    averages. In other words, they are ideal quantities, which can be estimated by
    observing $X(t)$ sampled with the event clock.


    # 7.2.4 The Inversion and Intensity Formulas


    These formulas relate time and event averages. Also known under the name of Ryll-Nardzewski
    and Slivnyak''s formula, the inversion formula relates the time stationary and
    Palm probabilities. The proof of discrete time, a direct application of conditional
    probability, is given in Section 7.7.


    # Theorem 7.1 (Inversion Formula)


    +   • In discrete time:


    ```

    $E(X(t)) = E^0(X(0)) = E^0 \sum_{s=1}^{T_1} X(s) = E^0 \sum_{s=1}^{T_1-1} X(s)
    \quad (7.23)$

    ```


    +   • In continuous time:


    ```

    $E(X(t)) = E^0(X(0)) = E^0 \int_{0}^{T_1} X(s) ds \quad (7.24)$

    ```


    By applying the inversion to $X(t) = 1$, we obtain the following formula, which
    states the intensity of a point process is the inverse of the average time between
    points.'
