  md: "# Queuing Theory for Those who cannot Wait\n\nQUESTION 8.13 What is the relationship\
    \ between the sum in (8.52) and $\\eta^{?(16)}$\n\n# 8.5.2 Stability Conditions\n\
    \nIn the open case, stability is next guaranteed and may depend on conditions\
    \ on arrival rates. However, the next theorem states that the stability can be\
    \ verified at every station in isolation, and correspond to the natural conditions.\
    \ In particular, pathological instabilities as discussed in the introduction of\
    \ Section 8.4, cannot occur for multi-class product form queuing networks.\n\n\
    **Theorem 8.8 (Open Case)**nConsider a multi-class product form queuing network\
    \ as defined above. Assume that it is open. For every station $s$, $\\theta^s\
    \ =(\\theta_1, \\dots, \\theta_s)$ is the vector of visit rates, $f^s$ is the\
    \ station function and $G^s(\\cdot)$ is its generating function, given in (8.36),\
    \ (8.38), (8.44), and (8.46).\n\nThe network has a stationary distribution if\
    \ and only if for every station $s$\n\n$G^s(\\theta^s) < \\infty \\quad (8.53)$\n\
    \nIf this condition holds, the normalizing constant of Theorem 8.7 is $\\eta =\
    \ \\prod_{s=1}^S G^s(\\\theta^s)$. Further, let $P^s(\\\\vec{n}^s)$ be the stationary\
    \ probability of customers in station $s$.\n\n$P(\\vec{n}^1, \\dots, \\vec{n}^S)\
    \ = \\prod_{s=1}^S P^s(\\\\vec{n}^s) \\quad (8.54)$\n\ni.e. the numbers of customers\
    \ in different stations are independent. The marginal stationary probability for\
    \ station $s$\n\n$P^s(\\\\vec{n}^s) = \\frac{1}{G^s(\\\theta^s)} \\quad (8.55)$\n\
    \nThe proof follows from the fact that the existence of an invariant probability\
    \ is sufficient for stability (as we assume that the state space is fully connected,\
    \ by the aggregation condition). If the network is closed or mixed, the corollary\
    \ does not hold, the states in different stations are *not independent*, though\
    \ there is product-form. Closed networks are always stable, but may not be simple\
    \ to compute the normalizing constant; efficient algorithms exist, as discussed\
    \ in Section 8.6.\n\nFor mixed networks, containing both closed and open chains,\
    \ stability depends on the rate functions, and since they can be arbitrary, not\
    \ much can be said in general. In practice, though, the following sufficient conditions\
    \ are quite useful. The proof is similar to that of the previous theorem."
