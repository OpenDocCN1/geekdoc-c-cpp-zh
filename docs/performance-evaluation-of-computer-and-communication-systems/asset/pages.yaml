  md: "# Tests\n\nFor the present data, we estimate the power by setting $\\mu=\b\
    ar{x}$ and $\\sigma=s_n$ in (4.2). For a test size equal to 0.05 (i.e. $c=1.645$),\
    \ we find 0.9997. The probability of a type-2 error (deciding for $H_0$ when $H_1$\
    \ is true) is thus approximately 0.0003, a very small value. If we select $\\\
    alpha=0.1\\%$ as test size, we find that the type-2 error probability is 2.5%.\n\
    \nThe previous example shows that the test size does not say everything. In Figure\
    \ 4.2, we see that there is a 'grey zone' (values of $\\mu$ below, say, 15) where\
    \ the power of the test is not large. If the true parameter is in the grey zone,\
    \ the probability of a type-2 error may be large, i.e. it is not probable that\
    \ the test will accept $H_0$ even when $H_1$ is true. It is important to keep\
    \ the following in mind: a test may accept $H_0$ because it holds, but also because\
    \ it is unable to reject it. This is the fundamental asymmetry of the Neyman-Pearson\
    \ framework.\n\nThe power function can be used to decide on the size $\\alpha$\
    \ of the test, at least in theory, as illustrated below.\n\n# Example 4.3 Optimal\
    \ Test Size\n\nContinuation of Example 4.2. Assume that we consider a reduction\
    \ in run time to be negligible if it is below $\\mu^*$. We want the probability\
    \ of deciding $H_0$ when the true value is equal to $\\mu^*$ or more to be similar\
    \ to the size $\\alpha$, i.e. we want to balance the two types of errors. This\
    \ gives the equations\n\n```\n$1 - N_{0,1}(c^*) = \\alpha$\n```\n\n```\n$1 - N_{0,1}\\\
    left(c^* - \\sqrt{n}\\frac{\\mu^*}{s_n}\\right) = 1 - \\alpha$\n```\n\nand thus\n\
    \n```\n$N_{0,1}(c^*) + N_{0,1}\\left(c^* - \\sqrt{n}\\frac{\\mu^*}{s_n}\\right)\
    \ = 1$\n```\n\nBy symmetry of the Gaussian PDF around its mean, we have\n\n```\n\
    $if N_{0,1}(x) + N_{0,1}(y) = 1$ then $x + y = 0$\n```\n\nfrom where we derive\n\
    \n```\n$c^* = \\sqrt{n}\\frac{\\mu^*}{2s_n}$\n```\n\nThe table below gives a few\
    \ numerical examples, together with the corresponding test size $\\alpha^* = 1\
    \ - N_{0,1}(c^*)$.\n\n| resolution $\\mu^*$ | optimal threshold $c^*$ | size $\\\
    alpha^*$ |\n|---|---|--|\n| 10 | 0.97 | 0.17 |\n| 20 | 1.93 | 0.02 |\n| 40 | 3.87\
    \ | 5.38 e - 005 |"
