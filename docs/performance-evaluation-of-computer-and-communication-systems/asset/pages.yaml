  md: '# Summarizing Performance Data and Confidence Intervals


    know m exactly, but we estimate it by $\hat{m}(X_1, \dots, X_n)$, equal to the
    sample median defined in Section 2.8.1. Note that the value of the estimated median
    depends on the data, and it is thus random: for different measurements, we obtain
    different estimated medians. The goal of a confidence interval is to bound this
    uncertainty. It is defined relative to a confidence level $\gamma$; typically
    $\gamma=0.95$ or $0.99:


    # Definition 2.1


    A confidence interval at level $\gamma$ for the fixed but unknown parameter $m$
    is an interval $u(X_1, \dots, X_n), v(X_1, \dots, X_n)$ such that


    ```

    $P(u(X_1, \dots, X_n) < m < v(X_1, \dots, X_n)) \ge \gamma \quad (2.18)

    ```


    In other words, the interval is constructed from the data, such that at least
    95% probability (for $\gamma = 0.95$), the true value of $m$ falls within it.
    Note that it is the confidence interval that is random, and not the unknown parameter
    $m$.


    A confidence interval for the median or any other quantile is very simple to compute,
    as demonstrated by the next theorem.


    # Theorem 2.1 (Confidence Interval for the Median and other Quantiles)


    Let $X_1, \dots, X_n$ be $n$ iid random variables, with a common CDF $F(-)$. As
    $F(p)$ has a density, and let $m_p$ be a $p$-quantile of $F(\cdot)$, i.e. $F(m_p)=p$,
    for $0 < p < 1$.

    Let $X_{(1)} \le X_{(2)} \le \dots \le X_{(n)}$ be the order statistic, i.e. the
    set of values of $X_i$ sorted in increasing order. Let $B_{n,p}$ be the CDF of
    the binomial distribution with $n$ repetitions and probability of success $p$.
    A confidence interval for $m_p$ at level $\gamma$ is


    ```

    $[X_{(j)}, X_{(k)}]$

    ```


    where $j$ and $k$ satisfy

    $B_{n,p}(k-1) - B_{n,p}(j-1) \ge \gamma$


    See the tables in Section A for practical values. For large $n$, we can use the
    approximation


    ```

    $j \approx |np - \eta\sqrt{np(1-p)}|

    kk \approx |np + \eta\sqrt{np(1-p)}| + 1$

    ```


    where $\eta$ is defined by $N_{0,1}(\eta) = \frac{1}{2}$ (e.g. $\eta = 1.96$ for
    $\gamma = 0.95$).'
