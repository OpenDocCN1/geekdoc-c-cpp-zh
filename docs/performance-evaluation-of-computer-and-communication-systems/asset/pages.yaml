    # # 1.6 Review


    # 1.6.1 Check-List


    **Performance Evaluation Checklist**


    **PE1 Define your goal.** For example: dimension the system, find the overload
    behavior;; evaluate alternatives. Do you need a performance evaluation study?
    Are the results not obvious? Are they too dependent on the input factors, which
    are arbitrary?


    **PE2 Identify the factors.** What are all the factors? Are there external factors
    which need to be controlled?


    **PE3 Define your metrics.** For example: response time, server occupancy, number
    of transactions per hour, Joule per Megabyte. Define not only what is measured
    but also under which condition or sampling method. If the metric is multi-dimensional,
    different metric values are not always comparable and there may not be a best
    metric value. However, we might have non-dominated metric values.


    **PE4 Define the offered load.** How is it expressed: transactions per second,
    number of users, visits per hour? Is it measured on a real system? Artificial
    load generated by a simulator, by a synthetic load generator? Load model in a
    theoretical model?


    **PE5 Know your bottlenecks.** The performance often depends only on a small number
    of factors, frequently with a high utilization (load capacity). Make sure that
    you are indeed evaluating one of them.'
