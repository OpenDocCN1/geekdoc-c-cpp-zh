  md: '# Calculus of Digital Filters


    In matrix form, if we know that length$(X) \leq n$ we can write (D.4) as


    ```

    $FX = \begin{pmatrix} h_0 & 0 & 0 \ h_1 & h_0 & 0 \ h_2 & h_1 & h_0 \ \vdots &
    \vdots & \dots & h_0 & 0 \ h_{n-1} & h_{n-2} & \dots & h_1 & h_0 \end{pmatrix}
    X \quad (D.6)$

    ```


    A filter is called Finite Impulse Response (FIR) if $h_n - 0$ for $n$ large enough.
    Otherwise, it is called Infinite Impulse Response.


    # D.1.3 Impulse response and Dirac Sequence


    Define the *Dirac sequence* of length $n$


    ```

    $\delta_n = \begin{pmatrix} 0 \ \vdots \ 0 \end{pmatrix} \quad (D.7)$

    ```


    The impulse response of a filter satisfies


    ```

    $\begin{pmatrix} h_0 \ h_1 \ \vdots \ h_{n-1} \end{pmatrix} = F\delta_n \quad
    (D.8)$

    ```


    This is used to compute the impulse response if we know some algorithm to compute
    $FX$ for any $X$.


    # D.1.4 Composition of Filters, Commutativity


    Let $F$ and $F''$ be filters. The composition of $F$ and $F''$, denoted as $FF''$,
    is defined as the mapping from $S$ to $S$ obtained by applying $F''$ first, then
    $F$, i.e. such that for any sequence $X$


    ```

    $(FF'')(X) = F(F''(X)) \quad (D.9)$

    ```


    It can easily see that $FF''$ is a filter. Furthermore, the composition of filters
    commute, i.e.


    ```

    $FF'' = F''F \quad (D.10)$

    ```'
