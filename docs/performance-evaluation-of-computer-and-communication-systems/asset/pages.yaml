  md: '# Table B.1 Confidence Interval for $\sigma$ for an iid, normal sample of $n$
    data points by an exact method and an asymptotic result with Fisher information
    (Corollary B.1). The values represent the confidence bounds for the ratio $\sigma_n$
    is the true value and $\hat{\sigma}_n$ is the estimated standard deviation in
    Theorem 2.3.


    | n | 30 | 60 | 120 |

    | Exact | 0.7964 - 1.3443 | 0.8476 - 1.2197 | 0.8875 - 1.1454 |

    | Fisher | 0.7847 - 1.3162 | 0.8411 - 1.2077 | 0.8840 - 1.1401 |


    Thus the use of Fisher information gives the same asymptotic interval for the
    mean as Theorem 2.2. This is quite general: the use of Fisher information is the
    generalization of the large sample asymptotic of Theorem 2.2.


    We can also compare the approximate confidence interval for $\sigma$. The exact
    interval is given by Theorem 2.3: with probability $\gamma$, we have


    ```

    $\frac{\xi_2}{n-1} \le \frac{\hat{\sigma}_n^2}{\sigma^2} \le \frac{\xi_1}{n-1}$

    ```


    with $\chi^2_{n-1}(\xi_2)=\frac{\gamma}{2}$ and $\chi^2_{n-1}(\xi_1)=\frac{1-\gamma}{2}$.
    Thus, an exact confidence interval for $\sigma$ is


    ```

    $\hat{\sigma}_n \left[ \sqrt{\frac{n-1}{\xi_1}}, \sqrt{\frac{n-1}{\xi_2}} \right]
    \quad (B.3)$

    ```


    With Fisher information, we obtain that $\sigma-s_n$ is approximately $N_0, \sigma^2/2n$.
    Consequently, with probability $\gamma$,


    ```

    $$|sigma - s_n| \le \frac{\sigma}{\sqrt{2n}}$

    ```


    with $N_{0,1}(\eta)=\frac{1+\gamma}{2}$. Divide by $\sigma$ and obtain, after
    some algebra, that with probability $\gamma$


    ```

    $\frac{1+\eta}{\sqrt{2n}} \le \frac{\sigma}{s_n} \le \frac{1-\eta}{\sqrt{2n}}$

    ```


    Taking into account that $s_n = \frac{n-1}{n}\hat{\sigma}_n$, we obtain the approximate
    confidence interval for $\sigma$


    ```

    $\hat{\sigma}_n \left[ \frac{n}{n-1}, \frac{1+\eta}{n\sqrt{2n}}, \sqrt{\frac{n}{n-1}},
    \frac{1-\eta}{n\sqrt{2n}} \right] \quad (B.4)$

    ```


    For $n=30, 60, 120$ and $\gamma=0.95$, the confidence intervals are as shown in
    Table B.1, where we compare to exact values; the difference is negligible already
    for $n=30$.'
