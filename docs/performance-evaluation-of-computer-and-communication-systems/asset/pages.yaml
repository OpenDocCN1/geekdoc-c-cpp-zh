  md: "# ANNEX A\n\n# Tables\n\nThe following tables can be used to determine confidence\
    \ intervals for quantiles (including median), according to Theorem 2.1. For a\
    \ sample of $n$ iid data points $x_1,\\dots,x_n$, the tables give a confidence\
    \ interval at the confidence level $\\gamma = 0.95$ or $0.99$ for the $q$-quantile\
    \ with $q = 0.5$ (median), $q = 0.75$ (quartile) and $q = 0.25$. The confidence\
    \ interval is $[x_{(j)}, x_{(k)}]$, where $x_{(j)}$ is the $j$th point sorted\
    \ in increasing order.\n\nThe confidence intervals for $q = 0.05$ and $q = 0.25$\
    \ are not given in the tables. They can be deduced by the following rule. Let\
    \ $[x_{(j)}, x_{(k)}]$ be the confidence interval for the $q$-quantile given by\
    \ the table. A confidence interval for the $1-q$-quantile is $[x_{(j')}, x_{(k')}]$:\n\
    \n```\n$j' = n + 1 - k$\n k' = n + 1 - j$\n```\n\nFor example, with $n = 50$,\
    \ a confidence interval for the third quartile ($q = 0.75$) at confidence level\
    \ $0.99$ is $[x_{(29)}, x_{(45)}]$; thus a confidence interval for the first quartile\
    \ ($q = 0.25$) at confidence level $0.99$ is $[x_{(6)}, x_{(22)}].\n\nFor small\
    \ values of $n$ no confidence interval is given. For large $n$, an approximate\
    \ value is given, based on a normal approximation of the binomial distribution.\n\
    \nNote\n\nThe tables give $p$, the actual confidence level obtained, as is not\
    \ possible to obtain a confidence interval at exactly the required confidence\
    \ levels. For example, for $n = 10$ and $\\gamma = 0.95$, the confidence interval\
    \ given by the table is $[X_{(2)}, X_{(9)}]$. Note that the table states it is\
    \ in fact a confidence interval at level of $0.979.\n\nThe values of $j$ and $k$\
    \ are chosen such that $j$ and $k$ are as symmetric as possible around $\\frac{n+1}{2}$.\
    \ For example, for $n = 31$ the table gives the interval $[X_{(10)}, X_{(22)}]$.\
    \ Note that this is not the only interval that can be obtained from the theorem.\
    \ Indeed, we have"
