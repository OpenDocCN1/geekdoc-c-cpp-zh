    # 6.7 Importance Sampling


    # 6.7.1 Motivation


    It is occasionally desirable to estimate by sampling the probability of a *rare
    event*, e.g. a failure probability or a bit error rate. In such cases, straightforward
    Monte Carlo simulation is not efficient, as it requires a large number of runs
    to provide a reliable estimate. As an example, assume that the failure probability
    to be estimated is $10^{-5}$. With $R$ independent replications of a Monte Carlo
    simulation, the expected number of runs producing one failure is $Rp$, and we
    consequently need $10^7$ runs to observe 100 failures. In fact, we require on
    the order of $4-10^7$ runs to obtain a 95% confidence interval with a margin on
    the failure probability around 10%, as we show next.


    Assume that we want to estimate a failure probability $p$, by performing $R$ replications.
    A naive Monte Carlo estimate is $\rho = \frac{p}{N}$ where $N$ is the number of
    runs producing a failure. A $1-\alpha$ confidence interval for $p$ has a length
    of $\eta$ times the standard deviation of $p$, where $N_{0,1}(\eta) = 1-\frac{\alpha}{2}$.
    The relative accuracy of the estimator is $\eta c$, where $c$ is the coefficient
    of variation of $p$. Now


    ```

    $c = \frac{\sqrt{p(1-p)}}{R} = \frac{\sqrt{1-p}}{\sqrt{Rp}} \approx \frac{1}{\sqrt{Rp}}$

    ```'
