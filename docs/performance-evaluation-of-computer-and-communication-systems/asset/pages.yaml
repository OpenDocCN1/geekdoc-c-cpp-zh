  md: '# 8.2 Operational Laws for Queuing Systems


    These are robust results, i.e. they are true with very few assumptions on the
    queuing system other than stability. Many of them directly derive from Chapter
    7, such as the celebrated Little''s law. The laws apply to a stationary system;
    for a single queue, they are true if the utilization is less than 1. This type
    of analysis was pioneered in [34]; an original, stand-alone treatment can be found
    in [35].


    # 8.2.1 Departures and Arrivals See Same Averages (DASSA)


    > Theorem 8.2 (DASSA)

    Consider a system where individual customers come in and out. Assume that the
    arrival process $A_n$ and the departure process $D_n$ are stationary point processes,
    and they have no point in common (there are no simultaneous arrivals or departures).


    Let $N(t) \in N$ be the number of customers present in the system at time $t$.
    Assume that $N(t)$, $A_n$ and $D_n$ are jointly stationary (see Section 7.2).
    The probability distribution of $N(t)$ sampled just before an arrival is then
    equal to the probability distribution of $N(t)$ sampled just after a departure.


    The proof is given in Section 8.10; it is a direct application of the Rate Conservation
    law in Theorem 7.4.


    # Example 8.3 Inter-Departure Time in M/GI/1 Queue


    We want to compute the distribution of the inter-departure time in the stable
    M/GI/1 queue defined in Section 8.3 (i.e. the single server queue, with Poisson
    arrival and general service time distribution), and we would like to know in which
    case it is the same as the inter-arrival distribution.


    First note that the time between two departures is equal to one service time if
    the first departing customer leaves the system non-empty, and otherwise, it is
    the same plus the time until the next arrival. The time until the next arrival
    is independent of the state of the system and is exponentially distributed, with
    the parameter of the arrival rate $\lambda$. Thus, the Laplace-Stieltjes transform
    of the inter-departure time is


    ```

    $L_D(s) = (1-p)L_S(s) + pL_S(s)\frac{\lambda}{\lambda+s}$

    ```


    where $L_S$ is the Laplace-Stieltjes transform of the service time and $p$ is
    the probability that a departing customer leaves the system.


    > (2) The Laplace-Stieltjes transform of a non-negative random variable $X$ is
    defined by $L_X(s) = E(e^{-sX})$. If $X$ and $Y$ are independent, $L_{X+Y}(s)
    = L_X(s)L_Y(s)$; $X$ is exponentially distributed with parameter $\lambda$ if
    and only if $L_X(s) = \frac{\lambda}{\lambda+s}$.'
