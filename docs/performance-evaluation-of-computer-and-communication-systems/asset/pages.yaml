    \ 3.13** Queuing System\n\nConsider a server that receives requests for downloading\
    \ files. Assume\nat the arrival times of the requests form a Poisson process,\
    \ and the\nrequested file sizes are iid $\\sim F$, where $F$ is some distribution.\
    \ This is\na simplified model, but it is sufficient for making the point.\nWe\
    \ assume that the server has a unit capacity, and that the time to\nserve a request\
    \ is equal to the requested file size. This again is a\nsimplifying assumption,\
