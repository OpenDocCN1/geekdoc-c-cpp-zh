    \ bounds. See also Figure 8.15.\n\n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_291_0.png)\n\
    \n**Figure 8.6** Throughput bound ($B_0$) obtained by bottleneck analysis for\
    \ the system in Figure 8.5, as a function of the number of users $n$. $B_1$, $B_2$:\
    \ typical throughput values for a system without (resp. with) congestion collapse.\n\
    \nA node $k$ that maximizes $V_k S_k$ is, in this model, called a **bottleneck**.\
    \ To see how a bottleneck determines the performance, decreasing the value of\
    \ $V_k S_k$ (by reducing the number of times the resource is used, or by replacing\
    \ the resource by a faster one). If $k$ is not a bottleneck, this does not affect\
    \ the asymptote in Figure 8.6, and only marginally increases the slope of the\
    \ bound at the origin, unlike if $k$ is a bottleneck. In Figure 8.6, we see that\
    \ the bottleneck is the CPU."
