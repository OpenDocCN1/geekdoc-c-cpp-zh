  md: "# The Neyman Pearson Framework\n\nWe see that if we care to validly reductions\
    \ in run time as small as $\\mu^* = 10$ ms, we should have a test size of 17%\
    \ or more. In contrast, if the resolution $\\mu^*$ is 20 ms, then a test size\
    \ of 2% is appropriate.\n\n# 4.1.3 $p$-value of a Test\n\nFor many tests, the\
    \ rejection region has the form $T(\tilde{x}) > m_0$, where $\tilde{x}$ is the\
    \ observation, $T(\\cdot)$ is a certain mapping, and $m_0$ is a parameter that\
    \ depends on the size $\\alpha$ of the test. In Example 4.2, we can take $T(\t\
    ilde{x}) = \\sqrt{n}\tilde{s}_n$\n\n> Definition 4.1\nThe $p$-value of an observation\
    \ $\tilde{x}$\n\n```\n$p^*(\tilde{x}) = \\sup_{\theta \\in \\Theta} P(T(\\tilde{X})\
    \ > T(\\tilde{x}) \\mid \\theta)$\n```\n\nIn this formula, $\tilde{X}$ is a random\
    \ vector that represents a hypothetical replication of the experiment, whereas\
    \ $\tilde{x}$ is the data that we have observed.\n\nThe mapping $m \\mapsto \\\
    sup_{\theta \\in \\Theta} P(T(\\tilde{X}) > m \\mid \\theta)$ is monotonic nonincreasing,\
    \ and usually decreasing. Assuming the test, we have the equivalence\n\n```\n\
    $p^*(\tilde{x}) < \\alpha \\Longleftarrow T(\\tilde{x}) > m_0$\n```\n\nIn other\
    \ words, instead of comparing the test statistic $T(\tilde{x})$ against the threshold\
    \ $m_0$, we can compare the $p$-value to the test size $\\alpha$:\n\nThe test\
    \ rejects $H_0$ when the $p$-value is smaller than the test size $\\alpha$.\n\n\
    The interest of the $p$-value is that it gives more information than just a binary\
    \ answer. It is in fact the minimum test size required to reject $H_0$. Very often,\
    \ software packages return $p$-values rather than hard decisions ($H_0$ or $H_1$).\n\
    \n# Example 4.4 (Continuation of Example 4.2)\n\nThe $p$-value is $p^* = 1 - N_{0,1}(\\\
    frac{\\sqrt{n}}{s_n})$. We find $p^* = 2.2476 < \\alpha$ small, therefore we reject\
    \ $H_0$.\n\n# 4.1.4 Tests are just Tests\n\nWhen using a test, it is important\
    \ to make the distinction between statistical significance and practical relevance.\
    \ Consider for example a situation, as in Example 4.2, where we want to test whether\
    \ a mean $\\mu$ satisfies $\\mu = \\mu_0$ or $\\mu > \\mu_0$. We estimate the\
    \ theoretical mean $\\mu$ by the sample mean $\tilde{x}$. It is never the case\
    \ that $\\mu = \\tilde{x}$ exactly. A test concerns deciding whether the distance\
    \ between $\\mu$ and $\tilde{x}$ can be explained by the randomness of the data\
    \ (in which case we should decide that $\\mu = \\mu_0$), or by the fact that we\
    \ $\tilde{x} > \\mu_0$. Statistical significance means that, in a case where we\
    \ find $\tilde{x} > \\mu_0$, it is possible to conclude that there is a real difference,\
    \ i.e. $\\mu > \\mu_0$.\n\n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_132_0.png)"
