  md: "# Likelihood Ratio Tests\n\n$l_X(H_0) = \\sup_{\theta \\in \\Theta_0} l_X(\\\
    theta)$\n$l_X(H_1) = \\sup_{\theta \\in \\Theta_1} l_X(\\theta)$.\n\nFor example,\
    \ we assume that some data comes from an iid sequence of normal RVs $X \\sim N(\\\
    mu, \\sigma)$, and we want to test $\\mu = 0$ versus $\\mu \\neq 0$. Here $\\\
    Theta = \\{(\\mu, \\sigma > 0)\\}$ and $\\\\Theta_0 = \\{(0, \\sigma > 0)\\}$.\n\
    \nIf $H_0$ is true, then the likelihood is approximately, at a maximum for $\\\
    theta \\in \\Theta_0$ and $l_X(H_0) = l_X(H_1)$. In the opposite case, the maximum\
    \ likelihood is probably reached at some $\\theta \\in \\Theta_0$ and thus $l_X(H_1)\
    \ > l_X(H_0)$. This gives the idea for a generic family of tests:\n\n# Definition\
    \ 4.2\n\nThe likelihood ratio test is defined by the rejection region\n\n```\n\
    $C = \\{l_X(H_1) - l_X(H_0) > k\\}$\n```\n\nwhere $k$ is chosen based on the required\
    \ size of the test.\n\nThe test statistic $l_X(H_1) - l_X(H_0)$ is called **likelihood\
    \ ratio** for the two hypotheses $H_0$ and $H_1$.\n\nWe reject $\\theta \\in \\\
    Theta_0$ when the likelihood ratio statistic is large. The Neyman-Pearson lemma\
    \ [104]. Section 6.3] tells us that, in the simple case where $\\Theta_0$ and\
    \ $\\Theta_1$ contain only one value each, the likelihood ratio test minimizes\
    \ the probability of a type-2 error. Many tests used in this lecture are actually\
    \ likelihood ratio tests. As we will see later, for a large sample size, there\
    \ are simple, generic results for such tests.\n\nThere exists a link to the theory\
    \ of the maximum likelihood estimation. Under the conditions in Definition $B.1$,\
    \ we define\n\n+   - the maximum likelihood estimator of $\\theta$ when we restrict\
    \ $\\theta$ to be in $\\Theta_0$\n- the unrestricted maximum likelihood estimator\
    \ of $\\theta$\n\nConsequently, $l_X(H_0) = l_X(\\hat{\\theta}_0)$ and $l_X(H_1)\
    \ = l_X(\\hat{\\theta}_1)$. In the rest of this section and in the following two,\
    \ we show applications to various settings.\n\nQUESTION 4.1 Why can we be used\
    \ to test $l_X(H_0) - l_X(\\hat{\\theta}_0) \\ge 0^{(2)}$\n\n# Example 4.5 Continuation\
    \ of Example 4.2, Compiler Options\n\nWe want to test $H_0: \\mu = 0$ against\
    \ $H_1: \\mu > 0$. The log-likelihood of an observation\n\n```\n$l_X(\\mu, \\\
    sigma) = -\\frac{n}{2} \\ln(2\\pi\\sigma^2) - \\frac{1}{2\\sigma^2} \\sum (X_i\
    \ - \\mu)^2$\n```\n\nand the likelihood ratio statistic is\n\n```\n$l_X(H_1) -\
    \ l_X(H_0) = \\sup_{\\mu>0,\\sigma>0} l_X(\\mu, \\sigma) - \\sup_{\\sigma>0} l_X(0,\
    \ \\sigma) = -n \\ln \\frac{\\hat{\\sigma}_1}{\\hat{\\sigma}_0}$\n```\n\n> (2)\
    \ As long as the MLEs exist: by definition, $l_X(\\hat{\\theta}) \\ge l_X(\\theta)$\
    \ for any $\\theta$."
