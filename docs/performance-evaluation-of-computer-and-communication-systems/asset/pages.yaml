  md: '# Example 3.11 Combination of Log-Normal and Pareto


    Figure 3.14(a) shows an empirical complementary CDF in log-log scales for a set
    of $10^5$ data points representing file sizes. The plots show an asymptotic power
    law, but not over the entire body of the distribution. We wish to fit a combination
    of a truncated log-normal distribution for the body of the distribution (of left
    dashed line) and of a Pareto distribution for the tail, truncated on $[0, a)$
    and Pareto rescaled to have support on $[a, \infty)$. The model is


    ```

    $f_X(x) = q\frac{f_1(x)}{F_1(a)}\{1_{x\le a}\} + (1-q)\frac{f_2(x)}{F_2(a)}\{1_{x>a\}}$

    ```


    where $F_1$ is a log-normal distribution, $F_2$ is Pareto with exponent $p$, and
    breakpoint $a$. Note that $F_2(a) = 0$, and PDF is


    ```

    $f_X(x) = \frac{q}{N_{0,1}(\mu+\sigma \ln a)}\sqrt{2\pi\sigma} e^{-\frac{(\ln
    x-\mu)^2}{2\sigma^2}}\{1_{0<x\le a\}\}+(1-q)p\frac{a^p}{x^{p+1}}\{1_{x\ge a\}}$  (3.25)

    ```


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_114_0.png)


    **Figure 3.14** Fitting a combination of log-normal for the body and Pareto for
    the tail. Dashed vertical line: breakpoint.


    The parameters to be fitted are $q, \mu, \sigma, p$ and the breakpoint $a$. We
    first fix $a$ to any arbitrary value and fit the other parameters. By (3.24),
    $q=\frac{n_1(a)}{n}$ where $n_1(a)$ is the number of data points $\le a$. The
    log-likelihood is thus


    ```

    $\ell(\mu,\sigma,p,a)=n_1(a) \ln n_1(a)+n_2(a) \ln n_2(a)-n \ln n +\ell_1(\mu,\sigma,a)+\ell_2(p,a)$

    ```


    where $n_2(a)=n-n_1(a),\ell_1$ is as in (3.17) (with $n_1(a)$ instead of $n$)
    and


    ```

    $\ell_2(a,p)=n_2(a)(\ln p+p \ln a)-(p+1)\sum_{i=n_1(a)}^{n} \ln x_i$

    ```'
