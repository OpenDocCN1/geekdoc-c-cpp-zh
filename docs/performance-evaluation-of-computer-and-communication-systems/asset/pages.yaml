  md: "# The Product-Form Theorem\n\nTheorem 8.9 (Sufficient Stability Condition for\
    \ Mixed Networks)\nConsider a multi-class product form queuing network as defined\
    \ above. Assume the network is mixed, with $C_c$ classes in closed chains and\
    \ $C_o$ in open chains. Let $\\vec{m} = (m_1, \\dots, m_c)$ be the population\
    \ vector of classes in closed chains, and $\\vec{n} = (n_1, \\dots, n_c)$ be the\
    \ population vector of classes in open chains. For every station $s$ and $m_s$,\n\
    \n```\n$L^s(\\theta | \\vec{m}) = \\sum_{\\vec{n}\\in NC_s} f^s(\\theta, \\vec{n})\
    \ \\prod (\\theta_c^s)^{n_c} \\quad (8.56)$\n```\n\nwhere $f^s(\\theta, \\vec{n})$\
    \ is the station function.\nIf\n$L^s(\\theta | \\vec{m}) < \\infty \\quad \\forall\
    \ \\vec{m}, \\s\nthe network has a stationary distribution.\n\nIn simple cases,\
    \ a direct examination of (8.52) leads to simple, natural conditions, as in the\
    \ next theorem. Essentially, it states that for the networks considered there,\
    \ stability is obtained when server utilizations are less than 1.\n\n# Theorem\
    \ 8.10 (Stability of a Simple Mixed Network)\nConsider a mixed multi-class product\
    \ form queuing network and assume that all stations are either Kelly stations\
    \ (such as Global PS or Global LFS), IS or MSCCC with constant rates.\nLet $C$\
    \ be the set of classes belonging to open chains. Define the utilization factor\
    \ $\\rho^s$ at station $s$\n\n```\n\\rho^s = \\begin{cases} \\frac{S^s}{B^s} \\\
    sum_{c\\in C} \\theta_c^s & \\text{if station s is MSCCC with } B^s \\text{ servers,\
    \ and a mean service time } S^s \\ \\sum_{c\\in C} \\theta_c^s S_c^s & \\text{if\
    \ station s is a Kelly station and a mean service time } S_c^s \\text{ for class\
    \ c.} \\end{cases}$\n```\n\nThe network has a stationary distribution if and only\
    \ if $\\rho^s < 1$ for every Kelly station or MSCCC station. There is no condition\
    \ on IS stations.\n\n# Example 8.8 Dual-Core Processor in Figure 8.11\nLet $q\
    \ \\in [0,1]$ be the probability that an external job uses the critical section\
    \ and let $r > 0$ be the average number of uses of the processor outside the critical\
    \ section by an external job. Thus, $\theta_1^s + \\theta_2^s = vr$ and $\theta_2^s\
    \ = vq$. Based on Theorem 8.10, the stability conditions are\n\n```\n$\\nu(r+q)S^1\
    \ \\leq 2\\nvqS^1 \\leq 1$\n```"
