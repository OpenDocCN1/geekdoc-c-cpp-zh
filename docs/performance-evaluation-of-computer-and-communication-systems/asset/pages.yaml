  md: "# C.1.2 Linear Algebra\n\nIf $M$ is a linear subspace of $\\mathbb{R}^n$, the\
    \ **orthogonal projection** on $M$ is the linear mapping, $\\Pi_M$, from $\\mathbb{R}^n$\
    \ to itself such that $\\Pi_M(\\vec{x})$ is the element of $M$ that minimizes\
    \ the distance to $\\vec{x}$:\n\n```\n$$$\\Pi_M(\\vec{x}) = \\arg \\min_{\\vec{y}\
    \ \\in M} ||\\vec{y} - \\vec{x}||^2$$ (C.1)\n```\n\n$\\Pi_M(\\vec{x})$ is also\
    \ the unique element $\\vec{y} \\in M$ such that $\\vec{y} - \\vec{x}$ is orthogonal\
    \ to $M$. $\\Pi_M$ is symmetric ($\\Pi_M = \\Pi_M^T$) and idempotent ($\\Pi_M^2\
    \ = \\Pi_M$).\n\n$\\Pi_M$ can always be put in diagonal form as follows:\n\n```\n\
    $$$\\Pi_M = U^T DU$$\n```\n\nwith\n\n```\n$$$D = \\begin{pmatrix} 1 & 0 & & \\\
    \ 0 & 1 & & \\ \\vdots & & \\ddots & & \\ & & 1 & 0 & \\dots \\ & & & 0 & 0 \\\
    \ & & & & \\dotsdots \\end{pmatrix}$$$$ (C.2)$\n```\n\nwhere the matrix of 1s\
    \ on the diagonal is the dimension of $M$, and $U$ is an orthogonal matrix.\n\n\
    Let $H$ be an $n \times p$ matrix, with $p \\leq n$, and $M$ the linear space\
    \ spanned by the columns of the matrix $H$, i.e.\n\n```\n$$$M = \\{\\vec{y} \\\
    in \\mathbb{R}^n : \\vec{y} = H\\vec{z} \\text{ for some } \\vec{z} \\in \\mathbb{R}^p\\\
    }$$$\n```\n\nIf $H$ has full rank (i.e. rank $p$), then $H^T H$ has an inverse\
    \ and\n\n```\n$$$\\Pi_M = H(H^T H)^{-1} H^T$$ (C.3)$\n```\n\n# C.2 Covariance\
    \ Matrix of a Random Vector in $\\mathbb{R}^n$\n\n# C.2.1 Definitions\n\nLet $\\\
    vec{X}$ be a random vector with values in $\\mathbb{R}^n$. If each of the components\
    \ $X_1, \\dots, X_n$ has a well-defined expectation, $E(\\vec{X})$ is defined\
    \ as\n\n```\n$$$E(\\vec{X}) = \\begin{pmatrix} E(X_1) \\ \\vdots \\ E(X_n) \\\
    end{pmatrix}$$$$\n```"
