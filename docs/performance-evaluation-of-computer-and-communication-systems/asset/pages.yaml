  md: '# Preface


    Performance evaluation is often the critical part of evaluating the results of
    a research project. Many of us are familiar with simulations, but it is frequently
    difficult to address questions like: Should I eliminate the beginning of the simulation
    in order for the system to become stabilized? I simulate a random model but the
    average speed in my simulation is not as expected. What happened? The reviewers
    of my study complained that I did not provide confidence intervals. How do I go
    about this? I would like to characterize the fairness of my protocol. Should I
    use Jain''s Fairness Index or the Lorenz Curve Gap? I would like to fit a distribution
    to the flow sizes that I measured, but all my measurements are truncated to a
    maximum value; how do I account for the truncation?


    This book contains a set of lecture notes for a course given at EPFL. An engineer
    who wishes to evaluate the performance of a computer or communication system.
    More precisely, with this book and some accompanying practicals, you will be able
    to answer the above and other questions, evaluate the performance of computer
    and communication systems and master the theoretical foundations of performance
    evaluation and of the corresponding software packages.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_8_0.png)


    In the past, many textbooks on performance evaluation have given the impression
    that this is a complex field, with large amounts of baroque queuing excursions,
    which can be exercised only by performance evaluation experts. This is not necessarily
    the case. In contrast, performance evaluation can be performed by any computer
    engineering specialist who designs a system. When a plumber installs pipes in
    our house, one expects her to properly size their diameters; the same holds for
    computer engineers.


    This book is not intended for the performance evaluation specialist. It is addressed
    to any computer engineer or scientist who is active in the development or operation
    of software or hardware systems. The required background is an elementary course
    in probability and one in calculus.


    The objective of this book is therefore to make performance evaluation usable
    by all computer engineers and scientists. The foundations of performance'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# vi Preface


    evaluation reside in statistics and queuing theory. Therefore, some mathematics
    are involved and the text cannot be overly simplified. However, it turns out that
    much of the complications are not in the general theories, but in the exact solution
    of specific models. For example, certain textbooks on statistics (but none of
    the ones cited in the reference list) develop various solution techniques for
    specific models, the vast majority of which are encapsulated in modern or freely
    available software packages like Matlab, S-PLUS, Excel, Scilab R


    To avoid this pitfall, we first focus on the what before the how. Indeed, the
    most difficult question in a performance analysis is often “what to do”; once
    you know what to do, it is less difficult to find a way with your usual software
    tools or by shopping the web. For example, what do we do when we fit a model to
    data using least square fitting (Chapter 3)? What is a confidence interval? What
    is a prediction interval (Chapter 2)? What is the congestion pattern (Chapter
    1)? What is the null hypothesis in a test and what does the result of a test really
    mean (Chapter 4)? What is an information criterion (Chapter 5)? If no failure
    appears out of n experiments, what confidence interval can I give for the failure
    probability (Chapter 2)?


    Second, regarding the how, we looked for solution methods that are universal as
    possible, i.e. that apply to many situations, simple or complex. There are several
    reasons for this. Firstly, one should use methods and tools that one understands,
    and a good engineer should first invest some time in learning tools and methods
    that he/she will use more often. Sometimes, by force and a computer can do more
    than one often seems to believe. This philosophy is in sharp contrast to some
    publications on performance evaluation. For example, computing or prediction intervals
    can be made simple and systematic if we use the median and not the mean; if we
    have to employ the mean, the use of the likelihood ratio statistic is quite universal
    and requires little intellectual sophistication regarding the method. Thus, we
    focus on generic methods such as: the use of filters for forecasting (Chapter
    5), bootstrap and Monte-Carlo simulations for evaluating averages or prediction
    intervals (Chapter 6), the likelihood ratio statistic for tests (Chapter 2, Chapter
    4), importance sampling (Chapter 6), least-square and l¹ minimization methods
    (Chapter 3).


    Presenting solutions, we try not to hide their limitations and the cases where
    they do not work. Indeed, some frustrations experienced by young researchers can
    sometimes be attributed to false expectations about the power of various methods.


    We give a coverage of queuing theory that attempts to strike a balance between
    depth and relevance. During a performance analysis, one is often confronted with
    the dilemma: should we use an approximate model for which exact solutions exist,
    or approximate solutions for a more exact model? We propose four topics (deterministic
    analysis, operational laws, single queues, queuing networks) which provide a good
    balance. We illustrate in a case study how the four topics can be utilized to
    provide different insights on a queuing question. For queuing networks, we give
    a unified treatment, which is perhaps the first of its kind at this level of synthesis.
    We show that complex topics such'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'queues with concurrency (MSCCC queues) or networks with bandwidth sharing (Whittle)
    all fit in the same framework of product form queuing networks. Results of this
    kind have been traditionally presented as separate; unifying simplifies the student''s
    job and provides new insights.


    We develop the theory of Palm calculus, also called ''the importance of the viewpoint'',
    which is central to queuing theory, as a topic of its. Indeed, this topic has
    so many applications to simulation and to system analysis in general, that it
    is a very good time investment. Here, we focus on general purpose methods and
    results, in particular the large-time heuristic for mapping various viewpoints
    (Chapter 7).


    Chapter 1 gives a methodology and serves as an introduction to the rest of the
    book. Performance patterns are also described, i.e. facts that repeatedly appear
    in various situations, and the knowledge of which considerably helps the performance
    evaluation.


    Chapter 2 demonstrates how to summarize experimental or simulation results, as
    well as how to quantify their accuracy. It also serves as an introduction to the
    scientific use of the statistical method, i.e. pose a model and verify its assumptions.
    In Chapter 3, we present general methods for fitting an explanatory model to data
    and the concept of heavy tail. Chapter 4 describes the techniques of tests, and
    Chapter 5 does of forecasting. These four chapters give a coverage of modern statistics
    useful to our field.


    Chapter 6 discusses discrete event simulation and several important, though issues
    such as the need for transient removal, for confidence intervals, and classical
    simulation techniques. We also discuss importance sampling, which is very useful
    for computing estimates of rare events; we give a simple, though general and broadly
    applicable method.


    Chapter 7 describes Palm calculus, which relates the varying viewpoints resulting
    from measurements done by different operators. Here, we discuss freezing simulations,
    a phenomenon which can be a problem for even simulations if one is not aware of.
    We also present how to perform a perfect simulation of stochastic recurrences.
    Chapter 8 discusses patterns specific to queuing, classical solution methods for
    queuing networks, and perhaps important, operational analysis for rapid evaluation.


    The appendix gives back information that cannot yet be found elsewhere, such as
    a Fourier-free quick crash on digital filters (used in Chapter 5) and confidence
    intervals for quantiles.


    Performance evaluation is primarily an art, and involves using sophisticated tools
    such as mathematical packages, measurement tools and simulation tools. We see
    the web of the EPFL lecture on Performance Evaluation for some examples of practical,
    implemented in Matlab and designed around this book.


    The text is intended for self-study. Proofs are not given when there are accessible
    references (these are indicated in the text); otherwise they can be found at the
    end of the chapters.


    The Index collects all terms and expressions that are highlighted in the text
    like this and also serves as a notation list.'
