  md: '# 8.4.3 The Station Function


    The expression of the product form theorem uses the station function, which depends
    on the parameter of the station as indicated below, and takes, as an argument,
    the vector $\vec{n} = (n_1, \dots, n_C)$, where $n_c$ is the number of class-c
    customers at this station. It can be interpreted as the stationary distribution
    of numbers of customers in the station in isolation, up to a multiplicative constant.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_312_0.png)


    Figure 8.12 Station s in isolation.


    More precisely, imagine a (virtual) closed network, made of this station and one
    external, auxiliary Per Class PS station with mean service time 1 and service
    rate 1 for all classes, as in Figure 8.12. In this virtual network, there is one
    chain per class and every class $c$ has a constant number of customers $K_c$.
    The product form theorem implies that, for any values of the vector $\vec{K} =
    (K_1, \dots, K_C)$, this network has a stationary regime, and the stationary probability
    that $n_1$ customers of class 1, $\dots, n_C$ customers of class C is


    ```

    $P^{isol}(\vec{n}) = \begin{cases} 0 & \text{if } n_c > K_c \text{ for some }
    c \ \frac{1}{\eta(K)} & \text{otherwise} \end{cases} \quad (8.31)$

    ```


    where $\eta(\vec{K})$ is a normalizing constant (independent of $\vec{n}$).


    It is often useful to consider the generating function $G(\cdot)$ of the station
    function, defined as the $Z$-transform of the station function. In other orders,
    for $\vec{Z} = (Z_1, \dots, Z_C)$,


    ```

    $G(\vec{Z}) = \sum_{\vec{n} \geq 0} f(\vec{n}) \prod_{c=1}^C Z_c^{n_c} \quad (8.32)$

    ```'
