    \n**Figure 5.12** Prediction at time 224, with the same model as in Figure 5.11,\
    \ obtained with the bootstrap method (re-sampling of residuals).\n\n# 5.6 Sparse\
    \ ARMA and ARIMA Models\n\nIn order to avoid overfitting, it is desirable to use\
    \ ARMA models that have as few parameters as possible. Such models are called\
    \ *sparse*. The use of information criterion is a means for obtaining sparse models,\
    \ but it involves a complex non-linear optimization problem. An alternative is\
    \ to impose constraints on the model, based on various sensible heuristics.\n\n\
    # 5.6.1 Constrained ARMA Models\n\nA simple method consists of forcing some of\
    \ the auto-regressive and moving average coefficients to 0, as in Example 5.6.\
    \ Another approach, more adapted to models with periodicity, is called *seasonal\
    \ ARIMA*. It assumes that the data has a period $s$; a seasonal ARMA model is\
    \ thus an ARMA model where we force the filter $F$ defined in (5.23) to have the\
    \ form\n\n```\n$F=\\frac{\\left(1+\\sum_{i=1}^{q} c_iB^i\right)\\left(1+\\sum_{i=1}^{Q}\
    \ C_iB^i\right)}{\\left(1+\\sum_{i=1}^{p} a_iB^i\right)\\left(1+\\sum_{i=1}^{P}\
    \ A_iB^i\right)}\\quad(5.37)$\n```\n\n$Y_t$ is a seasonal ARMA model and $\\Delta^D\
    \ RY$ is a seasonal ARMA model, for various non-negative integers $d, D$. This\
    \ model is also called *multiplicative ARIMA* model, as the filter polynomials\
    \ are products of polynomials."
