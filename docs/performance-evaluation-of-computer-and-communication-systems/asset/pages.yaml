  md: 'Frequently, $\phi(x)$ is the indicator function, equal to 1 if the value $x$
    corresponds to a failure of the system, and 0 otherwise. We replace the original
    PDF $f_X(\cdot)$ by another one, $f_X(\cdot)$, called the PDF of the *importance
    sampling distribution*, on the same space $\mathbb{R}^d$. We assume that


    if $f_X(x) > 0$, then $f_X(x) > 0$


    i.e. the support of the importance sampling distribution contains that of the
    original one. For $x$ in the support of $f_X(\cdot)$, we define the *weighting
    function*


    ```

    $w(x) = \frac{f_X(x)}{f_{\phi(x)}} \quad (6.15)$

    ```


    We assume that $w(x)$ can be easily evaluated. Let $\hat{X}$ be a random variable
    for which the distribution is that of the importance sampling. We also assume
    that it is easy to draw a sample of $X$.


    It comes immediately that


    ```

    $E(\hat{X}w(\hat{X})) = E(\phi(\hat{X})) = p \quad (6.16)$

    ```


    which is the fundamental equation of importance sampling. An estimate of $p$ this
    is given by


    ```

    $P_{beat} = \frac{1}{R} \sum_{r=1}^{R} \phi(\hat{X}_r)w(\hat{X}_r) \quad (6.17)$

    ```


    where $\hat{X}_r$ are $R$ independent replicates of $\hat{X}$.


    Why would this be easier than the original problem? Assume we have found a sampling
    distribution for which the events of interest are not rare. It follows that $w(x)$
    is very small, but $\phi(X)$ is not. The events $\phi(X) = 1$ are not rare, and
    can be reproduced many times in a short simulation. The final result, $p$, is
    small because we weight the outputs $\phi(X)$ by small numbers.


