  md: '# 8.6 Computational Aspects


    $S^1$ is the average job processing time at the dual-core processor. Note that
    we need to assume that the processing time is independent of whether it uses the
    critical section, and of whether it has an internal or external job. The system
    is stable if it has a stationary regime for $

