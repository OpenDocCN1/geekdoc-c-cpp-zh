  md: '# 7.1.4 Arbitrary Sampling Methods


    To conclude this section we describe how different viewpoints occur in various
    situations, with clocks that may not be related to time. Here too, the large ‘time’
    heuristic relationships provide useful relationships.


    # Example 7.4 Flow versus Packet Clock


    Packets arriving at our router are classified as “flows” [96]. We would like to
    plot the empirical distribution of flow sizes, counted in packets. We measure
    all traffic at the router for some extended period of time. Our metric of interest
    is the probability distribution of flow sizes. We can take a flow ‘clock’, or
    viewpoint, i.e. we ask: pick an arbitrary flow, what is its size? Or we could
    take a packet viewpoint and ask: what is the magnitude of its flow? We have thus
    two possible metrics (Figure 7.3):


    Per flow. $f_F(s) = \frac{1}{N} \times$ number of flows with length $s$, where
    $N$ is the number of flows in the dataset;

    Per packet. $f_P(s) = \frac{1}{P} \times$ number of packets that belong to a flow
    of length $s$, where $P$ is the number of packets in the dataset;


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_239_0.png)


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_239_1.png)


    **Figure 7.3** Distribution of flow sizes, viewed by an arbitrary flow and an
    arbitrary packet, measured by an internet service provider.'
