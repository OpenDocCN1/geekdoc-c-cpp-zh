  md: "# Fitting Differenced Data to an ARMA Model\n\nThe method in this section is\
    \ inspired by the original method of Box and Jenkins in [15] and can be called\
    \ the Box-Jenkins method, although some of the details differ slightly. It applies\
    \ to cases where the differenced data X appears to be stationary but not iid.\
    \ In essence, the method provides a method to soften the differenced data, i.e.\
    \ it computes a filter F such that FX can be assumed to be iid. We first discuss\
    \ how to recognize whether data can be assumed to be iid.\n\n# 5.5.1 Stationary\
    \ but non iid Differenced Data\n\nAfter pre-processing with differencing and de-seasonalizing\
    \ filters we have obtained a data set appearing to be stationary. We see in Chapter\
    \ 6 that a stationary model is such that it is statistically impossible to recognize\
    \ at which time a particular sample was taken. The time series in panel (c) of\
    \ Figure 5.7 appear to have this property, whereas the original data set in panel\
    \ (a) does not. In the context of time series, lack of stationarity is due to\
    \ growth or periodicity; if a data set increases (or decreases), then by observing\
    \ a sample we can have an idea of whether it is old or young; if there is a daily\
    \ pattern, we can guess whether a sample is at night or at daytime.\n\n# Sample\
    \ ACF\n\nA means of testing whether a data series that appears to be stationary\
    \ is iid or not is the sample autocovariance function. In analogy with the autocovariance\
    \ of a process, it is defined, for t ≥0\n\n```\n\\hat{\\gamma}_t = \\frac{1}{n}\
    \ \\sum_{s=1}^{n-t} (X_{n+t}-\bar{X})(X_s-\\bar{X}) \\quad (5.20)\n```\n\nwhere\
    \ X is the mean name. The sample ACF is defined as $\\hat{\rho}_t=\\hat{\\gamma}_t/\\\
    hat{\\gamma}_0$. The sample PACF is also defined as an estimator of the true PACF\
    \ (Section C.6)\n\nIf $X_1,...,X_n$ are iid with finite variance, then the sample\
    \ ACF and PACF are asymptotically centered normal with variance $1/n$. ACF and\
    \ PACF plots usually display the bounds $\\pm1.96/\\sqrt{n}$. If the sequence\
    \ is iid then roughly 95% of the points should fall within the bounds. This provides\
    \ a method for assessing whether $X_t$ is iid or not. Then no further method is\
    \ required, and we are back to the case in Section 5.4.2. See Figure 5.10 for\
    \ an example.\n\nThe ACF can be tested by means of the Ljung-Box test. It tests\
    \ $H_0$: \"the data is iid\" $H_1$: \"the data is stationary\". The test statistic\
    \ is $L=n(n+2)\\sum_{s=1}^{n}\\frac{\\hat{\rho}_s^2}{n-s}$; where $t$ is a parameter\
    \ of the test (number of coefficients), typically $\\sqrt{n}$. The distribution\
    \ of $L$ under $H_0$ is $\\chi^2$, which can be used to compute the p-value."
  merge: -1
