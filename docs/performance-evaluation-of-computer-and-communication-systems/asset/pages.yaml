  md: 'A customer may have a different viewpoint. If she sends a job to the system
    at a random instant, she will be allocated to an application processor depending
    on the time of arrival. The customer computes her performance metric assuming
    she picks a millisecond at random, uniformly in an interval $[0, T]$, where $T$
    is large, and obtains


    ```

    $W_c = \frac{90}{100} \times 5000 + \frac{10}{100} \times 1000 = 4600 \text{ ms}$

    ```


    The metric $W_s$ is an event average; it can be measured using the event clock
    that ticks whenever the gatekeeper wakes up. The metric $W_c$ is a time-average;
    it can be measured using a clock that ticks every millisecond.


    This example shows that event averages can be very different from time averages.
    In other words, *sampling bias* may be a real issue. It is therefore necessary,
    when defining a metric, to specify the clock (i.e which viewpoint) is adopted.
    Further, one should discuss which viewpoint sense for the performance of interest.
    In the previous example, the time-average viewpoint is a better metric as it directly
    reflects customer experience.


    # 7.1.2 The Large Time Heuristic


    Palm calculus is a set of formulas for relating event and time averages. They
    form the topic of the other sections in this chapter. However, it may be useful
    to know that most of these formulas can be derived heuristically using the *large
    time heuristic*, which can be described as follows.


    +   (1) Formulate each performance metric as a long run ratio, as you would do
    in order to evaluate the metric in a discrete simulation:


    +   (2) take the formula for the time-average viewpoint and break it down into
    pieces, where each piece corresponds to a time interval between two selected events:


    +   (3) compare the two formulations.


    We explain this in the example.


