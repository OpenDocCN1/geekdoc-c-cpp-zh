    ```


    Changing of the variable $t=k\tau$, gives us


    ```

    D(1,1,u) \sim \max_{\tau\geq0} \left((\frac{\lambda}{c_0} - 1\right)k\tau + \sqrt{\lambda
    a}k^H B_H(\tau)\\frac{1}{c_0\sqrt{u}}

    ```


    where $\sim$ same distribution. Take $k$ such that $k=\frac{k^H}{\sqrt{u}}$, i.e.,
    $k=u^{-1/2(1-H)}$. We have then


    ```

    D(1,1,u) \sim u^{-2(1-H)}D(1,1,1)

    ```


    In summary, the delay scales according to


    ```

    D(v,s,u) = \frac{1}{su^b}D(1,1,1)

