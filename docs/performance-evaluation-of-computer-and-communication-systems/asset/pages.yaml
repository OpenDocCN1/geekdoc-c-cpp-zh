    $q_{s,c}^{s} = 0 \quad$ otherwise

    ```


    where all numbers are positive, $\alpha_1 \le 1$ and $\alpha_1 + \beta_1 \le 1$.

    There are two chains: $\{1, 2, 3\}$ and $\{4\}$. The first chain is open, the
    second is closed, so we have a mixed network.

    Let $\nu$ be the arrival rate of external jobs and $p_i$, the probability that
    an arriving job is of class $i$. The visit rates


    ```

    Class 1: $\theta_1^1 = \nu \frac{p_1}{1-\alpha_1}; \quad \theta_2^1 = 0; \quad
    \theta_3^1 = 0$;

    Class 2: $\theta_2^2 = \nu (\frac{p_2}{1-\beta_1}+\frac{p_1}{1-\alpha_1}); \quad
    \theta_1^2 = 0; \quad \theta_3^2 = 0$;

    Class 3: $\theta_3^3 = \nu \frac{1}{1-\alpha_3} (p_3+\alpha_2p_2+\alpha_2\beta_1\frac{p_1}{1-\alpha_1});
    \quad \theta_1^3 = 0; \quad \theta_2^3 = 0$;

    Class 4: $\theta_4^4 = 1; \quad \theta_4^4 = 1$.

    ```


    Note that the visit rates are uniquely defined for the classes in the open chain
    (1, 2 and 3). In contrast, for class 4, any constant can be used (instead of the
    constant 1).'
