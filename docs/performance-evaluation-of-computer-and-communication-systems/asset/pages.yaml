    Gamma = E((\\tilde{X}-\\mu)(\\tilde{Y}-\\tilde{\nu})^T) \\quad (C.9)$\n```\n\n\
    with $\\mu = E(\\tildetilde{X})$ and $\\tilde{\nu} = E(\\tildetilde{Y})$.\n\n\
