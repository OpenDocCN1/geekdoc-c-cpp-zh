    # Example 2.1 Comparison of Two Options


    An operating system vendor claims that the new version of the database management
    system significantly improves the performance. We measured the execution times
    of a series of commonly used programs with both options. The data are displayed
    in Figure 2.3. The raw displays and histograms demonstrate that both options have
    the same range, but it seems (graphically) that the new system often provides
    a smaller execution time. The box plots are more suggestive; they show that the
    average and the range are about half for the new system.


    In Section 2.5, we discuss the differences between these two modes of summarization.


    # 2.1.3 Coefficient of Variation and Lorenz Curve Gap


    The coefficient of variation and the Lorenz curve gap are frequently used measures
    of variation, rescaled to be invariant by change of scale. They apply to a positive
    data set $x_1, \dots, x_n$.


    # Coefficient of Variation


    It is defined by


    $CoV = \frac{s}{m} (2.2)$


    where $m$ is the mean and $s$ the standard deviation, i.e. it represents the standardrescaled
    by the mean. It is also sometimes called the *signal to noise ratio*. For a data
    set with $n$ values one always has^{(2)


    $0 \le CoV \le \sqrt{n-1} (2.3)$


    where the upper bound is obtained when all $x_i$ have the same value except one
    of them.


    # Lorenz Curve Gap


    This is an alternative measure of dispersion, obtained when we replace the standard
    deviation by the **Mean Absolute Deviation (MAD)**. The MAD is defined as


    $MAD = \frac{1}{n} \sum_{i=1}^{n} |x_i - m|$


    i.e. we compute the mean distance to the mean, instead of the square root of the
    mean square distance. Compared to the standard deviation, the MAD is


    > ^{(2)}Consider the maximization problem: maximize $\sum_i(x_i - m)^2$ subject
    to $x_i \ge 0$ and $\sum x_i = mn$. Since $x_i \mapsto (x_i - m)^2$ is convex,
    the maximum is at an extreme point $x_{i_0} = mn, x_i = 0, i \neq i_0$.'
