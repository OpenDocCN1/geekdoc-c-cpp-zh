  md: "# Model Fitting\n\nFor large $m_1, m_2$, by the convergence result mentioned\
    \ earlier, we should have approximately the distribution equalities according\
    \ to\n\n```\n$$\\frac{1}{X_p^{(m_1)}} \\sim \\frac{1}{X_p^{(m_2)}} \\quad (3.29)$\n\
    ```\n\nThe idea is now to plot the empirical complementary curves of $X^{(m)}$\
    \ for various values of $m$. Further, the deviation between two curves of the\
    \ plot is analyzed by means of horizontal and vertical deviations $\\delta$ and\
    \ $\tau$ as shown in Figure 3.17 and thus we have $\\delta = \\log x_2 - \\log\
    \ x_1$. By using (3.29), we get\n\n```\n$x_2 = (m_1)^{1/p_x}x_1$ and thus\n$$\\\
    $\\delta = -\\log \\frac{m_2}{m_1}$$\n```\n\nAlso, if $X_i$ is heavy-tailed, and\
    \ $m$ is large, the distribution of $X_i^{(m)}$ is approximately stable. Consequently,\
    \ if $m_2$ is an integer, the distribution of $X_j^{(m_2)}$ (which is a sum of\
    \ $X_i^{(m_1)}$) is the same as that of $(m_2)^{1/p_x}X_i^{(m_1)}$. We should\
    \ should have\n\n```\n$$\\tau = \\log \\mathbb{P}(X_i^{(m_2)} > x_1) - \\log \\\
    mathbb{P}(X_i^{(m_1)} > x_1) \\approx \\log \\frac{m_2}{m_1}$$\n```\n\nThe method\
    \ in *aest* consists of using only the points $x_1$ where the above holds, and\
    \ subsequently, at such points, estimating $p$ by\n\n```\n$$\\p = \\frac{1}{\\\
    \\delta} \\log \\frac{m_2}{m_1}$$\n```\n\nThe average of these estimates is then\
    \ used. See Figure 3.17 for an illustration.\n\n![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_121_0.png)\n\
    \n**Figure 3.17** (a) : Deviations in the *aest* tool. (b) Application to the\
    \ dataset in Example 3.11. There is a heavy tail, with an estimated index $p=1.12$\
    \ (the same as that obtained by the direct method in Example 3.11)."
