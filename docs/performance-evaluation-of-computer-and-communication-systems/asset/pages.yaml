  md: '# Theorem 5.4


    Consider an ARMA or ARIMA model with parameters as in Definition 5.1. The parameters
    are constrained to be in a certain set S. Assume that we are given some observed
    data $x_1, \dots, x_N$.


    +   (1) The log likelihood of the data is $-\frac{N}{2} \ln(2\pi\hat{\sigma}^2)$
    where

    $$\hat{\sigma}^2 = \frac{1}{N} \sum_{t=2}^N (x_t - \hat{x}_{t-1}(1))^2$$


    +   and $\hat{x}_{t-1}(1)$ is the one ahead forecast at time $t-1$.

    (2) The maximum likelihood estimation is equivalent to minimizing the mean square
    one ahead forecast error $\hat{\sigma}$, subject to the model parameters being
    in $S$.


    The one step forecasts $\hat{x}_{t-1}(1)$ are computed using Proposition 5.6.
    Care should be taken to remove the initial values if differencing is performed.
    Contrary to linear regression, the optimization involved is non-linear, if the
    constraints on the parameter set is linear. The optimizer usually requires some
    initial guess to run efficiently. For MA(q) or AR(p), there exist estimation procedures
    (called moment heuristics) that do not involve maximum likelihood but are numerically
    fast [105]. These are based on the observation that for MA(q) or AR(p) processes,
    if we know the autocovariance function exactly, then we can compute the coefficients
    numerically.(8) In such cases, we use the sample autocovariance as an estimate
    of the autocovariance function, when we deduce an estimate of the parameters of
    the process. This is less accurate than the maximum likelihood, which is typically
    used as an initial guess. For example, if we want to compute the maximum likelihood
    estimate of a general ARMA(p,q) model, we estimate the parameters $\mu, \sigma,
    C_1, \dots, C_q$ of an MA(q) model, using a moment fitting. As an initial guess,
    we give the same values plus $A_1 = \dots = A_p = 0$.


    It is necessary to verify that the obtained ARMA model corresponds to a stable
    filter with stable inverse. Good software packages automatically do, but at times,
    may be impossible to obtain both a stable filter and a stable inverse. It is generally
    admitted that this may be fixed by changing the differing filter: too little difference
    may make it impossible to obtain a stable filter (as the differenced data is not
    stationary). Conversely, too much difference may render it impossible to obtain
    a stable inverse [19].


    # Determination of Best Model Order


    Deciding on the correct order may be done with the help of an information criterion
    (Section 5.3.2), such as the AIC. assume that we would like to fit the differenced
    data $X_t$, to a general ARMA(p.q) model without any


    > (8) For AR(p) processes, the AR coefficients are obtained by solving the "Yule-Walker"
    equations, using the "Levinson-Durbin" algorithm [105].'
