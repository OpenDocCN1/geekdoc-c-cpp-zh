  md: 'The behavior of the hazard rate $\lambda(x)$ when $x$ is large can be used
    as a characteristic of a distribution. Qualitatively, one may distinguish between
    the three types of behavior:


    +   (1) (Aging Property) $\lim_{x\to\infty}\lambda(x)=\infty$: the hazard rate
    becomes large for large $x$. This is very expected, e.g. when one has reasons
    to believe that a file or flow is unlikely to be arbitrarily large. If $X$ is
    interpreted as the system lifetime, then it is the property of aging. The Gaussian
    distribution resides in there.


    +   (2) (Memorless Property) $\lim_{x\to\infty}\lambda(x)=c>0$: the hazard rate
    tends to become constant for large $x$. This is particularly true if the system
    is memoryless, i.e. when $\lambda(x)$ is a constant. The exponential distribution
    here (as does the Laplace distribution)


    +   (3) (Fat Tail) $\lim_{x\to\infty}\lambda(x)=0$: the hazard rate vanishes for
    large $x$. This may appear surprising: for a flow duration, it means that, given
    we waited a significant amount of time for completion of the flow, we are likely
    to continue waiting for a very long time. The Pareto distribution with index $p$
    resides in this case for all values of $p$, as do log-normal distributions. We
    may, informally, call this property a "fat tail". Heavy tail distributions (defined
    in Section 3.5) occur here, but there are also non-heavy tail distributions.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_109_0.png)


    **Figure 3.12** Shapes of the Weibull distribution for various values of the exponent
    $c$. The distribution is re-scaled to mean $=1$. $\gamma_2$ is the Kurtosis index.'
