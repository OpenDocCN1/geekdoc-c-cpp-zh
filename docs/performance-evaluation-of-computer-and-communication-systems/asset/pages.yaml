  md: "# 8.3.2 The Single Server Queue\n\nWe consider the most general queue with\
    \ one single server and with infinite capacity. Note that we do not assume Poisson\
    \ arrivals, and we allow service times to depend on the state of the system. We\
    \ assume that the system is work conserving. More precisely, let $W(t)$ be the\
    \ backlog process, i.e. the sum of the service times of all customers that are\
    \ present in the system at time $t$. When a customer arrives, $W(t)$ increases\
    \ by the (future) service time of this customer. The work conserving assumption\
    \ means that $W(t)$ decreases at rate 1 over any time interval such that $W(t)\
    \ > 0$.\n\nAn important issue in the analysis of the single server queue is stability.\
    \ In mathematical terms, it is a measure of whether the backlog $W(t)$ is stationary.\
    \ When the system is unstable, a typical behavior is that the backlog grows to\
    \ infinity.\n\nThe following is the general stability condition for the single\
    \ server queue. Let $S$ be the expectation of the service time, $\\lambda$ the\
    \ intensity of the arrival process (expected number of arrivals per second) and\
    \ $\rho = \\lambda S$ the utilization factor.\n\n> Theorem 8.6 (Lynes [3, Thm\
    \ 2.1.1])\\If $\rho < 1$, the backlog process has a unique stationary regime.\
    \ In the stationary-regime, the queue empties infinitely often.\n\n> Furthermore,\
    \ for any initial condition, the waiting time of the nth customer converges in\
    \ distribution as $n \\to \\infty$ to the waiting time for an arbitrary customer\
    \ computed in the stationary regime.\n\n> If $\rho > 1$, the backlog process has\
    \ no stationary regime.\n\nA heuristic explanation for the necessary condition\
    \ is that, if the system is stable, all customers eventually enter the service,\
    \ and thus the mean number of beginnings of service per second is $\\lambda$.\
    \ From Little's law applied to the server (see Section 8.2), we have $\\rho$ the\
    \ probability of the server being busy, is $\\rho \\le 1$. For $\\rho = 1$, there\
    \ may or may not be stability, depending on the specific queue. Be careful that\
    \ this intuitive result holds only for a single queue. For networks of interconnected\
    \ queues, there is no general result, as discussed in Section 8.4. The theorem\
    \ holds for a queue with infinite capacity. For a finite capacity queue, there\
    \ is, in general, stability for any value of $\\rho$ (but for $\\rho > 1$, there\
    \ must be losses).\n\nQUESTION 8.4 Consider a queuing system of the G/G/1 where\
    \ the service time $S_n$ of customer $n$ is equal to the inter-arrival time $A_{n+1}\
    \ - A_n$. What are the values of $\\rho$ and the expected number of customers\
    \ $N(t)$?\n\n$(5) $\\lambda = \\frac{1}{S}$ thus $\\rho = 1$. There is always\
    \ exactly one customer in the queue. Then $N=1$."
