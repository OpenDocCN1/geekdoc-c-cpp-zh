    # Category 1: Insensitive Station or Kelly-Whistle Stations


    This category of stations is called ''insensitive'' or ''Kelly-Whistle'', for
    reasons that become clear before. We first give a formal, theoretical definition,
    then list the most frequent instances.


    # Formal Definition


    +   (1) The service requirement may be any phase-type distribution; in practice,
    this may approximate any distribution, see Section 8.8.1. The service distribution
    may be dependent on the class.


    +   (2) Insertion Probability. There is an array of numbers $\gamma(i, B) \geq
    0$ for any index $i \in I$ and any station buffer state $B$, such that: when a
    class c customer arrives and finds the station buffer in state $B$ just before
    the arrival, the position at which this customer is added is drawn at random,
    and the probability that he/she is added to a position indexed by $i$ is


    $$\gamma(i, add(B, i, c))$$


    The same happens whenever a customer finishes a service phase (from the phase-type
    service distribution), at which time he/she is treated as a new arrival.'
