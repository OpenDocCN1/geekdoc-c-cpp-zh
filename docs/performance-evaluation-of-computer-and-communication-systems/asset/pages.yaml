  md: 'whether it is worth considering the more complex model $\Theta$, which has
    $k > k_0$ dimensions for the mean. From its definition, we can interpret those
    sums of squares according to the following.


    +   * $SS2$ is the sum of squares explained by the model $\Theta$, or explained
    variation.

    * $SS1$ is the residual sum of squares.

    * $SS0$ is the total sum of squares.


    The likelihood ratio test accepts $\Theta$ when $SS2/SS1$ is large, i.e. when
    the percentage of the sum of squares $SS2/SS1$ (also called percentage of variation)
    is explained by the model $\Theta$, is high.


    The dimensions are interpreted as degrees of freedom: $SS2$ in the orthogonal
    of $M_0$ in $M$, with dimension $k - k_0$ and the number of degrees of freedom
    for $SS2$ is $k - k_0$; $SS1$ (residual variation) is the square of the norm of
    a vector that is orthogonal to $M$ and the number of degrees of freedom for $SS1$
    is $|R| - k$. This explains the name “ANOVA”: the likelihood ratio test statistic
    depends only on estimators of variance. Note that this is very specific for homoscedasticity.


