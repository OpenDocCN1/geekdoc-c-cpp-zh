    Y_t$ has a zero\mean. Thus, after differencing we have obtained a stationary but

    on-zero mean sequence, an additional differencing operation produces a zero\mean
    sequence.


    # 5.4.2 Computing Point Prediction


    With many time series, differencing and deseasonalizing produces a data set that
    has neither growth nor periodicity. It is thus a good candidate for being fitted
    to a simple stochastic model. The present section illustrates a straightforward-

    application of this idea. The method used here is also used in Section 5.3

    with more elaborate models for the differenced data.


    Assume that we have a model for the differenced data $X$. Then we can\employ to
    obtain predictions for $X$. How can this information be used to

    drive a prediction for the original data $Y_t$? There is a very simple solution

    based on the properties of filters given in the appendix.


    We compactly $X = LY$, where $L$ is the combination of filters that are

    used (possibly several times each) for differencing and deseasonalizing. For

    ample, in Figure 5.7, $L = \Delta_s\Delta$. $\Delta_s$ is an invertible filter
    for $s > 1$

    and is also an invertible filter (see Section D for more details!)

    We can use the AR($q$) representation of $L$ and write, using (D.16) in the

    appendix:


    $Y_t = X_t - g_1Y_{t-1} - \dots - g_qY_{t-q}$,


    where $g_0=1$ is the impulse response of the filter $L$. The next

    example and Section D for more details on how to obtain the impulse response

    of L. The following result derives immediately from this and from Theorem D.2


    Proposition 5.2 Assume that $X = LY$, where $L$ is a differencing or

    seasonalizing filter with impulse response $g_0 = 1$. Assume that we are

    able able to produce a point prediction $\hat{Y}_t$ for $Y_t$, given that we have
    observed $X_s$ up to $X$. For example, if the differenced data can be assumed
    to be iid

    with a mean of $\mu$, then $\hat{Y}_t = \mu$.


    > (More precisely $E(\Delta_s Y_t) = 0$ for $t \geq s-1$. In other words the first
    elements of the

    differenced time series may not be 0 in mean)'
