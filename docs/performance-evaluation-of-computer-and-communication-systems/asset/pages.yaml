  md: "# 4.1.2 Critical Region, Size and Power\n\nThe **critical region**, also called\
    \ the **rejection region** of a test is a set of values of the tuple $(x_1, \\\
    dots, x_n)$ such that if $(x_1, \\dots, x_n) \\in C$, we reject $H_0$, and otherwise\
    \ we accept $H_0$. The critical region entirely defines the test.(1)}\n\nThe output\
    \ of a test is thus a binary decision: “accept $H_0$”, or “reject $H_0$”. The\
    \ output depends on the data, which is random, and may be wrong with (hopefully\
    \ small) probability. We distinguish between two types of errors.\n\n+   * A **type-1**\
    \ error occurs if we reject $H_0$ when true.\n* Conversely, a **type-2** error\
    \ occurs if we accept $H_0$ when $H_1$ is true.\n\nThe art of test development\
    \ consists in minimizing both error types. However, it is usually difficult to\
    \ minimize two objectives at time. The maximum probability of a type-1 error,\
    \ taken over all $\theta \\in \\Theta$ is called the *size* of the test. The *power*\
    \ of the test is the probability of rejecting $H_0$ as a function of $\theta \\\
    in \\Theta \\setminus \\Theta_0$. Neyman-Pearson tests are designed such that\
    \ they have a fixed size (typically 5%, or 1%). Good tests (i.e. those in these\
    \ lecture notes used in Matlab) are designed so to maximize, exactly or approximately,\
    \ the power, to a fixed size. A test is said to be uniformly powerful (UMP) if,\
    \ among all tests of equal size, it maximizes the power for every value of $\t\
    heta \\in \\Theta \\setminus \\Theta_0$. UMP tests exist for few models, for which\
    \ less restrictive requirements have been developed (the reference for these issues\
    \ is [62]).\n\nIt is important to be aware of the two types of errors, and of\
    \ the fact that size is just one facet. Assume that we use a UMP test of size\
    \ 0.05; this does not mean that the risk of error is 0.05, or that it is small.\
    \ This simply means that all other tests that have a risk of a type-1 error bounded\
    \ by 0.05 must have a risk of a type-2 error which is the same or larger. Thus,\
    \ we may need to verify whether, for the data at hand, the power is indeed large\
    \ enough, though this is seldom done in practice.\n\n# **Example 4.2** Comparison\
    \ of two Options, Reduction in Run Time\n\nThe reduction in run time due to a\
    \ new compiler is given in Figure 2.7. Assume that the data comes from some iid\
    \ $X_1 \\sim N_{\\mu, \\sigma^2}$. This may be argued and discussed again, but\
    \ it is convenient to discuss this here. We do not know $\\mu$ or $\\sigma$. We\
    \ want to test $H_0: \\mu = 0$ against $H_1: \\mu > 0$. Here, $\theta = (\\mu,\
    \ \\sigma)$, $\\Theta = (0, \\infty) \times (0, \\infty)$ and $\\Theta_0 = \\\
    {0\\} \times (0, \\infty)$. An intuitive definition of a test is to reject $H_0$\
    \ if the sample mean is large enough; we rescale\n\n> (1) In general, one should\
    \ also consider randomized tests, which may output a random function of $(x_1,\
    \ \\dots, x_n)$. See [81] for further details. We do not use such tests in our\
    \ setting"
