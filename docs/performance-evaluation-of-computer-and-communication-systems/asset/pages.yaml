  md: "# Gaussian Random Vectors in R^n\n\nwhere $U$ is an orthogonal matrix ($U^T\
    \ = U^{-1}$), $r$ is the rank of $\\Omega$ and $\\lambda_1 \\ \\dots \\ge \\lambda_r\
    \ > 0$.\n\nIt follows from this representation that the equation $\tilde{X}^T\\\
    Omega\tilde{X}=0$ has a non-zero solution ($\tilde{X} \\neq 0$) if, and only if,\
    \ $\\Omega$ has full rank.\n\n# C.2.3 Choleski's Factorization\n\nEquation (C.11)\
    \ can be replaced by a computationally less expensive reduction, called *Choleski's\
    \ factorization*. This is a polynomial time algorithm for finding a lower triangular\
    \ matrix $L$ such that $\\Omega = LL^T$. Choleski's factorization applies to positive\
    \ semi-definite matrices and is readily available in many software packages.\n\
    \n# C.2.4 Degrees of Freedom\n\nLet $V = \\span(\\Omega)$ be the linear sub-space\
    \ of $\\mathbb{R}^n$ spanned by the columns (or rows, where $\\Omega$ is symmetric)\
    \ of $V$. Recall that $\tilde{X}$ is not necessarily Gaussian.\n\n**Proposition\
    \ C.1** $\tilde{X}$ is constrained to the affine sub-space parallel to $V$ that\
    \ contains $\\tilde{\\mu} = E(\\tilde{X})$, i.e. $\tilde{X} - \\tilde{\\mu} \\\
    in V$ with probability 1.\n\nIt follows that the number of **degrees of freedom**\
    \ of $\\tilde{X}$ (defined in this case as the dimension of an affine space that\
    \ $V$ can be embedded in) is equal to the dimension of $V$, namely, the rank of\
    \ $\\Omega$. In particular, if $\\Omega$ does not have full rank, $V has zero\
    \ mass (its Lebesgue measure is 0) and the integral of any function on $V$ is\
    \ 0. Thus, it is impossible that $\\tilde{X}$ has a probability density function.\n\
    \n**Corollary C.1** If $\\tilde{X}$ has a probability density function (PDF) then\
    \ its covariance matrix $\\Omega$ is invertible.\n\nExample C.1\n\nIn $\\mathbb{R}^3$,\
    \ let the covariance matrix of $\\tilde{X}$ to be\n\n```\n$$\\Omega = \\begin{pmatrix}\
    \ a & 0 & a \\ 0 & b & b \\ a & b & a+b \\end{pmatrix} \\quad (C.12)$\n```\n\n\
    $a, b$ are positive constants. The rank is $r=2$. The linear space generated by\
    \ the columns of $\\Omega$ is the plane defined by $x_1 + x_2 - x_3 = 0$. Thus\
    \ the random vector $\\tilde{X} = (X_1, X_2, X_3)^T$ is in the plane defined by\
    \ $X_1 + X_2 - X_3 = \\mu_1 + \\mu_2 - \\mu_3$, where $\\tilde{\\mu} = (\\mu_1,\
    \ \\mu_2, \\mu_3)^T$."
