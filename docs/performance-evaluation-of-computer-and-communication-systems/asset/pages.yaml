    \ is a random vector in $\\mathbb{R}^{n'}$ and $A$ is a non-random $n' \\times\
    \ n$ matrix, the covariance matrix $\\Omega'$ of $X'$ is\n\n```\n$\\Omega' = A\\\
    Omega A^T \\quad (C.10)$\n```\n\nAny covariance matrix can be put in standard\
