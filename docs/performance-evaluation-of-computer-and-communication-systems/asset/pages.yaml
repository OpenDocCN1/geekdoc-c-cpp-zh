    # # Queuing Theory for

    Those who cannot Wait


    Queuing phenomena are very frequent in computer and communication systems, and
    explain a vast number of performance patterns. There exists a large body of available
    results in queuing theory; in this chapter, we focus on results and concepts that
    are very broadly applicable, some of which are not very known. We present four
    topics, which constitute a good coverage of all the techniques required in practice.


    ![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_282_0.png)


    First, we start with simple, deterministic results; they provide results on transient
    phenomena, and also some worst-case bounds. These are often overlooked, but give
    a first, sometimes sufficient, insight. Second, we present operational laws for
    queuing systems: in some sense they are the “physical laws” of queuing: Little''s
    formula, the DASSA property, network and forced flows law. Here we make frequent
    use of Palm calculus (Chapter 7). These results also provide tools and bounds
    for fast analysis. Third, we give a series of simple, albeit important, results
    for single queues with one or several servers and for the processor sharing queue;
    these can be taken as models for systems without feedback. Fourth, we discuss
    a network of queues, which can be used to model'
