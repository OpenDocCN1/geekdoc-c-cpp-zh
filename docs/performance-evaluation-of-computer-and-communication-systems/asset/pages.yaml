    # Example 1.17 Museum audio guides


    A museum offers free audio guides to be downloaded on MP3 players. Visitors plug
    their MP3 players into the docking devices, and the latter connect via a wireless
    LAN to the museum server. Data transfer from the docking device to the MP3 player
    goes through a USB connector. The system was later tested with different numbers
    of docking devices, and Figure 1.7(a) shows the download time versus the number
    of docking devices in use.


    The museum later decides to buy better docking devices, with a faster USB connection
    between the device and MP3 player (enabling the transfer rate to be doubled).
    As can expected, the download time is smaller when the number $n$ of docking devices
    is low, surprisingly, it is larger when the number $n \ge 7$ (Figure 1.7(a)).
    What can have happened? It is known that the wireless LAN access method is susceptible
    to congestion collapse: when the offered load increases, packet collisions become
    frequent and the time to successfully transfer one packet becomes larger, causing
    the throughput to be lowered. We may conjecture that improving the transfer speed
    between the docking device and the MP3 player increases the load on the wireless
    LAN. The congestion collapse was not possible before due to the low speed docking
    devices acting as an (involuntary) access control method.


    We can verify this conjecture by plotting the throughput in the place of the download
    time, and extending the first experiment to large values of $n$. We see in Figure
    1.7(b) that there is indeed a reduction in throughput, at a point that depends
    on the speed of the USB connection.'
