  md: '![](img/0ee2e2c6cc7c59a05af35f3d0fbf1ed0_170_0.png)


    Figure 5.7 (Continuation.)


    Similarly, if the data $Y$ is periodic with period $s$, we can use the *de-seasonalizing*
    filter $R_s$ (proposed by S.A. Roberts in [89]). It maps a series $Y$ of finite
    length into a time series $X = R_sY$ of *equal length* such that we have


    $X_t = \sum_{j=0}^{s-1} Y_{t-j} \quad t=1, \dots, n \quad (5.10)$


    again with the convention that $Y_t = 0$ if $t \leq 0$. One application of $R_s$
    removes a periodic component, in the sense that if $Y_t$ is periodic of period
    $s$, then $R_sY$ is equal to a constant.


    The differencing filter at lag $s$, $\Delta_s$, is defined in a similar manner
    by


    $(\Delta_sX)_t = Y_t - Y_{t-s} \quad (5.11)$


    It can be easily seen that


    $\Delta_s = R_s\Delta_1 \quad (5.12)$


    i.e. combining de-seasonalizing and differencing at lag 1 is the same as differencing
    at lag $s$.


    Filters commute, e.g. $R_{s''}R_sY = R_sR_{s''}Y$ for all $s, s''$ and $Y \in
    \mathbb{R}^n$ (see Section D). It follows that the differencing filter and de-seasonalizing
    filter may be used to remove polynomial growth, non-zero mean and periodicities,
    and that one can apply them in any order. In practice, one tries to apply $R_s$
    once for any identified period $d$, and $\Delta_1$ as many times as required for
    the data to appear stationary.'
