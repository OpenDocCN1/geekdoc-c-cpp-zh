  md: 'model overfitting and present a set of simple models that have few parameters.
    We show that accounting for growth and seasonal effects is very simple and may
    be very effective. The necessary background on digital filters can be found in
    Chapter D in the Appendix.


    # 5.1 What is Forecasting?


    A classical forecasting example is capacity planning, where a communication or
    data center manager needs to decide when to buy additional capacity. Other examples
    concern the optimal use of resources: if a data center is able to predict that
    certain customers send less traffic at night, this may be used to save power or
    to resell the capacity to customers in other time zones.


    In any performance related activity, it is important to follow a clean methodology,
    in particular, define appropriate metrics relevant to the problem area, define
    measurement methods, and gather time series of data. The techniques seen in this
    chapter start at this point, i.e. we assume that we have some past measurement
    data, and would like to establish a forecast.


    Informally, one can say that a forecast consists of extracting all information
    about the future that is already present in the past. Mathematically, this can
    be done as follows. To avoid complex mathematical constructions, we assume time
    to be discrete. We are interested in a certain Y(t), where t = 1, 2, . . . We
    assume that there is some randomness in Y(t), and it is thus modeled as a stochastic
    process. Assume that we have observed Y1, . . . , Yt and would like to say something
    about Ytt for a certain l > 0.


    **Forecasting** can be viewed as computing the conditional distribution of Yt+l
    given Y1, . . . , Yt.


    In particular, the **point prediction** or predicted value is


    Y_t(t) = E(Y_t+l | Y_1 = y_1 . . . , Y_t = y_t)


    and a **prediction** interval at level 1 - α is an interval [A, B] such that


    P(A ≤ Y_t+l ≤ B | Y_1 = y_1, . . . , Y_t = y_t) = 1 - α


    The forecasting problem then becomes (1) to find and fit a good model, and (2)
    to compute conditional distributions.


    # 5.2 Linear Regression


    A simple and frequently used method is linear regression. It gives simple forecasting
    formulas, which are often sufficient. Linear regression models are defined in
    Chapter 3. In the context of forecasting, a linear regression model takes the
    form


    ```

    Y_t = \sum_{j=1}^{p} \beta_j f_j(t) + \epsilon_t  (5.1)

    ```'
