  md: '# Gaussian Random Vectors in $\mathbb{R}^n$


    A homoscedastic Gaussian vector always has a density (since its covariance matrix
    is invertible) given


    ```

    $f_{\vec{X}}(\vec{x}) = \frac{1}{(2\pi)^{n/2}} e^{-\frac{1}{2}\|vec{x}-\vec{\mu}\|^2}
    \quad (C.16)$

    ```


    Homoscedasticity is preserved by orthogonal transformations.


    Theorem C.5

    Let $U$ be an orthogonal matrix (i.e. $U^{-1} = U^T$). If $\vec{X}$ is homoscedastic
    Gaussian and $\vec{Y} = U\vec{X}$, then $\vec{Y}$ is also homoscedastic Gaussian
    with the same variance.


    The following theorem underlies the ANOVA theory.


    Theorem C.6

    Let $\vec{X}$ be homoscedastic Gaussian in $\mathbb{R}^n$, $\vec{\mu} = E(\vec{X})$
    and $M$ some linear subspace of $\mathbb{R}^n$, of dimension $k$. Let $\Pi_M$
    be the orthogonal projection on $M$.

    (1) $\Pi_M\vec{X}$ and $\Pi_M\vec{\mu}$ are independent,

    (2) $\|Pi_M\vec{X} - \Pi_M\vec{\mu}\|^2 \sim \chi_k^2$,

    (3) $\|vec{X} - \vec{\mu} + \Pi_M\vec{\mu}\|^2 \sim \chi_{n-k}^2$,

    where $\chi_n^2$ is the chi-square distribution with $n$ degrees of freedom.


    # C.4.2 Maximum Likelihood Estimation for Homoscedastic Gaussian Vectors


    Theorem C.7 (ANOVA)

    Let $\vec{X}$ be homoscedastic Gaussian in $\mathbb{R}^n$ with variance $\sigma^2$
    and expectation $\vec{\mu}$. Assume that $\vec{\mu}$ is restricted to a linear
    subspace $M$ of $\mathbb{R}^n$; let $k = dim M$. We are interested in estimating
    the true values of $\vec{\mu}$ and $\sigma^2$.

    (1) The MLE of $(\vec{\mu}, \sigma^2)$ is $\hat{\mu} = \Pi_M\vec{X}$, $\sigma^2
    = \frac{1}{n}\|vec{X} - \hat{\mu}\|^2$.

    (2) $E(\hat{\mu}) = E(\vec{X})$.

    (3) $\vec{X} - \hat{\mu}$ and $\vec{\mu}$ are independent Gaussian random vectors
    and $\|vec{X} - \vec{\mu}\|^2 = \\|vec{X} - \hat{\mu}\|^2 + \\|\hat{\mu} - \vec{\mu}\|^2$.

    (4) $\|\hat{\mu} - \vec{\mu}\|^2 \sim \chi_{n-k}^2\sigma^2$.

    (5) (Fisher distribution)


    ```

    $\frac{\|\hat{\mu} - \vec{\mu}\|^2}{k} \sim F_{k,n-k}$

    ```'
