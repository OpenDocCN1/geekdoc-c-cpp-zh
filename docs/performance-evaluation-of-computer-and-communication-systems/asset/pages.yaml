  md: '# Sparse ARMA and ARIMA Models 171


    For time series with a periodic behavior, there exist extensions of the Holt-Winters
    models, which maintain the same simplicity, and can be explained as ARIMA models.
    There are several variants, which differ in the choice of certain coefficients.


    Assume that we know that the non-differenced data has a period $s$. The idea is
    to keep the level and trend estimates $\hat{m}_t$ and $\hat{r}_t$, and to introduce
    corrections for seasonality $\hat{s}_t(i)$, for $i = 0, \dots, s-1$. The forecasting
