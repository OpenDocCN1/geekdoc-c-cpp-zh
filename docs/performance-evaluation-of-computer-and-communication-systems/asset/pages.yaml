    epsilon_1, \\dots, \\epsilon_n)^T$ is white Gaussian noise and $L$ is a non-random\
    \ $p \times n$ matrix. The vector $\\vec{X}$ is Gaussian with covariance matrix\
    \ $\\Omega = LL^T$. The rank of $\\Omega$ is equal to the rank of $L$.\n\nWe use\
    \ these properties in the following case, which arises in the analysis of ARMA\
    \ and ARIMA processes.\n\n**Corollary C.2** Let $\\epsilon_i, i=1, \\dots, n$\
