  md: '# 5.5.2 ARMA and ARIMA Processes


    Once a data set appears to be stationary, but not iid (as in panel (c) of Figure
    5.7), we can model it with an Auto-Regressive Moving Average (ARMA) process.


    > Definition 5.1

    0-mean ARMA($p, q$) process $X_t$ is a process that satisfies for $t = 1, 2, \dots$
    a difference equation such as:

    $$X_t + A_1X_{t-1} + \dots + A_pX_{t-p} = \epsilon_t + C_1\epsilon_{t-1} + \dots
    + C_qe_{t-q} \quad \epsilon_t \sim N_{0,\sigma^2}$$\ (5.21)


    Unless otherwise, we assume that $X_{-p+1} = \dots = X_0 = 0$.

    An ARMA($p, q$) process with mean $\mu$ is a process that $X_t$ is a 0-mean ARMA
    process and, unless otherwise specified, $X_{-p+1} = \dots = X_0 = \mu$.


    The parameters of the process are $A_1, \dots, A_p$ (auto-regressive coefficients,
    moving average coefficients) and $\sigma^2$ (white noise variance). The id sequence
    $\epsilon_t$ is called the noise sequence, and innovation.


    An ARMA($p,0$) process is also called an auto-regressive process, AR($p$); and
    an ARMA($0,q$) process is also referred to as a Moving Average process. MA($q$).


    Since a difference equation, the one in (5.21), defines a filter with rational
    transfer function (Section D), one can also define ARMA process by


    $\epsilon$ is an iid Gaussian sequence and


    ```

    $$F = \frac{1+C_1B + \dots + C_qB^q}{1+A_1B + \dots + A_pB^p}$$ $

    ```


    $B$ is the backshift operator, see Section D.

    In order for an ARMA process to be practically useful, we need the following:


    # HYPOTHESIS 5.1 The filter in (5.23) and its inverse are stable.


    In practice, this means that the zeroes of $1+A_1z^{-1} + \dots + A_pz^{-p}$ and
    of $1+C_1z^{-1} + \dots + C_qz^{-q}$ are within the unit disk.

    Equation (5.22) can be used to simulate ARMA processes, as in Figure 5.8.'
