  md: '# 1.5 Performance Patterns


    Performance evaluation is simpler if the evaluator is aware of performance patterns,
    i.e. traits that are common to numerous settings.


    # 1.5.1 Bottlenecks


    A prominent pattern is constituted by bottlenecks. In many systems, the overall
    performance is dictated by the behavior of the weakest components, called the
    bottlenecks.


    # Example 1.11 Bottlenecks


    You are asked to evaluate the performance of an information system. An application
    server can be compiled with two options, A and B. An experiment is done: ten users
    (remote or local) measure the time it takes to complete a complex transaction
    on four days. On day 1, option A is used; on day 2, option B is. The results are
    listed in the table below.


    | | remote | local | remote | local |

    |---|---|---|---|--|

    | A | 123 | 43 | 107 | 62 |

    | | 188 | 38 | 179 | 69 |

    | | 99 | 49 | 199 | 56 |

    | | 167 | 37 | 103 | 47 |

    | | 177 | 44 | 178 | 71 |


    The expert concludes that the performance for remote users is independent of the
    choice of the information system. We can criticize this finding and carry out
    a bottleneck analysis. For remote users, the bottleneck is the network access;
    the compiler option has little impact. When the bottleneck is removed, i.e. for
    local users, option A is slightly better.


    Bottlenecks are friends to the performance analyst, in the sense that they may
    considerably simplify the performance evaluation, as illustrated next.


    # Example 1.12 CPU model


    A detailed screening of a transaction system shows that the average cost of one
    transaction is 1,238, 400 CPU instructions; 102.3 disk accesses and 4 packets
    sent on the network. The processor can handle 10^9 instructions per second; the
    disk can support 10^4 packets per second; the network can support 10^4 packets
    per second the system can support. We would like to know how many transactions
    per second the system can support. The resource utilization per second is CPU:
    0.12% – disk: 1.02% – network: therefore, the disk is the bottleneck. The capacity
    of the system is determined by how many transactions'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Performance Patterns


    per second the disk can support and a gross estimate is 100≈99 transactions per
    second.


    If we would like a higher accuracy, we need to model queuing at the disk, thereby
    determining at which number of transactions per second delays start to become
    large. A global queuing model of CPU, disk access and network is probably unnecessary.


    In Section 8.2.4, we study bottleneck analysis for queuing systems in a systematic
    way.


    However, one should not be fooled by the apparent simplicity of the previous example,
    as bottlenecks are moving targets. They depend on all parameters of the system
    as well as the load: a component may be a bottleneck in certain conditions, but
    not others. In particular, removing one bottleneck may cause some other bottleneck
    to appear.


    # Example 1.13 High Performance Web Sites


    [99], the author discusses how to design high-performance web sites. He takes
    the user''s response time as the performance metric. He observes that modern web
    sites have highly optimized backends, for which reason their bottleneck is at
    the frontend. A common bottleneck is the DNS lookup. Entirely avoiding DNS lookups
    in web pages improves performances, but reveals another bottleneck, namely, script
    parsing. In turn, can be avoided by making scripts external to the web page but
    reveals yet another bottleneck, etc. The author describes 14 possible components,
    any of which, present, is a candidate for being the bottleneck, and suggests to
    remove them all. Subsequently, the system is left with the network access and
    the server CPU speed as bottlenecks, which is desirable.


    # 1.5.2 Congestion Collapse


    Congestion occurs when the intensity of the load exceeds the system capacity (as
    determined by the bottleneck). Any system, subject to a high enough load, will
    become congested. The only way to prevent this is to limit the load, which is
    often difficult or impossible. Therefore, it is no easy task to avoid congestion
    entirely.


    In contrast, it is possible and desirable. to avoid congestion collapse, which
    is defined as a reduction in system utility, or revenue when the load increases.


