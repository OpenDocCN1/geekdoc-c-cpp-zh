    # 6.1 What is a Simulation?


    A simulation is an experiment in a computer (biologists say “in silico”) where
    the real environment is replaced by the execution of a program.


    # Example 6.1 Mobile Sensors


    You want to build an algorithm $A$ for a system of $n$ wireless sensors, carried
    by mobile users, sending information to a central database. A simulation of the
    algorithm consists in implementing the essential features of the program in the
    computer, with one instance of $A$ per simulated sensor. The main difference between
    a simulation and a real implementation is that the real, physical world (here,
    the radio channel, with measurements performed by sensors) is replaced by events
    in the execution of a program.


    # 6.1.1 Simulated Time and Real Time


    In a simulation, the flow of time is controlled by the computer. A first task
    of a simulation program is to simulate parallelism: several parallel actions can
    take place in the real system, and in the program, they are serialized. Serializing
    is done by maintaining a *simulated time*, which is that at which an event in
    the real system is supposed to take. Every action is then decomposed into instantaneous
    events (e.g. the beginning of a transmission), and we assume that it is impossible
    for two instantaneous events to take place exactly at the same time.


    Assume for example that every sensor in Example 6.1 should send a message whenever
    there is a sudden change in its reading, and at most every 10 minutes. It may
    happen in a simulation program that two or more sensors decide to send a message
    simultaneously, say within a window of 10 $\mu s$. The program may take much more
    than 10 $\mu s$ of *real time* to execute these events. In contrast, if no event
    occurs in the system during 5 minutes, the simulation program may jump to the
    next event and take just of few ms to execute 5 mn of simulated time. The real
    time depends on the performance of the computer (processor speed, amount of memory)
    and of the simulation program.


    # 6.1.2 Simulation Types


    There are many different types of simulations, and the following classification
    can be used.'
