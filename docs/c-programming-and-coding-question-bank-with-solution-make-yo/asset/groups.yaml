    # # Using string.h


    A string in the C language is simply an array of characters. Strings must have
    a NULL or \0 character after the last character to show where the string ends.
    A string can be declared as a character array or with a string pointer.


    The C language provides no explicit support for strings in the language itself.
    The string-handling functions are implemented in libraries.


    String I/O operations are implemented in <stdio.h> (puts, gets, etc.). A set of
    simple string manipulation functions is implemented in <string.h>, or on some
    systems in <strings.h>.


    The string library (string.h or strings.h) has some useful functions for working
    with strings, such as strcpy, strcat, strcmp, strlen, and strncoll. We will take
    a look at some of these string operations.


    | String functions | Description |

    | --- | --- |

    | strcat ( ) | Concatenates str2 at the end of str1 |

    | strcat ( ) | Appends a portion of str1 to another |

    | strcpy ( ) | Copies str2 into str1 |

    | strncpy ( ) | Copies the given number of characters of one string to another
    |

    | strlen ( ) | Gives the length of str1 |

    | strcmp ( ) | Returns 0 if str1 is same as str2. Returns <0 if str2. Returns
    >0 if str1 > str2 |

    | strncmp ( ) | Same as strcmp() function. But, this function negotiates case.
    "A" and "a" are treated as same. |'
