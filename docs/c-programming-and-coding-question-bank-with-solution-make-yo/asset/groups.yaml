    \ loop\n    while(1){ if(condition)break;}}\n```\n\n# Jumping statements\n\nJumping\
    \ statements are used to exit loop / continue in loop / go to a particular position.\n\
    \nTypes of jump statements are:\n\n- Break\n- Continue\n- Goto\n- Return\n\n#\
    \ Break\n\nThe break statement is used inside a loop or a switch statement.\n\n\
    When a compiler finds the break statement inside a loop, it will abort the loop\
    \ and continue to execute statements followed by the loop.\n\nA break statement\
    \ is used to terminate the execution of the rest of the block where it is present\
    \ and takes the control out of the block to the next statement. The syntax of\
    \ the break statement is:\n\n```c\nfor(;;){ if (condition){break;}}\n```\n\n#\
    \ Continue\n\nContinue is another keyword that controls the flow of loops. If\
    \ you are executing a loop and hit a continue statement, the loop will stop its\
    \ current iteration, update itself (in the case of for loops), and begin to execute\
    \ again from the top.\n\nContinue is mostly used in loops. Rather than terminating\
    \ the loop, it stops the execution of the statements underneath and takes control\
    \ of the next iteration.\n\nThe continue statement passes the control to the next\
    \ iteration of the inner loop where it is present and not to any of the outer\
    \ loops.\n\nThe syntax of a continue statement is: for(;;){if(condition){continue;}}\n\
    \n# Goto\n\nThe goto jump statement is used to transfer the flow of control to\
