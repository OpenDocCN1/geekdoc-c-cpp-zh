    }\n```\n\n# 共用体 (Union)\n\nUnion 是 C语言中的一种特殊数据类型，允许在同一个内存位置存储不同的数据类型。我们可以定义一个包含许多成员的\
    \ union，但在任何给定时刻只有一个成员可以包含值。\n\n结构体（structure）与共用体（union）的区别\n\n| 结构体 (Structure)\
    \ | 共用体 (Union) |\n|---|---|\n| 内存分配 | 结构体的成员互不共享内存。因此，结构体为其所有成员需要独立的内存空间，即所有成员都有唯一的存储空间。\
    \ | 共用体在各个成员之间共享内存空间，因此不需要为所有成员分配内存。分配的是共享内存空间，即等于内存占用最大的成员的大小。 |\n| 成员访问 | 可以在任何时间单独访问结构体的任何成员。\
    \ | 一某一时间只能访问共用体的一个成员。 |\n| 关键字 | 定义结构体时使用*struct 关键字*。 | 定义共用体时使用*union 关键字*。\
    \ |\n| 初始化 | 结构体的所有成员都可以初始化。 | *只有共用体的第一个成员可以被初始化。* |\n| 大小 | 结构体的大小大于每个成员大小之和。\
    \ | 共用体的大小等于具有*最大*尺寸成员的大小。 |\n| 语法 | `struct struct_name { struct ele 1; struct\
    \ ele 2; ______ ele n; } struct_variable_name;` | `union union_name { union ele\
    \ 1; union ele 2; ______ ele n; } union_variable_name;` |\n| 值的变化 | 结构体中一个成员的值的变化不会影响结构中的其他成员。\
