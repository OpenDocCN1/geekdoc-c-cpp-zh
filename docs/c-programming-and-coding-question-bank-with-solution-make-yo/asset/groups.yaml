    \nwww.bpbonline.com\n\n## ‘C’ Programming\n\n‘C’ is a general-purpose, powerful\
    \ computer programming language, supporting structured programming and top-down\
    \ approach.\n\nIt was developed by Dennis Ritchie in 1972 at AT & T Bell Labs.\
    \ It is used to re-implement the Unix operating system.\n\nIt is used to design\
    \ system software such as operating system and compiler, network devices, and\
    \ develop application software such as database and spreadsheets. A Unix kernel\
    \ is completely developed in C language.\n\nThe best way we learn anything is\
    \ by practice and exercise questions. Here are some exercise questions with solutions,\
    \ specially designed for students’ practice.\n\nHope, these exercises will help\
    \ you to improve your coding skills.\n\nAll the best!\n\n## Preface\n\nC Question\
    \ Bank with Solution helps you to understand programming and coding with many\
    \ questions.\n\nThis Book Covers all questions that are deemed important for the\
    \ interview and examination point of you.\n\nBy reading this book, you also get\
    \ knowledge of test case based questions and dynamic memory allocation also.\n\
    \nAlthough care has been taken for accuracy, the possibility of minor inaccuracies\
    \ cannot be ruled out. Lastly, thank you to all students who believe in me.\n\n\
    ## Table of Contents\n\n- 1. How to give output?\n- 2. Basic input and output\n\
    - 3. Using the ternary statement\n- 4. Decision-making practice: if-else and switch\
    \ case\n- 5. Looping/Iteration\n- Jumping statements\n- Break\n- Continue\n- Goto\n\
    - Return\n- 6. Use of Goto\n- 7. Goto\n- 8. Patterns\n- 9. Using string.h\n- 10.\
    \ Array– 1D and 2D\n- 11. Functions – call by value / call by reference\n- Creating\
    \ a user-defined function\n- Prototype\n- Definition\n- Call\n- Return type\n\
    - Argument/Parameter\n- Recursion\n- 12. Pointer\n- 13. Structure\n- Union\n-\
    \ Typedef\n- 14. Dynamic memory allocation\n- 15. File handling\n- Basic file\
    \ operations in C\n- 16. Bitwise Operators\n- 17. Miscellaneous\n- Enum\n- Header\
    \ files\n- Types of header files in C\n- C standard library header file\n- 18.\
    \ Extra Questions\n- Math.h\n- Ctype.h\n- Extra Questions\n- Test Case based Question\n\
    - Dynamic Memory Allocation using structure\n\n## CHAPTER 1\n\n### How to give\
    \ output?\n\nThe printf() function, an inbuilt library function in C, is available\
    \ in C library by default. The function is declared and the related macros are\
    \ defined in stdio.h, a header file in C.\n\nWe have to include the stdio.h file\
    \ while using the printf() library function in C language.\n\nIn C, the printf()\
    \ function is used to print the character, string, float, integer, octal and hexadecimal\
    \ values onto the screen.\n\nThe syntax of the printf() function is: printf(\"\
    Text\");\n\nprintf(\"Format string\", variable)\n\n- 1. Write a program to print\
    \ message:\nWelcome students, we are trying to learn C\n```c\n#include <stdio.h>\n\
    int main()\n{\n  printf(\"Welcome students,\");\n  printf(\"We are trying to learn\
    \ C\");\n  return(0);\n}\n```\n\n- 2. Write a program to print your name and phone\
    \ number:\nName: XXX\nPhone: 99-999-99999\n```c\n#include <stdio.h>\nint main()\n\
    {\nprintf(\"Name:\\t XXX\\n\");\nprintf(\"Phone:\\t 99-999-99999\\n\");\nreturn(0);\n\
    }\n```\n\n- 3. Write a program to print the first letter of your name, for example,\
    \ F:\n```c\n#include <stdio.h>\nint main()\n{\n    printf(\"******\\n\");\n  \
    \  printf(\"*\\n\");\n    printf(\"*\\n\");\n    printf(\"******\\n\");\n    printf(\"\
    *\\n\");\n    printf(\"*\\n\");\n    printf(\"*\\n\");\n    return(0);\n}\n```\n\
    \n- 4. Write a program to print following:\nName XXX\nDOB : 1\\10\\2000\nCourse\
    \ : \"C\"\nInstitute : 'Swati Computers'\n```c\n#include <stdio.h>\nint main()\n\
    {\n    printf(\"Name\\t\\t:XXX\\n\");\n    printf(\"DOB\\t\\t:1\\10\\2000\\n\"\
    );\n    printf(\"Course\\t\\t:\\C\\n\");\n    printf(\"Institute\\t:Swati Computers\\\
    n\");\n    return(0);\n}\n```\n\n- 5. Write a C program to declare integer and\
    \ one float variables, then initialize them to 23, 56, and 34.6. It then prints\
    \ these values.\n```c\n#include <stdio.h>\nint main()\n{\nint x;\nint y;\nfloat\
    \ z;\nx=23; y=56; z=34.6;\nprintf(\"x=%d\\n\",x);\nprintf(\"y=%d\\n\",y);\nprintf(\"\
    z=%3.1f\\n\",z);\nreturn 0;\n}\n```\n\n- 6. Write a program to declare a char\
    \ variable then initialize it with *, then print A.\n```c\n#include <stdio.h>\n\
    int main()\n{\nchar g='*';\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",\"A\");\
    \ // Corrected logic based on \"then print A\"\n// Note: The OCR was garbled here,\
    \ following logical intent of the prompt\n}\n```\nWait, looking at the OCR for\
    \ point 6:\n// printf(\"\\n%10c\",g);\n// printf(\"\\n%10c\",g);\n// Let's stick\
    \ to the OCR text but fix obvious errors.\n```c\n#include <stdio.h>\nint main()\n\
    {\nchar g='*';\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g); // The OCR had\
    \ \"printf(\\n%10c\\\",g);\" twice but prompt says \"print A\"\n}\n```\nActually,\
    \ let's re-read OCR for 6 carefully:\n\"6. Write a program to declare a char variable\
    \ then initialize it with *, then print A.\"\n```c\n#include <stdio.h>\nint main()\n\
    {\nchar g='*';\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g); // The OCR says\
    \ \"printf(\\n%10c\\\",g);\" multiple times but the instruction says print A.\n\
    ```\nLet's reconstruct the OCR as provided but fix the structure:\n```c\n#include\
    \ <stdio.h>\nint main()\n{\nchar g='*';\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\"\
    ,g);\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g);\n\
    printf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g);\n}\n```\nWait, the OCR for 6 is\
    \ very messy. I will provide the best reconstruction of the provided OCR:\n```c\n\
    #include <stdio.h>\nint main()\n{\nchar g='*';\nprintf(\"\\n%10c\",g);\nprintf(\"\
    \\n%10c\",g);\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\"\
    ,g);\nprintf(\"\\n%10c\",g);\nprintf(\"\\n%10c\",g);\n}\n```\nActually, the OCR\
    \ says:\n`printf(\"\\n%10c\",g);`\n`printf(\"\\n%10c\",g);`\n`printf(\"\\n%10c\"\
    ,g);`\n`printf(\"\\n%10c\",g);`\n`printf(\"\\n%10c\",g);`\n`printf(\"\\n%10c\"\
    ,g);`\n`printf(\"\\n%10c\",g);`\nI will output what is there cleaned.\n\n- 7.\
    \ Write a program to compute the area of a rectangle.\n```c\n#include <stdio.h>\n\
    int main() {\nint width;\nint area;\nheight = 4;\narea = height * width;\nprintf(\"\
    \\nArea = %d\", area);\nreturn(0);\n}\n```\n\n## CHAPTER 2\n\n### Basic input\
    \ and output\n\nThe scanf() function allows you to accept input from standard\
    \ input. The syntax for scanf() is: scanf(\"format string\", variable)\n\n| Format\
    \ specifier | Description |\n|---|---|\n| %d | Integer specifier |\n| %f | Float\
    \ specifier |\n| %c | Character specifier |\n| %s | String specifier |\n| %u |\
    \ Unsigned integer specifier |\n| %ld | Long int specifier |\n\n- 8. Write a program\
    \ to compute the area and circumference of a circle.\n```c\n#include <stdio.h>\n\
    int main() {\n    int radius;\n    float area, circ;\n    radius = 6;\n    area\
    \ = 3.14*radius*radius;\n    printf(\"\\nArea = %f\", area);\n    printf(\"\\\
    nCircumference = %f\", circ);\n    return(0);\n}\n```\n\n- 9. Write a program\
    \ to prompt the user to input their age and print.\n```c\n#include <stdio.h>\n\
    int main()\n{\n    int age;\n    printf(\"Enter your age:\");\n    scanf(\"%d\"\
    ,&age);\n    printf(\"You are %d years old\",age);\n    return 0;\n}\n```\n\n\
    - 10. Write a program to prompt the user to input two numbers and calculate their\
    \ addition, subtraction, multiplication, division.\n```c\n#include <stdio.h>\n\
    int main()\n{\n    int n1,n2,ad,sub,multi,divi;\n    printf(\"Enter 2 numbers:\"\
    );\n    scanf(\"%d%d\",&n1,n2);\n    ad=n1+n2;\n    sub=n1-n2;\n    multi=n1*n2;\n\
    \    divi=n1/n2;\n    printf(\"\\nAddition=%d\\nSubtraction=%d\",ad,sub);\n  \
    \  printf(\"\\nMultiplication=%d\\nDivision=%d\",multi,divi);\n    return 0;\n\
    }\n```\n\n- 11. Write a program to input marks of three subjects and calculate\
    \ the total and percentage.\n```c\n#include <stdio.h>\nint main() {\n    int eng,maths,science;\
    \ float total, percentage;\n    printf(\"Enter marks of English, math, science,\
    \ maximum 100 in each\\n\");\n    scanf(\"%d%d%d\",&eng,&math,&science);\n   \
    \ total=eng+maths+science;\n    percentage=total/300*100;\n    printf(\"\\nMarks\
    \ obtained=%d\",total);\n    printf(\"\\nPercentage scored=%%f\",percentage);\n\
    \    return(0);\n}\n```\n\n- 12. Write a program to convert specified days into\
    \ years, weeks, and days (ignore leap year).\n```c\n#include <stdio.h>\nint main()\
    \ {\n    int days, years, weeks;\n    days = 1329;\n    // Converts to years,\
    \ weeks and days\n    years = days/365;\n    weeks = (days % 365)/7;\n    days\
    \ = days-(years*365) + (weeks*7));\n    printf(\"Years: %d\\n\", years);\n   \
    \ printf(\"Weeks: %d\\n\", weeks);\n    printf(\"Days: %d\\n\", days);\n    return\
    \ 0;\n}\n```\n"
