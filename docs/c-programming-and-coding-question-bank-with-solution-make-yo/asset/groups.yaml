    # Union


    A union is a special datatype available in C,which allows to store different datatypes
    in the same memory location. We can define a union with many members, but only
    one member can contain a value at any given time.


    Difference between a structure and union


    | Structure | Union |

    |---|---|

    | Memory allocation | Members of structure do not share memory. So, a structure
    needs separate memory space for all its members, that is, all the members have
    unique storage. | A union shares the memory space among its members, so there
    is no need to allocate memory to all the members. Shared memory space is allocated,
    that is, equivalent to the size of member having largest memory. |'
