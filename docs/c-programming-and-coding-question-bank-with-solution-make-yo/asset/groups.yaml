    ```\n\n# CHAPTER 11\n\n# Functions – call by value / call by reference\n\nA function\
    \ is a block of code that performs a specific task. Every program has at least\
    \ one function, which is main().\n\nDepending on whether a function is defined\
    \ by the user or already included in C compilers, there are two types of functions\
    \ in C programming:\n\n- Standard library functions\n- User-defined functions\n\
    \nThe standard library functions are built-in functions in C programming to handle\
    \ tasks such as mathematical computations, I/O processing, and string handling.\n\
    \nThese functions are defined in the header file. When you include the header\
    \ file, these functions are available for use.\n\nC allows programmers to define\
    \ functions. Such functions created by the user are called user-defined functions.\n\
    \nDepending on the complexity and requirement of the program, one can create as\
    \ many user-defined functions as one wants.\n\nAdvantages of user-defined functions:\n\
    \n- The program is easier to understand, maintain, and debug.\n- Reusable codec\
    \ can be used in other programs.\n- A large program can be divided into smaller\
    \ modules. Hence, a large project can be divided among many programmers.\n\n#\
    \ Creating a user-defined function\n\nThe four factors must be considered when\
    \ creating a user-defined function:\n\n- Prototype/declaration\n- Definition/body\n\
    - Call\n- Return type\n\n# Prototype\n\nA prototype can occur at the top of a\
    \ C source code file to describe what the function returns and what it takes (return\
    \ type and parameter list).\n\nWhen this is the case (occurring at the top of\
    \ the file), the function prototype should be followed by a semicolon.\n\n```\n\
    Return_type function_name(Argument list...);\n```\n\n# Definition\n\nEvery function\
    \ should have a task to perform. Definition should match with prototype.\n\n```\n\
    Return_type function_name(argument list..){}\n```\n\n# Call\n\nWhen one piece\
    \ of code invokes or calls a function, the number of args “passed” into a function\
    \ must exactly match the number of parameters required for the function.\n\nThe\
    \ type of each argument must exactly match the type of each parameter. The return\
    \ variable type must exactly match the return type of the function.\n\n```\nVariable=function_name(argument.).\n\
    ```\n\n# Return type\n\nWhen a line of code in a function that says: “return X;”\
    \ is executed, the function “ends” and no more code in the function is executed.\n\
    \nThe value of X (or the value in the variable represented by X) becomes the result\
    \ of the function.\n\n# Argument/Parameter\n\nA parameter is the symbolic name\
    \ for “data” that goes into a function. There are two ways to pass parameters\
    \ in C: pass by value and pass by reference.\n\n- Pass by value: Pass by value\
    \ means a copy of the data is made and stored by name of the parameter. Any changes\
    \ to the parameter have no effect on the variable.\n- Pass by reference: reference\
    \ parameter “refers” to the original data in the calling function. Thus, any changes\
    \ made to the parameter cause a change to the original variable.\n\nVoid functions:\
    \ If a function does not return a value, a special “TYPE” is used to inform the\
