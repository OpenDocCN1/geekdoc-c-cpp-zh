    \ printf(\"Invalid\");\n    }\n}\n\n# Union\n\nA union is a special datatype available\
    \ in C, which allows to store different datatypes in the same memory location.\
    \ We can define a union with many members, but only one member can contain a value\
    \ at any given time.\n\nDifference between a structure and union\n\n| Structure\
    \ | Union |\n|---|---|---|\n| Memory allocation | Members of structure do not\
    \ share memory. So, a structure needs separate memory space for all its members,\
    \ that is, all the members have unique storage. | A union shares the memory space\
    \ among its members, so there is no need to allocate memory to all the members.\
    \ Shared memory space is allocated, that is, equivalent to the size of member\
    \ having largest memory. |\n| Member access | Members of a structure can be accessed\
    \ individually at any time. | At a time, only one member of union can be accessed.\
    \ |\n| Keyword | To define a structure, the *struct keyword* is used. | To define\
    \ a union, the *union keyword* is used. |\n| Initialization | All members of a\
    \ structure can be initialized. | *Only the first member of the union can be initialized.*\
    \ |\n| Size | Size of the structure is > to the sum of each member’s size. | Size\
    \ of union is equivalent to the size of the member having the *largest* size.\
    \ |\n| Syntax | `struct struct_name { struct ele 1; struct ele 2; ______ ele n;\
    \ } struct_variable_name;` | `union union_name { union ele 1; union ele 2; ______\
    \ ele n; } union_variable_name;` |\n| Change in value | Change in the value of\
    \ one member cannot affect other in the structure. | Change in the value of one\
    \ member can affect the value of other member. |\n\n150. Write a program to display\
