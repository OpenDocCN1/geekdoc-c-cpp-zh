    # CHAPTER 11


    # Functions – call by value / call by reference


    A function is a block of code that performs a specific task. Every program has
    at least one function, which is main().


    Depending on whether a function is defined by the user or already included in
    C compilers, there are two types of functions in C programming:


    +   * Standard library functions

    * User-defined functions


    The standard library functions are built-in functions in C programming to handle
    tasks such as mathematical computations, I/O processing, and string handling.


    These functions are defined in the header file. When you include the header file,
    these functions are available for use.


    C allows programmers to define functions. Such functions created by the user are
    called user-defined functions.


    Depending on the complexity and requirement of the program, one can create as
    many user-defined functions as one wants.


    Advantages of user-defined functions:


    +   * The program is easier to understand, maintain, and debug.

    * Reusable codec can be used in other programs.

    * A large program can be divided into smaller modules. Hence, a large project
    can be divided among many programmers.


    # Creatinga user-defined function'
  - '[PAGE 142]


    The four factors must be considered when creating a user-defined function:


    +   - Prototype/declaration

    - Definition/body

    - Call

    - Return type


    # Prototype


    A prototype can occur at the top of a C source code file to describe what the
    function returns and what it takes (return type and parameter list).


    When this is the case (occurring at the top of the file), the function prototype
    should be followed by a semicolon.


    ```

    Return_type function_name(Argument list...);

    ```


    # Definition


    Every function should have a task to perform. Definition should match with prototype.


    ```

    Return_type function_name(argument list..){}

    ```


    # Call


    When one piece of code invokes or calls a function, the number of args “passed”
    into a function must exactly match the number of parameters required for the function.


    The type of each argument must exactly match the type of each parameter. The return
    variable type must exactly match the return type of the function.


    ```

    Variable=function_name(argument.).

    ```


    # Return type


    When a line of code in a function that says: “return X;” is executed, the function
    “ends” and no more code in the function is executed.'
