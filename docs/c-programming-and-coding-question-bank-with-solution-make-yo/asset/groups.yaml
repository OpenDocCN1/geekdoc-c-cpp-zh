    \nwww.bpbonline.com\n\n## ‘C’语言\n\n‘C’是一种通用的、强大的计算机编程语言，支持结构化编程和自顶向下设计方法。\n\n\
    它由 Dennis Ritchie 于1972年在 AT & T 贝尔实验室开发。它用于重新实现 Unix 操作系统。\n\n它用于设计系统软件（如操作系统和编译器）、网络设备，以及开发应用软件（如数据库和电子表格）。Unix\
    \ 内核完全是用 C 语言开发的。\n\n学习任何知识的最佳方法是通过实践和练习题。这里是一些带有解析的练习题，专为学生的练习设计。\n\n希望这些练习能帮助你提高编码技能。\n\
    \n顺利！\n\n## 前言\n\n《C语言题库》通过许多问题帮助你理解编程和编码。\n\n本书涵盖了从面试和考试角度认为重要的所有问题。\n\n通过阅读这本书，你还将学到基于测试用例的问题以及动态内存分配的知识。\n\
    \n尽管已经注意了准确性，但不能排除细微不准确的可能。最后，感谢所有信任我的学生。\n\n## 目录\n\n- 1. 如何输出？\n- 2. 基本输入与输出\n\
    - 3. 使用三元运算符\n- 4. 决策练习：if-else 和 switch case\n- 5. 循环/迭代\n- 跳转语句\n- Break\n-\
    \ Continue\n- Goto\n- Return\n- 6. Goto 的使用\n- 7. Goto\n- 8. 模式\n- 9. 使用 string.h\n\
    - 10. 数组 – 一维和二维\n- 11. 函数 – 值传递 / 引用传递\n- 创建用户自定义函数\n- 原型\n- 定义\n- 调用\n- 返回类型\n\
    - 参数/形参\n- 递归\n- 12. 指针\n- 13. 结构\n- 联合\n- Typedef\n- 14. 动态内存分配\n- 15. 文件处理\n\
    - C语言中的基本文件操作\n- 16. 位运算符\n- 17. 杂项\n- Enum\n- 头文件\n- C语言中头文件的类型\n- C 标准库头文件\n\
    - 18. 额外问题\n- Math.h\n- Ctype.h\n- 额外问题\n- 基于测试用例的问题\n- 使用结构进行动态内存分配\n\n## 第一章\n\
    \n### 如何输出？\n\n`printf()` 函数是C语言中的内置库函数，默认在C库中可用。该函数的声明和相关的宏定义在 `stdio.h` 中，这是C语言中的一个头文件。\n\
    \n在C语言中使用 `printf()` 库函数时，必须包含 `stdio.h` 文件。\n\n在 C语言中，`printf()` 函数用于在屏幕上打印字符、字符串、浮点数、整数、八进制和十六进制值。\n\
    \n`printf()` 函数的语法为：`printf(\"Text\");`\n\n`printf(\"Format string\", variable)`\n\
    \n- 1. 编写一个程序打印消息：\n欢迎学生，我们正在尝试学习C\n```c\n#include <stdio.h>\nint main()\n{\n\
    \  printf(\"Welcome students,\");\n  printf(\"We are trying to learn C\");\n \
    \ return(0);\n}\n```\n\n- 2. 编写一个程序打印你的名字和电话：\n姓名：XXX\n电话：99-999-99999\n```c\n\
    #include <stdio.h>\nint main()\n{\nprintf(\"Name:\\t XXX\\n\");\nprintf(\"Phone:\\\
    t 99-999-99999\\n\");\nreturn(0);\n}\n```\n\n- 3. 编写一个程序打印你名字的首字母，例如 F：\n```c\n\
    #include <stdio.h>\nint main()\n{\n    printf(\"******\\n\");\n    printf(\"*\\\
    n\");\n    printf(\"*\\n\");\n    printf(\"******\\n\");\n    printf(\"*\\n\"\
    );\n    printf(\"*\\n\");\n    return(0);\n}\n```\n\n- 4. 编写一个程序打印：\n姓名 XXX\n\
    出生日期：10/200\n课程：C\n学校：Swati Computers\n```c\n#include <stdio.h>\nint main()\n\
    {\n    printf(\"Name\\t:XXX\\n\");\n    printf(\"DOB\\t:10/200\\n\");\n    printf(\"\
    Course\\t:C\\n\");\n    printf(\"Institute\\t:Swati Computers\\n\");\n    return(0);\n\
    }\n```\n\n- 5. 编写一个C程序声明整数和浮点变量，并将它们初始化为 23、56 和 34.6。打印这些值。\n```c\n#include <stdio.h>\n\
    int main()\n{\nint x;\nint y;\nfloat z;\nx=23; y=56; z=34.6;\nprintf(\"x=%d\\\
    n\",x);\nprintf(\"y=%d\\n\",y);\nprintf(\"z=%f\\n\",z);\nreturn 0;\n}\n```\n\n\
    - 6. 编写一个程序声明char变量，将其初始化为 A，然后打印它。\n（注：此处OCR内容混乱，根据提示意图修复）\n```c\n#include <stdio.h>\n\
    int main()\n{\nchar g;\ng='A';\nprintf(\"%c\\n\",g);\nreturn 0;\n}\n```\n\n- 7.\
    \ 编写一个程序计算矩形的面积。\n```c\n#include <stdio.h>\nint main() {\nint width;\nint area;\n\
    int height = 4;\narea = height * width;\nprintf(\"\\nArea = %d\", area);\nreturn(0);\n\
    }\n```\n\n## 第二章\n\n### 基本输入与输出\n\n`scanf()` 函数允许你从标准输入接受输入。`scanf()` 的语法为：`scanf(\"\
    format string\", variable)`\n\n| 格式说明符 | 描述 |\n|---|---|\n| %d | 整数说明符 |\n| %f\
    \ | 浮点数说明符 |\n| %c | 字符说明符 |\n| %s | 字符串说明符 |\n| %u | 无符号整数说明符 |\n| %ld | 长整数说明符\
    \ |\n\n- 8. 编写一个程序计算圆的面积和周长。\n```c\n#include <stdio.h>\nint main() {\n    int\
    \ radius;\n    float area, circ;\n    radius = 6;\n    area = 3.14*radius*radius;\n\
    \    circ = 2*3.14*radius;\n    printf(\"\\nArea = %f\", area);\n    printf(\"\
    \\nCircumference = %f\", circ);\n    return(0);\n}\n```\n\n- 9. 编写一个程序，提示用户输入年龄并打印。\n\
    ```c\n#include <stdio.h>\nint main()\n{\n    int age;\n    printf(\"Enter your\
    \ age:\");\n    scanf(\"%d\",&age);\n    printf(\"You are %d years old\",age);\n\
    \    return 0;\n}\n```\n\n- 10. 编写一个程序，提示用户输入两个数字并计算它们的加法、减法、乘法除法。\n```c\n#include\
    \ <stdio.h>\nint main()\n{\n    int n1,n2,ad,sub,multi,divi;\n    printf(\"Enter\
    \ 2 numbers:\");\n    scanf(\"%d%d\",&n1,&n2);\n    ad=n1+n2;\n    sub=n1-n2;\n\
    \    multi=n1*n2;\n    divi=n1/n2;\n    printf(\"\\nAddition=%d\\nSubtraction=%d\"\
    ,ad,sub);\n    printf(\"\\nMultiplication=%d\\nDivision=%d\",multi,divi);\n  \
    \  return 0;\n}\n```\n\n- 11. 编写一个程序输入三个科目的分数并计算总分和百分比。\n```c\n#include <stdio.h>\n\
    int main() {\n    int eng,maths,science; float total, percentage;\n    printf(\"\
    Enter marks of English, math, science, maximum 100 in each\\n\");\n    scanf(\"\
    %d%d%d\",&eng,&maths,&science);\n    total=eng+maths+science;\n    percentage=total/300*100;\n\
    \    printf(\"\\nMarks obtained=%d\",total);\n    printf(\"\\nPercentage scored=%%f\"\
    ,percentage);\n    return(0);\n}\n```\n\n- 12. 编写一个程序将指定的天数转换为年、周和天（忽略闰年）。\n```c\n\
    #include <stdio.h>\nint main() {\n    int days, years, weeks;\n    days = 1329;\n\
    \    // 转换为年、周和天\n    years = days/365;\n    weeks = (days % 365)/7;\n    days\
    \ = days-(years*365) + (weeks*7);\n    printf(\"Years: %d\\n\", years);\n    printf(\"\
    Weeks: %d\\n\", weeks);\n    printf(\"Days: %d\\n\", days);\n    return 0;\n}\n\
    ```\n\n"
