  md: '# # CHAPTER 15

    File handling


    File is a collection of bytes that are stored in secondary storage devices as
    a disc. There are two types of files in a system. They are:


    +   - Text files

    - Binary files


    Text files contain ASCII codes of digits, alphabets, and symbols.

    Binary files contain collection of bytes (0s and 1s). Binary files are a compiled
    version of text files.


    # # Basic file operations in C


    The basic file operations in C are as follows:


    +   1. Creating a new file (fopen with attributes as “a","a+",“w", or “w++”).

    2. Opening an existing file (fopen).

    3. Reading from the file (fscanf and fgetc).

    4. Writing to a file (fprintf and fputs).

    5. Moving to a specific location in a file (fseek, rewind).

    6. Closing a file (fclose).


    The syntax for the baic file operations is:

    ```c

    FILE *fp;

    fp=fopen(“Name of file","mode”);

    ```


    Modes of operation in file are as follows:


    +   - Opens a file in read mode and sets the pointer to the first character in
    the file. It returns null if the file does not exist.'
