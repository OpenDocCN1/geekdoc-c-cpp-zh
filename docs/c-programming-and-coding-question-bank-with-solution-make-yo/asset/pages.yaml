  md: '# CHAPTER 4


    # Decision-making.practice: if-else and switch case


    Decision-making is used to specify the order of execution of the statements.


    An if statement can be followed by an optional else statement, which executes
    when the Boolean expression is false.


    The C programming language assumes any non-zero and non-null values as true, and
    if it is either zero or null, then it is assumed as a false value.


    The syntax of an if-else statement is:


    ```

    if(Condition)

    {

    Statements, if condition is true

    }

    Else

    {

    Statements, if condition is false

    }

    ```


    An if statement can be followed by an optional if...else statement, which is very
    useful to test various conditions using a single if...else statement.


    As switch statement allows a variable to be tested for equality against a list
    of values.


    A switch statement can be replaced by an if-else statement.


    Its syntax is:


    ```

    switch(expression) {

    ```'
