    +   - a+: Opens a file in read and write mode and sets the pointer to the first
    character in the file. But, it cannot modify the existing contents.


    | File handling functions | Description |

    | fopen () | The fopen () function creates a new file or opens an existing file.
    |

    | fclose () | The fclose () function closes an opened file. |

    | getw () | The getw () function reads an integer from a file. |

    | putw () | The putw () function writes an integer to a file. |

    | fgetc () | The fgetc () function reads a character from a file. |

    | fputc () | The fputc () function writes a character to a file. |

