    # Jumping statements


    Jumping statements are used to exit loop / continue in loop / go to a particular
    position.


    Types of jump statements are:


    +   * Break

    * Continue

    * Goto

    * Return


    # Break


    The break statement is used inside a loop or a switch statement.


    When a compiler finds the break statement inside a loop, it will abort the loop
    and continue to execute statements followed by the loop.


    A break statement is used to terminate the execution of the rest of the block
    where it is present and takes the control out of the block to the next statement.
    The syntax of the break statement is:


    ```

    for(;;){ if (condition){break;}}

    ```


    # Continue


    Continue is another keyword that controls the flow of loops. If you are executing
    a loop and hit a continue statement, the loop will stop its current iteration,
    update itself (in the case of for loops), and begin to execute again from the
    top.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Continue is mostly used in loops. Rather than terminating the loop, it stops
    the execution of the statements underneath and takes control of the next iteration.


    The continue statement passes the control to the next iteration of the inner loop
    where it is present and not to any of the outer loops.


    The syntax of a continue statement is: for(;;){if(condition){continue;}}


    # Goto


    The goto jump statement is used to transfer the flow of control to any desired
    part of the program.


    It jumps from one point to another point within a function.


    The syntax of a goto statement is: goto label;


    > Note: Use of a goto statement is highly discouraged in any programming language
    because it makes it difficult to trace the control flow of a program, making the
    program difficult to understand and modify.


    Any program that uses a goto statement can be rewritten to avoid it.


    # Return


    The return statement is used to terminate the execution of a function and transfer
    the program control back to the calling function.


    The return statement ends the current function and returns control to the point
    of invocation. It can also return a value in that point.


    A function may or not return a value.


    A return statement returns a value to the calling function and assigns to the
    variable on the left side of the calling function.


    If a function does not return a value, the return type in the function definition
    and declaration is specified as void.


    The syntax of a return statement is:


    ```

    return expr;

    ```'
