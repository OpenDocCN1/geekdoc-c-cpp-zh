  md: 'When we use the include directive, the contents of included header file (after
    preprocessing) are copied to the current file.


    Angular brackets < and > instruct the preprocessor to look in the standard folder
    where all header files are held.


    +   2. Double quotes "and" instruct the preprocessor to look into the current
    folder, and if the file is not present in the current folder, then it looks in
    the standard folder of all header files.


    When we use define for a constant, the preprocessor generates a C program where
    the defined constant is searched, and matching tokens are replaced with the given
    expression.


    In the C programming language, the #define directive allows the definition of
    macros within the source code.


    These macro definitions allow constant values to be declared for use throughout
    the code.


    Macro definitions are not variables and cannot be changed by our program code,
    like variables.


    We generally use this syntax when creating constants that represent numbers, strings,
    or expressions.


    The syntax for #define is:


    ```

    #define Constant_name value #define Constant_name (Expression)

    ```


    Some are #if, #elif, #else, and #endif directives.


    The #if directive, with the #elif, #else, and #endifdirectives, controls compilation
    of portions of a source file.


    If the expression we write (after the #if) has a non-zero value, the value group
    immediately following the #if directive is retained in the translation unit.'
