  md: 'Therefore, C Dynamic Memory Allocation can be defined as a procedure in which
    the size of a data structure (like Array) is changed during the runtime.


    C provides some functions to achieve these tasks. There are four library functions
    provided by C defined under <stdlib.h> header file to facilitate dynamic memory
    allocation in C programming. They are:


    malloc()


    calloc()


    free()


    realloc()


    | Function | Syntax | Description |

    | --- | --- | --- |

    | malloc() | ptr = (cast-type*) malloc(byte-size) | method in C is used to dynamically
    allocate a single large block of memory with the specified size. It returns a
    pointer of void which can be cast into a pointer of any form. |

    | calloc() | ptr = (cast-type*)calloc(n, element-size); | method in C is used
    to dynamically allocate the specified number of blocks of memory of the specified
    type. it is much similar to calloc() |

    | free() | free(ptr); | method in C is used to dynamically de-allocate the memory.
    The memory allocated using functions malloc() and calloc() is not de-allocated
    on their own. |

    | realloc() | ptr = realloc(ptr, newSize); | method in C is used to dynamically
    change the memory allocation of a |'
