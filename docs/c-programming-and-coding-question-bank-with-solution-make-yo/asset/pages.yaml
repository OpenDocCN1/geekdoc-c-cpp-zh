  md: '# ‘C’ Programming


    ‘C’ is a general-purpose, powerful computer programming language, supporting structured
    programming and top-down approach.


    It was developed by Dennis Ritchie in 1972 at AT & T Bell Labs. It is used to
    re-implement the Unix operating system.


    It is used to design system software such as operating system and compiler, network
    devices, and develop application software such as database and spreadsheets. A
    Unix kernel is completely developed in C language.


    The best way we learn anything is by practice and exercise questions. Here are
    some exercise questions with solutions, specially designed for students’ practice.


    Hope, these exercises will help you to improve your coding skills.


    All the best!'
