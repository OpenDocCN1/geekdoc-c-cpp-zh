    Dynamic memory allocation


    The process of allocating memory during program execution is called dynamic memory
    allocation.


    Dynamic memory management refers to manual memory management. This allows us to
    obtain more memory when required and release it when not necessary.


    Dynamic memory allocation functions in C are summarized in the following table:


    | Function | Syntax |

    |---|---||

    | malloc () | malloc (number *sizeof(int)); |

    | calloc () | calloc (number, sizeof(int)); |

    | realloc () | realloc (pointer_name, number * sizeof(int)); |

    | free () | free (pointer_name); |

    | Function | Use of the function Allocates the requested size of bytes and returns
    a first byte of the allocated space |

    | calloc() | Allocates space for an array''s elements, initializes to zero, and
    then returns a pointer to memory |

    | free() | De-allocates the previously allocated space |

    | realloc() | Changes the size of previously allocated space |


