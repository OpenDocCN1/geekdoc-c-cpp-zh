- pgno: 211
  md: 'Region III is the high rainfall region in the northern part of the country
    and has a rain-fed crop growing season of 140-200 days. Soils are highly weathered
    and highly leached, acidic, depleted of nutrients and of low productivity compared
    with the soils of Regions I and II.


    # 16.3 Current soil fertility management


    Farmers have traditional practices for soil and water management. Conservation
    basins are used to harvest water in Regions I and IIa. Shifting of livestock pens
    is an indigenous practice of confining a herd of cattle on a small piece of land
    at night for three to four days and then moving to enrich the soil with excreted
    urine and faeces. Farmers address acid soils in Region III with the slash and
    burn practice known locally as chitemene. These practices are insufficient to
    maintain productivity under intensive cropping and need to be integrated with
    other practices (Bekunda et al., 2010). Such practices may include conservation
    tillage, crop rotation with legumes, improved soil cover with mulch, cover crops
    and crop residues, application of manure and other organic material, and fertilizer
    use.


    Two limitations of using organic materials as nutrient sources are that nutrient
    release is often out of synchrony with crop demand and nutrient contents are commonly
    very low. Agro-forestry such as tree fallows may be an acceptable practice for
    breaking hard pans, fixing nitrogen and capturing and recycling leached nutrients.
    Integrating organic resources with fertilizer use is often the best option for
    enhancing soil nutrient availability. Use of biochar is of interest to some on
    acid soils with low cation exchange capacity (CEC) as it is a carbon form that
    persists in the soil and adds to CEC and water-holding capacity. Use of lime is
    important to productivity of acid soils in Region III. Use of wood ash to amend
    acid soils is a common traditional farming practice but the available quantity
    is small outside of areas of slash and burn.


    Fertilizer is an expensive input and efficient use is important for good profitability
    and to reduce nutrients lost to the environment and soil acidification due to
    nitrogen application. The negative effects of nutrient application are reduced
    through efficient fertilizer use and the practice of the 4Rs of Nutrient Stewardship,
    that


    is, to apply the right product at the right rate, at the right time and using
    the right method, especially for N fertilizers as N is easily lost. Much of the
    fertilizer N should be applied shortly before or during periods of rapid vegetative
    growth of crops, approximately six weeks after planting maize. The farmer is the
    final decision-maker in determining practices suited to local soil, weather, cropping
    system and social economic conditions but the 4Rs of fertilizer use are a good
    framework for making decisions.


    Efficient fertilizer use requires a healthy and well managed crop. Minimizing
    potential yield-limiting situations allows for maximum response to applied fertilizer.
    Use of recommended and adopted varieties, cultural practices and pest control
    helps maximize fertilizer response. Also important to profitable and efficient
    fertilizer use may be consideration of soil test information and the effects of
    other practices such as manure application and use of lime or wood ash to reduce
    soil acidity.


    # 16.4 Fertilizer use optimization


    Normally farmers wish to maximize profit from fertilizer use. This may be to maximize
    net returns per hectare resulting from fertilizer use. In the case of financially
    constrained fertilizer use, profit maximizing means to achieve high returns on
    their small investment. Investment in fertilizer competes with other uses of financial
    resources by the financially constrained. In order to meet immediate livelihood
    needs, fertilizer investments must give high returns with little risk. Therefore,
    fertilizer use optimization refers to maximizing profit from fertilizer use according
    to the farmer''s agronomic and economic situation.


    The nature of crop response to applied nutrients, over a large number of trials,
    is usually curvilinear and reaching a plateau, as illustrated by the typical cowpea
    response to applied P in Zambia (Figure 16.2). With the first 5 kg/ha of elemental
    P, or 11 kg of phosphate, applied there is a very good yield increase. The yield
    increase continues up to 10 kg/ha (22 kg/ha of phosphate.) Yield increases past
    10 kg/ha is very low and probably not enough to pay for the cost of applying additional
    P. Therefore, the potential for profit per unit of investment is greatest at low
    input rates.'
