    # 16.6 Fertilizer use in an integrated nutrient management framework


    Fertilizer use decisions need to consider the effects of other practices that
    supply soil nutrients as well as soil test information (Table 16.3). The use of
    green manure and the application of manure calls for adjustment of fertilizer
    rates to be applied. The fertilizer substitution value varies with the quality
    of manure. Poultry and dairy manure are expected to have greater fertilizer substitution
    value than farmyard manure. Other practices with fertilizer substitution value
    include bringing material such as tree prunings into the field, rotations and
    intercropping. Soil test information should be considered. When soil test information
    is not available, soil test P should be considered low and fertilizer P applied
    according to the FOT recommendations. If soil test K is found to be very low,
    apply K even if not recommended by the FOT. As an example, ''For each 1 t of fresh
    leguminous leafy tree prunings applied (e.g.,


    Gliricidia, Leucaena, Sesbania, Senna'', the urea, TSP or DAP, or NPK rate can
    be reduced from the FOT recommendation for the field by 10, 1 and 6 kg/ha, respectively.
    The prunings may be from alleys within the field, field boundary areas, or nearby
    treelots.


