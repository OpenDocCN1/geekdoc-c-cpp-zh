    The available field research results did not show any of these crops to be generally
    responsive to applied K and Zn which agrees with the results of the diagnostic
    treatments (section 7.3). For the Central Highlands, the EOR compared with REC
    were lower for N but higher for P.


    In the Coastal Lowlands, all crops responded well to applied N and P (Table 7.2b).
    Cassava yield increases were high with N, P and K applied. Cowpea responded to
    applied N and K and more so to applied P. Maize and cowpea had responses to applied
    K. The EOR compared with REC were lower for N applied to maize but higher for
    N applied to cassava, finger millet and sorghum, and lower for P and K rates.
    In six cases, EOR were determined from field research results where RECs were
    missing.


