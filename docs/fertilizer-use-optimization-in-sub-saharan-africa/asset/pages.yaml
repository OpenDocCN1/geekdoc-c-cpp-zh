    # pH x 10 (range = 32 to 91)


    If the selected pH x 10 value is <54, then similarity equals the selected pH x
    10 value + 4. If pH x 10 is >54, similarity equals pH x 10 values >50.


    # Sand (%; range = 0 to 100):


    If the selected sand value is >75, then similarity equals the selected sand value
    + 20. If sand is <75, similarity equals sand values <80.


    # Elevation (m; range = -178 to 5,844):


    If the selected elevation value is <700, then similarity equals the selected elevation
    value + 1000. If elevation is >700, similarity equals elevation values >250.


    # Distance from Equator (DE; degrees x 1000; range = 0 to 11,691):


    Distance from Equator similarity equals the selected DE value + 3000.


    The tool queries two shapefiles, a point file of more than 5,300 georeferenced
    crop nutrient response functions and a polygon file of the 5-arc minute crop production
    raster cells with associated bean, cassava, cowpea, groundnut, maize, millet (pearl
    and small (finger)), Irish potato, rice, sorghum, soybean and wheat production
    (metric tons (mt)) values (HarvestChoice 2015a-1; You et al., 2014).


    The point file includes raster values at a representative point for each research
    plot (from which crop response is calculated) while the polygon file includes
    the median raster values associated with each 5-arc minute cell.


    The OFRA Inference Tool outputs information for the point of interest''s inference
    space: an Excel file containing a subset of crop response functions; two .pdf
    crop production maps (Figure 2.3); and a .dbf file containing crop production
    summaries (total production as metric tons and as the percentage of Africa''s
    total crop production). The .dbf file also contains the point of interest''s geographic
    coordinates and raster values as well as the queries used in the analysis.


