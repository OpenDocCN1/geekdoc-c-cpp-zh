- pgno: 8
  md: '# 1. Fertilizer Use Optimization: Principles and Approach


    Kayuki C. Kaizzi¹ kckaizzi@gmail.com, Mohammed Beshir Mohammed² and Maman Nour³

    ¹ National Agricultural Research Laboratories, PO. Box 7065, Kampala, Uganda

    ² Arba Minch University, P.O. Box 21, Ethiopia

    ³ Institut National de Recherche Agronomique du Niger, BP 240 Maradi, Niger


    # 1.1 Introduction


    Soils in sub-Saharan African (SSA) are degraded with low nutrient availability.
    This is partly a result of erosion, leaching and depletion through clearing and
    cultivation of the land with minimal use of external sources of nutrients (Stoorvogel
    et al., 1993; Bekunda et al., 1997). The rate of soil fertility decline depends
    on soil erosion, nutrient removal in harvests, the rate at which nutrients are
    returned to the soil through the use of both [inorganic] fertilizer and organic
    manures, and the rate of mineralization of soil mineral and organic matter nutrients.


    Optimization of fertilizer use by smallholders refers in this chapter to the maximization
    of net returns on the farmers'' investment achieved through the best choice of
    crop-nutrient-rate combinations. Making decisions on choice of crop to fertilize
    and the amount of each nutrient to apply, however, is very complex. Crop responses
    to applied nutrients needs to be considered in addition to the farmer''s land
    allocation to different crops, the value of the produce, the costs of fertilizer
    use and the money available for fertilizer use.


    The economic consequences of soil fertility nutrient depletion are great with
    reduced farm production and food security. Economic growth is slowed at community,
    regional and national levels by reduced agricultural productivity and its economic
    multiplier effects. Lower farm employment and increased poverty may drive migration
    to urban areas where infrastructure and employment opportunities are inadequate
    (Homer-Dixon et al., 1993).


    Fertilizer use in SSA countries is low, partly because farmers do not recognize
    adequate profit opportunity with acceptable risk. Unfortunately, most countries
    have blanket fertilizer use recommendations that too often fail to consider farmers''
    profit potential. Farmers who are financially well off can afford to apply fertilizers
    on all their farmland to maximize profit per hectare. Smallholders often have
    some financial ability to use fertilizer, but need high returns on their small
    investment. The high returns will often reduce the financial constraint, enabling
    them to invest more in fertilizer use in following seasons. Smallholders have
    a high opportunity cost for their money and a benefit-cost ratio of two within
    a six to 12 month period is often not sufficient to justify an investment; alternative
    use of the limited financial capacity may give better returns or better meet urgent
    needs.


    # 1.2 What is optimization?


    Optimization is the process of identifying solutions that minimize or maximize
    a function''s value, where the function represents the investment required for
    the desired benefit (Kumar 2013). All optimization problems are constrained due
    to resource scarcity or costs, and the maximizing or minimizing some objective
    function is always subject to one or more constraints.


    Two common techniques of optimization are linear programming (LP) and non-linear
    programming. Linear programming is applied when the objective function f (the
    function that should be maximized or minimized) is linear and the constraints
    (resource limitations) are specified using only linear equalities and inequalities.
    Non-linear programming is applied when the objective function, the constraints,
    or both contain non-linear components. Other optimization techniques include integer
    stochastic programming, dynamic programming, hill climbing and simulated annealing
    (Kumar 2013).


    Linear programming solves optimization problems where all the constraints as well
    as the objectives are expressed as a linear function using decision or activity
    variables and finite objective functions. The decision or activity variables refer
    to activities which are in competition with other variables for limited resources.
    For example, fertilizer purchase by a'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'farmer may be at the expense of seed purchase, food expenditure, school fee
    payment or bicycle repair. Linear programming requires a single clearly defined,
    unambiguous finite objective function to be optimized that can be expressed as
    a linear function of the decision variables. For example, a farmer allocating
    a budget to fertilizer use may strive to maximize profit or production. Hence,
    the maximization of production/profit, or the minimization of loss for this specific
    farmer, are finite objective functions.


    # 1.3 Fertilizer use optimization


    Profit oriented recommendations for non-finance constrained fertilizer use commonly
    strive to maximize mean marginal rates of return across all cropland. Many smallholder
    farmers do not have the financial capacity to purchase enough fertilizer to maximize
    net returns per hectare for fertilizer use for all of their cropland. They need
    to maximize returns on their limited investment through choice of crop-nutrient-rates
    combinations with potential to achieve the highest marginal returns until the
    budgeted financial resources are exhausted (Jensen et al., 2013).


    Constraints in linear programming are limitations on the available resources,
    such as availability of equipment, budget, managerial time or labour, production
    capacity and the market demand for the finished goods. Such limitations also occur
    with smallholders.


    Crop nutrient response functions are essential to efficiently applying economics
    to fertilizer use decisions. These were determined from results of field research
    conducted across the 13 OFRA countries as asymptotic curvilinear-plateau functions
    taking the form of an exponential rise to a maximum or plateau yield. The asymptotic
    function is Y = a – bc^X, where Y is yield (t/ha), a is the maximum or plateau
    yield (t/ha) for application of a specific nutrient, b is the maximum gain in
    yield (t/ha) due to application of the nutrient, and c^X represents the shape
    of the quadratic response, where c is a curvature coefficient and n the nutrient
    application rate (kg/ha). Information available from locally conducted research
    was supplemented by geo-spatial transfer of response functions determined elsewhere
    under similar crop growing conditions, that is, in the same incidence space (Chapter
    2).


    The maximization equation may take the form of net returns or profit resulting
    from decisions on different fertilizer uses (e.g. X1 and X2) and the LP optimization
    solves the values for X1 and X2 which maximize the objective function of high
    profit from fertilizer use (Figure 1.1). A limitation of linear programming is
    that both the objective and constrained functions must be linear and the coefficients
    for each function must be specified.


    The response functions were then graphically displayed for each crop nutrient
    combination, such as for maize response to nitrogen (N) for growing conditions
    similar to those of the Transitional/Derived Savanna of Ghana and Nigeria (Figure
    1.2). The legend identifies the source of the curves with a three letter country
    identifier followed by the research site’s latitude and longitude (degrees). The
    results in this case were primarily from Ghana and Nigeria but also from Mali,
    Burkina Faso, Togo and even one case from eastern Tanzania.


    Linear programming was applied to develop fertilizer optimization tools (FOT)
    as a component of the fertilizer use optimization approach developed by the project
    Optimising Fertilizer Recommendations in Africa (OFRA). The FOTs are used to maximize
    the net returns of farmers from nutrient application, subject to budget constraints,
    fertilizer costs and produce values. National research teams of Burkina Faso,
    Ethiopia, Ghana, Kenya, Mali, Malawi, Mozambique, Niger, Nigeria, Rwanda, Tanzania,
    Uganda and Zambia collaborated in OFRA.


    A response function representing the median yield results across all N levels,
    displayed as the heavy green dashed line, was determined; median rather than mean
    results were used to reduce the influence of outlier responses. The response function
    for high yield maize (>3 t/ha),


