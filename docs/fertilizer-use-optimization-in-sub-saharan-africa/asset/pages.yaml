    # 9.1.3 Fertilizer use and recommendations


    Most of the soils in Malawi are highly weathered, low in organic matter (OM) with
    low pH and low availability of P, K, S, B and Zn; over 40% are Oxisols and Ultisols
    (Saka et al., 2006).


    Overall, current fertilizer use in Malawi was estimated at 43 kg per arable hectare
    in 2015, up from 31 kg/ha in 2003. This rate of use is high compared with mean
    rates for many African countries; however, it is very low considering the intensity
    of land use.


    In early 1970s, 20:20:0 was recommended as a basal dressing followed by top dressing
    with sulphate of ammonia or calcium ammonium nitrate (CAN). Later, in the 1980s,
    the government introduced urea and DAP which were cheaper. Later DAP was replaced
    with 23-21-0+4S as a basal dressing fertilizer followed by top dressing with urea
    or CAN. However, recently, K is also becoming a more common deficiency, especially
    on soils that are continuously and intensively cultivated. Much


    The prevailing poverty of smallholder farmers prevents many from using fertilizer.
    Fertilizer use is constrained by the financial ability of farmers. The profit
    potential of fertilizer use needs to be increased such as by reducing fertilizer
    use costs through more efficient fertilizer supply with reduced transport costs,
    subsidizing fertilizer use, higher commodity prices and better access to low cost
    and accessible financing. All of these factors have been difficult to achieve.
