  md: '# 8.2 Current soil fertility management


    Extensive and unsustainable exploitation of natural resources has resulted in
    soil degradation in Mali (Koné and Doumbia 1997). Each cropping system is experiencing
    intensification and sustainability challenges. Increased crop yields on soils
    of low natural fertility requires a more intensive and effective use of fertilizer
    combined with manure. Most fertilizer used in Mali is imported.


    Crop production is mostly rainfed and crops are grown from June to October and
    harvested between November and December. Over the years, farmers have adopted
    GAP for soil fertility management that fit their production systems. Some examples
    of GAP are:


    +   - Fallowing to restore soil fertility: although traditionally very important
    (Wane 2009) fallows are becoming shorter and disappearing in some places (Dixon
    et al., 2001) because of population growth of 3% per year and a high pressure
    on lands.

    +   - Intercropping: sorghum-cowpea and sorghum-peanut in the North Sudan Savanna
    and lowlands of the Sahel; pearl millet- cowpea in the Sahel; and annual crops
    with trees such as shea tree in the North Sudan Savanna and Acacia albida in the
    Sahel add to land productivity while the trees contribute to the maintenance of
    soil fertility.

    +   - Application of manure on the fields by three traditional manure delivery
    systems: (a) the ‘overnight-parking’ arrangement with nomads with consequent deposition
    of faeces and urine in the fields, (b) moving


    night pens from one point to another in which the deposition and trampling of
    faeces by animals contribute to their incorporation into the soil, and (c) fixed
    night pens from which the manure is transported and applied to fields (Landais
    and Lhoste 1993). Dry season feeding of crop residues is common with the unconsumed
    residue serving as bedding and eventually absorbing urine and entering into manure.


    To achieve fertilizer use efficiency, recommendations should be adapted to cropping
    systems and rainfall amounts and distribution with rates decreasing from south
    to north. Good fertilizer nutrient management is referred to as the 4Rs of Nutrient
    Stewardship implying application of the right source of nutrients at the right
    rate, at the right time for efficient uptake by the crop, and with the right placement
    to be accessible to plant roots (Johnston and Bruulsema 2014).


    Fertilizer use in Mali has increased from 84,800 tons in 1994 to 175,000 tons
    in 2009 and 250,000 tons in 2011, despite the unusually high fertilizer costs,
    or fertilizer price inflation, of 2007 and 2008. In 2012, fertilizer sales reached
    about 300,000 tons. This increase in imports and sales of fertilizer is mainly
    due to subsidies and more efficient fertilizer distribution with about 2000 input
    shops supplying quality fertilizers to farmers (CNFA 2010). Fertilizer blending
    facilities, which include Toguna Agro-Industry, Sogefert and ADP, respectively,
    in Bamako, Sikasso and Ségou, attempt to match blends with crop needs.


    ![](img/279f2242dca113ddfb6220d3a162ffff_101_0.png)


    Figure 8.2: Crop response to added secondary and micronutrients (Mg, S, Zn, B)
    at field research sites of 2014-15 in Mali.'
