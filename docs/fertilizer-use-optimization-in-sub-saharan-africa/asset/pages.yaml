    # 8.6 Targeted crops and cropping systems by AEZ


    Mali has four major AEZ for crop production. The OFRA project was implemented
    in areas of 450 to 1200 mm annual rainfall for the major staple cereals including
    maize, sorghum, millet and rice in the regions of Koulikoro (Samanko and Kolombada),
    Kayes (Bema), Sikasso (Bougouni, Kebila, Longorola and Finkolo) and Segou (Cinzana
    and Niono). Other crops were addressed using results of past research including
    data from neighbouring countries.


    Crop nutrient response functions for N, P and K were developed (Tables 8.4a–c).
    The coefficients a, b and c of the response functions (column 3–5), the expected
    yield increase due to increments of nutrient application (column 6–9) and the
    EOR compared with the recommended rates are reported (column 10-11).


    In the Sahel, rice and maize had more response to N compared with sorghum and
    pearl millet but all of the upland cereals had big responses to P (Table 8.4a).
    Rice and groundnut did not have economic responses to P. Only rice and cowpea
    had economic responses to K. EOR of N is less than half the recommended rate (REC)
    for maize and rice, but also less for sorghum and pearl millet. The EOR is sometimes
    more for P than the REC. The rice EOR for K was about 25% the REC.


    In the North Sudan Savanna, maize and sorghum had greater response to N compared
    with rice and most of the grain yield increase occurred with 30 kg/ha applied
    (Table 8.4b). Responses to P were relatively small except for pearl millet. Evidence
    of response to K was lacking. The N REC for rice was low compared with the rate
    of the Sahel and similar to the EOR for N. The EOR for N applied to rice was greater
    than for maize and sorghum because of the higher value for rice grain. The EOR
    of N were less than the REC for maize and sorghum. The EOR of P varied inconsistently
    with the REC.


    In the South Sudan Savanna (Table 8.4c) upland rice, maize and sorghum have the
    best response'
