- pgno: 174
  md: '# 13.7 Conclusion


    Research on optimization of fertilizer use was conducted in the Northwest, South
    Central and Eastern AEZ of Rwanda in 2013-15. Response functions for N, P and
    K applied to maize, rice, wheat, bush and climbing bean, soybean, Irish potato,
    sweet potato and banana were determined using results from past and recent trial
    results. The response functions were used in the development of FOTs to be used
    to determine the optimal crop-nutrient-rate combination for maximizing net returns
    on investment in fertilizer use, especially for finance constrained situations.
    Paper FOTs were introduced as well as other tools for fertilizer use decisions.
    The RECs were found to be generally high compared to the EOR determined from results
    of field research.


