  md: 'constrained farmer, is that not all nutrients applied to the same or different
    crops have the same profit potential. In Figures 8.4a-c, each curve represents
    the profit for a nutrient applied to a particular crop. The horizontal axis shows
    the amount invested in a nutrient applied to a crop. The vertical axis shows the
    net revenue resulting from the application of each nutrient to a crop. The net
    income tends to increase as one invests more in an applied nutrient until a peak
    before net income begins to decrease. The rate at the peak is referred to in this
    chapter as the economically optimal rate (EOR), that is the rate to maximize net
    returns per hectare and the targeted rate of the farmer with adequate financing.
    With the optimization of fertilizer use approach, the farmer''s financial constraint
    affects the choices of fertilizer amounts to apply to different crops as the farmer
    wants to apply fertilizer to maximize net returns on the limited investment. When
    the curves are steep, the expected net returns to application of that nutrient
    to the crop are high.


    combinations appropriate to the choice of crops that have the greatest potential
