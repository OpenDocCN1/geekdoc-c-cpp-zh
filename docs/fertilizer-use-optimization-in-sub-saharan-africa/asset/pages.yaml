  md: '''Doubled-up legume'' intercropping refers to intercropping of two legumes
    and is practised in Malawi. Species complementarity is improved with differing
    growing habits and maturity periods such as with tall growing and late maturing
    pigeonpea intercropped with groundnuts or soybean. Doubled-up legume intercropping
    has been observed to result in more BNF compared with the sole crops. The earlier
    maturing legume makes much of its growth before the tall legume intercepts much
    radiation. The tall late maturity legume uses water of late rains and residual
    soil water following maturity of the associated crop. Soybean and cowpea have
    been observed to lack complementarity in doubled-up legume intercropping.


    production of a relatively higher C:N biomass is desired such as for ground cover
    or increasing soil organic C. It is commonly incorporated into the soil but may
    be left on the soil surface as a mulch. Green manure crops are cover crops but
    not all cover crops often are not legumes and may be grown for other purposes
    than N supply, such as protection against erosion or for weed suppression. Green
    manure and other cover crops are by definition not harvested although a farmer
    may decide in the end to instead harvest it as a forage or grain crop.


    The implications of intercropping for nutrient application rates have generally
    not been well determined. An exception is for maize-bean intercropping in Kenya
    where the optimal rate of N and P is higher with intercropping compared with sole
    crop maize (see Chapter 6).


    Much research on green manure and cover crops has been done in SSA and the results
    were well synthesized by Elijta et al. (2004). Common green manure species include
    mucuna Mucuna pruriens, several crotalaria species, Canavalia ensiformis, Dolichos
    lablab and cowpea. The green manure may be a sole crop, especially during the
    minor rainy season where bimodal rainfall occurs. It may also be relay intercropped
    with another species, such as planting of the green manure crop at second weeding
    of the main crop with the green manure crop continuing to grow after harvest.


    # 3.3.5 Green manure


    Legumes can add much to the N balance of a farm operation through BNF. Giller
    and Wilson (2001) estimated the BNF capacity of various legumes at 105 to 206
    kg/ha N for pulses, 110 to 280 kg/ha for green manure crops and 162 to 1063 kg/ha
    over several years for tree legumes Some species-specific annual BNF rates are
    presented in Table 3.4.


    There is ample evidence of increased yield of the following non-legume crop, even
    in some cases with fertilizer N applied. Depending on the C:N of the biomass of
    the green manure crop and the time since termination of the crop before planting
    the next non-legume crop, some fertilizer N might be applied to support the early
    growth of the non-legume crop while organic N in the green manure biomass becomes
    crop available. For example, application of up to 30 kg/ha of fertilizer N is
    recommended in Tanzania for rice production following the incorporation of mucuna
    green manure biomass.


    A green manure crop is a legume that is grown for BNF to supply N to following
    crops and organic matter for soil property improvement. It is often terminated
    before maturity although may be allowed to grow to maturity when maximized


