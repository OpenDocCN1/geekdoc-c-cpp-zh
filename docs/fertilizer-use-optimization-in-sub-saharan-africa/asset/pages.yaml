    Ethiopia has a great ecological diversity, ranging from tropical to temperate
    conditions. Altitude ranges from -126 masl (Danakil Depression) to 4620 masl in
    the Ras Dashen Mountains. Agro-ecological zones (AEZ) were determined with a crop
    suitability approach considering temperature, precipitation, soil characteristics
    and topography differences. The major crop growing areas are in sub-humid, humid,
    and moist semi-arid climatic zones (Figure 5.1). About 51% of the country is in
    arid, semi-arid and sub-moist zones (Fantaye 2016).


    This chapter is focused on seven AEZ with the mid-highland AEZ sub-divided by
    altitude (Table 5.1) and lowland AEZ sub-divided by altitude or latitude. These
    AEZ cover most of the cropland of Ethiopia. The selected AEZ have an altitude
    ranging from 500 to > 3000 masl. Rainfall modality changes from near bimodal in
    the south to increasingly unimodal at higher latitudes. For example, 39 and 35%
    of annual rainfall occurs during March to May and September to November, respectively,
    at Konzo in southern Ethiopia. At Axum in northern Ethiopia, 83% of the rainfall
    occurs in July and August.


