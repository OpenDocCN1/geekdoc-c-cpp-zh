  md: '# 7.5 Crops targeted for optimization by region


    The OFRA determined crop-nutrient response functions for important food crops
    and applied the functions in development of fertilizer use optimization tools
    (FOTs). Priority crops for different regions were chosen: maize, bean, Irish potato,
    lowland rice and wheat were common in most regions while banana, sweet potato,
    cowpea, green gram, sorghum and finger millet were selected for one or more regions
    (Table 7.2a-h).


    Irish potato, lowland rice, green gram, soybean and wheat are mainly grown as
    sole crop in all the regions. However, maize-bean intercropping is common. Finger
    millet and sorghum are commonly grown on Rift Valley and Western regions, are
    grown on small land areas during the short rains due to high labour requirement.


    In the Central Highlands (LU and UM), all crops except for bean had large responses
    to applied N with most of the yield gain with 30 kg/ha N


