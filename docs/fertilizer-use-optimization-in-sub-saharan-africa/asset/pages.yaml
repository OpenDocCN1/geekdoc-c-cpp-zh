  md: 'When the slope of the curve is steep, net returns to investment are very high.
    As the amount invested (the x-axis) increases the slope decreases but if still
    upward, profit is increasing. The curves reach a peak at the EOR, that is, the
    rate of maximum profit per hectare. When slopes decline with increased nutrient
    rate, profit is declining. The financially constrained farmer wants first to take
    advantage of the crop-nutrient combinations that will give the most net returns.


    # 4.5 Fertilizer use optimization tools (FOT) for AEZ of Burkina Faso


    Making decisions on choice of crop to fertilize and the amount of each nutrient
    to apply to maximize profit from fertilizer use is complex for the farmer producing
    several different crops. Not only the agronomy of the responses to applied nutrients
    by the different crops is important, but the farmer''s choice of crops, expected
    crop values, fertilizer use costs and available money for fertilizer use need
    to be considered.


    In the South Sudan Savanna, sorghum with N and P applied, and maize and lowland
    rice with N applied, have high profit potential with small investment (Figure
    4.4). The highest rate of returns on investment is with a small amount of N applied
    to sorghum, up to about FCFA 5000/ha worth of N, but EOR is soon reached after
    which profit declines. The next steepest slope is with N applied to maize with
    a high rate of return up to FCFA 20,000/ha of N applied after which applying more
    N reduces profit. Nitrogen and P applied to rice has profit potential with the
    maximum return with FCFA 20,000/ha investment in P while the required investment
    to reach EOR for rice N is around FCFA 60,000/ha. Nitrogen and K applied to cowpea
    have moderate profit potential while other options with low lying curves have
    relatively little profit potential.


    A computer program using linear optimization was developed for each AEZ to aid
    in the choice of fertilizer use options to maximize profit potential (https://agronomy.unl.edu/OFRA).
    The program is a Microsoft Excel Solver® (Frontline Systems Inc.) tool and is
    referred to as a Fertilizer Optimization Tool (FOT). The FOT uses complex mathematics
    in integrating the numerous crop nutrient responses functions with economic and
    agronomic information.


    # 4.5.1 The Excel FOT


    Use of the FOT requires the Excel add-in Solver and also for macros to be enabled.
    Step-by-step instructions are provided for this in the ''Help and Instructions''
    worksheet of the FOT. More detailed instructions are in Extension Materials and
    FOT Manual (https://agronomy.unl.edu/ OFRA).


    As for other AEZ of Burkina Faso, profit potential varies with crop-nutrient-rates.
    The financially constrained farmer needs to first take advantage of the high profit
    opportunities such as with N and P applied to sorghum and N applied to maize and
    lowland rice, if the farmer produces any of these crops. The rates of application
    should be less than EOR for P applied to sorghum and N applied to maize or rice
    as other fertilizer use options become competitive for profit potential, such
    as low rates of P applied to lowland rice or to maize.


    The FOT data input screen (Figure 4.5) allows for entry of how much land the farmer
    plans to plant for each crop of interest (under Area planted, ha) and the estimated
    commodity value on-farm at harvest time considering that some will be for home
    consumption (the most valuable) and that the surplus will be marketed (under Expected
    grain value/kg). The costs of using different available fertilizers are entered
    (under Costs per 50 kg bag). An additional fertilizer can be added below the four
    fertilizers where the fertilizer name and concentration of N-P2O5-K2O-Zn can be
    entered (occupied by NPK 14-23-14-0 in the image at FCFA 20,000 for a 50 kg bag).
    Finally, the farmer''s available money for fertilizer use is entered (under Budget
    constraint, 200,000 is entered). When data entry is complete, the below ''Optimize''
    cell is left-clicked to run the optimization.


    The financially able farmer striving to maximize profit per hectare due to fertilizer
    use should not invest more than FCFA 30,000 per ha in an applied nutrient given
    the assumed fertilizer costs and grain values. The exception is with N applied
    to lowland rice in this AEZ; profit can increase by applying up to 60,000 FCFA
    per ha worth of N to lowland rice.'
