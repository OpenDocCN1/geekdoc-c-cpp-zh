    # 12.7.3 Fertilizer use in an integrated soil fertility management context


    Organic residues such as livestock manure, compost, cereal-legume rotation and
    intercropping with legumes can contribute to soil nutrient availability. Their
    contributions should be considered and some of the recommended fertilizer can
    be allocated elsewhere. The fertilizer nutrient substitution values of practices
    are provided in terms of adjustment to fertilizer rates in Table 12.4. For example,
    the level 1 farmer in the paper FOT needs to apply 37 kg/ha


    # 12.8 Targeted crops by AEZ


    During 2014-15, results of past research were compiled and analysed, and additional
    field research was conducted to improve the information for fertilizer use decisions
    in the savanna AEZ of Nigeria (Table 12.5a-f). The food crops addressed were cassava,
    maize, sorghum, pearl millet, lowland and upland rice, groundnut and soybean.


    Current recommendations (REC) guiding fertilizer use in Nigeria were developed
    over 30 years ago, are outdated and do not reflect current soil, crop and weather
    situations.'
