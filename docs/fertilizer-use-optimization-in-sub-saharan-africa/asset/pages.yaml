    loss of N.


    # 3.3.11 Water availability


    Water is the direct source of the essential nutrient hydrogen and is necessary
    for plant uptake of nutrients as well as for plant metabolism and growth generally.
    Soil water deficits may be prevented with timely irrigation. Mason et al. (2015)
    reviewed 21 papers addressing tillage and water conservation in the Sahel and
    found generally higher yields by planting pearl millet into tilled compared with
    untilled soil because of improved water infiltration with tillage, a large positive
    effect of water conservation with tied-ridges and zai, and that there was often
    a positive interaction of combining nutrient application with water conservation.


    Zougmoré et al. (2004) found that water harvesting and conservation alone did
    not improve crop productivity in Burkina Faso but was effective when organic material
    and fertilizer were added. They found that combining compost with stone bunds
    or grass strips resulted in 180% more sorghum grain yield, while the same soil
    conservation measures used jointly with fertilizer N only increased yield about
    70%. Sorghum yield was more with zai half-moon micro-catchments


    combined with compost or animal manure application compared with fertilizer application.


    Weed control is important to water and nutrient availability. Inadequate control
    may reduce maize yields by more than 50% and two weeding cycles of maize are often
    needed (Kabambe and Kumwenda 1995) (Figure 3.6).


    # 3.4 Conclusion


    Improved soil nutrient availability is essential for much increased crop productivity
    in SSA. Smallholder farmers are typically very poor and need to get high net returns
    on their use of money such as for fertilizer use. Therefore, cost effectiveness
    of improved soil nutrient supply is very important. This chapter has explored
    alternatives of nutrient supply and management for high nutrient use efficiency.


    Potential synergies of combining different alternatives sometimes exist, especially
    for situations of low soil productivity and little response to fertilizer application,
    but more often effects are mostly additive. Increases and improved use of organic
    resources, increased integration of legumes in rotations, crop rotation, increasing
    soil organic matter and improvement in associated soil properties such as through
    rotation of perennial with annual crops and use of biochar, better use of fertilizer
    and reducing soil water deficits, are addressed.'
