  md: 'Note that the budget constraint was FCFA 100,000 which was allocated to 32,
    53, 170, 20 and 0 kg of urea, TSP, DAP, KCl and NPK 15-15-15 (Figure 8.5b). The
    NPK blended fertilizer is likely the most expensive to produce, but has the lowest
    price because of unbalanced subsidies on fertilizer types. Even though it has
    a low price, it was not found to be economically competitive with other fertilizers
    because farmers would have to pay for the three nutrients even if the crop does
    not have an economic response to all nutrients. The added cost would mean profit
    lost. It would be even more harmful to the financially constrained farmer as purchase
    of the NPK would mean less money available for purchase of a fertilizer that has
    high profit potential. In some situations where the crop has an economic response
    to all three nutrients, the NPK blend may be economically competitive if adequately
    subsidized. When the scenario of Figure 8.4 is optimized with only urea and NPK
    available, the expected average total net returns are only CFA 184,524 compared
    with CFA 275,331, and only 67% of expected profit to the farmer who has the wider
    choice of fertilizer. The results illustrate the importance of enabling farmer
    access to a choice of fertilizers if the intent is to maximize farmer profit potential.


    For each Excel FOT, a companion paper FOT is developed realizing that farmers
    and extension workers often will not have a readily available computer (Table
    8.2). The paper FOT has three financial capacity levels. Financial level 1 is
    the most constrained for a farmer who cannot invest more than one-third of the
    total amount required to apply fertilizer to all cropland at EOR. Farmers in financial
    level 2 have less than two-thirds the money needed to apply to all cropland at
    EOR. Farmers in financial level 3 have enough money to apply to at least some
    cropland at EOR.


    The paper FOT makes assumptions about the measuring units that the farmer can
    use to calibrate the visual and hand-feel perception of the correct rate. It is
    assumed that the farmer will plant as recommended. Assumptions are made about
    fertilizer costs and expected grain values on-farm at harvest. The paper FOT addresses
    the 4Rs of fertilizer use and recommends the right product, the


    right rate, the right time and the right method of application. It also informs
    the user on calibration of application.


    Consider the paper FOT for South Sudan Savanna (Table 8.2). One of the three recommendations
    for the financial level 1 is “Rice lowland: Broadcast 28 kg urea (Gino for 11
    m) at 0 WAT and 50 kg urea (Gino for 6 m) at panicle initiation, and 106 kg NPK
    (Gino for 2 m) at 0 WAT.” Therefore, the farmer will broadcast apply 28 kg/ha
    of urea and 106 kg/ha NPK 15-15-15 to lowland rice, including irrigated rice,
    at transplanting time and another 50 kg/ha urea at panicle initiation. When broadcasting,
    he/she will broadcast with a 3 m width. He/she should use a Gino brand tomato
    sauce can of 70 ml for calibration of his/her sense of application to achieve
    the correct rate. One Gino can is enough to broadcast to an area of 3 m wide and
    11 m long for the transplant application of 28 kg/ha of urea. For the transplant
    application of 106 kg NPK, one Gino is sufficient to broadcast an area of 3 m
    wide and 2 m long. For the application at panicle initiation of 50 kg urea, one
    Gino is enough for an area 3 m wide and 6 m long.


    A constraint of the paper FOTs is that it may need to be revised yearly if there
    is significant changes in fertilizer costs relative to grain values. This is to
    be done at the national level with redistribution such as publication in newspapers
    as well as with on-line access. The steps to paper FOT development and revision
    are described in Chapter 1.


    Smallholder farmers typically farm small areas of land but numerous parcels of
    land that differ in crop history and management. The FOTs more or less work on
    a whole farm basis to optimize profit for the farm enterprise. The FOTs (Excel
    and paper versions) give optimized recommendations for fertilizer use within the
    farmer’s context and in situations of important agricultural land typical to an
    AEZ. However, optimization of fertilizer use needs to consider other practices
    that might affect nutrient availability on one or more of their land parcels (Table
    8.3). Soil test results may indicate an adjustment in the fertilizer recommendation.
    Some practices, such as manure application, affect the optimal fertilizer use
    rate. For example, it is recommended that if farmyard manure is applied'
