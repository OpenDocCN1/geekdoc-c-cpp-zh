  md: 'Farmers’ financial resource base determines how much fertilizer use they can
    afford. Farmers without financial constraints to procurement of fertilizers target
    the potential yield of the crop and can invest large amounts of money to attain
    optimum yield. Nigerian farmers commonly procure fertilizer blends that do not
    give maximum return on investment due to lack of knowledge or access to more cost-effective
    fertilizer choices. The paper FOTS consider three financial ability levels:


    +   • Financial level 1 is the most constrained. This farmer has no more than
    one-third of the money needed to apply fertilizer at EOR to all cropland.


    +   • Financial level 2, moderately constrained. This farmer has no more than
    two-thirds of the money needed to apply fertilizer at EOR to all cropland.


    • Financial level 3, the least constrained. These rates are the EOR that on average
    will maximize profit per hectare.


    Considering that urea, SSP and NPK 15:15:15 are the most common fertilizers in
    the Nigerian market, use of the paper FOT in this chapter is based on the use
    of these fertilizers, either alone or in combination to provide the optimized
    fertilizer rate for the AEZ. As fertilizer supply becomes more liberalized, more
    fertilizers will be added.


    For a financially constrained farmer in level 1 who wants to produce cassava in
    the Nigerian Mid-altitude, he/she should procure 200 kg of NPK 15:15:15 and point
    apply 100 kg/ha (1 FARO per 0.5 plant at 4 weeks after planting (WAP)) and repeat
    the same at 8 WAP. For his/her maize crop, 48 kg/ha urea (1 FARO for 6.5 plants)
    should be applied at 3 WAP. For his/her groundnut plot the farmer


