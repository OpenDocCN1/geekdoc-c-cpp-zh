    # 14.4 Diagnosis of nutrient deficiencies in Tanzania


    In the 2014-2015 season, 41 trials were conducted for upland crops which included
    a comparison of N+P+K+Mg+S+Zn+B with N+P+K to determine if one or more of the
    secondary or micronutrients resulted in increased yield. The overall effect of
    the diagnostic package was little effect on cereal yield but a 12.6% reduction
    in legume yield in the Southern Highlands (Figure 14.3; AEZ H3 and H5 from Figure
    14.2). Bean and pigeonpea yield were increased by 15% and 27% in the Northern
    Zone with the diagnostic treatment but cereal yield was decreased (AEZ N3 and
    N6). In the Eastern Zone, cassava tuber yield was increased by 12.3% but other
    crops were not affected by the diagnostic package (AEZ C1). The negative effect
    of the diagnostic package in some situations could not be accounted for with existing
    data. The lack of predictable positive response indicates that application of
    any of these secondary or micronutrients is not likely to be profitable without
    more site-specific information. Further investigation is needed to


    # 14.5 Optimizing fertilizer use in Tanzania


    As indicated in section 14.3, most smallholders do not use fertilizers and rates
    of application are generally less than currently recommended. Most smallholders
    live and operate under severe financial constraint and investment in fertilizer
    use competes with other uses of financial resources for meeting immediate needs.
    Fertilizer use investments must give high returns with little risk.


    OFRA (Optimizing Fertilizer Use in Africa), an Alliance for a Green Revolution
    in Africa (AGRA) funded project, has strengthened the information basis for determining
    more cost-effective fertilizer use. The typical crop response to an applied nutrient
    is curvilinear to plateau. Such a yield response (vertical axis, y-axis) of rice
    to applied N (horizontal axis or x-axis) is displayed in Figure 14.4 with a steep
    yield increase with increasing N at low rates, a lesser rate of yield increase
    with increasing N at low rates, a lesser rate of yield increase at higher N rates,
    until yield reaches a plateau with no more yield increase. This tells us that
    the net returns relative to amount invested at low rates of nitrogen application
    are greater than with higher rates. Such response curves are typical for most
    crops and nutrients and are essential to determining the profitability of fertilizer
    use for all farmers.


    Another important aspect of achieving high profit from fertilizer use for financially
    constrained farmers is that profit potential varies with nutrients and the crops
    to which these are


