    # 12.7 Fertilizer optimization tools for Nigerian AEZ


    # 12.7.1 The Excel Fertilizer Optimization Tool


    The Excel Fertilizer Optimization Tool (FOT) was first developed by Jansen et
    al (2013). It has been adapted to 67 country–AEZ of Africa including the six savanna
    AEZ of Nigeria. The FOTs are public goods that can be accessed by individuals
    at https://agronomy.unl.edu/OFRA. Educational institutions are encouraged to access
    the tool for use in their curriculum.


    The FOTs are Excel Solver® (Frontline Systems Inc.) tools (Figure 12.6). To use
    the FOT, the Solver add-in of Excel needs to be engaged and macro need to be enabled;
    see the ''Help and Instructions'' worksheet of the Excel FOT. More detailed instructions
    are in Extension Materials and the FOT Manual, also available at https://agronomy.unl.edu/OFRA.
    When Solver is enabled, it is indicated in the upper right of the


    Quick Access Toolbar under the Data tab.


    The FOT is used to optimize investment in fertilizer use for the crops that the
    farmer chooses to cultivate in that season. It accounts for agronomic efficiency
    and economic returns from money invested in fertilizer use. The tool provides
    recommendations based on fertilizer cost, crop grown and resource level of the
    farmer, as well as the expected values of the various crops to be produced. It
    provides the best crop-nutrient-rate combinations to maximize returns on fertilizer
    investment for that farmer''s situation.


    The FOT has information input and output sections. The input section is a panel
    to enter: (1) area (ha) to be cultivated and expected value of each crop at harvest,
    (2) cost of buying and applying 50 kg bags of available fertilizers and (3) amount
    of money available for the farmer to invest in fertilizer use (Figure 12.6). When
    steps 1, 2 and 3 are completed, the user clicks on the ''Optimize'' (4) button
    to run the optimization calculations.


    The output panel (Figure 12.6) provides results of the optimization calculations.
    It displays: (5) recommended fertilizer rates for each selected crop, (6) expected
    average yield increases and'
