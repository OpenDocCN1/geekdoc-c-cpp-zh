  md: '# 8. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Mali


    Mohamed Dicko mkdicko@gmail.com, Mama Koné, Lamine Traoré, Cheick H. Diakité,
    Nianankoro Kamissoko, Baba Sidibé, Zoumana Kouyaté, Diallaka Sogodogo, Lassana
    Dioni, Hamidou Konaré and Amadou Gakou

    Institut d''Economie Rurale, B.P.258, Rue Mohamed V Bamako, Mali


    # 8.1 Agricultural systems of Mali


    Mali is a vast country of 1,241,000 km² in the semi-arid zone of West Africa (10
    ° to 25 °N and 4 °E to 12 °W; Diarra 1993; MEATEU 2000). Agriculture is the principal
    occupation of about 80% of the population. It accounts for 34% of GDP and 23%
    of exported products.


    Subsistence farming dominates with agricultural produce largely consumed locally
    by the producers. Cropland has increased while fallow has decreased and crop mean
    yields, except for rice, have not increased.


    Generally, smallholders readily adopt new good agricultural practices (GAP), including
    new varieties, use of fertilizers and good husbandry methods. Where appropriate,
    double cropping is practised and fertilizer use varies according to farmers''
    financial capacity. In the south and west of the country, inputs may be provided
    for cotton


    and maize production and fertilizers are used more in the cereal-cotton rotation
    than cropping systems that do not include cotton. The value of complementing fertilizer
    use by manure application is recognized. Farmers welcome herdsmen to ''overnight-park''
    livestock on their fields during the dry season to gain the excreted urine and
    faeces.


    A law called ''Loi d''Orientation Agricole'' (LOA: Agricultural Orientation Law),
    enacted in 2006, has enabled government subsidies on seeds and fertilizers, mechanization
    of agriculture, structuring and strengthening the technical capabilities of producers
    and their organizations, and the establishment of an institutional framework called
    the High Council of Agriculture.


    Mali has a dry tropical climate with an annual rainfall ranging from less than
    100 mm to about 1200 mm (Table 8.1). Mali has four bioclimatic based agro-ecological
    zones (AEZ): Sahara,


    Table 8.1: Mean monthly rainfall (mm) and maximum and minimum temperature (°C;
