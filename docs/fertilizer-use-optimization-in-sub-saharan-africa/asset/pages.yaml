- pgno: 21
  md: 'the annual accumulation of growing degree days is dependent upon elevation,
    which is represented by Hydroshed''s 3-arc second digital elevation model (DEM)
    (Lehner et al., 2008) resampled to 7.5 arc-seconds. Distance from the equator
    expressed as the absolute value of degrees latitude (as degrees x 1000; 7.5 arc-second)
    relates to rainfall distribution which changes from bimodal at the equator to
    increasingly unimodal with distance from the equator. Latitude also affects day
    length which impacts photoperiod sensitive crops. AfSIS 5-15 cm depth soil pH
    (as pHx10) (30-arc second; Hengl et al., 2014), sand content and soil organic
    carbon (SOC) content (7.5-arc second; Hengl et al., 2015) are included in the
    inference space analysis. Sand content is negatively related to clay content.
    Sand, pH and SOC are determinants of cation exchange capacity. Sand and SOC content
    are also important determinants of a soil''s available water holding capacity.
    The average growing degree days (base 0) raster is highly correlated with elevation
    so it is not used to identify similarity but it is provided for reference. The
    raster was calculated from WorldClim.org''s 30 arc-second mean monthly temperature
    data (Hijmans et al., 2005). All data are in geographic coordinates referenced
    to the WGS 1984 datum (GCS_WGS_1984).


    The inference tool identifies the above seven raster values at the point of interest
    and uses a set of pre-defined queries to select crop nutrient response data from
