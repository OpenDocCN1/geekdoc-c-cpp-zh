    # 9.3 Optimizing fertilizer use in Malawi


    Fertilizer use optimization in this chapter is considered to be maximization of
    farmer profit from fertilizer use. It assumes that farmers with adequate financial
    ability will want to maximize profit per hectare from fertilizer use while financially
    constrained farmers will want to maximize net returns on their limited investment
    in fertilizer use. The magnitude and nature of a crop response to an applied nutrient
    in a given AEZ is important to profitability for both the financially able and
    the financially constrained farmer. Also very important to the financially constrained
    farmer is the relative profit potential associated with specific nutrients applied
    to specific crops, that is, of the crop-nutrient choice.


    Crop response to applied nutrients varies with the crop, the nutrient and site-season,
