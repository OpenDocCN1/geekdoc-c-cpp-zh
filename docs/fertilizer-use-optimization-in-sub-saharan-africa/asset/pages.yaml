    # 6.8 Adjusting fertilizer rates for other practices and soil test information


    Fertilizer use decisions need to consider the effects of other practices that
    supply soil nutrients as well as soil test information (Table 6.3). Manure application
    to a field calls for adjustment in the fertilizer rate applied according to the
    fertilizer substitution value of the manure, which varies with the quality of
    manure. Manure of confined poultry, dairy, sheep and goats manure has greater
    fertilizer substitution value than farmyard manure.'
