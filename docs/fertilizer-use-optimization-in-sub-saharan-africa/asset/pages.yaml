    The EOR determined from field research results were more than 20% less or more
    than the REC for 61 and 27%, respectively, of 33 comparisons (Table 8.4a,b,c).
    This implies that farmers, overall, who apply fertilizer at the REC are losing
    profit potential due to over-application. One exception is for N applied to upland
    and lowland, including irrigated, rice where the EOR and REC were generally similar.
    However, farmers who are financially constrained in fertilizer use need to benefit
    from the typical curvilinear to plateau response of crops to applied nutrients
    and generally apply at less than EOR where yield gain for kg/ha of applied nutrient
    is high.


    # 8.7 Conclusion


    Fertilizer use profitability can be improved for all AEZ of Mali. Recommended
    rates for farmers who are not financially constrained in fertilizer use need to
    be adjusted to reflect EOR. Farmers who are financially constrained in fertilizer
    use need to have the capacity to choose the crop-nutrient-rate options that are
    most likely to maximize returns on their investment. Computer


    run and paper-based fertilizer optimization tools have been developed to enable
    determination of current EOR, depending on fertilizer costs and commodity values,
    and to determine the combination of crop-nutrient-rates for maximizing returns
    on investment. The fertilizer rate adjustment in an ISFM framework is important
    to optimizing fertilizer use to give credit to alternative nutrient supply practices,
    to apply additional fertilizer when justified (such as for intercropping) and
    to consider soil test values. If farmer profitability is the objective of fertilizer
    use optimization, it is essential that farmers have an adequate choice of single
    nutrient or two-nutrient compound fertilizers.


