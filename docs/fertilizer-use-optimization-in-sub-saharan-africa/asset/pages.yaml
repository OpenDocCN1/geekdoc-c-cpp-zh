  img_proc: true
- pgno: 34
  md: 'The right fertilizer. The right fertilizer source or type means matching the
    fertilizer to the crop''s need for applied nutrients. Therefore, the fertilizer
    needs to supply one or more nutrients which are inadequately available in the
    soil to meet crop needs. Fertilizer formulations differ in cost per nutrient supplied
    with added complexity and processing adding to cost. The effect of the fertilizer
    type on the soil needs to be considered. For example, some fertilizers have a
    greater soil acidifying effect than others which is a consideration for soils
    with near problematic low soil pH. However, economics needs to be considered.
    While nitrate, unlike urea and ammonium, in fertilizer does not contribute to
    soil acidity, nitrate production requires more fossil fuel consumption and production
    costs. The more economical approach may be to use a less expensive source of N
    with an acidification effect and to manage soil acidification with lime application
    as compared to using a more costly N source of less acidifying effect.


    The right rate. The rate of fertilizer nutrient application is overall the most
    important of the 4Rs for profitability and environmental consequences. Fertilizer
    N rates are especially of concern in good nutrient stewardship as much N is applied
    but it is a nutrient that is at risk of loss due to leaching, volatilization,
    denitrification, runoff and nitrous oxide emission. Excessive N application contributes
    unnecessarily to soil acidification, and the acidification effect is greater for
    N lost to leaching compared with that recovered by the crop. The rate of application
    should not normally exceed the economically optimal rate (EOR), that is, the rate
    expected to maximize net returns to fertilizer use per hectare. Often the rate
    should be less than EOR. Smallholders who are financially constrained in fertilizer
    use are expected to get better returns on their constrained fertilizer use by
    applying at a rate where the yield increase per kg/ha of applied nutrient is relatively
    great compared to the increase near EOR. An environmental concern, such as risk
    of nitrate leaching to groundwater, may result in a regulation for applying N
    at some rate less than EOR. In reality, EOR varies greatly by field and year and
    is not well predicted. Essential to approximating EOR are representative crop
    nutrient responses functions such as have been determined by OFRA for food crops
    in 67 AEZ (see Chapter 1). Estimation of


    EOR can be improved by considering soil test information, rotation effects, organic
    resource application and other practices as addressed in this chapter and in Chapters
    4-16. Some low productivity soils require amendment such as with lime or organic
    resources to have good crop response to fertilizer (Figures 3.3 and 3.4). Biotic
    constraints, such as severe Striga infestation, may reduce the potential of crop
    response to applied fertilizer. Due to low predictability of N EOR in a given
    season, in-season N application with adjustment of rates according to canopy colour
    has gained practice globally.


    ![](img/279f2242dca113ddfb6220d3a162ffff_34_0.png)


    Fertilizer micro-dosing is point application of fertilizer nutrients at low rates
    at planting, post


    ![](img/279f2242dca113ddfb6220d3a162ffff_34_1.png)'
