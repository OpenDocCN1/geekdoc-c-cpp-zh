    # 5.7 Conclusion


    Nutrient management is very critical to maximize crop yield and to sustain soil
    productivity. Poor farmers need to achieve high net returns on their investment
    with little risk while wealthier farmers may strive to maximize profit per hectare.
    Profit potential from fertilizer use varies greatly with crop-nutrient choices.
    The profit potential is generally much greater with application of N and P compared
    with K and the secondary and micro nutrients. Consistent with findings elsewhere
    worldwide, farmers need adequate access to single nutrient and di-nutrient compound
    fertilizers to maximize profit. Evidence-based FOTs were developed for optimization
    of fertilizer use by Ethiopian farmers of any economic class. The EOR determined
    from the results of field research often differed from RECs.


