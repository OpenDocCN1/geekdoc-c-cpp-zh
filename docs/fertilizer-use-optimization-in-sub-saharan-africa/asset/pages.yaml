  md: 'and groundnut. The research was conducted on the major agricultural soil types
    of the three AEZ described above for determination of crop nutrient response functions
    for N, P and K.


    Data were analyzed to determine curvilinear to plateau responses as represented
    by maize response to N in the South Sudan Savanna (Figure 4.3). The response curve
    is represented by the equation Y = a - bc^x where Y = yield, a and b = maximum
    yield (yield at plateau) and maximum yield increase achievable, respectively,


    with application of this nutrient; c, together with exponent r (nutrient rate),
    determine the shape of the curve.


    Maize yield was near the plateau with 90 kg/ha N applied but most of the yield
    gain was with 40 kg/ha N applied after which the rate of yield increase with more
    N diminished. Once the maize N response curve for yield has been determined for
    an AEZ, it is possible to determine net financial returns to N application at
    any rate, depending on fertilizer N cost and the value of maize grain, and to
    determine the N rate for maximizing profit per hectare from fertilizer application.


    Most smallholders in Burkina Faso are financially constrained farmers who need
    to achieve high profit from fertilizer use. Some nutrients applied to some crops
    have much more profit potential than for other nutrients applied to the same or
    other crops (Figure 4.4). The amount of money invested in one nutrient applied
    to one crop is shown on the x-axis, that is, on the horizontal axis. The y-axis
    shows net returns to investment in one nutrient applied to one crop as the rate
    of nutrient application changes. Each curve represents the profit potential of
    one nutrient applied to one crop.


