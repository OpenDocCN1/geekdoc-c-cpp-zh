  md: '# 12.3 Traditional practices affecting soil fertility


    As in most parts of tropical Africa, the traditional method of maintaining soil
    fertility and productivity in Nigeria has been the bush-fallow system whereby
    arable land is allowed to revert to fallow after 3–4 years of continuous cultivation.
    The growing human population and other socio-economic pressures on available land
    have made this practice difficult to sustain. Attempts to improve soil fertility
    by planting legumes and grass fallows have not been popular and are inadequate
    for higher-yielding and nutrient-demanding crops and production systems.


    The use of manures, particularly where there were large numbers of animals, replaced
    the fallow system and brought into eminence the agricultural value of FYM, poultry
    droppings, household refuse and other organic materials. The first recorded indication
    of the potential values of inorganic fertilizers in Nigeria was in 1937 when it
    was shown that response of cereal crops to small applications of FYM was matched
    by the use of single super-phosphate (SSP) containing equivalent quantities of
    phosphate. The need to apply fertilizer to depleted soils to resuscitate plant
    productivity heralded fertilizer use experimentation on the response of crops
    to applied nutrients such as N, P and K.


    The recognition of the benefits of FYM by the late 1940s led to government encouragement
    of penning of cattle on the farm and mixed crop–livestock farming. The supply
    of FYM was not sufficient to meet farmers’ demand as agriculture intensified,
    coupled with the introduction of higher-yielding and more nutrient-demanding crops.
    Other issues militating against the effective use of FYM included transportation
    problems due to bulk and labour costs.


    Other practices that affect soil fertility such as crop rotation, green manuring,
    direct application of phosphate rock and agro-forestry have been promoted by agricultural
    extension personnel but the uptake and adoption of such practices has been too
    low to have much impact on production. It is recognized that fertilizer use needs
    to complement other management practices.


    Effective fertilizer use requires good crop management. For example, unimproved
    local


    crop varieties of low-yield potential are less responsive to the use of fertilizer
    compared with improved varieties. Similarly, arrangement of plants and plant population
    affect yields. The farmer who carelessly plants last using unimproved crop varieties
    should not expect much benefit from the use of fertilizers, particularly if these
    are incorrectly applied.


    Use of the wrong fertilizers, rates, placement and timing lead to inefficient
    fertilizer use and problems have developed. For example, the continuous application
    of sulphate of ammonium resulted in soil acidification and its use was stopped
    in 1969. There is the need for more education of farmers on manure management
    and use, and proper fertilizer use, including the 4Rs of fertilizer use, that
    is, applying the right fertilizer types at the right rate and time with the right
    placement.


    # 12.4 Fertilizer use and recommendations


    Widespread adoption of fertilizer began in the late 1970s with the proliferation
    of Agricultural Development Projects, but overall levels of fertilizer use have
    been too low to compensate for soil nutrient removal. The current national average
    NPK use hovers at 18 kg/ha of arable land (World Bank 2016).


    The current fertilizer recommendations in Nigeria are reported in a manual titled
    ‘Fertilizer Use and Management Practices for Crops in Nigeria’, compiled by the
    National Fertilizer Use Committee and produced by the Federal Ministry of Agriculture
    and Rural Development (2011).


    Fertilizer recommendations for sole crops emanate almost exclusively from extensive
    laboratory and/or field trials over time and space. Such trials result in average
    recommendations for a crop within an area that normally have the approval of extension
    agencies. Where an approved fertilizer practice is considered inadequate or where
    no formal recommendation is available, the Fertilizer Use Committee suggests practices
    on the basis of existing information, including individual or common knowledge
    and experience. Current recommendations are largely ‘blanket’ or ‘generic’ in
    nature; its perils and the need for site-specific recommendations have been elucidated
    in a study on nutrient rationalization'
