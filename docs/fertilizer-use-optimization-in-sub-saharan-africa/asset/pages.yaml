    # Temperature Seasonality (ts; range = 62 to 8,933):


    Temperature Seasonality similarity equals the selected ts value + 1000.


    # SOC (g/kg; 5-15 cm; range = 0 to 249):


    If the selected SOC value is <35, then similarity


