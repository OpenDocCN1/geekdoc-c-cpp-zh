  img_proc: true
- pgno: 69
  md: '# 6.3 Current fertilizer use


    Cost-effective soil fertility management and increased agricultural productivity
    goes with good soil information and fertilizer recommendations that are current
    and specific for crops and agro-ecologies. This has been inadequate in Ghana.
    Fertilizer recommendations were made for maize, rice, cassava, cotton and groundnut.
    The fertilizer recommendation for maize was updated in 1974 and since then only
    sporadic and inconclusive attempts have been made to update these recommendations.


    For example, from 2002 to 2005, an attempt was made under the Ghana Soil Fertility
    Management Action Plan to update the fertilizer recommendation for maize but no
    specific recommendations have been made for the different agro-ecologies. The
    old and blanket fertilizer recommendation is two bags of blended fertilizer and
    one bag of sulphate of ammonia per acre for maize, irrespective of the AEZ.


    Currently there is no effective soil test service for farmers and as a result
    fertilizer application is not based on soil test information. Soil conditions
    have changed over the years and the old recommendations are not the most efficient
    today. There is need to update fertilizer recommendations for maize and other
    crops in Ghana and provide soil analysis service to farmers.


    In 2008, the government re-introduced fertilizer subsidies through a voucher-based
    system to promote fertilizer use and improve crop productivity of smallholder
    farmers. The vouchers were worth 50% of the price of staple fertilizer on selected
    fertilizers for use on staple food crops (urea, 15-15-15 NPK, 23-10-5 NPK and
    sulphate of ammonia). The subsidy on fertilizer has, however, declined over the
    years from 50% in 2008 to 20% in 2015 as a way of equalizing fertilizer price
    in Ghana and the neighboring countries to discourage smuggling of subsidized fertilizer.
    Farmers were encouraged to use the fertilizers on mainly the key food crops –
    maize, rice, millet and sorghum. The total cost of the subsidy was valued at GH¢
    20.7 million and GH¢ 80 million in 2008 and 2015, respectively.


    The performance of the subsidy programme has so far been commendable. It is estimated


    that yields of major food crops have increased by 4% in targeted areas. Fertilizer
    use has also increased thereby stimulating fertilizer supplies in the country.
    For example, fertilizer imports in 2009 were estimated at about 223,000 t/yr compared
    with 113,000 and 150,000 t/yr in 2007 and 2008, respectively. This is expected
    to grow in the coming years.


    Over the period of the implementation of the fertilizer subsidy programme from
    2008 to 2013, a total of 737,248 metric tons of fertilizer was subsidized at a
    total cost of GH¢ 341,239,000 (US$ 183,334,000). After successfully implementing
    the fertilizer subsidy, seeds of maize, rice and soybean were added to the programme
    in 2012. After four years of implementation the fertilizer application rate has
    increased from 8 to 10 kg per hectare. This has led to increased productivity
    of the country’s major staple food crops. The target is to increase application
    rate to at least 50 kg per hectare as recommended in the Medium Term Agricultural
    Sector Investment Programme (METASIP), the policy document of the Ministry of
    Food and Agriculture.


    The Ministry of Food and Agriculture implemented targeted measures in the 2013
    subsidy programme to ensure maximum reach to resource poor farmers and greater
    efficiency of distribution and value for money. Instead of universal fertilizer
    subsidy, the 2013 subsidy programme targeted smallholder farmers cultivating maize,
    rice, sorghum and millet with priority on food crop farmers in the savanna area
    of the country, out-grower farmers registered under recognized nucleus farmers/companies,
    food crop farmers, either on their own or as members of an out-grower scheme,
    and women farmers. The package for a hectare of land was four bags (50 kg each)
    of compound fertilizer (NPK-15-15-15 or 23-10-5) and two bags of sulphate of ammonia
    or urea.


    # 6.4 Fertilizer use integrated with other practices


    Integrated soil fertility management (ISFM) is the approach advocated by the Alliance
    for a Green Revolution in Africa (AGRA) to improve the soil fertility status of
    African soils. ISFM is the application of soil fertility management practices,
    and the knowledge to adapt these to local'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'conditions, which optimize fertilizer and organic resource use efficiency and
    crop productivity. ISFM practices include appropriate fertilizer and organic input
    management in combination with the utilization of improved crop varieties.


    Substantial knowledge on soil management practices and technologies has been accumulated
    over the last 20 years, enabling the project to adequately address the intensification
    of maize-legume rotation and intercropping systems among small-scale Ghanaian
    farmers in a sustainable and environmentally beneficial manner. For example, ISFM
    in maize-cowpea rotation/intercropping is a proven success in northern Ghana with
    strong synergies between the cereal and legume phases.


    Soil fertility management relies upon retention of legume residues, judicious
    application of mineral fertilizer, targeting fertilizer to specific phases of
    the rotation/intercrop (e.g. P fertilizer to the cowpea phase and N fertilizer
    to the maize phase).


    Soybean cultivation has also caught on fairly well in Ghana and significant rotation
    effect has been demonstrated where soybean residues were returned to the soil.


    In general farmers are aware of the beneficial effects of maize-legume rotation
    but in most cases, farmers tend to keep cereals or maize for the best soils under
    continuous cropping as maize is the major staple. Farmers have not developed the
    confidence of routine rotation with reliance on legumes as cash crop to purchase
    the cereals that they need in the years they will keep a legume crop in place
    of a cereal. Intercropping has always been the closest compromise.


    The main limitation to the widespread adoption of maize-legume rotation/intercropping
    systems is lack of financial and physical access to fertilizer and availability
    of high-yielding legume varieties that are also well adapted to intercrop conditions.
    Under the Challenge Program on Water and Food (CPWF), the Savanna Agricultural
    Research Institute (SARI) developed a number of cowpea varieties that are high
    yielding under intercrop conditions.


    There are inefficiencies and bottlenecks in the fertilizer distribution network
    which limit access


    and add to the cost of fertilizer in the farming communities. Farmer-based organizations
    (FBO) are few and weak and therefore unable to acquire credit, fertilizer and
    other inputs in bulk to reduce cost. SARI, the Ministry of Food and Agriculture
    (MoFA) and NGOs have promoted the formation of FBOs, but these need to be strengthened
    and trained. Agro-dealerships are rudimentary in Ghana and lack the skills to
    support a vibrant agricultural growth.


    # 6.5 Diagnosis of nutrient deficiencies in Ghana


    In 2015, five trials were conducted on maize, cowpea, sorghum and groundnut in
    two agro-ecological zones in Ghana to compare the effect of micronutrients on
    yields. The diagnostic treatment (N+P+K+Mg+S+Zn+B) was compared with the treatment
    of the same N+P+K rate to determine if one or more of the secondary or micro nutrients
    resulted in increased yield. The initial results obtained from the Navrongo location
    showed an inconsistent but mean increase of 4.8% in maize yield due to the diagnostic
    package of nutrients. More diagnostic research is needed to verify this increase,
    to better determine the conditions under which a response is likely to occur,
    and to better determine which of the four secondary and micro nutrients are most
    deficient.


    # 6.6 Optimizing fertilizer use in Ghana


    Fertilizer use in Ghana is low and the recommended rates are usually blanket and
    outmoded. Even when fertilizers are subsidized they are still expensive to the
    smallholder farmer.


    The typical crop response to applied nutrient is curvilinear to plateau. Such
    a yield response (vertical axis or y-axis) of maize to applied N (horizontal axis
    or x-axis) is displayed in Figure


    ![](img/279f2242dca113ddfb6220d3a162ffff_70_0.png)


    Figure 6.2: Response of maize to N application in South Sudan Savanna of Ghana.'
