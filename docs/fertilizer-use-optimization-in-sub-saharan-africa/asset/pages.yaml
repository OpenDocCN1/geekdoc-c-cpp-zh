    Another aspect of optimizing fertilizer use is to account for the effects of other
    soil management practices and to consider soil test values. Organic inputs available
    at the farm level are generally inadequate to supply all the nutrients required,
    however, when used in combination


    with inorganic fertilizers, within the integrated soil fertility management (ISFM)
    framework, they improve crop productivity and profitability. Some of these materials
    include farmyard manure and composts, fresh vegetative materials such as tithonia
    and grevillea prunings, as well as green manures such as mucuna and Azolla.


    Table 7.4 is a guideline to giving fertilizer substitution values to some common
    practices. For example, if the farmer applies 1 ton (dry weight) of low quality
    farmyard manure, this will substitute for about 5 kg urea, 3 kg DAP or TSP, and
    2 kg KCl, or 10 kg NPK fertilizer during planting. On the other hand, if the previous
    crop was a green manure crop such as mucuna for maize and Azolla for lowland rice,
    then organic inputs substitute up to 100% of N and 70% of the P, K and NPK required
