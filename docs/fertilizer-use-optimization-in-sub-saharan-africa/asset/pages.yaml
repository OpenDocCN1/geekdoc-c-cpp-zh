    # 5.2 Soil fertility management


    Ethiopia’s diverse surface landforms and AEZ are associated with much diversity
    of indigenous knowledge and practices. Farmers in Ethiopia can characterize their
    local soil types and recognize differences in land used and crop suitability.
    Farmers distinguish soil fertility in terms of capacity of soils for long-term
    productivity, permeability, water holding capacity, drainage, tillage, manure
    requirement, cultivability, as well as crop productivity.


    Farmers are aware and concerned of soil erosion and indigenous soil erosion control
    practices include traditional ditches locally called ‘feses’, waterways ‘boi’,
    stone terraces ‘yedengay erken’, cutoff drains ‘tekebkeb’, vegetative barriers
    ‘geta’ and contour ploughing ‘shurube’ and ‘shaga’.


    Many are aware that fertilizer use alone is not a solution to soil productivity
    problems. Traditionally, Ethiopian farmers used manure, crop rotation, mixed cropping,
    relay cropping and fallows for soil fertility maintenance.


    Unfortunately, not all traditional practices are favourable to sustainable soil
    productivity. Erosion is a major cause of land degradation. The practice of transhumance
    is common with movement of livestock to semi-arid and arid grazing areas during
    the growing season but their return to crop production areas after harvest. Farmers
    have no control on cattle grazing of crop residues, thus leaving soil denuded
    with little organic material return and pulverized to dust by livestock traffic.
    As a result, soil physical properties are degraded and multiple tillage operations
    are conducted to overcome soil crusting as well as for weed control. The combined
    effect of destruction of soil aggregation, bare soil, soil crusting and tillage
    contribute to rainfall runoff and erosion.


    Fertilizer use has increased from 250,000 t/yr in 1995 to 850,000 t/yr in 2014
    according to unpublished estimates by the Ministry of Agriculture and Rural Development.
    Many smallholders have financial constraints to fertilizer use and are concerned
    about risk of lack of fertilizer response and/or difficulty in repaying loans.
    Between 30 and 40% of smallholders use some fertilizer, mostly for teff, wheat
    and maize production. Cereal production'
