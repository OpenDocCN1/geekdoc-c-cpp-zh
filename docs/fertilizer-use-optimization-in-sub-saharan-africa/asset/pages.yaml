  md: '# 16. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Zambia


    Brian Gondwe gkasemuka@gmail.com and Davy Nkonde

    Zambia Agricultural Research Institute (ZARI), Mt Makulu Research Station, Lusaka


    # 16.1 Introduction


    Fertilizer use is an important part of soil fertility management and for substantially
    increased levels of crop production but it has to be adequately profitable to
    the farmer to justify the investment. High rates of return are especially important
    to use. farmers with little money available for fertilizer use.


    The Zambia Agricultural Research Institute partnered with national agricultural
    research organizations of 12 other countries to improve the field-research-derived
    information base needed for optimizing fertilizer use for high profitability to
    farmers.


    This chapter provides background information of agricultural systems and current
    soil fertility management practices in the three regions of Zambia. It provides
    a conceptual basis for optimization of fertilizer use and introduces


    decision tools to aid farmers and their advisors in determining the fertilizer
    use options expected to be most profitable to farmers. The nutrient application
    rates expected to maximize net returns per hectare to fertilizer use are compared
    to current recommendations with the latter typically higher than the economically
    optimum rates.


    # 16.2 Agricultural systems of Zambia


    Zambia is divided into three agro-ecological regions based on rainfall (Figure
    16.1) (http://en.climate-data.org). Region I is characterized by mean annual rainfall
    of less than 800 mm and is dominated by slightly acid to alkaline Luvisols (Table
    16.1). Region II has mean annual rainfall ranging from 800–1000 mm. Region III
    has mean annual rainfall of above 1000 mm and comprises half of the land area
    of Zambia.


    ![](img/279f2242dca113ddfb6220d3a162ffff_209_0.png)


    Figure 16.1: Agro-ecological regions of Zambia.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Zambia has the November to April rainy season, the cool dry season of May to
    August and the hot dry season of August to November. The annual rainfall decreases
    from an average of 1000 mm in the northern part of the country to an average of
    800 mm in the southern part. The annual temperature ranges between 18°C to 20°C.
    The highest annual average temperature is 32°C and the lowest temperature average
    is 4°C.


    Region I is the low rainfall region of Zambia (Table 16.1). It covers major valleys
    of Gwembe, Lunsemfwa and Luangwa in the south and south-eastern margin of the
    country, and is about 23% of Zambia''s total land area. Mean annual rainfall is
    less than 800 mm, erratic and often of high intensity. Long dry spells during
    the rainy season limit crop and livestock production. The length of the cropping
    season ranges between 60-90 days. The dominant soils in the valley areas are slightly
    acid to alkaline and generally have higher levels of fertility than soils of plateau
    areas. Soil acidity is a dominant constraint to crop production.


    Region II is commonly classified as the medium rainfall region of Zambia (Table
    16.1). It forms a central band stretching from western to eastern


    Zambia. The region is characterized by a mean annual rainfall of between 800 to
    1000 mm and has a cropping season of 90-150 days. The dominant soils are sandy,
    acidic and have low nutrient reserves and poor water retention capacity. These
    soils are prone to leaching of nutrients after heavy rainfall and to water stress
    during dry spells because of their limited ability to retain nutrients and water.
    Region II is divided into sub-regions IIa and IIb. The combination of moderately
    fertile soil with medium rainfall and a moderately long growing season makes sub-region
    IIa the most productive region of the country for most arable crops particularly
    maize, wheat, soybean, groundnut and tobacco. Sub-region IIb comprises the Kalahari
    sand plateau and Zambezi flood plains in Western Province and other parts of Region
    II not covered by Kalahari sands. The area of Region II is approximately 27.4
    million hectares. The dominant soils include sandveld soils which are moderately
    leached, medium to strongly acid with sandy top soils overlying loamy subsoil.
    They also include some moderately weathered, moderate to slightly acidic to strong
    brown soils derived from limestone. In low lying areas or flood plains, there
    may be slightly acidic to neutral heavy dark cracking clays.


