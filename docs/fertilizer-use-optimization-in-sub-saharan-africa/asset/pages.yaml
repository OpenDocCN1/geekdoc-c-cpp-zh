    In the South Sudan Savanna, maize, sorghum and rice had large responses to applied
    N and P and rice responded well to just 1 kg/ha Zn (Table 12.5b). Response of
    cowpea, groundnut and pearl millet were less but generally economical for all
    nutrients. The EOR were on average less than half REC although the EOR for sorghum
    P and the maize Zn EOR was more than recommended. Zinc EORs were determined for
    groundnut, sorghum and soybean but RECs are not available.


    In the Northern Guinea Savanna, all cereals and soybean had a large yield increase
    with just 30 kg/ha N applied but EOR were generally greater (Table 12.5c). Most
    crops responded well to 5 kg/ha or more of P applied. Responses to K were small
    but often economical at low rates. Soybean and maize yield increased with 1 kg/
    ha Zn applied. The EOR were mostly less than half REC but the differential was
    less compared with the Sahel. The REC and EOR were similar for upland rice P.


    Cereal yield increase with N application in the Southern Guinea Savanna varied
    from 0.34 t/ha for sorghum to 1.7 t/ha for maize (Table 12.5d). With respect to
    P, yield increases varied from zero for lowland rice to 0.8 t/ha for sorghum.
    Yield increases with K application varied from 0.1 t/ha for lowland rice to 0.8
    t/ha for upland rice. The EOR for maize N and sorghum P were similar to REC. The
    EOR for cowpea P was more than REC. All other EOR were less, and mostly less than
    half, of REC.


    Cereal and cassava yield increases with applied N were large in the Mid-altitude
    AEZ (Table 12.5e). The legumes and upland rice responded well to P and cassava
    and upland rice responded well to K. Maize had an economic response to 1 kg/ha
    of Zn. All field research derived EOR were less than REC except for Zn applied
    to maize.


    In the Derived Savanna, cereals responded well to N and P with the exception of
    lowland rice response to P (Table 12.5f). Rice responded well to K. Maize, sorghum,
    groundnut and soybean'
