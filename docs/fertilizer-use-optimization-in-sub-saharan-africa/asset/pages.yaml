    # 3.3.2 Organic resources complemented with fertilizer application


    Chivenge et al., (2011) compiled and analysed the results of 52 research studies
    conducted in SSA to evaluate the effects on maize yield of combined application
    of organic resources and fertilizer N compared with using either alone.


    The effect of 25 years of continuous cropping was determined in Central Kenya
    where the initial soil organic C was 2%. Soil organic C declined with all soil
    management practices. The soil organic C decline was 37% for a combination of
    fertilizer N and P and 10 t/yr of farmyard manure applied plus retention of crop
    residues in the field, but 54% with another treatment (Kibunja et al., 2012).


