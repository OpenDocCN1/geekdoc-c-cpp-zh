    Figure 14.2: Agro-ecological Zones of Tanzania. Source: http://www.kilimo.go.tz/agricultural%20maps/Tanzania%20Soil%20Maps/Webbased%20Districts%20Agricultural%20maps/Districts%20AEZs/Tanzania%20Agro-ecological%20zones.htm


    further divided into 63 agro-ecological zones (AEZ) which are natural physical
    regions with similar climate, physiology and soil (De Pauw 1984) (Figure 14.2;
    Table 14.1). Tanzania has four main climatic zones. The coast and immediate lowland
    is tropical with mean temperatures near 27°C, rainfall varying from 1000 to 1930
    mm and high humidity, and covers much of Eastern and Southern Zones. Locations
    that represent parts of this climate zone include Bagamoyo, Mtwara and Kilosa
    (Table 14.2). Kilosa and Bagamoyo have bimodal rainfall pattern with long (March
    to June) and short (October to December) rain seasons (De Pauw 1984). Mtwara has
    mono-modal rainfall from November to May.


    The climatic zone of the central plateau, represented by Dodoma, is hot and dry
    with mono-modal December to April rainfall of 500 to 760 mm, and with considerable
    daily and seasonal temperature variation (Table 14.2). The semi temperate highland
    climate zone covers Southern Highland and Northern Zones and is represented by
    Selian, Arusha and Mbeya with mono-modal rainfall of December to April. The climatic
    zone of the high, moist lake regions cover Lake Zone and Western Zone near Lake
    Tanganyika in Kigoma. There are two rainy seasons of November to December and
    March through May in the northern Lake Zone, e.g. Tarime, and Western Zone. The
    uni-modal rainfall of southern Lake Zone is from November to March as in Tabora
    and Ukiriguru.'
