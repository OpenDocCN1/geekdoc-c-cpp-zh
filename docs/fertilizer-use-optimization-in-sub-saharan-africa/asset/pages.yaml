    were addressed for four AEZ and finger millet and Irish potato for three AEZ.
    Upland rice, wheat, sorghum and high potential banana were addressed for two AEZ
    and low


    All non-legumes and bean responded well to applied N. More than 50% of the yield
    response to N occurred with 30 kg/ha N applied except for Irish potato which had
    a relatively more linear response. All targeted crops had an economic response
    to P. Soybean, groundnut and banana responded to K, but the cereals did not have
    economic responses to K. Data availability for Irish potato response to K was
