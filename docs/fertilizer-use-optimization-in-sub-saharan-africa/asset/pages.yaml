  md: '# 4.5.2 Paper versions of the FOT


    Very often smallholder farmers and their advisors do not have access to a computer.
    Therefore, a paper version of the Excel FOT was developed for each AEZ (Table
    4.2). The farmer''s financial ability for fertilizer use is accounted for in three
    levels where the budget constraint is not more than one-third or two-thirds the
    amount required to apply fertilizer at EOR (the rate to maximize profit per ha)
    to all cropland for financial level 1 and 2, respectively. With level 3, the farmer
    can apply at EOR to at least some of the cropland.


    The paper tool makes several assumptions as listed in Table 4.2. The recommendations
    are given for each financial level and address the 4 Rs of fertilizer use, that
