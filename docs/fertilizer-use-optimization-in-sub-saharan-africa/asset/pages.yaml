- pgno: 92
  md: 'In the Eastern Lower (LM) zone, all crops except sorghum had responses to applied
    N with more of the yield gain from application of 30 kg/ha N and small increases
    with applications beyond 60 kg/ha (Table 7.2d). Higher responses to applied P
    were only found in beans and sorghum but the response was low beyond the 10 kg/
    ha rate. The results did not show any of the crops to be generally responsive
    to applied K, which agrees with the results of the diagnostic treatments (section
    7.3). The EOR compared with REC were low for N applied to maize. The EOR for N
    and P were determined for several crop that did not have EOR.


    The Western Upper (LM and UM) zone had high responses to N in all crops with the
    highest yield gain occurring with 30 kg/ha N applied and lesser yield gains when
    more than 60 kg/ha was applied (Table 7.2e). Responses to 10 kg/ha of P occurred
    for all crops with the great yield responses for Irish potato and sweet potato.
    Only Irish potato and lowland rice benefited from added K (up to 10 kg/ha), but
    the other crops did not respond to K. The EOR compared with REC were high for
    N, P and K in the Western Upper Altitude zone. No RECs were available for lowland
    rice, climbing beans and wheat despite these crops having responses to nutrient
    addition.


    The Western Lower (LM) zone had high responses to applied N in all crops with
    more of the yield gains from application of 30 kg/ha N and small yield increments
    with applications beyond 60 kg/ha (Table 7.2f). Groundnuts did not respond to
    N application, while beans required applications of less than 30 kg/ha. All crops
    responded to applied P but response was small to P rates greater than 10 kg/ha.
    High responses at 15 kg/ha of K occurred in three crops, but yield gains were
    lower beyond 20 kg/ha. For Western Lower, the EOR compared with REC were high
    for N, P and K.


    In the Rift Valley Upper (UH, LH) zone, there were high responses to applied N
    in all the crops with the 30 kg/ha application having the highest yield gain but
    lower yield gains at applications beyond 60 kg/ha (Table 7.2g). All the crops
    responded to applied P but at modest rates of up to 10 kg/ha. No response to K
    occurred in all the crops. For Rift Valley Upper, the EOR compared with REC were
    low for N applied


    to maize but high for N applied to Irish potato, bean, wheat and green gram, and
    low for P applied to Irish potato but high for P applied to other crops.


    In the Rift Valley Lower (UM) zone, all crops except soybean and green gram had
    responses to applied N with more of the yield gain from application of 30 kg/ha
    and small yield increments with applications beyond 60 kg/ha (Table 7.2h). All
    crops responded to applied P but the response was small to rates above 10 kg/
    ha except for Irish potato that responded well up to 20 kg/ha of P. Responses
    to applied K only occurred in maize and maize-bean intercrops, with more yield
    gain from applications up to 10 kg/ha. The EOR rates were mainly less than the
    REC, but in most crops, EOR was determined in crops that had no RECs.


    The EOR determined from field research results varied inconsistently compared
    with REC (Table 7.2a-h). For 49 crop-nutrients across the eight recommendation
    domains, field-research-based EOR were determined where the REC was not available
    or was 0 kg/ha. In all regions, all non-legumes had an economic response to applied
    N and most of the yield gain was achieved with 30 kg/ha applied, and little additional
    gain with more than 60 kg/ha applied (Table 7.2a-h). Similarly, in all regions,
    all crops had an economic response to applied P with the exceptions of Irish potato
    in Eastern and low-potential maize in the Rift Valley Region. Responses to K occurred
    in less than one-third of the cases and most often with Irish potato, rice, groundnut
    and banana. Due to financial constraints, farmers can expect higher benefit to
    cost ratios when applying at less than EOR, particularly in the low-potential
    areas where fertilizer use is considered risky (Ariga and Jayne 2010). The results
    indicate good profitability with some fertilizer use on most crops.


    # 7.6 Fertilizer use optimization tools (FOT) for Kenya AEZ


    Optimization of profit from fertilizer use requires good choice of nutrient rates
    for each crop. Response to applied nutrients of different crops of interest, amount
    of land allocated to different crops, value of the produce, cost of fertilizer
    used and the money available for fertilizer use need to be considered in optimizing
    fertilizer use for high profit.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Considering these complex factors, fertilizer use optimization tools (FOTs)
    were developed using Excel Solver® (Frontline Systems Inc., Incline Village, NV,
    USA). The Solver function in the FOTs uses complex mathematics of linear optimization
    in the integration of the farmer’s economic and agronomic information with up
    to 28 crop-nutrient response functions to develop recommendations. The design
    makes the FOTs easy to use. The choice of crop-nutrient-rate combinations is expected,
    on average, to maximize returns on investment in fertilizer use.


    Eight FOTs were developed for recommendation domains in Kenya and are available
    at http:// agronomy.unl.edu/OFRA. To use a FOT, Solver needs to be added on in
    Excel and the macros need to be enabled; see the Help and Instructions worksheet
    of the FOT for instructions.


    Data input requires the farmer to estimate how much land will be planted to each
    crop of interest under ‘Area Planted, Ac’. Next, the on-farm value at harvest
    time per kg of the produce is determined, considering the value of that kept for
    home consumption and the value of marketed surplus, and entered under ‘Expected
    Grain Value’ (Figure 7.6). The cost of using different fertilizers, including
    purchase price and costs of transport and application, is entered under ‘Price/
    50 kg fertilizer’. The farmer’s available money for fertilizer use is also entered
    as the ‘Budget Constraint’.


    The results are given in three sections (Figure 7.7) including the amount of each
    fertilizer to apply to each crop, the expected average yield increases and net
    returns, and the expected average total net returns to fertilizer use for the
    farm.


    Differences in net returns to fertilizer use by crop are revealing. In this example,
    fertilizer use with Irish potato is estimated to have very high returns. The farmer
    should not increase the amount of fertilizer applied per acre above the recommended
    amount but should consider allocating more land to Irish potato production while
    decreasing land for another crop with low net returns, realizing that the return
    to fertilizer use is only one factor in the total profitability of a crop.


    A farmer investing KSh 50,000 in fertilizer for seven crops is expected to get
    an average total return on investment of about KSh 362,400. For a farmer with
    lower investment potential of KSh 10,000 with the same crops and land allocation,
    the expected average net returns decline to KSh 210,000. These are partial budget
    net returns to fertilizer investment, without considering other production costs.
    Due to seasonal variation in input output prices, access to current information
    on fertilizer prices and grain market prices are required to most accurately optimize
    fertilizer use recommendations for the current season.


    Paper versions of all FOTs were developed for county extension officers, agro-dealers
    and farmers without easy access to computers (Table 7.3; available at http://agronomy.unl.edu/
    OFRA). These are easy to use but need to be updated, maybe annually, with major
    changes in fertilizer costs relative to commodity prices.


    Paper FOTs are developed with the farmer’s ability for fertilizer use divided
    into three financial levels: level 1) for a poor farmer who has no more than one-third
    the amount of money required to apply fertilizer to all cropland at EOR; level
    2) for a farmer with more money but with no more than two-thirds the amount required
    to apply fertilizers to all cropland at EOR; and level 3) for the farmer with
    enough money to apply fertilizer to at least some cropland at EOR.


    The paper FOTs advise on the 4Rs, i.e. right product, rate, time and method of
    application. Mode of calibration is also given for guiding the farmer to calibrate
    his/her sense of feel and visual impression of the correct rate, e.g. the length
    of the band or the number of holes per measuring unit. The paper FOTs assume that
    the farmer will use the Keringet brand water bottle lid which has a volume of
    4 ml, or for broadcast application, a Keringet or Aqua brand water bottle cut
    at 4 cm high from the bottom which has a volume of 78 ml. These measuring units
    were selected because of easy availability in rural areas.


    Consider the use of the paper FOT (Table 7.3). If the farmer has only a small
    amount of money for fertilizer use, he/she is likely to be in financial level
    1. This level uses recommendations for five of the seven crops as the profit potential
    for'
