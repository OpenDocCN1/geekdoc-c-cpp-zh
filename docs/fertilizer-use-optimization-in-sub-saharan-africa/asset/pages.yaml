  md: 'One option in level 1 is ''For Irish potato, at planting band 60 kg DAP (1
    lid for 0.4 m) and 20 kg MOP (1 lid for 1.0 m)''. Therefore, DAP and MOP fertilizers
    are to be applied to Irish potato at planting in a band passing near the row.
