  md: 'for higher returns per unit of investment but the same fertilizer value can
    be applied over more land and to more crops as compared to applying at higher
    rates.


    Another important aspect of achieving high profit from fertilizer use for financially
    constrained farmers is the unique specificity of crop response to a particular
    applied nutrient. This is due to the magnitude and shape of the crop response
    to a nutrient, but also the value of the produce (revenue) and fertilizer use
    costs (costs). In Figure 15.6, the amount of money invested in one nutrient applied
    to one crop is on the x-axis and the y-axis shows net returns to investment in
    nutrient application. Each curve represents the profit potential of a nutrient
    applied to a crop. Net returns to investment are very high if the slope of the
    curve is steep. With increased rates of application, the slope decreases, but
    profit is increasing if the curve continues upward. The peak of the curve is the
    point of maximum profit per hectare, referred to in this chapter as the economic
    optimum rate (EOR). When slopes decline, profit is declining. The financially
    constrained farmer can maximize profit potential by taking advantage of the crop-nutrient
    combinations that will give the highest benefit to cost ratio for the limited
    investment in fertilizer use.


    Upland rice response to N has the greatest profit potential, partly due to the
    high value of the grain. Also very profitable are: P applied to groundnut and
    a low rate of N applied to bean. The fourth most profitable crop response to specified
    nutrient is N applied to finger millet. Several other less profitable options
    have lower lying curves. When a farmer’s ability to use fertilizer is finance
    constrained, it is important to take advantage of the crop-nutrient-rates that
    have the most profit potential given the farmer’s cropping system and financial
    context. The farmer who can apply fertilizer to all cropland at EOR is less concerned
    about crop-nutrient choices, but about their EOR.


    Decisions of crop-nutrient-rate choices for maximizing a farmer’s profit potential
    is very complex as the nature of the crop-nutrient responses needs to be considered
    as well as the farmer’s land allocation to different crops, the produce value,
    the costs of fertilizer use and the money available for fertilizer use. Therefore,
    easy to use fertilizer use optimization tools (FOTs) were developed which use
    linear programming to consider reiteratively the economic and agronomic information
    using Excel Solver® (Frontline Systems Inc.). The FOTs are available at http://agronomy.unl.edu/OFRA.


    ![](img/279f2242dca113ddfb6220d3a162ffff_199_0.png)


    Figure 15.6: Net returns on investment depend on choice of crop-nutrient-rate
    combinations for eastern Uganda – Lake Kyoga Basin.'
