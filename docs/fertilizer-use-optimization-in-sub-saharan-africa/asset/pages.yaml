    Finger millet and low potential (LP < 3 t/ha grain yield expected) maize have
    similar magnitudes and shapes of response although maize has the higher yield
    potential. In all cases, there is a relatively steep yield increase with increasing
    N rate at low N rates and a reduced rate of yield increase at higher rates until
    yield reaches a plateau with no more yield increase. Therefore, the benefit to
    cost ratio of fertilizer use is expected to be greater at relatively low application
    rates.


    increases until a plateau (Fig. 7.4). Exceptions do occur as when the response
    is linear or when crop yield declines at high application rates. However, over
