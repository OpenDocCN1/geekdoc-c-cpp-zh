- pgno: 102
  md: 'A concern with fertilizer supply is the low availability to farmers of single
    nutrient and two-nutrient compound fertilizers, with the exception of urea and
    DAP; although the same are imported and used to create blends. Limiting the fertilizer
    choice and emphasis on blends is expected to add to fertilizer cost and reduce
    the farmers'' profit potential.


    There has been some commercialization of organic resources. Companies such as
    Profeba, Orgafert and Elephant Vert produce municipal and industrial compost but
    the supply is small relative to farmer demand.


    The combined use of fertilizer, organic resources and soil and water conservation
    techniques (Mason et al., 2014) are needed to restore and improve soil fertility
    (AGRA 2013). Examples of GAP integration include use of manure, micro-dose fertilizer
    application, improved sorghum and maize varieties, the basin tillage practice
    of zai and reducing runoff and erosion with stone barriers or earthen bunds. Micro-dose
    fertilizer use with improved cereal varieties is practised, often complemented
    by application of manure. Other encouraged GAP include mulching, crop rotation,
    managed fallow, simple and tied ridging and intercropping. In valleys, dams are
    sometimes used to store water for irrigation of rice and vegetable crops.


    # 8.3 Diagnosis of nutrient deficiencies in Mali


    Trials conducted in 2014-2015 included a diagnostic treatment to determine the
    importance of secondary and micronutrients to crop performance. This treatment
    contained Mg, S, Zn and B in addition to N, P and K and was compared with a treatment
    of the same N, P and K rates. The diagnostic treatment resulted in a mean yield
    increase of 39% for irrigated rice yield. However, there was not a consistent
    yield increase with other crops in the Sahel, North Sudan and South Sudan Savannas
    indicating that other biotic or abiotic factors are more constraining to yield
    than any of these secondary or micro-nutrients (Figure 8.2). Further investigation
    is needed to determine which of these nutrients are most important to irrigated
    rice production.


    # 8.4 Optimizing fertilizer use in Mali


    In spite of the government subsidy programme for fertilizer many poor farmers
    cannot afford


    fertilizer use or apply inconsistently at low levels. To overcome this pitfall,
    optimization of fertilizer use is aimed at maximizing farmer profit from fertilizer
    use. Determining the economics of fertilizer use requires crop nutrient response
    functions. Results of numerous studies from different AEZ were used to capture
    crop responses to applied nutrients with a curvilinear to plateau relationship
    of nutrient rate with yield. This response is represented mathematically as: Yield
    = a – bc^r, where a is near maximum yield for application of that nutrient, b
    is the gain in yield due to application of that nutrient, and c^r determines the
    shape of the curvilinear response where c is a curvature coefficient and ''r''
    is the nutrient rate. A response function has been established for each targeted
    crop-nutrient combination of three AEZ. Once such a response function has been
    determined, economics can be applied to estimate the profit potential for different
    nutrients applied to different crops.


    ![](img/279f2242dca113ddfb6220d3a162ffff_102_0.png)


    Figure 8.3: Crop responses to fertilizer P in the Sahel.


    The fertilizer P response curves of maize, sorghum and pearl millet in Figure
    8.3 illustrate how rate of application is important to profitability. With all
    curves, there is a higher rate of yield gain per kg/ha of P applied at lower compared
    with higher rates, especially for sorghum. Sorghum yield has a steep rate of increase
    as P is increased from 0 to 10 kg/ha and therefore potential for a relatively
    high rate of return on investment, a lesser rate for 10 to 20 kg/ha, eventually
    reaching a point of insufficient yield value increase to justify the cost of applying
    additional P. The financially constrained farmer can obtain the best returns on
    a limited investment in fertilizer use by applying at a rate where the response
    curve is relatively steep.


    Another important economic consideration in fertilizer use, especially for the
