  md: 'temperatures throughout the year (Table 12.1). Solar radiation varies from
    about 1250-1650 megajoule/cm²/day (MJ/cm²/d) close to the equator to about 1650-
    2100 MJ/cm²/d above 10° N. A detailed description of the Nigerian agro-ecological
    zones is contained in Ojanuga (2006).


    Most arable crop production is concentrated in the savanna AEZ (the focus of this
    chapter). The savanna lies between 8 and 19° N, running in approximately east-west
    bands across the country. The savanna covers about 700,000 of the total area of
    923,768 square kilometers (two thirds of the land area) of Nigeria and is subdivided
    into the Sahel, Sudan, Northern and Southern Guinea, Derived Savannas and Mid-high
    Altitude AEZ.


    In general, soils in Nigeria have formed from the residues of deeply weathered,
    complex base rocks and alluvial materials derived from these under humid to dry
    tropical conditions (Table 12.2). Most soils are highly leached resulting in


    medium to high acidity, moderate to low cation exchange capacity and base saturation,
    and low organic matter content. The concentration of available levels of nitrogen
    (N), phosphorus (P) and potassium (K) are correspondingly low. Soil nutrient replenishment
    from organic and mineral sources is a prerequisite for continuous cultivation
    of such soils particularly under intensive production.


    Many soils are susceptible to erosion due to their relatively low nutrient status
    and organic matter content, and fragile structure. Soil degradation and attendant
    depressed yields due to nutrient mining and inadequate soil and water conservation
    practices has already reached severe proportions in parts of the country. By removing
    the protective cover of natural vegetation and surface litter, conventional tillage
    practices lead to soil structure deterioration, loss of nutrients and erosion.
    Features of the AEZ are summarized in Tables 12.1 and 12.2.


