    # ## 9.1 Agricultural systems of Malawi


    # ### 9.1.1 Agro-ecological zones (AEZ)


    There are four AEZ in Malawi based on altitude: the highlands; the mid-elevation
    and upland plateau; lakeshores, middle and upper Shire Valley; and the lower Shire
    Valley (Figure 9.1). The sub-humid tropical agro-ecosystems of Malawi are characterised
    by a long dry season, with a unimodal rainfall pattern between November and April
    (Table 9.1) (MoAFS 2012).


    The highlands AEZ, lying between 1320 and 3000 m above sea level (masl), consist
    of isolated mountains with extensive highland plateaus found in Nyika, Viphya
    and Mulanje, while Dedza and Zomba are more isolated. The climate is sub-humid
    with 84% of the rainfall occurring during December to March. The minimum and maximum
    mean temperatures range is 9 to 16 and 19 to 25°C, respectively (Table 9.1). The
    predominant soils are the leached Latosols, Alfisols and Utisols. The major crops
    include maize, pigeonpea, tea, coffee, bananas, pineapples, cassava, potatoes
    and many more.


    ![](img/279f2242dca113ddfb6220d3a162ffff_112_0.png)


    The mid-elevation and upland plateau AEZ lies between 760 and 1300 masl. This
    zone consists of escarpments and plateaus running from Karonga in the north to
    Nsanje in the south. The landscape has a flat to rolling topography with scattered
    rock inselbergs. The climate is semi-arid with monthly rainfall range of 1 to
    221 mm; and minimum and maximum mean temperatures range of 8 to 17 and 24 to 30°C,
    respectively (Table 9.1). The escarpment soils are predominantly shallow latosols.
    Soils higher in the plateau catenas are deep well drained latosols while poorly
    drained sand and clay soils dominate in the valleys, locally called dambos. Other
    important soil groups include Ferralsols, Luvisols, Lixisols, Lithic and Leptosols.
    The major crops include maize, tobacco, cassava, rice and pulses.


    The lakeshore, middle and upper Shire Valley AEZ lies between 200 and 760 masl.
    It is flat to gently undulating, with deep calcimorphic soils in the valleys and
    the shorelands of Lake Malawi. The Upper Shire River flows through a broad flat
    valley from the south of Lake Malawi. Mopanoses are found in some areas of the
    Shire River Valley. The climate is semi-arid. Monthly rainfall ranges from 0 to
    339 mm and mean monthly minimum and maximum'
