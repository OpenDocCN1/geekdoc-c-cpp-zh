  md: 'the farmer whose ability to use fertilizer is limited by financial constraints
    can expect to get more yield increase for a small investment by applying at a
    low rate to more land compared with applying at a higher rate to less land.


    Application of a nutrient to a crop has different profit potential compared with
    other nutrients applied to the same or other crops (Figure 13.4). The net returns
    (RwF/ha; y-axis) resulting from investment in a nutrient applied to a crop (x-axis)
    are shown with each curve representing the economic response to a single nutrient
    applied to a crop. When the curves have a steep slope, as with N applied to high
    potential banana or N applied to climbing bean, the potential mean returns on
    investment are very high. As more nutrient is applied, the slopes decrease and
    other crop-nutrient combinations become equally or more competitive. The peak
    of the curves represent the EOR; application of nutrient beyond EOR results in
    a decline in profit from fertilizer use due to other factors. Therefore, the financially
    constrained farmer needs to take advantage of the most profitable options if he/she
    produces these crops. In the northwest AEZ, low rates of K applied to Irish potato
    and P applied to wheat have high profit potential followed by low application
    rates of K for climbing bean and N and P for Irish potato. Application of N for
    climbing bean and wheat and P for soybean also has high profit potential. Other
    options have less profit potential. It is hoped that the high profits from optimizing
    fertilizer use will result in increased financial ability so that eventually fertilizer
    use can be EOR for all cropland.


    Consideration of available information for optimizing fertilizer use by choosing
    the crop-nutrient-rate combinations that are expected to result in the most profit
    for a farmer’s situation is very complex. The agronomic response of each crop
    to each nutrient needs to be considered but also the farmer’s choice of crops,
    land allocation, expected commodity values, fertilizer use costs and the farmer’s
    financial ability. Therefore, fertilizer use optimization tools (FOTs) have been
    developed for each AEZ in Microsoft Excel Solver® (Frontline Systems Inc., Incline
    Village, NV, USA). The FOTs are easy to use but involve complex mathematics of
    linear optimization to generate crop-nutrient-rate combinations expected to optimize
    returns on investment (Jansen et al., 2013).


    # 13.5 Fertilizer use optimization tools for AEZ of Rwanda


    For Rwanda, FOT have been developed for the East, Northwest and South Central
    AEZ. The FOT for the East AEZ is used for illustration. The FOT for the East considers
    banana, maize, sorghum, rice, bush bean, soybean and sweet potato (Figure 13.5).
    Data input for the FOT include the farmer’s choice of crops and land allocation
    to these crops, the expected on-farm value per kg of these crops at harvest time
    (considers the value of the kept harvest for home consumption and the surplus
    to be marketed), the choice of available fertilizers, the cost of a 50-kg bag
    for each fertilizer and the farmer’s budget constraint to fertilizer use. In this
    example, the farmer has 90 are of upland cropland and opts to grow all crops except
    for lowland rice. The budget constraint is RwF 40,000. After completing data input,
    a left-click on the ‘Optimize’ cell runs the linear optimization.


    The FOT provides the fertilizer recommendations for each crop, expected average
    effect per acre on yield and net returns to fertilizer use for each crop, and
    the average expected total net return on investment (Fig. 13.6). Very low rates
    of application, such as the 0.13 kg/are of urea for bean, may not be feasible
    and that fertilizer or money might be allocated elsewhere. Consideration of the
    net returns per crop may prompt the farmer to change the land allocation, e.g.
    the net returns to fertilizer use on soybean are high compared to that for maize
    and sorghum and the farmer might try allocating more land to soybean and less
    to maize or sorghum to increase expected average total net returns to fertilizer
    use. As it is, the expected average returns to fertilizer use for this example
    are RwF 7.6 for each RwF 1 invested.


    Very often, farmers and their advisors do not have ready access to a computer.
    Therefore, a paper FOT has been developed for each Excel FOT (Table 13.2). The
    paper FOTs are constructed with 3 levels of financial ability. Level 1 financial
    ability is for the poor farmer who has no more money than one-third the amount
    required to apply fertilizer to all crop land at EOR. Level 2 financial ability
    farmers have less than two-thirds the amount required to apply fertilizer to all
    cropland at EOR, while level 3 financial ability is for farmers with enough'
