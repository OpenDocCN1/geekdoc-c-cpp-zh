    # Figure 13.2: Yield change due to secondary and micronutrient application.


    Nitrogen-fixing legumes are important in cropping systems; most are food crops
    but some farmers maintain leguminous trees. Land use and management by smallholders
    is very site specific in Rwanda with much crop production as diverse mixtures
    that vary with soil type, topographical position and distance from the household
    compound. The most common farming systems are summarized in Table 13.1.


    # 13.3 Diagnosis of nutrient deficiencies in Rwanda


    About 47% of soils in Rwanda are acidic, often with a pH below 5.2 and with high
    exchangeable Al (Beenart 1999). Plant growth and production on these soils are
    not only limited by low pH but also by increasing depletion of N, P, Ca and Mg,
    low cation exchange capacity and Al toxicity. Soil organic carbon is often low.
    In the volcanic highlands, crop production is highly constrained by P deficiency
    with high P sorption capacities (Cymamert et al., 2013). Research on the status
    of secondary and micronutrient availability is still in early stages in Rwanda.


    Nutrient response trials were conducted in five AEZ during 2013-15, mostly on
    farmers’ fields. The mean yield increases range from: 50% for bean to 94% for
    rice in response to applied N; 18% for rice to 59% for bean in response to applied
    P; and 18% for rice and 25% for bean in response to applied K. The mean responses
    of maize and wheat were within the same range.


    These trials also included a diagnostic treatment N+P+K+Mg+S+Zn+B that was compared


    to N+P+K alone. The crops were maize, rice, wheat, bush bean and climbing bean.
    There was a yield increase due to the diagnostic treatment of 12 to 21% in the
    East, 5 to 23% in the South, 5 to 11% in the Northwest and 7% in the West (Figure
    13.2). This reveals that at least one of S, Mg, B and Zn is yield limiting in
    these AEZ.


    In 2015, four levels of a secondary and micronutrient package were included in
    the wheat and rice trials. The mean yield increase was 10% with 5, 15, 1.25, 0.25
    and 0.5 kg/ha of Mg, S, Zn, B and Cu, respectively, applied in addition to N,
    P and K. Doubling these rates of secondary and micronutrients increased yield
    by another 1%. Therefore, substantial yield increase can be achieved with low
    rates of application for these nutrients although the responses to N, P and K
    are much greater. More research is


