    U: Southwestern high-altitude plain

    W: Western highlands


    Soils of the AEZ of Tanzania were well described by De Pauw (1984) and are covered
    only generally in this chapter. The soil types are widely diverse and the dominant
    soil types are Cambisols with ferralic properties (36%), Acrisols (8.6%), Leptosols
    (8.1%), Luvisols (7.3%) and Ferralsols (6.3%). The most fertile soils, apart from
    volcanic soils (Andosols) in the north and south, are the Vertisols (Mbuga soils)
    that occupy 5% of the country although these are difficult to manage being very
    hard when dry and easily waterlogged when wet (Mlingano ARI 2006).


    # 14.3 Current soil fertility management


    Most croplands of Tanzania have low fertility and nitrogen is the most limiting
    nutrient (Mowo et al., 1993; Marandu et al., 2014). Soil phosphorus availability
    is commonly low. Potassium and S deficiencies are locally important. There are
    occasional indications of localized Cu, Zn and Mn deficiencies. Current fertilizer
    use is reported to average 17 kg/ha/yr with most used for maize, rice and vegetable
    production (World Bank 2014). In 2008, a subsidy on fertilizers and seeds was
    introduced under the National Agricultural Input Voucher Scheme (NAIVS) to promote
    adoption of improved seed and fertilizers, especially for high potential maize
    and


    rice production and fertilizer use has increased from 9 to 17 kg/ha/yr since then.
    Generally less than 5% of farmers in 50% of the districts use fertilizers. MAFS
    (2012) indicated that 42% of fertilizer is used in the Southern Highlands, 17%
    in Shinyanga and Tabora Regions, 12% in Kilimanjaro and Arusha Regions, 10% in
    Morogoro Region and 5% in Kagera and Kigoma Regions. Urea accounts for about 65%
    of fertilizer usage.


    Traditional soil management practices include incorporation of crop residues,
    fallow, use of farmyard manure, and inter-cropping or rotation of legumes and
    non-legumes (Shekifu 2011). Most farmers, however, harvest or burn crop residue.
    In Eastern Zone, almost 70% of the farmers in cassava based production systems
    burned crop residues during land preparation, 12.5% farmers incorporated crop
    residues, 16.5% fallowed land for 1 to 3 years, 2.5% used farmyard manure, and
    none used fertiliser (Shekifu 2011). In Northern Zone, crop residues are commonly
    burnt or harvested with no significant incorporation of organic material into
    the soil to maintain topsoil structure and nutrient status.


    The first fertilizer recommendations were issued in 1982 for 20 AEZ and later
    adapted to a district basis (Harrop and Samki 1984)'
