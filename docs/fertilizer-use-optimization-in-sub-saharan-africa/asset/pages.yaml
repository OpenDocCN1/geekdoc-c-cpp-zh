- pgno: 181
  md: '# 14.6 Fertilizer use optimization tools (FOTs) for Tanzania


    Fertilizer Optimization Tools (FOTs) were developed to integrate the economic
    and agronomic aspects of a farmer''s situation with the crop nutrient response
    functions determined from many field research trials through complex calculations
    involving linear optimization (see Chapter 1). Fertilizer use optimization refers
    to maximizing profit from fertilizer use, either maximizing profit per hectare
    for farmers with adequate finance or profit on the small investment in fertilizer
    use by the financially constrained farmers. These easy to use tools were designed
    to make decisions to maximize profits from fertilizer use.


    Fertilizer Optimization Tools were developed for eight zones in Tanzania as shown
    for the Western Zone FOT input screen (Figure 14.6) but application of FOTs are
    by AEZ rather than by zone (Table 14.3). The FOTs use acres rather than hectares
    for land area measurement as farmers are more accustomed to use of ''acres''.
    The user enters the land area in acres ''Area Planted, (Ac)'' and expected on-farm
    value of the commodity considering the expected value of that kept for home consumption
    and that to be marketed ''Expected Grain Value/kg''. If a crop is not planted,
    ''0'' is entered for acres. Next, the cost of using available fertilizers are
    entered considering the purchase price, and transport and application costs ''Cost/50
    kg bag''. If the fertilizer is not available, ''0'' is entered for the cost. An
    optional fertilizer can be added under the ''Muriate if potash, KCl'' row with
    the nutrient concentrations. Finally, the amount of money that the farmer has
    for fertilizer use is entered under ''Budget Constraint''. In the bottom-left,
    click on ''Optimize'' to run the optimization.


    The FOT output is in three tables (Figure 14.7). The upper table ''Application
    rate - kg/Ac'' gives the recommended fertilizer rates for each crop. Some recommended
    rates are less than 10 kg/Ac and too low for feasible application; these should
    be reallocated such as the 2 kg/Ac DAP might instead be allocated to maize or
    as another fertilizer to another crop. The next table ''Expected Average Effects
    per Ac'' addresses


    expected average yield increases and net return per acre due to the recommended
    fertilizer use. This table indicates the relative profitability associated with
    fertilizer applied to the different crops; we see the most profitable is with
    sweet potato suggesting that the farmer may want to increase area planted to sweet
    potato. The third table ''Total Expected Net Returns to Fertilizer'' is an average
    estimate, adjusted for land allocated to each crop. Effects per acre and total
    net return are expected to be more in some years and less in other years compared
    with the reported expected mean. These results can only be expected if the farmer
    uses good agronomic practices such as variety selection, planting, and control
    of weeds, disease and pests.


    The FOTs developed can be used to assist decision making at the district level
    such as to ensure that the most cost effective fertilizers are available to farmers
    when needed. Optimizing fertilizer use implies that other good agronomic practices
    are applied which implies availability of other agricultural inputs. Therefore,
    the FOTs can be useful in determining fertilizer supply.


    Each Excel Solver® FOT has a companion paper FOT to be used when a computer is
    not available (Table 14.3). The paper FOT is devised for three financial ability
    levels. Financial ability level 1 is for the farmer who has no more money than
    one-third the amount required to apply fertilizer to all cropland at the rate
    to maximize economically optimum rate (EOR). Financial ability level 2 is for
    farmers with no more money than two-thirds the amount required to apply fertilizer
    to all cropland at EOR. Financial ability level 3 is for farmers with enough money
    to apply fertilizer to some cropland at EOR.


    +   The paper tool makes assumptions about:

    +   • measuring units to be used by farmers in adjusting their eyes and feel for
    applying the right rate of fertilizer as in Table 14.3 where the measuring units
    are the Uhai water bottle lid with a volume of 7 ml and the 500 ml Uhai water
    bottle cut to 2-cm height giving a volume of 70 ml;

    +   • crop row and plant spacing;

    +   • fertilizer use costs per 50 kg bag;

    +   • expected grain values on-farm at harvest, considering the value both for
    home consumption and for market; and,

    +   • application guidelines.'
