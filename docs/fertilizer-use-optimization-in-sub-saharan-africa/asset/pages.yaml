- pgno: 19
  md: '# 2. Spatial Analysis for Optimization of Fertilizer Use


    Charles S Wortmann^1 cwortmann2@unl.edu, Maribeth Milner^1 and Gebreyesus Bhane
    Tesfahunegr^2

    ^1Department of Agronomy and Horticulture, University of Nebraska-Lincoln, Lincoln,
    NE 68583

    ^2College of Agriculture, Aksum University-Shire Campus, P.O. Box 314, Shire,
    Ethiopia


    # 2.1 Background


    Sub-Saharan Africa (SSA) has a land area of 24 million km² and experiences widely
    varying crop growing conditions (Figure 2.1; HarvestChoice 2010). For most of
    Africa the mean monthly temperature (relative to sea-level) exceeds 18°C (64.4°F)
    year round (i.e. tropical) although parts of the continent experience temperatures
    as cool as 5°C (41°F) for one or more months (i.e. subtropical). Cool temperatures
    at high elevations impact crop growth (i.e. cool highlands) as well as timely
    precipitation.


    Sahelian, Sudanian and Guinean savanna to forest transition (White 1983) occurs
    with increasing rainfall and distance from the Sahara Desert. Deforested areas
    are referred to as derived savanna. The mid- and high-altitude classes correspond
    to the cool-humid class in Figure 2.1.


    Growing period (in days) is that time interval when mean temperature is 5°C or
    more and total water exceeds half the local potential evapotranspiration (PET).
    The arid to humid moisture class range represents less than 70 to over 270 day
    growing periods, respectively.


    More climatic distinctions are evident at larger (or finer) scales as seen in
    Nigeria’s agro-ecological zone (AEZ) map (Figure 2.2). The


    # 2.2 Inference space concept


    The best crop production practices in one area can potentially inform decisions
    made in similar and possibly distant areas. One can estimate the inference space
    where research results are potentially relevant from critical crop-limiting thresholds.
    Likewise, queries of research sites’ critical threshold values can identify relevant
    information for a location where research has not been conducted. The accuracy
    of a site’s inference space model depends upon the understanding of a crop’s response
    to the range of local environmental conditions and the availability and accuracy
    of regional data sets used to characterize limitations (Aiken et al., 2001).


    ![](img/279f2242dca113ddfb6220d3a162ffff_19_0.png)


    Figure 2.1. Africa climate zones from agro-ecological zones of sub-Saharan Africa
    (HarvestChoice 2010).'
