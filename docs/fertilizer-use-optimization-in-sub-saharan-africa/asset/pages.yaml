    substitution values, with the exception of K which is readily released from dead
    organic materials. High carbon to nitrogen ratio (C:N) and high contents of lignin
    and polyphenols delay decomposition and organic nutrient mineralization of lower
    quality resources. Large quantities of most organic materials may be needed to
    equal the nutrient uptake associated with much increased crop yield. Transport
    of such huge amounts of low quality biomass and its capacity to immobilize soil
    mineral N due to high C:N limits the feasibility of using some organic resources.
    Available organic resources often have alternative uses such as livestock feed,
    fuel and construction material which further limits availability for land application.


    # 3.3 Common ISFM practices for sub-Saharan Africa


    # 3.3.1 Land application of organic resources


    The value of land application of organic resources is widely recognized by African
    smallholders and the resources are widely used. Inadequate supply often constrains
    greater use. Organic resources can supply soil nutrients but nutrient contents
    range widely.


    The soil amendment effect of applied organic resources may exceed and certainly
    complement the nutrient supply effect. The amendment effect can be especially
    great on soils with low available water holding and nutrient supply capacity such
    as sandy soils of low soil organic matter (Chivenge et al., 2011). The amendment
    effect may also be great in cases of weak soil aggregation if susceptibility to'
