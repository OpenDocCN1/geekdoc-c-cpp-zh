    The Eastern above 1800 masl (Kapchorwa Farm-Forest Land) AEZ is on the northern
    steps of Mount Elgon with above 1200 mm/yr unimodal rainfall (Table 15.1). The
    climate is cool and sub-humid with a long wet season from April to October and
    with peak rainfall in April and May. The population density is 206 persons per
    km². Much of this zone is forested; about 40% is used for crop production. Maize
    and bean are the main crops, with beans produced in association with other crops.
    Banana is also an important crop. This is the major AEZ for wheat production in
    Uganda. The soils are generally highly productive. In the forest zone, soils are
    primarily reddish-brown loam over deep clay loam sub-soil. In the farmland areas,
    much of the soil is derived from volcanic parent material; clay and clay loam
    soils are common and often


    acidic, but are of good nutrient supply (Figure 15.3).


    The Northern Moist Farmlands are very important for annual crop production. It
    receives above 1200 mm/yr of unimodal rainfall (Table 15.1). The zone is sub-humid
    and relatively warm with rainfall well distributed from April to October, during
    which mean monthly rainfall exceeds 110 mm. The main dry season is December-March.
    Population density is 65 persons per km². Maize, finger millet and bean are important
    food crops but are not uniformly distributed. Sweet potato, cassava and sorghum
    are also important. Cotton, simsim (sesame) and tobacco are major cash crops.
    This is the major AEZ for pigeonpea and cowpea production in Uganda. Rice is becoming
    an important cash crop. The soils are variable and often acidic and sandy. In
    the West Nile, the soils are over a metre deep, sandy and acidic, and often low
    in nutrient availability. The soils of Gulu, Lira and Apac are generally sandy
    and sandy clay soils with low organic matter and low nutrient


