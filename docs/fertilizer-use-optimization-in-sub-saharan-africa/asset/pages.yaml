- pgno: 75
  md: 'Optimizing fertilizer use implies that other good agronomic practices are applied
    and therefore adequate availability of other agricultural inputs. Therefore, for
    the district the FOT does not stop at making decisions for fertilizer use but
    decisions at a broader scale of agricultural production.


    Each Excel Solver® FOT has a corresponding paper FOT to be used when a computer
    is not available and directly by farmers themselves (Table 6.2). These are available
    at http://agronomy.unl.edu/OFRA. The paper FOT is designed for three financial
    ability levels. Financial ability level 1 is for the farmer who has not more than
    one-third the amount required to apply fertilizer to all cropland at the rate
    to maximize profit per ha. Financial ability level 2 is for farmers with not more
    than two-thirds the amount required to apply fertilizer to all cropland at rates
    to maximize profit per hectare. Financial ability level 3 is for farmers with
    enough money to apply fertilizer at rates to maximize profit per hectare.


    The paper tool makes assumptions about:


    +   - measuring units to be used by farmers in adjusting their eyes and feel for
    applying the right rate of fertilizer as in Table 6.2 where the measuring units
    are the Voltic brand water bottle lid with a volume of 7 ml and the Gino brand
    tomato sauce can giving a volume of 70 ml

    +   - crop row and plant spacing

    +   - fertilizer use costs per 50-kg bag

    +   - expected grain values on-farm at harvest, considering the value both for
    home consumption and for market

    +   - application guidelines.


    The paper FOTs address the 4Rs, advising on the right product, rate, time and
    method of application (Table 6.2). It also advises on calibration, that is the
    length of band or the number of plants/planting hills for the recommended fertilizer
    rate with one measuring unit.


    Consider as an example from the South Guinea Savanna paper FOT the level 2 financial
    ability recommendation “Sorghum point apply 45 kg urea (1 lid per 8 hills) and
    TSP 73 kg (1 lid per


