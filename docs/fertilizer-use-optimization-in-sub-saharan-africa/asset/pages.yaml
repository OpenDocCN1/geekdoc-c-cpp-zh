  md: 'Application of an N-P-K blended fertilizer could only be justified for sorghum
    in both AEZ and, at low rates, for rice in the Sahel. Otherwise, crops had economic
    response to only one or two of the three nutrients.


    # ## 11.5 Fertilizer use optimization tools for Niger AEZ


    When a farmer has several crops of interest and is financially constrained in
    fertilizer use, consideration of the various crop-nutrient response functions
    together with information about the farmer’s financial ability and agronomic interests
    is very complex. Therefore fertilizer optimization tools (FOTs) were developed
    to adequately consider the farmer’s financial and agronomic situation in determining
    optimal use of fertilizer (http://agronomy.unl.edu/OFRA).


    Crop nutrient response functions (Tables 11.2a,b) are the backbone of the FOTs
    for the Sahel and Northern Sudan Savanna AEZ. The FOTs use linear programming
    (Chapter 1) with Excel Solver® (Frontline Systems Inc., Incline Village, NV, USA)
    to consider an indefinitely large number of fertilizer use scenarios and recommends
    the combination of nutrient rates for each crop to maximize the net returns on
    the farmer’s investment in fertilizer use.


    The FOTs use complex mathematics to integrate the agronomy of the responses to
    applied nutrients for the different crops of interest to farmers, but also the
    farmer’s land allocation to different crops, the value of the grain, the costs
    of fertilizer use and the money available for fertilizer use. The FOTs and other
    decision tools are available at http://agronomy.unl.edu/OFRA.


    The FOTs, although of complex mathematics, are easy to use. The Solver add-in
    and macros must be enabled for the Fertilizer Optimization spreadsheet to function
    appropriately; see the ‘Help and Instructions’ worksheet of the FOT. When enabled
    the Solver add-in appears under the Data tab on the Quick Access Toolbar.


    In the input panel (Figure 11.5) the user enters the hectares to be planted and
    the expected value for each crop on-farm at harvest time considering both that
    which is likely to be marketed and that which is saved for home consumption, the
    cost of using 50 kg bags of


    available fertilizers, and the amount of money the farmer has to invest in fertilizer
    use. Then, the user clicks on the ‘Optimize’ cell to run the optimization calculations.


    The output panel (Figure 11.5) displays the recommended fertilizer rate for each
    crop, the expected average yield increases and net returns to fertilizer application
    for each crop, and the expected total net return to investment in fertilizer.


    Note that in this example 500,000 FCFA was made available for fertilizer use while
    a total of about 11 bags of fertilizer was needed valued at less than 200,000.
    The FOT only used the money needed to determine the EOR for all crops and nutrients.
    A more typical farmer may have only 50,000 available for fertilizer use, in which
    case the recommended rates would be much lower and some crops may not have a fertilizer
    recommendation.


    Fertilizer costs and expected grain values are important for the results. Therefore,
    seasonal variation in fertilizer use costs and grain prices requires ready access
    to current information on fertilizer prices and grain markets to better determine
    the input costs and expected grain values for the season.


    # ## 11.6 Paper fertilizer optimization tools


    For each Excel Solver® FOT, there is a companion paper FOT to be used when a computer
    is not available (Table 11.3). The paper FOT is devised for three financial levels
    based on the total amount of money required to apply fertilizer at EOR for all
    the cropland: level 1 financial ability for the poor farmer who cannot invest
    more than one-third the total EOR amount; level 2 for the farmer with more money
    but has no more money than two-thirds of the total EOR amount; and level 3 for
    the farmer with enough money to apply fertilizer at EOR to at least some of the
    cropland and thereby at rates to maximize profit per hectare. The paper tool makes
    assumptions about the:


    +   - measuring units to be used by farmers to calibrate their eyes and feel for
    applying the right rate of fertilizer

    +   - crop row and plant spacing

    +   - fertilizer use costs per 50-kg bag'
