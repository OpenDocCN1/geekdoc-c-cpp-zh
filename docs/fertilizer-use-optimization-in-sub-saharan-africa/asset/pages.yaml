  md: '# 6. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Ghana


    Francis M. Tetteh¹, fmarthy2002@yahoo.co.uk, Gabriel W. Quansah¹, Samuel O. Frempong¹,
    Abdul Rahman Nurudeen², Williams K. Atakora³, Godwin Opoku⁴


    ¹CSIR-Soil Research Institute, Academy Post Office, Kwadaso-Kumasi, Ghana ²IITA/Africa
    RISING, P.O. Box TL 6, Tamale, Ghana ³Savanna Agricultural Research Institute,
    P.O. Box TL 52, Tamale, Ghana ⁴Savanna Agricultural Research Institute, P.O. Box
    494, Wa Station, Wa, Ghana


    # 6.1 Soil nutrient management, including fertilizer use in Ghana


    Ghana''s agriculture is characterized by low crop yields due to low soil fertility,
    soil erosion, inappropriate land use and nutrient depletion through crop harvest
    and exports without corresponding replacement of these nutrients by fertilizer
    use, leading to soil degradation. Food security is therefore at risk, with increased
    dependence on imported food and expenditure of Ghana''s foreign exchange reserves.


    The important food crops in Ghana are maize, rice, sorghum, millet, cassava and
    legumes.


    Among the cereals, maize is the most important with about 750,000 ha/year of production.
    Cowpea is a very important legume food crop and soybean is becoming important
    as a cash crop. The yields of these crops are, however, low because of low soil
    fertility and low input use. The Abuja summit on fertilizer declared that Sub-Saharan
    Africa (SSA) can only increase food production and alleviate poverty when fertilizer
    use is increased.


    However, the mean maize yield is 1.5 t/ha compared to potential yield of 6 t/ha.
    Two major reasons for low crop productivity include low soil


    ![](img/279f2242dca113ddfb6220d3a162ffff_66_0.png)


    Figure 6.1: Agro-ecological zones (AEZ) of Ghana.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'fertility and low input use. The soils of the major maize growing areas are
    low in organic carbon (<1.5%), total nitrogen (<0.2%), exchangeable potassium
    (<100 ppm) and available phosphorus (< 10 ppm) (Benneh et al., 1990; Adu 1995).
    A large proportion of the soils are also shallow with iron and magnesium concretions
    (Adu 1969).


    Despite these shortcomings, soil fertility management receives little attention
    from farmers. Fertilizer nutrient application in Ghana is approximately 12 kg/ha
    (FAO 2005) while depletion rates, which range from about 40 to 60 kg of nitrogen,
    phosphorus and potassium (NPK) per ha/yr (FAO 2005), are among the highest in
    Africa. FAO estimates show negative nutrient balance for all crops in Ghana. The
    escalating rates of soil nutrient mining are a serious threat to sustainability
    of agriculture and poverty reduction.


    Ghana''s farming systems vary with agro-ecological zones although certain agricultural


    practices cut across all zones (Figure 6.1). The bush fallow system prevails wherever
    there is ample land to permit a plot to replenish its fertility after one to three
    years of cultivation (Ofori and Stern 1987; MoFA 1998). Staple food crops are
    often mixed-crop while cash crops are usually monocropped.


    In the forest zone, tree crops are significant with cocoa, oil palm, coffee and
    rubber being the dominant crops. Food crops in these areas are mainly intercropped
    mixtures of maize, plantain, cocoyam and cassava.


    The middle belt is characterized by mixed or sole cropping of maize, legumes,
    cocoyam or yam with tobacco and cashew being the predominant cash crops.


    The food crops in the northern sector are mainly sorghum, maize, millet, cowpeas,
    groundnuts and yam with tobacco and cotton as the predominant cash crops.


