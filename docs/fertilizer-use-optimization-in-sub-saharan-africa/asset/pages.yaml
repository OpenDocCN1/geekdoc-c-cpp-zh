- pgno: 72
  md: 'and agronomic information, but which are easy to use (https://agronomy.unl.edu).


    # 6.7 Fertilizer use optimization tools (FOT) for Ghana


    Fertilizer Optimization Tools (FOTs) were developed to integrate the economic
    and agronomic aspects of the farmer''s situation with the crop nutrient response
    functions determined from field research trials through complex calculations involving
    linear optimization here.


    Fertilizer use optimization as mentioned here refers to maximizing profit from
    fertilizer use, including profit per hectare for the farmer with adequate finance
    and also profit on the small investment in fertilizer use by the financially constrained
    farmer. These easy to use tools were designed to make decisions to maximize profits
    from fertilizer use.


    The FOTs were developed for four zones in Ghana as shown in the FOT input screen
    (Figure 6.4) for the Derived Savanna Transitional Zone. It considers high and
    low potential maize, cassava, upland and lowland rice, groundnut and soybean.
    To use the FOT, the Excel add-in Solver needs to be activated and macros need
    to be enabled; see the step-by-step instructions in the ''Help and Instructions''
    worksheet of the FOTs and more detailed instructions (Extension Materials and
    FOT Manual) are available at http://agronomy.unl.edu/OFRA.


    Once Solver has been activated and macros enabled, the user enters the land areas
    in hectares ''Area Planted, ha'' for each crop to be planted. The expected on-farm
    value of the commodity considering the expected value of that kept for home consumption
    and that to be marketed is entered ''Excepted Grain Value/kg''. If a crop is not
    planted, ''0'' is entered for hectares. Next, the cost of using available fertilizers
    are entered considering the purchase price, and transport and application costs
    under ''Cost/50 kg bag''; if the fertilizer is not available, ''0'' is entered
    for the cost. An optional fertilizer can be added under the KCI row with the nutrient
    concentrations. Finally, the amount of money that the farmer has for fertilizer
    use is entered ''Budget Constraint''; in the example, GH¢ 500 is entered, an affordable
    budget for many smallholders. A left click on ''Optimize'' runs the optimization.


    The FOT output is in three tables (Figure 6.5). The upper table ''Application
    rate - kg/ha'' gives the recommended fertilizer rates for each crop. Some recommended
    rates are less than 20 kg/ha and too low for feasible application; that fertilizer
    or money can be allocated by the user to another fertilizer application. Total
    fertilizer amounts recommended are 256 kg/ha of urea, 33 of kg/ha of TSP, 0 kg/ha
    DAP as this was not selected in the Input screen, 56 kg/ha of KCl, and just 6
    kg of NPK which was generally not economically competitive with the single nutrient
    fertilizers.


    The next table ''Expected Average Effects per ha'' addresses expected average
    yield increases and net return per acre due to the recommended fertilizer use
    (Figure 6.5). This table indicates the relative profitability associated with
    fertilizer applied to the different crops; in the table the most profitable fertilizer
    use is with cassava suggesting that the farmer may want to increase area planted
    to cassava; this high profit potential with cassava is consistent with information
    in Figure 6.3.


    The third table ''Total Expected Net Returns to Fertilizer'' is an average estimate,
    adjusted for land allocated to each crop, but expecting that the net returns will
    be more in some years and less in other years. These results can only be expected
    if the farmer adheres to good agronomic practices of variety selection, planting
    and control of weeds, disease and pests.


    Crop options are to a large extent determined by physiographic and climatic conditions,
    such as with sorghum and cowpea generally in drier areas and maize and beans in
    more humid areas. The choice of crops is done by the farmer considering crop suitability,
    home consumption needs, local market opportunities, credit availability and market
    access.


    The FOTs help the farmers make decisions to maximize profit from fertilizer use.
    The FOTs can be used in decision making at district level so as to ensure the
    fertilizers that are most cost effective for the farmer are adequately available
    on a timely basis. For example, the results in Figure 6.5 indicate the strong
    need for timely availability of urea but also that TSP and KCl supply should have
    priority over supply of NPK.'
