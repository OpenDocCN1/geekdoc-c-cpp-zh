    are greater than with higher rates. Such response curves are typical for most
    crops and nutrients and are essential to determining the profitability of fertilizer
    use. These show that the financially constrained farmer will make more profit
    on a limited amount of fertilizer by applying at lower nutrient rates to more
    land than by applying higher rates over less land.


    GH¢ 20/ha (x-axis) of K applied to cassava with an expected net return of approximately
    GH¢ 1230/ha (y-axis). When the same amount (GH¢ 20) is invested in P applied to
    groundnut (on x-axis), the expected mean net return is approximately GH¢ 950 (on
    the y-axis) to farmers in the Derived Transitional Zone. The peak of the curves
    is the point of maximum profit per hectare for that nutrient applied to that crop.
    When slopes decline, profit is declining. The financially constrained farmer wants
    first to take advantage of the most profitable crop-nutrient combinations for
    crops in the cropping system. Making decisions in consideration of these curves
    for the amount of nutrient to apply to each crop is, however, very complex. Not
    only the agronomy of the responses to applied nutrients of the different crops
    of interest to farmers, but also the farmer''s land allocation to different crops,
    the value of the commodity, the costs of fertilizer use and the money available
    for fertilizer use need to be considered in optimizing fertilizer use for high
    profit. Therefore, fertilizer optimization tools were developed using Excel Solver®
    (Frontline Systems Inc.) that use complex mathematics to integrate economic'
