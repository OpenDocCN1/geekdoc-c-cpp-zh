    # 12.5 Diagnostic results for the Northern Guinea Savanna AEZ


    In 2014-15, 139 on-farm and 39 on-station fertilizer use trials were conducted
    for several crops in the Northern Guinea Savanna, which included a diagnostic
    treatment consisting of N+P+K+Mg+S+Zn+B compared with an N+P+K treatment (Figure
    12.2).


    Hybrid and open pollinated maize yields were increased by an average of 25 and
    15%, respectively, by the diagnostic treatment compared with N+P+K. Mean yields
    of groundnut, sorghum and soybean were not much affected and the diagnostic package
    had a negative effect on groundnut in some trials. Therefore, one or more of four
    secondary and micronutrients in the diagnostic package are important to maize.
    There is ample evidence of maize response to Zn (Table 12.5.b,c,e,f). More research
    is needed to determine if deficiency of Mg, S or B contributed to the maize response
    to the diagnostic treatment. There was a large


