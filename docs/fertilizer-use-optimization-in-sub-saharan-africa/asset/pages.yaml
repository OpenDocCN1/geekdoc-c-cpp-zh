    P, banana P, banana K and groundnut K were considerably higher than EOR. Currently
    fertilizer prices in Uganda are very high. If the prices can be reduced through
    more efficient supply and/ or subsidies, the EOR will increase assuming no significant
    change in the relative commodity values. Most Ugandan farmers are financially
    constrained in fertilizer use and should apply at rates below EOR to take advantage
    of the steeper parts of response curves.


