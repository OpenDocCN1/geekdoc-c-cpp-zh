    fertilizer use options specific for a farmer''s context. The FOT optimizes solutions
    using the Solver® add-on (Frontline Systems Inc., Incline Village, NV, USA) of
    Microsoft Office Excel 2007 or later. The process stage of the FOT considers the
    farmer-specified constraints, pre-determined model constraints and the model''s
    optimization function. The farmer-imposed constraints, or input data, include:


    # 1.4 Fertilizer optimization tools


    Fertilizer optimization tools (FOTs) have been developed to assist farmers optimize
    profit from


    +   i) the intended land area to be planted and the expected commodity value at
    harvest for each crop to be planted (zero is entered for land area of crops that
    are not being considered);'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   ii) fertilizers available and the cost of using each fertilizer including
    purchase, delivery, application and interest costs; and


    +   iii) the farmer''s budget constraint, that is, the amount of money that the
    farmer has for fertilizer use, whether borrowed or saved.


    The FOT is also constrained by the setting of maximum fertilizer and nutrient
    rates to avoid exceeding the range of inference for the underlying equations,
    such as in the cases where fertilizer is free or very low cost.


    The objective function of the FOTs, therefore, is to maximize net returns, that
    is, the difference of the total value gain from fertilizer use minus total cost
    of fertilizer use. This is subject to (Figure 1.3):


    +   i) Total costs of fertilizer applied across all crops within the bounds of
    the available budget for fertilizer.


    +   ii) Optimized allocations of fertilizer rates by type and crop, not exceeding
    the imposed constraints of maximum rates for different fertilizer types applied
    to each crop, but in excess of any imposed minimum rates, generally zero.


    ![](img/279f2242dca113ddfb6220d3a162ffff_11_0.png)


    Figure 1.3: Fertilizer optimization process (Adapted from Jansen et al., 2013).


    Since field research results follow Liebig''s law of the minimum, the FOT often
    requires some N application before phosphorus (P) can be applied to cereals and
    bean, and some P application before potassium (K) can be applied. This is not
    always the case. For example, banana has similar mean yield responses to N or
    K application but less response to P. The FOTs do not consider other practices
    that affect soil nutrient supply, soil test results, or previous crop but these
    are considered in another step of the


    decision process. The FOT optimizes across crop nutrient response functions.


    The FOT prototypes evolved, beginning with a six-crop and three possible nutrients
    version to a seven-crop and four possible nutrients version. The crops selected
    for a FOT varies according to importance by AEZ. The nutrients include N, P, K
    and either sulphur (S) or zinc (Zn). Another version includes maize-bean intercropping
    as one of the seven crops for which intercrop response is determined on a maize
    value equivalent basis. To date, 67 FOTs have been developed across the 13 countries
    (Table 1.1) and can be downloaded from the OFRA Tools page at http://agronomy.unl.edu/OFRA
    along with instructions (Kaizzi and Wortmann 2015).


    # 1.5 Using the Excel FOT


    Use of the Excel FOT requires that the Solver add-in is engaged. If Solver is
    activated, it will appear under the Data tab, far to the right on the Quick Access
    Toolbar. The following steps to activating Solver are also available in the ''Help
    and Instructions'' worksheet of FOTs and, in more detail, in Kaizzi and Wortmann
    (2015) at http://agronomy.unl.edu/OFRA.


    +   1) Select the File tab on the Quick Access Toolbar

    +   2) Select Options on File drop down menu

    +   3) Select Add-Ins on the left hand side of the Excel Options window

    +   4) In the Add-Ins drop down list, select the Solver Add-in options

    +   5) Select Go

    +   6) Select Solver Add-In again

    +   7) Click OK


    The data input panel of the FOT is shown in Figure 1.4. The user enters the estimated
    area to be planted and the expected value per kg of produce for each crop on farm
    at harvest considering the value of that saved for home consumption and that expected
    to be sold (A). The costs of using available fertilizers (B) and the amount of
    money the farmer has to invest in fertilizer use are entered (C). Click on ''Optimize''
    cell to run the optimization (D). The output results are generated (Figure 1.5).'
  merge: -1
  img_proc: true
