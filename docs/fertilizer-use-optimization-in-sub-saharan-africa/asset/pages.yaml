    increase productivity. Most farmers are poor and are financially constrained in
    fertilizer use. Therefore, returns to investment in fertilizer use need to be
    high to be a means to alleviating the financial constraint. Optimization of fertility
    use aims to maximize profit from fertilizer use, both for the farmer who is not
    limited in fertilizer use and can apply at EOR to all cropland and for the financially
    constrained farmer who needs to maximize net returns from a limited investment
    in fertilizer use. Field research results were applied in determining crop nutrient
    response functions which are the basis of FOTs which aid in choice of crop-nutrient-rate
    combinations specific for the farmer''s context.


