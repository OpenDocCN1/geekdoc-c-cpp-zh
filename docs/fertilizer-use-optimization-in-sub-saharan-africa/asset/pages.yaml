    # 15.1 Agro-ecological zones (AEZ) of Uganda


    Uganda has 14 AEZ (Wortmann and Eledu 1999) (Figure 15.1). An alternative zonnation
    has 10 production zones (MAAIF 2004) (Figure 15.2). Central Uganda (Lake Victoria
    Crescent) is an extensive agricultural area receiving over 1200 mm per year of
    rainfall in a bimodal pattern (Table 15.1). The population density is 280 persons
    per km². The zone is subdivided into three sub-zones: west of the Nile River;
    east of the Nile; and the eastern section in Bugiri, Busia and Tororo Districts.
    About 82% of the land is farmed. Wetlands are important for plant products, environmental
    protection and rice cultivation. The crops are diverse. Banana is important throughout
    much of the zone, but particularly in the west. Bean, sweet potato, cassava and
    maize are the main food


    crops. The cereal and grain legume crops are relatively more important east of
    the Nile. Rice production is important in parts of Tororo, Busia and northern
    Iganga districts. Robusta coffee is a major cash crop throughout the zone. West
    of the Nile, the soils are variable but often have high clay content (Figure 15.3).
    Sandy clay loam soils are also common. The sub-soil has a clay loam texture in
    some places, which may interfere with rooting depth. Soils are often acidic and
    low in K, but contain moderate levels of organic matter. Crop production takes
    place primarily on the slopes where the soil is generally deep. Murram may limit
    rooting depth on the lower slopes; ridge tops and swamp fringes are generally
    not suitable for crop production. Clay loam soils are typical on the hill slopes
    east of the Nile River, where the soils are less fertile than in the west, and
    these soils are more often sandy


