    heavily weathered with sandy surface layers and an accumulation of clay in the
    subsurface layer. Ferralsols and Acrisols are common in high rainfall plateau
    areas and generally have low soil pH, low nutrient availability and high P sorption
    capacity due to high aluminium content. Leptosols, Acrisols and Ferralsols cover
    9, 8 and 7% of the land area.


    # 10.2.2 Soil fertility management in Mozambique


    Shifting cultivation with no nutrient application is common in Mozambique. Manure
    is applied when available, mostly for vegetables and other high value crops, and
    especially in central and southern Mozambique where livestock production is significant.
    Expansion of crop production has resulted in less use of fallow periods and increased
    cultivation of marginal land that is often highly erodible. Significant deforestation
    has occurred. Burning of vegetative material after clearing fallow land and burning
    of crop residues is common. Soil nutrient depletion is relatively great with cassava
    and maize compared with other crops. Estimated nutrient depletion (kg/ha/yr) for
    all of Mozambique, including from erosion, is estimated at 34, 6 and 25 for N,
    P and K, respectively.


    The Ministry of Agriculture and Food Security (MASA) and agriculture development
    organizations have initiated a voucher subsidy programme to enable increased fertilizer
    use. Efficient fertilizer use, however, has been constrained by inadequate soil
    information and fertilizer recommendations. Fertilizer availability is generally
    limited to N:P:K 12:24:12 and urea. Therefore, the application of some nutrients
    which result in little or no profit reduce the profit potential of fertilizer
    use.


    Soil test results and nutrient-need prediction tools such as the Nutrient Management
    Support System (NuMaSS) (http://www.ctahr.hawaii.edu/sm-crsp/program_areas/AnnRepPY10/numass/
    AnnualReportNuMaSSUnihawaii2006_2007a. pdf) and Phosphorus Decision Support System
    (PDSS) (http://www2.ctahr.hawaii.edu/tpss/ research_extension/solresearch/pdss.html)
    indicate widespread occurrence of N and


    ![](img/279f2242dca113ddfb6220d3a162ffff_126_0.png)


    Figure 10.3: Examples of crop nutrient response curves determined from crop response
    functions for applied P in mid-altitude areas of Mozambique.


    P deficiencies, as common throughout sub-Saharan Africa. A critical level for
    soil exchangeable potassium (K) of 0.2 meq/100 g of soil or 80 ppm appears appropriate
    for Mozambique. Typical soil K levels in Mozambique range from 0.26 to 0.98 meq/100
    g soil for Arenosols and Acrisols, respectively, with other soil types having
    intermediate levels.


    # 10.2.3 Diagnosis of nutrient deficiencies


    Trials were conducted for maize, sorghum and soybean in the Manica and Buze areas
    under OFRA in 2014-15. The mean yield increases for maize and sorghum over 14
    variety-site combinations were 81, 22 and 18% for applied N, P and S, respectively,
    and the mean yield increases for soybean over four sites were 38 and 16% for applied
    P and S. The trials included a diagnostic treatment of N+P+S+Mg+zn+B which was
    comparable to an N+P+S treatment. No N was applied in the soybean trials. The
    diagnostic treatment was as likely to result in yield losses as gains and the
    average increase due to the diagnostic treatment was -8% of soybean and 1% for
    cereals, neither of which was significantly different from zero. The results support
    other diagnoses of N and P deficiencies but also S deficiency and indicate that
    application of other secondary and micro nutrients is not likely to be profitable.


