  md: '# # 12. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Nigeria


    Tarfa Bitrus Dawi¹ btfarfa@gmail.com, Amapu Ishaku Yoila¹, Daudu Christogonus
    Kayode², Arunah Uthman Lucky³, Ishab Abdulazeez Shero³, Yakubu Adamu Alhaji³,
    Nafiu Abdu¹, Adeogun Tinoke Tawa¹, Bakodo Pwanogoshin Raymond¹, Ugbaje Enemona
    Marinus¹, Dauda Haratu¹ and Ugbame Omadachi Ogbodo⁴

    ¹Department of Soil Science, Faculty of Agriculture/Institute for Agricultural
    Research, Ahmadu Bello University, Zaria, Nigeria

    ²National Agricultural Extension Research and Liaison Services, Ahmadu Bello University,
    Zaria, Nigeria

    ³Department of Agronomy, Faculty of Agriculture/Institute for Agricultural Research,
    Ahmadu Bello University, Zaria, Nigeria

    ⁴Department of Agric Economics and Rural Sociology, Faculty of Agriculture/Institute
    for Agricultural Research, Ahmadu Bello University, Zaria, Nigeria


    # ## 12.1 Introduction


    Increasing agricultural productivity in Nigeria requires greater adoption of good
    agricultural practices (GAP) including efficient use of fertilizers. While all
    farmers can profit from fertilizer use, only those with adequate finance may strive
    to maximize net returns per hectare resulting from fertilizer use. In this chapter,
    these rates are referred to as economically optimal rates (EOR). Others need to
    maximize return on their limited investment. For example, by increasing the use
    and correct application of fertilizer, poor farmers surveyed in Nigeria were able
    to improve their yields by approximately 30–55%. In turn, they benefited by making
    an additional 30–40% profit through greater commodity sales (ProOpCom 2011).


    Most of Nigeria''s farmers use traditional low input-low output farming methods
    that have been in use for generations. Even when knowledgeable of improved GAP,
    many have not been able to apply their knowledge appropriately due to poor access
    to agricultural inputs such as improved varieties and fertilizer. Investment in
    fertilizer use has an opportunity cost vis-à-vis other uses of financial resources
    for meeting immediate needs. Deliberate efforts must be made in ensuring that
    fertilizer investments give high returns with little risk. This necessitates employment
    of ingenious techniques for optimizing fertilizer use. Fertilizer use optimization
    in this chapter refers to maximizing profit from fertilizer use, including profit
    per hectare for farmers with adequate finance and profit on the small investment
    in fertilizer use by the financially constrained farmers.


    ![](img/279f2242dca113ddfb6220d3a162ffff_147_0.png)


    Figure 12.1: Agro-ecological zones of Nigeria.'
