  md: 'may account for 90% of fertilizer use with most of the remaining applied to
    pulse, oil seed crops and non-grain crops. Teff, wheat, maize, barley and sorghum
    production accounted for 40, 26, 17, 9 and 3% of fertilizer use. The main fertilizers
    used have been urea and diammmonium phosphate (DAP).


    Wheat and legumes often respond to applied sulphur (S) in the high potential Central
    Highlands where market-oriented crop production is associated with removal of
    crop residues, much tillage and little manure application leaving soil organic
    matter to be mostly very stable with little organic S mineralization.


    Total cereal production has grown at 6% per year and production per capita at
    3%, but yields per hectare have grown by just 0.5% per year. Fertilizer use has
    an additive effect and possibly a synergistic effect as well with other inputs
    (Dercon and Hill 2009). A poorly managed crop is not likely to be very responsive
    to applied nutrients. More than a threefold increase in fertilizer use in recent
    decades has not resulted in a significant increase in productivity.


    Fertilizer is a costly input and its efficient use is important for profitability
    and minimizing nutrient loss to the environment and soil acidification due to
    excess N application. Key to efficient fertilizer use is to practise the 4Rs of
    nutrient stewardship, that is, to apply the right product, the right rate, at
    the right time and using the right method. The 4Rs are especially applicable to
    N which is subjected to loss through various pathways.


    Most N application to non-legumes should be prior to or during the period of rapid
    crop growth when rate of N uptake is high, such as at 6- to 8-leaf stage of maize.
    For example, with maize, at least 50% of fertilizer N should be applied 4 to 7
    weeks after planting; when the recommended rate of N is low, it is advisable to
    apply all of N at 4 weeks after planting. Aspects of the 4Rs are further addressed
    in section 5.3.


    It is also important to have a healthy and well managed crop in order to achieve
    a good response to fertilizer. Therefore, good agricultural practices should be
    applied throughout including choice of variety, careful planting and good weed
    and pest control. Consideration of soil test information and the effects of other
    practices such as manure application is also important to fine-tune fertilizer
    use for greater profitability and efficient nutrient use. This topic is further
    addressed in section 5.5.3.


    Recent recommendations and economically optimal rates (EOR) of nutrient application,
    determined from results of field research, are addressed in section 5.6.


    # 5.3 Diagnosis of nutrient deficiencies in Ethiopia


    Eighteen trials were conducted for determination of crop nutrient response functions
    that are essential for decisions aimed at maximizing profits from fertilizer use.
    The mean percent increases in grain yield of cereal crops for applied N, phosphorus
    (P) and potassium (K) were 55, 23 and 0%, respectively. Fertilizer optimization
    trials included treatments to determine the effect of the diagnostic nutrient


