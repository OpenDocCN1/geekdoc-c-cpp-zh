- pgno: 78
  md: 'costs used in determining EOR are given in the footnote of Table 6.4. Nutrient
    applications exceeding the field research based EOR is expected to result in loss
    of profit. Any nutrient application at less than EOR means less than maximum potential
    profit per acre to fertilizer use but lower rates are typically most profitable
    with financially constrained fertilizer use.


    The greatest yield increase, the b value, occurred in the Derived Savanna Transitional
    Zone with cassava for N application (Table 6.4 a). High potential maize (HP>3t)
    and upland rice also had a large response to N. High potential maize, cassava,
    groundnut and soybean had profitable responses to applied P. Only cassava had
    a profitable response to K. Maize, soybean and groundnut responded well to 1 kg/ha
    Zn applied. The field research based EOR was: similar to the REC N for high potential
    maize; more than the REC for low potential maize, cassava, and upland rice; and
    less than the REC


    for lowland rice. The EOR for P was less than the REC for most crops but higher
    for groundnut and soybean. The EOR for K was less than the REC for all crops and
    zero for most crops.


    For the South Guinea Savanna, maize, upland and lowland rice, sorghum, cowpea,
    groundnut and soybean were considered (Table 6.4 b). Maize responded especially
    well to applied N but all cereals had a profitable response to N. All crops had
    an economic response to applied P. Upland and lowland rice, groundnut and cowpea
    had profitable responses to K but maize, sorghum and soybean did not. The EOR
    for N was always less than the REC N rates. The EOR of P for maize was less than
    REC rate but otherwise EOR of P was similar to REC for groundnut and sorghum,
    and greater than REC for the remaining crops. The EOR for K was always less than
    the REC.


    Maize, upland rice and sorghum were especially responsive to applied N in the
    North Guinea Savanna (Table 6.4 c). All crops had an


