    # 4.6 Targeted crops by AEZ


    Crop nutrient response functions were developed for the crops listed under AEZ
    in Table 4.4 a-c using results of past and recent nutrient response research.
    In the Sahel, crop yield response to applied P was determined to be greater compared
    with applied N and K (Table 4.4a). The EOR for N and K were less than the recommended
    rates (REC) but EOR of P was greater than REC for sorghum and pearl millet but
    EOR of P for cowpea and groundnut was less than REC.


    Crop responses were greater with applied N compared with P for the North Sudan
    Savanna (Table 4.4b). The large increase in sorghum yield with just 30 kg/ha N
    applied is especially noteworthy suggesting a great profit opportunity but also
    efficient use of the applied N. There


    was no evidence of response to applied K for the crops considered. The EOR and
    REC were similar for lowland rice N. In all other cases, EOR was less than the
    currently recommended application rates.


    Crop responses for the South Sudan Savanna were greater for applied N compared
    with P, and less with applied K except for cowpea (Table 4.4c). There were large
    yield increases with P applied to sorghum and upland rice. Comparing EOR and REC,
    these were similar for maize N, cowpea N, pearl millet P and cowpea K. The EOR
    was more than REC for P applied to lowland rice and sorghum, both otherwise EOR
    was less than REC. Generally, the EOR determined from relatively recently conducted
    field research was less than REC. In four of the 25 crop nutrient response functions
    considered, the EOR was higher than REC, but the REC was on average 25% more than
    EOR. Therefore, the financially capable farmer loses profit opportunity by applying
    fertilizer at REC. The financially constrained farmer should normally be applying
    rates less than EOR to gain the advantage of the greater profit potential associated
    with steep crop yield response to increasing nutrient rates.


