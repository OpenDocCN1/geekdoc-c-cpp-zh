  md: '![](img/279f2242dca113ddfb6220d3a162ffff_125_0.png)


    # Figure 10.1: Agro-ecological zones of Mozambique overlain on climatic zonation
    of HarvestChoice.


    is currently under cultivation. However, mean cereal yields, including maize,
    are below 0.7 t/ha due to low soil fertility, drought, pests and disease. Smallholder
    agriculture makes little use of inputs, mechanization and irrigation to enable
    both the expansion and intensification of production. Average fertilizer use for
    crop land is only about 2 kg/ha and most smallholders use no fertilizer. Maize,
    lowland rice, cassava and bean are the priority crops of smallholders.


    # 10.2.1 Agro-ecological zones (AEZ)


    Mozambique has diverse farming systems associated with ten agro-ecological zones
    (AEZs) (Figure 10.1; Table 10.1) of which annual rainfall and elevation are important
    determinants (Figure 10.2). The most productive soils are Fluvisols such as in
    the valleys of the Zambezi, Incomate and Limpopo rivers. Sandy Arenosols are the
    dominant soil type covering approximately 28% of the country. Lixisols and Luvisols
    are important in medium altitude


