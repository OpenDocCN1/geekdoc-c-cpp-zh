    Typically, these adjustment practices may not apply to all cropland of a farmer
    but only to one or a few, if any, parcels of land. There may be opportunities
    to reduce fertilizer application for some land parcels and to reallocate that
    fertilizer or money elsewhere (Table 5.3). For example, for each ton of farmyard
    manure applied, P2O5 and K2O rates can be reduced by 2 and 3 kg/ha, respectively.
    With cereal-bean intercropping, however, fertilizer P rate should be increased.
    Soil test P is commonly low for smallholder fields and fertilizer P should be
    applied according to the FOT unless soil test P value is above 15 ppm by Mehlich
    III. Fertilizer K should be applied as recommended by the FOT unless the soil
    test K is less than 100 ppm when 40 kg/ha potassium sulphate should be applied,
    even if not recommended by the FOT.


