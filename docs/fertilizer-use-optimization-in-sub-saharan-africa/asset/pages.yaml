    A consequence of the very restricted fertilizer availability is that for the farmer
    to apply P to pigeonpea, cowpea, and soybean, three very profitable options in
    Figure 9.6, they also must pay for N and S in the compound fertilizer, even though
    there is no evidence of these crops having a response to these nutrients; therefore
    the benefits to fertilizer use for these crops is, in this example, much less
    than the potential indicated in Figure 9.6.


    Farmers and their advisors often do not have ready access to a computer for use
    of the Excel Solver® FOT. A paper-based FOT has therefore been developed for each
    Excel Solver® FOT for the mid-elevation, upland and plateau AEZ (Table 9.3). The
    paper FOT is constructed for


    three financial levels: 1) for the farmer who is poor and has no more money than
    one-third the amount required to apply fertilizer to all cropland at EOR; 2) for
    the farmer with more money but has no more money than two-thirds the amount required
    to apply fertilizer to all cropland at EOR; and 3) for the farmer with enough
    money to apply fertilizer to at least some of the cropland at EOR.


    The paper tool makes assumptions about: the calibration measuring units to be
    used by farmers in adjusting their eyes and feel for applying the right rate of
    fertilizer; crop row and plant spacing; fertilizer use costs per 50 kg bag; and
    expected commodity values on-farm at harvest, considering the value both for home
    consumption and for market.'
