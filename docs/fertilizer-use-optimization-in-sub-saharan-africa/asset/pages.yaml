    with the non-legume for available soil N. Given the amount and timing of soil
    N availability, soil N depletion by the non-legume may stimulate BNF. Most fertilizer
    N should therefore be applied in-season when the non-legume has a high rate of
    N uptake. Significant BNF may occur, such as with long duration pigeonpea or with
