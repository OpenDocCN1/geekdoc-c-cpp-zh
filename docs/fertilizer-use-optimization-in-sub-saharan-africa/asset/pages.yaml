- pgno: 100
  md: '![](img/279f2242dca113ddfb6220d3a162ffff_100_0.png)


    Figure 8.1: Natural regions of Mali.


    Sahel, Northern Sudan Savanna, pre-Guinean zone considered here as Southern Sudan
    Savanna and a transverse area called the Niger River Delta (Figure 8.1).


    The Sahara covers more than 50% of the country. It has an extreme spatial and
    temporal variability of precipitation. The annual rainfall is less than 200 mm
    and the temperature ranges from less than 14 to more than 42°C. The soils are
    sandy with low water retention capacity and much wind erosion occurs. Livestock
    can complement crops as the manure produced is a valuable resource if well used
    for crop production.


    In the Sahel, the average annual rainfall is 200 to 600 mm with a rainy season
    from July to September during which 79% of the rainfall is received (Table 8.1).
    Soils are generally low in organic matter and available nutrients. Soil erosion,
    especially by wind is of major concern. Cereals production is hampered by frequent
    drought occurrence. Cattle are the main livestock but sheep and goats are also
    important in the northern Sahel. Manure is important for soil fertility management
    in this zone, but the amounts produced are insufficient for farmers'' needs.


    The North Sudan Savanna is characterized by annual rainfall of 600 mm to 1100
    mm. The rainy season ranges from about 3 months in the north to 4 months in the
    south during which 90% of the rainfall is received (Table 8.1). Heavy rainfall
    causes leaching of nutrients. The most fertile soils are alluvial soils found
    in the lowlands (Soumaré 2004). This AEZ has the most agricultural potential in
    Mali. In addition to a relatively long rainy season and high rainfall, good soil
    water holding capacity in the lowlands allow for adaptation of many crops.


    The South Sudan Savanna corresponds to ecosystems of open forests and woodlands.
    This is the most humid climatic AEZ in Mali with an annual rainfall ranging from
    1100 to 1200 mm (Table 8.1). The rainy season is of 5 to 7 months duration and
    has some torrential rains which are major soil erosion factors. The soils consist
    of loam and sandy loam in the lowlands and there are areas of ferralitic soil.
    The wooded land covers 40 to 90% of the AEZ . Furthermore, favourable natural
    conditions allow the cultivation of several crop types including tubers, citrus,
    cereals and pulses. Major biotic constraints of this AEZ for agricultural productivity
    include insects, mites and birds.'
