    These recommendations were formulated from results of soil samples collected from
    non-georeferenced sites and, therefore, do not account for the indigenous potential
    supply of soils, climatic potential of the various AEZ, economic considerations
    and fertilizer availability.


    In Table 12.5, a synthesis of much research information is presented by crop and
    nutrient (cols1-2), and the response coefficients are presented in cols 3-5 for
    the curvilinear to plateau response function represented by the equation Y = a
    - bc^r where Y = yield, a = yield at the plateau of response to the given nutrient,
    b = yield increase at plateau in response to the nutrient, c is a curve coefficient
    and r is the rate of nutrient application. The yield increases associated with
    changes in nutrient rates are presented in cols 6-9. The EOR is the nutrient rate
    required to maximize profit per hectare from fertilizer use and the RECs are given
    in cols 10-11.


    In the Sahel Savanna, response of upland crops was greater to applied P compared
    with N, while lowland rice was more responsive to N. Cowpea and groundnut were
    not found to be responsive to N but had modest response to applied P and K.


    The field research based EOR were consistently less and generally less than half
    REC. Therefore, even for cases of no financial constraint on the amount of fertilizer
    use, the REC are well above the most profitable rates and therefore a profit opportunity
    is lost in applying according to REC. For farmers with financial constraints to
    fertilizer use, the most profitable rates will be less than the EOR as determined
    through use of FOTs. These results suggest that most of the RECs for primary fertilizer
    elements did not consider economic benefits.'
