- pgno: 16
  md: 'at the rate to maximize net returns to fertilizer use per hectare, also called
    the economically optimal rate (EOR). Financial ability level 2 represents the
    less financially constrained who are able to use less than two-thirds of the fertilizer
    applied to all cropland at EOR. Financial ability level 3 is for the farmer who
    can apply at EOR to at least some if not all cropland. Applying nutrients in excess
    of the financial ability level 3 is expected to result in declining profit.


    The paper FOTs are developed and updated with the Excel FOT, with the Central
    Kenya FOT (Figure 1.6) as an example. 1) Using the Excel FOT, current information
    is entered for crop values (considering expected ‘farm-gate’ price and value if
    kept for home consumption) and fertilizer use costs (price plus costs of procurement
    and application). 2) Enter 1 acre or hectare for each crop. 3) Run the FOT using
    an excessive budget constraint to ensure the fertilizer recommendations are not
    finance constrained and therefore at EOR; in the example, the budget constraint
    is KSh 2,000,000 which is an excessive amount but the FOT will only use that needed
    for EOR. 4) Optimize.


    From the output sheet (Figure 1.7a), get the ‘Total fertilizer needed’ and multiply
    the amount for each fertilizer by its cost for 50 kg. Total these to determine
    the amount of money required to apply fertilizers to one ac/ha for each crop at
    EOR. From the example, this gave a total cost of KSh 41,936. Keep a record of
    these fertilizer recommendations for each crop as these are the financial ability
    level 3 recommendations.


    Keeping all of the other input data unchanged, optimize with a budget constraint
    of 1/3 the total needed, that is KSh 13,979, for the financial ability level 1
    recommendations (Figure 1.7b). Repeat this for financial ability level 2 recommendations
    using KSh 27,597 (Figure 1.7c).


    Use the three sets of fertilizer recommendations to construct the paper FOT (Table
    1.2).


    Determine your calibration measuring units and their volume. In the example from
    Central Kenya, the measuring units are a 5 ml water bottle lid and a water bottle
    cut to 4-cm height with an 80-ml volume. Both units are readily available in rural
    areas. These units with guidance enable a farmer to calibrate by eye and feel
    the rate of application but, beyond this initial


    and occasional verification calibration, actual application is likely to be by
    hand and not with the unit. Add other assumptions including plant spacing, fertilizer
    costs and produce values. Write the recommendations for each level of financial
    ability giving the product, rate, method, and time of application and the calibration
    guidelines, for example ‘Lowland rice: Broadcast with a 2 m width 22 kg DAP (cut
    bottle at 8.1 m) and 17 kg MOP (cut bottle for 9.1 m) at planting; broadcast apply
    48 kg urea at panicle initiation (cut bottle for 2.1 m)’.


    # 1.7 Conclusion


    Optimization of fertilizer use is to maximize profit due to fertilizer use. This
    often means striving to apply fertilizer nutrients at rates for maximizing net
    returns per hectare due to fertilizer use, that is applying at EOR. However, smallholder
    farmers typically operate under severe financial constraint and need to obtain
    high returns on their often small investments in fertilizer use. Their capacity
    to apply fertilizer is typically for rates well under EOR so they need to apply
    crop-nutrient options that have high profit potential.


    Linear programming was used to develop fertilizer optimization tools (FOTs) that
    aid farmers in their choice of crop-nutrient-rate combinations likely to be most
    profitable given a budget constraint. Development and use of Excel and paper FOTs
    has been described.


    Not addressed in this chapter is that optimization of fertilizer use needs to
    consider that other practices and field conditions affect nutrient availability.
    Therefore, FOT recommendations need to be adjusted for such practices as recent
    and past manure application, rotation with a legume, intercropping and use of
    a green manure crop. Soil test information should also be considered. Such practices
    are addressed in Chapter 3 and in the country chapters 4-16.


    # 1.8 References


    Bekunda MA, Bationo A, and Ssali H (1997) Soil fertility management in Africa.
    A review of selected research trials. In Burcu RJ, Sanchez PA and Calhoun F (eds)
    Replenishing soil fertility in Africa. SSSA Spec. Publ. 51 SSSA, Madison WI. p.
    63–79.'
