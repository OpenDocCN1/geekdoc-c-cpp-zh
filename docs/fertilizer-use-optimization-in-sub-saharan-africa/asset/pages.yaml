    # ## 7.1 Agricultural systems of Kenya


    # ### 7.1.1 Introduction


    Agriculture is essential for sustainable development, poverty reduction and enhanced
    food security in many sub-Saharan African (SSA) countries. The economic pillar
    of Kenya’s Vision 2030 Strategy puts the agricultural sector among the six key
    growth drivers of the economy (GoK 2014). Agricultural productivity contributes
    about 30% to its Gross Domestic Product (GDP) and 60% to foreign exchange earnings.
    About


    75% of Kenya’s population of approximately 42 million works in the agricultural
    sector. Only about one third of Kenya’s total land area, from the Kenyan highlands,
    the coastal plains and the lake region, is used for crop production (Fig. 7.1).
    The rest of the land area, which is semi-arid to arid, is used for pastoralism.


    # ### 7.1.2 Agro-ecological zones (AEZ)


    The zonation most used in Kenya for economic planning and agricultural development
    is by Jaetzold and Schmidt (1983). Kenya is divided


