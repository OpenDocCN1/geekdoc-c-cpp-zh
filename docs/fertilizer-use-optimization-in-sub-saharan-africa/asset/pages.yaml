    all rates of N and P application which ranged from 17 and 5 kg/ha of N and P to
    64 and 20 kg/ha of N and P, respectively (Table 3.5) (Sime and Aune 2014).


    **The right time.** The time of fertilizer application is important. It is very
    common to apply P, some N and maybe K and/or other nutrients before or at planting
    as often there is a pop-up effect to stimulate early growth and root development.
    Delay in basal fertilizer application can result in yield loss as found by Sakala
    (1998) in Zambia. In cases of risk of poor crop establishment, however, this basal
    application may be more wisely done shortly after crop emergence and maybe with
    a rate adjustment according to establishment success. In-season application of
    some N is a common practice globally and in SSA, and is especially beneficial
    on sandy soils and where much rainfall occurs during the season (Zingore et al.,
    2014). An important advantage of in-season N application, in addition to reduced
    risk of N loss to leaching, is that the farmer can judge the condition of the
    crop and may decide in cases of poor crop condition, due to biotic or abiotic
    problems or to management, to apply no or a reduced rate of N. This adaptive management
    is expected to increase in importance as the frequency of extreme weather events
    increases. In-season N application should


    ![](img/279f2242dca113ddfb6220d3a162ffff_35_0.png)


    **Figure 3.5:** Effect of fertilizer application method on maize yield in Malawi.
    (Adapted from a presentation by Benson T.D.) http://www.slideshare.net/IFPRIMASSP/maximizing-returns-to-fertilizer-use-on-maize-in-malawi-lessons-from-onfarm-agronomic-research-by-todd-benson-ifpri.


    correspond to near the beginning of very rapid N uptake by the crop, such as at
    the 8-leaf stage of maize.


    **The right place.** Placement of fertilizer is important. Placing the fertilizer
    at a point under or very near the seed or plant creates the risk of fertilizer
    salt damage. Legumes with tap roots are especially vulnerable to high salt fertilizers,
    such as KCl placed under the seed, even if well covered with soil. Point or band
    placement of basal fertilizer, at least 5 cm from the seed or plant, is often
    more efficient than broadcast application for maize and other crops with widely
    spaced planting when fertilizer application rates are low but there are exceptions
    (Figure 3.5).


    Deep placement of urea super granules (USG) may add to N use efficiency in lowland
    rice production. The USG are oval compacted pellets, commonly of 1.8 or 2.7 g,
    produced using briquetting machines. One USG is placed at 5–7 cm depth in puddled
    transplanted rice fields at one week after transplanting between four rice plant
    stands spaced at 20 × 20 cm. No additional fertilizer N is applied. Benefits to
    the use of USG'
