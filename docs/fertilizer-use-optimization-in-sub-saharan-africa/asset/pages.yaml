    # 16.5 Fertilizer optimization tools for Zambia


    Decisions on choices of amount of each fertilizer to apply to each crop are very
    complex if the intent is to maximize potential for profit and if the farmer prefers
    to have several different crops. The nature of the response of each crop to each
    applied nutrient needs to be considered, but also the farmer''s land allocation
    to different crops, the expected value of the grain on-farm near harvest time
    considering the value of the grain kept for home consumption and that to be marketed,
    the costs of fertilizer use and the money that the farmer has available for fertilizer
    use. Therefore, easy to use fertilizer optimization tools (FOTs) have been developed
    which use complex mathematics of linear programming to integrate economic and
    agronomic information (http://agronomy.unl.edu/OFRA).


    For each Excel FOT, there is a companion paper FOT to be used when a computer
    is not available (Table 16.2). The paper FOT has three financial levels as follows:
    Level 1 for the poor farmer who has no more money than one-third of the required
    amount to buy the fertilizer to apply to all the cropland at the rates to maximize
    profit per hectare, also referred to as the economically optimal rate (EOR); level
    2 for the farmer who has no more than two-thirds of the money to apply fertilizer
    to all cropland at EOR; and level 3 for the farmer with enough money to apply
    fertilizer to some cropland at EOR. The paper FOT begins by stating assumptions:
    the volume of measuring units to be used by farmers in adjusting their eyes and
    feel for applying the right rate of fertilizer; inter- and intra-row spacing of
    plants; the costs of fertilizer use per 50 kg bag; and the expected commodity
    values on-farm at harvest, considering the value of both home consumption and
    for market.


    The FOTs work in Excel Solver® (Frontline Systems Inc., Incline Village, NV, USA).
    Use of the FOT requires that the add-in Solver be activated and that macros are
    enabled; this is addressed in the ''Help and Instructions'' worksheet of the FOT
    and in more detail in an FOT user manual in Extension Training Materials at http://agronomy.unl.edu/OFRA.


    The paper FOT advises on the fertilizer to use and the application rate for each
    crop according to the farmer''s financial level but also includes the method and
    time of application, thereby advising on the 4Rs of fertilizer use. It also advises
    on calibration to help the farmer to adjust his/her eyes and feel to the rate
    of application, that is a water bottle lid full of fertilizer is sufficient for
    so many metres of band application or so many plants.


    The data input screen (Figure 16.4) requires entry of the land area to be planted
    to each crop and the estimated on-farm value per kilogram of grain near harvest
    time. The cost of using different fertilizers and the available money of


