- pgno: 77
  md: 'Other practices with fertilizer substitution value considered in Table 6.3
    include having a green manure crop and a cereal following a legume in rotation.
    Intercropping may require more fertilizer than the sole crop. Soil test values
    are considered. Soil test P is commonly low for smallholder fields not near the
    household and P should be applied according to the FOT unless the soil test P
    value is above 20 mg/kg by Bray 1 for soils with pH of less than 7 or above 30
    mg/kg by Olsen for soils with pH greater than 7. Fertilizer K should be applied
    according to the FOT unless the soil test K is less than 100 ppm when 15 kg/ha
    muriate of potash or potassium sulphate should be applied.


