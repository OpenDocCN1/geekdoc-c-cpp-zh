    # 5.5 Fertilizer use optimization tools


    The decision on choices of crops, fertilizers to apply and the amount of each
    nutrient to apply requires consideration of several factors. Agronomy of nutrient
    responses for different crops that the farmer plants must be considered together
    with the farmer''s land allocation to each crop, the expected commodity values,
    the costs of fertilizer use and the money available for fertilizer use. Soil test
    information and other practices that may affect the need for applied nutrients
    must be considered as well. With all these considerations, fertilizer optimization
    tools (FOTs) and a fertilizer rate adjustment tool were developed to help farmers
    decide on nutrient management for maximization of profit.


    # 5.5.1 The Excel Solver FOT


    Excel Solver ® (Frontline Systems Inc., Incline Village, NV, USA) fertilizer optimization
    tools (FOTs) were developed for each of the 13 recommendation domains. The FOTs
    use complex mathematics of linear optimization but are easy to use.


    The farmer needs to estimate how much land will be planted to each crop of interest,
    estimate the farm gate value per kg at harvest time considering that some is for
    home consumption (the most valuable) and the surplus will be marketed, and the
    costs of using different fertilizers (Figure 5.6). The amount of money which the
    farmer will invest in fertilizer use is also entered. In this example, the farmer
    allocates crops to four hectares and has EtB 6000 available for fertilizer use.
    Clicking on the ''Optimize'' button then runs the optimization calculations.


    The results are displayed as in Figure 5.7, including the amount of each fertilizer
    to apply to each crop, the expected average yield increases and net returns, and
    the total net returns to fertilizer use for the farm. Each of the selected crops
    has a recommendation for some fertilizer


    allocation. However, only 21 kg/ha of DAP is recommended for barley, which may
    be too little for feasible application and the farmer may want to allocate the
    fertilizer or the money elsewhere. A total of 241 kg/ha of DAP and 136 kg/ha of
    urea were recommended. No financial application was recommended with this financial
    constraint. Net returns per hectare were highest for high potential maize, teff
    and faba bean, suggesting that the farmer may want to allocate more land to these
    crops, especially to faba bean, which achieves higher returns with relatively
    little fertilizer recommended. Expected average net return for this scenario is
    EtB 44,324 and a benefit to cost ratio of greater than 7. It is advisable that
    the farmer will use some of these net returns to gradually reduce financial constraint
    to fertilizer use and eventually apply fertilizer at EOR to all cropland.


    # 5.5.2 The paper FOTs


    Very often farmers and their advisors do not have access to a computer. Therefore,
    companion paper FOTs were developed for each recommendation domain (Table 5.2).
    The paper FOT is devised for three financial levels: 1) for a farmer who has no
    more money than one-third the amount required to apply fertilizer to all cropland
    at EOR; 2) for a farmer with more money but no more money than two-thirds the
    amount required to apply fertilizer to all cropland at EOR; and 3) for a farmer
    with enough money to apply fertilizer to at least some cropland at EOR.


    The paper tool makes assumptions about the:


    +   - calibration measuring units to be used by farmers in adjusting their eyes
    and feel for applying the right rate of fertilizer

    +   - crop row and plant spacing

    +   - fertilizer use costs per 50-kg bag

    +   - expected grain values at on-farm at harvest, considering value both for
    home consumption and for market.


    The paper FOTs address the 4Rs of nutrient stewardship advising on the right product,
    rate, time and method of fertilizer application. It also advises on calibration,
    that is, the length of the band or distance, or the number of points, covered
    by one measuring unit for the recommended fertilizer rate.'
