  md: 'groundnut are in the southern part of Maradi, Dosso and Zinder regions. Maize
    is mostly produced in the southern part of Maradi and Dosso in valleys where soil
    has relatively more clay.


    Crop responses to N, P and K were determined for important food crops in each
    AEZ using results of past and recent field research (Tables 11.2a,b). The first
    two columns are for crop and nutrient. Columns 3-5 have coefficients a, b, c for
    the curvilinear to plateau response function, Y = a - bc². The next four columns
    report the expected average yield increase with increased nutrient rates compared
    with the next lower rate, and the right most columns are for the optimized nutrient
    rate for maximizing profit per hectare due to fertilizer use (EOR) compared with
    the current or recently recommended rate (REC).


    Any nutrient application in excess of the field research based EOR is expected
    to result in loss of profit. Any nutrient application at less than EOR means less
    than maximum potential net return to fertilizer use per hectare but lower rates
    are typically most profitable with financially constrained fertilizer use.


    The greatest yield increases, the b value and for the first increment of applied
    nutrient, in the Sahel were with rice and maize response to N (Table 11.2a). Sorghum,
    pearl millet and maize had relatively large responses to P. Response to K was
    relatively small, but greatest with rice and least with cowpea.


    RECs were generally higher than EOR but similar for maize N and P and for sorghum
    P, while EOR P was relatively high for pearl millet. The EOR for groundnut P and
    K applied to cowpea and groundnut were determined but there were no RECs for these
    crop-nutrient combinations.


    In the North Sudan Savanna, the greatest yield increases were with N applied to
    maize and sorghum. Sorghum also responded well to P (Table 11.2b). Of the legume
    crops, groundnut response to P and cowpea responses to N and K were relatively
    large. The RECs were high compared with EOR except for N applied to maize.


    Over all comparisons of both AEZ, the REC was more than EOR for 73% of the cases
    and the mean of recommended nutrient rate compared with EOR was 60% higher.


