    Most farmers use little if any fertilizer and are not well informed on proper
    fertilizer use, time of application and suitability of different products. This
    also applies to their advisors. Effective fertilizer use requires a well-managed
    crop, but also proper use of the fertilizer. Farmers and extension advisors need
    to be aware of 4R Nutrient Stewardship including: applying the right source of
    nutrients, at the right rate, at the right time, and with the right method. Fertilizer
    use is very costly in Uganda. Sales and demand are low and the fertilizer supply
    chain is not well developed. Fertilizer subsidies are needed at least on an interim
    basis to sufficiently increase demand for fertilizer, so the supply chain can
    become more efficient (Kaizzi 2012).


    nutrient balances in all AEZ of Uganda (Table 15.2), especially for K in the south-west.
    The common practices by farmers are tillage using either hand hoes or animal traction
    and residue removal.


    Current soil fertility management practices include the use of farmyard manure,
    crop residues, compost, fertilizer, plus crop rotation and, in some places and
    with declining frequency, leaving the land fallow for a few years. Unfortunately,
    manure and fertilizers are used on only 7 and 1% of the land parcels annually
    and by 24 and 2% of smallholders, respectively (UBOS 2006, 2010). Some farmers
    attempt to control runoff and erosion, but are not always successful. Others make
    little effort. Crop residues for land application are scarce with competing fuel
    and feeding demands. Manure use requires much animal labour and the nutrient content
    is low. Green manure production has been proven effective in supplying N to the
    following crop but requires land that could be used for food or cash crops and
    is not much practised. Transfer of plant materials from field boundary areas,
    or nearby fallow or grazing areas, often has potential in sub-humid areas but
    less potential in semi-arid areas; its practice is mostly limited to banana production.


    Current fertilizer recommendations (REC) are not site specific, originate from
    the 1970s and call for high rates of application for maximizing yield. Examples
    of the existing recommendations include: for maize, apply 125 kg/ha diammonium
    phosphate (DAP) at planting and 125 kg/ha urea when maize is approximately 1m
    tall; for finger millet, broadcast apply 125 kg/ha ammonium sulphate when plants
    are about 15 cm tall; for sorghum, apply 110 kg/ha of SSP at planting and 110
    kg/ha of CAN about 3 weeks after planting (NARO 2001).


    # 15.3 Diagnosis of nutrient deficiencies in Uganda


    Trials supported by the Optimizing Fertilizer Recommendations in Africa (OFRA)
    project were conducted both on farmers’ fields (OFT) and at research stations
    (RMT). The mean response of finger millet was 124, 14 and 3% to N, P and K over
    33 site-season-variety comparisons. The trials included treatments to determine
    if the nutrient package of N+P+K+Mg+S+Zn+B, referred to as a diagnostic treatment,
    compared with N+P+K resulted in increased yield of finger millet. The results
    indicate that one or more of Mg, S, Zn and B are limiting yield as observed from
    yield increases of 39 and 64% in on-farm trials (OFT) in Palissa and Tororo, respectively.
    The average effects of the diagnostic treatment ranged from negative to a 29%
    increase with researcher managed trials in Tororo and Apac, respectively (Figure
    15.4).


