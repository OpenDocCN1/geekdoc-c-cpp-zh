    The FOT recommendations are intended for the current season because both fertilizer
    costs and commodity prices vary seasonally. Good prediction of commodity values
    improves the optimization for a current season.


    Once the optimal fertilizer rates are known, the farmer needs to know how to apply
    the fertilizer at the right rate. Therefore, the Nigerian OFRA project developed
    a calibration tool to guide application for the correct rates. The calibration
    tool is a reminder that optimization of fertilizer use does not include haphazard
    application. The Excel calibration tool offers options of measuring units of different
    volumes that are common in Nigerian rural communities. The type of fertilizer
    needs to be selected as fertilizers differ in specific gravity. Method of application
    and plant spacing are information


    provided. Depending on the amount and type of fertilizer that will be applied,
    the tool provides the application solution.


    The Nigeria calibration tool used Faro brand water bottle caps (FARO-9ml), Gino
    brand tomato cans (GINO-70ml), and Peak Milk brand tins (PEAK-180ml). These measuring
    units were selected because of their availability in rural communities. The calibration
    units were designed to provide the farmer with visual estimates of fertilizer
    to be applied for a broadcast area, metres of band, or number of plants in the
    stand. After the farmer has ‘calibrated’ her eye and feel for the rate, the farmer
    proceeds with the actual fertilizer application free-hand.


    # 12.7.2 Paper fertilizer optimization tools


    The Excel FOT is useful for scientists, fertilizer retailers, extension staff
    and others with good computer access. However, paper versions of FOTs were developed
    for use by farmers and their advisors when a computer is not available (Table
    12.3).


