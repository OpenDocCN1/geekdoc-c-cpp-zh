    healthier and more vigorous root systems for more effective nutrient uptake for
    cereals following legumes compared with following a cereal.


    # 3.3.6 Cereal-legume rotation


    Studies across SSA and elsewhere have found rotation benefits of increased yield
    both for the cereal following the legume and the legume following the cereal in
    rotation compared to cereal or legume continuous production. These rotation benefits
    commonly are 5 to 15% yield increases, although cases of much lower and others
    of much greater benefit have been reported, as by Mason et al. (2015). The percent
    but less so the magnitude of yield increases due to rotation are often greater
    with low compared with adequate soil fertility situations. Some of the rotation
    benefit to the following cereal crop may be due to increased N availability but
    the benefit can occur even when adequate fertilizer N is applied. Breaking disease
    and insect cycles likely contributes much to rotation benefits. Soil microbial
    communities are affected by the previous crop and the type and quantity of crop
    residues produced as well as the type and quantity of organic materials applied
    (Kamaa et al., 2011); these shifts may contribute to the rotation effect such
    as more effective colonization of roots by vesicular arbuscular mycorrhiza that
    contribute to improved nutrient and water uptake.


    Soil organic matter during the legume compared with the cereal phase of the rotation
    typically shows some decline as photosynthesis and biomass production is typically
    less during the legume phase while plant and soil respiration are similar for
    both phases. This decline is at least partly if not fully compensated for by increased
    productivity of the rotation compared with cereal monoculture. However, rotation
    of a cereal with an annual leguminous pulse or oil seed crop, with its numerous
    benefits, should not be seen as a means to increasing soil organic matter.


    Legumes in rotation can add much to the N balance of a farm operation through
    BNF (Table 3.4). However, harvest of forage and grain legumes typically removes
    more than the equivalent of the N derived from BNF. Legumes prefer to use available
    soil N as BNF requires plant energy. Soil mineral N is often observed to be more
    depleted following a pulse compared with a cereal harvest. Even so, fertilizer
    N need for the cereal following a legume in rotation is commonly less, even with
    the increased yield due to the rotation effect, compared with continuous cereal
    production. This N benefit is likely due to factors other than a direct contribution
    from the legume crop that may include: relatively quick decomposition of the legume
    leaf residue compared with cereal crop residue; less crop


    Fertilizer P use may differ for cereal-legume rotations compared with continuous
    production of a single crop with evidence that the cereal is less responsive to
    applied P following a legume compared with a cereal. Application of fertilizer
    P often results in increased BNF by legumes. Some therefore advise that rather
    than applying fertilizer P every year, all fertilizer P be applied to the legume
    and to produce the cereal on the residual P. However, other evidence contradicts
    this in that the legume such as soybean is less sensitive to low soil test P than
    maize, resulting in a preference to apply all fertilizer P to maize and producing
    soybean on the residual P. In cases of high P fixation by the soil and where fertilizer
    use is constrained by inadequate finance, application of some fertilizer P each
    year may be most profitable and preferred. The OFRA approach to optimizing fertilizer
    use is to maximize profit. With poor farmers, this profit needs to be gained within
    a short time and they cannot afford to wait for more than a year for production
    to benefit from the residual effect of a fertilizer application. Therefore fertilizer
    use decisions need to be based on the expected net returns with the next crop.
    As seen from the country chapters of this book, net returns for P application
    to legumes compared to non-legumes are overall relatively good.'
