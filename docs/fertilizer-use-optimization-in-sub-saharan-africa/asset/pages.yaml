    # 10.5 Fertilizer use in an integrated nutrient management framework


    Optimization of fertilizer requires good agronomic practices such as for variety
    selection, planting and control of weeds, insect pests and diseases. Some practices
    such as manure application or intercropping, and soil test results, may have implications
    for the optimal fertilizer rate. These are not considered in the FOTS which are
    for sole crop production and assume that soil N and P availability is sufficiently
    low for profitable response to nutrient application. Therefore, these factors
    are considered as a second step in the fertilizer use optimization decision process
    using a one-page decision guide (Table 10.3).


    The use of green manure and the application of manure calls for adjustment of
    fertilizer rates. The fertilizer substitution value varies with the quality of
    manure. Poultry and dairy


    manure are expected to have greater fertilizer substitution value than farmyard
    manure which has had much exposure to the weather and is mixed with soil. Other
    practices with fertilizer substitution value include bringing material such as
    tree prunings into the field, rotations and intercropping. Soil test information
    should be considered. When soil test information is not available, soil test P
    should be considered low and fertilizer P applied according to the FOT recommendations.
    If soil test P by Mehlich 3 is above 18 ppm, do not apply fertilizer P to that
    field until soil test P is found to be below this level. If soil test K is found
    to be < 0.25 cmol/kg or <100 ppm, apply K even if not recommended by the FOT.
    As an example, “For each 1 t of fresh leguminous leafy tree prunings applied (e.g.
    gliricidia, leucaena, sesbania, senna”), the urea, TSP or DAP, or NPK rate can
    be reduced from the FOT recommendation for the field by 10, 1 and 6 kg/ha, respectively.
    The prunings may be from alleys within the field, field boundary areas, or nearby
    treelots.


