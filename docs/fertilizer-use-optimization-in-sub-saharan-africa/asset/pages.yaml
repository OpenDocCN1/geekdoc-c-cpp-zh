  md: '# 5. Optimizing Fertilizer Use within an Integrated Soil Fertility Management
    Framework in Ethiopia


    Negash Demissie negash34@gmail.com and Israel Bekele

    Ethiopian Institute of Agricultural Research, P.O. Box 2003, Addis Ababa, Ethiopia


    # 5.1 Agricultural systems in Ethiopia


    Agriculture is important for human welfare and economic growth in Ethiopia. Gross
    domestic product (GDP) from agriculture in Ethiopia is 41.6% of the total GDP.
    Exports are dominated by agricultural products and more than 80% of the population
    in Ethiopia depends on agricultural production for their livelihood. Ethiopia''s
    12.7 million smallholder farmers account for approximately 95% of agricultural
    GDP (Central Statistics Agency 2013).


    With a total area of about 1.13 million km² and about 0.51 million km² of arable
    land, and with actual yields less than 25% of water-limited potential yield, the
    country has a tremendous potential for rainfed agricultural development (Global
    Yield Gap Atlas 2016). Nitosols (23%), Cambisols (19%) and Vertisols (18%) are
    the major agricultural soil groups in Ethiopia (Dubale 2001).


    About 11% of total cultivated land is used by more than 6 million smallholders
    to produce non-food products. Cereal production occupied about 86% of the cropland
    with major cereals such as teff, maize, sorghum and wheat accounting for an estimated
    24%, 17%, 15% and 13%, respectively, of cropland use during the main cropping
    season in 2015.


    Use of fertilizer, seed of improved varieties, pesticides and irrigation remains
    low and agricultural production is primarily managed by low input-output rainfed
    smallholder farmers. Lack of timely input supply adds to the problem. Land holdings
    are small and fragmented.


    Only 30–40% of smallholders use fertilizer (Spielman et al. 2011). Average fertilizer
    may be about 40 kg/ha of cropland. Farmers used improved seed on only 4.7% of
    cropland in the 2007/08 crop year (Spielman et al. 2011). Local


