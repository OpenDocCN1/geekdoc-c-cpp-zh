- pgno: 138
  md: 'P2O5, respectively, for pearl millet and sorghum (Tabo et al., 2007; Saidou
    et al., 2014; Maman et al., 2015) and maize (MDA 2012).


    The policy of fertilizer use in Niger is defined in the document ‘Stratégie décentralisée
    et partenariale d’approvisionnement en intrants pour une agriculture durable (SIAD),
    Août 2006’ with an objective to increase fertilizer use to an annual average application
    of 8 kg/ha/yr of nutrient elements.


    CAIMA has regional and district input stores to facilitate farmers’ access to
    fertilizer at low costs compared with open market prices. However, CAIMA often
    does not supply the most appropriate fertilizer types.


    Extension workers and agro-input dealers are not well informed of good agronomic
    practices for fertilizer use and fail to advise farmers well. Good fertilizer
    use practices are summarized as the 4R Nutrient Stewardship approach, consisting
    of applying the right source of nutrients, at the right rate, at the right time
    for efficient uptake by the crop and in the right place to be accessible by plant
    roots. The 4Rs can result in increased crop yields and incomes, and prevent soil
    nutrient depletion.


    # 11.2 Diagnosis of nutrient deficiencies in Niger


    In Niger, P, followed by N, is generally considered to be the most limiting nutrient
    for crop production. In 30 recently conducted trials as part of the Optimizing
    Fertilizer Recommendations in Africa (OFRA) project, the average yield increases
    across all crops were 50, 29 and 16% with P, N and K application, respectively
    (Figure 11.2). These trials included a diagnostic treatment of N+P+ K+Mg+S+Zn+B
    that was compared with a treatment of the same N+P+K rates for non-legumes. A
    similar comparison was made for legumes with N omitted. The results determined
    that if one or more of Mg, S, Zn and B are limiting yield once N, P and K are
    applied. There were mean increases in yield of 12 and 7% due to the diagnostic
    package for trials conducted on farmers’ fields and on research stations, respectively
    (Figure 11.2a).


    The average yield increases due to the secondary and micro nutrients were similar


    ![](img/279f2242dca113ddfb6220d3a162ffff_138_0.png)


    ![](img/279f2242dca113ddfb6220d3a162ffff_138_1.png)


    for cowpea, sorghum, groundnut and pearl millet (Figure 11.2b). Further investigation
    is needed to determine which of these four micro- and secondary nutrients are
    most commonly deficient in the Niger upland soils. Other nutrient deficiencies
    are likely to gain in importance as fallow is reduced and crop residue is removed
    from the fields.


    # 11.3 Optimizing fertilizer use in Niger


    Farmers want fertilizer use to be sufficiently profitable. Farmers with adequate
    finance strive to maximize net returns per hectare resulting from fertilizer use.
    For the finance constrained farmer, investment in fertilizer use competes with
    other livelihood needs. Therefore, investments in fertilizer must give high benefit
    to cost ratio with little risk. Fertilizer use optimization in this context refers
    to maximizing profit from fertilizer use: profit per hectare for farmers with
    adequate finance; and maximum benefit to cost ratio on the small investment in
    fertilizer by the financially constrained farmers.


    Crop yield response to applied nutrients can be captured with a curvilinear to
    plateau yield response as shown for sorghum response (vertical axis or y-axis)
    to applied P (horizontal axis or x-axis) (Figure 11.3) with a steep yield'
