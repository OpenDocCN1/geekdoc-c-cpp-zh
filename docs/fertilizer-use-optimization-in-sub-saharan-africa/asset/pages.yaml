  md: '# 10. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Mozambique


    Ricardo Maria¹ ricardo_dejesus@hotmail.com, Janete Americano¹, Jossias Matusso²
    and Cláudio Gundana³

    ¹ Instituto de Investigação Agrária de Moçambique (IIAM), Av. Das FPLM No. 2698,
    Caixa Postal 3658, Maputo, Mozambique

    ² Agência de Desenvolvimento de Manica (ADEM), Rua 16 de Junho, n° 217, Chimoio,
    Mozambique

    ³ Africa Fertilizer Agribusiness Partnership (AFAP), P.O. Box 1218, Maputo, Mozambique


    # 10.1 Introduction


    Inadequate soil fertility is an important constraint to crop production in Mozambique.
    Soil pH is mostly moderate but high sand content and low soil organic matter commonly
    contribute to low nutrient availability and low available soil water holding capacity.
    Most crop production is by smallholders who are poor and unable to invest much
    in the use of inputs. Their severe financial constraint requires that they obtain
    high rates of return on their small investments and the investment must have a
    low rate of risk. A farmer typically faces different choices in fertilizer use
    and needs to choose the crop-nutrient-rate combinations that are expected to be
    most profitable with a low risk. Such decisions need to be based on solid information
    derived from field research. The Instituto de Investigação Agrária de Moçambique
    (IIAM) therefore partnered with


    national agricultural research organizations of 12 other countries under the AGRA
    funded project Optimizing Fertilizer Recommendations in Africa (OFRA) with management
    support from CABI and technical and scientific support from the University of
    Nebraska–Lincoln. This partnership improved the field research derived information
    base needed for optimizing fertilizer use, applied the information to develop
    easy to use decision tools (FOTs) for three broad recommendation domains in Mozambique,
    and provided training to research and extension personnel for advising farmers
    on fertilizer use optimization.


    # 10.2 Agricultural systems of Mozambique


    Agriculture in Mozambique is practised mainly by smallholder farmers with less
    than 5 hectares of crop production. There are over 3 million smallholder family
    farms which is 99% of all farms accounting for 95% of the cultivated land. About
    25% of 36 million hectares of arable land


