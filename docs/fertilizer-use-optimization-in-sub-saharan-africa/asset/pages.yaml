  md: 'availability, but loam soils are common near Gulu town. With loam upland soils
    and clay valley soils of moderate nutrient supply, the land of Kigumba is of medium
    productivity and is important for maize and cotton production. In the south-east
    part, red loam soils are associated with the higher slopes, brown sandy soils
    are common on the lower slopes, and dark clay soils predominate in the valleys
    (Figure 15.3). The soils near the Pager and Agaga rivers are high in clay but
    are often acidic and have low nutrient supply. Throughout this AEZ, maize, cotton
    and other crops are likely to be very responsive to application of moderate amounts
    of N and P.


    The Western Mid-altitude Farmlands is a large, widely dispersed and variable AEZ,
    receiving between 1000–1200 mm per year of bimodal rainfall (Table 15.1). The
    first season is shorter with mean rainfall of 360 mm during March-May and the
    second season receives mean rainfall of 485 mm during August-November. The population
    density is 78 persons per km². The food crops are diverse with banana the most
    important, followed by maize, bean and sweet potato. Maize is more important in
    the eastern part of the AEZ while sweet potato, cassava and groundnut are more
    important in Kabarole. Livestock keeping is important. The soils in the west are
    often shallow, coarse-textured and acidic; patches of deeper soil are cultivated
    (Figure 15.3). Areas in Kibale have loam soils. In northern Mubende and Kiboga,
    the soils are shallow except on the lower slopes where brown loam, typically a
    metre deep, occurs. Shallow soils at the base of rock outcrops are often intensively
    cultivated. In western Mubende, more productive loam and clay loam soils occur
    on the mid-slopes; productivity is low to medium. Maize, cotton and other crops
    are likely to be very responsive to application of moderate amounts of N.


    South-western Highlands (1400–1800 masl) includes the South-western Medium Highlands
    and Bushenyi-North Rukungiri which receives 1000–1200 mm/yr of bimodal rainfall
    (Table 15.1). June and July are the driest and coolest months. Rainfall is sufficient
    for good crop productivity and is most reliable during the second season. Population
    density is about 202 persons per km². Banana is the major crop


    and is commercially important. Other important food crops are bean, maize and
    sweet potato. Cattle and goat production are major activities. The soil is typically
    dark, deep and often acidic, but nutrient supply is generally good in the South-western
    Medium Highlands (Figure 15.3). In Bushenyi-North Rukungiri, tea and coffee are
    important cash crops and the soils are commonly sandy loam in the south-west and
    loam in the north-east and are often acidic.


    The South-western Highlands (>1800 masl) includes the Kabale–Rukungiri Highlands
    and Kabale-Kisoro Highlands with 1000–1200 mm and >1200 mm/yr, respectively, of
    bimodal rainfall (Table 15.1). June and July are the driest and coolest months.
    The respective mean population densities are 244 and 309 persons per km². Sorghum
    is sown in December and January and other crops are sown mainly in March for the
    first season. The second season is from September through December. Rainfall peaks
    in April and November. The main crops are banana and bean, followed by maize and
    sweet potato. Sorghum, finger millet and Irish potato are also important. This
    AEZ is important for Uganda’s production of Irish potatoes. In the Kabale-Rukungiri
    Highlands, much of the soil is acid loam, but nutrient supply is generally good
    and productivity is medium to high. In the Kabale-Kisoro Highlands, the soils
    are dark brown, often acid and low in base, and are derived from basalt, lava,
    ash and, in places, phyllite (Figure 15.3). In the south, the humose brown loam
    soils are typically of moderate to high productivity. In the north, soils are
    acidic with low base supply and low productivity. Waterlogged valley soils are
    often high in sulphur (S), which leads them to become acidified upon aeration
    following drainage.


    # 15.2 Current soil fertility management


    The soils in Uganda are of inherently poor soil fertility with low nitrogen (N)
    and phosphorus (P) availability. Soil fertility is associated with soil organic
    matter in the top 20 cm depth which is susceptible to losses through erosion once
    vegetation cover is removed, resulting in permanent loss of soil fertility and
    land productivity. Nutrient removal in crop harvests and losses through runoff
    and soil erosion is not adequately compensated by using crop residue, manure and
    fertilizer resulting in negative'
