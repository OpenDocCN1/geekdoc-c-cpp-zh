    # 3.3.9 Biochar


    Biochar is charcoal or pyrogenic carbon that is applied in small pieces to amend
    soil (Guo et al., 2016). The major advantage of adding biochar compared with the
    original organic material is that the biochar C is much more persistent in the
    soil compared to the C applied in organic resources. The half-life in soil of
    C applied in organic materials is typically less than a year as decomposition
    occurs through soil microbial activity with C released to the atmosphere through
    microbial respiration. In comparison, the half-life of biochar C in the soil may
    longer than 100 years.


    Biochar application increases cation exchange capacity, water holding capacity,
    soil aggregation and soil porosity. The amendment effect is expected to be greatest
    with soils of low nutrient supply and low water holding capacity. Such soils amended
    with biochar can have much improved response to applied nutrients. The benefit
    of biochar is expected to be less with soils that are relatively good for these
    properties and more where there is greater opportunity for improvement of these
    soil properties. The biochar is not a good C and energy source for soil microbes
    but can enhance microbial habitat. The magnitude of effects varies with the rate
    of application. Biochar in most cases will be a very limited resource as are organic
    resources for soil management, but what is potentially available could often be
    used to great benefit.


    There is some traditional ''biochar'' practice with smallholders of SSA although
    it has not been recognized as such. In Madagascar, there is a tradition of ''burning''
    low productivity Ferrasols and Andosols, the latter with very high P fixation
    capacity. At the end of a fallow period, they do not pile and do combustion burning
    of the bush and grass plant material. Instead, furrows of approximately 20 cm
    depth are dug, the dried plant material arranged in the furrows, and then covered
    using the excavated soil. The furrow ends are left open and the material ignited.
    Once ignited, pyrolysis slowly progresses down the covered furrow for a week or
    more with little oxygen supply, charring the covered plant materials. Subsequent


    production over these burn furrows is much greater than for unburnt soil. The
    combined benefit of heating the soil, ash deposition and biochar has not been
    well differentiated but it is expected that the biochar effect will be long term.
    It is likely that even with slash and burn systems, significant amounts of existing
    soil C is pyrogenic C due to incomplete combustion of some of the vegetative material.


    The feasibility of biochar depends on the availability of plant materials and
    of the potential of improving a soil such as a sandy soil of low nutrient supply
    and water holding capacity. Crop residues that are not consumed by termites or
    someone else''s livestock can be valuable to the farmer for diverse reasons if
    left in the field, including for reduced evaporation and erosion, and improvement
    of surface soil aggregation. However, often the residues are consumed with little
    in-field value. There is also much combustion burning of plant materials by smallholders,
    e.g. following fallow, rice straw and hulls, strong stalks of tall traditional
    sorghums and even maize stover. Very often the burning of plant materials is associated
    with low productivity soils that could benefit from increased stable soil C supplied
    as biochar.


    Numerous simple and inexpensive kiln options are available that are appropriate
    for smallholder use including some consisting of little more than a 200-litre
    drum (http://www.appopedia.org/ Simple_Biochar_Kilns). A small kiln that can be
    easily moved to accumulations of plant materials in the field greatly reduces
    the labour of transporting the plant material, especially if the biochar is used
    in situ. The biochar will be most effective if crushed into small bits. Biochar
    has low density and should be incorporated into the soil to prevent removal by
    runoff.


    # 3.3.10 Good fertilizer use practices


    Good fertilizer use practices have been encapsulated in the term ''4Rs of nutrient
    stewardship'' including the right fertilizer source (or type) applied at the right
    rate, at the right time and in the right place (Johnson and Bruulsema 2014). In
    the case of poor smallholders, potential profit from fertilizer use needs to be
    of primary concern. Profit also needs to be a concern of well financed crop production
    but needs to be balanced with concerns about effects on soil, ground and surface
    waters, and the atmosphere.'
