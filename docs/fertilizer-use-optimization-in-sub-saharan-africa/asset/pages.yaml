    Lowland rice and wheat response to applied N was relatively great and low, respectively,
    in comparison with other cereals in Northern Zone (Table 14.5b). All crops except
    for low potential wheat responded well to applied P. Only maize and pigeonpea
    were found to have profitable response to applied K. The EOR for N and P were
    generally similar or higher compared with REC rates. Numerous EOR were determined
    for crop-nutrients lacking REC rates.


    In Southern Zone, all non-legumes had good yield increases with 30 kg/ha N applied
    and smaller increases with higher rates (Table 14.5e). Besides cassava, sorghum
    had a relatively large increase with P application. All crops had an economical
    response to 5 kg/ha of K applied. Only maize and lowland rice had recommendations
    for nutrient application. The EOR N was higher for high potential maize and lowland
    rice compared with REC. The EOR P was zero for rice due to lack of rice response
    to P. Several EOR values were determined for crop-nutrients without recommendations.


    Maize and wheat responses to N were relatively great in the Southern Highlands
    (Table 14.5c). Maize had a relative great response to P and S, but there was limited
    response to K for all crops. Wheat had a high EOR for N and lowland rice had a
    similar EOR compared with the REC nutrient rate but otherwise EOR and the REC
    were similar.


    Sweet potato and lowland rice had large responses to N for Central Zone (Table
    14.5f). All crops except maize were found to have profitable responses to applied
    P and cowpea was found to be responsive to K. No REC were available for this zone.


    Sweet potato was found to have a large yield response to applied N in Western
