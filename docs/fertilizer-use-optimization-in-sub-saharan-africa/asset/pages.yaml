  md: 'intercropping legumes into the cereal where the legume makes much of its growth
    after the cereal crop matures and has depleted soil mineral N. In cases of cereal-legume
    intercrop that is fertilized to meet the N need of the cereal, BNF may be very
    little as the legume will be competitive for uptake of the applied N while legume
    suppression by the vigorously growing cereal will also suppress BNF. It is not
    likely that significant transfer of N from the living legume to the cereal occurs
    although the later maturing non-legume may access N mineralized from decomposing
    leaves and nodules following senescence. More BNF as well as transfer of N from
    the legume to the grass is likely with a perennial grass-legume ley compared with
    annual cereal-legume intercropping.


    The associated crops do compete for all essential soil nutrients and water but
    differences in timing of their high uptake rates reduces this competition. Most
    legume pulse and oil seed crops have tap roots. When the legume has extensive
    root development, it may tap deep immobile nutrients and leached nutrients such
    as nitrate-N, use these for growth and return some to the soil through decomposition
    of crop residue. Long season and perennially growing pigeonpea can be especially
    effective in taking up deep soil nutrients and cycling some to the topsoil through
    decay of roots and above ground crop residues. With a good legume grain harvest,
    however, N removed in the harvest commonly exceeds the atmospheric N that is fixed.


    It is common that yield of both associated crops is less with intercropping compared
    with sole crop but the total of the intercrop yields relative to their sole crop
    yields commonly exceeds sole crop yield. This is assessed by land equivalent ratio
    (LER); if LER is greater than one, productivity has been improved by intercropping.
    Intercropping can be managed to favour one associated crop relative to the other.
    Planting the legume after the associated cereal has emerged will enhance the relative
    competitiveness of the cereal compared with planting both on the same day. A basal
    application of little or no N and withholding most N application until six weeks
    or longer after planting is expected to increase the relative competitiveness
    of the legume compared with applying 50% or more of the fertilizer N at or before
    planting.


    Intercrop planting pattern varies including planting all crops in the same row,
    alternative rows or pairs of rows, and alternating strips of more than two rows
    which may include rotation of crops across these strips. The planting pattern
    variation also has temporal aspects with both or all crops planted on the same
    day or on different days. Planting pattern is expected to affect the relative
    competitiveness of the component crops.


    An innovative intercropping system, named MIBII (Kiswahili for two, and an acronym
    for ‘Managing Beneficial Interactions in Legume Intercrops’) consists of two maize
    rows alternated with two rows of bean, groundnut and/or another legume which allows
    more light penetration for the under-storey legume component and reduces legume
    access to N applied for the maize component. In the Sahel, alternating four rows
    each of cowpea and pearl millet combined with crop rotation has resulted in similar
    pearl millet yield and increased cowpea yield compared with the respective sole
    crops.


    Relay intercropping of maize and cowpea is common in the Guinea Savanna of Nigeria.
    One planting pattern is to plant on the same day two rows of medium maturity maize
    alternated with four rows of a 65 days maturity cowpea variety. After cowpea harvest,
    the entire field is weeded and a medium maturity cowpea variety is planted in
    the rows of harvested legumes and also inter-planted between the maize rows. After
    the harvest of the maize, the entire field becomes a cowpea sole crop that matures
    during the dry season (Photo 1).


    ![](img/279f2242dca113ddfb6220d3a162ffff_29_0.png)


    Photo 1: Cowpea was relay intercrop planted into maize and continues to grow following
    maize harvest.'
