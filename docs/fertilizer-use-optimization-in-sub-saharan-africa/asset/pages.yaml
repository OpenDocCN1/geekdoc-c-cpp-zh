  md: 'In this example, the farmer had Nigerian naira 55,000 to use on eight hectares
    for food crop production. The upper output panel (E) shows the fertilizer recommended
    for each crop given the financial constraints. The second panel (F) gives the
    average expected yield increase and net returns to fertilizer use for these levels
    of application. The third panel (G) gives the expected average total net returns
    to fertilizer use recommended in the FOT, that is, Naïra 597,732.


    # 1.6 Paper versions of FOTs


    The Excel Solver FOT requires a computer but easy to use AEZ-specific paper-based
    FOTs were developed for use when a computer is not available. The paper FOTs are
    updated annually or as needed due to major price and cost changes at national
    or regional levels. Some profit potential is sacrificed in decision making with
    the paper compared with the Excel FOT due to generalized input information and
    recommendations.


    Increasing the amount of money available for fertilizer use will increase the
    rates and expected net returns until the fertilizer rates are at the point where
    net return per hectare is maximized. Further increases in the budget allocation
    will not result in increased application rates as additional application would
    exceed the optimized rates and result in a loss of profit.


    The paper FOT lists assumptions including available fertilizer and commodity values.
    It also provides guidelines for selecting the right product, rate, method and
    time of application, that is, the 4Rs of fertilizer use (http://www.nutrientstewardship.org/implement-4rs).


    The current recommendation for high potential maize in the Derived Savanna of
    Nigeria is to apply 150, 33, and 65 kg/ha of N, P and K (Chapter 12). If the available
    Naïra were used to fertilizer maize at the recommended rate while using grain
    values and fertilizer use costs as in Fig. 1.4, the fertilizer would have been
    sufficient for 0.81 ha and the expected average net returns would have been Naïra
    35,013 and only 6% of returns with the optimized fertilizer use.


    For each fertilizer, the paper FOT provides guidance on how to calibrate or learn
    the rate of application; however, assumptions are made for readily available fertilizer
    measurement units (such as plastic bottles) and for crop row and plant spacing.
    The paper FOT considers three levels of farmer financial ability with corresponding
    fertilizer use guidelines.


    Financial ability level 1 represents the most financially constrained who are
    able to use less than one-third of fertilizer applied to all cropland


    ![](img/279f2242dca113ddfb6220d3a162ffff_14_0.png)


    Figure 1.6: An FOT set up to determine the output for developing a paper FOT.'
