    Once crop-nutrient response functions have been determined for an AEZ, economics
    can be applied to fertilizer use to determine how crop-nutrient-rate choices affect
    potential profitability (Figure 11.4). The x-axis (horizontal axis) shows the
    amount of CFA franc per hectare (FCFA/ha) invested in a nutrient applied to a
    crop. The y-axis (vertical axis) shows the net returns resulting from a single
    nutrient applied to a crop. Therefore, each curve represents the profit potential
    of a nutrient applied to a crop. When the slope of the curve is steep, net returns
    to investment are very high. As the amount invested (the x-axis) increases the
    slope decreases but still upward, profit is increasing. Where curves reach a peak
    and the slope is flat, the point of maximum profit per hectare is reached; the
    rate at the peak is considered the economically optimal rate (EOR). When slopes
    decline, profit is declining. The financially constrained farmer wants first to
    take advantage of the crop-nutrient combinations that will give the most profit.


