  md: '# # 17. Enabling Fertilizer Use Optimization in Sub-Saharan Africa


    Harrison Rware h.rware@cabi.org'', Kayuki C. Kaizzi², Catherine J. Senkoro³, Wondimu
    Bayu¹, George Oduor¹ and James Watti¹


    ¹CABI, PO. Box 633-00621, Nairobi, Kenya

    ²National Agricultural Research Laboratories, P.O. Box 7065, Kampala, Uganda

    ³Kilimanjaro Agricultural Research Institute, P.O. Box 5098, Tanga, Tanzania


    # ## 17.1 Introduction


    Low soil fertility in sub-Saharan Africa (SSA) is associated with low crop productivity.
    Most small-scale farmers in SSA apply little or no fertilizers to their crops
    due to financial constraints and other socio-economic factors. Many use manure,
    compost and crop residue as nutrient sources but the supply is generally small
    relative to need and these materials often have alternative uses such as for fodder,
    thatch and fuel. The farmer’s major dilemma on fertilizer use has always been
    poverty and low ability for fertilizer purchase. After taking care of their basic
    survival needs, they need high benefit to cost ratios at little risk for investments
    to be competitive.


    The Optimising Fertilizer Recommendations in Africa (OFRA) project developed a
    fertilizer use optimization approach that enables farmers to maximize net returns
    from their investment in fertilizer use while reducing their risks compared with
    conventional fertilizer recommendations (Chapter 1). The approach considers crop
    nutrient response functions determined from field research together with the economic
    and agronomic context of the farmer. It guides the farmer to the choice of the
    crop-nutrient-rate combinations with the greatest profit potential for the farmer’s
    situation. It reduces risk for the financially constrained farmer by applying
    fertilizer at lower rates and often to more crops than with typical fertilizer
    recommendations. This combined with the 4R Nutrient Stewardship (http://soilhealthconsortia.org/files/Newsletter%203rd%20edition.pdf)
    contributes to nutrient use efficiency and low nutrient loss. Fertilizer use optimization
    has been developed for 67 agro-ecological zones (AEZ) or recommendation domains
    of 13 countries including Burkina Faso, Ethiopia, Ghana, Kenya, Malawi, Mali,
    Mozambique, Niger, Nigeria, Rwanda, Tanzania, Uganda and Zambia. For


    each of these AEZs, Excel and paper fertilizer optimization tools (FOT) were developed
    (http:// agronomy.unl.edu/OFRA).


    This chapter discusses the methodology used by OFRA to transfer the fertilizer
    use optimization approach to technology uptake pathways and the lessons drawn
    from this process. We discuss how farmer demand for fertilizer use optimization
    was generated, how stakeholders were engaged, how farmer advisors were trained
    and how the advisors worked to enable optimization of fertilizer use by farmers.


    # ## 17.2 Enabling fertilizer use optimization by farmers


    Fertilizer use optimization is an innovative approach for enabling financially
    constrained farmers to optimize profit from limited investment in fertilizer and
    thus enable them to increase fertilizer use and improve their income. The greatly
    improved profit opportunity is expected to result in increased fertilizer use
    by smallholders and thereby increase productivity, income and food security, and
    for many, break out of the cycle of poverty. Fertilizer use optimization is also
    relevant to farmers with adequate finance for fertilizer use who wish to maximize
    profit from fertilizer use. Enabling fertilizer use optimization requires application
    of much research-derived information through OFRA decision tools enabling choice
    of fertilizer use options with the greatest profit potential for the farmer’s
    situation. Country-specific stakeholder engagement plans were developed so as
    to effectively take fertilizer use optimization as technology uptake pathways
    and finally to farmers. A country OFRA team guides this enablement (Figure 17.1).
    Some of the immediate enabling activities were: creating farmers’ awareness and
    demand so'
