  md: 'production leading to enhanced profitability. The instructions for other options
    are given in Table 4 and are also easy to follow.


    It is recommended that soil tests be done every 4 years to assess the soil nutrient
    levels and optimize the fertilizer requirement by applying only what is deficient
    and hence improve on-farm profitability. For example, when the soil test for P
    is above 15 ppm, then it is recommended that no fertilizer P should be added.
    On the other hand, if the K soil gives a value of less than 100 ppm, then K should
    be applied at the rate of 20 kg/ac of KCl in a band at planting (Table 7.4).


    The optimal choice of crop-nutrient-rate combinations is expected, on average,
    to maximize returns on investment in fertilizer use. Eight fertilizer optimization
    tools (FOTs) were developed for eight recommendation domains in Kenya and are
    available at http://agronomy.unl.edu/OFRA. Paper versions of all FOTs were developed
    for use by county extension officers, agro-dealers and farmers without easy access
    to computers, which may need to be updated when situations like crop and fertilizer
    prices change.


    In addition to the above, optimizing fertilizer use accounts for the effects of
    other soil management practices and soil test values. Organic inputs, such as
    farmyard manure and composts, and fresh vegetative materials, such as tithonia
    and grevillea prunings, may be used within an ISFM framework to improve crop productivity
    and profitability. Soil tests may be done every 4 years to assess soil nutrient
    availability and optimize the fertilizer requirement by applying only what is
    deficient and hence improve on-farm profitability.


    # 7.7 Conclusions


    Increased fertilizer use by smallholder farmers is essential to reversing the
    declining trend of food production in SSA. The combined application of organic
    inputs and inorganic fertilizers normally give improved yields, particularly when
    farmers apply the right fertilizer at the right rate, time and placement, and
    in consideration of other good agronomic practices.


    Fertilizer usage is often limited by lack of sound knowledge required to develop
    and disseminate sustainable integrated fertilizer recommendations that are soil
    and crop specific and that are profitable to the farmer. The overall objective
    of OFRA was to provide farmers with decision tools which would allow them to choose
    the fertilizer rates and types for different crops in various agro-ecological
    zones to maximize their profits based on their economic constraints.


    A total of 37 replicated trials were conducted for various crops in four regions
    of Kenya. The mean responses to N, P and K across these trials were 39, 5 and
    17%, respectively and 49 crop-nutrient response functions for various recommendation
    domains were developed. In all regions, all non-legumes had an economic response
    to applied N and most of the yield gain was achieved with 30 kg/ha N applied and
    little additional gain with more than 60 kg/ha N applied. Similarly, in all regions,
    all crops had an economical response to applied P with the exceptions of Irish
    potato in Eastern and low potential maize in the Rift Valley Region. Responses
    to K occurred in less than one-third of the cases and most often with Irish potato,
    rice, groundnut and banana.


    # 7.8 Acknowledgements


    The authors are very grateful for support and collaboration received from various
    parties during the duration of the project. We particularly thank the farmers
    and extension staff of the Ministry of Agriculture in the counties of Busia, Embu,
    Machakos, Migori, Muranga, Nakuru, Trans Nzoia and Uasin Gishu. This work is part
    of the Optimizing Fertilizer Recommendations in Africa conducted in 13 sub-Saharan
    African countries, funded by AGRA and coordinated by CABI with Prof Charles Wortmann,
    University of Nebraska-Lincoln, USA as the Science Director. We are grateful for
    all the support and facilitation received. We appreciate Prof. Wortmann for his
    commitment and guidance during the implementation of the project and manuscript
    preparation. We are also grateful to the Director-General, Kenya Agricultural
    and Livestock Research Organization (KALRO) for permission to publish this work.'
