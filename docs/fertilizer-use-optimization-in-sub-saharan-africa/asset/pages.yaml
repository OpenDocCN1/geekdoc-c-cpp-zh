    # 13.1 Agricultural systems of Rwanda


    An agro-ecological zone is a land resource mapping unit, defined in terms of climate,
    landform and soils, and/or land cover, and having a specific range of potentials
    and constraints for land use (FAO 1996). An agro-ecological zones (AEZ) map is
    an essential tool for agricultural planning. There are three regional classification
    schemes of AEZ commonly used in Rwanda. These were defined based on differences
    in soils, altitude and rainfall, and as such also show marked differences in cropping
    patterns, farm size, livestock ownership and other important household and regional
    characteristics. The most used in Rwanda is that of Clay and Dejaeger (1987),
    who defined five


    AEZ with emphasis on agronomic and socio-economic homogeneity within AEZ among
    farmers and their farming systems (Figure 13.1). The Northwest AEZ includes parts
    of Western and Northern Provinces and has both temperate highlands (>1800 m above
    sea level (masl)) that are dominated by fertile volcanic soils and the well-watered
    lowlands of Lake Kivu. Temperature varies little by month but is affected by altitude
    with mean minimum and maximum annual temperatures of 14 and 20°C at Gisenyi, respectively,
    and 2°C less at Musanze. Rainfall is bimodal with mean annual totals of 1170 and
    1320 mm at Gisenyi and Musanze, respectively. Major cash crops are coffee, Irish
    potato and pyrethrum. Major crops are maize, sweet


    ![](img/279f2242dca113ddfb6220d3a162ffff_163_0.png)


    Figure 13.1: Agro-ecological zones of Rwanda.'
