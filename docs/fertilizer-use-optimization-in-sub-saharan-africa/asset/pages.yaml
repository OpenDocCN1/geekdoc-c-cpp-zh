  md: 'The combined application of organic materials, especially farmyard manure (FYM),
    and fertilizer has long been advocated based on research results which established
    that combined application gave significantly higher yields than either the inorganic
    or FYM alone. It is recommended that FYM be applied once every two to three years
    of continuous cropping and then supplemented with fertilizer. However, FYM is
    inadequate for such application to all cropland and is often of low quality because
    very little attempt is paid to its storage and handling.


    # 12.2 Agricultural systems of Nigeria


    Nigeria''s large climatic range is encompassed by the tropical humid forest in
    the south and the savanna in the north. The derived savanna is a transition zone
    between the rainforest and


    savanna biomes caused by forest clearance. The agro-ecological zone (AEZ) delineations
    in Figure 12.1 are the product of climatic and soil characteristics. The diverse
    agro-ecological environment of Nigeria makes it feasible to support the growth
    of several arable and tree crops of tropical and sub-tropical origin.


    Rainfall increases northward from 3000 mm close to the equator to 500 mm in northeast
    Nigeria. The distribution generally is unimodal in areas above 9° N and bimodal
    between latitudes 4 and 9° N. The rainfall distribution is often erratic. A duration-of-dry-season
    gradient occurs with a range of three to eight months from the high rainfall areas
    in the south to the driest areas in the north. The country generally enjoys a
    high insolation and uniformly high


