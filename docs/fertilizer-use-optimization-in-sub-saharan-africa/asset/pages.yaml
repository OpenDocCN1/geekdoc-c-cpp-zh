- pgno: 68
  md: 'In the Guinea savanna zone about 88% of farmers intercropped cowpea with sorghum
    or millet (GGDP 1991).


    Rice is grown in all the ecological zones. The traditional method of land clearing
    and preparation is the use of rudimentary tools for slashing and burning of the
    debris.


    Poultry production is the main livestock sector in the south while cattle production
    is concentrated in the savanna zones. Sheep and goat production is important throughout
    the country (MoFA 1998). Manures from poultry, cattle, sheep and goats are used
    by smallholder farmers in home gardens especially in the northern savanna zone.


    Ghana is divided into six major agro-ecological zones: these are Rain Forest,
    Deciduous Forest, Forest-savanna Transition, Coastal Savanna and Northern (interior)
    Savanna which comprises Guinea and Sudan Savannas (Figure 6.1; Table 6.1).


    Ghana''s climate ranges from equatorial bimodal rainfall in the south to the tropical
    unimodal monsoon type in the north. The mean monthly temperature over most of
    the country never falls below 25°C, a consequence of low latitude and low altitude.
    Mean annual temperature average is 27°C. Absolute maxima approach 40°C, especially
    in the north, with absolute minima descending to about 15°C. In the coastal areas,
    with the influence of the sea breeze, monthly annual mean temperatures differ
    by 5 to 6°C. In the interior, this temperature range is about 7 to 9°C (Dickson
    and Benneh, 1988; Benneh et al., 1990). The rainfall generally decreases from
    the south to the north. The wettest area is the extreme southwest where the mean
    rainfall is over 2000 mm/yr. In the extreme north, the annual rainfall is less
    than 1100 mm/yr.


    Most of the soils of Ghana are developed on thoroughly weathered parent materials,
    with alluvial soils (Fluvisols) and eroded shallow soils (Leptosols) common to
    all the ecological zones. Generally most of the soils are affected with inherently
    or humanly induced infertility (MoFA 1998).


    The soils in the forest zone are grouped under Forest Oxysols and Forest Acid
    Gleysols. These are porous, well drained and generally loamy and are distinguished
    from those of the savanna zones by the greater accumulation of organic


    matter in the surface resulting from higher accumulation of biomass. They occur
    in areas underlain by various igneous, metamorphic and sedimentary rocks, which
    have influenced the nature and properties of the soil.


    Soils of the savanna zones, especially in the interior savanna, are low in organic
    matter (less than 2% in the topsiol), have high levels of iron concretions and
    are susceptible to severe erosion. Thus well-drained upland areas tend to be droughty
    and when exposed to severe incident sunshine, tend to develop cement-like plinthite.
    These conditions make it imperative that manure be incorporated regularly into
    the soils in the savanna zones (MoFA 1998).


    # 6.2 Fertilizer use and recommendations


    Current recommended rates of fertilizer application on food crops were formulated
    about 30 years ago. At that time, long fallow periods and less intensive cropping
    coupled with crop varieties with low response to nutrients resulted in low to
    medium rates of recommended nutrient levels of application.


    With agriculture developing fast and improved crop varieties with high nutrient
    requirements, there is the need to improve nutrient supply to crops if the full
    yield potential of the crop is to be realized. Even with subsidization, fertilizer
    use is expensive to the smallholder farmers who form the bulk of production force.
    However, it is in the interest of farmers to invest in fertilizer rates that are
    economically and scientifically sound so as to derive benefit and keep the soil
    productive. More so, the price of maize is steadily high and attractive to make
    farmers invest in fertilizer to increase production. A key limitation to farmers''
    use of fertilizer in Ghana is also lack of fertilizer recommendations that could
    result in good profits for farmers.


    Soil fertility and productivity conditions vary considerably between geographic
    areas and among farms and fields in the same soil area, so blanket fertilizer-use
    recommendations may be entirely profitable for a whole region or area while profitable
    in a few areas. This is because fertilizer-use recommendations are site- and situation-specific.
    That is why several general fertilizer-use recommendations in Ghana have been
    inconsistent and not popular among farmers and agricultural scientists.'
