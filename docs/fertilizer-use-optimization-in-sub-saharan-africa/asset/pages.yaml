    # ## 5.4 Optimizing fertilizer use in Ethiopia


    Optimization of fertilizer use, in this chapter, refers to maximizing farmer profit
    resulting from fertilizer use, while not greatly adding to farmer risk. This implies
    maximizing profit per hectare for farmers with adequate finance and net returns
    for small investments in fertilizer use made by financially constrained farmers.


    Estimation of profit from fertilizer use requires generating AEZ-specific robust
    nutrient response functions for important annual food crops from field research
    results. Crop response to an applied nutrient can be highly varied across site-years
    but when results of numerous trials are considered, the expected mean response
    is curvilinear to plateau. Such a response can be mathematically represented using
    asymptotic functions taking the form of an exponential rise to a maximum or plateau
    yield. The asymptotic function used for the Optimizing Fertilizer Recommendations
    in Africa (OFRA) research was Y = a – bc^x, where Y was yield (t/ha), coefficient
    a was the maximum or plateau yield (t/ha), coefficient b was the gain in yield
    (t/ha) due to nutrient application, and c^x represented the shape of the response
    curve where c was a curvature coefficient and r the nutrient application rate
    (kg/ha).


    Crop responses to applied N illustrate the curvilinear to plateau response in
    Figure 5.4. The curves differ in magnitude of response and shape of the curve.
    Maize and teff N curves are especially informative where there is a large yield
    increase per unit of applied N at low application rates. The curve becomes less
    steep as N rate'
