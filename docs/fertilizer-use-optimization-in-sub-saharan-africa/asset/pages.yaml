    # 15.4 Optimizing fertilizer use in Uganda


    Optimization of fertilizer use in this chapter, as developed by OFRA, refers primarily
    to maximizing farmer profit from fertilizer use, given that most Uganda farmers
    are severely limited in their management options by poverty. However, the profit
    needs to be achievable without much risk.


    Determination of the profit potential for farmers from their fertilizer use decisions
    requires information on the typical response of a crop to an applied nutrient
    in an AEZ. Responses were determined using curvilinear to plateau, or asymptotic
    quadratic-plateau, functions taking the form of an exponential rise to a maximum
    or plateau yield as this form of response is most typical when numerous site-years
    of data are considered (Figure 15.5).


    The asymptotic function was Y = a - bc^c, where Y was yield (t/ha), a was the
    maximum or plateau yield (t/ha), b was the maximum gain in yield (t/ha) due to
    nutrient application, and c^c represented the shape of the quadratic response,
    where c was a curvature coefficient and r the nutrient application rate (t/ha).


    The typical form of crop response to a nutrient has economic implications for
    the farmer. The curvilinear to plateau yield responses (y-axis of maize, upland
    rice, sorghum, finger millet and bean to applied N (x-axis) are displayed in Figure
    15.5. The magnitude of response, b, and the shape of the curve differ by crops,
    but all crop responses have a steep yield increase with increasing N at low rates
    (i.e. up to 20 kg/ha N applied). The rate of yield increase is less at higher
    N rates with little yield increase for some crops with >40 kg/ha N; yield eventually
    reaches a plateau with no more practical yield increase in response to increasing
    N rates. The levelling off of the curve implies that factors other than N are
    more limiting to crop yield. The response curves presented are typical for most
    crops and nutrients. The response implies that the net returns to low rates of
    N are greater than with higher rates. This has implications for risk as application
    at lower rates not only has potential


