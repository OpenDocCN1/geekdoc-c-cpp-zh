- pgno: 200
  md: 'The Excel FOT requires that the Solver add-in be enabled. Instructions for
    enabling the Solver add-in are provided in a worksheet of the FOT ''Help and Instructions''.
    Instructions are also given for enabling macros, another essential step to using
    the Excel FOTs. More detailed instructions are available in Extension Training
    Materials at http://agronomy.unl.edu/OFRA. When enabled the Solver add-in appears
    under the Data tab on the Quick Access Toolbar.


    The data input includes: the farmer''s allocation of land to each crop of interest;
    estimated farm gate value per kg of produce at harvest time, considering that
    some is for home consumption (the most valuable) and that the surplus will be
    marketed); and the cost of using different fertilizers (Figure 15.7). The amount
    of money which the farmer has to invest in fertilizer use is also entered. Clicking
    on the ''Optimize'' button then runs the optimization calculations. In the example,
    the farmer wishes to plant six crops to six acres of land. If no land is allotted
    to a crop or if the crop value is not given, the crop is not considered. In the
    example, DAP is given a cost of zero and it is not considered in the optimization.
    The budget constraint to fertilizer use is UgSh 600,000.


    The output panel displays the recommended fertilizer rates for each crop, the
    expected mean yield increases and net returns for each crop, and the expected
    mean total net return to investment in fertilizer (Figure 15.8). The approach
    strives to maximize profitability of fertilizer use through consideration of the
    farmer''s financial constraint, costs and prices of inputs and outputs, and farmer''s
    cropping system. It identifies the crop-nutrient-rate combinations expected to
    maximize returns on investment in fertilizer.


    In the example, some fertilizer has been recommended for all crops. In some cases,
    such as TSP applied to maize and banana, the amount is too small for feasible
    application and the fertilizer or the money should be allocated to another crop
    or fertilizer. The fertilizer needed totalled to 118, 148 and 31 kg of urea, TSP
    and KCl, respectively. The average expected total net return to the UgSh 600,000
    invested in fertilizer use is UgSh 2,729,469. If a crop has a high net return
    to fertilizer use, such as upland rice in this example, the farmer may try allocating
    more


    land to the crop to determine if total profit is adequately increased, although
    more than profit from fertilizer use needs to be considered in land allocation.


    Often farmers and their advisors are not able to use the Excel Solver® FOT due
    to lack of access to a computer. Therefore a paper FOT was developed for each
    AEZ. The paper FOT for Eastern Uganda – Lake Kyoga basin is given as an example
    (Table 15.4).


    The paper FOT is devised for three financial levels based on the farmer''s budget
    constraint for fertilizer use. The level 1 financial ability is for the poor farmer
    who has less than one-third the amount of budget required to apply fertilizer
    to all cropland at EOR; level 2 is for the farmer with less than two-thirds but
    greater than one-third of the money required to apply fertilizer to all cropland
    at EOR; and level 3 is for the farmer with enough money to apply fertilizer at
    EOR to at least some of the cropland.


    The paper tool makes assumptions about the: measuring units to be used by farmers
    in adjusting their eyes and feel for applying the adjusting rate of fertilizer;
    crop inter-row and intra-row spacing; the fertilizer use costs per 50 kg bag;
    and the expected commodity values on-farm at harvest, considering the value both
    for home consumption and for market.


    Consider as an example level 1 financial ability considerations in the paper FOT
    for the Lake Kyoga Basin ''Finger millet: broadcast 14 kg/ac DAP at planting (CAP
    for 2.4 m); 17 kg/ac urea at 2nd weeding (CAP for 1.2 m)''. Therefore, the farmer
    should broadcast apply 14 kg/ac of DAP to finger millet at planting. This is calibrated
    using a Highland brand water bottle lid which is sufficient for 2.4 m when the
    application width is 1 m. The farmer should also broadcast apply 17 kg/ac of urea
    to finger millet at the second weeding. This is calibrated using a Highland water
    bottle lid which is sufficient for 1.2 m when the application width is 1 m.


    Fertilizer use decisions need to consider the effects of other practices that
    supply soil nutrients as well as soil test information (Table 15.4). Typically,
    a farmer may apply such a practice to only one or a few parcels of several land
    parcels that comprise the farm''s cropland. For example, manure application to
    a parcel'
