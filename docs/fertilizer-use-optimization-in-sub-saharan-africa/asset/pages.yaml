  md: '# 11. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Niger


    Maman Nouri¹ mamank.nouri@gmail.com, Maman Garba¹ and Charles S. Wortmann²

    ¹ Institut National de Recherche Agronomique du Niger (INRAN), BP 240 Maradi,
    Niger

    ² University of Nebraska-Lincoln, Department of Agronomy and Horticulture, Lincoln,
    NE 68583, USA


    # 11.1 Agricultural systems of Niger


    The crop and livestock sectors are the basis of Niger''s economy. These sectors
    employ more than 80% of the population, generate 43% of GDP and contribute on
    average to 30% of export earnings of the country.


    Most crop production is of staple crops such as pearl millet, sorghum, cowpea,
    groundnut and rice. Rainfed cash crops produced in favourable areas are groundnut,
    sesame, cotton and tiger nut, the latter gaining in importance with more fertilizer
    use than for other crops, particularly in Maradi region.


    Land cultivated annually is increasing and competes with grazing. Livestock densities
    have declined in the Sahel but much livestock is brought from further north for
    dry-season grazing.


    Crop production in Niger is challenged by climate-related risks, soil degradation
    and demographic pressure which contributes to an improper use of the natural resources
    and exacerbates food insecurity.


    # 11.1.1 Agro-ecological zones (AEZ)


    The AEZ of Niger include the Sahara desert zone in the north of the country; the
    sub-Saharan pastoral zone in the centre of the country; the Sahelian zone with
    agro-pastoral prevalence in the southern centre and the Sahelo-Sudan or North
    Sudan Savanna zone with better agriculture production conditions in the South-West
    (Figure 11.1). The latter two AEZ are the sedentary areas in contrast to the northern
    zones where primarily nomadic activities with livestock predominate.


    The Sahara AEZ covers more than 65% of the country and has fewer than five inhabitants
    per km² (Figure 11.1). Agadez, which is in this zone, has a mean annual rainfall
    of 111 mm, 45% of which falls in August (Table 11.1). Monthly mean maximum and
    minimum temperatures range


    ![](img/279f2242dca113ddfb6220d3a162ffff_135_0.png)


    Figure 11.1: Agro-ecological zones (AEZ). from 26 to 41°C and from 12 to 26°C,
    respectively. Agricultural activities are conducted in some depressions called
    oases with microclimates that permit production of high quality vegetables such
    as onion, garlic and potato.


    The Sahelo-Sahara AEZ covers about 20% of Niger''s area (Figure 11.1). It is mostly
    a pastoral and transhumance AEZ receiving about 350 mm of rainfall annually and
    is marginal for pearl millet and cowpea production. The mean annual rainfall for
    Tanout, which is in this zone, is 244 mm with 45% falling in August (Table 11.1).
    Monthly mean maximum and minimum temperatures range from 30 to 40°C and from 14
    to 25°C, respectively.


    The Sahel AEZ in Niger is semi-arid (Figure 11.1). Annual mean rainfall in Zinder,
    which is in this zone, is 411 mm with 85% falling from July to September (Table
    11.1). Monthly mean maximum and minimum temperatures range from 28 to 42°C and
    from 12 to 29°C, respectively. The generally high sand content of upland soils
    combined with low rainfall makes frequent occurrence of drought a major constraint
    to crop production. The best adapted crops are pearl millet, groundnut,'
