    problems. A substantial but diminishing part of the Southwest AEZ is covered by
    the natural, protected Nyungwe Forest. Major cash crops are tea and coffee. The
    major food crops are bean, sweet potato, taro and cassava. Soils have a high proportion
    of clay, are often degraded and range from poorly to moderately suitable for agriculture.
    Acid soil prevails on the steep slopes of the Congo-Nile Divide and soils are
    fertile on the coast of Lake Kivu.


    # 13.2 Soil fertility management in Rwanda


    Soils of Rwanda have a high clay content. Suitability classification for agriculture
    ranges from poor to moderate. Farming is principally by smallholders. The government
    supported Crop Intensification Program is based on consolidation of farmland use
    and facilitation of inputs access, including improved seeds and fertilizers by
    farmers at subsidized costs. This has resulted in increased fertilizer use from
    4 to 32 kg/ha from 2007 to 2015 (NISR 2014).


    The North Central AEZ covers parts of Ruhengeri, Byumba and Kigali. It has high
    mountains, steep slopes and soils are susceptible to erosion. Major cash crops
    are bananas and coffee, with some highland areas specializing in potato and wheat.
    Food staples include sweet potato, bean and maize. Agro-climatically, it is quite
    similar to the South-Central zone.


    Recommended rates of fertilizers (RECs) include: 41 kg N and 46 kg P2O5/ha for
    maize and wheat; 18 kg N and 46 kg P2O5/ha for bean and soybean; 50 kg/ha DAP
    for cassava; and 80 kg N, 34kg P2O5 and 34 kg K2O/ha for rice. However more specific
    fertilizer use guidelines are needed.


    The South Central AEZ comprises the districts from Kamonyi to Huye and part of
    Nyamagabe in Southern Province. The soils are acidic and require lime application.
    Major cash crops are banana and coffee, while the staples are bean, sweet potato,
    cassava, sorghum and rice in the wetlands.


    The 4Rs of nutrient stewardship including the right product, rate, method and
    time of application needs to be applied for more fertilizer use efficiency. The
    ''right'' combination of these factors needs to be location and cropping system
    specific.


    The Eastern AEZ corresponds to current Eastern Province and is characterized by
    gentle slopes and relatively low altitude. Rainfall is less than


    Amendment of soil acidity and aluminium (Al) toxicity is essential for crop response
    to fertilizers with some soils. Deficiencies of nutrients other than macro nutrients
    can also limit response to N-P fertilizer. Lime application and planting of green
    manure crops are proven good agronomic practices although not much adopted. Minjingu
    rock phosphate from northern Tanzania is especially reactive on acid soils with
    some liming effect.'
