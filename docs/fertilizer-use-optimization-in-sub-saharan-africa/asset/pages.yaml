    # 12.6 Optimizing fertilizer use in the savanna biome of Nigeria


    Low commercial fertilizer use by farmers in Nigeria constrains their productivity.
    Many of the farmers are resource poor and do not have the financial ability to
    procure the required amount of fertilizers to maximize returns in fertilizer investment
    over all of their cropland. The unstable commodity prices and the high cost of
    fertilizers do not guarantee profit. Farmers have to choose between competing
    needs in deciding on fertilizer procurement. The profit to be made from fertilizer
    investment should therefore guide fertilizer use decisions.


    Profit-oriented farmers without financial constraints (well resourced) invest
    in fertilizer use to maximize profits per hectare by applying at EOR over all
    cropland, while farmers with limited finances invest in fertilizer use to obtain
    high benefit to cost ratio while keeping risk low.


    Maximizing net return requires understanding crop response to applied nutrients.
    The crop yield responses to applied nutrients were captured in curvilinear to
    plateau yield response functions as shown in Figure 12.4 for maize response (vertical
    axis or y-axis) to applied N (horizontal axis or x-axis) in the Mid-altitude zone.
    Maize grain yield response to increasing N rates in the Nigerian Mid-altitude
    AEZ has a steep response at low N rates and a reduced rate of increase at higher
    N rates until the yield plateau is reached, after which further increase in N
    rate has little or no effect to increase yield. There was increasing yield with
    N rates up to the 100 kg/ha rate beyond which maize grain yield


    ![](img/279f2242dca113ddfb6220d3a162ffff_152_0.png)


    Figure 12.4: Maize response to nitrogen application in the Nigerian Mid-altitude
    AEZ.


    tends to be constant. The maximum expected yield, on average, was 2.57 t/ha.


    This type of response to applied nutrients is captured by the equation Yield (kg/ha)
    = a – bc^r, where a is near maximum yield for application of that nutrient, b
    is the maximum yield increase due to applied nutrient, and c’ determines the shape
    of the curvilinear response. The c is the curvature coefficient and r is nutrient
    rate. This function tells us that the benefit relative to cost for N application
    is expected to be greater with low N levels compared with high N rates.


    Profit potential also varies with different nutrients applied to the same or with
    different crops as shown in Figure 12.5 for the Nigerian Mid-altitude AEZ. Each
    curve represents the profit potential of a nutrient applied to a crop. Where the
    curve of the graph is steep, the net returns to investments are very high and
    where the curve flattens, the point of maximum profit per hectare is reached.
    When the graph slope starts declining, the profit is declining.


    The results show that it is more economical to invest in N and K applied to cassava
    than in fertilizers for other crops. Application of low rates of N to sorghum
    and K to upland rice also have good profit potential. Other crop-nutrient options
    that have profit potential include the application of a very low rate of Zn for
    groundnut.


    The resource-poor farmer needs to take advantage of the most profitable options
    first and gradually build financial capacity in order to take advantage of the
    less profitable choices. Poor farmers will benefit according to their financial
    ability by operating within the steep slope of the curves where there are high
    returns from investment, while well-resourced farmers will attempt to apply at
    EOR to maximize profit per hectare.


    The results suggest the need to consider the various crop nutrient response functions
    in light of their other agronomic choices, the current economics of fertilizer
    use and their financial ability. Therefore, easy to use decision tools called
    fertilizer optimization tools (FOT), which use complex mathematics of linear optimization
    to consider reiteratively the numerous crop nutrient functions in light of the
    farmer’s agronomic and economic situation, are needed to provide recommendations
    that maximize'
