  md: '# 14. Optimizing Fertilizer Use within the Context of Integrated Soil Fertility
    Management in Tanzania


    Catherine J Senkoro¹, cathysenkoro@gmail.com, George J Ley¹, Atanasio E Marandu¹,
    Charles Wortmann², Muhamadi Mzimbi³, John Msaky⁴, Rose Umbwe⁴, S D Lyimo⁴

    ¹Milingano Agricultural Research Institute, PO. Box 5088, Tanga, Tanzania

    ²University of Nebraska-Lincoln (UNL), Lincoln NE 68583, USA

    ³Uyole Agricultural Research Institute, PO. Box 400, Mbeya, Tanzania

    ⁴Selian Agricultural Research Institute, PO. Box 2740, Arusha, Tanzania


    # 14.1 Importance of agriculture in Tanzania


    Agriculture is the most important sector to the economy of Tanzania. It accounts
    for 26.4% of the total Gross Domestic Product (GDP), 30% of export earnings and
    65% of raw material for domestic industries (World Bank 2010; Helepwa et al.,
    2013). Over 80% of the population in rural areas depend on agriculture indicating
    the importance of the sector in poverty reduction and food security in the country.


    and 99% is grown by smallholder farmers (Helepwa et al., 2013). Common bean production
    occupies about 800,000 ha (Letaa et al., 2014) and is an important source of food
    and income for smallholder farmers with per capita bean consumption of about 19.3
    kg/yr, contributing 16.9% of the protein and 7.3% of the calories for human nutrition
    (Rugambisa 1990). Cash crops grown in Tanzania include coffee, cashew nut, tea,
    cotton, tobacco, wheat and sisal. On average the crop sub sector contributes about
    34.8% of the agricultural GDP.


    The major food crops grown in the country are maize, sorghum, millet, cassava,
    sweet potato, Irish potato, banana, pulses, paddy and wheat. Maize is planted
    on 45% of total arable land. Rice is the third most important food and cash crop,
    generates much employment and rural income,


    # 14.2 Agro-ecological zones (AEZ) of Tanzania


    The country is divided into Eastern, Northern, Southern, Southern Highlands, Western,
    Central, and Lake Zones (Figure 14.1). The zones are


    ![](img/279f2242dca113ddfb6220d3a162ffff_175_0.png)


    Figure 14.1: Major Agricultural Zones of Tanzania overlain on the AEZ map of HarvestChoice.'
