  md: 'in Nigerian compound fertilizers by Adeoye (2006).


    Fertilizer availability to farmers has been heavily subsidized, to as much as
    95% of the real cost, since the late 1970s. The pattern of total fertilizer consumption
    in Nigeria is largely determined by the flow of federal and state government subsidies
    and the almost annual changes in procurement and distribution rules. For example,
    under the Federal Market Stabilization Program (FMSP), Liverpool-Tasie and Takeshima
    (2013) documented that the Federal Government of Nigeria (FGN) procures fertilizer
    for sale to states at a subsidy of 25%. State governments typically institute
    additional subsidies on fertilizer. Under this arrangement, companies make bids
    to the FGN to import and distribute subsidized fertilizer. Several states also
    procure fertilizer outside of the FMSP for sale to their farmers. Nevertheless,
    only an estimated 30 percent of subsidized fertilizer reaches small farmers at
    the subsidized price.


    There is also remarkable variation in the subsidy rates state governments provide
    on the already federally subsidized fertilizer, ranging from 0 to 50%. In a typical
    state, there is federally subsidized fertilizer, federally plus state subsidized
    fertilizer and (in principle) unsubsidized fertilizer procured through private
    channels. However, the subsidy programmes have been plagued by pervasive problems
    of late delivery of fertilizer and delivery of inappropriate quantities and types
    of fertilizer. Political manipulation has also resulted in diversion of subsidized
    fertilizer from the intended beneficiaries.


    Even though the subsidy programmes absorbed large proportions of the national
    budget, the impact of the programmes on agricultural productivity has been mixed
    at best. Arbitrage opportunities and incentives to adulterate and mislabel the
    source of fertilizer also abound.


    Farmer access to fertilizer varies widely across states. Vigorous campaigns by
    the Fertilizer Producers and Suppliers Association of Nigeria (FEPSAN) and some
    international NGOs aimed at liberalization of fertilizer supply with smart subsidization,
    such as with the voucher system, are being pursued.


