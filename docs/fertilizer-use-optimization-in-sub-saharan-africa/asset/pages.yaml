  md: 'yield increase equals the cost of an additional increment in nutrient rate.
    This is considered to be the economical optimal rate (EOR). The financially limited
    farmer, however, should strive to apply at a rate at which yield is still increasing
    and may choose to apply no more than 30 or 40 kg/ha N for the highland maize response
    of Figure 9.4, but not more than 5 kg/ ha elemental nutrient for several of the
    crop- nutrient responses displayed in Figure 9.5 and no application of P to bean
    and N to cowpea.


    Some nutrients applied to some crops have much more profit potential than other
    nutrients applied to the same or other crops (Figure 9.6). Financially constrained
    farmers need to consider this opportunity to achieve high profit from fertilizer
    use. The x-axis represents the amount of money invested in one nutrient applied
    to one crop. The y-axis shows the net returns to investment in application of
    a nutrient to a crop. Each curve represents the profit potential of a nutrient
    applied to a crop. The steeper the slope of the curve, the higher the net returns
    of the investment. As the amount invested increases, the slope decreases but if
    the response is still increasing, profit is increasing. Where curves reach a peak
    and the slope is flat, the point of maximum profit per hectare (EOR) is reached.
    When slopes decline, profit declines.


    The financially constrained farmer wants first to take advantage of the crop-nutrient
    combinations that will give the most profit. The greatest profit potential on
    a small investment was with a small amount of P applied to legume crops, partly
    because of their high grain value, and especially for pigeonpea, compared with
    maize or sorghum. Also, a small amount of P applied to maize and sorghum was very
    profitable although these responses may only occur if some N is applied. Application
    of N to maize, sorghum and cowpea, and of S to maize, also have good profit potential
    although less with small investments compared to other options. Therefore, the
    financially constrained farmer needs to take advantage of the best profit opportunities
    according to their ability and, hopefully, use some of the increased profits to
    gradually become less financially constrained and eventually apply fertilizer
    to all cropland at rates to maximize profit per hectare.


    Consideration of the nature of different crop nutrient response functions together
    with the farmer''s land allocation, the expected value of the commodity, the fertilizer
    costs and the farmer''s budget constraint is very complex. To deal with this complexity,
    easy to use fertilizer use optimization tools (FOTs) were developed using Excel
    Solver © (Frontline Systems Inc., Incline Village, NV, USA) which use complex
    mathematics of linear optimization to integrate the economic and agronomic information
    and give a solution (https:// agronomy.unl.edu/OFRA).


    Use of the Excel FOT requires that the add-in Solver is activated and macros are
    enabled; step-by-step instructions are given in the ''Help and Instructions''
    worksheet of the FOT (Figure 9.7). More detailed instructions are in Extension
    Materials and FOT Manual at the same website.


    The data input screen is where the farmer needs to estimate how much land will
    be planted to each crop of interest, the farm-gate value per kg at harvest considering
    that some is for home consumption (the most valuable) and that the surplus will
    be marketed, and the cost of using different fertilizers (Figure 9.7). The farmer''s
    available money for fertilizer use is also entered as the budget constraint.


    The results are displayed as in Figure 9.8, including the amount of each fertilizer
    to apply to each crop, the expected average yield increases and net returns, and
    the total net returns to fertilizer use for the farm. In this example, the farmer
    has only NPS and urea as available fertilizers. The budget constraint of Malawi
    kwacha (MWK) 150,000 is not sufficient to apply fertilizer at EOR but gives recommendations
    of more than 25 kg/ha for urea and NPS applied to maize and NPS applied to cowpea
    and pigeonpea. The recommended rates of less than 25 kg/ha are too low for feasible
    application and it is suggested that these fertilizers or the money be allocated
    elsewhere such as to increase the fertilizer applied to cowpea and pigeonpea.
    The expected average total return to MKW 150,000 invested in fertilizer use is
    MKW 918,133. If, however, TSP were available for a cost of MKW 30,000 per 50 kg,
    the expected average total net return is MKW 1,1012,746 increasing the farmer''s
    profit potential by over 10%. Restricted availability of fertilizer types requires
    farmers to buy and apply nutrients that give no or less return compared to other
    nutrient application options.'
