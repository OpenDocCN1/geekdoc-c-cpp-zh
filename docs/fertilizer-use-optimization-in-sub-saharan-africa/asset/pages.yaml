    # 8.5 Fertilizer use optimization tools for Mali


    Decisions on investing in fertilizer use to optimize profit on the investment
    must consider a great deal of information and is potentially overwhelming, especially
    if the decisions are finance constrained. A farmer in the South Sudan Savanna
    has the implications of 14 crop-nutrient response functions to consider while
    accounting for their choice of crops, land allocation, expected value of commodities,
    the fertilizer use costs, and the amount of money to invest in fertilizer use.
    Therefore, fertilizer optimization tools (FOTs) were developed that work with
    macros created in Excel with the add-on Solver ® (Frontline Systems Inc., Incline
    Village, NV, USA). These Excel FOTs use complex mathematics of linear programming
    which integrate crop-nutrient response information with other agronomic and economic
    information relevant to the farmer''s specific situation (agronomy.unl.edu/OFRA).
    In spite of this mathematical complexity, use of the FOTs is easy. Before the
    FOTs can be used, the add-on Solver needs to be activated and macros need to be
    enabled; the steps to doing this are given in the ''Help and Instructions'' worksheet
    of the FOT. The FOTs and instructional materials are available at (https://agronomy.unl.edu/OFRA).


    In the Sahel region, there is high profit potential, at least at low rates of
    application, for N and P applied to rice, P applied to groundnut and K applied
    to cowpea (Figure 8.4a). The point where the yield gain is insufficient to pay
    for the cost of additional nutrient is at the peak of the curve and the EOR, after
    which profit is lost with more nutrient application. There the value of P applied
    to rice and of K applied to cowpea should be less than 7000 and 5000 FCFA/ha,
    respectively. There is good profit potential, however, with applying more P to
    groundnut and more N to rice. The lower lying curves also have the potential for
    profit, but much less potential compared with the steeper curves.


    In the input panels (Figure 8.5a), the user enters the land area allocated to
    each crop and expected value of the harvest, accounting for the value of that
    which will be kept for home consumption and the surplus to be marketed. He/she
    then enters the cost of using, considering purchase costs and the costs of transport
    and application, 50 kg bags of each fertilizer likely to be available. If a fertilizer
    is not available, its cost is replaced by zero. He/she finally enters the amount
    available for use of fertilizers; this is the budget or financial constraint.
    After fully informing the tool, the user left-clicks on the optimize button to
    launch the calculation.


    In the North Sudan Savanna, the big profit opportunity is with N applied to sorghum
    (Figure 8.4b). Below that, with good but less profit potential are with N applied
    to maize and rice, and P applied to cowpea and pearl millet. The relatively low
    grain price for maize reduces its profit potential. In the South Sudan Savanna,
    the better profit opportunities are with N applied to sorghum, P applied to rice
    and sorghum, and K applied to cowpea (Figure 8.3c). Therefore, the financially
    constrained farmer needs to choose crop-nutrient-rate


    The amount of each fertilizer to be applied to each crop to maximize profit is
    reported in the upper panel of the output (Figure 8.5b). Sometimes the recommended
    rates are too'
