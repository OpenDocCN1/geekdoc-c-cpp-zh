    # 3.1 Introduction


    Soil fertility decline on smallholder farms contributes to low per capita food
    production in sub-Saharan Africa (SSA). Nutrient depletion for agricultural land
    in 37 African countries was estimated to average 660, 75 and 450 kg/ha of N, P
    and K between the years 1960 and 2000 (Smaling et al., 1997). These figures represent
    the balance between nutrient inputs as fertilizer manure, atmospheric deposition,
    biological N2 fixation (BNF) and sedimentation, and nutrient outputs as harvested
    products, crop residue removal, leaching, gaseous losses, surface runoff and erosion.
    The gap between actual and rainfed potential yield has been estimated to be more
    than 4 t/ha for cereals and 2 t/ha for pulse crops (Haggblade and Henzel 2010;
    Haggblade and Plerhoples 2010). Actual mean yield for rainfed maize and irrigated
    rice is 10 to 30% and 30 to 50%, depending on country, of estimated potential
    yield (Global Yield Gap Atlas 2016). The yield gaps are attributed to a range
    of biotic and abiotic constraints, poor agronomic practices and low use of agricultural
    inputs including fertilizer.


    Fertilizer use must be coupled with optimized use of organic resources for nutrient
    supply and maintenance or improvement of soil aggregation, soil microbial activity,
    soil water infiltration and retention, resistance to erosion and nutrient transformation.
    However, the availability of organic resources is not sufficient to meet the nutrient
    needs of substantially increased productivity. For example, a 5 t/ha maize grain
    harvest, depending on the harvest index, requires the uptake of approximately
    100, 24, and 85 kg/ha of N, P, and K (Table 3.1).


    Improved soil fertility management is key to increased smallholder agricultural
    productivity where fertilizer application to cropland averages about 15 kg/ha/yr.
    Fertilizer use needs to be specific to crops and agro-ecological zones (AEZ) and
    with the application of the right nutrients at the right rates, times and placements
    (the 4Rs of nutrient stewardship) to ensure nutrient use efficiency, environmental
    sustainability and profitable yield increases.


    # 3.2 Integrated Soil Fertility Management


    Vanlauwe et al. (2010) defined Integrated Soil Fertility Management (ISFM) as
    a set of soil fertility management practices that necessarily include the use
    of fertilizer, organic inputs and improved germplasm adapted to local conditions,
    aimed at high agronomic use efficiency of the applied nutrients and improving
    crop productivity. It implies efficient use of fertilizer and organic resources
    coupled with such good agronomic practices as planting improved varieties with
    appropriate spacing and timing and good control of weeds, insect pests and diseases.
    Vigorous crop growth is associated with an extensive and vigorous root system
    capable of efficient uptake of soil nutrients and water. The full benefits of
    ISFM may be achieved in a stepwise fashion as farmers learn to best adapt and
    integrate potential components and gain access to financial resources for higher
    levels of management (Figure 3.1). Potential organic soil fertility practices
    vary by AEZ and may include'
