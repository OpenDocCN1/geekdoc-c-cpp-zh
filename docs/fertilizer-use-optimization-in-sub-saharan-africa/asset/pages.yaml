  md: 'of the curves reach a peak at low rates. The rate of application at the peak
    is the rate expected to give the most profit per hectare and is called the economically
    optimal rate (EOR) in this chapter. For example, K applied to pigeonpea has very
    high profit potential but the cost of application should not exceed about 200
    MZM/ha.


    Farmers who are not constrained financially in fertilizer use should apply to
    all crops at EOR to maximize profit per hectare due to fertilizer use. The large
    total profit potential is with N applied to maize, with an expected average return
    of about MZM 15,000 with 2000 invested or about 30 kg N applied, after which the
    rate of return is less until a peak with approximately 100 kg N applied. Using
    different commodity values relative to fertilizer costs will change the shape
    of the curves and Figure 10.3 may not apply well to a farmer who cannot access
    subsidized fertilizer.


    Profit from fertilizer use therefore depends on the nature of the response of
    a crop to applied nutrient (Figures 10.3 and 10.4), the costs of fertilizer use
    and the on-farm value of the commodity considering both the expected market value
    for the surplus and value of that kept for home consumption. The farmer''s choice
    of crops, the land allocated to each crop and the amount of money that the farmer
    has to invest in fertilizer use also need to be considered. Decisions for fertilizer
    use optimization for maximization of net returns are complex for farmers with
    several crops and financially constrained fertilizer use. Easy to use decision
    tools utilizing the complex mathematics of linear programming were developed for
    three recommendation domains of Mozambique.


    # 10.4 Fertilizer optimization tools for Mozambique


    The computer fertilizer optimization tools (FOTs) have been developed to integrate
    economic and agronomic information through linear programming using Excel Solver®
    (Frontline Systems Inc., Incline Village, NV, USA). These are available at http://agronomy.unl.edu/OFRA.
    To use a FOT, the add-in Solver needs to be activated and macros need to be enabled;
    this is addressed in the ''Help and Instructions'' worksheet of the FOT and in
    more detail in an FOT user manual in Extension Training Materials at this website.


    The data input screen (Figure 10.5) requires entry of the land area to be planted
    for each crop and the estimated on-farm value per kilogram of grain near harvest
    time. The example shows that the FOT does optimization across six crops. These
    FOTs do not address intercropping at this time. Each crop is allocated one hectare
    but the farmer is likely to allocate land differently for each crop; if the crop
    is not planted, enter 0 for land area. The cost of using different fertilizers
    is entered; the example shows the subsidized price of MZM of 1500, but the farmer
    should enter the real cost, with or without subsidy, and including transport and
    application costs. If a listed fertilizer is not available, enter 0 for the cost.
    Finally, the money available for fertilizer use is entered as the budget constraint;
    MZM 15,000 was entered in the example. The optimize button is left clicked to
    run the optimization.


    The output includes: the amount of fertilizer to apply to each crop; the expected
    average yield increase and net returns to fertilizer use per hectare; and the
    total net returns to fertilizer use for the farm (Figure 10.6). Most of the recommended
    fertilizer is for maize which has an expected average maize yield increase of
    1775 kg/ha. The expected mean net return to fertilizer use was estimated to be
    MZM 84,725 for a benefit:cost ratio of 5.6. In this example, TSP and KCl were
    assumed to be available. If fertilizer availability were limited to urea and NKP,
    the expected mean net return is MZM 70,896, 84% of the profit potential compared
    with availability of important single nutrient fertilizers.


    Financially constrained fertilizer use optimization contributes to low risk associated
    with fertilizer use through diversification of investment. Rather than applying
    all fertilizer to a single crop at a recommended rate, fertilizer use optimization
    results in fertilizer being applied to two or more crops and over more land at
    lower rates. All crops in all fields are less likely to fail compared to a single
    well fertilized crop in, maybe, only one field.


    For each Excel FOT, a companion paper FOT was developed to be used when a computer
    is not available. The paper FOT has three financial levels: level 1 for the poor
    farmer who has less than one-third of the amount needed to buy the fertilizer
    to apply to all the cropland at EOR; level 2 for the farmer who has less than'
