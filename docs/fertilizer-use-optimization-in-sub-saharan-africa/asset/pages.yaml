    The paper FOT tables address the 4Rs of fertilizer use advising on the right product,
    rate, time and method of application. It also advises on calibration, that is,
    the distance along the band or the number of points per measuring unit for the
    recommended fertilizer rate. A constraint of the paper FOTs is that these need
    to be revised, maybe annually, if significant changes occur in the costs of fertilizer
    use relative to the commodity values. The paper FOT is easy to use (Table 9.3).
    Consider the recommendation for maize under Level 2 financial ability “Maize:
    137 kg NPS at 2 WAP (1 CAP for 4.4 plants); point apply 45 kg urea, 8 WAP (1 CAP
    for 12.5 points)”.


    Therefore, 137 kg/ha of NPS is to be point applied at 2 weeks after planting.
    One 8 ml water bottle cap is sufficient for 4.4 plants. In addition, 45 kg/ha
    urea is to be applied at eight weeks after planting. The farmer learns to apply
    this rate by applying one water bottle lid to 12.5 plants. Another aspect of fertilizer
    use optimization is to adjust fertilizer rates according to other practices when
    these are applied to a parcel of land and to soil test values. After getting the
    results of the FOT, the farmer considers parcels of land where practices of Table
    9.4 have been or will be applied. Some of the practices have fertilizer substitution
