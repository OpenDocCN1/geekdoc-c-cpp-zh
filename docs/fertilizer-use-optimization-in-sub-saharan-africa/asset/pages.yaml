    The paper FOTs are easy to use and are intended for use by farmers themselves
    and their advisors. The farmer''s budget constraint is first considered and the
    financial ability level is determined. Each level has several fertilizer use options,
    each of similar profit potential.


    Consider the lowland rice recommendation under level 2 financial ability “Lowland
    rice. Broadcast at transplanting 0.62 kg/are urea (CAP for 0.6 m), 0.95 kg/are
    DAP (CAP per 0.9 m) and 0.7 kg/ha KCl (CAP per 1.3 m); 0.77


    kg/are urea (CAP for 1.2 m) at panicle initiation”. Therefore 0.62 kg/are of urea,
    0.75 kg/are of DAP and 0.5 kg/are KCl are to be broadcast applied in passes 1.5
    m wide at transplanting time. The farmer calibrates his/her eye and feel using
    the Inyange brand bottle lid (CAP) which is sufficient for 0.6 m for urea, 0.9
    m for DAP and 1.3 m for KCl. At panicle initiation, 0.65 kg/are of urea are to
    be broadcast applied (one bottle lid is enough for 1.2 m).


    A constraint of the paper FOT is that it requires revision by a team at the national
    level when there is significant change in fertilizer use costs relative to grain
    values.


