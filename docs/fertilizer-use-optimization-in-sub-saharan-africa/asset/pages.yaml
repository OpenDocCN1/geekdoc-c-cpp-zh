    The Excel and paper FOTs, along with other tools to aid in fertilizer use decisions
    are available at http://agronomy.unl.edu/OFRA.


    The calibration guidelines for fertilizer application are built into the paper
    FOTs but the guideline needs to be developed separately when using the Excel FOT.
    Applying too much or too little fertilizer reduces farmer profit. The Excel OFRA
    Fertilizer Calibration Tool can be used to advise farmers on application to achieve
    the correct rates (Figure 13.7). This tool is adapted for each country for measuring
    units and fertilizer choices. It considers fertilizer density which differs by
    fertilizer type and allows for a choice between band, point, or broadcast application.


    Another aspect of fertilizer use optimization is considering other management
    practices and soil test information (Table 13.3). Some practices such as manure
    application justify reducing


    fertilizer rates. Intercropping calls for an increase in rates relative to that
    recommended for the cereal sole crop. Soil test P is typically low but when Mehlich
    III P is above 15 ppm, the recommended P or the money for its use should be allocated
    elsewhere. When soil test K <100 ppm, KCl should be applied even if not recommended
    by the FOT. These considerations apply generally for only one or a few of the
    land parcels of a farm. The intent is that Table 13.3 is back-to-back with the
    paper FOT for the AEZ to be provided to farmers and their advisors as a single
    sheet of paper.


