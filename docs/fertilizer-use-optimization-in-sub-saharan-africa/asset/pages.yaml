    # 3.3.4 Intercropping with legumes


    Legume integration into cropping systems is an important component of ISFM. Legume
    production in intercrop association with maize, sorghum, pearl millet, banana,
    cassava and other non-legumes is widely practised and more common in SSA than
    legume rotation with these crops. Intercropping benefits include increased land
    productivity and reduced risk compared with sole crop production. Much bean production
    in SSA is by intercropping with maize, but also with sorghum, banana, cassava
    and other crops. In the Sahel, pearl millet/ cowpea, pearl millet/groundnut and
    sorghum/ groundnut are the most common intercropping systems. In higher rainfall
    AEZ of West Africa, maize intercropped with cowpea, groundnut or soybean is common.
    Pigeonpea is commonly produced by intercropping with maize.


    When crops are complementary in terms of growth pattern, aboveground canopy, rooting
    system and/or periods of high water and nutrient demand, intercropping enables
    more efficient use of photosynthetically active radiation, water and nutrients.
    Intercropping may provide better soil cover compared to sole crop for weed suppression
    and reduced soil erosion and crusting. The legume intercrop may suppress Striga
    infestation of the cereal crop but probably less effectively than with rotation.
    The intercrop complementarity is often achieved through differences in maturity
    times with legumes often making much of their growth and nutrient and water uptake
    before the associated crop forms a full canopy and maturing earlier than the non-legume.
    In such cases, fallen legume leaves may decompose enough to release nutrients
    to the associated crop. In other cases, such as with long season pigeonpea or
    relay intercropping of cowpea, the legume makes much of its growth after the maize
    or other associated crop matures.


