    # 13.4 Optimizing fertilizer use in Rwanda


    Optimization of fertilizer use in this chapter refers to maximizing net return
    to application of nutrients as a means to improved production, food security and
    financial growth as well as improved profits from fertilizer application. Farming
    is a business and fertilizer use is one component of that business.


    Fertilizer use can only be efficient and very profitable if crops are well managed;
    this implies investment in good quality seed of adapted varieties and control
    of weeds, diseases and insects as well as supplying or adding soil nutrients.
    Smallholder farmers, however, typically have severe financial constraints and
    investment in fertilizer use competes with other uses of available finance. Therefore,
    for the farmer with adequate access to finance, optimization of fertilizer use
    may mean applying fertilizer nutrients at rates to maximize profit per hectare
    from fertilizer which in this chapter is referred to as the economically optimal
    rate (EOR). For the financially constrained, however, optimization of fertilizer
    use is applying according to the crop-nutrient-rate combinations that will give
    the highest return on their limited investment.


    Crop response to applied nutrients varies in magnitude and nature. The response
    can be negative, no response, or positive. Results from numerous trials indicated
    that the shape of the response is commonly curvilinear until a yield plateau is
    reached.


    Figure 13.3 illustrates curvilinear to plateau responses of maize, rice and bush
    bean to applied N, P or K in eastern Rwanda with nutrient rate on the x-axis and
    yield on the y-axis. The magnitude of the response can be great as with N applied
    to maize and rice or small such as for P applied to bean. The shape of the responses
    differ with some being abrupt and with the yield increase occurring at low nutrient
    rates, such as with 10 kg/ha P applied to rice and 10 kg/ha N applied to bean.
    Other shapes have a more gradual curvature as with maize and rice response to
    N. In all cases, the yield increase per kg/ha of nutrient applied is greater at
    low rates as compared with higher rates of application until yield reaches a plateau
    beyond which increased rates of nutrient application will not result in increased
    yield. At some point before yield reaches the plateau, the value of yield increase
    per unit of applied nutrient is less than the added cost. The rate where added
    value equals added cost is the EOR. Therefore,


