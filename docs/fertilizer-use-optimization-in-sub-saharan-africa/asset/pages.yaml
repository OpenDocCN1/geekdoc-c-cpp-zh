    The natural vegetation corresponds to seasonal semi-deciduous moist forest or
    tall grass-broad-leaved savanna. The major agricultural activities include maize,
    wheat, barley, seed maize, tea, kale and cabbage. Dairy cattle and sheep are the
    main livestock enterprises.


    The Coastal Lowlands (CL) include the Kenyan coastlands which have well-drained
    sandy soils with a loamy, sandy clay texture and other humid lowlands of less
    than 1500 masl, such as the Taita Hills with fertile loamy soils and the Tana
    and Sabaki river valleys with alluvial soils (silts). The coastal valleys are
    characterized by sand dunes and mangrove swamps with deep, grey, saline and poorly
    drained soils which are not suitable for crop production.


    # # 7.2 Soil fertility management


    The Upper Midlands (UM) are semi-humid to semi-arid, very productive and occupy
    about 5% of the total land area. It is at 1500-2000 masl with an average temperature
    of 18-21°C, an annual rainfall of 600-1350 mm and a moisture index of 40-50%.
    The original vegetation was deciduous woodland. The main agricultural enterprises
    include maize, maize-bean intercrop, sunflower, wheat, sweet potato, finger millet,
    sorghum, kale and cabbage. Crop residues are fed to dairy cattle and sheep.


    Most of the agricultural soils in Kenya have inherently low soil fertility, low
    soil moisture retention and high erodibility, but have been intensively farmed
    by smallholders. There has been a general decline in crop and pasture yields,
    soil physical properties, vegetation cover and biological diversity but an increase
    in noxious weeds. The most critical limiting nutrients are N and P while K, S
    and some micronutrient deficiencies are often diagnosed.


    The Lower Midlands (LM) are semi-arid lands of 1000-1500 masl with an average
    temperature of 21-24°C, annual rainfall ranging from 450-900 mm and a moisture
    index of 25-40%. The agriculture is a mix of livestock and crop production. The
    AEZ occupies about 15% of the total land area. The main agricultural enterprises
    are rainfed maize, sorghum, millet, cassava, bean, pigeonpea, cowpea, green gram,
    groundnut, citrus and mango. Banana is produced under furrow irrigation. Livestock
    types include cattle, goats, sheep, camels, donkeys and bees while forages used
    include acacia and grasses. The major soil types are Luvisols, Acrisols and Vertisols.


    Soil fertility research in East Africa began in the 1930s and addressed the restoration
    of soil fertility through the combined use of vegetative fallows and animal manures.
    Traditional farming systems in sub-Saharan Africa were supported by shifting slash-and-burn
    cultivation, a low input sustainable agricultural farming system that allowed
    for several years of native vegetation and woody plant growth that resulted in
    nutrient cycling, restoration of soil organic matter, and improved soil physical
    properties to restore soil productivity. However, population growth has increased
    demand for food, feeds and fuel which has led to decreased fallow with resultant
    soil fertility decline.


    The Inner Lowlands (IL) are arid and very arid lands at 750-1000 masl with an
    average temperature of more than 24°C, less than 550 mm/yr of rainfall and a moisture
    index of 15-25% or less. The area occupies about 66%


    Manure is commonly used by most smallholders who practise mixed crop-livestock
    farming especially in maize, potatoes and vegetables but its widespread usage
    is limited by low availability. Other organic materials used are liquid manure,
    composts, green manures, crop residues and municipal wastes (Gachene and Kimaru
    2003). Other sources of replenishment included use of rotation with grain legumes,
    cereal-legume intercropping systems, mulch,'
