    # 11.7 Adjusting fertilizer rates in consideration of other practices and soil
    test information


    The Excel and paper versions of the FOTs gives optimized recommendations for fertilizer
    use for within the farmer’s context. However, these recommendations need to consider
    other practices that affect nutrient availability (Table 11.4). When soil test
    information is available, fertilizer rates may be adjusted. For example, the application
    of farmyard manure or compost at 2.5 t/ha is expected to result in increased yield
    but also increased response to fertilizer on upland soils. Therefore, fertilizer
    rate should not be reduced. However, application of high quality dairy or poultry
    manure justifies a fertilizer rate decrease and reallocation to another field.
    If Bray-1 P is above 12 ppm, recommended fertilizer P should not be applied to
    that field.


