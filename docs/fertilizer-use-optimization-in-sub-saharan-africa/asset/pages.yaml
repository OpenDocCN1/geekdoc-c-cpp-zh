  md: 'agroforestry trees for litter fall and shifting livestock holding pens periodically.


    Substantial research in soil fertility status and restoration was carried out
    under the Fertilizer Use Recommendation Project (FURP) (1987-1993), which resulted
    in 24 district-based fertilizer recommendations for major crops including maize,
    sorghum, bean, cowpea, finger millet and other crops.


    Other uncoordinated fertilizer use studies in various parts of the country have
    given rise to numerous fertilizer use practices targeting maize, which include
    soil nutrient replenishment with rock phosphate (PREP), fortified composting (COMP),
    relay intercropping with Lablab purpureus (LABLAB), staggered-row intercropping
    (MBILI, an acronym for managing beneficial interactions in legume intercrops)
    and short-term improved Crotalaria grahamiana fallows (IMPFAL).


    Most fertilizer is applied to maize, rice and horticultural crops in Kenya (GoK
    2014). Fertilizer use in these and other crops is still low. For example, Kenyan
    farmers apply an average of 50 kg/ha of nutrients to maize compared to 125, 180
    and 300 kg/ha in South America, India and the European Union, respectively (Ariga
    and Jayne 2010; Jama et al. 2013).


    Agro-ecological potential affects fertilizer use decisions with much more fertilizer
    applied to maize in the high-potential areas compared with the semi-arid areas,
    such as the lower eastern region where fertilizer used is often unprofitable for
    farmers unless highly subsidized (Ariga et al. 2008). Fertilizer price levels,
    household income and education level of the household head also affect fertilizer
    use.


    The main fertilizer types used for maize production are calcium ammonium nitrate,
    urea, compound fertilizers like diammonium phosphate (DAP) and ammonium sulphate,
    and NPK blends such as 23:23:0 and 17:17:17.


    Fertilizer is a costly input to crop production and efficient use is needed to
    improve profitability, minimize loss of nutrients to the environment and reduce
    soil acidification due to N application.


    The 4Rs of nutrient management are important, that is to apply the right product,
    the right rate, at the right time and using the right method.


    This is especially important for N, which is easily lost, e.g. most of the fertilizer
    nitrogen should be applied at the start of and/or during the period of rapid crop
    growth when the rate of N uptake is high and N should be incorporated to minimize
    ammonia volatilization. With maize, for example, this means that at least 50%
    of the fertilizer N should be applied six weeks after planting (6 WAP). However,
    when the recommended rate of N is low, it is advisable to apply all at 6 WAP.
    Fertilizer N should not be applied during dry periods. Also important to good
    response to fertilizer is to have a healthy and well managed crop with good choice
    of variety, timely planting, and good weed and pest control.


    # 7.3 Diagnosis of soil nutrient deficiencies


    In the Optimizing Fertilizer Recommendations in Africa (OFRA) project, 37 trials
    were conducted for various crops in four trials of Kenya. The mean responses to
    N, P and K across these trials were 39, 5 and 17%, respectively. Treatments were
    included to compare the diagnostic package of N+P+K+Mg+S+Zn+B with a treatment
    with the same N, P, and K rates for effect on grain yield. Any yield increase
    with the diagnostic treatment would indicate that deficiency of Mg, S, Zn and/or
    B may limit yield at that location. The mean yield increase was 10% in Rift Valley
    upper region, but mean effect of the diagnostic treatment was not different from
    zero in the other regions (Figure 7.3). Further investigation is needed to determine
    which nutrient is most deficient in the Rift Valley upper region such as with
    more nutrient specific trials and/or foliar tissue analysis.


