    13.4a-c. The table presents the crop response functions in columns 3-5, the expected
    yield (t/ha) increases due to increments of applied elemental nutrients in columns
    6-9 and a comparison of the EOR with recommended elemental nutrient rates (REC)
    in columns 10-11. Both RECs and EORs assume the crop will be well managed and
    that the field does not have abnormally severe constraints to crop growth such
    as very shallow soil, very low pH, or very low water holding capacity.


    All seven crops considered for Eastern AEZ had an economic response to applied
    N including soybean which occurred primarily with the first 30 kg/ha of N applied
    (Table 13.4a). All crops except banana and sweet potato had profitable response
    to P with >50% of response occurring with 5 kg/ha elemental P applied in most
    cases. All crops except for


    sorghum and sweet potato were found to have profitable response to applied K.


    All seven crops considered for the South Central AEZ had economic responses to
    applied N, P, and K, with the exception of sweet potato for P. Low rates of nutrient
    application were very effective (Table 13.4b).


    All six crops considered for the Northwestern AEZ had economic responses to applied
    N, P and K with much of the response occurring at low rates of nutrient application
    (Table 13.4c). The K EORs were determined for several crops which did not have
    RECs for K application.


    The EOR for N was generally more than or similar to the REC. The EOR for P was
    generally less than the REC. The EOR for K was generally more than the REC. The
    EOR will change with substantial changes in fertilizer prices relative to grain
    values.'
