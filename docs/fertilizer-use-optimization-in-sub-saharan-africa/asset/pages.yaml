    # 9.1.2 Current soil fertility management in Malawi


    Soil degradation and inherently low soil fertility contribute to the unsustainable
    low productivity of existing production systems and threaten long-term food insecurity
    in sub-Saharan Africa. In Malawi, agriculture is dominated by production of maize,
    the main staple crop, with 1.2 million hectares of production annually, occupying
    about 80% of cultivated land. Most


    production is by smallholder farmers with limited access and use of fertilizer,
    improved seed and other inputs due to high costs and low financial ability.


    Low-cost good agricultural practices (GAP) for enhancing soil nutrient availability
    have been studied including crop residue management; agro-forestry; maize-legume
    rotations; area-specific maize fertilizer recommendations to improve nutrient
    use efficiency; conservation agriculture; climate smart practices; and use of
    compost. Integration of organic resources and N fixing legumes in rotations with
    fertilizer use has been well studied. However, adoption of such GAP is low and
    the perceived profit potential of fertilizer use in maize production is unattractive
    to many smallholders at current maize price to fertilizer cost ratios relative
    to other uses of available finance.


    Traditional practices affecting soil fertility have variable effects on soil fertility
    and crop productivity. Shifting cultivation is no longer feasible for soil fertility
    restoration due to land use pressure. Ridging of the soil for cereal production
    across the field slope using hand hoes is very common for soil aeration, water'
