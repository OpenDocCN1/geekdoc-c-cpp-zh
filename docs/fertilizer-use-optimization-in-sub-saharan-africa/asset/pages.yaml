  md: '# 3.3.7 Adding perennials to the annual crop rotation


    Based on research begun in the 1930s, Uganda has a rarely used recommended rotation
    of three to four years in annual crop rotated with three years of well managed
    perennial ley. The ley could be established from natural revegetation or planting,
    such as with Napier grass. The effectiveness of ley in the rotation in maintaining
    soil productivity was greater than planting of green manure crops. The forage
    could be grazed or harvested for animal feeding. The benefit appeared to be due
    to the increase in active soil organic matter, improved soil physical properties
    and improved soil P availability. The greatest benefit may be on sandy soils of
    low organic matter that are not very responsive to fertilizer use. An added advantage
    on erodible land is the protection from erosion throughout the rotation by having
    good vegetative ground cover for the ley, the improved resistance to erosion because
    of improved soil aggregation and the enhanced productivity and ground cover of
    the annual crops. Perennial ley in rotation is similar to fallow but the ley needs
    to be well managed to be effective.


    Fallowed lands are commonly abused by unregulated overgrazing, giving the plants
    little opportunity to develop good root systems and achieve high productivity.
    The rotation can be profitable not only because of the increased annual crop yields
    but also through use of the forage produced for profit-oriented intensive ruminant
    production. The system cannot work well where farmers have no control of grazing
    as even severe overgrazing during the dry season is likely to delay perennial
    recovery and reduce productivity and soil improvement.


    Another means of adding perennials to annual crops is with short duration tree
    leotls. The tree lots may be solely as a form of improved fallow and a green manure
    crop. More often the trees will have a harvested product such as high protein
    forage for dairy or producing wood products. Leguminous trees add N to the system
    and cycle deep nutrients but such trees are likely to be less effective in increasing
    soil organic matter and improving soil aggregation compared with perennial grass.


    # 3.3.8 Parkland agriculture


    Parkland agriculture is a term used in the Sahel and Sudan Savannas and refers
    to annual crop production under and around generally large, erect trees (Depommier
    1996). It is practised elsewhere in some semi-arid parts of eastern and southern
    Africa, often on sandy soils of low productivity and with low soil organic matter,
    but the term parkland agriculture is commonly used only in west Africa.


    The trees add organic material to the soil and improve soil water holding capacity
    and nutrient availability. The most recognized parkland tree is Faidherbia (Acacia)
    albida (Photo 2). It is unique for its reverse phenology in that it sheds its
    leaves during the rainy season reducing direct competition for water, light and
    nutrients. In the hot and dry season it produces leaves which can be used as fodder.
    The dry season shade leads to ruminant livestock gathering under the trees where
    more excretion of faeces and urine occurs compared with open areas. Faidherbia
    is a legume adding N to the farming system. Compared with open fields, the N and
    P availability under trees have been determined to be 200 and 30% more, respectively,
    and crop performance is noticeably better with measured yield increases of greater
    than 100%.


    Other trees such as the shea-tree (Vitellaria paradoxa) are also effective, although
    less so compared with Faidherbia, in improving annual crop productivity while
    providing its own economically valuable yield. Parkia biglobosa is


    ![](img/279f2242dca113ddfb6220d3a162ffff_32_0.png)


    Photo 2: Pearl millet production is commonly greater under Faidherbia trees. These
    trees do not have leaves during the rainy season and are leafy during the dry
    season (reverse phenology).'
