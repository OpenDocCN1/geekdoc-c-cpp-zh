    # Figure 16.2: Response curve of cowpea for P application.


    There are several mathematical formulas that are used to model fertilizer response.
    Creating an equation to represent crop response to a fertilizer input allows economic
    analysis to determine the return on an investment over a range of prices and costs.
    In this case the curvilinear to plateau yield response to applied nutrient is
    represented by the equation Y = a – bc^x where Y is yield, a is yield at the plateau,
    b is the yield increase due to application of the concerned nutrient, c is a determinant
    of the shape of the response curve, and r is the nutrient application rate. Crop
    nutrient response


    Another important aspect of achieving high profit from fertilizer use for financially
    constrained farmers is the need to know the return of a kwacha invested over a
    range of nutrients applied to a range of crops. In other words, which nutrients
    applied to which crops bring the most return for the amount available to invest?


    An example of the data needed to make these decisions is shown in Figure 16.3.
    In this graph from Region III, the x-axis (horizontal axis) is Zambia kwacha (ZMK),
