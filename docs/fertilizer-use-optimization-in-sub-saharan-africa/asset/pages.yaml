    # ## 4.3 Soil nutrient management, including fertilizer use, in Burkina Faso


    Traditional fallowing practices had various important ecological and sociological
    functions including restoration of soil fertility and biodiversity, hunting and
    supplies of medicinal plants. However, fallowing is less common than in the past
    due to demographic pressure and more intensive land use (Ouattara et al., 2006).


    In Burkina Faso, estimates indicate that nutrient mining from 6.6 million hectares
    of cultivated land amounted to a total loss of 95,000 tonnes of N, 28,000 tonnes
    of P2O5, and 79,000 tonnes of K2O, equivalent to US$ 159 million of NPK fertilizer
    (Bationo et al., 1998; MAHRH 1999).


    Arable lands are increasingly degraded in terms of soil productivity, biodiversity
    and ground water recharge due to shortening fallow periods, over-grazing and animal
    traffic. Other traditional soil fertility management practices include land application
    of organic resources such as manure and household wastes. The contracting of herdsmen
    to keep livestock overnight in the field during the dry season for excretion of
    urine and faeces has a strong tradition.


    Fertilizer recommendations developed in the 1970s and 1980s differ by rainfall
    regime but do not consider other aspects of the farmer’s situation. The application
    of organic fertilizer (OM) is recommended at 5 t/ha every two years for integration
    with fertilizer use. Evidence for adjusting fertilizer for soil test results is
    weak. OFRA activities have improved the information basis for fertilizer use decisions.


    The soils in Sub-Saharan Africa are known for their low nutrient contents. Fertilizer
    use has resulted in crop yield increases. In on-station and on-farm trials conducted
    in 2014–15 in the three AEZ of Burkina Faso, nitrogen (N) application compared
    to the control gave mean grain yield increases of 27% for rice, 40% for sorghum,
    53% for pearl millet and 181% for maize. For legume crops, P application resulted
    in mean yield increases of


