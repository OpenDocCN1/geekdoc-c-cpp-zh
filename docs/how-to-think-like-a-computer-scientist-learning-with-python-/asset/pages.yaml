  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, 3rd Edition


    ```

    1 filename = input("Enter a file name: ")

    2 try:

    3     f = open(filename, "r")

    4 except:

    5 print("There is no file named", filename)

    ```


    The try statement has three clauses, or parts, introduced by the keywords try
    ... except ... finally. Either the except or the finally clauses can be omitted,
    so the above code shows the most common version of the try statement.


    The try statement executes and monitors the statements in the first block. If
    no exceptions occur, it skips the block under the except clause. If any exception
    occurs, it executes the statements in the except clause and then continues.


    We could encapsulate this capability in a function: exists which takes a filename
    and returns true if the file exists, false if it doesn''t:


    ```

    1 def exists(filename):

    2 try:

    3     f = open(filename)

    4     f.close()

    5     return True

    6 except:

    7     return False

    ```


    # A template to test if a file exists, without using exceptions


    The function we''ve just shown is not one we''d recommend. It opens and closes
    the file, which is semantically different from asking "does it exist?" How? Firstly,
    it might update some timestamps on the file. Secondly, it might tell us that there
    is no such file if some other program already happens to have the file, or if
    our permission settings don''t allow us to open the file.


    Python provides a module os.path within the os module. It provides a number of
    useful functions to work with paths, files and directories, so you should check
    out the help.


    ```

    1 import os

    2

    3 # This is the preferred way to check if a file exists.

    4 if os.path.isfile("c:/temp/testdata.txt"):

    5     ..

    ```


    We can use except clauses to handle different kinds of exceptions (see the Errors
    and Exceptions lesson from Python creator Guido van Rossum''s Python Tutorial
    for a more complete disclosure of exceptions). So the program could do one thing
    if the file does not exist, but do something else if the file was in use by another
    program.'
