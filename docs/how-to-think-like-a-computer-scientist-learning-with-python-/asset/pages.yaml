  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    **Boolean algebra** Some rules for rearranging and reasoning about Boolean expressions.


    **Boolean expression** An expression that is either true or false.


    **Boolean value** There are exactly two Boolean values: `True` and `False`. Boolean
    values result when a Boolean expression is evaluated by the Python interpreter.
    They have `bool`.


    **branch** One of the possible paths of the flow of execution determined by conditional


    **chained conditional** A conditional branch with more than two possible flows
    of execution. In Python chained conditionals are written with `if ... elif ...
    else ...` statements.


    **comparison operator** One of the six operators that compares two values: `==`,
    `!=`, `>`, `<`, and `<=`.


    **condition** The Boolean expression in a conditional statement determines which
    branch is executed.


    **conditional statement** A statement that controls the flow of execution depending
    on condition. In Python the keywords `if`, `elif`, and `else` are used for conditional
    statements.


    **logical operator** One of the operators that combines Boolean expressions: `and`,
    `or`, and `not`.


    **nesting** One program structure within another, as a conditional statement inside
    a branch of another conditional.


    **prompt** A visual cue that tells the user that the system is ready to accept
    input data.


    **true table** A concise table of Boolean values that can describe the semantics
    of an operator.


    **type conversion** An explicit function that takes a value of one type and computes
    a responding value of another type.


    **wrapping code in a function** The process of adding a function header and parameters
    to a sequence of program statements is often referred to as “wrapping code in
    a function”. This process is very useful when the program in question is going
    to be used multiple times. It is even more useful when it allows the programmer
    to express mental chunking, and how they''ve broken a complex problem into pieces.


