  md: "# # How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\nYou can almost read the while statement as if it were\
    \ English. It means, while v is less than or equal to n, continue the execution\
    \ of the loop. In the body, each time, increment v. When v passes n, return your\
    \ accumulated sum.\n\nMore formally, here is precise flow of execution for a while\
    \ statement:\n\n+   * Evaluate the condition at line 5, yielding a value which\
    \ is either False or True.\n* If the value is False, exit the while statement\
    \ and continue execution at the statement (line 8 in this case).\n* If the value\
    \ is True, execute each of the statements in the body (lines 6 and 7) and then\
    \ go back to the while statement at line 5.\n\nThe body consists of all of the\
    \ statements indented below the keyword.\n\nNotice that if the loop condition\
    \ is False the first time we get the loop, the statements in the body are never\
    \ executed.\n\nThe body of the loop should change the value of one or more variables\
    \ so that the condition becomes false and the loop terminates. Otherwise the loop\
    \ will repeat forever, which is called an infinite loop. An endless source of\
    \ amusement for computer scientists is the observation that demands on shampoo,\
    \ \"lather, rinse, repeat\", are an infinite loop.\n\nIn this case, we can prove\
    \ that the loop terminates because we know the value of n is finite, and we can\
    \ see that the value of v increments each time through the loop, so eventually\
    \ it will have to exceed n. In other cases, it is not easy, impossible in some\
    \ cases, to tell if the loop will terminate.\n\nWhat you will notice is that the\
    \ while loop is more work for you — the programmer than the equivalent for loop.\
    \ When using a while loop one has to manage the loop variable yourself: give it\
    \ an initial value, test for completion, and then make sure you change something\
    \ in the body that the loop terminates. By comparison, there is an equivalent\
    \ function that uses for instead:\n\n```\ndef sum_to(n):\n    \"\"\" Return the\
    \ sum of 1+2+... n \"\"\"\n    ss = 0\n    for v in range(n+1):\n        ss =\
    \ ss + v\n    return ss\n```\n\nNotice the slightly tricky call to the range function\
    \ — we had to add one onto one but excluding the value you give it. It is easy\
    \ to make a programming mistake and overlook this, but because we've made the\
    \ investment of writing some unit tests, our test suite would have caught our\
    \ error.\n\nSo why have two kinds of loop if for looks easier? This example shows\
    \ a case where we need the extra power that we get from the while loop."
