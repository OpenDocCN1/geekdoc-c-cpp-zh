    # 1.2 What is a program?


    A **program** is a sequence of instructions that specifies how to perform a computation.
    The computation might be something mathematical, such as solving a system of equations
    or finding the roots of the polynomial, but it can also be a symbolic computation,
    such as searching and replacing text in a document or (strangely enough) compiling
    a program.


    The details look different in different languages, but a few basic instructions
    appear in about every language:


    +   **input** Get data from the keyboard, a file, or some other device.


    +   **output** Display data on the screen or send data to a file or other device.


    +   **math** Perform basic mathematical operations like addition and multiplication.


    +   **conditional** Check for certain conditions and execute the appropriate sequence
    of statements.


    +   **repetition** Perform some action repeatedly, usually with some variation.


    Believe it or not, that''s pretty much all there is to it. Every program you''ve
    ever used, no matter how complicated, is made of instructions that look more or
    less like these. Thus, we can describe programming as the process of breaking
    a large, complex task into smaller and smaller subtasks until the subtasks are
    simple to be performed with these basic instructions.


    That may be a little vague, but we will come back to this topic later when we
    talk about **algorithms**.


    # 1.3 What is debugging?


    Programming is a complex process, and because it is done by human beings, it often
    leads to errors. Programming errors are called **bugs** and the process of tracking
    them down and correcting them is called **debugging**. Use of the term **bug to
    describe small engineering difficulties dates back to least 1889, when Thomas
    Edison had a bug with his phonograph.


    Three kinds of errors can occur in a program: **syntax errors**, **runtime errors**,
    and **semantic errors**. It is useful to distinguish between them in order to
    track them more quickly.


    # 1.4 Syntax errors


    Python can only execute a program if the program is syntactically correct; otherwise,
    the program fails and returns an error message. **Syntax** refers to the structure
    of a program and the rules about that structure. For example, in English, a sentence
    must start with a capital letter and end with a period. This sentence contains
    a **syntax error**. Does this one


    For most readers, few syntax errors are not a significant problem, which is why
    we can read the poetry of E. E. Cummings without problems. Python is not so forgiving.
    If there is a single'
