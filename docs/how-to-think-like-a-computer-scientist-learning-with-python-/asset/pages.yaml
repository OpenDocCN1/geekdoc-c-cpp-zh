    make it understandable. Typically, we have a program that is already working,
    then we go back to “tidy up”. It often involves choosing variable names, or spotting
    repeated patterns and moving that code into a function.


    **stack diagram** A graphical representation of a stack of functions, their variables,
    and the values to which they refer.


    **traceback** A list of the functions that are executing, printed when a runtime
    error occurs. A traceback is also commonly referred to as a *stack trace*, since
    it lists the functions in the order in which they are stored in the *runtime stack*.


    **void function** The opposite of a fruitful function: one that does not return
    a value. It is executed for the work it does, rather than for the value it returns.


