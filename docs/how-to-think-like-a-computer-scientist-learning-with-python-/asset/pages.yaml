  md: '# CHAPTER

    EIGHTEEN


    # # RECURSION


    Recursion means “defining something in terms of itself” usually at some smaller
    scale, perhaps multiple times, to achieve your objective. For example, we might
    say “A human being someone whose mother is a human being", or “a directory is
    a structure that holds files and (smaller) directories", or “a family tree starts
    with a couple who have children, each with their own family sub-trees".


    Programming languages generally support recursion, which means that, in order
    to solve a problem, functions can call themselves to solve smaller subproblems.


    #  18.1 Drawing Fractals


    For our purposes, a fractal is a drawing which also has self-similar structure,
    where it can be defined in terms of itself.


    Let us start by looking at the famous Koch fractal. An order 0 Koch fractal is
    simply a straight line of a given size.


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_277_0.png)


    An order 1 Koch fractal is obtained like this: instead of drawing just one line,
    draw four smaller segments, in the pattern shown here:


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_277_1.png)


    Now what would happen if we repeated this Koch pattern again on each of the order
    1 segments? We''d get this order 2 Koch fractal:


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_277_2.png)'
