    PyGame does all its drawing onto rectangular surfaces. After initializing PyGame
    at line 5, we create a window holding our main surface. The main loop of the game
    extends from line 15 to 30, with the following key bits of logic:


    +   - First (line 16) we will poll to fetch the next event that might be ready
    for us. This step will always be followed by some conditional statements that
    will determine any event that we''re interested in has happened. Polling for the
    event consumes it, as far as PyGame is concerned, so we only get one chance to
    fetch and use each event. On line 17 we test whether the type of event is the
    defined constant pygame.QUIT. This is the event that we''ll see when the user
    clicks the close button on the PyGame window. In response to this, we leave the
    loop.

    - Once we''ve left the loop, the code at line 32 closes window, and we''ll return
    from function. Your program could go on to do other things, or reinitialize pygame
    and create another window, but it will usually just end there.

    - There are different kinds of events — key presses, mouse motion, clicks, joystick
    movement, and so on. It is usual that we test and handle all these cases with
    new code squeezed in between line. The general idea is "handles events first,
    then worry about the other stuff".n- At line 20 we''de update objects or data
    — for example, if we want to vary the color, position or size of the rectangle
    we''re about to draw, we re-assign some_color, `small_rect` here.

