    # 3.2 Instances — a herd of turtles


    Just like we have many different integers in a program, we can have many turtles.
    Each of them is called an instance. Each instance has its attributes and methods
    — so alex might draw with a black pen and be at some position, while tess might
    be going in her direction with a fat pink pen.


    ```

    import turtle

    wn = turtle.Screen() # Set up the window and its attributes

    wn.bgcolor("lightgreen")

    wn.title("Tess & Alex")


    tess = turtle.Turtle() # Create tess and set some attributes

    tess.color("hotpink")

    tess.pensize(5)


    alex = turtle.Turtle() # Create alex

    ntess.forward(80) # Make tess draw equilateral triangle

    tess.left(120)

    tess.forward(80)

    tess.left(120)

    tess.forward(80)

    tess.left(120) # Complete the triangle


    tess.right(180) # Turn tess around

    tess.forward(80) # Move her away from the origin


    alex.forward(50)

    alex.left(90)

    alex.forward(50)

    alex.left(90)

    alex.forward(50)

    alex.left(90)

    alex.forward(50)

    alex.left(90)


    wn.mainloop()

    ```


    Here is what happens when alex completes his rectangle, and tess completes her
    triangle:'
