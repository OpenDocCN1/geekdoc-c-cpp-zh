  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\nRepeating our pattern again gets us an order 3 Koch fractal:\n\
    \n![](img/ddd7692255b55d8f3b8797c0ad440f9d_278_0.png)\n\nNow let us think about\
    \ the other way around. To draw a Koch fractal of order 3, we can simply draw\
    \ order 2 Koch fractals. But each of these in turn need order 1 Koch fractals,\
    \ and each of those in turn need order 0 fractals. Ultimately, the only drawing\
    \ that will take place is order 0. This is simple matter to code in Python:\n\n\
    ```\ndef koch(t, order, size):\n    \"\"\n    Make turtle t draw a Koch fractal\
    \ of 'order' and 'size'.\n    Leave the turtle facing the same direction.\n  \
    \  \"\"\"\n\n    if order == 0: # The base case is just a straight line\n    \
    \    t.forward(size)\n    else:\n        koch(t, order-1, size/3) # Go 1/3 of\
    \ the way\n        t.left(60)\n        koch(t, order-1, size/3)\n        t.right(120)\n\
    \        koch(t, order-1, size/3)\n        t.left(60)\n        koch(t, order-1,\
    \ size/3)\n```\n\nThe key thing is that new is here that if order is not zero,\
    \ koch calls itself to get its job done.\n\nLet's make a simple observation and\
    \ tighten up this code. Remember that turning by 120 is the same as turning left\
    \ by -120. So with a bit of clever rearrangement, we can use a loop instead of\
    \ 10-16:\n\n```\ndef koch(t, order, size):\n    if order == 0:\n        t.forward(size)\n\
    \    else:\n        for angle in [60, -120, 60, 0]:\n            koch(t, order-1,\
    \ size/3)\n            t.left(angle)\n```\n\nThe final is 0 degrees — so it has\
    \ no effect. But it has allowed us to find a pattern and reduce seven lines of\
    \ code to three, which will make easier for our next observations.\n\n# Recursion,\
    \ the high-level view\n\nOne way to think about is to convince yourself that the\
    \ function works correctly when you call it for an order 0 fractal. Then do a\
    \ mental leap of faith, saying \"the fairy godmother (if you can think of Python\
    \ as your fairy godmother) knows how to handle the recursive"
