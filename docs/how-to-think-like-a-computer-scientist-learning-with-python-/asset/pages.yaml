  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\nA natural way to represent a point in Python is with\
    \ two numeric values. The question, is, how to group these two values into a compound\
    \ object. The quick and dirty solution is to use a tuple, and for some applications\
    \ might be a good choice.\n\nAn alternative is to define a new class. This approach\
    \ involves a bit more effort, but it has advantages that will be apparent. We'll\
    \ point out how each class has an x and y attribute, so our first class definition\
    \ looks like:\n\n```\nclass Point:\n    \"\"\"Point class represents and manipulates\
    \ x,y coords. \"\"\"\n    def __init__(self):\n        \"\"\"Create a new point\
    \ at the origin \"\"\"\n        self.x = 0\n        self.y = 0\n```\n\nClass definitions\
    \ can appear anywhere in the program, but they are usually near the beginning\
    \ (after the import statements). Some programmers and languages prefer to put\
    \ every class in a module of one - we don't do that. The syntax rules for a class\
    \ definition are the same as for other statements. There is a header which begins\
    \ with the keyword, class, followed by the name of the class, and ending with\
    \ a colon. Indentation levels tell us whether the class ends.\n\nIf the first\
    \ line of a class has a header, it becomes the docstring of the class, and will\
    \ will be recognized by various tools. (This is also the way docstrings work in\
    \ functions.)\n\nEvery class should have a method with the name __init__. This\
    \ initializer method is automatically called whenever a new instance of Point\
    \ is created. It gives the program opportunity to set the attributes within the\
    \ new instance by giving them their initial state/values. The self parameter (we\
    \ could choose any other name, but self is the convention) is automatically used\
    \ to reference the newly created object that needs to be initialized.\n\nSo let's\
    \ use our new Point class follows:\n\n```\np = Point()           # Instantiate\
    \ an object of type Point\nq = Point()           # Make a second point\nprint(p.x,\
    \ p.y, q.x, q.y) # Each point object has its own x and y\n```\n\nThis program\
    \ prints:\n\n```\n0 0 0\n```\n\nbecause during initialization of the objects,\
    \ we created two attributes x and y for each, and gave them the value 0.\n\nThis\
    \ should look familiar — weve used classes to create more than one object:\n\n\
    ```\nfrom turtle import Turtle\ntess = Turtle()       # Instantiate objects of\
    \ type Turtle\nalex = Turtle()\n```\n\n215 Chapter 15. Classes and Objects — the\
    \ Basics"
