  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n#  7.10 Tables\n\nOne of the things loops are good for\
    \ generating tables. Before computers were readily available, people had to calculate\
    \ logarithms, sines and cosines, and other mathematical functions by hand. To\
    \ make that easier, mathematics books contained long tables listing the values\
    \ of these functions. Creating tables was slow bowing, and they tended to be full\
    \ of errors.\n\nWhen computers appeared on the scene, one of the initial reactions\
    \ were, “This is great! We can use the computers to generate the tables, so there\
    \ will be no errors.” Turned out to be true (mostly) shortsighted. So thereafter,\
    \ computers and calculators were pervasive that the tables became obsolete.\n\n\
    Well, for some operations, computers use tables of values to get an approximate\
    \ answer and then perform computations to improve the approximation. In some cases,\
    \ there have been errors in the underlying tables, most famously in the Intel\
    \ Pentium processor chip used perform floating-point division.\n\nAlthough a log\
    \ table is not as useful as it once was, it still makes a good example of iteration.\
    \ The following program outputs a sequence of values in the left column and 2\
    \ raised to the power of value in the right column:\n\n```\nfor x in range(13):\
    \      # Generate numbers 0 to 12\n    print(x, \"\\t\", 2**x)\n```\n\nThe string\
    \ \"t\" represents a tab character. The backslash character in \"t\" indicates\
    \ the beginning of an escape sequence. Escape sequences are used to represent\
    \ invisible characters like tabs and newlines. The sequence \\n represents a newline.\n\
    \nAn escape sequence can appear anywhere in a string; in this example, the tab\
    \ escape sequence is the only thing in the string. How do you think you represent\
    \ a backslash in a string?\n\nThe tab character shifts the cursor to the right\
    \ until it reaches one of the tab stops. Tabs are useful for making columns of\
    \ text line up, as in the output of the previous program:\n\n|0 1|\n1 2|\n2 4|\n\
    3 8|\n4 16|\n5 32|\n6 64|\n7 128|\n8 256|\n9 512|\n10 1024|\n11 2048|\n12 4096|\n\
    \n# 7.10. Tables"
