    A compound image containing smaller patches which are intended for animation is
    called a sprite sheet. Download this sprite by right-clicking in your browser
    and saving it in your working directory with the name duke_spritesheet.png.


    The sprite sheet has been quite carefully prepared: each of the 10 patches are
    spaced exactly 50 pixels apart. So, assuming we want to draw patch number 4 (numbering
    from 0), we want to draw only the rectangle that spans x position 200, and is
    50 pixels wide, within the sprite sheet. Here we''ve shown the patches and highlighted
    the patch we want to draw.


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_270_0.png)


    The blit method we have been using — copying pixels from one surface to another
    — can copy a sub-rectangle of the source surface. The great idea is that each
    time we draw Duke, we won''t blit the whole sprite sheet. Instead we''ll provide
    an rectangle argument that determines which portion of the sheet will be blitted.


    We''re going to add new code in this to our existing N queens drawing game. What
    we want is put some instances of Duke on the chessboard somewhere. If the user
    clicks one of them, we''ll get him to respond by waving, for one cycle of his
    animation.


    But before that, we need another change. Until now, our game loop has been running
    at really fast rates that are unpredictable. So we''ve chosen some magic numbers
    for gravity and bouncing kicking kicking the ball on basis of trial-and-error.
    If we''re going to start animating sprites, we need to tame our game loop to operate
    at a fixed, known rate. This will allow us to plan our animation better.


    PyGame uses the tools to do this in just two lines of code. In the setup section
    of the game, we instantiate a Clock object:


    ```

    my_clock = pygame.time.Clock()

    ```


    and right at the bottom of the game loop, we call a method on this object that
    limits the rate to whatever we specify. So lets plan our game and animation for
    60 frames per second, by adding this line to the bottom of our game loop:


    ```

    my_clock.tick(60) # Waste time so that frame rate becomes 60 fps

    ```


    You''ll have to adjust the number for gravity and kicking the ball now, to match
    this slower frame rate. When we play an animation that it only works at a fixed
    rate, we will bake the animation. In this case we''re baking our animations for
    60 frames per second.


    To fit into this existing framework we already have for our queens, we want to
    create a DukeSprite class that has all the methods as the QueenSprite class. Then
    we can add one or more Duke instances into our list of all_sprites, and our existing
    game loop will then call methods of the Duke instance. Let us start with skeleton
    scaffolding for the new class:


    ```

    class DukeSprite:

    ```'
