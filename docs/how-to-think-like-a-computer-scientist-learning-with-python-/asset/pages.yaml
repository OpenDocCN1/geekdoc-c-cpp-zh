    \ could be 2 hours 70 minutes and 140 seconds.)\n\nLet's create a more powerful\
    \ initializer for MyTime:\n\n```\n1 class MyTime:\n2     #\n3 \n4     def __init__(self,\
    \ hrs=0, mins=0, secs=0):\n5         \"\"Create a new MyTime object initialized\
    \ to hrs, mins, secs.\n6         values of mins and secs may be outside the range\
