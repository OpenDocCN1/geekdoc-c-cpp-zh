  md: '# # How to Think Like a Computer Scientist: Learning with Python 3 Documentation,
    Release 3rd Edition


    In our early introduction to turtles, we used an object-oriented style, so that
    we said tess.forward(100), which asks the turtle to move itself forward by the
    given number of steps.


    This change in perspective might be more polite, but it may not initially be obvious
    that it is useful. But shifting responsibility from the functions to the objects
    makes it possible to write more versatile functions, and makes it easier to maintain
    and reuse code.


    The most important advantage of the object-oriented style is that it fits our
    mental chaining and real-life experience more accurately. In real life our cook
    is part of our microwave oven — we don''t have a function sitting in the corner
    of the kitchen, to which we can pass the microwave! Similarly, we use the cellphone''s
    methods to send an sms, or to change its state to silent. Functional of real-world
    objects needs to be tightly bound inside the objects themselves. OOP allows us
    to accurately mirror this when we organize our programs.


    # ## 15.10 Objects can have state


    Objects are most useful when we need to keep some state that is updated from time
    to time. A turtle object consists of things like its position, heading, its color,
    and its shape. A method like left(90) updates the turtle''s heading, forward changes
    its position, and so on.


    For a bank account object, a main component of the state would be the current
    balance, and perhaps a log of all transactions. The methods would allow us to
    query the current balance, deposit new funds, or make a payment. Making a payment
    would include an amount, and a description, so that this could be added to the
    transaction log. We''d also want a method to show the transaction log.


    # ## 15.11 Glossary


    **attribute** One of the named data items that makes an instance.


    **class** A user-defined compound type. A class can also be thought of as a template
    for the objects that are instances of it. (The iPhone is a class. By December
    2010, estimates are that 50 million had sold!)


    **constructor** Every class has a "factory", called by the same name as the class,
    for making new instances. If the class has an initializer method, this method
    is used to get the attributes (i.e. the state) of the new object properly set
    up.


    **initializer** A special method in Python (called __init__) that is invoked automatically
    to set a newly created object''s attributes to their initial (factory-default)
    state.


    **instance** An object whose type is some class. Instance and object used interchangeably.


    **instantiate** To create an instance of a class, and to run its initializer.


    **method** A function that is defined inside a class definition and is invoked
    on instances of that class.


    15.10. Objects can have state 217'
