  md: '# 25.1 Abstract data types


    The data types you have seen so far are all concrete, in the sense that we have
    completely specified how they are implemented. For example, the Card class represents
    a card using two integers. As we discussed at the time, that is not the only way
    to represent a card; there are many alternative implementations.


    An abstract data type, or ADT, specifies a set of operations (or methods) and
    the semantics of the operations (what they do), but it does not specify the implementation
    of the operations. That''s what makes it abstract.


    Why is that useful?


    +   1. Simplifies the task of specifying an algorithm if you can denote the operations
    you need without having to think at the same time how the operations are performed.


    +   2. Since there are usually many ways to implement an ADT, it might be useful
    to write an algorithm that can be used with any of the possible implementations.


    +   3. Well-known ADTs, such as the Stack ADT in this chapter, are often implemented
    in standard libraries so they can be written once and used by many programmers.


    +   4. The operations on ADTs provide a common high-level language for specifying
    and talking about algorithms.


    When we talk about ADTs, we often distinguish the code that uses the ADT, called
    the client code, from the code that implements the ADT, called the provider/implementor
    code.


    # 25.2 The Stack ADT


    In this chapter, we will look at one common ADT, the stack. A stack is a collection,
    meaning that it is a data structure that contains multiple elements. Other collections
    we have seen include dictionaries and lists.


    An ADT is defined by the operations that can be performed on it, which is called
    an interface. The interface for a stack consists of these operations:'
