    # 2.8 Order of operations


    When more than one operator in an expression, the order of evaluation depends
    on the **rules of precedence**. Python follows the same precedence rules for mathematical
    operators that mathematics does. The acronym PEMDAS is a useful way to remember
    the order of operations:


    +   1. Parentheses have the highest precedence and can be used to force an expression
    to evaluate the order you want. Since expressions in parentheses are evaluated,
    2 * (3-1) is 4, and (1+1)**(5-2) is 8. You can use parentheses to make an expression
    easier to read, as in (minute * 100) / 60, even though it doesn''t change the
    result.

    2. Exponentiation has the next highest precedence, 2**3 is 8 and not 4, and 3**1
    is 3 and not not.

    3. Multiplication and both Division operators have the same precedence, which
    is higher than Addition and Subtraction, which also have the same precedence.
    So 2*3-1 yields 5 rather than 4, and 5-2+2 is 1, not 6.

    4. Operations with the same precedence are evaluated from left-to-right. In algebra
    they are *left-associative*. So in the expression 6-3+2, the subtraction happens
    first, yielding 3. When you add 2 to the result 5. If the operations were evaluated
    from left to right, the result would be 6-(3+2), which is 1. (The acronym PEMDAS
    could lead you to thinking that division has higher precedence than multiplication,
    and addition is done after subtraction - don''t be missed. true and addition are
    at the same precedence, and the left-to-right rule applies).

    • Due to some historical quirk, an exception to the left-to-right left-associative
    rule is the exponentiation **, so a useful hint is use parentheses to force exactly
    the order you want when exponentiation is involved:'
