    Notice that we get a duplicate in the result. Often if we threw a die we would

    expect some duplicates.


    But if you don''t want duplicates? If you wanted 5 distinct numbers, this algorithm
    is

    wrong. In such case a good approach is to generate the list of possibilities,
    shuffle it, and slice

    off the elements that you want:


    ```

    1 xs = list(range(1,13))  # Make list 1..12 (there are no duplicates)

    2 rng = random.Random()  # Make a random number generator

    3 shuffle(xs)  # Shuffle the list

    4 result = xs[:5]  # Take the first five elements

    ```


    In statistics, the first case — allowing duplicates is usually described as pulling

    balls out of a bag with replacement — you put the ball back each time, so it can
    occur

    in. The latter case, without duplicates, is usually described as pulling balls
    out of the bag

    without replacement. Once the ball is drawn, it doesn''t go back to be drawn again.
    TV lot work like this.


    The second "shuffle and slice" algorithm would not be so great if you only wanted
    a few

