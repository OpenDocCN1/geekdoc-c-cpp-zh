    # Logical operators


    There are three logical operators, and, or, and not, that allow us to build more
    complex Boolean expressions from simpler Boolean expressions. The semantics (meaning)
    of these operators are similar to theirs in English. For example,x > 0 and x <
    10 produces only if x is greater than 0 and at the same time, x is less than 10


    n % 2 == 0 or n % 3 == 0 is True if either of the conditions is True, that is,
    if the n is divisible by 2 or it is divisible by 3. What do you think if the expression
    True or False? Try it in your Python interpreter.


    Finally, the not operator does not evaluate a Boolean value, so (x > y) is True
    if (x > y) is False, if x is less than or equal to y.


    The expression on the left of the operator is evaluated first; if it is True,
    Python does not (and need not) evaluate the expression on the right — this is
    short-circuit evaluation. Similarly, for the and operator, if the expression on
    the left yields False, Python does not evaluate the expression on the right.


