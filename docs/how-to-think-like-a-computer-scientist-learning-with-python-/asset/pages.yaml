  md: "# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,\
    \ Release 3rd Edition\n\n# 27.3 Expression trees\n\nA tree is a natural way to\
    \ represent the structure of an expression. Unlike other notations, it can represent\
    \ the computation unambiguously. For example, the infix expression 1 + 2 * 3 is\
    \ ambiguous unless we know that the multiplication happens before the addition.\n\
    \nThis tree represents the same computation:\n\n![](img/ddd7692255b55d8f3b8797c0ad440f9d_363_0.png)\n\
    \nThe nodes of an expression tree can be operands like 1 and 2 or operators like\
    \ + and *. Operators are leaf nodes containing references to operands. (All of\
    \ these operators are binary, they have exactly two operands.)\n\nWe can build\
    \ this tree like this:\n\n```\n>>> tree = Tree(\"+\n```\n\nLooking at the tree,\
    \ there is no question what the order of operations is; the multiplication happens\
    \ first in order to compute the second operand of the addition.\n\nExpression\
    \ trees have many uses. The example in this chapter uses trees to translate expressions\
    \ to postfix, prefix, and infix. Similar trees are used inside compilers to parse,\
    \ optimize, and translate programs.\n\n# 27.4 Tree traversal\n\nWe can traverse\
    \ an expression tree and print the contents like this:\n\n```\ndef print_tree(tree):\n\
    \    if tree is None: return\n    print(tree.cargo, end=\"\")\n    print_tree(tree.left)\n\
    \    print_tree(tree.right)\n```\n\n# 27.3. Expression trees"
