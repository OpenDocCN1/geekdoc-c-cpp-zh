    # 20.6 Counting letters


    In the exercises in Chapter 8 (Strings) we wrote a function that counted the number
    of occurrences of a letter in a string. A more general version of this problem
    is to form a frequency table of the letters in the string, that how many times
    each letter appears.


    Such a frequency table might be useful for compressing a file. Because different
    letters appear with different frequencies, we can compress a file by using shorter
    codes for common letters and longer codes for letters that appear less frequently.


    Dictionaries provide an elegant way to generate a frequency table:


    ```

    We start with an empty dictionary. For each letter in the string, we find the
    current count (possibly zero) and increment it. At the end, the dictionary contains
    pairs of letters and their frequencies.

    ```


    It might be more appealing to display the frequency table in alphabetical order.
    We can do this with the items and sort methods:


    ```

    >>> letter_items = list(letter_counts.items())

    >>> letter_items.sort()

    >>> print(letter_items)

    [(''M'', 1), (''i'', 4), (''p'', 2), (''s'', 4)]

    ```


    Notice in the first line we have to call the type function list. That turns the
    promise we get items into a list, which is needed before we use the list''s sort
    method.


    # 20.7 Glossary


    call graph A graph of nodes which represent function frames (or invocations),
    and directed edges (lines with arrows) showing which frames rise to other frames.


    dictionary A collection of key:value pairs that maps keys to values. The keys
    can be any immutable value, and the associated value can be any type.


    immutable data A value which cannot be modified. Assignments to elements or slices
    (sub-parts) of immutable values causes a runtime error.'
