    # 24.10 Invariants


    Some lists are well formed; others are not. For example, if a list contains a
    loop, it will cause many of our methods to crash, so we might want to require
    that lists contain no loops. Another requirement is that the length value in the
    LinkedList object should be equal to the actual number of nodes in the list.


    Requirements are these are called invariants, ideally, they should be of every
    object all the time. Specifying invariants for objects is a useful programming
    practice because it makes easier to prove the correctness of code, check the integrity
    of data structures, and detect errors.


    One thing that is sometimes confusing about invariants is that there times when
    they are violated. In the middle of add_first, after we have added the node before
    we have incremented length, the invariant is violated. This kind of violation
    is acceptable; in fact, it is often impossible to modify an object without violating
    an invariant for at least a little while. Normally, we require that every method
    that violates an invariant must restore the invariant.


    If there is any significant stretch of code in which the invariant is violated,
    it is important for the comments to make clear, that no operations are performed
    that depend on the invariant.


    # 24.11 Glossary


    +   - **embedded reference** A reference stored in an attribute of an object.

    - **linked list** A data structure that implements a collection using a sequence
    of linked nodes.

    - **node** An element of a list, usually implemented as an object that contains
    a reference to another object of the same type.

    - **cargo** An item of data contained in a node.

    - **link** An embedded reference used to link one object to another.

    - **precondition** An assertion that must be in order for a method to work correctly.

    - **fundamental ambiguity theorem** A reference to a list node can be treated
    as a single object or as the first in a list of nodes.

    - **singleton** A linked list with a single node.

    - **wrapper** A method that acts as a middleman between a caller and a helper
    method, often making the method easier or less error-prone to invoke.

    - **helper** A method that is not invoked directly by a caller but is used by
    another method to perform part of an operation.'
