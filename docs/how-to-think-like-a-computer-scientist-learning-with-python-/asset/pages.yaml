    \ definitions like this are quite common in mathematics and computer science.\
    \ They provide a concise and powerful way to describe recursive data structures\
    \ that are partially composed of smaller and simpler instances of themselves.\
    \ The definition is not circular, since at some point we will reach a list that\
    \ does not have any lists as elements.\n\nNow suppose you are to write a function\
    \ that finds the sum of all the values in a nested list. Python has a built-in\
