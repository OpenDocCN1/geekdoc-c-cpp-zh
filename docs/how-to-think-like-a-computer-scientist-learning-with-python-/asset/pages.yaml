    # ## 2.11 Composition


    So far we have looked at the elements of a program — variables, expressions, statements,
    and function calls — in isolation, without talking about how to combine them.


    One of the most useful features of programming languages is their ability to take
    small building blocks and compose them into larger chunks.


    For example, we know how to get the user to enter some input, we know how to convert
    the string we get into a float, we know how to write a complex expression, and
    we know how to print values. Let''s put these together in a small-form program
    that asks the user to input a value for the radius of a circle, and then computes
    the area of the circle from the formula


    Area = $\pi r^2$


    Firstly, we''ll do the next four steps at a time:


    ```

    response = input("What is your radius?")

    r = float(response)

    area = 3.14159 * r**2

    print("The area is ", + area)

    ```


    Now let''s compose the first two lines into a single line of code, and compose
    the second two into another line of code.


    ```

    r = float(input("What is your radius?"))

    print("The area is ", 3.14159 * r**2)

    ```


    If we wanted to be tricky, we could do it all in one statement:


    ```

    print("The area is ", 3.14159*float(input("What is your radius?\))**2)

    ```


    Such compact code may not be understandable for humans, but it does illustrate
    how we can compose bigger chunks from our building blocks.'
