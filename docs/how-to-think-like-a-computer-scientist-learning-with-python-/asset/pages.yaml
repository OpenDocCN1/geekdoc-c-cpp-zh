  md: '# How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    +   1. Creating a new function gives us an opportunity to name a group of students.
    Functions can simplify a program by hiding a complex computation behind a single
    command. The function (including its name) can capture our mental churning, or
    abstraction, of the problem.

    2. Creating a new function can make a program smaller by eliminating repetitive
    code.


    As we might expect, we have to create a function before we can execute it. In
    other words, the function definition has to be executed before the function is
    called.


    # 4.3 Flow of execution


    In order to ensure that a function is defined before its first use, we have to
    know the order in which statements are executed, which is called the flow of execution.
    We''ve already talked about this little in the previous chapter.


    Execution always begins at the first statement of the program. Statements are
    executed one at a time, from top to bottom.


    Function definitions do not alter the flow of execution, but remember that statements
    inside the function are not executed until the function is called. Although it
    is not uncommon, we can define one function inside another. In this case, the
    inner definition isn''t executed until the outer function is called.


    Function calls are a detour in the flow of execution. Instead of going to the
    next statement, the flow jumps to the first line of the called function, executes
    all the statements, and then comes back to pick up where it left off.


    That sounds simple enough, until we remember that one function can call another.
    While in the middle of one function, the program might have to execute the statements
    in another function. But while executing that function, the program might have
    to execute yet another function!


    Fortunately, Python is adept at keeping track of where it is, so each time a function
    completes, the program picks up where it left off in the function that was called.
    When it gets to the end of the program, it terminates.


    What''s the moral of this sordid tale? When we read a program, don''t read from
    top to bottom. Instead, follow the flow of execution.


    Watch the flow of execution in action


    In PyScripter, we can watch the flow of execution by "single-stepping" through
    any program. PyScript will highlight each line of code before it is about to be
    executed.


    PyScript also lets us hover over any variable in the program, and it will pop
    up the current value of that variable. This makes it easy to inspect the "state
    snapshot" of the program — the current values that are assigned to the variables.


    This is a powerful mechanism for building a deep and thorough understanding of
    what is happening at each step of the way. Learn to use the single-stepping feature
    well, and to be mentally proactive: as you work through the code, challenge yourself
    before each step: "What changes


