    The pre-test loop — standard loop behaviour

    for and while loops do their tests at the start, before executing any part of
    the body. They''re called pre-test loops, because the test happens before (pre)
    the body. break and return are our tools for adapting this behaviour.


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_127_0.png)


    # 7.16 Other flavours of loops


    Sometimes we''d like to have the middle-test loop with the exit test in the middle
    of the body, rather than at the beginning or at the end. Or a post-test loop that
    puts its exit test as the last thing in the body. Other languages have different
    syntax and keywords for these different flavours, but Python just uses a combination
    of while and if condition: break to get the job done.


    A typical example is a problem where the user has to input numbers to be summed.
    To indicate that there are no more inputs, the user enters a special value, often
    the value -1, or the empty string. This needs a middle-exit loop pattern: input
    the next number, then test whether to exit, or else process the number:


    The middle-test loop flowchart


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_127_1.png)'
