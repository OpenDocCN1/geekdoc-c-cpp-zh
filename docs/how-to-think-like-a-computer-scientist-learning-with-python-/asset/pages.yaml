  md: '# How Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    so if you see something that looks like a syntax error, it might be.


    Here are some ways to avoid the most common syntax errors:


    +   1. Make sure you are not using a Python keyword for a variable name.

    2. Check that you have a colon at the end of the header of every compound statement,
    including `for`, `while`, and `def` statements.

    3. Check that indation is consistent. You may indent with either spaces or tabs
    it''s best not to min them. Each level should be the same amount.

    4. Make sure that any strings in the code have matching quotation marks.

    5. If you have multiline strings with triple quotes (single or double), make sure
    you have terminated the string properly. An unterminated string may cause an `invalid
    token error` at the end of your program, or it may try treating the following
    part of the program as a string until it comes to the next string. In the second
    case, might not produce an error message at all!

    6. An unopened bracket—( or— makes Python continue with the next line as part
    of the current statement. Generally, an error occurs immediately in the next line.

    7. Check for the classic = instead of `==` inside a conditional.


    If nothing works, move on to the next section...


    # A.2 I can''t get my program to run no matter what I do.


    If the compiler says there is an error and you don''t see it, that might be because
    you and the compiler are not looking at the same code. Check your programming
    environment to make sure that the program you are editing the one Python is trying
    to run. If you are not sure, try putting an obvious and deliberate syntax error
    at the beginning of the program. Now run (or import) again. If the compiler doesn''t
    find the new error, there is probably something wrong with your environment is
    set up.


    If this happens, one approach is to start again with a new program like Hello,
    World!, and make sure you get a known program to run. Then gradually add the pieces
    of the new program to the working one.


    # A.3 Runtime errors


    Once your program is syntactically correct, Python can import it and at least
    start running. What could possibly go wrong?'
