    # 13.8 Directories


    Files on non-volatile storage media are organized by a set of rules known as a
    **file system**. File systems are made up of files and **directories**, which
    are containers for both files and other directories.


    When we create a new file by opening it and writing, the new file goes in the
    current directory (wherever when we ran the program). Similarly, when we open
    a file for reading, Python looks for it in the current directory.


    If we want to put a file somewhere else, we have to specify the **path** to the
    file, which is the name of the directory (or folder) where the file is located:


    ```

    >>> wordfile = open("/usr/share/dict/words", "r")

    >>> wordlist = wordfile.readlines()

    >>> print(wordlist[:6])

    [''\n'', ''\A\n'', ''Aas\n'', ''AOL\n'', ''AOLs\n'', ''Aachen\n'']

    ```


    This (Unix) example opens a file named **words** that resides in a directory named
    dict, which resides in share, which resides in usr, which resides in the top-level
    directory of the system, It reads each line into a list using **readlines**, and
    prints out the first 5 elements of that list.


    Windows path might be `c:\temp\words.txt` or `c:\temp\words.txt`. Because backslashes
    are used to escape one! like newlines and tabs, we need to write two backslashes
    in the string to get one! So the length of these two strings is the same!


    We cannot use / or * as a part of filename; they are reserved as a **delimiter**
    between directory and filenames.


    The file `/usr/share/dict/words` should exist on Unix-systems, and contains a
    list of words in alphabetical order.


    # 13.9 What about fetching messy from the web?


    The Python libraries are pretty in place. But here is a very simple example that
    copies the contents at web URL **urllib.request** to a local file.


    ```

    import urllib.request


    url = "http://xml.resource.org/public/rfc/txt/rfc793.txt"

    destination_filename = "rfc793.txt"


    urllib.request.retrieve(url, destination_filename)

    ```


    The **retrieve** function — just one call — could be used to download any kind
    of content from the Internet.


    **We need to get a few things right before we fetch this:** Check this using a
    browser.


    +   - The resource we''re trying to fetch must exist!'
