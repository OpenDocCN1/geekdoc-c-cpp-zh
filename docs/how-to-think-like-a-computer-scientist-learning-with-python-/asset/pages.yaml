    If julia has a new record film, we could change her variable to reference a new
    tuple that used some information from the old one:


    ```

    >>> julia = julia[:3] + ("Eat Pray Love", 2010) + julia[5:]

    >>> julia

    ("", "Roberts", 1967, "Eat Pray Love", 2010, "Actress", "Atlanta", Georg

    ```


    To create a tuple with a single element (but you''re probably not likely to do
    that often), we have to include the final comma, but without the final comma,
    Python treats the (5) as an integer in parentheses:


    ```

    >>> tuple = (5,)

    >>> type(tuple)

    <class ''tuple''

    >>> x = (5)

    >>> type(x)

    <class ''int''>

    ```


    # ## 9.2 Tuple assignment


    Python has a powerful tuple assignment feature that allows a tuple of variables
    on the left of an assignment to assign values from a tuple on the right of the
    assignment. (We already saw this for pairs, but it generalizes.)


    ```

    (name, surname, b_year, m_year, profession, b_place) = julia

    ```


    This does the equivalent of seven assignment statements, all on one line. One
    requirement is that the number of variables on the left must match the number
    of elements in the tuple.


    One way to think of tuple assignment is as tuple packing/unpacking.


    In tuple packing, the values on the left are ''packed'' into a tuple:


    ```

    >>> b = ("Bob", 19, "CS") # tuple packing

    ```


    In tuple unpacking, the values on the right are ''unpacked'' into the variables/names
    on the right:


    ```

    >>> b = ("Bob", 19, "CS")n>>> (name, age, studies) = b # tuple unpacking

    >>> name

    ''Bob''

    >>> age

    19

    >>> studies

    ''CS''

    ```


    Once in a while, it is useful to swap the values of two variables. With conventional
    assignment statements, we have to use a temporary variable. For example, to swap
    a and b:


