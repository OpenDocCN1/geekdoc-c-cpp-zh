    be while before you encounter one.


    # ## 1.6 Semantic errors


    The third type of error is the semantic error. If there is a semantic error in
    your program, it

    will run successfully, in the sense that the computer will not generate any error
    messages, but

    it will not do the right thing. It will do something else. Specifically, it will
    do what you told

    to do.


    The problem is that the program you wrote is not the program you wanted to write.
    The

    meaning of the program (its semantics) is wrong. Identifying semantic errors can
    be tricky

    because it requires you to work backward by looking at the output of the program
    and trying to

    figure out what it is doing.


    # ## 1.7 Experimental debugging


    One of the most important skills you will acquire is debugging. Although it can
    be frustrating,

    debugging is one of the most intellectually, challenging, and interesting parts
    of program-

    mming.


    In some ways, debugging is like detective work. You are confronted with clues,
    and you have

    to infer the processes and events that led to the results you see.


    Debugging is also like an experimental science. Once you have an idea what is
    going wrong,

    y modify your program and try again. If your hypothesis was correct, then you
    can predict the

    result of the modification, and take a step closer to a working program. If your
    hypothesis

    was wrong, you have to come up with a new one. As Sherlock Holmes pointed out,
    When you

    h eliminated the impossible, what remains, however improbable, must be the truth.
    (A.

    an Doyle, The Sign of Four)


    For some people, programming and debugging are the same thing. That is, programming
    is

    the process of gradually debugging a program until it does what you want. The
    idea is that

    you start with a program that does something and make small modifications, debugging

    as you you go, so that you always have a working program.'
