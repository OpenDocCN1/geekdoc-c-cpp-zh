  md: '# How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    less difficult teaching variables than I did in the past, and I spent less time
    helping students with problems using.


    Another example of how Python aids in the teaching and learning of programming
    is in its syntax. Functions have always had a great deal of difficulty understanding
    functions. My main centers around the difference between a function definition
    and a function call, and the relative distinction between a parameter and an argument.
    Python comes with the rescue with syntax which is nothing short of beautiful.
    Function definitions begin with the keyword def, so I simply tell them students.
    When you define a function, begin with def, followed by the name of the function
    that you are defining; when you call a function, simply call (type) out its name.
    Parameters go with definitions; arguments go with calls. There are no return types,
    parameter types, reference or value parameters to get in the way, so I am now
    able to teach functions in less half the time that it previously took me, with
    better comprehension.


    Using Python improved the effectiveness of our computer science program for all
    students. I saw a higher level of success and a lower level of frustration than
    I experienced teaching with C++ or Java. I moved faster with better results. More
    students left the course with the ability to create meaningful programs and with
    the positive attitude toward the experience of programming that this engenders.


    # 0.0.4 Building a community


    I have received email from all over the globe from people using this book to learn
    or to teach programming. A user community has begun to emerge, and many people
    have been contributing to the project by sending in materials for the companion
    Website at http://openbookproject.net/pybiblio.


    With the continued growth of Python, I expect the growth of the user in the community
    to continue and accelerate. The emergence of this user community and the possibility
    suggests for similar collaboration among educators have been the most exciting
    parts of working on this project for me. By working together, we can increase
    the quality of materials available for our use and save valuable time. I invite
    you to join our community and look forward to hearing from you. Please write to
    me at jeff@elkner.net.


    Jeffrey Elkner

    Governor''s Career and Technical Academy in Arlington

    Arlington, Virginia'
