    # # COLLECTIONS OF OBJECTS


    # ## 22.1 Composition


    By now, we have seen several examples of composition. One of the first examples
    was using a method invocation as part of an expression. Another example is the
    nested structure of state- we can put an *if* statement within a *while* loop,
    with within another *if* statement, and so on.


    Having seen this pattern, and having learned about lists and objects, we should
    not be surprised to learn that we can create lists of objects. We can also create
    objects that contain lists (as attributes); we can create lists that contain lists;
    we can create objects that contain objects; and so on.


    In this chapter and the next, we will look at some examples of these combinations,
    using `Card` objects as an example.


    # ## 22.2 Card objects


    If you are not familiar with playing cards, now would be a good time to get a
    deck, or else this chapter might not make sense. There are fifty-two cards in
    a deck, each of which belongs to one of four suits and of thirteen ranks. The
    suits are Spades, Hearts, Diamonds, and Clubs (in descending order in bridge).
    The ranks are 2, 3, 4, 5, 6, 7, 8, 9, 10, Jack, Queen, and King. Depending on
    the game we are playing, the rank of Ace may be higher than or lower than 2. The
    rank is called face-value of the card.


    If we want to define a new object representing a playing card, it is obvious what
    the attributes should be: `rank` and `suit`. It is not as obvious what the attributes
    should be. One possibility is to use strings containing words like "Spade" for
    suits and "Queen" for ranks. One problem with this implementation is that it not
    be easy to compare cards to see which had a higher rank or suit.


    An alternative is to use integers to `encode` the ranks and the suits. By encode,
    we do not mean what people think, which is to encrypt or translate into a secret
    code. What a computer scientist means by encode is to define a mapping between
    a sequence of numbers and the items I want to represent. For example:'
