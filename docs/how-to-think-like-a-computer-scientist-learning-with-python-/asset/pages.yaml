  md: "# # How Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\nBecause of the tab characters between the columns, the\
    \ position of the second column does not depend on the number of digits in the\
    \ first column.\n\n# ## 7.11 Two-dimensional tables\n\nA two-dimensional table\
    \ is a table where you read the value at the intersection of a row and a column.\
    \ A multiplication table is a good example. Let's say you want to print a multiplication\
    \ table for the values from 1 to 6.\n\nA good way is to write a loop that prints\
    \ the multiples of 2, all on one line:\n\n```\nfor i in range(1, 7):\n    print(2\
    \ * i, end=\"\")\nprint( )\n```\n\nHere we've used the range function, but made\
    \ its sequence at 1. As the loop executes, the value of i changes from 1 to 6.\
    \ When all elements of the range have been assigned to i, the loop terminates.\
    \ Each time through the loop, it displays the value of 2 * i, followed by three\
    \ spaces.\n\nAgain, the end=\"\" argument in the print function suppresses the\
    \ newline, and uses three spaces instead. After the loop completes, the call to\
    \ print at line 3 finishes the current line, and starts a new line.\n\nThe output\
    \ of the program is:\n\n| 2 4 6 8 10 12 |\n\nSo, so good. The next step is to\
    \ encapsulate and generalize.\n\n# ## 7.12 Encapsulation and generalization\n\n\
    Encapsulation is the process of wrapping a piece of code in a function, allowing\
    \ you to take advantage of all the things functions good for. You have already\
    \ seen some examples of encapsulation, including is_divisible in a previous chapter.\n\
    \nGeneralization means taking something specific, as printing the multiples of\
    \ 2, and making it more general, as printing the multiples of any integer.\n\n\
    This function encapsulates the previous loop and generalizes it to print multiples\
    \ of n:\n\n```\ndef print_multiples(n):\n    for i in range(1, 7):\n        print(n\
    \ * i, end=\"\")\nprint( )\n```\n\nTo encapsulate, all we had to do was the first\
    \ line, which declares the name of the function and the parameter list. To generalize,\
    \ all we had to replace the value 2 with the parameter n."
