    In Python, an assignment statement can make two variables equal, but because further
    assign-

    change either of them, they don''t have to stay that way:


    ```

    a = 5

    b = a      # After executing this line, a and b are now equal

    a = 3      # After executing this line, a and b are no longer equal

    ```


    The third line changes the value of a but does not change the value of b, so they
    are no longer

    equal. (In programming languages, a different symbol is used for assignment, as

    <- or =\ to avoid confusion. Some people also think that variable was an unfortunate

    to choose, and instead we should have called them assignables). Python chooses
    to

    common terminology and token usage, also found in languages like C, C++, Java,
    and C#, so

    use the tokens for assignment, == for equality, and we talk about variables.


    # ## 7.2 Updating variables


    When an assignment statement is executed, the right-hand side expression (i.e.
    the expression

    that comes after the assignment token) is evaluated first. This produces a value.
    Then the\assignment is made, so that the variable on the left-hand side now refers
    to the new value.


    One of the most common forms of assignment is an update, where the new value of
    the variable

    depends on its old value. Deduct 40 cents from my air balance, or add one run
    to the

    .


    ```

    n = 5

    n = 3 + n + 1

    ```


    Line 2 gets the current value of n, multiply it by three and add one, and assign
    the answer

    to n, making n refer to the value. So after executing the two lines above, n will
    point/refer

    to the integer 16.


    If you try to change a variable that has never been assigned to, you''ll get an
    error:


    ```

    >>> w = x + 1

    Traceback (most call last):

    File "interactive input", line 1, in

    NameError: name ''x'' is not defined

    ```


    Before you update a variable, you have to initialize it to some starting value,
    usually with

    a simple assignment:


    ```

    runs_scored = 0

    ...

    runs_scored = runs_scored + 1

    ```


    Line 3 — updating a variable by adding 1 to it — is very common. It is called
    an increment

    of the variable; subtracting 1 is called a decrement. Sometimes programmers also
    talk about

    bumping a variable, which means the same as incrementing it by 1.'
