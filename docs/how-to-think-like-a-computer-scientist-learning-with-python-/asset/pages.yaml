  md: '# # How to Think Like a Computer Scientist: Learning with Python 3 Documentation,
    Release 3rd Edition


    To simplify the program, there are several things you can do. First, scale down
    the problem the program is working on. For example, if you are sorting a sequence,
    sort a *small* sequence. If the program takes input from the user, give it the
    simplest input that causes the problems.


    Second, clean up the program. Remove dead code and reorganize the program to make
    it as easy to read as possible. For example, if you suspect that the problem is
    in a deeply nested part of the program, rewriting it with simpler structure. If
    you suspect a large function, splitting it into smaller functions and testing
    them separately.


    Often the process of finding the minimal test case leads to the bug. If you find
    that a program works in one situation but not in another, that gives you a clue
    about what is going on.

    Similarly, rewriting a piece of code can find subtle bugs. If you make a change
    that doesn''t affect the program, and it works, then you can tip off.


    You can also wrap your debugging print statements in some condition, so that you
    suppress much of the output. For example, if you are trying to find an element
    using a binary search, and it is not working, you might code a debugging print
    statement inside a conditional: if the range of candidate elements is less than
    6, then printing information, otherwise dont print.


    Similarly, breakpoints can be conditional: you can set a breakpoint on a statement,
    then edit the breakpoint to say "only break if this becomes true".


    # ## A.11 Semantic errors


    In some ways, semantic errors are the hardest to debug, because the compiler and
    the runtime system provide no information about what is wrong. You only know what
    the program is supposed to do, and you only know it isn''t doing it.


    The first step is to make a connection between the program text and the behavior
    you are seeing. You need a hypothesis about what the program is actually doing.
    One of the things that makes hard is that computers run fast.


    You will often wish that you could slow the program down to human speed, and with
    some debuggers you can. But the time it takes to insert a few well-placed `print`
    statements is often short compared to setting up the debugger, inserting and removing
    breakpoints, walking to the program where the error is occurring.


    # ## A.12 My program doesn''t work.


    You should ask yourself these questions:


    +   1. Is there something the program was supposed to do but doesn''t seem to
    be happening? Find the section of the code that performs that function and make
    sure it is executing when you think it.

    2. Is something happening that shouldn''t? Find code in your program that performs
    that function and see if it is executing when it shouldn''t.'
