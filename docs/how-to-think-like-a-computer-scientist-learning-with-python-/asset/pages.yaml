    +   3. Is a section of code producing an effect that is not what you expected?
    Make sure that you understand the code in question, especially if it invocations
    to functions or methods in your Python modules. Read the documentation for the
    functions you invoke. Try them by writing simple test cases and checking the results.


    In order to program, you need a mental model of how programs work. If you write
    a program that doesn''t do what you expect, even if the problem is not in the
    program; it''s in your mental model.


    The best way to correct your mental model is to break the program into its components
    (usually the functions and methods) and test each component independently. Once
    you find the discrepancy between your model and reality, you can solve the problem.


    Of course, you should be building and testing components as you develop the program.
    If you encounter a problem, there should be only a small amount of new code that
    is not known to be correct.


    # A.13 I''ve got a big hairy expression and it doesn''t what I expect.


    Writing complex expressions is fine as long as they are readable, but they can
    be hard to debug. It is often a good idea to break a complex expression into a
    series of temporary variables.


    For example:


    ```

    self.hands[i].add_card(self.hands[self.find_neighbor(i)]).pop_card())

    ```


    This can be rewritten as:


    ```

    neighbor = self.find_neighbor(i)

    picked_card = self.hands[neighbor].pop_card()

    self.hands[i].add_card(picked_card)

    ```


    The explicit version is easier to read because variables provide additional documentation,
    and it is easier to debug because you can check the types of the intermediate
    variables and display their values.


    Another problem that can occur with big expressions is that the order of evaluation
    may not be what you expect. For example, if you are translating the expression
    x/2pi into Python, you might write:


    ```

    y = x / 2 * math.pi

    ```


    That is not correct because multiplication and division have the same precedence
    and are evaluated from left to right. So this expression computes (x/2)pi.


    A good way to debug expressions is to add parentheses to make the order of evaluation
    explicit:


    ```

    y = x / (2 * math.pi)

    ```


    # A.13. I''ve got a big hairy expression and it doesn''t what I expect. 351'
