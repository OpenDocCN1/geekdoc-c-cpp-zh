    # ## This representation is not general


    We''ve come up with a great representation. But will it work for other puzzles?
    Our list has the constraint that one can put only one queen in each column. But
    no two queens are allowed to share the same column. So puzzle and data representation
    are well matched.


    But if we were trying to solve a different puzzle on a chessboard, perhaps plays
    a game of checkers, where many pieces could occupy the same column, our representation
    would not work.


    Let us now gain some insight into the problem. Do you think it is a coincidence
    that there are no repeated numbers in the solution? The solution [6, 4, 2, 0,
    5, 7, 1, 3] contains the numbers 0, 1, 2, 3, 4, 5, 6, 7, but none are duplicated!
    Could other solutions contain duplicate numbers, or not?


    A little thinking should convince you that there cannot be duplicate numbers in
    a solution: the numbers represent the row on which the queen is placed and because
    we are never permitted to put two queens in the same row, no solution will have
    duplicate row numbers in it.


    # ### Our key insight


    In our representation, any solution to the N queens problem must therefore be
    a permutation of the numbers [0..N-1].


    Note that not all permutations are solutions. For example, [0, 1, 2, 3, 4, 5,
    6, 7] has all queens on the same diagonal.


    Now, we seem to be making progress on this problem by thinking, rather than coding!
    Our algorithm will start with list [0..N-1], generate various permutations of
    list, and check each permutation to see if it has any clashes (queens that are
    on the same diagonal). If it has no clashes, it is a solution, and we can print
    it.


    Let us be precise and clear on this issue: if we use only permutations of the
    rows and we''re using our compact representation, no queens can clash on either
    rows or columns, and we don''t even have to concern ourselves with those cases.
    So the only clashes we need to test for are clashes on the diagonals.


