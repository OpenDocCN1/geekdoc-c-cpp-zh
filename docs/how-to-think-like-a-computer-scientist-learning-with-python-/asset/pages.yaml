    \ on line 6 carries this object out as a kind of \"return value\", and immediately\
    \ exits from get_age() to its caller D. D exits to its caller C, and C exits to\
    \ B and so on, returning the exception object to its caller, until it encounters\
    \ a try except that can handle the exception. We call this \"unwinding the stack\"\
    .\n\nValueError is one of the built-in exception types that closely matches the\
    \ kind of error we want to raise. The complete list of built-in exceptions is\
    \ found at the Built-In Exceptions of the Python Library Reference , by Python's\
    \ creator, Guido Rossum.\n\nIf the function get_age(or its caller, or their caller,\
    \ ...) handles the error, then the program can carry on running; otherwise, Python\
    \ prints the traceback and exits:\n\n```\n>>> get_age()\nPlease enter your age:\
    \ 42\n>>> get_age()\nPlease enter your age: -2\nTraceback (most recent call last):\n\
    \  File \"interactive input\", line 1, in <module>\n  File \"exceptions.py\",\
