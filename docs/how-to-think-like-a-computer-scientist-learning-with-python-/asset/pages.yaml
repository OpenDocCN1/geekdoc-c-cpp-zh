    In lines 20–22, `show_poly` is called three times. Each one creates a window for
    its turtle, and draws a polygon with the number of sides input by the user. But
    what if the user enters a string that cannot be converted to an `int`? What they
    close the dialog? We''ll get an exception, even though we''ve had an exception,
    we still want to close the turtle''s window. Lines 17–18 do this for us. Whether
    we complete the statements in the `try` clause successfully or not, the `finally`
    block will always be executed.


    Notice that the exception is stillUnhandled — only an `except` clause can handle
    an exception, so our program will still crash. But at least its turtle window
    will be closed before it crashes!


    # 19.5 Glossary


    **exception** An error that occurs at runtime.


    **handle an exception** To prevent an exception from causing our program to crash,
    by wrapping the block of code in a `try``except` construct.


    **raise** To create a deliberate exception by using the `raise` statement.


