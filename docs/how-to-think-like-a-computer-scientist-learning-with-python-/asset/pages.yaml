    \ type and the additional information that was provided when the exception was\
    \ first created.\n\nIt is often case that lines 5 and 6 (creating the exception\
    \ object, then raising the exception) are combined into a single statement, but\
    \ there are really two different and independent things happening, so perhaps\
    \ it makes sense to keep the two steps separate when we first learn to work with\
    \ exceptions. Here we show it all in a single statement:\n\n```\n```python\nraise\
    \ ValueError(\"0 is not a valid age\".format(age))\n```\n```\n\n# ## 19.2. Raising\
