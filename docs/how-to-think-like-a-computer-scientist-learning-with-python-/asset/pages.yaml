    # ## 5.4 Simplifying Boolean Expressions


    A set of rules for simplifying and rearranging expressions is called an algebra.
    For example, we are all familiar with school algebra rules, such as:


    ```

    n * 0 == 0

    ```


    Here we have a different algebra — the Boolean algebra — which provides rules
    for working with Boolean values.


    First, the and False ==


    ```

    x and False == False

    False and x == False

    y and x == x and y

    x and True == x

    True and x == x

    x and x == x

    ```


    Here are some corresponding rules for the or operator:


    ```

    x or False == x

    False or x == x

    y or x == x or y

    x or True == True

    True or x == True

    x or x == x

    ```


