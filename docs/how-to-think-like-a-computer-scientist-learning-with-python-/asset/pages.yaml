    >>> mylist.extend([5, 9, 5, 11]) # Put whole list onto end of mylist

    >>> mylist

    [5, 12, 27, 3, 12, 5, 9, 5, 11]

    >>> mylist.index(9) # Find index of first 9 in mylist

    6

    >>> mylist.reverse()

    >>> mylist

    [11, 5, 9, 5, 12, 3, 27, 12, 5]

    >>> mylist.sort()

    ```'
