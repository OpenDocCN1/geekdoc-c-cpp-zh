  md: "# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,\
    \ Release 3rd Edition\n\n# 6.2 Program development\n\nAt this point, you should\
    \ be able to look at complete functions and tell what they do. Also, if you have\
    \ been doing the exercises, you have written some small functions. As you write\
    \ larger functions, you might start to have more difficulty, especially with runtime\
    \ and semantic errors.\n\nTo deal with increasingly complex programs, we are going\
    \ to suggest a technique called incremental development. The goal of incremental\
    \ development is to avoid long debugging sessions by adding and testing only a\
    \ small amount of code at a time.\n\nAs an example, suppose we want to find the\
    \ distance between two points, given by the coordinates (x1, y1) and (x2, y2).\
    \ By the Pythagorean theorem, the distance is:\n\n```\ndistance = \\sqrt{(x2 -\
    \ x1)^2 + (y2 - y1)^2}\n```\n\nThe first step is to consider what a distance function\
    \ should look like in Python. In other words, what are the inputs (parameters)\
    \ and what is the output (return value)?\n\nIn this case, the two points are the\
    \ inputs, which we can represent using four parameters. The return value is the\
    \ distance, which is a floating-point value.\n\nAlready we can write an outline\
    \ of the function that captures our thinking so far:\n\n```\ndef distance(x1,\
    \ y1, x2, y2):\n    return 0.0\n```\n\nObviously, this version of the function\
    \ doesn't compute distances; it returns zero. But it is syntactically correct,\
    \ and it will run, which means we can test it before we make it more complicated.\n\
    \nTo test the function, we call it with sample values:\n\n```\n>>> distance(1,\
    \ 2, 4, 6)\n0.0\n```\n\nWe choose these values so that the horizontal distance\
    \ equals 3 and the vertical distance equals 4; that is, result is 5 (the hypotenuse\
    \ of a 3-4-5 triangle). When testing a function, it is useful to know the right\
    \ answer.\n\nAt this point we have confirmed that the function is syntactically\
    \ correct, and we can start adding lines of code. After each incremental change,\
    \ we test the function again. If an error occurs at any point, we know where it\
    \ must be — in the last line added.\n\nA logical first step in the computation\
    \ is to find the variables x2-x1 and y2-y1. We will refer to those values using\
    \ variables named dx and dy.\n\n```\ndef distance(x1, y1, x2, y2):\n    dx = x2\
    \ - x1\n    dy = y2 - y1\n    return 0.0\n```\n\nIf we call the function with\
    \ the arguments shown above, when the flow of execution gets to the return statement,\
    \ dx should be 3 and dy should be 4. We can check that this is the case\n\n# 6.2\
    \ Program development"
