  md: '# 8.4 Length


    The len function, when applied to a string, returns the number of characters in
    a string:


    ```

    >>> fruit = "banana"

    >>> len(fruit)

    6

    ```


    To get the length of a string, you might be tempted to try something like this:


    ```

    1 sz = len(fruit)

    2 last = fruit[sz]      # ERROR!

    ```


    That won''t work. It causes the runtime error IndexError: string out of range.
    The reason is that there is no character at index 6 in "banana". Because starting
    at zero, these indices are numbered 0 to 5. To get the last character, we have
    to subtract 1 from the length of fruit:


    ```

    1 sz = len(fruit)

    2 last = fruit[sz-1]

    ```


    Alternatively, we use negative indices, which count backward from the end of the
    string. The expression fruit[-1] yields the last, fruit[-2] yields the second
    to last, and so on.


    As you might have, indexing with a negative index also works like this for lists.


    We won''t use negative indices in the rest of these notes — not computer languages
    use this idiom, and you''ll probably be better off avoiding it. There is plenty
    of Python code out on the Internet that will use this trick, so it is best to
    know that it exists.


    # 8.5 Traversal and the for loop


    A lot of computations involve processing one character at a time. They start at
    the beginning, select each character in turn, do something to it, and continue
    until the end. The pattern of processing is called a traversal. One way to encode
    a traversal is with a while statement:


    ```

    1 ix = 0

    2 while ix < len(fruit):

    3   letter = fruit[ix]

    4   print(letter)

    5   ix += 1

    ```


    This loop traverses the string and displays each letter on a line by itself. The
    loop condition is ix < len(fruit), so when ix is equal to the length of the string,
