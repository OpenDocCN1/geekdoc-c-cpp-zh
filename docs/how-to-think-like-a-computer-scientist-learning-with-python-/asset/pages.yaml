    # 22.5 Decks


    Now that we have objects to represent Cards, the next logical step is to define
    a class to represent a Deck. Of course, a deck is made up of cards, so each Deck
    object will contain a list of cards as an attribute. Many games will need at least
    two different decks — a red deck and a blue deck.


    The following is a class definition for the Deck class. The initialization method
    creates and generates the standard pack of fifty-two cards:


    ```

    1 class Deck:

    2     def __init__(self):

    3         self.cards = []

    4         for suit in range(4):

    5             for rank in range(1, 14):

    6                 self.cards.append(Card(suit, rank))

    ```


    The easiest way to populate the deck is with a nested loop. The outer loop enumerates
    the suits from 0 to 3. The inner loop enumerates the ranks from 1 to 13. The outer
    loop iterates four times, and the inner loop iterates thirteen times, the total
    number of times the body is executed is fifty-two (thirteen times). Each iteration
    creates a new instance of Card with the current suit and rank, and adds that card
    to the cards list.


    With in place, we can instantiate some decks:


    ```

    1 red_deck = Deck()

    2 blue_deck = Deck()

    ```'
