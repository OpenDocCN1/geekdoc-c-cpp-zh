    \ should be tree nodes. left and right are optional; the default value is None.\n\
    \nTo print a node, one way is to build it from the bottom. Allocate the child\
    \ nodes first:\n\n+   - left = Tree(2)\n- right = Tree(3)\n\nThen create the parent\
    \ node and link it to the children:\n\n+   - tree = Tree(1, left, right)\n\nWe\
    \ can write this more concisely by nesting constructor invocations:\n\n```\n>>>\
