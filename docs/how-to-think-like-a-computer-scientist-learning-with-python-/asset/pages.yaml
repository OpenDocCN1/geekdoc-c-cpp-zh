    See if you can find a small number that needs more than a hundred steps before
    it terminates.


    Particular values aside, the interesting question was first posed by a German
    mathematician Lothar Collat: the Collat conjecture (also known as the 3n+1 conjecture),
    this sequence terminates for all positive values of n. So far, nobody has been
    able to prove or disprove it! (A conjecture is a statement that might be true,
    but nobody knows for sure.)


    Think carefully about what would be needed for a proof or disproof of the conjecture
    "All positive integers will eventually converge to 1 using the Collat rules".
    With fast computers we have been able to test every integer up to very large values,
    and so far, have all eventually ended up at 1. But who knows? Perhaps there is
    some-yet untested cycle which does not reduce to 1.


    You''ll notice that if you don''t stop when you reach 1, the sequence enters its
    own cycle loop: 1, 4, 2, 1, 4, 2, 1... So possibility is that there might be other
    cycles that we just haven''t found.


    Wikipedia has an informative article about the Collat conjecture. The sequence
    also goes under names (Hailstone sequence, Wonderous numbers, etc.), and you''ll
    find out how many integers have already been tested by computer, and found to
    converge!


    # ## Choosing between for and while


    Use a for loop if you know, before you start, the maximum number of times you''ll
    need to execute the body. For example, if you''re traversing a list of elements,
    you know that the maximum number of loop iterations you can possibly be "all the
    elements in the list". Or if you need to print the 12 times, we know right away
    how times the loop will need to run.


    So any problem like "iterate for 1000 cycles", or "search this list of words",
    or "find all primes up to 10000" suggests that a for loop is best.


    By contrast, if you are required to repeat some computation until some condition
    is met, and you cannot calculate in when (or if) this will happen, as we did in
    3n+1 problem, you''ll need a while loop.


    We call the first case definite iteration — we know some bounds for what is needed.
    The latter case is called indefinite iteration — we''re not sure how many iterations
    we''ll need — we cannot establish an upper bound!


