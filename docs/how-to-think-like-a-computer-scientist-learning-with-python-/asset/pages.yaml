    # 18.6 Glossary


    **base case** A Branch of the conditional statement in a recursive function that
    does not give rise to further recursive calls.


    **infinite recursion** A Function that calls itself recursively without ever reaching
    any base case. Eventually, infinite recursion causes a runtime error.


    **recursion** The process of calling a function that is already executing.


    **recursive call** The statement that calls an already executing function. Recursion
    can also be indirect — function $f$ calls $g$ which calls $h$, and $h$ could make
    a call back to $f$.


    **recursive definition** A definition which defines some things in terms of itself.
    To be useful it must include *base cases* which are not recursive. In this way
    it differs from a *circular definition*. Recursive definitions often provide an
    elegant way to express complex data structures, like a directory that can contain
    other directories, or a menu that can contain other menus.


