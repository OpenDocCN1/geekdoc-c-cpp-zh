    >>> pi = 3.14159

    ```


    This example makes three assignments. The first assigns the value "What''s Doc?"
    to a variable named message. The second gives the integer 17 to n, and the third
    assigns the floating-point number 3.14159 to a variable pi.


    The assignment token, = should not be confused with equals, which uses the token
    ==. The assignment statement binds a name, on the left-hand side of the operator,
    to a value, on the right-hand side. This is why you will get an error if you enter:


    ```

    >>> 17 = n

    File "interactive input", line 1

    SyntaxError: can''t assign to literal

