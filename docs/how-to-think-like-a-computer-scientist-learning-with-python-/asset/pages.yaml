    the start of the trace, we have a variable, n (the parameter), with an initial
    value of 3. Since 3 is

    not equal to 1, the while loop is executed. 3 is printed and 3 % 2 == 0 is evaluated.

    Since it evaluates to False, the else branch is executed and 3 * 3 + 1 is evaluated
    and

    assigned to n.


    To keep track of all this as you trace a program, make a column heading for each
    piece of

    paper for each variable created as the program runs and another one for output.
    Our trace so

    would look something like this:


    ```

    n               output printed so far

    ---

    3               3,

    10

    ```


    Since 10 != 1 evaluates to True, the loop body is executed again, and 10 is printed.
    10 %

    2 == 0 is true, so the if branch is executed and n becomes 5. By the end of the
    trace we have:


    ```

    n               output printed so far

    3               3,

    10              3, 10,

    5               3, 10, 5,

    16              3, 10, 5, 16,

    8               3, 10, 5, 16, 8,

    4               3, 10, 5, 16, 8, 4,

    2               3, 10, 5, 16, 8, 4, 2,

    1               3, 10, 5, 16, 8, 4, 2, 1.

    ```


    Tracing can be a tedious and error prone process (that''s why we get computers
    to do this stuff in the

    place!), but it is an essential skill for a programmer. From this trace we can
    learn

    alot about how our code works. We observe that as soon as n becomes a power of
    2,

    example, the program will require log(n) executions of the loop body to complete.
    We can

    see that the final 1 is not printed outside the body of the loop, which is why

    we use the special print function at the end.


    Tracing a program, is of course, related to single-stepping through your code
    and being able to

    ispect the variables. Using the computer to single-step for you is less error
    prone and more

    convenient. Also, as programs get more complex, they might exhaust millions of

    steps before they get to the code that you''re really interested in, so manual
    tracing becomes

    impossiblyible. Being able to set a breakpoint when you need one is more powerful.
    We

    strongly encourage you to invest time in learning to use your programming environment

    (PyScript, in these notes) to full effect.


    There are also some visualization tools becoming available to help you trace\and
    understand small fragments of Python code. The one we recommend is at

