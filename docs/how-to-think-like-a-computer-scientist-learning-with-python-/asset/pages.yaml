  md: "# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,\
    \ Release 3rd Edition\n\n# E.1.3 Event handler functions\n\nOur chapter on event\
    \ handling showed three different kinds of events that we could handle. They each\
    \ have their own subtle points that can trip us up.\n\n+   - Event handlers are\
    \ void functions — they don't return any values.\n- They're automatically called\
    \ by the Python interpreter in response to an event, so we don't get to see the\
    \ code that calls them.\n- A mouse-click passes two coordinate arguments to its\
    \ handler, so when we write this handler we provide for two parameters (usually\
    \ x and y). This is how the handler knows where the mouse click occurred.\n- A\
    \ keypress event handler has to be bound to the key it responds to. We have to\
    \ remember to issue a `wn.listen()` before our program will receive any keypresses.\
    \ If the user presses the key 10 times, the handler will be called tens.\n- Using\
    \ a timer to create a future-dated event only causes one call to the handler.\
    \ If we repeated periodic actions, then from within the handler we call `wn.after(...)`\
    \ to set up the next event.\n\n# E.2 String handling\n\nThere are only few really\
    \ important operations on strings, and we'll be able to just about anything. There\
    \ are many more nice-to-have methods (we'll call them sugar coating) that can\
    \ make life easy, but if we can work with the basic operations smoothly, we'll\
    \ have a great grounding.\n\n+   - len(str) finds the length of a string.\n- str[i]\
    \ the subscript extracts the i'th character of a string, as a new string.\n- str[i:j]\
    \ the slice operation extracts a substring out of a string.\n- str.find(target)\
    \ returns the index where target occurs within the string, or -1 if it is not\
    \ found.\n\nSo we need to know if \"snake\" occurs as a substring within, we could\
    \ write\n\n```\nif s.find(\"snake\") >= 0:\n    if \"snake\" in s:      # Also\
    \ works, nice-to-know sugar coating!\n```\n\nIt would be wrong to split the string\
    \ into words unless we asked the word \"snake\" occurred in the string.\n\nSuppose\
    \ we're asked to read some lines of data and find function definitions, e.g.:\
    \ `some_function_name(x, y);` and we are further asked to isolate and work with\
    \ the name of the function. (Let's say, print it.)\n\n# E.2. String handling"
  merge: -1
  pgno: 401
- img_proc: true
  md: "# How to Think Like a Computer Scientist: Learning with Python 3n Documentation,\
    \ Release 3rd Edition\n\n```\ns = \"...\"                          # Get the next\
    \ line from somewhere\ndef_pos = s.find(\"def\")     # Look for \"def \" in the\
    \ line\nif def_pos == 0:                       # If it occurs at the left margin\n\
    \    op_index = s.find(\"\")              # Find the index of the open parenthesis\n\
    \    fname = s[op_index:]                 # Slice out the function name\n    print(fname)\
    \                        # and work with it.\n```\n\nOne than these ideas:\n\n\
    +   * If the function was indented, didn't start at column 0? The code would need\
    \ a bit of adjustment, and we'd probably want to be sure that all the characters\
    \ in front of the def_pos position were spaces. We would not want to do the wrong\
    \ on data like this: # I def inline like Python!\n* We've assumed line 3 will\
    \ find one open parenthesis. It may need to be checked that we!\n* We have assumed\
    \ that there was exactly one space between the keyword def and the start of the\
    \ function name. It will not work well for def f(x)\n\nAs we've mentioned, there\
    \ are many more \"sugar-coated\" methods that let us work more easily with strings.\
    \ There is an rfind method, like find, that searches from the end of the string\
    \ backwards. It is useful if we want to find the last occurrence of something.\
    \ The lower and upper methods can do conversion. And the split method is great\
    \ for breaking a string into a list of words, or lists of lines. We've added some\
    \ useful in this book of the format method. In fact, if we want to practice reading\
    \ the Python documentation and learning new methods on our own, the string methods\
    \ are an excellent resource.\n\nExercises:\n\n+   * Suppose any line of text can\
    \ contain at least one url that starts with \"http://\" and ends at the next space\
    \ in the line. Write a fragment of code to extract and print the full url if it\
    \ is present. (Hint: read the documentation for find. It takes some extra arguments,\
    \ so you can set a starting point from which it will search.)\n* Suppose a string\
    \ contains at most one substring \"<>\". Write a fragment of code to extract and\
    \ print the portion of the string between the angle brackets.\n\n# E.3 Looping\
    \ and lists\n\nComputers are useful because they can repeat computation, accurately\
    \ and fast. So loops going be a a feature of all programs you encounter.\n\nTip:\
    \ Don't create unnecessary lists\n\nLists are useful if you need to keep data\
    \ for later computation. But if you don't need lists, its probably better not\
    \ to generate them.\n\nHere are two functions that generate ten million random\
    \ numbers, and return the sum of the numbers. They both work."
  merge: -1
  pgno: 402
- img_proc: true
  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n```\nimport random\njoe = random.Random()\n\ndef sum1():\n\
    \    \"\"\"Build a list of random numbers, then sum them \"\"\"\n    xs = []\n\
    \    for i in range(1000000):\n        num = joe.randrange(1000) # Generate one\
    \ random number\n        xs.append(num) # Save it in our list\n\\    tot = sum(xs)\n\
    \    return tot\n\ndef sum2():\n    \"\"\"Sum the random numbers as we generate\
    \ them \"\"\"\n    tot = 0\n    for i in range(1000000):\n        num = joe.randrange(1000)\n\
    \        tot += num\n    return tot\n\nprint(sum1())\nprint(sum2())\n```\n\nWhat\
    \ reasons are there for preferring the second version here? (Hint: open a tool\
    \ like the Performance Monitor on your computer, and watch the memory usage. How\
    \ big can you make the list before you get a fatal error in sum1?)\n\nIn a similar\
    \ way, when working with files, we often have an option to read the whole file\
    \ contents into a single string, or we can read one line at a time and process\
    \ each line as we read it. Line-at-a-time is the more traditional and perhaps\
    \ safer way to do things — you'll be able to work comfortably no matter how large\
    \ the file is. (And, of course, this mode of processing the files was essential\
    \ in the old days when computer memories were much smaller.) You may find whole-file-at-once\
    \ is sometimes more convenient!\n\n# E.3. Looping and lists\n\n375"
  merge: -1
