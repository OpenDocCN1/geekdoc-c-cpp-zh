  md: '# How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    Whenever you are not sure of the order of evaluation, use parentheses. Not only
    will the program be correct (in the sense of doing what you intended), it will
    also be more readable for other people who haven''t memorized the rules of precedence.


    # A.14 I''ve got a function or method that doesn''t return what I expect.


    If you have a return statement with a complex expression, you don''t have a chance
    to print the return value before returning. Again, you can use a temporary variable.
    For example, instead of:


    ```

    return self.hands[i].remove_matches()

    ```


    you could write:


    ```

    count = self.hands[i].remove_matches()

    return count

    ```


    Now you have the opportunity to display or inspect the value of count before returning.


    # A.15 I''m really, really stuck and I need help.


    First, try getting away from the computer for a few minutes. Computers emit waves
    that affect the brain, causing these effects:


    +   1. Frustration and/or rage.

    2. Superstitious beliefs (the computer hates me) and magical thinking (the program
    works when I wear my hat backward).

    3. Random-walk programming (the attempt to program by writing every possible program
    and choosing the one that does the right thing).


    If you find yourself suffering from any of these symptoms, get up and go for a
    walk. When you are calm, think about the program. What is it doing? What are some
    possible causes of that behavior? When was the last time you were working a program,
    and what did you do next?


    Sometimes it takes time to find a bug. We often find bugs when we are away from
    the computer and let your minds wander. Some of the best places to find bugs are
    trains, showers, and in bed, before you fall asleep.


    # A.16 No, I really need help.


    It happens. Even the best programmers occasionally get stuck. Sometimes you work
    on a program so long that you can''t see the error. A fresh pair of eyes is just
    the thing.'
