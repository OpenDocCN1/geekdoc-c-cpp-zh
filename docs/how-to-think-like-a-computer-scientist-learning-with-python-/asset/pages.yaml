  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n# ## 21.3 Modifiers\n\nThere are times when it is useful\
    \ for a function to modify one or more of the objects it gets parameters. Usually,\
    \ the caller makes a reference to the objects it passes, so any changes the function\
    \ makes are visible to the caller. Functions that work this way are called **modifiers**.\n\
    \n**increment**, which adds a given number of seconds to a MyTime object, would\
    \ be written much most naturally as a method. A rough draft of the function looks\
    \ like this:\n\n```\ndef increment(t, secs):\n    t.seconds += secs\n\n    if\
    \ t.seconds >= 60:\n        t.seconds -= 60\n        t.minutes += 1\n\n    if\
    \ t.minutes >= 60:\n        t.minutes -= 60\n        t.hours += 1\n```\n\nThe\
    \ first line performs the operation; the remainder stays with the special cases\
    \ we saw before.\n\nIs this function correct? What happens if the parameter **seconds**\
    \ is greater than sixty? In that case, it is not enough to carry on; we have to\
    \ keep doing it until **seconds** is less than sixty. One solution is to replace\
    \ the if with **while** statements:\n\n```\ndef increment(t, seconds):\n    t.seconds\
    \ += seconds\n\n    while t.seconds >= 60:\n        t.seconds -= 60\n        t.minutes\
    \ += 1\n\n    while t.minutes >= 60:\n        t.minutes -= 60\n        t.hours\
    \ += 1\n```\n\nThis function is now correct when seconds is not negative, and\
    \ when hours do not exceed twenty, but it is not a particularly good solution.\n\
