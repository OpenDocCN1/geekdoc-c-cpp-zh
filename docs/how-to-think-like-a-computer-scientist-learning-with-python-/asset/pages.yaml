  md: '# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,
    Release 3rd Edition


    Fail first ...


    In our sample case, we have three lines in the file, yet we enter the loop four
    times. In Python, you only learn that the file has no more lines by failure to
    read another one. In some other programming languages (e.g. Pascal), things are
    different: you read three lines, but what you have is called look ahead — after
    reading the third line you already know that there are no more lines in the file.
    You''re not allowed to read the fourth line.


    So the templates for working line-at-a-time in Pascal and Python are subtly different!


    When you transfer your Python skills to your next computer language, be sure to
    ask how you''ll know when the file ends: is it in the language "try, and after
    you fail you''ll know", or is it "look ahead?


    If we try to open a file that doesn''t exist, we get an error:


    ```

    >>> mynewhandle = open("wharrah.txt", "r")

    IOError: [Errno 2] No such file or directory: "wharrah.txt"

    ```


    # 13.4 Turning a file into a list of lists


    It is often useful to fetch data from a disk file and turn it into a list of lists.
    Suppose we have a file containing our friends and their email addresses, one per
    line in the file. But we''d like the lines sorted into alphabetical order. A good
    plan is to read everything into a list of lines, then sort the list, and return
    the sorted list back to nature after:


    ```

    1 f = open("friends.txt", "r")

    2 xs = f.readlines()

    3 f.close()

    4

    5 xs.sort()

    6

    7 g = open("sortedfriends.txt", "w")

    8 for v in xs:

    9 g.write(v)

    10 g.close()

    ```


    The readlines method in line 2 reads all the lines and returns a list of strings.


    We could have used the template from the previous section to read each line one-at-a-time,
    and to build up list ourselves, but it is lot easier to use the method that the
    Python implementers gave us!'
