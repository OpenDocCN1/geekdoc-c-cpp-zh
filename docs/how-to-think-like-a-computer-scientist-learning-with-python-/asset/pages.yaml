  md: "# FRUITFUL FUNCTIONS\n\n# 6.1 Return values\n\nThe built-in functions we have\
    \ used, such as abs, pow, int, max, and range, have produced results. Calling\
    \ each of these functions generates a value, which we usually assign to a variable\
    \ or use as part of an expression.\n\n```\nbiggest = max(3, 7, 2, 5)\nx = abs(3\
    \ - 11) + 10\n```\n\nWe also wrote our function to return the final amount for\
    \ a compound calculation.\nin this chapter, we are going to write more functions\
    \ that return values, which we will call fruitful functions, for want of a better\
    \ name. The first example is area, which returns the area of a circle with the\
    \ given radius:\n\n```\ndef area(radius):\n    b = 3.14159 * radius**2\n    return\
    \ b\n```\n\nWe have seen the return statement before, but in a fruitful the return\
    \ statement includes a return value. This statement means: evaluate the expression,\
    \ and then return it immediately as the result (the result of this function).\
    \ The expression can be provided arbitrarily, so we could have this function like:\n\
    \n```\ndef area(radius):\n    return 3.14159 * radius\n```\n\nOn the other hand,\
    \ temporary variables like b often make debugging easier.\nSometimes it is useful\
    \ to have multiple return statements, one in each branch of a conditional.\nWe\
    \ have already seen the built-in abs, now how we see how to write our own:\n\n\
    ```\ndef absolute_value(x):\n    if x < 0:\n        return -x\n    else:\n   \
    \     return x\n```"
