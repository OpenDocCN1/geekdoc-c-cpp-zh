  md: '# HELLO, LITTLE TURTLES!


    There are many modules in Python that provide very powerful features that we can
    use in our own programs. Some of these can send email, or fetch web pages. The
    one we''ll look at in this chapter allows us to create turtles and get them to
    draw shapes and patterns.


    The turtles are fun, the real purpose of the chapter is to teach ourselves a little
    more Python, and to develop our theme of computational thinking, or thinking like
    a computer scientist. Most of the Python covered here will be explored in more
    depth later.


    # 3.1 Our first turtle program


    Let''s write a couple of lines of Python program to create a new turtle and start
    drawing a rectangle.(We''ll call the variable that refers to our first turtle
    alex, but we can choose another name if we follow the naming rules from the previous
    chapter).


    ```

    import turtle # Allows us to use turtles

    wn = turtle.Screen() # Creates a playground for turtles

    alex = turtle.Turtle() # Create a turtle, assign to alex

    alex.forward(50) # Tell alex to move forward by 50 units

    alex.left(90) # Tell alex to turn by 90 degrees

    alex.forward(30) # Complete the second side of a rectangle

    wn.mainloop() # Wait for user to close window

    ```


    When we run this program, a new window pops up:'
