    I also think that keeping the test suite separate from the functions use lead
    to a cleaner relationship between caller and callee, and gives a better chance
    of getting assignment / parameter taught accurately.


    There is a good testing module in Python, (and PyScript offers integrated support
    for it, and automated generation of skeleton modules), but it looked too advanced
    for beginners, because it requires multi-module concepts


    So I''ve favoured my own scaffolding in Chapter 6 (about 10 lines of code) that
    the students must insert into whatever file they''re working on.


    +   - I''ve played down command-input / process / output went. Many of our students
    have never seen a command-line shell, and it is arguably quite intimidating.


    +   - We''ve gone back to a more "classic / static" approach to writing our own
    classes and objects. Python (in company with languages like Javascript, Ruby,
    Perl, PHP, etc.) don''t really emphasize notions of "sealed" classes or "private"
    members, or ever "sealed instances".


    So one teaching to allocate each instance as an empty container, and suballow
    the external clients of the class (methods or attributes) into different instances
    as they wish to. It is a very dynamic approach, but perhaps has not one that encourages
    thinking in abstractions, layers, contracts, decoupling. It might even be the
    kind of thing that one could write one of "x,y,z ... considered harmful" papers
    about.


    In our conservative approach, we use an initializer every class, to determine
    at instantiation time what members we want, and we initialize the instances within
    the class. We''ve moved closer to philosophy in C# / Java on this one.


