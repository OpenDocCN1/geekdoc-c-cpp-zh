  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n# ## 10.4 An example: state machines\n\nA state machine\
    \ is a system that can be in one of a few different states. We draw a diagram\
    \ to represent the machine, where each state is drawn as a circle or an ellipse.\
    \ Certain events occur which cause the system to leave one state and transition\
    \ into a different state. These state transitions are usually drawn as an arrow\
    \ on the diagram.\n\nThis is not new: when turning on a cellphone, it goes into\
    \ a state which we could call “Awaiting PIN”. When the correct PIN is entered,\
    \ it transitions into a different state — “Ready”. When we lock the phone, and\
    \ it would enter a “Locked” state, and so on.\n\nA simple state machine we encounter\
    \ is often a traffic light. Here is a state diagram which shows that the machine\
    \ continually cycles through three different states, which we've numbered 0, 1\
    \ and 2.\n\n![](img/ddd7692255b55d8f3b8797c0ad440f9d_169_0.png)\n\nWe’re going\
