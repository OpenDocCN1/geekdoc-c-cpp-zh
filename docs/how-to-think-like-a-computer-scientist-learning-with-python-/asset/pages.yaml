    suit from the object self as an index into the class attribute suits, and select
    the appropriate string.


    The reason for the "narf" in the first element of ranks is to act as a place holder
    for the zero-element of the list, which will never be used. The only valid ranks
    are 1 to 13. This wasted item is not entirely necessary. We could have started
