  md: '# TUPLES


    # 9.1 Tuples are used for grouping data


    We saw earlier that we could group together pairs of values by surrounding with
    parentheses.

    Recall this example:


    ```

    >>> year_born = ("Paris Hilton", 1981)

    ```


    This is an example of a data structure — a mechanism for grouping and organizing
    data to make it easier to use.


    The pair is an example of a tuple. Generalizing this, a tuple can be used to group
    any number of items into a single compound value. Syntactically, a tuple is a
    comma-separated sequence of values. Although it is not necessary, it is conventional
    to enclose tuples in parentheses:


    ```

    >>> julia = ("Julia", "Roberts", 1967, "Duplicity", 2009, "Actress", "Atlanta")

    ```


    Tuples are useful for representing what others often call records — some related
    information that belongs together, like your student record. There is no description
    of what of these fields means, but we can guess. A tuple lets us “chunk” related
    information and use it as a single thing.


    Tuples support same sequence operations as strings. The index operator selects
    an element from a tuple.


    ```

    >>> julia[2]

    1967

    ```


    But if we try use item assignment to modify any of the elements of the tuple,
    we get an error:


    ```

    >>> julia[0] = "x"

    TypeError: ''tuple'' object does not support item assignment

    ```


    So strings, tuples are immutable. Once Python has a tuple in memory, it cannot
    be changed.


    Of course, even if we can''t modify the elements of a tuple, we can always make
    the julia variable reference a new tuple holding different information. To construct
    the new tuple, it is convenient that we can slice parts of the old tuple and join
    the bits to the new tuple.'
