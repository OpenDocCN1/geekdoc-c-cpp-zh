  md: "# How to Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n# 20.5 Memoization\n\nIf you played around the fibo function\
    \ from the chapter on recursion, you might have noticed that the bigger the argument\
    \ you provide, the longer the function takes to run. Furthermore, the time increases\
    \ very quickly. On one of our machines, fib(20) finishes instantly, fib(30) takes\
    \ about a second, and fib(40) takes roughly forever.\n\nTo understand why, consider\
    \ this call graph for fib with n = 4:\n\n![](img/ddd7692255b55d8f3b8797c0ad440f9d_300_0.png)\n\
    \nA call graph shows some function frames (instances when the function has been\
    \ invoked), with lines connecting each to the frames of the functions it calls.\
    \ At the top of the graph, fib with n = 4 calls fib with n = 3 and n = 2. In turn,\
    \ fib with n = 3 calls fib with n = 2 and n = 1. And so on.\n\nCount how many\
    \ times fib(0) and fib(1) are called. This is an inefficient solution to the problem,\
    \ and it gets worse as the argument gets bigger.\n\nA good solution is to keep\
    \ track of values that have already been computed by storing them in a dictionary.\
    \ A previously computed value that is stored for later is called a memo. Here\
    \ is an implementation of using memo:\n\n```\nalreadyknown = {0: 0, 1: 1}\ndef\
    \ fib(n):\n    if n not in alreadyknown:\n        new_value = fib(n-1) + fib(n-2)\n\
    \        alreadyknown[n] = new_value\n    return alreadyknown\n```\n\nThe dictionary\
    \ alreadyknown keeps track of the Fibonacci numbers we already know. We start\
    \ with only two pairs: 0 maps to 1, and 1 maps to 1.\n\nWhenever fib is called,\
    \ it checks the dictionary to determine if it contains the result. If it's, the\
    \ function can return immediately without making any more recursive calls. If\
    \ not, it has to compute the new value. The new value is added to the dictionary\
    \ before the function returns.\n\nUsing this version of fib, our machines can\
    \ compute fib(100) in an eyeblink."
