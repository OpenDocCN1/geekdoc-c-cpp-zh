    \ does four things:\n\n+   - polls for events — i.e. ask the system whether events\
    \ has occurred — and responds appropriately.\n- it updates whatever data structures\
    \ or objects need changing,\n- it draws the current state of the game into a (non-visible)\
    \ surface,\n- it puts the just-drawn surface on display.\n\n```\nimport pygame\n\
    def main():\n    \"\"\" Set up the game and run the main loop \"\"\"\n    pygame.init()\
