    # 11.10 Aliasing


    Since variables refer to objects, if we assign one variable to another, both variables
    refer to the same object:


    ```

    >>> a = [1, 2, 3]

    >>> b = a

    >>> a is b

    True

    ```


    In this case, the state snapshot looks like this:


    | b | [1, 2, 3] |


    Because the same has two different names, a and b, we say that it is **aliased**.
    Changes made with one alias affect the other:


    ```

    >>> b[0] = 5

    >>> a

    [5, 2, 3]

    ```


    Although this behavior can be useful, it is sometimes unexpected or undesirable.
    In general, it is safer to avoid aliasing when you are working with mutable objects
    (i.e. lists at this point in our textbook, but we''ll meet more mutable objects
    as we cover classes and dictionaries, sets). Of course, for immutable objects
    (i.e. strings, tuples), there''s no problem — it is not possible to change something
    and get a surprise when you access an alias name. That''s why Python is free to
    alias strings (and any other immutable kinds of data) when it sees an opportunity
    to economize.


    # 11.11 Cloning lists


    If we want to modify a list and keep a copy of the original, we need to be able
    to make a copy of the list itself, not just the reference. This process is sometimes
    called **cloning**, to avoid the ambiguity of the word copy.


    The easiest way to clone a list is to use the slice operator:


    ```

    >>> a = [1, 2, 3]

    >>> b = a[:]

    ```


    # 11.10. Aliasing'
