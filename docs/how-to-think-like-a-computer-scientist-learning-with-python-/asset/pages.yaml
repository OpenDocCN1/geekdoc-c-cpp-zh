    \ Release 3rd Edition\n\n```\nbetter = (approx + n/approx)/2\n```\n\nRepeat this\
    \ calculation a few times using your calculator. You can see why each iteration\
    \ brings your little closer. One of the amazing properties of this particular\
    \ algorithm is how quickly it converges to an accurate answer — a great advantage\
    \ for doing it manually.\n\nBy using a loop to repeating this formula until the\
    \ better approximation gets close enough to the previous one, we can write a function\
    \ for computing the square root. (In fact, this is how your calculator finds square\
    \ roots — it may have a slightly different formula and method, but it is also\
    \ based on repeating its guesses.)\n\nThis is an example of an indefinite iteration\
    \ problem: we cannot predict in advance how many times we'll improve our guess\
    \ — we just want to keep closer and closer. Our stopping condition for the loop\
    \ will be when our old guess and our improved guess are \"close enough\" to each\
    \ other.\n\nIdeally, we let the old and new guess get exactly equal to each other\
    \ when we stop. Because equality is a tricky notion in computer arithmetic when\
    \ real numbers are involved. Because real numbers are not represented absolutely\
    \ (after all, a number like pi or the square root of two has an infinite number\
    \ of decimal places because it is irrational), we need to formulate the stopping\
    \ test for the loop by asking \"is a close enough to b?\" This stopping condition\
    \ can be coded like this:\n\n```\nif abs(a-b) < 0.001:      # Make this smaller\
    \ for better accuracy\n    break\n```\n\nNotice that we take the absolute value\
    \ of the difference between a and b!\n\nThis problem is also an example of when\
    \ a multi-exit loop is appropriate:\n\n```\ndef sqrt(n):\n    approx = n/2.0 \
    \             # Start with some or other guess\n    while True:\n        better\
