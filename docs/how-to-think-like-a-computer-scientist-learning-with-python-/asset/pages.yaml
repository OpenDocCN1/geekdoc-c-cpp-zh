    \ Release 3rd Edition\n\n```\ntest(merge([], []) == []\ntest(merge(xs, ys)) ==\
    \ zs\ntest(merge([1, 2, 3], [3, 4, 5])) == [1, 2, 3, 4, 5]\ntest(merge([\"a\"\
    , \"big\", \"cat\"], [\"big\", \"bite\", \"dog\"]) == [\"a\", \"big\", \"big\"\
    , \"bite\", \"cat\", \"dog\"])\n```\n\nHere is our merge algorithm:\n\n```\ndef\
    \ merge(xs, ys):\n    \"\"\"\n    merged sorted lists xs and ys. Return a sorted\
    \ result \"\"\"\n    result = []\n    xi = 0\n    yi = 0\n\n    while True:\n\
    \        if xi >= len(xs): # If xs list is finished\n            result.extend(ys[yi:])\
    \ # Add remaining items from ys\n            return result # And we're done.\n\
    \n        if yi >= len(ys): # Same again, swap roles\n            result.extend(xs[xi:])\n\
    \            return result\n\n        # Both lists still have items, copy smaller\
    \ item to result.\n        if xs[xi] <= ys[yi]:\n            result.append(xs[xi])\n\
    \            xi += 1\n        else:\n            result.append(ys[yi])\n     \
    \       yi += 1\n```\n\nThe algorithm works as follows: we create a result list,\
    \ and keep two indexes, one into each list (lines 3-5). On each iteration of loop,\
    \ whichever list smaller is copied to the result list, and that list's index is\
    \ advanced. As soon as either index reaches the end of its list, we copy all the\
    \ remaining items from the other list into the result, which we return.\n\n# ##\
    \ 14.7 Alice in Wonderland, again!\n\nUnderlying the algorithm for merging sorted\
    \ lists is a deep pattern of computation that is widely reusable. The pattern\
    \ essence is \"Run through the lists always processing the smallest remaining\
    \ items from each, with these cases to consider:\"\n\n+   * What should we do\
    \ when either list has no more items?\n* What should we do if the smallest items\
    \ from each list are equal to each other?\n* What should we do if the smallest\
    \ item in the first list is smaller than the smallest one the second list?\n*\
    \ What should we do in the remaining case?\n\n# ## 14.7. Alice in Wonderland,\
    \ again!"
