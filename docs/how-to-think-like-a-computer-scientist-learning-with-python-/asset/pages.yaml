  md: '# THE RHODES LOCAL EDITION (RLE)

    (VERSION OF AUGUST, 2012)


    By Peter Wentworth


    # A word of thanks ...


    We switched from Java to Python in our introductory courses in 2010. So far we
    think the results look positive. More time will tell.


    This predecessor to this book was a great starting point for us, especially because
    of the liberal permission to change things. Having our own in-house course notes
    or handouts allows us to adapt and stay fresh, rearrange, see what works, and
    it gives us agility. We can also ensure that every student in the course gets
    a copy of the handouts — something that doesn''t always happen if we prescribe
    costly textbooks.


    Many thanks to all the contributors and the authors for making their hard work
    available to the Python community and to our students.


    A colleague and friend, Peter Warren, made the remark that learning introductory
    programming is as much about the environment as it is about the programming language.


    I''m a big fan of IDEs (Integrated Development Environments). I want help to be
    integrated into my editor, as a first-class citizen, available at the press of
    a button. I want syntax highlighting, and immediate syntax checking, and sensible
    autocompletion. I''d like an editor that can fold function bodies or regions of
    code away, because it promotes and encourages how we build mental abstractions.


    I''m keen on having a single-stepping debugger and breakpoints with code inspection
    built in. We''re trying to build a conceptual model of program execution in the
    student''s mind, and I find most helpful for teaching the call stack and variables
    explicitly visible, and to be able to immediately inspect the result of executing
    a statement.


    My philosophy, then, is not to look for a language to teach, but to look for a
    combination of IDE and language that are packaged together, and evaluated as a
    whole.


    I''ve made some deep changes to the original book to reflect this (and other opinionated
    views that I hold), and I have no doubt that more changes will follow as we mature
    our course.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    Here are some of the keys I''ve approached differently:


    +   - Our local situation demands that we have a large number of service course
    students in an introductory course of 3 weeks, and then we get another semester
    of teaching with those going into our mainstream program. The book is in two parts:
    we''ll do the first five chapters in the "get your toes wet" course, and the rest
    of the material in a separate semester.

    - We''re using Python 3. It is cleaner, more object oriented, and has fewer ad-hoc
    irregularities than earlier versions of Python.

    - We''re using PyScript as my IDE, on Windows. And it is hardwired into parts
    of these notes, with screenshots, etc.

    - I''ve dropped GASP.

    - For graphics we start with the Turtle module. As things move along, we use PyGame
    for more advanced graphics.

    - I''ve introduced some event-driven programming using the turtle.


    I have tried to push more object-oriented notions earlier, without asking students
    to synthesize objects or write their classes. So, for example, in the chapter
    about the turtle, we create multiple instances of turtles, talk about their attributes
    and state (color, position, etc) and we method-call to move them around, i.e.
