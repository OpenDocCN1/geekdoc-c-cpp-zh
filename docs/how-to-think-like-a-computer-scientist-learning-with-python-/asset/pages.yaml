    # 1.8 Formal and natural languages


    Natural languages are the languages that people speak, such as English, Spanish,
    and French. They were not designed by people (although people try to impose some
    order on them); they evolved naturally.


    Formal languages are languages that are designed by people for specific applications.
    For example, the notation that mathematicians use is a formal language that is
    particularly good at denotations among numbers and symbols. Chemists use a formal
    language to represent the chemical structure of molecules. And most


    Programming languages are formal languages that have been designed to express
    computations.


    Formal languages tend to have strict rules about syntax. For example, 3+3=6 is
    a syntactically correct statement, but 3=6 is not. H2O is a syntactically correct
    chemical name, but Zrt is not.


    Syntax rules come in two flows, pertaining to tokens and structure. Tokens are
    the basic elements of the language, such as words, numbers, parentheses, commas,
    and so on. In Python, a statement like print("Happy New Year for ,2013") has 6
    tokens: a function name, an open parenthesis (round bracket), a string, a comma,
    and a close parenthesis.


    It is possible to make errors in how one constructs tokens. One of the problems
    is that 3+6$ is that $ is not a legal token in mathematics (at least far as we
    know). Zr is not a legal token in chemistry notation because there is omitted
    the abbreviation Zr.


    The second type of syntax rules pertains to the structure of a statement—that
    is, the tokens are ordered. The statement 3=6 is structurally illegal because
    you cannot place a plus sign immediately after an equal sign. Similarly, molecular
    formulas have to have subscripts after the element name, not. And in our Python
    example, if we omitted the comma, or if we changed the two parentheses to print(")Happy
    New Year for ,2013 our statement would have six legal and valid tokens, but the
    structure is illegal.


    When you read a sentence in English or in a formal language, you have to figure
    out what the structure of the sentence is (although in a natural language you
    do this unconsciously). This process is parsing.


    For example, when you hear the sentence, "The other shoe fell", then understand
    that the other shoe is the subject and the fell is the verb. Once you have a sentence,
    you can figure out what it means, or the semantics of the sentence. Assuming that
    you know what a shoe is and what it means to fall, you will understand the general
    implication of this sentence.


