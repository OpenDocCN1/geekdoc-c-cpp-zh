    \ be uniquely numbered (and we can reverse this numbering to get back to the original\
    \ concept). So let's number them, \"These are enumerable — the elements\" and\
    \ configure our thinking to integers. Frankly, we have powerful techniques and\
    \ a good understanding of integers, and our abstractions — the way we tackle and\
    \ simplify these problems — is to reduce them to problems about integers.\n\n\
    Computer Scientists tend to do the opposite. We will argue that there are many\
