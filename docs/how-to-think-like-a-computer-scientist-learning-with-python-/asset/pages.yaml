  md: '# APPENDIX A


    # # DEBUGGING


    Different kinds of errors can occur in a program, and it is useful to distinguish
    among them in order to track them down more quickly:


    +   1. Syntax errors are produced by Python when it is translating the source
    code into byte code. They usually indicate that there is something wrong with
    the syntax of the program. Example: Omitting the colon at the end of a def statement
    yields the redundant `SyntaxError: invalid syntax`.


    +   2. Runtime errors are produced by the runtime system if something goes wrong
    while the program is running. Most runtime errors include information about where
    the error occurred and what functions were executing. Example: An infinite recursion
    eventually causes a runtime error of maximum recursion depth exceeded.


    +   3. Semantic errors are problems with a program that compiles and runs but
    doesn''t do the right thing. Example: An may may not evaluated in the order you
    expect, yielding an unexpected result.


    The first step in debugging is to figure out which kind of error you are dealing
    with. Although the following sections are organized by error type, some techniques
    are applicable in more than one situation.


    # ## A.1 Syntax errors


    Syntax errors are usually easy to fix once you figure out what they are. Unfortunately,
    the error messages are often not helpful. The most common messages are `SyntaxError:
    invalid syntax` and `SyntaxError: invalid token`, neither of which is very informative.


    On the other hand, the message tells you where in the problem order occurred.
    Actually, it tells you Python noticed a problem, which is not necessarily where
    the error is. Sometimes the error is prior to the location of the error message,
    often on the preceding line.


    If you are building the program incrementally, you should have a good idea about
    where the error is. It will be in the last line you added.


    If you are copying code from a book, start by comparing your code to the book’s
    code very carefully. Check every character. At the same time, remember that the
    book might be wrong,


    345'
