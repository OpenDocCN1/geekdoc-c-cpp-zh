  md: '# CHAPTER TWENTYSEVEN


    # TREES


    Like linked lists, trees are made up of nodes. A common kind of tree is a binary
    tree, in which each node contains a reference to two other nodes (possibly None).
    These references are referred to as the left and the right subtrees. List like
    nodes, tree nodes also contain cargo. A state diagram for a tree looks like this:


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_361_0.png)


    To avoid clutter the picture, we omit the Nones.


    To make things worse, computer scientists mix in another metaphor: the family
    tree. The top node is sometimes called a parent and the nodes it refers to are
    its children. Nodes with the same parent are called siblings.


    Finally, there is a geometric vocabulary for talking about trees. We already mentioned
    left and right, but there is also up (toward the parent/root) and down (toward
    the children/leaves). Also, all of the nodes are the same distance from the root
    comprise a level of the tree.


    We probably don''t need three metaphors for talking about trees, but there they
    are.


    Like linked lists, trees are recursive data structures because they are defined
    recursively. A tree is either:


    +   1. the empty tree, represented by None, or'
