    Class attributes like suits are shared by all Card objects. The advantage of this
    is that we can use any Card to access the class attributes:


    ```

    >>> card2 = Card(1, 3)

    >>> print(card2)

    3 of Diamonds

    >>> print(card2.suits[1])

    Diamonds

    ```


    Because every instance references the same class attribute, have an aliasing situation.
    The disadvantage is that if we modify a class attribute, it affects every instance
    of the class. For example, if we decide that Jack of Diamonds should be called
    Jack of Swirly Whales, we could do this:


    ```

