    \ + (y2-y1)**2)\n\n>>> distance(1, 2, 4, 6)\n5.0\n```\n\n# 6.3 Debugging with\
    \ print\n\nAnother powerful technique for debugging (an alternative to single-stepping\
    \ and inspection of program variables), is to insert print functions in carefully\
    \ selected places in your code. Then, by inspecting the output of the program,\
    \ you can check whether the algorithm is doing what you expect it to. Be clear\
    \ about the following:\n\n+   * You must have a clear solution to the problem,\
    \ and know what should have happened before you can debug a program. Work on solving\
    \ the problem on a piece of paper (perhaps using a flowchart to record the steps\
    \ you take) before you concern yourself with writing code. Writing a program does\
    \ not solve the problem — it automates the manual steps you would take. So first\
    \ make sure you have a pen-and-paper manual solution that works. Programming is\
    \ then making those manual steps happen automatically.\n* Do not write chatterboxes.\
    \ A chatterbox is a fruitful addition to its primary task, also asks the user\
    \ for input, or prints output, when it would be more useful if it simply shut\
    \ up and do its work quickly.\n\nFor example, we've seen built-in functions like\
    \ max and abs. None of these would be useful building blocks for other programs\
    \ if they prompted the user for input, or printed their results while they performed\
    \ their tasks.\n\nSo a good tip is to avoid calling print and input inside fruitful\
    \ functions, unless the primary purpose of your function is to perform input and\
    \ output. The one exception to this rule might be to temporarily sprinkle calls\
    \ to print into your code to help debug and understand what is happening when\
    \ the code runs, but these could be removed once you get things working.\n\n#\
    \ 6.4 Composition\n\nAs you should expect by now, you can call one function from\
    \ within another. This ability is called composition.\n\nAs an example, we'll\
