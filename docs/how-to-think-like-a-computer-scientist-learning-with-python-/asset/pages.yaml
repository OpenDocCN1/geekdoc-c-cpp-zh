    # STRINGS


    # 8.1 A compound data type


    So far we have seen built-in types like `int, float, bool, str` and we''ve seen
    lists and pairs. Strings, lists, and pairs are qualitatively different from the
    others because they are made of smaller pieces. In the case of strings, they''re
    made up of smaller each containing one **character**.


    Types that comprise smaller pieces are called **compound data types**. Depending
    on what we are doing, we may want to treat a compound data type as a single thing,
    or we may want to access its parts. This ambiguity is useful.


    # 8.2 Working with strings as single things


    We previously saw that each instance has its own attributes and a number of methods
    that can be applied to the instance. For example, we could set the turtle''s color,
    and we wrote `tess.turn(90)`.


    Just like a turtle, a string is also an object. So each string instance has its
    own attributes and methods.


    For example:


    ```

    >>> ss = "Hello, World!"

    >>> tt = ss.upper()

    >>> tt

    ''HELLO, WORLD!''

    ```


    `upper` is a method that can be invoked on any string object to create a new string,
    in which the characters are in uppercase. (The original string `ss` remains unchanged.)


    There are other methods such as `lower, capitalize, and `swapcase` that do other
    interesting stuff.


    To learn what methods are available, you can consult the Help documentation, for
    string methods, and read the documentation. Or, if you''re a bit lazy, simply
    type the following into a PyScripter script:'
