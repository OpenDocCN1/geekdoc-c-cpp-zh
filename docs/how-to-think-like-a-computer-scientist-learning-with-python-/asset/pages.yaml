    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_54_0.png)


    Here are a couple of things we''ll need to understand turtle to draw on our canvas.


    The first line tells Python to load a module named turtle. That module brings
    two new types that we can use: the Turtle type, and the Screen type. The dot notation
    turtle.Turtle means "The type that type is defined within the turtle module".
    (Re-member that Python is case-sensitive, the module name, with a lowercase t,
    is different from the type Turtle.)


    We create and open what it calls a screen (we would prefer to call it a window),
    which we assign to variable wn. Every window contains a canvas, which is the area
    inside the window on we can draw.


    In line 3 we create a turtle. The variable alex is made to refer to this turtle.


    So these first 5-7 lines set things up, we''re ready to get our turtle to draw
    on our canvas.

    In lines 5-7, we instruct the object alex to move, and to turn. We do this by
    invoking, or activating, alex''s methods — these are the instructions that all
    turtles know how to respond to.


    The last line plays a part too: the wn variable refers to the window shown. When
    we invoke its mainloop, it enters a state where it waits for events (like keypresses,
    or mouse movements). The program will terminate when the user closes the window.


    An object can have various methods — things it can do and it also have attributes
    (sometimes properties). For example, each turtle has a color attribute. The method
    invocation alex.color("red") will make alex red, and drawing will be red too.
    (Note the word color is spelled the American!)


    The color of the turtle, width of its pen, position of the turtle within the window,
    which it is facing, are all part of its current state. Similarly, the object has
    a background color, and some text in the title bar, and a size and position on
    the screen. They are all part of the state of the window object.


    Quite a number of methods allow us to modify the turtle and the window objects.
