    \ character that print usually appends to our strings. Why?\nthis is because the\
    \ string already has its own newline: the readline method in line 3 returns\n\
    ething up and including the newline character. This explains the end-of-file detection\n\
    ion: when there are no more lines to read from the file, readline returns an empty\n\
    string — one that does not even have a newline at the end, hence its length is\
    \ 0."
