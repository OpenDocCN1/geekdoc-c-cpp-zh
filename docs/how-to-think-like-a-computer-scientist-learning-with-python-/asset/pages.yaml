    # 20.3 Aliasing and copying


    As in the case of lists, dictionaries are mutable, we need to be aware of aliasing.
    Whenever two variables refer to the same object, changes to one affect the other.


    If we want to modify a dictionary and keep a copy of the original, use the copy
    method. For example, opposites is a dictionary that contains pairs of opposites:


    ```

    >>> opposites = {"us": "down", "right": "wrong", "yes": "no"}

    >>> alias = opposites

    >>> copy = opposites.copy()  # Shallow copy

    ```


    alias and opposites refer to the same object; copy refers to a fresh copy of the
    same dictionary. If we modify opposites, opposites is also changed:


    ```

    >>> opposites["right"] = "left"

    >>> opposites["right"]

    ''left''

    ```


    If we modify copy, opposites is unchanged:


    ```

    >>> copy["right"] = "privilege"

    >>> opposites["right"]

    ''left''

    ```'
