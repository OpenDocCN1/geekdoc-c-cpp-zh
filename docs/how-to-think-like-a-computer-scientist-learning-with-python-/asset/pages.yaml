  md: '# CHAPTER

    SEVEN


    # ITERATION


    Computers are often used to automate repetitive tasks. Repeating iteration or
    similar tasks without making errors is something that computers do well and people
    do poorly.


    Repeated execution of a set of statements is called **iteration**. Because iteration
    is so common, Python provides several language features to make it easier. We''ve
    already seen the `for` statement in chapter 3. This the form of iteration you''ll
    likely be using most often. But in this chapter we''re going to look at the `while`
    statement — another way to have your program iteration, useful in slightly different
    circumstances.


    Before we do that, let''s review a few ideas...


    # 7.1 Assignment


    As we have mentioned previously


    ```

    airtime_remaining = 15

    print(airtime_remaining)

    airtime_remaining = 7

    print(airtime_remaining)

    ```


    The output of this program is:


    ```

    15

    7

    ```


    because the first time `airtime_remaining` is printed, its value is 15, and the
    second time, its value is 7.


    It is especially important to distinguish between an assignment statement and
    a Boolean expression that tests equality. Because Python uses the token `=` for
    assignment, it is tempting to interpret a statement like `a = b` as a Boolean
    test. Unlike mathematics, it is not! Remember that the Python token for the equality
    operator is `==`.


    Note too that an equality test is symmetric, but assignment is not. For example,
    if `a == 7` then `7 == a`. In Python, the statement `a = 7` is legal and `7 =
    a` is not.'
