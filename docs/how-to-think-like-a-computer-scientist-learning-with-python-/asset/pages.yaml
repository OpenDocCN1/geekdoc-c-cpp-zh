  md: '# How to Think Like a Scientist: Learning with Python 3

    Documentation, Release 3rd


    ```

    1 friends = ["Joe", "Zoe", "Brad", "Angelina", "Zuki", "Thandi", "Paris"]

    2 test(search_linear(friends, "Zoe") == 1)

    3 test(search_linear(friends, "Joe") == 0)

    4 test(search_linear(friends, "Paris") == 6)

    5 test(search_linear(friends, "Bill") == -1)

    ```


    Motivated by the fact that tests don''t run even, let alone pass, now write the
    function:


    ```

    1 def search_linear(xs, target):

    2   """Return the index of target in sequence xs """

    3   for (i, v) in enumerate(xs):

    4     if v == target:

    5       return i

    6   return -1

    ```


    There are some points to learn here: We''ve seen a similar algorithm in 8.10 when
    we searched for a character in string. We used a while loop, here we''ve used
    a for loop, coupled with enumerate to extract the (i, v) pair on each iteration.
    There are other variations - for example, we could have used range and make the
    loop only over the indices, or we could have used the idiom of returning None
    when the item was not found in the list. The essential similarity in these variations
    is that we test every item in the list in turn, from first to last, using the
    pattern of the short-circuit eureka traversal that we introduced earlier — that
    we return the function as soon as we find the target we''re looking for.


    Searching all items of a sequence from first to last is called a linear search.
    Each time we check v == target we call it a probe. We can count probes as a measure
    of how efficient our algorithm is, and this will be a good enough index of how
    our algorithm will execute.


    Linear searching is characterized by the fact that the number of probes needed
    to find some target depends directly on the length of the list. If the list becomes
    bigger, we can expect to wait ten times longer when searching for times. Notice
    too, if we''re searching for a target that is not in the list, we''ll have to
    go all the way to the end before we return the negative value. So this case needs
    N probes, where N is the length of the list. However, if we''re searching for
    a target that exists in the list, we could be lucky and find it immediately in
    position 0, or we might have to look further, perhaps all the way to the last
    item. On average, when the target is present, we are going to go about halfway
    through the list, N/2 probes


    We say that this search has linear performance (meaning straight line) because,
    if we were to measure the average search times for different sizes of list (N),
    and then plot a graph of time-to-search against N, we get a more-or-less straight
    line.


    Analysis like this is pretty meaningless for small lists — the computer is quick
    enough not to bother if the list only has a handful of items., we''re interested
    in the scalability of our algorithms — how do we perform if we have bigger problems
    at time. This would be a sensible one to use if we had a million or ten million
    items (perhaps the catalog of books in your local library) in our list? What happens
    for really large datasets, e.g. how does Google so brilliantly well?'
