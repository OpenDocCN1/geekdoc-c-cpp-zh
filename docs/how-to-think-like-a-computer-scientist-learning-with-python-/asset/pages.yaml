  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    ```

    >>> [''apples'', 430), (''bananas'', 312), (''oranges'', 525), (''pears'', 217)]

    [''apples'', 430), (''bananas'', 312), (''oranges'', 525), (''pears'', 217)]

    ```


    The reason is dictionaries are very fast, implemented using a technique called
    hashing. By contrast, the list of tuples implementation is slow. If we wanted
    to find a value associated with a key, we would have to iterate over every tuple,
    checking the 0th element. What if the key wasn''t even in the list? We would have
    to get to the end of it to find out.


    Another way to create a dictionary is to provide a list of key:value pairs using
    the same syntax as the previous:


    ```

    >>> eng2sp = {"one": "uno", "two": "dos", "three": "tres"}

    ```


    It doesn''t matter how we write the pairs. The values in a dictionary are accessed
    with keys, not indices, so there is no need to care about ordering.


