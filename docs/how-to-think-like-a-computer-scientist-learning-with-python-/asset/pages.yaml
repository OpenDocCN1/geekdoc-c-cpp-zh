    # 11.5 List operations


    The + operator concatenates lists:


    ```

    >>> a = [1, 2, 3]

    >>> b = [4, 5, 6]

    >>> c = a + b

    >>> c

    [1, 2, 3, 4, 5, 6]

    ```


    Similarly, the * operator repeats a list given number of times:


    ```

    >>> [0] * 4

    [0, 0, 0, 0]

    >>> [1, 2, 3] * 3

    [1, 2, 3, 1, 2, 3, 1, 2, 3]

    ```


    The first example repeats [0] four times. The second example repeats the list
    [1, 2, 3] three times.


    # 11.6 List slices


    The slice operations we saw previously strings let us work with sublists:


    ```

    >>> a_list = ["a", "b", "c", "d", "e", "f"]

    >>> a_list[1:3]

    [''b'', ''c'']

    >>> a_list[:4]

    [''a'', ''b'', ''c'', ''d'']

    >>> a_list[3:]

    [''d'', ''e'', ''f'']

    >>> a_list[:]

    [''a'', ''b'', ''c'', ''d'', ''e'', ''f'']

    ```


    # 11.7 Lists are mutable


    Unlike strings, lists are mutable, which means we can change their elements. Using
    the index operator on the left side of an assignment, we can update one of the
    elements:


    ```

    >>> fruit = ["banana", "apple", "quince"]

    >>> fruit[0] = "pear"

    >>> fruit[2] = "orange"

    >>> fruit

    [''pear'', ''apple'', ''orange'']

    ```


    The bracket operator applied to a list can appear anywhere in an expression. When
    it appears on the left side of an assignment, it changes one of the elements in
    the list, so the first element'
