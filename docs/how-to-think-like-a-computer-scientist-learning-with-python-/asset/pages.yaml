    Before you bring someone else in, make sure you have exhausted the techniques
    described here. Your program should be as simple as possible, and you should be
    working on the smallest input that causes the error. You should have print statements
    in the appropriate places (and the output they produce should be comprehensible).
    You should understand the problem well enough to describe it concisely.


    When bringing someone in to help, be sure to give them the information they need:


    +   1. If there is an error message, what is it and what part of the program does
    it indicate?

    2. What was the last thing you did before this error occurred? What were the last
    lines of code that you wrote, or what is the new test case that fails?

    3. What have you tried so far, and what have you learned?


    Good instructors and helpers will also do something that should not offend you:
    they won''t believe when you tell them "I''m sure the input routines are working
    just fine, and that I''ve set up the data correctly!”. They will validate and
    check for themselves. After all, your program has a bug. Your understanding and
    inspection of the code have not found it yet. So you should expect to have your
    assumptions challenged. And as you gain skills and help others, you''ll need to
    do the same for them.


    When you find the bug, take a second to think about what you could have done to
    find it faster. Next time you see something similar, you will be able to find
    the bug more quickly.


    Remember, the goal is not just to make the program work. The goal is to learn
    how to make the program work.'
