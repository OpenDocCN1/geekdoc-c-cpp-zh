  md: '# How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    __init__` Initialize a new empty stack.


    **push** Add a new item to the stack.


    **pop** Remove and return an item from the stack. The item that is returned is
    always the last one

    was added.


    **is_empty** Check whether the stack is empty.


    A stack is sometimes called a "Last in, First out" or LIFO data structure, because
    the last item

    added is the first to be removed.


    # 25.3 Implementing stacks with Python lists


    The list operations that Python provides are similar to the operations that define
    a stack. The

    interface isn''t exactly what it is supposed to be, but we can write code to translate
    from the

    Stack ADT to the built-in operations.


    This code is an **implementation** of the Stack ADT. In general, an implementation
    is a

    se of methods that satisfy the syntactic and semantic requirements of an interface.


    Here is an implementation of the Stack ADT that uses a Python list:


    ```

    1 class Stack:

    2     def __init__(self):

    3       self.items = []

    4

    5     def push(self, item):

    6       self.items.append(item)

    7

    8     def pop(self):

    9       return self.items.pop()

    10

    11    def is_empty(self):

    12      return (self.items == [])

    ```


    A Stack object contains an attribute named **items** that is a list of items in
    the stack. The

    initialization method sets **items** to the empty list.


    To push a new item onto the stack, **push** appends it **items**. To pop an item
    off the stack,

    **pop** uses the homonymous (**same-named**) list method to remove and return
    the last item on the

    list.


    Finally, to check if stack is empty, **is_empty** compares **items** to the empty
    list.


    An implementation like this, in which the methods consist of simple invocations
    of existing

    methods, is called **veneer**. In real life, veneer is a thin coating of good
    quality used in

    furniture-making to hide lower quality underneath. Computer scientists use this
    metaphor

    to describe a small piece of code that hides the details of an implementation
    and provides a

    simpler, or more standard, interface.'
