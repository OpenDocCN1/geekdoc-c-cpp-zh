  md: '# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,
    Release 3rd Edition


    The variables p and q are assigned references to two new Point objects. A function
    like Point that creates a new object instance is a constructor, and every class
    automatically provides a constructor function which is named the same as the class.


    It may be helpful to think of class as a factory for making objects. The class
    itself isn''t an instance of a point, but it contains the machinery to make point
    instances. Every time we call the constructor, we''re asking the factory to make
    us a new object. As the object comes off the production line, its initialization
    method is executed to get the object properly set up with its default settings.


    The combined process of "make me new object" and "get its settings initialized
    to the factory default settings" is called instantiation.


    # 15.3 Attributes


    Like real worlds, object instances have both attributes and methods.


    We can modify the attributes in an instance using dot notation:


    ```

    >>> p.x = 3

    >>> p.y = 4

    ```


    Both modules and instances create their own namespaces, and the syntax for accessing
    names contained in each, attributes, is the same. In this case the attribute we
    are selecting is a data item from instance.


    The following statement shows the result of these assignments:


    | p | x -> 3 |

    |   | y -> 4 |


    The variable p refers to a Point object, which contains two attributes. Each attribute
    refers to a number.


    We can access the value of an attribute using the same syntax:


    ```

    >>> print(p.y)

    4

    >>> x = p.x

    >>> print(x)

    3

    ```


    The expression p.x means, "Go to the object p refers to and get the value of x".
    In this case, we assign that value to a variable named x. There is no conflict
    between the variable x (in the global namespace) and the attribute x (in the namespace
    belonging to the instance). purpose of dot notation is to fully qualify which
    variable we are referring to unambiguously.


    We can use dot notation as part of any expression, the following statements are
    legal:


    ```

    >>> print((x=0, y=1)).format(p.x, p.y))

    distance_squared_from_origin = p.x * p.x + p.y * p.y

    ```'
