  md: '# CHAPTER

    ONE


    # THE WAY OF THE PROGRAM


    The goal of this book is to teach you to think like a computer scientist. This
    way of thinking combines some of the best features of mathematics, engineering,
    and natural science. Like mathematicians, computer scientists use formal languages
    to denote ideas (specifically computations). Like engineers, they design things,
    assembling components into systems and evaluating tradeoffs among alternatives.
    Like scientists, they observe the behavior of complex systems, form hypotheses,
    and test predictions.


    The single most important skill for a computer scientist is problem solving. Problem
    solving means the ability to formulate problems, think creatively and express
    a solution clearly and accurately. As it turns out, the process of learning to
    program is an excellent opportunity to practice problem-solving skills. That''s
    why this chapter is called, The Way of the program.


    On one level, you will be learning to program, a useful skill by itself. On another
    level, you will use programming as a means to an end. As we go along, that end
    will become clearer.


    # The Python programming language


    The programming language you will be learning is Python. Python is an example
    of a high-level language; other high-level languages you might have heard of C++,
    PHP, Pascal, C#, and Java.


    As you might infer from the high-level language, there are also low-level languages,
    sometimes referred to as machine languages or assembly languages. Loosely speaking,
    computers can only execute programs in low-level languages. Thus, programs written
    in a high-level language have to be translated into something more suitable before
    they can run.


    Almost all programs are written in high-level languages because they take less
    time to write, they are shorter and easier to read, and they are more likely to
    be correct. Second, high-level languages are portable, meaning that they can run
    on different kinds of computers with few or no


    The engine that translates and runs Python is called the Python Interpreter: There
    are two ways to use it: immediate mode and script mode. In immediate mode, you
    type Python expressions into the Python Interpreter window, and the interpreter
    immediately shows the result:'
