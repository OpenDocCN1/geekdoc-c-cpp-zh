    # 17.8 Reflections


    Object programming is a good organizational tool for Software. In this chapter,
    we''ve started to use (and hopefully appreciate) these benefits. We had N queens
    with its own state, falling to its own floor, bouncing, getting kicked, We might
    have managed without the organizational power of objects — perhaps we could have
    kept lists of velocities for each queen, and of target positions, and so on —
    our code likely have been much more complicated, ugly, and a lot poorer!


    # 17.9 Glossary


    **animation rate** The rate at which we play back successive patches to create
    the illusion of movement. In the sample we collected in this chapter, we played
    Duke''s 10 patches over the duration of one second. Not all are the same as the
    frame rate.


    **baked animation** An animation that is designed to look good at a predetermined
    fixed frame rate. This reduces the amount of computation that needs to be done
    when the game is running. High-end games usually use their animations.


    **blit** A verb used in computer graphics, meaning to make a fast copy of an image
    or pixels from a sub-rectangle of one image or surface to another surface or image.


    **frame rate** The rate at which the game loop executes and updates the display.


    **game loop** A loop that drives the logic of a game. We will usually poll for
    events, update each of the objects in the game, then get everything drawn, and
    then put the newly drawn on display.


    **pixel** A single picture, or dot, from which images are made.


    **poll** To ask something whether a keypress or mouse movement has happened. Game
    loops usually poll to discover what events occur. This is different from event-driven
    programs like the ones seen in the chapter titled “Events”. In those cases, the
    click or key event triggers the call of a handler function in your program, but
    this happens behind your back.


    **sprite** An active agent or element in a game, with its own state, position
    and behavior.


    **surface** This is PyGame''s term for what the Turtle module calls a *canvas*.
    A surface is a rectangle of pixels used for displaying shapes and images.'
