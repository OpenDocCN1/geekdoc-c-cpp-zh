    # LIST ALGORITHMS


    This chapter is a bit different from what we''ve done so far: rather than introduce
    more Python syntax and features, we''re going to focus on the program development
    process, and some algorithms that work with lists.


    As in all parts of this book, our expectation is that you, the reader, will copy
    our code into your Python environment, play and experiment, and work along with
    us.


    Part of this chapter works with the book Alice in Wonderland and a vocabulary
    file. Your browser should be able to download and save these files from links.


    # 14.1 Test-driven development


    Early in our Fruitful functions chapter we introduced the ideal of incremental
    development, where we added small fragments of code to slowly build up the whole,
    so that we could easily find problems early. Later in that same chapter we introduced
    unit testing and gave code for our testing framework so we could capture, in code,
    appropriate tests for the functions we were writing.


    Test-driven development (TDD) is a software development practice that takes these
    practices one step further. The key idea is that automated tests should be written
    first. This technique is called test-driven — if we are able to believe the extremists
    — non-testing code should only be written when there is a failing test to pass.


    We can still retain our mode of working in small incremental steps, but now we
    will define and express those in terms of a sequence of increasingly sophisticated
    unit tests that demand more from our code at each stage.


    We''ll turn our attention to some standard algorithms that process lists now,
    but as we proceed through this chapter we will attempt to do so in the spirit
    encouraged by TDD.


    # 14.2 The linear search algorithm


    We''d like to know the index where a specific item occurs within a list of items.
    Specifically, we''ll return the index of the item if it is found, or we''ll return
    -1 if the item doesn''t occur in the list. Let us start with some tests:'
