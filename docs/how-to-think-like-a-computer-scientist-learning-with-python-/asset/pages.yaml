    # 8.8 Strings are immutable


    It is tempting to use the [] operator on the left side of an assignment, with
    the intention of changing a character in a string. For example:


    ```

    1 greeting = "Hello, world!"

    2 greeting[0] = ''J''  # ERROR!

    3 print(greeting)

    ```


    Instead of producing the output Jello, world!, this code produces a runtime error

    TypeError: ''str'' object does not support item assignment.


    Strings are immutable, which means you can''t change an existing string. The best
    you can do is create a new string that is a variation on the original:


    ```

    1 greeting = "Hello, world!"

    2 new_greeting = "J" + greeting[1:]

    3 print(new_greeting)

    ```


    The solution is to concatenate a new letter onto a slice of greeting. This operation
    has no effect on the original string.


    # 8.9 The in and not in operators


    The in operator tests for membership. When both of the arguments to in are strings,
    in checks whether the left argument is a substring of the right argument.


    ```

    >>> "p" in "apple"

    True

    >>> "i" in "apple"

    False

    >>> "ap" in "apple"

    True

    >>> "pa" in "apple"

    False

    ```


    Note that a string is a substring of itself, and the empty string is a substring
    of any other string. (Also note that computer scientists like to think about these
    edge cases carefully!)


    ```

    >>> "a" in "a"

    True

    >>> "apple" in "apple"

    True

    >>> "" in "a"

    True

    >>> "" in "apple"

    True

    ```


