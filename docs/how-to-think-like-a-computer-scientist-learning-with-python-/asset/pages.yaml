    \ just done, it is not how we work in real life. If you were given a vocabulary\
    \ and asked to tell if some word present, you'd probably start in the middle.\
    \ You can do this because the vocabulary is ordered — so you can probe some word\
    \ in the middle, and immediately realize that your target was for before (or perhaps\
    \ after) the one you had probed. Applying this principle leads us to a much better\
    \ algorithm for searching in a list of items that are already ordered. (Note that\
    \ if the items are unordered, you have little choice other to look through all\
    \ of them. But, if you know the items are in order, we can improve our searching\
    \ technique.)\n\nLets start with some tests. Remember, the list needs be sorted:\n\
    \n```\nxs = [2,3,5,7,11,13,17,23,29,31,37,47,53]\ntest(search_binary(xs, 20))\
    \ == -1\ntest(search_binary(xs, 99)) == -1\ntest(search_binary(xs, 1)) == -1\n\
    for (i, v) in enumerate(xs):\n    test(search_binary(xs, v) == i)\n```\n\nEven\
    \ our tests are interesting this notice: we start with items not in the list and\
    \ look at boundary conditions — in middle of the list, less all items in the list,\
    \ bigger than the biggest. Then we to use every item as a target, and to confirm\
    \ that our binary search returns the corresponding index of item in the list.\n\
    \nIt is useful to have a region-of-interest (ROI) within the list being searched.\
    \ The ROI will be the portion of the list in which it is possible that our target\
    \ might be found. Our algorithm will start with the ROI set to all items in the\
    \ list. On the first probe in the middle of the ROI, there are three possible\
    \ outcomes: either we find the target, or learn that we discard the top half of\
    \ the ROI, or learn that we can discard the bottom half of the ROI. And keep doing\
    \ this repeatedly, until we find our target, or we end up with no more items in\
    \ our region of interest. We can code this as follows:\n\n```\ndef search_binary(xs,\
    \ target):\n    \"\"Find and return the index of key in sequence xs \"\"\n   \
    \ lb = 0\n    ub = len(xs)\n    while True:\n        if lb == ub: # Region of\
    \ interest (ROI) becomes empty\n            return -1\n\n        # Next probe\
    \ should be in the middle of the ROI\n        mid_index = (lb + ub) // 2\n\n \
