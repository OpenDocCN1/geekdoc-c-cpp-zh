    # 15.4 Improving our initializer


    To create a point at position (7, 6) currently needs three lines of code:


    ```

    1 p = Point()

    2 p.x = 7

    3 p.y = 6

    ```


    We can make our class constructor more general by placing extra parameters into
    the

    __init__ method, as shown in this example:


    ```

    1 class Point:

    2     """ Class represents and manipulates x, y coordinates. """

    4     def __init__(self, x=0, y=0):

    5         """ Create a new point at x, y """

    6         self.x = x

    7         self.y = y

    8

    9     # Other statements outside the class continue below here.

    ```


    The x and y parameters are here optional. If the caller does not supply arguments,
    they''ll

    get the default values of 0. Here is our improved class in action:


    ```

    >>> p = Point(4, 2)

    >>> q = Point(6, 3)

    >>> r = Point()      # r represents the origin (0, 0)

    >>> print(p.x, q.y, r.x)

    4 3 0

    ```


    # Technically speaking...


    If we really argue, we would argue that the __init__ method''s docstring is inaccurate.

    __init__ doesn''t create the object (i.e. set aside memory for it), — it initializes
    the

    object to its factory-default settings after its creation.


    But tools like PyScriptor understand instantiation — creation and initialization
    — hap-

    penter, and they choose to display the initializer''s docstring as the tooltip
    to guide the

    programmer who calls the class constructor.


    So we''re writing the docstring so that it makes the most sense when it pops up
    to help the

    programmer who is using our Point class:'
