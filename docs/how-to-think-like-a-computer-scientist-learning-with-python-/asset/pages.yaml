  md: "# How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n# 0.0.3 Introducing programming with Python\n\nThe process\
    \ of translating and using How to Think Like a Computer Scientist for the past\
    \ two years has confirmed Python's suitability for teaching students. Python greatly\
    \ simplifies programming examples and makes important programming ideas easier\
    \ to teach.\n\nThe first example of what the text illustrates point. It is the\
    \ traditional hello, world program, which in the Java version of the book looks\
    \ like this:\n\n```\nclass Hello {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello, world.\");\n    }\n}\n```\n\nin the Python\
    \ version it becomes:\n\n```\nprint(\"Hello, world!\")\n```\n\nEven though this\
    \ is a trivial example, the advantages of Python stand out. Yorktown's Computer\
    \ Science I has no prerequisites, so many of the students seeing this example\
    \ are looking at their first program. Some of them are undoubtedly little nervous,\
    \ having heard that programming is difficult to learn. The Java version has forced\
    \ me to choose between two unsatisfactory options: either explain the class Hello,\
    \ public static void main, String[] args, [, and ], statements seem confusing\
    \ and intimidating some of the students at the start, or to tell them, don't worry\
    \ about all of that now; we will talk about it later, and risk the same thing.\
    \ The educational objectives at this point in the course are to introduce students\
    \ the idea of a programming statement and to get them to write their first program,\
    \ thereby introducing them to the programming environment. The Python program\
    \ has exactly what is needed to do these things, and nothing more.\n\nComparing\
    \ the explanatory text of program in each version of the book further illustrates\
    \ what this means to the beginning student. There are several paragraphs of explanation\
    \ of Hello, in the Java version; in the Python version, there are only a few.\
    \ Fortunately, the missing few paragraphs do not deal with the big ideas in computer\
    \ programming but with the minutia of Java syntax. I found this thing happening\
    \ throughout the book. While paragraphs disappear in the Python version of the\
    \ text because Python's clearer syntax renders them unnecessary.\n\nUsing a very\
    \ high-level language like Python allows the beginner to postpone talking about\
    \ low level details of the machine until the student has the background that they\
    \ need to make sense of the details. This creates the ability to put first things\
    \ pedagogically. One of the best examples of this is the way which Python handles\
    \ variables. In a variable is a name for a place that holds a value if it is built-in,\
    \ and reference to an object if it is not. Explaining this distinction requires\
    \ a discussion of how the computer stores data. Thus, the idea of a variable is\
    \ bound upon the hardware of the. The powerful and fundamental concept of a variable\
    \ is already difficult enough for students (both computer science and algebra).\
    \ Bytes and addresses do not matter in Python. A variable is a name that refers\
    \ to. This is a far more intuitive concept for beginning students and is much\
    \ closer to the meaning of variable that they learned in their math classes. I\
    \ had much"
