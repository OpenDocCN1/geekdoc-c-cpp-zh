  md: '# CHAPTER

    TWENTY


    # DICTIONARIES


    All of the compound types we have studied in detail so far — strings, lists, and
    tuples — sequence types, which use integers as indices to access the values they
    contain within.


    Dictionaries are yet another kind of compound type. The values are Python’s mapping
    type. They map keys, which can be any immutable, to values, which can be any type
    (heterogeneous), just like the elements of a list or tuple. In other languages,
    they are called associative arrays since they associate a key with a value.


    As an example, we will create a dictionary to translate English words into Spanish.
    For this dictionary, the keys are strings.


    One way to create a dictionary is to start with the empty dictionary and add key:value
    pairs.

    The empty dictionary is denoted {}:


    ```

    >>> eng2sp = {}

    >>> eng2sp["one"] = "uno"

    >>> eng2sp["two"] = "dos"

    ```


    The first assignment creates a dictionary eng2sp; the other assignments add new
    key:value pairs. We can print the current value of the dictionary in the usual
    way:


    ```

    >>> print(eng2sp)

    ("two": "dos", "one": "uno")

    ```


    The key:value pairs of the dictionary are separated by commas. Each pair contains
    a key and a value separated by a comma.


    # Hashing


    The order of the pairs may not be what was expected. Python uses complex algorithms,
    designed for very fast access, to determine where the key:value pairs are stored
    in a dictionary. For our purposes we can think of this as ordering unpredictable.


    You might wonder why we use dictionaries at all when the same concept of mapping
    a key to a value could be implemented using a list of tuples:


    ```

    >>> {\apples": 430, "bananas": 312, "orange": 525, "pears": 217}

    {''pears'': 217, ''apples'': 430, ''orange'': 525, ''bananas'': 312}

    ```'
