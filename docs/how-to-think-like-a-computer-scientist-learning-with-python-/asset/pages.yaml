  md: "# How to Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\nThe answer is no, the i in print_multiples and the i\
    \ in print_mult_table are not the same variable.\n\nVariables created inside a\
    \ function definition are local; you can't access a local variable outside its\
    \ home function. That means you are free to have multiple variables with the same\
    \ name as long as they are not in the same function.\n\nPython examines all the\
    \ statements in a function — if any of assign a value to a variable, that is the\
    \ clause that Python uses to make the variable local.\n\nThe stack diagram for\
    \ this program shows that the two variables named i are not the same variable.\
    \ They refer to different values, and changing one does not affect the other.\n\
    \n![](img/ddd7692255b55d8f3b8797c0ad440f9d_126_0.png)\n\nThe value of i in print_mult_table\
    \ goes from 1 to 6. The next time you through the loop it will be 4. Each time\
    \ through the loop, print_mult_table calls print_multiples with the current value\
    \ of i as an argument. That value gets assigned to the parameter n.\n\nInside\
    \ print_multiples, the value of i goes from 1 to 6. In the diagram, it happens\
    \ to be 2. Changing this variable has no effect on the value of i in print_mult_table.\n\
    \nIt is common and perfectly legal to have different local variables with the\
    \ same name. In particular, names like i and j are used frequently as loop variables.\
    \ If you avoid using them in one function just because you used them somewhere\
    \ else, you will probably make the program harder to read.\n\nThe visualizer at\
    \ http://netserv.ict.ru.ac.za/python3_viz/ shows very clearly how the two variables\
    \ are distinct variables, and how they have independent values.\n\n# 7.15 The\
    \ break statement\n\nThe break statement is used to immediately leave the body\
    \ of the loop. The next statement to be executed is the first one after the body:\n\
    \n```\nfor i in [12, 16, 17, 24, 29]:\n    if i % 2 == 1: # If the number is odd\n\
    \        break # immediately exit the loop\n    print(i)\nprint(\"done\")\n```\n\
    \nThis prints:\n\n```\n12\n16\ndone\n```"
