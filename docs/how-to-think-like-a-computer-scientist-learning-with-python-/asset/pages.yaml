    \ what this chapter is about.\n\n# 5.1 Boolean values and expressions\n\nA Boolean\
    \ value is either true or false. It is named after the British mathematician,\
    \ George Boole, who first formulated Boolean algebra — some rules for reasoning\
    \ about and combining these values. This yields clear computer logic.\n\nIn Python,\
    \ the two Boolean values are True and False (the capitalization must be exactly\
    \ as shown), and the Python type is bool.\n\n```\n>>> type(True)\n<class 'bool'>\n\
    >>> type(true)\nTraceback (most recent call last):\n  File \"interactive input\"\
    , line 1, in <module>\n  NameError: name 'true' is not defined\n```\n\nA Boolean\
    \ expression is an expression that evaluates to a result which is a Boolean value.\
    \ For example, the operator == tests if two values are equal. It produces (or\
    \ yields) a Boolean value:\n\n```\n>>> 5 == (3 + 2)  # Is five equal 5 to the\
    \ result of 3 + 2?\nTrue\n>>> 5 == 6\nFalse\n>>> j = \"hel\"\n>>> j + \"lo\" ==\
    \ \"hello\"\nTrue\n```\n\nIn the first statement, the two operands evaluate to\
    \ equal values, so the expression evaluates to True; in the second statement,\
    \ 5 is not equal to 6, we get False.\n\nThe == operator is one of six comparison\
    \ operators which produce a bool result; here are all six:"
