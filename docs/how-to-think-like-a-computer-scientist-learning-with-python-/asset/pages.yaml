  md: '# CHAPTER

    FIFTEEN

    CLASSES AND OBJECTS — THE

    BASICS


    # 15.1 Object-oriented programming


    Python is an object-oriented programming language, which means that it provides
    features that support object-oriented programming (OOP).


    Object-oriented programming has its roots in the 1960s, but it wasn''t until the
    mid 1980s that it became the main programming paradigm used in the creation of
    new software. It was developed as a way to handle the rapidly increasing size
    and complexity of software systems, and to make it easier to modify these large
    and complex systems over time.


    Up to now, most of the programs we have been writing use a procedural paradigm.
    In procedural programming the focus is on writing functions or procedures which
    operate on data. In object-oriented programming the focus is on the creation of
    objects which contain both data and functionality (We have seen turtle objects,
    strings, and random number generators, to name a few places where we''ve worked
    with objects.)


    Usually, each object definition corresponds to some object or concept in the real
    world, and the functions that operate on that object correspond to the real-world
    objects interact.


    # 15.2 User-defined compound data types


    We''ve already created classes like str, int, float and Turtle. We are now ready
    to create our own user-defined class: the Point.


    Consider the concept of a mathematical point. In two dimensions, a point is two
    numbers (coordinates) that are treated collectively as a single object. Points
    are often written in parentheses with the comma separating the coordinates. For
    example, (0, 0) represents the origin, and (x, y) represents the point x to the
    right and y units up from the origin.


    Some of the typical operations one associates with points is calculating the distance
    of a point from the origin, or from another point, or finding a midpoint of two
    points, or asking if a point falls within a given rectangle or circle. We''ll
    shortly see how we organize these together with the data.'
