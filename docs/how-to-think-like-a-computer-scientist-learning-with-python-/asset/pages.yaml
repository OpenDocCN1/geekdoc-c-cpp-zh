    # ## 11.9 Objects and references


    After we execute these assignment statements


    +   1 a = "banana"

    2 b = "banana"


    we know that a and b will refer to a string object with the letters "banana".
    But we don’t know yet whether they point to the same object.


    There are two ways the Python interpreter could argue its memory:


    ![](img/ddd7692255b55d8f3b8797c0ad440f9d_178_0.png)


    In one case, a and b refer to two different objects that have the same value.
    In the second case, they refer to the same object.


    We can test whether two names refer to the same object using the is operator:


    ```

    >>> a is b

    True

    ```


    This us us both a and b refer to the same object, and that it is the second of
    the two state snapshots that accurately describes the relationship.


    Since strings are immutable, Python optimizes resources by making two names that
    refer to the same string value refer to the same object.


    This is not the case with:


    ```

    >>> a = [1, 2, 3]

    >>> b = [1, 2, 3]

    >>> a == b

    True

    >>> a is b

    False

    ```


    The state snapshot here looks like this:'
