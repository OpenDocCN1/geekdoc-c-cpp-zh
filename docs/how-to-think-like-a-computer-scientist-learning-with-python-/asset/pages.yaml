    decrement Decrease by 1.


    **definite iteration** A loop where we have an upper bound on the number of times
    the body will be executed. Definite iteration is usually best coded as a `for`
    loop.


    **development plan** A process for developing a program. In this chapter, we demonstrated
    a style of developing based on coding to do simple, specific things and then encapsulating
    and generalizing.


    **encapsulate** To divide a large program into components (like functions) and
    isolate the components from each other (using local variables, for example).


    **escape sequence** An escape character, `\`, followed by one or more printable
    characters used to designate a nonprintable character.


    **generalize** To replacing unnecessarily specific (like a constant value) with
    something appropriately general (like a variable or parameter). Generalization
    makes code more versatile, more likely to be reused, and even easier to write.


    **increment** Both as a noun and as a verb, increment means increase by 1.


    **infinite loop** A loop in which the terminating condition is never satisfied.


    **indefinite iteration** A loop where we just need to keep going until some condition
    is met. A `while` statement is used for this case.


    **initialization (of a variable)** To initialize a variable is to give it an initial
    value. Since in Python variables do not exist until they are assigned values,
    they are initialized when they are created. In other programming languages this
    is not the case, and variables can be created without being initialized, in which
    case they have either default or `garbage` values.


    **iteration** Repeated execution of a set of programming statements.


    **loop** The construct that allows us to repeatedly execute a statement or a group
    of statements until a terminating condition is satisfied.


    **loop variable** A variable used as for the terminating condition of a loop.


    **meta-notation** Extra symbols or notation that describes other notation. Here
    we introduced square brackets, ellipses, italics, and as meta-notation to describe
    optional, repeatable, substitutable and fixed parts of the Python syntax.


    **middle-test loop** A loop that executes some of the body, tests for the exit
    condition, and may execute more of the body. We don''t have a special Python construct
    for this case, but can use `while` and `break` together.


    **nested loop** A loop inside the body of another loop.


    **newline** A special character that causes the cursor to move to the beginning
    of the next line.


    **post-test loop** A loop that executes the body, tests for the exit condition.
    We don''t have a special Python construct for this, but can use `while` and `break`
    together.


    **pre-test loop** A loop that tests before deciding whether to execute its body,
    for `for` and `while` are both pre-test loops.'
