    \ Release 3rd Edition\n\n# 16.3 Sameness\n\nThe meaning of the word \"same\" seems\
    \ perfectly clear until we give it some thought, and we realize there is more\
    \ than we initially expected.\n\nFor example, if we say, \"Alice and Bob have\
    \ the same car\", we mean that her car and his are the same make and model, but\
    \ that are two different cars. If we say, \"Alice and Bob have the same mother\"\
    , we mean that her mother and his is the same person.\n\nWhen we talk about objects,\
    \ there is a similar ambiguity. For example, if two Points are the same, does\
    \ that mean they contain the same data (coordinates) or are they actually the\
    \ same object?\n\nWe've already seen the is operator in lists, where we talked\
    \ about aliases; it allows us to find out if two references refer to the same\
    \ object:\n\n```\n>>> p1 = Point(3, 4)\n>>> p2 = Point(3, 4)\n>>> p1 is p2\nFalse\n\
    ```\n\nEven though p1 and p2 contain the same coordinates, they are not the same\
    \ object. If we assign p1 to p3, the two variables are aliases of the same object:\n\
    \n```\n>>> p3 = p1\n>>> p1 is p3\nTrue\n```\n\nTo compare the contents of the\
    \ objects — deep equality — we can write a function called same_coordinates:\n\
    \n```\ndef same_coordinates(p1, p2):\n    return (p1.x == p2.x) and (p1.y == p2.y)\n\
    ```\n\nNow if we create two objects that contain the same data, we can use same_point\
    \ to find out if they represent points with the same coordinates.\n\n```\n>>>\
    \ p1 = Point(3, 4)\n>>> p2 = Point(3, 4)\n>>> same_coordinates(p1, p2)\nTrue\n\
    ```\n\nOf course, if the two variables refer to the same object, they have both\
    \ shallow and deep equality.\n\nBeware of ====\n\n“When I use a word,” Humpty\
    \ Dumpty said, in a rather scornful tone, “it means just what I choose to mean\
    \ — neither more nor less.” Alice in Wonderland"
