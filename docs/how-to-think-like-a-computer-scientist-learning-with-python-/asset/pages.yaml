  md: '# CHAPTER

    NINETEEN


    # EXCEPTIONS


    # 19.1 Catching exceptions


    Whenever a runtime error occurs, it creates an exception object. The program stops
    running at this point and Python prints out the traceback, which ends with a message
    describing the exception that occurred.


    For example, dividing by zero creates an exception:


    ```

    >>> print(5/0)

    Traceback (most recent call last):

    File "<interactive input", line 1, in <module>

    ZeroDivisionError: integer division or modulo by zero

    ```


    So does accessing a non-existent list item:


    ```

    >>> a = []

    >>> print(a[5])

    Traceback (most recent call last):

    File "<interactive input", line 1, in <module>

    IndexError: list index out of range

    ```


    Or trying to make an item assignment on a tuple:


    ```

    >>> tuple = ("a", "b", "d", "d")

    >>> tuple[2] = "c"

    Traceback (most recent call last):

    File "<interactive input", line 1, in <module>

    TypeError: ''tuple'' object does not support item assignment

    ```


    In each case, the message on the line has two parts: the type of error before
    the colon, and specifics about the error after the colon.


    Sometimes we want to execute an operation that might cause an exception, but we
    don''t want the program to stop. We handle the exception using the try statement
    to “wrap” a region of code.


    For example, we might prompt the user for the name of a file and then to open
    it. If the file doesn''t exist, we don''t want the program to crash; we want to
    handle the exception:'
