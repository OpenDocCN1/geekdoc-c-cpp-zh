  md: "# # How to Think Like a Computer Scientist: Learning with Python 3 Documentation,\
    \ Release 3rd Edition\n\nThe initialization method, `is_empty`, and `insert` are\
    \ all veanners on list operations. The only interesting method is remove:\n\n\
    ```\nclass PriorityQueue:\n    ..\n    def remove(self):\n        max = 0\n  \
    \      for i in range(1, len(self.items)):\n            if self.items[i] > self.items[max]:\n\
    \                max = i\n        item = self.items[max]\n        del self.items[max]\n\
    \        return item\n```\n\nAt the beginning of iteration, max holds the index\
    \ of the biggest item (highest priority) we have seen *so far*. If the new item\
    \ is bigger, the value of max is set to i.\n\nWhen the `for` statement completes,\
    \ `max` is the index of the biggest item. This item is removed from the list and\
    \ returned.\n\nLet's test the implementation:\n\n```\n>>> q = PriorityQueue()\n\
    >>> for num in [11, 12, 14, 13]:\n    ...\n    q.insert(num)\n    ...\n>>> while\
    \ not q.is_empty():\n    print(q.remove())\n    ...\n```\n\nIf the queue contains\
    \ simple numbers or strings, they are removed in numerical or alphabetical order,\
    \ from highest to lowest. Python can find the biggest integer or string because\
    \ it can compare them using the built-in comparison operators.\n\nIf the queue\
    \ contains an object type, it has to provide a `__gt__` method. When `remove`\
    \ uses the `>` operator to compare items, it invokes the `__gt__` method for one\
    \ of the items and passes the other as a parameter. As long as the `__gt__` method\
    \ works correctly, the Priority Queue will work.\n\n#  26.6 The Golfer class\n\
