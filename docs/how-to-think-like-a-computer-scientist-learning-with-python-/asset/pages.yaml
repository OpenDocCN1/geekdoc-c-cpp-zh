  md: "# How to Think Like a Computer Scientist: Learning with Python 3 Documentation,\
    \ Release 3rd Edition\n\n# 20.4 Sparse matrices\n\nWe previously used a list of\
    \ lists to represent a matrix. That is a good choice for a matrix with mostly\
    \ nonzero values, but consider a sparse matrix like this one:\n\n```\n[[0 0 1\
    \ 0]\n[0 0 0 0]\n[0 2 0 0]\n[0 0 0 0]\n[0 0 0 3]]\n```\n\nThe list representation\
    \ contains a list of zeros:\n\n```\nmatrix = [[0, 0, 0, 1],\n           [0, 0,\
    \ 0, 0],\n           [0, 2, 0, 0],\n           [0, 0, 0, 0]]\n```\n\nAn alternative\
    \ is a dictionary. For the keys, we can use tuples that contain the row and column\
    \ numbers. Here is the dictionary representation of the matrix:\n\n```\n>>> matrix\
    \ = ((0, 3): 1, (2, 1): 2, (4, 3): 3)\n```\n\nWe only need three key:value pairs,\
    \ for each nonzero element of the matrix. Each key is a tuple, and each value\
    \ is an integer.\n\nTo access an element of the matrix, we could use the [] operator:\n\
    \n```\n>>> matrix[(0, 3)]\n1\n```\n\nNotice that the syntax for the dictionary\
    \ representation is not the same as the syntax for the nested list representation.\
    \ Instead of two integer indices, we use one index, which is a tuple of integers.\n\
    \nThere is one problem. If we specify an element that is zero, we get an error,\
    \ because there is no entry in the dictionary with that key:\n\n```\n>>> matrix[(1,\
    \ 3)]\nKeyError: (1, 3)\n```\n\nThe get method solves this problem:\n\n```\n>>>\
    \ matrix.get((0, 3), 0)\n1\n```\n\nThe first argument is the key, the second argument\
    \ is the value the get should return if the key is not in the dictionary:\n\n\
    ```\n>>> matrix.get((1, 3), 0)\n0\n```\n\nget definitely improves the semantics\
    \ of accessing a sparse matrix. Shame about the syntax.\n\n# 20.4. Sparse matrices"
