    # A.9 When I run the program I get an exception.


    If something goes wrong during runtime, Python prints a message that includes
    the name of the exception, the line of the program where the problem occurred,
    and a traceback.


    Put a breakpoint on the line causing the exception, and look around!


    The traceback identifies the function that is currently running, and then the
    function that invoked it, and the function that invoked *that*, and so on. In
    other words, it traces the path of function invocations that got to where you
    are. It also includes the line number in your file each of these calls occurs.


    The first step is to examine the place in the program where the error occurred
    and see if you can figure out what happened. These are some of the most common
    runtime errors:


    **NameError** You are trying to use a variable that doesn''t exist in the current
    environment. Remember that local variables are local. You cannot refer to them
    from outside the function where they are defined.


    **TypeError** There are several possible causes:


    +   1. You are trying to use a value improperly. Example: indexing a string, list,
    or tuple with something other than an integer.


    +   2. There is a mismatch between the items in a format string and the items
    passed for conversion. This can happen if either of the items does not match or
    an invalid conversion is called for.


    +   3. You are trying the wrong number of arguments to a function or method. Look
    at the method definition and check that the first parameter is *self*. Then look
    at the method invocation; make sure you are invoking the method on an object with
    the right type and providing the other arguments correctly.


    **KeyError** You are trying to access an element of a dictionary using a key value
    that the dictionary does not contain.


    **AttributeError** You are trying to access an attribute or method that does not
    exist.


    **IndexError** The index you are using to access a list, string, or tuple is greater
    than its length minus one. Immediately before the site of the error, add a `print`
    statement to display the value of the index and the length of the sequence. Is
    the sequence the right size?


    # A.10 Added so many print statements I get inundated with output.


    One of the problems with using `print` statements for debugging is that you can
    end buried in output. There are two ways to proceed: simplify the output or simplify
    the program.


    To simplify the output, you can remove or comment out `print` statements that
    aren''t helping, or combine them, or format the output so it is easier to understand.


    # A.9. When I run the program I get an exception.'
