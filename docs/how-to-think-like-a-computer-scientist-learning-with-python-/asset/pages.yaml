    def find(strng, ch, start=0, end=None):\n    ix = start\n    if end is not None:\n\
    \        end = len(strng)\n    while ix < end:\n        if strng[ix] == ch:\n\
    \            return ix\n        ix += 1\n    return -1\n```\n\nThe optional value\
    \ for end is ending: we give it a default value None if the caller does not supply\
    \ any argument. In the body of the function we test end, and we reassign end to\
