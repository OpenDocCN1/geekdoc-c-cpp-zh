    \ method on the handle, shown in lines 2, 3 and 4\nabove. In bigger programs,\
    \ lines 2–4 will usually be replaced by a loop that writes many more\nlines into\
    \ the file.\n\nClosing the file (line 5) tells the system that we are done writing\
    \ and makes the disk file\navailable for reading by other programs (or by our\
    \ own program).\n\n# A handle is something like a TV remote control\n\nWe're all\
    \ familiar with a remote control for a TV. We perform operations on the\nremote\
    \ control — switch channels, change the volume, etc. But the real action\nhappens\
    \ on the TV. So, by simple analogy, we call the remote control our `handle`\n\
    the underlying TV.\n\nSometimes we want to emphasize the difference — the file\
    \ is not the same\nas, and the remote control is not the same as the TV. But at\
    \ other times\nine prefer to treat them as a single mental chunk, or abstraction,\
    \ and we'll just say\n\"close the file\", or \"flip the TV channel\".\n\n# 13.3\
    \ Reading a file line-at-a-time\n\nNow that the file exists on our disk, we can\
    \ open it, this time for reading, and read all the lines\nin one file, at a time.\
    \ This mode is \"r\" for reading:\n\n```\nmyhandle = open(\"test.txt\", \"r\"\
    ) # Keep reading forever\nwhile True:\n    theline = myhandle.readline() # Try\
