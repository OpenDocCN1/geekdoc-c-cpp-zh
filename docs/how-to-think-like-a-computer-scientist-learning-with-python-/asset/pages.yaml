  md: '# CHAPTER

    TWENTYSIX


    # QUEUES


    This chapter presents two ADTs: the Queue and the Priority Queue. In real life,
    a queue is a line of people waiting for something. In most cases, the first person
    in line is the next to one. There are exceptions, though. At airports, people
    whose flights are leaving soon are sometimes taken from the middle of the queue.
    At supermarkets, a polite person might let someone with a few items in front of
    them.


    The rule that determines who goes next is called the queuing policy. The simplest
    queueing policy is “First in, First out”, FIFO for short. The most general queueing
    policy is priority queueing, in which each person is assigned a priority and the
    person with the highest priority goes first, regardless of the order of arrival.
    We say this is the most general policy because the priority can be based on anything:
    what time a flight leaves; how many groceries the person has; or how important
    the person is. Of course, not all queueing policies are fair, fairness is in the
    eye of the beholder.


    The Queue ADT and the Priority Queue ADT have the same set of operations. The
    difference is in the semantics of the operations: a queue uses the FIFO policy;
    and a priority queue (as the name suggests) uses the priority queueing policy.


    # 26.1 The Queue ADT


    The Queue ADT is defined by the following operations:


    +   - __init__ Initialize a empty queue.


    +   - insert Add a new item to the queue.


    +   - remove Remove and return an item from the queue. The item that is returned
    is the first one that was added.


    +   - is_empty Check whether the queue is empty.


    # 26.2 Linked Queue


    The first implementation of the Queue ADT we will look at is called a linked queue
    because it is made up of linked Node objects. Here is the class definition:'
