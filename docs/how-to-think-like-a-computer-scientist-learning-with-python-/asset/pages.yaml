    Here are some How to think like a computer scientist observations:


    +   - There are 360 degrees in a full circle. If we add up all the turns that
    a turtle makes, no matter what steps occurred between the turns, we can easily
    figure out if they add up to some multiple of 360. This should convince you that
    alex is facing exactly the same direction as he was when he was first created.
    (Geometry conventions have 0 degrees facing East, and that is case here!)

    - We could have left out the last turn for alex, but that would not have been
    satisfying. If we were to draw a closed shape like a square or a rectangle, it
    is a good idea to complete all the turns and to leave the turtle back where it
    started, facing the same direction as it started in. This makes reasoning through
    the program and composing chunks of code easier for us humans!

    - We did the same with tess: she drew the triangle and turned through a full 360
    degrees. We then turned around and moved away. Even the blank line 18 is a hint
    about how the programmer''s mental chunking is working: in big terms, tess'' movements
    were chunked as "draw the triangle" (lines 12-17) and then "move away from the
    origin" (lines 19 and 20).

    - One of the key things is to record our mental chunking, and big ideas. They''re
    not always explicit in the code.

    - And, uh-huh, two turtles may not be enough for a herd. The important idea is
    that the turtle module gives us a kind of factory that lets us create as many
    turtles as we need. Each instance has its own state and behaviour.


