    \ Release 3rd Edition\n\n# The Collatz 3n + 1 sequence\n\nLet's look at a simple\
    \ sequence that has fascinated and mathematicians for many years. They still cannot\
    \ answer quite simple questions about this.\n\nThe “computational rule” for creating\
    \ the sequence is to start from some n, and to generate the next term of the sequence\
    \ from n, either by halving n (whenever n is even), or else by multiplying it\
    \ by 2 and adding 1. The sequence terminates when n reaches 1.\n\nThis Python\
    \ function performs that:\n\n```\ndef seq3npl(n):\n    \"\"\"Print the 3n+1 sequence\
    \ from n,\n    terminating when it reaches 1.\n    \"\"\"\n    while n != 1:\n\
    \        print(n, end=\"\")\n        if n % 2 == 0: # n is even\n            n\
    \ = n // 2\n        else: # n is odd\n            n = n * 3 + 1\n        print(n,\
    \ end=\"\\n\")\n```\n\nNotice first that the print function on line 6 has an extra\
    \ argument=\", \". This tells the print function to follow the string with whatever\
    \ the programmer chooses (in this case, a comma followed by a space), instead\
    \ of ending the line. So every time something is printed in the loop, it is printed\
    \ on the same output line, with numbers separated by commas. The call to print(n,\
    \ end=\"\\n\") at line 11 the loop terminates when the final value of n followed\
    \ by a period and a newline character. (You'll see the \\n (newline character)\
    \ in the next chapter).\n\nThe condition for this loop is n != 1, i.e n == 1.\
    \ so the loop will continue until it reaches its termination condition,\n\nEach\
    \ time the loop runs, the program outputs the value of n and then checks whether\
    \ it is even or odd. If it is even, the n is divided by 2 using integer division.\
    \ If it is odd, the value is replaced by n * 3 + 1. Here are some examples:\n\n\
    ```\n>>> seq3npl(3)\n3, 10, 5, 16, 8, 4, 2, 1.\n>>> seq3npl(19)\n19, 58, 29, 88,\
    \ 44, 22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1.\n>>> seq3npl(21)\n\
    21, 64, 32, 16, 8, 4, 2, 1.\n>>> seq3npl(16)\n16, 8, 4, 2, 1.\n>>>\n```\n\nSince\
    \ n increases and decreases, there is no proof that n will ever reach 1, or that\
    \ the program terminates. For some particular values of n, we can prevent termination.\
