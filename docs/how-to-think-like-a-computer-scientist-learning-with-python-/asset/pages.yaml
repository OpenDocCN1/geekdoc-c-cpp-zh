    # 7.20 Functions


    A few times now, we have mentioned all the functions are good. By now, you might
    be wondering what those things are. Here are some of them:


    +   1. Capturing your mental chunk. Breaking your complex tasks into sub-tasks,
    giving the sub-tasks a meaningful name is a powerful mental technique. Look back
    at the example that illustrated the post-test: we assumed that we had a function
    `play_the_game_once`. This chunking allowed us to put aside the details of the
    particular game — it is a card game, or nought crosses, or a role playing game
    — letting the player choose whether they want to play.

    2. Dividing a long program into functions allows you to separate parts of the
    program, debug them in isolation, and then compose them into a whole.

    3. Functions facilitate the use of iteration.


