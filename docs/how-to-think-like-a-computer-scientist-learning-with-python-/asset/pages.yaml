    # ## 15.5 Adding other methods to our class


    The key advantage of using a class Point rather than a simple tuple (6, 7) now
    becomes apparent We can add methods to the Point class that are sensible operations
    for points, but may not be appropriate for other tuples like (25, 12) which might
    represent, say, day and month, e.g. Christmas day. So being able to calculate
    the distance from the origin is sensible for points, but not for data (day, month
    data). We''d like different operations to find which day of the week it will fall
    in 2020.


    Creating a class Point brings an essential amount of "organizational power" to
    our programs, and to our thinking We can group together the sensible operations,
    and the kinds of data they apply to, and each instance of the class has its own
    state.


    > A method behaves like a function but it is invoked on a specific instance, e.g.
    tess.right(90). Like a data attribute, methods are accessed using dot notation.


    Let''s add another method, distance_from_origin, to see better how methods work:


    ```

    1 class Point:

    2   """ Create a new Point, at coordinates x, y """

    4

    5   def __init__(self, x=0, y=0):

    6      """ Create a new point at x, y """

    7      self.x = x

    8      self.y = y\9

    10 def distance_from_origin(self):

    11   """ Compute my distance from the origin """

    12   return ((self.x ** 2) + (self.y ** 2)) ** 0.5

    ```


