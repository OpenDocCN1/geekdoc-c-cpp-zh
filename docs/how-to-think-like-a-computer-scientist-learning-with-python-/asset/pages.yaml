    is to redraw from scratch on every iteration of the game. The first thing we do
    at line 24 fills the entire surface with a background color. The fill method of
    a surface takes two arguments — the color for filling, and the rectangle to be
    filled. But the second argument is optional, and if it is left out the entire
    surface is filled.

