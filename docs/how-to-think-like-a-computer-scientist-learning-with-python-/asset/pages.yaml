  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    **modifier** A function which changes its arguments inside the function body.
    Only mutable types can be changed by modifiers.


    **mutable data** A value which can be modified. The types of all mutable values
    are compound types. Lists and dictionaries are mutable; strings and tuples are
    not.


    **nested list** A list that is an element of another list.


    **object** A thing to which a variable can refer.


    **pattern** A sequence of statements, or a style of coding that has general applicability
    in a number of different situations. Part of becoming a mature Computer Scientist
    is to learn and establish the patterns and algorithms that form your toolkit.
    Patterns often correspond to your "mental chunking".


    **promise** An object that promises to do some work or deliver values if they''re
    eventually needed, but it lazily pulls off the work immediately. Calling range
    produces a promise.


    **pure function** A function that has no side effects. Pure functions only make
    changes to the calling function through their return values.


    **sequence** Any of the data types that consist of an ordered collection of elements,
    with each element identified by an index.


    **side effect** A change in the state of a program made by calling a function.
    Side effects can only be produced by modifiers.


    **step size** The interval between successive elements of a linear sequence. The
    third (and optional argument) to the **range** function is called the step size.
    If not specified, it defaults to 1.


