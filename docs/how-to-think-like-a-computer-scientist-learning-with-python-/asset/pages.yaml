  md: "# # How to Think Like a Computer Scientist: Learning with Python 3\nDocumentation,\
    \ Release 3rd Edition\n\n# ## 2.4 Comparing cards\n\nFor primitive types, there\
    \ are six relational operators (<, >, =, etc.) that compare values and determine\
    \ when one is greater than, less than, or equal to another. If we want our own\
    \ types to be comparable using the syntax of these relational operators, we need\
    \ to define six special methods in our class.\n\nWe'd like to start with a simple\
    \ method `cmp` which handles the logic of ordering. By convention, a comparison\
    \ method takes two parameters, `self` and `other`, and returns 1 if the first\
    \ object is greater, -1 if the second object is greater, and 0 if they are equal\
    \ to each other.\n\nSome types are completely ordered, which means we can compare\
    \ any two elements and tell which is bigger. For example, the integers and the\
    \ floating-point numbers are completely ordered. Some types are unordered, where\
    \ there is no meaningful way to say that one element is bigger than another. For\
    \ example, the fruits are unordered, which is why we cannot compare apples and\
    \ oranges, and we cannot merge a collection of cellphones.\n\nPlaying cards are\
    \ partially ordered, which means that we can compare cards and sometimes not.\
    \ For example, we know that the 3 of Clubs is higher than the 2 of Clubs, and\
    \ the 3 of Diamonds is higher than the 3 of Clubs. But which is better, the 3\
    \ of Clubs or the 2 of Diamonds? One has a higher rank, but the other has a higher\
    \ suit.\n\nIn order to make cards comparable, we have to decide which is more\
    \ important, rank or suit. To be honest, the choice is arbitrary. For sake of\
    \ choosing, we will say that suit is more important, because a new deck of cards\
    \ comes with all the Clubs, followed by all the Diamonds, and so on.\n\nWith that\
    \ decided, we can write `cmp`:\n\n```\ndef cmp(self, other):\n    # Check the\
    \ suits\n    if self.suit > other.suit: return 1\n    if self.suit < other.suit:\
    \ return -1\n    # Suits are the same... check ranks\n    if self.rank > other.rank:\
    \ return 1\n    if self.rank < other.rank: return -1\n    # Ranks are the same...\
    \ it's a tie\nreturn 0\n```\n\nIn this ordering, Aces appear lower than Deuces\
    \ (2s).\nNow, we can define the special methods that do the overloading of each\
    \ relational operators for us:\n\n```\ndef __eq__(self, other):\n    return self.cmp(other)\
    \ == 0\n\ndef __le__(self, other):\n    return self.cmp(other) <= 0\n\ndef __ge__(self,\
    \ other):\n```"
