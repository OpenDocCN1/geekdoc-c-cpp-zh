  md: '# # How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3rd Edition


    ```

    5 return True

    6 return False

    ```


    This "eureka", or "short-circuit" style of returning from a function as soon as
    we are certain

    what the outcome will be first seen in Section 8.10, in the chapter on strings.


    It is preferred over this one, which also works correctly:


    ```

    1 def any_odd(xs):

    2     """Return True if there is an odd number in xs, a list of integers."""

    3     count = 0

    4     for v in xs:

    5         if v % 2 == 1:

    6             count += 1  # Count the odd numbers

    7     if count > 0:

    8         return True

    9     else:

    10        return False

    ```


    The performance disadvantage of this one is that it traverses the whole list,
    even if it knows the

    outcome very early on.


    > **Tip: Think about the return conditions of the function**

    nDo I need to look at all elements in all cases? Can I shortcut and take an early
    exit? Under

    what conditions? When will I have to examine all the elements in the list?


    The code in lines 7-10 can also be tightened. The expression count > 0 evaluates
    to

    a Boolean value, either True or False. The value can be used directly in the return

    statement. We could cut that out and show the following:


    ```

    1 def any_odd(xs):

    2     """Return True if there is an odd number in xs, a list of integers."""

    3     count = 0

    4     for v in xs:

    5         if v % 2 == 1:

    6             count += 1  # Count the odd numbers

    7     return count > 0  # Aha! a programmer who understands that Boolean

    8                      expressions are not just used in if statements!

    ```


    Although this code is tighter, it is not as nice as the one that did short-circuit
    return as soon

    as the first number was found.


    > **Tip: Generalize your use of Booleans**

    nMature programmers won''t use is_prime(n) == True: when they could say-

    stead if is_prime(n) : Think generally about Boolean values, not just in the context

    of if or while statements. Arithmetic expressions, which have their own set of
    operators

    and, or not) and values (True, False) can be assigned to variables, into lists,

    etc. A good resource for improving your use of Booleans is http://cn.wikibooks.org/wiki/Non-Programmer%27s_Tutorial_for_Python_3/Boolean_Expressions


    # **E.1. Functions**'
