    #  7.24 Algorithms


    Newton''s method is an example of an algorithm: it is a mechanical process for
    solving a category of problems (in this case, square roots).


    Some kinds of knowledge are not algorithmic. For example, learning dates from
    history or your multiplication tables involves memorization of specific solutions.


    But the techniques you learned for carrying, subtraction with borrowing, and long
    division are all algorithms. If you are an avid Sudoku puzzle solver, you might
    have some specific set of steps that you always follow.


    One of the characteristics of algorithms is that they do not require any intelligence
    to carry out. They are mechanical processes in which each step follows from the
    last to a simple set of rules. And they''re designed to solve a general category
    of problems, not just a single problem.


    Understanding that hard problems can be solved by step-by-step algorithmic processes
    (and having technology to execute these algorithms for us) is one of the major
    breakthroughs that have had enormous benefits. While the execution of the algorithm
    may be boring and may require no intelligence, algorithmic or computational thinking
    — i.e. using algorithms and automation as the basis for processing approaches
    — rapidly transforming our society. Some claim that this shift towards algorithmic
    thinking is going to have even more impact on our society than the invention of
    the printing press. And the process of designing algorithms is interesting, intellectually
    challenging, and a central part of what we call.


    Some of the things people do naturally, without difficulty or conscious thought,
    are the hardest to explain algorithmically. Understanding natural language is
    a good example. We all do it, but far no one has been able to explain how we do
    it, at least not in the form of a step-by-step mechanical algorithm.


    #  7.25 Glossary


    +   **algorithm** A step-by-step process for solving a category of problems.


    +   **body** The statements inside a loop.


    +   **breakpoint** A place in your program code where program execution will pause
    (or break), allowing you to inspect the state of the program''s variables, or
    single-step through individual variables, executing them one at a time.


    +   **bump** Programmer slang. Synonym for increment.


    +   **continue** A statement that causes the remainder of the current iteration
    of a loop to be skipped. The flow of execution goes back to the top of the loop,
    evaluates the condition, and if this is true the next iteration of the loop will
    begin.


    +   **counter** A variable used to count something, usually initialized to zero
    and incremented in the body of a loop.


    +   **cursor** An invisible marker that keeps track of where the next character
    will be printed.'
