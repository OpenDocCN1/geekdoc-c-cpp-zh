    \        break # leave the loop\n    # Now process the line we've just read\n\
    \    print(theline, end=\"\")\n```\n\nmyhandle.close()\n\nThis is a pattern for\
    \ today. In bigger programs, we squeeze more extensive logic\\into the body of\
