    Python has a powerful feature that allows a designer of a class to decide what
    an operation == should mean. (We''ve just shown how we can control how our objects
    are converted to strings, so we''ve made a start!) We''ll cover more detail later.
    But sometimes the implementors allow shallow equality semantics, and sometimes
    deep equality, as shown in this experiment:


    ```

    p = Point(4, 2)

    s = Point(4, 2)

    print("== on Points returns", p == s)

    # By default, == on Point objects does a shallow equality

    a = [2, 3]

    b = [2, 3]

    print("== on lists returns", a == b)

    # But by default, == does a deep equality test on lists

    ```


    ```

    == Points returns False

    == on lists returns True

    ```


    So we conclude that even though the two lists (or tuples, etc.) are distinct objects
    with different memory addresses, for lists the == operator tests for deep equality,
    while in the case of points it makes a shallow test.


    # 16.4 Copying


    Aliasing can make a program difficult to read because changes made in one place
    might have unexpected effects in another place. It is hard to keep track of all
    the variables that might refer to a given object.


    Copying an object is often an alternative to aliasing. The copy module contains
    a function copy that can duplicate any object:


    ```

    >>> import copy

    >>> p1 = Point(3, 4)

    >>> p2 = copy.copy(p1)

    >>> p1 is p2

    False

    >>> same_coordinates(p1, p2)

    True

    ```


    Once we import the copy module, we can use the copy function to make a new Point.
    p1 and p2 are not the same object, but they contain the same data.


    To copy a simple object like a Point, which doesn''t contain any embedded objects,
    copy is sufficient.


    For something like a Rectangle, which contains a reference to a Point, copy doesn''t
    quite the right thing. It copies the reference to the Point object, so both the
