  md: '# CHAPTER

    TWENTY-THREE


    # INHERITANCE


    # 23.1 Inheritance


    The language feature most often associated with object-oriented programming is
    inheritance. Inheritance is the ability to define a new class that is a modified
    version of an existing class.


    The primary advantage of this feature is that you can add new methods to a class
    without modifying the existing class. It is called inheritance because the new
    class inherits all of the methods of the existing class. Extending this metaphor,
    the existing class is sometimes called the parent class. The new class may be
    called the child class or subclasses.


    Inheritance is a powerful feature. Some programs that would be complicated without
    inheritance can be written concisely and simply with it. Also, inheritance can
    facilitate code reuse, since you can customize the behavior of classes without
    having to modify them. In some cases, the inheritance structure reflects the natural
    structure of the problem, which makes the program easier to understand.


    On the other hand, inheritance can make programs difficult to read. When a method
    is invoked, it is not clear where to find its definition. The relevant code can
    be scattered across several modules. Also, many of the things that can be done
    using inheritance can be done elegantly (or more so) without it. If the natural
    structure of the problem does not lend itself to inheritance, this style of programming
    can do more harm than gain.


    In this chapter we will demonstrate the use of inheritance as part of a program
    that plays the game Old Maid. One of our goals is to write code that could be
    reused to implement other card games.


    # 23.2 A hand of cards


    For any card game, we need to represent a hand of cards. A hand is similar to
    a deck, of course. Both are made up of a set of cards, and both require operations
    like adding and removing cards. Also, we might like the ability to shuffle decks
    and hands.


    A hand is also different from a deck. Depending on the game being played, we might
    want to perform some operations on hands that don''t make sense for a deck. For
    example, in poker'
