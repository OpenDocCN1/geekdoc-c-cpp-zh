    # 25.8 Clients and providers


    One of the fundamental goals of the ADT is to separate the interests of the provider,
    who writes

    t code that implements the ADT, and the client, who uses the ADT. The provider
    only has

    to worry about whether the implementation is correct — in accord with the specification
    of the

    ADT — and how it will be used.


    Conversely, the client assumes that the implementation of the ADT is correct and
    doesn''t worry

    out the details. When you are using one of Python’s built-in types, you have the
    luxury of

    thinking exclusively as a client.


    Of course, when you implement an ADT, you also have to write client code to test
    it. In that

    case, you play both roles, which can be confusing. You should make some effort
    to keep track

    of which role you are playing at any moment.


    # 25.9 Glossary


    **abstract data type (ADT)** A data type (usually a collection of objects) that
    is defined by a set

    of operations but can be implemented in a variety of ways.


    **client** A program (or the person who wrote it) uses an ADT.


    **delimiter** A character that is used to separate tokens, such as punctuation
    in a natural language.


    **generic data structure** A kind of data structure that can contain data of any
    type.


    **implementation** Code that satisfies the syntactic and semantic requirements
    of an interface.


    **interface** The set of operations that define an ADT.


    **infix** A way of writing mathematical expressions with the operators between
    the operands.


    **parse** To read a string of characters or tokens and analyze its grammatical
    structure.


    **postfix** A way of writing mathematical expressions with the operators after
    the operands.


    **provider** The code (or the person who wrote it) implements an ADT.


    **token** A set of characters that are treated as a unit for purposes of parsing,
    such as the words

    in a natural language.


    **veneer** A class definition that implements an ADT with method definitions that
    are invocations

    of other methods, sometimes with simple transformations. The veneer does no significant

    work, but it improves or standardizes the interface seen by the client.'
