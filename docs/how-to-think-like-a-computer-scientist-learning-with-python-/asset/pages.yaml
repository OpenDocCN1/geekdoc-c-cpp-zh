    \ would be a sprite, the player would be a sprite, and bullets and bombs would\
    \ all be sprites.\n\nObject oriented programming (OOP) is ideally suited to a\
    \ situation like this: each object can have its attributes and internal state,\
    \ and a couple of methods. Let's have some fun with our N queens board. Instead\
    \ of placing the queen in our final position, we de drop her in from the top of\
    \ the board, and let her fall into position, bouncing along the way.\n\nThe first\
    \ encapsulation we need is to turn each of our queens into an object. We'll keep\
    \ a list of all the active sprites (i.e. a list of objects), and arrange two new\
    \ things in our game loop:\n\n+   - After handling events, before drawing, we\
    \ call an `update` method on every sprite. This will give each sprite a chance\
    \ to modify its internal state in some way—perhaps change its image, change its\
    \ position, or rotate itself, or make it grow a bit bigger or a bit smaller.\n\
    - Once all the sprites have updated themselves, the game loop can begin drawing\
    \ - first the background, and then call a `draw` method on each sprite in turn,\
    \ and delegate (hand off)"
