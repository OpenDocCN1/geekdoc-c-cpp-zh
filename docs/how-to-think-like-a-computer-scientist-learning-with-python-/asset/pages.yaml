  md: '# SOME TIPS, TRICKS, AND COMMON ERRORS


    These are small summaries of ideas, tips, and commonly seen errors that might
    be helpful to those beginning Python.


    # E.1 Functions


    Functions help us with our mental chunking: they allow us to group together statements
    for a high-level purpose, e.g. a function to sort a list of items, a function
    to make the turtle draw a spiral, or a function to compute the mean and standard
    deviation of some measurements.


    There are two kinds of functions: fruitful, value-returning functions, which allow
    us to calculate and return a value, and we use them we''re primarily interested
    in the value they''ll return. Void (non-fruitful) functions are used because they
    perform actions that we want done — e.g. make a turtle draw a rectangle, or print
    the first thousand prime numbers. Always return None


    **Tip:** None is not a string


    Values like None, True and False are not strings; they are special values in Python,
    and are in the list of keywords we have in chapter 2 (Variables, expressions,
    and statements). Keywords are special in the language: they part of the syntax.
    We cannot create our own variable or function with a name True — we''ll get a
    syntax error. (Built-in functions are not privileged keywords: we can define our
    own variable or function len, but we''d be silly to do so!)


    Along with the fruitful/void families of functions, there are two flavors of the
    return statement in Python: one that returns a useful value, and the other that
    returns nothing, None. And if we get to the end of any function and we have not
    explicitly executed any return statement, Python automatically returns the value
    None.


    **Tip:** Understand what the function needs to return'
