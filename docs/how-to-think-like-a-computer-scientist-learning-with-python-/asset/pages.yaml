  md: '# How to Think Like a Computer Scientist: Learning with Python 3

    Documentation, Release 3 Edition


    Many Python types come with a built-in function to convert values of another

    type into its own type. The int function, for example, takes any value and converts
    it to an

    integer, if possible, or complains otherwise:


    ```

    >>> int("32")

    32

    >>> int("Hello")nValueError: invalid literal for int() with base 10: ''Hello''

    ```


    int can convert floating-point values to integers, but remember that it truncates
    the frac-

    tional part:


    ```

    >>> int("-2.3")

    -2

    >>> int(3.99999)

    3

    >>> int("42")

    42

    >>> int(1.0)

    1

    ```


    The float function converts integers and strings to floating-point numbers:


    ```

    >>> float("32")

    32.0

    >>> float("3.14159")

    3.14159

    >>> float(1)

    1.0

    ```


    It may seem odd that Python distinguishes the integer value 1 from the floating-point
    value

    1.0. They may represent the same number, but they belong to different types. The
    reason is

    that they are represented differently inside the computer.


    The str function converts any argument given to it to type string:


    ```

    >>> str(32)

    ''32''

    >>> str(3.14149)

    ''3.14149''

    >>> str(True)

    ''True''

    >>> str(true)

    Traceback (most recent call last):

    File "<interactive input", line 1, in <module>

    NameError: name ''true'' is not defined

    ```


    str will work with anything and convert it into a string. As mentioned earlier,
    True is

    Boolean value; true is just an ordinary variable name, and is not defined here,
    so we get an

    error.


