    # 11.13 List parameters


    Passing a list as an argument actually passes a reference to the list, not a copy
    or clone of the list. So parameter passing creates aliases for you: the caller
    has one variable referencing the list, and the called function has alias, but
    there is only one underlying list object. For example, the function below takes
    a list as an argument and multiplies each element in the list by 2:


    ```

    1 def double_stuff(a_list):

    2     """Overwrite each element in a_list with double its value."""

    3     for (idx, val) in enumerate(a_list):

    4         a_list[idx] = 2 * val

    ```


