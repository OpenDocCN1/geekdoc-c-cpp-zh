    **key** A data item that is *mapped* to a value in a dictionary. Keys are used
    to look up values in a dictionary. Each key must be unique across the dictionary.


    **key:value pair** One of the pairs in a dictionary. Values are looked up in a
    dictionary by key.


    **mapping type** A mapping type is a data type comprised of a collection of keys
    and associated values. Python’s built-in mapping type is the dictionary. Dictionaries
    implement the *associative array* abstract data type.


    **memo** Temporary storage of precomputed values to avoid duplicating the same
    computation.


    **mutable data value** A value which can be modified. The types of all mutable
    are compound types. Lists and dictionaries are mutable; strings and tuples are
    not.


