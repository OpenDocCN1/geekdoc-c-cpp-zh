  md: '# CHAPTER

    THIRTEEN


    # FILES


    # 13.1 About files


    While a program is running, its data is stored in random access memory (RAM).
    RAM is fast and inexpensive, but it is also volatile, which means that when the
    program ends, or the computer shuts down, data in RAM disappears. To make data
    available the next time the computer is turned on and the program is started,
    it has to be written to a non-volatile storage medium, such as a hard drive, usb
    drive, or CD-RW.


    Data on non-volatile storage media is stored in named locations on the media called
    files. By reading and writing files, programs can save information between program
    runs.


    Working with files is a lot like working with a notebook. To use a notebook, it
    has to be opened. When done, it has to be closed. When the notebook is open, it
    can either be read from or written to. In either case, the notebook knows where
    they are. They can read the whole notebook in its natural order or they can skip
    around.


    All of this applies to files as well. To open a file, we specify its name and
    indicate whether we want to read it.


    # 13.2 Writing our first file


    Let''s begin with a simple program that writes three lines of text into a file:


    ```

    1 myfile = open("test.txt", "w")

    2 myfile.write("My first file written from Python\n")

    3 myfile.write("--------------------------------\n")

    4 myfile.write("Hello, world!\n")

    5 myfile.close()

    ```


    Opening a file creates what we call a handle. In this example, the variable myfile
    refers to the new handle object. Our program calls methods on the handle, and
    this makes changes to the actual file which is usually located on our disk.


    On line 1, the open function takes two arguments. The first is the name of the
    file, and the second is the mode. Mode "w" means that we are opening the file
    for writing.'
