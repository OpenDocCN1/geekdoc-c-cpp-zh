    # E.1.2 Local variables


    Functions are called, activated, and while they’re busy they create their own
    stack frame which holds local variables. A local variable is one that belongs
    to the current activation. As soon as the function returns (whether from an explicit
    return statement or because Python reached the last statement), the stack frame
    and its local variables are destroyed. The important consequence of this is that
    a function cannot use its variables to remember any kind of state between different
    activations. It cannot count how many times it has been called, or remember to
    switch colors between red and blue UNLESS it uses variables that are global. Global
    variables will survive after a function has exited, so they are the correct way
    to maintain information between calls.


    This fragment assumes our turtle is tess. Each time we call h2() it turns, and
    increases the global variable sz. Python always assumes that an assignment to
    a variable (as in line 7) means we want a new local variable, unless we’ve provided
    a global declaration (on line 4). So leaving out the global declaration this does
    not work.


    **Tip: Local variables do not survive when you exit the function


    Use a Python visualizer like the one at http://netserv.ict.ru.ac.za/python3_viz
    to build an understanding of function calls, stack frames, local variables, and
    function returns.


    **Tip: Assignment in a function creates a local variable


    Any assignment to a variable within a function means Python will make a local
    variable, unless we override it with global.'
