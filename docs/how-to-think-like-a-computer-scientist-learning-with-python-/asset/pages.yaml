    find the target word.


    The word **binary means two**. Binary search gets its name from the fact that
    each probe splits

    t list into two pieces and discards the half from the region of interest.


    The beauty of the algorithm is that we could double the size of the vocabulary,
    and N would

    need one more probe! After another doubling, just another probe. So as the

    vocabulary gets bigger, its performance becomes even more impressive.


    Can we put a formula to this? If our list is N, is it the biggest number of probes
    k we

    need? The math is a bit easier if we turn the question around: how big a list
    N we could

    deal with, given that we were only allowed to make probes?


    With 1 probe, we can only search a list of 1. With two probes we could cope with
    lists

    to size 3 -(test the middle item with the first probe, then test the left or right
    sublist

    the second probe). With one more probe, we could cope with 7 items (the middle
    item, and

    sublists of size 3). With four probes, we can search 15 items, and 5 probes lets
    us search up

    31 items. So the general relationship is given by the formula


    ```

    N = 2^k - 1

    ```


    where k is the number of probes that can be searched in that many probes. This
    function is exponential in k (because k

    in the exponent part). If we wanted the formula around and solve for k in terms
    of N,

    we need to move the constant 1 to the other side, and take a log (base 2) on each
    side. (The log

    is the inverse of exponent). So the formula for k in terms of N is:


    # k = [log2(N + 1)]


    The square-on-top brackets are called ceiling brackets: this means that you must
    round

    the number up to the next whole integer.


    Let us try on a calculator, or in Python, which is the mother of all calculators:
    suppose I

    have 1000 elements to be searched, what is the maximum number of probes I''ll
    need? (There is

    a pesky +1 in the formula, so let us not forget to add it on:)


    ```

    >>> from math import log

    >>> log(1000 + 1, 2)

    9.9672625883593

    ```


    Telling us that we need 9.96 probes maximum, to search 1000 items is not quite
    what we

    want. We forgot to take the ceil. The ceil function in the math module does exactly
    this.

    More accurately now:


    ```

    1 >>> from math import log, ceil

    2 >>> ceil(log(1000 + 1, 2))

    3 10

    4 >>> ceil(log(100000 + 1, 2))

    5 20

    6 >>> ceil(log(1000000000 + 1, 2))

    7 30

    ```'
