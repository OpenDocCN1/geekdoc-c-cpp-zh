  md: "A copy constructor is a special constructor that creates an object by copying\
    \ the contents of another object. It is called when objects are passed by value,\
    \ returned by value, or explicitly copied.\n\n```\nclass Student {\npublic:\n\
    // Copy constructor\nStudent(const Student& other) {\n\tthis->name = other.name;\n\
    \tthis->age = other.age;\n\tcout << \"Copy constructor called.\" << endl;\n}\n\
    // Constructor\nStudent(string name, int age) : name(name), age(age) {\n\tcout\
    \ << \"Student object created.\" << endl;\n}\n// Destructor\n~Student() {\n\t\
    cout << \"Student object destroyed.\" << endl;\n}\nprivate:\nstring name;\nint\
    \ age;\n};\n```\n\nIn this example, the Student class has a copy constructor that\
    \ creates a new object by copying the data from another Student object.\n\n# Operator\
    \ Overloading: Extending the Language's Vocabulary\n\nOperator overloading in\
    \ C++ allows user-defined classes to define their behaviour for standard operators.\
    \ This feature enhances the expressiveness of classes by enabling them to work\
    \ seamlessly with operators, making code more intuitive and readable.\n\n# Overloading\
    \ Unary Operators:\n\nUnary operators operate on a single operand. To overload\
    \ a unary operator, define a member function for the class with the operator keyword\
    \ followed by the operator to be overloaded."
