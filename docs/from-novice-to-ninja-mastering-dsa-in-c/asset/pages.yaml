  md: "```\nclass ComplexNumber {\npublic:\n    double real;\n    double imag;\n\n\
    \    // Overloading the unary minus (-) operator\n    ComplexNumber operator-()\
    \ const {\n        ComplexNumber result;\n        result.real = -real;\n     \
    \   result.imag = -imag;\n        return result;\n    }\n};\n```\n\nIn this example,\
    \ the unary minus operator (-) is overloaded to negate the real and imaginary\
    \ parts of a complex number.\n\n# Overloading Binary Operators:\n\nBinary operators\
    \ work on two operands. To overload a binary operator, define a member function\
    \ for the class with the operator keyword and two parameters.\n\n```\nclass Point\
