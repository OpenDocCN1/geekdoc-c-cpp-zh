  md: "# Bubble Sort:-\n\n```\n#include <iostream>\n\nvoid bubbleSort(int arr[], int\
    \ size) {\n    for (int i = 0; i < size - 1; ++i) {\n        for (int j = 0; j\
    \ < size - i - 1; ++j) {\n            if (arr[j] > arr[j + 1]) {\n           \
    \     // Swap elements if they are in the wrong order\n                int temp\
    \ = arr[j];\n                arr[j] = arr[j + 1];\n                arr[j + 1]\
    \ = temp;\n            }\n        }\n    }\n}\n\nint main() {\n    int numbers[]\
    \ = {5, 2, 8, 1, 3};\n    int size = 5;\n\n    // Sorting the array using bubble\
