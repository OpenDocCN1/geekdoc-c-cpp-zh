    \ Dijkstra's and Bellman-Ford\n\n# Importance of Shortest Path Algorithms:\n\n\
    Finding the shortest path in a graph is a fundamental problem with applications\
    \ ranging from network routing to project scheduling. Two widely used algorithms\
    \ for solving this problem are Dijkstra's algorithm and the Bellman-Ford algorithm.\n\
    \n# Dijkstra's Algorithm:\n\n+   > **Objective**: Find the shortest path from\
    \ a source vertex to every other vertex in a non-negative weighted graph.\n\n\
    +   > **Approach**: Utilizes a priority queue (min-heap) to greedily select the\
    \ vertex with the smallest tentative distance at each step.\n\n+   > **Steps:**\n\
    +   1. Initialize distances from the source to all vertices as infinity and the\
    \ distance to the source as 0.\n+   2. For the current vertex, explore its neighbours\
    \ and update their tentative distances if a shorter path is found.\n+   3. Repeat\
    \ the process until all vertices are processed.\n\n+   > **Advantages:**\n+  \
    \ 1. Efficient for dense graphs.\n+   2. Suitable for scenarios where the edge\
    \ weights are non-negative.\n\n+   > **Example:**\n\n```\nGraph:\n\n    1\nA -----\
    \ B\n| \\   |\n3 |  \\  | 2\n|   \\  |\nC ----- D\n    4\nShortest Path from A\
