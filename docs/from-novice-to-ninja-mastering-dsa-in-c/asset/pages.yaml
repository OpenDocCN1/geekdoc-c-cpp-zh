  md: "# Chapter 5: Stacks and Queues\n\n# Understanding Stacks and their Applications:\
    \ LIFO in Action\n\nStacks, a fundamental data structure, follow the Last In,\
    \ First Out (LIFO) principle. In this chapter, we delve into the conceptual understanding\
    \ of stacks and explore their versatile applications in various computational\
    \ scenarios.\n\n# Anatomy of a Stack:\n\nA stack is a collection of elements with\
    \ two main operations: push, which adds an element to the top of the stack, and\
    \ pop, which removes the top element. The last element added is the first to be\
    \ removed, embodying the LIFO principle.\n\n# Example: Basic Stack Operations\n\
    \n```\n#include <iostream>\n#include <stack>\n\nint main() {\n\n    // Creating\
    \ a stack of integers\n    std::stack<int> myStack;\n\n    // Pushing elements\
    \ onto the stack\n    myStack.push(3);\n    myStack.push(7);\n    myStack.push(1);\n\
    \n    // Displaying the top element\n    std::cout << \"Top element: \" << myStack.top()\
    \ << std::endl;\n\n    // Popping elements from the stack\n    myStack.pop();\n\
    \n    // Displaying the top element after pop\n    std::cout << \"Top element\
    \ after pop: \" << myStack.top() <<\nstd::endl;\n\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Applications of Stacks:\n\nStacks find applications in a myriad of computational\
    \ scenarios due to their simplicity and efficiency. Some common applications include:-\n\
    \n+   > **Function Call Management**: Stacks are used to manage function calls\
    \ in programs. Each function call is pushed onto the stack, and when a function\
    \ completes, it is popped off the stack.\n+   > **Expression Evaluation**: Stacks\
    \ play a crucial role in evaluating arithmetic expressions. They are used to keep\
    \ track of operators and operands, ensuring the correct order of evaluation.\n\
    +   > **Undo Mechanisms in Software**: Stacks are employed in software applications\
    \ to implement undo mechanisms. Each action performed is pushed onto the stack,\
    \ allowing users to undo operations in reverse order.\n+   > **Backtracking in\
    \ Algorithms**: Stacks are utilized in algorithms that involve backtracking, such\
    \ as depth-first search. The stack stores the path taken, and backtracking involves\
    \ popping elements to explore alternative paths.\n+   > **Parsing and Syntax Checking**:\
    \ Stacks are integral to parsing and syntax checking in compilers. They help ensure\
    \ that the syntax of a program follows the specified grammar rules.\n\n# Example:\
    \ Checking Balanced Parentheses\n\n```\n#include <iostream>\n#include <stack>\n\
    #include <string>\n\n// Function to check if parentheses are balanced\nbool areParenthesesBalanced(const\
    \ std::string& expression) {\n    std::stack<char> charStack;\n\n    for (char\
    \ ch : expression) {\n        if (ch == '(' || ch == '[' || ch == '{') {\n   \
    \         charStack.push(ch);\n        } else if (ch == ')' || ch == ']' || ch\
    \ == '}') {\n            if (charStack.empty() ||\n                (ch == ')'\
    \ && charStack.top() != '(') ||\n                (ch == ']' && charStack.top()\
    \ != '[') ||\n                (ch == '}' && charStack.top() != '{')) {\n     \
    \           return false;  // Unbalanced parentheses\n            }\n\n      \
    \      charStack.pop();\n        }\n    }\n}\n```"
