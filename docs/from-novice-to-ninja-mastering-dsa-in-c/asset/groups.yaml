  mdcn: "\n\n## 从新手到忍者\n### 精通 C++ 数据结构与算法\n\nPabitra Banerjee\n\n以 C++ 为你的可靠向导，从新手程序员一路进阶为算法忍者。\n\
    \n![](img/717c6998455b631da454a8027cd01ebd_0_0.png)\n\n![](img/717c6998455b631da454a8027cd01ebd_0_1.png)\n\
    \n![](img/717c6998455b631da454a8027cd01ebd_0_2.png)\n\n## 引言\n\n欢迎踏上这段穿越编程精通领域的变革之旅。在《从新手到忍者：精通\
    \ C++ 数据结构与算法》中，我，Pabitra Banerjee——一位经验丰富的全栈 AI 工程师，同时也是 MB WEBBER'S 富有远见的首席执行官——将借助\
    \ C++ 这一强大媒介，带你展开一场对数据结构与算法（DSA）复杂世界的引人入胜的探索。\n\n随着技术以前所未有的速度发展，对能够驾驭复杂数据处理和算法问题解决的熟练程序员的需求也在与日俱增。Pabitra\
    \ Banerjee 拥有多年的实践经验和对人工智能与软件开发的热情，是你从新手到忍者这段征途中值得信赖的向导。\n\n### 开启精通之旅\n\n《从新手到忍者》不仅仅是一本书，更是一张为那些渴望超越初级编程界限、成为编程忍者的人准备的路线图。我的方法既富有洞见又注重实践，确保每个概念不仅能被理解，还能在真实场景中得以应用。\n\
    \n无论你是编程世界的新手，还是寻求提升技能的经验丰富的程序员，这本书都旨在契合你当前的水平，并推动你迈向编程卓越。所以，系好安全带，我们即将启程——这段旅程不仅承诺揭示\
    \ C++ 的复杂之处，还将为你装备征服任何编程挑战所需的数据结构与算法利器。\n\n让从新手到忍者的转变就此开始。\n\n![](img/717c6998455b631da454a8027cd01ebd_1_0.png)\n\
    \nPabitra Banerjee\n（全栈 AI 工程师）\nMB WEBBER'S\n\n## 第 1 章：C++ 入门\n\n### C 语言的历史\n\
    \n20 世纪 70 年代初，计算机编程领域由 Fortran 和汇编语言等语言主导，它们各有其优势和局限性。正是在这个时代，美国计算机科学家 Dennis\
    \ Ritchie 开始开发一种能够弥合低级机器语言与高级编程之间差距的语言。他的努力成果便是 C——一种广受欢迎的程序设计语言。\n\n![](img/717c6998455b631da454a8027cd01ebd_2_0.png)\n\
    \n### C++ 的诞生\n\nC++ 的开发始于 1979 年，当时荷兰计算机科学家 Bjarne Stroustrup 正在贝尔实验室工作。他的目标是在保持其效率和底层能力的同时，通过添加面向对象编程特性来增强\
    \ C 语言。C++ 的第一个版本被命名为“带类的 C”，因为它引入了类的概念，允许创建用户自定义的数据类型和方法。\n\n![](img/717c6998455b631da454a8027cd01ebd_2_1.png)\n\
    \n### 面向对象范式\n\nC++ 的开创性之一在于它融入了面向对象编程（OOP）原则。这一范式转变使开发者能够以更加模块化和可复用的方式组织代码，推动了封装、继承和多态等概念。创建类和对象的能力为软件开发带来了新的抽象层次和灵活性。\n\
    \n### 标准化与演进\n\n多年来，C++ 经历了重大的改进和完善。1983 年，该语言更名为 C++，以体现其不断进化的特性。第一个标准化版本 C++98\
    \ 发布，为该语言建立了共同的基线。随后的更新，包括 C++11、C++14 和 C++17，引入了新特性、增强了性能，并改善了整体编程体验。\n\n![](img/717c6998455b631da454a8027cd01ebd_2_2.png)\n\
    \n-   **整数（`int`）**：非常适合处理整数。\n-   **浮点数（`double`、`float`）**：用于表示带小数点的数字。\n- \
    \  **字符（`char`）**：存储单个字符，如 `'a'`、`'B'` 或 `'@'`。\n-   **布尔（`bool`）**：处理 `true`\
    \ 或 `false` 值。\n\n除了这些基本类型之外，C++ 还允许通过结构体和类创建用户自定义的数据类型，使开发者能够将数据和功能封装到内聚的单元中。\n\
    \n### 运算符：转换的工具\n\n运算符是转换和组合变量与值的操作工具。理解这些运算符对于编写富有表现力和功能性的代码至关重要。以下是一些基本运算符类型的概览：\n\
    \n-   **算术运算符（`+`、`-`、`*`、`/`、`%`）**：进行基本的数学运算。\n-   **关系运算符（`==`、`!=`、`<`、`>`、`<=`、`>=`）**：比较值并产生布尔结果。\n\
    -   **逻辑运算符（`&&`、`||`、`!`）**：组合并操作布尔值。\n-   **赋值运算符（`=`）**：为变量赋值。\n\n### 控制流：条件语句与循环\n\
    \n在 C++ 编程的动态领域中，掌握控制流就如同挥舞一套强大的工具集，用来引导代码的执行。条件语句和循环构成了控制流的核心，使开发者能够做出决策并迭代地执行代码。\n\
    \n#### 条件语句：导航决策路径\n\n条件语句是一种编程结构，能够根据特定条件执行相应的代码块。在 C++ 中，这些条件通常通过 if、else if\
    \ 和 else 语句来表达。\n\n```\nint age = 25;\n\nif (age >= 18) {\n    cout << \"You are\
    \ eligible to vote.\" << endl;\n} else {\n    cout << \"You are not eligible to\
    \ vote yet.\" << endl;\n}\n```\n\n在此示例中，if 语句检查 age 变量是否大于或等于 18。如果为真，则执行第一个代码块；否则，运行\
