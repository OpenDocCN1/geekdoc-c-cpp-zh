    ## 第 9 章：贪心算法\n\n### 贪心算法简介 - 为全局解进行局部优化\n\n### 贪心算法概述：\n\n贪心算法是一种问题求解策略，在每个阶段做出局部最优选择，希望找到全局最优解。这些算法旨在在不考虑整个问题的情况下，在每一步实现尽可能好的解决方案。\n\
    \n### 关键特征：\n\n### 贪心选择性质：\n\n- 1. 贪心算法做出在当前时刻看起来最好的选择，而不会在未来步骤中重新考虑它们。\n- 2.\
    \ 策略是选择局部最优解，并期望它将有助于整体最优解。\n\n### 缺乏回溯：\n\n- 1. 与动态规划不同，贪心算法不会重新访问或修改过去做出的选择。\n\
