    \n## 第5章：栈与队列\n\n## 理解栈及其应用：LIFO的实际应用\n\n栈作为一种基础数据结构，遵循后进先出（LIFO）原则。在本章中，我们将深入理解栈的概念，并探索其在各种计算场景中的多种应用。\n\
    \n## 栈的结构：\n\n栈是一个元素集合，包含两个主要操作：push（压栈）将元素添加到栈顶，pop（弹栈）移除栈顶元素。最后添加的元素最先被移除，体现了LIFO原则。\n\
    \n## 示例：基本栈操作\n\n```cpp\n#include <iostream>\n#include <stack>\n\nint main() {\n\
    \n    // Creating a stack of integers\n    std::stack<int> myStack;\n\n    //\
    \ Pushing elements onto the stack\n    myStack.push(3);\n    myStack.push(7);\n\
    \    myStack.push(1);\n\n    // Displaying the top element\n    std::cout << \"\
    Top element: \" << myStack.top() << std::endl;\n\n    // Popping elements from\
    \ the stack\n    myStack.pop();\n\n    // Displaying the top element after pop\n\
    \    std::cout << \"Top element after pop: \" << myStack.top() << std::endl;\n\
    \n    return 0;\n}\n```\n\n## 栈的应用：\n\n由于栈的简单性和高效性，它在众多计算场景中都有应用。一些常见的应用包括：\n\
    - **函数调用管理**：栈用于管理程序中的函数调用。每次函数调用被压入栈中，当函数完成时，即从栈中弹出。\n- **表达式求值**：栈在计算算术表达式时起着关键作用。它用于跟踪运算符和操作数，确保求值顺序正确。\n\
    - **软件中的撤销机制**：软件开发中利用栈来实现撤销机制。每次执行的操作都被压入栈中，从而允许用户按相反顺序撤销操作。\n- **算法中的回溯**：栈被用于涉及回溯的算法，例如深度优先搜索。栈存储已走过的路径，回溯时通过弹出元素来探索替代路径。\n\
    - **解析和语法检查**：栈是编译器中进行解析和语法检查的重要组成部分，有助于确保程序的语法符合指定的文法规则。\n\n## 示例：检查括号是否平衡\n\n\
    ```cpp\n#include <iostream>\n#include <stack>\n#include <string>\n\n// Function\
    \ to check if parentheses are balanced\nbool areParenthesesBalanced(const std::string&\
    \ expression) {\n    std::stack<char> charStack;\n\n    for (char ch : expression)\
    \ {\n        if (ch == '(' || ch == '[' || ch == '{') {\n            charStack.push(ch);\n\
    \        } else if (ch == ')' || ch == ']' || ch == '}') {\n            if (charStack.empty()\
    \ ||\n                (ch == ')' && charStack.top() != '(') ||\n             \
    \   (ch == ']' && charStack.top() != '[') ||\n                (ch == '}' && charStack.top()\
    \ != '{')) {\n                return false;  // Unbalanced parentheses\n     \
    \       }\n\n            charStack.pop();\n        }\n    }\n    return charStack.empty();\
    \ // Stack should be empty for balanced parentheses\n}\nint main() {\n    // Checking\
    \ balanced parentheses\n    std::string expression = \"[{( )]( )}\";\n    if (areParenthesesBalanced(expression))\
    \ {\n        std::cout << \"Parentheses are balanced.\" << std::endl;\n    } else\
