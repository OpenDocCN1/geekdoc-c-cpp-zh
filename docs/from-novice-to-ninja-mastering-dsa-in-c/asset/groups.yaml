    \n### 用贪心策略解决问题 - 局部选择，全局最优\n\n### 贪心问题求解的一般方法：\n\n贪心算法专注于在每一步做出局部最优选择，并期望这些选择会共同导致全局最优解。该过程涉及基于特定标准迭代选择最佳可用选项。\n\
