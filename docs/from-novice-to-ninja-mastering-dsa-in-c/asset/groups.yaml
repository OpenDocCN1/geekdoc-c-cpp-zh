    # Insertion Sort:


    Principle: Builds the sorted array one element at a time by repeatedly taking
    elements from the unsorted region and inserting them into their correct position
    in the sorted region.


    Process:


    +   1. Start with the second element and compare it with the previous elements
    in the sorted region.

    +   2. Insert the element into its correct position.

    +   3. Move to the next element in the unsorted region.


    Time Complexity: O(n^2) in the worst case.


    Example:


    ```

    Original Array: 5 2 9 1 5


    Pass 1: 1 2 9 5 5

    Pass 2: 1 2 9 5 5

    Pass 3: 1 2 5 9 5

    Pass 4: 1 2 5 5 9

    ```


    # Comparison and Selection:


    +   Bubble Sort: Simple to implement but inefficient for large datasets.

    +   Selection Sort: Similar to bubble sort in terms of efficiency, with a smaller
    number of swaps.

    +   Insertion Sort: Efficient for small datasets and nearly sorted arrays.


    # Choosing the Right Algorithm:


    +   Size of Dataset: For small datasets or nearly sorted data, fundamental sorting
    algorithms like insertion sort may be more appropriate.

    +   Efficiency Concerns: For large datasets, more efficient sorting algorithms
    like merge sort or quicksort should be considered.


    Understanding these fundamental sorting algorithms provides a solid foundation
    for exploring more complex and efficient sorting techniques in the subsequent
    sections of this chapter.


