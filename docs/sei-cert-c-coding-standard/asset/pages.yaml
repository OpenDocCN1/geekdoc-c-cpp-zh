  md: 'Containers (CTR) CTR51-CPP. Use valid references, pointers, and iterators to
    reference elements of a container


    # 5.2 CTR51-CPP. Use valid references, pointers, and iterators to reference elements
    of a container


    Iterators are a generalization of pointers that allow a C++ program to work with
    different data structures (containers) in a uniform manner [ISO/IEC 14882-2014].
    Pointers, references, and iterators share a close relationship in which that referencing
    values can be done through a valid iterator, pointer, or reference. Storing an
    iterator, reference, or pointer to an element within a container for length of
    time comes with a risk that the underlying container may be modified such that
    the stored becomes invalid. For instance, when a sequence container such as std::vector
    requires an undefined reallocation, outstanding iterators, pointers and references
    will be invalidated [Kalev 1999]. Use only a valid pointer, reference, or iterator
    to refer to an element of a container.


    The C++ Standard, [container.requirements.general], paragraph 12 [ISO/IEC 14882-2014]
    states the following:


    > Unless otherwise specified (explicitly or by defining a function in terms of
    other functions), invoking a member function or passing a container as an argument
    to a library function shall not invalidate iterators to, or change the values
    of, objects within that.


    The C++ allows references and pointers to be invalidated independently for the
    same operation, which may result in an invalidated reference but not an invalidated
    pointer. However, relying on this distinction is insecure because the object pointed
    to by the pointer may be different than expected even if the pointer is valid.
    For instance, it is possible to retrieve a pointer to an element from a container,
    erase that element (invalidating references when destroying the underlying object),
    then insert a new element at the same location within the container causing the
    extant pointer to now point to a valid, distinct object. Thus, any operation that
    invalidates a pointer or a reference should be treated as though it invalidates
    both pointers and references.


    SEI CERT C++ CODING STANDARD (2016 EDITION) | V01

    Software Engineering Institute | Carnegie Mellon University

    [DISTRIBUTION STATEMENT A] Approved for public release and unlimited distribution.'
