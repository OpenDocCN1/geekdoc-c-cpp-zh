  md: "# 7.3.4 Compliant Solution (noexcept(false))\n\nIf the design of the function\
    \ is such that the caller is expected to handle exceptional situations, it is\
    \ permissible to mark the function explicitly as that may throw, as in this compliant\
    \ solution. Marking the function is not strictly necessary, as any function without\
    \ a noexcept specifier is presumed to allow throwing.\n\n```\n#include <cstring>\n\
    \nvoid f(const int *array, std::size_t size) noexcept(false) {\n    int *copy\
    \ = new int[size];\n    // If the allocation fails, it will throw an exception\
    \ which\n    // the caller will have to handle.\n    std::memcpy(copy, array,\
    \ size * sizeof(*copy));\n    // ...\n    delete [copy];\n}\n```\n\n# 7.3.5 Noncompliant\
    \ Code Example\n\nIn this noncompliant code, two allocations are performed within\
    \ the same expression. Because the allocation fails, an exception thrown as a\
    \ result of one of the calls could result in a memory leak.\n\n```\nstruct A {\
    \ /* ... */ / };\nstruct B { /* ... */ / };\n\nvoid g(A *, B*);\nvoid f() {\n\
    \    g(new A, new B);\n}\n```\n\nConsider the situation in which A is allocated\
    \ and constructed first, then B is allocated and throws an exception. Wrapping\
    \ the call to g() in a try/catch block is insufficient because it would be impossible\
    \ to free the memory allocated for A.\n\nThis noncompliant code example also violates\
    \ EXP50-CPP. Do not depend on the order of evaluation for side effects, because\
    \ the order in the arguments to g() are evaluated is unspecified."
