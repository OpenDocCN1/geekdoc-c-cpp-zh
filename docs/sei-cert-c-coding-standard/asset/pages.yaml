    # 1.8.3 Deviation Procedure


    Strict adherence to all rules is unlikely and, consequently, deviations associated
    with specific rule violations are necessary. Deviations can be used in cases where
    a true-positive finding is uncontested as a rule violation but the nonetheless
    determined to be correct. An uncontested true finding may be the result of a design
    or architecture feature of the software or occur for a valid reason that was unanticipated
    by the coding standard. In this respect, the deviation procedure allows for the
    possibility that coding rules are only strict [Seacod 2013].


    Deviations are not granted for reasons of performance or usability. A software
    system that successfully passes testing must not contain defects or exploitable
    vulnerabilities. Deviation requests are evaluated by the lead assessor, and if
    the developer can provide sufficient evidence that the deviation will not result
    in a vulnerability, the deviation is accepted. Deviations are used infrequently
    because it is almost always easier to fix a coding error than it is to provide
    an argument that the coding error does not result in a vulnerability.


    # 1.9 Development Process


    The development of a coding standard for any programming language is a difficult
    undertaking that requires significant community involvement. The following development
    process has been used to create this standard:


    +   1. Rules and recommendations for a coding standard are solicited from the
    communities involved in the development and application of each programming language,
    including the formal or de facto standards responsible for the documented standard.


    +   2. These rules and recommendations are edited by members of the CERT technical
    staff for content and placed on the SEI C++ Coding Standard wiki for comment and
    review.'
