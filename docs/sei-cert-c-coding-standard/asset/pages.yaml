  md: "# 12.3 MSC52-CPP. Value-returning functions must return a value from all exit\
    \ paths\n\nThe C++ Standard, [stmit.return], paragraph 2 [ISO/IEC 14882-2014],\
    \ states that:\n\n+   Flowing off the end of a function is equivalent to a `return`\
    \ with no value; this results in undefined behavior in a value-returning function.\n\
    \nA value-returning function must return a value from all code paths; otherwise,\
    \ it will result in undefined behavior. Including returning less-common code paths,\
    \ such as from a function-try-block, as explained in the C++ Standard, [except.handle],\
    \ paragraph 15:\n\n+   Flowing off the end of a function-try-block is equivalent\
    \ to a `return` with no value; this results in undefined behavior in a value-returning\
    \ function (6.6.3).\n\n# 12.3.1 Noncompliant Code Example\n\nIn this noncompliant\
    \ code example, the programmer forgot to return the input value for positive,\
    \ so not all code paths return a value.\n\n```\nint absolute_value(int a) {\n\
    \  if (a < 0) {\n    return -a;\n  }\n}\n```\n\n# 12.3.2 Compliant Solution\n\n\
    In this compliant solution, all code paths return a value.\n\n```\nint absolute_value(int\
    \ a) {\n  if (a < 0) {\n    return -a;\n  }\n  return a;\n}\n```"
  merge: -1
  pgno: 407
- img_proc: true
  md: "# 12.3.3 Noncompliant Code Example\n\nIn this noncompliant code example, the\
    \ *function-try-block* handler does not return a value, resulting in undefined\
    \ behavior when an exception is thrown.\n\n```\n#include <vector>\n\nstd::size_t\
    \ f(std::vector<int> &v, std::size_t s) try {\n    v.resize(s);\n    return s;\n\
    } catch (...) {\n}\n```\n\n# 12.3.4 Compliant Solution\n\nIn this compliant solution,\
    \ the exception handler of the *function-try-block* also returns a value.\n\n\
    ```\n#include <vector>\n\nstd::size_t f(std::vector<int> &v, std::size_t s) try\
    \ {\n    v.resize(s);\n    return s;\n} catch (...) {\n    return 0;\n}\n```\n\
    \n# 12.3.5 Exceptions\n\n**MSC54-CPP-EX1:** Flowing the end of the *main()* function\
    \ is equivalent to a return 0; statement, according to the C++ Standard, [basic.start.main],\
    \ paragraph 5 [ISO/IEC 14882-2014]. Thus, flowing the end of the *main()* function\
    \ does not result in undefined behavior."
