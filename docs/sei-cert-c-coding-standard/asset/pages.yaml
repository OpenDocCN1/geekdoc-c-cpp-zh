  md: "# 9.6 ERR55-CPP. Honor exception specifications\n\nThe C++ Standard, [except.spec],\
    \ paragraph 8 [ISO/IEC 14882-2014], states the following:\n\n> A function is said\
    \ to allow an exception of type E if the constant-expression in its noexcept-specification\
    \ evaluates to false or its dynamic-exception-specification contains a type T\
    \ for which handler of type T would be a match (15.3) for an exception of E.\n\
    \nIf a function throws an exception than one allowed by its exception-specification,\
    \ it can lead to an implementation-defined termination of the program ([except.spec],\
    \ paragraph 9).\n\nIf a function declared with a dynamic-exception-specification\
    \ throws an exception of a type that would not match the exception-specification,\
    \ the function std::unexpected() is called. The behavior of this function can\
    \ be overridden, by default, calls an exception of std::bad_exception which is\
    \ listed in the exception-specification, the function std::terminate() will be\
    \ called.\n\nSimilarly, if a function declared with a noexcept-specification throws\
    \ an exception of a type that would cause the noexcept-specification to evaluate\
    \ to false, the function std::terminate() will be called.\n\nCalling std::terminate()\
    \ leads to implementation-defined termination of the program. To prevent abnormal\
    \ termination of the program, any function that declares an exception-specification\
    \ should respect itself, as well as all functions it calls, throwing only allowed\
    \ exceptions.\n\n# 9.6.1 Noncompliant Code Example\n\nIn this noncompliant code\
    \ example, the second function claims to throw only Exception1, but it may throw\
    \ Exception2.\n\n```\n#include <exception>\nclass Exception1 : public std::exception\
    \ {};\nclass Exception2 : public std::exception {};\n\nvoid foo() {\n    throw\
    \ Exception2();\n    // Okay because foo() promises nothing about exceptions\n\
    }\n\nvoid bar() throw (Exception1) {\n    foo();\n    // Because foo() can throw\
    \ Exception2\n}\n```"
  merge: -1
  pgno: 289
- img_proc: true
  md: "# 9.6.2 Compliant Solution\n\nThis compliant solution catches the exceptions\
    \ thrown by foo().\n\n```\n#include <exception>\n\nclass Exception1 : public std::exception\
    \ {};\nclass Exception2 : public std::exception {};\n\nvoid foo() {\n    throw\
    \ Exception2();\n    // Okay because foo() promises nothing about exceptions\n\
    }\n\nvoid bar() throw (Exception1) {\n    try {\n        foo();\n    } catch (Exception2\
    \ e) {\n        // Handle error without rethrowing it\n    }\n}\n```\n\n# 9.6.3\
