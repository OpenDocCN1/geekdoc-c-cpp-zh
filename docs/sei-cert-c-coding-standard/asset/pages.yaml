    In this noncompliant code, the expression a++ is not evaluated.


    ```

    #include <iostream>

    void f() {

    int a = 14;

    int b = sizeof(a++);

    std::cout << a << " " << b << std::endl;

    }

    ```


    Consequently, the value of a b has been initialized to 14.'
