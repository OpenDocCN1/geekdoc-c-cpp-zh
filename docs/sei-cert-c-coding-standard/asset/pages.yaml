  md: '# 3.9 EXP58-CPP. Pass an object of the correct type to va_start


    While DCL50-CPP. Do not define a C-style variadic function forbids creation of
    such functions, they may be defined when function has external linkage. Under
    these circumstances, care must be taken when invoking the va_start() macro. The
    C standard library macro imposes severe semantic restrictions on the type of the
    value of its second parameter. The C Standard, subclause 7.16.1.4, paragraph 4
    [ISO/IEC 9899:2011], states the following:


    > The parameter parmn is the identifier of the rightmost parameter in the variable
    parameter list in the function definition (the one just before ...). If the parameter
    parmn is declared with the register storage class, with a function or array type,
    or with a type that is not compatible with the type that results after default
    argument promotions, the behavior is undefined.


    These restrictions are superseded by the C++ Standard, [support.runtime], [ISO/IEC
    14882-2014], which states the following:


    > The restrictions that ISO C places on the second parameter to the va_start()
    macro in header <stdarg.h> are different in this International Standard. The parameter
    parmn is the identifier of the rightmost parameter in the variable parameter list
    of the function definition (the one just before ...). If the parameter parmn is
    of a reference, or of a type that is not compatible with the type that results
    when passing an argument for which there is no parameter, the behavior is undefined.


    The primary differences between the semantic restrictions are as follows:


    +   - You must not pass a reference as the second argument to va_start().

    - Passing an object of a class type that has a nontrivial copy constructor, move
    constructor or destructor as the second argument to va_start is conditionally
    supported with implementation-defined semantics [lexpr.call] paragraph 7).

    - You may pass a parameter declared with the register keyword ([dlc.stl] paragraph
    3) or as a parameter with a function type.


    Passing an object of array type still produces undefined behavior in C++ because
    an array type as a function parameter requires the use of a reference, which is
    prohibited. Additionally, passing an object of a type that undergoes default argument
    promotions produces undefined behavior in C++.'
