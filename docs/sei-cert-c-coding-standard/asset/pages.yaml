  md: "# 9.7.1 Noncompliant Code Example (No Exception Safety)\n\nThe following noncompliant\
    \ code example shows a flawed copy assignment operator. The implicit invariants\
    \ of the class are that nElems stores the number of elements in the array pointed\
    \ to by array. The function deallocates array and assigns the element counter,\
    \ nElems, before allocating a new block of memory for the copy. As a result, if\
    \ the new expression throws an exception, the function has modified the state\
    \ of member variables in a way that violates the implicit invariants of the class.\
    \ Consequently, such an object is in an indeterminate state and any operation\
    \ on it, including its destruction, results in undefined behavior.\n\n```\n#include\
    \ <cstring>\n\nclass IntArray {\n    int *array;\n    std::size_t nElems;\npublic:\n\
    \    // ...\n\n    ~IntArray() {\n        delete[] array;\n    }\n\n    IntArray(const\
    \ IntArray& that); // nontrivial copy constructor\n    IntArray& operator=(const\
    \ IntArray& rhs) {\n        if (this != &rhs) {\n            delete[] array;\n\
    \            array = nullptr;\n            nElems = rhs.nElems;\n            if\
    \ (nElems) {\n                array = new int[nElems];\n                std::memcpy(array,\
    \ rhs.array, nElems * sizeof(*array));\n            }\n        }\n        return\
    \ *this;\n    }\n\n    // ...\n};\n```"
  merge: -1
