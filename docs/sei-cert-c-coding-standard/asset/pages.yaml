  md: "# 12.5 MSC54-CPP. A signal handler must be a plain old function\n\nThe C++\
    \ Standard, [support.runtime], paragraph 10 [ISO/IEC 14882-2014], states that:\n\
    \n> Common subset of C and C++ languages consists of all declarations, definitions,\
    \ and expressions that may appear in a well formed C++ program and also in a conforming\
    \ program. A POF ('plain old function') is a function that uses only features\
    \ from this common subset, and that does not directly or indirectly use any function\
    \ that is not a POF, except that it may use lock-free atomic operations. A lock-free\
    \ atomic operation is an invocation of a function from Clause 29, that is not\
    \ a member function, and either is the function atomic_is_lock_free, or for every\
    \ argument passed to f, atomic_is_lock_free(A) yields true. All signal handlers\
    \ shall have C linkage. The behavior of any function other than POF used as a\
    \ signal handler in a C++ program is implementation-defined.228\n\nFootnote 228\
    \ states:\n\n> In particular, a signal handler using exception is very likely\
    \ to have problems. Also, invoking std::exit may cause destruction of objects,\
    \ including those of the standard library implementation, which, in general, yields\
    \ undefined behavior in a signal handler.\n\nIf your handler is not plain old,\
    \ the behavior of a call to it in respond to a signal is implementation-defined,\
    \ at best, and likely to result in undefined behavior. All signal handlers must\
    \ meet the definition of a plain old function. In addition to the restrictions\
    \ on signal handlers in a C program, this also permits the use of features that\
    \ exist in C++ but not in C (such as non-POD [non-plain old data] objects and\
    \ exceptions). This includes indirect use of such noncompliant through function\
    \ calls.\n\n# 12.5.1 Noncompliant Code Example\n\nIn this noncompliant code example,\
    \ the signal handler is declared as a static function. However, since all signal\
    \ handlers must have C linkage, and C++ is the default language linkage for functions\
    \ in C++, calling the signal handler results in undefined behavior.\n\n```\n#include\
    \ <csignal>\nstatic void sig_handler(int sig) {\n    // Implementation details\
    \ elided.\n}\nvoid install_signal_handler() {\n    if (ERR == std::signal(SIGTERM,\
    \ sig_handler)) {\n        // Handle error\n    }\n}\n```"
  merge: -1
  pgno: 412
- img_proc: true
  md: "# 12.5.2 Compliant Solution\n\nThis compliant solution defines sig_handler()\
    \ as having C language linkage. As a consequence of declaring the signal handler\
    \ with C language linkage, the signal handler will have external linkage rather\
    \ than internal linkage.\n\n```\n#include <csignal>\nextern \"C\" void sig_handler(int\
    \ sig) {\n    // Implementation details elided.\n}\nvoid install_signal_handler()\
    \ {\n    if (SIG_ERR == std::signal(SIGTERM, sig_handler)) {\n        // Handle\
    \ error\n    }\n}\n```\n\n# 12.5.3 Noncompliant Code Example\n\nIn this noncompliant\
    \ code example, a signal handler calls a function that allows exceptions, and\
    \ it attempts to handle any exceptions thrown. Because exceptions are not part\
    \ of the common subset of C and C++ features, this example results in implementation-defined\
    \ behavior. However, it is unlikely that the implementation's behavior will be\
    \ stable. For instance, on a stack-based architecture where a signal is generated\
    \ asynchronously (instead of a result of a call to std::abort()), it is possible\
    \ that the stack frame is not properly initialized, causing stack tracing to be\
    \ unreliable and preventing the exception from being caught properly.\n\n```\n\
    #include <csignal>\nstatic void g() noexcept(false);\nextern \"C\" void sig_handler(int\
    \ sig) {\n    try {\n        g();\n    } catch (...) {\n        // Handle error\n\
    \    }\n}\nvoid install_signal_handler() {\n    if (SIG_ERR == std::signal(SIGTERM,\
    \ sig_handler)) {\n        // Handle error\n    }\n}\n```"
  merge: -1
  pgno: 413
- img_proc: true
  md: "# 12.5.4 Compliant Solution\n\nThere is no compliant solution where g() can\
    \ be called from the signal handler because it allows exceptions. Even if g()\
    \ is implemented such that it handled all exceptions and was marked noexcept(true),\
    \ it would be non-compliant because g() would still use a feature that is not\
    \ part of the common subset of C and C++ features allowed by a signal handler.\
    \ Therefore, this compliant solution removes the call to g() from the signal handler\
    \ and instead places a variable of type volatile sig_atomic_t periodically; if\
    \ the variable is set to 1 in the signal handler, then g() is called to respond\
    \ to the signal.\n\n```\n#include <csignal>\n\nvolatile sig_atomic_t signal_flag\
    \ = 0;\nstatic void g() noexcept(false);\n\nextern \"C\" void sig_handler(int\
    \ sig) {\n    signal_flag = 1;\n}\n\nvoid install_signal_handler() {\n    if (SIG_ERR\
    \ == std::signal(SIGTERM, sig_handler)) {\n        // Handle error\n    }\n}\n\
    \n// Called periodically to poll the signal flag.\nvoid poll_signal_flag() {\n\
    \    if (signal_flag == 1) {\n        signal_flag = 0;\n        try {\n      \
    \      g();\n        } catch(...) {\n            // Handle error\n        }\n\
    \    }\n}\n```"
  merge: -1
  pgno: 414
- img_proc: true
  md: "# 12.5.5 Risk Assessment\n\nFailing to use a plain old function as a signal\
    \ handler can result in implementation-defined behavior as undefined behavior.\
    \ Given the number of features that exist in C++ that do not also exist in C,\
    \ the consequences arising from failure to comply with this rule can range from\
    \ benign (harmless) behavior to abnormal program termination, or even arbitrary\
    \ code execution.\n\n| Rule | Severity | Likelihood | Remediation Cost | Priority\
    \ | Level |\n|---|---|---|---|---|--|\n MSC54-CPP | High | Probable | High | P6\
    \ | L2 |\n\n# 12.5.6 Related Guidelines\n\n+   - SEI CERT C Coding Standard\n\
    \  - SIG30-C. Call only synchronous-safe functions within signal handlers\n  -\
    \ SIG31-C. Do not access shared objects in signal handlers\n\n# 12.5.7 Bibliography\n\
    \n| ISO/IEC 14882-2014 | Subclause 18.10, “Other Runtime Support” |"
