  md: '# Introduction - How Coding Standard Is Organized


    This standard can also be used to developing and educate software professionals
    regarding the appropriate application of coding standards. The Software Engineering
    Institute (SEI) offers several Coding courses and certificates, available as live
    training and online training. The material from this standard and supplemental
    training and evaluation materials can be used to


    +   1. identify job candidates with specific programming skills

    2. demonstrate the presence of a well-trained software workforce

    3. provide guidance to education and training institutions


    # 1.4 How Coding Standard Is Organized


    This standard is organized into 11 chapters that contain rules in specific topic
    areas followed by four appendices. Appendix A contains the bibliography. Appendix
    B lists the definitions of terms used throughout the standard. Appendix C lists
    the relationships of this standard and two other guidelines: MISra C++ 2008: Guidelines
    for the Use of C++ Language in Critical Systems [MISRA 2008] and MITRE''s Commonness
    Enumeration (CWE) [MITRE 2010]. Appendix D lists the risk assessments with all
    of the rules in the coding standard.


    Most rules have a consistent structure. Each rule in this standard has a unique
    identifier, which is included in the title. The title and the introductory paragraphs
    define the rule and are typically followed by one or more pairs of noncompliant
    code examples and compliant solutions. Each rule also includes a risk assessment,
    related guidelines, and a bibliography (where applicable). Rules may also include
    a table of related vulnerabilities.


    # 1.4.1 Identifiers


    Each rule and recommendation (see Rules Versus Recommendations) is given a unique
    identifier. These identifiers consist of three parts:


    +   * A three-letter mnemonic representing the section of the standard

    * A two-digit numeric value in the range of 00 to 99

    * A suffix that represents the language or platform.


    +   - "C" for the SEI CERT C Coding Standard

    - "CPP" for the SEI CERT C++ Coding Standard

    - "J" for the SEI CERT Oracle Standard for Java

    - "PL" for the SEI CERT Perl Coding Standard


    The three-letter mnemonic is used to group similar coding practices and to indicate
    which category code belongs to.


    The numeric value is used to give each coding practice a unique identifier. Numeric
    values in the range of 00 to 49 are reserved for recommendations, and values in
    the range of 50 to 99 are'
