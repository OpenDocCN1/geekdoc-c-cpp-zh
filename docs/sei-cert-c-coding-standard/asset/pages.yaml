  md: "Concurrency (CON) - CON5-CPP. Ensure actively held locks are released on exceptional\
    \ conditions\n\n# 11.2 CON5-CPP. Ensure actively held locks are released on exceptional\
    \ conditions\n\nMutex that are used to access shared data may be locked using\
    \ the lock() member function and the unlock() member function. If an exception\
    \ occurs between the call to lock() and the call to unlock(), and the exception\
    \ changes control flow such that unlock() is not called, the mutex will be left\
    \ in the locked state and no critical sections protected by that mutex will be\
    \ executed. This is likely to lead to deadlock.\n\nThe throwing of an exception\
    \ must not allow a mutex to remain locked indefinitely. If a mutex was locked\
    \ and an exception occurs within the critical section protected by that mutex,\
    \ the mutex must be unlocked as part of exception handling before the unwinding\
    \ or continuing execution without subsequent control flow which will unlock the\
    \ mutex.\n\nC++ supplies the lock_guard, unique_lock, and shared_lock, which can\
    \ be initialized with a mutex. In constructor, the object locks the mutex, and\
    \ in its destructor, it unlocks the mutex. The lock_guard class provides a simple\
    \ RAII wrapper around a mutex. The unique_lock and shared_lock classes also use\
    \ RAII and provide additional functionality, such as manual control over the locking\
    \ strategy. The unique_lock class prevents the lock from being copied, although\
    \ it allows the ownership to be moved to another lock. The shared_lock class allows\
    \ the mutex to be shared by several locks. For all three classes, if an exception\
    \ occurs and takes control flow out of the scope of the lock, the destructor will\
    \ unlock the mutex and the program can continue working normally. These lock objects\
    \ are preferred to ensure that a mutex is properly released when an exception\
    \ is thrown.\n\n# 11.2.1 Noncompliant Code Example\n\nThis noncompliant code example\
    \ manipulates shared data and protects the critical section by locking the mutex.\
    \ When it is finished, it unlocks the mutex. However, if an exception occurs while\
    \ managing the shared data, the mutex will remain locked.\n\n```\n#include <mutex>\n\
    void manipulate_shared_data(std::mutex &pm) {\n  pm.lock();\n\n  // Perform work\
    \ on shared data.\n\n  pm.unlock();n}\n```\n\n![](img/03d7c1b3f34ef4416e38a33cdad88644_373_0.png)\n\
    \nSEI CERT C++ CODING STANDARD (2016 EDITION) | V01\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
    \ release and unlimited distribution.\n\n368"
