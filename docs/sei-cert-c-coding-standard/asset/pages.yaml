  md: '# 1.1.2 Issues Not Addressed


    A number of issues are not addressed by this secure coding standard.


    # 1.1.2.1 Coding Style


    Coding styles are subjective, and it has proven impossible to develop a consensus
    on not appropriate style guidelines. Consequently, the CERT C++ Secure Coding
    Standard does not require the enforcement of any particular coding style but only
    suggests that development organizations define or adopt style guidelines and apply
    these guidelines consistently. The easiest way to apply a coding style consistently
    is to use a code-formatting tool. Many interactive development environments (IDEs)
    provide such capabilities.


    # 1.1.2.2 Controversial Rules


    In general, the CERT coding standards try to avoid the inclusion of controversial
    rules that lack a broad consensus.


    # 1.2 Audience


    The CERT C++ Secure Coding Standard is primarily intended for developers of C++
    language programs but may be used by software acquir to define the requirements
    for software. The standard is of particular interest to developers who are building
    high-quality systems that are reliable, robust, and resistant to attack.


    While not intended for C programmers, the standard may be of some value to these
    developers because the vast majority of issues identified for C language programs
    are also issues in C++ programs, although in many cases the solutions are different.


    # 1.3 Usage


    The rules in this standard are intended to improve the security of software by
    improving the knowledge, practices, and tools that software developers use.


    This standard can be used to develop tailored coding standards for projects and
    organizations, enabling a consistent approach to software development security.
    It may be extended by organization-specific rules. However, the rules in this
    standard must be obeyed to claim conformance with the standard.


    This standard can also be used for conformance testing and tool selection and
    validation. Once a coding standard has been established, tools and processes can
    be developed or modified to determine conformance with the standard.'
  merge: -1
