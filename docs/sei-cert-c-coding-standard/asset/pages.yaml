  md: '# 2.11 D60-CPP. Obey the one-definition rule


    Nontrivial C++ programs are generally divided into multiple translation units
    that are later linked to form an executable. To support such a model, C++ restricts
    named object definitions to ensure that linking be handled deterministically by
    requiring a single definition for an object across all translation units. This
    model is called the one-definition rule (ODR), which is defined by the C++ Standard,
    [basic.def.ord] in paragraph 4 [ISO/IEC 14882-2014]:


    Every program contains exactly one definition of every non-inline function or
    variable that is odrused in that program; no diagnostic required. The definition
    can appear explicitly in the program, or a user-defined library, or (when appropriate)
    it is implicitly defined. An inline function is defined in every translation unit
    in which it is odrused.


    The most common approach to multranslation compilation involves declarations residing
    in a header file that is subsequently made available to a source file via #include.
    These declarations are also definitions, as class and function templates. This
    approach is allowed by an exception defined in paragraph 6, which, in part, states
    the following:


    +   There can be more than one definition of a class type, enumeration type, inline
    function with external linkage, class template, non-static function template,
    static data member of a class template, member function of a class template, template
    specialization for a class template where some template parameters are not specified
    in a program that provides each definition appears in a different translation
    unit, and provided the definitions satisfy the following requirements. Given such
    an entity D defined in more than one translation unit...


    +   If the definitions of D satisfy all these requirements, then the program shall
    behave as if there were a single definition of D. If the definitions of D do not
    satisfy these requirements, the behavior is undefined.


    The requirements specified by paragraph 6 essentially state that two definitions
    must be identical (not simply equivalent). Consequently, a definition introduced
    in separate translation units by #include directive will not violate the ODR because
    the definitions are identical in both translation units.


    However, it is possible to violate the ODR of a definition introduced via #include
    using block language specifications, vendor-specific language extensions, and
    so on. On a more likely scenario for ODR violations is accidental definitions
    of differing objects will exist in different translation units.


    Do not violate the one-definition rule; violations result in undefined behavior.'
