  md: "# 3.6 EXP55-CPP. Do not access a cv-qualified object through a cv-unqualified\
    \ type\n\nThe C++ Standard, [dlc.type.cv], paragraph 4 [ISO/IEC 14882-2014], states\
    \ the following:\n\n> Except that any class member declared mutable can be modified,\
    \ any attempt to modify a const object during its lifetime results in undefined\
    \ behavior.\n\nSimilarly, paragraph 6 states the following:\n\n+   * What constitutes\
    \ an access to an object that has volatile-qualified type is implementation-defined.\
    \ If an attempt is made to refer to an object defined with a volatile-qualified\
    \ type through the use of a quale with a non-volatile-qualified type, the behavior\
    \ is undefined.\n\nDo not cast away const qualification to attempt to modify the\
    \ resulting object. The const qualifier implies that the API designer does not\
    \ intend for that object to be modified despite the possibility be. Do not cast\
    \ away a volatile qualification; the volatile qualifier implies the API designer\
    \ intends the object to be accessed in ways unknown to the compiler, and any access\
    \ of the volatile object results in undefined behavior.\n\n# 3.6.1 Noncompliant\
    \ Code Example\n\nIn this noncompliant code, the function g() is passed a const\
    \ int &, which is then cast to an int & modified. Because the referenced value\
    \ was previously declared as const, the assignment operation results in undefined\
    \ behavior.\n\n```\nvoid g(const int &ci) {\n    int &ir = const_cast<int &>(ci);\n\
    \    ir = 42;\n}\n\nvoid f() {\n    const int i = 4;\n    g(i);\n}\n```"
