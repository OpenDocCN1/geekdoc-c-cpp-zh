- img_proc: true
  md: "As a result, objects of type T with automatic or dynamic storage must be explicitly\
    \ initialized before having their value read as part of an expression unless T\
    \ is a class type or an array or an unsigned narrow character type. If T is an\
    \ unsigned narrow character type, it may be used to initialize an object of unsigned\
    \ narrow character type, which results in objects having such as `std::memcpy`\
    \ without triggering undefined behavior.\n\nAdditionally, memory dynamically allocated\
    \ with a new expression is default-initialized when the new-initialized is omitted.\
    \ Memory allocated by the standard library function `std::calloc()` is zero-initialized.\
    \ Memory allocated assumes the values of the pointer but may not initialize the\
    \ full range of memory. Memory allocated by any other means (`std::malloc()`,\
    \ allocator objects, operator `new()`, and so on) is as to default-initialized.\n\
    \nObjects of static or thread storage are zero-initialized before any initialization\
    \ takes place [ISO/IEC 14882-2014] and need not be explicitly initialized before\
    \ having their value read.\n\nUninitialized variables for creating entropy is\
    \ problematic because these memory accesses can be removed by compiler optimization.\
    \ VU925211 is an example of a vulnerability caused by this coding error [VU925211].\n\
    \n# 3.4.1 Noncompliant Code Example\n\nIn thiscompliant code, an uninitialized\
    \ local variable is evaluated as part of an expression to print its value, resulting\
    \ in undefined behavior.\n\n```\n#include <iostream>\n\nvoid f() {\n    int i;\n\
    \    std::cout << i;\n}\n```\n\n# 3.4.2 Compliant Solution\n\nIn this compliant\
    \ code, the object is initialized before printing its value.\n\n```\n#include\
    \ <iostream>\n\nvoid f() {\n    int i = 0;\n    std::cout << i;\n```"
