  md: '# 11.7 CON56-CPP. Do not speculatively lock a non-recursive mutex that is already
    owned by the calling thread


    The C++ Standard Library supplies both recursive and non-recursive mutex classes
    used to protect critical sections. The recursive mutex classes (std::recursive_mutex
    and std::recursive_timed_mutex) differ from the non-recursive mutex classes (std::mutex,
    std::timed_mutex, and std::shared_timed_mutex) in that a non-recursive mutex may
    be locked by speculatively locking the mutex by the thread that already owns it.
    All mutex classes support the ability to speculatively lock the mutex through
    functions such as try_lock(), try_lock_for(), try_lock_until(), try_lock_shared_for(),
    and try_lock_shared_until(). These speculative locking functions attempt to obtain
    ownership of the mutex for the calling thread, but will not if the ownership cannot
    be obtained. Instead, they return a Boolean value specifying whether the ownership
    of the mutex was obtained or not.


    The C++ Standard, [thread.requirements.mutex], paragraphs 14 and 15 [ISO/IEC 14882-2014],
    state the following:


    > The expression try_lock() shall be well-formed and have the following semantics:
    Requires: If m is of type std::mutex, std::timed_mutex, or std::shared_timed_mutex,
    the calling thread does not own the mutex.


    Further, [thread.timed_mutex.class], paragraph 3, in part, states the following:


    > The behavior of a program is undefined if:

    * a thread that owns a timed_mutex object calls lock(), try_lock(), try_lock_for(),
    or try_lock_until() on that object


    Finally, [thread.shared_mutex.class], paragraph 3, in part, states the following:


    > The behavior of a program is undefined if:

    * a thread attempts to recursively gain any ownership of a shared_timed_mutex.


    Thus, attempting to speculatively lock a non-recursive mutex object that is already
    owned by the calling thread is undefined behavior. Do not call try_lock(), try_lock_for(),
    try_lock_until(), try_lock_shared_for(), or try_lock_shared_until() on a non-recursive
    mutex object from a thread that already owns that mutex.'
