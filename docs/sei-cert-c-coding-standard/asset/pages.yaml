  md: "# 5.8 CTR57-CPP. Provide a valid ordering predicate\n\nAssociative containers\
    \ place a strict weak ordering requirement on their key comparison predicates\
    \ [ISO/IEC 4882-2014]. A strict weak ordering has the following properties:\n\n\
    +   - for all x: x < x == false (irreflexivity)\n- for all x, y: if x < y then\
    \ y < x is false (asymmetry)\n- for all x, y, z: if x < y and y < z then x < z\
    \ (transitivity)\n\nProviding an invalid ordering predicate for an associative\
    \ container (e.g., sets, multisets, and upmaps), or as a comparison criterion\
    \ with the sorting algorithms, can result in erratic behavior or infinite loops\
    \ [Meyers 2001]. When an ordering predicate is required for an associative container\
    \ or a generic standard template algorithm, the predicate must meet the requirements\
    \ for inducing a strict weak ordering.\n\n# 5.8.1 Noncompliant code Example\n\n\
    In this noncompliant code example, the std::set object is created with a comparator\
    \ that does not adhere to the strict weak ordering requirement. Specifically,\
    \ it fails to return false for equivalent values. As a result, the behavior of\
    \ iterating over the results from std::set::equal_range is in unspecified behavior.\n\
    \n```\n#include <functional>\n#include <iostream>\n#include <set>\n\nvoid f()\
    \ {\n    std::set<int, std::less_equal<int>> s(5, 10, 20);\n    for (auto r =\
    \ s.equal_range(10); r.first != r.second; ++r.first) {\n        std::cout << *r.first\
    \ << std::endl;\n    }\n}\n```\n\n# 5.8.2 Compliant Solution\n\nThis compliant\
    \ solution uses the default comparator with std::set instead of providing an invalid\
    \ one."
