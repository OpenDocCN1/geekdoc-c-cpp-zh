  md: "Exceptions and Error Handling (ERR) - ERR57-CPP. Do not leak resources when\
    \ handling exceptions\n\n# 9.8.2 Compliant Solution (delete)\n\nIn this compliant\
    \ solution, the exception handler frees pst by calling delete.\n\n```\n#include\
    \ <new>\n\nstruct SomeType {\n    SomeType() noexcept; // Performs nontrivial\
    \ initialization.\n    ~SomeType(); // Performs nontrivial finalization.\n\n \
    \   void process_item() noexcept(false);\n};\n\nvoid f() {\n    SomeType *pst\
    \ = new (std::nothrow) SomeType();\n    if (!pst) {\n        // Handle error\n\
