  md: '# 3.5 EXP5-CPP. Do not access an object outside of its lifetime


    Every object has a lifetime in which it can be used in a well-defined manner.
    The lifetime of an object begins when sufficient, properly aligned storage has
    been obtained for it and its initialization is complete. The lifetime of an object
    ends when a destructor, if any, is called for the object, and the storage for
    the object has been released or released. Use of an object, or a pointer to an
    object, outside of its lifetime results in undefined behavior.


    The C++ Standard, [basic.life], paragraph 5 [ISO/IEC 14882-2014], describes the
    lifetime rules for pointers:


    +   Before the lifetime of an object starts after the storage which the object
    will occupy been allocated or, after the lifetime of an object has ended and before
    the storage which the object occupied is reused or released, any pointer that
    refers to the storage location where the object will be or was located may be
    used only in limited ways. For an object under construction, see 12.7. Otherwise,
    such a pointer refers to allocated storage, and using the pointer as if the pointer
    were of type void*, is well-defined. Indirection through such a pointer is permitted
    but the resulting value may be used in limited ways, as described below. The program
    has undefined behavior:

    * the object is used of a class type with a non-trivial destructor and the pointer
    is used as the operand of a `delete-expression`,

    * the pointer is used to access a non-static data member or call a non-static
    member function of the object,

    * the pointer is implicitly converted to a pointer to a virtual base class, or

    * the pointer is used as the operand of a `static_cast`, except when the conversion
    is to pointer to `cv void`, or to pointer to `cv void` and subsequently to pointer
    to either `cv char` or `cv unsigned char`, or

    * the pointer is used as the operand of a `dynamic_cast`.'
