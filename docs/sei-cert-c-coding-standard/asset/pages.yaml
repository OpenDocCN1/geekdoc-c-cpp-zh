  md: 'Declarations and Initialization (DCL) - DCL58-CPP. Do not modify the standard
    namespaces


    Do not add declarations or definitions to the standard namespaces std or posix,
    or to a namespace contained therein, except for a template specialization that
    depends on a user-defined type that meets the standard library requirements for
    the original template.


    The Library Working Group, responsible for the wording of the Standard Library
    section of the C++ Standard, has an unresolved issue on the definition of user-defined
    type. Although the Library Working Group has no official status on the definition
    [INCITS 2014], we define to be it any class, struct, union, or enum that is not
    defined within namespace std or a namespace contained within namespace std. Effectively,
    it is a user-provided type instead of a standard library-provided type.


