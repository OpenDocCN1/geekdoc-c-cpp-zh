  md: "# 5.4 CTR53-CPP. Use valid iterator ranges\n\nWhen iterating over elements\
    \ of a container, the iterators used must iterate over a valid range. An iterator\
    \ range is a pair of iterators that refer to the first and post-end elements of\
    \ the range respectively.\n\nA valid iterator range has all of the following characteristics:\n\
    \n+   * Both iterators refer into the same container.\n* The iterator representing\
    \ the start of the range precedes the iterator representing the end of the range.\n\
    * The iterators are not invalidated, in conformance with CTR51-CPP. Use valid\
    \ references, pointers, and iterators to reference elements of a container.\n\n\
    An empty range (where the two iterators are valid and equivalent) is considered\
    \ to be valid.\n\nUsing a range with two iterators that are invalidated or do\
    \ not refer to the same container results in undefined behavior.\n\n# 5.4.1 Noncompliant\
    \ Code Example\n\nIn this noncompliant case, the two iterators that delimit the\
    \ range point into its same container, but the first iterator does not precede\
    \ the second. On each iteration of its inner loop, std::for_each compares the\
    \ first iterator (after incrementing it) with the second for equality; as they\
    \ are not equal, it will continue to increment the first iterator. The iterator\
    \ representing the post-end element of the range results in undefined behavior.\n\
    \n```\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\nvoid f(const\
    \ std::vector<int> &c) {\n    std::for_each(c.end(), c.begin(), [] (int i) { std::cout\
    \ << i; });\n}\n```\n\nInvalid ranges can also arise from comparison functions\
    \ that return true for equal values. See CTR53-CPP. Provide a valid ordering predicate\
    \ for more information about comparators."
