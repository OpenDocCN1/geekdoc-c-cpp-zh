    # 2.2.1 Noncompliant Code Example (Header Guard)


    A common practice is to use a macro in a preprocessor conditional that guards
    against multiple inclusions of a header file. While this is a recommended practice,
    many programs use reserved names as header guards. Such a name may clash with
    reserved names defined by the implementation of C++ standard template in its headers
    or with reserved names implicitly defined by the compiler when no C++ standard
    library header is included.


    ```

    #ifndef MY_HEADER_H

    #define MY_HEADER_H_


    // Contents of <my_header.h>


    #endif // MY_HEADER_H

    ```


    # 2.2.2 Compliant Solution (Header Guard)


    This compliant solution avoids using leading or trailing underscores in the name
    of the header guard.


    ```

    #ifndef MY_HEADER_H

    #define MY_HEADER_H_


    // Contents of <my_header.h>


    #endif // MY_HEADER_H

    ```


    # 2.2.3 Noncompliant Code Example (User-Defined Literal)


    In this compliant code, a user-defined literal operator"" x is declared. However,
    literal suffix identifiers are required to start with an underscore; literal suffixes
    without the underscore prefix are reserved for future implementations.


    ```

    #include <cstddef>

    unsigned int operator"" x(const char *, std::size_t);

    ```


