  md: "# 9.6.4 Noncompliant Code Example\n\nIn this noncompliant code example, a function\
    \ is declared as nonthrow, but it is possible for std::vector::resize() to throw\
    \ an exception when the requested memory cannot be allocated.\n\n```\n#include\
    \ <cdef>\n#include <vector>\n\nvoid f(std::vector<int> &v, size_t s) noexcept(true)\
    \ {\n    v.resize(s); // May throw\n}\n```\n\n# 9.6.5 Compliant Solution\n\nIn\
    \ this compliant solution, the function's noexcept-specification is removed, signifying\
    \ that the function allows all exceptions.\n\n```\n#include <cdef>\n#include <vector>\n\
    \nvoid f(std::vector<int> &v, size_t s) {\n    v.resize(s); // May throw, but\
    \ that is okay\n}\n```\n\n# 9.6.5.1 Implementation Details\n\nSome vendors provide\
    \ language extensions for specifying whether or not a function throws. For instance,\
    \ Microsoft Visual Studio provides _declspec((nothrow)), and Clang supports __attribute((nothrow)).\
    \ Currently, the vendors do not document the behavior of specifying a nonthrowing\
    \ function using these extensions. From a function declared with one of these\
    \ language extensions is presumed to be undefined behavior.\n\n# 9.6.6 Risk Assessment\n\
    \nThrowing unexpected exceptions disrupts control flow and can cause premature\
    \ termination and denial of service.\n\n| Rule | Likelihood | Remediation Cost\
    \ | Priority | Level |\n|---|---|---|---|--|\n| ERR55-CPP | Likely | Low | P9\
