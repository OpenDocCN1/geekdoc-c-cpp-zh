  md: '# 7.5 MEM54-CPP. Provide placement new with properly aligned pointers to sufficient
    storage capacity


    When invoked by a new expression for a given type, the default global non-placement
    forms of C++ operator new attempt to allocate storage for an object of the type
    and, if successful, return a pointer alignment suitable for any object with a
    fundamental alignment requirement, however the placement new operator simply returns
    the pointer back to the caller without guaranteeing that there is sufficient space
    to construct the object or ensuring the pointer meets the proper alignment requirements.
    The C++ Standard, [expr.new], paragraph 16 [ISO/IEC 14882-2014], normatively states
    the following:


    > [Note: when the allocation function returns a value other than null, it must
    be a pointer to a block of storage in space for the object has been reserved.
    The block of storage is assumed to be appropriately aligned and of the requested
    size. The address of the created object will not necessarily be the same as that
    of the block if the object is an.—end note]


    (This is not a member of the general requirements specified by the C++ Standard,
    [basic.std.dynamic.allocation], paragraph 1, which applies to placement new operators
    by virtue of [basic.std:dynamic], paragraph 3.)


    In addition, the standard provides the following example later in the section:


    ```

    new(2, f) T[5] results in a call of operator new[](sizeof(T) * 5 + y, 2, f).

    ```


    Here,... and y are non-negative unspecified values representing array allocation
    overhead; the result of the new-expression will be offset by this amount from
    the value returned by operator new[]. This overhead may be applied in all new-expressions,
    those referencing the library function new[](std::size_t, void*) and other placement
    allocation functions. The amount of overhead may vary from one invocation to another.


    Do not pass a pointer that is not suitably aligned for the object being constructed
    new. Doing so results in an object being constructed at a misaligned location,
    which results in undefined behavior. Do not pass a pointer that has insufficient
    capacity for the object being constructed, including the overhead required for
    arrays. Doing so may result in initialization of memory outside of the bounds
    of the object being constructed, which results in undefined behavior.'
