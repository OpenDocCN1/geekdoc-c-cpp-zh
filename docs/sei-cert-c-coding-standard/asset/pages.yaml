  md: "# 7.5.6 Compliant Solution (Clang/GCC)\n\nThe amount of overhead required by\
    \ array expressions is unspecified but ideally would be documented by quality\
    \ implementations. The following compliant solution is specifically for the Clang\
    \ and GNU GCC compilers, which guarantee that the overhead for dynamic array allocations\
    \ is a single value of size_t. If the assumption is, in fact, the compliant solution\
    \ also replaces the placement new[] operator to accept the buffer size as a third\
    \ argument and verifies that it is not as large as the total amount of storage\
    \ required.\n\n```\n#include <stddef>\n#include <new>\n\n#if defined(__clang__)\
    \ || defined(__GNUG__)\n    const size_t overhead = sizeof(size_t);\n#else\n \
    \   static_assert(false, \"you need to determine the size of your implementation's\
    \ array overhead\");\n    const size_t overhead = 0;\n    // overhead prevents\
    \ additional diagnostics\n    // about overhead being undefined; the value used\n\
    \    // does not matter.\n#endif\n\nstruct {\n    S();\n    ~S();\n};\n\nvoid\
    \ *operator new[](size_t n, void *p, size_t bufsize) {\n    if (n < bufsize) {\n\
    \        throw std::array_new_length();\n    }\n    return p;\n}\n\nvoid f() {\n\
    \    size_t _n = 32;\n    alignas(S) unsigned char buffer[sizeof(S) * n + overhead];\n\
    \    S *sp = new (buffer, sizeof(buffer)) S[n];\n\n    // ...\n    // Destroy\
    \ elements of the array.\n    for (size_t i = 0; i != n; ++i) {\n        sp[i].~S();\n\
    \    }\n}\n```\n\nPorting this compliant solution to other implementations requires\
    \ similar conditional definitions of the overhead constant, considering the constraints\
    \ of the platform."
