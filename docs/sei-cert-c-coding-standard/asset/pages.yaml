  md: "# 9.2 ERR51-CPP. Handle all exceptions\n\nWhen an exception is thrown, control\
    \ is transferred to the nearest handler with a type that matches the type of the\
    \ exception thrown. If no matching handler is directly found within the handlers\
    \ for a try block in which the exception is thrown, the search for a matching\
    \ handler continues dynamically in the surrounding try blocks of the same thread.\
    \ The C++ Standard, [except.handle], paragraph 9 of [ISO/IEC 14882-2014], states\
    \ the following:\n\n> If no matching handler is found, the function std::terminate()\
    \ calls std::abort(), or the stack is unwound before this call to std::terminate()\
    \ is implementation-defined.\n\nThe default handler called by std::terminate()\
    \ calls std::abort(), which normally terminates the program. When: or if the implementation\
    \ does not unwind the stack prior to calling std::terminate(), destructors for\
    \ objects may not be called and resources can be left in an indeterminate state.\
    \ Abnormal process termination is the typical vector for denial-of-service attacks.\
    \ For more information on implicitly calling std::terminate(), see ERR50-CPP.\
    \ Do not abort the program.\n\nAll exceptions thrown by an application may be\
    \ caught by a matching exception handler. Even if the exception cannot be gracefully\
    \ recovered from, using the matching exception handler ensures that the stack\
    \ will be unwound and provides an opportunity to gracefully manage resources before\
    \ terminating the process.\n\nAs per ERR50-CPP-EI, a program that encounters an\
    \ unrecoverable exception may explicitly catch and terminate, but it may not allow\
    \ the exception to remain uncaught. One possible solution to comply this rule,\
    \ as well as with ERR50-CPP, is for the main() function to catch all exceptions.\
    \ While this does not generally allow the application to recover from the exception\
    \ gracefully, it also allows the application to terminate in a controlled fashion.\n\
    \n# 9.2.1 Noncompliant Code Example\n\nIn this noncompliant code, neither f()\
    \ nor main() catches exceptions thrown by throwing_func(). Because no matching\
    \ handler is found for the exception thrown, std::terminate() is called.\n\n```\n\
    void throwing_func() noexcept(false);\n\nvoid f() {\n    throwing_func();\n}\n\
    \nint main() {\n    f();\n}\n```"
  merge: -1
  pgno: 278
- img_proc: true
  md: "# 9.2.2 Compliant Solution\n\nIn this compliant solution, the main entry point\
    \ handles all exceptions, which ensures that the stack is unwound up to the main()\
    \ function and allows for graceful management of external resources.\n\n```\n\
    void throwing_func() noexcept(false);\n\nvoid f() {\n    throwing_func();\n}\n\
    \nint main() {\n    try {\n        f();\n    } catch (...) {\n        // Handle\
