  md: 'Expressions (EXP) - EXP50-CPP. Do not depend on the order of evaluation for
    side effects


    Do not allow the same object to appear in side effects or value computations in
    both halves of an unsequenced or indeterminately sequenced operation.


    The following expressions have sequencing restrictions that deviate from the usual
    unsequenced ordering **ISO/IEC 14882-2014:**


    +   - In postfix ++ and -- expressions, the value computation is sequenced before
    the modification of the operand. (expr.post.incr, paragraph 1)


    +   - In logical && expressions, if the second expression is evaluated, the first
    expression is sequenced before every value computation and side effect associated
    with the second expression. (expr.log.and, paragraph 2)


    +   - In logical || expressions, if the second expression is evaluated, every
    value computation and side effect associated with the first expression is sequenced
    before every value computation and side effect associated with the second expression.
    (expr.log.or, paragraph 2)


    +   - In conditional ?, every value computation and side effect associated with
    the first expression is sequenced before every value computation and side effect
    associated with the second or third expression (whichever is evaluated). (expr.cond,
    paragraph 1)


    +   - In assignment expressions (including compound assignments), the assignment
    is sequenced after the value computations of the left and right operands and before
    the value computation of the assignment expression. (expr.ass, paragraph 1)


    +   - In comma, every value computation and side effect associated with the left
    expression is sequenced before every value computation and side effect associated
    with the right. (expr.comma, paragraph 1)


    +   - When initializing objects, the initializer-clause is sequenced before every
    value computation and side effect associated with a subsequent initializer-clause.
    (decl.init.list, paragraph 4)


    +   - When a signal handler is executed as a result of std::raise(), the execution
    of the handler is sequenced after the invocation of std::raise() and before its
    return. (intro.exception, paragraph 6)


    +   - The completions of the destructors for all initialized objects with thread
    duration within a thread are sequenced before the destructors of any object with
    static storage duration. (basic.start.termi, paragraph 1)


    +   - In a new-expression, initialization of an allocated object is sequenced
    before the value computation of the new-expression. (expr.new, paragraph 18)


    +   - When a default constructor is called to initialize an element of an array
    and the constructor has at least one default element, the destruction of every
    temporary created in a default argument is sequenced before the construction of
    the next element, if any. (class.temporary, paragraph 4)


    +   - The destruction of a temporary whose lifetime is not extended by the destruction
    of every temporary that is constructed earlier in the same full-expression. (class.temporary,
    paragraph 5)


    +   - Atomic ordering functions can explicitly define the sequencing order for
    expressions. (atomic.order) and [atomic.fencing)


    SEI C++ CODING STANDARD (2016 EDITION) | V01

    Engineering Institute | Carnegie Mellon University

    [DISTRIBUTION STATEMENT A] Approved for public release and unlimited distribution.


