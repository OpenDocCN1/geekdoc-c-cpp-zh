  md: "# 6.4 STR553-CPP. Range check element access\n\nThe std::string index operators\
    \ const_reference operator[](size_type) const and reference operator[](size_type)\
    \ return the character stored at the specified position. When pos >= size, a reference\
    \ to an object of type charT value char() returns. Index operators are unchecked\
    \ (no exceptions are thrown for range errors), and attempting to modify the resulting\
    \ out-of-range object results in undefined behavior.\n\nSimilarly, the std::string::back()\
    \ and std::string::front() functions are unchecked as are defined to call through\
    \ to the appropriate operator[]() without throwing.\n\nDo not pass an out-of-range\
    \ value as an argument to std::string::operator[](). Similarly, do not call std::string::back()\
    \ or std::string::front() on an empty string. This rule is a specific instance\
    \ of CTR50-CPP. Guarantee that container indices and iterators within the valid\
    \ range.\n\n# 6.4.1 Noncompliant Code Example\n\nIn this noncompliant code example,\
    \ the value returned by the call to get_index() may be greater than the number\
    \ of elements stored in the string, resulting in undefined behavior.\n\n```\n\
    #include <string>\n\nextern std::size_t get_index();\n\nvoid f() {\n    std::string\
    \ s(\"01234567\");\n    s[get_index()] = '1';\n}\n```"
