  md: '# GCC


    GCC is an open source C and C++ compiler. More information can be found at

    https://gcc.nu.org/


    # ill-formed program [ISO/IEC 14882-2014]


    An ill-formed program is a C++ program that is not well-formed; that is, a program

    constructed according to the syntax rules, dynamic semantics, and the one-definition
    rule.


    # implementation [ISO/IEC 9899-2011]


    An implementation is a particular set of software, running in a particular translation
    environment,

    under particular controls, that performs translation of programs, and supports
    execution

    of functions, in a particular environment.


    # implementation-defined behavior [ISO/IEC 14882-2014]


    Implementation-defined behavior is behavior, for a well-formed program construct
    and correct

    data, that depends on the implementation and that each implementation documents.


    # incomplete type [ISO/IEC 14882-2014]


    A class that has been declared but not defined, an enumeration in certain contexts,
    an array of

    unknown size or incomplete element type, and the void type are incomplete types.
    These

    types lack the information to determine the size of the type.


    # indeterminate value [ISO/IEC 14882-2014]


    When storage is allocated with automatic or dynamic storage duration is lasted,
    the object has

    an indeterminate value, and if no initialization is performed for the object,
    object retains an

    indeterminate value until it is replaced.


    # invalid pointer


    An invalid pointer is a pointer that is not a valid pointer.


    # lib++


    lib++ is an open source Standard Template Library (STL) implementation. More information
    can

    be found at http://libc++.llvm.org/


    # libstdcc++


    libstdc++ is an open source Standard Template Library (STL) implementation. More
    information

    can be found at https://gcc.gnu.org/onlinedocs/libstdc++.


    # liveness


    Liveness is when every operation or method execution completes without

    interruptions, even if it goes against safety.


    # Ivalue [ISO/IEC 14882-2014]


    An Ivalue (so called, historically, because Ivalues could appear on the left-hand
    side of an

    assignment expression) designates a function or object.'
