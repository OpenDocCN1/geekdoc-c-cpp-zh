  md: "# 3.13.1 Noncompliant Code Example\n\nIn this noncompliant code example, the\
    \ complete object representation is accessed when comparing two objects of type\
    \ S. In the C++ [class], paragraph 13 [ISO/IEC 14882-2014], classes may be padded\
    \ with data to ensure they are properly aligned in memory. The contents of the\
    \ padding and the adding of padding is implementation-defined. This can lead to\
    \ incorrect results when comparing the object representation of classes instead\
    \ of the value representation, as the padding may assume different unspecified\
    \ values for each object instance.\n\n```\n#include <cstring>\nstruct S {\n  \
    \  unsigned char buffType;\n    int size;\n};\n\nvoid f(const S &s1, const S &s2)\
    \ {\n    if (!std::memcmp(&s1, &s2, sizeof(S))) {\n        // ...\n    }\n}\n\
    ```\n\n# 3.13.2 Compliant Solution\n\nIn this compliant solution, S overloads\
    \ operator==() to perform a comparison of the value representation of the object.\n\
    \n```\nstruct S {\n    unsigned char buffType;\n    int size;\n};\n\nfriend bool\
    \ operator===(const S &lhs, const S &rhs) {\n    return lhs.buffType == rhs.buffType\
    \ &&\n           lhs.size == rhs.size;\n}\n\nvoid f(const S &s1, const S &s2)\
    \ {\n    if (s1 == s2) {\n        // ...\n    }\n}\n```"
