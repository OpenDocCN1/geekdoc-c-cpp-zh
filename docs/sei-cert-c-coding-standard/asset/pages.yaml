  md: "# 7.5.5 Noncompliant Code Example (Failure to Account for Array Overhead)\n\
    \nThis noncompliant code example attempts to allocate sufficient storage of the\
    \ appropriate alignment for the objects of S. However, it fails to account for\
    \ the overhead that an implementation may add to the amount of storage for array\
    \ objects. The overhead (commonly referred to as a cookie) is necessary to store\
    \ the number of elements in the array so that the array delete expression or the\
    \ exception unwinding mechanism can invoke the type's destructor on successfully\
    \ constructed element of the array. While some implementations are able to avoid\
    \ allocating space for the cookie in some situations, assuming they do in all\
    \ cases is unsafe.\n\n```\n#include <new>\n\nstruct S {\n  S();\n  ~S();\n};\n\
    \nvoid f() {\n  const unsigned N = 32;\n  alignas(S) unsigned char buffer[sizeof(S)\
    \ * N];\n  S *sp = new (buffer) S[N];\n\n  // Destroy elements of the array.\n\
    \  for (size_t i = 0; i != n; ++i) {\n    sp[i].~S();\n  }\n}\n```"
