  md: "# 3.4.3 Noncompliant Code Example\n\nIn this noncompliant code example, an\
    \ int * object is allocated by a new-expression, but the memory it points to is\
    \ not initialized. The object's pointer value and the value it points to are printed\
    \ to the standard output stream. Printing the pointer value is well-defined, but\
    \ attempting to print the value yields an indeterminate value, resulting in undefined\
    \ behavior.\n\n```\n#include <iostream>\nvoid f() {\n    int *i = new int;\n \
    \   std::cout << i << \" \" << *i;\n}\n```\n\n# 3.4.4 Compliant Solution\n\nIn\
    \ this compliant solution, the memory is direct-initialized to the value 12 before\
    \ printing its value.\n\n```\n#include <iostream>\nvoid f() {\n    int *i = new\
    \ int(12);\n    std::cout << i << \" \" << *i;\n}\n```\n\nInitialization of an\
    \ object produced by a new-expression is performed by placing (possibly empty)\
    \ parenthesis or braces after the type being allocated. This causes direct initialization\
    \ of the pointed-to-object to occur, which will zero-initialize the object if\
    \ the initialization lacks a value, as illustrated by the following code.\n\n\
    ```\nint *i = new int(); // zero-initializes *i\nint *j = new int(); // zero-initializes\
    \ *j\nint *k = new int(12); // initializes *k to 12\nint *l = new int(12); //\
    \ initializes *l to 12\n```"
