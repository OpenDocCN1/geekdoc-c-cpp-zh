  md: '# 7.6 MEM55-CPP. Honor replacement dynamic storage management requirements


    Dynamic memory allocation and deallocation functions can be globally replaced
    by custom implementations, as [replacement.functions], paragraph 2, of the C++
    Standard [ISO/IEC 14822-2014]. For instance, a user may profile the dynamic memory
    usage of an application and decide that the default allocator is not optimal for
    their usage pattern, and a different allocation strategy be a marked improvement.
    However, the C++ Standard, [res.on.functions], paragraph 1, states the following:


    In certain cases (replacement functions, handler functions, operations on types
    used to instantiate standard library template components), the C++ standard library
    depends on the components supplied by a C++ program. If these components do not
    meet their requirements, the Standard places no requirements on the implementation.


    Paragraph 2 further, in part, states the following:


    +   In particular, the effects are undefined in the following cases:

    * for replacement functions, if the installed replacement function does not implement
    the semantics of the applicable *Required behavior*: paragraph.


    A replacement for any of the dynamic memory allocation or deallocation functions
    must meet the semantic requirements specified by the appropriate *Required behavior*:
    clause of the replaced function.'
