  md: "# 9.4 ERR53-CPP. Do not reference base classes or class data members in a constructor\
    \ or destructor function-try-block handler\n\nWhen an exception is caught by a\
    \ function-try-block handler in a constructor, any fully constructed classes and\
    \ class members of the object are destroyed prior to entering the handler [ISO/IEC\
    \ 14882-2014]. Similarly, when an exception is caught by a function-try-block\
    \ handler in a destructor, all base classes and nonvariant members of the objects\
    \ are destroyed prior to entering the handler. Because of this behavior, the C++\
    \ Standard, [except.handle], paragraph 10, states the following:\n\n+   Referring\
    \ to any non-static member or base class of an object in the handler for a function-try-block\
    \ of a constructor or destructor for that object results in undefined behavior.\n\
    \nDo not reference base classes or class data members in a constructor or destructor\
    \ function-try-block handler. Doing so results in undefined behavior.\n\n# 9.4.1\
    \ Noncompliant Code Example\n\nIn this noncompliant code example, the constructor\
    \ for class C handles exceptions with a function-try-block. it generates undefined\
    \ behavior by inspecting its member field str.\n\n```\n#include <string>\n\nclass\
    \ C {\n  std::string str;\n\npublic:\n  C(const std::string &s) : str(s) (\n \
    \   // ...\n  ) catch (...) {\n    if (!str.empty()) {\n      // ...\n    }\n\
    \  }\n}\n```\n\n![](img/03d7c1b3f34ef4416e38a33cdad88644_285_0.png)"
