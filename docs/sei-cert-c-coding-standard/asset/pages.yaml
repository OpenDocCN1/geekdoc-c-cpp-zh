  md: "# 13.13.3 Noncompliant Code Example\n\nIn this noncompliant code example, std::memset()\
    \ is used to clear the internal state of an object. An implementation may store\
    \ a variable within the object instance due to the presence of a virtual function,\
    \ and that variable is subsequently overwritten by the call to std::memset(),\
    \ leading to undefined behavior when virtual method dispatch is required.\n\n\
    ```\n#include <cstring>\n\nstruct S {\n    int i, j, k;\n\n    // ...\n\n    virtual\
    \ void f();\n};\n\nvoid f() {\n    S *s = new S;\n    // ...\n    std::memset(s,\
    \ 0, sizeof(S));\n    // ...\n    s->f(); // undefined behavior\n}\n```\n\n# 13.13.4\
    \ Compliant Solution\n\nIn this compliant solution, the data members of S are\
    \ cleared explicitly instead of calling std::memset().\n\n```\nstruct S {\n  \
    \  int i, j, k;\n\n    // ...\n\n    virtual void f();\n    void clear() { i =\
    \ j = 0; }\n};\n\nvoid f() {\n    S *s = new S;\n    // ...\n    s->clear();\n\
    \    // ...\n    s->f(); // ok\n}\n```"
