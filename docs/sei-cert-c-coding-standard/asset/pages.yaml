  md: '# 9.10 ERR59-CPP. Do not throw an exception across execution boundaries


    Throwing an exception requires collaboration between the execution of the `throw`
    expression and the passing of control to the opposite `catch` statement, if one
    applies. This collaboration takes the form of runtime logic used to calculate
    the correct handler for the exception and is an implementation detail specific
    to the platform. For code compiled by a C++ compiler, the details of how to throw
    and catch can be safely ignored. However, when throwing an exception across execution
    boundaries, care must be taken to ensure the runtime logic used is compatible
    with differing sides of the execution boundary.


    An execution boundary is the delimitation between code compiled by differing compilers,
    including differing versions of a compiler produced by the same vendor. For instance,
    a function may be declared in a header file but in a library that is loaded at
    runtime. The execution boundary is between the call site in the executable and
    the function implementation in the library. Such boundaries are also called ABI
    (application binary interface) boundaries because they relate to the interoperability
    of application binaries.


    Throw an exception across an execution boundary only when both sides of the execution
    boundary use the same ABI for exception handling.


    # 9.10.1 Noncompliant Code Example


    In this noncompliant code example, an exception is thrown from a library function
    to signal an error. Despite the exception being a scalar type (and thus implicitly
    conforming to `EXP60-CPP.Do not pass a non-layout type object across execution
    boundaries`), this code can still result in abnormal program execution if the
    library and application adhere to different ABIs.'
