  md: '# Introduction - How this Coding Standard Is Organized


    Where possible, we try to reference the exact version of the tool for which the
    results were obtained. Because these tools evolve continuously, this information
    can rapidly become dated and obsolete.


    # 1.4.6 Related Vulnerabilities


    The risk assessment systems in the wiki also contain a link to search for related
    vulnerabilities on the CERT website. Whenever possible, CERT Vulnerability Notes
    are tagged with a keyword corresponding to the unique ID of the coding standard.
    This search provides you with an up-to-date list of real-world vulnerabilities
    that have been determined to be at least caused by a violation of this specific
    guide. These vulnerabilities are labeled as such only when the vulnerability analysis
    team is able to evaluate the source code and precisely determine the cause of
    the vulnerability. Because many vulnerability notes refer to vulnerabilities in
    closed-source systems, it is not always possible to provide this additional analysis.
    Consequently, the related vulnerability fields tend to be somewhat sparsely populated.


    Related vulnerability sections are included only for specific rules in the standard,
    when the information is both relevant and interesting.


    # 1.4.7 Related Guidelines


    The related guidelines sections contain links to guidelines in standards, technical
    specifications, and guideline collections such as *Information Technology—Programming
    Languages, Their Environments and System Software Interfaces—C Secure Coding Rules
    [ISO/IEC TS 17962:2021]; Information Technology—Programming Languages—Guidance
    to Avoiding Vulnerabilities in Programming Languages through Language Selection
    and Use [ISO/IEC TR 24772:2013]; MISRA C++ 2008: Guidelines for the Use of the
    C++ Language in Critical Systems [MISRA 2008];* and CWE IDs in *MITRE’s Common
    Weakness Enumeration (CWE) [MITRE 2010].


    You can create a URL to get more information on CWEs by appending the relevant
    ID to CWE. For example, to find more information about "CWE-192: Integer Coercion
    Error," you can append 192.html to http://cwe.mitre.org/data/definitions/ and
    enter the resulting URL in your browser: http://cwe.mitre.org/data/definitions/192.html.


    The other referenced technical specifications, technical reports, and guidelines
    are commercially available.


    # 1.4.8 Bibliography


    Most guidelines have a small bibliography section that lists documents and sections
    in documents that provide information relevant to the guideline.'
