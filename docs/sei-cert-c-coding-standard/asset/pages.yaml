- img_proc: true
  md: '# valid pointer


    A valid pointer is a pointer that refers to an element within an array or past
    the last element of an array. For the purposes of this definition, a pointer to
    an object that is not an element of an array behaves the same as a pointer to
    the first element of an array of length with the type of the object as its element
    type. For the purposes of this definition, an object can be considered to be an
    array of a certain number of bytes; that number is the size of the object, as
    produced by the sizeof operator.


    # vtable


    A vtable is a common implementation technique to support dynamic method dispatch,
    where a class instance includes a hidden data member that is a pointer to an array
    of function pointers to resolve virtual function calls at runtime.


    # vulnerability [Seacord 2005]


    A vulnerability is a set of conditions that allows an attacker to violate an explicit
    or implicit security policy.


    # warning message


    A warning message is a diagnostic message generated when source code is encountered
    that does not prevent an implementation from translating a translation unit. (See
    diagnostic message and error message.)


    # well-formed program [ISO/IEC 14882-2014]


    A well-formed program is a C++ program constructed according to the syntax rules,
    diagnostic semantic rules, and the one-definition rule. (See also ill-formed program.)


    # xvalue [ISO/IEC 14882-2014]


    An xvalue ("Expiring" value) also refers to an object, usually near the end of
    its lifetime that resources may be moved, for example). An xvalue is the result
    of certain kinds of expressions involving rvalue references.'
