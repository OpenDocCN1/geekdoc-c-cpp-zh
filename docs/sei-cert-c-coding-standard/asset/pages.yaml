  md: "# 6.3 STR52-CPP. Use valid references, pointers, and iterators to reference\
    \ elements of a basic_string\n\nSince std::basic_string is a container of characters,\
    \ this rule is a specific instance of CTR51-CPP. Use valid references, pointers,\
    \ and iterators to reference a container. As a container, it supports iterators\
    \ like other containers in the Standard Template Library. However, the std::basic_string\
    \ template class has unusual semantics. The C++ [Standard, require], paragraph\
    \ 5 [ISO/IEC 14882-2014], states the following:\n\n+   References, pointers, and\
    \ iterators referring to the elements of a basic_string sequence may be invalidated\
    \ by the following uses of basic_string object:\n\n+   As an argument to any standard\
    \ library function taking a reference to non-const basic_string as an argument.\n\
    \n+   Calling non-const member functions, except operator(),,at, front, back,\
    \ begin, rbegin, end, and rend.\n\nExamples of standard library function taking\
    \ a reference to non-const std::basic_string is std::swap(), ::operator>>(basic_istream\
    \ &, string&), and std::getline().\n\nDo not use an invalidated reference, pointer,\
    \ or iterator doing so results in undefined behavior.\n\n# 6.3.1 Noncompliant\
    \ Code Example\n\nThis noncompliant code example copies input into a std::string,\
    \ replacing semicolon (;) characters with spaces. This example is noncompliant\
    \ because the iterator loc is invalidated after the first call to insert(). The\
