  md: "# 12.2 MSC51-CPP. Ensure your random number generator is properly seeded\n\n\
    Pseudorandom number generator (PRNG) is a deterministic algorithm capable of generating\
    \ sequences of numbers that approximate the properties of random numbers. Each\
    \ sequence is completely determined by the initial state of the PRNG and the algorithm\
    \ for changing the state. Most PRNGs make possible to set the initial state, also\
    \ called the seed state. Setting the initial state is called seeding the PRNG.\n\
    \nCalling a PRNG in the same initial state, without seeding it explicitly or by\
    \ seeding with a constant value, results in the same sequence of random numbers\
    \ in different runs of the program. A PRNG function that is seeded with some initial\
    \ seed value and is consecutively called to produce a sequence of random numbers.\
    \ If the PRNG is subsequently seeded with the same initial seed value, then it\
    \ will generate the same sequence.\n\nConsequently, the first run of an properly\
    \ seeded PRNG, an attacker can predict the sequence of random numbers that will\
    \ be generated in the future runs. Improperly seeding or failing to seed the PRNG\
    \ can lead to vulnerabilities, especially in security protocols.\n\nThe solution\
    \ is to ensure that a PRNG is always seeded with an initial seed value that will\
    \ not be predictable or controllable by an attacker. A properly seeded PRNG will\
    \ generate a different sequence of random numbers each time it is.\n\nNot all\
    \ random number generators can be seeded. True random number generators that rely\
    \ on hardware to produce unpredictable results do not need to be seeded and some\
    \ high-quality PRNGs, such as the /dev/random device on UNIX systems, also cannot\
    \ be seeded. This rule applies only to algorithmic PRNGs that can be seeded.\n\
    \n# 12.2.1 Noncompliant Code Example\n\nThis noncompliant code example generates\
    \ a sequence of 10 pseudorandom numbers using the Mersenne Twister engine. No\
    \ matter how many times this code is executed, it always produces the same sequence\
    \ because the default seed is used for the engine.\n\n```\n#include <random>\n\
    #include <iostream>\n\nvoid f() {\n    std::mt19937 engine;\n\n    for (int i\
    \ = 0; i < 10; ++i) {\n        std::cout << engine() << \" \\ \";\n    }\n}\n\
    ```"
