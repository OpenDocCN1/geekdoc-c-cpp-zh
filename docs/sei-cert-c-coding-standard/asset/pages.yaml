    # ## 1.6 Rules Versus Recommendations


    CERT coding standards consist of rules and recommendations. Rules are meant to
    provide normative requirements for code; recommendations are meant to provide
    guidance that, when followed, should improve reliability, and security of software
    systems. However, a violation of a recommendation does not necessarily indicate
    the presence of a defect in the code. Rules and recommendations are collectively
    referred to as guidelines.


    # ### 1.6.1 Rules


    Rules must meet the criteria:


    +   1. Violation of the guideline is likely to result in a defect that may adversely
    affect the safety, reliability, or security of a system, for example, introducing
    a security flaw that may result in an exploitable vulnerability.


    +   2. The guideline does not rely on source code annotations or assumptions.


    +   3. Conformance to the guideline can be determined through automated analysis
    (either static or dynamic), formal methods, or manual inspection techniques.


    # ### 1.6.2 Recommendations


    Recommendations are suggestions for improving code quality. Guidelines are defined
    to be recommendations when all of the following conditions are met:


    +   1. Application of a guideline is likely to improve the safety, reliability,
    or security of software systems.


    +   2. One or more of the requirements necessary for a guideline to be considered
    a rule cannot be met.


    The set of recommendations that a particular development effort depends on the
    requirements of the final software product. Projects with stricter requirements
    may decide to dedicate more resources to ensuring the safety, reliability, and
    security of a system and consequently are likely to adopt a broader set of recommendations.'
