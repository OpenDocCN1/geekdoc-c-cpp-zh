  md: "# 5.7 CTR56-CPP. Do not use pointer arithmetic on polymorphic objects\n\nThe\
    \ definition of pointer arithmetic from the C++ Standard, [expr.add], paragraph\
    \ 7 [ISO/IEC 14882-2014], states the following:\n\n> For addition or subtraction,\
    \ the expressions P or Q have \"pointer to cv T\", where T is different from the\
    \ cv-unqualified array element type, the behavior is undefined. [Note: In particular,\
    \ a pointer to a base class cannot be used for pointer arithmetic when the array\
    \ contains objects of a derived class type.—end note]\n\nPointer arithmetic does\
    \ not account for polymorphic size, and attempting to perform pointer arithmetic\
    \ on a polymorphic object results in undefined behavior.\n\nThe C++ Standard,\
    \ [expr.sub], paragraph 1 [ISO/IEC 14882-2014], defines array subscripting as\
    \ being identical to pointer arithmetic. Specifically, it states the following:\n\
    \n+   The expression E1 [E2] is identical (by definition) to * ((E1) + (E2)).\n\
    \nDo not use pointer arithmetic, including array subscripting, over polymorphic\
    \ objects.\n\nThe following code example assumes the following static variables\
    \ and polymorphic definitions.\n\n```\nint globI;\ndouble globD;\n\nstruct S {\n\
    \    int i;\n    \n    S() : i(globI++) {}\n};\n\nstruct T : S {\n    double d;\n\
    \n    T() : S(), d(globD++) {}\n};\n```"
