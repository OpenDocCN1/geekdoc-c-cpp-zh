  md: '# 9.8 ERR557-CPP. Do not leak resources when handling exceptions


    Reclaiming resources when exceptions are thrown is important. An exception being
    thrown may result in cleanup code being bypassed or an object being left in a
    partially initialized state. Such a partially initialized object would violate
    basic exception safety, as described in ERR557-CPP Guarantee exception safety.
    It is preferable that resources be reclaimed automatically, using RAII design
    pattern [Stroustrup 2001], when objects go out of scope. This technique avoids
    the need to write cleanup code when allocating resources.


    However, constructors do not offer the same protection. Because a constructor
    is involved in allocating resources, it does not automatically free any resources
    if it terminates prematurely. The C++ Standard [except], paragraph 2 [ISO/IEC
    14888-2014], states the following:


    +   An object of any storage initialization or destruction is terminated by an
    exception will have destructors executed for all of its fully constructed subobjects
    (excluding the variant members of a union-like class), that is, for subjects for
    which the principal constructor (12.6.2) has completed execution and the destructor
    has not yet begun execution. Similarly, if the non-delegating constructor for
    an object has completed execution and a delegating constructor for that exits
    with an exception, the object''s destructor will be invoked. If the object was
    allocated in a new-expression, the matching deallocation function (3.7.4.2, 5.3.4,
    12.5), if any, is called to free the storage occupied by the object.


    It is generally recommended that constructors that cannot complete their job should
    throw exceptions rather than exit and leave their object in an incomplete state
    [Cline 2009].


    Resources must not be leaked as a result of throwing an exception, including during
    the construction of an object.


    This rule is a subset of MEM51-CPP.Properly deallocate allocated resources, as
    all failures to deallocate resources violate that rule.'
