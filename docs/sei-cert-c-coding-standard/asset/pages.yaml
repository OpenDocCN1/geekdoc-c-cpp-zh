  md: "# 5.6 CTR55-CPP. Do not use an additive operator on an iterator if the result\
    \ would overflow\n\nExpressions that have integral type can be added to or subtracted\
    \ from a pointer, resulting in a value of the pointer type. If the resulting pointer\
    \ is not a valid member of the container, or past the last element of the container,\
    \ the additive operator is undefined. The C++ Standard, [expr.add], paragraph\
    \ 5 [ISO/IEC 14882-2014], in part, states the following:\n\n> If both the pointer\
    \ and the element point elements of the same array object, or past the last element\
    \ of the array object, the evaluation shall not produce an overflow; otherwise,\
    \ the behavior is undefined.\n\nBecause iterators are a generalization of pointers,\
    \ the same constraints apply to additive operators with random access iterators.\
    \ Specifically, the C++ Standard, [itator.requirements.general], paragraph 5,\
    \ states that:\n\n> Just as the regular pointer to array guarantees that there\
    \ is a pointer value past the last element of the array, so for any iterator type\
    \ there is an iterator value that points the last element of a corresponding sequence.\
    \ These values are called postthe-end. Values of an iterator for which the expression\
    \ *i is defined are called dereferenceable. The library never assumes that past-the-end\
    \ values are dereferenceable.\n\nDo not allow expression of integral type to add\
    \ or subtract from a pointer or random access iterator when the resulting value\
    \ would overflow bounds of the container.\n\n# 5.6.1 Noncompliant Code Example\
    \ (std::vector)\n\nIn this noncompliant code example, a random access iterator\
    \ from std::vector is used in an additive expression, but the resulting value\
    \ could be outside the bounds of the container rather than a past-the-end value.\n\
    \n```\n#include <iostream>\n#include <vector>\nvoid f(const std::vector<int>&\
    \ c) {\n  for (auto i = c.begin(), e = i + 20; i != e; ++i) {\n    std::cout <<\
    \ *i << std::endl;\n  }\n}\n```"
