  md: '# 5.9 CTR58-CPP. Predicate function objects should not be mutable


    The C++ standard library imports numerous common algorithms that accept a predicate
    function object. The C++ Standard, [algorithms.general], paragraph 10 [ISO/IEC
    14882-2014], states the following:


    > > [Note: Unless otherwise specified, algorithms that take function objects as
    arguments are permitted to copy those function objects freely. Programmers for
    whom object identity is important should consider using a wrapper class that points
    to a noncopied implementation object such as reference_wrapper<T>, or some equivalent
    solution. — end note]


    Because it is implementation-defined whether an algorithm copies a predicate function
    object, any such object must either


    +   - implement a function call operator that does not mutate state related to
    the function object''s identity, as nonstatic data members or captured values,

    - wrap the predicate function object in a std::reference_wrapper<T> (or an equivalent
    solution).


    Marking the function call operator as const is beneficial, but insufficient, because
    data members with the mutable storage class specifier may still be modified within
    a const member function.'
