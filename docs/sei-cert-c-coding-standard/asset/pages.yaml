  md: "# 5.3.2 Compliant Solution (Sufficient Initial Capacity)\n\nThe proper way\
    \ to use std::copy() is to ensure the destination container can hold all the elements\
    \ being copied to it. This compliant solution enhances the capacity of the vector\
    \ prior to the copy operation.\n\n```\n#include <algorithm>\n#include <vector>\n\
    void f(const std::vector<int> &src) {\n    // Initialize dest with src.size()\
    \ default-inserted elements\n    std::vector<int> dest(src.size());\n    std::copy(src.begin(),\
    \ src.end(), dest.begin());\n}\n```\n\n# 5.3.3 Compliant Solution (Per-Element\
    \ Growth)\n\nAn alternative approach is to use std::back_insert_iterator as the\
    \ destination argument. This iterator expands the container by one element for\
    \ each element supplied by the algorithm, which guarantees the destination container\
    \ will become sufficiently large to hold the elements provided.\n\n```\n#include\
    \ <algorithm>\n#include <iterator>\n#include <vector>\nvoid f(const std::vector<int>\
    \ &src) {\n    std::vector<int> dest;\n    std::copy(src.begin(), src.end(), std::back_inserter(dest));\n\
    }\n```\n\n# 5.3.4 Compliant Solution (Assignment)\n\nThe simplest solution is\
    \ to construct dest from src directly, as in this compliant solution.\n\n```\n\
    #include <vector>\nvoid f(const std::vector<int> &src) {\n    std::vector<int>\
    \ dest(src);\n    // ...\n}\n```"
