  md: "# 7.3 MEM52-CPP. Detect and handle memory allocation errors\n\nThe default\
    \ memory allocation operator, :operator new(std::size_t), throws a std::bad_alloc\
    \ exception if the allocation fails. Therefore, you need not check whether calling\
    \ :operator new(std::size_t) results in nullptr. The notthrowing form, :operator\
    \ new(std::size_t, const std::nothrow), does not throw an exception if the allocation\
    \ fails but instead returns nullptr. The same behaviors apply for the operator\
    \ new[] functions of both allocation functions. Additionally, the default object(std::allocator)\
    \ uses :operator new(std::size_t) to perform allocations and should be treated\
    \ properly.\n\n+   * *p1 = new T; // Throws::bad_alloc if allocation fails\nT*p2\
    \ = new (std::nothrow) T; // Returns nullptr if allocation fails\nT*p3 = new T[1];\
    \ // Throws::bad_alloc if the allocation fails\nT*p4 = new (std::nothrow) T[1];\
    \ // Returns nullptr if the allocation fails\n\nFurthermore, operator new[] can\
    \ throw an error of type\nstd::bad_array_new_length, a subclass of std::bad_alloc,\
    \ if the argument passed to new is negative or excessively large.\n\nWhen using\
    \ the notthrowing form, it is imperative to check that the return value is nullptr\
    \ before accessing the resulting pointer. When using either form, be to comply\
    \ with ERR50-CPP. Do not terminate the program.\n\n# 7.3.1 Noncompliant Code Example\n\
    \nIn thiscompliant code example, an array of int is created using :operator new[](std::size_t)\
    \ and the results of the allocation are not checked. The function is marked as\
    \ noexcept, so the caller assumes this function does not throw any exceptions.\
    \ Because :operator new[](std::size_t) can throw an exception if the allocation\
    \ fails, it could lead to abnormal termination of the program.\n\n```\n#include\
    \ <cstring>\nvoid f(const int *array, std::size_t size) noexcept {\n    int *copy\
    \ = new int[size];\n    std::memcpy(copy, array, size * sizeof(*copy));\n    //\
    \ ...\n    delete [copy];\n}\n```"
