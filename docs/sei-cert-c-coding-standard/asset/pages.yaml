  md: "# 5.3 CTR52-CPP. Guarantee library functions do not overflow\n\nCopying data\
    \ into a container that is not large enough to hold that data results in a buffer\
    \ overflow. To prevent such errors, copied to the destination container must be\
    \ restricted on the basis of the destination container's size, or preferably,\
    \ the destination container must be guaranteed to be large enough to hold the\
    \ data to be copied.\n\nVulnerabilities result from copying data to an undersized\
    \ buffer can also involve null-terminated strings. Consider STR50-CPP. Guarantee\
    \ that storage for strings has sufficient space for character data and the null\
    \ terminator for specific examples of this rule that involves overflow.\n\nCopies\
    \ may be made with std::memcpy. However, the std::memmove() and std::memmove functions\
    \ also have the same vulnerabilities because they may overflow without checking\
    \ that the block is valid. Such issues are not limited to C standard libraries;\
    \ standard template library (STL) generic algorithms, such as std::copy(), std::fill(),\
    \ and std::transform(), also assume valid output buffer sizes [ISO/IEC 14882-2014].\n\
    \n# 5.3.1 Noncompliant Code Example\n\nSTL containers can be subject to the same\
    \ vulnerabilities as array data types. The std::copy() algorithm provides no inherent\
    \ bounds checking and can lead to a buffer overflow. In this noncompliant code\
    \ example, a vector of integers is copied from src using dest std::copy(); Because\
    \ std::copy does nothing to expand the dest vector, the program will overflow\
    \ the container on the first element.\n\n```\n#include <algorithm>\n#include <vector>\n\
    \nvoid f(const std::vector<int> &src) {\n    std::vector<int> dest;\n    std::copy(src.begin(),\
    \ src.end(), dest.begin());\n    // ...\n}\n```\n\nThis hazard applies to any\
    \ algorithm that takes a destination iterator, expecting to fill it with values.\
    \ Most of the STL algorithms expect the destination container to have sufficient\
    \ space to hold the values provided."
