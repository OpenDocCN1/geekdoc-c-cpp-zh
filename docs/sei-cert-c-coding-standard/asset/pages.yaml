  md: '# Priorities and Levels


    | Level | Priorities | Possible Interpretation |

    |---|---|--|

    | L1 | 12, 18 | High severity, likely, inexpensive to repair |

    | L2 | 6, 9 | Medium severity, probable, medium cost to repair |

    | L3 | 1, 2, 3, 4 | Low severity, unlikely, expensive to repair |


    Specific projects may be remedied by implementing all rules at a particular level
    before proceeding to the lower priority rules, as shown in the following illustration:


    ![](img/03d7c1b3f34ef4416e38a33cdad88644_12_0.png)


    Recommations are not compulsory and are provided for information purposes only.


    # 1.4.5 Automated Detection


    On the wiki, both rules and recommendations frequently have sections that describe
    automated detection. These sections provide additional information on analyzers
    that can automatically diagnose violations of coding guidelines. Most analyses
    for the C++ programming language are neither sound nor complete, the inclusion
    of a tool in this section typically means that the tool can diagnose some violations
    of this particular rule. The Secure Coding Validation Suite be used to test the
    ability of analyzers to diagnose violations of rules from ISO/IEC TS 17961:2012,
    which is related to the rules of the SEI CERT C Coding Standard.


    The information in the automated detection sections on the wiki may be


    +   * provided by the vendors

    * determined by CERT by initially evaluating the analyzer

    * determined by CERT by reviewing the vendor documentation'
