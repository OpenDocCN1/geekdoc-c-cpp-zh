  md: "# 2.6.4 Compliant Solution (Padding Bytes)\n\nPadding bits can be explicitly\
    \ declared as fields within the structure. This solution is not portable, however,\
    \ because it depends on the implementation and target memory architecture. The\
    \ following solution is specific to the x86-32 architecture.\n\n```\n#include\
    \ <cstddef>\n\nstruct test {\n    int a;\n    char b;\n    char padding_1, padding_2,\
    \ padding_3;\n    int c;\n};\n\ntest(int a, char b, int c) {\n    a(a), b(b),\n\
    \    padding_1(0), padding_2(0), padding_3(0),\n    c(c);\n}\n// Ensure c is the\
    \ next byte after the last padding byte.\nstatic_assert(offset(test, c) == offsetof(test,\
    \ padding_3) + 1, \"Object contains intermediate padding\");\n// Ensure there\
    \ is no trailing padding.\nstatic_assert(sizeof(test) == offset(test, c) + sizeof(int),\
    \ \"Object contains trailing padding\");\n\n// Safely copy bytes to user space.\n\
    extern int copy_to_user(void *dest, void *src, std::size_t size);\n\nvoid do_stuff(void\
    \ *usr_buf) {\n    test arg(1, 2, 3);\n    copy_to_user(usr_buf, &arg, sizeof(arg));\n\
    }\n```\n\nThe static_assert() declaration accepts an expression and an error message.\
    \ The expression is evaluated at compile time and, if false, the compilation is\
    \ terminated and the error message is used as the dialog. The explicit insertion\
