  md: "# 12.4 MSC53-CPP. Do not return from a function declared [[noreturn]]\n\nThe\
    \ [[noreturn]] attribute specifies that a function does not return. The C++ Standard,\
    \ [decl.attr::noreturn] paragraph 2 [ISO/IEC 14882-2014], states the following:\n\
    \n> If a function is called where f was previously declared with the noreturn\
    \ attribute and eventually returns, the behavior is undefined.\n\nA function that\
    \ specifies [[noreturn]] can prohibit returning by throwing an exception, entering\
    \ an infinite loop, or calling another function designated with the [[noreturn]]\
    \ attribute.\n\n# 12.4.1 Noncompliant Code Example\n\nIn this noncompliant example,\
    \ if the value 0 is passed, control flow will fall off the end of the function,\
    \ resulting in an implicit return and undefined behavior.\n\n```\n#include <cstdlib>\n\
    \n[[noreturn]] void f(int i) {\n    if (i > 0)\n        throw \"Received positive\
    \ input\";\n    else if (i < 0)\n        std::exit(0);\n}\n```\n\n# 12.4.2 Compliant\
    \ Solution\n\nIn this compliant solution, the function does not return on any\
    \ code path.\n\n```\n#include <cstdlib>\n\n[[noreturn]] void f(int i) {\n    if\
    \ (i > 0)\n        throw \"Received positive input\";\n    std::exit(0);\n}\n\
    ```\n\n# 12.4.3 Risk Assessment\n\nReturning from a function marked [[noreturn]]\
    \ results in undefined behavior that might be exploited to cause data-integrity\
    \ violations.\n\n| Rule | Severity | Likelihood | Remediation Cost | Priority\
    \ | Level |\n|---|---|---|---|---|-|\n| MSC53-CPP | Medium | Unlikely | Low |\
    \ P2 | L3 |"
