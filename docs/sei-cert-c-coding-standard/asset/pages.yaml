  md: "Memory Management (MEM) - MEM53-CPP. Explicitly construct and destruct objects\
    \ when manually managing object lifetime\n\nconstruct() function of an allocator\
    \ object. An object can be destroyed either by calling the destructor explicitly\
    \ or by calling the destroy() function of an allocator object.\n\n# 7.4.1 Noncompliant\
    \ Code Example\n\nIn this noncompliant code example, a class with nontrivial initialization\
    \ (due to the presence of a user-provided constructor) is created with a call\
    \ to std::malloc(). However, the constructor for the object is never called, resulting\
    \ in undefined behavior when the class is later accessed by s->f().\n\n```\n#include\
    \ <cstdlib>\n\nstruct S {\n  S();\n  void f();\n};\n\nvoid g() {\n  S *s = static_cast<S\
    \ *>(std::malloc(sizeof(S)));\n  s->f();\n  std::free(s);\n}\n```\n\n# 7.4.2 Compliant\
    \ Solution\n\nIn this compliant solution, the constructor and destructor are both\
    \ explicitly called. Further, to reduce the possibility of the object being used\
    \ outside of its lifetime, the underlying storage is a separate variable from\
    \ the live object.\n\n```\n#include <cstdlib>\n#include <new>\n\nstruct S {\n\
    \  S();\n  void f();\n};\n\nvoid g() {\n  void *ptr = std::malloc(sizeof(S));\n\
    \  S *s = new (ptr) S;\n  s->f();\n  s->~S();\n  std::free(ptr);\n}\n```\n\nSEI\
    \ CERT C++ CODING STANDARD (2016 EDITION) | V01\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
    \ release and unlimited distribution."
