  md: "# 10.2 OOP51-CPP. Do not slice derived objects\n\nAn object deriving from a\
    \ base class typically contains additional member variables that extend the base\
    \ class. By-value assigning or copying an object of the derived type to an object\
    \ of the base type, these additional member variables are not copied because the\
    \ base class contains insufficient space in to store them. This action is commonly\
    \ called slicing the object because the additional members are \"sliced off\"\
    \ the resulting object.\n\nDo not initialize an object of base type with an object\
    \ of derived class type, except through references, pointers, or pointer-like\
    \ abstractions (such as std::unique_ptr, or std::shared_ptr).\n\n# 10.2.1 Noncompliant\
    \ Code Example\n\nIn this noncompliant code, an object of the Manager type is\
    \ passed by value to a function accepting base Employee type. Consequently, the\
    \ Manager objects are sliced, resulting in information loss and unexpected behavior\
    \ when the print() function is called.\n\n```\n#include <iostream>\n#include <string>\n\
    \nclass Employee {\n    std::string name;\n\nprotected:\n    virtual void print(std::ostream&\
    \ os) const {\n        os << \"Employee: \" << get_name() << std::endl;\n    }\n\
    \npublic:\n    Employee(const std::string& name) : name(name) {}\n    const std::string&\
    \ get_name() const { return name; }\n    friend std::ostream& operator<<(std::ostream&\
    \ os, const Employee& e) {\n        e.print(os);\n        return os;\n    }\n\
    };\n\nclass Manager : public Employee {\n    Employee assistant;\n\nprotected:\n\
    \    void print(std::ostream& os) const override {\n        os << \"Manager: \"\
    \ << get_name() << std::endl;\n        os << \"Assistant: \" << std::endl << \"\
    \\t\"\n        os << assistant() << std::endl;\n    }\n}\n```"
