  md: "# 10.5.3 Compliant Solution (Copy and Swap)\n\nThis compliant solution avoids\
    \ self-assignment by constructing a temporary object from rhs that is then swapped\
    \ with *this. This compliant solution provides a strong exception guarantee because\
    \ swap() will never be called if resource allocation results in an exception being\
    \ thrown while creating the temporary object.\n\n```\n#include <new>\n#include\
    \ <utility>\n\nstruct S { /* ... */ }; // Has nonthrowing copy constructor\n\n\
    class T {\n    int n;\n    S *sl;\n\npublic:\n    T(T &rhs) : n(rhs.n), sl(rhs.sl\
    \ ? new S(*rhs.sl) : nullptr)\n{}\n    ~T() { delete sl; }\n\n    // ...\n\n \
    \   void swap(T &rhs) noexcept {\n        using std::swap;\n        swap(n, rhs.n);\n\
    \        swap(sl, rhs.sl);\n    }\n\n    T& operator=(const T &rhs) noexcept {\n\
    \        T(rhs).swap(*this);\n        return *this;\n    }\n};\n```\n\n# 10.5.4\
