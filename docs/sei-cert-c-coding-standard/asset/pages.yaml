  md: "# 10.5 OOP54-CPP. Gracefully handle self-copy assignment\n\nSelf-copy assignment\
    \ can occur in situations of varying complexity, but essentially, all self-copy\
    \ assignments entail some variation of the following.\n\n```\n#include <utility>\n\
    \nstruct S { /* ... */ }\n\nvoid f() {\n    S s;\n    s = s; // Self-copy assignment\n\
    }\n```\n\nUser-provided copy operators must properly handle self-copy assignment.\n\
    \nThe postconditions required for copy assignment are specified by the C++ Standard,\
    \ [utility.org/requirements], Table 23 ISO/IEC 14882-2014], which states that\
    \ for x = y, the value of y is changed. When x == y, this postcondition translates\
    \ into the values of both x and y remaining unchanged. A naive implementation\
    \ of copy assignment could destroy object-local resources in the process of copying\
    \ resources from the given. If the parameter is the same object as the local object,\
    \ the act of destroying object-local resources will invalidate them. The subsequent\
    \ copy of those resources will be left in an indeterminate state, which violates\
    \ the postcondition.\n\nA user-provided copy assignment operator must prevent\
    \ self-copy assignment from leaving the object in an indeterminate state. This\
    \ can be accomplished by self-assignment tests, copy-and-swap, or other idiomatic\
    \ design patterns.\n\nThe C++ Standard, [copyassignment], specifies types that\
    \ must ensure that self-copy assignment leave the object in a consistent state\
    \ when passed to Standard Template Library (STL) functions. Since objects of STL\
    \ types are used in contexts where CopyAssignable is required, STL types are required\
    \ to gracefully handle self-copy assignment."
