  md: '# 11.6 CON55-CPP. Preserve thread safety and liveness when using condition
    variables


    Both thread safety and liveness are concerns when using condition variables. The
    thread-safe property requires that all objects maintain consistent states in a
    multithreaded environment [Lea 2000]. The liveness property requires that every
    operation or function invocation executes completion without interruption; there
    is no deadlock.


    Condition variables must be used inside a while loop. (See CON54-CPP. Wrap functions
    that can spuriously wake up in a loop for more information.) To guarantee liveness,
    programs must test the while loop condition before invoking the condition_variable::wait()
    function. This early test checks whether another thread has already satisfied
    the condition predicate and has sent a notification. Invoking wait() after the
    notification has been sent results in indefinite blocking.


    To guarantee safety, programs must test the while loop condition after returning
    from wait(). When a thread invokes wait(), it will attempt to block until the
    condition is signaled by a call to condition_variable::notify_all() or to condition_variable::notify_one().


    The notify_one() member function unlocks one of the threads that are blocked on
    the specified condition at the time of the call. If multiple threads are waiting
    on the condition variable, the scheduler can select any of those threads to be
    awakened (assuming that all threads have the same priority level).


    The notify_all() member function unlocks all of the threads that are blocked on
    the specified condition variable at the time of the call. The order in which threads
    execute following a call to notify_all is inconsequential. An unrelated thread
    could start executing, discover that its condition is satisfied, and resume execution
    even though it was supposed to remain dormant.


    For these reasons, threads must check the condition predicate after the wait()
    function returns. A while loop is the best choice for checking the condition predicate
    before and after invoking wait().


    The use of notify_one() is safe if each thread uses a unique condition. If multiple
    threads share a condition variable, the use of notify_one() is only safe if the
    following conditions are met:


    +   - All threads must perform the same set of operations after waking up, which
    means that any thread can be selected to wake up and resume for a single invocation
    of notify_one().

    - Only one thread is required to wake up receiving the signal.


    The notify_all() function can be used to unlock all of the threads that are blocked
    on the specified condition variable if the use of notify_one() is unsafe.'
