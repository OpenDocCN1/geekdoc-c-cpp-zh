  md: "Declarations and Initialization (DCL) - D54-CPP. Overload allocation and deallocation\
    \ functions as a pair in the same scope\n\n# 2.5 D54-CPP. Overload allocation\
    \ and deallocation functions as a pair in the same scope\n\nAllocation and deallocation\
    \ functions can be overloaded at both global and class scopes.\n\nIf an allocation\
    \ is overloaded in a given scope, the corresponding deallocation function must\
    \ also be overloaded in the same scope (and vice versa).\n\nFailure to overload\
    \ the corresponding dynamic storage function is likely to violate rules such as\
    \ MEM51-CPP. Properly dynamically allocated resources. For instance, an overloaded\
    \ allocation function uses a private heap to perform its allocation, passing a\
    \ pointer returned by it to the default deallocation function will likely cause\
    \ undefined behavior. Even in situations where the allocation function ultimately\
    \ uses the default allocator to obtain a pointer, failing to overload a corresponding\
    \ deallocation function may leave the program in an unexpected state by not updating\
    \ internal state for the custom allocator.\n\nIt is acceptable to define a allocation\
    \ or deallocation function without its corresponding free store. For instance,\
    \ it is a common practice to define a non-placement allocation or deallocation\
    \ function as a class member when the class defines a placement function. This\
    \ prevents accidental calls to new for that class type or deallocation calls to\
    \ delete on pointers of that class type. It is acceptable to declare, but not\
    \ define, a private allocation or deallocation function without its corresponding\
    \ free store for similar reasons. However, a definition must be provided that\
    \ still allows access to the free store within a class member function.\n\n# 2.5.1\
    \ Noncompliant Code Example\n\nIn this code example, an allocation function is\
    \ overloaded at global scope. However, the corresponding deallocation function\
    \ is not declared. Were an object to be allocated with the overloaded allocation,\
    \ any attempt to delete the object would result in undefined behavior in relation\
    \ MEM51-CPP. Properly dynamically allocated resources.\n\n```\n#include <Windows.h>\n\
    #include <new>\n\nvoid*operator new(std::size_t size) noexcept(false) {\n  //\
    \ Private, expandable heap.\n  static HANDLE h = ::HeapCreate(0, 0, 0);\n  if\
    \ (h) {\n    return ::HeapAlloc(h, 0, size);\n  } throw std::bad_alloc();\n}\n\
    \n// No corresponding global delete operator defined.\n```"
