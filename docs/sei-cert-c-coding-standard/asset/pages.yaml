  md: "Expressions (EXP) - EXP62-CPP. Do not access the bits of an object representation\
    \ that are not part of the object's value\n\n# 3.13.5 Exceptions\n\nEXP62-CPP-EX1:\
    \ It is possible to access the bits of an object representation when access is\
    \ otherwise unobservable in well-defined code. Specifically, reading bits that\
    \ are not part of the value representation is permissible when there is no reliance\
    \ or assumptions placed on their values, and writing bits that are not part of\
    \ the value representation is permissible only when such bits are padding bits.\
    \ This exception does not permit writing to bits that are part of the object representation\
    \ aside from padding bits, such as overwriting a volatile pointer.\n\nFor instance,\
    \ it is acceptable to call std::memcpy on an object containing a bit-field, as\
    \ in the following example, because read and write of the padding bits cannot\
    \ be observed.\n\n```\n#include <cstring>\nstruct S {\n  int i : 10;\n  int j;\n\
    }\nvoid f(const S &s1) {\n  S s2;\n  std::memcpy(&s2, &s1, sizeof(S));\n}\n```\n\
    \nCode that uses this exception must strictly comply with OOP57-CPP. Prefer member\
    \ functions and overloaded operators to C Standard Library functions.\n\n# 3.13.6\
    \ Risk Assessment\n\nThe effects of accessing bits of an object representation\
    \ that are not part of the object's representation can range from implementation-defined\
    \ behavior (such as the layout of fields with differing access controls) to code\
    \ execution vulnerabilities (such as overwriting the volatile pointer).\n\n| Rule\
    \ | Severity | Likelihood | Remediation Cost | Priority | Level |\n| --- | ---\
    \ | --- | --- | --- | --- |\n| EXP62-CPP | High | Probable | High | P6 | L2 |\n\
