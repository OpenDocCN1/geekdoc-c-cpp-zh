  md: "Miscellaneous (MSC) MSC52-CPP. Value-returning functions must return a value\
    \ from all paths\n\n# MSC54-CPP-EX2: It is permissible for a control path to not\
    \ return a value if that code path is never expected to be taken and a function\
    \ marked [[noreturn]] is called as part of code path or if it is executed, as\
    \ illustrated in the following code example.\n\n```\n#include <cstdlib>\n#include\
    \ <iostream>\n[[noreturn]] void unreachable(const char *msg) {\n    std::cout\
    \ << \"Unreachable code reached: \" << msg << std::endl;\n    std::exit(1);\n\
    }\n\nenum E {\n    One,\n    Two,\n    Three\n};\n\nint f(E e) {\n    switch (e)\
    \ {\n        case One: return 1;\n        case Two: return 2;\n        case Three:\
    \ return 3;\n    }\n    unreachable(\"Can never get here\");\n}\n```\n\n# 12.3.6\
    \ Risk Assessment\n\nFailing to return a value from a code path in a value-returning\
    \ function results in undefined behavior that might be exploited to cause data\
