  md: 'Expressions (EXP) - EXP50-CPP. Do not depend on the order of evaluation for
    side effects


    This rule means that statements such as


    ```

    i = i + 1;

    a[i] = i;

    ```


    have defined behavior, statements such as the following do not.


    ```

    // i is modified twice in the full expression

    i = ++i + 1;


    // i is read other than to determine the value to be stored

    a[i++] = i;

    ```


    Not all instances of a comma in C++ code denote the comma operator. For example,
    the comma between arguments in a function call is *not* the comma operator. Additionally,
    overloaded operators behave the same as the function call, with the operands to
    the operator acting as arguments to a function call.


    # 3.1.1 Noncompliant Code Example


    In thiscompliant code example, i is evaluated more than once in an unsequenced
    manner, so the behavior of the expression is undefined.


    ```

    void f(int i, const int *b) {

    int a = i + b[++i];

    // ...

    }

    ```'
