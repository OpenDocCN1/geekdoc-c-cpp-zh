  md: "# 2.3 DCL52-CPP. Never qualify a reference type with const or volatile\n\n\
    C++ does not allow you to change the value of a reference type, effectively treating\
    \ all references as being const qualified. The C++ Standard, [dcl.ref], paragraph\
    \ 1 [ISO/IEC 14882-2014], states the following:\n\n> Cv-qualified references are\
    \ ill-formed except when the cv-qualifiers are introduced through the use of a\
    \ typedef-name (7.1.3, 14.1) or decltype-specifier (7.1.6.2), in case the cv-qualifiers\
    \ are ignored.\n\nThus, C++ prohibits or ignores the cv-qualification of a reference\
    \ type. Only a non-reference type may be cv-qualified.\n\nWhen attempting to const-qualify\
    \ a type as part of a declaration that uses reference type, a programmer may accidentally\
    \ write\n\n```\nchar &const p;\n```\n\ninstead of\n\n```\nchar const &p; // Or:\
    \ const char &p;\n```\n\nDo not attempt to cv-qualify a reference type as it results\
    \ in undefined behavior. A conforming compiler is required to issue a diagnostic\
    \ message. However, if the compiler does not emit a fatal diagnostic, the program\
    \ may produce surprising results, such as the character referenced by p to be\
    \ mutated.\n\n# 2.3.1 Noncompliant Code Example\n\nIn this noncompliant code,\
    \ a const-qualified reference to a char is formed instead of a reference to a\
    \ const-qualified char. This results in undefined behavior.\n\n```\n#include <iostream>\n\
    \nvoid f(char c) {\n    char &const p = c;\n    p = 'p';\n    std::cout << c <<\
    \ std::endl;\n}\n```"
