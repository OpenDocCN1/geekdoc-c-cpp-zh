  md: "Thus, comparing two pointers that do not point into the same container or past\
    \ the end of the container results in unspecified behavior. Although the following\
    \ example is an improvement over the previous noncompliant code example, it does\
    \ not work in portable code and may fail when executed on a segmented memory architecture\
    \ (as such antiquated x86 variants). Consequently, it is noncompliant.\n\n```\n\
    #include <iostream>\n\ntemplate <typename Ty>\nbool in_range(const Ty *test, const\
    \ Ty *r, size_t n) {\n    return test >= r && test < (r + n);\n}\n\nvoid f() {\n\
