  md: "Exceptions and Error Handling (ERR) - ERR50-CPP. Do not terminate the program\n\
    \nIn many circumstances, the stack will not be unbound in response to an implicit\
    \ call to std::terminate(), and in a few cases, it is implementation-defined whether\
    \ or not stack unwinding will occur. The C++ Standard, [except::terminate], paragraph\
    \ 2 [ISO/IEC 14882-2014], part, states the following\n\nIn the situation where\
    \ matching handler is found, it is implementation-defined whether or the stack\
    \ is unbound before std::terminate() is called. In the situation where the search\
    \ for a handler encounters the outermost block of a function with noexcept-specification\
    \ that does not allow exception, it is implementation-defined whether the stack\
    \ is unbound, partially, or not at all before std::terminate() is called. In all\
    \ other situations, the stack shall not be unbound before std::terminate()\n\n\
    Do explicitly or implicitly call std::quick_exit(), std::abort(), or std::__Exit().\
    \ When the terminate_handler is installed or the current terminate_handler responds\
    \ by calling std::abort() or std::__Exit(),do not explicitly or implicitly call\
    \ std::terminate(). Abnormal process termination is the typical vector for denial-of-service\
    \ attacks.\n\nIt is acceptable to call a termination function that safely executes\
    \ destructors and cleanly cleans resources, as std::exit().\n\n# 9.1.1 Noncompliant\
    \ Code Example\n\nIn this noncompliant code, the call to f() , which was registered\
    \ as an exit handler with std::at_exit(), may result in a call to std::terminate()\
    \ because throwing_func() may throw an exception.\n\n```\n#include <cstdlib>\n\
    \nvoid throwing_func() noexcept(false);\n\nvoid f() { // Not Invoked by the program\
    \ except as an exit handler.\ntithrowing_func();\n}\n\nint main() {\n    if (0\
    \ != std::atexit(f)) {\n        // Handle error\n    }\n    // ...\n}\n```\n\n\
    SEI CERT C++ CODING STANDARD (2016 EDITION) | V01 269\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
