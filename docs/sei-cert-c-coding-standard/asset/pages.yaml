  md: "# 9.5 ERR54-CPP. Catch handlers should order their parameter types from most\
    \ derived to least derived\n\nThe C++ Standard, [except.handle], paragraph 4 [ISO/IEC\
    \ 14882-2014], states the following:\n\n> The handlers for a try block are tried\
    \ in order of appearance. That makes it possible to write handlers that can never\
    \ be executed, for example by placing a handler for a corresponding base class.\n\
    \nConsequently, if two handlers catch exceptions that are derived from the same\
    \ base class (such as std::exception), the most derived exception must come first.\n\
    \n# 9.5.1 Noncompliant Code Example\n\nIn this noncompliant code example, the\
    \ first handler catches all exceptions of class B, as well as exceptions of class\
    \ D, since they are also of class B. Consequently, the second handler does not\
    \ catch any exceptions.\n\n```\n// Classes used for exception handling\nclass\
    \ B { };\nclass D : public B {};\n\nvoid f() {\n  try {\n    // ...\n  } catch\
    \ (B& b) {\n    // ...\n  } catch (D& d) {\n    // ...\n  }\n}\n```"
