- img_proc: true
  md: "# 9.7.2 Compliant Solution (Strong Exception Safety)\n\nIn this compliant solution,\
    \ the copy assignment operator provides the strong exception safety guarantee.\
    \ The function allocates new storage for the copy before changing the state of\
    \ the object. Only after the allocation succeeds does the function proceed to\
    \ change the state of the object. In addition, by copying the newly allocated\
    \ array before deallocating the existing array, the function tests for self-assignment,\
    \ which improves the performance of the code in the common case [Suter 2004].\n\
    \n```\n#include <cstring>\n\nclass IntArray {\n    int *array;\n    std::size_t\
    \ nElems;\npublic:\n    // ...\n\n    ~IntArray() {\n        delete[] array;\n\
    \    }\n\n    IntArray(const IntArray& that); // nontrivial copy constructor\n\
    \n    IntArray& operator=(const IntArray& rhs) {\n        int *tmp = nullptr;\n\
    \        if (rhs.nElems) {\n            tmp = new int[rhs.nElems];\n         \
    \   std::memcpy(tmp, rhs.array, rhs.nElems * sizeof(*array));\n        }\n   \
    \     delete[] array;\n        array = tmp;\n        nElems = rhs.nElems;\n  \
    \      return *this;\n    }\n\n    // ...\n};\n```\n\n# 9.7.3 Risk Assessment\n\
    \nCode that is not exception safe typically leads to resource leaks, causes the\
    \ program to be left in an inconsistent or unexpected state, and results in undefined\
    \ behavior at some point after the first exception is thrown.\n\n| Rule | Likelihood\
    \ | Remediation Cost | Priority | Level |\n|---|---|---|---||}{\n| ERR56-CPP |\
    \ High | Likely | High | P9 | L2 |\n\nSEI CERT C++ CODING STANDARD (2016 EDITION)\
    \ | V01\nEngineering Institute | Carnegie Mellon University\n[DISTRIBUTION STATEMENT\
    \ A] Approved for public release and unlimited distribution.\n\n290"
