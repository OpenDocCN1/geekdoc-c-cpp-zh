  md: "#  2.11.1 Noncompliant Code Example\n\nIn this noncompliant code example, two\
    \ translation units define a class of the same name with differing definitions.\
    \ Although the two definitions are functionally equivalent (both define a class\
    \ named S with a single, public, nonstatic data member a), they are not defined\
