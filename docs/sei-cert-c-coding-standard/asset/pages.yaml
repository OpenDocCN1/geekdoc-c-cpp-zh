  md: "# 9.13 ERR62-CPP. Detect errors when converting a string to a number\n\nThe\
    \ process of parsing integer or floating-point number from a string can produce\
    \ many errors. The string might not contain a number. It might contain a number\
    \ of the correct type that is out of range (such as one that is larger than INT_MAX).\
    \ The string may also contain extra information after the number, which may or\
    \ not be after the conversion. These error conditions must be detected and addressed\
    \ when string-to-number conversion is performed using a formatted input stream\
    \ as std::istream or the local facet num_get<>.\n\nWhen calling a formatted input\
    \ stream like istream::operator>>(), information about conversion errors is queried\
    \ through the basic_ios::good(), basic_ios::bad(), and basic_ios::fail() inherited\
    \ member functions or through exception handling if it is enabled on the stream.\n\
    \nWhen calling num<>::get(), information about conversion errors is returned to\
    \ the caller through the ios_base::iostate argument. The C++ Standard, section\
    \ facet.num::virtuals(), [ISO/IEC 14882-2014], in part states the following:\n\
    \n> If the conversion fails to convert the entire field, or if the field represents\
    \ a value outside the range of representable values, ios_base::failbit is assigned\
    \ to err.\n\nAlways explicitly check the error state of a conversion from string\
    \ to a numeric value (or handle the related exception, applicable) instead of\
    \ assuming the conversion results in a valid value. This rule is in ERR34-C. Detect\
    \ errors when converting a string to a number, which bans the use of conversion\
    \ functions that do not perform conversion validation as std::atoi() and std::scanf()\
    \ from the C Standard Library.\n\n# 9.13.1 Noncompliant Code Example\n\nIn this\
    \ noncompliant code, multiple numeric values are converted from the standard input\
    \ stream. However, if the text received from the standard input stream cannot\
    \ be converted into a numeric value that can be represented by an int, the resulting\
    \ value stored into the variables i and j may be unexpected.\n\n```\n#include\
    \ <iostream>\nvoid f() {\n    int i, j;\n    std::cin >> i >> j;\n    // ...\n\
    }\n```"
