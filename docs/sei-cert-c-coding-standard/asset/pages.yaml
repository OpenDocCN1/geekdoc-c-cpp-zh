  md: '# Microsoft Visual Studio


    Microsoft Visual Studio is a commercial C and C++ compiler. More information can
    be found at https://www.visualstudio.com/.


    # Microsoft Visual Studio STL


    The Microsoft Visual Studio STL is a commercial Standard Template Library (STL)
    implementation. More information can be found at https://msdn.microsoft.com/en-library/escc687y.aspx


    # mitigation [Seazard 2005]


    A mitigation is a method, technique, process, tool, or runtime library that can
    prevent or limit exploits against vulnerabilities.


    # one-definition rule (ODR) [ISO/IEC 14882-2014]


    A fundamental C++ rule that states that no translation unit shall contain more
    than one definition of any variable, function, class type or template, and that
    every program shall contain exactly one definition of every non-inline function
    or variable. Some definitions may be duplicated in multiple translation units,
    subject to strict rules.


    # ODR-use [ISO/IEC 14882-2014]


    A function or object is ODR-used if the address of the entity is taken, the function
    is called, or a reference is bound to the object. When a function or object is
    ODR-used, its definition must exist within the program or the program is ill-formed.


    # RAII (Resource Acquisition Initialization)


    RAII is a design principle supported by C++. Holding a resource is a class invariant
    where the allocation of the resource (acquisition) is inseparable from the initialization
    of the object during its construction. Deallocation of the resource is performed
    during the destruction of the object. Thus, the resource is held until initialization
    completes and remains held until finalization begins, ensuring there are no resource
    leaks unless the owning resource is lost.


    # reliability [IEEE Std 610.12 1990]


    Reliability is the ability of a system or component to perform its required functions
    under stated conditions for a specified period of time.


    # restricted sink [ISO/IEC 9899:2011]


    A restricted sink is an operand or argument whose domain is a subset of the domain
    described by its type.


    # rvalue [ISO/IEC 14882-2014]


    An rvalue (so called, because rvalues occur on the right-hand side of an assignment
    expression), is an xvalue, a temporary object or subobject thereof, or a value
    that is not associated with an object.


    # security flaw [Seazard 2005]


    A security flaw is a software defect that poses a potential security risk.'
