  md: '# 8 Input Output (FIO)


    # 8.1 FI50-CPP. Do not alternately input and output from a file stream without
    an intervening positioning call


    The C++ Standard, [filebuf], paragraph 2 [ISO/IEC 14882-2014], states the following:


    +   * The restrictions on reading and writing a sequence controlled by an object
    of class basic_filebuf<Char, traits> are the same as for reading and writing with
    the Standard C library FILES.


    The C Standard, subclause 7.19.5.3, paragraph 6 [ISO/IEC 9899:1999], places the
    restrictions on FILE objects for both reading and writing:


    +   * When a file is opened with update mode ..., both input and output may be
    performed on the associated stream. However, output shall not be directly followed
    by input without an intervening call to the fflush() or to a file positioning
    function (fseek, fsetpos, or rewind), and input shall not be directly followed
    by output without an intervening call to a file positioning function, unless the
    input operation encounters endfile.


    Consequently, the following scenarios can result in undefined behavior:


    +   * Receiving input from a stream directly following an output to that stream
    without an intervening call to std::basic_filebuf<T>::seekoff() if the file is
    not at end-of-file

    * Outputting to a stream receiving input from that without a call to std::basic_filebuf<T>::seekoff()
    if the file is not at end-of-file


    No other std::basic_filebuf<T>::seek() guarantees behavior as if a call were made
    to a Standard C library file-positioning function, or std::fflush().


    Calling std::basic_ostream<T>::seekp() or std::basic_istream<T>::seekg() essentially
    results in a call to std::basic_filebuf<T>::seekoff() for file stream positioning.
    Given that std::basic_iostream<T> inherits from both std::basic_ostream<T> and
    std::basic_istream<T>, and std::fstream inherits from std::basic_iostream, either
    function is acceptable to call to ensure the file buffer is in a valid state before
    the subsequentient I/O operation.'
