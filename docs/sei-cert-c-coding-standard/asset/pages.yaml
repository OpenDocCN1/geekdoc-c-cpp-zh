  md: '# deadlock [ISO/IEC 14882-2014]


    A deadlock is when one or more threads are unable to continue execution because
    each is blocked waiting for one of the others to satisfy some condition


    # denial-of-service attack


    A denial-of-service attack is an attempt to make a computer resource unavailable
    to its intended users.


    # diagnostic message [ISO/IEC 14882-2014]


    A diagnostic message belonging to an implementation-defined subset of the implementation''s
    message output. A diagnostic message may indicate a constraint violation or a
    valid, but questionable language construct. Messages typically include the file
    name and line numbering to the offending code construct. In addition, implementations
    also often indicate the severity of the problem. Although the C++ Standard does
    not specify any requirement, the most severe problems often cause implementations
    to fully translate a translation unit. Simply to issue a warning in such cases
    are errors. Other problems may implementations simply and continue translating
    the rest of the program. (See error message and warning message.)


    # error message


    An error message is a diagnostic message generated when source code is encountered
    that prevents an implementation from translating a translation unit. (See diagnostic
    message and warning message.)


    # exception safety [Stroustrup 2001]


    An operation on an object is said to be exception safe if that operation leaves
    the object in a valid state when the operation is terminated by throwing an exception.
    (See basic exception safety and strong exception safety.)


    # exploit [Seazard 2005]


    An exploit is a piece of software or technique that takes advantage of a security
    vulnerability to violate explicit or implicit security policy.


    # fatal diagnostic


    A fatal diagnostic is a message that causes an implementation not to perform the
    translation.


    # free store [ISO/IEC 14882-2014]


    ```

    :free store is managed by the C++ allocation and deallocation functions

    ::operator new(std::size_t),:operator delete(void*), their array forms

    ::operator new[](std::size_t),:operator delete[](void*), overlaps of

    said functions on std::throw_t, any user-defined replacements for said functions,
    as

    as any such functions defined as a member of a class. The free store is distinct
    from

    storage managed by the C functions call(), free(), malloc(), and realloc().

    ```'
