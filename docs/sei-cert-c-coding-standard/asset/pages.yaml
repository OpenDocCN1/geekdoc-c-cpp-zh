  md: "# 10.6 OOP55-CPP. Do not use pointer-to-member operators to access nonexistent\
    \ members\n\nThe pointer-to-member operators .* and ->* are used to obtain an\
    \ object or functionally as though they were a member of an underlying object.\
    \ For instance, the following are equivalent ways to call the member function\
    \ f() on the object o.\n\n```\nstruct S {\n    void f() {}\n}\n\nvoid func() {\n\
    \    S o;\n    void (S::*pm)(o) = &S::f;\nn    o.f();\n    (o.*pm)();\n}\n```\n\
    \nThe call of the form o.f() uses class member access to look up the address of\
    \ the object S::f() on the object o. The call of the form o.*pm() uses the pointer-to-member\
    \ operator to call the function at the address specified by pm. In both cases,\
    \ the object is the implicit this within the member function S::().\n\nThe C++\
    \ Standard, [expr.mptr.oper], paragraph 4 [ISO/IEC 14882-2014], states the following:\n\
    \n+   Abbreviating pm-expression \"cast-expression as E1.*E2, E1 is the object\
    \ expression. If the dynamic type of E1 does not contain the member to which E2\
    \ refers, the behavior is undefined.\n\nA pointer-to-member expression of the\
    \ form E1->*E2 is converted to its equivalent form, (*E1).*E2, so use of pointer-to-member\
    \ expressions either form behave equivalently in terms of undefined behavior.\n\
    \nFurther, the C++ Standard, [expr.mptr.oper], paragraph 6, in part, states the\
    \ following:\n\n+   If the second operand is the null pointer to member value,\
    \ the behavior is undefined.\n\nDo not use a pointer-to-member expression where\
    \ the dynamic type of the first operand does not contain the member to which the\
    \ second operand refers, including the use of a null pointer-to-member value as\
    \ the second operand."
