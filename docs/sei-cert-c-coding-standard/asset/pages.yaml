  md: '# Appendix B: Definitions


    abnormal termination [Open Group 2008]

    Abnormal termination occurs when requested by the abort () function or when some
    signals are received.


    application binary interface

    An binary interface is an interface between two independently compiled modules
    of a program. An Application Binary Interface document specifies a set of conventions
    as the order and location of function callers that must adhere to in order to
    achieve interoperability between modules.


    basic exception safety [Stroustrup 2000, Sutter 2000]

    The basic exception safety guarantee is a property of an operation such that,
    if the operation terminates by raising an exception, it preserves state invariants
    and prevents resource leaks. (Also see exception safety and strong exception safety.)


    Clang

    Clang is an open source C and C++ compiler. More information can be found at http://clang.llvm.org/


    condition predicate

    A predicate is an expression constructed from a set of variables that may be true
    for a thread to be allowed to continue execution.


    conforming [ISO/IEC 14882-2014]

    Conforming programs may depend on nonportable features of a conforming implementation.


    critical sections

    Critical sections are code that accesses shared data and that would otherwise
    be protected from data races.


    cv-quality

    To cv-ify a type is to add const or volatile (or both) to the type.


    data race [ISO/IEC 14882-2014]

    The execution of the program contains a data race if two accesses potentially
    conflicting actions, at least one of which is not atomic, and neither happens
    before the other. [An exception is that two accesses to the same object of type
    volatile sig_atomic_t do not result in a data race if both occur in the same thread,
    even if one or more occurs in a signal handler.'
  merge: -1
