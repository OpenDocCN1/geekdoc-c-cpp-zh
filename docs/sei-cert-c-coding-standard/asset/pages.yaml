  md: '# 7.3.8.1 Related Vulnerabilities


    The vulnerability in Adobe Flash [VU#159523] arises because Flash neglects to
    check the return value from calloc(). Even though calloc() returns NULL, Flash
    does not attempt to read or write the return value. Usually, it attempts to write
    an offset from the return value. Dereferencing NULL usually results in a program
    crash, but dereferencing an offset from NULL allows an exploit to succeed without
    crashing the program.


