  md: "# 11.3 CON52-CPP. Prevent data races when accessing bit-fields from multiple\
    \ threads\n\nWhen accessing a bit-field, a thread may inadvertently access a separate\
    \ bit-field in adjacent memory. Because compilers are required to store multiple\
    \ adjacent bit-fields in one storage unit whenever they, data races may exist\
    \ not just on a bit-field accessed by multiple threads but also on other bit-fields\
    \ sharing the same byte or word. The problem is difficult to diagnose because\
    \ it is not obvious that the same memory location is being modified by multiple\
    \ threads.\n\nOne approach for preventing data races in concurrent programming\
    \ is to use a mutex. When properly observed by all threads, a mutex can provide\
    \ safe and secure access to a shared object. However, mutexes provide no guarantees\
    \ regard to objects that might be accessed when the mutex is not controlled by\
    \ the thread. Unfortunately, there is no portable way to determine which adjacent\
    \ bit-fields are stored along with the desired bit-field.\n\nAnother approach\
    \ is to insert a non-bit-field between any two bit-fields to ensure that each\
    \ bit-field is the only one accessed within its storage unit. This technique effectively\
    \ guarantees that no two bit-fields are accessed simultaneously.\n\n# 11.3.1 Noncompliant\
    \ Code Example (bit-field)\n\nAdjacent bit-fields may be stored in a single memory\
    \ location. Consequently, modifying adjacent bit-fields in different threads is\
    \ undefined behavior, as shown in this noncompliant code example.\n\n```\nstruct\
    \ MultiThreadedFlags {\n  unsigned int flag1 : 2;\n  unsigned int flag2 : 2;\n\
    };\nMultiThreadedFlags flags;\nvoid thread1() {\n  flags.flag1 = 1;\n}\nvoid thread2()\
    \ {\n  flags.flag2 = 2;\n}\n```"
  merge: -1
