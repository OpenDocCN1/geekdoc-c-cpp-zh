    \ for Base has an explicitly declared virtual destructor, ensuring that the polymorphic\
    \ operation results in well-defined behavior.\n\n```\nstruct Base {\n    virtual\
    \ ~Base() = default;\n    virtual void f();\n};\n\nstruct Derived : Base {};\n\
    \nvoid f() {\n    Base *b = new Derived();\n    // ...\n    delete b;\n}\n```\n\
    \n# 10.3.4 Risk Assessment\n\nAttempting to destroy a polymorphic object that\
    \ does not have a virtual destructor declared results in undefined behavior. In\
    \ practice, potential consequences include abnormal termination and memory leaks.\n\
