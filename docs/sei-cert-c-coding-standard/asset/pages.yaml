  md: '# 7.8 MEM57-CPP. Avoid using default operator new for over-aligned types


    The non-placement new expression is specified to invoke an allocation function
    to allocate storage for an object of the specified type. When successful, the
    allocation function, is required to return a pointer to storage suitable for any
    object with a fundamental alignment requirement. Although the global operator
    new, the default allocation function invoked by the expression, is specified by
    the C++ standard [ISO/IEC 14882-2014](https://www.iso.org/standard/74528.html)
    to allocate sufficient storage aligned to any object of the size, since the expected
    alignment isn''t part of the function''s interface, the most program can safely
    assume that the allocated storage by the default operator new defined by the implementation
    is aligned for an object with a fundamental alignment. In particular, it is unsafe
    to use the storage for an object with a stricter alignment requirement—an over-aligned
    type.


    Furthermore, the form of the non-placement new expression may increase the amount
    of storage it attaches to obtain by invoking the allocation function by an unspecified
    amount. This amount, referred to as overhead in the C++ standard, is commonly
    known as a cookie. The cookie is used to store the number of elements in the array
    so that the array delete expression or the exception unwinding mechanism can invoke
    the destructor on each successfully constructed element of the array. While the
    specific conditions under which the cookie is required are described in the C++
    standard, may be outlined in other specifications such as the [application binary
    interface](https://en.wikipedia.org/wiki/Application_Binary_interface) (ABI) document
    for the target environment. For example, the Itanium C++ ABI describes the rules
    for compiling the size of a cookie, its location, and achieving the correct alignment
    of the array elements. When these rules require that a cookie be created, it is
    possible to obtain a suitably aligned array of elements of an overaligned type
    [CodeSourcecery 2016a](https://codesourcecery.com/2016a/). However, the rules
    are complex and the Itanium C++ ABI isn''t universally.


    Avoid relying the default operator new to obtain storage for objects of over-aligned
    types. Doing so may result in an object being constructed at a misaligned location,
    which has undefined behavior and can result in abnormal termination when the object
    is accessed, even on architectures which cannot tolerate misaligned accesses.


    # 7.8.1 Noncompliant Code Example


    In the following noncompliant code example, the new expression is used to invoke
