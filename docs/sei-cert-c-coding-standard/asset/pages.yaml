  md: "Concurrency (CON) - CONS52-CPP. Prevent data races when accessing bit-fields\
    \ from multiple threads\n\nFor example, the following instruction sequence is\
    \ possible.\n\n```\nThread 1: register 0 = flags\nThread 1: register 0 &= -mask(flag1)\n\
    Thread 2: register 0 = flags\nThread 2: register 0 &= -mask(flag2)\nThread 1:\
    \ register 0 |= 1 << shift(flag1)\nThread 1: flags = register 0\nThread 2: register\
    \ 0 |= 2 << shift(flag2)\nThread 2: flags = register 0\n```\n\n# 11.3.2 Compliant\
    \ Solution (bit-field, C++11 and later, mutex)\n\nThis simple solution protects\
    \ all accesses of the flags with a mutex, preventing any\ndata\\u0races.\n\n```\n\
    #include <mutex>\n\nstruct MultiThreadedFlags {\n    unsigned int flag1 : 2;\n\
    \    unsigned int flag2 : 2;\n};\n\nstruct MtfMutex {\n    MultiThreadedFlags\
    \ s;\n    std::mutex mutex;\n};\n\nMtfMutex flags;\n\nvoid thread1() {\n    std::lock_guard<std::mutex>\
    \ lk(flags.mutex);\n    flags.s.flag1 = 1;\n}\n\nvoid thread2() {\n    std::lock_guard<std::mutex>\
    \ lk(flags.mutex);\n    flags.s.flag2 = 2;\n}\n```"
