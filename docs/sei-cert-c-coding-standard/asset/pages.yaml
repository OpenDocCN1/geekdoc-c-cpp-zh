  md: '# 6.2 STR51-CPP. Do not attempt to create a std::string from a null pointer


    The std::basic_string uses the traits design pattern to handle implementation
    details of the various types, resulting in a series of string-like classes with
    a common, underlying implementation. Specifically, the std::basic_string class
    is paired with std::char_traits to create std::string, std::wstring, std::u6string,
    and std::u32string classes. The std::char_traits is explicitly specialized to
    provide policy-based implementation details for the std::basic_string type. One
    such implementation detail is the std::char_traits::length() function, which is
    frequently used to determine the number of characters in a null-terminated string.
    According to the C++ Standard, [char.traits; Table 62 ISO/IEC 14882-2014], passing
    a null pointer to this is undefined behavior which would result in dereferencing
    a null pointer.


    The following std::basic_string functions result in a call to std::char_traits::length():


    +   * basic_string::basic_string(const char *, const Allocator &)

    * basic_string &basic_string::append(const char *)

    * basic_string &basic_string::assign(const char *)

    * basic_string &basic_string::insert(size_type, const char *)

    * basic_string &basic_string::replace(size_type, size_type, const char *)

    * basic_string &basic_string::replace(const_iterator, const_iterator, const char
    *)

    * size_type basic_string::find(const char *, size_type)

    * size_type basic_string::rfind(const char *, size_type)

    * size_type basic_string::find_first_of(const char *, size_type)

    * size_type basic_string::find_last_of(const char *, size_type)

    * size_type basic_string::find_first_not_of(const char *, size_type)

    * size_type basic_string::find_last_not_of(const char *, size_type)

    * int basic_string::compare(const char *)

    * int basic_string::compare(size_type, size_type, const char *)

    * basic_string &basic_string::operator+=(const char *)

    * basic_string &basic_string::operator+=(const char *)'
