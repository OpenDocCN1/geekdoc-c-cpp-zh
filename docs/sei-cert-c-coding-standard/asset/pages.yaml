  md: '# 3.8 EXP57-CPP. Do not cast or delete pointers to incomplete classes


    Referring to objects of incomplete class type, also known as the "pimpl idiom"
    a common practice. One such common usage is [Sutter 2000] whereby an opaque pointer
    is used to hide implementation details from a public-facing API. Attempting to
    delete a pointer to an object of incomplete class type leads to undefined behavior.
    The C++ Standard, [expr::delete], paragraph 5 [ISO/IEC 14882-2014], states as
    the following:


    > If the object being deleted has incomplete class type or delete has a non-trivial
    destructor or a deallocation function, the behavior is undefined.


    Do not attempt to delete a pointer to an object of incomplete type. Although it
    is well-formed if the class has no nontrivial destructor and no deallocation function,
    it would be undefined behavior. It would be possible to check for a nontrivial
    destructor at compile time using a static_assert and the std::is_trivially_destructible
    type trait, but no such type trait exists to test for the presence of a deallocation
    function.


    Pointer casting to a pointer of incomplete class type has similar semantics. Pointer
    upcasting (casting from a more derived type to a less derived type) is an implicit
    conversion operation. C++ allows static_cast to perform the inverse operation,
    pointer casting, via [expr::cast], paragraph 7. However, when the pointed-to pointer
    is incomplete, the compiler is unable to make any class offsets that may be required
    in the presence of multiple inheritance, resulting in a pointer that cannot be
    validated.


    reinterpret_cast of a pointer is defined by [expr::reinterpret_cast], paragraph
    7, as using static_cast<T *>(PtrValue), meaning that reinterpret_cast is simply
    a sequence of static_cast operations. C-style casts of a pointer to an incomplete
    object type are defined as either static_cast or reinterpret_cast (it is unspecified
    which is picked in) in [expr::cast], paragraph 5.


    Do not attempt to cast through a pointer to an incomplete object. The cast operation
    itself is well-formed, dereferencing the resulting pointer may result in undefined
    behavior if the downcast is unable to adjust for multiple inheritance.'
