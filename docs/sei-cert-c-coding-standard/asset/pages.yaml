  md: "# 9.9 ERR58-CPP. Handle all exceptions thrown before main() begins executing\n\
    \nNot all exceptions can be caught, even with careful use of function-try-blocks.\
    \ The C++ Standard, [exception.handle], paragraph 13 ISO/IEC 14882-2014], states\
    \ the following:\n\n+   * Exceptions thrown in destructors of objects with static\
    \ storage duration or in constructors of namespace scope objects with static storage\
    \ duration are not caught by a function-try-block in main(). Exceptions thrown\
    \ in destructors of objects with thread storage duration or in constructors of\
    \ namespace scope objects with thread storage duration are not caught by a function-try-block\
    \ on the initial function of the thread.\n\nWhen declaring an object with static\
    \ or thread duration, and that object is not declared within a function scope,\
    \ the type constructor must be declared noexcept and must comply with ERR55-CPP.\
    \ Honor exception specifications. Additionally, the initializer for a declaration,\
    \ if any, must not throw an uncaught exception (including from any implicitly\
    \ constructed objects created as part of the initialization). If an uncaught exception\
    \ is thrown before main() or if an uncaught exception is thrown after main() finished\
    \ executing, there are no further opportunities to handle the exception and it\
    \ results in implementation-defined behavior. (See ERR50-CPP. Do not abruptly\
    \ terminate the program for further details).\n\nFor more information on exception\
    \ specifications of destructors, see DCL57-CPP. Do not let exceptions escape from\
    \ destructors or deallocation functions.\n\n# 9.9.1 Noncompliant Code Example\n\
    \nIn thiscompliant example, the constructor for S may throw an exception that\
    \ is not caught when globalS is constructed during program setup.\n\n```\nstruct\
    \ S {\n  S() noexcept(false);\n};\n  static S globals;\n```"
