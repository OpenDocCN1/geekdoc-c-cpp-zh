  md: "Expressions (EXP) - EXP63-CPP. Do not rely on the value of a moved-from object\n\
    \nSeveral generic standard template library (STL) algorithms, such as std::remove()\
    \ and std::unique(), remove elements from a container without shrinking the size\
    \ of the container. These algorithms return a ForwardIterator to indicate the\
    \ partition within the container after which elements are no longer valid. The\
    \ elements in the container that preceded the returned iterator are valid but\
    \ unspecified values; whereas the elements that succeeded the returned iterator\
    \ are unspecified values. Accessing unspecified values of elements iterated over\
    \ results in unspecified behavior. Frequently, the erase-remove idiom is used\
    \ to shrink the size of the container when using these algorithms.\n\n# 3.14.1\
    \ Noncompliant Code Example\n\nIn this noncompliant code example, the integer\
    \ values 0 through 9 are expected to be printed to the standard stream from a\
    \ std::string value reference. However, because the object is moved and then reused\
    \ under the assumption its internal state has been cleared, unexpected output\
    \ may occur triggering undefined behavior.\n\n```\n#include <iostream>\n#include\
    \ <string>\n\nvoid g(std::string &&v) {\n    cout << v << std::endl;\n}\n\nvoid\
    \ f() {\n    std::string s;\n    for (unsigned i = 0; i < 10; ++i) {\n       \
    \ s.append(1, static_cast<char>('0' + i));\n        g(std::move(s));\n    }\n\
    }\n```\n\nSEI CERT C++ CODING STANDARD (2016 EDITION) | V01 149\nSoftware Engineering\
    \ Institute | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved\
    \ for public release and unlimited distribution."
