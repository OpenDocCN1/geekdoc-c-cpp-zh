  md: "# 9.8.3 Compliant Solution (RAII Design Pattern)\n\nA better approach is to\
    \ employ RAII. This pattern forces every object to clean up itself in the face\
    \ of abnormal behavior, preventing the programmer from having to do so. Another\
    \ benefit of this approach is that it does not require statements to handle resource\
    \ allocation errors, in conformance with MEM52-CPP. Detect and handle memory allocation\
    \ errors.\n\n```\nstruct SomeType {\n    SomeType() noexcept; // Performs nontrivial\
    \ initialization.\n    ~SomeType(); // Performs nontrivial finalization.\n   \
    \ void process_item() noexcept(false);\n};\n\nvoid f() {\n    SomeType st;\n \
    \   try {\n        st.process_item();\n    } catch (...) {\n        // Process\
    \ error, but not recover from it; retrow.\n        throw;\n    }\n    // After\
    \ re-throwing the exception, the\n    // destructor is run for st.\n}\n// If f()\
    \ exits without throwing an exception,\n// the destructor is not run for st.\n\
    ```\n\n# 9.8.4 Noncompliant Code Example\n\nIn this noncompliant code example,\
    \ the C::C() constructor might fail to allocate memory for a, might fail to allocate\
    \ memory for b, or might throw an exception in the init() method. If init() throws\
    \ an exception, neither a nor b will be released. Likewise, if the allocation\
    \ for b fails, a will be leaked.\n\n```\nstruct A {/* ... */ };\nstruct B {/*\
    \ ... */ };\n\nclass C {\n    A *a;\n    B *b;\nprotected:\n    void init() noexcept(false);\n\
    public:\n    C() : a(new A()), b(new B()) {\n        init();\n    }\n};\n```"
