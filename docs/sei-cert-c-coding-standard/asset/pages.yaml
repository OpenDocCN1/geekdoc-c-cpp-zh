  md: '# Introduction


    This standard provides rules for secure coding in the C++ programming language.
    The goal of these rules is to develop safe, reliable, and secure systems, for
    example by eliminating undefined behaviors that can lead to undefined program
    and exploitable vulnerabilities. Conformance to the coding rules defined in this
    standard are necessary (but not sufficient) to ensure the safety, reliability,
    and security of software systems developed in the C++ programming language. It
    is also necessary, for example, to have a safe and secure design. Safety-critical
    systems typically have stricter requirements than are imposed by this coding standard,
    for example requiring that all memory be statically allocated. The application
    of this coding standard will result in high-quality systems that are reliable,
    robust, and resistant to attack.


    Each rule consists of a title, a description, noncompliant code examples, and
    compliant solutions, as well as other information as described in How this Coding
    Standard Is Organized. The title is a concise, but sometimes imprecise, description
    of the rule. The description specifies the normative requirements of the rule.
    The noncompliant code examples are examples that would constitute a violation
    of the rule. The accompanying compliant solutions demonstrate equivalent code
    that does not violate the rule or any other rules in this coding standard.


    A well-documented and enforceable coding standard is an essential element of coding
    in the C++ programming language. Coding standards ensure programmers follow a
    uniform set of rules determined by the requirements of the project and organization
    rather than by the programmers'' preferences. Once established, these standards
    can be used as a metric to evaluate source code (using C Manual or automated processes).


    The SEI C++ Coding Standard wiki contains updates of the standard between published
    releases. If you are interested in contributing to these rules, create an account
    on the wiki and then request contributor privileges by sending a request to info@sei.cmu.edu.


    The Secure eNewsletter contains news from the CERT Secure Coding Initiative as
    well as summaries of recent updates to the standard rules. If you are interested
    in receiving updates, subscribe to the eNewsletter through our website or send
    a request to info@sei.cmu.edu.


    # Scope


    The CERT C++ Coding Standard was developed specifically for versions of the C++
    programming language defined by the following:


    +   - ISO/IEC 14882-2014, Programming Languages—C++, Fourth Edition, 2014 [ISO/IEC
    14882-2014]


    Although the guidelines for this standard were developed for C++14, they can also
    be applied to earlier versions of the C++ programming language, including C++11.
    Variations between'
