  md: '# 10 Object Oriented Programming (OOP)


    # 10.1 OOP50-CPP. Do not invoke virtual functions from constructors or destructors


    Virtual functions allow static dispatch of member function calls at runtime based
    on the dynamic type of the object that the member function is being called on.
    This convention supports object-oriented programming practices commonly associated
    with object inheritance and function overriding. When calling a nonvirtual member
    function or using a class member expression to denote it, the specified function
    is called. Otherwise, a virtual call is made to the final overrider in the dynamic
    type of the object expression.


    However, during the construction and destruction of an object, the rules for virtual
    method dispatch on that object are restricted. The C++ Standard, [class.ctor],
    [ISO/IEC 14882-2014], paragraph 4 states the following:


    +   * Member functions, including virtual functions, can be called during construction
    or destruction. When a virtual function is called directly or indirectly from
    a constructor or from a destructor, including during the construction or destruction
    of the class''s static members, and the object to which the call applies is the
    object (call it x) under construction or destruction, the function called is the
    final overrider in the constructor''s class and not one overriding it in a more-derived
    class. If the virtual function calls an explicit class member access and the object
    expression refers to the complete object of x or of that object''s class subclasses
    but not x or one of its base class subclasses, the behavior is undefined.


    Do not directly or indirectly invoke a virtual function from a constructor or
    destructor that attempts to call under construction or destruction. Because the
    order of construction starts with base classes and moves to more derived classes,
    attempting to call a derived class function from a base class during construction
    is dangerous. The derived class has not had the opportunity to initialize its
    resources, which is why calling a virtual function from a constructor does not
    result in a call to a function in a more derived class. Similarly, an object is
    destroyed in reverse order from construction, so attempting to call a function
    in a more derived class from a destructor may access resources that have already
    been released.'
