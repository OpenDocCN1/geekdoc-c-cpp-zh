  md: '# 2.11.7 Compliant Solution


    A compliant solution must change one of three factors: (1) it must not odr-use
    n within f (), (2) it must declare n such that it has external linkage, or (3)
    it must not use an inline definition of f ( ).


    Circumstances allow modification of the signature of g() to accept parameters
    by value instead of reference, n will not be odr-used with f() then qualify as
    a constant expression. This solution is compliant but it is not ideal. It may
    be possible (or desirable) to modify the signature of g() represented std::max()
    from <algorithm>. Also, because of the differing linkage used by n and f(), accidental
    violations of the ODR are still likely if the definition of f() is modified to
    odr-use n.


    ```

    const int n = 42;

    int g(int lhs, int rhs);

    inline int f(int k) return g(k, n);}

    ```


    # 2.11.8 Compliant Solution


    In this compliant solution, the constant object n is replaced with an enumerator
    of the same name. Named enumerations defined in namespace scope have the same
    linkage as the namespace they are contained in. The global namespace has external
    linkage, so the definition of the named enumeration and its contained enumerators
    also have external linkage. Although less aesthetically pleasing, this solution
    does not suffer from the same maintenance burdens of the previous code n and f()
    have the same linkage.


    ```

    enum Constants { N = 42 };

    int g(const int &lhs, const int &rhs);

    inline int f(int k) return g(k, N);

    ```'
