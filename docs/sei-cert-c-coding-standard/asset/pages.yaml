    # 1.10 System Qualities


    The goal of this coding standard is to produce safe, reliable, and secure systems.
    Additional requirements might exist for safety-critical systems, such as the absence
    of dynamic memory allocation. Other software quality attributes of interest include
    portability, usability, availability, maintainability, readability, and performance.


    Many of these attributes are interrelated in interesting ways. For example, readability
    is an attribute of maintainability; both are important for limiting the introduction
    of defects during maintenance that can result in security flaws or reliability
    issues. In addition, reliability aids code inspection by officers. Reliability
    and availability require proper resource management, which also contributes to
    the safety and security of the system. System attributes such as performance and
    security are in conflict, requiring trade-offs to be considered.


    # 1.11 Automatically Generated Code


    If a code-tool is to be used, it is necessary to select an appropriate tool and
    undertake validation. Adherence to the requirements of this document may provide
    one criterion for assessing a tool.


    Coding variance varies depending on how code is generated and maintained. Categories
    of code include the following:


    +   - Tool-generated, tool-maintained code that is specified and maintained in
    a higher level format from which language-specific source code is generated. The
    source code is generated from this higher level description and then provided
    as input to the language compiler. The generated source code is never viewed or
    modified by the programmer.

    - Tool-generated, hand-maintained code that is specified and maintained in a higher
    level format from which language-specific source code is generated. It is expected
    or anticipated, however, at some point in the development cycle, the tool will
    cease to be used and the generated source code will be visually inspected and/or
    manually maintained.

    - Hand-coded code is manually written by a programmer using a text editor or interactive
    development environment; the programmer maintains source code directly in the
    source-code format provided to the compiler.'
