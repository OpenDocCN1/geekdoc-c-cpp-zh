  md: "# 7 Memory Management (MEM)\n\n# 7.1 MEM50-CPP. Do not access free memory\n\
    \nEvaluating a pointer—including dereferencing the pointer, using it as an operand\
    \ of an arithmetic operation, type casting, and using it as the right-hand side\
    \ of an assignment—that has been deallocated by a memory management function is\
    \ undefined behavior. Pointers to memory that have been deallocated are dangling\
    \ pointers. Accessing a dangling pointer can result in exploitable vulnerabilities.\n\
    \nIt is at the manager's discretion when to reallocate or recycle the memory.\
    \ When memory is freed, all pointers into it become invalid, and its contents\
    \ might be returned to the operating system, making the free space inaccessible,\
    \ or remain intact and accessible. As a result, the data at the free location\
    \ can appear to be valid but change unexpectedly. Consequently, memory must not\
    \ be written to or read from once it is freed.\n\n# 7.1.1 Noncompliant Code Example\
    \ (new and delete)\n\nIn this noncompliant code example, s is dereferenced after\
    \ it has been deallocated. This access results in a write-after-free, the vulnerability\
    \ is exploited to run arbitrary code with the permissions of the vulnerable process.\
    \ Typically, dynamic memory allocations and deallocations are removed, making\
    \ it difficult to recognize and diagnose such problems.\n\n```\n#include <new>\n\
    \nstruct S {\n    void f();\n};\n\nvoid g() noexcept(false) {\n    S *s = new\
    \ S;\n    //\n    delete s;\n    // ...\n    s->f();\n}\n```\n\nThe function g()\
    \ is marked noexcept(false) to comply with MEM52-CPP. Detect and handle memory\
    \ allocation errors."
