    # 2.6.7 Risk Assessment


    Padding bits might inadvertently contain sensitive data such as pointers to kernel
    data structures or passwords. A pointer to such a structure could be passed to
    other functions, causing information leakage.


    | Rule | Severity | Likelihood | Remediation Cost | Priority | Level |

    |---|---|---|---|---|---||

    | DCL55-CPP | Low | Unlikely | High | P1 | L3 |


    # 2.6.7.1 Related Vulnerabilities


    Numerous vulnerabilities in the Linux kernel have resulted from violations of
    this rule.


    CVE-2010-4083 describes a vulnerability in which the semctl call allows privileged
    users to read uninitialized kernel memory because various fields of semid_ds struct
    declared on the stack were not altered or zeroed before being copied back to the
    user.


    CVE-2010-3881 describes a vulnerability in which padding and reserved fields in
    certain structures in QEMU-KVM were not initialized before being copied to user
    space. A privileged host user with access to /dev/kvm could use this flaw to leak
    kernel memory to user space.


    CVE-2010-3477 describes a information leak in act_police where incorrectly initialized
    structures in the traffic-control dump code may allow the disclosure of kernel
    memory to user space applications.


