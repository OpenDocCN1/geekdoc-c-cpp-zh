  md: '# 5 Containers (CTR)


    # 5.1 CTR50-CPP. Guarantee that container indices and iterators are within the
    valid range


    Ensuring that array references are within the bounds of the array is almost entirely
    the responsibility of the programmer. Likewise, when using template library vectors,
    the programmer is responsible for ensuring index are within the bounds of the
    vector.


    # 5.1.1 Noncompliant Code Example (Pointers)


    This noncompliant code example shows a function, insert_in_table(),), that has
    two int parameters, pos and value, both of which can be influenced by data originating
    from untrusted sources. The function performs a check to ensure that pos does
    not exceed the upper bound of the array, by tableSize, but fails to check the
    lower bound. Because pos is declared as a (signed) int, this parameter can assume
    a negative value, resulting in a write outside the bounds of the memory reference.


    ```

    #include <cdef>

    void insert_in_table(int *table, std::size_t tableSize, int pos,

    int value) {

    if (pos >= tableSize) {

    // Handle error

    return;

    }

    table[pos] = value;

    }

    ```


    # 5.1.2 Compliant Solution (size_t)


    In this compliant solution, the parameter pos is declared as size_t, which prevents
    the passing of negative arguments.


    ```

    #include <cdef>

    void insert_in_table(int *table, std::size_t tableSize, std::size_t

    pos, int value) {

    if (pos >= tableSize) {

    // Handle error

    return;

    }

    table[pos] = value;

    }

    ```'
