  md: '# 9.12 ERR61-CPP. Catch exceptions by Ivalue reference


    When an exception is thrown, the value of the object in the throw expression is
    used to initialize an anonymous temporary object called the exception object.
    The type of this exception object is used to transfer to the nearest catch handler,
    which contains an exception declaration with a matching type. The C++ Standard,
    [except.handle], paragraph 16 [ISO/IEC 14882-2014], in part, states the following:


    +   The variable declared by the exception-declaration, of cv T or cv Tδ, is initialized
    from the exception object, of type E, as follows:

    * if T is a base class of E, the variable is copy-initialized from the corresponding
    base subclass of the exception object;

    * otherwise, the variable is copy-initialized from the exception object.


    Because the variable declared by the exception-declaration is copy-initialized,
    it is possible to slice the exception object as part of the copy operation, losing
    valuable information and leading to incorrect error reporting. For more information
    about slicing, see OOP51-CPP. Do not slice derived objects. Further, if the constructor
    of the exception object throws an exception, the copy initialization of the exception-declaration
    results in undefined behavior. See ERR60-CPP. Exception objects must be copy constructible
    for more information.


    Always catch exceptions by Ivalue reference unless the type is a trivial. For
    reference, the C++ Standard, [basic.types], paragraph 9 [ISO/IEC 14882-2014],
    defines trivial types as the following:


    +   Arithmetic types, enumerations, pointer types, pointer to member types.

    ::nullptr_t types, and cv-qualified versions of these are collectively collected
    scalar types.... Scalar types, trivial class types, arrays of such types and cv-qualified
    versions of these types are collectively collected trivial types.


    The C++ Standard, [class], paragraph 6, defines trivial class as the following:


    +   A trivially copyable class is a class that:

    * has no non-trivial copy constructors,

    * has no non-trivial move constructors,

    * has no non-trivial copy assignment operators,

    * has no non-trivial move assignment operators, and

    * has a trivial destructor.


    A trivial class is a class that has a default constructor, has no non-trivial
    default constructors, and is trivially copyable.[Note: In particular, a trivially
    copyable or trivial class does not have virtual functions or virtual base classes.
    — end note]'
