  md: "Exceptions and Error Handling (ERR) - ERR57-CPP. Do not leak resources when\
    \ handling exceptions\n\n#  9.8.5 Compliant Solution (try/catch)\n\nThis compliant\
    \ solution mitigates the potential failures by releasing a and b if an exception\
    \ is thrown during their allocation or during init().\n\n```\nstruct A { /* ...\
    \ */ };\nstruct B { /* ... */ };\n\nclass C {\n    A *a;\n    B *b;\nprotected:\n\
    \    void init() noexcept(false);\npublic:\n    C() : a(nullptr), b(nullptr) {\n\
    \        try {\n            a = new A();\n            b = new B();\n         \
    \   init();\n        } catch (...) {\n            delete a;\n            delete\
    \ b;\n            throw;\n        }\n    }\n};\n```\n\n#  9.8.6 Compliant Solution\
    \ std::unique_ptr\n\nThis compliant solution uses std::unique_ptr to create objects\
