  md: '# 3.4 EXP53-CPP. Do not read uninitialized memory


    Local, automatic variables assume unexpected values if they are read before they
    are initialized. The C++ Standard, [decl.init], paragraph 12 [ISO/IEC 14882-2014],
    states the following:


    If not initialized for an object, the object is de-initialized. When storage for
    an object with automatic or dynamic storage duration is obtained, the object has
    an indeterminate value, and if no initialization is performed for the object,
    that object retains an indeterminate value until that is replaced. If an indeterminate
    value is produced by an evaluation, the behavior is undefined except in the following
    cases:


    +   - If a value of unsigned narrow character type is produced by the evaluation
    of:

    - the second or third operand of a conditional expression,

    - the right operand of a comma expression,

    - the operand of a cast or conversion to an unsigned narrow character type, or

    - a discarded-expression,

    then the result of the operation is an indeterminate value.


    +   - If indeterminate value of unsigned narrow character type is produced by
    the evaluation of the right operand of a simple assignment operator whose first
    operand is an Value of unsigned narrow character type, an indeterminate value
    replaces the value of the object referred to by the left operand.


    +   - If indeterminate value of unsigned narrow character type is produced by
    the evaluation of the initialization expression when initializing an object of
    unsigned narrow character type, that object is initialized to an indeterminate
    value.


    The default initialization of an object is described by paragraph 7 of the subclause:


    +   - default-initialize an object of type T means:

    - if T is a (possibly q-qualified) class type, the constructor for T is called
    (and the initialization is ill-formed if T has no default constructor or overload
    resolution results in an ambiguity in a function that is deleted or inaccessible
    from the context of the initialization);

    - if T is an array type, each element is default-initialized;

    - otherwise, no initialization is performed.


    If a program calls for the default initialization of an object of a const-qualified
    type T, T shall be a class type with a user-provided default constructor.'
  merge: -1
