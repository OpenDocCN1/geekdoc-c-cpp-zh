  md: "# 2.9 DCL58-CPP. Do not modify the standard namespaces\n\nNames introduce new\
    \ declarative regions for declarations, reducing the likelihood of conflicting\
    \ identifiers with other declarative regions. One feature of namespaces is that\
    \ they can be further extended, even within separate translation units. For instance,\
    \ the following declarations are well-formed.\n\n```\nnamespace MyNamespace {\n\
    int i;\n}\n\nnamespace MyNamespace {\nint i;\n}\n\nvoid f() {\n  MyNamespace::i\
    \ = MyNamespace::i = 12;\n}\n```\n\nThe standard library introduces the namespace\
    \ std for standards-provided declarations such as std::string, std::vector, and\
    \ std::for_each. However, it is undefined behavior to introduce new declarations\
    \ in namespace std except under special circumstances. The C++ Standard, paragraphs\
    \ 1 and 2 [ISO/IEC 14882-2014], states the following:\n\n+   1 The behavior of\
    \ a C++ program is undefined if it adds declarations or definitions to namespace\
    \ std or to a namespace std unless otherwise specified. A program may add a template\
    \ specialization for any standard library template to namespace std only if the\
    \ declaration depends on a user-defined type and the specialization meets the\
    \ standard library requirements for the original template and is not explicitly\
    \ prohibited.\n\n2 The behavior of a C++ program is undefined if it declares\n\
    * an explicit specialization of any member function of a standard library class\
    \ template, or\n* an explicit specialization of any member function template of\
    \ a standard library class or class template, or\n* an explicit or partial specialization\
    \ of any member class template of a standard library class or class template.\n\
    \nIn addition to restricting extensions to the namespace std, the C++ Standard,\
    \ [namespace.posix], paragraph 1, further states the following:\n\n> The behavior\
    \ of a C++ program is undefined if it adds declarations or definitions to namespace\
    \ posix or to a namespace within namespace posix unless otherwise specified. The\
    \ namespace posix is reserved for use by ISO/IEC 9945 and other POSIX standards."
