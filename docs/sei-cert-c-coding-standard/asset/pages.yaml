  md: "# 10.5.2 Compliant Solution (Self-Test)\n\nThis compliant solution guards against\
    \ self-copy assignment by testing whether the given parameter is the same as this.\
    \ If self-copy assignment occurs, operator= does nothing; otherwise, the code\
    \ proceeds in the original example.\n\n```\n#include <new>\n\nstruct S { /* ...\
    \ */; // Has nonthrowing copy constructor\n\nclass T {\n    int n;\n    S *sl;\n\
    public:\n    T(const T &rhs) : n(rhs.n), sl(rhs.sl ? new S(*rhs.sl) : nullptr)\n\
    \    {}\n    ~T() { delete sl; }\n\n    T& operator=(const T &rhs) {\n       \
    \ if (this != &rhs) {\n            n = rhs.n;\n            delete sl;\n      \
    \      try {\n                sl = new S(*rhs.sl);\n            } catch (std::bad_alloc\
    \ &) {\n                sl = nullptr; // For basic exception guarantees\n    \
    \            throw;\n            }\n        }\n        return *this;\n    }\n\
    };\n```\n\nThis solution does not provide a strong exception guarantee for the\
    \ copy assignment. Specifically, if an exception is called when evaluating the\
    \ new expression, this has already been modified. However, this solution provide\
