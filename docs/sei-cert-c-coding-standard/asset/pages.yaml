  md: '# 10.9 OOP-CPP. Copy operations must not mutate the source object


    Copy operations (copy constructors and copy assignment operators) are expected
    to copy the salient properties of a source object into the destination object,
    with the resulting object being a "copy" of the original. What is considered to
    be a salient property of the type is type-dependent, but for types expose comparison
    or equality operators, includes any properties used for those comparison operations.
    This expectation leads to assumptions in copy that a copy operation results in
    a destination object with a value representation that is equivalent to the source
    object value representation. Violation of this assumption can lead to unexpected
    behavior.


    Ideally, the copy operator should have an idiomatic signature. For constructors,
    that is `T(const T&)`; and for copy assignment operators, that is `T& operator=(const
    T&)`; Copy constructors and copy assignment operators that do not use an idiomatic
    signature do not meet the requirements of the `CopyConstructible` or `CopyAssignable`
    concept, respectively. This precludes the type from being used with common standard
    library functionality [ISO/IEC 14882-2014].


    When implementing a copy operator, it must not mutate any externally observable
    members of the source object or globally accessible information. Externally observable
    members include, but are not limited to, members that participate in comparison
    or equality operations, whose values are exposed via public APIs, and global variables.


    Before C++11, a copy operation that mutated the source operand was the only way
    to provide move-like semantics. However, the language did not provide a way to
    enforce that operation only occurred when the source operand was at the end of
    its lifetime, which led to fragile APIs like `std::auto_ptr`. In C++11 and later,
    such a situation is a good candidate for a move operation instead of a copy.


    # 10.9.1.1 auto_ptr


    For example, in C++03, `std::auto_ptr` had the following copy operation signatures
    [ISO/IEC 14882-2003]:


    ```

    Copy constructor

    auto_ptr(auto_ptr &);


    Copy assignment

    auto_ptr& operator=(auto_ptr &);

    ```'
