  md: "# 6 Characters and Strings (STR)\n\n# 6.1 STR50-CPP. Guarantee that storage\
    \ for strings has sufficient character data and the null terminator\n\nCopying\
    \ data to a buffer that is not large enough to hold data results in a buffer overflow.\
    \ Buffer overflows occur frequently when manipulating strings [Seacock 2013].\
    \ To prevent such errors, either limit copies through truncation or, preferably,\
    \ ensure that the destination is of sufficient size to hold the data to be copied.\
    \ C-style strings require a null character to indicate the end of the string,\
    \ while the C++ basic_string template requires no such character.\n\n# 6.1.1 Noncompliant\
    \ Code Example\n\nBecause the input is unbounded, the noncompliant code could\
    \ lead to a buffer overflow.\n\n```\n#include <iostream>\nvoid f() {\n    char\
    \ buf[12];\n    std::cin >> buf;\n}\n```\n\n# 6.1.2 Noncompliant Code Example\n\
    \nTo solve this, it might be tempting to use the std::ios_base::width() method,\
    \ but there is still a trap, as in this noncompliant code example.\n\n```\n#include\
    \ <iostream>\nvoid f() {\n    char bufOne[12];\n    char bufTwo[12];\n    std::cin.width(12);\n\
    \    std::cin >> bufOne;\n    std::cin >> bufTwo;\n}\n```\n\nIn this example,\
    \ the first read will not overflow, but fill bufOne with a truncated string. Furthermore,\
    \ the second read could still overflow bufTwo. The C++ Standard, [iostream.extras],\
    \ paragraphs 7–9 [ISO/IEC 14882-2014], describes the behavior of operator>>((basic_istream&,\
    \ char*) and, in part, states the following:\n\n> operator>> stores a null byte\
    \ (charT in the next position, which may be the first position if no characters\
    \ were extracted. operator>> then tells which (0)."
