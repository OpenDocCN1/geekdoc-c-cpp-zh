  md: '# 2.8 DCL57-CPP. Do not let exceptions escape from destructors or deallocation
    functions


    Under circumstances, terminating a destructor, operator delete, or operator delete
    [] by throwing an exception can trigger undefined behavior.


    For instance, the C++ Standard, [basic.stc.dynamic.deallocation], paragraph 3
    [ISO/IEC 14882-2014], in parts, states the following:


    +   If a deallocation function terminates by throwing an exception, the behavior
    is undefined.


    In these situations, the function must be logically declared noexcept because
    throwing an exception from the function can never have well-defined behavior.
    The C++ Standard, [except.spec], paragraph 15, states the following:


    +   A deallocation function (object, array, and placement forms at either global
    or class scope) must not terminate by throwing an exception. Do not declare such
    functions to noexcept(true). However, it is acceptable to rely on the implicit
    noexcept(true) specification or declare noexcept explicitly on the function signature.


    Object destructors are likely to be called during stack unwinding as a result
    of an exception being thrown. If the destructor itself throws an exception, having
    been called as the result of the default effect from calling std::abort() then
    the terminate() is called [ISO/IEC 14882-2014]. When std::abort() is called, no
    further objects are destroyed in an indeterminate program state and undefined
    behavior. Do not terminate a destructor by throwing an exception.


    The C++ Standard, [class.dtor], paragraph 3, states [ISO/IEC 14882-2014] is the
    following:


    +   A declaration of a destructor that does not have an exception-specification
    is implicitly considered to have the same exception-specification as an implicit
    declaration.


    An implicit declaration of a destructor is considered to be noexcept(true) according
    to [except.spec], paragraph 14. As such, destructors must not be declared noexcept(false)
    but may instead rely on implicit noexcept(true) or declare noexcept explicitly.


    Any noexcept function that terminates by throwing an exception violates ERR55-CPP.
    Honor exception specifications.'
