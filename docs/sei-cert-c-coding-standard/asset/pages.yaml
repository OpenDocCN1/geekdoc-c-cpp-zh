  md: '# 7.2 MEM51-CPP. Properly deallocate dynamically allocated resources


    The C programming language provides several ways to allocate memory, such as std::malloc(),
    std::calloc(), which can be used by a C++ program. The C programming language
    defines only one way to free the allocated memory: std::free(). MEM31-C. Free
    dynamically allocated memory when no longer needed and MEM34-C. Only free memory
    dynamically for rules specifically regarding C allocation and deallocation requirements.


    The C++ programming language adds additional ways to allocate memory, such as
    the operators new, new[], and placement new, and allocator objects. Unlike C,
    C++ provides multiple ways to free dynamically allocated memory, such as the operators
    delete, delete[](), and deallocation functions on allocator objects.


    Do not call deallocate on anything other than nullptr, or a pointer returned by
    the corresponding allocation function described by the following.


    | Allocator | Deallocator |

    | --- | --- |

    | global operator new()/new | global operator delete()/delete |

    | global operator new[]/new[] | global operator delete[]/delete[] |

    | class-specific operator new()/new | class-specific operator delete()/delete
    |

    | class-specific operator new[]/new[] | class-specific operator delete[]/delete[]
    |

    | placement new | N/A |

    | allocator<T>::allocate() | allocator<T>::allocate() |

    | std::malloc(), std::calloc(), | std::free() |

    | std::realloc() | |

    | std::get_temporary_buffer() | std::return_temporary_buffer() |


    Passing a value to an inappropriate deallocation function can result in undefined
    behavior.

    The C++ Standard, [expr.delete], paragraph 2 [ISO/IEC 14882-2014], in part, states
    the following:


    > In the first alternative (delete object), the value of the operand delete may
    be a null pointer, a pointer to a non-array object created by a previous new-expression,
    or a pointer to a sub-object (1.8) representing a base class of such object (Clause
    10). If not, the behavior is undefined. In the second alternative (delete array),
    the value of the operand delete may be a null pointer value or a pointer value
    that resulted from a previous new-expression. If not, the behavior is undefined.'
