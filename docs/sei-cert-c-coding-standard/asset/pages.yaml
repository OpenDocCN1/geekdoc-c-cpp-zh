    \nvoid f(const std::string &input) {\n    std::string email;\n\n    // Copy input\
    \ into email converting\"; to \"\"\n    std::string::iterator loc = email.begin();\n\
    \    for (auto i = input.begin(), e = input.end(); i!= e; ++i, ++loc) {\n    \
    \    email.insert(loc, *i != ';' ? ' ' : ';');\n    }\n}\n```"
