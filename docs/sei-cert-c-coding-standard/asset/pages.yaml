  md: '# 2.4 DCL53-CPP. Do not write syntactically ambiguous declarations


    It is possible to devise syntax that can be ambiguously interpreted as an expression
    statement or a declaration. Syntax of this sort is called a vexing parse because
    the compiler must use disambiguation rules to determine the semantic results.
    The C++ Standard, [stmt.ambig], paragraph 1 [ISO/IEC 14882-2014], in part, states
    the following:


    > There is an ambiguity in the grammar involving expression-statements and declarations:
    An expression-statement with a function-style type conversion as its leftmost
    subexpression can be indistinguishable from a declaration where the first declarator
    starts with a (. In those cases the statement is a declaration. [Note: To disambiguate,
    the whole statement might have to be examined to determine if it is an expression-statement
    or a declaration, ...


    A similarly vexing parse exists within the context of a declaration where syntax
    can be ambiguously interpreted as either a function declaration or a declaration
    with a function-style cast as the initializer. The C++ Standard, [dcl.ambig.res],
    paragraph 1, states the following:


    > The ambiguity from the similarity between a function-cast and a declaration
    mentioned in 6.8 can also occur in the context of a declaration. In that context,
    the choice is between a function declaration with a redundant set of parentheses
    around a parameter name and an object declaration with a function-style cast as
    the initializer. Just for the ambiguities mentioned in 6.8, the resolution is
    to consider any construct that could possibly be a declaration a declaration.


    Do not write a syntactically ambiguous declaration. With the advent of uniform
    initialization syntax using a braced-list, there is now syntax that unambiguously
    specifies a declaration instead of an expression statement. Declarations can also
    be disambiguated by using nonfunctionstyle casts, by initializing using =, or
    by removing extraneous parenthesis around the parameter name.'
