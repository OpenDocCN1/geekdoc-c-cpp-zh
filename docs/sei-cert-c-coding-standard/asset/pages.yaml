  md: "Memory Management (MEM) - MEM51-CPP. Properly deallocate dynamically allocated\
    \ resources\n\nDeallocating a pointer that is not allocated dynamically (including\
    \ non-dynamic pointers returned from calls to placement new()) is undefined behavior\
    \ because the pointer value was not obtained by an allocation function. Deallocating\
    \ a pointer that has already been passed to a deallocation function is undefined\
    \ behavior because the pointer value no longer points to memory that has been\
    \ dynamically allocated.\n\nWhen an operator such as new is called, it results\
    \ in a call to an overloadable operator of the same name, such as operator new().\
    \ These overloadable functions can be called directly but by the same restrictions\
    \ as their operator counterparts. That is, calling operator delete() and passing\
    \ a pointer parameter has the same constraints as calling the delete operator\
    \ on that pointer. Further, the overhead are subject to scope resolution, so it\
    \ is possible (but not permissible) to call a class-specific operator to allocate\
    \ an object by a global operator to deactivate the object.\n\nSee MEM53-CPP. Explicitly\
    \ construct and destruct objects when manually managing object lifetime for lifetime\
    \ management of objects when using memory management functions other than new\
    \ and delete operators.\n\n# 7.2.1 Noncompliant Code Example (placement new())\n\
    \nIn this noncompliant code, the local variable s1 is passed as the expression\
    \ to the placement new operator. The resulting pointer of that call is passed\
    \ to ::operator delete(), resulting in undefined behavior due to ::operator delete()\
    \ attempting to free memory that was not returned by ::operator new().\n\n```\n\
    #include <iostream>\n\nstruct S {\n    S() { std::cout << \"S::S\" << std::endl;\
    \ }\n    -S(S) { std::cout << \"S:-S\" << std::endl; }\n};\n\nvoid f1() {\n  \
    \  S s1;\n    S *s2 = new (&s1) S;\n\n    // ...\n\n    delete s2;\n}\n```\n\n\
    SEI CERT C++ CODING STANDARD (2016 EDITION) | V01\n\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
    \ release and unlimited distribution."
