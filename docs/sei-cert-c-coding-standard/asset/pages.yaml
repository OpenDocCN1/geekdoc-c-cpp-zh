  md: '# 4 Integers (INT)


    # 4.1 INT50-CPP come in two forms: scoped enumerations in which the underlying
    type is


    Enumerations in C++ come in two forms: scoped enumerations in which the underlying
    type is fixed and unscoped enumerations in which the underlying type may or not
    be fixed. The range of values that can be represented by either form of enumeration
    may include values not specified by the enumeration itself. The range of valid
    enumeration values for an enumeration type is defined by the C++ Standard; [ISO/IEC
    14882-2014].


    > For an enumeration whose underlying type is fixed, the values of the enumeration
    are the values of the underlying type. Otherwise, for an enumeration where emin
    is the smallest enumerator and emax is the largest, the values of the enumeration
    are in the range d to dmax, defined as follows: Let K be 1 for a two''s complement
    representation and 0 for one''s complement or sign-magnitude representation. dmax
    is the smallest value greater than or equal to max(emin - K) and 2^M-1, where
    M is a non-negative integer. dmin is zero if emax is non-negative and -(dmax +
    K) otherwise. The size of the smallest bit-field large enough to hold all the
    values of the enumeration type is max(M, 1) if dmin is zero and M + 1 otherwise.
    It is possible to define an enumeration that has values not defined by any of
    its enumerators. If the enumeratorlist is empty, the values of the enumeration
    are as if it has a single enumerator with value 0.


    The C++ Standard, [expr.static.cast], paragraph 10, states the following:


    > A value of integer or enumeration type can be explicitly converted to an enumeration
    type. The value is unchanged if the original value is within the range of the
    enumeration (7.2). Otherwise, the resulting value is unspecified (and might not
    be in range). A value of floating-point type can also be converted to an enumeration
    type. The resulting value is the same as converting the original value to the
    underlying type (4.9), and subsequently to the enumeration type.


    To avoid operating on unspecified values, the arithmetic value cast must be within
    the range of values that the enumeration can represent. When dynamically checking
    for out-of-range values, checking must be performed before the cast expression.'
