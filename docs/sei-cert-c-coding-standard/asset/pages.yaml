  md: "Characters and Strings (STR) - STR50-CPG. Guarantee that storage for strings\
    \ has sufficient space for character data and the null terminator\n\nConsequently,\
    \ it is necessary to call width() prior to each operator>> call a bounded area.\
    \ However, this does not account for the input being truncated, which may lead\
    \ to information loss or a possible vulnerability.\n\n# 6.1.3 Compliant Solution\n\
    \nThe best solution for ensuring that data is not truncated and for guarding against\
    \ buffer overflows is to use std::string instead of a bounded array, as in this\
    \ compliant solution.\n\n```\n#include <iostream>\n#include <string>\n\nvoid f()\
    \ {\n  std::string input;\n  std::string stringOne, stringTwo;\n  std::cin >>\
    \ stringOne >> stringTwo;\n}\n```\n\n# 6.1.4 Noncompliant Code Example\n\nIn this\
    \ noncompliant example, the unformatted input function std::basic_istream<T>::read()\
    \ is used to read an unformatted character array of 32 from the given file. However,\
    \ the read() function does not guarantee that the string will be terminated, so\
    \ the subsequent call of the std::string constructor results in undefined behavior\
    \ if the character array does not contain a terminator.\n\n```\n#include <fstream>\n\
    #include <string>\n\nvoid f(std::istream &in) {\n  char buffer[32];\n  try {\n\
    \    in.read(buffer, sizeof(buffer));\n  } catch (std::ios_base::failure &e) {\n\
    \    // Handle error\n  }\n\n  std::string str(buffer);\n  // ...\n}\n```\n\n\
    SEI CERT C++ CODING STANDARD (2016 EDITION) | V01\n199\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
    \ release and unlimited distribution."
