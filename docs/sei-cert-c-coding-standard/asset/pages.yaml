  md: '# 3.11 EXP60-CPP. Do not pass a nonstandard-layout-type object across execution
    boundaries


    Standard-layout types can be used to communicate with code written in other programming
    languages, as the layout of the type is strictly specified. The C++ Standard,
    [class], paragraph 7 [ISO/IEC 14882-2014], defines a standard-layout class as
    that


    +   * does not have virtual functions,

    * has the same access control for all nonstatic data members,

    * has no base classes of the same type as the first nonstatic data member,

    * has nonstatic data members declared in one class within the class hierarchy,
    and recursively, does not have data members of nonstandard-layout type.


    An execution boundary is the delimitation between code compiled by compilers,
    including different versions of a compiler produced by the same vendor. For instance,
    a function may be declared in a header file but defined in a library that is loaded
    at runtime. The execution boundary exists between the call site in the execution
    and the function implementation in the library. Such boundaries are also called
    ABI (application binary interface) because they relate to the interoperability
    of application boundaries.


    Do not make assumptions about the specific layout of objects with nonstandard-layout
    types. For objects compiled by one compiler that are referenced by code compiled
    by another compiler, such assume correctness and portability concerns. The layout
    of the object generated by the first compiler is not guaranteed to be identical
    to the layout generated by the second compiler, even if both are conforming C++
    implementations. However, some implementations may document binary compatibility
    that can be relied on for passing nonstandard-layout objects between execution
    boundaries.


    A special instance of this guidance involves non-C++ code compiled by a different
    compiler, as C standard library implementations are exposed via the C++ standard
    library. C standard library functions are exposed with C++ signatures, and the
    system frequently assists in ensuring that types match appropriately. This process
    allows passing a pointer to a C++ object to a function expecting a char* without
    additional to suppress the type mismatch. However, C standard library functions
    accept a void* for which any C++ pointer type will suffice. Passing a pointer
    to a nonstandard-layout type in this situation results in indeterminate behavior
    because it depends on the behavior of the object as well as the layout of the
    given object. For more information, see EXP60-CPP. Do not call a function with
    a mismatched linkage.


    Pass a non-layout object execution boundary exists only when both sides of the
    execution boundary adhere to the ABI. This is permissible if the same version
    of a compiler is used to compile both sides of the execution boundary is ABI-compatible
    across multiple versions, or if the differing compilers document that they adhere
    to the same ABI.'
