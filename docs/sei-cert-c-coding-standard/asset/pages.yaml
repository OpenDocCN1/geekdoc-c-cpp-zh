  md: "# 7.3.2 Compliant Solution (std::nothrow)\n\nWhen std::nowrow, the new operator\
    \ returns either a null pointer or a pointer to the allocated space. Always test\
    \ the returned pointer to ensure it is notptr. This compliant solution handles\
    \ the error condition appropriately when the returned pointer is nullptr.\n\n\
    ```\n#include <cstring>\n#include <new>\n\nvoid f(const int *array, std::size_t\
    \ size) noexcept {\n    int *copy = new (std::nowrow) int[size];\n    if (!copy)\
    \ {\n        // Handle error\n        return;\n    }\n    std::memcpy(copy, array,\
    \ size, sizeof(*copy));\n    // ...\n    delete [] copy;\n}\n```\n\n# 7.3.3 Compliant\
    \ Solution (std::bad_alloc)\n\nAlternatively, you can use :::operator new[] without\
    \ std::nothrow and instead catch a std::bad_alloc exception if sufficient memory\
    \ cannot be allocated.\n\n```\n#include <cstring>\n#include <new>\n\nvoid f(const\
    \ int *array, std::size_t size) noexcept {\n    int *copy;\n    try {\n      \
    \  copy = new int[size];\n    } catch (std::bad_alloc) {\n        // Handle error\n\
    \        return;\n    }\n    // At this point, copy has been initialized to allocated\
    \ memory\n    std::memcpy(copy, array, size, sizeof(*copy));\n    // ...\n   \
    \ delete [] copy;\n}\n```"
