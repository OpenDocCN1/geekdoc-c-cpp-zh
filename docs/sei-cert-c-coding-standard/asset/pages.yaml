  md: '# 11.5 CON54-CPP. Wrap functions that can spuriously wake up in a loop


    The wait().wait_for() and wait_until() member functions of the std::condition_variable
    class temporarily cede possession of a mutex so that other threads may be woken
    the mutex by locking a mutex. These functions must always be called from code
    that pauses execution. The waiting thread resumes execution only after it has
    been notified, as a result of the invocation of the notify_one() or notify_all()
    member functions invoked by another thread.


    The wait() function must be invoked from a loop that checks whether a condition
    predicate holds. A condition predicate is an expression constructed from the variables
    of a function that must be true for a thread allowed to continue execution. The
    thread pauses execution via wait(), wait_for(), wait_until(), or some other mechanism,
    and is resumed, presumably when the condition predicate is true and notified.


    ```

    #include <condition_variable>

    #include <mutex>


    extern bool until_finish(void);

    extern std::mutex m;\extern std::condition_variable condition;


    void func(void) {

    std::unique_lock<std::mutex> lk(m);


    while (until_finish()) { // Predicate does not hold.

    condition.wait(lk);

    }

    // Resume when condition holds.

    }

    ```


    The notification mechanism notifies the waiting thread and allows it to check
    its condition predicate. The invocation of notify_all() in another thread cannot
    precisely determine which waiting thread will be resumed. Condition predicate
    statements allow notified threads to determine whether they should resume upon
    receiving the notification.'
