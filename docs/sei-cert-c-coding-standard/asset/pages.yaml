  md: "# 5.5 CTR54-CPP. Do not subtract iterators that do not refer to the same container\n\
    \nWhen two iterators are subtracted, both must point to elements of the same array\
    \ object or to one past the last element of the array object; the result is the\
    \ difference of the subscripts of the two elements. Similarly, when two iterators\
    \ are subtracted (including via std::distance()), both iterators must refer to\
    \ the same container object or must be obtained via a call to end() or (end())\
    \ of the same container.\n\nIf two unrelated iterators are subtracted, the operation\
    \ results in undefined behavior [ISO/IEC 14882-2014]. Do not subtract two iterators\
    \ (including pointers) unless both point into the same container or one past the\
    \ end of the same container.\n\n# 5.5.1 Noncompliant Code Example\n\nThis noncompliant\
    \ example attempts to determine whether the pointer test is within the range [r,\
    \ r+n]. However, when test does not point within the given range, as in this example,\
    \ subtraction produces undefined behavior.\n\n```\n#include <cstddef>\n#include\
    \ <iostream>\n\ntemplate <typename Ty>\nbool in_range(const Ty *test, const Ty\
    \ *r, size_t n) {\n  return 0 == (test - r) && (test - r) < (std::ptrdiff_t)n;\n\
    }\n\nvoid f() {\n  double foo[10];\n  double *x = &foo[0];\n  double bar;\n  std::cout\
    \ << std::boolalpha << in_range(&bar, x, 10);\n}\n```\n\n# 5.5.2 Noncompliant\
    \ Code Example\n\nIn this noncompliant example, the in_range function is implemented\
    \ using a comparison expression instead of subtraction. The C++ Standard. [expr.rel],\
    \ paragraph 4 [ISO/IEC 14882-2014], states the following:\n\nIf two operands p\
    \ and q compare, p<=q and p>=q both yield true and p<q and p>q yield false. Otherwise,\
    \ if a pointer p is greater than a pointer q, p>=q, p=q, q<=p, and q<p all yield\
    \ true and p<q, q=-p, q=p, q>p all yield false. The result of each of the operators\
    \ is unspecified."
