  md: "Object Oriented Programming (OOP) - OOP52-CPP. Do not delete a polymorphic\
    \ object without a virtual destructor\n\n# 10.3 OOP52-CPP. Do not delete a polymorphic\
    \ object without a virtual destructor\n\nThe C++ Standard, [expr.delete], paragraph\
    \ 3 [ISO/IEC 14882-2014], states the following:\n\n> In the first alternative\
    \ (delete object), if the static type of the object to be deleted is different\
    \ from its dynamic type, the static type should be a class base of the dynamic\
    \ type of the object to be deleted and the static type should have a virtual destructor\
    \ or the behavior is undefined. In the second alternative (delete array) if the\
    \ dynamic type of the object is deleted from its static type, the behavior is\
    \ undefined.\n\nDo not delete an object of derived class type through a pointer\
    \ to its base class type that has a non-virtual destructor. Instead, the base\
    \ class should be defined with a virtual destructor. Deleting through a pointer\
    \ to a type without a virtual destructor results in undefined behavior.\n\n# 10.3.1\
    \ Noncompliant Code Example\n\nIn this noncompliant example, b is a polymorphic\
    \ pointer whose static type is Base * and dynamic type is Derived. When b is deleted,\
    \ it results in undefined behavior because Base does not have a virtual destructor.\
    \ The C++ Standard, [class.dtor], paragraph 4 [ISO/IEC 14882-2014] states the\
    \ following:\n\n> If a class has no user-declared destructor, a destructor is\
    \ implicitly declared as defaulted. An implicitly declared destructor is an inline\
    \ public member of its class.\n\nThe implicitly declared destructor is not declared\
    \ virtual even in the presence of other virtual functions.\n\n```\nstruct Base\
    \ {\n    virtual void f();\n};\nstruct Derived : Base {\n\nvoid f() {\n    Base\
    \ *b = new Derived();\n    // ...\n    delete b;\n}\n```\n\n333\nSEI C++ CODING\
    \ STANDARD (2016 EDITION) | V01\nSoftware Engineering Institute | Carnegie Mellon\
    \ University\n[DISTRIBUTION STATEMENT A] Approved for public release and unlimited\
    \ distribution."
