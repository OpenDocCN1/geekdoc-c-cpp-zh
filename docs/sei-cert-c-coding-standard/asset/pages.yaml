  md: '# 2.7 DCL56-CPP. Avoid cycles during initialization of static objects


    The C++ Standard, [stmt.cd], paragraph 4 [ISO/IEC 14882-2014], states the following:


    The zero-initialization (8.5) of all block-scope variables with static storage
    duration (3.7.1) or thread storage duration (3.7.2) is performed before any other
    initialization takes place. Constant initialization (3.6.2) of a block-scope entity
    with static storage duration, if applicable, is performed before its block is
    entered. An implementation is permitted to perform early initialization of other
    block-scope variables with static or thread storage duration under the same conditions
    that an implementation is permitted to statically initialize a variable with static
    or thread storage duration in namespace (3.6.2). Otherwise such a variable is
    initialized the first time control passes through its declaration; a variable
    is considered initialized upon the completion of its initialization. If the initialization
    exits by throwing an exception, the initialization is not complete, so it will
    be tried again the next time control enters the declaration. If control enters
    the declaration concurrently while the variable is being initialized, the concurrent
    execution shall wait for completion of the initialization. If control reenters
    the declaration recursively while the variable is being initialized, the behavior
    is undefined.


    Do not reenter during the initialization of a static variable. If a function is
    reentered during the constant initialization of a static object inside that function,
    the behavior of the program is *undefined*. Infinite recursion is not required
    to trigger undefined behavior, the function need only recurse once as part of
    the initialization. A recursive call can also result in a deadlock due to a non-recursive
    synchronization primitive.


    Additionally, the C++ Standard, [basic.start.init], paragraph 2, in part, states
    the following:


    Dynamic initialization of a non-local variable with static storage duration is
    either ordered or unordered. Definitions of explicitly specified class template
    static members have ordered initialization. Other class template static members
    (i.e., implicitly or explicitly instantiated specializations) with static storage
    duration have unordered initialization. Variables with ordered initialization
    defined within a single translation unit shall be initialized in the order of
    their definitions in the translation unit. If a program starts a thread, the subsequent
    initialization of a variable is unsequenced with respect to the initialization
    of a variable defined in a different translation unit. The initialization of a
    variable is indeterminate unsequenced with the initialization of a variable defined
    in a different translation unit. If a program starts a thread, the subsequent
    unordered initialization of a variable is unsequenced with respect to every other
    dynamic initialization. Otherwise, the unordered initialization of a variable
    is is sequenced with respect to every other dynamic initialization.'
