  md: "# # 11 Concurrency (CON)\n\n# ## 11.1 CON50-CPP. Do not destroy a mutex while\
    \ it is locked\n\nMutex objects are used to protect shared data from being concurrently\
    \ accessed. A mutex object is destroyed while a thread is blocking for the lock,\
    \ critical sections and shared data are no longer protected.\n\nThe C++ Standard,\
    \ [thread.mutex.class], paragraph 5 [ISO/IEC 14882-2014], states that:\n\n> >\
    \ The behavior of a program is undefined if it destroys a mutex object or a thread\
    \ terminates owning a mutex object.\n\nSimilar wording exists for std::recursive_mutex,\
    \ std::timed_mutex, and std::shared_timed_mutex. These statements imply that destroying\
    \ a mutex object while a thread is waiting on it is undefined behavior.\n\n# ###\
    \ 11.1.1 Noncompliant Code Example\n\nThis noncompliant code example creates several\
    \ threads that invoke the do_work() function, passing a unique number as ID.\n\
    \nUnfortunately, this code contains a race condition, allowing the mutex to be\
    \ destroyed while it is still owned, as start_threads() may invoke the mutex's\
    \ destructor before all of the threads have exited.\n\n```\n#include <mutex>\n\
    #include <thread>\n\nconst size_t maxThreads = 10;\n\nvoid do_work(size_t i, std::mutex\
    \ *pm) {\n    std::lock_guard<std::mutex> lk(*pm);\n    // Access data protected\
    \ by the lock.\n}\n\nvoid start_threads() {\n    std::thread threads[maxThreads];\n\
    \    std::mutex mp;\n\n    for (size_t i = 0; i < maxThreads; ++i) {\n       \
    \ threads[i] = std::thread(do_work, i, &mp);\n    }\n}\n```\n\n![](img/03d7c1b3f34ef4416e38a33cdad88644_370_0.png)"
