  md: "Exceptions and Error Handling (ERR) - ERR-62-CPP. Detect errors when converting\
    \ a string to a number\n\nFor instance, if the text 12345678901234567890 is the\
    \ first converted value read from the standard input stream, then i will have\
    \ the value std::numeric_limits<int>::max() (per [facet.num.get.virtuals] paragraph\
    \ 3). if the text abcdefg is the first converted value from the standard input\
    \ stream, then i will have the value 0 and j will remain uninitialized.\n\n# 9.13\
    \ Compliant Solution\n\nIn this compliant solution, exceptions are enabled so\
    \ that any conversion failure in an exception except being thrown. However, this\
    \ approach cannot distinguish between values are valid and which values are invalid\
    \ and must assume that all values are invalid. Both the badbit and failbit flags\
    \ are set to ensure that conversion errors are as well as loss of integrity with\
    \ the stream are treated as exceptions.\n\n```\n#include <iostream>\n\nvoid f()\
    \ {\n    int i, j;\n\n    std::cin.exceptions(std::istream::failbit | std::istream::badbit);\n\
    \    try {\n        std::cin >> i >> j;\n        // ...\n    } catch (std::istream::failure\
