  md: "# 10.1.1 Noncompliant Code Example\n\nIn this noncompliant code example, the\
    \ base class attempts to seize and release an object's resources through calls\
    \ to virtual functions from the constructor and destructor. However, B::B() constructor\
    \ calls B::seize() rather than D::seize(). Likewise, the B::~B() destructor calls\
    \ B::release() rather than D::release().\n\n```\nstruct B {\n    B() { seize();\
    \ }\n    virtual ~B() { release(); }\n\nprotected:\n    virtual void seize();\n\
    \    virtual void release();\n};\n\nstruct D : B {\n    virtual ~D() = default;\n\
    \nprotected:\n    void seize() override {\n        B::seize();\n        // Get\
    \ derived resources...\n    }\n\n    void release() override {\n        // Release\
    \ derived resources...\n        B::release();\n    }\n};\n```\n\nThe result of\
    \ this code is that no derived class resources will be seized or released during\
    \ the initialization and destruction of type D. At the time of the call to seize()\
    \ from B::B(), the D constructor has not been entered, and the behavior of the\
    \ under-construction object will be to invoke B::seize() rather than D::seize().\
    \ A similar situation occurs for the call to release() in the base class destructor.\
    \ If the functions seize() and release() were declared to be pure virtual functions,\
    \ the result would be undefined behavior."
