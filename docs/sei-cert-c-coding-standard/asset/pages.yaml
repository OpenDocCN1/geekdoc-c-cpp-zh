  md: "# ### 3.6.4 Compliant Solution\n\nThis compliant solution uses the mutable\
    \ keyword when declaring cachedValue, which allows cachedValue to be mutated within\
    \ a const context without triggering undefined behavior.\n\n```\n#include <iostream>\n\
    \nclass S {\n    mutable int cachedValue;\n\n    int compute_value() const; //\
