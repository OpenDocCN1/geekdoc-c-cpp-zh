    # 2 Declarations and Initialization (DCL)


    # 2.1 DCL50-CPP. Do not define a C-style variadic function


    Functions can be defined to accept more formal arguments at the call site than
    are specified by the parameter declaration clause. Such functions are called variadic
    functions because they can accept a variable number of arguments from a caller.
    C++ provides two mechanisms by which a variadic function can be defined: function
    packs and a C-style ellipsis as the final parameter declaration.


    Variadic functions are flexible because they accept a varying number of arguments
    of differing types. However, they can also be hazardous. A variadic function using
    a C-style ellipsis (hereafter called variadic function) has no mechanisms to check
    the type of arguments passed to the function or to check that the number of arguments
    passed matches the semantics of the function definition. Consequently, a runtime
    call to a C-style variadic function that passes inappropriate arguments yields
    undefined behavior. undefined behavior could be exploited to run arbitrary code.


    Do not define C-style variadic functions. (The declaration of a C-style variadic
    function that is never permitted, it is not harmful and can be useful in unattended
    contexts.)


    Issues with C-style variadic functions can be avoided by using variadic functions
    defined with parameter packs for situations where a variable number of arguments
    should be passed to a function. Additionally, currying to C''s printf() family
    of functions, C++ output is implemented with the overloaded std-argument function.
    For example, std::cout::operator<< is implemented with the overloaded std-argument
    operators.


    # 2.1.1 Noncompliant Code Example


    This noncompliant code example uses a C-style variadic function to add a series
    of integers together. The function reads arguments until the value 0 is found.
    Calling this function without passing the value 0 as an argument (the first two
    arguments) results in undefined behavior. Furthermore, passing any type other
    than an int results in undefined behavior.'
