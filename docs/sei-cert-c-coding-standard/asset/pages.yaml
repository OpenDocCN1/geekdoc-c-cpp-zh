  md: '# 3.14 EXP63-CPP. Do not rely on the value of a moved-from object


    Many objects, including user-defined types and types provided by the Standard
    Template Library support move mechanisms. Except in rare circumstances, an object
    of a type that supports move operations (move initialization or move assignment)
    will be left in a valid, unspecified state after the object''s value has been
    moved.


    Passing an object as an argument that binds to an rvalue reference, including
    via implicit call syntax as move assignment or move construction, moves the object''s
    state into another object. Upon return from such a function call, the object that
    was bound is considered to be in the moved-from state. Once an object is the moved-from
    state, the only operations that may be safely performed on object are ones for
    which the operation has no preconditions, because it is unknown the unspecified
    state of the object will satisfy those predictions. While some types have explicitly-defined
    preconditions, such as type defined by the Standard Template Library, it should
    be assumed that the only operations that may be safely performed on a moved-from
    object are reinitialization through moving the object into the lifetime of the
    object by invoking its destructor.


    Do not rely on the value of a moved-from object unless the object is documented
    to be in a well-specified state. While the object is guaranteed to be in a valid
    state, relying on unspecified values leads to unspecified behavior. Since the
    behavior is not documented, this can turn in result abnormal program behavior
    and performance concerns.


    The following Standard Library functions are guaranteed to leave the moved-from
    object in a well-specified state.


    | Type | Functionality | Moved-From State |

    |---|---|---|

    | `std::unique_ptr` | Move construction, Move assignment, "Converting" move construction,
    "Converting" move assignment (likewise std::unique_ptr array objects (with a runtime
    length)) | The moved-object is guaranteed to refer to a null pointer value, paragraph
    4 [ISO/IEC 14882-2014]. |

    | `std::shared_ptr` | Move construction, Move assignment, "Converting" move construction,
    "Converting" move assignment | The moved-object should be "empty," [util.smartptr.shared.const],
    paragraph 22 and [util.smartptr.shared.assign], paragraph 4 |

    | `std::shared_ptr` | Move construction, Move assignment from a `std::unique_ptr`
    | The moved-object is guaranteed to refer to a null pointer value, [util.smartptr.shared.count],
    paragraph 29 and [util.smartptr.shared.assign], paragraph 6 |'
