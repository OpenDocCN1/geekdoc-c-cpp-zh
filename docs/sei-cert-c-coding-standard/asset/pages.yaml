  md: "Declarations and Initialization (DCL) - DCL56-CPP. Avoid cycles during initialization\
    \ of static objects\n\nDo not create an initialization interdependency between\
    \ static objects with dynamic initialization unless they are ordered with respect\
    \ to one another. Unordered initialization, especially prevalent across translation\
    \ boundaries, results in unspecified behavior.\n\n# 2.7.1 Noncompliant Code Example\n\
    \nThis noncompliant code example attempts to implement an efficient factorial\
    \ function using caching. Because the initialization of the static local array\
    \ cache involves recursion, the behavior of the function is undefined, even though\
    \ the recursion is infinite.\n\n```\n#include <stdexcept>\nint fact(int noexcept(false)\
    \ {\n  if (i < 0) {\n    // Negative factorials are undefined.\n    throw std::domain_error(\"\
    i must be >= 0\");\n  }\n  static const int cache[] = {\n    fact(0), fact(1),\
    \ fact(2), fact(3), fact(4), fact(5),\n    fact(6), fact(7), fact(8), fact(9),\
    \ fact(10), fact(11),\n    fact(12), fact(13), fact(14), fact(15), fact(16)\n\
    \  };\n  if (i < (sizeof(cache) / sizeof(int))) {\n    return cache[i];\n  }\n\
    \  return i > 0 ? i * fact(i - 1) : 1;\n}\n```\n\n# 2.7.1.1 Implementation Details\n\
    \nIn Microsoft Visual Studio 2015 and GCC 6.1.0, the recursive initialization\
    \ of cache deadlocks while initializing the static variable in a thread-safe manner.\n\
    \nSEI CERT C++ CODING STANDARD (2016 EDITION) | V01\n\nSoftware Engineering Institute\
    \ | Carnegie Mellon University\n[DISTRIBUTION STATEMENT A] Approved for public\
    \ release and unlimited distribution."
