  md: '# 10.8 OOP5CPP. Prefer special member functions and overloaded operators to
    C Standard Library functions


    C Standard library functions perform bitwise operations on objects. For instance,
    std::memcmp compares the bytes the object representation of two objects, and std::memcpy()
    copies the bytes object representation into a data buffer. For some object types,
    it results in undefined or abnormal program behavior.


    The C++ Standard, [class], paragraph 6 [ISO/IEC 14882-2014], states the following:


    > A trivially copyable class is a class that:

    * has no non-trivial copy constructors,

    * has no non-trivial move constructors,

    * has no non-trivial copy assignment operators,

    * has no non-trivial move assignment operators, and

    * has a trivial destructor.


    A trivial class that has a default constructor, has no non-trivial default constructors,
    and is trivially copyable. [Note: In particular, a trivially copyable or trivial
    class does not have virtual functions or virtual base classes. — end note]


    Additionally, the C++ Standard, [class], standard-layout class, paragraph 7, states
    that:


    +   A standard-layout class is a class that:

    * has no non-static data members of type non-standard-layout class (or of such
    types) or reference,

    * has no virtual functions and no virtual base classes,

    * has the same access control for all non-static data members,

    * has no non-standard-layout base classes,

    * either has no non-static data members in the most derived class and at most
    one base class with non-static data members, or no base classes with non-static
    data members, and

    * has no base classes of the same type as the first non-static data member.


    Do not use std::memset() to initialize an object of nontrivial class as it may
    not properly initialize the value representation of the object. Do not use std::memcpy()
    (or related bitwise functions) to initialize a copy of an object of nontrivial
    class, as it may not properly initialize the value representation of the copy.
    Do not use std::memcmp (or related bitwise comparison functions) to compare objects
    of nonstandard-layout class type, as it may not properly compare the value representations
    of objects. In all cases, it is best to prefer alternatives.'
