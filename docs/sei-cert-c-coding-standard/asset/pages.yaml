  md: '# 3 Expressions (EXP)


    # 3.1 EXP50-CPP. Do not depend on the order of evaluation for side effects


    In C++, modifying an object, calling a library I/O function, accessing a volatile-qualified
    value, or calling a function that performs one of these actions are ways to modify
    the state of the execution environment. These actions are called side effects.
    All relationships between value computations and side effects can be described
    in terms of sequencing of their evaluations. The C++ Standard, [intro:execution],
    paragraph 13 [ISO/IEC 14822-2014], establishes three terms:


    +   Sequenced before is an asymmetric, transitive, pair-wise relation between
    evaluations executed by a single thread, which induces a partial order among evaluations.
    Given any two evaluations A and B, if A is sequenced before B, then the execution
    of A will precede the execution of B. If A is not sequenced before B and B is
    not sequenced before A, then A and B are unsequenced. [Note: The execution of
    unsequenced evaluations can overlap.— Evaluation A and B are indeterminate when
    A is sequenced before B or B is sequenced before A, but it is unspecified. [Note:
    Indeterminately sequenced evaluations cannot overlap, but either could be executed
    first.--- end note]


    Paragraph 15 further states (nonnormative text removed for brevity) the following:


    Except where noted, evaluations of operands of individual operators and subexpressions
    of expressions are unsequenced. ... The value computations of the operands of
    an operator are sequenced before the value computation of the operator. If a side
    effect on a scalar object is unsequenced relative to either other side effect
    on the same scalar object or a value computation using the same object, and are
    not potentially concurrent, the behavior is undefined. When calling a function
    (whether or not the function is inline), every value computation and side effect
    associated with any argument, or with the postfix expression designating the called
    function, is sequenced before execution of every expression or statement in the
    body of the called function ... Every evaluation in the calling function (including
    other function calls) that is not otherwise specifically sequenced before or after
    the execution of the body of the called function is indeterminately sequenced
    with respect to the execution of the called function. Several contexts in C++
    cause evaluation of a function unit, even though no corresponding function call
    syntax appears in the translation. The sequencing constraints on the execution
    of the called function (as described above) are features of the function calls
    as evaluated, whatever the syntax of the expression that the function might be.


    SEI C++ CODING STANDARD (2016 EDITION) | V01

    Software Engineering Institute | Carnegie Mellon University

    [DISTRIBUTION STATEMENT A] Approved for public release and unlimited distribution.'
