  md: "Miscellaneous (MSC) - MSC50-CPP: Do not use std::rand() for generating pseudorandom\
    \ numbers\n\n# # 12 Miscellaneous (MSC)\n\n# ## 12.1 MSC50-CPP. Do not use std::rand()\
    \ for generating pseudorandom numbers\n\nPseudorandom number generators use mathematical\
    \ algorithms to produce a sequence of numbers with good statistical properties,\
    \ but the numbers are not genuinely random.\n\nThe Standard `rand()` function,\
    \ exposed through the C++ standard library through `<cstdlib>` as `std::rand`,\
    \ makes no guarantees as to the quality of random sequence produced. The numbers\
    \ generated by some implementations of `std::rand()` have a comparatively short\
    \ cycle, and the numbers can be predictable. Applications that have strong pseudorandom\
    \ number requirements must use a generator that is known to be sufficient for\
    \ their needs.\n\n# ### 12.1.1 Noncompliant Code Example\n\nThe following noncompliant\
    \ code generates an ID with a numeric part produced by calling the `rand()` function.\
    \ The IDs produced are predictable and have limited randomness. Further, depending\
    \ on the value of RAND_MAX, the resulting value can have modulo bias.\n\n```\n\
    #include <cstdlib>\n#include <string>\n\nvoid f() {\n    std::string id(\"ID\"\
    ); // Holds the ID, starting with the\n    // characters \"ID\" followed by a\n\
    \    // random integer in the range [0-10000]\n    id += std::to_string(std::rand()\
    \ % 10000);\n    // ...\n}\n```\n\nSEI CERT C++ CODING STANDARD (2016 EDITION)\
    \ | V01\nSoftware Engineering Institute | Carnegie Mellon University\n[DISTRIBUTION\
    \ STATEMENT A] Approved for public release and unlimited distribution."
  merge: -1
  pgno: 400
- img_proc: true
  md: "# 12.1.2 Compliant Solution\n\nThe C++ standard library provides mechanisms\
    \ for fine-grained control over pseudorandom number generation. It breaks random\
    \ number generation into two parts: one is the algorithm for providing random\
    \ values (the engine), and the other is responsible for distributing the random\
    \ values via a density function (the distribution). The distribution object is\
    \ not strictly required, but it works to ensure that values are properly distributed\
    \ within a given range of improperly distributed due to biases. This compliant\
    \ solution uses the Mersenne Twister algorithm for generating random values and\
    \ a uniform distribution to negate the modulo bias noncompliant code example.\n\
    \n```\n#include <random>\n#include <string>\n\nvoid f() {\n    std::string id(\"\
    ID\"); // Holds the ID, starting with the\n                            // characters\
    \ \"ID\" followed by a random\n                            // integer in the range\
    \ [0-10000].\n    std::uniform_int_distribution<int> distribution(0, 10000);\n\
    \    std::random_device rd;\n    std::mt19937 engine(rd);\n    id = std::to_string(distribution(engine));\n\
    }}\n```\n\nThis compliant solution also seeds the random number engine, in conformance\
    \ with MSC51-CPP. Ensure your random number generator is properly seeded.\n\n\
    # 12.1.3 Risk Assessment\n\nUsing the std::rand() function could lead to predictable\
    \ random numbers.\n\n| Rule | Severity | Likelihood | Remediation Cost | Priority\
    \ | Level |\n|---|---|---|---|---|-|\n| MSC50-CPP | Medium | Unlikely | Low |\
    \ P6 | L2 |"
