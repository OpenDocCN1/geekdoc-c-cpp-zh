  md: '# 3.13 EXP62-CPP. Do not access the bits of an object representation that are
    not part of the object''s value representation


    The C++ Standard, [basic.types], paragraph 9 [ISO/IEC 4882-2014], states the following:


    The object representation of an object of type T is the sequence of unsigned char
    objects taken by the object of type T, where N equals size(T). The value representation
    of an object is the set of bits that hold the value of type T.


    The narrow characters (char, signed char, and unsigned char)—as well as some other
    integral types on specific platforms—have an object representation that consists
    of the bits from the object''s value representation. For such types, accessing
    any of the bits of the value representation is well-defined behavior. This form
    of object representation allows a programmer to access and modify an object solely
    based on its bit representation, such as by calling std::memcmp() on its object
    representation.


    Other types, such as classes, may not have an object representation solely of
    the bits from the object''s value representation. For instance, classes may have
    bit-field members, padding inserted between members, a viable to support virtual
    method dispatch, or data members declared with different access privileges. For
    such types, accessing any of the object representation that are not part of the
    object''s value representation may result in undefined behavior depending on how
    those bits are accessed.


    Do not access the bits of an object representation that are not part of the object''s
    value representation. Even if the bits are accessed in a well-defined manner,
    such as through an array of unsigned char objects, the values represented by those
    bits are unspecified or implementation-defined, and reliance on any particular
    value can lead to abnormal program execution.'
