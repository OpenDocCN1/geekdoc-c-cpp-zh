  md: '# 3.7 EXP56-CPP. Do not call a function with a mismatched language linkage


    C++ allows a degree of interoperability with other languages through the use of
    language linkage specifications. These specifications affect the way in which
    functions are called or data is accessed. By default, all functions, as well as
    function and variable names, with external linkage have C++ linkage, though a
    different linkage may be specified. Implementations are required to support "C"
    and "C++" as language linkage, but other languages exist with implementation-defined
    semantics, such as "java", "Ada", and "FORTRAN".


    Language linkage is specified to be part of the function type, according to the
    C++ Standard, [del.linkage], paragraph 1 [ISO/IEC 14882-2014], which, in part,
    states the following:


    > Two functions with different language linkages are distinct types if they are
    otherwise identical.


    When calling a function, it is undefined behavior if the language linkage of the
    function type used in the call does not match the language linkage of the function
    definition. For instance, a mismatch in language linkage specification may corrupt
    the stack due to calling conventions or other ABI mismatches.


    Do not call a function through those whose language linkage does not match the
    linkage of the function''s definition. This restriction applies to functions called
    within a C++ program as well as function pointers used to make a call from outside
    of the C++ program.


    However, many compilers fail to integrate linkage into the C++ type, despite the
    normative requirement to do so in the C++ Standard. For instance, GCC 6.1.0, Clang
    3.9, and Microsoft Visual Studio 2015 all consider the following code snippet
    to be ill-formed due to a redefinition of f() rather than a well-formed overload
    of f().


    ```

    typedef void (*cpp_func)(void);

    extern "C" typedef void (*c_func)(void);


    void f(cpp_func fp) {

    void f(c_func fp) {

    }

    ```


    Some compilers conform to the C++ Standard, but only in strict conformance mode,
    such as SDG 4.11. This divergence from the C++ Standard is a matter of practical
    trade-offs. Compilers are required to support "C" and "C++" language linkages,
    and interoperability between these two languages does not require significant
    code generation differences between the mangling of function types for most common
    architectures such as x86, x86-64, and ARM. These are standard Template Library
    implementations for which language specifies being correctly implemented as part
    of the function type'
