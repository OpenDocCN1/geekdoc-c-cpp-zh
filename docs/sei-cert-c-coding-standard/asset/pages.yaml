  md: "# 8.2 FO51-CPP. Close files when they are no longer needed\n\nA call to the\
    \ std::basic_filebuf<T>::open() function must be matched with a call to std::basic_filebuf<T>::close()\
    \ for the lifetime of the last pointer that stores the return value of the call\
    \ has ended or before program termination, which ever occurs first.\n\nNote that\
    \ std::basic_istream<T>, std::basic_ofstream<T>, and std::basic_fstream<T> all\
    \ maintain an internal reference to a std::basic_filebuf<T> object which open()\
    \ and close() are called as needed. Properly managing one of these types (by not\
    \ the leaking) is sufficient to ensure compliance with this rule. Often the best\
    \ solution is to use the stream by value semantics instead of dynamic memory allocation,\
    \ ensuring compliance with MEM51-CPP. Properly dynamically allocated resources.\
    \ However, that is insufficient for situations where destructors are not automatically\
    \ called.\n\n# 8.2.1 Noncompliant Code Example\n\nIn this noncompliant code, a\
    \ std::fstream object is constructed. The constructor for std::fstream calls std::basic_filebuf<T>::open(),\
    \ and the default std::terminate_handler handler called by std::terminate() is\
    \ std::abort(), which does not call destructors. Consequently, the underlying\
    \ std::basic_filebuf<T> object maintained by the owner is not properly closed.\n\
    \n```\n#include <exception>\n#include <fstream>\n#include <string>\n\nvoid f(const\
    \ std::string &fileName) {\n  std::fstream file(fileName);\n  if (!file.is_open())\
    \ {\n    // Handle error\n    return;\n  }\n  // ...\n  std::terminate();\n}\n\
    ```\n\nThis noncompliant call and the subsequent compliant solutions are assumed\
    \ to eventually call std::terminate() in accordance with the ERR50-CPP-EX1 exception\
    \ described in ERR50-CPP. Do not abruptly terminate the program. Indicating the\
    \ nature of the problem to the operator is elided for brevity."
