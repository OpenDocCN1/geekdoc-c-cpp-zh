  md: '# 9 Exceptions and Error Handling (ERR)


    # 9.1 ERR50-CPP. Do not abruptly terminate the program


    The std::abort(), std::quick_exit(), and std::_Exit() functions are used to terminate
    the program in an immediate fashion. If so without calling exit handlers registered
    with std::atexit() and without executing destructors for objects with automatic,
    thread or storage duration. How a system manages streams when a program ends is
    implementation-defined [ISO/IEC 9899:1999]. Open streams with unwritten buffer
    data may or not be flushed, open streams may not be closed, and temporary files
    may or not be removed. Because these functions can leave external resources, such
    as networks and communications, in an indeterminate state, they should be called
    explicitly in direct response to a critical error. (See ERR50-CPP-ERR for more
    information).


    The std::terminate() function calls the current terminate_handler function, which
    defaults to calling std::abort().


    The C++ Standard defines several ways in which std::terminate() may be called
    implicitly by an implementation [ISO/IEC 14882-2014]:


    +   1. When the exception handling mechanism, after completing the initialization
    of the exception object but before activation of a handler for the exception,
    calls a handler that exists via an exception ([except.throw], paragraph 7)

    See ERR60-CPP. Exception objects must be copy constructible for more information.


    +   2. When a throw-expression with no attempts to recover an exception and no
    exception is being handled ([except.throw], paragraph 9)


    +   3. When the exception handling mechanism cannot find a handler for a thrown
    exception ([except.handler], paragraph 9)

    See ERR51-CPP. Handle all exceptions for more information.


    +   4. When the search for a handler encounters the outermost block of a function
    with noexcept-specification that does not allow the exception ([except.spec],
    paragraph 9)

    See ERR55-CPP. Honor exception specifications for more information.


    +   5. When the destruction of an object during stack unwinding terminates by
    throwing an exception ([except.ctor], paragraph 3)

    See DCL57-CPP. Do not let exceptions escape from destructors or deallocation functions
    for more information.'
