  md: '# 10.7 OOP55-CPP. Honor replacement handler requirements


    The handler functions new_handler, terminate_handler, and unexpected_handler can
    be globally replaced by custom implementations, as specified by [handler], paragraph
    2, of the C++ Standard [ISO/IEC 14882-2014]. For instance, an application could
    use a custom terminate handler by calling::set_terminate(), and the custom terminate
    handler may log the termination for later auditing. However, the C++ Standard,
    [res.functions], paragraph 1, states the following:


    > In certain cases (replacement handler, handler functions, on operations used
    to instantiate standard library template components), the C++ standard library
    depends on components supplied by a C++ program. If these components do not meet
    their requirements, the Standard places no requirements on the implementation.


    Paragraph 2, in part, further states the following:


    In particular, the effects are undefined in the following cases:


    +   - for handler functions, if the installed handler function does not implement
    the semantics of the applicable Required behavior:paragraph


    A replacement for any of the handler functions must meet the semantic requirements
    specified by the appropriate Required behavior: clause of the replaced function.


    # 10.7.1.1 New Handler


    The requirements for a replacement new_handler are specified by [new.handler],
    paragraph 2:


    Required behavior: A new_handler shall perform one of the following:


    +   - make store storage for allocation and return;

    - throw an exception of type bad_alloc or a class derived from bad_alloc;

    - terminate execution of the program without returning to the caller;


    # 10.7.1.2 Terminate Handler


    The requirements for a replacement terminate_handler are specified by [terminate.handler],
    paragraph 2:


    > Required behavior: A terminate_handler shall terminate execution of the program
    without returning to the caller.'
