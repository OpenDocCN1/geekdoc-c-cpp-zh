  md: '# 2.11.9 Risk Assessment


    Violating the ODR causes undefined behavior, which can result in exploits as well
    as denial-of-service attacks. As shown in "Support for Whole-Program Analysis
    and the Verification of the One-Definition Rule in C++" [Quinlan 2006], failing
    to enforce the ODR enables a virtual function pointer attack known as the VPTR
    exploit. In this exploit, an object''s virtual function table is corrupted so
    that calling a virtual function on the object results malicious code being executed.
    See the paper by Quinlan and colleagues for more details. However, note that to
    introduce the malicious class, the attacker must have access to the system building
    the code.


