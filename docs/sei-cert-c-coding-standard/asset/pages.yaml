  md: '# 1.4.4 Risk Assessment


    Each guideline in the CERT C++ Coding Standard contains a risk assessment section
    that attempts to provide software developers with an indication of the potential
    consequences of not addressing a particular rule or recommendation in their code
    (along with indication of expected remediation costs). This information may be
    used to prioritize the repair of violations by a development team. The metric
    is designed for remediation projects. It is generally assumed that new code will
    be developed to be compliant with the entire coding standard and applicable recommendations.


    Each rule and recommendation has an assigned priority. Priorities are assigned
    using a metric based on Fame, Effects, and Critical Analysis (FMEA) [IEC 60812
    2006]. Three values are assigned for each rule on a scale of 1 to 3 for severity,
    and remediation cost.


    Severity—How severe are the consequences of the rule being ignored?


    | Value | Meaning | Examples of Vulnerability |

    | 1 | Low | Denial-of-service attack, abnormal termination |

    | 2 | Medium | Data integrity violation, unintentional information disclosure
    |

    | 3 | High | Run arbitrary code |


    Likelihood—How likely is it that a flaw introduced by ignoring the rule can lead
    to an exploitable vulnerability?


    | Value | Meaning |

    | 1 | Unlikely |

    | 2 | Probable |

    | 3 | Likely |


    Remediation Cost—How expensive is it to comply with the rule?


    | Value | Detection | Correction |

    | 1 | High | Manual | Manual |

    | 2 | Medium | Automatic | Manual |

    | 3 | Low | Automatic | Automatic |


    The three values are multiplied together for each rule. This produces a measure
    that can be used in prioritizing the application of the rules. The products range
    from 1 to 27, although only the 10 distinct values are possible: 1, 2, 3, 4, 5,
    6, 8, 9, 12, and 18. Rules and rules and recommendations with a priority in the
    range of 1 to 4 are Level 3 rules, 6 to 9 are Level 2, and 12 to 27 are Level
    1. The following are possible interpretations of the priorities and levels.'
  merge: -1
  pgno: 11
