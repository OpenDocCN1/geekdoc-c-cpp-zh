  md: '# 7.7 MEM56-CPP. Do not store an already-owned pointer value in an unrelated
    smart pointer


    Smart pointers such as std::unique_ptr and std::shared_ptr encode pointer ownership
    semantics as part of the type system. They wrap a pointer value, provide pointer-like
    semantics through operator(*) and operator->() member functions, and control the
    lifetime of the pointer they manage. When a smart pointer is constructed from
    a pointer value, that value is said to be owned by the smart pointer.


    Calling std::unique_ptr::release() will relinquish ownership of the managed pointer
    value. Destruction, of move assignment, or calling std::unique_ptr::reset() on
    a std::unique_ptr object will also relinquish ownership of the managed pointer
    value, but results in destruction of the managed pointer value. If a call to std::shared_ptr::unique()
    returns true, then destruction of or calling std::shared_ptr::reset() on that
    std::shared_ptr object will relinquish ownership of the managed pointer value
    but


    Some smart pointers, such as std::shared_ptr, allow multiple smart pointer objects
    to manage the same underlying pointer value. In such cases, the initial smart
    pointer object owns the pointer value, and subsequent smart pointer objects are
    related to the original smart pointer. Two smart pointers are used in the initialization
    of the subsequent smart pointer objects. For instance, copying a std::shared_ptr
    object to another std::shared_ptr via copy assignment creates a relationship between
    the two smart pointers, creating a std::shared_ptr object from the managed pointer
    value of another std::shared_ptr object does not.


    Do not create an unrelated smart pointer object with a pointer value that is owned
    by another smart pointer object. This includes resetting a smart pointer''s managed
    pointer to an already-owned pointer value, such by calling reset().'
