  md: "# 11.4 CON53CPP. Avoid deadlock by locking in a predefined order\n\nMutexes\
    \ are used to prevent multiple threads from causing a data race by accessing the\
    \ same shared resource at the same time. Sometimes, when mutexes, mutexes hold\
    \ each other's lock, and the program consequently deadlocks. Four conditions are\
    \ required for deadlock to occur:\n\n+   - mutual exclusion (At least one nonshareable\
    \ resource must be held.)\n\n+   - hold and wait (A thread must hold a resource\
    \ while awaiting availability of another resource.)\n\n+   - preemption (Resources\
    \ cannot be taken away from a thread while they are in-use.),\n\n+   - circular\
    \ wait (A thread must await a resource held by another thread which is, in turn,\
    \ awaiting a resource held by the first thread.)\n\nDeadlock needs all four conditions,\
    \ preventing deadlock requires preventing any one of the four conditions. One\
    \ simple solution is to lock the mutexes in a predefined order, which prevents\
    \ circular wait.\n\n# 11.4.1 Noncompliant Code Example\n\nThe behavior of this\
    \ noncompliant code example depends on the runtime environment and the platform's\
    \ scheduler. The program is susceptible to deadlock if thr1 attempts to lock ba2's\
    \ mutex at the same time thr2 attempts to lock ba1's mutex in the deposit () function.\n\
    \n```\n#include <mutex>\n#include <thread>\n\nclass BankAccount {\n    int balance;\n\
    public:\n    std::mutex balanceMutex;\n    BankAccount() = delete;\n    explicit\
    \ BankAccount(int initialAmount) :\n```"
