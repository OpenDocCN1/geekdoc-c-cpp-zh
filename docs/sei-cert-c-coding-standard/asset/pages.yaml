  md: "# 11.3.3 Compliant Solution (C++11)\n\nIn this compliant solution, two threads\
    \ simultaneously modify two distinct non-bit-field members of a structure. Because\
    \ the members occupy different bytes in memory, no concurrency protection is required.\n\
    \n```\nstruct MultiThreadedFlags {\n    unsigned char flag1;\n    unsigned char\
    \ flag2;\n}\n\nMultiThreadedFlags flags;\n\nvoid thread1() {\n    flags.flag1\
    \ = 1;\n}\n\nvoid thread2() {\n    flags.flag2 = 2;\n}\n```\n\nUnlike earlier\
    \ versions of the standard, C++11 and later explicitly define a memory location\
    \ and provide the following note in [intro.memory] paragraph 4 [ISO/IEC 14882-2014]:\n\
    \n> [Note: Thus a bit-field and an adjacent non-bit-field are in separate memory\
    \ locations, and therefore can be concurrently updated by threads of execution\
    \ without interference. The same applies to two bit-fields, if one is declared\
    \ inside a nested struct and the other is not, or if they are separated by a zero-length\
    \ bit-field declaration, or if they are separated by a non-bit-field declaration.\
    \ It is not safe to concurrently update two bit-fields in the same struct if all\
    \ fields between them are also non-zero width. — end note]\n\nIt is almost certain\
    \ that flag1 and flag2 are stored in the same memory. Using a compiler that conforms\
    \ to earlier versions of the standard, if thread-scheduling interleaving occurs\
    \ between the stores occurring one after another, it is possible that only one\
    \ of the flags will be set as intended, and the other flag will contain its previous\
    \ value because members are represented by the same word, which is the smallest\
    \ unit the processor can work on. Before the changes made to the C++ Standard\
    \ for C++11, there were no guarantees that these flags could be modified concurrently."
