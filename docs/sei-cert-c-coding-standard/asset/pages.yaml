  md: '# 7.4 MEM53-CPP. Explicitly construct and destruct objects when manually managing
    object lifetime


    The creation of dynamically allocated objects in C++ happens in two stages. The
    first stage is responsible for allocating sufficient memory to store the object,
    and the second stage is responsible for initializing the newly allocated chunk
    of memory, depending on the type of the object created.


    Similarly, the destruction of dynamically allocated objects in C++ happens in
    two stages. The first stage is responsible for finalizing the object, depending
    on the type, and the second stage is responsible for deallocating the memory used
    by the object. The C++ Standard, [basic.life], [ISO/IEC 14882-2014], states the
    following:


    > The lifetime of an object is a property of the object. An object is said to
    have non-trivial initialization if it is of a class or aggregate type and one
    of its members is initialized by a constructor other than a trivial default constructor.
    [Note: initialization by a copy/move constructor is non-trivial initialization.
    — end note] The lifetime of object type T begins when:


    +   * storage with the proper alignment and size for type T is obtained,

    * if the object has non-trivial initialization, its initialization is complete.


    > The lifetime of object T ends when:

    * if T is a class with a non-trivial destructor, the destructor call starts, or

    * the storage the object occupies is reused or released.


    For a dynamically allocated object, these two stages are typically handled by
    using the new and delete operators. The expression new for a type T results in
    a call to operator new to allocate sufficient memory for T. If memory is successfully
    allocated, the default constructor for T is called. The result of the expression
    is a pointer P to the object of T. When pointer is passed in the expression delete
    P, it is called in a call to the destructor for T. After the delete completes,
    a call is made to operator delete() to deallocate the memory.


    When a program creates dynamically allocated object other than the new operator,
    it is said to be manually managing the lifetime of that object. This situation
    arises when other allocation schemes to obtain storage for the dynamically allocated
    object, such as using an allocator object or malloc(). For example, a container
    class may allocate a slab of memory in a reserve () function in which subsequent
    objects are stored. MEM51-CPP. Properly deallocate dynamically allocated resources
    for further information on dynamic memory management.


    When managing the lifetime of an object, the constructor must be called to initialize
    the lifetime of the object. Similarly, the destructor must be called to terminate
    the lifetime of the object. Use of an object outside of its lifetime is undefined
    behavior. An object can be constructed either by calling the constructor explicitly
    using the placement new operator or by calling the'
