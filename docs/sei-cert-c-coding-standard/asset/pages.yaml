  md: "# 10.1.3 Exceptions\n\n**OOP50-CPP-EX1:** Because valid cases exist that involve\
    \ calling (non-pure) virtual functions from the constructor of a class, it is\
    \ permissible to call the virtual function with an explicitly qualified ID. The\
    \ qualified ID identifies code maintainers that the expected behavior of the class\
    \ under construction or destruction to be the final overrider for the function\
    \ call.\n\n```\nstruct A {\n    A() {\n        // f(); // WRONG!\n        A::f();\
    \ // Okay\n    }\n    virtual void f();\n};\n```\n\n**OOP50-CPP-EX2:** It is permissible\
    \ to call a virtual function that has the final *virt-specifier* from a constructor\
    \ or destructor, in this example.\n\n```\nstruct A {\n    A();\n    virtual void\
    \ f();\n};\nstruct B : A {\n    B() : A() {\n        f(); // Okay\n    }\n   \
    \ void f() override final;\n};\n```\n\nSimilarly, it is permissible to call a\
    \ virtual function from a constructor or destructor of a class that has the final\
    \ *class-virt-specifier*, as in this example.\n\n```\nstruct A {\n    A();\n \
    \   virtual void f();\n};\nstruct B final : A {\n    B() : A() {\n        f();\
    \ // Okay\n    }\n    void f() override;\n};\n```\n\nIn either case, f() must\
    \ be the final override, guaranteeing consistent behavior of function being called."
