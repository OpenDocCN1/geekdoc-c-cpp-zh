  md: '# 9.7 ERR56-CPP. Guarantee exception safety


    Proper handling of errors and exceptional situations is essential for the continued
    correct operation of software. The preferred mechanism for reporting errors in
    a C++ program is exceptions rather than codes. `dynamic_cast`, `operator new`,
    and `typeid`, report failures by throwing exceptions. In addition, the C++ standard
    library makes use of exceptions to report different kinds of failures. Few C++
    programs manage to avoid using of these facilities. Consequently, the vast majority
    of C++ programs must be prepared for exceptions to handle them appropriately.
    (See ERR51-CPP. Handle all exceptions.)


    Because exceptions introduce code paths into a program, it is important to consider
    the effects of code taking such paths and to avoid any undesirable effects that
    might arise. Some effects include failure to leave an acquired resource, introducing
    a leak, and failure to reestablish a class invariant after a partial update to
    an object or a partial update while maintaining all invariants. Code that avoids
    such undesirable effects is said to be exception safe.


    Based on the preceding effects, the following distinguishes three kinds of exception
    safety guarantees from most to least desired.


    | Guarantee | Description | Example |

    |---|---|---|n| Strong | The exception safety guarantee is a property of an operation
    such that, in addition to satisfying the basic exception safety guarantee, if
    the operation terminates by raising an exception, it has no observable effects
    on program status. | Strong Exception Safety |

    | Basic | The exception safety guarantee is a property of an operation such that,
    if the operation terminates by raising an exception, it preserves program invariants
    and prevents resource leaks. | Basic Exception Safety |

    | None | Code that provides neither the strong nor basic exception safety guarantee
    is not exception. | No Exception Safety |


    Code that guarantees exception safety also guarantees basic exception safety.


    Because all exceptions in an application must be handled, in compliance with ERR50-CPP.
    Do not terminate the program, it is critical that exceptions do not leave the
    program in an indeterminate state where invariants are violated. That is, the
    program must provide basic exception safety for all invariants and may choose
    to provide strong exception safety for some invariants. Whether exception handling
    is used to control the termination of the program or to recover from an exceptional
    situation, a violated invariant leaves the program in a state where graceful continued
    execution is likely to introduce security vulnerabilities. Thus, code that provides
    no exception safety is unsafe and must be considered defective.'
