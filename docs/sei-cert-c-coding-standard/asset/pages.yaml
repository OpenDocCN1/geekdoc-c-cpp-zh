  md: "# 3.12 EXP61-CPP. A lambda object must not outline any of its reference captured\
    \ objects\n\nLambda expressions may capture objects with automatic storage duration\
    \ from the set of enclosing scopes (the reaching scope) for use in the lambda's\
    \ function body. These captures may be explicit, by specifying the capture in\
    \ the lambda's capture-list, or implicit, by using a capture-default and referring\
    \ to the object within the lambda's function body. When capturing an object explicitly\
    \ or implicitly, the capture-default indicates that the object is either captured\
    \ by copy or by reference (&). When an object is captured by copy, the lambda\
    \ object will contain an unnamed static data member that is initialized to the\
    \ value of the object captured. This nonresident data member's lifetime is that\
    \ of the lambda object's lifetime. However, when an object is captured by reference,\
    \ the lifetime of the referent is not tied to the lifetime of the lambda object.\n\
    \nBecause entities captured are objects with automatic storage duration (or this),\
    \ a general guideline is that returning a lambda object (including returning via\
    \ a reference parameter), or storing a lambda object in a member variable or global,\
    \ should not capture an entity by reference because the lambda object outlives\
    \ the captured reference object.\n\nWhen a lambda outlives one of its reference-captured\
    \ objects, execution of the lambda's function call results in undefined behavior\
    \ once that reference-captured object is accessed. Therefore, a lambda object\
    \ must not outlive any of its reference-captured objects. This is a specific instance\
    \ of EXP544-CPP. Do not access an object outside of its lifetime.\n\n# 3.12.1\
    \ Noncompliant Code Example\n\nIn this noncompliant code example, the function\
    \ g() returns a lambda, which implicitly captures the automatic local variable\
    \ i by reference. When that lambda is returned from the call, the reference it\
    \ captured will refer to a whose lifetime has ended. As a result, when the lambda\
    \ is executed in f(), the use of the dangling reference in the lambda results\
    \ in undefined behavior.\n\n```\nauto g() {\n    int i = 12;\n    return [&] {\n\
    \        i = 100;\n        return i;\n    };\n}\n\nvoid f() {\n    int j = g();\n\
    }\n```"
