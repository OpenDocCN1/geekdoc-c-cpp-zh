  md: "Declarations and Initialization (DCL) - DCL54-CPP. Overload allocation and\
    \ deallocation functions as a pair in the same scope\n\n# 2.5.2 Compliant Solution\n\
    \nIn this compliant solution, the corresponding deallocation function is also\
    \ defined at global scope.\n\n```\n#include <Windows.h>\n#include <new>\nclass\
    \ HeapAllocator {\n    static HANDLE h;\n    static bool init;\npublic:\n    static\
    \ void *alloc(std::size_t size) noexcept(false) {\n        if (!init) {\n    \
    \        h = ::HeapCreate(0, 0, 0); // Private, expandable heap.\n           \
