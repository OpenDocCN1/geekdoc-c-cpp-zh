  md: '# 9.11 ERR60-CPP. Exception objects must not throw copy constructible


    When an exception is thrown, the exception object operand of the `throw` expression
    is copied into a temporary object that is used to initialize the handler. The
    C++ Standard, [except.throw], paragraph 3 [ISO/IEC 14882-2014], in part, states
    the following:


    Throwing an exception initializes a temporary object, called the *exception object*.
    The temporary is an lvalue and is used to initialize the variable declared in
    the matching handler.


    If the copy constructor for the exception object throws during the copy initialization,
    `std::terminate()` is called, which can result in undefined behavior. For more
    information on implicitly calling `std::terminate()`, see ERR50-CPP. Do not abruptly
    terminate the program.


    The copy constructor for an object thrown as an exception must be declared `noexcept`,
    including any implicitly-defined copy constructors. Any function declared by throwing
    an exception violates ERR55-CPP. Honor exception specifications.


    The C++ Standard allows the copy constructor to be elided when initializing the
    exception object to perform the initialization if a temporary is thrown. Many
    compiler implementations make use of optimization techniques. However, the copy
    constructor for an exception object still must not throw an exception because
    compilers are not required to elide the copy constructor call in all situations,
    and common implementations of `std::exception_ptr` will call a copy constructor
    even if it can be elided from a `throw` expression.'
