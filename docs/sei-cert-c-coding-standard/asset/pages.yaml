  md: '# security policy [Internet Society 2000]


    A security policy is a set of rules and practices that specify or regulate how
    a system or organization provides services to protect sensitive and critical system
    resources.


    # strong exception safety [Stroustrup 2001, Sutter 2000]


    The strong exception safety is a guarantee of an operation that, in addition to
    satisfying the basic exception safety guarantee, if the operation terminates by
    exception, it has no observable effects on program state. (See exception safety
    and basic exception safety.)


    # SFINAE


    SFINAE (Substitution Failure Is Not An Error) is a language rule applied by the
    compiler during overload resolution templates. In some contexts, when substituting
    a template parameter fails, the specialization is discarded from the overload
    set instead of causing a compile error. This feature is used in template metaprogramming.


    # tainted source [ISO/IEC TS 17961:2012]


    A tainted source is an external source of untrusted data.


    # tainted value [ISO/IEC TS 17961:2012]


    A tainted value is derived from a tainted source that has not been sanitized.


    # trust boundary


    A trust boundary is a boundary between a trusted execution context (or trusted
    data source) in which all sub-execution contexts (or data sources) are trusted
    by the system and a untrusted execution context (or untrusted data sink).


    # undefined behavior [ISO/IEC 14882-2014]


    Undefined behavior is behavior, which might arise upon use of an erroneous program
    construct or data, for which the C++ Standard imposes no requirements. Undefined
    behavior may also be expected when the C++ Standard permits any description of
    definition or behavior to be ill-formed, with no diagnostic required.


    # unspecified behavior [ISO/IEC 14882-2014]


    Unspecified behavior is behavior, for a well-formed program construct and correct
    data, which depends on the implementation. The implementation is not required
    to document which behavior occurs.


    # unspecified value [ISO/IEC 9899:2011]


    An unspecified value is a valid value of the relevant type where the C++ Standard
    imposes no requirements on which value is chosen in any instance.'
  merge: -1
