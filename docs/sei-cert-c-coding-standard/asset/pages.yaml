    - bool operator!=(const char T *, const basic_string &)

    - bool operator!=(const basic_string &, const char T *)

    - bool operator<(const char T *, const basic_string &)

    - bool operator<(const basic_string &, const char T *)

    - bool operator>(const char T *, const basic_string &)

    - bool operator>(const basic_string &, const char T *)

    - bool operator<=(const char T *, const basic_string &)

    - bool operator<=(const basic_string &, const char T *)

    - bool operator>=(const basic_string &, const char T *)


    Do not call any of the preceding functions with a null pointer as the const char
    T * argument.


    This rule is a specific instance of EXP34-C. Do not dereference null pointers.


    # 6.2.1.1 Implementation Details


