  md: '# 1.5 Relation to the CERT C Coding Standard


    The C++ Standard, [intro.scope], paragraph 2 [ISO/IEC 14882-2014] states the following:


    > C++ is a general purpose language based on the C programming language described
    in ISO/IEC 9899:1999 Programming languages—C (hereafter referred to as C Standard);
    In addition to the facilities provided by C, C++ provides additional data types,
    classes, templates, exceptions, namespaces, operator overloading, function name
    overloading, references, free store memory operators, and additional library facilities.


    Because C is based on the C programming language, there is considerable overlap
    between the guidelines specified by the SEI C Coding Standard and those specified
    by this coding standard. To reduce the amount of duplicated information, this
    coding standard focuses on the parts of the C++ programming language that are
