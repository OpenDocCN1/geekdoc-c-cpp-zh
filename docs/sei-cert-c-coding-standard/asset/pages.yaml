  md: '# 3.10 EXP59-CPP. Use offsetof() on valid types and members


    The offsetof() macro is defined by the C Standard as a portable way to determine
    the offset, expressed in bytes, from the start of the object to a given member
    of that object. The C Standard, clause 7.17, paragraph 3 [ISO/IEC 9899:1999],
    in part, specifies the following:


    ```

    offsetof(type, member-designator) expands to an integer constant

    expression that has type size_t, the value of which is the offset in bytes, to

    structure (designated by member-designator), from the beginning of its

    structure (designated by type). The type and member designator shall be such that

    given static type ; then the expression & (t.member-designator) evaluates

    to an address constant. (If the specified member is a bit-field, the behavior
    is undefined).

    ```


    The C Standard, [support.types], paragraph 4 [ISO/IEC 14882-2014], places additional

    restrictions beyond those set by the C Standard:


    The macro offsetof(type, member-designator) accepts a restricted set of

    type arguments in this International Standard. If type is not a standard-layout
    class, the

    results are undefined. The expression offsetof(type, member-designator) is

    never type-dependent and is value-dependent if only if type is dependent. The
    result

    of applying the offsetof macro to a field that is a static data member or

    function member is undefined. No operation invoked by the offsetof macro shall

    throw an exception and noexcept (offsetof(type, member-designator))

    shall be true.


    When specifying the type argument for the offsetof() macro, pass only a standard-layout

    class. The full description of a standard-layout class can be found in paragraph
    7 of the [class]

    clause of the C Standard, or the type can be checked with the

    std::is_standard_layout<> type trait. When specifying the member designator

    argument for the offsetof() macro, do not pass a bit-field, static data member,
    or function

    member. Passing an invalid type or member to the offsetof() macro is undefined
    behavior.'
