  md: '# 3.3 EXP52-CPP. Do not rely on side effects in unvaluated operands


    Some expressions involve operands that are unvaluated. The C++ Standard, [expr],
    paragraph 8 [ISO/IEC 14882-2014] states the following:


    > In contexts, unvaluated operands appear. An unvaluated operand is not evaluated.
    An unvaluated operand is considered a full-expression. [Note: In unvaluated operand,
    a non-static class member may be named (5.1) and naming of objects or functions
    does not, by itself, require a definition that be provided.] — end note


    The following expressions do not evaluate their operands: sizeof(), typeid(),
    noexcept(), decltype(), and declval().


    Because an unvaluated operand in an expression is unvaluated, no side effects
    from that operand are triggered. Reliance on these sides will result in unexpected
    behavior. Do not rely on side effects in unvaluated operands.


    Unvaluated expression operands are used when the definition of an object is required
    but the definition of object is not. In the following example, the function f()
    is overloaded, relying on the unvaluated expression to select the desired overload,
    which is then used to determine the result of the sizeof() expression.


    ```

    int f(int);

    d f(double);

    t_t size = sizeof(f(0));

    ```


    Such a code does not rely on the side effects of f() and consequently conforms
    to this guideline.


