  md: "# 7.6.1 Noncompliant Code Example\n\nIn this noncompliant code example, the\
    \ global operator new (std::size_t) function is replaced by a custom implementation.\
    \ However, the custom implementation fails to honor the behavior required by the\
    \ function it replaces, as per the C++ Standard [new,delete], paragraph 3. Specifically,\
    \ if the allocator allocates for the requested amount of memory, the replacement\
    \ function returns a null pointer instead of throwing an exception of type std::bad_alloc.\
    \ By returning a null pointer instead of throwing, relying on the behavior of\
