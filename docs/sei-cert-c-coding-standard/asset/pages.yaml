    # 1.7 Tool Selection and Validation


    Although rule checking can be performed manually, with increasing program size
    and complexity, it rapidly becomes infeasible. For this reason, the use of static
    analysis tools is recommended.


    When choosing a compiler (which should be understood to include the linker), a
    C++-compliant compiler should be used whenever possible. A conforming implementation
    will produce at least one diagnostic message if a preprocessing unit or translation
    unit contains a violation of any syntax rule or constraint, if the behavior is
    explicitly specified as undefined or implementation-defined. It is also likely
    that any analyzers you use a C++-compliant compiler.


    When choosing a code analysis tool, it is clearly desirable that the tool will
    be able to enforce many of the guidelines as possible. Not all recommendations
    are enforceable; some are strictly meant to be informative.


    Although CERT recommends the use of ISO/IEC TS 17961-conforming analyzer, the
    Software Engineering Institute, as a federally researched and development center
    (FRRDC), is not in a position to endorse any particular vendor or tool. Vendors
    are encouraged to develop conforming analyzers, and users of this code standard
    are free to evaluate and select whichever analyzers best their purposes.


    # 1.7.1 False Positives and False Negatives


    In general, determining conformance to coding rules and recommendations is computationally
    undecidable. The precision of static analysis has practical limitations. For example,
    the halting theorem of computer science states that for every tool that indicates
    a program terminates, there exists a program that the tool will not analyze correctly.
    Consequently, any property dependent on control flow—such as halting—may be indeterminate
    for some programs. A consequence of undecidability is that it may be impossible
    to determine statically whether a given guideline is satisfied in specific circumstances.
    The widespread presence of such code may also lead to unexpected results from
    an analysis tool.


    Regardless of how checking is performed, the analysis may generate the following:


    +   - False Positives: the tool report a flaw when one does not exist. False positives
    may occur because the code is too complex for the tool to perform a complete analysis.
    The use of features such as function pointers and libraries may make false positives
    more likely.'
