  md: '# 2.6 DCL55-CPP. Avoid information leakage when passing a class object across
    a trust boundary


    The C++ Standard, [class.mem], paragraph 13 [ISO/IEC 14882-2014], describes the
    layout of non-static data members of a non-union class, with the same access control
    are allocated or specifying the following:


    +   * Nonstatic data members of a (non-union) class with the same access control
    are allocated so that later members have higher addresses within a class object.
    The order of allocation of non-static data members with different access control
    is unspecified. Implementation alignment requirements might cause two adjacent
    members not to be allocated immediately after each other; so might requirements
    for space for managing virtual functions and virtual base classes.


    Further, [class.bit], paragraph 1, in part, states the following:


    +   * Allocation of bit-fields within a class object is implementation-defined.
    Alignment of bit-fields. Bit-fields are packed into some addressable allocation
    unit.


    Thus, padding bits may be present at any location within a class object instance
    (including the beginning of the object, in the case of an unnamed bit-field as
    the first member declared in a class). Unless initialized by zero-initialization,
    padding bits contain indeterminate values that may contain sensitive information.


    When passing a pointer to a class object instance across a trust boundary to a
    different trusted domain, the programmer must ensure that the padding bits of
    such object do not contain sensitive information.'
