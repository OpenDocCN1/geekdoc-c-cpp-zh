  md: '# ERR52-CPP. Do not use setjmp() or longjmp()


    The standard library facilities setjmp() and longjmp() can be used to simulate
    throwing and catching exceptions. These facilities bypass automatic resource management
    and can result in undefined behavior, commonly including resource leaks and denial-of-service
    attacks.


    The C++ Standard. [support.runtime], paragraph 4 [ISO/IEC 14882-2014], states
    that:


    > The function signature longjmp(jmp_buf jbuf, int val) has more restricted behavior
    in this International Standard. A setjmp/longjmp call pair has undefined behavior
    if replacing the setjmp and longjmp by catch and throw would invoke any non-trivial
    destructors for any automatic objects.


    Do not call setjmp() or longjmp(); their usage can be replaced by more standard
    idioms such as throw and catch statements.


    # 9.3.1 Noncompliant Code Example


    If a throw expression would cause a nontrivial destructor to be invoked, then
    calling longjmp() in the same context will result in undefined behavior. In the
    following noncompliant code example, the call to longjmp() occurs in a context
    with a local Counter object. Since this object''s destructor is nontrivial, undefined
    behavior results.'
