    std::char_traits::length():


    +   - basic_string operator+(const char T *, const basic_string&)

    - basic_string operator+(const char T *, const basic_string &&)

    - basic_string operator+(const basic_string &, const char T *)

    - basic_string operator+(const basic_string &&, const char T *)

