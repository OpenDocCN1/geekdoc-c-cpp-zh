  md: "Expressions (EXP) - EXP54-CPP. Do not access an object outside of its lifetime\n\
    \n# Paragraph 6 describes the lifetime for non-pointers:\n\nSimilarly, before\
    \ the lifetime of an object has started but after the storage which the object\
    \ will have been allocated, or after the lifetime of an object has ended and before\
    \ the storage which the object occupied is reused or released, any glue refers\
    \ to the original object may be used but only in limited ways. For an object under\
    \ construction or destruction, see 12.7. Otherwise, such a glue refers to allocated\
    \ storage, and using the properties of the glue that do not depend on its value\
    \ is well-defined.\n\nThe program has undefined behavior if:\n\n+   - an Value-to-reference\
    \ conversion is applied to such a glue,\n- the glue is used to access a non-static\
    \ data member or a non-static member function of the object, or\n- the glue is\
    \ bound to a reference to a virtual base class, or\n- the glue is used as the\
    \ operand of a dynamic_cast or as the operand of typeid.\n\nDo not use an object\
    \ outside of its lifetime, except in the ways described above as being well-defined.\n\
    \n# 3.5.1 Noncompliant Code Example\n\nIn this noncompliant example, a pointer\
    \ to an object is used to call a non-static member function of the object prior\
    \ to the beginning of the pointer's lifetime, resulting in undefined behavior.\n\
    \n```\nstruct S {\n    void mem_fn();\n};\n\nvoid f() {\n    S *s;\n    s->mem_fn();\n\
    }\n```"
