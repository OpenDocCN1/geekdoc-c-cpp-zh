  md: "# 10.1.2 Compliant Solution\n\nIn this compliant solution, the constructors\
    \ and destructors call a nonvirtual, private member function (suffixed with mine)\
    \ instead of calling a virtual function. The result is that each class is responsible\
    \ for seizing and releasing its own resources.\n\n```\nclass B {\n    void seize_mine();\n\
    \    void release_mine();\n\npublic:\n    B() { seize_mine(); }\n    virtual ~B()\
    \ { release_mine(); }\n\nprotected:\n    virtual void seize() { seize_mine();\
    \ }\n    virtual void release() { release_mine(); }\n};\n\nclass D : public B\
    \ {\n    void seize_mine();\n    void release_mine();\n\npublic:\n    D() { seize_mine();\
    \ }\n    virtual ~D() { release_mine(); }\n\nprotected:\n    void seize() override\
    \ {\n        B::seize();\n        seize_mine();\n    }\n\n    void release() override\
