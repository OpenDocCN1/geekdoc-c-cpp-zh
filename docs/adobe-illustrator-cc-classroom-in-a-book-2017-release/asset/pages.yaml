    # Creating layers and sublayers


    By default, every document begins with one layer, named “Layer 1.” As you create
    artwork, you can rename and add layers and sublayers at any time. Placing objects
    on separate layers lets you more easily select and edit them. For example, by
    placing on a separate layer, you can change the type all at once without affecting
    the rest of the artwork.'
