  md: '# Working with image links


    When you place images in Illustrator and either link to them or embed them, you
    can see a listing of these images in the Links panel. You use the Links panel
    to see and manage all linked or embedded artwork. The Links panel displays a small
    thumbnail of the artwork and uses icons to indicate the artwork''s status. From
    the Links panel, you can view the images that have been linked and embedded, replace
    a placed image, update a linked image that has been edited outside of Illustrator,
    or edit a linked image in the original application, such as Photoshop.


    # Finding link information


    When you place an image, it can be helpful to see where the original image is
    located, what transformations have been applied to the image (such as rotation
    and scale), and more information. Next, you will explore the Links panel to discover
    image information.


    +   1 Choose Window > Workspace > Reset Essentials. Choose Window > Libraries
    to close the Libraries panel so you have more area to work within.

    2 Choose Window > Links to open the Links panel.


    Looking in the Links panel, you will see a listing of all the images you''ve placed.
    Images with a name to the right of the image thumbnail are linked, and those without
    a name are embedded. You can also tell whether an image has been embedded (icon).


    > **Tip**

    You can also double-click the image in the Layers list to see the image information.


    +   3 Scroll in the panel, if necessary, and select the Kayak.jpg image (which
    shows the name to the right of the thumbnail). Click the toggle in the lower-left
    corner of the Layers panel to reveal the link information at the bottom of the
    panel.

    nYou will see information, such as the name, original location of the image, file
    format, resolution, modification and creation dates, transformation information,
    and more.'
  merge: -1
  pgno: 694
- img_proc: true
  md: 'Click the Go To Link option (link) below the list of images.


