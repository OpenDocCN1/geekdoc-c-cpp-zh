- img_proc: true
  md: '6 When the path is complete, select the Direct Selection tool (A), and click
    to select any anchor point in the path.


    When the anchor point is selected, the direction handles appear, and you can readjust
    the curve of the path if necessary. With a curve selected, you can also change
    the stroke and fill of the curve. When you do this, the next line you draw will
    have the same attributes. If you want to drawing the shape again for more practice,
    scroll down to the bottom half of the same (labeled Practice), and trace the shape
    down.


    Note


    For more information about these attributes, see Lesson 7, “Using Color to Enhance
    Signage.”


    7 Choose Select > Deselect, and then choose File > Save.


    # Converting smooth points to corner points


    When creating curves, the direction handles help determine the shape and size
    of the curved segments, as you''ve already seen. Removing the direction lines
    from an anchor point can convert a smooth point into a corner point. In this next
    part of the lesson, you''ll practice converting between smooth points and corner
    points.


    +   Choose 5 from the Artboard Navigation menu in the lower-left corner of the
    Document window.


    +   On top of the storyboard, you can see the path that you will trace. You''ll
    use the top storyboard as a template for the exercise, creating your paths directly
    on top of those. Use the Practice section at the bottom of the storyboard for
    additional practice on your own.


    +   Select the Zoom tool (Q), and click several times in the top part of the artboard
    to zoom in.


    +   In the Control panel, make sure the fill color is None and the stroke color
    is Black. Also, make sure the stroke weight is still 1 pt in the Control panel.


    +   Select the Pen tool (). Pressing the Shift key, click point 1, labeled “start,”
    and drag up in the direction of the arc, stopping at the red dot. Release the
    mouse button, and then release the Shift key.


    +   Pressing the Shift key when dragging constrains the direction to multiples
    of 45°.


    +   Click point 2 (to the right) and begin dragging down to the gold dot. As you
    draw, press and hold the Shift key when the curve looks correct, release the mouse
    button, and then release the Shift key. Leave the path selected.


    Now you need the curve to switch directions and create another arc. You will split
    the direction lines to convert a smooth point to a corner point.'
