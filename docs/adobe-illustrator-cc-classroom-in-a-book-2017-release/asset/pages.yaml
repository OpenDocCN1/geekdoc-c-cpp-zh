    # Applying multiple graphic styles


    You can apply a graphic style to an object that already has a graphic style applied.
    This can be useful if you want to add properties to an object from another graphic
    style. After you apply a graphic style to selected artwork, you can then Option-click
    (Mac OS) or Alt-click (Windows) another graphic style thumbnail to add the graphic
    style formatting to the existing formatting, rather than replacing it.


    # Scaling strokes and effects


    In Illustrator, by default, when scaling (resizing) content, any strokes and effects
    that are applied do not change. For instance, suppose you scale a circle with
    a 2-pt stroke from small to the size of the artboard. The shape may change size,
    but the stroke will remain 2 pt. by default. That can change the appearance of
    scaled artwork in a way that you didn''t intend, so you''ll need to watch out
    for that when transforming artwork. Next, you''ll make the spokes group larger.


