    # Understanding layers


    Layers are invisible folders to help you hold and manage all of the items (of
    which some can be difficult to select or track) that make up your artwork. If
    you shuffle those folders, you change the stacking order of the items in your
    artwork. (You learned about stacking order in Lesson 2, “Techniques for Selecting
    Artwork.\)


    The structure of layers in your document can be as simple or as complex as you
    want. When you create a new Illustrator document, all of the content you create
    is organized in a single layer. However, you can create new layers and sublayers
    (like subfolders) to organize your artwork, as you''ll learn about in this lesson.


    +   Click the Layers panel icon on the right side of the workspace, or choose
    Window > Layers.


    In addition to organizing content, the Layers panel offers an easy way to select,
    hide, lock, and change your artwork’s appearance attributes. In the following
    figure, the Layers panel may not look the same as yours, and that''s okay. You
    can refer to this figure as you progress through the lesson.'
