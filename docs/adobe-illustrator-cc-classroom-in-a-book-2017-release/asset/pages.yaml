  md: '# BUZZ SODA


    Here at Buzz Soda, we create organic soda. What we set apart is something uniquely
    delicious and nourishing; honey. We love our bees, and make a difference using
    honey soda and sustainable harvesting practices. Raised at our hives, we make
    more for our many farmers in the area.


    Using honey in soda is something unique. Since millennia, the Egyptians have used
    honey to create a drink called Mead, but we are the first to use it in a refreshing
    soda. You will enjoy a more appealing flavor than other soda. We use Buzz soda,
    cherry Buzz soda, and grapefruit Buzz soda.


    # Tasting Events


    We travel all the US to bring our soda to local events. We hope you will give
    us a try next time you are looking for a refreshing drink.


    | New York, NY | June 20 |

    | Los Angeles, CA | June 23 |

    | Boston, MA | June 26 |

    | Seattle, WA | June 30 |

    | Chicago, IL | July 3 |


    Buzz Soda is the newest and tastiest evolution in drink. We hope you will try
    it next time looking for a refreshing drink. Buzz Soda is also packed with antioxidants
