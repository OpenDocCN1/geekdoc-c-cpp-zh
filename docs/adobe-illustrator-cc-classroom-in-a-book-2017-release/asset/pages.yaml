  md: '+   • Choose Create New Swatch from the Color panel menu (❐).


    +   3 A tint is a mixture of a color with white to make the color lighter. You
    can create a tint from a global process color, like CMYK, or from a spot color.


    +   4 You can choose color harmonies from the Color Guide panel. Color harmonies
    are used to generate a color scheme based on a single color.


    +   5 You use the Recolor Artwork dialog box to change the colors used in selected
