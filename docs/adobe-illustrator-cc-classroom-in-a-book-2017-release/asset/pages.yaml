  md: '# Adjusting the user-interface brightness


    Similar to Adobe InDesign or Adobe Photoshop, Illustrator supports a brightness
    adjustment for the application user interface. This is a program preference setting
    that allows you to choose a brightness setting from four preset levels.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_84_0.png)


    To edit the user-interface brightness, you can choose Illustrator CC > Preferences
    > User Interface (Mac OS) or Edit > Preferences > User Interface (Windows).


    # Changing the view of artwork


    When working in files, it''s likely that you''ll need to change the magnification
    level and navigate around artboards. The magnification level, which can range
    from 3.13% to 64000% (yes, 64 thousand percent), is displayed in the title bar
    (or document tab) next to the filename and in the lower-left corner of the Document
    window.


    There are a lot of ways to change the zoom level in Illustrator, and in this section
    you''ll explore several of the most widely used methods.'
  merge: -1
