  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_492_0.png)


    # Working with blended objects


    You can blend two distinct objects to create and distribute shapes evenly between
    two objects. The two shapes you blend can be the same or different. You can also
    blend between two open paths to create a smooth transition between objects, or
    you can combine blends of colors and objects to create color transitions in the
    shape of a particular object. The following are examples of different types of
    blended objects you can create:


    +   - Blend between two of the same shape.

    - Blend between two of the same, each with a different color fill.

    - Blend between two different shapes with different fill colors.

    - Blend between two of the same shape along a path.

    - Smooth color blend between two stroked lines (original lines on left, blend
    on right).


    When you create a blend, the blended objects are treated as one object, called
    a blend object. If you move one of the original objects or edit the anchor points
    of the original object, the blend changes accordingly. You can also expand the
    blend to divide it into distinct objects.'
  merge: -1
  pgno: 492
