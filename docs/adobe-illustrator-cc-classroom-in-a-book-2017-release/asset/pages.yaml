    # Using live effects


    Effects alter the appearance of an object without changing the underlying artwork.
    Applying an effect adds the effect to the object''s appearance attribute, which
    you can edit, move, delete, or duplicate, at any time, in the Appearance panel.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_575_0.png)


    > Note

    When you apply a raster effect, the original vector data is rasterized using the
    document''s raster effects settings, which determine the resolution of the resulting
    image. To learn about document raster effects settings, search for “Document raster
    effects settings” in Illustrator Help.


    There are two types of effects in Illustrator: vector effects and raster effects.
    In Illustrator, click the Effect menu item to see the different types of effects
    available.'
