  md: '# Masking images


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_680_0.png)


    +   **Note**

    You will hear people use the phrases "clipping mask," "clipping path," and "mask.\nThe
    most way of us to refer to them, they mean the same thing.


    To achieve certain design effects, you can apply a clipping mask (clipping path),
    or an object whose shape masks other artwork so that areas that lie within the
    shape are visible. In the first part of the figure to the right is an image with
    a white circle on top. In the second part of the figure, the white circle was
    used to mask the image.

    Only vector objects can be clipping paths; however, any artwork can be masked.
    You can also import masks created in Photoshop files. The clipping path and the
    masked object are referred to as the clipping set.


    # Applying a simple mask to an image


    In this short section, you''ll see how to let Illustrator create a simple mask
    for you on the Kayak.jpg image so that you can hide part of the image.


    +   **Tip**

    You can also apply a clipping mask by choosing Object > Clipping Mask > Make.


    +   1 With the Selection tool (�) selected, click the Kayak.jpg image to select
    it (the first image you placed). Click the Mask button in the Control panel.'
  merge: -1
  pgno: 680
- img_proc: true
  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_681_0.png)


