    is stored within the Illustrator document. You can choose to embed an image later,
    after placing and linking to it, if you choose. Also, you might want to use embedded
    images outside of Illustrator or to edit them in an image-editing application
    like Photoshop. Illustrator allows you to unembed images, which saves the embedded
    artwork to your file system as a PSD or TIFF file (which you choose) and automatically
    links it to the Illustrator file. Next, you will embed an image in the document.


