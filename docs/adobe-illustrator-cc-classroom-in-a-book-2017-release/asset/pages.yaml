    The options for the selected artwork appear in the Control panel, including the
    word “Group,” color options, Stroke, and more. You can also move the Control panel
    into the workspace to suit your working style.


    +   With any tool, drag the gripper bar (the dashed line along the left edge)
    of the Control panel into the workspace.


