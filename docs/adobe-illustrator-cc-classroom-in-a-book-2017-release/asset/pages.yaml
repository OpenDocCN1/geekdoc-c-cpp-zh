  md: '# Review questions


    1 Name two methods for creating text in Adobe Illustrator.


    2 What does the Touch Type tool (T) let you do?


    3 What is overflow text?


    4 What is text heading?


    5 What is the difference between a character style and a paragraph style?


    6 What is the advantage of converting text to outlines?


    # Review answers


    1 The following methods can be used for creating text:


    +   - With the Type tool (T), click the artboard and start typing when the cursor
    appears. A point type object is created to accommodate the text.


    +   - With the Type tool, drag to create a text area. When a cursor appears.


    +   - With the Type tool, click a path or closed shape to convert it to text on
    a path, or click in a text area. Option-clicking (Mac OS) or Alt-clicking (Windows)
    when crossing over the stroke of a path creates text around the shape.


    2 The Touch Type tool (T) allows you to visually edit character formatting options
    for individual characters in text. You can edit the character rotation, kerning,
    baseline shift, and horizontal and vertical scale of text and the text remains
    editable.


    3 Overflow text that does not fit within an area object or path. A red plus sign
    (+) in an out port indicates that the object contains additional text.


    4 Text threading allows you to flow text from one object to another by linking
    type objects. Linked type objects can be of any shape; however, the text must
    be entered in an area or along a path (not at a point).


    5 A character style can be applied to selected text. A paragraph style is applied
    to an entire paragraph. Paragraph styles are best for indents, margins, and line
    spacing.


    6 Converting text to outlines eliminates the need to send the fonts along with
    the Illustrator file when sharing with others and makes it possible to add effects
    to type that aren''t possible when the type is still editable (live).'
  merge: -1
