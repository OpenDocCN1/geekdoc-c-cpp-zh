- img_proc: true
  md: 'Asset Export panel per PNG, JPEG, SVG, and PDF.


    +   In order to export assets using the Asset Export panel, the artwork to be
    exported needs to be collected in the Asset Export panel. Once in the panel, you
    can select the asset(s) to be exported, select the export settings, and then export.


    +   If you are building a website or want to hand off content to a developer,
    you can transform the visual designs you create in Illustrator to CSS styles using
    the CSS Properties panel (Window > CSS Properties) or File > Export > Export As
    command. Cascading Style Sheets is a specification of formatting rules, much like
    paragraph and character styles in Illustrator, CSS can control not only the look
    and feel of text but also the formatting and positioning of page elements found
    in HTML.


    +   Named content is content whose layer name in the Layers panel has been changed.
    When content is unnamed in the Layers panel (the default layer name is used),
    a CSS style is not created for the content by default. If you name the object
    in the Layers panel, the CSS style is generated, and the name of the style created
    matches the object name in the Layers panel. To generate CSS styles for unnamed
    content, you need to enable this in the CSS Export Options dialog box by clicking
    the Export Options button (回) in the CSS Properties panel.'
