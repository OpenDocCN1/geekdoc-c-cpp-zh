  md: '# In port -> Some Street -> Out port


    An empty out port indicates that all the text is visible and that the object isn''t
    linked. In a out port indicates that the type object is linked to another object
    type. A red plus sign (+) in an out port indicates that the object contains additional
    text, which is called overflow text. To show all of the overflow text, you can
    thread the text to another object, resize the text object, or adjust the text.
    To thread, or continue, text from one object to the next, you have to link the
    objects. Linked type objects can be of any shape; however, the text must be entered
    in an object or along a path, not as point type (by simply clicking to create
    text).

    Next, you will thread text between a few text areas.


    +   - Note

    If you double-click an out port, a new type object appears. If this happens, you
    can either drag the new object where you would like it to be positioned or choose
    Edit > Undo Link Threaded Text, and the loaded text reappears.


