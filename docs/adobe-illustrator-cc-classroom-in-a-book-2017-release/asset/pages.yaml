  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_738_0.png)


    # # Exporting CSS


    You can also export part or all of the CSS code for your page design. Exporting
    CSS code has the distinct advantages of creating a CSS file (.css) and exporting
    PNG files for content that is considered unsupported. In this section, you will
    see both methods.


    +   1. With the group still selected, click the Export Selected CSS button 📷 at
    the bottom of the CSS Properties panel.

    2. In the Export CSS dialog box, make sure that the filename is AssetExport. Navigate
    to the Lessons > Lesson15 > CSS_Export folder, and click Save to save a CSS file
    named AssetExport.css and a PNG image file.'
  merge: -1
  pgno: 738
- img_proc: true
  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_739_0.png)


    # ### Tip


    You can choose a resolution for rasterized artwork in the CSS Export Options box.
    By default, it uses the Document Raster Effects resolution (Effect > Document
    Raster Effects Settings).


    +   3 In the CSS Export Options dialog box, leave all settings at default, and
    click OK.

    4 Go to the Lessons > Lesson15 > CSS_Export folder on your hard drive. In that
    folder, you should now see the AssetExport.css file and an named image.png.

    as stated earlier, the CSS that was generated assumes that you are applying the
    CSS styling to an object in your HTML editor and the image will become a background
    image for the object. With the image generated, you can use it for other parts
    of your web page as well. Next, you will export all the CSS from the design, after
    setting a few CSS options.

    5 Back in Illustrator, choose File > Export > Export As. In the Export dialog
    box, set the Format option to CSS (css) (Mac OS) or the Save As type to CSS (*.CSS)
    (Windows). Change the filename to AssetExport_all, and make sure that you navigate
    to the Lessons > Lesson15 > CSS_Export folder. Click Export.'
