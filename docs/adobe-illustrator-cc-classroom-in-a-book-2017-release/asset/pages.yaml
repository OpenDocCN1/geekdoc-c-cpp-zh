    # An intro to drawing with the Pen tool


    The Pen tool is one of the main drawing tools in Illustrator that''s used to create
    both freedom and precise artwork and also plays a role in editing vector artwork.
    It''s important to have an understanding of a tool like the Pen tool when working
    with Illustrator. Just know that it takes plenty of practice to feel comfortable
    with the Pen tool!


    > Tip


    Adobe has created a simple sample for learning the Pen tool. Check it out here:
    https://helpx.adobe.com/illustrator/how-to/pen-tool-game.html.


    In this section, you''ll begin to explore the Pen tool, and later in the lesson,
    you''ll create artwork using the Pen tool and other tools and commands.


    +   1 Choose from the Artboard Navigation menu in the lower-left corner of the
    Document window.


    +   2 Choose View > Fit Artboard In Window.


    +   3 Select the Zoom tool in the Tools panel, and click twice in the bottom half
    of the artboard to zoom in.


    +   4 Choose View > Smart Guides to turn off the Smart Guides. Smart Guides can
    be useful when you draw, but you won''t need them now.


    +   5 In the Control panel, click Fill color, and choose None. Then, click the
    stroke color and make sure that the Black swatch is selected. Make sure Stroke
    Weight is 1 pt in the Control panel.


    When you begin drawing with the Pen tool, it''s usually to have no fill on the
    path you create because the fill can cover the parts of the path you are trying
    to create. You can add a fill later, if necessary.'
