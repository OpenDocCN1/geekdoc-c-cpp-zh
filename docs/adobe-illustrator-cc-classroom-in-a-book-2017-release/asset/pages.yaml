  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_727_0.png)


    # Note


    If you see a style named “navbar_1_” it’s usually because there is an extra space
    after the name “navbar” in the Layers panel.


    # Tip


    You can tell a style is a class in CSS because the name has a period (.) before
    it.


    When content is unnamed in the Layers panel (it has the default naming), a CSS
    style is not created for it, by default. If you name the object in the Layers
    panel, the CSS is generated, and the name of the style created matches the object
    name in the Layers panel. Illustrator creates styles called classes for most content.


    For objects in the design (not including text objects, as you will see), the name
    you give in the Layers panel should match the class name in the HTML that is created
    in a separate HTML editor, like Dreamweaver. But, you can also forgo naming the
    objects in the Layers panel and simply create generic styles that you can then
    export or paste into an HTML editor and name them. You will see how to do that.


    With the Selection tool, click to select the brown circle behind the cup you worked
    earlier. In the CSS Properties panel, a style will not appear since the object
    is unnamed in the Layers panel (it just has the generic <Path> name).'
