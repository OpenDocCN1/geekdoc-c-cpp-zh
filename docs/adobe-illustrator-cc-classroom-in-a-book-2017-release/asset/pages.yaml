  md: '# Working with rulers and guides


    To this lesson transforming, you''ll learn about aligning and measuring content
    using rulers and guides. Rulers help you accurately place and measure objects.
    They appear at the top and left in the Document window and can be shown and hidden.
    There are two types of rulers in Illustrator: *artboard rulers* and *global rulers*.
    Artboard rulers, which are the default rulers, set the ruler origin at the upper-left
    corner of the *active artboard*. Global rulers set the ruler origin at the upper-left
    corner of the *first artboard*, or the artboard that is at the top of the list
    in the Artboards panel, no matter which artboard is active. *Guides* are nonprinting
    lines created from the rulers that help you align objects.


    +   * Note


    You could switch between artboard and global rulers by choosing View > Rulers
    > and selecting Change To Global Rulers or Change To Artboard Rulers, (depending
    on which option is chosen), but don''t do that now.


    # Creating guides


    Next, you''ll create a few guides so that later you can more accurately align
    content on the book dust cover.


    +   1 Choose View > Rulers > Show Rulers, if you don''t see the rulers along the
    top edge and left edge of the Document window.

    2 Choose View > Fit All In Window.

    3 With the Selection tool selected, click each of the artboards, and as you do,
    look at the horizontal and vertical rulers (along the top and left sides of the
    Document window).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_222_0.png)


    Notice that 0 (zero) for each ruler is always in the upper-left corner of the
    active (selected) artboard (the last artboard you clicked in). The point on each
    ruler (horizontal'
