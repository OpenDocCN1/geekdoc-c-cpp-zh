  md: '# What’s New in Adobe Illustrator CC (2017 release)


    Adobe Illustrator CC (2017 release) is packed with new and innovative features
    to help you produce artwork more efficiently for print, web, and digital video
    publication. The features and exercises in this book are based on Illustrator
    CC (2017 release). In this section, you''ll learn about many of these new features—how
    they function and how you can use them in your work.


    # New, Modern UI


    Illustrator CC (2017 release) has a flat UI (user interface) and new icons for
    tools and panels that offer a cleaner look and help you focus on your artwork.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_20_0.png)


    # Adobe Stock In-App Purchase


    When you search for an image on Adobe Stock via the Libraries panel and place
    it in your document, the Links panel displays a shopping cart icon next to unlicensed
    Adobe stock images placed in your layout. Clicking the cart icon initiates the
    purchasing process.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Text Improvements


    There are a lot of text improvements in Illustrator CC (2017 release). The following
    is a list of those improvements and new features:


    +   - You can now select a text object and preview fonts in real time as you scroll
    through the list of fonts in the font drop-down menu.

    - You can now mark certain fonts as favorites, and can also filter favorite fonts.

    - You can now see recent fonts at the top of the font list.

    - Text can be placed in text containers.

    - You can now find fonts that are similar to a given font (stars), and filter
    fonts based on classification (serif/sans serif/handwritten, etc.).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_21_0.png)


    +   - You may now change the glyphs for a character without having to go to the
    Glyphs panel. A context menu shows glyph options for a selected character.

    - Point and Area Type tools will create a text object filled with placeholder
    text by default. You can also right-click and fill a text box with placeholder
    text whenever you want to


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_21_1.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '(you can turn off default fill of placeholder text via Illustrator preferences).


    # Live Shape Improvements


    More of the Illustrator shape tools are now fully live, interactive, and dynamically
    adjustable, so you can quickly craft vector shapes without having to apply effects
    or use other tools.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_22_0.png)


    A consistent visual experience now makes it easier to work with Live Shapes. Controls
    automatically hide as shapes are scaled to small sizes, and polygons maintain
    live characteristics after non-uniform scaling.


    # Improved Export of Assets and Artboards


    Now export individual artwork or entire artboards to various file sizes and formats
    in one click of a button. This is well-suited for mobile and web workflows. The
    feature ensures that your time is spent on getting the design right, and not on
    manually repetitive export workflows.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Pixel-Perfect Drawing


    The new pixel-snapping feature allows you to create pixel-perfect art or align
    the art to the pixel grid by other means. Several operations, such as path creation,
    modification, and transformations, now create art that is aligned to the pixel
    grid.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Other enhancements


    +   - Zoom to selection—You can now zoom into what is selected versus having to
    marquee-select an area with the Zoom tool to zoom in.


    +   - Stability & Performance Improvements—A host of stability fixes, bug fixes,
    and performance improvements have been implemented to help you work better and
    faster.


    +   - Keyboard shortcut for hidden characters—There are now keyboard shortcuts
    for the following characters: En Space, Em Space, Thin Space, Superscripts, Subscripts,
    Discretionary Hyphen, and Non-Breaking Space. These are also available for customization
    in the keyboard shortcuts list.


    +   - New Document dialog box—When you choose File > New, the New Document dialog
    is completely revamped.


    +   - Adobe Experience Design CC (Preview) integration—Copy and paste your Illustrator
    CC artwork directly into Adobe Experience Design CC, the new all-in-one tool for
    designing, prototyping, and sharing UX/UI web and app designs.


    Although this list touches on just a few of the new and enhanced features of Illustrator
    CC (2017 release), it exemplifies Adobe’s commitment to providing the best tools
    possible for your publishing needs. We hope you enjoy working with Illustrator
    CC (2017 release) as much as we do.


    The Adobe Illustrator CC Classroom in a Book (2017 release) team'
  merge: -1
  pgno: 24
