    # Working with the document grid


    The document grid allows you to work more precisely by creating a series of nonprinting
    horizontal and vertical guides behind your artwork in the Document window that
    objects can snap to. To turn the grid on and use its features, do the following:


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_137_0.png)


    +   - To show the grid or hide the grid, choose View > Show Grid/Hide Grid.

    - To snap objects to the gridlines, choose View > Snap To Grid, select the object
    you want to move, and drag it to the desired location. When the object''s boundaries
    come within 2 pixels of a gridline, it snaps to the point.

    - To specify grid properties such as the spacing between gridlines, grid style
    (lines or dots), grid color, or whether grids appear in the front or back of artwork,
    choose Illustrator CC > Preferences > Guides & Grid (Mac OS) or Edit > Preferences
    > Guides & Grid (Windows).


    > From Illustrator Help


    # Rounding corners


    Rounding the corners of rectangles is easy since the shapes you create are Live
    Shapes, which means you can easily edit properties like rounded corners using
    several methods. In this section, you''ll learn a few ways to round the corners
    of rectangles you''ve already created.


    +   - Tip

    Shape widgets (like the corner widgets) hide as your shape is reduced in size,
    and automatically reappear when scaled up or zoomed.'
