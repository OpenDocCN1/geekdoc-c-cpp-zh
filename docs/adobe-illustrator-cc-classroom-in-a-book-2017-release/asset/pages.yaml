    later. It can work in conjunction with the Export For Screens dialog box to set
    export options for the selected assets, as you''ll see.


    > TipnTo add artwork to the Asset Export panel, you can also right-click the artwork
    in the Document window and choose Collect For Export.


    > TipnTo delete an asset from the Asset Export panel, you can either delete the
    original artwork in the document or select the asset thumbnail in the Asset Export
    panel and click the Remove Selected Assets From This Panel button.'
