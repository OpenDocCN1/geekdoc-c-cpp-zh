  md: '# Applying a Photoshop Effect


    As described earlier in the lesson, raster effects generate pixels rather than
    vector data. Raster effects include SVG filters, all of the effects in the bottom
    portion of the Effect menu, and the Drop Shadow, Inner Glow, Outer Glow, and Feather
    commands in the Effect > Stylize submenu. You can apply them to either vector
    or bitmap objects.


    Next, you will apply a Photoshop effect (raster) to some of the background shapes.


    +   1 In the Layers panel (Window > Layers), click the selection column to the
    right of the Mountains layer to select the contents.


    +   2 Choose Effect > Texture > Texturizer.


    When you choose most of the raster (Photoshop) effects (not all), the Filter Gallery
    opens box. Similar to working with filters in Adobe Photoshop, where you can also
    access a Filter Gallery, in the Illustrator Filter Gallery, you can try different
    raster effects to see how they affect your artwork.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_586_0.png)


    +   3 With the Filter Gallery dialog box, you can see the type of filter (Texturizer)
    showing at the top. Choose Fit In View from the view menu in the lower-left corner
    of the dialog box. That should fit the artwork in the preview area so you can
    see how the effect alters one of the shapes.


    The Filter Gallery dialog box, which is resizable, contains a preview area (labeled
    A), effect thumbnails which you can click to apply (labeled B), settings for the
    currently selected effect (labeled C), and the list of effects applied (labeled
    D). If you want to apply a different effect, expand a category in the middle panel
    of the dialog box (labeled B) and click an effect thumbnail.'
