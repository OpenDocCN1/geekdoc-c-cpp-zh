  md: '# Joining with Join tool


    In this lesson and earlier lessons, you''ve used the Join command (Object > Path
    > Join) to join as well as close paths. Using the Join tool (✎), you can easily
    join paths that cross, overlap, or have open ends using scrubbing gestures.


    +   1 Choose View > Steam. This command will zoom in to the shapes above the coffee
    cup and also hide the layer named "Template."


    +   2 Click and hold down the mouse on the Pencil tool (✎), and select the Join
    tool (✎).

    Unlike the Join command (Object > Path > Join) you learned about Lesson 3, the
    Join tool can trim overlapping paths as it joins, and it doesn''t simply create
    a straight line between the anchor points you join. The angle created by the two
    paths to be joined are taken into account.


    Note If you were to instead join the ends of the open path by pressing Cmd+J (Mac
    OS) or Ctrl+J (Windows), a straight line would connect the ends.


    +   3 With the Join tool selected, drag across the two ends of the path on the
    right (see the figure for which).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_305_0.png)


    When dragging (also called scrubbing) across paths, they will be either "extended
    and joined" or "trimmed and joined." In this example, the paths were extended
    and joined. The Join tool works on paths that are selected or not, but the result
    of joining is not to continue working on more paths.


    +   4 Drag across (or scrub) the excess part of the paths on the shape to the
    left to remove them and close the path. In this case, the path was "trimmed and
    joined."'
