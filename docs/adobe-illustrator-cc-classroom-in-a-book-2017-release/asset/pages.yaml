    other colors (like Pantone colors), and much more.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_351_0.png)


    # Working with Live Paint


    Live Paint lets you paint vector graphics intuitively, by automatically detecting
    and correcting gaps that might otherwise affect the application of fills and strokes.
    Paths divide the drawing surface into areas that can be colored, whether the area
    is bounded by a single path or by segments of multiple paths. Painting objects
    with Live Paint is like coloring in a coloring book or using watercolors to paint
    a sketch, and the underlying shapes are not edited.


    # Note


    To learn more about Live Paint and all that it can do, search for “Live Paint
    groups” in Illustrator Help (Help > Illustrator Help).


    # Creating a Live Paint group


    Next, you will paint artwork using the Live Paint Bucket tool.


