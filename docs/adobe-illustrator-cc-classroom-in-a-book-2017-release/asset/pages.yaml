    # Using Image Trace


    In this lesson, you''ll learn how to work with the Image Trace command. Image
    traces existing artwork, like a raster picture from Adobe Photoshop. You can then
    convert the drawing to vector paths or a Live Paint object. This can be useful
    for turning a drawing into vector art, tracing raster logos, tracing a pattern
    or texture, and much more.


    # Tip


    Use Adobe Capture CC on your device to photograph any object, design, or shape
    and convert it into vector shapes in a few simple steps. Store the resulting vectors
    in your Creative Cloud Libraries, access them or refine them in Illustrator or
    Photoshop. Adobe Capture is currently available for iOS (iPhone and iPad) and
    Android.'
