  md: '# Painting with patterns


    In addition to process colors, spot colors, and gradients, the Swatches panel
    can also contain pattern swatches. Illustrator provides sample swatches of each
    type in the default Swatches panel as separate libraries and let you create your
    own patterns and gradients. In this section, you will focus on creating, applying,
    and editing patterns.


    # Applying an existing pattern


    A pattern is artwork saved in the Swatches panel that can be applied to the stroke
    or fill of an object. You can customize existing patterns and design patterns
    from scratch with any of the Illustrator tools. All patterns start with a single
    tile that tiled (repeated) within a shape, starting at the ruler origin and continuing
    to the right. Next, you will apply an existing pattern to a shape.


    +   1 Choose Object > Unlock All.

    2 Choose Select > Deselect.

    3 With the Selection tool selected, click to select the rectangle with the blue
    gradient that represents the sky (behind the text and ship).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_501_0.png)


    +   4 Choose Window > Appearance to open the Appearance panel. Click the Add New
    Fill button at the bottom of the panel. This adds a second gradient fill to the
    rectangle and layers on top of the first.


    > Note

    You’ll learn all about the Appearance panel in Lesson 12, “Exploring Creative
    Uses of Effects and Graphic Styles.”


    +   5 In the Appearance panel, click the top word “Fill:” to select the top Fill
    row, if necessary. An arrow is pointing to it in the previous figure.

    6 Choose Window > Swatch Libraries > Patterns > Decorative > Vonster Patterns
    to open the pattern library.'
