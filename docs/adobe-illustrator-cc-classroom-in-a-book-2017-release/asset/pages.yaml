  md: '# Exploring color modes


    There are many ways to experiment with and apply color to your artwork in Adobe
    Illustrator CC. As you work with color, it''s important to keep in mind the medium
    in which the artwork will be published, as a print piece or a website. The colors
    you create need to be described in the correct way for the medium. This usually
    requires that you use the correct color mode and color definitions for your colors.
    The first part, color modes, will be described next.


    Before starting a new document, you should decide which color mode the artwork
    should use, CMYK or RGB.


    +   * CMYK—Cyan, magenta, yellow, and black are the colors used in four-color
    process printing. These four colors are combined and overlapped on a screen pattern
    to create a multitude of other colors. Select this mode for printing (in the New
    Document dialog box or the File > Color Mode menu).

    * RGB—Red, green, and blue light are added together in various ways to create
    an array of colors. Select this mode if you are using images for onscreen presentations,
    the Internet, or mobile apps.


    > Tip

    To learn more about color and graphics, search for “About color” in Illustrator
    Help (Help > Illustrator Help).


    When creating a new document by choosing File > New, each profile has a specific
    color mode. For instance, the Print profile uses the CMYK color mode. You can
    easily change the color mode by making a selection in the Color Mode menu.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# New Document


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_312_0.png)


    When a color mode is selected, the applicable panel opens, displaying colors in
    the selected color mode. You can change the color mode of a document, after a
    file is created, by Choosing > Document Color Mode and then selecting either CMYK
    Color or RGB Color in the menu.


    # Working with color


    In this lesson, you''ll learn about the traditional methods of coloring (also
    called painting) objects in Illustrator using a combination of panels and tools,
    such as the Control panel, Color panel, Swatches panel, Color Guide panel, Color
    Picker, and the paint options in the Tools panel.


    +   - Note The Tools panel you may see be a single column, and that just depends
    on the resolution of your screen.


    In previous lessons, you learned that objects in Illustrator can have a fill,
    a stroke, or both. At the bottom of the Tools panel (on the left), notice the
    Fill and Stroke boxes. The Fill box is white (in this case) and the Stroke box
    is Black. If you click boxes one at a time, you''ll see that whichever you click
    is brought in front of the other (it''s selected). When a color is chosen, it
    is applied to the fill or stroke, whichever is selected. As you explore more of
    Illustrator, you''ll see these fill and stroke boxes in lots of other places like
    the Color panel, Swatches panel, and more.'
