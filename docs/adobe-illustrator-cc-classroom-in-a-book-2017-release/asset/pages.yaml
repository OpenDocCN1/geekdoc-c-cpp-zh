  md: '# Changing font family and font style


    In this section, you''ll apply a font to text. After applying local fonts to text
    from your machine, Creative Cloud subscribers can apply Typekit fonts that have
    been synced with their computer. Typekit is a subscription service offering access
    to a library of fonts for use in desktop applications such as InDesign or Microsoft
    Word and on websites. A Typekit Portfolio is included with your Creative Cloud
    subscription, and trial Creative Cloud members have access to selection of fonts
    for web and desktop use. Fonts appear alongside locally installed fonts in the
    fonts list in Illustrator, as you will soon see. By default, Typekit is turned
    on in the Creative Cloud application (version 1.9 and later) so that you can sync
    fonts and make them available in your desktop applications.


    +   Note

    The Creative Cloud desktop application must be installed on your computer, and
    you must have an Internet connection to initially sync fonts. The Creative Cloud
    desktop application is usually installed automatically when you install your first
    Creative Cloud application, like Illustrator.


    +   Note

    For questions about Typekit font licensing, visit https://helpx.adobe.com/typekit/using/font-licensing.html.
    For more information on working with Typekit fonts, visit https://helpx.adobe.com/creative-cloud/help/add-fonts-typekit.html.


