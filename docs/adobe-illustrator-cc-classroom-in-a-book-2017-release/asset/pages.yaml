  md: '# GPU Performance


    The graphics processing unit (GPU), found on video cards and as part of display
    systems, is a specialized processor that can rapidly execute commands for manipulating
    and displaying images. GPU-accelerated computing offers faster performance across
    a broad range of design, animation, and video applications.


    The GPU Performance in Illustrator has a preview mode called GPU Preview, which
    enables rendering of Illustrator artwork on the graphics processor.


    This feature is available on Windows computers that have an NVIDIA GPU installed
    and compatible Mac OS computers.


    This feature is turned on by default for RGB and CMYK documents, and can be accessed
    in Preferences by clicking the GPU Performance icon in the Application bar.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_88_0.png)


    To learn more about GPU performance, visit https://helpx.adobe.com/illustrator/kb/gpu-performance-preview-improvements.html.


    # Scrolling through a document


    In Illustrator, you can use the Hand tool (H) to pan to different areas of a document.
    Using the Hand tool allows you to push the document around much like you would
    a piece of paper on your desk. In this section, you''ll access the Hand tool using
    a few methods.


    +   - With the Hand tool selected in the Tools panel, drag down in the Document
    window. As you drag, the artwork moves with the hand.

    - With the Zoom tool (Q), you can select the Hand tool with a keyboard shortcut
    without desactivating the active tool.

    - Click any other tool except the Type tool (T) in the Tools panel, and move the
    pointer into the Document window. Hold down the spacebar on the keyboard to temporarily
    select the Hand tool, and then drag to bring the artwork back into the center
    of your view.


    The spacebar shortcut for the Hand tool ( ) does not work when the Type tool (T)
    is active and the cursor is in text. To access the Hand tool when the cursor is
    in text, press the Option (Mac OS) or Alt (Windows) key.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Touch workspace


    In Illustrator CC, the Touch workspace is designed for Windows 8– and Windows
    10– (and later) powered touch-enabled devices. The touch layout has a cleaner
    interface that allows you to comfortably use a stylus or your fingertip to the
    tools and controls of the Touch workspace.


    You can create logos, create icons, explore custom lettering and typography, create
    UI wireframes, and more. The Touch workspace brings traditional drawing templates
    and French curves to the Illustrator workspace. These shapes project a scalable,
    movable outline that can be traced against to quickly create refined curves.


    At any time (on a supported device), you can immediately switch between the Touch
