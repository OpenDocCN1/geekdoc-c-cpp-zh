  md: '+   4 Briefly describe what the Scale Strokes & Effects option in the Transform
    panel does.

    5 Name at least three transformations that can be applied with the Free Transform
    tool.


    # Review answers


    +   1 To change the size of an existing artboard, you can do the following:

    - Double-click the Artboard tool (⇧), and edit the dimensions of the active artboard
    the Artboard Options dialog box.

    - Select the Artboard tool, position the pointer over an edge or corner of the
    artboard, and drag to resize.

    - Select the Artboard tool, click an artboard in the Document window, and change
    the dimensions in the Control panel.


    +   2 The ruler origin is the point where 0 (zero) appears on each ruler. By default,
    the ruler origin is set to 0 (zero) in the top-left corner of the active artboard.


    +   3 There are two types of rulers in Illustrator: set the ruler origin at the
    upper-left corner of the active artboard, no matter which artboard is active.
    Artboard rulers, which are the default rulers, set the ruler origin at the upper-left
    corner of the active artboard. Global rulers set the ruler origin at the upper-left
    corner of the first active artboard.


    +   4 The Scale Strokes & Effects option, found in the Transform panel (or in
    Illustrator CC > Preferences > General [Mat OS] or Edit > Preferences > General
    [Windows]), scales any strokes and effects as the object is scaled. This option
    can be turned on and off, depending on the current need.


    +   5 The Free Transform tool (⮖) can perform a multitude of transformation operations,
    including move, scale, rotate, shear, and distort (perspective distort and free
    distort).'
