    # The Symbolism Tools


    The Symbol Sprayer tool ( ) in the Tools panel allows you to spray symbols on
    the artboard, creating symbol sets.


    A symbol set is a group of symbol instances that you create with the Symbol Sprayer
    tool. This can be really useful, for instance, if you were to create grass blades
    of grass. Spreading the blades of grass speeds up this process greatly and makes
    it much easier to edit individual instances of grass or the sprayed grass as a
    group. You can create mixed sets of symbol instances by using the Symbol Sprayer
    tool with one symbol and then using it again with another symbol.


    You use the symbolism tools to modify multiple symbol instances in a set. For
    example, you can disperse instances over a larger area using the Symbol Scruncher
    tool or gradually tinting the color of instances to make them look more realistic.


