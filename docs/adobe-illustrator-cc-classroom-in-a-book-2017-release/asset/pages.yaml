  md: '# Note


    If you don''t see Reset Essentials in the workspace switcher menu, choose Window
    > Workspace > Essentials before choosing Window > Workspace > Reset Essentials.


    9 Choose Reset Essentials from the workspace switcher in the Application bar.


    # Working with gradients


    A gradient fill is a graduated blend of two or more colors, and it always includes
    a starting color and an ending color. You can create different types of gradient
    fills in Illustrator, including linear, in which the beginning color blends into
    the ending color along a line, radial, in which the beginning color radiates outward,
    from the center point to the ending color. You can use the gradients provided
    with Adobe Illustrator CC or create your own gradients and save them as swatches
    for later use.


    You can use the Gradient panel (Window > Gradient) or the Gradient tool to apply,
    create, and modify gradients. In the Gradient panel, the Gradient Fill box or
    Stroke box displays the current gradient colors and gradient type applied to the
    fill or stroke of an object.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_460_0.png)


    # Note


    The Gradient panel you see will not match the figure, and that''s okay.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_460_1.png)'
