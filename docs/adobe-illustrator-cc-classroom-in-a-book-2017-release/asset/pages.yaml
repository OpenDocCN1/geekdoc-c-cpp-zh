    # Creating a Pattern brush


    You can create a Pattern brush in several ways. For a simple pattern applied to
    a straight line, for instance, you can select the content that you''re using for
    the pattern and click the New Brush button at the bottom of the Brushes panel.


    To create a more complex pattern to apply to objects with curves and corners,
    you can select artwork in the Document window to be used in a pattern brush, create
    swatches in Swatches panel from the artwork that you are using in the Pattern
    brush, and even have Illustrator auto-generate the Pattern brush corners. In Illustrator,
    the Illustrator automatically generates four different types of corners based
    on the art defined. Next, you''ll create a Pattern brush for the border around
    the poster.


    > Note

    You''ll find Pattern Objects at the bottom of the View menu.


    +   1 Choose View > Pattern objects. This should show you a zoomed-in view of
