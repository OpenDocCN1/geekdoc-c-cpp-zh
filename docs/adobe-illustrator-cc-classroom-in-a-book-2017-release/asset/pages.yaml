  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_686_0.png)


    5 Choose Select > Deselect, then choose File > Save.


    # Masking an object with multiple shapes


    You can easily create a mask from either a single shape or multiple shapes. In
    order to create a clipping mask with multiple shapes, the shapes first need to
    be converted to a compound path. This can be done by selecting the shapes that
    will be used as the mask and choosing Object > Compound Path > Make. Ensure that
    the compound path is on top of the content to be masked, and then choose Object
    > Clipping Mask > Make.


    # Creating an opacity mask


    An opacity mask is different from a clipping mask because it allows you to mask
    an object and alter the transparency of artwork. You can make and edit an opacity
    mask using the Transparency panel. In this section, you''ll create an opacity
    mask for the Water.jpg image so that it fades into the blue color of the background
    shape.


    +   1 In the Layers panel, click the disclosure triangles for all layers to collapse
    the contents, if necessary. Click the visibility column to the left of the Background
    layer to see its contents. Click the eye icon to the left of the Pictures and
    Text layers to hide their contents.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_686_1.png)


    +   2 With the Selection tool selected, click the water image on the artboard.
    Choose Align To Artboard from the Align To Menu, if necessary, in the Control
    panel. Click the Horizontal Align Center button and then the Vertical Align Center
    button in the Control panel to align the image to the artboard.'
