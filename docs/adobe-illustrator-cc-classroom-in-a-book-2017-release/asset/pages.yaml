    # Warping text


    You can create some great design effects by warping text into different shapes
    using envelopes. You can make an envelope out of an object on your art, or you
    can use a preset warp shape or a mesh grid as an envelope. As you explore warping
    with envelopes, you''ll also discover that you can use envelopes on any object
    except graphs, guides, or linked objects.


    +   Tip


    There are several additional ways to warp content text, including with a mesh
    and an object you create. To learn more about these other methods, search for
    “Reshape using envelopes” in Illustrator Help (Help > Illustrator Help).


    # Reshaping text with a preset envelope warp


