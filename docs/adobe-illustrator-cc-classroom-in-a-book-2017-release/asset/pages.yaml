  md: '# Creating and editing a smooth color blend


    You can choose several options for blending the shapes and colors of objects to
    create a new object. When you choose the Smooth Color blend option in the Blend
    Options dialog box, Illustrator combines the shapes and colors of the objects
    into many intermediate steps, creating a smooth, graduated blend from the original
    objects. If objects are filled or stroked with different colors, the steps are
    calculated to provide the optimum number of steps for a smooth color transition.
    If the objects contain identical colors or if they contain gradients or patterns,
    the number of steps is based on the longest distance between the bounding box
    edges of the objects.


    Now you''ll combine two shapes into a smooth color blend to make the ship.


    +   1 Choose View > Fit Artboard In Window.

    2 Select the Zoom tool (🔍), and click twice to zoom into the windows on the ship.

    You will now blend two paths that will become the ship. Both paths have a stroke
    color and no fill. Objects that have strokes blend differently than those that
    have no stroke.

    3 Select the Blend tool (⊕) in the Tools panel, and position the pointer (Δ) over
    the top path beneath the sails and click. Position the pointer (+) over the bottom
    path, and click. Leave the blend object selected.


    The blend you created is using the last settings from the Blend Options dialog
    box (Specified Steps: 6).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_498_0.png)


    Next, you''ll change the blend settings for the ship so that it blends as smooth
    color, rather than in specified steps.

    4 With the blend object selected, double-click the Blend tool in the Tools panel.
    In the Blend Options dialog box, choose Smooth Color from the Spacing menu to
    set up the blend options, which will remain until you change them. Select Preview,
    and then click OK.'
