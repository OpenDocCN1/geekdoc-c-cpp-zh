    # Working with symbols


    A symbol is a reusable art object that is stored in the Symbols panel (Window
    > Symbols). For example, if you create a symbol from a flower you drew, you can
    then quickly add multiple instances of flower symbol to your artwork, which saves
    you from having to draw each flower. All instances in the document are linked
    to the original symbol in the Symbols panel. When you edit the original symbol,
    all instances of the flower (in this example) are linked to it updated. You can
    turn all those flowers from white to red instantly! Not only do symbols save time,
    but they also greatly reduce file size.


    > Note

    Illustrator comes with a series of symbol libraries, which range from tiki icons
    to hair to web icons. You can access those symbol libraries in the Symbols panel
    or by choosing Window > Symbol Libraries and easily incorporate into your own
    artwork.


    +   Click the Symbols panel icon on the right side of the workspace. The different
    options available in the Symbols panel are described here:


