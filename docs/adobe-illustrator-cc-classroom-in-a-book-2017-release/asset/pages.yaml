- img_proc: true
  md: '# Exploring the workspace


    You create and manipulate your documents and files using various elements, such
    as panels, bars, and windows. Any arrangement of these elements is called a workspace.
    When you first start Illustrator, you see the default workspace, which you can
    customize for the tasks you perform. You can create and save multiple workspaces—one
    for editing and another for viewing, for example—switch among them as you work.


    > > The figures in this lesson are taken using the Mac OS operating system and
    may be slightly different from what you use, especially if you are using the Windows
    OS.


    Below, the areas of the default workspace are described:


    +   - Application bar

    - Control panel

    - Panels

    - Tools panel

    - Document window

    - Status bar


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_66_0.png)


    **The Application bar** across the top by default contains a workspace switcher,
    the menu bar (on Windows OS, the menu items appear *inline* with the Application
    bar—see the following figure), and application controls.


    +   - **The Control panel** displays options for the currently selected object.

    - **The Panels** help you monitor and modify your work. Certain panels are displayed
    by default, and you can display any panel by choosing it from the Window menu.


    **The Tools panel** contains tools for creating and editing images, artwork, page
    elements, and more. Related tools are grouped together.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'E. The Document window displays the file you''re working on.


    F. The Status bar appears at the lower-left edge of the Document window. It displays
    information, zooming, and navigation controls.


    # Getting to know the Tools panel


    The Tools panel on the left side of the workspace contains selection tools, drawing
    and painting tools, editing tools, viewing tools, the Fill and Stroke boxes, drawing
    modes, and screen modes. As you work through the lessons, you''ll learn about
    the specific function of many of these tools.


    > Note The Tools panel shown here and throughout this lesson has two columns.
    You may see a one-column Tools panel, depending on your screen resolution and
    workspace.'
  merge: -1
  pgno: 67
