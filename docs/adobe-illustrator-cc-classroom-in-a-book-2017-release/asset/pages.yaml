  md: '# Using view commands


    To enlarge or reduce the view of artwork using the View menu, one of the following:


    +   - Choose View > Zoom In to enlarge the display of the artwork.

    - Choose View > Zoom Out to reduce the view of the artwork.


    > Tip

    You can also zoom in using the keyboard shortcut Command++ (Mac OS) or Ctrl++
    (Windows). That''s Command and + (Mac OS) or Ctrl and + (Windows). You can also
    zoom out using the keyboard shortcut Command++ (Mac OS) or Ctrl++ (Windows). That''s
    Command and - (Mac OS) or Ctrl and - (Windows).


    > Note

    Using any of the viewing tools and commands affects only the display of the artwork,
    not the actual size of the artwork.


    Each time you choose a Zoom option, the view of the artwork is resized to the
    closest preset zoom level. The preset zoom levels appear in a menu in the lower-left
    corner of the Document window, identified by a down arrow to a percentage. If
    you have artwork selected, using the View > Zoom In command will zoom into what
    is selected.

    You can also use the View menu to fit the artwork for the active storyboard to
    screen to fit all artworks into the view area or to view artwork at actual size.


    > Tip

    You can also double-click the Hand tool ( ) in the Tools panel to fit the active
    storyboard in the Document window.


    +   1 Choose View > Fit Inboard (the area outside the artboards) extends to 227",
    you can easily lose sight of your illustration. By choosing View > Fit Inboard
    In Window or by using the keyboard shortcut Command+0 (Mac OS) or Ctrl+0 (Windows),
    artwork is centered in the viewing area.

    2 Choose View > Actual Size to display the artwork at actual size.

    The artwork is displayed at 100%. The actual size of your artwork determines much
    of it can be viewed onscreen at 100%.

    3 Choose View > Fit Inboard In Window before continuing to the next section.


    > Tip

    You can also double-click the Zoom tool ( ) in the Tools panel to display artwork
    at 100%.'
  merge: -1
