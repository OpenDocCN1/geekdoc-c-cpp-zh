  md: '# Tip


    To edit the blend options for an object, you can also select the blend object
    and then double-click the Blend tool. You can also double-click the Blend tool
    (◎) in the Tools panel to set tool options before you create the blend object.


    +   Select the Selection tool (☞) in the Tools panel, and double-click anywhere
    on the blend object to enter Isolation mode.

    This temporarily ungroups the blended objects and lets you edit each original
    shape, as well as the spine. The spine is a path along which the steps in a blended
    object are aligned. By default, the spine is a straight line.


    +   Choose View > Outline.

    In Outline mode, you can see the outlines of the two original shapes and a straight
    path between them. The straight path you see, called the spine, is the path along
    which the steps in a blend object are aligned. These three objects are what a
    blend object is composed of, by default. It can be easier to edit the path between
    the original objects in Outline mode.


