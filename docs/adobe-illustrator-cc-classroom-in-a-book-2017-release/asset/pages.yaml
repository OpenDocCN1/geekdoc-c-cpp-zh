  md: '8 Choose Select > Deselect, and then choose File > Save.


    # Using Illustrator swatch libraries


    Swatch libraries are collections of preset colors, such as Pantone and TOYO, and
    thematic libraries, such as Eartone and Ice Cream. Illustrator has default swatch
    libraries that appear as separate panels when you open them, and these cannot
    be edited. When you apply color from a library to artwork, the color in the library
    becomes a swatch that is saved in that document only and appears in the Swatches
    panel. Libraries are a great starting point for creating colors.


    +   - Note


    Sometimes it''s practical to use process (typically CMYK) and spot inks (PANTONE,
    for instance) you might use one spot ink to print the color of a company logo
    on the same pages of an annual report where photographs are reproduced using process
    color. You can also use spot-color printing plate to apply a varnish over areas
    of a color job. In both cases, your print job would use a total of five inks—four
    process inks and one spot or varnish.


    Now, you will create a spot color using a Pantone Plus library, which prints using
    a spot ink. When color is defined in Illustrator and later printed, the appearance
    of the color may vary. This is why most printers and designers rely on a color-matching
    system, like the PANTONE system, to help maintain color consistency and, in some
    cases, to give a wider range of colors.


    # Adding a spot color


