  md: '# Resetting and saving your workspace


    You can reset your Tools panel and other panels to their default positions, which
    you''ve been doing throughout this lesson. You can also save the position of panels
    so that you can easily access them at any time by creating a workspace.


    Next, you will create a workspace where the Libraries panel is collapsed.


    > Note

    To delete saved workspaces, choose Window > Workspace > Manage Workspaces.

    Select the workspace name, and click the Delete Workspace button.


    +   1 Choose Reset Essentials from the workspace switcher in the Application bar.

    2 Choose Window > Libraries to close the Libraries panel.

    3 Choose Window > Workspace > New Workspace. Change Name to LibrariesHidden in
    the New Workspace dialog box, and click OK.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_81_0.png)


    The name of the workspace could be anything, as long as it makes sense to you.
    The workspace named “LibrariesHidden” is now saved with Illustrator until you
    remove it.


    > Tip

    To change a saved workspace, reset the panels as you''d like them to appear, and
    then choose Window > Workspace > New Workspace. In the New Workspace dialog box,
    name the workspace with the original name. A message appears in the dialog box
    warning that you will overwrite an existing workspace with the same name if you
    click OK.


    +   4 Choose Window > Workspace > Essentials.

    5 Choose Window > Workspace > Reset Essentials.

    Notice that the panels return to their default positions.

    6 Choose Window > Workspace > LibrariesHidden. Toggle between the two workspaces
    using the Window > Workspace command, and return to the Essentials workspace before
    starting the next exercise.

    7 Choose Window > Libraries to close the Libraries panel.'
