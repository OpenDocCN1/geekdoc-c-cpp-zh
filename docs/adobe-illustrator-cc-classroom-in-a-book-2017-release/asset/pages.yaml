  md: '# Creating Pixel-Perfect Drawings


    When creating content for the Web, in mobile apps, and onscreen presentations
    and more, it''s important that images saved from vector art look sharp. To enable
    designers to create pixel-accurate designs, you can align artwork to the pixel
    grid using the Snap To Pixel option. The pixel grid is a grid of 72 squares per
    inch, vertically and horizontally, that is view when you zoom to 600% or higher
    with Pixel Preview enabled (View > Pixel Preview). Pixel-aligned is an object-level
    property that enables an object to have its vertical and horizontal paths aligned
    to the pixel grid. This property remains with the object when the object is modified.
    Any vertical or horizontal path in the object gets aligned to the pixel grid as
    long as the property is set for it.


    # Aligning artwork to the pixel grid


    When Snap To Pixel (View > Snap To Pixel) is enabled, shapes that are drawn, modified,
    or transformed appear crisp. This makes most artwork, including most Live Shapes,
    align to the pixel grid automatically. In this first section, you''ll explore
    the pixel grid and how to align new content to it.


    > Tip


    After you create a document, you can change the document color mode using this
    command (File > Document Color Mode). This sets the default color mode for all
    new colors you create and the existing swatches. RGB is the correct color mode
    to use when creating content for the Web, for apps, or for onscreen presentations.


    +   1 In the AssetExport.Lai file, choose File > Document Color Mode, and you
    will see that RGB Color is selected.


    +   When designing for onscreen viewing (web, apps, etc.), RGB (Red, Green, Blue)
    is the preferred color mode for documents in Illustrator. When you create a new
    document (File > New), you can choose color mode to use with the Color Mode option.
    In the New Document dialog box, choosing any document profile, except for Print,
    sets Color Mode to RGB by default.


    +   2 Select the Selection tool (selection), and click to select the brown circle
    with the word “ACCESSORIES” beneath it. Press Cmd++ (Mac OS) or Ctrl++ (Windows)
    several times to zoom in to the selected artwork.


    +   3 Choose View > Pixel Preview to preview a rasterized version of the design.'
