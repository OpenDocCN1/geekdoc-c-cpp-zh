    (Smart Guides) will appear in the center indicating that the ellipse has become
    a circle (an ellipse with equal width and height).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_161_1.png)


    Shapes drawn with the Shaper tool are live and dynamically adjustable, so you
    can draw and edit intuitively without the extra hassle of switching between tools
    Notice that no measurement label appears to indicate the shape size. When transforming
    shapes with the Shaper tool, measurement labels won''t appear, even if Smart Guides
