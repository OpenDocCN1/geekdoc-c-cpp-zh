  md: '# Save For Web (Legacy)


    If you have previously relied on the Save For Web dialog box, you can still access
    it. By choosing File > Export > Save For Web (Legacy), you can use the Save For
    Web dialog box to select optimization options and preview optimized artwork. You
    will most likely see a message about the Export For Screens functionality, which
    is seen as a replacement for the Save For Web dialog box.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_723_0.png)


    # Creating CSS from your design


    If you are building a website or want to hand off to a developer, you can convert
    the visual designs you create in Illustrator to Cascading Style Sheets using the
    CSS Properties (Window > CSS Properties) or File > Export > Export As command.
    Cascading Style Sheets is a specification for formatting rules, much like paragraph
    and character styles in Illustrator, to control the appearance of content in a
    web page. Unlike paragraph and character styles in Illustrator, CSS can control
    not only the look and feel of text but also the formatting and positioning of
    page elements found in HTML.


    +   * Note


    Exporting or copying CSS from Illustrator CC does not create HTML for a web page.
    It is intended to create CSS that is applied to HTML you create elsewhere, such
    as in Adobe Dreamweaver.'
