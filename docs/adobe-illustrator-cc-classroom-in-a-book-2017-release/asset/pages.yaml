    # Editing the ruler origin


    The point on each ruler (horizontal and vertical) where the 0 appears is called
    the ruler origin. By default, the ruler origin is in the upper-left corner of
    the active artboard. On the horizontal ruler, measurements to the right of 0 (zero)
    are positive and to the left are negative. On the vertical ruler, measurements
    below 0 (zero) are positive and above are negative. You can move the ruler origin
    to start the horizontal and/or vertical measurements at another location, and
    that''s what you''ll do next.


    # Tip


    If you Command-drag (Mac OS) or Ctrl-drag (Windows) from the ruler intersect,
    you create a horizontal and vertical guide that intersects where you release the
