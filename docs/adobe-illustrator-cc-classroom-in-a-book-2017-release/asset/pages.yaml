  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_729_0.png)


    .st0 is short for "style 0" and is a generic for the name that don''t format in
    the Layers panel will be named st1, st2, and so on, after turning on Generate
    CSS for Unnamed Objects. This type of style naming can be useful if, for instance,
