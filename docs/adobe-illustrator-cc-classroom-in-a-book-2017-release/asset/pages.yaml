  md: '# Drawing a shape


    Drawing shapes is the cornerstone of Illustrator, and you''ll create many of them
    in the coming lessons. To start your artwork, you''ll create a rectangle.


    > Note

    Learn more about creating and editing shapes in Lesson 3, "Using Shapes to Create
    Artwork for a Postcard."


    +   1 Choose View > Fit Artboard In Window.

    2 Choose View > Zoom Out.

    The white area you see is called the *artboard*, and it''s where your printable
    artwork will go. Artboards are similar to pages in a program like Adobe InDesign®.

    3 Select the Rectangle tool in the Tools panel on the left.

    4 Position the pointer in the upper-left part of the artboard (see the red X in
    the figure). Click and drag down to it. When the gray measurement label next to
    the pointer shows a width of *approximately 5.5 inches* and a height of 2.2 inches,
    release the mouse button. The shape will remain selected.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_28_0.png)


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_28_1.png)


    Shapes can be created by drawing them or clicking the artboard with a shape tool
    and modifying shape properties before they are created.


    # Rounding the corners of a shape


    Most shapes you create are Live Shapes, which means properties such as width,
    height, corners, angles, and number of sides can continue to be modified after
    the shape has been created. Next, you''ll round the corners of the rectangle you
    created.


    > Tip

    You can round all of the corners or each independently. You''ll learn more about
    creating and editing Live Shapes in Lesson 3, "Using Shapes to Create Artwork
    for a Postcard."


    +   1 Select the Selection tool in the Tools panel on the left.'
