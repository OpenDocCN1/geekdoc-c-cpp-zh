    # # Using Calligraphic brushes


    The first type of brush you''ll learn about is a Calligraphic brush. Calligraphic
    brushes resemble strokes drawn with the angled point of a calligraphic pen. Calligraphic
    brushes are defined by an elliptical shape whose center follows the path, and
    you can use these brushes to create the appearance of hand-drawn strokes made
    with a flat, angled pen tip.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_519_1.png)


