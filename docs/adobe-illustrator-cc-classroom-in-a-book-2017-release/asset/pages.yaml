  md: '# Applying a graphic style to text


    When you apply a graphic style to a type area, the fill color of the graphic style
    overrides the fill color of the text by default. If you deselect Override Character
    Color from the Graphic Styles panel menu (), the fill color (if there is one)
    in the text overrides the color of the graphic style.


    If you choose Use For Preview from the Graphic Styles panel menu (), you can then
    right-click and hold down the mouse button on a graphic style to preview the graphic
    style on the text.


    # Updating a graphic style


    Once you create a graphic style, you can update the graphic style, and all artwork
    with that style applied will update its appearance as well. If you edit the appearance
    of artwork that a graphic style is applied to, the graphic style is overridden
    and the artwork will not update when the style is updated.


