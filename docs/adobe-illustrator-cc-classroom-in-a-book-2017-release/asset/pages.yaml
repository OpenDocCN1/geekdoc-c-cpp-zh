- img_proc: true
  md: '# Introducing curved paths


    In this lesson, you''ll learn how to draw curved lines with the Pen tool. In vector
    drawing applications such as Illustrator, you can draw a curve, called a Bezier
    curve, with anchor points and direction handles. By setting anchor points and
    dragging direction handles, you can define the shape of the curve. This type of
    anchor point, with direction handles, is called a smooth point. Although drawing
    curves this way can take some time to learn, you will get the greatest control
    and flexibility in creating paths. The goal for this exercise is not to create
    anything specific but to get accustomed to the feel of creating Bezier curves.
    First, you''ll just get the feel for how to create a curved path.


    # Smooth points vs. corner points


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_267_0.png)


    Paths can have two kinds of anchor points: corner points and smooth points. At
    a corner point, a path abruptly changes direction. At a smooth point, path segments
    are connected as a continuous curve.


    > —From Illustrator


    +   1. Choose 3 from the Artboard Navigation menu in the lower-left corner of
    the Document window. You will draw in the area labeled “Practice.”

    2. Select the Zoom tool (🔍) in the Tools panel, and click twice in the bottom
    half of the storyboard to zoom in.

    3. Select the Pen tool (✒️) in the Tools panel. In the Control panel, make sure
    that the fill color is None () and the stroke color is Black. Also, make sure
    the stroke weight is 1 pt in the Control panel.

    4. With the Pen tool selected, click in a blank area of the storyboard to create
    a starting anchor point.

    5. Move the pointer away from the original point you created, and click and drag
    away from the point to create a curved path.


    Notice that as you drag away from the point, direction handles appear. Direction
    handles consist of direction lines that end in round direction points. The angle
    and length of the direction handles determine the shape and size of the curve.
    Direction handles do not print.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '6 Move the pointer away from the anchor point you just created to see the rubber
    banding.

    Move the pointer around a bit to see how it changes.


    7 Continue clicking and dragging in different areas to create a series of points.


    8 Choose Select > Deselect. Leave the file open for the next section.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_268_0.png)


    Components of a path

    As you draw, you create a line called a path. A path is made up of one or more
    straight or curved segments. The beginning and end of each segment is marked by
    anchor points, which work like pins holding a wire in place. A path can be closed
    (for example, a circle) or open, with distinct endpoints (for example, a wavy
    line). You change the shape of a path by dragging its anchor points, the direction
    points at the end of direction lines that appear at anchor points, or the path
    segment itself.


    > —From Illustrator Help


    +   A. Line segment

    B. Anchor point

    C. Direction line

    D. Direction point


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_268_1.png)'
