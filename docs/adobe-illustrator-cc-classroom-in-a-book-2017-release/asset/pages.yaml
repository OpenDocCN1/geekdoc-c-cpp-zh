    # Symbol Options


    In the Symbol Options dialog box, you will encounter several options. These options
    are briefly described here:


    +   * Export Type: Movie Clip is the default symbol type in Flash and in Illustrator.
    This option will not affect the artwork while in Illustrator. If the artwork is
    imported from Flash or exported for use in Flash, a movie-clip symbol in Flash
    can contain reusable animation, while a graphic symbol in Flash will remain static.

    * Dynamic Symbol: Selecting this option allows for local appearance overrides
    over dynamic instances, but the relation with the master symbol is left intact.

    * Static Symbol: Selecting this option does not allow for local appearance overrides;
    only certain operations are possible like transformations, opacity, and more.

    * Specify a location on the Registration grid where you want to set the symbol’s
    anchor point. The location of the anchor point affects the position of the symbol
    within the screen.

    * Select Enable Guides for 9-Slice Scaling if you want to utilize 9-Slice scaling
    in Illustrator or Flash.


    > From Illustrator Help'
