    # Formatting type


    You can format text using character and paragraph formatting, apply fill and stroke
    attributes to it, and change its transparency through it is. You can apply these
    changes to one character, a range of characters, or all characters in a type object
    that you select. As you''ll soon see, selecting the type object, rather than selecting
    the text inside, lets you apply formatting options to all of the text in the object,
    including options from the Character and Paragraph panels, fill and stroke attributes,
    and transparency settings.


    In this section, you''ll discover how to change text attributes, such as size
    and font, and later learn how to save that formatting as text styles.'
