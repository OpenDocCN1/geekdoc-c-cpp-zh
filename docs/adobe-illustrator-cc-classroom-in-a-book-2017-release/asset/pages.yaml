  md: '# Note


    To learn more about creating slices, search for “Create slices” in Adobe Illustrator
    Help (Help) > Illustrator Help).


    # Slicing content


    In the past, before the Export box command or the Asset Export panel, you needed
    to isolate artwork you wanted to export. This was done by placing the artwork
    on its own artboard or by slicing the content. In Illustrator, you can create
    slices to define the boundaries of different web elements in your artwork. When
    you save the artwork using the File > Export > Save For Web (Legacy) command,
    you can choose to save each slice as an independent file with its own format and
    settings.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_717_0.png)


    It is not necessary to isolate artwork by slicing when using the File > Export
    > For Screens command or Asset Export panel since artwork is isolated automatically.


    # Exporting artboards


    In this section, you’ll see how to export artboards in your document. This could
    be useful if you want to show someone a design you are working on or to capture
    a design for use in a presentation, website, app, or other.


    +   1 Choose View > Fit Artboard In Window.


    +   2 Choose File > Export > Export For Screens.

    In the Export For Screens dialog box that appears, you can choose between exporting
    artboards and exporting assets. Once you decide what to export, you can set export
    settings on the right side of the dialog box.


    +   3 With the Artboards tab selected, on the right side of the dialog box, ensure
    that All is selected.'
  merge: -1
