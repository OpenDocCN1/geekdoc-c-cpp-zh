    # Working with drawing modes


    Illustrator has three different drawing modes available that are found at the
    bottom of the Tools panel: Draw Normal, Draw Behind, and Draw Inside. Drawing
    modes allow you to draw shapes in different ways. The three drawing modes are
    as follows:


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_165_6.png)


    > Note


    Learn more about clipping masks, see Lesson 14, “Using Illustrator CC with Other
    Adobe Applications.”


    +   * Draw Normal mode: You start every document by drawing shapes in Normal mode,
    which stacks shapes on top of each other.'
