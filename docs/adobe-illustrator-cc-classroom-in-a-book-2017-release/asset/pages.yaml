    # Applying color to an image


    In Illustrator, you can convert images to a different color mode (such as RGB,
    CMYK, or grayscale) or adjust individual color values. You can also saturate (darken)
    or desaturate (lighten) colors or invert colors (create a color negative).


    In order to edit colors in the image, the image needs to be embedded in the Illustrator
    file. If the file is linked, you can edit the color of the image in a program
    like Photoshop and then update it in Illustrator.


    +   1 In the Layers panel, click the eye icons (👁️) in the visibility column for
    the Pictures and Text layers to hide their contents.


    +   2 With the Selection tool (↗️), click to select the Lilypads.psd image at
    the top of the artboard.


    +   3 Choose Edit > Edit Colors > Adjust Color Balance.


    +   4 In the Adjust Colors dialog box, drag the sliders or enter values for the
    CMYK percentages to change the colors in the image. You can press Tab to move
    between the text fields. I used the following values:


    +   • C= 5

    • M=–25

    • Y= 10

    • K= 0'
