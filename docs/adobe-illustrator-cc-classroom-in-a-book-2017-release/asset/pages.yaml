    # Creating text outlines


    Converting text to outlines means converting text into vector shapes that you
    can edit and manipulate as you would any other graphic object. Text outlines are
    useful for changing the look of large display type, but they are rarely useful
    for body text or other type at small sizes. The file recipient doesn''t need to
    have your fonts installed to open and view the file correctly if you convert all
    to outlines.


    When you create outlines from text, you should consider that text is no longer
    editable. Bitmap fonts and outline-protected fonts cannot be converted to outlines,
    and outlining text that is less than 10 points in size is not recommended. When
    type is converted to outlines, the type loses its hints—instructions built into
    outline fonts to adjust their shape to display or print optimally at many sizes.
    You must also convert all type in a selection to outlines; you cannot convert
    a single letter within a type object.


    Next, you will convert the main heading to outlines and position content.


    Note

    The original text is still there; it''s hidden. This way, you can always choose
    Object > Show All to see the original text if you need to make changes.


    +   1 Choose View > Fit Artboard In Window.'
