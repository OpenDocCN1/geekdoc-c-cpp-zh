    # Exporting individual assets


    You can also quickly and easily export individual assets in file formats such
    as JPG, GIF, PNG, and SVG using the Asset Export panel. The Asset Export panel
    lets you collect assets that you might export frequently and can be a great tool
    for web and mobile workflows because it allows for the export of multiple assets
    with a single click.


    > NotenThere are several methods for exporting artwork in a variety of formats.
    You can select artwork in your Illustrator document and choose File > Export Selection.
    This adds the selected artwork to the Asset Export panel and opens the Export
    For Screens dialog box. You can choose from the same formats you saw in the previous
    section.


    In this section, you will open the Asset Export panel and see how to collect artwork
    in the panel and use it to export that collected artwork.


