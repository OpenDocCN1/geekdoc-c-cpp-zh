    # Using Bristle brushes


    Bristle brushes allow you to create strokes with the appearance of a natural brush
    with bristles. Painting with a Bristle brush, using the Paintbrush tool, creates
    vector paths with the Bristle brush applied.


    In this section, you’ll start by adjusting options for a brush to change how it
    appears in the artwork, and then paint with the Paintbrush tool and a Bristle
    brush to create smoke.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_533_0.png)


