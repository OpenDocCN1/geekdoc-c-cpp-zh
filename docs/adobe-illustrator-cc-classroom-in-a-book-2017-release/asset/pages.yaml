  md: '# Zooming and panning with the Navigator panel


    The Navigator panel is another way to navigate a document with a single artboard
    or multiple artboards. This is useful when you need to see all artboards in the
    document in one window and to edit content in any of those artboards in a zoomed-in
    view. You can open the Navigator panel by choosing Window > Navigator. It is in
    a free-floating group in the workspace.


    The Navigator panel can be used in several ways, including:


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_91_0.png)


    +   * The red box in the Navigator panel, called the proxy view area, indicates
    the area of the document that is being shown.


    +   * Type in a zoom level or click the mountain icons to change the magnification
    of your artwork.


    +   * Position the pointer inside the proxy view area of the Navigator panel.
    When the pointer becomes a hand (∮), drag to pan to different parts of the artwork.


    # Navigating artboards


    Artboards represent the regions that can contain printable artwork (similar to
    pages in a program like Adobe InDesign). You can use artboards to create areas
    for printing or placement purposes. Multiple artboards are useful for creating
    a variety of things, such as multipage PDFs, printed pages with different sizes
    or different elements, independent elements for websites, storyboards, or individual
    items for animation in Adobe Flash® or After Effects. You can easily share content
    among designs, create multipage PDFs, and print multiple pages by creating more
    than one artboard.


    Illustrator allows for up to 100 artboards within a single file (depending on
    their size). Multiple artboards can be added when you initially create an Illustrator
    document, or you can add, remove, and edit artboards after the document is created.
    Next, you will learn how to efficiently navigate a document that contains multiple
    artboards.


    +   * Note


    If a "Search Adobe Stock" message appears in the upper-right corner of the application
    window, click Close to close it.


    +   1 Choose File > Open. In the Open dialog box, navigate to the Lessons > Lesson01
    folder, and select the L1_start2.ai file on your hard disk. Click Open to open
    the file.'
