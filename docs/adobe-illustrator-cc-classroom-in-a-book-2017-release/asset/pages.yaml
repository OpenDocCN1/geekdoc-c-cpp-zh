    # Using the Draw Inside mode


    Next, you will learn how to add artwork inside of a selected shape using the Draw
    Inside mode. This can be useful if you want to hide (mask) part of the artwork.


    Note


    If the Tools panel you see is displayed as a single column, you can click the
    Drawing Modes button at the bottom of the Tools panel and choose Draw Inside from
    the menu that appears.


    +   1 Select the Selection tool in the Tools panel. Click to select the blue circle.


    +   2 Click the Draw Inside button, near the bottom of the Tools panel.


    This button is active when a single object is selected (path, compound path, or
    text), and it allows you to draw within the selected object only. Notice that
    the circle has a dotted open rectangle around it, indicating that, if you draw,
    paste, or place content, it will be inside the circle, even if you were to choose
    Select > Deselect.


    +   3 Choose Select > Deselect.


    The circle still has the dotted open rectangle around it, indicating that Draw
    Inside mode is still active. The shape you are about to draw inside does not need
    to be selected.


    +   4 Click and hold down the mouse button on the Rectangle tool in the Tools
    panel, and select the Ellipse tool. Press the D key to set the default fill color
    (white) and stroke color (black). Click and drag to create an ellipse that overlaps
    the blue circle. See the second part of the following figure.


