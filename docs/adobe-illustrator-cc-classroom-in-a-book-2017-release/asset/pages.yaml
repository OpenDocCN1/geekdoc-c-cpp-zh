- img_proc: true
  md: '# Review answers


    +   1 There are six shape tools: Rectangle, Rounded Rectangle, Ellipse, Polygon,
    Star, and Flare. As explained in Lesson 1, “Getting to Know the Work Area,” to
    tear off a group of tools from the Tools panel, position the pointer over the
    tool that appears in the Tools panel, and hold down the mouse button until the
    group of tools appears. Without releasing the mouse button, drag to the triangle
    on the right side of the group, and then release the mouse button to tear the
    group.


    +   2 After you draw a rectangle, rounded rectangle, ellipse, or polygon using
    the shape tool, you can continue to modify its properties such as width, height,
    rounded corners, types, and radii (individively or collectively). This is what
    is known as a Live Shape. The shape properties such as corner radius are editable
    later in the Transform panel, in the Control panel, or directly on the art.


    +   3 Items that have no fill can be selected by clicking the stroke or by dragging
    a selection marquee across the item.


    +   4 Another way to draw and edit shapes in Illustrator involves the Shaper tool.
    The Shaper tool recognizes natural gestures and produces Live Shapes from those
    gestures. Without switching tools, you can transform individual shapes you create
    and even perform operations such as punch and combine.


    +   5 You can convert a raster image to editable vector shapes by tracing it.
    To convert the tracing to paths, click Expand in the Control panel or choose Object
    > Image Trace > Expand. Use this method if you want to work with the components
    of the traced artwork as individual objects. The resulting paths are grouped.'
