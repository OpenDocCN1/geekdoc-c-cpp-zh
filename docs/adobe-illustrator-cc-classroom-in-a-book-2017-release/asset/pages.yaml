    # Restoring default preferences


    The preferences file controls how command settings appear on your screen when
    you open the Adobe Illustrator program. Each time you quit Adobe Illustrator,
    the position of the panels and certain command settings are recorded in different
    preference files. If you want to restore the tools and settings to their original
    default settings, you can delete the Adobe CC preference files. Adobe Illustrator
    creates a new preference file, if one doesn''t already exist, the next time you
    start the program and save a file.

    You must restore the default preferences for Illustrator before you begin each
    lesson. This ensures the tools and panels function as described in this book.
    When you have finished the book, you can restore your saved settings, if you like.


    > Note

    If finding the preferences file proves difficult, contact me at brian@brianwoodtraining.com
    for assistance.


    # To delete or save the current Illustrator preferences file


    The preferences file is created after you quit the program the first time and
    is updated thereafter. After launching Illustrator, you can follow these steps.


    +   1 Exit Adobe Illustrator.

    2 Locate the Adobe Illustrator Prefs file for Mac OS as follows:

    • The Adobe Illustrator Prefs file is located in the folder [startup drive]/Users/[username]/Library/Preferences/Adobe
    Illustrator 21 Settings/en_US**.


    > Note

    In Windows, the AppData folder is hidden by default. You will most likely need
    to enable Windows to show hidden files and folders. For instructions, refer to
    your Windows documentation.


    +   3 Locate the Adobe Illustrator Prefs file for Windows as follows:

    • The AIPrefs pref file is located in the folder [startup drive]/Users\[username]\AppData\Roaming\Adobe\Adobe
    Illustrator 21 Settings\en_US**\x86 or x64.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'On Mac OS, the Library folder is hidden. To access this folder, in the Finder,
    hold down the Option key, and choose Library from the Go menu.

    **Folder name may differ depending on the language version you have installed.


    For more information, refer to Illustrator help: https://helpx.adobe.com/illustrator/kb/preference-file-location-illustrator.html


    If you can''t find the file, either you haven''t started Adobe Illustrator CC
    or you have moved the preferences file. The preferences file is created after
    you quit the program the first time and is updated thereafter.


    +   4 Copy the file and save it to another folder on your hard disk (if you want
    to restore those preferences) or delete it.


    +   5 Start Adobe Illustrator CC.


    Tip

    To quickly locate and delete the Adobe Illustrator preferences file each time
    you begin a new lesson, create a shortcut (Windows) or an alias (Mac OS) to the
    Adobe Illustrator 21 Settings folder.


    # To restore saved preferences after completing the lessons


    +   1 Exit Adobe Illustrator CC.

    2 Delete the current preferences file. Find the original preferences file that
    you saved and move it to the Adobe Illustrator 21 Settings folder.


    Note

    You can move the original preferences file rather than renaming it.


    # Additional resources


    Adobe Illustrator CC Classroom in a Book (2017 release) is not meant to replace
    documentation that comes with the program or to be a comprehensive reference for
    every feature. Only the commands and options used in the lessons are explained
    in this book. For comprehensive information about program features and tutorials,
    please refer to these resources:


    Adobe Illustrator Learn & Support: helpx.adobe.com/illustrator.html (accessible
    in Illustrator by choosing Help > Illustrator Support Center) is where you can
    find and browse tutorials, help, and support on Adobe.com.


    Adobe Forums: forums.adobe.com lets you tap into peer-to-peer discussions, questions,
    and answers on Adobe products.


    Adobe Create Magazine: create.adobe.com offers helpful articles on design and
