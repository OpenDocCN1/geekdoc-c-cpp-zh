    # Working with the perspective grid


    In Illustrator, using the Perspective tool (⇧) and the Perspective Selection tool
    (ϒ) can easily draw or render artwork in perspective. You can define the perspective
    grid in one-point, or three-point perspective; define a scale; move the grid planes;
    and draw objects directly in perspective. You can even attach flat onto the grid
    planes by dragging with the Perspective Selection tool.


    In this section, you will create perspective artwork for the T-shirt.


    +   1 Choose 1 Perspective from the Artboard menu in the lower-left corner of
    the Document window.


    +   2 Choose View > Fit Artboard In Window. Choose View > Zoom Out once.


    +   3 Select the Perspective tool (⇧) in the Tools panel.


    The default two-point perspective grid (which is nonprinting) appears on the artboard
    and can be used to draw and snap content in perspective. The two-point grid (for
    short) is composed of several planes or surfaces, by default—left (blue), right
    (orange), and ground plane (green).


    The following figure shows the default perspective grid by itself, with all of
    its options showing (you won’t see the ruler, for instance, by default). It may
    be helpful to refer to this figure as you progress through the lesson.'
