    > Essentials before choosing Window > Workspace > Reset Essentials.


    5 Choose View > Fit Artboard In Window.


    # Note


    If the Libraries panel is in your workspace and covering part of the document,
    you can choose Window > Libraries to hide it.


    This fits the active artboard into the Document window so that you can see the
    entire artboard. As you’ll soon learn, an artboard is the area that contains your
    printable artwork and is similar to a page in Adobe InDesign.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_65_0.png)


    When the file is open and Illustrator is fully launched, the Application bar,
    menus, Tools panel, Control panel, and panel groups appear on the screen. Docked
    on the right side of the screen, you will see that most of the default panels
    appear as icons by default. Illustrator also consolidates many of your most frequently
    accessed options in the Control panel below the menu bar. This lets you with fewer
    visible panels and gives you a larger area in which to work.


    You will use the L1_startLai file to practice navigating, zooming, and investigating
    an Illustrator document and the workspace.'
