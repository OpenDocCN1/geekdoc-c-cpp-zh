  md: '# 1. Getting to Know the Work Area


    Lesson overview

    In this lesson, you’ll explore the workspace and learn how to do the following:


    +   - Open an Adobe Illustrator CC file.

    - Work with the Tools panel.

    - Work with panels.

    - Reset and save your workspace.

    - Use viewing options to change the display magnification.

    - Navigate multiple artboards and documents.

    - Explore document groups.

    - Find resources for using Illustrator.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_62_0.png)


    This lesson takes approximately 45 minutes to complete.

    Please log into your account on peachpit.com to download the lesson files for
    this chapter, or go to the “Getting Started” section at the beginning of this
    book and follow the instructions under “Accessing the Lesson Files and Web Edition.”

    Your Account page is also where you’ll find any updates to the chapters or to
    the lesson files. Look on the Lesson & Update Files tab to access the most current
    content.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_63_0.png)


    To make the most of the extensive drawing, painting, and editing capabilities
    of Adobe Illustrator CC, it''s important to learn how to navigate the workspace.
    The workspace consists of the Application bar, menus, Tools panel, Control panel,
    Document window, and the default set of panels.


    # Introducing Adobe Illustrator


    In Illustrator, you primarily create and work with vector graphics (sometimes
    called vector shapes or vector objects). Vector graphics are made up of lines
    and curves defined by mathematical objects vectors. You can freely move or modify
    vector graphics without losing detail or clarity because they are resolution-independent.
    In other words, vector graphics maintain crisp edges when they are resized, printed
    to a PostScript printer, saved in a PDF file, or imported into a vector-based
    graphics application. As a result, vector graphics are the best choice for artwork,
    such as logos, that will be used at various sizes and in various media.


    +   * Tip

    To learn more about bitmap graphics, search for “Importing bitmap images” in Illustrator
    Help (Help > Illustrator Help).'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Illustrator also allows you to incorporate bitmap images—technically called
    raster images—that use a rectangular grid of picture elements (pixels) to represent
    the visual. Each pixel is assigned a specific location and color value. Raster
    images can be created in a program Adobe Photoshop®.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_64_0.png)


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_64_1.png)


    A logo drawn as vector art


    A logo as a raster image


    # Starting Illustrator and opening a file


    To start working in Illustrator, in this first lesson you''ll explore Illustrator.
    You''ll open a few art files during this lesson, but before you begin, you''ll
    restore the default preferences for Adobe Illustrator CC. This is something you
    will do at the start of each lesson in this book to ensure the tools and panels
    function exactly as described in this lesson.


    > Note

    If you have not already downloaded the project files for this lesson to your computer
    from your Account page, make sure to do so now. See the “Getting Started” section
    at the beginning of the.


    +   1 To delete or deactivate (by renaming) the Adobe Illustrator CC preferences
    file, see “Restoring default preferences” in the “Getting Started” section at
    the beginning of the book.

    2 Double-click the Adobe Illustrator CC icon to start Adobe Illustrator.

    With Illustrator open, you will most likely see a “start” screen showing a list
    of files you''ve opened and other resources for Illustrator.

    3 Choose File > Open or click the Button in the Start screen. In the Lessons >
    Lesson01 folder on your hard disk, the L1_start.ai file, and click Open.

    This lesson contains a fictitious business name, address, and website address
    made for the purposes of the project.

    4 Choose Window > Workspace > Reset Essentials.

    This command ensures that the workspace, which includes all of the tools and panels,
    is set to the default settings.'
  merge: -1
