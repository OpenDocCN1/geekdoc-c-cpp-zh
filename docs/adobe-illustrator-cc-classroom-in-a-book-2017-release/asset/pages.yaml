  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_434_0.png)


    # # Editing layers and objects


    By rearranging the layers in the Layers panel, you can change the stacking order
    of objects in your artwork. On an artboard, objects in layers that are higher
    in the Layers panel list are in front of objects located on layers lower in the
    list, and each layer has its own stacking order as well. Layers are useful for
    a variety of reasons, including the ability to move objects between layers and
    sublayers to organize and more easily select your artwork.


    # # Locating layers


    When working in artwork, there may be times when you select content on the artboard
    and want to locate that same content in the Layers panel. This can help you to
    determine how content is organized.


