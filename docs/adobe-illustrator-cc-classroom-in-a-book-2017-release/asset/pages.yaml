  md: '1 Click the Next Artboard button (回) in the lower-left corner of the Document
    window.

    2 Select the Zoom tool (Q), and click a few times near the top of the art.

    3 Click and hold the mouse button on the Ellipse tool (O) in the Tools panel,
    and select the Polygon tool (◯).

    4 Choose View > Smart Guides to turn them off.


    So far, you''ve been working in the default Preview mode, which lets you see how
    objects are painted with fill and stroke colors. If paint attributes seem distracting,
    you can also work in Outline mode, which is what you''ll do next.


    5 Press the D key to apply the default fill of white and stroke of black.


    # Note


    Outline mode temporarily removes all paint attributes, as colored fills and strokes,
    to speed up selecting and redrawing artwork. You can''t select or drag shapes
    by clicking in the middle of a shape, because the fill temporarily disappears.


    +   6 Choose View > Outline to switch to Outline mode.

    7 Position the pointer in a blank area of the artboard. Drag to the right to begin
    drawing a polygon, but don''t release the mouse button. Press the Down Arrow key
    once to reduce the number of sides on the polygon to five, and don''t release
    the mouse button. Hold the Shift key to straighten the shape.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_149_0.png)


    Notice that you cannot see the gray measurement label (the tooltip) since the
    tooltip is part of the Smart Guides that you turned off. The magenta alignment
    guides are also not showing the shape is not snapping to other content on the
    artboard. Smart Guides can be useful in certain situations, such as when precision
    is necessary, and can be toggled off and on when needed.


    # Editing a polygon


    Polygons are also Live Shapes, which means attributes like size, rotation, number
    of sides, and are all more editable. Next, you''ll resize and edit the polygon
