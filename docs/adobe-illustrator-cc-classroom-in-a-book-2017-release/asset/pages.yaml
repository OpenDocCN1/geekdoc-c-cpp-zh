  md: '# The Bristle brush and graphic tablets


    When you use Bristle brush with a graphic tablet, Illustrator interactively tracks
    the movements of the stylus over the tablet. It interprets all aspects of its
    orientation and pressure input at any point along a drawing path. Illustrator
    provides the output that is modeled on the stylus''s x-axis position, y-axis position,
    pressure, tilt, bearing, and rotation.


    —From Illustrator Help


    # Using Pattern brushes


    Pattern brushes paint a pattern made up of separate sections, or tiles. When you
    apply a Pattern brush to artwork, different tiles of the pattern are applied to
    different sections of the path, depending on where the section falls on the path—the
    end, middle, or corner. There are hundreds of interesting Pattern brushes that
    you can choose from when creating your own projects, from grass to cityscapes.
    Next, you''ll apply an existing Pattern brush to a path to create


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_539_0.png)


    Pattern brush examples


    +   1 Choose View > Fit Artboard In Window.


    > Tip


    Just like other brush types, there is a series of default Pattern brush libraries
    that come with Illustrator. To access them, click the Brush Libraries Menu button
    (icon), and choose a library from one of the menus (the Decorative menu, for example).


    +   2 In the Brushes panel, click the brush panel icon (icon), choose Show Pattern
    Brushes, and then deselect Show Bristle Brushes. The Windows brush that appears
    in the Brushes panel is a brush that I created and saved with the file.

    Next, you''ll apply a Pattern brush, and edit its properties.


    +   3 With the Selection tool (icon) selected, Shift-click the two black paths
    on the orange shape of the ship to select them both.


    +   4 Choose the Windows Pattern brush from the Brush Definition menu in the Control
    panel or the Brushes panel to apply the Pattern brush.'
