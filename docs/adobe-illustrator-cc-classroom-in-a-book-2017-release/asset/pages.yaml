  md: '# Drawing a curve with the Pen tool


    In this part of the lesson, you''ll use what you just learned about drawing curves
    to trace a

    curved shape with the Pen tool.


    +   1 Press the spacebar to temporarily select the Hand tool (Ψ), and drag down
    until you see

    the curve at the top of the current artboard (on Artboard 3).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_269_0.png)


    Note The artboard may scroll as you drag. If you lose visibility of the curve,
    choose View>

    Zoom Out until you see the curve and anchor point. Pressing the spacebar allows
    you

    to use the Hand tool to reposition the artwork.


    +   2 With the Pen tool (✎) selected, click and drag from the point labeled 1,
    up to the red

    dot, and then release the mouse button.


    This creates a direction line going in the same general direction as the path.
    Up to this

    point, you''ve started your paths by simply clicking to create an anchor point,
    not

    dragging, like you did in this step. To create a more “curved” path, drawing out

    direction lines on the very first anchor point can be helpful.


    Note Pulling the direction handle longer makes a steeper curve; when the direction
    handle is

    shorter, the curve is flatter.


    +   3 Click point 2 and drag down. Release the mouse button when the pointer reaches
    the red

    dot and the path you are creating follows the gray arc.'
