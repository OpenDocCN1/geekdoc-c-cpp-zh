    # Arranging multiple documents


    There will be times you open more than one Illustrator document at a time. When
    you open more than one document, the Document windows are tagged. You can arrange
    the open documents in other ways, such as side by side, so that you can easily
    compare or drag items from one document to another. You can also use the Arrange
    windows to quickly display your open documents in a variety of configurations.


    You should currently have two Illustrator files open: L1_start1.ai and L1_start2.ai.
    Each file has its own tab at the top of the Document window. These documents are
    considered a group of Document windows. You can create document groups to loosely
    associate files while they are open.


