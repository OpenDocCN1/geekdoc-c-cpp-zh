  md: '# A Quick Tour of Adobe Illustrator CC (2017 release)


    # Lesson overview


    In this interactive demonstration of Adobe Illustrator CC (2017 release), you’ll
    get an overview of the main features of the application.


    This lesson takes approximately 45 minutes to complete.


    Please log into your account on peachpit.com to download the lesson files for
    this chapter, or go to the "Getting Started" section at the beginning of this
    book and follow the instructions under "Accessing the Lesson Files and Web Edition."


    Your Account page is also where you’ll find any updates to the chapters or to
    the lesson files. Look on the Lesson & Update Tabs to access the most current
    content.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_25_0.png)


    In this demonstration of Adobe Illustrator CC, you will be introduced to some
    fundamentals for working in the application.


    # Getting started


    For the first lesson of this book, you’ll get a quick tour of the most widely
    used tools and features in Adobe Illustrator CC, offering a sense of the many
    possibilities. Along the way, you’ll create artwork for a bakery. First, you’ll
    open the final artwork to see what you create in this lesson.'
