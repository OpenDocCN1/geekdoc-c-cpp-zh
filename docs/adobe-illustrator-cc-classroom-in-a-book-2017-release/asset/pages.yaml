    panel. The brush is applied to the selected path.


    +   2 An Art brush is made from artwork (vector or embedded raster). When you
    apply an Art brush by the stroke of an object, the artwork in the Art brush, by
    default, is stretched along the selected stroke.


    +   3 To edit a path with the Paintbrush tool, drag over a selected path to redraw.
    The Keep Selected option keeps the last path as you draw with the Paintbrush tool.
    Leave the Keep Selected option selected when you want to easily edit the previous
    path as you draw. Deselect the Keep Selected option when you want to draw layered
    paths with the paintbrush without altering previous paths. Use the Selection tool
    Path to select a path, and then edit it.


    +   4 In order to be used in certain brushes (Art, Pattern, and Scatter), a raster
    image must be embedded.


    +   5 For Art (and Scatter) brushes, you need to have artwork selected in order
    to create a brush using the New Brush button 🖌️ in the Brushes panel.


