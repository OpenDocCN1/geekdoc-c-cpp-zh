    learn how to transform content in other ways (scale, rotate, etc.), using a variety
    of methods.


    # # Positioning artwork using the Transform panel


    At times, you may position objects more precisely—either relative to other objects
    or to the board. You can use the alignment options, as you saw in Lesson 2,“Techniques
    for Selecting Artwork,” but you can also use Smart Guides and the Transform panel
    to move objects to extract coordinates on the x- and y-axes and to control the
    position of objects in relation to the edge of the board.


