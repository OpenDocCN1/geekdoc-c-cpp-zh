  md: 'The GreenIsle Report (.txt) contains information about the document contents.

    5 Return to Illustrator, and choose File > Close.


    # Review questions


    +   1 Describe the difference between linking and embedding in Illustrator.

    2 What kinds of objects can be used as masks?

    3 How do you create an opacity mask for a placed image?

    4 What color modifications can you apply to a selected object using effects?

    5 Describe how to replace a placed image with another image in a document.

    6 Describe what packaging does.


    # Review answers


    +   1 A linked file is a separate, external file connected to the Illustrator
    file by a link. A linked file does not add significantly to the size of the Illustrator
    file. The linked file must accompany the Illustrator file to preserve the link
    and to ensure that the placed file appears when you open the Illustrator file.
    An embedded file is included in the Illustrator file. The Illustrator file size
    reflects the addition of the embedded file. Because the embedded file is part
    of the file, no link can be broken. You can update linked and embedded files using
    the Relink button in the Links panel.

    2 A mask can be a simple or compound path, and masks (such as an opacity mask)
    may be imported with placed Photoshop files. You can also create layer clipping
    masks with any shape that is the topmost object of a group or layer.

    3 You create an opacity mask by placing the object to be used as a mask on top
    of the object to be masked. Then you select the mask and the object(s) to be masked,
    and either click the Make Mask button in the Transparency panel or choose Make
    Opacity Mask from the Transparency panel menu.

    4 You can use effects to change the color mode (RGB, CMYK, or grayscale) or to
    adjust individual colors in a selected object. You can also saturate or desaturate
    colors or invert colors in a selected object. You can apply color modifications
    to placed images, as well as to artwork created in Illustrator.

    5 To replace a placed image with a different image, select the image in the Links
    panel. Then click the Relink button, and locate and select the replacement image.
    Click Place.

    6 Packaging is used to gather all the necessary pieces for an Illustrator document.
    Packaging creates a copy of the Illustrator file, the linked images, and the necessary
    fonts (if desired), and it gathers the copies into a folder.'
  merge: -1
