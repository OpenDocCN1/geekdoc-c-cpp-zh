  md: '# # Tip


    Another way to thread text between objects is to select an area type object, select
    the object (or objects) you want to link to, and then choose Type > Threaded Text
    > Create.


    With the second type object selected, the line connecting the two type objects.
    This line is the thread that tells you that the two objects are connected. If
    you don''t see this thread (line), choose View > Show Text Threads.


    The out port ( ) of the type object that is the first (left) column on the artboard
    and the in port ( ) of the type object that is the second (right) column on the
    artboard have small arrows in them indicating how the text is flowing from one
    to the other. If you delete the second type object, the text is pulled back into
    the original object as overflow text. Although not visible, the overflow text
    is not deleted.


