  md: '# Contributors


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_774_0.png)


    **Brian Wood** is a web developer and the author of twelve training books (Adobe
    Illustrator, Adobe InDesign, Adobe Muse, and Adobe DPS), as well as numerous training
    videos on Dreamweaver & CSS, InDesign, Illustrator, Acrobat, Adobe Muse and others.
    In addition to training many clients large and small, Brian speaks regularly at
    national conferences, such as Adobe MAX and the HOW conference, as well as events
    hosted by AIGA and other industry organizations. To learn more, check out www.youtube.com/askbrianwood
    or visit www.brianwoodtraining.com.'
