  md: '# Modifying a Live Paint group


    When you make a Live Paint group, each path remains editable. When you move or
    adjust a path, the colors that were previously applied don''t just stay where
    they were, like they do in natural media paintings or with image-editing software.
    Instead, the colors are automatically reapplied to the new regions that are formed
    by the intersecting paths. Next, you will edit paths in a Live Paint group.


    +   1 Select the Selection tool (↗), and drag across the gray rectangle and brown
    handle at the bottom of the ''. See the first part of the following figure.

    2 Choose Object > Live Paint > Make.

    3 Drag the selected group straight up so that it overlaps the white rectangle
    above it.

    4 With the Selection tool, Shift-click the white rectangle to select both objects.

    5 Click the Merge Live Paint button in the Control panel to add the new white
    shape to the Live Paint group.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_356_0.png)


    +   6 Select the Live Paint Bucket tool (⚃) in the Tools panel. In the Swatches
    panel (田), click to select a lighter gray color. Click to paint the top part of
    the paintbrush. Click to select a darker gray color in the Swatches panel and
    click the overlapping area.

    7 Select the Selection tool, and with the Live Paint object selected, double-click
    the Live Paint object to enter Isolation mode.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_356_1.png)


    > **Tip**

    You could also edit the anchor points of the selected artwork using the Direct
    Selection tool (↗), for instance. The paths are still editable, and the colors
    are reapplied to the new regions that are formed by edited paths.'
