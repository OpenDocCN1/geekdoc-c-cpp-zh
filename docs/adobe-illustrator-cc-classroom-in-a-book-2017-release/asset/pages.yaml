    # Outlining strokes


    Paths, like a line, can show a stroke color but not a fill color by default. If
    you create a line in Illustrator and want to apply both a stroke and a fill, you
    can outline the stroke, which converts the line into a closed shape (or compound
    path). Next, you''ll outline the stroke of the blue line you edited with the Width
    tool.


    ▶ Tip

    After outlining the stroke, the shape you may have been composed of a lot of anchor
    points. You can choose Object > Path > Simplify to try and simplify the path,
    which usually means fewer anchor points.


