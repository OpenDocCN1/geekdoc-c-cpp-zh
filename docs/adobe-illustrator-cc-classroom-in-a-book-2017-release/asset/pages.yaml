- img_proc: true
  md: '# Review answers


    +   1 The benefits of using layers when creating artwork include organizing content,
    selecting content more easily, protecting artwork that you don''t want to change,
    hiding artwork that you aren''t working with so that it''s not distracting, and
    controlling what prints.


    +   2 You reorder layers by selecting a layer name in the Layers panel and dragging
    the layer to its new location. The order of layers in the Layers panel controls
    the document''s layer order—topmost in the panel is frontmost in the artwork.


    +   3 The color for a layer controls how selected anchor points and direction
