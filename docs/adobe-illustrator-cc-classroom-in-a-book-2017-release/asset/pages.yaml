    # Review questions


    +   1 What is a gradient?

    2 How do you adjust the blend between colors in a gradient?

    3 Name two ways you can add colors to a gradient.

    4 How can you adjust the direction of a gradient?

    5 What is the difference between a gradient and a blend?

    6 When you save a pattern in Illustrator, where is it saved?


    # Review answers


    +   1 A gradient is a graduated blend of two or more colors or tints of the same
    color.

    Gradients can be applied to the stroke or fill of an object.

    2 To adjust the blend between colors in a gradient, with the Gradient tool selected
    and with the pointer over the gradient annotator or in the Gradient panel, you
    can drag the diamond icons or the color stops of the gradient slider.

    3 To add colors to a gradient, in the Gradient panel, click beneath the gradient
    slider to'
  merge: -1
  pgno: 511
- img_proc: true
  md: 'add a gradient stop to the gradient. Then, double-click the color stop to edit
    the color, using the panel that appears to mix a new color or to apply an existing
    color swatch. You can select the Gradient tool in the new Tools panel, position
    the pointer over the gradient-filled object, and then click beneath the gradient
    slider that appears in the artwork to add a color stop.


    +   4 Drag with the Gradient tool to adjust the direction of a gradient. Dragging
    a long distance changes colors gradually; dragging a short distance makes the
    color more abrupt. You can also rotate the gradient using the Gradient tool and
    change the radius, aspect ratio, starting point, and more.


    +   5 The difference between a gradient and a blend is the way that colors combine
    together—colors blend together within a gradient and between objects in a blend.


    +   6 When you save a pattern in Illustrator, it is saved as a swatch in the Swatches
    panel. By default, swatches are saved with the current document open.'
