  md: '+   Choose Edit > Undo Scale, and then choose View > Fit Artboard In Window.


    # Adding area type


    Area type uses the boundaries of an object (like a rectangle) to control the flow
    of characters, either horizontally or vertically. When the text reaches a boundary,
    it automatically wraps to fit the defined area. Entering text in this way is useful
    when you want to create one or more paragraphs, such as for a poster or a brochure.


    To create area type, you click the Type tool (T) where you want the text and drag
    to create an area type object (also called a text area, text object, or type object).
    You can also convert an existing shape or object to a type object by clicking
    the edge of an object (or inside the object) with the Type tool. When the cursor
    appears, you can type. Next, you’ll create a text object and enter more text.


    +   1 Choose 2 CardFront from the Artboard Navigation menu in the lower-left corner
    of the Document window.


    +   2 Select the Type tool (T). Position the pointer roughly in the middle of
    the artboard. Click and drag down and to the right to create a text area with
    a width and height of 1 inch.


    By default, text objects are filled with selected placeholder text that you can
    replace with your own.


    Tip

    Filling text objects with text is a preference you can change. Choose Illustrator
    > Preferences (Mac OS) or Edit > Preferences (Windows), select the Type category,
    and deselect “Fill New Type Objects With Placeholder Text” to turn the option
    off.'
