  md: '# Production Notes


    The Adobe Illustrator CC Classroom in a Book (2017 release) was created electronically
    using Adobe InDesign CC 2015. Art was produced using Adobe InDesign CC, Adobe
    Illustrator CC, and Adobe Photoshop CC.


    References to company names, websites, or addresses in the lessons are for demonstration
    purposes only and are not intended to refer to any actual organization or person.


    # Images


    Photographic images and illustrations are intended for use with the tutorials.


    # Typefaces used


    Adobe Myriad Pro and Adobe Warn Pro are used throughout this book. For more information
    about OpenType and Adobe fonts, visit www.adobe.com/type/opentype/.


