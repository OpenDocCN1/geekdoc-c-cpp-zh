- img_proc: true
  md: '# Review answers


    +   1 You can choose commands from the View menu to zoom in or out of a document
    or to fit it to your screen; you can also use the Zoom tool (🔍) in the Tools panel
    and click or drag over a document to enlarge or reduce the view. In addition,
    you can use keyboard shortcuts to magnify or reduce the display of artwork. You
    can also use the Navigator panel to scroll artwork or to change its magnification
    without using the Document window.


    +   2 To select a tool, you can either click the tool in the Tools panel or press
    the keyboard shortcut for that tool. For example, you can press V to select the
    Selection tool (🔘) from the keyboard. Selected tools remain active until you click
    a different tool.


    +   3 You can save panel locations and visibility preferences by choosing Window
    > Workspace > New Workspace to create custom work areas and to make it easier
    to find the controls that you need.


    +   4 To navigate among artboards in Illustrator, you can choose the artboard
    number from the Artboard Navigation menu at the lower-left of the Document window;
    you can use the Artboard Navigation arrows in the lower-left of the Document window
    to go to the first, previous, next, and last artboards; you can use the Artboards
    panel to navigate to artboards; or you can use the Navigator panel to drag the
    proxy view area to navigate between artboards.


    +   5 Arranging Document windows allows you to tile windows or to cascade document
