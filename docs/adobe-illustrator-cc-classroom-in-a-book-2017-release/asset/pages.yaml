  md: '# Editing artboards


    After creating artboards, you can edit or delete artboards at any time using the
    Artboard tool (❐), menu commands, or the Artboard panel. Next, you will reposition
    and change the sizes of the artboards using multiple methods.


    +   1 Press Command+-(Mac OS) or Ctrl+-(Windows) twice to zoom out.


    Note


    When you drag an artboard with content on it, the art moves with the artboard,
    by default. If you want to move an artboard but not the art on it, select the
    Artboard tool (❐), and then click to deselect Move/Copy Artwork With Artboard
    (❐) in the Control panel.


    Tip


    With the Artboard tool (❐) selected, you can press the Shift key to resize an
    artboard proportionally or press the Option (Mac OS) or Alt (Windows) key and
    drag to resize an artboard from its center.


    +   2 With the Artboard tool (❐) still selected, drag Artboard 3 (on the far right)
    to the left of the original artboard (Artboard 1). Make sure not to drag it too
    close to Artboard 1 (the original artboard). We don''t want content that doesn''t
    fit on one artboard to overlap onto another storyboard.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_215_0.png)


    When can reposition artboards at any time and even overlap them, if necessary.


    +   3 With the Artboard tool selected, drag the bottom-center bounding point of
    the artboard you moved, down until the height is 8.5 inches, as shown in the measurement
    label. The bottom will snap to the bottom of the artboard to its right, and a
    magenta alignment (smart) guide will appear.'
