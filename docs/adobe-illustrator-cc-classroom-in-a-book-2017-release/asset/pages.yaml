    # Working with Auto Sizing


    By default, when you create area type by dragging with the Type tool, the type
    area will not resize to fit the text within (similar to how InDesign treats text
    frames by default). If there is too much text, the text that doesn''t fit will
    not be visible and will be considered overset. For each text area, you can enable
    a feature called Auto Sizing so that area type will resize to fit the text within,
    and that''s what you''ll do.'
