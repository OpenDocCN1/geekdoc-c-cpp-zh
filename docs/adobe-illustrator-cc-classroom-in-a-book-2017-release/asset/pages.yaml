    it). That''s because the Document Color Mode is CMYK. To convert selected content
    color to RGB using this method, first choose File > Document Color Mode > RGB
    Color.


    +   2 Choose Edit > Edit Colors > Convert To CMYK.


    Any colors in the selected shapes that had Pantone applied as a spot color are
    now composed of CMYK. Using this method for converting to CMYK does not affect
