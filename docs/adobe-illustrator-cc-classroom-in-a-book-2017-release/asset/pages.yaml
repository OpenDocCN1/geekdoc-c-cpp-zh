  md: '# Editing clipping path (mask)


    In order to edit a clipping path, you need to be able to select it. Illustrator
    offers several ways to do this. Next, you will edit the mask you just created.


    # Tip


    You can also double-click a clip group (object masked with a clipping path) to
    enter Isolation mode. You can then click the masked object (the image in this
    case) to select it or click the edge of the clipping path to select the clipping
    path. After you are finished editing, you can then exit Isolation mode using a
    variety of methods as discussed in previous lessons (like pressing the Escape
    key).


    +   1 With the kayak image still selected on the artboard, click the Edit Contents
    button in the Control panel, in the Layers panel, notice that the <Linked File>
    sublayer in the <Clip Group> is showing the selected-art indicator (small color
    box) to the far right of the sublayer name.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_682_0.png)


    +   2 Click the Edit Clipping Path button in the Control panel, and notice that
    the <Clipping Path> is now selected in the Layers panel (it''s showing the selected-art
    indicator in the Layers panel).


    When an object is masked, you can edit the mask, the object that is masked, or
    both. Use these two buttons to select which to edit. When you first click to select
    an object that is masked, you will edit the mask and the masked object.


    +   3 With the Edit Clipping Path button selected in the Control panel, choose
    View > Outline.


    # Tip


    You can also edit a clipping path with transformation options, like rotate, skew,
    etc., or by using the Direct Selection tool.


    +   4 Use the Selection tool to drag the top-middle bounding point of the selected
    mask down until the measurement label shows a height of approximately 3.25 in.'
