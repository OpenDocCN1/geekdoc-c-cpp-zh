    You can also dock the Control panel by choosing Dock To Top or Dock To Bottom
    from the Control panel menu on the right side of the Control panel.


    Once the Control panel is free-floating, you can drag the dark gray gripper bar
    that appears on the left edge of the Control panel to move it to the top or bottom
    of the workspace.


