  md: '# Cutting with the Scissors tool


    There are several tools that allow you to cut and divide shapes. You''ll start
    with the Scissors tool (✂), which splits a path at an anchor point or on a line
    segment and makes an open path. Next, you''ll cut a shape with the Scissors tool
    to reshape it.


    +   1 Choose View > Fit All In Window.

    2 Choose View > Smart Guides, and ensure that they are on.

    3 Choose Bird 1 from the Artboard Navigation menu in the lower-left corner of
    the Document window. Choose View > Fit Artboard In Window.

    4 Select the Zoom tool (좌) in the Tools panel, and click twice on the red shape
    in the upper-right corner of the artboard to zoom in.

    5 Select the Selection tool (selection) in the Tools panel, and click the red
    shape to select it.

    6 With the shape selected, in the Tools panel, click and hold down the Eraser
    tool (⬭), and select the Scissors tool (✂). Position the pointer over the blue
    anchor point on the path on the left side (see the figure), and when you see the
    word “anchor,” to cut the path at that point.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_182_0.png)


    > Note

    If you click the stroke of a closed shape (a circle, for example) with the Scissors
    tool, it simply cuts the path so that it becomes open (a path with two end points).


    If you don''t click directly on a point or path, you will see a warning dialog
    box. You can simply click OK and try again. Cuts made with the Scissors tool must
    be on a line or a curve rather than an end point of an open path. When you click
    with the Scissors tool, a new anchor point is created and is selected.


    +   7 Choose View > Smart Guides to turn them off.

    8 Select the Direct Selection tool (⏖), and drag the anchor point you just clicked
    to the left.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_183_0.png)


    9 Drag the other anchor point, from where you originally cut the path with the
    scissors, up and to the left (see the figure).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_183_1.png)


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_183_2.png)


    Notice how the stroke (the black border) doesn’t go all the way around the red
    shape. That’s because cutting with the Scissors tool makes an open path. Circles
    and rectangles are examples of closed paths, and lines and “S” shapes are examples
    of open paths (the end points are not connected). If you only want to fill the
    shape with a color, it doesn’t have to be a closed path. Like I’ve said previously,
    an open path can have a color fill. It is, however, necessary for a path to be
    closed if you want a stroke to appear around the entire fill area.


    # Joining paths


    Suppose you draw a “U” shape and later decide want to close the shape, essentially
    joining the ends of the “U” with a straight path. If you select the path, you
    can use the Join command to create a line segment between the end points, closing
    the path. When more than one open path is selected, you can join them to create
    a closed path. You can also join the points of two separate paths. Next, you will
    join the ends of the red path to create a single shape.'
