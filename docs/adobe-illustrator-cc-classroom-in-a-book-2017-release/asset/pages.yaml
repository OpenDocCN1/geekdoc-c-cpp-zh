  md: '# Data recovery


    When you restart Illustrator after a program crash, you have the option of recovering
    work-in-progress files so that your hours of work are not wasted. The recovered
    files are opened with the “[Recovered]” in the filename.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_98_0.png)


    You can turn data recovery on and off as well as set options such as how often
    to save recovery data in the program preferences (Illustrator CC > Preferences
    > File Handling & Clipboard [Mac OS] or Edit > Preferences > File Handling & Clipboard
    [Windows]).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_98_1.png)


    # Review questions


    +   1 Describe two ways to change the view of a document.

    2 How do you select a tool in Illustrator?

