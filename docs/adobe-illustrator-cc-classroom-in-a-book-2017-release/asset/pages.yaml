  md: '# Working with Adobe Bridge


    Adobe Bridge CC is an application available with your Adobe Creative Cloud subscription.
    Bridge provides you with centralized access to all the media assets you need for
    your creative projects.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_666_0.png)


    Bridge simplifies your workflow and keeps you organized. You can batch edit with
    ease, add watermarks, and even set centralized color preferences. You can access
    Adobe Bridge from within Illustrator by choosing File > Browse In Bridge.


    # Combining artwork


    You can combine Illustrator with images from other graphics applications in a
    variety of ways for a wide range of creative results. Sharing artwork among applications
    lets you combine continuous-tone paintings and photographs with vector art. Illustrator
    lets you create types of raster images, and Adobe Photoshop excels at many additional
    image editing tasks. The images edited or created in Photoshop can then be inserted
    into Illustrator.


    +   - Note


    To learn more about working with vector and raster images, see the “Introducing
    Adobe Illustrator” section in Lesson 1, Getting to Know the Work Area."


    This lesson steps you through the process of creating a composite image, including
    combining bitmap images with vector art and working between applications. You
    will add photographic images created in Photoshop to a small poster created in
    Illustrator. Then you''ll'
  merge: -1
  pgno: 666
- img_proc: true
  md: 'adjust the color of an image, mask an image, sample color from an image to
    use in the Illustrator artwork. You''ll update a placed image and then package
    it the file.


    # Placing image files


    You can bring artwork from Photoshop or other applications into Illustrator using
    the Open command, the Place command, the paste command, drag-and-drop operations,
    and the Library panel. Illustrator supports Adobe Photoshop data, including layer
    comps, layers, editable text, and paths. This means that you can transfer files
    between Photoshop and Illustrator without losing the ability to edit the artwork.


    +   * Note

    Illustrator includes support for DeviceN rasters. For instance, if you create
    a Duotone image in Photoshop and place it in Illustrator, it separates properly
    and tints the spot colors.


    When placing files using the File > Place command, no matter what type of image
    file it is (JPG, GIF, PSD, .AI, etc.), it can be either embedded or linked. Embedding
    files stores a copy of the image in the Illustrator file, and the file size increases
    to reflect the addition of the placed file. Linked files remain external files,
    and a link to the external file is placed in the Illustrator file. A linked file
    does not add significantly to the size of the Illustrator file. Linking to files
    can be a great way to ensure image updates are reflected in the Illustrator file.
    The linked file must always accompany the Illustrator file, or the link will break
    and the placed file will not appear in the Illustrator artwork.


    # Placing an image


    First, you will place a JPEG (jpg) image into your document.


    +   1 Click the Layers panel icon to open the Layers panel. In the Layers panel,
    select the layer named "Pictures."


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_667_0.png)


    When you place an image, it is added to the selected layer. The layer already
    includes several shapes you see off the left edge of the artboard.


    +   2 Choose File > Place.'
