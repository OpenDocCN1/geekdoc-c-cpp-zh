    can be seen, and the Layers panel will scroll, if necessary, to reveal the selected
    content. In the Layers panel, you''ll see the selection indicator (�) to the far
    right of the <Group> object (an arrow is pointing to it in the figure), as well
    as the objects in the group.


    +   2 In the Layers panel, double-click the <Group> text, and rename it Description.'
