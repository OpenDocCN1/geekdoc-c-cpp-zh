  md: '+   2 Name two ways to apply an effect to an object.


    +   3 When you apply a Photoshop (raster) effect to vector artwork, what happens
    to the artwork?


    +   4 Where can you access the options for effects applied to an object?


    +   5 What''s the difference between applying a graphic style to a layer versus
    applied it to selected artwork?


    # Review answers


    +   1 To add a second fill or stroke to artwork, click the Add New Stroke button
    ( ) or Add New Fill button ( ) at the bottom of the Appearance panel, or choose
    Add New Stroke/Add New Fill from the Appearance menu. A stroke is added to the
    top of the appearance list. It has the same color and stroke weight as the original.


    +   2 You can apply an effect to an object by selecting the object and then choosing
    the effect from the Effect menu. You can also apply an effect by selecting the
    object, clicking the Add New Effect button ( ) at the bottom of the Appearance
    panel, and then choosing the effect from the menu that appears.


    +   3 Applying a Photoshop effect to artwork generates pixels rather than vector
    data. Photoshop effects include all of the effects in the bottom portion of the
    Effect menu and the Drop Shadow, Inner Glow, Outer Glow, and Feather commands
    in the Effect > Stylize submenu. You can apply them to either vector or bitmap
    objects.


    +   4 You can edit effects applied to selected artwork by clicking the effect
    link in the Appearance panel to access the effect options.


    +   5 When a graphic style is applied to a single object, other objects on that
    layer are not affected. For example, if a triangle object has a Rouhen effect
    applied to its path and you move it to another layer, it retains the Rouhen effect.


    After a graphic style is applied to a layer, everything you add to the layer has
    that style applied to it. For example, if you create a circle on Layer 1 and then
    move circle to Layer 2, which has a Drop Shadow effect applied, the circle adopts
    the effect.'
