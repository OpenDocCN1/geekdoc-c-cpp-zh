    CSS formatting for a style you already have in your HTML editor.


    +   13 Choose Select > Deselect, and then choose File > Save.


    # Working with character styles and CSS code


    Illustrator will create CSS styles based on text formatting, as well. Formatting,
    such as font family, font size, leading (called line-height in CSS), color, kerning
    and tracking (collectively called letter-spacing in CSS), and more, can be captured
    in the CSS code. Any character styles that are applied to text in your design
    are listed in the CSS Properties panel as a CSS style and have the same name as
    the character style. That text has formatting applied, without a character style
    applied, will have a generic CSS style name when Illustrator generates the style.


    > Note

    Currently, paragraph styles are not taken into account when naming styles in the
    CSS code that is generated.


    Next, you will create and apply a character style to text.


    +   1 In the CSS Properties panel, notice the style named [Normal Character Style],
    toward the top of the panel.

    In the CSS Properties panel, only character styles that are applied to text appear.
    The Normal Character Style is applied to text by default, so it appears in the
    CSS Properties panel. If you create character styles but don''t apply them to
    text, they will not appear in the CSS Properties panel.

    2 Choose Window > Type > Character Styles to open the Character Styles panel.'
