  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_270_0.png)


    If the path you created is not aligned exactly with the template, select the Direct
    Selection tool (A), and select the anchor points one at a time to show the direction
    handles. You can then drag the ends of the direction handles (called direction
    points) until your path follows the template more accurately.


    +   4 Select the Selection tool, and click the artboard in an area with no objects,
    or choose Select > Deselect.

    Deselecting the first path allows you to create a new path. If you click somewhere
    on the artboard with the Pen tool while the path is still selected, the path connects
    to the next point you draw.


    > Tip

    While drawing with the Pen tool, to deselect objects, you can press the Command
    (Mac OS) or Ctrl (Windows) to temporarily switch to the Direct Selection tool,
    and then click the artboard where there are no objects. Another way to end a path
    is to press the Escape key when you are finished drawing.


    If you want to try drawing the curve for more practice, scroll down to the Practice
    Area in the same artboard and trace the different curves.


    # Drawing a series of curves with the Pen tool


    Now that you''ve experimented with drawing a curve, you will draw a shape that
    contains several continuous curves.


    +   1 Choose 4 from the Artboard Navigation menu in the lower-corner of the Document
    window. Select the Zoom tool (Q), and click several times in the top half of the
    artboard to zoom in.

    2 In the Control panel, make sure that the fill color is None (/) and the stroke
    color is Black. Also, make sure the stroke weight is still 1 pt in the Control
    panel.

