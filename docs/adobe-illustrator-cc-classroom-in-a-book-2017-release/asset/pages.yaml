  md: '# Working with artboards


    Artboards represent the regions that can contain printable or exportable artwork,
    similar to pages in Adobe InDesign or artboards in Adobe Photoshop. You can use
    multiple artboards for creating a variety of things, such as multiple-page PDF
    files, printed pages with different sizes or different elements, independent elements
    for websites or apps, or video storyboards, for instance.


    # Adding artboards to the document


    You can add and remove artboards at any time while working in a document. You
    can create artboards in different sizes, resize them with the Artboard tool (
    ) or Artboards panel (Window > Artboards), and position them anywhere in the Document
    window—you can even overlap them. All artboards are numbered and can have a unique
    name assigned to them. Next, you will add two more artboards to the BookCover.ai
    document.


    +   1 Choose View > Fit Artboard In Window, and then press Command+– (Mac OS)
    or Ctrl+– (Windows) to zoom out.


    +   2 Press the spacebar to temporarily access the Hand tool ( ). Drag the artboard
    to the left to see more of the darker canvas to the right of the artboard.'
