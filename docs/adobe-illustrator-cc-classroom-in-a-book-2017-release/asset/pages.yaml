  md: '# Importing a plain-text file


    You can import text into artwork from a file that was created in another application.
    As of the writing of this book, Illustrator supports DOC, DOCX, RTF, Plain text
    (ASCII) as ANSI, Unicode, Shift JIS, GB2312, Chinese Big5, Cyrillic, GB18030,
    Greek, Turkish, Baltic, and Central European encoding. One of the advantages of
    importing text from a file, rather than copying and pasting it, is that imported
    retains its character and paragraph formatting (by default). For example, text
    from an RTF file retains its font and style specifications in Illustrator, unless
    you choose to remove formatting when you import the text. In this section, you''ll
    place text from a plain-text file into your design.


    > Tip You can add placeholder text to your document if you don''t have the final
    text ready yet. With the cursor in a type object or in text on a path, Choose
    Type > Fill With Placeholder Text.


    +   1 Choose 1 Poster from the Artboard Navigation menu in the lower-left corner
    of the Document window.

    2 Choose File > Place. In the Lessons > Lesson08 folder, select the L8_text.txt
    file. In the Place dialog box, click the Options button to see the import options,
    if necessary. Show Import Options, and click Place.


    > Tip You can place text into an existing text area as well.


    +   3 In the Text Import Options dialog box, you can set some options prior to
    importing text. Leave the default settings, and then click OK.'
