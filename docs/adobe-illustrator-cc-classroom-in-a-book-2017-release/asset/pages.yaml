  md: 'Draw Behind mode: This mode allows you to draw objects behind other objects
    without choosing layers or paying attention to the stacking order.


    Draw Inside mode: This mode lets you draw objects or place images inside other
    objects, including live text, automatically creating a clipping mask of the selected
    object.


    # Working with Draw Behind mode


    Throughout this lesson, you’ve been working in the default Draw Normal mode. Next,
    you’ll draw a rectangle that will cover the artboard and go behind the rest of
    the content using Draw Behind mode.


    NotenIf the Tools panel you see is displayed as a single column, you can click
    the Drawing Modes button at the bottom of the Tools panel and choose Draw Behind
    from the menu that appears.


    +   1 Choose View > Fit Artboard Fit the artboard with the moon.

    2 Click the Draw Behind button at the bottom of the Tools panel.

    As long as this drawing mode is selected, every shape you create using the different
    methods you''ve learned will be created behind the other shapes on the page. The
    Draw Behind mode also affects placed content (File > Place).


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_166_0.png)


    +   3 Click and hold the mouse button on the Star tool in the Tools panel, and
    select the Rectangle tool. Position the pointer off the upper-left corner of the
    artboard where the red bleed guides meet. Click and drag off the lower-right side
    of the artboard to the corner of the red bleed guides.'
