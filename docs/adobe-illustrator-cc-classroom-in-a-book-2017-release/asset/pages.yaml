    # Exporting artboards and assets


    In Illustrator, using the File > Export > Export For Screens command and the Asset
    Export panel, you can export artboards, perhaps to show a design in progress,
    or selected assets. The exported content can be saved in several file formats,
    such as GIF, JPEG, SVG, and PNG. These formats are optimized for use on the Web,
    devices, and onscreen presentations and are compatible with most browsers, yet
    each has different capabilities. The selected artwork is automatically isolated
    from the rest of the design and saved as an individual file.


    To learn more about working with web graphics, search for “File formats for exporting
    artwork” in Illustrator Help (Help > Illustrator Help).'
