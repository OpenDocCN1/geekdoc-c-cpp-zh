    can be very useful if you use the document shortcuts to navigate to the next or
    previous document. These two documents are marketing pieces for the same company.
    To see both of them at one time, perhaps to copy a logo between them, you can
    arrange the Document windows by cascading windows or tiling them. Casciling allows
    you to cascade (stack) different document groups. Tiling shows multiple Document
    windows at one time, in various arrangements.


    Next, you will tile the open documents so that you can see both at one time. In
