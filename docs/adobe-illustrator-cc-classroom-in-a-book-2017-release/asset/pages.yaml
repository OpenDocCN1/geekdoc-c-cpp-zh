    # Working with the Blob Brush tool


    You can use the Blob Brush tool to paint filled shapes that intersect and merge
    with other shapes of the same color. With the Blob Brush tool, you can draw with
    Paintbrush tool artistry. Unlike the Paintbrush tool, lets create open paths,
    the Blob Brush tool lets you create a closed shape with a fill only (no stroke)
    that you can then easily edit with the Eraser or Blob Brush tool. Shapes that
    have a stroke cannot be edited with the Blob Brush tool.'
