    # Scaling a placed image


    You can duplicate and transform placed images just as you do other objects in
    an Illustrator. Unlike the vector artwork, you need to consider the resolution
    of the raster image content in your document since raster images without enough
    resolution may look pixelated when printed. Working in Illustrator, if you make
    an image smaller, the resolution of the image increases. If you make an image
    larger, the resolution decreases. Next, you will transform the Kayak.jpg image.


    +   * Note

    Transformations performed on a linked image in Illustrator, and any resulting
    resolution changes, do not change the original image. The changes apply only to
    the image within Illustrator.


    +   * Tip

    To transform a placed image, you can also open the Transform panel (Window > Transform)
    and change settings there.


