  md: '# Combining paths using the Shaper tool


    In Lesson 3, “Using Shapes to Create Artwork for a Postcard,” you learned about
    the Shaper tool. The Shaper tool can be used to not only create paths and shapes
    but also combine paths and shapes in different ways.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_201_0.png)


    After combining artwork with the Shaper tool, the result is a “Shaper Group.”
    The original paths are still accessible and treated like a merged group, but appearance
    attributes are applied to the shaper group as a whole.


    To learn more about combining paths using the Shaper tool, search for “Shaper
    tool” in Illustrator Help (Help > Illustrator Help).


    # Using the Width tool


    Not only can you adjust the weight of a stroke, like you did in Lesson 3, but
    you can also alter regular stroke widths either by using the Width tool or by
    applying width profiles to the stroke. This allows you to create a variable width
    along the stroke of a path. Next, you will use the Width tool to create a bird.


    +   Choose 6 Bird 4 from the Artboard menu in the lower-left corner of the Document
    window.


    +   Choose View > Fit Artboard In Window, if necessary.'
  merge: -1
