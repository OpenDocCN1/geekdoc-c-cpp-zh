  md: '11 Choose Select > All On Active Artboard and then choose Object > Hide > Selection.


    # Working with the Shaper tool


    Another way to draw and edit shapes in Illustrator involves the Shaper tool (
    ). The Shaper tool recognizes natural gestures and produces Live Shapes from those
    gestures. Without switching tools, you can combine, delete, fill, and transform
    basic shapes you create. In this section, you''ll get a feeling for how the tool
    works by exploring the most widely used features.


    +   Note

    The Shaper tool is present in the Tools panel of the classical workspace. In the
    Touch Workspace, it is a top-level tool in the toolbar. This tool works best with
    a stylus on touch surfaces, such as Surface Pro or Wacom Cintiq, or through indirect
    inputs as the Wacom Intuos.


    # Drawing shapes with the Shaper tool


    To get started with the Shaper tool, you''ll draw a few simple shapes that will
    eventually become the moon.


    +   1 Choose View > Fit Artboard In Window, if necessary.'
