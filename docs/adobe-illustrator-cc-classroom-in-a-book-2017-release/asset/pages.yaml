  md: '# Masking an object with text


    In this section, you''ll use text as a mask for an image you placed. In order
    to create a mask from text, the text needs to be on top of the image, as you''ll
    see.


    # Note


    If the image Text.psd is not as wide as the “ISLE” text, make sure you resize
    the image, holding down the Shift key to constrain the proportions. Don’t worry
    if it’s larger than you see in the figure.


    # Tip


    You can also choose Object > Clipping Mask > Make.


    +   1 With the Selection tool selected, drag the green leaf image (Text.psd) from
    off the right side of the artboard on top of the “ISLE” text.

    2 Choose Object > Arrange > Send To Back. You should see the “ISLE” text now.
    Make sure that the image is positioned roughly like you see in the figure.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_685_0.png)


    +   3 With the image still selected, Shift-click the “ISLE” text to select both
    of them. Right-click over the selected content, and choose Make Clipping Mask
    from the context menu.

    You can edit the Text.psd image and the clipping mask separately, just as you
    did previously with the masked Kayak.jpg image.

    4 With the text still selected, open the Graphic Styles panel (Window > Graphic
    Styles), and select the Text Shadow graphic style to apply a drop shadow.'
