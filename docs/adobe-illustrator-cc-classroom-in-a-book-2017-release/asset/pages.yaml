    # Combining shapes


    A lot of the time, creating more complex shapes from simpler shapes can be easier
    than trying to create them with drawing tools like the Pen tool. In Illustrator,
    you can combine vector objects in different ways. The resulting paths or shapes
    differ depending on the method you use to combine the paths. In this section,
    you''ll explore a few of the more widely used methods for combining shapes.


    # Working with the Shape Builder tool


    The first method you''ll learn for combining shapes involves working with the
    Shape Builder tool (+). This tool allows you to visually and intuitively merge,
    delete, fill, and edit overlapping shapes and paths directly in the artwork. Using
    the Shape Builder tool, you''ll create a complex bird shape from a series of shapes
    like circles and squares.'
