  md: '# Note


    Don''t worry if the path you draw is not exact. You can correct the line with
    the Direct Selection tool (A) when the path is complete.


    +   4 Position the pointer over the point labeled 2 (to the right), and click
    and drag down to the red dot, adjusting the first arc (between points 1 and 2)
    with the direction handle before you release the mouse button.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_271_0.png)


    When it comes to smooth points (curved), you''ll find that you spend a lot of
    time focusing on the path segment behind (before) the current anchor point you
    are creating. Remember, by default there are two direction lines for a point.
    The previous direction line controls the shape of the previous segment.


    # Tip


    As you drag out the direction handles for an anchor point, you can press and hold
    the spacebar to reposition the anchor point. When the anchor point is where you
    want it, release the spacebar.


    +   5 Continue along the path, alternating between dragging up and down. Put anchor
    points only where there are numbers and finish with the point labeled 6.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_271_1.png)


    If you make a mistake as you draw, you can undo your work by choosing Edit > Undo
    Pen, and then draw the last point again. Note that your direction lines may not
    match the figures, and that''s okay.'
