  pgno: 575
- img_proc: true
  md: 'Illustrator Effects (vector): The top half of the Effect menu contains vector
    effects. You can apply these effects only to vector objects or to the fill or
    stroke of a bitmap object in the Appearance panel. The following vector effects
    can be applied to both vector and bitmap objects: 3D effects, SVG filters, Warp
    effects, Transform effects, Drop Shadow, Feather, Inner Glow, and Outer Glow.


    Photoshop Effects (raster): The bottom half of the Effect menu contains raster
    effects. You can apply them to either vector or bitmap objects.


    In this section, you will first explore how to apply and edit effects. You will
    then explore a few of the more widely used effects in Illustrator to get an idea
    for the range of effects available.


