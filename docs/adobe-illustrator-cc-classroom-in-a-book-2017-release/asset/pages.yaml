  md: '# 6. Creating an Illustration with the Drawing Tools


    Lesson overview


    In this lesson, you’ll learn how to do the following:


    +   - Understand paths and anchor points.

    - Draw curved and straight lines with the Pen tool.

    - Edit curved and straight lines.

    - Add and delete anchor points.

    - Draw with the Curvature tool.

    - Delete and add anchor points.

    - Convert between smooth points and corner points.

    - Create dashed lines and add arrowheads.

    - Draw and edit with the Pencil tool.

    - Work with the Join tool.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_256_0.png)


    This lesson takes approximately 90 minutes to complete.


    Please log into your account on peachpit.com to download the lesson files for
    this chapter, or go to the “Getting Started” section at the beginning of this
    book and follow the instructions under “Accessing the Lesson Files and Web Edition.”


    Your Account page is also where you’ll find any updates to the chapters or to
    the lesson files. Look on the Lesson & Update Files tab to access the most current
    content.'
