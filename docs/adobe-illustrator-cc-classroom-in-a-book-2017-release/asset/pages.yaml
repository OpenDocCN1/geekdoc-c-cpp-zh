  md: '# Getting Started


    Adobe® Illustrator® CC is the industry-standard illustration application for print,
    multimedia, and online graphics. Whether you are a designer or a technical illustrator
    producing artwork for print publishing, an artist producing multimedia graphics,
    or a creator of web pages or online content, Adobe Illustrator offers you the
    tools you need to get professional-quality results.


    # About Classroom in a Book


    Adobe Classroom in a Book (2017 release) is part of the official training series
    for Adobe graphics and publishing software developed with the support of Adobe
    product experts. The features and exercises in this book are based on Illustrator
    CC (2017.1 release).


    The lessons are designed so that you can learn at your own pace. If you''re new
    to Adobe Illustrator, you''ll learn the fundamentals you need to master to put
    the application to work. If you are an experienced user, you''ll find Classroom
    in a Book teaches many advanced features, including tips and techniques for using
    the latest version of Adobe Illustrator.


    Although each lesson provides step-by-step instructions for creating a specific
    project, there''s room for exploration and experimentation. You can follow the
    book from start to finish or do only the lessons that correspond to your interests
    and needs. Each lesson concludes with a review section summarizing what you''ve
    covered.


    # Prerequisites


    Before beginning to use Illustrator CC Classroom in a Book (2017 release), you
    should have working knowledge of your computer and its operating system. Make
    sure that you know how to use the mouse and standard menus and commands and how
    to open, save, and close files. If you need to review these techniques, see the
    printed or online documentation for your Windows or Mac OS.


    # Installing the program


    Before you begin using Illustrator CC Classroom in a Book (2017 release), make
    sure that your system is set up correctly and that you''ve installed the required
    software and hardware.


    You must purchase the Illustrator CC software separately. For complete instructions
    on installing the software, visit http://helpx.adobe.com/illustrator.html. You
    must install Illustrator from Adobe Creative Cloud onto your hard disk. Follow
    the onscreen instructions.'
  merge: -1
  pgno: 15
