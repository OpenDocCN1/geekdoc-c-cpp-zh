    # Adding type to the poster


    Type features are some of the most powerful tools in Illustrator. You can add
    a single line of type to your artwork, create columns and rows of text like you
    do in Adobe InDesign, place text into a shape or along a path, and work with letterforms
    as graphic objects. In Illustrator, you can create text in three main ways: as
    point type, area type, and type on a path.


    # Adding text at a point


    Point type is a horizontal or vertical line of text that begins where you click
    and as you enter characters. Each line of text is independent—the line expands
    or shrinks as you edit it but doesn’t wrap to the next line unless you use a paragraph
    return or a soft return. Entering this text is useful for adding a headline or
    a few words to your artwork. Next, you will add some text to the poster as point
    type.


