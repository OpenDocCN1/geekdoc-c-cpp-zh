    # Creating a PDF


    Portable Document Format (PDF) is a universal file format that preserves the content,
    fonts, images, and layout of source documents on a wide range of applications
    and platforms. Adobe is the standard for the secure, reliable distribution and
    exchange of electronic documents and forms around the world. Adobe PDF files are
    compact and complete and can be shared, viewed, and printed by anyone with software
    such as the Adobe Reader.


    You can create different types of PDF files from Illustrator. You can create multipage
    PDFs, layered PDFs, and PDF/X-compliant files. Layered PDFs allow you to save
    one PDF with layers that can be used in different contexts. PDF/X-compliant files
    ease the burden of color, font, trapping issues in printing. Next, you will save
    this project as a PDF so that you can send it to someone else to view.


    +   File > Save As. In the Save dialog box, choose PDF (pdf) from the Format menu
    (Mac OS) or Adobe PDF (*,PDF) from the Save As menu (Windows). Navigate to the
    Lessons > Lesson05 folder, if necessary. Notice that you have the option, at the
    bottom of the dialog box, to save all of the artboards in the PDF or a range of
    artboards. Click Save.


    # Note


    If you want to learn about the options and other presets in the Save Adobe PDF
    dialog box, choose Help > Illustrator Help and search for “Creating PDF files.”


    In the Save Adobe PDF dialog box, click the Adobe PDF Preset menu to save all
    of the different PDF presets available. Ensure that [Illustrator Default] is chosen,
    and click'
