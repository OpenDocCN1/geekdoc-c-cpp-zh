    # Review questions


    +   1 Describe what a global color is.


    +   2 How can you save a color?


    +   3 Describe what a tint is.


    +   4 How can you choose color harmonies for color inspiration?


    +   5 Name two things that the Recolor Artwork dialog box allows you to do.


    +   6 Explain what Live Paint allows you to do.


    # Review answers


    +   1 A global color is a color swatch that, when you edit it, automatically updates
    all artwork to which it is applied. All spot colors are global; however, process
    colors can be either global or local.


    +   2 You can save a color for painting other objects in your artwork by adding
    it to the Swatches panel by doing one of the following:


    +   - Drag the color from a Fill box, and drop it over the Swatches.


    +   - Click the New Swatch button at the bottom of the Swatches panel.


    +   - Choose New Swatch from the Swatches panel menu.'
