    # Using the Direct Selection tool


    In Illustrator, as you draw, you create paths that are made up of anchor points
    and paths. Anchor points are used to control the shape of the path and work like
    pins holding a wire in place. A shape you create, like a square, is composed of
    at four anchor points on the corners with paths between anchor points. You change
    the shape of a path or shape by dragging its anchor points (among other things).
    The Direct Selection tool lets you select anchor points or path segments within
    an object so that it can be reshaped. Next, you will become familiar with selecting
    anchor points using the Direct Selection tool and reshaping a path.'
