    of the New Document dialog box by choosing File > New.


    ![](img/0c5910fd22f9e44018e950cfb41c7e75_132_0.png)


    6 In the Bleed section of the Document Setup dialog box, change the value in the
    Top field to 0.125 in, either by clicking the Up Arrow to the left of the field
    or by typing the value, and all four fields change. Click OK. Notice the red line
    that appears around both artboards. The red line indicates the bleed area. Typical
    bleeds for printing are about 1/8 of an inch, but it can depend on the printing
    vendor.


    # Working with basic shapes


    In the first part of this lesson, you''ll create a series of basic shapes, such
    as rectangles, ellipses, rounded rectangles, polygons, and more. A shape you create
    is composed of anchor points with paths connecting the anchor points. A basic
    square, for instance, is composed of four anchor points on the corners with paths
    connecting the anchor points (see the figure at right). A shape is referred to
    as a closed path.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '![](img/0c5910fd22f9e44018e950cfb41c7e75_133_0.png)


    A path can be closed, or it can be open with distinct anchor points on each end
    (called points). Both open and closed paths can have fills applied to them.

    You’ll begin this exercise by setting up the workspace.


    +   1 Choose Window > Workspace > Essentials (if it''s not already selected),
    and then choose Window > Workspace > Reset Essentials.

    2 Choose 2 from the Artboard Navigation menu in the lower-left corner of the Document
    window.

    3 Choose View > Fit Artboard In Window, if necessary.


    # Creating and editing rectangles


    You’ll start this lesson by creating a series of rectangles that will be the start
    of artwork on your postcard. All of the shape tools, for the Star tool and Flare
    tool, create Live Shapes. Live Shapes has attributes such as width, height, rotation,
    corner radius, and corner style that are still editable later and are retained
    even if you scale or rotate the shape.


    > Note

    As you go through this section, know that you don’t have to match the sizes of
    the drawn shapes exactly. They are just as a guide.


    +   1 Select the Rectangle tool ( ) in the Tools panel. Position the pointer near
    the center of the artboard, and click and drag down and to the right until the
    rectangle is approximately 1.25 inches wide and has a height of 1.5 inches, as
    shown in the gray tooltip next to the cursor.'
