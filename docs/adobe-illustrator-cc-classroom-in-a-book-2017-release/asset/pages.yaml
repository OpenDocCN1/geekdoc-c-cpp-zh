    The Appearance panel (Window > Appearance) can be used to view and adjust the
    appearance attributes for a selected object, group, or layer. Fills and strokes
    are listed in stacking order; top to bottom in the panel correlates to front to
    back in the artwork. Effects applied to artwork are listed from top to bottom
    in the order in which they are applied to the artwork. An advantage of using appearance
    attributes is that they can be changed or removed at any time without affecting
    the underlying artwork or any other attributes applied to the object in the Appearance
    panel.


