  md: '# Note


    You can export all of the CSS from your design by choosing Export All from the
    CSS Properties panel. If you want to change the export options first, you can
    set them by clicking the Export Options button 📋 at the bottom of the CSS Properties
    dialog box.


    +   6 In the CSS Export Options dialog box, leave all the options at their default
    settings, and click OK. You will most likely see a dialog box telling you that
    images will be overwritten. Click OK.


    Position and size properties are not added to the CSS code by default. In certain
    situations, you will need to export CSS with those options selected. The Include
    Vendor Pre-fixes option is selected by default. Vendor prefixes are a way for
    certain browser makers (each is listed in the dialog box) to add support for new
    CSS features. You can choose to exclude these prefixes by deselecting them.


    # Note


    Your file sorting and icons may look different in the CSS_Export folder, and that''s
    okay.


    +   7 Go to the Lessons > Lesson15 > CSS_Export folder, and you will see the new
    CSS file named AssetExport_all.css and a series of images created because the
    Rasterize Unsupported Art option was selected in the CSS Export Options dialog
    box.'
