- img_proc: true
  md: '# Review answers


    +   1 To draw a straight line, click with the Pen tool (✏️), and then move the
    pointer and click again. The first click sets the starting anchor point, and the
    second click sets the ending anchor point of the line. To constrain the straight
    line vertically, horizontally, or along 45° diagonal, press the Shift key as you
    create the second anchor point with the Pen tool.


    +   2 To draw a curved line with the Pen tool, click to create the anchoring anchor
    point, drag to set the direction of the curve, and then click to end the curve.


    +   3 To convert a smooth point on a curve to a corner point, use the Direct Selection
    tool () to select the anchor point, and then use the Anchor tool (↗) to drag a
    direction handle to change the direction. Another method is to choose a point
    or points with the Direct Selection tool, and then click the Convert Selected
    Anchor Points To Corner button () in the Control panel.


    +   4 To edit a segment on a curved line, select the Direct Selection tool, and
    drag the segment to move it, or drag a direction handle on an anchor point to
    adjust the length and shape of the segment. Dragging a path segment with the Direct
    Selection tool or pressing the Option (Mac OS) or Alt (Windows) key and dragging
    a path segment with the Pen tool is another way to reshape a path.


    +   5 To change the way the Pencil tool (✏️) works, double-click the Pencil tool
    in the Tools panel to open the Pencil Tool Options dialog box. You can change
    the smoothness, fidelity, and other options.


    +   6 Unlike the Join command, the Join tool can trim overlapping paths as it
    joins, and it doesn’t simply create a straight line between the anchor points
    you are joining. The angle created by the two paths to be joined are taken into
    account.'
