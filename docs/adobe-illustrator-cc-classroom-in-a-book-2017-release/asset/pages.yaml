    # Selecting paths


    The type of anchor points you created in the previous section are called corner
    points. Corner points are not smooth like a curve; rather, they create an angle
    where the anchor point is. Now that you can create corner points, you will move
    on adding other types of points such as smooth points to create curves in a path.
    But first, you will learn a few techniques for selecting paths.


    Back in Lesson 2, “Techniques for Selecting Artwork,” you were introduced to selecting
    content with the Selection and Direct Selection tools. Next, you’ll explore a
    few more options for selecting artwork with those same Selection tools.'
