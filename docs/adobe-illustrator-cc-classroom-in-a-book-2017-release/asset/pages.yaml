    In the Gradient panel under the gradient slider (labeled "E" in the previous figure),
    the leftmost gradient stop (labeled "F") is called a color stop. This marks the
    starting color; the right gradient stop marks the ending color. A color stop is
    the point at which a gradient slider changes from one color to the next. You can
    add more color stops by clicking below the gradient slider, and double-clicking
    a color stop opens a panel where you can choose a color from swatches, color sliders,
    or the eyedropper.


