- pgno: 275
  md: '# Knowledge Representation for Legal Applications


    The representation of attribute types and values was such that some reasoning
    could proceed in the absence of complete information, without invalidating the
    classical interpretation of negation.


    All the applications needed second-order facilities (e.g. to allowing summation
    of money owned by the members of a family). To make this possible without requiring
    a closed-world assumption, instance-valued slots also contain cardinality information
    (represented as a numeric range), and a limited set of second-order functions
    was provided, e.g. for summing some slot value over the set of individuals held
    in a given instance-valued slot. The provision of cardinality information also
    allowed an improved treatment of negation.


    # 12.8.3. Rules and constraints


    While all the applications needed some kind of rule language to relate slot values
    within or between instances, the nature of support required appeared to vary between
    applications.


    The declarative reasoning of a logical statement licenses deductive conclusions
    about any of its propositions. Sometimes, however, the intention of such a statement
    is to allow a particular conclusion to be drawn. The claim assessment and advice
    applications had ''input'' and ''output'' data which could be distinguished at
    the time of building the knowledge base, whereas in the policy application the
    distinction between ''input'' and ''output'' data varied according to the problem
    being discussed. This distinction, mentioned earlier in Chapter 4, was recognized
    by providing ''rules'', which had one ''head'' proposition distinguished as the
    conclusion, and ''constraints'', which gave equal status to all their propositions.
    Constraints were thus more general than rules, but where the ''output'' slot was
    known in the use of a rule was more efficient.


    Rule bodies and constraints could be of arbitrary complexity, allowing the knowledge
    base into individual rules and constraints to reflect the decomposition used in
    the source material.


    Variables in rules and constraints were typed with the classes of individuals
    over which they were quantified. In classical predicate logic such typing information
    has to appear in the form of additional conditions in the body of the statement,
    losing a valuable distinction between the rules of such conditions. Typing a variable
    with a non-leaf class allowed the effect of the rule to be inherited by its subclasses,
    giving economy of expression. Rules and constraints could also refer to particular
    instances by name. A constraint was a well-formed logical statement built from
    propositions, negated propositions, and the connectives ''and'', ''or'' ''=>''
    and ''<=>'' propositions.


    A rule had a single head proposition (possibly negated), ''if'' or ''iff'' as
    its neck, and a well-formed logical statement built from propositions, negated
    propositions, and the connectives ''and'', ''or'' ''=>'' and ''<=>'' as'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'its body. The use of this variety of logical operators obviated the need to
    translate into a normal form, and so allowed the constraints and rules to mirror
    the structure of the source material.


    Each of the above-mentioned slot types had a corresponding proposition type for
    testing/asserting particular values. Additional proposition types allowed the
    values of numeric slots to be related by equations or inequations containing arithmetic
    expressions and second-order functions.


    Inference was data-driven (i.e. forward-chaining). New data drove a matching process,
    with successful matches resulting in the generation of activations. These were
    added to an agenda; when the application requested it, activations were scheduled
    in most-general-first order (possibly causing more activations to be generated),
    until no further activations remained.


    # 12.8.4. Hypothetical reasoning


    Applications also required the ability to make assumptions about input data without
    commitment that users change their minds, and that ''what if?'' investigations
    could be performed. In the policy application, hypothetical reasoning could extend
    to the investigation of constraints corresponding to possible changes in legislation.


    Others have used ''non-monotonic logics'' to support such things as default reasoning,
    retraction of assertions and ''what if?'' investigations. We chose instead to
    use our monotonic language with an explicit assumption-based framework for hypothetical
    reasoning (based on the work of deKiler). While being invisible to the logical
    formalism, this framework allowed the application system to explore the consequences
    of alternative beliefs and to keep track of the dependencies between conclusions
    and assumptions. This meant that while all inference was sound in classical terms
    the application could use the results within the context of explicit sets of assumptions
    to provide the facilities mentioned above.


    The ATMS was used to allow slot, and the existence of instances and rules/constraints,
    to depend on externally-defined assumptions. The ATMS automatically maintained
    the status of all derived information with respect to the available assumptions,
    and allowed retrieval of information to be done under any (consistent) set of
    assumptions (a set of assumptions is called an ''environment''). All the information
    in a slot could be retrieved, so that the dependence of the slot value on different
    assumptions could be examined. The dependency information maintained by the ATMS
    could be accessed by the application, allowing explanations to be constructed
    externally to the Toolkit.


    Any inconsistent assignment of values to a slot caused the environment(s) under
    which the incompatible values would jointly hold to be marked as inconsistent.
    No useful inference or retrieval could proceed under an inconsistent environment.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '260 Knowledge Representation for Legal Applications


    # 12.9. POSSIBLE FUTURE WORK


    The Toolkit developed in the DHSS Demonstrator project supported many of the features
    that we identified as being desirable for a legal application. It was not a radical
    departure from existing knowledge representation paradigms, but rather represented
    the imposition of a discipline to the use of existing paradigms as to enforce
    the declarative reading and avoid some of the problems that would occur when declarativeness
    was violated.


    It was not, however, the initial decision to implement only facilities we were
    clear about inevitably meant that limits of expressiveness were encountered. This
    section describes additional lines of work that could be pursued to remedy some
    of the shortcomings.


    # 12.9.1. Backward chaining


    Despite an intention to combine forward and backward chaining, difficulties in
    combining backward-chaining and hypothetical reasoning resulted in only the former
    being implemented, since an ATMS sits far more naturally with this style of inference,
    Backward chaining is useful for restricting the input data to those required to
    determine a given conclusion, but if hypothetical input data may be entered, and
    inference is restricted to paths leading to the goal (as is usual in backward
    chaining systems), inconsistencies in the input data (which are by definition
    hypothetical) may go unnoticed. One remedy, which takes particular account of
    the focusing nature of backward reasoning, would be to use a backward search from
    the goal to select the relevant input data, and to allow forward inference to
    occur when the data is input. The advice application implemented this strategy
    outside the Toolkit, and it would seem a useful extension for a variety of applications.


    # 12.9.2. Rules, constraints and definitions


    The limitations on the syntax of rules, though reasonable at first sight, led
    to unanticipated problems in their interpretation and use. While constraints did
    not suffer from these problems, when used for definitions they could not show
    the distinction between the term being defined and the terms being used in the
    definition. This distinction is not important to the inference mechanism, but
    it could be important to the user interface, and is important to the builders,
    validators and maintainers of the knowledge base. The ability to annotate clauses
    to show these distinctions would be valuable.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Legal Applications of KBS


    # 12.9.3. Multiple use of rule/constraint components


    Legislation commonly contains cross-references to small substructures in remote
    pieces of legislation, e.g. ‘A person who satisfies paragraph 3 of Regulation
    11...’. While the Toolkit generally allowed the representation of rules or constraints
    with the same grain size as the original legislation, in cases such as this we
    have either to duplicate the cross-referenced material, or to decompose into multiple
    rules the structure containing the cross-referenced item. The first approach introduces
    undesirable redundancy, while the second is clumsy and requires an awareness of
    what cross-references exist (or may come into existence). More work is needed
    only on the representation aspects but also on the tools to support maintenance
    of heavily cross-referenced structures.


    # 12.9.4. Existence, identity and migration within the class lattice


    Frame-based systems are generally not good at handling existential states (e.g.
    ‘Some of Mary’s children are under 6’), having multiple representations which
    turn out to represent the same individual (e.g. ‘the person claiming child benefit
    for Jimmy and ‘Mary’), or at allowing an individual to be represented and reasoned
    about before its type is fully known (e.g. ‘the animal that bit Henry’). These
    problems are all related, and are compounded when hypothetical reasoning is allowed.
    The Toolkit was limited to using ‘rigid designers’ of individuals of fixed classes.
    These are important problems, but they are so closely coupled that all of them
    need to be solved before the full benefit of solving any of them can be felt.


    # 12.9.5. Temporal reasoning


    All applications would have benefited from temporal reasoning facilities, but
    we were no such facilities provided by the Toolkit. Some work was done on a variant
    of the event calculus of [Kowalski and Sergot 1986] using explicit assumptions
    of persistence rather than negation as failure, but there was not time to assess
    its appropriateness for the applications or to attempt to mechanize it efficiently.
    There is as yet no consensus in the AI community with regard to the appropriate
    handling of time; promising representations exist, but control of inference remains
    a serious problem.


    # 12.9.6. Modal reasoning


    The policy application would have found valuable to be able to perform some limited
    amount of modal reasoning, so that the desirability of states could be reasoned
    about as well as their truth, and so that conclusions to what should be the case
    could be drawn, as well as conclusions to what is the case. The need was not felt
    in the other applications, because in those applications the user has no control
    over'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'what the law is, but is charged only to apply it. The rights and wrongs

    of the matter are therefore no concern of his, and he must treat

    the law ought to be true as if it really were, and he does not

    engage in any specifically normative reasoning. See [Bench-Capon 1989]

    for a fuller discussion of this point. No such facilities have been pro-

    vided, but investigation of how they might be incorporated into valu-

    able.


    # 12.10. CONCLUSION


    In this chapter we have described some of the features that we need

    to be taken into account when choosing how to do the knowledge

    representation for a legal KABS, and we have described a formalism pro-

    duced for that purpose. The example formalism is to some extent jus-

    tification for some of the points made in the early stages of the chapter,

    and some extent their source. In conclusion we would like to make a

    distinction between two aspects: expressiveness and what could be termed

    engineering principles, the first concerning what can be built, and

    second how it should be built. The first determines what can be

    represented in a formalism: the formalism of the Toolkit is for example

    inadequate in its treatment of time and modal knowledge. Given this

    inadequacy, applications can still be built, but their functionality will

    limited: thus in the policy application all the distinctly modal reasoning\ust
    be performed by the user, although he is supported in this by the

    on-modal reasoning of the system. The system will tell him that Q

    follows from P, but he must himself conclude the undesirability of P

    from the undesirability of Q. The legal domain does make certain

    dands on the expressiveness of a representation, and the nature of the

    application to be built will depend on how well these demands are met.

    this explains why a technically unambiguous system such as the Retire-

    ment Pension Forecast Advisor [Spiegel-Sinclair 1988] can be

    built using the very restricted representation provided by ADS expert syst-

    them, while the highly ambitious TAXMAN III of McCarthy

    requires his extensively elaborated language for legal discourse. In

    terms the facilities offered by the Toolkit fall between the two, and does

    the ambition of the applications supported.


    In terms of engineering considerations, which concern how the

    application is built rather than what is built, the legal domain also makes

    dands. We suggested above that these suggest that the representation

    be truly declarative and support an isomorphic representation of

    source material. Our belief is that the Toolkit scores well with regard to

    these points. But should be noted that these considerations do not

    determine the range or styles of applications that can be built, but rather

    the utility they will have in practice.'
  merge: -1
  img_proc: true
