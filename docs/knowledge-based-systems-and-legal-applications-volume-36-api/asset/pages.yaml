- pgno: 10
  md: '# PREFACE


    INTRODUCTION

    Artificial intelligence is by nature an experimental science, and the subfield
    of knowledge based systems applied to the legal domain is no exception to this
    general principle. The field has been stimulated by such notable experiments as
    McCarty''s TAXMAN described in [McCarty 1977], Rissland''s HYPO [Rissland and
    Ashley 1977] and the British Nationality Act experiment of Imperial College [Sergot
    1976]. Progress has been made through an an implementation which serves to clarify
    the strengths and weaknesses of the underlying ideas, and by reflecting on the
    experience of implementing these ideas in a working system. Of course, it is not
    just these reflections of the experiment that are of value, but those of the wider
    community too. This book is intended to make available the experience gained,
    and some of the lessons learnt, from a substantial group of related experiments
    in the field of knowledge based systems and law performed in the Alvey-DHSS Demonstrator
    project. This, which ran from 1984 to 1989, represented a remarkable opportunity
    for the performance of sustained experiments. The chapters in the book represent
    the reflections on the project of a number of people who participated in the project:
    some of their conclusions may differ, but they are grounded in a common experience.


    The Alvey-DHSS Demonstrator project was a large Demonstrator Project, supported
    by the Alvey Directorate of the UK Department of Trade and Industry and the UK
    Science and Engineering Research'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Council. The project collaborators were ICL, Logica, Imperial College, and
    the universities of Lancaster, Liverpool and Surrey. Additionally the Department
    of Health and Social Security (DHSS), assigned several members of staff to work
    full time on the project.


    The book is organized into four parts. The first part contains some background
    material needed to put the remainder of the book into context. The second part
    concentrates on the tasks within the target organization that the project examined
    ways of supporting. Three distinct areas capable of being supported by KBS were
    identified, and prototype systems were built for each of the three. An important
    lesson learnt from the Demonstrator project was that the nature of the task being
    supported had an all-pervasive influence on the nature of a system to support
    the task: it is simply not appropriate to build a system and hope that it may
    be to support a whole range of users. The detailed teasing out of the distinctive
    needs of the various tasks was one of the major achievements of the Demonstrator.
    The third part gives details of the systems constructed in themselves, and the
    chapters also serve to give detail of the experimental grounding of the observations
    and general comments in the other chapters of the book. The final part is organized
    according to a number of issues which arise in the construction of a KBS in law.
    Thus there are chapters on knowledge analysis, knowledge representation, the nature
    of the interaction with such systems, co-operative working and the social and
    organizational implications of these kinds of system. Lastly, there is a concluding
    chapter in which I attempt to draw together some of the strands of the chapters
    to produce a framework for the discussion of KBS applied to the legal domain.


    Thanks are due to all who participated in the project and contributed to it in
    various ways over its long life. These include Alison Adams, Jo Bird, Andy Bille,
    Steve Blackburn, Tim Bond, Simon Booker, Julie Bourwe, Mary Clarke, Sarah Buckland,
    Christopher Burton, Alan Bustany, Tony Chandler, Marcus Clarke, Carolyn Lee, Avery
    Bentley, Cody Ingle, Jo Cox, Leo Crossfield, Ann Currie, Jo Dartnell, Shashi Dave,
    Patrick Dawson, Paul Duffin, Gary Floyd, Justin Yorker, David Frolich, Chris Gardner,
    Nigel Gilbert, Dave Goodwin, Green, Zhang Haiyi, Michael Hardy, Ginny Hardy, Sandra
    Hillawi, Heather Hopkins, Steve Hopwood, Paul Portman, Howlin Wilson, Mary Jiroka,
    Kevin Johnston, Simon Katz, Bernard Kelly, Mike Knox, Nick Lapham, Jacky Loch,
    Duncan Lowes, Angela Lucas, Paul Huff, J.O. Marks, Lil Masterman, Rosemary Mathews,
