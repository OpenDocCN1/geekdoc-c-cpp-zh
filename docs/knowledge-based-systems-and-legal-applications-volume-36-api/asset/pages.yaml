    version commences with a training sequence. On the whole, this sequence is led
    by the system and mimics the style of the main body of the interaction. Users
    learn to use the mouse, ask for help and answer questions, by the system taking
    them through a training form. When the user is asked to select a particular form
    to fill, he or chooses an option in response to a question that appears on a page
    of the training form. Users are also encouraged to select questions and move around
    the training information. Answering the final question on the training form will
    result in the first page of the real form being displayed and the first question
    being recommended. There is no need for any special Start button as the system
    takes the first turn by introducing the user to the mouse.


    # Overall mixture of initiative


    The overall style of the interaction remains the same in the second version; the
    user completes an answer to give the turn to the system, the system recommends
    the next relevant question to give the turn back to the user.


    # Local mixture of initiative


    The details of the turn transition have changed. Rather than the system moving
    onto a new question when the user selects an option (for choice options) or types
    a special ''continue'' key (for free-text options), users press the Continue key
    to complete both types of answer. This aims to clarify to the user when they are
    giving the turn to the system. There is now only one way to doing this.


