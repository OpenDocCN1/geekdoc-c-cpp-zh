  md: '# CHAPTER 13


    # MIXED INITIATIVE INTERACTION


    Paul Luff and David Frohlich


    #  13.1. INTRODUCTION


    There are a number of important ingredients to the success of any knowledge based
    system. Many of these have been discussed in other chapters of this book. For
    example, the function of the system should be fitted to the requirements of some
    target user group (Chapter 3). Its knowledge representation and inference capabilities
    allow it to fulfill this function accurately and efficiently (Chapter 12). Its
    knowledge-base should be coherent and scrutable (Chapter 11). Communication at
    the human-computer interface should be based around some clear metaphor-for interaction
    (Chapter 5), and the cost of developing and maintaining the system should be outighed
    by the benefits of operating it (Chapter 10).


    However, there is another ingredient which is rather difficult to characterize
    but is equally important in making the system useful and usable. This is the dynamic
    property of the interaction which the system supports. In many ways the dynamics
    of the interactional dynamics of a knowledge based system is the engine which
    binds all other ingredients together. Ultimately, users interact with a ''virtual
    system'' whose behaviour is more than the sum of its constituent parts; behaviour
    which is unfolded bit by bit, in an on-going interaction sequence. If the system
    fills some function for users, it must do so through the particular pieces of
    information it provides to them spontaneously or in response'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Mixed Initiative Interaction


    activities they perform. If it is to make inferences specific to this function,
    it must obtain facts from users in the right order and form, and report important
    results to them at the right place in the interaction. If the system is to project
    some clear metaphor at the interface, it must do so in the actual details of its
    individual responses to user inputs, and at a pace which is not overly costly
    to users or the organizations in which they work.


    This chapter describes a series of explorations in the design of new forms of
    interaction dynamics for knowledge based systems. More specifically, it reports
    a number of discoveries in the design of what might be called mixed initiative
    interaction, in which the control of the dialogue is shared between user and system.
    These discoveries were made in the process of designing and evaluating the claimant
    information Demonstrators in Chapter 9. In contrast to that, we focus here on
    the evolution of interaction design ideas for the Forms Helper and the Advice
    System, and describe their consequences for usability. We argue that there are
    numerous forms of mixed initiative interaction which have mixed consequences for
    interaction itself, but that an appropriate mixing of initiative can considerably
    improve the usefulness and accessibility of knowledge based systems.


    This chapter begins with an examination of the dimensions of mixed initiative
    interaction, and goes on to use these to describe the particular mix of initiative
    embodied in two versions of the Forms Helper and the final version of the Advice
    System. The chapter ends with a discussion of implications for the design of knowledge
    based systems.


    # 13.2. DIMENSIONS OF MIXED INITIATIVE INTERACTION


    Mixed initiative interaction is said to be a characteristic of human conversation
    involving the ''change of initiative or control from one participant to another''
    [Nickerson 1981, p. 55]. In this respect it is unlike an an interrogation which
    is controlled exclusively by an interrogator. It is related to a number of other
    properties of conversation such as bidirectionality, apparentness of who is in
    control and shared rules for the transfer of control and structure [cf. Nickerson
    1981].


    Bidirectionality refers to the two-way exchange of information which distinguishes
    a dialogue from a monologue. It necessitates a switching of speaker and listener
    roles at least once in the conversation. At one level, initiative can be said
    to reside with the party currently occupying the speaker role, and mixed initiative
    to a shared ability to switch roles. However, at another level, initiative might
    reside with the party governing the switching of speaker and listener roles. Mixed
    initiative in this sense has to do with the negotiation of who is ''in control''
    at any moment irrespective of who is speaking. The apparentness of who is in control
    is an important aspect in such negotiation, and in any'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Legal Applications of KBS


    conversational situation there usually be some kind of structure to the way control
    is negotiated and exchanged. Observations of human conversations structure have
    led to the proposition of certain rules for the transfer of control (e.g. Sacks
    et al. 1974).


    There is growing appreciation for the need for mixed initiative dialogue, especially
    in interactions with knowledge-based or expert systems. A common criticism is
    that existing dialogues are too tightly controlled by the system, and do not allow
    the user an active role in the process of obtaining advice and information (e.g.
    Coombs and Alty 1980). This has led to the development of more cooperative problem
    solving systems in which the responsibility for arriving at the correct solution
    is shared between user and system [Kidd 1987]. Similar trends are evident in the
    design of dialogues to make the kind and level of information given out by such
    systems more responsive and reactive to student interventions in its presentation
    (e.g. Cawsey 1989), [Moore and Swart 1988]. Moran [1987] has described this trend
    as a move towards greater interactivity


    Despite this endorsement of mixed initiative styles of interaction, there is currently
    no recognised set of dimensions along which initiative can be described as ''mixed''.
    This makes it very difficult even to discuss the mixed initiative properties of
    any existing system, much less to compare the effectiveness of various mixtures
    across systems.


    For this purpose we propose a simple terminology to do with the possible ways
    in which the initiative or control of a human computer conversation can be allocated
    and switched between parties. These are as follows:


    +   Starting

    Who has the initiative to start the interaction?


    +   Overall mixture of initiative

    Who has control of the interaction ?


    +   Local mixture of initiative

    How can the user take the initiative from the system?


    +   Taking from

    How can the initiative be taken from the user?


    +   Giving to

    How can the user give the initiative to the system?


    +   Given to

    How can the initiative be given to the user?


    +   Stopping

    Who has the initiative to stop the interaction?


    We distinguish between who is in overall control from who is occupying the speaker
    role. When discussing the local mixture of initiative we'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'define activities from the user''s viewpoint that help to distinguish mixed

    from non mixed initiative systems. Any system whose initiative cannot

    decribed in these terms is not a mixed initiative system. This is

    because the terms are expressed as possible transitions of initiative and

    cannot be applied to completely system or user-led systems in which the

    initiative remains with the same party throughout.


    They also help to make clear the extent to which the initiative in

    any interaction can be mixed. This will show up in the combination of

    descriptions under each heading. For example, an interaction which is

    started and stopped by the system but susceptible to temporary user

    interruptions, might be described as one in which the initiative can be

    taken but not given by each party.


    Lastly, the same terms useful for describing the way in which

    initiative is mixed in practice. Such descriptions are essential in any discus-

    of the advantages of mixed initiative interaction, since it is per-\fect possible
    to design a system which supports a switching of initiative\which is never used
    by either party.


    In the rest of this chapter we use this terminology to describe the

    design and evaluation of three styles of interaction, varying in the extent

    to which initiative was shared within them. The aim of this exercise is to

    identify common problems in the design and use of mixed initiative syst-\ and
    to indicate the success or otherwise of various solutions

    have explored.


