  md: '# Analysing texts for knowledge based systems


    notorious for having the lowest take-up rates.


    But there seemed to be confusion in the minds of some members of the public between
    information relating to means-testing and information relating to contribution
    records for contributory benefits. Both are financial and detailed.


    # 11.3. REPRESENTATION AND INFERCING


    The choice of an object-oriented approach using entity-attribute-value EAV triples,
    the use of frames for classes and instances, and the use of constraints and rules
    for inferencing, described in detail and justified in Chapter 12 of this book,
    was not rehearsed here. However, these choices had implications for what knowledge
    could be expressed and how that knowledge could be used by the demonstration systems.
    These implications are crucial to an understanding of the knowledge work of the
    project.


    # 11.3.1. Time


    The representation selected did not lend itself to dealing with time. Dates, for
    example the ‘date of claim’, could be represented. Durations of time could be
    calculated from these dates, but there was no temporal reasoning available. Expressing
    future eligibility was not straightforward enough to determine, for example, a
    person who was not eligible for a benefit ''today'' would become eligible for
    that in the future — given the passage of time and the only changes in material
    circumstance being those of the kind that could be predicted on the basis of the
    information available.


    Hence the Advice System was developed only to be able to determine whether, for
    example, a claimant would be eligible for the benefit for the nominal ''today''.
    If ''today'' was the last day of eligibility there was no comment to that effect
    in the advice given. The restriction about ''today'' was implicit not explicit
    in the rules which were compiled into the systems source code.


    Similarly, it was not easy to introduce time triggers, for example to alert the
    system user that a claim would have to be submitted by a certain date or the benefit
    time-limit would have been missed. Time-relevant advice could, however, be given
    by creating properties on frames to hold precomposed text which could be displayed
    to the user. But this use of properties to hold hard-coded messages is far short
    of what would be possible if there had been temporal reasoning available for knowledge
    base designers.'
