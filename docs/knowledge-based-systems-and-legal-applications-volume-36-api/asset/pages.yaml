    # 7.8. LOCAL OFFICE DEMONSTRATOR 3 (LOD3)


    While LOD2 was being developed, its designers had been faced with a long list
    of demanding requirements. It was not clear whether some of these requirements
    could be met at all, how well others could be met, or whether some of the requirements
    conflicted with others. A literal reading of the requirements had led to a view
    of the system as having many parts, and strongly modal behaviour. This, coupled
    with the daunting nature of the list overall, had led to a rather piecemeal approach
    to the design and construction of LOD2.


    While LOD2 was never completed, and what there was of it had arrived, it fulfilled
    the intention of a ''prototype'' in giving a concrete basis for discussion between
    ''requirement owners'' and designers. It gave a clear indication that we were
    on the wrong track, and would have to reconsider our earlier intention to use
    LOD2 as a ''shell'' within which we could scale up the domain knowledge and detailed
    user interface to produce LOD3. Some time was spent re-evaluating and prioritizing
    requirements. The following list was produced in early October 1988:


    +   1. Needed throughout the system:

    (a) data input by user, validated by system;

    (b) access to explanations in terms of the legislation used;

    (c) ability to work on a claim with incomplete information;

    (d) system prompts for information should make clear why the information is needed;

    (e) on-line browseable manuals and legislation;

    (f) on-line help with use of system (e.g. input formats);

    (g) support for the styles of subtask as described for LOD2;

    (h) support for appeals submissions (in terms of ability to review the working
    of a completed case, retrieving explanations in terms of the legislation used,
    possibly with the additional ability to select and assemble standard pieces of
    text together with parts of the explanation and case data within a standard textual'
