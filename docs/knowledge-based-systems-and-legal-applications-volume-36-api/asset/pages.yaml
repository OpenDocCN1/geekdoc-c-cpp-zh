    so difficult for an artificial intelligence system. I Paradoxically, the cases
    that are most tractable for an artificial intelligence system are those cases,
    usually involving commercial and corporate matters, which a lawyer finds most
    complex. There is a simple reason why this is. I Because of their technical complexity,
    the legal rules at the top levels of this conceptual hierarchy are difficult for
    most lawyers to comprehend, but this would be no obstacle for an artificial intelligence
    system. The commercial abstractions, in fact, are artificial and formal systems
    themselves, drained of much of the content of the ordinary world.


    [McCarty 1980b]


    What McCarty is referring to here, of course, the difficulty of representing common
    sense in a computer program, and a number of projects to be described later would
    seem to confirm his analysis. It is important not to misunderstand what McCarty
    is getting at. The artificial worlds of commerce and taxation eliminate some of
    the problems of dealing with the ordinary world, but they are still filled with
    textured concepts whose (technical) meanings shift and evolve as new cases are
    decided. The representation of open textured concepts is a main theme in McCarty''s
    work on TAXMAN II.


    # 1.12.2. Commentary


    There are two main points to be made about the TAXMAN I system: the nature of
    the analysis that the system performs; and the significance McCarty attaches to
    the choice of primitive concepts, and the use of adjectives ''deep'' and ''structured''
    in this context.


    It is very straightforward to reconstruct the TAXMAN I system in logical terms.
    Template instances correspond to sets of assertions about an individual object
    together with an object-oriented indexing scheme, exactly as in the now familiar
    reconstruction of frames as ''bundles of assertions''. See for example [Hayes
    1979] and [Charniak and McDermott 1985]. The reconstruction of frames as ''bundles
    of assertions'' is criticized because it overlooks one of the fundamental motivations
    for frames, which is to deal with concepts - stereotypes or ''natural kinds''
    — that do not admit definition in terms of necessary and sufficient conditions.
    The reconstruction of TAXMAN I templates as ''bundles of assertions'' is accurate.
    The attempt to deal with stereotypes and precisely defined concepts is what characterizes
    McCarty''s later work on TAXMAN II.


    If this reconstruction is carried out, then logical templates can be viewed as
    ''if and only if'' definitions. As McCarty [1983a] points out, the matching of
    a logical template to the frames of a case for the purpose of recognizing whether
    a higher-level concept holds can be viewed as'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# The Representation of Law in Computer Programs


    reasoning backwards from the conclusion of the defining rule to its conditions.
    TAXMAN''s use of templates (bundles of assertions) is convenient for the kinds
    of object it manipulates, but the inference mechanism employed in TAXMAN (TAXMAN
    I) can be reconstructed straightforwardly as a logic program. (It can also be
    reconstructed in the spirit of the ''event calculus'' [Kowalski and Sergot 11986]
    which would treat transactions and reorganizations as primitive concepts rather
    than describing them indirectly in terms of transitions between states). In this
    respect, TAXMAN might have been classified as an example of logic programming
    applied to the representation of law (except of course that it predates that particular
    technique). Note that TAXMAN I, like all the systems considered so far, represents
    only a single, fixed interpretation of the legal sources on which it is based.
    TAXMAN II can be regarded as an attempt to remove this restriction.


    The significance of TAXMAN''s ''deep'' and ''structured'' conceptual model of
    the underlying legal domain is more difficult to explain. What McCarthy is addressing
    is the question of how one should take the primitives in terms of which everything
    is represented. In the area of corporate law, a natural set of primitives would
    include concepts as ''stock'' and ''corporation'' and some representations of
    how they relate to one another; by comparison taking TTP and family actually 50%
    or more (in value) of the stock of a corporation which is a partner in a partnership
    which owns Redcorp ''stock'' as a primitive concept just seems wrong.


    In order to understand a piece of legislation, it is clearly necessary to understand
    something of the domain in which it operates. A program needs this, and it can
    be argued that an explicit representation of some part of the underlying domain
    is just as important as an explicit representation of what the legislation itself.
    I think this is why McCarthy emphasizes the nature of the conceptual model in
    the TAXMAN representation. I think ''deep'' and ''structured'' are used here as
    relative terms: TAXMAN''s representation is ''deep'' and ''structured'' when compared
    with CORPTAX''s ''shallow'' and ''structured''. (The adjective ''deep'' can have
    other meanings. Some of these are pointed out in section 1.13.4.)


    It seems clear that ''deep'' representations are preferable to ''shallow'' but
    I want to make an additional remark about what happens in practice. If one considers
    an example like the representation of the British Nationality Act referred to
    in section 1.10.2, one sees that undefined and therefore primitive predicates
    like ''was abandoned as a new-born infant in the UK'' often appear in the representation.
    These ''hyphenated predicates'' are just like the unstructured questions posed
    by CORPTAX (and indeed in a system like APES they generate exactly this type of
    question). This might suggest that the underlying conceptual model for the British
    Nationality Act representation is shallow in the'
