    # 15.2.5. Evaluation, validation and acceptance, maintenance


    and future development


    Issues of evaluation and quality assurance arise not only with regard to a delivered
    system but also to the changes to that system that ensure it maintains its validity
    and relevance. For this reason, evaluation cannot really be separated from questions
    of maintenance. Too often the term evaluation is limited to verification and validation
    of the system in terms of its meeting the requirements specification, containing
    valid knowledge and providing correct answers, inferences and advice. This provides
    assurance that the system ''does what we wanted to do''; the other, and perhaps
    more important issue, however, ''whether we were right in wanting to do that in
    the first place''. In terms of legal applications there are four aspects of parameters
    that can be considered:


    +   1. The legal correctness of the knowledge base.


    +   2. The legal and political appropriateness of the functionality of the system.


    +   3. The organizational suitability and usefulness of the knowledge base.


    +   4. The quality contribution that the system will make to the decision making.


    It may be felt that these issues of quality assessment really go beyond the province
    of what the KBS system designer can hope, or indeed be expected, to. Surely, it
    may be argued, the system developer can only work to a clear specification with
    objective performance criteria and can therefore only be expected to establish
    that the delivered system actually meets these requirements. In our experience,
    this view has been shown to be excessively naive and essentially untenable in
    many areas of KBS developments. Firstly, the requirements specification needs
    to be negotiated with the system users who cannot be expected to understand the
    impact of consequences of many of the design decisions. Secondly, the performance
    criteria cannot be expected to be ''objective'' when the decision making itself
    is subject to interpretation, discretion and alternative evaluation, and when
    the task can be segmented without destroying the underlying coherence and logic
    of the decision making.


    Thirdly, the scope and the detail of the requirements and the performance criteria
    are unavoid subject to change — in time and'
