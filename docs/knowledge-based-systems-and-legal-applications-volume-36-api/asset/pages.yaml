    There were both practical and conceptual justifications which led us to merge
    the two areas into a local office application (aimed at providing decision support
    to adjudication officers in DHSS local offices), working on the assessment of
    Supplementary Benefit and its planned successor, income support. Practically,
    resources were scarce and had been unevenly distributed. Conceptually, our analysis
    during the first eighteen months of the project raised some concerns that the
    separation of three demonstrations, when considered from the perspective of the
    user requirement, was over-simplistic and essentially misguided. It became clear
    that it was dangerous to try to separate the treatment of hard and easy cases
    - not least until a case is finished to be sure what kind of case it is. Furthermore,
    the encoding of a large number of rules within a traditional knowledge based system
    did not obviously satisfy any existing need amongst DHSS staff - there was greater
    concern identifying which of the known rules would be applicable for a particular
    case, how those rules should be interpreted, what additional information was necessary
    before a decision could be safely arrived at. Lastly, it was questionable whether
    the training could really be separated from the decision making proved to be essential
    to the development of staff during their decision making activities, rather than
    in a separate training environment. The emphasis on training was therefore changed;
    rather than continuing to examine specialized computer-based training systems,
    the potential for the decision-support systems themselves to have a training rule
