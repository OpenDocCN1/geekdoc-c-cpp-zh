- pgno: 175
  md: 'adjudication officers were interviewed in six local offices around the country,
    and their reactions to the proposed developments were elicited and analysed. The
    most sustained and significant effort in evaluation was carried out with a variety
    of headquarters and monitoring staff, including policy, OACAO, regional directorate,
    monitoring officers, training personnel and central management staff.


    An evaluation of LOD3 by the Department of Social Security itself took in its
    model office at Preston in early 1989; the report on this evaluation concluded:


    Users were enthusiastic about the concept and saw that a valuable product was
    developing. There are indications that adjudication standards might improve using
    the LOD system and that monitoring arrangements could be made more effective.


    Users saw some potential in the LOD concept and recommended that further development
    should be funded and end users involved in this development.


    From our point of view, LOD3, so far as it went, was, very successful. It obliged
    the user to consider and use the latest conditions, to consider every relevant
    point, and to record decisions properly. Full details of the case, evidence and
    reasons for decision could then be available for future reference by appeals officers
    and monitoring staff. The system also had potential for producing better explanations
    of decisions for claimants (which might itself reduce the number of appeals).


    While we had not had time to incorporate most of the intended explanation capabilities
    or support for the preparation of appeals submissions, the addition of such facilities
    to the LOD3 design did not appear to present serious technical problems.


    The hierarchical arrangement of topics allowed a large system to be developed
    without overwhelming, and was easy for the user to navigate around. It did, however,
    sometimes lead to design difficulties, as much of the case handling involving
    a matrix of individuals and their circumstances, and the best choice of dimension
    of this matrix along which separate topics seemed to vary between different parts
    of the system.


    More work was needed on ‘structured dialogue’, as it did not yet support all the
    Toolkit rule constructs. More generally, whereas we had devoted much attention
    to maintainability and flexibility of the knowledge base, it was clear by the
    end of the project that any product based on the LOD design would need an HCI
    definition language in addition to the knowledge representation language, and
    tools would be needed to assist developers in building and maintaining the knowledge
    base and user interface in parallel.


    One of the key issues with the interaction is the degree to which we succeeded
    in providing the user with sufficient flexibility to match'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Legal Applications of KBS


    159


    their own skills and support needs. We were continually concerned about responding
    to the accusation that LOD would be useful for inexperienced AOs or in a training
    mode but be too slow for experienced AOs. Unfortunately, the requirement never
    to slow the experienced AO is actually incompatible with a desire for better quality
    in the decision making. AOs would only be able to make decisions more quickly
    without using LOD if they were not adequately documenting and recording their
    work, i.e. they were doing it more quickly because they were carrying out the
    whole process in their heads and not documenting their thoughts.


    The time-consuming parts of LOD are not related to the system''s response times
    or the time taken to find the right form to fill in or assertion to make. If it
    were either of these we would believe it could be improved. Rather it is with
    the filling in of the information. This is surely the point — should not have
    a different system from LOD, because all of our work indicated that LOD would
    be quicker than other support designs, but rather should be made to use a system
    at all when would undoubtedly slow them down by virtue of having to record information.


    In retrospect, we feel that the most significant aspect of LOD3 was the way in
    which it combined ease of control and transparency to the user with logical inference
    capabilities and the ability to retrieve relevant legislation and guidance. Most
    work on based decision support in legal applications is either based on information
    retrieval or on logical encoding of legislation or on procedural support based
    on expert knowledge. Each of these, taken on its own, has shortcomings, as described
    in the following sections.


    # 7.11.1. Information retrieval


    Systems based simply on information retrieval tend to be too passive — the user
    has to know that they have a problem, what type of problem it is and where to
    start looking for an answer before the system is any use. Such a system would
    not necessarily be useful in improving the quality of decision-making.


    It could be useful when people were dealing with a type of case which had not
    handled before. It would not help, however, with the cases where people thought
    they knew how to handle a case but were wrong (e.g. because the conditions had
    changed recently). In fact the process of central, electronic, updating of manuals,
    would mean that the possibility of the decision makers noticing that a set of
    conditions had changed while they were updating their manual would be lost. There
    have been examples in other organizations where having access to supporting guidance
    led the decision maker to think that they knew how to handle the case when in
    fact they did not — they were looking at inappropriate guidance.'
