- pgno: 256
  md: '# Legal Applications of KBS


    capabilities of the toolkit, discussed in the section on representation and inferencing
    above, and the content of the rules that emerged from careful study of the handbooks
    we used as sources for the final knowledge-base.


    # 11.4.6. Local Office Demonstrator


    In addition to the examination of specific benefits such as mobility allowance
    in the early days of the project, the Local Office Demonstrator team undertook
    organizational analysis and task analysis related to the adjudication of supplementary
    benefits claims and later analysed the task of making decisions related to income
    support claims.


    # Organizational analysis


    The approach to organizational analysis used was based on the soft systems methodology
    of Peter Checkland. This approach accounts for the emphasis placed on the variety
    of organizational perspectives on the activities involved and in the knowledge
    associated with those activities. It also led them to view knowledge as part of
    organisational communication rather than a neutral objective commodity.


    # Task analysis


    The task analysis involved a number of different elements. The explicit task of
    the local office decision maker was analysed, as was the knowledge used during
    the task. They produced an underlying model of how decision are made. Particular
    regard was paid to the type of knowledge used and its role in the decision making.
    They used:


    +   1. Structured interviews, recording of task diaries, monitoring of problems
    and analysis of the results of individuals responsible for monitoring performance.
    The people interviewed have been determined by the previous organisational analysis.

    2. Development of rational reconstructions of ‘worked examples’, including an
    analysis of the decision sequences, the results of decisions, the justifications
    of decisions and the authorising knowledge appealed to. Analysis of ‘mistakes’
    in decision making and attempts to explain the origin of the mistake. This required
    reference to texts on the nature of legal decision making as well as detailed
    discussion with trainers and monitoring officers.


    > [Alvey-DHSS Large Demonstrator 1984–1989 Final Report, p. 18]


    # Knowledge analysis


    Context was as important as the LOD knowledge base. The team felt strongly that
    the source of knowledge should be clearly represented along with the knowledge
    and even be encoded with it in the system'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'users could examine it to see if the perspective in the knowledge base accorded
    with their own. This feature was particularly apt in an environment where the
    status of the knowledge (e.g. guidance versus instructions) was a factor in the
    weight given to it and where users personally were legally accountable for the
    decisions they took, even those based on support from a computer system.


    The team undertook both ''broad'' and ''narrow'' analysis. The former term given
    to the initial, domain-wise, stage of analysis, the identification and work on
    interconnected ''topics'' such as membership of the family and amount with its
    related topics capital, income, and applicable amount.


    The LOD ''domain knowledge base'' was structured around the topics identified
    in this broad analysis which was carried out by a small number of analysts sharing
    material. ''Narrow analysis'' described in some detail in the section on knowledge-base
    development and building below was the term given to work within the topic. It
    involved a larger number of analysts working at different sites and periodically
    checking with one another, until the end of the project when they were able to
    gather at one site and share structures.


    # 11.5. STRATEGIES ADOPTED IN DEVELOPING AND BUILDING KNOWLEDGE BASES


    # 11.5.1. Local Office Demonstrator


    The size of the LOD analysis team and their geographical spread encouraged them
    to devise strategies for independent but co-ordinated working. The fact that they
    were focusing on a single benefit, income support, and considering it in great
    detail meant that the same classes and attributes names would need to be used
    by a number of people. Their approach was to divide the work ''horizontally''
    with some of the same analysts working on more than one layer. The first layer
    was the broad analysis'' in which the topics were identified and the portions
    of the source material linked to appropriate topics. During this analysis entities
    and their attributes were identified and named. This created ''data structures''
    and ''topic structures'' which were used as source material for the next layer,
    the ''narrow analysis''.


    Narrow analysis focused on the rules within each topic, formalised their logical
    structure (representing the body of each rule as an AND/OR tree), and made a step
    towards formalizing the constituent propositions (i.e. the part which said what
    was being asked or concluded about the entity), and the wording of which [was]
    copied directly from the source material (and then edited where necessary in order
    to give a more concise or less context-dependent representation while preserving
    meaning). The tool being used to support'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'this work (KANT) allowed the representations of rules and their constituent
    parts to be linked to the relevant places in the source material; a different
    type of link was also used to link propositions for which guidance on interpretation,
    was available...to the place in the source document where that guidance was provided.
    Topics could be handled substantially independently of any one once the links
    between them had been identified. The choice and naming of entities/classes were
    periodically co-ordinated between topics.


    As each set of semi-formal rules was produced, ''narrow analysis'' continued by
    creating another set of structures indexed by the class of entity referred to
    and informal categories of position within each class (e.person/things to do with)
    and accumulating copies of all the semi-formal propositions therein. The copies
    of propositions in these categories were linked back to the corresponding propositions
    in the semi-formal rules. The structures used at this stage were shared between
    the analysts; anyone was free to add content to the existing structure, but changes
    or extensions to the [Alvey-DHSS Large Demonstrator 1984–1989 Final Report, p.
    25] structure itself had to be agreed between the analysts.


    KANT might be described as a hypertext-like outliner with a number of additional
    facilities such as the recording of provenance (i.e. which analyst created or
    changed the nodes in the structure and when it was done) and in later versions
    the propagation of jeopardy (i.e. alerting the analyst that something a node depends
    had been altered and should be inspected to see if the node as it stands is valid).
    KANT had been designed to suit analysts who in the main had little or no experience
    with programming or using structured editors of the kind available on the Xerox
    machines we were using.


    The encoding of the rules and creation in the knowledge base of classes (with
    their attributes) for the rules to operate on was carried out as a third layer
    of effort and was largely undertaken by people other than the analysts. The tool
    used for most of this work was either the structured editor available in the Xerox
    environment or the Knowledge-Base Builder (KBB).


    # Advice System


    After recognizing the difficulties involved in handing over from an analyst to
    an encoder, one of the lessons learned in the work on the detailed child benefit
    knowing, being few people to co-ordinate and both of us being interested in the
    full range of source to code transformations, the Surrey team adopted a vertical
    division of labour, rather than the horizontal one used by the LOD team. The range
    of benefits we covering was divided into means-tested and non means-tested.


    ![](img/fd9daa466aa6610f0ebd57e2ccc632c5_258_0.png)'
