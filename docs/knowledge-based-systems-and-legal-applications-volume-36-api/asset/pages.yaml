  md: '# Legal Applications of KBS


    # 11.2. THE DOMAIN


    The domain of application for the project as a whole was UK social security welfare
    benefits. Analysis of welfare provision, D(H)SS organisation, training for adjudicators
    and for local office staff who administered benefits, the practices and problems
    of advice givers in non-D(H)SS advice agencies, and was carried out by social
    researchers in the claimant information team during the early months of the project.
    At this time it was anticipated that organizational and domain analysis for both
    supplementary benefit application (as it was then) and the claimant applications
    would be undertaken by social researchers on the CIS team at Surrey. This work
    and subsequent analysis of members of the public experienced welfare needs and
    welfare provision showed how difficult it was to scope systems using this definition
    of the domain. It highlighted the difficulties in setting domain boundaries and
    in making decisions about organizing principle should be used to structure domain
    knowledge.


    # 11.2.1. Scope


    It was particularly difficult to know what to include as UK welfare benefits for
    the purposes of the project. One view expressed early on in the project that welfare
    benefits should be taken to be social security benefits administered by D(H)SS
    local office staff who followed the Fowler Review as this was the system which
    evaluators would be familiar. This view would have been severely limiting, though,
    as it would excluded all non social security provision of the kind delivered through
    the local education authority and local authority services departments. It would
    exclude social security benefits which are administered by the D(H)SS by other
    government departments, such as unemployment benefit which is administered by
    the Department of Employment or are administered by local authorities. Benefits
    such as child benefit which are administered by the D(H)SS but administered centrally
    rather than locally would also have been excluded.


    The time boundary needed to be moved beyond the Fowler Review for the demonstrators
    to be timely at the end of the project. The analysts for LOD and policy were able
    to use early versions of Income Support Regulations for early work, however detailed
    analysis of the post-Fowler benefits by the CIS team which had decided to use
    sources in the public domain had to wait until the regulations were published.
    All of the systems developed during the project adapted to the change from pre-Fowler
    to post-Fowler benefits. In particular supplementary benefit was replaced by income
    support and FIS by family credit. It happened that the end of the project came
    at the time when it was not unreasonable to exclude transition arrangements and,
    as claimant histories were not'
