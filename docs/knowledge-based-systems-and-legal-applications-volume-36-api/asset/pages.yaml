    # 8.6.3. A Vision of the future


    One could envisage, in, say, for ten years, after a period of further development
    to achieve the functionality outlined above, a situation where the whole of the
    DSS policy function is computerized and that a support system like P4 is in routine
    use. Each policy branch would be using powerful networked desktop computers. The
    system would support fully integrated office automation software which, in its
    turn, would be integrated with the policy support software. OCAO (perhaps) would
    be the repository of the legislation, argumentation and knowledge databases but
