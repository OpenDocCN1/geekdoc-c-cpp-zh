    # 15.3. CONCLUSIONS


    This chapter has tried to emphasize the range and variety of organizational issues
    arising with regard to the introduction of KBS in legal applications.


    The general conclusion is that the majority of the issues are as unresolved and
    largely unaddressed. This should be worrying for any organization considering
    such a development — and in particular those who stand to be affected by the system.
    Unfortunately there is little evidence from past systems that much will be done
    to address these issues until there is some failure which ascribable to them.
    For those organizations that wish to pre-empt such failures, this author would
    recommend three general principles or considerations.


    Firstly, the introduction of these systems cannot be seen simply as a process
    of analysis and development carried out by system designers and handed over to
    users. Greater emphasis needs to be placed on the processes of presentation, introduction
    of the system into the organization, continuing evaluation of the use of the system,
    and regular changes to the system based on the monitoring of its effects. In principle
    this may not seem different from traditional systems development. The concern
    is that with systems which come so close to the central decision processes of
    people in the organization, and have the potential for substantial effects, far
    more continuous effort is required to monitor the effects and respond to necessary
    changes.


    Secondly, there is the general question of the relevance and appropriateness of
    methodology for addressing these issues. Earlier in this chapter it was argued
    that methodology had to be secondary to design skills and the creativity and sensitivity
    of individuals. These individuals, it follows, should ideally be skilled in organizational
    analysis, knowledgeable about the capabilities of the technology and able to explain
    these to non-technical users, and thoroughly conversant with the decision processes
    and practice of the domain. These are highly specialist skills which there is
    little evidence of in the systems design community. External consultants seldom
    have the time to build up the depth of understanding of a particular environment
    and organization. Equally, however- trained or practising lawyers cannot be expected
    to have sufficient expertise — not only because they lack the technical and organizational
    perspectives but also because they have little general knowledge of the practices
    and procedures outside their own domain of expertise.


    The required role is really one of an ‘internal consultant’ who can'
