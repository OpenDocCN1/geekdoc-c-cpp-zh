  md: '# CHAPTER 9


    # THE CLAIMANT ADVICE SYSTEMS


    Nigel Gilbert


    There are two claimant information systems: the Advice System and the Forms Helper.
    Both systems aim to show how current IKBS and HCI technology could be used by
    large legislation-based organizations to assist in their interaction with the
    general public [Crossfield and Gilbert 1986]. The purpose of the Forms Helper
    is to help people fill in complex application forms. It has been designed to minimize
    the problems which many applicants experience in filling in conventional paper
    forms, thus reducing the likelihood of errors in the completed form. This benefits
    the organization in terms of increased customer satisfaction and reduced resources
    devoted to locating and correcting errors, as well as having obvious benefits
    for the form-filler. The Advice System aims to provide information to claimants
    and potential claimants about their eligibility for welfare benefits, the procedures
    they should use to make claims, and the social security system itself. It functions
    as an expert system, unlike most conventional expert systems it is designed for
    untrained users. The System demonstrates how IKBS can be used to provide a flexible
    and helpful information service to the general public on issues that are intrinsically
    complex, such as social security [Gilbert 1985a, 1985b].'
