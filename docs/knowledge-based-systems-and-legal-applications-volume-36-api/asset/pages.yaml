  img_proc: true
- pgno: 116
  md: '# Legal Applications of KBS


    Other forms of variety arise from external factors. For certain policy problems
    their starting point is the evaluation of a number of obvious, if not predefined
    options; for others it is the working up of arguments and counter arguments for
    against a solution already favoured by the Minister. Moreover, the life cycle
    of policy development means that in many cases a policy problem takes the form
    of a review of existing policy than a new policy development. This variety in
    the character of policy is influenced by factors such as the particular government
    in office, together with its time in office and current political standing.


    These factors can be responsible for the sometimes shifts in context — periods
    of more radical and innovative policy changes affecting benefit structures through
    the more conservative tidying up of policy for certain classes of people.


    These variations help to explain the different opinions about what is ''typical
    policy''. It was particularly noticeable how social security policy varied over
    the period 1983-1989 — from the maintenance of an ''old'' supplementary benefit
    with identifiable anomalies, through the wide consideration of options and major
    conclusion of the reviews, to the current, predominantly defensive, justification
    and minor amendments to the new scheme of income support.


    The implication of this is that the policy process cannot be seen as a pre-established
    set of tasks with a policy start or end, or with recurring, we do believe that
    within this fluid environment there is a consistent and uniform set of processes
    which act as conceptual components in the policy task and which are drawn upon
    and combined by policy staff to achieve their specific purposes.


    # 4.2.2. Conceptual components of the policy task.


    In a simple sense the policy process can be seen as being directed towards the
    development or amending of legislation in order to remove anomalies and inequities,
    and/or to achieve certain policy goals. Even with this simple conception it is
    important to distinguish between the process of policy formulation and that of
    drafting legislation. It is the role of the solicitors within the government department
    to draft the legislation; the policy maker''s role is to specify the aims which
    the legislation should help to achieve, and the general means by which these aims
    should be achieved. Looked at in this way, the task of policy formulation can
    be seen as following a number of stages including:


    +   1. Verification that an issue/problem exists.

    2. Clarification of the origin and character of the issue.

    3. Identification of ways of resolving the issues.

    4. Articulation of candidate ''options''.'
