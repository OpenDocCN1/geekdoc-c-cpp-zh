  md: 'called links, but I shall avoid using link in that sense, reserving it for
    the concept of arc (denoted in the diagrams here by horizontal lines or arrows).
    Labelling the brackets with their logical operators did not eliminate the need
    to ''teach'' people to read the diagrams, but once the principles had been introduced,
    the label was there as a constant reminder about the easily forgotten feature,
    the meaning of the brackets.


    It became apparent that these diagrams were an effective way of representing the
    information coming into the consideration of, say, a bereaved woman''s entitlement
    to contributory work''s benefit and the ''outcomes'' available when considering
    that information. The former comes from the left, is conceptualized in more detailed
    until the concepts are appropriate for making decisions. They then are elements
    of conditions which are grouped using square brackets labelled with the logical
    operators. The eventual ''outcomes'' are given in boxes, a symbol I added to those
    provided by SGN. I also found it necessary to introduce a disjunctive, the back
    bracket labelled with an ''or''. This denotes that the path along the arrows would
    be followed if any one of the nodes ''applies''.


    The steps along the path, what would usually be an arc or a link in most graphs,
    are not explicitly assigned any meaning. In this example, the meaning of the cause
    of death link (top left, the arrow following that node) is (unusually) given as
    part of the node label. It would be read in full as ''established being related
    to one of the following three cases''. The deceased is implicit and would be read
    as ''must be in terms of the following four characteristics''. Similarly for the
    claimant link AND for the contributions link (which should have been labelled
    AND special than EOR as in this version). Links at the next level have different
    meanings. They can be read ''can be given by one of the following values'' or
    more simply ''is/was''. Links at the next level go into conditionals and have
    no meaning beyond the meaning of the conditional itself, i.e. ''if... logical
    operator ... then...''. Noting that the links have such different meaning leading
    of the links on the child benefit diagrams produced later to be labelled explicitly.


    These were richly heterogeneous networks as the links and the nodes were concerned:
    quite unlike trees, which are designed to be single relation hierarchies. One
    such simple relation hierarchy is the decomposition tree where the relation connecting
    nodes is ''is part of'' throughout. Another is one where the relation is ''a kind
    of'' or ''is a''.


    Child benefit was selected for the next analysis exercise although it was a simple
    to claim benefit it was a fundamental benefit. Definitions in its regulations
    were the basis of definitions for terms in other benefits. Also a person who qualified
    to special status in respect of get child benefit in respect of a child had some
