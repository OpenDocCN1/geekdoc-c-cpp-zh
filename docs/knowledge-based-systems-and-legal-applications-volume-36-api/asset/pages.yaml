    # 7.3. INITIAL AREAS OF INVESTIGATION


    Early in the project, separate application teams addressed ''procedural'' and
    ''judgement'' decision support, in the respective areas of supplementary benefit
    and mobility allowance assessment. Supplementary benefit assessment involved a
    large number of decisions, most of which were, taken in isolation, straightforward.
    Difficulties arose from the large number of interrelated rules. Mobility allowance,
    in contrast, rested on a single decision involving a great deal of human judgement,
    taking into account a substantial body of case law. A third team investigated
    the possible user of computer-based training systems for DHSS staff.


    The supplementary benefit application produced two major types. The first had
    a form-based interface which displayed various fields, corresponding to those
    on the claim form, for completion by the adjudicator. On base of this, a second
    form comprising entitlement details would be completed. The key question was seen
    as determining which fields from the claim form were relevant to the claim, so
    as to minimize the amount of information that needed to be transferred in order
    to make a decision. The system was underpinned by a set of production rules. These
    rules were first examined to see which fields were known to be relevant to the
    decision, as disclosed by backward chaining from overall entitlement. As the form
    was completed, the same rules were used forwards, drawing conclusions from the
    information as it was entered.


    The prototype was implemented on a very small rule base: problems'
