    # 12.6. USEFULNESS OF FRAMES


    In the above we discussed that frame representations as currently did not fit
    well with legal representation because of their unsatisfactory treatment of definitions.
    The less frames do have wide appeal, and this appeal is explicable in terms of
    what Ringland calls in [Ringland 1988] ‘bundling’ aspect. When people conceptualise
    the world they find natural to think in terms of objects with attributes, and
    of different classes of objects with characteristic and different attributes.
    This notion lies very deep in our conceptual framework, as is indicated by Somers,
    e.g. [1963] and Kiel, e.g. [1979]. Given that this is a natural way to effect
    this kind of division, it seems unwise to reject such systems because to of frame-like
