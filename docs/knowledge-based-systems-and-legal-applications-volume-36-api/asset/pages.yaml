    composed of senior representatives of the collaborating organizations, to which
    the whole project reported through the project manager. This team was intended
    to act as ''board of directors'' to the project providing strategic guidance.
    It met quarterly throughout the life of the project, reviewing progress and plans
    and providing direction where needed. The project itself originally had a single
    applications team which was to investigate six different application areas, an
    integration and support team and a Design Control team with each manager who reported
