    Few organizations are developing such people, however.


    Lastly, in terms of their social impact, it is probably important to maintain
    a reasonable perspective on the dangers associated with these systems. The chances
    of systems failing due to insufficient consideration of human issues are considerable.
    The likelihood of undesirable social consequences resulting from these systems
    is more questionable. Certainly, focusing on the technology per se is likely to
    serve little purpose when the organizational stereotypes and managerial expectations
    have by far the greater impact. The objective of organizational analysts should
    be to demonstrate the options available and the formative context in which decisions
    are made so that the political nature of the decisions is not hidden behind the
    inevitability of the technology.'
