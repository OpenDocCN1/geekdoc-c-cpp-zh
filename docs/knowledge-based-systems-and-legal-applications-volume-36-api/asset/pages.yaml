    MAREK SERGOT read mathematics at Trinity College, Cambridge and worked in mathematical
    modelling before joining the Logic Programming Group of the Department of Computing
    at Imperial College, London in 1979. He was appointed as a lecturer in 1985. His
    research interests centre on the use of logic for knowledge representation in
