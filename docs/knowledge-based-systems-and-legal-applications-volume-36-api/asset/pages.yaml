    # 10.7. TRAINING


    It became clear that more effort should have been spent on training the group
    as a whole, and its leaders in particular, at a very early stage in a number of
    management techniques and in communication and presenta- tion skills.


    The abilities and inclinations of the staff varied tremendously across the project
    and many would have benefited greatly from some early exposure to existing techniques
    rather than having to use trial and error. Teams were asked to make presentations
    of their work at the half-yearly workshops and often fielded all their staff in
    an effort to make everyone involved. Many of the presenters, however, found this
    an ordeal and this lack of confidence together with their lack of preparation
    reduced the value of the presentation considerably. Formal technical training
    in programming in Interisp-D was purchased from the supplier for at least one
    member from each site but was available in the other technical areas in which
    the project became interested.


    # 10.8. DEMONSTRATIONS


    In the event of the demonstrations occurring in the first three years were internal
