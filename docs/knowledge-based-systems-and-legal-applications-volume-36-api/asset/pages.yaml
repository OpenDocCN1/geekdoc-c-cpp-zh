    components (e. forms). This gave us a powerful and flexible way of controlling
    the system scope, by exposing the correlation between components of the task,
    content of the knowledge base, and user interfacing requirements. supplementary
    benefit and its successor, income support, are both ''safety net'' benefits, at
    ensuring that families are provided with sufficient resources to meet their essential
    requirements. As such, these benefits are generally seen as defining the ''poverty
    line''.


    A claim for benefit has to be made on an approved form, and the form has to be
    properly filled in. Entitlement depends on a variety of conditions, only one of
    which (a limit on permitted capital) involves assessment of resources. No assessment
    of requirements is needed to determine entitlement. The requirements do, however,
    depend on the make-up of the family, and there are rules concerning who is or
    not to be considered a member of the family. Other (non-family) members of the
    household are also of interest, as they are assumed to contribute to the family''s
    resources. Income and capital for the family are assessed, as an ''applicable
    amount'' representing the family''s requirements. Capital over a certain threshold
    (but below the level where it prevents entitlement) is converted to an equivalent
    income. The amount of benefit paid is the family''s applicable amount minus the
    family''s income (so long as this result is positive).


    This (simplified) account shows how ''real world'' information about the circumstances
    of people is transformed into a ''legal view'' of who to consider and how to treat
    them. A legal view of their requirements and resources is developed, and used
    to arrive at the amount of benefit to be paid. Figure 7.1 shows the ''topics''
    involved, the kinds of data being used or generated, and the main dependencies
    between them. Again, this is considerably simplified with regard to the legislation
    itself.


