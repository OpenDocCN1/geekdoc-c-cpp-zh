  md: '# CHAPTER 11


    # ANALYSING TEXTS FOR

    KNOWLEDGE BASED SYSTEMS


    Elizabeth S. Cordingley


    Knowledge work — the selection of knowledge sources; knowledge elicitation, analysis,
    characterization and representation; KB design; and KB development was a major
    focus of teams developing the Advice System (AS) and the Local Office Demonstrator
    (LOD). For them, knowledge work was regarded as an area where there was potential
    for advancing the state of the art. It had value in its own right in the context
    of developing demonstrators. For the team developing the policy system, however,
    especially after the mid-term review when the LOD became the focus for developing
    an engineered approach to building large knowledge bases, there was no requirement
    to develop an increasingly comprehensive knowledge base. The purpose of each policy
    KB was minimally to provide support for the particular aspect of the prototype
    being demonstrated. In fact, given the supporting role of the KB, the speed of
    inferences achieved before the end-of-project demonstrations in early April 1989,
    and the need to respond to queries small, complex knowledge bases would have been
    counterproductive for the policy system. This chapter, therefore, focuses primarily
    on the approach to knowledge work adopted for AS and LOD, but includes comments
    on that of policy where appropriate.


    The first three sections outline the impact on knowledge work of decisions about
    target users and the support they would need (section 11.1); the nature of the
    domain and how much of it to cover (section 11.2); and technical considerations
    relating to representation and inference'
