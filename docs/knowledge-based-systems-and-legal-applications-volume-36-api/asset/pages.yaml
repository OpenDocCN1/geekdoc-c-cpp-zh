  md: '28


    # The Representation of Law in Computer Programs


    formalisms of various kinds, and the use of procedural PROLOG. (I explain the
    difference below.) Semantic networks and frame-based representations have also
    been used, though much less frequently. Some examples are given in later sections.


    # 1.8.1. Rule-based formalisms


    The law resembles a set of rules more than it does a set of detailed algorithms,
    and it is not surprising that many attempts to construct computer representations
    of law have employed rule-based formalisms. This is an innocuous remark but there
    is an unfortunate ambiguity that has caused some confusion.


    The term ''rule-based model of the law'' can have different meanings in different
    contexts. ''Rule-based'' can refer to the law or it can refer to the chosen computational
    formalism, or to both. One can choose to view the law as a set of ''rules'' but
    represent these ''rules'' in some nonrulebased computational formalism. Twining
    and Miers'' flowcharts are an example. Similarly, one can choose not to view the
    law as ''rules'' but still employ a rule-based computational formalism for representation
    purposes. Waterman and Peterson''s expert systems can be regarded as an example
    of this.


    Some commentators have fallen into the trap of using a rule-based computational
    formalism for representation purposes implies that the authors have belong to
    some — possibly very extreme school of jurisprudence. Critics of the formalism
    are tangled with accusations of jurisprudential naivety. This section is concerned
    with the use of rule-based computational formalisms.


    There are so many projects that used rule-based formalisms to represent law that
    I cannot give a comprehensive list of references. I give only a selection of some
    early examples.


    Waterman and Peterson''s systems implemented in ROSIE, and Michaels'' TAXADVISOR
    implemented in EMYCIN have already been discussed in some detail (section 1.5).


    Philip Leith has used a production system of his own design [Leith 1983] to construct
    ELI [Leith 1982], a system which treats parts of the UK''s Security legislation.


    Duncan and Elizabeth MacRae have implemented a system to advise tax lawyers and
    accountants on section 74 of the US Internal Revenue Code which deals with prizes
    and awards [MacRae 1985a, 1985b; Macrae and MacRae 1985]. This system is implemented
    in PRO. It should not be confused, however, with projects that have used PROLOG
    as a representation language or with the approach described later under the heading
    ''Representing law as logic programs''. The representation language used in the
    MacRae'' system is a propositional'
