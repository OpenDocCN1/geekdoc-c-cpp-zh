  md: '298


    Group Decision Making


    # 14.3.1. The group


    One striking aspect of group work among policy makers is that they tend not to
    view their task as group work at all. Indeed, the number of meetings held about
    a particular policy problem is very small and typically involve only a few of
    the people working on the problem, so face-to-face contact with other members
    of the group is rare. The individual''s perception of his or her task is that
    they are given a problem to work on and then work on it. They are not unaware
    of the wider organizational setting for their task but tend to consider their
    input as an individual effort.


    The group that works on any particular problem is liable to be widely separated
    in space and time. That is, few members of any particular group will be in the
    same office, or building or increasingly, even the same town at the same time
    during the solving of the problem. This is not helped by the DSS policy of rotating
    staff, especially the more senior staff such as would typically work on a policy
    problem, around jobs and around regions on a regular basis (about one move every
    three years). This means that many of the individuals in a group and even the
    owner are likely to have changed during the life of a policy problem.


    # 14.3.2. The problem


    Another striking characteristic of policy problems is that there is no obvious
    process for solving them. It is also clear that deciding the criteria for the
    evaluation of candidate solutions is just much a part of the problem as the finding
    of the candidate solutions in the first place. This is especially true where candidate
    solutions proposed are changes to policy rather than changes to legislation. Rittel
    and Webber [1984] have (wicked problems) to understand what the problem is, in
    itself, to identify acceptable solutions to the problem (see also Simon 1984]
    for a discussion of this type of problem). The kinds of strategic planning problems
    they seem very similar to the policy problems DSS deal with. To quote Rittel and
    Webber:


    > The formulation of a wicked problem is the problem! The process of formulating
    the problem and conceiving a solution (or resolution) are identical, since every
    specification of the problem is a specification of the direction in which a treatment
    is considered. (p. 137)


    They also say:


    The information needed to understand the problem depends on one''s idea for solving
    it. That is to say: in order to describe a wicked problem in sufficient detail,
    one has to develop an exhaustive inventory of all conceivable solutions ahead
    of time. (p. 136)'
