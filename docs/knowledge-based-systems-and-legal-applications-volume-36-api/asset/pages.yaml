- pgno: 297
  md: 'their utterances. There are two phases to constructing an utterance. Firstly,
    the user selects a topic to talk about and then the user constructs an utterance
    on that topic. Topics are selected from a series of menus that contain topics
    in which the choices are each more specific than the last and utterances are constructed,
    by phrase, until there is a possibility to complete the sentence, with one of
    a variety of terminators. This phrase selection mechanism is similar to that described
    by Tennant et al. [1983]. Although most utterances can be constructed by selecting
    phrases from menus, numbers, amounts and names to be typed into text boxes. For
    this reason text boxes may also appear in the phrase being constructed. In addition
    to topic and phrase options, buttons can be selected on the right-hand side of
    the screen (these appear at the bottom of the area). They are intended to give
    the user a quick way to say one of four things. These are: asking for a rephrasing
    of something the system said, asking for a reason behind something the system
    said, asking to leave the system and interrupting the system. When the user presses
    one of these or completes a sentence with a terminator the corresponding utterance
    is added to the left-hand side of the screen as a record of what has been said.


    Starting

    The start of the interaction is based on openings of telephone conversations with
    the user cast in the role of the caller. In contrast to Forms Helper II, the user
    has the first turn in the interaction. The user summons the system, the system
    replies and identifies itself. The user then has to identify himself or herself.
    Then follows a special sequence that is led by the system. In the second version
    of the Forms Helper the start of the interaction is the place where training takes
    place. For the Advice System this involves helping the user to learn how to use
    the topic and phrase menus. The user is first encouraged to make a few statements
    about himself or herself and then to raise the first topic of the conversation
    by asking a question. Once the user has asked this question the main body of the
    interaction begins.


    Overall mixture of initiative

    in comparison to the Forms Helper, the Advice System is based on the idea that
    the user asks the questions and the system answers them. In fact, the Advice System
