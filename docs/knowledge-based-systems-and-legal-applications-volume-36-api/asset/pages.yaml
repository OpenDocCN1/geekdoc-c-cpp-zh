    hierarchy.


    # 12.7. INCOMPLETE INFORMATION AND VAGUENESS


    Another feature of the legal domain, is that ultimately a decision is made. When
    a case is brought before a competent adjudicator, he cannot plead ignorance. This
    means that he must decide on the basis of the facts available to him, although
    it is rare that his information will be complete and certain. Also law notoriously
    exhibits ''open texture'', that some of the terms used will be vague and their
    application capable of resolution only by application of the proper decision making
    mechanism. These features, which are often confused, have led some to argue that
    a knowledge representation facility for the domain must include facilities for
    explicitly representing this. The converse has been argued in [Capon and Seeger
    1988] and [Schildt 1989], which suggest that these topics can be handled through
    the use of a classical bivalent representation, rather than adapting the representation.
    None the any representation must be capable of supporting reasoning with incomplete
    and open-textured information.


    # 12.8. THE ALVEY-DHSS DEMONSTRATOR TOOLKIT


    The Alvey-DHSS large Demonstrator project gave an opportunity to explore and develop
    many of the ideas discussed above. After investigating a range of existing paradigms
    the project developed its own knowledge representation and inference Toolkit for
    use in the three legislation-based applications that were their concern:


    +   1. Supporting the assessment of welfare benefit claims.


    +   2. Advising potential benefit claimants.


    +   3. Supporting the development of new benefit policy.


    The project gave a unique opportunity to explore representation and use of legal
    knowledge in these contrasting and important applications. Each of the three applications
    had to use a large, maintainable knowledge base, and was subject to the kinds
    of constraint discussed in the preceding sections. Welfare legislation is subject
    to particularly frequent amendment and any useful system would have to be able
    to respond quickly to such changes. This led us to emphasize three of the features
    discussed above, namely that its structure should reflect the structure of the
    sources from which it derived, that it should be modular, and that the meaning
    of components should be clear from inspection (independent of other components).


    The Toolkit''s knowledge representation language is purely declarative, sounding
    badly on classical predicate logic, and provides sufficient flexibility of syntax
    for the representation to reflect the structure of the clauses in the source form
    of the knowledge being represented. The first aspect ensures that the meaning
    of any statement in the'
