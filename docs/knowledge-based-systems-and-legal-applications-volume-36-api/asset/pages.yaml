    this explanation may take the form of a ''rule'' which clarifies or illustrates
    a term, at other times it may be a more general discussion of a term or phrase.
    It therefore appears that some case law may contain ''knowledge'' which could
    be encoded as rules while many cases do not. On what basis should we decide which
    knowledge is appropriate for what form of representation? How should the difference
    between rules derived from case law and those from statute be presented to the
    user?


