  md: '# CHAPTER 7


    # THE LOCAL OFFICE SYSTEM


    Justin Forder and Andrew Taylor


    # 7.1. INTRODUCTION


    The requirements laid out in Chapter 3, relate to the Local Office Demonstrator
    (LOD). The LOD is intended to demonstrate the potential for knowledge-based systems
    and advanced user interface technology to provide decision support to adjudication
    officers assessing claims for welfare benefits. The LOD combines the essential
    aims of the project''s original supplementary benefit, mobility allowance and
    training applications. It provides support for decisions based on large volumes
    of complex legislation, where many of the conditions rely only on the user''s
    interpretation, with guidance from manuals and previous decisions. The same support
    environment is intended to serve the needs of skilled and less-skilled users:
    it constrains all its users to be consistent and thorough, while allowing skilled
    users to use their knowledge of the legislation and the support system to ''home
    in'' quickly on crucial issues in cases. This flexibility, coupled with free access
    to on-line manuals of primary and secondary legislation, is intended to allow
    in a training role.


    The evolution of understanding of requirements and technical approaches for the
    LOD occupied most of the five-year lifespan of the project. The last six months
    of the project contained a ''breakthrough'' in convergence between requirements
    and design, followed by a rapid implementation of the system framework, knowledge
    base, and user interface, and a swift evaluation by Department of Social Security
    staff. Even now, we still believe that the approach taken in this final prototype
    is unique'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'valuable. In particular, it provided a natural and unforced integration of
    a variety of support capabilities, an integration which allowed different users,
    with different skills, to use the system in a manner most appropriate for their
    needs.


    This chapter describes the evolution and final form (LOD3) of the Local Office
    Demonstrator. Starting with the objectives as seen at the outset of the project,
    we follow the path leading to LOD3, highlighting some of the lessons learnt along
    the way. The later part of the chapter contains a description and evaluation of
