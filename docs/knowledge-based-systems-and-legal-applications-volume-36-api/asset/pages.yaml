  md: 'the use of, for example, conflict resolution strategies in production rule
    systems, means that it is not possible to detach a piece of a knowledge base from
    its context and consider its correctness in isolation. In many application areas,
    where we are interested in the effect of the representation, this matters only
    in so far as it makes the validation of the knowledge base a harder task. But
    in the legal domain, where the correct decision is only part of what is required,
    it presents a serious problem.


    The same point is reinforced when we consider the maintenance of a legal KBS.
    Maintenance is a more pressing problem for a legal KBS in many other areas. For,
    if we are building a medical expert system we can expect the functioning of the
    human body to remain fairly constant (although knowledge of it may improve, and
    fashions in diagnosis and treatment change), legislation can be, and is amended,
    with disturbing frequency, and at any time a new decision on a given point may
    alter what the law on that particular matter is. Thus a legal knowledge base must
    be constructed with the certainty that those parts of it discerning legislation
    and case law will alter. Such alterations in legislation are typically localized:
    words are added to or deleted from a particular paragraph or section. It is desirable
    that the changes to the knowledge base be similarly localized, and this can only
    be so if the structure of the knowledge base reflects that of the legislation.


    Lastly we need to mention the use of the system. Because the person who is using
    the system is concerned with a legal decision, for which the responsibility is
    his, the process of using the system must make sense to him. The role of explanation
    was noted above, but we should also consider the questions that are put the user
    and the terms in which they are asked. Such transparency in use must also be supported
    by the underlying knowledge representation, and again the closer to the form and
    structure of the sources, the more comprehensible the process will be.


    From the early days of KBS it seemed that law was a very natural area of application,
    because it was the features of declarativeness and flexibility, mentioned above
    as crucial for legal applications, which were claimed to distinguish KBS from
    conventional systems. In practice, however, these qualities were often overstated
    for existing paradigms, and might be further compromised in order to achieve other
    system goals. A certain degree of disillusion has resulted. The these features,
    especially declarativeness, while present to some degree in any knowledge representation
    paradigm, need to be taken especially seriously when building a legal application.'
