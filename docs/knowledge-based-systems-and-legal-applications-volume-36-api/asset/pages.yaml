    chapter by Nigel Gilbert, who led this team throughout the project,

    desescribes both systems.


    The other three teams were examining ways of supporting staff who adjudicate on
    claims to benefit. One team looked at supplementary benefit, which was chosen
    because it was associated with a large number of rules, which it was thought,
    once identified, be applied in a relatively straightforward fashion. This strand
    meant, therefore, to explore problems associated with a very large knowledge base.
    A second team focused on mobility allowance and in particular the interpretation
    of the condition that a claimant be ''unable, or virtually unable, to walk''.
    It was felt that this was a highly judgement decision, and this would therefore
    give scope for examining them problem associated with the application of open-textured
    concepts. The third team were to look at issues associated with training adjudicators.
    As the project developed, however two things happened. Firstly, and outside of
    the projects control, supplementary benefit was replaced by a benefit called income
    support. Although the fundamental intention of the two benefits was the same,
    there were considerable changes to be accommodated. Secondly, it became clear
    that simplistic division into a benefit with many rules which were easy to apply,
    and a benefit with few rules requiring a high degree of sophistication to interpret,
    not a good reflection of the true situation. All legal adjudication contains elements
    of both kinds of decision-making. It was therefore decided to merge these two
    strands into what became known as the Local Office Demonstrator. This is described
    in the chapter by Justin Vorder, who led this team from the time that this merge
    took place. The training strand was dropped at that time: it was felt that KBS
    tutoring systems pose their own problems, which were not best pursued within the
    Demonstrator project framework.


    The final chapter, written by Charlie Portman, who was the project manager, describes
    some of the problems and challenges involved in running a large project whose
    members are drawn from different cultures and who are dispersed across the country.
    Given that collaboration between industrialists and academics is currently seen
    as a model for research projects, his experience is worth consideration by anyone
    who may become involved in such a project. The nature of collaboration had some
    impact on the types of system that were ultimately produced, and it is therefore
    helpful to be aware of this influence.


    All of the prototype systems produced are interesting examples of sustained experiments
    in KBS and the law, and shed light on the aspects of that field that they addressed.
    They are also interesting as examples of the way in which collaborative projects
    work, and as such collaboration is likely to be necessary to move such legal KBS
    forward from research into actual use, this experience should not be disregarded.'
