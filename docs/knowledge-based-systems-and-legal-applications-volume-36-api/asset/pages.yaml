  md: '# CHAPTER 4


    # SUPPORT FOR THE FORMULATION OF LEGISLATION


    Andrew Taylor and Trevor Bench-Capon


    # 4.1. INTRODUCTION


    The majority of knowledge based systems developed for the legal domain have been
    intended to support the application of legislation to the facts of a given case.
    They may be intended for use by the adjudicator, or by a party to the case, or
    the targeted user may be unspecified, but they may take the law as something that
    is essentially fixed and unchanging while the case is under consideration. But
    laws are not fixed; they are made to achieve certain aims and will be amended
    if they fail to achieve those aims. This opens up the possibility of a different
    kind of legal KBS which is aimed at those who are charged with deciding what the
    law should be. This origins of this system may be traced back to Layman Allen,
    who in [Allen 1957] advocated the use of logic for the clarification of legislation,
    both when drafting and interpreting it. Originally, Allen saw the benefits from
    the use of logic as independent of computerisation, but subsequently he has done
