- pgno: 194
  md: '# Legal Applications of KBS


    # 8.5.3. Constraints and policy goals


    This work is an application and to some extent an extension of the work of Sadri
    and Kowalski on integrity constraints in deductive databases. The benefit system
    has been designed to achieve many aims. These aims are liable to change over time
    and with successive governments. To give an example, a policy goal might be: if
    claimant earns more than a certain amount of money he/she should not receive any-contributory
    benefits. Provided that these aims or goals can be expressed in a logical formalism
    they can be treated as integrity constraints on the system as a whole. Updates
    to the knowledge base can be checked to ensure they are not inconsistent with
    these policy goals. This provides a machine assessment of the acceptability of
    an amendment to the knowledge base. For further information on the work see [Kowalski
    et al. 1987].


    # 8.5.4. Support for knowledge base revision


    This arose out of the work on the policy planner done for the feasibility prototype.
    An important task done by policy officers is to develop alternative solutions
    to problems that have been identified. Prototype 3 provides no support for this.
    Work was started on a tool to aid the policy officers in the task of finding edits
    that would achieve the stated goal. This is the structure within the rules to
    generate a tree of possible solutions. No attempt is made to assess the suitability
    of these solutions since this is the function of the existing parts of the prototypes.
    The scenario for the use of this system is that once the problem has been clearly
    identified and in association with the user generate a set of possible solutions.
    The user would then create an environment with each of the more reasonable solutions.
    The effects of these changes could then be experimented to ensure that other policy
    goals were not invalidated.


    # 8.5.5. Extensions to the argumentation formalism


    Work was planned for the final six months of the project to look into extensions
    of the argumentation form as to better support the construction of macro-arguments
    and meta-arguments. It was also expected that some progress could be made on turning
    arguments in the form into readable English text. The prolonged illness of the
    researcher who was to have done this meant that the work could not be pursued.
    However, a subsequent project led by Logica and partially supported by the UK
    Department of Trade and Industry, is looking at the use of argumentation in the
    design of safety critical software and will be looking at extensions to the argumentation
    form developed in the Alvey-DHSS Demonstrator.'
