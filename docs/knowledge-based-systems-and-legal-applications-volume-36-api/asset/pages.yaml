- pgno: 273
  md: '# Knowledge Representation for Legal Applications


    representation is unambiguous and can be determined without reference to other
    statements in the system. The second aspect allows a clear correspondence between
    statements in the source and statements in the formalism. Both aspects work together
    to support validation by inspection and to facilitate maintenance.


    The considerations advanced towards the end of the last section led to a mixed
    paradigm which would allow the representation and use of classes, instances, rules
    and constraints. Attributes of an instance hold numeric or symbolic values, or
    other instances. Values can represent sets/ranges of possibilities, allowing reasoning
    with incomplete or imprecise information.



    The Toolkit is supported by an assumption-based truth maintenance system (ATMS),
    based on [deKleeper 1986], which allowed applications to use assumptions to achieve
    results which would require non-monotonic reasoning in other systems.


    # 12.8.1. Design


    The knowledge representation and inference facility was restricted to those features
    which were well understood and capable of being implemented in a sound, logical
    manner. This ruled out some perceived requirements, such as the need to support
    reasoning about time. The reasons for this were both pragmatic, in that we saw
    no advantage in implementing facilities of dubious provenance, and motivated by
    the belief that a better understanding of the need for such facilities, and some
    insight on how they might be implemented, could be gained from building upon a
    sound and well understood foundation.


    # 12.8.2. Classes, instances, slots and values


    All the applications needed to be able to represent and reason about multiple
    individuals, their attributes and their relationships. To support this, the Toolkit
    provided a frame-based system.


    As the discussion of Brman''s views suggested ‘frames’ are commonly used for knowledge
    representation without precise definition of or distinction between the class/subclass
    and class/instance relationships. The loose definition of inheritance permits
    liberal use of default values to achieve a variety of imprecisely aimed aims,
    which are inconsistent with class. Following the principles outlined above, we
    represented the definitions of types of individual referred to the source material
    by classes, defining them in terms of their attributes and the types of those
    attributes. Individuals were represented by instances of these classes. For economy
    of expression, the classes were organized into a class/subclass lattice supporting
    a strict logical interpretation of inheritance, as outlined below. Giving definitions
    of the different sorts of individual in this way helps support the distinction
    between analytic and'
