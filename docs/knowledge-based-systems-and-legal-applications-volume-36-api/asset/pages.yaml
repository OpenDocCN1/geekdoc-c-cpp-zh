  md: '106


    Support for the Formulation of Legislation


    # 4. Avoiding ‘reinvention of the wheel’.


    # 4.3. POSSIBILITIES FOR KBS SUPPORT


    The general requirement for support of policy will probably concentrate on the
    capturing of assumptions, facts, aims and decisions which take place during the
    development of new policy, and the retrieval and analysis of this information
    for subsequent amendments and additional policy. The particular potential for
    KBS support of policy lies with a system which could complement this overall process
    with capabilities that would identify potential issues, problems or inconsistencies
    and check assumptions — typically in terms of the qualitative effects of particular
    actions.


    # 4.3.1. Issue verification


    A policy maker may be alerted to the existence of an issue in a variety of ways.
    Very often this will be through some complaint, in the form of letter to the Department
    or a parliamentary question or a press article, about the operation of the system,
    although it can also arise internally, from concerns of policy makers themselves
    with the effectiveness of the current provisions, for example. In essence, however,
    an issue only has significance if the context which argues it is a concern is
    accepted. The first task will therefore be to see these complaints and concerns
    are well-founded. Suppose that someone complains that they do not receive a retirement
    pension even though they are pensionable age. This is not in itself a problem
    since age is not the only condition for receipt of retirement pension: a person
    must also have the relevant contributions and be retired. These conditions, which
    the complainant may be unaware, represent real policy goals, and there is thus
    no issue, unless these goals have ceased to be important. Thus given a description
    of a class of people and a claimed benefit that should accrue to this class, the
    policy maker must find out whether it really fails to accrue, and why it fails
    to do so. If it fails for still valid reasons, the issue is resolved. KBS can
    support this activity by demonstrating that the claimed consequences of the description
    do occur, and providing the reasons that they occur, at the first level in terms
    of other features of members of the class and the pertinent legislation, and at
    a second level in terms of the thinking and goals which underlie this legislation.


    Something being accepted as an issue depends then on acceptance of the assumptions
    underlying it (that the facts described are accurate; that the types of individual
    of concern are in fact treated as they are claimed to be; the problem is one of
    policy and not, say, of errors in procedure) and adherence to priorities or existing
    policies which make it appropriate or consistent to accept the issue. KBS can
    assist in teasing these assumptions.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Legal Applications of KBS


    # 4.3.2. Issue clarification


    Sometimes the genuine problem does exist, so that there is an issue of policy;
    for example, there may be a group of people who were intended to benefit from
    a provision who, in practice, fail to benefit from it. It is necessary to clarify
    which aspects of the current policy are the major factors generating the issues
    of concern. Moreover, it is also necessary to establish the basis of the issue
    — whether it affects other government departments, and whether it is a specific,
    localized issue or part of a generic problem extending throughout the policies.
    In the example of a mistargeting of benefit, this means determining exactly why
    it forms the group intended to receive, but not receiving, the benefit, and explaining
    why the legislation fails to meet their case. The individual complainants may
    differ widely in their circumstances, but there will be some common factor which
    explains why they fall into the problem category. It is the identification of
    this common factor which enables the policy maker to see precisely what it is
    that is suffering from the defects in the legislation, and to explain why this
    is.


    Sometimes the issue may develop because some of the underlying theories that were
    used in the original design of the legislation are not correct. Suppose that there
    was no retirement condition on retirement pension, perhaps because there had a
    theory which said that no one would work if they could receive a pension, or perhaps
    there had a theory that no one over pensionable age would be able to retain a
    job. This would mean that some people in full time work over pensionable age would
    be additionally able to claim a retirement pension. This is in conflict with the
    aim that such a pension should be payable only to those people without a job,
    and the legislation would be defective. Given a conflict between the theories
    and the fact that there are people over pensionable age who are in full time employment,
    the theory must be modified. Once the theory is modified or abandoned, it becomes
    clear that some extra condition analogous to the retirement condition is required
    to enable the legislation to achieve its desired aim.


    At this stage exploration of a model of the legislation within a KBS can help
    identify those features which distinguish the group rising to concern, so as produce
    a more precise characterization of that group. The better the characterisation
    of the problem group involved, the better the understanding of the mechanics of
    the problem, the more focused the search for a remedy, and it is to be hoped,
    the better solution.


    # 4.4. Issue Explanation


    Having considered the issue and its implications, a policy-maker may adopt a line
    of ‘explaining away’ the issue — arguing perhaps that there is no alternative
    or that in spite of undesirable consequences the existing'
