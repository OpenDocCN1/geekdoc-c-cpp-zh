  md: 'policy is required because of the overall beneficial effects. In this situation
    they need to present their formulation of the problems and issues in such a way
    as to emphasize the positive features and limit the concerns with the negative
    aspects.


    More generally, policy makers always have to understand as clearly as possible
    why the existing policy is the way it is — what the original intent and with what
    objectives. Here we would look to KBS to support the construction of these arguments
    against the background of the issue as clarified along the lines of the previous
    section. When a precise description has been produced, the explanation of the
    problem in terms of the parts of the legislation which lies at the root of the
    issue, and how the problems arise is facilitated. Two levels of explanation may
    be involved; one in terms of the interaction between the various components of
    the model of legislation, and the other in terms of the justification for these
    features of the model, that is in terms of the goals they proposed to achieve.


    # 4.4.1. Option Generation


    If it is decided the problem requires amendment of legislation, the next step
    is to decide what can be done to cure the problem. Usually there will be several
    different ways of amending the legislation to reach a state where the problem
    no longer occurs. The retirement condition in the example mentioned when discussing
    issue verification above, could be expressed in a variety of ways; any work at
    all might be made a disqualification, or an hourly limit on work done could be
    proposed, or the pension could be reduced in accordance with earnings in a variety
    of ways, pound for pound, with a cut-off at certain earnings threshold, or by
    a certain proportion of earnings. The policy maker should at this point generate
    as many candidate solutions as his ingenuity will allow. It is important that
    policy makers are seen to have considered all possible options and not simply
    adopt the most immediate and obvious course of action. Even when particular options
    are infeasible or inconsistent with existing policy, it is important to consider
    why they should be rejected rather than remit them without consideration.


    Couched in knowledge base terms, generating an option can be as choosing rules
    to delete, amend or add which will mean a description of the target group will
    provide necessary and sufficient conditions for possession of the desired feature.
    Often this will be impossible, and different options will approximate to this
    ideal to different degrees and in different ways. Using a logical model, the support
    given for option generation will comprise explanation of the mechanics of the
    problem, together with the means of determining the extent to which an option
    achieves the desired result. Where it falls short it will provide an explanation
    of its deficiencies. In a more ambitious system it would, however, be possible
    to incorporate elements of knowledge based'
