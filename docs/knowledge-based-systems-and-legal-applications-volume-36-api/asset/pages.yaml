  md: '296


    Group Decision Making


    concern perceived anomalies or injustices. However, the social security legislation
    is, on the whole, the way it is because of the policy of the department. Such
    queries, therefore tend to elicit explanations rather than initiate the revisions
    of the law that the inquirer is often seeking.


    Thus, on receiving a query, from whatever source, the policy worker''s first task
    is to establish whether genuine anomaly exists. If it does not, an explanation
    may be issued. If it does, then action must be taken to establish whether corrective
    action is necessary, and if it is, to take steps to correct the anomaly. Corrective
    action may involve a change in or a refinement of existing policy/or a change
    to the existing legislation.


    # 14.2. POLICY MAKING WITHIN THE DSS — THE NATURE


    # OF THE TASK


    Let us assume that a problem requiring corrective action has been ''owned'' by
    a single policy maker. The problem will, typically, commence the work of finding
    an acceptable solution to the problem by reviewing it. This normally involves
    the production of a ''policy review paper''. This outlines the current state of
    the legislation, of the Department''s policy, of the effects of the legislation
    that are perceived as problematic, any other relevant background information (such
    as statistical data, statements by ministers, the findings of other reviews of
    the area, etc.), and may suggest and partially evaluate candidate solutions. The
    scope of the problem (by saying what is and not included) and by providing criteria
    for evaluating candidate solutions.


    In our analysis of the policy process, we refer to this phase as ''problem structuring''.
    Problem structuring may be a solitary task or it may involve others, depending
    on the size and scope of the review. However, when others are involved it is normally
    only in the role of information provider to the problem owner. Occasionally there
    will be meetings and formal consultations during this phase to clarify the current
    policy or to seek ideas for solutions.


    The original review paper will be circulated to several others. Some of these
    will be subordinates of the owner and others will be colleagues in other branches
    or directorates. It is the role of the subordinates to elaborate the arguments
    in the review paper, to suggest more detailed solutions and to evaluate all the
    candidate solutions. They will, however, sometimes have something to say about
    the overall problem structure and may suggest new structures which imply different
    solutions and will affect evaluations of already suggested solutions.


    The main purposes of circulating the review paper outside the originating branch
    are: to alert others who may be affected by the problem;'
