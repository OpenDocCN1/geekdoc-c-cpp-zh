- pgno: 87
  md: '# The Opportunities of the DHSS Demonstrator Project


    commencing to develop the ‘final’ demonstration systems. The primary advantage
    of this was that design commitments could be deferred. There was no pressure to
    adopt an existing model for the systems as would be the case it were necessary
    to produce a demonstrable system in a shorter time, so that the needs of the applications
    could be determined and taken fully into account the design of the systems. Moreover,
    the time scale meant that there was substantial scope to revise some of the original
    conceptions: the shifting emphases of the various applications through the course
    of the project is described in chapters of Part III. It was also a very large
    project in terms of the number of people involved: around sixty-five over its
    life, and at any given time there would be thirty or more people working on it.
    This again contrasts with the typical situation in KBS in law where projects are
    carried out by individuals or by small teams. Not only the resource available
    make possible a more ambitious conception in terms of the scale of the implementation
    that could be produced and the size of the knowledge bases that could be developed,
    but whereas a small project is inevitably shaped by the personal skills and ideas
    of the people involved, the diversity of viewpoints and changing composition of
    the Demonstrator team meant that the backgrounds and inclinations of particular
    individuals were less critical.


    # 2.1.2. Interdisciplinary nature of the project


    The number of people working on the project meant that it would inevitably have
    an inter-disciplinary flavour. The commitment of the project to interdisciplinary
    research, however, went much deeper than this. Of the academic collaborators,
    two, Imperial College and the University of Liverpool, were computer science departments,
    but the University of Lancaster was represented by the department of systems and
    the University of Surrey by the sociology department. The presence of these two
    unusual inputs had valuable consequences: the department of systems was able to
    contribute effectively to the organizational and ‘business case’ relating to the
    various systems, and the sociologists were uniquely placed to determine the needs
    of the claimant users — a diverse and hard to find group — to evaluate the effectiveness
    of the systems produced for use by this sort of user. The skills of both groups
    of people, which might appear a luxury in a smaller project, were thus of vital
    importance in orienting the systems to the tasks they would perform in practice.
    Moreover, the team members had an unusually wide spread of educational backgrounds
    ranging from mathematics to philosophy through psychology and engineering. This
    again contrasts favourably with the range of backgrounds that might be found in
    a small team; typically we find there a collaboration between a computer scientist
    and a lawyer. One, perhaps surprising, feature of the composition of the team
    was that there were few members with a legal background — although there'
