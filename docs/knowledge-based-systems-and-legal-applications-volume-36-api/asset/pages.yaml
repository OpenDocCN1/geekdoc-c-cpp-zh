    and if how much the person could expect to get.


    It is not surprising that members of the public do not define their lives in terms
    of distinctions important to the funding or administration of benefits.


    A tribunal decision reported in Welfare Rights Bulletin 75 (p.3) concerned whether
    a shower for a disabled man constituted a ‘medical need’ or a ‘domestic need’,
    which is administratively important as it divides social security from NHS provision,
    but difficult to determine in the everyday world.


    The ''cash'' versus ''care'' distinction which has defined the boundary between
    the social security and personal social services is not always meaningful to claimants/clients.
    The ''health'' versus ''medical'' distinction which distinguishes the care provided
    by local authorities and that provided by the NHS is another distinction which
    is difficult to maintain in terms of life as it is lived.


    It was decided that boundaries of the Advice System knowledge base should be set
    by reference to target cases associated with a group of people rather than a collection
    of benefits as a reflection of the teams concern let the system be user-driven
    rather than organization-driven. It was decided to focus on lone parents as the
    target group because they were likely to be easily specified and eligible for
    a wide range of benefits.


    It happened that benefits for the disabled and students were under review during
    the lifetime of the project as those covered by the social security review. It
    was uncertain whether regulations regarding them would be available for end-of-project
    demonstrations or whether they would already come into effect by that time. So
    a decision was taken to narrow the scope of the target cases about which the AS
    would be able to advise on cases where the claimant was a lone parent who neither
    disabled nor a student nor, by the definition of lone parent used, retired. This
    allowed retirement pensions to be largely excluded from the knowledge base and
