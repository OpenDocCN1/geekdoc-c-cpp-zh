  md: '# CHAPTER 12


    # KNOWLEDGE REPRESENTATION

    FOR LEGAL APPLICATIONS


    Trevor Bench-Capon and Justin Forder


    # 12.1. INTRODUCTION


    The choice of knowledge representation is a crucial decision that must be taken
    when designing knowledge based systems, including those in the legal area. Over
    the years a number of paradigms for knowledge representation have become well
    established, and have been used to get good effect across a range of different
    application domains. In fact, all these major paradigms have been used for legal
    applications: an examination of the literature will disclose KBS based on production
    rules, various kinds of structured objects as frames and semantic networks, and
    first-order predicate calculus, as well as mixtures. In all such systems, techniques
    developed for general use were straightforwardly applied to the legal domain,
    and many of these applications can be seen as successful to a degree. Experience
    has shown, however, the paradigms have practical differences that make them particularly
    suited to some areas and styles of applications. In this chapter we shall consider
    the demands placed upon knowledge representation by legal applications, and discuss
    how this should affect the way in which the knowledge representation task is tackled.
    First we shall consider how the application area impinges on a KBS through the
    life cycle of the KBS. Next we shall consider whether there are particular features
    of the domain which render the existing paradigms inadequate, and whether the
    claims made by [Greenleaf et al. 1987] and McCarty [1989] to the effect that special
    purpose knowledge representation techniques are required for the'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Knowledge Representation for Legal Applications


    legal domain is justified. We shall then present the knowledge repres-entation
    formalism developed for use within the three of the applications of the DHSS Demonstrator
    project, so as to illustrate our earlier conclu-ions, and indicate some of the
    problems encountered and areas where we consider further work necessary.


    # 12.2. PHASES IN A LEGAL KBS AND CONSEQUENCES FOR


    # KNOWLEDGE REPRESENTATION


    Like any software application a KBS has a life cycle which includes the construction
    of the system, the testing of the system and the period of use, maintenance and
    enhancement. In each of these phases the fact that an application is in the domain
    of law will have considerable influence. It is that influence will be considered
    in this section.


    When constructing a KBS, it is necessary to consider the sources of knowledge
    available about the domain, and the nature of the knowledge to be represented.
    In the legal area a distinctive feature is the amount of knowledge that exists
    in written form. Not only may there be legislation itself, setting out the letter
    of the law, but there may also be reports of decisions made by adjudicators, perhaps
    transcripts giving the arguments presented by counsel, and commentaries and textbooks
    designed to instruct people in the law for a particular area. In many other fields,
    we cannot find texts corresponding to all of these categories. In the area of
    medical diagnosis systems, for example, we will find textbooks describing the
    symptoms and treatment of various diseases, and perhaps case his-ories as well,
    but there will be nothing corresponding to the legislation. For while the medical
    diagnosis system is ultimately about a real system, the human body, the legal
    KBS is ultimately about a conceptual system enshrined in legislation. The result
    of this is that the texts-selves need not to be taken seriously in a legal application
    in a way in which they do not in a medical diagnosis application. It actually
    matters whether a legal case is real or hypothetical, and whether case acts as
    a basis for a partial view of what the law is. Similarly it matters what the legislation
    says because the relationships and concepts under-sider their existence to this
    legislation. Any formalism for legal knowledge representation needs to be well
    adapted to the representation of these texts.


    Of course, there exist examples of legal KBS which do not represent legal at all,
    or only to a rudimentary extent: McCarty''s TAXMAN, described in [McCarty 1977],
    and Rissland and Ashley''s HYPO, described in [Rissland and Ashley 1987], would
    provide notable examples. The explanation for this is that this kind of system
    is motivated by a consideration rather different than present in the majority
    of legal KBS. These systems set out to model the reasoning of lawyers, focusing
    on the way in which a single point of law may be'
