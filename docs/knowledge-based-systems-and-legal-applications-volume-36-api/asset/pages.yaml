  md: '# Legal Applications of KBS


    (a) in the case of a man, the age of 65 years; and


    (b) in the case of a woman, the age of 60 years.


    Now if we consider the kind of knowledge that an expert adjudicator might allow
    to decide claims for this benefit, we might see allowing claims of men aged 101
    and women aged over 96. This would certainly pick out the correct group of people
    and would be the most convenient expression of the knowledge if the claim form
    gave the age of claimant. It does, however, ''compile'' in both a certain amount
    of arithmetical expertise and knowledge of the current date, as well as the interaction
    27(1) and 39(1). If the claim form contained not the age of the claimant but the
    date of birth, this would not be the most convenient expression of the knowledge,
    since a calculation would be required to get the age from the date of birth, and
    the expert would be likely instead to operationalize the knowledge as ''men born
    before 5/7/1888 and women born before 5/7/1893''. This conflates 27(1) and 39(1).
    The point here is when experts operationalize knowledge from a variety of sources
    the way which is of most to use them.


    As far as performance and correctness either of which make any reference to the
    legislation, would be perfectly adequate. But consider now the question of maintenance
    of such a system. The initial expression, with its explicit reference to an age
    would become out of date within the year, and so reference need to be amended
    every 5 July. Suppose that 27(1) was amended, perhaps to introduce a pension age
    to both men and women: then the operationalization in terms of date of birth would
    no longer be acceptable. The point is not that changes need to be made: that is
    inevitable. The problem is that using the expertise alone as its explicit reference
    we would have no way of telling which parts of our representation need to be changed
    in order to respond to given changes either in legislation or in external circumstance.
    Similar problems arise with respect to validation of the knowledge base; expertise,
    by bringing together different knowledge elements to make the justification for
    particular items harder to establish. These points are discussed more fully in
    [Routen and Bench-Capon 1990]. Lastly, it should be necessary to explain and justify
    decisions in terms of the legislation, then this cannot be done from the operational
    knowledge alone.


    The situation with expertise can be represented by Figure 16.2.

    The expertise, as the diagram indicates, mixes knowledge from a variety of levels
    in the model and adds something else as well. Representing the expertise directly
    would mean that the separation of the knowledge into its component parts — essential
    for validation, maintenance and explanation — would be more difficult. Thus it
    might advantageous to represent the different levels separately. The model also'
