- pgno: 237
  md: 'held, reference to the superceded benefits could be avoided.


    Organizational and administrative boundaries also needed to be breached for coherent
    packages of benefits to be covered by the Advice System. ‘Experienced need’ and
    advice seeking are widely known to cut across boundaries of administrative responsibility
    and funding sources. Though these boundaries are relevant to administering organisations
    and therefore to the process of claiming welfare provision, they do not constrain
    advice seeking. The advice sought is usually in terms of life experiences of the
    advice seeker, for example ‘What happens when I reach retirement age?’ or ‘What’s
    the effect of getting a divorce?’


    Organizational boundaries are also blurred during the process of gathering information,
    for example, must be supported by a birth certificate. A child benefit claim,
    as far as advice claiming benefit may well need to include details about how to
    register a birth or get a copy of a birth certificate, even though these matters
    are not the administrative responsibility of the D(H)SS.


    Organizations delivering welfare provision, including some D(H)SS local offices,
    recognise the boundary difficulties and, as far as they are organisationally able,
    adopted a ‘whole person’ approach to claims. Advice givers, not bound to an administrating
    organization are able to go even further in this direction as a convincing Advice
    System. These objects had to be included in the knowledge base although little
    detail supported these social security objects in the demonstrator, especially
    as it was designed to be used by a member of the public without the attendance
    of any other advice giver.


    # 11.2.2. Organizing principle for structuring knowledge


    Several useful ways to structure the knowledge emerged from domain analysis. The
    first was based on perceived rationale and emergent principles implicit in the
    structure and delivery of welfare benefits. Concepts like benefits ‘as of right’
    as opposed to those which formed the ‘safety net’ of welfare provision went some
    toward explaining why it was relatively easy to claim some benefits and difficult
    to claim others. The insurance principle which underpins contributory benefits
    like unemployment benefit and statutory pay goes ways explaining why there are
    conditions relating to a claimant’s contributions record for these benefits and
    not for others. This structuring of benefits was useful for constructing explanations
    and to provide warrants for system outcomes. It was used in the construction of
    rules to provide answers to these ‘theory level’ questions in the Advice System
    demonstrator.


    Another structure was based on the concepts of welfare context and focal events/situations
    which occur in the life of potential claimants. Figure 3 (discussed in section
    11.4.1) represents an attempt to combine disparate perspectives which it was thought
    might be useful in'
