- pgno: 225
  md: '# 10.10. LESSONS


    Managing a project like the Alvey-DHSS Large Demonstrator depends on developing
    and maintaining a common purpose and a common view of what the freedoms and restrictions
    on the project members are.


    Communication in all senses is the vital key to reaching and keeping this common
    view. Strong co-ordination is required to resolve differing views of equal partners,
    this should be as independent as possible. A great deal of travelling is inevitable,
    although use of e-mail and, perhaps, video conferencing, together with planning
    of meetings can keep this within bounds.


    Requirements for procedures, planning, documentation, etc. should be well developed
    at the outset, although in a long project they will certainly change as time passes.


    All activities will be ‘budgeted’, particularly the time and cost of demonstrations,
    conferences and workshops which are otherwise seen as an extra load by the team
    members. Creation of the final reports is also something that can ‘fall off the
    end’ if not planned and controlled.


    It is, perhaps, interesting to speculate on the possible outcomes of such a project
    if the culture mix had been different. In an ‘industrial only’ project, for instance,
    it is likely that more tangible results in terms of software systems might have
    been produced but at the expense of a reduction in the scope and depth of exploration
    of many issues, particularly relating to the claimants and their needs and to
    the policy branches. In an ‘academic only’ project, I imagine, the opposite balance
    would have been struck with a greater coverage but less complete demonstrator
    systems. It would be interesting to know whether the Alvey projects will support
    this view. In either case the project and its sponsors would have lost the beneficial
    effects of the intercultural interaction and the participants would have found
    the time they spent less stimulating and less fun.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# PART IV


    # ISSUES


    Building a knowledge based system in any domain raises certain issues. The idea
    of such a system is that it will perform by manipulating a knowledge base, and
    this requires that knowledge relevant to the domain be acquired, analysed and
    represented in a formalism suitable for execution. Further, the system must be
    used, which means that an interface to the user must be provided, and the system
    must be introduced into the organization and meet the business requirements of
    that organization. In this section issues related to these activities are discussed.


    The legal domain has certain distinctive characteristics related to the fact that
    so much of the knowledge that seems appropriate for inclusion in a KBS exists
    in written form. Firstly there is the law itself, both statutes and the various
    statutory instruments made pursuant to those statutes. Then there are decisions
    made on individual cases which can serve as precedents for future cases. There
    are commentaries on the law, and in case of welfare benefits, books aimed at the
    public which out out explain the law there exists voluminous guidance which instruct
    adjudicators in how they are to apply the law. If we go back to the formulation
    of law we find yet more documents which set out the intention behind the law and
    explain why certain solutions were adopted. Also in policy branches letters are
    written and parliamentary questions answered which further explain and justify
    the law. There is therefore a huge amount of disparate written material which
    could contain knowledge of relevance.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'This material needs to be selected from and organized so that it can form part
    of the knowledge base. Elizabeth Cordingley was centrally involved in the knowledge
    analysis work done for the claimant information systems, and her chapter describes
    the approach taken there, and also draws on the experiences of her colleagues
    doing similar work with regard to the local office system. The chapter should
    serve to dispel any impression that because knowledge exists in written sources,
    the process of analysis in a realistically sized domain is a simple matter.


    Once the knowledge to be represented has been decided upon, it needs to be represented.
    Systems have been built in the legal domain using the whole gamut of knowledge
    representation paradigms. The question arises as to there is anything distinctive
    about the formalism required for the legal domain. In the early period of the
    Demonstrator a variety of knowledge representation techniques were used in experimental
    fashion in an effort to determine what was required. After this period of experimentation
    a decision was taken to use a common formalism for all the prototypes, and this
    was to features to meet the perceived requirements. Justin Ford and Trevor Bench-Capon
    were centrally involved in the design of this formalism, which became known as
    the project toolkit, and their chapter sets out the principles which it attempted
    to embody, and justify them with reference to the particular demands that are
    made by the domain of law.


    When thinking about the interface, it should be remembered that KBS in the legal
    domain are usually thought of as support systems. This means that the users of
    the systems will have selected for qualities quite unrelated to their skills in
    using computers. Although regular users may be able to receive some training,
    this means that the systems need to be designed to be used by people with minimal
    computer skills. The problems are at their sharpest when they are designed to
    give advice to the general public, since this class of users cannot be expected
    to invest any time in learning to use the system. Paul Luff and David Frolich
    worked on the two Demonstrator systems aimed at the general public, and their
    chapter describes the style of interaction used in these systems, which they call
    native interaction, together with the results of the extensive evaluation work
    carried out to examine the benefits of this style.


    The typical picture of a person using a KBS is of an individual alone at a terminal.
    This picture suggests that the tasks supported should be tasks performed by an
    individual. This model fits both the adjudication support system and the claimant
    information systems, but will not do for the system targeted at the policy makers.
    The field is too large, and the interested parties too diverse, for the task to
    be done by an individual working in isolation. Policy making is essentially a
    group activity. In his chapter Graham Storrs, who led the team working on the
    policy application, describes the issues involved in producing a KBS to'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'support a group of people working in a co-operative fashion. These issues are
    not confined to policy making related to law, however: the co-operative working
    style is to be found at the strategic level of any large organisation.


    The final chapter in this section discusses the organizational impact of introducing
    any form of computer technology will affect the working of the organisation into
    which it is introduced, and the working practices of the people working within
    it. Throughout the process of designing such a system, therefore, one needs to
    be aware of the implications of using it. Andrew Taylor, who was chiefly responsible
    for liaison with DHSS and determining the organizational requirements, discusses
    these issues, with particular reference to the kinds of KBS envisaged by the Demonstrator
    project.


    All of these issues arise in building any knowledge based system, but they arise
    in a different way depending on the domain of application and the intended user.
    It is hoped that the discussions in these chapters will be of particular use to
    those building legal KBS, but also of value to those exploring KBS in other domains.'
  merge: -1
  img_proc: true
