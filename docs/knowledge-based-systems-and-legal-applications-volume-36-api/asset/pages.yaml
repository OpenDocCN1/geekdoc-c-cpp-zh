- pgno: 395
  md: "# THE APIC SERIES · 36\n\n# KNOWLEDGE-BASED SYSTEMS\n LEGAL APPLICATIONS\n\n\
    The application of artificial intelligence techniques and the development of knowledge-based\
    \ systems have now reached a broad range of domains — from medicine to electronic\
    \ circuit design, aerospace navigation to chess-playing. One of the most promising\
    \ and practical areas has become that of legal applications.\n\nThis book describes\
    \ the largest project yet undertaken using knowledge-based techniques in the legal\
    \ domain: the Alvey-DHSS Demonstrator project. An authoritative general introduction\
    \ to representing legal knowledge sets the scene for sections describing several\
    \ prototypes and successive experimental stages through which this project developed.\
    \ A final section discusses many of the general lessons that can be drawn from\
    \ the collaborators’ experience of their ‘KBS and Legal Applications’ project.\
    \ These lessons cover issues of knowledge analysis, knowledge representation,\
    \ the nature of systems interaction, co-operative working, and the social and\
    \ organizational implications of legal knowledge-based systems.\n\nThis book will\
    \ be of interest to all concerned with artificial intelligence and law. It will\
    \ also be essential reading for students and professionals involved in building\
    \ large-scale knowledge-bases for practical use, particularly for legal and governmental\
    \ applications.\n\n# ACADEMIC PRESS\n\nHarcourt Brace Jovanovich, Publishers\n\
    LONDON · SAN DIEGO\nNEW YORK · BOSTON\nSYDNEY · TOKYO\n\n![](img/fd9daa466aa6610f0ebd57e2ccc632c5_395_0.png)"
