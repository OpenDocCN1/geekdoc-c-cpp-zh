    for producing such systems in an engineered measured way. This was, of course,
    doubly true of large knowledge based systems. Similarly, the early part of the
    project, there were no methodologies for the analysis and production of highly
    interactive systems. At the time of writing, we can see such methods beginning
    to emerge they were at very early stages and no P1 considered mature. As a result,
    we were forced to use what we considered best practice and to adopt and modify
    existing software engineering techniques. We opted very early for a prototyping
    approach, and in the first half of the project, aimed for producing a new prototype
    every six months after the initial analysis. In broad terms, P0 and P1 prototyped
    the knowledge representation and inference mechanisms, P2 prototyped argumentation
