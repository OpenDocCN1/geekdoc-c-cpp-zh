    # 1.11. THE DRAFTING OF LEGISLATION


    This section is concerned with the use of symbolic logic to aid the process of
    drafting legislation (and other legal documents). The topic falls within the scope
    of this paper because it involves the representation of legislation in logic.
    In principle, any representation can be processed by computer. The topic is also
    closely related to the use of logic programming techniques in law, and provides
    a class of potential applications for these techniques. Furthermore, the work
    of Layman Allen, which is described in this section, has had a major influence
    on many projects concerned with the computer representation of law.


    I am not suggesting there are no other computer aids that could be applied to
    the drafting of legislation. For example, there are many commercial systems that
    are used already to help with the drafting of legal documents like contracts and
    wills. But these systems are essentially modified word-processors that only deal
    with the wording and appearance of a legal document. They do not store its ''content''
    or ''meaning'' and I have therefore excluded them.(The idea of basing a legal
    document generator on a representation of what the document ''says'' as well as
    how it ''looks'' has been suggested from time to time. There are some on-going
    projects along these lines but I know of no published descriptions.)


