- pgno: 129
  md: '112


    Support for the Formulation of Legislation


    # 4.6. PROBLEMS


    The major problems in providing KBS support for policy must result from in richness
    and fluidity of the policy task and the culture of the organization of that task.


    # 4.6.1. Ownership of problem parts


    Policy is not a task which is carried out by one individual, applying his own
    knowledge, but involves a complex interaction between various parties. In terms
    of some of the possible support capabilities we have considered, it is unclear
    precisely owns the requirement and therefore at whom the system should be directed.
    One example of this is the degree to which the policy maker or the drafting solicitor
    is responsible for checking the effectiveness and implications of the proposed
    legislative changes. In principle, policy makers should act as legislation to
    produce specified goals rather than suggesting specific changes to regulations,
    yet lawyers cannot be responsible for checking the political acceptability of
    all the implications of certain regulations. Because of the essential inseparability
    of the legal and policy issues in the evaluation of whether regulations achieve
    the political aims, it is difficult to establish whether the policy maker or the
    solicitor should be the primary focus for support.


    # 4.6.2. Usability and dependability


    The sophistication and inherent complexity of the KBS capabilities required inevitably
    lead to issues of usability of the resulting system. This is made worse by the
    fact that policy staff are unable to commit any major time and effort to acquiring
    the necessary expertise to use such a system. Lastly, within such an environment
    it would be essential that the user knows when, and how far, to trust the system
    it produces. This requires that they be able to use and understand the limitations
    of any results it produces. The knowledge base editing facilities and the structure
    and content of the knowledge base itself.


    # 4.6.3. Lack of criteria for assessing policy success


    Systems are typically evaluated and justified on the basis of the contribution
    they make to the effectiveness and efficiency of the task they are supporting.
    Unfortunately, within the policy environment it is not a straightforward task
    to assess such a contribution. Policy work seldom involves a clearly defined end-product;
    often the conception of what is acceptable changes throughout the development
    of the policy. Time and resource constraints imply that the best is done in the
    time available, with a continuing balance of risk against effort being maintained
    as the work progresses.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Legal Applications of KBS


    # 4.6.4. Scoping of policy problems


    Perhaps one of the most difficult outstanding issues is whether and how the system
    could be used in either a focused or general way. At various stages throughout
    the policy process the policy maker will want to make either cursory, general
    queries to check the overall structure of a problem and its general implications
    or very detailed and exhaustive analysis of all the specific implications of a
    policy. Between these two extremes are all the permutations of depth and breadth
    of analysis. For such a task it would be unacceptable to have a system which produced
    excessive detail of all possible implications for any query. Equally it is unreasonable
    to expect the users of the system to revise their formulation of queries in order
    to achieve the desired effects. The solution probably lies in what is generally
    called a ‘problem structuring’ of the knowledge base and queries, whereby the
    policy maker can flexibly constrain the scope of the knowledge over which inferences
    are carried out. How such problem structuring could be still an open question.


    # 4.7. CONCLUSION


    In this chapter we have tried to describe a novel area for the application of
    KBS techniques to a legislation based domain. Our discussion is firmly based in
    the experience of working on the various policy demonstrators described in Chapter
    8. The conclusion is that such an area poses novel challenges for KBS, and that
    any KBS developed to support this kind of work will be significantly different,
    both in its construction and style from that found in other legal areas. The area
    is worth pursuing because it offers opportunities for exploring distinctive and
    complex problem-solving behaviour of highly intelligent people, and because there
    are also great potential benefits from the use of such a system. not confined
    to government departments. Any administrative organization is concerned with the
    production of policy, and although the details of the process are likely to differ,
    the general style of system and the KBS techniques required will be capable of
    being transferred. This chapter then is not about presenting solutions, but about
    delineating an interesting area for the application of KBS techniques, and offering
    a warning against an over-simplistic approach.'
  merge: -1
  img_proc: true
