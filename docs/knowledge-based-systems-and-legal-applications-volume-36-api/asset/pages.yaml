  md: '# 214 Analysing texts for knowledge based systems


    (section 11.3). Section 11.4 discusses analysis undertaken by the teams and its
    effect on knowledge-base design. Section 11.5 describes the strategies adopted
    by the teams for building their knowledge bases and how the structure of the teams
    influenced these decisions. approaches to analysis KB design and building.


    # 11.1. TARGETING


    The three objectives of the project which particularly affected knowledge work:


    +   To produce knowledge decision-support solutions which enhance organizational
    effectiveness and quality of service.


    +   To produce systems in which the multiple needs and varying skills of all the
    users are handled in a coherent manner, intelligently and sympathetically.


    +   To produce systems embodying mechanisms for safeguarding the rights of individuals
    and the integrity of the system.


    The concern with ''multiple needs and varying skills'' led to the selection of
    three different sets of target users for the systems: D(H)SS staff for the policy
    system, D(H)SS local staff for the Local Office Demonstrator, and D(H)SS ''customers''
    for the Advice System and the Forms Helper. Each target user group provided a
    special challenge for system design and knowledge work. They affected the selection
    of knowledge sources as well as the, structuring and representation of knowledge
    gleaned from those sources. Consideration was given to creating a single knowledge
    base for all three with different user interfaces, but there were several reasons
    for deciding against this. A particularly compelling one was that an Advice System
    might not be credible as an independent source of advice if it were developed
    and maintained by the organization administering the benefits rather than being
    developed independently and kept separate from D(H)SS knowledge bases. In the
    end each system which had a knowledge base had a separate one.


    # 11.1.1. D(H)SS headquarters staff


    The target users for the policy system were to be staff of the D(H)SS Policy Unit,
    exemplars of D(H)SS headquarters staff. The main application requirement for the
    policy team was to design a system to support policy workers in the way they undertook
    their task. It was to provide, among other things, facilities for problem structuring,
    detailed argumentation, evaluating and rationalising arguments supported alternative
    policy options. ''Task'' knowledge was expressed in the system software rather
    than explicitly in the knowledge base. ''Domain'' knowledge, knowledge about the
    benefits (such as benefit rates, time limits, and conditions which must be met
    by claimants), was explicitly expressed in'
