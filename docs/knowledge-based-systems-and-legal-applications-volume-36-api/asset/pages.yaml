    of a new case is identical to those in some previous one, then the corresponding
    ratio decidendi is applied by deduction ( ''syllogism'') like any other rule.
    Since this is not likely to happen often, Meldman has an additional ''analogy''
    mechanism to deal with cases which do not match exactly.


    Meldman''s analogy mechanism is based on a hierarchical classification of the
    concepts represented in his system. When the facts of a case do not match exactly
    the conditions of a rule in the system (expressing an established legal doctrine
    or the ratio decidendi of a previous case), Meldman''s system uses its classification
    of concepts to provide an extended notion of ''matching''. A fact in a case is
    considered to ''match'' in a rule when both are instances of a more general concept
    in the hierarchy. Thus ''kick'' and ''hit'' would match because they are instances
    of the more general concept ''violent physical contact''. In this way, the facts
    of a new case can be subsumed by the ratio decidendi of a previous, similar case.
    (Note that the analogy mechanism also applies to rules representing general doctrines.
    Since these have conditions that are already rather abstract the analogy mechanism
    is seldom invoked for.)


    Meldman stresses that his mechanism provides only a very simplified form of analogy.
    (In fact it corresponds to what is sometimes called ''first-order generalization''
    [Reynolds 1970]. Ashley [1985] has compiled a survey of research in artificial
    intelligence on reasoning by analogy and discussed the applicability of these
    techniques to applications in law. See also [Kedar-Cababelli 1984].


    Schild [1989] describes a quite different way of using the general doctrines that
    appear in a text like Prosser''s not as deductive rules in a legal analysis program,
    but as a way of organizing the storage of case reports and bringing the user''s
    attention to possibly relevant instances. What seems to have been a small student
    exercise, Hustler [1982] implemented a logic program based on Meldman''s extracts
    from Prosser; he did not attempt to reconstruct Meldman''s semantic network representation
    and directly ignored the analogy mechanism altogether.


    # 1.15.1. Commentary


    Meldman''s early system anticipated many of the features of current legal analysis
    programs. The treatment of general doctrines (where others have statutes) is fairly
    standard. It is the treatment of individual cases that need most comment.


    Meldman''s approach, to represent a case by a single rule expressing its ratio
    decidendi, has severe limitations. (These criticisms are intended to highlight
    the limitations of the approach, and not as attack on Meldman''s work.)


    Firstly, there is the problem of determining what should be taken as'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Legal Applications of KBS


    the ratio decidendi. As remarked earlier, this is the source of many legal disputes
    because the ratio decidendi of a case is very rarely stated explicitly. One could
    argue that in principle extracting a general rule from the decision of a case
    is no more difficult than determining how the provisions of a statute should be
    construed. But it must be clear that the significance of decisions in previous
    cases is much more open to other interpretations than the relatively precise statements
    that appear in statutes and other legislation. (That is one reason that statutes
    are passed.)


    Secondly, Meldman acknowledges, his simplified form of analogy (''first-order
    generalization'') is quite inadequate for what he intends. It is important to
    be clear why.


    Case law allows scope for generalization. If a statute mentions the term ''car''
    it would be difficult to argue that the term ''car'' was drafted to mean ''motor
    vehicle of any kind''. Suppose, however, that a case arises where a car is driven
    deliberately through a window and if later a truck is driven deliberately to cause
    similar damage, could reasonably be argued that the previous decision should be
    followed, because the judge in the previous case intended ''motor vehicle of any
    kind'' though he explicitly mentioned ''car'' in his judgement. This is type of
    reasoning that Meldman'' analogy mechanism is attempting to simulate and depending
    of what is in the hierarchy — it works in this example. But this mechanism is
    too simple to be useful. In a single example, suppose that another case arises
    where a car is driven deliberately through a window. Suppose a lawyer argues that
    a passenger should pay for the damages since the judge in the previous case meant
    ''any occupant of the car'' though he specifically mentioned ''driver''. Common
    sense suggests that such an argument is unlikely to succeed; in Meldman''s system
    it would succeed if both passenger and driver are instances of the more general
    concept ''occupant''. Of course, this could be avoided by adding more detail to
    the ratio decidendi that is stored. But this is no practical solution either.
    When we stop adding additional detail to the cases that are stored?


    Lastly, when a new case exactly matches the facts of an old case in Meldman''s
    system, the mechanism is simply to apply the rule in the old case directly. This
    too is an over-simplification. It is always possible to argue that the decision
    of a previous case should not be followed, because the new case has extra features
    not present in the old case. It must be stressed that exactly the same thing can
    arise if the rule applied to the facts of a new case is derived from statutes.
    For it is also possible to argue that the statute should be construed differently
    by pointing to special features in the case and arguing that these could not have
    been anticipated. When the represented facts of a new case are identical to those
    of an old case, Meldman''s system behaves exactly like one'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# The Representation of Law in Computer Programs


    which incorporates a single, fixed interpretation of the law. The reason that
    Meldman''s system is unlikely to produce a useful analysis in such circumstances
    is due entirely to the difficulty of extracting a general rule or ratio decidendi
    and finding some reasonable consensus that the rule accurately expresses what
    the case is taken to mean in practice. Finding some reasonable consensus about
    the meaning of a set of statutory provisions is very much easier (though there
    are many exceptions).


    When dealing with statutes (or even very well-established common law ''doctrines'')
    it is possible to predict that a new case has a definite answer and still obtain
    a useful analysis (if the statute is clear and detailed, for example). But law
    is so open to different interpretations, and the significance of any individual
    case is so dependent on context, that it is unrealistic to think that a program
    can yield a definite answer, or even attempt to do so. I think the limitations
    of Meldman''s system come essentially from this. A discernible trend in other
    approaches to the treatment of case law and open texture generally has been to
    concentrate on producing an analysis of possible solutions, rather than seeking
    a ''right'' answer. As a first example, the next section presents Anne Gardner''s
    approach to the treatment of open texture.


    # 11.52. Gardner


    The main aim of Anne Gardner''s doctoral project [Gardner 1983, 1984, 1985] was
    to address directly the treatment of open texture and thus the use of case-based
    reasoning to complement reasoning with statutes. A central feature is her attempt
    to construct a system that can identify which parts of a case are ''easy'' and
    which involve the resolution of ''hard'' legal questions. The system was implemented
    to perform at a level of sophistication that it could analyse examination questions.
    The problem domain is the law of contracts, and specifically offer and acceptance,
    a concept which is defined mostly by case law. The significance of examination
    questions lies in the type of analysis that is required to answer them. Given
    some hypothetical state of affairs, a candidate is expected not to dwell on the
    trivial but recognize the important legal questions arise (the ''issues'') and
    discuss their effect on the possible outcome of the case. It is this ''issue spotting''
    ability that Gardner was attempting to simulate in her program. Gardner''s system
    is implemented in MRS [Genesereth et al. 1984].


    In describing Gardner''s system it is again to separate the component which applies
    relatively clear rules (normally derived from statutes) from that part which specifically
    addresses reasoning with case law. In addition to the ''relatively clear rules''
    which provide definitions for technical legal concepts, Gardner''s system contains
    rules expressing common-sense definitions of non-technical concepts (CSK rules).'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Legal Applications of KBS


    concept can have both a technical and a non-technical definition: in such cases
    the technical definition is normally preferred.


    The feature of Gardner''s work which most distinguishes it from previous approaches
    is her emphasis that most legal questions do not have a single ''right'' answer
    (until they have been decided in court). Her system is designed to provide various
    analyses leading to alternative outcomes. Gardner describes a mechanism which
    produces as output a tree of all the solutions which can be reached for a given
    case. Branches in this tree are introduced by the presence of open textured concepts
    which cannot be decided one way or the other. An alternative way to view this
    mechanism is in terms of a standard deductive system which determines whether
    a legal concept holds by reasoning backwards with the rule that defines it. This
    system does not attempt to determine whether involving open textured concepts
    are satisfied. Instead, such conditions become qualifications on the final conclusion
    reached. Gardner''s tree of possible solutions corresponds to a set of conditional
    answers, where each answer is qualified by the open textured conditions that remain
    to be determined. (A mechanism that produces such sets of conditional answers
    can be implemented straightforwardly by modifying a standard theorem prover. Alternatively,
    Gordon [1989] has suggested using an ATMS [deKler 1986] for the same purpose.)


    In practice, not all occurrences of open textured concepts are ''hard'' (If they
    were everything would be an ''issue'' which is clearly not the case.) The other
    main component of Gardner''s system attempts to determine which of the open textured
    conditions are ''hard'' (the ''issues'') and which are ''easy''. To capture the
    notion of ''hard'', Gardner allows a concept to be defined by several different
    rules which has several competing definitions, every competing rule must be tried.
    If the system encounters a condition which the choice of rule makes a difference
    to the outcome (the rules do not agree in their conclusions) then there is a ''hard''
    legal question and the condition becomes one of the final conclusion reached.
    If all the competing rules agree, the condition is taken as decided and does not
    become a qualification on the final conclusion. Gardner suggested a number of
    other heuristics that could be used in addition to distinguish ''hard'' from ''easy''
    conditions. (Again, my account of Gardner''s system simplifies the original presentation
    but preserves the essential features.)


    Gardner also proposed an extension to allow her system to generate competing arguments
    for the different ways that ''hard'' questions could be decided. The generation
    of arguments both for and against a legal conclusion is also a feature of several
    other approaches to case-based reasoning described in later sections.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '60


    The Representation of Law in Computer Programs


    # 1.15.3. Meldman and Gardner chose very difficult areas of law as their


    experimental domains. Assault and battery and offer and acceptance are

    both areas of law that rely less on a detailed knowledge of technicalities

    than they do on the need to apply common-sense. As McCarty points out

    (section 1.12.1), it is the representation of the required common sense

    that make these apparently ''simple'' areas of law among the most difficult

    to address computationally, and P partly with hindsight P he cites

    battery and offer and acceptance as specific examples of law that

    could be expected to cause most representational problems.


    Gardner''s project placed a great deal of emphasis on the treatment of

    common-sense. The CSK rules in her system are an example of this


    concern, but the whole work is largely dominated by consideration of the

    common-sense required to understand the notion of offer and acceptance.

    For example, a central concern in offer and acceptance is whether a-

    icular form of words or does not constitute an offer, and whether

    t form of the reply signals acceptance. Does a letter which mentions

    t price of an item constitute an offer to at this price? Is there

    difference if the letter arrives in direct reply to an inquiry? Does

    matter whether the reply is sent in telegram rather than a letter?

    These are some of the questions Gardner addressed in her project.

    She devoted a great deal of effort to devising a method of representation

    base Searle''s theories of speech acts. In my opinion, all this-

    tracted attention from the fundamental aims of her project which were to

    address aspects of legal reasoning in terms of very difficult issues

    directly concerned with the comprehension of natural language.


    Others have also argued for the generation of alternative, conditional

    solutions to account for the presence of undecided open-textured

    concepts (see for example section 1.10.1 on logic programming techniques

    and [Sergot 1985a]), but no one else has stressed this as much as

    Gner. Neither has anyone else addressed directly to distinguish

    ''hard'' questions from ''easy'' ones. Gardner''s motivation was essentially

    simulate aspects of legal reasoning in an artificial intelligence approach,

    but the question has practical considerations too. Without some

    dinction all open textured concepts are ''hard'' and the trees of

    conditional analyses unusually bushy. I think this is the most

    interesting part of Gardner''s work and I think it is a great pity that she

    did devote more attention to it in her account of the work.


    # 1.16. TAXMAN II AND LANGUAGE FOR LEGAL DISCOURSE


    McCarty''s TAXMAN project was introduced in section 1.12, which

    described the early part of this work (TAXMAN I). The TAXMAN I

    system can be viewed as an implementation of deductive reasoning

    rules which are expressed in terms of a structured representation of the'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Legal Applications of KBS


    underlying domain. TAXMAN II builds on earlier work.


    There are two main lines of investigation which McCarty has been pursuing in TAXMAN
    II. The first addresses specifically the treatment of open texture. It proposes
    a structure called prototypes-plus-deformations, to be incorporated as an extension
    to the logical templates framework used in TAXMAN I. The other part of TAXMAN
    II is the development of a version of deontic logic (the logic of obligation,
    permission and prohibition).


    McCartys'' most recent work has been on components of a language for legal discourse.
    This work is described in section 1.16.3.


    # 1.16.1. Prototypes plus deformations


    Although the domain in which TAXMAN operates is the largely artificial one of
    objects like corporations, stocks and transactions, the meaning of these concepts
    is subject to change as that of concepts in any other area of law. McCarty has
    been investigating treatments of open texture and the representation of ''evolving
    systems of legal concepts'' since the late 1970s (at that time in connection with
    Sridharan) [McCarty 1980c; see also Cook et al. 1981]. The primary goal of this
    work has been theoretical, to cast light on the nature of legal reasoning. These
    led McCarty and Sridharan to propose a ''computational theory of legal argument''
    based on the representation of concepts in structures called prototypes-plus-deformations
    [McCarty and Sridharan 1981, 1982]. See also [McCarty 1989b].


    The prototype-plus-deformations structure is based on the idea that a legal concept
    whose meaning has evolved with the accumulation of case law can be represented
    in terms of a structure with three components.


    +   1. There is an invariant ''core'' which expresses necessary but sufficient
    conditions for the concept to hold. This component can be optional.


    +   2. There is a set of exemplars each of which matches but not all instances
    of the concept.


    +   3. There is a set of transformations which express the relationship between
    the exemplars by stating how one exemplar can be mapped into another.


    The resolution of a legal question, in other words deciding whether an open textured
    concept does or does not apply to the facts of a new case, involves argumentation.
    In the prototypes-plus-deformation model, to support a claim or hypothesis that
    the concept holds for a new case, it is necessary to demonstrate how a coherent
    representation of the concept can be constructed in the prototype-plus-deformation
    framework in such a way that the new case is included. A ''coherent representation
    is one in which a sequence of allowed transformations maps the new case into one'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# The Representation of Law in Computer Programs


    for which the concept is decided. This process might generate hypothetical cases
    where there is agreement whether the concept holds. Legal argumentation is adversarial
    in nature: it would be up to the opponent to construct another representation
    of the concept in which the new case is decided differently, which accounts better
    for the known cases where the concept is decided.


    McCarty has shown how some of the arguments used by senior judges in key cases
    concerning the concept of ''taxable income'' can be reconstructed in this model
    [McCarthy 1980a, 1982; see also Brody 1980].


    I found it difficult to access McCarthy''s proposal for prototypes-deformations.
    Though some specific examples are given, the prototype-deformation model is still
    vague and has not been described in sufficient detail to evaluate its adequacy
    or its intended uses (in my opinion). Some of McCarthy''s model of legal argumentation
    can be reconstructed in logical terms P the transformations associated with a
    concept are applied to the new case to generate a hypothesis for a definition
    of the concept, and then this hypothesis is tested for consistency with decided
    cases. This reconstruction would provide an alternative account of the judicial
    arguments considered by McCarthy, but I am unsure of what extent this reconstruction
    would accurately reflect McCarthy''s intention. Similarly, it is unclear (to me)
    whether McCarthy is suggesting that all legal argumentation can be reconstructed
    in terms of the prototype-deformation model, or whether this is intended to account
    only for certain but but specific patterns of legal argument.


    # 1.16.2. Permissions and obligations


    The nature of the legal knowledge in the corporate tax domain of TAXMAN led McCarthy
    to investigate the representation of the deontic concepts, and reasoning with
    the concepts of permission and obligation particularly. In the course of these
    investigations McCarthy has proposed a system of deontic logic [McCarthy 1983b,
    1986]. McCarthy''s deontic logic is unusual, in that the output he has given consideration
    to its suitability for computation.


    There is a substantial amount of literature devoted to deontic logic, though very
    few of the logics have addressed computational issues. One exception is Belzer''s
    system 3-D [Loewer and Belzer 1983; Belzer 1986a, 1987]. Belzer''s logic is also
    interesting because it is designed to address defeasible reasoning (the derivation
    of conclusions which may have to be withdrawn if new information is made available).
    Defeasible reasoning is a central research issue in its own right, for all applications
    of artificial intelligence. An interesting discussion on the relationship between
    obligation and permission, with special reference to McCarthy''s'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Legal Applications of KBS


    logic, is given by Jones [1987]. Standard references to deontic and related logics
    include the texts by Castaneda [1975], Hilpenen [1971], Rescher [1966], Smith
    [1976] and von Wright [1963]. See also [Jones and Prin 1985, 1986] for an example
    of a recent approach. Hohfeld [1913, 1917] is also closely related.


    The role of deontic logic in the computer representation of law has received comparatively
    little serious attention. [See Sergot 1985a], [Bench-Capon 1989b], [Jones 1989]
    and of course McCarty for some dis-cussion.


    As a practical matter, the occurrence of deontic modalities in legislative texts
    often be ignored or approximated adequately. But not always. Representation and
    reasoning with the deontic concepts must be addressed adequately with some parts
    of law. Indeed it can be argued to ignore the distinction between ideality (what
    ought to be) and actual (what is the case), and to ignore deontic reasoning, is
    to ignore one of the most essential features of legislative language and legal
    reasoning. There is also an extreme position which deserves some comment.


    Because all law can be regarded as a set of norms, and because legislative language
    contains many occurrences of deontic modalities, it is sometimes suggested that
    for the adequate representation of law. Some proposals for incorporating deontic
    logic in a representation language for law seem to assume that there are only
    technical obstacles to be overcome — there is the problem of deciding which particular
    version of deontic logic is most appropriate, and there is the problem of automating
    deduction in this logic with reasonable efficiency. These proposals do not question
    where deontic reasoning is present in legal reasoning or when it is required for
    an adequate computer representation of law.


    McCarty’s position — which happens to coincide with my own has clearly stated.
    Deontic modalities are encountered in legislation and the need for reasoning with
    the deontic concepts does arise in legal analysis and problem solving. But deontic
    concepts have no extraordinary status in this respect: they are one instance of
    a whole range of modalities and concepts that deserve attention.


    McCarty’s most recent work on his Language for Legal Discourse subsumes his work
    on deontic logic and addresses some of these other concepts within one general
    framework. This work is described in the next section.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 1.16.3. Language for Legal Discourse


    McCarty''s proposal for a Language for Legal Discourse consolidates his work on
    TAXMAN and sets objectives for future developments.


    He present the basic idea very succinctly: There are many common sense categories
    underlying the representation of a legal problem domain: space, time, mass, action,
    permission, obligation, causation, purpose, intention, knowledge, belief, and
    so on. The idea is to select a small set of these common sense categories, the
    ones that are most appropriate for a particular legal application, and then develop
    a knowledge representation language that faithfully mirrors the structure of this
    set [McCarty 1989a].


    The core of McCarty''s Language for Legal Discourse is its intuitionistic logic
    programming language [McCarty 1988a, 1988b], whose elements were summarized in
    section 1.10.5. This core is to be extended to provide a range of integrated language
    constructs that support directly representation of the common sense categories
    mentioned above. As an initial set of such ''building blocks'' McCarty identifies
    sorts and subsets, count terms and mass terms, prototypes and deformations, time,
    events and actions, and permissions and obligations [1989a]. Some of these components
    already exist or can be integrated from McCarty''s earlier work. Others are the
    subject of future developments.


    Although some elements of it will emerge in the short term, McCarty''s Language
    for Legal Discourse is clearly a very ambitious and long term research plan –
    what he is describing is essentially a substantial part of a complete computational
    theory of practical reasoning.


    # 1.17. CASE-BASED REASONING


    The main part of this section (1.17.2) describes HYPO, part of a project on case-based
    reasoning conducted by Edwina Rland and Kevin Ashley at the University of Massachusetts.
    Section 1.17.3 provides some very brief descriptions of other work on case-based
    reasoning and references to related proposals. Other approaches to case-based
    reasoning covered by this survey appear in sections 1.14 and 1.15.


    It is easiest to explain the operation of HYPO by considering first a simplified
    version of its retrieval mechanisms. I do this in section 1.17.1 This allows me
    to present a simple and common scheme for storing and retrieving cases, with references
    to two specific examples of this type (the case law component of DataLex and the
    SARA system). HYPO itself is described in section 1.17.2.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 1.17.1. Retrieval from a database of examples


    A simple and practical approach that has been suggested for dealing with case
    law is to construct a database of examples together with the decision in each
    case. The examples are either stereotypical cases, or real cases that have been
    decided. When presented with a new case for decision the system will attempt to
    match the case under consideration with the cases in its database to extract those
    which appear to be most similar. Method of describing cases at an appropriate
    level of abstraction is obviously required, together with a matching algorithm
    for measuring ''similarity''.


    If attention is restricted to some specific open textured concept, then it is
    sometimes possible to draw up a list of factors that are taken into account when
    a case involving this concept is decided. Every case in the database would be
    stored with a list of these factors which applied enough to. (Of the list would
    have to be large enough and flexible to capture all possible variations, and therein
    lies a major potential.) A matching algorithm is now required to measure the ''similarity''
    of cases in terms of these factors. The simplest proposals would associate some
    kind of weight with each factor as a means of indicating which features of an
    example were considered to be most relevant in determining a decision in its case.
    In this sort of scheme the matching algorithm calculates a weighted sum and the
    examples with scores above some threshold are taken to be the most ''similar''.
    More sophisticated matching algorithms which take other factors into account could
    course be devised. (See [Bench-Capon and Sergot 1985] for further discussion.)


    This is roughly the approach that has been taken to the treatment of case law
    in the DataLex project (section 1.7.3). In DataLex, ''legally significant parameters''
    correspond to what I have called ''factors'' and the matching algorithm is based
    on measures of similarity and statistical analysis (Greenleaf et al. 1987).


    In some respects, this is also the approach that was taken in the SARA system,
    though the function of SARA was not to retrieve similar cases but to assist in
    the analysis of cases governed by discretionary rules. SARA was developed as a
    demonstration prototype at the Norwegian Research Centre for Computers and Law
    (NRCCL). The user would describe a new case in terms of factors that would influence
    its decision, and SARA would indicate the estimated ''weight'' or importance of
    each factor calculated by comparison with the factors that had influenced past
    decisions stored in its database [Bing 1980].'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 1.17. HYPO


    HYPO [Ashley and Risland 1986, 1987, 1988; Risland and Ashley 1987; Risland 1989;
    Ashley 1987, 1989] is based on Risland''s earlier work on reasoning from examples
    [Rissland and Soloway 1980; Risland 1983; Risland, Valcarce & Ashley 1984] and
    the structure of arguments [Rissland 1984, 1985a, 1985b]. See also [Mendelsohn
    1989] for a case study.


    Ashley and Risland''s approach involves both the retrieval of relevant legal sources
    (cases) and the use of these in the construction of legal arguments. Ashley and
    Risland leave the actual decision-making-to the user of the system: the function
    of their system is to generate arguments to assist in reaching a decision. HYPO
    operates in the domain of trade secrets law.


    The retrieval component of Ashley and Risland''s HYPO is a sophisticated elaboration
    of the basic idea sketched in the previous section. The most severe limitation
    of simple scheme is that a case must be described in terms of abstract ''factors'':
    the major part of analyzing a case is determining what the relevant factors are.
    In an attempt to overcome this limitation, HYPO maintains a library of dimensions,
    each one of which, in the first instance, corresponds roughly to one of the ''factors''
    that determine the outcome of a case. In addition, each of HYPO''s dimensions
    contains a set of conditions which specifies when the dimension applies in a given
    case. These conditions are expressed in terms of factual predicates which are
    used to describe a case. Given a case described with factual predicates, HYPO''s
    case-analysis module can then determine which of the dimensions in its library
    apply to the facts of the case. This is implemented by a similar mechanism to
    provide a more detailed analysis, HYPO''s case-module also determines which of
    the dimensions in the library nearly apply to the facts of the case: each dimension
    in HYPO also contains a set of conditions which specify when the dimension nearly
    applies. Given a new case, the case-analysis module constructs list of dimensions
    that apply and nearly apply to the facts. This list of applicable and ''near miss''
    dimensions is then matched against cases in the database to extract which are
    similar. The matching cases are ordered (in a lattice) from most-on-point to least-on-point.


    This simplified description only accounts for HYPO''s retrieval process. The other
    main component in HYPO uses the set of retrieved cases to construct the skeleton
    of a legal argument, in which cases are cited for and against a particular decision
    in the new case. The structure of this argument is determined by the cases which
    have been extracted and their relative ordering. The argument includes references
    to cases which could be cited as counterarguments, and also provides citations
    that could counter the counterarguments. The argument might


    ![](img/fd9daa466aa6610f0ebd57e2ccc632c5_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Legal Applications of KBS


    further refined by the addition of hypothetical cases [Rissland 1984, 1985a].
    Hypothetical cases are generated by a set of heuristics which suggest what kind
    of hypothetical case might be useful in an argument, and by another component
    stored in each dimension.


    # 11.73. Related research


    In certain respects the basic operation of HYPO, and its motivation, resembles
    a treatment of open texture proposed by Bench-Capon and Sergot [1985] which uses
    sets of conflicting rules to generate arguments for and against a particular decision
    (also reminiscent of Gardner''s work described in section 1.15.3). Bench-Capon
    and Sergot''s proposal is very preliminary and the structure of the arguments
    it could generate not compare with the sophistication of those produced by HYPO
    but it would be immensely interesting (and challenging) to investigate whether
    HYPO could be reconstructed in logical terms along these lines.


    Any treatment of open texture must recognise the adversarial nature of reasoning
    in law. All the proposed treatments of open texture described in this survey have
    stressed the generation of arguments. There have been several recent proposals
    to base future investigations on the work of philosophers like Toulmin 1958, 1972;
    Toulmin et al. 1979). See for example [Dick 1987] and [Marshall 1989]. Perelman''s
    work in jurisprudence is also closely related [Perelman 1963; Perelman and Olbrechts-Tyteca
    1969]. See also [Branting 1989] for a different approach to dealing with precedents.


    In addition to projects already described, there seems to be (surprisingly) little
    research on the use of artificial intelligence techniques to model argumentation.
    But see see [Birnbaum et al. 1980], [McGuire et al. 1981], [Birnbaum 1982] and
    [Dyer and Flowers 1985].'
  merge: -1
