    # 7.11. EVALUATION OF LOD3


    The project had originally planned to carry out a study of the decision-making
    environment and the attitudes towards technology in DSS local offices. This would
    have provided a context and possibly a benchmark for evaluation of the eventual
    LO demonstrator. Unfortunately, the project was not able to achieve access to
    the local offices and so the proposed study had to be Abandoned. At a later date,
    however, a number of'
