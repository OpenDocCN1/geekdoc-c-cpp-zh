    The result of the evaluation of the Forms Helper prototype was that we had a much
    clearer idea of what the second demonstrator should look like and how it should
    function. This demonstrator was built in Manchester by the team at ICL, while
    the design and evaluation activities had been carried out in Guildford. It was
    necessary for the designers to convey precisely to the implementors what was required
