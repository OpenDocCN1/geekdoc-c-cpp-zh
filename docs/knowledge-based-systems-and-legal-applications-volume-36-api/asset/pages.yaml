    +   (b) blocking of ''fast paths'' where legislation has recently changed;


    +   (c) multiple levels of detail available in explanations;


    +   (d) discrimination between assumed/told/verified status of input data;


    +   (e) support for OCAO and policy monitoring (selective retrieval of cases having
