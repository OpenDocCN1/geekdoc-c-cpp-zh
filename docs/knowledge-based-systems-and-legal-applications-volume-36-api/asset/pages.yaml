  md: '# Legal Applications of KBS


    the Department''s records, but which must be estimated by the claimant and his
    advisor on the basis of his remembered work history. The existence of formal and
    universally applied guides is perhaps unusual, in many other areas of law there
    exist commentaries and textbooks which are used by the would-be expert in a very
    similar fashion.


    The other component of an adjudicator''s expertise is his knowledge of procedures.
    As well as knowing, for example, that he requires a birth certificate to establish
    the age of the claimant, he also knows how to go about obtaining this information:
    whether he should write to the claimant, whether he should request the original
    or a photocopy, or whatever. This is perhaps most clearly seen in the case of
    contributions records: the adjudicator knows that he must send a request to the
    appropriate of the Department on a specified form, and what boxes will be ticked
    if the claimant''s record is satisfactory. In this case he need no knowledge of
    what the contribution conditions are — he knows what he must do if they are satisfied.
    He will also know a number of administrative procedures, so he can take the correct
    action on accepting or rejecting a claim. Thus the expertise of the adjudicator
    will consist of a number of acquired relationships between facts he can discover
    and the questions he must decide and a number of procedures which help him discover
    facts, resolve questions and take appropriate actions.


    When the claim is decided and payment made or withheld is itself a fact, and it
    is possible for interested parties to relate to this facts about affairs that
    the legislation has brought about with the people receiving and not receiving
    the benefit. This gives the opportunity to evaluate the working of the whole system:
    the policy maker who formulated the original legislation can compare the state
    of affairs that the original goals that motivated the legislation, and decide
    whether they are achieved or not, and so whether the legislation should be amended.
    For example, it may have unforeseen that a consequence of the legislation in regulation
    3(1)(i) would be that an infrequent attendee of a hospital would be avail himself
    of the therapeutic earnings provision. If this consequence was both unforeseen
    and in conflict with the goals which motivated the provision, then the relevant
    legislation will require amendment. Similarly, if the exclusion of someone who
    attending a hospital was unintended. the state of affairs of legislation will
    be evaluated by the policy makers, but will also be evaluated by other interested
    parties. Pressure groups, for example, often detect what they consider to be conflicts
    between the consequences of legislation and what they believe to be the goals
    of the legislation, and mount campaigns for change. Evaluations will be performed
    from different perspectives, and may rise to different conclusions.'
