  md: '# Legal Applications of KBS


    arise in this area.


    # 4.2. POLICY MAKERS AND WHAT THEY DO


    A major role of the UK government departments is to advise ministers and other
    government officials regarding changes in policy and the development of new legislation
    to achieve these policy objectives. This work is carried out by the policy divisions,
    staffed by senior civil servants. The work centres around the formulation of new
    policy — which takes many years to develop and implement. Policy divisions also
    have a responsibility for providing explanations of the existing policy to any
    other government officials or members of the general public who may require this
    information. Such queries often arise in the form of parliamentary questions put
    to the minister, or government, through the House of Commons.


    One of the problems in describing what policy makers do is that there is no clear
    consensus on what the process involves. In particular there is the danger of adopting
    an ‘over-rational’ account of the policy process. In fact, policy making is an
    extremely complex process without beginning or end, and whose boundaries remain
    uncertain. Somehow a complex set of forces together effects called “policies”.
    In order to identify the genuine potential of KBS support policy it is necessary
    to impose boundaries on the scope of the support in such a way that it is relevant
    for the environment within which policy is carried out and for the conceptual
    tasks which actually require support.


    # 4.2.1. The policy environment.


    The environment within which policy is developed is the result of a complex interaction,
    on the one hand, certain structural, historical, almost ‘objective’ features of
    the policy process and, on the other, the cultural, personal and ‘idiosyncratic’
    characteristics of the policy makers themselves. Among the structural aspects
    there are four major factors.


    Firstly, the policy divisions are not themselves responsible for decision-making:
    all decisions are made by the government minister based on the advice of the policy
    divisions. The policy worker is responsible for producing submissions to which
    outline the options available along with various evaluations of these options.
    Secondly, the staff in the policy divisions are typically generalists, requiring
    a breadth of understanding of the whole of the policy and legislation, drawing
    on the services of expert statisticians, solicitors or economic advisers as and
    when they needed. Partly in order to maintain this general appreciation, a policy
    worker will typically be moved into another area of policy work within three to
    four years. Thirdly, policy development has been seen as a group decision process,
    with any proposals for change needing the involvement of those policy workers
    responsible for any of the areas'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'which may be affected by the proposed changes, an aspect which is discussed
    in detail in Chapter 14. In a broader sense, it is also subject to the opinions,
    and even prejudices, of the interested parties outside the government department
    who may be lobbying for, or resisting change. Lastly, it is worth noting that
    one of the major criteria in the evaluation of policy is the avoidance of ‘overlooking’
    or failing adequately to follow though the implications of a new item of policy
    — whether in terms of its material effects or simply in terms of the arguments
    and reactions in which it results.


    It is perhaps also useful to note certain characteristics of social welfare policy
    which makes it particularly complex. Social security benefits are intended to
    support the whole range of welfare needs that people may have. The range of attributes
    of people who may be interesting to the social security policy maker is therefore
    extreme. The Statutes on Social Security are necessarily complex: because they
    have to provide so many benefits in so many different circumstances. Historically
    there have been many changes in the commitment to delivering principles of social
    welfare, the social and political expectations from the policies and the different
    approaches to the implementation of policies (particularly in terms of the codification
    in legislation). This has further complicated an inherently complex set of issues
    and policies.


    These structural features are one source of the complexity in trying to understand
    and support the policy process; the cultural features are, perhaps, even more
    complex.


    The culture within policy divisions in UK government departments is one of the
    most unusual, idiosyncratic and, to an outsider, perplexing features of the British
    policy process. Policy makers include people of high intellectual qualification
    who take great pride in the creativity, relevance and persuasiveness of their
    ideas and (sometimes an even greater concern with) the form and quality of their
    presentation. They include people who are enthusiastic about the potential of
    technology and others who are reluctant to see its introduction, being content
    with well-established traditions and procedures.


    The skills of the policy maker are essentially untaught, being acquired through
    exposure to the complexities of the task and by the support and example of more
    senior policy staff. The policy task itself requires co-operative, creative and
    analytical skills which are adaptive to rapidly changing situations. Within such
    an environment it is not surprising that the styles and working methods are diverse.


    In all cases the requirements of particular ministers are of first priority and
    the results of the policy process must satisfy such external expectations along
    with other, more objective, criteria of adequacy. The process itself, however,
    is subject to considerable variety. Some of this variety arises from differences
    in the character of individual policy staff.'
