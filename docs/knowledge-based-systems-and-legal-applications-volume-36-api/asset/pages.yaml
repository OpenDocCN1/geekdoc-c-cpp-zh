- pgno: 20
  md: '# CHAPTER 1


    # THE REPRESENTATION OF LAW

    IN COMPUTER PROGRAMS


    Marek Sergot


    # 1.1. INTRODUCTION


    There is a substantial amount of literature concerned with the applications of
    computers to law. This chapter is a survey of those projects which have proposed
    or implemented representations of law in a form which can be processed by computer.


    The survey is not primarily a catalogue of projects. I have tried to compare and
    contrast the various approaches that have been taken, and to indicate how they
    are related to one another. I have selected for detailed consideration certain
    projects, or groups of projects, which are representative of a particular approach.
    For each, I have given a basic description of the project and references to similar
    projects elsewhere. These descriptions are just abstracts. Concrete examples would
    course make the descriptions more intelligible and self-contained, but space does
    not permit. In addition to the abstracts, I have added a commentary of my own.
    This commentary identifies the characteristic features of the approach represented
    and discusses the fundamental issues raised. The survey can be read in two ways:
    its main aim is to describe and compare the various approaches, but it can also
    be read as a catalogue of abstracts by ignoring the commentary included with each
    entry.


    It is always dangerous to attempt a comparative survey, particularly in an area
    which has such a wide range of diverse approaches. Even this survey makes no specific
    recommendations on relative strengths and weaknesses, it must be stressed that
    my commentaries'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# The Representation of Law in Computer Programs


    express a personal opinion. I have not been able to discuss every aspect of every
    project. In omitting some detail, I may have misrepresented some projects unintentionally,
    or imposed an emphasis that the original investigators would not share. Definitive
    accounts of projects can len only be obtained from the originators. I have included
    references to all the projects I mention.


    # 1.1.1. The representation of law in computer programs


    Many of the projects described in this survey are examples of what McCarty [1983a]
    has called legal analysis and planning systems. In all general terms, such a system
    allows the facts of a real or hypothetical case to be represented at some appropriate
    level of abstraction; it incorporates a representation of the law in one form
    or another; it is designed to ''apply'' or ''match'' this representation to the
    given facts; and it can then determine what legal concepts and relationships would
    seem to hold and what legal consequences would seem to follow. As McCarty points
    out, this is the kind of system that most comes to mind when computer-based legal
    consultation is referred to.


    The description is over-simplified. In particular, the nature of the law is that
    we can never say with certainty whether a legal concept does or not apply in a
    given case. In all exceptional circumstances, it is not computer programs but
    courts of law or other adjudicating authorities that decide such questions.


    Though there are notable exceptions, most projects concerning the computer representation
    of law use of artificial intelligence techniques. In such cases, it is common
    to speak of programs that can ''read with the law''. References to legal expert
    systems are also common. In this survey I shall avoid referring to a program as
    an expert system. The term is now so imprecise that it has lost most of its meaning.
    Worse, the term ''expert systems'' has many connotations, some of which are unacceptable
    in an area sensitive as that. I prefer to speak of computer programs that represent
    the law, and that can process, execute, or ''reason with'' these representations.
    Where I use the term ''expert system'' it refers specifically to a particular
    approach.


    Representation of the law in computer programs is not a new idea. Loevinger [1949]
    and Mehl [1958], for example, anticipated many of the systems that are currently
    being implemented and proposed. And of course speculation on the possibility of
    mechanising parts of the legal process predates this by centuries. Similarly,
    some of the earliest computer applications can be regarded as embodying a representation
    of law. Payroll systems, for example, perform calculations on salaries and make
    deductions as laid down by tax and related legislation. Indeed, many data processing
    applications are essentially (quasi) legal, in that'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Legal Applications of KBS


    they are designed to administer the rules and regulations that govern the running
    of an organization. The idea that many actual financial and administrative systems
    can be specified, first in terms of rules and regulations, and then in terms of
    the way these regulations are translated into information processing tasks, is
    the basic motivation behind Ronald Stamper''s LEGOL project. LEGOL is examined
    in section 1.9 of this chapter.


    Following Stamper, section 1.7.5 classifies administrative data-processing systems
    as programs that incorporate a representation of ''law'', where this representation
    is not made explicit. It is freely admitted, of course, that a typical payroll
    system would not be classified by most commentators as a ''legal analysis system
    that can reason with tax law''. Nevertheless, there is no essential difference
    between a program that calculates how much tax to deduct from an employee''s salary
    and a program that determines whether a legal concept (like ''taxpayer'') should
    apply in the case of a given individual.


    # 1.2. SCOPE OF THE SURVEY


    There is a topic of direct relevance to this survey, which has a much longer tradition
    than computing or artificial intelligence. The role of logic in the law, and the
    logical analysis of law and legal reasoning, have always been central issues in
    jurisprudence and legal philosophy. Although I do not attempt a survey of writings
    on this topic, I have included some discussion because investigations into the
    logical analysis of law and legal reasoning are directly related to many current
    projects concerning the computer representation of law. Moreover, any representation
    of law in any form of symbolic logic can, in principle, be processed by computer.


    Most applications of computers to fall outside the scope of this survey. Many
    have nothing to do with representing the law: word processing, accounting, time-costing
    and time-recording, communication systems, court administration systems, and so
    on, are excluded from this survey. On computing applications in the law office
    generally, see for example [Bellord 1983], [Ruoff 1984]. Also excluded are those
    computer systems that store and retrieve legal documents. If this had been justified,
    one could distinguish between the sources of law, such as statutes, codes, rules
    and regulations, case reports and legal textbooks, the law itself, that is actually
    applied by judges and lawyers and other legal practitioners. Document retrieval
    systems store and retrieve the sources of law. This survey is concerned instead
    with systems that attempt to go beyond the text itself, to represent and process
    the ''meaning'' of legal documents. For an excellent survey of document retrieval
    systems in law, see [Bing 1984].


    Document retrieval systems are excluded from the survey but they'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# The Representation of Law in Computer Programs


    are not disregarded entirely. There is a body of work that attempts to enhance
    the functionality of document retrieval systems by incorporating a representation
    of the law to guide the retrieval process. Much of this work has been influenced
    by, and influenced in turn, approaches more directly concerned with representing
    and reasoning with law. This work is covered in section 1.14. Lastly, some projects
    P, particularly those concerned with case law P, can be regarded as reasoning
    with representations of the law essentially for the purpose of identifying relevant
    legal sources.


    There is also a small body of research on the use of artificial intelligence techniques
    to study the cognitive processes involved in legal reasoning. This work falls
    outside the scope of this survey. See [Kolodner et al. 1985] for an example.


    # 1.2.1. Sources of information


    No detailed comparative assessment of the leading projects in this area has been
    published to my knowledge, though several useful surveys and digests are available.


    Many of the supplementary references for this paper were taken from an extensive
    bibliography and collection of abstracts compiled by Biagioli and Fameli [1987],
    and from the bibliography by Richard Susskind''s doctoral thesis and book [Suskind
    1986a]. The survey in Anne Gardner''s doctoral thesis [1984] is also recommended.


    A concise account of early projects is provided by [Cook et al. 1981] in which
    the investigators of six projects summarize their work. A general article by Thorne
    McCarty [1983a] from the same period describes several potential types of application
    and is a good introduction to the area.


    In 1979, a meeting on computers and law held in Swansea was attended by most of
    the leading researchers in the field. The collection of papers that resulted from
    meeting providing good accounts of important projects [Niblett 1980]. IDG (Istituto
    per la Documentazione Giuridica) in Florence has organized a series of conferences
    (proceedings include [Ciiampi 1982], [Martino 1982] and [Martino and Socio 1986])
    and publishes a Informatica e Diritto. Conferences were held at the University
    of Houston in 1984 and 1985 (proceedings in [Walter 1985, 1988]). Lastly, in addition
    to the numerous conferences and workshops that take place regularly, there is
    an established series of International Conferences on Artificial Intelligence
    and Law. The first was held in Boston in 1987, the second in Vancouver in 1989
    and the third will take place in Oxford in 1991. The proceedings of these conferences
    give an up-to-date account of many current projects and excel which have had to
    be omitted from this survey.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Legal Applications of KBS


    # 1.2.2. Structure of the survey


    The main part of the chapter comprises the survey of projects and approaches.
    The abstract provided with each entry can be understood without reading the attached
    commentary.


    It is the issues discussed in the commentary which determine the order in which
    projects appear in the survey. The commentaries grow progressively smaller because
    many of the issues will have arisen already. The commentaries in the first two
    entries are the longest since they must introduce the most fundamental questions
    that apply to any attempt at representing law in a computer program. This would
    have been the case whatever order had been chosen.


    Because projects are not listed in chronological order, the next provides a brief
    historical overview to give some impression of the scope and development of the
    field.


    # 1.3. HISTORICAL OVERVIEW


    The computational formalisms that used to represent and process the law in computer
    programs can take many forms, not excluding conventional programming languages.
    It is artificial intelligence techniques, however, which are normally associated
    with projects in this area.


    The first serious proposal for research into the application of artificial intelligence
    techniques to law was made by Buchanan (who was involved in the DENDRAL project)
    and Headrick of Stanford Law School [Buchanan and Headrick 1970]. Several important
    and influential projects in the area were initiated during this time, the best-known
    and most sustained of which is Thorne McCarthy''s TAXMAN project, began in 1972
    and still continuing. McCarthy, whose aims are primarily theoretical, particularly
    in his later work on TAXMAN II. He takes as his experimental domain the area of
    corporate tax law in the USA. McCarthy''s most recent work has been on components
    of a language for legal discourse, a logical formalism and a set of underlying
    fundamental concepts which together will provide what is essentially a theory
    of practical reasoning. In this survey McCarthy''s work is presented in two sections:
    the early work on TAXMAN I appear in section 1.12, while TAXMAN II and the Language
    for Legal Discourse are described in section 1.16.


    Also in the 1970s Jeff Meldman began a study at MIT in the torts of assault and
    battery. Meldman''s PhD thesis, completed in 1975, presents the design of a system
    that attempts to combine reasoning by rules with decisions in individual previous
    cases. Meldman''s system was later partially implemented by King in 1976. Anne
    Gardner''s doctoral thesis, completed in 1984 at Stanford University, also attempted
    to combine reasoning by rules (derived from statutes) with'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# The Representation of Law in Computer Programs


    reasoning from previous cases. Central to Gardner''s work is the treatment of
    legal questions to which there is no immediate answer, and the attempt to identify
    which aspects of a case are ''hard'' and which are ''easy''. Gardner''s work is
    grouped here with Meldman''s since it can be fully regarded as an extension and
    elaboration of that approach. These two projects are described in section 1.15.


    The program JUDITH [Popp and Schlink 1975], which treats part of the German Civil
    Code, also dates from this period though it is not described further in this study.


    Ronald Stamper''s LEGOL project also began in the 1970s. The main aim of the LEGOL
    project was to develop a methodology for the analysis of administrative systems
    in terms of rules and regulations that govern an organization, and the information
    processing tasks to which these give rise. Because of the central role of rules
    and regulations, and because Stamper took legislation as his main source of experimental
    material, LEGOL can quite properly be regarded as an investigation into the computer
    representation of (typically, statute) law. LEGOL appears in 1.9.


    Other influential projects include Carole Hafner''s LIRS system, a system to improve
    the performance of retrieval systems, Sim Sprowl''s ABF, a language designed for
    computer-aided drafting of legal documents, and CCIPS (Civil Code Information
    Processing Systems), attempt a ''scientific codification'' of parts of the Louisiana
    Civil Code, conducted by Cary Debesson and George Ross. LIRS and CCIPS appear
    in section 1.13. ABF appears in section 1.8.1.


    Two institutions have been notably active in the general field of computers and
    law since at least the beginning of the 1970s. These are the Norwegian Research
    Centre for Computers and Law (NRCCL) at the University of Oslo, and the Istituto
    per la Documentazione Giuridica (IDG) in Florence. References to some of the projects
    conducted are given in the text.


    There are three more projects which are described in some detail in this survey.
    The first is Waterman and Peterson''s work on legal expert systems (''expert system''
    to Waterman and Peterson''s work). The second is the use of logic programming
    for applications in law, pioneered by Sergot and Kowalski at Imperial College,
    London and now quite extensively elsewhere (section 1.10). This work has been
    conducted since approximately 1980 and is obviously the approach with which I
    am most familiar. The third is Rissland and Ashley''s HYPO project, generally
    regarded as the most intensive and developed of the work on case-based reasoning
    specifically (section 1.17).


    The 1980s have seen an explosion of projects and proposals P: too many to attempt
    a full list of references. (The proceedings of'
