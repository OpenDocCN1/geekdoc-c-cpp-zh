    installed in some banks in the USA.


    # 5.2. KNOWLEDGE BASED SYSTEMS FOR SOCIAL SECURITY

    CLAIMANTS


    Knowledge based systems thus have a contribution to make to organize-

    in helping helping them provide a range of complex services more cheaply

    and more easily. But the gains are not all-sided. These systems can

    also be valuable for the customers. This is most clearly seen in the con-

    text of large legislative organizations like the DSS, where failure to

    understand the social security system can lead to people with low

    incomes even further disadvantaged [Gilbert, 1985a].


    The extent to which there is a problem in disseminating information

    out social security can be gauged in part by the rates of take-up

    benefit (the ratio of the number of people actually claiming a benefit to

    the number eligible). Take up rates are politically sensitive information\and
    are released by the DSS at frequent and irregular intervals. More-

    out, the reliability of some of the data can be called into question

    because of the difficulty of assessing the denominator of the ratio (the

    number of people eligible for benefit). Nevertheless, it is clear that

    take-up rates for the important means-tested benefits are very much less

    than 100%. For example, the latest available figures show that in 1985-6,

    52% of those eligible for family income supplement did not receive

    it that the corresponding figure for housing benefit was 22% and

    supplementary benefit was 16% [DSS, 1989]. Family income supplement

    was replaced by family credit in 1988 and initial estimates show a take-

    ur of 49% for this new benefit. The rate for Income Support,

    which replaced Supplementary Benefit in 1988, has not yet been published. In

    ontrast, almost all eligible for non-means tested benefits, such as

    the state retirement pension and child benefit, do claim their entitlement.


    Take up rates of less than 100% are a matter of social policy con-

    cern means-tested benefits are targeted at the very poorest fami-

    lies. Those who are eligible, but not receiving benefit, are therefore exist-

    ing incomes below the level which the state believes is the acceptable

    minimum. While the effect of a low take-up is to reduce state expenditure

    by substantial amounts (£310 million in housing benefit was

    unclaimed in 1984), rationing benefits by relying on low take-up is a very

    inequitable procedure. Those who have most difficulty in dealing with

    state bureaucraciesies, whose circumstances are least stable and who have

    least social support tend to be those who are not getting the benefits to

    which they are eligible. No reasonable welfare policy would intentionally

    provide less financial assistance to this group than to others who are

    already better off.


    Several reasons have been put forward to explain the low take-up of\means-tested
    benefits. The regulations governing eligibility and the'
