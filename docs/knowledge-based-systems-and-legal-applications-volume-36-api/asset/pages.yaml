  md: '162


    The Local Office System


    skills which are required are those of able to apply the general rules to the
    particular case. Being given ''standard answers'' is acknowledged as being a very
    poor way of learning general principles. The best model of learning in these cases
    is acknowledged to be that of letting the individual to apply the general principles
    and then commenting constructively on their approach.


    # 7.12. CONCLUSION


    After a long, and at times painful, evolution, during which the system concept
    became excessively complex before being simplified again, we arrived at a design
    which had a ''clear'' user interface, appropriate use of logical rules and inference,
    and context-sensitive guidance relating to the interpretation of legal conditions.
    The incorporation of expertise in the system had been examined, but had been found
    to be inappropriate.


    The resulting system made no assumptions about the amount of data (other than
    a bare minimum) which needs to be input from the claim form before working on
    the case. Earlier versions of the system involved the prior inputting of all the
    claim data, but this was seen to raise problems. Some of the problems were practical
    such as how would the information be input, by whom, was it inefficient if all
    the data were not needed to process the case, how would our system facing existing
    computer systems? LOD3 allows any subsequent implementation to be pursued, including
    of some data from existing computer systems, or input of certain information by
    less qualified staff prior to decisions being made by AOs. A separate set of problems
    concerned the question of the status of the data a degree of interpretation of
    the form completed by the claimant when filling in computer fields. It might therefore
    be necessary, as LOD3 allows, to require particular decision makers to interpret
    and enter some of the data.


    The system provides a clear structure, within which users may move through the
    case whatever order wish, possibly suspending work on one case where further evidence
    is gathered, or revising some of the earlier decisions and re-examining the associated
    issues. Summaries are provided at appropriate levels of each topic that the user
    can see precisely which issues they are currently working on. While the user is
    free to follow his or her own path through the case, the system will not allow
    the completion of a topic until the minimum information has been dealt with, and
    will continue to highlight the outstanding issues requiring decision. We believe
    that this type of interaction supports the independence of the AO and also accommodates
    the different skill levels which AOs may bring to their use of the system. An
    experienced AO who knows their way around the conditions and the system should
    be able to go directly to the critical conditions and deal with them in a'
