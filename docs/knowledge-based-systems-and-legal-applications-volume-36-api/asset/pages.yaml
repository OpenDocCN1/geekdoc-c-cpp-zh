  img_proc: true
- pgno: 46
  md: '# Legal Applications of KBS


    rule language of their own design. PROLOG is used only to implement the inference
    mechanism. An important feature of the MacRaes'' system is the emphasis they have
    given to interface and control issues. The system is designed to be used by someone
    who is already an expert in the domain. The MacRaes have been concerned particularly
    with developing an interface which gives their users control over the execution
    of the system, by directing searching away from areas which are felt to be irrelevant
    or redundant.


    David Gold and Richard Susskind collaborated on an interdisciplinary project (computing
    and jurisprudence) which developed a rule-based language for representing certain
    kinds of law [Gold 1987]; Gold and Susskind 1986; see also Susskind 1986a). Gold
    and Susskind illustrated the use of this language with an example based on the
    law of divorce in Scotland. [Susskind 1987] also describes number of particular
    systems which are being built by him and others with other rule-programming tools.


    Another system which is classified in this general category is Jim Sprowl''s ABF
    processor [Sprowl 1979, 1980]; see also Cook et al. 1981]. This system was designed
    for the computer generation of legal documents, but by McCarthy [1983a] points
    out it could be used for building legal analysis programs as well. The ABF system
    is a kind of word-processor, where the programmer specifies the ABF language how
    fragments of text together with data obtained from the user are to be inserted
    into the document being generated. The document specification can include expressions
    constructed from arithmetical operators and keywords like AND, IF, OR and NOT.
    The ABF processor evaluates these expressions when they are encountered during
    document generation. But the programmer is allowed to include his own terms in
    these too, which he defines by means of IF/THEN and IFF expressions. When the
    ABF processor encounters a term defined by the programmer, it evaluates its truth
    value by working backwards from conclusion to conditions through the definition.
    Since these definitions can be of arbitrary complexity, the ABF processor could
    be used as a backward chaining interpreter for propositional rules. (Although
    I have seen Sprowl''s ABF processor referred to as a rule-based system on several
    occasions, I am not aware that it has been used in practice for anything other
    than document generation.)


    There are many other projects described in this survey that employ rule-based
    formalisms to build representations of law. The main ones are LEGOL, the logic
    programming projects, ESPLEX, and Gardner''s doctoral project. TAXMAN used a frame-based
    formalism and Meloused semantic networks. In both of these cases, the system can
    be reconstructed easily in terms of rules. These projects are not included in
    this section because they are all described separately in more detail later.'
