- pgno: 89
  md: '# The Opportunities of the DHSS Demonstrator Project


    # BREADTH OF REMIT


    The remit of the Demonstrator was to investigate the potential for the application
    of KBS techniques to the work of large legislation based organizations. This remit
    is notable for its breadth and its practical focus. Most projects in KBS and law
    have set out with the intention of tackling a specific problem in the field, such
    as the HYPO project of Rissland and Ashley [1987], which attempted to find a way
    of reasoning with cases; or of trying out a particular approach to the field,
    as in the British Nationality Act work of Sergot et al. [1986], which attempted
    to show what could be done with a literal fragmentation of a fragment of legislation;
    or to produce a system related to a particular piece of law, as in the Latent
    Domain Advisor of Capper and Susskind [1988]. The Demonstrator, in contrast, had
    no commitment to any particular approach or area of law, and could also allow
    itself to be driven by what would be useful to the customer organization. This
    put an emphasis on the target users of the applications which is absent from projects
    which are more problem orientated, and so ensured that the need for the systems
    produced and their role in the organization was always high on the agenda. This
    resulted placing great emphasis on the development of a clear notion of the nature
    of the support environment that would be required by the different sorts of users,
    the fruits of which are described in the chapters of Part II.


    # CLOSENESS OF THE CUSTOMER ORGANIZATION


    Another important feature of the Demonstrator project was the very close relationship
    that existed with the customer organization. The DHSS was involved as an integral
    part of the project from the outset. The individuals assigned to work on the project
    were in the main draw from the computing branches of DHSS: their function was
    not to act as experts themselves, but to represent the Department, and when expertise
    or information was needed to make available the correct people in the organization.
    This approach meant firstly that the project was in no way constrained by the
    expertise made available to it: had particular experts assigned to the project,
    the particular nature of expertise may have tended to force the project to a particular
    direction. Secondly, it meant that there was less danger of experts becoming ''socialised''
    into the project and over-committed to its success: the experts could rather always
    maintain a distance and a healthy scepticism about its objectives. As well as
    domain experts the project could also talk to, and take account of the views of
    the people, who ran the Department up to a fairly senior level. This helped to
    give an appreciation of the organizational needs, which again sharpened the practical
    focus. For a system to be a practical proposition, it is not sufficient for it
    to be a technical success: it must also play a beneficial role in the organization
    as a whole.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Legal Applications of KBS


    # 2.5. SIZE OF THE APPLICATIONS


    A great deal of the effort involved in constructing a KBS needs to be put into
    developing the knowledge base. Where the project is small, and its main focus
    is on the functionality of the system — the ways in which the KBS will be manipulated
    and used — the temptation is to keep the knowledge base as small as is consonant
    with providing a reasonable test of the ideas of the project. Typically, therefore,
    even significant projects have incorporated knowledge bases which are small relative
    to the size of the knowledge base that would be needed in a practical application.
    The problem with using knowledge bases of a restricted size is that the process
    of constructing the knowledge base and the techniques that can be used to manipulate
    it, do not necessarily scale up to support a practical application. This point
    applies to all areas of computer developments: techniques which can be used to
    construct small programs become inadequate applied to very large programs hence
    the whole expertise of software engineering. The resources available to the Demonstrator
    mean that a serious attempt could be made to sizeable knowledge bases — and, the
    exploration of difficulties involved in large scale developments were a key concern
    of the project. This led to an appreciation of the software engineering aspects
    of the problem found on other projects.


    Another aspect of software engineering which sprang from the size of the applications
    was a rather clearer separation between programmers and designers as is possible
    on smaller projects. In a small project a single person often originates the initial
    idea, designs the system and writes the code. In consequence the three stages
    often blur together and compromises between them are not clearly identified. In
    the Demonstrator project, there was always a pressing need to communicate ideas
    to other members of the team and when moving from design to implementation, to
    write a specification that the implementor (who was typically a professional programmer
    rather than an AI researcher) could follow when implementing the system. Of course,
    changes were made to the specification during the implementation process, but
    again these needed to be thoroughly discussed and recorded. The result was a much
    clearer perception of what was being implemented, and code that can measure up
    to industrial standards.


    # 2.6. SUMMARY


    The above sections outline the advantages and opportunities that the Demonstrator
    provided, but the size of the project did have some negative influences as well.
    A project of this size, particularly when it is distributed across a number of
    different sites carries with a substantial overhead in terms of administration,
    communication and co-ordination. The implications of this are discussed in Chapter
    10. Also the very'
  merge: -1
