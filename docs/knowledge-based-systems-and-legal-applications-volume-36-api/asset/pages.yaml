  md: '# The structured dialogue'' interaction style


    The ''structured dialogue'' interaction reflected the structures of rules in the
    knowledge base — a window with the conclusion to be determined as its title held
    the conditions leading to the conclusion as an indented textual presentation of
    an and-or two. The names of entities bound to variables in the rules were inserted
    where appropriate in the textual representation, and were shown in bold face to
