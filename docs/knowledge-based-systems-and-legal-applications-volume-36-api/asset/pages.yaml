    turn by pressing the continue key. When they have the turn they are in control,
    the system cannot take it away from them.


    Stopping


    Forms Helper II no longer cycled around questions indefinitely. Users were given
    two chances to answer a question. After skipping a question a second time the
    system no longer recommended it. Also, as users no longer could make forward progressions
    in the form after going through the final page, the system was bound to recommend
    a question that had been recommended before. Unlike the first version, there were
    no hidden pages the user could have skipped.


    The change of the Forms Helper to a more dynamic system meant that more care had
    go into redesigning the electronic version of the form for the new system. Consideration
    of the dynamics of the interaction with the form had to be taken into account
    when choosing the ordering questions and pages. Filter questions tended to be
    placed at the top of a page where questions could unfold beneath them. Also, it
    was possible to make the order of pages more coherent then the comparable form
    now that certain questions need not to be displayed.


    # 13.4.2. Evaluation


    An evaluation was carried out to discover if the second version of the Forms Helper
    system was acceptable to users (Ottley 1988). This was was carried out on a larger
    sample of users and the results of this were generally positive. Users found the
    system easy to use and follow, felt confident using it and they felt they knew
    what they were doing when they were filling in the computerized form. Unfortunately
    the results of this study were not sufficiently detailed to give information about
    users'' interactions with Forms Helper II so little can be said of the mixed-initiative
    aspects of the revised system.


    # 13.5. MIXED INITIATIVE INTERACTION WITH THE ADVICE SYSTEM


    # 13.5.1. Design


    Interface


    The Advice System is a question-answering knowledge based system. Its interaction
    is based on the organisation on natural conversation (see [Frohlich and Luff 1989].
    A typical screen display of the Advice System is shown in Figure 13.4. The screen
    is divided into two parts. On the left is a transcript of part of the interaction
    as it progresses. Completed utterances appear here. The system''s and users''
    contributions are distinguished by a different typeface. This transcript only
    records the past utterances that can fit onto the visible area of the screen.
    The oldest ones scroll off the top. On the right is the area in which users construct'
