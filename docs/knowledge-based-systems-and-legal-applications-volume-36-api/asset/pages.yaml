    At a meeting held shortly after this list was produced, we realized that we had
    been making a fundamental error in placing individual ''requirements'', as these,
    above simplicity and coherence of design. Instead of continuing to try to satisfy
    as many of the existing ''requirements'' as possible, we now chose to satisfy
    how much of the spirit of the requirements could be captured in a simple, coherent
    system. Within a few weeks a radically different approach to case handling had
    been sketched out agreed upon by designers, implementors and requirement owners.


    The project manager and stakeholders were reluctant to endorse such a dramatic
    change of course so late in the day, but accepted our advice that it was necessary,
    would reduce the amount of work to be done in the short time left, and would result
    in a better system.


    # 7.9. THE REQUIREMENTS AS FINALLY SEEN FOR LOD


    The design of the Local Office Demonstrator now focussed on the provision of a
    support environment providing a set of complementary capabilities, combined and
    presented to satisfy a small set of key principles. These were:


    +   1. The user would be responsible for all of the decisions declared to the
    system.'
