    # 14.4. THE POTENTIAL FOR COMPUTER SUPPORT FOR


    # GROUP WORKING


    Within the scope of the policy application of the DHSS Large Demons-

    trator project, we have identified a number of ways in which we can sup-\port
    the work of policy makers. The main thrust has been to extend

    each individual''s access to information, to extend each individual''s access

    to expertise about the legislation, and to improve the sharing of ideas

    between group members. It is on this last area that we will concentrate

    in the remainder of this chapter.


    From our extensive analysis of the policy process over almost five

    years we have developed a model of policy formulation works which

    involves the following four phases: problem structuring, detailed argu-\mentation,
    evaluation and rationalization. These are discussed below. We have

    taken the system that the DSS already uses for policy for-

    mulation has a number of advantages that it would be good to retain.

    We have therefore designed the support we wish to offer to meet closely

    with current practices. Inevitably, the introduction of computer support

    will change the way people work but we expect that the changes will

    all be in the direction of closer group co-operation and greater group

    hesion.


    The general view is that the policy group will each have a

    networked workstation. They will all work on the production of a policy

    review ''document'' which is actually a complex problem structure that

    defines a number of subproblems, each with its own internal structure.

    The policy workers individually modify a structure and detailed argu-\mentation
    produced by the owner who then has the task of consolidating

    their working into a revision of the original ''document''. This process

    iterates as in the manual system until the owner believes that it is ready

    to become the basis of a set of recommendations to the minister.


    # 14.4.1. Problem structuring


    This has already been discussed. In terms of support, we can offer access

    to an executable logic model of the legislation, to stored legislation text

    and to stored policy arguments. However, problem structuring is an

    essentially individual activity under the present organization.'
