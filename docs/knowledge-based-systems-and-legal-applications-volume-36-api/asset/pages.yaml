- pgno: 242
  md: '# Legal Applications of KBS


    We refer to the process of determining the essential structure of the [knowledge]
    source contents, and representing it in a semi-formal form, as ''knowledge analysis'',
    and to the process of taking such a semi-formal product and representing it in
    the chosen knowledge-representation scheme [e.g. the toolkit language] as ''knowledge
    encoding''.


    [Alvey DHSS Demonstrator 1984—1989 Final Report, p.23]

    Most analysts were involved in a range of activities and naming them or apportioning
    our work between categories of activities was not usually necessary. The conception
    of ''knowledge analysis'' used here, therefore, may differ in three ways from
    the way I understand large software development teams use the term: it was formative
    rather than summative; it often included synthesis as well as analysis; and the
    scope of knowledge examined was broader than typically used for knowledge base
    development.


    # 11.4.1. Analysis as formative


    The first difference is worth noting because of the potential confusion with the
    term analysis used by software developers with a background in, say, mathematics
    or logic. Analysis, in use of the term, is what happens to an artifact such as
    a knowledge base or a requirements specification after it has been developed.
    Analysis in this sense, may for, example, include checks for internal consistency,
    incompleteness, or ambiguity. There are similarities to this understanding of
    analysis and the summative approach to evaluation in that it takes after the artefact
    is created. Analysis in the sense I am using it here happens before that. It helps
    to formulate the product in the same way that formative evaluation feeds back
    into the process of creating whatever is being evaluated. The analyst will look
    for patterns and gaps in the undigested material and will try to clarify it. These
    activities are not unlike those undertaken by analysts who are checking for completeness
    and inconsistencies, so the distinction may seem unnecessary. Analysis of the
    kind undertaken on this project and by knowledge engineers working to capture
    requirements for a system, is typically performed on material relatively less
    digested for its purpose than used by taking a summative approach, and the analytical
    techniques are less mature. Analysis of the kind that I am referring to is still
    more of an art than a science.


    # 11.4.2. Analysis including synthesizing


    Our ''analysis'' involved the activities associated with the dictionary definition
    of the term — taking apart complex phenomenon distinguishing its elements by,
    for example, decomposition, critical examination, tracing things to their sources,
    and/or discovering general principles'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'and the expression, synopsis, of the results of these activities. It also included
    knowledge synthesis — a putting back together which could involve selection, integration,
    (more or less radical) restructuring, reconciliation of perceived conflicts, and
    reformulating of the analysed material as it was recombined. A simple synopsis
    of the elements distinguished during analysis was usually an intermediate product
    rather than the final outcome of our analysis.


    # 11.4.3. Knowledge analysis as broad in scope


    Our analytical activities involved more than studying material and extracting
    elements as objects with their attributes and rules needed for building the knowledge
    base from our source texts — be statutory instruments, books on the subject, or
    transcripts from specially conducted interviews. It also involved:


    +   1. Studying the organization in which system would be used or about which
    it needed to provide advice.


    +   2. Considering the users to discover what they could be expected to know and
    how they could be expected to hold or refer to that knowledge.


    +   3. Considering who would be the interested parties in scrutinising knowledge
    upon which the systems would depend and what representations of that knowledge
    would both be useful to them and to knowledge base builders and maintainers.


    +   4. Analysing the tasks users would be undertaking and for which they required
    support.


    +   5. Understanding the benefit system in the large, e.g. groups of benefits
    related to one another, and in the small, e.g. detailed dissection of eligibility
    rules, contribution conditions, and assessment.


    +   6. Understanding what was straightforward to staff or the public and what
    was involved, sometimes hidden, complexity or misconceptions.


    +   7. Understanding the status, e the authoritativeness, currency, reliability
    of knowledge found in different sources, and the extent to which it is formalized
    within the organization.


    +   8. Understanding how knowledge was used, including for which activities, its
    source, its flows, and the mechanisms for monitoring validation and maintaining
    it.


    +   9. Understanding where concept substitution or paraphrasing was appropriate
    in transferring between legal and everyday language.


    +   10. Understanding the demands and limits of the language and inference facilities
    being used to build the systems — not an easy task as these had not been finalized
    in the early stages of the project and were being developed in parallel to the
    analysis in the latter stages'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Legal Applications of KBS


    of the project.


    +   11. Understanding how knowledge of different kinds would be used by the system,
    distinguishing for example in the case of the Advice System between ''static''
    knowledge ''dynamic'' knowledge and ''procedural'' knowledge.


    Each of the teams undertook a number of preliminary analysis exercises, all of
    which were knowledge analysis if the term is used broadly. Some analysis centred
    around particular benefits including single payments for supplementary benefits
    claimants, mobility allowance, widows benefits, and child benefit.


    Organization and task analysis was also undertaken by the LOD team. There was
    a study of advice giving in independent (non-D(H)SS) advice centres. There was
    a study of potential users of both claimant information systems, i.e. the Forms
    Helper which did not have a knowledge base and the Advice System which did.


    # 11.4.4. Advice System


    The work on the Advice System (AS) gained momentum as the Forms Helper system
    was in its later stages of development: a sequential development pattern not adopted
    in an obvious way by the other teams, each of which was producing successive version
    of a single system throughout the project. Knowledge analysis was undertaken by
    almost everyone on the team.


    Members of the team working on designing the user-system analysed naturally-occurring
    dialogues about benefits as part of their preparation for writing a set of interaction
    rules which were independent of the domain knowledge. The Oxford Concordance package
    (OCP) was used us to examine the vocabulary and word use of fifty members of the
    public interviewed in the potential user study. The OCP software can, among other
    things, create a word list and word count or provide all examples of a word or
    phrase with as much context as required (e.g. the fifteen words preceding it and
    the twenty words following it). This analysis fed into the development of the
    lexicon of the advice system used in the dialogue with the user.


    Colleagues developing the planner D(H)SS procedures, developed appropriate planning
    operators and prepared semi-formal versions of procedural rules which we wrote
    in the toolkit language and added to the rules created for the non-procedural
    knowledge base. Classes and attributes for these rules were also added to the
    knowledge base through KANT structures as described in section 5 below. There
    were also rules developed for the planner which were not written in the toolkit
    language, but remained separate and made up the procedural knowledge base.'
