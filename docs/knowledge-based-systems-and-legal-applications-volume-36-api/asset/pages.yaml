    industrial projects staff are usually drawn from one organization (and its subcontractors)
    and all identify with the company''s objectives. Secondary (divergent) objectives
    exist as well of course. In a project like the DHSS Large Demonstrator there is
    not this degree of focus; the collaborators have primary objectives which are
    quite different from one another and the staff tend to follow their parent organization''s
    direction. To be effective, the project needs to align (some) of these'
