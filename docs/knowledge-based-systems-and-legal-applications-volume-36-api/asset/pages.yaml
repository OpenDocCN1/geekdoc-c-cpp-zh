  md: '# CHAPTER 10


    # MANAGING A LARGE COLLABORATIVE PROJECT


    Charlie Portman


    The Alvey-DHSS Large Demonstrator was a large project in several senses. It consumed
    over 35 person-years (115 different people were associated with the project during
    its lifetime). It consequently spent a lot of money each quarter. It lasted five
    years and took a significant slice out of the lives of its members. It was set
    up to tackle a large problem with several facets and ended up writing some large
    pieces of software and constructing quite large knowledge bases. Lastly, the project
    was large in a physical sense; it was spread from Lancaster to Guildford and from
    Liverpool to Cambridge across nine different sites.


    # 10.1. ORGANIZATION


    The project was preceded by a study which did the work needed to write the formal
    proposal — a document of 256 closely printed pages. The proposal outlined the
    project''s structure and method of working so when the project started the organizational
    framework had already been defined. This framework was proposed in the absence
    of real experience of such a large, cross-culture collaborative project but seems,
    in hindsight, to have been well-chosen apart from the design control function
    which was probably inappropriate in the first few years of the project since it
    seemed to suggest that commonality would exist from the outset. This turned out
    to be an unreasonable view in light of the scope of exploration needing to be
    done in the early years.


    The project was initially organized with a top-level steering team,'
  merge: -1
  img_proc: true
