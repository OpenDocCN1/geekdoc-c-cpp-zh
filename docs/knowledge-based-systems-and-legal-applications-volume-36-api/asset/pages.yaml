    # 8.2. THE HISTORY OF THE POLICY APPLICATION


    # 8.2.1. The phases of the project


    The Alvey-DHSS Large Demonstrator project can be thought of as having two large
    phases of approximately equal length. The first, from the project''s inception
    in 1984 until about about October 1986, is a period of exploration and analysis,
    marked by the existence of many small teams developing many, small prototypes.
    Much of what these teams were doing was developing an understanding of the application
    areas and testing the feasibility of techniques and approaches. There was also
    a certain amount of work on infrastructure and general-purpose software. At a
    social level, there was energy spent on team-building and learning in a large
    and widespread collaboration. For very many individuals there was a great deal
    of learning to be done, not only about the application areas but also the tools
    and techniques that would be used on the project. At this time, the application
    teams, including policy, were each relatively self-contained and did all of the
    analysis, design and implementation within their areas.


    In October 1986, a mid-term revie of the project was completed and its results
    published. In brief, they were:


    +   1. To reorganise the project into three ‘applications’ (previously there had
    been five).


    +   2. To create a more formal split between analysis, design and implementation.


    +   3. To use the Local Office application as the vehicle for demonstrating both
    the ‘engineered and measured approach’ and the construction of a ‘large’ knowledge
    base.


    # 8.2.2. The policy application up to July 1987


    As well as the overall project objectives, which are listed elsewhere (Chapter
    2), the Policy Application was initially intended to produce (in the words of
    the proposal):


    +   1. Policy database covering the principles, intent, explanation, justification
    and amendment of policy.


    +   2. Advanced quantitative model to examine the financial and organisational
    implications of policy changes.'
