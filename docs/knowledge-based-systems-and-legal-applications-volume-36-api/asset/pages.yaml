    # 53. THE FORMS HELPER


    # 5.3.1. User requirements


    The purpose of an application form is to manage a transaction between the applicant
    and an organization in a standardized, and therefore easily administered, way.
    In the case of social security application forms, the transaction is between a
    claimant and the DSS. The transaction is intended to obtain standardized information
    from applicants whose circumstances are anything but standard. The form must be
    designed long before any application is made and it must cater for all variations
    in circumstances. In practice, this means that most forms have a branching structure
    with some questions intended to be answered by some of the respondents. The need
    for administrative processing of the organization''s point of view there are advantages
    in restricting form-fillers'' answers to one of a small number of options, thus
    forcing the respondent to reply in terms which immediately imply administrative
    action.


    Many of the difficulties encountered by form-fillers stem from these aspects of
    forms. For instance, if the respondent fails to notice the cues about which questions
    to answer next [Frohlich 1986, 1987]. The provision of a limited range of options
    requires the form-filler to engage in what may be the difficult task of fitting
    their circumstances into one of the supplied categories. Form-fillers are not
    likely to be aware of the organizational implications of giving particular answers
    and may find it difficult to judge matters such as the precision of the answer
    required or the way in which they are supposed to represent answers on the form.
    For example, if asked when they left their last job, respondents may not be clear
    whether the exact date of leaving is required, nor whether the date of leaving
    is the last date they attended the workplace or the last date for which they were
    paid.


    These problems are exacerbated by the fact that there is usually'
