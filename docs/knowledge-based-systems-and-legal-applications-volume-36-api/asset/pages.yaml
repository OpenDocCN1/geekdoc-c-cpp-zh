    of the team managers, the site representatives (where these were different) and
    the project co-ordinator.


    During the life of the project this committee remained the main controlling group
    and was one of the main instruments for coordination and information passing between
    the groups. The terms of reference read (in part):


    +   1. Purpose


    The Project''s Operations Committee (OpsCom) is the executive body controlling
    the activities of the staff of the Project so as to meet the Project''s objectives
    through the plans approved by the Steering Team.


    +   3. Responsibilities


    OpsCom will:

    Approve team plans to meet the Project''s objectives including exploitation.


    Approve overall plans for submission to the Steering Team.


    Allocate resources against approved plans.


    Formally review progress against plans agreeing tactics proposed by teams to react
    to changing circumstances.


    Co-ordinate cross-project administration and overall technical management.


    Represent individual collaborator''s external appearance.


    Monitor the Project''s external appearance.


    In assigning staff to teams, personal interests and skills were given more weight
    than geography. This was a deliberate choice intended to test the problems in
    solutions to distributed team-working. In many parts of the project''s work this
    was found to be workable providing that extensive use was made of the various
    communication methods available. In other areas, particularly during integration
    of the final demonstration systems, the delays and lack of clarity of remote communication
    were overwhelming and the whole team was brought together for two or three weeks
    to complete the task. This seems to be a problem which improved'
