  md: '5. Exploration of consequences of options and assessment of implications.


    6. Specification of requirements for legal changes to drafts. The problem with
    this view of policy, which formed the basis of the early prototypes of the DHSS
    Demonstrator described in Chapter 8, (and expounded in [Bench-Capon 1987]), is
    fundamentally, its ''goal-oriented'' perspective of ''problems'' and their ''solutions''.
    In practice, policy is much more concerned with a continual cycle of argument
    development with changing political priorities and expediency being applied to
    a complex network of welfare benefit provisions. Policy ''issues'' are seldom
    resolved; they are rather recycled and temporarily resolved until resurface as
    important concerns at a later date. It is therefore inappropriate to adopt any
    model which assumes the process of forming policy has a beginning, a middle and
    an end. In contrast, therefore, our analysis of the major concerns and activities
    of policy staff led to the conclusion that it is the process of argumentation
    is central to policy. Throughout the various policy activities, the construction,
    development and presentation of arguments is a common strand or unifying theme.


    To understand the role of the arguments it is necessary to establish who they
    are for whose interests they represent, where the policy and the arguments originated
    from and the perspectives which explain why the issues have become important,
    the expectations in terms of what is expected to be achieved by the policy work
    — when will it be seen to have resolved? In addition it is necessary to consider
    the scope and boundary of the policy arguments, their status and their ''currency''
    in terms of their relevance at this time, the context and the relation to other
    arguments and areas of policy.


    The policy argumentation process is thereby characterized by its flexibility and
    its relative indeterminacy. It is essentially a dynamic process where elements
    which had previously been established can be revised or redefined, it involves
    collective argument and debate, and the problems which it is trying to continue
    for for many years — emerging in different circumstances and with different characteristics,
    but still representing the same underlying problems. Although policy decisions
    are to be made, the underlying policy issues are seldom fully resolved.


    This more subtle and dynamic view of policy does not invalidate the notion of
    KBS support which assists with the processes of issue clarification, option specification,
    implication assessment, etc., as characterized by the earlier model. What does
    imply is that the support system needs to be embedded within a wider set of argumentation
    support capabilities. Similarly, the uses of the KBS facilities are likely to
    be open and exploratory rather than narrowly focused on well-defined problems.


    Our wider model of the policy process is therefore based on three'
