- pgno: 300
  md: '# Legal Applications of KBS


    Taking from and Taken from The user can also take the turn from the system. After
    the system has made a TCU followed by...'', a button appears for a period of time.
    Selecting this button gives an opportunity for the user to interrupt the system
    and construct a turn. Similarly, the system can take the turn from the user. Despite
    having a TCU with a...'', it is possible for the system to interrupt a user''s
    turn. This occurs when there is something wrong with the user''s utterance, for
    example if the user fills out a text box incorrectly or if the user makes a contradiction.
    In these cases the system initiates a repair sequence to deal with the trouble
    (Frohlich and Luff 1989).


    Stopping

    As mentioned earlier, the Advice System relies on the user asking questions to
    continue with the interaction. We devised a way of encouraging further questions
    by designing a series of ''preclusions'' that suggested topics for further questions
    (Frohlich and Luff 1989). In the first preclusion using information from the topic
    menu, the system asks whether the user wants to ask another question on the same
    topic as the last. If this is declined then users are asked, in a second preclusion,
    whether they want to ask a related topic. This topic is either related to the
    last question in terms of the menu or derived from a simple heuristic. If this
    opportunity is declined then the users are asked whether they want to ask another
    question on any topic whatsoever. If this third chance is turned down then the
    system enters a closing sequence, with the system and user say goodbye to each
    other.


    The precluding sequences are also the places where the user is given the opportunity
    to ask again questions that have been held over. Like the start of the interaction,
    these sequences for negotiating new topics and the end of the interaction are
    controlled by the system. The system should also be completed by the user asking
    a question. The Advice System does supply another device for ending the interaction.
    At most times a button, labelled ''I have to go'', is available on the bottom
    of the right-hand side screen. By selecting this user can initiate the end of
    the interaction.


    # 13.5.2. Evaluation


    Methods

    A small-scale evaluation of the Advice System was carried out to assess its usability.
    Further details can be found in [Gilbert and Jirot 1989]. The behaviour and comments
    of five lone parents and twenty undergraduate students were recorded as they interacted
    with the system for approximately one hour. Lone parents were simply asked to
    explore the system for any information which might be useful or interesting to
    them. Students were asked to discover specific kinds of benefit information on
    behalf of a hypothetical lone parent called Maggie. One-half of the'
