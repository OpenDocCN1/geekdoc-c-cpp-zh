    same way that CORPTAX''s is shallow. This is not necessarily so.

    In TAXMAN-like terms, the conceptual model for the British Nationality Act represents
    objects like persons, places and times, and relationships like ''parent of'',
    ''date of birth'' and ''settled in'' between them. It is easy to imagine how facts
    about a given individual could be ''bundled together'' as template instances in
    TAXMAN. As argued in [Sergot 1985a], however it is not realistic to construct
    ''deep'' representations of concepts like ''was abandoned a new-born infant in
    the UK'' in terms of something more primitive. It is difficult to imagine what
    the representation of such a concept would look like. In any case, might turn
    out that the concept has a technical meaning in law because it is precisely defined
    somewhere else.


    The need for primitive (undefined) hyphenated predicates arises when one attempts
    to construct a representation of a sizable fragment of legislation. I would guess,
    without any supporting evidence, that the reason McCarthy was able to construct
    a representation of the TAXMAN statutes without relying at all on ''hyphenated
    predicates'' is because the system represents a tiny and fairly well-connected
    fragment of the US Internal Revenue Code. It could be that CORPTAX generates unstructured
    questions because of features in the legislation it represents, and not only because
    of the inadequacy of the computational techniques employed. None of this is to
    argue that McCarthy is wrong to stress the importance of choosing reasonable primitive
    concepts and making explicit the relationships between them. Even in systems which
    rely on querying the system for all facts about a given case, the absence of a
    conceptual model of the underlying domain manifests itself in a number of unacceptable
    ways (such as the generation of meaningless dialogues). [Sergot 1985a] discusses
    these issues in more detail. See also [Bench-Capon 1989b].


    There are several projects which can be classified with McCarthy''s TAXMAN I in
    that they have placed particular emphasis on conceptual models of the domain in
    which a set of legal rules are applied. Some of these projects have been very
    influential in the development of the field. Examples are given in the next section.


    # 1.13. CONCEPTUAL MODELS AND DOCUMENT RETRIEVAL


    Two projects described in this section have attempted to improve the performance
    of document retrieval systems by incorporating a conceptual model of the underlying
    legal domain. The two projects are Carole Hafner''s doctoral project at the University
    of Michigan [Hafner 1978, 1981]; see also Cook et al. 1981], and the CCLIPS project
    conducted by Cary Bessonet and George Cross at the Louisiana Law Institute (see
    references below). Although document retrieval systems are outside the scope of
    this survey, both of these projects have influenced the computer'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# The Representation of Law in Computer Programs


    representation of law. Both are examples of what McCarty [1983a] and others have
    called conceptual retrieval systems.


    The motivation for conceptual retrieval systems is clear. The automated retrieval
    of legal texts from large databases of documents was one of the earliest applications
    of computing to law, and commercial systems such as LEXIS and WESTLAW are now
    familiar to many legal practitioners. Bing [1984] has compiled a good survey of
    legal document retrieval systems. Currently, document retrieval systems use text
    searches that are specified by Boolean combinations of keywords, with the limitations
    of this technique have been pointed out by many researchers (see for example [Bing
    1986]). It has long been established that retrieval based on the meaning and content
    of documents would be far more appropriate. Conceptual retrieval systems attempt
    to store and retrieve documents using an index based on a conceptual model of
    the particular legal domain.


    I have also included in this brief description of the ESPLEX project conducted
    at the Istituto per la Documentazione Giuridica (IDG) in Florence. Although this
    project does not address conceptual retrieval specifically, it has placed considerable
    emphasis on conceptual models of the underlying legal domain. It also allows me
    to make additional remarks on the different things that a conceptual model could
    contain.


    # 1.131. Hafner


    Conceptual retrieval has been illustrated by Hafner in a system that stores and
    retrieves documents related to parts of the US Commercial Code [Hafner 1978, 1981;
    see see Cook et al. 1981]. This legislation governs ''negotiable instruments''
    such as checks and notes. Working with a conceptual model of the situations that
    typically occur in negotiable instruments, Hafner constructed a database containing
    about two hundred cases and two subsections of the code. The conceptual model
    allows the system to retrieve documents even if none of the terms specified in
    the query appear in the document. For example, a request for occurrences of ''an
    unauthorized signature on a draft'' would retrieve a document the term ''a forged
    endorsement of a check'' is mentioned. An account of Hafner''s most recent work
    is given in [Hafner 1987].


    Hafner''s system illustrates the potential of conceptual retrieval, but practical
    implementations remain to be investigated and built. As Hafner points out, the
    conceptual analysis of a legal document involves a massive amount of work and
    poses a major practical obstacle. Furthermore, Bing [1987] has pointed out the
    need to investigate the assumption that conceptual retrieval really will improve
    the performance of standard document retrieval systems. He has begun an interesting
    experiment at'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'NRCCL in Oslo to test out the practical benefits of conceptual retrieval, by
    constructing a retrieval system for Norwegian pension legislation based on a very
    simple and easily constructed conceptual model of the domain. His idea is to take
    the conceptual model simply whatever propositions are obtained by translating
    the legislation according to Allen''s normalization process (section 11.1.1).


    # 11.3.2. CCLIPS


    The CCLIPS (Civil Code Information Processing System) project of Cary deBessonet
    and George Cross began at the end of 1970''s. Its aim is to build a conceptual
    model of several sections of the Louisiana Civil Code dealing with contract law.(Louisiana
    is one of the few States with a legal system based on civil codes rather than
    common law. )One of the main purposes of the project is to clarify the structure
    of the Civil Code itself. An additional purpose, once the conceptual model has
    been formulated, is to experiment with alternative designs for a conceptual retrieval
    system. [deBessonet 1980, 1982, 1983, 1984; deBessonet and Cross 1985; Cross and
    deBessonet 1985a,1985b]


    The formulation of the conceptual model, which deBessonet and Cross call ''scientific
    codification'', is heavily influenced by Allen''s normalization process. Legal
    rules in the model are represented essentially in the form of propositional rules.
    These rules in turn are expressed in terms of abstract primitive objects and abstract
    primitive actions resembling those of Schank''s conceptual dependency theory [Schank
    and Rieger 1974]. The intention is to capture the ''deep'' semantic structure
    of the objects and actions that are encountered in the domain of contract law.
    The representation language is called Atomically Normalized Form (ANF) (and the
    representations constructed in it Analytical Legal Databases) to support the conceptual
    retrieval of legal information, but the system can also generate inferences. The
    facts of a case can be described in the ANF language in terms of the underlying
    conceptual model, and the rules can then be applied to this representation to
    determine legal consequences.


    Note that deBessonet and Cross seem to use ''deep'' in a different sense to McCarthy''s
    in TAXMAN I. The representation in CCLIPS is ''deep'' in the same way that Schank''s
    representation of verbs like ''sell'' is ''deep'' when it is expressed in terms
    of abstract primitive actions like ''abstract transfer of possession'', ''transfer
    of physical location'' or ''movement of body part''.'
