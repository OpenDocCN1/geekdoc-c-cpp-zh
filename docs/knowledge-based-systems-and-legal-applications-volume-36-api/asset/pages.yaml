  md: 'jargon of rhetoric - see [Dixon 1971]; Perelman and Olbrechts-Tytecha [1969]
    — this will affect the force of the argument. In particular it will make obvious
    how an argument may be challenged or rebutted.


    +   2. Arguments become easily manipulated by policy workers who can use graphical
    editors to create and amend argument structures compounded from many micro-arguments.
    In particular, the particular arguments that one worker has become the actual
    objects of manipulation of subsequent workers.


    +   3. Arguments are easily manipulated by the computer. They can be stored, indexed,
    retrieved, checked, linked to the legislation and the logic model as appropriate,
    displayed and combined and recombined as necessary.


    +   4. Just as there is a single body of legislation that all policy workers refer
    to and work on, so is there (in theory at least) a single, coherent body of arguments
    which developed the policy behind and derived the particular form of that legislation.
    A computer-manipurable argument form allows the possibility of making this set
    of arguments available to all policy workers as a baseline for which to develop
    new policy and legislation.


    # 14.4.3. Evaluation and rationalization


    These two phases involve the other gathering in, at the end of each iteration,
    the detailed argumentation of the others, extracting the suggested options, the
    arguments for them and against them and applying a range of evaluation ''perspectives''
    (based on the department''s policy goals and the arguments for them). This will
    yield a set of potential solutions for each of which a coherent argument should
    be available. By manipulating these and the overall problem structure, the owner
    will be seeking to develop a set of arguments for these options which are mutually
    consistent and satisfy the evaluation criteria. We have called rationalization.


    The rationalization of the chosen solutions then becomes either the new problem
    structure to be passed out to the rest of the group, or the basis for the preparation
    of a set of recommendations to the minister.


    # 14.4.4. Knowledge based support


    It is fundamental to a policy maker''s job that he or she should understand the
    social security legislation. The quality and quantity of this knowledge varies
    according to the exact role of the policy maker however. Senior policy makers
    are aware of the general form of the legislation within their areas of specialization
    but not of the detail. They also require an acquaintance with the legislation
    in related areas. More junior members of the team have a more detailed knowledge
    of the legislation'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'which is more narrow in its scope. In this way, the knowledge required for
    policy formulation is itself widely distributed within and between policy groups.


    It is certainly the case that the most major concern of a policy maker is that
    all of the possible options for change are discovered and evaluated. However,
    close behind this is the concern that changes to the legislation that are proposed
    in one area should not have unforeseen and undesirable ramifications in other
    areas. Indeed, a great deal of the interaction between policy groups and other
    interested parties (e.g. external pressure groups) is largely for the purpose
    of exposing proposals for legislative change to ever critiquing so to avoid such
    problems.


    As an aid to detecting such unwanted interactions between different parts of the
    legislation, the policy system provides a representation, in first-order logic,
    of the legislation. In our prototypes, we have modelled only small parts of the
    legislation but the whole of the social security legislation and parts of related
    legislation. There is also a need to add a little real-world knowledge (such as
    that men cannot become pregnant) where such knowledge is assumed and used but
    not explicit in the acts, regulations or case.


    To use this logical model of the legislation, the policy system provides the users
    with the ability to describe classes of people in which they are interested and
    to query the model about how these people interact with the benefit system. There
    is a range of queries for this purpose. The policy maker may also use editors
    to modify the proposed changes to the legislation. The system supports a notion
    of public and private versions of the legislation. The public version is the model
    of the actual legislation. Any work that a policy maker does on possible changes
    to the legislation is done within a private version. These private versions exist
    as versions of a subproblem within the overall problem structure and can be associated
    closely with the detailed argumentation so that particular chains of argument
    and even particular micro-arguments can be associated with a particular set of
    knowledge base changes.


    # 14.5. EVALUATING THE POLICY SYSTEM


    It is extremely difficult to discover whether systems with the objectives of the
    policy demonstrators fulfilled their purposes. It is not only that the objectives
    for these systems were vague (which they inevitably were) but also that there
    are no adequate metrics of suitability for that that could be applied. We are
    left, ultimately with having to ask potential users of the system for their personal
    opinions (more or less informed by some degree of experience with the prototypes)
    on the matter. Within this framework, we can vary some of the parameters. We'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Legal Applications of KBS


    can ask users during development and use their responses to guide further development
    (formative evaluation) or we can ask them after we have finished and use their
    responses as a rating or judgement of the system (summative evaluation). We can
    be more or less realistic in the kind of experiences they have with the system,
    varying their exposure between a short presentation and an extended trial in their
    normal milieu. We can ask about different aspects of the system to be evaluated.
    We could ask, for instance, about the validity of the task model it embodies,
    or about its usability, or its suitability as a support tool. We can vary the
    number of potential users we asked would increase our confidence in any responses.
    Lastly, we could vary the degree of structure, formality and detail of the experiences
    we provide, the questions we ask, and the answers we expect.


    There have always been two members of the policy application team who came from
    a policy background. Their input to the design and their on-going critiquing of
    the prototypes provided continuous formative evaluation which has been very healthy
    for the application.


    All the early prototypes were evaluated only by demonstrations. However, in the
    last three months of the project, a system was installed in a policy maker''s
    office. The policy maker, with the assistance of policy application team members
    when necessary, ''shadowed'' work he was doing on a current policy problem using
    the prototype in order to get a feel for the adequacy of the system. He was judging
    against a set of criteria to do with the accuracy of the policy formulation model
    it embodied, the quality of its support for the policy formulation tasks, and
    its usability as a piece of software. The results are reported elsewhere (an internal,
    DSS report) but they were, generally, very positive on all three sets of criteria.


    Nevertheless, despite this favourable evaluation, it must be borne in mind that
    the evaluator chose his friendly attitude to the project and its aims and computer
    literacy. The evaluation is simply the opinions of this one man whose exposure
    to the system was rather limited. However, coupled with the very positive responses
    that we had to have demonstrations of the system to many other policy workers,
    we are properly justified thinking that the system would be well liked as a support
    tool.


    We also sought some views on the cultural acceptability of such computerized support
    for DSS policy makers. The evaluation we have done and the demonstrations we have
    given have been enough to convince the DSS of the potential of the policy system.
    The Department has now completed a longer (nine months) evaluation study which
    again placing systems in policy makers'' offices and using them to shadow real
    policy formulation work.'
