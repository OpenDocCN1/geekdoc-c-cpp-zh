- pgno: 346
  md: '# CHAPTER 16


    # KBS APPLIED TO LAW:

    A FRAMEWORK FOR DISCUSSION


    Trevor Bench-Capon


    # 16.1 INTRODUCTION


    In this final chapter I shall not attempt to catalogue the lessons of the Alvey-DHSS
    Demonstrator project, both because these are to be found in the foregoing chapters,
    and because every participant in that project will have brought away rather expperingen
    from it. Instead I want to advance a framework which can be used to discuss various
    applications of KBS to law; this will help to place the various applications of
    the Demonstrator in perspective, and can be used as a basis to compare them with
    other work in this field.


    The framework proposed takes as its starting point the characteristics of the
    legal domain. These characteristics serve to distinguish this domain from the
    other domains to which KBS may be applied, and to link the very different applications
    that are found in that domain. These characteristics derive from the nature of
    the source material that can be included in a KBS. The discussion will begin with
    a fairly detailed look at a particular social security benefit — sickness benefit
    — so as to tease out these characteristics. This benefit has been chosen it is
    an important and representative contributory benefit, with a long history. A fuller
    discussion of it, and other social security benefits may be found in [Ogus and
    Barendt 1982]. Although focused on a particular benefit, the points will hold
    good for all social security benefits, and I believe it are also applicable to
    other sorts of administrative law, and, indeed, to law in general.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 16. SICKNESS BENEFIT


    Some laws, such as those which prohibit theft and murder, are so universal that
    it is tempting to imagine that there have always been such laws forbidding these
    crimes. Indeed, it is difficult to imagine a society which did not have laws forbidding
    these crimes. These laws do, however, serve to fulfil important social goals,
    and were created to help achieve those goals. This fact, that laws are made for
    a reason, and the consequent need to consider what this reason is and how it shapes
    the law, is important everywhere, but the process of legislation being able to
    translate social goals into action is seen particularly clearly in the case of
    laws instituting benefits.


    If we consider our chosen example of sickness benefit, we find that since early
    times there has been some kind of recognition that the more fortunate members
    of society should help to sustain the existence of less fortunate members who
    are, through no fault of their, unable to make provision for their own needs.
    Typically, a person in a developed society is able to provide for himself because
    he has a job and is paid (or, in parlance ‘earns’) the money he needs to do so,
    or is a dependant of someone with such means. There are, however, common contingencies
    which prevent a person from working to receive the money necessary for himself
    and his depend. Notably, people become unable to do work (‘retirement’), they
    are unable to find a job (‘employment’), or they fall ill, and are incapable of
    doing work (‘sickness’). Of course, different societies have at different times
    taken views on how society should respond to such contingencies: one strand of
    thought, expressed in the fable of the Ant and the Grasshopper, was that a person
    should save in good times so that he can see himself through the hard times. In
    the UK provision for these various contingencies was for many years through the
    Poor Law, but this was extremely basic, and most people wanted to avoid the squalid
    poverty of the workhouses. In the nineteenth century therefore, trade unions and
    friendly societies developed in part to enable the better-off workpeople and artisans
    to pay into a fund while in work to insure themselves against these contingencies,
    that their income could be maintained through them and would not be forced to
    rely on the Poor Law. Such coverage was, however, voluntary and less than universal,
    so that many were still forced to the inadequate provision of the Poor Law. This
    led to the view that what was needed was a national and compulsory insurance scheme
    which would provide universally the benefits of membership of the voluntary schemes.
    Eventually this was to lead to the National Insurance scheme, which provided for
    these contingencies, including sickness.


    Thus when sickness benefit was introduced there was a clear intention on the part
    of government to provide for the maintenance of the income of those normally in
    work earning capacity was diminished by sickness. This intention has remained
    and it currently given'
