- pgno: 353
  md: '# 16.2.1. A model of legal source knowledge


    With this element of evaluation we have full circle, and are back with the prospect
    of revising legislation to more closely align effects with intent, or even with
    modifying the original intent itself. The relationships described in the foregoing
    discussion can be summarised in diagrammatic form to give a model of the types
    of knowledge involved in the formulation and application of law (see Figure 16.1).


    This model captures all the elements we found when looking at sickness benefits.
    In other cases some of the levels will contain less knowledge than others: for
    example a new benefit will require time for a body of case law to be established.
    Also different fields of law may tend to place more or less importance on the
    different sorts of knowledge, but I would contend that these elements are to be
    found everywhere. Lastly, one should notice a key difference between the nodes,
    and the arcs which procedural knowledge enabling this knowledge to be applied.


    In the next section we consider how such a model can be used to focus a discussion
    of legal knowledge based systems.


    # 16.2.2. Applying the model to legal KBS


    Given the model we can firstly divide tasks into those which operate at a single
    level and those which affect a transformation across levels. Then one task is
    to discover what a piece of legislation really means. In [Allen and Saxon 1987]
    there is a good discussion of the various ways in which a particular section of
    a statute may be interpreted, accounting how we interpret words as ‘except’, ‘if’
    and ‘unless’ which give rise to differing logical structures for the statute.
    The tool they propose to assist in this interpretive process, which they call
    ‘normalization’, thus operates wholly within the legislation level. Similarly,
    tools designed to support the conceptual retrieval of case law are operating within
    that level. Other systems support the transformation from one level to another;
    many of the consultative expert systems in the domain support the mapping of legal
    concepts into the facts available to the user. Moreover, given the possibility
    of alternative mappings appropriate to different classes of user, there may potentially
    be several systems at a given level.


    Applying this to the systems described in this book, we can see that the policy
    system was intended to support the transformation from intentions to legislation,
    and that the advice and local office systems were designed to support the transformation
    from legal concepts to ascertainable facts, each appropriate to a different user
    group.


    The model shows that there are many possible types of task which are carried out
    in the legal domain, and we can characterize a KBS by reference to which task
    it supports. More importantly, given the correspondence between the levels at
    which the tasks are carried out and'
