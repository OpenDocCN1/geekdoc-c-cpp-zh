    The Forms Helper was implemented on a Xerox 1186 personal workstation [Gilbert
    et al. in press]. It is intended to be sited in convenient public place such as
    a library, advice centre or DSS local office in which affords privacy of use.
    The interaction begins with the user selecting the particular form he or she wishes
    to complete from a number offering the different benefits. The outcome is a fully
    or partially completed form which could be printed out on paper or stored in computer-readable
    format.


    The Forms Helper program is designed as a ‘shell’ to which knowledge about any
    particular form can be added in order to provide support for that form, without
    having to change the form itself in any way. There are five parts to the specification
    of a new form for the Forms Helper: a database which indicates the static appearance
    of the form, including the wording and positions of all the questions; a set of
    help texts for the various kinds of support; a set of ‘routing rules’ which are
    used to compute the next recommended question on the basis of the layout of the
    form and the answers that the user has given; a set of rules which are used to
    perform consistency checks of the user’s answers; and a grammar which defines
    the formats of recognizable dates, numbers and money sums.


    # 5.3.3. The electronic form


    It is a well-established finding that people form conceptual models of interactive
    systems and that these are used to explain why the system appears to work and
    to predict the effect of control actions on it. This has important consequences
    for system design, since it suggests that systems behave according to a consistent
    and familiar conceptual model will be easier to understand and operate than those
    which do not.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Support for Members of the Public


    The design adopted for the Forms Helper encourages users to think of the system
    as an ''electronic form''. Other designs, such as displaying one question at a
    time, or developing an iconic interface, were considered, but there were several
    advantages in adopting the electronic form model. The idea of a form and its properties
    are likely to be familiar to users, reducing the learning required. Users will
    come with the expectation of having to fill in a form and therefore the conceptual
    model will be easily recognized. And the scope of the system is evident from the
    model. For example, users are unlikely to expect the system to do more for them
    than conveying a claim to the organization; they will not expect it to act as
    their advocate or advisor.


    Having a conceptual model is an advantage for the designer as well the user: it
    proposes a style of interaction and suggests the appearance and properties of
    the objects displayed on the screen [Frohlich and Luff, 1989]. Nevertheless, the
    model serves only as a partial explanation of the interface. There are properties
    of paper forms which were intentionally avoided in designing the Forms Helper
    (the fact that a paper includes explicit routing instructions whenever the next
    question to be answered is not the next on the form). Some properties of paper
    forms could not be easily reproduced even if they were desirable (e.g. the possibility
    of ''pencilling'' in trials). The computer has to have some properties which go
    beyond what is possible with paper.


    For example, the Forms Helper controls the display of questions on the form by
    only showing those on the current ''page'' when it becomes clear that they are
    relevant for the particular user. Typically, the first question on the page is
    a filter question, for instance a question asking about whether the form-filler
    rents their home. If this question is answered in the affirmative, further questions
    about details of the rental arrangements appear on the page below the filter question.
    The respondent does not rent, these questions remain hidden. As the user works
    through the form, pages are added, covering previous completed pages. An index
    at the side of the screen allows users to return to previously visited pages to
    examine or amend their answers.


    Another way in which the electronic differs from a paper form is that the areas
    for ''users'' start by being just large enough for a normal answer. As users enter
    more information, the areas are automatically extended, moving later questions
    out of the way if necessary. Thus there is never the problem of not having enough
    room to provide a full answer.


    The effect is that of a growing form showing only questions relevant to the individual
    user. The form-filler''s attention is directed by the system to the next appropriate
    question, at or near the advancing front of the form. This scheme largely removes
    the problem which many users'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Legal Applications of KBS 123


    experience in managing paper forms, that of navigating their way through a complex
    branching structure. It also enables the system to present questions in their
    context, surrounded by other related questions. This is in itself a powerful clause
    about the intention of the question and the kind of answer which is appropriate.


    Although users are always guided to the question which the system should consider
    be answered, they can override this recommendation and take control. In this respect,
    the design allows ''mixed initiative'', that is, either the system or the user
    can control the interaction as is appropriate (see Chapter 13). Users obtain the
    initiative by moving the cursor back to any previous question or forwards to any
    visible question lower down on the current page. This gives them the opportunity
    to change or check answers to previous questions and omit answering some questions
    on their first pass through the form. Taking the initiative carries with it the
    danger that a user could become ''lost'', but the Forms Helps avoids by returning
    the cursor to the next relevant question in sequence each time the user inputs
    an answer.


    # 5.3.4. Electronic help and support


    One way in which the electronic form is visibly different from its paper counterpart
    is in its provision of help and support. When the system recommends or the user
    selects a question for which there is supporting information, a panel of notes
    and explanations is displayed next to the question. All the notes, instructions
    and explanations which appear on the paper form have been moved to these panels
    which appear only as they are needed. This means the user''s attention is directed
    to the electronically displayed form which is relatively uncluttered and to the
    immediately relevant material. The effect is rather like a running commentary
    on the import of the questions as the user moves through them.


    In addition to material related to the question, the user is also offered the
    chance to request three kinds of further help. First, there is procedural help
    on the mechanics of entering an answer on the electronic form. Secondly, for many
    questions there are example answers. Thirdly, there are rephrasings of the questions
    if the user is unsure of the meaning of any of the terms in the question. All
    this material is available to form-fillers as they answer the question. For some
    questions, there is further help which appears only when an answer has been provided.
    This additional information informs the user about the consequences of the answer.
    For example, there are some responses which mean that the form-filler is rendered
    ineligible for benefit and if the user selects one of these, they are told immediately.


    Some questions request answers which are expected to have a specific structure,
    for example, answers consisting of a date or a sum of money. There are advantages
    to the processing organization if such'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'answers are presented in a standard format. The Forms Helper therefore includes
    the capability of ''parsing'' certain kinds of answer, including dates, numbers
    and sums of money. This decomposes the user''s answer into parts and reassembles
    it into a standard format. The parser is driven by a grammar which allows a very
    wide range of formats to be understood (for example, a date may be entered as
    20th March 1989, or 20/3/89 or 3/20/89 or 20-3-89 or in a variety of other styles).
    If the parser is not able to make sense of the input, the user is given examples
    of the standard format and asked to re-enter the answer.


    At the beginning of the interaction, the user is presented with a ''training form'',
    intended to help with learning about the mechanics of filing in an electronic
    form. The training form begins with a section explaining the use of the mouse,
    describes the types of question and how to provide answers (typing into text boxes
    or ''ticking'' boxes by pressing the mouse button while the cursor is a small
    square tick box) and gives practice at deleting mistakes and answering answers.
    It also explains how to complete a session, even midway through to obtain a partially
    completed form, or at the end of the form.


    # 5.4. THE ADVICE SYSTEM


    While the Forms Helper is intended to help claimants at the point of lodging a
    claim, the Advice System aims to give support throughout the claiming process.
    It provides advice and information about many aspects of claiming, including not
    only assessments of eligibility, but also information about the procedures to
    be followed in making a claim, advice about the possibility of appeals against
    unfavourable decisions, information about the benefit system and social security
    in general, and so on. Like most expert systems, the Advice System can be divided
    into a knowledge base with associated inference engine, and a user interface [Gilbert
    et al. 1990]. In fact, there are several knowledge bases in the system. One contains
    information on the five major social security benefits, child benefit, one parent
    benefit, income support, family credit, and housing benefit. Another contains
    knowledge about DSS procedures [Gilbert and Jirotka 1990]. Two other knowledge
    bases are associated with the part of the system concerned with interacting with
    the user.


    # 5.4.1. Representing knowledge about regulations and procedures


    The knowledge bases concerned with social security regulations and procedures
    may be divided conceptually into three ''levels'' and four ''kinds'' [Gilbert
    1987b]. The case level includes knowledge specific to the particular situation
    of the user under consideration, the domain level includes domain knowledge about
    social security regulations and procedures and the theory level concerns knowledge
    about domain knowledge, that is why the social security system is organized as
    it is. The'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Legal Applications of KBS


    four kinds of knowledge which are distinguished: taxonomic, knowledge about entities
    and their relationships, for example, the benefits themselves and how they interrelate;
    formal, analytic knowledge about entities'' attributes, primarily the rules concerning
    eligibility and assessment of benefit; contingent, synthetic knowledge about causal
    and temporal relationships, in which the case of the Advice System consists of
    knowledge about procedures for claiming and appealing benefits; control, knowledge
    about the system itself and its inference, that is the system''s knowledge about
    the deductions it has made.


    These three levels and four kinds may be cross-classified to yield twelve types
    of knowledge which can be manipulated in various ways to provide a full range
    of answers to questions about social security. Because some types of knowledge
    can be used to provide several sorts of answer, there are not twelve, but seventeen
    different sorts of question to which the system can provide an answer. For example,
    the Advice System is entitled to a particular benefit. But if it can also answer
    questions why the user is entitled to this benefit, what the user is entitled
    to this benefit, what the regulations determining eligibility, what the policy
    objectives of those regulations are, what procedures need to be followed to claim
    the benefit, what kind of benefit is one, what other benefits the user might be
    eligible for, and so on. Conventional advisory expert systems are able to produce
    a few of these sorts of answer, but the remaining ones are not usually supported
    because the knowledge needed to generate them is either missing from the system
    or is ''compiled away'' and inaccessible to the inference mechanism and answer
    generator.


    # 5.4.2. A conceptual model for the Advice System


    The choice of an appropriate conceptual model for the system was important in
    designing the user interface and the course of the interaction with the user.
    A number of possibilities were considered. Any kind of iconic or graphical interface
    is ruled out by the difficulty of representing graphically the complex and abstract
    concepts which are inevitably involved in social security (for example, ''income'',
    ''weekly rent'' and being ''responsible for a child''). The user interface, of
    course, to be appropriate for users with no prior training. This rules out any
    form of command-driven interface (because users cannot be required to learn a
    command language). Natural language has been proposed as the most obvious and
    easiest medium for communicating with computer systems, including knowledge based
    systems (e.g. [Bogauraev 1985]). This suggested a design based on the idea of
    a conversation or consultation with an advisor. The conversation would be conducted
    through textual, rather than verbal interactions, but would nevertheless be a
    recognizable conversation, with conversational openings and closings, and questions
    and answers from both system and user.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Although provide a natural language interface has merits, no existing natural
    language understanding system can cope with every input might give it — they are
    all confined to (quite narrow) domains. This means that users normally have to
    learn what they can say and how they should express it before they can interact
    with the system effectively. However, natural language interfaces do the strong
    advantage of great expressive power which it would be a shame to lose. The solution
    which has been adopted is to provide a menu-driven interface which allows the
    user to compose, in restricted natural language, any of the statements or questions
    which the system is capable of understanding.


    The user interface consists of three parts: a scrolling window on the left of
    the screen in which all the input and output are displayed; a set of three buttons
    at the bottom right of the screen; and an area on the right of the screen in which
    means are displayed by the system. The menus enable users to construct utterances
    for their side of the conversation. The buttons enable the user to request a rephrasing
    of a system utterance, to ask the system for a justification of its reasoning
    and to demand an immediate termination of the interaction (an emergency exit).


    Unlike the majority of current user interface management systems, which limit
    the possibilities to predetermined routes through a network of options, the interaction
    design for the Advice System is based on the idea of ''local management''. Each
    utterance, whether from the system or the user, is constrained only by the immediately
    preceding conversational context. Constraints on the next conversational turn
    are imposed by a set of interaction rules rules derived from the analysis of human
    conversations. This component of the Advice System is described in more detail
    in Chapter 9.


    As a consequence of this design, the user of the Advice System can obtain a wide
    range of information by asking questions during a dialogue in which the initiative
    passes back and forth between the user and the system. The dialogue allows the
    user to explore topics in however way seems best, mirroring spoken discourse,
    where generally conversations are not preplanned but from ''one thing to another''.
    The intention is to provide a system which supports a style of advice giving although
    both the content and the structure of the dialogue respond directly to the individual
    moment-to-moment utterances of the participants, extended interactions are coherent
    and cumulative, yielding advice and explanations that are built from individual
    conversational turns. Whether this objective has been achieved can only be determined
    by trials with users (see Chapter 9).'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 5.5. CONCLUSIONS


    The two systems which have been reviewed in this chapter have been designed for
    use by clients of the DSS to help them claim social security benefits. But the
    software has been constructed in a way which allows them to be applied in many
    other domains. Both systems consist of a ''shell'' and a set of knowledge bases.
    The shells are knowledge-free programs which provide sets of resources to the
    system builder. They work in conjunction with knowledge bases that are constructed
    for the particular application, in this case social security. For example, to
    develop an Advice System to provide advice about choosing between various plans
    one would need to rebuild the knowledge bases, but one would not need to change
    the program itself.


    These systems can thus be considered not just as programs to help people with
    claiming-tested social security benefits but also in a wider sense, as prototypes
    systems designed for enhancing communications between institutional boundaries
    between clients and large, legislation-based organizations. The systems embody
    several general principles which are important for this kind of application. First,
    both support ''mixed initiative'', allowing both the user and the system to control
    as appropriate. Mixed initiative is significant for client-organization communication
    because the need in these circumstances for a negotiation between the two parties.
    The customer comes with some prior set of requirements; the organization with
    some of services which can be supplied. The purpose of the system is to support
    the negotiation of a resolution of any differences between the customer''s requirements
    and what the organization can supply.


    The element of negotiation in the interchange between client and organization
    is also the base of the second general principle embodied in the two systems:
    they use the knowledge built into them in order to translate the users'' views
    of their needs into the vocabulary of the organization, and vice versa. This is
    most clearly seen in the ''Forms Helper, but the Advice System can also be considered
    to be ''translating'' concepts like eligibility for a benefit, which are meaningful
    to the organization, into specific queries expressed in terms that are meaningful
    to the user.


    The third principle which the systems demonstrates that users need to find a conceptual
    model of a system in order to use it effectively. The systems have been designed
    with a specific conceptual model in mind, and this has contributed to their ease
    of use. The models — of an electronic form for the Forms Helper and of a conversation
    with the Advice System — are based on existing modes of communication with which
    potential users can be expected to be already familiar.


    These principles have emerged from, and have guided the design decisions which
    were made to construct the two systems. The evaluations described in Chapter 9
    suggest that the principles have led to'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'development of prototypes which do demonstrate the effectiveness of knowledge
    based systems for assisting communication over organizational boundaries. The
    evidence is that the public could use the systems in their present form to help
    with claiming social security, and that they would be welcomed and be popular.
    However, whether these systems or their descendants are actually put into use
    by the DSS depends inevitably not only on the quality of their design, but on
    political decisions which have yet to be taken.


    # 5.6. ACKNOWLEDGEMENTS


    The Forms Helper and the Advice System were designed and built by Sarah Buckland,
    Betsy Cordingley, Leo Crossfield, Shashi Dave, Patrick Dawson, David Frohlich,
    Nigel Gilbert, David Goodwin, Michael Hardey, Marina Jirot, Kevin Johnstone, Alison
    Mill-Ingen, Hilary Minor, Paul Luff, Mike Pappas, Nick Perry and Peter Robinson
    over the period 1984 to 1989.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# CHAPTER 6


    # USING A COMMON KNOWLEDGE BASE IN SEVERAL APPLICATIONS


    Trevor Bench-Capon


    # 6.1. INTRODUCTION


    In this chapter I discuss some of the considerations which relate to sharing a
    common knowledge base (KB) across several applications. I begin with an example
    which is sufficiently small to comprehend in its entirety; considering how we
    might go about building systems in this limited domain will reveal a number of
    powerful reasons for expecting substantial divergence between the knowledge bases
    for different applications, even when the domain is the same. This in turn highlights
    the importance of considering the task when constructing a KB.


    # 6.2. An example


    Suppose we were building three systems relating to the parish relief law of a
    factional parish in Elizabethan England: to assist in the processing of claims
    for relief; to advise people wishing to claim such relief; and one to assist the
    parish in formulating policy on parish relief. The legislation relevant is:


    Any person shall be provided with parish relief if he apply to a beadle of the
    parish, and in the opinion of that beadle is deserving of such relief.


    Case in law is sparse since there are no systems of appeal and the only recourse
    of the disgruntled is to apply for a writ of mandamus to quash the decision.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Two such applications for mandamus have been made. In the first it was held
    that relief was not payable to John Goodbody because he was a sturdy vagabond
    who could make his own shift (''make one''s own shift'' is an archaic phrase used
    by judges to mean ''provide for oneself''). In the second, relief was granted
    to Mistress Quickly, a widow judge holding that of all people widows and orphans
    were deserving of relief.


    Following these decisions, instructions have been issued to beadles saying that
    they are not to grant relief to men of good health under the age of 65, nor to
    married women, nor to single women of good health under the age of 60, nor to
    anyone under the age of 14 with a living parent. Also that widows should be granted
    relief as should anyone with a certificate of unsturdiness from a registered physician,
    and a child under the age of 14 without a living parent.


    Note that the guidance is intended to subsume the case law, and that the word
    ''orphans'' as used in the judgement on the Quickly case has been interpreted
    as meaning a person without living parents under the age of 14. Some age limit
    is clearly needed, but the decision itself gives no help here, so the operationalization
    of the concept must be achieved through the guidance.


    We begin to build our expert system for formalizing the legislation.


    ```

    _Person ProvidedWithParishRelief iff

    _Some IS ABeadle

    and

    _Person AppliesTo_Someone

    and

    _Someone ThinksDeserving_Person.

    ```


    Note that terms beginning with '' '' are variables. This formalization could be
    transformed into executable PRLOG, as:


    ```

    PF1 ProvidedWithParishRelief(X):


    IsBeadle(Y), AppliesTo(Y,X),

    ThinksDeserving(X,Y).

    ```


    The rest of the formal examples are all given in PROLOG.


    Now we could use this system as a beadle to assess an application and as a potential
    claimant to get information. The system would be of some utility, but it would
    be limited; a claimant would learn that he would have to apply to a beadle and
    convince him he was deserving, and the assessor would learn that he was empowered
    to decide the application if he was a beadle, and would have his attention directed
    the precise question on which he had to reach a judgement. of course, the claimant
    would not have any indication of whether his'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Legal Applications of KBS 131


    application would succeed and the assessor would have no help in judg- the merit
    of the applicant.


    The policy team could also use the system to answer a variety of complaints. For
    example, if someone complained that Joe thought they were deserving and yet they
    did not get relief, the problem could quickly be spotted: Joe is not a bead.


    So far three systems have a common KB. But it is unlikely that we would want the
    users to have the system as it stands. At a minimum we would provide an interface.
    A minimal interface might be:


    ```

    I1 GiveReliefTo(X): ProvidedWithParishRelief(X).

    ```


    for the assessment system and


    ```

    I2 CanGetRelief(X): ProvidedWithParishRelief(X).

    ```


    for the advice system. We might also wish to include some kind of thesaurus-type
    information to handle vocabulary differences between the assessors and the assessed.
    If the interface is knowledge-based, therefore, differences in the target users
    will necessitate differences in the KB.


    Now we may formalize the case


    ```

    CL1 ThinksDeserving(X,Y)- KnownDeserving(Y).

    CL2 ThinksDeserving(X,Y)-

    not(KnownUndeserving(Y)),

    LooksDeservingTo(X,Y).

    ```


    ```

    CL3 KnownDeserving(Y) :- widow(Y).

    CL4 KnownDeserving(Y) :- orphan(Y).

    CL5 KnownUndeserving(Y):CanMakeOwnShift(Y).

    CL6 CanMakeOwnShift(Y):Sturdy(Y),Vagabond(Y).

    ```


    Now we must formalize the guidance. Some parts will be latent in the case law,
    and some will not. Consider the guidance again this time with the additional information
    which could be elicited from the author of the guidance, explaining the justification
    for each bit of guidance. The justifications are appended in brackets.


    Do not relieve:


    +   NR1 men of good health under the age of 65 (justified because such people
    can make their own shift; all sturdy vagabonds will be in this category)


    +   NR2 married women (as they can look to their husbands for support)


    +   NR3 single women of good health under the age of 60 (as they can make their
    own shift or marry as the fancy takes them)


    +   NR4 anyone under the age of 14 with a living parent (as they can)'
