    The argument for this is that legal rules, and decision making associated with
    their application, are designed to apply to the general case rather than specific
    cases, and therefore the key role of the interpreter/applier of rules is to know
    which ones should be used for the particular and peculiar combination of facts
    and evidence in a specific case. There is no logical ''general solution'' which
    should always be followed—the solution is determined by the specific facts of
    the case, not the general ''type'' of case. If this were not the case then we
    could expect that the legislation itself would provide the greater detail necessary
    to avoid ambiguity and ''interpretation''. Now it can be argued that although
    there is no a priori logical process applicable to all cases, there can be frequently
    occurring ''groups'' of problem which have a generally applicable ''practical''
    strategy associated with them. This is dangerous ground. Even if there are practical
    strategies which apply in 80% of cases, (and this is doubtful) it is necessary
    to ensure that the 20% of exceptions are clearly identified and handled appropriately
    and there is no evidence that this is possible. This is, one of the important
    ways in which ''KBS in law'' are crucially different from other decision making
    environments. In other areas, an ''optimum applicability''/majority of cases''
    approach may be perfectly acceptable—the exceptions are not significant enough
    to make a difference. In law, exceptions are crucial and individual cases are
    extremely important.


    Even if we had dismissed these considerations as ''idealistic'' their approach
    to the law and its application, we would still have to consider the complexity
    and scope of the required knowledge base. This expertise would have to be elicited,
    as it is not currently available. Would OCAO be able to justify this extra effort
    on their part—involving far more effort than is required to produce the AOQ? Had
    we any evidence that they would be able to agree what knowledge went in? Would
    they be prepared to have this knowledge published—by law they are required to
    do? People at OCAO have been characterized as having an excessively purist attitude
    to deciding cases. Would approach be acceptable to ''real'' AOs? Even if it were,
    the number of rules required would be substantial. Updating the knowledge base
    according to changes in regulations and time consuming The implications would
    be less, rather than more, flexibility would be introduced. Were such a system
    to be built, it would be unlikely to go very well with the potential users. They
    were always extremely, and probably justifiably, worried about the system ''taking
    over'' and removing their freedom of choice. The introduction of an ''expert''s''
    view of how the case should be handled would not be well received. It is not clear
    that it would actually improve the skills of the AO.'
