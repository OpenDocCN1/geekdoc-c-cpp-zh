    # 1.8.3. Commentary


    The various approaches described in this section make use of relatively

    high-level computational formalisms to separate explicit representations of

    the law from the procedures and inference mechanisms that apply them

    to the analysis of legal problems. Many of the considerations brought up

    in the previous section also apply to the use of these alternative approaches

    as well. All of the approaches and programs described in this section

    represent a single, fixed interpretation of the legal sources on which they

    are based. By the same arguments that were put forward earlier, the

    programs in this section are similarly not intended to solve legal prob-

    lems autonomously (in the very special circumstances which allow

    to to be used as data-processing systems and administrative systems

    for other ''routine'' tasks). The perceived advantages of these higher-level

    formalisms is that they can ease the task of representing a fragment of

    the law, and that these resulting representations can be made relatively

