    # 1.10. The LEX project


    The LEX project is a collaborative research project between the University of
    Tingen and the IBM Scientific Centre in Heidelberg [Jones 1986; Haft et al. 1987].
    The project develops two kinds of application: a consultation system, which gives
    legal advice to lawyers and helps them to prepare a case (what I have been calling
    a legal analysis program); and an intelligent tutor, a computer-assisted instruction
    system based on a representation of legal knowledge. The project is taking traffic
    law regulations in the German penal code as its main experimental domain.


    The LEX project has emphasized the declarative nature of its representations,
    and the use of automated theorem-proving techniques to execute these representations
    in practical applications. In this respect, the project shares the motivation
    and nature of the presuppitions of the approach described in section 1.10.1. The
    LEX project, developed from research into natural language interfaces to relational
    databases. It differs from the approach described in the previous section in its
    continuing concern with natural language issues. It differs in too its specific
    choice of representational formalism and theorem-proving technique.


