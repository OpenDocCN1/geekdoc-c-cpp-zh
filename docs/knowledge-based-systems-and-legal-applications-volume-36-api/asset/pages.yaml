    comments from users, which would be used as a base of critiques of both the system
    and the understanding of requirements. This analysis was approached in two ways.
    Firstly by the relatively straightforward analysis of sources along with their
    role, purpose and structures; secondly, through the more difficult detailed analysis
    of adjudication officers'' tasks.


    # 3.3.1. Sources


    The adjudication officer is presented with four categories of source material
    to help them arrive at their decision: legislation, case law, claim data and evidence,
    and official departmental guidance.


    The main legislation is the Social Security Act 1986 and the income support (General
    Regulations) 1987. It would be dangerous to assume, however, that for the purposes
    of an Income Support the legislative sources are clearly defined in scope. Parts
    of the legislation are irrelevant to the precise content of a particular case,
    being concerned'
