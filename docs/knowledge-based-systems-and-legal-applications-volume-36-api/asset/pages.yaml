    In many areas of law, skill in interpretation, involving both a knowledge of the
    law and of relevant past decisions as well as an understanding of English and
    a certain degree of common sense knowledge of the world, will be a good part of
    what makes a person expert in that field of law. Essentially, each of these experts
    will be operationalizing his knowledge so as to map the facts available to him.
    Different experts may operationalize their knowledge in different ways, regarding
    different facts as relevant, and perhaps drawing different conclusions on the
    basis of the available facts. In the case of sickness benefit, as in the areas
    of social security, this operationalisation has been to some extent codified.
    The office of the chief adjudicating officer produces a manual for the guidance
    of adjudicating officers which contains a written version of the expertise they
    need to deploy. Even this detailed guidance will require some interpretation,
    but it means that a great deal of the relevant expertise can be operationalized,
    This is not, however, the only way that relevant knowledge is explicit, and there
    exist other manuals, as the welfare rights handbooks published by the Child Poverty
    Action Group, which also attempt to present the law in an applicable fashion.
    These guides are used by both claimants and those who advise claimants, such as
    Citizens Advice Workers. The ways in which these guides generalize the law differ
    from that found in the adjudicators'' manual both because the perspective of use
    differs, in that they are concerned to identify potential title than to support
    an authoritative legal decision, and because the facts available to the two groups
    differ. As examples of this last point, consider the case of the age of the claimant,
