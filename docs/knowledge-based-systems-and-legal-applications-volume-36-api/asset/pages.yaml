    condition or conclusion was shown in bold face to the right of it. Any condition
    whose truth could be determined by further rules in the system was marked with
    an ''expand'' icon pointing at it and clicking the mouse button overlaid the current
    window''s title bar with a further structured dialogue window whose conclusion
    related to the ''expanded'' condition. When in a deeply nested rule, several levels
    of pending conclusion would be seen over the current window.


    Where no rule was available, the user could assert or deny the truth of a condition.
