    Starting

    There was a major problem with the way the initiative was shared at the start
    of the interaction. It had to do with closing the opening sequence. After the
    initial summons-answer and identification sequence, users were given the initiative
    by the system to ''tell me something about yourself and your situation''. Most
    users did not know what to do with it. They began by volunteering statements but
    never knew when to stop. Several users had to be restrained from working systematically
    through two hundred available user statement options before going to ask their
    first question.


    Indeed, the fact that users had to ask questions of the system to get advice was
    not clear in this initial period. Users appeared to arrive at the machine with
    a general expectation that they would have to feed in extensive details about
    themselves before being given a description of their eligibility for a range of
    benefits. One user expressed this by saying; ''I thought I would have to put a
    lot of information in and it would give a summary answer at the end'', ALSOGANN2.
    By giving initiative to feed in such expectation. As users could not predict the
    moment when initiative would be taken from them by the system to deliver useful
    advice, the best strategy seemed to be hold on to the initiative to continue-inputting
    further statements. This was was despite the fact that there was a simple method
    of giving the initiative back to the system; by saying ''No'' to the system''s
    repeated question ''Do you want to tell me anything else?''.


