- pgno: 94
  md: '# CHAPTER 3


    # A SUPPORT ENVIRONMENT FOR ADJUDICATORS


    Andrew Taylor


    Existing work on knowledge based systems and law has proved, in the main, to be
    still quite distant from the support requirements of specific decision makers.
    Firstly, the dominant emphasis has been on the capabilities of systems which support
    a particular style or form of reasoning rather than with the needs for a case,
    highly focused and integrated environment of support which a serious working system
    would require. There has been important work into case based reasoning, logical
    modeling of legislation and representation of ''expert legal knowledge'', which
    has recently acknowledged that they represent complementary techniques any of
    which in isolation is inadequate. Unfortunately, this work has generally failed
    to address how these various capabilities need to be combined and integrated to
    support specific decision making tasks. Secondly, the intellectual grounding of
    the work has concentrated on the issues of jurisprudence and abstractions of legal
    reasoning rather than on the less even ''messier'', but in a pragmatic sense more
    relevant issues arising from socio-legal studies.


    Lastly, where real systems have been developed, there has been a tendency to design
    them with ''non-specific'' uses, almost as an alternative to publishing a book.
    This assumes, however, that the differences in requirements of specific users
    either do not matter or could be accommodated with ''add-on'' facilities.


    The local office demonstrator presented an unusual opportunity to: Consider the
    specific requirements of a complex decision making


    +   1. Consider the specific requirements of a complex decision making'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'environment; not least by highlighting the inadequacies of existing general
    or straightforward capabilities.


    +   2. Design an integrated and highly focused system with appropriate interaction
    capabilities.


    +   3. Study the complex organizational and social aspects of such a support system.


    This chapter attempts to extract some general lessons from this work concerning
    the potential for developing any support environment for adjudicators. Firstly,
    it will consider the question of what a support system for adjudicators should
    be achieving (and what it should be aiming to avoid). Secondly, it will characterize
    our conclusions on what general support is required for the adjudication task.
    It concludes with a consideration of some of the issues which still need to be
    resolved.


    # 3.1. ADJUDICATION, ADJUDICATORS AND SOCIAL SECURITY


    Decisions on entitlement to benefit are made by officers appointed by the secretary
    of state. Historically, decisions on entitlement to noncontributory benefits were
    taken by DHSS staff who had substantial powers of discretion in their decision
    making but whose decisions could be appealed against an independent appeal body.
    Since 1980 all entitlement decisions have been the responsibility of adjudication
    officers. These officers are responsible for their own decisions nominally acting
    in law under the general supervision of the chief adjudication officer. The 1980
    reforms removed much of the discretion in the supplementary benefits system—admittedly
    complex, making the adjudication officers task primarily of applying the, law
    to the facts.


    The task of an adjudication officer may appear no different from other decision
    processes which are tightly controlled by regulations (eg. in financial or insurance
    services). For our work, however, the particular features of adjudication proved
    to be fundamental for the design of relevant support.


    The distinguishing feature of legal adjudication is that, for a decision to beatory,
    certain procedural restraints must be placed on the decision maker. In particular:


    +   1. They need to provide reasoned arguments and justifications for their decisions.


    +   2. They should be demonstrably impartial and independent.


    +   3. The exercise of their remaining discretion, in the interpretation of conditions,
    should be within the tenets of administrative law.


    To help them with the complexities of legislation and its application, the adjudication
    officers are provided with guidance in the form of the Adjudication Officer''s
    Guide (AOG). While not being bound by this'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Legal Applications of KBS


    guidance they are encouraged to take it into consideration when arriving at their
    decisions.


    In practice these ideals of adjudication officers have frequently been called
    into question. Firstly, there is the issue of the status of the AOG. For the most
    part it is uncommon for the adjudicator officer to decide unless they have limited
    access to the guidance itself. The guidance is therefore in danger of becoming
    what has been called quasi-legislation. Secondly, there is the problem of routinization
    where officers inevitably evolve standard ways of interpreting rules and handling
    ordinary cases.


    Bureaucratic behaviour is of necessity determined by routine since the average
    officer cannot know all the rules and does not have time to determine what course
    the rules set for every claim. In routinisation is one of the virtues of bureaucracy
    for it contributes to reliability, continuity, efficiency and impartiality. [Cransston
    1985]


    One problem of this however, is that it can lead to a tendency to ignore the complexity
    of particular cases. Equally, it might take some time for changes in the rules
    to work their way through to day to practice.


    Thirdly, and by the major constraint, there are administrative and practical pressures
    on the maintenance of adjudication standards. In the area of income support there
    are over one hundred officers assessing excess of five million cases per year.
    Many offices have difficulty in retaining suitably qualified staff. The training
    they receives twenty-six weeks initial training followed by three weeks extra
    training which concentrates on their role as adjudicators and the law. It is unusual
    for them to have any prior legal training. The legislative conditions they have
    to apply are large in number and in some areas particularly complex:


    The Statutes on Social Security are necessarily complex: because they have to
    cover the whole range of human activities and human wants. The Regulations are
    necessarily detailed because they have to provide so many different benefits in
    so many different circumstances. [Denning 1986]


    In addition these problems of scale there are issues arising from the organisational
    control of adjudication. Adjudication officers will only spend a proportion of
    their time carrying out this adjudication role. For the rest of their time they
    are responsible to manage the manager of the local office. In situations of pressure
    on case loads, maintaining a clear distinction between these two roles must be
    difficult.


    One result of these constraints is that the quality of adjudication has generally
    been considered to be far from adequate. In the annual report of the chief adjudication
    officer, rates for decisions on Supplementary Benefit adjudication which raised
    comments from monitoring staff were on average 35% and in some aspects as high
    as 70% [ARCA 1988]. In'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'an environment where the volume of claims is high and there is an urgent priority
    to respond to these claims quickly, issues of quality have tended to take a secondary
    role to issues of effective administration. It has also been difficult to establish
    how quality could be improved.


    # 3.2. AIMS OF AN ADJUDICATION SUPPORT SYSTEM


    The primary aim of the local office demonstrator was to show how knowledge based
    decision support tools could assist with the quality (as opposed to the cost or
    speed) of the decision making and associated service in adjudication of benefits.
    There were a number of motivations for this. The existing computerized programme
    of the Department of Social Security was directly concerned with issues of cost
    effectiveness and administrative aspects of benefit processing — highlighting
    the need for any parallel experimental work to address the remaining issues of
    quality. The capabilities of knowledge based systems seem more appropriate for
    addressing such issues. Lastly, the work was explicitly directed at the support
    and enhancement of human decision-making processes rather than their replacement
    or diminish.


    Such a commitment to ‘quality’ of adjudication did not take us far in establishing
    aims for the system, however. Firstly, a commitment implicitly assumes knowledge
    of what it is ‘wrong’ in current practice and what causes underlie these mistakes.
    We therefore needed to establish the criteria for quality and the sources of mistakes
    in adjudication. Secondly, it was necessary to understand the constraints on achieving
    improvements in quality.


    Lastly, it was important additional to consider the other complementary, possibly
    competing, objectives to that of quality of adjudication.


    The pervasive complexity of statutory conditions within the social security Acts
    and Regulations is both intimidating and a source of confusion for those outsiders
    looking at the process of Social Security adjudication and considering how it
    could be supported. Equally, the conceptual uncertainties introduced by the ‘open
    texture’ of legislation presents the possibility of considerable difficulties
    arising with the interpretation of specific conditions. It is not surprising,
    therefore, that a typical conception of the support requirements is to provide
    a system which not only simplifies the identification and application of appropriate
    legal rules also presents specific case guidance on the interpretation of specific
    open textured conditions.


    Unfortunately, it is frequently the case that observers of a decision-making context
    develop strong conceptions of what they believe the decision-makers will find
    problematic and error prone while the actual problems of these decision-makers
    are quite different. One reason for this, of course, is that the decision makers
    are trained and acquire experience which overcomes the specific problems of novices
    — it would'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'foolish, for example, to characterize the main problem of motorists as being
    the manipulation of gear changes and general car handling, rather than the drivers
    perception of the behaviour of other road users. It was essential, therefore,
    to investigate the actual problems and sources of error in adjudication rather
    than on our own assumptions.


    One approach we took to identifying problems was to examine the reports of the
    social security commissioners who, in addition to ruling on specific appeals which
    are referred to them also comment on the quality of earlier decisions on cases.
    Additionally, the Department of Social Security has its own bound of expertise
    in the form of the office of the chief adjudication officer who annually produces
    a report on the quality of decisions and makes recommendations about ways of improving
    this quality. From these sources it became apparent that the majority of complaints
    concerning quality related to failure to consider all the appropriate evidence
    concerning a case, and inadequate explanation or justification of the original
    decision. Following such evidence it was appropriate to include support for the
    collection of evidence and the processes of argumentation and justification supporting
    the decision making.


    Already, therefore, we had four sub-goals concerning improvement in quality:


    +   1. Support with identification and application of rules.


    +   2. Support with case reasoning, interpretation and open texture.


    +   3. Support with consideration of relevant evidence.


    +   4. Support for explanation and justification of decisions.


    One immediate problem, then, was to establish how we should choose between these
    subgoal in terms of priorities and to establish the extent to which they were
    conflicting. A straightforward approach might have been to ask users, develop
    small and separate prototype systems for each of the goals and then progress these
    separate systems incrementally. Our concern was that this would lead to inadequate
    and unintegrated systems. Instead we adopted a ‘holistic’ approach to developing
    a support environment. Before we could start to address the four issues and their
    relative priority, we had to recognize that the results of problems with the adjudication
    process cannot be equated with the causes; thus the application of wrong rules
    could be resulting from ignorance of the conditions and their logical relationships
    or from misinterpretation of the case. Failure to consider relevant evidence could
    be resulting from ignorance of the conditions which required such evidence or
    made it relevant, and so forth. It was necessary, therefore, to consider the more
    specific tasks of the adjudication officers and to identify which of these tasks
    were considered problematic and why. This analysis and its implications are described
    further in the section.


    Justifying support requirements solely on the basis of a conceptual'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'analysis of problems assumes that the factors influencing adjudication quality
    are predominantly rational. In contrast, however, the practical issues of the
    amount of time available for adjudicating cases, the frequency of changes in the
    conditions and problems with keeping up to date with these, the political and
    administrative pressures on the decision making process, and the lack of experience
    of certain adjudication officers, all combine to create problems and requirements
    over and above those associated with the logic of the decision making task. We
    therefore needed to consider the overall organizational context of the decision
    making, in particular with regard to the constraints it imposes, and establish
    any additional items relevant to the organization as it stands. Such an approach
    effectively acknowledged the specific requirements of social security adjudication
    differ not only from other decision making in law but from other adjudicative
    decision making, (for example, by Inland Revenue officers).


    Following this approach, five objectives were identified: for more details and
    explanation, see, Taylor [1988].


    +   1. Quality of decision making — with the system supporting the correct and
    consistent application of legal conditions, and attempting to ensure that the
    Adjudication Officer considers all the relevant information relating to a case.


    +   2. Training — that by using the system the adjudication officer would become
    more skilled and develop an improved understanding of the legal conditions.


    +   3. Level of service — with the system supporting the development of well-argued
    and justified decisions with better explanations and information provided to claimants,
    and support in the development of better quality submissions to appeal tribunals;


    +   4. Monitoring — providing facilities whereby decisions can be monitored either
    by those responsible for guiding and supporting adjudication officers in their
    decision making, or by policy makers interested in the number of claimants for
    particular benefits;


    +   5. Flexibility — illustrating the potential for improvement in the speed and
    effectiveness of implementing changes in the regulations and having these applied
    by local office staff.


    The challenge we faced to address all of these issues in our design.


    # 3.3. SUPPORT REQUIREMENTS


    Establishing appropriate objectives for an adjudication officer support environment
    proved a difficult task. Identifying the support requirements was equally difficult.
    The general approach taken was to identify the tasks carried out by adjudication
    officers, establish the problems they found with detailed aspects of these tasks
    and then identify support'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Legal Applications of KBS


    mechanisms which would help with these problematic aspects while being appropriate
    for achieving the overall aims of the system. This was pursued through analysis
    of cases and legislation plus interviews with local office staff, training staff,
    management, and in particular the monitoring and OCAO staff.


