    2. The system would keep a faithful record of the user''s decisions, would infer
    straightforward implications of the user''s decisions, and prevent entry of inconsistent
    data.


    4. The user would decide on the order in which to address issues, within constraints
    imposed by the system.


    These constraints would relate to simple dependencies between topics and input
    data (e.g. a topic covering the details of the claimant''s partner could only
    be accessed after the claimant had been declared to have a partner):


    +   1. The system would help users keep track of where they were in the overall
    assessment, why they were there, what they had done and what they still had to
    do.


    +   2. Any relevant guidance would be easily available to the user.


    +   3. The system would ensure that the case was not regarded as complete until
    all relevant issues had been examined and all relevant decisions had not been
    made.


    The model of control, then, that the system should not ''decide'' anything, but
    simply provide guidance and carry out straightforward inferences and arithmetic.
    What the system would do was oblige the adjudication officer to enter all the
    required evidence, and prevent the adjudication officer from completing a case
    until a minimum set of acceptable criteria had been satisfied.


    The interaction involves the system providing hurdles or legal constraints which
    the adjudication officer had to satisfy before ''completed'', providing all of
    the guidance relevant in the adjudication officer towards satisfying these constraints.
    It assumed that the skilled adjudication officer would know how to work through
    the interaction in the quickest manner possible, only being required to enter
    the justifications for decisions which they would have been obliged to provide
    anyway. Inexperienced adjudication officers, or ones dealing with issues outside
    their knowledge would be ''slowed down'' by the system and forced to follow through
    the details of the guidance and the rules. We, believe, would have the desired
    training effect through effective usage of the system.


    # 7.10. THE DESIGN OF LOD3


    The user interface of LOD3 was redefined, almost from scratch, in a (largely successful)
    attempt to remove problems that had been encountered with the user interface of
    LOD2. This resulted in a design in which ''fast paths'', support for users of
