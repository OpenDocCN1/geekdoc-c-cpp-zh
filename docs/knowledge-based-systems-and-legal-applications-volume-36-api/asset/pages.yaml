- pgno: 14
  md: '# BIOGRAPHICAL INFORMATION


    TREVOR BENCH-CAPON read philosophy and economics at St John''s College Oxford,
    where he also took a D. Phil. He worked for six years at the Department of Health
    and Social Security in policy and computer branches where he helped to set up
    the Alvey DHSS Demonstrator project. He then went to Imperial College, London
    to contribute to the Demonstrator project and to research logic programming applied
    to legislation. He has been a lecturer in computer science at the University of
    Liverpool since 1987.


    ELIZABETH S. CORDINGLE received a bachelors degree in physics in the USA and then
    obtained a masters degree in social research from the University of Surrey. Her
    research experience includes studies of computer in local authority social services
    departments and she worked on the Alvey DHSS Demonstrator Project From July 1984
    until its completion. Elizabeth is currently working as an executive engineer
    at BT Research Laboratory.


    JUSTIN FORDER is a principal consultant at Logica Cambridge Ltd. On the Alvey
    DHSS Demonstrator he contributed to the policy and local office applications and
    the definition and design of the Toolkit. He is continuing to use lessons learned
    from the project in decision-support'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'applications ranging from intelligence analysis to the design of safety-related
    systems.


    DAVID FROHLIC graduated in Psychology at the University of Sheffield in 1980,
    and stayed on to complete a PhD in skill acquisition. His interests in human-environment
    interaction led him into the field of human-computer interaction. He worked as
    a Factors Consultant for one year from October 1983 before joining the Alvey DHSS
    Demonstrator Project as Research Psychologist on the Claimant Information Team
    at Surrey University. During his 5 years on this project he worked on a variety
    of tasks supporting the design of the Forms Helper and Advice System, including
    studies of human computer interactions, secondary analysis of advisory consultations,
    experiments on menu-based natural language interfaces, dialogue design, knowledge
    analysis and cooperative evaluation. He also held the post of Associate Lecturer
    at the University, and developed a course on human computer interaction in the
    Department of Electronic and Electrical Engineering. After leaving the Demonstrator
    Project in December 1989, David spent several months travelling abroad taking
    up his present position as member of technical staff in the Advanced Information
    Management Department of Hewlett-Packard Laboratories, Bristol. He is currently
    working at Hewlett''s research laboratory in Bristol.


    NIGEL GILBERT is reader in sociology at the University of Surrey. He pioneered
    computer benefit information systems for use by claimants with a prototype developed
    in 1980 and was one of members of the Alvey DHSS Demonstrator project at its inception
    in 1984. He now leads the Social and Computer Sciences Research Group at the University
    of Surrey. His interests include the sociology of scientific knowledge, social
    mobility, artificial intelligence and human computer interaction. He has published
    five books and numerous papers on these topics.


    PAUL LUFF was awarded a B Sc (Hons) in computer science at the University of York
    in 1983 since he has been involved in research into computational linguistics,
    knowledge-based systems and human-computer interaction. In 1985 he joined the
    Claimant Information Systems Group of the Alvey DHSS Demonstrator project at the
    University of Surrey where he helped them with the design and implementation of
    the interface and interaction components of two knowledge-based systems: the Forms
    Helper and the Advice System. Recently he has co-edited ''Computers and Conversation''
    for Academic Press. At present, he is involved'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Biographical Information


    in research both at the University of Surrey and Cambridge EuroPARC.


    CHARLIE PORTMAN joined Ferranti''s computer department in 1954 after gaining a
    B. Eng at the University of Liverpool. He worked as a circuit engineer, a logic
    designer and a test programmer and led a drum commissioning team before taking
    responsibility for the Sirius project. He worked on the Ferranti Orion computer
