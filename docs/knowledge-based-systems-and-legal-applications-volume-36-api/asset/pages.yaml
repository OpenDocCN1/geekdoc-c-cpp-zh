  md: '# CHAPTER 5


    # SUPPORT FOR MEMBERS OF THE PUBLIC


    Nigel Gilbert


    As other chapters in this volume have explained, knowledge-based systems have
    great attention within within legislation-oriented organizations. But rather less
    attention has been paid to the possibilities of making such systems available
    as resources for the customer of organisations. Two of the demonstrators developed
    by the project were prototypes of systems intended to show how knowledge-based
    systems could assist members of the public in their dealings with the Department
    of Social Security: the ''Forms Helper'' and the ''Advice System''. This chapter
    will describe the objectives and the design of these two demonstrators. Firstly,
    however, it is important to review the reasons why building systems intended for
    the customers or clients of an organization is worthwhile.


    # 5.1. KNOWLEDGE BASED SYSTEMS FOR CUSTOMERS


    Designing knowledge based systems which the public can use successfully is a challenge
    requiring great attention to the details of the interface. One cannot expect the
    public to undergo training courses, read manuals or even pay much attention to
    on-line help. Many of those who do succeed in using the system for the first time
    will have forgotten how it works by the time they come to again. Thus designing
    for public immediately raises the question of ''usability'' in perhaps its most
    extreme form. If it were possible to formulate successful design techniques for
    this audience, the techniques might also be valuable for other, more experienced
    classes of user, especially where training is expensive'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'users cannot find the time to learn how to operate the computer.


    Developing systems for public use can therefore bring technical returns in promoting
    the development of better interfaces. There can also be commercial returns. The
    services offered by many organizations are complex and have to be fitted to the
    particular needs of the customer. For example, many financial institutions are
    now offering a very wide range of saving and investment plans and are selling
    them on the basis that one will suit the specific needs of the client. But how
    is the client to discover which of the offerings is the best for him or her? The
    conventional approach is to have highly trained salespeople or agents who ascertain
    the client''s circumstances and make recommendations about the best plan to purchase.
    However, there are problems with such approach and financial institutions are
    becoming well aware of them. From the organization''s point of view, maintaining
    a highly trained salesforce is very expensive. Doing business through agents results
    in a loss of control over the delivery of services and is costly in terms of commission.
    From the customer''s point of view, dealing with a salesperson can be intimidating,
    and raises the suspicion that the investment they are sold may not be the best
    but the one for which the salesperson receives the highest commission.


    This problem about how to communicate effectively with clients and customers is
    not confined to financial institutions, although the dilemmas they face are particularly
    clear. Many government departments have to deal with what is essentially the same
    problem, offering many complex services to a public which needs help with selecting
    the right one, and in general they have not been particularly successful in overcoming
    it [Cordley and Gilbert, 1987]. The Department of Social Security (DSS), for example,
    but generally the DSS has had a problem in conveying the details of the very complex
    social security system to those who need to know.


    The contribution knowledge based systems can make is that they can provide the
    kind of personalized, detailed information that clients require, at modest cost.
    Clients could explore options with the computer, which would act as a indefinitely
    patient and knowledgeable advisor, deciding the decisions which have to be made
    to arrive at the correct choice of service [Gilbert, 1988b]. Paradoxically, the
    machine can provide personalized advice. Once a selection has been made by the
    client, the system could automatically arrange for the service to be delivered.
    For example, a knowledge based system for public use, sited in a bank or building
    society branch, could be used by an intending saver to select the appropriate
    savings plan for their own situation. When the customer had made a choice, the
    necessary administration could be completed automatically by the system sending
    an order to the bank''s central computer. In fact, trial systems of this kind
    have already been'
