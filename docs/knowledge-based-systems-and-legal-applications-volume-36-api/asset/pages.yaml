- pgno: 86
  md: '# CHAPTER 2


    # THE OPPORTUNITIES OF THE

    DHSS DEMONSTRATOR PROJECT


    Trevor Bench-Capon


    2.1. THE ALVEY DHSS DEMONSTRATOR PROJECT

    The Alvey-DHSS Demonstrator project was a large Demonstrator project,

    supported by the Alvey Directorate of the UK Department of Trade and

    Industry and the UK Science and Engineering Research Council. The

    project collaborators were ICL, Logica, Imperial College, and the Univer-

    sities of Lancaster, Liverpool and Surrey. Additionally the Department of

    Health and Social Security (DHSS), assigned several members of staff to

    work full time on the project. The project was intended to investigate the

    potential for the application of KBS techniques to large legislation

    organizations, of which the DHSS — later to become the Department of

    Social Security (DSS) — provides a prime example, being responsible for

    the administration of Welfare benefits in the UK. The project afforded

    unique opportunities for the exploration of the application of KBS to law,

    an in this chapter I summarize some of these distinctive opportunities,

    and the implications they had for the project.


    2.1.1. Size of the project

    The chief feature which distinguished the Demonstrator project from any-

    thing that had previously been attempted in this area was its sheer size,

    in terms of its duration and the number of people involved.

    Because it lasted for a long time — five years against the two or

    three years which is the more typical duration for such a project — it

    is possible to have a very substantial initial period of exploration before'
