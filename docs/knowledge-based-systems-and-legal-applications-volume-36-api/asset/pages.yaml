    # 9.4.2. The objectives of the Advice System


    Most expert systems have been designed for use by professionals who are able to
    bring both understanding of the domain and some knowledge of computers to their
    interaction with the system. In particular, they can be assumed to know what the
    system is designed to do and what its limitations are likely to be. These assumptions
    about the user have to be relaxed as far as possible in a system designed for
    public use. The implications of designing for the public include: the concepts
    in terms of which the knowledge is structured must be eitherhensible or translatable
    to such concepts; the system should be capable of answering the types of questions
    which the users will wish to pose, not just those which are easy to answer using
    conventional techniques; the structure of the interaction with the user ought
    to be one which feels comfortable and natural. In addition, special methods have
    to be used to obtain a clear understanding of the requirements of a system designed
    for public use, since there is no well-defined and small set of users to approach,
    as would be the case in more conventional systems.


    The primary purpose of the Advice System is to provide a wide range of types of
    information and advice of the kind that a trained welfare worker might offer.
    However it does not duplicate many of the other roles which advice workers take
    on, such as letter-writing and form-filling, advocacy and representation, giving'
