    # 1.9. LEGOL AND NORMA


    The LEGOL project was conducted by Ronald Stamper at the London School of Economics
    from the middle of the 1970s [Stamper 1976, 1977, 1980; see also Cook et al. 1981].
    Though LEGOL has now finished, Stamper — now at the University of Twente — has
    continued the same line of investigation and is currently developing a formalism
    called NORMA [Stamper 1986].


    # 1.9.1. Description


    The original motivation for the LEGOL project was to develop improved techniques
    for the analysis and specification of data-processing systems, and administrative
    systems more generally. Many such systems are based on legislation and other rules
    and regulations that govern organizations, and are designed to translate the requirements
    of these rules and regulations into processing tasks to be performed by humans
    and computers. Consequently, a central concern of the LEGOL project was the development
    of formal languages with the power to express these rules and regulations precisely.
    Since Stamper took legislation as his experimental domain, LEGOL and the later
    work on NORMA can be regarded as investigations into computational techniques
    for representing legislation.


    As some of its practical outputs, the LEGOL project developed several dialects
    of a language, each with its interpreter, which were capable of expressing an
    increasing variety of rules. These languages were applied to various examples
    including such areas as social security legislation, the law of intestate succession,
    degree regulations, order processing, and tax regulations [Stamper et al. 1982].


    The LEGOL language (in its executable dialects) was conceived as an extended relational
    algebra with special operators for handling time [Jones et al. 1979]. The language
    could be used to simulate the effects of legal provisions by executing a set of
    LEGOL rules which defined new relations by expressions of the relational algebra.
    Some versions of the language provided a set of conventional program control structures
    in addition: if-then-else branches, and iteration [Jones 1980]. Computation proceeded
    by executing the control structures and evaluating expressions of the algebra.
    A number of (unimplemented) extensions were also proposed to enable the language
    to handle such concepts as purpose, right, duty, judgement, privilege and liability
    [Stamper 1980].


    These are some of the practical outputs of the LEGOL project, but it must be stressed
    that Stamper''s main objectives are primarily theoretical: to address fundamental
    semantic questions, and to develop a methodology for analysing and representing
    legislation based on these. In the case of LEGOL, the representation of a fragment
    of legislation was'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# The Representation of Law in Computer Programs


    guided by an ‘epistemological semantic model’ [Stamper 1979] which was used to
    identify the entities, concepts and relationships present in the legislation.
    The semantic model was intended to ensure that a sensible correspondence exists
    between data structures and what they represent. A methodology for analyzing problems
    for the application of LEGOL, based on Stamper''s semantic model, is described
    in [Stamper et al. 1982].


    The emphasis on semantics continues in Stamper''s most recent work on NORMA. Stamper
    has long maintained that the classical approach to the semantics of (predicate)
    logic and other formal languages are inadequate for application to law, and has
    argued that alternative theories of meaning need to be adopted. [See Stamper 1989]
    for a summary of these arguments. For NORMA, Stamper has proposed a semantics
    which relates all signs — including the symbols used in the representational formalism
    — directly to the notions of agent, intention and behaviour [Stamper 1986].


    # 1.9.2. Commentary


    Because the executable versions of the LEGOL law were based on relational algebra,
    it is fairly straightforward to reinterpret LEGOL rules and control structures
    in logic programming terms [Sergot 1980]. This translation suggests an alternative
    way of computing with LEGOL rules. It frees the LEGOL language from the need to
    be embedded within an algorithmic programming language; and if the LEGOL rules
    are executed backwards as in PROLOG, it allows recursion to be expressed directly,
    a feature missing from the original LEGOL algebra. It also means that a set of
    LEGOL rules can be used for purposes other than simulating the effects of legal
    provisions. (This type of reconstruction is reminiscent of developments in the
    relational database field. An alternative way of allowing recursion to be expressed
    in transitive closure operator that relational algebras often now include.)


    A translation of LEGOL rules into logic programming gives an alternative way of
    executing these rules but does not address any of the fundamental issues investigated
    in the LEGOL project. It is the methodology by which these rules are identified
    and constructed, and the underlying semantic model especially, that are the central
    concerns of Stamper''s work on LEGOL and NORMA.


    The motivation for some kind of systematic methodology for analyzing and representing
    legislation is easy enough to understand, but it is impossible to comment in detail
    on Stamper''s semantic proposals here. Most approaches to the computer representation
    of law have little or no attention to (formal) semantics. To the extent that others
    have addressed semantics at all — I am thinking particularly of the use of logic
    programming techniques and McCarthy''s work on TAXMAN and the Language for Legal
    Discourse — they simply take the standard'
