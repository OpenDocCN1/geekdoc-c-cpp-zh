    characteristics of reasoning with legislation with a view to changing it, most
    notably that it is classes of people, not individuals, that are being considered,
    so that the cases cannot, even in principle, be specified to the level of detail
    which is typically required by an adjudication-oriented system, and because, in
    sharp contrast to adjudication systems, there is no clear direction to the reasoning,
    so that the question ''what are the characteristics of someone over pensionable
    age?'' is as likely to be asked as ''is someone with these characteristics of
    pensionable age?''. An assessment system, designed to answer the second sort of
    query, may not support answers to the first kind of question.


    The potential of a system for policy support is significant: the cost of mistakes
    at this point of the legislative process, both in terms of the tangible cost of
    correcting them they come to light, and in terms of the intangible costs of social
    conflict, hardship and inequality that can result from them, is so enormous that
    even a small improvement would be very effective. The problems that arise in such
    a context are also significant from an AI perspective, and are of a quite different
    character from those which occur in the more typical legislative applications.
    We mentioned four here.


    Firstly, the problems of producing and using formalization of legislation are
    at their sharpest here, since the legislation is part of the subject matter of
    this system: whereas an adjudication-oriented system can, if necessary, have recourse
    to an ad hoc workaround, provided that the system gives the correct answer, such
    a technique may be highly misleading in a system supporting formulation. Secondly,
    the problems here are natural ones for treatment using constraints rather than
    more simple-minded application of rules: constraint programming is becoming increasingly
    important, and this area can gain an exploration of its potential. Thirdly, it
    offers an opportunity to explore a style of reasoning not encountered in other
    AI application areas. Fourthly, the policy process involves many tasks and there
    are significant challenges in producing an of the various tools that the system
    must provide into a usable system, especially one which must be used in a group
    working environment. The area, therefore, has considerable interest for the AI
    specialist as well as having practical potential.


