- pgno: 269
  md: '# Knowledge Representation for Legal Applications


    These arguments are of a quite different sort. The first is an appeal to the convenience
    of the notation used in representation: if one accepts that it is lawyers who
    should build these systems, and one believes that lawyers would find a particular
    style of representation congenial, then the argument holds. It does not, however,
    claim that existing paradigms are inadequate, but rather that there are pragmatic
    advantages in a specialized representation. McCarthy''s argument is deeper, in
    that it claims that existing paradigms are inadequate. McCarthy''s argument is
    a more general form of the widely held view because much of law is concerned with
    the creation of rights and duties, the representation of norms must be central,
    and hence some form of deontic logic is a *sine non*. For a helpful discussion
    of this see [Jones 1989]. The issues arising from the claims about the adequacy
    of representing these structures is yet unresolved. Attempts have been made to
    represent some of the categories put forward by McCarthy in first order predicate
    calculus. For an example of the treatment of deontics see [Moore 1980]; for an
    example of the treatment of temporal matters see [Kowalski and Sergot 1986] and
    the brief discussion of the issues towards the end of this chapter. Others would
    claim that the need for all of these categories is not proven for all legal KBS;
    for specific discussions of this with regard to deontics see [Sergot 1985] and
    [Bench-Capon 1989]. More work is needed on these issues before useful conclusions
    can be drawn.


    One further feature of legal knowledge, not much discussed in the literature,
    which seems of prime importance is the role of definitions in legal knowledge.


    # 12.5. DEFINITIONS


    It has been noted in [Sergot 1985] that: substantial amounts of legislation are,
    or can be taken to be, essentially different in nature. Much legislation can be
    viewed as a high-level specification of some legal relationship or property.


    This is entirely true for a good deal of the social security legislation formed
    the basis of the DHSS Demonstrator systems, and has been observed elsewhere in
    such diverse areas of the law relating to nuisance, discussed in [Schildt 1989],
    and Netherlands Dismiss law, treated in [Koers et al. 1989]. The definitions found
    in legislation are an essential part of a legal KBS is now universally accepted.
    These definitions may not be the only knowledge required for a system, although
    systems (e.g. [Sergot et al. 1986b]) have been built which contained only this
    knowledge. Because much of the knowledge to be represented consists of definitions,
    however, we need to be aware of the differences between analytic statements, which
