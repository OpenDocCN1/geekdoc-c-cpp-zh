    using the queries. In P1 and P3 we tried to ensure that no response contained
    more than 10 or 15 propositions. The pressures to keep knowledge bases small and
    the lack of requirement to build a large knowledge base meant that the policy
    application did not feel it to use the knowledge building methods employed by
    the local office team. Knowledge building for policy tended to be by one or two
    people intensively intensely a fairly short period (two to four weeks). This proved
    satisfactory for P0 and P1 but for P3 caused some problems. The knowledge base
    builders for P0 and P1 were experienced people with an understanding of the logical
    formalism, legislation and conceptual modelling. The builders of the P3 knowledge
    base were relatively new to the project and had no previous experience in knowledge
    building, legislation or logic. It may have been beneficial to have such inexperienced
    people with methods and tools similar to those used by the local office team even
    for building such a small knowledge base. However, it is more likely that training
    in conceptual modelling, logic and knowledge encoding would have been more advantageous.


    # 8.5. ADDITIONAL EXPERIMENTAL DEVELOPMENTS


    # 8.5.1. The reason for experimental work


    It is clear that P3 is still a long way from providing the range and level of
    support for policy making that we can envisage. Throughout the project we deliberately
    kept the range of support at which we looked as narrow as we reasonably could.
    In particular, we excluded work on network-working, access to external databases,
    statistical processing, numerical modelling and knowledge-base capture and maintenance.
    Instead, we centered on understanding the process of policy-making and on making
    the support that we offer as deep as we can. Nevertheless, we did not achieve
    all that we had hoped for in this narrower range. To supplement the work on analysing,
    designing and building the prototypes, therefore, we undertook a small amount
    of speculative or experimental work where we thought there might be a chance of
    illustrating'
