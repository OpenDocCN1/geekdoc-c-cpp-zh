    # 9.3.4. Evaluation


    The Forms Helper was evaluated by the ICL HCI Laboratory, Bracknell, under the
    supervision of the DSS. Twenty subjects, recruited from a local employment agency,
    were asked to complete both a paper income claim form and the electronic version,
    using a split-half design in which some subjects used the Forms Helper first and
    then filled in the paper form, while others completed the paper form first and
    then tried the Forms Helper. The task was explained to the subjects, but no training
    was given. Their use of the Forms Helper was videoed and the tapes were analysed
    to identify any problems they encountered. A short attitude questionnaire was
    also administered to the subjects.


    The results of the study showed a high level of acceptance for the idea of computer-based
    forms [Ottley et al. 1988]. Most users became confident of their ability to manage
    the technology, finding the system easy to use once they had got over their initial
    anxiety. They felt that the electronic form was easier to complete than the paper
    form. A number of small changes were suggested by the evaluation and the majority
    of these were incorporated into the final version. The study concluded that this
    type of system may well be acceptable to the general public in the right kind
    of environment.


    The DSS also conducted an internal study of the costs and benefits which might
    accrue if the Forms Helper were to be installed in DSS local offices, providing
    clients with income support forms (but not for claiming other benefits) during
    office hours only. Making reasonable assumptions about hardware and maintenance
    costs, it was estimated that even this limited use of the system could save the
    DSS a very substantial sum, as well as providing a facility which would be welcomed
    by many social security applicants.


