    # 11.6. CONCLUSIONS


    A variety of analyses were undertaken. A variety of strategies for developing
    knowledge bases were adopted. The domain knowledge-bases which came into being
    each had its own character although the language for their formal expression was
    the same. This breadth of experience has been a strength of the project, allowing
    a number of lessons to be learned.'
