  img_proc: true
- pgno: 41
  md: '# 24 The Representation of Law in Computer Programs


    will be able to identify the relevant legal sources, and extract from them an
    unambiguous (though not necessarily precise) reading of what legal rules are currently
    in force.


    The previous section emphasized the range of factors, beyond a knowledge of the
    formal sources of law, that can influence the outcome of a legal case. In principle,
    there is no reason why an algorithmic representation of the law could not encompass
    the effects of ''stimuli'' and ''personalities'' as well as ''paper rules'', but
    in practice algorithmic representations of law are largely used for modelling
    the effects of ''paper rules'' (decided upon fixed in advance).


    It follows that such programs are necessarily limited. They cannot address every
    aspect of the legal decision-making process, and simplify those effects which
    they can claim. One should conclude immediately that such programs have no practical,
    or theoretical, value. If a legal case falls at first sight within the provisions
    of a particular statute, then sooner or later it will be necessary to examine
    the effects of applying the statute, where one is only part of a wider analysis
    that takes other factors into consideration as well. And if the statute is complex,
    then drawing upon a flowchart or executing an algorithm might be a useful aid
    in this examination. (This is precisely Twining and Miers have in mind when they
    suggest that flowcharts can be useful. This suggestion appears in a book whose
    main theme is that legal rules are not fixed, but have to be applied with flexibility
    and a proper regard for other considerations if nonsensical conclusions are to
    be avoided.) A suggestion that fixed ''paper rule'' representations can imply
    that there is no need to consider other factors as well. Such programs are intended
    to help in the analysis of a case, by temporarily disregarding the influence of
    all other factors that might have a bearing on the outcome. They are normally
    constructed for use on their own, but they might well be incorporated as components
    of a much bigger representation, as in Michaelsen''s TAXadvisor where one (implemented)
    module is used to calculate tax liabilities as required by the more ''expert''
    parts of the system.


    A question to consider is whether these ''paper rule'' representations could be
    used not just as aids in legal analysis, but also to take legal decisions themselves,
    autonomously.


    It was remarked in the introduction that litigation and the resolution of legal
    disputes account for a tiny fragment of the activities that take place every day
    within the law. In the day practice of law, most tasks are routine. They are performed
    by mechanically applying what is generally accepted to be the ''law''. Here, Frank''s
    R x F = D equation is a reasonably accurate summary of how the law is actually
    used.


    There are many different schools of thought in legal philosophy and'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Legal Applications of KBS


    the jurisprential literature is dominated by arguments over the true nature of
    law and legal reasoning. But the fact that most everyday legal problems are solved
    by applying Frank''s R x F = D equation has not gone unnoticed. Susskind [1986a;
    see also 1986b] points out in his jurisprential enquiry that legal philosophers
    argue most about the processes by which difficult legal problems are, or should
    be resolved. It is hard legal problems which interest legal philosophers and which
    account for the bulk of writings on jurisprudence. But there is a general consensus,
    in every school of legal philosophy, that easy cases are solved every day by simply
    applying recognized legal rules to the facts of the case. Susskind''s research
    has established that there is this consensus. It would surely be surprising if
    there were not.


    In the light of this discussion, data-processing systems apply legal or quasi-legal
    provisions in a routine and mechanical fashion. Since they decide cases autonomously,
    it follows that they are based on the implicit assumption that all the cases to
    be processed will be easy. Few people would regard the introduction of a computerized
    payroll system as automatically deducts tax contributions and other payments in
    accordance with tax and related legislation. This is because the task is mundane
    and routine, and all the cases are easy.


    It does not follow that all routine and mundane tasks within the law could be
    similarly automated. There are very few areas of the law where it is possible
    to assume that every case which arises will be an easy case. Consequently, there
    are very few areas of law where it is acceptable or feasible to introduce computer
    programs that will decide cases autonomously. Almost without exception, computer
    programs can only be used to help in the analysis of legal problems. And it must
    be stressed that every single point I have just made applies whatever computational
    formalism is used to represent the law.


    Of course all begs a fundamental question, since it is not clear what ''easy''
    and ''hard'' mean exactly. Jurisprudence gives little practical guidance. Some
    suggested heuristics for how a computer program determine whether a given legal
    case is easy or hard are examined in section 1.15.2 where the work of Anne Gardner
    is described.


    Most descriptions of legal analysis programs (of whatever kind) do not state explicitly
    the assumptions on which these programs are based or the purposes for which they
    are intended. This has led to occasional misunderstandings.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 1.7.6 Criticisms


    Philip Leith [1986a] has argued for the rejection of legal ''expert systems''
    that represent only ''paper rules''. In a modified version of the same paper he
    concentrates his attack on the use of logic programming techniques specifically
    [Leith 1986b]. However, many of these criticisms apply equally to the approaches
    described in this section, and the questions Leith raises are, therefore, examined
    here.


    Leith''s central contention is that basing a computer system on ''paper rules''
    alone is equivalent to claiming that legal problems are resolved by mechanically
    applying ''clear legal rules''. As Leith points out, such rules are fictional:
    there is more to legal decision-making than applying the R x F = D equation, because
    the sources of law support different interpretations, and are subject to unstated
    exceptions, and are open to judicial manipulation, and because there are many
    other factors which need to be considered besides rules. Leith concludes that
    to consider only the effects of ''paper rules'' is tantamount to a fundamental
    misunderstanding of the true nature of law.


    One interpretation of Leith''s argument is that any system which represents only
    ''paper rules'' simplifies the law to an unacceptable extent that the system has
    little or no value in legal analysis. This criticism would ignore whatever computational
    formalism was employed. It is surely well established, by observing common legal
    practice and by examining the jurisprudential literature, that simplified ''paper
    rule'' representations can have legitimate and valuable uses, and that there are
    occasions when R x F = D is an accurate model of how the law operates.


    A weaker interpretation of Leith''s argument is more tenable. The programs we
    have been discussing simplify the legal decision-making process. While the authors
    of such a system may be aware that their programs can address only one aspect
    of a complete legal analysis, it is not necessarily the case that the users of
    these programs are aware of these limitations too. In other words, there is a
    danger that users will overestimate the value of the analysis they obtain from
    such a program. When Twining and Miers show that flowcharts can help in analysing
    a set of legal provisions, they presumably imagine that such a flowchart will
    be constructed by a lawyer for his own personal use. But the user of a computer
    program will often not be its author.


    Leith has directed his attack at ''expert systems'' and logic programs. An interpretation
    of Leith''s argument, and possibly the one he intended, is that this danger is
    substantially increased when a legal analysis program is labelled ''expert system''
    by its authors or its users, or when its conclusions are referred to as ''logical
    consequences''. If this is Leith''s point then he is surely right. While there
    is always a danger that users of computer programs will place too much confidence
    in the output they'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Legal Applications of KBS


    obtain, it is very much easier to be seduced by a program which is sold (metaphorically
    or literally) as an ''expert system'' or whose conclusions are advertised as ''logical
    consequences''. I referred to the introduction to unacceptable connotations of
    the term ''expert system'' and this is just such an instance.  ''Logic consequence''
    is a technical term with a very precise meaning but even technical terms can be
    used responsibly.


    Where I would disagree with Leith is in his implied suggestion that many accounts
    of work in this area refuse to acknowledge the limitations of their approach,
    intentionally or out of ignorance of the true nature of law. Certainly there have
    been released commercially with an irresponsible lack of concern for accuracy
    (''legal expert systems'' [Susskind 1987] for a discussion). However, the general
    impression is that investigators of projects to construct representations of law
    (in whatever form) are aware that their systems are limited to addressing one
    aspect of legal analysis out of many. Most of the longer descriptions of projects
    begin with some discussion on the nature of law (and this paper is no exception).
    Shorter reports omit this background material, presumably because the authors
    have wanted to report on details of their programs, and have assumed other investigators
    in the field share their objectives and presuppositions.


    Leith''s criticisms serve to underline the importance of making users aware of
    the limitations of the programs they use. This will always involve explaining
    to users what a program can and cannot do, and what aspects of legal analysis
    it is designed to support. But it also means that programs which can make explicit
    the assumptions on which their conclusions are based are generally to be preferred
    to programs which cannot. A major disadvantage of formalism described in the algorithmic
    approaches described in this section of law in the procedures which manipulate
    them is their lack of transparency. They tend to bury their representations within
    formalisms. Other computational formalisms are better suited to separating out
    the underlying representation of the law and keeping this explicit. Some projects
    that have employed these alternative formalisms are described next.


    # 1.8 EXPLICIT REPRESENTATIONS OF LAW


    The algorithmic approaches described in the previous section construct implicit
    representations of the law which are buried in the procedures that apply them.
    This section gives examples of projects which have used computational formalisms
    that enable an explicit representation of the law to be separated from the procedures
    that apply it. There are two main motivations for employing this kind of formalism:
    to ease the task of constructing the representation itself, and to provide a system
    which allows its representation to be assessed for accuracy and can provide some
    justification for the conclusions it produces.


    The two types of formalism described in this section are rule-based'
