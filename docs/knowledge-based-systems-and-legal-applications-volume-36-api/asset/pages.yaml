- pgno: 154
  md: '# PART III


    # PROTOTYPES


    Part of the value of the contributions to this book is that they are firmly grounded
    in the experience of building systems in the areas they describe. The authors
    both look back on their experience and look forward to what they would give the
    benefit of this experience. It is therefore important to detail exactly what the
    systems that were built, and it is the function of the chapters in this part to
    provide this information.


    Before the Demonstrator project started there was a period of feasibility study
    in which a variety of areas for KBS support for DHSS were considered. In the early
    days of the project itself, teams were set up to pursue five of these areas. One
    team looked at for the formulation of legislation, and they produced a series
    of prototypes, known collectively as the ''policy application''. This series of
    prototypes is described in the chapter by Graham Storrs, who led the policy team
    during the second half of the project. This was a particularly challenging application,
    since there were no existing systems to serve as models. In a real sense this
    work defines a new area for KBS in.


    A second team, based at the University of Surrey, was charged with looking at
    how KBS could support members of the public. In the first half of the project
    they developed a system capable of assisting a claimant to complete a claim form
    — a necessary but often difficult stage in the claiming process. In the second
    half they developed a system to advise people on what they could claim and how
    to go about it.'
  merge: -1
