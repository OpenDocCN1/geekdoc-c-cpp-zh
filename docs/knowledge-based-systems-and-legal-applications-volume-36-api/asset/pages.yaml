    # 9.5.2. Word incorporation parser


    There are points in the dialogues between the user and both the Advice System
    and the Forms Helper where the user is asked for a date or a sum of money. We
    decided that we should allow users to input dates and amounts of money in any
    reasonable format, rather than forcing them to abide by some predefined style.
    This meant that these systems had to incorporate a parser capable of taking user
    inputs in many different formats and converting them into a standard one. Our
    first attempt used a chart parser, but this was found to be much too slow, taking
    three to five seconds to parse a single input. A second parser was built, based
    on a technique known as ''word incorporation-poration'' ... This took between
    half and one second to parse a date, an acceptable response time. The parser used
    a grammar and dictionary which was developed to recognize inputs such as the following:
    25th dec ''86, 25/12, the 25th of December 1967, thirty pounds, 35.00, three hundred
    and sixty five, 365, three hundred and 65, and don''t know.'
