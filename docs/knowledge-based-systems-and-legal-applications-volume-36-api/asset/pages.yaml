  md: '# KBS Applied to Law


    drawn almost exclusively from the level of legislation, whereas that represented
    in the Latent Damage Advisor of Capper and Susskind [1988] is to be found at the
    level of operationalisation, and mapping to the facts of a case. From the model
    we can see that a system intended to operate within a given level needs to represent
    the knowledge of that level, but need not represent knowledge from any other level.
    Thus the normalization system of Allen and Saxon make no reference to knowledge
    beyond the statute itself, although the user of the system will need to supply
    certain elements of judgement to clarify the logical structure of the statute
    when using the system. In contrast any system intended to support a transformation
    between levels, such as the Latent Damage Advisor, will need to represent knowledge
    at the two levels between which the transformation is to take place. The British
    Nationality Act representation, which was designed without any clear notion of
    a task to support is a different case, to which I shall return briefly later.
    The question arises as to whether there are any gains from including knowledge
    from other levels; for example there will be gains from any representation of
    legislation in a system designed to apply the law and hence concerned with operationalization.


    This kind of question arose frequently during the course of the Demonstrator project.
    In practice it is the case that the adjudicating officers rarely ever consider
    the legislation of Allen or the reported decisions as against the summary of these
    materials which can be found in their handbook. This being so, it was widely held
    that it would not be necessary to represent the underlying legislation at all
    in a system designed to support adjudicators. Indeed this is the approach of the
    Latent Damage Advisor. While the model answers the question as to why the adjudicators''
    handbook would not support the policy application, since it is concerned with
    a different level altogether, it does not explain why it is by itself adequate
    to supply the knowledge needed for building an adjudication system.


    The answer to this lies not in the performance or capability of the system, but
    rather in considerations relevant to the on-going practical use of the system.
    Consider the legislation relevant to a relatively unimportant benefit, Category
    C Retirement Pension.


    The UK Social Security Act states —


    39(1)Subject to the provisions of this Act


    +   (a) a person who was over pensionable age on 5th July 1948 and satisfies such
    other conditions as may be prescribed shall be entitled to a Category C retirement
    pension at the appropriate weekly rate.


    To interpret this we need also to bear in mind:


    27(1)In this Act ‘pensionable age’ —'
