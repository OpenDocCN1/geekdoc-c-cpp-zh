  md: '# Mixed Initiative Interaction


    mixture of initiative in the interaction of the Advice System on various levels,
    the user having the initiative to ask questions, the system taking control in
    order to find an answer and the user taking the initiative to ask another question.


    In fact, we have designed the interaction of the Advice System to restrict the
    number of levels to three. It is technically feasible for the system to handle
    an arbitrary number of questions, but we felt users may not be able to relate
    answers to the questions. If the user asks a second question while the system
    is answering another one, and the system cannot answer it immediately (i.e. without
    asking further questions) it holds over the second question until later. The user
    is then given the opportunity to ask the ''held-over'' question again.


    The interaction between the user and the Advice System is not just a series of
    questions and answers. Both parties can make statements. A user can volunteer
    facts about himself or herself and the system can inform the user of facts it
    has deduced in the course of answering the user''s question. It is possible to
    hold the floor and make several statements. Borrowing terms from conversation
    analysis [Levinson, 1983]; a turn consists of several turn units (TCUs). Each
    TCU can either be questions, answers or statements. They need not be just about
    the topic of the conversation (substantive) they may also be about the conversation
    itself (meta). Although a turn may be constructed from combinations of questions,
    answers and statements, there are constraints on which combinations are possible.
    These are described in [Frohlich and Luff, in press].


    Local mixture of initiative


    When users have the floor in the interaction they can either construct a TCU and
    give a turn to the system or they can construct a TCU and then try to keep hold
    of the floor. These two possibilities are signalled by selecting different terminators
    to the utterances. Asking a question always gives a turn to the system. Selecting
    the question mark terminator will always give the turn away. When answering a
    question or making a statement users can either select a ''...'' terminator to
    hold onto the floor or select a full-stop or ''OK?'' terminator to give the turn
    away. These devices are explained further in [Frohlich and Luff, In press]. The
    system has a similar way of passing turns. If it has to say more it completes
    an utterance with a ''...''. If it does not it ends its statement or answer with
    a full stop. With the user, the system asking a question automatically gives the
    turn away. The user is given a turn when the system ends its utterance with a
    full stop or a question mark.'
