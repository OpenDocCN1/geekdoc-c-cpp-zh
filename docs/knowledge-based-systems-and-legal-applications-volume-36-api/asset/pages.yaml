  img_proc: true
- pgno: 325
  md: 'This study, which was completed in December 1989, concluded that the approach
    showed considerable potential but its final recommendations unknown at the time
    of writing. It is expected that further development may be commissioned.


    # 14.6. CONCLUDING REMARKS


    In the DSS policy function we have encountered a rather unusual instance of group
    working. The particularly odd thing about it is that the ''group'' is widely dispersed
    in space and time. Yet it is a problem which calls for the bringing together of
    a great many people with a wide range of expertise and with widely differing perspectives.
    The particular methods that the DSS have employed to use such groups is itself
    interesting and effective.


    Our proposed computer support for this function has, as far as possible, preserved
    the advantages of the current practice. The main technical difficulties we have
    had to overcome were in the development of a suitable model of the policy process
    and in finding a computer-manipulable and yet usable, standard language for the
    core of the policy worker''s task the creation and manipulation of arguments.
    We currently have a prototype system encompassing all of the types of support
    discussed above which was demonstrated at the end of the project in April 1989,
    which had been evaluated by the DSS in the three months prior to that deat [sic]
    and has now undergone a subsequent nine month evaluation in the DSS.'
