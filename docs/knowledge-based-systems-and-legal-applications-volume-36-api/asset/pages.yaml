  md: '# CHAPTER 14


    # GROUP DECISION MAKING


    Graham Storrs


    # 14.1. POLICY MAKING WITHIN THE DSS — THE NATURE OF THE PROBLEM


    It is with the policy system that we are particularly concerned in this chapter
    as it is only in this application that a significant amount of group working needs
    to be catered for.


    The DSS is a very large organization with about 93,000 staff administering roughly
    five million claims each year from approximately 500 offices around the UK. There
    are great many people involved in monitoring and formulating policy on behalf
    of the minister in central policy branches and the regional directorate. In the
    policy branch concerned with formulating the policy for income support, one of
    the main social security benefits, there were as many as 300 people involved.


    Most of the day-to-day work of a policy worker involves the explanation of policy.
    Queries about the way the legislation is working or the justification for legislation
    arise as a result of questions being asked in Parliament, from pressure groups,
    from concerned individuals, or from reviews within the policy branches themselves.
    Typically, such queries


    An earlier version of this paper was presented at the First European Conference
    on Computer Supported Cooperative Work, London, September 1989.'
