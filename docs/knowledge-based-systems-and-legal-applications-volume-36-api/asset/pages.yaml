- pgno: 118
  md: '# Legal Applications of KBS


    components each covering different aspects of the overall policy process, but
    which are dynamically linked and in effect developed in parallel with each other.
    The three components are:


    +   1. Defining the context of the argument — in which the policy makers lay out
    the situation as they see it now, identifying the major issues and possibly including
    initial thoughts on potential changes.


    +   2. Developing detailed arguments — where the specific issues and options identified
    in the first stage are considered in more detail, developing arguments and counterarguments
    for particular cases.


    +   3. Rationalisation and commitment — where the policy makers evaluate the suggestions,
    comments, and alternative options directed at by their colleagues and reform the
    arguments to appear in what they consider to be the most appropriate light.


    Any of these three may involve reference to specific issues, options and their
    implications, at varying degrees of precision. In turn, they impose additional
    requirements in terms of:


    +   1. Explanation of the problem or issue in terms of the previous policy commitments
    and the importance of any particular policy aims in determining the earlier course
    of the policy.


    +   2. Policy justification in terms of presenting the strongest arguments to
    support the chosen policy.


    # 4.2.3. Types of knowledge used in policy


    The explicit knowledge used by policy makers (i.e. that over and above the tacit
    knowledge about the policy process and acceptable procedures acquired through
    experience, and the ‘ordinary knowledge’ of the world) has a variety and extensiveness
    which it is difficult to characterize in any simple structured way. In general,
    however, the knowledge relates to the following three questions:


    +   1. What are the political aims, priorities and expectations, and what associated
    constraints do they imply?


    +   2. What are the needs of the priority client groups?


    +   3. What Policy actions are possible/feasible?


    Knowledge associated with the first of these centres around existing and planned
    political commitments, the particular aims and priorities of ministers, financial
    constraints and the characteristics of the priority client groups who give them
    this priority. Mistakes associated with errors in this knowledge would result
    in the proposal of inappropriate options to the minister and thereby a failure
    in the essential objective of the policy process. The knowledge involved necessarily
    extends across all areas of policy while being focused on the particular benefit
    and area under consideration.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Knowledge associated with the second includes both the socio-economic information
    and the knowledge of legal conditions and their application to the classes of
    ''real world'' individual. Socio-economic factors include statistical information
    from surveys or the Department''s own sources. They are particularly important
    in identifying the cost implications of any policy options. Knowledge of the legal
    conditions is necessary in order to identify and understand potential traps, whereby
    people who ought to be entitled to benefit are excluded by any anomaly or conflict
    of legislative conditions, as well as helping to appreciate the particular treatment
    of types of person within the existing legislative provisions.


    Knowledge of the third type includes:


    +   1. The mechanisms made available by the legislative framework, including the
    feasibility of targeting the policy to the high priority groups while minimising
    the unintended knock-on effects, the feasibility of operationalising the legislation
    within the administrative structure, and the enabling powers provided by the legislation
    defining what actions secretary of state can do and cannot perform.


    +   2. Administrative and operational possibilities, along with the associated
    costs of implementing the administration of the policy, and including the knowledge
    of procedures required for approving and committing resources to a policy (e.g.
    its passing by advisory and parliamentary committees).


    +   3. Theories of cause and effect in determining the efficacy of certain actions
    (e.g. whether the raising of a benefit rate by a certain percentage will affect
    the up rate for that benefit).


    This variety of knowledge required by the policy process is not the only source
    of complexity. The scope of the knowledge required, in terms of its breadth, depth
    and completeness can be similarly intimidating. In terms of the breadth of knowledge
    required, any individual policy maker with direct responsibility for an item of
    policy development will usually have responsibilities covering a limited group
    of policy issues, with emphasis on one body of legislation — for example, housing
    benefits or disability benefits. Frequently, however, any policy development will
    raise issues that extend beyond this boundary having potential impact on other
    benefits and so on on the work of other policy staff. In a significant number
    of cases, this boundary extends across government departments and sometimes raises
    additional issues concerning European legislation. In principle, therefore the
    policy maker has be concerned with aspects of the whole of the legislation emanating
    from his own department, potentially that of other departments, and, where applicable,
    that of the Euro-Community.


    Turning to the depth of knowledge required, the major concern of the policy maker
    is again with the general concepts of the legislation'
