    project, also meant there was no clear, single, vision of the systems that should
    be produced. Whatever the balance of advantage, the fact remains that the Demonstrator
    provided a unique context in which to tackle the problems of AI and law. The remaining
    chapters represent the extent to which the opportunities were grasped.
