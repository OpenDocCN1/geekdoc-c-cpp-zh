  md: '# Legal Applications of KBS


    205


    # 10.5. THE PROJECT proved a contentious issue.


    Documentation proved a contentious issue. Management pressed for based stan- dards
    and the recording of documents in a common computer sys- tem to be accessible
    to all project members. Investigators pleaded that their work was not yet fit
    to be published or so that no-one else could possibly be interested, or they claimed
    that the system pro- vid was too difficult to use or did not support their favourite
    document preparation system.


    Over four hundred AlVNs and seven hundred PDFs were deposited in the two systems
    over the five years of the project but it is certainly true that the system was
    of more use to the management of the project than to most of its members. This
    was partly due to ''technical'' probs and partly to personal attitudes. Earlier
    provision of improved quali- ties and training would have helped but would not
    have eliminated the attitudinal problems, and so the onus was constantly to management
    press for it and to ensure that obstacles were removed quickly.


    # 10.6. PLANNING


    Naturally, the steering team required the project to provide a fairly detailed
    plan showing how the project expected to spend the considerable sums of money
    that the collaboration was investing and to show as each quarter passed how the
    plan had been followed. Preparing the plans and reporting against them was one
    of the major activities of the management team.


    Planning the work of the project was particularly difficult in the early years
    when effort was concentrated on investigating the user organi- zation and its
    problems and exploring the KBS state of the art and disc- covering what it could—
    and could not— do. These difficulties applied not only to the need to make plans
    at this stage but also to the need to adhere to them. The academic partners particularly
    felt restricted by the demand that they deliver predefined results by a pre-agreed
    date.


    Most of the staff found difficulty in defining their ''milestones'' in the early
    stages. Similarly, the concept of ''dependencies'' was alien and res- tricking
    to the investigators, thus undermining the basic principles of net- work building
    planning.


    Considerable difficulty was encountered in gaining mutual under- standing the
    nature and strength of the commitments undertaken and the need to determine in
    advance the work required to create those demonstrations. Attempts to get team
    leaders to produce plans for cen- tr recording and publishing met problems in
    the lack of common nomenclature and notation. The tools initially used also proved
    a further hindrance as they ran on hardware only available to the group in Man-chester.


    Progress reporting remained a problem throughout the project'
