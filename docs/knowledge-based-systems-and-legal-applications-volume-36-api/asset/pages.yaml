    If we move from the construction of the knowledge base to its testing, we find
    again that the legal domain has some special characteristics. It is a significant
    difference in legal applications that the answer produced by a system is of less
    importance than the means used to arrive at the answer. Almost all workers in
    the area have noted this feature with respect to the role played by explanation.
    Most domains aim at allowing the user to invest some confidence in the answer,
    or to assist the system builder in debugging the knowledge base when a wrong answer
    is given. In a legal expert system in contrast, the method of arriving at an answer
    is of more importance than the answer itself, it needs to correspond to a potentially
    successful legal argument, and to be available to the user so he can strengthen
    or counter the points made depending on the side he wishes to argue. The user
    of a legal KBS wants to know how to win this point is not just that he ought to
    win it. This force of clause is not, however, connected to explanation, but also
    affects the knowledge representation: the conclusion must be demonstrably sound
    on acceptable legal reasoning the knowledge used in the system must also be demonstrably
    sound. How is such a demonstration to be achieved? Unfortunately it cannot be
    done by running sets of test cases through the system, but only by an actual scrutiny
    of the knowledge base itself. Which means that the knowledge base has to be in
    a form which is accessible to the expert who can assess its correctness, and to
    be structured in a way which corresponds to the sources from which it derives.
    Of course, the representation will be a paraphrase legally unacceptable in general:
    nonetheless the closer the represented knowledge to the source, the more acceptable
    and capable of validation it will.


