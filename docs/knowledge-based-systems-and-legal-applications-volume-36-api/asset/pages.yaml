- pgno: 266
  md: '# Legal Applications of KBS


    # 12.3. ISOMPHISM TO LEGISLATION


    In the previous section we stressed the need to make the represented knowledge
    correspond to the structure of the represented source. In this section we some
    of the implications of this for a knowledge representation formalism is examined.


    There should be identifiable items within the knowledge base which correspond
    to the items found in the legislation. If working within a rule based paradigm,
    this would ideally mean something like a single rule to express the content of
    each regulation, definition, etc. The need for isomorphism requires the syntax
    of rules to be sufficiently expressive to allow this one to one correspondence.
    Furthermore, the internal structure of a rule should map clearly onto its representation
    in the legislation clauses should follow in the same order, linked by the same
    connectives. Neither of these conditions is fulfilled by PROLOG-style formalisations
    — for example, a definition of the form:


    S1 A person shall be P if, and only if, he is Q or R and S would be represented
    by the two Horn:


    ```

    HC1 p(X): q(X).

    HC2 p(X): r(X), s(X).

    ```


    Leaving aside the problem that one part of the biconditional in S1 is represented
    by the treatment of negation as failure within this paradigm (defended by Kowalski
    (1989)), this has done some violence to the form of the original statement. HC1
    and HC2 in fact translate


    +   S2a A person shall be P if he is Q

    S2b A person shall be P if he is R

    S2c No person shall be P unless he satisfies the conditions in S2a and S2b


    Whilst S1 and S2 are logically equivalent, there may well have been a motive in
    choosing to express the conditions for P-ness in the form of S1 rather than S2.
    Moreover, neither HC1 nor HC2 can properly be considered in isolation. Several
    of the motives for isomorphism, particularly considerations deriving from ease
    of representation and scrutiny for validation are lost by the need to translate
    into a normal form. This may of course, be seen as no more than syntactic sugar,
    but the practical considerations strongly suggest this sweetening should be provided.


    The issue of grain size of predicates within rules is also important. Consider
    the following example from [Bench-Capon et al. 1987], which discusses the appropriate
    representation of Regulation 6 of the Conditions of Entitlement Regulations (relating
    to a now defunct benefit, supplementary benefit). The regulation states:'
