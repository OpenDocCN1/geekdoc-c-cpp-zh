    the first level of appeal are carried out by lay people, and it is only at the
    highest level of appeal that qualified legal representation is used.


    # 2.2. A CONCERTED APPROACH TO A VARIETY


    # OF APPLICATIONS


    Perhaps the greatest benefit of the size of the project was that it enabled several
    different areas of application to be pursued within the framework of a common
    project. In a small project there must inevitably be a focus on a specific area,
    and so there can be no scope to explore the relationship between various applications
    that may exist in an organization. This is a practical concern of the highest
    importance since it must be recognised that any large organization which has a
    use for a range of knowledge based systems will have a co-ordinated approach to
    their use. While small scale pilots and experimental systems can be developed
    pieal, the routine and practical exploitation of the techniques require that the
    various developments coher as much as possible. The scale of the Demonstrator
    mean that consideration could be given to the range of needs of the whole organization
    With this in mind the project operated by constructing several applications to
    support different areas of the organisation''s activities, so as to gain insight
    as to how, in a real implementation, KBS might be produced in such a way as to
    allow the various systems within an organization to be mutually supportive. This
    approach also allowed comparison between the various applications to be made:
    one important question for KBS and law is the extent to which the nature of the
    task which the KBS is designed to support the nature of the KBS. Where a project
    is producing only a single system it is extremely difficult to get a handle on
    the answer to this question, but members of the Deonstrator, several of whom were
    engaged in producing more than one of the applications, or in producing tools
    to support several applications, were very well placed to see what sort of impact
    the task had on the system. Thus the project was able to supply a reasoned basis
    for consideration of how the nature of the area of application affected the nature
    of the supporting KBS: where where it was strictly necessary for the applications
    to diverge as well as what parts could be shared.'
