- pgno: 92
  md: '# PART II


    # TASKS


    If we consider people whose work is related to law, we can see that they are engaged
    in a variety of tasks. In the legal system as a whole, judges, barristers solicitors
    and their clients all have different parts to play. Inside DHSS there are people
    who are responsible for formulating and justifying legislation, others who apply
    the law in particular cases, and others, not necessarily employed by the Department,
    who advise people on what they may be entitled to claim. All of these people may
    ultimately deal with the same legislation, and they exhibit very different skills.
    A policy maker may not be able to adjudicate cases effectively, an adjudicator
    may not be the best person to advise you on benefit entitle-, and an advice worker
    may lack the attributes of a policy maker. The question therefore arises as to
    what extent the tasks which a KBS is designed to support influences the design
    of the system. At one extreme, perhaps implied by Sergot et al. [1986], is the
    view that since all these tasks are grounded on legislation a single executable
    formalization of the legislation could serve to support all of them. A less extreme
    position, expressed in [Bench-Capon et al. 1987], is that support systems for
    the various areas would have a common core, but require individual elaboration
    to be useful. At the other extreme it might be argued that the differences in
    the expertise required for the different tasks inevitably necessitate completely
    separate systems. Certainly the nature of the support that is required is very
    different, and this may well have deep implications for the knowledge to be represented,
    and the way in which it is represented.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'In this part, therefore, there are three discussions of the different tasks
    related to legislation that formed the basis of prototype systems in the demonstrator
    project. These tasks are thought to be generic, and applicable in one way or another
    to any piece of legislation. For all laws are made, giving rise to the policy
    task, and it is desirable that all laws should be understood by those to whom
    they apply, so that they can regulate their behaviour appropriately. The first
    chapter, by Andrew Taylor, who was responsible for determining the requirements
    for both the system for adjudicators and the system for policy makers, discusses
    the nature of a support environment. This is a crucial task, since it is the obvious
    area to provide support for a large legislation based organization such as DHSS.
    The nature of the environment described is significantly different from the kind
    of consultative expert system is usually proposed as a model for this kind of
    support. The second chapter by Andrew Taylor and Trevor Bench-Capon, as well as
    being closely involved with the policy application throughout the project, began
    working life in a DHSS policy branch, describes the nature of a system to support
    policy makers. Again the demands made on such a system mean that it must have
    radically different properties from a standard KBS. The third chapter, by Nigel
    Gilbert, who led the team working on information systems, whilst these are perhaps
    the closest to a standard consultative expert system, there are again important
    differences. Consideration of the requirements of the three areas of application
    as explained here should dispel any idea that it is possible to build a system
    which can offer impartial support across the whole range of tasks. The final chapter,
    by Trevor Bench-Capon, returns to the question of whether it is possible for the
    different types of system to share a common knowledge base. The discussion is
    focused on a small and simplified example which despite its triviality serves
    to point to places where divergence is necessary.


    The conclusions of these chapters show that there is a good deal more to a legal
    KBS than that it is important to identify clearly the task at which the system
    is to be directed before starting to build it. Too often in experimental systems
    this practical focus has been lacking. The task is important because it determines
    the functionality required from the system, and the information that can be expected
    from the user of the system, and this should have a pervasive effect on what is
    represented and how it is represented.'
