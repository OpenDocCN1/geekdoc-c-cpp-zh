    methodical and carefully recorded working through of the relevant rules. Domain
    complexity is more difficult to resolve. In particular it is not sufficient just
    to have all the rules available; the problem is finding the right rule or knowing
    what to look for and how to look for it. The situation with problems of domain
    complexity is analogous to looking for a book in a large library when you are
    not sure that it exists, you do not know what it is called, you do not know who
    wrote it, and you certainly do not know how to find it. Significantly, however,
    you know what it contains and would recognize when you had found the right book.


    These types of complexity are manifest throughout the income support assessment
    process. For example, the determination of membership of the family can involve
    a number of issues around the question of whether a child is to be treated as
    a dependent of the claimant. Firstly, it is necessary to establish who is precisely
    the claimant. Secondly, it is necessary to establish who is to be considered normally
    responsible for the child. Thirdly, it is necessary to consider whether the current
    circumstances of the child''s residence imply that the normal criteria of responsibility
    for the child temporarily do not hold. Answers to questions not only determine
    which subset of further questions may be relevant but more importantly, whom these
    subsequent questions should be asked of. The point about the answers to these
    questions is that they need to be recalled later in the assessment, for example
