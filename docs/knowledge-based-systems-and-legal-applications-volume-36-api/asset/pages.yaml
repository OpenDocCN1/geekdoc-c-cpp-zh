- pgno: 52
  md: '# Legal Applications of KBS


    semantics of the logical formalism adopted or presented their own variant in traditional
    style. Stamper argues that such approaches to semantics are inadequate. In doing
    so he is questioning some of the most fundamental notions in the theory of formal
    languages and the philosophy of language generally. Clearly it is not possible
    to undertake a detailed discussion here.


    # 1.10. REPRESENTING LAW AS LOGIC PROGRAMS


    This section describes a general approach: the construction of declarative representations
    of law using some convenient form of symbolic logic, and the execution of these
    representations by automated theorem-provers, potentially for a variety of different
    purposes. This approach is most closely associated with Sergot and Kowalski at
    Imperial College, London.


    # 1.10.1. General description


    In this general approach, the law is modelled by a set of logic sentences (an
    axiomatic theory) which represent some chosen unambiguous interpretation of the
    selected legal sources. (''Axioms'' is the correct term for these sentences but
    used informally it has connotations which are not intended and which might lead
    to misunderstanding; ''explicit assumptions'' would be a reasonably accurate informal
    alternative). In principle, there is again no reason why law and other ''stimuli''
    that influence judges'' decisions should not be represented. In practice, most
    applications of the approach have incorporated representations constructed from
    statutes unto (precisely the same reasons that most other projects have concentrated
    on statutes alone). An automated theorem-prover is used to derive useful consequences
    of the representation and added to the representation, ''applying'' to the facts
    of the case. If the facts of a given case are described by a supplementary database
    the theorem-prover can be used to determine the consequences of the facts of the
    case. The law is ''applied'' to by deduction. This method can be used to construct
    systems with the same capabilities as the programs described in earlier sections.
    Specific examples of applications are given below. A detailed account of the approach
    is provided in [Sergot 1985a]. See also [Sergot 1985b; Sergot et al. 1986a; Kowalski
    and Sergot 1987, 1990].


    In theory, it is possible to use any form of symbolic logic as the representational
    formalism as long as it has an automated deductive system. But for many simple
    provisions encountered in legislation, the most practical and convenient choice
    of logic is the subset of first-order logic which earlier I extended definite
    clauses (the form of logic on which the programming language PROLOG is based).
    Recall that these clauses are implications of the form A <W where A is an atomic
    conclusion and W is any expression of first order logic stating sufficient conditions
    for conclusion A to hold. Sergot [1985a] argues that'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# The Representation of Law in Computer Programs


    many kinds of legislation are essentially definitional in nature, and that extended
    definite clauses provide a simple and natural formal language for expressing these
    definitions precisely.


    For practical application, the easiest way of implementing the required theorem-problem
    is simply to execute the representation using PROLOG. This just involves rewriting
    the clauses in PROLOG syntax and then executing the result as a PROLOG program.
    At Imperial College most applications have been implemented in APES [Hammond and
    Sergot 1984] which allow an augmented form of PROLOG. APES, like PROLOG, works
    backwards from conclusions to conditions, and has the same fixed execution strategy.


    There are two ways in which APES ''augments'' PROLOG: it constructs proofs of
    all its conclusions, which can be examined during the computation or when a final
    conclusion is reached; and it incorporates an implementation of ''Query-the-User'',
    a declarative model of input-output for logic programs [Sergot 1983]. The ''Query-the-User''
    module in APES automatically generates requests for any missing information that
    the user is required and checks the answers supplied by the user. More sophisticated
    versions of ''Query-the-User'' allow users to answer questions, either because
    they do not know or because they do not provide an answer. Conclusions derived
    in such circumstances are conditional: they are qualified by conditions which
    remain to be decided. All conclusions, whether conditional or not, are logical
    consequences of the axioms that represent the law and any information provided
    by the user.


    Executing a declarative representation of the law in a system as APES gives a
    program with roughly the same functionality as the legal analysis programs described
    in previous sections. Indeed, it provides a means of implementing programs with
    extended capabilities: the proof generation mechanism provides a means of justifying
    the analysis obtained in terms of the original legislation; and the possibility
    of deriving conditional analyses is a feature which is normally not provided by
    legal analysis programs (but see the description of Gardner''s system in 11.52).


    The ''Query-the-User'' mechanism is not an essential component in all applications.
    Two alternative types of application can be mentioned in particular. Firstly,
    it is possible in certain circumstances to describe the facts of specific cases
    in a supplementary database in between, instead of requesting them as the need
    arises during computation. This gives a system which corresponds to the behaviour
    of typical data-processing applications (and applications implemented in LEGOL).
    Secondly, there is the possibility of deriving consequences of a more general
    nature, with potential application in the drafting of legislation (discussed in
    section 11).'
