    with the empowering of the adjudication officer and the definition of appropriate
    procedure.


    Many specific details of an income support case will require reference to totally
    separate legislation: e.g the Trustee Act 1925 on contingent interests in capital;
    the Social Security (Mariners Benefits) Act 1975 on share fishermen. In terms
    of supporting the adjudication officer, the structure of the legislation is also
    particularly important. To a large extent the legislation follows the topics which
    need to be decided for an income support assessment to be completed:


    +   1. Establishing the validity of a claim (i.e. that the application has been
    made correctly, by someone who is in an appropriate position to make a claim).


    +   2. Ensuring the major conditions of entitlement for income support are met
    (e.g. residence in UK, age conditions, etc.).


    +   3. Establishing the membership of the family being claimed for and the roles
    of the individuals within.


    +   4. Assessment of the family''s requirements (applicable amounts) and resources
    (capital, income, and other resources).


    +   5. Determination of how much Income Support should be paid, by what means,
    and from what date.


    The assessment of applicable amounts, capital and income are large, complex topics
    of which only a small fraction is likely to be used in any given case. Generally
    they are structured according to subsets of types of applicable amount, capital,
    etc. Certain types of case invoke specific conditions within the general structure.
    For example, ''self-employed'' or ''business cases'' raise particular entitlement
    issues as to whether, the claimant is claiming on the basis of being unemployed,
    they are actually available for work or still running a business; the subsequent
    assessment of capital raises issues of the value of business assets, Certain types
    of case cut across this structure, however. For example, special rules apply to
    all topics for the treatment of people involved in a trade dispute.


    Case law is available to the adjudication officer in the form of commissioner''s
    decisions. They are categorized as ''reported'' and ''unreported''. Copies of
    all reported decisions are distributed to local offices for the use of adjudication
    officers. Bound versions are maintained, arranged in historical order. Social
    security case law is similar to other case law in terms of its technical language
    and specialized style. Although it may be an over-simplification, a distinction
    can be made between cases that expound a general principle and therefore have
    a widespread impact and those which give detailed consideration to the facts of
    the case, and are distinguished from other similar cases. In other instances,
    a case may be significant in that that it expands or explains the'
