    the "far end" of the reference so amendments introducing new cross-references
    will cause nonlocal changes. What is needed is a mechanism within the knowledge
    representation formalism to allow such cross-references to be made explicit.


    # 12.4. ADEQUACY OF EXISTING PARADIGMS


    So far we have considered ways in which existing paradigms might be used to build
    a legal KBS. There are, however, those who would argue that there are features
    of the legal domain which require a representation that is specific to the legal
    domain: for example [Greenleaf et al. 1987], and [McCarty 1989]. Greenleaf et
    al. base their argument on the need for the representation to be well adapted
    to lawyers, who see them as the natural builders of such applications, and this
    means that the "form of representation must be expression in that form comes naturally
    to lawyers’. McCarthy’s motive is different: his belief that if legal knowledge
    based systems to progress beyond the limited success produced by current systems,
    a deep conceptual model is required. Because there are common sense categories,
    such as time, action, belief and permission, underlying the representation of
    a legal problem domain, a knowledge representation language that faithfully mirrors
    the structure of these categories is required. In [McCarty 1989] he proposes the
    basic features of such a language, which he calls Language for Legal Discourse.'
