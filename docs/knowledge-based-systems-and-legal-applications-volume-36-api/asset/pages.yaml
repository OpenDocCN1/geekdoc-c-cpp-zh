  md: '# Legal Applications of KBS


    # 223


    # 11.3.2. Migration of limitation


    Another limitation which was to cause considerable difficulty was the inability
    to create an instance when little of its detail was known and then that instance
    ''migrate'' through the class hierarchy, i.e. become the instance of a subclass
    of the original class and acquire a frame for slots for storing information about
    the additional attributes associated with the subclass, as more detailed information
    about nature came to light. For very good reasons (see Chapter 12 below), classes
    described instances, i.e expressed values which instances could take, but did
    not represent instances, i.e. did not express which values instances did take.
    As soon as there was information pertaining to a particular instance of class,
    an entity had to be created. The information could then be stored in one of the
    slots for the frame. The difficulty was that information would typically be volunteered
    about, for example, a particular person (call this instance of PERSON *Terry)
    before it was known in what kind of person, in relation to the benefit system
    *Terry was. If *Terry were an adult female, a whole collection of slots for attributes
    appropriate to adult females would have been needed such as whether the person
    was pregnant, whereas if *Terry were a male they would not.


    # 11.3.3. Rich class structure


    Initially it had seemed sensible to structure a knowledge base with a class for
    PERSON and subclasses to represent kinds of person, e.g. CHILD AND CHILDDEPENDANT
    AND ADULTDEPENDANT AND ADULTPENDANT AND WIDOW to name a few. The difficulty was
    that *Terry could not be created as an instance of the class PERSON and then subsequently
    become and instance of, say the class CHILD and subsequently DEPENDANT as more
    details became known. One problem might have been to wait until it was exactly
    what kind of person was created in the system. But that would require the user
    of the system to know how to categorize accurately in benefit terms every person
    being referred to. It would also require that people being referred to had only
    one way of being properly categorized. Neither was the case.


    One of the tasks of the Advice System was to help the user determine whether a
    person should be categorized in one way or another, for example as a dependant
    or not a dependant. And it was often the case that more than one category would
    apply. WIDOWS might also be EXPECTANTMOTHERS and/or LONEPARENTS and/or CLAIMANTS
    and/or DISABLED. So a rich class structure for classes like PERSON was not possible.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 11.3.4. Perspectives


    Another way to get around the problem was to use perspectives.


    In one version of the AS knowledge base the class PERSON had an attribute called
    ''perspectives''. The ''perspectives'' slot on the frame representing an instance
    of PERSON contained the set of ''perspectives'' that could be applied to the person.
    This meant, for instance, a person could be identified as a female, a lone parent,
    and a child benefit claimant. One implication of using perspectives was that inappropriate
    questions could be asked. Males would not be asked about themselves being pregnant.


    There needed to be attributes on the class PERSON which allowed perspectives to
    be associated with its instances. These were referred to as trigger slots. As
    soon as there was enough information to fill a trigger slot, such as giving the
    gender to the person, the appropriate perspective, say ''female'', would be associated
    with the instance of person and an instance of the perspective was created for,
    for example ''TerryAsFemale''. Information which was female-specific and which
    could apply to all females would be stored in the slots of instances of the ''Female''
    perspective. The AS knowledge base was built using perspectives technical difficulties
    with the Advice Manager module''s use of perspectives were discovered and a third
    way of dealing with the problem was employed.


    # 11.3.5. Huge frames


    The third way of dealing with the problem was the one employed in the Advice System
    which was delivered at the end of the project. This solution, was both in and
    inefficient, but it did work. The class PERSON was given all the slots which were
    needed by any of the subclasses of person. This meant there was no need to ''migrate''
    an instance down a class hierarchy as there was no hierarchy down to which ''migrate''.
    The class PERSON ended up having more than 150 attributes. Every instance of the
    class PERSON had a nonsense or not. Instances of newborn babies carried an overhead
    of slots relating to their marital status, their children, their school leaving
    age, and employment history. Although storage might not have been a problem, search
    was. Checking the values of all the slots of all the instances for possible deductions,
    as the inference engine did every time new information was made available, reduced
    performance.


    # 11.4. KNOWLEDGE ANALYSIS AND KB DESIGN


    Knowledge analysis was not a clearly defined activity in the project, especially
    in the early stages. In the final report, however, there is a characterization
    of knowledge analysis and knowledge encoding.'
