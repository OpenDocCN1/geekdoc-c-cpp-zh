    # 4.2.4. Potential Benefits.


    The requirement for a system to support policy, and the associated benefits of
    such a system ultimately derive from the expectations and priorities of the policy
    process and the constraints which face policy staff in their existing environment.
    The expectations and priorities have their origin in the political nature of the
    policy task. One of the primary expectations of policy is that it should have
    considered all of the issues with implications for, and possible counterarguments
    to, a particular policy line. This is not that says has there be a conclusive
    rebuttal for any counterargument; just that the proposer of the policy should
    be prepared for the counterargument and have some response. Another is that there
    is a strong requirement to avoid inconsistency in the explanation or justification
    of a policy. Potential benefits of a system then, depend on its ability to identify
    ''unthought-of'' issues and any potential inconsistencies in explanations.


    In terms of removing constraints, the policy process differs from more traditional
    application areas in that the scale of the activity is relatively small. The potential
    for supporting policy therefore derives from factors of scale but rather from
    issues associated with the sophistication and significance of the policy process.
    The constraints on policy development are agreed to originate in four features
    of the policy process.


    +   1. The unbounded, indeterminate, unstructured nature of policy issues Policy
    is an extreme example of what have been called ''wicked'' problems [Rittel and
    Webber 1973]. Particular features of such problems include the following. There
    are intangible issues, often with unclear conceptions as to what precisely is
    required from the policy. There are competing conceptions about the nature and
    source of the problems. Decisions have to be made on the basis of inadequate information.
    The effects of any option are indeterminate, and subsequent changes to accommodate
    unforeseen effects can'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'cause tensions between these changes and the original philosophy.


    2. The inherent complexity of the policy task The variety of elements which need
    to be considered, including all the options and their implications, quickly become
    extremely complex in terms of their links. Possible knock-on effects make it difficult
    to manage all these elements and in particular make it difficult for any single
    individual to understand all of necessary elements. Implementation of policy has
    to take account of all the required procedural tasks and ensure that they are
    planned according to a realistic timetable. At the same time all of this complexity
    builds a high dependence for a particular item of policy on the key individual
    involved. This can lead to problems if there is a high turnover of staff.


    3. The number of relevant interest groups Policy needs to consider, and where
    possible accommodate, the opinions and expectations of a wide range of interests.
    Equally it is dependent on other groups for the provision of information and the
    implementation of policy. This process is exacerbated by the lack of a common
    language for describing issues and options. The presentation of policy in an appropriate
    form for particular audiences is one of the major tasks of the policy staff. This
    needs to take account of the key criticisms which may be used against the policy
    and may also lead to adapting of options.


    4. Timescales The fact that a policy evolves and develops over significant periods
    of time gives added importance to the ability to retrieve earlier material and
    ensure consistency and accuracy of current information. However, time constraints
    mean that the recording of key events, options considered and assumptions may
    be given a low priority, with little information actually recorded. The fact that
    during policy development priorities may change quickly, can lead to significant
    time and resource constraints in amending and presenting the new policy. In contrast
    with these long-term developments of policy, there is a continual pressure on
    resources required to answer questions and respond to minister''s short-term demands.


    In the face of these general constraints the justification for policy support
    is agreed, by members of a committee charged with evaluating the Demonstrator
    prototype and the majority of policy staff interviewed, to lie in its potential:


    +   1. Reducing the effort required to develop and particularly to revise the
    policy.


    +   2. Providing a quicker, clearer and more complete response to those concerned.


    +   3. Minimising the occurrence of oversights or confusions.'
