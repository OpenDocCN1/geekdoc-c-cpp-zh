    There is a related project which is investigating the use of theorem-proving methods,
    not for the drafting of legislation, but to help at the pre-drafting stage in
    the formulation of policy [Bench-Capon 1987]. This work is addressing directly
    the problem of predicting whether a piece of legislation will achieve its intended
    aims, or whether, through interaction with other legislation or because of unanticipated
    socio-economic effects, it will cause unintended and undesirable side-effects.
    This work is clearly very ambitious and still at a preliminary stage. The proof
    by Trevor Bench-Capon gives a number of real examples and shows how they might
    be treated with the help of such a system.


    # 1.12. TAXMAN I


    The best-known and most sustained project on the application of artificial intelligence
    techniques to law which began in 1972. This section describes McCarty''s early
    work on TAXMAN, now referred to as TAXMAN I [McCarty 1977, 1980c; Sridharan 1978a];
    McCarty and Sridharan 1980; see also Cook et al. 1981]. The later work on TAXMAN
    II and McCarty''s recent proposals for a language for legal discourse are described
    separately in section 1.16.


    McCarty has often contrasted the ''deep conceptual'' model underlying the TAXMAN
    system with the representations that are incorporated in simple legal analysis
    programs (like Hellaworld''s CORTAX program). This issue is examined in this section.
    TAXMAN II addresses specifically the representation of opened textures and reasoning
    with the deontic concepts (obligation, permission and prohibition).


    # 1.12.1. Description


    McCarty''s aims in the TAXMAN project are primarily theoretical. He has described
    TAXMAN as ''an experiment in the application of artificial intelligence techniques
    to the study of legal reasoning and legal argumentation''. The experimental domain
    chosen for this investigation is US corporate tax law.


    The US Internal Revenue Code classifies certain corporate transactions as tax-free
    reorganizations (of type B, C or D). The TAXMAN I system was constructed to represent
    the statutory rules and concepts which define these reorganizations. When the
    facts of a given corporate'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# The Representation of Law in Computer Programs


    transaction are described in the TAXMAN formalism, the system can apply its definitions
    to determine whether the transaction would be classified as a tax-free reorganization.
    TAXMAN I was originally implemented in a version of MICRO-PLANNER [Sussman, et
    al. 1971]. Subsequently TAXMAN I (and TAXMAN II) were implemented in AIMDS — a
    frame-based system [Sridharan 1978b], [Sridharan 1980].


    Representation in TAXMAN begins by constructing a model of the underlying legal
    domain. For corporate tax law, the domain will contain ''objects'' like corporations,
    individuals, stocks, shares, securities, transactions, etc. Each class of object
    is described by a template: a particular object will be represented by a template
    instance, which can be viewed as a collection of aspects describing the object''s
    properties (name, address, size, etc.). The domain is further described by a system
    of relations which express the possible relationships between objects. The factors
    of a particular case are described by a set of template instances and the relations
    between them. Legal concepts defined by the statute (like ''tax-free reorganization'')
    are also represented by templates (though normally these have values). The statutory
    rules define which concepts are represented by logical templates, a term which
    is intended to suggest the way that templates for the high-level concepts are
    ''matched'' to the lower-level descriptions during the analysis of a case.


    McCarthy [1983a] contrasts the structured representation of the TAXMAN domain
    with the unstructured questions that a program like Hellaw''s CORPTAX might ask:
    does TP and family actually own 50% or more (in value) of the stock of a corporation
    which is a partner in a partnership which owns Redcorp stock? In CORPTAX (section
    1.7.4), this is a portion of text which is not broken down into its constituent
    parts. It is not connected in any way to other portions of text that mention ''stock''
    or ''ownership'' or ''corporation''. Conceptually, McCarthy suggests, that means
    the underlying primitives of CORPTAX are concepts of the corporation which is
    a partner in a partnership which owns Redcorp ''stock''. This contrasts with TAXMAN''s
    representation, which is constructed from much more basic primitives like ''stock''
    and ''ownership'' and where the relationships between these primitives are explicit.


    For future reference, it is also worth summarizing here McCarthy''s reasons for
    choosing a ''technical'' domain like corporate tax law rather than ''simpler''
    legal domain.


    [It] is tempting to start with the ''simplest'' possible legal issues, as the
    subject matter of the first-year law school courses. But these cases are ''simple''
    for law students primarily because they draw upon ordinary human experience, and
    this is precisely what makes them'
