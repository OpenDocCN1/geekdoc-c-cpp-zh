  md: '# CHAPTER 15


    # ORGANIZATIONAL AND SOCIAL IMPLICATIONS


    Andrew Taylor


    Throughout the project a substantial amount of effort was expended considering
    and attempting to address some of the important organizational and social issues
    raised by the systems being developed. This work focused not only on the specific
    analysis of detailed aspects of the working practices of potential users but also
    on the more general questions of:


    +   1. The applicability of methodologies for organizational analysis for KBS.


    +   2. Issues concerning the cost benefit justification of such systems.


    +   3. The possibility of predicting the future effects of the systems.


    +   4. The roles of various groups and individuals within an organization introducing
    such systems.


    This chapter outlines the range of organizational issues which arise with these
    systems, describes how they were addressed within the specific project work and
    assesses the possibility of methodologies or prescriptive recommendations which
    could improve the handling of these issues.


    # 15.1. INTRODUCTION


    The terms of reference, and subsequent organization and planning of the project,
    did not include any major objective to consider, directly, the social and organizational
    aspects of the systems. Whether this was a'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 310 Organizational and Social Implications


    reasonable or desirable decision (and this question was itself the subject of
    disagreement within the project) it was nonetheless a given constraint to the
    work. Throughout the project, questions were often asked, typically by those responsible
    for exploiting the systems, concerning what benefits the systems could provide.
    Similarly, the potential end users, along with socially concerned observers of
    the working, frequently questioned us about the effects the systems could have
    on the working practices of the decision makers and the quality of service offered.
    It was also apparent that it would have made little sense to develop ''requirements''
    for the systems which did not match any organizational need or to take account
    of the context within which the systems would have to operate.


    These various eternal expectations supported the specific interests and concerns
    of the analysts working on the project in considering the organizational features
    of the systems. From the last few years the importance of such issues has become
    more generally acknowledged not least through the clearly apparent failure of
    systems which have not paid sufficient attention to such factors. As a result,
    the demand for methodologies which can help with the identification of suitable
    application areas, the identification of user requirements, and the evaluation
    of systems and knowledge bases, has grown to be the major area of concern for
    those developing these knowledge based systems. More widely there has been a call
    for the adoption of a new conception of ‘knowledge’ and a corresponding change
    to the proposed role of technology.


    Surprisingly, the experiences of our project have led us to conclude that there
    are no easy answers or recommendations appropriate for any of these organisational
    and social issues. Indeed there is nothing in the technology per se which encourages
    us to believe that it holds out particular dramatic benefits and opportunities,
    nor in contrast that it is bound to have undesirable and detrimental effects on
    working practices. Similarly there are no general and guaranteed recommendations
    on how to achieve successful solutions. So much depends on factors such as the
    size of the system and the scope of its impact, the degree of involvement of users
    and the extent of integration of the systems with their existing tasks and objectives.
    This makes it difficult to draw general conclusions from the work of our project.
    It is therefore necessary to explain the sense in which the project experiences
    have highlighted important issues.


    The issues which we have concentrated on large scale, internally developed applications
    are likely to be more important to support a specific defined task and designed
    with clear business objectives in mind. In this it contrasts with, say, the Latent
    Domain Adviser of Capper and Susskin [1989], which is smaller, more generic and
    less defined in terms of its expected usage. This contrast should not be underestimated
    — it is as considerable as the difference between say, a generic time recording'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'system written on a spreadsheet for use on a PC within any organization and
    a fully sophisticated financial and administrative system built for a specific
    company. The distinction has much to to do with the extent to which the system
    constrains its possible uses. We can, for instance, imagine a spectrum from a
    most general unconstrained system but where the user is required to provide a
    great deal of interpretation and judgement of relevance to the results of the
    system, and on the other extreme specific, focused and targeted system incorporating
    constraints on which issues need to be addressed and how. Our concerns have been
    less with the generic capabilities for any interested individual and more with
    the specific needs of an organization and the particular roles of its decision
    makers.


    This chapter characterizes the stages in the development of these KBS when ''human''
    issues are of particular importance, the difficulties presented within the project
    and some of the techniques and methodologies were used. It will also consider
    some of the issues and complexities which are still unresolved and draw some general
    conclusions about the future work required to address these issues.


    # 15.2. STAGES


    Organizational issues arise in five key areas of the development of a knowledge
    based decision support system. Without assuming that these can be characterized
    as distinct stages they fall into a general sequence of the following:


    +   1. Opportunity identification and definition of objectives.

    2. Requirements development and revision.

    3. Knowledge analysis.

    4. Introduction into the organization (incl. ''job design'', internal marketing,
    training).

    5. Evaluation, validation and acceptance, maintenance and future development.


    This section will consider what is involved generally in each of these and also
    some of the particular issues present with legal applications which may not be
    as apparent in other domains but are still likely to be problematic.


    # 15.2.1. Opportunity identification and definition of objectives;


    The identification of a system which it is appropriate, worthwhile, to develop
    is undoubtedly the most crucial stage — but is also, it seems, the least rigourously
    addressed. The dangers of a poor selection are considerable. On the one hand,
    the system may be supporting tasks which have little relevance or importance to
    the organization — or which the'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Organizational and Social Implications


    human decision makers have no difficulty with and carry out in the most cost effective
    manner already. On the other hand, it is quite easy to select a task and role
    for the system for which it is just not feasible to construct a support system.
    This may be to do with limitations of the technology, the ''damp squid syndrome''
    - that it cannot perform sufficient tasks to be of help, or the knowledge required
    for the knowledge base is unfeasible to elicit and encode. Alternatively it can
    be that systems have undesirable effects which cannot be controlled by the organization,
    the ''time bomb syndrome''.


    The potential for such mistakes in legal domains appears to be considerable. Simple
    encodings of the legislation as logical rules are example of systems which are
    mostly irrelevant and inappropriate to support decision makers in law, or which
    are too limited on their own to provide any significant support. Mistakes are
    easily recognizable and can be addressed at an early stage - although it is worrying
    to see developers blindly assuming that some good use must be possible for these
    legal encodings if only someone could design a suitable interface for them. More
    serious is the danger of underestimating the complexities of decision making in
    law and the ramifications of interfering with delicate organizational balances
    that have been established over many years. Similarly, the conceptual complexities
    of reasoning by analogy or of identifying strategies for addressing particular
    legal problems are that, unless the knowledge required and procedures for applying
    it are already available and explicit, it must be at least extremely ambitious
    to believe that a knowledge engineer (even one with a training in law) could elicit
    it. It was for these reasons that we dismissed the idea that the encoding of ''expert
    knowledge on how to tackle assessments'' as a feasible poem. The danger of undesirable
    consequences from inappropriate systems is more worrying still. Problems of law,
    by their very nature, invoke issues of overlapping and competing interests. In
    many ways the law itself provides a ground for the negotiation of differences.
    In such an environment the occurrence of intricate complexities is unavoidable,
    and the adoption of any simplistic interpretation highly dangerous. Part of the
    answer must be to link any system closely with existing organization procedures
    for monitoring and controlling the decision processes.


    The key questions which need to be addressed at this stage, therefore include
    the following:


    +   1. What are the key business priorities, particularly those associated with
    expertise and decision making?


    +   2. Which tasks, linked to these business priorities, seem ''susceptible''
    to KBS solutions (based on analysis of the tasks, mistakes, constraints, nature
    of decision making and knowledge used, etc.)


    +   3. What are the potential business benefits of systems and so'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Legal Applications of KBS


    what feasibility and evaluation criteria should be applied to an assessment of
    proposed systems?


    4. What is the organizational feasibility of the system? (based on an analysis
    of the scope of activities supported, the context in which the system would be
    located, job design and ''monitoring and control'' procedures).


    5. What is the technical feasibility of producing a useful and workable system
    (based on estimates of the complexity of required functionality, scope and complexity
    of required knowledge, usability criteria and system adaptability)?


    The project was presented with a number of challenging problems when trying to
    address these issues. Firstly, there were uncertainties pertaining to the objectives
    of the organization. It was clear that there was no single, definitive view on
    the objectives of the organization but rather a plurality of perspectives each
    with their legitimacy. The degree of correspondence between the activities actually
    carried out within the organization and the stated objectives was frequently minimal
    or at least uncertain. The long term plans of the organization included proposals
    for radical change in responsibilities and accountability in effect questioned
    the possibility of any system remaining relevant. Secondly, there were problems
    in discerning the tasks to support and consequently the organizational feasibility
    of possible systems. It was particularly difficult to establish the precise uses
    of different knowledge items. There exists a plurality of sources and flows of
    the knowledge, along with mechanisms for monitoring, validating and maintaining
    the knowledge, which vary in their formality, impact and pervasiveness. Often
    the ''official'' accounts did not match the actual practices of individuals and
    local groups.


    Thirdly, we believe that an important feature of all legal domains when addressing
    these issues is the fact that decision making in law, and indeed policy development,
    takes place within a framework of time constraints and risk assessment. It is
    always conceivable that a particular issue could be researched and considered
    in exhaustive and painstaking detail only to confirm the initial assessment of
    the situation. The skill is to recognize where potential risks lie and to address
    issues to sufficient depth to remove as much risk as reasonable within the time
    constraints. One of the great potentials of knowledge based support systems must
    be that they could change the current balance in such assessments for the better.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 15.2.2. Requirements development and revision


    Requirements analysis for knowledge based support systems seems too often to be
    considered something which is not particularly difficult to perform — after all,
    systems analysts have been carrying out a very similar task for traditional systems
    for many years, and why should these systems be peculiarly difficult? The answer
    is that previous systems were typically built around manual procedures, the form
    and content of which were not a particular matter of concern to decision makers.
    In contrast, the tasks which KBS are trying to support are the central areas of
    skill, experience and individuality of the decision makers. The key issue is which
    requirements definition for KBS, therefore, is to decide which requirements the
    system is intended to address, and usually more difficult, who has the authority
    to sanction a sanction of requirements. The problem is that decision making is
    seldom ''one thing'', rarely occurs in only ''one place'', and is usually carried
    out by a whole variety of individuals with different skills, levels of experience,
    responsibilities and approaches. How do we identify a ''single'' requirement?
    Equally is often dangerous to separate components of an overall task and provide
    support for these important, and usually dynamic, links between the components
    supported and the wider set of tasks [Brown and Taylor 1990].


    Legal applications present a particular set of issues for requirements analysis
    and specification — which we would argue are always present but which legal applications
    cannot ignore. This is based on the problem of following a so-called participative
    approach to systems development. Simply, the requirements for a system cannot
    be grounded on what people want, let alone what they say that they want, but has
    to take account of what they are obliged to do, and therefore what they need.
    Unfortunately, experienced decision makers can still be found who are contravening
    the conditions empowering them with their authority. What is even more likely
    is that they will not be able to understand the effects (either positive or negative)
    of any support systems.


    The conclusion is that requirements analysis for these types of system needs to
    consider the nature of the decision makers tasks, and the role of any support
    capabilities, in a greater depth than that for traditional systems. In particular
    it needs to consider the following questions:


    +   1. Which decision making tasks are to be supported by the system and how do
    these relate to each other (based on an analysis of which tasks require most support
    and what type of support they require, how interdependent the tasks?)


    +   2. Which organisational groups and what different ''types'' of user will be
    supported (based on an analysis of organisation groups and boundaries, different
    user ''profiles'')


    +   3. What support will be provided and how will the user access this'
