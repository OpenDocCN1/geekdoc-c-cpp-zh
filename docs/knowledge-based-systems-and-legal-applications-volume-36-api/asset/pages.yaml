- pgno: 126
  md: '# Legal Applications of KBS


    planning which would call on information as to the generic types of option available
    to policy makers to provide additional support.


    #  4.4.2. Option evaluation and solution verification


    The acceptability of a particular policy option needs to be assessed against the
    plurality of policy aims — for example targeting the needs of priority client
    groups, or administrative practicality. Particular care is required in analysing
    the implications and knock-on effects of selected policies. This analysis ideally
    needs to be exhaustive in the sense that it traps all the implications associated
    with the option so that arguments can be developed for and against the option.


    Within the framework of a KBS this might be done by using the logical model to
    explore the consequences of the various solutions, so as to arrive at the good
    and bad points of each. Some will have to be rejected because they have consequences
    which conflict with other aims. As example, if there were an aim to remove the
    need for means testing for benefits in the case of the elderly, then the retirement
    condition could not be made to depend on earnings. Other solutions may generate
    other problems because of an interaction with other pieces of legislation. Some
    of these knock-on effects may be subtle and hard to find, and support for their
    identification is highly desirable. Some solutions may be better than others on
    grounds of cost or administrative simplicity. All these consequences need to be
    weighed by the policy maker, but, of course, the consequences need to be identified
    before they can be weighed.


    The policy maker will now submit a proposal to the government ministers, setting
    out several options for changes that would eradicate condition the problem, together
    with a recommendation based on the advantages and disadvantages of the various
    options. The minister will select one option, which the policy maker will be expected
    to put into practice.


    #  4.4.3. Solution specification


    When a policy maker has decided what he wants to do about a problem he must pass
    his instructions on to legally qualified people to draft the legislative changes
    which will give effect to the solution. Currently this is, done in natural language
    and two kinds of problem may arise. It may first be that the solution has not
    been fully specified, and the looseness of natural language allows this to be
    concealed. Secondly, it may be that the ambiguity of natural language leads to
    unnoticed misunderstandings between the policy maker and his drafter. The natural
    specification output from a KBS will be in the form of a well specified formal
    language, both of these difficulties should be ameliorated.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 4.4.4. Policy justification


    It is not surprising that once a particular policy has been adopted, the policy
    staff are responsible for presenting it in the most convincing and beneficial
    light. It is not uncommon for particular policies to have perceived implications
    which were not a concern of the original policy formulation at all but to strengthen
    the argument in its favour. The presentation of the solution, to ministers, parliament
    and the public, needs rather than the conventional, proof trace style, output
    form associated with typical KBS. This requires an entirely different kind of
    KBS from an adjudication system, but will be a vital part of providing support
    to policy makers.


    # 4.5. NATURE OF KBS TO PROVIDE THIS SUPPORT


    The previous section gave a variety of areas where KBS could provide valuable
    support to the policy maker in the various stages of the policy making. In this
    section we will discuss the kinds of demand that are made on a KBS which would
    be able to contribute in this support: in so doing the differences between such
    a system an an adjudication oriented system will become very clear.


    # 4.5.1. Reasoning about classes not cases


    When a case is presented to an assessment system, all the properties associated
    with the case can, in principle at least, be decided in a determinate finish.
    This may be as a result of observation, or as the result of a legal decision on
    the basis of evidence. The point is that all questions have a determinate answer.
    In considering a policy issue, however, is no possibility of complete specification,
    since we are reasoning with a class of people, not an individual, and the specification
    of the class will necessarily leave the values of certain features undetermined.
    What is at issue here is the constraints imposed on features by membership of
    that class. Determining this is quite different from executing a formalization
    of the constraints as they apply to an individual, and will need to be corresponding
    differences in the nature of a KBS to support such reasoning. We believe that
    what is required here is not the model generation approach that assessment systems
    naturally fall into, but rather a constraint-based approach. The approach adopted
    in the DHSS Demonstrator project is more fully discussed in Chapters 8 and 12.


    # 4.5.2. Lack of specified goals


    When building an assessment system there is a clear idea as to what questions
    it will help to decide. Typically legal concepts such as ''pensionable age'' will
    be defined in terms of factual predicates such as ''age''. Predicates in such
    a system can therefore be divided in those to be'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Legal Applications of KBS


    deduced by the system and those to be supplied by the user as facts. This rigidity
    is inapplicable to a system to support policy. It is as likely that it will be
    necessary to deduce the factual features that a person falling under some legal
    concept must have as to decide whether a given set of factual features suffice
    to confer title to the legal concept. Therefore the task orientation which tends
    to be built into an assessment system needs to be absent from the representation
    to be used by a policy supporting KBS.


    Moreover, there is likely to be no well specified goal when a user brings the
    system to bear on a particular problem. The user of a policy system is not posing
    a question, but rather exploring the consequences of a situation. This again makes
    the consultative model around which most assessment systems are based inappropriate.


    # 4.5.3. Integrating the facilities of a policy system


    As said in section 4.2.1, the policy process is not a prescribed set of tasks
    with a defined start and end. While there will be activities within a policy task
    which can be supported by KBS, the order in which, and the extent to which, these
    activities will be pursued with vary issue to issue. A policy KBS will thus comprise
    a set of tools supporting these diverse activities, and poses challenging questions
    as to how these can be integrated into a coherent and usable system. A first attempt
    at the integration of facilities for manipulating a logical model and facilities
    for constructing arguments was made in the Demonstrator prototype P3 described
    in Chapter 8.


    # 4.5.4. Correctness of a policy KBS


    Current consideration of policy issues often involves trawling a large number
    of people for comment, the idea being to identify as many opinions as possible.
    One use of a KBS in policy would be for it to be used in a similar way, to generate
    and stimulate further possibilities that might be overlooked in a flaw. Such a
    system would need to reason in a different way from an assessment system which
    is designed to help its user answer a specific question, and where it is important
    that any answer it may produce is correct. The policy KBS would, in contrast,
    need to go on where an assessment system would stop, making any necessary assumptions
    that it needs to do this. This may of course lead to conclusions that will be
    on consideration be rejected, provided the assumptions are explicit then this
    is not harmful, and the consideration itself may be valuable. What is important
    is that nothing is overlooked, so that the potential forే after implementation
    is minimized.'
