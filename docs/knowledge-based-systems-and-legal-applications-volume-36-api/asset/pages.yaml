    Indeterminacy of the effects of the system


    It is increasingly apparent that with more advanced systems, the likely effects
    of their introduction are indeterminate at both the organizational level and at
    the level of individual working practices. Equally, however, the process of design
    tends to assume that the impact of a system is predictable and identifiable. The
    general approach, in effect, is to model the organization, model the users tasks
    and knowledge items, identify those tasks (or subtasks) which could be performed
    by a system and then design the system to replicate these processes and carefully
    link in to the existing network of manual procedures. The fundamental problem
    with this approach is that it assumes the activities of the user are both deterministic
    and inflexible, and also assumes that a system can satisfactorily replicate the
    required performance within the subtasks. In fact users will typically adapt (or
    even revert) the systems to serve new organizational and personal objectives.
    Similarly, in the domain of human decision making and interpretation, systems
    perform less than human experts and produce ‘unnatural’ results in the interaction.


    The answer seems to be design new tasks for the users which take advantage of
    the features of systems by integrating their particular assets with the human
    skills, rather than unsuccessfully to replicate human processes.


    Our concern is really with the extent to which the design should be closed and
    specific. Given that users will want to feel supported'
