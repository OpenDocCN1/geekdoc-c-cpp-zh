    PROLEG system [Andretta et al. 1988].


    # 1.10.3. Commentary


    The general approach described in section 1.10.1 must be contrasted with the use
    of procedural PROLOG. The emphasis here is on constructing declarative representations.
    Practical programs can be built with these representations by executing them in
    systems such as APES. This gives a program with the same functionality as, for
    example, Schlohmann''s tax advisor mentioned in section 1.8.2, but without sacrificing
    the declarative nature of the representation. A declarative representation has
    important practical properties. Firstly, it allows the same representation to
    be executed with different control strategies. A program which reasons from data
    to new conclusions is more appropriate in some practical applications. Another
    possibility is to provide a system which gives an expert user control over its
    execution, along the lines of the mixed-initiative system implemented by the MacRae
    (mentioned earlier). Other possibilities are described briefly in [Kowalski and
    Sergot 1990; Bench-Capon et al. 1987]. Secondly, a declarative representation
    means that traces of computation generated by the program are not merely traces
    but logical proofs of any conclusions reached. The practical importance of proofs
    is stressed in [Sergot 1985a]. Thirdly, a representation can be used for many
    different purposes. Of particular interest, and enormous potential significance,
    is the use of declarative representations of law as aids in the drafting of legislation
    itself. This type of application is discussed in section 1.11.


    Executing a set of extended define clauses in PROLOG or in APES is a simple, efficient
    way to implement the deductive reasoning that ''applies'' to the facts of a real
    or hypothetical case. But is only appropriate in certain (well-defined) circumstances,
    because of the way that PROLOG (and APES) treat negative conditions in clauses.
    PROLOG (and APES) interpret negation as ''negation by failure'' does not hold
    when all proving B (in finite time). Negation by failure has intuitive appeal
    and is very efficient, but it is only justified by the assumption that sufficient
    conditions are actually necessary conditions as well. In other words it assumes
    that ''if'' really means ''if'' and if throughout. [Sergot 1985a] argues that
    this reading of negation (or ''if'' as ''if and only if'') is appropriate and
    often'
