- pgno: 316
  md: '# Legal Applications of KBS


    Clearly, this is just not possible as the space of potential solutions is infinitely
    large. When people solve such problems, Rittel and Webber argue, they identify
    feasible solutions on the basis of ''realistic judgement''. What this seems to
    amount to is a constraining of the solution space by excluding those types of
    solution which are thought to be ''unrealistic''. Judements about what is and
    what is not a feasible solution must be based on criteria to do with the goals,
    the power, the resources and the beliefs of the planner. Essentially, the criteria
    are used to define constraints on the type of characterization that is acceptable
    for the problem and hence on the type of solution that may be proposed. Solutions
    which violate these constraints are not acceptable.


    A further difficulty that these problems pose is brought about by the size of
    the groups working on, by the mobility of the group members, and by the length
    of time problems to solve. Both of these factors lead to difficulties with access
    to, amount of, and retention of information. The DSS has a significant problem
    with the capture, the organization, and the retrieval of information during the
    solution of a policy problem. In essence the only visible information is in the
    review papers and any external sources that are introduced. The related problems
    of forgetting, information overload, ''tunnel vision'' and ignorance of the workings
    of other group members are all potential dangers in the policy making process.


    # 14.3.3. Problem solving dynamics


    The organizational structure of the DSS policy function works very well in overcoming
    most of the difficulties inherent in the policy problem. In particular, the distribution
    of problem solving over a large group of individuals with different organizational
    perspectives and expertise is effective at trapping most of the potentially harmful
    interactions between different policies and different parts of the legislation.
    Unfortunately, the cost of this is the extremely slow speed of the process. This
    in turn raises the problems of information capture, organization and access mentioned
    above which, in turn, require further care and slow down the process even further.


    One of the most important organizational devices for ensuring the coherence of
    the final solution is to give the problem to a single individual to own. The process
    is essentially one of this individual towards a solution with the assistance of
    a large group of expert colleagues. The individual ownership of problems ensures
    that each solution is internally coherent while the distribution of problem solving
    effort helps to ensure consistency across the whole of DSS policy and legislation.


    The drawbacks of this type of organization are largely in the limits of the cognitive
    capacities of the individuals involved (no single person'
