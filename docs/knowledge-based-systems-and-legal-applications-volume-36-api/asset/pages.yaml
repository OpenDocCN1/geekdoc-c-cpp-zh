    The complexity in the system and in the claiming process led to a search for a
    model which would provide order on this chaos in a way which would make sense
    to members of the public. Figure 11.3 was the result. Concentric circles create
    bands for:


    +   1. The person whose circumstances give rise to claiming the benefit, e.g.
    a child.

    2. The person who actually makes the claim, e.g. the person who is responsible
    for the care of child.

    3. The focal event which makes it possible to claim the benefit, e.g. the birth
    of the child.

    4. The welfare context, a concept which emerged from this analysis as a useful
    way to map benefit onto real life experiences; e.g. bringing up children.


    +   5. Non-means tested social security benefits available before the Fowler recommendations
    come into effect.


    +   6. Other provisions.


    Means-tested benefits, ‘the safety net’, are broad provisions which go across
    a number of the welfare contexts and so are flung, rather like a hammock, across
    the bottom with arrows to indicate extensions in both directions.


    Systemic grammar networks (SGN) are graphs which provide a way of representing
    any domain wishes. An SGN is made up of nodes which represent concepts in the
    domain and are related to each other in one of ways. Forward straight brackets,
    [, enclose nodes which are mutually exclusive of one another (a disjunction, the
    ‘exclusive or’ of logic). Curly brackets, {, enclose nodes which occur together
    (a conjunction, the ‘and’ of logic).


    There is a curly arrow (not used on this figure) to indicate the nodes must be
    ‘gone through’ several times, once for each child of a family (recursion). There
    is also a square bracket, [, for a conditional relation indicating that if all
    (and) and of nodes enclosed ‘apply’ then the following one does also.


    Work with these networks was hindered by the inability of the software we were
    using at the time to create these symbols easily. This was especially a problem
    with the recursive curly arrow and making the curly bracket large enough to enclose
    the number of nodes required. This difficulty led to the labelling of the enclosing
    symbol with EOR for the ‘exclusive or’, AND (or ‘and’) for the conjunction and
    the conditional relations. These logical operators are sometimes (I think incorrectly)'
