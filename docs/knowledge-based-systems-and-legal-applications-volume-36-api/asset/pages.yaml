    1.10.2. Examples

    The approach has been applied to to a number of sizeable fragments of legislation.
    The best-known example is a representation of the British Nationality Act 1981
    constructed during the summer of 1983 [Sergot et al. 1986a, 1986b]. When executed
    in APES, this representation can be used to determine, for example, whether a
    given individual is a British citizen according to the provisions of the Act.
    (In the light of previous discussions, it is hardly necessary to add that the
    program cannot help only on deciding which citizens autonomously. The program
    can help in analysing the implications of a single interpretation of the Act,
    and it ignores the effect of all other factors that might also have to be taken
    into account in dealing a real case.) This exercise was undertaken whose purpose
    was to demonstrate that the approach could be applied to a substantial piece of
    real legislation.


    Other examples are provided by a series of MSc projects undertaken incorporating
    realistically sized fragments of legislation including a subset of the UK Immigration
    Act 1971 [Suphamongkhon 1984], pension regulations for government grants to industry
    [Lowes 1984], landlord and tenant legislation [Stasis 1987], stock exchange regulations
    [Lakhani 1988] and the law of patents [Roberts 1988]. Bill Sharpe [1984, 1985]
    describes an attempt to represent Statutory Sick Pay legislation in the UK. Hustler
    [1982] has used similar techniques to represent rules relating to the entitlement
    of individuals to the tort of assault and battery. Hustler''s system is mentioned
    in section 1.15.1 where the work of Meldman Advises Peter Hammond [1983] at Imperial
    College has used APES in a system which addresses of individuals to one of the
    Social Security benefits available in the UK. Hammond''s system is not typical
    because it seeks to represent, not the formal sources of law but the practical
    experience of an expert in this area of law. In this respect, Hammond''s system
    could be classified with Capper and Susskind''s Latent Damage System (section
    1.5.4), though it differs in operation and does not compare in depth and range
    of knowledge represented.


    Another example constructed at Imperial College is based on a substantial part
    of the UK''s social security legislation [Bench-Capon et. 1987]. This exercise
    was undertaken specifically to investigate the problems that arise when large
    scale representations of this type are attempted. Here additional difficulties
    are introduced simply by the size and complexity of the source legislation. In
    this example, the legislation is contained in one main act, supplemented by ten
    sets of regulations, and has undergone considerable revision and amendment, and
    it interacts with many other laws.


    Examples of recent projects elsewhere the IRI-Project at the University of Bologna
    which is addressing environmental law [Pattaro et'
