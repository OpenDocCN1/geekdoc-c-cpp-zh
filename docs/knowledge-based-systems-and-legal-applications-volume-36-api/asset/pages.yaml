    The left-hand side of the screen (Figure 7.2) was used for the assessment. The
    LOD2 concept of a ''topic'' was generalized to operate at multiple levels of detail
    — the case was taken as the top-level topic, with basic data about the case being
    gathered on a form. Second-level topics were automatically generated to fit the
