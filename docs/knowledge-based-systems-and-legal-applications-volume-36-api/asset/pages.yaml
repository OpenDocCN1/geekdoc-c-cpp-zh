  md: '# CHAPTER 8


    # THE POLICY SYSTEM


    Graham Storrs


    # 8.1. INTRODUCTION


    # 8.1.1. The structure of this chapter


    This chapter describes the work of the policy application team in developing a
    series of policy support system prototypes and a series of public demonstrations
    based on these prototypes. The policy application was intended to demonstrate
    the feasibility of knowledge based support for policy-makers in the Department
    of Health and Social Security (the DHSS, later to become the DSS). This chapter
    contains no general material about the Alvey DHSS Large Demonstrator project:
    it is concerned only with the policy application. A brief introduction to the
    application area will be presented in order to provide an orientation to the problems
    and issues involved, although a fuller discussion can be found in Chapters 4 and
    14. We present a brief history of the application in terms of the objectives of
    the policy application, the structure of the policy application Team and a chronology
    of significant events. This material is to provide both an orientation to the
    rest of the chapter and a framework of goals and objectives within which to understand
    the motivations for the various outputs generated by the policy application team.
    This is followed by a description of the four prototypes built during the project.
    The substance of the chapter is in the sections which describe the methods used
    to produce and evaluate the various prototype demonstrators and their associated
    knowledge bases and the evaluation'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'studies that were performed. Lastly, there is a section describing addi-tional
    experimental work, most of which was conducted in the last few months of the project
    and which serves to indicate some of the possible directions in which the work
    could be developed.


    # 8.1.2. The nature of the policy application


    The nature of policy-making within the DSS has been described in detail in Chapter
    4. An important point to note here is that the policy work-ers at do not make
    a decision about policy; they simply make recom-mendations to the minister. It
    is the minister who must make decisions. The art of policy-making lies in the
    ability to understand the problems and the issues, to discover all of the options
    for action, to evaluate them on a wide range of criteria including political,
    ethical and practical, and then to present cogent arguments for and against each
    other. It is these tasks which a policy system must support.


    In the early prototypes, P0 and P1, a six-stage model of the policy process was
    used. Although it proved to be an over-simplification, it required extension along
    the lines described elsewhere, it provided greater motivation for the knowledge
    based aspects of the policy proto-types, and helped to clarify the technical requirements
    to underpin a sys-tem to support certain aspects of the policy process. Briefly,
    in this model we identified the following six stages in the activity:


    +   1. Verify that a problem exists.


    +   2. Arrive at a precise characterization of the problem.


    +   3. [Optionally] modify theories.


    +   4. Generate candidate solutions.


    +   5. Explore the consequences of the solutions.


    +   6. Specify solution for legal draftsman.


    All of these stages gave clear guidelines as to the kind of KBS support that could
    be provided for them. A full discussion can be found in [Bench-Capon 1987]. It
    proved, however, to be an over-constraining view of the process as a whole, imposing
    too much structure and not taking sufficient account of features such as the construction
    of arguments, which is the vehicle by which a policy issue is progressed. The
    two later prototypes therefore took on board this more exploratory concept of
    policy, as described in Chapters 4 and 14, while attempting integration with the
    more specific operations supported by the early prototypes.'
  merge: -1
  img_proc: true
