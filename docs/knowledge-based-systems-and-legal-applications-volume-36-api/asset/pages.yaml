- pgno: 201
  md: '# 9.1. COMMON THEMES


    # 9.1.1. Development methods


    Rapid prototyping


    The proposal for the project envisaged that development of demonstrators would
    proceed by means of ''rapid prototyping''. However, in 1984 this idea was ill-defined
    and there was little other anecdote to indicate what constituted development by
    rapid prototyping. We therefore spent some time at the beginning of the project
    trying small-scale experiments and debating the merits of what we were doing.
    For the purpose of experimentation, we took rapid prototyping to be a development
    method which dispensed with formal design methods, designing by building and trying
    alternative solutions, by means of a ''prototype'' rather than by written documentation,
    and using highly interactive programming tools.


    It quickly became clear that ''rapid'' is an imprecise and relative term. Some
    thought a cycle of design, implementation and evaluation over the course of a
    year was ''rapid''; others expected a cycle to be completed in a week. Our experience
    showed that there were major disadvantages associated with rapid prototyping:


    +   1. One motive for rapid prototyping was that it allegedly allowed the designer
    to explore the design space quickly and then select the best from a range of possible
    designs. In fact, although we were using probably the best prototyping software
    environment available (InterDisp-D), construction of a single prototype to the
    point where it could be evaluated took months of work. This meant that major design
    decisions were made by default — the first design to prototype became the only
    one to be examined and therefore the one to be adopted.


    +   2. It is impossible to design and build prototypes of very large and complex
    systems rapidly, because they are so large. The only practical method is to decompose
    the system into much smaller modules and build prototypes of these. However, if
    a large number of modules are undergoing rapid evolution, the tasks of defining
    and maintaining common interfaces, of integration, and of promoting a common design
    ''philosophy'' throughout becomes very difficult.


    While we became sceptical about the value of ''rapid prototyping'' itself, the
    alternative against which it has often been counterposted — design through the
    use of formal methods -- was also not seen as ideal. We were building systems
    whose precise functionality could not easily be predicted in advance. In addition,
    current methods for the formal specification of interfaces and, in particular,
    for human-computer interaction, were rudimentary and largely untried.


    Combining rapid prototyping and specification'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Legal Applications of KBS


    Over the course of the project we evolved a development method which seemed to
    avoid the worst disadvantages of both rapid prototyping and formal specification.
    Briefly, the development cycle consisted of the following-stages:


    +   1. Preparation of a requirements specification. The specification is based
    on exploratory research with potential users.


    +   2. Construction of an initial prototype. The prototype embodies the designers''
    first ideas about how the requirements might be satisfied. It may be accompanied
    by experimental subsystems which present alternative solutions to some aspects
    of the requirement. No attempt is made at this stage to make the prototype robust
    or efficient.


    +   3. Evaluation of the prototype in the light of the requirements specification.
    This may result in requirements being revised or made more precise. In addition,
    some limited evaluation of the prototype may be carried out with users (although
    the opportunities for evaluation at this stage are restricted because the prototype
    is not sufficiently robust for user trials).


    +   4. Experimentation with other approaches to improve the prototype in areas
    where it seems to be lacking.


    +   5. Preparation of a functional specification. This specification abstracts
    a functional description of the final system from the prototype and the subsequent
    experiments.


    +   6. Implementation of the system from the functional specification. This implementation
    is built paying attention to issues such as robustness, conformance to the functional
    specification and efficiency.


    +   7. Evaluation of the implementation with users. This cycle was followed for
    the development of both the Forms Helper and the Advice System.


    # 9.1.2. Human-computer interaction


    Because of the Advice System and the Forms Helper needed to be able to perform
    tasks successfully with these systems without any opportunity for prior training
    and, for some users, without any prior exposure to computers, the HCI aspects
    of the design were recognized to be very important. Our recognition of the importance
    of the interface and interaction design for the success of the systems had several
    consequences:


    +   1. Most of the early design work for the systems focused on the interface
    between user and computer. This contrasted with the focus of attention in, for
    example, the Local Office Demonstrator, which centered on problems of representing
    regulations.


    +   2. It quickly became clear that much of the conventional HCI'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# The Claimant Advice Systems


    literature, which dealt with issues like the design of character-based screens,
    the improvement of command languages and the construction of user-interface management
    systems, was almost entirely irrelevant to our interest in providing an easy to
    use system on large, high resolution screens to untrained users.


    +   3. Instead, we came to believe that the design of the interaction (i.e. the
    flow of ''dialogue'', however represented) was at least as important as the design
    of the interface (i.e. what the screen looked like), provided that some obvious
    guidelines about size of font and so forth were respected.


    +   4. As a result of designing the systems ''from the user inwards'', rather
    than from the desired functionality ''outwards'', we developed views about how
    the systems'' inferences were to be related to the users interests. In particular,
    we came to be concerned about current understanding on ''user models'' [Gilbert
    1986, 1987a], ''discourse'' [Gilbert 1987b] [Luff and Frohlich 1988] and ''explanation''
    [Gilbert 1988a] [Frohlich 1989].


    # 9.2. THE CLAIMANT INFORMATION SYSTEMS TEAM


    Unlike the other teams in the project, the claimant information systems (CIS)
    team was always clearly located in one place — the University of Surrey. Only
    three members of the CIS team have been from others than the University of Surrey
    and they stayed with the team for relatively short periods. This had some advantages
    and disadvantages in comparison with drawing the team members from a wide spread
    of partners. The major advantage was the much greater productivity which could
    be achieved with everyone being on the same site. A second advantage was that
    the team was able to trade on its location in a university to develop good links
    with the academic community. The major disadvantage was that the CIS team was
    largely left to its own devices by the industrial partners who made few attempts
    to ensure that they were picking employable items stemming from the team''s work
    and did relatively little to influence that to make it more relevant to their
    needs.


    # 9.3. THE FORMS HELPER


    # 9.3.1. The history of the Forms Helper application


    Work on the Forms Helper started in October 1984. By June 1985 an initial ''proof-of-concept''
    prototype had been built. This prototype included most of the central ideas which
    were to be developed further in later versions: the ''electronic form'' metaphor,
    the idea that the system should recommend to the user the next question to answer
    and the overall notion that neither the system nor the user should have enduring
    control'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Legal Applications of KBS


    over the interaction; instead there was to be ''mixed initiative''. This first
    prototype was, however, too slow to be usable and so video demonstration of its
    main features was produced.


    A second prototype was built in January 1986 which was significantly faster and
    more robust and this was used for conducting experiments with a small number of
    subjects, comparing their performance with the results of previous experiments
    using paper forms. The results of these activities led in the autumn of 1986 to
    the writing of a detailed specification for a second version of the Forms Helper
    [Frohlich and Luff 1986]. A team at ICL built this version during 1987. It was
    demonstrated at the 1987 Alvey conference and subsequently used in an evaluation
    carried out at ICL''s Human Factors Laboratory under the supervision of the DHSS.
    The evaluation suggested, relatively minor improvements which were incorporated
    in the final version demonstrated at the end of the project.


    # 9.3.2. The objectives of the Forms Helper


    The Forms Helper was designed to show how computers could help the general public
    fill in complex forms, in particular those required to claim benefits such as
    income support. Many of the intended user population had little or no experience
    of using computers and know little about the legislation and regulations which
    determine eligibility for benefits. A primary design objective was therefore to
    construct a system which could be used easily without prior training. It would
    guide the form-filler in completing the form ''correctly'' by drawing upon knowledge
    of the questions on the form, effective strategies for completing the form and
    the expectations of the organization which would process them, the DSS. The design
    had to support users filling in a variety of forms and therefore had to provide
    a ''shell'' into which knowledge about each form could be inserted. Another objective
    was to demonstrate the utility of an architecture which would handle ''mixed initiative''
    interaction and investigate the value of this approach to human-computer interaction.
    Lastly, the design aimed to illustrate some general principles of effective human-computer
    interaction which could be applied to other systems [Frohlich et al. 1985].


    # 9.3.3. The development of the Forms Helper


    # Defining requirements


    Because the main objective of the Forms Helper was to make it easier for applicants
    to fill in complex forms, it was necessary to start with an investigation of what
    difficulties people have in completing conventional paper forms. Despite the considerable
    attention that had previously been devoted to the design of forms and, in particular,
    to the supplementary benefit and income B1 application forms, relatively little
    was'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'known about the way in which people fill them in. A study of form-filling behaviour
    was therefore mounted with four unemployed and four employed subjects who were
    asked to complete a copy of the B1, imagining themselves to be out of work and
    claiming benefit. Subjects were asked to read and think aloud the verbal protocols
    were recorded and transcribed. Additional data came from the completed forms themselves
    and from observations made by the experimenter. It was found that subjects ignored
    large sections of the text on the forms — only about one-third of relevant question
    explanations and routing instructions were being read. It was also found that
    form-fillers made a significant number of ‘disoriented progressions’, that is,
    from the expected route through the form. The great majority of these consisted
    of visits to questions which should have been avoided because they were irrelevant
    to the form-filler''s circumstances. The effect of these visits to irrelevant
    questions appeared to disrupt the sense of the ‘dialogue’ between the form-filler
    and the form [Frohlich 1986].


    Following the development of an initial prototype of the Forms Helper, a comparative
    evaluation of form-filling on paper and on the Forms Helper’s ‘electronic form’
    was carried out. Eight subjects were asked to fill out the supplementary benefit
    claim form as it were represented on the computer screen, while ‘thinking aloud’
    about what they were doing. At the same time, the system logged the movement of
    the mouse cursor and key depressions against the system clock. The results showed
    that while the idea of computer support for form-filling had potential, the first
    prototype prototype Forms Helper did overcome the major problem found with paper
    forms, in that the system''s routing guided users successfully through the set
    of questions relevant to their personal circumstances the system''s help and guidance
    on how to answer questions useful, and the system while avoiding irrelevant questions.
    Nevertheless, users did not find the system was too slow and rather clumsy in
