- pgno: 193
  md: '176


    The Policy System


    how we might enhance the capabilities of the final demonstrator.


    # 8.5.2. The English expression of the knowledge base


    In the P3 specification a desire was expressed to achieve anglicized out-put from
    the logical model. This desire was motivated by a need for readability, as the
    outputs as they stood were in the form of symbolic logic, and thus were relatively
    indigible. Thus in July 1988 research began at Liverpool University to achieve
    anglicized output from the knowledge base. The program had three distinct phases,
    two of which have been completed. Phase one had the aim of taking a single triple
    and expressing that in an anglicized form, i.e. a sentence of English text. Thus
    in phase one there was to be a simple, one proposition to one sentence correspondence.
    Phase two took that work and expanded it, treating more than one proposition but
    maintaining the one sentence to one triple so as to introduce cohesive ties in
    the output of related triples. The hope was to achieve more natural-looking text
    by the use of cohesive items such as pronouns. Phase three was to break up more
    than one triple in any sentence, using logical connectives and argument forms
    to produce coherent and readable output text. The first phase specified the knowledge
    base and the subgraph of English used to compose the knowledge base. In this,
    the output grammar for the system was also specified. Thus the problem of adequate
    coverage by the system address what it was required to cover in terms of grammar
    and cover that alone. The system has been rendered portable across applications,
    however, by the use of knowledge based tools to support the output grammar. These
    tools, as a morphological analyser and production unit for verbs, are knowledge
    based and non-application specific. While, the grammar is a limiting factor, the
    system as a whole is relatively portable between applications, as only about 1%
    of the system as a whole, is application specific. While the results of this phase
    are perhaps no different from what could be achieved by associating pieces of
    canned text with triples, such a method would not have allowed extension into
    phases and three. Phase two achieved a knowledge base categorization of English
    pronouns. This analysis looks for the semantic features of any given noun in context
    and then pattern matches the semantic attributes against those of any given pronoun
    until a match is found. The system covers all standard English pronouns, looking
    at structural items such as case as well as semantic features such as sex marking
    and plural referents. Phase three used the Toulmin argument formalism to structure
    arguments into coherent paragraphs of text, as described in [Bench-Capon 1990].


    *'
