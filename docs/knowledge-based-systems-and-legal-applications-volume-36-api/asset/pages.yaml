- pgno: 224
  md: '# Legal Applications of KBS


    House, in Victoria, London in April 1989.


    Demonstr were a very expensive exercise in resources and time. The work needed
    to prepare demonstrations was often underestimated leading, sometimes, to embarrassment
    at the event or regret subsequently.


    Any future project should budget explicitly for this type of activity as ‘squeezing
    it in’ is very bad for progress on other activities. Some members enjoyed presenting
    the project''s work at conferences and exhibitions but others found demonstrations
    very boring and felt that they were being taken away from ‘real’ work.


    # 10.9. EXTERNAL


    Alvey appointed a monitoring officer at the start of the project. The project
    was fortunate to establish excellent relations with him and retain throughout
    the full length of the project. There was also representation from the CCTA on
    the steering team and on OpsCom. These two ‘outsiders’ provided a useful influence
    providing guidance and criticism when needed of the work. They and senior members
    of the collaborating organizations (particularly the DHSS) were valuable in getting
    information and contacts with people doing related work. It certainly seemed that
    this was an effective but not too onerous or costly for the funding organization
    to audit the spending of its funds.


    As expected, the academic members were much more willing to give presentations
    and to publish papers in the learned journals: 114 documents were approved for
    external publication, 13 of which had non-academic authors.


    Relations with the media were good and the project received much ‘good press’
    including a brief piece in a television documentary.


    While the project''s public statements were usually received with interest and
    accepted as being an advance of the ‘state of the art’, a series of attacks from
    one researcher claiming that our intentions were impossible caused a certain amount
    of unease. It was our conclusion that the problem lay in a misunderstanding of
    our intentions rather than a direct disagreement as to what was and was not feasible.


    Two criticisms of the project were particularly pleasing. One, from the project
    monitoring officer was that: ‘wherever I go in your Project tell me the same story’.
    The other from one of the universities was that: ‘our staff on your project seem
    more interested in doing project work than publishing papers’.'
