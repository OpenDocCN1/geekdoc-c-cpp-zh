  md: '# The Representation of Law in Computer Programs


    The programming language PROLOG can also be regarded as a rule-based formalism.
    I have separated out descriptions of the use of PROLOG because there are some
    specific comments that I want to make about this.


    # 1.8.2. Procedural PROLOG


    Several projects have used (procedural) PROLOG as a representation of language.
    Dean Scholzbohm [1985] has written a PROLOG program which helps to analyse the
    rules dealing with ''constructive ownership of stock'' in section 318(a) of the
    US Internal Revenue Code. David Sherman [1986, 1987] has implemented a large PROLOG
    program which models the Income Tax Act of Canada.


    Section 1.10 of this chapter is devoted to the applications of logic programming
    to law. In order to understand why the projects in this section have been listed
    in a separate category, it is necessary to appreciate the difference between procedural
    PROLOG programs and declarative logic programs (which can be executed by PROLOG
    but can be executed in other ways as well).


    The programming language PROLOG is based on logic, specifically on a subset of
    first-order logic which I shall call ''extended definite clauses''; these are
    logical implications of the form A<PW where A is an atomic conclusion and W is
    any expression of first-order logic expressing a set of sufficient conditions
    for the conclusion A to hold. A set of such clauses has a declarative meaning
    which is quite independent of any computational uses it might have.


    One way to use PROLOG is to take a set of extended definite clauses, rewrite them
    in PROLOG syntax, and then execute the result as a PROLOG program. But not every
    PROLOG program is a set of extended definite clauses written in PROLOG syntax,
    and not every PROLOG program can be given a coherent declarative reading. This
    is because PROLOG includes a number of language features which are nothing to
    do with logic. A PROLOG program which makes use of these features has a procedural
    reading only. It cannot be understood independently of its behaviour inside a
    machine. The projects described in this section have used PROLOG, not as a way
    of executing declarative representations expressed in logic, but as a procedural
    programming language in its own right.


    Scholzbohm''s program illustrates this procedural usage of PROLOG most clearly.
    The program operates by asking the user to supply the facts it needs to reach
    a conclusion. The program statement mixes conditions with procedure calls to generate
    the required dialogue and specify which the computation should proceed next. In
    this respect Scholzbohm''s program is very similar to Hellabell''s CORPTAX. Scholzbohm
    states explicitly the order in which questions'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'should be asked, anticipates all possible answers, and specifies which branch
    of the computation is followed for every possible answer. PROLOG execution of
    these statements gives the required behaviour. The program cannot be read declaratively,
    and would not behave correctly with a different execution strategy.


    Schlohm has included in his program the ability to explain its current line of
    reasoning and its final conclusions. These features are implemented by maintaining
    a trace of the reasoning as the computation proceeds. With the generation of dialogues,
    routines which we add to the trace are explicitly generated wherever they are
    required.


    Schlohm''s program is written to execute an algorithm that applies the Internal
    Revenue Code''s provisions in a very specific way. It could quite properly be
    grouped with the algorithmic approaches described in the previous section. Nevertheless,
    although Schlohm''s program does not entirely separate its representation of the
    law from the procedures which apply it, the program does some resemblance to the
    structure of the original legislation. It is fairly to identify those parts of
    the program which express legal rules and in this respect it differs from the
    approaches in the previous section.


    Schlohm''s description of his program includes a full listing of the PROLOG code.
    Some PROLOG statements correspond directly to sections of the Internal Revenue
    Code. Others would correspond directly if they did not contain clauses to generate
    dialogues and affect program behaviour. It is fairly straightforward to extract
    from the listing a set of extended definite clauses which represent the selected
    fragment of the Internal Revenue Code. Once extracted, there are several ways
    declarative representation could be used. One way would be to execute the representation
    using an interpreter that automatically generates requests for the facts that
    it needs and that automatically constructs traces to justify its conclusions.
    This would be a system with the same functionality as Schlohm''s program, but
    based on an explicit, declarative representation of the Internal Revenue Code
    logic, rather than in implicit, procedural representation in PROLOG. This alternative
    approach is described in more detail in section 1.10 on logic programming representations.


    While Schlohm''s program could be grouped with the algorithmic approaches in the
    previous section, Sherman''s PROLOG model of the Income Tax Act of Canada could
    be included, with minor modifications, in the section on declarative logic programming
    representations. Sherman envisages that a user of his program will the facts of
