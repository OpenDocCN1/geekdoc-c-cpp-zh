    # 7.2 EARLY OBJECTIVES


    The project proposal identified the following potential benefits of using knowledge-based
    systems in Department of Health and Social Security work. The project proposal
    identified a key problem in Department of Health and Social Security benefits
    administration: Most of the DHSS areas which demonstrations are currently present
    difficulties, although the rules exist and are carefully laid down in a large
    body of legislation, there are difficulties relating to the size of that legislation;
    and the further rules are in many cases difficult to apply, requiring judgement
    or interpretation in their application.


    Use of knowledge based techniques rather than conventional data processing techniques
    allows solutions to following problems:


    +   1. Applying and keeping up to date a large and complex rule-base.

    2. Checking consistency and completeness of application of the rules.

    3. Handling incomplete and uncertain information.

    4. Handling erroneous information.

    5. User characterization (i.e. modifying the response of a system according the
    the nature of the person using it).

    6. Explaining how decisions have been arrived at.

    7. The modelling of the effect of changes in the legislation.


    The broad aims of the Department''s operational strategy can be summarized as:


    +   1. To improve operational efficiency.

    2. To improve the quality of service to the public.

    3. To modernize and improve the work of the staff.


    Each of these objectives was addressed in turn:


    Taking one DHSS area alone, that of supplementary benefit, staff are currently
    handling some seven million claims per year and producing twenty-eight million
    instruments for payment (mostly manually), and dealing with 92,000 appeals. Using
    these more sophisticated tools they would be able to offer a more efficient service,
