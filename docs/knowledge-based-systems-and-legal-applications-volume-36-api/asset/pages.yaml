  md: '# Legal Applications of KBS


    221


    designing the interaction. It might have been the basis of a graphical user interface
    had that option been pursued.


    Yet another knowledge structure for the domain could be based on organizationally
    relevant distinctions such as ''cash'' versus ''care'' which helps to define the
    boundary for social security (the ''cash'' provision); contributory versus non-contributory,
    means-tested versus non-tested which gave a good indication of the kind of eligibility
    conditions a claimant must satisfy to get each category of benefit; income versus
    capital, a distinction used to structure knowledge for the LOD, which partitioned
    the information needed for the two main aspects of tested benefits calculations.


    As mentioned before, attempts were being made to construct the Advice System knowledge
    base in terms of concepts which were relevant to its users. This was to facilitate
    meaningful scrutiny and allow for the possibility that names for object and attributes
    might be directly useful for system-user dialogue. Using organizational and administrative
    distinctions as organizing principles to structure knowledge gave rise to difficulties
    with the user-driven approach.


    The distinction between contributory and non-contributory benefits has both an
    organizational and a common-sense meaning of the term. D(H)SS use the term non-contributory
    to mean benefits paid out of the national insurance fund and dealt with by the
    ''contributory benefits side of the house [Cordingley et al. 1985] but not based
    on a claimant''s contributions record. Non-contributory benefits, in the common
    sense meaning of the term, are benefits you do not have to pay to. This would
    include all those mentioned so far (i.e. what D(H)SS refer to as non-contributory
    benefits) plus all those benefits paid for by parliament. The implication for
    the Advice System internally, for example in advising users about which local
    office to go to, or for D(H)SS offices which handled all the benefits and for
    the people using them, which part of the office to go to, was inad to use the
    term non-contributory in the dialogue with users. That made certain knowledge
    base distinctions and names unavailable to users during an AS session and would
    make scrutiny of the knowledge base more difficult for evaluators representing
    members of the public.


    The distinction between means-tested and non-tested benefits seems clearer to
    the public than the previous distinction, even though they might not express the
    distinction in these terms themselves. They are aware that for some benefits,
