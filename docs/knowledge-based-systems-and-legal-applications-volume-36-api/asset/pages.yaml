    corresponds to how one expects legislation to be read. However, there are clearly
    numerous occasions when this reading of negation is unwarranted or unacceptable.
    In such cases, extended definite clauses are not expressive enough and PROLOG
    (and APES) do not provide an adequate theorem-proof. Something more sophisticated
    must be used instead. Kwiatkowski [1989] proposes some other treatments of negation,
    to complement negation by failure or to replace it when its use cannot be justified.
    An overview of other developments and extensions is provided in section 1.10.4.


    The process by which most of the examples in section 1.10.2 have been constructed
    contrasts directly with the kind of systematic methodology that Stamper is seeking
    to develop in LEGOL and NORMA (section 1.9). In the case of the British Nationality
    Act, for example, one way to read and use the provisions is as a definition of
    British citizenship, but there are many other possible uses of the same legislation,
    some of which are not related to notion of British citizenship at (to support
    arguments about possible meanings of the term ‘father’ in some other piece of
    legislation, for example). Once some overall goal is identified, as a desire to
    model the conditions which define British citizenship, the representation proceeds
    by precisely whatever concepts are defined in the legislation. Concepts which
    are left undefined in the legislation become the primitive, atomic concepts of
    the representation. In this way, all vague concepts (and other phrases such as
    references to other legislation) become the responsibility of the user. If the
    representation is executed in a system like APES, the user will be asked to decide
    whether a concept holds in the given case. If he refuses to answer then any conclusion
    reached by the system will be qualified by the conditions that were left undefined.


    Note that there is no constraint and no guidance on what should be taken as the
    primitive concepts of the representation. It would obviously be preferable if
    some more systematic method of analysis could be devised, but projects as LEGOL
    have not yet developed methodologies to the level where much assistance can be
    given in the representation of a sizeable fragment of legislation. This remark
    is based on practical experience, and not on any theoretical objection to the
    methodologies which have been proposed, in LEGOL or elsewhere. The question of
    which, and what kind of, primitive concepts to include in a representation is
    discussed further when McCarty’s TAXMAN is introduced (section 1.12) and again
    in section 1.13.4.


    Logic programming techniques have been applied almost exclusively to what Sergot
    [1985a] calls ‘definitional law’ – a fragment of law which is either a definition
    of some legal concept (like ‘British citizen’) or can be taken to be a definition
    for practical purposes. An important simplifying feature of this type of law is
