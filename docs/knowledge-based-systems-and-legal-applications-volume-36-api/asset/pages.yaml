- pgno: 358
  md: '# Legal Applications of KBS


    so much involved in the expertise that it cannot hope to be adequate unless augmented
    by this additional knowledge. Indeed it is precisely this extra knowledge which
    tends to make the system useful and usable.


    The implications for building KBS in law are that we need to identify the task
    we want to support specifically, and this will establish what knowledge is essential
    to the system. Expanding the system to include higher and lower levels of knowledge
    will be of help in so far as it imposes structure and discipline on the representation,
    but will not necessarily give any extra capacity.


    Thinking in terms of expertise can also help to clarify the scale of ambition
    of the system. If we consider the TAXMAN system described in [McCarty 1977], we
    see an ambitious system that wants to solve the kind of very hard case that would
    be the concern of the Supreme Court, (or the House of Lords in the UK). For such
    a landmark case existing expertise cannot be of assistance, for the case is unlike
    any that has been encountered before. Here, then, it will be necessary to return
    to the underlying legislation, if not to the goals which motivated the legislation.
    In extreme cases it may be necessary to consider the validity of the goals themselves
    so as to apply concepts of fairness and justice, in which case we will need to
    represent an extra, higher level of ethical principles as used. In such hard cases
    as these are not enough: rather need all the knowledge that an expert could use
    so that we may develop an appropriate operationalization from first principles.
    This explains McCarthy''s desire for a ''deep conceptual model'', as evinced in
    [McCarty 1989].


    The implications for those who wish to build KBS in law are twofold. Firstly,
    that it is important to identify the task which the KBS is supposed to support.
    This may be no easy matter, given the many levels which can be worked within or
    moved amongst. Nonetheless it is vital to the success of a KBS that it should
    make distinctions: a KBS designed to support members of the public will simply
    not work if it isicates to decide which sources are to be used. The task will
    determine which is included, but it may be desirable to extend the representation
    beyond what is necessary so as to add structure, or the capability to deal with
    questions of natural justice, or whatever. But this extension must be a conscious
    decision: representing knowledge at additional levels will inevitably complicate
    the task. Thus if one is building an application to support advisors of the public,
    it will be more difficult if one starts with the legislation than with the expertise
    of actual advisors, much of which the requisite knowledge will have been pre-digested
    and pre-structured. There could be compensating gains, in terms of maintain or
    of correspondence with some other application, but one should'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'be sure of the need before embarking on the extra effort that such a more ambitious
    approach will entail.


    # 16.3. CONCLUSION


    The area of KBS in law covers a multitude of very different applications, from
    those concerned to tease out the logical structure of a given piece of legislation,
    from those which are supposed to support a particular person in applying the law
    to specific cases, to those which help a person to complete a form necessary to
    claim a given benefit. This variety of applications should be unsurprising given
    the multitude of tasks which are connected with the law, the variety of ways in
    which such tasks can be supported, and the apparent multiplicity of competing
    material which could be used as the basis of a legal knowledge base. What I have
    attempted to do in this chapter is to delineate the various sources and to versa.
    In turn this means that specifying the task which one wishes to support can help
    to identify the knowledge that one needs to incorporate in the KBS. Of course,
    with knowledge, there can never be too much of a good thing (pace Bacon) and so
    it is always open to the builder of a legal KBS to go wider than what strictly
    needs to build an adequate application. There will be some advantages from this:
    perhaps an increase in structure and maintainability if the legislation is included,
    and perhaps an ability to cope with a wider range of legal reasoning or notions
    of justice can be somehow included. The important thing is to recognize what the
    application demands, and so to scope the ambition and knowledge to represent accordingly.
    My aim in putting forward the model described in this chapter was to enable a
    rationale to be given to such decisions.'
