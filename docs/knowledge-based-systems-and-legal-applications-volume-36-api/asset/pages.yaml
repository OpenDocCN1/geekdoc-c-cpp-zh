    An early paper by Layman Allen [1957] recommended the use of symbolic logic as
    a practical tool for analysing and potentially simplifying the structure of legal
    documents. Allen is now most closely associated with his proposals for a normalized
    form for legal documents [Allen 1980, 1982]. Allen''s normalized form is designed
    to improve the precision of legal documents by eliminating unintended ambiguities
    P not the use of vague terms, which are a necessary and desirable feature in legal
    documents, but accidental syntactic ambiguities. Simple examples of syntactic
    ambiguities are constructs like ''A'' and B or C'' where there is fusion over
    the intended way this expression should be bracketed, the use'
