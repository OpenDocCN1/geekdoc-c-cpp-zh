- pgno: 320
  md: '# 14.4.2. Detailed argumentation


    In this activity, the owner or, more likely, another policy worker in the group,
    is developing a detailed policy argument within an element of the problem structure.
    It is in this area where the greatest amount of support can be given.


    As well as access to an executable logic model of the legislation, to stored legislation
    text and to stored policy arguments, we provide a standard form for expressing
    arguments. The rationale behind the use of a standard argument form was for the
    group to co-operate effectively on the development of policy, which they needed
    to have a common language and a common set of objects that they were manipulating.


    The argument form we use is a modification of one developed by Steven Toulmin
    [1958]. This is based on the assumption that the forms of arguments can be expressed
    using a simple syntax. Toulmin distinguished macro-arguments (which are of some
    indeterminate size at least as big as a paragraph of text) from micro-arguments
    (which are at least as small as a paragraph of text). The form he devised for
    describing micro-arguments and the micro arguments developed by policy makers
    during the detailed argumentation phase of their work we offer support in the
    creation, manipulation, storage and retrieval of it. It will be useful to briefly
    review the reasons for the particular form that Toulmin devised.


    If we make an assertion, Toulmin argued, we commit ourselves to the claim that
    if claim is challenged, we will, normally, produce some facts to support it. The
    facts themselves may be challenged and, if so, require their own support so that
    they may be agreed and the argument progress. This gives us a basic and simple
    distinction between a claim and the data which supports it. Of course, the claim
    may still be challenged, not now on the basis of its factual support but on the
    question of why we believe that data support claim. What the challenge demands
    are the "rules, principles, inference licences or what you will" justify the step
    from data to claim. Such justifications warrants can act as bridges and authorise
    the particular step to which our argument commits us''. The basic form of an argument
    is shown in Figure 14.2.


    The nature of our warrant will affect the amount of force that the argument gives
    to the claim. That is, we will need to qualify the claim on the basis of the warrant
    we have used. There are also conditions of exception or rebuttal which might circumstances
    in which the general authority of the warrant would not hold. What is more, the
    authority of the Warrant itself may be challenged in which case we need to provide
    explicit support for it, in the form of a backing. A backing is a statement of
    facts which, in the particular field of argument we are in, can safely be taken
    as certain or self evident. Toulmin''s complete argument form is'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/fd9daa466aa6610f0ebd57e2ccc632c5_321_0.png)


    Figure 14.2: Toulmin’s basic micro-argument form now shown as in Figure 14.3.


    ![](img/fd9daa466aa6610f0ebd57e2ccc632c5_321_1.png)


    Figure 14.3: Toulmin’s complete micro-argument form


    There have been some slight modifications so as to produce a computer-manipurable
    form of micro-argument structure and, especially, to ensure that micro-arguments
    may, where possible, be integrated with the logic model of the legislation. However,
    what we are offering policy workers is essentially the same as as Toulmin’s form.


    The main benefits that a standard form for micro-arguments give to policy workers
    are:


    +   1. The components of an argument (e.g. assumed data, inference warrants) are
    either explicitly stated or are explicitly omitted. In the'
  merge: -1
