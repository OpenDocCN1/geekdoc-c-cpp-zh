- pgno: 26
  md: 'Most of the literature on computer applications to law concerns the retrieval
    of legal documents. Even when this is discarded, the bewildering range of approaches
    remains.


    Different projects address different aspects of the law and activities within
    the overall legal process (such as drafting of legislation, document preparation,
    administration of law, and legal reasoning in general). Projects differ in the
    methodologies they adopt and in their choice of computational technique. Most
    importantly, projects differ in their aims and objectives. Some projects have
    aims that are practically practical. These projects attempt to provide computer
    programs, constructed by whatever means are convenient, to give useful assistance
    in the everyday practice or administration of law. There are other projects which
    see in the law ideal domain in which apply techniques developed elsewhere, typically
    in artificial intelligence. And there are projects whose aims are essentially
    theoretical, where the primary concern is to cast light on the nature of law and
    on the processes involved in legal reasoning.


    It seems that some kind of classification is required. This considers some of
    the possible ways of organizing the projects into general categories, but its
    purpose is not to identify any particular classification. One is ideal. The real
    purpose of this section is to give a general description of the different approaches
    that have been taken, and to introduce the concepts and terminology that are encountered
    in the literature. It is also a means of beginning a recurrent discussion of what
    it means for a computer program to represent the law: a theme which is taken up
    in the commentaries that follow.


    One possible classification is by the particular activity within the overall legal
    process that a given project is designed to support. Litigation and the resolution
    of legal disputes (‘judging’) are only one small fragment of the everyday practice
    of law. Other activities include the design and drafting of legislation, the drafting
    of other documents (like contracts and wills and various notices), routine administrative
    tasks (like the preparation and processing of claims for benefits), and general
    giving of advice. The list is not intended to be exhaustive. Not all of these
    tasks need'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# The Representation of Law in Computer Programs


    engage the services of a lawyer. Many will be undertaken by officials of government
    and other agencies, members of advice giving organizations. Classification by
    activity does not seem to be very appropriate: While some of the projects I have
    mentioned are designed to support one particular activity (Sprowl''s system helps
    with the drafting of legal documents, most are not. In any case, legal analysis
    and planning systems, which are by far the most common type of system proposed,
    could be used in practical systems to support any of the activities mentioned.


    # 1.4.2. Classification by computational formalism


    An obvious and common classification of projects is to look at the computational
    formalism adopted. The choice of computational formalism, however, distracts attention
    from more fundamental issues. It stresses how a particular approach has been implemented,
    rather than its objectives and the assumptions that underlie it. Many of the approaches
    that have been proposed can be re-implemented straightforwardly in a different
    computational formalism. Some examples are provided later. Similarly, many quite
    different approaches are sometimes grouped together, simply because they have
    been implemented in a particular programming language. In particular, projects
    which have used PROLOG as an implementation language are often treated as instances
    of a single approach even though they are actually quite different in nature (This
    is what Susskind [1986a] does in his classification).


    # 1.4.3. Distinguishing between statutes and case law


    A standard and much better classification distinguishes systems that reason by
    rules derived from statutes (and other written rules and regulations) and systems
    that attempt to reason from the decisions of previous cases.


    Although this is a reasonable distinction, I believe it is a mistake to rely on
    it too much. It can give the false impression that reasoning from the decisions
    of previous cases is only relevant to law with a strong common law tradition,
    like the English and American systems of law, which rely to a great extent on
    case law and a formal doctrine of precedent (stare decisis). Reasoning from the
    decisions of previous cases seems less applicable in systems of law which are
    based on civil codes, where the significance of previous cases is given less emphasis.


    Of course, reasoning from the decisions of previous cases is particularly appropriate
    for application to common law systems, because there are many human activities
    that are not governed by statute, by previous cases. A formal notion of precedent
    in common law systems obliges judges to decide new cases in the same way that
    similar cases were decided in the past.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Legal Applications of KBS


    But the presence of a statute can never entirely eliminate the need to reason
    with the decisions of previous cases. This holds as much for civil code systems
    as it does for systems with a common law tradition. There will be circumstances
    where the application of a statute is open to doubt: where there is a dispute
    about the specific meaning of a phrase or section; where a statute includes an
    element of discretion and there is a dispute about whether the discretion should
    be applied in a given case; where it can be argued that there are unstated but
    clearly intended intentions to a statute; where otherwise both apply to the facts
    of a given case but lead to different conclusions; where a statute conflicts with
    more general laws or legal principles (such as a constitution); or simply where
    the rigid application of a statute would lead to undesirable or ridiculous results.


    In such circumstances, a dispute can arise which is resolved by presenting arguments
    for both sides before a court of law (or some other adjudicating authority). It
    would be nonsensical, in any system of law, if the same arguments had repeated
    every time a similar dispute arose. All systems of law have some mechanism for
    recording the decisions of a court. It is only by reference to these past decisions
    that unnecessary duplication of argument, and the possibility of inconsistency,
    can be reduced. The decisions taken in previous cases have always to be considered:
    in systems of law with a common law tradition because there is a formal doctrine
    of precedent; in other systems of law because there is a natural concern for fairness
    and consistency which demands that similar cases be decided in a similar way.
    In practice, legal disputes are resolved in exactly the same way in both types
    of legal system, though there may be a difference in the way that arguments are
    presented and in the way that previous cases are brought to the court''s attention.


    Because the meaning of a statute is open to question, it is open to judicial manipulation
    also. Another objection to distinguishing too much between systems that represent
    statutes and systems that represent case law is that the distinction can be very
    misleading. It can give the false impression that there exists some essential
    difference between reasoning with statutes and reasoning with past cases. In particular,
    it can give the false impression that reasoning with cases is mechanical and certain
    in its outcome, in a way that reasoning with cases is not. Clearly, statutes will
    normally provide fewer opportunities for imaginative interpretation, since most
    are designed to provide relatively relatively precise statements of their intended
    meaning. Clearly, some statutes are more open to interpretation than others. But
    even with statutes an element of uncertainty always remains.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# The Representation of Law in Computer Programs


    # 1.4.4. Open texture


    At this point I introduce the notion of open texture, for this is a term which
    is frequently encountered in the literature, and is the main concern of many of
    the projects to be discussed.


    In any new case we cannot say with certainty what its outcome will be. Statutes
    and case law may provide good guidelines, but it is always possible that a court
    will decide otherwise. We know whether a legal concept applies to cases which
    have been decided by a court. But we have no way of determining with certainty
    whether a legal concept holds in a new case, except by taking the case before
    a court. Until the case has been decided in court, there is no fact of the matter.
    Legal concepts are therefore ''pointwise defined'' and are said to exhibit open
    texture: a legal concept has a precise definition only for those cases which have
    been decided by a court at the appropriate level of authority; there is no precise
    definition of the concept for cases which have still to come to court.


    Vague and discretionary concepts in law are most obviously open textured. But
    even legal concepts which appear to be precisely defined in a statute or code
    exhibit open texture. However however precise definition might seem, it is always
    possible that a court will decide to take a different interpretation of the statute,
    or decide there some good reason why the statute should not be applied in a new
    case.


    The notion of open texture has its origins in the philosophy of language, but
    it is in jurisprudence that this notion has become most useful. The legal philosopher
    Hart, who argues that legal concepts are incurably open textured [Hart 1961].
    Hart''s views, however persuasive and very influential, have not been universally
    accepted. Dworkin [1967], for example, argues that there is no open texture in
    law, because any case, no matter how abstuse, is decided by the proper process
    of legal reasoning and argumentation. These are philosophically interesting positions,
    but the debate seems to have no practical significance. There is no dispute about
    what processes a court should use in coming to its decision. In practice, the
    concepts of law are incurably open textured (if you follow Hart) or behave as
    if they were incurably open textured (if you follow Dworkin, say). Open texture
    in law, which is fairly standard way of characterizing the fundamental uncertainty
    in law, is eliminated only when a case comes to court and a definition is given.


    # 1.4.5. Fixed interpretations of the law


    A classification of projects which distinguishes between statutes and case law
    is not ideal, partly because it can suggest that one is fundamentally more certain
    in its outcome than the other, and partly because some projects attempt to reason
    with both sources of law. I think that a better'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'classification would distinguish systems that represent a single, fixed interpretation
    of the legal sources constructed in advance, and systems that attempt to be more
    flexible in their interpretation of the original sources.


    The distinction can be made clearer if we take the following, simplified model
    of what is involved in determining whether a legal concept applies in a given
    case:


    +   1. Identify relevant facts.


    +   2. Construct legal rule from relevant legal sources.


    +   3. Apply legal rule to relevant facts.


    The stages are not distinct, of course, but are bound together inextricricably.
    In order to determine what the relevant facts are, we must first have some idea
    of what legal rules are relevant and where we can find them. Further, we would
    normally be interested in identifying those legal rules which apply to the facts
    in a particular way, for example in a way that is most favourable to the interests
    of a client; and once a suitable rule is identified and ready to be applied, this
    will turn determine what facts in a case are relevant.


    I am making no claim, therefore for the accuracy of the simplified model. Its
    purpose is merely to provide a basis for classifying projects into various categories.
    Further, ''rule of law'' in any strict sense de relevant, but is intended to encompass
    all that might be deemed relevant. I include in this even the judge''s personality
    or what he ate for breakfast or the opinion of his six-year-old daughter if these
    are considered to have a bearing on the outcome of a given case.


    Examined in terms of this simple model, most of the projects to be considered
    simplify matters still further. They assume, or rather pretend, that ''relevant
    sources of law'' have been identified and that legal rules have been constructed
    from them. That is, they incorporate a single, fixed representation of the law
    constructed in advance, and they concentrate on applying this fixed representation
    to a variety of fact situations.


    It is true that most of these systems consider only statutes and explicitly written
    rules and regulations. If a fixed representation is of much practical value, there
    must be some reasonable consensus that the representation is an accurate model
    of the law. There is less doubt about the accuracy of a model based on certain
    kinds of statute than based on sources of law which are more open to alternative
    interpretation, or where there is some doubt about which legal sources are relevant.


    Further, the majority of projects to be considered implement a form of deductive
    reasoning with rules, and these rules are usually derived from statutes. Computational
    techniques for mechan'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# The Representation of Law in Computer Programs


    reasoning is relatively well understood While applying the provisions of a statute
    can often be seen as deduction, to a first approximation at least, reasoning with
    cases is harder. Reasoning with cases resembles inductive or logical inference
    more than it does deduction (though this does not imply that such reasoning is
    non-logical). Reasoning with cases (or statutes which are open to many different
    interpretations) cannot be approximated realistically by identifying all relevant
    legal sources and deciding in advance how they should be interpreted and applied.
    Identifying previous cases and interpreting the significance of their decisions
    according the context of a new case is where the essential problem lies, and a
    system which eliminates this path altogether is of little or no value.


    It should be noted that no project to my knowledge has attempted to reason directly
    with the sources of law. Reasoning directly with the sources of law would require
    a computer program that could understand natural language at a level of sophistication
    that is well beyond the capabilities of any system that could be constructed in
    the foreseeable future (or ever). Those projects which attempt to reason with
    case law must devise some suitable abstraction and representation of the original
    sources, one which is flexible enough to allow some of the interpretation to be
    delayed and only undertaken by the system as the context of a new requires. What
    characterizes case-based reasoning is the need to leave part of the interpretation
    of sources to the system itself, but successful techniques for this could be applied
    to statute law as well.


    # 1.5. MODELS OF LEGAL EXPERTISE


    This section describes two systems developed by Don Waterman and Mark Peterson
    (LDS and SAL), Robert Michaels''s TAXADVISOR system, and Philip Capper and Richard
    Suskind''s Latent Damage System. All of them are examples of legal expert systems,
    in the strictest meaning of that term. Waterman and Peterson''s approach will
    be examined in most detail. Their systems are unusual in that they attempt to
    address all aspects of the legal decision-making process.


    # 1.5.1. Waterman and Peterson


    The Legal Decision making System (LDS) is a system developed by Don Waterman and
    Mark Peterson which addresses the problem of settling product liability cases
    [Waterman and Peterson 1980, 1981, 1984; Peterson and Waterman 1985; see also
    Cook et al. 1981]. Given such a case, the system determines the defendant''s liability,
    and then calculates the value of the case, which is the amount that would be acceptable
    to all parties as a fair settlement of the case.


    The knowledge represented in LDS is both of a formal kind based'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Legal Applications of KBS


    on legal authority (legislation and case law) and of an informal kind such the
    strategies used by lawyers and claims adjusters in practice, for example in proving
    a product defective. The value of the case is determined by analysing the effects
    of the loss (what type of damage was caused); the probability of establishing
    the defendant''s liability; the percentage of the plaintiff''s responsibility
    in causing the damage; the characteristics of the case, based on such considerations
    as the ability of the lawyers and the personal characteristics of the parties;
    and the context, which includes such elements as the strategy, timing and type
    of claim made by the plaintiff. LDS is a rule-based system implemented in ROSIE
    [Waterman et. 1979].


    LDS differs from systems which seek to perform legal analysis. Waterman and Peterson''s
    aim in LDS is to develop (rule-based) models of the actual decision making processes
    of lawyers and claims adjusters in product liability litigation. In the case of
    LDS, the intention is to use these models to study the effect of changes in legal
    doctrine (what the relevant statutes and cases are taken to) on settlement strategies
    and practices. In order to do this, they modify the rules and note the effect
    on the operation of the model when applied to a body of selected test cases. This
    kind of analysis is undertaken to provide insights that might suggest changes
    in legal doctrine and practice. As Waterman and Peterson [1980] have remarked,
    their system could be used as an expert advisor in product cases with very little
    modification.


    The characteristic feature of Waterman and Peterson''s work is the range of different
    kinds of knowledge which their systems employ. This feature is again evident in
    another example of their approach.


    SAL System for Asbestos Litigation — intended to assist lawyers and claims adjusters
    in evaluating cases relating to asbestos exposure [Waterman et al., 1986]. It
    is currently limited to a single illness (asbestosis) and only one class of plaintiff
    (technicians whose job it is to install asbestos insulation). SAL provides an
    estimate of the sum to be paid in order to reach a rapid settlement of litigation.
    Again, the knowledge employed concerns the loss incurred, the defendant''s liability,
    the plaintiff''s responsibility, and other features of the case such as the personal
    characteristics of the parties in litigation and the ability of the lawyers. SAL
    too is implemented in ROSIE.


    # 1.5.2. Commentary


    Waterman and Peterson''s aim is to model how the law is actually used in practice
    setting certain types of case (product liability). The skill and expertise of
    an expert lawyer obviously involves more than the ability to read legal documents.
    Consequently, Waterman and Peterson''s systems have represent not only the relevant
    sources of law but also how'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# The Representation of Law in Computer Programs


    law is used, and all kinds of other factors which can influence the out-come of
    a case.


    In addition to rules derived from statutes and case law, Waterman and Peterson''s
    systems must represent generally accepted practice (such as that reasonable and
    proper compensation for pain and suffering is normally taken to be three times
    the medical expenses incurred in certain types of case). This type of knowledge
    should not be confused with case law. It has no legal authority (it could not
    be cited in a court of law) but represents only empirical observations of what
    generally seems to happen in practice.


    These systems must also contain a model of the way that an expert lawyer makes
    use of this knowledge of the law. They have to represent the strategies and practices
    that are used by lawyers and adjusters in preparing cases of this kind. They also
    have to represent, for example, a knowledge of what kind of evidence is needed
    to establish some given point, and be able to estimate the likelihood that this
    evidence will prove sufficient. This might depend on subjective criteria like
    deciding how-fully attractive the plaintiff is.


    In order to model accurately what actually happens in practice, Waterman and Peterson''s
    systems must represent the influence of various extra-legal factors on the outcome
    of a case. A lawyer will want to estimate (and exploit if he can) things such
    as the timing of various in the case, the personalities of the parties involved,
    the abilities of the lawyers, and perhaps the personality and known prejudices
    of the judge before whom the case is likely to be heard if it comes to court.
    A project to simulate the subjective decision-making processes of judges who deal
    with particular kinds of serious crime in the USA is being conducted by Bain [1984].


    I have begun this survey of projects with Waterman and Peterson''s work because
    they illustrates the best number of other considerations, besides the law itself,
    which goes towards determining the outcome of a real case. Most other projects
    do not address all the aspects involved in reaching a legal decision. They focus
    on one aspect of the whole, and only that. It follows that other approaches cannot,
    by themselves, be used to determine or predict the outcome of a case. They are
    intended to assist in the analysis of a legal problem.


    The need generally for the kinds of informal ''legal'' knowledge contained in
    Waterman and Peterson''s systems is clearly from common sense. It is instructive,
    to refer to the massive amount of jurisprudential literature devoted to this topic.
    Richard Susskind [1986a] has published a detailed and extensive account of jurisprudential
    material relevant to the computer representation of law. Susskind cites Lord Denning
    in this context:


    The reading of books in libraries — or the attending of lectures by'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Legal Applications of KBS


    professors — gives you a blurred and incomplete picture. In order to understand
    what the law is all about, you must see it working in practice.


    [The Family Story. Butterworths, London, 1983, p 93] Susskind then goes on to
    say (references omitted):


    The second piece of evidence that suggests academic legal knowledge is insufficient
    for legal problem-solving can be drawn from our jurisprudential writings: in the
    American Legal Realists, and in works of social jurisprudence. If there is a central
    theme to American Realism it is that judges do not come to their decisions solely
    on the basis of law-statements. One group of realists ‘rule skeptics’, according
    to Jerome Frank and now to come jurisprudential usage alleged that those putative
    legal rules articulated in judicial decisions, is that, ‘paper rules’, ‘pseudo
    rules’ or ‘accepted rules’ or ‘verbally formulated rules’ were of no use in assisting
    the lawyer in the important job of predicting judicial decisions. For that, they
    argued, it was necessary to divide the ‘real rules’ or ‘latent rules’ which maintained
    were discoverable from patterns in judicial behaviour. The arch rule scept, Llewellyn,
    in fact suggested that these real rules would more suitably designated ‘the practices
    of the courts’, while he maintained that the law was ‘what I officials do about
    disputes’. While the rule skeptics have been criticised widely and convincingly,
    when their (often intentionally) extravagant claims are stripped of their excess,
    and confined to hard cases, one residual thesis is now generally espoused by theorists
    and practitioners alike. That thesis is that in advising clients on difficult
    questions of law, lawyers must look beyond law-statements, and seek to predict
    court decisions. When this is done regularly, general trends emerge and informal
    rules encapsulating these regularities are deployed (often unconsciously, no doubt).
    A contemporary analytical jurisprudent, Harris, has reaffirmed the importance
    for legal scientists of acknowledging social phenomena and social rules beyond
    the law-statements (but has questioned their status as law).


    Another passage from Susskind nearly summarizes two extreme views of the legal
    decision-making process:


    Frank suggests that we reject the formula ‘R x F = D’ which asks us to accept
    as a shorthand representation of the notion that legal rules can be applied by
    the judge to the facts of a case resulting in the mechanical production of a decision.
    In its stead he offers a replacement formula ‘S x P = D’ (‘S’ being the stimuli
    that affect the judge and ‘P’, his personality).


    Both views summed up by Frank’s two equations are extreme. Certainly'
