  md: '# The sequence of events


    A project workshop in summer 1984 was the real beginning for the policy team.
    At that meeting, the planning was done for the first six months of the project
    which included the initial analysis of the policy function. There followed a series
    of interviews which led to the production of a data flow diagram of the policy
    process and the six-stage model of policy decision making outlined above. A further
    useful outcome of this analysis was a hierarchy of policy concepts, intended to
    show the relationship between the terms used in the legislation, with those used
    in the formulation of policy goals, and those used in the legislative terms operational.
    The first six months of the policy application should be thought of as a probationary
    period as it was in this time that the feasibility of policy as an application
    area was assessed and the decision to pursue it further. The technical explorations
    of inference mechanisms appropriate to this activity, as the support of policy
    making proceeded parallel with this, the exploration of particular policy problems
    due to poverty traps for widows and invalids. After the winter project workshop
    of 1984/85 there was a simulation of the widows'' invalid traps and a constraint
    model for consistency checking/evaluation of effects of changes. The feasibility
    prototype (P0), based on this simulation and the feasibility study for the planning
    component was completed by then. The addition of planning facilities to P0 was
    completed by October 1985. There followed a period of concentration on the interface
    to the functionality of P0 and a new prototype, P1, emerged in late 1986 followed
    by a much improved version (P1v2) ready for demonstration in summer, 1987.


    # 8.2.3. The effects of the mid-term review


    The policy application was, in the long-run, not much affected by the mid-term
    review as other applications. It had been, until that time, a coherent and technically
    successful group and was widely considered to be one of the most interesting and
    challenging areas in the project. It had also been fortunate in having within
    several of the project''s most experienced and technically competent members.
    What is more, the difficulties of the period up to the production of P1 all came
    after the mid-term review. It survived the review, therefore, very little changed
    in terms of its scope and objectives. However, the constitution of the policy
    application Team did change considerably between October 1986 and July 1987. This
    period also found the team without any effective management and progress was made.
    The later (July 1987) reorganization of the project teams rectified this but the
    mid-term review can be thought of causing a long and wasteful hiatus in the progress
    of the policy application.'
