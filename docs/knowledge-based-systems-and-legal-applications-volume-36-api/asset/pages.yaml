  md: '# 13.6. CONCLUSION


    This chapter aimed to show the importance of attending to the dynamics of the
    interaction when designing knowledge-based systems. Small changes in these dynamics
    can generally alter the way people use systems. We have also presented the dynamics
    by describing activities the user and system perform at the start, in the body
    and at the end of the interaction. In particular, we have described the interaction
    at two levels, the overall level of control and the local, and examined the places
    where transfer can take place at the local level in terms of giving and taking
    of turns. This may not be enough. In the Forms Helper interaction, the system
    had overall control guiding users from one question to the next. At a more local
    level, when users were given the turn they need not answer the suggested question.
    They could divert from it and answer one of their choice. Similarly, when a user
    was answering a question posed by the Advice System, the user could hold onto
    the turn after answering and volunteer a statement. Both activities occurred during
    what has been defined as a user''s turn, both appear to be taking the initiative
    from the usual ‘flow of interaction’; ‘taking a turn’ from the system. This may
    imply that the notion of ‘mixed initiative’ should be further refined, perhaps
    in terms of multiple levels of initiative.


    We have largely concerned in this chapter with the way control can be transferred
    between users and the two systems. It is possible to see other issues of initiative
    arising. When problems occur in the interaction, when either the user or system
    has trouble with what has gone in the other''s turn, then it is the responsibility
    of one of the parties indicate that a problem occurred and each''s responsibility
    to correct it, though they did not have to. Forms Helper II initiated the correction
    of a user''s ‘error’ by putting a message at the bottom of the screen. It was
    then the user''s responsibility to correct it. When users had problems, they could
    also initiate repair by asking the system for a special sequence when they had
    problems with the other''s turns. We have also looked at the way either the system
    or the user can initiate the start, the end, and new topics for the interaction.
    Rather than refining the definition of mixed initiative, it may be more useful
    to examine the way people use the resources given to them by a computer system
    to perform these activities. Conversation analysis already has such a terminology
    for looking at the way people interact with each other in conversations. The turns
    are taken in conversations have been examined [Sacks et al. 1974]. So has the
    repair of trouble in conversations [Schegloff et al. 1977], the openings of conversations
    [Schegloff 1968], the closings of conversations and the negotiation of new topics
    [Schegloff and Sacks 1973].


    These factors can only be examined when the initiative or control of


