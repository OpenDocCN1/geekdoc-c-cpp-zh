    with developing practical aids, normally to help in the analysis of legal problems
    which are primarily governed by case law.


    This section describes two early projects which have attempted to combine reasoning
    by rules with the decisions of previous cases. Both were conducted as doctoral
    projects. They are Jeffrey Meldman''s study in the tort of assault and battery
    [Meldman 1975, 1977; see also Cook et al. 1981], and Anne Gardner''s treatment
    of offer and acceptance in contract law [Gardner 1983, 1984, 1985]. As mentioned
    in the historical overview, they can be wisely considered together. Other projects
    investigating techniques for reasoning with case law are described separately
    in 1.15 and 1.16.


    # 1.15. Meldman


    Jeffrey Meldman, in his doctoral project at MIT, designed a system to perform
    a ''simple kind of legal analysis'' on cases involving assault and battery [Meldman
    1975, 1977; see also Cook et al. 1981]. The analysis was based on a (tiny) fictitious
    body of legal sources Corpus Juris Mechanicum (CJM) extracted from a standard
    textbook on tort by Prosser. The sources comprised a collection of ''legal doctrines''
    and a set of cases and their decisions. Both were to be represented in the same
    way, in a kind of semantic network. The user would present a semantic network
    describing some hypothetical set of facts and the system would determine the extent
    to which these facts ''fell within legal doctrines by syllogism'' (applied its
    rules to the facts) or ''near to these doctrines by analogy.'' (Meldman was careful
    to stress that his system supported a very simplified form of analogy.) During
    this process, the system would ask the user for any additional facts that it needed
    to perform the analysis. It would then report its conclusions, justified by reference
    to the legal sources in CJM.


    Meldman''s system was designed to be executed by a system called OWL [Szolovits
    et al. 1977], though it was never implemented. Later, a program based on Meldman''s
    design was implemented by King [1976] who placed more emphasis on reasoning by
    analogy than Meldman did originally.


    There are three main features that characterize Meldman''s system: the nature
    of the legal sources represented, the choice of representational formalism, and
    the general approach to legal analysis and the treatment of case law specifically.


    A standard text like Prosser''s on tort has a special status in (English and American)
    common law systems. It presents the author''s commentary and personal analysis
    of some area of law, and therefore is only a secondary source of law; but eventually
    it is referred to extensively and takes on such authority that it becomes effectively
    the source in its particular area. It contains a collection of the most'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'important decided cases, organized by what the author has identified as broad
    general principles or rules, or what Meldman calls ''legal doctrines''. These
    general doctrines account for most cases have been decided; but there are also
    references to cases which seem to be exceptions and to cases which contain some
    unusual feature that the general doctrines cannot capture. Because of the authority
    that such a text eventually accumulates, its doctrines can be regarded as almost
    like legislation (though they are not as detailed as typical statutes). Meldman''s
    Corpus Mechanicum (CJM) recreates this type of legal source, containing a few
    general doctrines together with a set of decided cases that supplement them. (In
    CJM all cases provide additional detail rather than exceptions to the general
    doctrines.) Meldman''s system would work in exactly the same way as statutes supplemented
    by case law.


    Meldman''s design uses a semantic network to represent the sources and a ''matching''
    operation to perform the analysis of a new case at hand. However, it is fairly
    straightforward to recast this representation in more familiar rule-based format.
    The following account is in terms of rules rather than the original semantic networks,
    but it preserves all the essential features.


    Some of the rules in Meldman''s system represent the general doctrines of the
    CJM. When the facts of the case are to be analysed all the conditions of a rule,
    the rule is applied by deduction and the case falls within a legal doctrine by
    ''syllogism''. This part of the processing is standard. It is the treatment of
    the individual cases that needs more.


    For individual cases, Meldman''s approach is to view the decision in a previous
    case as evidence for the existence of a detailed but still general rule of law.
    This model of reasoning with case law is supported explicitly by the system: the
    decision in a previous case is represented as the general rule which corresponds
    to what is often referred to as the ratio decidendi of the case. (There are usually
    several general rules which can be extracted from a single case: in Meldman''s
    system there is only one.) Judges rarely state the ratio decidendi of a case in
    explicit and precise terms; normally the ratio decidendi has to be reconstructed
    by some from the judicial arguments used to justify the decision. It should be
    clear that there is consequently severe doubt over what is or was intended to
    be the ratio decidendi in a given case. Indeed, arguments over the meaning of
    a legal concept can often be reduced to disputes over what the ratio decidendi
    of a previous case should be taken to be. In Meldman''s system the rule expressing
    the decision of a case is constructed explicitly by him.


    The ratio decidendi of every decided case in CJM is represented in exactly the
    same way as the general legal doctrines. So now, if the facts'
  merge: -1
  img_proc: true
