  md: '[a claimant is not required to be available for employment if] he is regu-lar
    and substantially engaged in caring for a severely disabled person


    Now this could be formalised in a variety of ways. Simplest would be the purely
    propositional


    F1 a-claimant-not-is-required-to-be-available-for-employment

    <- he-is-regularly-and-substantially-engaged-in-caring-for-a-

    severely-disabled-person


    This may be adequate for some purposes, but fails to reflect any of the inter-structure
    of the constituent propositions, most notably in this case, that the same person
    is the subject of both. So we could move to a predicate calculus representation
    with unary predicates:


    F2-is-not-required-to-be-available-for-employment(X)

    <- regularly-and-substantially-engaged-in-caring-for-a-

    severely-disabled-person(X)


    But these unary predicates could be decomposed further:


    F3-is-not-required-to-be-available-for-employment(X)

    <- regularly-and-substantially-engaged-in-caring-for(Y,X)

    & is-a-severely-disabled-person(Y)


    Or even


    F4-is-not-required-to-be-available-for-employment(X)

    <- engaged-in-caring(for(Y,X,regularly)

    & engaged-in-caring-for(Y,X,substantially)

    & is-disabled(Y,severely)


    What determines which of these representations is best is the utility of mak-
    the decompositions. In particular we need to know whether the components into
    which much will be lost by not making the decomposition. If they are not unlikely
    that much will be lost then the consider-derations of grain size of predicate
    have consequent implications for the expressive power of the knowledge representation
    formalism. Here, F2 requires that we have more than a propositional logic, F3
    that we refer- to more than a single individual, and F4 that we do not restrict
    ourselves to binary relations. (Of course we could rewrite F4 using only binary
    relations, but this would again represent a departure from isomorphism.) Although
    systems have been built using propositional logic, and a quasi-propositional logic
    allowing no more than F2, we cannot say at the outset that F4 would not be appropriate
    and so make provide for this in our knowledge representation formalism.


    So far, the demands made on the representation have stayed within the bounds of
    well-known formalisms. A specific problem, however, derives from the fact that
    legislation typically contains explicit references to pieces of legislation, either
    within the same statute or elsewhere.'
