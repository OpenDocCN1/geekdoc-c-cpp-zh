  img_proc: true
- pgno: 102
  md: '# Legal Applications of KBS


    meaning of certain words — sometimes this explanation may take the form of a ‘rule’
    which clarifies or illustrates a term, at other times it may be a more general
    discussion of a term or phrase. Some case law is not directly concerned with the
    features of a claimant''s circumstances and the applicability of the statutes
    to them, but rather with the procedures followed by the adjudication officer and
    the Department, including the adequacy and role of evidence used to arrive at
    the decision. Social security decisions are also, of course, by other case law
    where this is relevant — particularly cases from administrative law and rulings
    from the European Court.


    It is too early for many cases on income support decisions to have been heard
    by the Commissioners, although other case law for social security benefits is
    applicable where common concepts are used. Many benefits include such common or
    closely related topics: e.g. ‘living together as husband and wife’, ‘capacity
    for work’, ‘residence in the UK’. In general, case law is most frequently used
    by adjudication officers in order to clarify and help interpret specific clauses
    in the regulations. As a result, with exception of certain general areas (such
    as ‘living together’ cases where special training is provided), usually a very
    small number of cases are relevant to the decision. It is therefore atypical of
    adjudication officers to be overwhelmed with a large number of relevant cases
    in many areas of law. Equally, the general rules and principles from case law
    are often incorporated into the overall guidance, training and support of adjudication
    officers. Nonetheless, adjudication officers are presented with the common problems
    of not finding the relevant case, finding difficulty in establishing whether a
    case is still applicable (or has been overturned by another decision or by changes
    in the legislation), unaware of the relevance of case law outside of their own
    benefit area, and having insufficient experience and skill in how to use case
    law in helping to decide a case. Some help is provided in finding relevant case
    law by indexes of commissioners’ decisions. A number of different indexes are
    available, some produced by the training organization, others produced by local
    offices. An indexed digest of social security case decisions, produced excerpts
    from case law, was produced in Negigan’s Digest [Negigan 1986]. This is now only
    used to a limited degree, with adjudication officers depending on the Adjudication
    Officer’s Guide (AOG) to notify them of, and give them references to, relevant
    case law.


    The guidance provided to adjudication officers is intended to address many of
    the complexities in identifying and applying the relevant legislation and case
    law. Much of the guidance involves a restructuring of the conditions of the regulations
    so that for certain types of case, and recurring problems, the procedural sequence
    of steps in the assessment are made clearer and more accessible. Similarly, it
    contains ‘pointers’ to other relevant areas (for example, para 2500: ‘In no circumstances
    can a'
