    Stopping


    At any point in the interaction the user could stop the system (by pressing the
    Stop button) otherwise the system would continue recommending questions to answer
    all relevant questions had been answered. This included any questions that had
    been skipped by the user. These were returned to after other all relevant questions
    had been attempted. Only when the user answered all the relevant questions did
    the system stop cycling through the form. A message appeared in the help area
    to signal that no more answers were needed.


    # 13.3.2. Evaluation


    Methods


    Following a study of paper form-filling ([Frohlich 1986], a similar study of electronic
    form-filling was carried out using Forms Helper I. A mixture of employed and unemployed
    people tried to fill in a representation of the claim form for supplementary benefit
    (the ‘B1’) using the system. This was the form used in the previous study. Users
    were asked to read and ‘think aloud’ as they interacted with the system, tape
    recordings and observational notes being made of comments. It was also possible
    to produce a paper of the completed form at the end of the interaction and a log,
    kept by the system, recorded both user and system actions as they took place.
    All these materials could be combined to study what had taken place. More details
    of the methods and results of this study are given in [Frohlich 1987]. In the
    following sections we concentrate on those findings that relate to the mixed-initiative
    nature of the.


    Starting


    For the evaluation of the first version of the Forms Helper we gave the users
    using some training beforehand and as users had to select the Start Button there
    is little to say about how users initiated the start of the interaction.


    Overall mixture of initiative


    Although the system led the interaction and recommended questions to the user,
    we found that the users selected a large proportion of questions to answer. The
    mean proportion of user-selected visits initiated by the user was 37.4% [Frohlich
    1987], some subjects initiating over half the visits. Even though it was possible
    to be led through all the questions by the system, the lowest proportion of visits
    initiated by a user was 15%.


    One of the reasons users selected so many questions was not to answer them, but
    to look at them. When paper form-fillers have a'
