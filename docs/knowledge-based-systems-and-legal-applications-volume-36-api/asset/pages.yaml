- pgno: 38
  md: 'purchased in bookshops and department stores for use on micro-computers.


    # 1.7.2. Decision nets


    A recent example of the attraction of flowcharts is provided by the DataLex project
    [Greenleaf et al. 1987] where they play a fundamental role. This project has been
    developing a programming shell LES (derived from Legal Expert System) for building
    applications in law. A central module in LES allows a lawyer to construct what
    the authors call decision nets or decision networks. These decision nets constitute
    the main component of MOST LES applications. Since they are executed by an inference
    mechanism consisting of the explicit interconnections between the modules which
    are activated by responses supplied by the end user, they seem to correspond exactly
    to what I have called flowcharts. The LES shell translates decision nets into
    a C program which is then compiled to produce an executable program. There are
    other modules in the LES shell to cope with case law and text retrieval. The case
    law is sketched briefly in section 1.17.1 on case-based reasoning.


    # 1.7.3. Commentary


    The programs by Hellawell and Bellord, the flowcharts advocated by Twing and Miers,
    the decision nets used in the DataLex project, represent legal provisions implicitly.
    A statute or some other piece of legislation is represented by an algorithm which
    is designed to apply the statute''s provisions to the facts of a given case in
    a certain, very specific way. Because of the direct correspondence between a flowchart
    and a program which can implement it, I shall regard flowcharts as a type of computational
    formalism, whether or not the algorithms they express are ''executed'' by a human
    agent or a computer. There are three points that have to be made about the use
    of this type of computational formalism for representing the law.


    Firstly, there is the difficulty noted by Hellawell (and Bellord) Legal provisions
    are seldom expressed as detailed algorithms, and the task of converting even a
    small fragment of legislation into this form is so daunting that it becomes practically
    impossible. Experience with other techniques (following sections) demonstrates
    that the difficulty of the task can be significantly reduced by choosing a more
    appropriate, higher-level, non-algorithmic computational formalism. The use of
    a rule-based programming language, for example, would be a natural and obvious
    choice. It would allow the resulting representation to resemble more closely the
    structure of the original text. And it would reduce the need to design a specific
    algorithm, since this would largely become the responsibility of the program executor.
    Several'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# The Representation of Law in Computer Programs


    projects in which rule-based and other high-level programming techniques have
    been used are described in the next section. The authors of the DataLex project,
    incidentally, argue just the opposite: that flowcharts have significant practical
    advantages over rule-based techniques, particularly where the representations
    are to be constructed by a lawyer [Greenleaf et al. 1987].


    Secondly, algorithmic representations of law are typically very poor as regards
    their transparency. An algorithm for applying a piece of legislation to the facts
    of a given case specifies one particular way of using the legislation. Its structure
    will normally not reconstruct the structure of the legislation. The alternative
    is to construct an explicit representation of the legislation and describe separately
    procedures to apply it. Again, higher-level computational formalisms are better
    suited to achieving this separation.


    The third point, and one that is seldom mentioned, is to devise a suitable algorithm
    for what the legislation is to be used for. If one looks at a piece of legislation,
    it is immediately clear that there are many purposes for which the legislation
    is passed. A statute, may define a legal concept in more or less precise terms,
    but it will also include many types of provision, describing for example how the
    statute affects other related legislation, specifying penalties that will be incurred
    if its provisions are transgressed, or setting out general requirements for the
    procedures to be used in an administration. An apparently simple statement like
    ‘claimants must submit applications before 1 January’ can be read in many different
    ways. The statement tells a claimant how much time he has to prepare his application.
    It helps the administration to determine whether an application should be rejected.
    It could even be used by a lawyer in arguments about the meaning of ‘valid claim’
    or ‘submitted’ in other areas of law.


    It should be clear, then, that one cannot begin to devise an algorithm to apply
    legal provisions without determining first its intended purpose and by whom it
    will be used. I do not want to give the impression that determining the intended
    purpose of a computer program that represents the law is a major practical problem.
    In practice, one approaches the construction of a program (or algorithm or flowchart)
    with an intended use in mind. This is implicitly assumed by Twining and Miers,
    for example. I wanted to make the point here, where the question is fairly clear,
    rather than when discussing higher-level, non-algorithmic computational formalisms
    where the same point arises but is less obvious.'
