    for which objective criteria can be established, in the process of narrowing down
    the area of ''quality assurance'' the value of the resulting system is appreciably,
    perhaps even dangerously, reduced. The overriding lesson for us has been that
    concept of evaluation as a single discrete event or checkpoint which objectively
    assesses the acceptability of a system is really misplaced. Any system that has
    undergo evaluation and assessment of its reliability is not dissimilar to that
    which would be placed on a human decision maker.


    # 15.2.6. Techniques, methodology and outstanding issues


    A wide variety of techniques were used during the project to address these wide
    range of issues. Soft Systems Methodology (SSM) [Checkpoint 1980] was used as
    a key part of the organizational analysis. Its particular advantages were seen
    to lie in its emphasis on the variety of organizational perspectives considering
    both the activities of the organization and the knowledge used by them, and the
    explicit consideration of the monitoring and evaluation of decision making. In
    this it was possible to establish where exactly support was required and how it
    could be provided, along with the associated issues of validation and maintenance
    of the knowledge. Traditional social science techniques were applied for eliciting
    models of the decision processes and conceptions of the knowledge used. Primarily
    this involved (structured and unstructured) informant interviewing, but to a lesser
    degree included the use of construct theory and protocol analysis. Particular
    emphasis was placed on the training, monitoring and guidance-provision aspects
    of the tasks. Underlying of all of these techniques it was essential to understand
    the role of knowledge as part of a dynamic, negotiated, organizational communication
    rather than some neutral objective commodity which could be stored in a machine.
    User committees were therefore established including representation from each
    of the major interest groups. Substantial effort was devoted to selecting and
    developing the interest and commitment of representatives and their colleagues.


    By far the most important factor in the successful aspects of the design, however,
    was the element of creativity and conflict in the design team and the development
    of arguments to justify the selected designs. In essence the motivation behind
    the design needed to be ''sold'' to the potential users. The importance of these
    human skills used to question the eventual relevance of a search for methodology
    to address these issues.


    The most effective design is one that integrates the user and system in an adaptive
    and novel manner — opening up the possibilities for new ways of working. To achieve
    this the designer must be able to'
