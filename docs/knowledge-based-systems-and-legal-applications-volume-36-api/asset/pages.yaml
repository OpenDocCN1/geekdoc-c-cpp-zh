  md: '# 1.13.3. ESPLEX


    The ESPLEX system [Biagioli et al. 1987] is being developed as part of the Automated
    Analysis of Legislation project which has been conducted at the Istituto per la
    Documentazione Giuridica (IDG) in Florence since 1981. ESPLEX combines the use
    of logic for the representation of rules embodied in legislation with the use
    of frames and semantic networks to model the general legal concepts that are required
    to understand the legislation. The experimental domain for the project is the
    law relating to agricultural tenancies, part of the law of contracts. A main objective
    of the ESPLEX project is to develop a methodology for the analysis of legislation
    which takes into account the different kinds of sentences and concepts contained
    in legal rules. The implementation language used is PROLOG.


    Work in the general field of computers and law has been conducted at IDG since
    (at least) the early 1970s. Abstracts and references to projects are are Biagioli
    and Fameli''s bibliography [Biagioli and Fameli 1987].


    # 1.13.4. Commentary


    In TAXMAN I, CCLIPS, Hafner''s LIRS, ESPLEX (and LEGAL and NORMA) there is emphasis
    on the underlying conceptual model and on the choice of primitives in terms of
    which the representation is constructed. All of these conceptual models are ''deep'',
    but in quite different senses of the word. In later projects (notably TAXMAN II
    and the Language for Legal Discourse) ''deep'' can be applied in a different sense
    still.


    The conceptual model in TAXMAN I contains primitives ''corporation'' and ''ownership''
    and many relationships between them. Hafner''s is like this ''deeper'', and in
    many ways. One possibility is that it could be made ''deeper'', and in many different
    ways. One is to follow CCLIPS and attempt to reduce everything to some set of
    very primitive ''Schankian'' concepts. Another is to follow Allen and Saxon''s
    recommendations [(Allen and Saxon 1986] and section 1.11.1) of ''duty'' etc. Thus,
    ''ownership'' could be expressed as some package of Hohfeldian concepts which
    capture something of ''ownership'' means. For the Language for Legal Discourse
    (section 1.16.3), McCarthy reports another set of useful primitives. With NORMA
    (section 1.9), Stamper has proposed thinking in terms of agent, intention and
    behaviour. All of these are candidates for a set of primitive concepts. All of
    them would yield a ''deep'' conceptual model. I am making comment on their relative
    merits. My intention is simply to point out many different kinds of deep conceptual
    model there can be.


    In some countries, the academic legal tradition is to account for'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Legal Applications of KBS


    describe some area of law in terms of an underlying normative or ethical or sociological
    theory. Here, something like ''contract'' might be regarded as a particular kind
    of ''social interaction'' (say) and elements of contract law would be explained
    in terms of how social interactions must work for moral, ethical or pragmatic
    reasons (whatever). In English and American legal circles, the tradition seems
    to be more empirical, by which I mean that there is little emphasis on presenting
    underlying theories of law or society to account for why cases have been decided
    in the way that they have. Different traditions could also be reflected in what
    an underlying conceptual model has in.


    As a concrete example, consider ''deep'' representations of ''borrowers'' must
    return books to the library by the date. I wish to reduce a verb ''return'' to
    some combination of abstract primitives ''abstract transfer of possession'' and
    ''transfer of physical location''. Or ''book'' could be represented as a particular
    kind of ''communication medium'' or as a particular kind of ''library resource''.
    Or I want to concentrate on the modality ''must'' and express what this means
    in terms of deontic or Hohfeldian concepts. If I were a sociologist I might want
    to view the regulation in terms of primitives like ''administrative convenience''
    or ''anti-social behaviour''. As a very extreme example, I might choose to assert
    that the library is a bourgeois institution.


    All of these options are possible and all have their uses. All of them are ''deep''
    in some sense of the word.


    I stress again that I wish to draw attention to the many different kinds of conceptual
    model there can be.


    # 1.14. SYSTEMS THAT COMBINE STATUTES AND CASE LAW


    All of the systems described so far are based on a model of the law that represents
    one fixed interpretation of the legal sources. (And for the reasons explained
    in the introduction, they have largely concentrated on statutes). They have avoided
    the problems of reasoning with concepts with several possible meanings by approximating,
    or by passing responsibility to the user. I have mentioned only in passing the
    possibility of removing this intention. Even though one of the main aims of the
    work by Waterman and Peterson has been to investigate the effects of other models,
    this has required altering the rules in the model explicitly. At any one time,
    their model of the law is fixed. Other systems have taken a similar line.


    The projects which are described in the rest of the chapter have attempted to
    reason with representations of law that do not embody a single, fixed interpretation
    of the legal sources. These systems cannot rely completely on inference which
    is purely deductive (or which can be viewed as an implementation of deduction).
    Many of them are investigating the nature of legal reasoning itself. Others are
    primarily concerned'
  merge: -1
  img_proc: true
