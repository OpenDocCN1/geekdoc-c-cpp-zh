- pgno: 18
  md: '# PART I


    # CONTEXT


    The majority of the chapters in this book describe work based on the Alvey DHSS
    Demonstrator project. The purpose of this part is to provide the context into
    which the project fitted: for research does not proceed in isolation, but is influenced
    both by what went before, and by contemporary developments. The first chapter,
    by Marek Sergot - a distinguished figure in the field of KBS and law, and who
    while not a full participant in the demonstrator project, had close links with
    it for much of its life - is an authoritative survey of a number of different
    approaches to the representation of law in computer systems. The second chapter,
    written by the Trevor Bench-Capon, sets out the opportunities that the demonstrator
    project presented; the scale and nature of the enterprise meant that these were
    quite different from those that had been afforded by any previous undertaking
    in the field.'
  merge: -1
  img_proc: true
