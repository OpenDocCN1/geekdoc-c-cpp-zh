    # 3.3.2. Tasks


    It is common to distinguish the application of clear rules, and calculation of
    arithmetic values, from the aspects which incorporate interpretation. This is
    to adopt a perspective which is predominantly implementation based: how is it
    to computerize these decision making processes? It is clear, that it is dangerous
    to separate the treatment of hard and easy cases in practice — not least until
    a case is finished it is difficult to be sure which category it falls into. Equally,
    it is naive to believe that certain types of decision involve exclusively ‘rule
    reasoning’ while others exclusively ‘case-based reasoning’. From a human decision
    making perspective the tasks of the adjudication officer more naturally fall into
    the categories of identifying relevant entitlement rules, interpreting the facts
    of the case and deciding how to apply the rules, working through the sequence
    of decisions defined by these facts, and justifying the overall decision. The
    importance of these tasks is that complexities derive from the rules, from the
    facts of the case, and in particular of the matching of these two.


    In terms of the rules, there is an apparently overwhelming quantity of explicit,
    complex rules which need to be adhered to. There are two types of complexity typically
    arises when there is a large number of rules, when the set of rules include obscure
    or rarely used conditions, when the relationship between rules, and the effects
    they have on each other, is complex. Domain complexity can lead to situations
    where a rule is forgotten, or it cannot be found. It can also lead to the misapplication
    of rules or application of the wrong rule. Lastly, it can lead to situations where
    the interactions between rules, for example where one rule overrides another and
    changes the way in which it should be applied, inappropriately handled. Procedural
    complexity arises when there is a process to go through which may be inherently
    straightforward but which involves a complex sequence of steps. This complexity
    may be due to many sub-procedures, which can often lead to excessive memory loads.
    Equally, it may require the involvement of more than one individual. Alternatively
    it may just be poorly specified and difficult to comprehend.


    In principle, procedural complexity can be controlled by the'
