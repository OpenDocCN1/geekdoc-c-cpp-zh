    It is not clear, however, that these problems deriving exclusively from the rules
    themselves are the major or most frequent sources of problem to the trained or
    skilled legal decision maker. The set of issues most frequently arising for this
    class of decision maker are those relating to what can be called ''problems of
    categorization''. Pursuing the earlier analogy further would be like finding half
    dozen books which all seemed potentially relevant and not knowing which was the
    best. Categorization problems arise because of the necessity to interpret and
    apply a limited number of rules to a wide variety of specific and often unique
    circumstances. They can present themselves in a number of ways:


    +   1. There can be a disagreement or uncertainty about what facts behind a case
    were or how they should be described.

    2. The case may be an example of an extraordinary contingency not obviously covered
