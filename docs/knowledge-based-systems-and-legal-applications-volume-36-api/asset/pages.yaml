- pgno: 40
  md: '# Legal Applications of KBS


    # 1.7.4. Data-processing applications


    There is very little difference between a program like Hellawell''s CORPTAX and
    a typical data-processing application such as a payroll system. In both cases,
    analysis involves the construction of detailed algorithms to apply the appropriate
    legislation: sections of tax statutes in the case of CORPTAX, other rules and
    regulations in the case of a data-processing system (tax legislation in the case
    of a payroll system also). Implementation is the task of expressing these algorithms
    in a suitable programming language. In both cases, the resulting programs execute
    an algorithm which applies the provisions of a statute or a set of regulations
    to the facts of a given case. In CORPTAX many of these facts are obtained by asking
    the user questions as the algorithm is executed. In a typical dataprocessing application,
    these facts would normally be determined in advance and stored in a file or database.
    Data-processing systems are normally used to process many cases one after the
    other, and might have to generate various documents and files in addition. But
    the basic processing in both types of program is essentially the same. Hellawell
    and Bellord use BASIC to express their algorithm. Data-processing systems use
    COBOL.


    Many of the limitations of Hellawell''s CORPTAX, and programs constructed by similar
    means, can be traced to the use of inappropriate computational formalisms. Higher-level
    programming techniques can ease the task of representing the relevant legislation,
    and will usually improve the transparency of the resulting program. It can be
    argued that these alternative techniques would improve conventional data-processing
    systems also. Data-processing applications could be implemented with explicit
    representations of the regulations they administer, and analysed and specified
    in terms of these regulations from the outset. As mentioned earlier, the central
    role of rules and regulations in data-processing applications is due to Ronald
    Stamper, and provides one of the main motivations for his LEGOL project, and provides
    in section 1.9.


    # 1.7.5. Limitations


    Later sections describe projects which have constructed legal analysis programs
    by explicit representations of the law, in a variety of computational formalisms.
    It is important to draw attention first to the nature of the legal knowledge that
    is typically represented. This question is relevant to the algorithmic representations
    of law discussed in this section as is it to those alternative representations
    described later.


    All the programs described in this section, Hellawell''s and Bellord''s tax analysis
    programs, conventional data-processing programs, the flowcharts suggested by Twining
    and Miers, and the decision nets of DataLex, represent a single, fixed interpretation
    of the legal sources on which they are based. In all these examples it is assumed
    that the author'
