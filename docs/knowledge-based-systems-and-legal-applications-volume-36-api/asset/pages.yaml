- pgno: 177
  md: '160


    The Local Office System


    This type of system would arguably help skills to develop if it meant that more
    people read the guidance, but would not have the major benefits which we were
    were looking for. It would do nothing in terms of explanations to claimants, supporting
    appeals (except in that appeals officers would be another, perhaps more frequent,
    class of user), or monitoring. It could help with flexibility in terms of distributing
    the guidance and conditions to the decision makers more quickly — but it would
    not make it read.


    # 7.11.2. Logical encoding of legislation


    Systems based purely on logical encoding of the legislation reflect a misunderstanding
    of what adjudication is about — it is not just about the correct application of
    legal rules. The model of support in such systems is based on guiding the decision
    maker through a pre-defined network of rules. The emphasis that DSS staff all
    put on is it much more concerned with the specific facts of a case, the weighing
    of evidence and the role of interpretation.


    The model of support which follows has two main features. Firstly, it requires
    that the users should predominantly able to interact with ''real world'' descriptions,
    objects and attributes rather than ''legal'' terms and categories. Secondly, the
    role of the encoded legislation should be based on constraining the decision maker
    to justify their decision by reference to the facts of the case and the applicability
    of particular rules to those facts — the relevant network of rules is selected
    by the decision maker to justify their conclusions.


    # 7.11.3. Experient procedural support


    This type of support would attempt to identify some general procedures, strategies
    or task knowledge which could be used to construct a system which identified the
    ''best'' way of handling a particular case or topic within a case and guided the
    user through these procedures as though they being led by an expert. The problems
    with this suggestion are firstly, whether it is possible to build and maintain
    a useful system of this type for supporting adjudication, and secondly, whether
    it would be appropriate to do so.


    Constructing a system of this presumes that there is, in fact, a generalizable
    approach to handling cases, if applied, would be better than that used by AOs.
    While it might be possible to sit down with an AO and explain the best way of
    dealing with a particular case, it is doubtful whether it would be possible to
    define a general procedure for tackling all cases. This attitude is actually reflected
    in the Adjudication Officer''s Guide (AOG). If it had been possible to identify
    some general solutions would OCAO not have incorporated them into the AOG? In
    fact, the style of the AOG is explicitly and intentionally counter to'
