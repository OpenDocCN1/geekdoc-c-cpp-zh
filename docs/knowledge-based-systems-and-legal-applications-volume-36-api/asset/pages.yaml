    Because the system was intended only part of the full range of social security
    benefits, it was decided to include only those that are likely to be relevant
    to lone parents. This target group was selected because of the relatively high
    proportion of lone parents who claim social security benefits. One in seven families
    with dependent children is headed by a lone parent. In 1986, 55% of one parent
    families compared with only 7% of parent families were dependent on social security.
    Apart from pensioners, one parent families have for many years been the largest
    group of people claiming benefits. Aiming the demonstration at lone parents means
