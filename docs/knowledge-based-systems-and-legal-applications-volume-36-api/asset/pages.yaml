  md: '# Analysing texts for knowledge based systems


    The one in Figure 11.1 showed the complexity of welfare provision. Three sectors
    (represented by bold ovals) provided welfare - central government, local government,
    and the private sector. All three were involved in education, health and housing
    (represented by the irregular outlines), the problems as our users might express
    them. Provision is made by ''cash'', rebates or allowances, services and provision
    in kind. Distinctions such as ''medical needs'' catered for by the NHS through
    ''health needs'' catered for by the local authority social services department
    are likely to be a source of confusion about where to go for. The welfare world
    is complex, as here, without including most of the social security benefits.


    This was one of the diagrams which made it apparent that there would be several
    kinds of knowledge needed in the Advice System knowledge base. Details about the
    features of the benefits - for example, the period payment covered, in that period
    a payment was made, whether there a limit to how low a benefit could be claimed,
    benefit rates and conditions of eligibility — were what we called ''static'' knowledge.
    Static knowledge would be put in the system by the knowledge bases and altered
    only as a maintenance task typically when regulations or rules for benefits changed.


    The system would hold this as a hierarchy of classes (with their attributes) and
    rules. This knowledge would not change during an advice session with a user and
    would be the same for all users. This knowledge was later referred to Gilbert''s
    work on question and answer types [Gilbert 1987] as domain-level knowledge. Theory-level
    knowledge, knowledge about why the benefit system is as it is, would also be static
    knowledge in the sense the term is used here. Details relating to a particular
    person or claim could not be built into the system in the same way. It would not
    be the same for all users. There would have to be some mechanism to allow the
    user to put these details during an advice session. If, unlike the Advice System,
    a system were built with stored personal material, a mechanism would be needed
    to retrieve it from store or read it into the system until the user indicated
    what he or she wanted advice about. The objects which held this knowledge were
    instances of the class. This would alter during an advice session, thus dynamic
    knowledge seemed an appropriate label.


    Personal characteristics, even persistent ones such as a person''s sex, and historical
    information were dynamic in this sense. This was case-level information in Gilbert''s
    scheme.


    The procedural knowledge, relating to actions, was the third kind of knowledge
    identified. A design decision was made to have this knowledge handled by the planner
    rather than the inference engine underlying the toolkit which handled the dynamic
    and static knowledge. Procedural knowledge was, therefore, analysed separately.
    In the end, however, much'
