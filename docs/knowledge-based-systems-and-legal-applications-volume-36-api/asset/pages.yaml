    in terms of misleading or confusing the user over the potential significance of
    the rather obscure conditions.


    Problems with case law are perhaps more complex. How do we avoid the ''overloading''
    of the user with an excessively large volume of apparently relevant cases?


    If we are providing access to individual cases, how is it possible to communicate
    why the case is significant and what its relevance may be for the case under consideration
    by the user? Although it may be an oversimplification, a distinction can be made
    between cases that expound a general principle and therefore have a widespread
    impact and those which give detailed consideration to the facts of a case, and
    are distinguished from other similar cases.


