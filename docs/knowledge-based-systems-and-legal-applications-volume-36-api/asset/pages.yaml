    # Acquisition, analysis and encoding


    The process of building a knowledge base can be thought of having three stages.
    The first, acquisition, is where the raw data are gathered by the knowledge engineer
    from whatever are the appropriate sources. The next step, analysis, is where the
    knowledge engineer takes the structure and content of the knowledge base that
    has been gathered and derives it from the structure. This is expressed in the
    form of some kind of intermediate knowledge representation formalism. Lastly,
    in encoding, the knowledge engineer must enter the analysed knowledge into the
    target system in an appropriate formal notation.


    # Acquisition and analysis


    The primary sources for policy knowledge bases have been the relevant Acts and
    Regulations although for P0 the Child Poverty Action Group handbook was also used.
    Normally, a distinction may usefully be drawn between domain and task knowledge.
    In the case of the policy system, the task knowledge is expressed as the policy
    system software and the explicit knowledge is purely domain knowledge. A major
    part of the analysis effort for the policy application team was in discovering
    what was the task knowledge needed for policy making. The knowledge-base builders
    had a much simpler time in that the domain knowledge represented the legislation
