    # 1.53. TAXADVISOR


    The TAXADVISOR system was constructed by Robert Michaelson in his doctoral research
    at the University of Illinois [Michaelson 1982, 1984; Michaelson and Michie 1983].
    TAXADVISOR is designed to assist lawyers with tax planning for clients with large
    estates (valued at more than $175,000). The system, implemented in EMCYCIN, collects
    data about clients and makes recommendations and suggestions for organizing their
    estates. Entering into life insurance contracts and retirement schemes, making
    wealth transfers, gifts and purchases are all things which can improve the client''s
    tax position. TAXADVISOR is concerned particularly with the strategic planning
    aspects of this problem, rather than with the analysis of facts to determine tax
    results. It is imagined that the tax effects of any recommendations would be calculated
    by a more conventional program.


    The knowledge represented in TAXADVISOR comes primarily from lawyers'' experience
    and the strategies they use, especially the criteria that experts use to guide
    them in formulating financial plans. Michaelson notes that for cases which fit
    the special area treated, validation by several practising accountants indicated
    that about two-thirds of TAXADVISOR''s recommendations were identical to those
    the experts would have made, while the remaining one-third were different but
    still acceptable planning options.


    TAXADVISOR belongs to this section because it is another example of a system that
    has concentrated on modelling, not so much the law itself, but rather how a knowledge
    of the law is actually used in practice.


