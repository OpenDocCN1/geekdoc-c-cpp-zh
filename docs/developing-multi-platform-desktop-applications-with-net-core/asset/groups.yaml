    # For ubuntu:


    Linux have been developed for good part with the Opensource model thus Ubuntu
    does not provide any dedicated subscription for the developer using their system
    (it is more like a community of interests). Nevertheless, you can subscribe to
    Linux, GTK (gnome) and QT dedicated developer''s web sites.


    +   - https://gnome.org

    +   - http://linux.com

    +   - https://ubuntu.com/community

    +   - https://developers.redhat.com

    +   - http://qt.io

    +   - https://www.linuxfondation.org


    # For macOS:


    The proprietary aspect of the macOS system have for consequences that it is the
    less documented of the three systems from the developer point of view (even if
    it''s getting better with the time). The most useful information about the development
    on this platform is only accessible if you have a developer account (that''s free)
    on the apple web site.


    +   - https://developer.apple.com/


    The access to C# developer web sites and general developer''s Q&A web sites are
    also often useful when you develop an application on your own (without mentor).'
