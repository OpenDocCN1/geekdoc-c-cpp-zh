    https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet/

    https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-build

    https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-publish


