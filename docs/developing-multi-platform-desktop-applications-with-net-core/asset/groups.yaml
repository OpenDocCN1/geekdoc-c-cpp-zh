    \ Used for updating the data on the server\n- DELETE: Used for deleting data on\
    \ the server.\n\nAs one of the key design goals for .NET core is to minimize the\
    \ size of the .NET core installation, you will have to add the required dependency\
    \ (package) to your project.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_80_0.png)\n\
    \nOnce you have added the required dependency you can start the process of using\
    \ the REST service. You can achieve that through three basic steps (this sample\
    \ is the consultation of a service):\n"
  mdcn: "\n\n安装与往常一样，可以使用包管理器，也可以直接从 Visual Studio 项目窗口（管理包）进行。\n\n### 5.3.4 数据模型\n\
    \n使用 EF Core 开发应用程序时，可在两种不同的方法之间进行选择，以实现与数据库的集成：\n\n- A) 模型优先：\n\n使用此方法时，数据模型由你的数据模型（通过代码）定义。当使用数据库存储应用程序生成的数据时，采用这种方法很有意义。当数据库尚未定义，或从头开始开发应用程序时，使用模型优先存储。\n\
    \n- B) 数据库优先：\n\n使用此方法时，你需要对数据库进行逆向工程以生成数据模型。当使用预先存在的数据库，或当数据库由团队的其他成员（例如数据库开发人员）开发时，使用此方法。\n\
    \n要从数据库启用数据模型的脚手架，首先需要安装所需的包：该包将允许你使用 PowerShell 命令：`Scaffold-DbContext.`\n\n\
    以下是在包管理器窗口中执行此 PowerShell 命令的示例命令：\n\n```\nPM>Scaffold-DbContext\n-Connection\n\
    \"Server=(localdb)\\\\mssqllocaldb;Database=MyDb;Trusted_Connection=True;\"\n\
    -Provider\nMicrosoft.EntityFrameworkCore.SqlServer\n-OutputDir ./DataModel\n-Context\
    \ MyDbContext\n-Tables <tablename>\n```\n\n这种“脚手架”将生成 .cs 文件，用于定义你在代码中可以操作的对象。默认情况下，数据库中的每个对象都会生成一个文件，但你可以指定要为哪些表生成（例如，使用\
    \ -Tables 针对特定表）。编写本书时，不允许对特定视图或存储过程进行脚手架生成。\n\n请查阅工具提供的在线帮助，以获取可用于生成所需数据模型的所有选项列表。\n\
    \n### 5.3.5 使用 EF Core 的建议\n\n使用 EF Core 开发应用程序（使用 Visual Studio 2019）时，应考虑使用\
    \ Visual Studio 市场上提供的专用插件，例如 Entity Framework Visual 编辑器、EFCore PowerTool、EntityDeveloper\
    \ Express：\n\n- https://marketplace.visualstudio.com/items?itemName=ErikEJ.EFCorePowerTools\
    \ 图表模型\n- https://marketplace.visualstudio.com/items?ItemName=michaelsawczyn.EFDesigner\n\
    - https://marketplace.visualstudio.com/items?itemName=DEvartSoftware.EntityDeveloperExpress\n\
    \n这些 Visual Studio 扩展不仅是简化使用 EF Core 编码工作的插件，还允许你以图形方式建模数据架构（Visual Studio 中尚未内置此功能），它提供了与\
    \ Entity Framework 6 中已有的相同工具（你的数据的图表模型）。\n\n你还可以使用专用产品（面向专业用户）从数据库生成对象（ORM）：\n\
    \nDevart Software 的 Entity Developer（与免费插件相同的软件发布商）是一款产品，为你的 ORM 数据模型的构思和/或生成提供了原创解决方案（多目标\
    \ ORM：NHibernate、Entity Core ...）。该工具将使工作更加轻松，并大大节省保持数据库与数据模型同步的时间。\n\nhttps://www.devart.com/entitydeveloper/\n\
    \n### 5.3.6 EF Core 基本用法示例\n\n以下是一个示例程序，用于说明使用数据模型优先的 Entity Framework Core（请注意，原样复制并不简单，通常出于明显的可读性原因，你需要在不同的源\
