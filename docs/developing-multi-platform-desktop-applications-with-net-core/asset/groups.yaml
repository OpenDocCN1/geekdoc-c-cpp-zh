    ### 9.4.3.3 On Windows


    For building CoreRT machine native executable from the main development platform,
    you have to install the C++ tools “Desktop development with C++” in the Visual
    Studio 2019 installer program as shown in the picture below.


    ![](img/3d310cc066dda6e2dfa67a650614076f_278_0.png)


    This is the only requirement for the prerequisites of CoreRT on this platform.


    Once you have a proper building environment for each OS, you can start to produce
    machine native executable of these platform.


    ### 9.4.4 Machine Native compilation scenario


    The implementation of CoreRT in your project has to be integrated as soon as possible
    in your project development, to verify if there is no conflict with the tool and
    the source code you develop.


    The CoreRT have to be implemented by code (in our case C#) inside your source
    file, for doing so you have to follow a simple method.


    ### A) Add the required package to your project


    Package:


    Microsoft.Dotnet.ILCompiler


    For including the CoreRT capabilities to your project, you have to add the dedicated
    package. This package is still in alpha version and available only on the Microsoft''s
    myget.com repository.


    If you want to use the already built assembly, you have to configure a new package
    source address in the NuGet package manager of Visual Studio.


    The address to access Microsoft''s myget (a compatible NuGet repository) repository
    is:


    ```

    https://dotnetfeed.blob.core.windows.net/dotnet-core/index.json

    ```


    Here is the preview of how it can be done inside Visual Studio 2019 though the
    “Options/NugetPackageManager” menu.


    ![](img/3d310cc066dda6e2dfa67a650614076f_280_0.png)


    (Add new NuGet package sources)


    After the “ILCompiler” package appears in the list of the available packages to
    install.


    As you can see in the picture below, you could find other interesting and useful
    packages for other aspect of the development.


    We recommend you to spend some times for the review of the other packages of this
    “experimental” repository from Microsoft.


    ![](img/3d310cc066dda6e2dfa67a650614076f_281_0.png)


    TIPS: You can specify custom source for the NuGet packages by adding a file in
    your project folder, “nuget.json”.


    But using the NuGet package is not the only solution for the use of CoreRT in
    your program. You also have the possibility to retrieve the CoreRT solution (from
    its GitHub repos) and add it to your project for a direct reference on the project.
    This last method has the advantage that you are sure to use the last version of
    CoreRT (at the time you retrieve the CoreRT source code) but it requires much
    more code maintenance and the build have to be done with the dotnet CLI tool.


    ![](img/3d310cc066dda6e2dfa67a650614076f_281_1.png)


    ### B) Compile the project with CLI (dotnet publish)


    Here are the available platform types you can specify for the compilation. These
    RID (Runtime Identifier) are used to identify the platform where the developer
    plan to run the native application (this is only the Portable RID) and produce
    an executable for:


    ### For Windows:


    - win-x64

    - win-x86

    - win-arm (na)

    - win-arm64 (na)


    ### For Linux:


    - linux-x64

    - linux-musl-x64 (Alpine)

    - linux-arm (Raspberry Pi) (?)


    ### For macOS:


    - osx-x64 (macOS version 10.12 minimum, see prerequisites for .NET Core 3)


    Be aware that the CoreRT tool is an experimental tool, It is not working for several
    platforms defined above (arm target is not currently working), you have to make
    some research on this specific subject before the start of the implementation
    of this tool for exotic target platform. You can find more information about specific
    system RID at the reference links below.


    https://github.com/dotnet/corefx/blob/master/pkg/Microsoft.Core.platforms/readme.md

    https://docs.microsoft.com/en-us/dotnet/core/rid-catalog/


    Once you have chosen the platform you want to perform the building process among
    those RIDs, you can use the “publish” command. The RID can be specified in the
    publish command line or inside the .csproj file.


    Here is a sample command line instruction for actually generating the final native
    executable for windows 64, this command is working if you are in the application
    folder, if this is not the case you have to specify the path where the compiler
    can find the .csproj file of the project.


    ```

    C:\appFolder> dotnet publish -c release -r win-x64

    ```


    Here is the same command line example for targeting macOS (on macOS).


    ```

    $ dotnet publish -c release -r osx-x64

    ```


    Be careful, you cannot build a release targeting the macOS or Linux platform on
    the Windows since CoreRT does not provide cross-platform build feature.


    ### C) Publishing with CoreRT using Visual Studio


    Cherry on top, you can actually build the machine native executable for Windows
    of your .NET Core 3 application directly from Visual Studio 2019 by using the
    “Publish” option of the contextual menu on your project. Here is a view of the
    typical setup of the publishing properties for achieving that goal.


    ![](img/3d310cc066dda6e2dfa67a650614076f_284_0.png)


    Note that the specified folder in “Target location” could not be the one actually
    used for the output of the machine native file (you could find the executable
    in a “native” folder), so check carefully the “Release” folder for finding the
    executable (even if you get error message at the end of the publishing process).


    ### 9.4.5 CoreRT console project example


    For helping you in the use of the CoreRT for the production of a machine native
    executable of your .NET Core 3 program, here is an example project who includes
    the several configuration files (.csproj) used for the generation of specifics
    executable for Windows, ubuntu and macOS.


    This sample is a basic program developed for a console used, it is called “HelloCoreRTWorld”.


    Following the previously described process for the creation of each machine native
    executable here is the size of this executable on each platform.


    | Platform | Size of the executable (Ko) |

    | :--- | :--- |

    | .NET Core 3 | 70Mo |

    | .NET Core 3 (FDD) | 156Ko |

    | Windows Native | 5Mo |

    | Ubuntu Native | 5Mo |

    | macOS native | 11Mo |


    (approximative sizes)


    The machine executable includes all the required .NET Core dependencies. Remember,
    that the storage size of the executable could be a great advantage for using CoreRT
    (compared to the size when you deploy the complete runtime) in the production
    of the executable file of your application, but the performances are a strong
