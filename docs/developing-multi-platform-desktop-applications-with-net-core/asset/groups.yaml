    \n## 5.4.4 REST 客户端示例代码\n\n以下是一段代码片段，用于说明在您的 .NET Core 3 应用程序中使用 REST Web 服务。\n\
    \n### ProgramRESTClient.cs\n\n```\nBasicHttpBinding basicHttpBinding = null;\n\
    EndpointAddress endpointAddress = null;\nChannelFactory<IAService> factory = null;\n\
