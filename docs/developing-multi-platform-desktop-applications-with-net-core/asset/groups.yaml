    \n# ProgramConfig.cs\n\n```\n```csharp\nusing System;\nusing System.IO;\nusing\
    \ Microsoft.Extensions.Configuration;\nusing Microsoft.Extensions.Configuration.Json;\n\
    \nnamespace ConfigProgram {\n    class Program {\n        static void Main(string[]\
    \ args) {\n            var config = new ConfigurationBuilder()\n             \
