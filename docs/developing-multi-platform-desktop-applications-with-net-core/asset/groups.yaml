  - '[PAGE 120]


    The ASSERT object validates a result object with the expected object. This validation
    validates the test (indeed).


    ASSERT is used for the validation of the test. This validation can be done by
    controlling the result value of the method you test. ASSERT is a class of the
    namespace Microsoft.VisualStudio.TestTools.UnitTesting.


    The test validation can be done by using the following methods (not an exhaustive
    list) of the ASSERT class:


    +   - ASSERT.AreEqual(): Validate the function tested, by checking the value of
    the result of this one (but you have to know the result value).

    +   - ASSERT.AreNotEqual(): Validate the function (test passed ok) if the result
    is not the value tested.

    +   - ASSERT.Same(): Validate the function if the resulted object and the expected
    object are of the same type.

    +   - ASSERT.NotSame(): Validate the function if the result object and the expected
    object are of different type.

    +   - Assert.IsNull(): Validate the test if the value checked is equal to Null.

    +   - Assert.IsNotNull(): Validate the test if the value checked is different
    from Null.


    There are several other ASSERT methods available (see documentation in reference)
    for various test validation types but these ones are used in most of the cases
    encountered by developers (these are the most often, actually, used).'
