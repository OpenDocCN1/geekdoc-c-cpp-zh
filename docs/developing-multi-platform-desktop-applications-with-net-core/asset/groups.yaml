    of your project. It works perfectly with Visual Studio 2019 and include the basic
    features for this kind of application.


    ## 8.8 COMPARISON OF THE SOLUTIONS REVIEWED


    As we have seen these examples provide, each in its own way, solution who address
    a peculiar issue or requirements of your multiplatform project development. Here
    is recapitulatory list of these development types in correspondence of their specificities
    and features.


    The following table (Table 1) aims to help you to choose what kind of solution
    to use regarding the type of constraints and requirements your software has.


    | | Advanced graphic design | Standard GUI (form) | Interface Language | GUI design
    tool | Performance | Dependency weight |

    |---|---|---|---|---|---|---|

    | Console GUI | no | Yes | No | no | good | light |

    | LibUI (with wrapper) | yes | yes | No | no | very good | light |

    | GTK# | yes | yes | Yes | Glade | good | light |

    | QML.NET | yes (FX) | yes | yes | QTdesign Studio | good | medium |

    | Electron.NET | yes HTML | no | yes | yes web design | average | heavy |

    | Avalonia | yes | Yes | yes | no | good | Medium |


    With this table you can quickly review which type of application matching most
    of your needs for the development of your project, but this list of criteria is
    may be not matching every constraints of your project, if that’s the case you
    have to study more carefully each solution proposed previously in this chapter.


    The choice of the tool (and API) you intend to use for the implementation of your
    .NET Core 3 GUI will predefined your application graphical capabilities, the storage
    size required (including the dependencies) and the performances. It is a crucial
    point, choose the tool the more adapted for the purpose of your application.


    Each type of application previously presented requires (at some point or another)
    the use of a machine native layer who will allow the rendering of your application
    on the specific platform, verify, before starting to code, that the solution chosen
    provide all the functionalities required by your application’s specifics.


    ## Chapter 9. COMPILATION AND BUILD WITH .NET CORE 3


    The process aiming the production of an executable program is decisive in the
    software development life cycle, especially for the multiplatform development
    context.


    The type of distribution you plan to use for your project (Internal, Opensource
    or Commercial ...) will be determinant for the choice of the type of compilation
    and building options you will select for the release of your project.


    We can define three kinds of target audience for your software:


    - Your software is an integrated solution addressing the user (whatever the license
    type: commercial, shareware, Opensource based software).

    - Your software is a company-oriented solution (software solution provider).

    - Your software has to be deployed only inside your company (internal software).


    In these three cases you will have to build your project according to different
    constraints, and the production environment will define the kind of build you
    will choose for the release of your software.


    For doing so, .NET Core 3 offer you a wide range of solutions for the compilation
    and the build of your multiplatform software.


    - FDD: Framework Dependent Deployment: This is the .NET Core classical .dll file,
    the .NET Core 3 runtime (shared) have to be installed on the target computer,
    this is the default building configuration in .NET Core 3.

    - SCD: Self-Contained Deployment: The application output folder contains all the
    dependencies needed for running the program (the .NET Core 3 runtime is included).

    - FDE: Framework Dependent Executable: The application output is a .NET Core 3
    executable, but like FDD the shared .NET Core 3 runtime is mandatory on the target
    machine

    - Native machine executable (specific file for each platform): The application
    is a machine native executable who still requires the dependency of the project
    but not the .NET Core 3 runtime (it can be produced with CoreRT).


    The choice between these four types of release will be made from the type of GUI
    solution you have chosen and the type of deployment you want to use (it is often
    defined from the project context).


    We will review these types of solution and try to help you choose the most adapted
    to your requirements.


    Whatever the kind of release you want to achieve, we recommend, for a better visibility
    of OS specific issue(s), to build the project separately on each platform: build
    the ubuntu project on ubuntu, macOS on macOS and Windows on the Windows platform
    (The commands of the dotnet CLI are the same among the presented platforms).


    For doing the compilation and the building of your .NET Core 3 application you
    have the choice to use the CLI dotnet command or to use MSBuild from Visual Studio
    2019 (it is not exactly similar just yet).


    In the present chapter you will learn also how to produce, with the dotnet CLI
    (command line tool) and/or CoreRT, either a MSIL executable (who require .NET
    Core 3 runtime to be installed) or a native executable for each OS you are targeting
    (and thus losing the need for the installation of the .NET Core Runtime).


    This choice depends of the type of GUI solution you are using (if it requires
    native dependencies) and the type of distribution you plan to use for your release.


    With the review of the distinct features provided by each tool used for this task,
    you will find the most adapted solution for the definition of your building process.

    '
