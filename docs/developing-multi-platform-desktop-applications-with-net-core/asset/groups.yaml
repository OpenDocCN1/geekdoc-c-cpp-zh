- raw:
  - '[PAGE 50]


    +   - Align your controls (right) and try to size them identically (when it is
    not interfering with the first recommendation).

    +   - Layout balance, the layout of the window has to use both side of the window
    (left and right), if a side has more controls than another, try to resize it (bigger)
    or move it on the other side by the use of a group control.

    +   - Layout resize, if the window is resizable make sure the resize in a wider
    window will display more data, but take care also of the amount of data on the
    minimal size of the window.


    # 4.3.1 Type of controls to use


    Here some recommendations for choosing the type of control regarding the logical
    case it should solve:


    +   - Do not confuse checkbox and radio button.

    +   - Do not use command buttons as toggle.

    +   - Do not use tabs as radio button.

    +   - Do not use to many tabs.

    +   - Do not use non-editable textfield (if that’s not editable that’s a label).

    +   - Do not use textfield when you can use another control.

    +   - Use default value for input fields and control.


    # 4.3.2 How to use controls


    Every standard control (or widget) available in your system should be used in
    its own standard way. Do not implement special behavior to a standard control
    (define a new one if the requirements are very specific) and try to stick to the
    standard use of each control.'
  - '[PAGE 51]


    Here is quick guideline for the use of the most common controls (widgets) you
    will have to use in the conception of your windows:


    # Text (label):


    +   - Text of the GUI have to be minimal (the average user does not read it anyway).

    +   - You have to use the user terminology and vocabulary (not the IT).

    +   - Do not capitalize the name of the controls you use: group, menu, toolbar,
    tooltips...


    # Buttons:


    +   - Do not use generic labels (except for the Cancel button), use specific terms
    related to the domain of your application.

    +   - If the button is used to respond to a question be sure the application will
    propose at least two options (not only one button for an interrogative window).

    +   - Align all the buttons of the same functional level (left, right top or bottom
    of the layout or group to the one it belongs). Align to the bottom of the window
    the command buttons.


    # Input:


    +   - Try to use a minimum of textfield control.

    +   - Choose wisely between listbox, option button and checkbox.

    +   - The size of the control has to be proportional to the data expected (size
    of the textfield box).


    # Menus:


    +   - Avoid multiple cascading menu as possible (use contextual menu instead,
    avoid too much intricacy).'
  - '[PAGE 52]


    +   - Name the items of your menu with accuracy (The label explicit the exact
    function).

    +   - Add the menu items the user is expected (not according to your backend architecture).


    # Toolbars:


    +   - Use as much as possible standard icon for the function.

    +   - Choose different icon for different function (avoid similarity between icon
    as possible).

    +   - Add button to the toolbar only for frequently use functions.

    +   - Avoid to display more than 4 toolbars at the same time (it can become confusing
    for the user).


    Here are some recommendations regarding the good use of the “Error message” dialog
    box:


    # Error messages:


    +   - Do not give error messages if the user did not perform any action.

    +   - Error message have to propose a solution to the user for fixing the problem
    (when it’s possible).

    +   - Do not use “OK” on the button if there is no solution for the user use “Close”.

    +   - Do not add sound effect.

    +   - Use error icon and explain to the user what he can do.

    +   - Do not use the words :

    +     - Error , failure (use “problem” instead)

    +     - Failed (use “unable”)

    +     - Illegal, bad (use “incorrect” or “not valid”)

    +     - Abort, Kill, Terminate (use “stop”)'
  - '[PAGE 53]


    +   o Catastrophic, Fatal (use “serious”)


    # 4.3.3 Sketch the application window


    In any case this is best to sketch your screen before the development, that will
    allow you to visualize if the design you thought about is matching your expectations
    when it comes to real design.


    By sketching your screen design, you will identify screen with too much information
    or too empty or simply not kind to the eye sight (there is a large subjectivity
    in this matter)


    There is many dedicated software available for the realization of the sketch of
    your GUI. Most of them are online tools. Here is a non-exhaustive list of the
    most recognized of these online tools.


    ![](img/3d310cc066dda6e2dfa67a650614076f_53_0.png)


    Of course, you can use dedicated desktop applications for the design of the mockups
    screen of your project.


    **DesignerVista** is the ideal choice if you do not use the services of a professional
    designer and if you do not have design competences. With this tool the mockup
    of the screen(s) can be done by developers.


    Here is a screenshot of DesignerVista, a software for designing a user interface
    mockup.'
  - '[PAGE 54]


    ![](img/3d310cc066dda6e2dfa67a650614076f_54_0.png)


    You could also use the designer favorite tool Photoshop for achieving the design
    of each screen (even if that''s seems a little oversized for a sketch), there
    is several GUI toolkit for photoshop freely available.


    The freely application Adobe XD can also be useful even if that tool is more a
    web site and mobile oriented application.


    The choice of the tool for the design of the user interface of your application
    will be determined also by the kind of technology you have chosen for your application.


    +   - http://www.adobe.com/products/xd.html

    +   - http://www.adobe.com/products/photoshop.html

    +   - http://www.designervista.com/'
  - '[PAGE 55]


    # 4.3.4 Typography


    The choice of the fonts you use for your project depict significance of the application.


    Most of the time you will use the standard system font (especially if you use
    Native GUI). But the font is now a mark of intellectual sophistication for users
    to notice it.


    The choice of a proper and coherent fonts is among the substantial tasks when
    you design a User Interface of an application.


    In a context where the user (corporate) already have internal or dedicated font,
    use it at the outside (the most).


    If you have some latitude regarding the graphic design of the GUI, choose a font
    corresponding to the culture of your target audience


    You can use the online resources for getting an idea of the diversity typography
    can offer to your text.


    +   - http://www.dafont.com

    +   - http://www.fontsquirrel.com

    +   - http://www.fontspace.com

    +   - http://www.fontstorage.com

    +   - http://www.abstractfonts.com

    +   - http://www.1001freefonts.com


    If you want to use an especial font you can use program to convert between Windows,
    Linux, macOS and/or modify it according to your wishes.


    Although FontLab is the reference for the creation of font, many freely software
    are available. The references programs for creating/converting/modifying fonts
    are:'
  - '[PAGE 56]


    +   - http://www.fontlab.com (Fontlab and Transtype)

    +   - http://fontforge.github.io/

    +   - http://birdfont.org/

    +   - http://cr8software.net/typelight.html


    These tools will allow you to use “the” font you have decided to use for your
    application regardless of the multiplatform requirements in that matter.


    # ## 4.3.5 Color scheme


    The color scheme (combination of colors) is a point to not overlooked when you
    design your interface.


    For multicultural environment consider the culture where the application is executed,
    in this case you have to define a color scheme specific for each culture your
    application target (for example: the difference between Asia and Occident for
    the color of the trend in financial market: green<<->red)


    The use of color is determinant in two foremost reasons:


    +   - The look and feel of your application. The perception of the application
    by the user is conditioned, at least in part, by the use of specific color’s scheme.


    +   - The highlight of significant information on your window, when you have a
    large amount of data display. You can choose flashy color for getting the user
    attention on what is important in the screen you display.'
