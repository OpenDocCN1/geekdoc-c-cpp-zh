    \ Menu.\n- Label text.\n- Textbox input.\n- Button.\n- Option.\n- Radio.\n- List.\n\
    \nThis sample demonstrates how the implementation of controls can be done in your\
    \ screen and illustrates how to implement multiple windows in one screen within\
    \ a console application.\n\nThe “consoleFormApp” illustrates also the use of a\
    \ custom ColorScheme struct. This project example furnishes a facade pattern useful\
    \ for calling native code specific on each platform (with the display of the current\
    \ system name).\n\nYou can find the full source code of this application on the\
    \ netcore3 GitHub.\n\n### 8.2.4 Pro/cons console GUI\n\nThe console GUI is a fantastic\
    \ choice for developing a GUI:\n\n- minimum of resources requirements.\n- Perfect\
    \ multiplatform coherence (you can choose to have only one source code for all\
    \ the platforms).\n- Straight forward development (only one project to develop\
    \ your application).\n- Simplicity for the deployment and packaging.\n\nBut this\
    \ solution can not address every application:\n\n- Application with advanced charts.\n\
    - Application with intensive graphics use (picture or video).\n- Advanced navigation\
    \ system.\n- Accurate mouse support.\n\nIn conclusion, the use of the console\
    \ GUI can address basic GUI needs, for console tools but is not adapted to most\
    \ advanced application's requirements like: graphic display, chart, animation\
    \ and advanced interactivity of the interface.\n\nFor all these requirements you\
    \ will have to choose another GUI solution presented subsequently.\n\nHere are\
    \ some pointers for getting the complete online documentation and an example project\
    \ used for checking the dependencies of a .NET Core 3 project (could be useful).\n\
    \n```\nhttp://migueldeicaza.github.io/gui.cs/api/Terminal.Gui.html\nhttp://www.github.com/mholo65/depends\n\
    ```\n\n## 8.3 ELECTRON.NET: ASP.NET GUI APPLICATIONS\n\nUsing the ASP.NET Core\
    \ framework sounds like a relevant choice when you need perfect matching of the\
    \ interface look and feel across heterogeneous platforms. This method requires\
    \ a good knowledge of the ASP.NET core web development (and JavaScript).\n\nActually,\
    \ this type of solution for the implementation of a desktop application appears\
    \ to be an ideal choice for ASP.NET Core developer because the all software development\
    \ life cycle is very similar to the development of a classical web application.\n\
    \nThere is no doubt that the knowledge earn in this section would be useful for\
    \ the development of such application with the future release for .NET Core 3\
    \ as well.\n\nThe type of development using Electron.NET is, at the current time,\
    \ not executable from Visual Studio and many Electron specific tasks have to be\
    \ done with the .NET Core SDK CLI.\n\nThe Electron.NET wrapper is not conceived\
    \ to be used with Visual Studio 2019 (you have to use the CLI SDK in many cases).\n\
    \nBut before reviewing this library, we will look at its origin and history.\n\
    \n### 8.3.1 What is Electron?\n\nElectron is a relatively new framework (July\
    \ 2013) for the development of desktop application with JavaScript. This framework\
    \ has been developed and maintained on GitHub under an Opensource model. The Electron\
    \ API has been developed using C and C++ and exposed through a JavaScript wrapper.\n\
    \nElectron is the combination of the Chromium rendering engine and the runtime\
    \ of Node.js (both Google technologies). This combination allows to a web application\
    \ to be run in a container on a desktop as a standard desktop application.\n\n\
    Popular applications have been developed using this tool:\n\n- GitHub Desktop\n\
    - Visual Studio Code\n- WhatsApp\n- Skype ....\n\n![](img/3d310cc066dda6e2dfa67a650614076f_147_0.png)\n\
    \nThe main reason of the success of this framework can be explained by the fact\
    \ that many web developers use this framework to leverage their competences in\
    \ web development to the development of desktop applications. Despite the fact\
    \ of an architectural lack of performances such applications are gaining in popularity\
    \ (thanks to the nowadays computer power) among the web developer community.\n\
    \n### 8.3.2 Presentation Electron.NET\n\nElectron.NET is a .NET Core wrapper around\
    \ Electron, the first release goes back to October 2017. The wrapper provides\
    \ to .NET Core the ability to use the Electron API. In other words, Electron.NET\
    \ allows to develop an Electron application from an ASP.NET Core web application.\n\
    \nThe current version of Electron.NET is 5.30.1 and is compatible with .NET Core\
    \ 3 (so the following versions should be too). This wrapper is Opensource and\
    \ can be used and extended by the .NET Core developers.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_148_0.png)\n\
    \nBut there are some prerequisites for using Electron.NET. This framework requires\
    \ you to install Node.js (at least version 8.6) on your development platform.\
    \ Even if Electron.NET avoid you to use JavaScript for the development of the\
    \ Electron application, it requires Node.js to be installed for the building and\
    \ running process (that's the Electron engine).\n\nFor a good integration in .NET\
    \ Core, Electron.NET is available in NuGet packages. To make the communication\
    \ between the Electron runtime (Host) and the .NET Core web application you have\
    \ to include the appropriate packages to your project.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_148_1.png)\n\
    \nElectronNET.API is the layer the developer has to include to the web site for\
    \ accessing the Electron features, this package does the bridge between the Electron\
    \ host and the ASP.NET web application.\n"
  mdcn: "\n\n由于该应用程序不包含任何业务逻辑（FileOperation除外）。文件 **Program.cs** 实际上几乎是空的，只有对主图形用户界面对象的调用。\n\
    \n文件函数的调用是通过带有静态类的菜单完成的。\n\n以下是 Visual Studio 中的“解决方案资源管理器”视图：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_140_0.png)\n\
    \n(consoleTextEditor “解决方案资源管理器”)\n\n您可以在 netcore3 仓库的示例文件夹中找到“consoleTextEditor”的完整源代码。\n\
    \n[https://github.com/netcore3/CodeBook/Chapter 8/2/consoleTextEditor](https://github.com/netcore3/CodeBook/Chapter\
    \ 8/2/consoleTextEditor)\n\n本示例是研究全屏控制台应用程序开发的一个良好起点，可以直接使用。这不是一个使用之前推荐的最佳实践的优化版本，编码风格基础且未实现任何\
    \ C# 新功能，请随意改进它（在 GitHub 上 fork 它）。\n\n如需使用大量更多控件类型，可以查看下一个示例（\"consoleFormApp\"\
    ）。\n\n### 8.2.3.2 基本窗体应用程序的编码 (consoleFormApp)\n\n\"consoleFormApp\" 提供了一个有用的项目示例，用于使用\
    \ Terminal.GUI 开发高级控制台应用程序 GUI。\n\n本示例在多个窗口中显示了可用于设计控制台应用程序的多个控件。它还演示了 ASCII 艺术的使用以及如何对控制台程序进行创造性使用。\n\
    \n以下是 Visual Studio \"解决方案资源管理器\" 中显示的项目结构：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_141_0.png)\n\
    \n(consoleFormApp \"解决方案资源管理器\")\n\n该项目的总体架构与 consoleTextEditor 项目几乎相同，只是添加了一个空的外观对象\
    \ (nativeFacade.cs)。“nativeFacade”对象提供当前操作系统检测例程，以便根据所使用的操作系统（Windows、macOS、Linux）使用特定实现来更轻松地集成本机调用，您可以轻松地为自己的程序重用该模式（甚至可以通过使用接口和针对每个系统的多个类来改进它）。\n\
    \n如上所述，“consoleFormApp”包含 Terminal.GUI 中可用的多个控件，如下所示，使用“ASCII 艺术”为应用程序设计增添了更酷（且复古）的风格，它还说明了\
    \ .NET Core 3 互操作功能提供的专用代码（针对每个操作系统）的使用能力。\n\n### 在 macOS 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_142_0.png)\n\
    \n### 在 ubuntu 上：\n\n```\njohn@ubuntu:~$ cd /etc/init.d/\njohn@ubuntu:/etc/init.d$\
    \ ls\nacpid anacron apport atd bootlogd console-setup cron dbus dm friendly-recovery\
    \ gdm halt hostname hwclock killprocs kmod lm-sensors lvm2 module-init-tools mountall\
    \ mountall-bootclean mountdevsubfs mountkernfs mountnfs networking ondemand passwd\
    \ plymouth ppp-dns procps rc resolvconf rsync sendsigs single sudo udev ufw umountfs\
    \ urandom x11-common\n```\n\n### 在 Windows 上：\n\n```\nC:\\Users\\john> cd C:\\\
    Windows\\System32\nC:\\Windows\\System32> dir\n config drivers etc spool tasks\
    \ wbem\n```\n\n本应用程序是使用 ASCII 小部件和 ASCII 艺术在控制台 GUI 应用程序中可以实现的效果的现场演示。使用基于 ASCII\
    \ 的 GUI 时，请不要忘记发挥创造力，因为这种 GUI 提供的可能性非常有限。\n\nconsoleFormApp 是 Terminal.GUI 库提供的许多控件的标准演示，小部件显示在应用程序的左侧窗口中（在可能的情况下带有其名称）。\n\
    \n- 窗口。\n- 组。\n- 对话框。\n- 标题菜单。\n- 标签文本。\n- 文本框输入。\n- 按钮。\n- 选项。\n- 单选按钮。\n- 列表。\n\
    \n本示例演示了如何在屏幕上实现控件，并说明了如何在控制台应用程序的一个屏幕中实现多个窗口。\n\n“consoleFormApp”还说明了自定义 ColorScheme\
    \ 结构体的使用。此项目示例提供了一个外观模式，用于调用每个平台特定的本机代码（并显示当前系统名称）。\n\n您可以在 netcore3 GitHub 上找到此应用程序的完整源代码。\n\
    \n### 8.2.4 控制台 GUI 的优缺点\n\n控制台 GUI 是开发 GUI 的绝佳选择：\n\n- 资源需求最少。\n- 完美的多平台一致性（您可以选择为所有平台仅使用一个源代码）。\n\
    - 开发简单直接（只需一个项目来开发您的应用程序）。\n- 部署和打包简单。\n\n但此解决方案无法满足每个应用程序的需求：\n\n- 具有高级图表的应用程序。\n\
    - 使用大量图形（图片或视频）的应用程序。\n- 高级导航系统。\n- 精确的鼠标支持。\n\n总之，控制台 GUI 可以满足控制台工具的基本 GUI 需求，但不适用于大多数高级应用程序的要求，例如：图形显示、图表、动画和界面的高级交互性。\n\
    \n对于所有这些要求，您将需要选择随后介绍的另一种 GUI 解决方案。\n\n以下是获取完整在线文档和用于检查 .NET Core 3 项目依赖项的示例项目的一些指南（可能有用）。\n\
    \n```\nhttp://migueldeicaza.github.io/gui.cs/api/Terminal.Gui.html\nhttp://www.github.com/mholo65/depends\n\
    ```\n\n## 8.3 ELECTRON.NET：ASP.NET GUI 应用程序\n\n当您需要在异构平台上完美匹配界面外观和感觉时，使用 ASP.NET\
    \ Core 框架听起来是一个相关的选择。此方法需要良好的 ASP.NET Core Web 开发（和 JavaScript）知识。\n\n实际上，这种用于实现桌面应用程序的解决方案对于\
    \ ASP.NET Core 开发人员来说似乎是一个理想的选择，因为整个软件开发生命周期与经典 Web 应用程序的开发非常相似。\n\n毫无疑问，本节获得的知识对于未来\
    \ .NET Core 3 版本中开发此类应用程序也将有用。\n\n目前，使用 Electron.NET 进行的开发无法从 Visual Studio 执行，许多\
    \ Electron 特定任务必须使用 .NET Core SDK CLI 完成。\n\nElectron.NET 包装器并非设计用于与 Visual Studio\
    \ 2019 一起使用（在许多情况下，您必须使用 CLI SDK）。\n\n但在回顾此库之前，我们将了解其起源和历史。\n\n### 8.3.1 什么是 Electron？\n\
    \nElectron 是一个相对较新的框架（2013 年 7 月），用于使用 JavaScript 开发桌面应用程序。该框架在 GitHub 上根据开源模型开发和维护。Electron\
    \ API 使用 C 和 C++ 开发，并通过 JavaScript 包装器公开。\n\nElectron 是 Chromium 渲染引擎和 Node.js\
    \ 运行时（均为 Google 技术）的组合。这种组合允许 Web 应用程序在桌面上的容器中作为标准桌面应用程序运行。\n\n使用此工具开发了许多流行的应用程序：\n\
    \n- GitHub Desktop\n- Visual Studio Code\n- WhatsApp\n- Skype ....\n\n![](img/3d310cc066dda6e2dfa67a650614076f_147_0.png)\n\
    \n该框架成功的主要原因可以解释为：许多 Web 开发人员使用此框架将其 Web 开发技能应用于桌面应用程序开发。尽管存在架构性能不足的问题，但这类应用程序（得益于当今的计算能力）在\
    \ Web 开发人员社区中越来越受欢迎。\n\n### 8.3.2 Electron.NET 介绍\n\nElectron.NET 是围绕 Electron\
    \ 的 .NET Core 包装器，首个版本发布于 2017 年 10 月。该包装器为 .NET Core 提供了使用 Electron API 的能力。换句话说，Electron.NET\
    \ 允许从 ASP.NET Core Web 应用程序开发 Electron 应用程序。\n\nElectron.NET 的当前版本是 5.30.1，与 .NET\
    \ Core 3 兼容（因此后续版本也应该兼容）。该包装器是开源的，可供 .NET Core 开发人员使用和扩展。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_148_0.png)\n\
    \n但是，使用 Electron.NET 有一些先决条件。此框架要求您在开发平台上安装 Node.js（至少版本 8.6）。即使 Electron.NET\
    \ 避免您使用 JavaScript 开发 Electron 应用程序，它也要求安装 Node.js 以进行构建和运行过程（这是 Electron 引擎）。\n\
    \n为了在 .NET Core 中良好集成，Electron.NET 可通过 NuGet 包获得。为了在 Electron 运行时（主机）和 .NET Core\
    \ Web 应用程序之间进行通信，您需要将相应的包包含到项目中。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_148_1.png)\n\
    \nElectronNET.API 是开发人员需要包含到网站以访问 Electron 功能的层，该包在 Electron 主机和 ASP.NET Web 应用程序之间充当桥梁。\n\
    \n"
