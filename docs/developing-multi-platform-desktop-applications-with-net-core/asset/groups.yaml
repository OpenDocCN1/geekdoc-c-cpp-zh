    - https://developer.apple.com/xcode/


    #### 9.4.3.2 On ubuntu


    “gcc” and “cmake” are installed by default on the ubuntu desktop distribution,
    so you do not have to install any complementary tool for building a machine native
    application on this platform. You can compile a CoreRT ready project to machine
    native executable by using the proper options and command with the dotnet CLI
    as described in the following section.

