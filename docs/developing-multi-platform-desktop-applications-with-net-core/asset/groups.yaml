    https://www.learnentityframeworkcore.com/\n\n## 5.4 EXTERNAL SERVICES CONSUMPTION\n\
    \nIn many cases you will have to use external services (API, Web Services ...)\
    \ in your application, and .NET Core has dedicated packages and functionalities\
    \ for doing that.\n\nFor simplification purpose we will consider the consumption\
