    The main container widget is the window object, other widgets (controls like textbox,
    label, button, select, ...) can be added inside the main window (container).


    GTK is event driven (signal/handler). For example, a signal is sent to the application
    when you click a button, you have to define the signal and the handler yourself
    by coding.


    The documentation for developing GTK application is mainly written for the C,
    C++ languages, nevertheless it can be easily (if you have a minimum knowledge
    of C) adapted/ported for the use with .NET Core 3 C#.


