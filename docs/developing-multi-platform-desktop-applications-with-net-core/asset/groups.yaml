    This example, called “ControlCatalogStandalone”, is a multipage application presenting
    the main widgets you can use in your Avalonia application.


    The architecture of the project is original, as the main application functionalities
    are not in the main program project (“ControlCatalog.Netcore”) but in a dependency
    project (“ControlCatalog”).dll file.


    This .dll file has been developed using the .NET Standard 2.0, this architecture
    improves the general portability of the application. Of course, you will not have
    to use the same implementation architecture for your project but it is a good
    guarantee of the Avalonia multiplatform capabilities.


    You can have a quick preview of the project architecture with the view of the
    “Solution Explorer” below.


    '
