    \ illustrating the structure of this project called “GtkBasicForm”, in Visual\
    \ Studio 2019.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_211_0.png)\n\nThe template\
    \ used for the generation of the application (from GtkSharp.Template.CSharp) is\
    \ targeting .NET Core 2 by default, so the first thing you have to do is to update\
    \ the project for targeting .NET Core 3. That’s can be done by editing the .csproj\
    \ file and updating the version number of the .NET Core framework targeted.\n\n\
    The project is composed of the main program and an object for the hosting of the\
    \ GUI described in the “glade” file. The loading of the GUI is performed with\
    \ the GTK Builder, it will also reroute all the signals of the GUI to the main\
    \ program object.\n\nThis is a basic Glade application with only a label text\
    \ and button from the Gtk project template generated with the GtkSharp.Template.CSharp\
    \ package.\n\nHere is a view of the result of the execution of this project \"\
    GtkBasicForm\" on the different platforms.\n\n### On macOS:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_212_0.png)\n\
    \n### On Ubuntu:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_212_1.png)\n\n###\
    \ On Windows:\n\n![](img/3d310cc066dda6e2dfa67a650614076f_213_0.png)\n\nThe “GtkBasicForm”\
    \ example does implement a signal on the button clicked event with the corresponding\
    \ handler method button1_clicked. The event is implemented inline (it should be\
    \ integrate in the .gradle file).\n\nThis project provides a good starting point\
    \ for starting the development of a GTK .NET Core 3 application, it can be use\
    \ as template for just doing that.\n\nThe edition of the GUI is much more flexible\
    \ than coding the GUI, and, offer greater possibilities to design a proper GUI\
    \ in a minimum of time (once you are familiar with Glade GUI).\n\nYou will find\
    \ the source of this project example on the netcore3 GitHub repos.\n\n## 8.5.6\
    \ GTK Themes: Installation and Configuration\n\nAs themed graphic toolkit, GTK\
    \ allows you to develop your own theme for your application. Furthermore, it allows\
    \ the developer to customize an existing theme for matching its requirements with\
    \ the adapted look and feel (color, font, positioning...) in a minimum of time\
    \ and coding effort.\n\nYou can find predefined GTK Themes at the reference link\
    \ furnished below.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_214_0.png)\n\n\
    This web site provides more than a thousand already made themes for Gtk3, furthermore\
    \ it is freely usable for the development of your application (Opensource license).\n\
    \n### 8.5.6.1 Use another theme for your application\n\nIf you want to make your\
    \ application singular and not look like the standard GTK application design,\
    \ you can specify a theme to be used instead of the default one.\n\nYou can achieve\
    \ this by specifying explicitly the theme you want to use in the C# source code.\n\
    \nThere is a dedicated documentation for the theming of your GTK application in\
    \ the reference link if you require more information about this domain.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_214_1.png)\n"
  mdcn: "\n\n![](img/3d310cc066dda6e2dfa67a650614076f_204_0.png)\n\n(图 3)\n\n一旦为信号定义了方法名称，就必须将相应的方法语句添加到包含应用程序后端逻辑的“.cs”文件中（图\
    \ 4）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_205_0.png)\n\n(图 4)\n\n每次预定义事件上的信号被触发时，都会调用所实现的方法。该方法为\
    \ GTK# / .NET Core 3 应用程序前端与后端之间的交互实现提供了一种简便而优雅的方式。\n\n你还可以选择直接在代码中使用小部件名称来编码事件，而不使用\
    \ Glade 中的信号/处理程序（但可读性较差）。\n\n## 8.5.5 GTK# 示例应用程序\n\n如你已理解，可以用两种不同的方式开发 .NET\
    \ Core 3 GTK 应用程序：\n\n- 内联 C# 编码的 GUI 实现。\n- 基于 XML 设计的 GUI（使用 Glade 和 Gtk.Builder）。\n\
    \n在本节中，我们将为每种方法提供一个示例项目的回顾。每种方法都有其优缺点，应根据你打算开发的项目类型来选择。\n\n### 8.5.5.1 内联 C# 编码的\
    \ GUI 示例\n\n此示例是使用 GTK 工具包进行内联 GUI 应用程序开发的良好起点，它使用了大量的小部件（GTK 术语中的控件）。\n\n此示例提供于\
    \ GTK# GitHub 仓库，似乎是开发此类应用程序的参考（GTK# 的可用文档并不多）。该应用程序是一个演示程序，其唯一功能是使用 GTK# 中提供的各种小部件。\n\
    \n以下是不同平台上的渲染截图。\n\n### 在 macOS 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_207_0.png)\n\
    \n### 在 Ubuntu 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_207_1.png)\n\n###\
    \ 在 Windows 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_208_0.png)\n\n你会注意到，该应用程序的\
    \ macOS 版本未包含标题栏标题图标。这是因为在 macOS 上通过 brew 默认安装 GTK3 时不会安装默认主题图标（Windows 安装的情况则不同）。你需要使用下面描述的命令行（brew\
    \ 公式）单独安装 GTK3 默认主题图标。\n\n```\n$ brew install gnome-icon-theme\n```\n\n此命令将安装默认的\
    \ GTK 图标和主题资源，以便正确显示应用程序。正确安装该包将产生如下屏幕所示的输出。\n\n```\nLast login: Sun Aug 4 00:01:18\
    \ on ttyS000\nJons-MacBook:~ jschoen$ brew install glade libxml2\n==> Downloading\
    \ https://homebrew.bintray.com/bottles/glade--3.22.1.mojave.bottle.tar.gz\n==>\
    \ Downloading from https://akamai.bintray.com/...\n########################################################################\
    \ 100.0%\n==> Pouring glade--3.22.1.mojave.bottle.tar.gz\n==> Caveats\nglade is\
    \ Python 3 only and requires PyGObject.\n==> Summary\n\U0001F37A  /usr/local/Cellar/glade/3.22.1:\
    \ 1,769 files, 1.7MB\n==> Downloading https://homebrew.bintray.com/bottles/libxml2--2.9.9.mojave.bottle.tar.gz\n\
    ==> Downloading from https://akamai.bintray.com/...\n########################################################################\
    \ 100.0%\n==> Pouring libxml2--2.9.9.mojave.bottle.tar.gz\n==> Caveats\nlibxml2\
    \ is keg-only, which means it was not symlinked into /usr/local,\nbecause macOS\
    \ already provides this software and installing another version in\nparallel can\
    \ cause all kinds of trouble.\nIf you need to have libxml2 first in your PATH\
    \ run:\n  echo 'export PATH=\"/usr/local/opt/libxml2/bin:$PATH\"' >> ~/.zshrc\n\
    For compilers to find libxml2 you may need to set:\n  export LDFLAGS=\"-L/usr/local/opt/libxml2/lib\"\
    \n  export CPPFLAGS=\"-I/usr/local/opt/libxml2/include\"\n==> Summary\n\U0001F37A\
    \  /usr/local/Cellar/libxml2/2.9.9: 416 files, 8.6MB\nJons-MacBook:~ jschoen$\n\
    ```\n\n此示例项目说明了在选项卡窗口中实例化多个 GTK 小部件，它将为你使用 C# 编码的 GUI 编写应用程序提供知识。作为主题化 GUI 工具包，该应用程序在不同平台上的渲染效果相似。\n\
    \n此外观是开始使用 GTK 进行开发的参考示例。构建此示例还将验证每个平台（Windows、Ubuntu、macOS）上正确的 GTK 安装和构建链。\n\
    \n原始示例项目面向 .NET Core 2，但已无问题移植到 .NET Core 3。\n\n```\nhttps://github.com/GtkSharp/GtkSharp/Sample\n\
    .Net Core 3 version:\nhttps://github.com/netcore3/CodeBook/Chapter8/5/GtkSamples\n\
    ```\n\n如你所理解，在此示例项目中，未使用任何应用程序可视设计工具，每个小部件均通过代码创建。\n\n与使用 LibUI 开发应用程序（参见上一节）类似，小部件是使用\
    \ C# 纯代码声明和配置的，在此上下文中，准确定位每个小部件并非易事（如果你需要从模型构建应用程序）。这种 GUI 编码方法的优势在于不需要在开发工作站上设置\
    \ Glade 来进行屏幕的可视设计（这是一个问题吗？）。\n\n如果你想开发复杂的应用程序（和/或带有许多表单设计），应该考虑使用 Glade/GtkBuilder\
    \ 应用程序类型（参见下一示例）。\n\n### 8.5.5.2 基于 XML 编码的 GUI 示例（使用 Glade）\n\n此示例围绕先前描述的 GtkSharp.Template.C#\
    \ 包中提供的模板构建。\n\n这是 GtkSharp.Application 模板的基本实现。该模板提供了使用 Glade 开发 GUI（并在 GtkBuilder\
    \ 中加载）来构建 GTK 应用程序的基本架构。\n\n在此示例中，你可以使用 Glade 可视化界面设计器来设计 GUI。用户界面通过 XML 文件（带有\
    \ glade 扩展名）实现，可以像之前所示一样在 Visual Studio 2019 界面中使用 Glade 进行编辑（这很方便）。\n\n以下是 Visual\
    \ Studio 2019 中名为“GtkBasicForm”的项目结构的“解决方案资源管理器”视图。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_211_0.png)\n\
    \n用于生成应用程序的模板（来自 GtkSharp.Template.CSharp）默认面向 .NET Core 2，因此你首先要做的是将项目更新为面向 .NET\
    \ Core 3。这可以通过编辑 .csproj 文件并更新目标 .NET Core 框架的版本号来完成。\n\n项目由主程序和用于托管在“glade”文件中描述的\
    \ GUI 的对象组成。GUI 的加载通过 GTK Builder 执行，它还将 GUI 的所有信号重新路由到主程序对象。\n\n这是一个基本的 Glade\
    \ 应用程序，仅使用 GtkSharp.Template.CSharp 包生成的 Gtk 项目模板中的标签文本和按钮。\n\n以下是该项目“GtkBasicForm”在不同平台上运行结果的视图。\n\
    \n### 在 macOS 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_212_0.png)\n\n###\
    \ 在 Ubuntu 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_212_1.png)\n\n### 在\
    \ Windows 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_213_0.png)\n\n“GtkBasicForm”示例确实在按钮单击事件上实现了带有相应处理程序方法\
    \ button1_clicked 的信号。该事件是内联实现的（它应该集成在 .gradle 文件中）。\n\n此项目为开发 GTK .NET Core 3\
    \ 应用程序提供了良好的起点，可以将其用作模板来实现此目的。\n\n与编码 GUI 相比，GUI 编辑要灵活得多，并且（一旦你熟悉 Glade GUI）可以在最短时间内设计出合适的\
    \ GUI，提供更大的可能性。\n\n你可以在 netcore3 GitHub 仓库中找到此示例项目的源代码。\n\n## 8.5.6 GTK 主题：安装与配置\n\
    \n作为主题化图形工具包，GTK 允许你为应用程序开发自己的主题。此外，它允许开发者自定义现有主题，以最少的时间和编码工作量匹配其所需的适配外观和感觉（颜色、字体、定位...）。\n\
    \n你可以在下方提供的参考链接中找到预定义的 GTK 主题。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_214_0.png)\n\
    \n该网站为 Gtk3 提供了超过一千个现成的主题，此外，它可免费用于你的应用程序开发（开源许可证）。\n\n### 8.5.6.1 为你的应用程序使用其他主题\n\
    \n如果你希望让你的应用程序与众不同，不像标准 GTK 应用程序设计，你可以指定使用某个主题来替代默认主题。\n\n你可以通过在 C# 源代码中明确指定要使用的主题来实现这一点。\n\
    \n如果你需要了解更多关于此领域的信息，参考链接中有关于 GTK 应用程序主题设置的专门文档。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_214_1.png)\n\
    \n"
