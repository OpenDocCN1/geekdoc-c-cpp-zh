    \ }\n                } }\n            };\n            Electron.Menu.SetApplicationMenu(menu);\n\
    \        }\n        return Ok();\n    }\n}\n```\n\n这只是一个示例代码片段，用于说明在应用程序中实现原生菜单的方法，你应该考虑详细审查工作示例代码中是如何实现的（查看项目中\
    \ menu.cs 文件的源代码以获取实际示例）。\n\n- 本示例中还审查了消息对话框窗口的使用（此技术也用于 FileOpen、FileSave 和错误消息对话框窗口）。\n\
    \n由于 Electron.NET 应用程序底层运行着两个进程，因此有两段不同的代码（片段）用于实现平台原生菜单：一段用于渲染部分（HTML/JavaScript），另一段用于后端应用程序（C#\
    \ 进程）。\n\n以下是创建原生消息窗口的代码片段（JavaScript）。\n\n```\ndocument.getElementById(\"information-dialog\"\
    ).addEventListener(\"click\", () => {\n    ipcRenderer.send(\"information-dialog\"\
    );\n});\nipcRenderer.on(\"information-dialog-reply\", (sender, index) => {\n \
    \   let message = 'You selected ';\n    if (index == 0) {\n        message +=\
    \ 'yes.';\n    } else {\n        message += 'no.';\n    }\n});\ndocument.getElementById(\"\
    info-selection\").innerText = message;\n});\n```\n\n以及要包含在 C# 后端中的代码。\n\n```\n\
    Electron.IpcMain.On(\"information-dialog\", async (args) => {\n    var options\
    \ = new MessageBoxOptions(\"This is an information dialog. Isn't it nice?\")\n\
    \    Type = MessageBoxType.info,\n    Title = \"Information\",\n    Buttons =\
    \ new string[] { \"Yes\", \"No\" }\n});\n\nvar result = await Electron.Dialog.ShowMessageBoxAsync(options);\n\
    \nvar mainWindow = Electron.WindowManager.BrowserWindows.First();\nElectron.IpcMain.Send(mainWindow,\
    \ \"information-dialog-reply\", result.Response);\n});\n```\n\n有多种可用的原生对话框窗口类型（除了上面描述的那种之外），你可以详细审查\
    \ dialog.cs 文件的代码，以获取更多关于如何使用此功能的示例。\n\n这只是示例应用程序中展示的少数功能之一，但从 Web 应用程序开发者的角度来看，它们似乎是最特别的部分。\n\
    \n如你所见，应用程序中这些基本功能（菜单和对话框）的实现并不明显。管理 Electron 架构引入的双进程存在很多复杂性。随着应用程序本身变得更加复杂，这种复杂性也会增加。\n\
    \n研究“ElectronNET-API-Demos”项目可以在 Electron.NET 开发所需的学习阶段为你提供帮助。\n\n**注意：** 此示例无法从\
    \ Visual Studio 2019 IDE 执行，在这种情况下，你必须使用“dotnet CLI”。\n\n“ElectronNET-API-Demos”的完整源代码可在\
    \ GitHub 上获取。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_161_0.png)\n\n请注意，Electron.NET\
    \ 仍在持续开发中，它对应用程序中包含的每个包的版本非常敏感。这使得构建过程变得有些不可靠，当你尝试使用互联网上的代码示例应用程序（旧版本）时。\n\n你可以在下方查看应用程序在各平台上的渲染效果。\n\
    \n## 在 macOS 上：\n\n![](img/3d310cc066dda6e2dfa67a650614076f_162_0.png)\n\n## 在\
    \ Ubuntu 上：\n\n- ELECTRON.NET API 演示\n- 网络\n- 云管理器 Windows\n- 启动 Windows 任务栏和日志\n\
    - API\n- 云管理器 Windows\n- 云管理器 Windows\n- 在系统文件管理器中打开外部链接\n- 关于何时发生情况的指示...\n-\
    \ 显示进度\n- 显示进度\n- 配置\n- 编译 Electron.NET API 演示\n- 演示\n- 打开系统信息\n- 从此剪贴板创建和打印\n\
    - 数据包 PING\n- 截图\n\n## 使用系统对话框\n\nElectron.NET API 演示允许你使用系统对话框来打开文件、打印文件、启动文件或编辑信息消息。\n\
    \n这更原生、更易用，因为使用原生回调的过程更有效，并允许在进程间远程调用。请参阅 electron.net 页面的渲染进程。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_163_0.png)\n\
    \n## 错误对话框\n\n错误：ELECTRON.NET / API / DEMOS / API / DEMOS\n\n## 信息对话框\n\nELECTRON.NET\
    \ / API / DEMOS / API / DEMOS\n\n查看演示\n\n在此演示中，Electron.NET API 将向渲染进程发送一条消息以打开信息对话框。渲染进程将捕获该消息并执行响应，随后该响应可以反映回渲染进程。\n\
    \n注意：Electron.NET 属性在 macOS 上被禁用。\n\n信息对话框可以包含图标、你选择的按钮、标题和消息。\n\n## 在 Windows\
    \ 上：\n\n- 文件\n- 编辑\n- 视图\n- 窗口\n- 帮助\n\n## 试玩\n\n在你自己的 Electron 应用中使用演示小程序。Electron\
    \ 快速入门应用是一个精简应用，可与这些演示一起使用。按照此处的说明开始并克隆 Electron 快速入门。将 Electron.NET API 演示用作你的\
    \ ASP.NET Core API。\n\n## 构建 Electron.NET 快速入门\n\n这包括将 ElectronNET.WebHostExtensions\
    \ 扩展包含在你的 ASP.NET Core 项目的 Program.cs 文件中。\n\n```\npublic static IWebHost BuildWebHost(string[]\
    \ args) =>\n    WebHost.CreateDefaultBuilder(args)\n    .UseElectron(args)\n \
    \   .UseStartup<Startup>()\n    .Build();\n```\n\n![](img/3d310cc066dda6e2dfa67a650614076f_163_1.png)\n\
    \n当你在 Windows 上运行应用程序时（使用“dotnet electronize start”命令），安全对话框窗口通常会出现（取决于使用的安全级别），你必须确认所提议的安全规则（在下方窗口中单击“确定”）。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_164_0.png)\n\n## 8.3.6 Electron.NET\
    \ 应用程序的优缺点\n\n由于这是一种 Web GUI 实现，因此应用程序在每个平台上的渲染效果非常相似。跨平台的 GUI 显示一致性是此类解决方案实现的特征（及优势）之一。使用增强型\
    \ JavaScript 界面设计的能力是另一个优势，但此类桌面应用程序的性能并不总是最佳。\n\n即使你可以使用 Visual Studio 开发工具来开发\
    \ Web 应用程序部分，Electron.NET 工具也无法在 Visual Studio 2019 内使用，你必须使用“dotnet CLI”来初始化、运行、构建和打包应用程序（如前所述）。\n\
    \nElectron.NET 为 ASP.NET 开发者提供了将其应用程序作为离线桌面环境执行的目标的能力，尽管如此，在这样做之前，需要掌握一些特定的 Electron.NET\
    \ 知识。即使你是一位资深的 ASP.NET Web 开发者，你也必须经历一个学习曲线来掌握桌面开发的特定要求。\n\n注意：Electron.NET 的版本对你必须使用的\
    \ .NET Core 版本非常严格，你必须找到 Electron.NET 版本和 .NET Core 版本的正确组合才能构建和执行程序（在某些情况下可能比较棘手）。\n\
    \n## 8.4 C++ 原生 GUI 应用程序\n\n在 .NET Core 3 应用程序中实现原生 UI 有几种解决方案。使用原生 GUI 可以让每个操作系统的用户感觉该应用程序是专为其平台开发的。通过使用标准表单和控件，用户可以直接熟悉软件界面（应用程序看起来像原生应用）。\n\
    \n三个系统（Linux、macOS、Windows）上图形基元的稳定标准化，为开发者提供了编写可在每个系统上运行的图形界面的机会。通过使用适配的包装器，.NET\
    \ Core 3 开发者\n\n"
