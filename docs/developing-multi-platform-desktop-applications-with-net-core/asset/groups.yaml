  - '[PAGE 34]


    development methodology is very recommended for every phases of the project (sdLC).


    These methods are especially recommended if your project implies multiple person
    (designer, coder, Dba, architect...) and if you have to produce a project status
    report for your hierarchy.


    The basic requirements you should consider before starting a complex software
    development project are:


    +   - Planning of your project (and the use of a project planning tool even if
    that''s just done on an MS Excel sheet).

    +   - The management of the project: The Agile method provide a flexible way for
    medium size team.

    +   - The use of a source control tool.


    These can avoid you many pitfalls often encountered during development project.


    # 3.1 THE PLANIFICATION OF YOUR PROJECT


    Even if you are alone (and especially if a team work is implied) working on your
    project, a phase of planification is heavily recommended before starting to code.


    During this phase you will:


    +   - Organize / formalize your vision about each step of the development of your
    product.

    +   - Define task to complete before starting others (task hierarchy).

    +   - Define time schedules of the development.

    +   - Clarify role of each person working on the project (architect, developer,
    designer ...), if needed.'
  - '[PAGE 35]


    In the real world, specifications are often subject to unplanned changes and your
    project management tools should allow you to reschedule each task involved by
    those changes and forecast the cost (in time and resources) implied by those modifications.
    The global visibility on the progress of the project can be provided at every
    instant of the project avoiding misunderstandings with the hierarchy and/or getting
    a sharp view of the progress.


    The definition of a time schedule helps you to identify if the development team
    encountered any problem on a specific task and reallocate resources accordingly
    (if the work implies for the development or another task was underestimate/overestimate).


    The best tool available for doing this is Microsoft Project.


    MS Project not only provides you a great tool for planification (with Gantt chart,
    task hierarchy, human resources management ...) but constitute a central tool
    for the management of your Software Development Life Cycle (sDLC). You can model
    each step of the project and attribute resources: time and human including the
    specifics technical skill required.


    For simple project you can use a tool to keep on tracks your project. It can be
    done with an MS Excel dedicated sheets or free project management website. But
    the dedicated software developed by Microsoft provide an easy way for just doing
    that, with many years of development of the product provides an unchallenged solution
    for the project''s management task.


    Here are the resources you can consult for achieving your project management.'
