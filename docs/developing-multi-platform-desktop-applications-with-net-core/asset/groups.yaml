    That should be the first question you ask to yourself when you want to start a
    project targeting multiple platforms for a desktop application. Indeed targeting
    multiple OS is quite usual in the mobile development world but it is not so obvious
    in the desktop development domain. And there is a simple reason for that, the
    “hegemony” of the Windows operating system on the desktop platform market. This
    dominance is illustrated by the graphic (figure 1), Windows represent 75% of the
