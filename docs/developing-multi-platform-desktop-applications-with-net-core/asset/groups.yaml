    \ Core 3 应用程序回顾\n\n总之，LibUI 为 GUI 桌面应用程序开发提供了一种轻量且高效的解决方案；它不需要任何先决依赖项安装，也不需要安装专用工具。它轻量且快速，社区正在持续致力于集成改进。\n\
    \n在此背景下，LibUI 似乎是开发 .NET Core 3 GUI 应用程序的理想工具（至少在不同操作系统显示 API 保持稳定的这段时间内），然而，缺乏用于\
    \ GUI 设计的可视化设计器可能会让许多开发者在专业环境或快速开发中却步。掌握用于 GUI 设计的包装器所需的时间不应被低估，但一旦掌握，该库所能实现的结果可能会非常令人印象深刻。\n\
    \n## 8.5 GTK UI 应用程序\n\nGTK：“The Gimp Toolkit”最初是 Gnome 为在 Linux 上开发 GUI 应用程序而发起的倡议。GTK\
    \ 在开源许可证（GNU）下开发。GTK 构建在 Glib（以及其他库）之上，这是一个经过充分验证且广受欢迎的库。\n\nGTK 没有提供大量文档，并且有特定的先决条件，因此大多数开发者认为它是一个难以使用的工具。但我们将看到，它可以实现灵活的开发，并且无论目标平台如何，使用此工具都可以获得出色的结果。因此，这种项目可以在你喜爱的开发工具\
    \ Visual Studio 2019 中获得极佳的开发体验。\n\n### 8.5.1 GTK 介绍\n\nGTK 是许多知名跨平台商业应用程序的基础，并被专业人士广泛认可用于\
    \ GUI 项目开发，例如 ubuntu 的 Gnome 桌面应用程序就是使用 GTK 开发的。\n\n我们可以简要列举 GTK 的核心优势如下：\n\n\
    - 稳定性：GTK 已开发数十年。\n- 出色的外观和感觉。\n- 主题支持。\n- 面向对象方法。\n- 本地化。\n- 国际化。\n- 良好的文档（正在不断改进）\n\
    \n请记住，GTK 是为与 C、C++ 语言一起使用而开发的，并从中继承了其通用架构和编程逻辑。因此，这种开发非常适合希望使用 .NET Core 3 实现生产力飞跃的\
    \ C 和 C++ 开发者。\n\nGTK 工具包在 Linux 上是原生的，Windows 和 macOS 版本是模拟的，在这些操作系统上，GTK 工具包需要安装一系列库（不详尽）：\n\
    \n- Atk：GTK 的无障碍框架。\n- Cairo：用于矢量图和图像合成的图形库。\n- Gdk：包含窗口的图形原语。\n- Gio：用于 Gtk I/O\
    \ 操作的辅助函数。\n- GLib：Gtk 的工具箱和辅助函数（Gtk 的基础之一）。\n- Gtk：包含小部件架构（用于窗口和控件）。\n- Pango：GTK\
    \ 的前端渲染库。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_183_0.png)\n\n使用 GTK 的基本编程逻辑是使用小部件的层级树。在\
    \ GTK 中，“widget”术语用于控件、窗口以及 GUI 的几乎每个元素。\n\n主容器小部件是窗口对象，其他小部件（如文本框、标签、按钮、选择框等控件）可以添加到主窗口（容器）内。\n\
    \nGTK 是事件驱动的（信号/处理程序）。例如，当你单击按钮时，会向应用程序发送一个信号，你需要通过编码自己定义信号和处理程序。\n\n开发 GTK 应用程序的文档主要是为\
    \ C、C++ 语言编写的，但如果你具备最基本的 C 语言知识，它可以轻松地适配/移植以用于 .NET Core 3 C#。\n\nGTK 库不仅需要安装在开发机器上，还需要与创建的应用程序一起安装（因此你需要通过安装程序随同安装它）。\n\
    \nGTK 原生依赖项在目标机器上是强制性的，这是应用程序正确执行的先决条件（你必须将这些依赖项包含在安装程序中）。\n\n以下是可查找有关 GTK 框架更多信息的网络链接。\n\
    \n- https://gtk.org\n- https://blog.gtk.org\n- https://developer.gnome.org\n-\
    \ https://gnome.org/gtk\n- https://github.com/GNOME/gtk\n\n"
