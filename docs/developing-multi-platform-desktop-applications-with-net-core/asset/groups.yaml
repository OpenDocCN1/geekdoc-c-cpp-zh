    You can find more information about the formatting of the logging

    at the provided references web sites (links provided below).


    # 5.2.2.4 Logging Levels


    Once the logger is fully configured you can start to log to the level

    Information:


    ```

    Log.Information("Here is the logging!");

    ```


    There are several levels to use to do your logging:


    +   - Verbose

    +   - Debug

    +   - Information

    +   - Warning

    +   - Error

    +   - Fatal


    You can configure you logger to output only at a define level.


    Here is a simple sample program for illustrating the basic use of

    Serilog.'
