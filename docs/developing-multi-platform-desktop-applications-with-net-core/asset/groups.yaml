    - The folder hierarchy, the Photoshop folder in the .psd file, will not be kept
    in the export process.

    - You have to specify a name for each layer of your design.


    For getting a first-hand experience with the capacities and limitations of the
    export plug-in you should test it in several configurations and verify the .qml
    file produced with QT Design Studio (or a text editor according to the methodology
    you are following).


    ## 8.6.5 Samples program GUI with QML.NET


    In this section about the use of QML.NET for the development of a multiplatform
    application with .NET Core 3 we will review three different types of example projects
    for illustrating several methods.


    - The first example is the example from the QML.NET author GitHub repository,
    it has been updated for using .NET Core 3 (and slightly modified).

    - The second example uses QT Design Studio designed GUI with the standard QT Quick
    Controls.

    - The third one uses a GUI designed and exported from Photoshop (using the QML
    Exporter script described previously).


    You have noticed that we didn''t approach and review the process for the setup
    of the QT runtime (as for GTK development for example), this is because it is
    not required when you develop with QML.NET.


    Indeed, a dedicated instruction of the QML.NET wrapper check the presence of the
    QT runtime required and download/install it, if it is required, without any intervention
    of the user (that''s almost magical).


    So, the only requirement for the use of the QT runtime in your .NET Core 3 application
    is to include in your C# source code the following instruction.


    ```

    RuntimeManager.DiscoverOrDownloadSuitableQtRuntime();

    ```


    This seamless integration of the runtime in your .NET Core 3 program is just a
    blessing for the developers compared to the old way, for the setup of the QT runtime
    required for the deployment of a QML based application.


    ### 8.6.5.1 QML.NET sample application


    The first example application has been developed by Paul Knopf, one of the principal
    developers of the QML.NET framework. At the current time this example project
    is still targeting the .NET Core 2.2 framework so we have modified it slightly
    to target the .NET Core 3 (available on netcore3 GitHub repo).


    This application makes the demonstration of many features already available in
    QML.NET and constitutes a learning sample of choice for the beginner QML.NET developer.


    The sliding menu on the side is reusable in many types of application, besides
    the different pages illustrate a specific QML.NET feature. Each page of this program
    contains a pertinent example of how to use the different features for the interaction
    between the C# and the QML.


    You should review this example carefully for getting a deeper understanding of
    how to use the QML interface in your own .NET Core 3 application.


    Here are the renderings of the updated (for targeting the .NET Core 3) example
    program on the different platforms.

    '
