    The update of your .NET Core 3 code to the .NET Core 3.1 should imply a minimum
    of modifications (may be none) of your application developed using the .NET Core
    3.


    The possibility of including the framework with the application and not globally
    on the machine (as it was the case for .NET Framework) is a major problem-solving
    pattern and also increase the portability and the durability of the applications
    developed today.


    ### .NET Core 3.0


    ![](img/3d310cc066dda6e2dfa67a650614076f_33_0.png)


    ## Chapter 3. PROJECTS MANAGEMENTS ESSENTIALS


    Before starting to review the solutions for the development of a GUI desktop application,
    we will review essentials knowledges required for a successful software development
    project.


    The realization of complex software products is facilitated by the use of proven
    methods of development. If you do not have extended experience in this area this
    chapter is very recommended you to read carefully. The developments issues you
    can encountered during the development of a multiplatform software are multiple
    and you do not want to add classical (and already solved) issues to these specifics''
    issues. The use of a solid development methodology is very recommended for every
    phases of the project (SDLC).


    These methods are especially recommended if your project implies multiple person
    (designer, coder, DBA, architect...) and if you have to produce a project status
    report for your hierarchy.


    The basic requirements you should consider before starting a complex software
    development project are:


    - Planning of your project (and the use of a project planning tool even if that''s
    just done on an MS Excel sheet).

    - The management of the project: The Agile method provide a flexible way for medium
    size team.

    - The use of a source control tool.


    These can avoid you many pitfalls often encountered during development project.


    ### 3.1 THE PLANIFICATION OF YOUR PROJECT


    Even if you are alone (and especially if a team work is implied) working on your
    project, a phase of planification is heavily recommended before starting to code.


    During this phase you will:


    - Organize / formalize your vision about each step of the development of your
    product.

    - Define task to complete before starting others (task hierarchy).

    - Define time schedules of the development.

    - Clarify role of each person working on the project (architect, developer, designer
    ...), if needed.


    In the real world, specifications are often subject to unplanned changes and your
    project management tools should allow you to reschedule each task involved by
    those changes and forecast the cost (in time and resources) implied by those modifications.
    The global visibility on the progress of the project can be provided at every
    instant of the project avoiding misunderstandings with the hierarchy and/or getting
    a sharp view of the progress.


    The definition of a time schedule helps you to identify if the development team
    encountered any problem on a specific task and reallocate resources accordingly
    (if the work implies for the development or another task was underestimate/overestimate).


    The best tool available for doing this is Microsoft Project.


    MS Project not only provides you a great tool for planification (with Gantt chart,
    task hierarchy, human resources management ...) but constitute a central tool
    for the management of your Software Development Life Cycle (SDLC). You can model
    each step of the project and attribute resources: time and human including the
    specifics technical skill required.


    For simple project you can use a tool to keep on tracks your project. It can be
    done with an MS Excel dedicated sheets or free project management website. But
    the dedicated software developed by Microsoft provide an easy way for just doing
    that, with many years of development of the product provides an unchallenged solution
    for the project''s management task.


    Here are the resources you can consult for achieving your project management.


    - Microsoft Project:

    - http://products.office.com/Microsoft/Project

    - Alternative to MS Project:

    - http://www.projectinabox.org.uk

    - http://www.projectlibre.com/

    - https://www.ganttproject.biz/download

    - MS Excel Project Management sheet template:

    - https://www.officetimeline.com/project-management/excel

    - https://www.vertex42.com/ExcelTemplates/excel-project-management.html


    Along these references you can find many Excel worksheets who will allow to plan
    a simple project avoiding you the investment in a dedicated tool as MS Project,
    nevertheless a much more complex project will require the use of the dedicated
    software.


    ### 3.2 THE SOFTWARE DEVELOPMENT LIFE CYCLE


    The development of a software project requires to identify each step (or so-called
    phase) for achieving it. The phasing of the project according to standard phase
    is called the software development life cycle.


    A software development project can be phased for the validation of each step in
    a development life cycle of the software product as described (figure 1).

