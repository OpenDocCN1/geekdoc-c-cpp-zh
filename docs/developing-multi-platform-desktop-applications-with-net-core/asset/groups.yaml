    ## 前言


    本书详细回顾了使用 .NET Core 3 开发桌面 GUI 应用程序的新技术。在撰写本书时，.NET Core 3 最终版本刚刚发布，对 .NET 开发者社区的影响已经巨大。使用此新主要版本的
    .NET Core 所带来的前景扩展了其潜在的应用领域


    该主题发展非常迅速，但我们非常有信心，本书所介绍的技术和基础知识将对下一版本的 Core 框架（根据 Microsoft 路线图，应该是 3.1）保持相关性。


    .NET Core 3 是 Microsoft 开发者社区的一大进步，其在 Visual Studio 2019 中的集成似乎表明，它将在未来几年成为 Redmond
    编辑器的主要开发技术。


    请放心，我们将跟进这些技术的未来版本，让您始终了解这一不断发展的惊人技术的最新动态。


