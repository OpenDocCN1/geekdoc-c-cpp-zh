    运行此首个示例还将允许您验证开发环境和 QT 配置环境（检查一切是否按预期运行...）。


    首次运行此示例程序时，QT5 运行库将为该应用程序下载并安装，因此如果需要较长时间（取决于您的互联网连接质量），请不要担心。程序首次执行需要可用的互联网连接。


    当然，这前提是您之前未在开发机器上安装 QT5 运行库。您可以借助 GitHub 上的专用项目预安装 QT5 运行库（参阅参考中的链接），这将在使用过程中节省应用程序首次启动的时间。


    由于这是您测试的第一个 QT（或者更确切地说是 QML.NET）程序，您可以注意到三个平台的外观完全相同，Qt 保证跨平台实现的 GUI 一致性，这是 QT
    的一大优势。


    此应用程序的源代码可在 GitHub 上找到。“qmlnet-samples”不针对 .NET Core 3 版本，要获取针对所需 .NET Core 版本的更新项目，请使用
    netcore3 GitHub 仓库。


    ```

    https://github.com/qmlnet/qmlnet-examples/

    .Net Core 3 version:

    https://github.com/netcore3/CodeBook/Chapter 8/6/QML.Features

    ```


    ### 8.6.5.2 QT Design Studio GUI 应用程序


    通过此第二个示例项目，我们将回顾如何使用 QT Design Studio 进行界面设计（实际上是生成 .qml 文件）来开发 .NET Core 3 应用程序。我们将制作一个简单的基本表单，它可作为您未来使用
    QML.NET 进行 .NET Core 3 开发的模板。


    - A) 在 QT Design Studio 中设计您的 GUI


    为此示例，我们将设计一个带有一个标签和两个按钮的基本示例表单，几乎是经典的表单模板。


    - B) 在项目中添加并使用 .qml 文件


    一旦您使用 QT Design Studio 设计（编辑）了界面，就可以通过项目的“添加现有项”菜单项将其轻松包含在 .NET Core 3 项目应用程序中。.NET
    方法由 QML 界面无缝调用（几乎，您需要实现它）。不要忘记将 .qml 文件的属性更改为“content”，如图 1 所示。


    ![](img/3d310cc066dda6e2dfa67a650614076f_234_0.png)


    (图 1)


    此项目是使用 .NET Core 3 开发 QML GUI 应用程序的基本示例项目，它使用常见的 QT Quick 控件作为界面。“Universal”主题的使用说明了在
    .qml 文件中使用主题，该主题还需通过以下指令在 C# 代码中加载：


    ```

    QQuickStyle.SetStyle("Universal");

    ```


    在 QT Quick 中，您可以在多个预定义主题之间进行选择：


    - 默认

    - 材质

    - 通用

    - Fusion

    - Imagine


    关于 QT Quick 控件主题的详细信息，可参阅下方的参考链接。


    https://doc.qt.io/qt-5/qtquickcontrols2-styles.html


    “解决方案资源管理器”窗口中的项目视图非常基本，仅包含添加到 Program.cs 的 .qml 文件。


    在更复杂的项目中，您需要为使用的每个 .qml 文件添加一个类（.cs 文件）（最佳实践）。


    ![](img/3d310cc066dda6e2dfa67a650614076f_235_0.png)


    (图 2)


    请注意，您还可以将“QT Design Studio”关联为 .qml 文件类型的默认编辑器（请参阅 Visual Studio 内的 Gtk/Glade
    集成部分），以便在 IDE 中更轻松地操作此类文件。受之前示例（由 Paul Knopf 提供）的启发，该项目是一个带有标签和按钮的基本表单的实现，此处未使用效果或动画，这是最小项目（仅实现了“Universal”主题的使用）。


    该应用程序的功能相当有限（它实现了由按钮触发的标签控件文本更改），但它为开始开发 QML.NET 应用程序奠定了基础。


