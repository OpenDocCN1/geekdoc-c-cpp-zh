  - '[PAGE 149]


    The Electron.NET.CLI is the command line tool used to build and package the Electron
    application, it is not used inside the code of the application (it is a tool).
    Electron.NET.CLI is mandatory for running your .NET Core Electron.NET application.


    You can install this tool with the command line described below (this is a toolset
    package for dotnet CLI). It can be installed as a global tool for dotnet CLI,
    extending it with the “electronize” command.


    ```

    C:> dotnet tool install ElectronNET.CLI -g

    ```


    After the setup of Electron.NET.CLI in .NET Core, the command “electronize” is
    available as a global tool for the dotnet CLI. The “electronize” command will
    be installed only for a specific .NET Core version, the tool itself is installed
    in the user folder: %UserProfile%/.dotnet/tool/


    But before using the Electron.NET wrapper the .NET Core application developer
    have to install the prerequisites tools: Node.JS and its dependency NPM.


    # 8.3.3 Setup of NPM and Node.JS


    NPM stand for Node Package Manager, Node.JS is the JavaScript runtime engine from
    the Chromium project (developed by Google). Electron.NET requires a version >8.6
    of Node.JS. We recommend to install the NodeJS from the dedicated web site (see
    web address in reference) for getting the latest version of the tools and guaranteeing
    a proper install on each system.'
