    # 5.3 DATA ACCESS: ENTITY FRAMEWORK CORE


    With .NET Core 3, the developer can still use classical ways (as done with .NET
    Framework) to access the database (Command, Request Reader...) but for modern
    advanced software solution the data access have to be layered in a standardized
    way (with ORM).


    The data access in .NET Core should be done (that''s not mandatory, but it'' highly
    recommended) by using the Entity Core component (a NuGet package). This is the
    ORM (Object Relational Mapper) developed by Microsoft inherited from the dotnet
    framework (Entity Framework).


    The Entity Framework Core has followed the trend set, as .NET Framework, to a
    lighter multiplatform environment.'
  - '[PAGE 71]


    EF Core includes a set of APIs allowing you to use a structured (with a good readability
    of the code and good maintainability) way to access your data. It allow you to
    work with data with .NET object instances (with LINQ request support).


    EF Core simplifies your work for making the Data Access Layer of your application.
    Actually, EF Core can generate that layer for you.


    # 5.3.1 Database Provider


    As its predecessor, Entity Framework 6, EF Core integrate already many database
    providers as:


    +   - SQL server

    +   - MySQL

    +   - SQLite

    +   - Oracle

    +   - PostgreSQL

    +   - CosmosDB (NoSQL database from Microsoft)

    +   - ... and many more providers continue to be added as the EF Core community
    is a most vibrant one.


    More providers can be found here:


    ![](img/3d310cc066dda6e2dfa67a650614076f_71_0.png)


    # 5.3.2 Architecture of the EF Core


    The EF Core provide to the developer an integrated layered solution who provide
    the possibility to abstract the database operations of the application, to use
    .NET objects.'
  - '[PAGE 72]


    This layering provides a better flexibility regarding the database hosting system
    (for example if you have to change the type of database you use).


    It provides also the ability for the developer to use advanced .NET features for
    manipulating data objects like: the use of Lambda function, the use of LINQ request.


    The following schema illustrate the general architecture of EF Core:


    ![](img/3d310cc066dda6e2dfa67a650614076f_72_0.png)


    # 5.3.3 EF Core Installation


    For getting EF Core available in your project you have to include a specific package
    regarding the type of database you want to use and the EF tools allowing to use
    the advanced features in your code.


