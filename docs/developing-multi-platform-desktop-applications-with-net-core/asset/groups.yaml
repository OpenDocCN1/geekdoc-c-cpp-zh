    # 8.1 CHOOSE THE MULTIPLATFORM APPLICATION TYPE: THE RIGHT TOOL FOR THE JOB


    According to the type of project you intend to develop, the choice of the languages
    (C++, HTML, XAML ...) and the targeted framework is crucial.


    Many solutions exist already on the market for multiplatform development but only
    .NET Core 3 provides you the state of the art in the arena, regarding performances,
    maintainability, language features, packaging and deployment capabilities.


    In the present book we will offer you a panorama of solutions for solving the
    specific issues you could experience during a multiplatform desktop application
    development using .NET Core 3.


    Each solution proposed could address specific constraints or provides specific
    features your application has to integrate, none of these solutions offer a perfect
    response to all multiplatform desktop development needs, that''s why you have
    to give a particular attention to the choice of the development type you will
    initiate to respond to your software specifications (and according to the resources
    available).


    This can be achieved by studying carefully each solution examples this book provides:


    +   - The console GUI application.

    +   - The web GUI (Electron.NET) application.'
  - '[PAGE 129]


    +   - The native GUI applications (Graphic Library C++, GTK, QML).

    +   - The XAML GUI (Avalonia) application (some kind of Natives too).


    Among these solutions, you should find THE solution, the one, the most adapted
    to the constraints and requirements of your project.


    This choice is also conditioned by the type of developer you are (or in witch
    kind of development you have much more experience for producing a quality product).


    +   - If you come from the web-oriented development (ASP.NET developer) it should
    be a smart choice to start a desktop application with a tool allowing you to leverage
    this knowledge straight away by using Electron.NET.

    +   - If you are a good C# and/or C++ developer (console, system, service) you
    can choose one of the native''s solution for implementing a GUI (LibUI, GTK#,
    QML.NET).

    +   - If you are a C# .NET framework desktop application veteran (or WPF developer)
    you surely oriented yourself to the solution proposed by Avalonia (but also may
    be QML or GTK solution)


    In resume, the choice of the solution''s type will be matter of the resources
    available and the requirements of your project.


    # 8.2 CONSOLE GUI APPLICATIONS


    Console GUI have been disregarded by number of developers since the development
    of graphical user interface, but in many cases, it'
  - '[PAGE 130]


    could be a smart choice (even if that''s not the trendiest) for the development
    of multiplatform applications.


    Those last years, many libraries have been developed for building “nice” interface
    for console programs.


    That''s in part due to the fact that many cloud frameworks (most of them are multiplatform)
    have been developed for the server world and de facto with no GUI implementation.
    In that context, coders have felt the lack of commercial offer in that specific
    domain and many propose their own solution. Most of these libraries are the fact
    of developer''s personal project and does not offer support of any kind other
    than their contact on the GitHub.


    Despite that, the implementation of a console GUI application Includes many benefits
    as:


    +   - Reduce the resource used for the information display.

    +   - Can be easily deploy via container (Docker, or Kubernetes).

    +   - Reduce development time and focus really on the purpose of the application.

    +   - No need to use costly library (save RAM and CPU).

    +   - Only one version of the program is compiled on every OS (Windows, Linux,
    macOS).

    +   - Vintage cool look (personal taste).


    Here is a selection of few libraries made after trying several available console
    GUI toolkit frameworks from GitHub (this is a non-exhaustive list, as the subject
    become much more trendy many new projects are emerging):


    +   - ConsoleDraw.

    +   - EasyConsole.'
