    it allows the developers to centralize the code in a single project for every
    OS.


    Visual Studio 2019 can be used (with all the productivity benefits that bring)
    for the C# development of a solution working on Windows, Linux and macOS.


    We will provide a special introduction for the C# .NET framework (classic) developers
    to adapt quickly to the new .NET Core environment.


    A presentation of the best practices for this project''s type will also be provided
    allowing you to start a new project as fast as a single OS targeted project would
    be. These rapid presentations will help you to drive wisely your developments
    and avoid many pitfalls intrinsic to these project''s specifics.


    We will review the new features included in .NET Core 3 and why choose this framework
    among the other development suites available on the market like Node.JS, Mono,
    ...Java.


    The essential knowledge required for a professional software development project
    management will be study (planification, SDLC, tests) as well as the general organization
    of your development environment.


    A rapid introduction of C# common coding techniques will be provided for solving
    quickly, usual requirements of a project:


    - database access.

    - Logging.


    - web services access.

    - using the native API.

    - ...


    (Of course, if you are a C# veteran developer you could skip this part).


    The fundamental knowledge specific for the conception of a GUI will also be introduced
    covering several aspects:


    - Ergonomic.

    - Basic rules about GUI design.

    - Graphic presentation.

    - Typography.

    - Colors scheme.


    This part is relevant if you do not have any solid theoretical knowledge about
    the design of a human to computer interface.


    After that we will review the setup of a complete development environment on Windows
    (this is the main development station) for developing an application targeting
    Windows, Linux (ubuntu) and macOS (Mojave).


    Since the best IDE for developing with .NET Core 3 is Microsoft Visual Studio
    2019 we will present you the general concepts and tools useful for being quickly
    efficient with this marvelous IDE (available freely from the Microsoft web site
    in its community version). We will review how to code and debug an application
    targeting multiple OS.


    Afterwards, we will present you several GUI solutions for your project illustrated
    with example projects you can directly use as tutorials or as boilerplates for
    starting your project: Console GUI, Native GUI, ASP.NET GUI, XAML...


    We will show you how to develop and implement the tests projects required for
    the development of your application. We will see how to implement the tests during
    the coding step of your project, and, how to improve performances of your application
