    namespace Microsoft.VisualStudio.TestTools.UnitTesting.


    The test validation can be done by using the following methods (not an exhaustive
    list) of the ASSERT class:


    - ASSERT.AreEqual(): Validate the function tested, by checking the value of the
    result of this one (but you have to know the result value).

    - ASSERT.AreNotEqual(): Validate the function (test passed ok) if the result is
    not the value tested.

    - ASSERT.Same(): Validate the function if the resulted object and the expected
    object are of the same type.

    - ASSERT.NotSame(): Validate the function if the result object and the expected
    object are of different type.

    - Assert.IsNull(): Validate the test if the value checked is equal to Null.

    - Assert.IsNotNull(): Validate the test if the value checked is different from
    Null.


    There are several other ASSERT methods available (see documentation in reference)
    for various test validation types but these ones are used in most of the cases
    encountered by developers (these are the most often, actually, used).


    Be careful, the choice between all these types of validation will make your unit
    testing code relevant for the checking of the method or not. If you do not choose
    the adapted assertion for the validation, the test can be useless, or worse, not
    checking the code validity.


    When the ASSERT method is not validated an exception is thrown (ASSERT Exception)
    and the test is “failed”.


    ### 7.1.2.3 Execute unit tests


    For Executing the Unit Testing projects, you will have to use the “Test Explorer”
    window as shown below:


    ![](img/3d310cc066dda6e2dfa67a650614076f_121_0.png)


    (test Explorer)


    You can run all the tests for the project at once by using the “Run All” menu
    or a specific test by selecting it with context menu “Run”


    ### 7.1.2.4 Visualize test results


    The result of the tests can be seen in “Test Explorer” window, a green check mark
    indicating the test is valid and a red cross indicating the test has failed as
    shown below.


    ![](img/3d310cc066dda6e2dfa67a650614076f_122_0.png)


    MSTest offers a good solution for the implementation of Unit Testing in your project,
    as native inside Visual Studio the tool Integrates itself perfectly with the IDE
    of Microsoft. It is very well documented by the Microsoft team. References and
    tutorials can be found by following the link in reference.


    ![](img/3d310cc066dda6e2dfa67a650614076f_122_1.png)


    ### 7.1.3 Mock concept


    The issue for the definition of pertinent Unit Testing is the developer context:
    many objects are not yet been defined or the database is not yet available when
    the unit tests project is written. That could be an issue because the developer
    has to test the method with the larger panel of input data as possible, covering
    every case possible (in theory).

