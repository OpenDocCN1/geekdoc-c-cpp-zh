    # 10.4 NATIVE EXECUTABLE COMPRESSION


    The generation of a native executable (by using CoreRT capabilities) is by itself
    a good way for the improvement of the program''s general performances.


    The framework does not need to be loaded anymore for the execution of the application
    and the generation of the machine code from the MSIL by the CLR has already been
    done.


    Besides, when you generate a machine native executable file of your application
    you can benefit from the existing tools for their compression.


    The compression of the executable file can provide performances gain (most of
    the time) and code security improvements for the application. Because the size
    of the executable produced by .NET Core 3 is not negligible (the .NET Core 3 is
    packed within the executable), the compression of the executable can improve the
    general performance of the application.


    There is several Opensource tool for achieving such compression, especially on
    the Windows platform but the most popular is UPX (Ultimate Packer for eXecutables).
    UPX can optimize the size of executable file on Windows, Linux and macOS.'
