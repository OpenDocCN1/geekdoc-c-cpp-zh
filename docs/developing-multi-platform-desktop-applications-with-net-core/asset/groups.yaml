    The well though architecture of the .NET Core provides many

    benefits for its exploitation in a production environment as you can

    see _(figure 1)_ compared to the classical .NET framework (who is

    Windows dependent).


    | | .NET framework | .NET Core 3 |

    |---|---|---|

    | Windows Update | Yes | No |

    | Deploy Runtime | Depends | Yes |

    | Side by Side install | No | Yes |


    _(figure1)_

    _(Source Microsoft)_


    A key point in the .NET Core is the use of a dedicated packet

    manager format: NuGet.


    The NuGet packaging system is integrated in Visual Studio 2019 and

    is like APT for Debian, NPM for Node.js or pip for Python. NuGet

    allows the availability of every and each library by encapsulating

    binaries and their dependencies inside a single file. This file (.nupkg

    extension) is a ZIP archive who contains a manifest with all the

