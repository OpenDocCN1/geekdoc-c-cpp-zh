    The installation can be done, as usual, with the Package Manager or directly from
    the Visual Studio project window (Manage Package).


    # 5.3.4 Data model


    When you develop your application with EF Core, you have the choice between two
    distinct methods for achieving the integration with the database:


    +   A) Model First:


    When you use this method the data model is defined by your data model (by code),
    this is interesting to use this approach when you use a database for storing the
    data produce by your application. The model first storage is used when the database
    is not yet defined or when you start to develop from scratch your application.


    +   B) Database First:


    When you use this method, you reverse engineer your database for generating the
    data model. This method is used when you are working on a preexisting database
    or when the database is developed by another member of the team, a database developer
    for instance.


    For enabling the scaffolding of your data model from your database you have first
    to install the required package:'
  - '[PAGE 74]


    This package will allow you to use the PowerShell command:


    # Scaffold-DbContext.


    Here is sample command for using this PowerShell command to execute in your Package
    Manager window:


    ```

    PM>Scaffold-DbContext

    -Connection

    "Server=(localdb)\\mssqllocaldb;Database=MyDb

    ;Trusted_Connection=True;"

    -Provider

    Microsoft.EntityFrameworkCore.SQLServer

    -OutputDir ./DataModel

    -Context MyDbContext

    -Tables <tablename>

    ```


    This “scaffolding” will generate files (.cs) who will define the objects you will
    be able to manipulate in your code, by default there is a file generated for each
    object of the database but you can specify for which table(s) you want to generate
    (for example with -Tables for specific tables). Scaffold specific Views or Store
    procedures is not (at the time this book is written) allowed.


    Please review the online help available for the tools to get the list of all option
    you can use to generate the required data model.'
