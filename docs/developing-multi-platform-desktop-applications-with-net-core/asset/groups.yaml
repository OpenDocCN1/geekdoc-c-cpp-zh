    This is a very handy package, it add a new type of application for the developer
    to generate with the dotnet CLI, it add also the possibility to create new widget,
    window or dialog object (with the .glade file included).


    The installation of the template package can be done with the command line described
    below (this is the standard command line for the installation of new project template
    for the dotnet CLI):


    ```

    C:>dotnet new install

    GtkSharp.Template.CSharp --version

    3.22.24.37

    ```


    The version number is optional and can be omitted. Here is the result screen after
    the installation of this template package (figure 1).


    ![](img/3d310cc066dda6e2dfa67a650614076f_196_0.png)


    (figure 1)'
  - '[PAGE 197]


    After the installation of this package the GTK new project templates should be
    available by using the “dotnet new” command line, these new items are:


    +   - GtkSharp.Application: Produce a complete Gtk application with .csproj, .cs,
    glade file.

    +   - GtkSharp.Dialog: Produce a .cs/.glade file for adding a dialog window to
    an existing project.

    +   - GtkSharp.Widget: Generate a .cs/.glade file for a control (widget).

    +   - GtkSharp.Window: Generate a .cs/.glade file basic gtk.window.


    Only the GtkSharp.Application is a project template for .NET Core, the others
    are items template for adding elements to your application (Dialog, Widget, Window),
    the default name for the generated element is the name of the folder where the
    command is executed (if you do not specify output name).


    You can verify if all these templates have been installed properly with the command
    “dotnet --list” who list the available templates for the “dotnet new” command
    as described below.


    ```

    C:>dotnet new --list -lang C#

    ```


    The “-lang” option is used as filter on the result for selecting only the C# type
    items. Here is the result for this command:'
  - '[PAGE 198]


    | Short Name | Language | Tags |

    | :--- | :--- | :--- |

    | Console Application | console | C#, C++, F#, VB |

    | Class Library | classlib | C#, C++, F#, VB |

    | Unit Test Project | unittest | C#, C++, F#, VB |

    | xUnit Test Project | xunit | C#, C++, F#, VB |

    | ASP.NET Core Empty | web | C# |

    | ASP.NET Core Web App (Model-View-Controller) | mvc | C#, F# |

    | ASP.NET Core Web App | razor | C# |

    | ASP.NET Core with Angular | angular | C# |

    | ASP.NET Core with React.js | react | C# |

    | ASP.NET Core with React.js and Redux | reactredux | C# |

    | Razor Class Library | razorclasslib | C# |

    | Razor Page | page | C# |

    | Microsoft Identity Platform (Azure AD v2.0) Web Application | webapp | C# |

    | Worker Service | worker | C# |

    | gRPC Service | grpc | C# |


    You can now create a new GTK application with the .NET Core 3 command line client
    as described below:


    ```

    C:>dotnet new gtkapp -n sampleGtkApp

    ```


    This command line will create a GTK application with the name of project “sampleGtkApp”
    (this is the standard behavior of the new dotnet CLI command).


    The template application created uses the .gradle file format for describing the
    GUI. This format can be loaded in a Gtk.Builder object (we will review this point
    in details later).'
  - '[PAGE 199]


    You can find more information about the use of Gtk.Builder with the reference
    links below.


    ```

    http://gtkbuilder.org/

    http://gnome.org/gtkbuilder

    ```


    In the template, the .cs file and the .glade file have the same name,

    that’s make it easy for the developer to modify both side of the

    window (for-end and backend).


    The application generated can easily be modified and extended; by

    using Glade for the edition of the xml file (.glade extension)

    corresponding to the main window.


    You can notice that the application template generated by this

    package use the model of a GUI based on an XML file. But with GTK

    you have also the possibility to implement the GUI with inline C#

    code, we will review these two types of GTK implementation in the

    examples section.


    Before it is useful to study the GTK interface designer: Glade.


    # 8.5.4 Glade: The user interface designer


    Glade is an application allowing the conception and the design of

    GUI without writing the code manually. This application came in

    replacement of the Stetic Gui Designer (used with Mono, the cross-

    platform .NET framework).


    Like its predecessor, it is a RAD tool with WYSIWYG capabilities who

    make it easy to develop a GTK+ GUI. Glade is programing language

    independent, in the sense that it does not produce any code, the

    file who describe the designed GUI is encoded according to a

    standard XML format. GTKBuilder is the format of this XML file.'
  - '[PAGE 200]


    Glade takes care of the generation of the XML code who describes the UI and produces
    a XML file loadable through the GtkBuilder (with a GtkBuilder object). These XML
    files can be thereafter be used in your GTK# .NET Core 3 C# application (actually
    with any languages you use for developing with the GTK Toolkit).


    You can find more information about Glade with the reference links below.


    ![](img/3d310cc066dda6e2dfa67a650614076f_200_0.png)


    # 8.5.4.1 Install Glade for the use with Visual Studio 2019


    For an easy edition of the GUI XML file, Glade can be called from within Visual
    Studio 2019.


    You can easily configure in Visual Studio, Glade as the default program for opening
    the “-glade” extension file type (figure 1). Thus, the integration for the GTK
    GUI will appear integrated inside the Visual Studio environment, you will be able
    to edit the “.glade” file from the “Solution Explorer” in Visual Studio.'
  - '[PAGE 201]


    ![](img/3d310cc066dda6e2dfa67a650614076f_201_0.png)


    (figure 1)


    You have to select “Set as Default” when you open the “glade” file for a permanent
    association with Glade.


    Once the installation and the configuration of Glade has been done in Visual Studio,
    you just have to edit the “glade” file according to your requirements by double
    clicking on it in the “Solution Explorer” view.


    # 8.5.4.2 Interface design with Glade


    The design of the GUI with Glade is almost intuitive for every developer (almost
    same as the Winforms designer in Visual Studio). As you can see in the (Figure
    2) below, it offers similar features.'
  - '[PAGE 202]


    ![](img/3d310cc066dda6e2dfa67a650614076f_202_0.png)


    (Figure 2)


    The Glade application (Figure 2) is composed of three distinct panels corresponding
    to three functionalities of the application:


    +   - Left side panel: The hierarchical tree representing the widgets present
    in the containers. Glade allows to add widgets or containers (who is also a widget
    for GTK). The form (or screen) design follows a hierarchical tree of widget. You
    can also select widget by name in this view.

    +   - Center panel: The main view of the designer. This panel allows to the developer
    to set the position, the size of the widget selected (it allows also the widget
    selection) and the addition of new widget.

    +   - Right side panel: This panel regroups four different features regarding
    the selected tab:

    +     1. The view of the properties of the selected widget (with the tab “General”).'
  - '[PAGE 203]


    +   2. The view used for the positioning of the widget and his docking, packing
    in the GTK terminology (with his tab “Packing”).


    +   3. The view used for common properties of the current selected widget (with
    the tab “Common”).


    +   4. The view for the management of the signal sent on different event associated
    to a widget (with the tab “Signals”).


    These simple concepts are sufficient for the design of an efficient GUI for your
    application with Glade.


    Note that, the mastering of Glade is not immediate and should require a learning
    curve, variable according to the developer.


    # ## 8.5.4.3 Defining Signals/Handler within Glade


    Once you have done the graphical design, Glade can be used for making the link
    between the interface and your backend program (the C# code).


    GTK follow an architecture of type signal/handler (a classic). With this logic,
    Glade allow the developer to specify the type of signal sent by an event on a
    specific widget (within the right panel). This implementation is done directly
    from the Glade application by the specification of the appropriate method name
    call on a specific signal as described (figure 3).


    You will notice some signal are marked “deprecated” in the Glade interface but
    you can use the deprecated signals too (as in the shoot screen).'
