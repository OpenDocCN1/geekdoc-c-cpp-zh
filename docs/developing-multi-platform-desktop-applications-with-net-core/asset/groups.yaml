    \ in a JSON formatted file, but the main using technics are still relevant.\n\n\
    Here is a sample of a basic “appSettings.json” file:\n\n```\nappSettings.json\n\
    {\n  \"firstname\": \"Dimitri\",\n  \"lastname\": \"K\"\n}\n```\n\nDo not forget\
    \ to copy the “appSettings.json” file to the target build folder by changing the\
    \ properties of the file as described below (figure 1):"
  - "[PAGE 62]\n\n![](img/3d310cc066dda6e2dfa67a650614076f_62_0.png)\n\n(figure 1)\n\
