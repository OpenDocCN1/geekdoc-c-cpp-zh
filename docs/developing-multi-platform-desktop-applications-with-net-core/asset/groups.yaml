  md: '

    Even if Qt is most often used by the C++ developer''s community (with the complete
    development environment QtCreator) the bindings, QML.NET provides to the .NET
    Core Creator a great way to integrate the QML language in the .NET Core developer
    toolbox. Here also, QML.NET has been developed using the .NET Standard marking
    the maintainability in the future of the applications developed today.


    Avalonia appears to be in the continuity of the development of Microsoft WPF.
    As its name suggest (Avalon is the code named used by Microsoft during the development
    of WPF), it integrates the current XAML principles from WPF for porting it to
    multiplatform (Windows, Linux, macOS, Android).


    Avalonia seems to be a quick choice for the WPF application developers, as the
    standard XAML used is similar to the WPF (but not compatible). Even if the development
    is not very active (it was in alpha version during several years), the professional
    quality of the releases, the availability of dedicated tools and the abundant
    documentation could suggest it could be much more widely used by the .NET developer''s
    community. Even if that is not the case in the future, the use of .NET Standard
    dependencies would guarantee the code maintainability in the long run of the application
    developed today.


    For resuming most of the tools presented in this book could provide a pertinent
    response for the development of multiplatform application according to the specific
    requirements and the contexts of these developments.


    Another important factor, for the choice of a solution type, is also the current
    skills available for making the application (the human resources). It is, for
    sure, a determinant criterion who will do the choice by itself in many development
    teams.


    So, we have seen there is many parameters for choosing a tool rather than another
    one. You should consider also the life expectancy you intend for your software.
    If your application does not intend to be used on a long run, or being developed
    for technologies demos purpose you could consider more fancy and trending tools
    (but often unstable). If you plan to develop an application with several release
    along many years, you will have to keep in mind that the tools you choose will
    be always developed and supported (or at least maintainable) for the time frame
    you target.


    We hope that this book is a great source of inspiration for your .NET Core 3 development
    project. As it is an always evolving technology be assured we will release updated
    edition about the exciting subject of the .NET Core GUI desktop development.


