    With this line of code, the web application is executed inside an Electron window.


    # G) Initialization of the application:


    The first time you start the Electron application you have to “initialize” it
    with the command described below (you have to be in the application folder).


    ```

    ::\appPath>dotnet electronize init

    ```


    This command will create the “electron.manifest.json” file who is used by the
    “electronize” command for the execution of the program (this file describes the
    Electron context).


    # H) Execute the application:


    After that, you can execute the Electron.NET ASP.NET Core application with the
    command “start” as described below (in the application folder for Windows and
    in the solution folder for ubuntu and macOS).


    ```

    ::\appPath>dotnet electronize start

    ```


    On ubuntu and macOS you have to use the “electronize” command without the “dotnet”
    part as described below.


    ```

    > electronize start

    ```'
