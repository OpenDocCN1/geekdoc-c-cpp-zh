  - '[PAGE 66]


    First of all you have to begin by creating a log factory instance, next you have
    to specify the provider you want to use for effectively doing your logging (in
    the sample: “AddConsole”).


    This is simple solution for creating a basic logging system but if your development
    has special requirements for logging, trace and debug you should go further and
    explore the possibility to use a more advanced system for doing so: Serilog.


    # 5.2.2 Advanced structured logging system: Serilog


    Serilog is a structured logging system, currently implemented with .NET standard
    2.0 so you can use it within a .NET Core 3 project. Serilog is a Library providing
    diagnostic logging to files. It is easy to setup, and unlike other logging libraries,
    it is built with powerful structured event data in mind so is very well adapted
    to desktop application development.


    With this logging system you can implement a console debugging window for following
    each event of your application you have decided to follow and having a real time
    view of the internals of your application in real time.


    # 5.2.2.1 Install Serilog


    You have to add the Nugget package “Serilog” with the packet manager GUI in Visual
    Studio or with the package manager command line. After that you will have to install
    the package(s) specific to the type of output you want to use (it is called “Sinks”).


    A “Sink” describes the type of logging you want to implement for you project.'
  - '[PAGE 67]


    There are many other types of Sinks already available beside file and console
    you can write the loggings of your application in database, in the cloud or in
    the Microsoft Teams system ...


    # 5.2.2.2 Configuration


    The configuration of Serilog is straight forward and in most case does not require
    a specific configuration file. Nevertheless, you have the possibility to use one
    config file for responding to specific requirements of your logging system (check
    the reference web site for more Information)


    If you have special needs in that matter you can also refer back to the GitHub
    (Serilog is Opensource) repository.


    # 5.2.2.3 Create a Logger and use Sinks


    First of all, you have to create a logger object:


    ```

    Log.Logger = new LoggerConfiguration().CreateLogger();

    ```


    Once the Logger object is created it have to be linked to a specified external
    representation (for example a file or a console window)


    ```

    Log.Logger.WriteTo.Console();

    ```'
