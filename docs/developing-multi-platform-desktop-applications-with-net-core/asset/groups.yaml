    +   - Cool look and feel.

    +   - Theme support.

    +   - OO approach.

    +   - Localization.

    +   - Internationalization.

    +   - Good documentation (it is getting better)


    Keep in mind that GTK has been developed for the use and with the C, C++ languages
    and it inherits from this one its general architecture and programming logic.
    So, this kind of developments is very well adapted for the C and C++ developers
