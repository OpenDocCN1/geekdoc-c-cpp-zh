  mdcn: "\n\n你的应用程序。这些示例可以作为学习 Electron.NET 的一个良好起点。在我们可以详细审查的技术中，有原生菜单和原生对话框窗口。\n\
    \n- 使用原生个性化菜单（需要特定控制器，MVC）。\n\n你可以在下方看到一段用于在项目中实现原生菜单的代码片段（MVC 控制器）。\n\n```\n\
