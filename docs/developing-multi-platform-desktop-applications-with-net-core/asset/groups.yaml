  - "[PAGE 158]\n\nyour application. These samples can be a good starting point in\
    \ the study of Electron.NET. Among those technics we can review in detail the\
    \ native menu and the native dialog window.\n\n+   - The use of a native personalized\
    \ menu (requires a specific controller, MVC).\n\nYou can see below a snippet code\
    \ for implementing a native menu in your project (MVC Controller).\n\n```\npublic\
    \ class MenusController : Controller\n{\n    public IActionResult Index()\n  \
    \  {\n        if (HybridSupport.IsElectronActive)\n        {\n            var\
    \ menu = new MenuItem[] {\n                new MenuItem { Label = \"Edit\", Submenu\
    \ = new MenuItem[] {\n                    new MenuItem { Label = \"Undo\", Accelerator\
    \ = \"CmdOrCtrl+Z\", Role = MenuRole.undo },\n                    new MenuItem\
    \ { Label = \"Redo\", Accelerator = \"Shift+CmdOrCtrl+Z\", Role = MenuRole.redo\
    \ },\n                    new MenuItem { Type = MenuType.separator },\n      \
    \              new MenuItem { Label = \"Cut\", Accelerator = \"CmdOrCtrl+X\",\
    \ Role = MenuRole.cut },\n                    new MenuItem { Label = \"Copy\"\
    , Accelerator = \"CmdOrCtrl+C\", Role = MenuRole.copy },\n                   \
    \ new MenuItem { Label = \"Paste\", Accelerator = \"CmdOrCtrl+V\", Role = MenuRole.paste\
    \ }\n                } }\n            };\n            Electron.Menu.SetApplicationMenu(menu);\n\
    \        }\n        return Ok();\n    }\n}\n```"
