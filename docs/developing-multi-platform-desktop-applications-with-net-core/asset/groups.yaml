    For the setup of GTK you will need to setup an environment for this type of application:
    mingw. MinGW is the contraction of “Minimalist GNU for Windows”, it provides the
    Opensource environment for the development of application for Microsoft Windows.


    MSYS2 is a project who provide a Unix like environment on a Windows station (mingwin).
    This project furnishes the foundation for the development of a GTK application
    on Windows, it will allow the setup of the GTK runtime and the tools (like Glade)
    you will need for developing your .NET Core 3 GTK application.'
