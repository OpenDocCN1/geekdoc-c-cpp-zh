    \n这两个命令都使用 .csproj 文件来构建项目（添加到命令行参数中）。\n\n## 9.3 CSPROJ 文件结构\n\n.NET Core 3 使用新的\
    \ .csproj 文件格式（替换 .NET Core 2 的 project.json），供 MSBuild 用于项目构建过程。\n\n借助这种新的 .csproj\
    \ 文件格式，Microsoft 完成了出色的简化工作（比以前简洁得多），同时也为其添加了功能（例如指定在构建时生成 NuGet 包）。\n\n.csproj\
