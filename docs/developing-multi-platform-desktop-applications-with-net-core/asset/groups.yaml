    ## 8.2.1 What is Terminal.GUI ?


    Terminal.GUI (or Gui.cs) is a console-based user interface toolkit for .NET Core
    applications. The original version was developed for being used with Mono (cross
    platform .NET framework now known as Xamarin products). It has been ported to
    .NET Core in 2018.


    It is designed to work on monochrome and color display using predefined color
    schemes (built-in). This toolkit integrates already an important number of working
    controls (or widgets).


    It is event based so the threading of each functions called should not interfere
    with the main thread of your application. You can also use the async/await pattern.


    Here is a list of the controls already implemented in Terminal.GUI:


    - Button

    - Label

    - Text entry

    - Text view

    - Radio button

    - Checkbox

    - Dialog box

    - Message box

    - Windows

    - Menus

    - List

    - Frame

    - Progress Bar

    - Scroll views and Scrollbar

    - Hexadecimal viewer/editor (HexView)


    Obviously, a such panel of widgets available makes possible to develop a complex
    GUI application with advanced features (for a TUI).


    The package is developed using the .NET Standard so it is able to work with the
    .NET Core 3 version, the source code is available at the author repository on
    GitHub.


    ![](img/3d310cc066dda6e2dfa67a650614076f_133_0.png)


    In addition, Terminal.GUI is also available as a NuGet package for a rapid integration
    in your .NET Core 3 project.


    ![](img/3d310cc066dda6e2dfa67a650614076f_133_1.png)


    This library seems to offer the best support for mouse (on Windows, macOS) and
    ASCII GUI program implementation (in the panel of the tools reviewed).


    The main object is Terminal.Gui.Application, Application is implemented by an
    instance of the MainLoop object. This object includes several key features:


    - Keyboard and mouse management

    - .NET Async support

    - Threading GUI

    - Possibility of integration with other MainLoops for multiple screen application


    This solution has been also recognized by Microsoft for developing console GUI
    application.


    Terminal.GUI Wiki:

    https://github.com/terminal.gui


    Microsoft broadcast about Terminal.Gui on Microsoft /Build 2018:

    https://www.youtube.com/watch?v=Se1zNWJwDUE


    Do not miss to view the YouTube video from the RETRO programming event (2018).
    This Microsoft broadcast with the creator (Miguel DeIcaza) is really informative
    about the different features available and can be used as a quick learning method
    for introducing yourself to the use of this library.


    ## 8.2.2 Terminal.GUI screen design


    With Terminal.GUI you do not have a visual designer for your screen and you have
    to code the GUI in C#. Each control has to be declared, configured, and added
    to a parent object by C# coding.


    That means, you have to make (by yourself) a clear separation in your code between
    the functional logic of your project and the presentation implemented with Terminal.GUI.


    For doing so, we recommend to separate the screen related task (display) to a
    specific source file (.cs) to not interfere with the logic and functional aspects
    of your project (see samples).


    As you have to code your GUI, you should have a clear-cut idea of the screen''s
    design before the coding phase. For achieving this goal, you have to sketch your
    interface on paper (or use a dedicated software) and use the paper grid as a character
    unit as shown (figure 1), be careful of the format for the screen you target.


    ![](img/3d310cc066dda6e2dfa67a650614076f_135_0.png)


    ### (figure 1) (40X25 screen canvas)


    You have to define the screen size you target (40*25, 80*40 or others...), put
    numbers on columns, rows and sketch each control on this grid: window, group,
    menu, label, button...


    In this case you can use the website furnished in reference for sketching your
    ASCII app (as you can see figure 1).


    The numbers on columns and rows will provide you the positioning elements for
    your controls. You have to do this work for each screen, window and dialog window
    of your application.


    Once the sketch is done you can retrieve the coordinates of each control from
    the grid and thereby avoid the tedious task of locating each control by repositioning
    them after try and fail loop until you achieve the expected result.


    Terminal.GUI furnish methods for:


    - Defining Windows size to full screen (retrieve the available dimension of the
    current console display).

    - Positioning window, dialog form and control in that screen.

    - Manage keyboard and mouse input.


    Like every open source project you can extend the Terminal.GUI framework with
    your own controls and features, you can have a preview of what can be achieve
    in matter of ASCII widget design by visiting the website in the reference below.
    This site propose design for exotic and innovative text widget design.


    ![](img/3d310cc066dda6e2dfa67a650614076f_136_0.png)


    ## 8.2.3 Console GUI example applications


    The two following example projects are developed using the publicly available
    NuGet package, the complete source code of each of these programs are available
    on the netcore3 GitHub (see appropriate web pointers).


    - For the coding of the first example of a console GUI application we will use
    the base example furnished on the original site as boiler plate: a full screen
    text editor.

    - For the second sample: a mini dashboard, this example will demonstrate the use
    of several types of controls and layouts available with this library.


    ### 8.2.3.1 Coding of the Text Editor (consoleTextEditor)


    An always useful developer tool, the “consoleTextEditor” application is built
    around a full screen form with a top menu and an editor window. It offers to the
    user the opportunity to create and modify text file with a “textview” control.


    Here is the screen shot of this application running on the different platforms.


    ### macOS:


    ![](img/3d310cc066dda6e2dfa67a650614076f_137_0.png)


    ### ubuntu:


    ![](img/3d310cc066dda6e2dfa67a650614076f_138_0.png)


    ### Windows:


    ![](img/3d310cc066dda6e2dfa67a650614076f_138_1.png)


    The size of the main window is automatically sized to use the full console screen,
    and the resizing of the window is possible (Windows and Linux).


    The menu items are accessible by using the “F9” function key on Windows and macOS,
    “Esc 9” on ubuntu. The usual copy/paste functions are available from the keyboard
    usual shortcuts.


    As mentioned before, the presented version is a refactoring (architecture, file
    organization, presentation) from the example project furnished in the source library
    repository.


    The “consoleTextEditor” application is provided as example and can be used as
    a teaching sample for the development of a GUI console application regarding the
    menu integration, Windows, buttons ...


    The project has been refactored in order to furnish a better organization of the
    general architecture. This sample project does not implement best performances
    practices but the general architecture can provide the base for the arrangement
    of the source code for a console GUI project.


    This minimal application includes two files:


    FileOperation.cs: The basic functional functions of the program (open / create
    / save file) are implemented in a dedicated class, these objects rely only on
    the .NET Core 3 framework for every platform.


    Gui.cs: In this file you will find the definition of each windows of the application
    (Main Editor, Open document, save document, New Document, About, Error Message
    windows, Quit confirmation ...). This object implements every code relative to
    the display of windows and controls of the interface.

