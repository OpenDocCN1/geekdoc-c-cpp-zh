    \ code: retrieving the current process ID, it is better to make a copy of the\
    \ dependencies in the folder of the application. A tricky part for using system\
    \ native libraries in your code is to retrieve the location of these libraries\
    \ in each system. That's a point where you can encounter many troubles and the\
    \ copy of the libraries in the project folder (or in a subfolder in the project)\
    \ can help you to solve most of these issues. You have also to verify that the\
    \ paths of the project context contain the required libraries for the OS where\
    \ your application should be executed.\n\nIn the previous sample we can see that\
    \ the native calls are changing according to the OS, in this case multiplatform\
    \ development means producing the code for each platform specifics.\n\nIf you\
    \ want to use native functions that are not already written and accessible in\
    \ the system API of the OS, you have to develop your own libraries (one version\
    \ for each OS).\n\nHere is some reference links about the systems APIs for each\
    \ OS.\n\n- Windows: http://pinvoke.net\n- Linux (ubuntu): http://kernel.org/doc/html/latest\n\
    - macOS: https://developer.apple.com/library/archive/navigation/\n\n## 5.6.2 Marshalling\n\
    \nMarshalling: is the process of transforming types when it's needed to allow\
    \ cross between native code and managed (in our case .NET Core 3) code.\n\nHere\
    \ is the table of the type conversion to use with .NET Core 3 types and native's\
    \ types.\n\n| .NET Type | Native Type |\n| :--- | :--- |\n| byte | uint8_t |\n\
    | sbyte | int8_t |\n| short | int16_t |\n| ushort | uint16_t |\n| int | int32_t\
    \ |\n| uint | uint32_t |\n| long | int64_t |\n| ulong | uint64_t |\n| char | Either\
    \ char or char16_t depending on the CharSet of the P/Invoke or structure. |\n\
    | string | Either char* or char16_t* depending on the CharSet of the P/Invoke\
    \ or structure. |\n| System.IntPtr | intptr_t |\n"
  mdcn: "\n\n- 1. 构建请求。\n- 2. 处理请求并检索数据（结果）。\n- 3. 处理结果。\n\n## 5.4.1 构建 Web 请求\n\n\
    首先，您需要指定端点地址，完成后将实例化 HttpClient 类来执行 Web 请求。此 API 仅支持异步方法（在处理网络操作时很有用）。Web 请求任务将由异步方法执行（请参阅\
    \ REST 客户端示例代码）。\n\n## 5.4.2 处理请求并检索数据\n\nWeb 请求的调用将使用 await 关键字完成（这是一个异步方法）。\n\
    \n## 5.4.3 处理 JSON 结果\n\n从 REST 服务检索数据后（HTTP 状态码 200），您需要将 JSON 结果转换为可用的 C# 对象。为此，您需要编写一个与您预期的\
