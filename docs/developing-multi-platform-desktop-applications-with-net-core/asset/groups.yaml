  mdcn: "\n\n可以受益于已经存在的、可用已久的 C++ 库（可靠性）。\n\n下面是架构图，说明如何在 .NET Core 3 应用程序中使用本机库实现\
    \ GUI（图 1）。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_166_0.png)\n\n（图 1）\n\n\
    跨平台图形库需要根据应用程序实际运行的操作系统进行切换。在此背景下，你应该拥有适用于你所使用系统的库版本。\n\n为开发跨平台应用程序，你应该为每个操作系统准备相应的库。\n\
    \n这些库中的大多数最初是为与 C++ 一起使用而开发的，因此需要开发一个 Wrapper。\n\nWrapper 将机器码库封装为 .NET Core 可访问的对象，Wrapper\
    \ 提供了向本机库进行封送和 P/Invoke 调用的方法。\n\n最终，你需要为每个平台准备编译后的库（Linux 的扩展名、macOS 的 dylib\
    \ 扩展名、Windows 的 dll 扩展名）以及一个 Wrapper（可能是一个包），才能在 .NET Core 3 中使用它并对这些（本机）库进行调用。\n\
    \n有许多基于 C 和 C++ 语言的跨平台 GUI 解决方案（许多操作系统都是使用这种语言开发的），这些解决方案是你在 .NET Core 3 中实现自己的\
    \ GUI 的良好起点，下面列出了其中最流行、经过验证且高效的解决方案：\n\n- LibUI\n- guilite\n- CEgui\n- Nuklear\n\
    \n这些框架的初衷是作为 C 程序开发的基础构件（用户界面），那么在本书中介绍这些工具有什么意义呢？嗯，C 库可以通过使用 Wrapper 类轻松地从 .NET\
    \ Core 3 应用程序中使用（参见关于使用非托管依赖项的章节）。\n\nWrapper 使得集成 C 库几乎与使用标准包一样容易。非托管库（C、C++）的集成如今由托管应用程序（.NET）很好地完成。\n\
    \n你可以在以下参考链接中找到有关这些库的更多信息：\n\n- https://github.com/andlabs/libui\n- https://github.com/idea4good/GuiLite\n\
    - https://github.com/vurtun/nuklear\n- http://xpda.net\n- http://cegui.org.uk\n\
    \n当然，你可以为最适合的库开发自己的 .NET Core Wrapper 版本，但为使用这些库编写 Wrapper 是一项大量工作，通常本身就是一个独立的项目。\n\
    \n尽管如此，其中一些库（最流行且广泛使用的库）已经为 .NET Core 开发了 Wrapper。我们选择的库已经有几个由经验丰富的个人或开发者社区制作的\
    \ Wrapper 版本，他们希望为自己的 .NET Core 开发获得一个轻量级的 C 图形用户界面框架（也为了性能）。\n\n对于以下示例，我们选择使用\
    \ LibUI。首先，这是一个专业认可的高效库；其次，已经开发并提供了几个可与 .NET Core 一起使用的 Wrapper 实现，避免了开发自己 Wrapper\
    \ 的繁琐且耗时的任务。此外，它为我们打算开发的每个平台使用原生控件。\n\n## 8.4.1 LibUI 介绍\n\nLibUI 是一个简单且可移植的 C\
    \ 语言 GUI 库，在其支持的每个平台上都使用原生 GUI 控件。这是一个由充满活力的社区开发的开源免费框架，如果你有改进或新功能要提议，并认为其他用户会很高兴拥有，也可以参与其开发（通过\
    \ GitHub 贡献）。\n\n该库适用于 Windows、Linux 和 macOS（以及其他几个操作系统！）。作为一个开源项目，你可以在 GitHub\
    \ 仓库中免费找到源代码。\n\nLibUI 库的开发仍然非常活跃，最后一次发布是在 2019 年 4 月 7 日（撰写本文时），这将保证你在遇到特定问题时拥有响应迅速的社区（这不是支持，但在许多情况下，它会帮助你修复问题）或需要特殊功能。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_169_0.png)\n\n你应该查看 LibUI 的 GitHub\
    \ 网站以访问文档并获取控件使用示例（通常使用纯 C 开发）。GitHub 网站还将帮助你了解 LibUI 下的内部逻辑（始终有用）。\n\n## 8.4.2\
    \ LibUI 的 .NET Core Wrapper\n\n如前所述，已经有几个 Wrapper 被开发用于在 .NET Core 中使用 LibUI。其中大多数\
    \ Wrapper 使用 .NET Standard 实现。可用于 .NET Core 的 Wrapper 列表来自 LibUI GitHub 网站，并得到社区认可。\n\
    \n- DevZH.UI\n- TDFX.UI (SharpLibUI)\n- SharpUI\n\n经过多次测试，DevZH.UI 似乎是最灵活的解决方案。尽管最后一次更新是在\
    \ 2017 年提交的，但这个 Wrapper 与当前版本的 LibUI（最后一次更新于 2019 年 4 月 7 日）是最新且可用的（并非总是如此）。\n\
    \nDevZH.UI 原始版本的源代码可用（参见下面的 GitHub 链接）。如果你不想使用所选的 Wrapper（DevZH.UI），也可以查看其他解决方案。\n\
    \n![](img/3d310cc066dda6e2dfa67a650614076f_170_0.png)\n\nNuGet 包的分发名称是 DevZH.UI，可在标准\
    \ NuGet 网站上找到。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_170_1.png)\n\n尽管 NuGet\
    \ 包看起来是 alpha 版本，但在所有测试平台上开发示例程序期间，源代码运行良好。我们在审查过程中没有遇到任何问题。\n\n但是，由于它被标记为 alpha\
    \ 版本，你需要按照描述在包管理器中检查“包括预览版”，以便在 Visual Studio 的 NuGet 包管理器窗口中列出该包（参见图 1）。\n\n\
    ![](img/3d310cc066dda6e2dfa67a650614076f_171_0.png)\n\n（图 1）\n\n一旦将包包含在你的项目中，你就可以使用\
    \ LibUI 库提供的许多控件和窗口类型。\n\n以下是此 Wrapper 中可访问的控件列表：\n\n- Textfield\n- label\n- Button\n\
    - Window\n- Group\n- Tab\n- Menu\n- Checkbox\n- RadioButton\n- List\n- ... 和更多\n\
