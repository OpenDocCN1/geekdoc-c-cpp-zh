    ## 10.4 NATIVE EXECUTABLE COMPRESSION


    The generation of a native executable (by using CoreRT capabilities) is by itself
    a good way for the improvement of the program''s general performances.


    The framework does not need to be loaded anymore for the execution of the application
    and the generation of the machine code from the MSIL by the CLR has already been
    done.


    Besides, when you generate a machine native executable file of your application
    you can benefit from the existing tools for their compression.


    The compression of the executable file can provide performances gain (most of
    the time) and code security improvements for the application. Because the size
    of the executable produced by .NET Core 3 is not negligible (the .NET Core 3 is
    packed within the executable), the compression of the executable can improve the
    general performance of the application.


    There is several Opensource tool for achieving such compression, especially on
    the Windows platform but the most popular is UPX (Ultimate Packer for eXecutables).
    UPX can optimize the size of executable file on Windows, Linux and macOS.


    ## 10.4.1 Quick-start guide for UPX


    UPX is a multiplatform command line tool (but here is GUI version available for
    Windows and macOS).


    ### A) UPX setup


    UPX can be installed on every platform we study in the present book. Here is the
    standard binary installation process for each OS. The developer has also the possibility
    to perform an install of UPX from the source code (freely available).


    ### On macOS:


    The easiest way to install UPX on macOS is to use the Homebrew utilities previously
    presented. Here is the formula (it''s the Homebrew terminology) for installing
    the command line UPX tool.


    ```

    $ brew install upx

    ```


    You can also install and use a GUI application for UPX it is called IUPX.


    ![](img/3d310cc066dda6e2dfa67a650614076f_300_0.png)


    ### On Ubuntu:


    UPX is available on the standard repository of the ubuntu Linux distribution.
    It can be installed with the following command line.


    ```

    $ sudo apt-get update

    $ sudo apt-get install upx-ucl

    ```


    ### On Windows:


    For the Windows setup, you have the choice between several GUI applications who
    use the UPX code for the compression of your binary application. The most popular
    one is FreeUPX.


    ![](img/3d310cc066dda6e2dfa67a650614076f_301_0.png)


    ### B) Usage of UPX


    The use of the UPX command line tool is common on the three platforms. For compressing
    a binary, you have to use the following command.


    ```

    $ upx -o hello_world_packed.exe

    hello_world.exe

    ```


    The "-o" option, stands for the output filename, this is an option for the specification
    of a new packed file, otherwise the original file will be rewritten (and shrink).
    The complete references about the commands and the options of this program are
    available online (see references below). Be careful, UPX tool come with “absolutely
    no guarantee”.


    The executable compression seems to be a good solution for the reduction of a
    native executable size (produced with .NET Core 3 and/or CoreRT). With the generalization
    of the use of pipeline for the build of applications, adding a step in the pipeline
    for the executable compression could be a winning move in terms of code security
    and performances.


    You can retrieve all the information you need about this useful tool with the
    reference links furnished below.


    - https://upx.github.io/

    - http://upx.sourceforge.net/

    - https://github.com/upx/upx


    - https://www.mankier.com/1/upx

    - https://en.wikipedia.org/wiki/UPX


    ## Chapter 11. MULTIPLATFORM PACKAGING AND DEPLOYMENT


    Once you achieve to get a proper appliance of your application you will need to
    package it for the provisioning on the user computer (deployment). But in that
    matter, there is huge difference among OS.


    These differences could imply the development of a specific setup program for
    each platform you target for your project.


    You can respond to these constraints by the development of your own specific setup
    program for each OS your software targets, but this solution is time consuming
    and adds a supplemental weight on the workload (but that can be a wise choice
    in the long run).

