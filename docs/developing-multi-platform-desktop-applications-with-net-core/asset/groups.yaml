    \n> https://installbuilder.bitrock.com/\n> https://docs.bitrock.com/\n\n### 11.3\
    \ 关于您应用程序打包和部署工具的建议\n\n打包是 .NET Core 3 应用程序平滑、和谐部署的关键。您的应用程序打包将取决于：\n\n- 您想要分发的发布类型：CLR、单个\
    \ EXE 或机器原生。\n- 您的应用程序依赖的依赖项类型：GTK、QT 等（您需要在安装程序中包含它们）。\n- 您想要针对的平台。\n- 部署上下文：您的软件是商业应用程序？共享软件？还是仅部署在贵公司计算机上的工具？\n\
    - 您想要包含在软件包中的功能（多语言、自动更新、许可证保护等）。\n\n此列表并非详尽无遗，因为许多项目都有其自身的约束。\n\n为多平台应用程序选择安装工具所固有的复杂性对每个开发人员（或团队）来说都是一项重大考量，在项目的安装程序制作任务中不应被忽视。\n\
    \n在许多软件开发项目中，尤其是在多平台环境中，这一阶段往往被低估，并产生无法衬托所安装应用程序的工具。\n\n我们可以建议开发团队在 SDLC（软件开发生命周期）中尽早着手开发他们计划用于应用程序分发和部署的安装程序。\n\
    \n由于它们是独立的项目，安装程序编码（是的，安装程序本身就是一个项目）可以在项目编码阶段同时进行。这种做法可以验证所选工具是否符合所开发软件的安装要求（依赖项设置、配置检查、环境\
    \ ...）。在专业环境中，可以分配专用资源专门负责此任务。\n\n在每个平台上使用免费可用的工具将有助于以原生格式打包的应用程序。用户将拥有一个采用其熟悉的操作系统界面（针对安装程序和应用程序）的完整解决方案。但是，这种解决方案引入了使用多个不同的开发工具，每个操作系统一个，并将安装程序项目数量乘以目标操作系统的数量。\n\
    \n另一方面，使用工具（InstallBuilder）来集中管理每个项目（每个目标操作系统一个）可以为项目本身提供更好的一致性并简化其管理。尽管如此，这种解决方案意味着需要为这项特定任务投入不小的预算。\n\
    \n但最重要的是，不要低估一个优秀安装程序的价值；不要忘记，该程序将是用户与应用程序的第一次接触，这可能会对应用程序产生积极或消极的看法。\n\n您必须确保您的安装程序解决方案为用户提供的效果与您希望通过使用您的软件为用户带来的目标体验保持一致。\n\
    \n## .NET Core 3.0\n\n## 第 12 章。所审查解决方案的前景\n\n正如我们在本书中所见，.NET Core 第三版提供的多平台开发能力简直令人惊叹。即使\
    \ .NET Core 3 不提供任何多平台桌面 GUI API，开发人员现有的可用工具今天也可以满足其项目的每一项要求。\n\n该新框架经过精心设计的架构为满足任何类型的开发人员应用程序需求提供了足够的灵活性。\n\
    \n多平台开发领域长期以来仅限于少数技术高超的人员，现在已向 C# 开发者社区开放。\n\n.NET Core 3 能够为每个平台（Windows、Linux、macOS）生成原生可执行文件（使用\
    \ CoreRT），同时还提供了使用可执行文件压缩和优化工具的能力，这些工具长期以来专供开发精英使用。\n\n本书前面审查的最新编码技术是可与 .NET Core\
    \ 3 一起使用的大量创新解决方案的完美例证。\n\n每种介绍的技术都有其自身的开发历史和起源，这将在一定程度上预先决定其未来的使用和可维护性。\n\nTerminal.GUI\
    \ 在许多情况下可以用于提供用户友好的体验，以替代控制台应用程序（并不真正用户友好，尤其是对新手用户）。您还可以考虑将其用于容器化应用程序服务的开发（在专用环境中持续运行），它可以直接从执行它的容器提供安全监控功能（在此情况下，您应该有权访问该容器）。\n\
    \nElectron.NET 是 Electron 的一个包装器。Electron 是 Google 推广的一种工具，用于扩展其 Node.JS 开发环境和社区的应用领域。不确定\
    \ Google 是否会继续维护用于与 .NET Core 一起使用的工具。该产品各版本之间的当前稳定性也不是很好。因此，如果 Electron.NET 包装器不支持未来版本的\
    \ .NET Core，也不会令人惊讶。确实，选择此解决方案的开发人员可能不得不在完整的 Node.JS 解决方案开发（完整 Electron）或使用 .NET\
    \ Core 之间做出选择。但这些是推测；我们还没到那一步。\n\nLibUI 是一个相当低调（不那么时髦）的 GUI 工具包（主要为 C++ 用户所知），但它提供出色的性能、较小的依赖项大小，并且围绕该工具的社区仍然相当活跃。另一方面，界面的实现必须手动完成（通过代码），将该工具的使用仅保留给某一类开发人员。包装器的整体质量在未来版本中也可以改进。包装器使用\
    \ .NET Standard，因此无论如何它都将可用于未来版本的 .NET Core。\n\nGTK 工具包拥有相当悠久的开发历史，即使在某些开发期间非常安静（稳定），GTK\
    \ 社区也使其依然蓬勃发展。生产环境中部署的应用程序数量将保证（至少在一段时间内）产品演进的连续性。此外，GTK# 包装器是使用 .NET Standard\
    \ 实现的，因此将可供未来版本的 .NET Core 使用。\n\nQT 框架拥有庞大的社区，自 2014 年以来，一家公司保证其未来的持续开发。\n\n"
