    ## 9.4 CoreRT (AHEAD OF TIME) COMPILATION


    Warning: CoreRT is an experimental tool from Microsoft and there is no plan that
    it will be released as a standalone tool in the future. This have been said, CoreRT
    is an amazing tool allowing the generation of a machine native executable for
    a .NET Core 3 project.


    CoreRT is an Opensource tool from Microsoft who bring native compilation possibilities
    to .NET Core applications. The production of a native executable file is big achievement
    in the managed development world.


    CoreRT can be used for targeting a wide range of platform OS Windows, Linux and
    macOS. This tool provides the same performances level for .NET Core software as
    a native C++ solution can provides. CoreRT provides to the .NET Core 3 the same
    features as .NET Natives furnish for the .NET framework.


    Even if many constraints and bugs have been found for the compilation of a Web
    application, CoreRT seems to work just fine for console and libraries projects
    (these are the types we are interested in).


    This is a new technology, introduced by Microsoft for improving the performances
    of .NET Core software whatever the platform OS the software is running on. This
    tool is still under heavy development phase and does not provide (as time these
    lines were written) debugging support (as the classical CoreCLR can provide).
    This amazing tool allows unprecedented capabilities for the .NET Core software
    developer, you can now code machine native application with C#. And you have the
    choice to produce C++ code from your .NET Core source code too.


    > https://mattwarren.org/2018/06/07/CoreRT-.NET-Runtime-for-AOT/

    > https://github.com/dotnet/corert/blob/master/Documentation/intro-to-corert.md

    > https://github.com/dotnet/corert


    ### 9.4.1 Architecture


    CoreRT is a native toolchain for compiling CLR language to machine code as described
    in the schema below (figure 1).


    ![](img/3d310cc066dda6e2dfa67a650614076f_274_0.png)


    CoreRT use RyuJIT, the Just In Time compiler (used by .NET Core during the execution
    of the program) to perform an Ahead Of Time (AOT) compilation of the program.


    CoreRT comes from the refactoring of the .Net Core runtime (RyuJIT) but instead
    of producing machine code on the fly during the execution it produce the machine
    code and save it (AOT) on the file system (Instead of being copied in memory).


    ### 9.4.2 Benefits


    The use of CoreRT brings many benefits to the developer, here is a list of the
    most critical:


    - Generation of a native application (no need to install .NET Core Runtime!)

    - Better performance during the startup phase of the application (no more needs
    to load the CLR, JIT, ...)

    - Possibility to use native compiler optimization (from C++)

    - Easier multiplatform deployment scenarios (You can deploy your application using
    only on native executable)

    - Ability to be deployed on small container


    These, quickly enumerated, benefits are often critical regarding the choice of
    the development language or framework, it make a great sense now to use .NET Core
    3 for the development of multiplatform application (at least for Windows, Linux,
    macOS).


    The average minimal size of the EXE produced for windows 64 (for the classical
    “HelloWorld” project) is around 4 MB (compared to the 70MB with .NET Core embedded).


    CoreRT define a much larger scope for the use of .NET Core 3. It can now be used
    in many new software contexts, in the old days, reserved to much lower abstracted
    language as C or C++.


    CoreRT is an always evolving tool (it is still experimental) and does not provide
    cross-platform compilation option, each machine native executable has to be built
    using its own platform.


