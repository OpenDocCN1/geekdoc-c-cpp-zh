    # 8.3.4 Electron.NET QuickStart


    The use of Electron.NET implies to follow a procedure in order to integrate it
    inside a ASP.NET Core application and transform it to a desktop application.


    Here is the short procedure for “electronize” your ASP.NET Core 3 application.
    We will review latter in much more details the application code itself (within
    the example section).


    +   A) Create an ASP.NET Core MVC application


    That can be done by using the dotnet CLI or Visual Studio.


    +   B) Install the Electron.NET command line global (since version 0.9) tool


    Before starting the development of your application, you have to install the Electron.CLI
    global tool for the dotnet CLI with the command line described below.


    ```

    $ dotnet tool install --global Electron.NET

    ```


    +   C) Add the Electron.NET package:


    Besides adding it from visual studio NuGet packet manager, you can add the dependency
    by typing the following line in the package manager command line.'
  - "[PAGE 155]\n\n```\nPM> Install -Package Electron.NET.API\n```\n\n# D) Setup packaging\
    \ (For ubuntu and macOS only)\n\nThis step is only for the ubuntu and macOS platform,\
    \ on these OS you have to install “electron-builder” with the command line instruction\
    \ as below.\n\n```\n$ sudo npm install electron-builder -global\n```\n\n# E) Start\
    \ to use Electron.NET:\n\nYou can achieve that by using the following code inside\
    \ the WebHostBuilder.\n\n```\npublic static IWebHost BuildWebHost(string[] args)\n\
    {\n    return WebHost.CreateDefaultBuilder(args)\n        .UseElectron(args)\n\
    \        .UseStartup<Startup>()\n        .Build();\n}\n```\n\nYou can notice we\
    \ have just added the “UseElectron(args)” line to the WebHost for enabling the\
    \ use of Electron inside the MVC ASP.NET Core application.\n\n# F) Create the\
    \ Electron window in the Startup.cs file:\n\nThat’s can be done by the following\
    \ instruction in the “Configure” method:\n\n```\nTask.Run(async () => await Electron.WindowManager.CreateWindowAsync());\n\
    ```"
