    # 8.6.2 Presentation of QML.NET


    QT provide a complete integrated solution for the development of multiplatform
    applications in C and C++, so why review this tool in a book using .NET Core 3?


    Of course, that''s because a wrapper for this framework has been officially released
    since 2018 and make QT, and more precisely QML a great language to use for the
    development of GUI desktop application with .NET Core 3.


    The QML is a declarative language for the description of GUI. It has a syntax
    inspired from C and JSON it allows to have a minimal file size for his implementation.
    It is a subset of QT Quick.


    QML implement several key concepts:


    +   - The objects are described as C structure.

    +   - An object can be described as a combination of other objects (heritage).

    +   - “State”, “Transition”, “Animation” can be associated to the widgets (QT
    Quick controls in our case).'
  - '[PAGE 220]


    +   1. State: is a named statement who describes a set of properties when a specific
    condition is met.


    +   2. Transition is a declaration who spreads a change over time.


    +   3. Animation describe the evolution of an object (the look) from the change
    of its properties.


    Here is a sample snippet of QML implementation (a rectangle polygon who change
    color when it is clicked):


    ```

    Rectangle {

    width: 200

    height:200

    color: mouse.pressed ? "blue" : "red"

    Text {

    text:"Hello World !"


    anchors.centerin: parent

    }

    }

    ```


    QML.NET allow to .NET Core 3 developer to use this language for the GUI''s design
    of the application with the use of the QML wrapper. QML.NET.


    The implementation of a QT wrapper for .NET is not knew but with this version:
    QML.NET reaches another level. It is now a company supported solution who is available
    right now.


    QML.Net is Opensource and available for the developer on a dedicated GitHub repository.'
  - '[PAGE 221]


    You can notice that the current version targeted by the QML.NET example projects
    are .NET Core 2.2 but the wrapper is implemented using the .NET Standard 2.0 and
    so is usable by every .NET framework (of course including the .NET Core 3).


    The MIT license used allow to freely use QML.NET for any kind of project you plane
    to do with (permissions for commercial use, Modification, Distribution and Private
    use).


    This GitHub repository contains all the tools needed for the development with
    .NET Core 3:


    +   - QML.NET: The wrapper

    +   - QML.NET sample application.

    +   - QML runtime: Runtime installation script for Windows, Linux and macOS.


    QML.NET allows the .NET Core 3 developer to use the .qml file format for the specification
    and the design of the application.


    The .qml file can be edited with the appropriate dedicated software: QT Design
    Studio.


    The .qml file format, a text-based file format, can also be edited with a classic
    text editor but require in this case much more expertise on the QML language itself.
    Even if it looks the hard way to develop with QML, the knowledge of the many capabilities
    QML language offer could be extremely helpful for the development of real-world
    application (especially if you work with designer exported designs).'
  - '[PAGE 222]


    We recommend the review of the “qmlbook” website for a detailed view of the QML
    language, especially for the development of effects and interactivities in the
    GUI (this is C, C++ oriented). You can find more information about the QML.NET
    usages on the reference links.


    +   - https://qmlnet.github.io/

    +   - https://github.com/qmlnet/qmlnet/

    +   - http://qmlbook.github.io/


    Besides the source code of the wrapper, QML.NET can be include in your project
    by using several NuGet packages (depending of the platform you target in your
    project).


    ![](img/3d310cc066dda6e2dfa67a650614076f_222_0.png)


    Thus, you have also to add a specific dependency of the runtime for each platform
    type your development intend to work on.


    For getting familiar with the QML language, we will review more deeper the dedicated
    freely available WYSIWYG editor: QT Design Studio.'
