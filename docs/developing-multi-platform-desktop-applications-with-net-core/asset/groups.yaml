    - I) Wrap synchronous operations in async wrappers.

    - J) Avoid synchronous call at any level.

    - K) Avoid Task.Wait or Task.Result within you asynchronous programming.

    - L) Perform I/O operation asynchronously.

    - M) Optimize data access, and use cache when it''s relevant.

    - N) Do not over use LINQ (use for loop and condition instead).

    - O) Use pre-compiled LINQ request.

    - P) Minimize exception (do not use exception for the usual program flow, throw
    only exception for unattended condition)

    - Q) Minimize the number of P/Invoke calls (when it is possible).

    - R) When using P/Invoke method decorate imported function with "in" and "out"
    attributes on parameters.


    This is only a few assertions (but relevant) you can keep in mind during your
