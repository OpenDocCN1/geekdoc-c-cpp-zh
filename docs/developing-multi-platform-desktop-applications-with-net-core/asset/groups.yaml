    As you can see, the implementation of these basic features (menu and dialog) in
    the application are not obvious. There is much complexity to manage the two-process
    introduced with the Electron architecture. This complexity will increase as your
    application will become much more complex itself.


    The study of the “ElectronNET-API-Demos” project could help you during the required
    learning phase of the Electron.NET developments.


