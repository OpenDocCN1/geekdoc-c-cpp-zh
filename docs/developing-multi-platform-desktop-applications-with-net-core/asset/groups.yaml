    ```


    As you can see only one line of code is sufficient for declaring, reading the
    configuration file and building the Configbuilder object. The object (actually
    an interface type) use a set of key/value for the storage of the configuration
    properties. Besides this object offer the possibility to retrieve instances object
    values (often useful) used in strongly typed configuration.


    The Microsoft.Extensions.Configuration furnish an architecture section/item and
    the main methods for loading the sections, and Items are:


    +   - GetChildren(): Gets the descendant sub-sections.

    +   - GetSection(string): Gets the section with the specific key.


    Of course, this is a basic sample but the Configuration builder offer the possibility
    to manage complex constraints as hierarchical Json, multiple (array) values retrieval,
    use of secret values and many other cases not described here.


    This is only a brief resume of the package methods, you can find an exhaustive
    source of information about this specific subject by following the links in reference
    below:'
  - '[PAGE 64]


    https://docs.microsoft.com/en-us/dotnet/api/microsoft.extensions.configuration
    https://garywoodfine.com/configuration-api-net-core-console-application


    In conclusion about the use of configuration file with .NET Core3, the basic configuration
    tools offered by the Microsoft package are quite powerful and fit for most of
    applications requirements. There are providers for many types of configuration
    files (JSON, XML, INI ...). And, of course, you can write your own provider if
    you have special requirement in this matter.


    You can retrieve a working example project on the netcore3 GitHub.


    ```

    https://github.com/netcore3/CodeBook/Chapter 5/1/configProgram

    ```


    # 5.2 LOGGING AND TRACING


    .NET Core have a built in Logging/Trace mechanism. This mechanism is really handy
    for basic logging requirements. But if you have the need of more advanced logging
    mechanism (for using in error handling automation system for example) you have
    to use a more advanced tool.


    There is plenty of solution (you can check the NuGet repository) for implementing
    structured logging system to your application, the most used and popular are Log4NET,
    NLog and Serilog.'
