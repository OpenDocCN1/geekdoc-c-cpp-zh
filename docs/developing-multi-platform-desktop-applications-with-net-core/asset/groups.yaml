    ~$ sudo adduser dbgVS

    ```


    You can also simply use the “root” account, if you do not have security constraints.


    You have to give this user the appropriate rights or/and add him in the appropriate
    group for having access (read/write) to the deployment folder (with also execute
    permission, in most of case the admin group is required).


    ### D) Enable SSH and open port on the firewall (setup communication between computers):


    ```

    $ sudo apt-get install openssh-server unzip

    $ sudo ufw allow ssh

    ```


    This command line installs the ssh server and open the required port on the firewall
    (port 22).


    Verify the user and the connection with a simple ssh test with the Linux machine
    (use putty and the new defined user) from your Windows station. Check also the
    folder permissions for the user.


    ### E) Deploy the application: Copy the file through scp or use the publish tool
    in Visual Studio:


    To deploy the application, you have the choice to copy it with a “scp” command
    or to use a configuration file for the deployment of the application during the
    “publishing” phase. The file where you can specify the location of the source
    and the destination folder of the executable is “launch.json”.


    ### F) Attach the debugger (in Visual Studio) to the remote process on Linux:


    If the VS debugger has been installed on the Linux machine you should have access
    to the list of the process of the user you connected with. Select the process
    (in many cases the name of the program) and “Attach” it to the debugger in Visual
    Studio (make sure the checkbox “show process for all users” is actually checked).


    ### G) Do Debugging (in Visual Studio):


    You should be able now to debug the application on Linux from your Windows Visual
    Studio instance.


    This technic uses the compilation on the development machine, but you can also
    build the application on the target computer and attach the debugger afterward.


    The remote debugging tool is an essential method when you encounter issue on a
    specific OS (and not on the others), it could help you to identify the source
    of the issue and thus, solving it in a minimum amount of time.


    But be aware, the remote debugging tool is sometimes not a pertinent tool to use
    for multiplatform application project development especially when this one used
    native calls (with P/Invoke). This tool cannot be used when you choose to build
    a native executable of your application.


    In resume it is a tool to use at an early stage of the coding phase if you have
    issue on a particular platform, it can help you to identify fatal flaw of a design
    on a particular OS (yes that''s happen: some system offers features that others
    do not). We recommend to use the remote debugging tool in punctual cases of project
    development requiring specifics debugging context.


    Otherwise do not spend too much time on this aspect of the development, you will
    find most of the bugs during the coding phase on the Windows development platform
    (within the classical Visual Studio integrated debugger) anyway.


    Here is a reference link where you can retrieve some details about this procedure,
    if your development requires it.


    https://github.com/microsoft/MLEngine/wiki/Offroad-Debugging-of-NET-Core-on-Linux---OSX-from-Visual-Studio

