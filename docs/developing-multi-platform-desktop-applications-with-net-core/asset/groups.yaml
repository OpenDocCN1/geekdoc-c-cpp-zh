    Main development Station


    - Windows 10, Visual Studio 2019, .NET Core 3


    (Project definition, Coding and building)


    (Development architecture option chosen)


    The complete development is done with Visual Studio 2019, then, once everything
    is working and bugs free the solution is copied to the other machines. The code
    of the solution is built on the platform OS it should be deployed, after some
    eventual adaptations of the project file (.csproj; if you use the Platform target
    option for example).


    This is, of course, not the only architecture possible for the development but
    this one provides a good reliance/performance ratio. We will also review the possibility
    of cross platform debugging inside Visual Studio.


    ## 6.4 .NET CORE 3 INSTALL: RUNTIME OR SDK?


    The .NET Core 3 runtime contains only the core elements for running an application
    on a computer, this is the minimum install you have to do for running a .NET Core
    application. Another benefit from .NET Core 3, the runtime can be deployed aside
    of the distributed application.


    On the other hand the SDK (Software Development Kit) provides tools for developing
    and building .NET Core applications.


    The install of the .NET Core 3 SDK has to be done on every platform. Doing that
    facilitates the tune up of the application for the specific OS, and allows you
    to validate each phase (if you have a project management guidelines) of the development
    on each platform.


    So, you will have a development station (at least with the SDK installed) for
    each platform you want to target for your application.


    Both Runtime and SDK are available for Windows, Linux and macOS on the Microsoft
    web site.


    ![](img/3d310cc066dda6e2dfa67a650614076f_99_0.png)


    Besides the .NET Core 3, regarding the kind of project you want to develop you
    would have to install specific components. These components are required, and
    in some case, mandatory for running the application. These components can be specific
    for each OS (If you choose to develop with a native GUI).


    But the core of the setup on the 3 systems is the .NET Core 3 install, and it
    should be done with a special care. Here is a detailed description, on how you
    can install it in the proper way.


    ### 6.4.1 On Windows


    Installing the .NET Core SDK on the Windows 10 platform seems to be trivial since
    the Microsoft platform is the platform of origin for the .NET Core. You should
    experience no issue to do it (less than for other OS). Furthermore, the .NET Core
    3 is now automatically installed when you setup Visual Studio 2019 (since October
    2019).


    #### 6.4.1.1 Prerequisites


    .NET Core 3 is supported on the following versions:


    - Windows 7 SP1.

    - Windows 8.1.

    - Windows 10 Anniversary Update (version 1607) or later versions.

    - Windows Server 2008 R2 SP1 (Full Server or Server Core).

    - Windows Server 2012 SP1 (Full Server or Server Core).

    - Windows Server 2012 R2 (Full Server or Server Core).

    - Windows Server 2016 or later versions (Full Server, Server Core, or Nano Server).

    - Windows Server 2019 (every versions).


    #### 6.4.1.2 Windows Install


    If you use the correct version of Windows, the install is done by executing the
    downloaded installer (exe program) and follow the Installer instructions (click
    OK:).


    The default installed directory for the .NET Core 3 is:


    ```

    C:\Program Files\dotnet\netcore3

    ```


    You can verify if the installation has been performed correctly by invoking a
    simple command of the CLI tool “dotnet” as shown below:


    ```

    C:> dotnet --version

    ```


    It should display the current version of .NET Core installed, this command will
    also verify if the .NET Core CLI is accessible (path updated) and if the installation
    process did not have errors not displayed during the install.


    If the dotnet CLI is not found after the setup, verify if the path of the SDK
    has been added in the environment variables of your system (if it was not done
    by the installer program).


    ### 6.4.2 On Linux Ubuntu (or other Debian distribution)


    The Linux install could be done using the Package Manager on ubuntu (we only study
    this distribution in this book, but adaptation for another distro is quite possible).
    Before having the guarantee that you install the required version (at least the
    version 3), we will review the install by downloading the Linux install file from
    the Microsoft .NET Core web site.


    #### 6.4.2.1 Prerequisites


    .NET Core 3.0 is supported on the following Linux distributions (see Table 1).


    | OS | Version | Architectures |

    |---|---|---|

    | Red Hat Enterprise Linux | 6 | x64 |

    | Red Hat Enterprise Linux | 7 | x64 |

    | CentOS | | |

    | Oracle Linux | | |

    | Fedora | 28 | x64 |

    | Debian | 9 | x64, ARM32*, ARM64* |

    | Ubuntu | 16.04+, 18.04+ | x64, ARM32*, ARM64* |

    | Linux Mint | 18 | x64 |

    | openSUSE | 42.3+ | x64 |

    | SUSE ENTERPRISE Linux (SLES) | 12 SP2+ | x64 |

    | Alpine-Linux | 3.8+ | x64, ARM64 |


    The Ubuntu distributions require the following libraries to be (dependencies)
    installed:


    - libttng-ust0

    - libcurl3 (for 14.x and 16.x)

    - libcurl4 (for 18.x)

    - libssl1.0.0

    - libkrb5-3

    - zlib1g

    - libicu52 (for 14.x)

    - libicu55 (for 16.x)

    - libicu57 (for 17.x)

    - libicu60 (for 18.x)


    In the case of the distribution we will use in this book (Ubuntu desktop 18.04)
    all these libraries are already installed in the default desktop setup. That should
    be also the case on your install.


    #### 6.4.2.2 Ubuntu 18.04 Install


    The .NET Core 3 for Linux is downloadable under tar.gz format. You can install
    it simply by using the following command line instruction


    ```

    ~$ mkdir -p $HOME/dotnet && tar zxf dotnet-sdk-xxxxx-linux-x64.tar.gz -C $HOME/dotnet

    ~$ export DOTNET_ROOT=$HOME/dotnet

    ~$ export PATH=$PATH:$HOME/dotnet

    ```


    Xxxxx: is the version number of the .NET Core 3 you want to install. (the file
    name changes for each release of a new .NET Core)


    As you can see the directory DOTNET is also created and then added to the path
    for having access to the dotnet program from every location. You should consider
    adding the last two lines to your user''s environment variables (/users/<>)


    ### 6.4.3 On macOS Mojave


    The install for the macOS system is as simple as the install of a pkg file. (standard
    macOS installer file). For this OS the installation process is identical as any
    other program you installed on your Mac.


    #### 6.4.3.1 Prerequisites


    The version of the macOS has to be 10.12 (Sierra) or later. This is the only prerequisite.


    #### 6.4.3.2 macOS 10.14 Install


    Just double-click on the file and follow the setup instructions, this is a graphical
    install (standard macOS) so you should not encounter any problem during the installation


    The dotnet directory after install is:


    ```

    /usr/local/share/dotnet

    ```


    For the validation of your install, you can create a new console project with
    the command line described below.


    ```

    dotnet new console -n consoleTest

    ```


    A folder will be created on your desktop “consoleTest”, navigate to this folder
    and execute the following command:


    ```

    dotnet run

    ```


    If everything goes as expected, you should display the famous “Hello world” message,
    if that’s not the case review the release note for macOS on the Microsoft web
    site where you have downloaded the .pkg file.


    ## 6.5 INSTALL DEVELOPMENT STATIONS


    The development stations will be the three machines (Virtual or not) used for
    development purpose. These three computers have to be setup with development dedicated
    tools corresponding to the type of GUI you want to develop with.


    The .NET Core 3 SDK is the base install on each station, the specialized tools
    required will be specified for each type of solution we will review.


    For the example projects presented in this book we have chosen to develop the
    code with Visual Studio 2019 on Windows, each project has been rebuilt on each
    OS after a raw copy of the projects (with the SDK).


    ### 6.5.1 The Windows station (main)


    The Windows platform is the coding platform where you have to install the IDE
    (in our case Visual Studio 2019) and all the tools you need for writing software.
    The choice of Visual Studio 2019 is obvious in a professional context regarding
    the features and the high quality of the product (compared to Visual Code who
    is a more script development-oriented tool).


    First you have to install Visual Studio 2019.


    There are three different versions of the product:


    - Community: Free version of the product, this version allows you all kind of
    .NET Core 3 development but does not integrate some features (see table with features).

    - Professional: As the name indicate (This is the full product),

    - Enterprise: Offer a better integration for large team and complex constraints
    environment, it also includes exclusives

