    \nThis choice is also conditioned by the type of developer you are (or in which\
    \ kind of development you have much more experience for producing a quality product).\n\
    \n- If you come from the web-oriented development (ASP.NET developer) it should\
    \ be a smart choice to start a desktop application with a tool allowing you to\
    \ leverage this knowledge straight away by using Electron.NET.\n- If you are a\
    \ good C# and/or C++ developer (console, system, service) you can choose one of\
    \ the native's solution for implementing a GUI (LibUI, GTK#, QML.NET).\n- If you\
    \ are a C# .NET framework desktop application veteran (or WPF developer) you surely\
    \ oriented yourself to the solution proposed by Avalonia (but also may be QML\
    \ or GTK solution)\n\nIn summary, the choice of the solution's type will be matter\
    \ of the resources available and the requirements of your project.\n\n### 8.2\
    \ CONSOLE GUI APPLICATIONS\n\nConsole GUI have been disregarded by number of developers\
    \ since the development of graphical user interface, but in many cases, it could\
    \ be a smart choice (even if that's not the trendiest) for the development of\
    \ multiplatform applications.\n\nThose last years, many libraries have been developed\
    \ for building “nice” interface for console programs.\n\nThat's in part due to\
    \ the fact that many cloud frameworks (most of them are multiplatform) have been\
    \ developed for the server world and de facto with no GUI implementation. In that\
    \ context, coders have felt the lack of commercial offer in that specific domain\
    \ and many propose their own solution. Most of these libraries are the result\
    \ of developer's personal project and do not offer support of any kind other than\
    \ their contact on the GitHub.\n\nDespite that, the implementation of a console\
    \ GUI application includes many benefits as:\n\n- Reduce the resource used for\
    \ the information display.\n- Can be easily deploy via container (Docker, or Kubernetes).\n\
    - Reduce development time and focus really on the purpose of the application.\n\
    - No need to use costly library (save RAM and CPU).\n- Only one version of the\
    \ program is compiled on every OS (Windows, Linux, macOS).\n- Vintage cool look\
    \ (personal taste).\n\nHere is a selection of few libraries made after trying\
    \ several available console GUI toolkit frameworks from GitHub (this is a non-exhaustive\
    \ list, as the subject becomes much more trendy many new projects are emerging):\n\
    \n- ConsoleDraw.\n- EasyConsole.\n\n"
  mdcn: "\n\n解决方法是使用虚拟对象或数据库来模拟开发者需要单元测试的函数与之交互的真实数据或对象。\n\n这个概念称为模拟（mocking）。模拟对象隔离你想要测试的方法/函数，并验证它是否独立运行（独立于其他方法）。模拟对象可以使用给定值设置对象并设置该对象的属性。\n\
    \n开发者必须为方法硬编码预期输入值，并定义带有预期结果值（同样硬编码）的验证测试。\n\n对于 .NET Core 3 开发，我们推荐使用 Moq (4.x)，这是最流行且用户友好的模拟框架。Moq\
    \ 是一个库，使开发和测试模拟对象变得容易，此外，该库还提供 LINQ to Mocks 功能，允许动态请求模拟对象以进行验证。它支持模拟接口和类。\n\n\
    https://github.com/moq/moq4/\nhttps://github.com/moq/moq4/wiki/Quickstart\n\n\
    可以将以下包添加到测试项目中，以便快速集成 Moq。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_123_0.png)\n\
    \n此包的最新版本使用 .NET Standard 2.0 实现，因此可在 .NET Core 3 项目中使用（这就是 .NET Standard 库格式的优势所在）。\n\
    \n以下是一个代码片段，向你展示如何在简单用例中使用 Moq。\n\n```\n[TestFixture]\npublic class FooTest\n\
    {\n    Foo subject;\n    Mock myInterfaceMock;\n\n    [SetUp]\n    public void\
    \ SetUp()\n    {\n        myInterfaceMock = new Mock();\n        subject = new\
    \ Foo();\n    }\n\n    [Test]\n    public void DoWorkTest()\n    {\n        //\
    \ Set up the mock\n        myInterfaceMock.Setup(m =>\n        m.DoesSomething()).Returns(true);\n\
    \        myInterfaceMock.SetupGet(m =>\n        m.Name).Returns(\"Molly\");\n\n\
    \        var result = subject.DoWork();\n\n        // Verify that DoesSomething\
    \ was called only once\n        myInterfaceMock.Verify(m =>\n        m.DoesSomething(),\
    \ Times.Once());\n\n        // Verify that DoesSomething was never called\n  \
    \      myInterfaceMock.Verify(m =>\n        m.DoesSomething(), Times.Never());\n\
    \    }\n}\n```\n\n正如你所见，Moq 的使用非常简单，即使是新手开发者也能上手：\n\n- 模拟声明：定义你想要模拟的对象类型。\n- 模拟设置：为（被模拟的）方法定义值。\n\
    - 模拟验证：验证模拟对象是否被调用（或未被调用）。\n\nMoq 拥有直观的 API，无需事先了解模拟知识。\n\n还有几个其他库允许在单元测试阶段模拟对象，你可以深入了解\
    \ NSubstitute 和 FakeItEasy，以便更全面地了解市场上的模拟库（它们是开源的）。这两个库提供与之前描述的 Moq 库等效的功能（不包括\
    \ LINQ 功能）。\n\n可以查阅它们各自 GitHub 仓库上的 wiki 以获取更多信息。\n\n![](img/3d310cc066dda6e2dfa67a650614076f_125_0.png)\n\
    \n### 7.2 功能测试\n\n功能测试和集成测试包括测试每个应用程序功能。换句话说，验证组装后的应用程序是否提供预期的结果和功能。这可以通过选择特定的数据样本或配置集来实现。\n\
    \n这些测试可能包括：\n\n- 关键值测试。\n- 边界测试。\n- 离域测试。\n\n功能测试是一种黑盒测试类型，因为它涉及完成整个软件开发才能进行。测试人员使用多种场景和用例，验证生成的软件是否符合产品规范。\n\
    \n## .NET Core 3.0\n\n## 第 8 章。多平台开发解决方案\n\n如果你想启动一个多平台项目，这可能是本书中最有用的一章。我们将通过对多个示例项目的详细回顾，了解如何使用\
    \ .NET Core 3 和 Visual Studio 2019 编写多平台桌面应用程序。\n\n这些示例的源代码可在 netcore3 GitHub\
    \ 仓库上找到（每个示例均附有详细链接）。\n\n所有项目均使用 .NET Core 3 构建，大多数项目使用 Visual Studio 2019。\n\n\
    ### 8.1 选择多平台应用程序类型：适合工作的工具\n\n根据你打算开发的项目类型，语言（C++、HTML、XAML ...）和目标框架的选择至关重要。\n\
    \n市场上已有许多多平台开发解决方案，但只有 .NET Core 3 在性能、可维护性、语言特性、打包和部署能力方面提供了该领域的最先进技术。\n\n在本书中，我们将为你提供一系列解决方案，以解决你在使用\
    \ .NET Core 3 进行多平台桌面应用程序开发过程中可能遇到的特定问题。\n\n每个提议的解决方案都可以解决特定约束或提供应用程序需要集成的特定功能，这些解决方案都没有为所有多平台桌面开发需求提供完美的回答，这就是为什么你必须特别关注你将启动的开发类型的选择，以响应你的软件规范（并根据可用资源）。\n\
    \n这可以通过仔细研究本书提供的每个解决方案示例来实现：\n\n- 控制台 GUI 应用程序。\n- Web GUI (Electron.NET) 应用程序。\n\
    - 原生 GUI 应用程序（图形库 C++、GTK、QML）。\n- XAML GUI (Avalonia) 应用程序（也是一种原生应用）。\n\n在这些解决方案中，你应该找到那个解决方案，即最适合你项目约束和要求的解决方案。\n\
    \n这一选择也取决于你是哪种类型的开发者（或者你在哪种开发方面拥有更多经验以生产高质量产品）。\n\n- 如果你来自面向 Web 的开发（ASP.NET 开发者），使用\
    \ Electron.NET 开发桌面应用程序将是一个明智的选择，这样你可以立即利用这些知识。\n- 如果你是一名优秀的 C# 和/或 C++ 开发者（控制台、系统、服务），可以选择一种原生解决方案来实现\
    \ GUI（LibUI、GTK#、QML.NET）。\n- 如果你是 C# .NET 框架桌面应用程序老手（或 WPF 开发者），你肯定会倾向于 Avalonia\
    \ 提出的解决方案（但也可能是 QML 或 GTK 解决方案）。\n\n总之，解决方案类型的选择将取决于可用资源和你项目的需求。\n\n### 8.2 控制台\
    \ GUI 应用程序\n\n自图形用户界面出现以来，控制台 GUI 曾被许多开发者忽视，但在许多情况下，它可能是开发多平台应用程序的明智选择（即使它不是最时髦的选择）。\n\
    \n近年来，许多库已被开发用于为控制台程序构建“漂亮”的界面。\n\n这在一定程度上是因为许多云框架（其中大多数是多平台的）是为服务器世界开发的，事实上没有\
    \ GUI 实现。在这种情况下，程序员感到该特定领域缺乏商业产品，许多人提出了自己的解决方案。这些库中的大多数是开发者个人项目的结果，除了 GitHub 上的联系方式外，不提供任何形式的支持。\n\
    \n尽管如此，实现控制台 GUI 应用程序包括许多好处，例如：\n\n- 减少信息显示所用的资源。\n- 可以通过容器（Docker 或 Kubernetes）轻松部署。\n\
    - 减少开发时间，真正专注于应用程序的目的。\n- 无需使用昂贵的库（节省 RAM 和 CPU）。\n- 每个操作系统（Windows、Linux、macOS）只编译一个程序版本。\n\
    - 复古酷炫外观（个人喜好）。\n\n以下是在尝试了 GitHub 上几个可用的控制台 GUI 工具包框架后精选的几个库（这是一个非详尽列表，因为该主题变得越来越时髦，许多新项目正在涌现）：\n\
    \n- ConsoleDraw。\n- EasyConsole。\n\n"
