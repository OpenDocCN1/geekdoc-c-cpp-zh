    resources and samples source code from the author and others Open source projects.


    These entry points will provide you the keys for finding relevant resources or
    going deeper into a specific technical area your project required.


    We hope this book will help you to achieve your multiplatform project in the most
    successful way and minimize the times and resources needed for accomplishing this
