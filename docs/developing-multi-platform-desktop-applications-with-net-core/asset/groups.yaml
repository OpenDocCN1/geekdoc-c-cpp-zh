    (in the exporter options) otherwise all the works regarding the effects and animation
    will be crushed by the new version.


    The exported .qml file have to be modified (inside QT Design Studio it is much
    easier) for including the features required by the application, you have to do
    the following updates:


    - Add required dependencies (for animations, effects, controls ...).

    - Change the container of the different element generated according to your application
    needs.

    - Check and update the positioning of the layers (the QML exporter have it often
    wrong).


    Here is the QT Design Studio view of the .qml file before and after update for
    the use in our application


    ![](img/3d310cc066dda6e2dfa67a650614076f_240_0.png)


    (Raw exported .qml file exported from photoshop)


    ![](img/3d310cc066dda6e2dfa67a650614076f_241_0.png)


    (Modified .qml file usable in your project.)


    From Visual Studio, the project will have an obvious architecture including the
    main object (there is only one form for this example). The code of the GUI (QML)
    and the logic of your application (C#) are perfectly separated and participate
    to a good readability of the code.


    Here is the “Solution Explorer” view of the project.

