    \n```\n[TestFixture]\npublic class FooTest\n{\n    Foo subject;\n    Mock myInterfaceMock;\n\
    \n    [SetUp]\n    public void SetUp()\n    {\n        myInterfaceMock = new Mock();\n\
    \        subject = new Foo();\n    }\n\n    [Test]\n    public void DoWorkTest()\n\
    \    {\n        // Set up the mock\n        myInterfaceMock.Setup(m =>\n     \
    \   m.DoesSomething()).Returns(true);\n        myInterfaceMock.SetupGet(m =>\n\
    \        m.Name).Returns(\"Molly\");\n\n        var result = subject.DoWork();\n\
    \n        // Verify that DoesSomething was called only\n        once\n       \
    \ myInterfaceMock.Verify(m =>\n        m.DoesSomething(), Times.Once());\n\n \
    \       // Verify that DoesSomething was never called\n        myInterfaceMock.Verify(m\
    \ =>\n        m.DoesSomething(), Times.Never());\n    }\n}\n```"
  - '[PAGE 125]


    As you can see the use of Moq is really simple and can be made by rookie developer:


    +   - Declaration of the mock: Define the type of the object you want to mock.

    +   - Setup of the mock: Define value for the method (who is mocked).

    +   - Verify the mock: Verify if the mock has been called (or not).


    Moq has an API straightforward and does not require previous knowledge of mocking.


    There are also several other libraries allowing to mock objects during the unit
    testing phase, you can have a deeper look on NSubstitute and FakeItEasy for having
    a wider view on the mocking libraries on the market (it is Opensource). These
    two libraries offer equivalent functions than the Moq library described before
    (minus the LINQ capability).


    You can consult the wiki on their respective GitHub repos for more information.


