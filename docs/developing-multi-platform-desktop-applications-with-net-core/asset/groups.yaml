    # 8.3.5 Electron.NET application example


    As Electron.NET is a popular wrapper around Electron, you will find plenty of
    code examples (check GitHub) for helping and guiding you for the development of
    your Electron.NET application (see reference links).


    These examples make often an intensive use of the SPA (Single Page Application)
    technics and use specialized JavaScript frameworks like Vue.JS or React... The
    reason is that the desktop application experience requires a minimum of blinking
    screen being likely by the user and looked as a tangible desktop application.


    So, the development of an application with Electron.NET implies an intensive use
    of JavaScript for making the buffer between the web development back-end and the
    desktop Front-End (who have a natural tendency to blink as a common web application).


    The Electron.NET, ASP.NET Core example application we will review is the “ElectronNET-API-Demos”
    application from the Electron.NET repository.


    This is the application of reference for this type of application. That illustrates
    the use of many Electron.NET features. Most of the source code is exposed in the
    application itself for teaching purpose.


    In this sample, you will find a couple of useful technics specific to the Electron.NET
    application type, these technics can be reused in'
  md: "\nThe Electron.NET.CLI is the command line tool used to build and package the\
    \ Electron application, it is not used inside the code of the application (it\
    \ is a tool). Electron.NET.CLI is mandatory for running your .NET Core Electron.NET\
    \ application.\n\nYou can install this tool with the command line described below\
    \ (this is a toolset package for dotnet CLI). It can be installed as a global\
    \ tool for dotnet CLI, extending it with the “electronize” command.\n\n```\nC:>\
    \ dotnet tool install ElectronNET.CLI -g\n```\n\nAfter the setup of Electron.NET.CLI\
    \ in .NET Core, the command “electronize” is available as a global tool for the\
    \ dotnet CLI. The “electronize” command will be installed only for a specific\
    \ .NET Core version, the tool itself is installed in the user folder: %UserProfile%/.dotnet/tool/\n\
    \nBut before using the Electron.NET wrapper the .NET Core application developer\
    \ has to install the prerequisites tools: Node.JS and its dependency NPM.\n\n\
    ## 8.3.3 Setup of NPM and Node.JS\n\nNPM stands for Node Package Manager, Node.JS\
    \ is the JavaScript runtime engine from the Chromium project (developed by Google).\
    \ Electron.NET requires a version >8.6 of Node.JS. We recommend to install the\
    \ NodeJS from the dedicated web site (see web address in reference) for getting\
    \ the latest version of the tools and guaranteeing a proper install on each system.\n\
    \nHere are the reference links for the download of the setup file (and for getting\
    \ the documentation for each OS reviewed here).\n\nhttps://www.npmjs.com/get-npm\n\
    https://nodejs.org/en\n\nWe will review in detail how these tools have to be installed\
    \ on each platform, because this is a core requirement for the usage of the Electron\
    \ framework and often constitutes an issue in the building process of the project.\n\
    \n### 8.3.3.1 On macOS\n\nFor this platform we recommend to install the version\
    \ from the Node.js web site (this is the latest and you should not have issue\
    \ with the version number during the building of the Electron.NET application).\n\
    \nOnce it is downloaded you have to install the tool by clicking on it (this is\
    \ a .pkg file). Here is the form you should get after a successful install of\
    \ the product\n\n![](img/3d310cc066dda6e2dfa67a650614076f_151_0.png)\n\nOnce the\
    \ installation process is finished, we recommend to reboot the computer (for being\
    \ sure that every environment variable has been updated) before starting to build\
    \ the Electron.NET application.\n\n### 8.3.3.2 On Ubuntu\n\nOn the Linux system\
    \ you can install Node.JS using the usual package manager “apt” by using the command\
    \ below, you will have to install NPM as well since it is not in the same package\
    \ for this environment.\n\n```\n$ sudo apt-get update\n$ sudo apt-get install\
    \ nodejs\n$ sudo apt-get install npm\n```\n\nHere is how a successful install\
    \ looks.\n\n```\nFile Edit View Search Terminal Help\njohngubuntu:~$\nGet:1 http://us.archive.ubuntu.com/ubuntu\
    \ bionic/main amd64 libhttp-parser2.7.1\namd64 2.7.1-1build1 [39.8 kB]\nGet:2\
    \ http://us.archive.ubuntu.com/ubuntu bionic-updates/universe amd64 nodejs amd64\
    \ 8.10.0.dfsg-2ubuntu0.4 [4.790 kB]\nFetched 5,058 kB in 47s (102 kB/s)\nReading\
    \ package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nThe following additional packages will be installed:\nlibhttp-parser2.7.1\n\
    Preparing to unpack .../libhttp-parser2.7.1_2.7.1-1build1_amd64.deb ...\nUnpacking\
    \ libhttp-parser2.7.1 (2.7.1-1build1) ...\nSetting up libhttp-parser2.7.1 (2.7.1-1build1)\
    \ ...\nPreparing to unpack .../nodejs_8.10.0.dfsg-2ubuntu0.4_amd64.deb ...\nUnpacking\
    \ nodejs (8.10.0.dfsg-2ubuntu0.4) ...\nProcessing triggers for man-db (2.8.3-2ubuntu0.1)\
    \ ...\nSetting up nodejs (8.10.0.dfsg-2ubuntu0.4) ...\nupdate-alternatives: using\
    \ /usr/bin/nodejs to provide /usr/bin/js (js) in auto mode\nProcessing triggers\
    \ for libc-bin (2.27-3ubuntu1) ...\nroot@ubuntu:~#\n```\n\nOnce both packages\
    \ have been correctly (without errors) installed\nyou can control the version\
    \ installed with the command below.\n\n```\n$ nodejs -v\n```\n\nThe use of this\
    \ command will also help you to validate if everything\nis in working order (verify\
    \ if the install has been performed\ncorrectly). The version number displayed\
    \ has to be >8.6.\n\n### 8.3.3.3 On Windows\n\nOn Windows, you have to install\
    \ NPM and Node.js.\nThe setup of the Node.JS version from the Visual Studio Installer\n\
    program is not adapted for the building of an Electron.NET\napplication (as you\
    \ also need NPM to be installed). We recommend\nto not use this version for this\
    \ specific task.\n\nThe much simpler solution consists in the setup of the\nNode.JS/NPM\
    \ from the dedicated web site, it will ensure you install\nthe latest version\
    \ available (the link is provided in reference\npreviously).\n\nHere is a view\
    \ of the install program.\n\n![](img/3d310cc066dda6e2dfa67a650614076f_153_0.png)\n\
    \nWindows requires that you reboot the system for updating the system with the\
    \ new environment variables before starting to use it.\n\n## 8.3.4 Electron.NET\
    \ QuickStart\n\nThe use of Electron.NET implies to follow a procedure in order\
    \ to integrate it inside an ASP.NET Core application and transform it to a desktop\
    \ application.\n\nHere is the short procedure for “electronize” your ASP.NET Core\
    \ 3 application. We will review later in much more detail the application code\
    \ itself (within the example section).\n\n- A) Create an ASP.NET Core MVC application\n\
    \nThat can be done by using the dotnet CLI or Visual Studio.\n\n- B) Install the\
    \ Electron.NET command line global (since version 0.9) tool\n\nBefore starting\
    \ the development of your application, you have to install the Electron.NET.CLI\
    \ global tool for the dotnet CLI with the command line described below.\n\n```\n\
    $ dotnet tool install --global Electron.NET\n```\n\n- C) Add the Electron.NET\
    \ package:\n\nBesides adding it from Visual Studio NuGet package manager, you\
    \ can add the dependency by typing the following line in the package manager command\
    \ line.\n\n```\nPM> Install-Package Electron.NET.API\n```\n\n### D) Setup packaging\
    \ (For ubuntu and macOS only)\n\nThis step is only for the ubuntu and macOS platform,\
    \ on these OS you have to install “electron-builder” with the command line instruction\
    \ as below.\n\n```\n$ sudo npm install electron-builder --global\n```\n\n### E)\
    \ Start to use Electron.NET:\n\nYou can achieve that by using the following code\
    \ inside the WebHostBuilder.\n\n```\npublic static IWebHost BuildWebHost(string[]\
    \ args)\n{\n    return WebHost.CreateDefaultBuilder(args)\n        .UseElectron(args)\n\
    \        .UseStartup<Startup>()\n        .Build();\n}\n```\n\nYou can notice we\
    \ have just added the “UseElectron(args)” line to the WebHost for enabling the\
    \ use of Electron inside the MVC ASP.NET Core application.\n\n### F) Create the\
    \ Electron window in the Startup.cs file:\n\nThis can be done by the following\
    \ instruction in the “Configure” method:\n\n```\nTask.Run(async () => await Electron.WindowManager.CreateWindowAsync());\n\
    ```\n\nWith this line of code, the web application is executed inside an Electron\
    \ window.\n\n### G) Initialization of the application:\n\nThe first time you start\
    \ the Electron application you have to “initialize” it with the command described\
    \ below (you have to be in the application folder).\n\n```\n::\\appPath>dotnet\
    \ electronize init\n```\n\nThis command will create the “electron.manifest.json”\
    \ file that is used by the “electronize” command for the execution of the program\
    \ (this file describes the Electron context).\n\n### H) Execute the application:\n\
    \nAfter that, you can execute the Electron.NET ASP.NET Core application with the\
    \ command “start” as described below (in the application folder for Windows and\
    \ in the solution folder for ubuntu and macOS).\n\n```\n::\\appPath>dotnet electronize\
    \ start\n```\n\nOn ubuntu and macOS you have to use the “electronize” command\
    \ without the “dotnet” part as described below.\n\n```\n> electronize start\n\
    ```\n\nWith this command the application is executed in a classical desktop application\
    \ window (not in the browser, but this is still a web application).\n\n## 8.3.5\
    \ Electron.NET application example\n\nAs Electron.NET is a popular wrapper around\
    \ Electron, you will find plenty of code examples (check GitHub) for helping and\
    \ guiding you for the development of your Electron.NET application (see reference\
    \ links).\n\nThese examples make often an intensive use of the SPA (Single Page\
    \ Application) techniques and use specialized JavaScript frameworks like Vue.JS\
    \ or React... The reason is that the desktop application experience requires a\
    \ minimum of blinking screen being liked by the user and looked as a tangible\
    \ desktop application.\n\nSo, the development of an application with Electron.NET\
    \ implies an intensive use of JavaScript for making the buffer between the web\
    \ development back-end and the desktop Front-End (which has a natural tendency\
    \ to blink as a common web application).\n\nThe Electron.NET, ASP.NET Core example\
    \ application we will review is the “ElectronNET-API-Demos” application from the\
    \ Electron.NET repository.\n\nThis is the application of reference for this type\
    \ of application. It illustrates the use of many Electron.NET features. Most of\
    \ the source code is exposed in the application itself for teaching purpose.\n\
    \nIn this sample, you will find a couple of useful techniques specific to the\
    \ Electron.NET application type, these techniques can be reused in\n"
  mdcn: "\n\nElectron.NET.CLI 是用于构建和打包 Electron 应用程序的命令行工具，它不用于应用程序的代码内部（它是一个工具）。Electron.NET.CLI\
    \ 对于运行你的 .NET Core Electron.NET 应用程序是必需的。\n\n你可以使用下面描述的命令行安装此工具（这是 dotnet CLI\
    \ 的工具集包）。它可以作为 dotnet CLI 的全局工具安装，通过“electronize”命令扩展它。\n\n```\nC:> dotnet tool\
    \ install ElectronNET.CLI -g\n```\n\n在 .NET Core 中设置 Electron.NET.CLI 后，“electronize”命令可作为\
    \ dotnet CLI 的全局工具使用。“electronize”命令仅针对特定的 .NET Core 版本安装，该工具本身安装在用户文件夹中：%UserProfile%/.dotnet/tool/\n\
    \n但在使用 Electron.NET 包装器之前，.NET Core 应用程序开发者必须安装先决条件工具：Node.JS 及其依赖项 NPM。\n\n##\
    \ 8.3.3 NPM 和 Node.JS 的设置\n\nNPM 代表 Node Package Manager，Node.JS 是来自 Chromium\
    \ 项目（由 Google 开发）的 JavaScript 运行时引擎。Electron.NET 要求 Node.JS 版本 >8.6。我们建议从专用网站安装\
    \ NodeJS（参考中提供了网址），以获取工具的最新版本并确保在每个系统上正确安装。\n\n以下是下载安装文件的参考链接（以及获取此处审查的每个操作系统的文档）。\n\
    \nhttps://www.npmjs.com/get-npm\nhttps://nodejs.org/en\n\n我们将详细介绍如何在每个平台上安装这些工具，因为这是使用\
    \ Electron 框架的核心要求，并且常常在项目构建过程中构成问题。\n\n### 8.3.3.1 在 macOS 上\n\n对于此平台，我们建议安装\
    \ Node.js 网站上的版本（这是最新版本，在构建 Electron.NET 应用程序时不应该出现版本号问题）。\n\n下载后，你需要通过点击它来安装该工具（这是一个\
    \ .pkg 文件）。产品安装成功后，你应该看到如下界面\n\n![](img/3d310cc066dda6e2dfa67a650614076f_151_0.png)\n\
    \n安装过程完成后，我们建议在开始构建 Electron.NET 应用程序之前重启计算机（以确保每个环境变量都已更新）。\n\n### 8.3.3.2 在\
    \ Ubuntu 上\n\n在 Linux 系统上，你可以使用通常的包管理器“apt”通过以下命令安装 Node.JS，你还需要安装 NPM，因为它不在这个环境的同一包中。\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install nodejs\n$ sudo apt-get install\
    \ npm\n```\n\n成功安装的样子如下。\n\n```\nFile Edit View Search Terminal Help\njohngubuntu:~$\n\
    Get:1 http://us.archive.ubuntu.com/ubuntu bionic/main amd64 libhttp-parser2.7.1\n\
    amd64 2.7.1-1build1 [39.8 kB]\nGet:2 http://us.archive.ubuntu.com/ubuntu bionic-updates/universe\
    \ amd64 nodejs amd64 8.10.0.dfsg-2ubuntu0.4 [4.790 kB]\nFetched 5,058 kB in 47s\
    \ (102 kB/s)\nReading package lists... Done\nBuilding dependency tree\nReading\
    \ state information... Done\nThe following additional packages will be installed:\n\
    libhttp-parser2.7.1\nPreparing to unpack .../libhttp-parser2.7.1_2.7.1-1build1_amd64.deb\
    \ ...\nUnpacking libhttp-parser2.7.1 (2.7.1-1build1) ...\nSetting up libhttp-parser2.7.1\
    \ (2.7.1-1build1) ...\nPreparing to unpack .../nodejs_8.10.0.dfsg-2ubuntu0.4_amd64.deb\
    \ ...\nUnpacking nodejs (8.10.0.dfsg-2ubuntu0.4) ...\nProcessing triggers for\
    \ man-db (2.8.3-2ubuntu0.1) ...\nSetting up nodejs (8.10.0.dfsg-2ubuntu0.4) ...\n\
    update-alternatives: using /usr/bin/nodejs to provide /usr/bin/js (js) in auto\
    \ mode\nProcessing triggers for libc-bin (2.27-3ubuntu1) ...\nroot@ubuntu:~#\n\
    ```\n\n一旦两个包都已正确（无错误）安装，你可以使用以下命令控制已安装的版本。\n\n```\n$ nodejs -v\n```\n\n使用此命令还可以帮助你验证一切是否正常运行（验证安装是否正确执行）。显示的版本号必须\
    \ >8.6。\n\n### 8.3.3.3 在 Windows 上\n\n在 Windows 上，你必须安装 NPM 和 Node.js。\nVisual\
    \ Studio Installer 程序中的 Node.JS 版本设置不适用于构建 Electron.NET 应用程序（因为你还需要安装 NPM）。我们建议不要为这项特定任务使用此版本。\n\
    \n更简单的解决方案是从专用网站设置 Node.JS/NPM，这将确保你安装最新可用版本（链接已在前面的参考中提供）。\n\n以下是安装程序的界面。\n\n\
    ![](img/3d310cc066dda6e2dfa67a650614076f_153_0.png)\n\nWindows 要求你在开始使用之前重启系统，以使用新的环境变量更新系统。\n\
    \n## 8.3.4 Electron.NET 快速入门\n\n使用 Electron.NET 意味着需要遵循一个过程，以便将其集成到 ASP.NET Core\
    \ 应用程序中并将其转换为桌面应用程序。\n\n以下是“electronize”你的 ASP.NET Core 3 应用程序的简短过程。我们将在后面更详细地审查应用程序代码本身（在示例部分中）。\n\
    \n- A) 创建 ASP.NET Core MVC 应用程序\n\n可以使用 dotnet CLI 或 Visual Studio 完成。\n\n- B)\
    \ 安装 Electron.NET 命令行全局工具（自版本 0.9 起）\n\n在开始开发应用程序之前，你必须使用下面描述的命令行安装 dotnet CLI\
    \ 的 Electron.NET.CLI 全局工具。\n\n```\n$ dotnet tool install --global Electron.NET\n\
    ```\n\n- C) 添加 Electron.NET 包：\n\n除了从 Visual Studio NuGet 包管理器添加它之外，你还可以在包管理器命令行中键入以下行来添加依赖项。\n\
    \n```\nPM> Install-Package Electron.NET.API\n```\n\n### D) 设置打包（仅适用于 ubuntu 和\
    \ macOS）\n\n此步骤仅适用于 ubuntu 和 macOS 平台，在这些操作系统上，你需要使用以下命令行指令安装“electron-builder”。\n\
    \n```\n$ sudo npm install electron-builder --global\n```\n\n### E) 开始使用 Electron.NET：\n\
    \n你可以通过在 WebHostBuilder 中使用以下代码来实现这一点。\n\n```\npublic static IWebHost BuildWebHost(string[]\
    \ args)\n{\n    return WebHost.CreateDefaultBuilder(args)\n        .UseElectron(args)\n\
    \        .UseStartup<Startup>()\n        .Build();\n}\n```\n\n你可以注意到，我们刚刚将“UseElectron(args)”行添加到了\
    \ WebHost 中，以便在 MVC ASP.NET Core 应用程序中启用 Electron 的使用。\n\n### F) 在 Startup.cs\
    \ 文件中创建 Electron 窗口：\n\n这可以通过在“Configure”方法中使用以下指令来完成：\n\n```\nTask.Run(async\
    \ () => await Electron.WindowManager.CreateWindowAsync());\n```\n\n使用这行代码，Web\
    \ 应用程序在 Electron 窗口中执行。\n\n### G) 应用程序初始化：\n\n第一次启动 Electron 应用程序时，你必须使用下面描述的命令对其进行“初始化”（你必须位于应用程序文件夹中）。\n\
    \n```\n::\\appPath>dotnet electronize init\n```\n\n此命令将创建“electron.manifest.json”文件，该文件由“electronize”命令用于程序的执行（此文件描述\
    \ Electron 上下文）。\n\n### H) 执行应用程序：\n\n之后，你可以使用“start”命令执行 Electron.NET ASP.NET\
    \ Core 应用程序，如下面描述（在 Windows 上位于应用程序文件夹中，在 ubuntu 和 macOS 上位于解决方案文件夹中）。\n\n```\n\
    ::\\appPath>dotnet electronize start\n```\n\n在 ubuntu 和 macOS 上，你必须使用不带“dotnet”部分的“electronize”命令，如下面描述。\n\
    \n```\n> electronize start\n```\n\n使用此命令，应用程序在经典桌面应用程序窗口中执行（不在浏览器中，但这仍然是一个 Web\
    \ 应用程序）。\n\n## 8.3.5 Electron.NET 应用程序示例\n\n由于 Electron.NET 是围绕 Electron 的流行包装器，你将找到大量代码示例（查看\
    \ GitHub）来帮助和指导你开发 Electron.NET 应用程序（请参阅参考链接）。\n\n这些示例通常大量使用 SPA（单页应用程序）技术，并使用\
    \ Vue.JS 或 React 等专业 JavaScript 框架……原因是桌面应用程序体验需要最小限度的屏幕闪烁，以便用户喜欢并看起来像一个实体桌面应用程序。\n\
    \n因此，使用 Electron.NET 开发应用程序意味着大量使用 JavaScript 来在 Web 开发后端和桌面前端之间创建缓冲（桌面前端自然倾向于像普通\
    \ Web 应用程序一样闪烁）。\n\n我们将审查的 Electron.NET、ASP.NET Core 示例应用程序是 Electron.NET 仓库中的“ElectronNET-API-Demos”应用程序。\n\
    \n这是此类应用程序的参考应用程序。它说明了许多 Electron.NET 功能的使用。大部分源代码在应用程序本身中公开，用于教学目的。\n\n在此示例中，你将找到一些特定于\
    \ Electron.NET 应用程序类型的有用技术，这些技术可以重复用于\n\n"
