  md: '# Summary


    Categories allow you to add methods to an existing class without requiring access
    to the class''s source code. This provides a way to extend classes without subclassing
    them; the new methods become part of the existing class. Category header files,
    which are just lists of method declarations, can be used to manage large classes
    into several files or to provide separate header files for public and private
    methods.


    Extensions provide access control for hide declarations of private methods. Objective-C
    methods can be private only in the visibility of their declarations. A programmer
    who knows the name of a method can call it successfully even if the declaration
    isn''t visible.


    Objective-C provides access control for instance variables with the @private,
    @protected compiler directives; however, it is possible to go around them and
    access @private variables by using a category method.


    # Exercises


    +   1. Write a category method on NSString that reverses the order of words in
    a string. Your `reverseWords` category method should turn the string "dog bites
    man" into "man bites dog". (The original string is the receiver and the reversed
    string is the method''s return value.) Write a small program to test `reverseWords`.


    +   2. Write a class that has an extension and a program to test it. (Your class
    doesn''t have to do anything useful, you can just put in print or NSLog statements
    for the methods.)


    +   - Temporarily omit the implementation of the method that you declare in the
    extension. Verify that the compiler warns you of the omission.


    +   - Add the implementation of the extension method and try to call it from the
    test program. Verify that the compiler warns the object may not respond to the
    method. Then notice you can successfully call the method anyway.


    +   3. Verify the instance variable scope. Define a class that has each one of
    @private, and @public instance variables. Then:


    +   - Try to access each instance variable directly (object->instance variable)
    within a subclass method.


    +   - Create a subclass of the original class. Try to access each instance variable
    within a subclass method.


    +   4. Write a category that snoops on the @private instance variable in the class
    you defined in Exercise 2. Use the approach shown in Listings 11.7 and 11.8.


    +   5. Download `class-dump` (www.codecode.com/projects/class-dump). Run it against
    some of the Objective-C programs that you have written for the exercises'
