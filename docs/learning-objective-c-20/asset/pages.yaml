    \n# Multiple @catch Blocks\n\nYou can use to throw different types of exception\
    \ objects for different situations. Then, you can use multiple @catch blocks,\
    \ each typed for a different type of exception, with a single @try block, as shown\
    \ in the following example:\n\n```\n@try \n{\n  ...\n}\n@catch (NSString* myString)\
    \ \n{\n  // Process exceptions thrown with an object that is an\n  // NSString\
    \ or a subclass of NSString\n}\n@catch (NSException *myException) \n{\n  ...\n\
    }\n@finally\n{}\n```\n\nWhen there are multiple @catch blocks, an exception is\
    \ caught by the first @catch block (going in program order) that matches the exception\
    \ object. The condition for a match is that the exception object is a member of,\
    \ or a member of a subclass of, the class used as the type in the @catch block.\
    \ If the code throws an exception using an object that doesn't match any of the\
    \ @catch blocks, the exception is not caught. The program terminates immediately\
    \ and the code in the @finally block is not executed.\n\n# Nested Exception Handling\n\
    \nThe code inside a @try block may itself contain a @try/@catch/@finally set,\
    \ the equivalent of:\n\n```\n@try \n{\n```"
