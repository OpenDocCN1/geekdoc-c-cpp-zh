  md: 'However, trying to obtain a value from a generic pointer it is an error because
    the compiler has no way of knowing how to interpret the bytes at the address indicated
    by the generic pointer:


    ```

    int a = 9;

    int b;

    void *genericPointer;

    genericPointer = &a;

    b = *genericPointer; // WRONG won''t compile

