    # Variables


    A variable is a name for bytes of memory in a program. When you assign a value
    to a variable, what you really doing is storing value in those bytes.Variables
    in a computer language are like the nouns in a natural language. They represent
    items and quantities in the problem space of your program.


    C requires that you tell the compiler about any variables that you are going to
    use by declaring them. A variable declaration has the form:


    ```

    variabletype name;

    ```


    C allows multiple variables in a single declaration:


    ```

    variabletype name1, name2, name3;

    ```


    A variable declaration causes the compiler to reserve storage (memory) for that
    variable. The value of a variable is the contents of its memory location. The
    next chapter describes variable declarations in more detail. It covers where variable
    declarations are placed, where the variables are created in memory, and the lifetimes
    of different classes of variables.


    # Integer Types


    C provides the following types to hold integers: char, short, int, long, and long
    long. Table 1.1 shows the sizes in bytes of integers on 32- and 64-bit Mac OS
    executables. (32-bit and 64-bit executables are discussed in Appendix C, "32-Bit
    and 64-Bit:")


    The char type is named because it was originally intended to hold characters;
    but it is frequently used as an 8-bit integer type.


    Table 1.1 The Sizes of Integer Types


    | Type | 32-bit | 64-bit |

    |---|---|---|

    | char | 1 byte | 1 byte |

    | short | 2 bytes | 2 bytes |

    | int | 4 bytes | 4 bytes |

    | long | 4 bytes | 8 bytes |

    | long long | 8 bytes | 8 bytes |'
