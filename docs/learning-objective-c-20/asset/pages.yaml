    used. The first time a class object is sent a message (typically an alloc message
    creating the first instance of that class), the runtime intercepts and sends an
    initialize message to the class object. The initialize message is sent before
    the original message is delivered.


    > Note

    Using initialize to initialize a class is different than using an init... method
    to initialize an instance of a class.


    The default initialize method inherited from NSObject does nothing. Most classes
    do not require initialization, but there are few situations where you might want
    to override initialize:


