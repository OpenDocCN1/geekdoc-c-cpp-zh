  md: '# Kernel and User Programs in 64-Bit


    The kernel and user programs are separate. Each can be either 32- or 64-bit. A
    32-bit kernel can run both 32- and 64-bit user programs. So can a 64-bit kernel.
    Although recent Macs are capable of booting a 64-bit kernel, most consumer computers
    are set up to the 32-bit version instead. This is because the kernel (including
    device drivers and kernel extensions) must be either 32, or 64-bit—not both. Relatively
    few 64-bit drivers are presently available. Most systems that run a 64-bit kernel
    turn to be running Mac OS Server (the desktop version of Mac OS X).

    These systems usually don''t have drivers or peripherals that require a 64-bit
    driver. This situation will undoubtedly encourage more sizes of 64-bit drivers
    to become available. If you compile your programs for 64-bit, all the libraries
    and frameworks that you link, and plugins, must be available in 64-bit versions.
    This is not a problem for the system-supplied libraries and frameworks, such as
    the Cocoa frameworks, which are all available in 64-bit versions. However, if
    you are using other libraries, you may have to compile them for 64-bit (if you
    have access to the source) or continue to build your program as a 32-bit application
    until 64-bit versions of the resources become available.


    # Coding Differences for 64-Bit Programs


    The main difference between 32 and 64-bit executables is the size of some of the
    primitive types. In a 32-bit executable, ints, longs, and pointers are all 4 bytes.
    In a 64-bit executable, ints, longs and pointers are 8 bytes. The primary point,
    the one that can cause you trouble, is that in a 64-bit executable, longs are
    no longer the same size as ints.

    Assigning a type to a longer type is okay, but assigning a long type to a shorter
    type truncates the value in the longer type and may result in nonsense. This may
    seem an obvious point, but there is a long history in C programming of ignoring
    the difference between a pointer and an int, and the fact that many systems calls
    return long rather than int. Overall the difference between a long and an int,
    makes no real difference when they are all 4 bytes; the same code compiled for
    64-bit can cause real problems. When coding for 64-bit, you should be careful
    when doing pointer arithmetic; you should never cast a pointer to an int.


    # Performance


    Does compiling a program as a 64-bit executable make it run faster? There is no
    way to tell without building the program as separate 32-bit and 64-bit executables
    and then comparing the execution times. When you move to a 64-bit executable,
    there are some competing effects. On one hand, when an int CPU runs in x86_64
    (64-bit) mode, it'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'has access to registers. It can use these registers instead of the stack to
    pass arguments during a function call, resulting in better performance. Moving
    from a 32-to a 64-bit executable can cause your programs memory footprint to increase
    (because many 4-bit variables are now 8-byte variables), sometimes dramatically.
    The larger size can mean more instruction cache misses, which results in worse
    performance.


    # # Compiling for 64-Bit


    To compile a program as 64-bit, you must tell the compiler that you want 64-bit.
    If you are compiling with gcc from the command line, you need to use the `-arch`
    flag. The following commands compile `program.m` into a 64-bit executable:


    ```

    gcc -arch x86_64 program.m -framework Foundation

    ```


    If you specify more than one -arch flag, gcc builds a universal binary that contains
    an executable for each of the architectures. For example, the following line compiles
    `program.m` into a three-way universal binary (also known as a fat binary) with
    executables for 32-bit PowerPC, 32-bit Intel, and 64-bit Intel:


    ```

    gcc -arch 1386 -arch x86_64 -arch program.m -framework Foundation

    ```


    Universal binaries allow you to build a program as 64-bit for users with recent
    Intel machines, while retaining compatibility for users on PowerPC machines. The
    disadvantages of a universal binary are that the compile times are longer (the
    compiler has-to build the program several times over), and the file size of the
    executable is several times larger (a universal binary is made up of binary for
    each architecture, glued together as a single file). However, the in-memory footprint
    of a program executed from a universal binary is not larger: The loader only loads
    the executable that is appropriate for the current environment.


    To compile a project as 64-bit or as a universal binary using Xcode, you set the
    architecture in the Build tab of the Project settings window, as shown in Figure
    C.1 on the next page.


    # # More Information


    The Apple documents on 64-bit Mac OS are located at: http://developer.apple.com/mac/library/documentation/Darwin/Conceptual/64bitPorting/intro.html


    The Cocoa-specific 64-bit documents are located at: http://developer.apple.com/mac/library/documentation/Cocoa/Conceptual/Cocoa64BitGuide/Introduction.html'
