    # Cocoa Frameworks

    Mac OS X programs written with the Objective-C technology they acquired with the
    framework of NeXTStep. The Cocoa framework is an umbrella framework that consists
    of the three primary frameworks used in building applications:


    +   * *Foundation Framework*: Foundation contains the basic objects needed for
    almost any application. The next chapter covers some of the important Foundation
    classes.

    * *AppKit*: AppKit is for Application Kit. AppKit contains the classes that are
    needed to build GUI applications on OS X.

    * *Core Data*: Core Data is the most recent addition (with Mac OS 10.4). It is
    a framework for managing collections of persistent (that is, saved out to disk
    between invocations of the program) objects.


    You can get the headers for all three of these frameworks by importing:

    #import <Cocoa/Cocoa.h>


    If you are writing a command line program that doesn''use Core Data or AppKit,
    you can just use the Foundation group header:

    #import <Foundation/Foundation.h>'
