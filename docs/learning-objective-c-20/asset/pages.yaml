  md: '# Chapter 16 Blocks


    To store the block in the instance variable loggingBlock, you must copy the block
    literal and assign it to the instance variable. This is because the block literal
    goes out of scope when initWithName returns. Copying the block puts copy on the
    heap (like a normal Objective-C object). However, the block literal references
    the instance variable name, so the copy self to be retained, setting up a retain
    cycle. The block now has ownership of the block and the object has ownership of
    the block (it has copied the block). The objects reference count never gets zero
    and itsalloc method is never called.


    You can fix this by changing Line 10 of Listing 16.4 so it reads as follows: loggingBlock
    = ^(void)(NSString *inputName) };


    With this, the block copying operation returns the input argument rather than
    the instance variable. Because the block no longer references any of the object''s
    variables, self is not retained and there is no retain cycle. The object will
    still have the same behavior because name and input have the same content.


    > Note The preceding rules are presented separately for blocks copied a method
    to emphasize the consequences of a block accessing an object''s instance variable.
    But there is really no significant difference between copying a block inside or
    outside a method. The only difference is that, outside of a method, there is no
    way to reference an object''s instance variables without referencing the object
    itself.


    # Traps


    Because blocks are stack-based objects, they present some traps for the unwary
    programmer. The following snippet of code is incorrect:


    ```

    void(loggingBlock)(void);

    ```


    ```

    BOOL canReEdit = ...

    ```


    ```

    // WRONG

    if (canReEdit)

    loggingBlock = ^(void){NSLog("#YES"); };

    else

    loggingBlock = ^(void){NSLog("#NO"); };

    ```


    ```

    // Possible crash

    loggingBlock();

    ```


    At the end of this snippet, loggingBlock is undefined. The if and else clauses
    of an if statement and the bodies of loops are separate lexical scopes, even if
    they are single statements and not compound statements. When the program execution
    leaves the scope, the compiler is free to destroy the block and leave loggingBlock
    pointing to garbage.'
