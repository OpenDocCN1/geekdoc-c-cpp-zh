  md: '# Polymorphism


    Polymorphism is the capability of objects belonging to different classes to respond
    to the same message. For example, you could add an Image class to the drawing
    program so it can also render images (bitmaps). Like the Shape class, the Image
    class defines a draw method. Each class''s implementation of the draw method is
    different: Shape''s draw method knows how to draw a Shape and Image''s draw method
    knows how to draw images. If you have a list of graphic objects that represent
    a drawing, you can render it on the screen by sending each object in the list
    a draw message. Even though the message is the same in each case, the Shape objects
    on the list will execute Shape''s version of draw and the Image objects will execute
    Image''s version of draw.


    # What is the Point of an Object-Oriented Language?


    It is possible but difficult and unpleasant, to implement an object-oriented style
    of programming using a procedural language. Using C as an example to add methods
    to your objects you could use structures and regular C functions. To add fields
    to the object structure to hold pointers to the method functions, you could also
    add an argument to each method function that would allow you to pass a pointer
    to the object it was. But you will likely run into errors. Even something as simple
    as storing different objects in a single array and looping over them becomes awkward
    use of the cost of.


    There are other drawbacks. Building your object system can result in fragile code
    and perhaps unintended consequences if you haven''t thought out the implications
    of your design. A home-made object system is likely to be a one-off design. A
    one-off custom design makes it difficult to incorporate code or libraries from
    other sources into your program. You would have to build everything from scratch,
    at a cost of longer development times and an expanded opportunity for bugs.


    It is much easier to create an object-oriented design in a language that has the
    structures for object-oriented programming in the language.


    # An Introduction to Objective-C


    Objective-C is an object-oriented extension to C. As you will see in this section
    and the next, Objective-C''s are quite minimal. The additions are primarily a
    way to define classes, a way to invoke methods, a dozen or so keywords and directives
    to the compiler. The concepts are subtle and powerful, but there are little syntax
    to memorize.


    In adding an object system to C, Objective-C doesn''t eliminate the procedural
    parts of C. This gives you the best of both worlds. You can use objects for those
    tasks where they are appropriate, and use the procedural part of Objective-C (plain
    C) where it is the best fit to the problem. Having plain C as a base for the language
    also makes it easy for Objective-C programs to use existing libraries and code
    that are written in plain C.'
