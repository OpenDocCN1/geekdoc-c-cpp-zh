  md: '# Preface


    Objective-C is an object-oriented extension to C. You could call it "C with Objects."


    If you''re reading this book, you''re probably interested in learning Objective-C
    so that you can write applications for Mac OS X or for iOS. But there''s another
    reason to learn Objective-C: it is a language that is relatively easy to learn.
    Like anything else in the real world, it has some rough spots but is much simpler
    than other languages, particularly C++. The additions that Objective-C makes to
    C can be listed on a page or two.


    In the Apple world, Objective-C does not work alone. It is used in connection
    with two class frameworks. The Foundation framework contains basic entities, such
    as strings and arrays, and classes that wrap interactions with the operating system.
    The AppKit contains widgets like menus, buttons, and the assorted other widgets.
    The two frameworks are called Cocoa. On iOS, a different framework called UIKit
    replaces the AppKit. Together, Foundation and UIKit are called Cocoa.


    Objective-C was initially created by Brad J. Cox in the early 1980s. In 1988,
    NEXT started with Apple learned Objective-C and made it the base of the development
    environment for creating applications under NEXT''s NeSTEP operating system. The
    NEXT engineers developed a set of Objective-C libraries for building applications.
    After NEXT withdrew from the hardware business in 1993, it worked with Sun Microsystems
    to create OpenStep, a specification for an object-oriented system based on the
    NeSTEP API. Swift eventually lost interest in OpenStep until NEXT was purchased
    by Apple in 1997. The NeSTEP operating system became the base of Mac OS X.


    This book focuses on the Objective-C language. It will not teach you how to write
    Cocoa programs or make you an expert Xcode user. It covers and uses a small part
    of the Foundation framework, and mentions the AppKit and UIKit only in passing.
    The book''s premise is that you will have a much easier time learning Cocoa if
    you first acquire a good understanding of the language on which Cocoa is based.


    # Who Should Read This Book


    This book is intended for programmers who want to learn Objective-C in order to
    write programs for Mac OS X or iOS (iOS is used for the iPhone, the iPod touch,
    and the iPad.) Although it is technically possible to write complete OS programs
    using'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'other languages, writing a program that follows the Apple Human Interface Guidelines¹
    and has a Mac “look and feel” requires the use of the Objective-C Cocoa frameworks.
    Even if you write the core of a Mac application in a different language, such
    as plain C or C++, your user interface layer should be written in Objective-C.
    When writing for iOS, there is no choice an iPhone app''s outer layer and user
    interface must be written in Objective-C.


    The book will be useful for programmers who want to write Objective-C programs
    for other platforms using the GNUStep project,² open source implementation of
    the OpenStep layers.


    # What You Need to Know


    This book assumes a working knowledge of C; Objective-C is an extension of C;
    the book concentrates on Objective-C adds to C. For those whose C is rusty and
    those who are adept at picking up a new language quickly, Chapters 2 and 3 form
    a review of the essential parts of C that you likely need to write an Objective-C
    program. If you have no experience with C or any C-like language (C++, Java, and
    C#), you will probably want to read a book about C in conjunction with this book.
    Previous exposure to an object-oriented language is helpful but not absolutely
    necessary. The required object-oriented concepts are introduced at the book proceeds.


    # New in Objective-C 2.0


    If you already know some Objective-C and want to skip to the parts of the language
    that are new in the 2.0 version, they are covered in these chapters:


    +   * Fast Enumeration (Chapter 10) provides a simple (and fast) way to iterate
    over a collection of objects.

    * Declared properties (Chapter 12) provide an easy way to specify an object''s
    instance variables and have the compiler create methods to access those variables
    for you.

    * Garbage collection (Chapter 15) adds automatic memory management to Objective-C.

    * Blocks (Chapter 16) let you define function-like objects that carry their context
    with them.


    # How This Book Is Organized


    This book is organized into three sections: The first section is a review of C;
    followed by an introduction to object-oriented programming and Objective-C. The
    second section of the book covers the Objective-C language in detail, and provides
    an introduction to


