    # Collection Classes


    NSArray, NSDictionary, Set, and their mutable subclasses are collection classes.
    They provide containers for handling groups of objects. In other languages you
    may be familiar (with scripting languages), containers are part of the language.
    In Objective-C, though, containers are provided by the Foundation framework. NSDictionary
    and NSArray are widely used throughout Foundation and AppKit to pass in multiple
    objects to get multiple objects back as a return value.


    # NSArray


    C arrays are just regions of contiguous bytes large enough to hold the requested
    number of items of the specific type; for example:


    ```

    unsigned char name[25];

    ```


    just sets aside 25 bytes beginning at the address of name[0]. There is no runtime
    information on the length of the array and no bounds checking. Not prevents you
    from doing the following:


    ```

    unsigned char name[25];

    name[100] = 200;

    ```


    The assignment in the preceding code will overwrite whatever is stored at the
    memory location name+100, possibly resulting in overrun data or a crash. This
    sort of mistake, whether accidental or intentional (a buffer attack), is one of
    the major headaches in C programming.


    The NSArray class (and its mutable subclass, NSMutableArray) provides arrays of
    objects that eliminate these problems. NSArray has these characteristics:'
