  md: "# Destroying Objects\n\n> Note\nAfter `[self release]` is executed, the object\
    \ held in self is no longer valid. You should not execute any code that references\
    \ self between invoking release on self and returning nil. If you don't follow\
    \ this rule, and the offending code is executed, it will cause your program to\
    \ crash.\n\n# # Destroying Objects\n\nHow do you get rid of objects when you are\
    \ finished with them? It is important to properly dispose of unneeded objects\
    \ their bytes can be returned to the heap for using Objective-C, you don't explicitly\
    \ destroy objects.\n\nIf you are garbage collection (see Chapter 15\n\nIf you\
    \ use reference counting, when you are finished with an object you created or\
    \ retained, you use a `release` message. If that release message drops the object's\
    \ count to zero, the release method calls the object's `dealloc` method. The object's\
    \ dealloc method should:\n\n+   1. Send a message to any objects that the disappearing\
    \ object has created or retained.\n2. Invoke the superclass's dealloc method.\n\
    \nThe `dealloc` method for the `TeeShirt` from the preceding section class looks\
    \ like:\n\n```\n(void)dealloc {\n  [super release];\n  [shirtColor release];\n\
    }\n```\n\nIn the following code `shirtColor` holds an object (an `NSColor`) that\
    \ was retained when the `TeeShirt` instance was created. When it is about to disappear,\
    \ the `TeeShirt` object must retain with a `release` message. Otherwise, the object\
    \ held in `shirtColor` becomes a potential memory leak.\n\nThe line `[super dealloc]`\
    \ is very important. It is `NSObject`'s implementation of dealloc that returns\
    \ the object's bytes to the heap. If any class in the inheritance chain between\
