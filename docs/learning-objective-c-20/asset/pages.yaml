  md: "Chapter 1 C, The Foundation of Objective-C\n\nFor a language lawyer's view\
    \ of C, or to explore some darker corners of the language, consult C: A Reference\
    \ Manual by Harbison and Steede.²nThink for a moment about how you might go about\
    \ learning a new natural language. The first thing to do is look at how the language\
    \ is written; Which alphabet does it use (if it uses an alphabet at all; some\
    \ use pictographs)? Does it read left to right, right to left, or top to bottom?\
    \ When you start learning words you need least a small vocabulary to get started.\
    \ As you build your vocabulary, you can start combining the words into phrases,\
    \ and then start combining your phrases into sentences. Finally you can combine\
    \ sentences into paragraphs.\n\nThis review of C follows roughly the same progression.\
    \ The first section looks at the structure of a C program, how code is formatted,\
    \ and the rules and conventions for various entities. The following sections covers\
    \ variables and operators, which are roughly analogous to nouns and verbs in a\
    \ natural language, and how they are combined into longer expressions and statements.\
    \ The next section covers control statements. Control statements allow a program\
    \ to do more interesting things than execute statements in a linear sequence.\
    \ The final section of the review covers the C preprocessor, which allows you\
    \ to do some programmatic editing of source files before they are sent to the\
    \ compiler, and the printf function, which is used for character output.\n\n#\
    \ # Structure of a C Program\n\nThis chapter begins by looking at some structural\
    \ aspects of a C program: the main routine, formatting issues, comments, names\
    \ and naming conventions, and file types.\n\n# # main Routine\n\nAll C programs\
    \ have a main routine. After the OS loads a C program, the program begins with\
    \ the first line of code in the main routine. The standard form of the main routine\
    \ is as follows:\n\n```\nint main(int argc, char *argv[])\n{\n    // The code\
    \ that the work goes here\n    return 0;\n}\n```\n\nThe key features are:\n\n\
    +   - The indent on the first line indicates that main returns an integer value\
    \ to the OS as a return code.\n- The name main is required.\n\n2. Samuel P Harbison\
