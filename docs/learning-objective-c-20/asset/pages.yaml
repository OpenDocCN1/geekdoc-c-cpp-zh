    # Compile and Run Time


    There are two times that are significant when you create programs: compile time,
    when your source code is translated into machine language and linked together
    to form an executable program, and runtime (also called execution time), when
    the executable program runs as a process on some computer. One of the characteristics
    that distinguishes Objective-C from other common languages, especially C++, is
    that Objective-C is a very dynamic language. "Dynamic" here means that decisions
    that other languages make at compile time are postponed to run time in Objective-C.
