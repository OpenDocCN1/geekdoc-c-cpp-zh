    To obtain a value through a void* you must cast it to a pointer to a known type:


    ```

    int a = 9;

    int b;

    void *genericPointer;

    genericPointer = &a;

    b = (*int*)genericPointer; // OK - b is now 9

    ```


    The cast operator (int*) forces the compiler to consider genericPointer to be
    a pointer to an integer. (See Conversion and Casting, in the chapter.)


    C does not check to see that a pointer variable points to a valid area of memory.
    Incorrect use of pointers has probably caused more crashes than any other aspect
    of C programming.


    # Arrays


    C arrays are declared by adding the number of elements in the array, enclosed
    in square brackets ([}), to the declaration, after the type and array name:


    ```

    int a[100];

    ```


    Individual elements of the array are accessed by placing the index of the element
    in [] after the array:


    ```

    a[6] = 9;

    ```


    The index is zero-based. In the previous example, the legitimate indices run from
    0 to 9. Access to C arrays is not bounds checked on either end. C will blithe
    let you do the following:


    ```

    a[100];

    a[100] = 25;

    a[-100] = 30;

    ```


    Using an index outside of the array''s bounds lets you trash memory belonging
    to other variables or corrupted data. Taking advantage of the lack of checking
    is one of the pillars of mischievous malware.


    The bracket notation is just a nicer syntax for pointer arithmetic. The name of
    an array, without the array brackets, is a pointer variable pointing to the beginning
    of the array. These two lines are completely equivalent:'
