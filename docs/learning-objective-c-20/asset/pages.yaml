  md: '# 15


    # Garbage Collection


    A typical running Objective-C program continually allocates new objects. Most
    of these objects are needed only temporarily; there is no need for them to remain
    valid until the program terminates. If the program doesn''t return the bytes used
    for unneeded objects, the program''s memory footprint continues to grow and performance
    suffers. The previous chapter covered reference counting, a manual system for
    managing memory. This chapter covers garbage collection, an automatic system for
    managing memory in Mac OS X Leopard (v 10.5). Garbage collection is not available
    on iOS.


    When you use garbage collection for your memory management, a separate thread,
    called the garbage collector, runs mechanically. The garbage collector examines
    your program''s memory, determines which objects are in use, and deallocates any
    objects that are not being used.


    This chapter explains the theory of garbage collection, how the Objective-C garbage
    collector works, how to use garbage collection in an Objective-C program, and
    covers some of the problems with the current implementation of Objective-C''s
    garbage collector.


    # Garbage Collection: The Theory


    The task of a garbage collector is to find objects that are no longer used by
    a running program and deallocate their bytes to the heap so that they can be reused.


    Garbage collection is simple in principle. Any object that is known to be in use
    or can be reached by following a chain of references (pointers) from an object
    to be in use is considered to be "live". All other objects are considered to be
    "garbage" and are collected. The memory used by the garbage objects is returned
    to the heap.


    The garbage collector starts with an initial set of objects called the root set.
    The objects in the root set are objects that are known to be in use because they
    are held in variables on the stack or in external variables. The collector then
    performs a knee-bone-connected-to-the-thigh-bone kind of analysis. It marks the
    root set as live, then marks any objects that the root set references as live.
    It continues following references and marking until it'
