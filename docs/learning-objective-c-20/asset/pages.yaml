    \ the revised interface section. The changes are in bold.\n\nListing 12.7 Employee\
    \ coded using @property statements\n\n```\n#import <Foundation.h>\n\n@interface\
    \ Employee : NSObject\n{\n    int employeeNumber;\n    NSString *name;\n    Employee\
    \ *supervisor;\n    int salary;\n}\n\n@property (nonatomic, readonly) int employeeNumber;\n\
    @property (nonatomic, readonly) NSString *name;\n@property (nonatomic, readonly)\
    \ Employee *supervisor;\n@property (nonatomic, assign) int salary;\n\n...\nend\n\
    ```\n\nThe @property statements replace the declarations for the accessor methods.\
    \ This is an improvement. It's single line declares both the getter and the setter\
    \ (if there is one). It's also easier to read, and as a bonus, it contains some\
    \ information about how the accessors are constructed.The different attributes—the\
    \ items in the parentheses—are covered in the next section.)\n\nThe real surprise\
    \ is the amount of code in the implementation file, shown here in Listing 12.8."
