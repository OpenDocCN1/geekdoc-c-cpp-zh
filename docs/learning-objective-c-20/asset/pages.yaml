  md: "# Chapter 12 Properties\n\nListing 12.8 Employee.m\n\n```\n```@import \"Employee.h\"\
    \n\n@implementation Employee\n\n@synthesize employeeNumber;\n@synthesize name;\n\
    @synthesize supervisor;\n@synthesize salary;\n...\n\nend```\n```\n\nThat's all\
