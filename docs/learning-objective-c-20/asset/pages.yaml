    myObject prolificAllocatorAndautoreleiser;\n```\n\n// Release the objects created\
    \ during this iteration\n\n```\npool release];}\n```\n\n# The Retainer and the\
    \ Retained Don't Know About Each Other\n\nThis is a subtle and often misunderstood\
    \ point: When Object A retains Object B, the two objects don't know about each\
    \ other in any meaningful sense. An object knows how many objects it is retaining.\
    \ The object doesn't have a list of pointers to the object that retains it. Similarly,\
    \ an object doesn't have a list of objects it has retained. There is nothing in\
    \ the language or runtime that does the equivalent of saying an object that is\
