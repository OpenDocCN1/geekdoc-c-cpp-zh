    This tells the compiler that currentGraphic is an instance of the AcmeComponent
    class or one of its subclasses and that it implements the <DrawableItem> protocol.


    > rarely seen. The whole point of protocols is that users of a conforming object
    don''t have to know anything about its class, only that it conforms to the protocol.


    # Properties and Protocols


    If some of your protocol methods are accessor methods, you can declare them in
    the protocol header using property statements. In the <DrawableItem> example,
    the protocol declaration might look like this:


    ```

    @protocol DrawableItem


    @required

    -(void) drawItem;

    @property (nonatomic, readonly) CGRect boundingBox;

    @property (nonatomic, retain) UIColor* color;


    @optional

    -(NSString) labelText;


    end

    ```


    Any class adopting the protocol would have to either synthesize the accessors
    corresponding to the properties or provide implementations for them, just as if
    the properties were declared in the class''s @interface section.'
