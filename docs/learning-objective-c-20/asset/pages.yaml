  md: 'Garbage Collection: The Practice


    # Garbage Collection: The Practice


    The actual implementation of Objective-C''s garbage collector is more sophisticated
    than the simple mark and sweep garbage collector described in the previous section.
    It is an example of a generational collector.


    In most programs, allocated objects are either temporary or last for an extended
    duration. A generational collector ensures that the most recently allocated memory
    is most likely to be garbage, and examines that memory first.


    To do this, the garbage collector breaks allocations into generations based on
    age. When the collector starts a generation, it places a write barrier between
    the new generation and the older generations, as shown in Figure 15.3.


    ![](img/d110604efa69713c226b60d57d6498f2_304_0.png)


    Figure 15.3 Collector generations


    The write barrier notices when you assign a pointer to an object in the new generation,
    to an instance variable of an object in an older generation, and records the assignment
    by marking the older object. In Figure 15.3, when you start a pointer to Object
    J into Object G, the write barrier marks Object G.The collector can then do a
    partial collection using the marked objects as a temporary root set and tracing
    references into the new generation. When the partial collection is finished, objects
    in the new generation that are still are promoted to the older generation and
    the process starts again with an empty new generation. The partial collections
    are much faster than a full collection that must scan all the memory under the
    collector''s control.


    > Note

    The write barrier is slightly misleading. The write barrier doesn''t prevent you
    from making any assignments. It only records pointer assignments that cross it.


    # Strong and Weak References


    Chapter 14 introduced the concept of strong and weak references. Under reference
    counting, an object forms a strong reference to another object by retaining it.
    This'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'ensures the retained object remains alive until the retaining object is finished
    with it and releases it. In contrast, an object forms a weak reference to another
    object by storing a pointer to the other object without retaining it. Weak references
    are used to prevent retain cycles and for patterns like caches where the referencing
    object doesn''t have problems if the referenced object deappears.


    The collector also makes a distinction between strong and weak references. The
    collector only traces strong references. Under garbage collection, merely storing
    a pointer to an object constructs no reference to that object. If an object is
    alive (reachable from the root set), object that it holds a pointer must also
    be alive. To create a weak reference (one that the collector will not follow),
    you must explicitly mark the variable used with this syntax; the `__weak` keyword
    can go before or after the type and before or after the declaration:


    ```

    weak SomeClass *weakInstances;

    SomeClass *weakInstances; // Equivalent

    SomeClass *__weakInstances; // Also equivalent

    ```


    When the collector collects an object held in a ____weak variable, it sets the
    variable to nil to prevent from inadvertently using a pointer to a deallocated
    object.


    # # Using Garbage Collection


    Using the Objective-C garbage collector is simple.You enable garbage collection
    by passing gcc the appropriate flag. If you are using Xcode, you do this in your
    target''s settings, as shown in Figure 15.4.


    The possible flags are:


    +   - No flag: Indicates the code to be compiled uses traditional retain/release
    reference counting and cannot be linked or loaded into an executable that uses
    garbage collection.

    - -fobjc-gc-only: Indicates that the code has only GC code and no retain/release.
    It cannot be linked or loaded into an executable that uses traditional reference
    counting.

    - -fobjc-gc: Indicates that the code is written with both traditional retain/release
    and GC memory logic. Code that supports both memory management models is used
    mostly for making frameworks that can be linked with either GC or non-GC executables.
    Dual mode is difficult to write correctly and you should avoid it unless you are
    making such frameworks. When dual mode is loaded into a program with GC, the runtime
    short circuits any retain, release, autorelease, retainCount, and dealloc messages;
    they are never delivered to the receiver.'
