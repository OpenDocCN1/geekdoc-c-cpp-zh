    # Pointers


    A pointer is a variable whose value is a memory address. It "points" to a location
    in memory.


    You declare a variable to be a pointer by preceding the variable name with * in
    the declaration.The following code declares pointerVar to be a variable pointing
    to a location in memory that holds an integer.


    ```

    int *pointerVar;

    ```


    The unary & operator ("address of" operator) is used to get the address of a variable
    so it can be stored in a pointer variable.The following code sets the value of
    the pointer variable b to be the address of the integer a:


    ```

    1 int a = 9;

    2

    3 int *b;

    4

    5 b = &a;

    ```


    +   - Line 1 declares a to be an int variable. The compiler reserves four bytes
    of storage for a and initializes them with a value of 9.

    - Line 3 declares b to be a pointer to an int.

    - Line 5 uses the & operator to get the address of a and then assigns a''s address
    as the value of b.


    Figure 1.1 illustrates the process. (Assume the compiler has located a beginning
    at memory address 1048880.) The arrow in the figure shows the concept of pointing.'
