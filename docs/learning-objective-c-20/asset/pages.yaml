  md: '# 2 More About C Variables


    When you write a program in most common scripting languages, you rarely have to
    spend much time thinking about variables. You create variables just by using them
    and you don''t have to worry about what happens to your variables when you are
    finished with them. The language''s interpreter takes care of all the details
    for you.


    When you code in a compiled language, life is not so simple.You must declare any
    variables that you use in your program by telling the compiler the type and name
    of each variable. The compiler then looks at the declared type of the variable,
    reserves the appropriate number of bytes, and associates the variable name with
    those bytes.


    In this chapter, we''ll look at the form of variable declarations in Objective-C
    and where the compiler arranges storage for different kinds of variables.


    # Memory Layout of an Objective-C Program


    To understand the material in the rest of the chapter, it''s helpful to know how
    an Objective-C program is arranged in memory. Figure 2.1 shows a simplified diagram
    of a running program''s virtual address space.


    | Stack |

    | (grows downward) |

    | Heap |

    | Data Segment |

    | Text Segment |


    Figure 2.1 The virtual address space of a running Objective-C program'
