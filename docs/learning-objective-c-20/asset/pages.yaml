    # # Dot Syntax


    With properties, Objective-C 2.0 also introduces a new syntax, called dot syntax,
    which is shorthand for calling accessor methods.


    Instead of writing code like:


    ```

    Employee *employee = // / ...


    int currentSalary = [employee salary];

    [employee setSalary: 100000];

    ```


    you can write:


    ```

    Employee *employee = // / ...


    int currentSalary = employee.salary;

    employee.salary = 100000;

    ```


    At runtime, the dot syntax is "syntax sugar." These two examples produce exactly
    the executable code.


    # # Syntactic Sugar


    ```

    (someArray + 2) = 17;

    someArray[2] = 17;

    ```


    The second form, which uses brackets, is syntactic sugar. It results in the same
    result as the pointer expression but it is easier to read.


    2. The order of method declarations in a header file has no effect on the resulting
    binary, for the sake of anyone looking at the file, related methods should be
    placed in close proximity. Unfortunately, like other ideals, not everyone lives
    up to this one.'
