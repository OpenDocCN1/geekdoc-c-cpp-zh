  md: "# Back to Convenience Constructors\n\nYou now have the means to design a convenience\
    \ constructor that does not cause memory management problems. The following code\
    \ shows the correct form of a convenience constructor for the Guitar class:\n\n\
    ```\n+ (Guitar*) guitar\n{\n    Guitar *newGuitar = [(Guitar alloc) init];\n \
    \   [newGuitar autorelease];\n    return newGuitar;\n}\n```\n\nThe autorelease\
    \ message balances the alloc message, so this method obeys the memory management\
    \ rules. Code that invokes the guitar method has an opportunity to retain the\
    \ returned object because the release message implied is not sent until the autorelease\
    \ pool is released at a future time.\n\n# Autorelease and the iPhone\n\nIf you\
    \ are writing an iPhone application, you should avoid using autorelease for large\
    \ objects. Objects sitting in an autorelease pool count toward your program's\
    \ footprint and contribute to a situation where your program provides a low memory\
    \ warning. Instead of using a class's convenience constructors (which generally\
    \ return autoreleased objects), you should allocate large objects directly with\
    \ alloc and release as soon as you are finished with them.\n\n# Using Extra Autorelease\
    \ Pools to Control Memory Usage\n\nThere are situations where it is useful to\
    \ create your own autorelease pools. If you have a method that creates and autoreleases\
    \ many objects, and you execute that method in a loop, objects accumulate in the\
    \ top-level autorelease pool, needlessly taking up memory until the loop exits\
    \ and the pool is released.\n\n```\nint j;\nid myObject = ...;\n\nfor (j=0; j\
    \ < MANY_TIMES; j++)\n{\n    // Do something that creates and autoreleases many\
    \ objects\n\n    [myObject prolificAllocatorAndAutorelease];\n}\n```\n\nIn situations\
    \ like this, you can reduce your program's memory footprint by providing a new\
    \ pool for each pass through the loop and releasing it at the bottom of the loop,\
    \ as shown here:"
