    # Messaging (Invoking a Method)


    Having objects isn''t much unless you can get them to do something for you. You
    need a way to get an to execute one of its methods. In some object-oriented languages,
    like Java and C++, method invocations are function calls that are associated with
    a particular object by appending the function call to the object variable with
    a period. If the Accumulator were written in C++, you would write something like
    this to add a number to anAccumulator''s total:


    ```

    anAccumulator-addTotal(137);

    ```


    Objective-C uses a different system, messaging that was borrowed from the computer
    language Smalltalk (http://en.wikipedia.org/wiki/Smalltalk). Using messaging,
    you send a message rather than calling a function. The following line shows the
    form of a message expression:


    ```

    [receiver message]

    ```


    The receiver is the object that you would like to execute a method. It''s called
    the receiver because it receives the message. The message is the name of the method
    that you want executed, plus any arguments to the method.When the message expression
    is evaluated, the receiver executes the method that corresponds to the name of
    the message (Chapter 5 explains how this is accomplished.).


    Using instance of the Accumulator class as an example, the following line of code
    adds 137 to anAccumulator''s total:


    ```

    [anAccumulator addTotal:137];

    ```


    The following line gets the current value of anAccumulator''s total and stores
    it in a variable named currentTotal:


    ```

    currentTotal = [anAccumulator total];

    ```


    At first, messaging may seem like just another way of writing a function. It''s
    not The difference is subtle but powerful. The receiver and the message are not
    together at compile time. The message only contains a method name. It does not
    associate that method name with any particular class or method implementation.
    Different classes may provide different implementations of the same method name.
    When the message is evaluated at execution time, the receiver object executes
    the version of the method that is defined in its class.'
