    Garbage collection solves the problem of retain cycles. As you saw in Chapter
    14, "Reference Counting," under reference counted memory management, it is possible
    for two or more objects to retain each other in such a way their reference counts
    can never fall to zero, even if no object outside the cycle retains them. As shown
    in Figure 15.2, cycles are not a problem under garbage collection.


