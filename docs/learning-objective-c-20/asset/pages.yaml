    # Malloc Zones


    Unlike of unified heap, OS X has one or more malloc zones. The first malloc zone,

    called the default malloc zone, is created at the time of the first call to malloc.
    The

    standard malloc function gets its bytes from the default malloc zone. It is possible
    to

    create additional malloc zones using the function malloc_create_zone.


    Using additional zones is an advanced technique that can be used in special cases
    to

    optimize performance. It allows you to define groups of frequently accessed variables
    adjacent

    memory locations or to release many variables at once (by releasing an entire
    zone).


    While not officially deprecated, Apple now uses zones other than the default

    malloc zone in Objective-C (see http://developer.apple.com/mac/library/DOCUMENTATION/

    Performance/Conceptual/ManagingMemory/Articles/Memoryalloc.html).


