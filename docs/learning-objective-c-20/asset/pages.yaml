  md: "The unfortunate state of affairs is called a retain cycle. It is the simplest\
    \ example of a retain cycle You can create much more elaborate retain cycles:\
    \ Object A retains Object B, which retains Object C, which retains..., which retains\
    \ Object A.\n\nThe only way to solve the problem is to change the code so that\
    \ at least one of the objects responsible for the retain cycle does not retain\
    \ the other. For example, change the property statement in the interface of RockStar\
    \ to the following:\n@property (nonatomic, assign) Band *band;\n\nBecause the\
    \ band object is no longer retained, you must also remove the [band release] statement\
    \ from the band's dealloc method. These changes break the cycle; the objects can\
    \ now be deallocated.\n\nAn object that holds a reference to another object without\
    \ retaining it is said to make a weak reference to that object. The normal case,\
    \ where an object holds an object in its instance variables, is called a strong\
    \ reference. Coding with a Band object is deallocated, it relinquishes its ownership\
    \ of the RockStar object held in its lead instance variable. If there is possibility\
    \ that the RockStar object will continue to exist after the Band is deallocated\
    \ (if, some other object also owns the RockStar), the Band's dealloc method should\
    \ be modified to set the RockStar's band variable to nil, as follows:\n\n```\n\
    (void)dealloc {\n  leadSinger setBand:nil;\n  leadSinger release;\n\n  super dealloc;\n\
    }\n```\n\nSetting the RockStar's band variable to nil prevents the Rockstar from\
    \ inadvertently using a pointer to a deallocated object.\n\nObjective-C has no\
    \ automatic way to detect retain cycles. When you have knowledge of the structure\
    \ of your classes, and do not create one. In most cases, one of the pair can be\
    \ considered the primary or parent object and the other can be considered the\
    \ secondary or child object. The primary object (the Band in the preceding example)\
    \ should retain the secondary object (the RockStar in the preceding example),\
    \ but the secondary object should not retain the primary object. When the primary\
    \ object is deallocated, it should release the secondary object and set the secondary\
    \ object's weak reference back to the primary to nil.\n\nMany Cocoa classes take\
    \ delegate objects, the convention is that an object does not retain its delegate."
