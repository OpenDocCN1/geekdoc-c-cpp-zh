  md: '# Runtimes, Old and New


    Apple provides two different versions of the Objective-C runtime: "legacy" and
    "modern".The legacy version is used for 32-bit OS X programs and the modern version
    is used for iPhone applications and 64-bit applications running on OS X 10.5 or
    later. As of this writing (January 2010), the name "legacy" is slightly premature:
    The majority of existing Mac applications are 32-bit programs.


    From a programmer''s point of view, the primary difference between the two runtimes
    is how they store instance variables. The legacy runtime stores instance variables
    in what amounts to a C structure. The modern runtime uses a different scheme and
    locates instance variables by name. This has two consequences: it lets you synthesize
    instance variables for declared properties and it solves the fragile base class
    problem.


    # Synthesized Instance Variables


    In code that you use the legacy runtime, you declare a property like this (see
    Chapter 12, "Properties");


    ```

    @interface Greeter : NSObject

    {

    NSString *greetingText;

    }

    @property (nonatomic, retain) NSString *greetingText;

    ...

    @end

    ```


    If you place the following line in the corresponding implementation section:

    @synthesize greetingText;


    the compiler creates the accessor methods greetingText and setGreetingText: for
    you. This saves you some typing. But if you have really tired fingers, you might
    complain'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Appendix D Runtimes, Old and New


    that it seems redundant to have to type NSString *greetingText twice, once in
    the instance variable declaration and once in the property statement.


    The modern runtime eliminates this extra typing. You can omit the instance variable
    declaration between the curly brackets and the compiler will automatically create
    the instance variable for you, using the specification in the property statement:


    ```

    @interface Greeter : NSObject

    {

    @property (nonatomic, retain) NSString *greetingText;

    }


    end

    ```


    ...


    When you synthesize the property greetingText, the compiler creates both methods
    and the instance variable. Again, this only works with the modern runtime. If
    you try to compile the preceding code for the legacy runtime, you will get the
    following


    error: synthesized property ''greetingText'' must be named the same as a compatible
    instance variable or must explicitly name an instance variable


    # Synthesized Instance Variables and Mac OS X Leopard (v10.5)


    There is one catch when using synthesized instance variables on Mac OS X Leopard
    (v 10.5):You can''t directly access a synthesized instance variable. The only
    way to access a synthesized instance variable is by using the synthesized accessor
    methods. This means you must use accessors even in init and dealloc methods:


    ```

    (void) dealloc

    {

    self.greetingText = nil;

    [super dealloc];

    ```


    In the preceding code, the synthesized setter sends a release message to the object
    currently held in. It also retains to nil, but that is harmless. This restriction
    also means that you cannot provide custom accessors for a synthesized instance
    variable (You can''t write an accessor for an instance variable that you can''t
    access).


    Formally, the property has been eliminated in Mac OS X Leopard (v10.6). Code compiled
    for the modern runtime on access synthesized instance variables directly. This
    allows you to create custom accessors for synthesized instance variables to replace
    one or both of the accessors created by the compiler in response to the @synthesize
    directive.You can also set the synthesized instance variable directly in init
    and dealloc.'
