  md: '# Copying Blocks


    One of the ways one uses blocks is to pass a chunk of work (some code some context)
    out of the current scope for processing at a later time. Passing a block to a
    function or method that you call is safe (as long as that function or method is
    going to execute on the same thread). But what if you want to pass a block to
    a different thread or pass block out of the current scope as a return value? When
    the current function or method returns, its stack frame is destroyed. Any blocks
    that were defined in its scope become invalid.


    To preserve a block, you must copy it. When you copy a block, the copy is created
    on the heap: The heap-based copy is safe to return up the stack to the calling
    function pass off to another thread.


    If you are coding in C, you can use the `Block_copy()` function, as follows:

    `int* (*doubleCopy)(int) = Block_copy(^int n){ ... });`


    In Objective-C, you can send a copy message to the block:

    `int* (*doubleCopy)(int) = [^(int n) copy];`


    The two preceding examples are equivalent. In either statement, you could use
    a block pointer of the block literal.

    When you copy a block, the new block gets copies of any automatic variables that
    the block references. (The block accesses variables by value. The value of the
    variable is copied into the block object when it is created.)


    # What About Block Variables?


    Block variables are accessed by reference. It wouldn''t be very useful to copy
    a block and then leave the copied block referring to a variable that is destroyed
    when the program execution leaves the current scope.

    To remedy this, when you copy a block, the compiler also moves any block variables
    to a location on the heap. The compiler updates any blocks that reference the
    block variable so they have the variable''s new address.

    One consequence of the compiler''s behavior in this situation is that it is very
    bad idea to take the address of a block variable and use it for anything. After
    the copy operation, the original address refers to a memory location that may
    now be garbage.


    # Memory Management for Blocks


    If you copy a block with `Block_copy()`, you must eventually balance that call
    with a call to `Block_release()`. If you use the Objective-C copy message and
    are using reference counting, you must balance the copy message with a `release`
    or an `autorelease`.'
