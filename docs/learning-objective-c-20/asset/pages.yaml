  md: "# Returning Objects\n\nThere is one situation where reference counting doesn't\
    \ work quite as smoothly as you might like. Imagine that the Guitar class has\
    \ a class method that returns instances of Guitar:\n\n```\n@interface Guitar :\
    \ NSObject\n{\n    // Instance variables\n}\n\n+(Guitar*) guitar;\n\n// Other\
    \ methods\n```\n\nThis type of method is called a convenience constructor. Convenience\
    \ constructors are very common in the Cocoaa frameworks. Your first impulse might\
    \ be to code the guitar method like this:\n\n```\n+ (Guitar*) guitar {\nGuitar\
    \ *newGuitar = [[Guitar alloc] init];\nreturn newGuitar;\n}\n```\n\nThe preceding\
    \ code creates and returns a properly initialized Guitar instance, but it has\
    \ a memory management problem: It creates a Guitar object with alloc, but it never\
    \ balances the alloc with a release. As it stands, the guitar method leaks the\
    \ allocated object.\n\n+   * Note\nYou might argue that the code that invokes\
    \ the guitar method and accepts the returned object should be responsible for\
    \ releasing the object. But that doesn't follow the rules. guitar doesn't begin\
    \ with \"alloc\" or \"new,\" or contain \"copy,\" so the invoker does not own\
    \ the returned object. If the invoking code takes ownership of the returned object\
    \ by sending a retain message, it would have to eventually balance a release.\
    \ But that release doesn't balance the alloc in the guitar method.\n\nA quick\
    \ attempt at a repair doesn't work:\n\n```\n- (Guitar*) guitar {\nGuitar *newGuitar\
    \ = [[Guitar alloc] init];\n[newGuitar release]; // WRONG!\nreturn newGuitar;\n\
    }\n```"
