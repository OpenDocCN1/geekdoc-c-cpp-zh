  md: '# @property Statement


    The form of a property declaration is:


    ```

    @property ( attributes ) type name;

    ```


    type and name are self-explanatory attributes describe how the accessors are coded,
    and are described in that subsections that follow.


    # assign, retain, copy


    These attributes affect how the synthesized setter is constructed. If you use
    assign, the setter simply assigns the new value to your property:


    ```

    myProperty = newValue;

    ```


    The assign is the only choice allowed for a non-object property.

    For an object property under reference counting, assign creates a weak reference
    (see Chapter 14, "Reference Counting").


    If you use retain and ask the compiler to synthesize your accessors, it creates
    a setter equivalent to the one shown in Listing 12.5 earlier in the chapter. Under
    garbage collection (see Chapter 15, "Garbage Collection\), retain is the same
    as assign and you don''t need to use it unless you are writing framework code
    that must work both reference counting and garbage collection.


    If you use copy and ask the compiler to synthesize your accessors, it creates
    a setter equivalent to the one shown in Listing 12.6.


    > Note

    To copy, the type of the property must be a class that can be copied. The class
    must adopt the NSCProtocol by implementing -copyWithZone: (See Chapter 6, "Classes
    and Objects").


    If you don''t explicitly assign, retain, or copy, the compiler assumes a default
    value of assign. This is not a problem for primitive types. However, for object
    properties under reference counting, you will get a warning if you don''t specify
    one of the three.


    How do you decide between copying and retaining? It depends on the design of your
    objects and what the properties represent. If the property is meant to be a snapshot
    of the current state of an object that is mutable, you should copy it.


    If the object used to set a property is meant to manage an entity itself rather
    than its current state, you should retain it. Imagine that the business system
    has objects with properties (hireDate, employeeOfMonth, ...) of type Employee.
    You don''t want to chase through the entire system to update all the copies of
    an employee if something (name, salary, ...) about the employee changes.


    Using retain (or assign if you want a weak reference) in this case ensures that
    all instance variables that are meant to hold a given employee refer to the same
    instance of Employee.'
  merge: -1
  pgno: 250
