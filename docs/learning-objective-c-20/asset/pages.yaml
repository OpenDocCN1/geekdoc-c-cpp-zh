    # Part I: Introduction to Objective-C


    +   - Chapter 1, "C, The Foundation of Objective-C," is a high-speed introduction
    to the essentials of C. It covers the parts of C that you are most likely to need
    when writing Objective-C programs.

    - Chapter 2, "More About C Variables," takes the review of C with a discussion
    of the memory location of C and Objective-C programs, and the memory location
    and lifetime of different variables. Even if you know C, you may want to read
    through this chapter. Many practicing C programmers are not completely familiar
    with the material contains.

    - Chapter 3, "An Introduction to Object-Oriented Programming," begins with an
    introduction to the concepts of object-oriented programming and continues with
    a first look at how these concepts are embodied in Objective-C.

    - Chapter 4, "Your First Objective-C Program," takes you line through a simple
    Objective-C program. It also shows how to use Xcode to create a project, and complete
    and run an Objective-C program. You can then use this knowledge to do the exercises
    in the remainder of the book.


    # Part II: Language Basics


    Objects are the primary elements of object-oriented programming; they group variables,
    instance variables, and function-like methods of code, called methods, into a
    single entity. *Classes* are the specifications for an object. They list the instance
    variables and methods that make up a given type of object and provide the code
    that implements them. Objects are more tangible; it is a region of memory, similar
    to a C struct, which holds the variables defined by the objects class. A particular
    object is to be an instance of the class that defines.


    +   - Chapter 5, "Messaging," begins the full coverage of the Objective-C language.
    In Objective-C, you get out to "do something" by sending it a *message*. The message
    is the name of the method plus any arguments the method takes. In response to
    the message, the object executes the corresponding method. This chapter covers
    methods, messages, and how the Objective-C messaging system works.

    - Chapter 6, "Classes and Objects," covers defining classes and copying object
    instances. It also covers inheritance, the process of defining a class by extending
    an existing class, rather than starting from scratch.


    Each class in executing an Objective-C program is represented by a piece of memory
    that contains information about the class. This piece of memory is called the
    class''s *class object*. Classes can also define *class methods*, which are methods
    executed on behalf of the class rather than an instance of the class.'
