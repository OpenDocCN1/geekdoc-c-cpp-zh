  md: '# Synthesized Instance Variables and the iPhone


    The iPhone uses a 32-bit version of the modern runtime, so you can use synthesized
    instance variables on the iPhone. However, there is one odd problem. You can only
    do this when you compile it for a device. The iPhone simulator runs on top of
    the legacy 32-bit desktop runtime. Synthesized instance variables won''t compile
    for the simulator.


    # The Fragile Base Class Problem—Solved


    Many object-oriented languages suffer from what is called the fragile base class
    problem. If you add methods or instance variables to a class, you must recompile
    any classes that derive from the class. This is probably of no consequence for
    classes that you change in your application code. Good practice requires that
    you make a clean compile before you release it a problem for framework providers.
    Imagine if you had to recompile all of them every time Apple wanted to change
    copies of any programs you didn''t create! People would be unhappy.


    The root of the fragile base class problem is a static (determined at compile
    time) memory layout for instance variables and methods. Because of Objective-C''s
    dynamic method dispatch, it has never suffered from the method of the fragile
    base class problem. You can also add methods without requiring subclasses derived
    from it to be recompiled. You can even add methods to a class at runtime (see
    Chapter 11, "Categories, Extensions, and Security")


    In the past, Objective-C framework providers used various tricks to get around
    the instance variable part of the problem: strategies like adding several instance
    variables reserved "future use" when a class is defined. The disadvantage is that
    you don''t know what instance variables you may need in the future. It also wastes
    memory as "future use" variables are not used. Another way of handling the problem
    is to provide a single extra instance variable that is a pointer to an NSMutableDictionary.
    The dictionary can be used to store additional values without changing the class
    at runtime.


    The modern runtime solves the instance variable part of the problem without any
    tricks. Because of the modern runtime locates instance variables, synthesized
    instance variables can be added to a class without requiring to recompile classes
    that are derived from it.'
  merge: -1
