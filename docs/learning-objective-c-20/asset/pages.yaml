    When an exception is raised, it is caught by the first @catch block (working upward
    in the stack from the point where the exception was raised), whose argument type
    matches the exception object type. The @catch block itself may throw an exception
    (either the original or a new one) that can be caught for further processing by
    another @catch block located higher on the stack.


    Note

    Any code in the @finally block corresponding to the original @catch block is executed
    before the new exception is handled.


    # What Types of Exceptions Are in the Frameworks?


    The application doesn''t have a comprehensive list of all the exceptions that
    the runtime and the Cocoa frameworks can raise. The exceptions that can be raised
    by various framework methods are described in the documentation for those methods.


