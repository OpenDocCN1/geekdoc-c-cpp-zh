  md: '# 14


    # # Reference Counting


    People who live in apartments have a storage problem: they have more stuff than
    places to put stuff. Solving this problem requires shuffling possessions in and
    out of storage lockers and periodically going through the apartment and throwing
    out things that are no longer needed. Memory usage is the computer science equivalent
    of the apartment-dweller''s problem.


    Memory management is important because memory is a limited resource. Although
    it is true that current computers can have amounts of physical memory than a few
    years ago the average program''s memory requirements and the users'' expectations
    have also increased. Keeping a program''s memory footprint as small as possible
    improves performance by reducing the chances that the computer''s virtual memory
    system will have to swap part of the program out to disk and later it back from
    the disk. This also improves the overall performance of the system by reducing
    contention for memory among all the running programs.


    Memory management is important on OS, however it is critical on iOS. iOS has virtual
    memory (every process has its own address space), but it does not have a full
    paging system (read-only pages of memory each program may be swapped, but there
    is no paging for writable areas of memory). In addition, the memory on many iOS
    devices is severely constrained. Early versions of the iPhone and iPod touch have
    128 MB of RAM (the iPhone 3GS has 256 MB). The OS and all Apple programs running
    may be 40 MB or less. When the remaining amount of unused memory drops below a
    threshold, the OS sends all the running apps a memory warning. It is expected
    that your app will respond to such a warning by releasing as much memory as it
    can. If you ignore the warning and the low memory condition, the OS will terminate
    your app.


    In Objective-C terms, management means tracking objects that have been created
    and freeing them when they are no longer needed. Objective-C 2.0 provides two
    alternate systems for memory management: reference counting (also called retaining
    or managed memory), and automatic garbage collection. Using retained memory, each
    object keeps a count of the number of other objects that it is using. When that'
