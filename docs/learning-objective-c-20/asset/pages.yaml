  md: 'Reference Counting 269


    In the world of Objective-C, reference counting, retain counting, and managed
    memory all refer to the same memory management system. They are different names
    for the same thing.


    # Memory Leaks


    A memory leak occurs when a program allocates memory from the heap and then does
    not return that memory to the heap when the program is finished with. Leaks waste
    a scarce resource system. The leaked bytes are not used for their original purpose,
    because they have not been returned to the heap, they are not available for any
    other use.


    A memory leak causes the memory footprint of a program to be bigger than it should
    be, with adverse implications for performance. The effects of a leak can range
    from insignificant, just a few bytes here and there, running the system out of
    memory and crashing the program, if the leak is inside a loop or the program executes
    for an extended period of time.


    # Reference Counting


    Reference counting is very simple in principle. Each object stores a count, called
    the retain count, of the other objects that are using it. When an object''s retain
    count becomes zero, the object is deallocated and its bytes are returned to the
    heap for possible reuse. The entire trick of reference counting is making sure
    you keep the retain count correct. This requires some work on your part. Reference
    counting is not an automatic system.


    When you create an object using alloc, its retain count is one. When you no longer
    need the object, you indicate that you are finished by sending the object a release
    message:


    ```

    [object release]

    ```


    The release message subtracts one from the object''s retain count. If the new
    retain count is zero, the object is dismantled and its memory is returned to the
    heap. This point is worth repeating: A release message does deallocate the receiver;
    it decrements the retain count. As you will see in the next section, there are
    situations where an object''s retain count is higher than one. The object is recycled
    to the heap only if the release message causes the retain count to fall to zero.


    The following code shows the simplest reference counting pattern:


    ```

    1 -(void)simpleMethod

    2 {

    3   NSMutableArray* array = [[NSMutableArray alloc] init];

    4

    5

    6   // Code that uses array goes here

    ```'
