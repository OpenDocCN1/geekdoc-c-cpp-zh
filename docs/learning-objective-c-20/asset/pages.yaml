    The main focus of this chapter has been to set and retrieve the values stored
    in an object''s instance variables using the Objective-C 2.0 declared property
    feature. The main points to remember about accessing instance variables and using
    properties:


    +   - You should access an object''s instance variables by using accessor methods
    to get the instance variable''s value.You shouldn''t access the instance variables
    directly from outside the object.

    - The @property statement lets you declare the accessor methods in a convenient
    shorthand format.'
