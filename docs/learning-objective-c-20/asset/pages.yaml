    \ that you want to be public in a normal header file.The methods that form the\
    \ class's private API go in a category file.\n\nYou then distribute only the public\
    \ header file to potential users of the class. But keep in mind that this is only\
    \ information hiding scheme. If someone discovers the name of a private method\
    \ by doing some snooping, there is nothing that you can do to prevent them from\
    \ calling it.\n\n+   - Finally, category header files (without corresponding implementation\
    \ files) can be used to declare internal protocols (see Chapter 13, \"Protocols\"\
    ).You use the category header to tell the compiler that the methods in the protocol\
    \ exist and are implemented in classes that adopt the protocol.\n\n# Category\
    \ Methods Are First-Class Citizens\n\nMethods that are defined in a category have\
    \ all the rights and privileges of methods defined in the class interface. In\
    \ fact, at runtime, there is no difference between the two. They have full access\
    \ to any of the class's instance variables. They are inherited if the class is\
    \ subclassed.\n\n# Extensions\n\nSuppose you're writing a class that other programmers\
    \ will use.You'd like to have some methods that are for your internal use only.\
    \ If you declare the methods in your class header file, they will be visible to\
    \ anyone using the class. Extensions let you declare methods—out of public view—by\
    \ adding an interface section in the class's implementation file. (Extensions\
    \ extend the interface declaration into the .m file).\n\nA common use for extensions\
    \ is to provide an internal setter method for an instance variable that you want\
    \ to be publicly read-only Listing 11.3 shows the header file for a class like\
    \ that. The class declares a getter for the instance variable readOnlyBool, but\
    \ it does not declare a setter method. This makes readOnlyBool effectively a read-only\
    \ variable (at least for those who do not go snooping; see Safety, in this chapter).\n\
    \nListing 11.3 ClassWithExtension.h\n\n```\n@interface ClassWithExtension : NSObject\n\
    \n{\n    BOOL readOnlyBool;\n}\n\n-(BOOL) readOnlyBool;\n\n@end\n```"
