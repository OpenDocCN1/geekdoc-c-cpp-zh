    Objective-C uses a more dynamic system called messaging. When you want to send
    an Objective-C object to execute one of its methods, you send the message. The
    object responds by executing the method that corresponds to the message.


    A message expression has the following form:


    ```

    [receiver message]

    ```


    The message expression is enclosed in square brackets. The receiver is the object
    that you want the receiver to execute. It receives the method. The message is
    the name of the method that you want the receiver to execute, plus any arguments
    that the method takes.


    ```

