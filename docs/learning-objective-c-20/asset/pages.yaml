    In the preceding example, the message is:

    setFillColor:newColor


    How does this work? When you execute a message expression, the Objective-C runtime
    examines the receiver and determines its class. The runtime has a table for each
    class that lists the methods and associates the name of each method with a pointer
    to the code that implements the method.The runtime takes the name of the message,
    finds the corresponding pointer in the receiver''s class table, and then uses
    the pointer to execute the receiver''s code. This process is discussed in more
    detail in the section Under the Hood, in this chapter.


