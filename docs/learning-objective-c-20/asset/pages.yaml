  md: '# @class Directive


    If you use a class type, such as Band or Guitar, in an instance declaration or
    a method declaration, you must inform the compiler that the type is a class. If
    that class''s interface is defined in any of the imported headers (a Cocoa framework
    header, the superclass header, or any header file that they, in turn, import),
    you don''t have to do anything. Otherwise, you need to use a @class directive.


    The RockStar class has variables of type Band and Guitar. RockStar doesn''t import
    Band.h or Guitar.h, so you need to put the following lines in the file:


    ```

    @class Band;

    @class Guitar;

    ```


    The @class directive, which must precede any use of the type being declared, is
    an example of a forward declaration. In this example, @class Band; tells the compiler
    that Band is a class, and something typed Band* is a pointer to a class, but it
    provides no other information about Band.

    Technically, in many cases, you could just cut down on compile times by reducing
    dependencies. Suppose that you import Band.h into RockStar.h. If you then make
    a change to Band.h, you have to recompile all the files that import RockStar.h,
    as well as all the files that import Band.h. If you use @class Band; instead,
    only the files that import Band.h need recompiling.


    +   - Using a @class directive is required in some cases. Imagine that the Band
    class has a leadGuitarist instance variable that is typed as a RockStar*;


    Now you have a case where RockStar needs to know that Band is a class and Band.h
    needs to know RockStar is a class. If you try to handle this by importing Band.h
    into RockStar.h, and importing RockStar.h into Band.h, the code will not compile.
    You must use a @class directive in at least one of the two header files.


    # The Implementation Section


    The implementation section contains the code that implements the class''s methods.
    The structure of an implementation section is very simple. It begins with a line
    containing an @implementation directive and the class name, and ends with an @end
    directive. You place all your method implementations between these two lines.


    Here is the RockStar class''s implementation file:


    ```

    #import "RockStar.h"

    #import "Guitar.h"

    ```'
