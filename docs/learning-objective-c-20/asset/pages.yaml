    \ before you go away!\"\n\nYou, the programmer, have to keep track of the allocs,\
    \ copies, and retains when coding, and balance them with a release or autorelease.\n\
    \n# retainCount\n\nNSObject implements the retainCount method, which returns the\
    \ current value of an object's retain count:\n\n```\nNSInteger retainainCount\
    \ = [object retainCount];\n```\n\nAt first, it seems like retainCount could be\
    \ useful for debugging memory problems. However, in a real program using the Cocoa\
    \ frameworks, framework-objects retain and release objects by passing them around\
    \ in arrays and dictionaries. The result is that an object's reported retain counts\
    \ are often higher than what you would expect from the object through your own\
    \ code. Also, some constant objects, such as NSString objects, may report meaningless\
    \ retain counts. In practice, the retainCount method is almost never helpful."
