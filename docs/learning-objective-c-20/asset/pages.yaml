- img_proc: true
  md: 'Both lines add 1 to the value of a. However, there is a difference between
    the two expressions if they are used as a part of a larger expression. The prefix
    version, ++a, increments the value of a before any other evaluation takes place.
    It is the incremented value that is used in the rest of the expression. a++, increments
    the value of a after other evaluation takes place. The original value is used
    in the rest of the expression. This is illustrated by the following example:


    ```

    int a = 9;

    int b;

    b = a++; // postfix increment

    ```


    ```

    int c = 9;

    int d;

    d = ++c; // prefix increment

    ```


    The postfix version of the operator increments the variable after its initial
    value has been used in the rest of the expression After the code has executed
    in this, the value of b is 9 and the value of a is 10. The prefix version of the
    operator increments the values of both c and d are 10.


    The decrement operators a-- and --- behave in a similar manner.

    Code that depends on the difference between the prefix and postfix versions of
    the operator is likely to be confusing to anyone but its creator.


    # Precedence


    Is the following expression equal to 18 or 22:


    2 * 7 + 4


    The answer seems ambiguous because it depends on whether you do the addition first
    or the multiplication first. C resolves the ambiguity by making a rule that it
    does multiplication and division before it does addition and subtraction;so the
    value of the expression is 18. The technical way of saying this is that multiplication
    and division have higher precedence than addition and subtraction.


    If you need to do the addition first, you can specify that by using parentheses:


    2 * (7 + 4)


    The compiler will respect your request and arrange to do the addition before the
    multiplication.


    > Note

    C defines a complicated table of precedence for all its operators (see http://en.wikipedia.org/wiki/Order_of_operations).
    But specifying the exact order of evaluation that you want by using parentheses
    is much easier than trying to remember operator precedence.'
