  md: "When Retain Counts Go Bad 283\n\n```\n(Guitar*) guitar\n{\n  return guitar;\n\
    ```\n\nBy convention, an object returned by a getter should remain valid until\
    \ the method that invoked the getter returns. In a multithreaded program, another\
    \ thread could cause the object held in guitar to be deallocated at any time after\
    \ getter returns. The original thread may not get a chance to retain the object.\
    \ Rewriting the getter to use the following pattern eliminates the problem:\n\n\
    ```\n(Guitar*) guitar\n{\n  @synchronized(self)\n  return [[guitar retain] autorelease];\n\
    }\n```\n\nSending a retain message followed by an autorelease message has no net\
    \ on the object's retain count, but by putting the object in the invoking thread's\
    \ autorelease pool, it delays the release message, giving the invoking code a\
    \ chance to retain the object. The @synchronized block is required to make sure\
    \ that another thread does not interrupt the pair of messages.\n\n+   Note\nThe\
    \ code shown in this section makes setting and getting an instance variable atomic\
    \ in a multithreaded environment. But making your accessors atomic won't make\
    \ your code thread-safe. Thread safety is more than just atomic operations; it\
    \ requires careful analysis and design. See http://developer.apple.com/mac/library/documentation/Cocoa/Conceptual/Multithreading/Introduction.html.\n\
    \n# When Retain Counts Go Bad\n\nRetain counting depends on following the rules\
    \ and balancing each object creation and retain message with an appropriate release\
    \ or autorelease message. What happens if you make a mistake? Under-releasing\
    \ an object causes a memory leak. The object is not deallocated when it should,\
    \ and its memory is returned to the heap.\n\nThe results of over-releasing can\
    \ be unpredictable and dire. If you send an object an extra release message, or\
    \ send a message to an object that you do not own, one release message causes\
    \ the object to be deallocated. When the program sends the next release message,\
    \ it is sending a message to a deallocated object. The result is usually a crash.\
    \ This type of problem can be difficult to hunt down if the correct release and\
    \ the spurious release are sent in widely separated sections of the code."
  merge: -1
  pgno: 294
