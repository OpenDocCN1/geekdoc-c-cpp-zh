    # Overriding Methods with Categories


    You can use a category to override a method declared by a class:


    +   - There are some subtleties and dangers in doing this. Unless you are very
    sure know exactly the method works in all situations and where the method is used,
    you may risk breaking something.

    - When you use a category to override a method, the new version replaces the original.
    There is no way for the category to call the original method. But, if the original
    version was not an override of a superclass version, the category version can
    still call the superclass version of the method via auper.

    - You can have as many categories as you like for a class, but each category has
    a distinct name.

    - You can''t use a category method to override another category method. If you
    declare methods with the same name in different categories, it doesn''t cause
    a compiler or linking error, but the version of the method that is used depends
    on the order in which the categories are loaded.


    # Use a Category or a Subclass?


    As Crumb'' Mr. Natural would say, "Get the right tool for the job!" But what is
    the right tool? Because jobs vary, I can''t give you a definite answer. But here
    are some things that you should consider:


    +   - Simple is good. If a category method of a class can make the code more difficult
    to maintain.


    http://en.wikipedia.org/wiki/Mr_Natural_(comics)'
