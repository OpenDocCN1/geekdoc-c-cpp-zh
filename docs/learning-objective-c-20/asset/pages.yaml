    the greeting and a method that issues the greeting. (The method should take the
    greeting as an argument and log it).

    Package up the greeting as an NSInvocation and pass it to the `Greeter` object.

    The `Greeter` should then issue the greeting by sending the invocation object
    the—`invoke` method.

    3. Write a program that uses some simple blocks and verify for yourself that:

    * The value for an ordinary automatic value that a block sees when execution passes
    over the block literal, is unchanged if the variable is changed later in the code.

    * A block cannot modify the value of an ordinary automatic variable in its scope.

    * A block can both read and set a variable declared with the `__block` type modifier.'
