  md: '# Resources for Objective-C


    # Apple Resources


    If you are developing for Mac OS or iOS, you should become a registered Apple
    Developer (http://developer.apple.com/programs/register/). The registration is
    free. Registering as an Apple Developer allows you to download Xcode and the iPhone
    SDK. It also allows you to access Mac and iPhone documentation, sample code, and
    Apple''s online bug reporting system.


    Apple also has two paid programs, the Mac Developer Program (http://developer.apple.com/programs/mac/)
    and the iPhone Developer Program (http://developer.apple.com/programs/iphone/).
    Each program costs $99 per year.


    The Mac Developer Program includes pre-release Mac OS X software, videos, access
    to Apple Developer Forums and two Technical Support Incidents. Technical Support
    Incidents give you support from engineers on Apple''s Developer Technical Support
    team.


    The iPhone Developer Program provides videos, documentation, access to Apple Developer
    Forums, and two Technical Support Incidents. It also lets you install apps on
    an iOS device and submit apps for the iPhone App Store.


    > Note

    The free Apple Developer Program allows you to use the iPhone SDK to develop apps
    and test them on the iPhone device. To test apps on an iPhone device and sell
    apps in the App Store, you must apply for, and be accepted into, the iPhone Developer
    Program.


    Apple also has a number of mailing lists. The ones that are most useful for Objective-C,
    Cocoa, and Xcode:


    +   - http://lists.apple.com/mailman/listinfo/objc-language

    - http://lists.apple.com/mailman/listinfo/cocoa-dev

    - http://lists.apple.com/mailman/listinfo/xcode-users


    Although it isn''t part of their official duties, a number of the Apple engineers
    read and post on these lists.'
