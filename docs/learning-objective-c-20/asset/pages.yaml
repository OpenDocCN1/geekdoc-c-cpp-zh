  md: '# The Final Goodbye: When Programs Terminate


    When a program terminates, all the system resources the program used are reclaimed
    by the operating system. The virtual memory pages that any memory used or allocated
    go back to the operating system''s free list. The bad effects of forgetting to
    release a block of memory do not persist beyond the execution of a program. Because
    of this, dealloc methods of any object are called when the program terminates
    may never be called. Everything is disappearing anyway—there is no need to go
    through the unwinding of an object graph and releasing each object individually.
    But there is a trap here: if you are in the habit of doing other kinds of cleanup
    in dealloc methods, the code for these cleanups may never be called.


    For example, suppose you have code that is supposed to write code that state some
    information to a child like when it is created. If you put that code into some
    dealloc methods, you may be pleasantly surprised: The code will never be executed.


