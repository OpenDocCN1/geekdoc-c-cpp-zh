    # Controlling When Collections Occur


    The garbage collector is automatic. It decides when running using an internal
    algorithm that looks at the current memory usage. However, in situations where
    you know from your program logic that there are a large number of garbage objects,
    you can help the collector function more efficiently by asking it to do a collection.


    You can access the collector through the singleton Foundation class NSGarbageCollector,
    as shown here:


    ```

    NSGarbageCollector* collector = [NSGarbageCollector defaultCollector];

    ```


    If you have created a large number of temporary objects that you are finished
    with, you can send a hint to the collector using the collectIfNeeded method:


    ```

    [collector collectIfNeeded];

    ```


    If you have a large group of older objects that have now become garbage—for example,
    by closing a document in a document-based application—you can ask the collector
    to do a full collection:


    ```

    [collector collectExhaustively];

    ```


    The collector must temporarily stop any whose memory it is collecting. If your
    code has a time-critical section that you don''t want to interrupt, you can temporarily
    turn the collector off and then restart it:


    ```

    [collector disable];

    [collector enable];

    ```


    Make sure you are not allocating excessive numbers of objects while the collector
    is off, and remember to turn the collector back when you exit the critical section
    of your code.


    # Finalizers


    There is one significant difference between classes designed to work with reference
    counting, and classes designed for garbage collection. Objects have a dealloc
    method that is called when the object''s reference count goes to zero. The dealloc
    method typically releases any objects the displaying object has retained. Objective-C
    programmers have historically used dealloc to perform any cleanup work before
    an object is deallocated. This includes tasks like releasing resources blocks
    of memory and file descriptors or closing network connections. Under garbage collection,
    there is no dealloc method. (If a class with a dealloc method is used in a GC
    program, the method is never called.)'
