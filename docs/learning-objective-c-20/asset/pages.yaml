    # Memory Management


    Whenever you allocate memory on the heap, you are responsible for returning that

    memory when it is no longer needed. If you allocate a chunk of memory using malloc,

    y must free it when you are finished with it. Objective-C uses a slightly different
    system

    for managing object memory called retain counting (also called retain counting
    or

    managed memory). Each Objective-C object has a retain count, which tracks the
    number of

    places the object is used. When an object''s retain count drops to zero, the object
    is

    deallocated and its bytes are returned to the heap.


    The methods retain and release increment and decrement an object''s retain count


    ```

    [object retain]; //Increments object''s retain count

    [object release]; //Decrements object''s retain count

    ```


    Objects are created with a retain count of one. If you create an object with a
    method

    whose name begins with alloc or new, or contains the word copy, "you own the object.

    When you are finished with it, you must balance its creation and relinquish your\ownership
    by sending a release message. If you receive an object from a method

    name does not begin with alloc or new, or contains the word copy, "you do not

    own the object. In many circumstances, the object will remain valid for the remainder
    of

    life—for example, by storing it in an instance variable—you must take "ownership"
    of the object by

    sending a retain message. This prevents the object''s retain count from falling
    to zero if the

    object''s creator releases it. You eventually balance the retain count by sending

    a a release message when you are finished with it.


    For a complete treatment of the type of memory management discussed in this section,
    see Chapter 14, "Reference Counting.". For a description of an alternate system
    of

    memory management called garbage collection, see Chapter 15, "Garbage Collection."'
