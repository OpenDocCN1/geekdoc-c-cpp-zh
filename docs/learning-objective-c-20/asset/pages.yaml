    # typedef


    The typedef declaration provides a means for creating aliases for variable types:

    typef float Temperature;

    Temperature can now be used to declare variables, just as if it were one of the
    built in types:

    Temperature high, low;

    ttypedef provide alternate variable names for types. Here, high and low are still
    floats. The term typedef is often used as a verb when talking about C code, as
    in "temperature is typedef to float".


    # Enumeration Constants


    An enum statement defines you a set of integer constants:

    enum woodwind { oboe, flute, clarinet, bass };

    The result of the previous statement is that oboe, flute, clarinet, and bass are
    constants with values of 0, 1, 2, and 3, respectively.

    If you don''t like going order from zero, you can assign the values of the constant
    yourself. Any constant without an assignment has a value one higher than the previous
    constant:

    enum woodwind { oboe=100, flute=150, clarinet, bass=200 };

    The preceding statement changes oboe, flute, clarinet, and bass are now 100, 150,
    151, and respectively.

    The name after the keyword enum is called an enumeration tag. Enumeration tags
    are optional. Enumeration tags can be used to declare variables:

    enum woodwind soloist;

    soloist = oboe;'
