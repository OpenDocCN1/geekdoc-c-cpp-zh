    # NSString


    In C plain is an array of bytes representing characters, followed by a NULL (zero)
    byte. The NULL byte is an on-the-cheap way of determining the string ends. A C
    string has no other structure.


    C strings work well for simple tasks, but the lack of any real structure makes
    them prone to all sorts of problems and mischief—buffer overflows, unexpected
    zero bytes in what is posted to be, forgetting to leave room for the NULL byte—and
    are generally painful to use for any kind of string processing.


    Foundation bypasses C strings (and their associated objects) by creating a string
    class, NSString. There are two types of NSString literal NSStringStrings that
    are constant objects created by the compiler, and ordinary NSString objects that
    are allocated like Objective-C objects.


    You create a literal by placing your text between double quotes and prefixing
    it with:


    ```

    NSString *str = "Hello";

    ```


    The preceding line declares a pointer to an NSString and initializes it with the
    address of a constant NSString with the text "Hello".

    Aside from literal, you can create NSString objects by the usual init sequence,
    or by using one of NSString''s many convenience constructors. The following example
    uses a convenience constructor to create an NSString from characters stored in
    a file.


    ```

    NSString *textFile =

    [NSString stringWithContentsOfFile:@"Users/you/textfile.txt"

    encoding:UTF8StringEncoding

    error:NULL]; // Ignore errors for now

    ```'
