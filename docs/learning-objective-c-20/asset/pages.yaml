  md: 'Chapter 14 Reference Counting


    # NSZombie


    One way to track down over-release problems is to use Foundation''s NSZombie feature.
    When NSZombie is enabled, objects that are deallocated are not returned to the
    heap. Instead, they are turned into NSZombie objects. NSZombie objects log any
    messages that are sent to them. You can also add a debugger break point on [NSZombie
    release autorelease]. This allows you to see where the extra release is coming
    from.


    To enable NSZombie, you must set an environment variable NSZombieEnabled to YES.
    The easiest way to do this is with Xcode. In the left pane of your project window,
    double-click the name of your executable (hint: it says (executable)). When the
    executable pane appears, select the Arguments pane. Use the plus (+) button under
    the Variables to be set in the environment. Set the name of the new variable to
    NSZombieEnabled and set its value to YES, as shown in Figure 14.3.


    ![](img/d110604efa69713c226b60d57d6498f2_295_0.png)


    Figure 14.3 Enabling NSZombie in Xcode'
