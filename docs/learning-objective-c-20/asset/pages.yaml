  md: '# 3


    # An Introduction to Object-Oriented Programming


    ![](img/d110604efa69713c226b60d57d6498f2_74_0.png)


    The earliest high-level computer languages, such as Fortran, COBOL and C, are
    procedural. The natural organization of a program written in a procedural language
    is a series of sequential tasks to execute. Procedural programming is eminently
    suitable for some types of problems—such as solving mathematical equations. However,
    there are many types of problems—for which procedural interface programming is
    not a good fit. In many areas of computing today, the dominant paradigm is a different
    one, called object-oriented programming. Objective-C is an example of an object-oriented
    language. It adds constructs and syntax to support object-oriented programming
    to C.


    This chapter begins with an introduction that describes the fundamentals of object-oriented
    programming. The following section illustrates how these concepts are implemented
    in Objective-C. The final section of the chapter lists the additions that Objective-C
    makes to the language.


    # Object-Oriented Programming


    Object-oriented programming is a style of programming that organizes programs
    into collections of objects that interact with each other. An object is a group
    of related variables that models something in your problem space, and procedures,
    called methods, represent the actions that the object knows to perform. Objects
    communicate by sending and receiving messages. A message to an object is a request
    to the object, asking to execute one of its methods.


    As an example, a drawing program might have a shape object to represent free-form
    shapes (such as those shown in Figure 3.1) that a user can draw on the screen.
    A shape object would have variables to store the points that define its outline,
    its color, and its position in the drawing. It would have methods to set and retrieve
    those quantities and a method to draw itself on the screen. To draw the shape
    on the screen, you would send the Shape draw message. In response, the Shape would
    execute its draw method (which contains the code to draw the actual drawing).'
