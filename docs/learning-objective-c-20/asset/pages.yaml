  md: 'These are the important things to remember about automatic variables:

    * Automatic variables are created on the stack. They are only valid from the point
    where they are declared to the end of the function (see S돋, later in the chapter).
    When the function returns, the system moves the stack pointer back to the bottom
    of the previous frame. Subsequent calls will create new frames and most likely
    overwrite the memory locations assigned to earlier functions'' automatic-variables.
    If you call `average()` with the arguments 10.0 and 12.0, the variable `average`
    has the value 11.0 when you call the `printf` statement. If you call `average()`
    again, at a later time, `average` is unlikely to assign them a 11.0 at the top
    of the routine


    +   * Automatic variables are not initialized by the stack. Until you assign them
    a value, they contain random junk left in memory location from the last time it
    was used.


    +   * Automatic variables are associated with a single call of a function. If
    you have recursive code where a function calls itself, each call of the function
    has its own stack frame and in one copy of the automatic variables. Changing the
    value in one call will not change its value in any of the other calls on the stack.


    +   * Taking the address of an automatic variable with the `&` operator and assigning
    the address to a pointer variable outside of the function is a very bad idea—thethe
    pointer variable points to junk as soon as the function exits.


    > Note

    Automatic variables are automatic in the sense that their storage is allocated
    on the stack when you call the function they are used. However, you still have
    to tell the compiler about them with a declaration.


    # Function Parameters


    Function parameters are essentially automatic variables that have been initialized
    with the values supplied when the function was called. They are created on the
    stack and become invalid when the function returns. You can reset their value
    in the function body, but as noted in the previous chapter, changing their value
    has no effect on the corresponding variables in the calling function.


