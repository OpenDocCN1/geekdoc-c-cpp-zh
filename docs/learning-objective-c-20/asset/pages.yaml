  md: '# Exceptions


    Exceptions are abnormal conditions that prevent a program from continuing execution.
    Creating an exception is referred to as raising an exception or throwing an exception.
    Common situations that will have an exception are actions like sending a message
    to an object that does not respond to it or attempting to retrieve an object from
    an array that is outside the bounds of the array. If you do not handle an exception,
    the exception causes the program to terminate.


    Objective-C provides a mechanism to handle exceptions with the compiler directives
    @try, @catch, and @finally. Each of these introduces a block of code as shown
    in Listing 10.2.


    > Note Versions of Mac OS X prior to 10.3 do not support exceptions. If you do
    them, your program will only run on Mac OS X 10.3 or later.


    Listing 10.2 Exceptions/SimpleExceptionHandler.m


    ```

    1 id hamburger = @"hamburger";

    2

    3 @try

    4 {

    5 hamburger = [hamburger addCheese];

    6 }

    7 @catch(NSException *exc)

    8 {

    9 NSLog(@"Exception: %@ %@", [exc name], [exc reason]);

    10 }

    11 @finally

    12 {

    13 NSLog(@"#this block is always executed.");

    14 }

    ```


    The code that might cause a problem in the @try block. In Listing 10.2, executing
    the line:


    hamburger = [hamburger addCheese];

    rises an exception in this example hamburger is an NSString and NSString does
    not implement the method addCheese.

    The @catch block catches the exception. Exceptions are always thrown with an @exception
    object, which becomes the argument to the @catch block. The runtime and the Cocoa
    frameworks use instances of the class Exception. Here, the @catch block just uses
    information from the Exception object to log the exception.'
  merge: -1
  pgno: 220
