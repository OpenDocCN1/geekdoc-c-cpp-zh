    Postponing decisions until run time has many advantages, as you will see as you
    read this book, but it has one important drawback. It limits the amount of checking
    that the compiler can do. When you code in Objective-C, some errors, which would
    be caught at the compile stage in other languages, only become apparent at run.


    # About Memory Management


    As noted, Objective-C 2.0 offers you the choice between using manual reference
    counting system or automate garbage collection for managing object memory. With
    the exception of Chapter 15, which covers Objective-C 2.0 garbage collection system,
    this book uses reference counting from the beginning in all of its examples. It
    provides a complete treatment of reference counting in Chapter 14.


    The primary reason for this is that garbage collection is not available on iOS.
    If you want to write programs for the iPhone, the iPad, or the Mac, you must use
    Objective-C reference counting system.


    Judging from the countless Objective-C and Cocoa mailing lists, reference counting
    is probably the greatest source of confusion among people learning Objective-C.
    But if you learn its rules early and apply them uniformly, you will discover that
    reference counting isn''t really difficult.


    If at later you want to use garbage collection for a project, the transition should
    be relatively painless. Although there are architectural issues that you need
    to be aware of when moving from reference counting to garbage collection (which
    are covered in Chapter 15), much of using garbage collection simply consists of
    not doing things that you have to do when using reference counting.


