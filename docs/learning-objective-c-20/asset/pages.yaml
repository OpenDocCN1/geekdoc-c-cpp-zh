  md: 'Evaluating an expression can cause side effects. The most common side effects
    are the change in the value of a variable by an assignment, or the execution of
    the code in a function due to a function call.


    Expressions are used for their value in various control constructs to determine
    the flow of a program (Program Flow). In other situations, expressions may be
    evaluated only for the side effects caused by evaluating them. Typically, the
    point of an expression is that the assignment takes place. In a few situations,
    both the value and the side effect are important.


    # Statements


    When you add a semicolon (;) to the end of an expression, it becomes a statement
    This is similar to adding a period to a phrase to make a sentence in a natural
    language. A statement is the code equivalent of a complete thought. A statement
    is finished executing when all of the machine instructions result from the compilation
    of the statement have been executed, and all of the changes to any memory locations
    the statement effects have been completed.


    You can use a sequence of statements, enclosed by a pair of brackets, any place
    where you can use a single statement:


    ```

    timeDelta = time2 - time1;

    distanceDelta = distance2 - distanceDelta;

    averageSpeed = distanceDelta / timeDelta;

    ```


    There is no semicolon after the closing bracket. A group like this is called the
    compound statement or a block. Compound statements are very common with the control
    statements covered in the next sections of the chapter.


    Note


    > The use of block as a synonym for compound statement is pervasive in the C literature
    and dates back to the beginnings of C. Unfortunately, Apple has adopted the name
    block for its addition of closures to C (see Chapter 16, "Blocks"). To avoid confusion,
    the rest of this book uses the slightly more awkward name compound statement.


    # Program Flow


    The statements in a program are executed in sequence, except when directed to
    otherwise by a for, while, do-while, if, switch, or goto statement or a function
    call.


    +   - An if statement conditionally executes code depending on the truth value
    of an expression.'
