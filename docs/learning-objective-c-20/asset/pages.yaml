    ```


    The preprocessor will replace every occurrence of MAX_VOLUME in the file being
    com-

    piled with 1. A #define can be continued on multiple lines by placing a backslash

    \ at the end of all but the last line in the definition.


    > Note

    If you do this, the \ must be the last on the line. Following the \ with something
    else

    (such as a comment beginning with /*) results in an error.


    A frequently used pattern is to place the #define in a header file, which is then

    included by various source files. You can change the value of the constant in
    all the

    source files by changing the single definition in the header file. The traditional
    C naming

