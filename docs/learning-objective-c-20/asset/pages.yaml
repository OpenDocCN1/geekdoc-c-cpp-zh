  md: "The preceding code balances the alloce with a release, but it creates a much\
    \ bigger problem. The release drops newGuitar's retain count to zero, causing\
    \ it to be immediately deallocated. What is returned is a pointer to a now non-existent\
    \ object. The stale pointer causes a crash when it is referenced.\n\nFixing this\
    \ problem requires Objective-C autorelease mechanism, which is described in the\
    \ next section.\n\n# Autorelease\n\nThe problem convenience constructor, or a\
    \ similar method, faces is that it creates an object, but it has no way to track\
    \ that object and no way to balance the creation by sending it an autorelease\
    \ at an appropriate time.\n\nObjective-C solves this problem with the autorelease\
    \ mechanism. Autorelease is a way of handing an object to a trusted third party,\
    \ or called an autorelease pool, for release at an appropriate time. The name\
    \ is a bit of a misnomer; it should really be called delayedrelease.\n\n# Autorelease\
    \ Pools\n\nAutorelease is implemented using the Foundation class NSautoreleasePool.\
    \ To use autorelease, you create an instance of NSautoreleasePool:\n\n```\nNSautoreleasePool*\
    \ pool = [[NSautoreleasePool alloc] init];\n```\n\nThe preceding line of code\
    \ allocates pool and informs the runtime that the pool is the current autorelease\
    \ pool. When you send an object autorelease message, the object is placed in the\
    \ current autorelease pool:\n\n```\n[object autorelease]; // Places aObject in\
    \ the current pool\n```\n\nThe autorelease method returns the object as return\
    \ value. This allows an autorelease message to be nested with other messages or\
    \ used as the argument of a return statement:\n\n```\nSomeClass *autoreleaseObject=\n\
    \    [[SomeClass alloc] init];\n```\n\nThe preceding code creates an object created\
    \ by {[SomeClass alloc] init} is an autorelease message. The return value of the\
    \ autorelease message is the original object, which is stored in the variable\
    \ autoreleasedObject.\n\nSending an object autorelease message is just a form\
    \ of registration. It adds the object to the pool's list of objects, but it does\
    \ not cause any messages to be sent to the object. After the autorelease message\
    \ is executed, the receiver is fully alive and valid.\n\nSending an autorelease\
    \ pool a release message deallocates the pool and sends every object in the pool\
    \ [pool release];"
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Some key points about *autorelease*:


    +   - Sending an *autorelease* message to an object that you own fulfills your
    contract to eventually relinquish ownership of that object. An *autorelease* is
    a *release*;

    - it''s just one that happens in the future.


    +   - It is possible to send an object multiple autorelease messages. *When the
    autorelease pool is released, such an object receives multiple *release* messages;
    for each time it was autoreleased.*\n- Releasing an autorelease pool does not
    necessarily mean all the objects in the pool are deallocated. The objects in the
    pool are each sent a *release* message. If that *release* causes an object''s
    retain count to go to zero, that object is deallocated.


    # Managing Autorelease Pools


    The runtime maintains a stack of autorelease pools. Creating a pool pushes it
    on to the stack; releasing a pool pops off the stack. Objects receiving an autorelease
    message are placed in the pool at the top of the stack.


    > Note

    You cannot release an autorelease pool. Sending a message to an autorelease pool
    raises an exception.


    Calling autorelease on an object with no pool on the stack is a mistake. The runtime
    will complain to you, because the lack of an autorelease pool causes a memory
    leak; the program will continue executing. A message like the following is written
    to the console log (and the terminal if it is a command line application):


    ```

    NSAutoreleasePool(): Object 0x60000150 of class Guitar

    autoreleased in place -= just leaking

    ```


    If you are writing a GUI program, the AppKit or UIKit creates autorelease pools
    for you. GUI programs have an event loop. The event loop waits for some user interaction
    (a mouse click or keyboard, for example), packages information about the interaction
    as an event, and distributes the event to other parts of the program. The loop
    returns to the top and waits. The AppKit (or UIKit on iPhone) creates an autorelease
    pool at the beginning of each pass through the event loop (which pushes the pool
    onto the stack), and releases the pool (which pops it off the stack and sends
    a release message to all the objects in the pool) at the end of the pass. Figure
    14.2 shows the lifecycle of an object created and autoreleased during one pass
    through the event loop. The object''s life can be extended if another object retains
    it before the bottom of the event loop.'
  merge: -1
