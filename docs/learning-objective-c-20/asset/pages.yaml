  md: '# Classes and Objects


    Objects are the basis for object-oriented programming. This chapter gets down
    to the business of making objects. The chapter is divided into five main sections:


    +   * Defining classes

    * Extending classes by subclassing

    * Creating objects (instances of a class)

    * Destroying objects

    * Copying objects


    Some of these topics were covered briefly in Chapter 3, "An Introduction to Object-Oriented
    Programming."They are presented here in greater detail.


    # Defining a Class


    When you define an Objective-C class, you have to provide the compiler with two
    sets of information. The first set is essentially a blueprint for the constructing
    instances of the class. You have to specify the class name, the class''s superclass,
    a list of the names and types of the class''s instance variables, and finally
    the declarations of the class''s methods. The second set of information is the
    code that implements the class''s methods. The first goes in the class section.
    The second goes in the class''s implementation section.


    The sections are normally placed in separate files, both named after the class.
    If you were defining a Guait class, you would put the interface section in a header
    file named Guait.h and the implementation section in a file Guait.m.


    # The Interface Section


    Imagine that you are going to create a RockStar class for a simulation game. A
    RockStar instance does all the usual star things: sing, play guitar, trash hotel
    rooms. The interface section for RockStar looks like this:'
