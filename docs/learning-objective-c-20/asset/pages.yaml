  md: "# attributes and @dynamic\n\nIf you provide your own implementation of the\
    \ accessor methods, the compiler does not check to see that the methods you supply\
    \ agree with the attributes in the corresponding @property declaration. It silently\
    \ lets you unwhome things such as assign to a property that you have declared\
    \ copy, or provide a setter method for a property declared as readonly.\n\n# More\
    \ About @dynamic\n\nThe opposite of @synthesize is @dynamic. When you specify\
    \ @dynamic for a property, the compiler expects you to supply your own implementation\
    \ of the methods for that property. If you don't, you'll get a warning at compile\
    \ time, and then an error at runtime when you try to use the property.\n\nWhy\
    \ would you want to write the accessor methods when the compiler can do the work\
    \ for you? The compiler synthesizes relatively simple accessors that just set\
    \ and return the property. Sometimes you need to do more. You might need to take\
    \ some actions when property is set. For example, you might want to filter the\
    \ input to make sure the property being set stays within an acceptable range.\n\
    \nConsider a property that holds the volume setting for a speaker:\n\n```\n#define\
    \ kMaxVolume 1.0\n#define kMinVolume 0.0\n{\nfloat speakerVolume;\n}\n@property\
    \ (atomic, assign) float speakerVolume;\nIf the acceptable values run from 0.0\
    \ to 1.0, you can write a setter that clamps the new value to that range:\n-(void)setSpeakerVolume:(float\
    \ newVolume)\n{\n    // protect against out of range input\n    if (newVolume\
    \ > kMaxVolume) {\n        speakerVolume = kMaxVolume;\n    }\n    else if (newVolume\
    \ < kMinVolume) {\n        speakerVolume = kMinVolume;\n    }\n    else {\n  \
    \      speakerVolume = newVolume;\n    }\n}\n```"
  merge: -1
  pgno: 252
- img_proc: true
  md: "# More About @dynamic 239\n\nAnother reason to code your own accessors is that\
    \ there might not be an instance variable corresponding to a property. Properties\
    \ are actually a generalized description of an object's public interface. They\
    \ represent the characteristics or state of an object. Properties don't necessarily\
    \ specify the internal structure. Properties are usually stored in instance variables\
    \ (and most of the discussion in this chapter focuses on this case), they don't\
    \ have to be. They could be stored in a helper object that your object owns, stored\
    \ in a file, or even calculated on-the-fly. It doesn't matter as long as the getter\
    \ returns the property and the setter (if there is one) sets it.\n\nHere's an\
    \ example where the property returned by the getter is calculated. Consider a\
    \ RestaurantEmployee class.\n\n```\n@import <Foundation/Foundation.h>\n\n@interface\
    \ RestaurantEmployee : NSObject\n{\n  int age;\n  ...\n\n  @property (nonatomic,\
    \ assign) int age;\n  @property (nonatomic, readonly) BOOL canServeBeer;\n  ...\n\
    \n@end\n```\n\nIn some places, there is a law that an employee must be above a\
    \ certain age to serve alcohol, so you should define a read-only Boolean property\
    \ canServeBeer in its own instance variable; You don't have to actually store\
    \ canServeBeer in its own instance variable; you can compute it from the age variable\
    \ \"RestaurantEmployee\"\n\n```\n@import \"RestaurantEmployee.h\"\n```\n\n```\n\
    @implementation RestaurantEmployee\n\n-synthesize age;\n@dynamic canServeBeer;\n\
    -(BOOL)canServeBeer\n{\n  if ([self age] >= 21) {\n    return YES;\n  else\n \
    \   return NO;\n}\n...\n@end\n```"
  merge: -1
  pgno: 253
- img_proc: true
  md: "Chapter 12 Properties\n\n# # Properties and Memory Management\n\nUsing properties\
    \ and synthesized setters (or correctly coded setters) takes a lot of work out\
    \ of reference counting. As long as you make sure that you always use an instance\
    \ variable setter method to set its value, most of your reference counting takes\
    \ place automatically.\n\n> > Note\n> It is good practice to use the accessor\
    \ methods, even when accessing an instance variable within a method. An exception\
