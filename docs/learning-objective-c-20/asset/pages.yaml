  md: 'This chapter is an introduction to blocks. You will learn how to define a block,
    how a block access to variables in its surrounding context, how to use a block
    in your own code, and about the somewhat tricky topic of memory management for
    blocks. The chapter also explores some pitfalls that can be an unaware user of
    blocks.

    Before looking at blocks in detail, the chapter takes a pair of detours and looks
    at two earlier ways of packing functionality: function pointers and the Foundation
    class NSInvocation.


    # # Function Pointers


    When the compiler encounters a function call, it inserts a jump instruction to
    the code that performs the function. (A jump instruction causes the execution
    to jump to the specified code instead of executing the line of code after the
    jump instruction). To return, the function executes a jump instruction back to
    the line of code following the original function call. In a normal function call,
    the landing point of the jump instruction (and hence the function is called) is
    static. It is determined at compile time. A function call can be made dynamic
    through the use of a function pointer.

    The following line declares myFunctionPtr as a pointer to a function that takes
    two ints and returns an int:


    ```

    int (*myFunctionPtr)(int, int);

    ```


    Figure 16.1 shows the anatomy of a function pointer


    ![](img/d110604efa69713c226b60d57d6498f2_321_0.png)


    The general form of a function pointer is:

    return_type (*name)(list of argument types);

    Function pointers are a low point in C syntax. Instead of reading left-to-right
    or right-to-left, they read from the inside out. More complicated function pointer
    declarations can quickly turn into puzzles, as you will see in Exercise 16.1.'
