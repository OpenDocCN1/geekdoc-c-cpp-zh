  md: '+   - Sending an object **retain** message increases its retain count by.


    +   - Sending an object **release** message reduces its retain count by one.


    +   - An **autorelease** message has no immediate effect, but it arranges to send
    a **release** message to its receiver at some future time.


    +   - When an object''s retain count reaches zero, the object is deallocated.


    Reference counting is an effective way to manage memory, but you have to follow
    the rules.


    The rules:


    +   - You own any object that you have created with a method that begins with
    `alloc:`, `new` or `copy` in the method name.


    +   - You do not own an object returned to by any other method. The returned object
    might be autoreleased; it might not be. You don''t care. The only thing that counts
    is that you do not own the object.


    +   - You can take ownership of an object by sending it a **retain** message.


    +   - When you are finished with an object that you own, you must relinquish ownership
    by sending the **release** message or an **autorelease** message. If you don''t
    own an object, you must not send it a **release** message or an **autorelease**
    message.


    Some auxiliary rules:


