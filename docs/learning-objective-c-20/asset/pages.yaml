    Lines 12 and 13 in Listing 4.3 are message expressions. The form of a messaging
    expres-\sion is


    ```

    [receiver message]

    ```


    The receiver is the object that being asked to execute a method. The message is

    of that method, plus any arguments that the method takes. When a message

    expression is executed, the runtime determines the class of the receiver, looks
    up

    the method in the class''s list of method names, and executes the code that corresponds
    to the method. This process is covered in more detail in Chapter 5.

    retain and release are methods that NSString inherits from NSObject. They are

    of Objective-C''s retain counting system. In a program using retain counting,

    each object has a retain count or reference count. An object''s retain count keeps
    track of

    how many objects retain it. When an object is first created, it has a

    retain count of one. Sending an object message increments the object''s retain

    count drops to zero. When the object is removed, its memory is returned to the
    heap and any

    further references to the object are invalid.

    The Greeter doesn''t retain the object passed in the argument newText and it has
    no

    information about it or when other code might cause newText''s retain count to
    drop to

    to To prevent newText from being deleted while the Greeter is using it, the

    Greeter takes ownership of newText by sending it a retain message. This assures
    that

    newText''s retain count remains at least one while the Greeter is using it.

    In this method, the Greeter finishes with retaining the object currently

    hold in greetingText. It releases ownership of that object by sending-

    it a release message to balance the retain message that was sent to the object

    when it was first stored. Sending a release message does not necessarily mean
    that an

    object will be deleted. The release message only decrements the object''s retain

