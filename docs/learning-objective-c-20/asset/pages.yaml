    # NSSet


    NSSet and NSMutableSet implement a collection of objects as a mathematical set.
    The main characteristics of the collection are:


    +   - The members of a set are not ordered. There is no way to retrieve a particular
    object from a set. You can retain an array containing all the objects in the set
    with the allObjects method or loop over the set using an NSEnumerator object (see
    Chapter 10, returned by allObjects in Objective-C). The order of the objects in
    the array is unspecified obtained by successive calls to set.

    - A given object appears in the set only once, no matter how many times it is
    added to the set.

    - With NSArray and NSDictionary, objects are sent a retain message when they are
    added to a set and a release message when they are removed from a set or when
    the set is deallocated.


