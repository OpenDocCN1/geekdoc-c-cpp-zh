    # Compiler Directives


    # Literal Strings


    Literal strings are constants that hold the text of a string. Objective-C uses
    instances of NSString in the Foundation framework, independent of plain C strings.
    You create a literal NSString the same way that you create a literal C string
    except that you add a @ at the beginning of the string:


    ```

    "The Big Apple" // Literal C string

    "@The Big Apple" // Literal NSString

    ```


    > Note

    Strictly speaking, "The Big Apple" is a compiler directive that tells the compiler
    to create a literal NSString with the text "The Big Apple.",


    # Objective-C Keywords


    # id


    id is a type that holds a "pointer to object". A variable that is declared as
    id can hold a pointer to any Objective-C object, independent of the object''s
    class.

    The declaration:


    myObject;

    tells you (the compiler) myObject is a pointer to an object. The bytes at that
    address are the memory representation of an instance of some class.

    You can assign a variable of a more specific type to a variable of type id, and
    vice versa, without an explicit cast; for example:


    ```

    NSString* string1 = "@The Big Apple";

    id = something;

    NSString* string2;

    something = string1;

    string2 = something;

    ```'
