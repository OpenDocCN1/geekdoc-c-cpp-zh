    required configuration is handled by creating a separate object and assigning
    it as NSApplication''s delegate.


    +   - NSWindow represents a window on the screen.


    +   - NSView represents a region of a window. Most views have a hierarchy of NSViews.

    - NSEvent carries the information about the user''s interactions with an application:
    the type of event, the location on the screen where the event occurred, time-


