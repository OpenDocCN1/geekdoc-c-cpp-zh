  md: '# Chapter 5 Messaging


    > Note

    if you are very curious and really want to know how the runtime machinery works,
    this is open-source. The code can be downloaded from: www.opensource.apple.com/sources/objc4/objc-c437.m/
    (But be forewarned, The code is not easy reading.)


    The dynamism of the Objective-C messaging system is powerful and makes it easier
    to build flexible, innovative software. This dynamism comes at a price—it limits
    the capability of the caller to perform some kinds of validity checking. As a
    consequence, errors will only show up at runtime. This bothers a certain fraction
    of the population that considers it dangerous and prefers stricter type checking,
    as found in languages like C++. A well-maintained 12-inch chef’s knife (as its
    Asian equivalent) is dangerous, even lethal, if used carelessly or maliciously.
    But very little in the way of truly interesting food is prepared without it.


    # Summary


    Objective-C methods are invoked by messaging, rather than by direct function calls.
    A message expression consists of a receiver (the object whose method is being
    called) and a message (the name of the method to be executed, plus any arguments
    that the method determines) enclosed in square brackets. When a message expression
    is evaluated, the runtime determines the receiver''s class and then looks in the
    class''s structure to find a pointer to the code that implements the method. The
    runtime then fills in the hidden variables and the pointer to the selector (the
    name of the method, converted to a SEL) and uses the pointer to execute the code.


    This arrangement has several advantages. Both parts of the message expression
    can be dynamic; they can be determined at runtime rather than compile time. It
    also allows for complex polymorphism. If the receiver is treated as id (pointer
    to an object), it can hold any object as long as the object implements a method
    with a name that corresponds to the name in the message. Polymorphism is used
    when we need to elicit the same method of behavior from a heterogeneous collection
    of objects—asking each object in a heterogeneous collection to draw itself.


    The keywords sel and super are used inside a method to invoke other methods in
    the class or superclasses, respectively.


    The flexibility of the Objective-C messaging system comes at some cost performance.
    For time-critical code, it is possible to bypass the messaging system and call
    the method directly, although in practice this is rarely necessary. The time spent
    in the dispatch is usually much smaller than the time spent executing the method
    body.'
