  md: 'Using Protocols


    The protocol declaration goes in a header file, so you could put this declaration
    in a header file named `Drawable.h`. There is no corresponding implementation
    file. Each class that adopts the protocol provides its own implementations of
    the protocol methods.


    Prior to Objective-C 2.0, a class that adopts a protocol was required to implement
    all of the protocol''s declared methods. Objective-C 2.0 allows you to mark protocol
    methods as optional or required:


    +   - A class that adopts a protocol must implement all of the protocol''s required
    methods.

    - A class that adopts a protocol is free to implement or not implement any of
    the protocol''s optional methods.


    Optional and required methods are marked with `@optional` and `@required` respectively.
    The methods are considered in the order they are declared in the file. Methods
    declared following a `@required` directive are required. Similarly, methods declared
    following an `@optional` directive are optional. If you don''t specify anything,
    a method is required by default:


    In the drafting example, some drawable items might supply text to use as a label.
    For example, you could use an optional method to get the text, as shown here:


    ```

    @required

    - (void) drawItem;

    - (NSRect) boundingBox;

    - (NSColor*) color;

    - (void) setColor:(NSColor*) color;


    @optional

    - (NSString) labelText;

    ```


    If a particular `<WidgetItem>` class has some label text, it implements the `-labelText`
    method; otherwise, it doesn''t. It is up to any class using a `<WidgetItem>` to
    check and see if a `<DrawableItem>` implements `-labelText`.


    # Adopting a Protocol


    A class adopts a protocol by implementing all the protocol''s required methods
    and any none of the protocol''s optional methods. You tell the compiler that your
    class is adopting a protocol by adding the protocol name, enclosed in angle brackets,
    to the class''s `@interface` line:


    ```

    @interface AcmeUniversalBolt : <DrawableItem>

    ```


    A class conforms to protocol if it adopts the protocol or if it inherits from
    a class that adopts the protocol.'
