  md: '# Chapter 9 Common Foundation Classes


    Creating separate mutable and immutable classes for containers allows for some
    behind the scenes efficiency in how the immutable classes are implemented. When
    you create a mutable array, the number of objects is fixed at creation time. The
    actual storage for the objects can be a simple fixed-size block of memory. A mutable
    array must use a more complicated storage system that allows it to grow or shrink.
    The pairs of immutable and mutable classes in this chapter are NSString and NSString,
    NSArray and NSMutableArray, NSDictionary and NSMutableDictionary, NSSet and NSMutableSet,
    NSData and NSMutableData, and NSIndexSet and NSMutableIndexSet.


    # Class Clusters


    The classes NSString, NSArray, NSString, NSNumber, and NSData are implemented
    as class clusters. Class clusters are a means of hiding complexity behind a simple
    interface. In a cluster, the publicly class is an abstract class. The actual implementation
    of the cluster is provided by a group of "concrete" subclasses that hide the publicly
    visible class, but their internal implementation may vary to optimize storage
    or performance. When you ask for an instance of the public class, the choice is
    determined by the init method of one of the private subclasses.


    > Note

    For complete discussion of class clusters, see Cocoa Design Patterns by Eric M.
    Buck and Donald A. Yachtman (Addison-Wesley, 2010).


    Implementing a class as a cluster has several consequences:


    +   The init method of a class that is implemented as a cluster substitutes a
    different object of the concrete subclass for the object returned by alloc. The
    cluster''s alloc method returns a temporary object that belongs to a special placeholder
    class. The init method returns the temporary object and returns an instance of
    one of the cluster subclasses. This has an important implication:You should never
    retain a reference to the object returned by alloc.

    Code your alloc and init as a single statement:

    SomeClassCluster *classCluster = [[SomeClassCluster alloc] init];


    As noted in Chapter 6, "Classes and Objects," a nested alloc, init is the idiom
    for object creation. If you get in the habit of using the standard idiom, you
    do not have to think about this.


    +   The NSObject introspection method isKindOfClassOfClass should not be used
    on instances of a class that is implemented as a cluster.


    ```

    NSArray *array = [NSArray arrayWithObject: @"Foo"];

    BOOL test = [array isMemberOfClass:[NSArray class]];

    ```'
