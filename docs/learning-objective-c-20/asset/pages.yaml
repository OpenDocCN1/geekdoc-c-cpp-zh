- img_proc: true
  md: '# Technical


    Absolutely: Objective-C is a superset of C. You can call a call to a C function
    anywhere that you can put a statement or in any expression (as long as the function
    returns a value of the appropriate type for the expression). You can also use
    an object pointer as argument to a C function, manage an object (one passed as
    an argument or one created inside the function) in the body of the function, or
    use an object pointer to a return value.


    # Practical


    Sometimes, you may have to use C functions. If you are writing a Mac OS or iPhone
    application, you may use Apple C languages for some tasks. A prime example is
    graphics on the iPhone. At present, the iPhone UIKit provides little in the way
    of drawing capabilities. To draw anything beyond a bitmap on the screen, you must
    use the Core Graphics C API. Looking further than the world of Apple, there is
    a universe of third-party C libraries that do assorted tasks. Because Objective-C
    interoperates with plain C you can link and use these libraries if you do not
    have access to their source code.


    # Philosophical


    We are in dangerous territory. Some object-oriented programmers aren''t entirely
    happy with using C functions. They should you straight C as much as possible.
    Not everyone agrees. A good way to start a long thread on an Objective-C matching
    is to ask a question like this: "I have a mathematical routine I need as a helper
    in my class. Should I write it as a C function, the code in my implementation
    or call the C function from my methods?" The hard-line OOP convertent would tell
    me to wrap the C code and make it one of the classes.


    It is really a matter of taste (the code would work either way), but I have the
    opposite view. For me, one of the wonderful things about Objective-C is that it
    does not require everything to be handled in a strictly object-oriented fashion.
    At the risk of taking such flaw, I would say "Object-oriented programming is a
    methodology, not a religion." It is extremely useful for a large number of tasks,
    but for some tasks others are more appropriate. Many mathematical calculations
    are inherently procedural and there isn''t really anything to be gained by putting
    them in an Objective-C wrapper to say they are "object-oriented." If you need
    to write a mathematical helper function, go ahead and write it in C. If you need
    to use such a function in more than one place, put the source in a separate .m
    file if it refers to Objective-C objects, and place the function declaration in
    a matching header file. You can then include the header file and use the function
    wherever required.'
