    # Inheritance


    Inheritance provides a way to create new classes by extending or modifying the
    behavior of an existing class. Suppose you want to add an AnnotatedShape class
    to the drawing program. An AnnotatedShape draws a shape and a text annotation
    below the shape, as shown in Figure 3.2.


    ![](img/d110604efa69713c226b60d57d6498f2_76_0.png)


    Figure 3.2 AnnotatedShape


    You could code AnnotatedShape from scratch, but that would be wasteful. Most of
    the code in AnnotatedShape would duplicate the code in Shape. It would be much
    better if you specify that AnnotatedShape was the same as Shape except:


    +   - AnnotatedShape has one more variable, a string variable to hold the text
    of the annotation.

    - AnnotatedShape has two extra methods that set and retrieve the text of the annotation.

    - AnnotatedShape’s draw method has a different implementation than Shape’s draw
    method. It has to draw the annotation as well as the shape.


    If you define AnnotatedShape like this, then in object-oriented speak:


    +   - AnnotatedShape inherits from Shape.

    - AnnotatedShape’s implementation of the draw method overrides Shape’s implementation.

    - AnnotatedShape is a subclass of Shape.

    - Shape is AnnotatedShape’s subclass.'
