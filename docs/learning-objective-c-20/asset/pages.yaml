    and you want to store it in an instance variable for future use, you must take
    ownership of the received object.(This rule has an exception for weak references.)


    +   - If you have an object that has taken ownership of any of the objects stored
    in its instance variables, you must implement a **dealloc** method to release
    objects when it is being deallocated.


