  md: '# Messaging


    In Objective-C, when you want an object to do something, you send the object message,
    and in response, the object executes one of its methods. This is not quite the
    same as calling a function. Functions are usually statically bound—the code that
    the function executes is determined when the program is compiled. Using messaging,
    the actual code that is executed in response to a message is determined at execution
    time.

    In this chapter, you will learn how Objective-C messaging works. The chapter covers
    methods, message expressions, and the machinery of the messaging system.


    # Methods


    The structure of an Objective-C method is very similar to that of a C function
    (in fact, the compiler eventually turns the methods into C functions). There are
    three major differences:


    +   - Methods are executed on behalf of a particular instance of the class that
    defines them. The method receives a pointer to the object instance in the form
    of the hidden variable self. ("Hidden" means you can use the variable self in
    the method even if it is not declared in the method''s argument list or anywhere
    else.)

    - Methods can directly access the object''s instance variables without having
    to declare them.

    - The syntax for naming the method and its arguments is different from that of
    a function.


    # A Simple Method


    Imagine that you are writing a drawing program and one of your classes is a Shape
    class as shown in this header file:


    ```

    #interface Shape : Graphic

    {

    NSColor *outlineColor;

    NSColor *fillColor;

    ```'
