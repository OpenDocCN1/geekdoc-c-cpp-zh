    number is almost always a mistake.


    # Floating-Point Types


    C floating-point types are float, double, and long double. The sizes of the floating-

    point types are the same in both 32- and 64-bit executables:


    ```

    float a; // floats are 4 bytes

    double a; // doubles are 8 bytes

    long double aDouble; // long doubles are 16 bytes

    ```


    Floating-point values are always signed.


    # Truth Values


    Ordinary expressions are commonly used for truth values. Expressions that evaluate
    to

    zero are considered false, and expressions that evaluate to non-zero are considered
    true

    (see the following sidebar).


    # Bool, bool, and BOOL


    Early versions of C did not have a Boolean type. Ordinary expressions were (and

    ill are) for Boolean values (truth values). As noted in the text, an expression

    euates to zero is considered false and one that evaluates to nonzero is considered

    true. A majority of C code is still written this.


    C99, the current standard for C, introduced a _Bool type. _Bool is an integer
    type with

    only two allowed values, 0 and 1. Assigning any non-zero value to a _Bool results
    in 1:


    ```

    bool b = 35; // b is now 1

    ```


    If you include the file stdbool.h in your source code files, you can use bool
    as an alias

    for _Bool and the Boolean constants true and false. (true and false are just\defined
    as 1 and 0, respectively.)


    ```

    #include <stdbool.h>

    bool b = true;

    ```'
