  md: '# 13


    # Protocols


    A protocol is a defined set of methods that a class can choose to implement. Protocols
    are useful when an object needs to talk to one or more other objects but doesn''t
    know (or particularly care) the class of those other objects. Objective-C protocols
    are the Equivalent of Java interfaces. In fact, the designers of Java borrowed
    the concept from Objective-C. Protocols are used throughout the Cocoa frameworks.
    Objective-C has both formal and informal protocols. A formal protocol declares
    a set of required methods implementing all the required methods. When a class
    declares that it adopts a formal protocol, the compiler checks to see that the
    class implements all the required methods. An informal protocol is a list of method
    declarations in a category header that a class could choose to implement. Most
    of informal protocols in the Cocoa frameworks are replaced by formal protocols.


    In this chapter, you will learn when to use a formal protocol, how to declare
    a formal protocol, and how to code a class that adopts a formal protocol. The
    chapter then goes through a complete example, a TablePrinter. A TablePrinter can
    print data from another object in the table. A TablePrinter does not need to know
    the class of the object that is supplying the data. The only thing a TablePrinter
    needs to know is that the object supplying data belongs to a class that adopts
    the TablePrinterData source protocol.


    # Protocols


    As an example, suppose you want to design a drafting (mechanical drawing) system.
    You could ask your users to draw everything from scratch with lines and arcs,
    but it would be much more convenient if you supply them with libraries of common
    components, like nuts and bolts, that know how to draw themselves. Let us call
    these components "drawable items."


    The view object that is doing the drawing doesn''t really care about what class
    a drawable item belongs to. It only cares that a drawable item can respond to
    a specified set of messages. A drawable item should be able to return a bounding'
