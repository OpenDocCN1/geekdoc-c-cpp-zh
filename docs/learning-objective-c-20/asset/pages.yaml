  md: 'malloc and Garbage Collection


    > Note

    Don''t confuse deallocation with deallococ. Deallocation is the process of returning
    an object''s bytes to the heap. This happens under both reference counting and
    garbage collection. deallococ is a method that is called just before an object
    is deallocated in a reference counted environment.


    Under garbage collection, RSObject provides an alternative method, finalize, which
    is called just before deallocation. Although finalize appears to be an analog
    of deallococ, there are some significant differences:


    +   * In a finalize method, there is no need to release (nil out) references to
    any other objects in the disappearing object''s instance variables. If the only
    reference to an object is in an instance variable it will be collected.

    * The order in which dealloc methods is called deterministic. The order in which
    finalize methods are called not. At the end of a collection cycle, the collector
    calls the finalize method of all objects marked for collection before any of the
    objects are deallocated. The order in which finalize methods is indeterminate.

    * It is possible for objects in the group that is collected to message each other
    from their finalizers. Object A''s finalize method can message Object B, even
    if Object B''s finalize method has already executed. This allows for the possibility
    of messaging an object in an invalid or inconsistent state. You should try to
    avoid messaging other objects in it.


    However, like dealloc, if you implement a finalize method, you must remember to
    call the superclass implementation of finalize:


    ```

    super/finalize();

    ```


    Apple''s recommendation is to avoid finalizers if all possible. It recommends
    managing the scarce resources like file descriptors and network connections by
    implementing a separate invalidate method that can be called at an appropriate
    time in your code, however this advice is a bit disingiguous, in some cases, the
    only way to find the appropriate time to call an invalidate method is to implement
    your own reference counting system for the resource. If you are faced with a situation
    like that, you should go ahead and keep the cleanup code in a finalize method.


