  md: 'Chapter 7, "The Class Object," covers class objects and class methods. Unlike
    classes in some other object-oriented languages, Objective-C classes do not have
    class variables, variables that are shared by all instances of the class. The
    last sections of this chapter show how to obtain the effect of class variables
    by using static variables.


    Chapter 8, "Frameworks," describes Apple''s way of encapsulating dynamic link
    libraries. It covers the definition and structure of a framework and takes you
    on a brief tour of some of the common frameworks that you will encounter when
    writing OS X or iOS programs


    Chapter 9, "Common Foundation Classes," covers the most used Objective-C classes
    for strings, arrays, dictionaries, sets, and number objects.


    Chapter 10, "Control Structures in Objective-C," discusses some considerations
    when you use Objective-C constructs with C control structures. It goes on to cover
    the additional control structures added by Objective-C, including Objective-C
    2.0''s new Enum constructor. The chapter ends with an explanation of Objective-C''s
    exception handling system.


    Chapter 11, "Categories, Extensions, and Security," shows you how to add methods
    to an existing class without having to subclass it and how to hide the declarations
    of methods that could count private. The chapter ends with a discussion of Objective-C
    security issues.


    Chapter 12, "Properties," introduces Objective-C 2.0 new declared properties features.
    Properties are characteristics of an object. A property is usually modeled by
    the object''s instance variables. Methods that get or set a property are called
    accessor methods. Using the declared properties feature, you can ask the compiler
    to synthesize a property''s accessor methods for you, saving yourself a considerable
    effort.


    Chapter 13, "Protocols," covers a different way to characterize objects. A protocol
    is a defined group of methods that a class can implement. In many cases, what
    is important is not an object''s class, but whether the object''s class adopts
    a particular protocol by implementing the methods declared in the protocol. (More
    than one class can adopt a given protocol.) The Java concept of an interface was
    borrowed from Objective-C-protocol.


    # Part III: Advanced Concepts


    Objective-C provides two systems for managing object memory: reference counting
    and automatic garbage collection.


    +   Chapter 14, "Reference Counting," covers Objective-C''s traditional reference
    counting system. Reference counting is also called retain counting or retained
    memory. In a program that uses reference counting, each object keeps a,'
