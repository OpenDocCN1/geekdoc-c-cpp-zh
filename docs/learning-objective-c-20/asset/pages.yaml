  md: '# C, The Foundation of Objective-C


    Objective-C is an extension of C. Most of this book concentrates on what Objective-C
    adds to C, but in order to program in Objective-C, you have to know the basics
    of C. When you do such mundane things as add two numbers together, put a comment
    in your code, or use an statement, you will find them identical in both C and
    Objective-C. The non-object part of Objective-C is not similar to C, or C-like,
    it is C. Objective-C 2.0 is currently based on the C99 standard for C.


    This chapter begins a two-chapter review of C. The review is not a complete description;
    it covers only the parts of the language Topics like bit operators, details of
    type conversion, however, macros and other arcane context are not mentioned. It
    is intended as an aide-memmoire for those whose knowledge of C is rusty, or as
    a quick reference for those who are adept at picking up a new language from context.
    The following chapter continues the review of C and treats the topics of declaring
    variables, variable scope, and where memory C puts. If you are an expert C/C++
    programmer, you can skip this (However, a review helps). If you are coming to
    Objective-C from a different C-like language, such as Java or C#, you should probably
    at least skim the material. If your programming experience is with a scripting
    language, or if you are a beginner, you will probably find it helpful to read
    a book on C in parallel with this book.


    > Note

    I recommend that everyone read Chapter 2, "More About Variables." In my experience,
    many who be familiar with the material it contains are not familiar with that
    material.


    There are many books on C. The original Kernighan and Ritchie book, The C Programming
    Language, is still one of the best. It is the book most people use to learn C.


    +   1. Brian W. Kernighan and Dennis M. Ritchie, The C Programming Language, Second
    Edition. (Englewood Cliffs: Prentice Hall, 1988).'
