    # # Classes and Instances


    Objects are typed by their class. Every object belongs to some class; it is an
    instance of that class. In a real-world analogy, the information contained in
    the plans and specifications of a Porsche sports car is a class. That information
    defines what it means to be a Porsche and how to construct it. The actual car
    in your driveway (lucky) is an instance of the class Porsche. Back in the world
    of computer programs, a class is a template or defines a set of variables, *instance
    variables*, and a set of methods, including the code to implement these methods.
    An object (an instance of a class) is an actual chunk of memory that provides
    storage for the set of variables defined in the class. There can be more than
    one instance of a given class. Each instance is a separate area of memory and
    has its own copy of the instance variables defined by the class.


    # # Methods


    Methods are similar to functions but they are not quite the same thing. Methods
    are executed upon an instance of the class that defines them. When an object executes
    a method, it has access to the object''s data. If you send a shape object, the
    *draw* method will use the *Shape* object''s object-position, and color. If you
    send the same *draw* message to a different *Shape* object, the *draw* method
    will use the other *Shape* object''s outline-position, and color.


    # # Encapsulation


    Encapsulation, sometimes called *information hiding*, refers to hiding the inner
    workings of a class from the users of a class. It is a way of reducing complexity
    by reducing the connections between different parts of a program. Objects can
    be manipulated only by a defined interface: the set of methods that class implements.


    A programmer writing code that uses the *Shape* class does not need to know how
    the *Shape*''s data is stored internally or drawing code works. He or she only
    needs to know when a *Shape* instance receives a *draw* message, it will draw
    itself.


    Encapsulation gives the developer of a class the freedom to tinker with its implementation
    without disturbing code that uses the *Shape* class. The developer of the *Shape*
    class'
