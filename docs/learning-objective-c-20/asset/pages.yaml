  md: '# 16


    # Blocks


    Blocks provide a way to package some executable code and a context (various variables)
    as a single entity so they can be handed off for execution at a later time or
    on a different thread. In other languages, blocks or similar constructs are sometimes
    called closures or anonymous function. Blocks are an Apple-supplied extension
    to C, Objective-C 2.0, and C++. Apple has submitted blocks to the C standards
    working group as a proposed extension to C. At the time of this writing, blocks
    are only available on Mac OS X Snow Leopard (v 10.6 and on iOS 4). They are not
    available on earlier versions of Mac OS X or iPhone iOS.


    Note

    You can use blocks on iPhone OS 3.x and on Mac OS X Leopard (v 10.5) if you install
    Plausible Blocks (PLBlocks), Plausible Blocks, a reverse-engineered port from
    Apple released open-source Darwin OS code provides the compilers and runtime required
    to use such blocks. You can obtain Plausible Blocks from http://code.google.com/py/plblocks/


    Handling of concurrent code involves many situations, but one of the main driving
    forces behind the adoption of blocks is Apple''s Grand Central Dispatch (GCD)
    feature. GCD is a thread pool that is managed by the operating system to execute
    efficiently. The idea behind GCD is that the operating system has a global view
    of all the processes running on it (CPU, GPU, and RAM) as needed to make tasks
    run more efficiently. GCD can make better decisions than a user about where and
    when to schedule them for execution. You use blocks to submit units of work for
    GCD to execute.


    Note\GCD provides a C interface for submitting blocks. Cocoa provides a higher-level
    interface to GCD through the classes NSOperationQueue, NSBlockOperation, and NSInvocationOperation.

    InvocationOperation allows you to submit units of work as NSInvocation objects
    instead of blocks, but you will see in the section NSInvocation, NSInvocation
    objects are somewhat difficult to set up. Blocks are much easier to use.'
