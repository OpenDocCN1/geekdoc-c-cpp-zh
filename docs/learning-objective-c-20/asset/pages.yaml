    # The Trouble with Function Pointers


    There is one large inconvenience with using function pointers as callbacks or
    in any situation where you are trying to hold some code for execution by another
    part of the program or other thread. Any context that the function requires be
    packed up and submitted as a separate variable or variables.


    Most designs use the pattern shown in Listing 6.1. The function or method that
    passes the callback accepts a blind pointer and then passes that pointer back
    to the callback function, as shown on Figure 6.2. This is only a minor inconvenience
    when the preceding example. However, if your function requires a more complicated
    context, you must create and load a custom structure to hold the context and then
    pass the pointer to that structure the context variable. As an alternative, you
    could package the context variables in an NSDictionary and then pass the dictionary
    as the context. Either way is awkward if the context involves many variables.'
