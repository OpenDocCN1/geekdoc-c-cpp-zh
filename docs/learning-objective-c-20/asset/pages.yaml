  md: "# A Syntax Quirk in Objective-C\n\nThe \"from the inside out\" declaration\
    \ style of function pointers doesn't fit with Objective-C's syntax for method\
    \ arguments. Recall that Objective-C requires the type for a method argument to\
    \ be enclosed in parentheses before the argument name. This conflict is resolved\
    \ in favor of the syntax of method arguments.\n\nWhen declaring a method argument\
    \ that is a function pointer, the name comes outside. For example, a pointer to\
    \ a function that has no arguments or return value is normally declared as follows:\n\
    \n```\nvoid (*functionPtr)(void);\n```\n\nA function that takes a function pointer\
    \ of type as an argument is declared like this:\n\n```\nvoid (*methodWithFFArg)(void\
    \ (*float)(void));\n```\n\nBut a method with the same argument is declared like\
    \ this:\n\n```\n(-void)methodWithFFArg((float (*float))fp);\n```\n\nPutting the\
    \ name of the function pointer last in a function pointer declaration works when\
    \ declaring the type of a method argument. Putting the name last results in a\
    \ compiler error in any other situation.\n\nYou can also declare arrays of function\
    \ pointers. The following line declares fpArray as an array of 10 pointers to\
    \ functions. Each function takes a single argument, a pointer to a float, and\
    \ returns void:\n\n```\nvoid (*fpArray[10])(float (*float));\n```\n\nA function\
    \ pointer can point to a function that has another function pointer as an argument\
    \ or a return value:\n\n```\nvoid (*complicatedFunctionPointer)(void (*void));\n\
    ```\n\ncomplicatedFunctionPointer is a pointer to a function that takes no arguments\
    \ and returns void.\n\nDeclarations like these are ugly, but you can make your\
    \ code cleaner by hiding the ugliness with a typedef.\n\n```\ntypedef void (*complicatedFunctionPointer)(void);\n\
    complicatedFunctionPointer fp;\n```\n\n# Calling a Function with a Function Pointer\n\
    \nThe following example shows how to assign a function to a function pointer and\
    \ how to call the function using the function pointer:\n\n```\nvoid logInt(int\
    \ n)\n{\n  NSLog(\"The integer is: %d\\n\", n);\n}\n```"
