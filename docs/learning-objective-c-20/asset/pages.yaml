    # # Expressions and Statements


    Expressions and statements in C are the equivalent of phrases and sentences in
    a natural language.


    # # Expressions


    The simplest expressions are just single constants or variables:


    ```

    14

    bananasPerBunch

    ```


    Every expression has a value. The value of an expression that is a constant is
    just the constant itself: the value of 14 is 14. The value of a variable expression
    is whatever the value of the variable is: the value of bananasPerBunch is whatever
    value it was given when it was last set by initialization or assignment.


    Expressions can be combined to create other expressions. The following are also
    expressions:


    ```

    j + 14

    a < b

    distance = rate + time

    ```


    The value of an arithmetic or logical expression is whatever you would get by
    doing the arithmetic or logic. The value of an assignment expression is the value
    given to the variable that is the target of the assignment.


    Function calls are also expressions:


    ```

    SomeFunction()

    ```


    The value of a function call expression is the return value of the function.


    # # Evaluating Expressions


    When the compiler encounters an expression, it creates binary code to evaluate
    the expression and find its value. For primitive expressions, there is nothing
    to do: Their values are just what they are. For more complicated expressions,
    the compiler generates binary code that performs the specified arithmetic, logic,
    function calls, and assignments.'
