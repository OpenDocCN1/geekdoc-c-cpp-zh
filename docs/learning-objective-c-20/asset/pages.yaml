  md: '# Chapter 10 Control Structures in Objective-C


    The code in the @finally block is always executed. If the @try or @catch blocks
    contain a return statement, the return is delayed until after the code in the
    @finally block is executed. In Listing 10.2, the @finally block logs a message,
    and the program continues execution after the @finally block.


    > Note

    In a multi-threaded program, exceptions are only caught if the code raising the
    exception is executing on the same thread as the @try/@catch/@finally.


    # Throwing Your Own Exceptions


    The runtime system and Cocoa frameworks throw exceptions for you in various unfortunate
    situations. However, you can also throw your own exceptions using the @throw directive,
    as shown in the following example:


    ```

    (void) addOnion

    if [pantryNumOnions] <= 0]

    {

    NSException *exception =

    [NSException exceptionWithName:@"OutOfOnionException"

    reason:@"PantryEmpty" userInfoInit];


    @throw exception;

    else

    {

    ... // Add the onion

    }

    ```


    NSException is a Foundation class that packages useful information about an exception.
    When you create an NSException, you can specify the name of the exception, for
    the reason, and provide an NSDictionary that adds additional information. Although
    you can use any object as the exception object when throwing your exceptions,
    the runtime and the Cocoa frameworks always use NSException.


    The preceding examples use an NSException object (see the sidebar''), but you
    can use any Objective-C object as an exception object. For example, you can use
    a custom subclass of NSException or an NSString as an exception object:


    @throw "Sorry. We''re out of Onions";'
