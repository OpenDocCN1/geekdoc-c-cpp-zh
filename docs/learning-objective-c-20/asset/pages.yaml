    marked all objects that can be reached by a chain of references from the root
    set. Finally, it sweeps through memory deallocating any objects that haven''t
    been marked as live.

    Figure 15.1 shows a set of objects in a hypothetical program''s memory as a cycle
    begins. An arrow pointing from one object to another indicates that the first
    object holds a reference (pointer) to the second. Objects A and B are held in
    variables on the stack and Object C is held in an external variable. They form
