  md: '# 11


    # Categories, Extensions, and Security


    In Chapter 6, "Classes and Objects," you learned the basics of defining classes
    and allocating, initializing, and copying object instances. But there is more
    to life than simple object creation. This chapter shows you how to add a method
    to an existing class, how to hide the existence of methods from (at least some)
    prying eyes, and how to limit access to an objects instance variables. It also
    discusses Objective-C security (and the lack thereof).


    # Categories


    Categories let you add methods to an existing class without subclassing it and
    without requiring access to the class''s source code. Using a category to extend
    the behavior of a class is a much lighter procedure than subclassing.


    As an illustration, suppose you want to take a string like "Four score and seven
    years ago" and turn it into "FourScoreAndSevenYearsAgo". A string like that, in
    which each word in the original string is capitalized and then squashed together
    into a single block of characters (with no spaces), is called a CamelCase string.(It
    is named after the obvious visual analogy to camel humps.)


    Objective-C classes follow the usual convention of TestCase. Objective-C method
    names are usually a variant of CamelCase where the first letter of the first word
    is uncapitalized.


    The first thing you should do is to look at the documentation for NSString and
    see if NSString already has a -camelCase method. Unfortunately, it doesn''t.'
