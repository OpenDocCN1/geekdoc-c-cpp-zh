    can''t have a variable and enumeration constant with the same name.


    # Operators


    Operators are like verbs. They cause things to happen to your variables.


    # Arithmetic Operators


    C has the binary operators +, -, *, / for addition, subtraction, multiplication,
    and division, respectively.


    > Note

    if both operands to the division operator (/) are integer types, C does integer
    division. division truncates the result of doing division. The value of 7 / 3
    is 2.


    # Remainder Operator


    The remainder or modulus operator (%) calculates the remainder from an integer
    division.

    The result of the following expression is 1:


    ```

    int a = 7;

    int b = 3;

    int c = a%b; // c is now 1

    ```


    Both operands of the remainder operator must be integer types.


    # Increment and Decrement Operators


    C provides operators for incrementing and decrementing variables:


    ```

    a++;

    ++a;

    ```'
