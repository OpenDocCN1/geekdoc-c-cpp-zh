  md: '# Chapter 8 Frameworks


    The allocator argument specifies how the dynamic allocation for the objects memory
    is handled, capacity is the maximum number of entries in the array, and callbacks
    is a pointer to a structure of callback functions. The callback functions are
    used to perform tasks like retaining and releasing objects when they are stored
    in or removed from the array.


    Don''t worry about these details now; the point of the preceding code is just
    to show you a concrete example of a Core Foundation object.


    Compare the Core Foundation mutation array with creating the equivalent Foundation
    object


    ```

    NSMutableArray *mutableArray =

    [NSMutableArray alloc initWithCapacity:capacity];

    ```


    The main thing to notice is that the Core Foundation object is more complicated
    and harder to use its Core Foundation equivalent. There may be times when you
    are forced to use a Core Foundation object, whenever you can, staying at the Objective-C
    level is easier, less error prone to write.


    # Opaque Pointers


    Core Foundation objects are opaque pointers. An opaque pointer is a pointer to
    a structure whose declaration is placed in a private header file that is not supplied
    to the user. Without the header file, members can only be accessed with a set
    of supplied functions. The contents of the structure cannot be accessed by deferencing
    a pointer to the structure, nor can the object be interrogated in the debugger.
    The point of opaque pointers is information hiding. Opaque pointers let the owner
    of the code modify the (private) internal representation of the object without
    changing its public interface. Core Foundation does provide a function, CFShow,
    which can be used in the debugger to display information about a Core Foundation
    object, but the use of opaque pointers makes debugging Core Foundation objects
    a frustrating.


    # Memory Management for Core Foundation Objects


    Core Foundation objects have a counted memory management system similar to Objective-C''s
    reference counting:


    +   - You own any Core Foundation object that you create by calling Core Foundation
    functions that have Create or Copy in the name.

    - You do not own any Core Foundation object that you get from any other function
    (typically a Core Foundation function with Get in its name). If you want the object
    to remain valid the current scope, you must take ownership of the object by calling
    the function CFRetain with the object as the function argument.'
