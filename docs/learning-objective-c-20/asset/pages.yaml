  md: '# Chapter 11. Categories, Extensions, and Security


    The information in an Objective-C executable that the runtime uses to fill its
    structures is available and can be read by any program. There are several command
    line programs that read this information and present it in human-readable form.
    (See the sidebar Dumping a Class.)


    # Dumping a Class


    The command line tool ottool (of the standard Mac OS X distribution) can display
    the instance variables and methods from an Objective-C program or framework, albeit
    in a somewhat cryptic format. Even with class-dump (www.codecode.com/projects/class-dump),
    which prints out the interface normally formatted as objects, ottool and class-dump
    are useful for educational purposes, but you shouldn''t use any private methods
    or frameworks that you discover. Private methods and undocumented APIs are fragile.
    If you use them and they change or disappear without notice, your program will
    likely break.


    As noted, Objective-C does not provide any access for method names. You can try
    to hide the declaration of a private method in a private header or a category
    in an extension in the implementation file. But if somebody roots out the name
    and signature with class-dump, or the selector-call method, the compiler will
    complain with a warning, but that problem can be solved by crafting a custom category
    header file that declares the methods using the information from class-dump.


    I some newcomers find it a bit shocking, but in practice it doesn''t cause much
    trouble—most people learn to live by the maxim that it''s a bad idea to write
    code that depends on the undocumented internals of other people''s code or libraries.


    > Note Apple will reject your app from the App Store if it uses a private or undocumented
    Apple method.


    However, there are some cases where you should be careful. One example is licensing
    code; although it is inevitable that your app will be cracked, you don''t want
    to make it even easier for a cracker, so you should probably write your licensing
    code or anything similar in straight.


    # Calling C Functions from Objective-C


    A common question that newcomers ask is “Can I call C functions from within an
    Objective-C method?” I''ll divide the answer into three parts: technical, practical,
    and philosophical.'
