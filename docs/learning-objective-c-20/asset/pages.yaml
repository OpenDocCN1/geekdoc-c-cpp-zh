  md: '# 32- and 64-Bit


    For the past years, Apple has been moving into 64-bit computing. Mac OS X Tiger
    (v 10.4) can run 64-bit command line programs, Mac OS Leopard (v 10.5) and Mac
    OS X Snow Leopard (v 10.6) can run both GUI-based 64-bit programs and boot a 64-bit
    kernel on some recent Macs.


    Note

    The earliest Intel Macs (those with Core Duo or Core Solo processors) are 32-bit
    only. iOS devices are also 32-bit only.


    32-bit and 64-bit refer to number of bits used to address memory. A 32-bit program
    uses pointers that are 4 bytes wide and can address ²³² or about 4 gigabytes (GB)
    of memory. A 64-bit program can theoretically address ²⁶⁴, or about 1.8 × 10⁹
    bytes of memory. In practice, current Intel machines use 47 of the 64 bits in
    an 8-byte pointer for addressing, giving a maximum address of 140 terabytes. (A
    terabyte is 10¹² bytes).


    What is the point of such huge numbers? As computers have become faster, people
    in some disciplines have begun to write programs with very large data sets, large
    enough to run into the 4 GB limit on addresses. On the hardware side, Apple sells
    laptops with up to 8 GB of physical memory and desktops up to 32 GB of physical
    memory. There is clear pressure to expand the size of addressable memory beyond
    4 GB. Computer architectures work with sizes that are powers of two, so the next
    logical pointer after 4 bytes is 8.


    Note

    When thinking about this subject, remember that Mac OS X has a swap system and
    that each process has its own virtual address space. A process does not need to
    be loaded into physical memory in order to execute; the swap system takes care
    of moving pages between physical memory and swap areas on disk. A process that
    uses 2 GB of memory will run on a machine that has 1 GB of physical memory, albeit
    potentially much more slowly than it would run on a machine with 4 GB of physical
    memory (assuming that the 4 GB memory isn''t running other large programs the
    same time).'
  merge: -1
