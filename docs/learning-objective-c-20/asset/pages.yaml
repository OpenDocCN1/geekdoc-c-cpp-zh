  md: "# Time\n\nTop of event loop. An autorelease pool is allocated and pushed on\
    \ the top of the pool stack.\n\nObject is allocated.\n\nObject is autoreleased.\n\
    \nObject lifetime\n\nBottom of event loop. The top autorelease pool is released.\
    \ Object receives a release message. If no other object is retaining it, Object\
    \ is deallocated.\n\nFigure 14.2 Lifecycle of an autoreleased object in a GUI\
    \ program\n\nIf you are writing a Foundation (non-GUI) program, you must create\
    \ at least one autorelease pool yourself:\n\n```\nmain ()\nNSAutoreleasePool *pool\
    \ = [[NSAutoreleasePool alloc] init];\n  // Whatever your program does\n...\n\
    \  [pool release];\n  return 0;\n}\n```\n\nNote\nThe autorelease class also supplies\
    \ a method drain. In code compiled for reference counting, drain is identical\
    \ to release. In code compiled for garbage collection (Chapter 15, \"Garbage Collection\"\
    ), a release message is a no-op, whereas a drain message functions as a hint to\
    \ the garbage collector that the collector should consider doing a collection.\
    \ The difference between release and drain is significant only if you are writing\
    \ framework code that will be compiled for both reference counting and garbage\
    \ collection."
