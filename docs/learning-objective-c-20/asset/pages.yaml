  md: '# Where Does a Protocol Declaration Live?


    A protocol declaration must be visible to the interface section of a class that
    adopts protocol. In the current example, the declaration of the TablePrinterDataSource
    protocol is placed in its own header file, TablePrinterDataSource.h (see Listing
    13.1), which is imported into FruitBasket.h (see Listing 13.4). As an alternative,
    the declaration of TablePrinterDataSource is placed in TablePrinter.h (see Listing
    13.2), FruitBasket.h would need to import TablePrinter. Typically, in Cocoa frameworks,
    a formal protocol is declared in the header file of the class that is the primary
    user of objects conforming to that protocol. However, a few Cocoa protocols are
    declared in their owner header files.


    # A Problem


    The although you worked, you should have noticed a small problem when you built
    it; some compiler warnings as the following:


    ```

    TablePrinter.m:23:

    -respondsToSelector: not found in protocol($)

    ```


    The compiler is complaining that respondsToSelector: isn''t part of the <TablePrinterDataSource>
    protocol. It isn''t, but it doesn''t matter because respondsToSelector is implemented
    by NSObject, and every object (including the object passed as the data source)
    inherits from NSObject. And it doesn''t matter—the program worked just fine, didn''t
    it? Well, it''s a bad idea to get in the habit of ignoring compiler warnings,
    even semi-spurious ones. If you start ignoring warnings, one day, as the Sun rises,
    you''ll ignore one that isn''t spurious and there will be trouble.


    You can fix this in two ways. In TablePrinter.h, you can change the type in the
    instance variable and property declarations to:


    ```

    NSObject<TablePrinterDataSource> *dataSource;

    ```


    This tells the compiler explicitly that dataSource is a subclass of NSObject as
    well as implementing <TablePrinterDataSource>. A more elegant solution is to change
    the @protocol line in TablePrinterDataSource to be:


    ```

    @protocol TablePrinterDataSource<NSObject>

    ```


    This means that adopts <TablePrinterDataSource> also adopts the <NSObject> protocol.
    The important point is that one protocol can adopt another.) This illustrates
    that <NSObject> is a protocol that NSObject adopts (see the sidebar, NSObject
    and <NSObject>). Again, because NSObject implements respondsToSelector:, you don''t
    have to do any work making the compiler understand that everything is OK.'
