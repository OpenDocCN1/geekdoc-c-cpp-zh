    count drops to zero, the object is deallocated. Using garbage collection, a separate
    thread, called the garbage collector, wakes up periodically, examines the program''s
    memory, and frees any objects that are no longer needed. An Objective-C program
    running on OS X use either reference counting or garbage collection; you cannot
    mix the two in a single program. Programs written for iOS must use reference counting.
    Garbage collection is not currently supported on iOS.

    This chapter covers reference counting. In it, you will learn how reference counting
    works, more advanced aspects of reference counting, such as autorelease pools,
    the rules you must follow to keep your reference count correct, and about some
    problems, such as retain cycles, that can occur when you use reference counting.
    The next chapter is devoted to a treatment of Objective-C 2.0/ automatic garbage
    collection system.


    # The Problem


    All Objective-C objects are dynamically allocated; their bytes come from the heap.
    If you want to create an object on the stack by declaring an automatic variable
    that holds an object pointer to an object then


    ```

    NSString *string;

    the compiler rejects and refuses to compile the file:

    error: statically allocated instance of Objective-C class ''NSString''

    ```


    The proper way to create an object is to declare a pointer variable and use the
    method to allocate memory for your object on the heap. The following line creates
    an


    After you''ve created some objects and used them, the question arises: How do
    you return them when you''re finished? The Golden Rule of memory management is
    "When you''re finished with what you have allocated, you have give the bytes back
    to the ''heap.''" One possibility would be for Objective-C to provide a method
    that, when called, just free the bytes used for an object:


    ```

    free(object);

    ```


    However, this is not a satisfactory solution. It requires you to keep track of
    every place, in the entire program, that an object is used, and to call the freeObject
    method when you are finished with that object. This is clearly impractical for
    anything other than a trivial program. Beyond impractical for a program that might
    contain hundreds of objects, which are used in hundreds of files worked by a team
    of programmers.


    To avoid this problem, Objective-C uses a system called reference counting. Reference
    counting is currently the default memory management system. If you want to use
    garbage collection, you must explicitly enable it in your project, as explained
    in the next chapter.'
