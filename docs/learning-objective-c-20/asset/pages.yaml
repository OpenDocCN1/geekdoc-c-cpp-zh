  md: 'Your next thought might be to add a camelCase method by subclassing NSString.

    This is a bad idea for a couple of reasons:


    +   * As you saw in Chapter 9,"Common Objects," NSString is a class cluster. Although
    not impossible, subclassing a class cluster is a non-trivial enterprise requires
    some serious thought to do correctly.

    * If you add the method camelCase by subclassing, every string that you want to
    turn into a camelCase string would be an instance of the CamelCase subclass instead
    of a plain NSString. This requirement would be a burden if you receive strings
    from other classes. Most classes that deal in strings return plain objects.


    It is very easy. The only thing that you have to do is the method declaration
    in an @interface section and the code for the @implementation section. The runtime
    will then add your category method to the class. After it has been added by the
    runtime, a category method behaves exactly as if it had been coded in the class
    by the original programmer.


    Here is an example of a camelCase category method for NSString. The header file
    for a category is very similar to a regular class header file, as shown in Listing
    11.1.


    # Listing 11.1 NSString+CamelCase.h


    ```

    #import <Foundation/Foundation.h>


    @interface NSString (CamelCase)


    -(NSString*)camelCase;


    @end

    ```


    Your category file must import the header file for the class you are extending.
    In this example, the header file for NSString is imported by Foundation/Foundation.h.
    The @interface line contains the name of the class you are adding to (NSString)
    and the name of the category is arbitrary (you could call it InitialCase or whatever
    you like instead). This example follows the common naming convention for category
    files, which is ClassName+CategoryName: the name of the header file is NSString+CamelCase.h.


    > One big difference between a category and a subclass is that a category cannot
    add any variables to a class. The header file reflects this: no instance variable
    section.'
