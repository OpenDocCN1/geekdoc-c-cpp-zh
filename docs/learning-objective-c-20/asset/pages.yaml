  md: "# Multithreading\n\nReference counting becomes a bit more complicated in a\
    \ multithreaded program. The typical setter pattern, shown in Listing 14.1, is\
    \ problematic in a multithreaded environment. If two threads attempt to invoke\
    \ setterGuitar at approximately the same time, the second thread can interrupt\
    \ the first before the first thread finishes executing the method. This can result\
    \ in an object with an incorrect retain count, or a crash of the object that was\
    \ originally stored in guitar receives two release messages, one from each thread.\n\
    \nPreventing threads from interfering with each other while using the setter method\
    \ requires the use of a lock, as shown in Listing 14.2.\n\nListing 14.2 setGuitar:with\
    \ lock\n\n```\n-(void)setGuitar*{\n  @synchronized(self) {\n    if ( newGuitar\
    \ != guitar ) {\n      [guitar release];\n      guitar = newGuitar;\n      [guitar\
    \ retain];\n    }\n  }\n}\n```\n\nThe @synchronized() compiler directive sets\
    \ up a locking mechanism that only allows one thread at a time to execute the\
    \ code in the compound statement (code block) that follows it. If a thread attempts\
    \ to enter the code block while another thread is executing it, the second thread\
    \ will block until the first thread has finished execution. In the preceding code,\
    \ the @synchronized block guarantees setting guitar is an atomic operation.\n\n\
    > Note\nThe argument to @synchronized is used to identify the lock. It can be\
    \ any Objective-C object; self is a convenient choice.\n\nThe code in Listing\
    \ 14.2 is equivalent to the code that the compiler creates when it synthesizes\
    \ a setter method from this property:\n@property (retain) NSString *guitar;\n\n\
    In a multithreaded program, getters also require modification. The following simple\
    \ getter can cause problems in a multithreaded program:"
  merge: -1
