  md: "# Taking Ownership by Copying\n\nYou can also take ownership of an object by\
    \ copying it instead of retaining it.\n\nNote\n\nYou make sure the object's class\
    \ supports copying before you attempt to copy it. A class that is capable of being\
    \ copied must adopt the NSCopying protocol by implementing copyWithZone; or the\
    \ NSMutableCopying protocol by implementing mutableCopyWithZone.\n\nStrictly speaking,\
    \ when you take ownership by copying, you are taking ownership of the newly created\
    \ copy, or retain when taking ownership? It depends on the design of your program\
    \ and needs. If the object is mutable, there is the possibility that something\
    \ retaining the object might modify it. If what you need for the context is a\
    \ snapshot of the way the object is, you should copy it; otherwise, you should\
    \ retain it. Copying is more expensive in execution time and memory than simply\
    \ retaining, particularly if the object in question is complicated and has implemented\
    \ a deep copy.\n\nNote\n\nSome immutable classes implement copy as an additional\
    \ retain and simply return the instead of allocating a new object. For those classes,\
    \ there is no difference between copy and retain.\n\n# dealloc\n\nWhen a release\
    \ message drops an object's retain count to zero, the object is deallocated. But\
    \ what happens to the objects that the deallocated object stored in its instance\
    \ variables pointed to? When a RockStar object is deallocated, what happens to\
    \ the Guitar object stored in its instance variable? The Guitar object received\
    \ a retain message when it was freed (Listing 11). If the RockStar object disappears,\
    \ the Guitar object never gets a balancing release message and is leaked.\n\n\
    To prevent leaks, an object that stores other objects in its instance variables\
    \ must release those objects in a dealloc method. For an example, RockStar overrides\
    \ the object's dealloc method with its implementation:\n\n```\n(void) dealloc\
    \ {\n    [guitar release];\n    // Release any other objects held in instance\
    \ variables.\n    ...\n}\n[super dealloc];\n```"
