  md: '# readwrite,readonly


    If a property is declared readwrite, the property''s value can be set as well
    as retrieved. Both acceptors are synthesized. This is the default. If the property
    is declared readonly, only a getter is synthesized. If you attempt to use the
    (non-existent) method setProperty, your program crashes with a "do not respond
    to selector" exception.


    # nonatomic


    This attribute is a little odd as there is no corresponding atomic keyword. Properties
    that are not declared nonatomic are atomic by default. When you specify nonatomic,
    the compiler synthesizes accessors without thread safety.


    When accessing a property in a multithreaded program, it is possible for a thread
    to be interrupted by another thread before the set or get is completed. If the
    second thread modifies the property during the get, the value returned to the
    first thread can be inconsistent or wrong. To prevent this, you can declare the
    property atomic (by omitting the nonatomic keyword). Then, the synthesized accessors
    will be atomic; a set or get will complete completely without interference from
    another thread. For a non-object property or using garbage collection, the getter
    is a simple return statement and the setter an assignment. The synthesized setter
    and getter use locks to prevent another thread from interrupting the set or get.
    In addition, the getter returns and autoreleases the other thread


    > Note

    This behavior on the part of the getter prevents another thread from releasing
    the object, potentially causing its retain count to go to zero before your thread
    has a chance to use or retain.


    The locks come at a cost in performance, so if you are not writing multithreaded
    code, you should declare your properties nonatomic. Then, the synthesized accessors
    won''t use locks. The getter simply returns the object, and the setter use like
    examples shown in Listings 12.5 and 12.6.


    # setter-name,getter=name


    Normally, the synthesized names for the property myProperty would be setProperty
    and myProperty for the setter and getter, respectively. setter=name and getter=name
    allow you to provide alternate names. The primary use for this is to allow the
    getter for a Boolean property, such as caffeinated, to be named isCaffeinated,
    as shown here:


    ```

    @property (nonatomic, getter=isCaffeinated) BOOL caffeinated;

    ```


    This improves the readability of your code.'
