    by using a mouse, keyboard, or some other input device. The operating system takes
    these interactions, packages them up in a container called an event, and forwards
    the event to the application. The application uses events to manage its internal
    state and display the changes to the screen.


    These are some of the AppKit classes you need to learn about to write a GUI app:


