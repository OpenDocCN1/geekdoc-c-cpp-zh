  md: 'Categories 217


    +   - **Classes that are implemented as class clusters, such as NSString, require
    a lot of work to subclass.** Use a category if you can.


    +   - **Categories have wide visibility.** A method added to a class in a category
    can be used by any instance of that class and any instance of a class that inherits
    from it. This may make the method available on a wider scale than you intended.
    If you find yourself about to add a category on NSObject, such a category is rarely
    a good idea as it will affect every object in your program.


    +   - **Overriding with a category can be dangerous.** Be careful when using a
    category to override an existing method in a class. You should make sure that
    you understand the original method and where it is used before you replace it.


    +   - **Adding instance variables requires.** If you need to add instance variables
    to extend a class, you will have to subclass it.


    +   - *Sometimes, you have no choice but to subclass.* If you need to extend a
    class in different parts of your program, you will probably have to subclass.


    +   - **Classes are intended to be subclassed.** Some classes are partially completely
    abstract and require that you subclass them to make them fully functional. For
    example, UIView. In order to draw or respond to gestures, you must subclass.


    +   - **Try composition.** You can also extend a class by composition. Using composition
    (which is a design pattern rather than a language feature), create an entirely
    new class and instance of the class you are extending in one of the new class''s
    instance variables. Messages that are handled by the original class are passed
    to by the enclosing class. Messages that invoke new functionality are handled
    by the enclosing class.


    This is a long list, but all the items are really variants of the same idea: Think
    before you code.


