  md: '# 8


    # Frameworks


    Imagine that you have some good carpentry skills and need to build a house. You
    could take your tools into the woods and build your house by cutting down trees,
    hewing timber, and making everything that you need, by hand, from the raw materials.
    The resulting cabin might be a gem of craftsmanship, but this is hardly an efficient
    way to obtain a spacious dwelling. A more efficient procedure would be to go to
    your local builder''s store and investigate the fine collection of pre-made doors,
    windows, and other components. The Objective-C equivalent of your local builder''s
    supply store is a set of frameworks you can use in building your applications.
    They are the Objective-C equivalent of Java or C++ class libraries.


    An important attribute of frameworks is that they are dynamically loaded shared
    resources. Only one copy of the executable code or resources that a framework
    contains needs to be present on the system. Memory is shared among all the applications
    that require it. Although disk space seems less of an issue, memory is at premium.


    If you are building a GUI, using frameworks objects for your UI presents a degree
    of uniformity between your UI and that of other applications. This helps users
    because experience gained with other applications transfers to your application.


    This chapter covers what a framework is and how to use frameworks with your program.
    It then goes on to take a reader''s look at some of the frameworks you are likely
    to encounter writing Mac OS X or iOS programs. The next chapter delves into the
    Foundation framework in more detail. The Foundation framework defines NSObject,
    the root class for Objective-C objects, classes for strings, arrays, sets, dictionaries,
    and number objects, as well as objects that wrap interactions with the OS.


    # What Is a Framework?


    A framework is a type of bundle—a directory hierarchy with a specified Layout
    that groups shared dynamic libraries, header tiles, and resources (images, sounds,
    nib files) in a single place. The shared dynamic libraries that you need for Mac
    OS X and the iPhone'
