  md: '# Objective-C Additions


    This section is a brief summary of the additions that Objective-C makes to C.


    # Runtime


    Objective-C requires a runtime. The runtime is a dynamic link library of C functions
    that is provided on all systems that support Objective-C. It does the work of
    setting up and operating the Objective-C messaging system. The runtime does its
    work silently, behind the scenes. In normal circumstances, there is no need to
    interact with the runtime directly by calling one of its functions.


    # Names


    Like plain in the object part of Objective-C are case sensitive. Objective-C has
    a number of naming conventions such as the naming conventions for classes and
    methods noted earlier in the chapter. These conventions are not an enforced policy
    of the language, but they are almost universally followed. If you violate them,
    people familiar with Objective-C will have a difficulty following your code. Some
    other rules:


    +   * A class can declare an instance variable that has the same name as an instance
    variable in a different class.


    +   * A class can declare a method that has the same name as a method in a different
    class, as was shown in the section on polymorphism earlier in the chapter.


    +   * A method can have the same name as an instance variable. (This is common
    for methods that return the value of an instance variable. See Chapter 12, "Properties").


    +   * Apple considers method names that begin with an underscore character (_)
    to be reserved for internal Apple use.


    # Message Expressions


    The most important addition that Objective-C makes to C is the message expression:


    ```

    [receiver message]

    ```


    The receiver is an object, strictly speaking, to an instance of a class. The message
    is the name of one of the methods defined by the receiver''s class plus any arguments
    that the method takes. When a statement calling a message expression is executed,
    the Objective-C runtime determines the receiver''s class and looks up the method
    name contained in message in the class''s list and executes the code corresponding
    to that method. Message expressions are covered in Chapter 5.'
