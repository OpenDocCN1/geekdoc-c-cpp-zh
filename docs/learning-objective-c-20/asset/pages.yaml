  md: '# Chapter 13 Protocols


    # Note


    When you code a class that adopts an informal protocol, the protocol method implementations
    must go in the class''s @implementation section, not in a category @implementation
    section. If you place the implementations in a separate category @implementation
    section, your method implementations are added to all classes (assuming the protocol
    is declared as a category on NSObject). This is unlikely to be what you intended
    to do.


    So what''s the point of using informal protocols? Before C-2.0, all the methods
    in a formal protocol were required. The only way to have optional methods in a
    formal protocol was to use informal protocol and note the methods in the documentation.
    With the advent of @optional there isn''t much reason to use an informal protocol:
    You can have optional methods and still enjoy the benefits of a formal protocol.


    You can see this progression in the Apple frameworks: In earlier versions of the
    AppKit, NSTableView (the data source protocol for AppKit NSTableView) was an informal
    protocol. Beginning in Mac OS X Leopard (v10.6), NSTableViewDataSource was replaced
    with the NSTableViewDataSource protocol.


    # Summary


    Protocols allow flexibility program design by letting you define object behavior
    rather than class. There are many situations where all that is required of an
    object is that it implement a particular set of methods. In these situations,
    the object''s class and behavior are immutable. Protocols let you formalize this
    pattern:


    +   - You declare a protocol by giving it a name and declaring its methods between
    @protocol and @end.

    - Protocol methods may be either @required or @optional.

    - A class adopts a protocol by implementing all of the protocol''s required methods
    and, perhaps, some or all of the protocol''s optional methods. The class advertises
    that it has adopted the protocol by appending the protocol name inside brackets
    after the superclass name on the class @interface The header line containing the
    protocol declaration must be visible to the adopting class''s @interface section.

    - You can add a protocol name to the declaration of an instance variable or a
    method argument. If you do this, the compiler checks to see that an object that
    you assign to the instance variable or use as the method argument adopts the specified
    protocol.

    - You can use the class or the instance version of conformsToProtocol: to see
    if a given class or a given object adopts a particular protocol.

    - Before calling an @optional method, you should use respondsTo: to make sure
    the receiver has implemented the method.'
