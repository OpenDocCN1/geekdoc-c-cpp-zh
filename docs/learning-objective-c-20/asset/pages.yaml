  md: 'Preface xxvii


    called a retain count, of the number of other objects that are using it. When
    that count falls to zero, the object is deallocated. This chapter covers the rules
    needed to keep your retain counts in good order.


    +   - Chapter 15,"Garbage Collection," describes Objective-C 2.0''s new automatic
    garbage collection system. Using garbage collection, a separate thread called
    the garbage collector, is responsible for determining which objects are no longer
    needed and freeing them. Garbage collection relieves you of memory management
    chores.

    - Chapter 16,"Blocks," discusses Objective-C 2.0''s new Blocks feature. A block
    is similar to an anonymous function, but in addition, a block carries the values
    of the variables in its surrounding context with it. Blocks are a central feature
    of Apple''s Grand Central Dispatch concurrency mechanism.


