    ```

    (int n){ return n*2; };

    ```


    You can call a block literal directly by appending values for its arguments in
    parentheses:


    ```

    int j = ^int n)(n*2)(9); // j is now 18

    ```


    This works, but it is a bit silly; you could get the same result by simply coding
    the following:


    ```

    int j = 2 * 9;

    ```


    In normal use, a block literal is assigned to a typed pointer to a block, or used
    as an argument to a function or a method that takes a pointer to block argument.


    # Block Pointers


    A variable that is a block pointer (a pointer to a block) is declared as follows:


    ```

    return_type (^name)(List of argument types);

    ```


    This should look familiar; it has exactly the same form as the declaration of
    a function pointer, except that the * has been replaced with a ^.


    > Note

    ''t refer to a variable that holds a block pointer as a block variable. As you
    will see later in the chapter, the term block variable is reserved for a different
    entity.


    This example illustrates how to declare a block pointer, assign a block to it,
    and then call through the block pointer:


    ```

    int (^double)(int); // double is typed as a pointer to a block

    double = ^int(int n){ return n*2; };

    int j = double( 9 ); // j is now 18

    ```


    You can use block pointers as arguments to a function or a method:


    ```

    // someFunction is a function that takes a block pointer as an argument

    void someFunction(int (^blockArg)(int int));

    ```'
