  md: "# # Receiving Objects\n\nSo far, reference counting may seem like just a fancy\
    \ name for \"remember\" to free what you have allocated.\" Its real usefulness\
    \ becomes apparent when you start passing objects around from one method to another.\n\
    \nAn object received from another method is presumed to remain for the remainder\
    \ of the receiving method. In the following example, NSObject's date method returns\
    \ an object that represents the current time and date:\n\n```\n(void)doSomethingWithCurrentDate\n\
    {\n    NSDate *currentDate = [NSDate date];\n\n    // currentDate is used, but\
    \ not stored in an instance variable\n}\n```\n\nThe method doSomethingWithCurrentDate\
    \ can use currentDate until it returns, without worrying that currentDate will\
    \ be deallocated.\n\n> > Note\nThis condition is only true in a single threaded\
    \ program, in a multithreaded program, it is possible for another thread to deallocate\
    \ the received object before the receiving method returns. Methods that return\
    \ objects in a multithreaded environment require special care if you want them\
    \ to meet this condition (See the section Multithreading later in this chapter).\n\
    \nIf you want to store a received object in an instance variable and continue\
