  md: 'OS development are wrapped in frameworks. The name of a framework bundle always
    has the form .framework.frameworkName.framework


    A framework can wrap a dynamic library written in any language, but the frameworks
    that you are most likely to encounter either Objective-C or plain C interfaces.


    > Note

    Frameworks are very common in Mac OS and iOS programming, but you can also link
    to any regular static or dynamic libraries that your program requires.


    # Using a Framework


    To use an Objective-C framework, you have to import the header files for any frameworkdefined
    classes or functions that you are going to use in code. Most frameworks have a
    group header that imports all the individual header files for the framework. Some
    frameworks are umbrella.frameworks. Umbrella frameworks are frameworks that contain
    two or more frameworks.


    The following line imports all the relevant header files for the classes in the
    Foundation framework:


    ```

    #import <Foundation.h>

    ```


    A group import doesn''t cause program bloat; it makes all the classes in the framework
    available. Importing the proper header files keeps the compiler happy. You also
    have to keep the linker happy by telling it to add the framework to its list of
    places to look for based of executable code. Xcode automatically adds the required
    frameworks (based on the project) if you go to the General and Build Phases tab
    of your Xcode project window and right-click (control-click) on the External Frameworks
    and Libraries folder. Then choose

    Adding Frameworks from the popup menu as shown in Figure 8.1.


    If you are compiling your program from the command line, using the GNU compiler,
    you have to pass the gcc flag for any frameworks you are using. You do this with
    a -framework flag followed by the name of the framework minus the extension. For
    example:


    ```

    gcc myProgram.m -framework Foundation

    ```


    If you are using multiple frameworks, you have to list them all on the gcc command
    line, each with its own -framework flag.


    ```

    gcc myProgram.m -framework Foundation -framework CoreFoundation

    ```'
