  md: "# Garbage Collection Pro and Con\n\nNSUinteger length = [mutableData length];\n\
    Because the compiler thinks mutableData is no longer needed (it doesn't understand\
    \ the relationship of mutableBytes to mutableData), it stakes mutableData's slot\
    \ on the stack for another variable (it, every the compiler stores another variable\
    \ at the address on where mutableData was stored). If the collector wakes up and\
    \ runs the while loop notices that there is no longer reference to mutableData.\
    \ The collector collects mutableData leaving mutableBytes pointing to memory that\
    \ has been released and may be reallocated to a different object.\nYou can fix\
    \ this by placing a message (any message) to mutableData after the while loop:\n\
    \n```\nNSmutableData *mutableData = ...\nchar *bytes = [mutableData mutableBytes];\n\
    NSUinteger length = [mutableData length];\n{\n    // Do something with mutableBytes.\n\
    \    length--;\n}\n[mutableData self];\n```\n\n[mutableData self] doesn't really\
    \ do anything—it returns a pointer to mutableData, which isn't discarded—but it\
    \ is enough to keep the compiler giving away mutableData's spot on the stack until\
    \ after the while loop completes.\n\n# Falsely Rooted Objects\n\nAnother oddity\
    \ is that, due to the way the stack is implemented, the collector can't always\
    \ determine exactly where the stack ends. To avoid leaks, the collector errs on\
    \ the side of caution and looks for objects beyond the nominal end of the stack.\
    \ If the collector finds a pointer to an object that was left on the stack from\
    \ a previous call, the object becomes falsely rooted. The collector considers\
    \ it a root object and doesn't collect it even though it is not. The Following\
    \ function fixes this by zeroing out the unused portions of the stack:\nobjc_clear_stack(OBJ_CLEAR_RESIDENT);\n\
    \nIf you are writing a GUI program, you don't have to worry about this. The AppKit\
    \ arranges to call objc_clear_stack periodically. However, if you are writing\
    \ a Foundation program, you may want to call objc_clear_stack yourself.\n\n# Garbage\
    \ Collection Pro and Con\n\nUsing garbage collection is an option, not a requirement.\
    \ The following sections list some the things that you should consider when deciding\
    \ whether to use garbage collection in your applications."
