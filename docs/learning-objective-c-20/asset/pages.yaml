    # Dot Synax Doesn''t Access Instance Variables


    The similarity between the dot syntax for accessor methods and the syntax for
    referencing an element of a C structure leads some people to assume that the dot
    syntax is accessing instance variables directly. If that were true, it would be
    a gross violation of the "information hiding" principle. The dot syntax just invokes
    the appropriate accessor method. Any side effects (retain, release, copy, or anything
    else) happen just if you had coded that statement using the traditional syntax...


    One situation where you have to pay attention to this is when you use an object''s
    instance variables inside its own methods. Consider the Employee class from Listing
    12.2. Coding the following:


    ```

    name = new;

    ```


    inside one Employee''s methods sets the instance variable name directly with an
    assign.


    Using the dot syntax like this:


    ```

    self.name = new;

    ```


    sets name using the -setname: method. This is not a trivial difference: in the
    second example, newname is retained; whereas it isn''t in the first example.


