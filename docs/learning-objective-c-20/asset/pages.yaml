  md: '# Chapter 1 C, The Foundation of Objective-C


    > Note


    The standard I/O library is one of set of libraries of functions that is provided
    with every C environment.


    To use the functions in the I/O library, you must include the library''s header
    file in your program:


    ```

    #include <stdio.h>

    ```


    The only function covered here is printf, which prints a formatted string to your
    terminal (or to the Xcode console window if you are using Xcode). The printf takes
    a variable number of arguments. The first argument to printf is a format string.
    Any remaining arguments are quantities that are printed out in a manner specified
    by the format string:


    ```

    printf(format, argument1, argument2, ... argumentN);

    ```


    The format string consists of ordinary characters and conversion specifications:


    +   - Ordinary characters (not %) in the control string are sent to the output.

    - Conversion specifications begin with a percent sign (%). The letter indicates
    the type of argument the specifier expects.

    - Each conversion specification consumes, in order, one of the arguments following
    the format. The argument is converted to characters that represent the value of
    the argument and the characters are sent to the output.


    The only conversion specifics used in this book are %d, for char and int, %f for
    float and double, and %s for C strings. C strings are typed as char*.


    Here is a example:


    ```

    int my = 9;

    float myFunction = 3.145926;

    char* myst = "a C string";

    ```


    ```

    printf("This is an Integer: %d, a float: %f, and a string: %s.\n",

    my, myFunction, myst);

    ```


    > Note


    The \n is the newline character. It advances the output so that any subsequent
    output appears on the next line.


    The result of the preceding example is:


    This is an Integer: 9, a float: 3.145926, and a string: a C string.


    If the number of arguments following the format doesn''t match the number of conversion
    specifications, printf ignores the excess arguments or prints garbage for the
    excess specifications.'
