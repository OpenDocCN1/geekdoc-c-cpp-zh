    ```\n\nTesting for protocol conformance is an example of defensive coding. With\
    \ a few extra lines of code, you can prevent a run crash.\n\n# Informal Protocols\n\
    \nThe protocols discussed in this chapter are called formal protocols. A formal\
    \ protocol is declared with a @protocol statement. Classes that adopt a formal\
    \ protocol are marked with a @protocolName on the class's Interface line. Objective-C\
    \ also has informal protocols. Like formal protocols, informal protocols are a\
    \ group of related methods that a class might want to implement. An informal protocol\
    \ declares its methods in a category (usually a category on NSObject), but without\
    \ a corresponding category implementation:\n\n```\n@interface NSObject (MyInformalProtocol)\n\
    \n-(void)informalProtocolMethod;\n\n@end\n```\n\nAn informal protocol is actually\
    \ in the nature of a gentle-person's agreement on the part of the programmer writing\
    \ a class that adopts the protocol. The programmer agrees to implement the protocol\
    \ methods when coding that class, but the cluster does nothing to check if he\
    \ or she follows the agreement. The category functions as a piece of documentation\
    \ listing the methods in the protocol. There is no type checking at compile time\
    \ and no way of determining at runtime if a class implements an informal protocol.\
    \ Classes that adopt an informal protocol must declare the protocol in their interface\
    \ section and put the code for those methods in their implementation section."
