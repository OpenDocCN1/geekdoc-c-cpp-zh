    You can create dictionaries and access items via a key. This is any type which
    cannot b changed. The values can be any type of  objects,  including other dictionaries.
    The format of making  a dictionary is below:


    dictionary = { “key name” : value }


    Any type allowed in key name and values. For example:


    Dictionary = { ”Batman” : “Spiderman” , 2 : “Superman” , 3 : [ “Thor” , “Hulk”
    ] };


    Notice that the brackets used in dictionaries are curly braces, the separator
    between a key word and its associated value is a colon. And the each key and its
    value is separated from other keys and their values is separated by a comma. This
    is just some of things that  can cause syntax error in your programming.


    There are some important points about dictionaries:


    *   In dictionaries we have mapping not sequence, therefore sequence operations
    don’t work. Function like concatenation and slicing don’t work because there is
    no order to dictionary item.


    *   Keys can be created by adding new values to an existing dictionary or when
    you making a dictionary. The process is similar and the end result is the same.


    *   Keys can be anything immutable.


    There are some built-in functions in dictionaries with their description:


    | Functions |               Description              |


    | cmp(dict1 , dict2) | Compare elements of dict |


    | str(dict) | It can produces a printable string representation of a dictionary.
    |


    | len(dict) | It provides total length of  the dictionary and this would  be equal
    to the number of elements in the dictionary |


    | type(variable) | It returns the type of the passed variable. If passed variable
    is dictionary, then it would return a dictionary type. |


    There are some basic methods in Python dictionary:


    | Methods | Description |


    | dict.clear( ) | With using this we can remove all the items in dictionary dict.
    |


    | dict.copy( ) | With using this we can copy the elements of dictionary dict.
    |


    | dict.fromkeys( ) | In this method we create a new dictionary with keys from
    seq and values. |


    | dict.has_key(key) | It will give a true if key is in the  dictionary dict, otherwise
    false. |


    | dict.items( ) | It will return a list of dict’s tuple pairs. |


    | dict.key( ) | This method is returns a list of keys in the dictionary. |


    Tuples


    The final built-in type in Python is tuple. A tuple is a sequence of values. Any
    type of value can be used in and they are indexes by integers, Therefore they
    are not like for list. They are work like a Python list except they are immutable
    mean they can’t be changed in place. They are usually written in the parentheses
    to distinguish them from the lists in which we use square brackets. But sometimes
    parentheses are not necessary. Their length is fixed. A new tuple must be created
    when we need to grow  or shrink a tuple.


    Tuples are immutable therefore they can be used to store different data about
    a certain thing. The most important thing is that standard operations like slicing
    and iteration return new tuple objects. In Python programming there are a few
    times when you simply have to use a tuple because your code requires it.


    There are some other  reasons to use tuples:


    *   The speed  of proceeding is faster than list. You must use a tuple when you
    are creating a constant set of values that would not change and you need to simply
    iterate through them.


    *   The sequences within a tuple are essentially protected from modification.'
