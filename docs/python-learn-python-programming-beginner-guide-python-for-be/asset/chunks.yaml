  trans: "\n变量是一个引用某个值的名称。它是一个可以让你存放东西的地方。编程语言最强大的特性之一就是操纵变量的能力。\n\n为了创建新变量，我们使用赋值运算符并给它们赋值：\n\
    \n```python\nresult = ‘easily done’\nx = 88\ng = 9.8 \n```\n\n在上述示例中，我们使用了三个变量。第一个将一个字符串赋值给名为\
