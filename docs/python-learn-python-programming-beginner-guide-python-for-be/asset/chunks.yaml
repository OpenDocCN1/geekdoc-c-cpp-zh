    \ real numbers |\n\n# Decision Making in Python\n\nIn our daily life we often\
    \ make decision according to conditions. For example if we have $5 then we buy\
    \ a cricket bat otherwise not. This example shows that if the first condition\
    \ is true than we can proceed more , it not then we do some other task. As it\
    \ is Python provides us this type of conditions statements in programming to make\
    \ decision. Decision structure evaluates multiple expressions which produce true\
    \ or false as outcome. In Python programming zero and null values assumes as false\
    \ others are true.\n\nIn Python we have following types of decision making statements:\n\
    \n## `if` Statement:\n\nIt is similar to C language. In `if` statement we give\
    \ it some conditions which data is compared and a decision is made. If the condition\
    \ is the satisfy then statement print.\n\n### Syntax\n```python\nif (condition)\n\
    \    statement\n```\n\n### Example:\n```python\nnum1 = 2\nif num1:\n    print\
    \ “Expression is true”\n    print num1\n\nnum2 = 0\nif num2:\n    print “Expression\
    \ is False ”\n    print num2\n\nprint “Its Over”\n```\n\nThe block of statements\
    \ inside the `if` statement can be executed if Boolean expression evaluate to\
    \ true. If Boolean expression evaluates to false, then the next code after the\
    \ end of the `if` statement is executed. `if-statemnt` can be coded in a single\
    \ line.\n\n### Example:\n```python\nnum = 1\nif ( num== 1 ) : print \"one-line\
    \ if\"\n```\n\n## `if-else` statement:\n\nIf the condition of it statement is\
    \ false and then the control of execution jumped to first statement after the\
    \ `if` statements, If we use `else` statement then it execute after the `if` statement.\
    \ An `else` statement combined with and `if` statement. It is optional statement\
    \ and mostly use once in the `if-else` statements block.\n\n### Syntax\n```python\n\
    if (conditon):\n    statement\nelse:\n    statement\n```\n\n### Example:\n```python\n\
    num1 = 0\nif num1:\n  print \"Expression is true\"\nelse:\n    print \"Expression\
    \ is false\"\n```\n\n## The `elif` Statement:\n\nIf we want to check multiple\
    \ expressions for true and execute a block of statements as soon as one of the\
    \ conditions evaluates to true, we have `elif` Statement to perform this type\
    \ of task.\n\nIt is optional as `else` statement. We mostly use just one `else`\
    \ statement in block but there can be many number of `elif` statements.\n\n###\
    \ Syntax\n```python\nif (condition1):\n    statement\nelif(condition2):\n    statement\n\
    elif(condition3):\n    statement\nelse:\n    statement\n```\nit is similar to\
    \ switch case statements in other languages.\n\n### Example:\n```python\nnum =\
    \ 1\nif num == 2:\n print \"True Expression 1\"\nelif num == 3:\n print \"True\
    \ Expression 2\"\nelif num == 1:\n print \"True Expression 3\"\nelif num == 1:\n\
    \ print \"True Expression 4\"\nelse:\n print \"No one match!\"\n```\nIf no one\
    \ can match with the true expression than `else` statement will be printed.\n\n\
    # Loops\n\nWhen we need to repeat the execution of block of code several times\
    \ then we use loops in Python. In programming languages there are various control\
    \ structures that allows for more complicated path.\n\nA simple loop statement\
    \ allows us to execute a block of code multiple times.\n\nTo handling the looping\
    \ requirements Python provides following types of loops:\n\n## `While` Loop:\n\
    \nIf the given condition is true , `while` loop repeatedly executes a statement\
    \ until it becomes false.\n\n### Syntax\n```python\nwhile (condition):\n    statement\n\
    \    increment\\decrement\n```\n\nFirst of all we declare a variable above the\
    \ `while` loop. Then we give condition in the parentheses. In condition we may\
    \ use relational operators. Then we write statement of the loop, if statement\
    \ is true loop executes again and again until is false. Statement may be single\
    \ line or a block of statements. After the statement we mention the increment\
    \ or decrement in the last of the loop. If loop executes first time than second\
    \ time it will executes with that increment or decrement. This process executes\
    \ until the condition becomes false.\n\n### Example:\n```python\nvalue = 0\nwhile\
    \ (value <5):\n    print ‘The value is:’, value\n    value= value +1\nprint “Its\
    \ Over”\n```\nThis block is consisting only print and increment statements, Its\
    \ increase the value 1 after every cycle of loop. When value increase by 4 the\
    \ condition becomes false and it stop working.\n\n### Using `else` statement with\
    \ `While` Loop:\n\nPython supports to have an `else` statement associated with\
    \ the `While` Loop statement. If the `else` statement is used with the `while`\
    \ loop, the `else` statement is executed when the condition becomes false.\n\n\
    ## `For` Loop:\n\n`For` loop has ability to repeat over the items of any sequence,\
    \ such as a list or a string. Expression list evaluated first if a sequence contain\
    \ any of this. Then the first item in the sequence is assigned to the iterating\
    \ variable. After this the statement block is executed. Each time in the list\
    \ is assigned to iterating variable, and the statement block is executed until\
    \ the entire sequence is exhausted.\n\n### Syntax\n```python\nfor iterating_var\
    \ in sequence:\n    statements\n```\n\n### Example:\n```python\nfor letter in\
    \ ‘Python’:\n    print ‘Current Letter  : , letter\nprint “Its Over”\n```\n\n\
    ### Using `else` statement with for loops:\n\nIn Python we can use `else` statement\
    \ with `for` loop. The `else` statement is executed when the loop has exhausted\
    \ iterating the list.\n\n## Nesting of Loops:\n\nA loop or many loops inside a\
    \ loop is called nesting of loops. Python programming allows to nesting of loops.\n\
    \n### `For` Loop Syntax\n```python\nfor iterating_var in sequence:\n    for iterating_var\
    \ in sequence:\n        statements\n        statements\n```\n\n### `While` Loop\
    \ Syntax\n```python\nwhile(conditon):\n    while(condition):\n        statements\n\
    \        statements\n        increment\\decrement\n```\n\n## Loop Control Statements:\n\
    \nTo change the normal loop execution we use loop control statements. In Python\
    \ we have following control statements:\n\n### `Break` Statement:\n\nIt performs\
    \ the same work as `break` statement in C. Its stop the execution and jumped out\
    \ the execution from the loop block. The `break` statement used in both for and\
    \ while loops. If you are using nested loops, the `break` statement stops execution\
    \ of the innermost loop and start the next line of code after the block.\n\n###\
    \ Syntax\n```python\nbreak\n```\n\n### Example:\n```python\nfor letter in ‘ Python’\
    \ :\n    if letter == ‘h’ :\n        break\nprint ‘ Current Letter :’ , letter\n\
    ```\n\n### `Continue` Statement:\n\nWhen the `continue` statement used in looping\
    \ its return the control to the beginning of the loop. It cannot execute the remaining\
    \ statements in the current iteration of the loop and moves the control back to\
    \ the top of the loop.\n\n### Syntax\n```python\ncontinue\n```\n\n### Example:\n\
    ```python\nfor letter in ‘Python’:\n if letter == ‘o’:\n continue\nprint ‘Current\
    \ Letter :’ , letter\nprint “Its Over”\n```\n\n### `Pass` Statement:\n\nNothing\
    \ happened when it executes, it is a null operation. It is useful in places where\
    \ the code will eventually go, but has not been written yet.\n\n### Syntax\n```python\n\
    pass\n```\n\n### Example:\n```python\nfor letter in ‘Python’ : own    if letter\
    \ == ‘h’:\n        pass\n    print ‘This is pass block’\nprint ‘Current Letter\
    \ :’ , letter\n```\n\n# Lists\n\nLike a string, list is a sequence of values.\
    \ The most basic data structure in Python is sequence. Each element in the sequence\
    \ have its own position or index. The first position is always zero, second is\
    \ one and so on. In strings we have only values of characters but in a list they\
    \ can be any type. The values in list called elements or sometimes items.\n\n\
    The creating of list is so easy, we can create a list just using square brackets.\
    \ Elements are enclose in it and put the comma to separated elements.\n\n### Example1:\n\
    ```python\nList1 = [10, 20, 30, 40];\n```\n\n### Example2:\n```python\nList2 =\
    \ [‘June’, ‘July’, ‘August’ ];\n```\n\n### Example3:\n```python\nList3 = [‘march’,\
    \ 2.1 , 5 ]:\n```\n\nIn first example we simple use integers in list. In second\
    \ , strings are used and in third example we use string, float and integer.\n\n\
    A list contain no element is called an empty set. You can create empty list by\
    \ brackets [].\n\n## Access Values in List:\n"
