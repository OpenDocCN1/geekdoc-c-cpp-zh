- fmt: '

    A program is a combination of lines of code/instructions that specifies how to
    perform a computation. The computation might be something mathematical, such as
    solving equations or finding the roots of a polynomial, but it can also be symbolic
    computation such as searching and replacing text in a document or compiling a
    program.


    There are some instructions in every language:


    * Input: Getting data from user through keyboard or other input device

    * Output: Displayed data on screen or other output device.

    * Math: Perform basic mathematical operations.

    * Conditional execution: Check for certain conditions and execute the appropriate
    code.

    * Repetitions: Perform some action repeatedly, usually with some variation.


    ## What is debugging?


    Programming errors are called bugs and the process of tracking them down is called
    debugging.


    There are three types of errors in programming:


    ### Syntax Error

    Python can only executes a program if the syntax error is correct; otherwise the
    interpreter displays an error message. Syntax are rules about structure. For example,
    parentheses have to come in matching pairs so `(1+3)` is legal, but `3)` is a
    syntax error.


    During the first few weeks of your programming, you will probably spend a lot
    of time tracking down syntax error. As you gain experience, you will make fewer
    errors and find them faster.


    ### Runtime Error

    The second type of error is a runtime error, so called because the error does
    not appear until after the program has started running. These errors are also
    called exceptions because they usually indicate that something exceptional (and
    bad) has happened.


    ### Logical Error

    The third one is logical error. If there is a logical error in your program, it
    will run successfully in the sense that the computer will not generate any error
    message, but it will not do the right thing it will do something that we are not
    excepting. Specifically it will do what you told to it to do. Its occur due to
    make wrong logic of program.


    Before we start our first program in Python we must know some terminologies and
    their functions in a short way. It will clear the concept of beginners and be
    a very helpful for them.


    * **Problem solving**: The process of formulating a problem, finding a solution,
    and expressing the solution.

    * **High-level language**: A programming language like `Python` that is designed
    to be easy for humans to read and write.

    * **Low-level language**: A programming language that is designed to be easy for
    a computer to execute; also called “machine language” or “assembly language.”

    * **portability**: A property of a program that can run on more than one kind
    of computer.

    * **interpret**: To execute a program in a high-level language by translating
    it one line at a time.

    * **Compile**: To translate a program written in a high-level language in a low-level
    language all at once, in preparation for later execution.

    * **Source code**: A program in a high-level language before being compiled.

    * **Object code**: The output of the compiler after it translates the program.

    * **Executable**: Another name for object code that is ready to be executed.

    * **Prompt**: Characters displayed by the interpreter to indicate that it is ready
    to take input from the user.

    * **Script**: A program stored in a file (usually one that will be interpreted).

    * **Interactive mode**: A way of using the Python interpreter by typing commands
    and expressions at the prompt.

    * **Script mode**: A way of using the Python interpreter to read and execute statements
    in a script.

    * **Program**: A set of instructions that specifies a computation.

    * **Algorithm**: A general process for solving a category of problems.

    * **Bug**: An error in a program.

    * **Debugging**: The process of finding and removing any of the three kinds of
    programming errors.

    * **Syntax**: The structure of a program.

    * **Syntax error**: An error in a program that makes it impossible to parse (and
    therefore impossible to interpret).

    * **Exception**: An error that is detected while the program is running.

    * **Semantics (logic)**: The meaning of a program.

    * **Semantic (Logical) error**: An error in a program that makes it do something
    other than what the programmer intended.

    * **Token**: One of the basic elements of the syntactic structure of a program,
    analogous to a word in a natural language.

    * **Parse**: To examine a program and analyze the syntactic structure.

    * **Print statement**: An instruction that causes the Python interpreter to display
    a value on the screen.

    * **Value**: One of the basic units of data, like a number or string, that a program
    manipulates.

    * **Type**: A category of values. The types we have seen so far are integers (type
    `int`), floating point numbers (type `float`), and strings (type `str`).

    * **Integer**: A type that represents whole numbers.

    * **floating-point**: A type that represents numbers with fractional parts.

    * **String**: A type that represents sequences of characters.

    * **Variable**: A name that refers to a value.

    * **Statement**: A section of code that represents a command or action. So far,
    the statements we have seen are assignments and print statements.

    * **Assignment**: A statement that assigns a value to a variable.

    * **State diagram**: A graphical representation of a set of variables and the
    values they refer to.

    * **Keyword**: A reserved word that is used by the compiler to parse a program;
    you cannot use keywords like `if`, `def`, and `while` as variable names.

    * **Operator**: A special symbol that represents a simple computation like addition,
    multiplication, or string concatenation.

    * **Operand**: One of the values on which an operator operates.

    * **Floor division**: The operation that divides two numbers and chops off the
    fraction part.

    * **Expression**: A combination of variables, operators, and values that represents
    a single result value.

    * **Evaluate**: To simplify an expression by performing the operations in order
    to yield a single value.

    * **Rules of precedence**: The set of rules governing the order in which expressions
    involving multiple operators and operands are evaluated.

    * **Concatenate**: To join two operands end-to-end.

    * **Comment**: Information in a program that is meant for other programmers (or
    anyone reading the source code) and has no effect on the execution.


    ## The First Program


    In all the new languages the first program is called “Hello World” because all
    it dose is display the word “Hello World”.


    In Python:


    ```python

    Print ‘Hello World’

    ```


    This is a simple example of print statement, which doesn’t actually print anything
    or paper. It displays a value on the screen. In this case, the result is the words


    Hello World


    The quotation marks in the program mark the beginning and end of the text to be
    displayed; they don’t appear in the result.


    In Python 3, the syntax for printing is slightly different:


    ```python

    print(''Hello, World!'')

    ```


    The parentheses indicate that `print` is a function. If you are using Python 3,
    you will have to translate. But other than that, there are very few differences
    we have to worry about.


    ## Values and Types


    Letter and numbers are known as values in program.


    Example: 1, 20, Hello etc.


    These values have some different types. In above examples ‘1’ is integer and “Hello”
    is string, you can identify strings because they are enclosed in quotations marks.


    If you are not sure what type a value has, the interpreter can tell you.


    ```python

    type(''Hello'')

    ```

    <type ''str''>


    ```python

    type(49)

    ```

    <type ''int''>


    The keywords using in python for integers are `int` and for string is `str`. We
    cannot use their full name. Integers are use for only whole numbers in which no
    decimal point is used. Numbers with a decimal point belong to a type called `float`,
    because these are represented in a format called floating-point. Float also called
    real numbers.


    Example:


    ```python

    type(8.8)

    ```

    <type ''float''>


    If the numbers coded in the quotations form they also became a string:


    ```python

    type(''49'')

    ```

    <type ''str''>


    ```python

    type(''8.8'')

    ```

    <type ''str''>


    They are strings.

