    *   变量名内部不允许有空格或空白。\n*   第一个字符必须是字母。\n*   可以是字母数字。\n*   永远重复使用相同的名称。\n*   可以是大写，但用小写字母开始变量名是个好主意。\n\
    \n优秀的程序员会为他们的变量选择有意义的名称，并在程序中使用它们。\n\n如果你给了一个非法的名称，就会得到语法错误。\n\n```python\n20level\
    \ = 'Final round'\nSyntaxError: invalid syntax\n\ngood@ = 1000000\nSyntaxError:\
    \ invalid syntax\n\nclass = 'look good'\nSyntaxError: invalid syntax\n```\n\n\
    `20level` 是非法的，因为它不是以字母开头。`good@` 是非法的，因为它包含非法字符 `@`。但 `class` 有什么问题呢？事实证明 `class`\
    \ 是 Python 的关键字之一。解释器使用关键字来识别程序的结构，它们不能用作变量名。\n\n## 关键字\n\n这些词在编程语言中已经解释了含义。关键字不能用作变量名，因为如果我们这样做，我们就是在尝试给关键字赋予新的含义，这是计算机不允许的。\n\
    \n每个关键字都执行一项特定的任务。\n\n下表是 Python 编程中一些重要的关键字：\n\n| And | del | from |\n| :---\
    \ | :--- | :--- |\n| Not | while | as |\n| Assert | elif | global |\n| Or | with\
    \ | else |\n| If | pass | yield |\n| Break | except | import |\n| Print | class\
    \ | exec |\n| In | raise | continue |\n| Finally | is | return |\n| Def | lambda\
    \ | for |\n| Try | | |\n\n## 运算符和操作数\n\n加法和乘法等计算工作是通过运算符执行的。运算符应用的值被称为操作数。运算符是能够操纵操作数值的结构。\n\
    \n一些基础运算符包括：\n\n1. 算术运算符\n* 比较（关系）运算符\n* 赋值运算符\n* 逻辑运算符\n\n## 算术运算符：\n\n有一些实用的算术运算符：\n\
    \n| + | 加法 | * | 乘法 |\n| :--- | :--- | :--- | :--- |\n| - | 减法 | / | 除法 |\n| **\
    \ | 幂 | % | 取模 |\n| // | 整除 | | |\n\n如下例所示：\n\n```python\n2+3 hour-1 hour*2+minute\
    \ minute/30 2**5 (x+2)*(y-22)\n```\n\n在 Python 中，没有必要声明。在其他语言中，你必须先声明再初始化，这两个步骤在代码同一行中完成。例如在\
    \ C++ 中：\n\n```cpp\nint a = 3; // 整数的内联初始化\nfloat b;\nb = 4.0 f ; // 浮点数的顺序初始化\n\
    ```\n\n在这里你可以看到初始化是至关重要的。在 Python 中，声明是不必要的。在这里你可以看到初始化是至关重要的。例如：\n\n```python\n\
    a = 60\nb = 13\n```\n\n现在在二进制格式下它们将如下：\n\n```\na = 0011 1100\nb = 0000 1101\n\
    ```\n\n在 Python 中，`a` 的：\n\n```python\na = 3 整数\nb = 4.0 # 浮点\n```\n\n## 比较（关系）运算符\n\
    \n这些运算符决定两个值之间的关系。\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| == | 等于 |\n| != | 不等于 |\n\
    | > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n\n## 赋值运算符\n\n在 Python 中使用了一些赋值运算符。\n\
    \n| 运算符 | 说明 |\n| :--- | :--- |\n| = | 将右侧赋值给左侧 |\n| += | 相加并赋值 |\n| -= | 从左侧减去右侧并赋值\
    \ |\n| *= | 相乘并赋值 |\n| /= | 左侧除以右侧并赋值 |\n| **= | 幂并赋值 |\n| %= | 取模并赋值 |\n| //=\
    \ | 整除并赋值 |\n\n## 逻辑运算符\n\nPython 编程中使用的逻辑运算符：\n\n| 运算符 | 说明 |\n| :--- | :---\
    \ |\n| and | 仅当两个条件都满足时 |\n| or | 仅当一个条件为真时 |\n| not | 反转结果 |\n\n## 成员运算符\n\n\
    只有两个成员运算符。它们测试序列（如元组、列表或字符串）中的成员身份。\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| in | 仅当在指定序列中找到变量时为真\
    \ |\n| not in | 仅当不在指定序列中找到变量时为真 |\n\n## 位运算符\n\n它们按位执行操作并对位工作。Python 中使用一些位运算符：\n\
    \n| 运算符 | 说明 |\n| :--- | :--- |\n| & | 二进制与：如果两个情况都为真则存在 |\n| \\| | 二进制或：如果任一操作数为真则将存在\
    \ |\n| ^ | 二进制异异：如果位在一个操作数中存在但不在两者中 |\n| ~ | 二进制取反：它具有“翻转”位的效果 |\n| << | 二进制左移：左操作数的值向左移动右操作数所指定的位数\
    \ |\n| >> | 二进制右移：左操作数的值向右移动右操作数所指定的位数 |\n\n示例：\n\n假设 `a = 60` 且 `b = 13`。现在在二进制格式下它们将是：\n\
    \n```\na = 0011 1100\nb = 0000 1101\n```\n\n```\na&b = 0000 1100\na|b = 0011 1101\n\
    a^b = 0011 0001\n~a = 1100 0011\n```\n\n"
- fmt: "\n| is | Evaluates to true if the variables on either side of the operator\
    \ point to the same object and false otherwise. |\n| is not | Evaluates to false\
    \ if the variables on either side of the operator point to the same object and\
    \ true otherwise. |\n\n## Order of Operations\n\nWhen we use more than one operator\
    \ in an expression, then the order of evaluation depends on the rules of priority.\
    \ There is a priority order for mathematical operators on which they can execute.\
    \ The priority order from top to bottom:\n\n- Parentheses have the highest priority\
    \ and can be used to force an expression to evaluate in the order you want.\n\
    \  Examples: `3*(5+4)` , `(2**5)+2`\n  In first answer is `27` and in second `34`.\n\
    - Exponentiation has the second highest priority.\n  So `4**2+1` is `17` not `64`\
    \ and `3*1**3` is `3` not `27`.\n- After Exponential Complement, unary plus and\
    \ minus (`+@` and `-@`) have third highest priority.\n- Division, multiplication,\
    \ modulus and floor division have same priority order. So `2*3-1` is `5` not `4`\
    \ and `6+4/8` is `8` not `5`.\n- Addition and subtraction have the same priority\
    \ after division and multiplication.\n- `<<` `>>` right and left bitwise shift.\n\
    - `&` Bitwise ‘AND’.\n- `^` `|` Bitwise exclusive “OR” and regular “OR”.\n- `<=`\
    \ `<` `>` `>=` Comparison Operators.\n- `<>` `==` `!=` Equality Operators.\n-\
    \ `=` `%=` `/=` //=` `-=` `+=` `*=` `**=` Assignment Operators.\n- `is` `is not`\
    \ Identity Operators.\n- `in` `not in` Membership Operators.\n- `not` `or` `and`\
    \ Logical Operators.\n\nOperators with the same priority are evaluated from left\
    \ to right. I don’t work very hard to remember rules of precedence for other operators.\
    \ If I can’t tell by looking at the expression, I use parentheses to make it obvious.\n\
    \n## Expressions and statements\n\nA combination of values, operator and variables\
    \ are called expression. A value all by itself consider an expression, and so\
    \ is a variable , so the following are all legal expressions:\n\nExample:\n- `88`\n\
    - `X`\n- `X+11`\n\nA statement is a unit of code that the Python interpreter can\
    \ execute. We have seen two kinds of statement: `print` and assignment.\n\nTechnically\
    \ an expression is also a statement, but it is probably simpler to think of them\
    \ as different things. The important difference is that an expression has a value;\
    \ a statement does not.\n\n## Interactive mode and Script mode\n\nOne of the benefits\
    \ of working with an interpreted language is that you can test bits of code in\
    \ interactive mode before you put them in a script. But there are differences\
    \ between interactive mode and script mode that can be confusing. For example,\
    \ if you are using Python as a calculator, you might type:\n\n```\n>>> miles =\
    \ 2.2\n>>> miles * 1.6\n```\nThe first line assigns a value to `miles`, but has\
    \ no visible effect. The second line is an expression, so the interpreter evaluates\
    \ it and displays the result. In script mode an expression, all itself, has no\
    \ effect. Python actually evaluates the expression, but doesn’t display the value\
    \ unless you tell it to:\n\n```\nmiles = 2.2\nprint miles * 1.6\n```\nScript usually\
    \ contains a sequence of statements. If there is more than one statement, the\
    \ results appear one at a time as the statements execute:\n\n```\nx = 5\nprint\
    \ x\n```\nproduces the output `5`.\n\n## Strings\n\nStrings in programming are\
    \ simply text, either individual characters, words, or complete sentences. Strings\
    \ are amongst most popular type in Python. They are one of most common elements\
    \ to use when programming, least when it comes to interacting with the user. Because\
    \ they are so common, they are a native type within Python, meaning they have\
    \ many powerful built-in capabilities. Unlike other languages, you can create\
    \ a string simply by enclosing characters in quotes. First off, there are no char\
    \ types, only strings. Strings also can’t be changed-place; a new string is created\
    \ whenever you want to make changes to it, such as concatenation. This simply\
    \ means you have to be aware that you are not manipulating the string in memory.\
    \ \n\nWe use square brackets to access substrings with the index to obtain your\
    \ substring. For example:\n\n```python\nnum1 = 'Hello World'\nnum2 = 'Basics of\
    \ Python'\nprint num1[0]\nprint num2[1:5]\n```\nthe output will be:\n`num1: H`\n\
    `num2: Basic`\n\nHere is a list of common string operations:\n- `s1 = ' '` : empty\
    \ string\n- `s2 = \"knight’s\"` : double quotes\n- `block = \"\"\"\"\"\"` : triple-quoted\
    \ block\n- `s1 + s2` : concatenate (combine)\n- `s2 * 3` : repeat the string a\
    \ certain number of times\n- `s2[n]` : index (the position of a certain character)\n\
    - `len(s2)` : get the length of a string\n- `\"a%s\" %'dead'`: string formatting(deprecated\
    \ in Python 3.x)\n- `\"a {0}\".format(\"dead\")` : string formatting (Python 3.x)\n\
    - `for x in s2` : iteration (sequentially move through the string’s characters)\n\
    - `'m' in s2` : membership (is there a given character in the string?)\n\nIn general,\
    \ you can’t perform mathematical operations on strings, even if the strings look\
    \ like numbers, so the following are illegal:\n`'2'-'1'`, `'eggs'/'easy'`, `'third'*'a'`\n\
    \nThe `+` operator works with strings, but it might not do what you expect: it\
    \ performs concatenation, which means joining the strings by linking them end-to-end.\
    \ For example:\n\n```python\nfirst = 'Basics'\nsecond = 'of'\nthird = 'Python'\n\
    print first + second + third\n```\nThe output of this program is: `BassofPython`.\n\
    \nThe `*` operator also works on strings; it performs repetition. For example,\
    \ `'Spam'*3` is `'SpamSpamSpam'`.\n\nIf one of the operands is a string, the other\
    \ has to be an integer. This use of `+` and `*` makes sense by analogy with addition\
    \ and multiplication. Just as `4*3` is equivalent to `4+4+4`, we expect `'Spam'*3`\
    \ to be the same as `'Spam'+'Spam'+'Spam'`, and it is. On the other hand, there\
    \ is a significant way in which string concatenation and repetition are different\
    \ from integer addition and multiplication.\n\nThere is a table for these operators:\n\
    \n| Operators | Description | Operators | Description |\n| :--- | :--- | :---\
    \ | :--- |\n| `+` | Concentration- Adds two values. | `*` | Repetition-create\
    \ the same string |\n| `[]` | Slice-gives the value of substring | `[:]` | Range\
    \ Slice-gives character from given range |\n| `in` | Membership-returns if a character\
    \ exists in the given string | `not in` | Membership- true if character does not\
    \ exist. |\n| `%` | Format- Performs String Formatting. | | |\n\n## String Formatting\n\
    \nIt is a very good feature of python programming. Its resembles from the function\
    \ from C’s `printf()` family. Its symbol is `%`. For example:\n\n```python\nprint\
    \ \" My name is %s and roll no. is %d.\" % ('Omer', 15)\n```\nThis code will produce\
    \ output: `My name is Omer and roll no. is 15.`\n\nThere are some useful symbols\
    \ which can be used along with `%`:\n\n| Format symbol | Conversion | Format Symbol\
    \ | Conversion |\n| :--- | :--- | :--- | :--- |\n| `%c` | character | `%s` | string\
    \ conversion |\n| `%i, %d` | signed decimal integer | `%u` | unsigned decimal\
    \ integer |\n| `%o` | octal integer | `%x` | hexadecimal integer(lowercase letters)\
    \ |\n| `%X` | hexadecimal integer(uppercase letters) | `%e` | exponential notations(with\
    \ lower case ‘e’ ) |\n"
