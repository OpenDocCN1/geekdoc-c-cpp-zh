    Interactive mode and Script mode


    One of the benefits of working with an interpreted language is that you can test
    bits of code in interactive mode before you put them in a script. But there are
    differences between interactive mode and script mode that can be confusing.


    For example, if you are using Python as a calculator, you might type


    >>> miles = 26.2


    >>> miles * 1.61 42.182


    The first line assigns a value to miles, but it has no visible effect. The second
    line is an expression, so the interpreter evaluates it and displays the result.
    So we learn that a marathon is about 42 kilometers. But if you type the same code
    into a script and run it, you get no output at all. In script mode an expression,
    all by itself, has no visible effect. Python actually evaluates the expression,
    but it doesn’t display the value unless you tell it to:


    miles = 26.2


    print miles * 1.61


    This behavior can be confusing at first. A script usually contains a sequence
    of statements. If there is more than one statement, the results appear one at
    a time as the statements execute.


    For example, the script:


    print 100


    x = 55


    print 11


    produces the output


    100


    11


    The assignment statement produces no output.


    Strings


    Strings in programming are simply text, either individual characters, words, phrases,
    or complete sentences. Strings are amongst the most popular type in Python. They
    are one of the most common elements to use when programming, at least when it
    comes to interacting with the user. Because they are so common, they are a native
    data type within Python, meaning they have many powerful capabilities built-in.
    Unlike other languages, you don’t have to worry about creating these capabilities
    yourself. This is good because the built-in ones have been tested many times over
    and have been optimized for performance and stability.


    Strings in Python are different than most other languages. We can create a string
    simply by enclosing characters in quotes .First off, there are no char types,
    only single character strings. Strings also can’t be changed in-place; a new string
    object is created whenever you want to make changes to it, such as concatenation.
    This simply means you have to be aware that you are not manipulating the string
    in memory; it doesn’t get changed or deleted as you work with it. You are simply
    creating a new string each time. Creating a string is simple. For Example:


    num1 = ‘Hello World’


    num2 = ‘Basics of Python’


    there is no character type  in Python. These are treated as string of length one,
    thus also considered a substring.


    We use square brackets to access substrings with the index and indices to obtain
    your substring. For example:


    num1 = ‘Hello World’


    num2 = ‘Basics of Python’


    print “num1[0]:”, num1[0]


    print “num2[1:5]:” , num2[1:5]


    the output will be :


    num1: H


    num2: asics


    Here is a list of common string operations:


    *   s1 = ‘ ’ : empty string


    *   s2 = “knight’s” : double quotes


    *   block = “““ - ””” : triple-quoted block


    *   s1 + s2 : concatenate (combine)


    *   s2 * 3 : repeat the string a certain number of times


    *   s2[n] : index (the position of a certain character)


    *   len(s2) : get the length of a string


    *   “a%sparrot” %‘dead’: string formatting(deprecated in Python 3.x)


    *   “a {0} parrot”.format(“dead”) : string formatting (Python 3.x)


    *   for x in s2 : iteration (sequentially move through the string’s characters)


    *   ‘m’ in s2 : membership (is there a given character in the string?)


    In general, you can’t perform mathematical operations on strings, even if the
    strings look like numbers, so the following are illegal:


    ''2''-''1'' ''eggs''/''easy'' ''third''*''a charm''


    The + operator works with strings, but it might not do what you expect: it performs
    concatenation, which means joining the strings by linking them end-to-end. For
    example:


    first = ''Basics''


    second = ''of''


    third = ‘Python’


    print first + second + third


    The output of this program is:


    BasicsofPython.


    The * operator also works on strings; it performs repetition. For example,


    ''Spam''*3


    is


    ''SpamSpamSpam''.


    If one of the operands is a string, the other has to be an integer. This use of
    + and * makes sense by analogy with addition and multiplication. Just as 4*3 is
    equivalent to 4+4+4, we expect ''Spam''*3 to be the same as ''Spam''+''Spam''+''Spam'',
    and it is. On the other hand, there is a significant way in which string concatenation
    and repetition are different from integer addition and multiplication.


    There is a table for these operators:


    | Operators | Description | Operators | Description |


    | + | Concentration- Adds two values . | * | Repetition-create the same string
    |


    | [] | Slice-gives the value of substring | [:] | Range Slice-gives character
    from given range |


    | In | Membership-returns if a character exists in the given string | not in |
    Membership- true if character does not exist. |


    | % | Format- Performs String Formatting. |  |  |


    String Formatting:


    It is a very good feature of python programming. Its resembles from the function
    from C’s printf() family. Its symbol is %. For example:


    print “ My name is %s and roll no. is %d.” % (‘Omer’, 15)


    This code will produce output:


    My name is Omer and roll no. is 15.


    There are some useful symbols which can be used along with %-


    | Format symbol | Conversion | Format Symbol | Conversion |


    | %c | character | %s | string conversion |


    | %i, %d | signed decimal integer | %u | unsigned decimal integer |


    | %o | octal integer | %x | hexadecimal integer(lowercase letters) |


    | %X | hexadecimal integer(uppercase letters) | %e | exponential notations(with
    lower case ‘e’ ) |'
