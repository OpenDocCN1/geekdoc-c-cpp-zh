    \nList1 = [10, 20, 30, 40];\n\nExample2:\n\nList2 = [‘June’, ‘July’, ‘August’\
    \ ];\n\nExample3:\n\nList3 = [‘march’, 2.1 , 5 ]:\n\nIn first example we simple\
    \ use integers in list. In second , strings are used and in third example we use\
