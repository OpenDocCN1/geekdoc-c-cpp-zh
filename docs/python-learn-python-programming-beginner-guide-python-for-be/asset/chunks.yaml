  trans: "\n\n| %E | 指数计数法（使用大字母 ‘E’） | %f | 浮点实数 |\n\n# Python 中的决策制定\n\n在日常生活中，我们经常根据条件做出决策。例如，如果我们有\
    \ $5，我们就买一根板球拍，否则就不买。这个例子说明了，如果第一个条件为真，我们就可以继续操作；否则，我们就执行其他任务。在编程中，Python 为我们提供了这种条件语句来做出决策。决策结构评估多个表达式，并产生真或假作为结果。在\
    \ Python 编程中，0 和空值（null）被假设为假，其他值均为真。\n\n在 Python 中，我们有以下类型的决策语句：\n\n## `if` 语句：\n\
    \n它类似于 C 语言。在 `if` 语句中，我们提供一些条件，对数据进行比较并做出决策。如果满足条件，则执行语句。\n\n### 语法\n```python\n\
    if (condition)\n    statement\n```\n\n### 示例:\n```python\nnum1 = 2\nif num1:\n\
    \    print “Expression is true”\n    print num1\n\nnum2 = 0\nif num2:\n    print\
    \ “Expression is False ”\n    print num2\n\nprint “Its Over”\n```\n\n如果布尔表达式求值为真，则\
    \ `if` 语句内部的语句块可以执行。如果布尔表达式求值为假，则执行 `if` 语句结束后的后续代码。`if-statement` 可以写写在单行中。\n\
    \n### 示例:\n```python\nnum = 1\nif ( num== 1 ) : print \"one-line if\"\n```\n\n\
    ## `if-else` 语句：\n\n如果 `if` 语句的条件为假，执行控制将跳转到 `if` 语句后的第一个语句。如果我们使用 `else` 语句，它会在\
    \ `if` 语句之后执行。`else` 语句与 `if` 语句结合使用。它是一个可选语句，通常在 `if-else` 语句块中使用一次。\n\n### 语法\n\
    ```python\nif (conditon):\n    statement\nelse:\n    statement\n```\n\n### 示例:\n\
    ```python\nnum1 = 0\nif num1:\n  print \"Expression is true\"\nelse:\n    print\
    \ \"Expression is false\"\n```\n\n## `elif` 语句：\n\n如果我们想检查多个表达式是否为真，并在其中一个条件求值为真时立即执行语句块，我们有\
    \ `elif` 语句来执行此类任务。\n\n它像 `else` 语句一样是可选的。我们通常在块中使用一个 `else` 语句，但可以有很多 `elif`\
    \ 语句。\n\n### 语法\n```python\nif (condition1):\n    statement\nelif(condition2):\n\
    \    statement\nelif(condition3):\n    statement\nelse:\n    statement\n```\n\
    它类似于其他语言中的 `switch case` 语句。\n\n### 示例:\n```python\nnum = 1\nif num == 2:\n print\
    \ \"True Expression 1\"\nelif num == 3:\n print \"True Expression 2\"\nelif num\
    \ == 1:\n print \"True Expression 3\"\nelif num == 1:\n print \"True Expression\
    \ 4\"\nelse:\n print \"No one match!\"\n```\n如果没有一个可以匹配真表达式，则将打印 `else` 语句。\n\n\
    # 循环\n\n当我们需要重复执行某块代码几次时，我们在 Python 中使用循环。在编程语言中，有各种控制结构允许更复杂的路径。\n\n简单的循环语句允许我们多次执行某块代码。\n\
    \n为了处理循环需求，Python 提供了以下类型的循环：\n\n## `While` 循环：\n\n如果给定的条件为真，`while` 循环会反复执行语句，直到它变为假。\n\
    \n### 语法\n```python\nwhile (condition):\n    statement\n    increment\\decrement\n\
    ```\n\n首先，我们在 `while` 循环上方声明一个变量。然后在括号中给出条件。在条件中，我们可能使用关系运算符。然后我们写循环的语句，如果语句为真，循环就会反复执行，直到它为假。语句可以是单行的，也可以是一个语句块。在语句之后，我们在循环的最后提到递增或递减。如果循环第一次执行，第二次执行将按照该递增或递减执行。这个过程一直持续到条件变为假为止。\n\
    \n### 示例:\n```python\nvalue = 0\nwhile (value <5):\n    print ‘The value is:’,\
    \ value\n    value= value +1\nprint “Its Over”\n```\n此块仅包含打印和递增语句，它在每个循环周期后增加值\
    \ 1。当值增加 4 时，条件变为假，它就会停止工作。\n\n### 在 `While` 循环中使用 `else` 语句：\n\nPython 支持与 `While`\
    \ 循环语句关联的 `else` 语句。如果在 `while` 循环在使用 `else` 语句，则当条件变为假时执行 `else` 语句。\n\n## `For`\
    \ 循环：\n\n`For` 循环具有重复遍历任何序列项的能力，例如列表或字符串。如果序列包含这些中的任何项，则首先评估表达式列表。然后将序列中的第一个项赋值给迭代变量。此后执行语句块。列表中的每个项都被赋值给迭代变量，并执行语句块，直到整个序列被耗尽。\n\
    \n### 语法\n```python\nfor iterating_var in sequence:\n    statements\n```\n\n###\
    \ 示例:\n```python\nfor letter in ‘Python’:\n    print ‘Current Letter  : , letter\n\
    print “Its Over”\n```\n\n### 在 for 循环中使用 `else` 语句：\n\n在 Python 中，我们可以在 `for`\
    \ 循环中使用 `else` 语句。当序列耗尽时，执行 `else` 语句。\n\n## 嵌套循环：\n\n在循环内部的多个循环被称为嵌套循环。Python\
    \ 允许嵌套循环。\n\n### `For` 循环语法\n```python\nfor iterating_var in sequence:\n    statements\n\
    ```\n\n### `While` 循环语法\n```python\nwhile(condition):\n    statements\n    statements\n\
    ```\n\n## 循环控制语句：\n\n为了改变循环的执行，我们使用控制语句。在 Python 中我们有以下控制语句：\n\n### `Break` 语句：\n\
    \n它与 C 语言中的 `break` 语句工作相同。它停止循环执行并跳转到循环块后的代码。`break` 语句用于 for 和 while 循环。\n\n\
    ### 语法\n```python\nbreak\n```\n\n### 示例:\n```python\nfor letter in ‘ Python’ :\n\
    \    if letter == ‘h’ :\n        break\nprint ‘ Current Letter : , letter\n```\n\
    \n### `Continue` 语句：\n\n当使用 `continue` 语句时，它跳过当前迭代的剩余语句，并将控制返回到循环开头。\n\n### 语法\n\
    ```python\ncontinue\n```\n\n### 示例:\n```python\nfor letter in ‘Python’:\n if letter\
    \ == ‘o’:\n continue\nprint ‘Current Letter : , letter\nprint “Its Over”\n```\n\
    \n### `Pass` 语句：\n\n执行它时什么都不会发生，它是一个空操作。它适用于代码将进入但目前尚未编写代码的地方。\n\n### 语法\n```python\n\
    pass\n```\n\n### 示例:\n```python\nfor letter in ‘Python’ :    if letter == ‘h’:\n\
    \        pass\n    print ‘This is pass block’\nprint ‘Current Letter : , letter\n\
    ```\n\n# 列表\n\n和字符串一样，列表是值的序列。Python 中最基本的数据结构是序列。序列中的每个元素都有自己的位置或索引。第一个位置总是 0，第二个是\
    \ 1，依此类推。在字符串中我们只有字符值，但在列表中它们可以是任何类型。列表中的值被称为元素，有时称为项。\n\n列表的创建非常简单，我们只需要使用方括号创建列表。元素包含在里面并用逗号分隔元素。\n\
    \n### 示例 1:\n```python\nList1 = [10, 20, 30, 40];\n```\n\n### 示例 2:\n```python\n\
    List2 = [‘June’, ‘July’, ‘August’ ];\n```\n\n### 示例 3:\n```python\nList3 = [‘march’,\
    \ 2.1 , 5 ]:\n```\n\n在第一个示例中，我们在列表中使用了整数。在第二个示例使用了字符串，在第三个示例中使用了字符串、浮点数和整数。\n\n\
    不包含元素的列表被称为空集。你可以通过 [] 创建空列表。\n\n## 访问列表值：\n\n"
