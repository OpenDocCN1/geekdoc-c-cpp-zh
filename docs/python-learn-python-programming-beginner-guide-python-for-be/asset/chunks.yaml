    程序是代码行/指令的组合，规定了如何执行计算。计算可以是数学性的，例如求解方程或寻找多项式的根，但也可以是符号计算，例如在文档中搜索和替换文本或编译程序。


    每种语言中都包含一些指令：


    * 输入（Input）：通过键盘或其他输入设备从用户处获取数据

    * 输出（Output）：在屏幕或其他输出设备上显示数据。

    * 数学（Math）：执行基础数学运算。

    * 条件执行（Conditional execution）：检查某些条件并执行相应的代码。

    * 重复（Repetitions）：反复执行某些操作，通常带有某种变化。


    ## 什么是调试？


    编程错误被称为 bug（错误），追踪这些错误的过程被称为调试（debugging）。


    编程中共有三种错误：


    ### 语法错误 (Syntax Error)

    只有在语法错误正确的情况下，Python 才能执行程序；否则解释器会显示错误信息。语法是关于结构性规则。例如，括号必须成对出现，因此 `(1+3)` 是合法的，但
    `3)` 就是语法错误。


    在编程的最初几周里，你可能会花费大量时间来追踪语法错误。随着经验的增加，你犯的错误会越来越少，而且发现得更快。


    ### 运行时错误 (Runtime Error)

    第二种错误是运行时错误，之所以这样做是因为错误在程序开始运行后才会出现。这些错误也被称为异常（exceptions），因为它们通常表示发生了异常（且糟糕）的情况。


    ### 逻辑错误 (Logical Error)

    第三种是逻辑错误。如果你的程序中存在逻辑错误，它将成功运行（即计算机不会生成任何错误信息），但它不会做正确的事——它会做我们没有预期的事。具体来说，它会执行你让它做的事。它的产生由于程序的逻辑错误。


    在我们开始编写第一个 Python 程序之前，我们必须简要了解一些术语及其功能。这将消除初学者的概念模糊，对他们非常有帮助。


    * **解决问题 (Problem solving)**：构思问题、寻找解决方案并表达解决方案的过程。

    * **高级语言 (High-level language)**：像 `Python` 这样的编程语言，设计成易于人类读写。

    * **低级语言 (Low-level language)**：设计成便于计算机执行的编程语言；也称为“机器语言”或“汇编语言”。

    * **可移植性 (portability)**：程序可以在多种类型的计算机上运行的属性。

    * **解释 (interpret)**：通过逐行翻译来执行高级语言编写的程序。

    * **编译 (Compile)**：一次性将高级语言编写的程序翻译成低级语言，为稍后的执行做准备。

    * **源代码 (Source code)**：编译前的高级语言程序程序。

    * **目标代码 (Object code)**：编译器翻译程序后的输出。

    * **可执行文件 (Executable)**：准备好执行的目标代码的名称。

    * **提示符 (Prompt)**：解释器显示的字符，表示它已准备好接收用户输入。

    * **脚本 (Script)**：存储在文件中的程序（通常是被解释的）。

    * **交互模式 (Interactive mode)**：通过在提示符处输入命令和表达式来使用 Python 解释器的方法。

    * **脚本模式 (Script mode)**：使用 Python 解释器读取并执行脚本中语句的方法。

    * **程序 (Program)**：指定计算的指令集。

    * **算法 (Algorithm)**：解决一类问题的通用过程。

    * **Bug**：程序中的错误。

    * **调试 (Debugging)**：寻找并移除三种编程错误中任何的过程。

    * **语法 (Syntax)**：程序的结构。

    * **语法错误 (Syntax error)**：程序中导致无法解析（因此无法解释）的错误。

    * **异常 (Exception)**：程序运行期间检测到的错误。

    * **语义/逻辑 (Semantics (logic))**：程序的含义。

    * **语义（逻辑）错误 (Semantic (Logical) error)**：程序中导致其执行与程序员意图之外内容的错误。

    * **标记 (Token)**：程序语法结构的基本元素之一，类比自然语言中的单词。

    * **解析 (Parse)**：检查程序并分析语法结构。

    * **打印语句 (Print statement)**：导致 Python 解释器在屏幕上显示某值的指令。

    * **值 (Value)**：程序处理的基本数据单元之一，如数字或字符串。

    * **类型 (Type)**：值的类别。我们目前为止见过的类型有整数（类型 `int`）、浮点数（类型 `float`）和字符串（类型 `str`）。

    * **整数 (Integer)**：代表整数数字的类型。

    * **浮点数 (floating-point)**：代表带小数部分的数字的类型。

    * **字符串 (String)**：代表字符序列的类型。

    * **变量 (Variable)**：引用某个值的名称。

    * **语句 (Statement)**：代表命令或操作的代码段。到目前，我们看到的语句是赋值语句和打印语句。

    * **赋值 (Assignment)**：给变量赋值的语句。

    * **状态图 (State diagram)**：一组变量及其所引用值的图形化表示。

    * **关键字 (Keyword)**：编译器用于解析程序的保留字；你不能使用如 `if`、`def` 和 `while` 等关键字作为变量名。

    * **运算符 (Operator)**：代表简单计算（如加法、乘法或字符串拼接）的特殊符号。

    * **操作数 (Operand)**：运算符作用的值之一。

    * **地板除 (Floor division)**：除两个数字并切掉小数部分的操作。

    * **表达式 (Expression)**：变量、运算符和值的组合，表示单一结果值。

    * **求值 (Evaluate)**：通过顺序执行操作来简化表达式以得到单一值。

    * **优先级规则 (Rules of precedence)**：支配涉及多个运算符和操作数的表达式求顺序的规则。

    * **拼接 (Concatenate)**：将两个操作数首尾相接。

    * **注释 (Comment)**：程序中供其他程序员（或任何阅读源代码的人）阅读的信息，对执行没有影响。


    ## 第一个程序


    在所有新语言中，第一个程序都称为“Hello World”，因为它所做的只是显示“Hello World”这两个词。


    在 Python 中：


    ```python

    Print ‘Hello World’

    ```


    这是一个打印语句的简单示例，它并没有实际上在纸上打印任何东西。它是在屏幕上显示一个值。在这种情况下，结果是这些单词：


    Hello World


    程序中的引号标记了要显示的文本的开始和结束；它们不会出现在结果中。


    在 Python 3 中，打印语法略有不同：


    ```python

    print(''Hello, World!'')

    ```


    括号表示 `print` 是一个函数。如果你使用的是 Python 3，你将必须进行翻译。但除此之外，几乎没有我们需要担心的差异。


    ## 值与类型


    在程序中，字母和数字被称为**值（values）**。


    例如：1, 20, Hello 等。


    这些值具有不同的类型。在上面的例子中，“1”是整数（integer），“Hello”是字符串（string），你可以通过它们被引号包裹来识别字符串。


    如果你不确定某个值是什么类型，解释器可以告诉你。


    ```python

    type(''Hello'')

    ```

    <type ''str''>


    ```python

    type(49)

    ```

    <type ''int''>


    ```


    Python 中用于整数的关键字是 `int`，用于字符串的是 `str`。我们不能使用它们的全称。整数仅用于没有小数点的整个数字。带有小数点的数字属于称为
    `float` 的类型，因为它们是以浮点数格式表示的。`float` 也称为实数。


    例如：


    ```python

    type(8.8)

    ```

    <type ''float''>


    ```


    如果数字以引号形式编码，它们也变成了字符串：


    ```python

    type(''49'')

    ```

    <type ''str''>


    ```python

    type(''8.8'')

    ```

    <type ''str''>


    ```


    它们是字符串。


