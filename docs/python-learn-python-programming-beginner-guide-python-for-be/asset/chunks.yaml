    ## What is Python ?


    Python is a best programming language for beginners. It is interpreted, high-level
    interactive and object-oriented ,scripting language. It is designed to be highly
    readable language. It is use more English keywords than any other programming
    language that’s way it is easy in learning and understanding.


    ## Python as interpreted Language:


    Python is an interpreted language. It doesn’t use a compiler; the interpreter
    check the code line by line and creates a bytecode. Bytecode is an in-between
    “language” that isn’t quite machine code but it isn’t the source code. Because
    of this in-between state, bytecode is more transferable between operating systems
    than machine code; this helps Python be cross-platform. Java is another language
    that uses bytecodes. However, because Python uses an interpreter rather than compiler,
    the code processing can be slower. The bytecode still has to be “deciphered” for
    use by the processor, which takes additional time. But the benefit to this is
    that the programmer can immediately see the results of his code. He doesn’t have
    to wait for the compiler to decide if there is a syntax error somewhere that causes
    the program to crash. Because of interpretation, Python and similar languages
    are used for rapid application development and program prototyping. For example,
    a simple program can be created in just a few hours and shown to a customer in
    the same visit. Programmers can repeatedly modify the program and see the results
    quickly. This allows them to try different ideas and see which one is best without
    investing a lot of time on dead-ends. This also applies to creating graphical
    user interfaces (GUIs). Simple “sketches” can be laid out in minutes because Python
    not only has several different GUI libraries available but also includes a simple
    library (`Tkinter`) by default.


    ## Python as Object-Oriented Programming (OOP):


    Python supports Object-Oriented style of programming that packs code within objects.
    Python is unique from other languages because in that you have two choices when
    developing your programs: procedural programming or object-oriented. You can mix
    the two in the same program.


    Procedural programming is a step-by-step process of developing the program . Functions
    are called by the program at time to perform some processing , then control is
    returned back to the main program . `C` and `BASIC` are procedural languages.


    Object-oriented programming (`OOP`) means that programming with objects . Objects
    can be created by different units of programming logic; variables and methods
    are combines into objects that do a particular thing. For example if you built
    a model of some kind of robot and each part of its body would be separated object,
    capable of doing different things but still part of the overall object. OOP is
    also heaving used GUI development.


    ## Python as beginner’s:


    Python provides wide of applications from simple text to games.


    ## History of Python


    Guido van Rossum was the developer of Python. It was developed in late eighties
    and early nineties at National Research institute for Computer Science.


    ## Features of Python


    Following are some features of Python:


    ### Easy to learn:

    It was very easy to learn than other languages. It has few keywords and simple
    structure.


    ### Easy to read:

    It is high level language and use many keywords. That’s why it is easy to read.


    ### Standard Libraries:

    Python has many libraries which use.


    ### Interactive Mode:

    Python allows interactive mode which support testing and debugging of code.


    ### Portable:

    Python is portable, meaning that they can run different computers.


    ### Extendable:

    It is feature of python that it can add low-level modules to the interpreter.


    ### Database:

    Python provides all major databases.


    ### Graphical User Interface (GUI) Programming:

    Python has ability to perform on GUI that can be created and ported to many systems
    such as Windows, Macintosh and Unix.


    ### Scalable:

    Python is very vast and progressive language it can provides better structure
    for large programs than shell scripting.


    - It can be compiled to byte-code for building large applications.

    - It can support functions and structured programming and OOP.

    - One of the most powerful feature of programming languages is the ability to
    manipulate variables.

    - It supports automatic garbage collection.

    - It has ability easily integrated with `C`, `C++`, `CORBA`, `ActiveX`, `COM`,
    and `JAVA`.

    - It provides high-level dynamic data types and supports dynamic type checking.


    ## Getting Start with Python


    Python is considered interpreted language because Python programs are executed
    by an interpreter. There are two ways to use the interpreter: interactive mode
    and script mode. In interactive mode, you type Python programs and the interpreter
    displays the result:


    ```

    1+1

    2

    ```


    The chevron, `>>>`, is the prompt the interpreter uses to indicate that it is
    ready. If you type `1+1`, the interpreter replies `2`. Alternatively, you can
    store code in a file and use the interpreter to execute the contents of the file,
    which is called a script.


    To execute the script, you have to tell the interpreter the name of the file.
    If you have a script named `mywork.py` and you are working in a UNIX command window,
    you type `python mywork.py`. In other development environments, the details of
    executing scripts are different. You can find instructions for your environment
    at the Python website.

