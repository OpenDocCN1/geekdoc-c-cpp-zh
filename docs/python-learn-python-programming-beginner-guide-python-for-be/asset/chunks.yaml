  trans: "\n\n| is | 如果运算符两边的变量指向同一个对象，则求值为真（true），否则为假（false）。\n| is not | 如果运算符两边的变量指向同一个对象，则求值为假（false），否则为真（true）。\n\
    \n## 运算符优先级\n\n当我们在表达式中使用多个运算符时，求值顺序取决于优先级规则。数学运算符有一个执行顺序的优先级排序。从上到下的优先级顺序如下：\n\
    \n-   **括号**优先级最高，可以强制表达式按照你希望的顺序进行求值。\n    示例：`3*(5+4)` ， `(2**5)+2`\n    第一个答案是\
    \ `27`，第二个是 `34`。\n-   **幂**优先级次高。\n    所以 `4**2+1` 是 `17` 而不是 `64`，`3*1**3` 是\
    \ `3` 而不是 `27`。\n-   在幂运算之后，一元正、负号（`+@` 和 `-@`）优先级第三第三。\n-   除法、乘法、取模和整除优先级相同。所以\
    \ `2*3-1` 是 `5` 而不是 `4`，`6+4/8` 是 `8` 而不是 `5`。\n-   加法和减法在除法和乘法之后优先级相同。\n-   `<<`\
    \ `>>` 右移和左移位运算。\n-   `&` 位“与”。\n-   `^` `|` 位“异或”和逻辑“或”。\n-   `<=` `<` `>` `>=`\
    \ 比较运算符。\n-   `<>` `==` `!=` Equality 运算符。\n-   `=` `%=` `/=` `-=` `+=` `*=` 赋值。\n\
    -   `is` `is not` 恒等运算符。\n-   `in` `not in` 成员运算符。\n-   `not` `or` `and` 逻辑运算符。\n\
    \n优先级相同的运算符从左到右求值。不需要费力去记住其他运算符的优先级规则，通过观察表达式这一点显而易见。\n\n## 表达式与语句\n\n值、运算符和变量的组合被称为**表达式**。值本身是一个表达式，变量也是。**语句**是\
    \ Python 解释器可以执行的单元。我们已经见过两种语句：`print` 和赋值。技术上讲，表达式有值；而语句没有。\n\n以下都是合法的表达式：\n\n\
    示例：\n-   `8`\n-   `X`\n-   `X+1`\n\n## 交互式模式与脚本模式\n\n解释型语言的优点之一是，可以在将其放入脚本之前在交互式模式下测试代码。但交互式模式和脚本模式之间存在差异。例如，如果你将\
    \ Python 作为计算器使用，你可能会输入：\n\n```\n>>> miles = 2\n>>> miles * 3\n```\n第一行给 `miles`\
    \ 赋值，但没有可见效果。第二行是一个表达式，Python 实际上会求值它并显示结果。在脚本模式下，表达式本身没有效果，除非你告诉它显示：\n\n```\n\
    miles = 2\nprint miles * 3\n```\n脚本通常包含一系列语句。如果有多条语句，结果会逐个显示：\n\n```\nx = 5\n\
    print x\n```\n产生输出 `5`。\n\n## 字符串\n\n编程中的字符串简单来说就是文本、字符、单词或完整的句子。字符串在 Python 中是最流行的类型之一，当与用户交互时，它们拥有强大的内置能力。与其他语言不同，Python\
    \ 没有字符类型，只有字符串。字符串也是不可变的；每你想对其进行更改（如拼接）时，都会创建一个新字符串。\n\n我们使用方括号通过索引来访问你的子字符串。例如：\n\
    \n```python\nnum1 = 'Hello World'\nnum2 = 'Basics of Python'\nprint num1[0]\n\
    print num2[1:5]\n```\n输出将是：\n`num1: H`\n`num2: Basic`\n\n以下是常见的字符串操作列表：\n-   `s1\
    \ = ' '`：空字符串\n-   `s2 = \"knight’s\"`：双引号\n-   `block = \"\"\"\"\"\"`：三引号块\n\
    -   `s1 + s2`：拼接（组合）\n-   `s2 * 3`：重复字符串若干次\n-   `s2[n]`：索引（某个特定字符的位置）\n-   `len(s2)`：获取字符串的长度\n\
    -   `\"a%s\" %'dead'`：字符串格式化（在 Python 3.x 中已弃用）\n-   `\"a {0}\".format(\"dead\"\
    )`：字符串格式化（Python 3.x）\n-   `for x in s2`：迭代（顺序遍历字符串字符）\n-   `'m' in s2`：成员检查（字符串中是否存在给定字符？）\n\
    \n通常情况下，你不能对字符串进行数学运算，即使字符串看起来像数字，所以以下操作是非法的：\n`'2'-'1'`, `'eggs'/'easy'`, `'third'*'a'`\n\
    \n`+` 运算符适用于字符串，但它的行为可能不符合你的预期：它执行的是拼接，意味着通过尾尾相连连接字符串。例如：\n\n```python\nfirst\
    \ = 'Basics'\nsecond = 'of'\nthird = 'Python'\nprint first + second + third\n\
    ```\n该程序的输出是：`BasicsofPython`。\n\n`*` 运算符也适用于字符串；它执行重复。例如，`'Spam'*3` 是 `'SpamSpamSpam'`。\n\
    \n如果一个操作数之一是字符串，另一个必须是整数。这种对 `+` 和 `*` 的用法类比加法和乘法是有意义的。正如 `4*3` 等同于 `4+4+4` 一样，我们期望\
    \ `'Spam'*3` 等于 `'Spam'+'Spam'+'Spam'`，事实确实如此。另一方面，字符串拼接和重复与整数加法和乘法之间存在显著的区别。\n\
    \n这些运算符有一个对照表：\n\n| 运算符 | 描述 | 运算符 | 描述 |\n| :--- | :--- | :--- | :--- |\n| `+`\
    \ | 拼接-相加两个值 | `*` | 重复-创建相同的字符串 |\n| `[]` | 切片-获取子字符串的值 | `[:]` | 范围切片-获取给定范围内的字符\
    \ |\n| `in` | 成员-如果字符存在于给定字符串中返回真 | `not in` | 成员-如果字符不存在则返回真 |\n| `%` | 格式-执行字符串格式化\
    \ | | |\n\n## 字符串格式化\n\n这是 Python 编程中非常好的特性。它类似于 C 语言中 `printf()` 系列函数。它的符号是 `%`。例如：\n\
    \n```python\nprint \" My name is %s and roll no. is %d.\" % ('Omer', 15)\n```\n\
    这段代码将产生输出：`My name is Omer and roll no. is 15.`。\n\n有一些可以与 `%` 一起使用的符号：\n\n| 格式符号\
    \ | 转换 | 格式符号 | 转换 |\n| :--- | :--- | :--- | :--- |\n| `%c` | 字符 | `%s` | 字符串转换\
    \ |\n| `%i, %d` | 有符号十进制整数 | `%u` | 无符号十进制整数 |\n| `%o` | 八进制整数 | `%x` | 十六整数（小写字母）\
    \ |\n| `%X` | 十六整数（大写字母） | `%e` | 数计数法（带有小写 ‘e’） |\n\n"
