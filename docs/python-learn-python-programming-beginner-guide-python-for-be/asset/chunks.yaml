    它们的访问方式就像字符串一样（例如切片和拼接），因此使用简单，而且它们是变长的，即它们会随着使用自动增长和缩小。要访问列表中的元素，请使用方括号。实际上，Python
    列表是 Python 解释器内部的 C 数组，其作用就像指针数组。


    示例：


    ```python

    list1 = [''June'', ''july'', 404, 808];

    list2 = [1, 2, 3, 4, 5, 6, 7 ];

    print "list1[0]: ", list1[0]

    print "list2[1:3]: ", list2[1:3]

    ```


    需要记住的一点是，列表是一系列写在方括号内的对象，用逗号分隔。字典和元组看起来相似，但它们使用的括号类型不同。


    列表最常见的用途是遍历列表并对列表中的每个对象执行相同的操作，因此通常会使用相似的数据类型。


    ## 在列表中添加元素


    在列表中添加新元素非常简单。为了这个目的，我们有 `append` 语句，通过它我们可以告诉列表添加元素。


    示例：


    ```python

    mylist = [20 , 22 , 24 ];

    mylist. append (26) ;

    print mylist

    ```


    要将两个列表合并，我们有 `extend()` 语句。我们可以使用此语句将两个列表连接。


    示例：


    ```python

    list1 = ["June", "July" ,"August"];

    list2 = [5 , 10 , 15 ];

    list1.extend(list2);

    print list1

    ```


    ## 在列表中删除元素


    有许多方法从列表中删除元素。要删除第 n 个元素，如果你确切知道要删除的是哪个元素，可以使用 `del` 语句或 `pop`；如果你不知道，可以使用 `remove`
    方法。


    `pop` 会修改列表并在执行后返回被删除的元素。


    示例：


    ```python

    list = [''a'', ''b'', ''c''];

    newlist = list.pop(1);

    print t

    ```


    如果你不需要删除值，可以使用 `del` 运算符。


    示例：


    ```python

    list = [''a'', ''b'', ''c''];

    del list[1];

    print t

    ```


    如果你不知道想要删除的元素的索引，但知道该元素，可以使用 `remove` 语句。


    示例：


    ```python

    list= [''a'', ''b'', ''c''];

    list.remove(''b'');

    print list

    ```


    ## 列表运算符


    列表也可以像字符串一样执行 `+`（拼接）和 `*`（重复）运算符，但结果是新列表而不是字符串。


    列表执行所有我们在字符串上使用的通用操作。


    | 表达式 | 输出 | 描述 |

    | :--- | :--- | :--- |

    | `[1 , 2, 3 ]+[4, 5, 6]` | `[1, 2, 3, 4, 5, 6]` | 拼接 |

    | `Len([1, 2, 3]),` | `3` | 长度 |

    | `3 in [1, 2, 3]` | `True` | 成员关系 |

    | `[‘OK’]*4` | `[‘OK’ ,’OK’ , ‘OK’ , ‘OK’ ]` | 重复 |

    | `For x in [1, 2, 3]: print x,` | `1 2 3` | 迭代 |


    ## 字典


    字典是 Python 中最有用的数据类型之一。字典类似于列表，但它具有更通用的属性。在列表中，索引必须是整数，但在字典中，它们可以是几乎任何类型。它们是对象的无序集合，与关键字相匹配。另一方面，列表是使用数值偏移的有序集合。


    Python 字典提供了一组索引（即键，key）和一组值之间的映射。每个键都映射到一个值。键和值之间的关系被称为键-值对，有时也称为项（item）。


    ## 字典的基本属性


    字典具有一些属性：


    *   它不是偏移量，可以通过关键字轻松访问。它的执行方式与关联数组相同。字典中的所有项都有其自己的关键字；关键字用于调用该项。

    *   为了提供更快的查找，存储的对象是随机顺序排列的。在创建时，字典以它选择的任何顺序存储项。使用键来获取项。字典没有内置对项排序的方法，如果你需要排序，请自行处理。

    *   字典是变长的，可以包含任何类型的对象，并支持深度嵌套。

    *   它们不能像列表或字符串那样被修改（指重新赋值），但它们是可变的。

    *   它们是唯一支持映射的数据类型。

    *   内部，字典被实现为哈希表。


    ## 字典的基本操作


    现在我们有一些 Python 字典常用操作列表：


    *   `d1 = { }` 空字典。

    *   `d2 = { ‘basic’ : 2, ‘Python’ : 3}` 两个项的字典。

    *   `d3 = { ‘June’ : { ‘July’ : 1 , ‘August’ : 2 } }` 嵌套。

    *   `d2 [ ‘Python’ ] , d3[ ‘June’ ][ ‘July’ ]` 通过键索引。

    *   `d2.has_key( ‘Python’), `d2.keys( )`, `d2.values( )` 方法：成员测试、键列表、值列表等。

    *   `len(d1)` 长度（存储条目的数量）。

    *   `d2 [key] = new`, `del d2[key]` 添加/删除。


    ```python

    d1 = { }

    d2 = { ‘basic’ : 2, ‘Python’ : 3}

    d3 = { ‘June’ : { ‘July’ : 1 , ‘August’ : 2 } }

    d2 [ ‘Python’ ] , d3[ ‘June’ ][ ‘July’ ]

    d2.has_key( ‘Python’), d2.keys( ) , d2.values( )

    len(d1)

    d2 [key] = new, del d2[key]

    ```


    '
