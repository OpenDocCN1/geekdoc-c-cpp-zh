    \ Then we write statement of the loop, if statement is true loop executes again\
    \ and again until is false. Statement may be single line or a block of statements.\
    \ After the statement we mention the increment or decrement in the last of the\
    \ loop. If loop executes first time than second time it will executes with that\
    \ increment or decrement. This process executes until the condition becomes false.\n\
    \nExample:\n\nvalue = 0\n\nwhile (value <5):\n\nprint ‘The value is:’, value\n\
    \nvalue= value +1\n\nprint “Its Over”\n\nThis block is consisting only print and\
    \ increment statements, Its increase the value 1 after every cycle of loop. When\
    \ value increase by 4 the condition becomes false and it stop working.\n\nUsing\
    \ else statement with While Loop:\n\nPython supports to have an else statement\
    \ associated  with the While Loop statement.\n\nIf  the else statement is used\
    \ with the while loop, the else statement is executed when the condition becomes\
    \ false.\n\n## For Loop:\n\nFor loop has ability to repeat over the items of any\
    \ sequence, such as a list or a string. Expression list evaluated first if a sequence\
    \ contain any of this. Then the first item in the sequence is assigned to the\
    \ iterating variable. After this the statement block is executed. Each time in\
    \ the list is assigned to iterating variable, and the statement block is executed\
    \ until the entire sequence is exhausted.\n\nSyntax:\n\nfor iterating_var in sequence:\n\
    \nstatements\n\nExample:\n\nfor letter in ‘Python’:\n\nprint ‘Current Letter \
    \ :’ , letter\n\nprint “Its Over”\n\nUsing else statement with for loops:\n\n\
    In Python we can use else  statement with for loop.\n\nThe else statement is executed\
    \ when the loop has exhausted iterating the list.\n\n## Nesting of Loops:\n\n\
    A loop or many loops inside a loop is called nesting of loops. Python programming\
    \ allows to nesting of loops.\n\nFor Loop Sytanx:\n\nfor iterating_var in sequence:\n\
    \nfor iterating_var in sequence:\n\nstatements\n\nstatements\n\nWhile Loop Syntax:\n\
    \nwhile(conditon):\n\nwhile(condition):\n\n statements\n\nstatements\n\nincrement\\\
    decrement\n\n## Loop Control Statements:\n\nTo change the normal loop execution\
    \ we use loop control statements. In Python we have following control statements:\n\
    \n### Break Statement:\n\nIt performs the same work as break statement in C. Its\
    \ stop the execution and jumped out the execution from the loop block. The break\
    \ statement used in both for and while loops. If you are using nested loops, the\
    \ break statement stops execution of the innermost loop and start execution the\
    \ next line of code after the block.\n\nSyntax;\n\nbreak\n\nExample :\n\nfor letter\
    \ in ‘ Python’ :\n\n              If letter == ‘h’ :\n\n              break\n\n\
    print ‘ Current Letter :’  , letter\n\nprint “ Its Over”\n\n### Continue Statement:\n\
    \nWhen the continue statement used in looping its return the control to the beginning\
    \ of the the loop. It cannot execute the remaining statements in the current iteration\
    \ of the loop and moves the control back to the top of the loop.\n\nIt can be\
    \ used in both while and for loop.\n\nSyntax:\n\ncontinue\n\nExample :\n\nfor\
    \ letter in ‘Python’:\n\n if  letter == ‘o’:\n\n continue\n\nprint ‘Current Letter\
    \ :’ , letter\n\nprint “Its Over”\n\n### Pass  Statement:\n\nNothing happened\
    \ when it executes, it is a null operation. It is useful in places where the code\
    \ will eventually go, but has not been written yet.\n\nSyntax:\n\npass\n\nExample:\n\
    \nfor letter in ‘Python’ :\n\n              if letter == ‘h’:\n\n             \
    \ pass\n\nprint ‘This is pass block’\n\nprint ‘Current Letter :’ , letter\n\n\
    print “Its Over”\n\nLists\n\nLike a string, list is a sequence of values. The\
    \ most basic data structure in Python is sequence. Each element in the sequence\
    \ have its own position or index. The first position is always zero, second is\
