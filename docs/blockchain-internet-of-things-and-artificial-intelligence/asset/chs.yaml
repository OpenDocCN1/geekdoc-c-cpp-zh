  \n# 5 物联网区块链概述\n\nRajalakshmi Krishnamurthi 和 Dhanalekshmi Gopinathan\nJaypee Institute\
  \ of Information Technology, Noida, Delhi-NCR, India\n\n\n\n\n# 5.5 医疗系统去中心化区块链案例研究\n\
  \n## 5.5.1 场景 1：基础患者护理\n## 5.5.2 场景 2：用于学习研究目的的医疗数据聚合\n### 5.5.3 医疗系统的应用场景\n###\
  \ 5.5.4 区块链驱动医疗系统的建议框架\n\n## 5.6 区块链驱动物联网应用的性能挑战\n\n### 5.6.1 完整性\n### 5.6.2 匿名性\n\
  ### 5.6.3 可扩展性\n\n## 5.7 结论与未来展望\n\n## 参考文献\n\n## 5.1 引言\n\n在当前的物联网（IoT）时代，基于物联网的应用在提高人类生活质量方面发挥着关键作用\
  \ [1, 2]。值得提及的物联网应用包括智能环境监控与控制、智能建筑、智能农业、智能城市、智能交通系统和智能医疗系统 [3]。然而，物联网系统涉及物联网终端设备的异构资源限制、广泛的底层协议以及通过物联网传感器设备产生的海数据。因此，物联网系统的安全和隐私需要一种高效的机制\
  \ [4]。为此，传统的中心化安全隐私机制通过认证、数字签名和加密机制来实现，但这不足以满足物联网系统的规范。作为替代，区块链的去中心化和分布式方法最适合处理物联网系统。\n\
  \n区块链是一种用于跟踪所有数字交易的技术 [5]。它是一个账本，但并不是将其作为中心化机制，而是以去中心化、分布式的机制存储交易，并在大型计算机网络中共享数据。这种去中心化减少了数据篡改。区块链也被称为分布式账本技术（DLT）。DLT\
  \ 可由应用开发者编程，用于维护操作记录并追求任何重要意义的内容，如业务交易、医疗记录、政府政策、产权文件。它是一个网络，其存储信息使得网络难以或无法修改、黑入或欺骗。区块链的主要目标是在独立参与者（如物联网生态系统）之间的不可信分布式环境中创建一个具有信誉保障的生态系统。区块链允许用户安全地证明自己的身份，保护数字资产所有权，并在无需高成本中间介的情况下验证交易。\n\
  \n通过将区块链技术引入物联网，这种结合可能会带来可验证和可追溯的物联网网络 [6, 7]。物联网中的这种区块链技术可以记录交易数据，通过提供额外的安全性、数据验证等提高系统性能。传统物联网应用中大量设备面临着数据安全、完整性和健壮性等许多挑战。区块链为传统物联网应用的许多局限性提供了现实解决方案。区块链将确保物联网数据的机密性而无需第三方，从而节省物联网设备的带宽和处理能力。此外，区块链可以为物联网网络提供一个安全且可扩展的平台，使得敏感信息可以在没有中心服务器的情况下进行。区块链使交易记录不可篡改，而物联网通过计算机、传感器、执行器和设备将物理世界与数字世界连接起来。\n\
  \n区块链技术根据其与物联网生态系统交互的方式，变革包括：(i) 它跟踪物联网设备和存储物联网传感器数据的方式。区块链以块的形式存储信息或数据，这些块在块链中按顺序逻辑连接。要对链中的特定块进行任何更改，更改将作为一个带有时间戳的新块添加并插入到块末尾，而不是在块本身中更改；(ii)\
  \ 它建立了对物联网设备产生的数据信任。在将块添加到链之前，需要执行一些步骤。需要解决一个密码谜题。清除数学谜题的物联网计算设备有与分布式网络内的所有其他计算设备共享信息。然后区块链网络验证适当的解决方案，这被称为\
  \ `proof-of-work`。如果通过验证，新块将附加到现有的区块链上。主要目标是解决复杂的数学谜题组合。接下来，这些块将通过认证计算机进行认证，并保证集成在链中的每个块的机密性；(iii)\
  \ 不需要中间介，这反过来减少了时间和支出。区块链能够以受保护、安全、有效、高效和透明的方式分布式存储所有交易 [8, 9]。\n\n通常，区块链的创建过程由三个阶段组成，分别称为区块链\
  \ 1.0、区块链 2.0 和区块链 3.0 [10]。区块链 1.0 阶段的重点目标是对点点交易。区块链 1.0 的流行应用是比特币。区块链 2.0 的目标是提供一个包含可追溯性和数据抗性的基于信任的去中心化框架。2013\
  \ 年 1 月开发了一个具有智能合约功能的去中心化区块链框架，以太坊是流行的区块链 2.0 应用系统。区块链 2.0 级也被称为以太坊区块链水平。区块链 3.0\
  \ 的目标是将区块链技术与其他重点领域（如金融行业、供应链管理和物联网）相结合。区块链 1.0、区块链 2.0 和区块链 3.0 涉及的各种共识协议分别为 `proof\
  \ of work` (`PoW`)、`proof of stake` (`PoS`) 和 `Practical Byzantine Fault Tolerance`\
  \ (`PBFT`)。因此，本章旨在探索并介绍集成区块链实现物联网的影响和优势。\n\n本章的整体贡献包括：\n\n*   区块链基础概述，如去中心化、分布式共享账本、智能合约、密码技术和共识机制\n\
  *   物联网协议栈层基础，即应用层、传输层、网络层、适配层、数据链路层和物理层\n*   物联网网络的各种安全方面，如医疗数据安全与隐私、医疗物联网设备访问与认证、可信用户、物联网设备的访问策略与控制、密钥和数据哈希\n\
  *   基于区块链的物联网应用，如智能交通系统、智能医疗系统、供应链管理、物联网生态系统和智能城市\n*   除了加密货币和比特币，各种区块链平台，如公共和私有区块链、hyperledger、fabric\
  \ 和 R3 codra\n*   用于医疗物联网应用的去中心化区块链框架\n*   区块链物联网应用的挑战性性能因素，如可扩展性、适应性、匿名性和完整性\n\n\
  \n\n\n\n第 5.2 节介绍了区块链的基本概述。第 5.3 节介绍了 IoT 协议栈以及基于区块链的 IoT 应用。然后第 5.4 节解释了密码学和比特币之外的如\
  \ Hyperledger、Fabric 和 R3 Corda 等区块链技术。接下来第 5.5 节介绍了用于医疗 IoT 应用的去中心化区块链框架。随后第 5.6\
  \ 节讨论了基于区块链的 IoT 应用面临的各种挑战。最后第 5.7 节总结了本章。\n\n## 5.2 区块链概述](#chapter-5.xhtml_R_sec5_2)\n\
  \n区块链可以被描述为一个分布式账本，其中交易表示为区块并通过加密哈希函数链在一起。它由网络中的所有成员共享，一旦区块被添加到区块链中，就很难被更改。每笔交易的真实性由区块链在区块上的数字签名保证。加密和数字签名使得存储的数据具有防篡改和不可变性。\n\
  \n根据研究人员的说法，中本通过同以下技术开发了区块链：点对点网络、密码学和分布式共识 [10, 11]。区块链网络中的每个参与者都共享账本的副本。当一个节点发起交易时，它会将交易传输到网络。网络中的其他参与者会对交易进行检查。然后它与其他交易一起形成一个区块。首先通过同意网络设置共识协议形成新区块的参与者会将该区块广播到网络。对等节点验证区块，如果符合规则，则将其添加到现有区块中。\n\
  \n![image](img/fig5_1_B.jpg)\n\n图 5.1\n\n区块链的工作原理。\n\n图 5.1 说明了区块链的操作流程。想要执行交易的节点将区块传输到网络。网络中的所有其他参与者验证交易，并形成一个包含该交易和其他交易的新区块。这个新区块由具有足够计算能力解决加密难题的矿工节点传输到网络。然后对等节点（或网络中的节点）验证区块，如果符合规则，将其添加到现有区块链中。\n\
  \n### 5.2.1 区块链技术的关键组件](#chapter-5.xhtml_R_sec5_2_1)\n\n区块链技术的关键组件包括去中心化和分布式共享账本、密码学、共识协议和智能合约\
  \ [12, 13]。\n\n#### 5.2.1.1 去中心化](#chapter-5.xhtml_R_sec5_2_1_1)\n\n在去中心化系统中，每个参与者拥有平等权限。区块链本质上是去中心化的，这意味着没有任何个人或社区拥有全局网络权限。尽管网络中的每个人都有分布式账本的副本，但没有人可以独自更改它。这种独特的区块链特性允许用户在获得控制权的同时拥有透明度和保护。区块链技术使得引入去中心化\
  \ IoT 网络变得更容易，例如安全可靠的数据共享和记录保存。对于这样的系统，区块链充当总账本，在去中心化的 IoT 拓扑中存储智能设备之间交换所有消息的共享记录。去中心化系统的优势\
  \ [12] 包括：(i) 它不太可能失败，因为用户依赖于许多独立的组件；(ii) 区块链对攻击具有抵抗抵抗，因为网络分布在许多计算机上；(iii) 具有恶意动机的用户很难利用那些为了预期目的使用平台的用户。\n\
  \n#### 5.2.1.2 分布式共享账本](#chapter-5.xhtml_R_sec5_2_1_2)\n\n分布式共享账本如图 5.2 所示的共享数据库。它在去中心化网络的参与者之间进行复制和同步。网络中的所有节点持有所有交易并与共识协议保持同步。所有参与者都可以查看交易。交易中包含的所有信息都使用密码学安全正确地存储，并可以使用密钥和密码签名访问。账本上的任何更新都是在网络中所有参与者的共识下进行的，从而避免了中央权威的介入。\n\
  \n![image](img/fig5_2_B.jpg)\n\n图 5.2\n\n分布式账本。\n\n#### 5.2.1.3 密码学](#chapter-5.xhtml_R_sec5_2_1_3)\n\
  \n密码学是区块链最显著特征之一，因为它允许区块链变得不可篡改。区块链利用公钥加密、数字签名和加密哈希函数来确保机密性、透明性和真实性。公钥或非对称加密使用算法进行加密并生成公钥和私钥，同时也使用数字签名。数字签名使用私钥和相应的公钥对交易进行签名和验证。生成交易的节点使用公钥对交易数据进行加密，并使用私钥签名。数字签名、交易数据和公钥随后被转发到网络。网络中的参与者使用公钥验证交易的细节。\n\
  \n加密哈希函数为区块链技术提供了不可篡改性。哈希函数将任何长度的数据缩为固定长度的字符串。由于输出是固定长度的，攻击者无法推断出输入字符串生成了哪个输出。对于每个交易（称为交易标识符），区块链使用加密哈希函数。在大多数区块链协议中，交易标识符是\
  \ 256 位的字母数字字符串。每个区块由成千上万的交易组成，对每个交易进行验证在计算上非常困难。因此，处理时间被降至最低，在使用少量数据处理和验证交易时获得最高水平的安全性。区块链使用梅克尔树哈希函数\
  \ [13]，它获取大量的交易标识符并创建一个 64 位（或 256 位）字母数字字符串，称为梅克尔根。\n\n![image](img/fig5_3_B.jpg)\n\
  \n图 5.3\n\n梅克尔树。\n\n区块链中的每个区块有一个梅克尔根，用于验证特定交易是否在该区块中。梅克尔树通过将所有交易标识符组织成对来构建。如果区块的交易数量为奇数，则最后一个交易将被复制并配对。假设一个区块有\
  \ 256 个交易，那么梅克尔树将开始将这 256 个交易标识符分组为 128 个哈希。对这 128 个对应用哈希函数产生 128 个新的加密哈希。这种过程一直持续直到剩下一个哈希，即为梅克尔根。图\
  \ 5.3 插图了梅克尔树和梅克尔根的构建。\n\n\n\n\n\n在第一步中，每个交易都会单独进行哈希处理。例如，`hash(T1)` 生成一个新的哈希值，如\
  \ `H1`。然后，将新的哈希值与相邻的值结合再次生成新的哈希值。例如，`hash(H1, H2)` 生成新的哈希值 `H12`。这个过程不断重复，直到获得单个哈希值（在这种情况下为\
  \ `H12345678`）。由此获得的哈希值被称为 `Merkle root`（Merkle 根），并作为区块头存储在区块链的区块中。Merkle 树结构的优势在于资源消耗少，能够实现数据的快速验证。\n\
  \n加密哈希的第二个优势是它为区块链技术实现了数据的`immutability`（不可变性）。正如名称，区块链按照时间顺序排列，形成一系列相互连接的锁，如图 5.4\n\
  \n图 5.4 区块链中的区块结构。\n\n每个数据区块都与前一个区块的哈希值链接，使得数据难以更改。假设必须更改特定区块（例如 `block 2`）中的数据。它重新计算该区块的哈希值，但在后续区块（例如\
  \ `block 3`）中，它持有 `block 2` 的前一个哈希值。因此，数据的更改将重新生成区块链中所有后续区块的头部哈希，如图 5.4\n\n分布式去中心化区块链网络的关键特征是不可变性、隐私性、安全性和透明性。尽管没有中央权威来验证区块链中的交易，但通过作为区块链网络核心的共识协议，它被认为是安全的。共识机制意味着网络节点之间对网络状态达成共识。它有助于验证向账本中添加新区块，从而确保只有真实的交易进入区块链。下文将讨论各种共识算法。\n\
  \n### 5.2.2.1 工作量证明 (PoW)\n\n2008 年，中本（Nakamoto）在区块链（特别是比特币和以太坊）中提出了工作证明（`PoW`）共识机制\
  \ [14]。它解决了双重花费问题 [7]。`PoW` 基于一个计算 `nonce` 值的数学谜题。`nonce` 的理想值应小于阈值。矿工利用其计算能力来解决谜题（也称为挖矿）。第一个计算出低于阈值哈希值的矿工是获胜者。胜利者将新区块广播到加密货币网络作为奖励。`PoW`\
  \ 的局限性在于它在创建区块上浪费了大量的能量和资源，消耗了巨大的计算能力，且只有最先解决谜题的人获得奖励。`PoW` 需要高处理能力以及资源非常有限的物联网设备。因此，`PoW`\
  \ 不是物联网系统的可接受选择。\n\n### 5.2.2.2 权益证明 (PoS) [15,16\n\n`PoS` 是 `PoW` 的替代共识机制。“stake”（权益）代表矿工（或验证节点）持有的货币数量。`PoS`\
  \ 算法使用伪随机选择方法选择一个节点作为下一个区块的验证者。该方法基于质押年龄、随机化和节点财富等各种因素。想要参与验证程序的节点必须质押某些货币作为其网络权益。权益大的节点，机会越大。为了避免只有富人被选为验证交易的情况，系统还增加了一些独特的选择过程，如随机区块选择和硬币年龄选择过程。在随机区块选择过程中，通过寻找具有最低哈希值和最高权益组合的节点来选择验证者，由于权益大小是公开的，其他节点通常会预测下一个伪造者。\n\
  \n硬币年龄选择系统根据节点质押代币的时间长度选择节点。硬币年龄由质押硬币的数量乘以硬币作为质押的天数决定。如果节点伪造了区块，其硬币年龄将重置为零，他们必须等待一段时间才能再次伪造区块；这防止了巨额权益支配区块链。加密货币在节点被选中伪造下一个区块时使用此算法，检查区块交易的有效性，对区块进行签名并添加到区块链。与区块交易相关的交易费用将作为奖励发放给节点。当节点希望避免成为伪造者时，其权益将在一段时间后随获奖奖励一起发布，给网络时间检查节点是否向区块链添加了假区块。能量性能和健康是\
  \ `PoS` 算法的主要优势。\n\n### 5.2.2.3 实用拜尔庭容错 (PBFT)\n\n在分布式系统中，Castro 和 Liskov 开发了一种新的共识方法，通过复制节点/状态机来容纳故障/恶意节点\
  \ [17, 18]。拜尔庭容错使得分布式计算机网络即使存在恶意设备节点损坏或发送错误信息的情况下也能正确实现合理的共识。BFT 的目标是通过减少这些恶意节点的影响来防止灾难性的网络故障。Hyperledger、Stellar\
  \ 和 Ripple 是三个依赖 `PBFT` 共识算法的区块链示例。在 `PBFT` 方案中，节点按顺序排列，一个节点为主节点，其他称为备份节点。网络中的两个节点相互通信，目标是让所有诚实节点对系统状态达成多数规则的理解。在节点通信期间，它们必须验证消息来自特定的对等节点，并应验证消息在传输过程中未被篡改。\n\
  \n\n\n\n智能合约的定义由法律学者、密码学家尼克·萨波博（Nick Szabo）于 1994 年首次提出。它是区块链技术的成功应用之一。以太坊区块链技术在创建智能合约方面非常流行。在区块链背景下，它是分配给区块链交易的业务规则。区块链上的智能合约是一段描述双方协议条款和条件的代码。当参与者安装合约时，承诺通过共识算法强制执行。它使参与者能够：i)\
  \ 验证代码以确保其符合约定章节，(ii) 确保一旦合约达成并注册到区块链上，它是不可篡改的，以及 (iii) 为所有参与者以相同的方式执行。智能城市、电子商务和资产管理等各种行业和领域都会使用智能合约。合约允许您透明地交换价值（包括资产、股份和财产），消除了对中间环节的需求并保持系统无纠纷。特别是智能合约在业务关系中非常有效，它们用于根据双方共识设定的条件做出决策。这消除了欺诈风险，因为不涉及第三方。\n\
  \n## 5.3 IT 协议栈\n\nIoT 协议栈由五层组成，即应用层、传输层、网络层、网络适配层、数据链路层和物理层，如图 5.5 所示。IoT 协议栈支持最近流行的低功耗低数据率无线个人区域网（LoWPAN）和低功耗丢耗无线广域网（LPWAN）。`IEEE\
  \ 802.15.4` 标准描述了介质访问层（MAC）和物理层的功能。在这里，物理层涉及 IoT 设备不同频率范围和数据速率的底层无线通信。`MAC` 针对各种通信实体之间的通道访问机制和时间同步。然而，挑战是将\
  \ `IEEE 802.15.4` 中 127 字节的较小最大传输单元（MTU）与网络层 1028 字节的巨大 `IPv6` 数据包进行映射。因此，网络下的适配层\
  \ `6LoWPAN` 为底层低功耗 IoT 传感器设备补充了 `IPv6` 协议并实现了 `IP` 通信。\n\n![image](img/fig5_5_B.jpg)\n\
  \n图 5.5：基础 IoT 协议栈。\n\n`6LoWPAN` 协议涉及针对低功耗丢耗网络（RPL）机制的路由协议，用于 IoT 传感器设备之间的通信。在这种情况下，每个\
  \ IoT 设备都有唯一的标识，并且可以在网格、多播、单播和点对点数据流量中进行通信。在传输层，由于 IoT 设备资源限制对负载的限制，IoT 网络整合了用户数据报协议。此外，由于与传输控制协议（TCP）相比，其效率高且不复杂，IoT\
  \ 网络更倾向于使用用户数据报协议（UDP）。为了监控节点的各种状态并发现邻居节点，基于 `6LoWPAN` 的 IoT 环境适配了互联网控制消息协议（ICMP）。在应用层，提供了消息队列遥测传输协议（MQTT）和受限应用协议（CoAP）以支持基于消息的异步通信。这些协议能够映射到基于互联网的\
  \ `HTTP` 协议。\n\n### 5.3.1 IoT 应用中的安全问题\n\nIoT 在未来在解决现实问题方面具有广阔前景。预计它将在硬件和软件方面不断增长。在硬件方面，演进正发生在带宽升级、基于射频传感设备的认知网络以及射频频谱的优化利用等领域。在软件方面，演进正发生在中间件支持以增强基于\
  \ IoT 的应用及其广泛的服务等领域。\n\n根据文献，无线传感器网络与信息物理系统（CPS）的集成已成为增强型 IoT 应用的重要组成部分。因此，传感器网络的异构性以及\
  \ IoT 网络连接的底层互联网协议导致了具有挑战性的安全问题。本节讨论了 IoT 网络中的各种安全问题，如数据隐私、IoT 设备认证、可信用户、IoT 设备访问控制、加密密钥和数据哈希。\n\
  \n#### 5.3.1.1 数据隐私\n\n数据隐私的攻击是一种低级攻击，涉及非法用户违反隐私以及使用恶意活动拒绝服务。通过软件初始化和系统未经身份配置的安全交易是数据隐私攻击的主要原因。系统网络的物理层受数据隐私攻击的影响最大。例如，女巫攻击针对无线\
  \ IoT 环境，通过使用虚假特征的恶意 IoT 传感器节点实例化，并旨在降低基本的 IoT 功能。这些女巫节点伪造设备的物理地址进行伪装，并旨在耗尽可用网络资源。因此，女巫节点阻止合法用户访问合格的系统资源。\n\
  \n#### 5.3.1.2 IoT 设备认证\n\nIoT 系统的主要问题是身份和访问管理（IAM）策略，旨在识别智能 IoT 设备（尤其是医疗设备）的真实所有权和关系。对于每个\
  \ IoT 设备，身份和所有权在制造、零售商和客户等不同阶段会演变。需要注意的是，在转售、更新和佣金情况下需要采用客户所有权。因此，通过设备认证管理 IoT 设备的所有权和属性在\
  \ IoT 系统中至关重要。此外，需要通过设备到其他设备、服务和用户对 IoT 设备的特性和功能进行认证。\n\n#### 5.3.1.3 可信用户\n\n端到端设备通信通过高效的认证过程作为信任模型，坚持数据的机密性和完整性。此外，需要实施强调访问策略、数据加密和解密机制的隐私模型来避免不当的数据使用。可信用户通过一个包含应用、网络通信和提供的服务的三层安全模型来确保。根据开放\
  \ Web 应用程序安全（OWASP）联盟，目前的 IoT 架构中存在多种漏洞，即 IoT 设备的不安全网络接口、软件配置不当、未经身份验证的安全设置、设备物理损坏以及第三方固件的不安全使用。\n\
  \n#### 5.3.1.4 IoT 设备访问控制\n\n\n\n\n访问控制机制的目标是为物联网传感器设备与底层 IP 协议之间的认证提供支持[24]。访问控制机制需要处理动态切换的物联网系统，实现端到端或点对点的认证。此外，访问控制机制需要整合复杂的签名方案以保护隐私，并对多样化物联网设备的数据融合进行压缩感知。\n\
  \n### 5.3.1.5 加密密钥与数据哈希\n\n根据 [25]，加密密钥管理在物联网设备和终端用户的身份验证中起着至关重要的作用。物联网网络层缺乏高效的安全机制可能导致大量的网络漏洞和通信不安全。对于资源受限的物联网网络，安全挑战不在于破坏用于安全数据通信的加密方法的效率。此外，尽管低功耗\
  \ PAN 网络中数据报传输层安全性的安全开销极小，但它必须确保跨 IP 网络的端到端安全机制。同时，还需要涉及物联网设备基于位置服务的高效中间件安全服务。\n\
  \n### 5.3.2 区块链驱动的物联网应用\n\n在物联网中使用区块链具有若干优势。它可以减少单点故障。区块链中的加密算法和共识协议加强了物联网安全，因为分布式账本允许用户审计存储的信息，并为物联网运行提供了一个可靠的平台。图\
  \ 5.6 显示了区块链允许的物联网框架如何工作。物联网设备处于同一个区块链网络中。\n\n![image](img/fig5_6_B.jpg)\n\n图 5.6\n\
  \n物联网区块链系统工作原理示例。\n\n在支持区块链的物联网系统中，物联网设备产生数据，而区块链作为分布式数据库，确保交易安全并防止恶意篡改。一旦交易被添加到区块链网络，它就变得不可篡改。授权用户可以查看所有交易并验证交易的真实性。除了提供存储支持外，它还确保数据安全，并支持及优化物联网应用中的数字交易。区块链与物联网的整合仍处于增长阶段。物联网设备和应用功能描述了物联网-区块链框架的特征。通常，许多物联网应用\
  \ [1, 2] 会引入区块链用于数字支付、智能合约服务和数据存储。物流公司等各种行业实施区块链进行资产追踪；硬件和软件公司将使用区块链改进人与物联网设备之间的交互，等等。本节将进一步解释某些带有区块链技术的物联网应用。\n\
  \n#### 5.3.2.1 智能交通系统 (ITS)\n\n智能交通系统结合了通信、电子设备、计算机和传感器等多种创新技术。该应用的初衷是提高道路安全、减少交通拥堵并提高燃油效率。智能交通系统的关键功能包括实时交通状况监控、识别特定区域的事故等交通事件以及运输服务的实时监控。[26,\
  \ 27] 中讨论的 ITS 为驾驶员提供碰撞警告、障碍检测、车辆自动化、驾驶员状态监控等信息。作为一种基于区块链的系统，交易记录是车辆之间交通状况变化的信息。将区块链与\
  \ ITS 集成的主要目标是减少人为干预，允许交通相关对象根据交通状况，利用区块链中的 `smart contract` 自动决策并自动执行。\n\n####\
  \ 5.3.2.2 供应链管理系统\n\n供应链代表了长链不同供应商之间复杂的交互集合。追踪一系列运输货物是一个涉及多方信息的动态过程。物联网也开始提供对企业如何在产品跨越全球时收集数据的感知。传感器提供温度数据、位置数据等信息，例如新发现的签约公司。我们如何恢复开放性以及新的消费者-产品伙伴关系，以便在产品真实性检查和道德价值判断中积极参与\
  \ [28–30]？区块链的底层技术为我们提供了答案。链接的、基于共识的永久性注册有助于监控供应链的源头和转换。区块链将建立一个中心化账本，允许对跨整个供应链的所有权进行识别和监控。可以使用\
  \ `smart contracts` 在每一点监控货物。每当产品到达某地时，就可以对货物进行检查，并在两个交易货物的供应商之间签署协议。这将为产品交付地点的清晰且可追溯的溯源、其状态以及是否满足合同条款（时间、日期、温度等）提供证明依据。这消除了每个股东通过自己的数据库独立监控资产的需要——而这种数据库无法与供应链中的所有其他利益相关者提供问责、协调或验证。此外，使用区块链网络监控货物将提供更好的透明度和商业责任。消费者可以追踪其货物来源以及如何到达家门口。将从物联网\
  \ 收集的所有数据汇总到消费者可访问的区块链中，将为客户提供一种安全、可追踪且易于理解产品来源及如何到达其商店的方式，从而增强客户和生产者的信心。\n\n####\
  \ 5.3.2.3 智能医疗\n\n医疗被认为是关键物联网应用之一 [31, 32]。智能可穿设备为远程跟踪非危状态患者提供了新方法，同时为医院内更危的患者留出空间。医疗部门也有实时跟踪医疗设备、员工和患者的安排。但在处理、管理和分配患者数据方面仍然存在一些重要问题，区块链可以提供解决方案。区块链在医疗领域有广泛的应用。账本系统实现了患者医疗记录的安全传输，控制药品供应链，并帮助医疗研究人员访问遗传代码。维护包含药物、问题、患者既往史和实验室数据的医疗记录极易产生数据重复，且难以进行交叉验证和确认。\n\
  \n\n\n\n使用基于区块链的医疗服务的另一个主要优势是它可以保持一个共享且可追溯的患者记录单一版本。它还能帮助医疗人员和药房追踪患者的用药情况，并维护清晰的药物历史。此外，基于区块链的医疗网络还可以为保险提供者、药品供应链、制药公司和医学研究人员提供可靠安全的访问。在\
  \ [33] 中，作者讨论了使用 `Ethereum` 协议对医疗传感器进行安全分析和管理的区块链智能合约。传感器通过智能设备进行通信，在区块链中记录所有事件并调用智能合约。智能合约支持患者的实时追踪，并为患者和医生提供安全医疗干预的警报。\n\
  \n### 5.3.2.4 智能城市\n\n智能城市是一个通过整合新兴技术、创新城市设计、能源和交通管理以及业务规划，来解决城市化特定挑战的平台。它是数据透明和去中心化前提下，智能基础设施、智能交通、智能能源、智能医疗和其他公用设施有机融合。智能城市\
  \ [34, 35] 通过互联网接收和发送信号。例如，垃圾桶在装满时可以发送消息，水管理系统中的传感器在发生泄漏或水箱满时可以发送消息。路灯中的传感器可以收集信息并进行通信等。由于数据量和连接物联网设备数量的持续增长，高休眠、带宽阻塞、保护和机密性以及扩展性等问题在当前的智能城市系统架构中凸显。\n\
  \n基于区块链的解决方案通过减少计算和存储资源来增强当前的系统场景，提供了一个组织良好、安全且可扩展的架构。智能城市中的区块链用于能源分配、自动供水和空气质量管理。区块链可用于公民注册以追踪公民。区块链使这些数据不可篡改且共享，并用于持有数字身份。它还可以支持智能支付、用户身份、交通管理、电网管理等。在智能城市中使用区块链的优势包括智能城市可以相互互连，并与居民实时交换数据。它提供了信息的完整性和资源的高效管理等许多优势。\n\
  \n### 5.3.2.5 物联网生态系统\n\n物联网生态系统由现实世界物体与互联网、软件和硬件平台虚拟世界之间的关系，以及用于实现这种关系的常用标准组成。物联网生态系统\
  \ [36, 37] 由 `sensors`（用于收集所需数据）、`computation node`（处理来自传感器的接收数据）、`receiver`（收集来自其他计算节点或相关设备发送的消息）、`actuator`（根据传感器收集的信息和计算节点做的决策触发相关设备执行操作）以及\
  \ `devices`（实际执行任务的设备）组成。物联网生态系统中的通信纯粹是机器对机器（M2M）。因此，参与者之间的信任建立仍处于发展阶段。区块链技术的采用通过追踪物联网生态系统中的物联网设备并协调事务处理，实现了这种信任。\n\
  \n## 5.4 超越加密货币和比特币\n\n区块链通过比特币和加密货币进入信息技术领域改变了全球对在线交易的看法。应用区块链的主要目标是以安全的方式执行交易或共享信息。随着区块链变得闻名，人们意识到区块链可以超越比特币。多年来，区块链技术一直尝试被银行、房地产和政治等各种行业所接纳。由于每个行业的运作方式不同，区块链必须以适用于该行业的特定方式进行演进。本节将解释不同类型的区块链平台。\n\
  \n区块链是在数字货币背景下发明的。它现在是金融服务、供应链银行行业等领域的新兴技术之一。不同行业以不同的方式使用区块链。例如，某些行业使用区块链进行数字支付，而另一些行业将其用于不可更改的记录管理和信息安全。不同的应用需要不同的区块链协议。例如，某些应用运行在公链上，而另一些可能需要受限或私链网络。区块链平台分为三类：(i)\
  \ 公链、(ii) 私有链和 (iii) 联盟链。\n\n### 5.4.1 公链\n\n如名所示，区块链是公开的。任何人都可以加入网络；例如，任何参与者都可以参与读取、写入或参与网络等活动。它是一个不需要许可的去中心化网络。公链上的数据是稳定的，因为数据一旦在区块链上验证就无法更改或修改。比特币和\
  \ `Ethereum` 是公众广为人知的区块链例子。\n\n### 5.4.2 私有链\n\n私有链根据访问限制运行，限制了某些有资格参与网络的人员。由一个或多个组织管理网络，这导致了对交易的第三方依赖。在私有账中，只有参与交易的个人会知道该交易，而其他人无法访问。`Hyperledger`\
  \ 和 `Ripple` 是私有链的示例。\n\n### 5.4.3 以太坊\n\n\n\n\n\n这是一个开源区块链平台，允许任何人利用区块链技术构建去中心化应用[38,\
  \ 39]。它是一个基于智能合约的可编程区块链，允许用户创建满足特定需求的代码。以（Ether）是以太坊中用于数字交易的数字货币。以是通过挖矿过程获得的。如果矿工成功验证了新区块，将获得以代币形式形式奖励。以太坊的核心是去中心化虚拟机，即以太坊虚拟机（`EVM`），它为执行智能合约提供了运行环境。所有交易都本地存储在网络中的所有节点中。在`EVM`上执行的每条指令都有以`gas`为单位的成本，这确保了`EVM`的正确处理。与低计算能力的指令相比，需要更多计算资源的指令消耗更多的`gas`。因此，`gas`\
  \ 激励了程序员通过避免不必要的代码来开发高质量的应用。以太坊中的智能合约通过创建一个特殊交易来部署。在此过程中会分配一个唯一的标识符，并将其代码上传到区块链中。智能合约的组件包括其地址、余额、可执行代码和状态。智能合约通过发送合约地址的交易来调用，从而触发合约执行代码指定的动作。调用智能合约的交易会将以`ether`形式形式的费用以及执行执行函数的输入数据从调用者传输到合约。网络中的所有参与者随后根据当前状态和输入数据执行合约。输出由满足共识协议的网络参与者进行验证。\n\
  \n### 5.4.4 Hyperledger](#chapter-5.xhtml_R_sec5_4_4)\n\nHyperledger [40] 是由 Linux\
  \ 基金会的一个开源区块链平台项目，专注于构建一套用于企业级使用的安全区块链实现平台、工具和库。它是一个开源开发项目，人们可以使用 Hyperledger 作为软件和平台。简单来说，Hyperledger\
  \ 是一个任何人都可以用来构建自己的自定义区块链服务的程序。它是区块链开源产品的温室。它拥有多个可以分类为框架和工具的项目。Hyperledger 中不同的框架包括\
  \ Hyperledger Iroha、Hyperledger Sawtooth、Hyperledger Fabric、Hyperledger Indy 和 Hyperledger\
  \ Burrow。不同的工具包括 Hyperledger Caliper、Hyperledger Cello、Hyperledger Quilt、Hyperledger\
  \ Composer 和 Hyperledger Explorer。这些工具可以用于制作私有或公有的区块链。\n\n### 5.4.5 Hyperledger\
  \ Fabric](#chapter-5.xhtml_R_sec5_4_5)\n\nHyperledger Fabric [41, 42] 是 Hyperledger\
  \ 中最著名的区块链项目。它使用账本和智能合约来管理交易。它是一个主要面向业务使用的许可区块链。要成为 Hyperledger Fabric 成员，参与者应该通过成员服务提供程序（`MSP`）进行注册。在某些情况下，竞争对手不希望让自己透明。在这种情况下，参与者可以创建一个不同的通道。如果两个参与者创建一个通道，则只有这些参与者拥有该通道的账本副本，其他人无法访问。它支持使用通道的网络提供隐私保护。Hyperledger\
  \ Fabric 中的账本包含两个组件：即世界状态和交易日志。世界状态是在给定的时刻代表账本状态的数据库。交易日志包含了达到当前世界状态所发生的所有交易。当应用程序想要与账本通信时，将调用用`chaincode`编写的智能合约。`chaincode`可以用许多编程语言编写，如\
  \ Java、node.js 或 Go。\n\n### 5.4.6 R3 Corda](#chapter-5.xhtml_R_sec5_4_6)\n\nR3 Corda\
  \ [43] 是由 R3 银行联盟开发的 Corda 区块链。它是一个分布式账本框架，旨在为金融机构记录、管理和同步财务协议。Corda 的主要特点包括它不支持不必要的数据全局共享。Corda\
  \ 中的交易由交易相关的方验证，而不是无关的验证者。它支持多种共识机制。Corda 平台支持将业务逻辑和业务数据与相关法律文本连接的智能合约，以确保平台的财务安排具有坚实的法律依据且可执行，并在发生混乱、复杂或纠纷时有明确的遵循路径。\n\
  \n## 5.5 医疗系统去中心化区块链方法案例研究](#chapter-5.xhtml_R_sec5_5)\n\n区块链有望为医疗系统提供增强的安全和隐私支持。在本节中，我们提出了两个场景：一个是基础患者护理，另一个是医学研究。医疗系统的总体场景如图图\
  \ 5.7 所示。\n\n![image](img/fig5_7_B.jpg)\n\n图 5.7\n\n所有场景的图形化表示。\n\n### 5.5.1 场景\
  \ 1：基础患者护理](#chapter-5.xhtml_R_sec5_5_1)\n\n在这种场景下，通过在当前医疗系统中使用区块链可以减少以下问题：\n\n\
  * 当患者需要经常访问多家医院且无法跟踪历史记录时，会出现所需数据缺失的情况。\n* 在不同的提供者之间共享医疗记录非常耗时且需要大量努力。\n* 当数据不可用时，患者需要重复检查。这发生在记录存储在不同医院时。\n\
  \n### 5.5.2 场景 2：用于学习研究目的的医疗数据聚合](#chapter-5.xhtml_R_sec5_5_2)\n\n医疗系统的基本原则是确保健康数据的来源通过可靠的医疗专业人员和医疗机构。因此，需要实现数据的真实性、机性和完整性。通过使用共享分布式账本将保护患者隐私。共享分布式账本将提供数据聚合过程的可追性和透明度。通常，由于缺乏适当的机制，患者不愿意参与数据共享。区块链的主要利益相关者涉及医疗机构网络、生物健康库和医学研究人员。这些利益相关者促进了在研究活动期间收集患者医疗数据进行进一步研究和分析的全过程。\n\
  \n### 5.5.3 医疗系统的应用场景](#chapter-5.xhtml_R_sec5_5_3)\n\n\n\n\n\n在本节中，我们重点关注上述场景 1\
  \ 的 EMR 共享。具体而言，我们在这里关注的是需要长期治疗和终身监测的癌症患者。我们将展示该系统的原型设计和架构。癌症治疗需要患者具有移动性；因此，他们需要安全存储数据以进行进一步治疗。如果患者需要从一家医院转到另一家医院，患者必须签署同意书。然后，信息会被发送给接收者。这可能变得复杂且不便。在这种情况下，数据传输需要时间，而且管理人员在收到数据纸质版后，需要再次将患者引入系统。因此，患者访问数据也是困难的。\n\
  \n### 5.5.4 区块链驱动医疗系统的建议框架](#chapter-5.xhtml_R_sec5_5_4)\n\n该框架由注册服务、存储数据的数据库、管理共识过程的节点以及针对不同用户角色的\
  \ API 组成，如图 5.8](#chapter-5.xhtml_fig5_8)所示。注册服务的主要功能是为不同的角色注册用户（目前我们仅使用医生和患者）。在注册过程中，医生不能是恶意用户；他们应该被验证为医疗医生。现在，注册服务可以引用国家执业医师数据库来验证医生的身份。注册服务通过为每个医疗系统用户生成用于数字签名的秘密密钥对和用于加密的密钥对来验证身份。此外，医生和患者之间需要数字签名来传输医疗数据。\n\
  \n![image](img/fig5_8_B.jpg)\n\n图 5.8\n\n建议方法的架构。\n\n患者数据将首先存储在医院的本地数据库中，其次存储在云数据库中，该数据库存储患者数据并使用患者个人的秘密密钥对其进行加密。此外，医院中注册的医疗人员将根据个人用户的访问控制策略访问或上传远程云数据库中的数据。节点遵循`PBFT`共识协议。节点将接收用户通过`APIs`进行的所有交易。\n\
  \n### 5.6 区块链驱动的 IoT 应用的性能挑战](#chapter-5.xhtml_R_sec5_6)\n\n#### 5.6.1 完整性](#chapter-5.xhtml_R_sec5_6_1)\n\
  \n在文献中，已经提出了多种解决方案来处理资源受限的 IoT 网络中的自私矿工攻击 [44]。特别是自私挖矿攻击，由于其复杂性和对完整性的巨大损害，已经得到了深入研究。在这里，矿工扩展区块的决策需要合法矿工，而这可以减少由自私行为异常的区块链矿工所预测的区块链。然而，由于自私和行为异常的区块链矿工泛滥，区块链的完整性极不稳定。这种破坏完整性的矿工导致了高昂的计算成本和整个区块链系统性能下降。这些矿工执行区块链分叉，导致困难的共识状态、之前存储数据的丢失、产生无效交易并污染区块链。作为一种解决方案\
  \ [9]，在这种情况下，可以通过工作证明（`PoW`）维护区块链的完整性，避免将高比例的算力分配给矿工，并增加活跃合法矿工。\n\n#### 5.6.2 匿名性](#chapter-5.xhtml_R_sec5_6_2)\n\
  \n使用比特币的区块链在执行交易时提供用户的伪匿名性。为此，每个用户通过多个随机交易地址进行标识 [45]。此外，比特币用户可以通过更改地址与自己进行交易 [46]。在这里，用户可以将更改的地址与其唯一的\
  \ IP 地址关联。然而，由于比特币-用户服务的中心化方法，这种将多个随机地址与每个用户 IP 地址关联的方法缺乏高风险的匿名性保护。此外，区块链本身是公开的，黑客可能会通过分析目标用户的网络流量来发现缺乏匿名性的问题。为了处理这个问题，一种有前景的解决方案是协议混合，该协议涉及在交易请求和对交易的响应时使用两个不同的地址\
  \ [47]。\n\n#### 5.6.3 可扩展性](#chapter-5.xhtml_R_sec5_6_3)\n\n区块链交易和应用程序数量的增加导致了扩展性问题\
  \ [48]。特别是将区块链适配资源受限的 IoT 设备至关重要。分层区块链方法以有限的方式解决了扩展性问题，其中应用层和区块链通过卸载到远程系统分别执行。然而，将次级区块操作卸载到远程系统的网络相关问题涉及网络连接和延迟。此外，区块链中的`PoW`在\
  \ 1MB 的默认区块大小内消耗了大量的内存空间。反之，交易输出不可避免地受到每个区块链尺寸增加的影响，并涉及复杂的交易验证。[34] 中的作者建议将`PoW`分配给区块链的信任节点。矿工的选取是根据所需的空间和`PoW`的低计算成本进行的。\n\
  \n### 5.7 结论与未来展望](#chapter-5.xhtml_R_sec5_7)\n\n在当今技术时代，IoT 系统及其应用已涉及人类生活的方方面面，旨在提高生活质量。然而，此类\
  \ IoT 系统面临着严峻挑战，即由于设备的异构性和资源限制带来的安全和隐私问题。这种复杂性包含了多种协议和标准。为了克服中心化安全和隐私机制的局限性，区块链有望成为有效的解决方案。因此，本章介绍了区块链技术的基础知识，如去中心化、分布式账本、智能合约、加密技术和共识机制。接下来，介绍了\
  \ IoT 协议栈的分层架构。然后讨论了 IoT 网络的安全需求，如数据安全和隐私、医疗设备认证、信任用户、IoT 设备访问控制、加密密钥和数据哈希。介绍了一些基于区块链的\
  \ IoT 应用。此外，探讨了`Ethereum`、`Hyperledger Fabrics`和`R3 Corda`等区块链技术。还作为一个案例研究，展示了用于医疗\
  \ IoT 应用的区块链去中心化框架。最后，确定了扩展性、适应性、匿名性和完整性是区块链辅助 IoT 系统的性能挑战。未来展望方面需要解决异构平台和标准的区块链集成问题。\n\
