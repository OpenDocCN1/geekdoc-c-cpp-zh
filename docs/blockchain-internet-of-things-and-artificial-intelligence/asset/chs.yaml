  \n## 12.8 结论\n\n各项技术——即物联网（IoT）、人工智能（AI）和区块链——正在兴起。许多组织已根据工作类型/产品类型应用了这些技术；它们确实通过提升行业效率带来了利润/收益——我们在本章讨论了这三种新兴科技如何彻底变革商业领域及产业发展模式**References**目前已取得进展当任何单一技术的参与若无三者协同作用未来时期几乎不可能创造奇迹这意味着商业模式必须经由\
