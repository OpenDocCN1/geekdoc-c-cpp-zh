  \nProceed with correct markup output enclosed between `[content]...\n\n\n\n\n由于人口增长和资源稀缺，世界经历了意料之外的增长。近期研究显示，居住在城市的人（54%）已超过农村和城镇地区（46%），且这一数字到\
  \ 2050 年将增加到 66% [30]。由于这种增长，城市正关注新技术，并旨在降低投资成本、高效利用资源以及提高城市环境的生活质量。新技术的重大进展使得一系列设备的互联变得简单，并使其能够即使从远程位置也能传输数据\
  \ [30]。\n\n在中心化点存储数据时，可能会发生设备欺骗、漏洞、防篡改能力不足、身份验证、完整性或数据共享可靠性降低的问题。为了解决这些安全和隐私问题，消除了中央服务器的概念并引入了区块链技术。区块链允许在分布式账本的帮助下以更快的方式进行\
  \ P2P 消息传输。分布式账本具有极保护性，不允许数据的任何误读或错误认证。\n\n### 8.6.1 数字签名\n\n在基于区块链的技术中，分布式账本数据库充当大脑的角色。为了保护数据库免受主动攻击，使用了基于数字签名的加密哈希算法-1（`SHA-1`、`SHA-2`\
  \ 和 `SHA-256`）。公钥加密为区块链中的用户创建了安全的数字身份。安全的数字身份涉及谁是谁以及谁拥有什么；这些是 P2P 交易的基础。\n\n公钥加密允许通过一组被称为\
  \ `private key`（私钥）和 `public key`（公钥）的加密密钥检查个人的唯一身份。这两个密钥的组合创建了数字签名。该数字签名通过个人的私钥证明内容，并由个人的公钥进行确认。数字签名文档具有以下益处：\n\
  \n| 特性 | 描述 |\n| :--- | :--- |\n| 身份验证 | 在访问区块链之前，每个用户都必须经过身份验证。验证通过后，将生成二维码或唯一标识作为令牌\
  \ |\n| 不可否认性 | 相应人员不应声称其未参与交易。 |\n| 完整性 | 验证原始真实性 |\n| 机密性 | 账本数据对未授权的人员隐藏 |\n\n\
  ### 8.6.2 同态加密\n\n在不改变区块链属性的情况下，可以使用同态加密技术在区块链上存储数据。同态加密技术允许在公共区块链上完全访问加密数据，以用于审计和管理资金交易\
  \ [31, 32]。\n\n## 8.7 结论\n\n智能城市是目前正在开发的项目，旨在增强居住市民的生活方式。大城市人口密集，因此需要复杂的科技集成来实现智能城市。开发智能城市需要考虑基础设施、能源管理、交通、医疗保健、废物管理等关键方面。智能城市是通过智能\
  \ IoT 设备网络来实现的。智能城市必须开发一种存储 IoT 设备生成数据的架构。它还应该确保以考虑完整性的安全方式处理数据。因此，区块链可用于安全地存储数据，并且有证明区块链可以与\
  \ IoT 和 AI 技术结合以应对智能城市的挑战。本章阐明了同意管理对于保护用户的重要性，并概述了如何执行同意管理。已经制定出了一种使用区块链保护 IoT 设备生成数据的清晰方案。最后，阐述了智能城市的风险以及如何尽量化这些风险的措施。\n\
