  \n\n\n通过整合 `AI` 和 `blockchain` 可以实现智能计算。我们目前所做的是使用大量的计算能力，通过暴力攻击得出哈希值，这被称为“随机数（nonce）”。但如果有一种基于\
  \ `AI` 的方法以不同且更高效的方式处理这种计算呢？如果给一个基于机器学习的程序或算法输入适当的训练数据，它就可以实时磨练其技能 [1]。我们知道 `blockchain`\
  \ 中的数据是无法被操纵的。涉及到去中心化 `AI` 时，它比 `AI` 高得多，因为它本身就是 `blockchain` 和 `AI` 的集成。`AI` 项目通常基于中心化系统，而另一方面，`blockchain`\
  \ 完全基于去中心化网络，该网络中的任何成员都可以访问。准确来说，`blockchain` 包含了账本，该账本分配给网络中的每个成员。例如，SingularityNet\
  \ 连接了 `blockchain` 和 `AI`，以实现更智能、去中心化的 `AI`。`Blockchain` 系统可以处理大量的异构数据集。通过在 `blockchain`\
  \ 上创建一个 `API` 集合，它可以考虑到 `AI` 专家之间的相互通信 [2]。随后，可以基于各种数据集建立不同的算法。\n\n数据变现是 `WhatsApp`、`Facebook`\
  \ 等公司巨大的收入来源。目前，数据在未经用户同意的情况下被不同公司变现。它也可能被用来反对我们。为了确保机性，`cryptography` 发挥了广泛的作用，结合\
  \ `blockchain` 的实施，允许我们作为用户通过加密手段监控自己的信息，并以我们认为合适的方式进行利用。同样，如果我们决定，我们还可以逐渐调整信息，而无需牺牲个人数据。当我们审视\
  \ `AI` 时，它也需要数据集用于训练。为了实现这一目的，我们可以直接从所有者或创建者处购买数据。这使得整个过程比现在要公平得多，不再有科技巨头剥削用户。这些数据市场还可以帮助基于\
  \ `AI` 的较小公司 [3]，因为喂养或训练 `AI` 需要许多有时无法负担的费用。通过利用去中心化的数据市场，较小公司可以获得昂贵且私有保留的数据。\n\n\
  由于数据在 `blockchain` 中是不可篡改的，且它被用于 `AI` 的训练 [3]，这有助于研究人员让 `AI` 能够为人类瞬间做出个人决策，并且处理更大规模数据集变得更加典型。不可篡改的数据集增加了\
  \ `AI` 正确处理的能力；另一方面，`AI` 从过去中学习，并增强了其能力和水平。我们可以审计这些决策，以确保它们仍然反映现实。\n\n“Blockchain”是\
  \ `block` 和 `chain` 两个词的结合，它由块组成，这些块随后形成了链。这些块 [4] 是带有时间戳的不可篡改数据记录，由许多计算机而不是单一实体进行管理。若干种加密措施保护了这些块。当我们提到由许多机器管理它时，我们指的是去中心化网络，因此没有中央机构。`Ledger`\
  \ 是 `blockchain` 最关键的部分，它揭示了 `blockchain` 中所需的本质信息。这些账本是不可篡改的并与网络的其他用户共享。`blockchain`\
  \ 带有基础设施成本，但没有交易成本。无论购买的是信息还是钱，过程都是通过生成新块来启动的。该块由分布在网络中的几台机器进行验证。这不仅创建了一个唯一的记录，还创造了一个具有独特历史的卓越事业。伪造单个文件意味着伪造整个\
  \ `blockchain`。这几乎是不可能的。这种模型在 `Bitcoin` 中实现。\n\n`Blockchain` [5] 可以实现在信息、货币或敏感文件传输的地方。`Blockchain`\
  \ 可以帮助我们完成此类任务，确保交易安全并减少欺诈风险。`Blockchain` 割掉了费用处理中间人，并消除了对匹配平台的需求。\n\n### 6.1.1\
  \ Blockchain 的优势\n\n- **去中心化网络**：`Blockchain` 涉及多个节点。每个节点持有数据库的完全副本。\n- **稳定性**：`blockchain`\
  \ 中已确认的块极不可能被反转，这意味着 `blockchain` 中无法进行数据操控，从而维护了数据的完整性。\n- **无信任系统**：对于任何基于 `blockchain`\
  \ 的交易，都需要第三方的介入，无论是银行还是不同的网关。但 `blockchain` 交易仅取决于涉及的双方。\n\n### 6.1.2 Blockchain\
  \ 的缺陷\n\n- **过度消耗电力**：`Bitcoin` 软件消耗的电力约为 2.55 吉瓦 (GW)，几乎相当于爱尔兰国家。另一方面，Google 在\
  \ 2015 年在全球使用了 5.7 TWh。此外，平均而言，`Bitcoin` “矿工”消耗的电力是前一年的五倍。\n- **不是巨大的分布式计算系统**：当我们说\
  \ `Bitcoin` 是一个分布式网络时，并不是指它是一个分布式计算网络。曾几何时，全世界的所有节点都在进行计算。据认为这些节点一点点收集更大的东西，但这是错误的。所有节点维护的是相同的内容。例如，在\
  \ `Bitcoin` 中，所有节点维护相同的内容。\n- **挖矿不提供网络安全**：在 `blockchain` 中，矿工维持稳定性和安全性。如果我们谈论\
  \ `Bitcoin`，如果存在超过 50% 的故障矿工，他们就可以更改或重写之前的节点，从而导致安全性消失。\n- **可扩展性：Blockchain 的弱点**：`blockchain`\
  \ 的最佳实现之一是 `Bitcoin`。在 `Bitcoin` 中，交易处理速度是静态的，因为用户很少，这意味着主要只有少数人使用 `blockchain`。另一方面，我们有\
  \ `Visa`，它每秒处理数千次交易。这就是为什么在可扩展性方面，传统方式仍然领先于 `blockchain`。\n- **对非技术人员的问题**：对于基于\
  \ `blockchain` 的网络存储虚拟货币对于现实生活中不那么懂技术的人来说可能非常困难。通常，这种技术对于熟悉技术的人是有用且有益的。\n- **网络规模**：`blockchain`\
  \ 需要网络中有大量的用户。\n- **匿名性是一种威胁**：对 `blockchain` 的过度炒作是因为它是匿名且对所有人开放的。对所有人开放是一个很好的选择，但我们不应否认过度透明会带来危险。如果一家公司或组织通过\
  \ `Bitcoin` 向某人支付怎么办？像 `Bitcoin` 这样的支付模式会导致公司以 `Bitcoin` 形式拥有的金额暴露，这对媒体或通道中的每个人都是可见的（在这种情况下，它是\
  \ `Bitcoin`）。\n\n\n\n\n\n- 过度的工作量证明：`PoW`代表“工作量证明”（Proof of Work），是一种用于验证即将添加的区块的机制。`PoW`需要大量的计算能力。同一网络中的每个节点都试图通过生成“随机数”（nonce）来验证区块。第一个找到`nonce`的人将获得奖励，其他节点则对该`nonce`进行验证。现在你可以自己推导出这个过程的效率有多低。大量的计算能力被付诸虚设。它的实用性如何？并不高。即使是`PoW`的替代方案权益证明（`PoS`），效率也不算高。\n\
  \n### 6.1.3 人工智能：人类智能的模拟\n\nAI 有时被称为“机器智能”。它是计算机科学的一个分支，强调创建智能机器。我们指的是创建能够让计算机能够独立完成任务的智能。AI\
  \ 帮助设备像人类一样工作和行动；这这就是为什么`AI`被广泛应用于自动驾驶汽车、语音识别、问题解决等领域。这些机器并不是通过程序在不同情况下采取行动的；它们需要过去的经验（如数据集）来进行学习。图\
  \ 6.1 显示`AI`具有改变世界的特征。\n\n![image](img/fig6_1_B.jpg)\n\n图 6.1\n\n改变世界的 AI 特征。\n\n\
  ### 6.1.4 人工智能与区块链的融合\n\n估计区块链在网络上验证和共享交易的成本约为 6 亿美元。能源消耗导致了高昂成本，而浪费是区块链的另一个问题。我们所说的浪费是指挖矿过程。每当网络上发生交易时，矿工需要解决一个需要大量计算能力的数学问题。这种方法是低效的。`AI`具有处理和优化该过程并降低挖矿成本的潜力。区块链从一开始就持有数据，导致链变得更长更重。在这种情况下，`AI`可以通过机器学习帮助区块链在数据存储和维护方面做出更智能的决策。\n\
  \n`AI`的问题在于它的中心化本质。由于我们不知道它是如何工作的，即使是它的所有者也无法判断其决策过程。它通常像一个黑箱：没有人对他们创建的`AI`拥有完全控制权。最重要的一点是它完全基于概率，这意味着`AI`有时可能会因为数据故障而出错。因此，为了让`AI`发挥其全部潜力，它需要具有一定程度的透明度和能力。\n\
  \n## 6.2 使用人工智能进行区块链账本数据决策\n\n区块链挖矿是资源密集型过程浪费。要在区块链中添加新区块，矿工必须对其进行验证，这需要大量的能量。区块链中的`PoW`协议类似于一种抽票机制，负责消耗能量。另一方面，有意义工作证明（`PoUW`）基于机器学习。与其说是抽票机制，不如说矿工在执行诚实的机器学习（`ML`）跟踪工作后将获得奖励。由于它不再是抽票程序，其他人可以通过额外的激励为网络贡献。`PoUW`包含了对有用工作的奖励和对恶意行为者的惩罚；它将是一个与区块链安全性相结合的`AI`系统。在使用`ML`设计`PoUW`系统时，也存在障碍。`ML`任务与哈希计算不同，因为它更复杂、更多样。`ML`任务是异质的，因此验证网络上参与者所做工作的性质变得困难。在这样一种不信任的环境中，很难分配和协调一个`ML`训练过程。\n\
  \n### 6.2.1 分布式账本\n\n“分布式”在本质上意味着去中心化，这意味着不会有任何中央服务器；网络完全分布在几个节点之间。而“账本”是通过遍布整个网络的分布式节点实时添加数据的一种。然而，一旦数据输入，后就无法被删除或操纵。它是一种不受任何中央机构控制的共享账本。它充当法律和财务等不同类型资产的数据库。每个节点都有一个完全相同的副本，因为分布式账本始终实时更新。分布式账本的优势如下：\n\
  \n- 用户控制其所有数据\n- 整个网络中保持数据的一致性\n- 数据操纵几乎不可能\n- 针对恶意攻击具有隔离性\n- 无信任生态系统\n- 透明性与安全性并存\n\
  \n### 6.2.2 系统概览\n\n#### 6.2.2.1 环境\n\n个人`AI`区块链的环境由权益证明（`PoS`）和工作量证明（`PoW`）组成。如图\
  \ 6.2 所示，这是一个点对点（`P2P`）网络：\n\n- 客户端：这些节点用于支付以便在个人人工智能（`PAI`）区块链上训练模型。\n- 矿工：用于训练目的。他们通过计算`nonce`来挖掘新区块。训练是分布式的，所有矿工通过共享他们的模型更新进行协作。\n\
  - 监督者：他们在一个名为“消息历史”的日志文件中记录任务期间传输的每条消息。他们在训练期间检查恶意行为，因为该环境可能包含一些拜占庭节点。\n- 评估者：他们测试从每个矿工派生的最终模型，并将最好的一个发送给客户端。他们是独立的。他们还分配客户费用并支付给所有节点。\n\
  - 验证者：他们验证每个区块是否有效。他们的存在是因为计算验证成本高昂，并且并非由所有节点执行。\n- 同等节点：他们不是`PAI`区块链的一部分；相反，他们使用区块链交易。\n\
  \n![image](img/fig6_2_B.jpg)\n\n图 6.2\n\n人工智能区块链环境。\n\n#### 6.2.2.2 交易\n\n比特币交易是签名的数据结构，持有版本信息、输入和输出。只有当其输入引用其他未花费输出时，交易才是真实的。在`PAI`区块链中，处理训练、评估、验证和支付的方法不同。`PAI`要求所有信息都在交易输出之一的`OP_RETURN`代码中。交易在包含在区块之前必须在`mempool`（交易内存池）中等待。随后交易在整个`P2P`网络中传播。\n\
  \n#### 6.2.2.3 质押\n\n我们不是通过`PoW`奖励节点，而是使用名为“质押”的机制。除了普通节点外的所有节点必须先存入代币。如果参与者完成了工作，锁定的资金将释放或连还还。\n\
  \n#### 6.2.2.4 任务\n\n客户端将任务定义`T`以及相应的费用`F`作为特定的交易提交到区块链（`PAY_FOR_TASK`），包含：\n\n\
  - 生成的模型描述\n- 优化器\n- 停止准则\n- 验证策略\n- 精度损失\n- 数据集信息\n- 性能\n\n#### 6.2.2.5 协议\n\n在我们的人工智能账本数据决策系统中，客户端将任务广播到\
  \ PAI 网络。现在，矿工和监督者由网络本身随机分配。该分配基于工作节点的偏好`P`和任务`T`。\n\n数据集随后被划分为：\n\n\n\n\n\n*  \
  \ 训练数据集（提供给矿工以执行机器学习任务）\n*   验证数据集（从初始数据集中选取，用于验证机器学习模型）\n*   测试数据集（提供给评估者以测试最终模型）\n\
  \n## 6.3 使用 AI 提高区块链效率\n\n在讨论如何利用 AI 提高区块链效率 [10] 之前，我们首先需要确定是否有必要整合这两个不可思议且广大的领域。如果是，那么整合的原因可能是什么，随后将给出结论。\n\
  \n### 6.3.1 AI 与区块链协作的意义\n\n人工智能是计算机科学中一个令人惊叹的领域。它需要机器学习算法和神经网络来提高性能。现在对数据集的需求就有了。什么是数据集？当你需要训练\
  \ AI 时，你需要为它提供一些数据集。基于你用于训练的数据，就可以生成智能响应。Thomas C. Redman 曾表示：“如果你的数据是糟糕的，你的机器学习工具就毫无用处。”信任你的\
  \ AI 意味着信任你用于训练它的数据集。你可以使用非常强大的 AI 算法 [11]，但如果你出于训练目的使用虚假或操纵的数据集，结果可能会令人失望。\n\n\
  让我们先理解一个现实世界的场景。如果你拥有一个数据集，有人将其用于喂养，从技术上（或实践上）来说，你就主宰了这个数据集，因为你一旦操纵了数据，结果就会反映在他人的选择中。为了更好地理解，让我们来看一个实际例子。我们这些公民依赖大科技公司。我们信任他们的数据集，是因为这些数据是为了好的，而且他们没有动机去操纵信息碎片。但我们没有忘记，像我们这样的人统治着公司。他们还没有操纵数据集！\n\
  \nAI 的问题在于其中心化的工作方式。它可以被理解为一个黑箱，甚至它的创建者都不理解它具体是如何运作的。由于 AI 是基于概率的，它可能是对的也可能是错。现在我们得出结论，这些错误可能是由于数据故障。因此，要充分发挥\
  \ AI 的潜力需要去中心化的概念。这样它就能提供绝对水平的透明度，并获得真实数据访问的能力。\n\n这个问题可以通过实施区块链来解决。区块链完全基于不可变的数据集。如果我们使用这些不可变的数据集进行训练，我们将创建一个更可信的、且以后不会被操纵的\
  \ AI。\n\nWeb 2.0 指强调用户生成内容、易用性、参与式文化和互操作性的网站，这意味着对于终端用户与其他产品、系统和设备兼容。Web 2.0 的问题在于，如果你不是网络的所有者，就不允许通过脚本读取与用户发生的实际交互，因为脚本是\
  \ 100% 私有的并运行在他们的服务器上。\n\n### 6.3.2 区块链效率\n\n迫切需要改变区块链设计的传统方式 [12]。因为对计算能力的需求日益增长，无论公司规模大小，这给公司的\
  \ IT 管理员和现的数据提供者带来了挑战。目前的芯片架构正不断接近可行性的极限。数据中心只能通过将电路更牢地集成到更小的空间内来变得更快、更高效。\n\n1965\
  \ 年，英特尔创始人格尔登·摩尔（Gordon Moore）提出，每 18–24 个月，处理器的性能就会提高，同时成本就会降低。他的这一说法被称为“摩尔定律”。这条定律在\
  \ 53 年里都是正确的。问题是，计算能力的需求增长快于处理器性能的进步。有一些云解决方案承诺让最现代硬件尽可能高效地为许多客户服务。但再次，全球范围内存在许多物理数据中心。云数据中心结合了计算动力的需求，因此需要高性能的\
  \ IT 基础设施并消耗大量电力。根据摩尔定律在固定间隔内效率翻倍仍然不足以满足增长更快的需求。\n\n解决这一问题的方案之一是图形处理器（GPU）。与传统的\
  \ CPU 相比，GPU 可以执行较少的复杂操作。它们最初是为了处理高分辨率图像和纹理而发明的。快速 GPU 也注定将用于基于 AI、ML、深度学习、自动化以及增强现实/虚拟现实（AR/VR）的新应用。\n\
  \n### 6.3.3 AI 与区块链整合的益处\n\n这种整合有很多益处 [12]，其中一些列在图 6.3 中。\n\n![image](img/fig6_3_B.jpg)\n\
  \n图 6.3\n\nAI 与区块链的优势。\n\n*   **无缝数据管理**：对于数据挖掘，区块链完全依赖算法。这些算法尝试寻找每可能的组合，直到找到用于验证的正确组合。这种方法包含复杂性并需要大量精力。在这里，AI\
  \ 可以帮助区块链技术摆脱这种方法。AI 可以让算法更加智能，使数据管理过程无故障。\n*   **智能能耗**：如果你决定运行区块链，它大量的处理能力。我们以前计算区块链中\
  \ `nonce` 的方法完全基于 `brute force`（暴力破解）概念，这需要巨大的计算能力，因为在暴力破解中，解决方案的每种可能性都会检查是否满足问题的陈述。AI\
  \ 可以抓住机会，允许我们更高效、更智能地处理任务。我们可以构建一个输入了适当训练数据的机器学习模型。这种模型对于实时实际练技能非常有用。最终，ML 减少了投入数据挖掘的精力和时间。\n\
  *   **可扩展性**：区块链的大小随时间推移显著增加。区块链大小的增长速度可能是每 10 分钟 1 MB。目前，我们没有足够有效的方法优化并删除区块链中的数据。AI\
  \ 引入了一种去中心化的学习系统，允许区块链更高效、更具扩展性。它释放了控制收益的新方法。\n*   **数据安全**：当我们将这些技术结合时，我们可以选择为人们极其敏感和重要的个人信息提供强化。AI\
  \ 的进展取决于我们用于喂给它的数据；在这里，数据将是我们的。通过数据，AI 能够关于环境、世界等的信息。简而言之，AI 通过输入数据不断改进自己。另一方面，区块链允许我们在分布式账本上的加密存储中保护我们的数据，区块链代表了稳健的数据和数据安全。但当涉及到基于区块链的应用时，区块链需要更安全以防止任何数据泄露。为了这一目的，我们拥有\
  \ AI，它可以通过基于各种算法的不同功能使应用程序更安全，并使用包括自然语言处理（NLP）、区块链 P2P、链接和图像识别在内的许多数据集进行训练。\n\n\n\
  \n\n\n-   数据变现：这是 `Facebook` 和 `Google` 等跨国公司获取收入的主要来源之一。我们之前简要讨论过这个话题，例如让其他公司选择如何以生产性的的方式出售信息以进行业务演示。这些信息可能会被武器化并攻击用户。`Blockchain`\
  \ 允许我们通过加密措施确保我们的信息安全，并以我们认为合适的方式进行利用。这也实现了我们数据的变现，但规模非常小。`AI` 算法需要数据来学习和发展，因此它需要通过不同的市场直接从创建者那里购买数据集。这使得整个系统比现在更加公平和透明。这也有利于较小的公司，因为训练\
  \ `AI` 的成本可能极其昂贵。对于那些不通过市场产生数据的公司来说，它们可以访问数据集。\n\n-   信任 AI 决策：`AI` 基于深度学习并通过学习变得越来越聪明；对于科学家来说，要得出这组算法是如何得出特定结论或决策是非常具有挑战性的。这可能是因为\
  \ `AI` 算法能够处理海量的数据和变量。由于这种匿名性，科学家通过持续审计 `AI` 得出的结论来保留数据，以确保它们仍然反映了现实。现在我们可以得出结论，`AI`\
  \ 最终取决于我们使用的算法和数据集。如果我们输入虚假数据，`AI` 就无法信任它的预测。通过 `blockchain` 技术，我们拥有一组所有数据、变量和过程的不可变记录。通过适当的\
  \ `blockchain` 技术，从输入数据到结论的每一步都可以被观察，我们可以判断这些数据是否被篡改。它为 `AI` 程序得出的结论建立了信任。\n\n-\
  \   创建多样化数据集：`AI` 是完全中心化的，而另一方面，`blockchain` 是完全去中心化的，具有透明的网络，任何人都可以从全球任何地方访问公共\
  \ `blockchain` 网络。它提供了一个驱动各种加密货币和 `blockchain` 网络的账本。去中心化是目前的趋势，例如 `singularityNET`（`singularityNET`\
  \ 是一个去中心化的 AI 算法市场），它持续关注 `blockchain` 技术，以鼓励算法和数据的广泛分布，确保“去中心化 AI”的诞生。`Singularity\
  \ NET` 将 `blockchain` 与 `AI` 结合，创建更智能、更高效的去中心化 `AI`。通过 `blockchain`，它允许 `AI` 代理之间进行相互通信，以便不同的算法可以建立在各种数据集上。\n\
  \n### 6.3.4 AI 与区块链整合的挑战\n\n-   `blockchain` 的基础是去中心化的，与 `AI` 的基础非常不同 [13]。如果我们谈到\
  \ `blockchain` 节点的性质，我们发现它们是异构的。因此，如果 `blockchain` 是公开的，那么机器学习的输出就不可能以单点形式出现。\n\n\
  -   `AI` 需要大量数据集，而 `blockchain` 形成的数据库无法扩展到可以消耗如此大量的数据。这意味着在目前状态下，`blockchain` 无法与\
  \ `AI` 集成。\n\n-   在某些情况下，`AI` 未能展现其最强大的实力，例如 `Uber` 的自动驾驶汽车在开始避让红灯时失败了。在这些情况下，如果\
  \ `AI` 是去中心化的，管理其造成的损害将具有挑战性。\n\n## 6.4 基于区块链的去中心化人工智能\n\n在进一步学习关于去中心化 `AI` [14]\
  \ 之前，首先，让我们讨论一下中心化、去中心化和分布式网络。图 6.4 显示了分布式、中心化和去中心化网络的状况。\n\n![image](img/fig6_4_B.jpg)\n\
  \n图 6.4\n\n中心化、分布式和去中心化网络。\n\n#### 6.4.1 中心化网络\n\n这是一种网络，所有用户都连接到一个中央服务器，该服务器作为所有通信和数据传输的媒介。该中央服务器持有用户的所有信息。中心化网络用于即时消息平台。它由一个促进其运行的中间节点组成。这意味着它像银行一样持有所有用户的数据，信任是至关重要的。中心化网络的应用是消息。图\
  \ 6.5 显示了中心化网络的架构。\n\n![image](img/fig6_5_B.jpg)\n\n图 6.5\n\n中心化网络架构。\n\n中心化网络的优势如下：\n\
  \n-   高效且一致\n-   需要的基础设施较少，使其负担得起\n\n中心化网络的缺点如下：\n\n-   用户必须提供他们所有的数据\n-   它存在单点故障，使其变得不安全，从而损害了整个网络的可用性\n\
  -   可扩展性限制：它取决于单个服务器\n-   带宽限制：在多次交易的情况下，服务器可能成为瓶颈\n\n#### 6.4.2 去中心化网络\n\n它将工作负载分布在几台机器之间\
  \ [15]。它们不再依赖于单一服务器，而是将整个服务器分布在全球各地的不同服务器站。这是一个“无信任环境”，没有故障点。在这种网络中，每个节点都不依赖于单一服务器点；相反，它持有网络配置的副本。去中心化网络的应用是\
  \ `Bitcoins`、`blockchain` 和 `Tor` 网络。\n\n中心化网络的优势如下：\n\n-   确保匿名性和隐私\n-   高度可扩展\n\
  -   带宽从不是问题，因为没有可以产生瓶颈的单一服务器。\n-   高可用性\n-   对资源的更多控制\n-   性能更好\n-   系统更具活性\n- \
  \  失败概率较低\n\n中心化网络的缺点如下：\n\n-   需要更多的机器来支持系统，这增加了基础设施成本\n-   缺乏规律性\n-   难以识别故障节点和响应节点\n\
  -   维护成本高\n-   对用户的安全和隐私风险\n\n#### 6.4.3 分布式网络\n\n此类系统比去中心化网络领先一点。它同样没有单服务器策略。这里的权限是用户必须决定信息的访问权限，我们可以修改这些权限。它还允许用户将数据所有权共享与其他用户。在分布式网络中，处理分布在所有节点上，但决策可以是中心化的。\n\
  \n一个现实例子是互联网本身。它遍布全球，由大量的节点组成。但在获取或请求数据包时，用户应该拥有必要的权限。分布式网络的应用是多人在线游戏、集群计算、网格计算等。\n\
  \n中心化网络的优势如下：\n\n-   低闲置\n-   安全问题更少\n-   可管理的透明度水平\n-   可以垂直和水平扩展\n-   容错\n-  \
  \ 网络快速\n\n中心化网络的缺点如下：\n\n-   部署困难\n\n#### 6.4.4 去中心化人工智能\n\n\n\n\n\n去中心化人工智能（DAI），也称为分布式人工智能，是人工智能的一个分支。它旨在以分布式的方式找到问题的解决方案，并大规模地利用计算资源。这种方法有助于解决需要海量数据集的问题。DAI\
  \ 由分布在整个网络中的自主学习节点组成。\n\nDAI 代理可以独立运行 [16]，这使得它们处于松耦合状态。此外，节点可以通过之间的通信（通常是异步的）整合独立的解决方案。这种独立性使得\
  \ DAI 具有鲁健性和弹性；DAI 系统被设计为能够自适应并继承变化。与集中式 AI 不同，它们不需要将所有数据汇总到一个位置。DAI 提供的巨大扩展是，你可以在\
  \ DAI 系统的执行期间更改源数据集，因为它通常需要大规模数据集的哈希印象或子样本。DAI 的特征如下：\n\n*   它是一项在代理（节点）之间分配任务的技术\n\
  *   它还包括权力的分配\n*   它由代理之间的通信组成\n\n我们我们已经充分讨论了集中化、去中心化或分布式网络，但我们还没有讨论过去中心化网络与分布式网络有何不同。\n\
  \n### 6.4.5 AI 与区块链：宏大的统一](#chapter-6.xhtml_R_sec6_4_5)\n\n区块链被用于保持准确的记录和认证。虽然 AI\
  \ 有助于决策和模式识别，但区块链和 AI 具有一些协作特征。与它们协作会导致这两项技术在过去被认为不可能的领域得到扩展。\n\n这种协作确保了用户拥有：\n\n\
  *   增强的安全性\n*   去中心化的数据控制\n*   数据市场\n*   对数据使用和模型有更多的控制权\n\n### 6.4.6 集中式与去中心化人工智能](#chapter-6.xhtml_R_sec6_4_6)\n\
  \n集中式 AI 每天变得越来越具有挑战性。这是一个“富者愈富”的恶性循环，意味着只有富有且规模大的公司倾向于访问大型标记标记数据集。每种技术都有优缺点，AI\
  \ 也是如此 [17]。AI 模型完全依赖的数据集成本极高，小型组织无法负担购买此类数据集。之前的图表描绘了相同的场景。在图 6.6 中显示了一个循环图，它是基于\
  \ AI 解决方案的传统生命周期。\n\n![image](img/fig6_6_B.jpg)\n\n图 6.6\n\nAI 的生命周期。\n\n放置在圈内的实体在概念上是位于集中式过程中的去中心化活动。\n\
  \n### 6.4.7 数据集中化问题](#chapter-6.xhtml_R_sec6_4_7)\n\n这是我们未能充分利用 AI 的地方。AI 是一个通过数据产生不同问题的决策，就像智能问题。在当前时代，大公司拥有大多数数据集，这催生了\
  \ AI 问题。现在来尝试理解与我们讨论相关的情况，想象一个使用参与者作为数据集提供者的医疗 AI 场景。每个参与者都可以在适当的安全和隐私下贡献他们的数据。数据的去中心化所有是\
  \ AI 演变的必要步骤 [18]。去中心化数据集需要每个人的参与以及对安全和隐私的保证。正如我们所讨论的，区块链是适用于此类目的的技术。区块链是一项令人兴奋的技术，适用于数据脆弱性和分布式网络。如果我们想要每个参与者的贡献，这意味着它需要是分布的而非去中心化的。所有这些需求可以在区块链本身找到。图\
  \ 6.7 显示了数据集中化和数据去中心化的两种场景。\n\n![image](img/fig6_7_B.jpg)\n\n图 6.7\n\n数据集中化与数据去中心化的实时场景。\n\
  \n### 6.4.8 模型集中化问题](#chapter-6.xhtml_R_sec6_4_8)\n\n除了数据集中化，另一个存在的问题是模型集中化。让我们理解一下“模型集中化”的含义。假设不同的公司正尝试为一个特定问题构建\
  \ AI 解决方案 [19]，其中少数公司生成了具有独特性的模型。现在问题出现了，如果我们单独采用每个模型是否会更好，或者如果世界各地的数据科学家可以为这种场景提出并客观评估不同的模型会怎样？那不太棒了吗？模型和算法的去中心化随着时间的推移极大改善了\
  \ AI 解决方案。图 6.8 显示了集中式和去中心化的 AI 模型。\n\n![image](img/fig6_8_B.jpg)\n\n图 6.8\n\n集中式与去中心化的\
  \ AI 模型。\n\n### 6.4.9 其他一些集中化问题](#chapter-6.xhtml_R_sec6_4_9)\n\n除了模型和数据集中化，仍然存在一些问题，如集中式训练和正则化优化。集中式训练意味着训练应该由创建\
  \ AI 模型的同一组完成。让我们通过将模型放在去中心化网络上（人的决策独立于他人）来训练模型，以便使去中心化训练成为可能。AI 训练是 AI 解决方案的基本特征，受集中化的影响。\n\
  \n另一个集中化问题是正则化优化。通常，AI 解决方案旨在解决问题。可能属于一个组织，也可能是一个社会问题。为了实现这种目的，我们需要 AI 解决方案正确运行。但我们如何知道它是否运行良好？它随着时间的推移是在改进还是退化？我们使用相同的数据科学家对\
  \ AI 模型进行正则化。如果我们可以使用去中心化的 AI 专家来发现问题并尝试改进它会怎样？AI 正则化和优化是天生的去中心化方法，被迫适应去中心化。\n\n\
  ### 6.4.10 集中式大数据的信任问题](#chapter-6.xhtml_R_sec6_4_10)\n\n在当前时代，如果竞争在于收集、存储和分析尽可能多的数据，那么像\
  \ `Google`、`Netflix` 和 `Apple` 等公司将处于列表的前端。情况是富有的人更有活力和力量，创新的障碍也变得更高 [20]。由于大型 AI\
  \ 公司的封闭性，这使得社会的信任放在了“黑箱”中。\n\nAI 解决方案在三个关键层工作：\n\n1. 数据存储\n2. 算法\n3. AI 接口\n\n信任\
  \ AI 决策需要对以下方面有 100%的信心：\n\n*   数据的完整性和安全性\n*   响应式机器学习算法\n*   AI \n\n目前大多数 AI 模型都是集中式的，这种性质强制用户在不知道后台发生了什么的情况下盲信任每一层。\n\
  \n过去使用过名为 `COMPAS` 的 AI。它被用于美国的许多法院。后来得出结论认为，COMPAS 对黑人建议的刑期更长，而对白人不是，尽管所有其他数据点相同。结果是，AI\
  \ 做出了带有种族偏见的决策，没有人能够解释这一点。即使其母公司也无法解释。这种偏见的 AI 模型可能会造成严重的破坏。如果 `COMPAS` 是一个去中心化的\
  \ AI，任何数据科学家都能找出确切的问题。\n\n\n\n\n\n#### 6.4.11 区块链与人工智能的协作\n\n区块链拥有海量数据。在几年之后，区块链拥有的数据将足以在安全性上击败大数据技术\
  \ [21]。区块链有助于将权力从拥有大型数据集的人转移到构建智能实用解决方案和算法的人手中。目前有三个基于去中心化 AI 和区块链的运行项目；它们如下：\n\n\
  *   **Ocean Protocol**：它旨在创建一个“去中心化的数据交换协议和网络”。它激励发布用于 AI 模型训练的数据集。通俗地说，如果你在 Ocean\
  \ 网络上上传了有价值的数据，并且其他人使用这些数据训练 AI，你将获得补偿。\n\nGoogle 是拥有海量数据的公司之一。Google 在全球范围内拥有“巢主”。我用“巢主”这个词时，指的是\
  \ Google 产品的用户。现在发生的情况就像我一样，来自其他几个“巢主”的数据被上传到 Google。通过这些数据，Google 可以创建一个健壮的数据集，这对构建\
  \ AI 有帮助。所使用的数据是我和你你的，是有价值的，但 Google 却是免费获取的。\n\n如果你能为自己的数据获得补偿会怎样？通过 Ocean Protocol，你可以许可你的数据并获得相应的\
  \ Ocean 代币。你现在免费提供的所有数据现在都具有：\n\n*   数据完整性（数据来源已知）\n*   清晰的所有权\n*   用于购买或租赁这些数据的加密货币和区块链措施\n\
  *   **SingularityNet**：你们一定都听过“Sophia”，这是 SingularityNet 拥有的集成 AI 的机器人。假设你开发了一个可以帮助营销人员、政府和社会的\
  \ AI 算法。这正是 SingularityNet 在 AI 层面关注的。你可以让你的 AI 模型供他人使用。例如，如果你建立了一个用于研究印度能源消耗的模型，它可以与其他互补模型整合，创建出更强大、更精确的\
  \ AI。\n\n由于模型的所有权是清晰，这意味着它的知识产权受到了保护。每当模型被使用时，你都将获得 SingularityNet 调整后总收入（AGI）代币补偿。\n\
  \n*   **SEED**：它专注于接口层面，并确保我们信任生活中的机器人。机器人最好的例子之一是 Amazon Alexa，因为它在全球范围内被广泛使用。即使信任像\
  \ Amazon 这样声誉良好的公司，也无法保证其机器人没有被劫持。解决这一问题的方案是将其与 SEED 网络集成。\n\nSEED 网络是一个开源且去中心化的网络，我们可以在其中管理、查看和验证所有的机器人交互。每当你与机器人交互时，你都会以交互的形式使用数据来“喂养”它。你应该为“喂养”获得补偿吗？SEED\
  \ 认为应该，并且它在区块链上保护你的资产权益。\n\n#### 6.4.12 基于区块链的 AI 平台\n\n到目前为止，我们讨论并可能得出结论：AI 在训练过程中会暴露用户数据隐私，并且训练需要高昂成本，这正成为\
  \ AI 开发和演进的障碍 [22]。这些问题可能是数据隐私、所有权和交换，以及模型隐私，这在中心化机器学习范式或联邦学习中解决起来是具挑战性的。因此，可以使用基于区块链的训练范式，其目标是通过分布式数据训练模型，并保留数据的所有权和训练后模型的收益。在这种方法中，我们使用区块链作为基础架构，其中我们抽象出不同的参与者（即模型提供者、数据提供者），他们采取不同行动以实现自己的目标，例如通过与不同参与者的联邦学习来实现和分发加密模型训练、设置智能合约作为模型训练基础设施，以及设置通知服务器。训练数据的定价根据其贡献设定，因此它不关乎数据所有权的交换。\n\
  \n随着深度学习实用性的扩大，数据的重要性变得更加大。然而，在当前的中心化范式中，数据从终端用户收集并上传到远程服务器进行数据分析和建模。在此过程中，由于以下问题，数据和模型之间出现了显著差异：\n\
  \n1.  **中心化成本**：使用大量数据训练模型需要维持极高的成本。模型开发者必须能够负担模型训练的训练和存储费用。虽然大公司可以负担起这种训练，但这种高成本训练对小公司来说是一个障碍。\n\
  2.  **安全与隐私**：在所有数据从用户收集并上传到服务器后，会产生维护和安全成本。此外，这种中心化的数据存储存在服务器隐私问题。用户必须向第三方提供其价值的数据，甚至在服务器被黑客的情况下提供给恶意方。\n\
  3.  **所有权**：用户一旦向服务器提供数据，就失去了对数据的所有权，无法进一步控制数据的传输。因此，在这样的范式中设置合理的用户激励是必要的。\n4. \
  \ **单点故障**：中心化的建模方案经常面临最终因诉讼而消失或服务器故障的问题。\n\n为了解决这些挑战，联邦学习发挥了重要作用。它保留了数据所有者的数据隐私。通过这种方式，我们不需要收集大量数据并将其存储在中心化网络中。相反，数据保留在其创建者手中。同时，研究人员向数据移动模型。\n\
  \n### 6.4.13 区块链对去中心化的贡献\n\n*   **区块链是基础设施的基础**：区块链可以作为一种每个人都可以参与的基础基础设施。我们可以让 AI\
  \ 模型变得高度去中心化，这有助于使用不同类型的数据集训练算法，确保数字资产的所有权。\n*   **实现智能合约**：智能合约将作为建模基础设施，发布建模任务、训练聚合指令以及奖励策略。\n\
  *   **模型保护**：我们不是将数据移动模型，而是在区块链上部署模型并向数据移动。此外，我们应该为模型提供安全性。这可以通过应用同态加密和多方计算来实现。\n\
  *   **降低训练成本**：我们使用联邦学习来训练模型，这在很大程度上降低了训练成本。\n\n#### 6.4.14 设计概述\n\n在本节中，我们介绍了 DAI\
  \ [23] 作为一种机器学习的新型范式。DAI 的概念基于三个因素，如图 6.9 所示。\n\n![image](img/fig6_9_B.jpg)\n\n\
  图 6.9\n\n去中心化人工智能框图\n\n*   **数据提供者**：数据提供者可以是终端用户、公司或任何愿意将其数据交换服务或其他激励的组织，如图 6.10\
  \ 所示。他们从传感器或其他数据资源收集数据。收集数据后，对其进行评估并提供质量衡量以及其架构。数据提供者授权将其数据用于建模，这并不意味着数据已经交给了其他方。\n\
  \n    ![image](img/fig6_10_B.jpg)\n\n    图 6.10\n\n    通过数据提供者收集数据。\n\n\n\n\n\n\
  - **模型提供者 (Model Provider):** 指其自身的模型。模型提供者开发并分发机器学习模型，并在数据提供者的帮助下进行利用和训练，如图 6.11\n\
  \n图 6.11\n来自模型提供者的模型选择。\n\n- **计算提供者 (Computation Providers):** 网络中运行模型训练智能合约的节点。它确保数据和模型都得到保护。模型训练任务作为联邦学习任务分布在多个计算提供者之间。网络中的计算节点是独立的，这意味着即使是数据提供者如果有高性能\
  \ GPU 集群也可以成为计算提供者。计算提供者的工作模型如图图 6.12\n\n图 6.12\n计算能力原理图。\n\n区块链网络中一些基础支持节点：\n\n\
  1. **通知 (Notification):** 负责通信和事件触发。当区块链中生成新块时，通知中心会生成一个新的 `Goroutine` 来监听它。`Goroutine`\
  \ 是一种函数或方法，它与同一程序中存在的任何其他 `Goroutines` 独立且并行执行。\n2. **区块链 (Blockchain):** 记录参与节点的地址及其数据或模型。\n\
  3. **智能合约 (Smart Contract):** 它是分布式模型训练遵循的基础设施。智能合约由系统约定组成，旨在数字化地促进、验证或实施协议的安排或执行。它允许在没有外部人员的情况下进行可信的交易。\n\
  \n#### 6.4.14.1 训练过程设计\n\n现在我们将讨论在基于区块链的平台 DAI 上模型训练的工作流是如何发生的。在该平台中，各种参与者参与并协作，在区块链背景下使用加密数据归档并训练安全模型。\n\
  \n1. **区块链基础设施 (Blockchain Infrastructure):** 区块链基础设施指的是在该系统中，通信桥梁和上下文将基于区块链。需要采取某些措施来确保所有参与者都能随时自由加入退出平台，并平等地参与这一数据交易网络。此外，这是一个带有令牌交易的公共网络；因此使用\
  \ `PoW` 来确保最高级别的安全性。\n2. **准备 (Preparation):** 参与者一旦加入网络，就应该生成一个以太账户来执行操作。然后，数据提供者选择签署离线数字签名以保护私钥，而不是通过远程过程调用\
  \ (`RPC`) 签名。然后生成一个数据架构文件上传到星际文件系统 (`IPFS`) 协议，这将返回一个哈希字符串。获取哈希值后，数据提供者生成一个离线交易。它被传递给以太坊服务器并等待挖矿。在此过程中，通知中心接收并记录此操作。\n\
  3. **模型供应 (Model Provisioning):** 我们还需要保护模型、模型提供者和数据提供者；为此，我们需要对初始模型进行加密，无论它是已训练还是未训练。加密后的模型随后上传到\
  \ `IPFS` 并将哈希发送到以太坊。同时为建模任务生成一个智能合约。建模任务包含四个措施：\n    - 用于评估的测试数据\n    - 模型对测试数据的准确性\n\
  \    - 训练数据的数据架构\n    - 奖励策略\n4. **模型训练 (Model Training):** 建模任务发布后，将生成智能合约来匹配数据提供者。现在，如果有\
  \ `N` 个数据提供者，任务将被分为 `N` 个子任务，不同的训练数据使用相同的初始模型。简而言之，这里实现了联邦学习。任务在计算提供者上执行，他们也确保了模型训练的安全性。加密数据和模型随后传递给计算提供者，由他们在本地训练。\n\
  6. **聚合模型 (Aggregate Model):** 当计算提供者完成本地训练后，更新的模型被传输到 `IPSF` 并将哈希发送到以太坊。模型提供者通过哈希从\
  \ `IPFS` 下载更新的模型。模型提供者聚合模型并获得稳定的全局模型。\n7. **分配奖励 (Assigning Reward):** 这是整个基础设施的核心部分。模型提供者现在根据测试数据的性能或准确性评估更新后的模型，并根据贡献因子为数据提供者和计算提供者分配奖励。\n\
  \n## 6.5 使用 AI 进行敏感区块链备份\n\n在区块链上存储数据并不听起来那么简单。它包含多项挑战。区块链应该从医疗保健到教育的各个领域进行转型。然而，区块链爱好者们忘记提到一个关键细节，即在区块链上存储个人数据太昂贵了。大多数基于区块链的初创公司仍然遵循以太坊及其\
  \ `ERC20` 令牌标准，该标准规定你必须支付 `gas`；无论你在他们的平台上进行交易，都需要支付 gas 费用。\n\n除非解决数据存储问题，否则区块链无法中断任何现实世界的行业\
  \ [24]。区块链的分布式网络并不是为了管理超市供应链或农业贷款而创建。分布式账本系统将文件存储在许多机器上，以创建防故障的冗余。另一方面，AI 在全球范围内广泛用于减少任务的重复，AI\
  \ 已成为主流。\n\n### 6.5.1 AI 的类型\n\n- **人工人工智能 (Artificial Narrow Intelligence):** 弱人工智能\
  \ (`ANI`) 的现实应用是 Google 的 `RankBrain` 算法和 Apple 的 `Siri`。`ANI` 意味着智能集中在狭窄的参数和语文中。简单来说，Google\
  \ 的 `ANI` 除了页面排名之外做不了更多。即使人们说 `Siri` 不理解请求，也不是 `Siri` 的错；事实上，它的 AI 是狭隘的。\n- **通用人工智能\
  \ (Artificial General Intelligence):** 它比 `ANI` 更优，被称为人类水平 AI。关于 AI 的迷人事实是机器模仿强大人脑的想法。少数专家还声称，通用人工智能\
  \ (`AGI`) 凭借其惊人速度处理和分析海量数据的能力可以远超人类能力。\n- **超级人工智能 (Artificial Super Intelligence):**\
  \ 诸如超级人工智能 (`ASI`) 的机器在各方面的运行都应超越人类智能。对于 `ASI` 机器的可靠研究，还需要几十年的时间。\n\n### 6.5.2 人工智能的工作\n\
  \n假设你给一台 AI 机器分配了一个任务。它通过神经网络进行分析。神经网络更像人类大脑，由大量节点组成，有助于识别包含在向量中的数值模式。它处理每条数据并增强确定性。通过每个数据输入，它预测某些内容并作为输入传递给下一层，最后我们从输出层获得结果。图\
  \ 6.13 向我们展示了神经网络的简要概念。\n\n\n\n\n\n![image](img/fig6_13_B.jpg)\n\n图 6.13\n\n神经网络的基本模型。\n\
  \n### 6.5.3 AI 与虚拟机备份\n\n虚拟化是一场每个国家都经历并随后演变的革命。它为备份行业提供了许多选择。现在，IT 公司已由带有服务器虚拟化的软件定义数据中心组成。它们还确保其数据保护策略迈向现代化，包括提供更多的备份和恢复选项。我们可以认为，`ML`、`AI`\
  \ 和预测性分析的捕获使备份管理员在工作中更快、更具创意。系统现在已经足够智能，能够检测在攻击后应该回滚到哪些版本的文件和应用恢复点。`AI` 将强制执行预测学习算法并频繁执行有利的恢复，在终端用户检测到之前就消除停机。\n\
  \n## 6.6 结合区块链与 AI 实现数据变现\n\n区块链上的用户在授予或撤销访问权限方面对其数据拥有完全控制权 [25]。目前，数据变现是由中心化平台完成的。通过区块链，人们也可以变现自己的数据。这意味着人们更愿意提供和共享他们的数据，因此产生的数据可以用于\
  \ `AI` 系统的开发。`AI` 可以在民主环境中蓬勃发展，其中数据和模型提供者可以相互互动，而不依赖中间环节。接下来，我们将讨论如何分别使用区块链和 `AI`\
  \ 优化数据，然后将两者结合。\n\n### 6.6.1 数据变现\n\n数据变现有助于增加收入。像 `Google`、`Amazon` 和 `Facebook`\
  \ 这样的成功公司已经采用了数据变现，并将其作为策略中至关重要的部分。数据变现可以通过两种方式进行，如图 6.14 所示。\n\n![image](img/fig6_14_B.jpg)\n\
  \n图 6.14\n\n数据变现的类型。\n\n数据变现的优点如下：\n\n* 优化数据使用\n* 提高生产力和效率\n* 降低运营成本\n* 提高盈利能力\n\
  * 识别并迁移风险\n* 增强对如何改进产品的洞察\n* 提高对客户的理解\n* 增强客户信任\n\n#### 6.6.1.1 直接数据变现\n\n顾如其名，它直接向第三方出售数据访问权限。数据出售可以以原始形式进行，也可以以已经处理并转换为分析和洞察的形式进行。例如，它可能是潜在市场影响者的联系列表，或者发现对买家行业和业务的影响。\n\
  \n#### 6.6.1.2 间接数据变现\n\n这是一种令人兴奋的数据变现方式。首先是对数据进行优化。这涉及分析数据，揭示有助于提高组织业务性能的洞察。这些优化后的数据可用于发现公共兴趣、如何触达客户以及理解行为，从而改进业务。\n\
