  \n\n\n\n\n\n\n# 区块链交易是如何发生的？\n\n每个区块都维护着一组交易。图 9.2 详细解释了交易的流程。当有人请求一笔交易时，该交易的详细信息会被传递到一个称为`SHA-256`的哈希函数中，该函数会处理这些数据并将其转换为内存中的比特量。这个哈希函数接收可变长度的输入数据，并生成一个由\
  \ 64 个字符组成的字母数字输出结果。安全哈希算法（`SHA‑256`）具有单向哈希函数的特性；通过其输出的哈希值来解码出原始值的难度极大。 `SHA‑256`**纯文本无翻译内容直接复制**\n\
  \n##  矿工\n\n*   它能够追踪被转移金额的来源以可靠地证明身份。\n*   检查是否存在双重支付或攻击同一笔钱花两次的情况。\n*   检查货币总量是否未超过\
  \ 210 亿美元的上限。\n\n### 9.3.1 标准网络安全与区块链安全性对比\n\n\n\n\n\n# 网络安全\n\n网络安全被认为自以来最关键的国家安全问题之一。网络攻击估计每年给全球业务带来的损失高达\
  \ 5000 亿美元。随着世界向先进技术发展，新的网络威胁也在演变。网络安全是一个不断演变、持续活跃的过程，正如它所要防止的威胁一样。网络安全行业的任何形式的增长，都需要政府、私营部门和学术界的额外支持。\n\
  \n网络安全的两大支柱包括检测和恢复。当违露发生时，检测和响应速度越快，损失的严重程度就越小。这时安全官的作用就体现出来了，他们能够巧妙且快速地应对损失，无论是财务损失、声誉损害或其他损失。恢复涉及你能多快找回受损的数据，而日志的保护和分析有助于识别违露是如何发生的，并作为恢复的一部分将其阻止。这应当成为防止类似违露的种子。\n\
  \n# 区块链安全\n\n在区块链中，区块在经过适当验证和确认后会被包含。区块可以被复制、删除或更新，这意味着它们具有不可变性属性。人们只能从区块链中读取信息。另一种安全机制是一系列区块，每个区块都与前一个哈希值相关联。其次，数据在添加到链网络时会经过强加密。因此，攻击者很难进行破坏，这反过来会影响链中的所有其他节点。第三种情况是交易使用个人唯一的私钥进行授权。这将提升对敏感数据或信息的保护。\n\
  \n区块链通过多种手段，如高级密码学技术、哈希技术、使用混合协议、钱包方案以及行为和决策的数学模型来确保安全。一种被称为加密经济学（crypto economics）的新概念在控制区块链网络安全方面也起着活跃作用。需要保护的重要信息包括用户信息、运行网络和过程控制系统。\n\
  \n![image](img/fig9_4_B.jpg)\n\n图 9.4\n\n网络威胁与区块链应对措施的关系。（来自 ResearchGate：网络安全威胁与应对措施的关系示例；MDPI\
  \ JSAN，《安全与隐私准则、威胁与应对措施的综合研究：物联网视角》）。\n\n## 9.3.1.1 安全分析\n\n为了简单起见，我们采用每种协议，某些云是通过使用加密技术来安全的。云存储了大量的信息系统。云监控区块链网络的方式将响应终端的请求。为了维护隐私和安全，系统应确保终端的匿名性。\n\
  \n此外，通过安全分析，观察到使用访问控制系统具有高粒度，并且更加灵活、信息丰富，可以进行配置。撤销是另一个重要功能，它简化了撤回承认资源协议的能力，并确保用户无法访问已撤销的资源\
  \ [[10]]。由于区块链网络节点对安全的需求，选择了过多的属性，会导致合格矿工的总数减少，从而引发某些恶意攻击。为了避免这个问题，新的区块链技术最初会验证少数矿工。然而，在验证之后，区块链网络就可以捐赠区块新区块。\n\
  \n[图 9.4] 解释了区块链在克服常见网络威胁方面提供的补救。区块链对每个网络威胁采取不同的应对措施。注意，某些应对措施可能涉及多个问题，以便我们轻松找到相关问题的解决方案。在\
  \ `Ethereum` 区块链上提出的基于智能合约技术的联盟[[11]]，有必要以控制策略的形式附加大多数有效机制，并通过若干协议使区块有效。在区块链中，数据被收集并分给每个信任区块链的人，以授予可访问性和可靠性。在过时的网络数据中，它是通过所有者控制的限制访问进行组织和销售的，这规定了数据用户数据的可访问性、可靠性和机密性\
  \ [[12]]。区块链本身的权限被限制为仅授权方。区块链上的数据仅包含有关交易的信息，而不包含任何健康数据或运输详情等敏感内容。两种环境都容易受到故意滥用攻击。现代网络实际上是紧凑的，其网络安全关注主要取决于权限协议。可用性和完整性通过区块链技术的设计来实现。但现代环境的组织是利用大量的访问控制策略和智能合约技术构建在可靠性和机密性之上的。\n\
  \n## 9.3.2 区块链的安全与隐私属性\n\n简单来说，区块链技术是一种带有分布式交易公共账的去中心化应用。因此，所有发生的交易都可以被对等网络（`P2P`）查看、验证和确认\
  \ [[13]]。讨论区块链的安全和隐私资产是因为下一段中将披露更严重的加密攻击。\n\n### 区块链中的数据安全\n\n安全需要被解释为区块中包含的交易证据和数据免受内部、外部和恶意软件威胁的安全性。这里需要保护区块链，以保护存储的人人员数据免受损害或防止信息被盗取。为了防止威胁，必须采取保护数据库和适当访问控制策略的措施。\n\
  \n### 过程完整性\n\n用户可以完全相信交易将根据协议命令准确执行，从而消除了对信任第三方的需求。在投资和资产的在线交易期间，转账必须依赖许多中间人，并花费大量的交易费用来维持中间人。通过使用区块链对交易可靠性的保证，用户可以避免交易被篡改\
  \ [[14]]。\n\n### 无须交换\n\n财务余额在区块链上得到保障。执行任何交易确实不需要任何第三方参与，因此它可以作为服务提供商，且不向用户收取任何额外费用\
  \ [[15]]。这种安全特性在工业、学术实践等许多领域非常有用，在金融领域更为常见。据估计，在科印培尔（Coimbatore）埃罗德（Erode）地区的姜黄生产期间，52%\
  \ 的交易费用在中间人手中。因此，区块链帮助许多农民避免了自杀。\n\n\n\n\n\n## 交易细节的不可检索性\n\n区块链中的用户无需披露所有个人详细信息。一种称为零知识证明（`ZKP`）的特定共识技术已被开发出来，以保护透明度。在\
