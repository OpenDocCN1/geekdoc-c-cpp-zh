  \ \n\n\n\n# 11.1 引言\n\n自动化彻底改变了所有行业并影响了生活的方方面面。采用自动化和分析的主要行业之一是医疗保健行业。这是一个领域极其广泛的行业，由临床试验、制药和医疗设备组成。在目前，医疗保健行业致力于改善人们的生活。多项研究报告了由于人为错误导致医院内死亡的情况。这些错误的原因归因于患者详情的存储和访问机制。研究还报告，如果建立了适当的患者信息系统，四分之一之三的错误是可以避免的。电子健康记录（`EHR`）于\
  \ 20 世纪 60 年代早期开发出来，主要用于存储重要的患者详情，如病史、药物信息、处方、实验室检查报告、医学 X 光和图像以及账单信息。\n\n### 11.1.1\
  \ 什么是 EHR？\n\n`EHR`或电子健康记录负责以数字形式存储和维护患者数据；它们是允许授权用户即时且安全地访问的患者记录 [1]。建立`EHR`的基本需求是为特定用户保存病史和治疗计划。然而，根据`EHR`中的可用数据，可以为患者提供更广泛的医疗保健。目前，`EHRs`已成为医疗基础设施的重要部分，它们可以：\n\
  \n* 存储和处理患者的病史、使用的药物、接种日期、图像、测试结果等。\n* 使用诊断工具，帮助对患者所需的护理做出决策。\n* 通过访问关键医疗数据跨地理边界咨询专家，从而让每个人都能获得先进的医疗护理。\n\
  * 如果所有患者从一家医院搬到另一家医院，那么在一个医疗中心进行的基础医学检查无需在下一个机构重复 [2]。\n\n`EHR`携带的基本患者医疗保健信息可能包括但不限于：\n\
  \n* 患者基本个人资料，包括年龄、人口统计特征\n* 病史\n* 对药物的过敏（如有）\n* 实验室检查结果\n* 处方和给出的药物\n* X 光和扫描图像\n\
  * 患者进展\n* 疾病诊断\n\n`EHRs`并不是患者纸质记录的简单替代。它是将患者历史以及相关细节转换为数字格式，以便多个医疗工作人员可以安全地访问。\n\
  \n### 11.1.2 使用 EHR 的医疗系统的通用结构\n\n在本节中，简要描述了 `open EHR` [3] 架构。`open EHR` 是一种基于许多项目和标准的研究而标准化的架构。该架构已根据多年使用后获得的许多实时输入进行了精炼。因此，该架构具有很通用性，可以用于许多应用程序。\n\
  \n#### 11.1.2.1 通用护理记录需求\n\n`open EHR` 中需要存在的通用细节是：当记录需要用于审计和问责等研究目的时，对患者进行匿名化。细节必须以独立于医疗提供者和应用程序的通用格式收集。管理记录的软件必须是灵活且易于操作和维护。\n\
  \n#### 11.1.2.2 医疗记录 (EPR)\n\n`open EHR` 对本地健康记录或 `EPR` 指定了某些要求。基本要求是支持所有类型的测试数据，并适应观测值的不同类型单位。系统必须支持主要使用的自然语言，并允许这些语言之间的翻译。\n\
  \n#### 11.1.2.3 共享护理 EHR\n\n对于共享护理 `EHR`，`open EHR`规定的要求包括支持防止患者身份识别。共享 `EHRs` 的方法以及医疗提供者之间的操作性通过自动化工作流提供。\n\
  \n![image](img/fig11_1.jpg)\n\n图 11.1 使用电子健康记录的医疗系统示例架构 [3]。图 11.1 显示了基于 `open EHR`\
  \ 的 `EHR` 架构；每个需求都封装在一个扁气泡内。左上角的气泡代表任何类型主体的通用记录。对应活主体的后续需求添加在左下角。左侧最大的气泡代表与本地护理相关的需求，包括图像、患者记录和其他细节。重要的需求一直排列到最后一行。建立\
  \ `EHR` 的主要目标之一是实现一个可以被多个医疗机构访问的集成记录，这实际上是一个集成的信息框架。由于 `open EHR` 采用了通用方法，用于满足医疗管理系统的构建组件和应用程序也可以用于任何其他记录管理系统。下一节将解释塑造\
  \ `open EHR` 形成目前形态的需求和细节。\n\n\n\n\n\n使用电子健康档案（EHR）的主要优势在于，无论患者身在何处，它都能随时随地访问。患者也能查阅自己的病史，从而更有信心了解自身健康状况。协同医疗是指来自多个医学领域的专家能够跨越地理界限进行协调合作，为患者提供最佳治疗方案。这种协作实践还能改善诊断效果并确保高质量的治疗计划。当患者在到访新医疗机构时需要进行基本检查和\
  \ X 光拍片时可以节省费用且系统允许这个用户不必固定依赖某一家服务商因为详细信息随时可得无需重复化验测试等步骤避免了从零开始的繁琐过程。\n\nEHR 有能力加强医生与病人之间的沟通[[4]](#chapter-11.xhtml_ref11_4)。虽然\
  \ EHR 确实增加了文书工作人员的工作负担但它通过`web-based`应用简化了管理流程使追踪病人的治疗计划变得更为容易这些应用程序让病患能查看病历进展实验室检测结果等内容从而规避纸质方式面临的资料丢失或错放等问题。\n\
  \n### 如何实施 EHR？\n\n在了解了上述优点之后下一个问题就变成了怎样构建经济高效的解决方案根据研究将其分为两个阶段[[5]]：即预实施和实施阶段在第一阶段要开展侧重数据完整性的深入研究包括收集各方利益相关者(医护人员、技术人员、病患者)的输入讨论创建过程中的反馈及时收集工作流优化对抵触人员进行教育和培训第二阶段则涉及组织头脑风暴会议调整以适应系统的需求将变更管理的定义落实进一步整理现有数据完善的安全授权协议明确问责级别处理违规案例出于研究和分析目的的数据匿名化并且做出适当的人员配置调整以确保顺利过渡采纳执行安排妥当同时保障整体平稳推向落地可操作方向最终实现所有节点良性运行\n\
