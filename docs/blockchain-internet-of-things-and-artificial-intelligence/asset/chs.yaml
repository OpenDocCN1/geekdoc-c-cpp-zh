  \n由于该平台采用区块链技术，用户可以追踪所有记录，包括医疗记录的访问情况、就诊次数及其他更新。当所有记录集中在一个地方时，用户便能轻松管理自身病历。这也有助于获得更优质的医疗服务并推动医疗行业的创新。其主要特点如下：\n\
  \n-   数据所有权将被重新分配；个人信息由个人持有，且他们可以决定谁有权访问自己的文件。\n-   使用区块链后，通过定位系统对未经授权的访问提供了更高的安全性。\n\
  -   只有经信任的医疗服务提供者才能存取所存储的数据，因此任何篡改数据的可能性都微乎其微。\n\n### 5. Shivom (OMX)\nShivom 与其他示例类似之处在于它同样专注于促进健康。Shivom\
