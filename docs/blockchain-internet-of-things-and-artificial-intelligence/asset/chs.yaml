  \n\n\n\n根据联合国发布的报告，到 2050 年底，世界人口将达到 98 亿。据推断，该人口中近 70%将是城市人口，许多城市的居民将超过 1000 万。随着数量的增长，我们将会面临如何在避免环境恶化的同时，为所有居民提供资源和能源的挑战。其他关键挑战还有行政和管理，以防止卫生问题、缓解交通拥堵并遏制犯罪。这些许多问题可以通过汇聚一些人工智能（AI）、物联网（IoT）和区块链等先进技术来控制。利用技术进步来便利居民可以使他们的日常生活变得更加舒适和安全。这催生了智慧城市概念。\n\
  \n智慧城市是指利用技术进步来提高城市服务（如能源和交通）质量的城市，从而减少资源消耗并防止浪费和增加成本 [1)。智慧城市旨在为个人提供一个可持续的环境，并以最低的生活成本提高生活质量。用于建设智慧城市最受欢迎的技术是物联网。\n\
  \n### 智慧城市中的物联网\n\n物联网是一种趋势性的通信技术，如家电器、车辆和摄像头等日常使用的物体配备了微控制器、收发器和必要的协议，以便它们能够相互通信\
  \ [2)。物联网技术对每个人的日常生活都有巨大影响。物联网被用于将异构设备集成在一起。许多基于物联网的应用可以用于建设智慧城市。其中包括智能家居、智能能源管理、智能交通、智能医疗、智能农业和耕作、智能监控以及智能环境控制。图\
  \ 8.1 描述了这些用于建设智慧城市的物联网应用。尽管物联网可以提供许多应用，但在建设智慧城市时必须考虑一些问题。物联网在连接系统之间传播数据，因此需要一些强大的技术来为数据提供安全性和隐私保护。当数十亿设备开始相互通信时，将传输大量数据。因此，采用一种能够存储、检索和分析海量数据的技术是重要的\
  \ [3)。\n\n![image](img/fig8_1_B.jpg)\n\n图 8.1\n\n智慧城市中的物联网应用。\n\n### 物联网与区块链的集成\n\
  \n物联网可以与区块链技术相结合，提供安全的数据访问和存储。区块链以分布式模式存储数据，授权人员可以在不进行修改的情况下进行访问。也就是说，存储在区块链中的数据是不可更改的。智慧城市连接了不同的领域。这形成了一个涉及大量数据的连接系统。物联网中的技术——射频识别（RFID）、传感器等——将产生用于调查和研究目的数字测量值。同样，某些数据必须对所有人可用，同时数据必须是不可更改的。因此，可以使用区块链技术实现数据存储和安全访问\
  \ [4)。\n\n通过集成物联网与区块链可以构建许多应用。其中一种应用是智能管理系统（IWMS） [5]。物联网中的技术——射频识别（RFID）、传感器等——将产生用于调查和研究目的数字测量值。同样，某些数据必须对所有人可用，同时数据必须是不可更改的。因此，可以使用区块链技术实现数据存储和安全访问\
  \ [4)。\n\n在 [6] 中，作者开发了两个系统：带有和不带区块链的物联网系统。物联网设备之间通信使用的协议是 `message queuing telemetry\
  \ transport (MQTT)`。使用的区块链平台是 `Ethereum` 以及一个智能合约。两个物联网系统都经过了仿真，结果证明带有区块链技术的物联网系统比不带区块链的物联网系统更安全。\n\
  \n在 [8] 中，作者开发了两个系统：带有和不带区块链的物联网系统。物联网设备之间通信使用的协议是 `message queuing telemetry transport\
  \ (MQTT)`。使用的区块链平台是 `Ethereum` 以及一个智能合约。两个物联网系统都经过了仿真，结果证明带有区块链技术的物联网系统比不带区块链的物联网系统更安全。\n\
  \n### 数据存储与安全\n\n数据存储在开发智慧城市过程中成为一个重要特征。需要先进的存储技术来存储和访问数据。[7] 提出了一种基于区块链的去中心化存储协议，名为\
  \ `Provable Data Possession (PDP)`，它支持数据更新和用户验证。使用智能合约验证所有参与实体的公平性。数据在多个区块中进行复制，以确保可用性和健壮性。区块链的主要优势是存储在区块链中的数据是防篡改的。所有与物联网有关的安全问题都可以区块链来解决。\n\
  \n![image](img/fig8_2_B.jpg)\n\n图 8.2\n\n智慧城市中使用数据类型。\n\n\n\n\n\n通过集成物联网（IoT）、人工智能（AI）和区块链技术，可以开发去中心化的智能城市应用。所有参与方都可以访问足够安全的相同数据源。集成区块链和人工智能带来了许多好处，其中一些优点包括增强数据安全、改进决策制定以及智能化分析\
  \ [10]。AI、IoT 架构与区块链技术的结合可以为用户带来便利和舒适。假设一台冰箱配备了物联网传感器来监控所有物品的可用性。区块链确保了从设备到受信去中心化系统的数据完整性。物联网中的传感器感知冰箱内物品的可用性，并在物品变得不可用时通知带有\
  \ AI 的聊天机器人。甚至可以使用区块链技术向商店供应商下单，确保交易的安全性。因此，物联网、区块链和人工智能等所有新兴技术可以结合在一起，高效构建一个能够确保舒适性、安全性、效率和可靠性的智能城市。\n\
  \n## 8.2 物联网生态系统中基于区块链和人工智能的知情管理\n\n如今，互联网已广泛应用于日常生活的各个领域。物联网已经在各个领域演变，特别是交通、能源管理和农业。物联网可以连接多个资源或设备。这些设备可以收集有关用户的个人信息。最终，这可能演变成对用户隐私的威胁。在智能城市环境中，这种威胁更高，因为许多公民的数据都与物联网相关。当信息落入黑客手中时，风险是不可估量的。\n\
  \n打开网站时，我们可能会注意到网站会请求用户的同意。2016 年通过的《通用数据保护条例》（GDPR）[11] 文章规定，严格禁止处理个人数据。只有在法律允许或用户同意使用其数据时，才能处理个人数据。此后对消费者同意的关注得到了更加重视。它迫使公司重视客户的个人数据。因此，知情管理是指网站或任何来源在获得用户同意/许可后才从用户处收集数据的过程。我们可能注意到显示以接收用户同意的\
  \ cookie。GDPR 的执行允许用户管理自己的个人数据。\n\n[12] 中提出的 ADvoCATE 架构采用以用户为中心的方法，允许用户同意访问其在物联网中的个人信息。ADvoCATE\
  \ 使用区块链基础设施来确保个人数据的完整性和安全性。该架构符合 GDPR 定义的要求。智能服务用于分析用户的策略冲突，并向用户提供建议，以保护其个人数据免受意外暴露。ADvoCATE\
  \ 方法在物联网环境使用的设备中使用系列传感器来收集有关用户的数据。如前所述，物联网可用于智能城市的所有活动，如农业、教育、娱乐、医疗和智能家居。ADvoCATE\
  \ 架构中的数据控制器与用户通信并收集用户的同意。ADvoCATE 架构由功能组件组成，如同意管理组件、同意公证组件和智能组件。图 8.3 显示了 ADvoCATE\
  \ 架构的组件。\n\n![image](img/fig8_3_B.jpg)\n\n图 8.3\n\nADvoCATE 架构中的组件。\n\n### 8.2.1\
  \ 同意管理组件 (CMC\n\n该组件管理用户的个人数据处理策略和数据同意。用户定义的策略可能是通用的，也可能是特定领域的。数据控制器在使用特定的物联网设备时可能从用户处收集了此类同意相关的数据。相同的同意策略可能不适用于物联网系统中的其他设备。另一个主要问题涉及用户与数据控制器之间交换信息的安全性。此外，数据控制器必须确保使用数据隐私本体论以清晰的方式向用户展示所定义的隐私政策。ADvoCATE\
  \ 架构遵循可扩展访问控制标记语言（XACML）来基于语义定义策略。ADvoCATE 不仅允许单一本体论，还支持其他类似的本体论。这些本体论甚至可以基于机器学习技术设计，以确保正确性和可靠性。\n\
  \n### 8.2.2 同意公证组件\n\nADvoCATE 架构采用数字签名和区块链来确保用户端和数据控制器端数据同意策略的不可否认性、正确性、完整性、可靠性和有效性。CNC\
  \ 担任 CMC 和区块链架构之间的中介。CNC 检查同意是否是最新的以及它们是否免受未经授权访问的保护。ADvoCATE 架构使用智能合约来定义同意协议的规则，以及对滥用用户数据可能施加的惩罚。当使用区块链时，所有同意都是公开的，但内容是不可更改的。ADvoCATE\
  \ 额外获取双方在同意策略中的数字签名以确保不可否认性。此外，同意的哈希版本被部署在区块链结构中。CNC 的工作如图图 8.4 所示，步骤如下：\n\n1. CNC\
  \ 从 CMC 接收约定同意的最新版本。\n2. 要求用户和数据控制器独立签署同意策略。\n3. 使用智能合约将两个数字签名的哈希值存储在区块链中。\n\n![image](img/fig8_4_B.jpg)\n\
  \n图 8.4\n\nCNC 的工作。\n\n部署在区块链上的智能合约负责所有同意的更新和撤回。智能合约自动执行和控制。它处理同意中给事件和操作。智能合约验证同意的最新版本和完整性。最后，CNC\
  \ 组件将带有数字签名和区块链上智能合约地址的最新同意版本返回给 CMC 组件。以后如果需要，用户和数据控制器可以通过验证数字签名以及通过智能合约从区块链检索最新版本来验证同意的有效性。区块链在以分布式方式安全保存同意方面起重要作用。\n\
  \n\n\n\nADvoCATE 架构将智能组件（`INC`）实现为两种机制的融合：智能策略分析机制（`IPAM`）和智能推荐机制（`IRM`）。`IPAM`\
  \ 用于识别与用户隐私数据暴露相关的冲突策略，并确保收集的数据不会被用于对用户进行画像分析。同意策略中可能包含许多陷阱，例如请求用户许可在传输时对数据进行加密，并在提交表单中显示不需要的字段。用户最不在意的信息可能会演变成大的安全漏洞。因此，必须格外小心地对同意策略进行定期监控。AI\
  \ 可用于发现同意策略中的潜在知识和不希望的活动。模糊认知图（`FCM`）用于通过学习算法发现同意策略中各元素之间的关系，并根据所得的知识做出决策。学习算法通过基于人工神经网络（`ANNs`）训练和更新\
  \ `FCMs` 来实现。`ANNs` 减少了人类在学习过程中的干预。`IPAM` 使用 `FCM` 根据同意协议定期监控是否违反用户隐私策略。\n\n`IRM`\
  \ 用于通过一种名为认知过滤（`CF`）的机器学习方法，为保护用户隐私提供实时的个性化信息。`CF` 的工作是从用户处收集非隐私信息。`CF` 根据信息和用户的同意策略制定某些规则。通过这种方式，可以为单个用户制定个性化的智能规则，`IRM`\
  \ 确保了强大的安全策略。\n\n## 8.3 使用区块链保护物联网免受攻击\n\n随着区块链的日益普及，毫无疑问，它已被应用于商业。许多物联网应用需要区块链来保护用户及其数据。物联网中的设备容易受到各种攻击，数据隐私始终面临着威胁\
  \ [[13]]。区块链的一些内在特性，如不可篡改性、数据完整性、分布式特性、透明性和机密性，使其非常适用于物联网应用。将区块链技术与物联网相结合，可以在安全性方面带来革命性的变化。\n\
  \n物联网设备中的传感器产生大量数据，这些数据可以用于分析目的。因此，必须更加关注数据安全，智能城市架构必须确保传输和存储的数据是无威胁的。智能城市环境中处理多种类型的数据，包括电子政信息、电表、车辆跟踪信息和医疗数据，这些数据更容易受到攻击。智能城市环境中使用的数据必须被安全地传输和存储。智能城市环境集成物联网和区块链的框架可以如图\
  \ 8.5 所示。\n\n![image](img/fig8_5_B.jpg)\n\n图 8.5\n\n智能城市中的物联网与区块链。\n\n智能城市环境使用了多种智能设备，如智能信息台、智能仪表、智能交通信号和自动售票机，这些设备容易受到外部攻击\
  \ [[14]]。当这些设备受到攻击者的攻击时，个人和财务数据可能会泄露，给公民和城市造成更大的损害。在使用物联网设备的智能城市环境中发生的威胁是针对可用性、完整性、机密性、真实性和可追溯性的威胁\
  \ [[15]]。物联网设备通常电池寿命有限，且容易受到攻击，攻击者节点误用有限的电量将导致可用性威胁。针对可用性的流行攻击是分布式拒绝服务（`DDoS`）攻击。此外，当数据存储在中心化配置中时，也会发生可用性威胁。物联网设备收集的数据被用于各种分析和改进。完整性威胁会导致数据被修改和损坏。影响数据完整性的攻击包括修改攻击、针对路由信息的拜占庭攻击和注入攻击。智能城市环境中处理了许多敏感数据，机密性威胁包括将这些敏感数据泄露给未经授权的第三方。多个物联网设备/节点在智能城市中协同工作，攻击者可以通过获取这些设备或数据的未经授权访问来实施真实性威胁。此外，节点可以发送或接收来自另一个设备的信息，但随后否认数据的传输或接收，导致可追溯性威胁。\n\
  \n### 8.3.1 区块链的作用\n\n区块链作为保护和优化物联网用户的全球技术正在蓬勃发展。区块链依赖四种技术来提供安全保障 [[16]]。它们是共识、分布式账本、密码学和智能合约。这些技术可以轻松处理针对物联网设备的威胁。正如我们之前看到的，共识提供了工作证明，并通过提供某些同意管理协议来防止网页或第三方窃取用户的隐私数据。分布式账本通过分布式方式存储用户和设备交易的完整细节，确保数据的可用性。哈希函数和加密通过限制未经授权的访问来确保数据的认证和完整性。这些功能应用于存储在分布式账本上的数据。最后，智能合约用于验证网络用户身份。区块链的另一个重要方面是它不允许将特定交易与特定用户关联。图\
  \ 8.6 描述了区块链在物联网中的作用。区块链可以与物联网相结合以执行安全策略并维护公开可见的物联网记录。当区块链用于安全时，物联网不再需要依赖第三方软件来提供安全，这被证明是经济且有益的\
  \ [[17]]。\n\n![image](img/fig8_6_B.jpg)\n\n图 8.6\n\n区块链在物联网中的作用。\n\n#### 8.3.1.1\
  \ 防止可用性威胁的区块链\n\n区块链遵循分布式架构，其中节点和数据以分布式方式存储。由于不存在中心化架构，区块链自然地成为 `DDoS` 攻击的对手。换句话说，无法在区块链上发起\
  \ `DDoS` 攻击。`ProvChain` 架构 [[18]] 被提出利用区块链概念保护物联网设备免受可用性威胁。在这里，云存储数据的溯源数据被嵌入区块链交易中。溯源数据首先使用公私钥对进行收集、存储和验证。`ProvChain`\
  \ 架构分三层实现，即数据存储层、区块链层和溯源层，这些层分别执行数据收集、数据存储和数据验证。基于区块链的审计架构 [[19]] 使用分级密码学技术结合区块链来确保数据的可用性和可追溯性。在这种方法中，从每个数据所有者处获得同意，使用智能合约方法确保数据隐私。该架构提供了一个基于联盟链的监管框架，以执行法律。\n\
  \n\n\n**修改攻击**是一种臭名昭著的攻击方式，它会篡改区块链中存储数据的内容。更改可以通过多种方式进行，例如：操纵区块中的数据内容、在区块中添加新数据或删除区块中的数据。借助区块链的去中心化架构，可以轻松防范这种修改攻击。在文献[20]中，通过对区块链中的数据库使用参考完整性度量（`RIM`）来维护数据的完整性。每次下载数据时都会验证\
  \ `RIM` 的值。该系统使用一个中央枢纽来存储元信息部分的数据分散式地保存原始来自块链的拥有者署策略以及地址与另一条由用于保管所述带锐意的加密因子的记录项,之入提供引用最新相对于模拟各方有相符技妨碍分发相关题共识较为完整性的保障。\n\
  \n### 8.3.1.3  基于以太技术防患于未然而推出的保护(隐秘)类别非常具体并不仅仅是伦敦的场景讨论或是其另为零采则靠水级插述某些改进唯真起点通盘实用价值计划催生公队的景色相近简短例证达塞自糟奎需要强调子抢占接入——我们就者为铺典故意识快测调重要洞识被这套表述改为需符合阅读流畅\n\
