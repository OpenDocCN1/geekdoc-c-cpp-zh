  \ I EEE80215 MAC 模型 LoRa 以及其他补充选项内容……  \n\n\n\n\nLoRa 是一种用于物理层的无线调制方案，旨在建立长距离通信链路。其他应用于物理层的无线技术包括`WCDMA`和`OFDAMA`，它们可用于\
  \ LTE 和 UMTS（3G）网络。LoRaWAN 是低功耗广域网（LPWAN）的简称，其目的是为了连接大规模部署中的传感器和物联网设备。实现 LoRa 可提供若干关键优势，例如将电池寿命延长至数年之久,以及以具有成本效益的方式进行远距离部署.LoRa\
  \ 使用一种名为“线性调频扩频”的调制方案来显著增加通信范围.相较于其他无线技术选择 LoRA 的主要原因是其远距离通信能力；一个基站或单个网关即可将其服务覆盖数百公里或整个城市\
  \ [7, 8]。\n\n### Wi-Fi\n\nWi-Fi 是 **Wireless Fidelity** (***无限保真度***)  的首字母缩写;它属于\
  \ IEEE802 系列的系列标准范畴之内且主要作为一种局域网收发机典:目前普遍使用的系统可以 54Mbps 作为数据速率并大约能达到 100 英尺室内辐射值；（值得注意的是该技术在更大带宽(20MHz)支持下实现了高于第三代的峰值吞吐量然而设计初衷并不包含高移动性支持根据一份参考文献,\"\
  如今的住宅/办公场所及公共热点区域已习惯将其视为最后‐英里接入的事实协议\"。但这些设施又被迫局限于距节点千余米的半径限制之中，(典型实施的覆盖范围仅约距任何接入点一千英尺)，而此前的各代产品也均在信道宽度上存在隔离——\
  \ b 类占用 25MHz 资源供 a/g 两种类型分享另外一部分。）\n\n相较如 `WiMAX`,第三代等等竞争对手最核心差异在于终端的普及程度：绝大多数新款笔记本均预装机载适配器之外大量非传统终端也开始集成此类功能诸如手机、个人数字助理(PDA)、相机甚至无绳电话与媒体播放器等都在逐步整合\
  \ 。\n\n ### Low-Power Short Range IoT Networks   短程微功率物联网络\n本部分探讨基于远程还是近距离构建的无线的体系：“现代泛在计算社区实际上已经能够支撑超越常规网络的端到云直连—哪怕仅仅配置近场也能使穿戴电子配合智能手机完成家居控制”。根本性的前提之一便是供电从微型级别向高阶储能方式的技术跨越\
