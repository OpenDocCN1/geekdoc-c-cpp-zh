  \n神经网络的基本模型。\n\n### 6.5.3 AI 与虚拟机备份\n\n虚拟化是一场每个国家都经历并随后演变的革命。它为备份行业提供了许多选择。现在，IT\
  \ 公司已由带有服务器虚拟化的软件定义数据中心组成。它们还确保其数据保护策略迈向现代化，包括提供更多的备份和恢复选项。我们可以认为，`ML`、`AI` 和预测性分析的捕获使备份管理员在工作中更快、更具创意。系统现在已经足够智能，能够检测在攻击后应该回滚到哪些版本的文件和应用恢复点。`AI`\
  \ 将强制执行预测学习算法并频繁执行有利的恢复，在终端用户检测到之前就消除停机。\n\n## 6.6 结合区块链与 AI 实现数据变现\n\n区块链上的用户在授予或撤销访问权限方面对其数据拥有完全控制权\
  \ [25]。目前，数据变现是由中心化平台完成的。通过区块链，人们也可以变现自己的数据。这意味着人们更愿意提供和共享他们的数据，因此产生的数据可以用于 `AI`\
  \ 系统的开发。`AI` 可以在民主环境中蓬勃发展，其中数据和模型提供者可以相互互动，而不依赖中间环节。接下来，我们将讨论如何分别使用区块链和 `AI` 优化数据，然后将两者结合。\n\
  \n### 6.6.1 数据变现\n\n数据变现有助于增加收入。像 `Google`、`Amazon` 和 `Facebook` 这样的成功公司已经采用了数据变现，并将其作为策略中至关重要的部分。数据变现可以通过两种方式进行，如图\
  \ 6.14 所示。\n\n![image](img/fig6_14_B.jpg)\n\n图 6.14\n\n数据变现的类型。\n\n数据变现的优点如下：\n\n\
  * 优化数据使用\n* 提高生产力和效率\n* 降低运营成本\n* 提高盈利能力\n* 识别并迁移风险\n* 增强对如何改进产品的洞察\n* 提高对客户的理解\n\
  * 增强客户信任\n\n#### 6.6.1.1 直接数据变现\n\n顾如其名，它直接向第三方出售数据访问权限。数据出售可以以原始形式进行，也可以以已经处理并转换为分析和洞察的形式进行。例如，它可能是潜在市场影响者的联系列表，或者发现对买家行业和业务的影响。\n\
  \n#### 6.6.1.2 间接数据变现\n\n这是一种令人兴奋的数据变现方式。首先是对数据进行优化。这涉及分析数据，揭示有助于提高组织业务性能的洞察。这些优化后的数据可用于发现公共兴趣、如何触达客户以及理解行为，从而改进业务。\n\
  \n### 6.6.2 基于区块链的数据变现\n\n这是一种令人兴奋的数据变现方式。首先是对数据进行优化。这涉及分析数据，揭示有助于提高组织业务性能的洞察。这些优化后的数据可用于发现公共兴趣、如何触达客户以及理解行为，从而改进业务。\n\
  \n区块链是一种提供安全性、透明度和不可篡改性的技术。它允许组织有效地管理数据、节省成本并衡量营销工作的成功与。\n\n#### 6.6.2.1 识别不同类型的数据及其用例\n\
  \n组织可以收集的不同来源包括：`social media`、`IoT devices`、云、医疗保健等。在收集数据之前，业务负责人应该询问：\n\n* 他们正在寻找什么类型的数据？\n\
  * 从数据可以做什么样的预测？\n\n#### 6.6.2.2 识别潜在买家\n\n一旦业务负责人确认了未来的买家，他们就必须决定是通过基于区块链的公司还是独立地获取数据。这种细分有助于组织了解其产品的质量和评价。\n\
  \n#### 6.6.2.3 选择合适的区块链数据变现公司\n\n有几家成熟公司专门从事使用 `IoT sensor`、`AR/VR` 和 `bigdata`\
  \ 等技术进行数据变现。\n\n### 6.6.3 使用人工智能的数据变现\n\n数据本身没有任何价值，无论它是 `big data`、非结构化数据、溢价数据、市场数据还是消费者数据。只有在变现后，数据才能变得有用。数据变现已成为几乎每个组织的首要任务。用户的组织拥有大量数据并知道其益处，但他们不知道有效变现数据的确切标准。使用\
  \ AI 进行数据变现的实现包括：\n\n#### 6.6.3.1 创建新的数字服务\n\nAI 应用可以监控全球范围内的许多结构化或非结构化来源，提供准确性、实时监控和告警系统。\n\
  \n#### 6.6.3.2 解决客户流失\n\n公司因为更好的服务和产品向竞争对手失去了客户。这个问题可以通过为消费者提供一流的客户体验，或者在问题影响消费者之前解决它们来解决。\n\
  \n#### 6.6.3.3 释放价值和洞察\n\n\n\n\n金融服务行业对优质数据非常感兴趣，因为数据在学习和训练 AI 模型中至关重要。这些数据用于竞争、改进交易，并增强\
  \ AI 的预测性和操作性。与人类相比，AI 在更好地理解非结构化数据方面更有帮助。我们首先需要将其转换为结构化形式，而 AI 可以原始或非结构化数据上进行自训练，并从中发现模式以获得更深层次洞察。\n\
  \n## 6.7 区块链环境下对 AI 决策的信任\n\nAI 的出现是为了完成那些完全没有经过编程的任务。它只需要数据来进行处理。计算霸权的快速增长和大数据的升级现在正推动着\
  \ AI，鼓励其在各个领域被广泛接受和应用 [26]。但是，AI 算法所做决策缺乏澄清和解释是一个巨大的缺陷。事实是，无论 AI 多么强大，你和我和其他人一样，如果不信任它，就不会倾向于使用它。深度学习并没有对其核心过程或输出提出推理和控制。目前作为黑盒的\
  \ AI 实现可能会通过对抗攻击污染学习或接口过程，而且它们经常受到偏见的影响。AI 是一项如此不可思议的技术，但仍然没有被广泛采用，因为没有人能解释计算机做出的决策，即使是机器学习算法的创建者也一样。那么，解决此类问题的方案是什么？\n\
  \n如果我们尝试捕捉决策过程中的每一步，那么 AI 就能更快地获得公众信任。区块链可以通过让 AI 变得更加连贯和透明来帮助获得信任。\n\n可解释 AI 或可解释人工智能\
  \ (XAI) 是一项新趋势，它为其 AI 决策提供解释。我们将提出一个框架，通过实施区块链、智能合约、可信视觉和去中心化存储的概念，帮助我们构建更可靠、更可解释的\
  \ AI。\n\n在涉及信任这些领域的 AI 的可靠性时，需要 100% 的确定性：\n\n- 完整性与安全性\n- 机器学习算法\n- AI 接口\n\n以下是区块链增强的\
  \ XAI 特性：\n\n- **透明性**：所有交易都存储在网络每个节点之间的分布式账本中，并且是公开审计的、仅追加的且清晰的。在整个过程中，交易日志和函数调用的日志以防篡、安全、去中心化的方式保留，并在整个网络中可用。\n\
  - **不可篡改性**：区块链账本是不可篡改的，无法更改之前的数据。账本由带有时间戳的区块组成。这些区块使用 `SHA-256` 和 `SHA-512` 等加密技术进行保护。每个区块包含一组信息以及以哈希形式存在的之前区块的位置。\n\
  - **智能合约**：这是一组代码，允许参与者与其他进行交互，它还以计算机、可靠且去中心化的方式管理预设和业务想法的实现。每个实现结果都由所有矿工节点验证和确认，并由广泛的节点进行结算。\n\
  - **可追溯性与非否认性**：每个参与节点必须通过加密对每笔交易进行签名。每个签名项目然后由矿工验证，如果他们通过了验证，矿工节点将被添加到区块链中。\n\n\
  ### 6.7.1 领先水平\n\n欧盟的 GDPR（即新的通用数据保护条例）对基于 AI 的决策方案提出了几项建议 [27]。在许多情况下，人有权获得算法本身得出的结论的澄清。假设在线信用卡申请被自动拒绝，该人有权知道为什么他们的申请被拒绝了。GDPR\
  \ 可能有助于设计避免歧视且具有解释性的算法和评估框架。XAI 方法的分类法如图图 6.15\n\n图 6.15 XAI 方法分类。\n\n讨论的一些要点和术语如下：\n\
  \n- **可解释 AI**\n  许多机器学习模型最终使用的特征是可理解的，例如稀疏线性模型和浅决策树是易理解的。这些模型是后验（post-hoc）还是内生的，无论是精于分类和回归的模型，还是能够以可解释的方式解决问题的。某些模型是全局近似，而另一些模型对于针对单个预测是可解释的。\n\
  - **视觉解释**\n  这与显示最终决策的关键特征有关。部分依赖图 (PDP) 通过降低机器学习模型的预测来显示估计与特征之间的联系。M 图是另一种更有效的选择，它考虑了数据集中的条件概率，从而避免了异常的组合。\n\
  - **特征贡献**\n  当机器做出决策时，非视觉化的含义更为重要。当特征是总回报时，预测值通过其 `Shapley value` 实现。\n- **代理模型**\n\
  \  模型怀疑方法将 ML 视为黑盒函数，并尝试使用替代模型。其目标是寻找一组与唯一函数 `f` 完美匹配的可解释函数 `G`。局部模型无关解释 `LIME`\
  \ 是一种通过减少损失函数来局部描述替代模型的方法。它选取一个案例 `x` 并寻找一个与 `x` 实际相当的函数 `g`。\n- **反事实示例**\n  反事实解释在我们的\
  \ AI 决策可靠性背景下起着重要作用。它是关于为了达到所需结果世界变化的说明，形式为“如果 A 没有发生，那么 B 就会发生”。具体来说，我们尝试对特征标准进行最小修改，以反转整个输出预测。\n\
  \n\n\n\nXAI（可解释人工智能）可以被认为是有前景的、可解释的且值得信赖的。提供描述或基础性解释意味着可以开发更简单的模型。在一次采访中，一位深度学习的创新者建议说，坚持制造可解释的人工智能系统将是一场灾难。即使要求人类解释自己的决策，我们大多数人最终也会编造出一个故事；神经网络也是如此。它们通过训练数据集学习，而这些数据集包含了数十亿条信息和数据。对这样的系统进行审计以验证预测结果并提供解释，将使\
  \ AI 更加可信赖。\n\n在我们方法论中，我们允许框架直接生成预测的解释，或者通过借助模型怀疑性解释系统的帮助。一个良好或合理的解释将被考虑，并对决策的可靠性做出贡献。对澄清框架的理解（包括终端的选择）应该以一种永久、精心设计且去中心化的方式进行检查，并以一种可以遵循并保持高度坚定质量和灵活性的方式（通用性是抵御恶意攻击的持久性）。如果某个节点尝试篡改之前区块中的数据，其哈希值将发生完全改变，从而导致链断裂。最终，由于无法回溯到创区块区块，整个哈希链都会断裂。可靠性源于网络中的每个节点都拥有账的完整副本，因此即使某个节点失败，区块链仍不受影响。\n\
  \n## 6. 结论\n\nAI 与区块链的联盟仍处于一个未开发的阶段。尽管这两种创新的结合已经开始，但这种融合可能会以以前从未想过的方式使用信息。AI 算法依赖于数据集，而区块链确保了这些数据并允许研究人员检查每一个步骤。AI\
  \ 拥有着巨大的潜力。但应该在极其谨慎的情况下对其进行修改和开发——区块链可以在这方面提供显著帮助。我们发现这两种不可信的技术可以相互互益。无论是面对巨大且灾难性的能量消耗，还是工作和信任\
  \ AI 决策，这种整合都可能催生一种坚不可摧的技术，对任何人来说都是可访问且有益的。将它们合并也有助于我们数据的安全积累。我们看到，基于区块链的 DAI 是各种概念和组件的集合，有助于为新的\
  \ AI 生态系统创建更好的基础设施，其目的是利用分布式数据训练 ML 模型，同时保留数据模型和数据提供者的所有权。\n\n## 参考文献\n\n1. [[1]]Xu,\
