  \ RULES.\n```\n\n\n\n\n\n# 可靠性\n区块链能够认证并确认每个利益相关方的个体身份。这一特性源于可快速达成的共识机制。最常见的共识是`PoS`（权益证明）。这些协议通过定义网络中持有代币较多、因而最适合承担保护系统重大责任的大股东来运作。在该共识机制下，若验证者不进行交易验证，虽然不会在链上造成损失，但会延迟新区块的生成。\n\
  \n# 安全性\n借助极其先进的加密技术和哈希机制，利用不可篡改性确保信息被密封于区块链内。采用 `SHA-256`作为哈希算法。其核心理念在于：区块链提供的存储空间有限且成本高昂——无论是庞大的数据星系还是单次交易费用都极为昂贵；因此所有数据都必须经过哈希处理后存入区块链网络。\n\
