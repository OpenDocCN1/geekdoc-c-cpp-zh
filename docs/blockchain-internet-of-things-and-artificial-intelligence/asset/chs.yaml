  \n### 8.5.3.3 减少基于纸张的票务系统\n大部分交通运输行业正在向数字时代迈进；地铁在 2013 年已停止销售纸质的本式车票。如今使用数字化系统来生成票据、开具收据以进行确认。世界正朝着无纸化运维的方向发展。基于区块链的分布式账本有助于存储所有乘客信息并在需要时检索这些信息。\n\
