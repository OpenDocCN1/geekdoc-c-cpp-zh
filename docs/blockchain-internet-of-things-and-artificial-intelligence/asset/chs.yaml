  ### 手机作为主要变革驱动力  \n移动设备扮演关键角色随时随地自由交互使企业接触更广泛受众提升员工生产力体现数据显示大约 41%美国人仅靠手机+66%家庭没有固定电话造成单独用传统渠道时通信困难(<时间>杂志)永久连接已成常态大致四分之三上网成年人拥有智能手机~72\
