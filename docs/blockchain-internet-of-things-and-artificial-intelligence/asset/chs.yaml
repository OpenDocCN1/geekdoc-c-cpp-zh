  \n### 14.3.1 内部攻击（Internal Attacks）\n\n***超出工作范围的无限访问权限：** *指员工拥有的数据库访问权限超出了其特定任务所需的范围。例如，一名负责更新客户联系信息的职员却有权访问客户的收入来源。\n\
  \  \n***密钥管理不足：** *将所有用于数据库加密的密钥存储在个人硬盘上并不安全；这会导致员工的系统容易遭受利用来窃取秘钥的攻击。\n \n***疏忽性表现（Database\
