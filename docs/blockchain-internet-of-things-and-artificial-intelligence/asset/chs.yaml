  \n\n\n\n\n银行正在采纳如`10X`和`Thought Machines`[64]这类云解决方案的新标准，预计到 2020 年及以后还会有更多参与者跟进。例如，卢森堡德意志银行采用了\
  \ Avaloq 银行业务套件（Avaloq Banking Suite），使其能够通过单一现金账本为客户提供全套服务，同时降低了复杂性、风险以及开支——尤其是在财富管理方面。\n\
  \n应用内实时小额支付和数字钱包支付的需求有所增长。此前仅限于 Telegram 等即时通讯应用的功能（该平台曾使用过此功能），如今大型科技公司也纷纷推出自己的支付服务；然而尽管一些顶级银行提供了全面的移动银行应用程序，但由于消费者日益偏好数字钱包而非现金或银行卡交易等传统方式，“这一垂直领域仍面临缓慢但稳定的采用增长”，且在年内开发者大量涌入区块链与加密资产领域：那些寻求满足高频需求的人群所经历的“热潮”，仍是驱动未来十年乃至更长时间的关键因素。不言而喻的是——数字化带来的便利同时也带来了安全挑战，促使各组织机构将网络安全置于一切之上！事实上根据引用的资料来源[[65]]()显示\
  \ 70%的安全漏洞源自终端用户本身而非银行的网络防御缺口。通过云计算集中收集数据的同时分散访问权限或许能构建更强的保护层配合本地化努力减少第三方中介数量确保全球金融机构在报告/分发协议上拥有更大自主权。\n\
  \n2017 年见证了加密货币成为主流投资标的之一–比特币从不足 1000 美元涨至约 18000 美元年度高位；虽然分析师认为它们最终可能取代全球金融体系但是去年末日本交易所\
  \ Coincheck 遭遇重大黑客攻击损失价值约五亿美元 NEM 代币凸显出当前依然存在的脆弱性加之正持续整合基于 AI/ML(人工智能/机器学习)灵活方案旨在快速威胁检测软体供应商实施的缓解策略以期提升运营效率加快市场响应速度优化客户体验整体格局由新兴金融科技初创企业间的竞争塑造预测未来几年将有激动人心的发展出现\
  \ 。\n\n## 催化剂数字化转型  \n\n数字化并非仅仅指创建网站添加电子商务商店获取点赞转发社交媒体帖子也不是单纯利用技术本身而应理解为因新技术快速普及推动发生的一场变革对现有组织施加压力如果不适应就可能被淘汰\
