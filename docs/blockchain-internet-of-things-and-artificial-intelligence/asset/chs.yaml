  \ IdMS 中的挑战\n### 4.3.7 智能合约与合\n## 4.4 结论\n\n## 参考文献\n\n## 4.1 引言\n物联网（IoT）在工业和研究领域经历了快速增长，但目前正面临着安全和隐私漏洞的挑战。这是由于大多数设备被应用于资源受限的去中心化拓扑结构。物联网作为一种嵌入式和网络物理系统的颠覆性技术，在互联传感器网络中提供了高粒度，可以从现实世界环境中收集信息。IoT\
  \ 中的区块链方法 [1–3] 将提高效率并为主要应用领域提供高级服务。其他挑战包括缺乏中心化控制、上下文感知风险等需要全面解决的问题。\n\n比特币是 2008\
  \ 年推出的中心化数字货币，它利用比特币作为区块链技术解决了隐私和匿名问题。如今区块链在云存储、数字资产、智能城市等应用中已普及，它由链式区块的账本组成。为了挖掘区块，对等点（P2P）节点验证新交易的发生并将其广播到整个网络。因此，所有节点都验证中心化的交易签名以确保稳健性。然而，多个矿工对单笔交易使用相同资源会导致交易延迟，这可以通过安全性、匿名性和去中心化等特性来解决。此外，在\
  \ IoT 中采用区块链不能直接实施，有必要解决关键挑战，包括：\n\n* IoT 设备的资源限制导致了高强度挖矿\n* 区块挖矿耗时较长，对低延迟有要求\n\
  * 当节点数量增加时扩展性较差\n* IoT 设备的带宽限制导致区块链协议的流量开销\n\n因此，IoT 和区块链改变了概念，并通过区块链的去中心化特性探索 IoT\
  \ 的优势创造了新的可能性。目前，物联网将连接 500 亿设备，包括智能手机、笔记本电脑、冰箱、汽车等传统异构设备。智能健康、智能家居和智能城市应用增加了隐私和安全威胁的暴露，损害了物理安全。实施的解决方案提供了相应的安全水平，能够对环境进行审计和控制。区块链以去中心化的方式验证数据，消除了单点故障并在用户之间建立信任。如今，区块链已用于物流和供应链、智能合约等许多应用。\n\
  \n### 4.1.1 概述\n物联网包括不同平台设备之间无需任何人工干预的数据处理和通信 [4]。这种对象的连接通过互联网发生，如今物联网被认为是互联网的扩展，允许将智能对象作为服务。区块链使用密码学\
  \ [5, 6] 作为授权网络交互的关键特征。例如：考虑智能合约。存储在区块链上的脚本执行自脚本，允许准确地进行分布式工作流。本章的目的是描述并强调区块链和物联网如何结合使用。区块链具有由不互信成员组成的分布式网络，这些成员在没有任何可信中间方的情况下相互交互。最近，区块链技术引起了金融领域利益相关者的兴趣。在缺乏可信中间的情况下，这导致了分布式信息的快速对账，并在网络成员之间进行复制和共享。\n\
  \n![image](img/fig4_1_B.jpg)\n\n图 4.1\n\n区块链复制 [5]。\n\n在`图 4.1`(`chapter-4.xhtml_fig4_1`)中，每个区块都通过加密哈希函数进行标识，并通过引用前一个区块的哈希建立区块之间的链接。为了更好地理解区块链，请考虑在同一区块链上运行的一组客户端。这里使用了私钥和公钥。私钥用于自己的交易，公钥用于网络交互\
  \ [7–10]。邻居节点确保传入交易并丢弃无效交易。一旦交易完成，通过将区块添加到链中更新世界视图。在另一种情况下，区块会被丢弃。\n\n### 4.1.2\
  \ IoT 的应用\n应用层的功能是提供客户服务。示例包括智能家居、智能工业等。物联网 [11–13] 有广泛的应用，允许在商业和日常生活中使用，将社会转变为更智能的世界。智能产品包括智能手机、智能电视和可穿戴传感器。智能健康监测体能状况、控制心率，并根据需求在家庭和医院监测患者的治疗。如今，在健康领域使用\
  \ IoT（`图 4.2`(`chapter-4.xhtml_fig4_2`））进行诊断和长期维护治疗记录已变得更加有效。智能交通通知交通信号，通过从远程监控车辆来控制路线，并整合智能平台。能源监控通过智能电网完成，在变电站和居民电表中对配电进行智能监控。库存管理通过智能电子商务以及最后的智能工业完成，以跟踪货物、控制生产、库存管理、污染控制、节能等。\n\
  \n![image](img/fig4_2_B.jpg)\n\n图 4.2\n\nIoT 应用。\n\n\n\n\n\n物联网（IoT）在构建环保智能城市中发挥着至关重要的作用。堵在城市交通中的车辆因排放增加给全球变暖带来了苦恼的体验。例如，交通灯安装了\
  \ IoT 传感器来提醒城市区域的拥堵情况。这一大数据问题可以通过建议替代路线来分析和处理。此外，人们在临时停车期间可以引导至停车位。停车位通过 IoT 传感器进行监控，并在人员离开该区域时在安装的应用中进行更新。这种场景可以在智能城市中得以实践。\n\
  \n#### 4.1.2.2 废物管理 (#chapter-4.xhtml_R_sec4_1_2_2)\n每天产生约三百万吨的垃圾，且这一数量正在不断增加。为了维持智能城市的可持续环境，应该通过回收尽可能减少垃圾的产生。IoT\
  \ 传感器跟踪回收箱，并在容器装满时发出警报 [14]。这一跟踪过程应该持续进行，相关人员应检查废物水平是增加还是减少。废物管理部门可以对非法倾倒垃圾采取适当措施。\n\
  \n#### 4.1.2.3 智能家居与建筑 (#chapter-4.xhtml_R_sec4_1_2_3)\n连接到 IoT 的设备执行远程监控并管理包括加热和照明在内的家电器。智能家居自动化允许用户通过手机上的\
  \ App 或任何其他连接设备控制自动门、安全摄像头和家用电器等智能设备。空调的温度可以根据天气预报自动调整。在智能家居中，包含了门锁解锁、安全监控和其他安全选项。压缩机功能运行至阈值水平，以承受冰箱中的功率波动。生活方式的改变提高了冰箱、电热水器和微波炉等家电远程访问的效率。室内固定自动化设备接收语音指令并对连接设备做出响应。智能家居配备了不同的\
  \ IoT 设备，检查服务质量 (`QoS`) 并制定通道优化方案。家电器可以根据居民行为、天气状况和其他因素进行静态或动态管理。家电中的静态调度定义了用户活动，服务费用是根据接收的电力供应和电子设备的能量需求准备的。如果预测数据发生变化，用户将重新安排活动以满足能量需求。这被称为运行时调度。人口增长、自动化和现代生活方式由于气候变化、碳排放、化石燃料等因素导致了能源危机，支持\
  \ IoT 的智能家居节省了能源需求，提供了便利舒适的生活。\n\n#### 4.1.2.4 智能电网 (#chapter-4.xhtml_R_sec4_1_2_4)\n\
  根据人口增长，电力资源的控制至关重要。建筑区域的能量消耗需要减少。区域提供的服务必须被持续监控并连接到网络 [15]。一旦增强，它能够通过传输线路实现传感器设备之间的双向通信。智能电表和智能恒温器建议家电的最佳使用方式，从而减少公用事业费用。\n\
  \n#### 4.1.2.5 智能医疗 (#chapter-4.xhtml_R_sec4_1_2_5)\n通过植入人体传感器可以增强医疗应用的性能。对于患者来说，它根据实时收集和分析的数据提供合适的治疗。先进的\
  \ IoT 传感器为医疗行业创造了革命，并提高了质量和成本。\n\n#### 4.1.2.6 智能工业与制造业 (#chapter-4.xhtml_R_sec4_1_2_6)\n\
  为了减少人工干预，机器人被设计为以受控的方式自动跟踪和处理制造任务。工业企业在较少或没有人工干预的情况下执行自动化功能。绿色 IoT 将制造系统与远程访问和低停机时间融合。工业企业与工厂车间之间高效的数据共享提高了设备效率、市场敏捷性和劳动生产率。\n\
  \n#### 4.1.2.7 智能物流与零售 (#chapter-4.xhtml_R_sec4_1_2_7)\n射频识别 (`RFID`) 和智能货架受到了提供客户服务的关注。固定在卡车上的托板发送关于产品的信息。零售行业中互连的物理设备数字化地修改了供应链，实现了成本效益和实时远程跟踪的端到端管理\
  \ [16]。带有传感器的 `GPS` 跟踪气候变化预测性维护、路线优化等方面的物流功能。还为客户提供了跟踪和获取物流数据的选项。\n\n#### 4.1.2.8\
  \ 智能农业 (#chapter-4.xhtml_R_sec4_1_2_8)\n设备配备了传感器以进行有效的通信和感知。能量需求大幅增加，引起了多个机构的高度关注。绿色\
  \ IoT 专注于满足可持续智能世界的能量消耗。带有 IoT 的算法有助于减少温室效应。设备连接到互联网后变得更加智能，其基本原理分类为以下类型：\n\n1.\
  \ 对接收的数据采取行动实体\n2. 收集信息并发送信息的实体\n3. 同时执行上述功能的实体\n\n因此，IoT 的有效性取决于在整个生命周期内保护数据，并将区块链演进为\
  \ IoT。大多数 IoT 设备依赖于中心化通信模型，这是最大的缺点。IoT 中的区块链防止了整个网络作为存储时形成单点故障；数十亿设备之间的存储和计算是以去中心化的方式进行的，帮助\
  \ IoT 设备高效扩展。此外，区块链在 IoT 中的集成降低了服务器的安装和管理成本，通过 IoT 网络中的加密算法确保机密性。区块链保护 IoT 网络免受中间人攻击。最初，区块链应用始于比特币并演变为智能合约。通过提高在协调应用中的效率，智能合约在众筹、抵押贷款和其他投资方式中实现了自主执行。流行的区块链平台以太坊在分布式应用程序中运行智能合约并与其他区块链交互。除了智能合约和加密货币，区块链在\
  \ IoT 中的应用存在于涉及智能服务的领域。可穿戴设备、智能交通系统、物流与供应链、农业、安全和能源领域等应用可以从区块链中受益 [14, 17]。图 4.3\
  \ 应用。\n\n```\n![image](img/fig4_3_B.jpg)\n```\n图 4.3\n\nBIoT 应用\n\n### 4.1.3 区块链集成\
  \ IoT 架构 (#chapter-4.xhtml_R_sec4_1_3)\n\n\n\n\n\n图 4.4 解释了智能家居架构，其中用户 Alice 装备了许多\
  \ IoT 设备。这些设备分为三层，即本地层、覆盖层（overlay）和云存储层。事务通过在账本上创建相似事务与设备相关。如果不需要该交易，则意味着用户可以通过删除账本来移除该设备。设备通信仅在授权用户应用共享密钥时发生。本地区块链执行家庭交易中的所有访问控制。添加的指针将上一个区块的策略复制到新区块并将其添加到链中。每个家庭都可以添加可选存储，如图\
  \ 4.4 所示。覆盖网络由组成节点构成，包括家庭中的智能设备、手机或电脑。为了在互联网协议 (IP) 层获得额外的匿名性，网络中的节点连接到覆盖层。通过在覆盖网络中将节点分组为具有簇首的簇，可以减少延迟和开销。如果网络出现过度延迟，节点可以更改其簇首，这可以在网络中的任何时间发生。在某些情况下，交易发生的延迟较高。拥有多个房屋的所有者可以像图\
  \ 4.4 中红色所示那样共同管理他们所有的房屋。共享覆盖层由公共矿工和共享资源组成。覆盖区块链中的所有事务都链接到起始事务。云存储用户组中的相同区块具有唯一的区块号，以便成功定位数据，并在对区块号进行哈希后执行用户验证。新的区块号使用共享密钥通过\
  \ Diffie Hellman 算法加密。拥有共享密钥的人知道区块号。由于只有真实用户拥有区块号，这保证了现有账本的安全性。创建许多账本是用户的偏好，策略在这里定义。如果需要，授权用户访问整个数据链，此时矿工发送存储数据的哈希值和区块号。在其他情况下，请求者在从矿工处接收到最小数据时使用安全回答等方法。簇系统具有转发事务的区块链。此外，请求的事务和请求者由簇首记录。其他节点根据其在事务通信中的参与程度存储数据。实时监控家居以及所有者访问信息的愿望可以通过检查智能温控器的当前配置等方式轻松实现。IoT\
  \ 相关的设备互联提供的框架允许无缝通信。IoT 应用在信息处理方面关注 IoT 架构的中间件层。这些层为：\n\n![image](img/fig4_4_B.jpg)\n\
  \n图 4.4\n\n集成区块链的物联网架构 [18]。\n\n1. 感知层\n2. 网络层\n3. 中间件层\n4. 应用层\n5. 业务层\n\n### 4.1.4\
  \ 使用区块链的安全框架\n\n主要的可用性攻击有：(1) 拒绝服务攻击：防止授权用户访问数据或服务；(2) 修改攻击：破坏云存储安全，试图删除或更改存储的数据。通过比较存储的本地区块链哈希值与云数据，可以检测到这些更改；(3)\
  \ 丢弃攻击：接管组簇首并丢弃所有区块和接收到的事务。当节点从网络接收不到任何服务或事务时，即可识别出该攻击。在选举新簇首时让簇感知到这种情况即可检测到异常；以及\
  \ (4) 挖矿攻击：簇首协作并对伪区块进行多签名事务进行挖矿。因此，通过结合授权、识别和认证获得安全性 [19]。\n\n这些安全框架定义如下：\n\n> **完整性**。期望授权用户操作。其他人无法更改信息。\n\
  \n> **可用性**。真实用户可以随时需要访问系统。为了维护此服务，用户需要数据库和通信基础设施。\n\n> **机密性**。保证未授权的用户不会收集信息。\n\
  \n> **身份验证、授权和审计**。验证用户身份以在系统中执行特定功能，如存储信息、所有者权限等。\n\n> **不可否认性**。保证用户在执行特定操作后无法否认其行为。例如授权的购买或资金转账。\n\
  \n> **哈希函数**。用于生成摘要（唯一输出，如指纹数据）的数学函数。\n\n> **单向性**。从哈希值计算输入很难找到。\n\n> **压缩**。哈希大小由数据的一个极小比例表示。\n\
  \n> **扩散**。一个输入位的变化将使哈希结果改变 50%。\n\n> **碰撞**。两个输入生成相同的哈希值将导致计算难度增加。\n\n## 4.2 区块链物联网范式\n\
  \n### 4.2.1 区块链的物联网安全\n\nIoT 中的交互发生在机器与机器之间（M2M），无需人工干预。挑战是在参与机器之间建立信任。然而，区块链的使用起到了催化作用，增强了扩展性、安全性、可靠性和隐私。因此，区块链被部署在\
  \ IoT 生态系统中，用于跟踪和协调设备进行事务处理。针对连接网设备的搜索引擎 `Shodan` 的存在已经暴露了物联网中区块链之外的不安全设备，这增强了系统的可靠性，消除了单点故障。区块链中使用加密算法和哈希函数进行数据加密提供了更好的安全服务。而实现哈希和加密函数需要更多的处理能力，这在数字经济中仍然是一个挑战。信任维护是区块链在物联网中的初始考虑。区块链中收集的信息序列是按时间戳系统网络化的事务时间顺序。它还提供了实时事务，防止工业物联网中的数据伪造和篡改攻击，如图\
  \ 4.5 所示。一旦部署，传感器设备的区块链记录被称为 Pindar Propounds。\n\n![image](img/fig4_5_B.jpg)\n\n\
  图 4.5\n\n区块链中的签名验证 [5]。\n\n### 4.2.2 挑战\n\n#### 4.2.2.1 存储：容量与扩展性\n\n\n\n\n每 10\
  \ 分钟以 1 MB 的速度增长的区块链引发了关于区块链可扩展性和存储容量的问题。挑战在于如何积极地存储副本。网络中的节点需要验证区块和交易，这对存储空间有显著要求。区块链资源的增加降低了系统的可扩展性。另一方面，由于链条过大导致系统过载会降低性能，引入负面影响，并增加新用户的同步时间。在分布式环境中，共识机制的重要特性是交易验证。调制能力和计算时间直接影响区块之间的交易时延。网络中交易数量的增加以及相应的共识协议对网络的可扩展性有直接影响。考虑到比特币及其可扩展性局限性，区块链协议应改进共识延迟，而莱特币具有类似于比特币但更快的交易能力，并改进了存储效率。比特币通过改变链选择规则提升了区块链的可扩展性。另一项进展是星际文件系统（`IPFS`）协议，用于分布式环境下的去中心化\
  \ [20]共享和文件存储，在提高网络效率的同时，消除了攻击和网络中每个文件的重复问题。\n\n#### 4.2.2.2 安全：缺陷与威胁 #chapter-4.xhtml_R_sec4_2_2_2\n\
  \n比特币协议中的漏洞和安全威胁已被分析。观察发现，区块链控制了 51% 的矿参与者限制了用户数量。大多数比特币攻击是双重花费。比特币的交易深度需要 20–40\
  \ 分钟的长时间，这导致了双重花费攻击。同样，用户交易直接发送给商家，会导致商家被欺骗的竞争攻击。依赖通信的协议容易受到攻击，破坏其在网络中的工作。克服区块链中的代码更新和优化是通过加密货币社区来改进协议的。因此，区块链技术\
  \ [18, 21–24] 具有用于改进的软叉和硬叉，包括更新软件协议和功能。然而，保留旧规则的节点必须进行根本改变，因为新协议将与旧版本的节点兼容。如今在较新版本中，节点之间相互计算，因为它们必须在分叉社区中决定版本。因此，分叉版本费力地划分了社区，给区块链用户带来风险。如果必要，区块链的每天改进中还会引入新的错误漏洞。\n\
  \n#### 4.2.2.3 隐私：匿名性与数据隐私 #chapter-4.xhtml_R_sec4_2_2_3\n\n比特币协议没有内置隐私性。其透明性是核心特征。每笔交易都可以从初始交易开始在区块链中进行追溯和审计。这种透明性建立了一种信任，但用户匿名性方面的挑战仍然存在，因为比特币允许用户以伪匿名方式使用多个钱包。在比特币功能中，努力建立更强的匿名性是具有必要性的。许多区块链技术在处理敏感数据时需要更高层次的隐私。许多尝试正在解决匿名性问题。因此，在交易中使用签名使其无法被追踪，且不易被个人系统跟踪。这些服务使得交易安排了最小的支付。\n\
  \n然而，这些服务容易被盗，例如所示：一个最初提议的硬币与比特币合并导致了匿名。用户对合并支付的同意打破了从同一钱包获取交易输入的假设。混合服务器也根据实现方式缺乏用户之间的匿名性。因此，开发了暗黑钱包，在比特币交易中提供完全的匿名。`mixcoin`\
  \ 中随机的加密机制增加了安全性。通过改进硬币洗牌修改硬币合并实现了更高的安全性。硬币交换接收未连接的硬币进行支付，增加了混合服务器的匿名性。因此，为了处理区块链中的隐私数据加密，尽管编译器将通用代码转换为加密原语，它实现了交易匿名。在中心化网络中使用分布式哈希表有助于存储数据引用。区块链中的隐私问题通过提供身份验证和授权机制进行不同的处理。然而，在私有区块链企业环境中，愿意维护数据隐私的参与者使用\
  \ `Hyperledger fabric` 部署可扩展的分布式账本，以访问网络中的控制列表和服务。网络成员通过公开身份彼此。存储在区块链内部的大量数据依靠时间戳和数据完整性验证的权威进行管理。因此，来自外部源的信息通过区块链获取、验证并安全化。\n\
  \n## 4.3 IoT 环境下的区块链技术 #chapter-4.xhtml_R_sec4_3\n\n### 4.3.1 通用数字账本 #chapter-4.xhtml_R_sec4_3_1\n\
  \n分布式账本大部分被称为其作为数字形式货币的应用结果，但事实上，加密货币和账本具有两种不同的技术方法论。考虑到加密货币市值（Coin Market Cap），大多数国际分布式账本组织遵循加密货币，但并非完全是为了保留不同结构的中心。除了数字形式货币，某些分布式账本技术（`DLTs`）结合了智能合约（由\
  \ `Ethereum` [25]）或文件容量。由于互联网访问的快速增长以及更多集成无线技术和传感器的设备，移动设备的成本正在下降，手机已成为不可或缺的需求。所有这些方面使得物联网（IoT）的需求比例变得非常高。物联网是一个应用范围极广泛的领域，从简单的智能家居到医疗领域，再到现代应用，这使得实现执行与安全之间的最佳平衡变得轻而易举。关于\
  \ DLT 一个日益明确的解释伴随着最简单的结构，即由大型网络中的每个节点自由持有并刷新的数据库中的分布式账本。这种交付非常有趣，记录不是通过中心位置连接到网络中的不同节点，而是由每个现有节点自主连接和通信，以做出网络的独立决策。DLT\
  \ 的形成改变了双方之间的数据汇集和信息共享。到目前，DLT 和区块链最集中的领域是金融领域。比特币开启了这种剧变，因为它被用作 P2P 框架支付商品和服务，不需要被称为银行或金融机构的中心专家。\n\
  \n### 4.3.2 IoT 中的分布式账本 #chapter-4.xhtml_R_sec4_3_2\n\n\n\n\n\n利用分布式账本技术（DLTs）、区块链和物联网（IoT）可以避免关联设备中存在的一些大性问题，正如随附的可理解的问题所示。区块链被用于跟踪传感器信息的估值，并预测是否发生了欺诈交易。IoT\
  \ 设备是复杂的、适用于设备识别、确认和信息安全的分布式账本。分布式账本可以保护 IoT 设备的信息不被篡改，如图图 4.6\n\n图 4.6\n\n账本 [25]。\n\
  \n### 4.3.3 分布式账本](#chapter-4.xhtml_R_sec4_3_3)\n\n分布式账本技术（DLT）是一种关于交易和责任的计算机记录，此类类型的信息在共享网络的所有成员之间进行复制并持有。共识算法旨在确保该网络的每个节点都拥有与不同节点相同的账本副本。主要的\
  \ DLT 或区块链类型通常有两种：开放式和私有式。比特币是一个开放式账本，任何人都可以提交交易。不需要第三方权威提供授权。私有账本则所有利益者都是已知且受信任的，共识过程由许多从一个被称为“协调者”的元素中预先选出的成员监督。目前，开放式和私有\
  \ DLT 被认为是这两种者的混合类型。DLT 平台可以分类为：(a) 无许可的、(b) 有许可的、(c) 严格共识的，以及 (d) 具有特定交易的。这些技术带来的影响是通过消除“中间人”因素来颠覆现有的业务模式，减少无需维护服务器的基础设施成本，并创建去中心化应用（dApps）。这些每一项都使得能够仔细地模拟两个互不认识但确实面对面进行货物交易的人之间突然存在的信任成为可能，因为它提供了与物质货物不可区分属性的数字表述\
  \ [24]。因此，如果他们的资产面临危险，他们应该采取行动。正是这种所有成员的热情构成了一个反脆弱框架，因为对区块链的攻击会加强它，因为所有成员都有热情去修复导致攻击可能的缺陷，并使框架能够继续运行。以太坊、流畅演进（EOS）和物联网应用（IOTA）正在颠覆\
  \ DLT 领域，使其潜在应用几乎无限。诸如“带有 [IoT] 的区块链” [26] 中的模型显示，这种技术采纳方面存在一个促进水平，但它们也显示了人们创造并参与新奇异事的需求。最引人迷目的部分之一是不同\
  \ DLT 用于防止欺诈的共识类型算法。工作量证明（PoW）策略是比特币和其他著名数字货币应用最广泛共识算法。它包括让计算机破解复杂的谜题或数值问题，从而将所有交易放在下一个区块中。它用于防止攻击者执行\
  \ DoS 攻击。\n\n### 4.3.4 共识机制](#chapter-4.xhtml_R_sec4_3_4)\n\n构建共识是区块链良好运行的优势之一。它从根本上包含一个决定后续条件的组件，以推断对于要添加到区块链的区块的批准已达成共识。在投票时，所有小项被赋予相同的权重，并根据共识机制以积极方式投出的多数票发布结果。这种方案在受控领域内可以执行；在开放式区块链中，此组件将受到女巫攻击的威胁，因为具有多个不同身份的客户端副本将有控制区块链的选项。去中心化网络中的客户端必须包含区块链中的每个区块。此参数是任意执行的，但该问题倾向于所有攻击。PoW\
  \ 共识机制依赖网络中的更多功能，因此更容易受到攻击。一种安排是：在发现答案之前进行少量的计算，这种过程被称为挖矿。在比特币区块链中，挖矿包括一个由 `SHA-256`\
  \ 哈希值计算出的不规则数字（称为 `nonce`），该区块头具有零。随后，矿工需要证明所执行的测量措施解决了该问题。\n\n当问题被解决时，不同节点确认所获得的答案是正确的就非常简单。由于最近提到的问题，提议的一种可选共识机制是：一种\
  \ PoS（权益证明证明）共识组件的计算能力低于 PoW。因此，矿工周期性地展示共识组件。由于有较少节点参与区块确认，交易执行得比其他方案更快。此外，代表们可以调整区块大小和间隔，万一他们行为不端，他们可以毫无问题地被替换。活动证明（PoA）共识被提作为基于质押\
  \ PoS 框架的一个基本限制：当节点未与网络关联时，它就会产生。通过这种方式，提了 PoA 计划以激励区块链上的所有权和活动。实用拜占庭容错（PBFT）是一种处理异常情况下的拜占庭将领（BG）问题的共识算法。PBFT\
  \ 接受并非超过 33% 的节点是恶意的。对于要添加到链的每个区块，选择一个先驱来负责请求交易。Bitcoin-NG 执行了比特币共识算法的变体，旨在提高灵活性、吞吐量并降低延迟。PoB（质押证明）背后的思想是，与其消耗资源（例如由于大量\
  \ PoW 使用的账户电力），不如消耗加密货币因为它在容量资源方面被认为是昂贵的。\n\n### 4.3.5 去中心化](#chapter-4.xhtml_R_sec4_3_5)\n\
  \nIoT 中心化架构转变为 P2P 分布式账本，区块链提供了稳健性和可扩展性。这最小化了避免单点故障问题的延迟，防止了单个权威在分布式账本上做出决策。\n\n\
  ### 4.3.6 自主身份](#chapter-4.xhtml_R_sec4_3_6)\n\n#### 4.3.6.1 概述](#chapter-4.xhtml_R_sec4_3_6_1)\n\
  \n\n\n\nIoT 将物理世界和网络世界中的所有个人和物体连接起来，到 2020 年，已有超过百亿具有执行和感知能力的设备连接在一起。当数十亿设备连接在一起时，存在无数的数据资源，挑战在于识别分配这些身份的实体，以便通信能够顺利进行。在发生互连和交互的群体中生活时，身份在\
  \ IoT 系统中起着重要作用。数字身份是 IoT 环境中的敲门石。在不可信环境中使用 IoT 时，如果没有数字身份，几乎无法进行的交易将导致业务机会的缺失。身份管理系统遵循哲学领域的方面/逻辑，在区块链的新范式下为\
  \ IoT 提供身份解决方案。数字身份是互联网时代在线服务构建机制，以及身份验证、授权和安全交换协议的基石。然而，它们依赖信任第三方，这增加了从内部攻击到损害用户隐私的威胁。因此，传统的身份管理系统引发了许多隐私担忧。此外，这些身份管理系统受到长期漏洞和攻击的影响，导致单点故障。例如，Facebook\
  \ 的安全泄露已成为攻击者的“蜜罐”。个人数据的暴露会导致数据泄露漏洞。IoT 的出现可以直接植入原生 IoT 环境，并且对于 IoT 中身份管理系统的设计具有重要意义。其特征如下：\n\
  \n- **可扩展性**：拥有数十亿设备的 IoT 与由第三方管理的系统相比，需要高度可扩展的身份管理，而后者提供了极不现实的解决方案。然而，在去信任网络中，必须建立不同身份管理系统之间的相互互信关系。\n\
  - **互操作性**：异构对象执行不同的通信能力导致了互操作性问题。\n- **移动性**：在不考虑设备位置的情况下确保连接服务。\n\n#### 4.3.6.2\
  \ 传统身份管理系统 (IdMS)\n\n数字身份管理系统管理用户的身份信息、凭据和属性。图中描述了一个传统的身份管理系统，由三个利益相关者组成：用户、身份提供者和服务提供者。它们相互依赖，依靠第三方身份验证协议请求并访问服务，如图\
  \ 4.7 所示。\n\n![image](img/fig4_7_B.jpg)\n\n图 4.7\n\n身份管理系统 [27]。\n\n身份管理系统访问互联网服务和服务资源。在过去的几十年里，这些从集中式模型转变为联邦式模型。在访问互联网服务时，所有用户都需要在安全域注册以获取数字身份。为了解决密码管理问题，身份管理允许多个服务提供者减少用户身份的数量。而联邦模型则在身份提供者和访问服务之间建立关系。\n\
  \n#### 4.3.6.3 区块链身份解决方案\n\n区块链关注消除交易中间环节，为去中心化环境提供了卓越的安全解决方案。此外，区块链作为分布式账本在 P2P\
  \ 网络中拥有永久记录。此外，它同时更新验证所有成员的网络旨在创建去中心化应用程序（dApps）。区块链用于构建命名系统以及安全且去中心化的系统。许多 IT 者关注智能合约以确保身份方面的可靠性，如图\
  \ 4.8 所示。分布式账本对互联网上的每个身份进行管理。\n\n![image](img/fig4_8_B.jpg)\n\n图 4.8\n\n基于区块链的身份管理解决方案概述\
  \ [27]。\n\n### 4.3.6.4 IdMS 的挑战\n\n构建有效的身份管理系统的关键组件在信任、隐私和性能方面仍然面临挑战。访问控制和身份是密不可分的。IoT\
  \ 中的身份系统能够实现适当的授权，并为策略的快速增长而设计。集中系统中存在的一个常见问题是访问权限、角色和属性的分配在扩展去中心化 IoT 时并不适用。然而，区块链无法解决所有这些问题。在大多数情况下，服务和身份提供者需要经过授权的用户，且性能评估对于运行身份管理系统至关重要。\n\
  \n### 4.3.7 智能合约与合规性\n\n支持智能合约的区块链是 Nick Szabo 提出的区块链 2.0。智能合约是由图灵语言数字启用的自主程序。它们具有一组预定义的规则和条件，能够自动执行。规则包括合约执行、验证和确认。一个例子就是自动售卖机。区块链\
  \ 2.0 构建了与智能合约相关的提供变性和透明性的不安全性和特性。智能合约现在正充当各个应用领域采的催化剂。它通过合约实体化，使具有预设条件的区块链系统在满足条件时自动触发交易。智能合约实现了双方之间的双向交易。这些交易是瞬时的，且不受共识限制。随着智能合约的出现，区块链支持轻量级应用，使微支付系统负担得起，促进并培养了新的创新。此外，IoT\
  \ 设备使用智能合约来促进数据交易中的现金流资源。对区块链使用的关注使得智能设备交互可以在没有任何中央控制机构的情况下发现并交换消息。然而，设备通信通过传输层安全协议（TLS）进行验证。智能合约是比特币的替代方法\
  \ [27, 28]，因为没有区块促进微支付。在智能合约代码中，区块链存储了执行约定条款的协议规则。\n\n![image](img/fig4_9_B.jpg)\n\
  \n图 4.9\n\n智能合约生命周期 [28]。\n\n如图 4.9 所示，智能合约使区块链技术在自动执行合约类方面的交易协议取得了进步。合约记录在区块链中，保证了适当的访问控制。对于每个合约函数，开发者分配访问权限，使合约具有确定性。一旦满足条件，就会触发语句以以可预测的方式执行智能合约。\n\
  \n## 4.4 结论\n\n\n\n\n\n在本章中，描述了区块链的使用将消除物联网（IoT）中的安全忧虑。此外，针对许多应用领域，解释了与区块链相关的各种方法和技术。讨论了区块链与物联网集成的开放性问题，为未来的研究方向提供了参考。研究并分析了区块链对物联网设备的影响，随后根据物联网场景进行了技术比较。\n\
