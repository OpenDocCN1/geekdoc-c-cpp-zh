  #### 3.4.1 机器学习\n### 3.4.2 人工智能算法\n### 3.4.3 使用人工智能算法解决问题类型\n## 3.5 融合区块链与人工智能技术面临的挑战\n\
  ### 3.5.1 人工智能与区块链技术的集成\n### 3.5.2 区块链-人工智能融合的影响\n#### 3.5.2.1 挑战\n\n\n\n\n\nAI\
  \ 是一种让机器确定人类大脑能多智能地思考或执行任何任务的方法。它是对 [1]  人类在解决问题时如何思考、学习、工作和做决策的研究。此外，整个研究的输出是一个非常智能的软件系统。AI\
  \ 的目标是丰富与人类知识相关的计算机功能，例如推理、问题解决和学习。智能领域存在许多长期持续的目标。AI 分析的目标涵盖了知识表示、推理、规划、自然语言处理、理解、学习、训练、实现以及改变和编辑对象的技能。标准的\
  \ AI 观点包括分析方法、算术和统计智能以及传统的杂乱式 AI。计算机科学领域在每一个领域都增强了 AI。\n\n我们将 AI [2] 视为一种技术，帮助世界上不同地区的人通过与智能软件协作来获取和实现许多成就。将\
  \ AI 视为为技术披上人性的脸孔。AI 是一种自动化技术，它可以从来自现代世界任何部分的海量可用数据中获取知识，它理解我们的语言并以这种方式做出响应，并按照我们的方式解释世界。在本章中，我们将探索这种技术如何工作，以及\
  \ AI 如何彻底改变计算机与人类合作的方式，从而形成一个更好、更安全的世界。在 AI 现有进展和摄像机的帮助下，人们在正确的时间和地点采取不同行动以增强人类的福祉和安全。随着我们的世界日益数字化，我们依赖技术的能力也会之增强。例如，当有危险液体流进任何一个工厂时，摄像头会识别它并迅速分享给最迫切需要的人，允许他们保护不同的工人免受因接触液体而可能影响他们的风险。世界的数字化正在汇聚，以帮助每一个人变得更安全、更高效、更健康。\n\
  \nAI 的范围 [3] 广阔且深入。我们考虑了 AI 领域中 图 3.1 所示的广泛共同的热门研究领域。有大量的实现案例，AI 正在忙于支持普通人的日常生活。现实世界应用中最强大且最令人兴奋的技术之一是机器学习。机器学习\
  \ (ML) 技术极大地改变了计算机应用程序，它使用神经网络模拟人类决策。机器学习是 AI 的一个领域，我们通过学习输入数据将 AI 引入方程中。通过提供的数据让机器学习的过程无非机器学习。经过海量数据训练的设备执行任务更准确，并且可以更精确地预测结果。\n\
  \n![image](img/fig3_1_B.jpg)\n\n图 3.1\n\n人工智能领域。\n\n借助 ML [4]，我们可以开发出能够自主做出决策的智能系统。算法通过统计分析和模式匹配从过去出现的数据中学习。然后算法根据学习到的数据为研究人员提供准确的结果。数据是机器学习算法的骨干。通过历史数据的帮助，我们可以通过训练这些机器学习算法产生更多数据。整个机器学习结合了计算机科学、数学和统计学。\n\
  \n## 3.2 AI 智力概述](#chapter-3.xhtml_R_sec3_2)\n\n### 3.2.1 通过搜索算法解决问题](#chapter-3.xhtml_R_sec3_2_1)\n\
  \n在本节中，我们将讨论在设计用于解决特定问题 [5] 的软件时应该遵循的足迹。首先，我们必须清晰地定义问题，并定义操作符，如起始节点和目标节点。然后，我们必须检查问题，并确定它在问题分类中的所属位置。之后，我们必须分析并表示任务所需的知识。最后，我们必须选择一种或多种解决问题的方法，并将这些技术应用于问题中。我们将讨论如何将任务领域的知识编码到问题解决程序中，以及将问题解决技术与知识结合以解决几类重要问题的技术。\n\
  \n#### 3.2.1.1 不同的问题与解决方案](#chapter-3.xhtml_R_sec3_2_1_1)\n\n问题可以通过以下元素进行分析：\n\n\
  * 代理开始工作的`主节点` (primary node)。\n* 代理可用的所有可能`动作` (actions) 的插图。\n* 对每个操作的说明，被称为`转移模型`\
  \ (transition models)。\n* `目标节点` (goal node)，它与其他节点的目标节点不同。\n* `路径成本` (path cost)\
  \ 操作，为每条路径分配数值成本。\n\n#### 3.2.1.2 寻找解决方案](#chapter-3.xhtml_R_sec3_2_1_2)\n\n第一步是确定目标节点。我们通过对当前状态应用合法操作来实现这一点，从而生成一组新的状态。在这种情况下，图\
  \ 3.2(a) 显示了一个父节点 (Shiv)，它有三个子节点 (Manish, Sanjay, Rajesh)。在这里，父节点通向三个分支，被称为 Shiv\
  \ 的子节点。这三个子节点在 图 3.2(a) 的部分中同样被称为叶节点或终端节点（终端节点在树中没有子节点）。当我们继续移动时，将发现新的叶节点。\n\n假设我们选择了\
  \ Manish，那么我们将看它是否为目标节点（它不是），然后将其扩展到 Tanish 和 Anish，来自 图 3.2(b) 和 3.2(c)。我们可以选择其中任何两个，或者返回\
  \ Sanjay 或 Rajesh。现在 Tanish 和 Anish 是叶节点。当没有更多节点可以扩展或找到解决方案时，我们将停止扩展节点。搜索算法共享这些基本结构；它们根据根据要扩展的下一个节点进行。\n\
  \n![image](img/fig3_2_B.jpg)\n\n图 3.2\n\n搜索解决方案示例。\n\n图 3.2(c) 显示了从 Shiv 走到 Anish\
  \ 的最短路径。带下划线的节点是已扩展的节点。\n\n#### 3.2.1.3 无知搜索](#chapter-3.xhtml_R_sec3_2_1_3)\n\n\
  无知搜索 [6] 也也称为“盲搜索”，因为它们不携带关于节点的任何额外知识。它们对于遍历树涉及的步骤信息很少。无知搜索类型在 图 3.3 中所示。\n\n![image](img/fig3_3_B.jpg)\n\
  \n图 3.3\n\n无知搜索策略。\n\n##### 3.2.1.3.1 广度优先算法\n\n广度优先搜索 (BFS) 用于遍历树和图 [7]。它是最常见的搜索算法。它使用其算法在树或图中按宽度进行搜索。该算法从树的根节点开始搜索过程，然后扩散到当前层上的下一个节点。在在完成第一层的搜索后，它移动到下一层的节点。它使用先进先出（FIFO）队列数据结构实现。图\
  \ 3.4 通过示例展示了广度优先搜索的工作。\n\n![image](img/fig3_4_B.jpg)\n\n图 3.4\n\n广度优先搜索示例。\n\n\n\
  \n\n宽度优先搜索（BFS）的优点是：如果存在解决方案，BFS 将提供一个解决方案；如果困境中包含多个解决方案，则 BFS 将给出精确的解。缺点是该算法需要大量的存储空间，因为它需要保存遍历过的每一个层级或节点。另一个缺点是，当根节点较远时，它会变成一个非常耗时的算法。\n\
  \n# 广度优先搜索算法\n\n### 3.2.1.3.2 深度优先搜索\n\n这类搜索类型通常使用递归函数实现，该函数通过不断调用自己来遍历数据结构中的树或图\
  \ [8]。这是因为深度优先搜索算法从起始节点开始搜索，并追踪每条路径直到其最末端的叶节点，然后进入下一条路径。它是使用 LIFO（后进先出）栈数据结构实现的。图\
  \ 3.5 展示了深度优先搜索的示例工作原理。\n\n![image](img/fig3_5_B.jpg)\n\n图 3.5\n\n深度优先搜索示例。\n\n\
  深度优先搜索的优点是与广度优先搜索相比，它使用的存储空间非常少，且算法耗时较短，因为它到达目标节点所需的时间不多。缺点是无法保证能找到解决方案，因为许多状态会不断重复，且算法在有时向深搜索时可能会陷入无限循环。\n\
  \n# 深度优先搜索算法\n\n### 3.2.1.3.3 深度限制搜索\n\n该算法与深度优先搜索算法相同，只是增加了一个预设的检查点。深度优先搜索具有某些良好的属性，例如空间复杂度。在任何情况下，如果一个没有经过安排的分支无限延伸，那么在这一点上可能不会结束。因此，它们对要扩展的分支进行深度限制搜索，并且不再让分支在该深度以下生长。在知道解决方案的最极端深度的情况下，深度限制搜索通常很有用。图\
  \ 3.6 展示了深度限制搜索算法的示例工作原理。\n\n![image](img/fig3_6_B.jpg)\n\n图 3.6\n\n深度限制搜索算法示例。\n\
  \n深度限制搜索的优点是内存效率高。缺点是当任何问题有多个解决方案时，不建议使用。\n\n### 3.2.1.3.4 统一代价搜索\n\n这种搜索算法用于加权图或树的遍历\
  \ [9]。它是通过优先级队列实现的。当每条路径的代价与所有边相同时，该算法与广度优先搜索一致。该算法的主要目标是找到目标节点。图 3.7 展示了统一代价搜索算法的示例工作原理。\n\
  \n![image](img/fig3_7_B.jpg)\n\n图 3.7\n\n统一代价搜索算法。\n\n统一代价搜索的优点是最优的，因为它会选择代价最低的路径。缺点是该算法不关注搜索过程中涉及的步数，而是关注路径代价。由于这一点，它可能会陷入无限循环。\n\
  \n### 3.2.1.3.5 双向搜索\n\n双向搜索 [10] 的目的是通过同时正向起始点查找和反向朝目标查找来减少搜索时间。如果两个外围活动汇合，该规则可能会重建一条从起点开始通过中心点扩展到终点的简单路径。关于双向搜索的另一个注意事项是确保两点在同一个地方相遇。例如，深度优先双向搜索由于其在边界点方面的功能不同而无法很好运行。双向广度优先搜索可以满足需求。\n\
  \n在两个不同方向上结合广度和深度优先搜索可以确保搜索策略之间产生必要的交叉点，但确定方向的原因是困难的。选择取决于维持两种搜索策略以满足其之一一个条件的开销。图\
  \ 3.8 展示了双向搜索算法的示例工作原理。\n\n![image](img/fig3_8_B.jpg)\n\n图 3.8\n\n双向搜索算法。\n\n##\
  \ 3.2.1.4 启发式搜索\n\n启发式搜索通过对每个指定扩展的节点采取明智且敏锐的选择，努力减少可能进行的搜索次数 [11]。它也被称为拥有关于当前节点到目标节点估计间隔额外知识的系统。主要，这些都是通过使用被称为启发式函数完成的。\n\
  \n### 3.2.1.4.1 启发式函数\n\n该函数常用于启发式搜索 [12]。它估计状态与目标状态之间的确定性路径。它通过将当前节点作为输入来评估智能体距离目标有多近。这种搜索算法可能不会提供最佳解释，但在单次搜索中，它保证能找到良好的解释。它表示为\
  \ `x`。\n\n### 3.2.1.5 纯启发式搜索](#chapter-3.xhtml_R_sec3_2_1_5)\n\n纯启发式搜索是启发式搜索的一种形式。它估计状态与目标之间的路径。它维护两个列表：`OPEN`\
  \ 列表和 `CLOSED` 列表。在 `OPEN` 列表中放置尚未扩展的节点；在 `CLOSED` 列表中放置已扩展的节点。图 3.9 展示了纯启发式搜索的类型。\n\
  \n![image](img/fig3_9_B.jpg)\n\n图 3.9\n\n纯启发式搜索类型。\n\n#### 3.2.1.5.1 最佳优先搜索（贪心搜索算法）\n\
  \n在这种搜索策略中，扩展是朝目标节点进行的。这里使用启发式函数 `h` 来寻找终点的距离，并降低 `h`。简单的模式是扩展具有最小值的状态。\n\n最佳优先搜索的优点是到达目标节点的路径较少，且适用于启发式搜索问题。缺点是在最坏的情况下，它可能会变成无引导的深度优先搜索。\n\
  \n![image](img/fig3_10_B.jpg)\n\n图 3.10\n\n最佳优先搜索示例。\n\n在图 3.10 中，贪心搜索用于寻找从 `S`\
  \ 到 `G` 的路径。这里某些节点的 `h` 值在旁边的表格给出。终点位于节点 `S`，它可以靠近 `A` (`h = 3`) 或 `B` (`h = 2`)。这里因为代价较低选择了\
  \ `B`。在 `B` 的此状态下，可以移动到 `E` (`h = 3`) 或 `F` (`h = 1`)。再次 `F` 具有较低的启发式代价，因此我们选择 `F`。最终\
  \ `F` 可以到达 `G` (`h = 0`)。完整路径的图如图 3.11 所示。\n\n![image](img/fig3_11_B.jpg)\n\n图 3.11\n\
  \n最佳优先算法的解。\n\n**最终路径为：** S -> B -> F -> G\n\n##### 3.2.1.5.2 A* 搜索算法\n\n\n\nA*（A\
  \ 星）搜索算法将贪心搜索算法的优势与一致代价搜索的优势相结合 [14]。在这一搜索中，“总代价”表示为 `f(x)`。启发式函数定义为一致代价搜索中代价的聚合，表示为\
  \ `j(x)`，而贪心搜索代价表示为 `h(x)`。\n\n(3.2) `f(x) = j(x) + h(x)`\n\n这里`j(x)` 是反向遍历代价，即从根节点的组合代价。此外，`j(x)`\
  \ 是后续代价，是从终点到当前点的近似值。基本方法是选择 `f(x)` 值最小的节点。A* 策略通过安排节点 `h(x)` 代价，并低估 `h(x)` 的原始代价来优化。最直接的技术是选择\
  \ `f(x)` 值减少程度最大的节点。只有当节点 `h(x)` 的代价是卷积的且低估了到达目标的 `h(x)` 原始代价时，A* 策略才能得到优化。上述 A*\
  \ 搜索策略的属性被称为不可容的（inadmissible），其公式为：\n\n(3.3) 0 < h(x) < h*(x)\n\n接下来列出算法的优点：首先，与任何搜索算法相比，A*\
  \ 搜索算法是最精细的算法。其次，它是一个完备且优化的算法。最后一个优点可以使用该算法解决非常复杂的问题。接下来讨论 A* 搜索算法的缺点，例如由于它基于估计和启发式，它不会产生最短路径，另一个是存在一些复杂性问题。\n\
  \n图 3.12 显示了 A* 搜索算法的工作原理。找到节点 S 到节点 G 的最短路径。\n\n![image](img/fig3_12_B.jpg)\n\n\
  图 3.12\n\nA* 算法示例。\n\n从节点 S 开始，该算法简化每个节点的 `[j(x) + h(x)]`，选择总和最短的节点（表格中用勾选标记）并忽略另一个。整个工作过程见下表\
  \ 表 3.1。\n\n| 路径 | h(x) | j(x) | f(x) | |\n| --- | --- | --- | --- | --- |\n| S\
  \ -> A | 3 | 1 | 4 | 勾 |\n| S -> G | 0 | 10 | 10 | 忽略 |\n| | | | | |\n| S -> A ->\
  \ B | 4 | 1 + 2 = 3 | 7 | 忽略 |\n| S -> A -> C | 2 | 1 + 1 = 2 | 4 | 勾 |\n| | | |\
  \ | |\n| S -> A -> C -> D | 6 | 1 + 1 + 3 = 5 | 11 | 忽略 |\n| S -> A -> C -> G |\
  \ 0 | 1 + 1 + 4 = 6 | 6 | 勾 |\n\n表 3.1\n\nA* 算法的路径计算\n\n树的完整路径见 图 3.13。\n\n![image](img/fig3_13_B.jpg)\n\
  \n图 3.13\n\nA* 算法的解。\n\n**路径：** S -> A -> C -> G\n\n需要记忆的关键点是，该算法并不搜索所有剩余部分，而是返回首次路径，其效率衡量了启发式的标准。\n\
  \n### 3.2.2 AI 的任务领域\n\nAI 领域或类别被分为不同的任务 [15] 类别，如 图 3.14 所示，例如日常/通用任务、形式任务和专家任务。\n\
  \n![image](img/fig3_14_B.jpg)\n\n图 3.14\n\nAI 任务领域。\n\n*   **日常任务 (Mundane Tasks)**：它们是我们每天做的普通事情，或者人类执行并成功完成以满足日常需求的任务。这包括自然语言、机器人控制、感知等。\n\
  *   **形式任务 (Formal Tasks)**：此类任务侧重于形式逻辑的应用、学习、游戏（例如跳棋和象棋）以及定理证明等形式任务。几何和逻辑形式的数学属于此类任务。\n\
  *   **专家任务 (Expert Tasks)**：这些任务需要高水平的分析和思维能力，因为它们是需要专业知识的专门任务。这些属于功能专家领域。工程、科学分析和医学诊断属于此类任务。\n\
  \n图 3.15 显示了基于 AI 任务领域的应用领域概览。\n\n![image](img/fig3_15_B.jpg)\n\n图 3.15\n\nAI 任务领域。\n\
  \n## 3.3 知识\n\n*(注：原文后续部分存在大量重复和断句，已根据指令处理核心逻辑内容)*\n\n\n\n\n逻辑表示知识库的根本方法是引入一阶谓词逻辑。在这种策略中，知识库（通常称为\
  \ `KB`）可以被看是一个逻辑公式的集合，这些公式对世界形成了特定的描述。`KB` 的修改源于逻辑公式的删除或添加。\n\n逻辑表示的示例有：\n\n*  \
  \ Rhea 和 Isha 是姐妹：= `Sisters (Rhea, Isha)`\n*   有些女孩在玩板板球：\n    这里，谓词是 `play (*x*,\
  \ *y*)`，其中 `x` = `girls`，`y` = `game`。由于是“某些女孩”，我们将使用 `∃`，其写法为：\n    `∃x girls(x)\
  \ → play (x, cricket)`\n*   每个学生都尊重他的老师：\n    这里，谓词是 `respect (*x*, *y*)`，其中 `x`\
  \ = `student`，`y` = `teacher`。由于是“每个学生”，我们将使用 `∀`，其写法如下：\n    `∀x student(x) → respects(x,\
  \ teacher)`\n*   语义网络表示\n\n语义网络是一种描述概念、事件、对象、动作或情之间的关系和属性的方法。它们以图形化网络的形式表示。它由属性组成，连接边被标记有描述它们相互关系的标签。这些网络因为其简单性和自发性，在人工智能领域处于顶尖。它们非常容易理解，并且可以很容易扩展。\n\
  \n在图 3.19 中，有一只名叫 Tom 的猫。它由 robin 支配。猫猫是灰色的。我们知道所有的猫都是哺乳动物。我们也知道所有哺乳动物都属于动物范畴。\n\
  \n![image](img/fig3_19_B.jpg)\n\n图 3.19\n语义网络表示的示例。\n\n*   帧表示\n\n帧（Frame）是一种知识表示系统，通过由关系连接的多个帧来表示知识。它基于继承的概念。它们是槽（slots）及其对应对象（称为槽值）的组合。它们涉及到人工智能的参与。帧由槽及其记录的取值组成，用于描述世界中可区分的对象。这些属性具有不同的类型和大小。属性具有面（facets），即名称和值。这些面是帧的特征，允许对帧进行约束。\n\
  \n与单帧相比，多帧非常有用。多帧包含许多链接的帧集合；其中每个帧都存储与知识库中组成并连接的对象或动作相关的信息。在人工智能中，帧也被称为“槽-过滤器”知识表示。假设我们需要为表\
  \ 3.2 中的板球运动员表示制作一个帧。\n\n| 属性 | 填充内容 |\n| --- | --- |\n| 运动 | 板板球 |\n| 角色 | 守门击球员\
  \ |\n| 击球风格 | 右打 |\n| 投球风格 | 右臂中 |\n| 年龄 | 38 |\n| 经验 | 16 年 |\n| 最高分 | 183* |\n\
  \n表 3.2\n板球运动员的帧表示\n\n*   产生规则\n\n产生规则系统由一个规则知识库和一个全局数据库组成，后者代表系统状态，以及一个用于选择执行规则的规则控制结构（解释器）。产生规则意味着一对“如果（场景）那么（反应）”。如果前提条件重复了世界当前的情况，则该产生规则被称为“触发”；而当产生规则的操作完成后，它被称为“点火”。它的写法为\
  \ (场景, 反应)。\n\n示例：\n\n*   IF（努力工作 AND 获得好成绩） THEN 反应（进入一所好大学）\n*   IF（击球员来场 AND\
  \ 表现良好 AND 没出局） THEN 反应（他将击出百分打）\n*   IF（吃冰淇淋 和薯片） THEN 反应（不会感到饥饿）\n*   IF（关闭淋浴间的水）\
  \ THEN 反应（水将停止流动）\n\n产生规则的主要组件是：\n\n*   全局数据库：全局数据库是人工智能中产生系统使用的中央数据结构。\n*   产生规则集：产生规则在全局数据库上运行。如前所述，系统可以被触发或点火。规则的应用会替换数据库。\n\
  *   控制系统：控制系统随后选择应该应用哪条应用规则。一旦满足数据库终止条件，它就会停止计算。\n\n### 3.3.2 计算逻辑\n\n通常需要开发计算机程序来推断那些未被表示但由其他已表示事实所暗示的事实。一个智能机器人可能会使用由另一个表示事实所隐含的逻辑事实。例如，如果它想找出如何在领先位置进入目标状态，或者推断何时达到目标状态。数据库查询系统可能需要从数据库中的其他信息推断出适当的信息。计算逻辑的开发就是为了指导此类问题。与此同时，相关的谓词演算表达式证明是人工智能逻辑知识表示的一种有力手段，因此，人工智能逻辑是一个关键领域。\n\
  \n#### 3.3.2.1 方法\n\n寻求构建证明的方法有两种方法：\n\n*   语义方法：它过度依赖于符号的含义。当我们使用这种方法时，我们的首要目标是考虑所有可能的解释。\n\
  *   句法方法：在这里我们忽略符号。我们使用形式的符号操作规则。这种方法用起来更方便，特别是对于计算机来说，因为我们可以本能地应用规则，而无需思考它们的含义。\n\
  \n#### 3.3.2.2 计算逻辑的类型\n\n逻辑系统具体由系统的逻辑陈和一个和规则（统称为推理规则）组成。现在，逻辑推理的计算方法分为两个部分：复杂的`谓词逻辑`或更直接的`命题逻辑`。\n\
  \n*   谓词逻辑\n    谓词逻辑涉及经典符号形式的使用。简单的句子也可以用逻辑公式表示，其中谓词作用于一个或多个参数。谓词逻辑本身就是一种非常的人工智能。命题对个体做出声明。\n\
  \    `predicate`是命题中对个体做出声明的部分。谓词逻辑还包括一组结构化过程，用于证明某些公式可以从其他公式中逻辑推导出。\n    示例：她住在镇上。\n\
  \    `P (*x*, *y*)`: `x` 住在 `y`。\n    `P (Myrah, Jaunpur)` 是一个命题：Myrah 住在雅加答。\n\n\
  \n\n\n\n*   在任何情况下都为真的命题公式称为重义式。\n*   在任何情况下都为假的命题公式称为矛盾式。\n\n### 3.3.2.3 计算逻辑连接词的表示\n\
  \n典型的数学逻辑符号和连接词的含义如[表 3.3] 所示。\n\n| 连接词 | 符号 | 含义 |\n| --- | --- | --- |\n| 与 (And)\
  \ | ∩ | 两者都是 |\n| 或 (Or) | ∪ | 其中之一或两者都是 |\n| 非 (Not) | ~ | 反 |\n| 等价 (Equivalent)\
  \ | → | 如果左侧项为真，则右侧项也为真 |\n| 意味着 (Implies) | ≅ | 具有相同的真值 |\n\n表 3.3 数学逻辑符号\n\n某些问题的解决方案是通过演绎来完成的。演绎意味着通过某些系统的推理程序获得解决方案。演绎可以用被称为“肯定前件”的论证形式表示。在命题演算中证明定理的另一种方法是使用“真值表”。\n\
  \n## 3.4 AI 算法与方法\n\n正如我们之前讨论过的，人工智能（AI）简单来说就是让机器像人类一样进行决策和思考的科学。复杂的人工智能算法的发展通过创建机器人和机器实现了这一点，这些机器应用于计数机器人、医疗、营销、农业、业务分析等许多领域。在我们加速之前，让我们尝试理解什么是机器学习（ML）以及它是如何与人工智能相关的。\n\
  \n#### 3.4.1 机器学习\n\n机器学习是现实世界应用中最强大且令人兴奋的技术之一。机器学习技术从根本上改变了计算机应用，并使用神经网络模拟人类的决策。\n\
  \n机器学习是人工智能的一个领域，我们通过学习输入数据将人工智能引入其中。这种通过提供的数据让机器学习的过程无非机器学习。使用海量数据训练的设备执行任务更加准确，并且能够更精确地预测结果。图\
  \ 3.20 表示了机器学习的步骤。\n\n![image](img/fig3_20_B.jpg)\n\n图 3.20 机器学习构建模型。\n\n在每个领域，机器学习可能具有不同的性质，并且根据领域和应用的性质，它可以执行各种方法。机器学习有许多方法来处理海量数据。在今天的生活，在大多数领域，机器学习通过提供信息和帮助未来预测展现了其特性。\n\
  \n机器学习的应用包括：\n\n*   推荐系统\n*   欺诈检测\n*   预测分析\n*   过采样和过拟合问题\n*   家庭和电器\n*   交通警报（地图）\n\
  *   搜索引擎结果精炼\n\n![image](img/fig3_21_B.jpg)\n\n图 3.21 通过 AI 实现智能化。\n\n图 3.21 显示了能够自主做出决策的智能系统的发展。算法通过统计分析和模式匹配从过去的数据发生中学习。然后，它根据学习的数据为我们提供准确的结果。数据是机器学习算法的核心。在历史数据的帮助下，我们可以通过训练这些机器学习算法产生更多数据。整个机器学习结合了计算机科学、数学和统计学。\n\
  \n#### 3.4.2 AI 算法\n\n通常，算法使用一些数学和逻辑，并接收一些输入产生输出，但 AI 算法结合了输入和输出以学习和训练数据并产生有益的输出。每组算法都执行对给定未知输入预测输出的相同任务。然而，在选择正确且合适的算法时，数据是骨干。\n\
  \n#### 3.4.3 使用 AI 算法解决问题的类型\n\n图 3.22 显示，使用 AI 算法解决问题的通用类型是回归、分类和聚类。\n\n![image](img/fig3_22_B.jpg)\n\
  \n图 3.22 AI 问题类型。\n\n对于每一类任务，都有特定的算法可以使用。算法可以解决不同类型的问题。一些基本且流行的 AI 算法包括：\n\n*  \
  \ 逻辑回归\n*   随机森林\n*   决策树\n*   聚类算法\n*   K-means 聚类\n*   支持向量机 (SVM)\n*   回归算法\n\
  *   朴素贝叶斯\n*   线性回归\n*   K 最近邻 (KNN)\n\n因此，AI 包含了允许计算机学习决策以及如何解决问题的一切。这一领域致力于理解智能实体。基于计算机的智能已被证明是最且创新的技术，因为即使在开发的初期，它已经产生了许多令人印象深刻的产品。\n\
  \n## 3.5 区块链与 AI 技术融合面临的挑战\n\n#### 3.5.1 AI 与区块链——技术\n\n在非正式语言中，当我们谈论区块链时，它是以一种清晰且建立的方式积累节点中所有执行情况的分配报告。区块链的机制让每个人都对区块链开发产生了兴趣。凭借其吸引人且活力的技术，它在许多方面影响了专业世界。\n\
  \n区块链的关键特征包括：\n\n*   缺乏灵活性\n*   本地数据库\n*   记录分布\n*   数据保护\n*   无云化和清晰性\n\n区块链一直是市场中非常值得投资的技术，但它也有一些局限性。考虑到这一点，AI\
  \ 似乎是使区块链使其增长和演变的正确解决方案。可以通过以下方式实现：\n\n*   更精细的数据管理\n*   改进和优化的能源消耗\n*   更具衡量性\n\
  *   增强效率\n*   更高的安全性\n*   全新的数据网关\n\n#### 3.5.2 区块链-AI 融合的影响\n\n人工智能和区块链的应用在业务上非常相似。当我们讨论它们的整合时，各种挑战随之而生。让我们不要浪费时间地讨论它们。\n\
  \n区块链技术是以一种清晰且建立的方式积累节点中所有执行情况的分配报告。区块链的机制让每个人都对区块链开发产生了兴趣；它是本地的，且节点是杂乱的。由于区块链是公共且开源的，这导致\
  \ AI 输出很难汇聚在一点。因此，融合这两种技术的想法仍然很新。它们各有自己的步调。\n\n与区块链和 AI 融合相关的另一个挑战是安全性。区块链是一个共同分配、安全加密且去中心化的数据库，为\
  \ AI 提供可靠且无尽的知识。该技术依赖于加密算法，有助于数据安全。然而，如果有人尝试使用 AI 修改安全数据，解密这些文件将非常困难，会导致数据黑客攻击。\n\
  \n\n\n\n\n- 区块链的基础是去中心化的，与人工智能（AI）的基础非常不同。如果我们谈论区块链节点的本质，会发现它们是异构的。因此，如果区块链是公开的，那么机器学习（ML）的输出将无法以单点形式出现。\n\
  - AI 需要大量的数据，而区块链形成的数据库在扩展性上无法消耗此类量的数据。这意味着在当前状态下，区块链无法与 AI 集成。\n- 在某些情况下，AI 未能展现其核心实力，例如\
  \ Uber 的自动驾驶汽车在开始尝试避让红灯时失败了。在这种情况下，如果 AI 是去中心化的，那么管理 AI 造成的损害将具有挑战性。\n\n## 3.6 结论\n\
  \nAI 指的是用于执行智能任务的机器，而这些任务通常由人类完成。换句话说，AI 是赋予调查能力的“动力”或“头脑”，并能从收集的信息中进行动态处理。在上述章节中，我们详细讨论了\
  \ AI 技术和方法。区块链是一个去中心化的机器系统，通过记录和存储信息，在一个简单且永久的记录框架上展示事件的有序排列。根据定义，区块链是一种用于存储加密信息的分布式、去中心化、不可变的记录。区块链和\
  \ AI 已发展成为驱动性技术，推动了几乎每个行业的进步。AI 和区块链正逐渐成为一种极其惊叹的结合，改进了它们所落地的每一个行业。这些创新可以结合起来，彻底改变从食品供应链协调、医疗保健记录共享到媒体权威性和金融安全的一切问题。AI\
  \ 与区块链的融合影响着许多方面，包括安全性——AI 和区块链将为数字攻击提供双重保护。众所周知，每项技术都有其复杂性本质，但 AI 和区块链都处于可以相互获利并互相帮助的境地。\n\
