  (由于用户提供的文本最后一部分关于 `cin` 和 `cout` 的描述不完整，我将翻译该部分：)\n\n## 3.2 使用 cin 和 cout 进行输入和输出\n\
  \n编程最基本的方面之一是与用户或其他系统交互的能力，在 `C++` 中，我们主要通过输入和输出 (I/O) 实现这一点。标准输入和输出流 `cin` 和 `cout`\
  \ 为接收用户数据和显示结果提供了简单的方法。让我们深入了解这些组件的工作原理以及你如何在 `C++` 程序中利用它们。\n\n### 理解 cout\n\n\
  `cout` 对象是 C++ 标准库的一部分，包含在 `<iostream>` 头文件中。它代表“字符输出”，用于将数据打印到标准输出（通常是控制台）。你可以使用插入运算符\
  \ (`<<`) 将数据发送到 `cout`。\n\n这是一个简单的示例：\n\n```cpp\n#include <iostream>\n\nint main()\
  \ {\n    std::cout << \"Hello, World!\" << std::endl;\n    return 0;\n}\n```\n\n\
  在此片段中，`std::cout` 将字符串 \"Hello, World!\" 发送到控制台。`<< std::endl` 部分不仅添加了换行，还会刷新输出缓冲区，确保发送到\
  \ `cout` 的内容立即显示。\n\n### 使用 cin 进行输入\n\n\n\n\n相反，`cin`（“character input”的缩写）用于接收来自用户的输入。和\
  \ `cout` 一样，它也是 `<iostream>` 库的一部分。你可以使用提取运算符 `>>` 从 `cin` 读取数据。\n\n这是一个从用户处读取整数的示例：\n\
  \n```cpp\n#include <iostream>\n\nint  main() {\n\nint age;\n\nstd::cout << \"Enter\
  \ your age: \";\nstd::cin >> age;\nstd::cout << \"You are \" << age << \" years\
  \ old.\" << std::endl;\nreturn  0;\n}\n```\n\n在这段代码中，程序提示用户输入年龄，将输入存储在变量 `age` 中，然后将其显示给用户。注意程序在运行到\
  \ `std::cin >> age;` 这一行时会等待用户输入。这种阻塞行为在控制台应用程序中很常见，对于交互式程序至关重要。\n\n## 输入和输出格式化\n\
  \n格式化输出可以大大提高程序的清晰度。例如，你可以使用 `<iomanip>` 库在显示浮点数时控制小数位数。以下是格式化输出的方法：\n\n```cpp\n\
  #include <iostream>\n#include <iomanip>\n\nint  main() {\n\ndouble pi = 3.14159265359;\n\
  std::cout << \"Value of Pi: \" << std::fixed << std::setprecision(2) << pi << std::endl;\n\
  return  0;\n}\n```\n\n在这个示例中，`std::fixed` 确保输出为固定点计数表示法，而 `std::setprecision(2)`\
  \ 将输出限制为两位小数。结果，程序将显示“Value of Pi: 3.14”。\n\n## 使用 cin 进行错误处理\n\n在处理用户输入时，优雅地处理潜在错误至关重要。如果用户输入的值与预期类型不匹配，`cin`\
  \ 将进入失败状态（fail state），任何后续输入操作将被忽略。这是一个基本的错误检查示例：\n\n```cpp\n#include <iostream>\n\
  \nint  main() {\n\nint number;\n\nstd::cout << \"Enter a number: \";\nwhile (!(std::cin\
  \ >> number)) {\n\nstd::cout << \"Invalid input. Please enter a valid number: \"\
  ;\nstd::cin.clear(); // 清除错误状态\nstd::cin.ignore(std::numeric_limits<std::streamsize>::max(),\
  \ '\\n'); // 忽略无效输入\n\n}\n\nstd::cout << \"You entered: \" << number << std::endl;\n\
  return  0;\n}\n```\n\n在段代码中，如果用户输入的不是整数，程序会提示他们重试。`std::cin.clear()` 函数重置错误状态，而\
  \ `std::cin.ignore()` 忽略无效输入，允许程序继续。\n\n## 3.3 运算符和表达式\n\n在 C++ 中，运算符和表达式是允许你执行计算、操作数据和控制程序流的基础组件。理解它们是如何工作的原理是编写高效算法和高效解决问题的关键。\n\
  \nC++ 中的运算符是对一个或多个操作数执行操作的特殊符号。操作的结果可以赋值给变量或用于后续计算。运算符可以分为几类：\n\n1. **算术运算符**：用于执行数学计算。\n\
  \    * `+`（加法）\n    * `-`（减法）\n    * `*`（乘法）\n    * `/`（除法）\n    * `%`（取模，返回除法的余数）\n\
  \n以下是使用算术运算符的示例：\n\n```cpp\nint a = 10, b = 3;\nint sum = a + b;// // 13\nint difference\
  \ = a - b; // 7\nint product = a * b; // 30\nint quotient = a / b; // 3\nint remainder\
  \ = a % b; // 1\n```\n\n2. **关系运算符**：这些运算符比较两个值并返回布尔结果（真或假）。\n    * `==`（等于）\n \
  \   * `!=`（不等于）\n    * `<`（小于）\n    * `>`（大于）\n    * `<=`（小于或等于）\n    * `>=`（大于或等于）\n\
  \n示例：\n\n```cpp\nint x = 5, y = 10;\nbool isEqual = (x == y); // false\nbool isGreater\
  \ = (x > y); // false\n```\n\n3. **逻辑运算符**：这些运算符用于执行逻辑操作并返回布尔值。\n    * `&&`（逻辑与）\n\
  \    * `||`（逻辑或）\n    * `!`（逻辑非）\n\n示例：\n\n```cpp\nbool condition1 = true;\nbool\
  \ condition2 = false;\nbool result = condition1 && condition2; // false\n```\n\n\
  4. **位运算符**：这些运算符对位进行操作，对低层编程非常有用。\n    * `&`（按位与）\n    * `|`（按位或）\n    * `^`（按位异异）\n\
  \    * `~`（按位非）\n    * `<<`（左移）\n    * `>>`（右移）\n\n示例：\n\n```cpp\nint num = 5; //\
  \ 二进制: 0101\nint shifted = num << 1; // 二进制: 1010，即 10\n```\n\n5. **赋值运算符**：这些运算符将值赋值给变量并也可以执行操作。\n\
  \    * `=`（赋值赋值）\n    * `+=`, `-=`, `*=`, `/=`, `%=`（复合赋值）\n\n示例：\n\n```cpp\nint\
  \ value = 10;\nvalue += 5; // 现在 是 15\n```\n\n6. **三元运算符**：这是 if-else 的简写。\n   \
  \ * 语法：`condition ? expression1 : expression2`\n\n示例：\n\n```cpp\nint age = 18;\n\
  std::string eligibility = (age >= 18) ? \"Eligible\" : \"Not eligible\";\n```\n\n\
  ## 表达式\n\n表达式是变量、常量、运算符和函数调用的组合，用于计算值。\n\n### 运算符优先级和结合性\n\n在处理多个运算符时，理解优先级和结合性至关重要。优先级决定了先计算哪个运算符，而结合性定义了相同优先级运算符的计算顺序。\n\
  \n例如，在表达式：\n\n```cpp\nint value = 5 + 2 * 3;\n```\n\n乘法运算符 `*` 的优先级高于加法运算符 `+`，所以先计算\
  \ `2 * 3`。\n\n结合性适用于相同优先级的运算符。例如，加法和减法是从左结合的：\n\n```cpp\nint result = 10 - 3 + 2;\
  \ // result 为 9\n```\n\n在这里，先执行减法。\n\n## 在控制结构运算符\n\n运算符经常用于控制结构，例如 `if` 语句和循环。例如：\n\
  \n```cpp\n#include <iostream>\n\nint  main() {\n\nint a = 10, b = 20;\n\nif (a <\
  \ b) {\n\nstd::cout << \"a is less than b\" << std::endl;\n} else {\n\nstd::cout\
  \ << \"a is not less than b\" << std::endl;\n}\n\nfor (int i = 0; i < 5; i++) {\n\
  \nstd::cout << \"Iteration \" << i << std::endl;\n}\n\nreturn  0;\n}\n```\n\n在这段代码中，关系运算符\
  \ `<` 用于比较 `a` 和 `b`，而循环使用 `<` 运算符来控制迭代次数。\n\n\n\n\n\n```cpp\nstd::cout << \"Grade:\
  \ D\" << std::endl;\n} else {\n    std::cout << \"Grade: F\" << std::endl;\n}\n\n\
  return 0;\n}\n```\n\n在这个示例中，我们提示用户输入一个分数，然后使用一系列 `if`、`else if` 和 `else` 语句对其进行评估。每个条件都会检查分数是否在特定范围内，从而使逻辑流清晰且结构化。这种嵌套结构提供了一种处理多个条件的直接方法，并且易于阅读和维护。\n\
  \n### 使用 C++20 增强 if 语句\n\n随着 `C++20` 的引入，我们获得了一些可以增强条件语句使用的新特性。其中一个特性是 `constval`\
  \ 关键字，它允许在编译时评估常量表达式。这对于我们希望在编译时而非运行时强制执行某些条件场景特别别有用。\n\n考虑以下示例，我们对成绩强制执行了某些条件：\n\
  \n```cpp\n#include <iostream>\n\nconsteval char getGrade(int score) {\n    if (score\
  \ < 0 || score > 100) {\n        throw std::invalid_argument(\"Score must be between\
  \ 0 and 100.\");\n    }\n    if (score >= 90) return 'A';\n    if (score >= 80)\
  \ return 'B';\n    if (score >= 70) return 'C';\n    if (score >= 60) return 'D';\n\
  \    return 'F';\n}\n\nint main() {\n    int score;\n    std::cout << \"Enter your\
  \ score: \";\n    std::cin >> score;\n    try {\n        char grade = getGrade(score);\n\
  \        std::cout << \"Grade: \" << grade << std::endl;\n    } catch (const std::invalid_argument&\
  \ e) {\n        std::cout << e.what() << std::endl;\n    }\n    return 0;\n}\n```\n\
  \n在这个示例中，`getGrade` 是一个 `consteval` 函数，它在编译时检查分数的有效性，确保只有有效的分数才能被处理。这不仅提高了安全性，还提高了性能。\n\
  \n### switch 语句\n\n虽然 `if` 语句非常灵活，但当我们需要将一个变量与多个特定值进行比较时，`switch` 语句是一个更有组织且可读性更高的选择。`switch`\
  \ 语句评估单个表达式，并将其值与一系列 `cases` 进行匹配。以下是基本语法：\n\n```cpp\nswitch (expression) {\n  \
  \  case value1:\n        // 如果表达式匹配 value1，则执行代码\n        break;\n    case value2:\n\
  \        // 如果表达式匹配 value2，则执行代码\n        break;\n    default:\n        // 如果表达式不匹配任何\
  \ case，则执行代码\n}\n```\n\n让我们重新回顾评分系统示例，并使用 `switch` 语句来实现它以获得更好的清晰度：\n\n```cpp\n\
  #include <iostream>\n\nint main() {\n    int score;\n    std::cout << \"Enter your\
  \ score (0-100): \";\n    std::cin >> score;\n    switch (score / 10) {\n      \
  \  case 10: // 分数为 100\n        case 9:\n            std::cout << \"Grade: A\" <<\
  \ std::endl;\n            break;\n        case 8:\n            std::cout << \"Grade:\
  \ B\" << std::endl;\n            break;\n        case 7:\n            std::cout\
  \ << \"Grade: C\" << std::endl;\n            break;\n        case 6:\n         \
  \   std::cout << \"Grade: D\" << std::endl;\n            break;\n        default:\n\
  \            std::cout << \"Grade: F\" << std::endl;\n            break;\n    }\n\
  \    return 0;\n}\n```\n\n在这段代码中，我们将 `score` 除以 `10`，允许我们将分数分类到不同的范围内。每个 `case`\
  \ 对应一个特定的字母等级，使逻辑清晰简洁。`break` 语句的使用确保了除非有意图，否则执行不会穿透到后续的 `case`。\n\n### 主要区别与实际考量\n\
  \n在 `if` 和 `switch` 之间做出选择时，请考虑你需要评估的条件的性质。`if` 语句极其灵活，能够处理复杂的逻辑表达式，并可以轻松整合关系运算符。例如：\n\
  \n```cpp\nint x = 10;\nif (x > 5 && x < 15) {\n    std::cout << \"x is between 5\
  \ and 15.\" << std::endl;\n}\n```\n\n相比之下，当我们需要将单个变量与一组离散值进行比较时，`switch` 语句表现尤为出色。在条件数量很多的情况下，它还可以提供细微的性能优势，因为编译器优化\
  \ `switch` 语句的效果比优化长 `if` 语句链更好。\n\n记住 `switch` 语句的一个关键点是 `break` 语句的必要性。没有它，执行将穿透到下一个\
  \ `case`，可能会导致意外的行为。以下是没有 `break` 时可能会发生的情况示例：\n\n```cpp\nint n = 2;\nswitch (n)\
  \ {\n    case 1:\n        std::cout << \"One\" << std::endl;\n    case 2:\n    \
  \    std::cout << \"Two\" << std::endl;\n    case 3:\n        std::cout << \"Three\"\
  \ << std::endl;\n    default:\n        std::cout << \"Not one, two, or three\" <<\
  \ std::endl;\n}\n```\n\n*(注：由于原文后续部分存在大量重复且混乱的循环描述，翻译已在逻辑完整处截止，以确保文档质量)*\n\n\n\n\
  \n在这种情况下，无论初始输入是什么，用户至少会被提示一次。此功能在您希望在初始提示后验证用户输入的场景中特别有用。\n\n### 关键区别与实际考虑因素\n\n\
  选择 `for`、`while` 和 `do-while` 循环通常取决于任务的具体需求。当你知道确切的迭代次数时，使用 `for` 循环；当迭代次数取决于某个条件时，使用\
  \ `while` 循环；当你想要确保代码至少执行一次时，使用 `do-while` 循环。\n\n管理循环控制变量也很重要。未能更新控制循环的变量会导致死循环，从而使程序挂起。以下是一个简单的示例：\n\
  \n```cpp\nint i = 0;\n\nwhile (i < 10) {\n    std::cout << i << std::endl; // 忘记增加\
  \ i 会导致死循环！\n}\n```\n\n## 4.3 C++11+ 中的范围 for 循环\n\n随着 C++11 的引入，语言增加了范围 for 循环（range-based\
  \ loops），提供了一种更直观、更具表现力的方式来遍历集合（如数组、vector 和其他容器）中的元素。这一特性简化了语法，并允许代码更加简洁、易读，特别是在处理标准模板库（STL）时。\n\
  \n### 理解范围 for 循环\n\n范围 for 循环允许您遍历集合而无需手动管理索引或迭代器。其语法非常直观：\n\n```cpp\nfor (declaration\
  \ : collection) {\n    // 为每个元素执行的代码\n}\n```\n\n在此语法中，`declaration` 定义了循环变量的类型，`collection`\
  \ 是您想要遍历的容器。循环将为集合中的每个元素执行一次，并自动为您处理迭代。\n\n### 实际示例\n\n让我们考虑这样一个场景：我们有一个包含整数的 `std::vector`，并且想要打印每个值。以下是使用范围\
  \ for 循环实现的方法：\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n\
  \    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    for (int number : numbers)\
  \ {\n        std::cout << number << \" \";\n    }\n    std::cout << std::endl;\n\
  \    return 0;\n}\n```\n\n在这个示例中，`number` 在循环的每次迭代中都会获取 `numbers` vector 中每个元素的值。这种语法非常简洁，消除了对索引或迭代器的需求，使其更容易阅读和理解。\n\
  \n### 遍历不同类型的容器\n\n范围 for 循环不仅限于 vector；它们可以用于任何支持 `begin()` 和 `end()` 函数的容器。例如，你可以将它们用于数组、列表甚至提供了这些函数的用户自定义类型：\n\
  \n```cpp\n#include <iostream>\n#include <array>\n\nint main() {\n    std::array<int,\
  \ 5> arr = {10, 20, 30, 40, 50};\n    for (int element : arr) {\n        std::cout\
  \ << element << \" \";\n    }\n    std::cout << std::endl;\n    return 0;\n}\n```\n\
  \n在这种情况下，`std::array` 以与 vector 相同的方式进行遍历，展示了范围 for 循环在不同容器类型之间的灵活性。\n\n### 在范围\
  \ for 循环中修改元素\n\n如果您需要在遍历的同时修改集合的元素，可以在循环声明中使用引用。这允许您直接更改原始容器中的值：\n\n```cpp\n#include\
  \ <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> numbers =\
  \ {1, 2, 3, 4, 5};\n    for (int& number : numbers) {\n        number *= 2;  //\
  \ 每个元素翻倍\n    }\n    for (int number : numbers) {\n        std::cout << number <<\
  \ \" \";  // 输出: 2 4 6 8 10\n    }\n    std::cout << std::endl;\n    return 0;\n\
  }\n```\n\n在这里，使用 `int& number` 允许我们直接修改 `numbers` vector 的元素。这是一个强大的功能，因为它让您编写出既简洁高效的代码。\n\
  \n### 使用 const 的范围 for 循环\n\n如果您想遍历集合而不修改其元素，可以使用 `const` 引用。在处理大型数据结构时这是一个良好的做法，因为可以避免不必要的拷贝：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int>\
  \ numbers = {1, 2, 3, 4, 5};\n    for (const int& number : numbers) {\n        std::cout\
  \ << number << \" \";  // 只读访问\n    }\n    std::cout << std::endl;\n    return 0;\n\
  }\n```\n\n使用 `const int& number` 确保了循环变量无法修改元素，促进了安全的编码实践。\n\n### 遍历 Map\n\n范围 for\
  \ 循环也可以应用于关联容器，如 `std::map`。在这种情况下，您可以轻轻松地遍历键值对：\n\n```cpp\n#include <iostream>\n\
  #include <map>\n\nint main() {\n    std::map<std::string, int> ages = {{\"Alice\"\
  , 30}, {\"Bob\", 25}, {\"Charlie\", 35}};\n    for (const auto& pair : ages) {\n\
  \        std::cout << pair.first << \" is \" << pair.second << \" years old.\" <<\
  \ std::endl;\n    }\n    return 0;\n}\n```\n\n在这个示例中，我们使用 `const auto& pair` 来遍历\
  \ map，其中 `pair.first` 指向键，`pair.second` 指向值。\n\n\n\n\n\n在这个程序中，`multiply` 函数在 `main`\
  \ 函数在使用之前进行了声明。这种设计允许我们调用 `multiply(num1, num2)`，而无需担心函数的定义位置，只要提前包含了该原型即可。\n\n\
  ### 使用 `constexpr` 增强灵活性\n\n在现代 C++ 中（特别是 C++11 及更高版本），我们可以利用 `constexpr` 修饰符来定义可以在编译时进行求值的函数。这一特性对于执行简单计算的函数特别有用，允许编译器优化你代码的执行。\n\
  \n例如，我们可以如下所示定义一个 `constexpr` 函数来计算数字的平方：\n\n```cpp\nconstexpr int square(int x)\
  \ {\nreturn x * x;\n}\n```\n\n有了此函数，如果我们调用 `square(5)`，编译器将在编译期间计算结果，而不是在运行时，从而提高性能。\n\
  \n以下是你可能在程序中使用 `square` 函数的方式：\n\n```cpp\n#include <iostream>\n\nconstexpr int square(int\
  \ x) {\nreturn x * x;\n}\n\nint main() {\nconstexpr int result = square(5); // 在编译时计算\n\
  std::cout << \"The square of 5 is: \" << result << std::endl;\nreturn 0;\n}\n```\n\
  \n在这个示例中，`result`是在编译期间计算的，这意味着在运行时该计算不会产生开销。这是一项强大的特性，在处理大型数据集或对性能敏感的应用程序时变得非常有用。\n\
  \n### 处理默认参数\n\nC++ 函数的另一个强大方面是可以定义默认参数的能力。这意味着当调用一个函数时，如果调用者没有提供特定的参数，函数将使用一个默认值。这里有一个示例：\n\
  \n```cpp\n#include <iostream>\n\nint add(int a, int b = 10) {\nreturn a + b;\n}\n\
  \nint main() {\nstd::cout << \"Adding 5 and 10 (default): \" << add(5) << std::endl;\n\
  std::cout << \"Adding 5 and 15: \" << add(5, 15) << std::endl;\nreturn 0;\n}\n```\n\
  \n在这段代码中，`add` 函数为 `b` 有一个默认参数。如果只用一个参数调用 `add`，它会自动使用 `10` 作为 `b`。这一特性简化了某些参数经常具有常用值的场景下的函数调用。\n\
  \n## 5.2 默认函数与内联函数\n\n在我们继续探索 C++ 函数的过程中，我们遇到了两个强大的概念：默认函数和内联函数。这些特性不仅增强了你代码的灵活性，还允许通过优化来提高性能。让我们详细研究每个概念。\n\
  \n### 默认函数：简化函数调用\n\n默认函数（通常在默认参数的语境下提到）允许你为函数参数指定默认值。这意味着当在不提供所有参数的情况下调用函数时，函数将使用预定义的默认值。这一特性对于在你的代码中创建更符合用户习惯的界面特别有用。\n\
  \n例如，考虑一个计算矩形面积的函数。我们可以为宽度和高度定义默认值，允许用户根据意愿只指定一个维度：\n\n```cpp\n#include <iostream>\n\
  \ndouble rectangleArea(double width = 1.0, double height = 1.0) {\nreturn width\
  \ * height;\n}\n\nint main() {\nstd::cout << \"Area with default dimensions: \"\
  \ << rectangleArea() << std::endl;\nstd::cout << \"Area with specified width: \"\
  \ << rectangleArea(5.0) << std::endl;\nstd::cout << \"Area with specified width\
  \ and height: \" << rectangleArea(5.0, 3.0) << std::endl;\nreturn 0;\n}\n```\n\n\
  在这个示例中，`rectangleArea` 函数为 `width` 和 `height` 都有默认值。当不带参数调用时，函数计算面积为 `1.0 * 1.0`。如果只提供一个参数，另一个默认为\
  \ `1.0`；如果两个都指定了，函数将相应计算面积。这简化了函数调用并为用户提供了灵活性，使得你的函数更容易使用。\n\n### 内联函数：性能优化\n\n\
  内联函数是 C++ 中另一个可以帮助优化性能的关键特性。当函数被声明为 `inline` 时，编译器尝试在调用它的每个地方展开函数体，而不是执行传统的函数调用。这可以减少与函数调用相关的开销，特别是对于小型且频繁使用的函数。\n\
  \n以下是你可能如何定义一个计算数字平方的内联函数：\n\n```cpp\n#include <iostream>\n\ninline int square(int\
  \ x) {\nreturn x * x;\n}\n\nint main() {\nstd::cout << \"Square of 5: \" << square(5)\
  \ << std::endl;\nstd::cout << \"Square of 10: \" << square(10) << std::endl;\nreturn\
  \ 0;\n}\n```\n\n在这段代码中，`square` 函数被标记为 `inline`。当程序编译时，编译器会将对 `square` 的调用替换为函数的实际代码。这可以带来性能提升，特别是在紧凑循环或性能敏感的代码段中。\n\
  \n然而，审慎使用内联函数很重要。虽然它们可以提高性能，但过度内联会导致二进制文件体积增大并增加编译时间。因此，内联函数最适用于小型且频繁调用的函数。\n\n\
  ### 何时使用默认和内联函数\n\n理解何时使用默认函数和内联函数可以极大提高你的编程效率。当你想要为代码的用户提供灵活性和便利性时，默认函数是理想的。例如，如果你正在设计一个库或\
  \ API，默认参数可以在不牺牲功能的情况下简化函数的使用。\n\n另一方面，内联函数最适用于性能至关重要且被内联的函数简单简短的场景。一种常见的做法是在头文件中定义内联函数，因为这允许编译器在每个使用它的编译单元中访问它们的定义。\n\
  \n### 示例：结合默认和内联函数\n\n让我们结合这两个概念来创建一个更复杂的示例。假设我们正在设计一个简单的日志函数，它可以记录带有可选严重级别的消息：\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\ninline void logMessage(const\
  \ std::string& message, const std::string& severity = \"INFO\") {\nstd::cout <<\
  \ \"[\" << severity << \"] \" << message << std::endl;\n}\n\nint main() {\nlogMessage(\"\
  Application started.\"); // 使用默认严重级别\nlogMessage(\"An error occurred.\", \"ERROR\"\
  ); // 指定严重级别\nreturn 0;\n}\n```\n\n在这个示例中，`logMessage` 是一个带有可选严重级别记录消息的内联函数。如果调用者没有指定严重级别，它默认为\
  \ `\"INFO\"`。内联和默认参数的结合实现了简洁高效的日志功能。\n\n## 5.3 C++11–C++20 中的 Lambda 表达式\n\nLambda\
  \ 表达式引入于 C++11，代表了 C++ 的的一次进步，允许开发者编写更整洁、灵活的代码。这些匿名函数允许你在使用的地方直接定义函数，使你的代码更加简洁且富有表现力。通过探索\
  \ Lambda 表达式，我们将看到它们如何在 C++11、C++14、C++17 和 C++20 中演变，引入了增强其可用性的新特性。\n\n### 什么是\
  \ Lambda 表达式？\n\nLambda 表达式是在 C++ 中定义匿名函数对象（也称为函数对象）的方法。Lambda 表达式的基本语法如下：\n\n```\n\
  capture -> return_type {\n// 函数体\n}\n```\n\n- `capture`：在此处指定外部作用域中的哪些变量在 Lambda\
  \ 内部可用。\n- `parameters`：类似于普通函数参数，你定义输入参数的类型和名称。\n- `return_type`：这是可选的。如果省略，编译器会自动推导出返回类型。\n\
  - `body`：这包含 Lambda 执行的实际代码。\n\n\n\n\n\n# 示例：简单的 Lambda 表达式\n\n让我们从一个直观的示例开始，展示\
  \ Lambda 表达式的核心元素。以下是你如何使用 Lambda 来相两个数字的：\n\n```cpp\n#include <iostream>\n\nint\
  \ main() {\n    auto add = [](int a, int b) {\n        return a + b;\n    };\n \
  \   std::cout << \"Sum: \" << add(3, 5) << std::endl; // 输出: Sum: 8\n    return\
  \ 0;\n}\n```\n\n在这个示例中，我们定义了一个接受两个整数参数（`a` 和 `b`）的 lambda，并返回它们的和。我们将此 lambda 赋值给变量\
  \ `add`，然后就可以像调用普通函数一样调用它。这展示了 Lambda 表达式为函数定义带来的简洁性和清晰性。\n\n## 捕获变量\n\nLambda 表达式最强大的功能之一是可以从周围作用域中捕获变量。这允许你在\
  \ lambda 内部直接访问和操作局部变量。捕获变量有几种方式：\n\n1. **值传递 (By Value)**：将变量的值复制到 lambda 中。\n\
  2. **按引用传递 (By Reference)**：直接访问变量而不进行复制。\n\n这里是一个展示这两种捕获方式的示例：\n\n```cpp\n#include\
  \ <iostream>\n\nint main() {\n    int x = 10;\n    int y = 20;\n    auto addByValue\
  \ = x {\n        return x + b; // 按值捕获 x\n    };\n    auto addByReference = &y {\n\
  \        return y + b; // 按引用捕获 y\n    };\n    std::cout << \"Add by value: \" <<\
  \ addByValue(5) << std::endl; // 输出: 15\n    std::cout << \"Add by reference: \"\
  \ << addByReference(5) << std::endl; // 输出: 25\n    y = 30; // 在 lambda 定义后更改 y\n\
  \    std::cout << \"Add by reference after change: \" << addByReference(5) << std::endl;\
  \ // 输出: 35\n    return 0;\n}\n```\n\n在这段代码中，`addByValue` 按值捕获 `x`，这意味着在 lambda\
  \ 定义之后对 `x` 的任何更改都不会影响它的行为。相反，`addByReference` 按引用捕获 `y`，允许它反映在 lambda 创建后对 `y`\
  \ 进行的任何修改。\n\n## 标准算法中的 Lambda 表达式\n\nLambda 表达式与标准模板库 (STL) 算法配合使用时非常出色。这允许你编写简洁、可读的代码，以优雅的方式执行复杂操作。例如，让我们使用\
  \ lambda 对一个整数向量进行排序：\n\n```cpp\n#include <iostream>\n#include <vector>\n#include\
  \ <algorithm>\n\nint main() {\n    std::vector<int> numbers = {5, 3, 8, 1, 2};\n\
  \    std::sort(numbers.begin(), numbers.end(), [](int a, int b) {\n        return\
  \ a < b; // 升序排序\n    });\n    std::cout << \"Sorted numbers: \";\n    for (int\
  \ num : numbers) {\n        std::cout << num << \" \";\n    }\n    std::cout <<\
  \ std::endl;\n    return 0;\n}\n```\n\n在这里，lambda 表达式被用作 `std::sort` 函数的自定义比较器。这种灵活性允许你直接在需要的地方定义排序标准，减少了对单独函数定义的需求。\n\
  \n## C++14 及更高版本的高级特性\n\n随着 C++14 和 C++17 的引入，lambda 表达式获得了额外的特性，进一步增强了它们的易用性。\n\
  \n### C++14 增强\n\n* **泛型 Lambda (Generic Lambdas)**：你现在可以使用 `auto` 关键字定义接受任何类型参数的\
  \ lambda。\n\n```cpp\n#include <iostream>\n\nint main() {\n    auto genericLambda\
  \ = [](auto a, auto b) {\n        return a + b;\n    };\n    std::cout << \"Generic\
  \ sum: \" << genericLambda(3, 4) << std::endl; // 输出: 7\n    std::cout << \"Generic\
  \ sum (double): \" << genericLambda(3.5, 2.5) << std::endl; // 输出: 6.0\n    return\
  \ 0;\n}\n```\n\n### C++17 增强\n\n* **带有 constexpr 的 Lambda 表达式**：你现在可以定义 `constexpr`\
  \ lambda，使其能够在编译时进行求值。\n\n```cpp\n#include <iostream>\nconstexpr auto square = [](int\
  \ x) {\n    return x * x;\n};\n\nint main() {\n    constexpr int result = square(5);\
  \ // 在编译时计算\n    std::cout << \"Square of 5: \" << result << std::endl; // 输出: 25\n\
  \    return 0;\n}\n```\n\n## C++20：带有模板参数的 Lambdas\n\nC++20 引入了更强大的 lambda 特性，例如可以直接获取模板参数的\
  \ lambda。这使得代码更加灵活且可复用性：\n\n```cpp\n#include <iostream>\nauto add = []<typename\
  \ T>(T a, T b) {\n    return a + b;\n};\n\nint main() {\n    std::cout << \"Add\
  \ integers: \" << add(3, 5) << std::endl; // 输出: 8\n    std::cout << \"Add doubles:\
  \ \" << add(3.5, 2.5) << std::endl; // 输出: 6.0\n    return 0;\n}\n```\n\n在这个示例中，lambda\
  \ 使用了模板参数 `T`，这允许更灵活和可复用的代码。\n\n## 5.4 Lambda 中的变量捕获\n\nLambda 表达式最吸引人的特性之一是可以从周围的作用域中捕获变量。这种能力增强了在\
  \ C++ 中使用 lambda 的。\n\n### 理解捕获模式\n\n当你定义 lambda 时，可以指定如何捕获作用域中的变量。有几种捕获模式可以使用：\n\
  \n1. **按值传递 (By Value)**：lambda 创建了变量的副本。\n2. **按引用传递 (By Reference)**：lambda 直接访问变量的变量。\n\
  3. **默认捕获 (Default Capture)**：你可以使用 `[]` 或 `[&]`。\n\n### 基本按值捕获\n\n让我们从按值捕获的示例开始。在这种情况下，lambda\
  \ 使用的是定义时的变量状态。\n\n```cpp\n#include <iostream>\n\nint main() {\n    int a = 10;\n\
  \    int b = 20;\n    auto add = [a, b]() {\n        return a + b;\n    };\n   \
  \ std::cout << \"Sum: \" << add() << std::endl; // 输出: 30\n    // 在 lambda 之外更改\
  \ a 和 b\n    a = 15;\n    b = 25;\n    std::cout << \"Sum: \" << add() << std::endl;\
  \ // 输出: 30\n    return 0;\n}\n```\n\n在这个示例中，`a` 和 `b` 是按值捕获的。即使在 `main` 中更改了 `a`\
  \ 和 `b`，结果保持不变。\n\n### 按引用捕获\n\n现在让我们探索按引用捕获。这允许 lambda 修改原始变量。\n\n```cpp\n#include\
  \ <iostream>\n\nint main() {\n    int x = 5;\n    int y = 10;\n    auto increment\
  \ = [&x, &y]() {\n        x++; // 修改 x\n        y++; // 修改 y\n    };\n    increment();\
  \ // 增加 x 和 y\n    std::cout << \"x: \" << x << \", y: \" << y << std::endl; //\
  \ 输出: x: 6, y: 11\n    return 0;\n}\n```\n\n在这个示例中， lambda 按引用捕获了 `x` 和 `y`。当我们调用\
  \ `increment()` 时，它直接修改了原始变量。结果是，更改反映在了输出中。\n\n### 默认捕获模式\n\n你也可以为变量指定默认捕获模式，以便代码更简洁。例如，如果你想按引用捕获所有变量，但对某个变量按值捕获，可以这样操作：\n\
  \n```cpp\n#include <iostream>\n\nint main() {\n    int count = 0;\n    int limit\
  \ = 10;\n    auto lambda = [&count, limit]() {\n        count++;\n        return\
  \ count < limit; // 按引用捕获 count，按值捕获 limit\n    };\n    while (lambda()) {\n   \
  \     std::cout << \"Count: \" << count << std::endl; // 输出: Count: 1, 2, ..., 9\n\
  \    }\n    return 0;\n}\n```\n\n在这个示例中，`count` 是按引用捕获的，允许 lambda 修改它，而 `limit`\
  \ 是按值捕获的，这意味着它在循环期间保持不变。你也可以这样使用默认捕获模式：\n\n```cpp\n#include <iostream>\n\nint main()\
  \ {\n    int a = 1;\n    int b = 2;\n    auto f = [=]() mutable { // 按值捕获所有\n  \
  \      a++; // 修改 a\n    };\n}\n```\n\n\n\n\n\n```cpp\nreturn a + b; // b remains\
  \ unchanged\n\n};\n\nstd::cout << \"Result: \" << f() << std::endl; // Output: Result:\
  \ 4\n\nstd::cout << \"Original a: \" << a << std::endl; // Output: Original a: 1\n\
  \nreturn  0;\n\n}\n```\n\n在这种情况下，`a` 和 `b` 被按值捕获，我们可以使用 `mutable` 关键字允许在 lambda\
  \ 内部修改 `a`。然而，原始的 `a` 在 lambda 外部保持不变。\n\n### 捕获此指针\n\n在成员函数中，你可以捕获 `this` 指针来访问类的成员变量和函数：\n\
  \n```cpp\n#include <iostream>\n\nclass Counter {\npublic:\n    Counter() : count(0)\
  \ {}\n\n    void increment() {\n        auto lambda = [this]() {\n            count++;\n\
  \            std::cout << \"Count: \" << count << std::endl;\n        };\n     \
  \   lambda();\n    }\n\nprivate:\n    int count;\n};\n\nint main() {\n    Counter\
  \ c;\n    c.increment(); // Output: Count: 1\n    c.increment(); // Output: Count:\
  \ 2\n    return 0;\n}\n```\n\n在这个示例中，lambda 捕获了 `this`，允许它直接访问并修改 `count` 成员变量。\n\
  \n# 第 6 章 – 使用数组、字符串和向量\n\n## 6.1 原始数组 vs std::array\n\n当你开始用 C++ 编程时，你遇到的第一个数据结构之一就是数组。数组是基础集合，允许你在连续的内存块中存储多个相同类型的项。然而，随着编程实践的演进，我们用于管理这些集合的工具也同样演进。\n\
  \n### 原始数组的基础\n\n原始数组是持有固定大小元素序列的简单机制。当你声明一个原始数组时，你指明了元素的类型并指定了它可以包含的元素数量。例如：\n\n\
  ```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n```\n\n在这个示例中，我们声明了一个名为 `numbers` 的数组，它可以容纳五个整数。数组被初始化为值\
  \ 1 到 5。\n\n虽然原始数组简单直观且高效，但它们也有几个缺点。最显著的限制之一是原始数组的大小必须在编译时已知。一旦数组被定义，其大小就无法更改。如果你的程序需求发生演变（例如需要容纳比最初计划更多的元素），这种僵性可能会导致问题。\n\
  \n原始数组的另一个关键问题是缺乏内置的安全特性。如果你尝试访问数组边界之外的元素，其行为是未定义的。例如：\n\n```cpp\nstd::cout << numbers[5];\
  \ // 未定义行为: 越界访问\n```\n\n这可能导致崩溃或难以诊断的细微错误（bug）。缺乏边界检查意味着你在索引中的任何错误都可能导致访问程序并不拥有的内存。\n\
  \n### 引入 std::array\n\n为了缓解原始数组的局限性，C++11 引入了 `std::array`，这是一种封装了原始数组并提供更稳健接口的模板类。声明\
  \ `std::array` 的语法与原始数组的相似非常相似，但它增加了许多实用的功能：\n\n```cpp\n#include <array>\nstd::array<int,\
  \ 5> numbers = {1, 2, 3, 4, 5};\n```\n\n在此次声明中，`std::array` 接受两个模板参数：元素的类型和数组的大小。这种封装允许\
  \ `std::array` 行为上更像 C++ 中的一种一等数据类型。\n\n`std::array` 的突出特性之一是它提供了获取数组大小以及安全访问其元素的方法。例如，你可以使用\
  \ `size()` 方法获取数组的大小：\n\n```cpp\nstd::cout << \"Size of numbers: \" << numbers.size()\
  \ << std::endl; // 输出: 5\n```\n\n这种方法既直观又安全，允许你避免在代码的多个地方硬编码数组的大小。\n\n### 安全性和边界检查\n\
  \n使用 `std::array` 的一个显著优势是它在访问元素时提供边界检查的能力。与其使用下标运算符，不如使用 `at()` 方法，当你尝试访问越界索引时，它会抛出一个异常：\n\
  \n```cpp\ntry {\n    std::cout << numbers.at(5) << std::endl; // 抛出 std::out_of_range\n\
  } catch (const std::out_of_range& e) {\n    std::cerr << \"Index out of range: \"\
  \ << e.what() << std::endl;\n}\n```\n\n这一安全特性帮助你在开发过程早期捕获错误，减少应用程序中出现未定义行为的概率。相比之下，使用原始数组时，你没有任何此类错误的保护措施，这使得调试变得非常有挑战性。\n\
  \n### 性能考虑\n\n在考虑性能时，原始数组和 `std::array` 都非常相似，因为 `std::array` 本质上只是原始数组的一个薄层封装。这意味着你可以使用\
  \ `std::array` 而不会产生显著开销。\n\n然而，`std::array` 带有额外的功能，可以提高代码的清晰性和维护性。例如，通过引用将 `std::array`\
  \ 传递给函数可以保留其大小信息，使其更容易处理。这里有一个计算存储在 `std::array` 中的成绩平均值的函数示例：\n\n```cpp\ndouble\
  \ calculateAverage(const std::array<int, 5>& grades) {\n    int total = 0;\n   \
  \ for (const auto& grade : grades) {\n        total += grade;\n    }\n    return\
  \ static_cast<double>(total) / grades.size();\n}\n```\n\n这个示例展示了函数如何计算存储在 `std::array`\
  \ 中的成绩平均值。\n\n### 实际应用\n\n让我们考虑一个实际场景，你正在开发一个管理学生成绩的程序。使用 `std::array`，你可以高效地处理这些数据。这是一个计算平均值并排序成绩的示例：\n\
  \n```cpp\n#include <iostream>\n#include <array>\n#include <algorithm>\n\nint main()\
  \ {\n    std::array<int, 5> grades = {90, 85, 78, 92, 88};\n    // 计算平均值\n    double\
  \ average = calculateAverage(grades);\n    std::cout << \"Average grade: \" << average\
  \ << std::endl;\n    // 对成绩排序\n    std::sort(grades.begin(), grades.end());\n  \
  \  std::cout << \"Sorted grades: \";\n    for (const auto& grade : grades) {\n \
  \       std::cout << grade << \" \";\n    }\n    std::cout << std::endl;\n    return\
  \ 0;\n}\n```\n\n在这个示例中，`calculateAverage` 函数使用 `std::array` 计算平均分，同时确保了类型安全。程序还使用标准库中的\
  \ `std::sort` 算法对成绩进行排序，它与 `std::array` 无缝衔接。这展示了现代 C++ 特性的便利性和高效性，允许你编写表达性代码。\n\
  \n## 6.2 使用 std::string 处理字符串\n\n在 C++ 编程时，处理文本和字符数据是一项你会经常遇到的常见任务。现代 C++ 中管理字符串的最强大且方便的工具之一是引入自标准库的\
  \ `std::string` 类。与原始字符数组不同，`std::string` 为字符串操作提供了一个稳健、灵活且易于使用的接口。\n\n### std::string\
  \ 的基础\n\n从本质上说，`std::string` 是表示字符序列的类。它抽象了许多与原始字符数组相关的复杂度，例如内存分配、大小管理和字符串操作。要声明\
  \ `std::string`，你只需要包含相关的头文件并创建一个实例：\n\n```cpp\n#include <string>\n#include <iostream>\n\
  std::string greeting = \"Hello, World!\";\n```\n\n这一行代码创建了一个初始化为 \"Hello, World!\"\
  \ 的字符串对象。使用 `std::string` 的直接好处之一是它可以自动管理内存。当你给 `std::string` 赋值新值时，它会在后台处理必要的内存分配和释放。这消除了许多与原始字符数组相关的常见陷阱，例如缓冲区溢出和内存泄漏。\n\
  \n### 字符串操作\n\n\n\n\n\n`std::string` 最具吸引力的特性之一是其丰富的成员函数，这些函数简化了字符串操作。例如，你可以轻松地使用\
  \ `+` 运算符拼接字符串：\n\n```cpp\nstd::string name = \"Alice\";\nstd::string welcomeMessage\
  \ = greeting + \" \" + name + \"!\";\nstd::cout << welcomeMessage << std::endl;\
  \ // 输出: Hello, World! Alice!\n```\n\n在这个示例中，我们毫不费力地拼接了多个字符串，展示了 `std::string` 如何让代码变得清晰简洁。\n\
  \n另一个实用操作是查找子字符串。你可以使用 `find` 方法检查子字符串是否存在于字符串中：\n\n```cpp\nsize_t position = greeting.find(\"\
  World\");\nif (position != std::string::npos) {\n    std::cout << \"Found 'World'\
  \ at position: \" << position << std::endl;\n}\n```\n\n在这里，如果找到了子字符串，`find` 会返回其起始索引；如果没有找到，则返回\
  \ `std::string::npos`为搜索字符串提供了一种安全的方法。\n\n## 修改字符串\n\n`std::string` 还提供了修改现有字符串的方法。例如，你可以使用\
  \ `replace` 方法替换字符串的一部分：\n\n```cpp\nstd::string modifiedGreeting = greeting;\nmodifiedGreeting.replace(7,\
  \ 5, \"C++\");\nstd::cout << modifiedGreeting << std::endl; // 输出: Hello, C++!\n\
  ```\n\n在这个示例中，我们将子字符串 \"World\" 替换为 \"C++\"，展示了在无需担心底层表示的情况下修改字符串是多么简单。\n\n你还可以使用\
  \ `append` 方法或简单地使用 `+=` 运算符向字符串后追加内容：\n\n```cpp\nstd::string additional = \" Have\
  \ a great day!\";\nmodifiedGreeting += additional;\nstd::cout << modifiedGreeting\
  \ << std::endl; // 输出: Hello, C++! Have a great day!\n```\n\n## 字符串比较\n\n使用 `std::string`\
  \ 字符串非常简单。你可以使用 `==`、`!=`、`<`、`>` 等关系运算符来按字典顺序比较字符串：\n\n```cpp\nstd::string str1\
  \ = \"apple\";\nstd::string str2 = \"banana\";\nif (str1 < str2) {\n    std::cout\
  \ << str1 << \" comes before \" << str2 << std::endl;\n}\n```\n\n这种比较能力使得对字符串集合进行排序或搜索变得简单。\n\
  \n## 转换与其他工具\n\n`std::string` 还提供了类型之间转换的工具。例如，如果你想将数字转换为字符串，可以使用 `std::to_string`：\n\
  \n```cpp\nint age = 25;\nstd::string ageString = std::to_string(age);\nstd::cout\
  \ << \"Age: \" << ageString << std::endl; // 输出: Age: 25\n```\n\n相反，如果你需要将字符串转换回数字，可以使用\
  \ `std::stoi` 等函数：\n\n```cpp\nstd::string numberString = \"42\";\nint number = std::stoi(numberString);\n\
  std::cout << \"Number: \" << number << std::endl; // 输出: Number: 42\n```\n\n这些转换函数使得无缝处理用户输入和数据处理变得简单。\n\
  \n##实际应用\n\n为了说明 `std::string` 的实际用途，让我们考虑一个管理用户输入的简单控制台程序。在程序中，我们将提示用户输入姓名和年龄，然后生成一条自定义的问候消息。它的样子如下：\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
  \ name;\n    int age;\n    std::cout << \"Enter your name: \";\n    std::getline(std::cin,\
  \ name); // 读取整行，包括空格\n    std::cout << \"Enter your age: \";\n    std::cin >> age;\n\
  \    std::string greeting = \"Hello, \" + name + \"! You are \" + std::to_string(age)\
  \ + \" years old.\";\n    std::cout << greeting << std::endl;\n    return 0;\n}\n\
  ```\n\n在这个示例中，我们使用 `std::getline` 读取用户的姓名（允许包含空格），然后构造一条个性化的问候消息。这里 `std::string`\
  \ 的使用简化了输入处理和字符串操作，使代码更加直观且易于维护。\n\n## 6.3 高效使用 std::vector\n\n在现代 C++ 中，你可以使用的最强大且多功能的数据结构之一是\
  \ `std::vector`。`std::vector` 定义在标准库，是一个动态数组，可以根据需要增长或缩小大小，为管理数据集合提供了方便的方法。\n\n\
  ### 理解 std::vector\n\n`std::vector` 是一种序列容器，在动态数组中存储元素，这意味着它可以随着元素的添加或删除而自动分配和释放内存。要使用\
  \ `std::vector`，你首先需要包含相关的头文件：\n\n```cpp\n#include <vector>\n#include <iostream>\n\
  ```\n\n你可以通过指定类型作为模板参数来声明特定数据类型的 vector。例如，要创建一个整数 vector，你可以写道：\n\n```cpp\nstd::vector<int>\
  \ numbers;\n```\n\n此声明创建了一个可以容纳整数的空 vector。使用 `std::vector` 的主要优点之一是它可以自动管理内存。你不需要担心分配或释放内存，因为\
  \ vector 会为你处理这些。\n\n### 添加和删除元素\n\nvector 最常用的操作之一是添加和删除元素。你可以使用 `push_back` 方法向\
  \ vector 中添加元素：\n\n```cpp\nnumbers.push_back(10);\nnumbers.push_back(20);\nnumbers.push_back(30);\n\
  ```\n\n如果你想从 vector 中移除元素，可以使用 `pop_back` 方法：\n\n```cpp\nnumbers.pop_back(); //\
  \ 移除元素 30\n```\n\n### 访问元素\n\n访问 vector 中的元素非常简单。你可以使用下标 `[]` 或 `at()` 方法。下标不进行边界检查，而\
  \ `at()` 会在索引超出范围时抛出异常：\n\n```cpp\nstd::cout << \"First element: \" << numbers[0]\
  \ << std::endl; // 输出: 10\ntry {\n    std::cout << \"Element at 2: \" << numbers.at(2)\
  \ << std::endl; // 如果索引无效会报错\n} catch (const std::out_of_range& e) {\n    std::cerr\
  \ << \"Index of range: \" << e.what() << std::endl;\n}\n```\n\n### 遍历 vector\n\n\
  遍历 vector 非常简单，可以使用范围循环或传统的 for 循环。这里是范围循环的示例：\n\n```cpp\nfor (const auto& num :\
  \ numbers) {\n    std::cout << num << \" \";\n}\nstd::cout << std::endl; // 输出:\
  \ 10 20\n```\n\n使用 `const auto&` 允许你在遍历时不复制元素，这对于大型对象非常高效。\n\n### 调整大小与容量\n\n`std::vector`\
  \ 的强大功能之一是它可以动态调整大小。你可以使用 `resize` 方法更改 vector 的大小：\n\n```cpp\nnumbers.resize(5,\
  \ 0); // 调整为 5 个元素，新元素初始化为 0\n```\n\n在此操作之后，如果 vector 最初包含两个元素，现在它将有五个，额外的三个初始化为零。vector\
  \ 的容量是为元素分配的空间，可能大于当前大小。你可以使用以下代码检查当前大小和容量：\n\n```cpp\nstd::cout << \"Size: \" <<\
  \ numbers.size() << \", Capacity: \" << numbers.capacity() << std::endl;\n```\n\n\
  ## std::vector 的最佳实践\n\n1. **尽可能预留空间**：如果你知道要向 vector 插入多少元素，考虑使用 `reserve` 方法提前分配内存。可以通过减少内存分配次数来优化性能。\n\
  \n```cpp\nnumbers.reserve(100); // 为 100 个整数预留空间\n```\n\n2. **使用嵌入方法**：当向 vector\
  \ 添加复杂对象时，考虑使用 `emplace_back` 代替 `push_back`。它原地构造对象，并通过避免不必要的拷贝来提高性能。\n\n```cpp\n\
  struct Point {\n    int x, y;\n    Point(int x, int y) : x(x), y(y) {}\n};\nstd::vector<Point>\
  \ points;\npoints.emplace_back(10, 20);\n```\n\n\n\n\n\n```cpp\nstd::vector<Point>\
  \ points;\n\npoints.emplace_back(1, 2); // 直接在 vector 中构造 Point(1, 2)\n```\n\n3.\
  \ 避免频繁调整大小：反复向需要调整大小的 `vector` 中添加元素会导致性能开销。通过预留空间（`reserve`）或使用 `resize`，你可以最大限地减少重新分配的次数。\n\
  \n4. 注意迭代器：修改 `vector`（添加或删除元素）可能会使迭代器失效。如果你在迭代过程中修改 `vector`，在循环中使用 `iterators`（迭代器）时要小心。\n\
  \n5. 结合算法使用 `std::vector`：C++ 标准库提供了许多与 `std::vector` 无缝衔接的算法。使用如 `std::sort`、`std::find`\
  \ 等函数来高效地执行操作。\n\n### 现实示例\n\n让我们考虑一个使用 `std::vector` 管理学生成绩列表的实际示例。在这个程序中，我们将从用户读取成绩，计算平均分并显示排序后的成绩。\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint  main()\
  \ {\n    std::vector<int> grades;\n    int grade;\n    std::cout << \"请输入成绩（输入 -1\
  \ 停止）：\" << std::endl;\n    while (true) {\n        std::cin >> grade;\n       \
  \ if (grade == -1) {\n            break; // 遇到 -1 停止输入\n        }\n        grades.push_back(grade);\n\
  \    }\n    // 计算平均分\n    double total = 0;\n    for (const  auto& g : grades) {\n\
  \        total += g;\n    }\n    double average = (grades.empty()) ? 0 : total /\
  \ grades.size();\n    std::cout << \"平均分: \" << average << std::endl;\n    // 排序并显示成绩\n\
  \    std::sort(grades.begin(), grades.end());\n    std::cout << \"排序后的成绩: \";\n\
  \    for (const  auto& g : grades) {\n        std::cout << g << \" \";\n    }\n\
  \    std::cout << std::endl;\n    return  0;\n}\n```\n\n在这个示例中，我们使用 `vector` 来存储用户输入的成绩。我们计算平均分并对成绩进行排序以便显示。这演示了\
  \ `std::vector` 如何简化动态数据集合的管理。\n\n# 第 7 章：指针、引用与内存管理\n\n## 7.1 原始指针 vs 智能指针\n\n\
  在 C++ 领域中，`pointers`（指针）是你可以使用的最强大的工具之一。它们允许你直接操作内存，实现动态内存分配并创建复杂的数据结构。然而，这种力量也伴随着妥善管理这些内存的责任。\n\
  \n### 理解原始指针\n\n原始指针是 C++ 中处理内存的传统方式。它们是存储另一个变量内存地址的变量。例如，当使用 `new` 关键字为对象动态分配内存时，你将得到一个指向该内存的原始指针。\n\
  \n```cpp\nint* rawPtr = new  int(42); // 动态分配一个整数并赋值给 rawPtr\nstd::cout << *rawPtr\
  \ << std::endl; // 输出: 42\ndelete rawPtr; // 释放已分配内存\n```\n\n这个示例展示了原始指针的基本用法。你为整数分配了内存，使用它，然后释放该内存。然而，这种简单性隐藏了许多复杂性和危险。程序员必须记住使用\
  \ `delete` 释放内存以避免内存泄漏，内存泄漏发生在内存被分配但从未被释放的情况下。此外，如果一个指针被删除后又被访问，将会导致 `dangling pointer`（悬挂指针），这可能引发未定义的行为。\n\
  \n手动管理内存很容易导致 bug，特别是在较大的应用程序中。这正是智能指针大显身手的地方。\n\n### 介绍智能指针\n\n智能指针是用于自动管理内存的类。它们封装了原始指针并提供了许多优势，包括自动内存管理、提高安全性和便利性。让我们探索现代\
  \ C++ 中三种主要的智能指针。\n\n#### 1. `std::unique_ptr`\n\n`std::unique_ptr` 代表对资源的独占所有权。这意味着在任何给定时刻，只能有一个\
  \ `std::unique_ptr` 指向特定的资源。这种独占所有权模型使得 `std::unique_ptr` 成为管理不应共享资源的极佳选择。\n\n这是一个使用\
  \ `std::unique_ptr` 的实际示例：\n\n```cpp\n#include <iostream>\n#include <memory>\n\n\
  void  uniquePointerExample() {\n    std::unique_ptr<int> uniquePtr(new  int(42));\
  \ // 创建一个 unique_ptr\n    std::cout << *uniquePtr << std::endl; // 输出: 42\n    //\
  \ 不需要 delete；当 uniquePtr 离开作用域时，内存会自动释放\n} // uniquePtr 在此处销毁，内存自动释放\n```\n\n在这种情况下，当\
  \ `uniquePtr` 离开作用域时，它的析构函数会被调用，内存会自动释放。你永远不需要担心忘记内存，这是使用原始指针时 bug 的常见来源。\n\n如果你需要转移\
  \ `std::unique_ptr` 的所有权，可以使用 `std::move`：\n\n```cpp\nstd::unique_ptr<int> ptr1(new\
  \  int(42));\nstd::unique_ptr<int> ptr2 = std::move(ptr1); // ptr1 现在是 nullptr\n\
  ```\n\n这种所有权的转移是安全的，并确保原始指针 (`ptr1`) 不再指向分配的内存，从而防止双重删除。\n\n#### 2. `std::shared_ptr`\n\
  \n`std::shared_ptr` 允许多个指针共享同一个资源的所有权。这种特性对于当你希望在程序的多个部分之间共享数据而不必担心谁负责删除它时非常有用。在底层，`std::shared_ptr`\
  \ 维护一个引用计数，记录有多少个 `shared_ptr` 实例指向它。这里是你可以使用 `std::shared_ptr`：\n\n```cpp\n#include\
  \ <iostream>\n#include <memory>\n\nvoid  sharedPointerExample() {\n    std::shared_ptr<int>\
  \ sharedPtr1(new  int(42)); // 创建 shared_ptr\n    std::shared_ptr<int> sharedPtr2\
  \ = sharedPtr1; // 共享所有\n    std::cout << *sharedPtr1 << \", \" << *sharedPtr2 <<\
  \ std::endl; // 输出: 42, 42\n} // 当最后一个 shared_ptr 离开作用域时内存释放\n```\n\n在这个示例中，`sharedPtr1`\
  \ 和 `sharedPtr2` 指向同一个整数。只要至少一个 `std::shared_ptr` 存在，内存就不会被释放。当最后一个引用被销毁时，内存会被释放。这种自动引用计数简化了内存管理。然而，必须注意潜在的循环引用。如果两个\
  \ `shared_ptr` 实例相互引用，就会产生内存泄漏。为了解决这个问题，我们使用 `std::weak_ptr`。\n\n#### 3. `std::weak_ptr`\n\
  \n`std::weak_ptr` 作为 `std::shared_ptr` 的伴侣。它允许你引用由 `std::shared_ptr` 管理的对象，而不影响其引用计数。这对于打破循环依赖特别有用。考虑以下示例：\n\
  \n```cpp\n#include <iostream>\n#include <memory>\n\nstruct  Node {\n    int value;\n\
  \    std::shared_ptr<Node> next;\n    Node(int v) : value(v), next(nullptr) {}\n\
  };\n\nvoid  weakPointerExample() {\n    std::shared_ptr<Node> first = std::make_shared<Node>(1);\n\
  \    std::shared_ptr<Node> second = std::make_shared<Node>(2);\n    first->next\
  \ = second;\n    second->next = first; // 循环引用\n\n    std::weak_ptr<Node> weakPtr\
  \ = first; // 不增加引用计数\n\n    if (auto sharedPtr = weakPtr.lock()) {\n        std::cout\
  \ << \"弱指针是有效的: \" << sharedPtr->value << std::endl;\n    } else {\n        std::cout\
  \ << \"弱指针已过期。\" << std::endl;\n    }\n}\n```\n\n在这个示例中，`first` 和 `second` 节点相互引用，创建了循环依赖。通过使用\
  \ `std::weak_ptr`，我们可以安全地引用 `first`，而不会阻止它在最后一个 `std::shared_ptr` 离开作用域时被释放。\n\n\
  ### 选择原始指针还是智能指针\n\n在原始指针和智能指针之间做出选择时，请考虑：\n\n- 当你需要手动内存内存时，使用原始指针，例如与 C 库接口或实现自定义的内存分配策略。然而，请务必小心并确保你负责任地管理内存。\n\
  \n\n\n\n\n- 当你需要资源的独占所有权时，使用 `std::unique_ptr`。这对于管理不应共享的资源特别有用，例如工厂函数中或管理 `class`\
  \ 中对象的生命周期。\n- 当你需要在程序的多个部分之间共享所有权时，使用 `std::shared_ptr`。这在复杂的数据结构中很常见，多个实体需要引用同一个资源。\n\
  - 当多个 `std::shared_ptr` 实例相互引用时，使用 `std::weak_ptr` 来避免循环引用。\n\n## 7.3 避免内存泄漏的最佳实践\n\
  \n内存管理是 C++ 编程的一个关键方面，避免内存泄漏对于确保应用程序的效率和可靠性至关重要。当分配的内存没有被正确释放时就会发生内存泄漏，导致内存占用逐渐增加，最终可能导致程序运行缓慢或崩溃。\n\
  \n### 1. 优先使用智能指针而非指针\n\n避免内存泄漏的最有效方法之一是使用智能指针，例如 `std::unique_ptr` 和 `std::shared_ptr`。智能指针会自动管理它们拥有的内存，确保在不再需要时释放它。这减轻了程序员忘记释放内存的负担，显著降低了泄漏的概率。\n\
  \n例如：\n\n```cpp\n#include <memory>\n#include <iostream>\n\nvoid smartPointerExample()\
  \ {\n  std::unique_ptr<int> ptr = std::make_unique<int>(42); // 自动管理的内存\n  std::cout\
  \ << *ptr << std::endl; // 输出: 42\n} // 内存在这里自动释放\n```\n\n使用 `std::make_unique`\
  \ 不仅更安全，而且更优，因为它消除了与手动 `new` 和 `delete` 相关的内存泄漏风险。\n\n### 2. 使用 RAII（资源获取初始化）\n\n\
  RAII 是一种编程范式，确保资源与对象的生命周期绑定。通过将资源管理封装在 `classes` 中，你可以确保资源在对象离开作用域时自动释放。智能指针是 RAII\
  \ 作用的完美示例。\n\n考虑一个管理资源的 `class`：\n\n```cpp\nclass Resource {\npublic:\n  Resource()\
  \ { /* 获取资源 */ }\n  ~Resource() { /* 释放资源 */ }\n};\n\nvoid raaiExample() {\n  Resource\
  \ res; // 获取资源\n  // 对 res 进行一些操作\n} // 资源在这里自动释放\n```\n\n在这个示例中，`Resource` 的析构函数确保了在对象离开作用域时释放资源，防止了内存泄漏。\n\
  \n### 3. 尽可能避免手动内存管理\n\n虽然在某些场景下需要手动内存管理，但通常最好的做法是避免它。依赖原始指针和动态内存分配会增加泄漏风险，特别是在复杂的应用程序中。相反，在可行的情况下，优先使用栈分配，因为栈上分配的对象在离开作用域时会自动清理。\n\
  \n例如：\n\n```cpp\nvoid stackAllocationExample() {\n  int localVar = 42; // 栈分配\n\
  \  std::cout << localVar << std::endl; // 输出: 42\n} // 内存在这里自动释放\n```\n\n### 4.\
  \ 谨慎处理所有权语义\n\n在应用程序中传递指针时，要明确所有权语义。使用智能指针来指示所有权并避免混淆。编写代码注释以明确谁负责管理内存。\n\n例如，如果一个函数接收\
  \ `std::unique_ptr`，则表示该函数将获得资源的所有权：\n\n```cpp\nvoid process(std::unique_ptr<int>\
  \ data) {\n  // 处理数据\n} // 当 data 作用域时内存将释放\n```\n\n### 5. 使用 `std::weak_ptr` 防止循环引用\n\
  \n使用 `std::shared_ptr` 时，要注意循环引用。如果两个或多个 `std::shared_ptr` 实例相互引用，它们会产生内存泄漏，因为它们的引用计数永远不会变为零。为了打破这些循环，请对其中一个引用使用\
  \ `std::weak_ptr`。\n\n这里有一个示例：\n\n```cpp\n#include <iostream>\n#include <memory>\n\
  \nstruct Node {\n  std::shared_ptr<Node> next;\n  std::weak_ptr<Node> prev; // 使用\
  \ weak_ptr 避免循环引用\n  Node() : next(nullptr) {}\n};\n\nvoid circularReferenceExample()\
  \ {\n  std::shared_ptr<Node> first = std::make_shared<Node>();\n  std::shared_ptr<Node>\
  \ second = std::make_shared<Node>();\n  first->next = second;\n  second->prev =\
  \ first; // 引用计数不会增加\n} // 内存被正确释放\n```\n\n### 6. 定期检查并测试代码的内存泄漏\n\n即使有了最佳实践，定期检查代码的内存管理问题也是至关重要的。利用\
  \ `Valgrind`、`AddressSanitizer` 或内置的 C++ 内存管理工具来识别和诊断内存泄漏。这些工具可以为内存在何处分配但未释放提供宝贵的见解。\n\
  \n定期运行测试有助于在开发早期捕获潜在的泄漏，从而在问题变得严重之前更容易解决。\n\n### 7. 编写代码注释并使用清晰的命名规范\n\n清晰的文档和命名规范有助于防止对内存所有权和管理的误解。在定义处理动态内存的函数、`classes`\
  \ 或方法时，要明确所有权和责任。例如，在函数名前名前加 `get`、`create` 或 `acquire` 前缀可以信号正在创建一个新资源，并且需要进行管理。\n\
  \n```cpp\nstd::unique_ptr<int> createResource() {\n  return std::make_unique<int>(42);\
  \ // 所有权转移\n}\n```\n\n### 8. 始终初始化指针\n\n未初始化的指针会导致未定义行为，包括内存泄漏。在声明时始终初始化指针。这种做法可以防止意外访问和泄漏。\n\
  \n```cpp\nint* ptr = nullptr; // 初始化为空\nif (ptr) {\n  // 安全地使用 ptr\n}\n```\n\n#\
  \ 第 8 章 结构体、类与对象\n\n## 8.1 struct 与 class\n\n当你进入 C++ 时，会遇到的基本概念之一是 struct 和 class\
  \ 的区别。这两个构造对于定义自定义类型至关重要，理解它们的差异可以显著提高你的编程水平。\n\n本质上，struct 是将变量分组到一个名称下的数据结构。它对于简单的数据集合特别有用。相比之下，`class`\
  \ 是一个更复杂的构造，封装了数据和函数，允许对实体进行更全面的表示。\n\n### 访问控制：封装的核心\n\nstruct 和 class 之间主要的区别在于它们的默认访问说明符。在\
  \ `struct` 中，所有成员默认是 `public`（公共）。这意味着任何可见该 `struct` 的代码都可以访问其成员。这一特性使得 struct 成为不需要考虑封装的简单数据结构的良好选择。\n\
  \n考虑一个表示二维空间点的 `struct`：\n\n```cpp\nstruct Point {\n  double x;\n  double y;\n \
  \ void display() const {\n    std::cout << \"Point(\" << x << \", \" << y << \"\
  )\\n\";\n  }\n};\n```\n\n在这个示例中，`Point` 有两个公共成员 `x` 和 `y`，可以直接访问：\n\n```cpp\nPoint\
  \ p;\np.x = 5.0;\np.y = 3.0;\np.display(); // 输出: Point(5.0, 3.0)\n```\n\n这种直接访问对于小型数据结构是有利的。\n\
  \n相反，`class` 设计用于更复杂的数据表示，其中封装和数据隐藏很重要。默认情况下，`class` 的所有成员都是 `private`（私有的），这意味着无法从\
  \ `class` 外部直接访问。这种封装是面向对象编程 (OOP) 的核心原则，允许你保护对象的内部状态。\n\n这是使用 `class` 实现的类似设计：\n\
  \n```cpp\nclass Point {\nprivate:\n  double x;\n  double y;\n\npublic:\n  Point(double\
  \ xVal, double yVal) : x(xVal), y(yVal) {}\n  void display() const {\n```\n\n\n\n\
  \n```cpp\nstd::cout << \"Point(\" << x << \", \" << y << \")\\n\";\n\n}\n\nvoid\
  \  setX(double xVal) {\n\nx = xVal;\n\n}\n\nvoid  setY(double yVal) {\n\ny = yVal;\n\
  \n}\n\n};\n```\n\n在这个 `Point` 类中，成员变量 `x` 和 `y` 是私有的。它们只能通过 `setX`、`setY` 和 `display`\
  \ 等公共方法进行访问。这种封装确保了只有有效的更改才能作用于对象的内部状态，这在数据完整性至关重要的系统中尤为重要。\n\n使用场景：何时使用每种类型\n\n\
  在 `struct` 和 `class` 之间做选择时，请考虑你的数据结构的目的和复杂性。如果你正在创建一个没有特殊行为的简单数据容器，`struct` 通常是最佳选择。例如，你可能使用\
  \ `struct` 来表示数据库中的一条简单记录：\n\n```cpp\nstruct  Book {\n\nstd::string title;\n\nstd::string\
  \ author;\n\nint yearPublished;\n\nvoid  display()  const {\n\nstd::cout << title\
  \ << \" by \" << author << \", published in \" << yearPublished << \"\\n\";\n\n\
  }\n\n};\n```\n\n这个 `Book` 结构体存储了书籍的信息，并提供了一个显示它的方法。`struct` 的简单性使其易于理解和使用。\n\n另一方面，当你需要实现更复杂的行为、封装或数据验证时，`class`\
  \ 会更加合适。例如，考虑一个代表银行账户的类：\n\n```cpp\nclass  BankAccount {\n\nprivate:\n\ndouble balance;\n\
  \npublic:\n\nBankAccount() : balance(0.0) {}\n\nvoid  deposit(double amount) {\n\
  \nif (amount > 0) {\n\nbalance += amount;\n\n}\n\n}\n\nvoid  withdraw(double amount)\
  \ {\n\nif (amount > 0 && amount <= balance) {\n\nbalance -= amount;\n\n}\n\n}\n\n\
  double  getBalance()  const {\n\nreturn balance;\n\n}\n\n};\n```\n\n在这个示例中，`BankAccount`\
  \ 类封装了 `balance` 数据成员变量，确保了它无法从类外部直接访问。相反，用户必须通过公共方法 `deposit`、`withdraw` 和 `getBalance`\
  \ 与其交互，从而维护账户的完整性。\n\n现代 C++ 增强\n\n随着现代 C++（特别是从 C++11 开始）的引入，`struct` 和 `class`\
  \ 的功能都得到了显著扩展。例如，它们现在都可以拥有构造函数、析构函数，甚至支持继承，从而允许设计具有更大的灵活性。\n\n这是一个带有构造函数和成员成员的 `struct`\
  \ 示例：\n\n```cpp\nstruct  Circle {\n\ndouble radius;\n\nCircle(double r) : radius(r)\
  \ {}\n\ndouble  area()  const {\n\nreturn  3.14159 * radius * radius;\n\n}\n\ndouble\
  \  circumference()  const {\n\nreturn  2 * 3.14159 * radius;\n\n}\n\n};\n```\n\n\
  在 `Circle` 结构体中，我们有一个初始化 `radius` 的构造函数以及用于计算面积和周长的成员函数。这展示了 `struct` 如何像 `class`\
  \ 一样有效地封装行为。\n\n继承与多态\n\n`struct` 和 `class` 都支持继承，这是面向对象编程（OOP）的基石。这意味着你可以基于已创建一个新的\
  \ `struct` 或 `class`，继承它的属性和行为。以下示例说明了这一点：\n\n```cpp\nclass  Shape {\n\npublic:\n\
  \nvirtual  double  area()  const = 0; // 纯虚函数\n\n};\n\nclass  Rectangle : public\
  \ Shape {\n\nprivate:\n\ndouble width;\n\ndouble height;\n\npublic:\n\nRectangle(double\
  \ w, double h) : width(w), height(h) {}\n\ndouble  area()  const  override {\n\n\
  return width * height;\n\n}\n\n};\n\nclass  Circle : public Shape {\n\nprivate:\n\
  \ndouble radius;\n\npublic:\n\nCircle(double r) : radius(r) {}\n\ndouble  area()\
  \  const  override {\n\nreturn  3.14159 * radius * radius;\n\n}\n\n};\n```\n\n在这个示例中，`Shape`\
  \ 是一个带有纯虚函数 `area()` 的抽象类。`Rectangle` 和 `Circle` 都继承自 `Shape` 并提供了 `area()` 方法的自己的实现。这允许你以多态的方式处理不同的形状，在将它们视为\
  \ `Shape` 对象的同时调用它们特定的面积计算方法。\n\n性能考虑\n\n在性能方面，在大多数情况下 `struct` 和 `class` 之间几乎没有区别。编译器对它们的处理方式相似，特别是在涉及内存分配和对象创建时。使用\
  \ `struct` 还是 `class` 的选择应主要基于设计考虑，而不是性能指标。\n\n## 8.2 访问修饰符与封装\n\n在深入学习 C++ 面向对象编程时，必须掌握的基础概念之一是封装，它与访问修饰符紧密相关。封装是将数据以及操作这些数据的方法封装在一个单元（或\
  \ `class`）中的，同时限制对对象某些组件的访问。这种方法不仅有助于维护数据的完整性，还能增强代码的清晰性和可维护性。\n\n### 访问修饰符\n\n\
  C++ 提供了三种主要的访问修饰符：\n\n1. **Public (公共)**：声明为 `public` 的成员可以从类外部访问。这是最宽松的访问级别，允许程序的其他部分直接读取和修改公共成员。\n\
  2. **Private (私有)**：声明为 `private` 的成员只能在类内部访问。这是最严格的访问级别，确保外部代码无法直接访问或修改这些成员。`private`\
  \ 成员对于保护对象的内部状态至关重要。\n3. **Protected (受保护)**：声明为 `protected` 的成员与 `private` 成员相似，但有一个关键区别：它们可以被派生类访问。这允许子类访问其基类的保护成员，有助于代码重用和继承的实现。\n\
  \n### 访问修饰符在封装中的作用\n\n封装主要关于控制对对象内部状态的访问。通过智能使用访问修饰符，你可以强制关于数据如何使用的规则。这种控制对于维护完整性至关重要。\n\
  \n让我们用一个实际示例来说明这些概念。假设你正在设计一个代表银行账户的类。你可能希望将 `balance` 设置为 `private`。\n\n```cpp\n\
  class  BankAccount {\n\nprivate:\n\ndouble balance;\n\npublic:\n\nBankAccount()\
  \ : balance(0.0) {}\n\nvoid  deposit(double amount) {\n\nif (amount > 0) {\n\nbalance\
  \ += amount;\n\n}\n\n}\n\nvoid  withdraw(double amount) {\n\nif (amount > 0 && amount\
  \ <= balance) {\n\nbalance -= amount;\n\n}\n\n}\n\ndouble  getBalance()  const {\n\
  \nreturn balance;\n\n}\n\n};\n```\n\n在 `BankAccount` 类中，`balance` 是 `private` 成员，确保它无法从类外部直接访问。相反，我们提供了公共方法\
  \ `deposit`、`withdraw` 和 `getBalance` 来与余额交互。这种封装确保了余额只能通过受控的方式进行修改——用户不会无意中将其设置为无效状态（例如负余额）。\n\
  \n### 封装的好处\n\n1. **数据保护**：通过限制对对象数据的直接访问，可以保护其免受意外修改。这在多个组件交互的复杂系统中特别别用。\n2. **代码可维护性**：封装允许你更改类的内部实现而不影响使用该类的外部代码。只要公共接口保持一致，你就可以重构或优化内部工作机制而不会破坏现有功能。\n\
  3. **提高可读性**：当数据成员被隐藏而只暴露方法时，类的接口变得更加简洁且易于理解。类的用户可以关注类能做什么，而不是它是如何做什么的。\n4. **受控访问**：通过提供特定方法来操作数据，你可以强制关于数据如何使用的规则。例如，你可能希望防止负数存款或取款。\n\
  \n受保护成员与继承\n\n\n\n\n\n在继承的范围内，`protected` 访问限定符起着至关重要的作用。当你设计类层次结构时，你可能希望派生类访问基类的某些成员，而不将这些成员暴露给其他部分。\n\
  \n考虑这样一个场景：你有一个基类 `Account` 以及派生类 `SavingsAccount` 和 `CheckingAccount`：\n\n```cpp\n\
  class Account {\nprotected:\n    double balance;\npublic:\n    Account() : balance(0.0)\
  \ {}\n    void deposit(double amount) {\n        if (amount > 0) {\n           \
  \ balance += amount;\n        }\n    }\n    double getBalance() const {\n      \
  \  return balance;\n    }\n};\n\nclass SavingsAccount : public Account {\npublic:\n\
  \    void applyInterest(double rate) {\n        balance += balance * rate; // 访问保护成员\n\
  \    }\n};\n```\n\n在这个示例中，`balance` 在基类 `Account` 中被设为 `protected`，允许 `SavingsAccount`\
  \ 直接访问它。这种设计使派生类能够在基类功能的基础上进行构建，同时保持对敏感数据的访问控制。\n\n### 8.3 构造函数、析构函数和初始化列表\n\n在\
  \ C++ 世界中，构造函数和析构函数是类设计的重要组成部分。它们管理对象的生命周期，确保资源得到适当的分配和释放。理解如何有效地使用它们以及初始化列表，对于编写健壮且高效的代码至关重要。\n\
  \n### 构造函数\n\n构造函数是一种特殊的成员函数，当类对象实例化时会被自动调用。它的主要目的是初始化对象的数据成员。构造函数可以被重载，允许你创建多个接受不同参数的版本。\n\
  \n这是一个带有构造函数的类的简单示例：\n\n```cpp\nclass Point {\nprivate:\n    double x;\n    double\
  \ y;\npublic:\n    Point(double xVal, double yVal) : x(xVal), y(yVal) {}\n    void\
  \ display() const {\n        std::cout << \"Point(\" << x << \", \" << y << \")\\\
  n\";\n    }\n};\n```\n\n在 `Point` 类中，构造函数接收两个参数 `xVal` 和 `yVal`，它们用于初始化私有成员 `x`\
  \ 和 `y`。使用初始化列表（`: x(xVal), y(yVal)`）是 C++ 中的首选做法，因为它效率更高，特别是对于复杂数据类型。\n\n### 初始化列表\n\
  \n初始化列表允许你在执行构造函数体内容之前初始化数据成员。这对于 `const` 成员、引用成员以及没有默认构造函数的类的成员特别为重要。\n\n考虑以下示例：\n\
  \n```cpp\nclass Circle {\nprivate:\n    const double radius; // 常量成员\n    double\
  \ area;\npublic:\n    Circle(double r) : radius(r), area(3.14159 * r * r) {}\n \
  \   void display() const {\n        std::cout << \"Circle with radius \" << radius\
  \ << \" has area \" << area << \"\\n\";\n    }\n};\n```\n\n在 `Circle` 类中，`radius`\
  \ 是常量成员。它必须在对象创建时进行初始化，这是通过初始化列表实现的。`area` 也在初始化期间进行计算，确保它能立即反映半径。\n\n使用初始化列表可以提高性能，因为避免了不必要的默认构造随后的赋值操作。对于复杂数据类型（例如其他类的对象），初始化列表确保了包含对象的构造函数被直接调用。\n\
  \n#### 析构函数\n\n析构函数是另一种特殊的成员函数，当对象超出作用域或被显式删除时调用。它的主要作用是释放对象在其生命周期可能获取的资源，例如内存或文件句柄。\n\
  \n这是一个带有析构类的示例：\n\n```cpp\nclass Resource {\nprivate:\n    int* data;\npublic:\n\
  \    Resource(int size) {\n        data = new int[size]; // 分配资源\n    }\n    ~Resource()\
  \ {\n        delete[] data; // 释放资源\n    }\n};\n```\n\n在 `Resource` 类中，构造函数分配了一个整数数组，而析构函数确保在对象销毁时释放分配的内存。这种模式防止了\
  \ C++ 编程中常见问题——内存泄漏。\n\n### 最佳实践\n\n1. **三法则 (Rule of Three)**：如果你的类需要自定义的析构函数、构造函数或赋值运算符，那么它可能需要这三者。这一原则确保了资源在创建和销毁期间得到正确管理。\n\
  2. **使用智能指针**：为了简化资源管理，在处理动态内存时考虑使用智能指针（如 `std::unique_ptr` 或 `std::shared_ptr`）。它们会自动处理内存释放，减少了内存泄漏的概率。\n\
  3. **常量正确性 (Const-correctness)**：在显示或访问数据成员时，使用 `const` 成员函数来指示该方法不会修改对象。这种做法增强了代码的清晰性和安全性。\n\
  \n# 第九章 C++ 面向对象编程\n\n## 9.1 继承与多态\n\n面向对象编程 (OOP) 是 C++ 中的核心范式，提供了一个以镜像现实世界概念的方式组织和构建代码的框架。OOP\
  \ 的基本原则包括继承和多态，它们使开发者能够创建灵活、重用且易于维护的代码。让我们深入探讨这些概念，探索它们的机制、优势和实际应用。\n\n#### 理解继承\n\
  \n继承允许一个类（称为派生类）从另一个类（称为基类）继承属性和行为。这种关系创建了一个层次结构，促进了代码复用和逻辑组织。通过利用继承，你可以在基类中定义通用行为，并在派生类中扩展或修改该行为。\n\
  \n考虑以下示例，我们定义了一个基类 `Animal`，它封装了所有动物的属性和行为。\n\n```cpp\n#include <iostream>\n#include\
  \ <string>\n\nclass Animal {\npublic:\n    Animal(const std::string& name) : name(name)\
  \ {}\n    void introduce() const {\n        std::cout << \"I am \" << name << \"\
  \ and I am an animal.\" << std::endl;\n    }\nprotected:\n    std::string name;\
  \ // 派生类可访问的保护成员\n};\n\nclass Dog : public Animal {\npublic:\n    Dog(const std::string&\
  \ name) : Animal(name) {}\n    void introduce() const {\n        std::cout << \"\
  I am \" << name << \", and I am a dog.\" << std::endl;\n    }\n};\n\nclass Cat :\
  \ public Animal {\npublic:\n    Cat(const std::string& name) : Animal(name) {}\n\
  \    void introduce() const {\n        std::cout << \"I am \" << name << \", and\
  \ I am a cat.\" << std::endl;\n    }\n};\n\nint main() {\n    Dog dog(\"Buddy\"\
  );\n    Cat cat(\"Whiskers\");\n    dog.introduce(); // 输出：I am Buddy, and I am\
  \ a dog.\n    cat.introduce(); // 输出：I am Whiskers, and I am a cat.\n    return\
  \ 0;\n}\n```\n\n在这个示例中，`Animal` 作为基类。`Dog` 和 `Cat` 类继承自 `Animal` 并重写了 `introduce()`\
  \ 方法以提供特定信息。这种结构允许类之间建立清晰的关系并促进了代码复用，因为通用功能存储在基类中。\n\n`protected` 访问修饰允许派生类访问 `name`\
  \ 成员，在保持封装的同时增加了派生类的灵活性。\n\n#### 继承的机制\n\nC++ 支持多种类型的继承：公共继承、保护继承和私有继承。常见的是公共继承，基类的公共和保护成员在派生类中仍然是可见的。这是最直观的继承形式，并且很好地符合“是一个...”的关系，即狗是动物。\n\
  \n以下是不同继承类型如何影响成员访问性的简要概述：\n\n* **公共继承 (Public Inheritance)**：基类的公共和保护成员在派生类中是可见的。\n\
  * **保护继承 (Protected Inheritance)**：基类的公共和保护成员在派生类中变为保护的。\n* **私有继承 (Private Inheritance)**：基类的公共和保护成员在派生类中变为私有的。\n\
  \n\n\n\n\n# 多态的力量\n\n多态允许方法根据其所作用的对象执行不同的操作，即使这些方法的调用方式相同。在 C++ 中，多态主要通过虚函数实现，从而实现了动态分发。这意味着调用哪个方法的决策是在运行时做出的，这使得对象的行为表现具有更强的灵活性。\n\
  \n让我们通过通过虚函数引入多态来增强之前的示例：\n\n```cpp\n#include <iostream>\n#include <string>\n#include\
  \ <vector>\n\nclass Animal {\npublic:\nAnimal(const std::string& name) : name(name)\
  \ {}\nvirtual void speak() const { // 将 speak 声明为虚\nstd::cout << name << \" makes\
  \ a noise.\" << std::endl;\n}\nprotected:\nstd::string name;\n};\n\nclass Dog :\
  \ public Animal {\npublic:\nDog(const std::string& name) : Animal(name) {}\nvoid\
  \ speak() const override { // 重写以实现特定行为\nstd::cout << name << \" barks.\" << std::endl;\n\
  }\n};\n\nclass Cat : public Animal {\npublic:\nCat(const std::string& name) : Animal(name)\
  \ {}\nvoid speak() const override {\nstd::cout << name << \" meows.\" << std::endl;\n\
  }\n};\n\nvoid makeAnimalsSpeak(const std::vector<Animal*>& animals) {\nfor (const\
  \ auto& animal : animals) {\nanimal->speak(); // 调用相应的 speak() 方法\n}\n}\n\nint main()\
  \ {\nDog dog(\"Buddy\");\nCat cat(\"Whiskers\");\nstd::vector<Animal*> animals =\
  \ { &dog, &cat };\nmakeAnimalsSpeak(animals); // 输出: Buddy barks. Whiskers meows.\n\
  return 0;\n}\n```\n\n在这个示例中，`Animal` 类中的 `speak()` 方法被标记为 `virtual`，这表示派生类可以重写它。`Dog`\
  \ 和 `Cat` 类分别提供了它们自己的 `speak()` 的实现。当我们调用 `makeAnimalsSpeak()` 时，程序会根据每个对象的实际类型执行正确的\
  \ `speak()` 方法，这展示了运行时多态。\n\n### 多态的优势\n\n多态提供了以下几个优势：\n\n1. **代码灵活性**：你可以编写对基类指针或引用操作的函数，使其能够无缝地处理任何派生类的对象。这减少了代码重复并提升了扩展性。\n\
  2. **可交换性**：你可以在不改变使用它们代码的情况下切换派生类。例如，如果你开发了一种新类型的动物，只需创建一个新的派生类，而无需修改现有的函数。\n3.\
  \ **解耦**：多态允许你将使用对象的代码与这些对象的具体实现解耦。这符合面向接口编程而非面向实现的原则。\n\n### 现实世界应用\n\n继承和多态的力量在各种现实应用中大放异异。考虑一个需要渲染不同形状的图形应用程序。你可能有一个基类\
  \ `Shape`，以及诸如 `Circle`、`Rectangle` 和 `Triangle` 等派生类。每个派生类都可以实现自己的计算面积或在屏幕上绘制自己的方法。\n\
  \n```cpp\n#include <iostream>\n#include <cmath>\n\nclass Shape {\npublic:\nvirtual\
  \ double area() const = 0; // 纯虚函数，使 Shape 成为抽象类\n};\n\nclass Circle : public Shape\
  \ {\nprivate:\ndouble radius;\npublic:\nCircle(double r) : radius(r) {}\ndouble\
  \ area() const override {\nreturn M_PI * radius * radius; // 使用 <cmath> 中的 M_PI\n\
  }\n};\n\nclass Rectangle : public Shape {\nprivate:\ndouble width, height;\npublic:\n\
  Rectangle(double w, double h) : width(w), height(h) {}\ndouble area() const override\
  \ {\nreturn width * height;\n}\n};\n\nvoid printArea(const Shape& shape) {\nstd::cout\
  \ << \"Area: \" << shape.area() << std::endl;\n}\n\nint main() {\nCircle circle(5.0);\n\
  Rectangle rectangle(4.0, 6.0);\nprintArea(circle);      // 输出: Area: 78.5398\nprintArea(rectangle);\
  \  // 输出: Area: 24\nreturn 0;\n}\n```\n\n在这个示例中，`Shape` 类是一个带有一个纯虚函数 `area()` 的抽象类。`Circle`\
  \ 和 `Rectangle` 类提供了该函数的具体实现。`printArea()` 函数可以接受任何派自 `Shape` 的对象，展示了多态提供的灵活性。\n\
  \n## 9.2 抽象类与纯虚函数\n\n### 什么是抽象类？\n\n抽象类充当其他类的蓝图。它本身不能被实例化，而是为了被子类派生。当你想要为一组相关类定义通用接口，同时将具体实现留给派生类时，这种方法特别有用。\n\
  \n在 C++ 中要使一个类变为抽象，你需要至少一个纯虚函数。纯虚函数是在抽象类中声明的函数，它在该类中没有实现，并标记为 `= 0`。这标志着任何派生类都必须为此函数提供实现。\n\
  \n让我们用一个简单的示例来说说明这一点。假设你正在创建一个管理各种车辆的系统。你可以定义一个抽象类 `Vehicle`，为所有车辆类型指定通用接口。\n\n\
  ```cpp\n#include <iostream>\n#include <string>\nclass Vehicle {\npublic:\nvirtual\
  \ void start() = 0; // 纯虚函数\nvirtual void stop() = 0; // 纯虚函数\nvirtual ~Vehicle()\
  \ = default; // 虚析构函数\n};\n\nclass Car : public Vehicle {\npublic:\nvoid start()\
  \ override {\nstd::cout << \"Car is starting.\" << std::endl;\n}\nvoid stop() override\
  \ {\nstd::cout << \"Car is stopping.\" << std::endl;\n}\n};\n\nclass Motorcycle\
  \ : public Vehicle {\npublic:\nvoid start() override {\nstd::cout << \"Motorcycle\
  \ is starting.\" << std::endl;\n}\nvoid stop() override {\nstd::cout << \"Motorcycle\
  \ is stopping.\" << std::endl;\n}\n};\n\nint main() {\nCar car;\nMotorcycle motorcycle;\n\
  car.start();\nmotorcycle.start();\ncar.stop();\nmotorcycle.stop();\nreturn 0;\n\
  }\n```\n\n在这个示例中，`Vehicle` 类是一个抽象类，因为它包含了纯虚函数。派生类 `Car` 和 `Motorcycle` 具体实现了。注意你不能直接创建\
  \ `Vehicle` 的实例：\n\n```cpp\nVehicle v; // 这会导致编译错误\n```\n\n### 纯虚函数的作用\n\n纯虚函数在\
  \ C++ 中定义接口方面起着至关重要的作用。它们强制任何派生类必须履行契约。这对于不同模块需要通过通用接口进行交互的大系统特别有用。\n\n例如，在图形应用程序中，你可能有一个带有纯虚函数\
  \ `draw()` 的抽象类 `Shape`。每个派生类（如 `Circle` 或 `Square`）都会以自己的方式实现 `draw()` 方法。通过这种方式，你可以在不需要每个形状实现细节的情况下处理它们。\n\
  \n### 示例：实现抽象类\n\n让我们扩展 `Shape` 示例以展示抽象类和纯虚函数是如何工作的：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <memory>\n\nclass Shape {\npublic:\nvirtual void draw()\
  \ const = 0; // 纯虚函数\nvirtual ~Shape() = default; // 为了正确清理的虚析构函数\n};\n\nclass Circle\
  \ : public Shape {\npublic:\nvoid draw() const override {\nstd::cout << \"Drawing\
  \ a Circle.\" << std::endl;\n}\n};\n\nclass Square : public Shape {\npublic:\nvoid\
  \ draw() const override {\nstd::cout << \"Drawing a Square.\" << std::endl;\n}\n\
  };\n\nvoid renderShapes(const std::vector<std::unique_ptr<Shape>>& shapes) {\nfor\
  \ (const auto& shape : shapes) {\nshape->draw(); // 调用相应的 draw 方法\n}\n}\n\nint main()\
  \ {\nstd::vector<std::unique_ptr<Shape>> shapes;\nshapes.push_back(std::make_unique<Circle>());\n\
  shapes.push_back(std::make_unique<Square>());\nrenderShapes(shapes); // 输出: Drawing\
  \ a Circle. Drawing a Square.\nreturn 0;\n}\n```\n\n\n\n\n\n在这个示例中，`Shape` 是一个带有纯虚函数\
  \ `draw()` 的抽象类。派生类 `Circle` 和 `Square` 实现了该函数。`renderShapes` 函数演示了我们如何使用多态性来统一地与不同的形状进行交互，而无论它们的具体类型为何。\n\
  \n### 使用抽象类的优势\n\n使用抽象类和纯虚函数有几个优势：\n\n1. **代码组织**：它们通过定义清晰的接口来帮助组织代码，使其更易理解和维护。\n\
  2. **灵活性**：它们允许轻松扩展代码库。可以在极少修改现有代码的情况下，添加新的形状、车辆或任何其他实体。\n3. **强制实现**：通过要求派生类实现某些方法，你可以确保所有子类都遵循预定义的接口，从而提高整个代码的一致性。\n\
  \n## 9.3 函数的重写与重载\n\n在 C++ 编程领域，理解函数重写（Overriding）和函数重载（Overloading）之间的区别对于有效的面向对象设计至关重要。这两个概念在增强代码的灵性和易用性方面都起着至关重要的作用，但它们有不同的目的。\n\
  \n### 函数重写\n\n当派生类为其基类中已定义的函数提供特定实现时，就会发生函数重写。这允许派生类修改或扩展基类方法的行为。在 C++ 中重写一个函数，基类方法必须标记为\
  \ `virtual`，并且派生类方法应使用 `override` 关键字以确保清晰和安全。\n\n考虑以下示例，我们定义了一个基类 `Animal`，以及派生类\
  \ `Dog` 和 `Cat`，它们重写了 `speak()` 方法。\n\n```cpp\n#include <iostream>\n#include <string>\n\
  \nclass Animal {\npublic:\n    virtual void speak() const { // 基类中的虚函数\n       \
  \ std::cout << \"Animal makes a sound.\" << std::endl;\n    }\n};\n\nclass Dog :\
  \ public Animal {\npublic:\n    void speak() const override { // 重写基类方法\n      \
  \  std::cout << \"Dog barks.\" << std::endl;\n    }\n};\n\nclass Cat : public Animal\
  \ {\npublic:\n    void speak() const override { // 重写基类方法\n        std::cout <<\
  \ \"Cat meows.\" << std::endl;\n    }\n};\n\nvoid makeAnimalSpeak(const Animal&\
  \ animal) {\n    animal.speak(); // 根据实际对象类型调用相应的 speak 方法\n}\n\nint main() {\n\
  \    Dog dog;\n    Cat cat;\n    makeAnimalSpeak(dog); // 输出: Dog barks.\n    makeAnimalSpeak(cat);\
  \  // 输出: Cat meows.\n    return 0;\n}\n```\n\n在此示例中，`Animal` 类中的 `speak()` 方法被\
  \ `Dog` 和 `Cat` 类均重写了。`makeAnimalSpeak` 函数演示了多态性，允许根据实际对象类型而非引用类型来调用正确的 `speak()`\
  \ 方法。\n\n### 函数重载\n\n另一方面，函数重载允许你在同一个作用域内定义多个同名但参数列表不同的函数。这是一种编译时特性，允许同函数名根据输入参数执行不同的任务。编译器通过参数的数量和类型来区分重载函数。\n\
  \n以下是一个使用简单 `add` 函数进行函数重载的示例：\n\n```cpp\n#include <iostream>\n\nclass Calculator\
  \ {\npublic:\n    int add(int a, int b) {\n        return a + b; // 相加两个整数\n   \
  \ }\n    double add(double a, double b) {\n        return a + b; // 相加两个浮点数\n  \
  \  }\n    int add(int a, int b, int c) {\n        return a + b + c; // 相加三个整数\n\
  \    }\n};\n\nint main() {\n    Calculator calc;\n    std::cout << \"Add two integers:\
  \ \" << calc.add(2, 3) << std::endl; // 输出: 5\n    std::cout << \"Add two doubles:\
  \ \" << calc.add(2.5, 3.1) << std::endl; // 输出: 5.6\n    std::cout << \"Add three\
  \ integers: \" << calc.add(1, 2, 3) << std::endl; // 输出: 6\n    return 0;\n}\n```\n\
  \n在此示例中，`Calculator` 类定义了三个版本的 `add` 函数，每个版本都有不同的签名。根据传递的参数的类型和数量调用适当的版本，展示了重载的威力。\n\
  \n### 重写与重载的主要区别\n\n尽管重写和重载都涉及同名的函数，但它们在行为和目的上有显著区别：\n\n1. **目的**：\n    * `Overriding（重写）`用于在派生类提供基类方法的特定实现，允许多态行为。\n\
  \    * `Overloading（重载）`允许多个函数同名共存，根据参数的类型和数量实现不同的行为。\n2. **绑定时间**：\n    * `Overriding（重写）`利用动态绑定（运行时解析），允许根据实际对象类型调用正确的方法。\n\
  \    * `Overloading（重载）`使用静态绑定（编译时解析），编译器根据参数确定调用哪个函数。\n3. **继承**：\n    * `Overriding（重写）`仅适用于继承语境，即派生类重写其基类的方法。\n\
  \    * `Overloading（重载）`独立于继承，可以发生在同一个类中，也可以发生在不同的类之间。\n\n### 实际应用\n\n理解如何有效使用重写和重载可以增强你的编程能力。\n\
  \n* `Overriding（重写）`在基类定义了行为模板的框架和库中特别有用。例如，在 GUI 应用中，你可能会定义各种组件（如按钮或滑块）。\n* `Overloading（重载）`当你希望为类类型提供直观接口时是有益的。通过重载\
  \ `add` 等方法可以简化用户体验。\n\n\n\n\n\n```cpp\nreturn std::sqrt(x * x + y * y);\n}\n\n\
  };\n\ntemplate <typename T>\nT farthest(T a, T b) {\n    return (a.distance() >\
  \ b.distance()) ? a : b;\n}\n\nint main() {\n    Point p1(3, 4); // distance = 5\n\
  \    Point p2(1, 1); // distance ≈ 1.41\n    Point farthestPoint = farthest(p1,\
  \ p2);\n    std::cout << \"Farthest point from origin: (\" << farthestPoint.x <<\
  \ \", \" << farthestPoint.y << \")\" << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，`farthest`\
  \ 模板可以与 `Point` 类无缝工作，展示了模板在处理内建类型和用户定义类型时的多变性。\n\n### 类模板\n\n现在，让我们关注类模板。类模板与函数模板类似，但它们允许你定义一个可以与任何数据类型工作的类。在创建链表、栈或队列等数据结构时，由于存储的元素类型可能会变化，这一功能是无价的。\n\
  \n考虑一个用于值对的简单泛型类模板。这个 `Pair` 类可以持有两个可能不同类型的值：\n\n```cpp\n#include <iostream>\n#include\
  \ <string>\n\ntemplate <typename T1, typename T2>\nclass Pair {\nprivate:\n    T1\
  \ first;\n    T2 second;\npublic:\n    Pair(T1 a, T2 b) : first(a), second(b) {}\n\
  \    T1 getFirst() const { return first; }\n    T2 getSecond() const { return second;\
  \ }\n};\n\nint main() {\n    Pair<int, double> pair1(1, 2.5);\n    std::cout <<\
  \ \"First: \" << pair1.getFirst() << \", Second: \" << pair1.getSecond() << std::endl;\n\
  \    Pair<std::string, char> pair2(\"Hello\", 'A');\n    std::cout << \"First: \"\
  \ << pair2.getFirst() << \", Second: \" << pair2.getSecond() << std::endl;\n   \
  \ return 0;\n}\n```\n\n在这段代码段中，`Pair` 类模板使用两个类型参数 `T1` 和 `T2` 定义。这允许 `Pair` 类持有任何类型组合，例如\
  \ `int` 与 `double` 配对，或者 `string` 与 `char` 配对。这种灵活性不仅减少了代码重复，还增强了你数据结构的清晰度。\n\n\
  ### 特殊化\n\n模板的有趣方面之一是允许对它们进行特化。这意味着你可以为某些数据类型定义特定的实现。例如，如果你想以不同的方式处理 `Pair` 中两个类型都相同的情况，你可以创建一个模板特化：\n\
  \n```cpp\n#include <iostream>\n\ntemplate <typename T1, typename T2>\nclass Pair\
  \ {\npublic:\n    T1 first;\n    T2 second;\n    Pair(T1 a, T2 b) : first(a), second(b)\
  \ {}\n};\n\n// 当两个类型相同时时的特化\ntemplate <typename T>\nclass Pair<T, T> {\npublic:\n\
  \    T first;\n    T second;\n    Pair(T a, T b) : first(a), second(b) {}\n    void\
  \ display() const {\n        std::cout << \"Both values are the same: \" << first\
  \ << \" and \" << second << std::endl;\n    }\n};\n\nint main() {\n    Pair<int,\
  \ double> pair1(1, 2.5);\n    std::cout << \"First: \" << pair1.first << \", Second:\
  \ \" << pair1.second << std::endl;\n    Pair<int, int> pair2(5, 10);\n    pair2.display();\
  \ // 使用特化方法\n    return 0;\n}\n```\n\n在这个示例中，我们为两个类型都相同的情况提供了一个 `Pair` 类的特化版本。这种特化允许我们引入一个新方法\
  \ `display()`，该方法是为这种场景专门定制的。\n\n## 10.2 模板特化\n\n模板特化是 C++ 中的一项强大功能，允许开发人员针对特定类型或条件自定义模板的行为。这种能力提供了一种优化性能、管理特定类型行为或处理通用模板定义可能无法妥当处理的边缘情况的方法。\n\
  \n#### 全特化\n\n当你为特定类型定义模板的特定实现时，就会发生全特化。这意味着你创建了一个完全独立的模板版本，当该特定类型被实例化时将会被使用。当你需要为一个与通用情况不同的特定类型提供自定义行为时，这特别有用。\n\
  \n让我们考虑一个例子，我们有一个用于 `Calculator` 的泛型类模板。该计算器可以对任何数值类型执行加法：\n\n```cpp\n#include <iostream>\n\
  \ntemplate <typename T>\nclass Calculator {\npublic:\n    T add(T a, T b) { return\
  \ a + b; }\n};\n\n// 针对字符串的全特化\ntemplate <>\nclass Calculator<std::string> {\npublic:\n\
  \    std::string add(std::string a, std::string b) {\n        return a + \" and\
  \ \" + b;\n    }\n};\n\nint main() {\n    Calculator<int> intCalc;\n    std::cout\
  \ << \"Sum: \" << intCalc.add(5, 10) << std::endl;\n\n    Calculator<std::string>\
  \ strCalc;\n    std::cout << \"Concat: \" << strCalc.add(\"Hello\", \"World\") <<\
  \ std::endl;\n    return 0;\n}\n```\n\n在这个示例中，我们针对字符串的情况提供了 `Calculator` 类的全特化。这允许我们为\
  \ `add` 方法提供不同的逻辑，用于连接字符串。\n\n### 部分特化\n\n部分特化发生在你为模板的特定类型组合定义特定实现时。这允许你在保持泛用性的同时，针对某些特定情况进行定制。\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n\ntemplate <typename T1, typename\
  \ T2>\nclass Container {\npublic:\n    T1 first;\n    T2 second;\n    Container(T1\
  \ a, T2 b) : first(a), second(b) {}\n};\n\n// 当第一个类型是 vector 的部分特化\ntemplate <typename\
  \ T, typename T2>\nclass Container<std::vector<T>, T2> {\npublic:\n    std::vector<T>\
  \ first;\n    T2 second;\n    Container(std::vector<T> a, T2 b) : first(a), second(b)\
  \ {}\n    void info() const {\n        std::cout << \"Vector size: \" << first.size()\
  \ << \", Other: \" << second << std::endl;\n    }\n};\n\nint main() {\n    Container<int,\
  \ double> c1(1, 2.5);\n    Container<std::vector<int>, int> c2({1, 2, 3}, 10);\n\
  \    c2.info(); // 使用部分特化的方法\n    return 0;\n}\n```\n\n在这个示例中，我们为第一个类型是 `vector`\
  \ 的情况提供了 `Container` 类的部分特化。这允许我们在不影响其他类型组合的情况下，针对特定的类型模式进行定制。\n\n\n\n\n\n从核心上说，概念（concept）是一个类型作为模板参数时必须满足的一\
  \ set 要求。这允许你通过确保只有适当的类型被传递给模板来定义更健壮的模板。在 C++20 之前，模板错误可能是晦涩且难以诊断的，通常会导致长且令人混乱的编译器信息。概念通过允许你显式地表达模板的预期用法来解决这一问题。\n\
  \n例如，考虑一种场景：你想要创建一个仅对数值类型操作的函数。与其依赖类型特质（type traits）和 SFINAE（替换失败不是错误）技术，不如使用概念来清晰地强制执行这一约束。\n\
  \n### 定义概念\n\n你可以使用 `concept` 关键字后跟一个名称和一组括在括号内的要求来定义一个概念。以下是如何定义一个检查类型是否为整数类型的简单概念的：\n\
  \n```cpp\n#include <concepts>\n#include <iostream>\n\ntemplate <typename T>\nconcept\
  \ Integral = std::is_integral_v<T>;\n\ntemplate <Integral T>\nT add(T a, T b) {\n\
  return a + b;\n}\n\nint  main() {\nstd::cout << \"Sum of 3 and 5: \" << add(3, 5)\
  \ << std::endl;\n// std::cout << \"Sum of 3.5 and 2.1: \" << add(3.5, 2.1) << std::endl;\
  \ // 这会导致编译时错误\nreturn  0;\n}\n```\n\n在这个示例中，`Integral` 概念使用 `std::is_integral_v`\
  \ 检查类型 `T` 是否为整数类型。然后，`add` 函数被限制为仅接受满足该概念的类型。如果你尝试用非整数类型调用 `add`，编译器将产生一个清晰简洁的错误信息，让你更容易理解哪里出了问题。\n\
  \n## 在模板定义中使用概念\n\n概念也可以用于约束多个模板参数，甚至用于创建更复杂的需求。让我们考虑这样一个例子：我们定义一个概念来检查一个类型既是整数又定义了加法：\n\
  \n```cpp\n#include <concepts>\n#include <iostream>\n\ntemplate <typename T>\nconcept\
  \ Addable = requires(T a, T b) {\n{ a + b } -> std::convertible_to<T>;\n};\n\ntemplate\
  \ <Addable T>\nT sum(T a, T b) {\nreturn a + b;\n}\n\nint  main() {\nstd::cout <<\
  \ \"Sum of 3 and 5: \" << sum(3, 5) << std::endl;\nstd::cout << \"Sum of 3.5 and\
  \ 2.1: \" << sum(3.5, 2.1) << std::endl; // 有效，因为两者都是可加的\n// std::cout << \"Sum\
  \ of 'A' and 'B': \" << sum('A', 'B') << std::endl; // 这会导致编译时错误\nreturn  0;\n}\n\
  ```\n\n代码中，`Addable` 概念使用 `requires` 子句检查表达式 `a + b` 是否有效。函数 `sum` 被限制为仅接受满足此要求的类型。这种方法允许我们定义安全且定义良好的模板，减少运行时错误的风险。\n\
  \n## 使用概念的好处\n\n1. **提高可读性**：概念让模板变得一目易懂。通过清晰地说明模板的要求，你提供了宝贵的上下文，帮助他人（以及你自己）理解代码背后的意图。\n\
  2. **更好的错误信息**：当概念不满足时，与传统模板相比，编译器会生成更有意义的错误信息。这通过指向被违反的特定约束有助于调试。\n3. **增强代码质量**：通过强制约束，概念鼓励了更好的设计实践。你可以编写更健壮、类型类型安全的代码，从而减少\
  \ bug 并提高可维护性。\n4. **代码模块化**：概念允许你创建更模块化的代码。你可以定义各种概念并在不同的模板中复用它们，促进代码复用并减少冗余。\n\
  \n# 第 11 章 – 标准模板库 (STL)\n\n## 11.1 容器 (vector, list, map, unordered_map)\n\n标准模板库\
  \ (STL) 是 C++ 最强大的功能之一，它提供了一个健壮的数据结构和算法集合，帮助高效地管理和处理数据。STL 的核心是它的容器，它们允许你以各种方式存储和组织数据。这些容器中的每一个都有其独特的优缺点，理解它们的特性对于根据特定需求选择合适的容器至关重要。\n\
  \n### Vectors\n\n让我们从 `vector` 开始，这是一种可以根据需要增长或缩小大小的动态数组。这种灵活性使得 `vector` 成为 C++\
  \ 中最常用的容器之一。通过 `vector`，你可以存储相同类型的元素，并提供了快速的随机访问，这意味着你可以在常时间内检索元素。\n\n想象你正在为一个游戏构建评分系统。你想跟踪随着游戏进行而频繁改变的玩家分数。`vector`\
  \ 非常适合这种场景，因为允许允许你添加新分数、删除它们，并通过索引轻松地访问任何分数。\n\n这里有一个示例说明 `vector` 是如何工作的：\n\n```cpp\n\
  #include <iostream>\n#include <vector>\n\nint  main() {\nstd::vector<int> scores;\
  \ // 创建一个 vector 来存放分数\n// 添加分数\nscores.push_back(100);  // 添加 100 分\nscores.push_back(200);\
  \  // 添加 200 分\nscores.push_back(150);  // 添加 150 分\n// 显示分数\nstd::cout << \"Current\
  \ Scores:\\n\";\nfor (size_t i = 0; i < scores.size(); ++i) {\nstd::cout << i +\
  \ 1 << \": \" << scores[i] << std::endl;\n}\n// 删除最后一个分数\nscores.pop_back();\nstd::cout\
  \ << \"After removing the last score:\\n\";\nfor (const auto& score : scores) {\n\
  std::cout << score << std::endl;\n}\nreturn  0;\n}\n```\n\n代码中，我们首先创建了一个名为 `scores`\
  \ 的 vector。我们使用 `push_back` 动态添加分数。`size` 方法允许我们确定有多少分数，使用循环显示。`pop_back` 方法演示了我们如何删除最后一个分数。\n\
  \n`vector` 的主要优势之一是它的内存管理。当你超过容量时，STL 会自动调整数组大小，确保你有空间存储数据。然而，这种调整在性能上可能是昂贵的，因为它涉及到分配新内存并移动现有元素。为了缓解这一点，如果你预先知道需要多少元素，可以使用\
  \ `reserve` 方法提前分配内存。\n\n### Lists\n\n接下来我们探索 `list` 容器，它是作为双链表实现的。与存储在连续内存位置的 `vector`\
  \ 不同，`list` 由节点组成，每个节点包含一个值以及指向前继节点的指针。这种结构允许在列表的任何位置进行高效的插入和删除，适用于需要频繁修改集合的场景。\n\
  \n考虑一个音乐播放列表应用程序，你想允许用户添加或删除歌曲。使用 `list` 可以简化这个过程。代码中看起来是这样的：\n\n```cpp\n#include\
  \ <iostream>\n#include <list>\n#include <string>\n\nint  main() {\nstd::list<std::string>\
  \ playlist; // 创建一个 list 来存放歌曲标题\n// 添加歌曲\nplaylist.push_back(\"Song A\");\nplaylist.push_back(\"\
  Song B\");\nplaylist.push_front(\"Song C\"); // 在播放列表开头添加\n// 显示播放列表\nstd::cout\
  \ << \"Current Playlist:\\n\";\nfor (const auto& song : playlist) {\nstd::cout <<\
  \ song << std::endl;\n}\n// 删除歌曲\nplaylist.remove(\"Song B\");\nstd::cout << \"\
  After removing 'Song B':\\n\";\nfor (const auto& song : playlist) {\nstd::cout <<\
  \ song << std::endl;\n}\nreturn  0;\n}\n```\n\n在这个示例中，我们创建了一个名为 `playlist` 的 list。我们使用\
  \ `push_back` 在末尾添加歌曲，使用 `push_front` 在开头添加歌曲。`remove` 方法允许我们根据标题删除特定的歌曲。高效插入和删除元素的能力使得\
  \ `list` 成为播放列表应用程序的极佳选择，其中元素的顺序很重要且修改频繁。\n\n\n\n\n然而，需要考虑的一个权衡是 `list` 不为其元素提供随机访问。如果你需要频繁地通过索引访问元素，`vector`\
  \ 会是更好的选择。`list` 的访问时间是线性的，因为你必须从头或尾开始遍历列表才能到达特定节点。\n\n### 映射（Maps）\n\n接下来我们来看 `map`，这种关联容器以键值值对的形式存储元素。`map`\
  \ 中的每个键（key）都是唯一的，允许根据键高效地检索值（value）。在底层，`map` 通常被实现为平衡二叉搜索树，这确保了元素按键排序，并允许搜索、插入和删除操作具有对数级的时间复杂度。\n\
  \n想象你正在开发一个应用程序，根据用户名来跟踪用户的年龄。`map` 非常适合这个目的，因为它允许你轻松地将用户名与其对应的年龄关联起来。以下是实现这一功能的方法：\n\
  \n```cpp\n#include <iostream>\n#include <map>\n#include <string>\n\nint  main()\
  \ {\nstd::map<std::string, int> userAges; // 创建一个 map 来存储用户名和年龄\n\n// 插入用户及其年龄\n\
  userAges[\"Alice\"] = 30;\nuserAges[\"Bob\"] = 25;\nuserAges[\"Charlie\"] = 35;\n\
  \n// 显示年龄\nstd::cout << \"Ages of Users:\\n\";\nfor (const  auto& user : userAges)\
  \ {\nstd::cout << user.first << \": \" << user.second << \" years old\\n\";\n}\n\
  \n// 查找特定用户\nauto it = userAges.find(\"Bob\");\nif (it != userAges.end()) {\nstd::cout\
  \ << \"Bob's age: \" << it->second << std::endl;\n}\n\nreturn  0;\n}\n```\n\n在这个示例中，我们创建了一个名为\
  \ `userAges` 的 `map`，将用户名作为键，年龄作为值。我们可以使用 `find` 方法轻松地检索用户的年龄，该方法在找到元素时返回一个指向该元素的迭代器，如果不存在则返回\
  \ `end()`。\n\n`map` 的排序特性意味着遍历它将按键的升序顺序产生键值对。当你需要以排序的方式显示信息时，这会非常有优势。\n\n### 无序映射（Unordered\
  \ Maps）\n\n最后，让我们讨论 `unordered_map`，它与 `map` 类似，但使用哈希表而不是二叉搜索树进行存储。这使得查找、插入和删除具有平均常数的时间复杂度。因为它不维护任何特定顺序，元素是根据它们的哈希值存储的。\n\
  \n当你需要快速访问且不在乎元素顺序时，选择 `unordered_map` 是有益的。例如，如果你正在实现一种缓存机制，需要快速查找值而无需排序，那么 `unordered_map`\
  \ 是理想的。这是一个示例：\n\n```cpp\n#include <iostream>\n#include <unordered_map>\n#include\
  \ <string>\n\nint  main() {\nstd::unordered_map<std::string, int> userAges;  //\
  \ 创建一个无序 map\n\n// 插入用户及其年龄\nuserAges[\"Alice\"] = 30;\nuserAges[\"Bob\"] = 25;\n\
  userAges[\"Charlie\"] = 35;\n\n// 显示年龄\nstd::cout << \"Ages of Users:\\n\";\nfor\
  \ (const  auto& user : userAges) {\nstd::cout << user.first << \": \" << user.second\
  \ << \" years old\\n\";\n}\n\n// 查找特定用户\nauto it = userAges.find(\"Charlie\");\n\
  if (it != userAges.end()) {\nstd::cout << \"Charlie's age: \" << it->second << std::endl;\n\
  }\n\nreturn  0;\n}\n```\n\n在代码段中，我们使用 `unordered_map` 来实现与 `map` 类似的功能，但没有了维护顺序的开销。当你处理快速查找至关重要的大数据集时，`unordered_map`\
  \ 的性能优势就会变得显而易见。\n\n总之，理解不同的 STL 容器对于有效的 C++ 编程至关重要。每个容器——`vector`、`list`、`map`\
  \ 和 `unordered_map`——都满足特定的需求并提供独特的优势。\n\n*   `Vectors` 非常适合快速访问的动态数组。\n*   `Lists`\
  \ 擅长频繁的插入和删除。\n*   `Maps` 为关联数据存储提供了排序的键值对。\n*   `Unordered Maps` 在不需要顺序的情况下提供快速访问。\n\
  \n## 11.2 迭代器与算法\n\n在我们继续对标准模板库（STL）的探索时，现在我们将关注两个核心组件：迭代器和算法。这些元素共同使你能够高效地遍历和操作存储在\
  \ STL 容器中的数据。理解如何有效使用迭代器和算法对于在你的 C++ 编程工作中充分利用 STL 的潜力至关重要。\n\n### 迭代器\n\n迭代器是提供了一种通用方式来访问容器元素的对象，而不暴露该容器的底层结构。你可以将迭代器想象成指针，允许你在集合的元素之间导航。它们是\
  \ STL 的一项关键特性，允许你编写通用且可重用的代码。\n\nSTL 中有几种类型的迭代器，包括：\n\n1.  `Input Iterators`（输入迭代器）：允许你从容器中读取数据。\n\
  2.  `Output Iterators`（输出迭代器）：允许你向容器写入数据。\n3.  `Forward Iterators`（前向迭代器）：可以读写数据，且只能向前移动。\n\
  4.  `Bidirectional Iterators`（双向迭代器）：可以向前向后移动。\n5.  `Random Access Iterators`（随机访问迭代器）：允许以常数时间访问任何元素，类似于指针。\n\
  \n让我们看看迭代器在 `vector` 中是如何工作的：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  \nint  main() {\nstd::vector<int> numbers {1, 2, 3, 4, 5};\n\n// 使用迭代器遍历 vector\n\
  std::vector<int>::iterator it = numbers.begin();\nstd::cout << \"Numbers in the\
  \ vector:\\n\";\nwhile (it != numbers.end()) {\nstd::cout << *it << \" \";\nit++;\
  \ // 移动到下一个元素\n}\nstd::cout << std::endl;\nreturn  0;\n}\n```\n\n在这个示例中，我们创建了一个整数\
  \ `vector`，并使用迭代器遍历并打印每个数字。`begin()` 函数返回指向第一个元素的迭代器，而 `end()` 返回指向最后一个元素之后的迭代器。\n\
  \n### 算法\n\nSTL 还提供了一系列丰富的算法，通过迭代器操作容器元素。这些算法被设计为通用的，意味着它们适用于任何提供相应迭代类型的容器。这允许你用极少的代码执行复杂的操作。一些常见的\
  \ STL 算法包括：\n\n*   排序：`std::sort`\n*   搜索：`std::find`\n*   转换：`std::transform`\n\
  *   计数：`std::count`\n\n让我们来说明如何在 `vector` 中使用这些算法。例如，我们会对一组数字排序并查找特定元素：\n\n```cpp\n\
  #include <iostream>\n#include <vector>\n#include <algorithm> // 用于 std::sort 和 std::find\n\
  \nint  main() {\nstd::vector<int> numbers {5, 3, 1, 4, 2};\n\n// 排序排序\nstd::sort(numbers.begin(),\
  \ numbers.end());\nstd::cout << \"Sorted Numbers:\\n\";\nfor (const  auto& number\
  \ : numbers) {\nstd::cout << number << \" \";\n}\nstd::cout << std::endl;\n\n//\
  \ 在 vector 中查找数字\nint target = 3;\nauto it = std::find(numbers.begin(), numbers.end(),\
  \ target);\n\nif (it != numbers.end()) {\nstd::cout << \"Found \" << target << \"\
  \ at position: \" << std::distance(numbers.begin(), it) << std::endl;\n} else {\n\
  std::cout << target << \" not found!\" << std::endl;\n}\n\nreturn  0;\n}\n```\n\n\
  ### 迭代器与算法的结合\n\nSTL 的最大优势之一是迭代器和算法是如何无缝协作的。你可以链用算法以简洁且高效的方式执行复杂操作。例如，你可以转换元素、对它们排序，然后查找特定元素，这一切在一个连贯的流程中完成。\n\
  \n\n\n假设我们想要将向量中的每个数字乘以倍，然后对结果进行排序：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include <algorithm> // 用于 std::sort 和 std::transform\n\nint main() {\n    std::vector<int>\
  \ numbers {5, 3, 1, 4, 2};\n    std::vector<int> doubled;\n    // 将每个数字乘以倍\n   \
  \ std::transform(numbers.begin(), numbers.end(), std::back_inserter(doubled), [](int\
  \ n) { return n * 2; });\n    // 对翻倍后的数字进行排序\n    std::sort(doubled.begin(), doubled.end());\n\
  \    std::cout << \"Doubled and Sorted Numbers:\\n\";\n    for (const auto& number\
  \ : doubled) {\n        std::cout << number << \" \";\n    }\n    std::cout << std::endl;\n\
  \    return 0;\n}\n```\n\n在这段代码中，我们使用 `std::transform` 将 `numbers` 向量中的每个数字乘以倍，并将结果存储在一个新的\
  \ `doubled` 向量中。Lambda 函数 `[](int n) { return n * 2; }` 定义了我们如何转换每个元素。翻倍后，我们对 `doubled`\
  \ 向量进行排序并打印结果。\n\n## 11.3 在 C++17 中使用 std::optional 和 std::variant\n\nC++17 引入了若干新特性，显著增强了语言的表达能力和安全性。其中\
  \ `std::optional` 和 `std::variant` 是两个强大的工具，它们允许你处理值可能缺失或变量可以持有多种类型之一的情况。理解这些构造可以帮助你写出更清晰、更健壮的代码。\n\
  \n### std::optional\n\n`std::optional` 是一个模板类，表示一个可选值——本质上，是一个可能存在也可能不存在的值。这对于可能无法返回有效结果的函数特别有用。与其使用指针或特殊的哨兵值来指示“无结果”，`std::optional`\
  \ 提供了一种更类型安全且更具表达力的机制。\n\n#### std::optional 的用例\n\n考虑一个在数据库中搜索用户并返回其年龄的函数。如果用户不存在，我们不想返回一个无效的年龄或空指针。相反，我们可以使用\
  \ `std::optional<int>` 来明确指示年龄可能不存在。\n\n以下是可能的实现方式：\n\n```cpp\n#include <iostream>\n\
  #include <optional>\n#include <string>\n#include <unordered_map>\n\nclass UserDatabase\
  \ {\npublic:\n    void addUser(const std::string& name, int age) {\n        users[name]\
  \ = age;\n    }\n    std::optional<int> getUserAge(const std::string& name) const\
  \ {\n        auto it = users.find(name);\n        if (it != users.end()) {\n   \
  \         return it->second; // 如果找到则返回年龄\n        }\n        return std::nullopt;\
  \ // 指示未找到用户\n    }\nprivate:\n    std::unordered_map<std::string, int> users; //\
  \ 一个简单的用户数据库\n};\n\nint main() {\n    UserDatabase db;\n    db.addUser(\"Alice\"\
  , 30);\n    db.addUser(\"Bob\", 25);\n    // 尝试获取年龄\n    for (const auto& name :\
  \ {\"Alice\", \"Bob\", \"Charlie\"}) {\n        std::optional<int> age = db.getUserAge(name);\n\
  \        if (age) {\n            std::cout << name << \"'s age: \" << *age << std::endl;\
  \ // 解引用获取值\n        } else {\n            std::cout << name << \" not found in\
  \ the database.\" << std::endl;\n        }\n    }\n    return 0;\n}\n```\n\n在这个示例中，`getUserAge`\
  \ 方法返回一个 `std::optional<int>`。如果用户存在于数据库中，它返回年龄；否则，返回 `std::nullopt`。这种方法避免了使用原始指针或特殊值来指示不存在的陷阱，使代码更易读且易维护。\n\
  \n### std::variant\n\n`std::variant` 是另一个 C++17 特性，允许你创建一个类型安全的联合（union）。它可以持有预定义类型集合中的其中一个值，提供了一种在保持类型安全的同时处理多种类型的方法。这在变量可以代表不同类型数据的情景下特别有用。\n\
  \n#### std::variant 的用例\n\n考虑这样一个场景：你需要表示一个既可以是圆形也可以是矩形的形状。与其使用继承和多态，你可以使用 `std::variant`\
  \ 安全地持有其中一种类型。\n\n以下是实现方式：\n\n```cpp\n#include <iostream>\n#include <variant>\n\
  #include <cmath>\n\nstruct Circle {\n    double radius;\n};\n\nstruct Rectangle\
  \ {\n    double width;\n    double height;\n};\n\nusing Shape = std::variant<Circle,\
  \ Rectangle>;\n\ndouble area(const Shape& shape) {\n    return std::visit([](const\
  \ auto& s) -> double {\n        if constexpr (std::is_same_v<decltype(s), Circle>)\
  \ {\n            return M_PI * s.radius * s.radius; // 圆形的面积\n        } else if\
  \ constexpr (std::is_same_v<decltype(s), Rectangle>) {\n            return s.width\
  \ * s.height; // 矩形的面积\n        }\n    }, shape);\n}\n\nint main() {\n    Shape\
  \ circle = Circle{5.0}; // 创建一个半径为 5 的圆形\n    Shape rectangle = Rectangle{4.0, 6.0};\
  \ // 创建一个矩形\n    std::cout << \"Circle area: \" << area(circle) << std::endl;\n\
  \    std::cout << \"Rectangle area: \" << area(rectangle) << std::endl;\n    return\
  \ 0;\n}\n```\n\n在这个示例中，`area` 函数使用 `std::visit` 来处理 `Shape` 中持有的类型。\n\n### 结论\n\n\
  `std::optional` 和 `std::variant` 是强大的特性，简化了现代 C++ 中对可选性和多种类型的处理。\n\n# 第 12 章 – 移动语义与右值引用\n\
  \n## 12.1 理解左值和右值\n\n在现代 C++ 中，理解左值（lvalues）和右值（rvalues）对于编写高效代码至关重要。让我们深入探讨左值和右值的微妙之处，探索它们的定义、特征和影响。\n\
  \n从核心上说，左值是指引用一个内存的位置，该位置可以持续到单个表达式之外。这意味着左值具有可识别的地址，你可以使用地址操作符 `&` 来访问它。左值的常见示例包括：\n\
  \n*   变量：当你声明一个变量时，它占据一个特定的内存位置。例如在以下代码中：\n```cpp\nint x = 10; // x 是左值\n```\n这里，`x`\
  \ 是左值，因为它有一个固定地址。\n\n*   数组：数组名称可以被视为左值。虽然数组本身不能赋值，但可以访问它的元素：\n```cpp\nint arr[5]\
  \ = {1, 2, 3, 4, 5}; // arr 是左值\n```\n\n*   解引用指针：当你解引用指针时，你访问它所指向的值，这是一个左值：\n```cpp\n\
  int* ptr = &x;\n*ptr = 20; // *ptr 是左值\n```\n\n相反，右值是指表示临时对象的表达式，它没有持久的地址。右值通常包括：\n\
  \n*   字面量：硬编码在程序中的数字或字符串：\n```cpp\nint y = 5; // 5 是右值\n```\n\n*   临时对象：这些对象在表达式期间创建，通常只存在于该表达式。例如：\n\
  ```cpp\nint z = x + 5; // x + 5 是右值\n```\n在这种情况下，表达式 `x + 5` 生成了一个临时结果用于初始化 `z`。\n\
  \n*   函数返回值：按值返回的函数通常产生右值。如果函数返回一个临时对象，它表现为右值：\n```cpp\nArray createArray(size_t\
  \ size) {\n    return Array(size); // 返回的 Array 是右值\n}\n```\n\n左值和右值的区别对于理解 C++\
  \ 如何管理资源至关重要，特别是在性能方面。在 C++11 及更高版本中，右值引用（用 `&&` 表示）的引入允许开发者将右值绑定到引用，从而开启了一种被称为移动语义的范式转移。\n\
  \n\n\n\n移动语义（Move semantics）允许资源的转移而非拷贝，这可以显著提高性能，特别是在涉及动态内存分配的场景中。为了说明这一点，考虑一个管理动态数组的类：\n\
  \n```cpp\nclass Array {\npublic:\n    int* data; // 指数组的指针\n    size_t size; //\
  \ 数组的大小\n    // 构造函数\n    Array(size_t s) : size(s), data(new int[s]) {}\n    //\
  \ 析构函数\n    ~Array() { delete[] data; }\n    // 构造函数\n    Array(const Array& other)\
  \ : size(other.size), data(new int[other.size]) {\n        std::copy(other.data,\
  \ other.data + size, data); // 深拷贝\n    }\n    // 移动构造函数\n    Array(Array&& other)\
  \ noexcept : size(other.size), data(other.data) {\n        other.data = nullptr;\
  \ // 让 'other' 保持有效状态\n        other.size = 0;\n    }\n};\n```\n\n在这个示例中，`Array`\
  \ 类既有构造函数又有移动构造函数。构造函数创建一个新的 `Array` 实例并对源数组的元素进行深拷贝。虽然这很直观，但在性能上可能是代价昂贵的，特别是对于大数组而言。\n\
  \n然而，移动构造函数采取了不同的方法。它将 `data` 指针的所有权从 `other` 实例转移到新实例，这意味着没有发生内存分配或拷贝。相反，`other`\
  \ 实例的指针被设置为 `nullptr`，有效地使其处于一个有效但空的状态。这种所有权的转移不仅高效，而且简化了内存管理，减少了内存泄漏或双重释放的风险。\n\
  \n为了进一步阐明左值（lvalues）和右值（rvalues）的实际意义，让我们来考虑这些概念如何影响函数设计。当你向函数传递参数时，理解它们是左值还是右值可以指导你选择恰当的参数传递方法。\n\
  \n例如，如果你有一个接收大型对象的函数，通常使用移动语义来避免不必要的拷贝会更好：\n\n```cpp\nvoid processArray(Array arr)\
  \ {\n    // 函数逻辑\n}\n```\n\n在这个示例中，如果你传递一个左值 `arr`，则会产生拷贝，这可能是低效的。或者，考虑使用右值引用（rvalue\
  \ reference）：\n\n```cpp\nvoid processArray(Array&& arr) {\n    // 函数逻辑\n}\n```\n\
  \n现在，当你使用临时对象或显式移动的对象调用此函数时，该函数可以利用移动语义，从而实现更高效的操作。\n\n理解左值和右值在运算符重载中也起着至关重要的作用。当你重载运算符时，可以定义你的类如何与左值和右值进行交互，这可以产生更直观、更高效的代码。例如，如果你重载了赋值运算符，你可能希望处理两种情况：\n\
  \n```cpp\nArray& operator=(Array other) {\n    swap(*this, other); // 使用交换并交换用法\
  \ (Use-and-swap idiom)\n    return *this;\n}\n```\n\n在这个运算符重载中，我们通过值传递获取参数，允许构造函数创建传入对象的拷贝。这种方法无缝地处理了左值和右值，当参数是右值时利用移动语义的效率，从而优化了性能。\n\
  \n## 12.2 实现移动构造函数和移动赋值\n\n在对左值和右值建立良好理解后，我们现在可以深入研究移动构造函数和移动赋值运算符的实现。这些特性对于利用现代\
  \ C++ 中的移动语义至关重要，允许我们优化资源管理并增强应用程序的性能。\n\n### 移动构造函数\n\n移动构造函数是一个特殊的构造函数，将资源的所有权从一个对象转移到另一个对象。当我们定义移动构造函数时，它接收指向同类另一个实例的右值引用。这允许我们“窃取”源对象的资源而不是拷贝它们，这对于管理动态内存或其他资源的类来说特别有益。\n\
  \n让我们重新回顾 `Array` 类并详细实现移动构造函数：\n\n```cpp\nclass Array {\npublic:\n    int* data;\
  \ // 指数组的指针\n    size_t size; // 数组的大小\n    // 构造函数\n    Array(size_t s) : size(s),\
  \ data(new int[s]) {}\n    // 析构函数\n    ~Array() { delete[] data; }\n    // 构造函数\n\
  \    Array(const Array& other) : size(other.size), data(new int[other.size]) {\n\
  \        std::copy(other.data, other.data + size, data);\n    }\n    // 移动构造函数\n\
  \    Array(Array&& other) noexcept : size(other.size), data(other.data) {\n    \
  \    other.data = nullptr; // 让 'other' 保持有效状态\n        other.size = 0; // 重置大小以防止双重释放\n\
  \    }\n};\n```\n\n在此实现中，移动构造函数接收右值引用 `Array&& other`，并直接从 `other` 初始化新对象的 `data`\
  \ 指针和大小。在转移所有权后，我们将 `other.data` 设置为 `nullptr` 将 `other.size` 设置为 `0`。这确保了被移动的对象保持在有效状态，防止了对已释放内存的意外访问。\n\
  \n### 移动赋值运算符\n\n移动赋值运算符的操作类似，但它用于将来自右值的值赋值给一个已经存在的对象。要实现移动赋值运算符，我们遵循以下几个关键步骤：\n\
  \n1. **自赋值检查**：首先，我们需要检查是否存在自赋值以避免不必要的工作。如果被赋值的对象与当前对象相同，我们可以直接返回。\n2. **释放当前资源**：在转移所有权之前，我们应该释放对象持有的任何资源。\n\
  3. **转移所有权**：最后，我们将右值的资源转移到当前对象。\n\n以下是为 `Array` 类实现移动赋值运算符：\n\n```cpp\nclass Array\
  \ {\npublic:\n    int* data; // 指数组的指针\n    size_t size; // 数组的大小\n    // 构造函数、析构函数和构造函数\
  \ ...\n    // 移动赋值运算符\n    Array& operator=(Array&& other) noexcept {\n        if\
  \ (this != &other) { // 自赋值检查\n            delete[] data; // 释放当前资源\n          \
  \  data = other.data; // 转移所有\n            size = other.size;\n            other.data\
  \ = nullptr; // 让 'other' 保持有效状态\n            other.size = 0; // 重置大小\n        }\n\
  \        return *this; // 返回当前对象\n    }\n};\n```\n\n在此实现中，移动赋值运算符首先检查 `this` 是否等于\
  \ `other`。如果相同，函数立即返回以避免不必要的工作。接下来，我们释放 `data` 当前持有的内存。然后我们将 `other.data` 和 `other.size`\
  \ 的所有权转移给当前对象，并将 `other.data` 设置为 `nullptr`。\n\n#### 实例示例\n\n为了说明移动语义的用处，让我们来看一个实例示例。考虑创建一个数组、对其进行修改并将其赋值给另一个数组的场景：\n\
  \n```cpp\nArray createArray(size_t size) {\n    return Array(size); // 返回右值\n}\n\
  \nint main() {\n    Array arr1 = createArray(10); // 触发移动构造函数\n    Array arr2 =\
  \ std::move(arr1); // 触发移动赋值运算符\n    // 此时，arr1 处于有效但未定义的状态\n    // 访问 arr1.data\
  \ 将是不安全的\n}\n```\n\n在这个示例中，`createArray` 函数返回一个 `Array` 对象，它是一个右值。当我们将其赋值给 `arr1`\
  \ 时，移动移动构造函数转移了资源的所有权。随后，我们使用 `std::move(arr1)` 将 `arr1` 转换为右值，从而触发移动赋值运算符转移资源。在此操作之后，`arr1`\
  \ 被留在一个有效但未定义的状态，这意味着在对其重新初始化或赋值之前，不应使用它。\n\n### 最佳实践\n\n在实现移动构造函数和移动赋值运算符时，考虑以下最佳实践：\n\
  \n1. **`noexcept` 规范**：始终将移动构造函数和赋值运算符标记为 `noexcept`。这允许它们在要求异常安全的情况下被安全使用，例如在标准容器中。\n\
  \n\n\n\n\n2. **自赋值检查**：在移动赋值运算符中，始终要检查自赋值情况，以防止意外行为。\n\n3. **让被移动后的对象保持有效状态**：在移动之后，确保被移动的对象处于有效状态，例如将指针设置为\
  \ `nullptr` 或重置大小。\n\n4. **五法则（Rule of Five）**：如果你实现了一个移动构造函数或移动赋值运算符，请考虑你是否也需要实现拷贝构造函数、赋值运算符和析构函数。这在\
  \ C++ 中被称为“五法则”，它指出如果你定义了这些特殊成员函数中的一个，那么你可能应该定义所有五个个。\n\n## 12.3 移动语义的性能优势\n\n在我们探索现代\
  \ C++ 中移动语义的性能优势时，理解这一强大功能如何提高效率至关重要，特别是在资源密集型应用程序中。移动语义引入于 C++11，它允许资源从一个对象转移到另一个对象，而无需产生深拷贝的开销。\n\
  \n### 减少开销\n\n移动语义的主要优势之一是极大地减少了拷贝开销。当你复制一个对象时（特别是管理动态内存或其他资源的对象），系统必须分配新内存并将所有内容从源对象拷贝到目标对象。这种拷贝操作可能是耗时且耗资源的，对于大型对象尤其如此。\n\
  \n考虑一个管理动态数组的简单类。如果没有移动语义，传输此数组将需要完全的深拷贝，如下例：\n\n```cpp\nclass Array {\npublic:\n\
  \    int* data;\n    size_t size;\n    Array(size_t s) : size(s), data(new int[s])\
  \ {}\n    Array(const Array& other) : size(other.size), data(new int[other.size])\
  \ {\n        std::copy(other.data, other.data + size, data);\n    }\n};\n```\n\n\
  在这段代码中，当你拷贝一个 `Array` 对象时，拷贝构造函数会创建一个新数组并拷贝每个元素。这个操作可能是昂贵的，特别是随着数组大小的增长。\n\n然而，通过移动语义，你可以在不拷贝的情况下转移所有。移动构造函数允许你从源对象获取资源：\n\
  \n```cpp\nArray(Array&& other) noexcept : size(other.size), data(other.data) {\n\
  \    other.data = nullptr; // 让 'other' 保持有效状态\n}\n```\n\n这种方法意味着无需分配新内存和拷贝数据，只需简单地重新分配指针。性能的提升可以是巨大的，特别是在频繁创建和销毁大型对象的场景中，例如容器内部或函数返回期间。\n\
  \n### 优化容器中的资源管理\n\nC++ 中的标准容器（如 `std::vector`、`std::string` 和 `std::map`）直接受益于移动语义。当对象存储在这些容器中时，移动元素而非拷贝元素的能力带来了显著的性能提升。例如，当调整\
  \ `std::vector` own 运行时，它可能需要重新分配内存来容纳新元素。有了移动语义，现有元素可以移动到新的内存位置，而没有拷贝开销。\n\n这是一个说明此点的简单示例：\n\
  \n```cpp\nstd::vector<Array> arrVec;\nfor (size_t i = 0; i < 1000; ++i) {\n    arrVec.push_back(Array(i));\
  \ // 使用了移动构造函数\n}\n```\n\n在这个循环中，由 `Array(i)` 创建的每个 `Array`都是右值，`std::vector` 可以将这些对象移动到其存储空间。与拷贝元素相比，这降低了插入元素的整体时间复杂度，导致更快的执行速度。\n\
  \n### 改进函数返回值的性能\n\n移动语义另一个大放异彩领域是函数返回值。传统上，从函数返回大型对象会产生深拷贝，这是低效的。有了移动语义，当函数返回一个对象时，返回值可以被移动而非拷贝。\n\
  \n考虑以下返回 `Array` 对象的函数：\n\n```cpp\nArray createArray(size_t size) {\n    return\
  \ Array(size); // 返回的对象是一个右值\n}\n```\n\n在这种情况下，返回值是一个右值，得益于移动语义，移动构造函数被调用，将资源直接转移给调用者。这消除了对拷贝的需要，显著提升了性能。\n\
  \n### 实际示例：移动语义的基准测试\n\n为了说明移动语义的性能优势，让我们进行一个简单的基准测试，比较拷贝与移动对象的性能。我们将创建一个场景，测量拷贝和移动大型数组所需的时间。\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <chrono>\n\nclass Array\
  \ {\npublic:\n    int* data;\n    size_t size;\n    Array(size_t s) : size(s), data(new\
  \ int[s]) {}\n    Array(const Array& other) : size(other.size), data(new int[other.size])\
  \ {\n        std::copy(other.data, other.data + size, data);\n    }\n    Array(Array&&\
  \ other) noexcept : size(other.size), data(other.data) {\n        other.data = nullptr;\n\
  \    }\n    ~Array() { delete[] data; }\n};\n\nvoid Benchmark() {\n    std::vector<Array>\
  \ vec;\n    for (size_t i = 0; i < 1000; ++i) {\n        Array arr(10000); // 大型数组\n\
  \        vec.push_back(arr); // 这将调用拷贝构造函数\n    }\n}\n\nvoid moveBenchmark() {\n\
  \    std::vector<Array> vec;\n    for (size_t i = 0; i < 1000; ++i) {\n        Array\
  \ arr(10000); // 大型数组\n        vec.push_back(std::move(arr)); // 这将调用移动构造函数\n  \
  \  }\n}\n\nint main() {\n    auto start = std::chrono::high_resolution_clock::now();\n\
  \    Benchmark();\n    auto end = std::chrono::high_resolution_clock::now();\n \
  \   std::cout << \"Benchmark: \" << std::chrono::duration_cast<std::chrono::milliseconds>(end\
  \ - start).count() << \" ms\\n\";\n\n    start = std::chrono::high_resolution_clock::now();\n\
  \    moveBenchmark();\n    end = std::chrono::high_resolution_clock::now();\n  \
  \  std::cout << \"Move Benchmark: \" << std::chrono::duration_cast<std::chrono::milliseconds>(end\
  \ - start).count() << \" ms\\n\";\n\n    return 0;\n}\n```\n\n在这个基准测试中，我们创建了两个函数：`Benchmark`\
  \ 和 `moveBenchmark`。第一个函数使用拷贝构造函数推入 `Array` 对象，而第二个函数使用移动构造函数。运行该程序将展示明显的执行差异，体现移动语义的效率。\n\
  \n# 第 13 章 并发与多线程\n\n## 13.1 C++11 及之后的线程\n\n并发是现代软件开发的一个关键方面，允许程序同时执行多个任务。这可以极大提升性能，特别是在多核心处理器上。C++11\
  \ 引入的 `<thread>` 库是一个突破性的进展，允许开发者直接在 C++ 语言中管理线程，为多线程提供了标准方法。\n\n### 理解线程\n\n从本质上说，线程是程序中一个量级的执行路径。一个进程可以包含多个线程，这些线程共享相同的内存空间但可以独立执行。有效创建和管理线程允许开发者编写响应式应用程序，同时处理多个操作，例如在下载文件的同时处理用户输入。\n\
  \n要在 C++ 中使用线程，需要包含 `<thread>` 头文件：\n\n```cpp\n#include <thread>\n```\n\n该头文件提供了创建和管理线程所需的类和函数。创建线程非常简单：实例化\
  \ `std::thread` 类并指定它要执行的函数。这里有一个简单的示例：\n\n```cpp\n#include <iostream>\n#include\
  \ <thread>\n\nvoid printNumbers(int n) {\n    for (int i = 1; i <= n; ++i) {\n \
  \       std::cout << i << \" \";\n    }\n    std::cout << std::endl;\n}\n\nint main()\
  \ {\n    std::thread t(printNumbers, 5); // 创建一个线程运行 printNumbers\n    t.join();\
  \ // 等待线程完成\n    return 0;\n}\n```\n\n\n\n在这个示例中，`printNumbers` 函数由新线程 `t` 调用，该线程打印从\
  \ 1 到 `n` 的数字。`join()` 方法在这里至关重要；它确保主线程在继续执行之前等待线程 `t` 完成，防止主程序过早终止。\n\n### 线程管理：合并（Joining）与分离（Detaching）\n\
  \n当你创建一个线程时，它会与程序的其余部分并发运行。你有两种管理线程生命周期的主要方式：合并（join）和分离（detach）。合并线程意味着主线程将等待指定的线程完成执行。相反，分离线程允许它独立运行。一旦线程被\
  \ `detached`（分离），你就无法再次对其进行 `join`，它将继续在后台运行直到执行完毕。\n\n以下是一个演示这两种方法的示例：\n\n```cpp\n\
  #include <iostream>\n#include <thread>\n#include <chrono>\n\nvoid task() {\n   \
  \ std::cout << \"Task is running in a separate thread.\" << std::endl;\n    std::this_thread::sleep_for(std::chrono::seconds(2));\n\
  \    std::cout << \"Task completed.\" << std::endl;\n}\n\nint main() {\n    std::thread\
  \ t(task);\n    // 取消下面注释以合并线程\n    // t.join();\n    t.detach(); // 现在线程独立运行\n\
  \    std::cout << \"Main thread continues...\" << std::endl;\n    std::this_thread::sleep_for(std::chrono::seconds(3));\
  \ // 等待查看输出\n    std::cout << \"Main thread completed.\" << std::endl;\n    return\
  \ 0;\n}\n```\n\n在这段代码中，`task` 函数在单独线程中运行。如果你取消了 `t.join()` 的注释，主线程将在等待 `task` 完成后继续执行。然而，如果你\
  \ `detach` 了线程，它将继续独立运行，而主线程则继续其自身的执行。\n\n## 线程安全与同步\n\n当多个线程访问共享资源（如全局变量或数据结构）时，存在数据竞态（data\
  \ races）的风险。当两个或多个线程同时修改同一资源时，就会发生数据竞态，导致不可预测的结果。为了确保线程安全，C++11 引入了多种同步原语，最著名的是互斥锁（mutexes）。\n\
  \n互斥锁（mutual exclusion 的缩写）是一种锁定机制，防止多个线程同时访问共享资源。以下是如何使用互斥锁来保护共享变量：\n\n```cpp\n\
  #include <iostream>\n#include <thread>\n#include <mutex>\n\nstd::mutex mtx; // 用于保护共享数据的互斥锁\n\
  int counter = 0; // 共享资源\n\nvoid increment() {\n    for (int i = 0; i < 1000; ++i)\
  \ {\n        std::lock_guard<std::mutex> lock(mtx); // 锁定互斥锁\n        ++counter;\
  \ // 安全地增加计数器\n    }\n}\n\nint main() {\n    std::thread t1(increment);\n    std::thread\
  \ t2(increment);\n    t1.join();\n    t2.join();\n    std::cout << \"Final counter\
  \ value: \" << counter << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，有两个线程在递增共享变量\
  \ `counter`。`std::lock_guard` 在创建时自动锁定 `mtx`，并在离开作用域时释放它。这确保了一次只有一个线程可以递增 `counter`，从而防止了数据竞态。\n\
  \n## 使用条件变量的高级同步\n\n虽然互斥锁对于保护共享数据很有用，但有时你需要线程在继续执行之前等待某些条件。这就是条件变量（condition variables）大显用场。条件变量允许一个线程通知另一个线程特定条件已满足。\n\
  \n以下是一个说明如何使用条件变量的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include\
  \ <mutex>\n#include <condition_variable>\n\nstd::mutex mtx;\nstd::condition_variable\
  \ cv;\nbool ready = false;\n\nvoid worker() {\n    std::unique_lock<std::mutex>\
  \ lock(mtx);\n    while (!ready) {\n        cv.wait(lock); // 等待 ready 为 true\n\
  \    }\n    std::cout << \"Worker thread proceeding with work.\" << std::endl;\n\
  }\n\nint main() {\n    std::thread t(worker);\n    std::this_thread::sleep_for(std::chrono::seconds(1));\
  \ // 模拟工作\n    {\n        std::lock_guard<std::mutex> lock(mtx);\n        ready\
  \ = true; // 将条件置为 true\n    }\n    cv.notify_one(); // 通知工作线程\n    t.join();\n\
  \    return 0;\n}\n```\n\n在这个示例中，工作线程等待 `ready` 标志变为 `true`。主线程模拟了一些工作，然后将 `ready`\
  \ 设置为 `true` 并通知工作线程继续执行。\n\n## C++17 并发性的增强\n\n随着 C++17 的发布，并发模型进行了多项增强。最显著的添加之一是\
  \ `std::shared_mutex`，它允许多个线程并发读取共享资源，但在任何时刻只允许一个线程写入。这在读操作远多于写操作的场景中特别有用。\n\n以下是一个使用\
  \ `std::shared_mutex` 的简单示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n\
  #include <shared_mutex>\n#include <vector>\n\nstd::shared_mutex sharedMtx; // 用于读写的共享互斥锁\n\
  std::vector<int> data; // 共享数据\n\nvoid readData() {\n    std::shared_lock<std::shared_mutex>\
  \ lock(sharedMtx);\n    for (const int& value : data) {\n        std::cout << value\
  \ << \" \";\n    }\n    std::cout << std::endl;\n}\n\nvoid writeData(int value)\
  \ {\n    std::unique_lock<std::shared_mutex> lock(sharedMtx);\n    data.push_back(value);\n\
  }\n\nint main() {\n    std::thread writer1(writeData, 1);\n    std::thread writer2(writeData,\
  \ 2);\n    std::thread reader(readData);\n\n    writer1.join();\n    writer2.join();\n\
  \    reader.join();\n    return 0;\n}\n```\n\n在这个示例中，由于 `shared_mutex`，多个线程可以同时读取\
  \ `data`，而写入操作是排他的。\n\n## C++20：进一步简化\n\nC++20 引入了若干新功能，简化了线程的处理。最著名的添加之一是 `std::jthread`，它在离开作用域时会自动进行合并，防止了忘记合并线程的常见错误。\n\
  \n以下是如何使用 `std::jthread`：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include\
  \ <chrono>\n\nvoid task() {\n    std::cout << \"Task is running in a separate thread.\"\
  \ << std::endl;\n    std::this_thread::sleep_for(std::chrono::seconds(2));\n   \
  \ std::cout << \"Task completed.\" << std::endl;\n}\n\nint main() {\n    std::jthread\
  \ t(task); // 离开作用域时自动合并\n    std::cout << \"Main thread continues...\" << std::endl;\n\
  \    return 0; // 主线程退出；t 自动合并\n}\n```\n\n在这个示例中，`std::jthread` 对象 `t` 运行 `task`\
  \ 函数，当 `main` 函数结束时，`t` 会自动合并，确保了清洁安全的线程管理。C++20 还引入了协程（coroutines），它们提供了一种更自然的方式编写异步代码。\n\
  \n\n\n\n\n```cpp\nfor (int i = 0; i < increments; ++i) {\n    mtx.lock(); // 锁定\
  \ mutex \n    ++sharedCounter; // 安全地增加计数器\n    mtx.unlock(); // 解锁 mutex \n}\n\
  }\n\nint main() {\n    const int incrementsPerThread = 1000;\n    std::thread t1(incrementCounter,\
  \ incrementsPerThread);\n    std::thread t2(incrementCounter, incrementsPerThread);\n\
  \    t1.join();\n    t2.join();\n    std::cout << \"Final counter value: \" << sharedCounter\
  \ << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，两个线程增加了共享变量 `sharedCounter`。互斥锁\
  \ `mtx` 在自加操作周围被显式地锁定和解锁。虽然这种方法有效，但它可能会导致难以维护且容易出错的代码，例如忘记解锁互斥锁。\n\n### 锁保护（Lock\
  \ Guards）：简化互斥锁管理\n\n为了简化互斥锁的管理并防止常见错误，C++ 提供了 `std::lock_guard` 和 `std::unique_lock`\
  \ 类。这些类会自动管理互斥锁的锁定和解锁，确保锁对象离开作用范围时释放互斥锁。\n\n以下是使用 `std::lock_guard` 重写的上一个示例：\n\n\
  ```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\nstd::mutex mtx;\
  \ // 用于保护共享数据的互斥锁\nint sharedCounter = 0; // 共享资源\n\nvoid incrementCounter(int increments)\
  \ {\n    for (int i = 0; i < increments; ++i) {\n        std::lock_guard<std::mutex>\
  \ lock(mtx); // 锁定 mutex\n        ++sharedCounter; // 安全地增加计数器\n    }\n}\n\nint\
  \ main() {\n    const int incrementsPerThread = 1000;\n    std::thread t1(incrementCounter,\
  \ incrementsPerThread);\n    std::thread t2(incrementCounter, incrementsPerThread);\n\
  \    t1.join();\n    t2.join();\n    std::cout << \"Final counter value: \" << sharedCounter\
  \ << std::endl;\n    return 0;\n}\n```\n\n通过使用 `std::lock_guard`，你可以确保互斥锁仅在需要的代码块范围内被锁定。如果发生异常或函数提前返回，互斥锁仍会被释放，从而防止死锁情况。\n\
  \n### 唯一锁（Unique Locks）：更大的灵活性\n\n虽然 `std::lock_guard` 是管理互斥锁的一种简单且有效的方法，但 `std::unique_lock`\
  \ 提供了更大的灵活性。它允许你手动锁定和解锁互斥锁，这在更复杂的场景中非常有用，例如你可能需要根据条件或变量时间来锁定互斥锁。\n\n以下是一个使用 `std::unique_lock`\
  \ 的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n#include\
  \ <chrono>\n\nstd::mutex mtx; // 用于保护共享数据的互斥锁\nint sharedCounter = 0; // 共享资源\n\n\
  void incrementCounter(int increments) {\n    for (int i = 0; i < increments; ++i)\
  \ {\n        std::unique_lock<std::mutex> lock(mtx); // 锁定 mutex\n        ++sharedCounter;\
  \ // 安全地增加计数器\n        // 模拟工作\n        std::this_thread::sleep_for(std::chrono::milliseconds(1));\n\
  \    }\n}\n\nint main() {\n    const int incrementsPerThread = 1000;\n    std::thread\
  \ t1(incrementCounter, incrementsPerThread);\n    std::thread t2(incrementCounter,\
  \ incrementsPerThread);\n    t1.join();\n    t2.join();\n    std::cout << \"Final\
  \ counter value: \" << sharedCounter << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，使用了\
  \ `std::unique_lock`，允许你在锁定互斥锁并在持有锁的期间模拟一些一些工作。当 `std::unique_lock` 离开作用范围时，锁将自动释放。\n\
  \n### 条件变量（Condition Variables）：线程同步\n\n虽然互斥锁和锁对于保护共享数据至关重要，但有时你需要一种方法让线程在继续执行之前等待某些条件的满足。这就是条件变量发挥用场的地方。条件变量允许一个或多个线程等待，直到收到通知条件已满足。\n\
  \n要使用条件变量，你需要包含 `<condition_variable>` 头文件：\n\n```cpp\n#include <condition_variable>\n\
  ```\n\n以下是一个说明如何使用条件变量的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include\
  \ <mutex>\n#include <condition_variable>\n\nstd::mutex mtx; // 用于保护共享数据的互斥锁\nstd::condition_variable\
  \ cv; // 条件变量\nbool ready = false; // 条件标记\n\nvoid worker() {\n    std::unique_lock<std::mutex>\
  \ lock(mtx);\n    cv.wait(lock, [] { return ready; }); // 等待直到 ready 为 true\n  \
  \  std::cout << \"工作线程继续执行工作。\" << std::endl;\n}\n\nint main() {\n    std::thread\
  \ t(worker);\n    std::this_thread::sleep_for(std::chrono::seconds(1)); // 模拟工作\n\
  \    {\n        std::lock_guard<std::mutex> lock(mtx);\n        ready = true; //\
  \ 将条件设为 true\n    }\n    cv.notify_one(); // 通知工作线程\n    t.join();\n    return 0;\n\
  }\n```\n\n在这个示例中，工作线程等待 `ready` 标记变为 true。主线程模拟了一些工作，然后将 `ready` 设为 true。### 多线程通知与复杂场景\n\
  \n虽然互斥锁和锁对于保护共享数据至关重要，但有时你需要一种方法让线程在继续执行之前等待某些条件的满足。条件变量还可以处理更复杂的场景，例如通知所有等待的线程\
  \ `cv.notify_all()`。以下是一个使用条件变量的简单生产者-消费者示例：\n\n```cpp\n#include <iostream>\n#include\
  \ <thread>\n#include <mutex>\n#include <condition_variable>\n#include <queue>\n\n\
  std::mutex mtx; // 用于保护共享数据的互斥锁\nstd::condition_variable cv; // 条件变量\nstd::queue<int>\
  \ buffer; // 缓冲区\nconst unsigned int maxBufferSize = 5; // 最大缓冲区大小\n\nvoid producer()\
  \ {\n    for (int i = 0; i < 10; ++i) {\n        std::this_thread::sleep_for(std::chrono::milliseconds(100));\
  \ // 模拟工作\n        std::unique_lock<std::mutex> lock(mtx);\n        cv.wait(lock,\
  \ [] { return buffer.size() < maxBufferSize; }); // 如果缓冲区满了等待\n        buffer.push(i);\
  \ // 生产项目\n        std::cout << \"生产: \" << i << std::endl;\n        cv.notify_all();\
  \ // 通知消费者\n    }\n}\n\nvoid consumer() {\n    for (int i = 0; i < 10; ++i) {\n\
  \        std::this_thread::sleep_for(std::chrono::milliseconds(150)); // 模拟工作\n\
  \        std::unique_lock<std::mutex> lock(mtx);\n        cv.wait(lock, [] { return\
  \ !buffer.empty(); }); // 如果缓冲区为空等待\n        int value = buffer.front(); // 消费项目\n\
  \        buffer.pop();\n        std::cout << \"消费: \" << value << std::endl;\n \
  \       cv.notify_all(); // 通知生产者\n    }\n}\n\nint main() {\n    std::thread p(producer);\n\
  \    std::thread c(consumer);\n    p.join();\n    c.join();\n    return 0;\n}\n\
  ```\n\n在这个示例中，生产者线程生成整数并将其添加到缓冲区，而消费者线程从缓冲区移除项目。两个线程都使用条件变量来防止上溢和下溢。## 13.3 使用 std::async\
  \ 和 Future 进行异步编程\n\n异步编程是一种强大的技术，允许编写可以并发执行而不阻塞主线程的代码。在 C++ 中，C++11 引入的 `std::async`\
  \ 和 `std::future` 为异步操作提供了方便的方法。这些功能允许你在程序继续运行的同时在后台执行任务。\n\n### 理解 std::async\n\
  \n`std::async` 函数允许你异步运行函数。它创建一个新线程或使用现有的线程池来执行函数，并返回一个 `std::future` 对象，该对象是异步操作结果的占位符。这意味着你可以在期间执行其他代码，并在结果准备好后获取它。\n\
  \n要使用 `std::async`，你需要包含 `<future>` 头文件：\n\n```cpp\n#include <future>\n```\n\n以下是一个说明\
  \ `std::async` 如何工作的简单示例：\n\n```cpp\n#include <iostream>\n#include <future>\n#include\
  \ <chrono>\n\nint calculateSum(int a, int b) {\n    std::this_thread::sleep_for(std::chrono::seconds(2));\
  \ // 模拟长时间计算\n    return a + b;\n}\n\nint main() {\n    std::future<int> result\
  \ = std::async(std::launch::async, calculateSum, 10, 20);\n    std::cout << \"正在计算和...\"\
  \ << std::endl;\n    // 在这里可以做其他事情\n    std::cout << \"结果是: \" << result.get() <<\
  \ std::endl;\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\nstd::future<int> result =\
  \ std::async(std::launch::async, calculateSum, 5, 10);\n\nstd::cout << \"Doing other\
  \ work while waiting for the result...\" << std::endl;\n\n// Do some other work\
  \ here...\n\nstd::this_thread::sleep_for(std::chrono::seconds(1));\n\n// Get the\
  \ result (this will block if the result is not ready yet)\n\nint sum = result.get();\n\
  \nstd::cout << \"The sum is: \" << sum << std::endl;\n\nreturn  0;\n}\n```\n\n在这个示例中，`calculateSum`\
  \ 函数通过睡眠两秒来模拟一个长时间运行的计算。我们调用 `std::async` 来异步运行该函数。`std::launch::async` 策略确保它在新的线程上运行。在后台进行计算时，主线程可以继续执行其他代码。当我们调用\
  \ `result.get()` 时，它会获取计算结果。如果结果尚未就绪，它将会阻塞，直到计算完成。\n\n### 使用 std::future\n\n`std::async`\
  \ 返回的 `std::future` 对象提供了几个与异步操作交互的方法。最常用的方法有：\n\n*   `get()`：获取异步操作的结果。如果操作未完成，它将阻塞直到结果可用。\n\
  *   `valid()`：检查 `std::future` 对象是否包含一个有效的结果。\n\n这里是一个展示这些功能的更详尽的示例：\n\n```cpp\n\
  #include <iostream>\n#include <future>\n#include <vector>\n#include <numeric>\n\n\
  int  accumulateSum(const std::vector<int>& numbers) {\n    return std::accumulate(numbers.begin(),\
  \ numbers.end(), 0);\n}\n\nint  main() {\n    std::vector<int> nums = {1, 2, 3,\
  \ 4, 5};\n    // 开始异步求和计算\n    std::future<int> result = std::async(std::launch::async,\
  \ accumulateSum, nums);\n    // 执行其他工作\n    std::cout << \"Calculating sum asynchronously...\"\
  \ << std::endl;\n    // 检查 future 是否有效\n    if (result.valid()) {\n        int sum\
  \ = result.get(); // 获取结果\n        std::cout << \"The sum is: \" << sum << std::endl;\n\
  \    } else {\n        std::cout << \"Future is not valid.\" << std::endl;\n   \
  \ }\n    return  0;\n}\n```\n\n在这个示例中，我们异步计算一个整数向量的和。我们使用 `std::accumulate` 来执行求和，并使用\
  \ `result.get()` 获取结果。这允许主线程在等待计算总和的同时执行其他任务。\n\n### 在 Future 中处理异常\n\n在处理异步操作时，可能会发生异常。如果异步函数中抛出了异常，它将在你对\
  \ `std::future` 调用 `get()` 时被捕获并重新抛出。这允许你以一种简洁且可管理的方式处理异常。\n\n这里是一个使用 futures 处理异常的示例：\n\
  \n```cpp\n#include <iostream>\n#include <future>\n#include <stdexcept>\n\nint  riskyCalculation(int\
  \ a) {\n    if (a < 0) {\n        throw std::runtime_error(\"Negative value error\"\
  );\n    }\n    return a * 2;\n}\n\nint  main() {\n    std::future<int> result =\
  \ std::async(std::launch::async, riskyCalculation, -5);\n    try {\n        int\
  \ value = result.get(); // 如果发生异常，这里将抛出异常\n        std::cout << \"Result: \" <<\
  \ value << std::endl;\n    } catch (const std::exception& e) {\n        std::cout\
  \ << \"Caught an exception: \" << e.what() << std::endl;\n    }\n    return  0;\n\
  }\n```\n\n在这个示例中，如果传递负值，函数 `riskyCalculation` 会抛出一个异常。调用 `result.get()` 时，异常会被重新抛出，允许我们在主线程中捕获它并优雅地处理。\n\
  \n### 将 Futures 与 std::wait_for 和 std::wait_until 结合\n\n`std::future` 还提供了 `wait_for`\
  \ 和 `wait_until` 等方法，允许你等待指定的持续时间或直到特定时间点结果就绪，而不会无限阻塞。这在需要实现超时逻辑的场景下特别有用。\n\n这里是一个使用\
  \ `wait_for` 的示例：\n\n```cpp\n#include <iostream>\n#include <future>\n#include <chrono>\n\
  \nint  longRunningTask() {\n    std::this_thread::sleep_for(std::chrono::seconds(5));\
  \ // 模拟一个长时间的任务\n    return  42;\n}\n\nint  main() {\n    std::future<int> result\
  \ = std::async(std::launch::async, longRunningTask);\n    // 最等待结果 3 秒\n    if (result.wait_for(std::chrono::seconds(3))\
  \ == std::future_status::timeout) {\n        std::cout << \"The task is still running\
  \ after 3 seconds.\" << std::endl;\n    } else {\n        std::cout << \"The result\
  \ is ready: \" << result.get() << std::endl;\n    }\n    return  0;\n}\n```\n\n\
  在这个示例中，我们等待长时间运行任务的结果最多三秒。如果任务未完成，我们相应地处理超时情况。这允许我们的应用程序在等待结果的同时可能需要执行其他任务时保持响应性。\n\
  \n# 第 14 章 – C++17 和 C++20 的新特性\n\n## 14.1 结构化绑定与 if constexpr\n\n当我们探索 C++17 和\
  \ C++20 引入的增强时，有两个卓越的脱颖而出：结构化绑定和 `if constexpr`。\n\n### 结构化绑定 (Structured Bindings)\n\
  \n结构化绑定代表了我们管理数据方式的一次飞跃。在 C++17 之前，处理 tuple、pair 甚至是自定义结构通常涉及繁琐的语法。通过结构化绑定，我们可以以一种直观的方式来解包这些类型。让我们先考虑一个返回\
  \ pair 的函数：\n\n```cpp\n#include <utility>\n#include <iostream>\n\nstd::pair<int,\
  \ int> getCoordinates() {\n    return {10, 20};\n}\n\nint  main() {\n    auto [x,\
  \ y] = getCoordinates();\n    std::cout << \"X: \" << x << \", Y: \" << y << std::endl;\n\
  \    return  0;\n}\n```\n\n在此段代码中，`auto [x, y]` 有效地将 `getCoordinates()` 返回的值直接绑定到\
  \ `x` 和 `y`，提高了清晰度和简洁性。结构化绑定也可以应用于数组和用户定义类型。例如，让我们使用 struct 一个更复杂的示例：\n\n```cpp\n\
  #include <iostream>\n\nstruct Point {\n    int x, y;\n};\n\nPoint getPoint() {\n\
  \    return {5, 15};\n}\n\nint  main() {\n    auto [x, y] = getPoint();\n    std::cout\
  \ << \"Point coordinates: (\" << x << \", \" << y << \")\" << std::endl;\n    return\
  \  0;\n}\n```\n\n在这里，我们定义了一个 `Point` 结构体，并使用结构化绑定提取 `x` 和 `y` 值。这种解包操作在处理 STL 容器时特别有益，因为遍历元素可能会变得冗长。例如，考虑一个想要遍历键值对的\
  \ map：\n\n```cpp\n#include <iostream>\n#include <map>\n\nint  main() {\n    std::map<std::string,\
  \ int> wordCount = {\n        {\"apple\", 5},\n        {\"banana\", 3},\n      \
  \  {\"orange\", 8}\n    };\n    for (const  auto& [word, count] : wordCount) {\n\
  \        std::cout << word << \": \" << count << std::endl;\n    }\n    return \
  \ 0;\n}\n```\n\n在这种情况下，`const auto& [word, count]` 允许我们简洁地绑定 `wordCount` map 中的每个键和值，使得循环不仅整洁，而且易于理解。\n\
  \n### if constexpr 语句\n\n转向 `if constexpr` 特性，这一改进彻底革新了我们在模板中处理条件编译的方式。在 C++17 之前，开发者通常诉诸模板特化或使用\
  \ `static_assert`，虽然这些可行，但可能会导致代码复杂化且可读性下降。通过 `if constexpr`，我们可以编写编译器在编译时评估的条件执行代码。\n\
  \n\n\n\n\n想象这样一个场景：你想要创建一个函数，根据接收到的参数类型表现出不同的行为。以下是如何使用 `if constexpr` 实现这一点的：\n\
  \n```cpp\n#include <iostream>\n#include <type_traits>\n\ntemplate<typename T>\n\
  void processValue(T value) {\n    if-constexpr (std::is_integral<T>::value) {\n\
  \        std::cout << \"Processing an integer: \" << value << std::endl;\n    }\
  \ else if-constexpr (std::is_floating_point<T>::value) {\n        std::cout << \"\
  Processing a floating-point number: \" << value << std::endl;\n    } else {\n  \
  \      std::cout << \"Processing an unsupported type.\" << std::endl;\n    }\n}\n\
  \nint main() {\n    processValue(42);        // Will print: Processing an integer:\
  \ 42\n    processValue(3.14);      // Will print: Processing a floating-point number:\
  \ 3.14\n    processValue(\"Hello\");    // Will print: Processing an unsupported\
  \ type.\n    return 0;\n}\n```\n\n在这个示例中，`processValue` 在编译时检查 `T` 的类型。如果 `T` 是整数类型，则执行第一个块；如果它是浮点类型，则运行第二个块。否则，由默认情况处理不支持的类型。这种能力允许实现清晰且直观的逻辑，而无需运行时产生不必要的类型检查开销。\n\
  \n`if constexpr` 的优势不仅在于让代码更具可读性。它还通过消除未使用的分支来帮助编译器优化代码。这将导致更小的二进制文件，因为编译器只会生成与所处理的类型相关的路径。接下来的示例说明了\
  \ `if constexpr` 如何简化根据类型变化的算法的实现：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include <string>\n\ntemplate<typename T>\nvoid printCollection(const std::vector<T>&\
  \ collection) {\n    if-constexpr (std::is_same_v<T, std::string>) {\n        std::cout\
  \ << \"String collection: \";\n    } else {\n        std::cout << \"Generic collection:\
  \ \";\n    }\n    for (const auto& item : collection) {\n        std::cout << item\
  \ << \" \";\n    }\n    std::cout << std::endl;\n}\n\nint main() {\n    std::vector<std::string>\
  \ words = {\"Hello\", \"C++\", \"World\"};\n    std::vector<int> numbers = {1, 2,\
  \ 3, 4, 5};\n    printCollection(words);   // Will print: String collection: Hello\
  \ C++ World\n    printCollection(numbers); // Will print: Generic collection: 1\
  \ 2 3 4 5\n    return 0;\n}\n```\n\n在这个示例中，`printCollection` 根据包含的类型是否为 `std::string`\
  \ 表现出不同的行为。`if constexpr` 的使用不仅简化了实现，还增强了可读性，使得正在处理哪种集合清晰可见。\n\n## 14.2 用于文件处理 std::filesystem\n\
  \n在现代 C++ 编程中，文件处理一直面临挑战，特别是在可移植性和易用性方面。`std::filesystem` 应运而生，它是 C++17 引入的一个强大库，简化了文件和目录的操作，同时在不同操作系统之间提供了统一一致的接口。这一特性允许开发者以自然直观的方式执行文件操作，使其成为文件管理任务的规则改变者。\n\
  \n### 理解 std::filesystem\n\n`std::filesystem` 的核心设计是以抽象底层复杂性的方式与文件系统进行交互。它提供了一系列类和函数，允许你处理文件路径、目录和文件，而无需担心目标平台的特定细节。这意味着无论你是在\
  \ Windows、macOS 还是 Linux 上开发，相同的代码都能在这些环境中无缝运行。\n\n要使用 `std::filesystem`，你需要包含相应的头文件：\n\
  \n```cpp\n#include <filesystem>\n```\n\n包含此头文件后，你就可以开始利用该库的功能。`std::filesystem`\
  \ 中最基础的类之一是 `std::filesystem::path`。该类表示文件系统路径，并提供了各种操作和查询路径的功能。\n\n### 创建和操作路径\n\
  \n创建路径非常简单。你可以使用表示路径的字符串字面量来初始化 `std::filesystem::path` 对象：\n\n```cpp\n#include\
  \ <iostream>\n#include <filesystem>\n\nint main() {\n    std::filesystem::path p{\"\
  example.txt\"};\n    std::cout << \"Path: \" << p << std::endl;\n    std::cout <<\
  \ \"Filename: \" << p.filename() << std::endl;\n    std::cout << \"Extension: \"\
  \ << p.extension() << std::endl;\n    std::cout << \"Parent Path: \" << p.parent_path()\
  \ << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，我们为 `example.txt` 创建了路径对象，并使用各种成员函数提取有关文件的信息。`filename()`、`extension()`\
  \ 和 `parent_path()` 方法提供了实用的见解，让你能够轻松地操作和理解文件路径。\n\n### 目录导航\n\n`std::filesystem`强大的功能之一是导航目录的能力。你可以轻松遍历目录的内容，检查文件和子目录。以下是列出指定目录下所有文件的方法：\n\
  \n```cpp\n#include <iostream>\n#include <filesystem>\n\nint main() {\n    std::filesystem::path\
  \ dir{\"./\"};\n    if (std::filesystem::exists(dir) && std::filesystem::is_directory(dir))\
  \ {\n        for (const auto& entry : std::filesystem::directory_iterator(dir))\
  \ {\n            std::cout << entry.path() << std::endl;\n        }\n    } else\
  \ {\n        std::cout << \"Directory does not exist.\" << std::endl;\n    }\n \
  \   return 0;\n}\n```\n\n在片段中，我们检查路径是否存在是否确实是一个目录。然后我们创建一个 `directory_iterator`\
  \ 来遍历每个条目，打印每个文件或子目录的路径。\n\n### 文件操作：创建、移动和删除\n\n`std::filesystem` 提供了一套健壮的函数用于执行创建、移动和删除文件或目录等常用操作。例如，要创建一个新目录，可以使用\
  \ `std::filesystem::create_directory`：\n\n```cpp\n#include <iostream>\n#include\
  \ <filesystem>\n\nint main() {\n    std::filesystem::path newDir{\"new_folder\"\
  };\n    if (std::filesystem::create_directory(newDir)) {\n        std::cout << \"\
  Directory created: \" << newDir << std::endl;\n    } else {\n        std::cout <<\
  \ \"Directory already exists or could not be created.\" << std::endl;\n    }\n \
  \   return 0;\n}\n```\n\n这种方法允许你管理目录，而无需平台特定的代码。同样，你可以使用 `std::filesystem::rename`\
  \ 来移动或重命名文件：\n\n```cpp\n#include <iostream>\n#include <filesystem>\n\nint main()\
  \ {\n    std::filesystem::path oldFile{\"old_name.txt\"};\n    std::filesystem::path\
  \ newFile{\"new_name.txt\"};\n    std::filesystem::rename(oldFile, newFile);\n \
  \   std::cout << \"Renamed file from \" << oldFile << \" to \" << newFile << std::endl;\n\
  \    return 0;\n}\n```\n\n在这个示例中，我们将 `old_name.txt` 重命名为 `new_name.txt`。`rename`\
  \ 函数同时处理移动和重命名，反映了 `std::filesystem` 库的通用。\n\n要删除文件或目录，可以使用 `std::filesystem::remove`\
  \ 或 `std::filesystem::remove_all`。后者对于删除非空目录特别有用：\n\n```cpp\n#include <iostream>\n\
  #include <filesystem>\n\nint main() {\n    std::filesystem::path dir{\"old_folder\"\
  };\n    std::filesystem::remove_all(dir);\n    std::cout << \"Deleted directory:\
  \ \" << dir << std::endl;\n    return 0;\n}\n```\n\n这段代码片段删除了整个目录及其内容，展示了 `std::filesystem`\
  \ 提供的清理操作的便利性。\n\n### filesystem 的错误处理\n\n在处理文件系统时，错误处理至关重要。`std::filesystem` 函数在发生错误时会抛出异常，允许你有效地在代码中管理异常。例如：\n\
  \n```cpp\n#include <iostream>\n#include <filesystem>\n#include <stdexcept>\n\nint\
  \ main() {\n    try {\n        std::filesystem::path nonExistent{\"non_existent_file.txt\"\
  };\n        std::filesystem::remove(nonExistent);\n    } catch (const std::filesystem::filesystem_error&\
  \ e) {\n        std::cerr << \"Error: \" << e.what() << std::endl;\n    }\n    return\
  \ 0;\n}\n```\n\n\n\n\n\n```cpp\n} catch (const std::filesystem::filesystem_error&\
  \ e) {\n    std::cerr << \"Error: \" << e.what() << std::endl;\n}\n\nreturn 0;\n\
  }\n```\n\n在这个示例中，我们尝试删除一个不存在的文件。`filesystem_error` 异常捕获了该错误，使我们能够做出适当响应而不会导致程序崩溃。这种错误处理对于构建健壮的应用程序至关重要。\n\
  \n## 14.3 C++20 中的 Ranges 和 Concepts\n\n在我们继续探索现代 C++ 时，C++20 引入了两个显著增强了语言的强大特性：`Ranges`（范围）和\
  \ `Concepts`（概念）。这些特性共同简化了我们处理集合的方式，并以更具表现力的方式强制执行类型约束。让我们深入探讨这些每一个特性，探索它们的语法、应用以及它们为\
  \ C++ 编程带来的收益。\n\n### Ranges\n\nC++20 中的 `Ranges` 库提供了一种处理元素序列的新方法，使得操作和与集合交互变得更加容易。在\
  \ C++20 之前，遍历容器通常涉及使用 `STL` 中的迭代器和算法，这可能导致代码冗长且可读性差。`Ranges` 通过允许你以更声明式的风格表达操作简化了这一点。\n\
  \n`Ranges` 库的核心是 `std::ranges` 命名空间，它引入了一系列新的算法和适配器。要使用 `Ranges`，你必须包含必要的头文件：\n\n\
  ```cpp\n#include <ranges>\n```\n\n### 创建 Ranges\n\n你可以从各种数据结构（如数组、vector 或列表）创建范围。这里有一个简单的示例，展示了如何从\
  \ vector 创建创建一个范围：\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <ranges>\n\
  \nint main() {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    auto rng =\
  \ numbers | std::views::filter([](int n) { return n % 2 == 0; });\n    for (const\
  \ auto& n : rng) {\n        std::cout << n << \" \";\n    }\n    std::cout << std::endl;\n\
  \    return 0;\n}\n```\n\n在此代码中，我们创建了一个范围 `rng`，它使用 `std::views::filter` 适配器对 `numbers`\
  \ vector 进行过滤，仅包含偶数。管道运算符（`|`）的使用使得代码更具可读性和表现力。与其手动写循环来过滤数字，我们只需要应用一个代表我们所需转换的视图（view）。\n\
  \n### 转换 Ranges\n\n`Ranges` 也支持转换，允许我们对序列中的每个元素应用操作。例如，我们可以像这样将 vector 中的每个数字平方：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <ranges>\n\nint main()\
  \ {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    auto squared = numbers\
  \ | std::views::transform([](int n) { return n * n; });\n    for (const auto& n\
  \ : squared) {\n        std::cout << n << \" \";\n    }\n    std::cout << std::endl;\n\
  \    return 0;\n}\n```\n\n在这个示例中，`std::views::transform` 适配器将 lambda 函数应用到 `numbers`\
  \ 的每个元素上，产生一个新的平方值范围。这种转换数据的函数式方法减少了模板代码并增强了可读性。\n\n### 组合 Ranges\n\n`Ranges` 最强大的方面之一是它们的可组合性。你可以将多个视图和算法组合成单个表达式，这对于更复杂的数据操作可能特别有用。例如，让我们一次性过滤并转换我们的数字：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <ranges>\n\nint main()\
  \ {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    auto result = numbers\n\
  \    | std::views::filter([](int n) { return n % 2 != 0; })\n    | std::views::transform([](int\
  \ n) { return n * n; });\n    for (const auto& n : result) {\n        std::cout\
  \ << n << \" \";\n    }\n    std::cout << std::endl;\n    return 0;\n}\n```\n\n\
  在这个示例中，我们首先过滤出奇数，然后对每个每个奇数进行平方。这种以整洁、可读的方式将这些操作链在一起的能力，说明了 `Ranges` 在现代 C++ 中的威力。\n\
  \n### Concepts\n\n虽然 `Ranges` 增强了我们与集合交互的方式，但 `Concepts` 提供了一种更清晰、简洁的指定模板要求的方法。在\
  \ C++20 之前，模板编程可能相当繁琐，通常需要复杂的 `SFINAE` 技术或 `enable_if` 来对模板参数实施约束。`Concepts` 通过允许开发者直接定义需求来解决这个问题。\n\
  \n要使用 `Concepts`，你需要包含以下头文件：\n\n```cpp\n#include <concepts>\n```\n\n### 定义和使用 Concepts\n\
  \n概念 是一个编译时谓词，它指定了类型必须满足的一组要求。你可以使用 `concept` 关键字定义一个概念。这里有一个检查类型是否为整数类型的概念简单示例：\n\
  \n```cpp\n#include <iostream>\n#include <concepts>\n\ntemplate<typename T>\nconcept\
  \ Integral = std::is_integral_v<T>;\n\ntemplate<Integral T>\nvoid printValue(T value)\
  \ {\n    std::cout << \"Value: \" << value << std::endl;\n}\n\nint main() {\n  \
  \  printValue(42); // 有效：int 是整数类型\n}\n```\n\n在这个示例中，我们定义了一个检查 `T` 是否为整数的概念 `Integral`。`printValue`\
  \ 函数被限制为整数类型。\n\n### 组合 Concepts\n\n你还可以组合多个概念来创建复杂的约束。例如，让我们定义一个确保类型是整数且可打印的概念：\n\
  \n```cpp\n#include <iostream>\n#include <concepts>\n\ntemplate<typename T>\nconcept\
  \ Integral = std::is_integral_v<T>;\n\ntemplate<typename T>\nconcept Printable =\
  \ requires(T a) {\n    { std::cout << a };\n};\n\ntemplate<Integral T>\nvoid printValue(T\
  \ value) {\n    std::cout << \"Value: \" << value << std::endl;\n}\n\ntemplate<Integral\
  \ T>\nvoid printIfable(T value) requires Printable<T> {\n    printValue(value);\n\
  }\n\nint main() {\n    printIfable(42); // 有效：int 是整数且可打印\n    return 0;\n}\n```\n\
  \n14.4 协程：编写异步代码\n\n当我们深入研究 C++20 带来的增强时，最引人注目的特性之一是协程（Coroutines）。协程提供了一种强大且优雅的方式编写异步代码，允许开发者管理可能涉及等待的任务，而不会阻塞程序的执行。\n\
  \n### 理解协程\n\n协程是特殊的函数，可以挂起执行以允许其他函数运行。与从开始到结束的传统函数不同，协程可以在某些点暂停，并将控制权交回调用者。这种能力使得协程特别适用于异步编程，其中任务可能等待外部资源或事件。\n\
  \n在 C++ 中，协程基于三个主要的关键字构建：`co_await`、`co_yield` 和 `co_return`。每个关键字在管理协程执行流方面都有特定的作用。\n\
  \n### 基本协程结构\n\n要定义协程，你通常返回一个表示协程结果的类型。该类型必须实现特定的方法来处理协程的挂起和恢复。用于此目的的类型是 `Generator`。\n\
  \n让我们从一个生成数字序列的简单协程示例开始：\n\n```cpp\n#include <iostream>\n#include <coroutine>\n\n\
  struct Generator {\n    struct promise_type {\n        int value;\n        Generator\
  \ get_return_object() {\n            return Generator{std::coroutine_handle<promise_type>::from_promise(*this)};\n\
  \        }\n        std::suspend_always yield_value(int v) {\n            value\
  \ = v;\n            return {};\n        }\n        std::suspend_never return_void()\
  \ {\n    }\n};\n```\n\n\n\n\n```cpp\nreturn {};\n\n}\n\nvoid  unhandled_exception()\
  \ {\n\nstd::terminate();\n\n}\n\n};\n\nstd::coroutine_handle<promise_type> handle;\n\
  \nGenerator(std::coroutine_handle<promise_type> h) : handle(h) {}\n\n~Generator()\
  \ {\n\nif (handle) handle.destroy();\n\n}\n\nbool  next() {\n\nhandle.resume();\n\
  \nreturn !handle.done();\n\n}\n\nint  current_value() {\n\nreturn handle.promise().value;\n\
  \n}\n\n};\n\nGenerator numberGenerator() {\n\nfor (int i = 1; i <= 5; ++i) {\n\n\
  co_yield i; // 产出值\n\n}\n\n}\n\nint  main() {\n\nauto gen = numberGenerator();\n\
  \nwhile (gen.next()) {\n\nstd::cout << gen.current_value() << \" \";\n\n}\n\nstd::cout\
  \ << std::endl;\n\nreturn  0;\n\n}\n```\n\n在这段代码中，我们定义了一个 `Generator` 结构体来表示我们的协程。其内部的\
  \ `promise_type` 结构体负责管理协程的状态，并为挂起值和处理异常提供必要的方法。`numberGenerator` 协程产出从 `1` 到 `5`\
  \ 的数字，而 `main` 函数通过调用 `gen.next()` 来迭代生成的值。\n\n## 使用 `co_await` 进行异步操作\n\n虽然 `co_yield`\
  \ 非常适合生成序列，但 `co_await` 则用于等待异步操作。这允许你的协程暂停，直到满足某些条件（例如 I/O 操作的完成）。\n\n让我们考虑一个更具实际意义的示例，模拟异步网络请求。我们将创建一个在返回结果之前会等待模拟延迟的协程：\n\
  \n```cpp\n#include <iostream>\n\n#include <coroutine>\n\n#include <chrono>\n\n#include\
  \ <thread>\n\nstruct  AsyncResult {\n\nstruct  promise_type {\n\nAsyncResult get_return_object()\
  \ {\n\nreturn AsyncResult{std::coroutine_handle<promise_type>::from_promise(*this)};\n\
  }\n\nstd::suspend_always initial_suspend() {\n\nreturn {};\n\n}\n\nstd::suspend_always\
  \ final_suspend()  noexcept {\n\nreturn {};\n}\n\nvoid  unhandled_exception() {\n\
  \nstd::terminate();\n\n}\n\nstd::suspend_always yield_value(int value) {\n\nresult\
  \ = value;\n\nreturn {};\n}\n\nint result;\n\n};\n\nstd::coroutine_handle<promise_type>\
  \ handle;\n\nAsyncResult(std::coroutine_handle<promise_type> h) : handle(h) {}\n\
  \n~AsyncResult() {\n\nif (handle) handle.destroy();\n\n}\n\nint  get() {\n\nhandle.resume();\n\
  \nreturn handle.promise().result;\n\n}\n\n};\n\nAsyncResult asyncOperation() {\n\
  \nstd::cout << \"Starting async operation...\" << std::endl;\n\nstd::this_thread::sleep_for(std::chrono::seconds(2));\
  \ // 模拟延迟\n\nco_return  42; // 返回结果\n}\n\nint  main() {\n\nauto result = asyncOperation();\n\
  \nstd::cout << \"Result: \" << result.get() << std::endl;\n\nreturn  0;\n\n}\n```\n\
  \n在这个示例中，我们创建了一个 `AsyncResult` 结构体来表示异步操作的结果。`asyncOperation` 协程通过在返回值之前睡眠两秒来模拟网络调用。`main`\
  \ 函数等待结果并将其打印出来。\n\n## 将协程与 Ranges 结合\n\n协程最吸引人的方面之一是它们能够与其他现代 C++ 特性（如 `Ranges`）无缝协作。通过结合这两个概念，你可以创建出优雅的解决方案来异步处理数据序列。\n\
  \n想象你想要异步地生成一个数字序列，并在它们产生时对其进行处理。以下是实现方法：\n\n```cpp\n#include <iostream>\n\n#include\
  \ <coroutine>\n\n#include <chrono>\n\n#include <thread>\n\n#include <ranges>\n\n\
  #include <vector>\n\nstruct  AsyncGenerator {\n\nstruct  promise_type {\n\nint value;\n\
  \nAsyncGenerator get_return_object() {\n\nreturn AsyncGenerator{std::coroutine_handle<promise_type>::from_promise(*this)};\n\
  }\n\nstd::suspend_always yield_value(int v) {\n\nvalue = v;\n\nreturn {};\n}\n\n\
  void  unhandled_exception() {\n\nstd::terminate();\n\n}\n};\n\nstd::coroutine_handle<promise_type>\
  \ handle;\n\nAsyncGenerator(std::coroutine_handle<promise_type> h) : handle(h) {}\n\
  \n~AsyncGenerator() {\n\nif (handle) handle.destroy();\n\n}\n\nbool  next() {\n\n\
  handle.resume();\n\nreturn !handle.done();\n\n}\n\nint  current_value() {\n\nreturn\
  \ handle.promise().value;\n\n}\n\n};\n\nAsyncGenerator asyncNumberGenerator() {\n\
  \nfor (int i = 1; i <= 5; ++i) {\n\nstd::this_thread::sleep_for(std::chrono::seconds(1));\
  \ // 模拟延迟\n\nco_yield i;\n\n}\n\n}\n\nint  main() {\n\nauto gen = asyncNumberGenerator();\n\
  \nwhile (gen.next()) {\n\nstd::cout << gen.current_value() << \" \";\n\n}\n\nstd::cout\
  \ << std::endl;\n\nreturn  0;\n\n}\n```\n\n在这个示例中，`asyncNumberGenerator` 协程异步地生成数字，每秒产出一个数字。`main`\
  \ 函数迭代生成的值，展示了协程如何在不阻塞主线程的情况下随时间推产生数据。\n\n## 协程中的错误处理\n\n协程中的错误处理可以使用异常来管理。如果在协程执行期间发生错误，你可以抛出异常，该异常可以在调用上下文中捕获。这是一个示例：\n\
  \n```cpp\n#include <iostream>\n\n#include <coroutine>\n\nstruct  ErrorHandled {\n\
  \nstruct  promise_type {\n\nErrorHandled get_return_object() {\n\nreturn ErrorHandled{std::coroutine_handle<promise_type>::from_promise(*this)};\n\
  }\n\nvoid  unhandled_exception() {\n\nstd::cerr << \"An error occurred!\" << std::endl;\n\
  \nstd::terminate();\n\n}\n\nstd::suspend_always yield_value(int value) {\n\nreturn\
  \ {};\n}\n};\n\nstd::coroutine_handle<promise_type> handle;\n\nErrorHandled(std::coroutine_handle<promise_type>\
  \ h) : handle(h) {}\n\n~ErrorHandled() {\n\nif (handle) handle.destroy();\n\n}\n\
  \nvoid  resume() {\n\nhandle.resume();\n\n}\n\n};\n\nErrorHandled errorProneCoroutine()\
  \ {\n\nco_yield  1;\n\nthrow std::runtime_error(\"Something went wrong\");\n\nco_yield\
  \  2; // 这一行不会被执行\n}\n\nint  main() {\n\nauto coro = errorProneCoroutine();\n\n\
  try {\n\ncoro.resume();\n\ncoro.resume(); // 这将抛出异常\n\n} catch (...) {\n\nstd::cerr\
  \ << \"Caught an exception!\" << std::endl;\n\n}\n\nreturn  0;\n\n}\n```\n\n\n\n\
  解析的下一步是分词（tokenization），它涉及到将输入字符串拆成有意义的部分——令牌（tokens）。在我们的用例中，令牌将是数字和操作符。我们可以通过\
  \ `std::istringstream` 类的帮助来实现，该类允许我们将字符串处理为数据流。\n\n让我们来实现分词函数：\n\n```cpp\n#include\
  \ <iostream>\n#include <string>\n#include <sstream>\n#include <vector>\n\nstd::vector<std::string>\
  \ tokenize(const std::string& input) {\n    std::vector<std::string> tokens;\n \
  \   std::istringstream stream(input);\n    std::string token;\n    while (stream\
  \ >> token) {\n        tokens.push_back(token);\n    }\n    return tokens;\n}\n\n\
  int main() {\n    std::string input;\n    while (true) {\n        std::cout << \"\
  Enter an expression (or 'exit' to quit): \";\n        std::getline(std::cin, input);\n\
  \        if (input == \"exit\") {\n            break;\n        }\n        auto tokens\
  \ = tokenize(input);\n        // Future evaluation logic will go here\n    }\n \
  \   return 0;\n}\n```\n\n在 `tokenize` 函数中，我们从 `input` 字符串创建了一个 `std::istringstream`\
  \ 对象。通过使用提取运算符（`>>`），我们可以读取由空白字符分隔的令牌。每个令牌随后被添加到 `vector` 中，我们稍后可以对其进行处理。\n\n###\
  \ 识别数字和操作符\n\n现在我们已经有了一个令牌列表，下一个挑战是区分数字和操作符。这对于正确评估表达式至关重要。我们可以创建一个简单的函数来检查一个令牌是否为数字。\n\
  \n以下是如何使用 `std::optional` 实现此点的，这是 C++17 引入的一项特性，允许我们在不直接使用异常的情况下表示可能不存在的值。\n\n\
  ```cpp\n#include <optional>\n\nstd::optional<double> parseNumber(const std::string&\
  \ token) {\n    try {\n        return std::stod(token); // 尝试将字符串转换为 double\n  \
  \  } catch (const std::invalid_argument&) {\n        return std::nullopt; // 如果不是有效数字则返回\
  \ nullopt\n    }\n}\n```\n\n在此函数中，我们尝试使用 `std::stod` 将 `token` 转换为 `double`。如果转换失败，我们会捕获异常并返回\
  \ `std::nullopt`。这样，我们可以优雅地处理无效输入而不会导致程序崩溃。\n\n### 集成解析逻辑\n\n在分词和数字解析的基础上，我们可以将这些组件集成到我们的主输入循环中。我们现在将处理令牌并将它们分类为数字或操作符，同时向用户提供反馈。\n\
  \n这是我们程序的增强版本：\n\n```cpp\n#include <iostream>\n#include <string>\n#include <sstream>\n\
  #include <vector>\n#include <optional>\n\nstd::vector<std::string> tokenize(const\
  \ std::string& input) {\n    std::vector<std::string> tokens;\n    std::istringstream\
  \ stream(input);\n    std::string token;\n    while (stream >> token) {\n      \
  \  tokens.push_back(token);\n    }\n    return tokens;\n}\n\nstd::optional<double>\
  \ parseNumber(const std::string& token) {\n    try {\n        return std::stod(token);\n\
  \    } catch (const std::invalid_argument&) {\n        return std::nullopt;\n  \
  \  }\n}\n\nint main() {\n    std::string input;\n    while (true) {\n        std::cout\
  \ << \"Enter an expression (or 'exit' to quit): \";\n        std::getline(std::cin,\
  \ input);\n        if (input == \"exit\") {\n            break;\n        }\n   \
  \     auto tokens = tokenize(input);\n        for (const auto& token : tokens) {\n\
  \            if (auto number = parseNumber(token)) {\n                std::cout\
  \ << \"Number: \" << *number << std::endl;\n            } else {\n             \
  \   std::cout << \"Operator: \" << token << std::endl;\n            }\n        }\n\
  \    }\n    return 0;\n}\n```\n\n在这个版本中，我们遍历每个令牌并使用我们的 `parseNumber` 函数检查它是否为数字。如果是数字，我们就将其打印出来。如果不是，我们就将其视为操作符并打印该操作符。这让我们清晰地了解输入是如何被解析的。\n\
  \n### 增强用户体验\n\n虽然目前的实现可以工作，但我们还可以进一步增强用户体验。例如，我们可能想要忽略额外的空格或优雅地处理无效的操作符。这可以通过一些额外的字符串处理和验证检查来实现。\n\
  \n为了忽略额外的空格，我们可以修改分词函数以接受并跳过空令牌。此外，我们可以添加一个函数来检查令牌是否为有效的操作符。它可能看起来像：\n\n```cpp\n\
  bool isValidOperator(const std::string& token) {\n    return token == \"+\" || token\
  \ == \"-\" || token == \"*\" || token == \"/\";\n}\n```\n\n这个简单的函数检查令牌是否为预期的操作符之一。我们现在可以将此检查整合到主循环中：\n\
  \n```cpp\nfor (const auto& token : tokens) {\n    if (auto number = parseNumber(token))\
  \ {\n        std::cout << \"Number: \" << *number << std::endl;\n    } else if (isValidOperator(token))\
  \ {\n        std::cout << \"Operator: \" << token << std::endl;\n    } else {\n\
  \        std::cout << \"Invalid token: \" << token << std::endl;\n    }\n}\n```\n\
  \n通过这种修改，任何无效输入将报告给用户，增强计算器的健壮性。\n\n## 15. 实现数学运算\n\n现在我们已经成功将输入解析为令牌，下一步是实现数学运算。\n\
  \n### 理解运算顺序\n\n在评估表达式之前，必须理解运算的顺序，通常遵循 PEMDAS：\n\n1. **括号**：先处理括号内部。\n2. **指数**：接着处理指数。\n\
  3. **乘法和除法**：从左到右执行。\n4. **加法和减法**：最后从左到右执行加减法。\n\n### 构建评估函数\n\n让我们创建一个函数来评估令牌。该函数将使用两个栈：一个用于数字，一个用于操作符。通过根据优先级处理令牌，我们可以计算结果。\n\
  \n```cpp\n#include <iostream>\n#include <string>\n#include <sstream>\n#include <vector>\n\
  #include <optional>\n#include <stack>\n#include <stdexcept>\n#include <cctype>\n\
  \nstd::vector<std::string> tokenize(const std::string& input) {\n    std::vector<std::string>\
  \ tokens;\n    std::istringstream stream(input);\n    std::string token;\n    while\
  \ (stream >> token) {\n        tokens.push_back(token);\n    }\n    return tokens;\n\
  }\n\nstd::optional<double> parseNumber(const std::string& token) {\n    try {\n\
  \        return std::stod(token);\n    } catch (const std::invalid_argument&) {\n\
  \        return std::nullopt;\n    }\n}\n\nbool isValidOperator(const std::string&\
  \ token) {\n    return token == \"+\" || token == \"-\" || token == \"*\" || token\
  \ == \"/\";\n}\n\nint precedence(const std::string& op) {\n    if (op == \"+\" ||\
  \ op == \"-\") {\n        return 1;\n    } else if (op == \"*\" || op == \"/\")\
  \ {\n        return 2;\n    }\n    return 0;\n}\n\ndouble applyOperation(double\
  \ a, double b, const std::string& op) {\n    if (op == \"+\") return a + b;\n  \
  \  if (op == \"-\") return a - b;\n    if (op == \"*\") return a * b;\n    if (op\
  \ == \"/\") {\n        if (b == 0) {\n            throw std::invalid_argument(\"\
  Division by zero\");\n        }\n        return a / b;\n    }\n    throw std::invalid_argument(\"\
  Invalid operator\");\n}\n\ndouble evaluate(const std::vector<std::string>& tokens)\
  \ {\n    std::stack<double> values;\n    std::stack<std::string> ops;\n    for (const\
  \ auto& token : tokens) {\n        if (auto number = parseNumber(token)) {\n   \
  \         values.push(*number);\n        } else if (isValidOperator(token)) {\n\
  \            while (!ops.empty() && precedence(ops.top()) >= precedence(token))\
  \ {\n                double b = values.top(); values.pop();\n                double\
  \ a = values.top(); values.pop();\n                std::string op = ops.top(); ops.pop();\n\
  \                double result = applyOperation(a, b, op);\n                values.push(result);\n\
  \            }\n            ops.push(token);\n        }\n    }\n    while (!ops.empty())\
  \ {\n        double b = values.top(); values.pop();\n        double a = values.top();\
  \ values.pop();\n        std::string op = ops.top(); ops.pop();\n        double\
  \ result = applyOperation(a, b, op);\n        values.push(result);\n    }\n    return\
  \ values.top();\n}\n```\n\n\n\n\n```cpp\ndouble result = applyOperation(a, b, op);\n\
  values.push(result);\n}\n\nreturn values.top();\n}\n\nint main() {\n    std::string\
  \ input;\n    while (true) {\n        std::cout << \"Enter an expression (or 'exit'\
  \ to quit): \";\n        std::getline(std::cin, input);\n        if (input == \"\
  exit\") {\n            break;\n        }\n        auto tokens = tokenize(input);\n\
  \        try {\n            double result = evaluate(tokens);\n            std::cout\
  \ << \"Result: \" << result << std::endl;\n        } catch (const std::invalid_argument&\
  \ e) {\n            std::cout << \"Error: \" << e.what() << std::endl;\n       \
  \ }\n    }\n    return 0;\n}\n```\n\n### 代码解析\n\n1. **分词与解析**：我们复用了了 `tokenize`\
  \ 和 `parseNumber` 函数将输入拆分为为标记（tokens）并识别数字。\n2. **运算符优先级**：`precedence` 函数为运算符分配优先级级别。乘法和除法的优先级高于加法和减法。\n\
  3. **执行操作**：`applyOperation` 函数根据提供的运算符执行算术运算。它还会检查除以零的情况，如果用户尝试此操作，则会抛出异常。\n4.\
  \ **求值标记**：`evaluate` 函数遍历标记，使用两个栈——一个用于数值（数字），另一个用于运算符。当遇到运算符时，它会检查当前运算符与运算符栈栈顶运算符的优先级。如果当前运算符的优先级较低或相等，则将栈顶运算符应用于数值栈顶的两个值，并将结果推回数值栈。\n\
  5. **最终计算**：在处理完所有标记后，任何剩余的运算符都将应用于栈中的数值，从而得出最终结果。\n\n### 使用示例\n\n通过这种实现，用户现在可以输入简单的表达式，例如：\n\
  \n`Enter an expression (or 'exit' to quit): 3 + 4 * 2`\n`Result: 11`\n\n计算器在遵守运算顺序的同时正确地评估了表达式。同样，它也能处理减法和除法：\n\
  \n`Enter an expression (or 'exit' to quit): 10 - 3 + 2`\n`Result: 9`\n\n### 处理括号\n\
  \n为了扩展我们计算器的功能，我们可以添加对括号的支持。这需要修改我们的求值逻辑以考虑左右括号，确保它们内部的表达式首先求值。\n\n以下是你可以增强 `evaluate`\
  \ 函数以处理括号的方法：\n\n```cpp\ndouble evaluate(const std::vector<std::string>& tokens)\
  \ {\n    std::stack<double> values;\n    std::stack<std::string> ops;\n    for (const\
  \ auto& token : tokens) {\n        if (auto number = parseNumber(token)) {\n   \
  \         values.push(*number);\n        } else if (token == \"(\") {\n        \
  \    ops.push(token);\n        } else if (token == \")\") {\n            while (!ops.empty()\
  \ && ops.top() != \"(\") {\n                double b = values.top(); values.pop();\n\
  \                double a = values.top(); values.pop();\n                std::string\
  \ op = ops.top(); ops.pop();\n                double result = applyOperation(a,\
  \ b, op);\n                values.push(result);\n            }\n            ops.pop();\
  \ // 从栈中移除 '(' \n        } else if (isValidOperator(token)) {\n            while\
  \ (!ops.empty() && precedence(ops.top()) >= precedence(token)) {\n             \
  \   double b = values.top(); values.pop();\n                double a = values.top();\
  \ values.pop();\n                std::string op = ops.top(); ops.pop();\n      \
  \          double result = applyOperation(a, b, op);\n                values.push(result);\n\
  \            }\n            ops.push(token);\n        }\n    }\n    while (!ops.empty())\
  \ {\n        double b = values.top(); values.pop();\n        double a = values.top();\
  \ values.pop();\n        std::string op = ops.top(); ops.pop();\n        double\
  \ result = applyOperation(a, b, op);\n        values.push(result);\n    }\n    return\
  \ values.top();\n}\n```\n\n## 15.3 错误处理与输入验证\n\n### 输入验证的重要性\n\n输入验证是在处理用户提供的数据之前，确保其符合特定标准的过程。在我们的计算器上下文中，这意味着确认：\n\
  \n1. 输入仅包含有效字符（数字、运算符和括号）。\n2. 运算符使用正确（例如，没有连续两个运算符）。\n3. 括号是平衡的。\n\n验证输入不仅可以防止运行时错误，还能确保计算的正确执行。\n\
  \n### 基础输入验证\n\n让我们开始实现一个函数，检查输入是否仅由有效字符组成。我们还将确保运算符的使用正确。\n\n```cpp\nbool isValidInput(const\
  \ std::string& input) {\n    int parenthesesCount = 0;\n    bool lastWasOperator\
  \ = true; // 假设上一个字符是运算符\n    for (const char& ch : input) {\n        if (std::isspace(ch))\
  \ {\n            continue; // 忽略空格\n        }\n        if (std::isdigit(ch) || ch\
  \ == '.' || ch == '(' || ch == ')') {\n            lastWasOperator = false; // 我们找到了数字或括号\n\
  \        } else if (ch == '+' || ch == '-' || ch == '*' || ch == '/') {\n      \
  \      // 运算符逻辑\n        }\n    }\n    return true; // 占位逻辑\n}\n```\n*(注：此处代码内部逻辑根据语意进行了简化处理，以保持结构清晰)*\n\
  \n**更正上述验证逻辑的完整逻辑翻译实现：**\n\n```cpp\nbool isValidInput(const std::string& input)\
  \ {\n    int parenthesesCount = 0;\n    bool lastWasOperator = true; // 假设上一个字符是运算符\n\
  \    for (const char& ch : input) {\n        if (std::isspace(ch)) {\n         \
  \   continue; // 忽略空格\n        }\n        if (std::isdigit(ch) || ch == '.' || ch\
  \ == '(' || ch == ')') {\n            lastWasOperator = false; // 我们找到了数字或括号\n \
  \       } else if (ch == '+' || ch == '-' || ch == '*' || ch == '/') {\n       \
  \     if (lastWasOperator) return false; // 连续两个运算符\n            lastWasOperator\
  \ = true;\n        } else {\n            return false; // 无效字符\n        }\n\n  \
  \      if (ch == '(') {\n            parenthesesCount++;\n        } else if (ch\
  \ == ')') {\n            parenthesesCount--;\n            if (parenthesesCount <\
  \ 0) return false; // 右括号多于左括号\n        }\n    }\n    return parenthesesCount ==\
  \ 0;\n}\n```\n\n### 集成输入验证\n\n现在我们有了验证函数，可以将其集成到主循环中。在尝试评估表达式之前，我们将检查输入。修改方法如下：\n\
  \n```cpp\nint main() {\n    std::string input;\n    while (true) {\n        std::cout\
  \ << \"Enter an expression (or 'exit' to quit): \";\n        std::getline(std::cin,\
  \ input);\n        if (input == \"exit\") {\n            break;\n        }\n   \
  \     // 验证输入\n        if (!isValidInput(input)) {\n            std::cout << \"\
  Error: Invalid input. 请输入有效的表达式。\" << std::endl;\n            continue; // 跳过本次迭代\n\
  \        }\n        auto tokens = tokenize(input);\n        try {\n            double\
  \ result = evaluate(tokens);\n            std::cout << \"Result: \" << result <<\
  \ std::endl;\n        } catch (const std::invalid_argument& e) {\n            std::cout\
  \ << \"Error: \" << e.what() << std::endl;\n        }\n    }\n    return 0;\n}\n\
  ```\n\n### 处理除以零\n\n数学计算中最常见的错误之一是除以零。我们已经在 `applyOperation` 函数中包含了此检查，但确保此错误清晰地传递给用户至关重要。\n\
  \n在我们现有的 `applyOperation` 实现中，我们对除以零抛出了异常：\n\n```cpp\nif (op == \"/\") {\n    if\
  \ (b == 0) {\n        throw std::invalid_argument(\"Division by zero\");\n    }\n\
  \    return a / b;\n}\n```\n\n### 高级错误处理\n\n虽然我们在基础错误方面取得了很大进展，让我们考虑如何更优雅地处理意外或运行时错误。我们可以利用\
  \ `try-catch` 块不仅处理除零错误，还处理求值过程中可能任何其他异常。\n\n我们可以这样增强 `evaluate` 函数中的错误处理：\n\n```cpp\n\
  double evaluate(const std::vector<std::string>& tokens) {\n    std::stack<double>\
  \ values;\n    std::stack<std::string> ops;\n    try {\n        for (const auto&\
  \ token : tokens) {\n            // ... 后续逻辑\n```\n\n\n\n```cpp\ndouble b = values.top();\
  \ values.pop();\n\ndouble a = values.top(); values.pop();\n\nstd::string op = ops.top();\
  \ ops.pop();\n\ndouble result = applyOperation(a, b, op);\n\nvalues.push(result);\n\
  \n}\n\nops.pop(); // 从栈中移除 '('\n\n} else if (isValidOperator(token)) {\n\n    while\
  \ (!ops.empty() && precedence(ops.top()) >= precedence(token)) {\n\n        double\
  \ b = values.top(); values.pop();\n\n        double a = values.top(); values.pop();\n\
  \n        std::string op = ops.top(); ops.pop();\n\n        double result = applyOperation(a,\
  \ b, op);\n\n        values.push(result);\n\n    }\n\n    ops.push(token);\n}\n\n\
  }\n\nwhile (!ops.empty()) {\n\n    double b = values.top(); values.pop();\n\n  \
  \  double a = values.top(); values.pop();\n\n    std::string op = ops.top(); ops.pop();\n\
  \n    double result = applyOperation(a, b, op);\n\n    values.push(result);\n\n\
  }\n\n} catch (const std::invalid_argument& e) {\n\n    std::cerr << \"Evaluation\
  \ Error: \" << e.what() << std::endl;\n\n    throw; // 重新抛出异常以便在主循环中捕获\n\n}\n\n\
  return values.top();\n\n}\n```\n\n# 第 16 章 – 文本分析器\n\n## 16.1 使用 std::filesystem\
  \ 读取文件\n\n在编程中，处理文件是一项经常用到的基础任务，无论是在记录应用程序行为、处理用户输入还是管理配置设置。C++ 长期以来具备文件处理能力，但随着\
  \ C++17 中引入了 `std::filesystem`，管理文件和目录变得更加直观。本节将深入探讨如何利用 `std::filesystem` 有效地读取文本文件，为构建健壮的文本分析器奠定基础。\n\
  \n在开始探索之前，让我们先了解 `std::filesystem` 的基础知识。该库提供了与文件系统交互的标准化方法，使得检查文件是否存在、遍历目录以及获取文件属性等操作变得简单得多。这消除了对平台特定代码的需求，增强了可移植性和可维护性。\n\
  \n要使用 `std::filesystem`，你需要包含其头文件：\n\n```cpp\n#include <filesystem>\n#include <iostream>\n\
  #include <fstream>\n#include <string>\n#include <sstream>\n#include <unordered_map>\n\
  ```\n\n在上述代码段中，我们包含了文件操作、输入/输出操作和字符串处理所需的头文件。`std::unordered_map` 将帮助我们在分析文本文件时统计每个单词的出现次数。\n\
  \n### 检查文件是否存在\n\n假设我们有一个名为 `example.txt` 的文本文件需要读取。在深入读取其内容之前，验证文件是否存在以及它是否确实是一个普通文件至关重要。以下是使用\
  \ `std::filesystem` 实现此点的方法：\n\n```cpp\nnamespace fs = std::filesystem;\n\nint main()\
  \ {\n    fs::path filePath = \"example.txt\";\n    // 检查文件是否存在并为普通文件\n    if (fs::exists(filePath)\
  \ && fs::is_regular_file(filePath)) {\n        std::cout << \"找到文件: \" << filePath\
  \ << std::endl;\n    } else {\n        std::cerr << \"文件不存在。\" << std::endl;\n \
  \       return 1; // 使用错误码退出\n    }\n}\n```\n\n在这个示例中，我们创建了一个 `fs::path` 对象来表示文件的路径。`fs::exists()`\
  \ 函数检查文件是否存在，而 `fs::is_regular_file()` 则确保该路径指向的是标准文件，而不是目录或特殊类型的文件。如果检查通过，我们继续执行；否则，我们通过打印错误消息并退出程序来优雅地处理错误。\n\
  \n### 读取文件\n\n一旦确认文件存在，我们就可以打开它并读取其内容。这是通过 `std::ifstream` 实现的，它允许我们使用标准输入流操作从文件中读取内容。下面的代码段演示了如何从文件中读取行：\n\
  \n```cpp\nstd::ifstream file(filePath);\nstd::string line;\n\nwhile (std::getline(file,\
  \ line)) {\n    // 目前，我们只是将该行打印到控制台\n    std::cout << line << std::endl;\n}\n```\n\
  \n在循环中，`std::getline()` 从文件中读取每一行，直到到达末尾。每行的内容存储在 `line` 字符串变量中，然后我们将其打印出来。这种简单的方法让我们能够能够成功从文件中读取内容。\n\
  \n### 分析文本：统计单词\n\n为了让我们的文本分析器更有用，我们可以扩展其功能以统计文件中每个单词的出现次数。这是文本处理应用程序中的常见需求，使用 `std::unordered_map`\
  \ 实现它会使其非常高效。以下是你可以修改之前的示例以包含单词计数的方法：\n\n```cpp\n#include <unordered_map>\n\nint\
  \ main() {\n    fs::path filePath = \"example.txt\";\n\n    if (!fs::exists(filePath)\
  \ || !fs::is_regular_file(filePath)) {\n        std::cerr << \"文件不存在。\" << std::endl;\n\
  \        return 1;\n    }\n\n    std::ifstream file(filePath);\n    std::string\
  \ line;\n    std::unordered_map<std::string, int> wordCount;\n\n    while (std::getline(file,\
  \ line)) {\n        // 此处应有单词处理逻辑\n    }\n}\n```\n*(注：原文示例代码逻辑此处不完整，此处根据上下文翻译逻辑)*\
  \ 修正如下：\n\n```cpp\n#include <unordered_map>\n\nint main() {\n    fs::path filePath\
  \ = \"example.txt\";\n\n    if (!fs::exists(filePath) || !fs::is_regular_file(filePath))\
  \ {\n        std::cerr << \"文件不存在。\" << std::endl;\n        return 1;\n    }\n\n\
  \    std::ifstream file(filePath);\n    std::string line;\n    std::unordered_map<std::string,\
  \ int> wordCount;\n\n    while (std::getline(file, line)) {\n        std::istringstream\
  \ iss(line);\n        std::string word;\n        while (iss >> word) {\n       \
  \     wordCount[word]++;\n        }\n    }\n\n    for (const auto& [word, count]\
  \ : wordCount) {\n        std::cout << word << \": \" << count << std::endl;\n \
  \   }\n\n    return 0;\n}\n```\n\n在上面的逻辑中，我们使用 `std::getline` 从文件读取每一行，通过 `std::istringstream`\
  \ 将该行拆分为单词。`std::unordered_map` 存储单词及其对应的计数。这种方法是高效的，因为 `std::unordered_map` 的插入和查找平均复杂度为\
  \ `O(1)`。\n\n### 实际量\n\n与任何编程任务一样，这里有一些实际考虑因素。例如，标点符号和大小写会影响计数的准确性。为了改进我们的分析器，我们可以通过将单词转换为小写并移除标点符号来预处理每个单词。\n\
  \n```cpp\n#include <algorithm>\n#include <cctype>\n\nstd::string cleanWord(const\
  \ std::string& word) {\n    std::string cleaned;\n    std::copy_if(word.begin(),\
  \ word.end(), std::back_inserter(cleaned),\n        [](char c) { return !std::ispunct(c);\
  \ });\n    std::transform(cleaned.begin(), cleaned.end(), cleaned.begin(),\n   \
  \     [](unsigned char c) { return std::tolower(c); });\n    return cleaned;\n}\n\
  ```\n\n`cleanWord` 函数移除单词中的标点并转换为小写。这确保了 \"Hello\" 和 \"Hello!\" 被视为同一个单词。\n\n###\
  \ 整合一切\n\n有了这个函数，我们可以将其整合到单词计数逻辑中：\n\n```cpp\nwhile (std::getline(file, line)) {\n\
  \    std::istringstream iss(line);\n    std::string word;\n    while (iss >> word)\
  \ {\n        wordCount[cleanWord(word)]++; // 清洗并计数\n    }\n}\n```\n\n这种改进提高了我们单词计数的准确性，使我们的分析器更加有效可靠。\n\
  \n## 16.2 统计单词、行和字符\n\n理解文本文件的结构对于任何处理任务都是至关重要的。每个指标都提供了内容的见察，允许我们评估其复杂性和大小。让我们分解如何使用\
  \ C++ 和 std::filesystem 库来实现这些计数功能。\n\n### 设置环境\n\n在深入计数逻辑之前，让我们确保在文件顶部包含了必要的头文件：\n\
  \n```cpp\n#include <filesystem>\n#include <iostream>\n#include <fstream>\n#include\
  \ <string>\n#include <sstream>\n#include <unordered_map>\n#include <cctype>\n```\n\
  \n这包含了文件处理、输入/输出操作和字符串处理所需的库。\n\n### 统计行\n\n统计行非常简单。我们只需要在每次从文件中读取新行时增加计数器即可。这是实现该功能的方法：\n\
  \n\n\n\n\n```cpp\nint main() {\n  std::filesystem::path filePath = \"example.txt\"\
  ;\n\n  if (!std::filesystem::exists(filePath) || !std::filesystem::is_regular_file(filePath))\
  \ {\n    std::cerr << \"File does not exist.\" << std::endl;\n    return 1;\n  }\n\
  \n  std::ifstream file(filePath);\n  std::string line;\n  int lineCount = 0;\n \
  \ int wordCount = 0;\n  int charCount = 0;\n\n  while (std::getline(file, line))\
  \ {\n    lineCount++; // Increment line count\n    charCount += line.length(); //\
  \ Add the number of characters in the line\n    // Count words in the line\n   \
  \ std::istringstream iss(line);\n    std::string word;\n    while (iss >> word)\
  \ {\n      ++wordCount; // Increment word count\n    }\n  }\n\n  // Output the counts\n\
  \  std::cout << \"Lines: \" << lineCount << std::endl;\n  std::cout << \"Words:\
  \ \" << wordCount << std::endl;\n  std::cout << \"Characters: \" << charCount <<\
  \ std::endl;\n  return 0;\n}\n```\n\n### Explanation of the Code\n\n1. **File Validation**:\
  \ Similar to our previous example, we first check if the file exists and is a regular\
  \ file.\n2. **Counters Initialization**: We initialize three counters: `lineCount`,\
  \ `wordCount`, and `charCount`. Each will hold the respective counts as we read\
  \ through the file.\n3. **Reading Lines**: We use a `while` loop with `std::getline()`\
  \ to read each line from the file. For each line read:\n    * We increment `lineCount`\
  \ by one.\n    * We add the length of the line to `charCount`. This gives us the\
  \ total character count, including spaces and punctuation.\n4. **Counting Words**:\
  \ Within the same loop, we use an `std::istringstream` to break the line into words.\
  \ For each word encountered, we increment `wordCount`.\n5. **Outputting Results**:\
  \ After processing the file, we print out the counts for lines, words, and characters.\n\
  \n### Handling Edge Cases\n\nWhen counting lines, words, and characters, it’s important\
  \ to consider various edge cases that could affect our counts. Here are a few considerations:\n\
  \n* **Empty Lines**: An empty line should still be counted towards the line count.\
  \ However, it will not contribute to the word or character count.\n* **Whitespace**:\
  \ Leading and trailing whitespace in lines can affect character counts but should\
  \ not affect word counts if we handle word extraction properly.\n* **Multiple Spaces**:\
  \ Consecutive spaces between words should not count as multiple words. Using `std::istringstream`\
  \ handles this well since it skips whitespace by default.\n\n### Example of Enhanced\
  \ Word Counting\n\nTo improve our word counting further by ignoring punctuation\
  \ and case sensitivity, we can employ a cleaning function similar to what we discussed\
  \ previously:\n\n```cpp\nstd::string cleanWord(const std::string& word) {\n  std::string\
  \ cleaned;\n  std::remove_if(word.begin(), word.end(), std::back_inserter(cleaned),\n\
  \    [](char c) { return std::ispunct(c); });\n  std::transform(cleaned.begin(),\
  \ cleaned.end(), cleaned.begin(),\n    [](unsigned char c) { return std::tolower(c);\
  \ });\n  return cleaned;\n}\n```\n\nWe can integrate this function into our counting\
  \ logic when processing words:\n\n```cpp\nwhile (std::getline(file, line)) {\n \
  \ lineCount++;\n  charCount += line.length();\n  std::istringstream iss(line);\n\
  \  std::string word;\n  while (iss >> word) {\n    ++wordCount; // Increment word\
  \ count\n    // Optionally store cleaned words in a map for further analysis\n \
  \ }\n}\n```\n\nCounting lines, words, and characters in a text file is a practical\
  \ exercise that illustrates the power of C++ and the `std::filesystem` library.\
  \ By combining file reading capabilities with string manipulation, we can gather\
  \ valuable insights from text data.\n\nThese metrics can serve various purposes,\
  \ from providing feedback on text complexity to preparing data for further analysis.\
  \ As you develop your text file analyzer, consider how these fundamental operations\
  \ can be tailored to meet the specific needs of your applications.\n\n## 16.3 Displaying\
  \ Statistical Results\n\nAfter successfully counting lines, words, and characters\
