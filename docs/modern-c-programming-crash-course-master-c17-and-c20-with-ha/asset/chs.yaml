  ```\n\n# 第 17 章 – 简单银行系统\n\n## 17.1 账户的面向对象设计\n\n在设计银行系统时，最关键方面之一是我们如何建模涉及的各种实体。在本章中，我们将重点关注使用面向对象编程原则来设计银行账户。这些原则——封装、继承和多态——允许我们创建灵活且易于维护的代码库。一个结构良好的银行系统不仅能实现其功能目的，还为未来的扩展和修改提供了整洁的接口。\n\
  \n### 理解银行账户\n\n银行账户可以被视为用户财务资产的数字表示。每个账户通常包含几个属性：\n\n1.  **账户持有人**：拥有账户的个人或实体的名称。\n\
  2.  **账户号码**：账户的唯一标识符，确保它可以与其他区分来。\n3.  **余额**：账户中存储的当前金额。\n\n除了这些属性外，银行账户还需要存款、取款和检查余额等操作。为了实现这些功能，我们将创建一个\
  \ `BankAccount` 类，封装这些属性和行为。\n\n### 设计 BankAccount 类\n\n在 C++ 中，类允许我们定义将数据和方法封装在一起的对象。让我们开始构建我们的\
  \ `BankAccount` 类，它将包含私有属性和用于交互的公有方法。这种封装确保了对象的内部状态免受意外修改的影响。\n\n以下是 `BankAccount`\
  \ 类的详细实现：\n\n```cpp\n#include <iostream>\n#include <string>\n#include <stdexcept>\n\
  \nclass BankAccount {\nprivate:\n    std::string accountHolder;\n    std::string\
  \ accountNumber;\n    double balance;\npublic:\n    // 初始化账户的构造函数\n    BankAccount(const\
  \ std::string& holder, const std::string& number)\n    : accountHolder(holder),\
  \ accountNumber(number), balance(0.0) {}\n\n    // 向账户存款的方法\n    void deposit(double\
  \ amount) {\n        if (amount <= 0) {\n            throw std::invalid_argument(\"\
  Deposit amount must be positive.\");\n        }\n        balance += amount;\n  \
  \      std::cout << \"Deposited: \" << amount << \". New balance: \" << balance\
  \ << std::endl;\n    }\n\n    // 从账户中取款的方法\n    void withdraw(double amount) {\n\
  \        if (amount <= 0) {\n            throw std::invalid_argument(\"Withdrawal\
  \ amount must be positive.\");\n        }\n        if (amount > balance) {\n   \
  \         throw std::out_of_range(\"Insufficient funds.\");\n        }\n       \
  \ balance -= amount;\n        std::cout << \"Withdrew: \" << amount << \". New balance:\
  \ \" << balance << std::endl;\n    }\n\n    // 检查当前余额的方法\n    double getBalance()\
  \ const {\n        return balance;\n    }\n\n    // 显示账户信息的的方法\n    void displayAccountInfo()\
  \ const {\n        std::cout << \"Account Holder: \" << accountHolder << \"\\n\"\
  \n        << \"Account Number: \" << accountNumber << \"\\n\"\n        << \"Balance:\
  \ \" << balance << std::endl;\n    }\n};\n```\n\n### 类的关键特性\n\n1.  **构造函数**：构造函数初始化账户持有人姓名和账户号码，同时将余额设置为零。这种设计将所有必要的设置封装在一个方法内，使得创建新的账户实例变得非常简单。\n\
  2.  **存款方法**：`deposit` 方法检查存款金额是否为正数。如果验证失败，它将抛出一个异常。这种保护防止了无效操作并确保了账户余额的完整性。\n\
  3.  **取款方法**：与存款方法类似，`withdraw` 方法验证要求的取款金额是否为正以及是否有足够的资金。此方法也会抛出异常，这对于优雅地处理错误至关重要。\n\
  4.  **获取余额方法**：此方法返回账户的当前余额而不允许外部修改，遵循封装原则。\n5.  **显示账户信息**：此方法提供了账户详情的清晰输出，增强了用户体验，并更容易调试或记录账户活动。\n\
  \n### 实现银行应用程序\n\n现在我们已经有了 `BankAccount` 类，让我们看看如何将其集成到简单的银行应用程序中。该应用程序将允许用户创建账户、执行交易并查看账户详情。\n\
  \n以下是 `main` 函数可能的外观：\n\n```cpp\nint main() {\n    try {\n        // 为 Alice 创建一个新的银行账户\n\
  \        BankAccount myAccount(\"Alice Johnson\", \"123456789\");\n        myAccount.displayAccountInfo();\n\
  \        // 执行一些交易\n        myAccount.deposit(500);\n        myAccount.withdraw(200);\n\
  \        std::cout << \"Current balance: \" << myAccount.getBalance() << std::endl;\n\
  \        // 尝试取出超过余额的金额\n        myAccount.withdraw(400); // 这将抛出一个异常\n    } catch\
  \ (const std::exception& e) {\n        std::cerr << \"Error: \" << e.what() << std::endl;\n\
  \    }\n    return 0;\n}\n```\n\n在此代码中，我们为名为 Alice 的用户创建了 `BankAccount` 实例。我们演示了如何存款和取款同时也显示账户信息`try-catch`\
  \ 块用于捕获可能发生的异常。\n\n### 增强设计\n\n当我们继续开发这个银行系统时，有几个可以考虑的增强：\n\n1.  **账户类型**：我们可以通过创建不同类型的账户（如支票和储蓄账户）来扩展设计。这将允许针对特定类型有行为和属性。\n\
  2.  **交易历史**：实现交易历史功能需要维护交易记录。可以通过创建一个 `Transaction` 类并在 `BankAccount` 中存储交易列表来实现。\n\
  3.  **利息计算**：对于储蓄账户，我们可能想要实现利息计算。这可能涉及在期间对余额应用利息。\n4.  **用户验证**：在更高级系统中，我们将实施用户验证以确保只有授权人员才能访问或修改账户信息。这将增强安全可靠性。\n\
  5.  **错误日志**：对于生产级应用程序，记录错误和交易很重要。实现日志机制有助于维护审计追踪并诊断问题。\n6.  **并发处理**：在真实的银行应用程序中，多个用户可能会同时访问并修改账户。线程线程对于确保数据一致性至关重要。\n\
  \n## 17.2 使用文件进行持久化\n\n在任何应用程序中，特别是像银行系统这样处理用户数据的程序，确保数据可以可靠地保存和检索是关重要的。这一过程被称为数据持久化，允许用户在应用程序会话之间保持其信息。\n\
  \n首先，我们将重点关注将账户信息保存到文件并在应用程序启动时将其加载。这将涉及将账户数据序列化为适合存储的格式，并在需要时进行反序列化。\n\n### 序列化与反序列化\n\
  \n序列化是将对象状态转换为可以轻松保存到文件的格式的过程，而反序列化则是相反的过程。在我们的案例中，我们将账户持有人姓名、账户号码和余额转换为简单的文本格式。\n\
  \n\n\n\n让我们来增强 `BankAccount` 类，包含保存和加载账户数据的方法。\n\n```cpp\n#include <fstream>\n#include\
  \ <iostream>\n#include <string>\n#include <stdexcept>\n\nclass BankAccount {\nprivate:\n\
  \    std::string accountHolder;\n    std::string accountNumber;\n    double balance;\n\
  \npublic:\n    // 构造函数\n    BankAccount(std::string_view holder, std::string_view\
  \ number)\n    : accountHolder(holder), accountNumber(number), balance(0.0) {}\n\
  \n    // 其他方法...\n    // 将账户数据保存到文件\n    void saveToFile(const std::string& filename)\
  \ const {\n        std::ofstream outFile(filename);\n        if (!outFile) {\n \
  \           throw std::ios_base::failure(\"Failed to open file for writing.\");\n\
  \        }\n        outFile << accountHolder << '\\n'\n                << accountNumber\
  \ << '\\n'\n                << balance << '\\n';\n    }\n\n    // 从文件加载账户数据\n  \
  \  void loadFromFile(const std::string& filename) {\n        std::ifstream inFile(filename);\n\
  \        if (!inFile) {\n            throw std::ios_base::failure(\"Failed to open\
  \ file for reading.\");\n        }\n        std::getline(inFile, accountHolder);\n\
  \        std::getline(inFile, accountNumber);\n        inFile >> balance;\n    }\n\
  };\n```\n\n在 `saveToFile` 方法中，我们打开一个文件进行写入，检查操作是否成功，然后将持有人姓名、账户账号和余额写入文件，每项占新行。`loadFromFile`\
  \ 方法的操作相反：它从文件中读取账户数据并相应地填充类属性。\n\n### 使用 持久化功能\n\n现在我们已经为 `BankAccount` 类添加了文件\
  \ I/O 能力，让我们来看看如何利用这些功能。\n\n```cpp\nint main() {\n    try {\n        BankAccount\
  \ myAccount(\"Alice Johnson\", \"123456789\");\n        // ...\n    } catch (const\
  \ std::exception& e) {\n        // ...\n    }\n    return 0;\n}\n```\n\n在这段代码中，我们为\
  \ Alice 创建了一个银行账户，存入了一些钱，并将她的账户数据保存到名为 `account_data.txt` 的文件中。为了模拟应用程序重启，我们创建了一个\
  \ `BankAccount` 的新实例并从文件中加载保存的数据。最后，我们显示账户信息以验证数据已正确加载。\n\n### 潜在的增强方案\n\n虽然我们目前的实现展示了数据持久化的基础，但我们还可以考虑以下几个增强点：\n\
  \n1. **数据验证**：在加载数据时，验证值是否符合预期格式且在逻辑范围内是非常重要的。\n2. **错误处理**：改进错误处理，以管理文件可能不存在或损坏的情况。\n\
  3. **多账户支持**：考虑实现容器（如 `std::vector`）来管理多个账户，允许用户保存和加载所有账户。\n4. **二进制文件**：为了更高效的存储（特别是对于较大的数据集），可以考虑使用二进制文件代替文本文件，这将需要不同的序列化和反序列化策略。\n\
  \n## 17.3 基础身份验证\n\n在任何银行系统中，安全性都是至关重要的。用户需要信任他们的账户信息、交易记录和个人数据受到免未经授权访问的保护。为了实现这一点，基础身份验证是一项关键功能。身份验证通常通过凭据（如用户名和密码）验证用户的身份。对于我们的银行系统，我们将扩展\
  \ `BankAccount` 类的功能以包含这些安全特性。\n\n### 设计身份验证系统\n\n要实现基础身份验证，我们需要考虑以下方面：\n\n1. **用户凭据**：每个用户将拥有唯一的用户名和密码。\n\
  2. **账户创建**：我们需要一个方法来创建带有关联凭据的账户。\n3. **登录机制**：用户应该能够使用其凭据登录访问账户。\n4. **会话管理**：我们应该跟踪用户是否已登录。\n\
  \n让我们从扩展 `BankAccount` 类以包含身份验证功能开始。\n\n### 扩展 BankAccount 类\n\n首先，我们将添加存储用户名和密码的成员变量。我们还将包含创建账户、登录和检查登录状态的方法。更新后的类可能如下所示：\n\
  \n```cpp\n#include <iostream>\n#include <string>\n#include <stdexcept>\n#include\
  \ <fstream>\n\nclass BankAccount {\nprivate:\n    std::string accountHolder;\n \
  \   std::string accountNumber;\n    double balance;\n    std::string username; \
  \ // 为身份验证添加\n    std::string password;  // 为身份验证添加\n    bool loggedIn; // 跟踪登录状态\n\
  \npublic:\n    // 构造函数\n    BankAccount(std::string_view holder, std::string_view\
  \ number,\n                 std::string_view user, std::string_view pass)\n    :\
  \ accountHolder(holder), accountNumber(number), balance(0.0),\n      username(user),\
  \ password(pass), loggedIn(false) {}\n\n    // 其他方法...\n    // 创建新账户的方法\n    static\
  \ BankAccount createAccount(std::string_view holder,\n                         \
  \            std::string_view number,\n                                     std::string_view\
  \ user,\n                                     std::string_view pass) {\n       \
  \ return BankAccount(holder, number, user, pass);\n    }\n\n    // 用户身份验证方法\n  \
  \  bool login(const std::string& user, const std::string& pass) {\n        if (username\
  \ == user && password == pass) {\n            loggedIn = true;\n            std::cout\
  \ << \"Login successful!\" << std::endl;\n            return true;\n        }\n\
  \        std::cerr << \"Login failed: Incorrect username or password.\" << std::endl;\n\
  \        return false;\n    }\n\n    // 退出登录\n    void logout() {\n        loggedIn\
  \ = false;\n        std::cout << \"Logged out successfully.\" << std::endl;\n  \
  \  }\n\n    // 检查用户是否登录\n    bool isLoggedIn() const {\n        return loggedIn;\n\
  \    }\n\n    // 保存和加载方法...\n};\n```\n\n### 更新类的关键特性\n\n1. **用户名和密码**：成员变量 `username`\
  \ 和 `password` 存储凭据。在实际应用程序中应安全处理它们，但为了简单，我们在这里存储。\n2. **账户创建**：静态方法 `createAccount`\
  \ 用于创建账户。\n3. **登录方法**：`login` 方法对提供的用户名和密码进行校验。如果匹配，则更新登录状态。\n4. **退出登录**：`logout`\
  \ 方法允许用户结束会话。\n\n### 在主应用程序中实现基础身份验证\n\n现在我们有了身份验证功能，让我们看看它们在银行应用程序中是如何工作的。\n\n\
  ```cpp\nint main() {\n    try {\n        // 创建一个新的银行账户\n        BankAccount myAccount\
  \ = BankAccount::createAccount(\"Alice Johnson\", \"123456789\", \"alice\", \"securePassword\"\
  );\n\n        // 尝试登录\n        if (myAccount.login(\"alice\", \"securePassword\"\
  )) {\n            myAccount.deposit(500);\n            myAccount.saveToFile(\"account_data.txt\"\
  );\n            myAccount.displayAccountInfo();\n        }\n\n        // 退出登录\n\
  \        myAccount.logout();\n\n        // 尝试使用错误的密码登录\n        if (!myAccount.login(\"\
  alice\", \"wrongPassword\")) {\n            std::cout << \"Please try again.\" <<\
  \ std::endl;\n        }\n\n        // 加载账户数据\n        BankAccount loadedAccount(\"\
  \", \"\");\n        loadedAccount.loadFromFile(\"account_data.txt\");\n\n      \
  \  if (loadedAccount.login(\"alice\", \"securePassword\")) {\n            loadedAccount.displayAccountInfo();\n\
  \        }\n    } catch (const std::exception& e) {\n        std::cerr << \"Error:\
  \ \" << e.what() << std::endl;\n    }\n    return 0;\n}\n```\n\n\n\n\n## 4. 错误处理：当尝试使用错误的凭据登录时，应用程序将提供反馈而不会崩溃。\n\
  \n## 5. 加载账户数据：模拟重启后，我们加载账户数据并尝试再次登录，以检查身份验证是否在加载的数据上正常工作。\n\n## 安全考量\n\n虽然这种实现提供了基本的身份验证机制，但必须注意，以明文形式存储密码是不安全的。在生产环境中，您希望：\n\
  \n1. **哈希密码**：使用安全的哈希算法（如 `bcrypt`）来存储密码的哈希版本，而不是明文版本。\n2. **使用安全连接**：确保所有传输的数据（尤其是密码等敏感信息）都是通过安全连接（如\
  \ `HTTPS`）传输的。\n3. **实现账户锁定**：在多次登录尝试失败后，临时锁定账户以防止暴力破解攻击。\n4. **定期审计**：定期审计您的身份验证系统，以识别漏洞并确保符合安全最佳实践。\n\
  \n# 第 18 章 – 多线程网络爬虫\n\n## 18.1 C++ 网络基础\n\n网络技术使我们的程序能够通过互联网与服务器通信，允许我们从各种来源检索并处理数据。本章将探索构建健壮网络爬虫的关键概念和工具，该爬虫可以利用多线程高效地收集数据。\n\
  \nC++ 网络的核心在于使用 `sockets`（套字）。套字是跨网络发送和接收数据的端点。在创建网络爬虫时，您的应用程序通常作为客户端，向 Web 服务器发送请求并等待响应。理解如何管理这些连接对于成功的网络爬虫至关重要。\n\
  \n### 理解套字\n\n套字有多种形式，最常见的是 `TCP`（传输控制协议）和 `UDP`（用户数据报协议）。对于网络爬虫，由于其可靠性和面向连接的特性，`TCP`\
  \ 是首选。它确保数据包按正确的顺序且无损地到达目的地，这在处理 HTTP 请求和响应时至关重要。\n\n要在 C++ 中操作套字，我们可以利用如 `Boost.Asio`\
  \ 等库。该库为网络编程提供了一个高层接口，允许我们更轻松地处理异步操作。然而，如果您偏对网络过程有更多控制，也可以使用底层的 `POSIX` 套字 API。\n\
  \n### 设置 Boost.Asio\n\n在开始编写代码之前，您需要安装 `Boost` 库。根据您的操作系统，这可能涉及使用包管理器或直接从 [Boost\
  \ 网站](https://www.boost.org/) 下载。安装完成后，您可以在 C++ 程序中包含必要的头文件。\n\n以下是如何使用 `Boost.Asio`\
  \ 发起简单 HTTP GET 请求的示例：\n\n```cpp\n#include <boost/asio.hpp>\n#include <iostream>\n\
  #include <string>\n\nusing boost::asio::ip::tcp;\n\nvoid  fetch_url(const std::string&\
  \ host, const std::string& path) {\n    try {\n        boost::asio::io_context io_context;\n\
  \        // 解析主机名到 IP 地址\n        tcp::resolver resolver(io_context);\n        auto\
  \ endpoints = resolver.resolve(host, \"http\");\n        // 创建套字并连接到服务器\n      \
  \  tcp::socket socket(io_context);\n        boost::asio::connect(socket, endpoints);\n\
  \        // 构造请求\n        std::string request = \"GET \" + path + \" HTTP/1.1\\\
  r\\n\";\n        request += \"Host: \" + host + \"\\r\\n\";\n        request +=\
  \ \"Connection: close\\r\\n\\r\\n\";\n        // 发送请求\n        boost::asio::write(socket,\
  \ boost::asio::buffer(request));\n        // 读取响应\n        boost::asio::streambuf\
  \ response;\n        boost::asio::read(socket, response);\n        std::cout <<\
  \ &response; // 输出响应\n    } catch (std::exception& e) {\n        std::cerr << \"\
  Error: \" << e.what() << std::endl;\n    }\n}\n\nint  main() {\n    fetch_url(\"\
  www.example.com\", \"/\");\n    return  0;\n}\n```\n\n这段代码段说明了发起 HTTP GET 请求的过程。我们首先使用\
  \ `tcp::resolver` 解析主机名，将域名翻译为 IP 地址。然后，我们创建一个 `TCP` 套字并将其连接到服务器。HTTP GET 请求被构造为一个字符串，并通过套字发送。响应被读入\
  \ `boost::asio::streambuf` 中，然后将其打印到控制台。\n\n### 处理多个请求\n\n虽然上面的示例演示了单个请求，但网络爬虫通常需要并发从多个\
  \ URL 获取数据。为了实现这一点，我们可以实现多线程，这允许我们的程序同时处理多个任务。这正是 C++ 线程能力大显身场的地方。\n\n### C++ 多线程简介\n\
  \n随着 `C++11` 的引入，多线程成为语言的标准特性。`<thread>` 头文件提供了一个创建和管理线程的简单接口。通过利用这一功能，我们可以通过并行执行多个请求来提高网络爬虫的效率。\n\
  \n要开始操作，我们可以为想要爬取的每个 URL 创建一个线程。然而，管理大量线程可能会变得繁琐且消耗资源。更高效的方法是使用线程池，它维护一组固定数量的线程，这些线程可以处理多个请求。这种设计最小化了线程创建和销毁的开销，从而获得更好的性能。\n\
  \n### 实现线程池\n\n创建线程池涉及几个关键组件：一个用于存放任务的队列、一个工作线程池以及一个同步访问共享资源的机制。这里是线程池的一种简化 C++\
  \ 实现：\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <thread>\n#include\
  \ <queue>\n#include <functional>\n#include <condition_variable>\n#include <mutex>\n\
  #include <atomic>\n\nclass ThreadPool {\npublic:\n    ThreadPool(size_t num_threads);\n\
  \    ~ThreadPool();\n    void enqueue(std::function<void()> task);\n\nprivate:\n\
  \    std::vector<std::thread> workers;\n    std::queue<std::function<void()>> tasks;\n\
  \    std::mutex queue_mutex;\n    std::condition_variable condition;\n    std::atomic<bool>\
  \ stop;\n    void worker_thread();\n};\n\nThreadPool::ThreadPool(size_t num_threads)\
  \ : stop(false) {\n    for (size_t i = 0; i < num_threads; ++i) {\n        workers.emplace_back([this]\
  \ { worker_thread(); });\n    }\n}\n\nThreadPool::~ThreadPool() {\n    stop = true;\n\
  \    condition.notify_all();\n    for (std::thread &worker : workers) {\n      \
  \  worker.join();\n    }\n}\n\nvoid ThreadPool::enqueue(std::function<void()> task)\
  \ {\n    {\n        std::lock_guard<std::mutex> lock(queue_mutex);\n        tasks.push(std::move(task));\n\
  \    }\n    condition.notify_one();\n}\n\nvoid ThreadPool::worker_thread() {\n \
  \   while (true) {\n        std::function<void()> task;\n        {\n           \
  \ std::unique_lock<std::mutex> lock(queue_mutex);\n            condition.wait(lock,\
  \ [this] { return stop || !tasks.empty(); });\n            if (stop && tasks.empty())\n\
  \                return;\n            task = std::move(tasks.front());\n       \
  \     tasks.pop();\n        }\n        task();\n    }\n}\n```\n\n### 将线程池与网络爬虫集成\n\
  \n现在我们有了基础的线程池，可以将其与网络爬虫逻辑集成。以下是如何修改之前的示例，以利用线程池同时获取多个 URL：\n\n```cpp\n#include\
  \ <boost/asio.hpp>\n#include <iostream>\n#include <string>\n#include <vector>\n\
  #include <thread>\n\nusing boost::asio::ip::tcp;\n\nvoid  fetch_url(const std::string&\
  \ host, const std::string& path) {\n    try {\n        boost::asio::io_context io_context;\n\
  \        tcp::resolver resolver(io_context);\n        auto endpoints = resolver.resolve(host,\
  \ \"http\");\n        tcp::socket socket(io_context);\n        boost::asio::connect(socket,\
  \ endpoints);\n        std::string request = \"GET \" + path + \" HTTP/1.1\\r\\\
  n\";\n        request += \"Host: \" + host + \"\\r\\n\";\n        request += \"\
  Connection: close\\r\\n\\r\\n\";\n        boost::asio::write(socket, boost::asio::buffer(request));\n\
  \        boost::asio::streambuf response;\n        boost::asio::read(socket, response);\n\
  \        std::cout << &response;\n    } catch (std::exception& e) {\n        std::cerr\
  \ << \"Error: \" << e.what() << std::endl;\n    }\n}\n\nint main() {\n    ThreadPool\
  \ pool(4); // 创建 4 个线程\n    std::vector<std::pair<std::string, std::string>> urls\
  \ = {\n        {\"www.example.com\", \"/\"},\n        {\"www.google.com\", \"/\"\
  }\n    };\n\n    for (const auto& url : urls) {\n        pool.enqueue([url] {\n\
  \            fetch_url(url.first, url.second);\n        });\n    }\n\n    return\
  \ 0;\n}\n```\n\n\n\n\n\n```cpp\nrequest += \"Host: \" + host + \"\\r\\n\";\n\nrequest\
  \ += \"Connection: close\\r\\n\\r\\n\";\n\nboost::asio::write(socket, boost::asio::buffer(request));\n\
  \nboost::asio::streambuf response;\n\nboost::asio::read(socket, response);\n\nstd::cout\
  \ << \"Response from \" << path << \":\\n\" << &response << std::endl;\n\n} catch\
  \ (std::exception& e) {\n\n    std::cerr << \"Error fetching \" << path << \": \"\
  \ << e.what() << std::endl;\n}\n\n}\n\nint main() {\n\n    const std::vector<std::string>\
  \ urls = {\n        \"www.example.com/\",\n        \"www.example.com/about\",\n\
  \        \"www.example.com/contact\"\n    };\n\n    ThreadPool pool(4); // 创建一个包含\
  \ 4 个线程的线程池\n\n    for (const auto& url : urls) {\n        pool.enqueue([url] {\
  \ fetch_url(\"www.example.com\", url); });\n    }\n\n    return 0;\n}\n```\n\n在这个示例中，我们定义了一个要抓取的\
  \ URL 列表。我们创建了一个具有固定线程数（在此情况下为 4 个）的线程池，并为每个 URL 队列了抓取任务。这种设计允许我们的爬虫并发处理多个请求，显著提高了性能。\n\
  \n### 错误处理与健壮性\n\n在构建网络爬虫时，实现健壮的错误处理至关重要。网络操作可能因为各种原因失败，例如超时、主机不可用或 URL 格式错误。为了优雅地处理这些情况，我们应该在\
  \ `fetch_url` 函数中包含适当的异常处理。此外，考虑对瞬时错误添加重试机制、记录失败并实现超时，以防止在无响应的服务器上长时间等待。\n\n## 18.2\
  \ 线程池实现\n\n现在我们已经对 C++ 网络编程有了基本的了解，是时候实现一个线程池了。线程池允许我们管理一组可以并发处理任务的线程，这对于需要同时从多个\
  \ URL 获取数据的网络爬虫来说是理想的选择。\n\n线程池的主要目标是最小化为每个任务创建和销毁线程的开销。相反，我们在开始时创建固定数量的线程，这些线程会在任务可用时提取并执行它们。这种方法不仅提高了效率，还确保了系统资源得到优利用。\n\
  \n要在 C++ 中实现一个简单的线程池，我们将利用 `<thread>`、`<mutex>` 和 `<condition_variable>` 头文件。线程池将由一个用于存放任务的队列、一个管理线程的\
  \ `vector` 以及用于确保线程安全的同步机制组成。\n\n以下是基础 `ThreadPool` 类的分步实现：\n\n```cpp\n#include\
  \ <iostream>\n#include <vector>\n#include <thread>\n#include <queue>\n#include <functional>\n\
  #include <mutex>\n#include <condition_variable>\n#include <atomic>\n\nclass ThreadPool\
  \ {\npublic:\n    ThreadPool(size_t numThreads);\n    ~ThreadPool();\n    template<class\
  \ F>\n    void enqueue(F&& f);\n\nprivate:\n    std::vector<std::thread> workers;\
  \ // 工作线程池\n    std::queue<std::function<void()>> tasks; // 任务队列\n    std::mutex\
  \ queueMutex; // 任务队列互斥锁\n    std::condition_variable condition; // 任务通知条件变量\n \
  \   std::atomic<bool> stop; // 停止标志\n    void worker(); // 每个线程执行的函数\n};\n\nThreadPool::ThreadPool(size_t\
  \ numThreads) : stop(false) {\n    for (size_t i = 0; i < numThreads; ++i) {\n \
  \       workers.emplace_back([this] { this->worker(); });\n    }\n}\n\nThreadPool::~ThreadPool()\
  \ {\n    stop = true;\n    condition.notify_all();\n    for (std::thread &worker\
  \ : workers) {\n        worker.join();\n    }\n}\n\nvoid ThreadPool::worker() {\n\
  \    while (true) {\n        std::function<void()> task;\n        {\n          \
  \  std::unique_lock<std::mutex> lock(queueMutex);\n            condition.wait(lock,\
  \ [this] { return stop || !tasks.empty(); });\n            if (stop && tasks.empty())\
  \ return;\n            task = std::move(tasks.front());\n            tasks.pop();\n\
  \        }\n        task(); // 执行任务\n    }\n}\n\ntemplate<class F>\nvoid ThreadPool::enqueue(F&&\
  \ f) {\n    {\n        std::unique_lock<std::mutex> lock(queueMutex);\n        tasks.emplace(std::forward<F>(f));\n\
  \    }\n    condition.notify_one(); // 通知一个等待的线程\n}\n```\n\n在此实现中，`ThreadPool` 类包含了几个关键组件：\n\
  \n1. **构造函数与析构函数**：构造函数用指定数量的工作线程初始化线程池。每个线程都运行运行 `worker` 函数，该函数持续检查任务。析构函数将 `stop`\
  \ 标志置为 `true`，通知所有线程并等待它们完成。\n2. **任务队列**：我们使用 `std::queue` 来存放任务。每个任务都是一个 `std::function<void()>`，允许我们存储任何可调用对象。\n\
  3. **互斥锁与条件变量**：`mutex`（`queueMutex`）确保对任务队列的访问是线程安全的。`condition_variable` 允许线程等待直到任务可用或池停止。\n\
  4. **工作线程函数**：该函数在每个线程中运行。它等待任务可用，获取任务。\n5. **enqueue 方法**：该方法允许我们向池中添加任务。它通知一个等待的线程。\n\
  \n在此实现中，`ThreadPool` 类包含了几个关键组件：\n（注：此处示例文本逻辑与前文重复，已按要求翻译并保持格式）\n\n\n\n\n```cpp\n\
  void parse_html(const std::string& html) {\n  GumboOutput* output = gumbo_parse(html.c_str());\n\
  \  // Extract the title\n  GumboNode* root = output->root;\n  if (root->type ==\
  \ GUMBO_NODE_ELEMENT && root->v.element.tag == GUMBO_TAG_HTML) {\n    for (size_t\
  \ i = 0; i < root->v.element.children.length; ++i) {\n      GumboNode* child = static_cast<GumboNode*>(root->v.element.children.data[i]);\n\
  \      if (child->type == GUMBO_NODE_ELEMENT && child->v.element.tag == GUMBO_TAG_HEAD)\
  \ {\n        for (size_t j = 0; j < child->v.element.children.length; ++j) {\n \
  \         GumboNode* headChild = static_cast<GumboNode*>(child->v.element.children.data[j]);\n\
  \          if (headChild->type == GUMBO_NODE_ELEMENT && headChild->v.element.tag\
  \ == GUMBO_TAG_TITLE) {\n            std::string title = headChild->v.element.children.data[0]->v.text.text;\n\
  \            std::cout << \"Title: \" << title << std::endl;\n          }\n    \
  \    }\n      } else if (child->type == GUMBO_NODE_ELEMENT && child->v.element.tag\
  \ == GUMBO_TAG_BODY) {\n        for (size_t j = 0; j < child->v.element.children.length;\
  \ ++j) {\n          GumboNode* bodyChild = static_cast<GumboNode*>(child->v.element.children.data[j]);\n\
  \          if (bodyChild->type == GUMBO_NODE_ELEMENT && bodyChild->v.element.tag\
  \ == GUMBO_TAG_A) {\n            const char* link = bodyChild->v.element.attributes[0].value;\n\
  \            std::cout << \"Link: \" << link << std::endl;\n          }\n      \
  \  }\n      }\n    }\n  }\n  gumbo_destroy_output(&kGumboDefaultOptions, output);\n\
  }\n\nint main() {\n  std::string html = \"<html><head><title>Example Page</title></head>\"\
  \n  \"<body><a href=\\\"https://www.example.com\\\">Visit Example</a></body></html>\"\
  ;\n  parse_html(html);\n  return 0;\n}\n```\n\n在这段代码中，我们定义了一个函数 `parse_html`，它接收一个包含\
  \ HTML 内容的字符串。`gumbo_parse` 函数解析 HTML 并构建解析树。然后，我们遍历这棵树来寻找标题和链接。\n\n### 提取数据\n\n\
  为了提取特定数据，我们递归地遍历解析树。在之前的示例中，我们检查了 `<title>` 和 `<a>` 标签以收集它们的内容。这种方法可以扩展到根据你的爬取需求处理各种\
  \ HTML 元素。\n\n例如，如果你想从 body 中提取所有段落，可以如下所示修改解析逻辑：\n\n```cpp\nvoid extract_paragraphs(GumboNode*\
  \ node) {\n  if (node->type == GUMBO_NODE_ELEMENT && node->v.element.tag == GUMBO_TAG_P)\
  \ {\n    std::string paragraph = node->v.element.children.data[0]->v.text.text;\n\
  \    std::cout << \"Paragraph: \" << paragraph << std::endl;\n  }\n  // Recursively\
  \ traverse children\n  for (size_t i = 0; i < node->v.element.children.length; ++i)\
  \ {\n    GumboNode* child = static_cast<GumboNode*>(node->v.element.children.data[i]);\n\
  \    extract_paragraphs(child);\n  }\n}\n```\n\n你可以在解析 HTML 后调用此函数来提取并打印所有段落内容。\n\
  \n### 处理字符编码\n\n网页可以使用各种字符编码提供服务。Gumbo 原生支持 UTF-8 编码，但如果你遇到不同编码（如 ISO-8859-1）的 HTML，你需要在解析之前将其转换为\
  \ UTF-8。你可以使用 `iconv` 或 `Boost.Locale` 等库来实现此目的。\n\n### 错误处理\n\n在解析 HTML 时，预判诸如\
  \ HTML 格式错误等问题是非常关重要的。Gumbo 的设计能够优雅地处理此类情况，但你仍然应该实现错误处理来管理意外的情况。在访问其属性或内容之前，始终检查节点及其子节点的有效性。\n\
  \n# 第 19 章 – 使用 SFML 进行游戏开发\n\n## 19.1 安装和配置 SFML\n\n当你开启使用 C++ 进行游戏开发的之旅时，你可以利用的最易于上手且功能强大的库之一是\
  \ SFML，全称为 Simple and Fast Multimedia Library（简单快速多媒体库）。SFML 提供了丰富的功能集，使得处理图形、音频和用户输入变得更加容易，为开发游戏和多媒体应用奠定了坚实的基础。\n\
  \n### 理解 SFML\n\n在深入安装过程之前，理解什么是 SFML 以及它为什么是 C++ 开发者的有益选择至关重要。SFML 是一个跨平台库，抽象了多媒体编程涉及的许多复杂性。它允许你专注于游戏逻辑和设计，而不是被渲染、声音管理和输入处理的底层细节所困扰。无论你是想要创建简单游戏的新手，还是目标是更复杂项目的资深开发者，SFML\
  \ 都提供了用户友好的 API 和详细的文档来帮助你。\n\n### 第一步：下载 SFML\n\n要开始之前，你需要从官方网站下载 SFML。访问 [SFML\
  \ 下载页面](https://www.sfml-dev.org/download.php)。在这里，你会找到与各种操作系统兼容的版本：Windows、macOS\
  \ 和 Linux。确保选择一个与你的系统和编译器匹配的版本。\n\n如果你在 Windows 上并使用 Visual Studio，请选择与你的特定 Visual\
  \ Studio 版本对应的 Visual C++ 版本。例如，如果你正在使用 Visual Studio 2019，请选择该版本的相应预编译二进制文件。如果你在\
  \ Linux 上工作，你可能会发现通过包管理器安装 SFML 更加方便。例如，在 Ubuntu 上，你可以使用终端命令：\n\n```bash\nsudo apt-get\
  \ install libsfml-dev\n```\n\n此命令会自动处理下载和安装 SFML 库及其依赖项。\n\n### 第二步：安装 SFML\n\n\
  下载 SFML 后，通常会得到一个压缩包。将此文件解压到你选择的目录。在内部，你会看到几个文件夹：`include`、`lib` 和 `bin`。这些文件夹都有特定的目的：\n\
  \n* `include`：包含代码与 SFML 交互所需的头文件。\n* `lib`：包含将链接的编译库文件。\n* `bin`：包含应用程序所需的动态链接库\
  \ (DLL)。\n\n在 Windows 上，你需要确保在运行应用程序时 DLL 文件是可用的。一种方法是将 `bin` 文件夹的内容放入项目目录或任何包含在系统\
  \ `PATH` 中的目录。\n\n### 第三步：配置你的开发环境\n\n现在你已经下载并解压了 SFML，下一步是配置你的开发环境。根据你使用的 IDE，此过程可能会不同。在这里，我们将重点介绍\
  \ Visual Studio（这是最常用的 IDE 之一）。\n\n1. 创建新项目：启动 Visual Studio 并创建一个 C++ 项目。你可以根据偏好选择空项目或控制台应用程序。对于游戏开发，控制台应用程序通常足够。\n\
  \n2. 设置包含目录：右键点击解决方案管理器中的项目名称并选择“属性”。导航到 `C/C++` > `常规`。在这里，你会找到“附加包含目录”选项。添加 SFML\
  \ 包中 `include` 文件夹的路径。此步骤允许编译器在包含头文件时找到 SFML 头文件。\n\n3. 链接库：接下来，转到 `链接器` > `常规`\
  \ 并找到“附加库目录”。添加 SFML 安装中 `lib` 文件夹的路径。这告诉链接器去哪里寻找编译好的 SFML 库。之后，导航到 `链接器` > `输入`，并在“附加依赖项”部分列出你将使用的\
  \ SFML 库。对于基础应用程序，你通常需要：\n\n* `sfml-graphics.lib`\n* `sfml-window.lib`\n* `sfml-system.lib`\n\
  \n如果你的项目将利用音频功能，还要包含 `sfml-audio.lib`。记住在 Debug 模式下编译时使用调试版本（`-d.lib`）。\n\n4. 设置运行时库：确保你正在链接到正确的运行时库至关重要。在项目属性中，在\
  \ `C/C++` > `代码生成` 下检查“运行库”设置。确保它与你下载的 SFML 库版本匹配（例如，发布版本使用多线程 DLL）。\n\n\n\n\n\n\
  ### 5. DLLs\n最后，确保在你的应用程序运行时，`bin` 目录下的必要 DLL 文件是可访问的。你可以将它们复制到项目的工作目录，或者将 `bin`\
  \ 目录添加到系统的 `PATH` 环境变量中。\n\n### 第 4 步：测试你的设置\n\n安装并配置好 SFML 后，现在是测试你的设置以确保一切运行正常的时间了。打开你的主\
  \ `CPP` 文件并添加以下代码段：\n\n```cpp\n#include <SFML/Graphics.hpp>\n\nint main() {\n  \
  \  sf::RenderWindow window(sf::VideoMode(800, 600), \"SFML works!\");\n\n    while\
  \ (window.isOpen()) {\n        sf::Event event;\n        while (window.pollEvent(event))\
  \ {\n            if (event.type == sf::Event::Closed)\n                window.close();\n\
  \        }\n        window.clear();\n        window.display();\n    }\n    return\
  \ 0;\n}\n```\n\n这个简单的程序初始化了一个分辨率为 800x600 像素的窗口并将其显示出来。事件循环检查各种事件（包括关闭事件），允许你正常关闭窗口。当你运行这段代码时，你应该能看到一个标题为“SFML\
  \ works!”的窗口。如果窗口无问题地打开，说明你已成功安装并配置了 SFML。\n\n### 实际考虑\n\n虽然安装和配置看起来很简单，但你可能会在此过程中遇到一些挑战。常见问题包括：\n\
  \n- **缺少 DLL**：如果你的应用程序由于缺少 DLL 而无法启动，请确保 `bin` 目录中的必要文件与可执行文件位于同一目录，或者包含在系统的 `PATH`\
  \ 中。\n- **链接器错误**：如果你收到关于未定义引用（undefined references）的链接器错误，请检查是否在项目属性中添加了正确的库文件，以及你是否为构建类型（`Debug`\
  \ 与 `Release`）使用了正确的版本。\n- **编译器兼容性**：确保下载的 SFML 版本与你的编译器兼容。版本不匹配会导致编译问题。\n\n##\
  \ 19.2 创建一个简单的 2D 游戏\n\n#### 游戏概念概述\n\n对于我们的简单游戏，让我们想象这样一个场景：玩家控制一个由方形表示的角色。目标是收集掉落的圆形（代表物品），同时避开由矩形表示的静态障碍物。游戏将包含玩家移动、碰撞检测和得分跟踪等基本元素。\n\
  \n### 第 1 步：设置游戏结构\n\n在深入代码之前，让我们先概述一下游戏的结构。我们需要以下组件：\n\n1. **玩家实体 (Player Entity)**：这将是玩家控制的角色。\n\
  2. **物品实体 (Item Entity)**：这将代表从屏幕顶部掉落的可收集物品。\n3. **障碍物实体 (Obstacle Entity)**：这将代表玩家必须避开的障碍物。\n\
  4. **游戏循环 (Game Loop)**：更新游戏状态、处理输入并渲染图形的核心循环。\n\n### 第 2 步：代码实现\n\n让我们开始编写游戏代码。打开你的\
  \ C++ 文件并使用以下代码作为基础：\n\n```cpp\n#include <SFML/Graphics.hpp>\n#include <vector>\n\
  #include <cstdlib>\n#include <ctime>\n\nclass Player {\npublic:\n    sf::RectangleShape\
  \ shape;\n    float speed;\n    Player(float x, float y) {\n        shape.setSize(sf::Vector2f(50,\
  \ 50));\n        shape.setFillColor(sf::Color::Green);\n        shape.setPosition(x,\
  \ y);\n        speed = 5.0f;\n    }\n    void move(const sf::Vector2f& direction)\
  \ {\n        shape.move(direction * speed);\n    }\n};\n\nclass Item {\npublic:\n\
  \    sf::CircleShape shape;\n    Item(float x, float y) {\n        shape.setRadius(20);\n\
  \        shape.setFillColor(sf::Color::Yellow);\n        shape.setPosition(x, y);\n\
  \    }\n};\n\nclass Obstacle {\npublic:\n    sf::RectangleShape shape;\n    Obstacle(float\
  \ x, float y) {\n        shape.setSize(sf::Vector2f(50, 50));\n        shape.setFillColor(sf::Color::Red);\n\
  \        shape.setPosition(x, y);\n    }\n};\n\nint main() {\n    srand(static_cast<unsigned>(time(0)));\
  \ // 随机数生成的种子\n    sf::RenderWindow window(sf::VideoMode(800, 600), \"Simple 2D\
  \ Game\");\n    window.setFramerateLimit(60);\n    Player player(375, 500);\n  \
  \  std::vector<Item> items;\n    std::vector<Obstacle> obstacles;\n    float itemSpawnTimer\
  \ = 0;\n    float itemSpawnInterval = 1.0f; // 1 秒\n\n    // 创建一些障碍物\n    for (int\
  \ i = 0; i < 5; ++i) {\n        obstacles.emplace_back(rand() % 750, rand() % 550);\n\
  \    }\n\n    while (window.isOpen()) {\n        sf::Event event;\n        while\
  \ (window.pollEvent(event)) {\n            if (event.type == sf::Event::Closed)\n\
  \                window.close();\n        }\n        // 玩家移动\n        sf::Vector2f\
  \ direction(0.f, 0.f);\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Left))\n\
  \            direction.x -= 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Right))\n\
  \            direction.x += 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Up))\n\
  \            direction.y -= 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Down))\n\
  \            direction.y += 1;\n\n        player.move(direction);\n\n        itemSpawnTimer\
  \ += 0.01f; // 更新计时器\n        if (itemSpawnTimer >= itemSpawnInterval) {\n     \
  \       items.emplace_back(rand() % 750, -50); // 生成新物品\n            itemSpawnTimer\
  \ = 0;\n        }\n\n        for (auto& item : items) {\n            item.shape.move(0,\
  \ 2); // 物品向下移动\n            if (item.shape.getPosition().y > 600) {\n         \
  \       item.shape.setPosition(rand() % 750, -50);\n            }\n        }\n\n\
  \        for (auto& obstacle : obstacles) {\n            obstacle.shape.move(0,\
  \ 1); // 障碍物向下移动\n        }\n\n        window.clear();\n        window.draw(player.shape);\n\
  \        for (const auto& item : items) {\n            window.draw(item.shape);\n\
  \        }\n        for (const auto& obstacle : obstacles) {\n            window.draw(obstacle.shape);\n\
  \        }\n        window.display();\n    }\n    return 0;\n}\n```\n\n### 代码解释\n\
  \n1. **Player 类**：定义玩家控制的角色。它使用 `sf::RectangleShape` 来表示自己。\n2. **Item 类**：代表从屏幕顶部掉落的可收集物品。它使用\
  \ `sf::CircleShape` 来表示。\n3. **Obstacle 类**：代表玩家必须避开的障碍物。它使用 `sf::RectangleShape`\
  \ 来表示。\n4. **游戏循环**：处理事件、更新状态、处理输入并渲染图形的核心循环。\n\n### 第 3 步：增强游戏\n\n现在我们已经有了基础的游戏结构，可以添加一些增强功能：\n\
  \n1. **碰撞检测**：实现玩家收集物品或与障碍物碰撞的逻辑。可以使用边界框来检查重叠。\n2. **得分跟踪**：引入得分系统，当玩家收集物品时增加分数。\n\
  3. **游戏结束条件**：定义玩家与障碍物碰撞时会发生什么。你可以重启游戏或显示游戏结束界面。\n\n这里是如何实现碰撞检测和得分的示例：\n\n```cpp\n\
  int score = 0;\n\n// 在游戏循环内部，更新物品之后\nfor (auto it = items.begin(); it != items.end();\
  \ ) {\n    if (player.shape.getGlobalBounds().intersects(it->shape.getGlobalBounds()))\
  \ {\n        score++;\n        it = items.erase(it); // 从向量中移除物品\n    } else {\n\
  \        ++it;\n    }\n}\n\n// 检查与障碍物的碰撞\nfor (const auto& obstacle : obstacles)\
  \ {\n    if (player.shape.getGlobalBounds().intersects(obstacle.shape.getGlobalBounds()))\
  \ {\n        // 游戏结束逻辑\n        window.close(); // 为了简单起见，我们直接关闭窗口\n    }\n}\n```\n\
  \n## 19.3 事件处理与游戏循环\n\n#### 游戏循环\n\n每个游戏的核心都是游戏循环。这个循环在游戏期间持续运行，处理用户输入、更新游戏状态并渲染图形。良好的游戏循环可以确保你的游戏无论机器性能如何都能流畅一致地运行。\n\
  \n#### 游戏循环的基本结构\n\n典型的游戏循环包含三个主要阶段：\n\n\n\n\n\n1. **事件处理**：此阶段捕获并处理用户输入，例如键盘和鼠标事件。它允许游戏对玩家的操作做出响应，如移动角色或触发动作。\n\
  2. **游戏更新**：在此阶段，游戏状态会进行更新。这包括移动物体、检查碰撞以及更新分数。游戏逻辑在此处应用，定义了游戏随时间演变的方式。\n3. **渲染**：最后，游戏循环在屏幕上绘制游戏的当前状态。这涉及清除上一帧、渲染更新后的游戏对象以及将所有内容显示给玩家。\n\
  \n## 在 SFML 中实现游戏循环\n\n让我们来看看如何在 SFML 中实现一个简单的游戏循环。下面是我们之前代码的修改版本，它结合了结构化的游戏循环以及事件处理：\n\
  \n```cpp\n#include <SFML/Graphics.hpp>\n#include <vector>\n#include <cstdlib>\n\
  #include <ctime>\n\nclass Player {\npublic:\n    sf::RectangleShape shape;\n   \
  \ float speed;\n    Player(float x, float y) {\n        shape.setSize(sf::Vector2f(50,\
  \ 50));\n        shape.setFillColor(sf::Color::Green);\n        shape.setPosition(x,\
  \ y);\n        speed = 5.0f;\n    }\n    void move(const sf::Vector2f& direction)\
  \ {\n        shape.move(direction * speed);\n    }\n};\n\nclass Item {\npublic:\n\
  \    sf::CircleShape shape;\n    Item(float x, float y) {\n        shape.setRadius(20);\n\
  \        shape.setFillColor(sf::Color::Yellow);\n        shape.setPosition(x, y);\n\
  \    }\n};\n\nclass Obstacle {\npublic:\n    sf::RectangleShape shape;\n    Obstacle(float\
  \ x, float y) {\n        shape.setSize(sf::Vector2f(50, 50));\n        shape.setFillColor(sf::Color::Red);\n\
  \        shape.setPosition(x, y);\n    }\n};\n\nint main() {\n    srand(static_cast<unsigned>(time(0)));\
  \ // 随机数生成种子\n    sf::RenderWindow window(sf::VideoMode(800, 600), \"Event Handling\
  \ and Game Loop\");\n    window.setFramerateLimit(60);\n    Player player(375, 500);\n\
  \    std::vector<Item> items;\n    std::vector<Obstacle> obstacles;\n    float itemSpawnTimer\
  \ = 0;\n    float itemSpawnInterval = 1.0f; // 1 秒\n    int score = 0;\n\n    //\
  \ 创建一些障碍\n    for (int i = 0; i < 5; ++i) {\n        obstacles.emplace_back(rand()\
  \ % 750, rand() % 550);\n    }\n\n    while (window.isOpen()) {\n        // 事件处理\n\
  \        sf::Event event;\n        while (window.pollEvent(event)) {\n         \
  \   if (event.type == sf::Event::Closed) {\n                window.close();\n  \
  \          }\n        }\n\n        // 玩家移动\n        sf::Vector2f direction(0.f,\
  \ 0.f);\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Left))\n         \
  \   direction.x -= 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Right))\n\
  \            direction.x += 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Up))\n\
  \            direction.y -= 1;\n        if (sf::Keyboard::isKeyPressed(sf::Keyboard::Down))\n\
  \            direction.y += 1;\n        player.move(direction);\n\n        // 生成物品\n\
  \        itemSpawnTimer += 0.01f; // 增加计时器\n        if (itemSpawnTimer >= itemSpawnInterval)\
  \ {\n            items.emplace_back(rand() % 780, 0); // 在随机 x 位置生成\n          \
  \  itemSpawnTimer = 0;\n        }\n\n        // 更新物品\n        for (auto it = items.begin();\
  \ it != items.end(); ) {\n            it->shape.move(0, 2); // 物品向下移动\n        \
  \    if (it->shape.getPosition().y > 600) {\n                it = items.erase(it);\
  \ // 移除屏幕外的物品\n            } else {\n                ++it;\n            }\n    \
  \    }\n\n        // 碰撞检测\n        for (auto it = items.begin(); it != items.end();\
  \ ) {\n            if (player.shape.getGlobalBounds().intersects(it->shape.getGlobalBounds()))\
  \ {\n                score++;\n                it = items.erase(it); // 移除收集的物品\n\
  \            } else {\n                ++it;\n            }\n        }\n       \
  \ for (const auto& obstacle : obstacles) {\n            if (player.shape.getGlobalBounds().intersects(obstacle.shape.getGlobalBounds()))\
  \ {\n                // 此处编写游戏结束逻辑\n                window.close(); // 为了简单起见，直接关闭窗口\n\
  \            }\n        }\n\n        // 渲染\n        window.clear();\n        for\
  \ (const auto& obstacle : obstacles) {\n            window.draw(obstacle.shape);\n\
  \        }\n        window.draw(player.shape);\n        for (const auto& item :\
  \ items) {\n            window.draw(item.shape);\n        }\n        window.display();\n\
  \    }\n    return 0;\n}\n```\n\n## 游戏循环说明\n\n1. **事件处理**：循环从轮询事件开始。这允许我们检查用户输入。\n\
  2. **游戏更新**：在此循环中，会更新游戏状态。这包括移动物体、检查碰撞以及更新分数。\n3. **渲染**：最后，游戏循环在屏幕上绘制游戏的当前状态。这涉及清除上一帧、渲染更新后的游戏对象以及将所有内容显示给玩家。\n\
  \n## 游戏循环说明\n\n1. **事件处理**：循环从轮询事件开始。这允许我们检查用户输入。\n2. **游戏更新**：在此循环中，会更新游戏状态。这包括移动物体、检查碰撞以及更新分数。\n\
  3. **渲染**：最后，游戏循环在屏幕上绘制游戏的当前状态。这涉及清除上一帧、渲染更新后的游戏对象以及将所有内容显示给玩家。\n\n## 游戏循环说明\n\n\
