- "# R 数据科学并行计算：R、C 和 CUDA 示例\n\n\n\n![](img/cover.jpeg)\n\n![Image 1](img/index-1_1.jpg)\n\
  \n![Image 2](img/index-1_2.png)\n\n![Image 3](img/index-1_3.jpg)\n\n\n\n“…一本关于并行计算的详尽且易于阅读的指南——适用于广泛学科的研究人员和学生。……一本‘必不可少’的参考书……”\n\
  —David E. Giles，维多利亚大学\n\n“这是一本我既会用作参考书，也会用于教学的书。书中的示例非常引人入胜，叙述方式让读者直接从概念过渡到可运行的代码。”\n\
  —Michael Kane，耶尔大学\n\n## 并行数据科学\n\n### 图书概述\n`Parallel Computing for Data Science:\
  \ With Examples in R, C++ and CUDA` 是首批专门专注于数据科学中并行数据结构、算法、软件工具和应用的并行计算书籍之一。它不仅包含了来自经典的“n\
  \ 个观测值，p 个变量”矩阵格式的示例，还涵盖了时间序列、网络图模型以及数据科学中许多其他结构。该书还讨论了跨多种硬件类型并可以使用多种编程语言使用的软件软件包。\n\
  \n### 特点\n- 侧重于数据科学领域的应用，包括统计学、数据挖掘和机器学习\n- 讨论数据科学中常见的结构，例如网络数据模型\n- 贯穿始终通用原则，例如避免降低并行程序速度的因素\n\
  - 涵盖了主要的计算平台类型：多核、集群和图形处理器（GPU）\n- 解释了 `Thrust` 包如何简化多核机器和 GPU 的编程，并使同一代码能够在任一平台上运行\n\
  - 在作者的网页上提供了示例代码\n\n### 关于作者\n`Norman Matloff` 是加利州大学戴维斯分校的计算机科学教授，他曾是统计系的创始成员。他是一位统计顾问，也曾是数据库软件开发人员。他在洛杉矶加州大学（UCLA）获得了纯数学博士学位。\n\
  \n## 出版详情\n- **ID**: K20322\n- **网站**: `www.crcpress.com`\n- **文件信息**: `K20322_cover.indd`,\
  \ `K20322_FM.indd`\n- **出版商**: Chapman & Hall/CRC\n- **系列**: R 系列\n\n### 系列主编\n\
  - **John M. Chambers**: 斯坦福大学统计系，生物统计分系，美国加利福尼亚州斯坦福市\n- **Torsten Hothorn**: 苏黎世大学统计系，瑞士\n\
  - **Duncan Temple Lang**: 加利州大学戴维斯分校统计系，RStudio，美国加利福尼亚州戴维斯，**Hadley Wickham**\n\
  \n## 目标与范围\n本丛书反映了 `R`（一种用于统计计算和图形图形编程语言和软件环境）近期在开发和应用方面的快速增长。`R` 现在广泛应用于学术研究、教育和工业。它在不断成长，核心软件定期发布新版本，并提供了超过\
  \ 6000 个包。文档很难跟上软件扩展的速度，而这一重要的丛书为出版涵盖 `R` 开发和应用多个方面的书籍提供了一个平台。\n\n该系列的范围广泛，涵盖了三个主线：\n\
  - `R` 在特定学科中的应用，如生物学、流行病学、遗传学、工程学、金融和社会科学。\n- 使用 `R` 研究统计方法论主题，如线性模型和混合模型、时间序列、贝叶斯方法和缺失数据。\n\
  - `R` 的开发，包括编程、包构建和图形处理。\n\n这些书籍将吸引 `R` 软件的程序员和开发者，以及许多领域的应用统计学家和数据分析师。书中将包含详细的练习示例和完全集成到文本中的\
  \ `R` 代码，确保其对研究人员、从业者和学生的实用性。\n\n## 已出版书\n- `Stated Preference Methods Using R`,\
