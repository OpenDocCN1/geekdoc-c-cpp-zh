  \ C++/CUDA/OpenMP/Thrust 知识的情况下使用 `Rth`。但对于那些想要开发自己的 `Rth` 函数的人，这里是 `rthpearson()`\
  \ 的内部实现样式：\n\n```cpp\n// Rth i m p l e m e n t a t i n o f P e a r s o n p r o d\
  \ u c t −moment\n// c o r r e l a t i o n\n// s i n g l e −p a s s ,\ns u b j e\
  \ c t t o i n c r e a s s e d r o u n d o f f e r r o r\n#include <t h r u s t /\
  \ d e v i c e v e c t o r . h>\n#include <t h r u s t / i n n e r p r o d u c t\
  \ . h>\n#include <math . h>\n#include <Rcpp . h>\n#include ” backend . h”\n\ntypedef\
  \ t h r u s t : : d e v i c e v e c t o r <int> i n t v e c ;\n typedef t h r u\
  \ s t : : d e v i c e v e c t o r <double> d o u b l e v e c ;\n\nRcppExport SEXP\
  \ r t h p e a r s o n (SEXP x , SEXP y , SEXP n t h r e a d s ) \n{\n    Rcpp :\
  \ : NumericVector xa ( x ) ;\n    Rcpp : : NumericVector ya ( y ) ;\n    i n t n\
  \ = xa . s i z e ( ) ;\n    d o u b l e v e c dx ( xa . b e g i n ( ) , xa . end\
  \ ( ) ) ; \n    d o u b l e v e c dy ( ya . b e g i n ( ) , ya . end ( ) ) ; \n\
  \    double z e r o = ( double ) 0 . 0 ;\n\n#i f RTH OMP\n    omp s e t num t h\
