  \ ” a ” ”b”\n> `str ( z )`\nList of 2\n$ a : num [ 1:50 ]\n0.302 0.680 0.209 0.510\
  \ 0.405\n...\n$ b : List of 2\n ..$u :\nint\n [ 1:25] 33 67 32 76 29 34 54 97 41\
  \ 57 87 36 92 81 31 78 12 85 73 26 44 86 40 43\n$v\n[ 1 ] ” blue sky ”\n\n\n\n\n\
  \n`scanf()` 函数有两个参数，这里第一个是字符字符串 `\"%d\"`，它定义了格式。在这里，我们指定读取一个整数（`’d’` 代表“十进制”）。\n\
  \n在第二个参数上，情况变得更加微妙，我们在这里看到了 C 和 R 之间重大的哲学差异。后者（R）以（通常）不允许副作用为傲，意味着在 R 中你不能更改参数的值。例如，R\
  \ 的调用 `sort(x)` **不会**改变 `x`。那么 C 来说呢？\n\n从技术上讲，C 也不允许对参数进行直接修改。但关键在于，C 允许并大量使用指针变量。例如，考虑以下代码：\n\
  \n```c\nint u;\nint *v = &u;\n*v = 8;\n```\n\n`&u` 中的取地址符表示该表达式求值为为 `u` 的内存地址。`v`\
  \ 中的星号告诉编译器，我们意图让 `v` 包含内存地址。最后，`*v = 8;` 这一行表示：“将 8 放入 `v` 所指向的任何内存位置。”这意味着 `u`\
  \ 现在将包含 8！\n\n现在我们可以看到那个 `scanf()` 调用中发生了什么。让我们把它重写为：\n\n```c\nint *z = &y[i];\n\
  scanf(\"%d\", z);\n```\n\n我们正在告诉编译器生成机器码，将从键盘读取的值放置到 `z` 所指向的任何内存位置——即放置在 `y[i]`\
  \ 中。虽然很复杂，但这就是它的工作原理。我们不需要在第 29 行这样做，因为我们没有改变 `y[i]`。\n\n同样的原理也适用于第 12 行和第 17 行。在前者中，我们声明\
  \ `x` 是一个指针变量。但这如何与第 27 行相吻合呢？\n\n为什么后者没有写类似 `&y` 的内容呢？这是因为数组变量被认为是指针。简单的表达式 `y`（不带下标）实际上的意思是\
  \ `&y[0]`。\n\n如果你在这方面遇到困难，请宽宽心，指针无疑是困扰初 C 程序员（尤其是计算机科学专业的学生！）最难理解的概念了。只要坚持下去——你很快就会习惯的。\n\
  \n# 附录 C. C 简介\n\n## C.1 C++\n\n当面向对象编程浪潮来袭时，C 世界的许多人希望 C 拥有 OOP。因此，有了 C++（最初称为“带类的\
  \ C”）。\n\n读者可以参考网络和书籍中任何关于 C++ 的优秀教程。但这里有一个非常简短的概述，只是让读者了解一下涉及的内容。\n\nC++ 的类结构在很大程度上类似于\
  \ R 的 S4。我们使用关键字 `new` 创建一个新的类实例，这就像我们在 R 中调用 `new()` 来创建一个 S4 类对象一样。\n\n与 S4 一样，C++\
  \ 类通常包含方法，即专门为该类定义的函数。例如，在我们书的 `Rcpp` 代码中，我们有时会有表达式 `Rcpp::wrap`，它的意思是 `Rcpp` 类内部的\
  \ `wrap()` 函数。\n\nC++ 继续延续了 C 对指针的强调。例如，一个重要的关键字是 `this`。当从类实例的某个方法中调用它时，它是指向该实例的指针。\n\
