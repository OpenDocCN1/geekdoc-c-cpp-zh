  # 12.7 求解线性方程组\n\n267\n\n矩阵 `Dk` 的计算非常简单。因此，如果人们拥有一种寻找矩阵特征值的并行方法（这也能为我们提供 `C`），那么这就是计算\
  \ `Ak` 的另一种并行方法。\n\n然而，寻找特征值并不是一种“尴尬并行”（embarrassingly parallel）的操作。在我们的图连通性应用中，我们需要精确的数值，而不是舍入值。\n\
  \n实际上，计算特征值的方法之一确实涉及矩阵幂。\n\n## 12.6.4 `matpow` 包\n\n我与 Jack Norman 合作开发的矩阵幂计算包 `matpow`\
  \ 发布在 CRAN 上，它能够灵活、方便地计算矩阵幂。\n\n### 12.6.4.1 特性\n\n`matpow` 包在两个重要方面都具有灵活性：\n\n\
  • 可以指定用户提供的回调函数，以便在每次迭代结束时执行特定于应用程序的操作。\n\n例如，如果使用幂迭代法寻找特征值，可以在每次迭代后检查收敛性，并在达到收敛时结束迭代过程。\n\
  \n• 可以适应任何类型的矩阵类/乘法类型——包括内置的 R `\"matrix\"` 类、GPU 乘法等。这意味着我们可以轻松地对矩阵幂的计算。\n\n##\
  \ 12.7 求解线性方程组\n\n假设我们有一个方程组：\n\n```\nai1x1 + ... + ai,nxn = bi, i = 1, ..., n,\n\
  ```\n\n(12.24)\n\n其中 `xi` 是待求解的未知数。这类方程组在数据科学中经常出现，例如在线性回归分析、极大似然估计的计算等领域。\n\n268\n\
  \n第 12 章 矩阵运算\n\n如你所知，该系统可以紧凑地表示为 `Ax = b`\n\n(12.25)\n\n其中 `A` 是 $n \\times n$\
  \ 矩阵，元素为 `aij`，`x` 和 `b` 是 $n \\times 1$ 向量，元素为 `bi`。\n\n原则上，我们可以通过计算 `A−1b` 简单地找到\
  \ `x`。然而，我们需要考虑数值准确性以及我们的方法“尴尬并行”的程度（或是否并行）。\n\n### 12.7.1 经典方法：高斯消元和 LU 分解\n\n\
  通过将列向量 `b` 附加在 `A` 的右侧形成 $n \\times (n + 1)$ 矩阵 `C = (A|b)`。然后对 `C` 的行进行操作，最基础版本的顺序情况伪代码如下：\n\
  \n```\nfor i = 1 to n\n  divide row i by c[i][i]\n  for r = 1 to n, r != i\n   \
  \ replace row r by row r − c[r][i] times row i\n```\n\n在上述伪代码的除法操作中，`cii` 可能为 0\
  \ 或接近 0。在这种情况下会执行主元操作（伪代码中未显示）：首先将该行与下方另一行交换。\n\n这会将 `C` 转换为简化行阶梯形，此时 `A` 变为单位矩阵\
  \ `I`，而 `b` 变为我们的解向量 `x`。（如果进行过任何主元操作，我们必须重新排列 `b` 的原始顺序。）一种重要的变体是仅转换为行阶梯形。这意味着\
  \ `C` 最终呈上三角形式，所有 `i > j` 的元素 `cij` 均为 0，且所有对角线元素均等于 1。以下是伪代码：\n\n```\nfor i = 1\
  \ to n\n  divide row i by c[i][i]\n  for r = i + 1 to n\n    // vacuum if r = n−1\n\
  \    replace row r by row r − c[r][i] times row i\n```\n\n这对应于一组新方程：\n\n```\nc11x1\
  \ + c11x1 + c22x2 + ... + c1,nxn = b1\nc11x1 + c22x2 + ... + c1,nxn = b1\nc22x2\
  \ + ... + d2,nxn = b2\n...\ncn,nxn = bn\n```\n\n然后我们通过回代法找到 `xi`：\n\n```\nx[n] =\
  \ b[n] / c[n, n]\n```\n\n```\nfor i = n−1 downto 1\n  x[i] = (b[i] − c[i][n−1]*x[n−1]\
  \ −... − c[i][i+1]*x[i+1] ) /c[i][i]\n```\n\n寻找行阶梯形与著名的 LU 分解有关，LU 解将 `A` 写为：\n\n\
  ```\nA = LU\n```\n\n其中 `L` 和 `U` 分别是下三角和上三角矩阵。可以通过回代法找到 `L` 和 `U` 的逆，然后得到 `A−1 =\
  \ U−1L−1`\n\n(12.26)\n\n目前，`R` 的 `solve()` 函数使用这种方法，该函数（根据用户的选择）要么求解 `Ax = b`，要么简单寻找\
  \ `A−1`。\n\n总之，行阶梯形应该为我们节省一些工作，因为我们不需要反复处理上行\n\n269\n\n12.7 求解线性方程组\n\n270\n\n矩阵运算\n\
  \n12.7.2 雅可比算法\n\n可以将 (12.24) 改写为：\n\n```\nx(k+1) = D−1(b − Ox(k))\n```\n\n(12.27)\n\
  \n其中 `D` 是由 `A` 的对角元素组成的矩阵（其逆就是这些元素倒数的对角矩阵），`O` 是通过将 `A` 的对角元素替换为 0 得到的矩阵，而 `x(k)`\
  \ 是我们在第 i 次迭代中的估计值。\n\n### 12.7.2.1 并行\n\n该算法的并行化很容易：只需为每个进程分配。注意，这意味着每个进程每次都必须获取新值。\n\
  \n### 12.7.3 示例：R/gputools 实现\n\n这是使用 `gputools` 的 R 代码：\n\n```R\njacobi <- function\
  \ (a, b, eps) {\n  n <- length (b)\n  d <- diag (a)\n  tmp <- diag (d)\n  o <- a\
  \ - diag (d)\n  di <- 1/d\n  x <- b\n  repeat {\n    oldx <- x\n    tmp <- gpuMatMult\
  \ (o, x)\n    tmp <- b - tmp\n    x <- di * tmp\n    if (sum( abs ( x−oldx )) <\
  \ n * eps) return ( x )\n  }\n}\n```\n\n271\n\n12.7 求解线性方程组\n\n12.7.4 QR 分解\n\n\
  著名的 QR 分解将我们的矩阵 `A` 分因子为\n\n```\nA = QR\n```\n\n其中 `Q` 和 `R` 分别是正交矩阵和上三角矩阵（见节 A.5）。由于其数值稳定性和串行速度，它是线性回归和特征值问题的首选方法；取决于计算的量，在某些问题中其时间复杂度为\
  \ O(n2)，而不是高斯消元法的 O(n3)。\n\n然而，它很难并行化。尽管如此，它是 `gputools` 函数 `gpuSolve()` 中使用的方法，该函数是基础\
  \ R 中 `solve()` 的对应项。\n\n272\n\n12.7.5 一些计时结果\n\n\n\n\n如前所述，R 的 `solve()` 函数使用 LU\
  \ 分解。我们在不同线程数下运行了计时实验，并使用 `OpenBLAS` 作为 BLAS 库。为了对比，我们分别使用 R 内置的 BLAS 以及 `gputools`\
  \ 中的 `gpuSolve()` 函数运行了 `solve()`。实验使用的机器与上文描述的相同，为超线程度为 2 的四核机器。\n\n以下是针对随机 4000\
  \ × 4000 矩阵的 result：\n\n| 平台 | 时间 |\n| :--- | :--- |\n| 内置 BLAS | 107.408 |\n| GPU\
  \ | 78.061 |\n| OpenBLAS, 1 线程 | 6.612 |\n| OpenBLAS, 2 线程 | 3.593 |\n| OpenBLAS,\
  \ 4 线程 | 2.087 |\n| OpenBLAS, 6 线程 | 2.493 |\n| OpenBLAS, 8 线程 | 2.993 |\n\n这非常令人惊讶！OpenBLAS\
  \ 不仅是这里的明显冠军，而且特别优于 GPU。虽然后者确实远优于纯 R，但远无法及 OpenBLAS 提供的性能——即使只用一个线程也是。GPU 对于极度并行的问题是无价的，但在其他问题中获得极佳性能提升是非常困难的。\n\
  \n同样有趣的是关于线程数的模式。在超过四个线程后，性能开始下降。这种模式在重复实验中得到了证实（此处未列出实验结果）。这并不太意外，因为该机器上只有四个物理核心，尽管每个核心都有有限的能力同时运行两个线程。为了进一步研究这一思路，我们在\
  \ 16 核机器上再次运行了这些实验，超线程度同样为 2。结果性能再次似乎在约 16 核心处达到饱和：12.8。\n\n## 稀疏矩阵\n\n如前所述，在线性代数的许多并行处理应用中，矩阵可能是巨大的，甚至拥有数百万行或列。然而，在许多情况下，矩阵的大部分由\
  \ 0。\n\n这在数据科学应用中非常常见。一个很好的例子是购物篮数据。\n\n假设我们有 `n` 笔交易，在每笔交易中，消费者从供应商出售的 `s` 物品中购买一个或多个物品。输入文件中的\
  \ `n` 条记录每条包含一个已购买物品列表，每个物品由 1 到 `s` 范围内的 ID 编码。\n\n对于各种统计/机器学习方法，我们可能希望将这些数据转换为\
  \ `n × s` 矩阵，其中填充 0 和 1。第 `i` 行第 `j` 列的 1 表示物品 `j` 属于交易 `i` 中购买的物品之一。\n\n如果每笔交易平均有\
  \ `v` 个物品，那么矩阵元素中比例为 `v/s` 的 1。这个数字通常很小，因此我们的矩阵确实是稀疏的。\n\n为了节省内存，可以以压缩形式存储稀疏矩阵，只存储非零元素。稀疏矩阵大致分为两类。在第一类中，所有矩阵在相同的已知位置都有\
  \ 0。例如，在三对角矩阵中，非零元素要么在对角线上，要么在对角线正下方或上方的副角线上，所有其他元素都保证为 0，如下：\n\n$$\n\\begin{pmatrix}\n\
  2 & 0 & 0 & 0 & 0 \\\\\n1 & 1 & 8 & 0 & 0 \\\\\n0 & 1 & 5 & 8 & 0 \\\\\n0 & 0 &\
  \ 0 & 8 & 8 \\\\\n0 & 0 & 0 & 3 & 5\n\\end{pmatrix}\n$$\n\n处理此类矩阵的代码随后可以根据这些知识访问非零元素。\n\
  \n在第二类中，我们代码处理的每个矩阵其非零元素通常位于不同的、“随机”位置，如购物篮示例所示。已经开发了许多用于存储无结构稀疏矩阵的方法，例如压缩稀疏行（CSR）格式，我们将在这个\
  \ C `struct` 中实现它，具体表示一个具有 `k` 个非零元素的 `m × n` 矩阵 `A`：\n\n```c\nstruct {\n    int\
  \ m,n; // A 的行数和列数\n    float *avals; // A 的非零值，行优先顺序，长度为 k\n    int *cols; // avals[i]\
  \ 位于 A 的列 cols[i]\n    int *rowplaces; // rowplaces[i] 是 A 中第 i 行第一个非零元素在 avals\
  \ 中的索引（但最后一个元素是 k）\n}\n```\n\n由于我们用 C 语言表达，我们的行索引和列索引将从 0 开始。对于 (12.29) 中的矩阵（假设我们不利用其三对角特性，而将其视为无结构矩阵）：\n\
  \n* `m,n`: 5,5\n* `avals`: 2,1,1,8,1,5,8,8,8,3,5\n* `cols`: 0,0,1,2,1,2,3,3,4,3,4\n\
  * `rowplaces`: 0,1,4,7,9,11\n\n例如，看 `rowplaces` 中的 4。它位于该数组的  2，所以它表示 `avals` 中的元素\
  \ 4——第三个 1——是 `A` 中第 2 行的第一个非零元素。观察矩阵，你会发现这是正确的。\n\n针对稀疏矩阵 `A` 的操作并行化可以通过常规方式进行，例如将\
  \ `A` 的行分成若干块。但请注意，可能会存在负载均衡问题，这通常是可以解决的。\n\n\n\n\n本质上是统计性的，其用性来自于 CA 估计器 `e^θ`\
  \ 在统计学上与全估计器 `ˆθ` 等价。\n\n很容易证明，如果数据是独立同分布的（i.i.d.）且全估计器是渐近多元正态分布的，那么 CA 方法再次产生一个渐近多元正态的估计器。最重要的是，分块估计器与原始非分块估计具有相同的渐近协方差矩阵。\n\
  \n最后这一点，结合步骤 (b) 是一个尴尬的并行（embarrassingly parallel）操作这一事实，意味着 CA 确实执行了“软件炼金术”——它将一个非\
  \ EP（易于并行）问题变成了一个统计学上等效的 EP 问题。\n\n### 13.1.2 O(·) 分析\n\n假设计算 `b^θ` 相关的计算量为 `O(nc)`，例如我们的互链示例（第\
  \ 2.9 节）中的 `O(n2)`。如果并行处理 `r` 个分块，CA 将 `O(nc)` 问题的时间复杂度降低为统计学等效问题的约 `O(nc/rc)`，而线性的\
  \ `r` 倍加速仅能将时间减少到 `O(nc/r`。\n\n如果 `c > 1`，则从 CA 的加速大于 `r` 的线性增长，这被称为超线性（superlinear）。这是通用并行处理领域的一个术语。当这种情况普遍发生时，其影响范围通常很小，是由于缓存效应等原因引起的。但在我们的统计语境下，超线性将是常态，且往往具有非常大的影响。\n\
  \n顺便提一下，类似的分析显示 即使在串行情况下也能产生加速，此时分块被逐个处理。这里的时间将是 `r O(nc) = O(nc)`。因此，对于 `c > 1`，即使在单处理器设置下，CA\
  \ 可能也比全 `rc/rc−1` 估计器更快。\n\n同样需要注意，即使在 EP 设置下 CA 也有帮助。假设我们的函数 `g()` 是现有软件包的一部分。即使底层算法是\
  \ EP，为了并行化而对其进行重编码可能是一项复杂的工程。此时，CA 为我们提供了一种快速、简单的方法来利用估计器的 EP 特性。\n\n这将在第 13.1.4.3\
  \ 节中说明。\n\n但对于某些应用，我们的加速可能更为有限。正如第 3.4.1 节讨论的，线性（或非线性但仍参数化的）回归模型面临着挑战。我们将在本节后面看到一个示例。\n\
  \n### 13.1.3 代码\n\n编写 CA 是 (13.1) 和 (13.2) 的直接实现。它作为我的 CRAN 包 `partools` 中的 `ca()`\
  \ 函数提供服务。\n\n### 13.1.4 定时实验\n\n让我们来看几个示例中的加速情况。\n\n#### 13.1.4.1 示例：分位数回归\n\n在这里，我在模拟实验使用了来自\
  \ CRAN 的 `quantreg` 包。有 `m` 个预测变量，独立同分布的 `U(0,1)`，响应变量由以下公式生成：\n`Y = X1 + ... +\
  \ Xm + 0.2 U`\n其中 `U` 同样具有 `U(0,1)` 分布。样本量 `n` 为 25000 和 50000，`m = 75`。在本书前言描述的机器上尝试了多达\
  \ 32 个线程。\n\n结果如图 13.1 所示，非常有启发性。获得了强加速，特别是在 `n = 50000` 的情况下，增益是超线性的。一旦超过 16 个线程，似乎没有性能提升，可能还会下降。回想这台机器有\
  \ 16 个核心，尽管超线程级为 2，因此在 16 线程后有一定的性能提升潜力，但在本应用中并未观察到这一点。\n\n#### 13.1.4.2 示例：逻辑模型\n\
  \n这里的数据集是来自加利福尼亚大学欧文分机器学习库的著名的森林覆盖数据（forestcover）。这里有七种地面覆盖类型，协变量包括午后山影（Hillside\
  \ Shade at Noon）。目标是根据协变量的遥感数据预测地面覆盖类型。在此分析的数据子集中有 500000 个观测值。定时实验涉及根据前 10 个协变量预测\
  \ Type 1。由于原始数据是有序的，因此应用了随机排列。\n\n```\nforest <- read.csv(\"cov.data\") # dummy\n\
  Type1 <- cbind(as.integer(forest[, 5]) = 1), forest)\nforest <- as.matrix(forest)\n\
  n <- nrow(forest)\nType1 <- sample(forest, n, replace=F)\nsystem.time(g1 <- glm(Type1,\
  \ forest[, 10], family=binomial))\n```\n\n现在将这 41.977 秒的时间与在 16 核机器上使用 2、4、8、12\
  \ 和 16 个线程通过 CA 获得的时间进行比较，如图 13.2 所示。加速开始是线性的，然后变得不那么剧烈但仍然非常好，特别是考虑到前面提到的因素。\n\n\
  但准确性如何？理论告诉我们 CA 估计器在统计上与全估计器等价，但这是基于渐近性的（尽管应该注意即使是全估计器也是基于渐近性的，因为 `glm()` 本身如此）。让我们看看在这里效果如何。表\
  \ 13.1 显示了不同核心数下第一个预测变量的估计系数值（1 个核心意味着全估计器情况）：这种一致性非常好，即使对于最小的分块大小也是如此。\n\n| cores\
  \ | β1 |\n| :--- | :--- |\n| 1 | 0.00624 |\n| 2 | 0.00624 |\n| 4 | 0.00624 |\n|\
  \ 8 | 0.00626 |\n| 12 | 0.00627 |\n| 16 | 0.00627 |\n\n#### 13.1.4.3 示例：估计风险函数\n\
  \n对于连续分布 `f` 和累积分布函数 `F`，风险函数定义为\n`h(t) = 1 − F(t)`\n\nCRAN 上的 `muhaz` 包寻找 `h` 的非参数估计，适用于删失或未删失数据。它提供了多种方法，这里使用的是基于核的密度估计，并带有局部带宽确定。细节超出了本书的范围，但关键点在于：(a)\
  \ 有大量的计算要做，(b) 这些计算是尴尬并行的（在我们这里的未删失情况）。\n\n起初，人们可能会推测由于这个过程是尴尬并行的，我们不需要 CA。毕竟，后者的方法旨在将非\
  \ EP 问题转换为 EP 问题——所以为什么要在一个已经是 EP 的问题上使用它？答案是便利性。为了并行计算而重写 `muhaz` 包可能非常不方便。相比之下，如果我们把\
  \ CA 应用于 `muhaz`，就可以在不重编码的情况下获得 EP 加速。\n\n那么，让我们看看效果如何。使用的数据集是另一个著名的，航班延迟数据，位于 http://stat-computing.org/dataexpo/2009/the-data.html。风险函数是针对\
  \ `DepDelay`（出发延迟）变量估计的。首先从数据中删除了 NA 值。\n\n这是全估计器的结果：\n\n```\nx <- read.csv(\"2008.500k.csv\"\
  , header=T)\ndepDelay <- x$DepDelay\ndepDelay <- depDelay[!is.na(depDelay)]\nlibrary(muhaz)\n\
  system.time(mhout <- muhaz(depDelay))\nuser 95.365 system 0.220 elapsed 95.612\n\
  ```\n\n然后尝试了 CA，使用 8 个节点：\n\n```\nlibrary(parallel)\ncls <- makeCluster(8)\nclusterCall(cls,\
  \ function() library(muhaz))\n# ...\nsource(\"~/ChunkAveraging.R\")\nsystem.time(\n\
  mhoutca <- ca(cls, depDelay,\n```\n\n\n\n\n```\no v f=function ( zchunk ) muhaz\
  \ ( zchunk ) $haz . e s t [ 2 0 ] ,\n\n+\n\ne s t f=function ( e s t o u t c h u\
  \ n k ) e s t o u t c h u n k )\n\n+ )\n\nu s e r system e l a p s e d 0 . 2 4 4\
  \ 0 . 0 2 0 1 4 . 4 1 8\n```\n结果非常好，速度提升了近七倍。\n\n# 13.1.5 非 i.i.d. 设置\n\n如所述，CA\
  \ 的用性源于 `eth` 和 `bθ` 的统计等价性。这又源于我们数据的 i.i.d.（独立同分布）性质。其他设置如何呢？\n\ni.i.d. 假设是统计学的核心。我们很少看到关于该假设对日常数据分析影响的讨论，但对于\
  \ CA 来说，有一个重要的理由需要提到它：对于许多数据集，物理存储已经以某种方式进行了排序。\n\n例如，假设在某个数据集中，其中一个变量是性别，例如由 5000\
  \ 名男性和 5000 名女性组成。数据文件的排列可能是：前 5000 条记录由男性组成，后 5000 条记录包含女性的数据。假设 `r = 2`。那么第一个块的分布与第二个块不同，即分块不是同分布的，CA\
  \ 理论不再成立。\n\n因此，如果分析人员知道或怀疑数据的排列是有某种方式排序的，他/她应该先对 `n` 条记录应用随机置换。如果矩阵 `x` 包含原始数据，则可以运行例如：\n\
  \n```\nx <− x [ sample ( 1 : n , n , replace=FALSE ) , ]\n```\n\n# 13.2 小自助法袋 (Bag\
  \ of Little Bootstraps)\n\n这种有趣的方法——自助法袋（Bag of Little Bootstraps, BLB），描述在 *A Scalable\
  \ Bootstrap for Massive Data* 中，A. Kleiner, A. Talwalkar, P. Sarkar, M.I. Jordan,\
  \ Journal of the Royal Statistical Society, Series B, 2013。据我所知，目前没有公开的代码实现 BLB，这里将仅介绍该程序的概述。（假设读者对自助方法有一定的了解。）在\
  \ BLB 中，我们像 CA 方法一样也观察数据块，但块是随机选择的。我们选择 `s` 个大小为 `b` 的块。对于每个块，我们应用标准的自助法，进行 `r`\
  \ 次大小为 `b` 的放回采样。然后我们对所有块取平均值。与 CA 一样，作者证明了对于 i.i.d. 数据，BLB 产生的估计量渐近等价于 `ˆθ`。\n\n\
  BLB 有三个调优参数：`b`、`s` 和 `r`。上面的论文包含了关于如何选择这些参数值的建议。\n\n# 13.3 变量子集\n\n考虑回归或分类设置。与其对观测值子集（即数据矩阵的行），我们可能考虑子集预测变量（即矩阵的列）。这是所谓的“提升”（boosting）的一种形式。\n\
  \n例如，假设我们有 50 个预测变量，并希望通过 R 的 `glm()` 函数使用逻辑回归模型对二分类结果 `Y` 进行预测。与其使用一次使用所有 50 个预测器的\
  \ `glm()` 调用，然后将结果应用于预测未来可能遇到的任何新数据的 `Y` 值，我们可能会随机选择 `k` 对预测变量，并对每对预测变量应用 `glm()`。然后，对于每个未来的数据点，我们将为该点生成\
  \ `k` 个预测值，并简单地使用多数规则来预测新的 `Y` 值。例如，如果我们的 `k` 个预测中大多数猜测新的 `Y` 为 1，那么这就是我们的整体猜测。\n\
  \n与其只使用预测变量对，我们可能会使用三元组，或者通常来说，为每个拟合的小模型使用 `m` 个预测变量。\n\n这种方法通常提出的动机是理查德·贝尔曼（Richard\
  \ Bellman）的维度灾咒概念，该概念断言，在高维（即预测变量非常多）的情况下，预测会变得异常困难。我们试图通过结合许多低维空间中的预测来规避这一点。\n\n\
  然而，在我们的这里语境下，可以将上述提升方法视为并行化操作的一种方式。考虑线性回归分析，例如有 `p` 个预测变量。正如第 3.4.1 节所述，对于固定样本量，所需的工作量是\
  \ `O(p3)` 或 `O(p2)`，取决于所使用的数值方法。这种时间复杂度随 `p` 的非线性增长，因此提升可能会为我们节省计算时间。尤其如此，因为我们是并行拟合这\
  \ `k` 个模型，这是一个极其并行的设置。\n\n注意，与 CA 和 BLB 方法不同，提升并不产生统计等价的估计量。但它确实为我们节省了时间（根据支持者的说法，可能会减少过拟合的概率）。\n\
  \n这种方法有两个调优参数：`k` 和 `m`。\n\n# 附录 A 矩阵代数回顾\n\n本书假设读者上过线性代数课程（或自学过，这总是更好的方法）。本附录旨在作为基础矩阵代数的回顾，或者为缺乏这一背景的人提供快速处理。\n\
  \n## A.1 术语和符号\n\n矩阵是数字的矩形数组。向量是只有一行（行向量）或一列（列向量）的矩阵。\n\n“矩阵的 `(i,j)` 元素”指的是第 `i`\
  \ 行第 `j` 列。请注意以下：\n- 大写字母（如 `A` 和 `X`）表示矩阵和向量。\n- 小写字母带下标（如 `ai`）表示它们的元素。\n\n如果\
  \ `A` 是方阵，即具有相同行数的矩阵，那么它的对角线元素为 `aii`，`i=1,...,n`。当 `i > j` 时 `aij = 0` 的方阵称为上三角矩阵。一个\
  \ `n` 维向量 `X` 的范数（或长度）是 `v`。\n\n## A.1.1 矩阵加法和乘法\n\n- 对于具有相同行数的两个矩阵，加法是逐元素定义的，例如：\n\
  ```\n[ 0 7 ] + [ 0 8 ] = [ 0 15 ]\n[ 7 8 ]   [ 8 8 ]\n```\n- 矩阵乘以标量也是逐元素定义的，例如：\n\
  ```\n2 * [ 0 7 ] = [ 0 14 ]\n    [ 7 8 ]   [14 16 ]\n```\n- 等长度向量的内积或点积定义为 `xky`。\n\
  - 矩阵 `A` 和 `B` 的乘积定义如果 `B` 的行数等于 `A` 的列数。在这种情况下，乘积 `C` 的 `(i,j)` 元素定义为\n```\ncij\
  \ = aikbkj\n```\n例如，\n```\n[ 0 6 ] * [ 19 66 ] = [ 0 16 ]\n[ 7 8 ]   [ 8 8 ]   \
  \  [ 24 80 ]\n```\n将 `cij` 视为 `A` 的第 `i` 行与 `B` 的第 `j` 列的内积是有帮助的，例如此处加粗所示：\n```\n\
  [ 0 6 ] * [ 19 66 ] = [ 0 16 ]\n[ 7 8 ]   [ 8 8 ]     [ 24 80 ]\n```\n- 乘法满足结合律和分配律，但通常不满足交换律：\n\
  ```\nA(BC) = (AB)C\nA(B + C) = AB + AC\nAB ≠ BA\n```\n\n## A.1.2 矩阵转置\n\n- 矩阵 `A`\
  \ 的转置记为 `A0` 或 `AT`，通过交换 `A` 的行和列得到，例如：\n```\n[ 0 7 70 ]\n[ 7 8 8 ]\n[ 8 8 16 ]\n\
  ```\n- 如果 `A + B` 有定义，则：\n```\n(A + B)0 = A0 + B0\n```\n- 如果 `A` 和 `B` 兼容，则：\n```\n\
  (AB)0 = B0A0\n```\n\n\n\n\n\n令 $A-(i,j)$ 表示通过删除矩阵 $A$ 的第 $i$ 行和第 $j$ 列得到的子矩阵。那么行列式可以跨\
  \ $A$ 的第 $k$ 行进行递归计算为：\n\n```latex\n\\det(A) = \\sum_{m=1}^{n} (-1)^{k+m} \\det(A-(k,m))\n\
  ```\n(A.15)\n\n其中\n\n```latex\n\\det(A) = sv - tu\n```\n(A.16)\n\n通常情况下，行列式主要具有理论意义，但它们往往有助于澄清人们对概念的理解。\n\
  \n### A.5 矩阵逆\n\n* 阶为 $n$ 的单位矩阵 $I$ 的所有对角线元素均为 $1$，而所有非对角线元素均为 $0$。它具有性质：只要这些乘积有定义，$AI\
  \ = A$ 且 $IA = A$。\n* 如果 $A$ 是方矩阵且 $AB = I$，则称 $B$ 为 $A$ 的逆矩阵，记作 $A^{-1}$。此时 $BA\
  \ = I$ 也成立。\n\n### A.6 特征值与特征向量\n\n* $A^{-1}$ 存在当且仅当它的行（或列）线性独立。\n* $A^{-1}$ 存在当且仅当\
  \ $\\det(A) \\neq 0$。\n* 如果 $A$ 和 $B$ 是方阵、可比且可逆的，那么 $AB$ 也是可逆的，且\n\n\n\n```latex\n\
  (AB)^{-1} = B^{-1}A^{-1}\n```\n(A.17)\n\n矩阵 $U$ 被称为正交矩阵，如果其每行的范数均为 $1$ 且彼此正交，即它们的内积为\
  \ $0$。因此，$U$ 具有性质 $U^TU = I$，即 $U^{-1} = U$。\n\n三角矩阵的逆可以通过所谓的“回代法”容易地获得。\n\n通常人们不会直接计算矩阵的逆。一种常见的替代方案是\
  \ QR 分解：对于矩阵 $A$，计算矩阵 $Q$ 和 $R$ 使得 $A = QR$，其中 $Q$ 是正交矩阵，$R$ 是上三角矩阵。\n\n如果 $A$ 是方阵且可逆的，则\
  \ $A^{-1}$ 很容易找到：$A^{-1} = (QR)^{-1} = R^{-1}Q⁰$\n\n```\n(A.18)\n```\n\n同样，在某些情况下，$A$\
  \ 是更复杂系统的一部分，逆并没有被显式地计算。\n\n### A.6 特征值与特征向量\n\n令 $A$ 为方阵。\n\n* 满足 $AX = \\lambda\
  \ X$ 的标量 $\\lambda$ 和非零向量 $X$\n\n```\n(A.19)\n```\n\n分别称为 $A$ 的特征值和特征向量。\n\n对于非方矩阵，这里的讨论将推广到奇异值分解的主题。\n\
  \n* 如果 $A$ 是对称实矩阵，那么它是可对角化的，即存在一个正交矩阵 $U$ 使得\n\n```latex\nU^T A U = D\n```\n(A.20)\n\
  \n对于对角矩阵 $D$。$D$ 的元素是 $A$ 的特征值，$U$ 的列是 $A$ 的特征向量。\n\n(A.20) 的另一个充分条件是 $A$ 的特征值互不相同。在这种情况下，$U$\
  \ 不一定是正交的。顺便提一下，如果我们将其元素视为连续随机变量，那么后一种充分条件表明，“绝大多数”方阵都是可对角化的。在这种情况下，出现重复特征值的概率为\
  \ $0$。\n\n### A.7 R 中的矩阵代数\n\n`R` 编程语言拥有用于矩阵代数的广泛功能，在此介绍。注意 `R` 使用的是列主序（column-major\
