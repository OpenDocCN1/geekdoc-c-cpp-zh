  —Michael Kane，耶鲁大学\n\n**《数据科学并行计算：带有 R、C++ 和 CUDA 示例》**是首专门专注于数据科学中并行数据结构、算法、软件工具和应用的并行计算书籍之一。它不仅包含了经典的“n\
  \ 个观测值，p 个变量”矩阵格式的示例，还包含了时间序列、网络图模型以及数据科学中常见的许多其他结构。该书还讨论了跨越多种类型硬件并可以使用多种类型编程语言的软件软件包。\n\
  \n**特性**\n- 关注数据科学中的应用，包括统计学、数据挖掘和机器学习\n- 讨论数据科学中常见的结构，如网络数据模型\n- 贯穿始终强调原则，例如避免降低并行程序速度的因素\n\
  - 涵盖了主要的计算平台类型：多核、集群和图形处理器 (GPU)\n- 解释了 Thrust 软件包如何简化多核机器和 GPU 的编程，并使同一代码可以在任一平台上使用\n\
