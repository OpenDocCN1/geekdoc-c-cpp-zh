    extern int pageCount;


    the linker will fail.


    # register


    The register keyword is a hint to the compiler that the variable it precedes is
    heavily referenced:


    ```

    register int count;

    ```


    As a result, the compiler may choose to store the variable in a register (for
    faster access) rather than in RAM. However, the compiler is not obligated to honor
    the hint.


    # const


    The const keyword tells the compiler that a variable should be considered as constant.
    The compiler flags any attempt to change the variable as an error:


    ```

    const int maxAttempts = 100;

    maxAttempts = 200; // This will cause a compiler error.

    ```


    When const is used with pointer variables, the order is important. The declaration
    should be read left to right. The following example declares ptr is a constant
    pointer to an int:


    ```

    int a = 10;

    int b = 15;

    ```


    ```

    int *const ptr = &a;

    ```


    ```

    *ptr = 20; // OK. a is now 20.

    ```


    ```

    ptr = &b; // Error, ptr is a constant.

    ```


    ptr cannot be modified to point at a different variable, but it can be used to
    modify the variable it points to.


    Putting the const in front of the declaration has a different meaning, ptr is
    then a pointer to a constant int:


    ```

    int a = 10;

    int b = 15;

    ```


    ```

    const int *ptr = &a;

    ```


    ```

    *ptr = 20; // Error, ptr''s contents are constant.

    ```'
