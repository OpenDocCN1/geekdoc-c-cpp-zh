  md: '# 15


    # Garbage Collection


    A typical running Objective–C program continually allocates new objects. Most
    of these objects are needed only temporarily; there is no need for them to remain
    valid until the program terminates. If the program doesn''t return the bytes used
    for the unneeded objects, the program’s memory footprint continues to grow and
    its performance suffers. The previous chapter covered referenced memory, a manual
    system for managing memory. This chapter covers garbage collection, an automatic
    system for managing memory, which was added to Objective-C in Mac OS X Leopard
    (v10.5). Garbage collection is not available on iOS.


    When you use garbage collection for your memory management, a separate thread,
    called the garbage collector, runs periodically. The garbage collector examines
    your program’s memory, determines which objects are in use, and deallocates any
    objects that are not being used.


    This chapter explains the theory of garbage collection, how the Objective-C garbage
    collector works, how to use garbage collection in an Objective-C program, and
    covers some of the problems with the current implementation of Objective-C’s garbage
    collector.


    # Garbage Collection: The Theory


    The task of a garbage collector is to find objects that are no longer being used
    by running program and deallocate them—return the bytes to the heap so the bytes
    can be reused.


    Garbage collection is simple in principle. Any object that is known to be in use
    or can be reached by following a chain of references (pointers) from an object
    to be in use is considered to be “live.” All other objects are considered to be
    “garbage” and the memory used by the garbage objects is returned to the heap.


    The garbage collector starts with an initial set of objects called the root set.
    The objects in the root set are objects known to be in use because they are held
    in variables on the stack or external variables. The collector then does a knee-bone-connected-to-thick-bone
    kind of analysis. It marks the root set as live, then marks any objects that the
    root set references as live. It continues following references and marking it
    has'
