    When used alone, unsigned is taken to mean unsigned int:

    unsigned a; // a is an unsigned int


    An unsigned variable''s bit pattern is always interpreted as a positive number.
    If you assign a negative value to an unsigned variable, the result is a very large
    positive number. This is almost a mistake.


    # Floating-Point Types


    C''s floating-point types are float, double, and long double. The sizes of the
    floating-point types are the same in 32-bit and 64-bit executables:


    ```

    float aflat; // floats are 4 bytes

    double atof; // doubles are 8 bytes

    long doubleDouble; // long doubles are 16 bytes

    ```


    Floating-point values are always signed.


    # Truth Values


    Ordinary expressions are commonly used for truth values. Expressions that evaluate
    to zero are false, and expressions that evaluate to non-zero are considered true
    (see the following sidebar).


    > Bool, bool, and BOOL


    Early versions of C did not have a Boolean type. Ordinary expressions were (and
    still are) used for Boolean values (truth values). As noted in the text, an expression
    that evaluates to zero is false and one that evaluates to non-zero is considered
    true. A majority of code is still written this way.


    C99, the standard for C, introduced a _Bool type. _Bool is an integer type with
    only two values, 0 and 1. Assigning any non-zero value to a _Bool results in 1:


    ```

    _Bool b = 35; // b is now 1

    ```


    If you include the file stdool.h in your source code files


    ```

    #include <stdbool.h>

    bool b = true;

    ```'
