    # The Trouble with Function Pointers


    There is one large inconvenience when using function pointers as callbacks or
    in any part of the program where you are trying to hand off code for execution
    by another part or thread. Any context that the function requires must be packed
    up and submitted as a variable or variables.


    Most designs using callbacks follow the pattern shown in Listing 16.1. The function
    or method that passes the callback function binds a blind pointer as an additional
    argument and then passes that pointer back to the callback function, as shown
    in Figure 16.2. This is only a minor inconvenience when the context is a single
    variable in the preceding example. However, if your function requires a more complicated
    context, you must create and load a custom structure to hold the context and pass
    the pointer to that structure as the context variable. As an alternative, you
    could package the context variables in an `NSDictionary` and then pass the dictionary
    as the context. Either way is awkward if the context involves many variables.'
