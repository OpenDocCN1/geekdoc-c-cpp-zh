  md: '# An Introduction to Objective-C


    This section shows, in overview fashion, how Objective-C implements the concepts
    of object-oriented programming.The core part of Objective-C is covered in detail
    in Chapter 5, “Messaging; Chapter 6, “Classes and Objects,” and Chapter 7, “The
    Class Object,”


    # Defining a Class


    An Objective-C class definition has two parts: the *interface section* and the
    implementation section. The interface section declares the class’s instance variables
    and its methods. The implementation section contains the code that implements
    the class’s methods. The interface section is usually placed in a header file
    that it is, by convention, named after the class. The implementation section goes
    in a file with a .m file extension, also named after the class.The .m file extension
    tells the file that contains Objective-C source code.


    # Interface Section


    The interface section of a class definition looks like this:


    ```

