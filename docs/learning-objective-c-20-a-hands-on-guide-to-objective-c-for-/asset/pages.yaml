  md: '# Objective-C Additions


    # Note


    Although the current version of Objective-C is based on the C99 standard, Objective-C
    was originally developed as an extension to an earlier version of C that lacked
    a Boolean type. Most of the Objective-C community uses the Objective-C BOOL despite
    the availability of the C99 bool type.


    # SEL


    SEL is a type that holds a representation of an Objective-C method name. Method
    names are sometimes called selectors the runtime uses them to select the block
    of code to execute in response to a message (see Chapter 5,"Messaging”).

    nA SEL is used for this determination, instead of the actual name of the method,
    for performance reasons. Strings are awkward to manipulate; comparing two strings
    for efficiency is a slow, multiprocessing process. Comparing two SELs is much
    faster.


    You can compile the directive @selector() to convert a method name into its SEL:

    SEL aSelector=@selector(methodName);


    # IMP


    IMP is a typedef for "pointer" to a function taking the arguments id, SEL, and
    possibly other arguments, and returning id.\nThe compiler ultimately turns an
    Objective-C method into a regular function. When you execute a method, the runtime
    uses the selector to find the actual function that implements the method and then
    executes it. But occasionally, for purposes of efficiency or some behind-the-scenes
    trickness, you may want to call the function that implements a method de-virectly.You
    can do this by getting a pointer to the function and using that to call the function.
    The methods and runtime functions you can use to get such a pointer returned it
    as IMP:

    IMP methodImplementationForSelector=@selector(methodName));


    # Note


    IMP is used as a slang term for method implementation in documentation and books,
    as in "useMethodForSelector: to get the IMP."


    # Class


    Class is a type that holds a reference to an Objective-C class. In Objective-C,
    classes are themselves objects. Because they are, classes must be instances of
    some class. That class, which is the class of classes, is named (drum roll, please)
    Class. Like id and IMP, and unlike any other class, Class is inherently a pointer
    type and doesn''t require an asterisk (*); for example:

    Class *myClass;// WRONG I


    Class objects are the topic of Chapter 7.'
