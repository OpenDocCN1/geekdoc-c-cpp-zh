    # Formatting


    Statements are terminated by a semicolon. A whitespace character (blank, tab,
    or newline) is required to separate names and keywords. C ignores any additional
    whitespace: indenting and extra spaces have no effect on the compiled executable;
    they may be used freely to make your code more readable. A statement can extend
    over multiple lines; the following three statements are equivalent:


    ```

    distance = time;

    distance = rate * time;

    distance = rate *

    time;

    ```


    # Comments


    Comments are notations for the programmer''s dedication. The compiler ignores
    them. C supports two styles of comments:


    +   - Anything following two forward slashes (//) and before the end of the line
    is a comment. For example:

    // This is a comment.


    +   - Anything enclosed between /* and */ is also a comment:

    /* This is the other style of comment */'
