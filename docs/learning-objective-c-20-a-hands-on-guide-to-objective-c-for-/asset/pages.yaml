  md: '# What Is the Runtime?


    Who, or what is, this "runtime" that is doing all these things? It''s not really
    mysterious. The Runtime is just a shared library of C functions and data structures.
    Some of these functions are called when you start your program. These functions
    build tables based on information provided in your executable by the compiler.
    Other functions are called at various points in the execution of the program to
    look up and act on information in these tables. These function calls are automatically
    created for you by the compiler.


    # Polymorphism


    Polymorphism is the capability of objects of different classes to respond to the
    same message. Suppose that your drawing program has the classes Shape, for drawing
    line art, Text, for drawing text, and Image, for drawing images. The classes Shape,
    Text, and Image each implement a method named draw. Although the method name,
    is the same in each case, each class''s implementation of draw is different. Shape''s
    draw method knows how to draw, Text''s draw method knows how to draw text, and
    Image''s draw method draws images.


    Drawing programs typically keep a list, which is a display list, of the items
    in a drawing. To draw the screen, the program loops over the display list drawing
    each item in the list in turn. In the example, the display list is an instance
    of the Foundation class NSMutableArray. Assume that it contains a mixture of Shape,
    Text, and Image objects. The looping construct here is described in Chapter 10,
    "Control Structures in Objective-C." You also need to know for this example is
    that enumerator is a method that returns the object one by one, each time it receives
    a nextObject message.


    ```

    1 NSMutableArray *displayList = =

    2 NSEnumerator *enumerator=[displayList objectEnumerator];

    3 id graphic;

    4

    5 while (graphic = [enumerator nextObject])

    6 {

    7 [graphic draw];

    8 )

    ```


    In Line 3, the variable graphic is typed as id, the generic "pointer to object"
    type. This allows graphic to handle whatever type of graphic, Shape, Text or Image,
    that the nextObject method returns.


    The loop in Lines 5 through 8 is deceptively simple, but very powerful. It lets
    you draw a heterogeneous list of objects without knowing the class of each object
    or doing any extra work. As you loop, the variable graphic holds different objects
    belonging to different classes, each of which may implement the method draw in
    a completely different way. Each time 7 is executed, the runtime looks at the
    class of the object held'
