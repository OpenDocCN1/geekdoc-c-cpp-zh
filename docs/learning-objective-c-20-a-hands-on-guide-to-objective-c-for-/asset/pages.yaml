  md: '# Chapter 8 Frameworks


    OS development are wrapped as frameworks. The name of a framework bundle always
    has the form frameworkName.framework.


    A framework can wrap a dynamic library written in any language, but the frameworks
    that you are most likely to encounter all either Objective-C or plain C interfaces.


    > Note

    Frameworks are very common in Mac OS and iOS programming, but you can also link
    to any regular static or dynamic libraries that your program requires.


    # Using a Framework


    To use an Objective-C or C framework, you have to import the header files for
    any framework-defined classes or functions that you are going to use in your code.
    Most frameworks have a group header that imports all the individual header files
    for the framework. Some frameworks are umbrella frameworks. Umbrella frameworks
    are frameworks that contain two or more frameworks.


    The following line imports all the relevant header files for the classes in the
    Foundation framework:


    ```

    #import <Foundation/Foundation.h>

    ```


    A group import does not cause bloat; it just makes all the classes in the framework
    available. Importing the proper header files makes the compiler happy. You also
    have to keep the linker happy by telling it to add the framework to its list of
    places for bits of executable. Xcode automatically adds the required frameworks
    (based on the project type) to your project when you create it. To add frameworks
    to your project, go to the Groups and Files section of your project window and
    right-click (control-click) on the External Frameworks and Libraries folder. Then
    choose Add > Existing Frameworks from the popup menu as shown in 8.1.


    If you are compiling your program from the command line, using the gcc compiler,
    you have to pass the name of any frameworks you are using. You do this with a
    -framework flag followed by the name of the framework minus the .framework extension.
    For example:


    ```

    gcc myProgram.m -framework Foundation

    ```


    If you are using multiple frameworks, you have to list all them on the gcc command
    line, each with its own -framework flag.


    ```

    gcc myProgram.m -framework Foundation -framework CoreFoundation

    ```'
