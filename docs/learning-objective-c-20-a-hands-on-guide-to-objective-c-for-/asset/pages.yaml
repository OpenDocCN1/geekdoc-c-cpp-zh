    colon and the name of its superclass. Line 3 tells the compiler that this section
    defines the class Greeter, which is a subclass of NSObject. The NSObject provides
    some basic behaviors that are required for all Objective-C classes. All the classes
    in this book are subclasses of NSObject or some other class that is directly or
    indirectly a subclass of NSObject. Classes and inheritance are considered in Chapter
    6, "Classes and Objects."

