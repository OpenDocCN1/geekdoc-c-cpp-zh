    # Initializing Classes


    The Objective-C runtime gives you a chance to initialize a class before it is
    used. The first time a class object is sent a message (typically an alloc message
    creating the first instance of that class), the runtime intercedes and sends an
    initialize message to the class object. The initialize message is sent before
    the original message is delivered.


    > Note

    Using to initialize a class is different than using an init... method to initialize
    an instance of a class.


    The default initialize method inherited from NSObject does nothing. Most classes
    don''t require any initialization, but there are a few situations where you might
    want to initialize:


    +   - The Foundation framework provides a singleton class, NSUserDefaults, that
    manages a program''s interactions with Mac OS X''s defaults. (The defaults system
    manages user preferences and other values on a per user basis.) You can use the
    shared NSUserDefaults instance inside an initialize method to set default values
    or retrieve the current values for any items by your class.

    - If your class is using variables to mimic class variables, you can do any work
    required to initialize those variables in initialize.


    As an example, you have a game that simulates a set of traders working from a
    common money pool. The Trader class itself manages the money pool using an external
    variable. You can use the NSUserDefaults system to store the value of the money
    pool between game sessions. When the game is restarted, you use the Trader''s
    initialize method to restore the value of currentMoneyPool from the defaults:


    ```

    static NSInteger currentMoneyPool;


    @implementation Trader

    ```'
