  md: '# 13


    # Protocols


    A protocol is a defined set of methods that a class can choose to implement. Protocols
    are useful when an object needs to talk to one or more other objects but doesn''t
    know (or particularly care) the class of those other objects.Objective-C are the
    equivalent of Java interfaces. In fact, the designers of Java borrowed the concept
    from Objective-C. Protocols are used throughout the Cocoa framework. Objective-C
    has both formal and informal protocols. A formal protocol declares a set of required
    methods and perhaps some optional methods. A class can adopt the protocol by implementing
    all the protocol. When a class declares that it adopts a formal protocol, the
    compiler checks to that the class implements all the protocol''s required methods.
    An informal protocol is merely a list of method declarations in a category header
    that a class chooses to implement. Most of informal protocols in the Cocoa frameworks
    are replaced by formal protocols.


    In this chapter, you will learn how to use a formal protocol, how to declare a
    protocol and how to code a class that adopts a formal protocol. The chapter then
    goes through a complete example, a TablePrinter class. A TablePrinter can print
    data from another object in the form of a table. A TablePrinter does not need
    to know the class of the object that is supplying the data. The only thing TablePrinter
    needs to know is that the object supplying its data belongs to a class that adopts
    the TablePrinterDataSource protocol.


    # Protocols


    As an example, suppose you want to draw a drawing (mechanical drawing) system.
    You could ask your users to draw everything from scratch with lines and arcs,
    but it would be much more convenient if you could supply them with libraries of
    common components, like nuts and bolts, that know how to draw themselves. Let''s
    call these components "drawable items."


    The view object that is drawing the doesn''t really care about what class a drawable
    item belongs to. It only cares that an object is a drawable item can respond to
    a specified set of messages. A drawable item should be able to return a bounding'
