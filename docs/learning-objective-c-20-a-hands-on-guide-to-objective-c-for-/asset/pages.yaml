  md: '# An Introduction to Object-Oriented Programming


    The earliest high-level computer languages, such as Fortran, COBOL, and C, are
    procedural. The natural organization of a program written in a procedural language
    is a series of sequential tasks to execute. Procedural programming is eminently
    suited for some types of problems—for example, user interface programming—for
    procedural programming is not a good fit. In many areas of computing today, the
    dominant programming paradigm is a different one, called object-oriented programming.
    Objective-C is an example of an object-oriented language. It adds constructs and
    syntax to support object-oriented programming to the procedural C.


    This chapter begins with an introduction that describes the fundamentals of object-oriented
    programming. The following section illustrates how these concepts are implemented
    in Objective-C. The final section of the chapter lists the additions Objective-C
    makes to the C language.


    # Object-Oriented Programming


    Object-oriented programming is a style of programming that organizes programs
    into collections of objects that interact with each other. An object is a group
    of related variables that models something in your problem space, and some procedures,
    called methods, that represent the actions the object knows how to perform. Objects
    communicate by sending and receiving messages. A message to an object is a request
    to the object, asking it to execute one of its methods.


    As an example, a drawing program might have a Shape to represent free-form shapes
    (as those shown in Figure 3.1) that a user can draw on the screen. A Shape object
    would have variables to store the properties that define it, its color, and its
    position in the drawing. It would have methods to store and retrieve its quantities
    and a method to draw itself on the screen. To draw the Shape on the screen, you
    would send the Shape draw message. In response, the Shape would execute its draw
    method (which contains the code to draw the actual drawing).'
