    ```

    @implementation SheetControllerDelegate

    -(void)sheetDidEnd:(Window*)sheet

    returnCode:(int)returnCode

    contextInfo:(void *)targetContext

    {

    // Do something with contextObject

    }

    @end

    ```


    When the user selects the menu item that corresponds to the sheet, the showSheet:
    method is called. showSheet: calls the NSApplication beginSheet:modalForWindow:didEndSelector:contextInfo;
    which displays the sheet and returns.


    When the user dismisses, openPanelDidEnd:returnCode:contextInfo is called with
    a pointer to the original object as the value of the contextInfo argument. 15.5
    shows the timing of this sequence.


    The problem is that the App Kit stores the object as a void*. The collector treats
    void as a weak reference. If the collector runs between the time showSheet: returns
    and the time openPanelDidEnd:returnCode:contextInfo is called, the context object
    will probably be marked as garbage and collected. This would leave openPanelDidEnd:returnCode:contextInfo:
    with an invalid object for an argument and probably cause a crash.'
