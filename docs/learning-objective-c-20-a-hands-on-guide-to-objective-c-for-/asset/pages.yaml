  md: '# 6

    Classes and Objects


    Objects are the basis for object-oriented programming. This chapter gets down
    to the business of making objects. The chapter is divided into five main sections:


    +   - Defining classes

    - Extending classes by subclassing

    - Creating objects (instances of a class)

    - Destroying objects

    - Copying objects


    Some of these topics were covered briefly in Chapter 3, "An Introduction to Object-Oriented
    Programming."They are presented here in greater detail.


    # Defining a Class


    When you define an Object-C class, you have to provide the compiler with two sets
    of information. You have to specify the class''s name, the class''s superclass,
    a list of names and types of the class''s instance variables, and finally the
    declarations of the class''s methods. The second set of information is the code
    that implements the class''s methods. The first set gets in the class''s *interface
    section*. The second set gets in the class''s *implementation section*.


    The sections are normally placed in separate files, both after the class. If you
    were defining a *Guitar* class, you would put the interface section in a header
    file named *Guitar.h* and the implementation section in a file named *Guitar.m*.


    # The Interface Section


    Imagine that you are creating a *RockStar* class for a simulation game. A *RockStar*
    instance does all the usual rock star things: sing, play guitar, trash hotel rooms.
    The interface section for *RockStar* looks like this:'
