- img_proc: true
  md: '+   - Sending an object retain message increases its retain count by one.


    +   - Sending an object release message reduces its retain count by one.


    +   - An autorelease message has no immediate effect, but it arranges to send
    a release message to its receiver at some future time.


    +   - When an object''s retain count reaches zero, the object is deallocated.


    Reference counting is an effective way to manage memory, but you have to follow
    the rules.


    The rules:


    +   - You own any object that you have created with a method that begins with
    "alloc", "new", or has "copy" in the method name.


    +   - You do not own an object returned by any other method. The returned object
    might be autoreleased; it might not be. You don''t care. The only thing that counts
    is that you do not own the object.


    +   - You can take ownership of an object by sending it a retain message.


    +   - When you are finished using an object that you own, you must relinquish
    ownership by sending the object a release message or an autorelease message. If
    you don''t own an object, you must not send it a release or autorelease message.


    Some auxiliary rules:


    +   - If you receive an object from a method that is not one of the creation methods,
    and you want to store it in an instance variable for future use, you must take
    ownership of the received object. (This rule has an exception for weak references.)


    +   - If you have an object that has taken ownership of any of the objects stored
    in its instance variables, your object must implement a dealloc method to release
    those when it is being deallocated.


