    # NSSet


    NSSet and NSMutableSet implement a collection of objects as a mathematical set.
    The main characteristics of the collection are:


    +   - The members of a set are not ordered. There is no way to retrieve a particular
    object from the set. You can request an array containing all the objects in a
    set with the allObjects method or loop over the set using NSEnumerator (see Chapter
    10, "Control Structures in Objective-C"). The order of the array returned by allObjects
    or obtained by successive calls to the set''s enumerator is unspecified.

    - A given object appears in the set only once, no matter how many times it is
    added to the set.

    - As NSArray and NSDictionary, objects are retain message when they are added
    to a set and a release message when they are removed from a set or when the set
    is deallocated.


    The following example shows the result of adding an object to an NSMutableSet
    that already contains that object:


    ```

    NSMutableSet *favoriteFruits = =

    [NSMutableSet setWithCapacity:3];


    // Add some objects

    [favoriteFruits addObject:@"Orange\];

    [favoriteFruits addObject:@"Apple\];


    NSLog("Favorite fruits are: %@", favoriteFruits);


    // Add the same object again

    [favoriteFruits addObject:@"Apple\];

    NSLog("Favorite fruits are: %@@", favoriteFruits);

    ```


    The result of running the preceding code is:


    ```

    Favorite fruits are: {

    Apple,

    Orange

    }

    Favorite fruits are: {

    Apple,

    Orange

    }

    ```


    Despite being added twice, "Apple" only appears in the set once.'
