  md: '# Chapter 9 Common Foundation Classes


    Creating separate mutable and immutable classes for containers allows for some
    behind the scenes efficiency in the immutable classes are implemented. When you
    create an array, the number of objects it holds is fixed at creation time.The
    actual storage for the objects can be a simple fixed-size block of memory. A mutable
    array must use a more complicated system that allows its contents to grow or shrink.
    The properties of mutable and immutable classes considered in this chapter are
    NSString and NSMutableString, NSArray and NSMutableArray, NSDictionary and NSMutableDictionary,
    NSSet and NSMutableSet, NSData and NSMutableData, NSIndexSet and NSMutableIndexSet.


    # Class Clusters


    The classes NSString, NSArray, NSDictionary, NSSet, NSNumber, and NSData are implemented
    as class clusters. Class clusters are a method of hiding complexity behind a simple
    interface. In a cluster, the publicly visible class is an abstract class. The
    actual implementation of the class is provided by a group of private "concrete"
    subclasses that hide behind the publicly visible class. Private subclasses all
    implement the interface defined by the publicly visible class, but their internal
    implementation may vary to optimize storage or performance. When you ask for an
    instance of the public class, you receive an instance of one of the cluster''s
    private subclasses.The choice is determined by the init method you use.


    > Note

    For a complete discussion of class clusters, Cocoa Design Patterns by Erik M.
    Buck and Donald A. Yachtman (Addison-Wesley, 2010).


    Implementing a class as a class cluster has several consequences:


    +   - The init method of a class that is implemented as a cluster returns a different
    object of the appropriate concrete subclass for the object returned by alloc.
    The cluster''s alloc method returns a temporary object that belongs to a special
    holder class. The init method releases the temporary object and returns an instance
    of one of the cluster''s concrete subclasses.This sequence has an important implication:You
    should never retain a reference to the object returned by alloc. Code your alloc
    and init as a single statement:


    ```

    SomeClassCluster *classCluster = [[SomeClassCluster alloc] init];

    ```


    As noted in Chapter 6, "Objects and Objects," a nested alloc, is the standard
    idiom for creation. If you get in the habit of using the standard idiom, you don''t
    have to think about this issue.


    +   - The NSObject inspection method memberOfClass: should not be used on instances
    of a class that is implemented as a cluster.

    NSArray *array = [NSArray arrayWithObject:@"Foo\];

    BOOL test = [array isMemberOfClass:[NSArray class]];'
