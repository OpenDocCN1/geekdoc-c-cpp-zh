  md: "The code in the @finally block is always executed. If the @try or @catch blocks\
    \ contain a return statement, the return is delayed until after the code in the\
    \ @finally block is executed. In Listing 10.2, the @finally block logs a message,\
    \ and the program continues executing with the statement after the @finally block.\n\
    \n> Note\nIn a multithreaded environment, exceptions are only caught if the code\
    \ raising the exception is executing on the same thread as the @try/@catch/@finally.\n\
    \n# Throwing Your Own Exceptions\n\nThe runtime system and the Cocoa frameworks\
    \ throw exceptions for you in various unfortunate situations. However, you can\
    \ also throw your own exceptions using the @throw compiler directive, as shown\
    \ in the following example:\n\n```\n(void) addion\n{\n  if ([pantry numOnions]\
    \ <= 0) {\n    NSException *exception = [NSException exceptionWithName:@\"OutOfOnion\"\
    \n                               reason:@\"PantryEmpty\" userInfo:nil];\n    \n\
    \    @throw exception;\n  } else {\n    // Add the onion\n    \n  }\n}\n```\n\n\
    NSException is a Foundation class that packages useful information about an exception.\
    \ When you create an NSException, you can specify the name of the exception, the\
    \ reason for the exception, and provide an NSDictionary that holds additional\
    \ information. You can use any object as the exception when throwing your own\
    \ exceptions, the runtime and the Cocoa frameworks always use NSException.\n\n\
    The preceding examples use an NSException object (see the sidebar NSException),\
    \ but you can use any Objective-C object as an exception object. For example,\
    \ you can use a custom subclass of NSException or an NSString as an exception\
    \ object:\n\n@throw @\"Sorry. We're out of Onions\";"
