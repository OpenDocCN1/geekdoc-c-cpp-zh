    # NSString Examples


    This section shows a few examples of some of the things you can do with NSString
    objects. Each code snippet is followed by the results of executing the code it.


    # NSLog


    ```

    NSLog("@The sky is %@", "@blue");

    ```


    The preceding line of code results in this output:


    The sky is blue.


    Notice:


    +   - NSLog''s format string is itself an NSString.

    - NSLog sends the argument corresponding to the %@ specifier a description message.
    The text of the NSString returned by the description method replaces the %@ in
    the output. NSString''s implementation of description just returns self.


