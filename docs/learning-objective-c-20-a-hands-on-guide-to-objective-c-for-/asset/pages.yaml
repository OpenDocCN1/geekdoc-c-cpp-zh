    Any code in the @finally block corresponding to the original @catch block is executed
    before the new exception is handled.


    # What Types of Exceptions Are in the Frameworks


    The Apple documentation doesn''t have a comprehensive list of all the exceptions
    that the runtime and the Cocoa frameworks can raise. The exceptions that can be
    raised by various individual framework methods are described in the documentation
    for those methods.


    # Using Exceptions


    To use exceptions in your program, you must tell the compiler that you are using
    them. If you are compiling from the command line, you must pass the flag objc-exceptions
    to gcc. If you are using Xcode, you do this by enabling the Objective-C exceptions
    in the GCC Language section of the Build Settings, as shown in Figure 10.1.'
