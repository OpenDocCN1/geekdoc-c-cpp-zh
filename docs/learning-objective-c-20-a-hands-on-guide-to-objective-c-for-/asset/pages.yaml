    \ the for...in state, its value after the for...in loop depends on how the loop\
    \ ends. If the loop executes to completion, loopVariable is set to nil.\n- If\
    \ a break statement is encountered, loopVariable is left at whatever value it\
    \ had when the break statement was executed.\n\nThe Cocoa collection classes NSArray,\
    \ NSDictionary, and NSSet, as well as NSEEnumerator, conform to the FastEnumeration.\
    \ Why NSEEnumerator? Sometimes, code subclasses of NSEnumerator perform special\
