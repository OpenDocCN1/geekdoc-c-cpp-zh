  md: "# Chapter 14 Reference Counting\n\nWhen a game controller sets up the game,\
    \ it allocates a RockStar instance and a Guitar instance, and passes the Guitar\
    \ instance to the RockStar by invoking RockStar's setGuitar: method. The obvious\
    \ way to code the setGuitar: method has a problem:\n\n```\n(void) setGuitar:(Guitar\
    \ *) newGuitar\n{\n    guitar = newGuitar; // WRONG\n}\n```\n\nThe game controller\
    \ created the Guitar with an alloc. What happens if so later the controller balances\
    \ its alloc with a release? The Guitar's retain count goes to zero and it is deallocated.\
    \ The RockStar is holding a pointer to an invalid object. To prevent this from\
    \ happening, the RockStar should send a retain message to guitar:\n[guitar retain]\n\
    \nThe retain message is the opposite of release: It increments the receiver's\
    \ count. When the RockStar sends a retain message to guitar, the message raises\
    \ the retain count of the object held in guitar to two. This prevents the object\
    \ from being deallocated, even if the code that originally allocated it sends\
    \ a release message.\nListing 14.1 shows the final form of the setGuitar: method.\n\
    \n# Listing 14.1 setGuitar:\n\n```\n1 - (void) setGuitar:(Guitar*) newGuitar\n\
    2 {\n3 if ( newGuitar != guitar )\n4 {\n5 [guitar release];\n6 guitar = newGuitar;\n\
    7 [guitar retain];\n8 }\n9 }\n```\n\nThe setGuitar: method must allow for the\
    \ possibility that guitar already contains an object (perhaps the RockStar switching\
    \ guitars because the original one has been smashed on stage). The Guitar instance\
    \ currently held in guitar received a retain message when it was stored; it must\
    \ now receive a release message when it is being replaced.\nThe preceding code:\n\
    \n+   - Line 5: The object currently held in guitar is released. If guitar is\
    \ currently nil, this line is a no-op.\n- Line 6: The new object is stored in\
    \ guitar."
