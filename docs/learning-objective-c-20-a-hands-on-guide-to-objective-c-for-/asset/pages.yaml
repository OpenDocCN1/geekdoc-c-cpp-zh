  md: '# 8


    # Frameworks


    Imagine that you have some good carpentry skills and need to build a house. You
    could take your tools into the woods and build your house by cutting down trees,
    hewing timber, and making everything that you need, by, from the raw materials.
    The resulting cabin might be a gem of craftsmanship, but this is hardly an efficient
    way to obtain a usable dwelling. A more efficient procedure would be to go to
    your local builder''s store and investigate the fine collection of pre-made doors,
    windows, and other components. The Objective-C equivalent of your local builder''s
    supply store is a set of frameworks. Frameworks are repositories of predefined
    classes and useful functions that you can use in building your applications. They
    are the Objective-C equivalent of Java or C++ class libraries.


    An important attribute of frameworks is that they are dynamically shared resources.
    Only one copy of the executable code or resources that a framework needs to be
    present on the system. Whenever possible, only one copy is loaded into memory
    and shared among all the applications that require it. Although disk space seems
    less and less of an issue these days, memory is still at a premium.


    If you are building a GUI application, using framework objects for your UI provides
    a degree of uniformity with your UI and that of other applications. This helps
    users because experience gained with other applications transfers to your application.


    This chapter covers what a framework is and how to use frameworks with your program.
    It then goes on to take a high-level, descriptive look at some of the frameworks
    you are likely to encounter when writing Mac OS or iOS programs. The next chapter
    delves into the Foundation framework in more detail. The Foundation framework
    defines NSObject, the root class for Objective-C objects, classes for strings,
    arrays, sets, dictionaries, and number objects, as objects that wrap interactions
    with the OS.


    # What Is a Framework?


    A framework is a type of bundle—a directory with a specified layout that groups
    shared dynamic libraries, header files, and resources (images, sounds, nib files)
    in a single place. The shared dynamic libraries that you need for Mac OS X and
    the iPhone'
