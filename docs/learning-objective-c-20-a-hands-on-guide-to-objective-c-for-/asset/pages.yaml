    NSString is a large class (over 100 methods) with methods for creating strings
    from files, URLs, and from other strings. It has methods for comparing strings,
    getting strings, writing strings to a file or URL, formatting strings, and a number
    of specialized methods for working with strings that are file system paths. NSString
