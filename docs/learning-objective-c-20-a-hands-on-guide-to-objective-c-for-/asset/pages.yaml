  md: "# Runtimes, Old and New\n\nApple provides two different versions of the Objective-C\
    \ runtime:“legacy” and “modern.” The legacy version is used for 32-bit OS X programs\
    \ and the modern version is used for iPhone applications and 64-bit applications\
    \ running on OS X 10.5 or later. As of this writing (January 2010), the name “legacy”\
    \ is slightly premature:The majority of existing desktop Mac applications are\
    \ 32-bit programs.\n\nFrom a programmer's point of view, the difference between\
    \ the two routines is how they store an object's instance variables. The legacy\
    \ runtime stores instance variables in what amounts to a C structure, and references\
    \ instance variables by offsets into the structure. The modern runtime uses a\
    \ different scheme and locates instance variables by name.This has two consequences.\
    \ It lets you synthesize variables for declared properties and it solves a problem\
    \ fragile base class problem.\n\n# Synthesized Instance Variables\n\nIn code that\
    \ will use the runtime, you declare a property like this (see Chapter 12, “Properties”):\n\
    \n```\n@interface Greeter : NSObject\n{\n  NSString *greetingText;\n@property\
    \ (nonatomic, retain) NSString *greetingText;\n}\n...\nend\n```\n\nIf you the\
    \ place the following line in the corresponding implementation section:\n@synthesize\
    \ greetingText;\n\nthe compiler creates the accessor methods greetingText and\
    \ setGreetingText: for you.This saves you some typing. But if you have really\
    \ tired fingers, you might complain"
  merge: -1
