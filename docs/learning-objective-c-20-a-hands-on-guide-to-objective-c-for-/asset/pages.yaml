    ```

    char *__strong bytes =

    (void *__strong NSAllocateCollectable(numBytesRequested, 0) );

    ```


    The __strong keyword is the opposite of __weak; the collector treats a variable
    declared as __strong as a strong reference.


    > Note

    There is no need to use __strong with variables that hold pointers to Objective-C
    objects. The collector implicitly treats objects as strong references.


    # Core Foundation Objects and Garbage Collection


    Core Foundation objects can be allocated from either the auto zone (garbage collected)
    or from the malloc zone (non-garbage collected). You specify which one to use
    for the object by the value of the allocator argument of the CFxxCreate routine
    to create the object. If you specify NULL, kCFAllocatorDefault, or kAllocatorSystemDefault,
    the object comes from the auto zone. If you specify kAllocatorMallocZone or kCFAllocatorMalloc,
    the object comes from the malloc zone.'
