  md: '# Retain Cycles 287


    One of unfortunate state of affairs is called a retain cycle. It is the simplest
    example of a retain cycle. You can create more elaborate retain cycles: Object
    A retains Object B, which retains Object C, which retains..., which retains Object
    A.


    The only way out of the problem is to change the code so at least one of the objects
    responsible for the retain cycle does not retain the other. For example, change
    the property in the interface section of RockStar to the following:


    ```

    @property (nonatomic, assign) Band*;

    ```


    Because the band object is no longer retained, you must also remove the [band
    release] statement from RockStar''s dealloc method. These changes break the cycle;
    the objects can be deallocated.


    An object that holds a reference to another object without retaining it is said
    to make a weak reference to that object. The normal case, where an object holds
    an object in one of its instances variable, is called a strong reference. Coding
    objects with weak references requires some care. When a Band object is deallocated,
    it relinquishes its ownership of the RockStar object which holds in its leadSinger
    instance variable. If there is any possibility that the RockStar object will continue
    to exist after the Band object is deallocated (if, for example, some other object
    also sets the RockStar''s Band''s variable to nil, as follows:


    ```

    (void)dealloc

    {

    [leadSinger setBand:nil];

    [leadSinger release]

    ```


    ```

    ...


    [super dealloc];

    }

    ```


    Setting the RockStar''s band variable to nil prevents the RockStar from inadvertently
    using a pointer to a deallocated object.


    Objective-C has no automatic way to detect retain cycles. The only way to prevent
    retain cycle is to code carefully. Use your knowledge of the structure of your
    classes, and not create one. In most cases, one object of the pair can be considered
    the primary or parent object and the other can be considered the secondary or
    child object. The primary object (the Band in the preceding example) can retain
    the secondary object (the RockStar in the preceding example), but the secondary
    object should not retain the primary object. When the primary object is deallocated,
    it should release the secondary object and set the secondary object''s weak reference
    back to the primary object to nil.


    Many Cocoa classes delegate objects, the convention is that an object does not
    retain its delegate.,'
