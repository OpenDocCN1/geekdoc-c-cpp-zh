  md: "# A Syntax Quirk in Objective-C\n\nThe “from the inside out” declaration style\
    \ of function pointers doesn’t fit with Objective-C’s syntax for method arguments.\
    \ Recall Objective-C requires the type for a method argument to be enclosed in\
    \ parentheses before the argument name. This conflict is resolved in favor of\
    \ syntax for method arguments.\n\nWhen declaring a method argument is a function\
    \ pointer, the pointer to a function that has no arguments or return value is\
    \ normally declared as:\n\n```\nvoid (*functionPtr)(void);\n```\n\nA function\
    \ that takes a function pointer of preceding type as an argument is declared like\
    \ this:\n\n```\nvoid functionWithFParg(void (*fp)(void));\n```\n\nBut a method\
    \ with the same argument type is declared like this:\n\n```\n-(void)methodWithFParg:(float\
    \ (*float))fp;\n```\n\nPutting the name of the function pointer last in a function\
    \ pointer declaration only when declaring the type of a method argument results\
    \ in a compiler error in any other situation.\n\nYou can declare arrays of function\
    \ pointers. The following line declares fpArray as an array of 10 pointers. Each\
    \ function takes a single argument, a pointer to a float, and returns void:\n\n\
    ```\nvoid (*fp[10])(float);\n```\n\nA function pointer can point to a function\
    \ that has another function pointer as an argument or returns a value:\n\n```\n\
    void (*complicatedFunctionPointer)(void)(void));\n```\n\ncomplicatedFunctionPointer\
    \ is a pointer to a function that takes no arguments and returns a pointer to\
    \ a function that takes no arguments and returns void.\n\nDeclarations like the\
    \ preceding one are ugly, but you can make your code cleaner by hiding the ugliness\
    \ with a typedef:\n\n```\ntypedef void (*complicatedFunctionPointer)(void))(void);\n\
    complicatedFunctionPointer fp;\n```\n\n# Calling a Function with a Function Pointer\n\
    \nThe following example shows how to assign a function to a function pointer and\
    \ how to call the function using the function pointer:\n\n```\nvoid logInt(int\
    \ n)\n{\n  NSLog(\"The integer is: %d\", n);\n}\n```"
