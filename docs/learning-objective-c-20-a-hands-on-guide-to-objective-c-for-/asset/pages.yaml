    # Cocoa Frameworks


    Cocoa is the name Apple uses to refer to Mac OS X programs written with the Objective-C
    technology they acquired with the purchase of NeXTStep. The Cocoa framework is
    an umbrella framework that consists of the three primary frameworks used in building
    Cocoa applications:


    +   * Foundation Framework: Foundation contains the basic objects needed for almost
    any application.The next chapter covers some of the important Foundation classes.

    * AppKit Framework: AppKit is short for Application Kit. AppKit contains the classes
    that are needed to build GUI applications on OS X.

    * Core Data: Core Data is the most recent addition (with Mac OS X 10.4). It is
    a framework for managing collections of persistent (that is, saved out to disk
    between interactions of the program) objects.


    You can get the headers for all three of these frameworks by importing:


    ```

    #import <Cocoa/Cocoa.h>

    ```


    If you are writing a command line program that doesn''t use Core Data or AppKit,
    you can just use the Foundation group header:


    ```

    #import <Foundation/Foundation.h>

    ```'
