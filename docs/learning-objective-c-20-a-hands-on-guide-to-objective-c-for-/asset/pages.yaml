    # Using Garbage Collection


    Using the Objective-C garbage collector is simple.You enable garbage collection
    by passing the gcc appropriate flag. If you are using Xcode, you do this in your
    target''s build settings, as shown in Figure 15.4.

    The possible flags are:


    +   - -objc: Indicates the code being compiled uses traditional retain/release
    reference counting and cannot be linked or loaded into an executable that uses
    garbage collection.

    - -fobjgc-only: Indicates that the code has only GC code and no retain/release.
    It cannot be linked or loaded into an executable that uses traditional reference
    counting.

    - -fobjgc: Indicates the code is written with both retain/release and GC memory
    logic. That supports both memory management models is used mostly for making frameworks
    that can be linked with either GC or non-GC executables. Dual mode code is difficult
    to write correctly and you should avoid it unless you are making frameworks. When
    dual mode code is loaded into a program with GC, the runtime shorts circuits any
    retain, release, autorelease, retainCount, and dealloc messages; they are never
    delivered to the receiver.'
