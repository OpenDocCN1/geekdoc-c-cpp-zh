  md: '# Chapter 5 Messaging


    # Note


    If you are curious and really want to know how the runtime machinery works, the
    runtime is open-source. The code can be downloaded from: www.opensource.apple.com/source/objcc4/objcc4-437.1/.
    (But forever is not easy reading.)


    The dynamism of the Objective-C messaging system is powerful and makes it easier
    to build flexible, innovative software. This dynamism comes at a price—limits
    the capability of the performer to perform some kinds of validity checking. As
    a consequence, errors will only show up at runtime. This bothers a certain fraction
    of the population that considers it dangerous and prefers stricter type checking,
    as found in languages as C++. To these people, I would like to offer the following
    analogy: A well-maintained 8-to-12 chef''s knife (or its Asian equivalent) is
    dangerous, lethal, if used carelessly or maliciously. But very little in the way
    of truly interesting is prepared without its use.


    # Summary


    Objective-C methods are invoked by messaging, rather than by direct function calls.
    A message expression consists of a receiver (the object whose method is being
    called) and a message (the name of the method to be executed, plus any arguments
    that the method takes) in square brackets. When a message expression is evaluated,
    the runtime determines the receiver''s class and then looks in the class''s structure
    to find a pointer to the code that implements the method. The runtime then fills
    in the hidden variables `self` (a pointer to the receiver) and _cmd (the name
    of the method, converted to a SEL) and uses the pointer to execute the code.


    This arrangement has several advantages. Both parts of the message expression
    can be dynamic; they can be determined at runtime rather than compile time. It
    also allows for complex polymorphism. If the receiver is typed as `id` (pointer
    to object), it can hold any object as long as the object''s class implements a
    method with a name that corresponds to the name in the message. Polymorphism is
    used when you need to elicit the same behavior from a heterogeneous collection
    of objects—for example, asking each object in a heterogeneous collection to draw
    itself.


    The keywords `self` and `super` are used inside a method to invoke other methods
    in the class or its super, respectively.


    The flexibility of the Objective-C messaging system comes at some performance.
    For critical-code, it is possible to bypass the messaging system and call the
    method directly, although in practice this is rarely necessary. The time spent
    in message dispatch is usually much smaller than the time spent executing the
    method body.'
