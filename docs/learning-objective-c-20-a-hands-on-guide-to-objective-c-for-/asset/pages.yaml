    The main thing to notice is that the Core Foundation object is more complicated
    and harder to use its Foundation equivalent.There may be times when you are forced
    to use a Core Foundation object, but, whenever you, staying at the Objective-C
    level is an easier, less error prone to code.


    # Opaque Pointers


    Core Foundation object references are opaque pointers. An opaque pointer is a
    pointer to a structure whose declaration is placed in a header file that is not
    supplied to the user. Without the header file, structure members can only be accessed
    by a set of supplied functions. The contents of the structure cannot be accessed
    directly by referencing a pointer to the structure, nor can the object be interrogated
    by the debugger. The point of opaque pointers is information hiding. Opaque pointers
    let the owner of the code modify the (private) internal implementation of the
    object without changing its public interface. Core Foundation provides a function,
    CFShow, which can be used in the debugger to display information about a Core
    Foundation object, but the use of opaque pointers can make debugging code that
    uses Core Foundation objects a frustrating experience.


    # Memory Management for Core Foundation Objects


    Core Foundation objects have a reference counted memory management system similar
    to Objective-C''s reference counting:


    +   - You own any Core Foundation object that you create by calling Core Foundation
    functions that have Create or Copy in the name.

    - You do not own any Core Foundation object that you get from any other function
    (typically a Core Foundation function with Get somewhere in its name). If you
    want the object to remain valid past the current scope, you must take ownership
    of the object by calling the function CFRetain as the function argument.'
