  md: '# Note


    There are also NSOObject instance methods class and superclass that return the
    class and superclass of an object. You should be careful when using these methods
    with that you did not code yourself. Many common classes are actually clusters.
    When you request an instance of a class that is a class cluster, you may receive
    an instance of a private subclass of the original class. The result of invoking
    or superclass on an instance of a class cluster may be different than what you
    expect. (See Chapter 9, "Foundation Classes.")


    A variable of type Class can be used instead of the class name as the receiver
    with class methods. This is used in situations where you need to create an object,
    but the class of the new object is not known until runtime. As an example, you
    can create a new object based on a type string in a configuration file:


    ```

    NSString *classNameString = ... // Read string from file

    classToInstantiate = NSClassFromString(classNameString);

    newObject = [[classToInstantiate alloc] init];

    ```


    In the following code, NSFromString is a regular C function that takes an NSString
    argument and returns a pointer to the corresponding class object. The returned
    pointer is stored in the variable classToInstantiate. Finally, classToInstantiate
    is used as the receiver with the class method alloc to create a new object of
    the requested class.


    # Introspection


    You can ask an Objective-C object about its class membership using the NSOObject
    methods isMemberOfClass and isKindOfClass: as shown here:


    ```

    [mysteriousObject isMemberOfClass:[Dog class]];

    ```


    The preceding y returns YES if mysteriousObject is an instance of the Dog class,
    and returns NO otherwise; whereas the following line:


    ```

    [mysteriousObject isKindOfClass:[Dog class]];

    ```


    returns YES if mysteriousObject is an instance of the Dog class or any class that
    inherits from Dog. If you have defined a class RescueDog that is a subclass of
    Dog, the above statement returns YES if mysteriousObject is an instance of either
    Dog or RescueDog.

    You should rarely rely on these methods. If you find yourself using one of them,
    you should stop, think for a moment, and see if there is a better way to accomplish
    the same goal. For example, if you have been handed an object typed as id, and
    you are trying to find out its class to see if it is safe to send the object a
    particular message, you should use respondsToSelector: instead:


    ```

    id mysteriousObject = ...

    if ([mysteriousObject respondsToSelector:@selector(rollOver))

    ```'
