  md: '# Chapter 15 Garbage Collection


    # The Positive


    The most important advantage of garbage collection is that it frees you from having
    to worry about the object ownership rules (balancing object creation and retains
    with the correct number of releases or autoreleases). There is less code to write,
    and memory leaks and problems from holding state pointers are much less likely
    to occur. There are also no problems with retain cycles. If several objects are
    references to each other, they will still be considered garbage and collected,
    as long as they are not reachable from a root object.


    Garbage collection also simplifies multithreaded code. Because there is no need
    for retain or release, atomic accesses become simple assignments that do not require
    locks.


    # The Negative


    There are some potential disadvantages with garbage collection. Because the collector
    is now doing some of the work that you formerly did (figuring out which objects
    need to be kept), program using garbage collection uses more CPU cycles. Full
    collections in page of all memory, making the paging behavior worse than in the
    equivalent non-GC program.


    If you allocate many objects in a tight loop, the allocation may out-run the collector,
    causing the program''s memory footprint to grow unnaturally large, adversely affecting
    performance. In a reference counting program, this can be avoided by carefully
    tuning the manual memory management with autorelease pools.


    Finally, the collector runs on a separate thread. This turns even the simplest
    into a multithreaded program. Although most of garbage collection are automatic,
    there are areas that require manual coding. If you make a mistake while writing
    code, the resulting bug may appear to be non-deterministic and can be very difficult
    to track down.


    # Should You Use Garbage Collection?


    This is a hard call. Some of the considerations are:


    +   - Apple is encouraging to use garbage collection for new Mac OS programs.
    Using garbage collection makes coding easier, and it eliminates certain types
    of problems such as mismatched retain/release messages and retain cycles.


    +   - Converting existing programs that use reference counting to garbage collection
    is probably a bad idea. There are differences in design patterns (dealloc versus
    finalize, for example) that could require rewriting large amounts of code, with
    the associated potential for adding new views.


    +   - There may be issues with some types of applications (such as audio or other
    real-time applications) where consistent, predictable performance is important.
    In these cases, you would probably want to build a test application and verify
    that garbage collection doesn''t interfere with the required performance before
    committing to using garbage collection.'
