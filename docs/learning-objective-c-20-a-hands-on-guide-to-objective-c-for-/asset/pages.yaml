  md: '# External Variables 43


    These are the important things to remember about automatic variables:


    +   - Automatic variables are created on the stack. They are only valid from the
    point where they are declared to the end of the function (see Scope, later in
    the chapter). When the function returns, the system moves the stack pointer to
    the bottom of the previous frame. Subsequent calls to other functions create new
    frames and most likely overwrite the memory locations assigned to earlier functions''
    automatic variables. If you call logAverage() with the arguments 10.0 and 12.0,
    the variable average has the value 11.0 when the printf statement is. If you later
    call logAverage() again, at a later time, average is unlikely to be 11.0 at the
    end of the routine.

    - Automatic variables are not initialized by the system. Until you assign them
    a value, they contain whatever junk was left in memory location from the last
    time it was used.

    - Automatic variables are associated with a single call of a function. If you
    have recursive code when a function calls itself, each of the function has its
    own stack frame and copy of the automatic variables. Changing the value of one
    will not change its value in any of the other calls on the stack.

    - Taking the address of an automatic variable with the & operator and assigning
    the address to a pointer variable held outside of the function is a very bad idea—the
    pointer variables will jump as soon as the function exits.


    > Note

    Automatic variables are automatic in the sense that their storage is allocated
    on the stack when you call the function they are used in. However, you still have
    to tell the compiler about them declaration.


    Function Parameters

    Function parameters are essentially automatic variables that have been initialized
    with the values supplied when the function was called. They are created on the
    stack and they become invalid when the function returns. You can reset their value
    in the function body, as noted in the previous chapter, changing their value has
    no effect on the corresponding variables in the calling function.


    # External Variables


    Variables that are declared in a source file outside the scope of main or any
    subroutine are called external variables. In the following example, pageCount
    is an external variable:'
