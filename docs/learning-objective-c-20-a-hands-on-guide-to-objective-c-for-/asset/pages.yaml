    # Subclassing a Class


    It would be very time consuming (not to mention boring) if you had to start from
    scratch every time you wrote a program. Object-oriented languages like Objective-C
    let you avoid some of this effort and tedious reusing. You create new classes
    by modifying or adding to classes. Although you can reuse code at the source level
    in any language, the important point here is that object-oriented languages let
    you build on an existing class, even if you don''t have the source code for the
    original. Here is some terminology that is used when talking about this:


    +   - A class defined by extending an existing class is called a *subclass* of
    the original class.

    - The existing class is the *superclass* of the new class.

    - Aside from the modifications noted in the next section, a subclass has the same
    instance variables and methods as its superclass. The subclass is said to *inherit*
    its superclass''s instance variables and methods.


    # Defining a Subclass


    A subclass can extend or modify an existing class in one or more of three ways:

    - A subclass can add instance variables to those present in its superclass. A
    subclass cannot, however, remove any instance variables defined by its superclass.

    - A subclass can add methods to those in its superclass.

    - A subclass can provide its own implementation of a method that is declared in
    its superclass. This is called *overriding* method.


    > Note

    To be technically correct, a subclass isn''t required to do any of the preceding
    things. But a subclass that didn''t add instance variables or methods, or override
    a method, would be fairly pointless. It would merely be an alias for its superclass.


