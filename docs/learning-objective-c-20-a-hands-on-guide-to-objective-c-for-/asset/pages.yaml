- img_proc: true
  md: 'Core Foundation objects allocated from the malloc zone behave the same way
    as they do under reference counting. They are returned from the core routines
    with a reference count of one. When their reference count drops to zero, they
    are immediately deallocated.


    Note Unlike the Objective-C methods retain and release, the Core Foundation functions
    CFRetain and CFRelease work normally in a garbage collected environment.


    The behavior of a Core Foundation object allocated from the auto zone is subtly
    different. Even though it is managed by the collector, it is still created with
    a reference count of one. An object with a reference count greater than zero behaves
    like a root object. The collector does not collect it. When the object''s reference
    count drops to zero, it is not immediately deallocated; it merely becomes eligible
    for collection. If there are no strong references to the object, it is collected
    the next time the collector runs.


    If you want to manage a Core Foundation object from the beginning, you can use
    the function CFMakeCollectable:


    ```

    _strong CFMutableArrayRef myCFArray =

    CFMakeCollectable(CFCreateMutable(kAllocatorDefault, ...

    ));

    ```


    CFMakeCollectable is similar to CFRelease, but it checks to make sure the object
    was allocated before decrementing the count, and returns a reference to the original
    object. The strong key is necessary because the Core Foundation types like CFMutableArrayRef
    are typedefed for ordinary C pointers. The collector treats a holding a Core Foundation
    type as a weak reference unless you tell it otherwise with _strong.


    # Some Bumps in the Road


    Retrofitting a garbage collector to a language that has exposed pointers C and
    Objective-C is a very difficult task. Apple has done an amazing job, but there
    are some rough spots and edge cases that can cause you trouble.


    # Opaque Pointer Problems in the AppKit


    Methods in the AppKit have one of their arguments an opaque pointer typed as void*.
    Typical examples are the methods used to begin sheets. These methods have arguments
    for a "didEnd" selector that is called when the sheet is dismissed, and for a
    context object, typed as void*, that is passed as an argument to the didEnd selector.
    The context object, typically an NSDictionary, is used to pass information from
    the object creating the sheet to the method handling the user''s input.'
