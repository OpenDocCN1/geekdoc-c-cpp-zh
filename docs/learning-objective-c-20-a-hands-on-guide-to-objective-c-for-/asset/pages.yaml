  md: '# TablePrinter Example


    # Where Does a Protocol Declaration Live?


    A protocol declaration must be visible to the interface section of a class that
    adopts protocol. In the current example, the declaration of the TablePrinterDataSource
    protocol is placed in its header file, TablePrinterDataSource.h (see Listing 13.1),
    which is imported into FruitBasket.h (see Listing 13.4). As an alternative, the
    declaration of TablePrinterDataSource could be placed in TablePrinter.h (see Listing
    13.2). FruitBasket.h would need to import TablePrinter.h. Typically, in the Cocoa
    frameworks, a formal protocol is declared in the header file of the class that
    is its primary user of conforming to that protocol. However, a few Cocoa protocols
    are declared in their own header files.


    # A Problem


    The project you worked, you have noticed a small problem when you built it; some
    compiler warnings such as the:


    ```

    TablePrinter.m:23:

    ''respondsToSelector: not found in protocol(s)

    ```


    The compiler is complaining respondsToSelector: isn''t part of <TablePrinterDataSource>
    protocol. It isn''t, but it shouldn''t matter because respondsToSelector: is implemented
    by NSObject, and every object (the object passed as the data source) inherits
    from NSObject. And it doesn''t—the program worked just fine, didn''t it? Well,
    yes, it''s a bad idea to get in the habit of ignoring compiler warnings, even-spurious
    ones. If you start ignoring warnings, one day as the Sun rises, you''ll ignore
    that it''s spurious and there will be trouble.


    You can fix this in one of two ways. In TablePrinter.h, you can change the type
    in the instance variable and protocol declarations to:


    ```

    NSObject <TablePrinterDataSource> *dataSource;

    ```


    This tells the compiler that dataSource is a subclass of NSObject as well as implementing
    TablePrinterDataSource. A more elegant solution is to change the @protocol in
    TablePrinterDataSource.h to:


    ```

    @protocol TablePrinterDataSource <NSObject>

    ```


    This means that anything adopts <TablePrinterDataSource> also adopts the <NSObject>
    protocol. This illustrates the important point that one protocol can adopt another.<NSObject>
    is a protocol that NSObject adopts (see the sidebar, NSObject and <NSObject>).
    Again, because NSObject implements respondsToSelector:, you don''t have to do
    anything beyond making the compiler understand that everything is OK.


    # 259'
