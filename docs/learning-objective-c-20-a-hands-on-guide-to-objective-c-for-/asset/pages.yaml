    \ to mutableData after the while loop:\n\n```\nNSmutableData = *mutableData =\
    \ ...\nchar *bytes = [mutableData mutableBytes];\nNSUInteger length = [mutableData\
    \ length];\n{\n    // Do something with mutableBytes.\n    length--;\n}\n[mutableData\
    \ self];\n```\n\nmutableData self) doesn't really do anything—it returns a pointer\
    \ to mutableData, which is then discarded—but it is enough to keep the compiler\
    \ giving away mutableData's spot on the stack after the while loop completes.\n\
    \n# Falsely Rooted Objects\n\nAnother oddity is, due to the way it is implemented,\
    \ the collector can't always determine exactly where the stack ends. To avoid\
    \ leaks, the collector err on the side of caution and looks for objects bit beyond\
    \ the nominal end of the stack. If the collector finds a pointer to an object\
    \ that was left on the stack from a previous function the object becomes falsely\
    \ rooted. The collector considers it a root object and doesn't collect it even\
    \ if it is not being used. The following function fixes the problem by zeroing\
    \ out the unused portions of the stack:\n\n```\nobjc_clear_stack(OBJC_CLEAR_RES);\n\
    ```\n\nIf you are writing a GUI program, you don't have to worry about this. The\
    \ AppKit arranges to call objc_clear_stack for you periodically. However, if you\
    \ are writing a Foundation program, you may want to call obj_clear_stack yourself\
    \ at intervals.\n\n# Garbage Collection Pro and Con\n\nUsing garbage collection\
    \ is an option, not a requirement. The following sections list some of the things\
    \ that you should consider when deciding to use garbage collection in your applications."
