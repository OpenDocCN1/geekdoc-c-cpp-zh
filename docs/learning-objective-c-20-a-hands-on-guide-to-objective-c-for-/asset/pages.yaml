  md: '# Objective-C Additions


    This section is a brief summary of the additions that Objective-C makes to C.


    # Runtime


    Objective-C requires a runtime. The runtime is a dynamic link library of C functions
    that is provided on all systems that support Objective-C. It does the work of
    setting up and operating the Objective-C messaging system. The runtime does its
    work silently, behind the scenes. In normal circumstances, there is no need to
    interact with the runtime directly by calling one of its functions.


    # Names


    Like plain C, names in the object part of Objective-C are case sensitive. Objective-C
    has a number of naming conventions such as the naming for classes and method names
    noted earlier in the chapter. These conventions are not an enforced part of the
    language, but they are universally followed. If you violate them, people familiar
    with Objective-C will have a difficult time following your code. Some other rules:


    +   - A class can declare an instance variable that has the same name as an instance
    variable in a different class.


    +   - A class can declare a method that has the same name as a method in a different
    class, as was shown in the section on polymorphism earlier in the chapter.


    +   - A method can have the same name as an instance variable. (This is common
    for methods that return the value of an instance variable. See Chapter 12, "Properties.")


    +   - An instance method of a class can have the same name as a class method of
    the same class.


    +   - Apple considers names that begin with an underscore character (_) to be
    reserved for internal Apple use.


    # Message Expressions


    The most important addition that Objective-C makes to C is the message expression:

    [receiver message]


    The receiver is an object or, strictly speaking, a pointer to an instance of a
    class. The message is one of the methods defined by the receiver''s class plus
    any arguments that the method takes. When a statement containing a message expression
    is executed, the Objective-C runtime determines the receiver''s class and looks
    up the method name contained in message the class''s list of methods and executes
    the code corresponding to that method. Message expressions are covered in Chapter
    5.'
