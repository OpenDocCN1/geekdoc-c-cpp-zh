  md: '# Chapter 3 An Introduction to Object-Oriented Programming


    # Polymorphism


    Polymorphism is the capability of objects belonging to different classes to respond
    to the same message. For example, you could add an Image class to the drawing
    program so it can also render images (bitmaps). Like the Shape class, the Image
    class defines a draw method. Each class''s implementation of the draw method is
    different: Shape''s draw method knows how to draw Shape and Image''s draw method
    knows how to draw images. If you have a list of graphic objects that represent
    a drawing, you can render it on the screen by sending each object in the list
    draw method. Even though the message is the same in each case, the Shape objects
    on the list will execute Shape''s version of draw and the Image objects will execute
    Image''s version of draw.


    # What is the Purpose of an Object-Oriented Language?


    It is possible, but difficult and unpleasant, to implement an object-style programming
    using a procedural language. Using C as an example, you could use structures and
    regular C functions as methods. To add methods to your objects you could add fields
    to the object structure to hold pointers to the method function that would allow
    you to pass a pointer to the object on whose behalf it was being executed. But
    you would rapidly run into problems. Even something as simple as storing different
    classes of objects in a single array and looping over them requires awkward use
    of the cast operator.


    There are other drawbacks. Building your own object system can result in fragile
    code and unintended consequences if you haven''t thought out all the implications
    of your design. A more serious problem is that a homemade object system is likely
    to be a one-off design. A one-off custom design makes it difficult to incorporate
    code or libraries from other sources. You would have to build everything from
    scratch, at a cost of longer development times and an expanded opportunity for
    bugs.


    It is much easier to create an object-oriented design in a language that has the
    constructs for object-oriented programming built into the language.


    # An Introduction to Objective-C


    Objective-C is an object-oriented extension to C. As you will see in this section
    and the next, Objective-C''s additions to C are quite minimal. The additions are
    primarily a way to define classes, a way to invoke methods, and a dozen or so
    keywords for the compiler. The concepts are subtle and very powerful, but there
    is relatively little syntax to manage.


    In adding an object system to C, Objective-C doesn''t eliminate the procedural
    parts of C. This gives you the best of both worlds. You can use objects for tasks
    where they are appropriate, and use the procedural part of Objective-C (plain
    C) where it is the best fit to the problem. Having plain C as a base for the language
    also makes it easy for Objective-C programs to use existing libraries and code
    that are written in plain C.'
