  md: '# Kernel and User Programs in 64-Bit


    The kernel and user programs are separate. Each can be 32- or 64-bit. A 32-bit
    kernel can run 32- and 64-bit user programs. So can a 64-bit kernel? Although
    recent Intel Macs are capable of booting a 64-bit kernel, most consumer computers
    are set up to boot the 32-bit version of the kernel. This is because the entire
    kernel (including device drivers and kernel extensions) must be either 32– or
    64—not both. Relatively few 64-bit device drivers are presently available. Most
    systems that have a 64-bit kernel tend to be running Mac OS X (the desktop version
    of Mac OS X). These machines usually don''t have pointers or other peripherals
    that require a device driver. This situation will undoubtedly change as 64-bit
    device drivers become available.


    The restriction on mixing sizes applies to user space programs. If you compile
    a program for 64-bits, all the libraries and frameworks that you link against,
    and any plugins you use, must be available in 64-bit versions. This is not a problem
    for the system-supplied libraries and frameworks, such as the Cocoa frameworks,
    which are all available in 64–bit versions. However, if you are using other libraries,
    you may have to compile them yourself for 64-bit (if you have access to the source)
    or continue to building your program as a 32-bit application until 64-bit versions
    of the resources become available.


    # Coding Differences for 64-Bit Programs


    The main difference between 32- and 64-bit executables is some of the primitives.
    In a 32-bit executable, ints, longs, and pointers are all 4 bytes. In a 64-bit
    executable, ints are 4 bytes, longs and pointers are 8 bytes. The primary difference,
    the one that can cause you trouble, is that in a 64-bit executable, longs and
    pointers are no longer the same size as.


    Assigning a type to a longer type is okay, but assigning a pointer to a shorter
    type truncates the value held in the longer type and may result in nonsense. This
    may seem an obvious point, but there is a long history in C programming of ignoring
    the difference between a pointer and an int, and ignoring the fact that many system
    calls actually return long than int. Glossing over the difference between a pointer
    and an int, or the difference between a long and int, makes no real difference
    when they are all 4 bytes; the code compiled for 64-bit can cause real problems.
    When coding for 64-bit, you should be careful when doing pointer arithmetic; you
    should never cast a pointer to an int.


    # Performance


    Does compiling a program as a 64-bit executable make it run faster? There is no
    way to tell without building the program as separate 32- and 64-bit executables
    and comparing the execution times. When you move to a 64-bit executable, there
    are some competing effects. On one hand, when an Intel CPU runs in x86_64 (64-bit)
    mode, it'
