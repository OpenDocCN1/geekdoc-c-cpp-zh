  md: '# The Structure of a C Program


    Objective-C programmers usually use CamelCase names for variables. CamelCase use
    capital letters to mark the beginnings of subsequent words in a name:

    applesPerBasket


    Names beginning with an underscore are traditionally used for variables and functions
    that are meant to be private, or for internal use:

    _privateVariable

    leaveAlone


    However, this is a convention; C has no enforcement mechanism to keep variables
    or functions private.


    # Files


    The code for a plain C program is placed in one or more files that have a .c extension:

    CProgram.c


    > Note

    MacOS X filenames are not case sensitive. The file system will remember the case
    used to name a file, but it treats myfile.c, MYFILE.c, and MyFile.c as the same
    filename.


    Code that uses the Objective-C objects (the material covered in Chapter 3, “An
    Introduction to Object-Oriented Programming”) is placed in one or more files that
    have a .m extension:

    ObjectiveCProgram.m


    > Note

    Because C is a proper subset of Objective-C, it''s OK to use a plain C program
    in a .m file.


    There are some naming conventions for files that define and implement Objective-C
    classes (discussed in Chapter 3), but C does not have any rules for the part of
    the name preceding the filename extension. It is silly, but not illegal, to name
    the file containing for an accounting program:

    MyFlightToSort.m


    C programs also use header files. Header files usually contain various definitions
    that are shared by many .c and .m files. Their contents are merged into other
    files by using #include or #import preprocessor directive. (See Processor, later
    in this chapter). Header files have a .h filename extension as shown here:

    HeaderFile.h'
