  md: '# Using Protocols


    The protocol declaration goes in a header file, so you could put this declaration
    in a header file named DrawableItem.h. There is no corresponding implementation
    file. Each class that adopts the protocol provides its own implementations of
    the protocol methods.

    Prior to Objective-C 2.0, a class that adopted a protocol was required to implement
    all of the protocol''s declared methods. Objective-C 2.0 allows you to mark protocol
    methods as either optional or required:


    +   - A class that adopts a protocol must implement all of the protocol''s required
    methods.

    - A class that adopts a protocol is free to implement or not implement any of
    the protocol''s optional methods.


    Optional and required methods are marked off with the @optional and @required
    directives. The methods are considered in the order that they are declared in
    the file. Methods following a @required directive are required. Similarly, methods
    following an @optional directive are optional. If you do not specify anything,
    a method is required by default.


    In the drafting example, some drawable items might supply text to use as a label.
    For example, you could use an optional method to get the text, as shown here:


    ```

    @required

    -(void)drawItem;

    -(NSRect*) boundingBox;

    -(NSColor*) color;

    -(void)setColor:(NSColor*) color;


    @optional

    -(NSString) labelText;


    @end

    ```


    If a particular <Drawable> class has some label text, it implements the -labelText
    method; otherwise, it doesn''t. It is up to any class using a <Drawable> to check
    and see if an <DrawableItem> implements -labelText.


    # Adopting a Protocol


    A class adopts a protocol by implementing all the protocol''s required methods
    and any none of the protocol''s optional methods. You tell the compiler that your
    class is adopting a protocol by adding the protocol name, enclosed in angle brackets,
    to the class''s @interface line:


    ```

    @interface AcmeUniversalComponent : AcmeComponent <DrawableItem>

