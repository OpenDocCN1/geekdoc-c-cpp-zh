    # NSData


    It''s always possible to stay within the world of objects. There may be occasions
    when you have to process a block of bytes. Perhaps the bytes are the contents
    of a file in some format that you have to parse yourself, or raw data. NSData
    provides a convenient way to wrap a block of bytes and treat it as an Objective-C
    object.


    Using NSData raises some inevitable questions:“Who owns the bytes?”“Where they
    come from?” NSData offers several options. You can ask NSData to create an instance
    by copying some bytes:


    ```

    unsigned howManyBytes = 100;

    ```


    ```

    char* someBytes = (char*)malloc(howManyBytes);

    ```


    ```

    NSData* data = [NSData dataWithBytes:someBytes length:howManyBytes];

    ```


    The preceding code copies someBytes into a buffer created and owned by the NSData
    object. The buffer is freed when the NSData object is deallocated. You are still
    responsible for freeing the original someBytes. If you don''t want the cost of
    a copy, you can do the following:


    ```

    unsigned howManyBytes = 100;

    ```


    ```

    char* someBytes = (char*)malloc(howManyBytes);

    ```


    ```

    NSData* myData =

    [NSData dataWithNoCopy:someBytes

    length:howManyBytes

    freeWhenDone:YES];

    ```


    The NSData object uses the existing bytes as its buffer. If the freeWhenDone argument
    is YES, the NSData takes ownership of the bytes, and frees when it''s deallocated.
    (If someBytes was not originally allocated with malloc, freeWhenDone: should be
    NO. Passing YES will cause your program to crash).


