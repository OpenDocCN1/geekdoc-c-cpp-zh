    If you gather these methods together and give the collection name, you have a
    protocol. A class that implements a protocol''s methods is said to adopt the protocol.
    As you will see later in the chapter, a class advertises the protocols it adopts
    in its interface section.


    # Why Not Just Use Inheritance?


    Why not just have all the drawable items in the program inherit from a single
    DrawableItem abstract class that declares the necessary methods?


    That''s possible, and you might do that if you were designing a small system with
    a limited number of drawable items. However, under other circumstances, subclassing
    is an awkward solution: The classes that represent components that you need to
    draw may have been created (for other purposes and with their own object hierarchy)
    before you started your program. They may have been supplied to you by a third
    party. Adding functionality to implement a protocol is a much cleaner solution
    than refactoring an entire class hierarchy to push in an abstract class near the
    top. The beauty of protocols is only functionality matters, not class.


    # Using Protocols


    In this section, I''ll continue with the drawable item example to show you the
    mechanics of declaring and using protocols. Later in the chapter, I''ll go through
    a different example protocol in detail.


    # Declaring a Protocol


    Protocol names are enclosed in brackets. The protocol for a drawable item would
    be called `<DrawableItem>`.


    You declare a protocol by declaring its methods @protocol and @end compiler directives.
    For the `<DrawableItem>`, the protocol declaration looks like this:


    ```

    @protocol DrawableItem

    - (void) drawItem;

    - (NSRect) boundingBox;

    - (UIColor*));

    - (void) setColor:(UIColor*) color;

    @end

    ```


    This is obviously a highly simplified example. In a real drawing system, you would
    need methods to set a component''s position and orientation, and methods for obtaining
    dimensioning and other information.'
