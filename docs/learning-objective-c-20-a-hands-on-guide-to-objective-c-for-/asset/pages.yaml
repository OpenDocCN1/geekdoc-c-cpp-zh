    ![](img/76d4811a08eab8661f65c0f84232f696_313_0.png)


    If you are writing a Foundation (non-GUI) program, you must create at least one
    autorelease pool yourself:


    ```

    main ()

    {

    NSautoreleasePool *pool = [NSAutleasePool alloc] init];

    ...

    // Whatever your program does

    ...

    [pool release];

    return 0;

    }

    ```


    > Note

    Autorelease class also supplies a method named drain. In code compiled for reference
    counting, drain is identical to release. In code compiled for garbage collection
    (see Chapter 15, "Garbage Collection"), a release message is a no-op, whereas
    a drain message functions as a hint to the garbage collector that the collector
    should consider doing a collection. The difference between release and drain is
    significant only if you are writing framework code that will be compiled for both
    reference counting and garbage collection.'
