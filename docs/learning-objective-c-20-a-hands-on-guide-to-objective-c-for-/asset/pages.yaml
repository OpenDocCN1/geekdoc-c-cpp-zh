  md: "# Chapter 2 More About Variables\n\nNote\nnThe virtual address space is the\
    \ address space that a program “sees.” The translation between virtual address\
    \ space and the actual physical addresses is handled invisibly by the OS and the\
    \ computer's Memory Management Unit (MMU).\n\nGoing in order from low to high\
    \ virtual:\n\n+   - The text segment contains the executable code and read-only\
    \ data.\n- The data segment contains read-write data including global variables.\n\
    - The heap contains blocks of memory that can be dispensed to the program on request.\
    \ (See Dynamic Allocation, later in this chapter.) When more memory is required,\
    \ the system may expand the upward.\n- The stack is used for calling functions.When\
    \ you call a function, the system constructs a stack frame for the called function.\
    \ The stack frame is a region of memory built on the bottom (lowest address) of\
    \ the stack. The stack pointer (which points to the lowest address of stack) moves\
    \ downward. The stack frame contains space for the called function’s parameters\
    \ and local variables, space for saving the values of any registers that need\
    \ to be saved across the function call, and some control information. When the\
    \ function returns, the stack pointer is restored to its previous (higher address)\
    \ value and control returns to the calling function. The important point to remember\
    \ this is after a function returns, the contents of its stack frame are no longer\
    \ valid.\n\nNote\nSome people like to think of the stack as expanding upward,\
    \ analogous to a pile of physical cards on their desk. They refer to the stack\
    \ pointer pointing to the “top” of the stack.”However you choose to think about\
    \ it, the stack grows downward in terms of memory addresses. Calling a function\
    \ moves the stack pointer to a lower address and returning from a function moves\
    \ it back to a higher address.\n\n# Automatic Variables\n\nVariables you declare\
    \ in a function or subroutine are called automatic or local variables. Consider\
    \ the following simple function:\n\n```\nvoid logAverage(float a, float b)\n{\n\
    \    float average;\n    average = 0.5 * (a + b);\n    printf(\"The average is\
    \ %f\\n\", average);\n}\n```\n\nIn the preceding example, average is an automatic\
    \ variable."
