    The interface sections:


    +   - An @interface compiler directive followed by the name of the class being
    defined (RockStar in this example), a colon, and the class''s super (NSObject
    in this example)

    - Declarations of the class''s variables. An instance variable declaration gives
    the type and name of the instance variable, and is enclosed in curly brackets.
    If the class doesn''t define any instance variables, the brackets may be omitted.

    - A list of method declarations. The method declarations must come after the instance
    variable declarations.


    Methods that have a declaration beginning with a hyphen (-) are instance methods;
    they are used with an instance of the class as a receiver. Methods whose declaration
    begins with a sign (+) are class methods; they are used with the class name as
    receiver. Class methods are covered in the next Chapter 7, “The Class Object”.


    +   - A final @end directive, close the section.


    The compiler needs some information about a class''s superclass, so a class''s
    @interface section must import the header file that contains its super''s interface
    section. In this example, RockStar’s superclass, NSObject, is a Foundation framework
    class. Importing Foundation/Foundation.h automatically imports the superclass
    header file NSObject.'
