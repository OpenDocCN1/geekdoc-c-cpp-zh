  md: '# Summary 51


    When you are finished using the memory allocated with malloc, you return it by
    calling **free**;


    ```

    free(pixels);

    pixels = NULL;

    ```


    The call to **free** allows the program to reuse the memory. After the bytes are
    freed, they can be handed out for a different use with a subsequent call to malloc.
    The Golden Rule of dynamic allocation is: If you allocate something, you''re responsible
    for giving it back when you are finished. Otherwise, your application will "leak"
    memory. Your process size will be bigger than it needs to be, and the performance
    of your program and any others running at that time may suffer.


    Note


    Each free must balance a corresponding malloc. Freeing a pointer that you have
    not malloced or freeing the same pointer twice causes an immediate crash.


    Note


    Using a pointer to bytes that have been freed can corrupt your program''s memory
    and cause random crashes that are very difficult to debug. Setting pixels to NULL
    provides a measure of safety. If you make a mistake in your code and attempt to
    use the NULL pointer, your program will immediately crash. The problem and its
    location will be obvious.


    # Malloc Zones


    Instead of a unified heap, X has one or more *malloc zones*. The first malloc
    zone, called the default *malloc zone*, is created at the time of the first call
    to malloc. The standard malloc function gets its bytes from the default malloc
    zone. It is possible to create additional malloc zones using the function `malloc_create_zone`.


    Using additional zones is an advanced technique that can be used in special cases
    to optimize performance. It allows you to group groups of frequently accessed
    variables memory locations or to release variables at once (releasing an entire
    zone).


    While officially deprecated, Objective-C now allows using zones other than the
    default malloc zone in Objective-C (see http://developer.apple.com/mac/library/DOCUMENTATION/Performance/Conceptual/ManagingMemory/Articles/MemoryAllocation.html).


