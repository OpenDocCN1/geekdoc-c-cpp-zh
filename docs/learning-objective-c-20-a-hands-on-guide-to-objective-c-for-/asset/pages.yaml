    # The Class Object


    In Objective-C, unlike Java or C++, classes are themselves objects. Objective-C
    classes are instances of a special class called Class. You can send messages and
    they can execute methods. This chapter looks at the technical details of class
    objects and class methods, and then takes a brief look at some examples of class
    methods. The last section of this chapter is an extended example where you''ll
    learn how to implement variables that are global to all instances of a given class.


    # Class Objects


    Each class in an Objective-C program is represented by a single class object that
    contains the information that defines the class. You don''t have to do anything
    to instantiate class objects; the compiler creates them for you for information
    in the class definition.


    Class objects can receive messages and execute methods called class methods. You
    have already seen the most common example of this, the alloc class method:


    ```

    [SomeClass alloc]

    ```


    The receiver in a class message is a class object. The class name may be used
    to represent the class object in a message expression as shown in the preceding
    example.


    > Note

    The receiver in a class message is the only place that a class name can substitute
    for its corresponding class object.


    Class objects are not instances of the class they represent. You can''t use a
    class object as the receiver with any of the class instance methods. For example,
    count is an instance method of the NSArray class. It returns the number of objects
    in an array. If you try to use count with the NSArray class object as the receiver:


