    # Note


    Don''t confuse dealloc deallocation with dealloc. Deallocation is the process
    of returning an object''s bytes to the heap. This happens under both reference
    counting and garbage collection. dealloc is a method that is called just before
    an object is deallocated in a reference counted environment.


    Under garbage collection, NSObject provides an alternative method, finalize, which
    is called just before an object is deallocated. Although finalize appears to be
    an analog of dealloc, there are some significant differences:


    +   * In a finalize method, there is no need to release (nil out) references to
    any other objects in the disappearing object''s instance variables. If the only
    reference to another object is an instance variable of the disappearing object,
    the other object is unreachable and will be collected.


    +   * The order in which dealloc methods are called is deterministic. The order
    in which finalize methods are called is not. At the end of a collection cycle,
    the collector calls the finalize methods of all the objects that are marked for
    collection before any of the objects are deallocated. The order in this group
    of finalize methods is called is indeterminate


    +   * It is possible for objects in the group that is being collected to message
    each other from their finalizers. Object A''s finalize method can manage Object
    B, even if Object B''s finalize method has already executed.This allows for the
    possibility of messaging an object that is in an invalid or inconsistent state.
    You should try to avoid messaging other objects in a finalizer.


    However, dealloc, if you implement a finalize method, you must remember to call
    the superclass implementation of finalize:


    ```

    [super finalize];

    ```


    Apple''s official recommendation is to avoid finalizers if at all possible. It
    recommends managing the cleanup of scare resources like file descriptors and network
    connections in your code. However, this is a bit inconvenient, in some cases,
    the only way to determine the appropriate time to call an invalidate method is
    to implement your own reference counting system for the resource. If you are faced
    with a situation like that, you should go ahead and put the cleanup code in a
    finalize method.


