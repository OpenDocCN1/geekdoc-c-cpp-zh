  md: "# When Retain Counts Go Bad 283\n\n```\n(Guitar*) guitar\n{\n  return guitar;\n\
    }\n```\n\nBy convention, an object returned by a getter should remain valid until\
    \ the method that invoked it returns. In a multithreaded program, another thread\
    \ could cause the object held in guitar to be deallocated at any time after getter\
    \ returns. The original thread may not even get a chance to retain it. Rewriting\
    \ the getter to use the following pattern eliminates the problem:\n\n```\n(Guitar*)\
    \ guitar\n{\n  @synchronized(self)\n{\n    return [[retain] autorelease];\n  }\n\
    }\n```\n\nSending a retain message followed by an autorelease message has no effect\
    \ on the object's retain count, but by putting the object in the invoking thread's\
    \ autorelease pool, it delays the release message, giving the invoking code a\
