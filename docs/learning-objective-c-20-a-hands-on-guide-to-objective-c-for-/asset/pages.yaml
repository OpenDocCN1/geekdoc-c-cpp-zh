    # Dot Syntax


    Along with properties, Objective-C 2.0 also introduces a new syntax, called dot
    syntax, which is shorthand for calling accessor methods.

    Instead of writing code like:


    ```

    Employee *employee = // ...


    int currentSalary = [employee salary];

    [employee setSalary: 100000];


    You can write:

    Employee *employee = // ...


    int currentSalary = employee.salary;

    employee.salary = 100000;

    ```


    At runtime, the dot syntax is pure "syntactic sugar.\These two examples produce
    exactly the executable code.


    # Syntactic Sugar


    Syntactic sugar is syntax added to a computer language to make code written in
    that more readable for human programmers. It has no effect on the binary that
    a compiler produces or on the execution of the resulting program. For example,
    as saw in Chapter 1, "The Foundation of Objective-C," the elements of a C array
    are actually accessed by pointer. Following two statements do the same thing.
    They both set the third element of an array of integers someArray to 17:


    ```

    *(someArray + 2) = 17;

    someArray[2] = 17;

    ```


    The second form, which uses brackets, is syntactic sugar. It results in the same
    exe-code as the pointer expression but it is easier to read.


    The order of method declarations in a header file has no effect on the resulting
    binary, for the sake of looking at the file, related methods should be placed
    in close proximity. Unfortunately, like other ideals, not everyone lives up to
    this one.'
