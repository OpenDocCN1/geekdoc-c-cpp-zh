    Figure 1.1 Pointer variables


    The unary * operator (called the "contents of" or "dereferencing" operator) is
    used to set or retrieve the contents of a memory location by using a pointer variable
    points to that location. One way to think of this is to consider the expression
    *pointerVar to be an alias, another name, for whatever memory location is stored
    in the contents of pointerVar. The expression *pointerVar can be used to either
    set or retrieve the contents of memory location. In the following code, b is set
    to the address of a, so *b becomes an alias for a:


    ```

    int a;

    int c;

    int *b;

    ```


    ```

    a = 9;

    ```


    ```

    b = &c;

    ```


    ```

    *b = 10; // c is now 10

    ```


    Pointers are used in C to reference dynamically allocated memory (Chapter 2).
    Pointers are also used to avoid copying large chunks of memory, such as arrays
    and structures (discussed later in this chapter), from one program to another.
    For example, instead of passing a large structure to a function, you pass the
    pointer to the structure. The function then uses the pointer to access the structure.
    As you will see later in the book, Objective-C objects are always referenced by
    pointer.


    # Generic Pointers


    A variable declared as a pointer to void is a generic pointer:


    ```

    void *genericPointer;

    ```


    A generic pointer may be set to the address of any variable type:


    ```

    int a = 9;

    void *genericPointer;

    genericPointer = &a;

    ```'
