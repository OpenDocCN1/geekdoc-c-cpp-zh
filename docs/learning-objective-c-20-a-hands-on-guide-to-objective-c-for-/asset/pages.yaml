  md: '# Categories 217


    +   - Classes that are implemented as class clusters, such as NSString, require
    a lot of work to subclass. Use a category if you can.

    - Categories have wide visibility. A method added to a class in a category can
    be used by any instance of that class and any instance of a class that inherits
    from that class. This may make the method available on a wider scale than intended.
    If you find yourself adding a category to NSObject, you should pause and rethink
    your design. A category is rarely a good idea if it will affect every object in
    your program.

    - Overriding a category can be dangerous. Be especially careful when using a category
    to override an existing method in a class. You should make sure that you understand
    what the original method did and where it is used before you replace it.

    - Adding instance variables requires subclassing. If you need to add instance
    variables to extend a class, you will have to subclass.

    - Sometimes, you have no choice but to subclass. If you need to extend the same
    class in different ways by parts of your program, you will probably have to subclass.

    - Some classes are intended to be subclassed. Some classes are partially abstract
    and require that you subclass to make them fully functional. An example is UIView.
    In order to custom drawing or respond to gestures, you must subclass.

    - Composition. You can also extend a class by composition. Using composition (which
    is a design pattern rather than a language feature), you create an entirely new
    class and hold an instance of the class you are extending in one of the new class''s
    instances. Messages that can be handled by the original class are passed to it
    by the enclosing class. Messages that invoke new functionality are handled by
    the enclosing class.


    This is a long list, but all the items are really variants of the same idea: Think
    before you code.


    # Other Uses for Categories


    Categories have a number of other uses:


    +   - A large class might have several hundreds of methods and thousands of lines
    of code to implement (To see an extreme example, look at the header file for the
    AppKit class NSWindow./System/Library/Frameworks/AppKit/Headers/NSWindow.h). You
    can use categories to break such a class into several, more-sized pieces. The
    instance variables and basic methods in the normal interface and implementation
    files are broken into sensible groups in a series of category files. This allows
    more than one programmer to work on the class simultaneously.

    - Categories can also be used to control which of a class''s methods are publicly
    visible to users of the class. To do this, you divide the class''s methods into
    public and'
