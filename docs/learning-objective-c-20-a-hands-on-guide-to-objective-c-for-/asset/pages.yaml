  md: '# 14


    # Reference Counting


    People who live in apartments often face a storage problem:They have more stuff
    than places to put stuff. Solving this problem requires shuffling possessions
    in and out of basement lockers and periodically going through the apartment and
    throwing out things that are longer needed. Managing memory usage is the computer
    science equivalent of the apartment-dweller''s problem.


    Memory management is important because memory is a limited resource. Although
    it is true that current programs can have amounts of physical memory that would
    have seemed like an intoxicated dream only a few years ago, the average program''s
    memory requirements and the users'' expectations have also increased. Keeping
    a program''s memory footprint as small as possible improves its performance by
    reducing the chances that the computer''s virtual memory system will have to swap
    part of the program out to disk and then later read it back from the disk. It
    also improves the overall performance of the system by reducing contention for
    memory among all the running.


    Memory management is important on Mac OS X; it is critical on iOS. iOS has virtual
    memory (every process has its own address space), but it does not have a paging
    system. (Read-only pages of memory as program text may be swapped out, but there
    is no paging for writable areas of memory). In addition, the amount of physical
    memory on many iOS devices is severely constrained. Early versions of the iPhone
    and iPod touch have 128 MB of RAM. (The iPhone 3GS has 256 MB.) The OS and any
    programs running in the background use much of this allotment. The amount of RAM
    available for your program drops below a threshold, the OS sends a low memory
    warning. When the remaining amount of unused memory drops below 40 MB or less.
    It is expected that your app will respond to such a warning by releasing much
    memory as it can. If you ignore the warning and the low memory condition persists,
    the OS will terminate your app.


    In Objective-C terms, memory management means tracking objects that have been
    created and freeing them when they are no longer needed. Objective-C 2.0 provides
    two alternate systems for memory management: reference counting (also called retain
    counting-or managed memory), and automatic garbage collection. Using retain counted
    memory, each object keeps a count of the number of other objects that you are
    using. When that'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'count drops to zero, the object is deallocated. Using garbage collection, a
    separate thread, called the garbage collector, wakes up periodically, examines
    the program’s memory, and frees any objects that are no longer needed. An Objective-C
    program running on OS X must use either reference counting or garbage collection;
    you cannot mix the two systems in a single program. Programs written for iOS must
    use reference counting. Garbage collection is not supported on iOS.

    This chapter covers reference counting. In it, you will learn how reference counting
    works, some more advanced aspects of reference counting, such as autorelease pools,
    the rules you must follow to keep retain counts correct, and about some problems,
    as retain cycles, that can occur when you use reference counting. The next chapter
    is devoted to the treatment of Objective-C 2.0’s automatic garbage collection
    system.


    # The Problem


    All Objective-C objects are dynamically allocated; their bytes come from the heap.
    If you try to create an object on the stack by declaring an instance variable
    that holds an object instead of a pointer to an object:


    ```

    NSString NSString;

    ```


    the compiler reprimands you and refuses to compile the file:


    ```

    error: statically allocated instance of Objective-C class ''NSString''

    ```


    The proper way to create an object is to declare a pointer variable and use the
    method to allocate memory for your object on the heap. The following line creates
    an nstring:


    ```

    NSString *aString = [[NSString alloc] initWithString:@"Hi!"];

    ```


    After you’ve created objects and used them, the question arises: How do you return
    them when you’re finished? The Golden Rule of memory management is “When you’re
    finished with something that you allocated, you have to give the bytes back to
    the heap.” One possibility would be for Objective-C to provide a method that,
    when called, would just free the bytes for an object:


    ```

    [aString freeObject];

    ```


    However, this is not a very satisfactory solution. You need to keep track of every
    place, in the program, and call the freeObject method when you are sure you are
    finished with that object. This is clearly impractical for any program that might
    anything other than a trivial program. It would be impractical for a program that
    might contain hundreds of objects, which are used in hundreds of files worked
    by a team of programmers.


    To avoid this, Objective-C uses a system called reference counting. Reference
    counting is currently the default memory management system. If you want to use
    garbage collection, you must explicitly enable it in your project, as explained
    in the next chapter.'
