  md: '# 32- and 64-Bit


    For the past several years, Apple has been moving into 64-bit computing. Mac OS
    Tiger (v 10.4) can run 64-bit command line programs, Mac OS X Leopard (v 10.5)
    can run GUI-based (AppKit) programs, and Mac OS X Snow Leopard (v 10.6) can both
    run GUI-based 64-bit programs and boot a 64-bit kernel on some recent Macs.


    +   Note

    The earliest Intel Macs (with Core Duo or Core Solo processors) are 32-only. iOS


    “32-bit” and “64-bit” refer to number of bits used to address memory. A 32-bit
    program uses pointers that are 4 bytes and can address 2³² or about 4 gigabytes
    (GB) of memory. A 64-bit program can theoretically address 2⁶⁴, or about 1.8 ×
    10⁹ bytes of memory. In practice, Intel Macs only use 47 of the bits in an 8-byte
    pointer for addressing, giving a maximum address of about 140 terabytes. A terabyte
    is about 10¹² bytes.


    What is the point of such numbers? As computers have become faster, people in
    some disciplines have been to write programs with very large data sets, large
    enough to run into the 4 GB limit on addresses. On the hardware side, physical
    memory above 4 GB has become much more common (Apple now sells laptops up to 8
    GB of physical memory and desktops up to 32 GB of physical memory). There is clear
    pressure to expand the size of addressable memory beyond 4 GB. Computer architecture
    works best with sizes that are powers of two, so the next logical pointer size
    after 4 bytes is 8.


    +   Note

    When thinking about this subject, remember that Mac OS X has a swap system and
    each process has its own virtual address space. A process does not need to be
    loaded completely into physical memory in order to execute; the swap system takes
    care of moving pages between physical memory and the swap area on disk. A process
    that 2 GB of memory will run on a machine that has 1 GB of physical memory, albeit
    much more slowly than it would run on a machine with 4 GB of physical memory (assuming
    that the 4 GB memory isn''t running other large programs the same time).'
  merge: -1
