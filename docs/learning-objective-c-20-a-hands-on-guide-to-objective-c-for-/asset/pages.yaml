    Historically, Objective-C programmers have been fairly lax about using these directives
    (although this is slowly changing). Most programmers seem to go with the default
    @protected (the upcoming section Security). However, if you find yourself using
    a class that has instance variables marked @private, you should take the hint
    and not access instance variables directly or try to modify them in a category
    or subclass. (You would have to subvert the @private directive with a category
    to access private instance variables in another). The original programmer is telling
    you that instance variables are not part of the class''s public interface and
    may be subject to change in a future version of the class.


    # Access Control for Methods


    There are none. Objective-C has no notion of a private, protected, and public
    methods. If you know the name of a method, you can try to use it to message your
    object. If the compiler thinks (by looking at the method declarations in the current
    scope) the object won''t respond to the message, you get a warning. But the ultimate
    test is at run time: If the object can respond to the message, otherwise the object
    further forwards the message (if the designer of the class has arranged for that)
    or raises an exception.


    You can prevent users of a class from calling methods that you consider private
    by putting their declarations in extensions or private category files. But, in
    the end, this approach functions like the lock on your front door. It keeps the
    people honest, but if someone is determined to call one of your "private" methods,
    there is nothing you can do to stop him or her.


    # Namespaces


    Objective-C doesn''t have namespaces at present. Namespaces in other languages
    are used to prevent name collisions between objects defined in different libraries.
    (Libraries in Objective-C are called frameworks; see Chapter 8, "Frameworks.")
    If you try to link against two frameworks that both define a class Button, you
    will have problems. Most Objective-C solve this on an ad hoc basis by prepending
    two or three letters to the beginning of all the classes in the framework. The
    Cocoa frameworks use NS (for Ne, of course); the button class in the AppKit framework,
    for example, is named UIButton.'
