  md: '# Returning Objects


    There is one situation where reference counting doesn''t work quite as smoothly
    as you might like. Imagine that the Guitar class has a class method that returns
    instances of Guitar:


    ```

    @interface Guitar : NSObject

    {

    // Instance variables

    }

    ```


    + (Guitar*) guitar;


    ```

    // Other methods

    @end

    ```


    This type of method is called a convenience constructor. Convenience constructors
    are very common in the Cocoa frameworks.Your first impulse might be to code the
    guitar method like this:


    +   + (Guitar*) guitar

    {

    Guitar *newGuitar = [[Guitar alloc] init];

    return newGuitar;

    }


    The preceding code creates and returns a properly initialized Guitar instance,
    but it has a memory management problem: It creates a Guitar object with alloc,
    but it never balances the alloc with a release. As stands, the guitar method leaks
    the newly allocated object.


    > Note

    You might argue that the code that invokes the guitar method and accepts the returned
    object should be responsible for releasing the object. But that doesn''t follow
    the rules. guitar doesn''t begin with "alloc" or "new", or contain "copy", so
    the invoker does not own the returned object. If the invoking code takes ownership
    of the returned object by sending the object a retain message, it would have to
    eventually balance with a release. But that release does not balance the alloc
    in the guitar method.


    A quick attempt at a repair does not work:


    +   + (Guitar*) guitar

    {

    Guitar *newGuitar = [[Guitar alloc] init];

    [newGuitar release]; // WRONG!

    return newGuitar;

    }'
