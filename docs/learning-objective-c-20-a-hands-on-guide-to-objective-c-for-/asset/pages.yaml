  md: '# Returning Objects


    The preceding code balances the alloc with a release, but it creates a much bigger
    problem. The release drops newGuitar retain count to zero, causing it to be immediately
    deallocated.What is returned is a pointer to a now non-existent object. The pointer
    causes a crash when it is referenced.


    Fixing this problem requires Objective-C’s autorelease mechanism, which is described
    in the next section.


    # Autorelease


    The problem a convenience constructor, or a similar method, faces is that it creates
    an object, but it has no way to track object and no way to balance the object’s
    creation by sending it a release message at an appropriate time.


    Objective-C solves this problem with the autorelease mechanism. Autorelease is
    a way of handing an object to a trusted third party, an object called autorelease
    pool, for release at a future time. The name autorelease is a bit of misnomer;
    it should really be called delayedrelease.


    # Autorelease Pools


    Autorelease is implemented using the Foundation class AutoreleasePool. To use
    autorelease, you create an instance of NSAutoreleasePool:


    ```

    NSAutoreleasePool* pool = [[NSAutoreleasePool alloc] init];

    ```


    The preceding line code allocates pool and informs the runtime that the pool is
    the current autorelease message, the object is placed in the current autorelease
    pool. When you send an object autorelease pool:


    ```

    [object autorelease]; // Places anobject in the current pool

    ```


    The autorelease method returns the receiver as its return value. This allows an
    autorelease message to be nested with other messages or used as an argument of
    a return statement:


    ```

    SomeClass *autoreleasedObject =

    [[SomeClass alloc] init] autorelease];

    ```


    In the preceding code, the object created by [[Class alloc] init] is sent an autorelease
    message. The return value of the autorelease message is the original object, which
    is stored in the variable autoreleasedObject.


    Sending an object autorelease message is just a form of registration. It adds
    the object to the pool’s list of objects, but it does not cause any message to
    be sent to the object. After the autorelease pool is executed, the receiver is
    fully alive and valid.


    Sending an autorelease pool a release message deallocates the pool and sends every
    object in the pool a release message:


    ```

    [pool release];

    ```'
