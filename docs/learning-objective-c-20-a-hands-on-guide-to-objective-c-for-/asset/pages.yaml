  md: "# Note\n\nIn the world of Objective-C, reference counting, retain counting,\
    \ and managed memory refer to the same memory management system. They are different\
    \ names for the same thing.\n\n# Memory Leaks\n\nMemory leak occurs when a program\
    \ allocates memory from the heap and then does not return memory to the heap when\
    \ the program is finished with it. Leaks waste a scarce system resource. The leaked\
    \ bytes are not used for their original purpose, but because they have not been\
    \ returned to the heap, they are not available for any other use.\n\nA leak causes\
    \ the memory footprint of a program to be bigger than it should be, with adverse\
    \ implications for performance. The effects of a leak can range from insignificant,\
    \ if the loss is just a few bytes here, to running the system out of memory and\
    \ crashing the program, if the leak is inside a loop or the program executes for\
    \ an extended period of time.\n\n# Reference Counting\n\nReference counting is\
    \ very simple in principle. Each object stores a count, called the reference count\
    \ or retain count, of the other objects that are using. When an object's retain\
    \ count becomes zero, the object is deallocated and its bytes are returned to\
    \ the heap for possible reuse. The trick of using reference counting is making\
    \ sure that you keep the retain count correctly. This requires some work on your\
    \ part. Reference counting is not an automatic system.\n\nWhen you create an object\
    \ using alloc, its retain count is one. When you no need the object, you indicate\
    \ that you are finished with it by sending the object message:\n\n```\n[anObject\
    \ release]\n```\n\nThe release message subtracts one from the object's retain\
    \ count. If the new retain count is zero, the memory is returned to the heap.This\
    \ point is worth repeating:A release message does not deallocate the receiver;\
    \ it decrements the retain count. As you will see in the next section, there are\
    \ situations where an object's retain count is higher than one. The object is\
    \ recycled to the heap only if the release message causes the retain count to\
    \ fall to zero.\n\nThe following code shows the simplest reference counting pattern:\n\
    \n```\n1-(void) simpleMethod\n{\n  NSMutableArray* anArray = [[NSMutableArray\
    \ alloc] init];\n  // Code that uses anArray here\n```"
  merge: -1
