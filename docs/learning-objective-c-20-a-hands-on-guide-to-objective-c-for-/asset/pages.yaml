    \ ...\n\n```\nNSMutableArray *displayList = ... // Array of graphic objects to\
    \ draw\nGraphicObject *graphicObject;\n\nNSEnumerator *enumerator = [displayList\
    \ objectEnumerator];\n\nwhile (graphicObject = [enumerator nextObject]) {\n  \
    \  [graphicObject draw];\n}\n```\n\nThe truth value of the assignment expression\
    \ (note the sign =) in the parentheses is the value of graphicObject. Each time\
    \ through the loop, the return value of nextObject is assigned to graphicObject\
    \ and then tested to see if it evaluates to true or false. If nextObject returns\
    \ an object, graphicObject is non-nil value that counts as true. The body of the\
    \ loop is executed. When the collection is exhausted, nextObject returns nil.\
    \ The value of graphicObject is false (remember, nil is just an alias for nil)\
    \ and the loop ends.\n\nAt this point, the enumerator is depleted. If you want\
    \ to loop over the collection again, you must obtain a fresh NSEnumerator object\
    \ before beginning the second loop:\n\n```\nmyEnumerator = [displayList objectEnumerator];\n\
    ```\n\nThe enumerator for arrays enumerates the array's objects in order. The\
    \ order of enumeration for sets and dictionaries is unspecified. Some collection\
    \ classes also have specialized enumerators: reverseObjectEnumerator which goes\
