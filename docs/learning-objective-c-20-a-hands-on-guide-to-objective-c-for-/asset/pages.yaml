  md: '# Common Foundation Classes


    Objective-C is a very compact language. Much of Objective-C''s power resides in
    its associated class libraries, called frameworks. The previous chapter covered
    the general topic of frameworks. In this chapter, we''ll look at several of the
    classes in the Foundation framework.


    The Foundation framework provides classes for basic entities such as strings,
    arrays, dictionaries, and number objects. Although it is possible to write an
    Objective-C program that does not use classes from the Foundation framework, using
    Foundation classes rather than creating your own equivalent classes results in
    shorter development time and fewer bugs.


    This chapter begins with some general information about Foundation classes that
    have both mutable and immutable versions, and that are implemented as class clusters.
    This continues with overviews of some of the most widely Foundation classes: NSString,
    NSArray, NSDictionary, NSSet, NSDictionary, and their mutable classes: NSNull,
    NSNumber, and NSURL. The chapter concludes with a look at some non-object structures
    that the Foundation defines: NSRange, NSPoint, NSSize, and NSRect.


    > Note

    You can find a complete list of Foundation classes and their documentation at:
    http://developer.apple.com/mac/library/documentation/Cocoa/Reference/Foundation/ObjC_class.


    # Immutable and Mutable Classes


    The Foundation classes are containers for other Objective-C objects, characters,
    or for bytes in two flavors: immutable and mutable. The basic classes are immutable.
    After you create an instance of an immutable class, you cannot change its contents.
    For example, if you create an instance of NSArray (which is immutable) and you
    want to add an object to the array, you must create a new array that contains
    the additional object and release the original array. The mutable container classes
    are all sub- of their corresponding immutable class.'
