    # Summary


    Objective-C classes are objects and have methods, called class methods. The key
    things to remember class objects and class methods are:


    +   - Class methods are indicated by a declaration that begins with a + rather
    than a -.


    +   - You use the name or pointer to the class object as the message receiver
    when you invoke a class method.


    +   - A pointer to the class object can be stored in a variable of type Class.


    +   - Class objects do not have instance variables, and they cannot use the instance
    variables or methods of an instance of the class.


    +   - The most common class method is alloc, which is a factory method that creates
    instances of the class.


    +   - The second most common use for class methods is for convenience constructors.
    Convenience constructors return initialized instances of the class.


    +   - The functionality of class variables can be duplicated using static variables,
    extra work is required to subclass a class that uses external variables.


