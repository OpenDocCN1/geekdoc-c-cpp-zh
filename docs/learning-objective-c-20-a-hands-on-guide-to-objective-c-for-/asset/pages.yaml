    Note that Xcode has created a trivial "Hello World" program for you. The NSLog
    statement in Line 7 prints out "Hello World."This is convenient if your only goal
    is to acquire a "Hello World" program, but it does not provide much of a learning
    experience. In the next section, you''ll create an object-oriented version of
    HelloC by removing the NSLog statement and replacing it with an object that issues
    greetings. Looking at the rest of the code:


    +   * Line 1: This line imports the headers for the classes in the Foundation
    framework. The Foundation contains classes for strings, arrays, and other necessities.
    To use any of these, you must import the corresponding header files, so most import
    them as a group, either shown here, or by importing Cocoa/Cocoa.h.

    * Line 3: This line begins the program''s main function (the lines between the
    curly brackets). Every Objective-C program requires a main function. When the
    program is started, the OS transfers control to the main function. The program
    begins executing statements in the main function body and continues until it reaches
    the statement at the bottom of the main function.

    The preceding line main indicates that it should return an integer.

    int argc and const char *argv[] are the arguments to main. argv (for argument
    variables) is an array of strings, argc (for argument count) is the number of
    elements in argv. The first element of argv, argv[0], is always present. It is
    the name of the program. If argc is greater than one, the remaining elements of
    argv are passed to the program from the command line.

    You don''t need this for most programs, but Xcode puts them in for you when it
    generates the files for a new application.

