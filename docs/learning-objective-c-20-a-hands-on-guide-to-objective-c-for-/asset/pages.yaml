  md: '# Copying Blocks


    One of the main uses of blocks is to pass a chunk of work (some code plus context)
    out of the current scope for processing at a later time. Passing a block to a
    function or method is safe (as long as function or method is executing on the
    same thread). But what happens if you want to pass a block to a different thread
    or pass a block out of the current scope as a return value? When the current function
    or method returns, its stack frame is destroyed. Any blocks that defined in its
    scope become invalid.


    To preserve a block, you must copy it. When you copy a block, the copy is created
    on the heap. The heap-based copy is safe to return up to the calling function
    or pass off to another thread.


    If you are coding in straight C, you can use the `block_copy()` function, as follows:

    int(`doubleCopy`)(int) = Block_copy(^int n){ return n * 2; });


    In Objective-C, you can send a copy message referring to the block:

    int(`doubleCopy`)(int) = (^int n){ return n * 2; } copy];


    The two preceding examples are equivalent. In either statement, you could use
    a pointer instead of the block.

    When you copy a block, the new block gets the copies of any automatic variables
    that the block references. (The block references automatic variables by value.
    The value of the variable is copied into the block object when it is created.)


    # What About Block Variables?


    Block variables are accessed by reference. It wouldn''t be useful to copy a block
    and then leave the copied block referring to a variable that is destroyed when
    the program execution leaves the current scope.

    To remedy this, when you copy a block, the compiler moves any automatic variables
    that the block references from the stack to a location on the heap. The compiler
    updates all blocks that reference the block variable so they have the variable''s
    address.


    One consequence of the block''s behavior in this situation is that it is a very
    bad idea to take the address of a block variable and use it for anything. After
    the copy operation, the original address refers to a memory location that may
    now be garbage.


    # Memory Management for Blocks


    If you copy a block with `Block_copy()`, you must eventually balance that call
    with a call to `Block_release()`. If you use the Objective-C copy message and
    are using reference counting, you must manage the copy with a `release` or an
    autorelease:'
