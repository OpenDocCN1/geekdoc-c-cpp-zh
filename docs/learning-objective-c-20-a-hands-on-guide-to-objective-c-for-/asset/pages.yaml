  md: "# Chapter 11. Categories, Extensions, and Security\n\nprivate.Put you class's\
    \ instance variables and the declarations for methods that you want to be public\
    \ in a normal header file.The methods that form the class's private API go in\
    \ a category file.\n\nYou then distribute only the public header file to potential\
    \ users of the class. But keep in mind that this is only an information hiding\
    \ scheme. If someone discovers the name of a private method by doing some snooping,\
    \ there is nothing that you can prevent them from doing.\n\n+   Finally, category\
    \ header files (without corresponding implementation files) (see Chapter 13, “Protocols”).You\
    \ use the category to tell the compiler that the methods in the protocol exist\
    \ and are implemented in classes that adapt the protocol.\n\n# Category Methods\
    \ Are First-Class Citizens\n\nMethods that are defined in a category have all\
    \ the rights and privileges of methods defined in the class interface. In fact,\
    \ at runtime, there is no difference between the two. They have full access to\
    \ any of the class's instance variables. They are inherited if the class is subclassed.\n\
    \n# Extensions\n\nSuppose you're writing a class that other programmers will use.\
    \ You'd like to have some methods that are for your internal use only. If you\
    \ declare the methods in your class's header file, they will be visible to anyone\
    \ using the class. Extensions let you declare methods—out of public view—by adding\
    \ an interface section in the class's implementation file (Extensions extend the\
    \ declaration into the .m file).\n\nA common use for extensions is to provide\
    \ an internal method for an instance variable that you want to be publicly read-only.\
    \ Listing 11.3 shows the header file for a class like that. The class declares\
    \ a getter for the instance variable readOnlyBool, but it does not declare a setter.\
