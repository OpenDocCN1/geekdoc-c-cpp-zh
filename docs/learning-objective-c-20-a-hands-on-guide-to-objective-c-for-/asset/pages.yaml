- img_proc: true
  md: '# Part I: Introduction to Objective-C


    The Foundation framework. The final section of the book covers the two forms of
    memory used in Objective-C, and Objective-C 2.0''s newly added Blocks feature.


    +   - Chapter 1,"C,The Foundation of Objective-C," is a high-speed introduction
    to the essentials of C. It covers the parts of C that are most likely to need
    when writing Objective-C programs.

    - Chapter 2,"More About Variables,"continues the review of C with a discussion
    of the memory layout of C and Objective-C programs, and the memory location and
    lifetime of different types of variables. Even if you know C, you may want to
    read through this chapter. Many practicing Programmers are not completely familiar
    with the material it contains.

    - Chapter 3,"An Introduction to Object-Oriented Programming,"begins with an introduction
    to the concepts of object-oriented programming and continues with a first look
    at how these concepts are embodied in Objective-C.

    - Chapter 4,"Your First Objective-C Program,"takes you line through a simple Objective-C
    program. It also shows you how to use Xcode to create a project, and then compile
    and run an Objective-C program. You can then use to do the exercises in the remainder
    of the book.


    # Part II: Language Basics


    Objects are the primary entities of object-oriented programming; they group variables,
    called instance variables, and function-like blocks of code, called methods, into
    a single entity. Classes are the specifications for an object. They list the instance
    variables and methods that make up a given type of object and provide the code
    that implements those methods. An object is more tangible; it is a region of memory,
    similar to a C struct, which holds the variables defined by the object''s class.
    A particular object is said to be an instance of the class that defines it.


    +   - Chapter 5,"Messaging,"begins the full cover of the Objective-C language.
    In Objective-C, you object to "do something" by sending it a message. The message
    is the name of a method plus any arguments that the method takes. In response
    to receiving the message, the object executes the corresponding method. This chapter
    covers methods, methods and how the Objective-C messaging system works.

    - Chapter 6,"Classes and Objects,"covers defining classes, and creating and copying
    object instances. It also covers, inheritance, the process of extending a class
    by defining an existing class, rather than starting from scratch.


    Each class in executing an Objective-C program is represented by a piece of memory
    that contains information about the class. This piece of memory is called the
    class''s object. Classes can also define class methods, which are methods executed
    on behalf of the class rather than an instance of the class.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# xxvi Preface


    +   - Chapter 7,"The Class Object," covers class objects and class methods. Unlike
    classes in some other object-oriented languages, Objective-C classes do not have
    class variables, variables that are shared by all instances of the class. The
    last sections of this chapter show how to obtain the effect of class variables
    by using static methods.


    +   - Chapter 8,"Frameworks," describes Apple’s way of encapsulating dynamic link
    libraries. It covers the definition and structure of a framework, and takes you
    on a brief descriptive tour of some common frameworks that you will encounter
    when writing OS X or iOS programs.


    +   - Chapter 9,"Foundation Classes," covers the most commonly used Foundation
    classes for strings, arrays, dictionaries, sets, and number objects.


    +   - Chapter 10,"Control Structures in Objective-C," discusses additional considerations
    when you use Objective-C constructs with C structures. It goes on to cover the
    additional control structures added by Objective-C, including Objective-C 2.0
    new Fast Enumer construct. The chapter ends with an explanation of Objective-C’s
    exception handling system.


    +   - Chapter 11,"Categories, Extensions, and Security," shows you how to add
    methods to an existing class without having to subclass it and how to hide the
    declarations of methods that you consider private. The chapter ends with a discussion
    of Objective-C security issues.


    +   - Chapter 12,"Properties," introduces Objective-C 2.0’s new declared properties
    feature. Properties are characteristics of an object. A property is usually modeled
    by one of the object’s instance variables. Methods that set or get a property
    are called accessor methods. Using the declared properties feature you can ask
    the compiler to synthesize a property’s accessor methods for you, saving yourself
    a considerable amount of effort.


    +   - Chapter 13,"Protocols," covers a different way to characterize objects.
    A protocol is a defined group of methods that a class can choose to implement.
    In many cases, what is important is not an object’s class, but whether the object’s
    class adopts a particular protocol by implementing the methods declared in the
