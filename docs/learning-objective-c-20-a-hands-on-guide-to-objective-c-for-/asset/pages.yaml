  md: '# The @property Statement


    # readwrite, readonly


    If a property is readwrite


    # nonatomic


    This is a little odd that there is no corresponding atomic keyword. Properties
    that are not declared nonatomic are atomic by default. When you specify nonatomic,
    the compiler synthesizes accessors without regard for thread safety.


    When accessing a property in a multithreaded program, it is possible for a thread
    to be interrupted by another thread before the setter or get is completed. If
    the second thread modifies the property during the interruption, the value returned
    or set in the first thread can be inconsistent or wrong. To prevent this, you
    can declare the property atomic (by omitting the nonatomic keyword). Then, the
    synthesized accessors will be atomic; a setter or a get will complete correctly
    without interference from another thread.


    For a non-object property or when using garbage collection, the getter is a simple
    return statement and the setter is a simple assignment that is always atomic.
    For object properties under reference counting, it is more difficult. The synthesized
    setter and getter locks to prevent another thread from interrupting the setter
    or get. In addition, the getter retains and then releases the object.


    > Note

    This behavior on the part of the getter prevents another thread from releasing
    the object, potentially causing its retain count to go to zero before your thread
    has a chance to use or retain it.


    The locks come at a cost in performance, if you are not writing multithreaded
    code, you should declare your properties nonatomic. Then, the synthesized accessors
    won''t locks. The getter simply returns the object, and the setters look like
    examples shown in Listings 12.5 and 12.6.


    # setter=name, getter=name


    Normally, the synthesized names for the property myWeb would be setMyProperty
    and myProperty for the setter and getter, respectively. setter-name and getter-name
    allow you to provide alternate names. The primary use for this is to allow the
    getter for a Boolean property, such as caffeinated, to be named isCaffeinated,
    as shown here:


    ```

    #property (nonatomic, getter=isCaffeinated) BOOL caffeinated;

    ```


    This improves the readability of your code.'
