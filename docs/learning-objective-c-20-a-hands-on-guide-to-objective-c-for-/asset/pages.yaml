    # Runtime Changes for Objective-C 2.0


    There are major changes in implementation of runtime for Objective-C 2.0. One
    of the main changes is the structures representing the runtime information for
    classes and methods that were defined in earlier versions of Objective-C have
    been replaced with opaque types and a set of functions to manipulate these types.
    This is essentially a primitive object system in itself, implemented directly
    in C. Functionally, it works as it did before, you can no longer peek inside or
    directly with the structures.


    # Message Forwarding


    What happens if obj_msgSend gets to the top of the object hierarchy without finding
    a method implementation that corresponds to the selector in the message? If happens,
    obj_msgSend calls the forwardInvocation: method of NSObject with NSInvocation
    argument (see the sidebar NSInvocation) formed from the original message expression.
    NSObject''s implementation of forwardInvocation invokes the doesNotRecognizeSelector:


    The NSObject''s implementation of doesNotRecognizeSelector: raises an exception
    and logs an error, and then your program crashes.


    But it doesn''t have a way. You can override forwardInvocation and use the information
    contained in the invocation to send the message to a different object, one that
    can handle the message properly. This is called forwarding. Forwarding can be
    used, for example, to borrow behavior from a different object. The original object
    handles some other messages but are passed to the helper object.


