  md: '# Chapter 1 C, The Foundation of Objective-C


    Note


    The standard I/O library is one of a set of libraries of functions that is provided
    with every C environment.


    To use the functions in the standard I/O library, you must include the library''s
    header file in your program:


    ```

    #include <stdio.h>

    ```


    The only function covered here is printf, which prints a formatted string to print
    your terminal window (or to the console window if you are using Xcode). The printf
    takes a variable number of arguments. The first argument to printf is a format
    string. Any remaining arguments are that printed out in a manner specified by
    the format string:


    ```

    printf(formatString, argument1, argument2, ... argumentN );

    ```


    The format string consists of ordinary characters and conversion specifiers:


    +   - Ordinary characters (not %) in the control string remain unchanged to the
    output.

    - Conversion specifiers begin with a percent sign (%). The letter following the
    % indicates the type of argument specifier expects.

    - Each conversion consumes, in order, one of the arguments following the format
    string. The argument is converted to characters that represent the value of the
    argument and the characters are sent to the output.


    The only conversion specifiers used in this book are %d, for char and int, %f
    for float and double, and %s for C strings. C strings are typed as char*.


    Here is a simple example:


    ```

    int myInt = 9;

    float myFunction = 3.145926;

    char* myString = "a C string";

    ```


    ```

    printf("This is an Integer: %d, a float: %f, and a string: %s.\n",

    myInt, myFunction, myString);

    ```


    Note


    The \n is the newline character. It advances the output so that any subsequent
    output appears on the next line.


    The result of the preceding example is:


    This is an Integer: 9, a float: 3.145926, and a string: a C string.


    If the number of arguments following the format string doesn''t match the number
    of conversion specifications, printf ignores the excess arguments or prints garbage
    for the excess specifications.'
