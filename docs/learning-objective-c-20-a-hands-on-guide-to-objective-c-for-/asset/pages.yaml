  md: '# Praise for Learning Objective-C 2.0


    With Learning Objective-C 2.0,Robert Clair cuts right to the chase and provides
    not only comprehensive coverage of Objective-C, but also time-saving and headache-preventing
    insights from a depth of real world, hands-on experience. The combination of concise
    overview, examples, and specific implementation details allows for rapid, complete,
    and well-rounded understanding of the language and its core features and concepts.

    —Scott D. Yelich, Mobile Application Developer


    There are a number of books on Objective-C that attempt to cover the entire gamut
    of object-oriented programming, the Objective-C computer language, and application
    development on Apple platforms. Such a range of topics is far too ambitious to
    be covered thoroughly in a single volume of finite size. Bob Clair’s book is focused
    on mastering the basics of Objective-C, which will allow a competent programmer
    to begin writing Objective-C code.

    —Joseph E. Sacco, Ph.D.,J.E. Sacco & Associates, Inc.


    Bob Clair s Learning Objective-C 2.0 is a masterfully crafted text that provides
    in-depth and interesting insight into the Objective-C language, enlightening new
    programmers and seasoned pros alike. When programmers new to the language ask
    where they should start, this is the book I now refer to them.

    —Matt Long, Cocoa Is My Friend (www.cinfmt.com)


    Robert Clair has taken the Objective-C and presented it in a way that makes it
    easier to learn. Whether you''re a novice or professional programmer, you can
    pick up this book and begin to follow along without knowing C as a prerequisite.

    —Cory Bohon, Indie Developer and Blogger for Mac|Life


    I like this book because it is technical without being dry, and readable without
    being fluffy.\n—Andy Lee, Author of AppKiDo'
