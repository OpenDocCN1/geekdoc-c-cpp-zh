    of this Objective-C''s messaging system. The section of code that a program executes
    when it evaluates a message expression (the equivalent of a method call in other
    languages) is determined at run time.


    Postponing decisions until run time has many advantages, as you will see as you
    read this book, but it has one important drawback. It limits the amount of checking
    that the compiler can do. In Objective-C, some errors, which would be caught at
    the compile stage in other languages, only become apparent at run time.


    # About Memory Management


    As noted, Objective-C 2.0 offers you the choice between using a manual reference
    counting system or automatic garbage collection for managing memory. With the
    exception of Chapter 15, which Objective-C 2.0''s garbage collection system, this
    book uses reference counting from the beginning in all of its examples. It provides
    a complete treatment of reference counting in Chapter 14.


    The primary reason for this is that garbage collection is not available on iOS.
    If you want to write programs for the iPhone, the iPod touch, or the iPad, you
    must learn Objective-C''s reference counting system.


    Judging from the contents of various Objective-C and Cocoa naming lists, reference
    counting is probably the single greatest source of confusion among people learning
    Objective-C. But if you learn its rules early and apply them uniformly, you will
    discover that reference counting isn''t really difficult.


    If, at a later time, you want to use garbage collection for a project, the transition
    should be relatively painless. Although there are some architectural issues that
    you need to be aware of moving from reference counting to garbage collection (which
    are covered in Chapter 15), much of using garbage collection simply consists of
    not doing things that you have to do when using reference counting.


