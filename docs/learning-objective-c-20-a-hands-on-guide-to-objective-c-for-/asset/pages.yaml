  md: '278 Chapter 14 Reference Counting


    Some points about autorelease:


    +   - Sending an autorelease message to an object that you own fulfils your contract
    to eventually relinquish ownership of that object. An autorelease is a release;
    it''s just one in the future.

    - It is possible to send an object multiple autorelease messages. When the autorelease
    pool is released, such an object receives multiple release messages; for each
    time it was autoreleased.

    - Releasing an autorelease pool does not necessarily mean that all the objects
    in the pool are deallocated. The objects in the pool are each sent a release message.
    If that release message causes an object''s retain count to go to zero, object
    is deallocated.


    # Managing Autorelease Pools


    The runtime maintains a stack of autorelease pools. Creating a pool pushes it
    onto the stack; releasing the pool pops off the stack. Objects receiving an autorelease
    message are placed in the pool that is on the top of the stack.


    > Note

    You cannot retain an autorelease pool. You can only create and release autorelease
    pools. Sending a message to an autorelease pool raises an exception.


    Calling autorelease on an object with no pool on the stack is a mistake. The runtime
    will complain to you, because the lack of an autorelease pool causes a memory
    leak, but the program will continue executing. A message like the following is
    written to the console log or to the Terminal window if it is a command line application:


    ```

    autoreleaseNoPool: Object 0x10000150 of class Guitar

    autorelease with no pool in place - just leaking

    ```


    If you are writing a GUI, the AppKit or UIKit creates autorelease pools for your
    GUI. The event loop waits for user interaction (a mouse click or a keystroke,
    for example), packages information about the interaction as an event object, and
    distributes the event object to other parts of the program. The loop returns to
    the top and waits for the next interaction. The AppKit (or UIKit on the iPhone)
    creates an autorelease pool at the beginning of each event loop (which pushes
    the pool onto the stack), and releases the pool (which pops it off the stack and
    sends a release message to all the objects in the pool) at the end of the pass.
    Figure 14.2 shows the lifecycle of an object created and then autoreleased during
    one pass through the event loop. The object''s life can be extended if another
    object retains it before the bottom of the event loop.'
