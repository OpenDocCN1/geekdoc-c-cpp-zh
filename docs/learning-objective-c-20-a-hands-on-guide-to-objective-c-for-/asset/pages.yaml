  md: "# Messaging nil\n\nObjective-C is designed so that sending a message to a nil\
    \ receiver has no effect. When a message expression with a nil receiver is evaluated,\
    \ no method is executed. Silently ignoring a nil receiver instead of raising an\
    \ exception or crashing allows you to write cleaner code. Instead of protecting\
    \ yourself by cluttering your code with constructions like this:\n\n```\nShape\
    \ *aShape = ...\n\nif ( aShape!= nil) {\n    aShape draw];\n}\n```\n\nyou can\
    \ simply write:\n[aShape draw];\n\nIf Shape happens to be nil, nothing is drawn\
    \ and execution continues with the next line of code.\nThe return value of a message\
    \ sent to nil is 0 if the return type of the method in the message expression\
    \ is a pointer or a numeric type. For other return types (structures, example),\
    \ the rules are complicated and the return value is undefined in some cases.\n\
    There might be places where you would prefer a nil receiver to raise an exception,\
    \ but in most situations, avoiding the guard statement results cleaner code. If\
    \ trapping a nil receiver is important in a particular situation, you can always\
    \ test for it explicitly.\n\n# Why Isn't the Method Being Executed?\n\nIf you\
    \ are having a problem with a method that is not being executed—you’re sure it\
    \ should be executed, but the program skips over the method—check the receiver.\
    \ It is probably nil at the point of execution. This can be a puzzling consequence\
    \ of forgetting to initialize a variable somewhere in your code.\n\n# Sending\
    \ Messages to self\n\nIf you want to invoke one object's methods from within another\
    \ method of the same object, you must use the variable self as the message receiver.\
    \ self is a hidden variable that the compiler passes to your method implementation.\
    \ A pointer to the object that was the receiver when the original method was invoked.\
    \ (self is not explicitly shown as an argument in the method signature, but it\
    \ is always available.)\n\n+   - (void) someMethod\n{\n    [self someOtherMethod];\
    \ // Different method in the same class\n}"
