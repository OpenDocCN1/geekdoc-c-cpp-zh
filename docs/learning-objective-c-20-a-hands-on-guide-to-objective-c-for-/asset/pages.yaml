    # # Function Pointers


    When the compiler encounters a function call


    The following line declares *myFunctionPtr* as a pointer to a function that takes
    two ints as arguments and returns an int:


    ```

    (*myFunctionPtr) (int, int);

    ```


    Figure 16.1 shows the anatomy of a function pointer.


    ![](img/76d4811a08eab8661f65c0f84232f696_344_0.png)


    Figure 16.1 The anatomy of a function pointer


    The general form of a function pointer is:


    ```

    return_type (*name)(list of argument types);

    ```


    Function pointers are a low point in C. Instead of reading left-to-right or right-to-left,
    they read from the inside out. More complicated function pointer declarations
    can quickly turn into puzzles, as you will see in Exercise 16.1.'
