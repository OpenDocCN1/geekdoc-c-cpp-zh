  md: '# Chapter 14 Reference Counting


    # Taking Ownership by Copying


    You can also take ownership of an object by copying it instead of retaining it.


    > Note

    You must make sure the object''s class supports copying before you attempt to
    copy it. A class that is capable of being copied must adopt the NSCopying protocol
    by implementing copyWithZone: or the MutableCopying protocol by implementing mutableCopyWithZone:


    Strictly speaking, when you take ownership by copying, you are taking ownership
    of the newly created copy, not the original object.

    Should you copy or retain when taking ownership? It depends on the design of your
    project and objects. If the object is mutable, there is the possibility that something
    else retain object might modify it. What you need for the current context is a
    snapshot of the way the object is now, you should copy it; otherwise, you should
    retain it. Copying is more expensive in execution time and memory than simply
    retaining, particularly if the object is complicated and has implemented a deep
    copy.


    > Note

    Some immutable classes implement copy as an additional retain and return the receiver
    instead of allocating a new object. For those classes, there is no difference
    between copy and retain.


    # dealloc


    When a release message drops an object''s retain count to zero, the object is
    deallocated. But what happens to the objects that the deallocated object stored
    in its instance variables? When a RockStar is deallocated, what happens to the
    Guitar object stored in its guitar instance variable? The Guitar object received
    a retain message when it was stored (see Listing 14.1). If the RockStar object
    just disappears, the Guitar object never gets a release message; it will be leaked.


    To prevent leaks, an object that stores objects in its instance variables must
    release objects in its dealloc method. For an example, RockStar overrides NSObject''s
    dealloc method with its own implementation:


    ```

    (void) dealloc

    {

    [guitar release];

    // Release any other objects held in instance variables.

    ...

    [super dealloc];

    ```'
  merge: -1
