    # Some Philosophical Reservations\n\nBlocks are very versatile and they are clearly\
    \ an important part of Apple's plans for the future of Objective-C and Mac OS\
    \ X. However, blocks come with a few issues that are worth a moment or two of\
    \ thought:\n\n+   - The \"block\" was already in use. It is used as interchangeable\
    \ with \"compound statement\" in almost every book in the C language. This might\
    \ cause confusion in some circumstances.\n\n+   - Blocks are function oriented\
    \ and not very object oriented. This may be an issue if you are strongly attached\
    \ to an ideal of object-oriented purity.\n\n+   - Blocks completely break encapsulation.\
    \ A block's access to variables that are not accessed through an argument list\
    \ or an accessor method presents many of the same issues using global variables.\n\
    \nUsing _block variable copying blocks can result in entangled objects:You can\
