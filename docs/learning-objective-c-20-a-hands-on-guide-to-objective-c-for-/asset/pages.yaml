    # Efficiency


    You are probably saying to yourself: "All this look-up business has to be much
    slower than a plain call." The runtime code goes to great lengths to make the
    method look up fast as possible, but it is still slower than a C function. However,
    this usually doesn''t make practical difference. In almost every case, the time
    required to execute the body of a method will dwarf the time to dispatch the message.
    There are cases where the dispatch overhead could be an issue. These are usually
    cases when you are doing something huge number of times in a tight loop. If you
    find one of these cases, you can use the NSObject methodForSelector to get a pointer
