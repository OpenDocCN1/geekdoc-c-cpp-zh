  md: '# Garbage Collection: The Practice


    The actual implementation of Objective-C''s garbage collector is more sophisticated
    than the simple mark and sweep garbage collector described in the previous section.
    It is an example of a generational garbage collector.


    In most programs, allocated objects are either temporary or they last for an extended
    duration. A generational collector guesses that the most recently allocated memory
    is most likely to be garbage, and examines that memory first.


    To do this, the garbage collector places a write barrier between the new generation
    and the older generations, as shown in Figure 15.3.


    ![](img/76d4811a08eab8661f65c0f84232f696_327_0.png)


    The write barrier notices when you assign a pointer to an object in the new generation,
    to an instance variable of an object in an older generation, and records the assignment
    by marking the older object. In Figure 15.3, when you store a pointer to Object
    J into Object G, the collector can then do a partial collection using the marked
    objects as a temporary root and tracing references into the new generation. When
    the partial collection is finished, objects in the new generation that are still
    alive are promoted to the older generation and the process starts again with an
    empty new generation. The partial collections are much faster than a full collection
    that must scan through all the memory under the collector''s control.


    > Note

    The term write barrier is slightly misleading. The write barrier doesn''t prevent
    you from making assignments. It only records pointer assignments that cross it.


    # Strong and Weak References


    Chapter 14 introduced the concept of strong and weak references. Under reference
    counting, an object forms a strong reference to another object by retaining it.'
