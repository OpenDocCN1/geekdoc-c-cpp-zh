  md: '# NSNumber


    One thing that may surprise newcomers to Objective-C (at least those who are not
    coming from Java) is that you can''t put a C numeric type directly into an Objective-C
    array, dictionary, or set. In fact, you can not use a regular C type (numeric
    or structure) or a pointer to a regular C type anywhere that requires an object.
    Basic C types are not objects.


    If you try to put a float in an NSArray:

    float x = 99.9;

    NSMutableArray* array = [NSMutableArray array];

    [array addObject: x];


    the code doesn''t compile:

    error: incompatible type for argument 1 of `addObject:`


    If you try to wrap the number with an int instead of a float:

    int n = 99;

    NSMutableArray* array = [NSMutableArray array];

    [array addObject: n];

    the code compiles with warning about confusing ints and pointers:


    warning: passing argument 1 of `addObject:` makes pointer from integer without
    a-cast


    But it crashes at runtime

    Segmentation fault


    To store a number in an Objective-C collection class or to use a number anywhere
    that requires an object, you must wrap the number in an instance of the NSNumber
    class:

    float a=99.9;

    NSNumber *floatAsObject = [NSNumber numberWithFloat:a];


    NSMutableArray* array = [NSMutableArray array];

    [array addObject: floatAsObject];

    NSLog("Array contains: %@", array);


    Running the above code produces this result:

    Array contains: (

    "99.9"

    )


    When you need the actual number back, the NSNumber returns it to you:

    float y;

    y = [floatAsObject floatValue]; // y now = 99.0'
