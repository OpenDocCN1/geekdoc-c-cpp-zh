  md: '# Summary


    This chapter has a lot of words about a very small program. If you''ve followed
    along and worked through HelloObjective-C using Xcode, you should now have the
    skills to build and run a non-GUI Objective-C program. You can put those skills
    to use by doing the exercises in the remainder of the book.


    This chapter includes Part I of the book: a review of C and an introduction to
    Objective-C. The next section is a more detailed treatment of the Objective-C
    language. It begins with Chapter 5, which covers method names and declarations,
    message expressions, and how the Objective-C messaging works.


    # Exercises


    +   1. Modify the HelloObjectClass program used as the example in this chapter:

    * Defining a Greeter class with NSString instance variables to hold the text of
    the greeting and a description of the greeting. (A sample description might say
    "This is the everyday greeting" or "This is the VIP greeting") Use methods to
    set and retrieve the text of the greeting and the description. Name the files
