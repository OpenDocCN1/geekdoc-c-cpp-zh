  md: '# Preface


    Objective-C is an object-oriented extension to C. You could call it "C with Objects."

    If you are reading this book, you are probably interested in learning Objective-C
    so that you can write applications for Mac OS or iOS. But Objective-C: It''s a
    fun language and one that is relatively easy to learn. Like anything else in the
    real world, Objective-C has some rough spots, but on it is a much simpler language
    than other object-oriented languages, particularly C++. The additions that Objective-C
    makes to C can be listed on a page or two.


    In the Apple world, Objective-C does not work alone. It is used in conjunction
    with two class libraries. The Foundation framework contains classes for basic
    entities, such as strings and arrays, and classes that wrap interactions with
    the operating system. The AppKit contains classes for windows, menus, buttons,
    and the assorted widgets needed to build graphical user interfaces. Together,
    the two frameworks are Cocoa. On iOS, a framework called UIKit replaces the AppKit.
    Foundation and UIKit are Cocoa Touch.


    Objective-C was initially created by Brad J. Cox in the early 1980s. NeXT Computer,
    the company started by Steve Jobs before he left Apple, licensed Objective-C and
    made it the basis of the development environment for creating applications to
    run under NeXT''s operating system. NeXT engineers developed a set of Objective-C
    libraries for use in building applications. NeXT withdrew from the hardware business
    in 1993, which worked with Soft Micros to create OpenStep, an open specification
    for an object-oriented system, based on the NeXTSTEP APIs. Since eventually lost
    interest in OpenStep, NeXT continued selling its version of OpenStep until NeXT
    was purchased by Apple in 1997. The NeXTSTEP operating system became the basis
    of Mac OS X.


    This book concentrates on the Objective-C language. It will not teach you how
    to write Cocoa programs or make you an expert Xcode. It covers and makes use of
    a small part of the Foundation framework, and mentions the AppKit and UIKit only
    in passing. The book''s premise is that you will have a much easier learning Cocoa
    if you first acquire a good understanding of the language on which Cocoa is based.


    # Who Should Read This Book


    This book is intended for programmers who want to learn Objective-C in order to
    write programs for Mac OS X or iOS (iOS is used for the iPhone, the iPod touch,
    and the iPad.) Although it is technically possible to write complete OS X using'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Preface


    other languages, writing a program that follows the Apple Human Interface Guidelines¹
    and has a proper Mac "look and feel" requires the use of the Objective-C Cocoa
    framework. Even if you write the core of a Mac application in a different language,
    such as C or C++, your user interface should be written in Objective-C. When writing
    for iOS, there is no choice: An iPhone app''s outer layer and user interface will
    be written in Objective-C.


    The book will be useful for programmers who want to write Objective-C programs
    for other platforms using software from the GNUStep project² an open source implementation
    of the OpenStep libraries.


    # What You Need to Know


    This book assumes a working knowledge of C. Objective-C is an extension of C;
    the book concentrates on what Objective-C adds to C. For those who are rusty and
    those who are adept at picking up a new language quickly, Chapters 2 and 3 form
    a review of the essential parts of C that you likely need to write an Objective-C
    program. If you have no experience with C or any C-like language (C++, Java, and
    C#), you will probably want to read a book on C in conjunction with this book.
    Previous exposure to an object-oriented language is helpful but not absolutely
    necessary. The required object-oriented concepts are introduced in the book proceeds.


    # New in Objective-C 2.0


    If you already know Objective-C and want to skip to the parts of the language
    that are new in the 2.0 version, they are covered in these chapters:


    +   - Fast Enumeration (Chapter 10) provides a simple (and fast) way to iterate
    over a collection of objects.

    - Declared properties (Chapter 12) provide an easy way to specify an object''s
    instance variables and to have the compiler methods to access those variables
    for you.

    - Garbage collection (Chapter 15) adds automatic memory management to Objective-C.

    - Blocks (Chapter 16) let you define function-like objects that carry their context
    with them.


    # How This Book Is Organized


    This book is organized into three sections: The first section is a review of C,
    followed by an introduction to object-oriented programming and Objective-C. The
    second section of the book covers the Objective-C language in detail, and provides
    an introduction to


    +   1. http://developer.apple.com/mac/library/documentation/UserExperience/Conceptual/AppleHIGuidelines

    2. www.gnustep.org'
  merge: -1
