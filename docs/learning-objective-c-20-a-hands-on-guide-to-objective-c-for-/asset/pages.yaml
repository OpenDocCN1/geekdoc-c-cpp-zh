    Finally, Line 14 stores the new NSString in greetingText.


    The order of Lines 12 and 13 is important. Releasing greetingText before retaining
    newText could cause a crash if both variables refer to the same object. The release
    message might decrement the retain count to zero and cause it to be deallocated.
    The subsequent retain message would be sent to an invalid receiver. You might
    think it unlikely someone would invoke greetingText: twice in a row with the same
    argument, but you have no guarantees that it won''t happen. It is best to code
    defensensively.


