  md: '# Other Class Methods


    The primary function of a class is to act as a factory object to create instances
    of the class. As we saw in the previous chapter, you create object instances by
    using the class method alloc. The next two sections cover areas where classes
    often define additional class methods. Convenience constructors and singletons
    are common patterns in the Cocoa frameworks and you may want to use them in some
    of your own classes.


    # Convenience Constructors


    Many of the Cocoa framework define convenience constructors, which combine allocation
    and initialization in a single method. The NSString class method string is a typical
    example. It returns an initialized, but empty string:


    ```

    NSString *emptyString = [NSString string];

    ```


    NSString provides a number of convenience constructors such as stringWithFormat:,
    stringWithWith:, and stringWithCharacters:length:. For a complete list, see http://developer.apple.com/library/documentation/Cocoa/Foundation/Classes/NSString_Class/Reference/NSString.html).
    When a class defines a number of different init... methods, it matches each init...
    with a convenience constructor that takes the same arguments.


    There is one very important thing to note when using convenience constructors
    with reference counting: You do not obtain an object returned by a convenience
    constructor. (The name of a convenience constructor does not contain "alloc" or
    "copy" or "new") If you want to use an object that you received from a convenience
    constructor beyond the current context (for example, storing it in an instance
    variable), you must take ownership of the object by retaining it. If you don''t
    take ownership, the object may disappear at some future time, leaving you with
    a pointer to a deallocated object.


    Consider the following example:


    ```

    NSArray *arrayOne = \

    [[NSArray alloc] initWithObjects:@"iPhone", @"iPod", nil];

    NSArray *arrayTwo = \

    [[NSArray initWithObjects:@"iphone", @"iPod", nil];

    ```


    You owe arrayOne you created with alloc. When you are finished with arrayOne,
    you must send it a release message to balance the alloc. In contrast, do not release
    arrayTwo you obtained from a convenience constructor. If you need arrayTwo to
    remain alive beyond the calling context, you need to send a retain message to
    myArrayTwo (and, of course, a balancing release when you are finished with it).


    # Creating a Convenience Constructor


    Imagine you have a class Dog. You can create a convenience constructor that returns
    an initialized instance of a Dog like this:'
