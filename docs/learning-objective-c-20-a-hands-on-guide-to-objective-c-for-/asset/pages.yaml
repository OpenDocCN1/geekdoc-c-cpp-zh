- img_proc: true
  md: '![](img/76d4811a08eab8661f65c0f84232f696_309_0.png)


    Figure 14.1 Deallocating an object


    The full deallocation sequence is shown in Figure 14.1.


    +   1. release is implemented in NSObject. If a release message results in a zero
    retain count, release invokes dealloc.

    2. Because RockStar overrides dealloc, it is RockStar’s implementation of dealloc
    that is executed.

    3. RockStar sends a release message to balance the retain guitar received when
    it was stored. If no other object has ownership of the object held in guitar,
    it is also deallocated. RockStar also sends release messages to any other objects
    holds in its instance variables.

    4. RockStar’s dealloc method uses super to invoke NSObject’s implementation of
    dealloc.

    5. NSObject’s implementation of dealloc calls the system library function free,
    which does the work of returning RockStar’s bytes to the heap.


    The [super dealloc] line is very important. If you forget it, NSObject’s implementation
    of dealloc is not executed, and the object’s bytes are leaked. It is also important
    that it be the last line in a dealloc method. When {super dealloc} returns, the
    object has been deallocated and is no longer valid.


    > Note

    You should not invoke dealloc directly. It is invoked for you automatically when
    an object’s retain count becomes zero.'
