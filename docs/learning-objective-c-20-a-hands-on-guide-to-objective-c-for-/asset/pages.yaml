    and what the property represents. If the property is meant to be a snapshot of
    the current state of an object that is mutable, you should copy it.

    If the object used to set a property is to model an entity itself rather than
    the entity''s current state, you should retain it. Imagine the business system
    has objects with properties (president, vicePresident, employeeOfMonth...) of
    type Employee. You don''t want to change the entire system to update all the copies
    of an employee if something (name, salary, ...) about the employee changes.

    Using retain (or assign if you need a weak reference) in this case ensures that
    instance variables that are meant to hold a given employee refer to the same instance
