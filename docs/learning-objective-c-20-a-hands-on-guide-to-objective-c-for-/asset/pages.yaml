  md: '# Chapter 2 More About C Variables


    problems with that: For the average case, you waste a lot of memory, and your
    program’s footprint will be unnecessarily large, which affects performance. It’s
    also an invitation to be bitten by Murphy’s Law—as soon as you hard-code the size,
    someone, somewhere will make an image file size bigger than expect your program
    to read it.


    The answer to this problem is to use dynamic allocation. Dynamic allocation allows
    you to request more memory at runtime, when your program is executing. When you
    need some storage, you ask the system for a block of memory.When you’re finished
    using the memory, you give it back. The bytes used for dynamic allocation are
    located in the region labeled Heap in 2.1.


    # Note


    Heap is the generic Unix term for this region. Mac OS X actually has a more complicated
    system. In OS X, this region is technically called a malloc zone (the sidebar,
    Malloc Zones). In most cases, the rest of the book will continue to use the generic
    term.


    Dynamic allocation is handled with two functions: malloc and free. You request
    memory by calling malloc with an argument that specifies the required number of
    bytes, malloc returns a pointer to a requested amount of bytes, which you then
    cast as a pointer to the required data type and assign to a variable that is typed
    as you wished.


    # Note


    Historically, malloc returns NULL when there was no more memory available to be
    allocated. Both OS X and IOS use lazy allocation. Using lazy allocation, malloc
    returns a pointer to the requested memory, but the system does not commit the
    memory resources until you execute a piece of code that accesses that memory.
    As a result, if you make multiple requests for memory and don''t free that memory,
    malloc may return a non-NULL value, even when there is no more memory available.
    In this situation, using the returned pointer may result in a crash. Given the
    typical values for RAM and swap space, you should rarely, if ever, see this happens
    on an OS X. IOS, an app will most likely receive a low memory warning from the
    system before encountering this.


    The allocation is written as follows:


    ```

    numBytesNeeded = imageHeight * imageWidth * sizeof (unsigned char);

    unsigned char*) pixels = malloc(numBytesNeeded);

    ```'
