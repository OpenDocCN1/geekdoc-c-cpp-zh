  md: '# Appendix D Runtimes, Old and New


    that it seems redundant to type NSString *greetingText twice, once in the instance
    variable declaration and in the property statement.


    The modern runtime eliminates this extra typing.You can omit the instance variable
    declaration between the curly brackets and the compiler will automatically create
    the instance variable for you, using the specification in the property statement:


    ```

    @interface Greeter : NSObject

    {

    }

    @property (nonatomic, retain) NSString *greetingText;

    ...

    end

    ```


    When @synthesize the property greetingText, the compiler creates both methods
    and the instance variable. Again, this only works with the modern runtime. If
    you try to compile the preceding code for the legacy runtime, you get the following


    error: synthesized property ''greetingText'' must either be the same as a compatible
    instance variable or explicitly name an instance variable


    # Synthesized Instance Variables and Mac OS Leopard (v10.5)


    There is one catch when using synthesized variables on Mac OS Leopard (v10.5).You
    cannot directly access a synthesized instance variable.The only way to access
    a synthesized instance variable is by using the synthesized accessor methods.
    This means you must use accessors even in init and dealloc methods:


    ```

    (void) dealloc

    {

    self.greetingText = nil;

    [super dealloc];

    }

    ```


    In the preceding code, the synthesized setter sends a release message to the object
    held in greetingText. It also retains in nil, but that is harmless. This restriction
    also means you cannot provide custom accessors for a synthesized instance variable.
    (You can''t write an accessor for an instance variable that you can''t access.)


    Fortunately, the problem has been eliminated in Mac OS Snow Leopard (v10.6). Code
    compiled for the modern runtime on 10.6 can access synthesized instance variables
    directly. This allows you to create custom accessors for synthesized instance
    variables to replace one or both of the created by the compiler in response to
    @synthesize directive. You can also set the synthesized instance variable directly
    in init and dealloc.'
