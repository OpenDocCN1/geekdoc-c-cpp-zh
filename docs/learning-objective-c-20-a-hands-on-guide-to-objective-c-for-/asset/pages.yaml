  md: '# Technical


    Absolutely-C is a superset of C. You can place a call to a C function anywhere
    that you can put a statement or in any expression (as long as the function returns
    a value of the appropriate type for the expression). You can also use an object
    pointer as an argument to a C function, message an object (one passed in as an
    argument or one created inside the function) in the body of the function, or use
    an object pointer as a return value.


    # Practical


    Sometimes, you may have to use C functions. If you are writing a Mac OS X or iPhone
    application, you may need to use Apple C languages for some tasks. A prime example
    is on the iPhone. At present, the iPhone UIKit provides very little in the way
    of drawing capabilities. To do any drawing beyond putting a bitmap on the screen,
    you will have to use the Graphics C API. Looking further out third-party C libraries
    that do assorted useful tasks. Because Objective-C interoperates with C, you can
    link and use these libraries if you do not have access to their source code.


    # Philosophical


    Now we are in dangerous territory. Some object-oriented programming practitioners
    are not entirely happy with using C functions. They feel you should shun straight
    C as much as possible. Not everyone agrees. A good way to start a long thread
    on an Objective-C mailing list is to ask a question like the following: “I have
    a mathematical routine that I need as a helper in my class. Should I just write
    it as a C function, the code in my implementation and then call the C function
    from my methods?” The hard-line OOP contingent would tell the question to wrap
    the C and make it one of the class''s methods.


    It is really a matter of taste (the code would work either way), but I have the
    opposite view. For me, one of the wonderful things about Objective-C is that it
    does not require everything to be handled in a strictly object-oriented fashion.
    At the risk of taking some flak, I would say, “Object-oriented programming is
    a methodology, not a religion.” It is extremely useful for a large number of tasks,
    but for some other methodologies more appropriate. Many mathematical calculations
    are inherently procedural and there isn''t really anything to gain by putting
    them in an Objective-C wrapper just to say they are “object-oriented.” If you
    need to write a mathematical function, go ahead and write it in C. If you need
    to use such a function in more than one place, put the source in a separate .c
    file (or .m file if it refers to Objective-C objects), and place the function
    declaration in a matching header file. You can then include the header file and
    use the function wherever required.'
