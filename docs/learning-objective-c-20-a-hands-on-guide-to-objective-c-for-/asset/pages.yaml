  md: '# @class Directive


    If you use a class, such as Band or Guitar, in an instance variable declaration
    or a method declaration, you must inform the compiler that the type is a class.
    If class''s interface is defined in any of the imported header files (a Cocoa
    framework header, the superclass header file, or any header file that they, in
    turn, import), you don''t have to do anything else. Otherwise, you need to use
    a @class directive directive.


    The Rockstar has instance variables of type Band and Guitar. RockStar.h doesn''t
    import Band.h or Guitar.h, so you need to put the following lines in the file:


    ```

    @class Band;

    @class Guitar;

    ```


    The @class directive, which must precede any use of the type being declared, is
    an example of a forward declaration. In this example, @class Band tells the compiler
    that Band is a class, and that something Band* is a pointer to a class, but it
    provides no other information about Band.


    Technically, in many cases, you could just import the relevant header file directly
    to make the type known to the compiler. But using a @class directive is a better
    design choice:


    +   Using a @class directive can cut down compile times by reducing dependencies.
    Suppose you import Band.h into Rockstar.h. If you then make a change to Band.h,
    you have to recompile all the files import Rockstar.h, as well as all the files
    that import Band.h If you use @class Band; instead, only the files that import
    Band.h need recompiling.


    +   Using a @class directive is required in some rare cases. Imagine that the
    Band class has a leadGuitarist instance variable that is typed as a Rockstar*:

    RockStar *leadGuitarist;


    You have a case where Rockstar.h needs to know that Band is a class and Band.h
    needs to know that Rockstar is a class. If you try to handle this by importing
    Band.h into Rockstar.h, and importing Rockstar.h into Band.h, the code will not
    compile. You must use a @class directive in at least one of the two header files.


    # The Implementation Section


    The implementation section contains the code that implements the class''s methods.
    The structure of an implementation section is very simple. It begins with a line
    containing an @implementation directive and the class name, and ends with an @end
    directive.You place all your method implementations between these two lines.


    Here is the Rockstar class''s implementation file:


    ```

    #import "Rockstar.h"

    #import "Guitar.h"

    ```'
