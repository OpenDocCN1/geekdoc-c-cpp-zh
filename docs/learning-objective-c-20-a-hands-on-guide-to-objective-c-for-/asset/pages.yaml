    # Synthesized Instance Variables and the iPhone


    The iPhone uses a 32-bit version of the modern runtime, so you can use synthesized
    instance variables on the iPhone. However, there is one odd problem. You can only
    do this when you compile your code for a device. The iPhone simulator runs on
    top of the legacy 32-bit desktop runtime. Synthesized instance variables won''t
    compile for the simulator.


    # The Fragile Base Class Problem—Solved


    Many object-oriented languages suffer from what is called the fragile base class
    problem. If you add methods or instance variables to a class, you must recompile
    all classes that derive from the changed class. This is probably of no consequence
    for classes that you create in your own application code. Good practice requires
    that you make a clean compile before you release your program. But it is a problem
    for framework providers. Imagine you had to recompile all of your programs every
    Apple wanted to change something in a Cocoa framework class. You (and everybody
    else) would also need fresh copies of all programs you didn''t create. People
    would be very unhappy.


    The root of the fragile base class problem is a static (determined at compile
    time) memory layout for instance variables and methods. Because of Objective-C''s
    dynamic method dispatch, it has never suffered from the method half of the fragile
    base class problem. You can always add methods to a class without requiring subclasses
    derived from it to be recompiled. You can even add methods to a class at runtime
    (see Chapter 11, “Categories, Extensions, and Security”).


    In the past, Objective-C used various tricks to get around the instance variable
    part of the problem. These are strategies like adding instance variables reserved
    “future use” when a class is first defined. This is the disadvantage that you
    don''t know what instance variables you need in the future. It also wastes memory
    as the “future use” instance variables are not used. Another way of handling the
    problem is to provide a single extra instance variable that is a pointer to an
    NSMutableDictionary. The dictionary can be used to store additional values without
    changing the class’s memory layout.


    The modern runtime solves the instance variable part of the problem without any
    tricks. Because of the way the modern runtime locates instance variables, synthesized
    instance variables can be added to a class without requiring you to recompile
    classes that are derived from it.'
