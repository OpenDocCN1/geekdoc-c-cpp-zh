  md: '# # 11 Categories, Extensions, and Security


    In Chapter 6,"Classes and Objects," you learned the basics of defining classes
    and allocating, initializing, and copying object instances. But there is more
    to life than simple object creation. This chapter shows you how to add a method
    to an existing class, how to hide the existence of methods from (at least some)
    trying, and how to limit access to an object''s instance variables. It also discusses
    Objective-C security (and the lack thereof).


    # ## Categories


    Categories let you add methods to an existing class without subclassing and without
    requiring access to the class''s source code. Using a category to extend the behavior
    of a class is a much lighter-weight procedure than subclassing.


    As an illustration, suppose you want to take a string like "FourAndSevenYearsAgo"
    and turn it into "FourAndSevenYearsAgo." A string like that, which each word in
    the original string is capitalized and then squashed together into a single block
    of characters (with no spaces), is called a CamelCase string. (It is named after
    the obvious analogy to camel humps.)


    > Note

    Objective-C class names that follow the usual convention are CamelCase. Objective-C
    method names are usually a variant of CamelCase where the first letter of the
    first word is uncapitalized.


    The first thing you should do is to look at the documentation for NSString and
    see if NSString already has a -nameSort method. Unfortunately, it doesn''t.'
