  md: '# Exceptions


    Exceptions are abnormal conditions that prevent a program from continuing with
    execution. Creating an exception is referred to as raising an exception or throwing
    an exception. Common situations that will raise an are actions like sending a
    message to an object that does not respond to that message, or attempting to retrieve
    an object from NSArray with an index that is outside the bounds of the array.
    If you do not anything to handle an exception, the exception causes the program
    to terminate.


    Objective-C provides a mechanism to handle exceptions with compiler directives
    @try, @catch, and @finally. Each of these directives introduces a block of code
    as shown in Listing 10.2.


    > Note

    Versions of Mac OS X prior to 10.3 does not support exceptions. If you do use
    them, your program will only run on Mac OS X 10.3 or later.


    # Listing 10.2 Exceptions/SimpleExceptionHandler.m


    ```

    1 hamburger = @"hamburger";n2

    3 @try

    4 {

    5     hamburger = [hamburger addCheese];

    6 }

    7 @catch(Exception *exc)

    8 {

    9     NSLog("Exception: %@ : %@", [exc name], [exc reason]);

    10 }

    11 @finally

    12 {

    13     NSLog("This block is always executed.");

    14 }

    ```


    The code that might cause a problem goes in the @try block. In Listing 10.2, executing
    the line:

    hamburg = [hamburger addCheese];


    raises an exception in this example hamburger is an NSString and NSString doesn''t
    implement the method addCheese.

    The @catch block catches the exception. Exceptions are always thrown with an exception
    object, which becomes the argument to the @catch block. The runtime and Cocoa
    frameworks use instances of the class Exception as exception objects. Here, the
    @catch block uses information from the Exception object to log the exception.'
