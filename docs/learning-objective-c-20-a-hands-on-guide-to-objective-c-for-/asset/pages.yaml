  md: '# The @property Statement


    The form of a property declaration is:


    @property ( attributes ) type name;

    type and name are self-explanatory. attributes describe how the accessors are
    coded, and are described in those sections follow.


    # assign, retain, copy


    These attributes affect how the setter is constructed. If you use assign, the
    setter simply assigns the new value to your property:

    Property = newValue;


    The assign attribute is the only choice allowed for a non-object property.

    For an object under reference counting, assign creates a weak reference (see Chapter
    14, "Reference Counting\).

    If you use retain and ask the compiler to @synthesize your access, it creates
    a setter equal to the one shown in List 12.5 earlier in the chapter. Under garbage
    collection (see Chapter 15, "Garbage Collection\), retain is the same as assign
    and you don''t need to use it unless you are writing framework code that must
    work under both reference counting and garbage collection.

