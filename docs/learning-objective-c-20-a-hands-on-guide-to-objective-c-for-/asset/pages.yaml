    \ sent until the autorelease is released at a future time.\n\n# Autorelease and\
    \ the iPhone\n\nIf you are writing an iPhone application, you should avoid using\
    \ autorelease for large objects. Sitting in an autorelease pool could contribute\
    \ to a situation where your program's memory footprint can receive a low memory\
    \ warning. Instead of using a class's convenience constructors (which generally\
    \ return autoreleased objects), you should allocate large objects directly with\
    \ alloc and release them as soon as you are finished with them.\n\n# Using Extra\
