  md: "# Chapter 7 The Class Object\n\n```\n+ (id) dog\n{\n  return [[Dog alloc init]\
    \ autorelease];\n}\n```\n\nThe alloc creates an instance of a Dog with a retain\
    \ count of 1. The autorelease fulfills your obligation to balance the alloc with\
    \ a release. (An autorelease schedules a release for sometime in the future. See\
    \ the sidebar, Autorelease.)\n\n# Autorelease\n\nUnder reference counting, when\
    \ you create an object with a method name contains \"alloc\" or \"copy\" or begins\
    \ with \"new\", the object is returned with a retain count of one. You are eventually\
    \ responsible for balancing the object creation by sending the newly created object\
    \ release message. In some situations, this requirement causes an awkward problem.\
    \ If you have a method that creates an object to pass on as a return value, the\
    \ only place to balance the object creation with a release message is inside that\
    \ method. But sending the newly created object release message causes it to be\
    \ deallocated before it can be returned. This is what an autorelease message does.\n\
    \nWhen object receives an autorelease message, a pointer is added to the current\
    \ autorelease pool. The objects in an autorelease pool receive a release message\
    \ when the pool is drained at some future time. If an object has received more\
    \ than one autorelease message, it receives one release message for each autorelease\
    \ message it received. In a GUI program, the pool is typically drained at the\
    \ bottom of the run (event) loop. For the purposes of retain count bookkeeping,\
    \ an autorelease counts as a release. It's just that one happens at an unspecified\
    \ future time. Reference counting is covered in detail in Chapter 14, \"Reference\
    \ Counting.\"\n\nWhen you use your convenience constructor, you must remember\
    \ to take ownership of the returned Dog if you plan to keep it:\n\n```\nDog *spot\
