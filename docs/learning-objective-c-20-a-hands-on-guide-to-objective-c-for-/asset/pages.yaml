  md: "# Instance Variable Scope (Access Control)\n\nObjective-C provides three directives\
    \ to control access to an object's instance variables:\n\n+   * **private**\n\
    The instance variable is only accessible in methods of the class that declared\
    \ it. Trying to access it from a subclass results in an error.\n* **protected**nThe\
    \ instance variable is accessible in methods of the class that declared it and\
    \ in the methods of any class that inherits from that class.\n* **public**nThe\
    \ instance variable is accessible anywhere, even in code outside of the class\
    \ that declared it or any of that class's subclasses.\n\nIn addition to being\
    \ allowed to access the instance variable from methods inside the declaring class\
    \ or one of its subclasses, @public enables you to treat a pointer to an instance\
    \ of the class as if it were a pointer to a C structure.You can access the instance\
    \ variable instance->instance variable;\n\nBut now I've told you that you can\
    \ access instance variables directly, let me tell you not to do it. Accessing\
    \ the internals of a class violates encapsulation, one of the basic principles\
    \ of object-oriented programming. If you access the inner working of a class directly\
    \ and the implementation of that class changes, your code may break.\n\nThe directives\
    \ go before the instance variables they describe, in the class's interface section.\
    \ When given, a directive is effective until a different directive replaces it.\
    \ The default, if you don't provide a directive, is @protected, as shown in Listing\
    \ 11.5.\n\n# Listing 11.5 DinnerDish.h\n\n```\n@interface DinnerDish : NSObject\n\
    {\n    Chef* chef;\n    @private\n    Recipe* recipe;\n    int calories;\n   \
    \ @protected\n    BOOL lowFat;\n    BOOL spicy;\n```"
