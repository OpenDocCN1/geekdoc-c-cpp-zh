  md: '# Destroying Objects


    Note

    After [self release] is executed, the object held in self is no longer valid.
    You should not execute any code that references self between invoking release
    on self and returning nil. If you don''t follow this rule, and the offending code
    is executed, it will cause your program to crash.


    # # Destroying Objects


    How do you get rid of objects when you are finished with them? It is important
    to properly dispose of unneeded objects so their bytes can be returned to the
    heap for reuse. In Objective-C


    +   1. Send a release message to all objects that the disappearing object has
    created or retained.

    2. Invoke the superclass''s dealloc method.


    The dealloc method for the TeeShirt from the preceding section class looks like:


    ```

    (void) dealloc

    {

    [shirtColor release];

    [super dealloc]; // Important!

    }

    ```


    In the following code, shirtColor holds an object (an NSObject) that was retained
    when the TeeShirt instance was created. When it is about to disappear, the TeeShirt
    object must retain with a release message. Otherwise, the object held in shirtColor
    becomes a potential memory leak.

    The line [super dealloc] is very important. It is NSObject''s implementation of
    dealloc that returns the object''s bytes to the heap. If any class in the inheritance
    chain between your class and NSObject forgets to call [super dealloc] in its own
    dealloc, NSObject''s implementation won''t be invoked. The bytes used by the object''s
    storage will be leaked. The compiler helps you, by warning if you forget the [super
    dealloc].'
