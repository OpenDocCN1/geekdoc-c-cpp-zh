    # while Statements and NSEnumerator


    Using a loop in conjunction with an instance of the Enumerator class is more idiomatic
    to iterate over an Objective-C collection. An Enumerator takes the objects in
    a collection and hands them out, one at a time, with the method nextObject. When
    all the objects have been dispensed, any further calls to nextObject nil.


