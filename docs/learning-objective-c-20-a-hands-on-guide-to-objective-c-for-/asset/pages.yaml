  md: '# 12


    # Properties


    One of the most common programming tasks is to set or retrieve a value held in
    one of an object''s instance variables. Although it is possible in some cases
    to access the instance variable directly, doing so is a bad practice. The correct
    way to access an instance variable is to use accessor methods. An accessor method
    that sets an instance variable is called a setter and one that returns an instance
    variable''s value is called a getter.

    For example, if your object has integer variable numberOfOfDogs, you should declare
    and implement the following two methods:


    ```

    -(int) numberOfOfDogs; // returns the current value

    -(void) setNumberOfDogs(int) numberOfOfDogs; // sets a new value

    ```


    > Note

    Naming the getter instanceVariableName and the setter setInstanceVariableName
    is not a requirement, of the Objective-C language. It is a convention that you
    should learn to follow, because certain advanced features as key-value coding
    depend on the convention. Key-value coding allows you to set and get the value
    of an instance variable by an NSString key to identify the variable being accessed.

    Key-value coding is covered in Chapter 7 ("Key-Value Coding; Key-Value Observing")
    of Cocoa for Mac OS X, Third Edition, by Aaron Hillglass (Addison-Wesley, 2008).


    The drawback of using accessors is that they are tedious to code, especially if
    the class has a large number of instance variables. Objective-C 2.0 introduces
    a new feature called declared properties. It adds two new statements that reduce
    the work required to code and implement accessors:


    +   * @property statement provides a shorthand to declare accessor methods.

    * @synthesize statement causes the compiler to write the designated accessor methods
    for you.


    > Note

    Apple refers to the feature as "declared properties" but for brevity the rest
    of the chapter will use the simpler "properties."'
