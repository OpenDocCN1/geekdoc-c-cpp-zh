    Lines 8, 9, and 10 declare the Greeter class''s methods. The form of a method
    declara- is


    +   - (returnType) methodName;


    If the method has an argument, a value to be passed to the method, its form is:


    +   - (returnType) methodName:(argumentType) argumentName;


    If the method doesn''t return anything, the return type is void. The leading hyphen
    (-) indicates that these methods are instance methods.


    setGreetingText: and greetingText set and retrieve the NSString object held in
    the instance variable greetingText. Methods like these are accessor methods, or
    more casually, setter and getter methods. It is a custom (and a necessity to use
    an advanced feature of Cocoa called key-value coding) to name the accessors for
    instance variable after the instance variable''s name.The setter and getter for
    an instance variable someObject would be setSomeObject:someObject, respectively
    (with the capitalizations shown here).


    > Note In the case where the instance variable holds a Boolean value, the getter
    may also be isPropertyName The getter for a Boolean instance variable may be either
    visible or isVisible.


    The use of accessor illustrates information hiding (also known as encapsulation),
    an important concept in object-oriented programming. Code that uses the Greeter
    class does not touch the instance variable greetingText directly. This allows
    the maintainer of the class to modify the class'' implementation as long as the
    accessor methods work properly. For example, an updated Greeter might choose to
    store the greeting in an NSDictionary instead of a separate instance variable.
    (An NSDictionary is an associative array. It stores by associating each object
    with a second object called a key, see Chapter 9.) As long as the methods greetingText
    and setGreetingText are updated to store and retrieve the greeting using the dictionary,
    any code that uses a Greeter will be unaffected by the change.


