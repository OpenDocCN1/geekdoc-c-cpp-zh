  md: "# Garbage Collection Pro and Con 303\n\nNSUInteger length = [mutableData length];\n\
    \nBecause the compiler mutableData is no longer needed (it doesn't understand\
    \ the relationship of mutableBytes to mutableData), it steals mutableData's slot\
    \ on the stack for another variable (that is, to save space the compiler stores\
    \ another variable at the address on the stack where mutableData was stored).\
    \ If the collector wakes up and runs during the while loop, it notices that there\
    \ is no longer any reference to mutableData. The collector collects mutableData\
    \ leaving mutableBytes pointing to memory that has been released and may be reallocated\
