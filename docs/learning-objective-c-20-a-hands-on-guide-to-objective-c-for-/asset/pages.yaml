  md: "# Receiving Objects\n\nSo far, reference counting may seem like just a fancy\
    \ name for \"remember to free what you have allocated.\" Its real usefulness becomes\
    \ apparent when you start passing objects around one method to another.\n\nAn\
    \ object received from another method is presumed to remain valid for the remainder\
    \ of the receiving method. In the following example, NSDate's date method returns\
    \ an object that represents the current time and date:\n\n```\n(void)doSomethingWithTheCurrentDate\
    \ {\n  NSDate *currentDate = [NSDate date];\n  // currentDate is used, but not\
    \ stored in an instance variable\n...\n}\n```\n\nThe method doSomethingWithTheCurrentDate\
    \ can use currentDate until it, without worrying that currentDate will be deallocated.\n\
    \n> Note: This condition is only true in a single threaded program. In a multithreaded\
    \ program, it is possible for another thread to deallocate the received object\
    \ before the receiving method returns. Methods that return objects in a multithreaded\
    \ environment require special care if you want them to meet this condition. (See\
    \ the section Multithreading later in this chapter.)\n\nIf you want to store a\
    \ received object in an instance variable and continue to use it after the receiving\
    \ method returns, you must take an active step to ensure that the object remains\
    \ valid and is not deallocated. To illustrate this, imagine, as you did in Chapter\
    \ 6, that you are creating some classes for a rock and roll simulation game. A\
    \ Rockstar object needs a\n\n```\n@Class Guitar:\n\n@interface Rockstar : NSObject\
    \ {\n  Guitar* guitar;\n...\n-(Guitar*) guitar;\n-(void)setGuitar:(Guitar*)newGuitar;\n\
    ...\n@end\n```"
