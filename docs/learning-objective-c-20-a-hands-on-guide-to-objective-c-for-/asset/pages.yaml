  md: '# Properties and Memory Management


    Using properties and synthesized setters (or correctly had coded setters) takes
    a lot of work out of reference counting. As long as you make sure that you always
    use an instance variable''s setter method to set its value, most of your reference
    counting takes place automatically.


    > Note

    It is good practice to use the accessor methods, even when accessing an instance
    variable from within a method. An exception to this rule is when you initialize
    an instance variable in an init method or release it in a dealloc method. These
    are purely internal operations. In typical cases of initialization or deallocation,
    you don''t want or need the side effects that might be caused by invoking accessor
    methods. In an init method, you should set the instance variable directly (retaining
    the object you are storing if that is required). In a dealloc method, you should
    release the instance variable directly instead of invoking the instance variable''s
    setter with a nil argument.


    # dealloc


    It would be nice to go out and get a latte while the compiler does all your work
    for you. Although properties are a step in direction, you still have to do some
    yourself. The compiler can synthesize your accessor, but it doesn''t completely
    take care of memory management. If your class has any properties that are retained
    or copied, you have to remember to release those objects in the class''s dealloc
    method. Even here, properties are helpful. Looking at the property declarations
    remind you which objects need releasing.


    The dealloc method for the Employee class from Listing 12.8 looks like this:


    ```

    {

    [name release];

    [supervisor release];

    [super dealloc];

    }

    ```


    # Subclassing and Properties


    A subclass inherits any properties (and their accessors) from its superclass.
    You can repeat the property statement in the subclass header (for the purposes
    of documentation), but the compiler complains unless the property statement is
    the same in both the original header file and the subclass header.


    There is one exception:You can redeclare a readonly property to be in the subclass.
    This allows you to follow the common design pattern of having a mutable subclass
    of an immutable class.'
