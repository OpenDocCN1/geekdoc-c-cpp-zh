  md: 'Appendix E Resources for Objective-C


    # Internet Resources


    The Apple Cocoa and Xcode mailing lists are archived in convenient form at

    www.cocoabuuilder.com.


    The Cocoa list is also archived at www.mail-archive.com/cocoa-dev/lists.apple.com/.

    The Omni Group, an independent Mac software company based in Seattle, makes a

    number of the frameworks that it has developed available as an open source project.

    Even if you don''t use these frameworks directly, they are all worth looking at
    as sample

    code (www.omnigroup.com/developer/).


    GNUStep provides an open source implementation of the AppKit and Foundation

    frameworks, based on the OpenStep API plus some additions based on Cocoa. GNUStep

    works on a number of systems including OS X, Linux, and Windows (www.gnustep.org).


    CocoaDev is a wiki site with a number of tutorials and links to articles on Objective-C

    and Cocoa (www.cocoadev.com).


    There are many other articles and blog posts on Objective-C on the web, some

    than others. With so much else in the modern world, Google (or your favorite search

    engine) is your friend.


    # Groups


    A number of cities have monthly CocoaHeads meetings (http://cocoheads.org/).

    in addition to presentations, CocoaHead meetings are a good way to learn from
    more

    experienced developers.


    www.meetup.com lists a number of Objective-C related meetups, particularly iPhone

    groups. Check to see if there is one near you.


    NSCoder nights are informal group coding sessions where you can exchange ideas
    and

    learn from Objective-C programmers (http://roscodernight.com/).


    # Books


    Erik M. Buck and Donald A.Yackman, Cocoa Design Patterns (Addison-Wesley, 2009).

    Samuel P. Harison and Guy L. Steele, C:A Reference Manual, Fifth Edition (Prentice
    Hall, 2002).

    Aaron Hillegass, Cocoa Programming for Mac OS X, Third Edition (Addison-Wesley,
    2008).

    Brian W. Kernigan and Dennis M. Ritchie, The C Programming Language, Second Edition

    (Prentice Hall, 1988).

    Stephen G. Kochan, Programming in Objective-C 2.0, Second Edition (Addison-Wesley,

    2009).


    Amit Singh, Mac OS Internals: A Systems Approach (Addison-Wesley, 2006).'
