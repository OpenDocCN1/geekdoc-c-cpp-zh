  md: '# Chapter 11. Categories, Extensions, and Security


    The information in an Objective-C executable by the runtime uses to fill its structures
    is available and can be read by any program. There are several command line programs
    that read this information and present it in human-readable form. (See the sidebar
    Dumping a Class.)


    Dumping a Class

    The command line tool can display the instance variables and methods from an Objective-C
    program or framework, albeit in a somewhat cryptic format. Even better is class-dump
    (www.codethecode.com/projects/class-dump), which prints out the same information
    nicely formatted as Objective-C interface sections, for each class.


    tool and class-dump are useful for educational purposes, but you shouldn''t use
    any private methods or frameworks that you discover. Private methods and undocumented
    APIs are subject to change without notice. If you do them and they change or disappear,
    your program will likely break.


    As noted, Objective-C does not provide any access control for method names. You
    can try to hide the declaration of private methods in a private header or a category
    in an implementation file. If somebody roots the name and signature with class-dump,
    he or she can successfully call the method. The compiler will complain with a
    name, but that problem can be evaded by crafting a custom category header that
    declares the methods using the information from class-dump.


    I certainly don''t recommend that you do any of this, but you should be aware
    that it exists. Most newcomers find it a bit shocking, but in practice it doesn''t
    cause much trouble—most people learn by the max that it''s a bad idea to write
    code that depends on the undocumented internals of other people''s code or libraries.


    > Note

    Apple will reject an app from the App Store if it uses a private or undocumented
    method.


    However, there are some areas where you should be careful. One example is licensing
    code: Although it is probably inevitable that your app will be cracked, you don''t
    want to make it easier for a cracker, so you should probably write your licensing
    code or anything similarly sensitive in C.


    # Calling C Functions from Objective-C


    A common question newcomers ask is "Can I call C functions from within an Objective-C
    method?" I will divide the answer into three parts: technical, practical, and
    philosophical.'
