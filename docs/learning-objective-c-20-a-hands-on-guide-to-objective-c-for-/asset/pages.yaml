  md: '# The Final Goodbye: When Programs Terminate


    When a program terminates, all the system resources the program used are reclaimed
    by the operating system. The virtual memory pages that back any memory you used
    or allo- gated onto the operating system''s free list. The bad effects of forgetting
    to release a block of memory do not persist beyond the execution of a program.
    Because of this, the dealloc methods of objects that are still alive when the
    program terminates never be called. Everything is disappearing—there is no need
    to go through the motions of unwinding an object graph and leaving each object
    individually. But there is a trap here: if you are in the habit of doing other
    kinds of cleanup in your dealloc methods, the code for these cleans may never
    be called.


    For example, suppose you have code that is supposed to write out some inform-ation
    to a disk file when your program terminates. If you put that code into object''s
    dealloc method, you may be pleasantly surprised. The code will never be executed.


    The AppKit on Mac OS and the UIKit on the iPhone provide a mechanism for handling
    this situation. They both provide an (NSApplication and UIApplication, respectively)
    that represents the application. In both cases, the application object allows
    you to register a custom object, which you define and create, as the application''s
    delegate. When the application is to terminate, the application object sends the
    delegate applicationWillTerminate: message. Your delegate object does the cleanup
    by providing an implementation of applicationWillTerminate: that contains any
    necessary cleanup code.


    If you are writing a non-GUI Foundation program, you simply place any cleanup
    code just before the return statement in your main routine.


    Some programmers do not bother with a dealloc method for objects that last the
    entire span of a program''s execution. such as inspector panels in a GUI application.
    Omitting a dealloc method is a bad practice. If you are in the habit of always
    providing a dealloc method when an object is holding on to other objects, you''re
    less likely to forget it in a case where it is needed. If one of your “permanent”
    objects in a different context in another program, where the object doesn''t last
    the execution life of the program, the proper dealloc will already be in place.


    # Summary


    These are the key points of Objective-C''s reference counting memory management
    system:


    +   - An object''s retain count tracks the number of other objects that are using
    the object. The retain count is frequently expressed as the number of owners an
    object has.

    - Objects are created with a retain count of one.'
