  md: '# Chapter 13 Protocols


    # Note


    When you code a class that adopts an informal protocol, the protocol method implementations
    must go in the class''s @implementation section, not in a category @implementation
    section. If you place the implementations in a separate category @implementation
    section, your method implementations are added to all classes (assuming the protocol
    is declared as a class). This is unlikely to be what you intended.


    So what''s the point of using informal protocols? Before Objective-C 2.0, all
    the methods in a formal protocol were required. The only way to have optional
    methods in a protocol was to use an informal protocol and note the optional methods
    in the documentation. With the advent of @optional and @required, there isn''t
    much reason to use an informal protocol:You can have optional methods and still
    enjoy the benefits of a formal protocol.


    You can see this progression in the Apple frameworks: In earlier versions of the
    AppKit, NSTableDataSource (the source protocol for AppKit''s NSTableView) was
    an informal protocol. Beginning in Mac OS X Snow Leopard (v10.6), NSTableDataSource
    has been replaced with the NSTableViewDataSource formal protocol.


    # Summary


    Protocols add flexibility to program design by letting you type objects by behavior
    rather than class. There are many situations where all is required of an object
    is that it implement a particular set of methods. In these situations, the object''s
    class and other behavior are immaterial. Protocols let you finalize this pattern:


    +   - You declare a protocol by giving it a name and declaring its methods between
    @protocol and @end directives.

    - Protocol methods may be either @required or @optional.

    - A class adopts a protocol by implementing all of the protocol''s required methods
    and, perhaps, some or all of the protocol''s optional methods. The class declares
    that it has adopted the protocol by appending the protocol name inside brackets
    after the superclass in the class''s @interface. The header file containing the
    protocol declaration must be visible to the adopting class''s @interface section.

    - You can add a protocol to the type declaration of an instance variable or a
    method argument. If you do this, the compiler checks to see if an object that
    you assign to the instance variable or use as the method argument adopts the specified
    protocol.

    - You can use the class or the instance version of conformsTo: to see if a given
    class or a given object adopts a particular protocol.

    - Before calling an @optional method, you should use respondsToSelector to make
    sure the receiver has implemented the method.'
