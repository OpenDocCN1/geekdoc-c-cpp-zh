  md: '# Methods 95


    What if a method has multiple arguments? This is where things may begin to seem
    strange:When a method has more than one argument, the arguments are interspersed
    with parts of the method name.A method to set a Shape’s outline and fill color
    at the same time would be declared like this:


    ```

    (void) setOutline:(NSColor*) outlineColor

    fillColor:(NSColor*) fillColor;

    ```


    The preceding method’s name is:


    ```

    setOutlineColor:fillColor:

    ```


    Note that each argument comes after a colon.

    The Parts of a method name aren’t argument labels and you aren’t allowed to rearrange
    them.


    ```

    setOutlineColor:fillColor:

    ```


    and


    ```

    setFillColor:outlineColor:

    ```


    are different methods. Although you may find this way of naming methods odd at
    first, it makes easy to write descriptive, self-documenting method names.

    Methods, like functions, can take a variable number of arguments. Methods that
    take a variable number of arguments are declared like this:


    ```

    (void) methodWithNumberOfArguments:(id) argl, ...;

    ```


    The comma and parentheses are not part of the name. The name of the preceding
    method is:

    methodWithVariableNumberOfArguments:


    # Method Name Conventions


    It is not a form of the Objective-C language specification, but it is an almost
    universal naming convention in Objective-C that each part of a method begins with
    a lowercase letter, and that subsequent words in that part of the method begin
    with capital letters, like this:


    ```

    // Good form

    -(void) setOutlineColor:(NSColor*) outlineColor

    fillColor:(NSColor*) fillColor;

    ```


    The following method name is considered bad form because it does not follow the
    convention:


    ```

    // Bad form

    -(void) SetOutlineColor:(NSColor*) outlineColor

    FillColor:(NSColor*) fillColor;

    ```'
