  md: '# Chapter 13 Protocols


    A class can adopt more than one protocol. The protocols are listed, separated
    by commas, between a single set of angle brackets. If AcmeUniversalBolt conforms
    to the NSCopying protocol (by implementing copyWithZone:) as well as <DrawableItem>,
    its interface line looks like this:

    @interface AcmeUniversalBolt : AcmeComponent <DrawableItem, NSCopying>


    # Protocols as Types


    You can declare a variable to be a type that holds an object conforming to a protocol
    by adding the protocol to the declaration:

    id <DrawableItem> currentGraphic;


    This tells the compiler nothing about what currentGraphic is, only that it conforms
    to the <DrawableItem> protocol. If you try to assign an object that doesn''t conform
    to the <DrawableItem> protocol to currentGraphic, the compiler complains. It''s
    also possible to be more restrictive:

    AcComponent<DrawableItem> currentGraphic;


    This tells the compiler currentGraphic is an instance of the'' class or one of
    its subclasses and that its class implements the <DrawableItem> protocol.


    > NotenThis construction is rarely seen. The whole point of protocols is that
    users of a conforming object don''t have to know about its class, only that it
    conforms to the protocol.


    # Properties and Protocols


    If some of your methods are accessor methods, you can declare them in the protocol
    header using property statements. In the <DrawableItem> example, the protocol
    declaration looks like this:

    @protocol DrawableItem


    ```

    @required

    -(void) drawItem;

    @property (nonatomic, readonly) NSRect* boundingBox;

    @property (nonatomic, retain) NSColor* color;

    ```


    ```

    @optional

    -(NSString) labelText;

    ```



    Any class adopting the protocol would have to either synthesize the accessors
    corresponding to the properties or provide implementations for them, just as if
    the properties were declared in the class''s @interface section.'
