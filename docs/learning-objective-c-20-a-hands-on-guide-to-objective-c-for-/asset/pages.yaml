    retain message would then have an invalid receiver and the program would crash.If
    the statement in Line 3 prevents this from happening.


    Note

    The preceding code is essentially what is generated when the compiler synthesizes
    the property statement:

    @property (nonatomic, retain) Guitar* guitar;


    It is written here as an illustration; in a real program, it is cleaner to use
    @property and @synthesize. See Chapter 12. "Properties."


    # Ownership


    Objective-C reference counting is discussed in terms of ownership:


    +   - If you create an object, you own it.

    - You take ownership of an object that something else created by the object sends
    it a retain message.

    - When you are finished with an object that you own, you must relinquish ownership
    in that by sending it a release message.

    - When an object has no more owners (which means that its retain count is zero),
    the object is deallocated.


    Note

    Objective-C ownership is not exclusive ownership. An object can have many owners.
    Taking ownership of an object by sending it a retain message does not remove anyone
    else''s ownership of that object.


    For methods that return objects, ownership follows a naming convention:


    +   - If you create an object by invoking a method whose name begins with "alloc"
    or "new" or contains the word "copy", you own the returned object.

    - If you receive an object from any other method, you do not own the returned
    object. If you want to use the object beyond the scope of the method that received
    it (by storing it in an instance variable or a global variable), you must take
    ownership of the object.'
