  md: '# 16


    # Blocks


    Blocks provide a way to package up executable code and a context (various variables)
    as a single entity so they can be handed off for execution at a later time or
    on a different thread. In other languages, blocks or similar constructs are sometimes
    called closures or anonymous functions. Blocks are an Apple-supplied extension
    to C, Objective-C 2.0, and C++. Apple has submitted blocks to the C standards
    working group as a proposed extension to C. At the time of this writing, blocks
    are only available on Mac OS X Snow Leopard and on iOS 4 (v10.6). They are not
    available on earlier versions of Mac OS X or iPhone iOS.


    > Note

    You can use blocks on iPhone OS 3.x and on Mac OS Leopard (v 10.5) if you install
    Plausible Blocks (PLBlocks). Plausible Blocks, a reverse-engineered port from
    Apple-released open-source, provides the compilers and runtime required to use
    blocks. You can obtain Plausible Blocks from http://google.com/p/plblocks/


    Handling off a package of work is useful in many situations, but by one of the
    main forces behind the adoption of blocks is Apple’s new Grand Dispatch (GCD)
    feature. GCD is designed to make concurrency easier to program and more efficient
    to execute. Essentially, the idea behind GCD is that the operating system has
    a global view of all the processes running on your Mac, and allocates resources
    (CPU, GPU, and RAM) as needed to make things run more efficiently. GCD can make
    better decisions than a user space program about the number of threads to use
    and when to schedule them for execution. You use blocks to submit units of work
    for GCD to execute.


    > Note

    G provides a C interface for submitting blocks. Cocoa provides a higher-level
    interface to GCD through the NSOperationQueue, NSBlockOperation, and NSInvocationOperation.

    NSInvocationAllows you to submit units of work as NSInvocation objects instead
    of blocks, but as you will see in the section NSInvocation, NSInvocation objects
    are somewhat difficult to set up. Blocks are much easier to use.'
