  md: '# Summary


    Categories allow you to add methods to an existing class without requiring access
    to the class’s source code. This provides a way to extend classes without subclassing
    them; the new methods become part of the existing class. Category header files,
    which are just lists of method declarations, can be used to split large classes
    into several files or to provide separate headers for public and private methods.


    Extensions provide another way to hide declarations of private methods. Objective-C
    methods can be private only in the sense of the visibility of the declarations.
    A programmer that knows the name of a method can call successfully even if the
    method’s declaration isn’t visible.


    Objective-C provides access control for instance variables with the @public, @protected,
    and @private directives; however, it is possible to go around them and access
    @private variables using a category method.


