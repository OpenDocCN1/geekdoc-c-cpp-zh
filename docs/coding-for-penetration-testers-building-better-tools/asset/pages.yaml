  md: '# CHAPTER 2


    # Introduction to Python


    # Abstract


    In this chapter, we dig into the Python language and investigate different types
    of network scripts, subnetting, and file manipulation. These topics are investigated
    through practical examples that we will encounter while penetration testing. We
    look at how to build scripts to communicate with Web servers, determine what Web
    servers may be hiding, and even investigate how to send our data without being
    seen by network tools. These examples and provide practical, real-world scenarios
    for when and how to use the Python language. While we are building tools that
    we can extend for our scripting toolkit, we investigate all the Python basics
    from data structures, to control statements, to interact with the shell, and to
    manipulate strings and files.


    # Keywords


    Python; web servers; network; data structures; control statements


    # INFORMATION IN THIS CHAPTER


    +   * Where Is Python useful?

    * Python Basics

    * File Manipulation

    * Network Communications


    Python is an excellent tool for building quick scripts to deliver exploits, manipulate
    well-known network protocols, and create custom network packets. This chapter
    focuses on how to leverage Python’s availability in the Kali 2.0 distribution
    to demonstrate these concepts. The chapter starts by explaining what Python is
    and where'
