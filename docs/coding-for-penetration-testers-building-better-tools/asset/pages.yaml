    # # Functions


    Code we want to use again should be put into a function to make it easier to add
    to programs in the future. Let''s look at a practical example. Let''s say we have
    Web servers that we want to know more about. We could look at the server header
    and the last modified date. These may tell what software the Web server is running
    and let us know if the page is an active one or something that may be default
    or static. While the server may hide these values, we will encounter them frequently,
    so let''s write a basic function to grab them from a host.


    ```

    #!/usr/bin/ruby

    require ''net/http''

    def getHeader(host,port = nil)

    port = port || 80

    ```


    We use the `require` keyword to include our helper module `net/http`. We want
    the program to fail if we can''t include it. Next, we define our function using
    the `def` keyword followed by our function name. Our function, called `getHeader`,
    will take two options. The first option will be a string containing the host which
    we want to connect. The second option, the port, will be optional. This allows
    us to only specify the port if we want to connect on a nonstandard port. To ensure
    that we have a good port, our line sets the port to the value of 80 if no other
    port is given.


    ```

    Net::HTTP.start(host.to_s,port) do |http|

    resp = http.head(''/'')

    return resp[''server''].to_s,resp[''Last-Modified''].to_s

    end

