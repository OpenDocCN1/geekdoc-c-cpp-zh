    In this chapter, we examine the Perl language. We can use Perl to process data
    and merge data together from disparate sources, a common function in the penetration
    testing world with its many tools. Scripting in Perl follows most of the standard
    conventions we can find in other scripting or programming languages and make use
    of various data structures, such as variables and arrays to store data in our
    scripts, arguments, control statements as loops and conditionals, as well as regular
    expressions, file input and output, and many of the other standard programming
    language features.


