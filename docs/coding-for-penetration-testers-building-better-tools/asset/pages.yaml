- pgno: 369
  md: '# Summary


    Throughout this chapter, we explored different strategies and methodologies for
    exploitation using scripting languages. With Python, we created an exploit that
    leveraged a buffer-overflow vulnerability to get a remote shell. Once we had our
    POC code, we looked at how to turn our exploit into a more versatile Metasploit
    exploit using Ruby.


    Many of the vulnerabilities today are found in Web applications, so we looked
    at three different types of Web vulnerabilities: RFI, command execution, and XSS.
    We leveraged a RFI vulnerability to include our own shell into a vulnerable application,
    and then looked at how to inject a PHP Meterpreter shell into the same application.
    We examined command execution vulnerabilities and demonstrated how to launch commands
    through a vulnerable Web application. Finally, we looked at XSS vulnerabilities
    in a search page, and chained together multiple pieces of code to create a working
    XSS exploit.


    We have explored multiple ways to help leverage scripting to advance our access
    to a target network. We can build and port network exploits, exploit Web vulnerabilities,
    and steal sessions to gain additional access on a Web page. We have worked with
    Ruby, PHP, Python, and JavaScript. Each example shows how scripting is critical
    to the exploitation stage of penetration testing, and now we have a better grasp
    on how to use scripting during the penetration testing process to gain additional
    access to network and Web resources.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# CHAPTER 10


    # Postextploitation scripting


    # Abstract


    Once the shells come back, we have a bit more work to do. This chapter discusses
    what happens after we''ve gotten in. Working from information gathering under
    Windows, and moving towards maintaining access through creating users using the
    Windows command line, this chapter looks at how to query and manipulate Windows
    systems from the command line. We''ve gotten the hang of it, this chapter works
    to convert that work into a Meterpreter script using Ruby where we can easily
    run these commands through Metasploit


    After exploiting a Web application, we don''t want the database to feel out, so
    this chapter ends with manipulating SQL injection vulnerabilities to gain access
    to applications, dump data, and even get a shell. While looking at capabilities
    of MySQL and Microsoft SQL Server, this chapter helps develop postextploitation
    abilities that will start a basic Web application tester on the road to becoming
    an advanced one.


    # Keywords


    Postextploitation; Windows; Meterpreter; Ruby; SQL injection; shell; MySQL; SQL
    Server


    # INFORMATION IN THIS CHAPTER


    +   * Why Postextploitation Is Important?

    * Windows Shell Commands

    * Gathering Network Information

    * Scripting Metasploit Meterpreter

    * Database Postextploitation


    # Introduction'
