- pgno: 269
  md: '# CHAPTER 7


    # Scanner scripting


    # Abstract


    This chapter covers the use of Netcat, Nmap, and Ness/OpenVAS, and what we can
    do with them through scripting languages. We talk about automating Netcat through
    shell scripts, in order to allow us to send files, run simple network services,
    and forward ports, altering or adding to the behavior of Nmap, customization of
    Nessus and OpenVAS through the use of the Ness Attack Scripting Language, and
    several other similar tasks.


    # Keywords


    Netcat; Nmap; Nessus; OpenVAS; services; ports; NASL


    # INFORMATION IN THIS CHAPTER


    +   * Working With Scanning Tools

    * Netcat

    * Nmap

    * Nessus/OpenVAS


    # Introduction


    When conducting a penetration test, scanning tools can be pretty handy. Because
    their functionality can be customized or their behavior scripted, their capabilities
    can be expanded considerably. This chapter focuses on Netcat, Nmap, and Nessus/OpenVAS—three
    tools that can be customized and/or automated with relative ease. First it explains
    how Nmap can be altered or enhanced through the use of Lua scripts'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'via the Nmap Scripting Engine (NSE), and how Nmap output can be used to drive
    other tools as a source of input. Next, it discusses how Nessus and OpenVAS can
    be customized through the use of the Nessus Attack Scripting Language (NASL).
    The chapter also includes with a section on Netcat which, although not directly
    alterable without changing the application source code, is useful from a scripting
    standpoint in that users can control Netcat through shell scripting, send files,
    run simple network services, and forward ports, among other similar tasks.



    In this chapter we will discuss how we can use and customize a few of the more
    popular scanning tools commonly found in penetration testing environments. Once
    again, we''ll be using the Kali 2.0 Linux security distribution, and everything
    we''ll be talking about either already be found or can easily be installed.


    Although scanning tools are often useful in and of themselves, Nmap being an excellent
    example, we can do considerably more with them if we are willing to devote the
    time and resources to learning how we can customize them. Many such tools provide
    us with the facility to customize or add to their default behaviors, either through
    easy avenues as scripting or plug-in engines, or failing that, by being driven
    directly through shell scripts. We will be taking a look at both types of development
    over the course of this chapter.


    Even beyond the scope of what we talk about here, the authors encourage the reader
    to get out there and experiment with the tools that make up the penetration testing
    environment we have to work with. Many of the useful and interesting tools we
    have access to are the result of someone thinking “there must be a better way
    to do this,” or “how handy would it be if we could just tie these tools together.”
    Penetration testing is all about thinking outside the box, and we have a really
    great set of tools to play and expand upon. Let''s take a look at some of the
    tools we''ll be experimenting with.


    # Working With Scanning Tools


    As we work through this chapter, we will cover what we can do with Netcat, Nmap,
    and Nessus/OpenVAS. Although some of us will be'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'quick to point out that Netcat is not, strictly speaking, a scanning tool at
    all, it can be incredibly useful for such a simple tool, and we will cover some
    of the interesting things we can do with, including using it as a scanning tool.


    # Netcat


    Netcat is a deceptively simple command-line tool, available for both UNIX-like
    operating systems and Windows. In essence, Netcat allows us to connect to a Transmission
    Control Protocol (TCP) or User Datagram Protocol (UDP) network port and send or
    receive data. That’s it. Really. This may sound like a tool of limited utility
    to the uninitiated, but Netcat is often referred to as the “Swiss Army knife”
    of TCP/IP, due to its incredible range of utility.


    We use Netcat as a port scanner, as a banner grabber, to send files, to receive
    files, to listen on a port, as a proxy service, to forward ports, and a huge number
    of other potential tasks. All of this, and the fact that we can easily drive Netcat
    with a scripting language for shells, such as bash, which we covered in Chapter
    I, Introduction to command shell scripting, earn Netcat a place in this chapter,
    as well as in the hearts of the authors.


    Netcat is an open source tool, so we could tinker with the source code, if we
    desired, but this is generally unnecessary. Netcat has sufficient flexibility
    all its own that we can generally wrap it in a script and make it what we need
    to do. Some of us might point out that it sounds like a lot of effort to go through
    to jump through our particular hoops, and they may may very well be correct. However,
    just as we discussed when we talked about Nmap, there are occasions when we may
    not be able to upload our favorite tools to a penetration testing target. On many
    UNIX-like systems, we will already find Netcat installed, ready and waiting to
    do our bidding.


    # Nmap


    We’ve discussed Nmap in a few different places in this book, largely'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'in regard to its role as a port scanner and service identifier. While these
    are certain areas in which Nmap excels, they by no means represent the extent
    of its capabilities. We can also customize and develop entirely new functionality
    for Nmap by making use of the NSE. NSE is a fully developed scripting language
    for Nmap, with scripts being written in the Lua scripting language, which we will
    get into a bit more depth later in the chapter.


    By making use of NSE, we can ask Nmap to do all sorts of additional interesting
    things beyond simple port scanning, such as trying to carry out brute force attacks
    against the passwords for services we find, to include the Simple Network Management
    Protocol, Server Message Block, and Virtual Network Computing services. Being
    able to call such functionality from Nmap not only gives us a much more useful
    tool but also allows us to do more with less in environments in which we may not
    want to, or be able to, install additional tools. We also have a greater likelihood
    of finding Nmap installed on a target system already than we do of finding specific
    attack tools such as THC-Hydra.


    # Nessus/OpenVAS


    Nessus and OpenVAS are a pair of tools that are, ostensibly, vulnerability scanners.
    The reason we mention them in the same breath is that Nessus is the ancestor of
    OpenVAS, with OpenVAS having been forked from Nessus when Nessus changed from
    an open source tool to a closed source tool. There is much discussion on whether
    one product is superior to the other, based on any number of factors, to include
    cost (Nessus is subscription-based, while OpenVAS is free), availability of the
    source code, quality and quantity of the plug-ins for vulnerabilities, and a variety
    of factors. We can easily install OpenVAS for Kali 2.0 by following the instructions
    on the kali.org website https://www.kali.org/penetration-testing/openvas-vulnerability-scanning.


    Whether we choose to use Nessus or OpenVAS, both support the NASL for writing
    plug-ins. NASL, similar to NSE, allows us to extend'
  merge: -1
  img_proc: true
