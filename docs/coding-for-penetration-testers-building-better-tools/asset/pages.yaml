    While we could simply get for the MAC by running ifconfig | grep HWAddr and the
    first line of output back, we can also make use of a regex to retrieve items matching
    the pattern of a MAC address in the output.


    ```

    #!/usr/bin/perl

    $text = `ifconfig | grep HWAddr`;

    print "the string is \$text,\n";

    $text = m/((?:[0-9a-f]{2}(:]){5}[0-9a-f]{2}))/i;

    print "the mac is \$text,\"; # \$ is the previous successful match

    ```


    So, here we have the standard shorthand, and our ifconfig line to get the line
    of text from the network information we know will contain the MAC address and
    place it into $text. Since we piped the output from ifconfig through grep, we
    won''t have to deal with the other lines that ifconfig returns, and we could use
