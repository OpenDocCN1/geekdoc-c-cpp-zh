    # Cross-Site Scripting


    XSS is a vulnerability that has been around for more than two decades. In spite
    of its longevity, it is still one of the hardest vulnerabilities to explain to
    management. Most examples of XSS are poor. They only write information to the
    screen or create an alert box in JavaScript that says “XSS.” This seems innocuous
    and doesn’t begin to touch on what can be done with XSS.


    Popular frameworks such as the Browser Exploitation Framework (BeEF) allow us
    to demonstrate how an XSS flaw can be turned into a scanner, be used to profile
    users, steal browser cookies, and even cause browsers to exploit themselves. This
    makes the power of XSS much more apparent. Doing basic exploitation of XSS flaws
    doesn’t require a framework, but products such as BeEF (beefproject.com) help
    us to leverage the browser running the JavaScript to perform more complex tasks.
    In this section we will look at how to verify an XSS flaw, and how to use such
    a flaw for basic cookie stealing.'
