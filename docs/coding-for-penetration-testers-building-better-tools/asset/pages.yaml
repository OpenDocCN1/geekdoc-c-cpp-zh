  md: 'Regular expressions, otherwise known as regex, are a very handy tool we can
    make use of regex to search for common patterns in text, such as we might find
    with MAC addresses or IP addresses, or we may need to construct one for an entirely
    different pattern altogether, such as a serial number or other relatively unique
    pattern.


    # Note


    We can find regex, or their functional equivalent, in most scripting and programming
    languages we might care to use. Although we may find some syntactical differences
    in the way they are handled among different languages, the fundamentals of regex
    tend to stay the same.


    Let''s get a bit of information to work with when using our regex. One bit we
    might be interested in the course of penetration testing is the MAC address. MAC
    addresses can (relatively) uniquely identify the network interface on a given
    device, and potentially give us information regarding the manufacturer and model
    of the device.


    # Warning


    On most operating systems, it is possible, and often trivial, to change the MAC
    address associated with the network interface. On most Linux operating systems,
    we can alter the MAC address by using `ifconfig` command with something similar
    to this:


    ```

    ifconfig eth0 down

    ifconfig eth0 hw ether DE:AD:BE:EF:CA:FE

    ifconfig eth0 up

    ```


    We should be aware that the MAC information we are looking at in a penetration
    test may have been altered.


    We can view our MAC information under Linux using the `ifconfig` command. Simply
    issuing `ifconfig` at a command prompt will echo out a bit of information, including
    the MAC address on the first'
