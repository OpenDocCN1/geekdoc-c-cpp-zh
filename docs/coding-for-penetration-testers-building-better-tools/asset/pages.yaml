    # Where Do We Get Python?


    In this chapter, the examples will reference the default Python modules available
    in Kali 2.0. This is for ease of use and consistency if you want to follow along
    with the text, but using Kali is not required for an understanding of these concepts.


    Later versions of Python exist, but they are not as widely adopted and the differences
