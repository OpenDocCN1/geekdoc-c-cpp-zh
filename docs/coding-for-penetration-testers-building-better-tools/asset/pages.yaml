- pgno: 73
  md: 'helps with the learning experience, and is part of the reason many people new
    to scripting find Python an easier scripting language to learn. The object-oriented
    approach is also a huge benefit as basic data types have additional methods to
    facilitate basic tasks. Many of the other languages in this book don''t have these
    features.


    # Multiplatform Scripting


    While performing a penetration test, we may not always be working from within
    the context of our own operating system. By using Python’s operating-system-independent
    modules for network and file interaction, we can typically perform the same tasks
    regardless of the host operating system. This can save us frustration and valuable
    time during our penetration test.


    # Network Scripting


    Whether we’re testing a Web server and need to communicate via HTTP or we need
    to automate a task via File Transfer Protocol, Python has built-in modules to
    facilitate network interactions. These modules will handle all the internals of
    dealing with the protocols. All we''ll have to do is set up the commands and process
    the structured responses for what we''re trying to do.


    Here’s an example: We want to verify that a Web server is responding at a certain
    Uniform Resource Locator (URL). With Python, we can use the HTTP module in order
    to formulate an HTTP request for that URL. Python will return data that will allow
    us to determine the HTTP response code without having to do text matching or other
    parsing of the response.


    # Extensive Modules


    Python ships with more than 1000 modules and there are many repositories for finding
    others to install. In addition, if we build our own code, and it could be useful
    to others, Python makes it easy to bundle our code into a module we can share.'
