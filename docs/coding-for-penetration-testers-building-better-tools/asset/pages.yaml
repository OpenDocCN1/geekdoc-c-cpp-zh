    # C-shell-compatible shells


    The C shell, commonly known as csh, is written in the C programming language and
    uses a scripting style generally similar to the C programming language. Csh was
    created with an emphasis on use at the command line. It provides features to aid
    in such efforts, such as command history and filename completion, functions much
    rarer in the world of shells when it was developed. Due to differences in the
    way the shell functions and the way scripts are written, csh is almost entirely
    incompatible with shells outside of those immediately related to it.


    A descendant of csh, the TENEX C shell, otherwise known as tcsh, was released
    by Ken Green in 1983. Ultimately, tcsh is csh with the added or enhanced features
    for command history, editing, and filename completion merged in. For the systems
    that ship with a csh-like shell installed by default, we are likely to find that
    this shell is actually tcsh, as this is the most actively developed and maintained
    shell in the C-shell family at this point.


    # Bourne-compatible shells


    The Bourne shell, often called simply sw, was developed by Stephen Bourne in the
    late 1970s, and is a common ancestor of other shells, including the Bourne-again
    shell, K shell, and Z shell, just to name a few. Among these shells, we can find
    a variety of common features.


    The Korn shell, named for its developer, David Korn, was developed at Bell Labs
    in the early 1980s. The Korn shell, commonly called ksh, supports some handy programming
    features, such as the ability to perform floating-point math, and the use of more
    complex data structures than some of the other shells allow. While ksh does indeed
    support features that might allow for easier or more'
