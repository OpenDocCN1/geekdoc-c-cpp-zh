    - Working With Perl

    - Perl Basics

    - Putting It All Together


    # Introduction


    Larry Wall developed Perl in 1987 primarily as an improved tool for dealing with
    text. Since then, Perl has evolved and is now used in a variety of applications.
    Besides manipulating text and data, it is also used to take the output of one
    application, perform some operation on the output, and feed the resultant data
    to another application. This'
