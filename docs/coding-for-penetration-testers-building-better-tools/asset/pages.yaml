  md: 'efficient development, it is not as commonly found on UNIX-like systems, and
    we are less likely to find it in place as a default shell than we might be to
    find one of the other Bourne variants, such as bash.


    The Z shell, referred to as zsh, is frequently considered to be the most feature-rich
    among the Bourne-like family of shells. Zsh was developed in the early 1990s by
    Paul Falstad at Princeton University. Falstad incorporated a great many interesting
    features when creating zsh, including enhanced command completion, ability to
    add modules for additional features such as those needed for networking or more
    advanced mathematics, and the ability to make use of enhanced and more complex
    data structures for programming.


    The Bourne-again shell, commonly referred to as bash, was developed by Brian Fox
    in the late 1980s for use in the GNU Project.¹ Bourne-again is a reference to
    the Bourne shell, as we discussed earlier in this section. Ultimately, the bash
    shell is the text-based shell we will most commonly encounter on a UNIX-like system.
    Many UNIX and Linux systems (and OS X as well) supply a bash shell as an installation
    default. We can also find the bash shell ported to Microsoft operating systems,
    although we are not likely to find it as we are the native text-based shells.


    Due to it being such a common shell, the rest of our discussion in this chapter
    related to UNIX-like shell scripting, and the examples we will develop for such
    systems, will focus on the use of the bash shell. We can typically find bash on
    newer OS versions, and Bourne on older ones. While there is no guarantee we will
    have access to bash on a system in any given penetration testing engagement, the
    likelihood is much higher than that of finding the other shell already present.


    # Other UNIX-like shells


    There are a large number of other shells for UNIX-like operating systems we might
    find on any particular system, ranging from only slightly different, such as the
    compact BusyBox shell, to truly different altogether, like the goosh shell. For
    almost any purpose imaginable, we can find a specialized shell or a clone of an
    existing shell with an altered set of features.'
