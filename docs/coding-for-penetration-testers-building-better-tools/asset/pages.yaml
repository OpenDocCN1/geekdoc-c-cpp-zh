  md: 'Thankfully, we will also usually find the more common shells present, typically
    at least two or three varieties on a given system. While some of these other shells
    might indeed be well suited for some specific purpose, we are often better off
    sticking with the most commonly deployed and installed shells.


    # Working With Shells


    Identifying the shell we are in by sight can be tricky. Since they all behave
    differently, knowing which shell we are dealing with is important. A number of
    features may be different among the shells: the way they generate random numbers,
    the built-in commands that are or are not present, the environment variables set,
    and many more.


    Thankfully, there is a simple and sure command we can use to identify the shell
    we are operating in, this being `ps -p $$`. By executing this command, we are
    asking for a list of processes by process ID (`-p`) where the process ID matches
    our current process (`$$`), namely the shell we are presently using. We can see
    an example of this as we move between several different shells in Fig. 1.2.'
