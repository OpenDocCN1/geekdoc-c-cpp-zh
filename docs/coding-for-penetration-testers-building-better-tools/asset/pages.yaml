    # Scripting Metasploit Meterpreter


    The Metasploit Meterpreter is an advanced shell that facilitates postexploitation
    tasks on systems. The Meterpreter can run traffic, run plug-ins and scripts, help
    us elevate privileges on Windows systems, and help us interact with exploited
    hosts. Part of what makes Meterpreter so handy is that it gives a standard command
    set for gathering process lists, dumping password hashes, impersonating users,
    and more. When it can be used, the Meterpreter is an excellent payload when using
    Metasploit. One of the most powerful abilities of Meterpreter is the ability to
