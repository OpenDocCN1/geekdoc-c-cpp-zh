    During a penetration test, we will likely encounter a situation where we need
    to quickly generate tools or modify exploits in order to perform network-based
    attacks. These attacks may occur over protocols such as Hypertext Transfer Protocol
    (HTTP), or they may require raw socket interaction. These are areas where Python
    shines as an option in the penetration tester''s toolkit. Additionally, Python
    is frequently already installed on UNIX systems with most of the modules needed
    to interact with network services for information gathering or exploitation.


    In this chapter, we will leverage Python’s availability in Kali 2.0 to demonstrate
    these concepts. We will use commonly installed modules to create a Web service
    status utility, a subnet calculator, and a basic password cracker, as well as
    explore Scapy, a Python tool designed to process and manipulate network traffic.


    # What Is Python?


    Python is an easy-to-learn scripting language that has been gaining popularity
    since its origins in the early 1990s [1]. It has become a common platform for
    security tools, since it is cross-platform, it is modular, and it comes with a
    large number of helper modules [2]. It is included in most modern Linux systems,
    as it has become the backbone of numerous configuration tools and utilities. Python
    also has the capability to port scripts to other platforms without Python interpreters
    through tools such as py2exe, py2app, and cx_freeze [3].'
