  md: 'which, when run, will execute our original code and output our text file.


    This code allows us to completely bypass the execution policies and execute our
    PowerShell code, no matter what the source is and no matter what the execution
    policy level is set to on the system. Just to make things clear, we are not actually
    changing the execution policy level, and we are not making any configuration changes
    in the operating system, altering the Registry, or performing any other simple
    steps. We are simply bypassing the signed script security measures entirely.


    # Warning


    At present, CreateCMD code works very nicely to get us around the policy restrictions
    that Microsoft has placed on PowerShell scripts as a security measure. We, of
    course, have no guarantee that this will continue to be the case forever and that
    Microsoft will not release a patch or a new PowerShell version that closes this
    particular loophole. If we find the CreateCMD code fails entirely, or does not
    work on certain versions of PowerShell, it might be worth a bit of checking to
    see if this has indeed happened.


    With this capability in hand, PowerShell quickly becomes more useful from a penetration
    testing perspective. Although we could certainly carry out attacks using social
    engineering techniques or tools such as a Trojan horse in order to have the user
    change the execution policy for PowerShell, we would rather not to take such steps
    if we have another way to get to where we need to be.


    One caveat to using this process to get around the execution policies is that,
    although we can effectively ignore the execution policies using this method, this
    is not a magic bullet. There are still activities in PowerShell, which will require
    us to have administrative access, and we may be stuck if we have not been able
    to gain it.


    Let''s talk briefly about how we can get on the system in the first place, and
    what we can do with PowerShell once we get there.'
