    # Where Shell Scripting Is Useful?


    When we are assembling a program or utility, we might choose to create a shell
    script rather than use another scripting language or a compiled language, for
    a variety of reasons. One of the primary reasons might be that our need is very
    simple and we only want to quickly accomplish our task, rather than taking the
    time to develop a full application. For example, we might want to quickly iterate
    through the entire file system on a server used for storage in order to find and
    delete MP3 files stored by users in order to free up a little disk space. While
    we might want to develop this into a full application at some point, for the time
    being we just need to get the job done.


    We may also need to put together a chain of tools in order to carry out our task,
    commonly known as gluing the tools together. For example, if we wanted to create
    a list of all the printers in our office and their accompanying serial numbers,
    we might want to ping the range of IP addresses in order to find the devices that
