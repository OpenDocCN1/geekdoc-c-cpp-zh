- pgno: 363
  md: '# What is XSS?


    XSS, like most Web application vulnerabilities, exists because of poor input sanitization.
    There are two types of XSS, stored and reflected. Stored XSS exists in things
    such as blogs or forums where users make comments or submit information, and that
    information is rendered in the browser. The information, when displayed back to
    viewers, ends being rendered instead of only output because HTML characters aren''t
    processed out by the application. These values are stored in the backend, and
    as each viewer views the page, he or she will be affected by the XSS code.


    Reflected XSS takes place typically in phishing attacks where someone sends a
    link with input that is rendered back to the user when the link is clicked. This
    is common in search engines and other types of forms that echo back results when
    we enter data. The data isn''t persistent, so it''s harder for the administrators
    to pick on unless they are looking at logs. These type of attacks are usually
    more targeted as they require a user to fetch the content instead of the content
    being presented while the browser is doing normal operations.


    # Exploiting XSS


    We will investigate the shell of a search engine application where the author
    has tried to prevent XSS, but has missed one field. By taking advantage of this
    reflected XSS vulnerability, we will target an individual whom we have admin access
    on the site, and steal the user''s cookies. For this shell of an application,
    this won''t provide any special access, but this type of attack is used by attackers
    to steal sessions or other important information from victims in the real world.
    This is a real-world attack, it''s important to be able to detect, understand,
    and explain this type of attack in the scope of a penetration test.


    ```

    <div align=center>

    <FORM METHOD=GET>

    Welcome to the easy search engine, input your query below:<BR>

    <INPUT TYPE=TEXT NAME=query VALUE="<?php echo $_GET[''query'']??>

    ```'
  merge: -1
  img_proc: true
