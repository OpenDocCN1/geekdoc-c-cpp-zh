    # Gathering Network Information


    Once we gain access into a new host on a network, we want to find out much as
    possible about the network where that host lives. We want to know what other hosts
    are there, what type of networks the host can access, and to whom the host is
    talking. To determine these things, it is helpful if we have some basic shell
    scripts handy to pull this information quickly.


    # Windows Network Information Gathering


    When looking at a Windows box, a number of things interest us. We want to know
    what interfaces a machine has, to determine what network the host is on and how
    large the network is. We want the routing table, to know more about the gateway
    and any special routing rules in place. We want to know about open connections
    and'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'the processes managing them, so we can identify the system’s function and with
    what other systems it is communicating.

    ipconfig /all >> c:\network.txt

    route print >> c:\network.txt

    arp -a >> c:\network.txt

    netstat -ano >> c:\network.txt

    tasklist /V >> c:\network.txt


    To gather information about network interfaces on the system and include important
    things such as domain name system (DNS) servers, Dynamic Host Configuration Protocol
    (DHCP) servers, and DNS names, we use the ipconfig command. The /all flag tells
    ipconfig to give us any information that we have about the network interfaces.
    This ensures we aren''t missing anything. We send the output into network.txt
    file so that we can offload one file with all our data.


    The route command with the print argument displays all routing information for
    the system. From here we can determine the default gateway and see any special
    routing rules. This will be useful in determining what types of attacks will give
    us the best result for pivoting to the next resource.


    The arp command allows us to manipulate the system’s Address Resolution Protocol
    (ARP) table, and the -a flag tells the arp to print all the ARP entries it has
    cached. This will tell us what other systems on the local network the host knows
    about. This helps us understand what other hosts are on the local network without
    having to send out additional traffic.


    The netstat command lists the open connections and other network statistics. When
    using netstat -a option tells to list all the connections, the -n option tells
    it only to use numeric output so that it does not try to do DNS resolution, and
    the -o option lists the process that owns the connection. While this tells us
    what connections are open, we know what process ID is using those connections.
    When we merge this information from the tasklist command, we can see what application
    is using each connection.


    The tasklist command lists all the processes running on the system, and when we
    use the verbose option, /V, we get the process'
