    # Symbols


    The syntax for constructing arrays and hashes in Ruby is different from Python
    and Perl, but the concept is similar enough. However, one significant difference
    for Ruby is in the handling of hash keys. Ruby, if we use a string as a hash key,
    Ruby may generate a new instance each time we it depending on the version of Ruby.
    Using a variable will also sometimes result in different objects being created.
    This uses additional memory for each instance of the key. To optimize hashes,
    we should use the symbol notation for strings used as hash keys. This guarantees
    we use the same instance instead of assigning a new one for each string is used.
    We can see each instance by looking at the object_id method.


