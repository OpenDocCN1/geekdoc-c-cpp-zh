- pgno: 366
  md: 'cookies: one for an admin flag because it’s always fun when we get an admin
    flag and a session cookie as they are more real-world.


    # Note


    The Web Developer Toolbar can be found at http://chrispederick.com/work/web-developer/
    and works with Firefox and Chrome. This toolbar will allow us to turn form elements
    on or off, view extended information about Web pages, remove length restrictions
    from fields, and more. This toolbar and Firebug are two of the extensions that
    would be very helpful during penetration testing. Firebug will allow us to help
    debug script on pages, see what content is being loaded, and explore the Document
    Object Model (DOM) of the HTML page. Firebug can be found at http://firebug.com.


    ```

    <?php setcookie(''admin'',1,0,'''',''localhost''); setcookie(''session'',md5(time())),0,'''',''localhost'');
    ?>

    ```


    Our PHP code is pretty simple. We are using the setcookie function to set two
    cookies, the second option to setcookie is the value. For admin our value is 1,
    and for session our session value is the MD5 hashed value of the current time.
    The third option is the validity time for the cookie in seconds. A value of 0
    for the validity time creates a session cookie that will go away when the browser
    is closed. Any other value will be the duration in seconds for the cookie. The
    next two variables are the validity path and the domain for which the cookie should
    be valid. These values determine when the browser will send the cookie to the
    server. By restricting the path and the domain in a cookie, we can ensure that,
    in a shared hosting environment, our cookies won’t be transmitted to any pages
    but our own. The cookies must be set before output is sent to the browser. Cookies
    are set in the headers of the HTTP response, and once data starts being sent to
    the browser, the header cannot be modified.'
  merge: -1
  img_proc: true
