- pgno: 206
  md: '# Where Web scripting Is Useful


    Web scripting provides us two advantages: the ability to manipulate Web pages
    to change the functionality of the page, and to aid in data exfiltration. Whether
    we have found a Web page to have a remote file inclusion vulnerability, or when
    we are chaining exploits to have our code run on a remote server, additional scripting
    frequently gives us the ability to interact with the operating system by using
    the Web server software. Being able to execute shell commands, manipulate file
    systems, communicate with databases, and, in some cases, communicate over sockets,
    can help us further compromises and perform postexploitation tasks during a penetration
    test.


    While performing tests, we may also need to engage in some level of credential
    theft or social engineering. PHP and JavaScript frequently work together in this
    situation where we inject JavaScript code into a Web page to gather information
    and send it back to our receiving server. In this case, our PHP will parse that
    information and log it for future use. We will look at this type of example in
    Chapter 9, Exploitation scripting.


    # Getting Started With PHP


    PHP stands for PHP: Hypertext Processor and is an open source scripting language
    designed primarily for Web development. PHP pages are typically HyperText Markup
    Language (HTML) pages with PHP code interspersed in order to merge the functionality
    of the website with the HTML code. Frequent uses for PHP include database applications
    and applications which do handling as PHP form-based parsing and the data manipulations
    which are part of form-based applications. PHP is also used as the framework for
    many Web 2.0 applications to handle databases easily and respond through common
    Web 2.0 protocols such as Extensible Markup Language (XML) and JavaScript Object
    Notation (JSON).


    # Scope


    PHP is rich and full-featured, with capabilities ranging from'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'databases, to sockets, and file system manipulations. PHP can be used for scripting
    tasks in place of bash or other host-based scripting languages. We rarely use
    PHP this way during penetration testing because there are other languages that
    are more aligned with host-based scripting instead of the Web-based scripting
    where PHP shines, so this chapter is going to focus on the aspects of PHP which
    are Web-based. This is not to say that we won''t touch on file system manipulation
    or other areas that might be helpful for command-line scripting, but they will
    not be focused on as deeply and the context in which will be discussed will be
    Web-based scenarios.


    # PHP Basics


    In order to run our PHP scripts, we will have to make sure our Web server is running.
    To do this, we start Apache Kali 2 by issuing the command service apache start.
    Next, we will change into the Web directory which is /var/www/html. This directory
    is the root website for the Apache server, and the files we create will be accessible
    via our website at http://localhost.


    Now that our site is configured, let''s build a simple PHP page. Base64 is an
    encoding method used frequently on the Internet to encode data for transmission.
    The giveaway is a string of text that ends in one or more signs. When we run Base64-encoded
    data, the easiest way to decode it is to go to a script. For our first PHP page,
    let''s build one.


    For our first Web page, we want to be able to accept input through the URL or
    through a form. When we submit data, there are three ways we can access that data.
    The first is either through the $_GET or the $_POST array. These arrays contain,
    as we could possibly guess, data submitted via GET and POST requests. The second
    is through the $_REQUEST array, which contains the values of the $_GET array,
    the $_POST array and the $_COOKIE array. The third requires a PHP setting called
    register_globals to be enabled in the PHP configuration file. In Version 5 of
    PHP, this is disabled by default as it is seen as less secure, which is why it
    is mentioned here.'
  merge: -1
  img_proc: true
