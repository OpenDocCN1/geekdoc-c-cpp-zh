    # Summary


    We are a truly enormous number of scanning tools we might use in the conduct of
    a penetration test. Given the capability of customizing the way these tools function,
    or scripting their behavior, we can considerably expand the set of our potential
    activities in a penetration test, without necessarily needing to resort to additional
    tools. In particular, Netcat, Nmap, and Nessus/OpenVAS are a few of the tools
    that lend themselves well to this type of customization and/or automation.


    We can alter or add to the behavior of Nmap through the use of Lua scripts with
    relative ease via the NSE. NSE scripts allow us to add entirely new functionality
    to Nmap, e.g., the variety of password brute forcing tools/scripts that ship with
    it, but are not a part of its core functionality. The output from Nmap can be
    used to drive other tools as a source of input, where those tools do not have
    such'
