    # Interfacing With the Registry


    The Registry in Microsoft operating systems, first brought into existence in Windows
    3.1, is a database that holds the configuration settings for Microsoft operating
    systems and the applications installed on them. We can use the Registry to manipulate
    how applications function (or keep them from functioning), what happens when the
    operating system starts, and a variety of other tasks.


    The Registry is hierarchical in nature, often presented as a series of folders
    in graphical tools designed for accessing it. Inside each level of the hierarchy,
    we may find additional levels of the hierarchy, referred to as “keys,” as well
    as individual entries, referred to as “values.” The values are a pair containing
    a name and associated data.


    In the Registry, we can find five major sections, referred to as “hives":


    +   - HKEY_LOCAL_MACHINE (HKLM) Holds settings for the local machine

    - HKEY_CURRENT_CONFIG (HKCC) Holds information generated at time

    - HKEY_CLASSES_ROOT (HKCR) Holds information about applications

    - HKEY_USERS (HKU) Holds the superset of HKEY_CURRENT_USER entries'
  merge: -1
  img_proc: true
