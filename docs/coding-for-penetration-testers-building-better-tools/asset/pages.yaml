    # FIGURE 9.1 Launching the GNU debugger.


    After we run the program, we want to inspect the state of the program. By hitting
    "CTRL+c" we will break the execution of the program. We can see that the program
    recieve a "SIGINT" signal, which means it was sent an interrupt signal which was
    caused by pressing "CTRL+c". Once the program is stopped we issue the command
    "i r". This command is short for "info registers" which will show the values look
    like each of the registers. Knowing generally what these values look like before
    we exploit a program is useful so that we can see what looks different during
    an exploit.


    These registers are important because they indicate the current state of the application.
    We see the general purpose registers first: EAX, ECX, EDX, and EBX. These registers
    are short for Extended Accumulator Pair, Extended Counter Pair, Extended Data
    Pair, and Extended Base Pair. The reason these are called pairs is because each
    register is 32 bit, and it can be split into subregisters that are the portion
    of the 32 bit value. For instance, EAX can be segmented into'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'the 16 bit register of AX, and then the AX can be split into two 8 bit registers
    AH and AL, the high and low portions of the 16 bit register.


    We can see the state of the stack and the current running command. ESP is the
    Extended Stack Pointer, or the address where the stack begins. EBP is the Extended
    Base Pointer, and points at the bottom of the stack so that application knows
    the range of the stack space. ESI and EDI are used for string copy. EIP stands
    for Extended Instruction Pointer and is used to track the address of the current
    instruction running inside the application.


    # Note


