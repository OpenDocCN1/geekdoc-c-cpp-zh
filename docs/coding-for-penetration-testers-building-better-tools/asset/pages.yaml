    handles automatic indentation, making it easier to avoid whitespace inconsistencies
    that could cause Python to fail.


    Python scripts are .py files. For example, hello.py might be our first script.
    To use it, try typing gedit hello.py to create a simple script.


    # Formatting Python files


    Formatting is important in Python. The Python interpreter uses whitespace indentation
    to determine which pieces of code are grouped together in a special way—e.g.,
    as part of a function, loop, or class. How much space is used is not typically
    important, as long as it is consistent. If two spaces are used to indent the first
    time, two spaces should be used to indent subently.


