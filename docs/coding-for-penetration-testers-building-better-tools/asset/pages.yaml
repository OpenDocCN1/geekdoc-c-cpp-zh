    Python is also available for a variety of other platforms. If you do not wish
    to use Kali and Python is not already installed, you can go to [www.python.org](https://www.python.org)
    to download Python or find out where to get a precompiled Python interpreter for
    your platform.


    # Where Is Python Useful?


    One difference between a good penetration tester and a great penetration tester
    is the ability to quickly adjust to diverse situations. Python is excellent for
    building quick scripts to deliver exploits, manipulate well-known network protocols,
    and create custom network packets. The modules to create these types of scripts
    are widely available, and tools such as Scapy and The Peach Fuzzing Framework
    provide frameworks for quickly creating custom packets and protocol fuzzing. These
    types of scripts can be written in fewer lines of code due to the minimal amount
    of setup required for many of the network modules, reducing the overhead for getting
    started with Python network scripting. In addition, the code tends to be easy
    to read because proper indentation is required as part of the language.


    Python''s interactive shell reduces trial-and-error time when trying to figure
    out how a specific function works. The interactive shell also'
