- pgno: 371
  md: 'Once a penetration tester has found his or her way into a machine, the next
    step is to gather information about asset and use that information to gain further
    access to the network or other resources. Shell scripting can help in gathering
    information once an exploit has been successful, and Meterpreter scripting can
    be employed to gain even further access. Then, once the network postexploitation
    is complete, the tester can use database vulnerabilities to mine data and get
    shell access. This chapter takes readers through the steps of basic shell scripting,
    Meterpreter scripting, data mining, and shell access. Navigating the Windows operating
    system from the command line is explored in detail; because many of the commands
    used when gathering Windows information are similar on Linux, network information
    gathering is also explored. The chapter also looks at SQL injection (SQLi) vulnerabilities
    and the basics behind their exploitation and postexploitation.


    Getting into a machine is only half the battle. Being able to take one asset,
    gather information, and use to gain further access to the network or other resources
    are skills that will turn a fair penetration tester into a good one. In this chapter,
    we will look at some basic shell scripting to help gather information once an
    exploit has been successful. We will also examine how to gain further access through
    Meterpreter scripting. Once we are done with network postexploitation, we will
    use database vulnerabilities to mine data and get shell access.


    # Why Postexploitation Is Important?


    Postexploitation takes the access we have and attempts to extend and elevate that
    access. Understanding how network resources interact and how to pivot from one
    compromised machine to the next adds value for our clients. Properly identifying
    vulnerable machines within the environment, and proving the vulnerabilities are
    exploitable, is good. But being able to gather information in support of demonstrating
    a significant business impact is better. Whether this is ensuring that customer
    data stays protected, critical Web infrastructure remains untouched, or assembly-line
    processes'
