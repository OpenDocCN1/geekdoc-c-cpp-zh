    # SQLi on Microsoft SQL Server


    The steps for performing SQLi on MySQL and Microsoft SQL Server are very similar.
    We are taking advantage of similar problems in code; since SQL is a standard,
    the language itself maps very closely. Microsoft SQL Server includes one feature
    that would be remiss if we didn''t include in this chapter: a handy stored procedure
    called xp_cmdshell that will allow an SQL server to execute shell commands. This
    stored procedure is typically turned off, but if we have found an application
    where the server administrator is running a database admin, we can turn it back
    on ourselves. Stored procedures are snippets of code that run inside the SQL server
    and are built into functions that we can execute them by just passing arguments
    to them, and don''t have to duplicate code when we have something that we want
    done repeatedly.


