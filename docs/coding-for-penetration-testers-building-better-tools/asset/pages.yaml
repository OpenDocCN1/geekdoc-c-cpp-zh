    For this command "-ggdb" means include debugging symbols so that we can see function
    calls inside gdb. The argument "fno-stack-protector" disables the stack canary
    so we can overflow the stack and it won''t kill off the application. To allow
    an executable stack, we use the argument "-z execstack". Finally we want to make
    this a 32 bit application so we add the flag "-m32". The "-o" argument specifies
    the output file. This so will compile our binary as a 32 bit binary with an executable
    stack, no stack canary, and with debugging symbols in it.


