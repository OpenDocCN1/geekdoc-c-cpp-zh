  md: '# File Manipulation


    While there are other programming languages that excel at file parsing (such as
    Perl), sometimes it will be more convenient to perform file manipulation in Python.
    In this section, we will go over the basics of reading and writing to files using
    Python. We have read from files before, when we created password.py using the
    file open command and specified the file as read-only. There are a few modes we
    need to know.


    In addition to the r or read mode, there is the w mode for write, and a mode for
    append. Two important modifiers for these are + and b. The + indicates that, in
    addition to the mode you chose, the file will be writable. This is typically used
    as r+ for a file that you want to keep intact, but modify. The w mode overwrites
    the filename with a blank file when it opens it. The b flag isn''t used in UNIX,
    but in Windows it indicates that the file should be a binary file. To read and
    write a binary file in Windows you would use r+b.


    Once the file is open, the read and write functions come into play. There are
    three primary read methods: read, seek, and tell. The read method reads from the
    file. If no argument is passed to read, it will read the whole file and return
    information as a string. If your file is massive, this may be a problem. So, you
    can specify a number of bytes to read, and read will return only the number of
    bytes or an empty string if you are at the end of the file. The readline method
    returns an entire line as a string, and thereadlines function returns the entire
    file as a list of strings.


    You have a few options for reading files, but you have only one option for writing
    to files: the write method takes one argument: a string. It writes string to the
    file at your current position. The write method returns None. So, the only way
    we know that it didn''t write the full string if it throws an exception.


    The final two methods that may use are seek and tell. These come into play particularly
    when you are dealing with binary files. The tell method tells you what your position
    is in the file, and the seek function allows you to move forward or backward in
    a file based'
