- pgno: 361
  md: 'We need three libraries to build the shell version of our exploit. We need
    `httplib` to handle the HTTP connections, `urllib` to help us with URL-encoding
    our commands, and the `sys` module to handle arguments on the command line. To
    build the command we want to execute, we need all the arguments from the command
    line with the exception of `argv[0]`, the name of the program executed. To do
    this, we take `argv[1]` through the last argument of the `argv` array and join
    the commands with spaces.


    Next, we build our connection to localhost port 80 and assign that connection
    to the c variable. Now, we need to build our query string. We use `urllib.url`
    to encode our data. We need the output to be consistent for traceroute, so we
    make `127.0.0.1`, add a semicolon, and append our command. The semicolon indicates
    that the `traceroute` command is finished and starts a new command. By `encoding`
    the data, we ensure that it will be interpreted by the Web server that we intended.


    Next, we build our request URL. We assign the traceroute.php URL and the options
    we encoded into a `request` variable, and then issue a GET request to the URL
    through the connection we generated earlier. We assign the response to the `resp`
    object, and then read the response into the `data` object. Reading the response
    gets the contents of the object so that it can be accessed. We’re done with our
    connection. So we close the connection with the server, take our data, and split
    it into lines. Since we used `traceroute` on localhost, we know the output from
    that will always be the same. We do this so that we can parse only the parts that
    will change and print them to the screen for subsequent executions. The first
    three lines of the output will be traceroute data, and the last seven lines will
    be HTTP data. All we want to print the output from our command, so we join the
    lines together with a newline character, starting at the fourth line, element
    3 of the array, and ending in the seventh from the last line.


    When we save our Python file and make it executable, we should be able to run
    the script, pass the command we want to run on the server, and have only the output
    from that command display on the'
