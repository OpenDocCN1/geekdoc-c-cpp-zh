  md: '# CHAPTER 8


    # Information gathering


    # Abstract


    In this chapter, we look into information gathering and how it can be of great
    use to us in the the course of a penetration test. We talk about automating searches
    with Google, parsing text and automating Web interaction with Perl, and finding
    and working with the metadata stored in documents, files, visual media, and other
    structures intended for digital storage of information. We also look at the various
    tools we might want to use for search and sift through such data once we have
    it.


    # Keywords


    Information gathering; Google; parsing; Web; metadata; files


    # INFORMATION IN THIS CHAPTER


    +   * Information Gathering for Penetration Testing

    * Talking to Google

    * Web Automation With Perl

    * Working With Metadata

    * Putting It All Together


    # Introduction


    Penetration testers know that there is no shortage of information available for
    use when researching penetration test targets. In fact, so much information is
    available on the Internet—from social networking sites, job posting boards, and
    metadata attached to files—that manually sifting through all of it can be nearly
    impossible. There'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'is a solution to this problem, however, in the form of automation and scripting.
    In terms of automation, penetration testers can use Google and advanced search
    operators to find security flaws, insecure devices, passwords, reports from vulnerability
    assessments and penetration testing engagements, and other data that should not
    be freely available on the public Internet. In terms of scripting, penetration
    testers can use Perl to interact with Web pages. This chapter discusses both solutions,
    taking readers through the ins and outs of automated Google discovery, and working
    with various Perl modules to glean valuable information from the Web.


    In the course of researching penetration test targets, a tester can often find
    it helpful to consult various sources of publicly available information as a portion
    of his or her efforts. In these days of common participation in various social
    media outlets such as Twitter, Facebook, and a plethora of blogging platforms,
    as well as more corporate-oriented tools such as job posting boards, we have a
    number of great information sources available to us.


    Additionally, a large amount of information ends up on the Internet in less-than-intentional
    ways in the form of metadata attached to documents, pictures, and other files,
    and all of it is available for our perusal.


    In many cases, the sheer volume of information available to us serves as somewhat
    of a measure of protection against it actually being found. If we are forced to
    manually sift through all this information, the task is overwhelming and we may
    never find what we need.


    Fortunately, we can apply automation to these efforts. We can take advantage of
    the existing tools available to us, such as Google, and apply our own layer of
    automation to them in order to get results that are more in line with what we
    are looking for. We can also assemble scripts to parse data from websites, scan
    files for metadata, and other similar tasks. We can make use of some of the scripting
    tools we have discussed throughout the book, such as scripting or Perl, in order
    to help us with these efforts.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# # Information Gathering for Penetration Testing


    Information gathering and research can be of great value in penetration testing,
    particularly in the case of a penetration test in which we do not have inside
    knowledge of the targets or the environment. A number of data sources, and quite
    few different tools, are available for us to use in the course of our efforts.


    # ## Sources of Information


    We have access to a great many sources for our information gathering efforts,
    some public and some not. Putting these to use in our penetration testing efforts
    can easily ease our tasks, and may very well make the difference between success
    and failure.


    On the public side of things, we have, as we discussed earlier in this chapter,
    the vast wealth of information stored in social networking tools and sites to
    consider. Many of the individuals using these tools are not careful about the
    information they are giving away, and may be sharing a great deal of information
    about their jobs, where they live, whom they associate with, and so on, often
    in excruciating detail. This can be a gold mine of information for the penetration
    tester.


    > Note

    Depending on the geographic area in which we reside, we might need to take care
    when gathering information of a personal or sensitive nature. The laws that govern
    such information range from nonexistent to draconian, so it may pay to find out
    what restrictions we are working before jumping in.


    Additionally, if we look to online forums, job posting boards, and other similar
    sites, we may find information regarding specific technologies, implementations,
    and infrastructure equipment in use of a particular target or location. Such items
    of information can be treasures.


    We may also be able to find quite a bit of information regarding the'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'networks and systems of our targets by interrogating the publicly available
    domain name system (DNS) records, looking over the records kept on the domain
    names in use, and other similar information. Here we can put tools such as dig
    to use, as well as online informational sites, of which a great number exist for
    any given purpose, such as which lookups, domain ownership history, and other
    similar interesting bits of information.


    On the nonpublic side, when we are on a system or in an environment already, we
    may have access to quite a few bits of information as well. We may be able to
    see stored data from browsers, such as cache, history, or bookmarks, which can
    often make for interesting reading. If we have access to stored email or an account,
    we have a potential gold mine of information, if we are able to search it for
    the information we seek.


    We may also have access to files—public, nonpublic, or both. Depending on the
    files in question, they may contain data of interest in a direct and immediately
    viewable fashion, or we may have to dig for it a bit, a topic we will discuss
    later in this section where we cover metadata in documents and in files.


    # Patterns in Information


    When we are searching for information, whether in plain text from documents or
    Web pages, metadata in files, compiled code in application binaries, or nearly
    any other source, we can often look for particular patterns that relate to the
    information we are looking for. Particularly in the case of searching for specific
    information—an IP address or a credit card number, instance—the search for this
    type of information can be greatly simplified, and can save us a great deal of
    pain.


    As we discussed in Chapter 3, Introduction to Perl, when we covered Perl, regular
    expressions (regex) are very handy for searching for these patterns, at least
    when we have something specific which we would like to find. If we can put together
    a regex for email addresses, credit card numbers, serial numbers, and so on, and
    so on, we can often take a task that would require extensive manual drudgery and
    hand it off to'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'a computer, only needing to look at it when we want to see the results.


    We can also make use of even simpler tools, such as the strings utility, in order
    to carry out more general searches for information. In the case of the strings
    we can search for strings of text within files, such as a binary file or a document
    file. Strings can match against strings of a specified length which are followed
    by a nonprinting character, such as a space, newline, or carriage return. Although
    this sometimes returns nothing other than garbage strings of text from a file,
    it will often give us entries of potential interest. Fortunately, strings is one
    of the tools that lends itself well to scripting, which we will discuss later
    in this chapter.


    Being able to find patterned data in a large quantity of information is a very
    handy skill to have in the penetration testing world, and can be worth the effort
    we put forth to learn how to do it skillfully. This is also a great skill to learn
    in general, and can be applied in many technology-oriented situations, even outside
    the security industry.


    # Metadata


    Metadata has the potential to provide us with some excellent sources of information
    around which we can base our penetration testing efforts, from social engineering
    attacks to password guessing or cracking, in order to gain entry to a system.


    Metadata is about data. For example, if we look at a given file in most operating
    systems, whatever it happens to be, we will find information related to the file,
    but not specifically pertaining to the contents. These items of metadata may store
    the size of the file, the timestamps for creation, modification, or access, and
    other such items. Depending on the file type and the application that created
    it, we may also find a bit of other information stored in the metadata, such as
    the physical location where the file was created, as we may see in video files
    or pictures, or account names and file system paths in the case of many text documents.
    These two files often contain more interesting data.


    Document metadata can be a particularly fruitful source of data for'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'us in the course of penetration testing. The tools we use to create documents
    often keep a large amount of metadata stashed in our documents, invisible to us
    through the normal interface of the application. Although a careful user of these
    applications can generally clear out some portion of this data, such as the name
    of the document creator and a few other items of information, the document itself
    may hide quite a bit of data we cannot clear. This may include the full paths,
    for either the local file system or network locations, where the document has
    been saved in the past, often for the past several years.


    We can also generally find the names or usernames of the various accounts that
    have edited the document, a handy thing to have for a pen test. Additionally,
    we may be able to find previous revisions of some portion of the text within the
    document. This can also be very beneficial if the document has been edited for
    public release by removing sensitive information.


    Image and video metadata often stores an entirely different set of information
    than we find in documents, although certainly no less in quantity. From the devices
    that actually create such files directly, we will often find metadata embedded,
    which contains information about the image or video itself, such as the settings
    on the camera used to take the images. On devices equipped with a Global Positioning
    System (GPS) receiver, we can often find the coordinates at which the image or
    video was created as a portion of the metadata as well.


    Additionally, we may find other items handy from a general security perspective,
    such as the specific model and serial number of the device used to create these
    files. We will discuss how exactly we interface with metadata with various tools
    and scripts later in this chapter.


    # What Can We We Do With the Information?


    Once we have gone to all the trouble of researching and gathering information,
    to what uses we can put it? The answer to this question is many fold, and potentially
    complex, a couple of major uses themselves immediately: We can use this information
    for'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'social engineering efforts, and we can use it to do a bit of advanced footprinting
    of the environments and systems we will be testing.


    In social engineering efforts, this type of information can be invaluable. If
    we are able to harvest people''s names, account names, phone numbers, job titles,
    specific model numbers, or any of a huge set of other information, this begins
    to give us a framework on which to hang a social engineering attack. If we are
    trying to pass ourselves off as who works in the target environment and we can
    find out that Jim Jones actually goes by the nickname Sparky, we have a much greater
    chance of success in our efforts. Likewise for any other small details, we can
    pick up to make our social engineering attack more credible to those targets.


    On the technical side, we can also use our gathered information for the purposes
    of footprinting systems, environments, or networks.


    As we discussed earlier, we may be able to find information about equipment in
    use posted in job listings. At the least, we will often be able to find information
    regarding the particular vendors of the equipment in use, if not more specific
    information, such as models or revisions. This can often give us a starting place
    to begin looking for potential vulnerabilities we might put to use. The same is
    likely true for software in use and particular versions.


    Beyond this, we may be able to suss out information regarding the network structure
    by examining it from the outside, including the use of network tools to comb through
    DNS entries, examining the banners, headers, and other information displayed by
    Internet-facing servers providing email, Web, and file transfer capabilities,
    wireless networks, and any other portions of the infrastructure available to us
    from outside the environment.


    With much such tools, we can put together a collection of scripts to automate,
    screen-scrape, and generally ease the task of gathering and parsing the large
    amounts of data that will likely result from our efforts.


    # Talking to Google


    Google is an absolutely awesome tool for penetration testers. We may'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'think Google is just a search engine that gives us mostly porn results back
    when we ask it for something, but we just need to learn to be a bit more specific
    when we talk to it. If we finesse Google properly, we can soon have it handing
    back the results we are looking for, presuming we are present in the first place.


    Google indexes a truly staggering amount of information. In late 2015, the size
    of the Google page index was approaching 47 billion pages [1]. This means Google
    has indexed millions of resumes, blogs, job postings, random files put out on
    Web servers, and all manner of other miscellanea.


    In all this information, we can find bits and pieces that can be of great use
    to us in the course of a penetration test. It may seem like much of the information
    on Google is relatively useless trivia, but if we know how to ask for it, we can
    find all manner of interesting information.


    # Google Hacking


    The term Google hacking refers somewhat specifically to the general practice of
    using Google to find information that is of interest to those in the world of
    security, particularly penetration testers. When we engage in Google hacking,
    we make use of Google and the advanced search operators to find security flaws,
    insecure devices, passwords, reports from vulnerability assessments and penetration
    testing engagements, and all manner of other such data that should absolutely
    not be freely better material than a report from a vulnerability tool or a document
    outlining all the security flaws in the environment we, as a penetration tester,
    could hope to find.


    A great resource for Google hacking is Google Hacking for Penetration Testers,
    3rd ed. (ISBN: 978-0128029640, Sygress), by Johnny Long. This book walks through
    the basics of Google hacking, and includes quite a few tips and tricks along the
    way. This is overall a great read and shows us all manner of interesting bits
    and pieces we can make use of our Googling.


    Another fantastic resource we can use for such efforts is the Google'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Hacking Database (GHDB).¹ The GHDB is a regularly maintained repository of
    interesting information that shows up on Google, and the exact searches needed
    to find it. The major categories in the database are as follows: [2]


    +   * Footfoolds (examples of queries that can help a hacker gain a foothold into
    a Web server)

    * Files containing usernames (but passwords)

    * Sensitive directories

    * Web server detection (links demonstrating Google''s ability to profile Web servers)

    * Vulnerable files

    * Vulnerable servers

    * Error messages (silly error messages that reveal far too much information)

    * Files containing juicy information (but no usernames or passwords)

    * Files containing passwords

    * Sensitive online shopping information (including customer data, suppliers, orders,
    credit card numbers, etc.)

    * Network or vulnerability data (pages containing such things as firewall logs,
    honeypot logs, network information, IDS logs, etc.)

    * Pages containing log-in portals (log-pages for various services)

    * Various online devices (including things such as printers, video cameras, and
    other devices)

    * Advisories and vulnerabilities (i.e., vulnerable servers); these searches are
    often generated from various security advisory posts, and in many cases are product-
    or version-specific)


    In about three clicks from the GHDB page, we can be looking at plain text passwords
    sitting out on the Internet for the world to see, and a huge amount of other interesting
    information. Using the advanced operators for Google we will discuss in the “Advanced
    Operators” section, we can very easily narrow this information down to a particular
    target, a very handy capability to have in the penetration testing world.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Advanced Operators


    One of the main keys to searching Google is the use of advanced operators. Advanced
    operators allow us to be much more specific in our searching and will help us
    weed out the trash results that plague so many of our searches.


    There are a great many advanced operators of which we can make use. A good resource
    which shows many of these operators can be found at the GoogleGuide website, but
    even this is not entirely complete, and a few new or previously unknown operators
    crop up time to time. A few the main advanced operators we might want to take
    a look at site; filetype:, and link:


    The site is one of the handiest operators in the entire list, particularly for
    narrowing down our search results. This operator allows us to restrict our search
    results to a particular site or domain. Let''s say we are searching for a particular
    book on cyber warfare. If we go to Google and type "Cyber Warfare" book into the
    search field, we will get upward of 750,000 results back. This is quite a lot
    to wade through if we don''t remember the exact title of the book. If, however,
    we use the site: operator and type siteelsevier.com "Cyber Warfare" book, we will
    get something on the order of five or six results back, of which will point us
    exactly where we want to go. Much better.


    With the link: operator, we can take a look at pages that link to a particular
    URL. If we use our aforementioned book as an example, we will get link:http://www.synergy.com/hacking-and-penetration-testing/Cyber-Warfare/.
    We should get a few hits back. If we are still coming up with too many hits, we
    can use multiple operators in combination and add the lines of link:http://www.synergy.com/hacking-and-penetration-testing/Cyber-Warfare/
    sitesingress.com. We can also use operators here in a negative sense by adding
    a dash just before the particular operator. So, in this case, link:http://www.synergy.com/hacking-and-penetration-testing/Cyber-Warfare/
    -sitesingress.com would be looking for links'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'to our URL that specifically were not located on syngress.com.


    Lastly, let''s take a look at the filetype: operator. We can use the filetype:
    operator to find only files of a specific type, which can be handy if we are looking
    for targets from which to mine metadata, which we will talk about later in the
    chapter in more detail. We''ll choose a richer target and put together a search
    as site:elsevier.com filetype:doc. In this case, we looked on Elsevier.com and
    searched only for Microsoft Word documents. We should get back somewhere around
    600 documents with this search, a fairly solid body of material for our later
    mining efforts.


    A huge number of advanced operators exist for us to play with, and it is well
    worth the time to become familiar with them. Let''s see what we can do to put
    a little automation behind these and make them do a bit of work for us.


    # Automating Google Discovery


    Here we''ll putting together a quick and dirty Perl script to get us a listing
    of files from Google. In this particular script, we''ll be using Perl with the
    LWP::UserAgent module in order to handle our Web tasks. There are better and more
    elegant ways to do this, and we will be looking at some of them later in the chapter,
    but for now, this will get the job done.


    ```

    #!/usr/bin/perl

    use LWP::UserAgent;

    use HTML::Parse;

    $site = @ARGV[0];

    $filetype = @ARGV[1];

    $searchurl = "http://www.google.com/search?hl=en&site=%3A$site%3A$filetype";

    print "searchurl is " . $searchurl . "\n";n$useragent = new LWP::UserAgent;

    $useragent->agent("Mozilla/4.0 (compatible), MSIE 5.0; Windows 95)";

    print "useragent is " . $useragent . "\n";n$request=HTTP::Request->new("GET");

    $request->url($searchurl);

    $response = $useragent->request($request);

    print "response is " . $response . "\n";

    ```'
