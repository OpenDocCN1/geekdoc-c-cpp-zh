    # Netcat variants


    As we mentioned earlier, Netcat is an open source tool. This leaves open to the
    tinkering of the masses of programmers and would-be programmers who might feel
    inclined to retool it in order to add features, make changes, and so on. A large
    number of Netcat derivatives are floating about the Internet, let''s take a look
    at a few of them quickly to see what the differences are. Some of the more interesting
    variations are Socat, CryptCat, and Ncat, but this is by no means an exhaustive
    list.


    Socat¹ is an implementation of Netcat that provides several very interesting features.
    One of the more useful bits is that Socat can use a number of channels to send
