  md: '```

    portrule = shortport.port_or_service(79, "finger")

    action = function(host, port)

    local try = nmap.new_try()

    return try(comm.exchange(host, port, "\r\n")

    {lines=100, proto=port.protocol, timeout=5000})

    ```


    The beginning of the script, up to the point of the two lines, is all internal
    documentation and metadata. These lines provide a description of what the script
    does, provide several descriptive attributes, and display the usage for the script.


    The two require lines add in libraries for the script to access, libraries for
    communications and for building short port rules, respectively. We can find the
    full list of NSE libraries available for our use in Nmap documentation [2].


    We then set up the line for detection of our target service. The portrule line
    will look for the service operating on the port we specify, 79, or the service
    being named finger. Presuming our conditions for matching the service are met,
    we will execute the code in the action section.


    Here, we will set up a bit of error handling using try so that we can gracefully
    handle any errors. We then use comm.exchange to open a connection to the host
    and send a carriage return and line data. If the connection is successful, we
    will wait for 100 lines of data, or a timeout of 5 seconds, or for the target
    to sever the connection.


    This is an exceedingly simple script, and in the standard set of NSE scripts are
    considerably more complex. Given the example of the finger script to work from,
    and the excellent documentation provided with Nmap, we should be able to construct
    other simple scripts. Such scripts, however, barely scratch the surface of what
    we can do with NSE. For additional information, the best available resource is
    Nmap Network Scanning (ISBN: 978-0979958717, Nmap Project), by Gordon “Fyodor”
    Lyon. This book goes into great detail on Nmap in general and on NSE in particular,
