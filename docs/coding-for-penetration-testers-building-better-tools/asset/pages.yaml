  md: 'We could play with this idea a bit and expand our script to add other features
    as well. We could make recurse directories, so we can get documents present in
    subdirectories as well. We could make it search for specific file types based
    on an argument from the command line, instead of hard-coding the file type. We
    might also be able to combine this with another search tool, as grep, or include
    the use of a few regular expressions in order to search through our results.


    # Document Metadata


    When we are searching for document metadata, we can put together several of the
    resources we have discussed in this chapter to help us with the job. We can make
    use of Google (or other similar search engines), regular expressions, and text
    searching in combination in order feed documents through our data searching process.


    Using the advanced operators for searching Google we discussed earlier in the
    chapter, we can search for specific document types. For instance, if we only want
    to find a particular document type in a particular domain, we can use the filetype:
    advanced operator here in order to pull down these documents from our target domain.
    This gives us a great starting place and potentially a good set of documents which
    to comb.


    From here, we might want to use a few regular expressions in order to filter for
    particular types or patterns of data. This might be a good place to use some of
    the regex we talked about Chapter 3, Introduction to Perl. In particular, that
    will find email addresses, file system paths, network paths, and other similar
    information might be useful. It is possible we might find information of inherent
    value in this way, as credit card or Social Security numbers, but this is relatively
    unlikely in documents we have scraped off a public website, FTP server, and so
    forth. Although it never hurts to try, and generally doesn''t cost us much to
    do so with an automated process.


    Lastly, we can do a bit of general searching with something like strings, and
    just dump out all the text strings we can find in a given document. This will
    likely result in a certain amount of garbage, and may produce results that surprise
    us. We can certainly record the'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'results of such searches off to a report or set of files for later perusal,
    and may find we can pick out the occasional treasure from all the trash in the
    file. Documents from dedicated text manipulation software, in particular, as Microsoft
    Word or Adobe Acrobat, will tend to give us a rather large quantity of spurious
    results when we do this.


    # Metadata in Media Files


    In media files, we can find all manner of interesting metadata. We may be able
    to find data on the setting used on the camera or software that created or has
    been used to manipulate the image, geographic location information, thumbnails
    of the original image, and quite a few other bits of information. Given that the
    format of the file is largely binary-encoded data, the human-readable strings
    in the file are relatively easy to parse, even with the naked eye. This makes
    the job particularly easy for tools such as `strings`, or even grep, for that
    matter.


    If, e.g., we wanted to search through a list of images in order to find those
    that contained a particular item of information, such as a particular model or
    serial number of a camera, we could very easily do this with a short bit of script
    in bash. Let''s take a look at what we see in a JPEG file that was generated by
    a digital camera by running `strings` on it. In the case of the results shown
    in Fig. 8.5, we got back some interesting bits.'
