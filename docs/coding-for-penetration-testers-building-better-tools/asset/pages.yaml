- pgno: 119
  md: '# Gluing Applications Together


    Perl is often referred to as a glue language. We can frequently see examples of
    Perl code that exist solely to take the output of one application, perform some
    operation on the output, and feed the resultant data to another application. We
    might use such a technique to migrate data from one tool to another, to handle
    data formats from tools, to create reports incorporating data from a variety of
    sources, which we might find in a penetration test report, and other similar tasks.


    One of the situations we run across in the penetration testing world is the need
    to deal with the wide variety of output formats produced by the different tools
    we may be using. In an average penetration test we may use Nmap, Burp Suite, OpenVAS,
    and command-line tools such as dig and whois as custom-built tools. It is very
    common to need to pass data from one tool to another, or compile the data from
    multiple tools into a single format for a report.


    A great example of such a use for penetration testing can be found in the Nmap::Parser
    Perl module (we''ll talk more later in the chapter) that exists to provide an
    interface to the output from Nmap scans. In the case where we might want to perform
    an Nmap scan, and then examine the results of the scan and perform additional
    activities based on results, this bit of Perl code can considerably ease our task.
    For example, if we want to conduct an Nmap scan and then run the Web assessment
    tool Nikto against any targets that has a Web server operating on port 80 or port
    443, Perl can provide us with an easy route for doing so. We can certainly develop
    our own code to parse out the format of Nmap''s output files, but one of the chief
    attributes of any good coder/or penetration tester is a certain amount of well-applied
    laziness. One of the great things about using one of the common scripting languages,
    such as Perl, Ruby, or Python, to put together such solutions is we can stand
    on the shoulders of giants when assembling a solution.


    # Working With Perl'
