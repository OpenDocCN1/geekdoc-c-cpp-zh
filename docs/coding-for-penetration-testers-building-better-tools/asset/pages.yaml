- pgno: 205
  md: 'card numbers to health records, web security is one of the biggest areas for
    penetration testing today. In order to maximize the quality of a web-based penetration
    test, some scripting ability is almost always required. Whether it''s to catch
    the data from a XSS vulnerability or to add functionality to a website, scripting
    is a critical piece of a penetration tester''s toolkit.


    When a vulnerability assessment detects a remote file inclusion vulnerability
    in a Web page, or when exploits are chained on a remote server, a penetration
    tester can interact with the operating system through the Web server software.
    Being able to execute shell commands, manipulate file systems, communicate with
    databases, and communicate over sockets can be useful in leveraging a compromised
    Web server during a penetration test. With this in mind, this chapter focuses
    on web-based penetration testing. After discussing PHP code manipulation basics,
    the chapter delves into subjects that are crucial to a successful penetration
    test: saving data collected through PHP scripts, pulling data from other sources,
    and using the server running the PHP to help further access to the network. To
    tie everything together, the chapter concludes with details on how to build a
    basic PHP shell.


    In many organizations, web application penetration testing is seen as a specialized
    skillset, leading to two diverging types of penetration tests: network-based penetration
    tests and Web-based penetration tests. Although languages such as Python and Ruby
    have heavily leveraged network protocols, and binary manipulation, this chapter
    will focus on the Web application side of penetration testing.


    PHP is one of the first languages many Web programmers learn. A Google search
    for “PHP and MySQL” will yield more than 4 million results. While these tutorials
    are excellent for new programmers, they are also excellent for penetration testers.
    The cross section between websites on learning PHP and securing PHP is very small,
    which leads to many new PHP applications being vulnerable to attack. In this chapter,
    we will focus on some of the basics of PHP for penetration testers, and then look
    at two different ways that PHP is useful: remote file inclusion and data collection.'
