    | --- | --- |

    | \d | Digit character |

    | \D | Nondigit character |

    | \e | Escape |

    | \n | Newline |

    | \r | Return |

    | \s | Any whitespace character |

    | \S | Any nonwhitespace character |

    | \c | Tab |

    | * | Match 0 or more times |

    | . | Any character |

    | + | Match 1 or more times |

    | ? | Match 0 or 1 times |

    | (n) | Match at least n times |

    | (n,m) | Match at n times, but not more than m |


    We can test out our regular expressions and tweak them separately from our code,
