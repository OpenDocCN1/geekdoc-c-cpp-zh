  img_proc: true
- pgno: 372
  md: 'continue to run, goal-oriented penetration testing helps fill a business need:
    making sure the business can continue to function. Without the data and the skill
    to connect a found vulnerability to a serious business problem, we can''t hope
    to make this point within the scope of a penetration test.


    # Windows Shell Commands


    Windows is still the most prevalent operating system platform deployed in corporate
    environments. Being able to navigate the Windows operating system from the command
    line is a requirement for corporate penetration testing. We want to be able to
    investigate running services, determine network information, and manipulate users.


    # User Management


    Being able to enumerate local and domain users and groups, as well as add users
    to the local machine and the domain, allows us to create a beachhead for further
    attack on the environment. We want to have a number of shell scripts easily accessible
    during our penetration test so we can copy and paste these commands into shell
    sessions when we aren''t using a shell that supports local inclusion of scripts
    such as Metermeter.


    # Listing Users and Groups


    There are many ways to get user lists in Windows. We will concentrate on the net
    wmic commands. We will use these to work with users throughout this chapter. But,
    in this section, we will use them to query user information on the local machine
    and the domain.


    Using the net command, we will be able to manipulate users and groups, view network
    shares, and even manipulate services. In this chapter, we will concentrate on
    using this tool for user and group manipulation. If we have domain privileges,
    we can even use this command to manage domain users and groups. Let''s work on
    getting'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'simple user lists. To list the users on the system, we will use the net user
    command. As with most Windows commands, using the /* flag at the end of the command
    will display help information. Typing net user by itself returns information similar
    to Fig. 10.1, showing the list of users on the local system. If we wanted to see
    the domain users, we could add the /domain flag, and it would list out all the
    users in the domain.


    ```

    C:\WINDOWS\system32\cmd.exe

    C:\Users\sussurro>net user

    User accounts for \DESKTOP-90028H1


    Administrator      DefaultAccount      Guest

    sussurro

    The command completed successfully.


    C:\Users\sussurro>net user _

    ```


    # FIGURE 10.1 The output from “net user”. postexploitation task.


    Pulling user lists is typically an important postexploitation task. We can get
    information about what users are on what systems. If we see multiple systems with
    a common user on them, that user is a prime target for password attacks so that
    we can gain access to many more workstations.


    The net user command can also be used to pull information about a specific user.
    By issuing the command net user <userid>, we can pull all the information about
    a user from the command line, including group membership.


    We can get similar information from the wmic command. WMIC is an abbreviation
    for the Windows Management Instrumentation (WMI) Command-Line. The wmic command
    allows us to pull more specific information about the system than many other commands.
    For instance, if we wanted to know a user''s SID, an internal identifier, we couldn’t
    tell that from the net user command, but Fig. 10.2 shows how WMIC can be used
    to provide information.'
