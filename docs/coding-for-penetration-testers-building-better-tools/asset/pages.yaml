    To create these additional hives, we should not need any privileges being under
    the system. After each entry, we should be able to cd to the new Registry hive
    and view its contents with dir, similar to what is shown in Fig. 6.6.


    Once we are where we need to be in the Registry structure, we need to use a different
    command to lock the individual values within the key. Using dir will only show
    us the subkeys at any particular location in the hierarchy, not the values, which
    is somewhat counterintuitive.


