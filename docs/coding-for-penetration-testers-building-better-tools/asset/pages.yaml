  md: 'it is useful. Because many of the languages that penetration testers typically
    use have similar capabilities, and both syntax and execution will differ from
    one language to the next, this chapter also investigates the syntactical and conceptual
    differences in the scripting concepts presented in Chapter 1, Introduction to
    command shell scripting, and how they apply to the Python language. The text then
    moves on to describe the use of commonly installed modules to create a Web service
    status utility, a subnet calculator, and a basic password cracker. The chapter
