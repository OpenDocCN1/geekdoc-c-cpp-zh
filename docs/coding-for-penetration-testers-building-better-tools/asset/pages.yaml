    In Chapter 1, Introduction to command scripting, we spent a good bit of time discussing
    Microsoft''s PowerShell and how we can use it to develop shell scripts. Some of
    these scripts, if developed a bit further, could be useful for general tasks such
    as collecting information on hosts and the networks on which they reside. In this
    chapter, we will dive directly into the nitty-gritty of using PowerShell as a
    hacking tool.


    Until fairly recently, PowerShell was not generally seen as a tool that could
    be used for attacks. It has a very restrictive set of permissions that limit what
    we can run on a system, as we discussed in Chapter 1, Introduction to command
    shell scripting, and we have to relax these permissions in order to get even the
    most basic scripts and commands to run. In addition, we really can''t do much
    on a system with PowerShell without taking steps to disable these security measures
    ... or so it was thought.


    At DEF CON18 in 2010, David Kennedy and Josh Kelley gave a presentation [1] on
    PowerShell and discussed how it might be used as an attack tool, how we can bypass
    the security measures in place, and some of the interesting uses which we can
    put PowerShell in a penetration testing scenario. Given the efforts of Kennedy,
    Kelley, and the others who worked on the code discussed in this presentation,
    we are on a much better footing to use PowerShell in new and interesting ways.
    Let''s jump in and see what we can make PowerShell do for us.


    # Dealing With Execution Policies in PowerShell'
