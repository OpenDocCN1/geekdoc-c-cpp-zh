    many of the common application vulnerabilities, there is no reasonable way for
    such a set of information to include every piece of software or service that might
    be running in our environments. Particularly in the case where we are using services
    on nonstandard ports, or custom applications entirely, we would need to make use
    of NASL to either develop a custom plug-in or modify an existing to meet our needs.


    # Netcat


    Netcat can be a very useful tool to have handy in a penetration testing environment.
    We can put it to a staggering number of uses, as we talked about earlier in this
    chapter, moving files around running servers; nearly any simple task we might
    want to do over the network can be carried out in some fashion with Netcat or
    one of its variants. It is well worth time as penetration testers to spend a little
    time learning the ins and outs of Netcat, and to what purposes it can be put.


