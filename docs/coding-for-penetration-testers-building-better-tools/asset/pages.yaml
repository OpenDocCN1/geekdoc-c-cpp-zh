- pgno: 23
  md: 'Shell scripts allow penetration testers to do things like string together complex
    commands, develop tools, automate processes, and manipulate files—all while using
    a basic set of development resources. When penetration testers are attacking an
    environment, they cannot always choose their tools and sometimes they cannot install
    tools or utilities on a system. In such cases, being able to develop tools from
    native scripting resources can mean the difference between failure and success
    on a penetration test. This chapter discusses some of the basics of how to use
    the shells that currently exist in the UNIX, Linux, Mac OS X and Windows operating
    systems. The chapter concludes with a detailed explanation of how to build port
    scanning tools using scripting languages for UNIX-like operating systems and Microsoft
    operating systems.


    Shell scripts can be useful for a great things in the penetration testing world,
    in the system administration world, in the network world, and in almost any area
    that depends on computing technology to function. Shell scripts allow us to string
    together complex sets of commands, develop tools, automate processes, manipulate
    files, and more, while using a very basic set of development resources.


    Particularly in penetration testing, the ability to write shell scripts can be
    a highly necessary skill.


    # On Shell Scripting


    Unlike any programming language, we might choose to use, or any development tools
    we might like to have access to, we can almost always depend on some sort of shell
    being present on a system. While we may not always have access to the particular
    flavor of shell we like, there will usually be something we can work with.


    # What Is a Shell?


    A shell is the interface between the user and the operating system, allowing us
    to run programs, manipulate files, and perform a number of other operations. All
    operating systems use a shell of one type or another, some of them graphical and
    some of them text-based. Many'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'operating systems provide access to both graphical and nongraphical shells,
    and each is useful in its own way.


    A shell might consist of a graphical user interface (GUI), as in the case of the
    Microsoft Windows desktop interface, and Gnome or KDE on Linux. Such graphical
    shells are convenient, as they allow us to use fancy graphical icons to represent
    files, and allow us to interact with items by clicking them with a mouse.


    Text-based shells, such as that shown in Fig. 1.1, allow us to communicate with
    the operating system via a variety of commands and features built into the shell,
    as well as running other programs or utilities. Text-based shells are the ancestral
    user interface of many operating systems and still enjoy a great following today
    among the technically inclined.


    ![](img/42f332b2adf7dab7e681e5d6cdd2074c_24_0.png)


    # FIGURE 1.1 A text-based shell.


    On some operating systems, such as Windows, we are likely to find only the built-in
    graphical and text-based shells, although we may potentially find more added by
    a particularly technical user. On'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'UNIX-like operating systems, such as the many varieties of UNIX and Linux,
    or OS X, we may find a wide variety of graphical and text shells. This broad choice
    of interface is very common on such operating systems, and we may find that the
    users or administrators of the system have customized heavily in order to suit
    their particular tastes. Commonly, however, we will find at least Gnome or KDE
    as a graphical shell and bash as a text-based shell. For purposes of penetration
    testing, text-based shells tend to be the more useful for us to access.


    # What Is a Script?


    A script, short for scripting language, is a programming language like any other,
    and may be similar in nature to other languages such as C++ or Java. The primary
    difference between a scripting language and other programming languages is that
    a program written in a scripting language is interpreted rather than compiled.


    When we look at a traditional programming language, such as C++, the text we write
    defines the commands we want is processed through a compiler and turned into machine
    code that is directly executable by the kernel/CPU. The resultant file is not
    humanreadable. Any changes to our commands mean we have to send the changed text
    through the compiler again, resulting in a completely new executable. In interpreted
    languages, the text we create that contains our commands is read by an interpreter
    that does the conversion to machine code itself, as it is running the script.
    The text here is still human-readable and does not have to be recompiled if a
    change is made.


    Normally, scripting languages have their own interpreters, so we need to install
    a separate interpreter for Python, another for Ruby, and so on. Shell scripts
    are a bit of a special case, as the scripts are interpreted using the shell itself,
    and the interpreter is already present as part of the shell.


    # Note'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The various languages we discuss in the course of this book, including shell
    scripts, Python, Perl, Ruby, and JavaScript, are all interpreted languages. With
    many scripting languages, multiple interpreters are available from different vendors,
    often with somewhat different behaviors and sets of features. Additionally, different
    versions of the same interpreter from the same vendor may substantially change
    the way a given script functions, or render it nonworking entirely.


    Scripting languages are used daily in the execution of many tasks. We can see
    scripting languages used at printers; in the case of the Printer control language
    (PCL) created by Hewlett-Packard [1]; in JavaScript, PHP, and the many others
    that are used to generate the feature-rich Web pages we enjoy today; and in video
    games, such as Angry Birds or the Crisis series that make use of Lua [2].


    A great number of scripting languages are available on the market, with more being
    created all the time. Some of the more useful languages become widely adopted
    and enjoy ongoing development and community support, while others are doomed to
    be adopted by only a few stalwart developers and quietly fade away.


    # Shell Scripts


    One of the most basic and most commonly available tools we can add to our penetration
    testing development arsenal is the shell script is a program, written in a scripting
    language, which is used to interface in some way with the shell of the operating
    system we are using. While it is possible to script our interactions with a graphical
    shell, and indeed there are many programs and utilities that will allow us to
    do so, the term *shell* is commonly used to refer to programs that interact with
    text-based shells.


    As we discussed earlier in the chapter, scripts are processed and executed by
    a utility called an interpreter. In the case of shell scripts, our script is interpreted
    directly by the shell and, in fact, there is often no difference in the tools
    used to process our shell scripts and those'
  merge: -1
  img_proc: true
