- pgno: 239
  md: 'As mentioned in this chapter, and discussed in Chapter 1, Introduction to command
    shell scripting, there are execution policies that dictate what we can do in PowerShell.
    In Chapter 1, Introduction to command shell scripting, we had to change the execution
    policy to RemoteSigned in order to work with our scripts, but we didn''t really
    talk about the individual policies, or what exactly each of them does. We will
    go over that now.


    # Execution Policies


    There are four execution policies: Restricted, AllSigned, RemoteSigned, Unrestricted,
    and Bypass. The Restricted policy, which is also the default execution policy,
    prevents us from running any PowerShell scripts, but does allow us to use the
    shell interactively. AllSigned policy allows us to run scripts that have been
    digitally signed by a trusted publisher. The RemoteSigned policy allows us to
    run scripts that we have created, but scripts we download must be digitally signed
    by a trusted publisher. The Unrestricted policy carries no restrictions at all,
    and allows us to run unsigned scripts from any source but will warn when a script
    has been downloaded from the Internet. The Bypass policy allows us to run scripts
    from anywhere, and will execute the scripts without regard to the source. These
    execution policies can be changed in the manner we discussed in Chapter 1, Introduction
    to command shell scripting.


    The signing on which some of the execution policies refers to the digital signatures
    on the scripts themselves. The signatures need to come from a trusted publisher
    in order to bring them into compliance with the various execution policies.


    # Tip


    We can actually create a self-signed certificate to use for signing our scripts,
    but we will still get a warning when the script runs, at the very least for the
    first time. This is a bit of an involved process, but articles and tutorials are
    available on the Internet that will walk us'
  merge: -1
  img_proc: true
