- pgno: 12
  md: '# About the Authors


    Jason Andress (ISSAP, CISSP, GPEN, CEH) is a seasoned security professional with
    a depth of experience in both the academic and business worlds. Presently he carries
    out information security oversight duties, performing penetration testing, risk
    assessment, and compliance functions to ensure that critical assets are protected.
    He has taught undergraduate and graduate security courses since 2005 and holds
    a doctorate in computer science security, researching in the area of data protection.
    He has authored several publications and books, writing on topics including data
    security, network security, penetration testing, and digital forensics.


    Ryan Linn (OSCE, GPEN, CCNP Security, CISSP) is Director of Advanced Tactics and
    Countermeasures, part of Nuix’s Cyber Threat Analysis Team. With nearly 20 years
    of experience in information security, he has led high-performing teams in conducting
    advanced attack simulation and penetration testing for corporations in all industry
    verticals, including Fortune 100 organizations. He previously worked as a database
    administrator, Windows and UNIX systems administrator, network engineer, web application
    developer, systems programmer, information security engineer, and penetration
    tester. He is an established security researcher who programs for various open
    source projects including Metasploit, Ettercap, and the Browser Exploitation Framework.
    He has spoken at numerous security conferences and events, including Blackhat
    and DEFCON, and has presented to the United States Secret Service Electronic Crimes
    Task Force. He is also an adjunct professor at Southern Utah University.'
  merge: -1
  img_proc: true
