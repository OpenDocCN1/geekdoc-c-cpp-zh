    As they do, more and more data is moving to be Web accessible. With this move,
    the security of the Web services that host the data becomes more crucial.


    SQLi vulnerabilities have been around for a long time, but they still make their
    way into applications. Data, personal information, and other sensitive information
    being stored in Web apps, penetration testers need to be able to assess the security
    of Web applications and be able to create Proofs of Concept (POCs) to help application
    developers understand the severity of SQLi vulnerabilities and how they work.


    This section focuses on SQL vulnerabilities and the basics behind the exploitation
    and postexploitation of these vulnerabilities. Focusing on MySQL and Microsoft
    SQL, we will look at different ways to take advantage of these SQLi vulnerabilities
    to bypass security, determine what data exists, and extract it. In some cases,
    we can even use SQLi vulnerabilities to launch a shell.


    # What Is SQLi?


    SQLi, like many of the other Web vulnerabilities we examined in Chapter 9, Exploitation
    scripting, is a result of poor input sanitization. SQL takes place when user input
    is added to a string that is sent to a server that understands Structured Query
    Language (SQL), and that input has information that is interpreted by the SQL
    server instead of being seen as data. For instance, if a query is looking for
    data and the author expects someone to type in a word, such as Ruby, but instead
    the user types in SQL code, that code may be interpreted by the SQL server and
    executed.'
