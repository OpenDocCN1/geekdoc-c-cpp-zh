    Everything else on a line is not interpreted by Python, but is instead considered
    to be a comment from the author about how a reader would interpret the information.
    Comments are never required, but they sure sure easier to figure out what we did
    last night. We can create multiline comments using three double quotes before
    after the comment. Let''s look at an example.


