    system through a Web page, allowing us to take a Web vulnerability and leverage
    it to get higher levels of server access. There are three basic ways we access
    files. One is to include another PHP file in order to execute additional commands.
    The other two deal with either fetching or putting data into a file in the file
    system. Let’s investigate loading other PHP files first.


    To begin, let’s create two files. In our first file, we will call test.inc, in
    our second file, we will include that file in order to have it execute the PHP
    code. Into our second file, called test.php, we will insert the code <?php include(''test.inc'');
    ?> Now let’s execute our test.php code. When we run test.php we should see our
    hello world statement. We have just executed code from another file in use. There
    are four different ways to include files like this. They are include, require,
    include_once, and require_once. The include functions will try to include the
    other files, but if they fail will return a warning. The require statements will
    stop execution if the file cannot be included. The two once variants are designed
    so that if we try to include a file that has already been included, the file won’t
    be included a second time, but the function will still return successfully.


