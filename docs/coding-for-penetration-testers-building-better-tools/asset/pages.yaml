  md: '# Tip


    PyPI, The Python Package Index, at http://pypi.python.org/pypi, can be used to
    find additional Python modules. Python modules can be searched, downloaded, extended,
    and contributed back. When we create modules that can benefit others, this is
    a great place to contribute back to the Python community.


    In the Kali distribution, go to the /usr/lib/python2.7 directory to see all the
    available Python modules.


    # Reusable Code That Is Easy to Create


    Code reuse is critical to productive scripting, and Python includes a number of
    ways to do this easily with functions, classes, and modules.


    Functions allow small sections of code to be reused within a particular script,
    and they can be constructed so that they can be copied easily from script to script.


    Classes can be created to have a set data structure with functions to deal with
    that data structure. These classes can be copied from one script to another in
    some cases, while others may be large enough that they are required to be in their
    own module. By using classes, we can keep our functions and data portable without
    worrying about what functions we might have missed.


    Modules usually encompass one or more classes and the functions that are required
    to work with them. By using a module, we don’t need to copy code at all. If the
    module is installed, we have everything we need to work with the classes in that
    module. We also use modules to share code with others.


    # Python Basics


    In Chapter 1, Introduction to command shell scripting, we looked at many of the
    basics of scripting. We covered loops, conditionals, functions, and more. Many
    of the languages we will have similar capabilities, but syntax and execution will
    differ from one language to'
