    These hives are present in most Windows operating systems, with some slight variation
    depending on the specific version in use, and some hives not being accessible
    outside of application program interfaces (APIs).


    PowerShell presents us with a very interesting and convenient interface to the
    Windows Registry. PowerShell displays the Registry as a file system, and we can
    use the `cd` (change directory) command to access it, using the abbreviated names
    listed earlier, just as we would any other portion of the normal file system:
    e.g., `cd HKLM`. Once we are there we can use `dir` the keys under `cd HKLM`.
