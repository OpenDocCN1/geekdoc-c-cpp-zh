    we can''t see the output, though, how do we know it is running? One way to determine
    if SQLi is working when we can''t see it is by using a timing approach. This is
    called blind SQLi we cannot see what is happening; we have to determine success
    in other ways. To check to if xp_cmdshell is running, we can use the ping command.
    But why ping? sends one packet per second by default. So, if we send out five
    packets, we should expect the execution of the script to hang for 5 seconds. Let’s
    formulate a new SQLi string with the xp_cmdshell syntax.


