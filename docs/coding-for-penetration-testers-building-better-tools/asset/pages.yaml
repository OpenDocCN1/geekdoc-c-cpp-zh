  md: '# Looping


    Looping in Perl is, similarly to the conditional statements we discussed, comparable
    to what we saw when constructing shell scripts for bash in Chapter 1, Introduction
    to command shell scripting. The basic structure of our most common loop, the for
    loop, is:


    ```

    for (starting value;test;alter value) {

    #code goes here

    }

    ```


    So, if we wanted to do something simple like count to 10, we could set up a loop
    similar to this:


    ```

    #!/usr/bin/perl

    for($counter=1;$counter<=10;$counter++) {

    print "the counter is \ $counter, "\n"

    }

    ```


    In order to use the for loop, we set our variable $counter to 1, indicating the
    starting place for our loop. We then set up our test, checking to see whether
    the value stored in $counter is less or equal to 10. Lastly, we increment the
    value in the counter by 1, using $counter++.


    Let''s make our ping code from earlier in the chapter a bit more functional. We
    can use a bit of looping to turn our single-shot tool into a ping sweep tool.
    This is going to get a bit heavier quickly, due to some magic we need to perform
    in order to increment IP addresses properly, but hang in there, we''ll walk through
    the script and explain it all.


    ```

    #!/usr/bin/perl

    use Net::Ping;

    $ip1 = @ARGV[0];

    $ip2 = @ARGV[1];

    $rawip1 = get_raw_address($ip1);

    $rawip2 = get_raw_address($ip2);

    for($counter=$rawip1;$counter<=$rawip2;$counter++) {

    $host = get_ip_address($counter);

    $pinger = Net::Ping->new("icmp", 1, 64);

    if($pinger->ping($host)) {

    print "\$host is up\n"

    } else {

    print "\$host is down\n"

    }

    ```'
