    those problems and either recover or present nicer error messages from the stack
    traces that are shown when something breaks and we don''t expect it. The core
    elements of exception handling are the try and except keywords. The try block
    of code is what we are going to try to execute. If an error occurs in our try
    block, we have an except statement to handle it. Two other elements may appear
    in exception handling blocks are else and finally. The else keyword is used for
    code that should run if no exception is'
