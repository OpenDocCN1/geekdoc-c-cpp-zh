    handy in certain penetration testing situations. PowerShell has access to all
    the functionalities of .NET and can give us capabilities that we might not otherwise
    have in such an environment without needing to upload tools to the system. We
    go over execution policies, taking control of the processes on the system, interfacing
    with the event logs, tweaking the Registry, and more, all through the tools tools
    provided by the operating system.


    Keywords

    PowerShell; penetration testing; .NET; execution policies; processes; registry


    # INFORMATION IN THIS CHAPTER


    +   * Dealing With Execution Policies in PowerShell

    * Penetration Testing Uses for PowerShell

    * PowerShell and Metasploit


    Up until a few years ago, PowerShell was just a systems administration utility.
    When the Pen Tester community learned more about the tool, it has become one of
    the most powerful tools for both pen testers and malicious attackers. PowerShell
    is an incredibly flexible tool that has built-in functions that support systems
    administration, interaction with remote systems, and can even access'
