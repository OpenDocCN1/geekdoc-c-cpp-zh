- pgno: 375
  md: 'we wanted to get all the user information about every user? With a for loop
    in the Windows command shell, we can combine wmic and net user to get extended
    information about all the users on the system. To begin with, we launch a cmd.exe
    shell as Administrator by typing cmd.exe in the search bar of our taskbar and
    then right clicking the cmd.exe binary and choosing "Run as Administrator. Then
    we issue the command:


    ```

    for /F skip="i" in (''wmic useraccount get name'') do net user %i > c:\users.txt

    ```


    This iterates through each user on the system obtained from wmic useraccount get
    name, and issues a net user command for that. The output of wmic useraccount get
    name is assigned to the %i variable. The skip=1 instruction tells the for loop
    to skip the first line. For each account name listed, the net user command gets
    the information for the account, and the >> operator tells the output to be appended
    into the users.txt file.


    By appending to a file, we accomplish two things: the first is having a single
    file that we can download from the system with all the information we need, and
    the second is that only successful queries will be logged to the file. Any error
    messages or status information will be printed to the screen instead. This gives
    us a clean way to have all the users in the system so that we can download the
    information and review it later.


    Now that we have methods for listing users, let''s look at groups. Groups are
    even more important than users, as they let know which users are more important
    than others. While this isn''t a value statement on the people involved, there
    are definitely accounts that are more interesting to us from a standpoint point
    than others. The net localgroup and net group commands will help us find these
    users.


    The net localgroup allows us to get information about groups local to the machine
    we are on, while the net group command is used to get information about groups
    in the domain. The net localgroup command works much like the net user command;
    if we don''t specify an argument lists the groups on the system, but if'
  merge: -1
  img_proc: true
