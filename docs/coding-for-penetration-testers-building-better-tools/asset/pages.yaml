  md: 'for the SECURITY folder, which is normal for most Windows operating systems
    starting with Vista. From here, we can browse around in the portion of the Registry
    that exists under HKLM.


    For those of you jumped ahead and tried to navigate to all the different Registry
    hives, we might have found that only two of them are immediately accessible: HKLM
    and HKCU. These are the only hives that PowerShell configures by default. Fortunately,
    we can create the others with no great deal of effort:


    ```

    New-PSDRIVE -name HKCC -PSProvider Registry -Root HKEY_CURRENT_CONFIG

    New-PSDRIVE -name HKCR -PSProvider Registry -Root HKEY_CLASSES_ROOT

