  md: '# Getting In


    In order to put any of our PowerShell goodness to use, we first need to find a
    way onto the system. Depending on exactly what we want to do when we are on the
    machine, we may also need administrative access. There are a number of tasks that
    we can carry out just using the permissions of a standard user account, such as
    ping sweeping or port scanning, as these only require the normal level of access
    that any account has. In order to change settings or carry any actions on the
    system that we will likely need the same access from PowerShell.


    In this chapter we''re going to look at how to interact with PowerShell over the
    Windows Remote Management interface, WinRM. We will be able to set up WinRM on
    our test system, but many enterprise systems will already have installed. Once
    it is set up, we will look at how to interact with it from Kali.


    # Setting Up a Windows 10 System


    Before we can compromise our system with PowerShell, we first need to take our
    standalone Windows 10 workstation and enable remote administration. To do this,
    we will need to enable WinRM, the Windows Remote Management interface.


    ```

    winrm quickconfig

    rm set winrm/config/service/auth ''@{Basic="true"''

    rm set winrm/config/client/auth ''@{Basic="true"''

    rm set winrm/config/service ''@{AllowUnencrypted="true"''

    -Item WSMAN:\localhost\TrustedHosts -value ""

    ```


    These commands will configure WinRM and then it will set some overrides that normally
    would not have to be in place. These commands will let us interact with WinRM
    as if we were part of a trusted host in the domain. Typically, if we were going
    to interact with one of these services we would be allowed to use Kerberos authentication
    as part of the domain, but as we have no domain, we have to cheat a bit.


    Now we need to set up our Kali image to be able to interact with WinRM. We are
    going to use a Python module called “pywinrm.” To'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'install it, we issue the command "pip install pywinrm" in Kali, and we will
    go out and fetch the requirements.


    Next we want to build a sample script to verify that we can connect. We want to
    be able to verify that we were able to both connect and execute a PowerShell script.


    ```

    #!/usr/bin/python

    import winrm

    # Place Script Here

    script = ""

    whoami

    """

    ses = winrm.Session(<host IP>'', auth=(''<username>,<password>''))

    r = ses.run_ps(script)

    print r.std_out

    print r.std_err

    ```


    This script begins with importing the winrm command so that we can interact with
    our remote Windows 10 system. We then create our script which just has the command
    "whoami" to print out who we are authenticated as. Finally we create a new session
    with the Session command. That session is then used to run our script and the
    return information is stored in our return variable, "r." This return variable
    has three pieces of information about the command that was run: the status_code,
    the std_out output, and the std_err error output. We print the output of both
    std_out and any errors that occurred. We save the script as "connect.py" and when
    we run it, we should see output similar to Fig. 6.1.'
