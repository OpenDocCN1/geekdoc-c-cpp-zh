    This chapter focuses on how PowerShell can be handy in certain penetration testing
    situations. After discussing the execution policies and the code for bypassing
    them, the chapter talks about how to get on the system and what can be done with
    PowerShell once there. it goes over some example uses for PowerShell, such as
    controlling processes and services, interfacing with the event logs, getting and
    sending files over the network, and interfacing with the Registry, and then closes
