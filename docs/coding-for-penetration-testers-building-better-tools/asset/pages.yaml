  md: 'To establish our connection to the database we use the establish_connection
    method of the ActiveRecord Base class. We pass in three named options: the adapter
    we will use, the username, and the database we connect to. In this case, we will
    continue to use our PostgreSQL connection and use "test" as the username, the
    password, and the database name. We now have set up our connection to the database.
    Further actions with ActiveRecord won''t have to specify any of this information;
    it will be implied.


    Let''s set a wrapper around the people table. We did something subtle to prepare
    for this situation by naming our table people. ActiveRecord helps us understand
    much of what is going on in the database, but one piece converts our data into
    objects. ActiveRecord uses plurals to help describe what a table holds. Just as
    in English, if we had a group of persons, we would refer to them as people. The
    same is true with ActiveRecord. We have a table with person data in it; then,
    when we reference a Person object, ActiveRecord knows it should look in the people
    table to find information about that Person. The same would be true for a table
    that stored data about gnomes. The table itself would be called Gnomes, but each
    object would be a Gnome object. Now that we understand how the table is set up,
    let''s set our class and pull all the records from the database.


    ```

