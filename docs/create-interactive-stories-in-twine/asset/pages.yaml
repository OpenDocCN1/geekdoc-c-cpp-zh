- pgno: 28
  md: '# # One Step Forward


    15–20 minutes Idea sheet, sticky notes, pencil


    # ## Activity Overview


    With your bookends and touchstones in place, now you can start building your story
    and game by slowly filling in the connections between the starting block, the
    touchstones, and the ending block. Where you start is up to you. You can begin
    from the starting block, moving forward in the story, or you can start from the
    ending block and move backward. In fact, you''ll probably do a little bit of both!


    # ## Instructions


    For now, let''s start at the beginning of the story. To do this, you need to start
    thinking of decision points and what could happen next in your story. What are
    some things the reader can do?


    Decisions are any of the things that the players may decide to do in that moment.
    The results of that decision will move the story forward and have them choose
    a new page to move to. The decisions can be actions, such as pressing a button
    or retrieving an item. They can be inactions, like not speaking, or waiting. As
    you get comfortable with making stories, you can get creative with what types
    of decisions you present to your readers!


    For your first CYOP story, think of two things you could give the readers the
    option of doing. One would move them forward, while the other would either lead
    nowhere or take them to trouble. Looking back at the example starting block, I
    had the players wake up in a small, one-room cottage. They see some things around
    the cottage and they hear singing outside.


    For the example, I want the singing to trick the players. So I think I will have
    the singing coming from a dangerous wood elf'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'who inhabits a nearby tree. But the players don''t know that yet. If the players
    rush out to check out the singing unprepared ... well, let''s just say their stories
    will end quicker than they expected. They will need to examine the room first
    and find the walking stick in the cottage if they want to defend themselves.


    So just to the right of the starting block, I will make two new blocks, one above
    the other. For each block, I will draw an arrow from the starting block. The direction
    of the arrow lets me remember where the decision is coming from and the result
    leads to.


    One block will be to look around the cottage; the other will be to investigate
    the singing. To help me remember at a glance, I put the gist of the action as
    a title at the top of the block, and then a few sentences about what happened
    for each. As you can see, if the players choose to examine the cottage, they will
    find the walking stick. And if they choose to run outside, they will suffer a
    terrible fate (oh no!).


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_1.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_2.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_3.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_4.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Now, look at your starting block and think about the initial choices the players
    can have and where each will lead them. Keep it simple for now and have it be
    a choice between just two options. Later on, you can begin to explore more than
    one choice, but let''s keep it simple for your first run.


    Another option is to present a single decision, which will present two choices
    to the player: to do something or not to do something. Either choice will have
    consequences!


    Once you have your choices, place blocks similar to mine to the right of your
    starting block. Give them titles and write in some details on what will happen.
    Don''t forget to draw the arrows from your starting block to your new blocks so
    you remember the direction of the action!


    # One Step Back


    +   - 10–15 minutes Idea sheet, sticky notes, pencil


    # Activity Overview


    Another approach is to start from the final event and work backward, thinking
    about what needs to happen just prior to a later event.


    In the example of my story, I needed to defeat the warlock on top of the mountain.
    So I need to think: What happens before the warlock is defeated? Well, in order
    to get past the warlock, I need to speak the words of power. And before I can
    do that, I need to get to the top of the mountain.


    # Instructions


    Think about your ending and what the players might need to do just before they
    reach that ending. Place a block just to the left of'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'your final block. Like your earlier blocks, give the block a name and fill
    in details about that moment and events. Because it is a decision point, draw
    a line from this block to your final block. What other decisions could you present
    to the reader that would take them away from defeating the wizard or would end
    in defeat?


    As a designer—and you''re a real one now—it can be helpful to be able to think
    forward and backward as you work on your game. Remembering your starting point
    as you fill in the rest of the events will make it easier to help your story connect
    and get from that starting point to the end of the game!


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_31_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # Funky Fiction Flow


    Up to now, you have been thinking about moving your game forward as the readers
    make the correct choices at their decision points.


    This is a great start, but you can use some different tools that allow the players
    to maintain the progress they made while also introducing interesting choices
    into the game. The next three activities are meant to give you some more tools
    for your arsenal of awesomeness to draw from when building your game!


    # # Getting Loopy


    +   - 10–15 minutes Idea sheet, sticky notes, pencil


    # ## Activity Overview


    So far, you''ve created some simple decision points in your game, letting the
    players choose between a few options. One choice moved the players forward, the
    other ended the game and they would need to start over.


    There may be times when things end so horribly that the players need to start
    over from the beginning. But if every wrong choice forced the players to have
    to start from the beginning, players might get tired of having to go through the
    same material again and again as they try to reach the end of your game. That''s
    a problem!


    # ## Instructions


    Take a look at the block you placed just before your final block. Think of a decision
    that players could make that would not move them to the end but also wouldn''t
    force them to start over.


    For example, in the example right before I defeat the warlock, I need to speak
    the words of power to weaken him. Speaking'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'the words of power moves forward in the story to where I defeat the wizard.
    Maybe at the block just prior, I can add another choice to throw a rock at the
    wizard. Because players are so close to winning, I don''t want to just end the
    game by choosing wrong, so I can loop them back to the block where they need to
    choose what to do to defeat the wizard


    So, I can add a new block between the final block and the one where I made the
    choice. I have a new outcome, and so I would draw an arrow from the decision block
    to this new outcome block. In this block, I can write that the rock bounces harmlessly
    off the wizard and I better think of something more effective. I can then draw
    an arrow from this block back to the block that I made the decision. This, as
    you can probably tell, creates a loop!


    If the players choose to throw the rock, they learn that it didn''t work well
    and they are brought back to make a different decision. This is explained by the
    path of the arrows, so look closely!


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_1.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_2.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_3.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Look at your last decision choice just before your final block and think of
    an alternate choice that won''t end the game. Add a new sticky note, giving it
    a title and notes about what happens. Don''t forget to draw an arrow to the note
    from the decision point and then another arrow back to the decision point!


    # A B C, Easy as 1 2 3


    +   - 10–15 minutes Idea sheet, sticky notes, pencil


    # Activity Overview


    Let''s keep working with the last decision block before the finale and introduce
    one more tool. Right now, you should have two decision points on that sticky note
    and two arrows leading out to two sticky notes that are the results of the decision.


    # Instructions


    You can have more than just two options for decisions, so let''s introduce a third
    choice. In our example, there could be another option when trying to defeat the
    wizard. Maybe the player can choose between speaking the words of power, throwing
    a rock, or running away in terror.


    As you guessed, I would add a new sticky note and write that the wizard casts
    a fireball at me behind, and I disappear in a puff of smoke, ending my game and
    resetting the story. Because I am at the final part of my story, though, I could
    instead introduce an alternate ending. I could write that the wizard casts a transformation
    spell and I spend the rest of my short life living as his pet mouse.


    You aren''t limited to just three decisions, but keep in mind that the more decisions
    you introduce at a single time, the more'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'you will have to keep track of. That can get challenging quickly, especially
    in your first story!


    Take a look at that last decision block and write down a third decision point
    on the sticky note. Add a new sticky note to the right, adding an arrow to that
    sticky note from the decision block. Write down the title and the new outcomes.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_1.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_2.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_3.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_4.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_5.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_6.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_7.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_35_8.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Branchy McBranchface


    10–15 minutes Idea sheet, sticky notes, pencil


    # Activity Overview


    One of the ways in which you can use your decision points is to create a branch,
    or an alternate path that still continues your story forward and eventually meets
    back up with the main story line.


    For example, maybe early on in the wizard story, there''s a point where the players
    can choose between two paths, both of which could eventually lead them to the
    old pixie who gives them the gold. The players could literally be at a crossroads
    that forks left and right. Taking the left fork would lead to an old bridge they
    must cross and a troll they defeat defeat before get to the pixie. The right fork
    will get them ambushed by robbers, and they will need to past past to get to the
    elf.


    # Instructions


    Introducing forks like this makes your game more interesting and also makes your
    game replayable, because now if the player goes through your game and chooses
    a new path, a whole new part of the story opens up!


    Despite the advantages, introducing a lot of paths can make it complicated to
    design your game. Early on, maybe just use one until you get comfortable putting
    the entire game together.


    Take a look at your second sticky note, the one that comes right after your first
    decision point. Think of how you can create a branch with just a single step before
    you bring the story back to the main story path.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/3760f220c9ee3ac581049b311bdc3cc4_37_0.png)


