- pgno: 12
  md: '# STARTING ANALOG: AKA, KICKING IT OLD SCHOOL


    Take one part game and one part story, then throw them in a blender. The goopy
    concoction that comes out is what we call interactive fiction. Mixing narrative
    and games is not unique to Twine. Most video games and tabletop games have some
    form of story that goes along with the gameplay. While many people first think
    of the epic tales found in video games franchises like The Legend of Zelda, World
    of Warcraft, and The Elder Scrolls, nondigital games also have a story of their
    own. Whether you are building your property empire, clashing with other landowners
    in Monopoly, raising a family and growing your farm in Agricola, or hosting an
    epic fantasy campaign in Pathfinder, nondigital games offer a variety of experiences
    that allow players to become a part of story.


    Those examples are games that tell a story through play. Interactive fiction is
    a story that provides a game as you go through. In their simplest form, interactive
    fiction games are very close to standard stories. At certain points, important
    or interesting decisions are made. But, those decisions are not made by the characters
    in the story. Instead, they are made by the reader—imagine that! It''s the readers
    who decide the direction that the story goes, and they make those decisions as
    they explore and play through the story. These decisions can be as simple as choosing
    between which one of two doors to enter. Or, the decisions can be more complex
    and require multiple steps to complete. Good interactive fiction stories will
    provide prompts and hints to help the player make the right decisions and make
    it to the end. Because whoever wants to fail to complete the story?'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'As a designer, it''s your job to strike a balance between telling a good story
    and making a good game. To do that, you need to know there are some hidden parts
    of stories and games that make them good.


    Now comes the part of the book when I throw a whole bunch of concepts at you.
    All of these play an important part in building good interactive fiction games.
    Don''t stress yourself on trying to achieve all of them, but try to keep them
    in mind. As you build more games, there''s no doubt you''ll get better at incorporating
    them into your designs! For your first few designs, try to just focus on one or
    two elements. As you get more comfortable, expand your designs to incorporate
    more. Soon, you''ll be a master!


    # Story Concepts


    There are five very important parts that help a story come together and allow
    the reader—who is, in our case, also a player—follow along. Those parts are character,
    setting, plot, conflict, and resolution.


    +   - Characters (and items): These are the people and things that the players
    interact with as they move through your game. Some are important to the story,
    while others just add flavor.

    - Settings: These are the places where your story takes place. Some stories have
    a lot of places, while others just use a few. The setting should make sense with
    what your story is about. If you''re creating a game that takes place in space,
    the settings should match!

    - Plot: This is the heart of your story; it is the main idea that your story is
    about and the sequence of events that happen. There may be smaller, unrelated
    events that happen in your story, but the plot is the main set of events that
    your game is really about.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '+   * Conflict: This is the thing (or *things*) the players must overcome in
    the game. Conflict creates the challenges and obstacles that the players must
    overcome. The players may need to defeat an evil wizard. To do that, they will
    need to craft a magical item, which requires collecting a number of items. The
    conflict should connect to the plot—they should drive each other. Stories, and
    games, can have more than one conflict!


    +   * Resolution: This is how the players solve the main conflict in the game.
    In interactive fiction, there can actually be multiple resolutions depending on
    the choices made by the players in the game. They may defeat the evil wizard,
    or they may be turned into a pile of goo. You get to decide what happens—and why!


    # # Game Concepts


    There is a huge number of parts that go into making a game fun and engaging, but
    I will focus on five for you here: goals, challenges, exploration, progress, and
    choice.


    +   * Goals: These are the things that the players need to accomplish in the game.
    These are pretty similar to the conflict and resolution story elements. If you
    think the player needs to defeat the evil wizard by collecting some different
    items to craft a magical item, you have identified your game goals! You can add
    in additional game goals that players need to do too, and it''s up to you how
    simple or complex your game is going to be. The more goals, the more complex the
    game becomes. When you are first starting out, it is good to have just a few goals.
    As you get more comfortable designing games, you can begin to add more!


    +   * Challenges: These are related to goals, and they are the actual things that
    players need to do to accomplish their'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'goals. These are the puzzles, the riddles, and the choices that players make
    in the game. You want to try to make your challenges balanced—not immediately
    easy to figure out, but not so hard that players get frustrated. For example,
    a player needs to dismantle a bomb and must choose which wires to disconnect in
    the proper order. The order of the wires could be hidden in a book that the player
    needs to find and read, or it could be found in a diagram to which the players
    need to refer when they get to that part of the game.


    +   * **Exploration:** Part of a good game is having a space players explore and
    interact with it. Exploration is part of the world, the people, and the things
    that the players get to interact with as they play through the game. How much
    exploration you need depends on how big of a game you want to build. If you are
    building a small game, then you can just have a few elements that the players
    must explore. Larger games will have much more!


    +   * **Progress:** A must let players know they are moving forward in the story
    and getting closer to their goals and the game''s final resolution. You can provide
    a feeling of progress in a number of ways. Players can acquire new items, get
    past obstacles, gain access to new areas, and more. You want the players to feel
    like they are being successful in the game—otherwise, they''ll get frustrated
    and not want to keep playing.


    +   * **Choice:** Games give their players choices. Good games give their players
    interesting choices. As you are designing the games, the players will need to
    make choices to move the story forward. Try not to make the choices black and
    white! Instead, try to make both options look good. Maybe your players can get
    a hint about the right decision if they found a special item earlier in the game.
    Giving the players more than two choices can also help make decision points more
    interesting. Lastly, providing more one way to solve a problem can also provide
    players with an opportunity to make interesting decisions. The key is making your
    players want to make the right choice!'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Interactive Fiction Concepts


    There are a number of other concepts that fall somewhere between game and story
    that relate to interactive fiction. A lot of these aspects can greatly impact
    the quality and enjoyability of your game. And, even better, they can improve
    your effectiveness as a game designer! These include control, perspective, cues,
    audience, decision points, paths, and interactions.


    +   - Control: This is how much control of the story flow you have versus how
    much you give up to the reader. Interactive fiction is about creating a story
    that you allow the players to explore and discover. They make their way through
    your game by making choices. They are active participants—and that brings excitement!
    In a traditional story, readers have no control of how the story progresses or
    when things are revealed or discovered. As a writer and designer of interactive
    fiction, you are giving them some of that type of control. And how much you give
    up depends on the type of story you''re trying to tell!


    In the first type we''ll take a look at—choose your own path—you still have strong
    control of how the game/story progresses. Players read along and make a choice,
    turning to the appropriate page to see what happens next. Progression is usually
    very linear, meaning it moves along in a straight line. Their choices just help
    line move forward by making the right choices when they need to. Parsely and Twine
    games allow players to explore more. You may want the players to go into the kitchen
    and find the key so they can get into the basement, but instead they go into the
    backyard and find a shovel. They will still need to get the key from the kitchen,
    but when they do that is ultimately up to them!


    +   - Perspective: This is the viewpoint of the player who is playing the game.
    In interactive fiction, you can provide a'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'background to the character, but the player will be going through the story
    in a first-person perspective. He or she will be making decisions and exploring
    the story. So when you start coming up with characters for your story, you''ve
    got to remember that everyone you create will interact with the player as he or
    she moves through your game.


    +   **Cues:** Cues are related to the challenges and conflict in your game. It''s
    not a lot of fun—when you''re playing a game—to just blindly guess what choice
    you need to make. Make the right choice and you live. Make the wrong choice and
    you die. That''s obviously pretty important! You want players to have an idea
    of how to make an informed and interesting decision based on information they
    got earlier in the game. These can be hints and clues the player gets from items
    and characters they encounter in the story that they use to help make informed
    decisions. Going back to control, players may get to a point early in the game
    where their decisions aren''t based on anything, and they choose blindly and die.
    But in a great game, players can go back and explore more to find the clues or
    items they need to move forward!


    +   **Audience:** When designing games and writing stories, it''s always important
    to keep in mind who your audience is going to be. You want the content, language,
    and challenges to be appropriate for who you''re writing for.


    +   **Decision points:** These are key to interactive fiction games. They are
    a main part of what make it a game! They should be challenging, interesting, fun,
    and engaging. Players should want to make these decisions to move the story forward!


    +   **Paths:** As the name kind of implies, paths are the different choices and
    directions that your story can go as the readers play your game.


    +   **Interactions:** Just like paths, interactions are pretty explanatory. They''re
    what you can do to the things in your game: pull, push, talk ... anything you
    can imagine!'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Choose Your Own Path Style Games


    The most accessible—and probably the most familiar—interactive fiction is known
    as choose your own path, or CYOP. This is very close to a standard story, except
    that there are decision points pepper throughout. At all these points, readers
    have to decide upon the best course of action. There are typically two or three
    choices for the readers to make, with a page they need to turn to in order to
    find out what happens next. The story then continues on the page they turn to—or
    it may end due to terrible misfortune. Oh, the humanity!


    > You wake up to find yourself in a dark, musty cave filled with skittering bugs.
    They click and clack in the silence of the cavern. You are not sure how you got
    here—you were hiking through the forest when, suddenly, everything went dark and
    you remember falling. Looking up, you see a ray of sunlight coming through a hole
    in the ceiling of the cave, very high up. That must be where you fell through,
    but there is no way you can use to get out. You have to find another way.


    Looking around, you see bones—some fresh and very old—scattered throughout the
    cave. There also appears to be a tunnel leading into the gloom. You can either
    explore the bones or head off into the tunnel.


    If you explore the bones, turn to page 86


    If you head off down the tunnel, turn to page 43'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Check out this example if that doesn''t make much sense:


    Welcome back—I hope you chose wisely! Though that''s just a simple example, you
    really get to the heart of what interactive fiction games are all about. You have
    a story that presents the players with decisions. If players are thoughtful—or
    just lucky—their choices help move the story forward, and the players keep reading
    and playing. The wrong decisions can set the players back or end their game!


    With a conventional story, you—the author—would have a lot of control. You know
    exactly how it is going to play out, when the reader is going to discover that
    the old lady is actually an alien, or when the two main characters are going to
    fall in love.


    In CYOP, the players are like readers in a conventional story. Except, as they
    go through the story, they get to make decisions when prompted and turn to the
    right page to find out what happened—which, hopefully, moves them along in the
    story.


    # An Idea Sheet and Some Activities


    To start off, you''re going to take a crack at brainstorming activities to get
    your game started. Even more importantly, this is going to be a place you can
    come back to whenever you have ideas that you want to include in your game.


    Whenever you''re creating or designing something, having a sheet for writing down
    your thoughts and ideas for the project is good. It provides a space to collect
    all of the ideas that may come to you. You can organize and keep track of all
    them in one place.


    Your idea sheet is your friend—don''t hold anything back from it! Write down anything
    that comes to mind! There''s no rule that says you have to use everything you
    write down—as the old saying goes, it''s better to have an idea and not need it
    than need'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'it and not have it. If you wake up in the middle of the night with visions
    of giant plaid carrots ravaging New York City, write that down! You may not use
    New York as a setting, or you may steer well clear of vegetables, but getting
    those story sparks down is very important, because you may use them somewhere
    down the line, or in a different story.


    These first two activities will get your idea sheet started, but feel free to
    return to your sheet anytime during the process to jot down things that come to
    your mind!'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Starting Spark


    +   10–15 minutes Idea sheet, pencil


    # Activity Overview


    Beginning to write a story can be really easy—or it can be a serious challenge.
    For your CYOP game, take a moment to think what you''d like to make a story about.
    It often helps to pick a single starting point to begin, and then start thinking
    about building around the other elements.


    Pick one of these three categories to help you start:


    +   **Setting**: Where do you want your story to take place? Maybe you want to
    write a story about a dark, haunted castle. Or you might want to make a story
    that takes place on a distant planet. Think about a place that is interesting
    or exciting for you to write about!

    **Character**: Who do you want to make a story about? A dangerous pirate with
    a soft spot for birds, or maybe a fiery, independent inventor. Many great stories
    revolve around a single central character. Maybe that character is the hero—but
    he or she is the villain. Maybe there''s a twist—the character is someone who
    didn''t seem important until later in the story.

    **Interaction**: What big thing do you want to happen in your story? Maybe aliens
    invade a school dance, or the main character wakes up in a dog''s body. Think
    of an exciting, impactful event that the player/reader must navigate or overcome!


    # Instructions


    Once you have your starting idea, get a sheet of paper that will be the idea sheet
    for your design, and write down the starting point'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'for your game This will be one of the key things that will drive your game,
    and the centerpiece that you''ll eventually shape it around. Having written down
    on your idea sheet—where you can add more story ideas—will help you keep focused
    on what your starting spark is!


    # # Spreading Out


    +   - 10–15 minutes

    - Idea sheet, pencil


    # ## Activity Overview


    Now that you have your starting spark written down on your idea sheet, it''s time
    to spread out and think about the world where your game is going to take place.


    Remember those three categories you thought about for your starting spark? Well,
    you still need to think about them. They’re important parts of the story behind
    your game!


    # ## Instructions


    Continuing to work on the idea sheet that you created in the first activity, write
    down at least one idea for each of the other two categories that were not your
    story spark. You can write more if you like—don’t let me stop you! And don’t worry
    about whether they’ll all work, just get them down on paper. In the end, there’s
    really no chance you use every single one of them in your first project. But capturing
    your ideas on paper will help your story take shape and keep all of your great
    ideas in one place!


    For example, if you decided that your story will take place at a magnified level
    on the back of a dog, then who might your character meet there? A family of fleas?
    An angry tick? And what'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'things might happen? Getting lost? Falling off? Or worst of all-

    a bath?!


    By spreading out, you are starting to build out the world of your game. You don''t
    have everything you need yet, but you''re building some of the key pieces that
    you will use or draw inspiration from!


    Remember, the idea sheet is not something set in stone. It''s a living, breathing
    piece of your story puzzle that lets you collect all your ideas in one place.
    You may not use them all, but having them down helps you build your story and
    your game.


    # Writing Up a Story Sheet


    With these new activities, you''re going to take the rough thoughts and ideas
    you''ve been gathering on your idea sheet and begin to organize them into a story/game
    that readers will eventually play through. For these activities, you''ll be working
    on a new document called a story sheet.


    Like your story sheet, the story sheet is a fluid working piece that is meant
    to help you get closer to building your game. You''ll use it to put the sequence
    of events in order, building the rough story arc of your game. You won''t be filling
    in a lot of details on this sheet. Instead, you will be using it to get down the
    big, broad strokes of your story, sequencing them from beginning to end. Exciting
    stuff!


    Like your story sheet, feel free to come back to this sheet as you add more ideas
    or make changes. The greatest stories change and evolve over time, and yours can,
    too!'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Bookends


    +   10–15 minutes Paper, sticky notes, pencil


    # Activity Overview


    The first two activities got you thinking about the story and background of your
    game. We''re designing games that take place in a story, so that''s important!
    Everything you have down right now is just the filling and flavor that is going
    to go into your game. Now, you need to start making the delicious crust to put
    that filling in.


    # Instructions


    Take out your idea sheet, a new sheet of blank paper, and some small sticky notes.
    This new piece of paper is going to be your story sheet! It''ll help you organize
    the player''s path through your game. It will also help you visualize the connections
    and branches that come from the decisions the players will get to make. Like I
    mentioned already, your story sheet is not fixed—meaning you don''t have to stick
    to what you first put down. Just like the idea sheet, it will also live and breathe.
    Don''t like the way something is going? Come back to the sheet and make changes!
    The goal of the story sheet is to let you sketch out the path your game will take
    and what the players need to do get from the beginning to the end.


    Orient the paper landscape, so it is longer from left to right. On the far left
    side, place one of your sticky notes. This will be the starting part of your game.
    On the far right side, place another sticky note. You guessed it—this will be
    the final part of your game.


    Now, looking at your idea sheet, think about how and where the reader is going
    to start the game/story. What does this space look like? What are readers doing
    at the start of the game? Who'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'are they? Why are they there? Write those ideas in the starting sticky note
    on the game map. Next, think about the end. How do the players win the game? What
    do they need to do in the end? What is the final outcome? Write that in the ending
    sticky note.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_25_0.png)


    Don''t worry if you don''t have everything. This is just the start of creating
    your game, you''ll add more and make changes as you go along. It won''t be right
    or perfect the very first time. And that''s okay! It''s all part of the design
    process.


    Your story sheet should look something like below:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_25_1.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_25_2.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Touchstones


    10–15 minutes Sticky notes, pencil


    # Activity Overview


    You now have a start and an end to your game, but things need to happen between
    those points. We wouldn''t have much of a game (or a story) otherwise! What goes
    between the middle and the end is called the plot.


    # Instructions


    For this activity, think about the main events that you want to happen in your
    story. Look through the ideas you put down on your story sheet and think what
    things need to happen in your story. In my example, the players will need to find
    the magic words of power to defeat the wizard. To get those, they will need to
    trade a piece of gold to an old elf, and they find gold in a chest buried on an
    island. Other things will happen in the story, but these are the main events that
    *must* happen. All these ideas need to go on their own sticky notes and be placed
    on the story sheet in order, from the beginning toward the end.


    Because these are on sticky notes, you can move them around, make room for new
    ones, or take them away as your story takes shape. That’s the beauty of this process!
    Each of these events will be touchstones your players get to experience as they
    work through the game.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/3760f220c9ee3ac581049b311bdc3cc4_27_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_27_1.png)


