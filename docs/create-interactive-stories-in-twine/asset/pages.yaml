- pgno: 73
  md: 'Go ahead and give it a name and click the green “Add” button. Your game should
    open in a new tab, with the name of the story in the tab.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_73_0.png)


    If you go back to the first tab and refresh the page, you should now see your
    story listed in the area on the left like this:


    Welcome to the start of your first Twine interactive fiction game! Painless so
    far, right?


    # The Tour Continues


    +   5–10 minutes


    # Activity Overview


    Thank you for staying with the Twine Tour! Though I guess you don''t have too
    much of a choice... I''m still your fabulous (I hope!) guide. Let''s go back to
    the tab that has our story and get going with the rest of the tour. You''ll see
    that most of the screen is taken up by'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'a large grid space, with a single square in the center. That square is the
    start of your story! In Twine, it''s called a passage. Soon, you''ll be adding
    more passages, filling up the grid space with your awesome story.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_74_0.png)


    You can click and drag that passage anywhere in the grid space. As the page fills
    in, it sometimes helps to rearrange how the passages are laid out, so they make
    sense to you and make it easier to find what you''re looking for.


    # Instructions


    Go ahead and try dragging the square around. You may have noticed that when you
    hover your mouse over the passage, some options pop up.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'You can always hover over a passage to delete that passage, edit the passage,
    play the game from that passage, or—if you click on the three dots—determine if
    the passage is the start of your game or adjust how the passage looks (regular,
    wide, tall, or big).


    Along the bottom is a menu that you''ll use while working on your game.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_75_0.png)


    The home icon will take you out of your game and back to the main page with the
    story menu. Next to that is the name of your story, and if you click on it, you''ll
    see a list of options. We won''t get into them now, but just know they are there!


    Quick find gives a search option that helps you to easily find a word or phrase
    in your passages and replace text next to the quick find will let you find and
    replace in your game. The next three icons show a grid of 9, 4, or 1 passages,
    and will change the way your story is displayed in the grid space.


    The test icon, which looks like a bug, will allow you to debug your game and gives
    some extra tools to help. You''ll become very familiar with this tool later, after
    you''ve started working on your game. The play icon will launch your game and
    let you see what it looks and plays like for your players. And lastly, the add
    passage button will—you guessed it—drop a new passage into the grid.


    Go ahead and explore the interface. Don''t worry about doing any damage—we''ll
    be wiping the slate clean before we start.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # Cleaning Up


    5–10 minutes


    # ## Activity Overview


    I hope you''re ready—it''s nearly time to start building your game!

    First, you need to clear out anything that might have popped up as you were exploring
    the Twine interface.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_76_0.png)


    My first story


    # ## Instructions


    Luckily, Twine has covered us! To open the options menu on the grid page, click
    on the story''s name in the menu on the bottom. From there, click “Select All
    Passages.” Any of the passages you created will be highlighted blue. Now just
    click the delete key to remove anything you may have accidentally created. This
    is a powerful tool you can use at any point during your design process to help
    clean things up.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Passages


    10–15 minutes


    Passages are the main building blocks of Twine. They are the containers that hold
    your story and the bits needed to make the game run. As you know by now, they
    are represented by the blocks on the grid. Passages are small chunks of your story.
    They can represent locations, they can represent conversations, and they can connect
    to each other by links, which often present themselves as choices to the players.
    They will also reveal themselves one at a time to the reader, so a passage is
    like a page in a book or a location in a Parsely game.


    That is why these passages should feel familiar. The work you did mapping your
    story out with sticky notes in the CYOP game and the location write-ups for the
    Parsely game are very similar to what you will be putting in your passages!


    # Instructions


    Since you cleared out your grid in the last activity, let''s add a new passage
    to start your Twine game. Click the big green Add Passage button to generate something
    boring called "Untitled Passage."


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_77_0.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'You’ll probably notice a green spaceship in the upper left corner of the passage.
    This is the story start icon. When your game launches, it will start with this
    passage—which explains the rocket. You can change which passage is the start passage
    if you need to, but for now, just leave it be. Go ahead and double click on the
    passage to bring up the edit screen. You should see this:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_78_0.png)


    There are three parts to a passage: the title, the tags, and the body.


    +   **Title**: Big surprise—this is the name of the passage. It is not displayed
    to the player. Instead, it’s there to help you know what the passage contains
    and is how you link to the passage. When you name your passage, try to keep it
    descriptive and short!


    +   **Tags**: These are little labels that you can attach to your passages. Usually,
    they just help you group or categorize your passages. Occasionally, you can use
    them when designing your game. The startup tag is one example we will explore
    later.


    +   **Body**: This is where you will put your game. The story goes here. The little
    bits of code that make it interactive also go here. They get mashed together in
    a way that is natural and accessible, so don’t worry about having to learn how
    to write a whole bunch of complex code! You’ll need to learn some easy tools that
    will allow you to do cool things. We’ll cover those as we work on building our
    first game. For now, just know that this is the main work area for building your
    game!'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/3760f220c9ee3ac581049b311bdc3cc4_79_0.png)


    You continue digging, hoping to find more useful items, or even something of value.
    Soon, you come across larger rocks and what looks like ... a faint light.


    Maybe this is a way out! Franticall, you start pulling out the larger rocks. The
    light grows brighter. In your excitement, you don''t notice that the air around
    you is getting warmer—much warmer.

    After shifting one particularly large rock, the ground trembles, giving way beneath
    you. You fall ... fall ... fall, down into a river of lava.


    nThe end.


    Give your first passage the title “Start.” In the body, write “You are standing
    in in ...” and click the X in the upper right corner.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_79_1.png)


    When you finish up, you should be back on your grid page and see the following:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_79_2.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: "There's your starting passage—named Start—with the green spaceship icon and\
    \ a small preview of the text in the body. Press the play icon in the bottom menu\
    \ to see your game in all glory!\n\n# # Text Me\n\n10–15 minutes\n\n# # Activity\
    \ Overview\n\nOkay, so that was underwhelming, I admit. But hey, you've got to\
    \ start somewhere, right? Close the tab that opened up with the game, and let's\
    \ get back to the story grid!\n\nI think this story game is missing some, well,\
