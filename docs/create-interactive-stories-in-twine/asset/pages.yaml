- pgno: 81
  md: '# Instructions


    Now it''s your turn! Edit your starting passage and try a few different styles
    out. Remember, you''ll need to put the proper characters on both sides of the
    text you want to change. If you wind up seeing the characters (like the tilde
    or the slashes) you are trying to use to change the text, that means you made
    a mistake. Luckily, that''s easy to fix. If so, go back and edit the passage.
    Take a close look and try to fix what went wrong. This is called debugging an
    error. With everything in good order, press the play icon at the bottom to test
    out and see how your new styles look!


    You''ll also notice that writing a game in Twine uses a lot of natural language.
    You write how you would normally write, and add some extra bits to adjust it to
    the game. That is what is great about using Twine to create digital interactive
    fiction games. You can just write and add a few elements that make them look and
    play great!


    # Our First Passage


    +   - 5–10 minutes


    # Activity Overview


    Now that you''ve got the hang of styling, let''s get the start of our practice
    game down. For the next few activities, you will follow my examples to begin creating
    a simple, playable game. The goal is to introduce you to the tools that you can
    use in Twine and give examples of how they look and act in the program.


    # Instructions


    Let''s use the nice intro paragraph from the Parsely game example. Edit your starting
    passage and type in the following:'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'You are standing in an old, abandoned field that has been long forgotten. The
    stalks of grass whip in the wind. Ahead of you, a house stands in the field. The
    paint is chipped and peeling. The windows are all cracked and broken.


    ```

    //No one has lived here in years//

    ```


    Notice that there is a break between the first paragraph and the second line,
    with the italics. When you finish editing the passage, close it and press the
    play icon. That break between the two text parts is still there, right? Keep that
    in mind—when you type in a passage, it will keep the spacing that you use when
    you write. You don’t have to do anything special!


    # Hit the Links


    Now that you have the start of the story, it needs to go somewhere. You can make
    more passages that are the next steps in your game, but you need a way to get
    to them! And how do you do that? One word: links. Links will let you connect to
    other passages, or back to ones already made. Besides connecting, links also allow
    you to reveal new information. The next few activities will show you how to use
    links to expand and extend your game. Pretty exciting stuff!


    Links will use double square brackets [[ ]. The text inside the brackets will
    define the link and the passage it connects to. The link will also display as
    blue text, so everyone knows it’s special!'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# New Passage Links


    10–15 minutes


    # Activity Overview


    Your story, at some point, is going to have to move forward. You want to your
    players to have some choices and new passages to explore and extend their games.
    These are like the decision points when we were building our CYOP game. Each decision
    will lead to a new passage, with a new part of your story. And we need to create
    a link between the two passages that will take us from a choice in the first passage
    to one of the new passages.

    Thankfully, Twine has a quick and easy way to do this! When you add a new link,
    Twine will automatically create a passage with the title of the link. So let''s
    make a link to a new passage and create the passage at the same time.


    # Instructions


    Open up to edit your starting passage. Leave a blank line after the last line
    and then enter the following:


    ```

    [[Approach the House]]n[[Go around Back]]

    ```


    Once you have that, close the passage. You should see two new passages. Can you
    guess what they''re titled? One will be “Approach the House” and one will be “Go
    around Back.” There should also be two arrows, each leading from your starting
    passage to one of the new passages you created.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/3760f220c9ee3ac581049b311bdc3cc4_84_0.png)


    On the back end, this lets you know that there are links connecting the starting
    passage to both of those passages. The direction of the arrow lets you know that
    you can get from the start passage to both the “Approach the House” passage and
    the “Go around Back” passage. But you can''t go back directly—nor can you go anywhere
    else.


    Go ahead and press the play icon and try out your story. And try out your new
    links! This would be a good time to introduce the step-back feature. It may be
    a little hard to see, but it is on the left near the top when you are playing
    the game and looks like a looped arrow.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_84_1.png)


    After you click one of the links, use the arrow to step back to the start passage
    and try out the other link. Pretty easy!'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Linking Back


    10–15 minutes


    # Activity Overview


    So, as cool as it is, stepping back is not ideal. It actually undoes a turn, and
    as we get deeper into building games, that can cause problems. So let''s add to
    our story and also create a link to go back to our starting passage.


    # Instructions


    Open up the passage titled "Approach the House" and type this out:


    > You begin to approach the house but something seems ... //off/. The wind whistles
    in the abandoned field around the house. Maybe it''s the holes in the porch, or
    the old shoe hanging from the light. But you would feel a whole lot better finding
    a different way inside the house.


    ```

    [[Start]]

    ```


    You may have noticed that, after you put in the first set of double square brackets,
    the titles of your other passages showed up. This makes it easier to get the naming
    correct. If the passage title is misspelled, Twine will instead create a brand
    new passage with the new spelling. That is why giving your passages simple titles
    will help! Try playing the game again now and see how you can move between passages.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Slowly, you make your way into the tunnel. The flashlight is helping you find
    your way. The tunnel does not look quite as dirty as the cave you fell in. The
    floor is well worn, as if something has moved across it over and over again, keeping
    it clean and creating a few small grooves.

    Soon, you come across a great many cobwebs crossing your path—they make it impossible
    to move forward.

    You turn to head back, but before you do, you see a large, shadowy shape emerge
    from the cobwebs directly in front of you. Suddenly, you realize it''s a giant
    spider—and it leaps at you!

    By some unknown instinct, you pull out the rusted dagger and thrust it out toward
    the spider. It skitters away with a horrifying sound, but you can tell it won''t
    be coming back. Once the sound fades, you cut your way through the cobwebs and
    continue down the tunnel.

    Soon, you stumbled out of the cavern and hear the sounds of a rescue party—you''re
    saved!


    The end.


    # # What''s in a Name?


    15–20 minutes


    # ## Activity Overview


    As of right now, our choices and our passages mostly have the same name – with
    the exception of the starting passage. But having passages with the same names
    as choices may not always make'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'sense. Sometimes, you may want passages to represent locations rather than
    choice results.


    For example, right now when you start in the field, you can choose between going
    to the front of the house or around back. From a mapping approach, it may make
    more sense to have those be the locations that players can keep coming back to
    rather than choice results.


    # Instructions


    This should be similar to the mapping you did in the Parsely game. There, you
    explored locations and made decisions and choices in those locations. Your Twine
    story map will be a mixture of decisions and locations, combining the ideas you
    used with your CYOP and Parsely games.


    Because we had Twine automatically create the new passages, they have titles that
    show the result of a choice. Let''s fix that! First, let''s rename the "Approach
    to the House" to "Front of the House." Go ahead and edit the passage and change
    the title to "Front of the House."


    Close that passage. Your links connecting to the starting passage should still
    be there.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'And if you edit the starting passage, you will see that Twine automatically
    renamed the passage link for you. Very cool!


    ```

    Start

    +Tag

    You are standing in an old, abandoned field that has been long forgotten. The
    stalks of grass whip in the wind. Ahead of you, a house stands in the field. The
    paint is chipped and peeling. The windows, all cracked and broken.

    //No one has lived here in years//


    [[Front of the House]]

    ```


    Uh oh. Now we have a problem. The choice our players have in the story is now
    the name of a location. And it doesn''t really sound right!


    In Twine, you can create links that display something different than the name
    of the passage they''re going to. That would be a great help here, so let''s make
    that change! To do that, we''re going to need to use a hyphen and greater-than
    character together. This makes an arrow: "->". And that means the format will
    be [[Text shown to player->passage title]].


    You can create new passages using this format, the same way we did earlier. Any
    time you create a link to a passage that doesn''t exist, Twine will automatically
    create that passage for you. It''s very helpful!


    Staying inside the square brackets, we need to add the text we want the reader
    to see and the arrow before the passage link. Let''s keep the same text we had
    before. So go ahead and change the link so it looks like this:


    [[Approach the House->Front of the House]]


    You may have noticed that the name of the passage that is being linked to is colored
    blue. That lets you know that Twine recognizes that as a link to a passage. When
    you close the'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'starting passage, you should still see the connection to the "Front of the
    House" passage.

    Before we move on, let''s fix a few things we have so far:


    +   - Change the name of the other passage titled "Go around Back" and make it
    "Back of the House."

    - Fix the link in the starting passage so that it still gives the players the
    choice to "Go around Back" but leads to the "Back of the House" passage.

    - Change the title of the Start passage to "Abandoned Field."

    - Change the link in the Front of the House passage so that the players see "Head
    into the Abandoned Field" and the link leads to the passage "Abandoned Field."


    With all these changes in place, fire up your game and test everything out. Make
    sure there are no bugs around! You may be worried because right now, the "Back
    of the Hosue" passage doesn''t show anything—but we''ll fix that in a bit.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Changing Text with Links and Clicks


    You can also create clickable links in your story that do other things besides
    moving the reader on to the next passage. You can use them to reveal new information,
    shift, or change what is shown to the reader.


    These changes are done with macros. That word might be scary in computer science,
    but don''t worry. It''s actually pretty simple! We will be using link and click
    macros, and they have a specific format that''s a little different from what we
    have done so far. Check out this example:


    ```

    (macro: "original displayed text\)[new text]

    ```


    The macro is the portion surrounded by parentheses. The original text will be
    inside the rounded brackets and inside of quotation marks. When the text is recognized
    properly, it will be colored teal when editing.


    The new text will be added to—or replacing—the original in square brackets right
    after your macro. What you put in the single square brackets is called the hook
    and is usually changed, modified, or affected by a macro. When editing, the square
    bracket text will display as black.


    We discussed earlier how, with Twine, you can write how you normally would and
    add some snippets to expand or affect the game. We saw that with the style changes,
    but those were just a few extra characters added. Macros are the first example
    of code pieces that are added to passages and act on your story. Some macros get
    mixed right in your writing, while others just need to be in the passage and will
    have an effect on the entire thing.


    Here are some examples of the different macros you can use to adjust text in your
    story.


    Link macros will make the text in the macro clickable and affect it in some way
    way with the text in the square brackets'
  merge: -1
  img_proc: true
