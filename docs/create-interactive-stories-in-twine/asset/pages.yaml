- pgno: 9
  md: '# INTRODUCTION


    Hey there! First things first, I want to give a big thank you for joining me on
    this game design journey. The goal of this book is to give you a chance to share
    your voice and creativity. And, if you want to get really excited, it will allow
    you to take your first steps as a game designer and story crafter! So let''s get
    you started creating interactive fiction.


    Over the course of this book, you''ll get a chance to develop interactive fiction
    games in a number of different formats. While the overall goal of this book is
    to get you comfortable with creating and coding digital interactive fiction games
    in Twine—I bet you couldn''t guess that from the title—you''ll have to learn to
    walk before you can run. We''ll start off by working on developing your story
    and gameplay nondidinally before jumping into coding with Twine.


    This is an important step because building a good understanding of how to develop
    and refine your gameplay before you begin coding will help your final game truly
    shine!


    Right off the bat, I want to let you know there are a few things that this book
    will not do for you:


    +   1. This book will not make you rich and famous.

    2. This book will not do you your laundry.

    3. This book will most definitely not make you taller ... unless you stand on
    it.


    But there are some things that I can promise you this book will do!


    +   1. This book will introduce you to interactive fiction–what it looks and feels
    like.

    2. This book will get you started making your own games–with both paper and pencil
    and Twine.

    3. This book will support a wobbly table or chair.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'So why should you be excited about creating interactive fiction? That should
    be obvious! Interactive fiction gives you an easy and fun way to start creating
    games that other people can play. Your imagination is the limit to the settings
    and stories that people playing your game get to explore, interact with, and play
    their way through. And that''s not even the best part: doing all that doesn''t
    require a backbreaking effort! And this book will get you there.


    This book will focus on the building and developing of interactive fiction games
    (more on that later), and although we won''t spend too much time on story-writing
    skills, you''re going to get some tips and advice on writing along the way.


    The end goal of this book is to get making games in Twine. If you''re not familiar
    with Twine, you better get ready! Twine is a free, open-source program that allows
    you to easily-with just some small snippets of coding and styling-create your
    own interactive fiction games for others to play. It is a tool that gives you
    a voice and a chance to be creative by allowing you to make worlds and stories
    for people to explore, interact with, and experience!


    By learning a few small steps Twine allows you to be a storyteller and a game
    designer. It gives you the power to create an experience for the reader, who is
    also the player. Excited? You''ll be able to create a story for your friends and
    family to explore and interact with!


    For this book we''ll start here: thinking about and building a story that will
    serve as an interesting game for the reader. The first step in your journey is
    to build these games in a “choose your own path” style. Then, we will build in
    some complexity and openness by developing that game in the Parsely game system.
    Lastly-after you''ve developed your story and gameplay in these two systems-you''ll
    learn how to code them into Twine!


    When you''re all done, feel free to approach your designs as you see fit! That''s
    half the fun of making interactive fiction. But'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'working them out first, nondigitally, helps you plan and prepare for creating
    a great interactive fiction game.

    The book will have a bunch of awesome activities that you can follow throughout,
    and they''ll help you build and develop an example interactive fiction game. There
    will also be activities to help you build and develop your own unique game. Many
    of the activities in the book will build upon earlier ones, so I really recommend
    you follow along in order the first time through.

    But I definitely can''t stop you! As you get more comfortable with creating your
    own interactive fiction, you can go back through and focus on the activities that
    help you the most.'
