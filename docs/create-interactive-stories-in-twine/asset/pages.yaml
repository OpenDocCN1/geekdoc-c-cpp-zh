  md: 'and set in the passage. That way, when you use them later, Twine will already
    know about them!


    In the tag section, click the add tag button and type “startup.” Now we just need
    to set our variables. We’re going to use a new macro called set, and it looks
    like this:


    ```

    (set: $fear to value)

    ```


    In one of our earlier examples, we could create a variable for a player name.
    We could set the player name to none to start, and give the player an opportunity
    to enter his or her own name later on. That would look like this:


    ```

    (set: $classname to "none")

    ```


    Because the $classname variable is some text, it needs to be in quotations. Twine
    will read anything inside quotation marks as text, and treat it accordingly.


    We’re going to use numbers to track how afraid our players are. The starting value
    of their fear will be zero. Every time something scary happens, we’ll add 1 to
    that number. The higher number, the more scared they are. We’ll set our $fear
    variable like this:


    ```

    (set: $fear to 0)

    ```


    Because the value is a number, it doesn’t need to go in quotations. Go ahead and
    add the $fear variable to the “Variables” passage. When you’re done, your passage
    should look like this:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_100_0.png)'
