    ![](img/3760f220c9ee3ac581049b311bdc3cc4_72_0.png)


    You''ll be asked to name your story. If you''re working on a story you have already
    started, you should have a title in mind. If this is a fresh story, feel free
    to give it a new name! You will always be able to change it later, so don''t worry
    about that.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_72_1.png)'
  merge: -1
