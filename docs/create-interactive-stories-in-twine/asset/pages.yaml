- pgno: 119
  md: '# # Whoa—Where Did That Come From?


    10–15 minutes


    # Activity Overview


    There may be times that you want to have something pop out from the game to either
    alert the players or to get some information from them. There are two macros you
    can use to do that: alert and prompt.


    # Instructions


    Alert will allow you to create a browser pop-up that will sit over the game and
    display some text, with an "OK" button to dismiss the message. No matter where
    you put this macro in your passage, it will pop up first first when the players
    come to the passage. The general structure is very simple:


    ```

    (alert:text to be displayed")

    ```


    An example:


    ```

    (alert:You are about to enter the final countdown. Ba da da dum")

    ```


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Prompt is similar to the alert macro, but it works with the set macro, and
    it will let the player set the value for a variable. Like the alert pop-up, Twine
    will show the player a browser pop-up box with text–but it''ll also have a text
    entry box. The prompt macro has spaces for two pieces of text. The first text
    in the macro will be what displays above the text entry box, telling the player
    what to put in the box. The second text in the macro is what will be the default
    entry in the text box. The player can change that and write his or her own entry!
    The structure is like:


    +   (set: $variable to prompt: "what to put in the box", "default text")


    A great example to allow players to set their player names would be as follows:


    +   (set: $name to prompt: "What''s your name?", "Nameless One")


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_120_0.png)


    The best place to put this would be in your starting passage. Then, you can use
    the $name variable in your story to use whatever the player set as his or her
    name. This will create a personalized experience for the player!'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# On Display


    5–10 minutes


    # Activity Overview


    The display macro is a way to show the entire contents of a passage inside another
    passage. This can be useful if you have a piece of text that you want to reuse
    throughout your story!


    # Instructions


    Instead of having to retype the text, each time when you want to use it in passages,
    you can put it in its own separate passage. Then, whenever you want to pull up
    that text, you can use the display macro.


    ```

    (display: "passage name")

    ```


    One example of this could be if there is a song or poem that keeps recurring in
    the story. Place it in a passage titled “Poem,” and whenever you want to call
    it up, use the display macro. Easy!'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Heads and Feet


    10–15 minutes


    # Activity Overview


    You were introduced to one special passage tag earlier: the startup tag. We used
    it for our variables that we were using in the game; it told Twine to read that
    first before doing anything else. There are a few other special passage tags that
    you can use in Twine. Two passage tags that you should be aware of are header
    and footer.


    Header and footer passages will display and run on every passage. The header runs
    at the top of the passage, while the footer will run at the bottom. Like the “Variables”
    passage, to create a header or footer passage, you’ve got to make a new passage
    and use the appropriate tag.


    If you put text in the passage, it’ll show up on every passage either at the top
    or bottom of the page. You can also include macros! If you do, they’ll run every
    time the page loads.


    # Instructions


    Think back to the game we made. Remember when we had that conditional check for
    fear? That only run if you entered the front of the house. But it would make more
    sense if the player’s fear level was constantly being checked, every time a passage
    was loaded. You could move the conditional statements that checked the fear level:


    ```

    (if: $fear >= 2)[You shiver in fear.](if: $fear is 4)(goto: “Pass Out")

    ```


    put it into a footer. Then, every time a player goes to a new page, Twine will
    check to see what or her fear level is and run the hook if the fear is high enough.
    This is a much better way to have consequences for players who got too scared!'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # Saving and Loading Games


    15–20 minutes


    # ## Activity Overview


    By now, you probably have a pretty great game in the works, with twists and turns
    and a few horrible endings for careless players. Maybe your game is a tough one,
    and you want to give your players the ability to save their games rather than
    having to start all the way back from the beginning. Twine will let you do that!


    # ## Instructions


    This–the last activity!–will show you how to set your Twine story up so that players
    can save and load a game. Twine will use your browser to save a player''s progress.
    There are two components to making this happen. The first bit of code will create
    a link titled Save Game that, when clicked, will save the current state of the
    game in Slot A. This includes which passages have been visited and any variables
    that were set.


    ```

    (link:"Save Game")[(if:(save-game:"Slot A")][Game saved!])

    ```


    It will also give a "Game Saved!" message to let the player know the game was
    saved. This code will only keep one active save. If the player saves the game
    a second time, it will overwrite the last save. The second bit of code is to load
    the last saved game.


    ```

    (link:"Load Game")[(load-game:"Slot A")]

    ```


    The code creates a link titled Load Game that, when clicked, will load the last
    game saved in Slot A. You can change the name'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'of the save game from Slot A to anything you want—just be sure to change it
    in both the save and load game code! How often and where to place the save and
    load code will depend on how you want to make this available to your players.


    +   - If you want them to always be able to save and load, then you could put
    it in a footer passage, so it will always show at the bottom of the game

    - If you wanted to create checkpoints, you could put load code in a footer passage
    and only put the save game code in select passages that you want the players to
    be able to save. This way, the players will always be able to load their games,
    but they will only be able to save in select locations!


    To start, try just putting the save and load code in a footer passage to make
    sure it''s working. Then, decide how you want to use the functionality and make
    the changes you need to!


    # A Fond Goodbye


    Thank you so very much for going with me on this journey of creativity, storytelling,
    and game design. I really hope you enjoyed the process and feel more comfortable
    designing your next awesome interactive fiction games. This book doesn''t cover
    everything, but you should have a good foundation to build and grow from! So go
    forth and spread your story, build great games, and most importantly—as you''ve
    heard plenty of times by now—have fun!'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# GLOSSARY


    **action words** In Parsely games, verbs that allow players to advance the story.


    **branch** The part of an interactive fiction story where a decision point leads
    to two different story paths.


    **choose your own path** A style of story where the reader makes certain decisions
    that affect the outcome of the tale.


    **conditional statement** In coding, a statement that checks whether certain conditions
    are met to determine what operation it executes.


    **decision points** Areas in an interactive fiction story where the reader has
    to choose one or more options that have different outcomes.


    **inline** In programming, describing code on the same line or without any breaks.


    **interactive fiction** The general term for stories and other media in which
    the audience has some form of interaction with the outcome.


    **interface** The form of a system or software that presents information to a
    user.


    **iterative** Referring to the process of repeating something to improve it.


    **links** In Twine, the connections between different passages and the way they
    are connected.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'loop A series of decision points that only lead to each other and do not advance
    the story.


    macros Sections of code that combine multiple instructions into one command.


    operators Symbols that are used to indicate a mathematical or coding operation.


    Parsely A pen-and-paper interactive fiction platform that is inspired by early
    text-based computer games.


    passages In Twine, the boxes that contain all the text and code of a story.


    publish To make a program or other piece of media available publicly.


    save point An option given in some forms of interactive fiction that allows players
    to return to a previous point in the story; also called a restore point.


    styles Different ways of displaying text, examples include bold, italic, etc.


    Twine A free-to-use software that is used to create interactive fiction games
    using passages, links, and coding.


    variable Something that can change or exist in several different states.'
  merge: -1
  img_proc: true
