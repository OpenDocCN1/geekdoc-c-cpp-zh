- pgno: 98
  md: '# # Will You Vary Me?


    10–15 minutes


    #  Activity Overview


    Now we''re getting somewhere! Well, in a kitchen inside a spooky house, at least.
    Because this is shaping up to be a spooky story, maybe we can track how scared
    the players get based on the choices they make and places they go in the game.


    To do this, we need to use something called a variable. A variable is a name we
    give to information. That information changes—or is variable—depending on what
    we tell the game to do. The variable name can be anything, but it''s usually best
    to give it a name that tells us what information the variable has. Makes sense!


    # Instructions


    In Twine, variables have a $ at the start of their names, like this:


    ```

    $variablename

    ```


    For example, you could have a variable for the player''s character name and call
    it $playername or $charactername. You could also use a variable to keep track
    of what has happened, what something is called, how much the player has of something,
    or how many times something has happened. There are a lot of interesting things
    you can do with variables in Twine! We can''t cover all of them in this book,
    but you''ll master a few to give yourself a good foundation.


    First things first, we need to create a variable to track how afraid the player
    is. I think a good variable name would be $fear.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'We need to introduce the variable to Twine and set the initial value. To do
    this, we''re going to create a new passage that isn''t linked to any of our passages.
    Instead, we can use it to store any variables we''re going to use in our game.


    Instead of adding a passage with a link, we will need to use the green "add passage"
    button on the story map to create a new untitled passage. Feel free to drag it
    to where you can see it, but make sure it isn''t in the way of your other passages.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_99_0.png)


    Slowly, you make your way into the tunnel, the flashlight held in front of you
    to guide your way. You notice the floor of this tunnel is well worn, as if something
    has repeatedly moved across it, making small grooves as it passed.


    Before long, thick cobwebs begin to block your path, making it impossible to move
    forward.


    You turn head back, but you notice some sudden movement among the cobwebs. A giant
    spider bursts forth, fangs bared!


    With nothing to protect yourself, you throw out both hands, dropping the flashlight.
    However, it is no use. Within seconds, you feel two needle-sharp fangs pierce
    the skin of your neck. And then...


    Darkness.


    The end.


    Now, edit the passage and title it "Variables"—since that''s what it''s going
    to hold. We also need to do one very important thing: give the passage a special
    tag. We haven''t used a tag before, but they usually don''t impact the game. They''re
    just a way for you to organize or sort your passages. There are a few tags that
    interact with Twine, and the startup tag is one of them. tell Twine to read this
    passage first, before running your starting passage. That means Twine will know
    the variables you introduce'
