- pgno: 135
  md: 'Interactive storytelling is the basis for any game, and Twine gives users the
    tools to make their own choose-your-own-path games. Starting with the basics of
    storytelling, moving to Parsely games, and finally exploring Twine, readers will
    learn the ins and outs of making fun as well as engaging story-based games. The
    hands-on activities in this remarkable resource are uniquely designed to teach
    teachers the basics of computational thinking, variables, and the Harlow programming
    language—all while having fun making a game online.


