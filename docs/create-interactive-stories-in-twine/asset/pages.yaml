    you are working on. Since this is going to be your first story, you won''t see
    any stories here (duh). But as you start working on them, you can find them here!


    Out the right window is the story menu where you''ll be able to start a new story,
    load one you are working on, archive a story to save it for later, or change the
    program format you are working with. You will need to start your first story,
