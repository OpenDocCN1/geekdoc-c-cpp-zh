- pgno: 38
  md: '# # Filling It In


    10–15 minutes Idea sheet, sticky notes, pencil


    # ## Activity Overview


    By now, I hope you''re comfortable adding decision steps to your game, thinking
    about stepping back in your story or moving forward, using a loop or two, and
    maybe even including a few branches. Your next activity is to work on filling
    in the rest of your story. Remember to title your sticky notes and include your
    arrows!


    # ## Instructions


    Draw from your idea sheet and think about how you can include the elements you
    have down. Remember, you have some really great ideas written – but don''t feel
    like you have to include everything. Don''t be afraid to add new parts as you
    are working. Development is always a fluid process and can change as you are working
    on it. That''s okay! The most important thing is to have fun.


    # # Finding Your Words


    10–15 minutes Idea sheet, paper, pencil


    # ## Activity Overview


    Congratulations: you have the framework–the bones–for your story! Now you need
    to turn it into the CYOP game. When you''re done, you will have a fully playable
    game you can share with your friends.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Each of your sticky notes should have enough ideas and details to use as a
    foundation for writing your game. Now is the time to fill in characters and details,
    and to give your story life. Remember, your story is still a work in progress,
    so you can use some more details and make changes as you begin to!


    # # Instructions


    If you want to write a story, you''re going to have to—well—write! Get some paper.
    Starting with your first sticky note, begin to write your story on a new page.
    When you finishing writing the very first story sticky note, you should be at
    your first decision point. Now, you''ll need to present the choices to your readers
    at the bottom of the page that you finished writing on. So, if the first part
    of your story took up pages, on the bottom of second page, you will present the
    choices that the players have.


    A good format to present the decision is: "If you make this decision], turn to
    page X." Going back to our example, the start of my story would look like this:


    > You awake early in the morning in your cottage in a small village in the mountains.
    The cottage is small and simple, you never had need for things. A bed, stove,
    and small table adorn the room and in the corner is your walking stick.

    It must be early, because you can still hear birds singing. But you also hear
    something else, too: the sound of someone singing. Is he or she singing with the
    birds? There is something about the sound of that singing that invites you outside
    to come and join it.

    If you examine the walking stick, turn to page X.

    If you go outside to check out the singing, turn to page X.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'You will notice that I didn''t fill in my page numbers. Don''t do that yet—that''s
    one of the last steps. Now it''s your turn! Write the first part of your story
    up until your first decision point and place that decision point on the bottom.


    # # And We Build a Story


    +   - 10–15 minutes Idea sheet, paper, pencil


    # Activity Overview


    Now that you have the start of your story, you''re ready to move forward and write
    the continuation. If you''ve been following the activities up to now—I hope you
    have—your players should have had two decisions to choose from. Now, you need
    to write up what happens as the results of those decisions. Each of those results
    should have a sticky note on your story map.


    # ## Instructions


    For each result on your story map, use a new page and write up what happens as
    a result of that decision. Don''t write it on the backside of one you''ve already
    used! One of the decisions should continue to move the story forward and present
    new choices. The other should end the story for the players.


    Continue writing, and keep in mind that for each sticky note, you will start on
    a brand new page, even if you have room on the sheet where you presented the decisions
    to the players. This is because after they make a decision they will have to turn
    to a page and read to find out what happens next. These are the pages that they
    are turning to!'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Also, as you write up your sticky notes, although they will start on their
    own pages, they may continue across multiple pages depending on how detailed and
    descriptive you are, or how much action is happening. That''s fine!


    As you write up your story, try to keep the pages in order of how the sticky notes
    flow as best you you can. After the first part of your story, put the two decision
    results immediately after. This will make it easier to find the parts needed as
    we start to mix up and number our pages in the final activity!


    # Assembling Your Game


    +   - 20–25 minutes

    - Idea sheet, pencil


    This is the home stretch! If you can believe it, you''re almost done with your
    very first interactive fiction story! The last step is mixing all of the pages
    you have created and numbering the pages so that readers can play through your
    game.


    Right now, your game should be mostly in order, with the decision pages following
    each decision. Now, you need to get to numbering the pages so the players'' decisions
    lead to the right pages!


    # Instructions


    First, you will need to count out all of the pages you have. If you''ve been writing
    everything by hand, remember to count both the front and back of every page. Once
    you have counted all your pages, you have all of the “potential” pages you can
    use. Write those numbers'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'down on a sheet of paper. As you use pages, you will cross off numbers.


    If you are writing out your story by hand, start at the beginning of your story
    and number your pages beginning with 1. Stop numbering when you get to the page
    when the players are given their first decision. As you number the pages, be sure
    to cross them off your list of numbers!


    Now, take a look at the part of your story that happens as a result of your first
    decision point. You need to pick a place further on in the book to place it—maybe
    in the 10s or 20s. Begin numbering those pages from the page number you pick.
    So if you picked page 23, and your section is three pages long, you would number
    them 23, 24, and 25, and cross those numbers off your page list. Now that you
    have a page that this part will start on, go back to the decision point and write
    in the page number the reader will need to turn to. Do the same for the other
    decision point, picking a different place to put that section, and writing the
    page number that the decision presented to the readers. It is all starting to
    come together!


    Continue this process moving forward through your story. Try to bounce back and
    forth in your book, but also try to fill in the list of available pages so there
    are no gaps when you''re all done. Don''t worry too much if, when you finish,
    there are a couple single-page gaps. You can always fill them in with some cool
    illustrations!


    If you''ve been working on a word processor so far, you should take advantage
    of the page numbering functionality of the program. Most programs also have a
    thumbnail view of the pages, so you can highlight the pages that are part of a
    section, then drag them to a new section, going back and adding the new page numbers
    to the decisions presented to the readers.


    Once you have made your way through your story, it will be time for you to go
    back and read your way through—to make sure everything works and all the pages
    match between the decision and where they are in your book. That''s important!'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'wouldn''t want your readers getting lost and confused because of a numbering
    mistake.

    Read through, test all your decision points, and don''t be afraid to make any
    last-minute changes as you do. Once you have run through your story and don''t
    find anything you want to change, take a deep breath. You did it! You just made
    your first interactive fiction story. Be proud, share it with your friends, and
    start planning your next one!


    # Basics: Done


    With the basics—and your first interactive fiction story—under your belt, you''re
    ready to move onto bigger things. In the next section, you''ll learn about another
    platform for creating interactive fiction: Parsely.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# PARSELY–NOT JUST FOR EATING


    Parsely games were created by Jared A. Sorensen and draw from the old digital
    text adventure games from the 1980s. I''m sure that sounds like ancient history
    to you, but it wasn''t long ago! In these digital games, players would be introduced
    to the start of a story and presented with a text prompt. They could write in
    anything they wanted. It was up to them to explore and figure out where they needed
    to go and what they needed to do to win the game.


    This is a different experience than the CYOP games we were designing in the last
    set of activities. In those, the players followed your stories and simply made
    choices when prompted. CYOP games lean more towards a story that you interact
    with, while Parsely game leans more towards a story you explore.


    There are other differences, as well. Parsely often require at least two people—but
    they can also be played by a large group of people, which is kind of cool! Parsely
    games have one person acting as the computer. They interpret and run the game
    for the rest of the group, who are the players. The players take turns giving
    commands to the “computer,” trying to move the game forward and win. The “computer”
    looks at the game layout and tells the players what happens. Any number of people
    can be players and make it through a Parsely game. They all have to work together,
    taking turns giving commands, playing as a single group, trying to help each other
    as they try to get to the end of the story and win!


    Much of the underlying structure and approach you used with building your CYOP
    game can be used to make Parsely games, too. You still need to think about characters,
    location, and events that happen in your game. But now, there’s much less writing
    for'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'you to do! Instead, your focus is to create a game that can be run for a group
    of people.


    In fact, creating a Parsely game is very much like computer programming. But don''t
    let that scare you! That just means you''ll be putting your information together
    in a certain way, and when it runs, that information will create a game experience
    for those playing. If the players looked at a Parsely game, it would not look
    like much of a game! And it definitely wouldn''t be very fun for them to just
    read through. But if someone runs the game for them, a fantastic gaming experience
    can be created!


    This is very similar to video game coding. If you look at the code for a video
    game, it wouldn''t look anything like a game and would not be playable or fun
    for the person reading. But when that code runs through a computer, it creates
    something that transcends all code and becomes an awesome experience!


    One of the big differences when designing a Parsely game is how much less control
    you have over how your game plays out. Don''t worry—you still have control over
    the big things. But that control is much looser than the CYOP story you made.


    You have control of what things need to happen to progress through the game, but
    you no longer have full control over when elements are discovered or if the players
    are able to figure out what they need to do next. Like CYOP, players may stumble
    across horrible demises or setbacks, but this system is modeled after computer
    games, so players can choose to save and restore, so they don''t have to go all
    the way back to the beginning.


    In a Parsely-style game, players are simply presented with what they see and the
    directions they may go. It is up to them to examine and explore to find the solutions
    to move forward. Although they may need to go left to find the key for the locked
    door, they may choose to go right—you don''t have control of that. So the players
    may go right and find something else or get stuck, then have to backtrack until
    they finally go left and find the key.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Even though you know, as the designer, how things need to unfold, the players
    do not and will often go in circles trying to figure things out. You have to be
    aware that you are creating a more open space that the players get to explore,
    and you have to to plan for that. This freedom and the need to figure out what
    needs to happen makes Parsely games really fun and enjoyable. So let''s get started
    with making one!


    Slowly, you make your way into the tunnel. You can''t see anything after a few
    feet, you have to use your hands to feel the wall, and you have to be careful
    as you step so you don''t trip.

    After about five minutes of wandering in the dark, you decide that maybe this
    wasn''t a very good idea, and you start to head back.

    As you turn, you feel something tickle the back of your neck.

    Before you even have a chance to run, you feel two small needle-sharp things press
    into your neck. And then ...


    Darkness.


    The end.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Revisiting a Few Old Friends


    5–10 minutes Idea sheet, pencil


    # Activity Overview


    Much of the planning work you did for creating your CYOP game is still a great
    way to approach designing a Parsely game. In fact, many of these activities will
    help you no matter what stage of the design process you''re taking on!


    # Instructions


    Go back through the starting CYOP design process–the first six activities–to create
    a new story for your Parsely game.

    If you don''t want to start over–instead using the same design you used for your
    CYOP game–that’s part of the beauty of designing these stories. You can use whatever
    you want as your starting point!


    # The Format


    Parsely games have a different format than the CYOP game that we designed earlier.
    In a Parsely game, the focus is more on building an explorable space for the players
    and there is a lot less actual writing. Because someone else will be running your
    game, the writing approach is not the same. You are writing instructions for the
    player to be able to run your game, with information broken between two elements:
    a map and a narrative sheet.

    The following two activities will introduce these elements that will allow you
    to create a playable Parsely game!'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # The MAP!


    10–15 minutes Idea sheet, paper, pencil


    # ## Activity Overview


    One big part of a Parsely game is the map. The map, as you might have guessed,
    shows all the locations that the players can move between when exploring and playing,
    and how they connect to each other. Your map can be simple and stripped down,
    like this:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Or—if you want to get fancy—your map can be decorative and elaborate, with
    all kinds of cool details. A decorative map isn''t necessary, but it makes the
    experience more fun for the person running the game. The decorations can be strictly
    thematic, or they can give visual hints to the player running the game where things
    are located. No matter what, it''s important to remember that the players never
    actually see the map. As they listen to and explore your story, they will have-to
    keep track of where they are and where they went in their heads.


    Regardless of which map you decide to make, the map needs to have a few elements
    that are clear and legible for the person who will be running the game.


    First, each location space on the map must have clear and readable names. These
    can be in the spaces themselves, or right next to them. However you label the
    spaces, the person running the game must be able to glance at the location and
    immediately know what the name of that location is.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Second, you need to have clear connections between the different locations.
    The person running the game needs to be able to tell how the different spaces
    connect. He or she will also get this information from the write-ups for the different
    locations, but keeping it clear on the map helps make it easier to run your game.


    Your connections need to be straight, too—no corners to mess things up. Remember
    that the players can''t see your map, and they are trying to memorize how the
    different rooms connect. An elbow or a corner in a connection will create connections
    that don''t match and make it pretty hard for the players to get around.


    If players go south to the next location, they would expect to have to go north
    to get back to where they just left. But an elbow may create a situation where
    the player leaves one location going south, but enters the connecting location
    coming from the east U, confusing—so maybe it''s best to avoid it.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The last thing you need is a compass rose. This works together with the clear
    location connections to let the “computer” know which directions the players can
    go. When connecting your locations, try to stick to directions that are easy to
    make out (north, south, east, and west).


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Instructions


    With all that rattling around your head, let''s start working on a simple map
    for your game. You can redo your map when it''s all finished if you want, to make
    it look awesome. But while you''re designing your game, keep it simple, because
    you will probably need to make some changes! Maybe it goes without saying, but
    be sure to use a pencil—so you can erase and make changes.


    Working off the old example that we used when designing the CYOP game, my starting
    space would be the cottage and would look something like this on my map:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_52_0.png)


    Pretty easy, right? I told you there was a lot less writing when it comes to a
    Parsely game and a lot more focus on developing the experience. The map is a big
    part of that!


    In my example story, the players can choose to leave the cottage and go outside
    to the field. I need to pick a direction and let the players know what that is.
    Since I picked the left side of the paper, I will say that the player can exit
    east. Makes sense, right?


    On my map, I will draw another location space a little to the right of the Cottage
    and label it Field.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_52_1.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Now it''s your turn. Grab a new sheet of paper that will be your game map and
    place a rectangle on one of the edges. Give the space a name that is the starting
    location of your game. Think of the next location that the players could move
    to after they make a decision. Add the location and make the connection.


    Awesome, you''re on your way to making your map! Keep doing that until you have
    your entire layout.


    # Location, Location, Location


    +   - 10–15 minutes Idea sheet, paper, pencil


    Though your map probably looks similar to the story sheet you were working on
    when designing your CYOP game, locations on this map are different.


    Locations are the different places that the players in your game can move to,
    explore, and make decisions. If they are in a house, the locations could be the
    different rooms and hallways they are exploring. If they''re at the bottom of
    a tree and can climb to the top, those are two locations.


    It''s important to note that locations must not always have interesting things
    happening in them. But they do need to have movement or action decisions that
    need to be made. If players need to choose a direction or make a decision, it
    will be a distinct location.


    For example, imagine you have a house as a part of your story, with several rooms
    connected to a hallway. Whenever the players need to choose a direction to go,
    that needs to be a location so the players can make a choice.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/3760f220c9ee3ac581049b311bdc3cc4_54_0.png)


    This is different than the story organizer, where you had new blocks for each
    decision point and their outcomes. In Parsely, your map is made up of the areas
    you can move to and explore. Your players may wind up making multiple decisions
    in a single location, depending on who and what is there.


    Look at your story and fill in the rest of the locations on your game map. Think
    about where the players must go and what they need to do. You don''t have to put
    the next location they'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'need to visit right next to where they are. Spread the locations out, and have
    them make sense. By building the map, you are building the world that the players
    are going to explore. Give them the opportunity to adventure!

    Don''t worry if you don''t fill in all of the locations now. Remember—design is
    a fluid thing and may change as you continue to work on your game. Just be sure
    to have fun!


    # Narrative Sheet: Aka, Writing? Not So Much!


    +   - 20–25 minutes

    - Idea sheet, paper, pencil


    # Activity Overview


    Now that you have work done on your map, let''s switch gears and look at the other
    part of creating a Parsely game: the narrative sheet.

    On the narrative sheet, you''re going to be writing up information for each location
    on your map. The person running your game will look between the map and the write-ups
    to run the game for the players. The order of locations on your narrative sheet
    is not important, but you should try to keep them—as best you can—in the order
    that the players will make their way through the game!


    # Instructions


    Each location should have four elements written down for the "computer":


    +   - Title

    - Descriptive text'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Exits


    +   - Rules for the space


    **Title:** The “title”—you guessed it—is the name of the location on your map.
    It needs to exactly match the name you gave to the space on your map! The players
    will be exploring your game, moving around from location to location. When they
    move in a direction, the person running your game will look at the map to see
    the name of the new location and then look on your narrative sheet to read and
    run that location.


    **Descriptive text:** This is the narrative part of your game for each location.
    It is what the person running your game is going to read out loud to the players.


    Your writing should be in the second-person perspective. Hold on, what? Second
    person? That’s right—you should always write your descriptive text so that when
    it gets read, sounds like “you see a master wizard” or “you hear the sound of
    singing.”


    Be sure to take time to describe the locations and what the players can see. Taking
    the time to give details will really bring your world to life! For example, you
    could write: “You are standing in a field; there is a house in front of you.”
    Or you could write: “You are standing in an old, abandoned field that has been
    long forgotten. The stalks of grass whip in the wind. Ahead of you, a house stands
    in the field. The paint is chipped and peeling. The windows are all cracked and
    broken. No one has lived here in years"


    Both descriptions let the players know what is in the location, but I think you
    know which one is more interesting! The second description creates a mood and
    paints a picture that draws the players into the game.


    However, you don’t want to describe how things work, or what people can do there.
    Instead, you just want to describe what they can see. You also don’t want to give
    everything away here either. If there’s a table with an important item on it,
    don’t'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'necessarily include the item in the description. Instead, just note that table
    and leave it for the players to examine the table and discover the item!


    Exits: These are the directions that the player can go; north, south, east, and
    west are what you''ll use most. You may also use up or down, if you want to have
    players climbing trees or using stairs. For simplicity''s sake, when creating
    your map, try to keep the possible directions that players can go from a particular
    space down to a maximum of four. This makes it easier for you when designing and
    keeps it clear for the players when they are running the game!


    If you start making "diagonal" exits, like northeast or southwest, it can get
    messy. Also, remember to keep paths between locations straight! Avoid including
    elbow corners on your map. When you are first creating your game, you may not
    have all of the directions on your map right away. You may still be adding locations
    as you continue working on your game, and that''s all fine. Just make sure you
    can fit all your ideas in eventually!


    Rules: The rules help define—for the person running the game—what the players
    can and can''t do in the space. You don''t need to think of every possible thing
    that can be done; just try to get down the ones that are most important for your
    story. The "computer" will come up with fun, interesting reactions to commands
    that don''t make sense or aren''t defined by your rules. That''s part of the fun
    of being the computer!


    Your rules don''t have to be complex. You can use short, simple sentences to define
    them. And there''s more than one way to write your rules! For example, if the
    players need to use a key to unlock a door, you could write any of the following
    rules:


    The door is locked. It will open with the key from the chest.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The key from the chest will unlock the door.


    If the players try to open the door, they will find it is locked. If the players
    have the key from the chest, they can use the key to unlock the door.


    You may have noticed that there are two fonts being used in these examples. The
    words that are italicized are specifically for the “computer,” to let it know
    what will happen. The words in regular font can be shared with the players.

    Your rules can include what the players will discover if they examine items. For
    example: “If the players examine the mirror, they will find a letter hidden behind
    the glass.” You can describe what happens if the players do something: “If the
    players open the door, a wolf attacks them.” You can also say what happens if
    they don’t have or do something: “If the players don’t have the coin, the gypsy
    casts a spell on them.”

    Don’t be afraid to allow horrible and unsightly ends to come to your players!
    Remember, they can save their game and restore to where they saved. Part of the
    fun is knowing that—sometimes—horrible things will happen.


    Check out what a write-up of our example game with all four of these elements
    might look like:


    # Cottage


    +   Descriptive text: You awaken in the morning in your little cottage, nestled
    in the quiet village where you have lived all your life. The cottage is a simple,
    small, one-room house with a bed, stove, and table. You see a large stick nestled
    in with'
  merge: -1
  img_proc: true
- pgno: 59
  md: "the corner. After a moment, you start to hear strange but beautiful singing\
    \ coming from outside.\n\n+   - Exits: Out\n- Rules:\n  - The bed is simple and\
    \ a little smelly.\n  - The stove contains leftovers from last night. If the players\
    \ try to eat some, they will get sick all over their shoes.\n  - The table is\
    \ empty and bare.\n  - The stick is a large stick, used for beating the dust out\
    \ from the mattress. The players may take the stick.\n  - The singing is almost\
    \ unnatural. There is something both comforting and unsettling about it.\n\nNow\
    \ that you've seen how it's done, grab a fresh sheet of paper and start making\
    \ some write-ups for your first few areas!\n\n# Not Always a Straight Line\n\n\
    +   5–10 minutes Idea sheet, paper, pencil\n\n# Activity Overview\n\nWhen we were\
    \ building the CYOP game, one of the things we used was a loopback to a decision\
    \ point. This allowed players to make a wrong choice, but not to start all the\
    \ way back at the beginning of the game again. But the players were still presented\
    \ with the same choice and can only choose to make a different one, hoping to\
    \ move forward this time.\n\nIn a Parsely game, you can have players run around\
    \ a bit to get past obstacles or move forward in the game. They may head south\
    \ to a freshly dug mound of dirt. To dig that dirt up, they need the shovel, which\
    \ is only found up north."
  merge: -1
  img_proc: true
- pgno: 60
  md: 'So, unlike the CYOP game you created, where the players were always moving
    forward in the story, in a Parsely game, you can spread your clues, tools, and
    pieces around throughout the game. Now, it''s all well and good to encourage exploration,
    but you don''t want to confuse it with your story arc and the main things that
    you want to happen in the story.


    For example, let''s say you want the players to have their way past a rabid banana
    that is guarding the path to the city of Fruitopia. And to get past the banana,
    they will need to have a very hungry gorilla accompanying them. Who else is going
    to be able to take on and eat the rabid banana, right?! Without the gorilla, it
    will end horribly for the players.


    This is where you, as the designer, get to have fun with your players. You don''t
    want to find them just before they run into the banana. If you do, it becomes
    obvious what they will need to do and they are guaranteed to find the gorilla
    right before meeting the banana and will always be prepared to deal with it. Though
    success is fun, having to work for that success is even better!


    Instead, the gorilla should be in a location a few rooms away, and may have its
    own challenge make it difficult to acquire. But keeping them apart creates a problem
    for the players to solve without an immediately obvious solution!


    They may run the rabid banana first—before finding the gorilla—and die a horrible
    death at the hands of the yellow fruit. They can then load their game and explore
    other areas, looking for a way to help them get around the banana and discover
    the gorilla!


    # Instructions


    Looking at the story for your game, pick an obstacle that the players will need
    to get past in your game and place it in a location on your map. Next, add the
    thing needed to a location a few rooms away from the obstacle''s location. It''s
    as easy as that!'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Inventory and Requirements


    20–25 minutes Idea sheet, paper, pencil


    # Activity Overview


    Unlike CYOP games, in a Parsely game, the players can have an inventory. As they
    make their way through your game, they can find and carry things around with them.
    This gives you an opportunity to create more interesting decisions and challenges
    for the players than simply choosing between a few options!


    Now, players can find tools, keys, or other odd objects that they may not immediately
    know what to do with. You can also create obstacles that require the players to
    be creative in how they use what they have found! Giving your players items will
    give you—as you design the game—new ways of unleashing horrible events and woes
    on your players as they try to use things and they go terribly wrong.


    # Instructions


    Check out a few examples of how you can take advantage of the players being able
    to take and use things.


    +   - Locks: Players can find keys, gems, or other things that they need to use
    on an object to unlock it. That object could be a chest, a door, a wall, or a
    magical portal. This could include breaking as well! Players may need an object
    to break open something or break down something to get inside.


    +   - Assembly: Players may need to find several objects that they need to collect
    so they can put them together to make a new object that they will then use. It
    may be pieces of a machine, something that was broken, or snippets of code. Players
    may'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'also need an additional object to then assemble or to use the assembled object
    on. They may also need a wrench to assemble a machine, glue to put something back
    together, or a computer to run the code on.


    +   - One-time use: You can also have objects that have special one-time uses
    that the players need to hold onto and use at the right moment. They may need
    a match to get them safely through a dark area, bait to catch a small animal,
    or a potion to give them temporary flight. In all of these cases, the players
    can only use the object once! So the trick is to get the players to think carefully
    about when time is, or they need to go back, get another item, or start over again.


    Similar to objects the players need and carry with them, you can also have obstacles
    that require the players have done something first before they can get past. They
    might need to have talked with an important character, or learned a secret password
    before they can enter an area. They might need to have accomplished something,
    like rescuing the prince before they enter the castle. Passing these obstacles
    doesn''t require that the players have something but rather that they know or
    have done something.


    You won''t put this information in the narrative parts that are read loud to the
    players. That wouldn''t be fun at all! Instead, these are a part of the rules
    that will be outlined for the person running the game. Because these rules usually
    affect two locations—the place where the players find or learn something and the
    place where they use it—it is best to include it in both locations.


    For example, let''s say the players need to use a key they find in the study to
    later open the chest in the basement. When they find the key, under the rules,
    you can state:


    +   - The key is small and ornate and seems important. The key will open the chest
    found in the basement.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Later, when the players discover the chest in the basement, you can state in
    the rules:


    +   - The chest is finely crafted, with an ornate lock. The chest will only open
    with the small ornate key found in the study.


    In this example, you can see a few things. First, there''s a clue that the key
    goes to the lock by the repeated use of the word ornate. This could be helpful
    if the players have several keys, to let them know which key to use on the lock.
    Second, remember to use italics to denote something for the person running the
    game to take note of—but not to read out loud.


    Using all these tips, write up the rules for the obstacle you created in the previous
    activity. Also, revise the rules you wrote earlier for your first few locations
    and make any adjustments you might need.


    # Action Words!


    +   10–15 minutes Idea sheet, paper, pencil


    # Activity Overview


    In interactive fiction games, players are taking actions in your games as they
    explore, solve problems, and get past obstacles. You want to give them opportunities
    and the tools and information they need to do things in your games. Applying that
    approach to your design is important!'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Instructions


    To get started, think about the main types of actions that players might try in
    interactive fiction games. These are as follows:


    +   * Look

    * Take

    * Drop

    * Put

    * Examine

    * Search

    * Inventory

    * Open

    * Close

    * Lock

    * Unlock

    * Ask

    * Tell

    * Say

    * Give

    * Show


    Thinking about how players may act in your game will help you as you think of
    obstacles and the things you want them to do in your game. It will also help you
    think of important rules for what happens in your game. Remember, you don''t have
    to think of every possible thing players might try to do in your game! But it
    definitely helps to think of and make rules for the ones that are important or
    fun.


    Brainstorm action words and create rules for the locations you have already written
    up in your game. Add one or two new rules for each, thinking about how to incorporate
    these common actions verbs.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Filling It In: Redux


    25–30 minutes Idea sheet, paper, pencil


    # Activity Overview


    By now, you should have a good foundation to work on your own to add the rest
    of your locations, obstacles, rules, and descriptions to your game. The next step
    is to work on filling in the rest of your game!


    # Instructions


    Go through and create write-ups for each of the locations on your game map. As
    you''re working, don''t be afraid to add new locations or make changes! Design
    is a work in progress and great, new ideas can come as you are building your game.
    Remember, the most important thing is to have fun!


    # Iterate and Refine


    25–30 minutes Idea sheet, paper, pencil


    # Activity Overview


    Game design is an iterative process. Whoa now, there''s a pretty big word! Luckily,
    it means something you already understand. In general, iterative means you will
    come up with something, try it out, make changes, and try again. This means—for
    you—that it''s time to playtest and refine!'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'With your flashlight in hand, you approach the item glinting in the corner.
    It is so gloomy and dirty, you would never have seen it without the flashlight.

    Picking it up, you see that it is a dagger. Old—and a little rusty—but still sharp
    enough to do some damage.

    Maybe there is still some treasure to be found in this dirt.


    If you keep digging, turn to page 76


    If you go down the tunnel, turn to page 83


    # # Instructions


    Testing means you get to try your game out. So grab a few friends and give them
    a chance to play the game you''ve made so far. Don''t worry about how well you
    run the game—that''s not your focus right now. Instead, pay attention to where
    players get stuck or what seems confusing for them. When you''re in the middle
    of designing your game, you know how things go together and what they need to
    do. But these things may not be so obvious to your players! They have to puzzle
    things out on their own, and sometimes, that may be too hard for them to figure
    out. It''s okay if it takes them some time to make connections or get past obstacles—as
    long as they''re having fun. But if it''s taking a really long time for them to
    figure things out, then you may want to make some adjustments.


    +   - Provide clues and hints in your descriptions or in what is shared with the
    players in the rules when they interact with things in your game.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Adjust some of the challenges in your game to make them easier or more difficult.
    You want to challenge the players, but you also want them to have fun and be successful.
    Make sure your game is winnable and fun!


    The goal is to be open to make changes to your game and continue to try to make
    it better! There''s no doubt you''ll find a place or two that could use improvement,
    and that''s the goal of this activity.


    # Running the Game


    20–25 minutes Idea sheet, paper, pencil


    # Activity Overview


    Here we are: the final Parsely activity. Here, you''re going to learn how to have
    fun running the game, making it an awesome experience for everyone involved. Parsely
    games are meant to have an exciting, explorative feel with a bit of tongue-in-cheek
    fun when it comes to how well everything runs.


    As I mentioned, Parsely is modeled after games that are run on computers—old computers—that
    didn''t have sophisticated ways of understanding (or parsing—get it?) what the
    players are inputting. That is an important thing to keep in mind when the game
    is being run!


    # Instructions


    Before you begin, need players! Find a group of friends, then introduce the game
    to your group and give some introduction to where and when the story is happening
    (if that will help them dive into the story). You should also lay out the rules
    for the game:'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   * Players are working together to explore and play through the story.


    +   * Players will take turns telling the “computer” what they want to do.


    +   * Commands should be simple, two- or three-word combinations of a single action.
    They aren’t allowed to combine actions in a single command (e.g., “open the egg
    and drink the yolk”).


    +   * The “computer” will respond with what happened as a result of their commands.


    +   * Players can give advice and help each other, because they are working together.


    +   * Players are permitted to “save” and “restore,” because horrible things may
    befall.


    With out of the way, it’s time to start the game! To kick it off, read the description
    and provide the exits for the very first location. Then, allow the first player
    to give a command. Look at the rules and let the player know what happens. The
    next player gets to give a command next. Keep going from player to player until
    the group makes its way through the game!


    Some important tips and tricks to keep in mind as you run your game:


    +   * If the players try something that isn’t listed in the rules, feel free to
    have fun making up a response. It could be outrageous, funny, add more detail
    to the story, or cause the game to end in a horrible way!


    +   * Also, have in fun with words. If players don’t use the right words, express
    confusion. For example, if the players find a box and then one of them says to
    you, “Open it,” you can respond and say, “I don’t see an it.” Players must be
    specific—they see a box, and that’s what they can open. It may sound annoying,
    but it can make for some fun times!


    +   * If things end horribly, start the game from the beginning. Introduce the
    game and read the description and exits from'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'the first location. Have fun as you redo this, like you are introducing the
    game for the very first time.


    +   If players told you to “save,” then they can start the game over at the point
    they saved by by telling you to “load.” They will have all the things they had
    at that point and you will just continue the story like they were back at that
    point. It''s up to you to remember where they saved last, or you can ask the players
    to remind you where that was. What you shouldn''t do, though, remind them to save
    and load. Let them meet a horrible end a few times. They will quickly figure out
    that they need to double-check themselves, and their frustration is so much fun
    to watch!


    You are now a Parsely game master! You should feel comfortable starting to build
    interactive fiction games in both CYOP and the Parsely formats. These are great
    ways to get into interactive design: they don''t require much beyond some time,
    effort, and imagination.


    By now, though, I bet you''re ready to get to the heart of the book: Twine. I
    know, I know, don''t worry. That''s coming up next! In the next section, you''re
    going to explore how to build digital interactive fiction games, which will include
    learning how to code them, too.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# TWINE GAMES:

    WIND IT UP


    Twine is a tool that allows you to create digital interactive fiction games that
    can be shared with the world. Creating Twine games will draw from many of the
    skills you developed making your analog (or nondigital) interactive fiction. As
    far as gameplay, Twine falls somewhere between CYOP games and Parsely games. Interactions
    in Twine are often selecting between a series of choices—like CYOP games—but you
    can use many of the open-ended gameplay and requirements from Parsely, as well.

    Every activity in this chapter will require a computer and Twine, unless otherwise
    noted.


    # Let''s Take a Tour


    +   5–10 minutes


    Before you can get started with Twine, you''ll need to either download or open
    the program online. You can find the Twine program at http://twinery.org. There,
    you can download the program for Windows, macOS or Linux, depending on the computer
    you are using. All these activities will be based on Twine 2, so you''ll want
    to download the latest version available that starts with a 2. You can also create
    your game online, which will work on any computer.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Create Interactive Stories in Twine


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_71_0.png)


    # # Instructions


    The interface is similar no matter which platform you end up using. For this book,
    we are going to be using the web-based interface. There are also several story
    formats you can use. For this book, we''ll be using the default story format for
    Twine 2: Harlow. You don''t have to do anything to pick this format—once you download
    and get started, that will already be selected.


    So let''s begin tour of Twine! I will be your guide. When you first launch Twine,
    you''ll see the story page.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
