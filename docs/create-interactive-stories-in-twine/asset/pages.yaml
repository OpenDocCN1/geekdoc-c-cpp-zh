- pgno: 115
  md: '# A Little More Style


    10–15 minutes


    # Activity Overview


    In the last section, you saw that you can change the style of the text. But there
    are more ways that you can change text to accent or emphasize elements in your
    story. Here are a few other cool macros you can use!


    # Instructions


    These new styles will all go inline with the text you want to affect. The text
    you put in the hook section will be changed.


    # Font


    The font macro will allow you to change the font used on a section of text. The
    font needs to be recognized and used by web browsers, so you can''t go too crazy
    with the font you pick. But that still leaves a lot of cool options! For example,
    you might want to use the Courier New font to create a newspaper headline, like
    this:


    I picked up the paper and read the headline.


    ```

    Warning: danger of a TSUNAMI!!!

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Color


    This macro will let you change the font color of a section of text. Maybe you
    want to use a different color to emphasize a word or phrase, or maybe you just
    love the way a color looks. You can use basic color names, like green, red, or
    blue, or a hex code with the macro.


    I ate the very, very (color: red)[hot] pepper.


    and


    I ate the very, very (color: #ff0000)[hot] pepper.


    Both of these macros will create the same effect:


    ```

    I ate the very, very hot pepper.

    I ate the very, very hot pepper.

    ```


    # Background


    You can also change the background color behind text. Just like with changing
    font color, you can use basic color names or hex codes.


    (background: red)[This should be on a red background.]


    ```

    This should be on a red background.

    ```


    # Transition


    Twine also has the ability to add a little pizzazz to your text with transition
    macros. These cause the text to briefly animate when the passage loads. It can
    be pretty cool!'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   - Suddenly I realized (transition: "dissolve")[I wasn''t alone!]

    - This causes the hook to fade in.

    - Suddenly I realized (transition: "shudder")[I wasn''t alone!]

    - This causes the hook to shake back and forth

    - Suddenly I realized (transition: "pulse")[I wasn''t alone!]

    - This causes the hook to pulsate briefly.


    # Text-Style


    This is another way to do some of the styling we covered earlier—but with more
    options. You can make standard style changes like bold, italics, and striethrough.
    But you can also create some cool effects for your text: flip it backwards, upside
    down, or make it shudder and shake. Unlike transitions—which happen once as the
    text is loaded—text-style continues while the passage is being read. For example:


    Suddenly the (text-style: "upside-down")[room] flips.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_117_0.png)


    Here are some other text-styles. Try some of them out!


    +   - "bold"

    - "italic"

    - "underline"

    - "outline"

    - "shadow"

    - "blur"

    - "blurrier"

    - "smear"

    - "mirror"

    - "upside-down"

    - "blink"

    - "fade-in-out"

    - "rumble"

    - "shudder"'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Rotate


    Our last text macro is super cool. Once you''ve got it figured out, you will be
    able to actually turn the text like the hands of a clock. The number you put in
    is the amount (in degrees) that it will twist!


    I started (text-rotate:45)[falling...]


    45 will tip the text down like this:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_118_0.png)


    90 will have it go perpendicular, or straight down:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_118_1.png)


    You can play around with the number to get it to where you want it to be!'
  merge: -1
