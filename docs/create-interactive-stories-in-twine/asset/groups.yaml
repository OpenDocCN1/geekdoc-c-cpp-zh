  - '[PAGE 98]


    # # Will You Vary Me?


    10–15 minutes


    #  Activity Overview


    Now we''re getting somewhere! Well, in a kitchen inside a spooky house, at least.
    Because this is shaping up to be a spooky story, maybe we can track how scared
    the players get based on the choices they make and places they go in the game.


    To do this, we need to use something called a variable. A variable is a name we
    give to information. That information changes—or is variable—depending on what
    we tell the game to do. The variable name can be anything, but it''s usually best
    to give it a name that tells us what information the variable has. Makes sense!


    # Instructions


    In Twine, variables have a $ at the start of their names, like this:


    ```

    $variablename

    ```


    For example, you could have a variable for the player''s character name and call
    it $playername or $charactername. You could also use a variable to keep track
    of what has happened, what something is called, how much the player has of something,
    or how many times something has happened. There are a lot of interesting things
    you can do with variables in Twine! We can''t cover all of them in this book,
    but you''ll master a few to give yourself a good foundation.


    First things first, we need to create a variable to track how afraid the player
    is. I think a good variable name would be $fear.'
  md: '

    The readers will first see: ''I clicked the button.'' When they click the word
    button (duh), more text will appear, adding to the story. They will then see:
    ''I clicked the button itself. A door revealed itself behind the panel.''


    Spacing note: Notice in the example that I put a space inside the square brackets,
    before the start of the text that will be revealed. This macro will place whatever
    is in the square brackets immediately after what is in the quotes.

    (link-reveal: "head")[butt]


    - - would make "headbutt"

    - (link-reveal: "head")[butt] or (link-reveal: "head") [butt]

    - would make "head butt"


    A click macro is similar to the link macro, and it changes text in the passage
    by replacing or adding to it. But there are two big differences!


    1. The "text a" part in a click macro is not actually shown. Instead, the macro
    is looking for that text in the passage, and will affect it.

    2. All instances of the "text a" part will trigger the macro. And in most cases,
    it will affect all the instances of the text. Let’s say you make the word "dog"
    clickable and replaced by the word [cat] in your passage. If you have the word
    "dog" in your passage three times, all three of them would show as links. If the
    player clicked on any one of them, they would all be replaced by the word "cat"
    at the same time.


    Click (click: "text a")[text b]

    where "text a" appears in the passage, it will be clickable and trigger the macro.
    While all instances of "text a" will be clickable, [text b] will only appear where
    the macro is typed. To make the text appear everywhere, check out click-append
    a little further down.


    Example:


    - - I pet the shivering monkey. (click: "monkey")|It bites my finger.]


    - - The reader will first see: ''I pet the shivering monkey.'' When they click
    the word monkey, it will show: ''I pet the shivering monkey. It bites my finger.''


    Spacing note: Like the link macro, the spacing between your text and where you
    put the macro matters!


    Case: Your case (meaning the capital and lowercase letters) must be the same in
    your passage writing and "text a" section for Twine to see the two as a match
    and make the text clickable. For Twine, "dog" and "Dog" are two different words.
    On the other hand, if the word is a part of a larger word, Twine will recognize
    it—so be careful. That means if you were replacing dog with cat, the word "dogged"
    would become "catged." That''s not right! Unless you have a character named Catged.
    But that seems unlikely.


    - - Click-replace (click-replace: "text a")[text b]


    - - Anywhere "text a" appears in the passage, it will be clickable. And every
    instance of "text a" will be replaced by [text b].


    Example:


    - - I hate the circus because I hate clowns. They freak me out. I know clowns
    seem nice, but I just don''t know. They seem to be hiding something darker. (I''ll
    never trust clowns.


    - - (click-replace: "clowns")[makeup nightmares] This will make all the instance
    of "clowns" clickable. Clicking any of them will change the text to read: "I hate
    the circus because I hate makeup nightmares. They just freak me out. I know makeup
    nightmares seem nice, but I don''t know. They seem to be hiding something darker.
    I''ll never trust makeup nightmares.


    - * Click-append (click-append: "text a")[text b]

    * Anywhere "text a" appears in the passage, it will be clickable and it will have
    [text b] added immediately after. It doesn''t matter where you put this macro
    in your passage, though, again, it''s usually better for readability to add it
    at the end.

    * Example:

    * I hate the circus because I hate clowns. They just freak out me. I know clowns
    see nice, but I just don''t know. They seem to be hiding something darker. (click-append:
    "clowns")|and feet

    * This time, clicking on "clowns" will produce: "I hate the circus because I hate
    clowns and feet. They just freak out me. I know clowns and feet seem nice, but
    I just don''t know. They seem to be hiding sothing darker. I''ll never trust clowns
    and feet."


    - * Click-prepend (click-prepend: "text a")[text b]

    * Anywhere "text a" appears in the passage, it will be clickable and it will have
    [text b] added immediately before.

    * Example:

    * I hate the circus because I hate clowns. They just freak out me. I know clowns
    see nice, but I just don''t know. They seem to be hiding something darker. I''ll
    never trust clowns.

    (click-prepend: "clowns")|monkey ]

    * With this macro, clicking on "clowns" makes the passage read: "I hate the circus
    because I hate monkeymon clowns. They just freak out me. I know monkey clowns
    seem nice, but I just don''t know.


    They seem to be hiding something darker. I''ll never trust monkey clowns.


    Just to hammer this point home: it''s best to place click macros at the bottom
    of your passage.

