    of your passage. If you place the macro on a line by itself before or in between
    text, Twine will create a blank line. And if you happen to have more than one,
    you''ll be faced with multiple blank lines. To avoid this, it''s best to put these
    at the bottom of your passage so the text that your players are reading is up
    at the top and not moved around or spaced oddly.


