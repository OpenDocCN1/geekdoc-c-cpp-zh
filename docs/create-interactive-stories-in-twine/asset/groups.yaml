  - '[PAGE 32]


    # # Funky Fiction Flow


    Up to now, you have been thinking about moving your game forward as the readers
    make the correct choices at their decision points.


    This is a great start, but you can use some different tools that allow the players
    to maintain the progress they made while also introducing interesting choices
    into the game. The next three activities are meant to give you some more tools
    for your arsenal of awesomeness to draw from when building your game!


    # # Getting Loopy


    +   - 10–15 minutes Idea sheet, sticky notes, pencil


    # ## Activity Overview


    So far, you''ve created some simple decision points in your game, letting the
    players choose between a few options. One choice moved the players forward, the
    other ended the game and they would need to start over.


    There may be times when things end so horribly that the players need to start
    over from the beginning. But if every wrong choice forced the players to have
    to start from the beginning, players might get tired of having to go through the
    same material again and again as they try to reach the end of your game. That''s
    a problem!


    # ## Instructions


    Take a look at the block you placed just before your final block. Think of a decision
    that players could make that would not move them to the end but also wouldn''t
    force them to start over.


    For example, in the example right before I defeat the warlock, I need to speak
    the words of power to weaken him. Speaking'
  - '[PAGE 33]


    the words of power moves forward in the story to where I defeat the wizard. Maybe
    at the block just prior, I can add another choice to throw a rock at the wizard.
    Because players are so close to winning, I don''t want to just end the game by
    choosing wrong, so I can loop them back to the block where they need to choose
    what to do to defeat the wizard


    So, I can add a new block between the final block and the one where I made the
    choice. I have a new outcome, and so I would draw an arrow from the decision block
    to this new outcome block. In this block, I can write that the rock bounces harmlessly
    off the wizard and I better think of something more effective. I can then draw
    an arrow from this block back to the block that I made the decision. This, as
    you can probably tell, creates a loop!


    If the players choose to throw the rock, they learn that it didn''t work well
    and they are brought back to make a different decision. This is explained by the
    path of the arrows, so look closely!


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_0.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_1.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_2.png)


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_33_3.png)'
