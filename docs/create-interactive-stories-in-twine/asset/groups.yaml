    # If-Else-If


    15–20 minutes


    # Activity Overview


    With a title should come a reward! And so we come to our last activity showcasing
    the tools of Twine. Now that there are three possible titles, else how about if
    the old woman gives the players a reward based on which they have?


    # Instructions


    To accomplish this, we''re going to extend the conditional statement macro to
    include two new macros: else and else-if. These two new macros, along with the
    plain conditional, will let you create a chain of possibilities for things to
    happen in your game. The general format looks like this:


    ```

    ($variable is value)[hook a]

    (else)[hook b]

    ```


    This says something very simple, despite how complex it looks: if a variable has
    a particular value, then Twine will execute hook a; otherwise, it will execute
    hook b. Through everything you''ve done so far, you''ve seen that a hook can show
    text, display a link, or other actions. If that''s not exciting enough for you,
    you can also have a more complex chain with several conditions based on the value
    of the variables.


    ```

    ($variable is value a)[hook a]

    (else-if: $variable is value b)[hook b]

    (else)[hook c]

    ```'
  - '[PAGE 111]


    Phew, that''s kind of doozy. This string of statements says that if the variable
    has value a, then execute hook a; if the value of the variable is b, then Twine
    will execute hook b; if neither of those is true, then hook c will be executed.


    It will probably make a bit more sense if you can see an example, so let''s create
    an else-if, else statement for the old woman in the kitchen. Let''s make her the
    players one of three things, depending on their titles. If they are “The Balloon
    Slayer,” she will give them a dearly departed balloon named Bob. If they are “The
    Fearful,” they will get a yellow binky, because they''re scared. Otherwise, they''ll
    receive a big giant glitter L (for “The Lame”) to wear on their foreheads.


    How are you going to do all that? Edit the Kitchen passage. After the woman calls
    the players by their titles, insert the following:


    > “I have something for you.”


    (if: $title is ''The Fearful'')[The woman reaches into her bag and pulls out a
    yellow binky. “I know how scary the world can be.”](else-if: $title is ''The Balloon
    Slayer'')[The woman reaches into her bag and pulls out a piece of ribbon with
    something pink on the end. She sniffles “His name was Bob.”](else:) [The woman
    reaches into her bag and pulls out a large glittery L. “It is for your forehead,
    dear. Next time, make a name for yourself.”]


    The End!


    I''m sure you saw this coming—test your game again! This time, check every title
    out to make sure you get a different response for each of the three titles.'
  - '[PAGE 112]


    # Getting Published


    10–15 minutes


    # Activity Overview


    Congratulations! You have just created a very short and very silly—but also very
    fun–Twine game. Now you need to share it with the world! Well, maybe just share
    it with your friends.


    # Instructions


    When you''re all finished with a game in Twine, you''ll need to publish the game
    to a file, which you can then share and use to play the game. Twine will publish
    the game to an .html file, which is a web page that can be displayed in a browser.


    Make one last check of the game we''ve been making to ensure everything works
    and there aren''t any broken links or dead ends. Once you''re satisfied, click
    on the story''s title on the story map page. The very bottom left link will give
    you the option to Publish to File.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_112_0.png)


    Click this link, and Twine will save your game wherever your browser saves files.
    It shouldn''t take long for Twine to create the file. When that''s done, open
    the file and play your game!'
