    # Touchstones


    10–15 minutes Sticky notes, pencil


    # Activity Overview


    You now have a start and an end to your game, but things need to happen between
    those points. We wouldn''t have much of a game (or a story) otherwise! What goes
    between the middle and the end is called the plot.


    # Instructions


    For this activity, think about the main events that you want to happen in your
    story. Look through the ideas you put down on your story sheet and think what
    things need to happen in your story. In my example, the players will need to find
    the magic words of power to defeat the wizard. To get those, they will need to
    trade a piece of gold to an old elf, and they find gold in a chest buried on an
    island. Other things will happen in the story, but these are the main events that
    *must* happen. All these ideas need to go on their own sticky notes and be placed
    on the story sheet in order, from the beginning toward the end.


    Because these are on sticky notes, you can move them around, make room for new
    ones, or take them away as your story takes shape. That’s the beauty of this process!
    Each of these events will be touchstones your players get to experience as they
    work through the game.'
