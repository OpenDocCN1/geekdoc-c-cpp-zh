  mdcn: '


    # 创造你自己的作品


    25–30 分钟


    # 活动概述


    学了这么多东西！幸运的是我们来说，Twine 是一个设计非常精良的软件。这意味着你越用它，它就会变得越来越好！相信我——Twine 的可能性仅限于你自己的想象力。


    # 指南


    现在轮到你了。你已经具备了在 Twine 中创作的良好基础。结合我们到目前所学到的知识，开始创作你自己的杰作吧！也许可以继续完善我们之前开始的游戏，使用 CYOP
    或 Parsely 设计风格，或者大胆地从零开始设计一个新游戏。


    如果还不完美，或者在这个过程中犯了错，不要担心。所有的错误和意外都是设计过程的一部分！在添加新部分或进行更改时，务必进行检查和测试——如果你能尽早发现它们，以后就会少很多麻烦，相信我。并记住——玩得开心！


    # 进一步探索


    你不会以为我到这里就结束了对吧？我希望你在在 Twine 中构建的过程中玩得很开心。在最后，我想给你提供几个工具，以便在你创作未来超酷的游戏时使用。这些是更复杂的主题，可以扩展并增强游戏。


    想要了解更多——除了这里之外——请务必查看 Twine Wiki：https://twinery.org。此外，一些最好的技巧可以通过玩 Twine 游戏来学习！你可以在互动小说数据库找到：http://ifdb.tads.org/。


    本章中的所有活动都需要电脑和 Twine。


    # 更多样式


    10–15 分钟


    # 活动概述


    在上一节课中，你可以看到更改文本的样式。但还有更多方法可以更改或强调你故事中的元素。这里有一些你可以使用的其他酷宏！


    # 指南


    这些新样式将应用于你想要影响的文本。你放在 hook 里的文本将被改变。


    # 字体


    字体宏允许你更改文本中使用的字体。字体需要被浏览器识别，所以不要把字体选得太离谱。但这有很多酷的选项！例如，你可能想用 Courier 字体创建一个报纸标题，像这样：


    拿起报纸标题。


    ```

    警告：危险

    ```


    # 颜色


    此宏允许你更改文本的字体颜色。也许你想要用不同的颜色来强调某个单词或短语，或者你只是喜欢这种颜色的效果。你可以使用基础颜色名称，如绿色、红色或蓝色，或者使用十六进制代码。


    (color: red) 和 (color: #ff0000) 都会产生相同的效果：


    ```

    红色的。

    红色的。

    ```


    # 背景


    你还可以更改文本后的背景颜色。就像更改字体颜色一样，你可以使用基础颜色名称或十六进制代码。


    (background: red)应该是红色背景。


    ```

    这应该是红色背景。

    ```


    # 过渡


    Twine 还可以通过过渡宏为你的文本添加一些活力。这些宏会让文本在加载时产生短暂的动画。这非常酷！


    - (transition: "dissolve") 让 hook 淡入。

    - (transition: "shudder") 让 hook 抖动。

    - (transition: "pulse") 让 hook 短暂脉动。


    # 文本样式


    这是实现我们涵盖的一些样式的另一种方法——但选项更多。你可以制作粗体、斜体和删除线等标准样式。但你也可以为文本创建一些酷的效果：将其翻转、倒置，或者让它颤抖。与在加载时发生一次的过渡不同——文本样式会在阅读期间持续存在。例如：


    (text-style: "upside-down") 房间翻转了。


    ![](img/3760f220c9ee3ac581049b31bdccc4_117_0.png)


    这里是其他样式。试试它们吧！


    - "bold"

    - "italic"

    - "underline"

    - "outline"

    - "shadow"

    - "blur"

    - "blurrier"

    - "smear"

    - "mirror"

    - "upside-down"

    - "blink"

    - "fade-in-out"

    - "rumble"

    - "shudder"


    # 旋转


    我们的最后一个文本宏超级酷。一旦你掌握了它，你就能像时针一样旋转文本。你输入的数字是它旋转的角度（度）。


    (text-rotate: 45) [正在落下...]


    45 会让文本倾斜：


    ![](img/3760f220c9ee3ac581049b31bdccc4_118_0.png)


    90 会保持竖直：


    ![](img/3760f220c9ee3ac581049b31bdccc4_119_0.png)


    # 哇——这是从哪里来的？


    10–15 分钟


    # 活动概述


    有时你可能想在游戏中提醒某些内容。你可以使用两个宏：alert 和 prompt。


    # 指南


    alert 宏与 prompt 类似，但它会向玩家显示设置的内容。像 alert 一样，你可以把它放在段落中。结构是：


    (alert: "text")


    :


    (alert: "你叫什么名字？")


    ![](img/3760f220c9ee3ac581049b31bdccc4_120_0.png)


    prompt 宏允许你从玩家那里获取信息。结构是：


    (prompt: "你叫什么名字？")


    这是一个示例：


    (prompt: "你叫什么名字？")


    另一个例子是：


    (prompt: $name, "无名者")


    ![](img/3760f220c9ee3ac581049b31bdccc4_121_0.png)


    # 显示


    5–10 分钟


    # 活动概述


    display 宏是在另一个段落中显示另一个段落的内容。如果你有一段想要重复使用的文本，这非常有用！


    # 指南


    与其每次使用都重新输入文本，你可以把它放在单独的段落中。然后，每当调用它时，可以使用 display 宏。


    ```

    (display: "段落名称")

    ```


    一个例子可以是故事中反复出现的歌曲或诗歌。


    # 头和脚


    10–15 分钟


    # 活动概述


    你之前接触了一个特殊的段落标签：startup 标签。我们用它处理游戏中使用的变量；它告诉 Twine 在执行其他操作之前读取它。还有几个你可以在 Twine
    中使用的特殊段落标签。你应该了解的是 header（头）和 footer（脚）。


    header 和 footer 段会在每个段落中显示并运行。header 运行在段落顶部，而 footer 运行在底部。就像“startup”段落一样，要创建
    header 或 footer 段落，你必须创建一个段落并使用相应的标签。


    如果你在段落中放入文本，它将出现在每个页面的顶部或底部。你还可以包含宏！如果这样做了，它们会在每次页面加载时运行。


    '
