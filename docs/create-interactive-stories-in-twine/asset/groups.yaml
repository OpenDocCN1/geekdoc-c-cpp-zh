    现在，观察你的起始区块，考虑玩家可以拥初始选择以及每个选择将他们引向何处。现在保持简单，让它成为两个选项之间的选择。以后，你可以开始探索多一个选择，但第一次运行时让我们保持保持简单。


    另一个选项是呈现单一决策，为玩家提供两个选择：做某事或不做某事。任何选择都会产生后果！


    一旦你有了选择，在起始区块的右侧放置与我类似的区块。给它们命名，并写下一些将要发生的细节。不要忘记从起始区块向你的新区块画箭头，以便你记住动作的方向！


    # 后退一步 (One Step Back)


    - 10–15 分钟 想法表、便利贴、铅笔


    ## 活动概述


    另一种方法是从最终事件开始并向后推，考虑在后续事件发生之前需要发生什么。


    在我的故事示例中，我需要在山上击败巫师。所以我需要思考：在巫师被击败之前发生了什么？嗯，为了通过巫师，我需要说出咒语。而在做那之前，我需要到达山顶。


    # 指南


    考虑你的结局，以及玩家在到达结局之前可能需要做什么。在你的最终区块的左侧放置一个区块。像你之前的区块一样，给该区块命名并填充关于那个时刻的细节。因为这是一个决策点，从这个区块画一条线到你的最终区块。你向读者呈现的其他决策会让他们远离击败巫师，还是会导致失败？


    作为一名设计师——你现在是了——在制作游戏时，能够向前向后思考是有帮助的。记住你的起点并填充剩余事件，这将有助于你的故事从该起点连接到结局！


    ![](img/3760f220c9ee3ac581049b311bdccc4_31_0.png)


    ![](img/3760f220c9ee3ac581049b311bdccc4_31_1.png)


    # 趣味剧情流 (Funky Fiction Flow)


    目前，你一直在思考如何在玩家在决策点做出正确选择时推进游戏。


    这是一个很好的开始，但你可以使用一些不同的工具，让玩家在保持已有进展的同时，向游戏中引入有趣的选择。接下来的三个活动旨在为你构建游戏时提供更多工具！


    # 循环 (Getting Loopy)


    - 10–15 分钟 想法表、便利贴、铅笔


    ## 活动概述


    到目前，你已经在游戏中创建了一些简单的决策点，让玩家在几个选项之间选择。一个选择让玩家前进，另一个则结束游戏，导致他们需要重新开始。


    有时事情结束得非常糟糕，导致玩家需要从头开始。但如果每个错误选择都迫使玩家从头开始，他们尝试到达游戏时可能会反复经过相同的素材。这是一个问题！


    ## 指南


    观察你放置在最终区块之前的区块。思考玩家可以做的一个决策，它既不会让他们走向结局，也不会迫使他们重新开始。


    例如，在击败巫师之前的示例中，我需要说出咒语来削弱他。说咒语会让故事进展到我击败巫师的地方。也许在之前的区块中，我可以添加另一个向巫师扔石头的选择。因为玩家离胜利非常近，我不希望他们因为选错就结束游戏，所以我让他们循环回到需要选择如何击败巫师的区块。


    所以，我可以在最终区块和我做选择的区块之间添加一个新区块。我有一个新的结果，因此我会从决策区块画一个箭头到这个新结果区块。在这个区块中，我可以写道石头无害地弹开了巫师，我最好想个更有效的方法。然后我可以从这个区块画一个箭头回到我做决策的区块。正如你可能观察到的，这创建了一个循环！


    如果玩家选择扔石头，他们发现这没起作用，并被带回做出不同的决策。这通过箭头的路径来解释，请看它。


