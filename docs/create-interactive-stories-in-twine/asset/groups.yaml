    由于无物保护自己，你伸出双手，掉掉了手电筒。然而，这无用事。几秒钟内，你感到两根尖利的獠牙刺穿了脖子的皮肤。然后……


    黑暗。


    结束。


    现在，编辑该段落并将其命名为“Variables”——因为它将包含这些内容。我们还需要做一件非常重要的事情：给这个段落一个特殊的标签（tag）。我们以前没有用过标签，但它们通常不会影响游戏。它们只是你用来组织或排序段落的一种方法。有几个标签与
    Twine 交互，`startup` 标签就是其中之一。它告诉 Twine 在运行你的起始段落之前先读取这个段落。这意味着 Twine 将知道你在段落中引入并设置的变量。这样，当你以后使用它们时，Twine
    已经知道它们了！


    在标签区域，点击添加标签按钮并输入“startup”。现在我们只需要设置我们的变量了。我们将要使用一个名为 `set` 的新宏，它看起来像这样：


    ```

    (set: $fear to value)

    ```


    在我们早前的一个示例中，我们可以为玩家名称创建一个变量。我们可以先将玩家名称设置为 `none`，以后给玩家一个机会输入自己的名字。它看起来像这样：


    ```

    (set: $classname to "none")

    ```


    因为 `$classname` 变量是某些文本，所以它需要放在引号中。Twine 会将引号内的任何内容视为文本，并进行相应的处理。


    我们将使用数字来跟踪玩家有多害怕。他们恐惧的初始值为零。每当发生可怕的事情时，我们就会在那个数字上加 1。数字越高，他们越害怕。我们将这样设置 `$fear`
    变量：


    ```

    (set: $fear to 0)

    ```


    因为这个值是一个数字，所以不需要放在引号里。继续将 `$fear` 变量添加到“Variables”段落中。完成后，你的段落看起来应该像这样：


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_100_0.png)


    恭喜——变量设置好了！你的故事地图现在应该看起来这样：


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_101_0.png)


    # 变量，出发吧！


    + 10–15 分钟


    在我们继续之前，让我们花一点时间测试并确保我们的变量已全部设置好。这是介绍 Twine 测试工具的完美时机。测试模式让你运行游戏，并会为你提供关于后台某些内容的额外信息，向你展示它们随着你玩游戏是如何变化的。这是一个非常有用的工具，所以我们在接下来的过程中会查看它几次！


    ## 指令


    在故事地图上，点击测试按钮。这将启动你的游戏——但你会在右下角看到一个新区域：


    | $fear | 0 |

    | Turns: | 1 |


    顶部部分显示你的变量。你应该能在左侧看到你设置的 `$fear` 变量，在右侧看到数字 0。如果是这样，说明你很棒了！


    如果你想知道其他元素是什么，我给你做一个简要介绍。在变量下方，你可以跟踪经过了多少回合。玩家采取的每一个动作——点击和在段落之间移动——都会消耗一个回合。这个调试视图将显示更多关于宏的信息。好了，既然我们知道变量运行正常，让我们让我们来使用它吧！关闭测试标签页回到故事地图。一旦回到那里，编辑“Front
    of the House”段落。如果你还记得的话。

