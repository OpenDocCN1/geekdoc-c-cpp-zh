    of the save game from Slot A to anything you want—just be sure to change it in
    both the save and load game code! How often and where to place the save and load
    code will depend on how you want to make this available to your players.


    +   - If you want them to always be able to save and load, then you could put
    it in a footer passage, so it will always show at the bottom of the game

    - If you wanted to create checkpoints, you could put load code in a footer passage
    and only put the save game code in select passages that you want the players to
    be able to save. This way, the players will always be able to load their games,
    but they will only be able to save in select locations!


    To start, try just putting the save and load code in a footer passage to make
    sure it''s working. Then, decide how you want to use the functionality and make
    the changes you need to!


