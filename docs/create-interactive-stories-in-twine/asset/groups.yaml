    you look, you see floating balloons.


    The door to the inside of the house sits a little afar.


    Now, let''s make some fun changes to the text based on the macros we learned about.


    First, I want to have the text about the door in the last sentence change when
    the player clicks on it. Once clicked, it should change from being "a little afar"
    to "creaking open." That will make things a little more dramatic. And when the
    door creaks open, how about if we show a new link into the house? Change the last
    sentence to read the following:


    The door to the inside of the house sits a little afar.(click-replace: "sits a
    little afar.")[slowly creaks open ... [[Enter the House->Kitchen]]


    You notice a link as a part of the text to be revealed. So when the player clicks
    on the phrase "sits a little afar" to open the door, he or she will now have a
    way to get inside—because a new link will show up. Pretty cool, right? Just be
    sure to keep the link the square brackets for the text that is going to be shown!
    It can be confusing with the extra brackets, but if you take your time, you shouldn''t
    have a problem. I also put it on a separate line, so when it displays, it''ll
    be easy to read. You should also have a new passage titled "Kitchen" from the
    link we created in the click-replace macro.


    Next, we need to add a link back to the field where we came from. I think you
    should be a link master, and I''ll let you take care of that.


    Lastly, let''s replace all the instances of the word "floating" to "popped" if
    a player clicks on "floating." Look back at the macros we covered and pick one
