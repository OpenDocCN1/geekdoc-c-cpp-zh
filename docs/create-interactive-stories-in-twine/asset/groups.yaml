    他们住在附近的一棵树上。但玩家们还不知道这一点。如果玩家在毫无准备的情况下就冲出去查看那歌声……嗯，只能说他们的故事结束得比他们预想要快得多。如果他们想保护自己，就必须先检查房间，并在小屋里找到那根拐杖。


    所以就在起始区块的右侧，我将创建两个新区块，一个在上在上下。对于每个区块，我将从起始区块画一个箭头。箭头的方向可以让我记住决策从哪里来，以及通向什么结果。


    一个区块是查看小屋；另一个是调查那歌声。为了方便我一眼看出，我将动作的摘要作为标题放在区块的顶部，然后为每个动作写几句关于发生的情况。如你所见，如果玩家选择检查小屋，他们就会找到拐杖。如果他们选择跑到外面，他们就会遭遇惨惨的命运（噢不！）。


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_29_0.png)


