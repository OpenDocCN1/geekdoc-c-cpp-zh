  - '[PAGE 9]


    # INTRODUCTION


    Hey there! First things first, I want to give a big thank you for joining me on
    this game design journey. The goal of this book is to give you a chance to share
    your voice and creativity. And, if you want to get really excited, it will allow
    you to take your first steps as a game designer and story crafter! So let''s get
    you started creating interactive fiction.


    Over the course of this book, you''ll get a chance to develop interactive fiction
    games in a number of different formats. While the overall goal of this book is
    to get you comfortable with creating and coding digital interactive fiction games
    in Twine—I bet you couldn''t guess that from the title—you''ll have to learn to
    walk before you can run. We''ll start off by working on developing your story
    and gameplay nondidinally before jumping into coding with Twine.


    This is an important step because building a good understanding of how to develop
    and refine your gameplay before you begin coding will help your final game truly
    shine!


    Right off the bat, I want to let you know there are a few things that this book
    will not do for you:


    +   1. This book will not make you rich and famous.

    2. This book will not do you your laundry.

    3. This book will most definitely not make you taller ... unless you stand on
    it.


    But there are some things that I can promise you this book will do!


    +   1. This book will introduce you to interactive fiction–what it looks and feels
    like.

    2. This book will get you started making your own games–with both paper and pencil
    and Twine.

    3. This book will support a wobbly table or chair.'
