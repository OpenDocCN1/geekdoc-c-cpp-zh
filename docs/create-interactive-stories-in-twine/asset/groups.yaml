  mdcn: "\n\n![](img/3760f220c9ee3ac581049b311bdc3cc4_79_0.png)\n\n你继续挖掘，希望能找到更多有用的物品，甚至是某些有价值的东西。很快，你遇到了一些较大的石头，还有看起来像……一丝微弱的光。\n\
    \n也许这就是出口！你急急地开始拔出那些大石头。光变得越来越亮。在兴奋中，你没有注意到周围的空气变得越来越热了——比热得多。\n在移开一块特别巨大的石头后，地面震动起来，在你脚下崩塌了。你坠落……坠落……坠落，掉进了岩浆河。\n\
    \n结束。\n\n给你的第一个段落命名为“Start”。在正文中写入“You are standing in in ...”并点击右上角的 X。\n\n![](img/3760f220c9ee3ac581049b311bdc3cc4_79_1.png)\n\
    \n当你完成后，你应该回到了网格页面并看到以下内容：\n\n![](img/3760f220c9ee3ac581049b311bdc3cc4_79_2.png)\n\
    \n这是你的起始段落——命名为 Start——带有绿色飞船图标和正文文本的小预览。点击底部菜单中的播放图标查看你游戏的全部风采！\n\n## 发送信息 (Text\
    \ Me)\n\n10–15 分钟\n\n## 活动概述\n\n好了，我承认，那确实有点大失所望。但嘿，你总得从哪里开始，对吧？关闭打开游戏的标签页，让我们回到故事网格！\n\
    \n我觉得这个故事游戏缺少了一些，嗯，故事。所以让我们加点东西吧！你从上一个活动中看到，你输入的任何内容都会作为游戏的一部分显示。你不需要做任何特殊处理——直接输入即可。\n\
    \n不过，你可能想添加一些额外的样式和装饰。有些样式可以通过简单在你想更改的文本周围添加几个字符来实现：\n\n- **粗体**（bold）可以在两端各添加两个单引号来实现：\n\
    \  - 'Look at my \"bold statement\"'\n- *斜体*（Italics）可以在两端各添加两个正斜杠来实现：\n  - OI\
    \ //really, really// like your hair.\n- ~~删除线~~（Strikethrough）可以在两端各添加两个波浪号来实现：\n\
    \  - OI really, ~~hate~~ like your hair.\n- *上标*（Superscript）可以使用两端各添加两个脱帽符号来实现：\n\
    \  - OIts the worst, like 1000^^2^^\n\n## 指南\n\n现在轮到你了！编辑你的起始段落，并尝试几种不同的样式。记住，你需要在想要更改的文本两侧都放置正确的字符。如果你最终看到了你尝试用来更改文本的字符（如波浪号或斜杠），那意味着你犯了错误。幸运的是，这很容易修复。如果是这样，请回去并编辑段落。仔细观察并尝试修复出现出的问题。这被称为“调试（debugging）错误”。当一切准备就绪后，点击底部的播放图标进行测试，看看你的新样式看起来如何！\n\
    \n你还会注意到，在 Twine 中编写游戏使用了大量的自然语言。你只需要像往常一样写作，并添加一些额外的片段来适应游戏。这就是使用 Twine 创建数字互动虚构游戏的奇妙之处。你只需要编写并添加几个元素，就能让它们看起来和玩起来都很棒！\n\
    \n## 我们的第一个段落\n\n5–10 分钟\n\n## 活动概述\n\n既然你已经掌握了样式设置，让我们完成练习游戏的开头吧。在接下来的几个活动中，你将遵循我的示例开始创建一个简单的、可玩的游戏。目标是向你介绍可以在\
    \ Twine 中使用的工具，并提供这些工具在程序中外观和功能的示例。\n\n## 指南\n\n让我们使用 Parsely 游戏示例中很不错的介绍段落。编辑你的起始段落并输入以下内容：\n\
    \n你正站在一个被遗忘已久的废弃田野上。草茎在风中摇曳。在你面前，有一座房子立在田间。油漆剥落、脱皮。窗户全是破破碎的。\n\n```\n//No one\
    \ has lived here in years//\n```\n\n注意，第一段和带有斜体的第二行之间有一个空行。当你完成段落的编辑后，关闭它并点击播放图标。两个文本部分之间的间隙仍然在那里，对吧？记住这一点——当你输入段落时，它会保留你写作时使用的间距。你不需要做任何特殊处理！\n\
    \n## 点击链接 (Hit the Links)\n\n现在你有了故事的开头，它需要去某个地方。你可以创建更多作为游戏后续步骤的段落，但你需要一种方法到达它们！怎么做呢？一个词：链接。链接允许你连接到其他段落，或者回到已经创建的段落。除了连接，链接还允许你揭示新信息。接下来的几个活动将向你展示如何使用链接来扩展和完善你的游戏。有趣的内容！\n\
    \n链接将使用双方括号 [[ ]]。。括号内的文本将定义链接以及它连接的段落。链接将以蓝色文本显示，这样每个人就知道它是特殊的！\n\n## 新段落链接 (New\
    \ Passage Links)\n\n10–15 分钟\n\n## 活动概述\n\n你的故事在某个时候必须向前发展。你希望玩家拥有一些选择和新的段落来探索和扩展他们的游戏。这些就像我们构建\
    \ CYOP（由你选择的冒险）游戏时的决策点。每个决定都将引导向一个新的段落，即你故事的新部分。我们需要在两个段落之间创建一个链接，将我们从第一个段落中的一个选择跳转到新段落之一。\n\
    幸运的是，Twine 有一种快速简单的方法可以做到这一点！当你添加一个新链接时，Twine 会自动创建一个以链接名为标题的段落。所以让我们创建一个指向新段落的链接并同时创建该段落。\n\
    \n## 指南\n\n打开并编辑你的起始段落。在最后一行留一个空行，然后输入以下内容：\n\n```\n[[Approach the House]]\n[[Go\
    \ around Back]]\n```\n\n完成后，关闭段落。你应该看到两个新的段落。你能猜到它们叫什么名字吗？一个是“Approach the House”，另一个是“Go\
    \ around Back”。应该有两个箭头，每个箭头从你的起始段落指向其中一个新段落。\n\n![](img/3760f220c9ee3ac581049b311bdc3cc4_84_0.png)\n\
    \n在后台，这让你知道有链接将起始段落到那两个段落。箭头的方向让你知道你可以从起始段落跳转到“Approach the House”和“Go around\
    \ Back”段落。但你不能直接回去——也不能去任何其他地方。\n\n等等，我漏掉了一些。现在是介绍“后退（step-back）”功能的好时机。它可能有点难看，但在玩游戏时，它位于左侧上方，看起来像一个循环箭头。\n\
    \n![](img/3760f220c9ee3ac581049b311bdc3cc4_84_1.png)\n\n点击其中一个链接后，使用箭头退回到起始段落并尝试另一个链接。非常简单！\n\
    \n## 回链 (Linking Back)\n\n10–15 分钟\n\n## 活动概述\n\n所以，尽管后退功能很酷，但并不是理想的。它实际上会撤销一次回合，当我们深入构建游戏时，这可能会导致问题。所以让我们给故事添加内容，并同时创建一个回到起始段落的链接。\n\
    \n## 指南\n\n打开名为“Approach the House”的段落并输入以下内容：\n\n> 你开始靠近那座房子，但有些地方看起来……//劲劲风在房子周围废弃的田野上呼啸。也许是门廊上的洞，或者是挂在灯上的旧鞋子。但如果你能找到另一种进入房子的方法，你会感觉好得多。\n\
    \n```\n[[Start]]\n```\n\n"
