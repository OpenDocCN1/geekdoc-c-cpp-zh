    \ that is guarding the path to the city of Fruitopia. And to get past the banana,\
    \ they will need to have a very hungry gorilla accompanying them. Who else is\
    \ going to be able to take on and eat the rabid banana, right?! Without the gorilla,\
    \ it will end horribly for the players.\n\nThis is where you, as the designer,\
    \ get to have fun with your players. You don't want to find them just before they\
    \ run into the banana. If you do, it becomes obvious what they will need to do\
    \ and they are guaranteed to find the gorilla right before meeting the banana\
    \ and will always be prepared to deal with it. Though success is fun, having to\
    \ work for that success is even better!\n\nInstead, the gorilla should be in a\
    \ location a few rooms away, and may have its own challenge make it difficult\
    \ to acquire. But keeping them apart creates a problem for the players to solve\
    \ without an immediately obvious solution!\n\nThey may run the rabid banana first—before\
    \ finding the gorilla—and die a horrible death at the hands of the yellow fruit.\
    \ They can then load their game and explore other areas, looking for a way to\
    \ help them get around the banana and discover the gorilla!\n\n## Instructions\n\
    \nLooking at the story for your game, pick an obstacle that the players will need\
    \ to get past in your game and place it in a location on your map. Next, add the\
    \ thing needed to a location a few rooms away from the obstacle's location. It's\
    \ as easy as that!\n\n## Inventory and Requirements\n\n- 20–25 minutes Idea sheet,\
    \ paper, pencil\n\n### Activity Overview\n\nUnlike CYOP games, in a Parsely game,\
    \ the players can have an inventory. As they make their way through your game,\
    \ they can find and carry things around with them. This gives you an opportunity\
    \ to create more interesting decisions and challenges for the players than simply\
    \ choosing between a few options!\n\nNow, players can find tools, keys, or other\
    \ odd objects that they may not immediately know what to do with. You can also\
    \ create obstacles that require the players to be creative in how they use what\
    \ they have found! Giving your players items will give you—as you design the game—new\
    \ ways of unleashing horrible events and woes on your players as they try to use\
    \ things and they go terribly wrong.\n\n## Instructions\n\nCheck out a few examples\
    \ of how you can take advantage of the players being able to take and use things.\n\
    \n- Locks: Players can find keys, gems, or other things that they need to use\
    \ on an object to unlock it. That object could be a chest, a door, a wall, or\
    \ a magical portal. This could include breaking as well! Players may need an object\
    \ to break open something or break down something to get inside.\n- Assembly:\
    \ Players may need to find several objects that they need to collect so they can\
    \ put them together to make a new object that they will then use. It may be pieces\
    \ of a machine, something that was broken, or snippets of code. Players may also\
    \ need an additional object to then assemble or to use the assembled object on.\
    \ They may also need a wrench to assemble a machine, glue to put something back\
    \ together, or a computer to run the code on.\n- One-time use: You can also have\
    \ objects that have special one-time uses that the players need to hold onto and\
    \ use at the right moment. They may need a match to get them safely through a\
    \ dark area, bait to catch a small animal, or a potion to give them temporary\
    \ flight. In all of these cases, the players can only use the object once! So\
    \ the trick is to get the players to think carefully about when time is, or they\
    \ need to go back, get another item, or start over again.\n\nSimilar to objects\
    \ the players need and carry with them, you can also have obstacles that require\
    \ the players have done something before they can get past. They might need to\
    \ have talked with an important character, or learned a secret password before\
    \ they can enter an area. They might need to have accomplished something, like\
    \ rescuing the prince before they enter the castle. Passing these obstacles doesn't\
    \ require that the players have something but rather that they know or have done\
    \ something.\n\nYou won't put this information in the narrative parts that are\
    \ read loud to the players. That wouldn't be fun at all! Instead, these are a\
    \ part of the rules that will be outlined for the person running the game. Because\
    \ these rules usually affect two locations—the place where the players find or\
    \ learn something and the place where they use it—it is best to include it in\
    \ both locations.\n\nFor example, let's say the players need to use a key they\
    \ find in the study to later open the chest in the basement. When they find the\
    \ key, under the rules, you can state:\n\nThe key is small and ornate and seems\
    \ important. The key will open the chest found in the basement.\n"
  mdcn: "\n\n箱子里的钥匙将用来打开门。\n\n如果玩家尝试开门，他们会发现门锁着。如果玩家拥有箱子里的钥匙，他们就可以用钥匙来开门。\n\n你可能已经注意到在这些示例中使用了两种字体。*斜体*的单词是专门给“计算机”准备的，让它知道将发生什么。正字体的单词则可以与玩家分享。\n\
    你的规则可以包含玩家在检查物品时会发现的内容。例如：“如果玩家检查镜子，他们会发现玻璃后面藏着一封信。”你可以描述玩家在做某事时会发生什么：“如果玩家打开门，一只狼子会攻击他们。”你也可以说当他们没有某物或没有做某事时会发生什么：“如果玩家没有硬币，吉普赛人会对他们施下咒语。”\n\
    不要害怕让可怕和难看的结局降临你的玩家！记住，他们可以保存游戏并恢复到保存的位置。乐趣的之一在于知道——有时候——会发生可怕的事情。\n\n看看我们这个包含这全部四个元素的示例游戏说明可能是什么样的：\n\
    \n## 小屋\n\n- 描述性文字：你早晨在自己的小屋里醒来，那里坐落在你住了一辈子的安静村庄里。小屋是一间简单、小的单间，有一张床、一个炉子和一个桌子。你看到角落里塞着一根大棍。过了一，你开始听到外面传来了奇怪但动听的歌声。\n\
    - 出：外\n- 规则：\n  - 床很简单，有点臭味。\n  - 炉子里装有昨晚的剩菜。如果玩家尝试吃一些，他们会病得满身是病。\n  - 桌子空空如也。\n\
    \  - 棍子是一根大棍子，用来拍掉床垫上的灰。玩家可以拿这根棍子。\n  - 歌声几乎是不自然的。它听起来既让人感到安慰，又让人不安。\n\n现在你已经看到该怎么做了，拿一张新纸，开始为你的前几个区域编写一些说明吧！\n\
    \n## 并不总是走直线\n\n- 5–10 分钟，构思表、纸、铅笔\n\n### 活动概述\n\n当我们构建 CYOP（由你决定）游戏时，我们使用的方法之一是回到决策点的循环。这允许玩家做出错误的选择，但不必从游戏开始重新开始。但玩家仍然会面对同样的选择，只能选择不同的选择，希望这次能向前移动。\n\
    \n在 Parsely 游戏中，你可以让玩家四处走动一下以绕过障碍或在游戏中前进。他们可能会向南走到一堆新挖的土堆。为了挖开那些土，他们需要一把铲子，而铲子只在北方才能找到。\n\
    \n所以，与你创建的 CYOP 游戏不同（在游戏中玩家故事总是总是向前推进），在 Parsely 游戏中，你可以将线索、工具和碎片散布在整个游戏中。现在，鼓励探索是好事，但你不想将其与你的故事弧线以及你想要在故事中发生的主要事件混淆。\n\
    \n例如，假设你想让玩家通过一只守着通往 Fruitopia 之路上的狂暴香蕉。为了通过那只香蕉，他们需要一只非常饥饿的大猩陪同。还有谁能对付并吃掉那只狂暴香蕉呢，对吧？！如果没有大猩，玩家的结局将非常惨。\n\
    \n这就是你作为设计者可以与玩家一起尽乐趣的地方。你不想在他们遇到香蕉之前就找到他们。如果你这样做了，他们需要做什么就变得显而易见了，他们保证会在遇到香蕉之前恰好找到大猩猩，并准备好应对它。虽然成功很有趣，但为了这种成功而努力会更有趣！\n\
    \n相反，大猩猩应该在几个房间之外的地点，并且可能有它自己的挑战使其难以获得。但将它们隔离开为玩家创造了一个需要解决的问题，而又没有立而易见的解决方案！\n\
    \n他们可能会先遇到狂暴香蕉——在找到大猩猩之前——并在那只黄色水果的手下惨死。然后，他们可以加载游戏并探索其他区域，寻找方法帮助他们绕过香蕉并发现大猩猩！\n\
    \n## 指示\n\n观察你游戏的故事，选择一个玩家在游戏中需要通过的障碍，将其放置在地图上的某个位置。接下来，将所需的物品放在距离障碍位置几个房间之外的地方。就这么！\n\
    \n## 物品栏与要求\n\n- 20–25 分钟，构思表、纸、铅笔\n\n### 活动概述\n\n与 CYOP 游戏不同，在 Parsely 游戏中，玩家可以拥有背包。当他们穿过你的游戏时，他们可以发现并随身携带物品。这为你提供了一个机会，为玩家创造更有趣的决策和挑战，而不仅仅是在几个选项之间做出！\n\
    \n现在，玩家可以发现工具、钥匙或其他他们可能立即不知道如何处理的奇物品。你也可以创建需要玩家发挥创意来使用所发现物品的障碍！给玩家提供物品将为你——在设计游戏时——提供新的方法，在他们尝试使用物品并发生严重错误时给玩家释放可怕的事件和灾难。\n\
    \n## 指示\n\n看看几个如何利用玩家获取并使用物品的示例。\n\n- 锁：玩家可以找到钥匙、宝石或其他需要在物体上使用的物品来解锁它。该物体可以是箱子、门、墙或魔法传送门。这可能也包括破坏！玩家可能需要一个物体来破开某物，或者破坏某物以进入内部。\n\
    - 组装：玩家可能需要找到几个需要收集的物品，以便将它们组合成一个新的物体供他们随后使用。它可能是机器零件、坏掉的东西或代码片段。玩家可能还需要额外的物品来组装，或在组装好的物体上使用。他们可能需要一把扳手来组装机器、胶水来把某东西粘在一起，或者一台电脑来运行代码。\n\
    - 一次性：你也可以设置具有特殊一次用途的物品，玩家需要持有它们并在正确的时刻使用。他们可能需要一个火柴来安全穿过黑暗区域，需要诱饵来捕捉小动物，或者一种药水给他们临时的飞行。在所有这些情况下，玩家只能使用该物品一次！所以技巧在于让玩家仔细思考何时是时候，或者他们需要回去拿另一个物品，或者重新开始。\n\
    \n与玩家需要并携带的物品类似，你也可以设置需要玩家在做过某事后才能通过的障碍。他们可能需要与重要角色交谈，或者在进入某个区域之前学习一个秘密密码。他们可能需要完成某项任务，比如在进入城堡之前拯救王子。通过这些障碍并不要求玩家拥有某物，而是要求他们或做过某事。\n\
    \n你不会把这些信息放在读给玩家听的叙述部分。那一点也不好玩！相反，这些是为运行游戏的人概述的规则部分。因为这些规则通常影响两个地点——玩家发现或学习某物的地方以及使用它的地方——最好在两个地点都包含它。\n\
    \n例如，假设玩家需要使用在书房找到的钥匙来以后打开地下室的箱子。当他们找到钥匙时，在规则下，你可以写道：\n\n钥匙小而精美，看起来很重要。这把钥匙可以打开位于地下室的箱子。\n\
    \n"
