    # Passages


    10–15 minutes


    Passages are the main building blocks of Twine. They are the containers that hold
    your story and the bits needed to make the game run. As you know by now, they
    are represented by the blocks on the grid. Passages are small chunks of your story.
    They can represent locations, they can represent conversations, and they can connect
    to each other by links, which often present themselves as choices to the players.
    They will also reveal themselves one at a time to the reader, so a passage is
    like a page in a book or a location in a Parsely game.


    That is why these passages should feel familiar. The work you did mapping your
    story out with sticky notes in the CYOP game and the location write-ups for the
    Parsely game are very similar to what you will be putting in your passages!


    # Instructions


    Since you cleared out your grid in the last activity, let''s add a new passage
    to start your Twine game. Click the big green Add Passage button to generate something
    boring called "Untitled Passage."


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_77_0.png)'
