    ![](img/3760f220c9ee3ac581049b311bdc3cc4_99_0.png)


    你慢慢走进隧道，手里拿着手电筒指引方向。你注意到这条隧道的地板被磨损得很厉害，似乎有什么东西反复在上面移动，在经过时留下了细小的凹槽。


    不久，厚厚的蜘蛛网开始阻挡你的道路，让你无法向前。。


