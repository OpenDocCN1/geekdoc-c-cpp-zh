  - '[PAGE 99]


    We need to introduce the variable to Twine and set the initial value. To do this,
    we''re going to create a new passage that isn''t linked to any of our passages.
    Instead, we can use it to store any variables we''re going to use in our game.


    Instead of adding a passage with a link, we will need to use the green "add passage"
    button on the story map to create a new untitled passage. Feel free to drag it
    to where you can see it, but make sure it isn''t in the way of your other passages.


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_99_0.png)


    Slowly, you make your way into the tunnel, the flashlight held in front of you
    to guide your way. You notice the floor of this tunnel is well worn, as if something
    has repeatedly moved across it, making small grooves as it passed.


    Before long, thick cobwebs begin to block your path, making it impossible to move
    forward.


    You turn head back, but you notice some sudden movement among the cobwebs. A giant
    spider bursts forth, fangs bared!


    With nothing to protect yourself, you throw out both hands, dropping the flashlight.
    However, it is no use. Within seconds, you feel two needle-sharp fangs pierce
    the skin of your neck. And then...


    Darkness.


    The end.


    Now, edit the passage and title it "Variables"—since that''s what it''s going
    to hold. We also need to do one very important thing: give the passage a special
    tag. We haven''t used a tag before, but they usually don''t impact the game. They''re
    just a way for you to organize or sort your passages. There are a few tags that
    interact with Twine, and the startup tag is one of them. tell Twine to read this
    passage first, before running your starting passage. That means Twine will know
    the variables you introduce'
  - '[PAGE 100]


    and set in the passage. That way, when you use them later, Twine will already
    know about them!


    In the tag section, click the add tag button and type “startup.” Now we just need
    to set our variables. We’re going to use a new macro called set, and it looks
    like this:


    ```

    (set: $fear to value)

    ```


    In one of our earlier examples, we could create a variable for a player name.
    We could set the player name to none to start, and give the player an opportunity
    to enter his or her own name later on. That would look like this:


    ```

    (set: $classname to "none")

    ```


    Because the $classname variable is some text, it needs to be in quotations. Twine
    will read anything inside quotation marks as text, and treat it accordingly.


    We’re going to use numbers to track how afraid our players are. The starting value
    of their fear will be zero. Every time something scary happens, we’ll add 1 to
    that number. The higher number, the more scared they are. We’ll set our $fear
    variable like this:


    ```

    (set: $fear to 0)

    ```


    Because the value is a number, it doesn’t need to go in quotations. Go ahead and
    add the $fear variable to the “Variables” passage. When you’re done, your passage
    should look like this:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_100_0.png)'
  - '[PAGE 101]


    Congrats—variable set! Your story map should now look like:


    ![](img/3760f220c9ee3ac581049b311bdc3cc4_101_0.png)


    # Variables, Go!


    +   10–15 minutes


    Before we go any further, let''s take a minute to test and make sure our variable
    is all set. This is a perfect time to introduce the testing tools Twine. Testing
    mode lets you run through your game, and it gives you extra information about
    some of the things on the back end, showing you how it changes as you play through
    the game. It''s a very useful tool to use, so we will look at it several times
    as we move forward!'
  - '[PAGE 102]


    # # Instructions


    On the story map, click the test button. This will launch your game—but you''ll
    also see a new section in the lower right corner:


    | $fear | the number 0 |

    | Turns: | 1 Abandoned Field | Debug View | 1 Variable |


    The top part shows your variables. You should see the $fear variable you set on
    the left and the number value 0 on the right. If you do, you''re in great shape!


    In case you were wondering what the other elements were, I''ll give you a quick
    rundown. Below the variables, you can track how many turns have passed. Each action
    a player takes—clicking and moving between passages—uses a turn. This debug view
    will show more information about the macros and backend in the passage. The variable
    button will toggle on and off displaying the variables.


    Okay, now that we know our variable is working, let''s use it! Close the testing
    tab and go back to the story map. Once you''re there, edit the “Front of the House”
    passage.


    If you remember, that was kind of a spooky place, and being there should definitely
    raise the fear level of the players. Now, we''re going to use the set macro in
    this passage to add 1 fear whenever the players come here.


    At the bottom of the passage, add the following:


    ```

    (set: $fear to +1)

    ```


    This macro says that it''s going to add 1 to whatever the current value of $fear
    is. We set the $fear value to 0 in the “Variable” passage, the first time the
    players go here, their $fear value should go up to 1. If they left and came back,
    it would go up to 2.'
  - '[PAGE 103]


    Once you have the macro in place, close the passage and click test. You should
    see $fear set to the number 0 in the test area. Now click on the link to approach
    the house. Do you see how $fear is now the number 1? Things are getting scary!
    Click the link to head into the abandoned field. Fear is still 1. Whatever the
    current value of a variable is will stay unless you change it with a macro or
    start the game fresh. Try approaching the the house again and see what happens
    to $fear!


    # Showing Some New Text


    10-15 minutes


    Now that we are using variables to accumulate fear, we need to do something with
    that fear. To do this, we can use something called a conditional statement that
    tells Twine the following: if $fear is a certain value, then do something. The
    basic structure of the if conditional statement is as follows:


    ```

    (if: $variable is value)[do this]

    ```


    If the value is a number, you can just put that number there. If it''s text, then
    you need to put it in quotations—remember?


    +   - (if $fear is 5)

    - (if $belly is "bloated")


    # Instructions


    We will add two fear condicionals to the "Front of the House" passage. One will
    show some text, and the other will use a new -'
  - '[PAGE 104]


    macro called goto. You don''t know what that means yet—but I promise we''ll go
    over it!


    Go to the story map and edit the “Front of the House” passage. Below the line
    you set the $fear variable, let''s add a new line that will show text if $fear
    is 2:


    (if: $fear is 2)[You shiver in fear]


    This statement says that when the players come to this passage, if the variable
    $fear is exactly 2, then it will show the text “You shiver in fear” exactly where
    this line is. Even though that sounds pretty cool, I think we need to make a few
    changes. First, we need to change the part “is 2.” As it is, this statement says
    that if $fear is exactly 2, then the phrase will be shown. That also means, though,
    if $fear is 3, it won''t. But I would want the phrase to show, because the player
    is still afraid. Instead of using “is,” we can also use other operators that give
    us some more options. Here are some of the operators you can use in IF statements.


    +   * is if the variable is the same as the value

    * > if the variable is greater than the value

    * >= if the variable is greater than or equal to the value

    * < if the variable is less than the value

    * <= if the variable is less than or equal to the value


    Since the player will still be afraid above a level of 2, edit the conditional
    statement so it tells Twine that if the variable $fear is greater than or equal
    to 2, the statement will be displayed:


    (if: $fear >= 2)[You shiver in fear]


    The other thing to change is where the text is showing. It doesn''t make sense
    there at the bottom! So we need to move it to where it will make more sense. We''ll
    also need to move the macro where we add 1 to fear.'
  - '[PAGE 105]


    When Twine runs a passage, it will run from the top to the bottom. We want the
    statement adding-1 to the variable to come first. After all, as soon as the players
    enter the scary area, they''re going to get scared! No need to wait.

    Move the set and if macros before the link to go to the field passage. With all
    that done, test it out! Start the game from the beginning. Head to the front of
    the house, go back to the field, and go to the front of the house again. Your
    conditional should have triggered, and the second time you went to the front of
    the house, you should see the new line added to the passage!


    # # Going Places


    10-15 minutes


    # # Activity Overview


    Besides just showing some text when a variable reaches a certain value, we can
    also make other things happen. As you''re probably noticing, Twine opens the door
    to a lot of possibilities! You can have a link appear after a variable reaches
    a certain value:


    ```

    (if: Sfear is 4) [[Your heart pounds wildly->Pass Out]] ]

    ```


    That statement will show the link "Your heart pounds wildly" to the players on
    this passage when Sfear is at the number 4. If the players click the link, they
    will be taken to a passage titled "Pass Out." This use of variables to reveal
    links is an important tool. It can be very useful to show progression through
    a game!'
