    # Branchy McBranchface


    10–15 minutes Idea sheet, sticky notes, pencil


    # Activity Overview


    One of the ways in which you can use your decision points is to create a branch,
    or an alternate path that still continues your story forward and eventually meets
    back up with the main story line.


    For example, maybe early on in the wizard story, there''s a point where the players
    can choose between two paths, both of which could eventually lead them to the
    old pixie who gives them the gold. The players could literally be at a crossroads
    that forks left and right. Taking the left fork would lead to an old bridge they
    must cross and a troll they defeat defeat before get to the pixie. The right fork
    will get them ambushed by robbers, and they will need to past past to get to the
    elf.


    # Instructions


    Introducing forks like this makes your game more interesting and also makes your
    game replayable, because now if the player goes through your game and chooses
    a new path, a whole new part of the story opens up!


    Despite the advantages, introducing a lot of paths can make it complicated to
    design your game. Early on, maybe just use one until you get comfortable putting
    the entire game together.


    Take a look at your second sticky note, the one that comes right after your first
    decision point. Think of how you can create a branch with just a single step before
    you bring the story back to the main story path.'
