    A click macro is similar to the link macro, and it changes text in the passage
    by replacing or adding to it. But there are two big differences!


    +   1. The "text a" part in a click macro is not actually shown. Instead, the
    macro is looking for that text in the passage, and will affect it.

    2. All instances of the "text a" part will trigger the macro. And in most cases,
    it will affect all the instances of the text. Let’s say you make the word "dog"
    clickable and replaced by the word [cat] in your passage. If you have the word
    "dog" in your passage three times, all three of them would show as links. If the
    player clicked on any one of them, they would all be replaced by the word "cat"
    at the same time.


    Click (click: "text a")[text b]

    where "text a" appears in the passage, it will be clickable and trigger the macro.
    While all instances of "text a" will be clickable, [text b] will only appear where
    the macro is typed. To make the text appear everywhere, check out click-append
    a little further down.'
