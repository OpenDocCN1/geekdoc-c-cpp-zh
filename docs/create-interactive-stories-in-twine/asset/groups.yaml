    [content]

    ## Interactive Fiction Concepts


    There are a number of other concepts that fall somewhere between game and story
    that relate to interactive fiction. A lot of these aspects can greatly impact
    the quality and enjoyability of your game. And, even better, they can improve
    your effectiveness as a game designer! These include control, perspective, cues,
    audience, decision points, paths, and interactions.


    - **Control**: This is how much control of the story flow you have versus how
    much you give up to the reader. Interactive fiction is about creating a story
    that you allow the players to explore and discover. They make your way through
    your game by making choices. They are active participants—and that brings excitement!
    In a traditional story, readers have no control of how the story progresses or
    when things are revealed or discovered. As a writer and designer of interactive
    fiction, you are giving them some of that type of control. And how much you give
    up depends on the type of story you''re trying to tell!


    In the first type we''ll take a look at—choose your own path—you still have strong
    control of how the game/story progresses. Players read along and make a choice,
    turning to the appropriate page to see what happens next. Progression is usually
    very linear, meaning it moves along in a straight line. Their choices just help
    line move forward by making the right choices when they need to. Parsely and Twine
    games allow players to explore more. You may want the players to go into the kitchen
    and find the key so they can get into the basement, but instead they go into the
    backyard and find a shovel. They will still need to get the key from the kitchen,
    but when they do that is ultimately up to them!


    - **Perspective**: This is the viewpoint of the player who is playing the game.
    In interactive fiction, you can provide a background to the character, but the
    player will be going through the story in a first-person perspective. He or she
    will be making decisions and exploring the story. So when you start coming up
    with characters for your story, you''ve got to remember that everyone you create
    will interact with the player as he or she moves through your game.


    - **Cues**: Cues are related to the challenges and conflict in your game. It''s
    not a lot of fun—when you''re playing a game—to just blindly guess what choice
    you need to make. Make the right choice and you live. Make the wrong choice and
    you die. That''s obviously pretty important! You want players to have an idea
    of how to make an informed and interesting decision based on information they
    got earlier in the game. These can be hints and clues the player gets from items
    and characters they encounter in the story that they use to help make informed
    decisions. Going back to control, players may get to a point early in the game
    where their decisions aren''t based on anything, and they choose blindly and die.
    But in a great game, players can go back and explore more to find the clues or
    items they need to move forward!


    - **Audience**: When designing games and writing stories, it''s always important
    to keep in mind who your audience is going to be. You want the content, language,
    and challenges to be appropriate for who you''re writing for.


    - **Decision points**: These are key to interactive fiction games. They are a
    main part of what make it a game! They should be challenging, interesting, fun,
    and engaging. Players should want to make these decisions to move the story forward!


    - **Paths**: As the name kind of implies, paths are the different choices and
    directions that your story can go as the readers play your game.


    - **Interactions**: Just like paths, interactions are pretty explanatory. They''re
    what you can do to the things in your game: pull, push, talk ... anything you
    can imagine!


    ## Choose Your Own Path Style Games


    The most accessible—and probably the most familiar—interactive fiction is known
    as choose your own path, or CYOP. This is very close to a standard story, except
    that there are decision points pepper throughout. At all these points, readers
    have to decide upon the best course of action. There are typically two or three
    choices for the readers to make, with a page they need to turn to in order to
    find out what happens next. The story then continues on the page they turn to—or
    it may end due to terrible misfortune. Oh, the humanity!


    > You wake up to find yourself in a dark, musty cave filled with skittering bugs.
    They click and clack in the silence of the cavern. You are not sure how you got
    here—you were hiking through the forest when, suddenly, everything went dark and
    you remember falling. Looking up, you see a ray of sunlight coming through a hole
    in the ceiling of the cave, very high up. That must be where you fell through,
    but there is no way you can use to get out. You have to find another way.


    > Looking around, you see bones—some fresh and very old—scattered throughout the
    cave. There also appears to be a tunnel leading into the gloom. You can either
    explore the bones or head off into the tunnel.


    > If you explore the bones, turn to page 86


    > If you head off down the tunnel, turn to page 43


    Check out this example if that doesn''t make much sense:


    Welcome back—I hope you chose wisely! Though that''s just a simple example, you
    really get to the heart of what interactive fiction games are all about. You have
    a story that presents the players with decisions. If players are thoughtful—or
    just lucky—their choices help move the story forward, and the players keep reading
    and playing. The wrong decisions can set the players back or end their game!


    With a conventional story, you—the author—would have a lot of control. You know
    exactly how it is going.


    ## An Idea Sheet and Some Activities


    ## Activity Overview


    Beginning to write a story can be really easy—or it can be a serious challenge.
    For your CYOP game, take a moment to think what you''d like to make a story. It
    often helps to pick a single starting point to begin, and then start building
    around the other elements.


    Pick one of these three categories to help you start:


    - **Setting**: Where do you want your story to take place? Maybe you want to write
    a story about a dark, haunted castle. Or you might want to make a story that takes
    place on a distant planet. Think about a place that is interesting or exciting
    for you to write about!

    - **Character**: Who do you want to make a story about? A dangerous pirate with
    a soft spot for birds, or maybe a fiery, independent inventor. Many great stories
    revolve around a single central character. Maybe that character is the hero—but
    he or she is the villain. Maybe there''s a twist—the character is someone who
    didn''t seem important until later in the story.

    - **Interaction**: What big thing do you want to happen in your story? Maybe aliens
    invade a school dance, or the main character wakes up in a dog''s body. Think
    of an exciting, impactful event that the player/reader must navigate or overcome!


    ## Starting Spark


    - 10–15 minutes Idea sheet, pencil


    ## Instructions


    Once you have your starting idea, get a sheet of paper that will be the idea sheet
    for your design, and write down the starting point

