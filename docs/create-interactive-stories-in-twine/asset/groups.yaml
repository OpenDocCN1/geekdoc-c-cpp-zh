    # 关于作者


    教育游戏领域的专家 Brian Mayer 为许多出版物撰写相关文章，并为美国图书馆协会合著了书籍《图书馆游戏：通过现代桌游实现同步学习》（Libraries
    Got Game: Aligned Learning through Modern Board Games）。他游戏《自由——地下铁路》的作者，这是一个涵盖奴隶这一艰难话题的合作游戏。《自由》被评为年度游戏、最具创新游戏、年度合作游戏以及最佳主题游戏。除了编写和设计游戏外，Mayer
    还经常在全国学校图书馆、教育和游戏会议上演讲现代游戏在教育中的价值。


    # 图片致谢


    封面（插图）Africa Studio/Shutterstock.com；封面（网页图表）Siyavush Saidian；封面，第1页（二进制代码）Valery
    Brozhinskinsky/Shutterstock.com。


    设计：Greg Tucker，排版：Nicole Russo-Duca；编辑：Siyavush Saidian


    交互式叙事是任何游戏的基础，而 Twine 为用户提供了制作自己的选择游戏的工具。从叙事的基础开始，转向 Parsely 游戏，最后探索 Twine，读者将学习制作有趣且引人入胜的故事类游戏的精秘。这本卓越资源中的实践活动设计独特，旨在向教师教授计算思维、变量和
    Harlow 编程语言的基础知识——同时在在线制作游戏的过程中享受乐趣。


