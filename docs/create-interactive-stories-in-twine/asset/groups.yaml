    # TWINE 游戏：上手指南


    Twine 是一款允许你创建数字交互式小说游戏的工具，并可以将其与世界共享分享。创建 Twine 游戏将运用到你在制作模拟（或非数字）交互式小说时开发的许多技能。在游戏性方面，Twine
    介于 CYOP（选择你的冒险）游戏和 Parsely（文本解析）游戏之间。Twine 中的交互通常是在一系列选项之间进行选择——就像 CYOP 游戏——但你也可以使用
    Parsely 的开放式玩法。除非另有说明，本章中的每个活动都需要一台电脑和 Twine。


    # 让我们开始之旅


    5–10 分钟


    在开始使用 Twine 之前，你需要下载或在网上打开该程序。你可以在 http://twinery.org 找到 Twine 程序。在那里，你可以根据你使用的电脑下载
    Windows、macOS 或 Linux 版本的程序。所有这些活动将基于 Twine 2，因此你可能需要下载最新版本。你也可以在线创建你的游戏，它在任何电脑上都能运行。


    # 在 Twine 中创建故事

    无论你最终使用哪个平台，界面都是相似的。对于本书，我们将使用基于 Web 的界面。还有几种你可以使用的格式。对于本书，我们将使用 Twine 2 的默认故事格式。你不需要执行任何操作来选择此格式——一旦下载并开始，它就已经被选中了。所以让我们开始
    Twine 之旅吧！我将是你的向导。当你第一次启动 Twine 时，你会看到故事页面。


    ![](img/71_0.png)

    ![](img/71_1.png)


    如果你向左侧看，将看到你正在创作的故事列表。由于这是你的第一个故事，你在这里不会看到任何故事。但当你开始编写它们时，你可以在这里找到它们！右侧窗口是故事菜单，你可以在那里开始新故事、加载正在编写的故事、归档故事以备后用，或更改你正在使用的格式。你需要开始你的第一个故事，请点击绿色按钮来创建它。这是一个大时刻！


    ![](img/72_0.png)

    ![](img/72_1.png)


    系统会要求你为故事命名。如果你正在处理一个已经开始的故事，你心里应该有一个标题。如果这是一个全新的故事，请尽管给它起一个新名字！你以后可以随时更改，所以不用担心。继续给它起名并点击绿色的“Add”（添加）按钮。你的游戏应该在一个新标签页中打开，标签页上显示故事的名字。


    ![](img/73_0.png)


    如果你回到第一个标签页并刷新页面，你现在应该能在左侧区域看到你的故事，如下：欢迎来到你的第一个 Twine 交互式小说游戏！到目前为止很容易，对吧？


    # 旅继续


    5–10 分钟


    # 活动概述


    感谢留在 Twine 之旅！虽然我猜你并没有太大选择……我仍然是你迷人的（希望如此！）向导。让我们回到有故事的标签页，继续之旅的其余部分。你会发现屏幕的大部分被一个巨大的网格空间占据，中心有一个正方形。那个正方形是你故事的开头！在
    Twine 中，它被称为“段落”（passage）。很快，你就会添加更多段落，用你精彩的故事填满网格空间。


    ![](img/74_0.png)


    你可以点击并拖动该段落到网格空间中的任何位置。随着页面的填充，重新排列段落布局有时会有帮助，让它们对你来说合乎逻辑，并更容易找到你想要的内容。


    # 指南


    你可以点击并拖动该段落到网格空间中的任何位置。随着页面的填充，重新排列段落布局有时会有帮助，让它们对你来说合乎逻辑，并更容易找到你想要的内容。


    # 清理


    –10 分钟


    # 活动概述


    感谢留在 Twine 之旅！虽然我猜你并没有太大选择……我仍然是你迷人的（希望如此！）向导。让我们回到有故事的标签页，继续之旅的其余部分。你会发现屏幕的大部分被一个巨大的网格空间占据，中心有一个正方形。那个正方形是你故事的开头！在
    Twine 中，它被称为“段落”（passage）。很快，你就会添加更多段落，用你精彩的故事填满网格空间。


