  trans: "\n\n```cpp\nstd::cin >> name; // 从用户获取输入并存储在 'name' 变量中\n\nstd::cout <<\
    \ \"Hello, \" << name << \"!\" << std::endl; // 使用用户的名字问候用户\n\nreturn 0;\n\n}\n\
    ```\n\n## 新代码说明\n\n*   `std::string name;`: 声明一个名为 `name` 的字符串变量，用于存储用户的输入。\n\
    *   `std::cin`: 用于从用户读取输入。输入存储在变量 `name` 中。\n*   程序询问用户的姓名，然后打印个性化的问候语。\n\n##\
    \ 第 5 步：构建并运行新程序\n\n*   再次构建并运行你的程序。\n*   这一次，程序将提示用户输入姓名，并打印个性化的消息。\n\n## 常见错误与调试\n\
    \n*   **编译器错误（Compiler Errors）**: 如果存在拼写或语法错误（例如缺少分号），编译器将生成错误。检查并修正代码。\n*   **运行时错误（Runtime\
    \ Errors）**: 在程序运行时发生的错误。例如，除以零会导致运行时错误。\n*   **逻辑错误（Logic Errors）**: 程序运行没有报错，但由于逻辑错误产生了错误的结果。\n\
    \n***\n\n## 本章结束清单\n\n*   安装一个 C++ IDE，如 `Visual Studio`、`CodeBlocks` 或 `CLion`。\n\
    *   了解如何编写和运行简单的 `\"Hello, World!\"` 程序。\n*   学习使用 `std::cin` 和 `std::cout` 进行基础输入输出操作。\n\
    *   排除语法或逻辑错误。\n\n***\n\n## 测验\n\n1.  C++ 中 IDE 的用途是什么？\n2.  哪个命令用于显示文本？\n3. \
    \ 在 C++ 中如何读取用户输入？\n4.  哪个函数作为 C++ 程序的入口？\n\n***\n\n## 术语表\n\n*   **IDE**（集成开发环境）:\
    \ 一个用于代码编写、编译和调试的软件工具。\n*   **编译器（Compiler）**: 将 C++ 代码翻译成机器码的程序。\n*   `std::cout`:\
    \ 用于输出的流对象。\n*   `std::cin`: 用于输入的流对象。\n*   **构建/编译（Build/Compile）**: 将源代码转换为可执行程序的过程。\n\
    \n## 第 3 章.C++ 语法\n\n理解 C++ 的基础语法是编写程序的第一步。在本章中，我们将涵盖 C++ 语法的核心组件，包括变量、数据类型、运算符和函数。\n\
    \n***\n\n## C++ 程序结构\n\n典型的 C++ 程序结构如下：\n\n```cpp\n#include <iostream>   // 包含\n\
    using namespace std;  \n\nint main() {             // main 函数是程序的入口\n    cout\
    \ << \"Hello, World!\"; // 输出\n    return 0;           // 返回 0，表示程序成功结束\n}\n```\n\
    \n*   `#include <iostream>`: 包含 `iostream` 库。\n*   `int main()`: 每个 C++ 程序必须有这个函数。\n\
    \n***\n\n## 变量与数据类型\n\n变量用于存储数据。C++ 是一种静态类型语言，意味着每个变量必须声明类型。常见的 C++ 数据类型包括：\n\n\
    *   `int`: 用于整数（例如 `int age = 30;`）。\n*   `float`: 用于浮点数（例如 `float pi = 3.14;`）。\n\
    *   `double`: 用于双精度浮点数（例如 `double g = 9.8;`）。\n*   `char`: 用于单字符（例如 `char grade\
    \ = 'A';`）。\n*   `string`: 用于文本（例如 `string name = \"John\";`）。\n*   `bool`: 用于布尔值（`true`\
    \ 或 `false`，例如 `bool isActive = true;`）。\n\n***\n\n## 运算符\n\nC++ 提供了各种运算符来进行计算、比较和逻辑操作。\n\
    \n1.  **算术运算符（Arithmetic Operators）**:\n    *   `+`（加法）：`a + b`\n    *   `-`（减法）：`a\
    \ - b`\n    *   `*`（乘法）：`a * b`\n    *   `/`（除法）：`a / b`\n    *   `%`（模运算）：`a\
    \ % b`（除余数）\n2.  **比较运算符（Comparison Operators）**:\n    *   `==`（等于）：`a == b`\n\
    \    *   `!=`（不等于）：`a != b`\n    *   `<`, `>`, `<= `>= （小于、大于、小于等于、大于等于）\n3. \
    \ **逻辑运算符（Logical Operators）**:\n    *   `&&`（与）：`a && b`\n    *   `||`（或）：`a\
    \ || b`\n    *   `!`（非）：`!a`\n\n***\n\n## 控制结构\n\n控制结构用于控制程序的执行流。\n\n### If-Else\
    \ 语句\n\n根据条件允许条件执行。\n\n```cpp\nif (age >= 18) {\n    cout << \"You are an adult.\"\
    ;\n} else {\n    cout << \"You are a minor.\";\n}\n```\n\n### Switch 语句\n\n`switch`\
    \ 语句从多个块中选择一个。\n\n```cpp\nint day = 3;\nswitch (day) {\n    case 1:\n        cout\
    \ << \"Monday\";\n        break;\n    case 2:\n        cout << \"Tuesday\";\n\
    \        break;\n    default:\n        cout << \"Other day\";\n}\n```\n\n### 循环\n\
    \n循环允许重复执行。\n\n*   **For 循环（For Loop）**: 按指定的次数重复执行一个代码块。\n    ```cpp\n    for\
    \ (int i = 0; i < 5; i++) {\n        cout << i;\n    }\n    ```\n*   **While 循环（While\
    \ Loop）**: 当条件为真时重复执行代码块。\n    ```cpp\n    int i = 0;\n    while (i < 5) {\n \
    \       cout << i;\n        i++;\n    }\n    ```\n*   **Do-While 循环（Do-While Loop）**:\
    \ 类似于 while 循环，但保证执行一次。\n    ```cpp\n    int i = 0;\n    do {\n        cout <<\
    \ i;\n        i++;\n    } while (i < 5);\n    ```\n\n***\n\n## 函数\n\n函数允许你将代码组织成可重用的块。\n\
    \n### 声明与定义\n\nC++ 中的函数由返回值、名称、参数列表和函数体组成。\n\n```cpp\nint add(int a, int b) {\n\
    \    return a + b;\n}\n```\n\n*   `int`: 返回类型，表示函数返回整数\n*   `add`: 函数名。\n*   `(int\
    \ a, int b)`: 函数参数。\n*   `return`: 返回结果。\n\n### 调用函数\n\n你可以通过使用函数名并传递参数来调用函数。\n\
    \n```cpp\nint result = add(5, 10);\ncout << result;\n```\n\n***\n\n## 注释与代码文档\n\
    \n注释用于解释代码，使其更易理解。在 C++ 中，有两种类型的注释：\n\n*   **单行注释**: 使用 `//` 在单行上添加注释。\n*   **多行注释**:\
    \ 使用 `/* */` 添加跨越多行的注释。\n\n```cpp\n// 这是一个单行注释\n\n/*\n这是一个\n多行\n注释\n*/\n```\n\n"
- fmt: "\n- `Function`: A reusable block of code that performs a specific task and\
    \ can return a value.\n- `Operator`: A symbol used to perform operations on variables\
    \ and values.\n- `Loop`: A control structure that repeats a block of code while\
    \ a condition is true.\n\n# Chapter 4 C++ Output\n\n## What is Output in C++?\n\
    \nIn C++, output is how we display information, results, or messages to users.\
    \ The most common way to perform output is through the `cout` object, which stands\
    \ for \"console output.\" It’s a part of the `iostream` library, and it works\
    \ in combination with the `<<` operator to send data to the standard output stream,\
    \ usually the console window. Additionally, `endl` is a manipulator used to move\
    \ the cursor to the next line and flush the output buffer, making it essential\
    \ for formatting output neatly.\n\nOutput is an essential part of any program\
    \ since it helps to interact with users, display results, and debug issues. You\
    \ can output text, numbers, and even formatted data, making it a crucial element\
    \ in both simple and complex applications.\n\n## Understand Print Text C++\n\n\
    ### What is Print Text?\n\nPrinting text in C++ involves using the `cout` object\
    \ to display messages, numbers, and results on the screen. This is often the first\
    \ thing learned in C++ because it allows communication between the program and\
    \ the user. Text output is used to provide instructions, display the results of\
    \ calculations, or interactively display user input.\n\nUsing `cout`, you can\
    \ print any combination of text and variable data. This capability is crucial\
    \ for almost all types of programs, whether you're creating a calculator, a game,\
    \ or an accounting system.\n\n### Syntax\n\nThe syntax for printing text is straightforward.\
    \ You use the `cout` object followed by the `<<` operator and the text or variable\
    \ you want to display.\n\n```\ncout << \"Hello, World!\";\n```\n\nIn this example,\
    \ \"Hello, World!\" will be printed on the console. You can chain multiple outputs\
    \ with additional `<<` operators:\n\n```\ncout << \"The answer is: \" << 42;\n\
    ```\n\n### Syntax Explanation\n\n`cout` directs the output to the console. The\
    \ `<<` operator inserts the data (text or variable values) into the output stream.\
    \ By chaining multiple `<<` operators, you can print a mixture of text, variables,\
    \ and numbers in a single line. C++ processes each piece of information in order\
    \ from left to right, outputting everything in the console.\n\n### Code Example\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n  cout\
    \ << \"Welcome to C++!\" << endl;\n  int age = 25;\n  cout << \"Your age is: \"\
    \ << age << endl;\n  return 0;\n}\n```\n\n### Code Walkthrough\n\nIn this program,\
    \ we first include the `iostream` library, which contains the `cout` object. The\
    \ `main()` function then prints \"Welcome to C++!\" using the `cout` object. The\
    \ `endl` manipulator moves the cursor to the next line. Then, we declare an integer\
    \ variable `age` with a value of 25. The next `cout` statement outputs the text\
    \ \"Your age is: \" followed by the value of the `age` variable. Using `<<` multiple\
    \ times allows us to combine text and variables in a single output.\n\n### Notes\n\
    \nWhen printing text, ensure proper formatting for better readability. Use `endl`\
    \ or `\\n` to create new lines as needed, especially when printing multiple pieces\
    \ of information. Combining text with variables in a single `cout` statement can\
    \ save time and keep your code cleaner.\n\n## Understand New Lines in C++\n\n\
    ### What are New Lines?\n\nNew lines are used in C++ to control where the next\
    \ printed text appears on the console. Without new lines, everything prints on\
    \ the same line, making the output difficult to read. You can create new lines\
    \ using the `\\n` escape sequence or the `endl` manipulator.\n\nUsing new lines\
    \ allows you to organize your output, especially when working with tables, lists,\
    \ or multiline messages. For example, in a receipt or a report, you might want\
    \ each item or piece of information to appear on its own line to make the output\
    \ clear and easy to read.\n\n### Syntax\n\nTo insert a new line, you can use either\
    \ `\\n` or `endl`.\n\n```\ncout << \"Line one\\nLine two\";\ncout << \"Line three\"\
    \ << endl;\n```\n\nHere, the first statement uses `\\n` to print on a new line,\
    \ while the second uses `endl`. Both achieve the same result but in different\
    \ ways.\n\n### Syntax Explanation\n\n`\\n` is an escape character that signals\
    \ the start of a new line, whereas `endl` is a manipulator that moves to a new\
    \ line and flushes the output buffer. Use `\\n` when you want quick and simple\
    \ formatting, and use `endl` when you need to ensure all buffered output is flushed\
    \ immediately, especially when working with real-time output.\n\n### Code Example\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n  cout\
    \ << \"First Line\\nSecond Line\" << endl;\n  cout << \"Third Line\" << endl;\n\
    \  return 0;\n}\n```\n\n### Code Walkthrough\n\nIn this example, the first `cout`\
