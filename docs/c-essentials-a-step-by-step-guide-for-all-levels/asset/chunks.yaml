    Linear search works by iterating through the array or list one element at a time,
    comparing each element with the target value. It continues this process until
    the target is found or the end of the array is reached.


    Binary search, on the other hand, works on sorted arrays. It repeatedly divides
    the array in half, comparing the target value to the middle element. If the target
    is less than the middle element, the algorithm continues searching in the left
    half, otherwise in the right half. This "divide-and-conquer" approach makes binary
    search highly efficient with a time complexity of O(log n), compared to O(n) for
    linear search.


    Code Example


    #include <iostream>


    #include <algorithm>


    int binarySearch(int arr[], int n, int value) {


    int low = 0, high = n - 1;


    while (low <= high) {


    int mid = low + (high - low) / 2;


    if (arr[mid] == value) {


    return mid;


    } else if (arr[mid] < value) {


    low = mid + 1;


    } else {


    high = mid - 1;


    }


    }


    return -1;  // Not found


    }


    int main() {


    int arr[] = {10, 20, 30, 40, 50};


    int n = sizeof(arr)/sizeof(arr[0]);


    int result = binarySearch(arr, n, 30);


    std::cout << "Element found at index: " << result;


    return 0;


    }


    Code Walkthrough


    This program implements a binary search on a sorted array. The  binarySearch function
    uses two variables,  low and  high, to define the current search range. The middle
    element is compared with the target value. If they are equal, the target’s position
    is returned. If the target is smaller, the search continues in the left half;
    otherwise, it continues in the right half.


    The search continues until  low is greater than  high, meaning the target value
    is not in the array. This algorithm significantly reduces the number of comparisons
    needed.


    Notes


    *   Binary search is much faster than linear search but requires sorted data.


    *   For unsorted data, use linear search, although it may be less efficient.


    *   Avoid re-sorting data every time you need to search. Sort once, and then use
    binary search repeatedly for multiple lookups.


    * * *


    Project 1: Write a Program that Sorts an Array of Integers Using the Bubble Sort
    Algorithm


    Objective


    Create a program that sorts an array of integers using the bubble sort algorithm.
    This project reinforces understanding of sorting concepts and implementation.


    Instructions


    *   Declare an array of integers.


    *   Implement the bubble sort algorithm to sort the array.


    *   Print the sorted array.


    Code


    #include <iostream>


    void bubbleSort(int arr[], int n) {


    for (int i = 0; i < n-1; i++) {


    for (int j = 0; j < n-i-1; j++) {


    if (arr[j] > arr[j+1]) {


    std::swap(arr[j], arr[j+1]);


    }


    }


    }


    }


    int main() {


    int arr[] = {29, 10, 14, 37, 13};


    int n = sizeof(arr) / sizeof(arr[0]);


    bubbleSort(arr, n);


    for (int i = 0; i < n; i++) {


    std::cout << arr[i] << " ";


    }


    return 0;


    }


    Code Walkthrough


    The program implements the bubble sort algorithm to sort an array of integers.
    The array is printed in sorted order after the sorting process is completed.


    Challenge


    Modify the program to sort the array in descending order by adjusting the comparison
    logic.


    * * *


    Project 2: Create a Program that Implements a Binary Search Algorithm to Find
    an Element in a Sorted Array


    Objective


    Write a program that uses the binary search algorithm to find a specific element
    in a sorted array.


    Instructions


    *   Declare a sorted array of integers.


    *   Implement the binary search algorithm.


    *   Print the index of the element if found, or an appropriate message if not
    found.


    Code


    #include <iostream>


    int binarySearch(int arr[], int n, int value) {


    int low = 0, high = n - 1;


    while (low <= high) {


    int mid = low + (high - low) / 2;


    if (arr[mid] == value) {


    return mid;


    } else if (arr[mid] < value) {


    low = mid + 1;


    } else {


    high = mid - 1;


    }


    }


    return -1;  // Element not found


    }


    int main() {


    int arr[] = {3, 6, 8, 12, 14, 17, 25, 30};


    int n = sizeof(arr)/sizeof(arr[0]);


    int result = binarySearch(arr, n, 17);


    if (result != -1) {


    std::cout << "Element found at index: " << result;


    } else {


    std::cout << "Element not found.";


    }


    return 0;


    }


    Code Walkthrough


    The program implements a binary search to find the value  17 in the sorted array.
    If the value is found, the index is displayed. Otherwise, a message indicating
    the element was not found is printed.


    Challenge


    Enhance the program to allow user input for both the array and the target value.


    * * *


    End of Chapter Checklist


    *   Understand the difference between sorting and searching algorithms.


    *   Practice implementing and optimizing algorithms for sorting and searching.


    *   Learn how to choose between different algorithms based on efficiency and use
    case.


    *   Review the built-in STL functions like  std::sort and  std::binary_search.


    * * *


    Quiz


    1.  What is the time complexity of bubble sort?


    2.  What type of data structure is required for binary search to be effective?


    3.  What is the main difference between linear and binary search?


    * * *


    Glossary


    *   Sorting Algorithm: A process to arrange data in a specific order, like ascending
    or descending.'
