  raw: '*   Function: A reusable block of code that performs a specific task and can
    return a value.


    *   Operator: A symbol used to perform operations on variables and values.


    *   Loop: A control structure that repeats a block of code while a condition is
    true.


    Chapter 4 C++ Output


    * * *


    What is Output in C++? 


    In C++, output is how we display information, results, or messages to users. The
    most common way to perform output is through the  cout object, which stands for
    "console output." It’s a part of the iostream library, and it works in combination
    with the  << operator to send data to the standard output stream, usually the
    console window. Additionally,  endl is a manipulator used to move the cursor to
    the next line and flush the output buffer, making it essential for formatting
    output neatly.


    Output is an essential part of any program since it helps to interact with users,
    display results, and debug issues. You can output text, numbers, and even formatted
    data, making it a crucial element in both simple and complex applications.


    * * *


    Understand Print Text C++


    What is Print Text? 


    Printing text in C++ involves using the  cout object to display messages, numbers,
    and results on the screen. This is often the first thing learned in C++ because
    it allows communication between the program and the user. Text output is used
    to provide instructions, display the results of calculations, or interactively
    display user input.


    Using  cout, you can print any combination of text and variable data. This capability
    is crucial for almost all types of programs, whether you''re creating a calculator,
    a game, or an accounting system.


    Syntax


    The syntax for printing text is straightforward. You use the  cout object followed
    by the  << operator and the text or variable you want to display.


    cout << "Hello, World!";


    In this example, "Hello, World!" will be printed on the console. You can chain
    multiple outputs with additional  << operators:


    cout << "The answer is: " << 42;


    Syntax Explanation


    cout directs the output to the console. The  << operator inserts the data (text
    or variable values) into the output stream. By chaining multiple  << operators,
    you can print a mixture of text, variables, and numbers in a single line. C++
    processes each piece of information in order from left to right, outputting everything
    in the console.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    cout << "Welcome to C++!" << endl;


    int age = 25;


    cout << "Your age is: " << age << endl;


    return 0;


    }


    Code Walkthrough


    In this program, we first include the  iostream library, which contains the  cout
    object. The  main() function then prints "Welcome to C++!" using the  cout object.
    The  endl manipulator moves the cursor to the next line. Then, we declare an integer
    variable  age with a value of 25\. The next  cout statement outputs the text "Your
    age is: " followed by the value of the  age variable. Using  << multiple times
    allows us to combine text and variables in a single output.


    Notes


    When printing text, ensure proper formatting for better readability. Use  endl
    or  \n to create new lines as needed, especially when printing multiple pieces
    of information. Combining text with variables in a single  cout statement can
    save time and keep your code cleaner.


    * * *


    Understand New Lines in C++


    What are New Lines? 


    New lines are used in C++ to control where the next printed text appears on the
    console. Without new lines, everything prints on the same line, making the output
    difficult to read. You can create new lines using the  \n escape sequence or the  endl
    manipulator.


    Using new lines allows you to organize your output, especially when working with
    tables, lists, or multiline messages. For example, in a receipt or a report, you
    might want each item or piece of information to appear on its own line to make
    the output clear and easy to read.


    Syntax


    To insert a new line, you can use either  \n or  endl.


    cout << "Line one\nLine two";


    cout << "Line three" << endl;


    Here, the first statement uses  \n to print on a new line, while the second uses  endl.
    Both achieve the same result but in different ways.


    Syntax Explanation


    \n is an escape character that signals the start of a new line, whereas  endl
    is a manipulator that moves to a new line and flushes the output buffer. Use  \n
    when you want quick and simple formatting, and use  endl when you need to ensure
    all buffered output is flushed immediately, especially when working with real-time
    output.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    cout << "First Line\nSecond Line" << endl;


    cout << "Third Line" << endl;


    return 0;


    }


    Code Walkthrough


    In this example, the first  cout statement prints two lines of text. The  \n creates
    a new line after "First Line", so "Second Line" appears below it. The second  cout
    statement uses  endl to print "Third Line" and move to the next line, ensuring
    that any following text would be printed on a new line.


    This program demonstrates how to structure output neatly by inserting line breaks,
    ensuring that each message or piece of data appears on its own line.


    Notes


    Using  \n is generally faster when formatting output, but  endl is more versatile
    when you need to flush the output buffer. Depending on the situation, choose the
    option that best fits your needs. Overusing  endl can slow down your program if
    it flushes the buffer unnecessarily.


    * * *


    Projects


    Project 1: Multiplication Table Program


    Description: Create a program that prints a multiplication table for the numbers
    1 through 10.


    Objective: Help the reader practice formatting output using loops and  cout.


    Instructions: Use nested loops to print each row of the multiplication table.
    Ensure numbers are aligned for easy reading.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    for (int i = 1; i <= 10; i++) {


    for (int j = 1; j <= 10; j++) {


    cout << i * j << "\t";  // Print with tab space for alignment


    }


    cout << endl;  // Move to the next row


    }


    return 0;


    }


    Code Walkthrough:


    This program uses two  for loops. The outer loop controls the row (multiplication
    base), and the inner loop calculates and prints the product for each column. The  \t
    ensures each value is spaced evenly, and  endl moves to the next row after each
    line.


    Challenge:


    Modify the program to allow the user to input the maximum number (e.g., print
    up to 12 or 20 based on user input).


    * * *


    Project 2: Shopping List Receipt


    Description: Print a formatted receipt showing items, prices, and total cost.


    Objective: Practice output formatting with  cout and precision control for floating-point
    numbers.


    Instructions: Use arrays to store item names and prices. Print each item and its
    price on a new line, and show the total at the end.


    Code:


    #include <iostream>


    #include <iomanip>  // For formatting


    using namespace std;


    int main() {


    string items[] = {"Apples", "Bananas", "Oranges"};


    double prices[] = {1.99, 0.99, 2.49};


    double total = 0;


    cout << fixed << setprecision(2);  // Set output precision to 2 decimal places


    cout << "Item\t\tPrice\n";


    cout << "----------------------\n";


    for (int i = 0; i < 3; i++) {


    cout << items[i] << "\t\t$" << prices[i] << endl;


    total += prices[i];


    }


    cout << "----------------------\n";


    cout << "Total:\t\t$" << total << endl;


    return 0;


    }


    Code Walkthrough:


    This program prints the name and price of each item in the list. It uses  fixed
    and  setprecision(2) to ensure prices are shown with two decimal places. A  for
    loop iterates over the items and prices, printing each item and summing up the
    total cost.


    * * *


    End of Chapter Checklist


    *   Understand how to use  cout to print text.


    *   Learn the difference between  \n and  endl for formatting.


    *   Practice formatting output with  cout to improve readability.


    * * *


    Quiz


    1.  What is the main purpose of  cout in C++?


    2.  How do you create a new line using  cout?'
