    \ the `if` block and moves to the next part of the code (in this case, it ends\
    \ the program). This example demonstrates how `if` statements help control the\
    \ flow of the program based on user input.\n\n***\n\n### Else/Else If\n\n####\
    \ What is Else and Else If?\nIn C++, `else` and `else if` are used in conjunction\
