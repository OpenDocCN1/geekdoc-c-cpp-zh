  trans: "\n\n- **目标**：编写一个程序，使用 C++ 日期函数打印当前日期时间。\n- **指令**：使用 `ctime` 库获取当前系统时间并以可读的格式显示它。\n\
    \n代码：\n```cpp\n#include <iostream>\n#include <ctime>\n\nusing namespace std;\n\
    \nint main() {\n    time_t currentTime = time(0);\n    tm *localTime = localtime(&currentTime);\n\
    \    cout << \"Current Date and Time: \" << asctime(localTime);\n    return 0;\n\
    }\n```\n\n- **代码解析**：程序使用 `time(0)` 获取当前系统时间，使用 `localtime()` 将转换为本地时间，并使用 `asctime()`\
    \ 输出。\n- **挑战**：修改程序，使用 `strftime()` 将输出格式化为 \"YYYY-MM-DD HH:MM\"。\n\n项目 2：计算两个日期之间的差\n\
    \n- **目标**：创建一个程序，计算用户输入的两个日期之间的差。\n- **指令**：编写一个程序，提示用户输入两个日期并使用 `ctime` 或 `chrono`\
    \ 库计算它们之间的天数。\n代码：\n```cpp\n#include <iostream>\n#include <ctime>\n\nusing namespace\
    \ std;\n\nint main() {\n    tm date1 = {0}, date2 = {0};\n    double difference;\n\
    \    cout << \"Enter first date (YYYY MM DD): \";\n    cin >> date1.tm_year >>\
    \ date1.tm_mon >> date1.tm_mday;\n    cout << \"Enter second date (YYYY MM DD):\
    \ \";\n    cin >> date2.tm_year >> date2.tm_mon >> date2.tm_mday;\n\n    time_t\
    \ t1 = mktime(&date1);\n    time_t t2 = mktime(&date2);\n    difference = difftime(t2,\
    \ t1) / (60 * 60 * 24);\n\n    cout << \"Difference in days: \" << difference\
    \ << \" days\" << endl;\n    return 0;\n}\n```\n\n- **代码解析**：程序接收两个日期作为输入，使用 `mktime()`\
    \ 进行转换，并使用 `difftime()` 计算差值。\n- **挑战**：扩展程序以计算小时、分钟和秒的差值。\n\n本章总结\n\n- 理解如何使用\
    \ `ctime` 和 `chrono` 获取并操作日期与时间。\n- 学习如何使用 `strftime()` 函数格式化日期和时间。\n- 练习使用 `chrono`\
    \ 进行精确计算，包括测量执行时间。\n- 确保能够编写显示当前时间并计算两个日期差值的程序。\n\n测试\n\n1. 哪个库提供了 C++ 精的时间处理？\n\
    2. 如何使用 `strftime()` 函数格式化日期？\n3. `chrono::high_resolution_clock` 的用途是什么？\n\n\
    术语表\n\n- **ctime**：用于基本日期时间操作的 C++ 库，例如获取系统时间或转换为可读格式。\n- **chrono**：用于高分辨率测量和时间点计算现代\
    \ C++ 库。\n- **time_t**：`ctime` 中的一种数据类型，表示自 Unix 纪（1970 年 1 月 1 日）以来的秒。\n- **tm**：包含年、月、日、时、分、秒等的结构。\n\
    \n# 第 27 章 C++ 数据结构与 STL\n\n### 什么是 C++ 数据结构？\n\nC++ 中的数据结构是组织和存储数据以便高效访问和修改的方法。它们通过启用快速算法和优化内存使用，解决复杂问题起着至关重要的作用。常见的数据结构包括数组、链表、栈、队列、集合和映射。每个结构都有用途；例如，数组适用于索引访问，而链表在频繁插入删除的场景下表现出色。\n\
    \n理解数据结构很重要，因为它们会影响算法和应用程序的性能。C++ 标准模板库（STL）为许多数据结构提供了内置支持，简化了开发过程。\n\n***\n\n\
    ## Vector\n\n### 什么是 C++ Vector？\n\nC++ 中的 Vector 是根据需要调整大小的动态数组。与静态数组不同，Vector\
    \ 提供了处理未知数量数据的灵活性。它们标准模板库（STL）的一部分，并提供了许多高效管理数据的方法。\n\nVector 将元素存储在连续内存位置中，允许快速随机访问。它们非常适用于元素数量随时间变化的情况。Vector\
    \ 的自动调整大小功能使其与普通数组相比更具通用性。\n\n### 语法\n\n```cpp\n#include <vector>\nstd::vector<int>\
    \ myVector;\n```\n\n此示例显示了如何使用 `std::vector` 声明一个整数向量。你可以用值初始化它，或者使用 `push_back`\
    \ 方法动态推送新元素。\n\n### 语法解释\n\nVector 提供了多种方法，例如使用 `push_back()` 向末尾添加元素，使用 `size()`\
    \ 获取元素数量。其他方法如 `empty()` 检查 vector 是否为空，`clear()` 则移除所有元素。\n\n**关键方法：**\n- `push_back(element)`：在末尾添加元素。\n\
    - `size()`：返回当前大小。\n- `at(index)`：访问特定索引处的元素。\n\nVector 会动态调整大小，这可能涉及重新分配内存。然而，底层系统会高效地处理这一点。\n\
    \n### 代码示例\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n\
    \    std::vector<int> numbers;\n    numbers.push_back(10);\n    numbers.push_back(20);\n\
    \    numbers.push_back(30);\n    for (int num : numbers) {\n        std::cout\
    \ << num << std::endl;\n    }\n    return 0;\n}\n```\n\n### 代码解析\n\n该程序创建一个名为\
    \ `numbers` 的 vector，并使用 `push_back()` 添加三个整数。`for` 循环遍历 vector 打印每个数字。第一个是 `numbers[0]`，第二个是\
    \ `numbers[1]`，依此类推。\n\n### 注意\n- 使用 `reserve()` 方法预留内存以避免频繁调整大小。\n- 使用 `at()`\
    \ 代替 `[]` 进行元素访问，因为 `at()` 会执行边界检查。\n- Vector 适用于频繁随机访问，但在中间插入或删除效率较低。\n\n***\n\
    \n## List\n\n### 什么是 C++ List？\n\nC++ 中的 List 是 STL 提供的双向链表。与 Vector 不同，List 允许高效的插入和删除，但不存储在连续中。List\
    \ 适用于需要不断添加或删除数据的。\n\n### 语法\n\n```cpp\n#include <list>\nstd::list<int> myList;\n\
    ```\n\n此示例显示了如何使用 `std::list` 声明一个整数列表。你可以使用 `push_back()` 和 `pop_front()` 方法动态添加或移除元素。\n\
    \n### 语法解释\n\nList 的方法包括：\n- `push_back()`：在末尾添加元素。\n- `pop_front()`：移除第一个元素。\n\
    - `insert(position, element)`：在特定位置插入元素。\n- `size()`：返回列表中的元素数量。\n\n由于双向链的特性，List\
    \ 允许在两端高效插入和删除，这意味着每个元素都指向它的前一个和下一个。\n\n### 代码示例\n\n```cpp\n#include <iostream>\n\
    #include <list>\n\nint main() {\n    std::list<int> numbers;\n    numbers.push_back(10);\n\
    \    numbers.push_back(20);\n    numbers.push_front(5);\n    for (int num : numbers)\
    \ {\n        std::cout << num << std::endl;\n    }\n    return 0;\n}\n```\n\n\
    ### 代码解析\n\n该程序创建一个名为 `numbers` 的 list，并在列表头部和尾部添加元素。`for` 循环遍历列表打印每个元素。与 Vector\
    \ 不同，元素是链接的，因此无法进行 `numbers[1]` 这样的随机访问。\n\n### 注意\n- List 随机访问效率低下，因此仅在需要频繁插入删除时使用它们。\n\
    - 当顺序和访问时间很重要时，优先选择 Vector 而不是 List。\n\n***\n\n## Stacks\n\n什么是 C++ Stacks？\n\n"
- fmt: "\nA stack is a LIFO (Last-In-First-Out) data structure where the last element\
    \ added is the first one to be removed. In C++, stacks are part of the STL and\
    \ are implemented as an adapter over other containers like `vectors` or `deques`.\n\
    \nStacks are useful in algorithms requiring backtracking, such as depth-first\
    \ search, or for balancing parentheses in expressions.\n\n### Syntax\n\n```cpp\n\
    #include <stack>\n\nstd::stack<int> myStack;\n```\n\n### Syntax Explanation\n\n\
    Key operations for a stack include:\n\n* `push()`: Adds an element to the top\
    \ of the stack.\n* `pop()`: Removes the top element.\n* `top()`: Accesses the\
    \ top element without removing it.\n* `empty()`: Checks if the stack is empty.\n\
    \nStacks do not allow access to elements other than the one at the top, which\
    \ simplifies their use in certain algorithmic problems.\n\n### Code Example\n\n\
    ```cpp\n#include <iostream>\n#include <stack>\n\nint main() {\n  std::stack<int>\
    \ myStack;\n  myStack.push(10);\n  myStack.push(20);\n  myStack.pop();\n  std::cout\
    \ << myStack.top() << std::endl;\n  return 0;\n}\n```\n\n### Code Walkthrough\n\
    \nThis program creates a stack, pushes two integers onto it, pops one off, and\
    \ then prints the top element, which is 10. The stack follows the LIFO principle.\n\
    \n### Notes\n\n* Use stacks for algorithms involving backtracking or balancing\
    \ operations.\n* Always check if the stack is empty before accessing the top element\
    \ to avoid runtime errors.\n\n---\n\n# Queues\n\n### What are Queues in C++? \n\
    \nA queue is a FIFO (First-In-First-Out) data structure, where the first element\
    \ added is the first one to be removed. Queues are essential in scenarios where\
    \ order matters, such as handling tasks in a scheduling system or simulating real-world\
    \ queues like customer service lines.\n\nIn C++, queues are implemented in the\
    \ Standard Template Library (STL) using the `std::queue` container adapter, typically\
    \ backed by a `deque` or `list`. Queues support operations like inserting elements\
    \ at the back and removing them from the front.\n\n### Syntax\n\n```cpp\n#include\
    \ <queue>\n\nstd::queue<int> myQueue;\n```\n\nThis example shows how to declare\
    \ a queue of integers using `std::queue`. Elements can be added using `push()`\
    \ and removed using `pop()`.\n\n### Syntax Explanation\n\nKey operations for a\
    \ queue include:\n\n* `push(element)`: Adds an element to the back of the queue.\n\
    * `pop()`: Removes the front element from the queue.\n* `front()`: Accesses the\
    \ element at the front of the queue.\n* `back()`: Accesses the element at the\
    \ back.\n* `empty()`: Checks if the queue is empty.\n\nQueues are useful when\
    \ you need to process elements in the order they are added. Operations like `pop()`\
    \ ensure that elements are removed in the same order they were inserted.\n\n###\
    \ Code Example\n\n```cpp\n#include <iostream>\n#include <queue>\n\nint main()\
    \ {\n  std::queue<int> myQueue;\n  myQueue.push(10);\n  myQueue.push(20);\n  myQueue.push(30);\n\
    \  myQueue.pop();\n  std::cout << \"Front: \" << myQueue.front() << std::endl;\n\
    \  return 0;\n}\n```\n\n### Code Walkthrough\n\nThis program demonstrates a queue\
    \ where elements 10, 20, and 30 are added. The `pop()` function removes 10, the\
    \ first element, leaving 20 as the front element, which is printed to the console.\
    \ Queues follow the FIFO principle, making them ideal for tasks like buffering\
    \ data.\n\n### Notes\n\n* Use queues in situations where the order of processing\
    \ matters.\n* Ensure that the queue is not empty before calling `front()` or `pop()`\
    \ to avoid errors.\n* The queue is efficient for adding and removing elements\
    \ at the respective ends.\n\n***\n\n# Deque\n\n### What is Deque in C++? \n\n\
    A deque (double-ended queue) is a data structure that allows insertions and deletions\
    \ at both ends. It combines the features of both stacks and queues. Deques are\
    \ efficient for both adding elements to the front and back and removing them from\
    \ either end.\n\nIn C++, deques are implemented in the Standard Template Library\
    \ (STL) as `std::deque`. Deques are useful when you need flexibility in inserting\
    \ or removing elements from both sides, making them a versatile data structure.\n\
    \n### Syntax\n\n```cpp\n#include <deque>\n\nstd::deque<int> myDeque;\n```\n\n\
    This example shows how to declare a deque of integers using `std::deque`.\n\n\
    ### Syntax Explanation\n\nKey operations for a deque include:\n\n* `push_back(element)`:\
    \ Adds an element to the back.\n* `push_front(element)`: Adds an element to the\
    \ front.\n* `pop_back()`: Removes the back element.\n* `pop_front()`: Removes\
    \ the front element.\n* `front()`: Accesses the element at the front.\n* `back()`:\
    \ Accesses the element at the back.\n* `empty()`: Checks if the deque is empty.\n\
    \n### Code Example\n\n```cpp\n#include <iostream>\n#include <deque>\n\nint main()\
    \ {\n  std::deque<int> myDeque;\n  myDeque.push_back(10);\n  myDeque.push_back(20);\n\
    \  myDeque.push_back(30);\n  myDeque.pop_front();\n  std::cout << \"Front: \"\
    \ << myDeque.front() << std::endl;\n  return 0;\n}\n```\n\n### Code Walkthrough\n\
    \nThis program demonstrates a deque where elements 10, 20, and 30 are added. The\
    \ `pop_front()` function removes 10, the first element, leaving 20 as the front\
    \ element, which is printed to the console.\n\n### Notes\n\n* Use deques when\
    \ you need to add or remove elements from both ends.\n* Ensure the deque is not\
    \ empty before calling `front()` or `back()`.\n\n***\n\n# Sets\n\n### What are\
    \ Sets in C++? \n\nA set in C++ is a container that stores unique elements in\
    \ sorted order. Sets automatically eliminate duplicates, making them ideal for\
    \ managing collections where each element must be distinct.\n\nIn C++, `std::set`\
    \ is used to implement sets. It provides efficient lookup, insertion, and deletion\
    \ operations.\n\n### Syntax\n\n```cpp\n#include <set>\n\nstd::set<int> mySet;\n\
    ```\n\n### Syntax Explanation\n\nKey operations for a set include:\n\n* `insert(element)`:\
    \ Adds a unique element to the set.\n* `find(element)`: Searches for an element\
    \ in the set.\n* `erase(element)`: Removes an element from the set.\n* `size()`:\
    \ Returns the number of elements in the set.\n\n### Code Example\n\n```cpp\n#include\
    \ <iostream>\n#include <set>\n\nint main() {\n  std::set<int> mySet;\n  mySet.insert(10);\n\
    \  mySet.insert(20);\n  mySet.insert(10); // Duplicate, will not be added\n\n\
    \  for (int num : mySet) {\n    std::cout << num << std::endl;\n  }\n  return\
    \ 0;\n}\n```\n\n### Code Walkthrough\n\nIn this example, the set is used to store\
    \ integers. The `insert()` method ensures only unique elements are added. Even\
    \ though 10 is inserted twice, it only appears once. The set also sorts the elements\
    \ in ascending order.\n\n### Notes\n\n* Sets are efficient for maintaining collections\
    \ of unique elements.\n* Always use `find()` to check if an element exists before\
