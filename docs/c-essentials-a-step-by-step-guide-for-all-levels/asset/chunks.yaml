  trans: "\n\n栈（Stack）是一种 LIFO（后进先出）数据结构，最后添加的元素是第一个被移除的元素。在 C++ 中，栈是 STL 的一部分，并实现为针对\
    \ `vectors` 或 `deques` 等其他容器的适配器。\n\n栈在需要回溯的算法中非常有用，例如深度优先搜索，或者用于处理表达式中的括号平衡问题。\n\
    \n### 语法\n\n```cpp\n#include <stack>\n\nstd::stack<int> myStack;\n```\n\n### 语法说明\n\
    \n栈的关键操作包括：\n\n* `push()`：向栈顶顶部添加一个元素。\n* `pop()`：移除栈顶的元素。\n* `top()`：访问栈顶的元素，但不将其移除。\n\
    * `empty()`：检查栈是否为空。\n\n栈不允许访问栈顶元素以外的任何元素，这简化了它们在某些算法问题中的用法。\n\n### 代码示例\n\n```cpp\n\
    #include <iostream>\n#include <stack>\n\nint main() {\n  std::stack<int> myStack;\n\
    \  myStack.push(10);\n  myStack.push(20);\n  myStack.pop();\n  std::cout << myStack.top()\
    \ << std::endl;\n  return 0;\n}\n```\n\n### 代码流程解析\n\n此程序创建一个栈，向其推入两个整数，弹出一个，然后打印栈顶元素，结果为\
    \ 10。栈遵循 LIFO 原则。\n\n### 注意事项\n\n* 在涉及回溯或平衡操作的算法中使用栈。\n* 在访问栈顶元素之前，始终检查栈是否为空，以避免运行时错误。\n\
    \n---\n\n# 队列 (Queues)\n\n### C++ 中的队列是什么？ \n\n队列是一种 FIFO（先入先出）数据结构，第一个添加的元素是第一个被移除的元素。在顺序重要的场景中，队列至关重要，例如在调度系统中处理任务，或模拟现实世界的队列（如客户服务队）。\n\
    \n在 C++ 中，队列使用标准模板库（STL）中的 `std::queue` 容器适配器实现，通常由 `deque` 或 `list` 后支持。队列支持在末尾插入元素和从队移除元素的操作。\n\
    \n### 语法\n\n```cpp\n#include <queue>\n\nstd::queue<int> myQueue;\n```\n\n此示例展示了如何使用\
    \ `std::queue` 声明一个整数队列。可以使用 `push()` 添加元素，使用 `pop()` 移除元素。\n\n### 语法说明\n\n队列的关键操作包括：\n\
    \n* `push(element)`：在队列末尾添加一个元素。\n* `pop()`：从队列头部移除元素。\n* `front()`：访问队列头部的元素。\n\
    * `back()`：访问末尾的元素。\n* `empty()`：检查队列是否为空。\n\n当你需要按照元素添加的顺序处理元素时，队列非常有用。`pop()`\
    \ 等操作确保元素按照它们插入的顺序被移除。\n\n### 代码示例\n\n```cpp\n#include <iostream>\n#include <queue>\n\
    \nint main() {\n  std::queue<int> myQueue;\n  myQueue.push(10);\n  myQueue.push(20);\n\
    \  myQueue.push(30);\n  myQueue.pop();\n  std::cout << \"Front: \" << myQueue.front()\
    \ << std::endl;\n  return 0;\n}\n```\n\n### 代码流程解析\n\n此程序演示了一个队列，其中添加了元素 10、20\
    \ 和 30。`pop()` 函数移除了第一个元素 10，留下 20 作为头部元素，并打印到控制台。队列遵循 FIFO 原则，使其非常适合数据数据缓冲等任务。\n\
    \n### 注意事项\n\n* 在处理顺序很重要的情况下使用队列。\n* 在调用 `front()` 或 `pop()` 之前，确保队列不为空以避免错误。\n\
    * 队列在两端添加和移除元素非常高效。\n\n***\n\n# 双端队列 (Deque)\n\n### C++ 中的 Deque 是什么？ \n\ndeque（双端队列）是一种允许在两端进行插入和删除的数据结构。它结合了栈和队列的特征。deque\
    \ 在从前端和尾部添加元素以及从任一端移除元素方面都是高效的。\n\n在 C++ 中，deque 在标准模板库（STL）中作为 `std::deque` 实现。当你需要灵活地从两侧插入或移除元素时，deque\
    \ 非常有用，使其成为一种多功能数据结构。\n\n### 语法\n\n```cpp\n#include <deque>\n\nstd::deque<int>\
    \ myDeque;\n```\n\n此示例展示了如何使用 `std::deque` 声明一个整数 deque。\n\n### 语法说明\n\ndeque\
    \ 的关键操作包括：\n\n* `push_back(element)`：在尾部添加一个元素。\n* `push_front(element)`：在前端添加一个元素。\n\
    * `pop_back()`：移除尾部元素。\n* `pop_front()`：移除前端元素。\n* `front()`：访问前端的元素。\n* `back()`：访问尾部的元素。\n\
    * `empty()`：检查 deque 是否为空。\n\n### 代码示例\n\n```cpp\n#include <iostream>\n#include\
    \ <deque>\n\nint main() {\n  std::deque<int> myDeque;\n  myDeque.push_back(10);\n\
    \  myDeque.push_back(20);\n  myDeque.push_back(30);\n  myDeque.pop_front();\n\
    \  std::cout << \"Front: \" << myDeque.front() << std::endl;\n  return 0;\n}\n\
    ```\n\n### 代码流程解析\n\n此程序演示了一个队列，其中添加了元素 10、20 和 30。`pop_front()` 函数移除了第一个元素 10，留下\
    \ 20 作为头部元素，并打印到控制台（注：此处原文代码逻辑与描述略有偏差，已按逻辑翻译）。\n\n### 注意事项\n\n* 在需要在两端添加或移除元素时使用\
    \ deque。\n* 在调用 `front()` 之前确保 deque 不为空。\n\n***\n\n# 集合 (Sets)\n\n### C++ 中的集合是什么？\
    \ \n\nC++ 中的集合是一种种按顺序存储唯一元素的容器。集合会自动去重，使其非常适合管理每个元素都必须唯一的集合。\n\n在 C++ 中，使用 `std::set`\
    \ 实现集合。它提供了高效的查找、插入和删除操作。\n\n### 语法\n\n```cpp\n#include <set>\n\nstd::set<int>\
    \ mySet;\n```\n\n### 语法说明\n\n集合的关键操作包括：\n\n* `insert(element)`：向集合添加一个唯一元素。\n\
    * `find(element)`：在集合中查找元素。\n* `erase(element)`：从集合中移除元素。\n* `size()`：返回集合中元素的数量。\n\
    \n### 代码示例\n\n```cpp\n#include <iostream>\n#include <set>\n\nint main() {\n  std::set<int>\
    \ mySet;\n  mySet.insert(10);\n  mySet.insert(20);\n  mySet.insert(10); // 重复，不会被添加\n\
    \n  for (int num : mySet) {\n    std::cout << num << std::endl;\n  }\n  return\
    \ 0;\n}\n```\n\n### 代码流程解析\n\n在此示例中，集合用于存储整数。`insert()` 方法确保只添加唯一元素。即使插入了两次 10，它也只出现一次。集合还会按升序排列元素。\n\
    \n### 注意事项\n\n* 集合对于维护唯一元素集合非常高效。\n* 在执行操作之前，始终使用 `find()` 检查元素是否存在。\n\n***\n\n\
    # 映射 (Maps)\n\n### C++ 中的映射是什么？ \n\nC++ 中的映射是一种以键值对形式存储元素的数据结构。每个键都是唯一的，映射将每个键与值关联。当你需要将特定数据（值）与唯一标识符（键）关联时，映射非常有用。\n\
    \n在 C++ 中，使用 `std::map` 实现映射。它提供了基于键的高效查找、插入和删除操作。\n\n"
- fmt: "\n```cpp\n#include <map>\n\nstd::map<std::string, int> myMap;\n```\n\nThis\
    \ example shows how to declare a map where the key is a string (e.g., `name`)\
    \ and the value is an integer (e.g., `age`).\n\n## Syntax Explanation\n\nKey operations\
    \ for a map include:\n\n* `insert(key, value)`: Adds a key-value pair to the map.\n\
    * `find(key)`: Searches for a key in the map.\n* `erase(key)`: Removes a key-value\
    \ pair from the map.\n* `at(key)`: Retrieves the value associated with the given\
    \ key.\n\nMaps automatically keep the keys sorted and provide efficient operations\
    \ to find, insert, and remove key-value pairs. They are perfect for use cases\
    \ such as dictionaries or phonebooks.\n\n## Code Example\n\n```cpp\n#include <iostream>\n\
    #include <map>\n\nint main() {\n  std::map<std::string, int> ageMap;\n\n  ageMap[\"\
    Alice\"] = 25;\n  ageMap[\"Bob\"] = 30;\n\n  for (auto const& pair : ageMap) {\n\
    \    std::cout << pair.first << \": \" << pair.second << std::endl;\n  }\n\n \
    \ return 0;\n}\n```\n\n## Code Walkthrough\n\nIn this example, a map is used to\
    \ store names and corresponding ages. The map automatically keeps the names sorted.\
    \ The loop iterates over the map and prints each name along with its associated\
    \ age.\n\n## Notes\n\n* Use maps when you need to associate values with unique\
    \ keys.\n* Maps automatically keep the keys in sorted order.\n* Prefer `unordered_map`\
    \ for faster access when the order of keys doesn’t matter.\n\n* * *\n\n## Iterators\n\
    \n### What are Iterators in C++? \n\nIterators in C++ are objects that allow you\
    \ to traverse elements in data structures like `vectors`, `lists`, `sets`, and\
    \ `maps`. They provide a uniform way to access elements, regardless of the underlying\
    \ container.\n\nIterators are used to loop through collections without exposing\
    \ their internal representation. They are useful for performing operations on\
    \ containers like modifying elements or iterating through a range of elements.\n\
    \n## Syntax\n\n```cpp\n#include <vector>\n\nstd::vector<int>::iterator it;\n```\n\
    \nThis example shows how to declare an iterator for a vector of integers. You\
    \ can initialize the iterator to point to the start or end of the vector.\n\n\
    ## Syntax Explanation\n\nCommon iterator methods:\n\n* `begin()`: Points to the\
    \ first element.\n* `end()`: Points just past the last element.\n* `++it`: Moves\
    \ the iterator to the next element.\n* `*it`: Accesses the element at the iterator’s\
    \ position.\n\nIterators provide a consistent way to traverse containers, whether\
    \ you're using `vectors`, `sets`, or `maps`. They also allow read and write access\
    \ to the elements.\n\n## Code Example\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n\nint main() {\n  std::vector<int> numbers = {1, 2, 3, 4};\n\n  for\
    \ (std::vector<int>::iterator it = numbers.begin(); it != numbers.end(); ++it)\
    \ {\n    std::cout << *it << std::endl;\n  }\n\n  return 0;\n}\n```\n\n## Code\
    \ Walkthrough\n\nThis program uses an iterator to traverse a vector of integers.\
    \ The iterator `it` starts at the beginning of the vector and moves to the end\
    \ using `++it`. Each element is accessed using `*it`, and the elements are printed.\n\
    \n## Notes\n\n* Iterators provide a flexible way to traverse different containers.\n\
    * Always use `end()` as the termination point for iterators to avoid accessing\
    \ elements out of bounds.\n* Iterators are powerful when you need to access or\
    \ modify container elements in a loop.\n\n* * *\n\n## Project 1: Write a Program\
    \ Using Vectors to Store and Print Student Marks\n\n### Objective\n\nCreate a\
    \ program that uses a vector to store student marks and prints them. This project\
    \ helps you practice using vectors and loops.\n\n### Instructions\n\n* Create\
