  trans: "\n\n排序算法通过比较元素并根据所选顺序（升序或降序）重新排列它们来工作。例如，在冒泡排序中，比较相邻的元素，如果它们的顺序错误，则进行交换。这个过程不断重复，直到数组排序完成。\n\
    \n相比之下，快速排序选择一个基值元素，将数组分为两个子数组，并递归地对每个子数组进行排序。快速排序速度更快，但由于其递归性质，需要更仔细的实现。\n\n\
    理解排序算法的内部原理对于优化性能非常重要，特别是在处理效率关键的大型数据集时。\n\n## Code Example\n\n```cpp\n#include\
    \ <iostream>\n\nvoid bubbleSort(int arr[], int n) {\n    for (int i = 0; i < n-1;\
    \ i++) {\n        for (int j = 0; j < n-i-1; j++) {\n            if (arr[j] >\
    \ arr[j+1]) {\n                std::swap(arr[j], arr[j+1]);\n            }\n \
    \       }\n    }\n}\n\nint main() {\n    int arr[] = {64, 34, 25, 12, 22};\n \
    \   int n = sizeof(arr)/sizeof(arr[0]);\n    bubbleSort(arr, n);\n    for (int\
    \ i = 0; i < n; i++) {\n        std::cout << arr[i] << \" \";\n    }\n    return\
    \ 0;\n}\n```\n\n## Code Walkthrough\n\n此程序演示了冒泡排序算法。`bubbleSort` 函数比较相邻元素，如果它们的顺序错误，则进行交换。这个过程不断重复，在每次迭代中，最大的元素都会“泡”到数组的末尾。经过多次迭代后，数组被完全排序。\n\
    \n该函数使用了两个嵌套循环：外层循环跟踪通过的次数，内层循环比较相邻元素并在必要时执行交换。排序完成后，数组将打印到控制台。\n\n## Notes\n\n\
    - 对于小型数组，冒泡排序简单且易于实现，但对于大型数据集来说效率很低。\n- 除非是为了学习，否则请使用内置的 `std::sort` 进行优化排序，而不是自定义实现。\n\
    - 排序通常是优化其他算法（如搜索）的第一步。\n\n***\n\n## Searching Algorithms\n\n### 什么是 C++ 中的搜索？\n\
    \nC++ 中的搜索算法用于在数组或列表等数据结构中查找特定元素的位置。搜索算法主要有两种类型：线性搜索和二分查找。线性搜索简单但效率低下，因为它逐个检查每个元素。二分查找要快得多，但它要求数据预先经过排序。\n\
    \n线性搜索适用于小型、未排序的数据集，而二分查找是大型已排序数据集的最优选择。搜索算法在数据库等领域至关重要，快速数据检索是关键。\n\n### Syntax\n\
    \n```cpp\n#include <algorithm>\n\nbool result = std::binary_search(array, array\
    \ + size, value);\n```\n\n此语法使用 STL 的 `std::binary_search` 函数在排序后的数组中查找值。如果找到该值，它返回\
    \ `true`；否则返回 `false`。\n\n### Syntax Explanation\n\n线性搜索通过逐个遍历数组或列表来工作，将每个元素与目标值进行比较。该过程会持续进行，直到找到目标或到达数组末尾。\n\
    \n另一方面，二分查找作用于排序后的数组。它重复地将数组一分为二，将目标值与中间元素进行比较。如果目标小于中间元素，算法继续在左半部分搜索，否则在右半部分搜索。这种“分治”方法使得二分查找具有极高的效率，时间复杂度为\
    \ `O(log n)`，而线性搜索则为 `O(n)`。\n\n### Code Example\n\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n\nint binarySearch(int arr[], int n, int value) {\n    int\
    \ low = 0, high = n - 1;\n    while (low <= high) {\n        int mid = low + (high\
    \ - low) / 2;\n        if (arr[mid] == value) {\n            return mid;\n   \
    \     } else if (arr[mid] < value) {\n            low = mid + 1;\n        } else\
    \ {\n            high = mid - 1;\n        }\n    }\n    return -1;  // 未找到\n}\n\
    \nint main() {\n    int arr[] = {10, 20, 30, 40, 50};\n    int n = sizeof(arr)/sizeof(arr[0]);\n\
    \    int result = binarySearch(arr, n, 30);\n    std::cout << \"Element found\
    \ at index: \" << result;\n    return 0;\n}\n```\n\n### Code Walkthrough\n\n此程序在排序后的数组上实现了二分查找。`binarySearch`\
    \ 函数使用两个变量 `low` 和 `high` 来定义当前的搜索范围。中间元素与目标值进行比较。如果它们相等，则返回目标的位置。如果目标较小，则在左半部分继续搜索；否则在右半部分继续。\n\
    \n直到 `low` 大于 `high`，这意味着目标值不在数组中。该算法显著减少了所需的比较次数。\n\n## Notes\n\n- 二分查找比线性搜索快得多，但它需要排序的数据。\n\
    - 对于未排序的数据，请使用线性搜索，尽管其效率较低。\n- 避免每次需要搜索时都重新排序。排序一次，然后多次使用二分查找进行查找。\n\n***\n\n\
    ## Project 1: 编写一个使用冒泡排序算法对整数数组排序的程序\n\n### Objective\n\n创建一个使用冒泡排序算法对整数数组进行排序的程序。\n\
    \n### Instructions\n\n- 声明一个整数数组。\n- 实现冒泡排序算法。\n- 打印数组。\n\n### Code\n\n```cpp\n\
    #include <iostream>\n\nvoid bubbleSort(int arr[], int n) {\n    for (int i = 0;\
    \ i < n-1; i++) {\n        for (int j = 0; j < n-i-1; j++) {\n            if (arr[j]\
    \ > arr[j+1]) {\n                std::swap(arr[j], arr[j+1]);\n            }\n\
    \        }\n    }\n}\n\nint main() {\n    int arr[] = {29, 10, 14, 37, 13};\n\
    \    int n = sizeof(arr)/sizeof(arr[0]);\n    bubbleSort(arr, n);\n    for (int\
    \ i = 0; i < n; i++) {\n        std::cout << arr[i] << \" \";\n    }\n    return\
    \ 0;\n}\n```\n\n### Code Walkthrough\n\n该程序实现了冒泡排序算法对数组进行排序。数组按排序顺序打印。\n\n###\
    \ Challenge\n\n修改程序通过调整比较逻辑以按降序排序数组。\n\n***\n\n## Project 2: 创建一个实现二分查找查找元素的程序\n\
    \n### Objective\n\n编写一个使用二分查找算法在排序后的数组中查找元素的程序。\n\n### Instructions\n\n- 声明一个排序后的数组。\n\
    - 实现二分查找算法。\n- 如果找到元素，打印元素的索引；如果未找到，则打印适当的消息。\n\n### Code\n\n```cpp\n#include\
    \ <iostream>\n\nint binarySearch(int arr[], int n, int value) {\n    int low =\
    \ 0, high = n - 1;\n    while (low <= high) {\n        int mid = low + (high -\
    \ low) / 2;\n        if (arr[mid] == value) {\n            return mid;\n     \
    \   } else if (arr[mid] < value) {\n            low = mid + 1;\n        } else\
    \ {\n            high = mid - 1;\n        }\n    }\n    return -1;  // 未找到\n}\n\
    \nint main() {\n    int arr[] = {10, 20, 30, 40, 50};\n    int n = sizeof(arr)/sizeof(arr[0]);\n\
    \    int result = binarySearch(arr, n, 30);\n    std::cout << \"Element found\
    \ at index: \" << result;\n    return 0;\n}\n```\n\n### Code Walkthrough\n\n此程序在排序后的数组上实现了对\
    \ `17` 的二分查找。如果找到了该值，则显示索引。否则，则打印一条未找到元素的消息。\n\n### Challenge\n\n增强程序，以允许用户输入数组和目标值。\n\
    \n***\n\n## 章节结束检查清单\n\n- 理解排序算法和搜索算法之间的区别。\n- 练习实现和优化排序及搜索算法。\n- 学习根据效率和用例选择不同的算法。\n\
    - 复习内置的 STL 函数，如 `std::sort` 和 `std::binary_search`。\n\n## Quiz\n\n1. 冒泡排序的时间复杂度是多少？\n\
    2. 二分查找有效生效需要什么类型的数据？\n3. 线性搜索和二分查找的主要区别是什么？\n\n## Glossary\n\n- **排序算法 (Sorting\
    \ Algorithm)**：按照特定顺序（如升序或降序）排列数据的过程。\n\n"
