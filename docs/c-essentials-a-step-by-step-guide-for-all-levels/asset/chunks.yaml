    * **Char**: A data type that holds a single character.\n* **Float**: A data type\
    \ that holds floating-point numbers with decimals.\n\n# Chapter 9 C++ Operators\n\
    \n## What are Operators in C++?\nOperators in C++ are symbols used to perform\
