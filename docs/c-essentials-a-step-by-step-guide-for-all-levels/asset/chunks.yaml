    ## 2. 函数中 `return` 语句的目的是什么？


    ## 3. 如何在 C++ 中调用函数？


    ## 术语表


    - **函数 (Function)**: 执行特定任务的代码块。

    - **参数 (Parameters)**: 传递给函数作为输入的的变量。

    - **按值传递 (Pass by Value)**: 将变量的副本传递给函数的方法。

    - **按引用传递 (Pass by Reference)**: 函数接收原始变量引用的方法。


    ## 第 21 章. C++ 函数重载


    ### 什么是函数重载？


    C++ 中的函数重载是一项特性，允许多个函数具有相同的名称但具有不同的参数类型或数量。这允许你根据传递的参数类型或数量对同一个函数名执行不同的操作，有助于提高代码的可读性和组织性。


    例如，你可以有一个 `print()` 函数，它可以同时打印整数和字符串，但会根据数据类型使用不同的实现。编译器根据参数的数量和类型来区分这些函数。


    当你需要在不同的数据类型上执行相似的任务，或使用不同数量的参数时，函数重载特别有用。你不需要创建像 `addInt()` 和 `addFloat()` 这样独立的函数，只需简单为整数和浮点数重载
    `add()` 函数即可。重载在保持处理不同输入类型灵活性的同时，使代码更整洁、更直观。


    重载函数必须在参数列表上有所不同（参数的数量或其数据类型不同），但它们必须共享相同的函数名称。然而，不能仅凭返回类型来区分重载函数。


    ### 语法


    在 C++ 中定义重载函数的语法如下：


    ```cpp

    return_type function_name(parameter_list1) {

    // 函数体

    }


    return_type function_name(parameter_list2) {

    // 函数体

    }

    ```


    例如，这里有一个用于相加整数和浮点数的重载函数：


    ```cpp

    int add(int a, int b) {

    return a + b;

    }


    float add(float a, float b) {

    return a + b;

    }

    ```


    这两个函数具有相同的名称 `add()`，但它们接受的参数类型不同。


    ### 语法解释


    1. **相同的函数名**: 函数重载允许对不同的实现重用相同的函数名。函数的每个重载版本都有一个唯一的参数列表，因此编译器可以区分它们。

    2. **参数列表**: 重载函数必须具有不同的参数列表。这意味着它们在参数的数量或参数的数据类型上有所不同。例如，一个接受两个整数的函数可以被另一个接受两个浮点数的函数所重载。

    3. **返回类型**: 虽然重载函数之间的返回类型可以不同，但返回类型不足以让编译器区分它们。差异必须存在于参数中。

    4. **函数调用解析**: 当调用函数时，编译器根据函数调用期间传递的参数类型和数量来决定使用重载函数的哪个版本。


    ### 代码示例


    这里是一个使用函数重载的 C++ 程序示例：


    ```cpp

    #include <iostream>


    using namespace std;


    int add(int a, int b) {

    return a + b;

    }


    float add(float a, float b) {

    return a + b;

    }


    int main() {

    int sum1 = add(3, 4);      // 调用 int 版本

    float sum2 = add(2.5f, 3.5f); // 调用 float 版本

    cout << "Sum of integers: " << sum1 << endl;

    cout << "Sum of floats: " << sum2 << endl;

    return 0;

    }

    ```


    ### 代码流程解析


    1. **重载函数**: 程序定义了两个重载函数 `add()`。第一个版本接受两个 `int` 参数，第二个版本接受两个 `float` 参数。

    2. **函数调用**: 在 `main()` 函数中，编译器根据传递的参数类型调用 `add()` 的相应版本。对于整数参数 `3` 和 `4`，调用了
    `int` 版本；对于浮点数参数 `2.5f` 和 `3.5f`，调用了 `float` 版本。

    3. **输出**: 程序根据函数调用打印两个不同的和：整数和 (7) 和浮点数和 (6.0)。


    此示例显示了编译器如何根据提供的参数类型自动选择正确的重载函数。


    ### 注意事项


    使用函数重载时，请考虑以下最佳实践：


    - 确保重载函数执行的是逻辑上相关的操作，因为如果将无关的任务归在同一个函数名下，可能会让读者困惑。

    - 根据参数的有意义的差异（如数据类型或参数数量）来重载函数，而不是依赖模糊的区分。

    - 如果重载函数会让代码更难理解，请避免重载。在某些情况下，使用不同的函数名可以让代码更清晰。

    - 在使用隐式类型转换进行重载时要小心，因为编译器可能会选择一个无预期的函数版本。


    ### 项目 1：重载函数求整数和浮点数的和


    - **目标**: 编写一个程序，重载函数以找到两个整数和两个浮点数的和。

    - **指令**: 创建两个名为 `sum()` 的函数版本。其中一个接受两个整数作为输入，另一个接受两个浮点数。每个函数都应该返回其参数的和。


    **代码**:


    ```cpp

    #include <iostream>


    using namespace std;


    int sum(int a, int b) {

    return a + b;

    }


    float sum(float a, float b) {

    return a + b;

    }


    int main() {

    int result1 = sum(5, 10);      // 调用 int 版本

    float result2 = sum(2.5f, 3.5f); // 调用 float 版本

    cout << "Sum of integers: " << result1 << endl;

    cout << "Sum of floats: " << result2 << endl;

    return 0;

    }

    ```


    - **代码流程解析**: 程序定义了两个重载函数 `sum()`，一个用于整数，一个用于浮点数。在 `main()` 中，根据参数类型调用相应的 `sum()`
    版本。

    - **挑战**: 修改程序以处理三个参数，并再次重载函数求三个数的和。


    ### 项目 2：重载函数计算圆面积和矩形面积


    - **目标**: 创建一个程序，重载函数以计算圆（使用半径）和矩形（使用长度和宽度）的面积。

    - **指令**: 创建两个名为 `area()` 的函数版本。一个版本接受单个参数（半径）并计算圆面积。另一个版本接受两个参数（长度和宽度）并计算矩形面积。


    **代码**:


    ```cpp

    #include <iostream>


    using namespace std;


    const float PI = 3.14159;


    // 计算圆面积的重载函数

    float area(float radius) {

    return PI * radius * radius;

    }


    // 计算矩形面积的重载函数

    float area(float length, float width) {

    return length * width;

    }


    int main() {

    float circleArea = area(5.0f);      // 调用圆版本

    float rectangleArea = area(4.0f, 6.0f); // 调用矩形版本

    cout << "Area of the circle: " << circleArea << endl;

    cout << "Area of the rectangle: " << rectangleArea << endl;

    return 0;

    }

    ```


    - **代码流程解析**: 程序定义了两个重载的 `area()` 函数：一个使用半径计算圆面积，另一个使用长度和宽度计算矩形面积。程序随后在 `main()`
    中根据传递参数的数量调用每个函数。

    - **挑战**: 扩展程序以包含一个计算三角形面积（使用底边和高）的重载函数。


    ### 本章结束检查清单


    - 了解什么是函数重载以及它如何提高代码组织性。

    - 练习编写处理不同类型或数量参数的重载函数。

    - 学习编译器如何根据参数类型或参数数量来区分重载函数。


