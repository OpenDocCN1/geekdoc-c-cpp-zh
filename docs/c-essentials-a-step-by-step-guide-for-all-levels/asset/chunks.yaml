  raw: '3.  What is the difference between  \n and  endl?


    * * *


    Glossary


    *   cout: Standard output stream used to print text and variables to the console.


    *   endl: Manipulator that adds a new line and flushes the output buffer.


    *   \n: Escape sequence for creating a new line in a string.


    *   Output: The process of displaying information from the program to the console.


    Chapter 5 C++ Comments 


    * * *


    What are Comments in C++?


    Comments in C++ are lines of text in your code that are ignored by the compiler.
    They allow developers to explain their code, leave notes for future reference,
    or temporarily disable parts of the code without deleting it. Comments improve
    the readability of the code, especially in large projects where multiple programmers
    may be involved. By adding comments, you can make your code more understandable
    to yourself and others, explaining the purpose of each part of the program.


    Comments are also helpful when debugging, as you can comment out specific sections
    to see how your program behaves without them. Although they do not affect how
    the program runs, they serve as an essential tool in maintaining and organizing
    code effectively.


    * * *


    Single-line Comments


    What is a Single-line Comment?


    A single-line comment is a brief remark or explanation written on one line. It’s
    commonly used to explain a specific line of code or leave quick notes. Single-line
    comments begin with  // and everything after it on that line is ignored by the
    compiler. These are useful for short explanations or reminders, especially when
    the comment refers to a single operation or variable.


    Syntax


    The syntax for writing a single-line comment is straightforward. You begin the
    comment with two forward slashes (//), followed by your text. Anything after  //
    on that line will not be executed by the compiler.


    // This is a single-line comment


    cout << "Hello, World!";  // Output message


    Syntax Explanation


    When the compiler encounters  //, it knows to ignore everything that comes after
    it on the same line. This makes it ideal for leaving short notes or describing
    what a line of code does. For instance, if you want to indicate that a particular
    line outputs a message, you can use a single-line comment to explain it without
    affecting the program''s execution.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    // Declare a variable


    int age = 25;


    // Print the age


    cout << "Your age is: " << age << endl;  // This outputs the age


    return 0;


    }


    Code Walkthrough


    In this example, we use comments to describe what each part of the code does.
    The first comment explains that a variable is being declared, while the second
    comment explains that the program prints the value of the variable. By using single-line
    comments, each section of the code is easier to understand at a glance.


    Notes


    Use single-line comments sparingly and only when necessary to explain the function
    of the code. Avoid over-commenting or restating the obvious, as it can clutter
    your code. Make sure that comments are clear and concise, adding value rather
    than redundancy.


    * * *


    Multi-line Comments


    What is a Multi-line Comment?


    A multi-line comment, also known as a block comment, is used when you need to
    write longer explanations or disable larger sections of code. These comments span
    across multiple lines and are useful for describing complex logic, explaining
    entire blocks of code, or providing detailed documentation within the program.


    Syntax


    Multi-line comments begin with  /* and end with  */. Everything between these
    symbols is treated as a comment, regardless of how many lines it spans.


    /* This is a multi-line comment.


    It can span multiple lines


    and is useful for explaining complex code. */


    Syntax Explanation


    The compiler ignores everything between  /* and  */. You can use this syntax to
    add longer descriptions or temporarily disable multiple lines of code. Multi-line
    comments are often used to provide more detailed explanations, especially when
    a simple one-line comment is not enough.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    /* This program declares a variable


    and prints the value of the variable */


    int age = 25;  // Declare variable


    cout << "Your age is: " << age << endl;  // Output the value


    return 0;


    }


    Code Walkthrough


    In this example, the multi-line comment is used to provide a more detailed explanation
    of the program’s function. It describes the overall process of declaring a variable
    and printing it. Additionally, there is a single-line comment next to the code
    for further clarity. The multi-line comment helps when you need to explain broader
    concepts, while single-line comments work for specific lines.


    Notes


    Multi-line comments are useful when explaining multiple lines of code or providing
    comprehensive details. Be mindful of overusing them, as too many comments can
    clutter your code. Stick to concise and relevant comments that truly aid in understanding.


    * * *


    Projects


    * * *


    Project 1: Calculating the Area of a Circle


    Description:


    Write a program that calculates the area of a circle and add comments to explain
    each step of the process.


    Objective:


    Use single-line and multi-line comments to explain the logic behind calculating
    the area of a circle.


    Instructions:


    1.  Use the formula: Area = π × radius².


    2.  Use comments to describe variable declarations, formula usage, and output
    formatting.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    // Declare variables


    double radius, area;


    const double pi = 3.14159;  // Constant value of pi


    // Get radius input from user


    cout << "Enter the radius of the circle: ";


    cin >> radius;


    // Calculate the area


    area = pi * radius * radius;  // Formula for the area of a circle


    // Output the result


    cout << "The area of the circle is: " << area << endl;


    return 0;


    }


    Code Walkthrough:


    The program declares a variable for the radius and the area. It asks the user
    to input the radius, then calculates the area using the formula  pi * radius *
    radius. Comments are used to explain the constant value of  pi, how the formula
    works, and the process of printing the result.


    Challenge:


    Modify the program to calculate the circumference of the circle as well, using
    comments to explain the additional logic.


    * * *


    Project 2: Calculating a Student''s Average Grade


    Description:


    Create a program that takes marks for different subjects, calculates the average,
    and outputs the grade. Use comments to explain how each step works.


    Objective:


    Use comments to guide the reader through variable declaration, user input, calculation
    of the average, and printing the result.


    Instructions:


    1.  Declare variables for each subject''s mark.


    2.  Use comments to explain how the average is calculated.


    3.  Print the average and corresponding grade.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    // Declare variables for marks


    int math, science, english, total;


    double average;


    // Get marks from user


    cout << "Enter marks for Math: ";


    cin >> math;


    cout << "Enter marks for Science: ";


    cin >> science;


    cout << "Enter marks for English: ";


    cin >> english;


    // Calculate total and average


    total = math + science + english;  // Total marks


    average = total / 3.0;  // Calculate average


    // Output the average


    cout << "Your average mark is: " << average << endl;


    return 0;


    }


    Code Walkthrough:


    The program asks the user to input marks for three subjects. It calculates the
    total and then the average by dividing the total by 3. Comments are used throughout
    the program to explain each step, from user input to calculating and displaying
    the average.


    Challenge:


    Enhance the program to output a grade (A, B, C, etc.) based on the average score.
    Use comments to explain the grading logic.


    * * *


    End of Chapter Checklist


    *   Understand the purpose of comments in C++.


    *   Know how to use single-line and multi-line comments effectively.'
