    \n### 代码示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\nconst double pi = 3.14159;  // 为 pi 声明常量\ndouble radius = 5.0;\ndouble area\
    \ = pi * radius * radius;  // 在计算中使用常量\ncout << \"Area of the circle: \" << area\
    \ << endl;\nreturn 0;\n}\n```\n\n### 代码解析\n在此程序中，常量 `pi` 被声明为值 `3.14159`。由于 `pi`\
    \ 永远不会改变，因此将其声明为常量以防止意外修改。程序使用常量 `pi` 计算圆的面积并打印结果。\n\n### 注意事项\n对于在程序执行期间永远不应改变的值，请使用常量，例如固定费率、限制或公式中的常量。常量可以提高代码的可靠性和可读性，确保某些值保持一致。\n\
    \n***\n\n### 项目\n\n#### 项目 1：计算矩形的面积和周长\n**描述：** 编写程序，使用存储在变量中的长度和宽度计算矩形的面积和周长。\n\
    **目标：** 理解如何使用变量来存储和处理数据。\n**指令：**\n* 声明 `length` 和 `width` 变量。\n* 使用公式：\n   \
    \ * `Area = length × width`\n    * `Perimeter = 2 × (length + width)`\n* 输出结果。\n\
    \n**代码：**\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n\
    int length, width, area, perimeter;\ncout << \"Enter the length: \";\ncin >> length;\n\
    cout << \"Enter the width: \";\ncin >> width;\narea = length * width;\nperimeter\
    \ = 2 * (length + width);\ncout << \"Area: \" << area << endl;\ncout << \"Perimeter:\
    \ \" << perimeter << endl;\nreturn 0;\n}\n```\n\n**代码解析：**\n此程序提示用户输入矩形的长度和宽度。它使用提供的公式计算面积和周长，并显示结果。\n\
    \n**挑战：**\n修改程序以处理长度和宽度的浮点值，使输出更精确。\n\n***\n\n#### 项目 2：美元兑换欧元\n**描述：** 编写程序，将美元金额转换为欧元，并使用存储在常量变量中的汇率。\n\
    **目标：** 学习在计算中使用常量和变量。\n**指令：**\n* 为 `exchangeRate` 声明一个常量。\n* 获取美元金额作为输入。\n*\
    \ 使用常量将美元转换为欧元。\n\n**代码：**\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\nconst double exchangeRate = 0.85;  // 常数汇率\ndouble dollars, euros;\n\
    cout << \"Enter the amount in dollars: \";\ncin >> dollars;\neuros = dollars *\
    \ exchangeRate;  // 转换\ncout << \"Equivalent in euros: \" << euros << endl;\n\
    return 0;\n}\n```\n\n**代码解析：**\n程序声明了一个常量 `exchangeRate`，获取美元输入，并使用该常量计算等值的欧元。结果打印在控制台上。\n\
    \n**挑战：**\n修改程序以允许用户输入自定义汇率。\n\n***\n\n### 本章结束清单\n* 理解如何声明和使用变量。\n* 了解变量和常量之间的区别。\n\
    * 能够在单行声明多个变量。\n* 练习使用描述性标识符。\n\n***\n\n### 测验\n1. C++ 中变量的作用是什么？\n2. 如何在一行中声明多个相同类型的变量？\n\
    3. 声明常量的语法是什么？\n\n***\n\n### 术语表\n* 变量 (Variable)：在内存中存储数据的命名容器。\n* 常量 (Constant)：初始化后值不能改变变量。\n\
    * 标识符 (Identifier)：代码中变量、函数或其他元素的名称。\n\n# 第 7 章 C++ 用户输入\n\n***\n\n### 什么是 C++\
    \ 中的用户输入？\n用户输入是在程序执行期间从用户获取信息的过程。在 C++ 中，用户输入通常使用 `cin` 对象处理，它代表控制台输入。该对象是 `iostream`\
    \ 库的一部分，就像 `cout` 一样。使用 `cin`，你可以提示用户输入数据（如数字、字符串或字符），这些数据会被存储在变量中并在程序稍后使用。\n\n\
    用户输入让你的程序具有交互性和响应性。例如，在一个计算器程序中，你会要求用户输入数字，对它们进行操作，然后返回结果。同样，你可以收集各种输入（如名称、年龄或选择）来构建更动态的应用程序。有效处理输入是构建用户友好程序的关键，使\
    \ `cin` 成为 C++ 编程不可或缺的一部分。\n\n***\n\n### 语法\n使用 `cin` 获取用户输入的语法非常简单。在提示用户提供所需数据后，你指定用于存储输入的变量。基本语法如下：\n\
    \n```cpp\ncin >> variable_name;\n```\n\n例如，如果你想让用户输入年龄，你可以这样写：\n\n```cpp\nint\
    \ age;\ncin >> age;\n```\n\n你还可以通过链式使用 `>>` 运算符一次获取多个输入：\n\n```cpp\nint age;\n\
    string name;\ncin >> name >> age;\n```\n\n在此示例中，用户将首先输入姓名，然后输入年龄。\n\n### 语法说明\n\
    `cin` 对象从键盘读取数据，在提示用户提供所需数据后，你指定用于存储输入的变量。`>>` 运算符提取数据并存储在变量中。\n\n***\n\n### 代码示例\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\nstring name;\n\
    int age;\ncout << \"Enter your name: \";\ncin >> name;\ncout << \"Enter your age:\
    \ \";\ncin >> age;\ncout << \"Hello, \" << name << \". You are \" << age << \"\
    \ years old.\" << endl;\nreturn 0;\n}\n```\n\n### 代码解析\n在此程序中，我们首先声明了两个变量：`name`（字符串）和\
    \ `age`（整数）。我们使用 `cout` 提示用户输入姓名，`cin` 获取输入并存储在 `name` 变量中。接下来，提示用户输入年龄，并存储在变量中。\n\
    \n收集输入后，程序使用 `cout` 打印包含用户姓名和年龄的消息。例如，如果用户输入 \"Alice\" 和 \"30\"，程序将输出：\n\n`Hello,\
    \ Alice. You are 30 years old.`\n\n这种简单的交互演示了如何在 C++ 中收集和使用用户输入。\n\n***\n\n###\
    \ 注意事项\n使用 `cin` 时，确保要验证用户输入以避免错误。如果用户在预期输入数字时输入了文本，程序可能会失败或产生错误结果。你可以使用条件判断和循环来检查输入是否有效并要求用户重新输入。此外，请注意\
    \ `cin` 不捕捉字符串输入中的空格——只存储第一个单词。如果你需要捕捉完整的句子或包含空格的姓名，请使用 `getline(cin, variable_name)`。\n\
    \n***\n\n### 项目\n\n#### 项目 1：收集姓名和年龄\n**描述：** 创建一个程序，询问用户的姓名和年龄，然后打印个性化消息。\n**目标：**\
    \ 学习如何使用 `cin` 收集输入并使用 `cout` 打印响应。\n**指令：**\n1. 为用户的姓名（字符串）和年龄（整数）声明变量。\n2. 使用\
    \ `cin` 获取用户输入。\n3. 输出类似“Hello, [name]. You are [age] years old.”的消息。\n\n**代码：**\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\nstring name;\n\
    int age;\ncout << \"Please enter your name: \";\ncin >> name;\n}\n```\n"
