  trans: "\nC++ 中的三元运算符是 `if-else` 语句的简写形式。当你需要根据条件快速做决定并赋值时，它非常有用。三元运算符接受三个操作数：一个条件、当条件为真时的值，以及当条件为假时的值。它由符号\
    \ `?` 和 `:` 表示。\n\n例如，如果你想检查一个数字是偶数还是奇数，可以使用三元运算符在一行代码内返回结果，而不是编写完整的 `if-else`\
    \ 语句。\n\n三元运算符非常适合追求简洁的简单决策，但应该谨慎使用。当条件或操作变得复杂时，`if-else` 语句可能会提供更好的可读性。\n\n##\
    \ 语法\n\n三元运算符的基本语法为：\n\n`condition ? value_if_true : value_if_false;`\n\n例如：\n\
    \n`string result = (age >= 18) ? \"Adult\" : \"Minor\";`\n\n## 语法解释\n\n三元运算符会评估一个条件。如果条件为真，则执行冒号（`:`）之前的表达式；如果条件为假，则执行冒号（`:`）之后的表达式。它提供了一种更简洁的方式来编写简单的\
    \ `if-else` 决策。\n\n在以下代码中：\n\n`string category = (age >= 18) ? \"Adult\" : \"\
    Minor\";`\n\n三元运算符检查 `age >= 18`。如果为真，它将 `\"Adult\"` 赋值给变量 `category`。否则，它将 `\"\
    Minor\"` 赋值给 `category`。这是用一行表达 `if-else` 逻辑的紧凑方法。\n\n## 代码示例\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n    int age;\n    cout <<\
    \ \"Enter your age: \";\n    cin >> age;\n    string status = (age >= 18) ? \"\
    You are an adult.\" : \"You are not an adult.\";\n    cout << status << endl;\n\
    \    return 0;\n}\n```\n\n## 代码解读\n\n在该程序中，三元运算符检查用户是否 18 岁或以上。如果条件为真，字符串 \"You\
    \ are an adult\" 被赋值给变量 `status`。如果条件为假，则赋值字符串 \"You are not an adult\"。然后打印结果。三元运算符将决策过程压缩到单行中，在不牺牲功能的情况下使代码更加简洁。\n\
    \n## 注意事项\n\n三元运算符最适用于简单的条件和赋值。避免将其用于复杂的逻辑，因为这可能会使代码变得难以阅读。如果你的逻辑涉及多个条件或操作，请坚持使用传统的\
    \ `if-else` 语句以保持清晰。\n\n## 项目\n\n### 项目 1：成绩检查\n\n**描述：**\n编写一个程序，询问用户的成绩，并使用\
    \ `if-else` 语句打印他们是及格还是不及格。\n\n**目标：**\n练习编写基础的 `if-else` 语句，根据用户输入做出决策。\n\n**指令：**\n\
    1. 要求用户输入他们的成绩（例如，100 分中的 65 分）。\n2. 使用 `if-else` 语句检查成绩是否在 50 分或以上（及格）。\n3. 打印用户是及格还是不及格。\n\
    \n**代码：**\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    int grade;\n    cout << \"Enter your grade: \";\n    cin >> grade;\n\
    \    if (grade >= 50) {\n        cout << \"You passed!\" << endl;\n    } else\
    \ {\n        cout << \"You failed!\" << endl;\n    }\n    return 0;\n}\n```\n\n\
    **代码解读：**\n程序询问用户的成绩并将其存储在 `grade` 变量中。`if-else` 语句检查成绩是否在 50 分或以上。如果条件为真，告诉用户他们及格了。如果为假，则告诉他们不及格。\n\
    \n**挑战：**\n修改程序，使 90 分及以上的成绩打印“Excellent”，75 分及以上打印“Good”，50 分及以上打印“Pass”，50 分以下统一打印“Fail”。\n\
    \n### 项目 2：年龄分类程序\n\n**描述：**\n创建一个程序，接收人的年龄输入，并使用 `if`、`else if` 和 `else` 输出他们是儿童、青少年、成人还是老年人。\n\
    \n**目标：**\n练习使用 `if`、`else if` 和 `else` 处理多个条件。\n\n**指令：**\n1. 要求用户输入他们的年龄。\n\
    2. 使用 `if`、`else if` 和 `else` 将年龄分类为儿童（<13 岁）、青少年（13–19 岁）、成人（20–64 岁）或老年人（65\
    \ 岁+）。\n3. 根据用户的输入打印类别。\n\n**代码：**\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\n    int age;\n    cout << \"Enter your age: \";\n    cin\
    \ >> age;\n    if (age < 13) {\n        cout << \"You are a child.\" << endl;\n\
    \    } else if (age >= 13 && age <= 19) {\n        cout << \"You are a teenager.\"\
    \ << endl;\n    } else if (age >= 20 && age <= 64) {\n        cout << \"You are\
    \ an adult.\" << endl;\n    } else {\n        cout << \"You are a senior citizen.\"\
    \ << endl;\n    }\n    return 0;\n}\n```\n\n**代码解读：**\n该程序根据年龄对用户进行分类。如果年龄小于 13，打印\
    \ \"You are a child.\"。`else if` 语句检查年龄是否在 13 到 19 之间，打印 \"You are a teenager.\"\
    。另一个 `else if` 语句检查年龄是否在 20 到 64 之间，`else` 块处理 65 岁及以上。\n\n**挑战：**\n修改程序以处理额外的类别，例如\
    \ 3 岁以下的为“infant”，20-29 岁的为“young adult”。\n\n## 本章总结\n\n*   理解 `if`、`else` 和 `else\
    \ if` 语句的结构和功能。\n*   练习编写控制程序流的条件。\n*   能够使用三元运算符处理简单的 `if-else` 决策。\n\n## 测试\n\
    \n1. `if` 和 `else if` 有什么区别？\n2. 三元运算符与传统的 `if-else` 语句有什么不同？\n3. 什么情况下应该使用 `if-else`\
    \ 语句而不是三元运算符？\n\n## 词汇表\n\n*   **If Statement**: 条件为真时执行代码的控制结构。\n*   **Else Statement**:\
    \ 当 `if` 条件为假时执行代码的备选语句。\n*   **Else If**: 在原始 `if` 语句之后允许检查额外条件的语句。\n*   **Ternary\
    \ Operator**: 一行代码内编写简单 `if-else` 条件的简写形式。\n"
- fmt: "\nThe `break` statement is crucial because it stops the execution from falling\
    \ through to the next `case`. Without a `break`, the program would continue to\
    \ execute the code for the subsequent cases, regardless of whether their values\
    \ match the expression. This is known as \"fallthrough,\" and in some cases, it\
    \ can be intentional, but it’s typically avoided unless explicitly needed.\n\n\
    The `default` case is optional but recommended. It acts as a catch-all for any\
    \ values that don't match the defined `case` values, allowing the program to handle\
    \ unexpected inputs gracefully.\n\n## Code Example\n\nHere’s a simple example\
    \ of a `switch` statement that evaluates a variable and prints a message based\
    \ on its value:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main() {\n    int day = 3;\n\n    switch (day) {\n    case 1:\n        cout\
    \ << \"Monday\" << endl;\n        break;\n    case 2:\n        cout << \"Tuesday\"\
    \ << endl;\n        break;\n    case 3:\n        cout << \"Wednesday\" << endl;\n\
    \        break;\n    case 4:\n        cout << \"Thursday\" << endl;\n        break;\n\
    \    case 5:\n        cout << \"Friday\" << endl;\n        break;\n    default:\n\
    \        cout << \"Weekend\" << endl;\n    }\n\n    return 0;\n}\n```\n\n## Code\
    \ Walkthrough\n\nIn this example, the variable `day` is initialized to `3`. The\
    \ `switch` statement evaluates the value of `day` and compares it against the\
    \ predefined `case` values. Since `day` equals `3`, the program will print \"\
    Wednesday.\"\n\nNotice how each `case` has a corresponding `break` statement.\
    \ When the program reaches the matching `case`, the associated block of code is\
    \ executed, and the `break` statement ensures the program exits the `switch` after\
    \ printing the correct day.\n\nIf `day` were assigned a value other than `1` through\
    \ `5`, the `default` block would execute, printing \"Weekend.\" The `default`\
    \ case helps handle scenarios where the input doesn't match any of the provided\
    \ cases.\n\n## Notes\n\n- Always include a `break` statement after each `case`\
    \ to prevent fallthrough unless fallthrough behavior is intended.\n- Use the `default`\
    \ case to handle unexpected values, ensuring that your program behaves predictably\
    \ with all inputs.\n- The `switch` statement is a better alternative to the `if-else`\
    \ ladder when dealing with multiple specific values for a single variable.\n-\
    \ Avoid using `switch` for conditions involving ranges or complex boolean expressions,\
    \ as it only supports direct value comparisons.\n\n***\n\n## Project 1: Days of\
    \ the Week Switch Statement\n\n### Description\nCreate a program that asks the\
    \ user to input a number between 1 and 7 and prints the corresponding day of the\
    \ week using a `switch` statement.\n\n### Objective\nThe goal is to practice using\
    \ the `switch` statement to map numbers to corresponding days of the week.\n\n\
    ### Instructions\n1. Prompt the user for a number between 1 and 7.\n2. Use a `switch`\
    \ statement to print the appropriate day (Monday to Sunday).\n3. Handle unexpected\
    \ inputs using the `default` case.\n\n### Code\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int day;\n    cout << \"Enter a number\
    \ between 1 and 7: \";\n    cin >> day;\n\n    switch (day) {\n    case 1: cout\
    \ << \"Monday\"; break;\n    case 2: cout << \"Tuesday\"; break;\n    case 3:\
    \ cout << \"Wednesday\"; break;\n    case 4: cout << \"Thursday\"; break;\n  \
    \  case 5: cout << \"Friday\"; break;\n    case 6: cout << \"Saturday\"; break;\n\
    \    case 7: cout << \"Sunday\"; break;\n    default: cout << \"Invalid input.\"\
    ;\n    }\n\n    return 0;\n}\n```\n\n### Code Walkthrough\nThe user is prompted\
    \ to enter a number, and based on the input, the program uses a `switch` statement\
    \ to print the corresponding day of the week. The `default` case handles any input\
    \ that is not between 1 and 7.\n\n### Challenge\nExtend the program to include\
    \ a loop that keeps asking for input until a valid number is entered.\n\n***\n\
    \n## Project 2: Basic Calculator Using Switch\n\n### Description\nCreate a simple\
    \ calculator that performs basic arithmetic operations based on user input.\n\n\
    ### Objective\nTo practice using the `switch` statement for decision-making based\
    \ on multiple possible operations.\n\n### Instructions\n1. Ask the user for two\
    \ numbers and an operation (addition, subtraction, multiplication, or division).\n\
    2. Use a `switch` statement to perform the selected operation.\n3. Handle invalid\
    \ operations using the `default` case.\n\n### Code\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    char operation;\n    double num1,\
    \ num2;\n    cout << \"Enter an operator (+, -, *, /): \";\n    cin >> operation;\n\
    \    cout << \"Enter two numbers: \";\n    cin >> num1 >> num2;\n\n    switch\
    \ (operation) {\n    case '+': cout << num1 + num2; break;\n    case '-': cout\
    \ << num1 - num2; break;\n    case '*': cout << num1 * num2; break;\n    case\
    \ '/': cout << num1 / num2; break;\n    default: cout << \"Invalid operator\"\
    ;\n    }\n\n    return 0;\n}\n```\n\n### Code Walkthrough\nThe program prompts\
    \ the user for two numbers and an operator. The `switch` statement performs the\
    \ requested operation based on the operator entered by the user.\n\n### Challenge\n\
    Enhance the calculator to handle division by zero.\n\n***\n\n## End of Chapter\
    \ Checklist\n\n- Understand how the `switch` statement works and when to use it.\n\
    - Be familiar with syntax, including the use of `break` and `default`.\n- Complete\
    \ two projects that reinforce your understanding of `switch`.\n- Know the best\
    \ practices for writing clear, efficient `switch` statements.\n\n***\n\n## Quiz\n\
    \n1. What is the purpose of `break` in a `switch`?\n2. Can the `switch` statement\
    \ handle ranges?\n3. What type of expression can be evaluated in a `switch`?\n\
    \n***\n\n## Glossary\n\n- **Switch Statement**: A control structure that executes\
    \ a block of code based on the result of an expression.\n- **Case**: Represents\
    \ a possible value the expression can match.\n- **Break**: A statement used to\
    \ exit the `switch` after a case is executed.\n\n***\n\n# Chapter 15: C++ While\
    \ Loop\n\n### What is the While Loop?\n\nThe `while` loop in C++ is a control\
    \ structure used for repeating a block of code as long as given condition remains\
    \ true. It evaluates the condition before entering the loop and continues executing\
    \ the block until the condition becomes false. The `while` loop is ideal for situations\
    \ where you don't know the exact number of iterations but know that the loop must\
    \ keep running while the condition is satisfied.\n\nIn simple terms, the `while`\
    \ loop ensures that the code within its block will run multiple times, depending\
    \ on the condition. For example, if you need to keep asking for input until they\
    \ provide a valid response or continue calculating values until a certain threshold\
    \ is reached, a `while` loop is a good choice. The flexibility of a `while` loop\
    \ allows for both finite and infinite loops, depending on the condition you use.\
    \ However, care must be taken to avoid creating an infinite loop where the condition\
    \ never becomes false.\n\n### Syntax\n\nThe basic syntax for the `while` loop\
    \ in C++ is:\n\n```cpp\nwhile (condition) {\n    // Code to execute repeatedly\n\
    }\n```\n\nThe loop starts by evaluating the `condition`. If the condition is true,\
    \ the code block is executed. After each iteration, the condition is re-evaluated.\
    \ If the condition is still true, the loop runs again; if false, the loop terminates,\
    \ and the program continues beyond the loop.\n\nThe `condition` can be any expression\
    \ that evaluates to a boolean (true or false). If the condition is false from\
    \ the start, the loop's code block is skipped entirely.\n\n### Syntax Explanation\n\
    \nThe `while` loop’s condition is placed inside parentheses after the `while`\
    \ keyword. This condition is checked before any code inside the loop is executed.\
    \ If the condition evaluates to true, the program enters the loop and begins executing\
    \ the statements within the loop's curly braces `{}`.\n\nAfter each iteration,\
    \ the condition is checked again. As long as the condition remains true, the loop\
    \ will continue to execute. When the condition becomes false, the loop terminates,\
    \ and the program proceeds to the next section of code.\n"
  raw: 'The  break statement is crucial because it stops the execution from falling
    through to the next case. Without a  break, the program would continue to execute
    the code for the subsequent cases, regardless of whether their values match the
    expression. This is known as "fallthrough," and in some cases, it can be intentional,
    but it’s typically avoided unless explicitly needed.


    The  default case is optional but recommended. It acts as a catch-all for any
    values that don''t match the defined  case values, allowing the program to handle
    unexpected inputs gracefully.


    Code Example


    Here’s a simple example of a  switch statement that evaluates a variable and prints
    a message based on its value:


    #include <iostream>


    using namespace std;


    int main() {


    int day = 3;


    switch (day) {


    case 1:


    cout << "Monday" << endl;


    break;


    case 2:


    cout << "Tuesday" << endl;


    break;


    case 3:


    cout << "Wednesday" << endl;


    break;


    case 4:


    cout << "Thursday" << endl;


    break;


    case 5:


    cout << "Friday" << endl;


    break;


    default:


    cout << "Weekend" << endl;


    }


    return 0;


    }


    Code Walkthrough


    In this example, the variable  day is initialized to  3. The  switch statement
    evaluates the value of  day and compares it against the predefined  case values.
    Since  day equals  3, the program will print "Wednesday."


    Notice how each  case has a corresponding  break statement. When the program reaches
    the matching  case, the associated block of code is executed, and the  break statement
    ensures that the program exits the  switch after printing the correct day.


    If  day were assigned a value other than  1 through  5, the  default block would
    execute, printing "Weekend." The  default case helps handle scenarios where the
    input doesn''t match any of the provided cases.


    Notes


    *   Always include a  break statement after each  case to prevent fallthrough
    unless fallthrough behavior is intended.


    *   Use the  default case to handle unexpected values, ensuring that your program
    behaves predictably with all inputs.


    *   The  switch statement is a better alternative to the  if-else ladder when
    dealing with multiple specific values for a single variable.


    *   Avoid using  switch for conditions involving ranges or complex boolean expressions,
    as it only supports direct value comparisons.


    * * *


    Project 1: Days of the Week Switch Statement


    Description


    Create a program that asks the user to input a number between 1 and 7 and prints
    the corresponding day of the week using a  switch statement.


    Objective


    The goal is to practice using the  switch statement to map numbers to corresponding
    days of the week.


    Instructions


    1.  Prompt the user for a number between 1 and 7.


    2.  Use a  switch statement to print the appropriate day (Monday to Sunday).


    3.  Handle unexpected inputs using the  default case.


    Code


    #include <iostream>


    using namespace std;


    int main() {


    int day;


    cout << "Enter a number between 1 and 7: ";


    cin >> day;


    switch (day) {


    case 1: cout << "Monday"; break;


    case 2: cout << "Tuesday"; break;


    case 3: cout << "Wednesday"; break;


    case 4: cout << "Thursday"; break;


    case 5: cout << "Friday"; break;


    case 6: cout << "Saturday"; break;


    case 7: cout << "Sunday"; break;


    default: cout << "Invalid input.";


    }


    return 0;


    }


    Code Walkthrough


    The user is prompted to enter a number, and based on the input, the program uses
    a  switch statement to print the corresponding day of the week. The  default case
    handles any input that is not between 1 and 7.


    Challenge


    Extend the program to include a loop that keeps asking for input until a valid
    number is entered.


    * * *


    Project 2: Basic Calculator Using Switch


    Description


    Create a simple calculator that performs basic arithmetic operations based on
    user input.


    Objective


    To practice using the  switch statement for decision-making based on multiple
    possible operations.


    Instructions


    1.  Ask the user for two numbers and an operation (addition, subtraction, multiplication,
    or division).


    2.  Use a  switch statement to perform the selected operation.


    3.  Handle invalid operations using the  default case.


    Code


    #include <iostream>


    using namespace std;


    int main() {


    char operation;


    double num1, num2;


    cout << "Enter an operator (+, -, *, /): ";


    cin >> operation;


    cout << "Enter two numbers: ";


    cin >> num1 >> num2;


    switch (operation) {


    case ''+'': cout << num1 + num2; break;


    case ''-'': cout << num1 - num2; break;


    case ''*'': cout << num1 * num2; break;


    case ''/'': cout << num1 / num2; break;


    default: cout << "Invalid operator";


    }


    return 0;


    }


    Code Walkthrough


    The program prompts the user for two numbers and an operator. The  switch statement
    performs the requested operation based on the operator entered by the user.


    Challenge


    Enhance the calculator to handle division by zero.


    * * *


    End of Chapter Checklist


    *   Understand how the  switch statement works and when to use it.


    *   Be familiar with syntax, including the use of  break and  default.


    *   Complete two projects that reinforce your understanding of  switch.


    *   Know the best practices for writing clear, efficient  switch statements.


    * * *


    Quiz


    1.  What is the purpose of the  break statement in a  switch block?


    2.  Can the  switch statement handle ranges of values?


    3.  What type of expression can be evaluated in a  switch statement?


    * * *


    Glossary


    *   Switch Statement: A control structure that executes a block of code based
    on the result of an expression.


    *   Case: Represents a possible value the expression can match in a  switch statement.


    *   Break: A statement used to exit the  switch after a case is executed.


    Chapter 15: C++ While Loop


    What is the While Loop? 


    The  while loop in C++ is a control structure used for repeating a block of code
    as long as a given condition remains true. It evaluates the condition before entering
    the loop and continues executing the block of code until the condition becomes
    false. The  while loop is ideal for situations where you don''t know the exact
    number of iterations needed but know that the loop must keep running while the
    condition is satisfied.


    In simple terms, the  while loop ensures that the code within its block will run
    multiple times, depending on the condition provided. For example, if you need
    to keep asking for user input until they provide a valid response or continue
    calculating values until a certain threshold is reached, a  while loop is a good
    choice. The flexibility of a  while loop allows for both finite and infinite loops,
    depending on the condition you use. However, care must be taken to avoid creating
    an infinite loop where the condition never becomes false.


    Syntax


    The basic syntax for the  while loop in C++ is:


    while (condition) {


    // Code to execute repeatedly


    }


    The loop starts by evaluating the  condition. If the condition is true, the code
    block is executed. After each iteration, the condition is re-evaluated. If the
    condition is still true, the loop runs again; if false, the loop terminates, and
    the program continues beyond the loop.


    The condition can be any expression that evaluates to a boolean(true or  false).
    If the condition is false from the start, the loop''s code block is skipped entirely.


    Syntax Explanation


    The  while loop’s condition is placed inside parentheses after the  while keyword.
    This condition is checked before any code inside the loop is executed. If the
    condition evaluates to true, the program enters the loop and begins executing
    the statements within the loop''s curly braces  {}.


    After each iteration, the condition is checked again. As long as the condition
    remains true, the loop will continue to execute. When the condition becomes false,
    the loop terminates, and the program proceeds to the next section of code.'
