  trans: "\n\n-   结构体可以通过值传递或引用传递给函数，但对于大型结构体，引用传递更高效。\n-   如果需要额外的功能（如方法或成员函数），请考虑使用类而不是结构体。\n\
    -   当只需要简单的数据分组而不需要继承等高级功能时，请使用结构体。\n\n### 项目 1：为书籍定义结构体\n\n-   **描述**：编写一个程序，定义一个\
    \ `Book` 结构体，包含 `title`、`author` 和 `price` 等字段，并打印三本书详情。\n-   **目标**：练习定义和使用结构体来存储和显示相关数据。\n\
    -   **指令**：创建一个名为 `Book` 的结构体，为 `title`、`author` 和 `price` 定义成员，并创建该结构体的三个实例。打印每本书的详情。\n\
    \n代码：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nstruct Book {\n\
    string title;\nstring author;\nfloat price;\n};\n\nint main() {\nBook books[3]\
    \ = {\n{\"C++ Guide\", \"John Doe\", 29.99},\n{\"Python Essentials\", \"Jane Smith\"\
    , 35.50},\n{\"Java Fundamentals\", \"Alan Turing\", 42.99}\n};\nfor (int i = 0;\
    \ i < 3; i++) {\ncout << \"Book \" << i+1 << \" Title: \" << books[i].title <<\
    \ endl;\ncout << \"Author: \" << books[i].author << endl;\ncout << \"Price: $\"\
    \ << books[i].price << endl << endl;\n}\nreturn 0;\n}\n```\n\n-   **代码解读**：该程序定义了一个结构体\
    \ `Book` 并创建了一个包含三本书的数组。然后它使用循环打印每本书的详情。\n-   **挑战**：添加一个新字段 `yearPublished` 并修改程序以显示它。\n\
    \n### 项目 2：为点定义结构体\n\n-   **描述**：创建一个程序，定义一个具有 `x` 和 `y` 坐标的 `Point` 结构体，然后计算两点之间的距离。\n\
    -   **目标**：练习在 C++ 中使用结构体和基础数学。\n-   **指令**：定义一个具有成员 `x` 和 `y` 的结构体 `Point`。创建两个\
    \ `Point` 实例并编写一个函数来计算它们之间的欧几得距离。\n\n代码：\n\n```cpp\n#include <iostream>\n#include\
    \ <cmath>\nusing namespace std;\n\nstruct Point {\nfloat x;\nfloat y;\n};\n\n\
    float calculateDistance(Point p1, Point p2) {\nreturn sqrt(pow(p2.x - p1.x, 2)\
    \ + pow(p2.y - p1.y, 2));\n}\n\nint main() {\nPoint point1 = {3.0, 4.0};\nPoint\
    \ point2 = {7.0, 1.0};\nfloat distance = calculateDistance(point1, point2);\n\
    cout << \"Distance between points: \" << distance << endl;\nreturn 0;\n}\n```\n\
    \n-   **代码解读**：该程序定义了一个带有 `x` 和 `y` 坐标的 `Point` 结构体。它使用欧几得距离公式计算两点之间的距离并输出结果。\n\
    -   **挑战**：修改程序以计算三点之间的距离。\n\n## 章节结束清单\n\n-   理解结构体如何组合不同类型的变量。\n-   练习定义结构体和创建实例。\n\
    -   学习如何使用点运算符访问和操作结构体成员。\n-   理解如何将结构体传递给函数，以实现更灵活的代码组织。\n\n## 测验\n\n测试你的知识：\n\
    \n1. C++ 中结构体的目的是什么？\n2. 你如何访问结构体的成员？\n3. C++ 中结构体和类之间的关键区别是什么？\n\n## 术语表\n\n\
    -   **结构体 (struct)**：一种用户定义的数据类型，它将不同类型的变量组合在一个一个名称下。\n-   **成员 (Member)**：结构体内部的单个变量，使用点运算符访问。\n\
    -   **点运算符 (.)**：用于访问结构体的成员。\n-   **实例 (Instance)**：从结构体创建的特定对象，持有其成员的数据。\n\n\
    # 第 200 章. C++ 函数\n\n### 什么是 C++ 函数？ \n\n在 C++ 中，函数是一个执行特定任务的块块，可以在整个程序中重复使用。函数有助于将程序分解为更小、更易于管理的组件，提高代码组织性和可读性。它们允许你在需要时通过简单地调用函数名来执行一组指令。\n\
    \n函数对于避免代码重复和增强模块化至关重要。每个函数通常执行单个任务，并可以向调用代码返回结果。函数可以接受输入（称为参数或参数），并可以使用 `return`\
    \ 语句返回值。不返回值的函数声明为 `void` 返回类型。\n\n使用函数简化了调试和维护代码的过程，因为可以在程序的单个函数中进行更改，而不是在程序中的多个地方进行更改。函数对于协作编程也很重要，因为它允许将不同的任务分配给不同的团队成员。\n\
    \n### 语法\n\nC++ 中定义函数的语法如下：\n\n```cpp\nreturn_type function_name(parameters) {\n\
    // 函数体\nreturn value; // 如果 return_type 不是 void\n}\n```\n\n-   `return_type`：指定函数将返回的值的类型（例如，`int`、`float`、`void`）。\n\
    -   `function_name`：函数的名称。\n-   `parameters`：传递给函数的输入变量。\n\n例如，一个相加两个整数的简单函数：\n\
    \n```cpp\nint add(int a, int b) {\nreturn a + b;\n}\n```\n\n### 语法解释\n\n1. `return_type`：指定函数将返回的值的类型。例如，`int`\
    \ 表示函数将返回一个整数。\n2. `function_name`：函数名应该具有描述性，并指示它执行的任务。函数名遵循与变量相同的规则（例如，以字母开头）。\n\
    3. `parameters`：传递给函数的输入。这些是函数执行任务所需的变量。例如，`int a, int b` 是用于整数加函数的参数。\n4. `function\
    \ body`：函数体包含执行任务的代码。这是函数被调用时执行的代码块。\n5. `return statement`：返回语句指定函数向调用代码返回的值。如果返回类型为\
    \ `void`，函数不需要返回任何内容，可以省略返回语句。\n\n### 代码示例\n\n这是一个演示两个两个整数函数的简单 C++ 程序：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint add(int a, int b) {\nreturn a\
    \ + b;\n}\n\nint main() {\nint sum = add(3, 5);\ncout << \"The sum is: \" << sum\
    \ << endl;\nreturn 0;\n}\n```\n\n该程序定义了一个 `add` 函数，它接收两个整数作为输入并返回它们的和。随后在 `main`\
    \ 函数中调用该函数并打印结果。\n\n### 代码解读\n\n1. **函数定义**：函数 `add(int a, int b)` 有两个整数参数和一个\
    \ `int` 返回类型。\n2. **函数体**：在函数内部，计算 `a` 和 `b` 的和并使用 `return` 语句返回。\n3. **函数调用**：在\
    \ `main` 函数中，调用 `add(3, 5)`，传递 3 和 5 作为参数。函数加上这些值并返回结果。\n4. **输出**：结果（3 和 5 之和）存储在变量\
    \ `sum` 中，并使用 `cout` 打印。输出为 `The sum is: 8`。\n\n此示例演示了函数如何通过将其封装为重复使用的代码块来简化重复任务（如加法）。\n\
    \n## 函数参数\n\n### 什么是函数参数？\n\n函数参数是用于向函数传递信息的变量。当调用函数时，你可以为它提供执行任务所需的数据（称为参数）。函数处理这些数据并根据输入返回结果。\n\
    \n参数在函数定义中声明，位于函数名后的括号内。\n\n"
- fmt: "\nThere are two primary ways to pass parameters in C++: by value and by reference.\
    \ When parameters are passed by value, the function receives a copy of the arguments,\
    \ so changes made to the parameters inside the function don’t affect the original\
    \ variables. Passing by reference, on the other hand, allows the function to modify\
    \ the original variables directly.\n\nFunction parameters allow you to write flexible,\
    \ reusable code. Instead of hardcoding values, you can pass different arguments\
    \ each time you call the function, making the function adaptable to various situations.\n\
    \n## Syntax\n\nThe syntax for defining function parameters is as follows:\n\n\
    ```cpp\nreturn_type function_name(data_type parameter1, data_type parameter2)\
    \ {\n    // function body\n}\n```\n\nFor example:\n\n```cpp\nint add(int a, int\
    \ b) {\n    return a + b;\n}\n```\n\nIn this example, `a` and `b` are parameters\
    \ of type `int`, which are passed to the function when it is called.\n\n### Syntax\
    \ Explanation\n\n1. `data_type`: This specifies the type of the parameter, such\
    \ as `int`, `float`, or `string`. Each parameter must have a defined data type.\n\
    2. `parameter name`: Parameters are essentially variables used inside the function.\
    \ The parameter names should be descriptive, so it’s clear what type of data they\
    \ represent.\n3. `Multiple parameters`: A function can accept multiple parameters,\
    \ separated by commas. For example, `int a, int b` allows the function to accept\
    \ two integer values.\n4. `Passing arguments`: When the function is called, the\
    \ values passed to the function (called arguments) are assigned to the corresponding\
    \ parameters. For example, calling `add(3, 5)` assigns `3` to `a` and `5` to `b`.\n\
    \nFunction parameters allow you to pass dynamic values to a function, making it\
    \ reusable and capable of handling different inputs without modifying the function\
    \ itself.\n\n## Code Example\n\nHere’s an example that demonstrates passing parameters\
    \ to a function:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid\
    \ printSum(int a, int b) {\n    int sum = a + b;\n    cout << \"Sum: \" << sum\
    \ << endl;\n}\n\nint main() {\n    printSum(10, 20);\n    return 0;\n}\n```\n\n\
    ### Code Walkthrough\n\n1. **Function Definition**: The function `printSum` accepts\
    \ two parameters of type `int`, `a` and `b`.\n2. **Function Body**: Inside the\
    \ function, the sum of `a` and `b` is calculated and stored in the variable `sum`.\
    \ The result is then printed.\n3. **Function Call**: In the `main` function, `printSum(10,\
    \ 20)` is called. The values `10` and `20` are passed to the function, where they\
    \ are added together.\n4. **Output**: The function calculates the sum of `10`\
    \ and `20 and prints `Sum: 30`.\n\nThis program demonstrates how functions use\
    \ parameters to work with different inputs dynamically, making the code more flexible\
    \ and reusable.\n\n## Pass by Reference\n\n### What is Pass by Reference?\n\n\
    Passing by reference is a method where a function receives a reference to the\
    \ original variable, rather than a copy. This allows the function to modify the\
    \ actual variable used in the calling code. In contrast to pass by value, where\
    \ a copy of the variable is made, pass by reference directly operates on the original\
    \ variable.\n\nIn C++, you pass parameters by reference by using the `&` symbol\
    \ in the function parameter list. This tells the function to work with the memory\
    \ address of the variable, allowing any changes made inside the function to affect\
    \ the original variable.\n\nPass by reference is especially useful when working\
    \ with large data structures or when you want the function to modify the original\
    \ variable without returning a new value. It also helps improve performance by\
    \ avoiding the overhead of copying large amounts of data.\n\n### Syntax\n\nThe\
    \ syntax for passing a parameter by reference is as follows:\n\n```cpp\nvoid function_name(data_type\
    \ &parameter) {\n    // function body\n}\n```\n\nFor example:\n\n```cpp\nvoid\
    \ increment(int &a) {\n    a++;\n}\n```\n\nIn this example, `a` is passed by reference,\
    \ so the original variable passed to the function is modified directly.\n\n###\
    \ Syntax Explanation\n\n1. `data_type`: This specifies the type of the parameter\
