- fmt: "\nSorting algorithms work by comparing elements and rearranging them according\
    \ to the chosen order (ascending or descending). For example, in bubble sort,\
    \ adjacent elements are compared, and if they are in the wrong order, they are\
    \ swapped. This process repeats until the array is sorted.\n\nIn contrast, quicksort\
    \ selects a pivot element, partitions the array into two sub-arrays, and recursively\
    \ sorts each sub-array. Quicksort is faster but requires more careful implementation\
    \ due to its recursive nature.\n\nUnderstanding the internal workings of sorting\
    \ algorithms is important for optimizing performance, particularly when handling\
    \ large datasets where efficiency is key.\n\n## Code Example\n\n```cpp\n#include\
    \ <iostream>\n\nvoid bubbleSort(int arr[], int n) {\n    for (int i = 0; i < n-1;\
    \ i++) {\n        for (int j = 0; j < n-i-1; j++) {\n            if (arr[j] >\
    \ arr[j+1]) {\n                std::swap(arr[j], arr[j+1]);\n            }\n \
    \       }\n    }\n}\n\nint main() {\n    int arr[] = {64, 34, 25, 12, 22};\n \
    \   int n = sizeof(arr)/sizeof(arr[0]);\n    bubbleSort(arr, n);\n    for (int\
    \ i = 0; i < n; i++) {\n        std::cout << arr[i] << \" \";\n    }\n    return\
    \ 0;\n}\n```\n\n## Code Walkthrough\n\nThis program demonstrates the bubble sort\
    \ algorithm. The `bubbleSort` function compares adjacent elements and swaps them\
    \ if they are in the wrong order. This process is repeated, and with each iteration,\
    \ the largest element \"bubbles\" to the end of the array. After multiple iterations,\
    \ the array is fully sorted.\n\nThe function uses two nested loops: the outer\
    \ loop keeps track of the number of passes, while the inner loop compares adjacent\
    \ elements and performs the swap if necessary. After sorting, the array is printed\
    \ to the console.\n\n## Notes\n\n- For small arrays, bubble sort is simple and\
    \ easy to implement, but it is inefficient for large datasets.\n- Use `std::sort`\
    \ for built-in optimized sorting instead of custom implementations unless learning.\n\
    - Sorting is often the first step in optimizing other algorithms, like searching.\n\
    \n***\n\n## Searching Algorithms\n\n### What is Searching in C++?\n\nSearching\
    \ algorithms in C++ are used to find the position of a specific element within\
    \ a data structure like an array or a list. There are two main types of searching\
    \ algorithms: linear search and binary search. Linear search is simple but inefficient,\
    \ as it checks each element one by one. Binary search is much faster but requires\
    \ the data to be sorted first.\n\nLinear search is useful for small, unsorted\
    \ datasets, while binary search is optimal for large, sorted datasets. Searching\
    \ algorithms are essential in fields like databases, where quick data retrieval\
    \ is critical.\n\n### Syntax\n\n```cpp\n#include <algorithm>\n\nbool result =\
    \ std::binary_search(array, array + size, value);\n```\n\nThis syntax uses the\
    \ STL’s `std::binary_search` function to search for a value in a sorted array.\
    \ If the value is found, it returns `true`; otherwise, it returns `false`.\n\n\
    ### Syntax Explanation\n\nLinear search works by iterating through the array or\
    \ list one element at a time, comparing each element with the target value. It\
    \ continues this process until the target is found or the end of the array is\
    \ reached.\n\nBinary search, on the other hand, works on sorted arrays. It repeatedly\
    \ divides the array in half, comparing the target value to the middle element.\
    \ If the target is less than the middle element, the algorithm continues searching\
    \ in the left half, otherwise in the right half. This \"divide-and-conquer\" approach\
    \ makes binary search highly efficient with a time complexity of `O(log n)`, compared\
    \ to `O(n)` for linear search.\n\n### Code Example\n\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n\nint binarySearch(int arr[], int n, int value) {\n    int\
    \ low = 0, high = n - 1;\n    while (low <= high) {\n        int mid = low + (high\
    \ - low) / 2;\n        if (arr[mid] == value) {\n            return mid;\n   \
    \     } else if (arr[mid] < value) {\n            low = mid + 1;\n        } else\
    \ {\n            high = mid - 1;\n        }\n    }\n    return -1;  // Not found\n\
    }\n\nint main() {\n    int arr[] = {10, 20, 30, 40, 50};\n    int n = sizeof(arr)/sizeof(arr[0]);\n\
    \    int result = binarySearch(arr, n, 30);\n    std::cout << \"Element found\
    \ at index: \" << result;\n    return 0;\n}\n```\n\n### Code Walkthrough\n\nThis\
    \ program implements a binary search on a sorted array. The `binarySearch` function\
    \ uses two variables, `low` and `high`, to define the current search range. The\
    \ middle element is compared with the target value. If they are equal, the target’s\
    \ position is returned. If the target is smaller, the search continues in the\
    \ left half; otherwise, it continues in the right half.\n\nThe search continues\
    \ until `low` is greater than `high`, meaning the target value is not in the array.\
    \ This algorithm significantly reduces the number of comparisons needed.\n\n##\
    \ Notes\n\n- Binary search is much faster than linear search but requires sorted\
    \ data.\n- For unsorted data, use linear search, although it may be less efficient.\n\
    - Avoid re-sorting data every time you need to search. Sort once, and then use\
    \ binary search repeatedly for multiple lookups.\n\n***\n\n## Project 1: Write\
    \ a Program that Sorts an Array of Integers Using the Bubble Sort Algorithm\n\n\
    ### Objective\n\nCreate a program that sorts an array of integers using the bubble\
    \ sort algorithm.\n\n### Instructions\n\n- Declare an array of integers.\n- Implement\
    \ the bubble sort algorithm.\n- Print the array.\n\n### Code\n\n```cpp\n#include\
    \ <iostream>\n\nvoid bubbleSort(int arr[], int n) {\n    for (int i = 0; i < n-1;\
    \ i++) {\n        for (int j = 0; j < n-i-1; j++) {\n            if (arr[j] >\
    \ arr[j+1]) {\n                std::swap(arr[j], arr[j+1]);\n            }\n \
    \       }\n    }\n}\n\nint main() {\n    int arr[] = {29, 10, 14, 37, 13};\n \
    \   int n = sizeof(arr)/sizeof(arr[0]);\n    bubbleSort(arr, n);\n    for (int\
    \ i = 0; i < n; i++) {\n        std::cout << arr[i] << \" \";\n    }\n    return\
    \ 0;\n}\n```\n\n### Code Walkthrough\n\nThe program implements the bubble sort\
    \ algorithm to sort an array. The array is printed in sorted order.\n\n### Challenge\n\
    \nModify the program to sort the array in descending order by adjusting the comparison\
    \ logic.\n\n***\n\n## Project 2: Create a Program that Implements a Binary Search\
    \ to Find an Element\n\n### Objective\n\nWrite a program that uses the binary\
    \ search algorithm to find an element in a sorted array.\n\n### Instructions\n\
    \n- Declare a sorted array.\n- Implement the binary search algorithm.\n- Print\
    \ the index of the element if found, or an appropriate message if not found.\n\
    \n### Code\n\n```cpp\n#include <iostream>\n\nint binarySearch(int arr[], int n,\
    \ int value) {\n    int low = 0, high = n - 1;\n    while (low <= high) {\n  \
    \      int mid = low + (high - low) / 2;\n        if (arr[mid] == value) {\n \
    \           return mid;\n        } else if (arr[mid] < value) {\n            low\
    \ = mid + 1;\n        } else {\n            high = mid - 1;\n        }\n    }\n\
    \    return -1;  // Not found\n}\n\nint main() {\n    int arr[] = {3, 6, 8, 12,\
    \ 14, 17, 25, 30};\n    int n = sizeof(arr)/sizeof(arr[0]);\n    int result =\
    \ binarySearch(arr, n, 17);\n    if (result != -1) {\n        std::cout << \"\
    Element found at index: \" << result;\n    } else {\n        std::cout << \"Element\
    \ not found.\";\n    }\n    return 0;\n}\n```\n\n### Code Walkthrough\n\nThe program\
    \ implements a binary search to find the value `17` in the sorted array. If the\
    \ value is found, the index is displayed. Otherwise, a message indicating the\
    \ element was not found is printed.\n\n### Challenge\n\nEnhance the program to\
    \ allow user input for both the array and the target value.\n\n***\n\n## End of\
    \ Chapter Checklist\n\n- Understand the difference between sorting and searching\
    \ algorithms.\n- Practice implementing and optimizing algorithms for sorting and\
    \ searching.\n- Learn how to choose between different algorithms based on efficiency\
    \ and use case.\n- Review the built-in STL functions like `std::sort` and `std::binary_search`.\n\
    \n## Quiz\n\n1.  What is the time complexity of bubble sort?\n2.  What type of\
    \ data structure is required for binary search to be effective?\n3.  What is the\
    \ main difference between linear and binary search?\n\n## Glossary\n\n- **Sorting\
    \ Algorithm**: A process to arrange data in a specific order, like ascending or\
    \ descending.\n"
