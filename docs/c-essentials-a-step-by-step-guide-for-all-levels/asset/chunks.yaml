    \ are redirected to the login page. `if` statements are used whenever decisions\
    \ or choices need to be made in a program, making them fundamental in creating\
    \ dynamic, responsive software.\n\n***\n\n### Syntax\nThe basic syntax for an\
    \ `if` statement looks like this:\n\n```cpp\nif (condition) {\n// Code to execute\
    \ if condition is true\n}\n```\n\nFor example:\n```cpp\nif (age >= 18) {\n   \
    \ cout << \"You are an adult.\" << endl;\n}\n```\n\n***\n\n### Syntax Explanation\n\
    The `if` statement begins with the keyword `if` followed by a condition inside\
