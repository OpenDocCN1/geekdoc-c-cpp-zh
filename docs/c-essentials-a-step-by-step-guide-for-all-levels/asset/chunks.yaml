    \ boolean conditions to control logic flow.\n* Know how to use comparison and\
    \ logical operators to create complex conditions.\n\n***\n\n## Quiz\n1. What values\
    \ can a boolean variable hold in C++?\n2. How do you check if two numbers are\
    \ equal using a boolean expression?\n3. What is the difference between the `&&`\
    \ and `||` operators?\n\n***\n\n## Glossary\n* **Boolean**: A data type that holds\
    \ `true` or `false` values.\n* **Boolean Expression**: An expression that evaluates\
    \ to either true or false, used to make decisions in code.\n* **Logical Operator**:\
    \ An operator that combines or modifies boolean expressions (e.g., `&&`, `||`,\
    \ `!`).\n\n# Chapter 13 C++ If...Else Statements\n\n***\n\n### What is the If\
    \ Statement?\nAn `if` statement in C++ is a conditional statement that allows\
    \ your program to make decisions based on whether a condition is true or false.\
    \ It’s one of the most basic and essential control structures in programming,\
    \ helping direct the flow of a program. The `if` statement evaluates a boolean\
    \ expression, and if the expression is true, the code inside the `if` block is\
    \ executed. If the condition is false, the program skips the `if` block and moves\
    \ on to the next part of the code.\n\nFor example, you might use an `if` statement\
    \ to check if a user is logged in before allowing them to access a restricted\
