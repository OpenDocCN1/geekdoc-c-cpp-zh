    * * *


    Float


    What is a Float?


    A float is a data type used to store numbers with decimal points, also known as
    floating-point numbers. Floats are commonly used in programs that require calculations
    with fractional values, such as scientific or financial computations. A float
    uses 4 bytes of memory and provides up to 7 decimal digits of precision, making
    it ideal for moderate-precision calculations.


    Syntax


    float price = 9.99;


    Syntax Explanation


    To declare a floating-point number, you use the  float keyword followed by the
    variable name and a decimal number. Floats are ideal for representing prices,
    measurements, and other values requiring decimal precision. However, they have
    limited precision, meaning that calculations with very small or very large decimal
    numbers can result in rounding errors.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    float pi = 3.14;


    float radius = 5.0;


    float area = pi * radius * radius;


    cout << "The area of the circle is: " << area << endl;


    return 0;


    }


    Code Walkthrough


    In this program, the float variables  pi and  radius are declared and used to
    calculate the area of a circle. The result is stored in the variable  area and
    printed using  cout. This example demonstrates how floating-point numbers are
    used for arithmetic operations and how they can represent fractional values.


    Notes


    When working with floats, be mindful of rounding errors, especially when performing
    multiple calculations. If higher precision is required, consider using the  double
    data type. Always round float values when displaying them to ensure accurate output.


    * * *


    Double


    What is a Double?


    A double is similar to a float but provides double the precision. It is a 64-bit
    floating-point data type, allowing for up to 15 decimal digits of precision. Doubles
    are used when more accuracy is needed in calculations, such as in scientific applications
    where small differences can have significant impacts.


    Syntax


    double temperature = 98.6;


    Syntax Explanation


    To declare a double, use the  double keyword, followed by a variable name and
    a decimal value. Doubles are similar to floats but are more precise and occupy
    more memory. Use doubles for calculations requiring high precision, especially
    when dealing with very small or very large numbers. Doubles can represent values
    more accurately than floats, making them preferable in scientific or financial
    computations.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    double distance = 12345.6789;


    cout << "The distance is: " << distance << " meters." << endl;


    return 0;


    }


    Code Walkthrough


    This program demonstrates the use of a double variable to store a large decimal
    number. The variable  distance holds the value 12345.6789, which is printed using  cout.
    The double data type ensures that the value is stored and printed with high precision,
    making it suitable for accurate calculations.


    Notes


    Use doubles when calculations require more precision than floats can provide.
    However, keep in mind that double-precision arithmetic can be slower and requires
    more memory than floats, so only use it when necessary.


    * * *


    Numbers


    What are Numbers in C++?


    In C++, numbers can be integers or floating-point values, and they are used in
    almost every program for calculations, counting, or representing quantities. Numerical
    data types include  int,  float, and  double, and each serves a different purpose
    depending on the precision and size of the number required. Understanding how
    numbers are stored and used is fundamental to working with arithmetic operations
    and logic in C++.


    Syntax


    int count = 5;


    float price = 10.99;


    double distance = 123456.789;


    Syntax Explanation


    Numbers in C++ are declared using different data types depending on their size
    and precision. Integers (int) store whole numbers, while floating-point numbers
    (float and  double) store numbers with decimals. Depending on the precision required,
    you can choose the appropriate numerical data type to store your values.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int a = 10, b = 20;


    int sum = a + b;


    cout << "The sum is: " << sum << endl;


    return 0;


    }


    Code Walkthrough


    In this program, two integer variables,  a and  b, are declared and initialized.
    The program calculates the sum of the two numbers and prints the result. This
    demonstrates the use of numerical data types for arithmetic operations in C++.


    Notes


    When working with numbers, always choose the most appropriate data type for the
    task. Use  int for whole numbers,  float for moderate-precision decimal values,
    and  double for high-precision decimal values. This ensures optimal memory usage
    and accuracy.


    * * *


    Strings


    What are Strings?


    A string is a sequence of characters used to store text. In C++, the  string type
    is used to handle and manipulate strings of text, such as names, messages, or
    any sequence of characters. Strings are more complex than primitive types because
    they can vary in length and support numerous operations like concatenation, comparison,
    and substring extraction.


    Syntax


    string name = "John";


    Syntax Explanation


    To declare a string, use the  string type, followed by the variable name and the
    text you want to store in double quotes. Strings support several operations, such
    as concatenation (+), length retrieval (.length()), and comparison (==). They
    are more versatile than character arrays (char[]), which are used in lower-level
    C programming.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    string firstName = "John";


    string lastName = "Doe";


    string fullName = firstName + " " + lastName;


    cout << "Full Name: " << fullName << endl;


    return 0;


    }


    Code Walkthrough


    This program declares two string variables,  firstName and  lastName, and concatenates
    them using the  + operator. The result is stored in the variable  fullName, which
    is printed using  cout. This demonstrates how strings can be combined and manipulated
    in C++.


    Notes


    Strings in C++ provide many built-in functions for manipulation, such as finding
    the length, concatenating, or comparing strings. Always ensure your program handles
    strings correctly, especially when dealing with user input, to avoid errors or
    crashes.


