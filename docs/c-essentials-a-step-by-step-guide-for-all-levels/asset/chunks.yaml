  raw: 'C-style strings are arrays of characters, with the last character being the
    null terminator (\0). This null character indicates the end of the string. C-style
    strings are less flexible than  std::string because they don’t provide built-in
    functions for manipulation, and the size of the array is fixed at declaration.


    Manipulating C-style strings requires care with memory management, as exceeding
    the array bounds can lead to undefined behavior.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    char greeting[] = "Hello";


    cout << greeting << endl;


    return 0;


    }


    Code Walkthrough


    In this example, a C-style string is declared using the  char[] syntax. The string
    "Hello" is stored in the array, and the null character (\0) is automatically added
    at the end. The string is printed using  cout. C-style strings require more manual
    handling compared to C++ strings.


    Notes


    Avoid using C-style strings unless necessary, as they lack the flexibility and
    safety of C++ strings. Always ensure that the array is large enough to hold the
    string and the null terminator. Prefer  std::string for most string manipulations.


    * * *


    Projects


    * * *


    Project 1: Full Name Concatenation


    Description:


    Write a program that takes two strings as input (first name and last name) and
    concatenates them into a full name.


    Objective:


    Practice string concatenation and user input.


    Instructions:


    1.  Declare two  string variables for the first and last names.


    2.  Use  cin to get user input.


    3.  Concatenate the two strings into a full name.


    4.  Output the full name.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    string firstName, lastName;


    cout << "Enter your first name: ";


    cin >> firstName;


    cout << "Enter your last name: ";


    cin >> lastName;


    string fullName = firstName + " " + lastName;


    cout << "Your full name is: " << fullName << endl;


    return 0;


    }


    Code Walkthrough:


    In this program, the user is prompted to input their first and last name. The
    two strings are concatenated using the  + operator, with a space between them.
    The result is printed to the console.


    Challenge:


    Modify the program to use  getline() for full names with spaces.


    * * *


    Project 2: Character Count in a Sentence


    Description:


    Create a program that takes a sentence as input and counts the number of characters
    in the sentence.


    Objective:


    Learn to calculate the length of a string and handle multi-word input.


    Instructions:


    1.  Use  getline() to capture a full sentence as input.


    2.  Calculate the length of the sentence.


    3.  Output the character count.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    string sentence;


    cout << "Enter a sentence: ";


    getline(cin, sentence);


    cout << "The number of characters in the sentence is: " << sentence.length() <<
    endl;


    return 0;


    }


    Code Walkthrough:


    This program uses  getline() to take a full sentence as input. The  .length()
    function is then used to calculate the number of characters in the string, and
    the result is printed.


    Challenge:


    Modify the program to count only alphabetic characters, ignoring spaces and punctuation.


    * * *


    End of Chapter Checklist


    *   Understand how to declare and manipulate strings in C++.


    *   Practice string concatenation, accessing characters, and handling special
    characters.


    *   Know when to use  cin vs  getline() for input.


    * * *


    Quiz


    1.  What is the difference between  cin and  getline() for string input?


    2.  How do you concatenate two strings in C++?


    3.  What function can you use to find the length of a string?


    * * *


    Glossary


    *   String: A sequence of characters used to store text.


    *   Concatenation: Combining two or more strings into one.


    *   Escape Sequence: A special character in strings that performs a function,
    like  \n for a newline.


    *   C-Style String: A null-terminated array of characters used for strings in
    C.


    Chapter 11 C++ Math 


    * * *


    What is C++ Math?


    C++ provides a variety of built-in mathematical functions that allow programmers
    to perform complex calculations with ease. These functions are available in the  <cmath>
    library and range from basic arithmetic functions to more advanced operations
    like trigonometry, logarithms, and power functions. Whether you are calculating
    the area of a circle, determining the square root of a number, or finding the
    maximum value in a list, C++ math functions are invaluable tools for handling
    numerical computations.


    Mathematical functions in C++ ensure precision and efficiency in handling numbers.
    Common math functions include:


    *   max() and  min() for comparing values.


    *   sqrt() for square roots.


    *   pow() for exponentiation. These functions allow you to write concise, reliable
    code while avoiding the need to implement complex mathematical operations manually.
    Understanding and using the C++ math library is essential for anyone working on
    tasks involving calculations, ranging from simple to complex.


    * * *


    Max/Min


    What are Max and Min Functions in C++?


    The  max() and  min() functions in C++ are used to compare two or more values
    and return the maximum or minimum, respectively. These functions are useful in
    scenarios where you need to find the largest or smallest number in a set of values.
    For example, in statistical calculations or when managing data sets, finding the
    max or min value can be a common requirement.


    The  max() function returns the larger of two values, while  min() returns the
    smaller. Both functions are part of the  <algorithm> library and work with any
    numeric data type, including integers, floats, and doubles.


    Syntax


    The syntax for using the  max() and  min() functions is simple:


    max(a, b);


    min(a, b);


    Where  a and  b can be any numeric values.


    Syntax Explanation


    The  max() function takes two or more arguments and compares them. It returns
    the largest of the values. Similarly, the  min() function compares two or more
    values and returns the smallest. These functions are part of the  <algorithm>
    library, which must be included at the beginning of the program.


    For example:


    #include <algorithm>


    int largest = max(10, 20); // largest will be 20


    int smallest = min(5, 3); // smallest will be 3


    Both functions make comparisons efficiently, saving you from writing complex conditional
    logic to find max or min values.


    Code Example


    #include <iostream>


    #include <algorithm>


    using namespace std;


    int main() {


    int num1 = 10, num2 = 25, num3 = 15;


    int maxVal = max(max(num1, num2), num3);


    int minVal = min(min(num1, num2), num3);


    cout << "Maximum value: " << maxVal << endl;


    cout << "Minimum value: " << minVal << endl;


    return 0;


    }


    Code Walkthrough


    In this program, we declare three integers:  num1,  num2, and  num3. The  max()
    function is used twice to compare all three values and find the maximum, while
    the  min() function is similarly used to find the minimum. The results are stored
    in  maxVal and  minVal, respectively.


    The program first compares  num1 and  num2, and the result is compared with  num3
    to find the maximum of all three values. The same logic is applied for finding
    the minimum. The results are then printed using  cout.


    Notes


    When using  max() and  min(), make sure all the values you compare are of the
    same data type to avoid implicit type conversion, which may lead to unexpected
    results. These functions are efficient and ideal for finding extremes in a dataset.
    However, if you need to find the max or min of more than two values, you may need
    to nest the functions or use other algorithms like  std::max_element() or  std::min_element()
    for arrays or vectors.


    * * *


    Projects


    * * *


    Project 1: Maximum and Minimum of Three Numbers


    Description:


    Write a program that finds and prints the maximum and minimum of three numbers
    using the  max() and  min() functions.


    Objective:


    Learn to use the  max() and  min() functions for comparing multiple values.


    Instructions:


    1.  Declare three integer variables to store the input numbers.'
