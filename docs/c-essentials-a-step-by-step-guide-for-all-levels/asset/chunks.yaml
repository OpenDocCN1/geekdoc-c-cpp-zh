    - **Instance**: A specific object created from a structure that holds data for\
    \ its members.\n\n# Chapter 200. C++ Functions\n\n### What are Functions in C++?\
    \ \n\nIn C++, a function is a block of code that performs a specific task and\
    \ can be reused throughout a program. Functions help break down a program into\
    \ smaller, manageable components, improving code organization and readability.\
    \ They allow you to execute a sequence of instructions whenever needed by simply\
    \ calling the function’s name.\n\nFunctions are essential for avoiding code duplication\
    \ and enhancing modularity. Each function typically performs a single task and\
    \ can return a result to the calling code. Functions can accept inputs (called\
    \ parameters or arguments) and can return a value using the `return` statement.\
    \ Functions that don’t return a value are declared with a `void` return type.\n\
    \nUsing functions simplifies the process of debugging and maintaining code, as\
    \ changes can be made to a single function rather than across multiple places\
    \ in the program. Functions are also important for collaborative programming,\
    \ as they allow different tasks to be divided among different team members.\n\n\
    ### Syntax\n\nThe syntax for defining a function in C++ is as follows:\n\n```cpp\n\
    return_type function_name(parameters) {\n// function body\nreturn value; // if\
    \ return_type is not void\n}\n```\n\n- `return_type`: Specifies the type of value\
    \ the function will return (e.g., `int`, `float`, `void`).\n- `function_name`:\
    \ The name of the function.\n- `parameters`: The input variables passed to the\
    \ function.\n\nFor example, a simple function that adds two integers:\n\n```cpp\n\
    int add(int a, int b) {\nreturn a + b;\n}\n```\n\n### Syntax Explanation\n\n1.\
    \ `return_type`: The return type defines the data type of the value that the function\
    \ will return. For example, `int` means the function will return an integer. If\
    \ the function doesn’t return any value, it uses the `void` return type.\n2. `function_name`:\
    \ The function name should be descriptive and indicate the task it performs. Function\
    \ names follow the same rules as variable names in C++ (e.g., no spaces, starting\
    \ with a letter).\n3. `parameters`: Parameters are optional inputs provided to\
    \ the function. These inputs are variables that the function uses to perform its\
    \ task. Parameters are declared inside parentheses and can be of any valid data\
    \ type. For example, `int a, int b` are parameters for a function that adds two\
    \ integers.\n4. `function body`: The function body contains the code that performs\
    \ the function’s task. This is the block of code that gets executed when the function\
    \ is called.\n5. `return statement`: The return statement specifies the value\
    \ the function will return to the calling code. If the return type is `void`,\
    \ the function doesn’t need to return anything, and the return statement can be\
    \ omitted.\n\n### Code Example\n\nHere’s a simple C++ program demonstrating a\
    \ function that adds two numbers:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint add(int a, int b) {\nreturn a + b;\n}\n\nint main() {\nint sum =\
    \ add(3, 5);\ncout << \"The sum is: \" << sum << endl;\nreturn 0;\n}\n```\n\n\
    This program defines a function `add` that takes two integers as input and returns\
    \ their sum. The function is then called in the `main` function, and the result\
    \ is printed.\n\n### Code Walkthrough\n\n1. **Function Definition**: The function\
    \ `add(int a, int b)` is defined with two integer parameters and an `int` return\
    \ type.\n2. **Function Body**: Inside the function, the sum of `a` and `b` is\
    \ calculated and returned using the `return` statement.\n3. **Function Call**:\
    \ In the `main` function, `add(3, 5)` is called, passing 3 and 5 as arguments.\
    \ The function adds these values and returns the result.\n4. **Output**: The result,\
    \ which is the sum of 3 and 5, is stored in the variable `sum`, and it is printed\
    \ using `cout`. The output is `The sum is: 8`.\n\nThis example demonstrates how\
    \ functions help simplify repetitive tasks like adding numbers by encapsulating\
    \ them into reusable code blocks.\n\n## Function Parameters\n\n### What are Function\
    \ Parameters?\n\nFunction parameters are variables used to pass information into\
    \ a function. When a function is called, you can provide it with data (called\
    \ arguments) that the function needs to perform its task. The function processes\
    \ this data and can return a result based on the inputs.\n\nParameters are declared\
    \ in the function definition inside parentheses after the function name.\n"
  raw: '*   Structures can be passed to functions by value or reference, but passing
    by reference is more efficient for large structures.


    *   If additional functionality is needed, such as methods or member functions,
    consider using a class instead of a structure.


    *   Use structures when simple data grouping is required without the need for
    advanced features like inheritance.


    Project 1: Define a Structure for a Book


    *   Description: Write a program that defines a structure for a  Book with fields
    like title, author, and price, and prints the details of three books.


    *   Objective: Practice defining and using structures to store and display related
    data.


    *   Instructions: Create a structure called  Book, define members for  title,  author,
    and  price, and create three instances of this structure. Print the details of
    each book.


    Code:


    #include <iostream>


    using namespace std;


    struct Book {


    string title;


    string author;


    float price;


    };


    int main() {


    Book books[3] = {


    {"C++ Guide", "John Doe", 29.99},


    {"Python Essentials", "Jane Smith", 35.50},


    {"Java Fundamentals", "Alan Turing", 42.99}


    };


    for (int i = 0; i < 3; i++) {


    cout << "Book " << i+1 << " Title: " << books[i].title << endl;


    cout << "Author: " << books[i].author << endl;


    cout << "Price: $" << books[i].price << endl << endl;


    }


    return 0;


    }


    *   Code Walkthrough: The program defines a structure  Book and creates an array
    of three books. It then uses a loop to print the details of each book.


    *   Challenge: Add a new field  yearPublished and modify the program to display
    it.


    Project 2: Define a Structure for a Point


    *   Description: Create a program that defines a structure for a  Point with  x
    and  y coordinates, then calculates the distance between two points.


    *   Objective: Practice working with structures and basic mathematics in C++.


    *   Instructions: Define a structure  Point with members  x and  y. Create two
    instances of  Point and write a function to calculate the Euclidean distance between
    them.


    Code:


    #include <iostream>


    #include <cmath>


    using namespace std;


    struct Point {


    float x;


    float y;


    };


    float calculateDistance(Point p1, Point p2) {


    return sqrt(pow(p2.x - p1.x, 2) + pow(p2.y - p1.y, 2));


    }


    int main() {


    Point point1 = {3.0, 4.0};


    Point point2 = {7.0, 1.0};


    float distance = calculateDistance(point1, point2);


    cout << "Distance between points: " << distance << endl;


    return 0;


    }


    *   Code Walkthrough: The program defines a  Point structure with  x and  y coordinates.
    It calculates the distance between two points using the Euclidean distance formula
    and outputs the result.


    *   Challenge: Modify the program to calculate the distance between three points.


    End of Chapter Checklist


    *   Understand how structures group variables of different types.


    *   Practice defining structures and creating instances.


    *   Learn how to access and manipulate structure members using the dot operator.


    *   Understand how to pass structures to functions for more flexible code organization.


    Quiz


    Test your knowledge:


    1.  What is the purpose of a structure in C++?


    2.  How do you access the members of a structure?


    3.  What is the key difference between a structure and a class in C++?


    Glossary


    *   Structure (struct): A user-defined data type that groups variables of different
    types under a single name.


    *   Member: An individual variable within a structure, accessed using the dot
    operator.


    *   Dot Operator (.): Used to access the members of a structure.


    *   Instance: A specific object created from a structure that holds data for its
    members.


    Chapter 20\. C++ Functions


    What are Functions in C++? 


    In C++, a function is a block of code that performs a specific task and can be
    reused throughout a program. Functions help break down a program into smaller,
    manageable components, improving code organization and readability. They allow
    you to execute a sequence of instructions whenever needed by simply calling the
    function’s name.


    Functions are essential for avoiding code duplication and enhancing modularity.
    Each function typically performs a single task and can return a result to the
    calling code. Functions can accept inputs (called parameters or arguments) and
    can return a value using the  return statement. Functions that don’t return a
    value are declared with a  void return type.


    Using functions simplifies the process of debugging and maintaining code, as changes
    can be made to a single function rather than across multiple places in the program.
    Functions are also important for collaborative programming, as they allow different
    tasks to be divided among different team members.


    Syntax


    The syntax for defining a function in C++ is as follows:


    return_type function_name(parameters) {


    // function body


    return value; // if return_type is not void


    }


    *   return_type: Specifies the type of value the function will return (e.g.,  int,  float,  void).


    *   function_name: The name of the function.


    *   parameters: The input variables passed to the function.


    For example, a simple function that adds two integers:


    int add(int a, int b) {


    return a + b;


    }


    Syntax Explanation


    1.  return_type: The return type defines the data type of the value that the function
    will return. For example,  int means the function will return an integer. If the
    function doesn’t return any value, it uses the  void return type.


    2.  function_name: The function name should be descriptive and indicate the task
    it performs. Function names follow the same rules as variable names in C++ (e.g.,
    no spaces, starting with a letter).


    3.  parameters: Parameters are optional inputs provided to the function. These
    inputs are variables that the function uses to perform its task. Parameters are
    declared inside parentheses and can be of any valid data type. For example,  int
    a, int b are parameters for a function that adds two integers.


    4.  function body: The function body contains the code that performs the function’s
    task. This is the block of code that gets executed when the function is called.


    5.  return statement: The return statement specifies the value the function will
    return to the calling code. If the return type is  void, the function doesn’t
    need to return anything, and the return statement can be omitted.


    Code Example


    Here’s a simple C++ program demonstrating a function that adds two numbers:


    #include <iostream>


    using namespace std;


    int add(int a, int b) {


    return a + b;


    }


    int main() {


    int sum = add(3, 5);


    cout << "The sum is: " << sum << endl;


    return 0;


    }


    This program defines a function  add that takes two integers as input and returns
    their sum. The function is then called in the  main function, and the result is
    printed.


    Code Walkthrough


    1.  Function Definition: The function  add(int a, int b) is defined with two integer
    parameters and an  int return type.


    2.  Function Body: Inside the function, the sum of  a and  b is calculated and
    returned using the  return statement.


    3.  Function Call: In the  main function,  add(3, 5) is called, passing 3 and
    5 as arguments. The function adds these values and returns the result.


    4.  Output: The result, which is the sum of 3 and 5, is stored in the variable  sum,
    and it is printed using  cout. The output is  The sum is: 8.


    This example demonstrates how functions help simplify repetitive tasks like adding
    numbers by encapsulating them into reusable code blocks.


    Function Parameters


    What are Function Parameters? 


    Function parameters are variables used to pass information into a function. When
    a function is called, you can provide it with data (called arguments) that the
    function needs to perform its task. The function processes this data and can return
    a result based on the inputs.


    Parameters are declared in the function definition inside parentheses after the
    function name. When the function is called, values are passed to these parameters,
    allowing the function to work with different data each time it’s called.'
