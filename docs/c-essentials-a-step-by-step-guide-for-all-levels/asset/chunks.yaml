    Chapter 19\. C++ Structures 


    What are Structures in C++? 


    In C++, a structure (or  struct) is a user-defined data type that allows grouping
    different types of variables under one name. It is similar to a class but is primarily
    used for grouping related variables. Structures help organize complex data, allowing
    multiple related elements to be treated as a single entity. This is particularly
    useful for representing objects like books, points, or employees, where different
    attributes, such as title, author, or salary, need to be bundled together.


    Unlike arrays, which hold multiple elements of the same type, a structure can
    hold elements of different types, like integers, floats, and strings. Each element
    in a structure is called a member, and you can access them using the dot operator
    (e.g.,  myBook.title). Structures simplify the process of handling multiple variables
    that logically belong together.


    Although similar to classes, structures in C++ are generally used for simple data
    storage without the added complexity of methods or member functions. Their simplicity
    makes them an excellent choice for organizing data in smaller programs or in situations
    where complex behaviors aren’t needed.


    Syntax


    The syntax for defining and using a structure in C++ is as follows:


    struct StructureName {


    data_type member1;


    data_type member2;


    // other members


    };


    For example, here’s a structure for a  Book:


    struct Book {


    string title;


    string author;


    float price;


    };


    You can then create an instance of the structure and access its members:


    Book myBook;


    myBook.title = "C++ Guide";


    myBook.author = "John Doe";


    myBook.price = 29.99;


    Syntax Explanation


    1.  struct Keyword: The  struct keyword is used to define a new structure. It’s
    followed by the structure’s name and a block of code containing the data members.


    2.  Data Members: Inside the structure definition, you declare the data members,
    which can be of different types (e.g.,  int,  float,  string). Each member represents
    an attribute of the structure.


    3.  Creating Instances: After defining a structure, you can create instances (or
    objects) of that structure. These instances store individual sets of data that
    correspond to the structure’s layout.


    4.  Accessing Members: You access structure members using the dot operator (e.g.,  myBook.title).
    This allows you to read or modify the values stored in each member of the structure.


    Structures in C++ make it easy to group related variables under a common name,
    enhancing code organization and readability, especially when dealing with objects
    that have multiple attributes.


    Code Example


    Here’s a simple C++ program that uses a structure to store information about a
    book:


    #include <iostream>


    using namespace std;


    struct Book {


    string title;


    string author;


    float price;


    };


    int main() {


    Book myBook = {"C++ Guide", "John Doe", 29.99};


    cout << "Title: " << myBook.title << endl;


    cout << "Author: " << myBook.author << endl;


    cout << "Price: $" << myBook.price << endl;


    return 0;


    }


    This program defines a structure called  Book, creates an instance of it, and
    then prints out the book''s details.


    Code Walkthrough


    1.  Struct Definition: The structure  Book is defined with three members:  title,  author,
    and  price. Each member represents a property of a book.


    2.  Initialization: An instance of the structure,  myBook, is created and initialized
    with the title "C++ Guide," the author "John Doe," and the price  29.99.


    3.  Accessing Members: The program uses the dot operator (.) to access each member
    of the  myBook instance. This allows the program to print the values of  title,  author,
    and  price.


    4.  Output: The program prints the details of the book, demonstrating how structures
    are used to organize and access related data. The output includes the book’s title,
    author, and price.


    Notes


    When using structures in C++, consider the following best practices:


    *   Use descriptive names for both the structure and its members to make the code
    easier to read and understand.


    *   Group related variables that belong to a single entity into a structure for
    better organization and maintainability.'
