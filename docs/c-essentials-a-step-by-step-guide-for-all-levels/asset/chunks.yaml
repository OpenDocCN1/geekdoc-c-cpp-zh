    - **Parameters**: Variables passed to a function for input.

    - **Pass by Value**: A method where a copy of the variable is passed to the function.

    - **Pass by Reference**: A method where the function receives the reference to
    the original variable.


    ## Chapter 21. C++ Function Overloading


    ### What is Function Overloading?


    Function overloading in C++ is a feature that allows multiple functions to have
    the same name but different parameter types or numbers. This helps improve code
    readability and organization by letting you use a single function name for different
    operations, depending on the type or number of arguments passed.


    For example, you can have a `print()` function that prints both integers and strings,
    but uses different implementations based on the type of data. The compiler distinguishes
    between these functions based on the number and types of parameters.


    Function overloading is particularly useful when you need to perform similar tasks
    on different data types or with a varying number of arguments. Instead of creating
    separate functions like `addInt()` and `addFloat()`, you can simply overload the
    function `add()` for integers and floats. Overloading leads to cleaner, more intuitive
    code while maintaining the flexibility to handle different input types.


    Overloaded functions must differ in their parameter lists (either by the number
    of parameters or their data types), but they must share the same function name.
    However, the return type alone cannot be used to distinguish overloaded functions.


    ### Syntax


    The syntax for defining overloaded functions in C++ is as follows:


    ```cpp

    return_type function_name(parameter_list1) {

    // function body

    }


    return_type function_name(parameter_list2) {

    // function body

    }

    ```


    For example, here’s an overloaded function to add integers and floats:


    ```cpp

    int add(int a, int b) {

    return a + b;

    }


    float add(float a, float b) {

    return a + b;

    }

    ```


    Both functions have the same name, `add()`, but they take different parameter
    types.


    ### Syntax Explanation


    1. **Same Function Name**: Function overloading allows you to reuse the same function
    name for different implementations. Each overloaded version of the function has
    a unique parameter list, so the compiler can distinguish between them.

    2. **Parameter Lists**: Overloaded functions must have different parameter lists.
    This means they either differ in the number of parameters or in the data types
    of their parameters. For example, a function that accepts two integers can be
    overloaded with another function that accepts two floats.

    3. **Return Type**: While the return type can be different between overloaded
    functions, it is not sufficient for the compiler to distinguish between them.
    The differences must exist in the parameters.

    4. **Function Call Resolution**: When a function is called, the compiler determines
    which version of the overloaded function to use based on the types and numbers
    of arguments passed during the function call.


    ### Code Example


    Here’s an example of a C++ program that uses function overloading:


    ```cpp

    #include <iostream>


    using namespace std;


    int add(int a, int b) {

    return a + b;

    }


    float add(float a, float b) {

    return a + b;

    }


    int main() {

    int sum1 = add(3, 4);      // Calls the int version

    float sum2 = add(2.5f, 3.5f); // Calls the float version

    cout << "Sum of integers: " << sum1 << endl;

    cout << "Sum of floats: " << sum2 << endl;

    return 0;

    }

    ```


    ### Code Walkthrough


    1. **Overloaded Functions**: The program defines two overloaded functions `add()`.
    The first version accepts two `int` parameters, and the second version accepts
    two `float` parameters.

    2. **Function Calls**: In the `main()` function, the compiler calls the appropriate
    version of `add()` based on the argument types passed. For the integer arguments
    `3` and `4`, the `int` version is called, and for the float arguments `2.5f` and
    `3.5f`, the `float` version is called.

    3. **Output**: The program prints two different sums based on the function calls:
    the sum of integers (7) and the sum of floats (6.0).


    This example shows how the compiler automatically selects the correct overloaded
    function based on the argument types provided.


    ### Notes


    When using function overloading, consider these best practices:


    - Make sure the overloaded functions perform logically related operations, as
    overloading can confuse readers if unrelated tasks are grouped under the same
    function name.

    - Overload functions based on meaningful differences in parameters, such as data
    types or number of parameters, rather than relying on vague distinctions.

    - Avoid overloading functions if it makes the code harder to understand. In some
    cases, using a different function name can make the code clearer.

    - Be cautious when overloading with implicit type conversions, as the compiler
    might choose an unintended function version.


    ### Project 1: Overload a Function to Find the Sum of Integers and Floats


    - **Objective**: Write a program that overloads a function to find the sum of
    two integers and two floats.

    - **Instructions**: Create two versions of a function named `sum()`. One should
    take two integers as input, and the other should take two floats. Each function
    should return the sum of its parameters.


    **Code**:


    ```cpp

    #include <iostream>


    using namespace std;


    int sum(int a, int b) {

    return a + b;

    }


    float sum(float a, float b) {

    return a + b;

    }


    int main() {

    int result1 = sum(5, 10);      // Calls the int version

    float result2 = sum(2.5f, 3.5f); // Calls the float version

    cout << "Sum of integers: " << result1 << endl;

    cout << "Sum of floats: " << result2 << endl;

    return 0;

    }

    ```


    - **Code Walkthrough**: The program defines two overloaded functions `sum()`,
    one for integers and one for floats. In `main()`, the appropriate version of `sum()`
    is called based on the argument types, and the results are printed.

    - **Challenge**: Modify the program to handle three arguments and overload the
    function again to find the sum of three integers and three floats.


    ### Project 2: Overload a Function to Calculate the Area of a Circle and Rectangle


    - **Objective**: Create a program that overloads a function to calculate the area
    of a circle (using the radius) and a rectangle (using length and width).

    - **Instructions**: Write two versions of a function named `area()`. One version
    should take a single parameter (the radius) and calculate the area of a circle.
    The other version should take two parameters (length and width) and calculate
    the area of a rectangle.


    **Code**:


    ```cpp

    #include <iostream>


    using namespace std;


    const float PI = 3.14159;


    // Overloaded function to calculate area of a circle

    float area(float radius) {

    return PI * radius * radius;

    }


    // Overloaded function to calculate area of a rectangle

    float area(float length, float width) {

    return length * width;

    }


    int main() {

    float circleArea = area(5.0f);      // Calls the circle version

    float rectangleArea = area(4.0f, 6.0f); // Calls the rectangle version

    cout << "Area of the circle: " << circleArea << endl;

    cout << "Area of the rectangle: " << rectangleArea << endl;

    return 0;

    }

    ```


    - **Code Walkthrough**: The program defines two overloaded `area()` functions:
    one that calculates the area of a circle using the radius, and one that calculates
    the area of a rectangle using the length and width. The program then calls each
    function in `main()` based on the number of arguments passed.

    - **Challenge**: Extend the program to include an overloaded function that calculates
    the area of a triangle (using base and height).


    ### End of Chapter Checklist


    - Understand what function overloading is and how it improves code organization.

    - Practice writing overloaded functions that handle different types or numbers
    of arguments.

    - Learn how the compiler distinguishes between overloaded functions based on parameter
    types or the number of arguments.

