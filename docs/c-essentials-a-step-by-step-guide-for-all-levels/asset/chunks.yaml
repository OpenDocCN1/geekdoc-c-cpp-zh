    \n*   This time, the program will prompt the user to enter their name, and it\
    \ will print a personalized message based on the input.\n\nCommon Errors and Debugging\
    \ Tips\n\n*   Compiler Errors: If there’s a typo or missing syntax (e.g., forgetting\
