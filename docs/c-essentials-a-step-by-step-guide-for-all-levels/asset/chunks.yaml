    Chapter  9 C++ Operators


    * * *


    What are Operators in C++?


    Operators in C++ are symbols used to perform operations on variables and values.
    They allow you to manipulate data and perform actions like arithmetic calculations,
    comparisons, or logical operations. Operators are crucial in every C++ program,
    as they enable you to process and transform data. C++ provides a variety of operators,
    each serving a unique purpose.


    Operators can be categorized into different types, such as arithmetic, assignment,
    comparison, and logical operators. For example, arithmetic operators help in performing
    calculations like addition or multiplication, while comparison operators are used
    for evaluating conditions, such as checking if two numbers are equal. Understanding
    operators and how they work is essential for writing functional and efficient
    C++ programs.


    * * *


    Arithmetic


    What is Arithmetic in C++?


    Arithmetic operators in C++ are used to perform basic mathematical operations
    on numerical data. These operators allow you to add, subtract, multiply, divide,
    and find the remainder of numbers. Arithmetic operations form the foundation of
    many programming tasks, such as financial calculations, game development, and
    data analysis.


    C++ provides the following arithmetic operators:


    *   + for addition


    *   - for subtraction


    *   * for multiplication


    *   / for division


    *   % for modulo (remainder)


    Syntax


    The syntax for using arithmetic operators is straightforward:


    int result = a + b;


    result = a - b;


    result = a * b;


    result = a / b;


    result = a % b;


    Here,  a and  b are numerical variables, and the operators perform the corresponding
    arithmetic operation on them.


    Syntax Explanation


    When using arithmetic operators, it''s important to understand operator precedence
    and associativity. Operator precedence determines the order in which operations
    are performed. For example, multiplication and division have higher precedence
    than addition and subtraction. So, in an expression like  a + b * c, the multiplication
    (b * c) is performed before the addition (a +).


    Associativity defines the direction in which operators of the same precedence
    are evaluated. For most arithmetic operators, associativity is left to right,
    meaning operations are evaluated from left to right in the case of equal precedence.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int a = 10, b = 3;


    cout << "Addition: " << a + b << endl;


    cout << "Subtraction: " << a - b << endl;


    cout << "Multiplication: " << a * b << endl;


    cout << "Division: " << a / b << endl;


    cout << "Modulo: " << a % b << endl;


    return 0;


    }


    Code Walkthrough


    In this program, the variables  a and  b are initialized with values of 10 and
    3, respectively. The program performs all basic arithmetic operations: addition,
    subtraction, multiplication, division, and modulo, using arithmetic operators.
    Each result is printed to the console using  cout.


    The program first adds  a and  b using the  + operator and prints the result.
    The same process is repeated for subtraction (-), multiplication (*), and division
    (/). The modulo operator (%) calculates the remainder when  a is divided by  b.


    Notes


    When performing division with integers, be aware that C++ truncates the decimal
    part and returns an integer result. To perform floating-point division, at least
    one operand must be a floating-point number (e.g.,  float or  double). Always
    ensure that the divisor in a division operation is not zero to avoid runtime errors.


    * * *


    Assignment


    What is an Assignment Operator?


    Assignment operators in C++ are used to assign values to variables. The basic
    assignment operator (=) is used to store a value or the result of an expression
    in a variable. C++ also provides compound assignment operators, which combine
    arithmetic operations with assignment. For example,  += adds a value to a variable
    and then assigns the result back to the same variable.


    Common assignment operators include:


    *   = for assignment


    *   += for addition assignment


    *   -= for subtraction assignment


    *   *= for multiplication assignment


    *   /= for division assignment


    Syntax


    The syntax for using assignment operators is simple:


    a = 10;  // Assigns 10 to a


    a += 5;  // Adds 5 to a and assigns the result to a


    a -= 2;  // Subtracts 2 from a and assigns the result to a


    Syntax Explanation


    The  = operator assigns a value to a variable. For example,  a = 10; assigns the
    value 10 to the variable  a. The compound assignment operators (like  +=,  -=,
    etc.) perform both an arithmetic operation and assignment. For example,  a +=
    5; adds 5 to the current value of  a and stores the result in  a.


    Compound operators are shorthand for common arithmetic operations combined with
    assignment. For example,  a += 5; is equivalent to  a = a + 5;. These operators
    make code more concise and easier to read.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int a = 10;


    a += 5;


    cout << "After addition: " << a << endl;


    a *= 2;


    cout << "After multiplication: " << a << endl;


    return 0;


    }


