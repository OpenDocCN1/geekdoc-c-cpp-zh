- fmt: "\n## 2. Object-Oriented Programming\nC++ supports object-oriented principles\
    \ like inheritance, encapsulation, and polymorphism, enabling developers to create\
    \ modular and reusable code. This makes managing large codebases easier and reduces\
    \ redundancy.\n\n## 3. Cross-Platform Development\nC++ is platform-independent,\
    \ meaning code can be compiled and run on various operating systems like Windows,\
    \ Linux, and macOS. This makes it highly useful for cross-platform software development.\n\
    \n## 4. Large Ecosystem and Libraries\nWith the Standard Template Library (`STL`)\
    \ and many third-party libraries, C++ makes it easier to implement data structures\
    \ and algorithms efficiently, reducing development time for complex operations.\n\
    \n***\n\n## Difference Between C and C++\n\nWhile C++ is derived from C, the two\
    \ languages have significant differences:\n\n### 1. Programming Paradigm\n- C\
    \ is purely procedural, meaning it focuses on functions and step-by-step procedures.\n\
    - C++ supports both procedural and object-oriented programming, which allows developers\
    \ to work with objects and organize code using `classes`.\n\n### 2. Memory Management\n\
    - In C, memory management is done manually using `malloc()` and `free()`.\n- C++\
    \ offers automatic memory management through constructors and destructors as well\
    \ as using the `new` and `delete` operators for dynamic memory allocation.\n\n\
    ### 3. Standard Library\n- C++ includes the Standard Template Library (`STL`),\
    \ which provides reusable data structures like `vectors`, `lists`, and algorithms,\
    \ which make development faster and less error-prone.\n- C does not have built-in\
    \ support for such advanced libraries and relies on manual implementations of\
    \ data structures.\n\n### 4. Object-Oriented Support\n- C++ allows `classes`,\
    \ inheritance, and polymorphism, making it easier to model complex systems by\
    \ simulating real-world entities.\n- C uses `structs`, which group data together\
    \ but do not support methods or object-oriented principles like inheritance.\n\
    \n***\n\n## End of Chapter Checklist\n- Understand the basic structure and use\
    \ of C++ in programming.\n- Learn why C++ is preferred in performance-critical\
    \ applications.\n- Review the major differences between C and C++, especially\
    \ regarding memory management, libraries, and object-oriented support.\n- Become\
    \ familiar with key C++ concepts like object-oriented programming and `STL`.\n\
    \n***\n\n## Quiz\n1. What is the primary difference between C and C++ regarding\
    \ programming paradigms?\n2. How does C++ handle memory management differently\
    \ from C?\n3. Why is C++ suitable for cross-platform development?\n4. What is\
    \ the Standard Template Library (`STL`) used for in C++?\n\n***\n\n## Glossary\n\
    - **Object-Oriented Programming (OOP)**: A programming paradigm that organizes\
    \ software design around data (objects) and the operations (methods) that can\
    \ be performed on them.\n- **Procedural Programming**: A programming approach\
    \ focused on sequences of instructions (procedures) that execute step by step.\n\
    - **Standard Template Library (STL)**: A powerful library in C++ that provides\
    \ common data structures like `vectors`, `lists`, and algorithms.\n- **Memory\
    \ Management**: The process of allocating and freeing memory during a program's\
    \ execution, handled manually in C but automated in C++.\n\n# Chapter 2 C++ Get\
    \ Started\n\n## C++ Install IDE\nBefore you can start writing and running C++\
    \ programs, you need to install an Integrated Development Environment (IDE). An\
    \ IDE is a software application that provides a comprehensive environment for\
    \ writing, testing, and debugging code. There are several IDEs available for C++\
    \ development, each offering different features. Here are some popular choices:\n\
    \n1. **Visual Studio (Windows/Mac)**:\n   - Microsoft Visual Studio is a powerful\
    \ IDE that supports C++ and other languages. It offers features like code suggestions,\
    \ debugging tools, and project management.\n   - Download from: [Visual Studio](https://visualstudio.microsoft.com/).\n\
    \   - Installation: Once downloaded, run the installer and select the Desktop\
    \ development with C++ option to install the necessary tools and compilers.\n\n\
    2. **Code::Blocks (Windows/Linux/Mac)**:\n   - Code::Blocks is a free, open-source\
    \ IDE that is easy to set up and lightweight.\n   - Download from: Code::Blocks.\n\
    \   - Installation: Download the installer package with `MinGW` (which includes\
    \ the C++ compiler) and follow the installation prompts.\n\n3. **CLion (Windows/Linux/Mac)**:\n\
    \   - CLion by JetBrains is a modern, feature-rich IDE that supports refactoring,\
    \ code analysis, and version control integration.\n   - Download from: [CLion](https://www.jetbrains.com/clion/).\n\
    \   - Installation: After downloading, follow the setup wizard to install CLion\
    \ and the required C++ toolchain.\n\n4. **Xcode (Mac only)**:\n   - Xcode is the\
    \ official IDE for macOS and supports C++, Swift, and other languages.\n   - Download\
    \ from: the App Store or [Apple's Developer website](https://developer.apple.com/xcode/).\n\
    \   - Installation: After installation, open Xcode and set up a C++ project by\
    \ selecting C++ as the language.\n\n**Choosing an IDE**: If you’re a beginner,\
    \ Code::Blocks or Visual Studio is a great place to start. They are easy to install\
    \ and set up. Advanced users might prefer CLion for its robust features or Xcode\
    \ for macOS development.\n\n***\n\n## C++ Quickstart\nOnce you have an IDE installed,\
    \ you’re ready to write your first C++ program. Follow these steps to create a\
    \ simple C++ project and write a basic \"Hello, World!\" program to get started.\n\
    \n### Step 1: Create a New Project\n1. Open your IDE (e.g., Visual Studio, Code::Blocks,\
    \ or CLion).\n2. Create a new project: In the IDE, look for an option like \"\
    New Project.\"\n3. Select Console Application: Choose C++ Console Application\
    \ from the project types. This will create a simple project template for a command-line\
    \ program.\n4. Name your project: Give your project a meaningful name like `HelloWorld`\
    \ and choose a location to save it.\n\n### Step 2: Write Your First Program\n\
    Every C++ program has a `main` function, which serves as the entry point. Let’s\
    \ write a simple program that prints \"Hello, World!\" to the screen.\n\n```cpp\n\
    #include <iostream> // This is a library that allows input and output\n\nint main()\
    \ { // The main function is the starting point of any C++ program\n    std::cout\
    \ << \"Hello, World!\" << std::endl; // This prints \"Hello, World!\" to the screen\n\
    \    return 0; // Return 0 means the program executed successfully\n}\n```\n\n\
    ### Explanation of Code\n- `#include <iostream>`: This line includes the iostream\
    \ library, which provides functionality for input and output streams. Without\
    \ it, you cannot print text to the console.\n- `int main()`: This defines the\
    \ `main` function, which is the starting point of execution.\n- `std::cout`: This\
