    \ Modify the program to keep prompting the user for valid input until a correct\
    \ integer is entered.\n\n# End of Chapter Checklist\n\n- Understand the concept\
    \ of exceptions and how they are used for error handling in C++.\n- Learn how\
    \ to use `try`, `throw`, and `catch` to handle errors gracefully.\n- Practice\
    \ writing programs that handle exceptions such as division by zero or invalid\
    \ user input.\n- Know how to structure programs to avoid crashes and manage errors\
    \ in a controlled way.\n\n# Quiz\n\n1. What is the purpose of the `throw` keyword\
    \ in C++?\n2. How does a `catch` block work, and what does it handle?\n3. When\
    \ should you use exceptions in C++?\n\n# Glossary\n\n- **Exception**: An error\
    \ or unexpected event that occurs during program execution.\n- **throw**: A keyword\
    \ used to signal that an exception has occurred.\n- **try-catch block**: A mechanism\
    \ to catch and handle exceptions in C++.\n- **Error Handling**: Techniques used\
    \ to handle errors and exceptions in a controlled manner, preventing the program\
    \ from crashing.\n\n# Chapter 26. C++ Date\n\n## What is Date and Time Handling\
    \ in C++?\n\nIn C++, handling date and time is crucial for many applications,\
    \ such as timestamping, logging, scheduling, and calculating durations. C++ provides\
    \ built-in support for date and time through two primary libraries: `ctime` and\
    \ `chrono`.\n\nThe `ctime` library offers functions for working with system time\
    \ in the form of calendar dates and time in a traditional way. It allows you to\
    \ get the current time, format it into a readable string, and manipulate time-related\
    \ information. Functions like `time()`, `localtime()`, and `strftime()` allow\
    \ developers to retrieve the system time and display it in different formats.\n\
    \n`Chrono`, introduced in C++11, provides a more modern and flexible approach\
    \ to handling dates and times. It includes features for working with time durations,\
    \ time points, and high-resolution clocks. `Chrono` is particularly useful when\
    \ you need precise control over time intervals, perform calculations between time\
    \ points, or measure execution time.\n\nUnderstanding how to work with dates and\
    \ times in C++ is essential for managing real-world tasks that rely on accurate\
    \ time measurements, scheduling, and record keeping.\n\n## Syntax\n\nThe syntax\
    \ for working with date and time in C++ involves using the `ctime` or `chrono`\
    \ libraries:\n\n```cpp\n#include <ctime>\n#include <chrono>\n#include <iostream>\n\
    \nusing namespace std;\n\ntime_t currentTime = time(0);             // Get current\
    \ system time\ntm *localTime = localtime(&currentTime); // Convert to local time\
    \ structure\nauto start = chrono::high_resolution_clock::now(); // Get the current\
    \ time point\n```\n\nIn `ctime`, `time_t` holds the time, and `tm` holds the date\
    \ and time information. In `chrono`, you use clocks and time points for precise\
    \ time calculations.\n\n### Syntax Explanation\n\n1. **ctime library**: The `ctime`\
    \ library provides functions to work with system time:\n   - `time(0)` returns\
    \ the current system time in seconds since the Unix epoch (January 1, 1970).\n\
    \   - `localtime()` converts the time to a more readable format as a `tm` structure,\
    \ which includes fields like year, month, day, hour, minute, and second.\n   -\
    \ `strftime()` formats the time into a string for display.\n\n2. **chrono library**:\
    \ The `chrono` library provides tools for working with high-resolution clocks\
    \ and time intervals:\n   - `chrono::high_resolution_clock::now()` returns a time\
    \ point representing the current time.\n   - `chrono::duration_cast` converts\
    \ the time duration into different units, such as seconds or milliseconds, for\
    \ calculations or measurements.\n   - The `chrono` library is more suited for\
    \ precise time measurements and managing time intervals between events.\n\nBoth\
    \ libraries allow you to retrieve, manipulate, and display date and time, but\
    \ `chrono` is more suitable for precise time calculations and measurements.\n\n\
    ## Code Example\n\nHere’s an example that prints the current date and time using\
    \ `ctime`:\n\n```cpp\n#include <iostream>\n#include <ctime>\n\nusing namespace\
    \ std;\n\nint main() {\n    time_t currentTime = time(0);\n    tm *localTime =\
    \ localtime(&currentTime);\n    cout << \"Current Date and Time: \" << asctime(localTime);\n\
    \    return 0;\n}\n```\n\nThis program retrieves the current system time, converts\
    \ it into a readable format using `localtime()`, and prints the result using `asctime()`.\n\
    \n### Code Walkthrough\n\n1. `time(0)`: This function returns the current time\
    \ in seconds since the Unix epoch (January 1, 1970). The value is stored in the\
    \ `currentTime` variable of `time_t`.\n2. `localtime()`: The `localtime()` function\
    \ takes the system time and converts it to the local time zone, returning a `tm`\
    \ structure. This structure contains detailed information such as the current\
    \ year, month, day, hour, minute, and second.\n3. `asctime()`: The `asctime()`\
    \ function takes the `tm` structure and converts it into a human-readable string\
    \ that represents the current date and time.\n4. **Output**: The program prints\
    \ the current date and time in the format: \"Day Month Date Time Year,\" such\
    \ as \"Thu Sep 30 10:20:30 2024.\"\n\nThis simple example demonstrates how to\
    \ retrieve and display the current date and time in C++ using the `ctime` library.\n\
    \n## Notes\n\nBest practices for working with date and time in C++ include:\n\n\
    - Use `chrono` for precise time measurements, such as performance benchmarking\
    \ or interval timing.\n- Always check if the system’s time functions return valid\
    \ values, especially when working with dates.\n- Use `strftime()` from `ctime`\
    \ for formatting time output in custom formats, such as \"YYYY-MM-DD\" or \"HH:MM\"\
    .\n- Handle different time zones carefully, as `localtime()` converts system time\
    \ to the local time zone, which may vary across different environments.\n- For\
    \ modern applications requiring flexibility or high precision, prefer `chrono`\
    \ over `ctime`.\n\n# Project 1: Print the Current Date and Time\n"
