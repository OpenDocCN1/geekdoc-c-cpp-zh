    * Iterate over the vector and print each mark.\n\n### Code\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n\nint main() {\n  std::vector<int> marks = {85,\
    \ 90, 78, 92};\n\n  for (int mark : marks) {\n    std::cout << mark << std::endl;\n\
    \  }\n\n  return 0;\n}\n```\n\n## Code Walkthrough\n\nThis program initializes\
    \ a vector with four student marks. It then uses a `for` loop to iterate through\
    \ the vector and print each mark to the console.\n\n## Challenge\n\nEnhance the\
    \ program by allowing the user to input the student marks instead of hardcoding\
