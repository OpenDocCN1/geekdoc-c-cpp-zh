    Chapter 13 C++ If...Else Statements


    * * *


    What is the If Statement?


    An if statement in C++ is a conditional statement that allows your program to
    make decisions based on whether a condition is true or false. It’s one of the
    most basic and essential control structures in programming, helping direct the
    flow of a program. The if statement evaluates a boolean expression, and if the
    expression is true, the code inside the if block is executed. If the condition
    is false, the program skips the if block and moves on to the next part of the
    code.


    For example, you might use an if statement to check if a user is logged in before
    allowing them to access a restricted page. If the condition (logged in status)
    is true, they proceed. If not, they are redirected to the login page. If statements
    are used whenever decisions or choices need to be made in a program, making them
    fundamental in creating dynamic, responsive software.


    * * *


    Syntax


    The basic syntax for an if statement looks like this:


    if (condition) {


    // Code to execute if condition is true


    }


    For example:


    if (age >= 18) {


    cout << "You are an adult." << endl;


    }


    * * *


    Syntax Explanation


    The if statement begins with the keyword  if followed by a condition inside parentheses.
    The condition must evaluate to either true or false. If the condition is true,
    the code block inside the curly braces  {} is executed. If the condition is false,
    the program skips that block of code.


    The condition can be any valid expression that results in a boolean value. Common
    conditions involve comparison operators like  ==,  !=,  >,  <,  >=, and  <=. For
    example,  if (age >= 18) checks if  age is greater than or equal to 18\. If this
    is true, the code inside the if block will run.


    * * *


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int age;


    cout << "Enter your age: ";


    cin >> age;


    if (age >= 18) {


    cout << "You are an adult." << endl;


    }


    return 0;


    }


    * * *


    Code Walkthrough


    In this example, the user is prompted to enter their age. The input is stored
    in the variable  age. The if statement checks if the value of  age is greater
    than or equal to 18\. If the condition is true, the message "You are an adult"
    is printed. If the condition is false (age is less than 18), the program skips
    the if block and moves to the next part of the code (in this case, it ends the
    program). This example demonstrates how if statements help control the flow of
    the program based on user input.


    * * *


    Else/Else If


    What is Else and Else If?


    In C++, else and else if are used in conjunction with if statements to create
    additional branches in decision-making. While the if statement handles the first
    condition, else if is used to test additional conditions if the first condition
    is false. If none of the conditions in the if and else if statements are true,
    the else block is executed as a fallback.


    For instance, if you want to categorize a person’s age into child, teenager, or
    adult, you would use multiple conditions. The if statement checks the first condition
    (e.g., age < 13), the else if checks another condition (e.g., age < 18), and else
    handles anything that doesn’t match the previous conditions (e.g., age >= 18).


    These branching structures are key in creating programs that need to make multiple
    decisions based on different inputs or situations.


    * * *


    Syntax


    The syntax for else and else if looks like this:


    if (condition1) {


    // Code to execute if condition1 is true


    } else if (condition2) {


    // Code to execute if condition2 is true


    } else {


    // Code to execute if all conditions are false


    }


    * * *


    Syntax Explanation


    The  else if statement allows you to check another condition if the original if
    statement’s condition evaluates to false. If  condition1 is false, the program
    moves to  condition2 inside the else if block. You can chain multiple else if
    statements to handle different scenarios. The final  else block catches any case
    where none of the conditions are true.


    For example:


    if (age < 13) {


    cout << "You are a child.";


    } else if (age < 18) {


    cout << "You are a teenager.";


    } else {


    cout << "You are an adult.";


    }


    In this code, the program checks the first condition. If it’s false, it moves
    to the next, and finally, if none are true, it executes the else block.


    * * *


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int age;


    cout << "Enter your age: ";


    cin >> age;


    if (age < 13) {


    cout << "You are a child." << endl;


    } else if (age < 18) {


    cout << "You are a teenager." << endl;


    } else {


    cout << "You are an adult." << endl;


    }


    return 0;


    }


    * * *


    Code Walkthrough


    This example categorizes the user based on their age. If the user’s age is less
    than 13, the program prints "You are a child." If the first condition is false
    but the age is less than 18, the program prints "You are a teenager." If neither
    condition is true (meaning the age is 18 or older), the else block prints "You
    are an adult." This demonstrates how to use else if and else to handle multiple
    conditions and provide different outputs based on user input.


    * * *


    Notes


    When using multiple if-else statements, ensure your conditions are structured
    logically. Always start with the most specific condition and work towards the
    more general ones. Avoid overusing else if statements, as this can lead to complex,
    hard-to-read code. In some cases, using switch statements or loops might be more
    appropriate, depending on the logic of your program.


    * * *


    Short Hand (Ternary) Operator


    What is the Short Hand (Ternary) Operator?'
