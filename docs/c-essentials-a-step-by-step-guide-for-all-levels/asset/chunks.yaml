    ## Chapter 18. C++ Arrays


    ### What are Arrays in C++?


    In C++, an array is a collection of elements, all of the same data type, stored
    in contiguous memory locations. Arrays provide a way to store multiple values
    in a single variable, allowing programmers to access and manipulate data efficiently.
    Arrays are useful when dealing with a fixed number of elements where each element
    can be accessed by its index.


    Arrays in C++ are static, meaning their size must be defined when they are declared,
    and cannot be changed afterward. Each element in an array is assigned a unique
    index, starting from 0 for the first element. For example, if an array has 5 elements,
    they can be accessed using indexes 0 through 4. Arrays are stored in contiguous
    memory, which allows fast access to each element via its index.


    However, arrays in C++ have limitations. Since they are static, the size must
    be known at compile time. Additionally, arrays don’t have built-in methods for
    common tasks like finding the length, sorting, or inserting elements, which must
    be handled manually by the programmer.


    ### Syntax


    The syntax for declaring and initializing arrays in C++ is as follows:


    `data_type array_name[size];`


    For example, declaring an integer array with 5 elements:


    `int numbers[5];`


    You can also initialize the array at the time of declaration:


    `int numbers[5] = {1, 2, 3, 4, 5};`


    * `data_type`: The type of elements in the array (e.g., `int`, `float`).

    * `array_name`: The name of the array.

    * `size`: The number of elements in the array.


    ### Syntax Explanation


    1. `data_type`: This defines the type of elements the array will hold, such as
    `int` for integers, `float` for floating-point numbers, or `char` for characters.

    2. `array_name`: The array''s identifier, used to reference the array throughout
    the program.

    3. `size`: This indicates the total number of elements the array will store. For
    example, `int numbers[5];` reserves memory for 5 integers. The size must be a
    constant expression, meaning it must be known at compile time.


    Arrays can be initialized during declaration by assigning values in curly braces,
    as in `int numbers[5] = {1, 2, 3, 4, 5};`. The size of the array can also be omitted
    when initializing, like `int numbers[] = {1, 2, 3, 4, 5};`, and the compiler will
    automatically determine the size based on the number of elements provided.


    ### Code Example


    Here’s an example program that demonstrates how to use an array in C++:


    ```cpp

    #include <iostream>


    using namespace std;


    int main() {


    int numbers[5] = {1, 2, 3, 4, 5};


    for (int i = 0; i < 5; i++) {


    cout << "Element at index " << i << ": " << numbers[i] << endl;

    }


    return 0;


    }

    ```


    This program initializes an array with five integers and uses a loop to print
    each element along with its index.


    ### Code Walkthrough


    1. **Initialization**: The array `numbers` is initialized with 5 integers: 1,
    2, 3, 4, and 5.

    2. **Loop**: A `for` loop is used to iterate over each element of the array. The
    loop starts from index 0 and runs up to index 4, since the array contains 5 elements
    (indexes 0 through 4).

    3. **Accessing Elements**: During each iteration, the element at the current index
    is accessed using `numbers[i]`, where `i` is the index of the element. This allows
    the program to print the value and its position in the array.

    4. **Output**: The program outputs the value of each element in the array along
    with its corresponding index, demonstrating how arrays store and retrieve multiple
    values.


    ## Arrays and Loops


    ### What are Arrays and Loops?


    Arrays and loops work together seamlessly in C++. Since arrays are collections
    of elements, loops are ideal for iterating through them. Instead of accessing
    each array element individually, a loop allows you to perform operations on every
    element efficiently.


    For example, if you have an array of 100 integers, writing separate statements
    to process each element would be tedious. With a loop, you can access each element
    efficiently.


    Arrays and loops are commonly used together for tasks such as:

    * Summing elements in an array.

    * Finding the maximum or minimum value in an array.

    * Sorting or modifying array elements.


    ### Syntax


    The syntax for using arrays with loops is as follows:


    ```cpp

    for (int i = 0; i < size; i++) {

    // Access elements using the index

    cout << array_name[i] << " ";

    }

    ```


    * `i`: The loop control variable that represents the index of the array.

    * `size`: The total number of elements in the array.


    For example, to print all elements of an array:


    ```cpp

    for (int i = 0; i < 5; i++) {

    cout << numbers[i] << " ";

    }

    ```


    ### Syntax Explanation


    1. **Loop Initialization**: The loop begins with `i = 0`, initializing the index
    variable `i`. This controls which element of the array is accessed during each
    iteration.

    2. **Condition**: The loop continues as long as `i < size`, where `size` is the
    total number of elements in the array. This ensures that the loop doesn’t attempt
    to access an index beyond the array''s bounds.

    3. **Iteration**: The iteration step `i++` increments the index variable `i` after
    each loop cycle, allowing the loop to move to the next element in the array.

    4. **Accessing Array Elements**: Inside the loop, elements of the array are accessed
    using `array_name[i]`. This retrieves the element at the index `i` for each iteration.


    Loops provide a concise and efficient way to process arrays, making it easy to
    manipulate large datasets with minimal code.


    ### Code Example


    Here’s a program that uses a loop to calculate the sum of elements in an array:


    ```cpp

    #include <iostream>


    using namespace std;


    int main() {


    int numbers[5] = {10, 20, 30, 40, 50};


    int sum = 0;


    for (int i = 0; i < 5; i++) {


    sum += numbers[i];

    }


    return 0;


    }

    ```

