    }


    Syntax Explanation


    Comparison operators return a boolean value that indicates the relationship between
    two variables or expressions. For example,  a == b returns  true if  a and  b
    are equal, and  false if they are not. Similarly,  a > b returns  true if  a is
    greater than  b, and  false otherwise.


    These operators are often used in conditions for  if statements, loops, and other
    decision-making constructs to control the flow of the program based on the results
    of comparisons.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int a = 10, b = 20;


    if (a < b) {


    cout << "a is less than b" << endl;


    } else {


    cout << "a is greater than or equal to b" << endl;


    }


    return 0;


    }


    Code Walkthrough


    In this program, two integer variables  a and  b are initialized with values of
    10 and 20, respectively. The program uses the comparison operator  < to check
    if  a is less than  b. If the condition is  true, the message "a is less than
    b" is printed. If the condition is  false, the  else block executes, printing
    "a is greater than or equal to b".


    This demonstrates how comparison operators help in decision-making based on the
    values of variables.


    Notes


    When using comparison operators, ensure that you are comparing values of compatible
    data types. Also, be mindful of using  == for comparison rather than  = for assignment.
    Mixing these up can lead to logical errors in your program.


    * * *


    Logical


    What are Logical Operators?


    Logical operators in C++ are used to combine or invert conditions in decision-making
    statements. They are typically used with boolean expressions and are fundamental
    in controlling the flow of complex programs. Logical operators allow you to evaluate
    multiple conditions at once, such as checking if both conditions are true, or
    if at least one condition is true.


    Common logical operators include:


    *   && (AND) – True if both operands are true


    *   || (OR) – True if at least one operand is true


    *   ! (NOT) – Inverts the boolean value


    Syntax


    The syntax for logical operators looks like this:


    if (a > 0 && b > 0) {


    // Both conditions are true


    }


    Syntax Explanation


    Logical operators are typically used to evaluate multiple conditions within a
    single  if or  while statement. The  && operator ensures that both conditions
    must be true for the result to be true. The  || operator requires that at least
    one condition must be true. The  ! operator inverts the boolean value, making  true
    into  false and vice versa.


    For example, if you want to check if both  a and  b are positive, you would use
    the  && operator. If you want to check if either  a or  b is positive, you would
    use the  || operator.


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int a = 5, b = -3;


    if (a > 0 && b > 0) {


    cout << "Both a and b are positive" << endl;


    } else {


    cout << "At least one of a or b is non-positive" << endl;


    }


    return 0;


    }


    Code Walkthrough


    In this example,  a and  b are checked using the  && operator to see if both values
    are positive. Since  b is negative, the condition  a > 0 && b > 0 is false, and
    the  else block executes, printing "At least one of a or b is non-positive." This
    demonstrates how the logical AND (&&) operator ensures that both conditions must
    be true for the entire expression to evaluate as true.


    Notes


    When combining logical conditions, ensure that each condition is meaningful and
    contributes to the overall logic. Avoid over-complicating conditions with unnecessary
    logical operators. Also, remember that the  ! operator can invert boolean expressions,
    which is helpful in certain situations, such as checking for a false condition.


    * * *


    Projects


    * * *


    Project 1: Basic Arithmetic Operations


    Description:


    Write a program that takes two numbers as input and performs addition, subtraction,
    multiplication, and division.


    Objective:


    Understand how to use arithmetic operators to manipulate data.


    Instructions:


    1.  Declare two variables to store the user input.


    2.  Perform all four basic arithmetic operations.


    3.  Print the results.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    float num1, num2;


    cout << "Enter two numbers: ";


    cin >> num1 >> num2;


    cout << "Addition: " << num1 + num2 << endl;


    cout << "Subtraction: " << num1 - num2 << endl;


    cout << "Multiplication: " << num1 * num2 << endl;


    cout << "Division: " << num1 / num2 << endl;


    return 0;


    }


    Code Walkthrough:


    In this program, the user is prompted to enter two numbers, which are stored in
    the variables  num1 and  num2. The program then performs the four basic arithmetic
    operations: addition (+), subtraction (-), multiplication (*), and division (/).
    Each result is printed to the console using  cout. The division operation works
    as long as  num2 is not zero, as dividing by zero would result in an error.


    This example demonstrates how arithmetic operators are used to process input data
    and perform calculations in a C++ program.


    Challenge:


    Modify the program to include error handling for the division operation, ensuring
    that division by zero is handled gracefully.


    * * *


    Project 2: Comparing Two Numbers


    Description:


    Create a program that compares two numbers and prints whether they are equal,
    or if one is greater than the other.


    Objective:


    Practice using comparison operators to evaluate conditions in C++.


    Instructions:


    1.  Declare two integer variables for user input.


    2.  Use comparison operators (==,  >,  <) to compare the numbers.


    3.  Print appropriate messages for each comparison result.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    int num1, num2;


    cout << "Enter two integers: ";


    cin >> num1 >> num2;


    if (num1 == num2) {


    cout << "The numbers are equal." << endl;


    } else if (num1 > num2) {


    cout << num1 << " is greater than " << num2 << endl;


    } else {


    cout << num1 << " is less than " << num2 << endl;


    }


    return 0;


    }


    Code Walkthrough:


    In this program, two integers are taken as input from the user. The program then
    uses the comparison operators  ==,  >, and  < to determine the relationship between
    the two numbers. If the numbers are equal, a message is printed indicating so.
    If the first number is greater than the second, the program prints that  num1
    is greater. Otherwise, it prints that  num1 is less than  num2.


    This demonstrates how to use comparison operators to control the flow of a program
    based on user input.


    Challenge:


    Enhance the program to handle the case where the user inputs the same number more
    than once and provide feedback if that happens.


    * * *


    End of Chapter Checklist


    *   Understand the different types of operators in C++: arithmetic, assignment,
    comparison, and logical.


    *   Be able to use operators to perform basic calculations, comparisons, and logical
    evaluations.


    *   Know how to write and run programs that incorporate multiple operators.


    * * *


    Quiz


    1.  What is the difference between the  = and  == operators in C++?


    2.  What does the  && operator do in C++?


    3.  How would you write an expression that checks if a number is greater than
    10 and less than 20?


    * * *


    Glossary


    *   Operator: A symbol that tells the compiler to perform a specific mathematical,
    logical, or comparison operation.


    *   Arithmetic Operator: Operators like  +,  -,  *,  /, and  % used to perform
    basic math.


    *   Assignment Operator: Used to assign values to variables, such as  = or  +=.


    *   Comparison Operator: Operators used to compare two values, such as  ==,  !=,  >,  <.


    *   Logical Operator: Operators like  &&,  ||, and  ! that combine or invert boolean
    expressions


