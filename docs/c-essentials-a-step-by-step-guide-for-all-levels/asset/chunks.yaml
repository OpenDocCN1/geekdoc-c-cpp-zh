    \ `cin` 一次获取多个变量的输入？\n3. 如何从用户处获取全名（包括空格）？\n\n***\n\n***\n\n# 词汇表\n* `cin`: 用于从用户处输入的输入流对象。\n\
    * `Input stream`（输入流）: 从外部源（如键盘）流入程序的数据流。\n* `getline`: 一个用于捕捉整行文本（包括空格）的函数。\n\
    \n# 第 8 章 C++ 数据类型\n\n***\n\n## C++ 中的数据类型是什么？\nC++ 中的数据类型定义了变量可以存储什么类型的值，以确保内存被高效利用。每种数据类型都决定了在内存中分配多少空间来存储数据，以及可以对该数据执行哪些操作。例如，整数的存储方式与浮点数不同，字符的存储方式也与字符串不同。选择正确的数据类型对于创建高效且功能程序至关重要。\n\
    \nC++ 中的数据类型可以分为基本类型（如 `int`、`float`、`char` 和 `bool`）以及更复杂的类型（如字符串和数组）。理解数据类型有助于开发者有效管理内存，并在计算或数据处理过程中避免错误。它们还定义了值取范围的边界以及数据的精度。\n\
    \n***\n\n## 布尔型（Boolean）\n\n### 什么是布尔值？\n布尔数据类型（`bool`）代表真或假的值，这在决策和逻辑判断中是基础性的。在\
    \ C++ 中，`bool` 可以包含两个值：`true`（用 1 表示）或 `false`（用 0 表示）。布尔值用于条件语句（如 `if`、`else`）以控制程序的流，并根据某些条件做出判断。例如，布尔值可以检查一个数字是否大于另一个数字，或者用户是否已登录。\n\
    \n### 语法\n```cpp\nbool isTrue = true;\nbool isFalse = false;\n```\n\n### 语法解释\n\
    在 C++ 中，你使用关键字 `bool` 声明一个布尔变量。可以使用 `true` 或 `false` 进行初始化。布尔值通常用于条件逻辑，例如 `if`\
    \ 语句，在语句中你评估会导致真或假结果的条件。例如：\n```cpp\nbool isAdult = (age >= 18);\n```\n这段代码检查一个人是否为成年人，如果年龄满\
    \ 18 岁或以上则存储 `true`，否则存储 `false`。\n\n### 代码示例\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\nint main() {\n    bool isRaining = false;\n    if (isRaining)\
    \ {\n        cout << \"Take an umbrella!\" << endl;\n    } else {\n        cout\
    \ << \"No umbrella needed!\" << endl;\n    }\n    return 0;\n}\n```\n\n### 代码解读\n\
    在这个程序中，布尔变量 `isRaining` 被初始化为 `false`。一个 `if` 语句检查 `isRaining` 是否为 `true`。如果是，程序打印“Take\
    \ an umbrella!”。否则，打印“No umbrella needed!”。这演示了布尔值如何影响程序逻辑和决策。\n\n### 注意事项\n使用布尔值时，记住\
    \ `true` 等同于 1，而 `false` 等同于 0。\n\n***\n\n***\n\n## 字符型（Char）\n\n### 什么是字符？\n\
    `char` 数据类型代表单个字符。它可以存储一个字母、数字或符号，且仅占用 1 字节内存。字符以 ASCII 值的形式存储。\n\n### 语法\n```cpp\n\
    char letter = 'A';\nchar digit = '3';\n```\n\n### 语法解释\n在 C++ 中，你使用 `char` 关键字声明字符，并用单引号包裹字符。例如，`'A'`\
    \ 的值为 65。\n\n### 代码示例\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    int main() {\n    char grade = 'A';\n    cout << \"Your grade is: \" << grade\
    \ << endl;\n    return 0;\n}\n```\n\n### 代码解读\n在示例中，变量 `grade` 被声明为 `char` 并初始化为\
    \ `'A'`。程序随后使用 `cout` 打印成绩。这演示了如何存储和显示单个字符。\n\n### 注意事项\n处理字符时，请注意大写和小写字母的区别，因为它们的\
    \ ASCII 值不同。始终对字符使用单引号，避免对字符串使用它们。\n\n***\n\n***\n\n## 整数型（Int）\n\n### 什么是整数？\n\
    整数（`int`）是不带小数的整数，可以是正负数。整数是 C++ 中常用的数据类型之一，允许你执行计数、索引和算术操作。在 C++ 中，`int` 的大小通常为\
    \ 4 字节，允许它存储从约 -20 亿到 20 亿之间的值。\n\n### 语法\n```cpp\nint number = 10;\n```\n\n###\
    \ 语法解释\n要声明整数，你使用 `int` 关键字，后跟变量名。你可以为变量分配一个整数值。整数可以用于加、减、乘、除等算术运算。\n\n### 代码示例\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    int a\
    \ = 5, b = 10;\n    int sum = a + b;\n    cout << \"The sum is: \" << sum << endl;\n\
    \    return 0;\n}\n```\n\n### 代码解读\n\n"
