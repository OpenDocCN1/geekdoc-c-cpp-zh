    \ with key-value pairs.\n\n### Instructions\n\n* Create a map with string keys\
    \ (names) and integer values (ages).\n* Add several key-value pairs to the map.\n\
    * Iterate over the map and display each name with its associated age.\n\n### Code\n\
    \n```cpp\n#include <iostream>\n#include <map>\n\nint main() {\n  std::map<std::string,\
