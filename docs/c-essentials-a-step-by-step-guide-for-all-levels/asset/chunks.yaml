    ## 章节结束检查清单\n\n*   理解数组如何在连续内存中存储和访问元素。\n*   练习使用循环处理数组。\n*   编写执行诸如求和或查找数组最大元素等操作的程序。\n\
    \n## 测验\n\n测试你的知识：\n\n1. 结构体如何访问 `arr`？\n2. 结构体超出边界时会发生什么？\n3. 如何使用循环处理结构体？\n\n\
    ## 术语表\n\n*   **数组**：在连续内存中存储的相同类型元素的集合。\n*   **索引**：数组中元素的位置。\n*   **循环**：用于重复执行代码块的结构。\n\
    \n## 第 19 章：C++ 结构体\n\n### 什么是结构体？\n\n在 C++ 中，结构体（struct）是一种将不同类型的变量组合在一起的自定义数据类型。它允许你将相关数据打包在一起，以便在函数之间传递时更加方便。\n\
    \n### 语法\n\n定义结构体的语法如下：\n\n```cpp\nstruct 结构名 {\n    数据类型 成员 1;\n    数据类型 成员 2;\n\
    };\n```\n\n例如，定义一个名为 `Book` 的结构：\n\n```cpp\nstruct Book {\n    string title;\n\
    \    string author;\n    float price;\n};\n```\n\n### 使用结构体\n\n一旦定义了结构体，你可以创建它的实例并使用点运算符访问其成员：\n\
    \n```cpp\nBook myBook;\nmyBook.title = \"C++ Guide\";\nmyBook.author = \"John\
    \ Doe\";\nmyBook.price = 29.99;\n```\n\n### 详细说明\n\n*   **`struct` 关键字**：用于声明一个结构体类型。\n\
    *   **成员**：结构体内部定义的变量。\n*   **实例**：根据结构体类型创建的变量（如 `myBook`）。\n*   **点运算符 (`.`)**：用于访问结构体实例的成员。\n\
    \n### 示例代码\n\n下面是一个使用结构体存储存储信息的简单 C++ 程序：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nstruct Book {\n    string title;\n    string author;\n   \
    \ float price;\n};\n\nint main() {\n    // 使用初始化列表创建\n    Book myBook = {\"C++\
    \ Guide\", \"John Doe\", 29.99};\n\n    cout << \"Title: \" << myBook.title <<\
    \ endl;\n    cout << \"Author: \" << myBook.author << endl;\n    cout << \"Price:\
    \ $\" << myBook.price << endl;\n\n    return 0;\n}\n```\n\n此程序定义了一个名为 `Book` 的结构体，创建了它的实例，然后打印了书的详细信息。\n\
    \n"
