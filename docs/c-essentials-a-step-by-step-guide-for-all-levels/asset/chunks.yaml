    ***\n\n## 练习\n1. `float` 和 `double` 之间的区别是什么？\n2. 如何声明布尔变量？\n3. 你可以使用什么函数来拼接两个字符串？\n\
    \n***\n\n## 术语表\n* **数据类型 (Data Type)**：定义变量可以持有的值类型，例如整数、浮点数或字符串。\n* **布尔 (Boolean)**：存储真或假值的数据类型。\n\
    * **字符 (Char)**：存储单个字符的数据类型。\n* **浮点数 (Float)**：存储带小数的浮点数。\n\n# 第 9 章 C++ 运算符\n\
    \n## 什么是 C++ 运算符？\nC++ 中的运算符是用于对变量和值执行操作的符号。它们允许你处理数据并执行如算术计算、比较或逻辑操作等操作。运算符在每个\
    \ C++ 程序中至关重要，因为它们让你能够处理和转换数据。C++ 提供了多种运算符，每种都有独特的用途。\n\n运算符可以分为不同的类型，例如算术、赋值、比较和逻辑运算符。例如，算术运算符有助于执行加法或乘法等计算，而比较运算符用于评估条件，例如检查两个数字是否相等。理解运算符及其工作原理对于编写功能且高效的\
    \ C++ 程序至关重要。\n\n***\n\n## 算术\n\n### C++ 中的算术运算是什么？\nC++ 中的算术运算符用于对数值数据执行基础数学运算。这些运算符允许你对数字进行加、减、乘、除和求余数运算。算术运算构成了许多编程任务的基础，例如财务计算、游戏开发和数据分析。\n\
    \nC++ 提供了以下算术运算符：\n* `+` 用于加法\n* `-` 用于减法\n* `*` 用于乘法\n* `/` 用于除法\n* `%` 用于取模（余数）\n\
    \n### 语法\n使用算术运算符的语法非常简单：\n```cpp\nint result = a + b;\nresult = a - b;\nresult\
    \ = a * b;\nresult = a / b;\nresult = a % b;\n```\n在这里，`a` 和 `b` 是数值变量，运算符对它们执行相应的算术运算。\n\
    \n### 语法解释\n在使用算术运算符时，理解运算符的优先级和结合性非常重要。运算符优先级决定了操作执行的顺序。例如，乘法和除法的优先级高于加法和减法。因此，在\
    \ `a + b * c` 这样的表达式中，乘法 `(b * c)` 在加法 `(a +)` 之前执行。\n\n结合性定义了相同优先级运算符评估的方向。对于大多数算术运算符，结合性是从左到右，这意味着在优先级相等的情况下，操作从左到右评估。\n\
    \n### 代码示例\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\nint a = 10, b = 3;\n  cout << \"Addition: \" << a + b << endl;\n  cout <<\
    \ \"Subtraction: \" << a - b << endl;\n  cout << \"Multiplication: \" << a * b\
    \ << endl;\n  cout << \"Division: \" << a / b << endl;\n  cout << \"Modulo: \"\
    \ << a % b << endl;\n  return 0;\n}\n```\n\n### 代码解析\n在此程序中，变量 `a` 和 `b` 分别初始化为\
    \ 10 和 3。程序使用算术运算符执行所有基础算术运算：加、减、乘、除和取模。每个结果都使用 `cout` 输出到控制台。\n\n程序首先使用 `+` 运算符将\
    \ `a` 和 `b` 并打印结果。减法（`-`）、乘法（`*`）和除法（`/`）重复同样的过程。取模运算符 `%` 计算 `a` 除以 `b` 的余数。\n\
    \n### 注意事项\n在对整数进行除法时，请注意 C++ 会截断小数部分并返回整数结果。要执行浮点数除法，至少一个操作数必须是浮点数（例如 `float`\
    \ 或 `double`）。务必确保除法运算中的除数不为零，以避免运行时错误。\n\n***\n\n## 赋值\n\n### 什么是赋值运算符？\nC++\
    \ 中的赋值运算符用于给变量赋值。基础赋值运算符 `=` 用于将值或表达式的结果存储在变量中。C++ 还提供了复合赋值运算符，它将算术运算与赋值结合起来。例如，`+=`\
    \ 给变量增加一个值，然后将结果赋值回同一变量。\n\n常见的赋值运算符包括：\n* `=` 用于赋值\n* `+=` 用于加法赋值\n* `-=` 用于减法赋值\n\
    * `*=` 用于乘法赋值\n* `/=` 用于除法赋值\n\n### 语法\n使用赋值运算符的语法非常简单：\n```cpp\na = 10; // 将\
    \ 10 赋值给 a\na += 5; // 给 a 加 5 并赋值\na -= 2; // 从 a 减去 2 并赋值\n```\n\n### 语法解释\n\
    `=` 运算符将值赋值给变量。例如 10。\n复合赋值运算符（如 `+=`、`-=` 等）执行算术运算并赋值。例如，`a += 5;` 将 `a` 的当前值加上\
    \ 5。这些运算符让代码更简洁。\n\n### 代码示例\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\nint a = 10;\n  a += 5;\n  cout << \"After addition: \" << a <<\
    \ endl;\n  a *= 2;\n  cout << \"After multiplication: \" << a << endl;\n  return\
    \ 0;\n}\n```\n\n### 代码解析\n在此程序中，变量 `a` 初始化为 10。程序首先使用加法赋值运算符 `+=` 将 `a` 加 5，将其值变为\
    \ 15。使用 `cout` 输出新值。接下来，使用乘法赋值运算符 `*=` 将 `a` 乘以 2，将其值变为 30。\n\n### 注意事项\n在使用赋值运算符时，确保左侧的变量在应用运算符之前已初始化。此外，确保你正在为任务使用正确的运算符。复合赋值运算符可以简化代码，但务要检查它们是否引入了意外副作用。\n\
    \n***\n\n## 比较\n\n### 什么是比较运算符？\nC++ 中的比较运算符用于比较两个值。这些运算符根据比较结果返回布尔值（真或假）。比较运算符常用于决策和条件语句，如\
    \ `if`、`while` 或 `for` 循环。它们有助于判断程序是否满足某些条件。\n\n比较运算符包括：\n* `==` 用于相等\n* `!=`\
    \ 用于不相等\n* `>` 大于\n* `<` 小于\n* `>=` 大于等于\n* `<=` 小于等于\n\n### 语法\n比较运算符的语法非常简单：\n\
    ```cpp\nif (a == b) {\n```\n\n"
- fmt: "\n```cpp\n// Do something if a is equal to b\n\n}\n```\n\n## Syntax Explanation\n\
    \nComparison operators return a boolean value that indicates the relationship\
    \ between two variables or expressions. For example, `a == b` returns `true` if\
    \ `a` and `b` are equal, and `false` if they are not. Similarly, `a > b` returns\
    \ `true` if `a` is greater than `b`, and `false` otherwise.\n\nThese operators\
    \ are often used in conditions for `if` statements, loops, and other decision-making\
    \ constructs to control the flow of the program based on the results of comparisons.\n\
    \n## Code Example\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main() {\n    int a = 10, b = 20;\n\n    if (a < b) {\n        cout << \"a is\
    \ less than b\" << endl;\n    } else {\n        cout << \"a is greater than or\
    \ equal to b\" << endl;\n    }\n\n    return 0;\n}\n```\n\n## Code Walkthrough\n\
    \nIn this program, two integer variables `a` and `b` are initialized with values\
    \ of `10` and `20`, respectively. The program uses the comparison operator `<`\
    \ to check if `a` is less than `b`. If the condition is `true`, the message \"\
    a is less than b\" is printed. If the condition is `false`, the `else` block executes,\
    \ printing \"a is greater than or equal to b\".\n\nThis demonstrates how comparison\
    \ operators help in decision-making based on the values of variables.\n\n## Notes\n\
    \nWhen using comparison operators, ensure that you are comparing values of compatible\
    \ data types. Also, be mindful of using `==` for comparison rather than `=` for\
    \ assignment. Mixing these up can lead to logical errors in your program.\n\n\
    ***\n\n## Logical\n\n### What are Logical Operators?\n\nLogical operators in C++\
    \ are used to combine or invert conditions in decision-making statements. They\
    \ are typically used with boolean expressions and are fundamental in controlling\
    \ the flow of complex programs. Logical operators allow you to evaluate multiple\
    \ conditions at once, such as checking if both conditions are true, or if at least\
    \ one condition is true.\n\nCommon logical operators include:\n\n* `&&` (AND)\
    \ – True if both operands are true\n* `||` (OR) – True if at least one operand\
    \ is true\n* `!` (NOT) – Inverts the boolean value\n\n### Syntax\n\nThe syntax\
    \ for logical operators looks like this:\n\n```cpp\nif (a > 0 && b > 0) {\n  \
    \  // Both conditions are true\n}\n```\n\n### Syntax Explanation\n\nLogical operators\
    \ are typically used to evaluate multiple conditions within a single `if` or `while`\
    \ statement. The `&&` operator ensures that both conditions must be true for the\
    \ result to be true. The `||` operator requires that at least one condition must\
    \ be true. The `!` operator inverts the boolean value, making `true` into `false`\
    \ and vice versa.\n\nFor example, if you want to check if both `a` and `b` are\
    \ positive, you would use the `&&` operator. If you want to check if either `a`\
    \ or `b` is positive, you would use the `||` operator.\n\n### Code Example\n\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    int a\
    \ = 5, b = -3;\n\n    if (a > 0 && b > 0) {\n        cout << \"Both a and b are\
    \ positive\" << endl;\n    } else {\n        cout << \"At least one of a or b\
    \ is non-positive\" << endl;\n    }\n\n    return 0;\n}\n```\n\n### Code Walkthrough\n\
    \nIn this example, `a` and `b` are checked using the `&&` operator to see if both\
    \ values are positive. Since `b` is negative, the condition `a > 0 && b > 0` is\
