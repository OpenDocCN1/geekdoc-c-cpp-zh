  trans: "\n\n- 确保通过 RAII（资源获取初始化）或智能指针，在发生异常后确保资源（例如文件、内存）被正确清理。\n- 记录函数可能抛出的异常，以便函数用户知道可能会遇到哪些错误。\n\
    \n# 项目 1：带异常处理两个数的除法\n\n- **目标**：编写一个程序对两个数字除法，并使用 `try-catch` 块处理除以零的情况。\n- **指令**：创建一个接收两个数字输入的程序，执行除法，并使用\
    \ `try-catch` 块处理除以零。\n\n代码：\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\n    int num1, num2;\n    cout << \"Enter two numbers: \";\n  \
    \  cin >> num1 >> num2;\n    try {\n        if (num2 == 0) {\n            throw\
    \ \"Division by zero error!\";\n        }\n        cout << \"Result: \" << num1\
    \ / num2 << endl;\n    } catch (const char* msg) {\n        cout << \"Error: \"\
    \ << msg << endl;\n    }\n    return 0;\n}\n```\n- **代码解析**：该程序提示用户输入两个数字，检查第二个数字是否为零，如果是，则抛出异常。`catch`\
    \ 块处理除以零错误并打印错误信息。\n- **挑战**：扩展程序以处理不同类型的异常，例如无效输入。\n\n# 项目 2：使用异常处理无效的用户输入\n\n\
    - **目标**：创建一个程序从用户处读取一个整数，如果用户输入了无效数据则处理异常。\n- **指令**：编写一个程序，提示用户输入整数，并使用 `try-catch`\
    \ 块处理无效输入（例如非数字字符）。\n\n代码：\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\n    try {\n        int number;\n        cout << \"Enter an integer:\
    \ \";\n        if (!(cin >> number)) {\n            throw \"Invalid input! Not\
    \ an integer.\";\n        }\n        cout << \"You entered: \" << number << endl;\n\
    \    } catch (const char* msg) {\n        cout << \"Error: \" << msg << endl;\n\
    \    }\n    return 0;\n}\n```\n- **代码解析**：程序尝试读取一个整数输入。如果输入不是整数，则抛出异常。`catch`\
    \ 块通过打印错误信息处理异常。\n- **挑战**：修改程序，持续提示用户输入有效内容，直到输入正确的整数。\n\n# 本章结束清单\n\n- 理解异常的概念以及它们在\
    \ C++ 中如何被用于错误处理。\n- 学习如何使用 `try`、`throw` 和 `catch` 来优雅地处理错误。\n- 练习编写处理异常的程序，如除以零或无效的用户输入。\n\
    - 了解如何构建程序以避免崩溃并以控制的方式管理错误。\n\n# 测验\n\n1. C++ 中 `throw` 关键字的目的是什么？\n2. `catch`\
    \ 块是如何工作的，它处理什么？\n3. 在 C++ 中你应该在什么时候使用异常？\n\n# 术语表\n\n- **异常 (Exception)**：在程序执行过程中发生的错误或意外事件。\n\
    - **throw**：用于信号异常已发生的关键字。\n- **try-catch 块**：在 C++ 中捕获并处理异常的机制。\n- **错误处理 (Error\
    \ Handling)**：用于以受控方式处理错误和异常的技术，防止程序崩溃。\n\n# 第 26 章 C++ 日期\n\n## 什么是 C++ 中的日期和时间处理？\n\
    \n在 C++ 中，处理日期和时间对于许多应用程序至关重要，例如时间戳、日志、调度和计算时长。C++ 通过两个主要库对日期和时间提供了内置支持：`ctime`\
    \ 和 `chrono`。\n\n`ctime` 库提供了以日历日期形式和传统方式处理系统时间的函数。它允许你获取当前时间、将其格式化为可读字符串，并操作与时间相关的信息。如\
    \ `time()`、`localtime()` 和 `strftime()` 等函数允许开发者检索系统时间并以不同的格式显示。\n\n`Chrono` 引入自\
    \ C++11，提供了一种更现代、更灵活的日期时间处理方法。它包含了处理时间持续、时间点和高分辨率时钟的功能。当你需要对时间间隔进行精确控制、在时间点之间进行计算或测量执行时间时，`Chrono`\
    \ 特别有用。\n\n理解如何在 C++ 中处理日期和时间，对于管理依赖准确时间测量、调度和记录的现实世界任务至关重要。\n\n## 语法\n\n在 C++\
    \ 中处理日期时间的语法涉及使用 `ctime` 或 `chrono` 库：\n\n```cpp\n#include <ctime>\n#include <chrono>\n\
    #include <iostream>\n\nusing namespace std;\n\ntime_t currentTime = time(0); \
    \            // 获取当前系统时间\ntm *localTime = localtime(&currentTime); // 转换为本地时间结构\n\
    auto start = chrono::high_resolution_clock::now(); // 获取当前时间点\n```\n\n在 `ctime`\
    \ 中，`time_t` 保存时间，`tm` 存储日期和时间信息。在 `chrono` 中，你使用时钟和时间点进行精确的时间计算。\n\n### 语法说明\n\
    \n1. **ctime 库**：`ctime` 库提供了处理系统时间的函数：\n   - `time(0)` 返回自 Unix 纪（1970 年 1 月\
    \ 1 日）以来秒数的当前系统时间。\n   - `localtime()` 将时间转换为更可读的 `tm` 结构体格式，该结构包含了年、月、日、时、分、秒等字段。\n\
    \   - `strftime()` 将时间格式化为字符串以便显示。\n\n2. **chrono 库**：`chrono` 库提供了处理高分辨率时钟和时间间隔的工具：\n\
    \   - `chrono::high_resolution_clock::now()` 返回一个表示当前时间的时间点。\n   - `chrono::duration_cast`\
    \ 将时间持续转换为不同的单位（如秒或毫秒），用于计算或测量。\n   - `chrono` 库更适合精确的时间测量和管理事件之间的时间间隔。\n\n两个库都允许你检索、操作和显示日期与时间，但\
    \ `chrono` 更适合精确的时间计算和测量。\n\n## 代码示例\n\n这是一个使用 `ctime` 打印当前日期和时间的示例：\n\n```cpp\n\
    #include <iostream>\n#include <ctime>\n\nusing namespace std;\n\nint main() {\n\
    \    time_t currentTime = time(0);\n    tm *localTime = localtime(&currentTime);\n\
    \    cout << \"Current Date and Time: \" << asctime(localTime);\n    return 0;\n\
    }\n```\n\n该程序获取当前系统时间，使用 `localtime()` 将其转换为本地格式，并使用 `asctime()` 进行打印。\n\n###\
    \ 代码解析\n\n1. `time(0)`：此函数返回自 Unix 纪（1970 年 1 月 1 日）以来的秒数。存储在 `time_t` 类型变量 `currentTime`\
    \ 中。\n2. `localtime()`：`localtime()` 函数获取系统时间并转换为本地时区，返回一个 `tm` 结构。该结构包含了年、月、日、时、分、秒详细信息。\n\
    3. `asctime()`：`asctime()` 函数将 `tm` 结构转换为表示当前日期的可读字符串。\n4. **输出**：程序以“星期 月 日 时间\
    \ 年”的格式打印当前日期和时间，例如“Thu Sep 30 10:20:30 2024”。\n\n这个简单的示例演示了如何使用 `ctime` 库在 C++\
    \ 中获取和显示当前日期。\n\n## 注意事项\n\n处理日期时间的最佳实践包括：\n\n- 使用 `chrono` 进行精确的时间测量，例如性能测试或间隔计时。\n\
    - 始终检查系统时间函数是否返回有效值，特别是在处理日期时。\n- 使用 `ctime` 中的 `strftime()` 以自定义格式输出时间字符串，例如“YYYY-MM-DD”或“HH:MM”。\n\
    - 仔细处理不同的时区，因为 `localtime()` 将系统时间转换为本地时区，这在不同环境中可能会不同。\n- 对于需要灵活性或高精度的现代应用程序，优先选择\
    \ `chrono` 而非 `ctime`。\n\n# 项目 1：打印当前日期和时间\n\n"
