    # C++ 核心：全方位阶步进式指南


    第一版

    面向所有人的 C++ 简化教程

    Sarful Hassan


    ## 前言


    欢迎阅读 `C++ 核心：全方位阶步进式指南`。本书旨在帮助你掌握 `C++` 编程的基础知识，并引导你进入更高级的话题领域。无论你是初学者，还是在其他语言方面具有编程经验的人士，本指南都将为你提供编写高效且结构良好的
    `C++` 代码所需的知识。


    ### 本书适用读者


    本书适用于以下群体：


    *   **初学者**：如果你是编程的新手，或者刚刚开始学习 `C++`，本书将以简单且易于理解的方式向你介绍核心概念。

    *   **中级程序员员**：对于具有某些编程经验的人来说，本书将帮助巩固你对 `C++` 语法、数据结构和算法的理解。

    *   **资深开发者**：如果你熟悉其他语言，本指南将帮助你快速学习 `C++` 的特定特性，包括面向对象编程 (`OOP`)、标准模板库 (`STL`)
    以及更多高级技术。


    ### 本书的结构


    本书结构设计为 `C++` 的循序渐进，每一章都建立在前章的基础上。以下是快速概述：


    1.  第 1–7 章：`C++` 基础、语法、输入/输出、变量和数据类型的导论。

    2.  第 8–13 章：涵盖运算符、控制流和条件语句。

    3.  第 14–18 章：重点关注循环、数组和更复杂的控制机制。

    4.  第 19–23 章：介绍面向对象编程 (`OOP`)、类、结构体和函数重载。

    5.  第 24–28 章：讨论文件处理、异常、数据结构和算法等高级话题。


    ### 未涵盖的内容


    本书涵盖了 `C++` 的核心概念，但没有深入探讨以下小众领域：


    *   除基础指针和引用之外的低级内存管理。

    *   高级 `C++` 库和外部包。

    *   游戏开发或 `C++` 的其他特定领域用途。


    这些话题虽然很重要，但在更专门的资源中会有更好的阐述。


    ### 代码风格（关于代码）


    代码风格的一致性对于确保可读性和维护性至关重要。在本书中使用了以下约定：


    *   缩进：每个块级两个空格。

    *   命名：变量和函数遵循 `camelCase`（驼峰命名）。常量使用全大写 `ALL_CAPS`。

    *   注释：使用内联注释来解释代码的重要部分，而块注释则放置在函数或类的开头以描述其用途。


    ### 更新说明


    本版本已更新，以反映最新的 `C++` 标准和最佳实践。它包含了与 `C++17` 和 `C++20` 兼容的示例，重点关注结构化绑定、`std::optional`
    以及其他现代新增特性。


    ### 关于第一版的说明


    本书的第一版侧重于提供 `C++` 编程的实战指南，面向绝对初学者。在这一版中，我们扩大了范围，包含了如标准模板库 (`STL`)、异常处理和算法等更高级的话。


    ### 本书使用的约定


    全书使用了以下约定：


    *   **粗体**：用于突出显示重要概念或新术语。

    *   *斜体*：用于对某些短语强调。

    *   `等宽字体`：用于代码段、文件名和命令。


    ### 使用代码示例


    请自由使用书中提供的代码示例用于你的个人或学术项目。如果你将大段代码整合到你自己的项目中，请注明适当的出处。


    所有示例均可从我们的网站 `MechatronicsLAB.net` 下载。代码编写格式与大多数 IDE 和编译器兼容。


