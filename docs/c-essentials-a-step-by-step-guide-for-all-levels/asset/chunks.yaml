    \n## 注意事项\n\n在 C++ 中处理数组工作时，请记住以下最佳实践：\n\n*   确保遵守数组边界，以避免访问无效内存，这可能导致崩溃或意外行为。\n\
    *   使用循环对数组元素进行高效处理。\n*   考虑在声明数组时进行初始化，以避免使用未初始的数据。\n*   如果数组的大小在编译时未知，请考虑使用动态数组或\
    \ `std::vector` 等容器以获得更大的灵活性。\n*   注意 C++ 数组的局限性，例如固定大小以及缺乏用于常用操作的内置函数。\n\n##\
    \ 项目 1：数组数字求和\n\n*   **描述**：编写一个程序，接收 5 个数字作为输入，将其存储在数组中，并打印这些数字的和。\n*   **目标**：练习数组声明、输入处理和循环。\n\
    *   **指令**：使用 `for` 循环遍历数组，为每个元素获取输入并计算总和。\n\n### 代码\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n\n    int numbers[5];\n    int sum = 0;\n\
    \n    for (int i = 0; i < 5; i++) {\n        cout << \"Enter number \" << i +\
