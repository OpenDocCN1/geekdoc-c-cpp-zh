  trans: "\n\n- 确保每个函数都执行逻辑上相关的任务，以避免混淆的重载。\n\n## 测验\n1. 什么是函数重载？\n2. 编译器如何决定调用哪个重载函数？\n\
    3. 两个重载函数可以具有相同的参数类型但不同的返回类型？\n\n## 术语表\n* **函数重载 (Function Overloading)**：一种允许定义多个同名但参数列表不同的函数的特性。\n\
    * **参数列表 (Parameter List)**：函数接受的参数列表。重载函数必须在参数的数量或类型上有所不同。\n* **编译器 (Compiler)**：将\
    \ C++ 代码翻译成机器码的软件。它根据传递的参数类型来决定使用哪个版本的重载函数。\n\n## 第 22 章 C++ 作用域\n\n### 什么是 C++\
    \ 作用域？\n在 C++ 中，变量的作用域定义了变量在程序中可以被访问或使用的位置。作用域决定了变量的可见性和寿命，这对于管理内存、避免冲突以及确保程序逻辑正确运行至关重要。\n\
    \nC++ 中有三种主要的作用域：\n* **局部作用域 (Local Scope)**：在函数或块内部声明的变量是该函数或块的局部变量。它们只能在该特定区域内访问，并在函数或块执行完毕后被销毁。\n\
    * **全局作用域 (Global Scope)**：在所有函数外部声明的变量是全局变量。它们可以在程序的任何地方访问，因此对于需要在多个函数之间共享的值非常有用。\n\
    * **静态作用域 (Static Scope)**：静态变量在函数调用之间保留其值，尽管它对函数是局部的。这意味着它在程序的生命周期内持续存在，但仅在函数内部可见。\n\
    \n理解作用域对于高效管理内存以及避免由无意访问或覆盖变量而引起的错误至关重要。\n\n### 语法\n以下是在 C++ 中定义不同作用域变量的方式：\n\n\
    ```cpp\nint globalVar = 10; // 全局作用域\n\nvoid exampleFunction() {\n    int localVar\
    \ = 5; // 局部作用域\n    static int staticVar = 0; // 静态作用域\n}\n```\n\n* 全局变量声明在任何函数外部，使其在整个程序中均可访问。\n\
    * 局部变量声明在函数或块内部，且只能在该作用域内访问。\n* 静态变量在函数调用之间保留其值并贯穿整个程序，尽管它们的可见性仍然局限于函数。\n\n###\
    \ 语法说明\n1. **局部作用域**：在函数或块（如循环或条件）内部声明的变量具有局部作用域。它们只能在声明它们的函数或块中访问，并在函数或块执行完毕后被销毁。例如，`int\
    \ localVar = 5;` 只能在 `exampleFunction` 中访问。\n2. **全局作用域**：全局变量声明在所有函数之外，通常位于程序的开头。这些变量可以被任何函数访问，允许在整个程序共享数据。例如，`int\
    \ globalVar = 10;` 可以在程序的任何地方使用。\n3. **静态作用域**：静态变量在函数调用之间保留其值。它们只初始化一次，并在程序的生命周期内持续存在中，尽管它们的可见性局限于函数。例如，`exampleFunction`\
    \ 中的 `static int staticVar = 0;` 在函数调用之间保持其值。\n\n### 代码示例\n这是一个演示不同作用域的简单 C++\
    \ 程序：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint globalVar\
    \ = 10; // 全局变量\n\nvoid exampleFunction() {\n    int localVar = 5; // 局部变量\n \
    \   static int staticVar = 0; // 静态变量\n    staticVar++; // 增加静态变量\n    cout <<\
    \ \"Local variable: \" << localVar << \", Static variable: \" << staticVar <<\
    \ endl;\n}\n\nint main() {\n    exampleFunction();\n    exampleFunction();\n \
    \   cout << \"Global variable: \" << globalVar << endl;\n    return 0;\n}\n```\n\
    \n### 代码解读\n1. **全局变量**：`globalVar` 声明在所有函数外部，使其在整个程序中可用。它在 `main()` 函数中被打印。\n\
    2. **局部变量**：`localVar` 声明在 `exampleFunction()` 内部。每次调用函数时都会初始化，并在函数退出时被销毁。\n3.\
    \ **静态变量**：`staticVar` 只初始化一次，尽管它声明在 `exampleFunction()` 内部。每次调用函数时，它的值都会增加，并且在函数调用之间保留其值。\n\
    4. **函数调用**：`main()` 函数中调用了两次 `exampleFunction()`。在第一次调用期间，`staticVar` 为 0 并增加到\
    \ 1。在第二次调用中，它保留了值并增加到 2，展示了静态变量的持久性。\n\n此示例说明了作用域如何影响 C++ 程序中变量的可见性和寿命。\n\n###\
    \ 注意事项\n管理变量作用域时，请遵循以下最佳实践：\n* 尽可能使用局部变量，以限制其访问范围并减少内存占用。这有助于避免全局变量以意外方式被修改而产生意外副作用。\n\
    * 将全局变量留给必须在多个函数之间共享数据的情况。谨慎使用全局变量，因为它们增加了调试和维护的复杂性。\n* 使用静态变量处理需要在跨函数调用之间持久但对程序其他部分隐藏的值。它们对于计数器或在函数内部维护状态非常有用。\n\
    \n### 项目 1：演示局部变量和全局变量\n* **目标**：编写一个演示局部和全局变量使用的程序。\n* **指令**：创建一个全局变量，并在函数内部创建一个局部变量。展示全局变量如何在整个程序中访问，而局部变量如何仅在函数内访问。\n\
    \n**代码**：\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint globalCount\
    \ = 0; // 全局变量\n\nvoid incrementGlobal() {\n    globalCount++;\n    int localCount\
    \ = 0; // 局部变量\n    localCount++;\n    cout << \"Global count: \" << globalCount\
    \ << \", Local count: \" << localCount << endl;\n}\n\nint main() {\n    incrementGlobal();\n\
    \    incrementGlobal();\n    cout << \"Global count in main: \" << globalCount\
    \ << endl;\n    return 0;\n}\n```\n* **代码解读**：全局变量 `globalCount` 被增加并在函数调用之间保留其值。局部变量\
    \ `localCount` 在每次调用 `incrementGlobal()` 时都会重新初始化。\n* **挑战**：修改程序以添加另一个修改全局变量的函数。\n\
    \n### 项目 2：使用静态变量计算函数调用\n* **目标**：创建一个使用静态变量计算函数被调用次数的程序。\n* **指令**：编写一个包含静态变量的函数，用于计算被调用的次数。函数每次被调用时应增加静态变量并打印当前计数。\n\
    \n**代码**：\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid countCalls()\
    \ {\n    static int callCount = 0; // 静态变量\n    callCount++;\n    cout << \"Function\
    \ called \" << callCount << \"times\" << endl;\n}\n\nint main() {\n    countCalls();\n\
    \    countCalls();\n    countCalls();\n    return 0;\n}\n```\n* **代码解读**：静态变量\
    \ `callCount` 只初始化一次，并在函数调用之间保留其值。函数每次被调用时都会打印被调用的次数。\n* **挑战**：修改程序，使用静态变量计算两个不同函数的被调用次数。\n\
    \n## 章节结束清单\n* 理解 C++ 中局部、全局和静态作用域的区别。\n* 练习使用局部变量处理函数特定任务，并使用全局变量处理共享数据。\n* 学习静态变量如何在函数调用之间保留其值，以及它们对于跟踪函数内部的持久化数据有多用。\n\
    \n"
- fmt: "\n1. What is the difference between a global and a local variable?\n2. What\
    \ is the purpose of a static variable in a function?\n3. Can a static variable\
    \ be accessed outside the function in which it is declared?\n\n## Glossary\n\n\
    - **Scope**: Defines where a variable can be accessed in a program.\n- **Local\
    \ Variable**: A variable declared inside a function or block that can only be\
    \ accessed within that scope.\n- **Global Variable**: A variable declared outside\
    \ all functions, accessible throughout the program.\n- **Static Variable**: A\
    \ variable that retains its value between function calls but is only accessible\
    \ within the function where it is declared.\n\n## Chapter 23. C++ Classes\n\n\
    ### What are Classes in C++?\n\nIn C++, a class is a blueprint for creating objects,\
    \ which are instances of that class. Classes are a fundamental part of object-oriented\
    \ programming (OOP), which focuses on organizing code around objects and data\
    \ rather than functions and logic alone.\n\nA class encapsulates data (called\
    \ `attributes`) and functions (called `methods`) that operate on that data. This\
    \ encapsulation allows you to define real-world entities in code, such as a car,\
    \ rectangle, or employee, each with its properties (`attributes`) and actions\
    \ (`methods`).\n\nObjects are instances of a class, and each object can have its\
    \ own unique set of data based on the class template. Using classes improves modularity,\
    \ code reuse, and scalability, which is vital for managing complex systems.\n\n\
    C++ uses classes to define attributes (`variables`) and methods (`functions`)\
    \ inside a single structure. Classes also allow for important OOP concepts like\
    \ inheritance, polymorphism, and encapsulation. By organizing code into classes,\
    \ C++ programs become more readable, maintainable, and extensible.\n\n### Syntax\n\
    \nThe syntax for defining and using a class in C++ is as follows:\n\n```cpp\n\
    class ClassName {\npublic:\n// Attributes\ndata_type attribute1;\ndata_type attribute2;\n\
    // Methods\nreturn_type methodName(parameters);\n};\n```\n\nTo create an object\
    \ and use the class:\n\n```cpp\nClassName objectName;\nobjectName.methodName();\n\
    ```\n\nFor example:\n\n```cpp\nclass Car {\npublic:\nstring make;\nstring model;\n\
    int year;\nvoid displayDetails();\n};\n```\n\nThis code defines a `Car` class\
    \ with three attributes (`make`, `model`, and `year`) and a method `displayDetails()`.\n\
    \n### Syntax Explanation\n\n1. **Class Declaration**: The `class` keyword is followed\
    \ by the class name. The name should be descriptive of the entity the class represents,\
    \ such as `Car` or `Rectangle`. Inside the class definition, you can declare both\
    \ attributes (`variables`) and methods (`functions`) that the class will have.\n\
    2. **Access Specifiers**: C++ uses access specifiers (`public`, `private`, and\
    \ `protected`) to control how class members can be accessed.\n    - `public`:\
    \ Members declared under `public` can be accessed from outside the class, such\
    \ as by objects or functions.\n    - `private`: Members declared under `private`\
    \ are only accessible from within the class itself, ensuring encapsulation.\n\
    3. **Attributes**: Attributes are variables that hold data related to the class.\
    \ For example, in a `Car` class, attributes could include `make`, `model`, and\
    \ `year`.\n4. **Methods**: Methods are functions that perform actions using the\
    \ class's attributes. For example, the `displayDetails()` method prints the car’s\
    \ details.\n5. **Object Creation**: After defining a class, you can create objects\
    \ of that class type. An object is an instance of the class and has its own set\
    \ of attribute values.\n\n### Code Example\n\nHere’s a simple example of a C++\
    \ program using a class:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nclass Rectangle {\npublic:\nint length;\nint width;\nint area() {\nreturn length\
    \ * width;\n}\n};\n\nint main() {\nRectangle rect;\nrect.length = 5;\nrect.width\
    \ = 3;\ncout << \"Area of the rectangle: \" << rect.area() << endl;\nreturn 0;\n\
    }\n```\n\nThis program defines a `Rectangle` class with attributes `length` and\
    \ `width` and a method `area()` to calculate the rectangle’s area.\n\n### Code\
    \ Walkthrough\n\n1. **Class Definition**: The `Rectangle` class is defined with\
