  trans: "\n\n`while` 循环的一个关键特性是，如果初始条件为假，它可能永远不会执行。当你需要确保代码仅在特定条件下运行时，这一特性就非常重要。此外，你必须确保条件最终会变为假，否则循环将无限运行，导致死循环。\n\
    \n## 代码示例\n\n这是一个简单的 `while` 循环示例，用于用于打印从 1 到 5 的数字：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int i = 1;\n    while (i <= 5) {\n\
    \        cout << i << endl;\n        i++;\n    }\n    return 0;\n}\n```\n\n在这个程序中，变量\
    \ `i` 从 1 开始。`while` 循环检查 `i` 是否小于或等于 5。如果是，它会打印 `i` 的值并使 `i` 加 1。循环将持续，直到 `i`\
    \ 超过 5。\n\n## 代码解析\n\n在上面的示例中，变量 `i` 被初始化为 1。`while` 循环检查 `i` 是否小于或等于 5。只要该条件为真，循环就会打印\
    \ `i` 的当前值并将 `i` 增 1。\n\n在每次迭代后，循环都会再次检查条件。当 `i` 变成 6 时，条件 `i <= 5` 为假，循环终止。程序随后移动到下一个部分（如果有），或者结束。\n\
    \n这个示例展示了 `while` 循环的常见用法——重复执行一个代码块，直到特定条件不再为真。当你预先不知道确切的迭代次数但有一个一个停止条件时，这种类型的循环非常有用。\n\
    \n***\n\n## Do/While 循环\n\n### 什么是 Do/While 循环？\n\n`do/while` 循环是 C++ 中 `while`\
    \ 循环的一种变体。与 `while` 循环不同，`do/while` 循环保证循环内部的代码块至少执行一次。这是因为条件是在循环代码块执行后评估的，而不是在此之前。\n\
    \n当你需要循环代码至少运行一次时（无论条件从开始是否为真），这种类型的循环就很有用。例如，在请求用户输入时时，你可能希望在检查输入是否满足特定条件之前，至少显示一次提示信息。\n\
    \n`do/while` 循环运行代码块，然后在循环结束时检查条件。如果条件为真，循环再次运行。如果为假，循环终止。这种类型的循环与标准的 `while`\
    \ 循环提供了略有不同的行为，因为如果初始条件为假，后者的循环可能完全不运行。\n\n### 语法\n\nC++ 中 `do/while` 循环的基本语法如下：\n\
    \n```cpp\ndo {\n    // 要执行的代码\n} while (condition);\n```\n\n`do` 关键字标记循环的开始，大括号内的代码首先执行。代码运行后，`while`\
    \ 语句会检查条件。如果条件为真，循环将重复；如果为假，循环停止。\n\n与 `while` 循环的主要区别在于，`do` 块中的代码在评估条件之前至少会运行一次。\n\
    \n### 语法解释\n\n在 `do/while` 循环中，代码块被放置在 `do` 部分，而条件在代码随后的 `while` 部分进行评估。与 `while`\
    \ 循环（首先检查条件）不同，`do/while` 循环在检查条件之前运行代码。\n\n这意味着即使条件为假，`do` 块中的代码也将至少执行一次。在执行代码块后，程序会评估条件。如果条件为真，循环将重复并再次运行代码。如果为假，循环终止。\n\
    \n`do/while` 循环在你需要保证某个代码块至少运行一次时特别有用，例如在收集用户输入或为计算设置初始值时。\n\n### 代码示例\n\n这是一个\
    \ `do/while` 循环示例，它提示用户猜数字，直到他们猜对为止：\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\n    int number = 7, guess;\n    do {\n        cout <<\
    \ \"Guess the number: \";\n        cin >> guess;\n    } while (guess != number);\n\
    \    cout << \"Correct guess!\" << endl;\n    return 0;\n}\n```\n\n在这个示例中，循环提示用户猜一个数字。循环将持续，直到用户输入正确的猜测。\n\
    \n### 代码解析\n\n在这个程序中，变量 `number` 被设置为 7，`guess` 变量用于存储用户的输入。程序进入 `do/while` 循环，首先提示用户输入一个猜测。\n\
    \n每次猜测后，程序都会检查 `guess` 是否等于 `number`。如果猜测不正确，循环将再次运行并要求另一个猜测。这会一直持续到用户猜中正确的数字，此时循环终止，程序打印“Correct\
    \ guess!”。\n\n这里的关键点是，得益于 `do/while` 循环的特性，提示信息将至少出现一次。\n\n***\n\n## 注意\n\n- `while`\
    \ 循环首先检查条件，如果初始条件为假，则可能可能不运行。\n- `do/while` 循环无论条件如何至少运行一次代码块。\n- 如果条件永远不变为假，`while`\
    \ 和 `do/while` 循环中都可能发生死循环。\n\n***\n\n## 练习 1：使用 While 循环打印数字\n\n### 描述\n\n创建一个程序，输入一个数字并打印从\
    \ 1 到该数字的内容。\n\n### 目标\n\n练习 `while` 循环。\n\n### 说明\n\n1. 提示用户输入数字。\n2. 使用 `while`\
    \ 循环从 1 到该数字。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    int num, i = 1;\n    cout << \"Enter a number: \";\n    cin >> num;\n\
    \    while (i <= num) {\n        cout << i << endl;\n        i++;\n    }\n   \
    \ return 0;\n}\n```\n\n### 代码解析\n\n程序初始化 `i` 为 1。`while` 循环检查 `i` 是否小于或等于 `num`。如果是，它会打印\
    \ `i` 并递增 `i`。\n\n### 挑战\n\n修改程序只打印偶数。\n\n***\n\n## 练习 2：正数之和\n\n### 描述\n\n创建一个程序，持续接收输入直到用户输入负数，然后打印所有正数的之和。\n\
    \n### 目标\n\n练习 `do/while` 循环。\n\n### 说明\n\n1. 使用 `do/while` 循环持续输入。\n2. 将正数累加到和。\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    int\
    \ num, sum = 0;\n    do {\n        cout << \"Enter a number (negative to quit):\
    \ \";\n        cin >> num;\n        if (num > 0) sum += num;\n    } while (num\
    \ >= 0);\n    cout << \"Total sum of positive numbers: \" << sum << endl;\n  \
    \  return 0;\n}\n```\n\n### 代码解析\n\n`do/while` 循环确保至少提示一次。如果输入是正数，则将其加到 `sum`。循环只有在输入负数时终止。\n\
    \n### 挑战\n\n增强程序以统计输入的正数个数。\n\n***\n\n## 本章结束清单\n\n- 理解 `while` 和 `do/while` 循环的区别。\n\
    - 能够编写根据条件重复的 `while` 循环。\n- 完成两个练习以练习 `while` 和 `do/while` 循环。\n- 识别常见的错误，如死循环或忘记更新循环条件。\n\
    \n## 测试\n\n1. `do/while` 循环与 `while` 循环有什么区别？\n2. 不包含循环条件的更新会有风险？\n3. `while`\
    \ 循环可以运行零次吗？解释。\n\n## 术语表\n\n- **While Loop**: 只要给定条件为真，就会重复执行代码块的控制结构。\n- **Do/While\
    \ Loop**: `while` 循环的变体，在评估条件之前保证至少执行一次代码块。\n- **Condition**: 循环用于评估以决定继续还是终止循环的表达式。\n\
    - **Infinite Loop**: 因为条件始终为真而永远不终止的循环。\n\n第 16 章 C++ for 循环\n\n"
- fmt: "\n# What is the For Loop?\n\nA for loop in C++ is a control flow statement\
    \ that allows repetitive execution of a block of code. It runs a block of code\
    \ a specific number of times, making it ideal for tasks like iterating over arrays,\
    \ calculating sums, or processing data. The for loop has three main components:\
    \ initialization, condition, and iteration, all defined in a single line, making\
    \ it concise and efficient. It reduces code duplication and simplifies the process\
    \ of executing similar instructions multiple times.\n\nThe C++ for loop is typically\
    \ used when the number of iterations is known in advance. It’s often preferred\
    \ over other loops (like while loops) when working with arrays or counting-based\
    \ problems. Its versatility allows it to handle complex iteration scenarios, including\
    \ multi-dimensional data structures and custom sequences, making it a fundamental\
    \ feature in the C++ programming language.\n\n## Syntax\n\nThe general syntax\
    \ for a C++ for loop is as follows:\n\n```cpp\nfor (initialization; condition;\
    \ iteration) {\n    // code to be executed\n}\n```\n\n*   `Initialization`: This\
    \ step is executed only once before the loop starts. It usually involves declaring\
    \ and initializing a control variable.\n*   `Condition`: The loop continues to\
    \ execute as long as this condition is true. Once it becomes false, the loop stops.\n\
    *   `Iteration`: This step updates the control variable after each loop iteration,\
