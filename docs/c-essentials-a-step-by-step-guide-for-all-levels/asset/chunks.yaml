    \n# 第 12 章 C++ 布尔值\n\n***\n\n## 什么是 C++ 中的布尔值？\n\nC++ 中的布尔值表示两种可能的结果之一：真（true）或假（false）。布尔值在编程中是基础性的因为它们被用于决策过程，允许程序根据条件在不同的路径之间进行选择。在\
