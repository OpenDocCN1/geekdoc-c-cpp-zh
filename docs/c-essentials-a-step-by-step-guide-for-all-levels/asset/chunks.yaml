    Chapter 24 Files


    Files in C++ are used to store data on a hard drive or other external storage,
    allowing data to persist beyond the lifetime of the program. File handling is
    essential when you need to save data permanently, such as saving user information,
    logs, or configurations. C++ provides file handling through its file stream library  <fstream>,
    which allows reading from and writing to files.


    There are two main types of file operations in C++:


    *   Input (reading): Retrieving data from a file using  ifstream (input file stream).


    *   Output (writing): Writing data to a file using  ofstream (output file stream).


    C++ also provides the  fstream class, which can handle both input and output.
    Files are handled using streams, which function like channels between the program
    and the file. You can use streams to transfer data between variables in your program
    and files stored on the disk.


    Using files is essential for saving the state of a program, logging information,
    or sharing data between different programs. File handling makes C++ programs more
    versatile and capable of handling larger-scale applications that require persistent
    storage.


    Syntax


    The syntax for reading from and writing to files in C++ is as follows:


    #include <fstream>


    using namespace std;


    ifstream inFile("input.txt");  // To read from a file


    ofstream outFile("output.txt"); // To write to a file


    *   ifstream: Used for reading from a file.


    *   ofstream: Used for writing to a file.


    You can read and write to files using the file streams, similar to how  cin and  cout
    are used for console input and output. To write:


    outFile << "Hello, World!";


    To read:


    inFile >> data;


    Syntax Explanation


    1.  Opening Files: To handle files, you need to include the  <fstream> header.
    Then, you create an object of the  ifstream or  ofstream class to work with input
    or output files, respectively. For example,  ifstream inFile("input.txt"); opens
    a file named  input.txt for reading, while  ofstream outFile("output.txt"); opens
    or creates  output.txt for writing.


    2.  Reading from a File: Using  ifstream, you can read data from a file in the
    same way you use  cin for console input. The extraction operator (>>) is used
    to retrieve data. For example,  inFile >> data; reads a value from the file and
    stores it in the variable  data.


    3.  Writing to a File: Using  ofstream, you can write data to a file just like
    you use  cout to display output. The insertion operator (<<) is used to send data
    to the file. For example,  outFile << "Hello, World!"; writes "Hello, World!"
    to the file.


    4.  Closing Files: It’s important to close files after you’re done with them using
    the  close() method. This releases system resources and ensures the data is correctly
    written and saved.


    Code Example


    Here’s an example program demonstrating file input and output:


    #include <iostream>


    #include <fstream>


    using namespace std;


    int main() {


    ofstream outFile("example.txt");


    outFile << "Hello, World!" << endl;


    outFile.close();


    ifstream inFile("example.txt");


    string line;


    while (getline(inFile, line)) {


    cout << line << endl;


    }


    inFile.close();


    return 0;


    }


    This program writes "Hello, World!" to a file named  example.txt and then reads
    and prints the contents of the file.


    Code Walkthrough


    1.  Opening Files: The program begins by opening an output file stream (ofstream
    outFile("example.txt");). If the file  example.txt does not exist, it is created.


    2.  Writing to File: The line  outFile << "Hello, World!" << endl; writes the
    string "Hello, World!" to the file, followed by a newline.


    3.  Closing File: After writing, the file is closed using  outFile.close(), which
    ensures that all data is saved and resources are freed.'
