  trans: "\n在该程序中，用户输入一个数字，该数字被存储在变量 `number` 中。布尔表达式 `number % 2 == 0` 检查数字是否能被 2\
    \ 整除。如果为真，则数字为偶数；否则，为奇数。程序根据布尔值打印相应的消息。\n\n### 挑战：\n修改程序，除了检查奇偶外，还要检查输入的数字是正数、负数还是零。\n\
    \n***\n\n## 项目 2：投票资格\n\n### 描述：\n创建一个程序，获取用户的年龄作为输入，并使用布尔条件 `age >= 18` 判断他们是否有投票资格。\n\
    \n### 目标：\n练习使用布尔表达式根据用户输入检查资格。\n\n### 指令：\n1. 提示用户输入年龄。\n2. 使用布尔条件检查年龄是否为 18\
    \ 岁或以上。\n3. 打印用户是否有投票资格。\n\n### 代码：\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\nint age;\ncout << \"Enter your age: \";\ncin >> age;\n\
    bool canVote = (age >= 18);\nif (canVote) {\ncout << \"You are eligible to vote.\"\
    \ << endl;\n} else {\ncout << \"You are not eligible to vote.\" << endl;\n}\n\
    return 0;\n}\n```\n\n### 代码解读：\n程序要求用户输入年龄，将值存储在 `age` 变量中，并使用布尔表达式 `age >= 18`\
    \ 检查年龄是否为 18 岁或以上。如果为真，程序打印用户有投票资格。否则，它打印用户没有投票资格。\n\n### 挑战：\n扩展程序，为 16-17 岁的用户（接近投票资格）和小于\
    \ 16 岁的用户打印不同的消息。\n\n***\n\n## 本章结束检查清单\n* 理解布尔值和表达式在 C++ 中的作用。\n* 能够编写使用布尔条件来控制逻辑流的程序。\n\
    * 知道如何使用比较运算符和逻辑运算符创建复杂条件。\n\n***\n\n## 测验\n1. 布尔变量在 C++ 中可以持有哪些值？\n2. 如何使用布尔表达式检查两个数字是否相等？\n\
    3. `&&` 和 `||` 运算符之间有什么区别？\n\n***\n\n## 词汇表\n* **Boolean（布尔）**: 持有 `true` 或 `false`\
    \ 值的数据类型。\n* **Boolean Expression（布尔表达式）**: 值为真或假的表达式，用于在代码中做出决策。\n* **Logical\
    \ Operator（逻辑运算符）**: 组合或修改布尔表达式的运算符（例如 `&&`、`||`、`!`）。\n\n# 第 13 章 C++ If...Else\
    \ 语句\n\n***\n\n### 什么是 if 语句？\nC++ 中的 `if` 语句是一种条件语句，允许程序根据条件的真与假来做出决策。它是编程中是最基础且重要的控制结构之一，有助于引导程序的流程。`if`\
    \ 语句评估一个布尔表达式，如果表达式为真，则执行 `if` 块中的代码。如果条件为假，程序将跳过 `if` 块并移动到代码的下部分。\n\n例如，你可能使用\
    \ `if` 语句在允许用户访问受限页面之前检查他们是否已登录。如果条件（登录状态）为真，他们就可以继续。如果不是，他们将被重定向到登录页面。每当程序需要做出决策或选择时，都会使用\
    \ `if` 语句，这使其在创建动态、响应式的软件中至关重要。\n\n***\n\n### 语法\n`if` 语句的基本语法如下：\n\n```cpp\n\
    if (condition) {\n// 如果条件为真，则执行的代码\n}\n```\n\n例如：\n```cpp\nif (age >= 18) {\n\
    \    cout << \"You are an adult.\" << endl;\n}\n```\n\n***\n\n### 语法解释\n`if` 语句以关键字\
    \ `if` 开头，后面跟着括号内的条件。该条件必须评估为真或假。如果条件为真，则执行大括号 `{}` 内部的代码块。如果条件为假，程序将跳过该代码块。\n\
    \n条件可以是任何产生布尔值的有效表达式。常见的条件涉及比较运算符，如 `==`、`!=`、`>`、`<`、>=` 和 `<=`。例如，`if (age >=\
    \ 18)` 检查 `age` 是否大于 18。如果为真，`if` 块中的代码将运行。\n\n***\n\n### 代码示例\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\nint age;\ncout << \"Enter\
    \ your age: \";\ncin >> age;\nif (age >= 18) {\n    cout << \"You are an adult.\"\
    \ << endl;\n}\nreturn 0;\n}\n```\n\n***\n\n### 代码解读\n在这个示例中，提示用户输入年龄。输入被存储在变量\
    \ `age` 中。`if` 语句检查 `age` 的值是否大于或等于 18。如果条件为真，则打印消息“You are an adult”。如果条件为假（年龄小于\
    \ 18 岁），程序将跳过 `if` 块并移动到代码的下部分（在本情况下，它结束了程序）。此示例演示了 `if` 语句如何根据用户输入控制程序的流程。\n\n\
    ***\n\n### Else/Else If\n\n#### 什么是 Else 和 Else If？\n在 C++ 中，`else` 和 `else if`\
    \ 用于配合 `if` 语句，在决策时创建额外的分支。当 `if` 条件为假时，`else if` 用于检查另一个条件。`else` 则作为备选方案。\n\n\
    例如，如果你想将年龄分类为儿童、青少年或成人，你会使用多个条件。`if` 语句检查第一个条件（例如 `age < 13`），`else if` 检查另一个条件（例如\
    \ `age < 18`），`else` 处理任何都不符合的情况。这些分支结构对于需要根据不同输入做出决策的程序至关重要。\n\n### 语法\n`else`\
    \ 和 `else if` 的语法如下：\n\n```cpp\nif (condition1) {\n// 如果 condition1 为真，则执行代码\n\
    } else if (condition2) {\n// 如果 condition2 为真，则执行代码\n} else {\n// 如果所有条件为假，则执行代码\n\
    }\n```\n\n***\n\n### 语法解释\n`else if` 语句允许在 `if` 条件评估为假时检查另一个条件。如果 `condition1`\
    \ 为假，程序移动到 `condition2`。最后的 `else` 块处理没有任何条件真的情况。\n\n例如：\n```cpp\nif (age < 13)\
    \ {\n    cout << \"You are a child.\";\n} else if (age < 18) {\n    cout << \"\
    You are a teenager.\";\n} else {\n    cout << \"You are an adult.\";\n}\n```\n\
    \n***\n\n### 代码示例\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main() {\nint age;\ncout << \"Enter your age: \";\ncin >> age;\nif (age < 13)\
    \ {\n    cout << \"You are a child.\" << endl;\n} else if (age < 18) {\n    cout\
    \ << \"You are a teenager.\" << endl;\n} else {\n    cout << \"You are an adult.\"\
    \ << endl;\n}\nreturn 0;\n}\n```\n\n***\n\n### 代码解读\n此示例根据用户的年龄进行分类。如果用户的年龄小于\
    \ 13，程序打印“You are a child”。如果第一个条件为假但年龄小于 18，程序打印“You are a teenager”。如果两个条件都不成立（意味着年龄为\
    \ 18 岁或更大），`else` 块打印“You are an adult”。这演示了如何使用 `else if` 和 `else` 处理多个条件并根据用户输入提供不同的输出。\n\
    \n***\n\n### 注意事项\n在使用多个 `if-else` 语句时，请确保条件的逻辑结构正确。始终从最具体的条件开始，然后转向更通用的条件。避免过度使用\
    \ `else if` 语句，因为这可能导致代码复杂难以阅读。在某些情况下，根据程序的逻辑，使用 `switch` 语句或循环可能合适。\n\n***\n\n\
    ### 三元运算符\n什么是三元运算符？\n\n"
- fmt: "\nThe ternary operator in C++ is a shorthand for if-else statements. It’s\
    \ useful when you need to make a quick decision and assign a value based on a\
    \ condition. The ternary operator takes three operands: a condition, a value if\
    \ the condition is true, and a value if the condition is false. It is represented\
    \ by the symbols `?` and `:`.\n\nFor example, if you want to check if a number\
    \ is even or odd, you can use a ternary operator to return the result in a single\
    \ line, rather than writing a full if-else statement.\n\nThe ternary operator\
    \ is ideal for simple decisions where brevity is important, but it should be used\
    \ cautiously. When conditions or actions are more complex, if-else statements\
    \ may offer better readability.\n\n## Syntax\n\nThe basic syntax for the ternary\
    \ operator is:\n\n`condition ? value_if_true : value_if_false;`\n\nFor example:\n\
    \n`string result = (age >= 18) ? \"Adult\" : \"Minor\";`\n\n## Syntax Explanation\n\
    \nThe ternary operator evaluates a condition. If the condition is true, the expression\
    \ before the colon (`:`) is executed, and if it’s false, the expression after\
    \ the colon (`:`) is executed. It allows for a more concise way of writing simple\
    \ if-else decisions.\n\nIn the following code:\n\n`string category = (age >= 18)\
    \ ? \"Adult\" : \"Minor\";`\n\nThe ternary operator checks if `age >= 18`. If\
    \ true, it assigns the value `\"Adult\"` to the variable `category`. Otherwise,\
    \ it assigns `\"Minor\"` to `category`. This is a compact way to express the if-else\
    \ logic in one line.\n\n## Code Example\n\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\nint main() {\n    int age;\n    cout << \"Enter your age:\
    \ \";\n    cin >> age;\n    string status = (age >= 18) ? \"You are an adult.\"\
    \ : \"You are not an adult.\";\n    cout << status << endl;\n    return 0;\n}\n\
    ```\n\n## Code Walkthrough\n\nIn this program, the ternary operator checks if\
    \ the user is 18 or older. If the condition is true, the string \"You are an adult\"\
    \ is assigned to the variable `status`. If the condition is false, the string\
    \ \"You are not an adult\" is assigned. The result is then printed. The ternary\
    \ operator condenses the decision-making process into a single line, making the\
    \ code concise without sacrificing functionality.\n\n## Notes\n\nThe ternary operator\
    \ is best used for simple conditions and assignments. Avoid using it for complex\
    \ logic, as it can make the code difficult to read. If your logic involves multiple\
    \ conditions or actions, stick with traditional if-else statements for clarity.\n\
    \n## Projects\n\n### Project 1: Grade Check\n\n**Description:**\nWrite a program\
    \ that asks for a user's grade and prints whether they passed or failed using\
    \ if-else statements.\n\n**Objective:**\nPractice writing basic if-else statements\
    \ to make decisions based on user input.\n\n**Instructions:**\n1. Ask the user\
    \ to input their grade (e.g., 65 out of 100).\n2. Use an if-else statement to\
    \ check if the grade is 50 or higher (passing).\n3. Print whether the user passed\
    \ or failed.\n\n**Code:**\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\n    int grade;\n    cout << \"Enter your grade: \";\n    cin >>\
    \ grade;\n    if (grade >= 50) {\n        cout << \"You passed!\" << endl;\n \
    \   } else {\n        cout << \"You failed!\" << endl;\n    }\n    return 0;\n\
    }\n```\n\n**Code Walkthrough:**\nThe program asks the user for their grade and\
    \ stores it in the `grade` variable. An if-else statement checks whether the grade\
    \ is 50 or higher. If the condition is true, the user is told they passed. If\
    \ false, they are told they failed.\n\n**Challenge:**\nModify the program to print\
    \ “Excellent” for grades 90 and above, “Good” for grades 75 and above, “Pass”\
    \ for grades 50 and above, and “Fail” for anything below 50.\n\n### Project 2:\
    \ Age Category Program\n\n**Description:**\nCreate a program that takes input\
    \ for a person’s age and outputs whether they are a child, teenager, adult, or\
    \ senior citizen using if, else if, and else.\n\n**Objective:**\nPractice using\
    \ if, else if, and else to handle multiple conditions.\n\n**Instructions:**\n\
    1. Ask the user to input their age.\n2. Use if, else if, and else to categorize\
    \ their age as child (<13), teenager (13–19), adult (20–64), or senior citizen\
    \ (65+).\n3. Print the category based on the user’s input.\n\n**Code:**\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main() {\n    int age;\n  \
    \  cout << \"Enter your age: \";\n    cin >> age;\n    if (age < 13) {\n     \
    \   cout << \"You are a child.\" << endl;\n    } else if (age >= 13 && age <=\
    \ 19) {\n        cout << \"You are a teenager.\" << endl;\n    } else if (age\
    \ >= 20 && age <= 64) {\n        cout << \"You are an adult.\" << endl;\n    }\
    \ else {\n        cout << \"You are a senior citizen.\" << endl;\n    }\n    return\
    \ 0;\n}\n```\n\n**Code Walkthrough:**\nThis program categorizes the user based\
    \ on their age. If the age is less than 13, it prints \"You are a child.\" The\
    \ else if statement checks if the age is between 13 and 19, printing \"You are\
    \ a teenager.\" Another else if statement checks if the age is between 20 and\
    \ 64, and the else block handles ages 65 and above.\n\n**Challenge:**\nModify\
    \ the program to handle additional categories, such as \"infant\" for ages less\
    \ than 3 and \"young adult\" for ages 20-29.\n\n## End of Chapter Checklist\n\n\
    *   Understand the structure and function of if, else, and else if statements.\n\
    *   Practice writing conditions that control the flow of a program.\n*   Be able\
    \ to use the ternary operator for simple if-else decisions.\n\n## Quiz\n\n1. What\
    \ is the difference between if and else if?\n2. How does the ternary operator\
    \ differ from a traditional if-else statement?\n3. When should you use an if-else\
    \ statement versus a ternary operator?\n\n## Glossary\n\n*   **If Statement**:\
    \ A control structure that executes code if a condition is true.\n*   **Else Statement**:\
    \ A fallback that executes code when an if condition is false.\n*   **Else If**:\
    \ A statement that allows for additional conditions to be checked after the original\
    \ if statement.\n*   **Ternary Operator**: A shorthand for writing simple if-else\
    \ conditions in a line.\n"
  raw: 'The ternary operator in C++ is a shorthand for if-else statements. It’s useful
    when you need to make a quick decision and assign a value based on a condition.
    The ternary operator takes three operands: a condition, a value if the condition
    is true, and a value if the condition is false. It is represented by the symbols  ?
    and  :.


    For example, if you want to check if a number is even or odd, you can use a ternary
    operator to return the result in a single line, rather than writing a full if-else
    statement.


    The ternary operator is ideal for simple decisions where brevity is important,
    but it should be used cautiously. When conditions or actions are more complex,
    if-else statements may offer better readability.


    * * *


    Syntax


    The basic syntax for the ternary operator is:


    condition ? value_if_true : value_if_false;


    For example:


    string result = (age >= 18) ? "Adult" : "Minor";


    * * *


    Syntax Explanation


    The ternary operator evaluates a condition. If the condition is true, the expression
    before the colon (:) is executed, and if it’s false, the expression after the
    colon is executed. It allows for a more concise way of writing simple if-else
    decisions.


    In the following code:


    string category = (age >= 18) ? "Adult" : "Minor";


    The ternary operator checks if  age >= 18. If true, it assigns the value "Adult"
    to the variable  category. Otherwise, it assigns "Minor" to  category. This is
    a compact way to express the if-else logic in one line.


    * * *


    Code Example


    #include <iostream>


    using namespace std;


    int main() {


    int age;


    cout << "Enter your age: ";


    cin >> age;


    string status = (age >= 18) ? "You are an adult." : "You are not an adult.";


    cout << status << endl;


    return 0;


    }


    * * *


    Code Walkthrough


    In this program, the ternary operator checks if the user is 18 or older. If the
    condition is true, the string "You are an adult" is assigned to the variable  status.
    If the condition is false, the string "You are not an adult" is assigned. The
    result is then printed. The ternary operator condenses the decision-making process
    into a single line, making the code more concise without sacrificing functionality.


    * * *


    Notes


    The ternary operator is best used for simple conditions and assignments. Avoid
    using it for complex logic, as it can make the code difficult to read. If your
    logic involves multiple conditions or actions, stick with traditional if-else
    statements for clarity.


    * * *


    Projects


    * * *


    Project 1: Grade Check


    Description:


    Write a program that asks for a user''s grade and prints whether they passed or
    failed using if-else statements.


    Objective:


    Practice writing basic if-else statements to make decisions based on user input.


    Instructions:


    1.  Ask the user to input their grade (e.g., 65 out of 100).


    2.  Use an if-else statement to check if the grade is 50 or higher (passing).


    3.  Print whether the user passed or failed.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    int grade;


    cout << "Enter your grade: ";


    cin >> grade;


    if (grade >= 50) {


    cout << "You passed!" << endl;


    } else {


    cout << "You failed!" << endl;


    }


    return 0;


    }


    Code Walkthrough:


    The program asks the user for their grade and stores it in the  grade variable.
    An if-else statement checks whether the grade is 50 or higher. If the condition
    is true, the user is told they passed. If false, they are told they failed.


    Challenge:


    Modify the program to print “Excellent” for grades 90 and above, “Good” for grades
    75 and above, “Pass” for grades 50 and above, and “Fail” for anything below 50.


    * * *


    Project 2: Age Category Program


    Description:


    Create a program that takes input for a person’s age and outputs whether they
    are a child, teenager, adult, or senior citizen using if, else if, and else.


    Objective:


    Practice using if, else if, and else to handle multiple conditions.


    Instructions:


    1.  Ask the user to input their age.


    2.  Use if, else if, and else to categorize their age as child (<13), teenager
    (13–19), adult (20–64), or senior citizen (65+).


    3.  Print the category based on the user’s input.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    int age;


    cout << "Enter your age: ";


    cin >> age;


    if (age < 13) {


    cout << "You are a child." << endl;


    } else if (age >= 13 && age <= 19) {


    cout << "You are a teenager." << endl;


    } else if (age >= 20 && age <= 64) {


    cout << "You are an adult." << endl;


    } else {


    cout << "You are a senior citizen." << endl;


    }


    return 0;


    }


    Code Walkthrough:


    This program categorizes the user based on their age. If the age is less than
    13, it prints "You are a child." The else if statement checks if the age is between
    13 and 19, printing "You are a teenager." Another else if statement checks if
    the age is between 20 and 64, and the else block handles ages 65 and above.


    Challenge:


    Modify the program to handle additional categories, such as "infant" for ages
    less than 3 and "young adult" for ages 20-29.


    * * *


    End of Chapter Checklist


    *   Understand the structure and function of if, else, and else if statements.


    *   Practice writing conditions that control the flow of a program.


    *   Be able to use the ternary operator for simple if-else decisions.


    * * *


    Quiz


    1.  What is the difference between if and else if?


    2.  How does the ternary operator differ from a traditional if-else statement?


    3.  When should you use an if-else statement versus a ternary operator?


    * * *


    Glossary


    *   If Statement: A control structure that executes code if a condition is true.


    *   Else Statement: A fallback that executes code when an if condition is false.


    *   Else If: A statement that allows for additional conditions to be checked after
    the original if statement.


    *   Ternary Operator: A shorthand for writing simple if-else conditions in a single
    line.


    Chapter 14: C++ Switch 


    What is the Switch Statement? 


    The  switch statement in C++ is a control structure that allows for multi-branch
    decision-making. It evaluates a single expression, typically a variable, and compares
    it against a list of possible constant values. Based on the result, it executes
    the corresponding block of code. Unlike the  if-else ladder, which evaluates conditions
    sequentially, the  switch statement directly jumps to the case that matches the
    expression, making it a more efficient choice when dealing with numerous conditions.


    The  switch statement is often used for situations where a variable can take multiple
    distinct values, such as menu options or command selections. It enhances code
    readability and maintainability when there are many discrete conditions to check.
    However, it only works with integral or enumerated types and cannot handle ranges
    or more complex conditions like  if-else. Each case in a  switch block is marked
    by the  case keyword followed by the value, and a  break statement is used to
    exit the switch once a match is found.


    Syntax


    The basic syntax for using the  switch statement in C++ is as follows:


    switch (expression) {


    case value1:


    // Code to execute if expression matches value1


    break;


    case value2:


    // Code to execute if expression matches value2


    break;


    // More cases can be added as needed


    default:


    // Code to execute if no case matches


    }


    The  expression is evaluated, and if it matches one of the  case values, the corresponding
    block of code is executed. The  break statement prevents the program from falling
    through to subsequent cases.


    Syntax Explanation


    The  switch statement begins by evaluating the expression inside the parentheses.
    This expression must be of an integral type (like  int,  char, or  enum). Each  case
    represents a possible value that the expression might match. If a match is found,
    the code block under that case is executed.'
