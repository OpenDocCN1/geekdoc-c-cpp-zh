    \n### Code Example\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main() {\n  float pi = 3.14;\n  float radius = 5.0;\n  float area = pi * radius\
    \ * radius;\n  cout << \"The area of the circle is: \" << area << endl;\n  return\
    \ 0;\n}\n```\n\n### Code Walkthrough\nIn this program, the float variables `pi`\
    \ and `radius` are declared and used to calculate the area of a circle. The result\
