  trans: "\n\n`break` 语句至关重要，因为它会停止执行并向下进入下一个 `case`。如果没有 `break`，程序将继续执行后续 `case`\
    \ 的代码，无论其值是否与表达式匹配。这被称为“贯穿（fallthrough）”，在某些情况下，这可能是刻意为之，但除非明确需要，否则通常会避免这样做。\n\
    \n`default` 情况是可选的，但建议使用。它充当任何不匹配已定义的 `case` 值的万能捕获，允许程序能够优雅地处理意外输入。\n\n## 代码示例\n\
    \n这里有一个 `switch` 语句的简单示例，它评估一个变量并根据其值打印消息：\n\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\nint main() {\n    int day = 3;\n\n    switch (day) {\n\
    \    case 1:\n        cout << \"Monday\" << endl;\n        break;\n    case 2:\n\
    \        cout << \"Tuesday\" << endl;\n        break;\n    case 3:\n        cout\
    \ << \"Wednesday\" << endl;\n        break;\n    case 4:\n        cout << \"Thursday\"\
    \ << endl;\n        break;\n    case 5:\n        cout << \"Friday\" << endl;\n\
    \        break;\n    default:\n        cout << \"Weekend\" << endl;\n    }\n\n\
    \    return 0;\n}\n```\n\n## 代码解读\n\n在此示例中，变量 `day` 被初始化为 `3`。`switch` 语句评估 `day`\
    \ 的值并与预定义的 `case` 值进行比较。由于 `day` 等于 `3`，程序将打印 \"Wednesday\"。\n\n注意每个 `case` 都有一个对应的\
    \ `break` 语句。当程序到达匹配的 `case` 时，相关的代码块将被执行，`break` 语句确保程序在打印正确的日期后退出 `switch`。\n\
    \n如果给 `day` 赋值为 `1` 到 `5` 以外的值，则将执行 `default` 块，打印 \"Weekend\"。`default` 情况有助于处理输入不匹配任何所提供的情况的情况。\n\
    \n## 注意事项\n\n- 始终在每个 `case` 之后包含一个 `break` 语句以防止贯穿，除非刻意想要贯穿行为。\n- 使用 `default`\
    \ 情况处理意外值，确保您的程序在所有输入下都有可预测的行为。\n- 在处理单个变量的多个特定值时，`switch` 语句是 `if-else` 链的更好替代方案。\n\
    - 避免使用 `switch` 处理涉及范围或复杂布尔表达式的条件，因为它只支持直接值比较。\n\n***\n\n## 项目 1：星期几 switch 语句\n\
    \n### 描述\n创建一个程序，要求用户输入一个 1 到 7 之间的数字，并使用 `switch` 语句打印对应的星期。\n\n### 目标\n目标是练习使用\
    \ `switch` 语句将数字映射到对应的星期几。\n\n### 指示\n1. 提示用户输入一个 1 到 7 之间的数字。\n2. 使用 `switch`\
    \ 语句打印相应的日期（星期一到星期日）。\n3. 使用 `default` 情况处理意外输入。\n\n### 代码\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n    int day;\n    cout <<\
    \ \"Enter a number between 1 and 7: \";\n    cin >> day;\n\n    switch (day) {\n\
    \    case 1: cout << \"Monday\"; break;\n    case 2: cout << \"Tuesday\"; break;\n\
    \    case 3: cout << \"Wednesday\"; break;\n    case 4: cout << \"Thursday\";\
    \ break;\n    case 5: cout << \"Friday\"; break;\n    case 6: cout << \"Saturday\"\
    ; break;\n    case 7: cout << \"Sunday\"; break;\n    default: cout << \"Invalid\
    \ input.\";\n    }\n\n    return 0;\n}\n```\n\n### 代码解读\n用户被提示输入一个数字，程序根据输入使用\
    \ `switch` 语句打印对应的星期几。`default` 情况处理任何不在 1 到 7 之间的输入。\n\n### 挑战\n扩展程序以包含一个循环，该不断询问输入，直到输入有效数字为止。\n\
    \n***\n\n## 项目 2：使用 Switch 的基础计算器\n\n### 描述\n创建一个简单的计算器，根据用户输入执行基础算术运算。\n\n###\
    \ 目标\n练习使用 `switch` 语句根据多种可能的操作进行决策。\n\n### 指示\n1. 要求用户输入两个数字和一个操作（加法、减法、乘法或除法）。\n\
    2. 使用 `switch` 语句执行所选的操作。\n3. 使用 `default` 情况处理无效操作。\n\n### 代码\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n    char operation;\n  \
    \  double num1, num2;\n    cout << \"Enter an operator (+, -, *, /): \";\n   \
    \ cin >> operation;\n    cout << \"Enter two numbers: \";\n    cin >> num1 >>\
    \ num2;\n\n    switch (operation) {\n    case '+': cout << num1 + num2; break;\n\
    \    case '-': cout << num1 - num2; break;\n    case '*': cout << num1 * num2;\
    \ break;\n    case '/': cout << num1 / num2; break;\n    default: cout << \"Invalid\
    \ operator\";\n    }\n\n    return 0;\n}\n```\n\n### 代码解读\n程序提示用户输入两个数字和一个运算符。`switch`\
    \ 语句根据用户输入的运算符执行请求的操作。\n\n### 挑战\n增强计算器，使其包含一个循环，直到输入有效数字为止。\n\n***\n\n## 本章结束清单\n\
    \n- 理解 `switch` 语句的工作原理以及何时使用它。\n- 熟悉 `switch` 的语法，包括 `break` 和 `default` 的使用。\n\
    - 完成加强对 `switch` 理解的项目。\n- 了解编写清晰、高效的 `switch` 语句的最佳实践。\n\n***\n\n## Quiz\n\n\
    1. `switch` 中 `break` 的作用是什么？\n2. `switch` 语句可以处理范围吗？\n3. 什么类型的表达式可以在 `switch`\
    \ 中评估？\n\n***\n\n## 术表\n\n- **Switch Statement**: 根据表达式的结果执行代码块的控制结构。\n- **Case**:\
    \ 表示表达式匹配的可能值。\n- **Break**: 执行后退出 `switch` 的语句。\n\n***\n\n# 第 15 章：C++ while\
    \ 循环\n\n### 什么是 while 循环？\n\nC++ 中的 `while` 循环是一种控制结构，只要给定条件为真就执行代码块。它在进入循环前评估条件，直到条件变为假为止继续执行块。`while`\
    \ 循环适用于不知道确切迭代次数但知道在条件满足时必须运行的情况。\n\n简单来说，`while` 循环确保块内的代码运行多次，取决于条件。如果你需要一直询问直到提供有效响应，或者继续计算值直到达到某个阈值，`while`\
    \ 循环是一个很好的选择。`while` 循环的灵活性允许有限和无限循环，取决于你使用的条件。然而，必须小心避免创建条件永远为假的无限循环。\n\n###\
    \ 语法\n\nC++ 中 `while` 循环的基本语法如下所示：\n\n```cpp\nwhile (condition) {\n    // 重复执行的代码\n\
    }\n```\n\n循环开始评估 `condition`。如果条件为真，则执行代码块。每次迭代后，都会重新评估条件。如果条件仍然为真，循环再次运行；如果为假，则循环终止，程序继续运行。\n\
    \n`condition` 可以是任何评估为布尔值（真或假）的表达式。如果条件从一开始为假，则循环代码块将被完全跳过。\n\n### 语法解释\n\n`while`\
    \ 循环的条件放在 `while` 关键字后的括号内。在执行循环内的任何代码之前都会检查此条件。如果条件为真，程序进入循环并开始执行大括号 `{}` 内的语句。\n\
    \n每次迭代后，都会再次检查条件。只要条件保持为真，循环就会继续执行。当条件变为假时，循环终止，程序继续执行下一部分代码。\n\n"
- fmt: "\nOne key feature of the `while` loop is that it may never run if the condition\
    \ is false initially. This characteristic is important when you need to ensure\
    \ that the code only runs under specific conditions. Additionally, you must ensure\
    \ that the condition eventually becomes false; otherwise, the loop will run indefinitely,\
    \ creating an infinite loop.\n\n## Code Example\n\nHere’s a simple example of\
    \ a `while` loop that prints numbers from 1 to 5:\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int i = 1;\n    while (i <= 5) {\n\
    \        cout << i << endl;\n        i++;\n    }\n    return 0;\n}\n```\n\nIn\
    \ this program, the variable `i` starts at 1. The `while` loop checks if `i` is\
    \ less than or equal to 5. If so, it prints the value of `i` and increments `i`.\
    \ The loop continues until `i` exceeds 5.\n\n## Code Walkthrough\n\nIn the example\
    \ above, the variable `i` is initialized to 1. The `while` loop checks whether\
    \ `i` is less than or equal to 5. As long as this condition is true, the loop\
    \ prints the current value of `i` and increments `i` by 1.\n\nAfter each iteration,\
    \ the loop checks the condition again. When `i` becomes 6, the condition `i <=\
    \ 5` is false, and the loop terminates. The program then moves on to the next\
    \ part (if any), or it ends.\n\nThis example shows a common usage of `while` loops—executing\
    \ a block of code repeatedly until a specific condition is no longer true. This\
    \ type of loop is useful when you do not know the exact number of iterations beforehand\
    \ but have a stopping condition.\n\n***\n\n## Do/While Loop\n\n### What is the\
    \ Do/While Loop?\n\nThe `do/while` loop is a variation of the `while` loop in\
    \ C++. Unlike the `while` loop, the `do/while` loop guarantees that the code block\
    \ inside the loop will execute at least once. This is because the condition is\
    \ evaluated after the loop’s code block has been executed, not before.\n\nThis\
    \ type of loop is useful when you need the loop’s code to run at least once, regardless\
    \ of whether the condition is true from the beginning. For example, when requesting\
    \ user input, you may want to ensure that the prompt is displayed at least once\
    \ before checking whether the input satisfies a specific condition.\n\nThe `do/while`\
    \ loop runs the code block and then checks the condition at the end of the loop.\
    \ If the condition is true, the loop runs again. If false, the loop terminates.\
    \ This type of loop provides a slightly different behavior from the standard `while`\
    \ loop, which might not run at all if the initial condition is false.\n\n### Syntax\n\
    \nThe basic syntax for a `do/while` loop in C++ is:\n\n```cpp\ndo {\n    // Code\
    \ to execute\n} while (condition);\n```\n\nThe `do` keyword marks the beginning\
    \ of the loop, and the code inside the curly braces is executed first. After the\
    \ code runs, the `while` statement checks the condition. If the condition is true,\
    \ the loop repeats; if false, the loop stops.\n\nThe key difference from the `while`\
    \ loop is that the code inside the `do` block will run at least once before the\
    \ condition is evaluated.\n\n### Syntax Explanation\n\nIn a `do/while` loop, the\
    \ code block is placed inside the `do` section, and the condition is evaluated\
    \ in the `while` section that follows the code. Unlike the `while` loop, where\
    \ the condition is checked first, the `do/while` loop runs the code before checking\
    \ the condition.\n\nThis means that even if the condition is false, the code inside\
    \ the `do` block will still execute at least once. After executing the block of\
    \ code, the program evaluates the condition. If the condition is true, the loop\
    \ will repeat, running the code again. If false, the loop terminates.\n\nThe `do/while`\
    \ loop is particularly useful when you need to guarantee that a block of code\
    \ runs at least once, such as when gathering user input or setting initial values\
    \ for a computation.\n\n### Code Example\n\nHere’s an example of a `do/while`\
    \ loop that prompts the user to guess a number until they guess correctly:\n\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    int number\
    \ = 7, guess;\n    do {\n        cout << \"Guess the number: \";\n        cin\
    \ >> guess;\n    } while (guess != number);\n    cout << \"Correct guess!\" <<\
    \ endl;\n    return 0;\n}\n```\n\nIn this example, the loop prompts the user to\
    \ guess a number. The loop continues until the user enters the correct guess.\n\
    \n### Code Walkthrough\n\nIn this program, the variable `number` is set to 7,\
    \ and the `guess` variable is used to store the user’s input. The program enters\
    \ the `do/while` loop, which first prompts the user to input a guess.\n\nAfter\
    \ each guess, the program checks whether the `guess` is equal to the `number`.\
    \ If the guess is incorrect, the loop runs again, asking for another guess. This\
    \ continues until the user guesses the correct number, at which point the loop\
    \ terminates, and the program prints \"Correct guess!\".\n\nThe key takeaway here\
    \ is that the prompt will always appear at least once, thanks to the nature of\
    \ the `do/while` loop.\n\n***\n\n## Notes\n\n- The `while` loop checks the condition\
    \ first and may not run if the condition is false initially.\n- The `do/while`\
    \ loop runs the code block at least once, regardless of the condition.\n- Infinite\
    \ loops can occur in both `while` and `do/while` loops if the condition never\
    \ becomes false. Always ensure that the condition will eventually be met.\n- Avoid\
    \ forgetting the update or change inside the loop that will make the condition\
    \ false. This is a common error with loops.\n\n***\n\n## Project 1: Print Numbers\
    \ with a While Loop\n\n### Description\n\nCreate a program that takes a number\
    \ from the user and prints all numbers from 1 up to that number.\n\n### Objective\n\
    \nTo practice using the `while` loop.\n\n### Instructions\n\n1. Prompt the user\
    \ for a number.\n2. Use a `while` loop to iterate from 1 to the input number.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int num,\
    \ i = 1;\n    cout << \"Enter a number: \";\n    cin >> num;\n    while (i <=\
    \ num) {\n        cout << i << endl;\n        i++;\n    }\n    return 0;\n}\n\
    ```\n\n### Code Walkthrough\n\nThe program initializes `i` to 1. The `while` loop\
    \ checks if `i` is less than or equal to `num`. If it is, it prints `i` and increments\
    \ `i`. This continues until `i` exceeds `num`.\n\n### Challenge\n\nModify the\
    \ program to print only even numbers.\n\n***\n\n## Project 2: Sum of Positive\
    \ Numbers\n\n### Description\n\nCreate a program that keeps taking input until\
    \ the user enters a negative number, then prints the sum of all positive numbers.\n\
    \n### Objective\n\nTo practice using the `do/while` loop.\n\n### Instructions\n\
    \n1. Use a `do/while` loop to continuously take input.\n2. Add only positive numbers\
    \ to the sum.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int num, sum = 0;\n    do {\n        cout << \"Enter a number (negative\
    \ to quit): \";\n        cin >> num;\n        if (num > 0) sum += num;\n    }\
    \ while (num >= 0);\n    cout << \"Total sum of positive numbers: \" << sum <<\
    \ endl;\n    return 0;\n}\n```\n\n### Code Walkthrough\n\nThe `do/while` ensures\
    \ the user is prompted at least once. If the input is positive, it is added to\
    \ `sum`. The loop terminates only when a negative number is entered.\n\n### Challenge\n\
    \nEnhance the program to count the total number of positive numbers entered.\n\
    \n***\n\n## End of Chapter Checklist\n\n- Understand the difference between `while`\
    \ and `do/while` loops.\n- Be able to write a `while` loop that repeats code based\
    \ on a condition.\n- Complete two projects to practice both `while` and `do/while`\
    \ loops.\n- Recognize common pitfalls such as infinite loops and forgetting to\
    \ update the loop condition.\n\n## Quiz\n\n1. How does a `do/while` loop differ\
    \ from a `while` loop?\n2. What is the risk of not including an update to the\
