  trans: "\nC 风格字符串是字符数组，最后一个字符是空终止符（`\\0`）。该空字符表示字符串的结束。C 风格字符串不像 `std::string` 那样灵活，因为它们不提供内置的用于函数，而且数组的大小在声明时就固定了。\n\
    \n操作 C 风格字符串时需要小心进行内存管理，因为超出数组边界可能会导致未定义行为。\n\n### 代码示例\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    char greeting[] = \"Hello\";\n   \
    \ cout << greeting << endl;\n    return 0;\n}\n```\n\n### 代码解析\n\n在此示例中，使用 `char[]`\
    \ 语法声明了一个 C 风格字符串。字符串 `\"Hello\"` 被存储在数组中，并在末尾自动添加空字符（`\\0`）。使用 `cout` 打印字符串。与\
    \ C++ 字符串相比，C 风格字符串需要更多的手动处理。\n\n### 注意事项\n\n除非必要，否则避免使用 C 风格字符串，因为它们缺乏 C++ 字符串的灵活性安全性。始终确保数组足够大以容纳字符串和空终止符。对于大多数字符串操作，优先使用\
    \ `std::string`。\n\n* * *\n\n### 项目\n\n* * *\n\n#### 项目 1：全名拼接\n\n**描述：**\n\n\
    编写一个程序，接收两个字符串作为输入（名和姓），并将它们拼接成全名。\n\n**目标：**\n\n练习字符串拼接和用户输入。\n\n**指令：**\n\n\
    1. 声明用于存储名和姓的两个 `string` 变量。\n2. 使用 `cin` 获取用户输入。\n3. 将两个字符串拼接为全名。\n4. 输出全名。\n\
    \n**代码：**\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    string firstName, lastName;\n    cout << \"Enter your first name: \"\
    ;\n    cin >> firstName;\n    cout << \"Enter your last name: \";\n    cin >>\
    \ lastName;\n    string fullName = firstName + \" \" + lastName;\n    cout <<\
    \ \"Your full name is: \" << fullName << endl;\n    return 0;\n}\n```\n\n**代码解析：**\n\
    \n在该程序中，会提示用户输入其名和姓。使用 `+` 运算符将两个字符串拼接，中间留有一个空格。结果打印到控制台。\n\n**挑战：**\n\n修改程序以使用\
    \ `getline()` 处理带有空格的全名。\n\n* * *\n\n#### 项目 2：句子中的字符计数\n\n**描述：**\n\n创建一个程序，接收一个句子作为输入，并计算该句子中的字符数量。\n\
    \n**目标：**\n\n学习计算字符串长度并处理多单词的输入。\n\n**指令：**\n\n1. 使用 `getline()` 捕获完整的句子作为输入。\n\
    2. 计算句子的长度。\n3. 输出字符计数。\n\n**代码：**\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\n    string sentence;\n    cout << \"Enter a sentence:\
    \ \";\n    getline(cin, sentence);\n    cout << \"The number of characters in\
    \ the sentence is: \" << sentence.length() << endl;\n    return 0;\n}\n```\n\n\
    **代码解析：**\n\n该程序使用 `getline()` 接收完整的句子作为输入。然后使用 `.length()` 函数计算字符串中的字符数，并打印结果。\n\
    \n**挑战：**\n\n修改程序以仅统计字母字符，忽略空格和标点符号。\n\n* * *\n\n### 章节结束清单\n\n* 理解如何在 C++ 中声明和操作字符串。\n\
    * 练习字符串拼接、访问字符以及处理特殊字符。\n* 知道在何时使用 `cin` 还是 `getline()` 进行输入。\n\n* * *\n\n###\
    \ 测验\n\n1. 用于字符串输入时，`cin` 和 `getline()` 有什么区别？\n2. 在 C++ 中如何拼接两个字符串？\n3. 你可以使用什么函数来查找字符串的长度？\n\
    \n* * *\n\n### 术语表\n\n* **字符串 (String)**：用于存储文本的字符序列。\n* **拼接 (Concatenation)**：将两个或多个字符串合并为一个。\n\
    * **转义序列 (Escape Sequence)**：字符串中执行特定功能的特殊字符，例如用于换行的 `\\n`。\n* **C 风格字符串 (C-Style\
    \ String)**：用于 C 语言的空终止字符数组。\n\n# 第 11 章 C++ 数学\n\n* * *\n\n### 什么是 C++ 数学？\n\n\
    C++ 提供了多种内置数学函数，允许程序员轻松地进行复杂计算。这些函数可用 `<cmath>` 库提供，范围从基础算术函数到更高级的三角函数、对数和幂函数。无论你是在计算圆的面积、确定一个数字的平方根，还是寻找列表中的最大值，C++\
    \ 数学函数都是处理数值计算的价值工具。\n\nC++ 中的数学函数确保了处理数字时的精确性和效率。常见的数学函数包括：\n\n* `max()` 和 `min()`\
    \ 用于比较值。\n* `sqrt()` 用于计算平方根。\n* `pow()` 用于幂运算。这些函数允许你编写简洁、可靠的代码，同时避免了手动实现复杂数学运算的需求。对于任何从事计算任务的人来说，理解并使用\
    \ C++ 数学库都是关重要的。\n\n* * *\n\n### 最大/最小值\n\n#### C++ 中的 Max 和 Min 函数是什么？\n\nC++\
    \ 中的 `max()` 和 `min()` 函数用于比较两个或多个值并分别返回最大值或最小值。这些函数在需要在一组值中寻找最大或最小数字的场景非常有用。例如，在统计计算或管理数据集时，寻找最大值或最小值是一个常见需求。\n\
    \n`max()` 函数返回两个值中的较大者，而 `min()` 返回较小者。\n\n#### 语法\n\n使用 `max()` 和 `min()` 的语法非常简单：\n\
    \n`max(a, b)`\n\n`min(a, b)`\n\n其中 `a` 和 `b` 可以是任何数值值。\n\n#### 语法解释\n\n`max()`\
    \ 和 `min()` 函数接受两个参数并比较它们。这些函数是 `<algorithm>` 库的一部分，必须在程序开头包含它。\n\n例如：\n\n```cpp\n\
    #include <algorithm>\nint largest = max(10, 20); // largest 将为 20\nint smallest\
    \ = min(5, 3); // smallest 将为 3\n```\n\n#### 代码示例\n\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n\nusing namespace std;\n\nint main() {\n    int num1 = 10,\
    \ num2 = 25, num3 = 15;\n    int maxVal = max(max(num1, num2), num3);\n    int\
    \ minVal = min(min(num1, num2), num3);\n\n    cout << \"Maximum value: \" << maxVal\
    \ << endl;\n    cout << \"Minimum value: \" << minVal << endl;\n    return 0;\n\
    }\n```\n\n### 代码解析\n\n在此程序中，我们定义了三个整数：`num1`、`num2` 和 `num3`。`max()` 函数使用了两次来比较所有值并找到最大值，而\
    \ `min()` 函数同样用于寻找最小值。结果分别存储在 `maxVal` 和 `minVal` 中。\n\n### 注意事项\n\n在使用 `max()`\
    \ 和 `min()` 时，确保你所比较的所有值具有相同的数据类型，以避免隐式类型转换，这可能会导致意想不到的结果。这些函数非常高效，非常适合寻找数据集中的极值。然而，如果你需要寻找两个值以上的最大值或最小值，你可能需要嵌套这些函数，或者对数组或向量使用其他算法如\
    \ `std::max_element()` 或 `std::min_element()`。\n\n* * *\n\n### 项目\n\n* * *\n\n\
    #### 项目 1：三个数的最值\n\n**描述：**\n\n编写一个程序，使用 `max()` 和 `min()` 函数找到并打印三个数的最大值最小值。\n\
    \n**目标：**\n\n学习使用 `max()` 和 `min()` 函数比较多个值。\n\n**指令：**\n\n1. 声明三个用于存储输入数字的整数变量。\n\
    \n"
