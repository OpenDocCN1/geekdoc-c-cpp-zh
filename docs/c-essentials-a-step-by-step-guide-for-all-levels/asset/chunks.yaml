    #include <map>


    int main() {


    std::map<std::string, int> ageMap;


    ageMap["Alice"] = 25;


    ageMap["Bob"] = 30;


    for (auto const& pair : ageMap) {


    std::cout << pair.first << ": " << pair.second << std::endl;


    }


    return 0;


    }


    Code Walkthrough


    In this example, a map is used to store names and corresponding ages. The map
    automatically keeps the names sorted. The loop iterates over the map and prints
    each name along with its associated age.


    Notes


    *   Use maps when you need to associate values with unique keys.


    *   Maps automatically keep the keys in sorted order.


    *   Prefer  unordered_map for faster access when the order of keys doesn’t matter.


    * * *


    Iterators


    What are Iterators in C++? 


    Iterators in C++ are objects that allow you to traverse elements in data structures
    like vectors, lists, sets, and maps. They provide a uniform way to access elements,
    regardless of the underlying container.


    Iterators are used to loop through collections without exposing their internal
    representation. They are useful for performing operations on containers like modifying
    elements or iterating through a range of elements.


    Syntax


    #include <vector>


    std::vector<int>::iterator it;


    This example shows how to declare an iterator for a vector of integers. You can
    initialize the iterator to point to the start or end of the vector.


    Syntax Explanation


    Common iterator methods:


    *   begin(): Points to the first element.


    *   end(): Points just past the last element.


    *   ++it: Moves the iterator to the next element.


    *   *it: Accesses the element at the iterator’s position.


    Iterators provide a consistent way to traverse containers, whether you''re using
    vectors, sets, or maps. They also allow read and write access to the elements.


    Code Example


    #include <iostream>


    #include <vector>


    int main() {


    std::vector<int> numbers = {1, 2, 3, 4};


    for (std::vector<int>::iterator it = numbers.begin(); it != numbers.end(); ++it)
    {


    std::cout << *it << std::endl;


    }


    return 0;


    }


    Code Walkthrough


    This program uses an iterator to traverse a vector of integers. The iterator  it
    starts at the beginning of the vector and moves to the end using  ++it. Each element
    is accessed using  *it, and the elements are printed.


    Notes


    *   Iterators provide a flexible way to traverse different containers.


    *   Always use  end() as the termination point for iterators to avoid accessing
    elements out of bounds.


    *   Iterators are powerful when you need to access or modify container elements
    in a loop.


    * * *


    Project 1: Write a Program Using Vectors to Store and Print Student Marks


    Objective


    Create a program that uses a vector to store student marks and prints them. This
    project helps you practice using vectors and loops.


    Instructions


    *   Create a vector to store integer marks.


    *   Use a loop to add marks to the vector.


    *   Iterate over the vector and print each mark.


    Code


    #include <iostream>


    #include <vector>


    int main() {


    std::vector<int> marks = {85, 90, 78, 92};


    for (int mark : marks) {


    std::cout << mark << std::endl;


    }


    return 0;


    }


    Code Walkthrough


    This program initializes a vector with four student marks. It then uses a  for
    loop to iterate through the vector and print each mark to the console.


    Challenge


    Enhance the program by allowing the user to input the student marks instead of
    hardcoding them.


    * * *


    Project 2: Create a Program Using a Map to Store and Display Names and Ages


    Objective


    Write a program that uses a map to store and display the names and ages of people.
    This project helps you practice working with key-value pairs.


    Instructions


    *   Create a map with string keys (names) and integer values (ages).


    *   Add several key-value pairs to the map.


    *   Iterate over the map and display each name with its associated age.


    Code


    #include <iostream>


    #include <map>


    int main() {


    std::map<std::string, int> people;


    people["Alice"] = 25;


    people["Bob"] = 30;


    people["Charlie"] = 22;


    for (auto const& pair : people) {


    std::cout << pair.first << ": " << pair.second << std::endl;


    }


    return 0;


    }


    Code Walkthrough


    This program creates a map to store names and ages. It then uses a  for loop to
    iterate over the map and print each name with its corresponding age.


    Challenge


    Allow the user to input names and ages instead of hardcoding them.


    * * *


    End of Chapter Checklist


    *   Understand basic data structures like vectors, lists, stacks, queues, and
    maps.


    *   Practice writing programs that use STL containers.


    *   Ensure you can explain the differences between each data structure.


    *   Review code examples and modify them to reinforce your understanding.


    * * *


    Quiz


    1.  What is the difference between a vector and a list in C++?


    2.  What method would you use to add an element to the end of a deque?


    3.  How does a map store elements in C++?


    4.  What is the time complexity of inserting an element into a set?


    * * *


    Glossary


    *   Vector: A dynamic array that can grow or shrink in size.


    *   List: A doubly linked list for efficient insertions and deletions.


    *   Stack: A LIFO data structure for last-in, first-out operations.


    *   Queue: A FIFO data structure for first-in, first-out processing.


    *   Map: A key-value pair data structure where keys are unique.


    Chapter 28\. C++ Algorithms


    What are Algorithms in C++? 


    Algorithms in C++ are step-by-step instructions or procedures used to solve specific
    problems or perform tasks. They are fundamental to programming because they define
    how a problem is tackled, from sorting data to searching for specific elements
    in a collection. Efficient algorithms lead to faster and more optimized programs,
    which is especially important when working with large data sets or time-critical
    applications.


    C++ provides various built-in algorithms as part of the Standard Template Library
    (STL), which can be used for sorting, searching, and manipulating data. Understanding
    algorithms is key to becoming an effective problem solver, as they help in optimizing
    code performance and reducing resource usage. Algorithms are widely used in fields
    such as computer science, engineering, and data science.


    * * *


    Sorting Algorithms


    What is Sorting in C++? 


    Sorting is the process of arranging data in a specific order, typically ascending
    or descending. Sorting algorithms in C++ are critical for organizing data efficiently,
    making it easier to search, analyze, or display. Common sorting algorithms include
    bubble sort, quick sort, merge sort, and insertion sort.


    Each sorting algorithm has its own use case. For example, bubble sort is simple
    but inefficient for large data sets, while quicksort is highly efficient but more
    complex. Sorting helps in reducing the complexity of other operations, such as
    searching, since sorted data can be processed faster using binary search techniques.


    Understanding the differences between these algorithms helps in choosing the most
    efficient one for a particular problem.


    Syntax


    #include <algorithm>


    std::sort(array, array + size);


    This syntax uses the built-in  std::sort function from the Standard Template Library
    (STL) to sort an array in ascending order. You can also implement custom sorting
    algorithms like bubble sort or quicksort from scratch for learning purposes.


