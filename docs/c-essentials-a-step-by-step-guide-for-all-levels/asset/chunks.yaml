    \ smart pointers.\n- Document the exceptions that functions might throw, so users\
    \ of the function know what errors to expect.\n\n# Project 1: Divide Two Numbers\
    \ with Exception Handling\n\n- **Objective**: Write a program that divides two\
    \ numbers and handles the case where division by zero occurs using a `try-catch`\
    \ block.\n- **Instructions**: Create a program that takes two numbers as input,\
