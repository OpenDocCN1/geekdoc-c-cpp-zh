    1.  What is function overloading?


    2.  How does the compiler decide which overloaded function to call?


    3.  Can two overloaded functions have the same parameter types but different return
    types?


    Glossary


    *   Function Overloading: A feature that allows multiple functions with the same
    name but different parameter lists to be defined.


    *   Parameter List: The list of parameters a function accepts. Overloaded functions
    must differ in the number or types of parameters.


    *   Compiler: The software that translates C++ code into machine code. It determines
    which version of an overloaded function to use based on the argument types passed.


    Chapter 22\. C++ Scope 


    What is Scope in C++? 


    In C++, the scope of a variable defines where the variable can be accessed or
    used in a program. Scope determines the visibility and lifetime of variables,
    which is crucial for managing memory, avoiding conflicts, and ensuring program
    logic works correctly.


    There are three main types of scope in C++:


    *   Local Scope: Variables declared within a function or block are local to that
    function or block. They can only be accessed within that specific area and are
    destroyed once the function or block completes execution.


    *   Global Scope: Variables declared outside of all functions are global. They
    can be accessed from anywhere in the program, making them useful for values that
    need to be shared across multiple functions.


    *   Static Scope: A static variable retains its value between function calls,
    even though it is local to a function. This means it persists in memory for the
    lifetime of the program but is only visible inside the function.


    Understanding scope is critical for managing memory efficiently and avoiding errors
    caused by unintended variable access or overwriting.


    Syntax


    Here’s how you define variables with different scopes in C++:


    int globalVar = 10; // Global scope


    void exampleFunction() {


    int localVar = 5; // Local scope


    static int staticVar = 0; // Static scope


    }


    *   Global variables are declared outside any function, making them accessible
    throughout the program.


    *   Local variables are declared inside a function or block, and they are only
    accessible within that scope.


    *   Static variables retain their value between function calls and persist throughout
    the program, even though their visibility remains local to the function.


    Syntax Explanation


    1.  Local Scope: Variables declared inside functions or blocks, such as loops
    or conditionals, have local scope. They are only accessible within the function
    or block where they are declared and are destroyed once the function or block
    completes execution. For example,  int localVar = 5; is only accessible within  exampleFunction.


    2.  Global Scope: Global variables are declared outside all functions, usually
    at the beginning of the program. These variables can be accessed by any function,
    allowing shared data throughout the program. For example,  int globalVar = 10;
    can be used anywhere in the program.


    3.  Static Scope: Static variables retain their value between function calls.
    They are initialized only once and persist in memory throughout the lifetime of
    the program, although their visibility remains limited to the function. For example,  static
    int staticVar = 0; in  exampleFunction will keep its value between function calls.


    Code Example


    Here’s a simple C++ program that demonstrates different scopes:


    #include <iostream>


    using namespace std;


    int globalVar = 10; // Global variable


    void exampleFunction() {


    int localVar = 5; // Local variable


    static int staticVar = 0; // Static variable


    staticVar++; // Increment static variable


    cout << "Local variable: " << localVar << ", Static variable: " << staticVar <<
    endl;


    }


    int main() {


    exampleFunction();


    exampleFunction();


    cout << "Global variable: " << globalVar << endl;


    return 0;


    }


    Code Walkthrough


    1.  Global Variable:  globalVar is declared outside all functions, making it accessible
    throughout the program. It is printed in the  main() function.


    2.  Local Variable:  localVar is declared inside  exampleFunction(). It is initialized
    each time the function is called and destroyed when the function exits.


    3.  Static Variable:  staticVar is initialized only once, even though it is declared
    inside  exampleFunction(). Its value is incremented each time the function is
    called, and it retains its value between function calls.


    4.  Function Calls: The function  exampleFunction() is called twice in the  main()
    function. During the first call,  staticVar is 0 and is incremented to 1\. In
    the second call, it retains its value and increments to 2, demonstrating the persistent
    nature of static variables.


    This example illustrates how scope affects the visibility and lifetime of variables
    in a C++ program.


    Notes


    When managing variable scope, follow these best practices:


    *   Use local variables whenever possible to limit their accessibility and reduce
    memory usage. This helps avoid unintended side effects from global variables being
    modified in unexpected ways.


    *   Reserve global variables for cases where data must be shared across multiple
    functions. Be cautious with global variables as they increase the complexity of
    debugging and maintenance.


    *   Use static variables for values that need to persist across function calls
    but remain hidden from the rest of the program. They are useful for counters or
    maintaining state within a function.


    Project 1: Demonstrating Local and Global Variables


    *   Objective: Write a program that demonstrates the use of local and global variables.


    *   Instructions: Create a global variable, and inside a function, create a local
    variable. Show how the global variable is accessible throughout the program, while
    the local variable is only accessible within the function.


    Code:


    #include <iostream>


    using namespace std;


    int globalCount = 0; // Global variable


    void incrementGlobal() {


    globalCount++;


    int localCount = 0; // Local variable


    localCount++;


    cout << "Global count: " << globalCount << ", Local count: " << localCount <<
    endl;


    }


    int main() {


    incrementGlobal();


    incrementGlobal();


    cout << "Global count in main: " << globalCount << endl;


    return 0;


    }


    *   Code Walkthrough: The global variable  globalCount is incremented and retains
    its value between function calls. The local variable  localCount is reinitialized
    each time  incrementGlobal() is called.


    *   Challenge: Modify the program to add another function that also modifies the
    global variable.


    Project 2: Counting Function Calls with Static Variables


    *   Objective: Create a program that uses static variables to count how many times
    a function is called.


    *   Instructions: Write a function that includes a static variable to count the
    number of times it has been called. The function should increment the static variable
    each time it is invoked and print the current count.


    Code:


    #include <iostream>


    using namespace std;


    void countCalls() {


    static int callCount = 0; // Static variable


    callCount++;


    cout << "Function called " << callCount << " times" << endl;


    }


    int main() {


    countCalls();


    countCalls();


    countCalls();


    return 0;


    }


    *   Code Walkthrough: The static variable  callCount is initialized once and retains
    its value between function calls. The function prints the number of times it has
    been called each time it is invoked.


    *   Challenge: Modify the program to count the number of times two different functions
    are called using static variables.


    End of Chapter Checklist


    *   Understand the difference between local, global, and static scope in C++.


    *   Practice using local variables for function-specific tasks and global variables
    for shared data.


    *   Learn how static variables retain their values between function calls and
    how they are useful for keeping track of persistent data within functions.


