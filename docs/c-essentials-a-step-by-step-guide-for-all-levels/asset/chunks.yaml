  trans: "\n\n在 C++ 中，传递参数有两种主要方式：按值传递和引用传递。当按值传递参数时，函数接收的是参数的副本，因此函数内部对参数所做的修改不会影响原始变量。相反，按引用传递允许函数直接修改原始变量。\n\
    \n函数参数允许你编写灵活、可重用的代码。你不需要硬编码值，而是在每次调用函数时传递不同的参数，使函数能够适应各种情况。\n\n## 语法\n\n定义函数参数的语法如下：\n\
    \n```cpp\nreturn_type function_name(data_type parameter1, data_type parameter2)\
    \ {\n    // function body\n}\n```\n\n例如：\n\n```cpp\nint add(int a, int b) {\n\
    \    return a + b;\n}\n```\n\n在这个示例中，`a` 和 `b` 是 `int` 参数，它们在调用函数时被传递给函数。\n\n\
    ### 语法说明\n\n1. `data_type`: 这指定参数的类型，例如 `int`、`float` 或 `string`。每个参数都必须有一个定义的数据类型。\n\
    2. `parameter name`: 参数本质上是函数内部使用的变量。参数名称应该是具有描述性的，以便清晰表达它们代表什么类型的数据。\n3. `Multiple\
    \ parameters`: 一个函数可以接受多个参数，并用逗号分隔。例如，`int a, int b` 允许函数接受两个整数值。\n4. `Passing\
    \ arguments`: 当调用函数时，传递给函数的值（称为参数）会被赋值给相应的参数。例如，调用 `add(3, 5)` 将 `3` 赋值给 `a`，将\
    \ `5` 赋值给 `b`。\n\n函数参数允许你向函数传递动态值，使其变得可重用，并且能够在不修改自身的情况下处理不同的输入。\n\n## 代码示例\n\n\
    这是一个演示如何向函数传递参数的示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    void printSum(int a, int b) {\n    int sum = a + b;\n    cout << \"Sum: \" <<\
    \ sum << endl;\n}\n\nint main() {\n    printSum(10, 20);\n    return 0;\n}\n```\n\
    \n### 代码解读\n\n1. **Function Definition**: 函数 `printSum` 接收两个 `int` 类型的参数，`a` 和\
    \ `b`。\n2. **Function Body**: 在函数内部，计算 `a` 和 `b` 的和并存储在变量 `sum` 中。然后打印结果。\n3.\
    \ **Function Call**: 在 `main` 函数中，调用了 `printSum(10, 20)`。值 `10` 和 `20` 被传递给函数，并在那里被相加。\n\
    4. **Output**: 函数计算 `10` 和 `20` 的和并打印 `Sum: 30`。\n\n此程序演示了函数如何使用参数动态处理不同的输入，使代码更加灵活和可重用。\n\
    \n## 引用传递\n\n### 什么是引用传递？\n\n引用传递是一种方法，函数接收的是原始变量的引用而非副本。这允许函数修改调用代码中使用的实际变量。与按值传递（创建变量副本）不同，引用传递直接在原始变量上操作。\n\
    \n在 C++ 中，你通过在函数参数列表中使用 `&` 符号来按引用传递参数。这告诉函数通过变量的内存地址工作，使得函数内部的任何更改都会影响原始变量。\n\
    \n在处理大型数据结构或当你希望函数修改原始变量而不返回新值时，引用传递特别别用。它还能通过避免复制大量数据的开销来提高性能。\n\n### 语法\n\n\
    按引用传递参数的语法如下：\n\n```cpp\nvoid function_name(data_type &parameter) {\n    // function\
    \ body\n}\n```\n\n例如：\n\n```cpp\nvoid increment(int &a) {\n    a++;\n}\n```\n\n\
    在这个示例中，`a` 是按引用传递的，因此传递给函数的原始变量被直接修改。\n\n### 语法说明\n\n1. `data_type`: 这指定了被传递参数的类型，例如\
    \ `int`、`float` 或 `string`。\n2. `& symbol`: 参数名前的 `&` 符号表示参数按引用传递。这意味着函数将通过变量的内存地址工作，而不是其值的副本。\n\
    3. `Modifying the original variable`: 当参数按引用传递时，函数内部对其对其的任何更改都会影响调用代码中的原始变量。例如，如果函数修改了引用参数，传递给函数的原始值将发生改变。\n\
    \n引用传递是 C++ 中一种强大的技术，允许函数修改原始变量，并在处理大型数据时提高效率。\n\n### 代码示例\n\n这是一个演示按引用传递参数的示例：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid increment(int &a)\
    \ {\n    a++;\n}\n\nint main() {\n    int num = 10;\n    increment(num);\n   \
    \ cout << \"Incremented number: \" << num << endl;\n    return 0;\n}\n```\n\n\
    ### 代码解读\n\n1. **Function Definition**: 函数 `increment` 接收一个按引用传递的整数参数 (`int &a`)。\n\
    2. **Function Body**: 在函数内部，参数 `a` 递增 1。由于 `a` 是按引用传递的，因此原始变量被直接修改。\n3. **Function\
    \ Call**: 在 `main` 函数中，调用了 `increment(num)`。值 `num` 被传递给函数，并在那里被相加。\n4. **Output**:\
    \ 函数计算 `10` 和 `20` 的和并打印 `Sum: 30`。\n\n此程序演示了函数如何使用参数动态处理不同的输入，使代码更加灵活和可重用。\n\n\
    ## 引用传递\n\n### 什么是引用传递？\n\n引用传递是一种方法，函数接收的是原始变量的引用而非副本。这允许函数修改调用代码中使用的实际变量。与按值传递（创建变量副本）不同，引用传递直接在原始变量上操作。\n\
    \n在 C++ 中，你通过在函数参数列表中使用 `&` 符号来按引用传递参数。这告诉函数通过变量的内存地址工作，使得函数内部的任何更改都会影响原始变量。\n\
    \n在处理大型数据结构或当你希望函数修改原始变量而不返回新值时，引用传递特别有用。它还能通过避免复制大量数据的开销来提高性能。\n\n### 语法\n\n\
    按引用传递参数的语法如下：\n\n```cpp\nvoid function_name(data_type &parameter) {\n    // function\
    \ body\n}\n```\n\n例如：\n\n```cpp\nvoid increment(int &a) {\n    a++;\n}\n```\n\n\
    在这个示例中，`a` 是按引用传递的，因此传递给函数的原始变量被直接修改。\n\n### 语法说明\n\n1. `data_type`: 这指定了被传递参数的类型，例如\
    \ `int`、`float` 或 `string`。\n2. `& symbol`: 参数名前的 `&` 符号表示参数按引用传递。这意味着函数将通过变量的内存地址工作，而不是其值的副本。\n\
    3. `Modifying the original variable`: 当参数按引用传递时，函数内部对其对其的任何更改都会影响调用代码中的原始变量。例如，如果函数修改了引用参数，传递给函数的原始值将发生改变。\n\
    \n引用传递是 C++ 中一种强大的技术，允许函数修改原始变量，并在处理大型数据时提高效率。\n\n### 代码示例\n\n这是一个演示按引用传递参数的示例：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid increment(int &a)\
    \ {\n    a++;\n}\n\nint main() {\n    int num = 10;\n    increment(num);\n   \
    \ cout << \"Incremented number: \" << num << endl;\n    return 0;\n}\n```\n\n\
    ### 代码解读\n\n1. **Function Definition**: 函数 `increment` 接收一个按引用传递的整数参数 (`int &a`)。\n\
    2. **Function Body**: 在函数内部，参数 `a` 递增 1。由于 `a` 是按引用传递的，因此原始变量被直接修改。\n3. **Function\
    \ Call**: 在 `main` 函数中，调用了 `increment(num)`。值 `num` 被传递给函数，并在那里被相加。\n4. **Output**:\
    \ 函数计算 `10` 和 `20` 的和并打印 `Sum: 30`。\n\n此程序演示了函数如何使用参数动态处理不同的输入，使代码更加灵活和可重用。\n\n\
    （注：由于原文文本中存在部分重复内容，译文已根据要求保持了逻辑一致的翻译）\n\n## 注意事项\n\n在决定在 C++ 中按值还是引用传递参数时，考虑以下最佳实践：\n\
    \n* 当不需要修改原始变量时使用按值传递，确保函数与副本工作。\n* 当你想修改原始变量或处理大型数据结构时使用引用传递，避免复制大量数据的开销。\n*\
    \ 谨慎使用引用传递，因为它可能会导致意外的修改。\n\n## 项目 1：计算阶乘\n\n* **目标**: 编写一个计算用户输入的数字阶乘的程序。\n*\
    \ **指令**: 创建一个 `factorial` 函数，接收一个整数并返回其阶乘。\n\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\nint factorial(int n) {\n    if (n == 0) return 1;\n  \
    \  return n * factorial(n - 1);\n}\n\nint main() {\n    int num;\n    cout <<\
    \ \"输入一个数字: \";\n    cin >> num;\n    cout << num << \" 的阶乘是: \" << factorial(num)\
    \ << endl;\n    return 0;\n}\n```\n\n* **代码解读**: `factorial` 函数通过将数字乘以上一个数字的阶乘来递归地计算阶乘。基准情况是\
    \ `n == 0`，返回 1。\n\n## 项目 2：两个数中的最大值\n\n* **目标**: 创建一个定义函数来查找两个数字最大值的程序。\n* **指令**:\
    \ 编写一个 `maxValue` 函数，接收两个整数作为输入并返回较大的一个。\n\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\nint maxValue(int a, int b) {\n    return (a > b) ? a : b;\n\
    }\n\nint main() {\n    int x, y;\n    cout << \"输入两个数字: \";\n    cin >> x >> y;\n\
    \    cout << \"最大值是: \" << maxValue(x, y) << endl;\n    return 0;\n}\n```\n\n\
    * **代码解读**: `maxValue` 函数比较两个整数并使用条件运算符返回较大的一个。\n\n## 章节结束清单\n\n* 理解函数在 C++ 中如何工作以及如何定义它们。\n\
    * 学习按值传递和引用传递参数的区别。\n* 练习编写执行特定任务的可重函数，例如计算阶乘或查找两个数中的最大值。\n\n## 测验\n\n1. 按值传递参数和引用传递参数有什么区别？\n\
