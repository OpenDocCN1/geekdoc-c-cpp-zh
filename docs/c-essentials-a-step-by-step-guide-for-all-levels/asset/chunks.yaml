    \n- **While Loop**: A control structure that repeatedly executes a block of code\
    \ as long as a given condition is true.\n- **Do/While Loop**: A variation of the\
    \ `while` loop that guarantees at least one execution of the code block before\
    \ evaluating the condition.\n- **Condition**: An expression evaluated by the loop\
    \ to determine whether to continue or terminate the loop.\n- **Infinite Loop**:\
    \ A loop that never terminates because its condition is always true.\n\nChapter\
    \ 16. C++ For Loop\n"
  raw: 'One key feature of the  while loop is that it may never run if the condition
    is false initially. This characteristic is important when you need to ensure that
    the code only runs under specific conditions. Additionally, you must ensure that
    the condition eventually becomes false; otherwise, the loop will run indefinitely,
    creating an infinite loop.


    Code Example


    Here’s a simple example of a  while loop that prints numbers from 1 to 5:


    #include <iostream>


    using namespace std;


    int main() {


    int i = 1;


    while (i <= 5) {


    cout << i << endl;


    i++;


    }


    return 0;


    }


    In this program, the variable  i starts at 1\. The  while loop checks if  i is
    less than or equal to 5\. If so, it prints the value of  i and increments  i.
    The loop continues until  i exceeds 5.


    Code Walkthrough


    In the example above, the variable  i is initialized to 1\. The  while loop checks
    whether  i is less than or equal to 5\. As long as this condition is true, the
    loop prints the current value of  i and increments  i by 1.


    After each iteration, the loop checks the condition again. When  i becomes 6,
    the condition  i <= 5 is false, and the loop terminates. The program then moves
    on to the next part (if any), or it ends.


    This example shows a common usage of  while loops—executing a block of code repeatedly
    until a specific condition is no longer true. This type of loop is useful when
    you do not know the exact number of iterations beforehand but have a stopping
    condition.


    * * *


    Do/While Loop


    What is the Do/While Loop? 


    The  do/while loop is a variation of the  while loop in C++. Unlike the  while
    loop, the  do/while loop guarantees that the code block inside the loop will execute
    at least once. This is because the condition is evaluated after the loop’s code
    block has been executed, not before.


    This type of loop is useful when you need the loop’s code to run at least once,
    regardless of whether the condition is true from the beginning. For example, when
    requesting user input, you may want to ensure that the prompt is displayed at
    least once before checking whether the input satisfies a specific condition.


    The  do/while loop runs the code block and then checks the condition at the end
    of the loop. If the condition is true, the loop runs again. If false, the loop
    terminates. This type of loop provides a slightly different behavior from the
    standard  while loop, which might not run at all if the initial condition is false.


    Syntax


    The basic syntax for a  do/while loop in C++ is:


    do {


    // Code to execute


    } while (condition);


    The  do keyword marks the beginning of the loop, and the code inside the curly
    braces is executed first. After the code runs, the  while statement checks the
    condition. If the condition is true, the loop repeats; if false, the loop stops.


    The key difference from the  while loop is that the code inside the  do block
    will run at least once before the condition is evaluated.


    Syntax Explanation


    In a  do/while loop, the code block is placed inside the  do section, and the
    condition is evaluated in the  while section that follows the code. Unlike the  while
    loop, where the condition is checked first, the  do/while loop runs the code before
    checking the condition.


    This means that even if the condition is false, the code inside the  do block
    will still execute at least once. After executing the block of code, the program
    evaluates the condition. If the condition is true, the loop will repeat, running
    the code again. If false, the loop terminates.


    The  do/while loop is particularly useful when you need to guarantee that a block
    of code runs at least once, such as when gathering user input or setting initial
    values for a computation.


    Code Example


    Here’s an example of a  do/while loop that prompts the user to guess a number
    until they guess correctly:


    #include <iostream>


    using namespace std;


    int main() {


    int number = 7, guess;


    do {


    cout << "Guess the number: ";


    cin >> guess;


    } while (guess != number);


    cout << "Correct guess!" << endl;


    return 0;


    }


    In this example, the loop prompts the user to guess a number. The loop continues
    until the user enters the correct guess.


    Code Walkthrough


    In this program, the variable  number is set to 7, and the  guess variable is
    used to store the user’s input. The program enters the  do/while loop, which first
    prompts the user to input a guess.


    After each guess, the program checks whether the guess is equal to the number.
    If the guess is incorrect, the loop runs again, asking for another guess. This
    continues until the user guesses the correct number, at which point the loop terminates,
    and the program prints "Correct guess!"


    The key takeaway here is that the prompt will always appear at least once, thanks
    to the nature of the  do/while loop.


    * * *


    Notes


    *   The  while loop checks the condition first and may not run if the condition
    is false initially.


    *   The  do/while loop runs the code block at least once, regardless of the condition.


    *   Infinite loops can occur in both  while and  do/while loops if the condition
    never becomes false. Always ensure that the condition will eventually be met.


    *   Avoid forgetting the update or change inside the loop that will make the condition
    false. This is a common error with loops.


    * * *


    Project 1: Print Numbers with a While Loop


    Description


    Create a program that takes a number as input and prints all numbers from 1 to
    that number using a  while loop.


    Objective


    To practice using the  while loop to iterate and print values.


    Instructions


    1.  Prompt the user to input a number.


    2.  Use a  while loop to print numbers from 1 to the user’s number.


    Code


    #include <iostream>


    using namespace std;


    int main() {


    int num, i = 1;


    cout << "Enter a number: ";


    cin >> num;


    while (i <= num) {


    cout << i << endl;


    i++;


    }


    return 0;


    }


    Code Walkthrough


    This code takes a number as input from the user and prints all numbers from 1
    to that number using a  while loop.


    Challenge


    Modify the program to print only even numbers.


    * * *


    Project 2: Sum of Positive Numbers


    Description


    Create a program that keeps taking user input until the user enters a negative
    number, then prints the sum of all positive numbers entered.


    Objective


    To practice using  while loops to manage user input and sum values.


    Instructions


    1.  Continuously take input from the user.


    2.  Add only positive numbers to the sum.


    3.  Stop when the user enters a negative number and print the sum.


    Code


    #include <iostream>


    using namespace std;


    int main() {


    int num, sum = 0;


    do {


    cout << "Enter a number (negative to quit): ";


    cin >> num;


    if (num > 0) sum += num;


    } while (num >= 0);


    cout << "Total sum of positive numbers: " << sum << endl;


    return 0;


    }


    Code Walkthrough


    The program continues to ask for numbers. It adds positive numbers to the sum,
    stopping when a negative number is entered.


    Challenge


    Enhance the program to count the total number of positive numbers entered.


    * * *


    End of Chapter Checklist


    *   Understand the difference between  while and  do/while loops.


    *   Be able to write a  while loop that repeats code based on a condition.


    *   Complete two projects to practice both  while and  do/while loops.


    *   Recognize common pitfalls such as infinite loops and forgetting to update
    the loop condition.


    * * *


    Quiz


    1.  How does a  do/while loop differ from a  while loop?


    2.  What is the risk of not including an update to the loop’s condition?


    3.  Can a  while loop run zero times? Explain.


    * * *


    Glossary


    *   While Loop: A control structure that repeatedly executes a block of code as
    long as a given condition is true.


    *   Do/While Loop: A variation of the  while loop that guarantees at least one
    execution of the code block before evaluating the condition.


    *   Condition: An expression evaluated by the loop to determine whether to continue
    or terminate the loop.


    *   Infinite Loop: A loop that never terminates because its condition is always
    true.


