    \ the C++ date/time functions.\n- **Instructions**: Use the `ctime` library to\
    \ retrieve the current system time and display it in a readable format.\n\nCode:\n\
    ```cpp\n#include <iostream>\n#include <ctime>\n\nusing namespace std;\n\nint main()\
    \ {\n    time_t currentTime = time(0);\n    tm *localTime = localtime(&currentTime);\n\
    \    cout << \"Current Date and Time: \" << asctime(localTime);\n    return 0;\n\
    }\n```\n\n- **Code Walkthrough**: The program retrieves the current system time\
    \ using `time(0)`, converts it to local time using `localtime()`, and prints the\
    \ result using `asctime()`.\n- **Challenge**: Modify the program to format the\
    \ output as \"YYYY-MM-DD HH:MM\" using `strftime()`.\n\n## Project 2: Calculate\
    \ the Difference Between Two Dates\n\n- **Objective**: Create a program that calculates\
    \ the difference between two dates entered by the user.\n- **Instructions**: Write\
    \ a program that prompts the user for two dates and calculates the number of days\
    \ between them using the `ctime` or `chrono` library.\n\nCode:\n```cpp\n#include\
    \ <iostream>\n#include <ctime>\n\nusing namespace std;\n\nint main() {\n    tm\
    \ date1 = {0}, date2 = {0};\n    time_t time1, time2;\n    double difference;\n\
    \    cout << \"Enter first date (YYYY MM DD): \";\n    cin >> date1.tm_year >>\
    \ date1.tm_mon >> date1.tm_mday;\n    date1.tm_year -= 1900;\n    date1.tm_mon\
    \ -= 1;\n\n    cout << \"Enter second date (YYYY MM DD): \";\n    cin >> date2.tm_year\
    \ >> date2.tm_mon >> date2.tm_mday;\n    date2.tm_year -= 1900;\n    date2.tm_mon\
    \ -= 1;\n\n    time1 = mktime(&date1);\n    time2 = mktime(&date2);\n    difference\
    \ = difftime(time2, time1) / (60 * 60 * 24);\n\n    cout << \"Difference in days:\
    \ \" << difference << \" days\" << endl;\n    return 0;\n}\n```\n\n- **Code Walkthrough**:\
    \ This program takes two dates as input, converts them to `time_t` using `mktime()`,\
    \ and calculates the difference between them in days using `difftime()`.\n- **Challenge**:\
    \ Extend the program to calculate the difference in hours, minutes, and seconds\
    \ in addition to days.\n\n## End of Chapter Checklist\n\n- Understand how to retrieve\
    \ and manipulate dates and times in C++ using `ctime` and `chrono`.\n- Learn how\
    \ to format date and time outputs in different ways using the `strftime()` function.\n\
    - Practice using `chrono` for precise time calculations, including measuring execution\
    \ time or calculating time intervals.\n- Ensure you can write programs that display\
    \ the current time and calculate time differences between two dates.\n\n## Quiz\n\
    \n1. Which library provides precise time handling in C++?\n2. How do you format\
    \ a date using the `strftime()` function?\n3. What is the purpose of `chrono::high_resolution_clock`?\n\
    \n## Glossary\n\n- **ctime**: A C++ library used for basic date and time operations,\
    \ such as getting the system time or formatting it into a readable format.\n-\
    \ **chrono**: A modern C++ library for high-resolution time measurements and time-point\
    \ calculations.\n- **time_t**: A data type in `ctime` representing the system\
    \ time as seconds since the Unix epoch (January 1, 1970).\n- **tm**: A structure\
    \ that holds date and time components such as year, month, day, hour, minute,\
    \ and second.\n\n# Chapter 27. C++ Data Structures and STL\n\n### What are Data\
    \ Structures in C++?\n\nData structures in C++ are ways to organize and store\
    \ data for efficient access and modification. They play a crucial role in solving\
    \ complex problems by enabling faster algorithms and optimizing memory use. Common\
    \ data structures include arrays, linked lists, stacks, queues, sets, and maps.\
    \ Each serves different purposes; for example, arrays are useful for indexed access,\
    \ while linked lists excel in scenarios requiring frequent insertions and deletions.\n\
    \nUnderstanding data structures is important because they affect the performance\
    \ of algorithms and applications. The Standard Template Library (STL) in C++ provides\
    \ built-in support for many data structures, which simplifies the development\
    \ process.\n\n***\n\n## Vectors\n\n### What are Vectors in C++?\n\nVectors in\
    \ C++ are dynamic arrays that can grow or shrink in size as needed. Unlike static\
    \ arrays, vectors provide the flexibility to handle unknown amounts of data during\
    \ runtime. They are part of the Standard Template Library (STL) and offer many\
    \ useful methods for managing data efficiently.\n\nVectors store elements in contiguous\
    \ memory locations, which allows fast random access. They are ideal for situations\
    \ where the number of elements may change over time. The automatic resizing of\
    \ vectors makes them highly versatile compared to regular arrays.\n\n### Syntax\n\
    \n```cpp\n#include <vector>\nstd::vector<int> myVector;\n```\n\nThis example shows\
    \ how to declare a vector of integers using `std::vector`. You can initialize\
    \ it with values or push new elements dynamically using the `push_back` method.\n\
    \n### Syntax Explanation\n\nVectors offer several methods, such as `push_back()`\
    \ to add an element to the end of the vector and `size()` to retrieve the number\
    \ of elements. Other methods like `empty()` check if the vector is empty, and\
    \ `clear()` removes all elements.\n\n**Key Methods:**\n- `push_back(element)`:\
    \ Adds an element to the end.\n- `size()`: Returns the current size.\n- `at(index)`:\
    \ Accesses the element at a specific index.\n\nVectors dynamically resize themselves,\
    \ which might involve reallocating memory. However, this is handled efficiently\
    \ by the underlying system.\n\n### Code Example\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n    std::vector<int> numbers;\n    numbers.push_back(10);\n\
    \    numbers.push_back(20);\n    numbers.push_back(30);\n    for (int num : numbers)\
    \ {\n        std::cout << num << std::endl;\n    }\n    return 0;\n}\n```\n\n\
    ### Code Walkthrough\n\nThis program creates a vector named `numbers` and uses\
    \ `push_back()` to add three integers to it. The `for` loop then iterates over\
    \ the vector to print each number. Vectors are indexed starting from 0, so the\
    \ first element can be accessed as `numbers[0]`, the second as `numbers[1]`, and\
    \ so on.\n\n### Notes\n- Avoid frequent resizing by reserving memory upfront using\
    \ the `reserve()` method.\n- Use `at()` instead of `[]` for safer element access\
    \ since `at()` performs bounds checking.\n- Vectors are optimal for frequent random\
    \ access but less efficient for insertions or deletions in the middle of the list.\n\
    \n***\n\n## List\n\n### What is a List in C++?\n\nIn C++, a list is a doubly linked\
    \ list provided by the STL. Unlike vectors, lists allow for efficient insertions\
    \ and deletions but are not stored in contiguous memory. Lists are ideal for applications\
    \ where data constantly needs to be added or removed.\n\n### Syntax\n\n```cpp\n\
    #include <list>\nstd::list<int> myList;\n```\n\nThis example shows how to declare\
    \ a list of integers using `std::list`. You can add or remove elements dynamically\
    \ using methods such as `push_back()` and `pop_front()`.\n\n### Syntax Explanation\n\
    \nKey methods for a list include:\n- `push_back()`: Adds an element to the end.\n\
    - `pop_front()`: Removes the first element.\n- `insert(position, element)`: Inserts\
    \ an element at a specific position.\n- `size()`: Returns the number of elements\
    \ in the list.\n\nUnlike vectors, lists allow efficient insertion and removal\
    \ at both ends because of their doubly linked nature, meaning each element points\
    \ to both its previous and next element.\n\n### Code Example\n\n```cpp\n#include\
    \ <iostream>\n#include <list>\n\nint main() {\n    std::list<int> numbers;\n \
    \   numbers.push_back(10);\n    numbers.push_back(20);\n    numbers.push_front(5);\n\
    \    for (int num : numbers) {\n        std::cout << num << std::endl;\n    }\n\
    \    return 0;\n}\n```\n\n### Code Walkthrough\n\nThis program creates a list\
    \ named `numbers` and adds elements to both the front and the back of the list.\
    \ The `for` loop iterates through the list to print each element. Unlike vectors,\
    \ elements are linked, so random access like `numbers[1]` is not possible.\n\n\
    ### Notes\n- Lists are inefficient for random access, so use them only when frequent\
    \ insertions and deletions are required.\n- Prefer vectors over lists when the\
    \ order and access time matter.\n\n***\n\n## Stacks\n\nWhat are Stacks in C++?\n"
  raw: "*   Objective: Write a program that prints the current date and time using\
    \ the C++ date/time functions.\n\n*   Instructions: Use the ctime library to retrieve\
    \ the current system time and display it in a readable format.\n\nCode:\n\n#include\
    \ <iostream>\n\n#include <ctime>\n\nusing namespace std;\n\nint main() {\n\ntime_t\
    \ currentTime = time(0);\n\ntm *localTime = localtime(&currentTime);\n\ncout <<\
    \ \"Current Date and Time: \" << asctime(localTime);\n\nreturn 0;\n\n}\n\n*  \
    \ Code Walkthrough: The program retrieves the current system time using  time(0),\
    \ converts it to local time using  localtime(), and prints the result using  asctime().\n\
    \n*   Challenge: Modify the program to format the output as \"YYYY-MM-DD HH:MM\n\
    \n    \" using  strftime().\n\nProject 2: Calculate the Difference Between Two\
    \ Dates\n\n*   Objective: Create a program that calculates the difference between\
    \ two dates entered by the user.\n\n*   Instructions: Write a program that prompts\
    \ the user for two dates and calculates the number of days between them using\
    \ the ctime or chrono library.\n\nCode:\n\n#include <iostream>\n\n#include <ctime>\n\
    \nusing namespace std;\n\nint main() {\n\ntm date1 = {0}, date2 = {0};\n\ntime_t\
    \ time1, time2;\n\ndouble difference;\n\ncout << \"Enter first date (YYYY MM DD):\
    \ \";\n\ncin >> date1.tm_year >> date1.tm_mon >> date1.tm_mday;\n\ndate1.tm_year\
    \ -= 1900;\n\ndate1.tm_mon -= 1;\n\ncout << \"Enter second date (YYYY MM DD):\
    \ \";\n\ncin >> date2.tm_year >> date2.tm_mon >> date2.tm_mday;\n\ndate2.tm_year\
    \ -= 1900;\n\ndate2.tm_mon -= 1;\n\ntime1 = mktime(&date1);\n\ntime2 = mktime(&date2);\n\
    \ndifference = difftime(time2, time1) / (60 * 60 * 24);\n\ncout << \"Difference\
    \ in days: \" << difference << \" days\" << endl;\n\nreturn 0;\n\n}\n\n*   Code\
    \ Walkthrough: This program takes two dates as input, converts them to  time_t\
    \ using  mktime(), and calculates the difference between them in days using  difftime().\n\
    \n*   Challenge: Extend the program to calculate the difference in hours, minutes,\
    \ and seconds in addition to days.\n\nEnd of Chapter Checklist\n\n*   Understand\
    \ how to retrieve and manipulate dates and times in C++ using ctime and chrono.\n\
    \n*   Learn how to format date and time outputs in different ways using the  strftime()\
    \ function.\n\n*   Practice using chrono for precise time calculations, including\
    \ measuring execution time or calculating time intervals.\n\n*   Ensure you can\
    \ write programs that display the current time and calculate time differences\
    \ between two dates.\n\nQuiz\n\n1.  Which library provides precise time handling\
    \ in C++?\n\n2.  How do you format a date using the  strftime() function?\n\n\
    3.  What is the purpose of  chrono::high_resolution_clock?\n\nGlossary\n\n*  \
    \ ctime: A C++ library used for basic date and time operations, such as getting\
    \ the system time or formatting it into a readable format.\n\n*   chrono: A modern\
    \ C++ library for high-resolution time measurements and time-point calculations.\n\
    \n*   time_t: A data type in ctime representing the system time as seconds since\
    \ the Unix epoch (January 1, 1970).\n\n*   tm: A structure that holds date and\
    \ time components such as year, month, day, hour, minute, and second.\n\nChapter\
    \ 27\\. C++ Data Structures and STL\n\nWhat are Data Structures in C++? \n\nData\
    \ structures in C++ are ways to organize and store data for efficient access and\
    \ modification. They play a crucial role in solving complex problems by enabling\
    \ faster algorithms and optimizing memory use. Common data structures include\
    \ arrays, linked lists, stacks, queues, sets, and maps. Each serves different\
    \ purposes; for example, arrays are useful for indexed access, while linked lists\
    \ excel in scenarios requiring frequent insertions and deletions.\n\nUnderstanding\
    \ data structures is important because they affect the performance of algorithms\
    \ and applications. The Standard Template Library (STL) in C++ provides built-in\
    \ support for many data structures, which simplifies the development process.\n\
    \n* * *\n\nVectors\n\nWhat are Vectors in C++? \n\nVectors in C++ are dynamic\
    \ arrays that can grow or shrink in size as needed. Unlike static arrays, vectors\
    \ provide the flexibility to handle unknown amounts of data during runtime. They\
    \ are part of the Standard Template Library (STL) and offer many useful methods\
    \ for managing data efficiently.\n\nVectors store elements in contiguous memory\
    \ locations, which allows fast random access. They are ideal for situations where\
    \ the number of elements may change over time. The automatic resizing of vectors\
    \ makes them highly versatile compared to regular arrays.\n\nSyntax\n\n#include\
    \ <vector>\n\nstd::vector<int> myVector;\n\nThis example shows how to declare\
    \ a vector of integers using  std::vector. You can initialize it with values or\
    \ push new elements dynamically using the  push_back method.\n\nSyntax Explanation\n\
    \nVectors offer several methods, such as  push_back() to add an element to the\
    \ end of the vector and  size() to retrieve the number of elements. Other methods\
    \ like  empty() check if the vector is empty, and  clear() removes all elements.\n\
    \nKey Methods:\n\n*   push_back(element): Adds an element to the end.\n\n*   size():\
    \ Returns the current size.\n\n*   at(index): Accesses the element at a specific\
    \ index.\n\nVectors dynamically resize themselves, which might involve reallocating\
    \ memory. However, this is handled efficiently by the underlying system.\n\nCode\
    \ Example\n\n#include <iostream>\n\n#include <vector>\n\nint main() {\n\nstd::vector<int>\
    \ numbers;\n\nnumbers.push_back(10);\n\nnumbers.push_back(20);\n\nnumbers.push_back(30);\n\
    \nfor (int num : numbers) {\n\nstd::cout << num << std::endl;\n\n}\n\nreturn 0;\n\
    \n}\n\nCode Walkthrough\n\nThis program creates a vector named  numbers and uses\
    \  push_back() to add three integers to it. The  for loop then iterates over the\
    \ vector to print each number. Vectors are indexed starting from 0, so the first\
    \ element can be accessed as  numbers[0], the second as  numbers[1], and so on.\n\
    \nNotes\n\n*   Avoid frequent resizing by reserving memory upfront using the \
    \ reserve() method.\n\n*   Use  at() instead of  [] for safer element access since\
    \  at() performs bounds checking.\n\n*   Vectors are optimal for frequent random\
    \ access but less efficient for insertions or deletions in the middle of the list.\n\
    \n* * *\n\nList\n\nWhat is a List in C++? \n\nIn C++, a list is a doubly linked\
    \ list provided by the STL. Unlike vectors, lists allow for efficient insertions\
    \ and deletions from both the beginning and end of the list but are slower for\
    \ random access because elements are not stored in contiguous memory. Lists are\
    \ ideal for applications where data constantly needs to be added or removed at\
    \ various positions.\n\nSyntax\n\n#include <list>\n\nstd::list<int> myList;\n\n\
    This example shows how to declare a list of integers using  std::list. You can\
    \ add or remove elements dynamically using methods such as  push_back() and  pop_front().\n\
    \nSyntax Explanation\n\nKey methods for a list include:\n\n*   push_back(): Adds\
    \ an element to the end.\n\n*   pop_front(): Removes the first element.\n\n* \
    \  insert(position, element): Inserts an element at a specific position.\n\n*\
    \   size(): Returns the number of elements in the list.\n\nUnlike vectors, lists\
    \ allow efficient insertion and removal at both ends because of their doubly linked\
    \ nature, meaning each element points to both its previous and next element.\n\
    \nCode Example\n\n#include <iostream>\n\n#include <list>\n\nint main() {\n\nstd::list<int>\
    \ numbers;\n\nnumbers.push_back(10);\n\nnumbers.push_back(20);\n\nnumbers.push_front(5);\n\
    \nfor (int num : numbers) {\n\nstd::cout << num << std::endl;\n\n}\n\nreturn 0;\n\
    \n}\n\nCode Walkthrough\n\nThis program creates a list named  numbers and adds\
    \ elements to both the front and the back of the list. The  for loop iterates\
    \ through the list to print each element. Unlike vectors, elements are linked,\
    \ so random access like  numbers[1] is not possible.\n\nNotes\n\n*   Lists are\
    \ inefficient for random access, so use them only when frequent insertions and\
    \ deletions are required.\n\n*   Prefer vectors over lists when the order and\
    \ access time matter.\n\n* * *\n\nStacks\n\nWhat are Stacks in C++? "
