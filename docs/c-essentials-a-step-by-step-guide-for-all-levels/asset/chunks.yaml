    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\nint age;\n\
    cout << \"Enter your age: \";\ncin >> age;\nif (age >= 18) {\n    cout << \"You\
    \ are an adult.\" << endl;\n}\nreturn 0;\n}\n```\n\n***\n\n### Code Walkthrough\n\
    In this example, the user is prompted to enter their age. The input is stored\
