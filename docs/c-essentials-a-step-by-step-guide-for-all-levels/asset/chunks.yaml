  raw: 'There are two primary ways to pass parameters in C++: by value and by reference.
    When parameters are passed by value, the function receives a copy of the arguments,
    so changes made to the parameters inside the function don’t affect the original
    variables. Passing by reference, on the other hand, allows the function to modify
    the original variables directly.


    Function parameters allow you to write flexible, reusable code. Instead of hardcoding
    values, you can pass different arguments each time you call the function, making
    the function adaptable to various situations.


    Syntax


    The syntax for defining function parameters is as follows:


    return_type function_name(data_type parameter1, data_type parameter2) {


    // function body


    }


    For example:


    int add(int a, int b) {


    return a + b;


    }


    In this example,  a and  b are parameters of type  int, which are passed to the
    function when it is called.


    Syntax Explanation


    1.  data_type: This specifies the type of the parameter, such as  int,  float,
    or  string. Each parameter must have a defined data type.


    2.  parameter name: Parameters are essentially variables used inside the function.
    The parameter names should be descriptive, so it’s clear what type of data they
    represent.


    3.  Multiple parameters: A function can accept multiple parameters, separated
    by commas. For example,  int a, int b allows the function to accept two integer
    values.


    4.  Passing arguments: When the function is called, the values passed to the function
    (called arguments) are assigned to the corresponding parameters. For example,
    calling  add(3, 5) assigns  3 to  a and  5 to  b.


    Function parameters allow you to pass dynamic values to a function, making it
    reusable and capable of handling different inputs without modifying the function
    itself.


    Code Example


    Here’s an example that demonstrates passing parameters to a function:


    #include <iostream>


    using namespace std;


    void printSum(int a, int b) {


    int sum = a + b;


    cout << "Sum: " << sum << endl;


    }


    int main() {


    printSum(10, 20);


    return 0;


    }


    Code Walkthrough


    1.  Function Definition: The function  printSum accepts two parameters of type  int,  a
    and  b.


    2.  Function Body: Inside the function, the sum of  a and  b is calculated and
    stored in the variable  sum. The result is then printed.


    3.  Function Call: In the  main function,  printSum(10, 20) is called. The values
    10 and 20 are passed to the function, where they are added together.


    4.  Output: The function calculates the sum of 10 and 20 and prints  Sum: 30.


    This program demonstrates how functions use parameters to work with different
    inputs dynamically, making the code more flexible and reusable.


    Pass by Reference


    What is Pass by Reference? 


    Passing by reference is a method where a function receives a reference to the
    original variable, rather than a copy. This allows the function to modify the
    actual variable used in the calling code. In contrast to pass by value, where
    a copy of the variable is made, pass by reference directly operates on the original
    variable.


    In C++, you pass parameters by reference by using the  & symbol in the function
    parameter list. This tells the function to work with the memory address of the
    variable, allowing any changes made inside the function to affect the original
    variable.


    Pass by reference is especially useful when working with large data structures
    or when you want the function to modify the original variable without returning
    a new value. It also helps improve performance by avoiding the overhead of copying
    large amounts of data.


    Syntax


    The syntax for passing a parameter by reference is as follows:


    void function_name(data_type &parameter) {


    // function body


    }


    For example:


    void increment(int &a) {


    a++;


    }


    In this example,  a is passed by reference, so the original variable passed to
    the function is modified directly.


    Syntax Explanation


    1.  data_type: This specifies the type of the parameter being passed, such as  int,  float,
    or  string.


    2.  & symbol: The  & symbol before the parameter name indicates that the parameter
    is passed by reference. This means that the function will work with the memory
    address of the variable, not a copy of its value.


    3.  Modifying the original variable: When a parameter is passed by reference,
    any changes made to it inside the function will affect the original variable in
    the calling code. For example, if the function modifies a reference parameter,
    the original value passed to the function will be altered.


    Passing by reference is a powerful technique in C++ that allows functions to modify
    the original variables and improves efficiency when working with large data.


    Code Example


    Here’s an example that demonstrates passing a parameter by reference:


    #include <iostream>


    using namespace std;


    void increment(int &a) {


    a++;


    }


    int main() {


    int num = 10;


    increment(num);


    cout << "Incremented number: " << num << endl;


    return 0;


    }


    Code Walkthrough


    1.  Function Definition: The function  increment accepts an integer parameter
    passed by reference (int &a).


    2.  Function Body: Inside the function, the parameter  a is incremented by 1\.
    Since  a is passed by reference, the original variable is modified directly.


    3.  Function Call: In the  main function, the variable  num is passed to  increment.
    The value of  num is modified inside the function.


    4.  Output: The function increments the value of  num, and the output is  Incremented
    number: 11.


    This program demonstrates how passing by reference allows a function to modify
    the original variable, making it useful for functions that need to alter input
    values.


    Notes


    When deciding whether to pass parameters by value or by reference in C++, consider
    the following best practices:


    *   Use pass by value when you don’t need to modify the original variable, as
    it ensures the function works with a copy, leaving the original variable unchanged.


    *   Use pass by reference when you want to modify the original variable, or when
    working with large data structures, to avoid the overhead of copying large amounts
    of data.


    *   Be cautious with pass by reference, as it can lead to unintended modifications
    if not used carefully.


    Project 1: Calculate Factorial


    *   Objective: Write a program that defines a function to calculate the factorial
    of a number entered by the user.


    *   Instructions: Create a function  factorial that takes an integer and returns
    its factorial.


    Code:


    #include <iostream>


    using namespace std;


    int factorial(int n) {


    if (n == 0) return 1;


    return n * factorial(n - 1);


    }


    int main() {


    int num;


    cout << "Enter a number: ";


    cin >> num;


    cout << "Factorial of " << num << " is: " << factorial(num) << endl;


    return 0;


    }


    *   Code Walkthrough: The  factorial function recursively calculates the factorial
    of a number by multiplying it by the factorial of the previous number. The base
    case is  n == 0, which returns 1.


    Project 2: Find Maximum of Two Numbers


    *   Objective: Create a program that defines a function to find the maximum of
    two numbers using function parameters.


    *   Instructions: Write a function  maxValue that takes two integers as input
    and returns the larger of the two.


    Code:


    #include <iostream>


    using namespace std;


    int maxValue(int a, int b) {


    return (a > b) ? a : b;


    }


    int main() {


    int x, y;


    cout << "Enter two numbers: ";


    cin >> x >> y;


    cout << "The maximum is: " << maxValue(x, y) << endl;


    return 0;


    }


    *   Code Walkthrough: The function  maxValue compares two integers and returns
    the larger one using a conditional operator.


    End of Chapter Checklist


    *   Understand how functions work in C++ and how to define them.


    *   Learn the difference between passing parameters by value and by reference.


    *   Practice writing reusable functions that perform specific tasks, such as calculating
    a factorial or finding the maximum of two numbers.


    Quiz


    1.  What is the difference between passing a parameter by value and by reference?'
