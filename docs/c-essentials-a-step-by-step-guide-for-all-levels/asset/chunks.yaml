    \ methods to define the interface for interacting with an object and `private`\
    \ methods for internal class logic.\n- Organize methods logically, placing commonly\
    \ used methods near the top of the class definition for clarity.\n- Consider method\
    \ overloading if you need different versions of a method that perform similar\
    \ tasks on varying types or numbers of parameters.\n- Be cautious when methods\
    \ modify class attributes—ensure the class remains in a consistent state after\
    \ the method executes.\n\n## Project 1: Rectangle Class with Area and Perimeter\n\
    \n- **Objective**: Write a program that defines a `Rectangle` class with attributes\
    \ `length` and `width`, and methods to calculate the area and perimeter.\n- **Instructions**:\
    \ Define a class `Rectangle` with two attributes (`length` and `width`). Write\
    \ methods to calculate and return the area and perimeter. Use the class in the\
    \ `main()` function to create a rectangle object and display its area and perimeter.\n\
    \n### Code\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Rectangle\
    \ {\npublic:\n    int length;\n    int width;\n\n    int area() {\n        return\
    \ length * width;\n    }\n\n    int perimeter() {\n        return 2 * (length\
    \ + width);\n    }\n};\n\nint main() {\n    Rectangle rect;\n    rect.length =\
    \ 10;\n    rect.width = 5;\n    cout << \"Area: \" << rect.area() << endl;\n \
    \   cout << \"Perimeter: \" << rect.perimeter() << endl;\n    return 0;\n}\n```\n\
    \n- **Code Walkthrough**: The `Rectangle` class includes methods `area()` and\
