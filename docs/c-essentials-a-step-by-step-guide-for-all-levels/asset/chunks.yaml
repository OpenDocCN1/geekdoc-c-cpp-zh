    Chapter 17\. C++ Break and Continue 


    What is Break in C++? 


    The  break statement in C++ is used to exit loops or switch cases prematurely.
    When a  break statement is encountered within a loop or switch case, the control
    immediately jumps out of the loop or switch, bypassing any remaining code in the
    block. This is useful when certain conditions are met, and further iterations
    or checks are no longer necessary.


    In loops,  break is commonly used when a specific condition is satisfied. For
    example, in a loop processing user input, you can use  break to exit the loop
    once valid input is received. In switch cases,  break helps prevent fall-through,
    ensuring only the matching case is executed. Without  break, control would continue
    into subsequent cases, which is rarely desired.


    The  break statement is a powerful tool to manage control flow in C++ and allows
    for cleaner, more efficient code by preventing unnecessary iterations.


    Syntax


    The syntax for the  break statement in C++ is straightforward and consistent across
    both loops and switch statements:


    break;


    *   In loops: The  break statement can appear in any part of the loop body (inside
    for, while, or do-while loops). When it is executed, the loop immediately terminates,
    and control moves to the next statement after the loop.


    *   In switch statements: The  break statement is placed at the end of each case
    to prevent control from falling into the next case.


    Syntax Explanation


    1.  In Loops: The  break statement interrupts the loop''s normal execution when
    certain conditions are met. For instance, in a  for loop, it bypasses the remaining
    iterations and jumps to the code following the loop.


    2.  In Switch Statements: In a switch statement, each case block typically ends
    with a  break. This ensures that once a matching case is executed, the switch
    ends. If  break is omitted, the program continues executing the subsequent cases,
    even if they don’t match the condition (this is called fall-through).


    In both scenarios,  break serves to exit the control structure immediately, improving
    efficiency when further processing is unnecessary.


    Code Example


    Here is a C++ program demonstrating the  break statement within a loop:


    #include <iostream>


    using namespace std;


    int main() {


    for (int i = 1; i <= 10; i++) {


    if (i == 5) {


    break;


    }


    cout << i << " ";


    }


    return 0;


    }


    This code prints numbers from 1 to 4 and stops when the value of  i reaches 5.
    The  break statement causes the loop to terminate early.


    Code Walkthrough


    1.  Initialization: The  for loop initializes the variable  i to 1, setting it
    to run as long as  i <= 10.


    2.  Condition Check: During each iteration, the program checks whether  i == 5.
    When this condition is true, the  break statement is executed, and the loop exits
    immediately.


    3.  Output: The program prints values 1 through 4\. As soon as  i equals 5, the
    loop is interrupted by the  break statement, and the program skips to the next
    statement after the loop.


    4.  Termination: The loop does not continue past 4, demonstrating how  break can
    be used to exit early based on a condition.


    Continue


    What is Continue in C++? 


    The  continue statement in C++ is used within loops to skip the current iteration
    and proceed directly to the next one. Unlike  break, which completely terminates
    the loop,  continue only halts the execution of the current iteration and allows
    the loop to continue with the next iteration.


    The  continue statement is typically used when you want to bypass specific conditions
    in a loop without exiting it. For example, when iterating through a list of numbers,
    you might want to skip even numbers and process only odd ones. By using  continue,
    you can skip over the even numbers and move directly to the next iteration, improving
    both performance and code readability.


    This statement is helpful in situations where certain conditions need to be ignored
    temporarily, but the overall loop should keep running.


    Syntax


    The syntax for the  continue statement in C++ is:


    continue;


    *   In loops: The  continue statement can be used in  for,  while, or  do-while
    loops. It causes the loop to skip the current iteration and proceed to the next
    cycle, without exiting the loop completely.


    For example, in a  for loop, the control moves to the iteration part, updating
    the loop variable, and then the condition is checked again to decide if the next
    iteration should proceed.


    Syntax Explanation


    1.  In Loops: The  continue statement is most often used in loops. When the program
    encounters  continue, it stops executing the remaining code in the current loop
    iteration and jumps directly to the next iteration.


    2.  In  for loops: After encountering a  continue, the control moves to the iteration
    step (such as  i++ in a  for loop), and the condition is evaluated again to determine
    if another iteration should occur.


    3.  In  while and  do-while loops: After hitting a  continue statement, control
    immediately returns to the condition check to decide whether to continue the loop.


    The  continue statement is an effective way to skip specific iterations based
    on certain conditions, keeping the loop running without interrupting it entirely.


    Code Example


    The following program uses  continue to skip numbers divisible by 3:


    #include <iostream>


    using namespace std;


    int main() {


    for (int i = 1; i <= 10; i++) {


    if (i % 3 == 0) {


    continue;


    }


    cout << i << " ";


    }


    return 0;


    }


    This code prints numbers from 1 to 10 but skips those divisible by 3 (3, 6, and
    9).


    Code Walkthrough


    1.  Initialization: The  for loop starts with  i = 1 and runs as long as  i <=
    10.


    2.  Condition Check: Inside the loop, if  i is divisible by 3 (i % 3 == 0), the  continue
    statement is executed, causing the program to skip the current iteration.


    3.  Output: The numbers 1, 2, 4, 5, 7, 8, and 10 are printed, while numbers divisible
    by 3 (3, 6, 9) are skipped.


    4.  Termination: The loop runs until  i = 10, demonstrating how  continue selectively
    skips iterations without ending the loop prematurely.


    Notes


    Both  break and  continue are useful control statements in C++. Use  break when
    you want to terminate a loop or switch statement entirely, and use  continue when
    you want to skip specific iterations within a loop without stopping the entire
    loop. These statements help improve efficiency by avoiding unnecessary iterations
    or computations. However, overusing them can make your code harder to read and
    maintain, so they should be used sparingly and only when necessary.


