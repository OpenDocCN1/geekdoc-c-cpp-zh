    \n*   Build/Compile: The process of turning source code into an executable program.\n\
    \nChapter 3\\. C++ Syntax\n\nUnderstanding the basic syntax of C++ is the first\
    \ step toward writing your own programs. Syntax refers to the set of rules that\
    \ define how programs are written and interpreted. In this chapter, we’ll cover\
    \ the core components of C++ syntax, including variables, data types, operators,\
    \ control structures, and functions.\n\n* * *\n\nC++ Program Structure\n\nA typical\
    \ C++ program consists of the following structure:\n\n#include <iostream>   //\
    \ Library inclusion\n\nusing namespace std;  // Allows us to use standard functions\
    \ without the \"std::\" prefix\n\nint main() {          // The main function is\
    \ the entry point of the program\n\ncout << \"Hello, World!\";  // Prints output\n\
    \nreturn 0;         // Returns 0, indicating the program ended successfully\n\n\
    }\n\n*   #include <iostream>: Includes the iostream library for input and output\
    \ operations.\n\n*   int main(): Every C++ program must have a  main() function.\
    \ This is where execution begins.\n\n*   return 0;: Indicates the program executed\
    \ successfully.\n\n* * *\n\nVariables and Data Types \n\nVariables are used to\
    \ store data in a program. C++ is a statically-typed language, meaning each variable\
    \ must have a declared type.\n\nCommon data types in C++ include:\n\n*   int:\
    \ Used for integers (e.g.,  int age = 30;).\n\n*   float: Used for floating-point\
    \ numbers (e.g.,  float pi = 3.14;).\n\n*   double: Used for double-precision\
    \ floating-point numbers (e.g.,  double g = 9.8;).\n\n*   char: Used for single\
    \ characters (e.g.,  char grade = 'A';).\n\n*   string: Used for text (requires\
    \ the  <string> library, e.g.,  string name = \"John\";).\n\n*   bool: Used for\
    \ boolean values (true or  false, e.g.,  bool isActive = true;).\n\nExample:\n\
    \nint age = 25;\n\nfloat price = 19.99;\n\nchar initial = 'J';\n\nbool isStudent\
    \ = true;\n\nEach variable must be declared with its type before it is used in\
    \ the program.\n\n* * *\n\nOperators\n\nC++ provides various operators to perform\
    \ calculations, comparisons, and logical operations.\n\n1.  Arithmetic Operators:\n\
    \n    *   + (addition):  a + b\n\n    *   - (subtraction):  a - b\n\n    *   *\
    \ (multiplication):  a * b\n\n    *   / (division):  a / b\n\n    *   % (modulus):\
    \  a % b (remainder after division)\n\n2.  Comparison Operators:\n\n    *   ==\
    \ (equal to):  a == b\n\n    *   != (not equal to):  a != b\n\n    *   <,  >,\
    \  <=,  >=: (less than, greater than, less than or equal to, greater than or equal\
    \ to)\n\n3.  Logical Operators:\n\n    *   && (and):  a && b\n\n    *   || (or):\
    \  a || b\n\n    *   ! (not):  !a\n\nExample:\n\nint x = 10, y = 5;\n\nint sum\
    \ = x + y;  // sum is 15\n\nbool result = (x > y);  // result is true\n\nThese\
    \ operators help manipulate data and create conditions for decision-making.\n\n\
    * * *\n\nControl Structures\n\nControl structures are used to control the flow\
    \ of a program, making decisions or repeating actions.\n\nIf-Else Statements:\
    \ Allows conditional execution of code based on a condition.\n\nExample:\n\nint\
    \ age = 18;\n\nif (age >= 18) {\n\ncout << \"You are an adult.\";\n\n} else {\n\
    \ncout << \"You are a minor.\";\n\n}\n\nSwitch Statement: A  switch statement\
    \ selects one of many code blocks to execute.\n\nExample:\n\nint day = 3;\n\n\
    switch (day) {\n\ncase 1:\n\ncout << \"Monday\";\n\nbreak;\n\ncase 2:\n\ncout\
    \ << \"Tuesday\";\n\nbreak;\n\ndefault:\n\ncout << \"Other day\";\n\n}\n\n1. \
    \ Loops: Loops allow repetitive execution of code blocks.\n\nFor Loop: Repeats\
    \ a block of code a specific number of times.\n\nfor (int i = 0; i < 5; i++) {\n\
    \ncout << i << \" \";\n\n}\n\nWhile Loop: Repeats a block of code while a condition\
    \ is true.\n\nint i = 0;\n\nwhile (i < 5) {\n\ncout << i << \" \";\n\ni++;\n\n\
    }\n\nDo-While Loop: Similar to a while loop but guarantees at least one execution\
    \ of the loop body.\n\nint i = 0;\n\ndo {\n\ncout << i << \" \";\n\ni++;\n\n}\
    \ while (i < 5);\n\n* * *\n\nFunctions\n\nFunctions allow you to organize your\
    \ code into reusable blocks. Each function performs a specific task and can be\
    \ called multiple times in the program.\n\nDeclaring and Defining a Function:\
    \ A function in C++ consists of a return type, name, parameter list, and a body.\n\
    \nExample:\n\nint add(int a, int b) {\n\nreturn a + b;\n\n}\n\n*   int: Return\
    \ type indicating the function returns an integer.\n\n*   add: The function name.\n\
    \n*   (int a, int b): Parameters for the function.\n\n*   return: Returns the\
    \ result of the addition.\n\nCalling a Function: You can call a function by using\
    \ its name and passing the required arguments.\n\nExample:\n\nint result = add(5,\
    \ 10);  // result is 15\n\ncout << result;\n\n2.  Functions help in breaking down\
    \ large programs into smaller, more manageable parts, making the code more organized\
    \ and easier to debug.\n\n* * *\n\nComments and Code Documentation\n\nComments\
    \ are used to explain code, making it easier to understand. In C++, there are\
    \ two types of comments:\n\n*   Single-line comments: Use  // to add a comment\
    \ on a single line.\n\n*   Multi-line comments: Use  /* */ to add comments that\
    \ span multiple lines.\n\nExample:\n\n// This is a single-line comment\n\n/*\n\
    \nThis is a\n\nmulti-line comment\n\n*/\n\nComments are essential for making your\
    \ code easier to read and maintain.\n\n* * *\n\nEnd of Chapter Checklist\n\n*\
    \   Understand the basic structure of a C++ program.\n\n*   Learn about variables,\
    \ data types, and how to declare them.\n\n*   Familiarize yourself with operators\
    \ (arithmetic, comparison, and logical).\n\n*   Practice using control structures\
    \ like if-else, switch, and loops.\n\n*   Understand how to define and call functions.\n\
    \n*   Learn how to use comments to document your code.\n\n* * *\n\nQuiz\n\n1.\
    \  What is the purpose of the  main() function in a C++ program?\n\n2.  How do\
    \ you declare a variable of type  int and assign a value to it?\n\n3.  What is\
    \ the difference between a  for loop and a  while loop?\n\n4.  How do you create\
    \ a function that returns the sum of two numbers?\n\n* * *\n\nGlossary\n\n*  \
    \ Variable: A storage location in memory with a name and a type, used to store\
    \ data."
