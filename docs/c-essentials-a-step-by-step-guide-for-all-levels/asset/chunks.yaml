    Description:


    Write a program that converts a temperature from Fahrenheit to Celsius using floating-point
    arithmetic.


    Objective:


    Learn how to use float variables for calculations.


    Instructions:


    1.  Declare variables for Fahrenheit and Celsius.


    2.  Use the formula: Celsius = (Fahrenheit - 32) * 5 / 9.


    3.  Output the result in Celsius.


    Code:


    #include <iostream>


    using namespace std;


    int main() {


    float fahrenheit, celsius;


    cout << "Enter temperature in Fahrenheit: ";


    cin >> fahrenheit;


    celsius = (fahrenheit - 32) * 5.0 / 9.0;


    cout << "Temperature in Celsius: " << celsius << endl;


    return 0;


    }


    Code Walkthrough:


