  trans: "\n\n- `Function`: 一个可重用的代码块，用于执行特定任务并可以返回值。\n- `Operator`: 一个用于对变量和值进行操作的符号。\n\
    - `Loop`: 一种控制结构，当条件为真时会重复执行代码块。\n\n# 第 4 章 C++ 输出\n\n## 什么是 C++ 中的输出？\n\n在 C++\
    \ 中，输出是我们向用户显示信息、结果或消息的方式。最常用的输出方式是通过 `cout` 对象实现的，它代表“控制台输出”（console output）。它是\
    \ `iostream` 库的一部分，并配合 `<<` 运算符使用，将数据发送到标准输出流（通常是控制台窗口）。此外，`endl` 是一个操纵符，用于将光标移动到下一行并刷新输出缓冲区，这对于整齐格式化输出至关重要。\n\
    \n输出是任何程序不可或缺的一部分，因为它有助于与用户交互、显示结果以及调试问题。你可以输出文本、数字甚至格式化后的数据，这使其成为简单和复杂应用程序中的关键元素。\n\
    \n## 理解 C++ 打印文本\n\n### 什么是打印文本？\n\n在 C++ 中打印文本涉及使用 `cout` 对象在屏幕上显示消息、数字和结果。这通常是\
    \ C++ 学习的第一个内容，因为它允许程序与用户之间进行通信。文本输出用于提供指令、显示计算结果或交互式地显示用户输入。\n\n使用 `cout`，你可以打印文本和变量数据的任何组合。这种能力对于几乎所有类型的程序都关重要，无论你是在创建一个计算器、游戏还是会计系统。\n\
    \n### 语法\n\n打印文本的语法非常直观。你使用 `cout` 对象，后跟 `<<` 运算符以及你想要显示的文本或变量。\n\n```\ncout <<\
    \ \"Hello, World!\";\n```\n\n在这个示例中，“Hello, World!” 将打印在控制台上。你可以通过额外的 `<<` 运算符链联多个输出内容：\n\
    \n```\ncout << \"The answer is: \" << 42;\n```\n\n### 语法解释\n\n`cout` 将输出重定向到控制台。`<<`\
    \ 运算符将数据（文本或变量值）插入输出流中。通过链联多个 `<<` 运算符，你可以在单行内打印文本、变量和数字的混合。C++ 从左到右顺序处理每条信息，并将所有内容输出到控制台。\n\
    \n### 代码示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n  cout << \"Welcome to C++!\" << endl;\n  int age = 25;\n  cout << \"Your\
    \ age is: \" << age << endl;\n  return 0;\n}\n```\n\n### 代码解读\n\n在这个程序中，我们首先包含了\
    \ `iostream` 库，它包含了 `cout` 对象。然后，`main()` 函数使用 `cout` 对象打印“Welcome to C++!”。`endl`\
    \ 操纵符将光标移动到下一行。接着，我们声明了一个值为 25 的整数变量 `age`。下一个 `cout` 语句输出文本“Your age is: ”，随后是\
    \ `age` 变量的值。多次使用 `<<` 允许我们在单次输出中组合文本和变量。\n\n### 注意事项\n\n打印文本时，请确保格式正确以提高可读性。根据需要使用\
    \ `endl` 或 `\\n` 创建新行，特别是在打印多条信息时。在单个 `cout` 语句中将文本与变量结合可以节省时间并保持代码整洁。\n\n## 理解\
    \ C++ 中的换行\n\n### 什么是换行？\n\n换行在 C++ 中用于控制下一个打印文本在控制台上的出现位置。如果没有换行，所有内容都将打印在同一行，导致输出难以阅读。你可以使用\
    \ `\\n` 转义序列或 `endl` 操纵符来创建换行。\n\n使用换行允许你组织输出，特别是在处理表格、列表或多行消息时。例如，在收据或报告中，你可能希望每个项目或每条信息都单独占一行显示，以使输出清晰易读。\n\
    \n### 语法\n\n要插入换行，你可以使用 `\\n` 或 `endl`。\n\n```\ncout << \"Line one\\nLine two\"\
    ;\ncout << \"Line three\" << endl;\n```\n\n在这里，第一条语句使用 `\\n` 在新行上打印，而第二条语句使用 `endl`。两者实现了相同的结果，但方式不同。\n\
    \n### 语法解释\n\n`\\n` 是一个转义字符，表示新行的开始，而 `endl` 是一个移动到新行并刷新输出缓冲区的操纵符。当你需要快速、简单的格式化时使用\
    \ `\\n`，当你需要确保所有缓冲区输出都立即刷新时使用 `endl`，特别是在处理实时输出时。\n\n### 代码示例\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main() {\n  cout << \"First Line\\\
    nSecond Line\" << endl;\n  cout << \"Third Line\" << endl;\n  return 0;\n}\n```\n\
    \n### 代码解读\n\n在这个示例中，第一条 `cout` 语句打印了两行文本。`\\n` 在“First Line”之后创建了一个新行，因此“Second\
    \ Line”出现在它下方。第二条 `cout` 语句使用 `endl` 打印“Third Line”并移动到下一行，确保任何后续文本将打印在新行。\n\n\
    此程序演示了如何通过插入换行符来整齐地组织输出，确保每条消息或每条数据都单独占一行。\n\n### 注意事项\n\n格式化输出时使用 `\\n` 通常更快，但\
    \ `endl` 更具通用性，当你需要刷新缓冲区时使用 `endl` 根据情况。\n\n## 项目\n\n### 项目 1：乘法表\n\n**描述**：创建一个打印\
    \ 1 到 10 的乘法表。\n**目标**：使用循环练习 `cout` 输出。\n**指令**：使用嵌套循环打印每一行。\n\n**代码**：\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main() {\n  for (int i = 1;\
    \ i <= 10; i++) {\n    for (int j = 1; j <= 10; j++) {\n      cout << i * j <<\
    \ \"\\t\"; // 使用制表符对齐\n    }\n    cout << endl; // 移动到下一行\n  }\n  return 0;\n\
    }\n```\n\n**代码解读**\n\n此程序使用了两个 `for` 循环。外层循环控制行，内部循环计算乘积。`\\t` 确保数值对齐，`endl` 在每行后移动。\n\
    \n**挑战**：修改程序允许用户输入最大值（例如打印 12）。\n\n### 项目 2：购物列表收据\n\n**描述**：打印一份显示项目、价格和总成本的格式化收据。\n\
    **目标**：针对浮点数练习输出格式化。\n**指令**：使用数组存储项目名称。打印每个项目及其价格，并在最后显示总计。\n\n**代码**：\n\n```cpp\n\
    #include <iostream>\n#include <iomanip>  // 用于格式化\nusing namespace std;\n\nint\
    \ main() {\n  string items[] = {\"苹果\", \"香蕉\", \"橙子\"};\n  double prices[] =\
    \ {1.99, 0.99, 2.49};\n  double total = 0;\n  cout << fixed << setprecision(2);\
    \ // 设置输出精度为两位小数\n  cout << \"Item\\t\\tPrice\\n\";\n  cout << \"----------------------\\\
    n\";\n  for (int i = 0; i < 3; i++) {\n    cout << items[i] << \"\\t\\t$\" <<\
    \ prices[i] << endl;\n    total += prices[i];\n  }\n  cout << \"----------------------\\\
    n\";\n  cout << \"Total:\\t\\t$\" << total << endl;\n  return 0;\n}\n```\n\n**代码解读**\n\
    \n此程序打印列表中每个项目的名称和价格。它使用 `fixed` 和 `setprecision(2)` 确保价格以两位小数显示。一个 `for` 循环遍历项目和价格，打印每个项目并累计总成本。\n\
    \n## 本章结束清单\n\n- 理解如何使用 `cout` 打印文本。\n- 学习 `\\n` 和 `endl` 在格式化方面的区别。\n- 使用 `cout`\
    \ 格式化输出以提高可读性。\n\n## 测验\n\n1. C++ 中 `cout` 的主要目的是？\n2. 如何使用 `cout` 创建换行？\n\n"
- fmt: "\n# 3. What is the difference between `\\n` and `endl`?\n\n## Glossary\n\n\
    - `cout`: Standard output stream used to print text and variables to the console.\n\
    - `endl`: Manipulator that adds a new line and flushes the output buffer.\n- `\\\
    n`: Escape sequence for creating a new line in a string.\n- `Output`: The process\
    \ of displaying information from the program to the console.\n\n# Chapter 5 C++\
    \ Comments\n\n## What are Comments in C++?\nComments in C++ are lines of text\
    \ in your code that are ignored by the compiler. They allow developers to explain\
    \ their code, leave notes for future reference, or temporarily disable parts of\
    \ the code without deleting it. Comments improve the readability of the code,\
    \ especially in large projects where multiple programmers may be involved. By\
    \ adding comments, you can make your code more understandable to yourself and\
    \ others, explaining the purpose of each part of the program.\n\nComments are\
    \ also helpful when debugging, as you can comment out specific sections to see\
    \ how your program behaves without them. Although they do not affect how the program\
    \ runs, they serve as an essential tool in maintaining and organizing code effectively.\n\
    \n## Single-line Comments\n\n### What is a Single-line Comment?\nA single-line\
    \ comment is a brief remark or explanation written on one line. It’s commonly\
    \ used to explain a specific line of code or leave quick notes. Single-line comments\
    \ begin with `//` and everything after it on that line is ignored by the compiler.\
    \ These are useful for short explanations or reminders, especially when the comment\
    \ refers to a single operation or variable.\n\n### Syntax\nThe syntax for writing\
    \ a single-line comment is straightforward. You begin the comment with two forward\
    \ slashes (`//`), followed by your text. Anything after `//` on that line will\
    \ not be executed by the compiler.\n\n```cpp\n// This is a single-line comment\n\
    cout << \"Hello, World!\";  // Output message\n```\n\n### Syntax Explanation\n\
    When the compiler encounters `//`, it knows to ignore everything that comes after\
    \ it on the same line. This makes it ideal for leaving short notes or describing\
    \ what a line of code does. For instance, if you want to indicate that a particular\
    \ line outputs a message, you can use a single-line comment to explain it without\
    \ affecting the program's execution.\n\n### Code Example\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    // Declare a variable\n    int age\
    \ = 25;\n    // Print the age\n    cout << \"Your age is: \" << age << endl; \
    \ // This outputs the age\n    return 0;\n}\n```\n\n### Code Walkthrough\nIn this\
    \ example, we use comments to describe what each part of the code does. The first\
    \ comment explains that a variable is being declared, while the second comment\
    \ explains that the program prints the value of the variable. By using single-line\
    \ comments, each section of the code is easier to understand at a glance.\n\n\
    ### Notes\nUse single-line comments sparingly and only when necessary to explain\
    \ the function of the code. Avoid over-commenting or restating the obvious, as\
    \ it can clutter your code. Make sure that comments are clear and concise, adding\
    \ value rather than redundancy.\n\n## Multi-line Comments\n\n### What is a Multi-line\
    \ Comment?\nA multi-line comment, also known as a block comment, is used when\
    \ you need to write longer explanations or disable larger sections of code. These\
    \ comments span across multiple lines and are useful for describing complex logic,\
    \ explaining entire blocks of code, or providing detailed documentation within\
    \ the program.\n\n### Syntax\nMulti-line comments begin with `/*` and end with\
    \ `*/`. Everything between these symbols is treated as a comment, regardless of\
    \ how many lines it spans.\n\n```cpp\n/* This is a multi-line comment.\nIt can\
    \ span multiple lines\nand is useful for explaining complex code. */\n```\n\n\
    ### Syntax Explanation\nThe compiler ignores everything between `/*` and `*/`.\
    \ You can use this syntax to add longer descriptions or temporarily disable multiple\
    \ lines of code. Multi-line comments are often used to provide more detailed explanations,\
    \ especially when a simple one-line comment is not enough.\n\n### Code Example\n\
