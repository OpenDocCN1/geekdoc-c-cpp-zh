  trans: "\n\n### 3. 对象创建\n在 `main()` 中，创建了 `Car` 类的对象 `myCar`。\n\n### 4. 设置属性\n为\
    \ `myCar` 的属性分配特定值（\"Toyota\"、Camry\" 和 2020）。\n\n### 5. 方法调用\n使用 `myCar` 对象调用方法\
    \ `displayDetails()`，该方法会打印汽车详情。\n\n此程序演示了如何在类内部定义和使用方法，以便对类的属性执行操作。\n\n## 注意事项\n\
    在 C++ 中定义类方法的最佳实践包括：\n\n- 保持方法简洁并专注于单一任务，以提高可读性和可维护性。\n- 使用 `public` 方法定义与对象交互的接口，并使用\
    \ `private` 方法处理类的内部逻辑。\n- 逻辑化地组织方法，将常用的方法放置在类定义的顶部以保持清晰。\n- 如果你需要一个针对不同类型或不同数量的参数执行相似任务的多个方法版本，请考虑使用方法重载。\n\
    - 当方法修改类属性时要谨慎——确保类在方法执行后类仍保持在一致的状态。\n\n## 项目 1：带有面积和周长的形类\n\n- **目标**：编写一个程序定义一个具有\
    \ `length` 和 `width` 属性的 `Rectangle` 类，以及计算面积和周长的方法。\n- **指令**：定义一个具有两个属性（`length`\
    \ 和 `width`）的类 `Rectangle`。编写计算并返回面积和周长的方法。在 `main()` 函数中使用类创建一个矩形对象并显示其面积和周长。\n\
    \n### 代码\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Rectangle\
    \ {\npublic:\n    int length;\n    int width;\n\n    int area() {\n        return\
    \ length * width;\n    }\n\n    int perimeter() {\n        return 2 * (length\
    \ + width);\n    }\n};\n\nint main() {\n    Rectangle rect;\n    rect.length =\
    \ 10;\n    rect.width = 5;\n    cout << \"Area: \" << rect.area() << endl;\n \
    \   cout << \"Perimeter: \" << rect.perimeter() << endl;\n    return 0;\n}\n```\n\
    \n- **代码解析**：`Rectangle` 类包含了方法 `area()` 和 `perimeter()`。创建了对象 `rect`，设置了它的属性，并调用方法计算并显示面积和周长。\n\
    - **挑战**：修改类以包含一个检查矩形是否为正方形的方法（即 `length == width`）。\n\n## 项目 2：带有显示方法的汽车类\n\n\
    - **目标**：创建一个程序定义一个具有 `make`、`model` 和 `year` 属性的 `Car` 类，以及一个显示汽车详情的方法。\n- **指令**：定义一个具有三个属性（`make`、`model`\
    \ 和 `year`）的 `Car` 类。编写一个打印汽车详情的方法 `displayDetails()`。在 `main()` 函数中使用类创建一个汽车对象并显示其详情。\n\
    \n### 代码\n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\
    \nclass Car {\npublic:\n    string make;\n    string model;\n    int year;\n\n\
    \    void displayDetails() {\n        cout << \"Car: \" << make << \" \" << model\
    \ << \" (\" << year << \")\" << endl;\n    }\n};\n\nint main() {\n    Car myCar;\n\
    \    myCar.make = \"Toyota\";\n    myCar.model = \"Camry\";\n    myCar.year =\
    \ 2020;\n    myCar.displayDetails();\n    return 0;\n}\n```\n\n- **代码解析**：`Car`\
    \ 类包含了 `displayDetails()` 方法。创建了对象 `myCar`，设置了它的属性，并调用方法显示详情。\n- **挑战**：添加一个功能使用方法更新汽车的年份。\n\
    \n## 检查清单\n- 理解如何创建和使用类。\n- 学习如何读写文件。\n- 练习使用 `fstream` 进行持久化。\n\n## 第 20 章：文件\n\
    文件用于在硬盘上持久化存储数据。在 C++ 中，我们使用 `<fstream>` 库来处理文件操作。\n\n### 文件流类型\n- `ifstream`:\
    \ 用于从文件中。\n- `ofstream`: 用于写入文件。\n- `fstream`: 用于同时读取和写入文件。\n\n### 文件操作语法\n要操作文件，必须包含\
    \ `<fstream>` 头文件。\n\n```cpp\n#include <fstream>\n```\n\n#### 从文件读取\n要从文件中读取，你需要使用\
    \ `ifstream` 对象。\n1. 打开文件：`ifstream inFile(\"input.txt\");`\n2. 使用提取运算符 `>>` 获取数据。\n\
    \   示例：`inFile >> data;` 从文件中读取一个值并将其存储在 `data` 中。\n\n#### 写入文件\n要向文件写入，你需要使用\
    \ `ofstream` 对象。\n1. 打开文件：`ofstream outFile(\"output.txt\");`\n2. 使用插入运算符 `<<`\
    \ 发送数据。\n   示例：`outFile << \"Hello, World!\";` 将字符串写入文件。\n\n#### 关闭文件\n在完成文件操作后，使用\
    \ `close()` 方法关闭文件是非常重要的。这将释放系统资源并确保所有数据都已正确保存。\n\n## 测验\n1. `ofstream` 的目的是什么？\n\
    2. 在 C++ 中如何读取文件？\n3. 打开新文件的语法是什么？\n\n## 术语表\n- **类 (Class)**：创建对象的蓝图，定义了属性和方法。\n\
    - **对象 (Object)**：类的实例。\n- **方法 (Method)**：定义在类内部的函数，对其属性进行操作。\n- **访问修符 (Access\
    \ Specifiers)**：如 `public` 和 `private` 等关键字，用于控制类成员的可见性。\n\n"
- fmt: "\n## 4. Reading from File\nThe input file stream `ifstream inFile(\"example.txt\"\
    );` opens the file for reading. The `getline(inFile, line)` function reads each\
    \ line from the file and stores it in the string `line`.\n\n## 5. Displaying Content\n\
    The file’s contents are printed to the console using `cout`.\n\n## 6. Closing\
    \ File\nFinally, the input file is closed using `inFile.close()`.\n\nThis example\
    \ demonstrates both reading from and writing to a file in C++.\n\n## Notes\nBest\
    \ practices for file handling in C++ include:\n\n* Always check if the file was\
    \ successfully opened before reading or writing to avoid runtime errors. You can\
    \ use `if(inFile.is_open())` or `if(outFile.is_open())` to verify.\n* Always close\
    \ files after use with the `close()` function to free up system resources and\
    \ prevent data loss.\n* Use `getline()` for reading lines of text to avoid issues\
    \ with spaces or newline characters, which can be missed when using the extraction\
    \ operator (`>>`).\n* Handle errors gracefully, using error messages or alternative\
    \ actions when files cannot be opened or written to.\n\n## Project 1: Write and\
    \ Read from a File\n\n* **Objective**: Write a program that creates a file, writes\
    \ a few lines to it, and then reads and displays the contents.\n* **Instructions**:\
    \ Create an output file, write several lines of text to it, close the file, then\
    \ reopen it as an input file and display the contents line by line.\n\n### Code:\n\
    ```cpp\n#include <iostream>\n#include <fstream>\n\nusing namespace std;\n\nint\
    \ main() {\n    ofstream outFile(\"myfile.txt\");\n    outFile << \"This is the\
    \ first line.\" << endl;\n    outFile << \"This is the second line.\" << endl;\n\
    \    outFile.close();\n\n    ifstream inFile(\"myfile.txt\");\n    string line;\n\
    \    while (getline(inFile, line)) {\n        cout << line << endl;\n    }\n \
    \   inFile.close();\n\n    return 0;\n}\n```\n\n### Code Walkthrough and Challenge\n\
    * **Code Walkthrough**: The program first writes two lines to `myfile.txt`, then\
    \ reads and prints each line from the file.\n* **Challenge**: Modify the program\
    \ to append more lines to the file without overwriting the existing content.\n\
    \n## Project 2: Store and Retrieve User Input in a File\n\n* **Objective**: Create\
    \ a program that stores user input in a text file and retrieves it later to display\
    \ the stored information.\n* **Instructions**: Write a program that prompts the\
    \ user for input, stores the input in a file, and then retrieves and displays\
    \ it. The program should close and reopen the file between writing and reading.\n\
    \n### Code:\n```cpp\n#include <iostream>\n#include <fstream>\n\nusing namespace\
    \ std;\n\nint main() {\n    string userInput;\n    cout << \"Enter some text:\
    \ \";\n    getline(cin, userInput);\n\n    ofstream outFile(\"userinput.txt\"\
    );\n    outFile << userInput << endl;\n    outFile.close();\n\n    ifstream inFile(\"\
    userinput.txt\");\n    string fileContent;\n    getline(inFile, fileContent);\n\
    \    cout << \"Stored text: \" << fileContent << endl;\n    inFile.close();\n\n\
    \    return 0;\n}\n```\n\n### Code Walkthrough and Challenge\n* **Code Walkthrough**:\
    \ This program takes user input, stores it in a file, and then reads and displays\
    \ the content from the file.\n* **Challenge**: Modify the program to store multiple\
    \ lines of user input in the file and retrieve all the lines.\n\n## End of Chapter\
    \ Checklist\n* Understand how file streams (`ifstream`, `ofstream`, and `fstream`)\
    \ work in C++ for reading and writing files.\n* Practice opening, reading from,\
    \ and writing to files, as well as closing files properly.\n* Learn how to handle\
    \ file input/output errors and use best practices for managing file resources.\n\
    \n## Quiz\n1. What is the purpose of file streams in C++?\n2. How do you open\
    \ a file for reading in C++?\n3. Why is it important to close a file after use?\n\
    \n## Glossary\n* **File Stream**: A channel for reading data from or writing data\
    \ to a file in C++.\n* **ifstream**: An input file stream used for reading from\
    \ files.\n* **ofstream**: An output file stream used for writing to files.\n*\
    \ **getline()**: A function used to read an entire line of text from a file or\
    \ the input stream.\n\n## Chapter 25: C++ Exceptions\n\n### What are Exceptions\
    \ in C++?\nExceptions in C++ are a method of handling runtime errors that can\
    \ occur during program execution. Instead of causing a program to crash when an\
    \ error occurs, exceptions allow the program to handle the error gracefully and\
    \ continue running or terminate in a controlled manner. This is essential in building\
    \ robust, error-resilient software.\n\nAn exception is an error or unexpected\
    \ event that occurs while a program is running, such as division by zero or accessing\
    \ invalid memory. C++ provides mechanisms to detect these issues using `try`,\
    \ `throw`, and `catch` blocks. The `try` block contains code that may throw an\
    \ exception, the `throw` keyword is used to raise the exception, and the `catch`\
    \ block handles the exception.\n\nWhen an exception is thrown, the normal flow\
    \ of the program stops, and control is transferred to the `catch` block, where\
    \ the error is managed. Exception handling provides a structured way to manage\
    \ errors, making programs more reliable by dealing with unexpected issues without\
    \ crashing or failing silently.\n\n### Syntax\nThe syntax for exception handling\
    \ in C++ includes three keywords: `try`, `throw`, and `catch`.\n\n```cpp\ntry\
    \ {\n    // Code that may throw an exception\n    if (condition) {\n        throw\
    \ exception_type; // Throw an exception\n    }\n} catch (exception_type e) {\n\
    \    // Handle the exception\n}\n```\n\n* **try**: Encloses code that may throw\
    \ an exception.\n* **throw**: Signals that an exception has occurred.\n* **catch**:\
    \ Catches the thrown exception and provides a way to handle it.\n\nFor example:\n\
    ```cpp\ntry {\n    throw 404;\n} catch (int e) {\n    cout << \"Error: \" << e\
    \ << endl;\n}\n```\n\n### Syntax Explanation\n1. **try block**: The `try` block\
    \ contains the code that might generate an exception. This block is executed unless\
    \ an exception occurs.\n2. **throw statement**: When an exception is detected,\
    \ the `throw` statement is used to signal the occurrence. This can be any valid\
    \ C++ expression, such as an integer, string, or object.\n3. **catch block**:\
    \ The `catch` block receives the thrown exception. It must specify the type of\
    \ exception it is designed to catch. You can have multiple `catch` blocks.\n\n\
    Exception handling allows programs to manage unexpected events without terminating\
    \ abruptly, ensuring better error management and recovery.\n\n### Code Example\n\
    Here’s an example of exception handling in C++:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    try {\n        int a = 10, b = 0;\n\
    \        if (b == 0) {\n            throw \"Division by zero!\";\n        }\n\
    \        cout << \"Result: \" << a / b << endl;\n    } catch (const char* msg)\
    \ {\n        cout << \"Error: \" << msg << endl;\n    }\n\n    return 0;\n}\n\
    ```\n\nThis program attempts to divide by zero, throws an exception, and catches\
    \ it to print an error message.\n"
