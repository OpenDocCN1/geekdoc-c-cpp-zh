    *   Use  getline() for reading lines of text to avoid issues with spaces or newline
    characters, which can be missed when using the extraction operator (>>).


    *   Handle errors gracefully, using error messages or alternative actions when
    files cannot be opened or written to.


    Project 1: Write and Read from a File


    *   Objective: Write a program that creates a file, writes a few lines to it,
    and then reads and displays the contents.


    *   Instructions: Create an output file, write several lines of text to it, close
    the file, then reopen it as an input file and display the contents line by line.


    Code:


    #include <iostream>


    #include <fstream>


    using namespace std;


    int main() {


    ofstream outFile("myfile.txt");


    outFile << "This is the first line." << endl;


    outFile << "This is the second line." << endl;


    outFile.close();


    ifstream inFile("myfile.txt");


    string line;


    while (getline(inFile, line)) {


    cout << line << endl;


    }


    inFile.close();


    return 0;


    }


    *   Code Walkthrough: The program first writes two lines to  myfile.txt, then
    reads and prints each line from the file.


    *   Challenge: Modify the program to append more lines to the file without overwriting
    the existing content.


    Project 2: Store and Retrieve User Input in a File


    *   Objective: Create a program that stores user input in a text file and retrieves
    it later to display the stored information.


    *   Instructions: Write a program that prompts the user for input, stores the
    input in a file, and then retrieves and displays it. The program should close
    and reopen the file between writing and reading.


    Code:


    #include <iostream>


    #include <fstream>


    using namespace std;


    int main() {


    string userInput;


    cout << "Enter some text: ";


    getline(cin, userInput);


    ofstream outFile("userinput.txt");


    outFile << userInput << endl;


    outFile.close();


    ifstream inFile("userinput.txt");


    string fileContent;


    getline(inFile, fileContent);


    cout << "Stored text: " << fileContent << endl;


    inFile.close();


    return 0;


    }


    *   Code Walkthrough: This program takes user input, stores it in a file, and
    then reads and displays the content from the file.


    *   Challenge: Modify the program to store multiple lines of user input in the
    file and retrieve all the lines.


    End of Chapter Checklist


    *   Understand how file streams (ifstream,  ofstream, and  fstream) work in C++
    for reading and writing files.


    *   Practice opening, reading from, and writing to files, as well as closing files
    properly.


    *   Learn how to handle file input/output errors and use best practices for managing
    file resources.


    Quiz


    1.  What is the purpose of file streams in C++?


    2.  How do you open a file for reading in C++?


    3.  Why is it important to close a file after use?


    Glossary


    *   File Stream: A channel for reading data from or writing data to a file in
    C++.


    *   ifstream: An input file stream used for reading from files.


    *   ofstream: An output file stream used for writing to files.


    *   getline(): A function used to read an entire line of text from a file or the
    input stream.


    Chapter 25\. C++ Exceptions 


    What are Exceptions in C++? 


    Exceptions in C++ are a method of handling runtime errors that can occur during
    program execution. Instead of causing a program to crash when an error occurs,
    exceptions allow the program to handle the error gracefully and continue running
    or terminate in a controlled manner. This is essential in building robust, error-resilient
    software.


    An exception is an error or unexpected event that occurs while a program is running,
    such as division by zero or accessing invalid memory. C++ provides mechanisms
    to detect these issues using try, throw, and catch blocks. The try block contains
    code that may throw an exception, the throw keyword is used to raise the exception,
    and the catch block handles the exception.


    When an exception is thrown, the normal flow of the program stops, and control
    is transferred to the catch block, where the error is managed. Exception handling
    provides a structured way to manage errors, making programs more reliable by dealing
    with unexpected issues without crashing or failing silently.


    Syntax


    The syntax for exception handling in C++ includes three keywords: try, throw,
    and catch.


    try {


    // Code that may throw an exception


    if (condition) {


    throw exception_type; // Throw an exception


    }


    } catch (exception_type e) {


    // Handle the exception


    }


    *   try: Encloses code that may throw an exception.


    *   throw: Signals that an exception has occurred.


    *   catch: Catches the thrown exception and provides a way to handle it.


    For example:


    try {


    throw 404; // Throw an exception


    } catch (int e) {


    cout << "Error: " << e << endl;


    }


    Syntax Explanation


    1.  try block: The  try block contains the code that might generate an exception.
    This block is executed normally unless an exception occurs. For example, if you
    are performing a division, you might place the division code inside a  try block.


    2.  throw statement: When an exception is detected, the  throw statement is used
    to signal the occurrence of the exception. This can be any valid C++ expression,
    such as an integer, string, or an object. When  throw is executed, the control
    is immediately transferred to the matching  catch block.


    3.  catch block: The  catch block receives the thrown exception and handles it.
    It must specify the type of exception it is designed to catch, such as  int or  std::string.
    You can have multiple  catch blocks to handle different types of exceptions.


    Exception handling allows programs to manage unexpected events without terminating
    abruptly, ensuring better error management and recovery.


    Code Example


    Here’s an example of exception handling in C++:


    #include <iostream>


    using namespace std;


    int main() {


    try {


    int a = 10, b = 0;


    if (b == 0) {


    throw "Division by zero!";


    }


    cout << "Result: " << a / b << endl;


    } catch (const char* msg) {


    cout << "Error: " << msg << endl;


    }


    return 0;


    }


    This program attempts to divide by zero, throws an exception, and catches it to
    print an error message.


    Code Walkthrough


    1.  try block: The program attempts to divide two integers,  a and  b. Since  b
    is zero, it triggers an exception using the  throw statement.


    2.  throw statement: The  throw keyword is used to throw the string  "Division
    by zero!" when the condition  b == 0 is met. This signals the occurrence of an
    error and transfers control to the  catch block.


    3.  catch block: The  catch block catches the thrown exception, represented by
    a  const char* parameter, and handles it by printing the error message  "Division
    by zero!" to the console.


    This example demonstrates how exceptions provide a mechanism for gracefully handling
    errors such as division by zero, ensuring the program doesn’t crash.


    Notes


    Best practices for handling exceptions include:


    *   Only use exceptions for exceptional circumstances that are unexpected, not
    for normal control flow.


    *   Catch exceptions by reference to avoid unnecessary copies and to handle polymorphic
    exceptions correctly.


    *   Use specific catch blocks before generic ones to handle different types of
    exceptions separately. For example, catch  std::invalid_argument before  std::exception.'
