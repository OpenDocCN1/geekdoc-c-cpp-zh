- fmt: "\nStrings in C++ are sequences of characters used to store and manipulate\
    \ text. Unlike primitive data types such as integers or floats, strings are more\
    \ complex as they can hold multiple characters and be modified. In modern C++,\
    \ strings are objects of the `std::string` class, which provides a variety of\
    \ functions for string manipulation, such as concatenation, searching, and modifying\
    \ content.\n\nStrings are stored in memory as sequences of characters, with each\
    \ character occupying one byte. In C++, string management is simplified thanks\
    \ to the `string` class, which handles much of the memory management for you.\
    \ However, understanding how strings work under the hood, especially in terms\
    \ of length and mutability, is crucial for effective programming. Knowing how\
    \ to manipulate strings properly can help you avoid common pitfalls, such as buffer\
    \ overflows and incorrect memory allocation.\n\n***\n\n# Concatenation\n\n###\
    \ What is String Concatenation?\nString concatenation in C++ refers to the process\
    \ of combining two or more strings into one. This is a common operation when working\
    \ with text data, such as combining first and last names or merging user input\
    \ with predefined text.\n\nC++ offers two primary ways to concatenate strings:\n\
    - Using the `+` operator\n- Using the `append()` function\n\nBoth methods combine\
    \ strings into a new string, but `append()` directly modifies the original string.\n\
    \n### Syntax\nThe basic syntax for string concatenation using the `+` operator\
    \ is:\n```cpp\nstring fullName = firstName + \" \" + lastName;\n```\n\nTo use\
    \ `append()`:\n```cpp\nstring fullName = firstName;\nfullName.append(\" \").append(lastName);\n\
    ```\n\n### Syntax Explanation\nThe `+` operator creates a new string by combining\
    \ two strings and returns the result. It's a simple and intuitive way to join\
    \ strings. However, if you need to concatenate strings multiple times or modify\
    \ an existing string, the `append()` function is more efficient. This function\
    \ directly modifies the calling string instead of creating a new one every time.\n\
    \nString concatenation can be useful when dealing with dynamic content. For example,\
    \ when building a personalized greeting like \"Hello, John Doe!\", you can use\
    \ concatenation to combine variables and constant text.\n\n### Code Example\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    string\
    \ firstName = \"John\";\n    string lastName = \"Doe\";\n    string fullName =\
