    \ (the key).\n\nIn C++, `std::map` is used to implement maps. It provides efficient\
    \ lookup, insertion, and deletion operations based on keys.\n"
  raw: 'A stack is a LIFO (Last-In-First-Out) data structure where the last element
    added is the first one to be removed. In C++, stacks are part of the STL and are
    implemented as an adapter over other containers like vectors or deques.


    Stacks are useful in algorithms requiring backtracking, such as depth-first search,
    or for balancing parentheses in expressions.


    Syntax


    #include <stack>


    std::stack<int> myStack;


    Syntax Explanation


    Key operations for a stack include:


    *   push(): Adds an element to the top of the stack.


    *   pop(): Removes the top element.


    *   top(): Accesses the top element without removing it.


    *   empty(): Checks if the stack is empty.


    Stacks do not allow access to elements other than the one at the top, which simplifies
    their use in certain algorithmic problems.


    Code Example


    #include <iostream>


    #include <stack>


    int main() {


    std::stack<int> myStack;


    myStack.push(10);


    myStack.push(20);


    myStack.pop();


    std::cout << myStack.top() << std::endl;


    return 0;


    }


    Code Walkthrough


    This program creates a stack, pushes two integers onto it, pops one off, and then
    prints the top element, which is 10\. The stack follows the LIFO principle.


    Notes


    *   Use stacks for algorithms involving backtracking or balancing operations.


    *   Always check if the stack is empty before accessing the top element to avoid
    runtime errors.


    Queues


    What are Queues in C++? 


    A queue is a FIFO (First-In-First-Out) data structure, where the first element
    added is the first one to be removed. Queues are essential in scenarios where
    order matters, such as handling tasks in a scheduling system or simulating real-world
    queues like customer service lines.


    In C++, queues are implemented in the Standard Template Library (STL) using the  std::queue
    container adapter, typically backed by a  deque or  list. Queues support operations
    like inserting elements at the back and removing elements from the front.


    Syntax


    #include <queue>


    std::queue<int> myQueue;


    This example shows how to declare a queue of integers using  std::queue. Elements
    can be added using  push() and removed using  pop().


    Syntax Explanation


    Key operations for a queue include:


    *   push(element): Adds an element to the back of the queue.


    *   pop(): Removes the front element from the queue.


    *   front(): Accesses the element at the front of the queue.


    *   back(): Accesses the element at the back.


    *   empty(): Checks if the queue is empty.


    Queues are useful when you need to process elements in the order they are added.
    Operations like  pop() ensure that elements are removed in the same order they
    were inserted.


    Code Example


    #include <iostream>


    #include <queue>


    int main() {


    std::queue<int> myQueue;


    myQueue.push(10);


    myQueue.push(20);


    myQueue.push(30);


    myQueue.pop();


    std::cout << "Front: " << myQueue.front() << std::endl;


    return 0;


    }


    Code Walkthrough


    This program demonstrates a queue where elements 10, 20, and 30 are added. The  pop()
    function removes 10, the first element, leaving 20 as the front element, which
    is printed to the console. Queues follow the FIFO principle, making them ideal
    for tasks like buffering data.


    Notes


    *   Use queues in situations where the order of processing matters.


    *   Ensure that the queue is not empty before calling  front() or  pop() to avoid
    errors.


    *   The queue is efficient for adding and removing elements at the respective
    ends.


    * * *


    Deque


    What is Deque in C++? 


    A deque (double-ended queue) is a data structure that allows insertions and deletions
    at both ends. It combines the features of both stacks and queues. Deques are efficient
    for both adding elements to the front and back and removing them from either end.


    In C++, deques are implemented in the Standard Template Library (STL) as  std::deque.
    Deques are useful when you need flexibility in inserting or removing elements
    from both sides, making them a versatile data structure.


    Syntax


    #include <deque>


    std::deque<int> myDeque;


    This example shows how to declare a deque of integers using  std::deque. You can
    add elements to the front or back using  push_front() and  push_back().


    Syntax Explanation


    Key operations for a deque include:


    *   push_front(element): Adds an element to the front.


    *   push_back(element): Adds an element to the back.


    *   pop_front(): Removes the front element.


    *   pop_back(): Removes the back element.


    *   front(): Accesses the element at the front.


    *   back(): Accesses the element at the back.


    Deques provide greater flexibility than stacks or queues because you can add or
    remove elements from either end, making them useful for double-ended processing.


    Code Example


    #include <iostream>


    #include <deque>


    int main() {


    std::deque<int> myDeque;


    myDeque.push_back(10);


    myDeque.push_front(5);


    myDeque.push_back(15);


    myDeque.pop_front();


    std::cout << "Front: " << myDeque.front() << std::endl;


    return 0;


    }


    Code Walkthrough


    This program creates a deque, adds elements to both the front and back, and removes
    an element from the front using  pop_front(). The resulting deque contains 10
    and 15, with 10 at the front, which is printed.


    Notes


    *   Use deques for scenarios requiring both front and back access.


    *   Deques provide constant time complexity for adding and removing elements at
    either end, making them more versatile than vectors for specific use cases.


    *   Consider whether a deque is necessary, as vectors or lists may be more suitable
    depending on the operations required.


    * * *


    Sets


    What are Sets in C++? 


    A set in C++ is a container that stores unique elements in a sorted order. Sets
    automatically eliminate duplicate values, which makes them ideal for managing
    collections where each element must be distinct.


    In C++,  std::set is used to implement sets. Sets provide efficient lookup and
    insertion operations, with logarithmic time complexity for most operations. Sets
    are typically implemented as balanced binary search trees, allowing them to keep
    elements in sorted order.


    Syntax


    #include <set>


    std::set<int> mySet;


    This example shows how to declare a set of integers using  std::set. Elements
    can be added to the set using  insert().


    Syntax Explanation


    Key operations for a set include:


    *   insert(element): Adds a unique element to the set.


    *   find(element): Searches for an element in the set.


    *   erase(element): Removes an element from the set.


    *   size(): Returns the number of elements in the set.


    Sets automatically sort the elements and ensure that all elements are unique,
    making them suitable for scenarios like maintaining unique user IDs or managing
    collections where duplicates are not allowed.


    Code Example


    #include <iostream>


    #include <set>


    int main() {


    std::set<int> mySet;


    mySet.insert(10);


    mySet.insert(20);


    mySet.insert(10);  // Duplicate, will not be added


    for (int num : mySet) {


    std::cout << num << std::endl;


    }


    return 0;


    }


    Code Walkthrough


    In this example, the set is used to store integers. The  insert() method ensures
    that only unique elements are added. Even though 10 is inserted twice, it only
    appears once in the final output. The set also automatically sorts the elements
    in ascending order.


    Notes


    *   Sets are efficient for maintaining collections of unique elements.


    *   Always use  find() to check if an element exists before performing operations
    that depend on its presence.


    *   Sets are ideal for eliminating duplicates from a collection of data while
    keeping it sorted.


    * * *


    Maps


    What are Maps in C++? 


    A map in C++ is a data structure that stores elements as key-value pairs. Each
    key is unique, and the map associates each key with a value. Maps are useful when
    you need to associate a specific piece of data (the value) with a unique identifier
    (the key), such as mapping names to phone numbers.


    In C++,  std::map is used to implement maps. It provides efficient lookup, insertion,
    and deletion operations based on keys, typically in logarithmic time due to its
    underlying balanced tree structure.


