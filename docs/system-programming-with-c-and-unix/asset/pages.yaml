  md: '# System Calls


    An operating system (O/S) is a program that has two main jobs: it manages the
    resources of the computer, including peripherals, files, and memory, and it coordinates
    all other programs running on the computer. Figure 7.1 shows a conceptual diagram.
    In reality, an O/S is a collection of programs, the heart of which is the kernel.
    After bootloading (i.e., loading the O/S from a hard drive or other secondary
    memory), the kernel is executed. The kernel eventually runs the init process,
    which is what spawns all other processes. The kernel also acts as the moderator
    between applications and the resources of the computer.


    The kernel provides a set of functions to other programs called system calls.
    System calls are used to request access to the resources of the machine, to communicate
    with other currently running programs, and to start new programs. A collection
    of system calls is sometimes referred to as an application programming interface
    (API). Different operating systems provide different sets of system calls. Over
    the years, standards have been developed to regularize a subset of system calls
    to all systems, for example, POSIX. It is beyond the scope of this book to detail
    the full POSIX standard, or to contrast differences in system calls from various
    kernels. Instead, this chapter focuses on explaining some the primary families
    of operations provided by system calls. Detailed examples are provided for some
    families to familiarize the reader with the use of system calls. This coverage
    is intended to complement (or prepare for) what is typically seen in an operating
    system textbook.


    +   1. The interested reader is directed to Advanced Programming in the UNIX Environment,
    2nd ed., R. Stevens and S. Rago, Addison-Wesley, 2005, ISBN 0201433079. This excellent
    book provides a history of many Unix APIs and provides a comparative coverage
    of many system calls.'
  merge: -1
  pgno: 228
