    # 6.2.2 Multiple Files


    As the number of functions in a program increases, it is convenient to break them
    up into multiple files. It makes it easier to edit a file, because there are fewer
    lines of source code to scroll through to find the function of interest. It also
    makes program building more efficient. After changing code within a single function,
    only the file containing that code needs to be recompiled. The other files (assuming
    the object code files are kept between program builds) only need to be linked
    to create a new executable.


    A common way to group functions is by the sort of actions they accomplish. For
    example, functions that read and write data to files might be collectively stored
    in a file named file.c. Another way to group functions is by the type of data
    upon they operate. For example, in a file named vector.c, one could expect to
    find functions that perform mathematical operations over vectors. just with multiple
    functions, the separation of functions into multiple files can be overused. Although
    it is common for a file named main.c to contain only one function (the main()
    function), populating a large number of files with a scarce number of functions
    in each is general a bad practice.


    # 6.2.3 Variable Scope


    The scope of a variable defines which parts of a program can access and use the
    variable. When breaking a program into multiple functions and files, scope is
    a tool that can help organize variable usage. It is possible to have all variables
    be global, accessible throughout the entire program. However, providing different
    scope to different variables helps organize the extent to which each variable
    is needed. For example, some variables might be needed for only one function,
    others for a handful of functions, others for only part of a function, and still
    for the entire program.


    The scope of a variable is defined in its declarataion. A variable declaration
    can have four parts:


    +   1. Data type: int, float, char, double. These describe how many bytes of storage
    are used by the variable and what bit model is used to represent values.


    +   2. Modifiers: signed, unsigned, short, long. These modify how many bytes are
    used and how the bits may be used.'
