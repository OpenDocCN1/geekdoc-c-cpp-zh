  md: '# 9.2 Shell Scripting 323


    The type of data held by the variable is also unimportant. In a shell program,
    there is only one type of variable, and no distinction is made between text and
    numeric data, or between different types of numeric data. All variables are stored
    as strings. Numeric operations can be performed upon variables, but the variables
    are passed to the appropriate operator as strings and then converted before the
    numeric operation is performed. If a numeric result is stored in a variable, it
    is automatically converted back to a string before storage. This is another shortcut
    by shell programming. The idea is to relieve any burden upon the programmer with
    regards to explicit data typing.


    By convention, variables are often named using all uppercase letters. This allows
    them to be seen easily and differentiated from other code. If a variable is named
    using two or more words, then by convention the underscore character is often
    used to separate the words. For example:


    ```

    $!/bin/sh

    AUTHOR_NAME="Douglas Adams"

    ```


    Some variables are declared automatically. For example:


    ```

    $!/bin/sh

    echo Run with arguments $$

    echo First three command line arguments:

    echo $1

    echo $2

    echo PID IS $$

    ```


    If this code is stored in a file named vars.sh, then executing it produces output
    like the following:


    ```

    ahoover@video> vars.sh turtle frog tree

    Run with 3 arguments

    First three command line arguments:

    vars.sh

    turtle

    frog

    PID is 23061

    ahoover@video>

    ```


    The command line arguments are stored similarly to how they are stored for a C
    program. The process ID can be useful if multiple copies of the script are executed
    concurrently. Each process can use its PID to uniquely name temporary storage
    files or constructs that would otherwise collide.'
