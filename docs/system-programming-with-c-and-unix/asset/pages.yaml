    # 8.7 Library Pitfalls


    Once a programmer gets used to the idea of using libraries, it is easy to get
    enthral by them. They save time and allow us to code things that might otherwise
    be very difficult. It is important to remember that a library is just a tool.
    Libraries should be used to help overcome problems, not just because they are
    available. A programmer can make the mistake of using a library when its utility
    to a given problem is minimal. This is bad, because now an application is tied
    to a library that doesn''t really need. Programs can become bloated and difficult
    to maintain simply because they have been linked to too many libraries.


    Another common pitfall is to spend too much time looking for a library to solve
    a problem. It can be enticing to think that somebody "out somewhere" has already
    written code to tackle the problem at hand. This leads to a programmer''s reluctance
    to solve a given problem from scratch, and a dependence on searching for existing
    library-supported solutions. Searching can end up more time than simply writing
    code from scratch. It can also cause a programmer to use a library that not quite
    fit the problem at hand, but which can be forced to provide a hacked solution.
    This leads to inefficient and sometimes error-prone applications.


    A library is just another tool in the arsenal of an experienced programmer. Like
    a debugger, a shell, or a system call, a library is there to help solve problems.
    A carpenter might use a hammer, a wrench, or a screwdriver to work on something,
    but (hopefully) only in the appropriate circumstances. Similarly, a programmer
    should only use the tools at hand when the job calls for them.'
