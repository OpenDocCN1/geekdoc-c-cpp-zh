  md: '# 3.3 • String Library Functions


    There are a handful of calculations that are common to a large number of text
    processing problems. These calculations include finding the length of a string
    and comparing the contents of two strings. Because they are so common, the C standard
    library has evolved to include functions to perform these calculations. In Chapter
    8 (Section 8.3) we take a deeper look at the C standard library, which contains
    functions for a variety of purposes; in this section, we are concerned only with
    the portion of the library involved in text processing. Even that portion of the
    library contains dozens of functions. However, there are five functions that cover
    the most common calculations and operations:


    | Function | What it does |

    |---|---|

    | strlen() | count the total characters in the string |

    | strcmp() | compare two strings, determine if identical |

    | strcpy() | copy one string into another string variable |

    | strcat() | append one string to another string |

    | sprintf() | print formatted output into a string variable |


    The following sections examine each of these functions from the perspective of
    memory. Studying the operations at the memory level is a good way to approach
    text processing problems and is particularly helpful when tackling problems outside
    the scope of the string library functions.


    # 3.3.1 String Length: strlen()


    Suppose we wish to count the number of characters in a string. For example:


