  md: '# Questions and Exercises


    other languages. This leads to a lack of understanding how scripting languages
    fit into the big picture of computing.


    Scripting languages are only one of many tools available for programming work.
    When used efficiently, they can save programming time. However, a programmer grammar
    should use a scripting language only if it has features that specifically support
    the work for which the programmer is tasked. Forcing a scripting language upon
    a problem can not only result in longer programming, but it can also yield inefficient
    code that runs much slower than necessary, and code that is difficult to administer
    because of the lack of formal methods in scripting languages. For example, it
    would not be prudent to write a codec (data compressor and decompressor) using
    a scripting language.


    New scripting languages are invented periodically. They typically arise as a group
    of programmers find themselves doing a specific type of repetitive work. Seeking
    time savings, the group develops a scripting language to simplify or automate
    parts of the work. It is highly unlikely that a computing professional will see
    several scripting languages throughout his or her career. Understanding the design
    goals and limitations help one make good decisions about how to use scripting
    languages for programming work.


