  md: '# 7.5 Socket System Calls


    Socket system calls are used for interprocess communication on a network. They
    allow a process on one computer to communicate with a process on another computer.
    In order to communicate, each process makes some socket system calls to set itself
    up for sending or receiving data. Additional system calls are then made to actually
    send or receive the data. Finally, each process makes a system call to terminate
    the communication. These three steps (connect, send/receive data, terminate) bear
    a resemblance to basic file I/O (open, read/write data, close). The main difference
    is that a file and a program accessing that file are on the same system, and so
    the options in the communication are more limited. The socket system calls act
    similarly to those used for file I/O, but they provide a greater set of options
    to facilitate communication between processes on different machines.


    In order to explain socket system calls, this section will first cover some basic
    networking concepts and system commands. The client-server model is explained,
    and the most common socket system calls are explained. At the end of the section,
    two process-to-process communication problems are examined to show how the socket
    system calls can solve these problems. Note that this section does not provide
    a detailed explanation of every possible scenario or is beyond the scope of this
    text. The interested reader is referred to Unix Network Programming, Volume 1:
    R. Stevens, B. Fenner, and A. Rudoff, Addison-Wesley, 2003, ISBN 0131411551, for
    a book that covers the entire sockets API and networking background in general.
    The goal of this section is to introduce the reader to the concepts involved in
    network communication and process system calls.


    # 7.5.1 Network Concepts and System Commands


    The network interface of a computer is identified by its Internet Protocol (IP)
    address. An IP address is a numeric identifier unique to a single machine on the
    network. At the time of this writing, the Internet is beginning a transition from
    32-bit identifiers (IPv4) to 128-bit identifiers (IPv6) to allow for the large
    growth in the number of computers connected to the Internet. However, most of
    the Internet still uses IPv4 and all the concepts are similar regardless, so the
    examples used in this section will be demonstrated using IPv4 addressing. The
    32 bits of an IPv4 address are commonly written as a set of four eight-bit numbers
    separated by periods; for example, 192.168.0.100. Historically, the leading portion
    of an IPv4 address (usually the first two or three eight-bit numbers) has been
    used to designate a network of computers colocated or coadministered, while the
    last 8-bit number designates a specific machine on the local network, also called
    a subnet or subnet. Using the Domain Name System (DNS), an IP address is'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'given a corresponding human readable name. For example, 130.127.69.75 has the
    domain name of www.clemson.edu.


    A port is an identifier on a computer through which network communication takes
    place. A computer may have multiple processes involved in separate network communications
    at the same time; each is assigned a different port number. A port is identified
    by a 16-bit, nonnegative integer. The port values in the range 0–1023 are generally
    reserved for system processes. Most of these are standardized to traditional services,
    such as telnet (port 23), secure shell (port 22), web server (port 80), and the
    like. On a Unix system, the file /etc/services contains a full list of standardized
    ports. The port values in the range 1024–49151 are generally assigned to applications.
    The port values in the range 49152–65535 are unreserved and generally used for
    transient connections. The ports used on each of the two computers having a network
    communication do not need to match. When establishing a connection, the calling
    computer must know both the IP address of the computer it wishes to call and the
    port number of the process to which it wishes to communicate.


    There are a number of system programs that manage and report IP and port number
    information. On a Unix system, the ifconfig program reports the machine''s IP
    address. For example:


    ```

