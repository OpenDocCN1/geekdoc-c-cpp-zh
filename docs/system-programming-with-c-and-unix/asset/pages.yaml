    # 8.4.2.2 User Input During Motion


    Moving graphics generally require loops, as described above. The graphic stays
    in motion only as long as the loop keeps iterating. If we require the user to
    be able to provide input to the program while the graphic is in motion, then we
    must turn blocking off. Otherwise, any function call for input will wait until
    input is received. Meanwhile, the motion of the graphic will seem to pause. Using
    a fixed time blocking is also generally a bad idea, unless the fixed-time is very
    small. Otherwise, during iterations where the user immediately provides input,
    the graphic will move faster than during iterations where the program waits for
    the blocking to time out.


    The following code demonstrates polling for user input while a graphic is in motion.
    Polling refers to the process of using a nonblocking function call to check for
    user input, and acting upon the input if given, but otherwise continuing program
    execution.'
