    Interrupt:5 Base address:0xf00

    ahoover@>

    ```


    The IP address of the system, 130.127.24.92, can be seen in the second line of
    output (some of the output is clipped to fit the page). On an MS Windows system,
    the program ifconfig produces similar output. The nslookup program can be used
    to look up the DNS name of an IP address, or vice versa. For example:


    ```

    ahoover@> nslookup -silent 130.127.24.92

