  md: '# 2.2.2 Bit Operators


    Bit operators are the symbols or syntax used in a programming language to affect
    individual bits within a variable. In the C programming language, there are six
    bit operators:


    | Operator | Symbol name | Action |

    |---|---|---|

    | ~ | tilde | bitwise NOT |

    | & | ampersand | bitwise AND |

    | | | vertical bar | bitwise OR |

    | ^ | caret | bitwise XOR |

    | >> | greater-than-greater-than | right-shift |

    | << | less-than-less-than | left-shift |


    The bit operators are intended to be used only on the whole number data types,
    char and int, and the related extensions (e.g., unsigned char). Although bits
    can be manipulated in any variable, it is rare to see bit operators applied to
    the real number data types.


    The bitwise NOT operator inverts every bit in a variable. It is written using
    the tilde symbol (-). For example:


    ```

    unsigned char a;

    a=17;

    a=~a;

    printf("%d\n", a);

    ```


    The result of executing this code is:


    ```

    238

    ```


