  md: "# 9.4.3 Loops and Conditionals\n\nThe MATLAB language has the familiar for\
    \ and while loop programming statements. For example:\n\n```\ni=1:3,\ndisp('Hello');\n\
    end\ni=0;\nwhile i<3,\ndisp('Goodbye');\nni=i+1;\nend\n```\n\nIf this code is\
    \ stored in a file named loops1.m, then executing it produces the following output:\n\
    \n```\n>> loops1\nHello\nHello\nHello\nGoodbye\nGoodbye\nGoodbye\n>>\n```\n\n\
    For the statement iterates a counter variable from a beginning value to an ending\
    \ value by an optional delta amount (the default is 1). The while statement iterates\
    \ as long as a condition is true. For both types of loop, all statements between\
    \ the comma following the loop definition and the end statement are executed each\
    \ iteration. The MATLAB language also contains break and continue statements that\
