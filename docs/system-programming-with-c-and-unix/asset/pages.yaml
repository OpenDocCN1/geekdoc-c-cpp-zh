    # 6.2.4 Comments, Indentation, and Variable Names


    The most basic organizational tools for a programmer involve the readability and
    visual layout of the code. Comments are annotations made by the programmer, like
    small notes used to document ideas throughout a project. Indentation refers to
    the amount and regularity of spacing used to start lines of code in nested blocks.
    Variable names should be chosen to describe what the variable is doing, making
    the code easier to read. All of these practices promote clarity and organization.


    It is important to note that there is no universally accepted "best" to use any
    of the tools. The use of these tools is something of an art. It can be compared
    to the organization of a kitchen. Different people may prefer placing cooking
    equipment in various drawers or cupboards, organizing foodstuffs in different
    ways, and so on. Regardless of the organization chosen, however, the common goal
    is to arrange materials in a way that facilitates cooking. A cook arriving in
    a new kitchen may not immediately recognize or be comfortable with all the arrangements,
    but if the kitchen is well organized, the new cook will be able to work. Keeping
    code well organized is a comparable undertaking with similar rewards. Most programmers
    develop an individual style; consistency is an important trait regardless of the
    details. The following are some conventions adopted.


    Comments can be used throughout a program for a variety of reasons. Most functions
    should have a few sentences near the beginning that describe the task solved by
    the function. It is also common to describe the function inputs and outputs in
    comments. Within a function, code blocks may have single sentence or phrase descriptions,
    serving as a plain text outline for the code. Program usage, history (revisions),
    to-do list, and authorship are commonly commented at the top of the main source
    code file. Variables with overlapping names may have comments defining their purpose
    or expected ranges of values. In code that is complex or critical to the problem,
    comments may be written by line. The following demonstrates some of these uses:


    ```

    /*

    ** This program prompts the user for a number,

    ** and then determines if the number is a sum

    ** of the squares of two unique integers.

    */

    ```'
