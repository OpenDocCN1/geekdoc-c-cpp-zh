  md: '# 2.3 • Memory Map


    In this section, we introduce the memory map concept. A memory map is a table,
    listing all the variables in a piece of code. The table includes the variable
    names, values, and memory addresses. The addresses indicate the sizes of the variables,
    in bytes. Each address is assumed to represent 1 byte. For example, consider the
    following code:


    ```

    char a,b,c;

    a=7;

    b=-13;

    c=0;

    ```


    The memory map for this code could be written as follows:


    | Label | Address | Value |

    | a | 400 | 7 |

    | b | 401 | -13 |

    | c | 402 | 0 |


    The starting address is not important; 400 was picked so that the range of values
    in the addresses differs significantly from the values in the variables, so that
    they are easier to read. The important thing to note in the address column is
    that each variable occupies only 1 byte. This is because a char variable is only
    1 byte in size.


    If variables of different types are used, then the address column should reflect
    their relative sizes. For example, consider the following code:


    ```

