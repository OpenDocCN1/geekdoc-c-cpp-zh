  md: '![](img/4c54f2714bbf728ff6a8c9898a583e0c_27_0.png)


    Perhaps the most important features a text editor can provide to a programmer
    are the ability to display the line number of the program for the given cursor
    location, and the ability to move the cursor to a line number. Figure 1.5 illustrates
    an example. Using the text editor vi, the keyboard sequence CTRL-G displays the
    line number. The keyboard sequence :N[CR] relocates the cursor to line number
    N. Using the text editor edit, this feature is provided through menu options.
    Using the text editor emacs, the keyboard sequence [ESC]GN relocates the cursor
    to line number N (assuming a commonly configured installation). Whichever text
    editor is used, it is important to learn these operations. They allow a programmer
    to use line numbers to communicate with a debugger. The programmer can tell the
    debugger to pause program execution at a given line number. The debugger can tell
    the programmer at which line number a given error occurred. In this manner, the
    programmer can work with the debugger to focus on the relevant line.


    As a programmer becomes familiar with a text editor, other useful features will
    be learned. The ability to search and/replace a given string is often helpful
    in debugging variable usage. The ability to cut and paste a word, line, or block
    of code is often useful during code writing. The ability to arrange indentation
    helps support good coding practices. Some text editors support: color coding of
    keywords as well as of code blocks.'
