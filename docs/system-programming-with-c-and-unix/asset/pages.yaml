  md: "# Chapter 8 • Libraries\n\nThis chapter covers libraries from the perspective\
    \ of a system resource. A serious programmer must know how and to use libraries.\
    \ Using a library saves time in programming, because a programmer can make use\
    \ of existing code. Library code tends to be written by experts and thus to have\
    \ good design and performance. Because a library is used by many programmers,\
    \ it is usually debugged by a wide audience, and so a programmer can use it with\
    \ confidence.\n\nBasic knowledge of some of the common libraries is also useful.\
    \ In order to understand how libraries work, and to become comfortable with them,\
    \ this chapter will describe three libraries in some detail. The C standard library\
    \ provides hundreds of functions for common text processing and mathematical operations.\
    \ The curses library provides functions for creating a character-based graphical\
    \ interface. The X library provides functions for a pixel-based graphical interface,\
    \ including windows and mouse interaction. However, the coverage of these libraries\
    \ is not intended to turn the reader into an expert with these particular libraries.\
    \ Rather, they are intended to familiarize the reader with the process of using\
    \ a library. A programmer typically becomes an expert with a specific library\
    \ only through exposure to extensive code or product development that makes use\
    \ of that library. Such familiarity is generally a goal when tackling a specific\
    \ job.\n\n# 8.1 • Using a Library\n\nThere are two basic steps to using a library.\
    \ First, one or more header files must be included in the C program code. Second,\
    \ the library must be linked into the executable. These concepts can be demonstrated\
    \ with the following code example:\n\n```\n#include <stdio.h>\n#include <math.h>\n\
    \nmain()\n{\n    double x,s;\n    s=8.0;\n    x=sqrt(s);\n    printf(\"%lf\\n\"\
    ,x);\n}\n```"
