  md: '# 9.4 • MATLAB


    MATLAB is a software package designed for mathematical work, such as solving geometry,
    trigonometry, linear algebra, and statistics problems. Like a shell, it can be
    used interactively or as an interpreter to run script programs. It includes the
    capabilities of plotting two-dimensional and three-dimensional functions and data
    sets, making it useful for data analysis and visualization. MATLAB is a commercial
    product; the free open GNU Octave program behaves similarly and can be used to
    execute all the examples in this section. A number of other similar tools exist,
    such as Mathematica, LabVIEW, and Maple. The approach taken by some of these tools
    varies; for example, Mathematica is designed with a focus on symbolic mathematical
    operations, while MATLAB is focused on numerical analysis. However, the capabilities
    of all these software packages overlap, and the concepts discussed in this section
    are common to most mathematical software packages.


    Figure 9.1 shows the MATLAB interface displayed when the program is started. It
    consists of three windows: a command window (right-side), a file listing (top-left
    side), and a command history (bottom-left side). MATLAB can also be started without
    a graphical interface as follows:


    ```

    matlab -nodesktop -nojvm -nosplash

    ```


    In this case, only the command window is shown. In either case, the command window
    is the primary window in which MATLAB commands are entered.


    MATLAB can be used interactively, much like a shell. For example:


    ```

    >> format compact

    >> x=7

    x=

    7

    >> y=x*2

    y=

    14

    >> disp ''Hello from MATLAB''

    Hello from MATLAB

    >>

    ```


    The >> symbols are the MATLAB command window prompt. After a command is typed
    at this prompt, the result is computed and displayed immediately. By default,
    MATLAB displays empty lines surrounding most output. The command


    7. See www.matlab.com.'
