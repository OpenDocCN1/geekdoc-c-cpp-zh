  md: 'How does it work? One of the primary jobs of the O/S is to manage memory. A
    malloc() calls the O/S for a chunk of memory of the given size. The chunk of memory
    is obtained from an area of memory called the heap. Compared to the other memory
    areas (e.g., the stack or the data segment), the heap can normally support large
    variables. In general, a program can dynamically acquire much larger chunks of
    memory than can be obtained using static variable declarations. The address of
    that chunk of memory, if available, is returned. The memory map for this code
    may be written as follows:


    | Label | Address | Value |

    |---|---|---|

    | a | 400–403 | 10000 |

    | [DM] | 10000–10039 | |


    Dynamically allocated memory does not have an existing label, so we use [DM] to
    temporarily provide it a name. In order to give it a name that our program can,
    we use either pointer or array syntax based upon the variable a. Either syntax
    can be used to address, or label, different parts of the 40 bytes requested. For
    example, we can write the following code:


