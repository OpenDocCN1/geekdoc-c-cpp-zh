  md: '# Preface


    The goals of this book are to teach the reader about system programming tools
    and resources, and to make the reader a better programmer. Consider the following
    questions: What is a library, and how is it used? What is a debugger, and how
    does it help during program development? What are scripting languages, and for
    what sorts of programming work are they useful? What are system calls, and when
    are they useful? Why would someone ever want to run a program from a shell instead
    of using a graphical user interface? These questions are addressed by the study
    of system programming as outlined in this textbook.


    In addition to the concepts of system programming, this text explores the lower-level
    data types: bits and bytes, bit operations, arrays, strings, structures, and pointers.
    This material is covered with an emphasis on memory and understanding how and
    why these different data types are used. Understanding code at the memory level
    can help clarify even the most difficult programming concepts. It is common for
    a student to be less comfortable with these topics than other basic programming
    concepts, such as loops and conditionals. Coverage of the lower-level data types
    is intended to reinforce an introductory coverage obtained previously. The goal
    is to advance the programming skill of the reader from the intermediate level
    to the advanced level, to the point where these topics are well and comfortably
    used.'
  merge: -1
