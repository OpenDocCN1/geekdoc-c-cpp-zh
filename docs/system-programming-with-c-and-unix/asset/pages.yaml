  md: '# Chapter 1 • Introduction


    The debugger is itself a program, which is executed like any other program. With
    shells and text editors, there are many debuggers. In this book, examples are
    explained using the GNU debugger, which is usually executed as gdb. Although it
    is possible for a debugger to interoperate with more than one compiler, debuggers
    are correlated with specific compilers. In this book, the concepts and examples
    are explained using the GNU C compiler, which is usually executed as gcc.


    To explain how a debugger works, we will use the code example given in Figure
    1.5. Suppose this code is stored in a file called sum.c. In order to compile the
    file, one could execute the following operation:


    ```

    ahoover@video> gcc sum.c

    ahover@video>

    ```


    This produces a file a.out, which is an executable program. Typing a.out runs
    the program:²


    ```

    ahoover@video> a.out

    sum=29

    ahoover@video>

    ```


    The program is executed, running until it ends, at which time the shell prompts
    for another command. In order to use the debugger to run the program, one must
    follow a sequence of operations:


    ```

    ahoover@video> gcc -g sum.c

    ahover@video> gdb a.out

    (gdb) run

    Starting program: /home/ahoover/a.out

    sum=29

    Program exited with code 07.

    (gdb) quit

    ahoover@video>

    ```


    We will discuss each of these steps in detail.


    First, when compiling, we make use of the command line argument -g. This tells
    the compiler that the executable file is intended for debugging. (Other compilers
    use similar flags or options.) While creating the executable file, the compiler
    will store additional information about the program, called a symbol table.


    > ² This assumes the current directory is included in the PATH environment variable;
    otherwise ./a.out must be typed.'
