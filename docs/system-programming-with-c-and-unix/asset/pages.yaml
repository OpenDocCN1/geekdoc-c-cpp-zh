  md: '# 7.3 • Process System Calls 231


    By default, the man program will start in section 1 and look upward. If the section
    number is omitted, the result is the lowest section number that has a page with
    the given name. This can be confusing, to take one example, there is a stat()
    program in section 1 as well as the stat() call in section 2.


    System calls can fail for a variety of reasons. For example, a requested resource
    may be busy or temporarily unavailable, or the application may not have permissions
    to access the requested resource. When a system call fails, it typically returns
    a value of -1. If a programmer wants to find out why the system call failed, then
    the perror() function can be called to display a string associated with the error
    number. This is often helpful during program development and debugging.


    # 7.3 • Process System Calls


    Process system calls deal with the starting up of new programs. Example system
    calls include fork(), exec(), exec(), and wait(). The paradigm behind these functions
    can seem a little strange. In order to start a new program, a currently running
    program makes a clone of itself; the clone then replaces its code with the code
    of the new program. All programs are therefore clone-descendants of the first
    program running on the system after the kernel boots. In order to understand this
    paradigm, this section will first provide some needed background on processes,
    and then look at the system calls in detail.


    # 7.3.1 Processes


    A process is a running program, that is, a program currently in execution. On
    a modern computing system, dozens of processes are often running concurrently.
    Most operating systems have system programs that allow the user to look at the
    current process list. On a Unix system, one can run the ps program:


    ```

    ahoover@video> ps

    PID TTY TIME CMD

    15461 pts/3 00:00:00 tsh

    15794 pts/3 00:00:00 ps

    ahoover@video>

    ```


    Each line in the output lists a process, along with some information about the
    process. The PID is the process identifier, a unique number assigned to each


    +   2. Technically, processes swap in and out of the processor or processor cores
    at a rapid rate, providing the illusion that they are running concurrently.'
