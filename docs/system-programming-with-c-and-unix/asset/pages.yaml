  md: "# 344\n\nThe search-and-replace operation is often performed upon text received\
    \ on the STDIN stream. This allows a Perl programmer to use shortcuts involving\
    \ the default variable name. The following data will be used to demonstrate:\n\
    \nHello Mr. Frog, how are you?\nFine! Thank you Mr. Frog.\nHow are you Mr. Turtle?\n\
    I've seen a lot of frogs today...\nnIs it a holifrog day?\n\nAssume this data\
    \ is stored in a file named data2.txt. The following code takes input from the\
    \ STDIN stream and does the same substitution as in the previous example:\n\n\
    ```\n#!/usr/local/bin/perl\nwhile (<STDIN>)\n{\ns/Frog/Turtle/\n  print;\n}\n\
    ```\n\nNeither the while statement, the search-and-replace statement, nor the\
    \ print statement indicate a variable name, as Perl performs all these operations\
    \ using the default variable name $\\_. This compact notation can seem confusing,\
    \ but one of the goals of Perl program writing is to shorten program code as much\
    \ as possible. If this code is stored in a file named pattern2.pl, then executing\
    \ it on the data2.txt file produces the following output:\n\n```\nahoover<video>\
    \ pattern2.pl < data2.txt\nHello Mr. Turtle, how are you?\nFine! Thank you Mr.\
    \ Turtle.\nHow are you Mr. Turtle?\nI've seen a lot of frogs today...\nIs it a\
    \ holifrog day?\nahoover<video>\n```\n\nBoth occurrences of Frog were replaced\
    \ by Turtle.\n\nMore powerful expressions can be written for both the search and\
    \ replace patterns. For example:\n\n```\n#!/usr/local/bin/perl\nwhile (<STDIN>)\n\
    {\ns/(F|f)rog/ Turtle;\n```"
