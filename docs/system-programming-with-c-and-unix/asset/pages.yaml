    # 5.4.3 Directories


    A directory is an organizational tool for files. It is used to group together
    a set of files. Technically, a directory is a list of filenames and auxiliary
    information for each file. But it can be conceptualized as a one-dimensional array
    of filenames. For example, consider the following file listing:


    ```

    ahoover@video> ls -a

    ./ ../ data.txt fileseek.c ls1 ls1.c

    ahoover@video>

    ```


    The directory for the above file listing can be written as follows:


    | Entry | Filename |

    |---|---|

    | 0 | ./ |

    | 1 | ..// |

    | 2 | data.txt |

    | 3 | fileseek.c |

    | 4 | ls1 |

    | 5 | ls1.c |'
