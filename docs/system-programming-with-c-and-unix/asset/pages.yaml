  md: '# 8.3 • The C Standard Library


    The most important library in C programming is called the C standard library.
    It includes hundreds of functions for doing common operations, such as basic text
    I/O, file I/O, string manipulation, and mathematical calculations. Its functions
    include many of the most well known: printf(), strlen(), fopen(), and sqrt().
    Very few programs are written without making at use some of this library.


    The C standard library is really a collection of libraries that have been grouped
    together. It makes use of multiple header files (24 as of the 1991 ANSI standard)
    and multiple library files (depending on system implementation). Because it-includes
    functions covering a wide variety of topics, and because it is organized into
    multiple files, different parts of it are sometimes referred to isolation. For
    example, it is not uncommon to call the math functions of the C standard library
    as simply the “math library.” Similarly, it is not uncommon to call the string
    functions portion as simply the “string library.” Table 8.1 summarizes the most
    commonly used parts of the C standard library.


