  md: '# Chapter 2 • Bits, Bytes, and Data Types


    In the C language, the float data type uses 4 bytes to store a real number, and
    the double data type uses 8 bytes to store a real number. The double still uses
    1 bit for sign, but it uses 11 bits to store the exponent and 52 bits to store
    the fraction, so that it can represent a wider range of numbers.


    # 2.1.5 ASCII and Unicode Bit Models


    In order to represent nonnumeric data, another bit model must be used. The ASCII
    (American Standard Code for Information Interchange) bit model was developed to
    represent English text symbols, along with control characters necessary to represent
    English text. A partial listing of the ASCII bit model is shown in Table 2.1 (a
    full listing is in Appendix A). There are 128 total ASCII patterns. Each pattern
    uses 7 bits. In order to fill a byte, an eighth bit is added to each pattern.
    Historically, this extra bit been used for several purposes, such as parity (a
    form of error recovery) and extended ASCII sets (providing an 128 bit patterns).
    However, it is also common to leave the bit with a value of zero, in fact padding
    the 7-bit ASCII patterns with a preceding zero. Most of the patterns in ASCII
    represent printable symbols, such as the lowercase versions of letters in the
    English alphabet. The patterns for both the lower- and uppercase letters are stored
    in order, from 97 to 122 and from 65 to 90, respectively. The first 32 bit patterns
