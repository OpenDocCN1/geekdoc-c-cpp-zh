- img_proc: true
  md: '# 2.1 • Bit Models 61


    The bits with the lowest powers of 2 (to the right in the above example) called
    the least significant bits, or lowest-order bits, because they represent the smallest
    portions of the number. The bits with the highest powers of two (to the left in
    the above example) are called the most significant bits, or higher-order bits.
    The significance of bits can be thought of as which digits most change the number.
    It is common practice to list bits from highest to lowest, left to right, following
    the same convention used to write base 10.


    Binary addition using this model is done similarly to base 10 addition. The easiest
    way to compute a sum by hand is to line up vertically the digits with similar
    powers. The digits in each power (column) are added, starting with the lowest
    power (rightmost column) and proceeding towards the highest power (leftmost column).
    If the sum in any single power exceeds the allowed range (9 in base 10, or 1 in
    base 2), then the sum is carried over to the next power. For:


    | Base 10 (decimal) | Base 2 (binary) |

    | --- | --- |

    | 7 | 00000111 |

    | +4 | +00000100 |

    | 11 | 00001011 |


    In this example, there was a carry in base 10 from the one''s digit to the ten''s
    digit. There was also a carry in base 2 from the $2^2$ digit to the $2^3$ digit.


    In general, storing numbers only within the range 0–255 is not terribly useful.
    Some things do use this range, such as graphical pixel values, but obviously a
    wider range is needed for most computations. This is accomplished by grouping
    4 bytes (32 bits) together, the magnitude-only bit model can represent numbers
    value up to


    ```

    $2^i = 2^{32} - 1 = 4,294,967,295$

    ```


    in the range 0–4,294,967,295. This number can be related to a size many personal
    computer enthusiasts are familiar with. At the time of this writing, most common
    personal computers and workstations can have a maximum of 4 GB of memory. Why?
    It is a result of the size of the memory bus, which can be. With 32 wires, a system
    can address 4,294,967,296 (which is about 4 billion, or 4 “giga different memory
    locations. If each memory location is a byte (8 bits), then a “32-bit architecture”
    can have a maximum of 4 GB of memory.'
