  md: '# 8.1 Using a Library 271


    In this example, we are making use of the sqrt() function, which is one of the
    functions in the math library. Assume that this code is stored in a file named
    sq.c. First, the header file math.h is included in order to use the math library.
    Second, when compiling, we must link to the math library:


    ```

    gcc -o sq sq.c -lm

    ```


    The command line argument -lm tells the compiler to link (-1) to a library named
    m. This library file is what actually contains the code for the sqrt() function
    and all the other functions in the math library. In the following two sections,
    we take a look at what is inside a header file and why it is needed, and at a
    library file and how it works.


    # 8.1.1 Header Files


    A header file does not contain the code for any of the functions in the library.
    That code is contained in the library file, which is brought in during linking.
    Why do we need to include the header file? For example:


    ```

    #include <math.h>

    ```


    One can think of a header file as the instructions for how to use the library.
    It contains function prototypes, which describe the inputs and outputs of all
    the functions, including how many and what types of parameters each function takes,
    and what type of value each function returns. For example, in math.h we can trace
    the following code:


    ```

    double sqrt(double x);

    ```


    This prototype tells us that the sqrt() function takes in one argument, double,
    and returns a double. By including the header file into our program, we inform
    the compiler of how the function works so that it can properly compile our use
    of the function. Remember, our program does not include the code for the sqrt()
    function. Therefore the compiler needs the function prototype in order to properly
    align our code, which calls the function.


    A header file can also contain constants. For example, within math.h we can find
    the following code:


    ```

    #define M_PI 3.14159265358979323846 /* pi */

    ```


    +   1. Function prototypes are often written using nested preprocessing substitutions
    for flexibility in implementation and system independence. However, the net effect
    of expanding the preprocessing substitutions is to produce a line of code like
    the one given here.'
