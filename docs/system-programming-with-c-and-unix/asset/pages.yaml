    # 5.4 • Files


    Every computer is familiar with files, but what exactly is a file? A file is a
    one-dimensional array of bytes. Regardless of what sort of data is inside the
    file, it is always stored as a one-dimensional array of bytes. This may seem counterintuitive
    for a file that contains an image, or a movie, or a database. Chapter 3 discussed
    how multidimensional arrays can be stored in one-dimensional memory by writing
    out all the array cells in a long list. The same principle applies to file storage.
    An image, movie, or database can be stored as a one-dimensional array of bytes
    by writing all the elements in a long list. Furthermore, it does not matter what
    sort of data is inside the file. If the file contains text, an image, a song,
    or an executable program, it is still a one-dimensional array of bytes. The difference
    is only in which bit model was used to group and encode the bytes. Therefore,
    when we think of reading from or writing to a file, we can always consider the
    process as being similar to accessing a one-dimensional array of bytes.


    One of the jobs of an operating system is to manage file storage. A system typically
    provides a set of function calls, for use by programs, to interact with files.
    These include the operations already examined, as as the ability to read and write
    data, plus additional operations. We will explore these additional operations
    and related functions as we discuss each associated topic.


