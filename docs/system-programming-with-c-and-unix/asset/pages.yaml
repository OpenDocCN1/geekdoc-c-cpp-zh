  md: '# 6


    # Program Management


    Program management concerns the organization, building, and distribution of programs.
    The organization of a program involves how the code is written, including its
    logical and visual layout. The goals of good organization include code readability
    and modularity. These characteristics support good design practices and make program
    debugging and scaling easier. The building of a program entails how the code is
    compiled. Compiling involves many intermediate steps and file types that enable
    the construction of an executable. The distribution of a program is concerned
    with how the code is packaged and delivered to target systems. There are a number
    of tools and practices designed to facilitate program distribution and installation.


    For the writers of programs, program management can seem like a chore. Management
    and bookkeeping tasks seemingly take time away from the job of actually writing
    programs. However, in the long run, having well-organized code and understanding
    the compilation and distribution processes making program much simpler and more
    efficient. With practice, good management techniques become incorporated into
    all programming work. The goal of this chapter is to familiarize the reader with
    the tools and practices common to program organization, building, and distribution.
    The reader may be familiar with many of the individual concepts discussed in this
    chapter; however, putting them all together under the context of program management
    should provide new insight into how and when all these concepts and tools should
    be used.'
