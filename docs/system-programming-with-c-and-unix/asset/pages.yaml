    sock_recv=accept(sock, (struct sockaddr *) &recv_addr,

    &addr_size);

    ```


    The accept() function returns a second socket (in this example, sock_recv) on
    which data will be transmitted. This allows the original socket (in this example,
    sock) to continue to listen for additional connections.


