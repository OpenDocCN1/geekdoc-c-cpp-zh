  md: '# 6.1.4 Other Build Tools


    Moving the source code for a program from one system to another, the second system
    may have different compilers or system programs needed for the build process.
    Because of this, the makefile for the program may need to be modified. Tools have
    been developed to parse system files and automatically generate a makefile using
    the available compilers and system programs. One of the first examples of such
    a tool is make, although this program is no longer actively under development.
    Current tools with similar goals include Autotake, managed by the GNU Project,
    and CMake, which has been used for several large open source projects.


    Integrated development environments (IDEs) commonly use a graphical interface
    to manage the build process. Dependencies, commands, and command line options
    are normally configured through an interface custom to the particular IDE. However,
    underneath that interface, an IDE will typically create a makefile that can be
    manually edited by the programmer. It is not uncommon for an advanced programmer
    to go underneath the IDE''s graphical configuration to fine-tune the control of
    the build process.


    # 6.2 Code Organization


    Organizing code is not easy. Programmers probably spend much time organizing code
    as they actually do writing new code. Making code modular, readable, and understandable
    helps a programmer in several ways. First, these practices assist with design.
    Writing well-organized code generally leads to a cleaner program design, which
    in turn generally leads to fewer flaws and bugs. Second, these practices assist
    with debugging. It is much easier to find errors in well-organized code, particularly
    if a bug is uncovered long after the code was written and the author has forgotten
    much of the design. Third, these practices promote code reuse and future extension.
    Programmers sometimes curse having to write comments and spend time doing bookkeeping
    chores, yet praise the fruits of those efforts when they revisit previously written
    code. There are several methods and tools that assist code organization. Although
    this section examines them from the perspective of the C programming language,
    the same concepts can be found in almost all programming languages.


