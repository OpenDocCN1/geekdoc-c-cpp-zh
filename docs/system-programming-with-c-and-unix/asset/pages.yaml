    # 2.1.6 Bit Model Summary


    To summarize, what is 1100 0010 1110 1101 0100 0000 0000 0000 ?


    The answer is that it depends on how the bits are grouped and interpreted. In
    other words, it depends upon the bit model. Here are some possible answers:


    | C variable(s) | Bit model | Value(s) or symbol(s) |

    |---|---|---|---|---||

    | 4 unsigned char | magnitude-only | 194 237 64 0 |

    | 4 char | two''s complement | -62 9 64 0 |

    | 4 char | ASCII | [x] [x] @ [NULL] |

    | 1 int | two''s complement | -1,024,638,976 |

    | 1 unsigned int | magnitude-only | 3,270,328,320 |

    | 1 float | floating point | -118.625 |


    The bits can be grouped together 8 at a time (1 byte at a time), or 32 at a time,
    or other possibilities not listed here. After grouping, different bit models can
    be applied to determine the value(s) or symbol(s) represented.


    The important concept is to understand that bits alone not provide data. They
    must be grouped and interpreted according to the appropriate bit model; otherwise
    they are meaningless. A common pitfall for naive computer operators is to open
    any file within a text editor. However, not all bits relate to printable symbols.
    Looking at the example, 2 of the 4 bytes do not represent any regular ASCII symbols;
