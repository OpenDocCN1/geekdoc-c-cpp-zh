  md: '# Arrays and Strings


    Beyond the four basic data types (char, int, float, double), the C language supports
    some advanced data constructs. These include arrays, strings, pointers and structures.
    Like the basic data types, each of these advanced data constructs is intended
    to store something different:


    | Data construct | Intended to store: |

    | --- | --- |

    | array | list of same-type values |

    | string | text |

    | pointer | address of another variable |

    | structure | group of mixed-type values |


    An array is intended to group together a list of values, all of the same type,
    under one variable name. It is much easier to code computations on an array than
    on a list of independently named variables:


    ```

    for (i=0; i<100; i++)    /* array coding */

    sum=sum+qty[i];


    sum=qty1+qty2+qty3+...+    /* without an array */

    ```


    A structure is intended to group together an assortment of values of different
    types under a single variable name. Like an array, it makes it easier to code
    computations. A string is intended to group together a series of character symbols'
