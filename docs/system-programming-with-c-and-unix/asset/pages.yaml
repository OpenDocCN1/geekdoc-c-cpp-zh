  md: '# 4.2 Using Pointers


    which is the end of the program. Dynamic memory allocation is different. Because
    the allocation can be made at any point in a program, the program must also be
    responsible for releasing the memory and returning it to the O/S. This is done
    by calling the free() function:


    ```

    free(a);

    ```


    Failure to call the free() function appropriately may result in a program losing
    track of the items. Sometimes this is referred to as a memory leak. For example,
    consider the following code:


    ```

    double *a;

    a=(double*)malloc(70);

    a=(double*)malloc(300); /* memory leak */

    ```


    The program requests 70 bytes from the O/S, and then 300 bytes, each time storing
    the address of the bytes in a. The second request overwrites the address of the
    first request. They are still reserved by the program, but the program has lost
    any record of the address where they reside! This is a common programming mistake
    and can lead to a program crashing.


    There are several variants of the malloc() function that requests bytes in slightly
    different ways. A common variant is calloc(), which in addition to requesting
    the bytes also initializes the value of every byte to zero. For example:


    ```

    double *a;

    a=(double*)calloc(70,sizeof(double));

    ```


    The calloc() function takes two arguments; the first is the number of cells of
    memory, and the second is the size of each cell. The sizeof() operator is a convenient
    tool for denoting the number of bytes in a data type. It is evaluated by the compiler
    at compile time to find the size of a variable or variable type. It is often used
    with structures and complex data type combinations, which we will see more of
    in the next section. For this example, sizeof() returns 8, which is the size of
    a double, so the total number of bytes requested is 560.


