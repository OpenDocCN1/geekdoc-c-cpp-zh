    Many scripting languages are purely interpretive, meaning that they analyze statements
    one at a time as they are reached in the script file. If the statement is valid
    for the language, then it is executed, and interpretation proceeds to the next
    line. However, some scripting languages perform a type of compilation, converting
    the entire script file to an intermediate form before beginning execution. The
    Perl works in this way. If any statement in a Perl script is invalid, then the
    interpreter will report the error before beginning execution. Both of these forms
    of execution can be contrasted with C program compilation, where the source code
    is compiled to machine code and saved in a separate file for execution. An advantage
    of scripting languages is that the compilation step is skipped, the distribution
    and use of a script program simpler. A disadvantage is that script programs run
    more slowly than machine code because of the interpretation. In any case, the
    rest of this chapter will refer to scripts as programs, and all example script
