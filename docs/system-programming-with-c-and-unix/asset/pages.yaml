  md: 'and database interactions. MATLAB¹ is most commonly used for batch processing
    of tabular data and for generating large numbers of plots. The goal is not to
    make the reader expert with these three languages. The goal is to make the reader
    familiar with the sorts of tasks for which scripting languages are a useful tool.
    Scripting languages are so diversified and varied, with new ones appearing every
    few years, that it is virtually impossible to become fluent in all of them. But
    they share many common design goals and features. By exploring these three scripting
    languages, the reader will be prepared to become fluent in any scripting language.


    # 9.1 • Using Scripting Languages


    Scripting languages use interpreter programs to execute script code. For many
    scripting languages, the interpreter program can be run interactively. For example:


    ```

    ahoover@video> python

    Python 1.5.2 (#1, Jul 5 2001, 03:02:19)

    >>> x=7

    >>> print x

    7

    >>> print "Hello from python"

    Hello from python

    >>>

    >>> [CTRL-D]

    ahoover@video>

    ```


    This demonstrates the use of the Python scripting language. After the Python script
    interpreter is started, it displays >>> as its prompt. Python statements can be
    entered at this prompt, and the results will be displayed interact. The key sequence
    CTRL-D exits the Python interpreter.


    Shells work similarly; most of the examples throughout this book have already
    shown interactive usage of a shell. A shell can also be used to start another
    shell. For example:


    ```

    ahoover@video> sh

    sh-2.05$ ls

    hello.py hello.sh

    ```


    ¹ GNU Octave, a free open source program similar to MATLAB and capable of running
    the same examples in this chapter, is available at www.octave.org.'
