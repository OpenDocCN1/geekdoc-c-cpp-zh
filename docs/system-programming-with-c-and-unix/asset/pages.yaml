  md: '# Introduction


    # 1.1 What is System Programming?


    Computer systems are made up of hardware and software. Software generally refers
    to the programs running on the computer. While both hardware and software can
    be modified or upgraded, it tends to happen more often with software. In fact,
    the major reason to have software is to provide the ability to change the instruction
    stream executed on the computer. This means that it is often expected that new
    programs will be written, or old programs will be modified or evolved, during
    the life cycle of a computer system.


    Given this expectation, it is natural to look for methods to allow the computer
    system to support program development. A number of tools and resources have evolved
    over the last 30 years to assist program development. These include standard libraries
    (also called system libraries), system calls, debuggers, the shell environment,
    system programs, and scripting languages. Knowledge of these tools greatly enhances
    the ability of a programmer. While it is important to learn the details of some
    specific tools, it is more important to understand when'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1 • Introduction


    and how to use a tool. A number of good reference manuals can provide detailed
    information on a specific language or tool. This book is intended to provide a
    broader understanding of the concepts in system programming.


    We define system programming as the use of system tools during program development.
    Proper use of these tools serves several purposes. First and foremost, it saves
    a great deal of time and effort. Using system libraries saves a programmer the
    time it would take to independently develop the functions. Using a debugger saves
    an enormous amount of time in finding and fixing errors in a program. Common tasks,
    such as searching for text within a set of files or timing the execution of a
    program, are facilitated by the existence of system programs.


    Second, system tools provide opportunities for program development that are otherwise
    extremely difficult to come by. System calls provide access to the core functions
    of the operating system, including memory management, file access, process management,
    and interprocess communication. Standard libraries implement complex functions
    that are beyond the capability of most programmers. For example, the math library
    includes trigonometric functions and other real-valued operations that require
    iterative methods to reach a solution.


    Third, consent of system tools promotes standards, so that code developed for
    one computer system is more easily ported to another computer system. System libraries
    provide a layer of abstraction, implementing the same function calls on multiple
    computing systems. An application can call a system library without worrying about
    the details of the underlying hardware. In manner, the application can be ported
    as long as the destination system possesses the same system libraries. For graphics,
    this has become increasingly important as the number and variety of hardware display
    capabilities has expanded.


    Knowledge of the basic system file structure assists in program management. A
    Unix system typically includes well over 10,000 files related to system operation
    (this does not include user data files). Over time, a standard method for organizing
    these files has evolved. There are common places for libraries, system programs,
    device files (connections to hardware), applications, and user data.


    Finally, there is the shell environment. The shell environment is rich with options,
    capabilities, and configurability, to the point that it is overwhelming to novice
    programmers. However, once some proficiency has been gained, the shell is a powerful
    tool for any serious system programmer. It offers tremendous flexibility in process
    control, system management, and program development.'
  merge: -1
  pgno: 17
