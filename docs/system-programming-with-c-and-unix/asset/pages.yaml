    | C code | Bits in variable a | Base 10 value |

    |---|---|---|

    | a=17; | 00010001 | 17 |

    | a=~a; | 11101110 | 238 |


    The bitwise AND operator performs an AND between two variables, independently
    at every bit. It is written using the ampersand symbol (&). For example:'
