    \ expand to a rectilinear size capable of holding the new value. Assigning a value\
    \ of [] (empty square brackets) to an index causes its deletion, with the other\
    \ values collapsing to fill the void. There are several other mechanisms that\
    \ can be used to adjust a range of values, to move a range of values, or to transpose\
