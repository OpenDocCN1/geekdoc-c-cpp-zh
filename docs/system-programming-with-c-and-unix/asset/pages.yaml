- img_proc: true
  md: '# Chapter 2 • Bits, Bytes, and Data Types


    A bit, short for binary digit, is a binary variable. The two possible values are
    typically written as 1 and 0, or true and false. On a computing chip (processor,
    memory chip, etc.), they are represented by high and low voltages, where a high
    value is typically 1–5 V and a low value is 0–0.5 V. Everything in computing is
    based upon combinations of bits. Everything stored in a computing chip is based
    upon using a fixed number of bits to model (or represent) the thing of interest.


    For our discussion, bits can be either 1 or 0. Since a single bit can represent
    only two values, we must group bits together to represent a wider range of numbers.
    The most common grouping is a byte, which is 8 bits grouped in sequence. For example,
    the following is a byte:


    ![](img/4c54f2714bbf728ff6a8c9898a583e0c_61_0.png)


    When bits are grouped, there are a variety of methods for interpreting them collectively.
    Each method of interpretation is called a bit model. We will now examine several
    bit models for representing various types and ranges of numbers.


    # 2.1.1 Magnitude-only Bit Model


    The simplest bit model is for nonnegative whole numbers. In this case, each bit
    represents a nonnegative integer power of 2. The place values of the bits are
    as follows:


    | example bit value | 0 | 0 | 0 | 1 | 0 | 0 | 1 | 1 |

    |---|---|---|---|---|---|---|---||

    | place value (base 10) | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$
    | $2^0$ |

    | | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    A bit value of 0 indicates a place value of 0; a bit value of 1 indicates a place
    value as given in the table. The total value of the number is represented by adding
    up the place values of all the bits. In this example, the value represented in
    the 8 bits (1 byte) is 19:


    ```

    $0 + 0 + 0 + 16 + 0 + 0 + 2 + 1 = 19$

    ```


    Given 8 bits, it is possible to store whole numbers in value up to


    ```

    $\sum_{i=0}^{7} 2^i = 2^8 - 1 = 255$

    ```


    or in the range 0 to 255.'
