    # 4.2.3 Dynamic Memory Allocation


    Variables are normally given space through static memory allocation. This means
    the size (in bytes) of each of the variables is known before the program runs.
    Upon starting execution of the program, the operating system (O/S) finds a place
    in memory for all the global variables (in an area called the data segment). As
    each function is entered, including main(), space for its-variables and parameter
    values are found (in an area called the stack). Without going into the details
    of the implementation of these memory areas, it is important to note that the
    entire time that the program is running, the size of a statically allocated variable
    does not change.


    Sometimes a program does not know how memory it needs prior to execution. For
    example, in reading a line of text from a file, the program might not know how
    big a string is needed to store all the words before the particular file has been
    selected, and read. In this case, a programmer might decide to declare a string
    of sufficient size to store any possible line of text. This is wasteful and perhaps,
    in some cases, impossible. The maximum size of something to be read might not
    be known beforehand. The alternative is to use dynamic memory allocation.


    Dynamic memory allocation uses a pointer variable to request memory from the O/S
    while the program is running. The basic function call for dynamic memory allocation
    is malloc(), and works as follows:


    ```

    #include <stdlib.h> /* header file for malloc() */

    double *a; /* pointer variable */

    a = (double *) malloc (40);

    /* ... ... */

    /* typecast request how many bytes? */

    /* to O/S */

    ```


    The typecast identifies the type of pointer arithmetic expected for the address
    returned from malloc() (see Section 4.2.2 on pointer arithmetic). The malloc()
    function call is the request to the O/S for memory. It takes one parameter, which
    is the number of bytes needed. In this example, we request 40 bytes, which is
    5 doubles (8 bytes per double).'
