  md: '# 6.3 Program Distribution Methods 217


    Command line options can be used to extract files, add more files to the archive
    file, and perform a variety of other operations. Full details can be found within
    the man page for tar.


    The tar program does not provide compression. Instead, it relies upon the gzip
    compression tool for postarchiving compression and decompression. For example:


    ```

    ```

    ahoover@video> ls -l

    --rw-r-- 1 ahoover fusion 10240 Oct 15 2008 dist.tar

    --rw-r-- 1 ahoover fusion 221 Oct 15 2008 main.c

    --rw-r-- 1 ahoover fusion 125 Oct 15 2008 Makefile

    --rw-r-- 1 ahoover fusion 171 Oct 15 2008 sqrt.c

    ahoover@video> gzip dist.tar

    ahoover@video> ls -l dist.tar.gz

    --rw-r-- 1 ahoover fusion 485 Oct 15 2008 dist.tar.gz

    ahoover@video>

    ```

    ```


    Note that the archive file was originally larger than the sum of the contents
    of the individual files inside it. This is because of the metadata information
    described above.


    Example archive tools include PKZIP, WinZip, WinRAR, which all include built-in
    compression. They are proprietary but have achieved a notable level of popularity.
    The .zip archive file format, whose specification is public domain, is inherently
    supported by the MS Windows Explorer tool.


    #  6.3.2 Packages


    A package management system is a more advanced program distribution tool. A package
    file is similar to an archive file, but it contains additional information. It
    may describe how to compile or execute files extracted from the package file.
    It may describe how to install or organize files on a target system, where the
    exact destination of each file depends upon how the target system is configured.
    For example, if a target system contains an older version of a library file, but
    the older library file is needed by an already installed program, then the package
    installer may rename the extracted version of the library file so to maintain
    versions for both programs. Typically, the dependency information for all programs
    installed by a package manager is kept in a local file on the target system. This
    file also typically contains history metadata about all the programs installed
    and their interdependencies.


    +   - Free versions of tar and gzip are available from the GNU Project at www.gnu.org.'
