  md: '# 1.2 • The Three Tools 23


    ![](img/4c54f2714bbf728ff6a8c9898a583e0c_24_0.png)


    **Figure 1.3** Command line arguments change the way a program is run.


    that can be used when starting the program. For this particular program, most
    of these arguments change the way the clock is displayed. For example, xclock
    -digital -bg grey causes the program to run as displayed in Figure 1.3.


    The control and flexibility offered by command line arguments is often useful
    during program development and system administration. While many programs can
    be reconfigured while running, selecting options through menu interfaces can take
    time. Configuring the program through command line arguments can save a great
