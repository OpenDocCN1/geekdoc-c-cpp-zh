  md: 'process. The TTY is the terminal in which the program was run. The TIME is
    the cumulative execution time, or how long the program has been running. The CMD
    is the command, including command line options, that was used to start the program.


    The previous example showed only two processes because default ps will show only
    processes started in the current terminal. It can also be run with appropriate
    flags to show all processes currently running on the system:


    ```

    ahoover@video> ps -ef

    UID PID PPID TTY TIME CMD

    root 1 0 ? 00:00:09 init [5]

    root 2 1 ? 00:00:00 [keventd]

    root 3 1 ? 00:00:09 [ksftirqd_CPU0]

    root 4 1 ? 00:00:00 [kswapd]

    root 5 1 ? 00:00:00 [bdfflush]

    [...]

    liy 14276 14273 pts/1 00:00:00 -tcsh

    liy 14297 14276 pts/1 00:00:00 pine

    [...]

    root 15460 875 ? 00:00:00 /usr/sbin/sshd

    ahoover 15461 15460 pts/3 00:00:00 -tcsh

    ahoover 16824 15461 pts/3 00:00:00 ps -ef

    ahoover@video>

    ```


    The full listing (-e flag) is abbreviated by [...] for the sake of space. The
    extra columns (-f flag) provide additional information about each process. The
    UID is the user identifier of the user who started the process. In this listing,
    one can see that two users (ahoover and liy) are currently running programs on
    their system, as well as processes started by the root user when the machine booted.
    PPID is the PID, which shows which process was cloned to start each new process.
    The init process is the first program run by the kernel after it has finished
    initializing, so it has a PPID of 0 and a PID of 1. It then starts a lot of root
    processes, which in turn can start others, and so on. At the bottom of the listing,
    one can see that the shell process tcsh is the parent of the ps program executed
    to generate that list. The system program top shows some of the same information,
    but sorts it by resources used and continuously updates it. On an MS Windows system,
    a similar process table can be seen by pressing CTRL-ALT-DEL and then selecting
    the task manager.


    Within a shell, there are several commands that can be used to alter how a program
    is running. Table 7.1 lists the commands that affect how the process'
