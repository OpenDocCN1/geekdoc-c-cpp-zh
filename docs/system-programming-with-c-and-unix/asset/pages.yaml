    érations to fit functions to data sets, and to interpolate values in various manners.
    Symbolic expressions can be evaluated, for example, working analytically (as-posed
    to numerically) with mathematical functions. There are also a number of packages
    that can be added to basic MATLAB, providing additional functions and features.
    One of the more popular packages provides mechanisms for image processing. All
    of these features simplify working with mathematical or tabular data. If a task
    involves writing programs for this kind of work, writing MATLAB scripts generally
    takes much less time than writing the same programs using the C language.


    # 9.5 • Discussion


    Computing professionals are known for developing strong opinions on preferences
    for tools of the trade, such as operating systems, text editors, and code development
    environments. Scripting languages are no different. To some programmers, a particular
    scripting language is good for all programming work. This is of course a fallacy.
    This can be explained partly by the amount of experience a particular person may
    have with a specific language. As more and more shortcuts are learned within a
    scripting language, a programmer gains proficiency and realizes increased time
    savings. In reality though, overuse of a particular programming language usually
    comes from the opposite: inperience with'
