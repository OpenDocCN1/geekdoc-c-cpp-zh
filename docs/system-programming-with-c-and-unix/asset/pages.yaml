    \ and an ending condition. The while loop is intended to be executed an unknown\
    \ number of iterations. Hence, it is only given an ending condition. The do-while\
    \ loop is also intended to be executed an unknown number of iterations but will\
    \ be executed at least once. The while loop may be executed zero times if it fails\
    \ the condition on the first attempt. The do-while loop does not test the condition\
