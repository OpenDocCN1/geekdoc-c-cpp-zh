  md: '# Libraries


    A library is a set of functions, packaged as a system resource and intended for
    use by other programs on the system. Normally, a library is not written for a
    single program but is intended for use by many programs. By packaging the functions
    as a system resource, the code does not need to be rewritten for every program
    that it uses. Although a library may include any number of functions, it does
    not include one important function: main(). A library is not an executable program.
    A library consists of functions that can be combined with a main() to form a complete
    executable program.


    On a typical computing system, there are many libraries. A single library tends
    to contain functions concerning a single topic, such as mathematical calculation,
    memory debugging, network operations, or graphics. Some libraries are small, containing
    10 or so functions, while other libraries may contain a thousand functions. Some
    libraries are considered standard, having become common to a large number of computing
    systems. Examples include the C standard library and the X library. Some libraries
    are developed by individuals or companies to support their specific product line
    and are found only on computing systems to those products.


    When using a library, a program may not use every function inside it. A program
    may call only a single function within that library, or it may use them all, or
    any number in between. A program may use multiple libraries. A library may be
    built on top of another library, calling upon its functions. In the latter case,
    a program using the top-level library must also make use of the lower-level library.
    Graphics libraries, in particular, have developed this way.'
