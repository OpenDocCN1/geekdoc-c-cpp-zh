    # 6.2.7 Discussion


    In summary, there are many tools that help a programmer organize code. When used
    properly, or when not well understood, they can be a great pain. It can be frustrating
    trying to read code that is riddled with typedefs when the code is absolutely
    never going to be ported to any other system. It can be painful trying to read
    code that is broken into multiple functions when the entire program is less than
    20 lines. Files containing a single function are usually superfluous. Multiple
    levels of preprocessing substitutions can be arduous to work with and are unnecessary
    when they do not provide any real flexibility. These tools do not exist to demonstrate
    the merit of the programmer; they exist to help organize code. They should be
    used, but they should be used with care and respect for the original goals of
    organizing code.


    A related discussion concerns abstraction. Abstraction refers to the level of
    detail required by a programmer to implement an idea in code. The more abstract
    a language construct, the less the programmer needs to understand how the machine
    actually implements it. In turn, the more concrete a language construct, the more
    programmer needs to understand how the machine implements the idea. The C language
    is not very abstract. Some of the tools developed to help organize code also attempt
    to abstract out the details. While this is a laudable goal, it should be used
    with prudence. Abstraction does not necessarily make a program better organized.
    Sometimes it is better to leave the details clearly visible so that the program
    can be better managed.


    # 6.3 Program Distribution Methods


    Once a program has been written, it is convenient to package the code in a manner
    that facilitates its distribution to other computers and systems. If the target
    distribution is systems that are exactly the same as the one on which the program
    is written, the executable can be distributed. If the target computers run different
    operating systems or have different hardware, then the source code must be compiled
    for all the desired platforms prior to distribution, or the source itself needs
    to be distributed so that it can be compiled on the target systems. This section
    discusses some common methods and tools for packaging and distributing programs.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 6.3.1 Archives


    The most basic tool for program distribution is an archive. An archiving tool
    groups together a set of files into a single file called an archive file. An archive
    file contains the contents of all the individual files plus some metadata. The
    metadata usually details the sizes of the files, the last modified dates and times
    of the files, each file''s path or subdirectory, and possibly additional information.
    An archive file also typically contains some parity or error checking content
    so that the validity of the files after packaging can be verified.


    Most archive tools also include a lossless compression capability. As a file is
    added to the archive, it is compressed, so that the archive file takes up much
    less space than that of the original files. This is convenient for long-term storage
    as well as program distribution. Some archive tools rely on external or postarchive
    compression, and therefore the entire archive is compressed or decompressed in
    one step. This generally results in smaller archive files as the compression can
    search for redundancy across all individual files within the archive. However,
    it also tends to be slower to use because individual modifications or accesses
    to the archive must decompress and recompress the entire archive.


    Example archive tools commonly found on a Unix system include ar and tar. The
    ar program is commonly used for library files, placing multiple object code files
    into a single library file. The tar program is used more generically for almost
    any type of file. For example:


    ```

    ahoover@video> ls

    main.c Makefile tar cf dist.tar *

    ahoover@video> ls

    dist.tar main.c Makefile sqrt.c

    ahoover@video>

    ```


    In this example, tar was used to create an archive file named dist.tar containing
    all files in the current directory. The contents of the archive file can be listed
    as follows:


    ```

    ahoover@video> tar tf dist.tar

    main.c

    Makefile

    sqrt.c

    ahoover@video>

    ```'
