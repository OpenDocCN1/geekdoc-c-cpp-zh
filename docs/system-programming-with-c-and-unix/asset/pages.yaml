    # 9.2 • Shell Scripting


    While shells are most commonly used interactively, they can also be used as programming
    environments. Shell scripting refers to the running of a script, as a program,
    on a shell. Certain aspects of system administration can be accomplished more
    quickly using shell scripts. For example, account management, such as the making
    and deletion of accounts as well as the monitoring of account usage, can be simplified.
    Other popular uses for shells include the configuration of applications during
    installation, and operations involving the management of large numbers of files.


    There are many different shells, and each has its own scripting language. The
    three most popular shells are sh, csh, and ksh. In chronological order of development,
    sh is the oldest, and historically it was the default shell for the root user.
    The second oldest is csh, the syntax of which most closely resembles the C programming
    language. The ksh is the newest of the three and the most rich in terms of the
    number of programming features it supports. In addition to these three, there
    are derivative shells that have achieved notable popularity, such as tsh (a derivative
    of csh) and bash (a derivative of sh). At the time of this writing, the default
    shell on most Unix systems is bash, with sh commonly linked to bash.'
