    apple and potato are healthy foods

    ahover@video>

    ```


    The read statement takes all characters typed until the [ENTER] key is pressed
    and stores them into the given variable. For example:


    ```

    ahoover@video> foods.sh

    Name a fruit?

    apple pie

    Vegetable?

    ```


