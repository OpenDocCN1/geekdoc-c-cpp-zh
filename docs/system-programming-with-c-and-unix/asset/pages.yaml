  md: '# 2

    Bits, Bytes, and Data Types


    theory, a variable is an abstract concept. It is a placeholder for a value used
    in some computation. In implementation, a variable occupies a fixed storage. It
    is important to understand how variables differ in storage because this affects
    how different variables can be used in different computations. It promotes efficiency
    in programming by utilizing the correct data types, and hence the correct amount
    of memory (using 64-bit variables to store whole numbers between 1 and 100 is
    a waste of space). It promotes correct coding of arithmetic operations (coding
    floating point computations on whole numbers is a waste of time). It leads to
    a better understanding of bitwise operations, which are critical for many computing
    algorithms, such as in graphics. Finally, a proper understanding of memory helps
    in program design and debugging, especially when more complex data types are used,
    such as arrays and pointers. This chapter, and the following chapters, all develop
    an understanding of C data types based upon understanding of the actual memory
    they occupy.


    # 2.1 • Bit Models


    In C, what is the difference between an int and a float? The simple answer is
    that one stores whole numbers, whereas the other stores real numbers. But how?
    Or, how about some tougher questions? How does a double store higher-precision
    numbers compared to a float? Does it double the numerical range of possible values,
    or the precision, something else? How do the qualifiers short or unsigned change
    the way a value is stored? In order to answer these questions, we have to understand
    the bit models that underlie the data types.'
