  md: "# Chapter 1 • Introduction\n\nsubproblems may themselves be broken up repeatedly\
    \ into subproblems until reasonable amount of programming work can be undertaken\
    \ in isolation. Almost all programming work benefits from following some variation\
    \ of this approach.\n\nIn order to demonstrate, consider the following problem.\
    \ Write a program that takes an integer as input and then determines whether or\
    \ not the given number is a sum of two unique squares. For example, given the\
    \ number 13, the program would find that 13 = 9 + 4 is a sum of unique squares.\
    \ Similarly, given 17, the program would find 16 + 1; given 90, the program would\
    \ find 81 + 9.\n\nHow should this problem be approached? One possibility is to\
    \ loop through all integers from 1 to X, where X is the largest integer square\
    \ is less than the given number. Call this first integer i. For each of these\
    \ numbers, a second loop could test all integers from 1 to i. Call this second\
    \ integer j. Testing all possible pairs of i and j would find any sum of unique\
    \ squares equals to the given number.\n\nWith a basic approach in mind, attention\
    \ can be turned to writing code. Considering the above outline, the work can be\
    \ broken into two parts. The first part is to prompt the user for a number, and\
    \ loop through all possible integers whose square is less than the given number.\
    \ For example:\n\n```\n#include <stdio.h>\n\nmain()\n{\n    int i,number;\n\n\
    \    printf(\"Enter a number: \");\n    scanf(\"%d\",&number);\n    i=1;\n   \
    \ while (i*i < number) {\n        i++;\n        printf(\"%d is the largest square\
    \ within %d\\n\",i,i,number);\n    }\n}\n```\n\nThis code does not solve the whole\
    \ problem; it tries only to identify the boundary on the range of the first loop.\
    \ The output statement at the end will be used to debug this portion of the program.\
    \ If this code is stored in a file named squaresi.c, then compiling and executing\
    \ it produces results like the following:\n\n```\nahoover@video> gcc -o squaresi.c\n\
    ahoover@video> squaresi\nEnter a number: 5\n9 is the largest square within\n```"
