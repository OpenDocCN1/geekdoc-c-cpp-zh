    # 6.1.3 Makefiles


    For a program that is built from a single source code file, a single execution
    of a compiler is usually all that is necessary. A programmer will typically manually
    type the compile command each time the program needs to be rebuilt, for a program
    that is built from a large number of files, a number of compile commands may need
    to be performed. Some of these commands involve multiple filenames and command
    line options. A Makefile is a tool that allows a programmer to organize the compile
    commands and intermediate files and to execute rebuilds with less manual typing.


    A Makefile is a text file placed in the current working directory, usually the
    directory holding the source code to be compiled. By convention, the file is usually
    started with an uppercase "M" (Makefile) so that in a file listing it stands out
    from the source code and object code files. However, the file can also be started
    with a lowercase "m" (makefile).


    A Makefile has two main parts: dependencies and commands. The format of a dependency/command
    block is as follows:


    ```

    file : dependency

    [TAB] command

    [TAB] command

    :

    ```


    A dependency describes a relationship between files, where if the file on the
    rightthand side of the dependency is changed, then the file on the left-hand side
    needs rebuilding. The files on the left-hand side are usually referred to as targets,
    while the files on the right-hand side are referred to as sources. The command(s)
    to perform the rebuilding are listed after the dependency. Each command line must
    be started with a tab character, to differentiate command lines from dependency
    lines.'
