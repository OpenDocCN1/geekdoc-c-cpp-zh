  md: '# 5.1.3 Standard Streams


    Most programs get user input from a keyboard and display output to a screen. It
    is somewhat monotonous to write code to create these streams for every program.
    Therefore, every time a program¹ is started, the O/S automatically creates streams.
    The first stream is called the "standard in" stream and abbreviated stdin. It
    connects the keyboard to the program. The second stream is called the "standard
    out" stream and abbreviated stdout. It connects the program to the display. The
    third stream is called the "standard error" stream and abbreviated stderr. It
    connects the program to a secondary display that is intended only for the display
    of errors.


    The standard streams are most commonly used by calling the scanf() and printf()
    functions. The scanf() function is actually a specialized version of the more
    generic fscanf() function. While the fscanf() can receive bytes from any stream,
    the scanf() is "hardwired" to the stdin stream. In the following example, the
    scanf() and fscanf() function perform the exact same operation:


    ```

    char s[80];

    canf("%s","s");

    scanf(stdin,"%s");

    ```


    The same is true with regards to printf() and fprintf(). While the fprintf() function
    can send bytes along any stream, the printf() function is hardwired to the stdout
    stream. In the following example, the printf() and fprintf() function perform
    the exact same operation:


    ```

    int x=42;

    printf("%d is a nice number\n",x);

    fprintf(stdout,"%d is a nice number\n",x);

    ```


    The definitions for the standard streams can be found in the file stdio.h (most
    found in /usr/include). Searching that file will uncover code similar to the following:


    ```

    /* Standard streams. */

    extern FILE *stdin; /* Standard input stream. */

    extern FILE *stdout; /* Standard output stream. */

    extern FILE *stderr; /* Standard error output stream. */

    ```


    In this context, we are discussing terminal-based programs. On some systems, GUI-based
    programs do not automatically get connected to the three standard streams.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'The stderr stream is intended as a backup output stream for programs. It is
    commonly used to report errors or warnings. It is often connected to the same
    terminal display as the stdout stream but can be connected to a different display.
    For example, if a program is left running in the background, the program may be
    disconnected from its stdout stream but still has its stderr stream connected
    to a main terminal display.


    # 5.2 Buffers


    A buffer is a temporary storage between the sender and receiver of bytes on a
    stream. When a stream is created, one can think of it as having an address from
    which bytes are sent and an address at which bytes are received. Each address
    is at a memory location controlled by the operating system. The buffer is an additional
    piece of memory that is used to moderate the flow of bytes from the source to
    the destination.


    A buffer is useful in a variety of situations. For example, if the sender puts
    bytes into the buffer faster than the receiver can handle? Or if a program is
    in the middle of a calculation and is not prepared to receive any bytes? The buffer
    can store up bytes until the program is able to handle them, receiving them at
    the reduced rate or when it is ready for them.


    There are three basic types of buffering: block buffering, line buffering, and
    unbuffered. They differ in how the temporary storage is flushed. Flushing is the
    act of emptying the temporary storage, sending all the bytes in down the stream
    to the receiver. Each type of buffering differs as to how it flushes. In a block
    buffer, a fixed-size chunk of memory is filled before being passed to the receiver.
    A block can be any size, although byte sizes are powers of 2 typical (e.g., 1
    KB, 16 KB, etc.). In a line buffer, bytes inside the buffer are sent to the receiver
    once a newline character (byte value of 13) is received. The newline character
    is also sent to the receiver. Finally, if the stream is unbuffered, each byte
    is sent to the receiver as soon as it is placed in the buffer. The buffer operates
    as it is transparent.


    Block buffering is commonly used for large data transfers, such as I/O. It makes
    the transfer more efficient by saving a large number of bytes before actually
    transporting them. If a program is doing a lot of data transfers, block buffering
    will speed it up. Line buffering is typically used for text-based I/O, as when
    interacting with a user. It allows bytes to be modified before committing to the
    stream transport. For example, a delete or backspace key may be used to modify
    the bytes in the line buffer, while the enter key is used to initiate the flush.
    Finally, buffering may be completely turned off when'
