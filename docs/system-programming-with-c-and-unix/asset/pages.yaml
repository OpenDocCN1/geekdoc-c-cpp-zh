    The unsigned base 10 display of an address is often the easiest to read, the hexadecimal
    display of an address is sometimes preferred because it is the easiest to translate
    to binary (each hexadecimal digit converts to four binary digits). Notice that
    the address, in unsigned base 10, is a much larger number than the range we have
    been using (the 400''s). For purposes of code design, it is convenient to use
    small numbers for addresses when writing a memory map, but during debugging, it
    may be necessary to work with large actual address values like these.


    #  4.1.1 Pointer Arithmetic


    There are two uses for the * symbol during variable declaration, and one during
    variable usage. This can lead to some confusion. The distinction is that in the
    first case, the * symbol is indicating the variable type (pointer), while in the
    second case, the * symbol is using the pointer to place a value at another address.
    It is natural to ask why we use the complicated notation


    ```

    char *cp;

    ```


    to declare a variable, instead of something simple


    ```

    pointer cp;

    ```


    After all, if we have to define the four basic data types, why not a keyword to
    define this “fifth data type” that stores an address? The answer is pointer arithmetic.
    When adding or subtracting amounts from an address, pointer arithmetic acts in
    quantities of bytes equal to the size of the thing referenced. For example, consider
    the following code:


    +   2. Of course, the * symbol is also used for multiplication; here we are strictly
    talking about pointers.'
