    # 8.5 • The X Library


    In order to understand the X library,this section first describes how graphics
    libraries in general have developed. It is beneficial to examine the graphics
    libraries used on both a Unix system and an MS Windows system. There are many
    similarities and some differences, which help to highlight some things a system
    programmer needs to know.


    In Section 8.2, we saw that a graphics library serves as a standardized set of
    function calls between an operating system (in particular, a device driver) and
    an application. This allows the same application to work with different graphics
    having varying capabilities. Recent times have seen a tremendous growth in these
    capabilities, from simple two-dimensional raster buffering to full texturing,
    lighting control, and complex rendering of three-dimensional objects and scenes.
    Applications depend upon graphics libraries to implement all of these capabilities,
    either in hardware (if supported by the available graphics hardware) or in software
    in the library itself.


    As graphics hardware capabilities have expanded, a hierarchy of graphics libraries
    has evolved that somewhat resembles the progression of capabilities. Figure 8.7
    shows this hierarchy and some of the popular graphics libraries. On a Unix system,
    the X library is at the bottom level. The X library provides for the creation
    and manipulation of windows. Each window can serve as a “screen” or “display”.
    This allows a user to run a number of different applications at the same time,
    each having its own graphical display, even though the system itself has only
    one monitor or hardware display. This capability has become commonplace that users
    of desktop computers expect by default. However, it would not be available without
    the X library or


    In addition to window functions, the X library provides functions for drawing
    simple two-dimensional graphics, such as lines, circles, and rasters (images).
    The basic properties of these primitives can be manipulated, for example, line
    color, width, and type (e.g., dotted, dashed, or solid). The X library also provides
    functions for interacting with user input devices, particularly a keyboard and
    a


    4. There are several distributions of the X library. At the time of this writing,
    the most prevalent distribution is maintained by the X.Org Foundation. The library
    and documentation can be found at www.x.org/wiki/.'
