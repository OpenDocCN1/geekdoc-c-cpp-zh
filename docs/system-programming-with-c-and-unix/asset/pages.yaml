    bitmask operations work on a single bit: set the bit, clear the bit, or query
    the value of the bit. Each of these operations can be accomplished with the following
    logic:


    | Operation | Logic |

    |---|---|n| set Nth bit | x = x OR 2^N |

    | clear Nth bit | x = x AND NOT(2^N) |

    | read Nth bit | =x AND 2^N |


