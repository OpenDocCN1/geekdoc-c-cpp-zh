  md: "# 8.4.2 Dynamic Graphics\n\nThe curses library is most commonly used for menus\
    \ and basic user interaction. However, it can be used to create dynamic or moving\
    \ graphics, albeit of a limited nature. In this section, we study a few techniques\
    \ to create dynamic graphics. Although the techniques are demonstrated using the\
    \ curses library, the same techniques can be applied using other graphics libraries\
    \ as well.\n\n# 8.4.2.1 Motion\n\nThe most basic technique in creating a moving\
    \ graphic is to erase the screen at the graphic's previous location, immediately\
    \ redrawing it at an adjacent location. Repeating this process over and over provides\
    \ the illusion of motion. The following code demonstrates the technique:\n\n```\n\
    #include <curses.h>\n\nmain() {\n  int i;\n\n  initscr();\n  clear();        \
    \  /* clear screen */\n\n  for (i=0; i<30; i++) {\n    move(10,i);\n    addstr(\"\
    Hello world\"); /* flush buffer */\n    refresh();\n    usleep(100000); /* pause\
    \ 0.1 seconds */\n    move(10,i);      /* back to previous spot */\n    addstr(\"\
    \ \");     /* draw empty space */\n  }\n  getch();\n  endwin();\n}\n```\n\nRunning\
    \ this program, the user will see the phrase \"Hello world\" moving across the\
    \ screen. The usleep() function call is used to control the rate of motion. The\
    \ usleep() function pauses the program for the given number of microseconds, allowing\
    \ for finer control of pausing as compared to the sleep"
