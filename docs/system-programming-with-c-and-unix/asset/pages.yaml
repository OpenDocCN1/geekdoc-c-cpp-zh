    # 7.5.2 Client-Server Model


    Most network process communications follow a client-server model. In this model,
    a process on one computer acts as a server, and a process on the second computer
    acts as a client. The server opens up a port for listening and waits for a client
    to attempt to establish a connection. The client calls the server by connecting
    to the port on which the server is listening. When establishing a connection,
    a process must identify the IP and port to which it wishes to communicate. An
    analogy can be drawn to making a phone call to a house where multiple people live.
    The IP is like the phone number that identifies the house, while the is like the
    name of the person to whom the caller wishes to speak. Figure 7.3 shows a diagram
    of the idea. In this example, a server is listening on its local port 42. The
    client uses its local port 93 to attempt a connection. In the connection call,
    it specifies that it wishes to communicate with a process at 192.168.0.1:42, indicating
    both the server IP and port on which the server process is listening.


    The following subsections explain the steps in creating, using, and closing a
    network communication from the perspectives of both a server and a client.


    # 7.5.2.1 socket()


