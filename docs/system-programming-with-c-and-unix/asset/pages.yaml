    # 2.2.3 Bitmask Operations


    Bitmasking is perhaps the most common type of bitwise operation. It involves using
    a bitmask to change or query one or more designated bits within a variable. The
    bitmask indicates which bits are to be affected by the operation. The idea is
    to operate on a variable, changing or affecting only the bits indicated by the
    bitmask:


    ```

    variable → bitmask (bit N) → variable (only bit N changed)

    ```


    The bitmask indicated that bit N should be changed (N is the bit position, which
    is also the power of 2 of the bit). The following are examples of bitmasks for
    an 8-bit variable (e.g., unsigned char):


    | Bitmask | Base 10 value | Indicated bits to work on |

    |---|---|---|n| 00000001 | 1 | bit 0 |

    | 00010000 | 16 | bit 4 |

    | 10101100 | 172 | bits 2, 3, 5, and 7 |


