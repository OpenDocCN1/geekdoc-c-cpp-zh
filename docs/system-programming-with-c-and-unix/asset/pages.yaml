    #  3.4 Command Line Arguments


    As discussed in Chapter 1, a command line argument is anything typed at the shell
    prompt after the name of the program to execute. Command line arguments are typically
    used to provide information about how the user wishes to run a program. For example:


    ```

    ahoover@video> ls -l -t

    drwx-xr-x 26 ahoover fusion 4096 Jul 20 16:03 ece22/

    drwx-xr-x 7 ahoover 325 4096 Jul 19 17:01 public_html/

    drwx------ 2 ahoover fusion 4096 Feb 7 14:33 mail/

    drwx-xr-x 3 ahoover fusion 4096 Dec 14 2005 ee854/

    drwx-xr-x 3 ahoover fusion 4096 Dec 14 2005 ee429/

    drwx-xr-x 2 ahoover fusion 4096 Mar 19 2005 ece893/

    drwx-xr-x 3 ahoover fusion 4096 Mar 19 2005 ece468/

    drwx-xr-x 15 ahoover fusion 4096 Dec 14 2005 Projects/

    ahoover@video>

    ```


    The command line argument -l tells to provide a long listing in its output. The
    command line argument -t causes the output to be sorted by time last modified.
    This example shows two command line arguments; it is possible to have any number.
    They must be separated from each other by one or more spaces.'
