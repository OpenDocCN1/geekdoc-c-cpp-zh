  md: '# 2.1 Bit Models


    Because of these drawbacks, no data types in C use the sign-magnitude bit model.
    It is usually seen only in simple computing circuits, or in design problems where
    these drawbacks do not present any difficulty. The bit model discussed next was
    designed to overcome these drawbacks.


    # 2.1.3 Two’s Complement Bit Model


    Using the two’s complement bit model, positive integers (and zero) are represented
    exactly the same as they are in the magnitude-only bit model. Negative numbers
    are represented by applying the following sequence of steps:


    +   1. Write the bits for the positive version of the number.

    2. Invert (flip) all the bits.

    3. Add 1.


    For example, to represent –7, we proceed through the following steps:


    | positive value (+7) | 0 | 0 | 0 | 0 | 0 | 1 | 1 |

    | invert all bits | 1 | 1 | 1 | 1 | 1 | 0 | 0 |

    | add 1 | 1 | 1 | 1 | 1 | 1 | 0 | 1 |


    The process of adding 1 is carried out exactly as described in the previous sections.
    Based on our example, we find the two’s complement bit representation for –7,
    using 8 bits, is 11111001.


    When a two’s complement number has a 1 in the highest bit, it indicates that the
    number is negative. To find the value, we perform the same steps:


    | unknown value (–?) | 1 | 1 | 1 | 1 | 1 | 0 | 1 |

    | invert all bits | 0 | 0 | 0 | 0 | 0 | 1 | 0 |

    | add 1 | 0 | 0 | 0 | 0 | 0 | 1 | 1 |


    After performing these steps, the value provides the magnitude of the negative
    number. In this example, we get a magnitude of 7, so the original bit pattern
    11111001 is known to be –7.


    The two’s complement bit model solves the double zero problem with the sign-magnitude
    model. The only bit pattern for zero is 00000000. Applying the steps to compute
    the negative value for the pattern original pattern:'
