  md: '# 2.2 • Bitwise Operations


    A common pitfall for naive programmers is to use the wrong data type for the given
    data or computation. This amounts to using the wrong bit model, with consequences
    similar to opening a random file using a text editor. When seeing a value that
    looks very strange (i.e., garbage), one should look to make sure the correct data
    type is being used. The reason for type casting computations is to ensure that
    all the variables involved are using the same bit model. For example:


    ```

    int i=3;

    double d=7.2;

    float f;

    f=(float)i+(float)d;

    ```


    In the last statement, the (float) in front of the variables i and d converts
    the bits used to represent the values to the float bit model so that the addition
    operation can be performed.

    While programming, even when it is not necessary to understand how the individual
    bits are organized in variables, it is often important to understand how many
    bytes are used by variables. The sizeof() operator reports how many bytes a data
    type, or a variable, is:


    ```

    int i;

    char c;

    double d;

    printf("%d %d %d %d\n",sizeof(i),sizeof(c),sizeof(d),sizeof(float));

    ```


    The result of executing this code is:


    ```

    4 1 8

    ```


    This matches our expectations: a variable of type char is 1 byte in size; an int
    and float are 4 bytes each; and a double is 8 bytes. In Chapter 4, when we look
    at structures and pointers, we will revisit the sizeof() operator.


