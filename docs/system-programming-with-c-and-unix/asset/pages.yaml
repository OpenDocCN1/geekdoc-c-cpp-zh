    # 3.1 • Arrays


    An array is a construct used to store a set of values using only one variable
    name. Each of the values occupies a cell. Every cell in the array is the same
    size, meaning it occupies the same amount of memory. The size of each cell is
    dictated by the data type (char, int, float, double) given in the variable declaration.
    The number of cells is also given in the variable declaration. Here are some examples:


    ```

    int a[2];          /* 2 cells, each cell 4 bytes (32 bits) */ /

    float b[3];         /* 3 cells, each cell 4 bytes (32 bits) */ /

    double c[4];      /* 4 cells, each cell 8 bytes (64 bits) */ /

    char d[5];          /* 5 cells, each cell 1 bytes (8 bits)   */

    ```


