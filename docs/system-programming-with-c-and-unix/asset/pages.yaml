  md: "# 346\n\nThe full language of all these shortcuts is beyond the scope of this\
    \ text. The point is to understand the kinds of operations for which Perl provides\
    \ good programming shortcuts to accomplish. For example, suppose a task required\
    \ parsing an HTML6 file and removing all the markup tags. These tags consist of\
    \ text enclosed in <> symbols. The following simple program accomplishes this\
    \ task:\n\n```\n!/usr/local/bin/perl\nwhile <STDIN>\n{\n  s/.*//;\n  print;\n\
    }\n```\n\nThis program takes only moments to write. Accomplishing the same task\
    \ using the C language would likely take many minutes, even for an experienced\
    \ programmer.\n\n# 9.3.5 Other Features\n\nThe Perl language includes features\
    \ beyond those discussed here. Perl provides hashes, which are like arrays but\
    \ allow indices to take on arbitrary values as opposed to integers. This tool\
    \ is useful for creating lists of data, for example, first and last name, IP address\
    \ and DNS name, or city and state. Perl provides a system function that works\
    \ similarly to the C function of the same name, allowing other programs to be\
    \ called. External programs can be run using the back quotes mechanism similarly\
    \ to how it is done in shell scripting. Perl provides references, which are like\
    \ pointers in the C language. There are also a large number of operators that\
    \ were not discussed here, including pop, push, reverse, and sort, and other shortcuts\
    \ for working with list variables.\n\nFor advanced Perl programming, modules are\
    \ an important tool. They act much like libraries for C programming, providing\
    \ additional sets of functions for programmers. Two important examples are the\
    \ Common Gateway Interface (CGI) and Database Independent (DBI) modules. These\
    \ modules make it easier to write Perl programs that work with web servers and\
    \ database programs by providing standard function calls and interfaces.\n\n+\
    \   6. HTML stands for HyperText Markup Language and is the base language in which\
