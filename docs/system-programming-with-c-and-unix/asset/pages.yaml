  md: '# 8.1.2 Library Files


    Library file contains the actual code for the functions in the library. During
    compiling, we must link to the library file to bring the code together with our
    own, in the example at the beginning of section 8.1, we used the command line
    argument -lm while compiling to tell the compiler to link to the m file, which
    is the library file. But where is this file, and what exactly is inside it?


    On a Unix system, library files are typically stored in /usr/lib. Unix systems
    use the following convention for naming library files: they begin with the letters
    lib and a filename suffix of .a. The only part of library file that is unique
    lies in these parts. Thus, the library file, which we called m when compiling,
    is actually named libm on the system. We can find it follows:


    ```

    ls -l /usr/lib/lib.a

    -rw-r--r-- 1 root 3092430 Sep 4 2001 /usr/lib/lib.a

    ```


    Notice that the file is fairly large, about 3 MB (file size will vary from system
    to system). This shows that there is quite a bit of code in the library file.
    The math library contains dozens of functions, some of which are quite complex.


    On an Windows system, library files have no fixed prefix, but they do end with
    either the .lib or .dll suffix. They may be found in several directories, including
    C:\System32; C:\Windows and a subdirectory installed as part of the compiler (for
    the MS Visual C compiler, this would be C:\Program Files\Visual StudioVC98\Lib).


    When linking, a compiler knows to look for library files in the standard directories,
    usually defined when the compiler is installed. It is also aware of any naming
    conventions, such as expanding libm. However, some library files may be stored
    in nonstandard directories. For example, a new library may be added to a system
    and stored in its own folder to make maintenance of the library easier. The X
    library is commonly stored in /usr/X11/include) and library (/usr/X11R6/lib) files.
    In order to link with that, we must tell the compiler to look in that directory,
    in addition to the standard directories, when looking for library files:


    ```

    gcc -o prog1 prog1.c -X11 -L/usr/X11R6/lib

    ```


    The command line argument -L/usr/X11R6/lib tells the compiler to add the path
    /usr/X11R6/lib to the set of directories in which to find library files.'
