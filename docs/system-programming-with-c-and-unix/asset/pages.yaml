    # 9.3 • Perl


    Perl is a built-in language that is similar to shell scripting. However, it includes
    many more built-in features than shell scripting. Some of these features are equivalents
    of capabilities that shell scripting gets by calling external programs. For example,
    Perl has a built-in tr command for transliterating characters similarly to the
    system program tr. Another built-in command, substr, performs operations similar
    to the system program cut. The capabilities to evaluate true/false expressions
    and to check file properties, provided by the system program test, are built in
    Perl. Perl also includes some features that are not found in shell scripting,
    such as hashes and references. In general, Perl is a feature richer language than
    the shell scripting languages.


    The Perl interpreter program is not run interactively. When it starts, it scans
    the script and compiles it into an intermediate form called a syntax tree. A syntax
    tree is not machine code, but it is quicker to interpret the original Perl code
    (some limited optimizations are also performed during the compilation phase).
    Thus, a Perl program tends to run more quickly than an equivalent shell script
    program, but not as fast as an equivalent C program.


    Perl gained in popularity with the proliferation of web servers and web-related
    applications. It is often used to write programs that work between web servers,
    database programs, and clients. For example, consider a situation where a client
    sends some data to the server initiating a transaction. The server wants to customize
    how the next web page looks based upon the form data. A Perl program could work
    in the middle to perform the customization. For another example, consider where
    a web server needs to access a database based upon some received data. Again,
    a Perl program could work in the middle to perform the access. For these sorts
    of tasks, Perl is sometimes referred to as the "glue language" of the web because
    it is used to write smaller programs that work in the primary programs. It is
    important to note that these sorts of programs could be written using shell scripting
    or other programming languages. However, Perl provides a number of programming
    shortcuts and features that make writing scripts programs quicker.


    This section explains some of the basics of the Perl language and how it is used
    for programming. The goal is to familiarize the reader with the concepts that
    serve programming time, not to serve as a reference. There are a number of books
    that'
