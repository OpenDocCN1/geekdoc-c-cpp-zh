  md: '# 320


    Chapter 9 • Scripting Languages


    Different shell scripting languages can be thought of as different dialects of
    a human language. There are differences between all the dialects, but there is
    a great deal of commonality in the core syntax of all shell scripting languages.
    If a programmer is fluent with that core, then most shell scripts can be read
    and understood with at least some modicum of familiarity.


    This section will focus on the Bourne (sh) scripting language. The Bourne-again
    shell (bash) scripting language is a superset of the sh scripting language, so
    the syntax discussed here is applicable to both. In order to explain how it is
    used, the primary features of the language will be discussed. Examples highlight
    how it can be used to save time and effort to accomplish certain programming tasks.


    # 9.2.1 Input/Output


    The basic I/O statements for the Bourne shell are echo for displaying text and
    read for reading input from the keyboard. For example, consider the following
    code:


    ```

