  md: 'A library file contains the actual code for all the functions in the library.
    The code for the library functions is static, in the sense that it is not expected
    to change (ignoring the moment library upgrades). Therefore, it is precompiled
    and stored in an intermediate format called a library file. For the present discussion,
    the detailed format of a library file is not important; it is enough to know that
    it is code that has previously been compiled and is ready to be linked. If one
    tries to open the file /usr/lib/libm.a with a text editor, it will look like garbage,
    since it is not source code (ASCII text).


    # # 8.2 Purpose of Libraries


    There are several reasons to package a set of functions into a library:


    **Convenience, repetition.** An example in this category is the string function
    library. Many of the string functions are easy to code. For example, the `strlen()`
    function is only a couple lines of code. However, string functions are used frequently,
    and even though they may be easy to code, it is convenient to put them in a library
    to avoid rewriting them every time a new program is written.


    **Difficult to code.** An example in this category is the math library. Functions
    in the math library, such as `sqrt()` and `cos()`, are iterative in nature and
    very difficult to code. For example, to solve for the square root of a number,
    one could continually multiply by itself, lowering the value until it is close
    enough to the value whose square root is being sought. Because these functions
    are difficult to write, we prefer to utilize the expertise of people who have
    studied these problems extensively and have already written code for use. While
    we might be able to write a method that works, the experts have written more efficient,
    methods based on a detailed study of computational mathematics.


    **Hardware/system independence.** An example in this category is a graphics library,
    such as the X library or the OpenGL library. In order to access a piece of hardware,
    a program must go through a device driver in the O/S (see Chapter 5 of I/O). The
    program can call the `open()` function for the specific piece of hardware, and
    then call the `write()` function to send data. If we were developing an application
    only for one system (defined as the O/S plus hardware), then this is a viable
    method for graphical output. However, most of the time, we want an application
    to be capable of running on a variety of graphics displays or cards.


    Figure 8.1 shows an example. Suppose that on system A we have a state-of-the-art
    graphics card that can render three-dimensional primitives with shaded'
