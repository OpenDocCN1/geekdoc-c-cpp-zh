    Notice that the only commands executed are needed to update the dependent files,
    in this sqrt.o and then sqrt. For programs having a large number of files and
    build commands, this can save a great deal of time on repeated builds.


    Makefiles can have other lines in them besides dependencies and commands. Comments
    can be written after the # character. For example:


    ```

    # This is a comment.

    sqrt : main.o sqrt.o  # another comment

    ```


    Macros can be written to define string substitutions. For example:


    ```

    EXEC = sqrt

    $(EXEC) : main.o sqrt.o

    ```


    This example defines a macro named EXEC for the string sqrt. At any later place
    in themakefile, the macro can be used by giving its name inside parentheses and
    preceded by the $ symbol. Macros are useful for file lists that get long but are
    used in multiple dependencies or commands. Two of the most commonly used macros
    are all and clean. The former typically defines all the final targets to be created
    by all the commands in the make; the latter typically executes commands to remove
    all intermediate files created during building, as object code files. Makefiles
    also make use of a few special characters and default rules defined in a system
    ruleset. (The interested reader is encouraged to consult the online reference
    listed in footnote 1 for full details.).'
