  md: '# 218


    Chapter 6 • Program Management


    Packages are usually maintained at web sites organized for specific package management
    tools. The packages stored there sometimes contain executables built for specific
    target systems. Using packages in this manner is not very different from using
    more traditional archive files. The advantage is that installation of such a package
    is quick; the disadvantage is that the build contained within the package must
    exactly match the specifications of the target system. In contrast, many package
    files contain source code and instructions on how to build executables from the
    extracted files. Some package management systems contain tools that automatically
    interact with one or more web sites to obtain packages. This further automates
    the package distribution process in the target user need know only the name of
    the desired package, and not even necessarily to get it. Most package management
    systems have graphical interface front ends to command line tools. This allows
    even relatively inexperienced users to use the package distribution tools.


    Example package management systems include rpm, deb/dpkg, and portant/emerge.
    The rpm package format is used by both the Fedora (Red-Hat) and openSUSE Linux
    distributions. The deb package file format and dpkg software tool are used by
    both the Debian and Ubuntu Linux distributions. The portant package file format
    and emerge software tool are used by the Gentle Linux distribution. At the time
    of this writing, all these Linux distributions are among the most popular; one
    of the main reasons (if not the main reason) for their popularity is the ease
    of software distribution and installation provided by their package management
    systems. On an MS Windows system, the proprietary tools InstallShield and WISE
    Installer perform similar operations. However, MS Windows systems have less diversity
    than Unix systems, in terms of kernels and system file arrangements, so that software
    distribution and installation is less complex to manage.


