  md: "# 6.1 • Program Building\n\nAfter a program is written, it must be built into\
    \ an executable so that it can be running. Building a program consists of a series\
    \ of steps. At each step, the code is transformed to produce an intermediate form.\
    \ Intermediate forms include preprocessed, assembly code, object code, and libraries.\
    \ Understanding these steps and the intermediate forms is important for several\
    \ reasons. Each offers different strategies for saving time or maximizing system\
    \ resources. For example, the preprocessing step provides macros for repetitive\
    \ string substitution; the assembly step provides a programmer with named memory\
    \ locations; and the linking step provides a way to reuse executable code in multiple\
    \ programs. The intermediate forms can be retained between program builds to speed\
    \ up subsequent rebuilds. Errors in the program can be uncovered at each program\
    \ building step. This section goes through the program building process and discusses\
    \ each step.\n\n# 6.1.1 Object Code and Linking\n\n6.1 presents a diagram of the\
    \ basic steps in program building. The steps of compiling and linking transform\
