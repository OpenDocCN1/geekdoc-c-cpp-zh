  md: '# 5


    # Input/Output


    In order to do something interesting, most programs have to get input from somewhere
    and send output to somewhere. This is commonly called input/output, or I/O for
    short. There are several different situations in which I/O occurs. User I/O involves
    interactions between a program and a user, typically through a keyboard and display.
    File I/O involves interactions between a program and the file storage system.
    Device I/O involves interactions between a program and a piece of hardware, such
    as a sensor or peripheral component. Regardless of the particular situation, all
    these I/O transactions use of a similar set of concepts. These concepts include
    streams, buffers, pipes, file attributes and functions, and device drivers. The
    goal of this chapter is to introduce the reader to these concepts.


    It is assumed that the reader is familiar with basic user I/O, such as reading
    input from a keyboard and printing text to a terminal display. The reader is likely
    also familiar with basic file I/O, such as reading and writing text to a file.
    It is common for a student to learn first text-based I/O; unfortunately, this
    can bias the student toward thinking of all I/O as text-based. The goal of this
    chapter is to provide a broader picture into the aspects of generic I/O. It is
    important to remember that text is only one type of data. When considering generic
    I/O, we should remember to think of the data as raw bytes. It is up to the sender
    or receiver of the data to interpret the bytes.'
  merge: -1
  pgno: 150
- img_proc: true
  md: "# 5.1 • Streams\n\nAn I/O transaction occurs when a program receives bytes\
    \ from a source or sends bytes to a destination. Example sources that send bytes\
    \ to a program include a keyboard, mouse, file, and sensor. Example destinations\
    \ to a program send bytes includes a display, file, printer, and actuator. Programs\
    \ can also send bytes to other programs, acting as sources or destinations.\n\n\
    Most operating systems, including Unix, use the stream model to control I/O. In\
    \ this model, any input or output transaction can be viewed as a flow of bytes\
    \ from a source to a destination. The flow of bytes is commonly referred to as\
    \ a stream. The operating system creates and manages streams based upon the function\
    \ calls made by the program. The program has some control over how the stream\
    \ is operated, but in general it is managed by the operating system.\n\nAn I/O\
    \ connection can be established using the fopen(). For example, consider the following\
    \ code:\n\n```\nFILE *fpt;\nfpt=fopen(\"output.txt\",\"w\");\nfprintf(fpt,\"This\
    \ is a test.\");\nfclose(fpt);\n```\n\nFigure 5.1 shows a step-by-step diagram\
    \ of the process. When fopen() is called, a stream connection is established between\
    \ the program and the file. When fprintf() is called, bytes are passed along the\
    \ stream from the program to the file. When fclose() is called, the stream connection\
    \ is broken. As we will see in Section 5.5, all I/O transactions use streams in\
    \ the same manner.\n\n# 5.1.1 Transporting Bytes on Streams\n\nThere are several\
    \ functions that can be used to transport bytes on streams. These include the\
    \ familiar fprintf() and fscanf() functions. For example:\n\n```\n#include <stdio.h>\n\
    main()\\ {\n    FILE *fpt;\nfpt=fopen(\"data.txt\",\"w\");\nfprintf(fpt,\"Fortytwo\
    \ 42 bytes of data on the wall...\");\nfclose(fpt);\n}\n```"
