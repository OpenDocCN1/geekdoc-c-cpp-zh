  md: '# 7.1 • Families of Operations


    Modern Unix kernels provide several hundred different system calls. These system
    calls are typically broken up into families of functions, each of which target
    a specific purpose or type of operation. This section reviews some of the common
    taxonomy of system calls. Later sections will take a detailed look at a few of
    these families.


    Memory management system calls ask the O/S to manipulate a block of memory in
    some manner, typically so that the memory can be used by an application program.
    Example system calls include mmap(), get(), shmget(), mprotect(), lock(), and
    shmctl(). These operations involve manipulating the low-level attributes of memory
    managed by the operating system. For example, an O/S typically maintains levels
    of memory protection, where the lower levels (such as that used by the O/S) cannot
    be accessed by other programs. Some of these system calls allow the access permissions
    of portions of memory to be changed so that applications can use it.


    Time management system calls ask the O/S to access the system clock, in some cases
    taking action based upon its value. Examples include time(), timer(), set(), setimeofday(),
    and alarm(). These system calls retrieve values from the system clock, or start
    or stop timers based upon the system clock. The alarm() function arranges for
    a signal (signals are discussed in Section 7.4) to be sent to a process once the
    given amount of time has passed.


    File system calls ask the O/S to access a file or device. Example system calls
    include open(), read(), write(), close(), creat() (not a typo—there is


    ![](img/4c54f2714bbf728ff6a8c9898a583e0c_229_0.png)'
