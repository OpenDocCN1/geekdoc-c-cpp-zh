  md: '# 8.4 • The Curses Library 279


    This, of course, is not the square root of 9. A novice programmer, upon seeing
    this, is often confused by the source of the error. Where did the garbage value
    come from? The answer is the header file math.h was not included, so that the
    compiler did not know the type of value returned by the sqrt() function. By default,
    the compiler assumes that all functions return an int. However, the sqrt() function
    actually returns a double. This causes a mismatch, where the return value is interpreted
    erroneously, causing the garbage value to appear.


    +   • Some compilers will warn of this potential problem. For example, a compiler
    may produce the following warning:


    ```

    main.c(8) : ''sqrt'' undefined; assuming extern int

    ```


    With a little practice, a programmer will come to recognize this type of warning
    as a potentially serious problem, and will some programmers take advantage of
    the "int-by-default" return value and code without proper function prototypes
    or header-file usage. An experienced programmer should be aware of this practice
    and prepared to work with code written in that manner.


    # 8.4 • The Curses Library


    Curses is a basic graphics library for use on a character terminal. It provides
    the lowest level of graphics and dates back to the time when most modern computer
    displays could print only text (they could not display images or other graphics).
    These displays were called terminals. Although most modern computer displays can
    show images and other graphics, the curses library and character graphics are
    still useful. For example, many computing systems use a "boot loader" when first
    powered. This boot loader runs before the O/S is loaded. Without the O/S, and
    its device driver to operate the advanced graphics functions, the computing system
    is only capable of character graphics. Similarly, when installing an O/S, the
    more advanced graphics capabilities are typically not available. In some embedded
    systems, a simple character-based display may be all that is required. A library
    like curses is useful in all these cases.


