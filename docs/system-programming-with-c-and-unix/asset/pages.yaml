    \ the byte values in some manner before placing them on the stream, or after retrieving\
    \ them from the stream. Although these functions can simplify programming involving\
    \ text data, they should be used with care. It is common for a novice programmer\
    \ to fall into traps using these functions by not understanding the precise manipulations\
    \ made upon the bytes by these functions. It is more prudent to use the generic\
    \ fread() and fwrite() functions to move bytes on streams, custom coding any desired\
    \ byte manipulations. In this manner, a programmer can be more certain of what\
    \ is happening on a stream transaction.\n\n# 5.1.2 System I/O Functions\n\nThere\
