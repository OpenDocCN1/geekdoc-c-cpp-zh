  md: '# Pointers and Structures


    In the last chapter, we used the memory map to study how arrays and strings work.
    Writing out a memory map is often useful during program design. During debugging,
    it can be invaluable. In this chapter, we extend these ideas to pointers and structures.
    All variables have an address in memory, the same way that all houses and businesses
    have a street address in the real world. However, the organization of buildings
    and streets becomes clearer by looking at a map. It tends to be easier to explore
    an unknown city or to reach a destination using a map. In the same way, it tends
    to be easier to design code for a problem involving pointers or to debug the code
    using a memory map. Pointers (and to some degree, structures) can be the most
    difficult tool to master in the C programming language. The goal of this chapter
    is to increase the proficiency of the reader with these tools through a deeper
    understanding of how they work.


    # 4.1 Pointers


    A pointer is a construct used to store an address of a variable. We declare a
    variable to be a pointer-type variable by preceding its name with the asterisk
    symbol (*). For example:


    ```

    char c,*cp;

    int i,*ip;

    float f,*fp;

    double d,*dp;

    ```


    The variables c, i, f, and d are normal variables, each holding a different type
    of value. The variables cp, ip, fp, and dp are all pointers, each holding an address.'
