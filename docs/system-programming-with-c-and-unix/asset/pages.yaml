  md: '# Chapter 1 • Introduction


    Microsoft Windows™ and Unix.¹¹ For reasons about to be explained, this text advocates
    the study of system programming concepts on a Unix system. Note that this discussion
    centers on which is to be preferred for study. There are other ongoing debates
    as to which operating system has the better business model, better development,
    and other issues. The interested reader is directed to seek other sources for
    discussion on these debates.


    The Windows operating system is designed to simplify computer usage. A Windows
    computer is essentially a closed system. The system is designed to be turnkey,
    in line with the business model of providing the typical user with system that
    is as easy to use as possible. This design strategy necessitates getting “under
    the hood,” to keep the typical user from doing something harmful to the system.
    In addition, Microsoft publishes limited information on the internal workings
    and design of Windows. This is also a business policy to protect their design
    from competitors. Finally, Windows is monolithic, not allowing for various parts
    of the system to be disconnected or swapped for alternatives. Once again, this
    is a business decision; Microsoft wants to sell its products and only its products,
    so it makes its system fully integrated. It is straightforward to understand the
    business motivations for the closed design, scarcity of published details, and
    non-modularity of Windows. However, the properties that aid the typical computer
    user can be frustrating for the student system operation.


    Unix, on the other hand, and specifically Linux, has different design principles.
    It is open source, so that all details of its inner workings can be studied. It
    is completely modular, so that any system component can be swapped for an alternative.
    For example, the Linux kernel is developed completely independently of the desktop
    environment. Within the kernel, a Unix operator has many choices as to how to
    configure the operation of the system. The kernel itself can be swapped or modified.
    One could argue that these properties prevent the widespread adoption of Unix
    by typical computer users, who are not interested in this flexibility and openness.
    However, it is design properties that make Unix an attractive choice for a student
    system operation.


    Throughout this text, the examples shown are taken from a computer running the
    Linux operating system. For the most part, these examples can run just as easily
    on a Windows or other Unix system. There are some important design issues that
    differentiate Unix/Linux and Windows, as the multiuser versus single-user nature
    of the system. These differences will be discussed in the appropriate places.
    Beyond these considerations, deep down under the hood, the system concepts are
    largely similar.


    +   1. In this book, Unix refers to any Unix-like system, including Linux, Mac
    OS X, BSD variants, etc.'
  merge: -1
