    # 1.2.2 Text Editor


    The second tool considered here is a text editor. The basic operations of a text
    editor allow you to write and edit code, save it to a file, and load it from a
    file. These operations are not much different from those supported by a word processor.
    In fact, it is possible to use a word processor to write code (although it is
    not recommended). However, there are additional features that a text editor can
    provide, beyond what a typical word processor provides, that are designed to support
    programming. For example, 1.4 illustrates the finding of matching parentheses.
    Using the text editor `vi`, if the cursor is on an opening or closing parenthesis,
    pressing the percent symbol (%) moves the cursor to the matching parenthesis.
    Pressing a second time moves the cursor to where it was. The same keystroke matches
    opening and closing braces (the symbols binding of code) and square brackets (the
    symbols used for array indices). For the text editor `ged`, bracket matching is
    enabled through a menu option. For the text editor `emacs`, the bracket matching
    feature can briefly move the cursor to the opening bracket every time a closing
    bracket is typed, animating the grouping. Some text editors also color coding
    to highlight matching brackets and their enclosed blocks of code. Whether text
    editor is used, the bracket matching feature can be quite useful in tracking down
    logic errors on expressions, flow errors on loops, array usage, and other bugs.'
