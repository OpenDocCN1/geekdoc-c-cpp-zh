  md: 'The GTK+ library is a popular user interface library on a Unix system, but
    there is no consensus standard.


    Another important difference between the X library and the Win32 library is the
    separation of “display” from the hardware. Using the X library, an application
    can open a window and interact with a user on hardware that is separate from the
    hardware on which the application is running. This is accomplished through networking.
    For example, a user can remotely log into a machine, run an application on that
    machine, and yet graphically its output on the local monitor. This process can
    also be done in reverse, displaying output on a remote machine. The Win32 library
    does not provide for separation of window and display. The library can only interact
    with hardware directly connected to the system. While this capability can sometimes
    be useful, it is rarely used by system programmers. As emphasized throughout this
    book, experienced system programmers prefer to interact with programs through
    a shell interface. A remote text-display capability is usually sufficient for
    interacting with programs through a network.


    As three-dimensional graphics have become popular, particularly for games, another
    level of libraries has developed to satisfy the need for hardware-independent
    application development. On a Unix system, the OpenGL library is commonly used.
    It provides functions for manipulating and rendering three-dimensional meshes,
    applying textures, and controlling lighting. On an Windows system, the DirectX
    library is commonly used. It provides a similar set of functions for manipulating
    and displaying three-dimensional graphics. Although primarily developed for specific
    systems, there are implementations of both libraries available for other platforms.
    The main difference is that the OpenGL library is open source while the DirectX
    library is proprietary. At the time of writing, both are available for free.


    There is one last important difference to discuss between a Unix system and an
    MS Windows system. On an MS Windows system, not only is the user interface standardized
    the system interface is standardized as well. All windows look and operate similarly.
    The titlebar is a standard size with a standard font. The application menu always
    lists from the top-left corner, rightward, and each a pull-down menu. The system
    menu for each window always appears in the top-right corner and consists of three
    consistent icons: lower horizontal (minimize window), square (maximize window),
    and X (close window). The mouse uses the same cursor. The overall system menu
    is always in the bottom-left corner, and the clock is always displayed in the
    bottom-right corner. Right-clicking on the background (or desktop) brings up a
    menu to control desktop-appearance, while left-clicking on the desktop allows
    the user to draw icons or start applications. On a Unix system, the system interface
    is not standardized. The'
