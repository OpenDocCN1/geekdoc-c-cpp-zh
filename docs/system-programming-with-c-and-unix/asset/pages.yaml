    ```


    In each line of code, the * symbol indicates that a value is to be placed at the
    given address. In the first line, we have the value of “cp+2” as the address.
    But at what address? The value of cp is 400. Adding 2 gives an address of 402.
    Looking at the memory map, the variable ca[2] resides at that address, so this
    seems to make sense. Now consider the second line, where we have the value of
    “ip+2” as the address. The value of ip is 407. Adding 2 gives an address of 409,
    which is the midpoint of the variable ia[0]. This does not make sense.


    Pointer arithmetic uses the units of the variable “pointed to”. Those units are
    set during the variable declaration. Since cp is a pointer to char, its units
    are 1-byte increments. Since ip is a pointer to int, its units are 4-byte increments.
    Using the correct units, we can determine:


    ```

    cp+2 = cp+2 (1 byte units) = 400+2 = 402

    ip+2 = ip+2 (4 byte units) = 407+8 = 415

    ```


