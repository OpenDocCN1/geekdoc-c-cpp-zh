  md: '# 1.1.3 Why C?


    Selection of a particular programming language is an old debate in computing.
    For application development, the debate still rages. For system programming, however,
    very few experts argue for a language other than C. The reason is simple: C is
    closest to the hardware. All programming languages provide various levels of abstraction
    to assist in program development. For example, the concept of a named variable,
    memory address simplifies program development. Out of all the commonly used programming
    languages, C provides for the least abstraction and is closest to the hardware.
    Most C statements translate simply to machine code. The available data types in
    C tend to reflect what the hardware directly supports. Accessing memory via indirection
    (pointers) provides the programmer with the ability to access all parts of the
    system.


    Historically, the development of the Linux kernel, as well as the development
    of the original Unix operating system, was done in C. Most system software is
    developed in C. Device drivers are almost always written in C. An indirect benefit
    of being close to the hardware is speed. Code written in C tends to execute faster
    than code written in other languages. For a programmer who intends to work on
    system software, or who intends to develop code that closely interacts with hardware
    (peripherals or the main system), studying concepts using the C language provides
    opportunities to develop the most practical skills.


    This choice does not preclude the study of other languages or advocate learning
    only C. Other programming concepts outside the scope of this text may be more
    readily studied and implemented using another programming language. However, it
    is the opinion of this author that a firm understanding of the programming language
    closest to the hardware better supports an understanding and proper use of a more
    abstract programming language.


    # 1.2 • The Three Tools


    The three main tools of a system programmer are a shell, a text editor, and a
    debugger. Familiarity with these tools increases programming skill and decreases
    the time it takes to get programs working properly. The following serves as an
    introduction to these tools and their interdependency. The real trick is knowing
    how to use all three together. Noticeably absent from this list is a compiler.
    A compiler is a powerful tool that can certainly aid in program development. However,
    the compiler is addressed more fully in Section 6.1 during a discussion of program
    building.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.2.1 Shell


    It is assumed that the reader is familiar with basic operations in a shell, such
    as generating a file listing. There are a number of good books and online references
    that provide the necessary details to operate a specific shell. Appendix B offers
    a list of common commands. This section is concerned with why a shell should be
    used, and how a shell assists with program development.


    A shell is a program that allows the user to run other programs. A shell is usually
    executed in a terminal. Historically, a terminal and keyboard that was connected
    to a computer, providing a text-only interface to the computer. Today, most operating
    systems provide a graphical interface in which multiple virtual terminals can
    be run simultaneously, each running a separate shell. If a specific terminal is
    reserved for system administration or error messages on behalf of the entire system,
    then it is sometimes referred to a console. In practice, the words shell, terminal,
    and console are used interchangeably.


    Most Unix systems provide several methods to start a shell. Some systems provide
    a shell after login, without the benefits of a graphical desktop. On other systems
    a shell must be started manually through a menu or mouse interface. Once started,
    a typical shell looks like the ones shown in Figure 1.1. Commands are entered
    into the shell through a text-only interface. The shell informs the user that
    it is waiting for its next command via a prompt. In the figure, the prompt is
    a@>, which is the user name and machine name. Some shell configurations show the
    current directory or other information in the prompt. Throughout this text, the
    prompt will hereafter be shown as a@>, to promote clarity.


    A typical command is the name of a program, which starts execution of that program.
    for, both the shells in Figure 1.1 show the execution of the ls program, which
    provides a listing of files in the current directory. Many of the programs in
    a shell have text-only input and output, similar to ls. However, it is also possible
    to run graphics-(GUI-) based programs from a shell. For example, Figure 1.2 shows
    the result of typing xclock at the prompt; it starts the xclock program.


    This method for starting programs may seem strange to those familiar with today''s
    desktop approach to running programs. Clicking on an icon and pursuing through
    a pull-down menu are typical operations used to run a program. Why start a shell,
    just to run other programs? The answer is flexibility. The desktop and menu options
    provide limited options in how a program is run. Typically, the desktop and menu
    shortcuts'
  merge: -1
  pgno: 21
