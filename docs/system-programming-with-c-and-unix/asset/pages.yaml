  md: '# Chapter 2 • Bits, Bytes, and Data Types


    patterns to reduce the necessary storage size. Sorting methods commonly use trees
    and other binary structures during operation. Bitwise operations are also common
    in device drivers and graphics programming.


    In the C language, the smallest data type available is the char, which is 1 byte
    (8 bits). How can we store or manipulate a single bit? One possibility is to use
    an entire char to store the single bit. This is of course wasteful and, if used
    indiscriminately, would seriously raise the amount of memory necessary to operate
    a a modern computing system. Another option is to figure out how to manipulate
    1 bit within a char, or within any other data type. In the C language, this is
    accomplished using bitwise operations.


    In this section, we first describe the basic underlying bitwise operations. Finally,
    we look at bit masking, which is the most common type of coding involving bit
    manipulations. In later chapters in this text, we will see again some coding problems
    when we look at file attributes (Chapter 5) and some graphics operations (Chapter
    8).


    # 2.2.1 Binary Logic Operations


    Recall that a single bit can have a value of either 1 or 0, which can also represent
    true or false. The three most basic logic operations are AND, OR, and NOT. The
    operations work as follows:


    | AND | OR | NOT |

    | 0 AND 0=0 | 0 OR 0=0 | NOT 0=1 |

    | 0 AND 1=0 | 0 OR 1=1 | NOT 1=0 |

    | 1 AND 0=0 | 1 OR 0=1 | |

    | 1 AND 1=1 | 1 OR 1=1 |


    The result of an AND operation is true only if both input values are true. The
    result of an OR operation is true if either input value is true. The result of
    a NOT operation is to reverse the bit value. Logic operations are independent
    of any particular programming language used to implement them, There are several
    other logic operations, for example NOR and NAND, which are commonly used in circuits.
    In this text, we are concerned only with the basic three operations and how to
    implement and use them in C programming.'
