    This code will compile, but when executed produces a segmentation fault. This
    is because the out-of-bounds array access went far beyond the memory used by this
    program, and perhaps tried to access memory used by another program (or one that
    was otherwise restricted). The operating system will recognize the problem and
    terminate the restricted, reporting a segmentation fault.


    Faulty addressing can lead to another type of crash called a bus error. A bus
    error occurs when a program tries to access a memory address that is physically
    impossible (or nonexistent). A bus error can also occur on some systems when a
    program tries to address an "unaligned" address. This means that the program attempts
    to read multiple bytes that are not aligned with the width of the data bus (for
    example, on a 32-bit system the data bus is 4 bytes wide). If an error of this
    type happens, the operating system will recognize the problem and terminate the
    program, reporting a bus error.


    Why does the C compiler allow out-of-bounds array accesses? The question is actually
    more complicated than it seems. Not all arrays have a fixed, known size. Sometimes
    a programmer needs to decide on the size of an array after a program has been
    compiled and is executing. Sometimes a programmer needs an array change size while
    a program is executing. These needs make it impossible for the C compiler to know,
    in all cases, if an array access is out-of-bounds. The answer may not be known
    until the program is running and reaches the code that accesses the array.


    # 3.1.1 Multidimensional Arrays


    Arrays in C can have more than one dimension. But computer memory is all arranged
    in one-dimensional order, as though it were one long street of bytes. How then
    are multidimensional arrays stored in computer memory? Does a computing system
    have some other strange, multidimensional space for use only by these arrays?
    Of course not. The answer is that the cells in the multidimensional array are
    listed out, one at a time, in one-dimensional order. For example, consider the
    following code:


    ```

    int a[3][2];

    a[0][1]=7;

    a[1][0]=13;

    ```


