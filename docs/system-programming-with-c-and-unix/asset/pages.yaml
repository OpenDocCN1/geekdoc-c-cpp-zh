    +   - An additional appendix on software licensing.


    To obtain supplements, please visit www.pearsonhighered.com/. Instructors seeking
    a password for instructor-only material can contact their local Pearson Education
    representative or send email to computing@aw.com.


    # How Is This Book Different from Other Books?


    The focus of this book is on the concepts of system programming; it is not intended
    to serve as a complete reference for any of the topics it covers, such as editors,
    shells, libraries, scripting languages, system calls, and program building. Such
    a text would be ordinately large and unwieldy, and good references for those topics
    are already available. This book puts all the system programming concepts together,
    providing a textbook perspective on systems-level problem solving.


