  md: '# 1.2 • The Three Tools 29


    symbol table includes a list of the variables used by the program. For our example,
    this list includes i and sum. The program is also compiled without optimization.
    Normally, a compiler will rearrange code to make it faster. However, if the program
    is intended for debugging, any rearrangement of the code will make it difficult
    to relate which line of C code is currently being executed. When compiling for
    debugging, it is normally desirable to turn off all optimizations so that program
    execution follows the original C code exactly.


    One can see the effects of compiling for debugging by looking at the size of the
    executable:


    ```

    ahoover@video> gcc sum.c

    ahoover@video> ls -l a.out

    -twxr-xr-x 1 ahoover fusion      4759 Jun 19 18:53 a.out*

    ahoover@video> gcc -g sum.c

    ahoover@video> ls -l a.out

    -twxr-xr-x 1 ahoover fusion      5843 Jun 19 18:54 a.out*

    ahoover@video>

    ```


    The executable has increased in size by 1,084 bytes. This increase in size is
    caused by the inclusion of the symbol table, and because the compiler was not
    allowed to optimize the code, so that its final output is not as efficient as
    it could be. Note that if you forget to compile for debugging, the debugger will
    not be able to operate on your executable. Without the symbol table, or in the
    presence of optimizations, the debugger will be lost.


    After compiling, we run the debugger gdb on the executable a.out that we created.
    This does not immediately execute our program. It runs the debugger and loads
    our program into the debugger environment. This is emphasized by the fact that
    the prompt has changed. Instead of ahoover@video>, which is the shell prompt,
    we now see (gdb), which is the debugger prompt. One can think of a debugger as
    a wrapper around a program. Figure 1.6 shows a diagram. When the debugger is started,
    it uses the symbol table and original C file to keep track of what the program
    is doing during execution.


    Once the debugger is started, it has its own set of commands. One of these commands
    is run, which begins execution of the program. In our example, this results in
    the program running as it would from the shell, eventually producing the output
    sum=29 and then exiting. With the program finished, we are back at the debugger
    prompt (gdb). To exit the debugger, we issue the command quit that takes us back
    to the shell.'
