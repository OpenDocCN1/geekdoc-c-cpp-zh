  pgno: 229
- img_proc: true
  md: '"e" at the end), I seek(), and link(). These bear a resemblance to the C standard
    library functions fopen(), fread(), write(), and fclose(), which are covered in
    detail in Chapter 5. The relationship between library functions and system calls
    is explored in the next section.


    Three families of system calls are examined in detail in later sections of this
    chapter. Process system calls the O/S to run another program, or control how it
    runs. Examples include fork(), exec(), execv(), and wait(). These functions are
    discussed in Section 7.3. Signal system calls provide a rudimentary form of interprocess
    communication. Examples include signal(), pause(), kill(), and sigaction(). They
    are typically used to send a message to a process, telling it about an error it
    has committed and asking it to terminate. These functions are discussed in Section
    7.4. Socket system calls allow a program on one computer to communicate with a
    program on a second computer through a network. Examples include socket(), bind(),
    connect(), listen(), accept(), send(), and recv(). These functions are discussed
    in Section 7.5.


    Other system calls include those used for message passing, shared memory, semaphores,
    and thread management. Some of these families of system calls have entire books
    devoted to their theory and usage. It is not the goal of this chapter to make
    the reader aware of system calls and show, through many examples, how and when
    they can be used to solve problems.


    # 7.2 Libraries and System Calls


    Many standard library functions are built on top of system calls, meaning that
    the library functions use system calls as part of their code. For example, the
    malloc() family of functions is built on top of the mmap() and brk() functions,
    meaning that the latter are called upon to get the job done. The malloc() function
    is in the C standard library, while mmap() is a system call. As another example,
    the sleep() library function is implemented by calling a few time system calls,
    such as alarm(). The sleep() function provides a single function to pause a program
    for a specified amount of time. The fopen(), fread(), write(), and fclose() library
    functions build on top of the open(), read(), write(), and close() system calls.
    This is a common hierarchical relationship between library functions and system
    calls.


    The library functions tend to hide the details of how the resources of the system
    are managed, and they provide a simpler interface to application programs. This
    is usually advantageous for application programming. As an example, operating
    systems use a variety of techniques to manage the available physical memory'
