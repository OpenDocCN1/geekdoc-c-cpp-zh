  md: 'In C, several data types use the magnitude-only bit model. An unsigned char
    is a 1-byte (8 bits) variable with a range of 0 to 255. On a 32-bit system, an
    unsigned int is a 4-byte (32 bits) variable with a range of 0 to 4,294,967,295,
    and an unsigned short is a 2-byte (16 bits) variable with a range of 0 to 65,535.
    Technically, the C language does not define the size of an int. However, the 32-bit
    usage has become so predominant that we will treat it as the standard within this
    text. At the time of writing, 64-bit architectures are becoming more common, and
    there is debate over whether to standardize the C int as 4 bytes or continue to
    allow it to vary depending on the system architecture. Regardless of size, the
    concepts taught in this text are valid, but it is easier to learn the concepts
    by solidifying the size of an int at a specific value.


    # 2.1.2 Sign-magnitude Bit Model


    In the case where signed numbers are desired, a common practice is to allocate
    the highest-order bit to be the sign bit. This is called the sign-magnitude model:


    | example bit value | 1 | 0 | 0 | 0 | 1 | 0 | 1 | 1 |

    |---|---|---|---|---|---|---|---|---|

    | place value | sign | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    | place value (base 10) | + or - | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    By common convention, a value of 0 in the sign bit indicates a positive number,
    while a value of 1 in the sign bit indicates a negative number. In this example,
    the decimal value represented using the 8 bits is -19. Using the sign-magnitude
    model, it is possible with 8 bits to represent whole numbers in the range -127
    to +127.


    The sign-magnitude model suffers from two drawbacks. First, notice that there
    are two possible bit values for zero: 00000000 can be interpreted as “positive
    zero,” while 10000000 is interpreted as “negative zero.” This does not make sense.
    Even more important, using this model makes binary addition somewhat complicated.
    If we have zero or two negative numbers, we can perform addition exactly as outlined
    for the magnitude-only bit model. However, if we have one negative number and
    one positive number, we must instead perform a subtraction. While subtraction
    is not a terribly difficult task, it would be nice if we could use the same method
    for binary addition regardless of the signs of the numbers.'
