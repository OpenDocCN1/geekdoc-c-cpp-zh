    # 4.4 Using Structures


    Structure variables in many cases can be treated exactly like regular variables.
    For example, they can be used in assignment statements and passed as function
    parameters, and a field of a structure variable can be used in regular calculations.
    However, structures can be combined with arrays, pointers, and other structures,
    making the syntax and usage complicated. A good approach to unraveling a strange
    combination, in order to design, debug, or understand code, is to examine it at
    the memory level. The following sections demonstrate this approach.


