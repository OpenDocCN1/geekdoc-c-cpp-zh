  md: '# Scripting Languages


    A scripting language is a very high-level programming language, usually targeted
    toward a specific type of programming work. For example, the shell scripting languages
    provide mechanisms that simplify operations on lists of files. Consider a weekly
    task where a system administrator wants to search user directories for large files,
    and then email each user with a personalized list of their files as part of an
    announcement to reduce network storage. The system administrator could use a shell
    scripting language to quickly write a program to get that task done. It would
    take less time to write the program using a shell scripting language, as compared
    to the C language, because of the mechanisms that a shell scripting language provides
    to simplify coding for those sorts of tasks. From this point of view, the main
    reason for using a scripting language to write a program is to save coding time.


    Scripting languages provide a higher level of abstraction than standard-programming
    languages. The biggest distinction is in data and type definitions. Most scripting
    languages do not distinguish integers, real values, strings, and other data types.
    They rely on context and built-in converters to implicitly change the bit patterns
    used to store values and perform computations. This makes it easier to write programs
    that deal with numbers and text, because the programmer does not have to keep
    track of how the values are actually stored or how computations on them are actually
    performed. However, it can be dangerous without explicit declarations and type
    casting, unexpected results can occur. What makes this work is that most script
    programs are small and tend to have a small number of variables of homogeneous
    type. Thus, a programmer can save coding time by being less strict with variables.'
  merge: -1
