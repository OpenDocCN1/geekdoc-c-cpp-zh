  md: '# Chapter 7 • System Calls


    present it to application programs as one contiguous virtual memory. the memory
    management system calls allow a programmer to get into these details and manipulate
    memory at the lowest level. Most of the time, applications are not interested
    in these operations and simply want to request a chunk of memory. the malloc()
    family of functions in the C standard library provides this capability by building
    on top of the memory management system calls. However, for some types of programming,
    getting into the lowest level of detail is very important. The programming for
    a device driver, for instance, involves getting into the details of the machine
    through system calls.


    Library functions sometimes provide additional capabilities not available directly
    through system calls. For example, the C standard library functions open(), read(),
    write(), and fclose() provide buffering, whereas the system calls open(), read(),
    write(), and close() generally do not. When an read() call is made, more the requested
    amount is read() from the file. The extra bytes are held in a buffer managed by
    the library code. When the program calls read(), the system may be able to satisfy
    the request using bytes already in the buffer, eliminating the need for another
    read() system call. Library functions often optimize operations to minimize the
    number of system calls, thus speeding up program execution.


    Library functions tend to be more portable than system calls. They both have standards:
    the ANSI C standard defines many library functions, while the POSIX standard defines
    many system calls. However, since system calls provide direct access to the kernel,
    different operating systems (including different variations of Unix) will have
    at least slightly different system calls. Therefore, applications that are intended
    to be ported to many different systems are usually coded using library functions
    instead of system calls whenever possible.


    The pages for system calls, library calls, and system programs are all stored
    in different directories, often called sections or chapters. The man pages are
    in section 1, those for system calls in section 2, and those for library functions
    in function 3. Using man, the section can be specified by a command line argument.
    For example:


    ```

    man 2 stat

    ... provides man page for system call stat() ...

    ```


    ```

    man 3 printf

    ... provides man page for library function printf() ...

    ```


    ```

    man 1 ls

    ... provides man page for system program ls ...

    ```'
