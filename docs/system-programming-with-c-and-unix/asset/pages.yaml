  md: '# 9.4.5 Plotting


    MATLAB provides several functions for plotting data. The simplest is the plot
    function. For example:


    ```

    x=0:0.01:1;

    s=sin(x);

    c=cos(x);

    plot(s,c);

    ```


    Executing this code produces the plot shown in Figure 9.2. This code computes
    a range of values from 0 to 1 in 0.01 increments, and then computes the sine and
    cosine of these values. The plot function creates a two-dimensional plot of the
    given data, using the values in the first array for the horizontal axis and the
    values in the second array for the vertical axis.


    MATLAB opens a figure window to display the plot. The figure window has a menu
    that includes options to save the plot in various formats, zoom the view of the
    plot, and change various attributes of the plot, such as its legend. The plot
    function itself can also be given optional arguments to change how the plot appears.
    For example:


    ```

    plot(s,c,''--k'',''LineWidth'',4);

    ```


    The ''--'' argument indicates the data should be connected with a dotted line.
    The ''k'' argument indicates the line should be black. The ''LineWidth'',4'' arguments
    indicate that the line should be 4 points wide. Figure 9.3 shows the plot that


    ![](img/4c54f2714bbf728ff6a8c9898a583e0c_360_0.png)


    **Figure 9.2** A plot of some two-dimensional data.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '![](img/4c54f2714bbf728ff6a8c9898a583e0c_361_0.png)


    results from this command. Other options include which symbol to use to mark a
    data point, and which colors to use for symbols and lines.


    The format of a plot, such as the title, legend, and axis labels, can be changed
    manually through the menu interface of the plot window. However, they can also
    be changed using script templates. For example:


    ```

    xlabel(''sin(x)'');

    ylabel(''cos(x)'');

    legend(''turtle'');

    ```


    Adding these lines to the previous example produces the plot shown in Figure 9.4.
    The xlabel and ylabel statements provide text labels for the x- and y-axes. The
    legend statement provides a text label for each line of plotted data. All other
    statements provide a title, change the extent of the axes, turn a grid on or off,
    and draw arbitrary text at a specific location in the plot. These statements provide
    a convenient mechanism for writing programs that generate lots of plots. Using
    variables and loops, custom formatting can be applied to each plot. Doing the
    same work manually, for example, in a spreadsheet program, takes much longer when
    generating a large number of plots. MATLAB also provides a set of functions for
    plotting 3D data, including the plot3, mesh, meshgrid, and surf functions.


    # 9.4.6 Other Features


    MATLAB provides many additional features not discussed here. For example, MATLAB
    can be used to solve systems of linear equations. MATLAB provides op-'
