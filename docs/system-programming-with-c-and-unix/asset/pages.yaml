    # 7.4 Signal System Calls


    As described at the beginning of this chapter, an operating system (O/S) has two
    main jobs: it manages the resources of the computer (peripherals, files, memory,
    etc.) and it manages all other programs running on the computer. One of the most
    important aspects of managing programs is supporting communication between them.
    Communication between running programs is called interprocess communication (IPC).
    Since the O/S is itself a program, there is a set of calls designed primarily
    to facilitate communication between the O/S and an application. These communications
    are called signals. Most commonly, they are used by an O/S to tell a program that
    it needs to terminate.


    IPC using signals is limited to an alphabet of signal types. Modern operating
    systems typically provide 30–40 different signal types. Table 7.2 lists the names
    and IDs from POSIX.1 standard for the most common signals. Each signal communication
    involves one of these signals, referenced by signal name or ID, to a process.


    A process decides what to do with a signal by declaring or installing a signal
    handler. A signal handler is a function that is executed when a signal is received.
    Different signal handlers can be executed for different signal IDs. A signal handler
    is executed asynchronously, meaning that it interrupts the process at its current
    execution point and execution is jumped to the signal handler function. Each process
    is given a default signal handler for each signal, usually containing code that
    terminates the process. The following subsections explain how to set up custom
    signal handlers and how to send signals between processes.


    # 7.4.1 signal()


    signal() asks the O/S to install a signal handler function for a given signal.
    Installation means that the O/S successfully associates that function with the
    given signal and reads it for execution that process receive the given signal.
    For example, consider the following code:


    ```

    On a Unix system, the command man 7 signal will show a man page listing all signals
    for the system. They can also be listed by executing the command kill -1, or they
    can be found in /usr/include/signal.h or a derivative system header file.

    ```'
