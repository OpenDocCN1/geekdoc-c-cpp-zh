    A large number of symbols and operators can be used to build complex search-and-replace
    patterns. For example, assume the following variable has been declared:


    ```

    $a="Hello Mr. Frog, how are you?";

    ```


    The following is a list of symbols that provide shortcuts for patterns:


    ```

    $a =~ s/./oo/g; # Hello Moo Frog, how aao you?

    $a =~ s/r\rs./; # Hello Mrs. Frog, how are you?

    $a =~ s/el*/ezo/; # Hezo Mr. Frog, how are you?

    $a =~ s/l+/z/; # Hezo Mr. Frog, how are you?

    ```


    . . symbol matches any character except for a newline character. The g character
    at the end of the statement indicates that the search-and-replace should be performed
    globally across all occurrences; otherwise, it is performed only on the first
    occurrence. The \ symbol provides an escape mechanism so that the next character
    is interpreted literally. The * symbol indicates that the previous character should
    be matched zero or more times. The + symbol indicates that the previous character
    should be matched one or more times. Other shortcuts include \d for any digit
    character, \w for any word character, and \s for any whitespace character. Patterns
    or portions of patterns can be negated by various mechanisms, meaning that the
    match is the opposite of what is described. Patterns can be searched or replaced
    left-to-right, right-to-left, or with special circumstances such as starting only
    from the beginning of a line.'
