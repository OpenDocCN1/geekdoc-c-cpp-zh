    ```

    ahoover<video> gcc main.o -lc

    ahoover<video>

    ```


    The flag -lc tells the gcc compiler to link to a library named libc.a. The details
    of this naming convention are further explained in Chapter 8. For now, it is only
    important to see that library files can be linked into an executable similarly
    to how code files are linked. For this particular example, one might wonder why
    the executable can be created with or without explicity link to the libc.a library
    file (with or without the -lc flag). The reason is this file is so commonly linked,
    most compilers are set up to assume that it is needed and so link to it by default.


    Normally, object code files are copied into an executable; all the machine code
    is rearranged a bit but is otherwise copied over the executable. If this were
    done with the object code in a library, then there would be redundant copies of
    the same machine code throughout all the executables using the library functions.
    To prevent this, a library can be linked dynamically, which means that the object
    code is not copied into the executable. Instead, when the program is run, if machine
    code from a library file is needed, it is loaded into memory directly from the
    library file. To demonstrate:


    ```

    ahoover<video> gcc main.c sqrt.c

    ahoover<video> ls -al a.out

    -rwxr-xr-x 1 student 7442 a.out

    ahoover<video> gcc -static main.c sqrt.c

    ahoover<video> ls -al a.out

    -rwxr-xr-x 1 student 476153 a.out

    ahoover<video>

    ```


    In the second case, the library was linked statically, causing all the needed
    object code to be copied into the executable (this includes the object code for
    printf(), for example). Notice how much larger the executable is when the library
    file is linked statically. There are other implications of dynamic versus static
    linking. Dynamically linked executables can run more slowly because multiple library
    files may need to be accessed. Dynamically linked executables are also fragile
    to the system in that, if a library file is removed, the executable will no longer
    run. However, dynamic linking is the default for most compilers and systems, due
    to the space it saves in keeping executables smaller.


