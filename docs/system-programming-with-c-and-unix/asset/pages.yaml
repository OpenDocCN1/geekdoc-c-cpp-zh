  md: '# Chapter 4 • Pointers and Structures


    How big each of these variables? From previous chapters, we know that a char is
    1 byte, an int and a float are 4 bytes each (although they use the bits differently),
    and a double is 8 bytes. How many bytes does a pointer use?


    To answer that question, consider what a pointer holds: an address. A pointer
    needs enough bits to store all the possible addresses on the computing system.
    How many addresses are there? At the time of this writing, a common computing
    system can have a maximum of 4 GB of memory. It takes 32 bits to store roughly
    4 billion different addresses, one for each byte of memory. In fact, this is precisely
    why such a computing system is limited to 4 GB of memory; it is because it has
    a 32-bit address bus connecting the CPU to memory.¹ we have been assuming a 32-bit
    architecture to explain memory concepts.


    Knowing how many bytes a pointer variable requires, we can now draw a memory map
    for our example above:


    | Label | Value |

    |---|---||

    | c | 400 | |

    | cp | 401-404 | |

    | i | 405-408 | |

    | ip | 409-412 | |

    | f | 413-416 | |

    | fp | 417-420 | |

    | d | 421-428 | |

    | dp | 429-432 | |


    An address is an address, regardless of what resides at that address. All addresses
    require 4 bytes. Therefore all pointers, regardless of the type of variable “pointed
    to”, require 4 bytes.


