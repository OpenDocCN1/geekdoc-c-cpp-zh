    The # symbol starts a comment, and everything after it is considered part of the
    comment. The $ symbol indicates that the rest of the string is the name of a variable.
    The \ symbol is an escape sequence and indicates that the next character should
    be displayed literally; this allows for the display of the reserved symbols in
    output. The use of single quotes ('''') indicates that everything inside them
    should be displayed literally including any special symbols. The braces ({}) can
    be used to enclose the name of a variable when it is to be displayed adjacent
    to other text; in this manner, the shell knows the extent of the variable name.
    In the second to last line in the example above, the shell tries to display the
    value of the variable HI, which is undefined and hence displayed as empty.


    # 9.2.2 Variables


    Variables do not need to be explicitly declared before being used. The first time
    a new variable name is seen, the shell programming environment allocates space
    for it automatically. For example:


    ```

    #!/bin/sh

    OCKS=4

    echo Price?

    read PRICE

    echo $ROCKS rocks for sale, $PRICE each

    ```


    If this code is stored in a file named rocks.sh, then it can be executed as follows:


    ```

    ahoover@video> rocks.sh

    Price?

    $1.25

    4 rocks for sale, $1.25 each

    ahoover@video>

    ```


    This can seem quite strange to someone familiar with C programming or other high-level
    languages. It is one of the shortcuts provided by shell programming. The idea
    is to save the programmer''s time required to write explicit variable declarations,
    allowing variables to be declared on-the-fly.'
