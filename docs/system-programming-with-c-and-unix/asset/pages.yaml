  md: '# 1.1 • What is System Programming?


    This text was written with three goals. First, it supports teaching about the
    tools and concepts of system programming. Second, it should help the reader elevate
    his or her programming skill beyond an introductory level. Third, it provides
    a rigorous regimen of programming exercises and examples that allow the reader
    to practice and develop the skills and concepts of system programming. To help
    achieve these goals, example code pieces and programs are provided throughout
    the text. Each chapter ends with numerous questions and exercises that can be
    undertaken to strengthen understanding of the material.


    Besides the concepts of system programming, this text explores the lower-level
    data types: bits and bytes, it, arrays, strings, structures, and pointers. This
    chapter is covered with an emphasis on memory and understanding how and why these
    different data types are used. It is common for a student to be less comfortable
    with these topics than with other basic programming concepts, such as loops and
    conditionals. The coverage of the lower-level data types is intended to reinforce
    an earlier exposure to these topics. The goal is to advance the programming skill
    of the reader to the point where these lower-level data types are well-known and
    comfortably used.


    # 1.1.1 Required Background


    This text assumes that the reader has a basic understanding of programming, such
    as variables, loops, conditionals, and control flow. For example, the reader may
    have completed a single semester of study covering an introduction to C programming.
    If the reader studied a different language, such as Java or C++, then Section
    1.5 can be studied to provide background on the equivalent C syntax. The text
    also assumes that the reader has a working computer system, with a C compiler,
    text editor, and debugger already installed. The reader is assumed to be familiar
    with the basic operation of the computer system, such as navigating a directory
    or folder hierarchy and executing programs. Lastly, some skill knowledge is also
    assumed, such as obtained from an introductory programming course.


    # 1.1.2 Why Unix?


    The majority of the material presented in this text can be studied on any computer
    system, using any operating system. However, it would be naive not to recognize
    the two most prevalent operating systems at the time of this writing:'
  merge: -1
