    # 9.2.6 Other Features


    There are a number of features of shell programming that were not covered in this
    section. Features not covered include exit codes, pattern matching (wildcards),
    exporting variables to other scripts or shells, the case statement, and functions.
    When combined with the large number of shell external programs available, there
