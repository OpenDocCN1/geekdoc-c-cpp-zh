  md: "# 3.3.7 Nonlibrary Problems\n\nA naive programmer can become too reliant upon\
    \ the string library functions. Not every text processing problem is easily solved\
    \ through use of the library functions. For many problems, individual character\
    \ processing of string data must be coded. This section demonstrates an example.\n\
    \nSuppose we want to remove all occurrences of the letter 'a' from a string, compressing\
    \ characters to fill any created gaps. For example:\n\n| Original | Result |\n\
    | --- | --- |\n| \"Saturday\" | \"Sturdy\" |\n| \"a ball\" | \"bll\" |\n\nThere\
    \ is no single function within the C standard library that will accomplish this.\
    \ Instead, we must write code to process the string at the character level. The\
    \ following code accomplishes 'a'-removal:\n\n```\nint i,j;\nchar s[6];\ns[0]='a';\
    \ s[1]='b'; s[2]='a'; s[3]='c'; s[4]=0;\ni=0; j=0;\nwhile (s[i] != 'a')\n{\n \
    \   if (s[i] != 'a')\n    {\n        s[j]=s[i];\n        j++;\n    }\n    i++;\n\
    }\ns[j]=0;\n```\n\nThe memory map during execution of this code may be written\
    \ as:\n\n| Label | Address | Value |\n| --- | --- | --- |\n| i | 400–403 | Ø 1\
    \ 2 3 4 |\n| j | 404–407 | Ø 1 2 |\n| s[0] | 408 | 'a' 'b' |\n| s[1] | 409 | 'B'\
    \ 'c' |\n\n(continued)"
