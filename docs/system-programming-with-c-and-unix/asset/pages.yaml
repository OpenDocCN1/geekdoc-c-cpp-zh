- img_proc: true
  md: '# Chapter 9 • Scripting Languages


    Script languages tend to be good for automating the execution of other programs,
    for example, running daily backups or creating log files. They can be useful for
    rapid prototype programming, where the goal is to see how a particular program
    might look or operate. Script languages are also good for writing a program that
    is going to be used once and then discarded. These sorts of programs do not need
    to be rigorously defined or maintained. Good code organization techniques should
    be followed, but for a program that is going to be used, once and then deleted,
    within the span of an hour, commenting and many other organization practices can
    be skipped. Similarly, the program is likely to be short, so that functions and
    other organization techniques are not needed. Some script programs end being useful
    for a longer time, in which case more source code organization principles should
    be followed. However, the majority of script programs are “quick and dirty,” where
    the main goal is to get the program written quickly.


    Most scripting languages use C-like syntax and are therefore readable to experienced
    C programmers. However, they also use a lot of shortcuts, such as using on-the-fly
    variable declaration. They tend to use short sequences of text or symbols to implement
    common operations, such as reading data from a file or testing variables for various
    types of equality. Thus, they can be difficult to follow in detail. Even experts
    can have a hard time, but most scripting languages provide many ways to accomplish
    the same thing, depending on which shortcuts are used.


    Scripting languages use interpretation to run programs. There is no compile step
    and no executable file separate from the source code file. Some quasi-compile
    source code file as it is loaded into the interpreter, so that those parts of
    the program accessed more than once (e.g., loops) will execute more quickly. However,
    in general, script programs run more slowly than those written in the C programming
    language. Execution speed is not the primary concern, because it is expected that
    the program will be run only once or that the job will be relatively quick. Instead,
    program writing time is the primary concern.


    There are a number of different scripting languages, including shell scripting
    (which itself has many varieties), Perl, Python, Tcl, PHP, Ruby, JavaScript, and
    VBScript. Most scripting languages were developed for a specific type of work.
    A particular language may include additional features features such as hashes
    or graphical user interface widgets, which facilitate a certain type of programming
    work. This chapter looks at three scripting languages in some detail. Shell scripting
    is most commonly used for system administration tasks. Perl is most commonly used
    to “glue” together other programs, especially for web server/client'
  merge: -1
