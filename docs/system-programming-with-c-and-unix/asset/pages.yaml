    # 5.3.1 Pipeline Chaining


    Multiple piping redirections can be done simultaneously. For example, using the
    programs and files from the previous section, the following can be executed:


    ```

    ahoover@video> < input.txt | bingo > output2.txt

    ahoover@video> more output2.txt

    Bingo!

    ahoover@video>

    ```


    In this example, both the stdin and stdout streams of the program summer are being
    redirected, the latter to the second program bingo, which also has its stdout
    redirected to a file.


    Pipelining the output of one program to the input of another program can be done
    repeatedly. This allows us to write programs that perform single, simple operations,
    and link them together into complex chains in order to accomplish tasks. For example:


    ```

    ahoover@video> ls /usr/lib | grep libcu | sort -r

    libcurses.so@

    libcurses.a

    libcurl.so.3.0

    libcups.so.2

    libcupsimage.so.2

    ahoover@video>

    ```


    In this example, the program ls is retrieving a full file listing of the directory
    /usr/lib. This output being sent to the program grep, which is searching for any
    occurrences of “libcu.” This output being sent as to the program sort, which is
    alphabetically sorting the data into reverse order.


    A set of standard programs has been built over the years, following this methodology.
    Table 5.2 provides a list of some of the most common; Appendix provides a longer
    list. Most Unix systems with these programs installed as well as hundreds of others.
    There are a few of which all system users should be aware; more will become known
    and useful as one becomes more invested in system programming. Note that even
    these simple programs have lots of options, controlled by command line arguments,
    to affect how they operate.'
