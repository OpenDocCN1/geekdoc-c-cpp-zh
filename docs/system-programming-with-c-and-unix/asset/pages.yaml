    The struct sockaddr_in holds information about the connection, including the IP
    and port number. It is used in the bind() function to give the socket equivalent
    of a telephone number. At a detailed level, the structure is first zeroed out
    (all bytes in the structure given a value of zero) using the memset() function.
    This is done to ensure that all unused portions of the structure have a value
    of zero. The structure is then filled with information about how the socket will
    be used. The htons() function is one of a family of functions that makes sure
    bytes are in the correct order for network transport. In a bind() call, the value
    of INADDR_ANY as an address indicates that the socket should be bound to the IP
    of the machine on which the process is currently executing. In this example, the
    server will look for communication on its own IP on port number 60000.


    # 7.5.2.3 listen()


    After binding, a server will typically call the listen() function to await communication:


    ```

    int i,sock;

    /* ... socket has been created and bound ... */

    /* listen */

    i=listen(sock,5);

    if (i < 0)

    printf("listen failed\n");

    ```


    The second parameter of the listen() function describes how many connections can
    be queued when the server is handling another communication. In this example,
    the operating system will queue up to five connection attempts before returning
    an error value to additional clients trying to connect.


