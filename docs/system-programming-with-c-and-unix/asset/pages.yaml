  md: '# Who Is this Book?


    The material in this text is intended to be used for study in a single-semester
    course in system programming. It was written to follow an introductory programming
    course. A colloquial title for this book might be Second Semester Programming.
    It is intended to precede the study of more advanced topics in programming such
    as data structures, algorithms, operating systems, and compilers. While it is
    not necessary to sequence these studies in this manner, the study of system programming
    will enhance the ability of a student to implement the more advanced topics. There
    is a strong emphasis in this text on improving the practical programming skills
    of the reader, which should benefit a student in subsequent courses of study.
    For an audience with stronger programming skills, the earlier chapters could be
    covered briefly to allow more time for system topics. Although the book is written
    for a single-semester course, it contains enough material to customize to the
    level of knowledge of the audience.


    # A Note to Instructors


    Each chapter contains numerous code examples throughout the text demonstrating
    the concepts under discussion. All the examples have been thoroughly tested through
    repeated use in classroom instruction. They are also available for download at
    the publisher''s web site, http://www.pearsonhighered.com/irc. They are intentionally
    short so that they can be coded, displayed, and discussed during classroom instruction.
    The author typically uses a laptop with a projector to execute many of the code
    examples during lectures, modifying and testing them in different ways to demonstrate
    the concepts. Students are encouraged to use laptop computers and execute examples
    or short problems from each chapter''s “Questions and Exercises” during class
    periods. These interactive techniques tend to engage students, and this text is
    designed to facilitate that type of instruction. However, these techniques are
    not required to use this text. The examples are short enough to warrant other
    types of display during lectures, and an instructor can use them with confidence,
    knowing that they do indeed execute as demonstrated.


    Certain chapters in this book present multiple examples of the topic under discussion.
    For example, scripting languages are demonstrated through shell scripting, Perl,
    and MATLAB*. All languages do not need to be covered in depth, but seeing several
    examples clarifies the overall purpose and use of scripting languages. The same
    approach is taken for libraries (the examples are C standard, curses, and X) and
    system calls (the examples are processes,'
  merge: -1
