    **Figure 1.** Hierarchical nanofibril assembly of silk via conformational transitions

    (A) Time-resolved growth process of silk nanofibrils. The nucleus undergoes conformational
    transformation into a compact structure and subsequently grows longitudinally
    through three stages: attachment of segments, the tip. Upon addition of paper
    solution, nanofibril growth ceases and degradation initiates at the tip, indicating
    that the tips are composed of non-self-oriented segments.

    (B) Conformational analysis of silk nanoparticles using PIFM. Nanofibrils are
    predominantly composed of β-sheet and β-turn structures, whereas nanoparticles
    exhibit high β-sheet content and random orientation.

    (C) Two-step mechanism of silk formation. The free energy landscape reveals size-dependent
    phase stability, illustrating how fluctuating amorphous clusters overcome energy
    barriers during conformational transitions to stable nanofibrils.\Adapted with
