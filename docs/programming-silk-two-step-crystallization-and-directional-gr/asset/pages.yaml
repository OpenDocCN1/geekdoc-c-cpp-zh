    The results of this study show that silk self-assembly proceeds via a two-step
    mechanism governed by phase stability (Figure 1C). However, nanofibers form amorphous
    clusters that fail to reach a critical size. Once this threshold is surpassed,
    controlled molecular accumulation follows the free energy barrier for conformational
    transformation, enabling the formation of metastable β-sheet phase which becomes
    enhanced against degradation. The fiber tips confirms the presence of J-turn crystallinity
    and reinforces the notion of a two-step energetic and structural landscape, a
    mechanism observed primarily in systems. This pathway allows the assembly to circumvent
    the high energy barrier of direct crystallization by using a metastable intermediate.


