    \n丝质蛋白是丝绸的主要成分，具有亲水域和疏水域的双亲性。这种结构基元支持了环境中丝蛋白组装的基于区块的模型。⁷考虑其在丝蛋白组装中的作用，⁸纤维形成过程中由剪切力和方向性力驱动的构建单元尚未被完全理解。特别是纳米纤维结构内部的构象取向仍待探索，因为它受到动力学和热力学限制的影响。⁹\n\
    \n在最近发表于《先进材料》的一项研究中，James J. Doe 和 Yoore 利用原位电子显微镜和光诱荧光显微镜 (PIFM) 捕捉丝纤维形成的早期阶段，并追踪分子结构相应的构象变化。\n\
