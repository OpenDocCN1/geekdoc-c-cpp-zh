    \ 3-4 nm（图 1）。局部簇的形成\n\n从经典理论的角度观察，这些发现指向了一个更细致的两步路径。\n\n总的来说，这些观察强调了纤维末端在引导丝蛋白纳米纤维生长和取向方面的关键作用。\n\
