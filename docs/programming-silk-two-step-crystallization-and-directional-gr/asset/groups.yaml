    \n蜘蛛和蚕产生的丝蛋白因其卓越的强度和生物相容性，在纺织品、化妆品和防护材料中发挥着多种功能。¹从材料角度来看，这种坚韧的纤维——甚至超过了钢和凯夫拉——是非常显著。尽管试图通过合成策略提高这些性能，但丝蛋白的性能在很大程度上仍然难以达到⁴这种差距是因为对定义天然丝蛋白机制的分级结构和形成路径理解不完全。\n\
    \n氢键以及无定形链之间建立新的、高度有序的相互作用。⁵识别赋予丝蛋白纳米纤维组装特性的机制需要高分辨率分析技术，以实时捕捉结构变化。\n\n垂直收缩至 ~3\
