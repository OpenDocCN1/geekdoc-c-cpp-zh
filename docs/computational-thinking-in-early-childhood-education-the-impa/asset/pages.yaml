    # 4.8. Locate and correct bug


    Mapping the cognitive process in Phases 4 and 5, we created Variable V5 (V5_EvalProg_ProgramDebugging).
    Its subcategories are assigned when a child is led to identifying and debugging
    errors (syntax, semantic/logical, or both) after executing a program or debugging
    the code. Mainly, it involves four subcategories that capture children’s behaviour
    and cognitive process when they locate and correct one or more errors. Children
    exhibit incomplete, semi-complete and complete cognitive processes in the range
    of categories that emerged. A category was not involved in this cognitive process
    due to the original coding’s appropriateness. The following categories created
    and assigned to capture the final stage, the result of a debugging process, are
    qualitatively presented in the following table (Table 4).


    # 4.7. Phase 3–5: Represent program, locate bug and correct bug


    In these three phases, the user should represent the program to investigate the
    possible location of an error, in other words, to detect the error and then take
    action to correct it. This process requires changing and replacing one or more
    errors and retesting the program. Consequently, a programmer should detect, decode
    and verify if one or more errors occur. Our study considers all three phases described
    by two Variables, V5 and V6. Phase 3 regards the representation of a program,
    so in our study, this phase is met by the program’s visual representation with
    the ‘pseudocode’. The teaching sequences of educational scenarios ensured that
    all children would visualise and reflect their verbal algorithmic designs by ‘pseudocode’.
    To that end, each child could easily recognise when an algorithmic design was
    unsuccessful due to error(s) by matching each robot’s movement with each command
    card. Hence, they were led to detect and locate a bug as suggested in Phase 4,
    the most demanding cognitive process in debugging. At this point, the child must
    have identified the location of the error and selected the appropriate command
    to correct the program effectively and successfully solve the algorithm, Phase
    5. Children initially process the solution on an algorithmic design


    Most of the children, 278 out of 526 (f=278, rf=52.85), presented complete and
    functional programs, so they did not debug. In the same category fall those children
    who exhibited the ‘step-by-step’ programming strategy as when in this strategy
    they didn’t come up with errors. Then, 122 out of 526 children (f=122, rf=23.19)
    belong to the category where their programs show errors without corresponding
    debugging.


    In contrast, 120 out of 526 children (f=120, rf=22.81) identify and locate the
    error and consequently successfully correct it, so in this case, it is called
    effective debugging. However, out of the whole set of children who proceeded to
    debug (126/526), only 6 children (f=6, rf=1.14) ultimately failed to modify the
    inaccurate program while attempting its correction. So they do not complete the
    process and would have to continue again by going through Phases 3–5 of the debugging
    model.


    The Variable V6 (V6_EvalProg_Debugging Strategies) is the most important one as
    it is assigned to children to capture the specific strategy they developed when
