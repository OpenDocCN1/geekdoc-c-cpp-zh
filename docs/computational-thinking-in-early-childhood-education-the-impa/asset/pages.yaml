- pgno: 15
  md: '# Appendix 3


    # Description of subject-knowledge evaluation activity as included in Scenario
    2: Measurement.

    Individual interview (post-test).


    Scenario 2: Measurement

    Playful learning context: The class with their friend the Bee-Bot visit the local
    Fun-Fair


    For the evaluation activity, the narration was a new context to reinforce the
    generalisation of knowledge. Here, the class visits the local museum of zoology.
    Therefore numbers 1, 2 & 3 represent the museum''s animal images.

    The educator asks each child the following questions:


    +   i) Which is the shortest path to the Bee-Bot? (the answer is valid only if
    counting justification is given)

    +   ii) Which animal do you find on this path?

    +   iii) How can the Bee-Bot get to the animal using the commands cards?


    Note: the BB should arrive at each animal and look at it.


    ![](img/9a18e486b463cb027ef41704bcf91c4e_15_0.png)'
  merge: -1
  img_proc: true
