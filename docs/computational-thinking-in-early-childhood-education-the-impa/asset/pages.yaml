    is that the specific cognitive processes consist of elaborations which in turn
    lead to the construction of procedural knowledge, i.e., how a programmer can complete
    a debugging process (Komis, 2005). The qualitative characteristics of the variable
    are contained in the table (Table 5).


    As seen from the quantitative data of variable V6, two are the most prevalent
    of the four categories under study. In particular, the category of children of
    programmers with completed programming profiles includes more than two-thirds
    of the sample (394 out of 526 children, f = 394, rf = 74.9); consequently, this
    number of children is not driven by debugging procedures. The next category with
    a significant frequency consists of 110 out of 526 children (f=110, rf=20.91)
    and involves implementing the new program strategy to complete debugging. Subsequently,
    the remaining two categories show minimal distributions and thus do not constitute
    significant findings. Thus, 15 out of 526 children (f=15, rf=2.85) proceed only
    to verbal debugging and 7 out of 526 children (f=7, rf=1,33) proceed to use the
    ‘pseudocode’.


    # 5. Discussion


    This study provides empirical evidence from a large-scale study that teaching
    preschool students (ages 4–6) to code through the tangible robot Bee-Bot can accelerate
    the acquisition of one of CT’s practices, such as debugging. The current study
    uses developmentally appropriate educational intervention and is the first to
    document and report on typologies of debugging behaviours linked to syntactic
    and semantic knowledge. Our research demonstrates the debugging behaviours young
    preliterate children exhibit while processing programming without having prior
    experience but trying to understand if a program is fixable (Papert, 1993, p.
    23) when programming the tangible robot Bee-Bot and what processes are emerging
    in order to identify, locate and correct errors. The children were not aware of
    what steps a debugging process consists of, nor were they taught so. Thus we may
    suggest that children were led to debug intuitively and as a result of their logical
    process to make their program fixable to fulfil their algorithm and solve the
    problem. Although Cuneo (1986) suggested otherwise in a graphic-programming environment,
    in our study, the children managed to debug their incorrect programs even though
    they were not meant to do so, and those programs were more complex than three
    commands. However, most proba-


    bly, tangible programming facilitated and supported this process. In this programming
    context, we applied Klahr’s framework for assessing debugging abilities and describing
    strategy aspects to provide indicators of stages of the debugging process matched
    to preschoolers’ development of CT. The types of errors are categorised in syntactic
    and semantic knowledge, and the individual strategies children develop when they
    recognise the existence of an error are highlighted. We have shown how ‘step-by-step’
    control allowed children to better articulate and pinpoint errors in the program,
    as suggested by Sipitakiat and Nusen (2012). We designed the ‘step-by-step’ function
    to allow children to slow down the execution process and have more time to observe
    and compare the code simultaneously during the robot’s execution. Without this
    function, children had to choose whether to pay attention to the floor robot or
    the ‘pseudocode’ set in a program. The former was usually the case, which often
    made it difficult, especially for children aged 4–5, to associate the observed
    problem with the bug in the program. On the other hand, when using the ‘step-by-step’
    function, students pushed the execution button to run one command at a time, so
    they minimised error risk-taking and articulated the algorithmic design to resolve
    a problem at their own pace.


    # 5.1. Identification of an error and reflective process


    Firstly, regarding the research question about the process children follow to
    identify the existence of error and locate it, we gather evidence from Variable
    1. As shown, most children debugged the same program more than once but up to
    two times. The same evidence is shared by Gould and Drongowski (1974), so we can
    suggest that it is common for this age group to attempt two tries for debugging.


    # 5.2. Types of errors


    Regarding the research question for the types of errors that emerged when coding
    it, an interesting finding is the presence of the two main types of errors: i)
    syntax and ii) semantic/logical. The former type records most children exhibiting
    a complete programming behaviour, in which syntactic errors are absent. However,
    a small proportion of children exhibit semi-complete syntactic knowledge; possibly
    this relates to difficulty building the memory command’s position and perhaps
    its function. It would be helpful for future reference to relate this finding'
