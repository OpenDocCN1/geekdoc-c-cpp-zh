- pgno: 17
  md: '# Appendix 4


    # Description of subject-knowledge evaluation activity as included in Scenario
    3: Memory/iteration.

    Individual interview (post-test).


    Scenario 3: Memory/iteration


    Playful learning context: The class asks the Bee-Bot to accomplish different tasks


    For the evaluation activity, the narration was a new context to reinforce the
    generalisation of knowledge (knowledge transfer). The class asks the BB to get
    to the bookcase or any other context they may encounter. The teaching contract
    is to determine how this can happen using the iteration structure solely.


    The educator asks each child the following question:


    +   i) How can the Bee-Bot reach the bookcase using the repetition command?


    Note: the BB should arrive at the top and look forward to the bookcase or any
    other object/image. More importantly, each child needs to answer what they should
    do to make the BB forget their program before they hand it in to the next child.


    ![](img/9a18e486b463cb027ef41704bcf91c4e_17_0.png)


