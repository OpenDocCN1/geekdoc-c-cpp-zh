    # 4.1. The different cognitive phases of a debugging ‘journey’


    The analysis that follows is made according to Klahr and Carver’s (1988) framework
    that includes different cognitive phases of the debugging process.


    # 4.2. Phase 1: Test and evaluate program


    By observing the behaviour of all children when coding, the majority follow the
    process: a) writing a program, b) executing the program, c) debugging the program,
    and d) retesting and evaluating the program. So we define Variable 1, which records
    the number of times a child coded a program and inputted and executed it by the
    robot. Though some children were led to an effective program by their first attempt,
    using a combination of the taught programming strategies, variable V1 enabled


    us to examine the number of attempts as a result of an ‘error’ to test a program
    and complete it successfully an algorithmic design. In variable V1, children’s
    efforts are recorded by a scaling and the following categories are created: a)
    one (01) to two (02) times, b) three (03) to four (04) times, and c) more than
    four times. The underlying idea was to rank the categories on a scale of one (01)
    to four (04) attempts to classify two types of programming behaviour: a) incidents
    that exhibited the programming strategies with potentially more than one attempt
    and b) incidents that exhibited errors. Obviously, in each category, both types
    of behaviour appear together. As illustrated in Table 1, 449 of the 526 children
    (f = 449, rf = 85.36) attempted up to two times to write and execute a program
    to complete an algorithmic design. As this number of children represents a significant
    proportion of the sample, it implies interpretations such as that a large proportion
    of children: a) were led to implementing the corresponding programming strategy
    (or strategies) or b) identified the error relatively easy, thus were led to an
    effective debugging. On the other hand, these interpretations apply to a smaller
    proportion of children, 40 out of 526 (f=40, rf=7.6), who led to coding three
    to four times. The distribution shows similar behaviour for 37 out of 526 children
    (f=37, rf=7.03) who show a more significant number of attempts more than four
    times.'
