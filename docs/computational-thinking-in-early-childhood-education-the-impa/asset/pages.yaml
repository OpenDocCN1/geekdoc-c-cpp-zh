  md: 'and 24 Twin Centres. The Department of Educational Sciences and Early Childhood
    Education, especially the Laboratory of Science, Mathematics and ICT Education
    of the University of Patras in Greece, was one of the twenty-four Twin Centres
    responsible for training educators on how to plan their teaching following the
    enquiry-based approach. To achieve that, the Twin Centre of the University of
    Patras established its initial Teacher-Network by organizing an open meeting where
    the philosophy and the usefulness of the project, as well as the actual work plan
    presented to preschool teachers and other stakeholders. In that event, the educators
    who were willing to participate in the Teacher-Network got familiar with the enquiry-based
    approach in 3 different scientific areas: i) Science, ii) Mathematics, and iii)
    ICT and were meant to be trained to integrate them into their teaching practice
    through a series of professional development pieces of training and workshops
    that the project offered. Moreover, they were supported by the research team during
    the implementation phase in their classrooms. At the same time, they, in turn,
    contributed to the preparatory phase of the new members of the Teacher-Network
    by sharing with them their experiences and expertise in the meetings.


    # 2.3. Professional development


    Educators attended a three-hour training led by the researchers of this study.
    The training was planned in two parts. In the first part, educators were familiarised
    with the principles of Inquiry Science-Based Education with an emphasis on robotics
    and tangible programming. Programming concepts were approached through maths (spatial
    reasoning, measurement and patterns/iteration) to show how they are embedded within
    the national curriculum. In addition, this part provided introductory information
    on the robotic tools, focusing mainly on the tangible robot Bee-Bot and its affordances
    in early childhood education to teach programming. In the second part, educators
    participated in hands-on play with the robot. They were introduced to the scenario-based
    design in early childhood, the pedagogical principles and methodology, and this
    was based on and how these were formulated in activities. Teachers were given
    the opportunity to implement the scenario as it was planned for their classrooms,
    understand how to implement the research instruments and their importance for
    data’s validity, share possible drawbacks and propose solutions altogether as
    a group. Furthermore, teachers were given hard copies of the scenario, the assessment
    instruments, and the kit for implementation (robots, cards of commands-pseudocode,
    mats, pictures and other additional resources). The training slides, the scenario
    and assessment instruments were also provided in a digital form. Educators were
    given ongoing professional development and support through in-person assistance
    and role-modelling from researchers in their classrooms or phone calls and meetings.
    Additionally, a log was created to keep track of which classes delivered assessments
    and when and when they were planned to finish the implementation and organise
    the rotation of kits’ distribution.


    # 3. Procedure


    # 3.1. Instruments and Data collection


    The present study followed the design-based research (DBR) methodology, which
    aims to improve educational practices through systematic, flexible, and iterative
    review, analysis, design, development, and implementation, based upon collaboration
    amongst researchers and practitioners in real-world settings leading to design
    principles or theories (The Design-Based Research Collective, 2003; Wang & Hannafin,
    2004). Thus, an iterative model of a developmental DBR approach through a three-year
    implementation, analysis, and redesign was developed. It involved multiple collaborative
    iterations (Anderson & Shattuck, 2012). It used multiple case studies to collect
    qualitative and quantitative developmental data (Kelly et al., 2008) within the
    same methodological framework without a distinction to be made. It was considered
    to be included under the case study method (Yin, 2009). These are approached from
    mixed research methods and involve three iterations, collaborative partnership
    between researchers and educators and tactic impact on the educational process.
    Hence, as the DBR approach supports, this research applies mixed methods from
    quantitative and qualitative data and instruments (Fig. 2). A concurrent triangulation
    approach is applied, which ‘provides quantitative statistical results followed
    by qualitative quotes that support or disconfirm the quantitative results’ (Creswell,
    2009). This study utilised the Logo-like tangible robot Bee-Bot and a scenario-based
    design with three scenarios (teaching sequences), following pedagogical and developmentally
    appropriate methodological criteria to organise the learning in programming through
    three different learning areas of the curriculum: i) spatial reasoning, ii) measurement,
    iii) memory/iteration. Different research instruments were developed and introduced
    to children through the distinct phases of an educational scenario concerning
    the data collection and analysis techniques (Fig. 2). All these instruments were
    tools for educators to record and evaluate the learning process. Mainly, all the
    data emerged from the post-test interviews, which were structured interviews with
    two different instruments reporting on mental representations and subject knowledge
    (Appendices 1-4). The interviews were used individually to assess (prior) and
    evaluate (post) the transformation of children’s mental representations and consolidation
    of CT’s skills. Furthermore, data on debugging was derived from the richness and
    range of the programming profiles that emerged in this study since no teaching
    activities or assessment of the debugging process were not included in the scenarios
    implemented.


