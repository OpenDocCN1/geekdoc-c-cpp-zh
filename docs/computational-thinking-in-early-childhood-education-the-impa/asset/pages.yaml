  md: '# 1.3. Debugging in early childhood education


    guage with different types of data representations, the program’s execution, the
    analysis of the outcome, and the correction of program errors constitute the basic
    framework of the Logo culture and to the idea of constructing components to favour
    modularity which in turn leads students to learn the powerful idea of ‘state’
    (Papert, 1993, p. 60). The idea of ‘state’ answers to the question how a machine
    is programmed yet behaves similarly. Different users may program differently but
    with the same outcome for the machine.


    Finally, from a psychological point of view, debugging is received as a diagnostic
    test for ‘symptoms’ displayed on a programme, which would help the programmer
    to their identification and fixation (Hoc et al., 1990, p.55). Especially, the
    Logo environment was designed to cultivate debugging as a cognitive function (Solomon
    & Cambridge, 1986). The emphasis is much more on debugging a child’s ideas than
    on debugging the actual code (Solomon et al., 2020). Detecting errors in a program
    is a significant learning and self-regulation activity based on observing differences
    between expected and observed results. Therefore, debugging process through the
    pedagogical lens of Logo the has a broader dimension. It is not just about composing
    correct programs but aims to develop the cognitive aspects of debugging as a fundamental
    learning and self-regulation activity based on observing differences between expected
    and observed results. Throughout the debugging process learners develops behaviour
    patterns such as perseverance and self-regulation (Bers, 2018a).


    On the other hand, in the context of teaching programming the detection and correction
    of errors (mainly logical and less syntactic errors) holds a dominant position:
    finding and correcting errors is a necessary cognitive and teaching process approached
    by many researchers but initially is focused on older children and students and
    tried to compare or highlight debugging strategies established either by novices
    or between novices and experienced programmers (Kurland et al., 1989; McCauley
    et al., 2008; Murphy et al., 2008; Kim et al., 2018).


    Other researchers are more focused on how debugging could be taught in higher
    education (Whalley et al., 2021). A considerate volume of work investigated student’s
    misconceptions in relations to the reasons the bugs occur and how programming
    course can be improved towards the teaching of debugging (Luxton-Reilly et al.,
    2018; Rich et al., 2019; Swidan et al., 2018; Albrecht & Grabowski, 2020; Emerson
    et al., 2020; Johnson et al., 2020). In order for educators to understand how
    novice programmers interpret debugging process in Logo they need to take into
    account the level of programmers’ knowledge of the syntactic structure (the rules
    for combining elements into commands and the rules for combining commands into
    programs or program segments), and the semantic structure of a programming environment
    (operations, objects and locations) (Fay & Mayer, 1988).


    The programming activity and behaviour of early childhood children during the
    design of an algorithm and writing of a program (code) is directly related to
    the process of ‘debugging’. The process in computer science, particularly in computer
    programming, is called ‘debugging’ and is a high-level thinking skill. Debugging
    is a fundamental concept even when early childhood students learn programming,
    and it will be of great value if CT starts in early childhood education (Wing,
    2010). Kong shows in a review conducted in 24 senior primary school education
    studies that testing and debugging are suggested in seven studies’ core CT aspects
    (Kong, 2019). While much of recent scholarly work deals with the knowledge and
    CT of novice programmers, there has been less emphasis on how very young children
    learn to debug. At an early stage, Cuneo examined the debugging strategies of
    young children in a turtle logo-like programming environment without previous
    experience in computer programming. Although the feedback and practice children
    had received in the immediate conditions, they presented difficulty in fixing
    incomplete programs (missing commands) than fixing a program in an appropriate
    form (sequence or suitability of commands) (Cuneo, 1986). Despite the fact that
    early learning environments increasingly incorporate coding curricula and CS standards,
    there is little about programming and debugging knowledge in early childhood education
    (Wang et al., 2021). However, we can identify a few studies in early childhood
    education (ages 4–8) focused on debugging and robotics education either using
    tangible or visual-block programming or Logo-based computer programming (Bers
    et al., 2014; Fessakis et al., 2013; Flannery & Bers, 2013; Heikkila & Mannila,
    2018; Newhouse et al., 2017; Pugnali et al., 2017; Strawhacker et al., 2018; Sullivan
    & Bers, 2013). Firstly, Fessakis et al. reported that children could be introduced
    to basic computer programming concepts using a Logo-based computer environment
    (Fessakis et al., 2013). Applying a hybrid programming environment with concrete
    robots and computer visual-block programming Flannery & Bers pointed out distinctive
    differences of debugging strategies in early childhood children’s reasoning as
    this was categorised in three cognitive development measures with older ones to
    demonstrate more sophisticated programming expertise (Flannery & Bers, 2013).
    Nevertheless, when children use tangible robots in free play, no organised problem-solving
    behaviours could be developed that could result in a concrete understanding of
    programming and debugging (Newhouse et al., 2017). Furthermore, Pugnali et al.
    emphasised that debugging is the most challenging concept amongst other concepts
    of CT but can be highly mastered with tangible robotic kits such as KIBO rather
    than visual-block graphic programming environments such as ScratchJr (Pugnali
    et al., 2017). However, Strawhacker et al. (2018) reported that children ages
    5–8 indicated mid-to-high levels of ScratchJr programming comprehension on assessment
    tasks on programming concepts and skills of symbol decoding, sequencing, debugging,
    and goal-orientated programming. Especially for the debugging concept it was observed
    younger children displaying poorer comprehension than older ones.


    Although Gomes et al. (2018) used digital games to examine the effects of their
    interactional affordances for teaching computing concepts on children’s aged 5–7
    the interesting evidence regarding debugging was that children developed the strategy
    of erasing the entire program and starting from scratch rather than trying to
    fix the program. Furthermore, Relkin et al. (2021) found that the group of students
    who did not receive the CAL curriculum, which includes the aspect of debugging
    for the development of CT, scored higher than the CAL group; it is assumed that
    is more likely that problem-solving skills was learned through another school
    subject that increased NO-CAL group’s debugging skills.


    Teaching debugging using tangible robots and coding toys is suggested as an appropriate
    developmental context for early childhood education (Angeli & Valanides, 2020;
    Bers, 2018a; Flannery & Bers, 2013; Silvis et al., 2021). For young children,
    debugging using tangible toys involves solving problems at the program level and
    physical materials (Fields et al., 2016). However, most of these devices use a
    logo-like programming language, which encompasses a complexity of syntactic knowledge
    of external modalities (buttons, tiles, blocks) that children encounter in their
    learning to code and debugging (Silvis et al., 2021). Similar evidence is reported
    by Bers et al. (2014) in a tangible-graphical programming environment where the
    discovery of errors may lead children to either decide to keep their original
    goal or switch to an appropriate alternative and in this stage children’s ability
    was reported higher in activities for simpler than complex modalities of a robotic
    system (Bers et al., 2014). Furthermore, concurrent physical and programming bugs
    present opportunities for young children to learn about the broader computational
    system in which they are learning to construct learning models of their debugging
    strategies and the types of bugs they encounter (Silvis et al., 2021). In line
    with this evidence is Nusen & Sipitakiat’s work, when introduced the tangible
    robot Robo-Blocks which allowed children to step through each instruction and
    observe the resulting action, thus making programming accessible to young children
    (Nusen & Sipitakiat, 2011).


    Additionally, some researchers investigated debugging through the lens of teachers
    and their subject knowledge of programming or teach-'
