    # 3.2. Scenario-based design for teaching and learning programming


    At this point, we should describe what a scenario-based design is. A scenario-based
    design for teaching and learning alongside the tangible robot Bee-Bot is used
    to develop children’s abilities of CT (Misirli & Komis, 2014; Komis & Misirli,
    2015; Komis et al., 2017). The conceptualisation of a scenario-based design is
    based on constructionism pedagogical approaches such as project-based learning,
    child-centred learning, problem-solving learning environment, collaborative learning,
    and scaffolding and reflection process. It includes seven parts: 1.Identification
    of the teaching subject, 2.Children’s prior mental representations and subject
    knowledge, 3.Learning goals, 4.Teaching activities, 5.Artifacts and material,
    6.Children’s post mental representations and subject knowledge, and 7.Documentation.
    This model constructs a linear model for designing a full teaching intervention
    based on robotics and presents different planning and implementation instances
    (Misirli & Komis, 2014).


    Especially for part 4 (Teaching activities), the idea was to have two sections.
    The first section of activities was designed to be focused on robotics concepts
    (function, control and operation of the robot), around two basic programming strategies:
    i) ‘step-by-step’ and ii) automated. The first strategy is highly recommended
    to help students in synchronise their thinking better with the actual movement
    of the robot and the program being executed (Nusen & Sipitakiat, 2011). The gridded
    mats we designed supported this strategy as the length of each square corresponds
    to the distance Bee-Bot moves on one linear step. Hence, children, by moving the
    robot on the grid from one location to the other, formulated in an abstractive
    way the program meant to be built. The second section integrated these concepts
    into activities but focused on mathematical and programming concepts (spatial
    reasoning, measurement and memory/iteration). In addition, material (gridded mats
    of 15 cm squares, cards/set of commands, themed pictures) was developed and provided
    to educators in a kit. However, when using the Bee-Bot, the children’s programme
    was not visible as stored internally in the device. Hence, we introduced the set
    of commands in cards, which worked as a ‘pseudocode’ (Fig. 3). Initially, the
    ‘pseudocode’ is a written list of actions in a numbered sequence. However, since
    in the national curriculum, children at that age are not systematically taught
    writing, this'
