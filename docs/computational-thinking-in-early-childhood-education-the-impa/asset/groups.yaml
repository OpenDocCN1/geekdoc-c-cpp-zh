    情境 2：测量


    游戏化学习情境：班级和他们的朋友 Bee-Bot 一起参观当地的游乐场


    对于评估活动，叙述是一个新的情境，以强化知识的迁移。这里，班级参观了当地的动物学博物馆。因此，数字 1、2 和 3 代表博物馆的动物图像。


    教育者问每个孩子以下问题：


