    education that presented practical examples of tasks to enhance CT abilities,
    especially on algorithmic design and debugging.


    However, Sipitakiat and Nusen (2012) examined how debugging can be incorporated
    into a tangible programming system and applied Klahr’s framework for assessing
    debugging abilities. They added new design aspects to the robots they developed
    and provided clues that helped children better understand, locate, and solve the
    problems by showing how step-by-step control allowed children to better articulate
    and pinpoint errors in the program. We followed similar steps with Sipitakiat
    and Nusen (2012) and Rich et al. (2019), but mainly what was proposed early on
    by Carver and Klahr (1986) modelling the specific steps of debugging for children
    (Mayer, 1988, p.33). Thus, we adopted for our study Klahr & Carver’s debugging
    framework, which approaches debugging through five distinct and interrelated phases:
    1) Test and evaluate a program, 2) Identify bug, 3) Represent program, 4) Locate
    bug and 5) Correct bug (Fig. 1). In the first phase, the user tests the program
    and checks by comparing the initial design of the program with its performance
    in the robotic system. If a discrepancy between design and performance is observed
    in the behaviour of the particular robotic system, then the user should proceed
    to Phases 2–5. In that case, the user should first the user should recognise that
    there is an error (bug), then reproduce the program to investigate the possible
    location of the error (bug) and thus lead to the detection of the error (bug)
    and finally correct it.


    As stated by Papert (1993) ‘the process of debugging is a normal part of the process
    of understanding a program’ (p.61). In this study, we identify how novice programmers’
    debugging process matches the troubleshooting framework proposed by Klahr and
    Craven (1988) and how we use that framework to explain debugging. Specifically,
    we aim to answer the following questions: 1) How do children identify the existence
    of error and locate it? 2) What types of errors emerge when coding? 3) What type
    of error is complex for novice programmers? 4) What strategies are developed by
    novice programmers to debug effectively? and 5) What types of knowledge do novice
    programmers construct by debugging the tangible robot Bee-Bot?


    Our work contributes to the field of CT and tangible programming by demonstrating
    how debugging can be analysed in classifications and play an essential role in
    the learning process of fostering CT abilities. This study provides typologies
    of debugging practices focused on developing syntactic and semantic/logical knowledge
    and their effectiveness. Furthermore, results demonstrate the importance of classified
    debugging strategies and behaviours to increase preschool children’s exposure
    to coding and build upon an understanding of the debugging process more systematically.
    Moreover, the study suggests teaching developmentally appropriate robotic and
    programming-based activities that further promote the development of computational
    concepts and thinking in tangible programming.


    # 2. Material and methods


    # 2.1. Participants


    Participants in this study were 526 young children from urban and suburban public
    schools and local mainstream preschools, with a mean age 5,18 years (4.3 – 6.5,
    SD=0,4655). The sample comprised 256 males and 270 females, with 167 younger (4–5
    years old) and 359 older (5–6 years old), given that in the Greek educational
    system, both ages are blended in each class.


    Thirty (30) preschool educators from mainstream public schools trained to implement
    robotics and programming in their classes following a teaching approach based
    on a scenario-based design with additional research instruments to collect data.
    They were instructed to assess children’s prior and post-mental representations
    and subject knowledge of robots and programming by interviewing them individually
    following the script of open-ended questions (Appendix 1). That was highly innovative
    for educators’ theoretical knowledge about summative assessment then. According
    to those reports, children had no prior knowledge of robots and programming. Though
    these results are not included in the present paper, we can report algorithmic
    thinking and programming ability evolution. The ‘Instruments and Data collection’
    section provides more details regarding the research design and instruments used.


    # 2.2. Recruitment


    The study was part of the FP7 European Project’ The Fibonacci Project-Disseminating
    an Inquiry Based Science and Mathematics Education (ISBME)’ which had the ambition
    to contribute to the dissemination of ISBME throughout the European Union. The
    Fibonacci project defined the dissemination process starting with 12 Reference
