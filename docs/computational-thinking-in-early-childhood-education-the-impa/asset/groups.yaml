    # 学前教育中的计算思维：编程有形机器人对发展调试知识的影响


    Anastasia Misirli, Vassilis Komis*


    希腊帕特雷大学教育科学与学前教育系


    # 文章信息


    +   关键词：

    +   计算思维

    +   编程

    +   调试

    +   教育机器人

    +   学前教育


    # 摘要


    本研究调查了526名学龄前儿童（4-6岁）在编程有形机器人时的调试过程。当儿童参与编程时，需要识别并纠正错误，换句话说，即调试程序。调试是一种高阶思维技能，是与学前教育中发展计算思维密切相关的重要组成部分。尽管调试过程是编程中的一种认知功能，近几十年来许多研究者对此进行了探究，但大多数研究要么在小学、中学或高等教育中进行，针对编程初学者或专家。很少有综述，并且有些关注学前教育。我们的研究设定了以下目标：1）儿童如何识别错误的存在并定位错误？2）编码时会出现哪些类型的错误？3）哪种类型的错误对新手程序员来说较为复杂？4）新手程序员会发展出哪些有效调试的策略？5）新手程序员通过调试有形机器人Bee-Bot建构了哪些类型的知识？本研究遵循基于设计的研究方法的迭代模型。它使用多个案例研究来收集定性和定量数据。编程干预由30名教育者在其课堂中实施，并基于情境化教学设计。调试过程使用Klahr
    & Craven的框架（1988）进行分析：1）测试和评估程序，2）识别错误，3）表征程序，4）定位错误，5）纠正错误。主要发现是句法和语义知识的建构与发展。


    # 1. 引言


    # 1.1. 学前教育中的计算思维


    计算思维（CT）的发展包含在计算机科学中，并且在更广泛的范围内，由于共同的目标和宗旨，它与教育机器人相结合。近年来，CT术语被引入计算机科学研究社区和计算机科学教学社区，Wing提出CT技能不仅在计算机科学中有益，而且在许多其他领域中也同样重要，它是一项与读、写和算术同样基础的技能（Wing,
    2006）。从这一概念出现至今，已有大量文献研究了该术语的发展及其可以发展的背景。CT的概念扩展了与编程过程密切相关的“算法思维”一词（Wing, 2006）。几年后，Guzdial在他在美国计算机协会（ACM）上的观点文章中提出，CT是21世纪的新素养，借鉴不同学科的方法将改善高等教育的计算教学（Guzdial,
    2008）。此外，CT是一个不断发展的现代时代中基础且高阶的思维技能，因为它赋予儿童不同层次的思维和推理能力的发展，避免了重复、固定的认知过程（Wing,
    2010）。CT的教育益处包括将CT推广到计算机科学之外的各种情境中，同时增强和提升智力能力（Wing, 2010）。潜在而言，CT的技能和能力情境可应用于所有科学领域，因为不同问题解决策略和多种抽象层次的可适用性取决于它们所嵌入的情境（Barr
    & Stephenson, 2011）。


    在美国，过去十年中许多并行或专门致力于教育的组织已经发布和报告了CT的各个方面及其在教育中的发展。例如，国际教育技术协会（ISTE）主张CT是所有学生必备的素养，它结合了四个支柱——问题分解、模式识别、抽象和算法。它涉及将解决方案表达为一系列步骤以实现流程自动化，并与编程和编码相关联，因为CT是问题解决中的最高思维层次。2019年，ISTE与计算机科学教师协会（CSTE）合作，发起了一项修订工作。


    # 1.3. 学前教育中的调试


    使用不同数据类型表示的语言、程序的执行、结果的分析以及程序错误的纠正构成了Logo文化的基本框架，也构成了“构建组件以促进模块化”这一理念的基础，这进而引导学生学习“状态”这一强大概念（Papert,
    1993, p. 60）。“状态”的概念回答了机器如何被编程却表现相似的问题。不同的用户可能以不同的方式编程，但对机器而言结果相同。


    最后，从心理学的角度来看，调试被视为对程序所表现出的“症状”进行的诊断测试，这有助于程序员对其进行识别和修复（Hoc et al., 1990, p.55）。尤其是，Logo环境旨在培养调试作为一种认知功能（Solomon
    & Cambridge, 1986）。其重点更多在于调试儿童的想法，而非调试实际代码（Solomon et al., 2020）。检测程序中的错误是一项重要的学习和自我调节活动，其基础是观察预期结果与实际结果之间的差异。因此，通过Logo的教学视角来看，调试过程具有更广泛的维度。它不仅仅是编写正确的程序，而是旨在发展调试的认知方面，作为一种基于观察预期与实际结果差异的基本学习和自我调节活动。在整个调试过程中，学习者会发展出坚持和自我调节等行为模式（Bers,
    2018a）。


    另一方面，在编程教学的情境中，错误的检测和纠正（主要是逻辑错误，较少涉及语法错误）占据主导地位：发现并纠正错误是一项必要的认知和教学过程，许多研究者对此进行了探讨，但最初的研究集中在年龄较大的儿童和学生身上，并试图比较或突出由新手或新手与经验丰富的程序员所建立的调试策略（Kurland
    et al., 1989; McCauley et al., 2008; Murphy et al., 2008; Kim et al., 2018）。


    其他研究者更关注如何在高等教育中教授调试（Whalley et al., 2021）。大量研究工作调查了学生关于错误发生原因的错误概念，以及如何改进编程课程以促进调试教学（Luxton-Reilly
    et al., 2018; Rich et al., 2019; Swidan et al., 2018; Albrecht & Grabowski, 2020;
    Emerson et al., 2020; Johnson et al., 2020）。为了让教育者理解新手程序员如何解读Logo中的调试过程，他们需要考虑程序员对句法结构（将元素组合成命令的规则，以及将命令组合成程序或程序段的规则）和编程环境的语义结构（操作、对象和位置）的知识水平（Fay
    & Mayer, 1988）。


    学龄前儿童在设计算法和编写程序（代码）过程中的编程活动和行为与“调试”过程直接相关。在计算机科学中，特别是在计算机编程中，这一过程被称为“调试”，是一种高阶思维技能。即使当学龄前学生开始学习编程时，调试也是一个基本概念，如果计算思维从学前教育开始，这将具有重要价值（Wing,
    2010）。Kong在对24项高年级小学教育研究的综述中表明，其中有7项研究的核心CT方面涉及测试和调试（Kong, 2019）。虽然近期许多学术工作关注新手程序员的知识和计算思维，但对幼儿如何学习调试的重视较少。早期，Cuneo在一个类似Logo的海龟编程环境中，考察了没有计算机编程经验的幼儿的调试策略。尽管儿童在即时条件下获得了反馈和实践，但他们在修复不完整的程序（缺少命令）方面比修复形式适当（命令的顺序或适用性）的程序更困难（Cuneo,
    1986）。尽管早期学习环境越来越多地融入编码课程和计算机科学标准，但关于学前教育中编程和调试知识的研究仍然很少（Wang et al., 2021）。然而，我们可以识别出一些聚焦于调试和机器人教育的学前教育研究（4-8岁），这些研究要么使用有形或可视化积木式编程，要么使用基于Logo的计算机编程（Bers
    et al., 2014; Fessakis et al., 2013; Flannery & Bers, 2013; Heikkila & Mannila,
    2018; Newhouse et al., 2017; Pugnali et al., 2017; Strawhacker et al., 2018; Sullivan
    & Bers, 2013）。首先，Fessakis等人报告称，使用基于Logo的计算机环境可以向儿童介绍基本的计算机编程概念（Fessakis et al.,
    2013）。通过应用结合实物机器人和计算机可视化积木编程的混合编程环境，Flannery和Bers指出了幼儿推理中调试策略的显著差异，这被归类为三种认知发展测量，年龄较大的儿童表现出更复杂的编程专业知识（Flannery
    & Bers, 2013）。然而，当儿童在自由游戏中使用有形机器人时，无法发展出有组织的问题解决行为，以形成对编程和调试的具体理解（Newhouse et
    al., 2017）。此外，Pugnali等人强调，调试是计算思维概念中最具挑战性的概念，但通过诸如KIBO之类的有形机器人套件可以比诸如ScratchJr之类的可视化积木图形编程环境更容易掌握（Pugnali
    et al., 2017）。然而，Strawhacker等人（2018）报告称，5-8岁的儿童在符号解码、排序、调试和目标导向编程等编程概念和技能的评估任务中表现出中到高水平的ScratchJr编程理解能力。特别是在调试概念方面，观察到年龄较小的儿童理解能力较差于年龄较大的儿童。


    尽管Gomes等人（2018）使用数字游戏来检验其交互可供性对5-7岁儿童教授计算概念的影响，但关于调试的有趣证据是儿童发展了擦除整个程序并从零开始的策略，而不是尝试修复程序。此外，Relkin等人（2021）发现，未接受CAL课程（该课程包含用于发展计算思维的调试方面）的学生组得分高于CAL组；据推测，问题解决技能更可能是通过另一门学校科目学到的，这提高了非CAL组的调试技能。


    使用有形机器人和编码玩具教授调试被建议作为学前教育适当的發展情境（Angeli & Valanides, 2020; Bers, 2018a; Flannery
    & Bers, 2013; Silvis et al., 2021）。对于幼儿来说，使用有形玩具进行调试涉及在程序层面和物理材料层面解决问题（Fields
    et al., 2016）。然而，这些设备大多使用类似Logo的编程语言，这包含了外部形式（按钮、瓷砖、积木）的句法知识的复杂性，儿童在学习编码和调试时都会遇到这些形式（Silvis
    et al., 2021）。Bers等人（2014）在有形图形编程环境中报告了类似的证据，其中错误的发现可能导致儿童决定保留其原始目标或转向合适的替代方案，并且在这一阶段，儿童在机器人系统的简单形式活动中的能力高于复杂形式活动（Bers
    et al., 2014）。此外，并存的物理和编程错误为幼儿提供了学习更广泛计算系统的机会，他们在此系统中学习构建其调试策略和遇到的错误类型的学习模型（Silvis
    et al., 2021）。与此证据一致的是Nusen和Sipitakiat的工作，他们引入了有形机器人Robo-Blocks，允许儿童逐步执行每条指令并观察产生的动作，从而使编程对幼儿可及（Nusen
    & Sipitakiat, 2011）。


