    **不完整：V5E_NoDebug_ProgramError**

    编码错误：儿童未识别该错误，因此未发生调试。

    **半完整：V5E_Debugging_NotEffective**

    调试失败：算法设计未能解决问题。

    **完整：V5E_Debugging_Effective**

    调试成功：算法设计解决了问题。

    **未调试：V5E_Debugging_NotAtAll**

    编码成功；算法设计解决了问题。同时，该类别适用于采用“逐步”编程策略的儿童。


    # 表 5


    调试策略的类型学。


    调试策略的定性特征（变量 6）


    **不完整：V6E_DebStr_CardsDebug**

    当儿童口头设计了算法设计，但在使用“伪代码”编写程序时，意识到程序最终需要与口头表述区分开来，并继续进行重新编码时，赋予此类别。

    **半完整：V6E_DebStr_VerbalDebug**

    当儿童口头表述了调试过程，但未编写并执行新程序来纠正错误并重新测试时，赋予此类别。

    **完整：V6E_DebStr_DifferentProgram**

    当儿童编写新程序以纠正错误时，赋予此类别。

    **未调试：V6E_DebStr_None**

    程序的编码和执行中没有错误，即使存在错误，被试也未识别该错误或定位错误以进行调试。


    目前没有文献对此进行报告。对所有类别而言至关重要的是，特定的认知过程由阐述（elaborations）构成，而阐述又反过来促进程序性知识的构建，即程序员如何完成调试过程（Komis,
    2005）。该变量的定性特征包含在表（表 5）中。


    从变量 V6 的定量数据来看，所研究的四个类别中有两个最为常见。具体而言，具有完整编程形象的儿童程序员类别占样本的三分之二以上（526 名儿童中的 394
    名，f = 394，rf = 74.9）；因此，这部分儿童没有经历调试过程。下一个具有显著频率的类别包含 526 名儿童中的 110 名（f=110，rf=20.91），涉及采用新程序策略来完成调试。随后，其余两个类别的分布极小，因此不构成显著发现。具体而言，526
    名儿童中有 15 名（f=15，rf=2.85）仅进行口头调试，526 名儿童中有 7 名（f=7，rf=1.33）使用“伪代码”。


    ## 5. 讨论


    本研究提供了一项大规模研究的实证证据，表明通过有形机器人 Bee-Bot 教授学龄前儿童（4–6 岁）编程，可以加速掌握计算思维（CT）的实践之一——调试。本研究采用了适合发展水平的教育干预，并且是首次记录和报告与句法知识和语义知识相关的调试行为类型学的研究。我们的研究展示了尚未识字的幼儿在编程有形机器人
    Bee-Bot 时，在没有先前经验的情况下所展现的调试行为，以及他们在试图判断程序是否可修复（Papert, 1993, p. 23）时涌现出的识别、定位和纠正错误的过程。这些儿童并不了解调试过程包含哪些步骤，也没有被教授这些步骤。因此，我们可以认为，儿童是凭直觉进行调试的，这是他们逻辑过程的结果，目的是使程序可修复，从而实现算法并解决问题。尽管
    Cuneo (1986) 在图形编程环境中提出了相反的观点，但在我们的研究中，儿童成功地调试了错误的程序，尽管他们并非有意这样做，而且这些程序比三条指令更复杂。然而，很可能有形编程促进了这一过程。在这种编程情境中，我们应用了
    Klahr 的框架来评估调试能力和描述策略方面，以提供与学龄前儿童计算思维发展相匹配的调试过程阶段指标。错误类型被归类为句法知识和语义知识，并突出了儿童在识别错误存在时发展出的个体策略。我们展示了“逐步”控制如何让儿童更好地表达和定位程序中的错误，正如
    Sipitakiat 和 Nusen (2012) 所建议的那样。我们设计了“逐步”功能，让儿童放慢执行过程，并在机器人执行过程中有更多时间同时观察和比较代码。没有该功能时，儿童只能选择关注地面机器人还是程序中设置的“伪代码”。通常情况下，他们选择前者，这往往使
    4–5 岁儿童难以将观察到的问题与程序中的错误关联起来。另一方面，使用“逐步”功能时，学生每次按下执行按钮只运行一条命令，从而降低了犯错风险，并能按照自己的节奏阐述算法设计以解决问题。


    ### 5.1. 错误的识别与反思过程


    首先，关于儿童识别错误存在并定位错误所遵循过程的研究问题，我们从变量 1 中获得了证据。研究表明，大多数儿童对同一程序进行了多次调试，但最多不超过两次。Gould
    和 Drongowski (1974) 也报告了相同的证据，因此我们可以认为，这一年龄段的儿童尝试两次调试是常见的。


    ### 5.2. 错误类型


    关于编程时出现的错误类型的研究问题，一个有趣的发现是存在两种主要错误类型：i) 句法错误和 ii) 语义/逻辑错误。前一种类型记录了大多数儿童表现出完整的编程行为，即没有句法错误。然而，少数儿童表现出半完整的句法知识；这可能与构建记忆命令位置及其功能存在困难有关。未来研究将这一发现与相应年龄组和认知发展联系起来将会很有帮助。后一种错误类型属于高级认知过程中的主要类别——语义/逻辑错误。研究发现，这种错误类型对儿童来说可能更难以构建。定性数据分析表明，语义错误与命令的位置或编号的理解错误有关。


    相比之下，逻辑错误与缺少可编程机器人的控制命令有关。程序中的错误数量从一（1）到三（3）个不等；为了调试这些错误，新手程序员最终会采用适当的策略。每个儿童似乎在每次程序调试尝试中都识别出一个错误。大多数儿童展现出语义知识的构建，因此我们将其归为具有组织良好且稳固的编程行为。


    具有最高语义/逻辑错误分布的儿童人数被分为“语义/逻辑错误_转向方向”和“语义/逻辑错误_数字方向”两类。这些儿童在程序的结构部分难以选择两（2）条命令（方向和转向）的组合。证据表明，儿童倾向于删除比实际需要更多的命令，甚至编写新程序来修复错误（Misirli
    & Komis, 2020）。这一证据表明，错误要么源于他们在空间推理方面的困难，要么源于计数错误（Shumway et al., 2021），尽管这些场景已被证明在构建空间推理方面有效（Misirli
    et al., 2019）。因此，这种语义/逻辑错误类型似乎对新手程序员来说最难。


    此外，我们没有观察到“初始化错误”发生在有形物理领域中，这种错误表现为未能将机器人本身重置到正确的轨迹上（Silvis et al., 2021）。这会导致语义/逻辑错误，因为基于场景的教学设计已经预见到了这种设备复杂性，并安排了适当的活动。总体而言，程序中的错误通常涉及转向错误和缺少代码（Silvis
    et al., 2021），但不涉及控制器错误。


    ### 5.3. 调试策略与知识类型


    此外，关于新手程序员有效调试所采用的策略，那些已经在“伪代码”中表示程序的儿童可能受益于在没有有效结果的情况下推进调试过程。正如 Ahn 等人 (2021)
    所建议的，以多种形式（插电和不插电）进行的体验式和有意义的学习体验可以增加编程教育的可及性。


    如我们的研究所示，一半的儿童通过编写“新程序”来实施调试策略，以完成其调试过程。“新程序”是一个双重过程：识别并纠正原始代码中的错误，或者从头开始编写新代码以实现其算法设计。


    综上所述，我们得出结论，在第 3–5 阶段，学龄前儿童已经能够表示程序，因为这是教学干预的先决条件，其中一些儿童进入了调试过程，但并未达到有效的结果。研究表明，样本中一半的儿童设计和编写出成功的程序来求解算法。然而，仍有相当数量的儿童在句法和语义知识方面存在困难，他们识别出自己呈现的部分错误（句法和语义/逻辑），并得到了适当的纠正和修改。尽管如此，仍有相当数量的儿童继续表现出句法知识上的困难。这可能是由于有形机器人的编程环境不足以巩固句法知识。然而，像
    Scratch 这样的图形化编程可以避免语法错误，因为学生可以通过拖放代码来构建程序，而不会出现语法错误（Resnick et al., 2009; Maloney
    et al., 2010; Qian & Lehmann, 2017），并且有研究报道，这可以帮助初学者更好地理解某些编程概念（Weintrop & Wilensky,
    2018; Chou, 2019）。有趣的是，可以考察在 Scratch 这样的图形编程环境中，使用我们的教学场景来发展句法知识的情况，并将结果与传统编程教学（PTD）课程以及儿童在调试方面得分较低的情况（Pugnali
    et al., 2017）进行比较，因为在这两种教学框架中，重点都不只是调试。此外，本研究揭示了教师精心设计专业发展的重要性，这种专业发展需要明确关注如何使用有形机器人和发展编程技能，以促进计算思维，同时按照
    Chalmers (2018) 的建议，在规划教学时提供适合发展水平的教学法设计。


    ## 6. 局限性与未来研究方向


    本研究在公立学校的常规教学时间内进行。我们意识到，无论教师多么敬业并能在课堂上成功教授这些内容，他们都有不同的教学风格和方法，尽管我们在提供机器人教育专业发展之前已经测试了所有场景。因此，与任何在学校环境中进行的研究一样，我们承认本研究面临若干环境限制。尽管每位参与教师都教授同一个场景，但无法控制不同学校环境中的所有因素；这可能影响了结果。例如，没有记录每个儿童的缺勤情况，这可能是影响一些儿童发展片段化编程技能的因素之一。此外，虽然有些教师在教学中采用了更接近建构主义的方法（正如场景中所暗示的），但另一些教师更可能采用教师主导的实施模式。


    此外，值得考察的另一项内容是后续跟踪案例，尽管这类案例数量较少，并讨论其编程概况，以了解句法知识和语义知识的演变。这可能为调试或计算思维的其他方面提供重要见解，同时也能揭示新手程序员与经验丰富的程序员之间的差异。此外，研究结对调试（McCauley
    et al., 2008）也是扩展本研究关于调试策略及其演变发现的另一种可能。进一步的分析可以考察性别与两个年龄组之间的相关性，以突出即使最初未计划也会出现的计算思维技能和能力。理想情况下，一个参与此次专业发展的教师焦点小组将能提供更多关于他们在面向幼儿的计算思维教育中的信心和学科知识的见解（Chalmers,
    2018; Wang et al., 2021）。


    尽管本文所述研究存在局限性，但从教师那里收集的后期评估数据显示了机器人教育的成功。所有教师都表示愿意再次参与该项目。此外，大多数教师购买了机器人用于课堂，或在欧洲项目结束后从我们这里借用机器人以继续教授编程。然而，支持这种积极反馈的不仅仅是教师；从儿童那里收集的后期评估数据也显示出成功和热情，他们要求探索机器人上更多功能，如暂停按钮。因此，这一反馈凸显了这一过程在广泛范围内的教学适宜性和教育性。


    ## 7. 结论


    > 正如 Bers 在 *Coding as a Playground* 中所写：

    >

    > > “一旦儿童理解了如何调试他们的系统，他们就开始发展可用于各种计算系统的常见故障排除策略。学习如何调试是一项重要技能，就像在数学中检查你的答案或在读写中编辑一样。它教会了一个强有力的教训：事情不会在第一次尝试时就自然而然地成功，通常需要多次迭代才能做好”（Bers,
    2018a, p. 77）。


    在本研究中，我们将调试视为一种计算思维实践，通过在有形机器人环境中的编程来研究，该环境源于


