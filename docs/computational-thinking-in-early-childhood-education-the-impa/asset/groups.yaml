    \ CLEAR & GO 的错误 编码行为：位置错误或缺失\n\n- **半完整**: V3E_SyError_CLEAR\n  使用命令 CLEAR 的错误\
    \ 编码行为：位置错误或缺失\n\n- **半完整**: V3E_SyError_GO\n  使用命令 GO 的错误 编码行为：位置错误或缺失\n\n- **完整**:\
    \ V3E_NoSyError\n  包括正确的控制和操作命令（CLEAR & GO）且位置正确\n\n# 图 6. 语义/逻辑错误和顺序编程结构。\n\n\
    ![](img/9a18e486b463cb027ef41704bcf91c4e_8_1.png)\n\n（图 6）。再次，我们对儿童编程行为的半完整和完整描述。\n\
    \n半完整包括一系列行为（07个类别），试图捕捉在理解的两个层面（即语义和逻辑）上构建语义知识的难度。相比之下，完整策略描述了句法知识的巩固，正如语义-逻辑错误缺失所表达的（表3）。\n\
    \n从定性内容可以识别出，大多数错误被描述为方向和方向命令的不足，这就是我们称之为逻辑错误的原因。只有两个案例以语义错误为特征，并与方向顺序的错误概念相关。然而，我们决定根据定性分析将它们记录在不同的类别中。在变量V4中突出贡献于理解认知编程过程的主要类别。样本的大多数，526名儿童中的315名（f=315,\
    \ rf=60.00），表现出构建的语义知识\n\n孩子们没有构建转向的方面，因此没有构建方向命令。另一方面，在儿童无法在算法结构中定位方向命令的情况下，它被视为逻辑错误。以下类别显示略微相同的分布。因此，526名儿童中的12名（f=12,\
    \ rf=2.00）表现出具有语义知识的编码行为，表现出逻辑错误，这是在转向指令后省略方向指令以及程序中方向命令集的整体上发现的。此外，具有不正确语义知识（逻辑错误）的类别记录了526名儿童中的11名（f=11,\
    \ rf=2.00），这是由于选择适当数量的方向命令的难度。如果从语义棱镜看待这一错误类别，我们可以将这种编码行为解释为对方向概念的误解，混淆了选择适当数量的命令。最后，只有三个儿童的类别被认为具有名义记录的频率且没有兴趣。\n\
    \n及其在这一阶段的有效性，因此他们判断算法的状态和为机器人编程设计的编码。\n\n## 4.8. 定位和纠正错误\n\n映射第4和第5阶段的认知过程，我们创建了变量V5（V5_EvalProg_ProgramDebugging）。当孩子在执行程序或调试代码后被引导识别和调试错误（语法、语义/逻辑或两者兼有）时，会分配其子类别。主要，它涉及四个子类别，用于捕捉儿童在定位和纠正一个或多个错误时的行为和认知过程。儿童在出现的类别范围内表现出不完整、半完整和完整的认知过程。由于原始编码的适当性，一个类别未涉及此认知过程。以下创建并分配的类别用于捕捉调试过程的最终阶段，结果以定性方式在以下表格中呈现（表4）。\n\
    \n## 4.7. 第三阶段至第五阶段：表示程序、定位错误和纠正错误\n\n在这三个阶段，用户应该表示程序以调查可能的错误位置，即检测错误然后采取行动纠正它。这个过程需要改变和替换一个或多个错误并重新测试程序。因此，程序员应该检测、解码并验证是否发生一个或多个错误。我们的研究考虑了两个变量V5和V6描述的所有三个阶段。第三阶段涉及程序的表示，因此在我们的研究中，这一阶段通过程序的视觉表示与“伪代码”来实现。教育情景的教学序列确保所有儿童都能通过“伪代码”将他们的口头算法设计可视化和反映。因此，每个儿童都可以通过将机器人的每个动作与每个命令卡匹配，轻松识别算法设计由于错误而不成功。因此，他们被引导检测和定位错误，如第四阶段所建议，这是调试中最具挑战性的认知过程。在这一点上，儿童必须已经识别出错误的位置并选择了适当的命令来有效地纠正程序并成功解决算法，第5阶段。儿童最初在算法设计上处理解决方案\n\
    \n大多数儿童，526名中的278名（f=278, rf=52.85），呈现完整的和功能性的程序，因此他们没有调试。同类别的还有那些表现出“逐步”编程策略的儿童，因为在这种策略中他们没有产生错误。然后，526名儿童中的122名（f=122,\
    \ rf=23.19）属于他们的程序显示错误但没有相应调试的类别。\n\n相比之下，526名儿童中的120名（f=120, rf=22.81）识别并定位错误并因此成功纠正它，因此在这种情况下称为有效的调试。然而，在进行调试的全部儿童集合中（126/526），只有6名儿童（f=6,\
    \ rf=1.14）最终未能修改不准确的程序同时尝试纠正它。因此，他们没有完成该过程，并且必须继续通过调试模型的第3-5阶段。\n\n变量V6（V6_EvalProg_Debugging\
    \ Strategies）是最重要的，因为它被分配给儿童来捕捉他们在调试时发展的特定策略。特别是，它包括四个（04）子类别，用于记录儿童纠正错误的认知过程。类别的范围表明，儿童主要发展有经验的程序员的调试策略，例如在创建新程序时。然而，他们也发展其他策略\n\
