    情境 3：记忆/迭代


    游戏化学习情境：班级要求 Bee-Bot 完成不同的任务


    对于评估活动，叙述是一个新的情境，以强化知识的泛化（知识迁移）。班级要求 BB 到达书柜或他们可能遇到的任何其他情境。教学契约是确定如何仅使用迭代结构来实现这一点。


    教育者问每个孩子以下问题：


    - i) Bee-Bot 如何使用重复命令到达书柜？


