  - '[PAGE 12]


    the programming activity of young children. Klahr & Craver’s framework was applied
    to analyse young children’s programming behaviour and identify the development
    of syntactic & semantic/logical knowledge through common errors and how they debug
    them. Furthermore, we organised the debugging skills in typologies for each type
    of error and for the overall debugging process. The use of ‘pseudocode’ clearly
    worked out as a medium visually representing a program, thus facilitating novice
    programmers to take a step back and reflect on their programming. The children
    using the ‘pseudocode’ gradually developed coding skills starting from the basic
    ‘step-by-step’ strategy and uplifting to the ‘automated’ one. The findings corresponded
    to the conceptual constructs of high-level thinking skills in debugging. At the
    same time, the number of case studies provided a more reliable context of analysis
    and not low-level abilities as implied by Xu and Rajlich (2004).


    In this study, we have shown that debugging as a core practice of CT may emerge
    in preschool children when controlling a tangible robot without using the ‘step-by-step’
    strategy or particular design aspects to teach debugging, as it was suggested
    by Nusen and Sipitakiat (2011) and Sipitakiat and Nusen (2012). In addition, it
    is shown that the ability of novices to recognise and separate their selves from
    coding and machine is a common problem for novices in programming (Pea, 1986).
    Further work needs to be done on various tangible robotic tools and the challenges
    and opportunities these provide (Wing, 2008). Though the findings of this study
    come from a robotics context, still could provide researchers and educators with
    explicit information of children’s debugging process to support their teaching
    and can be applied to other tangible robots or block-based programming environments
    (Bers, 2018b; Kim et al., 2018; Silvis et al., 2021). Furthermore, it will help
    us to expand and improve our analysis and conceptual programming model of scenario-based
    design (Misirli & Komis, 2014; Komis et al. 2017).


    Considering debugging is one of the of the CT aspects, the benefits of this line
    of research are likely to be included in investigating how teachers debug the
    code programmed by others (e.g., students) and help them debug and provide knowledge
    towards cultivating a process-orientated teaching design than one based only on
    outcomes of successful or unsuccessful programming (Chalmers, 2018; Kim et al.,
    2018; Relkin & Bers, 2021; Silvis et al., 2021). Above all, institutional commitment
    to teaching coding and CT to young children is strongly recommended, besides integration
    into early childhood curricula and policies (Relkin & Bers, 2021).


