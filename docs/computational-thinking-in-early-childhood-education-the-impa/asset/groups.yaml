    # Table 4


    Typology of debugging effectiveness.


    Qualitative characteristics of debugging effectiveness (Variable 5)


    **Incomplete: V5E_NoDebug_ProgramError**

    Error in coding: The child does not identify it, and thus no debugging occurs.

    **Semi-complete: V5E_Debugging_NotEffective**

    Unsuccessful debugging: the algorithmic design does not resolve the problem.

    **Complete: V5E_Debugging_Effective**

    Successful debugging: the algorithmic design resolves the problem.

    **No debugging: V5E_Debugging_NotAtAll**

    Successful coding; the algorithmic design resolves the problem. Also, it is applied
    for children who used the programming strategy ‘step-by-step’.


    # Table 5


    Typology of debugging strategies.


    Qualitative characteristics of debugging strategies (Variable 6)


    **Incomplete: V6E_DebStr_CardsDebug**

    Assigned when a child verbally developed the algorithmic design, but when writing
    the program by ‘pseudocode’, realised that it eventually needs to be differentiated
    from the verbalisation and proceeded to recode.

    **Semi-complete: V6E_DebStr_VerbalDebug**

    Assigned when a child verbally articulated the debugging but did not code and
    execute a new program to correct the error and retest it.

    **Complete: V6E_DebStr_DifferentProgram**

    Assigned when a child coded a new program to correct an error

    **No debugging: V6E_DebStr_None**

    There was no error in the coding and execution of the program, and even if there
    was an error, the subject did not identify it or locate the error to debug.


    which no literature is provided to report. What is essential for all categories
    is that the specific cognitive processes consist of elaborations which in turn
    lead to the construction of procedural knowledge, i.e., how a programmer can complete
    a debugging process (Komis, 2005). The qualitative characteristics of the variable
    are contained in the table (Table 5).


    As seen from the quantitative data of variable V6, two are the most prevalent
    of the four categories under study. In particular, the category of children of
    programmers with completed programming profiles includes more than two-thirds
    of the sample (394 out of 526 children, f = 394, rf = 74.9); consequently, this
    number of children is not driven by debugging procedures. The next category with
    a significant frequency consists of 110 out of 526 children (f=110, rf=20.91)
    and involves implementing the new program strategy to complete debugging. Subsequently,
    the remaining two categories show minimal distributions and thus do not constitute
    significant findings. Thus, 15 out of 526 children (f=15, rf=2.85) proceed only
    to verbal debugging and 7 out of 526 children (f=7, rf=1,33) proceed to use the
    ‘pseudocode’.


    # 5. Discussion


    This study provides empirical evidence from a large-scale study that teaching
    preschool students (ages 4–6) to code through the tangible robot Bee-Bot can accelerate
    the acquisition of one of CT’s practices, such as debugging. The current study
    uses developmentally appropriate educational intervention and is the first to
    document and report on typologies of debugging behaviours linked to syntactic
    and semantic knowledge. Our research demonstrates the debugging behaviours young
    preliterate children exhibit while processing programming without having prior
    experience but trying to understand if a program is fixable (Papert, 1993, p.
    23) when programming the tangible robot Bee-Bot and what processes are emerging
    in order to identify, locate and correct errors. The children were not aware of
    what steps a debugging process consists of, nor were they taught so. Thus we may
    suggest that children were led to debug intuitively and as a result of their logical
    process to make their program fixable to fulfil their algorithm and solve the
    problem. Although Cuneo (1986) suggested otherwise in a graphic-programming environment,
    in our study, the children managed to debug their incorrect programs even though
    they were not meant to do so, and those programs were more complex than three
    commands. However, most proba-


    bly, tangible programming facilitated and supported this process. In this programming
    context, we applied Klahr’s framework for assessing debugging abilities and describing
    strategy aspects to provide indicators of stages of the debugging process matched
    to preschoolers’ development of CT. The types of errors are categorised in syntactic
    and semantic knowledge, and the individual strategies children develop when they
    recognise the existence of an error are highlighted. We have shown how ‘step-by-step’
    control allowed children to better articulate and pinpoint errors in the program,
    as suggested by Sipitakiat and Nusen (2012). We designed the ‘step-by-step’ function
    to allow children to slow down the execution process and have more time to observe
    and compare the code simultaneously during the robot’s execution. Without this
    function, children had to choose whether to pay attention to the floor robot or
    the ‘pseudocode’ set in a program. The former was usually the case, which often
    made it difficult, especially for children aged 4–5, to associate the observed
    problem with the bug in the program. On the other hand, when using the ‘step-by-step’
    function, students pushed the execution button to run one command at a time, so
    they minimised error risk-taking and articulated the algorithmic design to resolve
    a problem at their own pace.


    # 5.1. Identification of an error and reflective process


    Firstly, regarding the research question about the process children follow to
    identify the existence of error and locate it, we gather evidence from Variable
    1. As shown, most children debugged the same program more than once but up to
    two times. The same evidence is shared by Gould and Drongowski (1974), so we can
    suggest that it is common for this age group to attempt two tries for debugging.


    # 5.2. Types of errors


    Regarding the research question for the types of errors that emerged when coding
    it, an interesting finding is the presence of the two main types of errors: i)
    syntax and ii) semantic/logical. The former type records most children exhibiting
    a complete programming behaviour, in which syntactic errors are absent. However,
    a small proportion of children exhibit semi-complete syntactic knowledge; possibly
    this relates to difficulty building the memory command’s position and perhaps
    its function. It would be helpful for future reference to relate this finding'
  - "[PAGE 11]\n\nto the relative age group and cognitive development. The latter\
    \ type of error is the predominant category of semantic/logical errors belonging\
    \ to the high-level cognitive process. It found that this type was likely more\
    \ complex for children to build. The qualitative data analysis shows that the\
    \ semantic errors relate to a misunderstanding of the location or numbering of\
    \ the commands.\n\nIn contrast, the logical errors relate to the missing programmable\
    \ robot’s control commands. The number of errors in a program ranges from one\
    \ (1) to three (3); for debugging them, novice programmers end up with appropriate\
    \ strategies. Each child appeared to identify one error for each program debugging\
    \ attempt. Most children show to form semantic knowledge, so we attribute them\
    \ a well-organised and consolidated programming behaviour.\n\nThe number of children\
    \ presented with the highest semantic/logical errors distribution was divided\
    \ into the categories ’Semantic/Logical Error_TurnOriDir’ and ’Semantic/Logical\
    \ Error_NumDir’. This number of children had difficulty selecting a combination\
    \ of two (2) commands (orientation and direction) in structural parts of a program.\
    \ Evidence suggests that children tended to delete more commands than needed or\
    \ even compose a new program to fix the error (Misirli & Komis, 2020). This evidence\
    \ suggests the error was either made by their difficulty in spatial reasoning\
    \ or an error in counting (Shumway et al., 2021), even though the scenarios proved\
    \ effective in constructing spatial reasoning (Misirli et al., 2019). Thus, this\
    \ semantic/logical error type seems to be the most difficult for novice programmers.\n\
    \nAdditionally, we have not observed \"initialisation bugs\" taking place in the\
    \ physical, tangible domain where they represent failures to re-set the robot\
    \ itself on the proper trajectory (Silvis et al., 2021). That would be causing\
    \ semantic/logical errors as the scenario-based pedagogical design had predicted\
    \ this kind of device complexity and anticipated adequate activities. Overall,\
    \ bugs in the programs most often involved turn errors and missing codes (Silvis\
    \ et al., 2021), but not those involved controller errors.\n\n# 5.3. Strategies\
    \ of debugging and types of knowledge\n\nFurthermore, regarding the strategies\
    \ developed by novice programmers to debug effectively, children having already\
    \ represented a program on ‘pseudocode’ might have been helped to move the debugging\
    \ process without an effective result. As Ahn et al. (2021) suggest, the learning\
    \ experience in varied forms (plugged and unplugged) that lead to experiential\
    \ and meaningful learning can increase accessibility to programming education.\n\
    \nAs shown in our study, half of the children implemented the debugging strategy\
    \ by composing a ’new program’ to complete their debugging process. A ’new program’\
    \ is a twofold process of identifying and correcting an error in the original\
    \ code or writing a new code by scratch to accomplish their algorithmic design.\n\
    \nFrom the above, we conclude that in Phase 3–5, the preschool children have already\
    \ represented a program since it was a prerequisite of the teaching intervention,\
    \ moving some of them to the debugging process without being led to an effective\
    \ process. As it is shown, half of the children in the sample design and compose\
    \ successful programs in solving an algorithm. However, a significant number still\
    \ present difficulties in syntactic and semantic knowledge, made to identify some\
    \ of the errors they present (syntax and semantic/logical) and are led to appropriate\
    \ correction and modification of the program. Nevertheless, a significant number\
    \ of children continue to show syntactic knowledge difficulties. It might be the\
    \ programming environment of tangible robotics that may not be adequate for consolidating\
    \ syntactic knowledge. However, the graphical programming such as Scratch, prevents\
    \ syntax errors as students can drag and drop the code to build programs without\
    \ making syntax errors (Resnick et al., 2009; Maloney et al., 2010; Qian & Lehmann,\
    \ 2017), and also is reported that can help novices build a better understanding\
    \ of some programming concepts (Weintrop & Wilensky, 2018; Chou, 2019). It would\
    \ be interesting to examine the development of syntactic knowledge in a graphical\
    \ programming environment such as Scratch using our scenarios for teaching and\
    \ compare results to the PTD curriculum and children’s lower scores in debugging\
    \ (Pugnali et al., 2017), as in both teaching frameworks the sole focus was not\
    \ on debugging. Furthermore, this study shed light to the importance of teachers’\
    \ well-designed professional development that needs to focus explicitly on how\
    \ to use tangible robots and develop programming skills to promote computational\
    \ thinking whilst providing a developmentally appropriate pedagogical design on\
    \ planning to teach as suggested by Chalmers (2018).\n\n# 6. Limitations and future\
    \ research directions\n\nThis study was conducted in public schools during their\
    \ regular school timetable. We were aware that no matter how dedicated teachers\
    \ might be and successfully teach these contents in their classroom, they had\
    \ different teaching styles and approaches, although we had tested all scenarios\
    \ before delivering the professional development in robotics education. Thus,\
    \ as with any study in a school setting, we acknowledge that this study faced\
    \ several environmental limitations. Even though each participating teacher taught\
    \ the same scenario, controlling all factors from different school settings was\
    \ not feasible; this may have influenced the results. For example, absences for\
    \ each child were not recorded, which might be one factor that influenced some\
    \ children to develop segmented programming skills. In addition, while some teachers\
    \ followed a more constructivist approach in their teaching, as was implied in\
    \ the scenarios, others more likely followed a teacher-led mode of implementation.\n\
    \nFurthermore, another element to examine is follow-up cases, even though a small\
    \ number occur, and discuss their programming profiles towards the evolution of\
    \ syntactic and semantic knowledge. That would probably provide great insight\
    \ into debugging or other aspects of CT that might emerge along with differences\
    \ between novices and experienced programmers. Also, investigating pair debugging\
    \ (McCauley et al., 2008) would be another possibility to expand on the findings\
    \ of this study in regards to debugging strategies and their evolution. Further\
    \ analysis would examine a correlation between gender and the two age groups to\
    \ highlight CT skills and abilities that emerge even though they were not initially\
    \ planned. Ideally, a focus group of teachers who participated in this professional\
    \ development would provide more insight into their confidence and subject knowledge\
    \ in CT education with young children (Chalmers, 2018; Wang et al., 2021).\n\n\
    Despite the limitations of the study described in this paper, post-study evaluation\
    \ data collected from the teachers show the success of robotics in education.\
    \ All the teachers mentioned they would participate in this project again. Furthermore,\
    \ most of them purchased robots for their classrooms or borrowed them from us\
    \ to continue teaching programming after the end of the European project. Nevertheless,\
    \ it was not only teachers supporting this positive feedback; post-study evaluation\
    \ data from children drew attention to the success and enthusiasm reported and\
    \ asked for exploring more modalities on the robot like the pause button. Therefore,\
    \ this feedback highlights this process’s widespread pedagogically adequate and\
    \ educational nature.\n\n# 7. Conclusion\n\n> As Bers writes in *Coding as a Playground*:\n\
    > \n> > ’Once children understand how to debug their systems, they start to develop\
    \ common troubleshooting strategies that can be used on a variety of computing\
    \ systems. Learning how to debug is an important skill similar to checking your\
