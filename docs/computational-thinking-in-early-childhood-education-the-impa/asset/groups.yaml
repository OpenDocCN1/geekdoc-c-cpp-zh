    \n## 4.2. 第一阶段：测试和评估程序\n\n观察所有孩子编码时的行为，大多数遵循以下过程：a) 编写程序，b) 执行程序，c) 调试程序，d) 重新测试和评估程序。因此，我们定义了变量1，它记录了孩子编码程序并通过机器人输入和执行程序的次数。尽管一些孩子通过第一次尝试就使用所教的编程策略组合被引导到有效的程序，但变量V1使我们能够检验由于“错误”而进行程序测试和成功完成算法设计的尝试次数。在变量V1中，孩子的努力通过比例尺记录，并创建了以下类别：a)\
    \ 一（01）到二（02）次，b) 三（03）到四（04）次，以及c) 四次以上。基本思想是在一（01）到四（04）次尝试的量表上对类别进行排名，以对两种编程行为进行分类：a)\
    \ 显示编程策略且可能有一次以上尝试的事件，b) 显示错误的事件。显然，在每个类别中，这两种行为都一起出现。正如表1所示，526名儿童中有449名（f =\
    \ 449, rf = 85.36）尝试最多两次来编写和执行程序以完成算法设计。由于这些儿童数量代表样本的显著比例，这意味着以下解释：大量儿童：a) 被引导实施相应的编程策略（或策略），或\
    \ b) 相对容易地识别错误，因此被引导到有效的调试。另一方面，这些解释适用于较小比例的儿童，526名中的40名（f=40, rf=7.6），他们花了三到四次尝试。分布显示类似的行为，对于526名中的37名儿童（f=37,\
    \ rf=7.03），他们有更多显著的尝试次数超过四次。\n\n# 图 5. 语法错误和顺序编程结构。\n\n![](img/9a18e486b463cb027ef41704bcf91c4e_8_0.png)\n\
