  mdcn: '

    幼儿的编程活动。采用 Klahr 和 Craver 的框架来分析幼儿的编程行为，并通过常见错误以及他们如何调试这些错误来识别句法知识和语义/逻辑知识的发展。此外，我们针对每种错误类型以及整个调试过程对调试技能进行了类型学分类。使用“伪代码”显然可以作为一种可视化表示程序的媒介，从而帮助初学者程序员退后一步反思他们的编程。使用“伪代码”的儿童逐渐发展出编程技能，从基本的“逐步”策略开始，提升到“自动化”策略。研究结果与调试中高水平思维技能的概念建构相一致。同时，案例研究的数量提供了更可靠的分析背景，而非
    Xu 和 Rajlich（2004）所暗示的低水平能力。


    在本研究中，我们表明，调试作为计算思维的核心实践，可能在学龄前儿童控制实体机器人时出现，而无需像 Nusen 和 Sipitakiat（2011）以及 Sipitakiat
    和 Nusen（2012）所建议的那样使用“逐步”策略或特定的设计方面来教授调试。此外，研究表明，初学者将自我与编码和机器区分开来的能力是编程初学者常见的问题（Pea,
    1986）。还需要对各种实体机器人工具及其带来的挑战和机遇做进一步研究（Wing, 2008）。尽管本研究的发现来自机器人领域，但仍可为研究人员和教育工作者提供儿童调试过程的明确信息，以支持他们的教学，并可应用于其他实体机器人或基于块的编程环境（Bers,
    2018b; Kim et al., 2018; Silvis et al., 2021）。此外，这将有助于我们扩展和改进基于情境设计的分析和概念编程模型（Misirli
    & Komis, 2014; Komis et al. 2017）。


    考虑到调试是计算思维的一个方面，这一研究方向的好处可能包括：调查教师如何调试他人（如学生）编写的代码，并帮助他们调试，同时提供知识以培养一种以过程为导向的教学设计，而非仅基于编程成功或失败结果的教学设计（Chalmers,
    2018; Kim et al., 2018; Relkin & Bers, 2021; Silvis et al., 2021）。最重要的是，强烈建议机构承诺向幼儿教授编码和计算思维，并将其纳入幼儿课程和政策（Relkin
    & Bers, 2021）。


