    # Computational thinking in early childhood education: The impact of programming
    a tangible robot on developing debugging knowledge


    Anastasia Misirli, Vassilis Komis*


    Department of Educational Sciences and, Early Childhood Education, University
    of Patras, Greece


    # ARTICLE INFO


    +   Keywords:

    +   Computational thinking

    +   Programming

    +   Debugging

    +   Educational robotics

    +   Early childhood education


    # ABSTRACT


    The present study investigates the debugging process of 526 children in preschool
    (4-6 aged) when programming a tangible robot. When a child is involved in programming,
    it is needed to identify and correct errors, or in other words, debug a program.
    Debugging is a high-level thinking skill and is an essential component closely
    related to developing Computational Thinking in early childhood education. Though
    the debugging process is a cognitive function in programming investigated by many
    researchers in recent decades, most studies are conducted either in primary, secondary
    education, or higher education concerning beginners or experts in programming.
    Very few reviews, and some focus on preschool education. Our study set out the
    following objectives: 1) How do children identify the existence of error and locate
    it? 2) What types of errors emerge when coding? 3) What type of error is complex
    for novice programmers? 4) What strategies are developed by novice programmers
    to debug effectively? and 5) What types of knowledge do novice programmers construct
    by debugging the tangible robot Bee-Bot? The study follows an iterative model
    of a design-based research approach. It uses multiple case studies to collect
    qualitative and quantitative data. The programming intervention was implemented
    by 30 educators in their classrooms and was based on a scenario-based teaching
    design. The debugging process was analysed using Klahr & Craven''s framework (1988):
    1) test and evaluate program, 2) identify bug, 3) represent program, 4) locate
    bug and 5) correct bug. The main finding is the construction and development of
    syntactic and semantic knowledge.


    # 1. Introduction


    # 1.1. Computational thinking in early childhood education


    The development of Computational Thinking (CT) is included in computer science
    and, extensively, is combined with educational robotics due to the common goals
    and objectives they share. In recent years, the term CT has been introduced in
    the computer science research community and the computer science teaching community
    by Wing who suggested that CT skills are not only beneficial in computer science
    but also in many other fields as a skill that is as fundamental as being able
    to read, write, and do arithmetic (Wing, 2006). From the emergence of the concept
    to the present day, an extensive literature has been developed which studies the
    development of this term and the context in which it can be developed. The concept
    of CT extends the term ''algorithmic thinking'' closely related to programming
    processes (Wing, 2006). Some years later Guzdial in his viewpoint on Association
    for Computing Machinery (ACM) proposed that CT is the new literacy of the 21st
    century, which drawing methods from diverse disciplines would improve teaching
    computing in higher education (Guzdial, 2008). Furthermore,


    is a fundamental and high-level thinking skill for an evolving modern era since
    it equips children with different levels of thinking and development of deductive
    ability and avoids repetitive, fixed cognitive processes (Wing, 2010). The educational
    benefits of CT involve the generalisation of CT to various contexts outside of
    computer science while strengthening and improving intellectual abilities (Wing,
    2010). Potentially, CT''s context of skills and abilities find application in
    all scientific areas due to the applicability of different problem-solving strategies
    and multiple levels of abstraction depending on the context in which they are
    embedded (Barr & Stephenson, 2011).


    In the US, many organisations working in parallel or exclusively for education
    for the last decade, have published and reported on the aspects of CT and its
    development in education. For example, the International Society for Technology
    in Education (ISTE), advocates that CT is an essential literacy for all students,
    combining four pillars — problem decomposition, pattern recognition, abstraction
    and algorithms. It involves expressing solutions as a series of steps to automate
    a process and is linked to programming and coding because CT is the highest thinking
    order of problem-solving. In 2019, in partnership with the Computer Science Teachers
