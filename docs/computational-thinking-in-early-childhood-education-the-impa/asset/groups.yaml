    ing style. 例如，Kim 等人 (2018) 对教育者在修复其程序时所发展的错误类型和模式以及它们可能如何影响其在基于积木编程中的教学感兴趣。Strawhacker
    等人 (2018) 报告了在教育者表现出课程计划灵活性、对学生需求的响应性、技术内容专业知识以及对培养学生独立思考的关注的情况下，学生的编程成就处于中等至较高水平。为此，Lee
    和 Junoh (2019) 为学前教育中的在职教师提供了适合发展的无实物编码活动，这些活动提供了增强 CT 能力的任务的实用示例，尤其是在算法设计和调试方面。


    然而，Sipitakiat 和 Nusen (2012) 研究了如何将调试纳入有形编程系统，并应用了 Klahr 的调试能力评估框架。他们为所开发的机器人增加了新的设计方面，并提供了线索，帮助儿童更好地理解、定位和解决问题，通过展示逐步控制如何让儿童更好地表达并精确定位程序中的错误。我们遵循了
    Sipitakiat 和 Nusen (2012) 和 Rich 等人 (2019) 的类似步骤，但主要依据的是 Carver 和 Klahr (1986)
    早期提出的为儿童建模调试的具体步骤（Mayer, 1988, p. 33）。因此，我们在研究中采用了 Klahr & Carver 的调试框架，该框架通过五个不同且相互关联的阶段来处理调试（图
    1）：


    - 1. 测试和评估程序

    - 2. 识别错误

    - 3. 表示程序

    - 4. 定位错误

    - 5. 修正错误


    在第一阶段，用户测试程序并通过将程序的初始设计与机器人系统中的性能进行比较来检查。如果在特定机器人系统的行为中观察到设计与性能之间存在差异，则用户应继续进行第
    2-5 阶段。在这种情况下，用户应首先认识到存在错误（bug），然后表示程序以调查错误的可能位置，从而导致检测到错误（bug）并最终纠正它。


    正如 Papert (1993) 所说，“调试过程是理解程序过程的正常部分”（p. 61）。在本研究中，我们确定了新手程序员的调试过程如何与 Klahr 和
    Carver (1988) 提出的故障排除框架相匹配，以及我们如何使用该框架来解释调试。具体而言，我们旨在回答以下问题：


    - 1. 儿童如何识别错误的存在并定位它？

    - 2. 编码时出现哪些类型的错误？

    - 3. 哪种类型的错误对新手程序员来说很复杂？

    - 4. 新手程序员开发了哪些策略来有效调试？

    - 5. 新手程序员通过调试有形机器人 Bee-Bot 构建了哪些类型的知识？


    我们的工作通过展示如何以分类方式分析调试以及调试在培养 CT 能力学习过程中的基本作用，为 CT 和有形编程领域做出了贡献。本研究提供了以发展句法和语义/逻辑知识为重点的调试实践的类型学及其有效性。此外，结果证明了分类的调试策略和行为对于增加学龄前儿童接触编码并更系统地建立对调试过程的理解的重要性。此外，该研究建议教授适合发展的机器人和基于编程的活动，以进一步促进有形编程中计算概念和思维的发展。


    ## 2. 材料和方法


    ### 2.1. 参与者


    本研究的参与者为 526 名来自城市和郊区公立学校以及当地主流学前班的幼儿，平均年龄 5.18 岁（4.3–6.5，SD = 0.4655）。样本包括 256
    名男性、270 名女性，其中 167 名为年幼者（4-5 岁），359 名为年长者（5-6 岁），因为在希腊教育体系中，这两个年龄段在每个班级中是混合的。


    30 名来自主流公立学校的学前教育工作者接受了培训，以在他们的班级中实施机器人和编程，其教学方法基于情境设计，并辅以收集数据的额外研究工具。他们被指示通过按照开放式问题脚本（附录
    1）单独访谈他们来评估儿童的先前和后验心理表征以及机器人和编程的学科知识。这对教育者关于形成性评估的理论知识来说是高度创新的。根据这些报告，儿童对机器人和编程没有先前的知识。尽管这些结果未包含在本文中，我们可以报告算法思维和编程能力的演变。‘仪器和数据收集’部分提供了有关研究设计和所用工具的更多详细信息。


    ### 2.2. 招募


    该研究是 FP7 欧洲项目“Fibonacci 项目-传播基于探究的科学与数学教育（ISBME）”的一部分，该项目旨在为在整个欧盟传播 ISBME 做出贡献。Fibonacci
    项目定义了传播过程，从 12 个参考中心和 24 个孪生中心开始。希腊帕特雷大学教育科学和学前教育系，尤其是科学、数学和信息与通信技术教育的实验室，是 24
    个孪生中心之一，负责培训教育者如何按照探究式方法规划教学。为了实现这一目标，帕特雷大学的孪生中心通过组织一次公开会议建立了其初始教师网络，在会上向学前教师和其他利益相关者介绍了项目的理念和实用性以及实际工作计划。在该活动中，愿意参与教师网络的教育者熟悉了三个不同科学领域的探究式方法：i)
    科学，ii) 数学，和 iii) 信息与通信技术，并被期望通过项目提供的系列专业发展培训和研讨会将其整合到他们的教学实践中。此外，他们在课堂实施阶段得到了研究团队的支持。与此同时，他们反过来通过在会议上分享他们的经验和专业知识，为教师网络的新成员的准备阶段做出了贡献。


    ### 2.3. 专业发展


    教育者参加了由本研究研究人员主讲的三个小时的培训。培训计划分为两部分。在第一部分，教育者熟悉了探究式科学教育原则，重点是机器人和有形编程。编程概念通过数学（空间推理、测量和模式/迭代）来处理，以展示它们如何嵌入国家课程中。此外，这一部分提供了有关机器人工具的初步信息，主要集中在有形机器人
    Bee-Bot 及其在学前教育中教授编程的优势上。在第二部分，教育者参与了与机器人的动手游戏。他们被介绍到学前教育中的情境设计、教学原则和方法论，以及这些如何体现在活动中。教师有机会按照为其课堂规划的方式实施情境，了解如何实施研究工具及其对数据有效性的重要性，作为一个小组分享可能的缺点并共同提出解决方案。此外，教师还获得了情境、评估工具和实施套件（机器人、命令-伪代码卡、垫子、图片和其他额外资源）的纸质副本。培训幻灯片、情境和评估工具也以数字形式提供。教育者通过研究人员在课堂上的面对面协助和角色示范，或电话和会议获得了持续的专业发展和支持。此外，还创建了一个日志来跟踪哪些班级交付了评估以及计划何时完成实施并组织套件分发的轮换。


    ## 3. 程序


    ### 3.1. 仪器和数据收集


    本研究遵循设计研究（DBR）方法，该方法旨在通过研究人员和从业者在现实环境中的合作，基于系统、灵活和迭代的审查、分析、设计、开发和实施来改善教育实践，从而导致设计原则或理论（The
    Design-Based Research Collective, 2003; Wang & Hannafin, 2004）。因此，开发了一个通过三年实施、分析和重新设计的发展性
    DBR 方法的迭代模型。它涉及多次协作迭代（Anderson & Shattuck, 2012）。它使用多个案例研究来收集定性和定量发展数据（Kelly et
    al., 2008），在同一方法论框架内而不做区分。它被认为包含在案例研究方法下（Yin, 2009）。这些方法来自混合研究方法，并涉及三次迭代、研究人员和教育者之间的协作伙伴关系以及对教育过程的隐含影响。因此，正如
    DBR 方法所支持的，本研究应用了定量和定性数据和工具的混合方法（图 2）。应用了并发三角互证方法，该方法“提供定量统计结果，然后是支持或证伪定量结果的定性引语”（Creswell,
    2009）。本研究利用了 Logo 类似的有形机器人 Bee-Bot 和基于情境的设计，包含三个情境（教学序列），遵循教学和适合发展的教学方法标准，通过课程的三个不同学习领域组织编程学习：i)
    空间推理，ii) 测量，iii) 记忆/迭代。不同的研究工具被开发并通过教育情境的不同阶段引入儿童，涉及数据收集和分析技术（图 2）。所有这些工具都是教育者记录和评估学习过程的工具。主要是，所有数据都来自后测访谈，这些访谈是结构化访谈，使用两种不同的工具报告心理表征和学科知识（附录
    1-4）。访谈用于单独评估（先前）和评估（后）儿童心理表征的转变和 CT 技能的巩固。此外，关于调试的数据来自本研究中出现的编程概况的丰富性和范围，因为在实施的情境中没有包含调试过程的教学活动或评估。


    ### 3.2. 情境设计用于教学和学习编程


    在此，我们应该描述什么是情境设计。情境设计用于教学和学习以及有形机器人 Bee-Bot，以发展儿童的 CT 能力（Misirli & Komis, 2014;
    Komis & Misirli, 2015; Komis et al., 2017）。情境设计的概念化基于建构主义教学方法，例如项目式学习、儿童中心学习、问题解决学习环境、协作学习以及支架和反思过程。它包括七个部分：


    - 1. 教学主题的识别

    - 2. 儿童的先前心理表征和学科知识

    - 3. 学习目标

    - 4. 教学活动

    - 5. 人工制品和材料

    - 6. 儿童的后验心理表征和学科知识

    - 7. 文档


    该模型构建了一个基于机器人设计完整教学干预的线性模型，并呈现了不同的规划和实施实例（Misirli & Komis, 2014）。


    特别对于第 4 部分（教学活动），想法是分为两个部分。第一部分活动旨在专注于机器人概念（功能、控制和机器人操作），围绕两种基本编程策略：i) “逐步” 和
    ii) 自动。第一种策略强烈推荐以帮助学生更好地将自己的思维与机器人的实际运动和正在执行的程序同步（Nusen & Sipitakiat, 2011）。我们设计的网格垫支持这种策略，因为每个方格的长度对应于
    Bee-Bot 在一次线性步骤中移动的距离。因此，儿童通过在网格上移动机器人从一个位置到另一个位置，以抽象的方式制定了要构建的程序。第二部分将这些概念整合到活动中，但重点是数学和编程概念（空间推理、测量和记忆/迭代）。此外，材料（15
    厘米方格的网格垫、命令/伪代码卡、主题图片）被开发并以套件形式提供给教育者。然而，使用 Bee-Bot 时，儿童的程序不可见，因为它存储在设备内部。因此，我们引入了命令卡集，它充当“伪代码”（图
    3）。最初，“伪代码”是一份按编号顺序排列的动作书面列表。然而，由于在国家课程中，这个年龄段的儿童没有系统地学习写作，所以


