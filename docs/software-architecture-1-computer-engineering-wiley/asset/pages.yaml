  md: '# 1.7. Conclusion


    In this chapter, we have shown a conceptual comparison framework between the four
    software development paradigms (object-oriented, component-based, agent-oriented
    and service-oriented). The main objective of this chapter is to provide a clear
    specification of the conceptual differences between these paradigms and their
    contribution to the description of software architectures.


    Our analysis is carried out through a *top-down* approach, which focuses first
    on the conceptual aspects of the different paradigms before developing the qualities
    that result from them. Decisions and choices on this comparison framework have
    a common goal to make it as generic as possible and independent of any description
    of software architecture paradigms. Therefore, we endeavor to increase its potential
    for reusability and ability to be applied to other areas of software engineering.


    The proposed framework is based on two dimensions: quantitative and qualitative,
    where product and process represent the quantitative dimension. This dimension
    introduces the concepts defined by each paradigm in the description of a software
    architecture. Meanwhile, the qualitative dimension defines eight properties, which
    group the elements that influence the quality of software architecture.


    Finally, the qualitative dimension allows users to express their own quality factors
    using the eight selected quality criteria. This capacity to customize is provided
    by the notion of qualitative perspective that reflects the expertise of the user.
    In fact, a perspective allows him/her to communicate their understanding of a
    target quality through the way that they exploit and combine these properties.


