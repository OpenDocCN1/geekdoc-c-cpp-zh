    **Figure 2.6.** Overall structure of ProSA-RA2PLA


    In particular, in the last two situations (deriving new reference architectures
    and supporting the building of SPL), as stated before, the use of RAModel is quite
    interesting.


    # **2.6. Examples of reference architectures


    Considering their relevance, it is observed that different domains have already
    understood the need for encapsulating knowledge in reference architectures, with
    the aim of disseminating and reusing this knowledge and standardizing the systems
    as well. Some good examples are AUTomotive Open System Architecture (AUTOSAR)
    [AUT 13], for the automotive domain, and Continua [CON 13] and UniversAAL [UNI
    13], for AAL [BRO 10]. In particular, these architectures have been developed
    by consortia that involve major industrial players (such as manufacturers and
    suppliers) and researchers.


    Besides, platform-oriented architectures, i.e. architectures not related to the
    specific application domain, but to a specific architectural style or technology,'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'have also been proposed and widely used as reference architectures. Some

    good examples are OASIS [OAS 08] and S3 [ARS 07], for software systems

    based on Service-Oriented Architecture (SOA) [PAP 08], and Open Services

    Gateway initiative framework (OSGi) [OSG 13], a set of specifications and a

    layered architecture that define dynamic component systems for Java.


    # 2.7. Future perspectives of reference architectures


    Currently, reference architectures are the focus of attention of academies

    and industries. Important contributions in the area of reference architectures

    can be found; however, it is too early to say that this area is already matured\sand
    consolidated. For the future, on-going research needs to progress and

    consolidate. Furthermore, in this section, we will briefly discuss reference

    architectures in Systems-of-Systems (SoS), SOA, dynamic software

    architectures, Multi-Software Product Line (MSPL or Multi-Product

    Line – MPL) and variability in reference architectures.


    Currently, SoS, a new class of software systems, have arisen and become

    increasingly ubiquitous, larger and more complex. These systems have

    sometimes arise as a result of the integration of various operationally

    independent systems, even developed with different technologies and for

    various platforms. An adequate integration has been increasingly necessary to

    promote the cooperation among these independent systems in order to

    provide more complex functions, which could not be provided by any system

    working separately. There are various systems that can be classified as SoS.

    An example is a medical system that integrates systems for the diagnosis,

    treatment and management of patients [HAT 07]. Examples involving critical

    embedded systems can also be found, such as airport systems [JAM 08],

    automotive [AOY 11], avionics [FAR 10] and robotics [BOW 10]. The main

    characteristics of SoS are [MAI 99] operational/managerial independence of

    ituents of SoS, evolutionary development, emergent behavior and\geographic distribution.
    In this scenario, reference architectures could have an

    essential role to improve the interoperability among constituent systems of an

    SoS. For this, these architectures must establish the external interfaces of

    these constituents, aiming at facilitating the communication and integration

    with others.'
  merge: -1
