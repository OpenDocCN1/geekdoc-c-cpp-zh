  md: 'An ad hoc distinction between the agent-oriented and object-oriented paradigms
    is that:


    +   - the agent-oriented paradigms are more independent than the object-oriented
    paradigms;


    +   - the agent-oriented paradigms are flexible, reactive, proactive and social
    behavior;


    +   - the agent-oriented paradigms have at least one control thread but may have
    more.


    Agent-oriented paradigms can be considered as active objects that encapsulate
    their state and behavior, and they can communicate by exchanging messages. The
    agent-oriented paradigms represent a mechanism of natural abstraction to decompose
    and organize complex systems, just as the object-oriented did before them. An
    agent-oriented paradigm is a system of rational decision-making: we need an agent
    to be able to have reactive and proactive behavior and to be able to perform the
    interweaving of these two types of behavior, if necessary.


    OOPs are generally passive in nature: they need to receive a message before they
    become active. Although object-oriented paradigms encapsulate their state and
    behavior, they do not encapsulate behavioral activation. Thus, any object-oriented
    paradigm can call any other object''s public method. Once the method is called,
    the corresponding actions are performed.


    While this approach is sufficient for small applications in cooperative and well-controlled
    environments, it is not suitable for large, concurrent or competitive environments
    because the entire burden of invocation behavior will be charged to the customer.
    It would be better if the invocation action becomes a process of mutual consent.


    According to these relevant observations, under the control of a single organization,
    software systems must move from one environment toward an open environment in
    which the system contains organisms that compete with each other.


    The object-oriented paradigm fails to provide an adequate set of concepts and
    mechanisms for modeling complex systems. Individual objects have a fine-grained
    behavioral granularity and the invocation method is a'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Object, Component, Agent and Service Paradigms 47


    mechanism too primitive to describe the different types of interactions that may
    occur.


    An approach that is closely linked to that of the object-oriented approach is
    based on software components. The most important factor behind the component systems
    is the ultimate goal of software reuse. Essentially, a component-based model enables
    developers to create and combine software as units of deployment.


    According to the description introduced for the component-based approach, we can
    say that it is a top-down approach to the object-oriented approach; therefore,
    it inherits all the properties of the object-oriented paradigms. The similarities
    between the object-oriented and agent-oriented paradigms are also present between
    the agent-oriented and component-based paradigms.


    However, the components are not autonomous in the sense of the definition of independent
    agents; just as the object-oriented paradigms, the component-based paradigms do
    not have direct notions of responsiveness, pro-activity and social behavior. The
    service-oriented approach is considered an evolution of the component-based approach
    enriched by the principles of dynamicity, discovery and composition. To sketch
    the basic ideas of development, we propose a characterization tree shown in Figure
    1.11.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_60_0.png)


    Figure 1.11. Development of paradigms'
