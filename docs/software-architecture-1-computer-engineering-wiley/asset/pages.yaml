  md: '# Software Architecture for Product Lines 183


    categories. The specification of external and internal variability is essential
    for the activity of designing an architecture for the product line. This specification
    can take two main forms:


    +   - Integrated variability model: it involves extensions of classic notations
    in requirements analysis, such as the UML case [GOM 04, HAL 03].


    +   - Orthogonal variability model (OVM); this specification is seen as a new
    specification in addition to the usual development documents, using an original
    and adapted notation. Some examples include feature models [CZA 00, KAN 90] and
    the orthogonal variability model [POH 05].


    # 5.3.2. Use case with integrated variability


    The product line UML-based software engineering (PLUS) method is an example of
    domain analysis which specifies variability in functional requirements models
    [GOM 04]. This approach defines a set of UML stereotypes to designate the model
    elements that are mandatory, optional or alternative. These notations are first
    used in the use case to categorize the requirements, which is already mentioned.


    In our SongStock example, it is possible to define a set of use cases for different
    products. Some of these will be present in all the domain products. This is the
    case with the functions relative to client management such as registering, updating
    information and changing the password, which will be included in the whole product.
    These cases will be marked by the <kernel> stereotype. Other cases, such as those
    that enable the calculation of taxes or memorization of transactions, are only
    present in some products. They will be identified using the <optional> stereotype.


    Figure 5.3 shows the use cases for the SongStock product line. The figure includes
    requirements present in all the products such as Update client information and
    Change password. The figure also describes optional cases, e.g. Cloud option or
    Cloud tax which will only be available in products authorizing cloud use. Finally,
    there are two alternative use case types: payment with a Credit card and payment
    by Bank transfer. A product can include either of the two alternatives, but not
    both.'
