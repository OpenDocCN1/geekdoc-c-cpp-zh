    # 3.4.2.6. Levels of hierarchy


    Despite the opportunities that the multiview approach offers, it is common that
    the development of a given view of a model is too complex to be implemented directly.
    Also, and in order to control this complexity gradually, it is essential to take
    a hierarchical approach that reveals different levels of understanding in a view.


    We identify four types of levels of hierarchy:


    +   - levels of hierarchy of abstraction;

    - levels of hierarchy of description;

    - conceptual levels of hierarchy;

    - levels of hierarchy of modeling.


    # 3.4.2.6.1. Levels of hierarchy of abstraction


    It is often necessary to describe a view of a model at a number level of abstraction.
    Human experts use this type of approach to address complex problems.


    By defining an appropriate (suitable) level of abstraction for a given application
    phase, we limit the amount of semantic information being considered by relegating
    irrelevant details at a lower level of abstraction.


    The level of abstraction of a view of a model includes:


    +   - the structure of data of the model associated at that level;

    - the tools whose use is specified by the domain expert to stipulate the types
    of reasoning attached to the model considered.


