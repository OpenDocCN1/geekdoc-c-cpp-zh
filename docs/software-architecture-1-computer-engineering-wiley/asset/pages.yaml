    | Component and connector | Communicating-processes | |

    | | Peer-to-peer | |

    | | Client-server | |

    | | Work assignment | |

    | Allocation | Deployment | |

    | | Implementation | |


    **Table 3.1.** Viewtypes, styles and views in V&B approach


    V&B approach offers a three-step guide for the selection of relevant views necessary
    to document the architecture of a system:


    +   1) Produce a list of candidate views: this step is to construct a two-dimensional
    array (row-column). The rows represent the stakeholders that the architect considers
    relevant to the current project and the columns denote grouped views into viewtypes
    and the styles that can be applied. Then, fill in the boxes of the table with
    values describing the level of information required for each stakeholder and each
    style. The level of information can be: $d$ for detailed information, $s$ for
    some detail and $o$ for overview information.


    +   2) Combine the views: this step aims to minimize the number of views obtained
    in step 1 by ignoring the views whose architectural value is covered in other
    views and by combining others. Combining the views will produce a view from other
    views called a combined view; it amounts to combining elements from two or more
    views into one. For example, small'
