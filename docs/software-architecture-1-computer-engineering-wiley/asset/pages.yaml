    They also describe 29 concrete practices, including architecture definition, component
    development, configuration management, market analysis and learning. They show
    how these practices can be combined by businesses following their organization
    and application domain. However, this is a set of good practices rather than a
    complete process or method.


    The SEI suggested a set of methods relative to architecture design, which is summarized
    in Chapter 25 of [BAS 12]. In this book, the authors describe an approach for
    designing software architectures based on service quality scenarios (quality-attribute
    scenarios), i.e. a method for specifying requirements concerning quality attributes
    such as performance, security and availability. The scenarios, as well as the
    functional requirements and technical constraints, are used by software architects
    to select tactics and patterns enabling the architecture of an application to
    be developed. A new chapter in the new edition presents an overview of these ideas
    for designing architectures. It describes the quality attributes relating to variability
    and how to specify them in case of product lines. It also shows some mechanisms
    for implementing variability in an architecture and how to evaluate the architecture
    of a line based on the previous scenarios.


    Other books, sources of information on architecture design and software product
    lines, in particular, are [BOS 00] and [TAY 09]. In the first book, Bosch et al.
    present an approach for the design of software architectures for an application
    and a product family. Several chapters of the book relate to product lines, methods
    of implementing variability using components and objects and the evolution of
    reusable components in product line engineering. In the second book, Taylor et
    al. discuss the concept of a domain as the problem area and specific software
    architectures as the resolution area. This discussion ends with several examples,
    showing different approaches and architecture designs.


    # 5.6.2.1. Pohl, Böckle and Van der Linden


    An organization of useful practices into a set of processes for product line engineering
    is described by Pohl et al. in [POH 05]. The main advantage of this book is that
    it gives a general view of the engineering of a product line.'
