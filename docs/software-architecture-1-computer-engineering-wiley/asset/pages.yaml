    # 4.6. An approach for the implementation of reconfiguration management mechanisms


    In our approach, we follow the principle of separation between the reconfiguration
    and management aspects to ensure that the control mechanisms for application reconfiguration
    are externalized. If the application to reconfigure is designed modularly, its
    reconfiguration will be finer. Reconfiguration of non-modularly designed applications
    is possible, but they will be less specific.


    For an application to be reconfigurable, one or more of its components must be
    adaptive. An adaptable component includes methods for its monitoring and for the
    modification of its behavior. It may involve base-level mechanisms provided by
    the component model (e.g. creation/deletion of components), but it may also involve
    more advanced reconfigurations, based on these mechanisms. In both cases, the
    adaptable components show execution interfaces including these operations, interfaces
    that will be able to be used by a concrete adaptation system. By using these interfaces,
    an adaptation system enact and oversees an application. We call the whole of an
    adaptation-application system, a self-adaptive application.


    We design the adaptation system in a modular way in order to facilitate its specialization
    according to the target application to adapt (see Figure 4.2). We propose two
