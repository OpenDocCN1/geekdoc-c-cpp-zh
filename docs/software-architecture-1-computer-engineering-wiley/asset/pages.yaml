  md: '# 1.4.3.1. Qualitative criteria for comparing development paradigms


    We have identified eight main qualitative criteria that are common to all software
    development paradigms. These criteria have a significant impact on the overall
    quality of the system development process produced as a result:


    +   - Explicit architecture: capacity of a paradigm to define the clear architectural
    views of an application, to provide the means to identify and explain the functions
    associated with the products that make up the application as well as the processes
    between these products.


    +   - Communication abstraction: capacity of a paradigm to abstract the communication
    between an application’s functions and to learn and understand these communications
    from one tenant so that they can be easily handled.


    +   - Expressive power: is the expressive potency of a paradigm in terms of capacity
    and optionality of creation. It is based on the number of concepts and processes
    provided to specify, develop, develop, handle, implement and execute applications.


    +   - Loosely coupling: is the potential reduction between product-process dependencies.


    +   - Evolution capacity: this is the potential of a paradigm to evolve its products
    and processes. It is based on analysis and judgment value considered on the different
    processes that support these evolutions and their targets.


    +   - Owner’s responsibility: this corresponds to the assignment of responsibilities
    between suppliers and consumers. These responsibilities focus on the reused software
    entities in terms of development, Quality of Service, maintenance, deployment,
    execution and management. This distribution reflects the degree of freedom granted
    to consumers by the supplier.


    +   - Concurrency: in resource-intensive applications that have a demanding need
    for computational power, concurrency is also highlighted by the recent progress
    on the hardware side, such as the introduction of multi-core processors and graphic
    cards with parallel processing capabilities. The main challenges of the competition
    are to preserve consistency and to prevent against deadlock and dependent behaviour.'
