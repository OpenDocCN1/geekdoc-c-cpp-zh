  md: '# 3.4.2.2. Metamodeling


    The term “meta” is of Greek origin and means “succession, transformation, change.”
    In scientific neologisms (metanguage and mathematical), meta means that which
    exceeds and includes (an object of thought, science) (Robert Dictionary). Nowadays
    this term is broken down endlessly: “a meta person says when he talks about what
    he someone else said” [PIT 90]. In computing, the term metamknowledge refers to
    knowledge about knowledge, for instance a metamodel representing a model.


    In our context, metamodeling is an act of modeling applied to a model. It is a
    question of developing a model by itself or of using a model to explain or develop
    another model. This act of modeling can also aim to document a model or to bear
    all or part of its lifecycle.


    Metamodeling can also help a model to self-represent and therefore, in this case,
    it is reflexive modeling.


    # 3.4.2.3. Model


    A model is a simplified and abstract representation of the structure and behavior
    of a system with a view to provide a line of reasoning related to the system considered.


    A model plays the role of interface between a system and a user. No model should
    be separated from its modeler: it can provide a line of reasoning to the system
    considered and to the objectives of the modeler, but it cannot be used in another
    context. It is important to develop models describing their essential properties
    and ignoring properties that the modeler, based on expected results, judge minor.
    Any model must contain all the important aspects of the system studied while,
    at the same time, respecting the principle of simplicity. A model must be able
    to take into account the evolution of the system studied.


    For instance, we may associate one or more models to software architecture, as
    a system, such as a conceptual model (or architecture) and a model of execution.'
