  md: 'The concept of orthogonal models for variability is introduced in this book.

    Chapter 6 is mostly devoted to the concept of architecture, its use and the elements
    enabling it to be described. The coupling of an architecture with variability
    defines the reference architecture of the product line. Chapter 11 deals with
    the key mechanisms for integrating variability in the reference architecture.
    It also provides a previous indication of how to evaluate the qualities of an
    architecture – it must be flexible, evolvable and maintainable. Finally, Chapter
    16 gives some indication of how to derive a concrete architecture for a product
    from the variability resolution in the reference architecture.


    # 5.6.2.2. The AMPLE project


    The collectively-produced work [RAS 11] is a summary of the results of the European
    AMPLE project¹³, dedicated to advanced aspects of product lines. This book presents
    several chapters on variability analysis, evaluating a product line, traceability
    and two approaches for implementing a product line. This book also presents some
    example examples and support tools. Chapter 5 provides a precise method for evaluating
    an architecture for product lines. The two approaches presented in this book (TENTE
    and Aspect Oriented Product Line Engineering (MAPLE)) use the model engineering
    and aspect programming techniques intensively. The TENTE approach privileges automatic
    derivation of products from the features model, but requires usage of an advanced
    programming language integrating a feature-oriented programming concept. Concerning
    MAPLE, it relies on more classic technologies in the modern business. Variability
    is managed at different levels with models and model transformations. With regard
    to variability management in architectures, a VML description is available in
    Chapter 4, accompanied by examples of architectures using VML4Arch. This language
    is dedicated to reference architecture modeling and enables architectural elements
    (components, interfaces and connectors) to be identified and the actions of compositions
    and transformations to be realized.


