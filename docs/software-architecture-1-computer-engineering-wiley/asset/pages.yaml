    # 1.4.1.5. Summary of conceptual differences


    We have shown our conceptual framework for comparison between the four paradigms.
    The first purpose is to complete the continuing lack of coverage in the literature
    about the clear specification of the conceptual differences between object-oriented,
    component-based, agent-oriented and service-oriented paradigms.


    We therefore chose a top-down approach, which focuses first, on the conceptual
    aspects of the different paradigms before developing qualities, which are derived
    from them.


    # 1.4.2. Quantitative dimension


    Structural elements and mechanisms, which characterize the four paradigms, can
    be classified into two categories: products and processes.'
