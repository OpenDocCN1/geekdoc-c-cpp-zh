- img_proc: true
  md: 'architecture, in particular by taking into consideration different dimensions
    of the line. In [DOB 08], the authors suggest a consistent and integrated development
    strategy for embedded systems, which places the concept of architecture at the
    center of the process. The proposed method uses three points of view for the architecture:
    a reference architecture, a domain architecture and a product architecture. The
    reference architecture describes the architecture common to all the products,
    i.e. the common components and services. The domain architecture integrates the
    variability of products and the final view displays the concrete architecture
    of a product. This vision is based on practical testing, especially an example
    of software for the assessment of an X-ray spectrometer.


    There is some controversy on the subject of differences between the concepts of
    reference architecture and PLA for a product line [NAK 11a]. In both cases, we
    dealt with or application of the concrete architecture of the products in a line.
    Most authors do not find any real difference between the two; however, some authors
    see differences in the abstraction level, domain type, content or application
    of these two concepts [GAL 11]. Approaches as DSSA [ALM 07] and AMPLE [RAS 11]
    favor the use of the term “reference architecture”. Other authors consider a reference
    architecture to be different from a product line architecture [GAL 11, NAK 11a,
    TAY 09]. Nakagawa et al., for example, have proposed a model and method for specifying
    a reference architecture based on patterns and aspects [GUE 11, NAK 12], and a
    specific approach for specifying the architecture of the line [NAK 11b]. They
    posited that the reference architecture is centered around documenting patterns
    and examples for the design of a domain application and it must be a knowledge
    base for choosing patterns for product design, but it is not necessarily an architecture
    shared by the whole product. They also posted that the product line architecture
    can be designed using one or more reference architectures. For example, the architecture
    for a software product line embedded in an automotive system uses architectural
    patterns and elements that we find in the reference architectures for Service
    Oriented Architecture (SOA) services and in AUTomotive Open System ARarchitecture
    (AUTOSAR).'
