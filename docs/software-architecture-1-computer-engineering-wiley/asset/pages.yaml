  md: '# 1.4.2.2. Comparison between paradigms


    # 1.4.2.2.1. Product


    Single architectural elements


    The single architectural elements of the object-oriented paradigms are the class
    at design-time and the instance (object) at runtime. The same distinction is made
    for the CBSE between component type and connector type products [AMI 09, GAR 97]
    and their component and connector instances.


    Connectors [CRN 11] are mediators in connections between components, i.e. they
    are used as intermediaries between these constituent components. They have a twofold
    function: (1) enabling indirect compositions between components and (2) the introduction
    of additional functions through the glue code, which they encapsulate.


    In AOSE, we describe an entity that is capable of acting in an environment that
    can communicate directly with other agents as a "single agent"; it has its own
    resources and skills and provides services to its environment. The concept of
    the single agent is used interchangeably in the design-time and runtime phases.


