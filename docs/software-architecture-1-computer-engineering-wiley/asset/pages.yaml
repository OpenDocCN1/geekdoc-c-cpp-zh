    coordinating the decisions of adaptation managers. In particular, the negotiation
    of adaptation strategies enables distributed and parallel decision-making, the
    automatic resolution of conflicts between them, and the guarantee of their autonomy.
    Regarding the reconfiguration execution, our approach enables various plans for
    different types of modification to be parameterized and run, and a variety of
    actions to be included according to the strategy to be adopted. Furthermore, it
    makes it possible to coordinate the parallel and distributed executions of several
    adaptation plans. The definition of a factory and the policy-oriented approach
    facilitate the construction of adaptation systems. Nonetheless, the role of the
    adaptation expert is fundamental, especially specializing the behavior of adaptation
    managers with policies ensuring functioning of the global system. The generic
    nature of our approach makes it applicable to several distributed software families.


    Our contributions (sections 4.6 and 4.7) constitute a response to some problems
    identified in the first part of this chapter. However, several pathways are open
    to exploration, whether for broadening the prospects of our approach or correcting
    its limitations. Automatic verification of the consistency of behaviors chosen
    for different adaptation managers would be interesting. Furthermore, other techniques
    may be foreseeable, such as automatic learning and distributed decision-making
    techniques inspired by voting systems or bidding systems, and adapting the choice
    of them to the context of adaptation systems at the time of their specialization.
    Another research pathway concerns the reliability of the adaptation system. Indeed,
    the probability of a partial malfunction of the adaptation system or interconnection
    network cannot be overlooked in some distributed environments. The objective is
    thus to ensure the continuity of services offered by the reconfiguration processes
    and to avoid inconsistencies in the application due to these failures.


