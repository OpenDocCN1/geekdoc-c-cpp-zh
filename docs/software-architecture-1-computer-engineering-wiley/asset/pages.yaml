  md: 'design. For this, ProSA-RA2PLA has as its main input existing references architectures
    and these architectures are specialized to the product line architecture of an
    SPL.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_86_0.png)


    **Figure 2.5.** Application context of ProSA-RA


    Basically, when using ProSA-RA2PLA, one or more reference architectures are first
    identified and selected. As they reflect, perhaps, the best design principles
    in the overall domain and include the respective design rationale, they are used
    as the starting point for the iterative product line architecture design process.
    ProSA-RA2PLA builds the general structure of the product line architecture, based
    on the main, higher level structure of the reference architectures. Then, this
    process selects and prioritizes the elements contained in the reference architectures
    and uses these elements, together with other pertinent artifacts in the SPLE,
    to iteratively refine the structure of the PLA and to build the variability model.
    The commonality and, especially, the variability are refined and modeled, with
    adequate decision. The idea is that reference architectures are concretized and
    enhanced to support the predicted variability in the family of systems in a suitable
    manner. ProSA-RA2PLA uses a top-down, iterative approach of planning,'
