- img_proc: true
  md: 'modification), they introduce mismatch patterns for service interface and business
    protocol mismatches. The proposed mismatch patterns include adaptation templates
    that can be initiated by developers to generate adapters for resolving the associated
    mismatches.


    Benatallah al. [BAN 05] present a methodology for developing adapters based on
    mismatch patterns, which are used to reconcile the possible differences between
    collaborative services. The proposed approach provides the adapter templates specified
    in BPEL code for each mismatch scenario. Indeed, they characterize different kinds
    of adapter templates as a solution to resolve the associated mismatch that is
    identified among partner services. The reuse of these adapter templates help the
    developers to synthesize their stand-alone adapters.


    Hung et al. [LIN 11] present an adaptation approach for synchronous service interaction.
    This approach only analyzes the mismatches at business protocol levels using the
    service interface is resolved. The proposed framework represents Web services
    in the form of Interface Automata for Web Automata (IA4WS) which is a customized
    model from Interface Automata [ALF 01]. The approach applies the idea of one-session
    service to avoid the unwanted traces by unbounded messages (i.e. which may modify
    the required functionality of services). The proposed adaptation approach includes
    (1) evaluating the interface level compatibility of services, (2) applying the
    model-checking tool SPIN to analyze the business protocol compatibility, (3) analyzing
    the need for adapter generation and (4) applying a pushdown model-checking for
    verification of adapter in terms of two specifications: fairness property of looped
    transition (unbounded messages) and fairness property of branching transitions.


    A pushdown automaton, namely interface pushdown system (IPS), represents the adapter
    model. Within the IPS adapter, there are three kinds of transitions: push transition
    for messages reception, pop transition for message delivery and internal transition
    that is not related to message exchange. The adapter model never creates a message
    by itself. Also, applying the model-checking technique for the verification of
    an adapter during its generation saves more time and money compared with the cases
    where service adaptation and verification are performed separately.


    Tan et al. [TAN 09] present an automatic approach to service composition, formally
    checking the compatibility of two collaborative'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'services respecting the asynchronous semantics. They also propose an adapter
    generation algorithm, if two services are partially compatible. The partial compatibility
    implies that two services are functionally compatible, but due to incompatibility
    in their interfaces or business protocols, direct composition is not possible.


    The proposed adaptation approach applies a state-space method where the concept
    of communication reachability graph (CRG) arises, which concurrently constructs
    the reachability graph of two collaborative services using data mapping. The CRG
    is then verified to evaluate whether the adapter generation is necessary. The
    CRGs are used as a reduced state-space of the composite service. The authors discuss
    the incompatibility in the level of service interfaces. If the direct composition
    between interfaces is not possible, a request for data mapping is delivered to
    build the CRG to verify the adapter generation. The data mapping defines the rules
    as `<src, target, trans-flag>` to relate (syntactically and semantically equivalent)
    elements of two messages that are from interfaces belonging to different services.
    For a direct map from `src` to `target`, the `trans_flag` Boolean variable is
    set to be false and otherwise is set to be true for additional transformation.
    In this approach, BPEL services are transformed into colored Petri nets.


    Mateescu et al. [MAT 08] propose an adaptation technique that reduces the computational
    complexity of adapter generation using on-the-fly exploration and reduction technique
    (i.e. avoids full state-space generation of adapter structure). The adaptation
    method covers both interface and behavioral mismatches of services. In this approach,
    the service interface is modeled by the WSDL and its protocol is represented by
    means of symbolic transition systems (STS).


    The proposed approach takes the parameters coming with a message into consideration
    in the interface matching. The adaptation approach first constructs the adaptation
    contracts which describe how mismatches can be resolved. The service interfaces
    and their adaptation contracts (interaction constraints specifications) are then
    encoded. Accordingly, the LOTOS code is generated. The LOTOS encoding allows the
    automatic generation of adaptor protocols. Moreover, LOTOS encoding enables the
    adapter verification using model-checking tools.


    In this framework, applying on-the-fly algorithms increases the efficiency of
    the adapter generation. The reduction of the adapter is performed by'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'removing all actions that are not related to the service business protocol
    (e.g. the internal transitions and all interactions with store activity). The
    authors also apply a model-checking tool to verify the generated adapter. The
    verification tool implements two operations: (1) deletes the states eventually
    leading to deadlocks and (2) keeps only the states leading to the transitions
    labeled by a given action (here, Final). The adaptation contracts are built by
    a designer, hence additional adapter verification is required to implement several
    static evaluations for verifying that the adaptation contract is correct. The
    adapter behavior is also modeled in STS.


    Dumas et al. [DOM 06] discuss the service adaptation at service interface level,
    and propose an approach to reconcile mismatches between protocols-incompatible
    interfaces. The authors present a declarative approach for an adapter execution
    rather than using programming language in order to reduce development and maintenance
    cost.


    In this approach, service interface adaptation is achieved via mapping operators
    as flaw, scatter, collapse, burst and hide based on common mismatch patterns.
    Therefore, they propose a visual notation for mapping the interfaces using algebraic
    expression of transformation operators by focusing on behavioral aspects of interfaces.
    The behavioral interfaces are defined in terms of communication action schema
    using the UML activity diagram where agents are named according to the type of
    messages sent or received.


    The deadlock situation (i.e. message ordering constraint in interface) is verified
    by defining the condition on interface mapping expression, i.e.: it is not possible
    to send or receive the information that is dependent on other information that
    we have not sent or received. The service mediation engine is also modeled by
    the FSM for an abstract representation of behavioral interfaces. The interface
    mappings are implemented in the mediation engine based on the logic of transformation
    operators. The mediation engine comprises an administrative console to monitor
    the histories of all actions carried out by the engine. Besides, the mediation
    engine can store an unbounded number of messages.


    Nezhad et al. [NEZ 10] propose a semi-automatic adaptation approach for service
    interface matching by taking the protocol specifications into consideration. In
    terms of interface matching, the authors introduce a method to identify a type
    of split/merge mismatch, where some elements of'
