  md: '# Chapter 4


    # Software Architecture and Tools:

    Distributed and Coordinated Dynamic

    Reconfiguration Management


    Dynamic reconfiguration allows an application to be modified during runtime, depending
    on the constraint variation of its environment and the variation in the requirements
    of its users. Many works have proposed methods and mechanisms for adapting a centralized
    application. The case of distributed applications, however, has barely been addressed.
    In particular, the distribution of an adaptation system is very rarely contemplated.
    Moreover, when a decentralized and complex application runs in heterogeneous environments,
    distribution of reconfiguration management mechanisms is required to improve their
    quality parameters, especially efficiency, robustness and evolvability.


    In this chapter, we propose an approach that aims to define a component-based
    software architecture allowing the distributed and coordinated management of dynamic
    reconfiguration. We define an architectural model of adaptation systems, which
    allow variability of system configurations and which include mechanisms capable
    of specialization to ensure coordination. We have chosen replicated data management
    to illustrate distributed and coordinated adaptation. We present the principles
    of'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'implementing a tool for the construction of distributed adaptation systems.

    Using this tool, we present the results of distributed adaptation experiments
    on a data replication system in the medical field for the care of a patient at
    home. The application developed by the tool is made context-sensitive and capable
    of dynamically reconfiguring itself to offer optimum quality service to users.


    # 4.1. Introduction


    Distributed systems are run very frequently in fluctuating environments, such
    as mobile environments, machine clusters and grid processors. They must continue
    to be run in all the conditions and to offer good-quality services. Reconfiguration
    tasks can often lead to procedures that are time-consuming and costly in term
    of human effort to accommodate changes. Therefore, it is necessary to facilitate
    these tasks and define solutions for automating them. In this context, the dynamic
    reconfiguration paradigm was introduced in several works in order to overcome
    the complexity of systems administration by automating tasks necessary for their
    management, minimize human intervention (LEH 00). In this paradigm, an information
    system is capable of making reconfiguration changes depending on high-level rules,
    and of adapting itself to a change in the runtime context (e.g. availability of
    resources, the type of terminals used and user activity).


    The state of the art on dynamic reconfiguration highlights a diversity of architectures
    and mechanisms in the context of different application fields, technologies and
    concerns. In this chapter, we deal with the concepts and mechanisms for distributed
    systems reconfiguration management and current work in this field. First, we present
    some aspects associated with reconfiguration management and analyze a set of works
    enabling distributed dynamic reconfiguration management. The dynamic reconfiguration
    paradigm was introduced in several works, in order to address the complexity of
    systems administration by automating tasks necessary for their management for
    the purpose of minimizing human intervention. Our first objective is to facilitate
    construction of the adaptation system for this type of application by offering
    tools to cover its lifecycle, from design to runtime. The second objective is
    to provide a dynamic reconfiguration management solution in a distributed and
    coordinated way. We are primarily focused on the architectural aspect of a distributed
    adaptation system, dividing it into'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'elementary functions that identify and separate different concerns. Our main
    contribution is in defining mechanisms for distributing and coordinating dynamic
    reconfiguration management activities. We illustrate these using examples of data
    replication systems adaptation.


    In the rest of this chapter, we introduce some basic reconfiguration concepts.
    We then analyze both centralized and distributed dynamic reconfiguration management
    approaches. In section 4.4, we focus on the specialization possibilities of adoptions
    infrastructures. Then, we present our method and tools for constructing a reconfiguration
    system in section 4.6. Section 4.7 details our software architecture model for
    a distributed and coordinated management of dynamic reconfiguration.


    # 4.2. Context


    In the field of information systems, reconfiguration means a change in the system
    to take into account its runtime environment [LEH 00]. Indeed, the context updates
    constantly throughout the system execution (e.g. lack of resources, network partition,
    etc.) can lead to undesirable consequences for the application behavior like a
    decline in service quality or even a break in service continuity. Thus, dynamic
    reconfiguration presents a suitable solution for resolving problems that are likely
    to appear during the runtime of an application. Among the current definitions,
    [LAD 00] states that reconfigurable software evaluates its own behavior and changes
    it when the evaluation shows that it is not accomplishing what it is intended
    to do, or when better functionality or performance is possible.


    A number of summaries have been produced on reconfigurable systems, to sort and
    collect together current research efforts. A presentation of reconfigurable system
    architectures, their characteristics and the challenges in their implementation
    was given in [SAL 09]. An extensive study of the relations between reconfigurable
    architectures and communication protocols was conducted in [GAZ 10]. It identifies
    the techniques that make possible to attenuate communication service failures.
    [TAY 09] compares reconfiguration techniques used with several architectural styles,
    such as service-oriented architectures and peer-to-peer architectures. This study
    shows the need to pursue the development of new architectural styles and'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 124 Software Architectures 1


    reconfiguration techniques, in order to facilitate the development of reconfigurable
    systems. Moreover, there have been a large number of studies undertaken in the
    field of autonomic computer science [HUE 08, KLE 08]. This type of system is characterized
    by the properties of self-configuration, self-optimization, self-repair and self-protection
    to ensure that human intervention is in the minimum.


    The phases to take place during dynamic reconfiguration were presented by IBM,
    notably [FAR 06] with the Monitor Analyze Plan Execute-Knowledge (MAPE-K) model,
    defined to follow context changes and act consequently. The term “reconfiguration
    process” denotes the execution of all these phases: monitoring, analysis, planning
    and execution. We present the four phases that constitute the reconfiguration
    process below (Figure 4.1):


    +   - The monitoring process collects data on the application and its environment
    and correlates them, provided that they can be analyzed. Data collection is done
    using the interfaces provided by sensors associated with the observable entities.
    These data can include information on resource use, application topology, component
    configuration, etc. Some data are static, whereas change continually during the
    application runtime. The monitoring function correlates and filters information
    until it determines a symptom, which must be analyzed. Several platforms have
    been proposed for data collection and processing [CHE 03, DEY 01, GU 04, KOR 03,
    ROU 08].

    - The analysis process reasons on the symptoms and history of the system and analyzes
    the situation in order to decide when a change must be made. For example, when
    the analysis process finds that the response time of a component no longer responds
    to demands, it can generate a demand for distribution modification.

    - The planning process determines what is changed and the method of achieving
    the modification. It creates or selects a procedure, i.e. a set of actions, to
    make the desired modification. Its role is to order actions correctly, with some
    having to be done before others, e.g. installing a component before establishing
    its links with other application components.

    - The execution process applies the previously established plan of action. These
    actions are completed using interfaces provided by the effectors of elements to
    adapt. An effector finalizes the action and produces the expected effect.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Software Architecture and Tools 125


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_138_0.png)


    Figure 4.1. Cooperating processes for dynamic reconfiguration


    A shared knowledge base contains the data set (history, measures, symptoms, etc.)
    necessary for the execution of processes. In this chapter, we have focused on
    the distribution and coordination of analysis and execution activities. Therefore,
    we chose the works discussed in the following sections, from among those that
    emphasize reconfiguration decision-making and the checking of adaptation actions
    management.


    # 4.3. Dynamic reconfiguration management mechanisms of distributed applications


    Some research works have defined architectures and methods, which serve to provide
    a system of capacities for applying modifications to several entities that it
    compose, and on several network nodes. In this section, we are interested in this
    kind of reconfiguration. We present some current solutions for adapting multiple
    software entities during runtime and discuss their relevance for the reconfiguration
    of distributed applications. We call the software entity responsible for ensuring
    the stages of a reconfiguration process “adaptation manager”. Some approaches
    are based on one adaptation manager, which checks the reconfiguration of the whole
    application [BUI 07, FLO 06, GAR 04, ROS 06]. Other approaches allow'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'reconfiguration management to be divided up between several adaptation managers
    [BRI 09, CHE 01, DOW 04]. We will examine the main characteristics of these two
    types of approaches and how well they fit with the distributed systems.


    # 4.3.1. Centralized dynamic reconfiguration management


    Reconfiguration management is centralized when it is carried out by only one adaptation
    manager, which applies the reconfiguration process. Then, we describe the principle
    of centralized reconfiguration management during the analysis, planning and execution
    phases. An example of current work is detailed for each of these phases.


    # 4.3.1.1. Centralized analysis process


    In several existing reconfiguration architectures, all the decision-making is
    carried out by one adaptation manager [BUI 07, DAV 03, FLO 06, GAR 04].


    The analysis process uses a global view of the application and its environment.
    This global view enables the state of software entities and the characteristics
    of their environment to be evaluated, to determine suitable reconfiguration demands.
    The global view also makes it possible to take into account the dependencies between
    different entities, to keep the consistency of the application following a reconfiguration.
    For example, the choice of algorithm to implement with a reconfigurable entity
    requires knowledge of the algorithms, adopted by the entities that it depends
    on. This is essential for guaranteeing that the behaviors of all these entities
    are compatible with each other.


    Several techniques have been used for decision-making, such as the evaluation
    of rules based on the event-condition-action (ECA) paradigm [DAV 03], the coupling
    of Bayesian and Markov decision models [PAU 98] or the use of utility functions
    [GAR 04].


    Rainbow [GAR 04] represents a good example of an adaptation platform, simultaneously
    taking into account the global state of the application, and the characteristics
    of its runtime environment. Indeed, it relies on two types of models for making
    reconfiguration decisions: the architecture model and the'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Software Architecture and Tools 127


    environment model. The architecture model reflects system runtime states. It is
    in the form of a graph of interacting components. The curves of the graph are
    connectors displaying the interactions between components, which are generally
    realized by the middleware and distribution support. The environment model provides
    contextual information on the system, such as resources used and those available.
    For example, if additional servers are required for the execution of a service,
    the environment model indicates which servers are available. When a better connection
    is required, the environment model provides information on the bandwidth available
    on other communication routes. The analysis process is based on utility functions.


    # 4.3.1.2. Centralized planning process


    When reconfiguration management is centralized, one planner deals with providing
    the adaptation plan apply to a set of application components, in order to achieve
    a new configuration. The planning process uses information concerning these components
    and their runtime environment, to determine the right plan. This information depends
    particularly on the new configuration to be achieved, and it generally includes
    connections between components, the state of runtime services and the availability
    of resources.


    Some solutions have been defined to allow suitable adaptation actions to be selected
    [ZHA 04] or to use the effectors required during the execution of plans proposed
    [YAR 99].


    We detail the example of the approach of Zhang et al. [ZHA 04] because it takes
    into account the coexistence of several dependent components. It is based on the
    analysis of dependencies to determine which software elements are affected by
    the reconfiguration of a component. A dependency relation specifies which components
    are coupled in their functioning, or the number of instances required for a component
    type. An adaptation graph (safe adaptation graph (SAG)) is constructed using this
    information to plan the reconfiguration. This graph displays a sequence of actions
    capable of producing the envisaged adaptation. It depicts the configurations as
    peaks and the adaptation actions as curves. Next, the Dijkstra''s shortest route
    algorithm is applied to the graph to find a possible solution with a minimum load,
    where fixed costs (the length of time for reconfiguration, use of resources, etc.)
    are associated with adaptation actions.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 4.3.1.3. Centralized execution control process


    The execution control process implements the adaptation plan. In a centralized
    adaptation system, the execution of adaptation actions is controlled in a centralized
    way by an entity called “executor” [GAR 02, MOA 99, ORE 99, ROS 06, YAR 99, ZHA
    04]. As many of the application entities are reconfigurable, a group of entities
    can be modified from the same adaptation plan. Adaptation actions are executed
    by the effectors associated with these entities. The execution of actions must
    be coordinated by the executor because several entities are involved. For example,
    if A, an adaptation action, for an entity cannot take place before applying E,
    a set of actions, on other entities, then coordination consists of inserting a
    message into the plan to start the action A, bound for its effector, after the
    reception of message operations indicating that E is finished. Coordination enables
    actions to execute correctly and ensures that the adaptation achieves a consistent
    state at the end of the plan execution.


    Several works have defined protocols for coordinating multiple adaptations and
    achieving a consistent application state. Thus, Appia [ROS 06] defines several
    stages and actions for reconfiguring a system. It is a framework for the composition
    and execution of communication protocols. Each communication channel is implemented
    by one or more protocol stacks on each node. In Appia, it is possible to modify
    protocol parameters (parametric reconfiguration), such as the message transmission
    expiry period. Furthermore, the adaptation manager tests three possible types
    of stack change (structural reconfiguration): replacing one of the protocols in
    one stack with another, adding/removing a single protocol in one stack and replacing
    one stack with an alternative stack. When a change in the protocol composition
    of one or more nodes is required, the adaptation manager tests the reconfiguration,
    due to the coordination with the effectors, called “reconfiguration agents”, run
    on each node. To ensure reconfiguration, the agents carry out a set of tasks:


    +   - making sure that each channel affected by the reconfiguration achieves a
    resting state before the reconfiguration;


    +   - capturing the state that must be injected into the new configuration;


    +   - deploying the new protocol stack;


    +   - injecting the state taken from the previous configuration;'
  merge: -1
  pgno: 141
- img_proc: true
  md: '- coordinating with the agents on other nodes, via the adaptation manager,
    if necessary. Nonetheless, no specification of how this coordination is realized
    is given in Appia.


    # ### 4.3.2. Limitations of the centralized solution for distributed systems


    When reconfiguration management is centralized, the monitoring process offers
    knowledge concerning the global runtime context. This is ensured by periodically
    updating information the state of the environment and the application. However,
    the description model of the application and environment becomes costly to produce
    and update, when the decentralized environment is very large and changeable. In
    such a case, the centralized approach leads to a network overload, to convey the
    information to a central server. Furthermore, to all the nodes is not always possible
    in some environments, e.g. in the case of ad hoc mobile networks.


    Moreover, controlling the reconfiguration of several entities by one adaptation
    manager increases the complexity of analysis and planning processes. Indeed, the
    great number of reconfigurable entities and the fine grain of the reconfiguration
    increase the number of alternative configurations to consider in decision-making.
    Furthermore, the number of context parameters to analyze, decide or plan reconfiguration,
    can be considerable. Consequently, the decision-making risks are unsatisfactory.
    Finally, specialization of analysis and planning processes becomes a complex task.


    For reconfiguration of a distributed system, the adaptation of plans involves
    several geographically distant components. Then, execution control of these actions
    requires remote interactions between the executor and the different component
    effectors. These interactions increase the runtime period and network load.


    In conclusion, approaches based on a centralized reconfiguration management do
    not always provide sufficiently suitable solutions for the distributed systems,
    especially when the environment is strongly changeable and large-sized.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 4.3.3. The stakes of distributed reconfiguration management


    In a distributed approach, the adaptation system is composed of a set of adaptation
    managers. Each manager is responsible for the reconfiguration of one or more software
    entities. This approach resolves some problems with the centralization of reconfiguration
    management. It is possible to operate the various resources and run several distributed
    reconfiguration processes in parallel, which may improve performance. The distribution
    leads to an approach operating the processing locality, and division of the global
    problem into subproblems. In the same circumstances, each adaptation manager oversees
    a subset of entities in a more reduced geographic space (e.g. the same machine).
    Hence, it has a partial view of the runtime context. This partial view is less
    costly to elaborate and update than a global view, in the case of the centralized
    solution. Furthermore, it is possible to place each manager closer to the entities
    that it modifies, with the aim of reducing the cost of communication between the
    executor and effectors during the reconfiguration phase. Finally, reconfiguration
    distribution management offers flexibility in the specialization of reconfiguration
    processes. Indeed, the developer has the option of implementing each adaptation
    manager differently from the others. For example, the first group of managers
    can include an evaluator of specified rules following the ECA paradigm, whereas
    other managers can be based on learning mechanisms for decision-making.


    However, dependencies between the software entities controlled by different adaptation
    managers will have to be taken into account. For this, mechanisms for the coordination
    of analysis, planning and execution activities of different managers must be introduced
    to prevent the occurrence of inconsistent configurations, or service malfunction,
    following a reconfiguration. For example, the adaptation policies used by different
    managers must be composable so that their application ensures the consistency
    of the overall system. Coordination mechanisms constitute an additional cost,
    as far as the reconfiguration process achievement time and resources consumed
    by the adaptation system are concerned. For example, a decision made collectively
    involves several managers late in converging on an ultimate solution, when it
    requires a high number of remote interactions between the managers involved. Furthermore,
    an additional development effort is required to implement the coordination mechanisms.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Software Architecture and Tools 131


    The choice of construction of an adaptation system composed of several cooperating
    adaptation managers results in a compromise, taking these different factors into
    account. Later on, we will give an overview of works that have followed a distributed
    approach to reconfiguration management, by focusing our attention on the coordination
    mechanisms they define. This study aims to analyze the techniques used and determine
    their advantages and disadvantages in terms of flexibility and reusability in
    several fields of application.


    # 4.3.4. Existing coordination mechanisms


    In this section, we focus on the forms of coordination that are possible at the
    level of analysis, planning and execution processes in current works, and we show
    the limitations of the solutions offered.


    # 4.3.4.1. Coordination of distributed analysis processes


    We take distributed analysis to mean a set of actors cooperating, for decision-making,
    concerning the adaptation strategy requested. Hence, some works are focused on
    coordination as a technique allowing several participants to collaborate to choose
    the appropriate strategy.


    Coordination allows organization of the participants in distributed decision-making,
    to determine the adaptation strategy. For example, the Ensemble system [REN 97]
    allows an analysis process to launch another on the layer above, in a layered
    application. This is realized when the initial process is found to be incapable
    of managing the system. In the K-component framework [DOW 04], an analyzer chooses
    to delegate decision-making to another on a neighboring node, when it estimates
    that a better solution could be found.


    On the other hand, coordination also allows a form of cooperation for the resolution
    of conflicts between several adaptation policies. It allows a group of analyzers
