    #  1.6. Summary and discussion


    We recall that our purpose throughout this chapter has been to provide a cross-sectional
    view of the four paradigms, namely OOSE, CBSE, SOSE and AOSE.


    The CBSE and the SOSE have two different points of view on the relationship between
    the customer and the supplier. The SOSE comes from certain functional requirements
    of specific application domains that have specific needs in terms of agility and
    adaptability, the CBSE is defined for a larger purpose. The service- and component-oriented
    paradigms have a very high granularity; however, a service-oriented paradigm is
    generally of higher granularity than a component-based paradigm.'
