  md: '# Object, Component, Agent and Service Paradigms


    # 1.2. History


    Figure 1.1, drawn from [SOM 04], shows the evolution of software engineering.
    We can see the progression from the lines of code in structured programming to
    current trends or approaches such as service-oriented and model-based paradigms¹


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_16_0.png)


    Figure 1.1. Evolution of development paradigms


    # 1.2.1. Object-oriented paradigm


    Object-oriented paradigm (OOP) is a design- and programming-oriented paradigm
    that emerged in the early 1960s and was developed by Alan Kay’s work in the 1970s
    [KAY 93]. It consists of the definition and interaction of software modules called
    objects: an object represents a concept, an idea or any entity in the physical
    world [OUS 99]. It has an internal structure and behavior, and it is to communicate
    with other objects. The aim of OOP, therefore, is to represent these objects and
    their relationships; communication between objects via their inter-relations facilitates
    the implementation of the intended functionalities.


    The Simula-67 language laid the first foundations, i.e. those of object-oriented
    classes: class, polymorphism, inheritance, etc. [COX 91]. It was actually with
    Smalltalk 71, followed by Smalltalk 80 (Dan Ingalls) [GOL 83], inspired largely
    by Simula-67 and Lisp, that the principles of object-oriented programming, based
    on the work of Alan Kay, would be established: object encapsulation, messages,
    typing and polymorphism (via subclassification); other principles, such as inheritance,
    are derived from these or fall within the implementation.


    > 1 In this chapter, we will deliberately ignore the model paradigm as proposed
    by the OMG and focus on the object-oriented, component-based, agent-oriented and
    service-oriented paradigms, which makes space for a sufficiently extensive chapter.'
  merge: -1
