  md: 'documentation, script, etc. In this set, we will also find elements relating
    to savings (estimate of the cost and market requirements), performance (tests)
    or other non-functional aspects. One distinctive feature, however, is the reference
    architecture, which is a particular reusable artifact.


    DEFINITION 5.10.- The production plan is defined as a guide or a set of rules
    for the manufacture of products from a choice of functionalities, from the reference
    architecture and reusable components.


    This plan collects together a set of rules, which will be developed to manage
    the common and variable parts of the products. The principle is to have a part
    of the architecture which represents the part of functionalities common to the
    products and specific rules or mechanisms enabling variability management. Thus,
    a product will be assembled from components representing the common functionalities
    and other components realizing the variable part of the application.


    # 5.3.5. Designing the architecture of the line


    The reference architecture is an important artifact because it describes the assembly
    of reusable elements for defining the product while taking variability into account.
    This architecture is software architecture in the usual sense of the word, enriched
    by mechanisms for realizing variability in the product. This mechanism uses the
    concept of variation points: the location of where a choice of functionality must
    be made. This point of choice is accompanied by possible variants. The resolution
    of variability is the mechanism that, given a choice of functionality, links it
    to a variant.


    Variability is useful at each level of the development cycle and its realization
    uses variation mechanisms. For example, variation mechanisms at the component
    level are the inclusion or exclusion of a component, the selection of a version
    of a component from an interface, the conditional assembly of components, the
    conditional relation between components, etc. At the language level, heritage,
    aggregation, conditional compilation and the use of aspects are some known examples.
    [SVA 05]. For our SongStock product line, we need to choose some variation mechanisms
    to realize the variability identified in the features model.'
