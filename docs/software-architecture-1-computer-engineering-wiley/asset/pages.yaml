    # 1.3.4. Service-oriented architecture


    SOSE is based on the concept of SOA [OAS 08, PAP 07], which defines a conceptual
    framework to organize the construction of application based on services. SOA introduces
    the concepts of service providers and consumers.


    +   – A service provider is the actor responsible for the development, deployment,
    execution and maintenance of the service when it is required. In addition, when
    the service expires the provider takes care of the termination of the service
    activities.


    +   – A service consumer is the actor who uses services according to their needs.


    In the beginning, suppliers and consumers are independent – i.e. the supplier
    during the implementation of its services has no prior knowledge about the future
    consumers, nor how they might reuse that. Thus, the SOA is based on a third actor
    called the service broker [OAS 08].


    The service broker is the actor associated with a service registry that enables
    the relationship between consumers and suppliers who are unaware of each other.
    Suppliers publish their services in these registries, which are then used by consumers
    to identify those that match their needs.'
