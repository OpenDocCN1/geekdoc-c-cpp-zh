    Ardagna et al. [ARD 07] developed a general framework for flexible and adaptive
    execution of managed service-processes. The framework, Processes with Adaptive
    Web Services (PAWS), coherently supports both process design and execution. The
    PAWS provides methods and a toolset to support design-time specification of all
    information required for run-time adaptation of processes according to dynamically
    changing user preferences and non-functional. The authors focus on how PAWS selects
    and adapts candidate services for a composed process.


    In PAWS, both service discovery and service selection are driven by functional
    and non-functional aspects. From a functional perspective, PAWS includes a mediator
    configurator to support setup of the related runtime module — the mediator engine
    (i.e. to translate between the two serviceinterface signatures). If it is not
    possible to automatically derive message transformations, the designer defines
    them during process execution by providing additional information about parameter
    and service mappings. Their proposed mediator engine supports service invocation,
    the dynamic binding of a generic candidate service without requiring stub compilation
    at design time, and the management of service substitution that might involve
    services that are described by different signatures but have the same choreography.


    Whenever the BPEL engine invokes a task, the mediator selects the first service
    from the optimizer’s ranked candidate-services list. If the candidate service’s
    interface differs from the interface that the task definition requires, the mediator
    retrieves the proper mapping document produced by the mediator configurator, and
    then invokes the candidate service by sending transformed messages. The mediator
    manages candidate-service invocation through sessions.'
