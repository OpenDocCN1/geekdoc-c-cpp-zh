    # 3.4.2.5. Views


    On the basis of the fact that a system can be analyzed according to different
    views (from different angles), we can say that a model of a system generally consists
    of a distinct set of views reflecting different aspects during the successive
    stages of a given application. This approach can be compared to how a specialist
    within a certain discipline focuses on a specific problem. The most commonly used
    views, during the modeling phase, are the structural view and the behavioral view.
    However, this not preclude other choices, such as taking into account the physical
    aspect or even the thermal aspect of a system. Thus, the list of views to be established
    is not fixed; quite the contrary, it develops and directly depends on the type
    of problem being studied as well as the scope of the application.


    Models, seen from this angle, are called multiview models.


    It is one of the views commonly used in the process of modeling a system:


    +   - Behavioral views: a behavioral view specifies the behavior and characteristics
    of inputs/outputs of a “black box” system; knowledge of the physical realization
    of this element should not appear in this type.

    - Structural views: by structure we mean the topology of the model.

    - Physical views: a physical view refers to the physical description of a particular
    model, i.e. the geometric aspects (geometric measurements) and components (materials,
    etc.).


