  md: '# 4.7.5. Coordination of reconfiguration processes


    The reconfiguration management distribution results in an autonomy for each adaptation
    manager. These activities consist of making the adaptation decision, determining
    the adaptation plan and controlling the plan execution. However, they cannot be
    performed in isolation in all the adaptation scenarios. Some scenarios require
    coordination of the activities of a group of adaptation managers, when there are
    dependencies between their goals and the adaptation actions that they apply.


    Indeed, each adaptation manager has a restricted view of the application and its
    runtime environment. It lacks knowledge concerning other components, the resources
    that they require, the preferences of users and their services. Consequently,
    different adaptation managers can make conflicting decisions, if each undertakes
    its decision-making individually. For example, an adaptation manager must not
    apply adaptation actions increasing the rate of shared resource use by the entities
    it adapts, by ignoring the resource needs of other entities associated with other
    adaptation managers. Furthermore, an adaptation manager may need to exploit the
    adaptation possibilities of other components, under the control of other managers.
    For example, the change in behavior of a component can considerably improve the
    service quality of an application, if another component also changes its behavior.


    Moreover, the execution control processes of several plans modifying the application
    components in parallel can change the system to a non-consistent state. This arises
    from lack of control of the global application state, during and after adaptation,
    and also from lack of information on the runtime progress of different plans.
    Hence, coordinating the execution of several plans is indispensable when there
    are dependencies between the components that they modify.


    For this, our approach defines mechanisms to:


    +   - ensure the validity and efficiency of adaptation strategies chosen in parallel;


    +   - provide plans that are applicable in parallel, and which include necessary
    processing to coordinate their runtimes;


    +   - coordinate the simultaneous executions of several adaptation plans.'
