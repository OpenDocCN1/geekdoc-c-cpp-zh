  md: '# 5.2.2. The SongStock product line


    The reasons behind an online multimedia product line are variety of media, variety
    of consumer demand, considerable display variability and short waiting times for
    products to be put on the market. The principle of SongStock is to offer product
    software to companies wanting to set a legal online music service. Normally, to
    set up such a business, companies acquire the rights to artists, albums or music
    editors. In our example, we will only consider products for song stores. A product
    in this family will be a web application, enabling information management for
    a virtual song store. The system must be able to show its catalog of albums and
    songs on sale. Each album has its name, genre and graphic display. Stores are
    specialized in the MP3 format and each song includes the following information:
    title, price, length, size and audio quality.


    # 5.2.3. Functional requirements


    Thereafter, we distinguish stakeholders of the final products: the site administrator
    and the client. All SongStock applications must have the following functions:


    +   - Catalog function: the system must offer a song catalog to the user (album
    or name). The catalog is initially empty and the administrator can add albums,
    songs, with the associated information.


    +   - Client function: a user must be able to register with a name and password.
    This information allows the user to access the catalog and buy songs. The system
    must memorize the songs bought.


    +   - The sales function: during shopping, the user has a shopping cart where
    the purchases that he or she wants to be recorded. Individual songs can be added,
    as well collections from albums. The user can remove songs from his or cart, whether
    individual songs or a whole album. Once downloading has started, the system will
    send the invoice to the client in an electronic message. The system must gather
    statistics on the number of copies of the songs and albums sold.


    Some SongStock applications may have the following characteristics:


    +   - Audit: the application tracks carts and invoices generated by the system.
    This information is memorized in text form and will be of assistance in the event
    of an audit.'
