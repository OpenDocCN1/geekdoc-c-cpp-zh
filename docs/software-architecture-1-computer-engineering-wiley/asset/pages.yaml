    # 6.4. Adaptation approaches


    The issue of synthesizing adapters for incompatible services interaction has been
    studied in the area of SOA, as well as in the area of component-based software
    engineering. In the following, we review some of the approaches proposing adapter
    generation methods on service interface or business protocol mismatches and/or
    both of them. Besides, numerous approaches presented techniques of adapter synthesis
    by taking the service behavior incompatibility into consideration in the interface
    matching. All adaptation approaches propose a common logic for an adapter: intercept
    a message sent by a partner service; store it if necessary; transform it to a
    required format supported by the other partner service or generates a new message
    and then send the message to the partner service that needs to receive it. In
    addition, we mention the approaches where the adaptation of Web services is performed
    by changing the participant services.


    Yellin and Strom [YEL 97] present an approach to evaluate the existence of an
    adapter for protocols-incompatible interfaces by applying the execution trace.
    The authors discuss asynchronous and synchronous protocol semantics of components
    collaboration, and propose an automated method of adapter generation based on
    synchronous semantics.


    The adapter protocol is modeled using the FSM consisting of a set of states, a
    typed of memory cells to store the messages received by the adapter and a set
    of state transition rules. The adapter''s behavior is acquired by its transitions
    rules. Each rule describes a transition from one state to another in the adapter
    based on sending or receiving messages, along with a set of memory actions that
    store or retrieve messages in/from the cells. If the adapter is in a state with
    a send transition, the adapter may send a message to the appropriate component
    and enter the target state. If the adapter is in a state with a receive transition,
    the adapter may wait for a message to arrive'
