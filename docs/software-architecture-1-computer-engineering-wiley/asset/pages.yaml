  md: 'These mechanisms are described in the two sections that follow.


    # 4.7.5.1. Coordination of adaptation decision-making


    Coordination of decision-making aims to lead a group of adaptation managers in
    shared decision-making to ensure non-conflicting and complementary decisions.
    Collective decision-making results from the determining of a global strategy.
    We define a global strategy as the set of strategies chosen by the adaptation
    managers during a decision-making process. For example, a global strategy can
    be composed of two complementary strategies, one chosen by an adaptation manager
    associated with the placement service and another associated with the replica
    consistency management service. The former chooses to move to a new algorithm
    that enables the creation of some data replicas on mobile terminals. The latter
    decides to move to an optimistic consistency protocol for these data.


    Decision-making must be relevant to the overall situation and foresee the effect
    of adaptation strategies in order to avoid inconsistent situations. An adaptation
    manager cannot possess enough local information to allow it to choose a suitable
    adaptation strategy. It must choose strategies that allow its maximum number of
    objectives to be satisfied while adhering to the components constraints checked
    by other managers. The main concern of coordinating decision-making must thus
    be ensuring the compatibility of an adaptation strategy with the following constraints:


    +   - maintaining a consistent composition of the application services;

    - guaranteeing the concerns of other application entities in terms of resource
    and service sharing;

    - ensuring good performances by the overall system.


    For this, our approach is based on the principle of making several managers participate
    in the same decision-making process, and taking into account the non-local effects
    of adaptation strategies resulting from local decisions. Hence, the construction
    of a global strategy makes it possible to choose local adaptation strategies in
    such a way that the bad choices are avoided.


