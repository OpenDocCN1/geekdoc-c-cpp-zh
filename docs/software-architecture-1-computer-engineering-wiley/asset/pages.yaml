  md: '# Chapter 1

    Object-Oriented, Component-Based, Agent-Oriented and Service-Oriented Paradigms
    in Software Architectures


    Recent years have seen object-oriented, component-based, agent-oriented and service-oriented
    paradigms coexist and develop in parallel. This has led to the emergence of similar
    or specialist concepts that are often juxtaposed with misinterpretations of vocabulary.
    These misinterpretations are exacerbated by the existence of hybrid approaches
    that borrow elements from the four paradigms. Moreover, modern applications that
    combine these paradigms emphasize this ambient intertwining and the overall understanding
    becomes more difficult.


    The purpose of this chapter is to clarify the boundaries between the paradigms
    by proposing a conceptual framework based on two quantitative and qualitative
    approaches. The principle is to concentrate on differentiation of the conceptual
    aspects that are directly related to the paradigms, as opposed to an approach
    that compares the different technologies for implementing these paradigms. The
    aim is to offer'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Software Architecture 1


    architects a better understanding of the implications and consequences of choosing
    one or the other of these paradigms.


    # 1.1. Introduction


    According to Wikipedia, “A programming paradigm is a fundamental style of computer
    programming that deals with how solutions to problems must be formulated in a
    programming language”. This chapter focuses on four key paradigms in the field
    of software development, namely object-oriented software engineering (OOSE), component-based
    software engineering (CBSE), agent-oriented software engineering (AOSE) and service-oriented
    software engineering (SOSE). These paradigms will be studied and analyzed in light
    of real-world construction approaches of distributed applications.


    A software development paradigm specifies how an information technology (IT) solution
    to a problem must be formulated in accordance with clearly defined concepts and
    mechanisms. It determines the order in to deal with the problem and provides the
    means to develop this order, to follow its principles and implement it in practical
    terms. Thus, a software development paradigm has its own particular style of developing
    IT solutions, in terms of analysis, design and development.


    By nature, a paradigm is independent of function-specific issues; however, it
    can encourage certain types of application in order to support specific qualities.
    However, these qualities are usually associated with specific recurrences. When
    a paradigm is well suited to an implementation issue, it reduces the need for
    a costly integration process and isolated solution tests by using a common conceptual
    framework.


    In this chapter, we propose a conceptual framework based on a top-down approach.
    The principle of a top-down approach is to concentrate on the differentiation
    of conceptual aspects directly related to the paradigms, as opposed to a bottom-up
    approach that examines their technological differences. Our comparison-based conceptual
    framework relies on two approaches: a quantitative approach based on the concepts
    of product and process, and a qualitative approach based on quality criteria that
    organize the characteristics of each paradigm. These approaches will assist in
    clarifying the conceptual and technical misinterpretations of these different
    paradigms.'
  merge: -1
