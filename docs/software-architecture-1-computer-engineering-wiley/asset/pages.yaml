  md: '# 4.7. Architectural model for distributed dynamic reconfiguration management


    Distributed dynamic reconfiguration must be based on a model, methodology and
    tools enabling its design and implementation to be facilitated. For this, we have
    defined an architectural model for developing distributed adaptation systems.
    This model specifies the structure and semantics of a distributed adaptation architecture,
    and it imposes explicit constraints for constructing an adaptation system adhering
    to the architecture. This structuring is a means of breaking the inherent complexity
    of a distributed adaptation system, by dividing it into cooperating and reusable
    elements. Furthermore, the model defines variation points between a family of
    adaptation systems. It is the key element in the development process of an adaptation
    system.


    The main benefit of our model is that it enables the management of the reconfiguration
    in a distributed and coordinated way, as well as expression of the variation points
    between adaptation systems.


    In this section, we present our architectural model for distributing reconfiguration
    management. Next, we extend the model to support the coordination of software
    entity managing adaptation in a distributed way, and we specify techniques for
    coordinating decision-making and the modifications control of an application.
    Finally, we describe the negotiation protocol that we have defined in detail,
    with the aim of ensuring the coordination of adaptation decision-making generated
    by the analysis processes.


    To define our model, we take into consideration the following set of constraints:


    +   - independence with regard to current standards and components models;

    - flexibility and extensibility of the model;

    - modularity of the adaptation management mechanisms;

    - the distributed nature of software to be adapted and the potential heterogeneity
    of their runtime environments.'
