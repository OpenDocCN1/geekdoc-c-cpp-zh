  md: '# Chapter 6


    # Software Architecture: Service Adaptation Techniques in the Context of Web Services

    Composition


    A fundamental challenge in working with heterogeneous and autonomous Web services
    is the need to ensure their interoperability and compatibility. In the context
    of Web service interaction, significant research efforts focusing on the adaptation
    techniques have been made to tackle the services incompatibilities. In this chapter,
    we present an overview of proposed adaptation approaches dealing with service
    mismatches at the level of service functional specifications, i.e. service interface
    and business protocol. Service interface refers to the mismatches between service
    signatures whereas the business protocol concerns dependencies between message
    exchanges.


    # 6.1. Introduction


    With increasing use of platform-language independent software architectures in
    the paradigm of service-oriented architecture (SOA), Web service technology has
    been used to enable dynamic and flexible interoperation of distributed business
    processes within and across organizational boundaries. According to the World
    Wide Web Consortium (W3C), the definition of Web services is as follows: A Web
    service is a'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 212 Software Architecture 1


    software application identified by a URI, whose interfaces and binding are capable
    of being defined, described, and discovered by XML artifacts, and supports direct
    interactions with other software applications using XMLbased messages via Internet-based
    protocols. Web services technologies allow the exchange of XML documents while
    they can be used to implement the interfaces and messages for SOA. To this end,
    SOA provides a general framework for Web service interaction that comprises service
    provider, service broker and service customer. The service provider implements
    his own Web service and publishes its information (i.e. description and functionality)
    to a public service repository. A service broker manages the repository and allows
    the service customer to find an appropriate service for binding to his components.
    The service broker compares the actual Web service model submitted by the customer.
    Then, the service provider and the customer may bind their services and initiate
    interaction.


    Web service technologies include (1) Extensible Markup Language (XML)’ technologies
    like XML Schema, XSLT and QUERY to support the data and content that is exchanged,
    e.g. transformation, process and manipulation; (2) Simple Object Access Protocol
    (SOAP) [BOX 00] which is the protocol for basic exchange of data and documents;
    (3) Web Services Description Language (WSDL) [CHR 01] to describe all details
    about services, messages and endpoints; (4) Universal Description, Discovery and
    Integration (UDDI) [BEL 02] which is the infrastructure required to publish and
    discover services. There are two ways of binding Web services: static binding
    is done at the design time where the service customer acquires information about
    a service directly from the service provider (i.e. through a private channel like
    e-mail) and stores it in a local configuration file; and dynamic binding occurs
    at runtime. When the client application runs, it dynamically locates the service
    using a UDDI registry and then binds it using WSDL and SOAP. This requires that
    the contents of the UDDI registry be trusted. Currently, only private UDDI networks
    can provide such control over the contents.


    The Web service description represents its behavior, capability, quality and interface.
    An instance of a given service corresponds to the execution of its activities.
    These activities are atomic units of work that perform the partial order


