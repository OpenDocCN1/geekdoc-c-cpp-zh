  md: 'Reference Architectures 77


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_90_0.png)


    Figure 2.7. Relationship between reference architecture and MPL


    In a similar scenario, variability has arisen an important concept, since the
    development of a set of similar systems is a very common situation. Therefore,
    this concept has been developing in the context of several research topics, such
    as SPL, self-adaptive systems, configurable interfaces of software components
    and service-based systems with dynamic runtime composition. According to Galster
    et al. [GAL 11], variability is the ability of a software artifact to be adapted
    for a specific context in a preplanned manner. From this perspective, the main
    element that could promote variability is the software architecture; thus, variability
    should be treated as a first-class, crosscutting concern in the software architecture
    [GAL 11]. Therefore, software architectures that were built considering variability
    have certainly many chances of developing successful systems. For instance, in
    the context of SPL, the product line architecture has explicitly considered variabilities
    and variability management has been considered as an essential activity for the
    SPL engineering. Variability management explicitly represents software artifact
    for managing dependencies among SPL variants and supports their instantiations
    throughout the SPL lifecycle [BAB 10]. Besides SPL, variability management is
    also a challenge in the development, maintenance and evolution of software-intensive
    systems.


    Regarding reference architectures, there is not a clear understanding about what
    is variability in such architectures. According to Galster et al. [GAL 11], variability
    in reference architectures is the ability of a software artifact built from such
    architectures to be easily adapted for a specific context in a preplanned manner.
    In spite of the considerable relevance and amount of reference architectures available
    for various application domains and, at the same time, the relevance of the concept
    of variability in software development, in general, reference architecture engineering
    has not specifically concerned itself with variability during the establishment
    of such'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'architectures. Hence, existing reference architectures have been built without
    a special attention to variability and, as a consequence, software systems resulting
    from these architectures could have difficulty in adapting or in evolving to suit
    new contexts. Therefore, it is necessary to think about how reference architectures
    can be better designed, represented and evaluated in order to satisfy the variability
    in systems resulting from them.


    # ## 2.8. Final remarks


    Note that reference architecture *per se* is a relatively new research area. Important
    contributions have been made in the past decade and concentrated mainly in the
    past few years. However, there are several areas, such as avionics, automotive,
    robotics and web systems, that have proposed reference architectures, including
    those with diverse purposes. In general, most of these architectures have been
    designed using *ad hoc* approaches, represented using informal techniques and
    without a previous evaluation.


    Considering the relevance and impact of reference architectures, currently, in
    systems development contributions in four subjects are found: design, representation,
    evaluation and use of reference architectures. There is, however, a lack of work
    dealing specifically with evolution of reference architectures.


    There are also several lines of investigation that need to be developed. The evolution
    of this area is extremely important as software systems, technologies and development
    approaches are constantly changing. Reference architectures must follow these
    new tendencies if they intend to be updated and continue contributing effectively
    to the development of software systems.


