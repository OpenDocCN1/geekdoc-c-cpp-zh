    # 4.7.4. Specialization of reconfiguration mechanisms


    We adopt a policy-oriented approach where the reconfiguration logic is described
    in the form of external policies, dissated from the implementation of services.
    First, policies facilitate the development of the reconfiguration system. By expressing
    the reconfiguration in a high-level language, the developer is not obliged to
    understand every detail of the reconfiguration service implementation during the
    definition, or of given policy. Second, it is easier to analyze the dependencies
    between different aspects of the reconfiguration and to detect the potential conflicts.
    Third, this approach offers the possibility to reuse the same reconfiguration
    services in different contexts by specializing them differently according to the
    application reconfiguration needs. Finally, with the level of uncoupling obtained,
    it is easier to enable the change in the reconfiguration logic during runtime,
    without having to recompile and redeploy the adaptation system.'
