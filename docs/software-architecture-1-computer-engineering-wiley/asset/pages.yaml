    set of concepts that must be considered in the reference architecture. For this,

    four main tasks are performed:


    +   - Identification of the system requirements: functional and non-functional

    requirements of existing or envisioned systems in the application domain

    identified. Such requirements must reflect the processes/activities/tasks

    must be automated by the systems to be built from the reference architecture.

    Techniques traditionally used to describe requirements of software systems,

    as as natural language sentences supplemented with diagrams and tables of

    detailed information, can be used for that.


    +   - Establishment of the reference architecture requirements: based on the

    system requirements, a set of architectural requirements for the reference

    architecture is established. Probably, one or more system requirements will

    be aggregated in an architectural requirement. Note that these architectural

    requirements must be more comprehensive than the system requirements, since

    they describe the requirements, both functional and non-functional, of a set

    systems of a domain and they are related to a reference architecture that is in
    a

    higher abstraction level.


    +   - Identification of the domain concepts: each architectural requirement is

    mapped to a domain concept (i.e. each requirement is associated with a concept

    that addresses it). More than one requirement can be mapped to a unique

    concept. Since ontologies usually embrace all concepts of a given domain, they

    can be used to identify the concepts used in this task. When ontologies are not

    available, knowledge and experience, mainly from domain experts, can be used

    for that. The domain concepts identified in this task will be further used as
    an

    input to the architectural design of the reference architecture.


    Domain experts and system analysts are also directly involved in this step.

    System analysts, supported by domain experts, manage the requirements of the

    systems and the reference architecture, as well as the concepts. In summary,'
