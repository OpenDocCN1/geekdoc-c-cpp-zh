    # 4.5. Summary of the limitations and challenges of dynamic reconfiguration of
    distributed systems


    In practice, software architectures for managing dynamic reconfiguration in a
    distributed and coordinated way are still rudimentary. A limited number of works
    have addressed the problem of coordinating the reconfiguration process in the
    context of distributed systems. Most works in the setting of reconfiguration architectures
    utilize centralized analysis and planning processes. Relatively little research
    has aimed to provide a model allowing the activities of several distributed processes
    to be coordinated, to analyze symptoms and decide on the appropriate modification.
    Systems that have addressed the problem of distributed decision-making, using
    several actors who collaborate together, have not suggested facilities for detecting
    and resolving potential conflicts between them, as they stick to predefined operations
    statically guaranteeing consistency. This solution fails short in large-scale,
    very heterogeneous and variable environments. As for execution control mechanisms
    for distributed adaptation actions, the growth in systems complexity has highlighted
    the limitations of centralized coordination models [MON 03]. Nevertheless, the
    distributed coordination mechanisms proposed are strongly specific to the applications
    that they adapt and to the type of reconfiguration. We therefore think that distributed
    coordination mechanisms have not addressed all the functions that a designer might
    be wished to reconfigure.


    Moreover, current approaches for dividing up the adaptation system, are not flexible.
    Existing works are concerned primarily with specialization of the adaptation systems
    behavior, rather than with structure and distribution.'
