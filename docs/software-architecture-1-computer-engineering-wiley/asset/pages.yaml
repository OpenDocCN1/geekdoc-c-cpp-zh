    # 3.6. Conclusion


    In this chapter, a literature review is made on the different approaches based
    on the viewpoints and the views arising from four fields related to software engineering,
    namely: requirements specifications, system modeling, system implementation and,
    and finally, software architectures. In the field of software architecture, we
    identified the benefits and limitations of approaches, in which, in their proposals,
    the views, points of view and levels of abstractions have been incorporated.'
