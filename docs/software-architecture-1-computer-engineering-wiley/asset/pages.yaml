  md: '# # Chapter 2


    # # Reference Architectures


    # ## 2.1. Introduction


    Reference architectures (or reference software architectures) refer to a special
    type of software architecture that captures the essence of the architectures of
    a set of systems in a given domain. The purpose of a reference architecture is
    mainly to provide guidance for the development, standardization and evolution
    of system architectures. Designed for various domains and purposes, they have
    increasingly impacted important aspects of software system development, such as
    productivity and quality of the systems. Thus, it is observed that there is real
    evidence of the importance of reference architectures for the software development
    and they could therefore be considered as one of the most promising disciplines
    in the near future.


    From this perspective, the establishment of reference architectures is interesting
    when a set of knowledge and experience of how to design a set of similar software
    systems, sometimes gained through past projects, is available and a means to communicate
    or reuse this knowledge and experience is necessary. Thus, individuals, research
    groups, companies, consortiums and any interested parties can propose reference
    architectures. To be effective, a reference architecture should also be continually
    updated with new experience and knowledge.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '56 Software Architecture 1


    In this chapter, we first discuss definitions given to reference architectures;
    besides this, we clarify the differences between the reference architecture and
    reference model, as well as between the reference architecture and product line
    architecture (i.e. the architecture of software product line). Following this,
    we present a model that describes the set of elements that could be found in reference
    architectures. Aiming at systematizing reference architecture engineering, we
    present a process for that. Various perspectives of applying these architectures
    are also discussed. This chapter ends with examples of these architectures and
    future perspectives for them.


    # 2.2. Definition of reference architecture


    A study of the main works in the software architecture literature allows us to
    identify some important definitions for reference architecture. One of the first
    definitions was stated by Kruchten [KRU 00]: “A reference architecture is, in,
    a predefined architectural pattern, or set of patterns, possibly partially or
    completely instantiated, designed and proven for use in particular business and
    technical contexts, together with supporting artifacts to enable their use. Often,
    these artifacts are harvested from previous projects”. From the perspective of
    a specific domain, Rosen et al. [ROS 07] stated that “A reference architecture
    is a working example of a critical aspect of your enterprise architecture, such
    as [...] to work with your organization’s message bus or [...] how to work with
    your business rules engine”. From the same perspective, Angelov et al. [ANG 09]
    stated that “A reference architecture is a generic architecture for a class of
    information systems that is used as a foundation for the design of concrete architectures
    from this class”. To complete these definitions, Reed think that “A reference
    architecture consists of information accessible to all project team members that
    provides a consistent set of architectural best practices”. Even syntactically
    different, these definitions present the same essence: the reuse of knowledge
    about software development in a given domain, in particular, with regard to architectural
    design. Other definitions are also found, but the ones presented above are sufficient
    for our purpose. Based on these works, we believe that:


    > “A reference architecture refers to an architecture that encompasses the knowledge
    about how to design concrete architectures of systems of a given'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Reference Architectures 57


    application domain; therefore, it must address the business rules, architectural
    styles (sometimes also defined as architectural patterns that can also address
    quality attributes in the reference architecture), best practices of software
    development (for instance, architectural decisions, domain constraints, legislation
    and standards), and the software elements that support development of systems
    for domain. All of this must be supported by a unified, unambiguous and widely
    understood domain terminology.


    # 2.2.1. Reference architecture versus reference model


    Sometimes the terms “reference architecture” and “reference model” have been used
    interchangeably. However, it is interesting to clarify the difference between
    them as it sometimes is desirable to build a reference model while other times
    intended to have a reference architecture. A reference model can be considered
    an abstract framework that presents a set of unifying concepts, axioms and relationships
    within a particular problem domain, independent of specific standards, technologies,
    implementations or other concrete details [BAS 03]. Conceptual models that present
    concepts and their relationships, as well as ontologies of a given domain, can
    be considered a reference model. According to Bass et al. [BAS 03], a reference
    model mapped onto software elements (that cooperatively implement the functionality
    defined in the reference model) and the data flows between them can be considered
    a reference architecture.


    Figure 2.1 presents the relationship between a reference model and a reference
    architecture. Based on one or more existing reference models together with other
    elements, such as domain expert knowledge, architectural styles and software elements,
    a reference architecture can be created. Using this architecture as the basis,
    concrete architectures can be created. However, it is worth mentioning that it
    is not necessary to previously have these models in order to create these architectures.
    As presented in section 2.4, we have several other sources of information that
    can be used to create reference architectures.


    # 2.2.2. Reference architecture versus product line architecture


    Various synonyms are used for the term “product line architecture”, such as software
    product line architecture, domain-specific software architecture,'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'domain architecture and even reference architecture in [POH 05, DEB 98]. However,
    “product line architecture” seems to be the term that fits best into the Software
    Product Line (SPL) context. In parallel, there are different definitions of this
    term. DeBaud et al. [DEB 98] say that it is an architecture with a required degree
    of flexibility and is shared by all members of a product line, ensuring their
    conceptual integrity. According to Pohl et al. [POH 05], “product line architecture
    is a core architecture that captures the high-level design for the products of
    the SPL, including the variation points and variants documented in the variability
    model”. From the same perspective, Goomaa [GOM 04] stated that “product line architecture
    is for a family of products, which describes the kernel, optional and variable
    components in the SPL, and their interconnections”. In a more complete definition,
    Software Engineering Institute (SEI) [SEI 13] declared that “The product line
    is an early and prominent member in the collection of core assets. [...] The architecture
    defines the set of software components [...] that populates the product line architecture
    – together with the production plan – provides the prescription [...] for how
    products are built from core assets”. It is worth emphasizing that, in general,
    other definitions are derivations of those presented herein. Moreover, it is important
    to observe that the common essence in these definitions is “variability on a common
    core”. In this scenario, we can define product line architecture as a special
    type of software architecture used to build a product line; it explicitly describes
    commonality and variability and is the basis for the architectures of all product
    lines.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_71_0.png)


    While reference architectures deal with the range of knowledge of an application
    domain, providing standardized solutions for a broader domain, product line architectures
    are more specialized, focusing sometimes on a'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'specific subset of the software systems of a domain and providing standardized
    solutions for a smaller family of systems. Another essential difference is that
    product line architectures are concerned with the variabilities among products.
    Furthermore, reference architectures are generally on a higher level of abstraction
    compared to product line architectures.


    As illustrated in Figure 2.2, we have proposed to consider reference architectures
    as a basis for product line architectures. A reference architecture can be specialized
    to different product line architectures, each for a specific SPL. Besides product
    line architectures, reference architectures can be used as the basis of other
    elements of the core assets of SPL [NAK 11a]. For example, the variability model,
    products feature list, descriptions and product line components can be created
    using the knowledge contained in the reference architectures [NAK 11a].


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_72_0.png)


    Figure 2.2. Relationship between reference architecture and product line architecture


    # 2.3. A model for reference architectures


    To facilitate the interaction of reference architectures, a better understanding
    of their elements or components is essential to adequately build, use and evolve
    such architectures. RAModel is a reference model for reference architectures,
    providing information on the elements and their relationships that could be contained
    in the reference architectures, independently of the application domains or purpose
    of such groups of architectures. As illustrated in Figure 2.3, RAModel is composed
    of four groups of elements:


    +   - Domain: it contains elements related to self-contained, specific information
    of the space of human action in the real world, such as domain'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 60 Software Architecture 1


    legislations, standards and certification processes, which impact systems and
    related reference architectures of that domain.


    +   - Application: it contains elements that provide a good understanding about
    the reference architecture, its capabilities and limitations. It also contains
    elements related to the business rules (or functionalities) that can be present
    in software systems built from the reference architecture.


    +   - Infrastructure: it refers to elements that can be used to build the software
    systems based on the reference architecture. These elements are responsible for
    enabling these systems to automate, for instance, processes, activities and tasks
    of a given domain.


    +   - Crosscutting elements: it aggregates a set of elements that are usually
    spread across/and tangled with elements of the other three groups (domain, application
    and infrastructure). We have observed that communication (which we have identified
    as internal and external) in the software systems built from the reference architecture,
    as well as the domain terminology and decisions, are present in a spread and tangled
    when describing other groups, and therefore, crosscutting elements.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_73_0.png)


    Figure 2.3. Structure of RAModel


    This structure together with the common elements, as presented in Table 2.1, composes
    the reference model for reference architectures.'
