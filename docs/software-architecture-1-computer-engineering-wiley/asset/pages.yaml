  md: 'Cavallaro et al. [CAV 08] identify a number of possible interfaces or protocol
    level mismatches between the interacting partners in a dynamic service composition.
    The authors address basic mapping functions for solving the simple mismatches.
    In addition, they propose to combine such mapping functions in a script (defined
    in a domain specific language) to solve complex mismatches. Both simple functions
    and scripts are executed by a mediator to perform the required adaptations.


    The script language is composed of the rules structured into two parts: the mismatch
    definition part that specifies the type of mismatch to be solved by the rule,
    and the mapping function part that contains the name of the function to be used
    to solve the mismatch. The rules can characterize the solutions for protocol or
    interface mismatches.


    Denaro et al. [DEN 06] present an approach to design self-adaptive service-oriented
    architectures. The authors propose a self-adaptive solution that enables the client
    applications to easily and automatically adapt their behavior to the alternative
    Web services providing compatible functionality through different business protocols.
    The proposed framework automatically synthesizes the models which approximate
    the interaction protocols by tracing the successful interactions of Web tools.
    It dynamically handles the adaptations of the client. On this concern, the approach
    adds an Interaction Protocol Service Extension (IPSE) to SOA such that each Web
    service is associated with an IPSE that serves as a proxy for the Web service.
    Before forwarding requests to the Web service, the IPSE monitors the interaction
    sequences between the client and the Web service. The IPSE uses this information
    to incrementally synthesize a model that infers the interaction protocol of the
    Web service. The main limitation is the manual testing by the developers to analyze
    the candidates.


    Jiang et al. [JIA 11] propose an approach for the adaptation of two or more services.
    The authors introduce a new model, called protocol structure, to characterize
    the service protocol using message and message dependencies. They also provide
    formal definitions for mismatches. The proposed approach covers various forms
    of service interactions such as one-to-zero, zero-to-one, one-to-many, and many-to-one
    exchange of messages, and message broadcast. In addition, the approach can automatically
    detect multiple mismatches at a time and automatically resolve them. The authors
    present a simple visual tool for the automatic adaptation of services and the
    generation of BPEL adapters. The process of developing adapter includes:'
  merge: -1
  pgno: 246
- img_proc: true
  md: '– the initial adaptation set (initial message dependency relation of adapter)
    is semi-automatically generated based on interface mapping among services;


    – the creation of protocol structure of adapted composition of two services using
    the initial adaptation set;


    – the final and correct adaptation set among services is obtained through automatic
    detection and resolution of the message ordering mismatches in the protocol structure
    (i.e. using an algorithm to compute data configuration):


    +   – extra messages are received and stored in the buffers by the adapter;


    +   – new messages are provided for missing messages (deadlock);


    +   – automatic generation of the BPEL adapter based on the final adaptation set.


    # 6.5. Conclusion


    Numerous adaptation approaches have been proposed to cope with incompatibilities
    of Web service composition. In this chapter, we made an overview of those approaches
    which focus on service interface and behavioral mismatches. A body of research
    studies, in this sense, can enforce the flexibility and efficiency of such techniques
    generating the adapter at run-time.


