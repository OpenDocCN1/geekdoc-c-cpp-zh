    # 5.6. Further reading


    In this section, we indicate and comment on some further reading, relating to
    the construction of software product line architectures. Currently, there are
    several books on product lines, especially [CLE 02, GOM 04, LIN 07]. The sei site
    is a mine of information on the subject. Moreover, the Software Product Line Conference⁸
    (SPLC) is the annual conference for this field. Readers seeking real examples
    of the success of product lines should consider the renowned hall of fame at http://splc.net/fame.html.


    There are elements on the construction of PLA architectures, their evaluation,
    experiments on Model Driving Engineering (MDE) use and some concrete examples,
    but not from recent summaries. The summary in [HAR 01] is much incomplete and
    outdated, given the great progress subsequently made into variability management,
    model engineering and generic architecture.


    The construction of an architecture requires the use of adapted languages [MED
    00] but a reference architecture must express variability and requires additional
    construction. On this subject, it is useful to consider the ISO/IEC/IEEE 42010
    standard Systems and software engineering – Architecture description. In particular,
    the site contains the conceptual model description as well as a recent catalog
    of references⁹.


    A number of attempts have been made to express variability, for example Variability
    Modeling Language (VML) in the Aspect-Oriented Model Product Line Engineering
    (AMPLE) project [RAS 11] or even the CVL


