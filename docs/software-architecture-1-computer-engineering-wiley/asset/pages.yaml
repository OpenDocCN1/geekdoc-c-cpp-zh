  md: '# Preface


    Over the past two decades, several languages have been proposed to describe software
    architectures to promote the development of architecture-focused applications.
    In general, these languages provide formal or semi-formal notations for describing
    and analyzing software systems. They are usually accompanied by tools designed
    to analyze, simulate and, sometimes, generate the code for modeled systems. Software
    architectures have made a real contribution to the development of complex distributed
    systems. Their main characteristics lie, on the one hand, in their power to manage
    levels of abstractions and levels of expression in a system and, on the other
    hand, in their ability to take into account the modeling of the structure and
    behavior of a system. It is widely accepted that today that one of the critical
    issues in the design and development of any complex software system is its architecture,
    i.e. the organization of architectural elements that constitute it. Good architecture
    can facilitate the development of a system’s critical properties (reliability,
    portability, interoperability, etc.). Conversely, bad architectures can have disastrous
    consequences on the system. Moreover, good architectures can serve as the system’s
    “conscience” during its development. In fact, a good architecture guides the evolution
    process of a system, for instance by indicating which aspects of the system can
    be modified without compromising its integrity.


    Nowadays, new engineering applications, particularly those dedicated to the design
    and development of object-oriented, component-based, service-oriented, agent-oriented
    and model-based distributed information systems, have highlighted the evolving
    nature of manipulated architectural elements and structures associated with them.
    The sustainability, adaptability and'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'scalability of such systems has become a very important economic issue. In
    fact, as these systems often require several years (human resources / months)
    of development and updating, it becomes imperative for these systems to allow
    for a consequent life and especially to respond to the changing requirements of
    software architecture manufacturers, builders of applications and end users. In
    this context, the academic and industrial communities proposed the design and
    development of new open software architectures (i.e. those that are able to communicate
    and interface with other architectures), which can be adaptable (i.e. they can
    be designed according to the operating conditions and different application domains)
    and scalable (i.e. they will be capable of being completed/modified to take account
    of services not anticipated in their initial design).


    In fact, the software architecture provides a good response to the inherent requirements
    of complex systems such as:


    +   - the requirement to use and reuse these systems in different environments
    and contexts. It is thus necessary to be able to remodel (adapting, evolving and
    re-engineering) so that they can meet, on the one hand, the requirements of their
    specific usage (e.g. distributed infrastructure, limited resources and different
    points of view on the composition of different functions) and, on the other hand,
    new technological requirements (component, service, architectural views, etc.);


    +   - the requirement to reduce development and maintenance costs of these systems
    by designing them for reuse and composition of reusable architectural elements
    (objects, components, services and agents). These architectural elements can be
    identified and extracted from existing systems to be reused in future developments;


    +   - the requirement to update these systems quickly and with minimal cost. In
    this case, it is necessary to automate the transformation process (structural
    and behavioral) and promote the reuse of these activities (reuse the evolution
    process);


    +   - the requirement to control their complexity (understanding and developing
    these systems, etc.) while handling them with a high level of abstraction.


    Nowadays, in light of this, a number of proposals have emerged on component-based
    and service-based architectures (SOA), agent-oriented architectures and model-based
    architectures. In any case, the challenges'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'include the improvement of quality and productivity, and the industrialization
    of software production.


    Also, with such a large number of proposals and solutions, it was necessary to
    review the research and applications concerning architectures in software engineering.


    Therefore, we propose a book entitled Software Architectures, which deals with
    object-oriented, component-based, service-oriented, agent-oriented and model-based
    software architecture paradigms, with different techniques and architectural methods
    for analyzing architectural features, models of representation of patterns and
    styles, their formalization, validation and, finally, the engineering approach
    in which these coherent and autonomous elements can be managed.


    This book is primarily intended for project managers, project owners, architects,
    designers, developers and users of software architectures, engineering university
    and school teachers, engineers, Master’s degree and doctoral students and, finally,
    engineering students.


    Mourad Chabane OUSSALAH

    March 2014'
