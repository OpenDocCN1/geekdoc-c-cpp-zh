    # 5.3.4. Domain design


    Once the domain analysis is realized, a full design process for the product line
    is implemented. It involves defining a generic design for the products in the
    line, and we return to the usual stages of a development cycle. The design relies
    on a component-based approach favoring the reuse; thus, the design of reusable
    elements must be planned. This design must also take variability into account
    this will be the role of the reference architecture and the production plan.


    DEFINITION 5.9.– Domain design is the process concerned with the identification
    and design of reusable elements, definition of a reference architecture and a
    product production plan.


    Reusable elements are the artifacts used in the manufacture of products in the
    line. Their design in itself is classic and the methods used in the architecture
    or component-based programming are applied in [ATK 00, BAS 98, CZA 99, DAS 05,
    OMM 02]. These elements are varied and can be of any type whatsoever: requirements,
    UML class, Java class, test,'
