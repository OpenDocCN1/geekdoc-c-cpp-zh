  md: '# Multihierarchy/Multiview Software Architectures 93


    or medium projects, work assignment and implementation views overlap with the
    module decomposition view.


    +   3) Triaging views: triaging the remaining views will be carried out in the
    order of priority of the documentation, depending on the specific details of the
    project.


    The last phase of the documentation of a proposed architecture by the V&B approach
    is the documentation of inter-views information that are applied to multiple views.
    This phase has been proposed to link the views of the architecture together and
    give an overall picture facilitating the understanding of the stakeholders. In
    fact, this phase can be divided into the following three steps:


    +   - the specification of the overall organization – providing a map of the entire
    documentation;

    - the description of the architecture by giving an overview of the system, an
    index of all the elements of the architecture, a glossary and a list of acronyms;

    - the justification of the final architecture and the decisions taken to achieve
    this architecture.


    # 3.3.5. Summary


    Following the previously discussed study, we make a comparative summary (see Table
    3.2) between the three approaches based on the following seven criteria:


    +   - Area covered:

    - the area covered by the “4+1” View Model is the AD of a softwareintensive system
    guided by scenarios and agreeing with incremental development processes such as
    RUP;

    - IEEE 42010 refers to the standardization of concepts and practices related to
    the description of a software-intensive system architecture design,

    - the V&B approach is the documentation of an AD that is decomposed into several
    views for the various stakeholders and that meet their requirements.'
