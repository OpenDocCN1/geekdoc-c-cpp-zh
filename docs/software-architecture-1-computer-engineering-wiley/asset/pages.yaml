  md: '# 44 Software Architecture 1


    DEvelopment framework (JADE) platform, the code generation approach led by the
    PIM4agents model [ZIN 08] and workflow approaches such as WADE or JBeans [EHR
    05]. Agents are useful in flexible and adaptive workflows using dynamic composition
    techniques based on negotiation and planning mechanisms.


    There are also other approaches that combine the agent, component and object paradigms.
    ProActive [BAU 09] and AmbientTalk [VAN 07] are two recent approaches in this
    category, which provide strong conceptual foundations and a ready-to-use framework.


    An approach in the context of software engineering has emerged under the name
    service component architecture (SCA) [MAR 09]. It was proposed by several major
    suppliers of the software industry, including IBM, Oracle and TIBCO. The SCA combines
    SOA with the component-based paradigms to provide SCA components that communicate
    via services.


    Braubach and Pokahr [BRA 12] propose the concept of active components during the
    development of a distributed system project. The active component-based paradigm
    is proposed in the framework of an approach to reconcile ideas by unifying the
    contributions of the object-oriented, component-based, service-oriented and agent-oriented
    concepts using a common conceptual perspective. The proposed paradigm is supported,
    on one the hand, by a programming model, which allows the development of systems
    with active components using XML and Java, and on the other hand, by a middleware
    infrastructure, which directs a transparent distribution of the components and
    provides useful development tools. The active components are an upgrade of the
    SCA by adding the agent-oriented element in the SCA. The general idea is to transform
    passive components of the SCA to providers and service consumers, who act independently
    to better reflect real-world scenarios that are made up of different active stakeholders.


    Aboud [ABO 12] proposes a metamodel combination approach called component agent
    service oriented model (CASOM), which allows the specification of applications
    composed of a set of interoperable agents, components and services in a coherent
    scheme.'
