    The authors also present the protocol-based interface matching algorithms and
    iterative reference-based interface matching (i.e. depth-based interface matching
    and iterative interface matching). In a depth-based interface matching approach,
    messages with the same or similar depths in two protocols may have a higher chance
    of matching, and also the infinite loops avoided. Iterative reference-based interface
    matching approach comprises the knowledge of previous matching (i.e. a pair of
    messages is selected as the best candidate match in each iteration and this pair
    is referred to as a reference pair for the next iteration. Potential deadlocks
    can be avoided by penalizing the conflicting match pair.


    Miguel et al. [SEG 09] illustrate an automated approach of adapter generation
    to resolve protocol mismatches for all interactions, but only for a minimal set
    of messages exchanged with that adaptation. The authors analyze BPEL collaboration
    from a synchronous semantic standpoint.


    The BPEL representation of a service protocol is modeled by a protocol tree. The
    leaves of this tree correspond to the basic activities and the internal nodes
    represent the structured activities. The proposed approach exploits the behavioral
    relation (Seq, XOR AND) of the protocol syntax (i. structure of the protocol tree)
    to identify the mismatches and recognizes the set of messages exchanged that have
    to be adapted. To this end, an interaction analysis matrix (IAM) is built over
    the pairs of interaction for comparing and assessing the behavioral relation of
    their nodes. Accordingly, they demonstrate an algorithm that can address the minimal
    set of interactions needing adaptation. Indeed, an IAM is able to evaluate which
    parts of a collaboration have to be adapted and which parts cannot be resolved.
    Therefore, the adapter generated through this approach has lower complexity and
    improved performance characteristic at run-time.


    Shan et al. [SHA 10] present a technique for a flexible, on-the-fly adapter generation
    based on message and control flow adaptation. This approach can also combine control
    flow constraints into message adaptation. The main idea of their framework is
    to provide message transformation patterns that can be extended for a user''s
    future requirements. Therefore, they first characterize the types of message mismatches,
    and then propose a set of patterns for resolving them. These patterns are defined
    as message data generation, message data casting, message fragmentation and aggregation
    and message reconstruction. The proposed approach also exploits a of'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'standard patterns for control flow adaptation (e.g. sequence, parallel, choice
    and loop). In addition, a compatibility matrix based on these patterns is represented
    as a guideline for incorporating processes. The authors also illustrate an adapter
    generation algorithm.


    Mooij and Voorhoovee [MOO 09] present an automated approach for adapter generation.
    The authors develop a proof technique for partial adapters based on the open Petri
    Net [KIN 97] formalism. They apply this technique to the adapter generation approach
    from [GIE 08] where behavioral adapters are proposed to adjust the communication
    between two services that certain behavioral properties (e.g. deadlock-freedom
    and weak termination) are preserved in the composite service. The authors particularly
    address concepts like operating guidelines, controllability, accordance and partial
    adapters. Their proposed approach relies on the point that the adapters are regarded
    as controllers for the disjoint composition of two partner services.


    As has been pointed out, the authors in [GIE 08] present an automated adaptation
    approach (using Petri net formalism) that synthesizes the behavioral adapters.
    They propose a specification of elementary activities (SEA) consisting of a set
    of transformation rules on message types. Therefore, the adapter specification
    includes the given partners services and the SEA. In addition, their generated
    adapters do not need to be verified, since the synthesis of the adapter guarantees
    the adapter''s correctness by construction.


    Nezhad et al. [NEZ 07] present an approach to semi-automatically identify the
    split/merge type of interface mismatches and automatically recognize the protocol
    mismatches by generating a mismatch tree. Besides, they propose an adapter simulation
    algorithm which explores all possible message exchanges between two service interfaces
    to evaluate the respective protocol mismatches. The algorithm results in an adapter
    protocol, and a message tree that represents all deadlock situations between two
    service protocols. The interface matching is done by finding the match between
    data elements of the XML schemas associated to service interfaces. To increase
    the matching accuracy, they suggest the inclusion of message name and message
    type in an operation definition.


