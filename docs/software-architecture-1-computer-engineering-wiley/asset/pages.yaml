    Medjahed et al. [MED 03b] discuss that Web services can potentially simplify the
    building of distributed applications and also describe the design of an impressive
    and useful system that realizes this promise. Felber et al. [FEL 03] introduce
    some algorithms to provide solutions for the problems addressed with SOAP and
