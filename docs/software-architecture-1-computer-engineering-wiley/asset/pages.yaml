- img_proc: true
  md: 'In the context of software architecture, an architectural style has gained
    attention in the past few years: SOA. This style makes it possible to improve
    invention, scalability and reuse, since systems based on this style present independence
    regarding programming language and execution platforms. Considering the advantages
    of SOA, it has been widely investigated and used as an architectural style of
    diverse types of software systems. Therefore, reference architectures are also
    quite important when service-oriented systems need to be developed. Information
    about how to organize the systems and their external interfaces can be set by
    the reference architecture.


    From another perspective, dynamic software architectures are characterized by
    architectures that can evolve/modify the execution of the system, i.e. components
    or connectors can be created, deleted or reconfigured at runtime [OQU 08]. For
    this, these architectures must provide a specification of modifications at runtime.
    Currently, many application domains have perfected software systems with dynamic
    architectures, such as robotics, automatic guided vehicles, unmanned vehicle and
    intelligent cameras. There are also several initiatives of reference architectures,
    reference models and domain-oriented software architectures for systems with dynamic
    architectures. However, research in this topic is quite recent and more investigation
    must be developed regarding design, representation, evaluation and evolution of
    such architectures.


    From another perspective, MPL has recently emerged as a special type of SPL [ROS
    10]. MPL refers to a new approach for the software development where software
    products are the result of components developed from independent SPLs, sometimes
    by various organizations, using various approaches and even technologies. MPL
    must then make it possible to manage a set of interacting, interdependent SPLs.
    In this context, we can foresee several perspectives of exploring reference architectures
    in the context of MPL. Figure 2.7 illustrates the panorama involving reference
    architectures and MPL. Note that one or more reference architectures could be
    used as the basis of MPL. Then, we list the main perspectives: (1) the use of
    reference architectures for the establishment of interfaces, (2) the use of reference
    architectures for communication improvement among various development teams, (3)
    the evolution and refinement of existing reference architectures for MPL and (4)
    the establishment of new reference architectures for MPL.'
