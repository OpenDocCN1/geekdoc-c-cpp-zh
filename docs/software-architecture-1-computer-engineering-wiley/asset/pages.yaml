  md: '# 5.6.2. Influential older works


    Product line engineering has its roots in the works of several authors. Parnas
    introduced the concept of a program family as a set of programs with major similarities,
    making it worthwhile to study common properties before moving on to the design
    of individual programs [PAR 76]. He also defined a set of techniques for the design
    of these program families based on the concepts of minimum subset and extension
    [PAR 79]. These techniques for program families have been used in several approaches
    for architectures and reusable components. For example, Tracz suggested the DSSA
    method to create reusable architectures and parametric programming languages [TRA
    93]. Later on, Kang suggested the feature-oriented domain analysis (FODA) [KAN
    98] approach which introduced the concept of the features to identify similarities
    and variability in domain analysis.


    In the 1990s, these ideas were incorporated into the process of engineering to
    create product families in AT&T [COP 98] and Nortel [DIK 97]. The feature-oriented
    abstraction, specification, and translation (FAST) process, used by AT&T and Lucent
    Technologies, is described in [WEI 99]. This book includes an introduction to
    software product lines (described as families), a description of the activities
    of domain and product engineering and an application of the approach in two case
    studies.


    At the end of the 1990s, several studies highlighted the importance of product
    line software: the CAFE, ESAPS and FAMILIES research projects¹¹ [LIN 02] and the
    book by Van der Linden et al. [LIN 07]. From these works, a catalog of methods
    and practices was established and validated in several industry projects in Europe.


    In the United States, a similar project was developed by the SEI¹². The book by
    Clements and Northrop presents a set of activities and practices that a business
    must put in place for the adoption of product line engineering [CLE 02]. The authors
    define a framework based on three essential activities:


