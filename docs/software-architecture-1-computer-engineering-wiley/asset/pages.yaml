    better understanding through the use of a comparative summary of the four paradigms
    in order to assist them in deciding on the use of one of these paradigms. This
    aspiration involves a grasp of their respective concepts, in their definition
    and in the analysis of impacts on quality.


    This comparison between object, component, agent and services serves the same
    purpose as the comparison between objects and components [OUS 05, SZY 02]. The
    common goal is the analysis and understanding of the differences in a unique,
