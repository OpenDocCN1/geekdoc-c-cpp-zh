  md: '# Multihierarchy/Multiview Software Architectures 113


    As defined in IEEE, a system is a software entity regardless of its name, shape
    and size. Thus, a system can be an independent application, a subsystem or even
    a system of systems.


    IEEE also defines stakeholders associated with a system as individuals, teams
    or organizations involved in one or more design, development and validation phase
    of the system (developers, architects, experts, users, etc.).


    Simultaneously, a system has an architecture, which will be documented and described
    through several views. Each view is consistent with a particular viewpoint that
    encompasses a set of concerns, and is represented by a hierarchy of abstraction
    and description.


    The description of a level of hierarchy, and thus a view, relies on a set of formalisms
    defining the lexical and syntactic elements of modeling specific to this level
    of hierarchy.


