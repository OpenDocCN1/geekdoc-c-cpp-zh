    # 1.4.1.4. Difference of cooperation and problem-solving


    The concept of cooperation and problem-solving is a concept stemming from the
    field of DAI, in coordination with the multi-agent approach. The main problem
    in the study of cooperation in distributed problem-solving is to understand how
    agents wishing to accommodate each other, may interact with each other to form
    an effective team. Two forms of cooperation are defined, the sharing of tasks
    and the sharing of results, which correspond generally to discerned phases in
    the study of problem-solving. In both of these types of cooperation, R. Davis
    and R. Smith are particularly interested in its control and communication. In
    the division of the tasks, the control is directed by the goals and the agents
    are represented by the tasks they are committed to perform; the problem lies in
    the distribution of the tasks. The agents are represented by knowledge resources,
    and the problem lies in the communication of the results [BOU 92, SMI 81].


    A cooperative strategy is necessary in order to perform tasks effectively when
    problem-solving involves several agents. The purpose of a strategy is to ensure
    overall consistency from local decisions and enable the effective use of communication.
    Two classes of cooperative strategies are defined: organizational strategies and
    the distribution of information strategies. The first class deals with the decomposition
    of a global task into subtasks and assigning these subtasks to the agents. They
    aim to identify the most appropriate agent to decide which plan to follow. For
    instance, an organizational strategy chooses an agent, which has the largest selection
    of possible actions. Strategies on the distribution of information indicate how
    and when agents must communicate. For example, one of these strategies specifies
    that we should not repeatedly send the same information to an agent [BOU 92, CAM
    83].


    Cooperation refers to a judgment value on the overall activity of a set of agents.
    The judgment of cooperation is influenced by several indicators such as the number
    and the persistence of conflicts as well as the synchronization of different agents''
    actions. The mechanisms that allow us to weigh these indicators are called cooperation
    processes.'
