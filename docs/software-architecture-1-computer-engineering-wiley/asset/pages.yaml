  md: '# 3.3.6. Limitation of current approaches to software architecture


    Within software architecture, approaches working on the view concept have effectively
    contributed to the software development process. In fact, they have led to the
    reduction of the complexity of an AD by combining all the information and treatments
    related to specific concerns; it is the complexity caused by the multitude of
    concerns. However, some limitations may be noted. Among these limitations, we
    note:


    +   - The persistence of complexity within views: in fact, if the views solved
    the problem caused by the complexity owing to the multitude of concerns raised
    above, an AD must be able to provide solutions for another form of complexity:
    the intraview complexity which is owing to the need to consider a hierarchical
    description at different levels. In fact, it is essential to use a hierarchical
    approach that reveals different levels of understanding in a view. In other words,
    the architect needs to decompose a view into several levels and to specify the
    links and types of links between these levels. Besides the fact that this description
    in multiple levels helps to reduce the complexity within a view, it assists us
    to better meet the requirements of stakeholders who, depending on the circumstance,
    need to study a detailed or semi-detailed overall description of a view and navigate
    between these levels of description.


    +   - The proposal of a process of AD taking into account the two forms of complexity
    approaches: for instance, the Kruchten and Clements approaches proposed a guide
    for the selection of viewpoints and views, but none of them have formally integrated
    levels of hierarchies, in conjunction with views.


