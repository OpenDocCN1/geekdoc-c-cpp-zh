    # 2) Strategy publication


    This model enables the coordination initiator to notify the participants about
    the strategy chosen by it. Once a participant has been notified, it analyzes its
    context and chooses a suitable strategy, taking into account the decision made
    by the initiator. The strategy chosen must be consistent, and complement of the
    initiator. In the first model, the interaction between the initiator and participants
    via the “CoordinateIt” interfaces is unidirectional and a message sent to each
    participant shows the strategy adopted by the initiator. For example, a decision
    maker associated with a replica placement manager for a data group can choose
    a strategy consisting of increasing the number of replicas. Afterward, it announces
    this strategy to the decision maker associated with another replica placement
    manager, for a second data group. This second decision maker triggers an adaptation
    process by choosing a strategy for its data consisting of reducing the number
    of their replicas, as it finds the overall storage capacity to be weak.


    This model can be used when each participant has options for ensuring a consistent
    global strategy and when it is easy to manage dependencies between the services
    provided by the components involved.


    # 3) Strategy negotiation


    This model enables the establishment of an agreement on the global strategy to
    apply, with a negotiation process between a group of adaptation managers. For
    example, the negotiation can take place between the adaptation managers associated
    with the components ensuring the update propagation service and running in environments
    having different characteristics. These managers negotiate the replica consistency
    protocol to apply, in order to improve the replica system performance by taking
    into account the characteristics of different environments, such as the availability
    of resources.


    In this model, the negotiators exchange offers and counter-offers in order to
    reach an agreement. The initiator informs the others of the strategy that it wishes
    to adopt and/or requests a specific strategy be adopted. Interaction between negotiators
    enables the offers to be accepted or refused, and the global strategy to be progressively
    modified until agreement is reached, or the negotiation is considered to have
    failed. In the negotiation process, the negotiators can have different interests
    regarding each application configuration and different intentions. The local context
    is used to make an offer or counter-offer in order to determine the final decision.'
