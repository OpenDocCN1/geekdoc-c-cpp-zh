    A service interface represents its functionality. The interface describes service
    signature (i.e. comprising the operations, inputs/outputs messages, message types
    and error parameters) facing an environment from interaction standpoint. The interface
    of a service consists of a set of ports (i.e. connected by a channel) enabling
