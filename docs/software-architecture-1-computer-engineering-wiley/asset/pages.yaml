  md: 'Software Architecture 1


    # 1.4.3. Qualitative dimension


    Existing research studies related to software quality define a number of criteria
    such as performance, safety, robustness, flexibility and development. [BIA 07,
    KIT 96]. Each of these studies has outlined their own organization of of these
    criteria. The definition of these quality criteria and the way to apprehend them
    are being shaped based on the perspective of the target user via these measurement
    frameworks. Indeed, understanding a quality can vary between the stakeholders
    involved; whether they are architects, designers, developers or others. In addition,
    the scope of the system directly influences the importance of these criteria.
    We therefore try to cover all of these variations by offering the possibility
    for users to define their own vision of the qualities that interest them most.
    In the first instance, we identify the set of paradigm factors that influence
    software quality. We then compare OOSE, CBSE, SOSE and AOSE approaches following
    these factors. The second user defines the quality criteria they want to measure
    by combining the previous results.


    Using the various previous analyses and by placing the four object-oriented, component-based,
    agent-oriented and service-oriented paradigms within the conceptual framework,
    it emerges that they share the following quality factors:


    +   - Reusability: the support and ease of a product or a process related to a
    software development paradigm to be reused in the same way or through a number
    of changes.


    +   - Composability: the support and ease of a software development paradigm to
    safely combine architectural elements to construct new systems or composite architectural
    elements.


    +   - Dynamicity: the support and ease of a paradigm to develop applications that
    can adapt their behavior dynamically, automatically and autonomously to meet changing
    requirements and changing contexts as well as the possibility of errors.


    These three factors represent the qualitative nature that led to the definition
    of the object-oriented, component-based, service-oriented and agent-oriented development
    paradigms. Figure 1.7 illustrates this analysis and provides a high-level view
    of their primary points of interest and traces the chronological evolution of
    the concerns for the software engineering community.'
