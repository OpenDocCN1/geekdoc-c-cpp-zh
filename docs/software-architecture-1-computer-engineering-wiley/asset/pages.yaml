    # 4.7.5.1.2. Decision-making coordination models


    We have defined three decision-making coordination models between decision services;
    strategy choice by a master, strategy publication and strategy negotiation.


    +   1) Strategy choice by a master


    This model enables the coordination initiator to act as a master and treats the
    participants as slaves who follow its orders. The master chooses a global strategy
    individually. Next, it assigns the task of applying a specific strategy to each
    participant, using “CoordinateIt” interfaces. The message sent to each participant
    shows the strategy and what it must apply. Each participant starts a refiguration
    process to apply the assigned strategy by calling its planner.


    This model is simple to specify and it limits the costs of communication between
    decision makers.'
