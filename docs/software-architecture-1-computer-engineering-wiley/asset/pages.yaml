  md: '# 1.4.1.2. Difference relating to coupling


    Coupling is a concept that we identify as one of the key breaking points between
    OOSE/CBSE and AOSE/SOSE. This concept expresses all the possible dependencies
    between conceptual and software entities. Reducing coupling guarantees a number
    of intuitive benefits in terms of isolating errors, easing additions and removal
    of reused entities, reconfiguration, etc.


    In fact, OOSE and CBSE have a broad mandate in the type of applications they wish
    to implement, whereas the SOSE and AOSE mechanisms are built to support the development
    of applications that run on highly volatile, cooperative and heterogeneous environments.


    This difference is consecutively illustrated by their respective connection for,
    on the one hand, the management of heterogeneities, and on the other hand, the
    automation of other mechanisms.


    # 1.4.1.2.1. Management of heterogeneities


    The aim of the service-oriented paradigm is the independence it has with implementation
    technologies. A service must be accessible and usable without any assumption on
    its implementation, on the potential users or on how to use this service. This
    problem is well known in CBSE but is not as critical as in the SOSE issue. As
    it is, there are a large number of component models [CRN 11]. To develop a new
    system, the designer must choose a particular model and use only the components
    complying with this model as the collaboration between different models is very
    difficult [CRN 06]. Thus, although the CBSE has proven its effectiveness in software
    reuse and maintainability, it does not specifically target certain difficulties
    encountered by developers in relation to changes in platforms, protocols, devices,
    Internet, etc. [BRE 07].


    For its part, the SOSE advocates a single homogeneous service-oriented model [ERI
    08], to be standardized and used by all, to encapsulate all types of resources
    and hide their heterogeneous nature during development.


