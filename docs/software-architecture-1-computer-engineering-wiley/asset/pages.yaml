  md: 'Analysis of reference architectures: as stated before, a considerable number
    of reference architectures have been proposed in recent years; however, they have
    sometimes been developed without concern or conscience about what they should
    contain. These architectures can then be analyzed and confronted with RAMModel,
    aiming at identifying the elements that are missing and, if significant, then
    these elements could be inserted into these architectures. For instance, the RAMModel
    establishes that “decision” is an element that could be present in reference architectures,
    since decisions can make easier to understand why things are as they are. However,
    reference architectures usually do not present such information; thus, information
    about decisions should be inserted into these architectures.


    Comparative analysis of reference architectures: the RAMModel can be used to conduct
    comparative analysis of reference architectures, when it is necessary to select
    reference architectures among a set of them, intending to use in a new software
    system project. The RAMModel can be used as a guideline to observe which elements
    each reference architecture contains, i.e. it be used to better understand each
    architecture, supporting more adequately the decision about which architecture
    or part of the architecture should be adopted. This comparative analysis is quite
    relevant in domains that present several reference architectures, such as ambient
    assisted living (AAL) ANT 11, UNI 13, W 10.


    Support to the design of SPL (Software Product Line): there is a close relationship
    between the reference architecture and the SPL, in particular, the product line
    architectures (PLA), which is the core asset of an SPL. Thus, we have explored
    the use of reference architectures as a basis to build the artifacts of SPL.


    Basis for the establishment of reference architectures: the RAMModel can also
    be used to gain information about which elements could be inserted into new reference
    architectures. By using the RAMModel, designers of reference architectures have
    a guide to follow and, ideally, as a result, time and effort to establish such
    architectures could be reduced. Moreover, since the RAMModel provides a comprehensive
    set of elements, the intention is to achieve more complete architectures. Thus,
    these architectures will have more chances to effectively contribute to the development
    of systems. Therefore, this model can be used during the reference architecture
    engineering, discussed in section 2.4.'
