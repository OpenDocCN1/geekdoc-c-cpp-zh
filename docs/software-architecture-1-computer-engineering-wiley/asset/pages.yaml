  md: '# Chapter 5


    # Software Architecture for Product Lines


    Software product lines were designed from the product line tested out by H. Ford
    at the beginning of the 20th Century, which led to the success of his automotive
    production. For 15 years, these methods have been visible in several software
    application fields: telephony at Nokia, televisions at Philips, print software
    at HP and flight applications at Boeing, among others.


    The concept of architecture is crucial for classic software applications, and
    this concept is even more important at the level of domain engineering in product
    lines. In a product line, the so-called reference architecture generically describes
    the architectures of all the products in the family. This chapter describes the
    technical means and methods for defining a reference architecture for a software
    product line. It will also present the methods for operating this architecture
    through, for example, techniques emerging from model and software component engineering,
    or aspect-oriented programming. These concepts and techniques will be illustrated
    using a case study.


    # 5.1. Introduction to software product lines


    Software systems are complex, and the time consumption and amount of labor that
    they require are considerable. We have managed to observe, fairly'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'easily, that many software applications constructed in the same context share
    more common than unique points. An often-used approach is to define a new application
    of a given scale through modification and enrichment of an already-existing application.
    The strategy of reusing existing components has thus seen as a good method for
    improving the software productivity. Reusing existing components not only facilitates
    the production but also improves the overall quality of components and applications.
    Product line engineering is a paradigm that places component production and the
    reuse strategy at the center of the development process [BOS 00, CLE 02]. Of course,
    the first aim of such an approach is to improve productivity: that is to reduce
    production and time costs, and to improve the overall quality of products.


    The basic principle of software line engineering is to develop several applications,
    which share common aspects.


    DEFINITION 5.1.— A software product line is a set of software applications that
    share certain characteristics: market trends, functional requirements, an architecture,
    software components, etc., and rationally constructed and planned by a set of
    components.


    A characteristic is called a feature in product lines. A synonym of product line
    is the term “product family”, which is more commonly used in Europe. However,
    the sometimes-used term “software factory” is more ambiguous, since it only concerns
    the final aspect of automating application production. The first major point of
    a software product line is that the development cycle must produce several products
    or applications, while in most traditional approaches, only one application is
    produced at a time. The second point is that the applications share certain features
    – they belong to the same domain. The characterization of this domain is, moreover,
    a vital activity in a software product line and makes up a part of domain engineering.
    Characteristics shared by domain applications are common characteristics, thereafter
    referred to as similarities. Variability expresses the difference between applications
    and their unique points.


    The engineering technique for developing a product line is presented in two phases:
    domain engineering and application or product engineering [POH 05]. Domain engineering
    must identify domain applications, characterize their similarities and variations,
    and structure this information.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Software Architecture for Product Lines 173


    The domain engineering phase is also essential since it takes on the task of defining
    the production plan and producing reusable elements for the product line architecture
    (reference architecture). These reusable elements (core assets) are of various
    types, since they may be involved at all stages of the software lifecycle. They
    may relate not only to market or functional requirements but also to more technical
    elements for the design and implementation of software: use cases, unifying modeling
    language (UML) models, architectural elements, software components, code in a
    given programming language, tests, etc. The production plan describes how the
    realization of an application will be undertaken from application features and
    reusable components.


    The second phase of a product line is the efficient production of preplanned applications
    from their features and the production plan defined in the domain engineering
    phase. The usual task is to automate this last phase as much as possible; model
    engineering (ARB 12, RAN 11, STA 06) is the proven technique in this context.


    It is necessary in software development to distinguish the problem area (which
    concerns application specifications) and the solution area (i.e. application design
    and implementation). Figure 5.1 shows the two phases of a software product line
    and the links with a lifecycle. The problem and solution areas cover all the usual
    development stages: specification, design, maintenance, tests, documentation,
    etc. In Figure 5.1, the reusable elements, often called the core assets, represent
    a central store provided by domain engineering and operated by applications engineering.


    Businesses adopting this type of engineering can face various difficulties, as
    discussed in [CLE 02, CLE 06, KRU 06]. An initial investment is needed to set
    it up, and the effort to be put into training, as well as managing processes,
    cannot be neglected. An adoption can take quite different forms, depending on
    the business context. An important point in such cases is the return on investment
    guaranteed to the business. To benefit from component reuse, a sufficient set
    of applications which can reuse them must be constructed. The domain size, i.e.
    its number of applications, must not be too large or too small. If it is too small,
    reuse will be poor, and if it is too large, variability may be a critical factor,
    since it will introduce a large number of reusable element combinations. The profits
    from a product line largely depend on the relationship between the similarities
    and variability.'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'The case studies mention a return on investment between three and five applications.
    Calculating this return is actually more complex because classic cost models are
    not really adapted for this type of engineering, among other reasons. For a fairly
    preaised approach for calculating this, we can consult [BOC 04] and there is a
    comparison of several models in [ALI 09].


    | Problem | Solution |

    | --- | --- |

    | Domain engineering | Variability model Production plan |

    | | Reusable elements |

    | Product engineering | Selection of characteristics | Software applications |


    Figure 5.1. Software product line engineering


    # 5.1.1. Three development styles


    We differentiate between three implementation types: proactive, reactive or extractive
    ( [CLE 02, FRA 05, RAS 11]). The proactive approach sets the stages of a software
    product line in full motion: no application exists to begin with, and most of
    the reusable elements will have to be created from scratch. It requires a large
    investment to start the line, and will be beneficial in the case of a mature and
    stable domain. The reactive approach is more dynamic and iterative, seeking to
    extend or maintain an existing product line. The last approach, the extractive
    approach, assumes that there is an existing set of applications that the business
    wants to be migrated to a product line. In this case, the expertise of the business
    should facilitate the domain analysis and the presence of existing applications
    and components should reduce the costs of putting the line on the market.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# 5.1.2. Variability management


    A recurring problem with reuse is reusable artifacts (e.g. software components)
    are not always adapted to the exact requirements of the designer who wants to
    reuse them. To maximize the possibilities of reuse, domain engineering analyzes
    the domain, i.e. a circumscribed set of applications, for the definition of reusable
    domain components in great detail. We are in agreement with [SCH 04] that a domain
    may be:


    +   - a management domain;

    - a set of problems;

    - a set of applications;

    - a knowledge domain with a terminology.


    The domain of a product line is defined as follows.


    > DEFINITION 5.2.– The domain of a product line is the set of products or applications
    that will be constructed in the line. It defines the business domain, which is
    the target of the product line.


    There is no standard method for defining this set: it can be an enumeration completed
    using textual descriptions, or a constructive description using specific notations.
    These notations are of various types: features models [CZA 00, K 90], enriched
    UML diagrams [GOM 04], model engineering notations [ARB 12, CZA 05a] and variability
    languages such as common variability language (CVL) [HAU 12] and VML [LOU 08,
    RAS 11].


    Variability management allows the domain to be formally defined by using the features
    model notations and product configuration.


    > DEFINITION 5.3.– The variability of a set of software products is the set of
    differences and similarities of the features of products in the line described
    in a structured way.


    Several types of variability have been identified in product lines. For example,
    Pohl et al. looked at external (or essential) variability and internal (or technical)
    variability. The difference between the two is relative to the point of view of
    the client or designer, i.e. the point of view that we encounter, for example,
    in software quality models. External variability is'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 176 Software Architectures 1


    concerned with the client since it is relative to user needs, i.e. it is visible
    to clients. Internal variability is only relevant to the designers as it relates
    to variations in the architecture, design language or development method.


    DEFINITION 5.4.– Variability management is the product line process which makes
    the variability of software artifacts explicit at an internal and external level,
    which enables the configuration of different domain products.


    Pohl et al. [POH 05] define variability as the set of activities defining and
    exploiting variability throughout the lifecycle. Figure 5.2 shows the variability
    management process and its connections with other activities in the product of
    variability analysis (identification, modeling and documentation) on the one hand
    and the resolution of variability and its realization in the product on the other
    hand. It is an essential process in a product line and creates an overlap between
    domain engineering and application engineering. In domain engineering, variability
    management is concerned with the analysis and modeling of external and internal
    variability and its documentation. In application engineering, variability management
    resolves external variation points in order to choose the functional configuration
    for products. The reference architecture, component library and production plan
    are then used to resolve internal variability and generate the final applications.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_189_0.png)


    Figure 5.2. The variability management process'
