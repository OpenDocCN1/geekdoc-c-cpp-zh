  md: '# 5.1.3. The concept of architecture in product lines


    The concept of architecture is fundamental in the construction of modern software.
    Architecture provides a plan of work for the construction and assembly of the
    final product. Yet the architecture is also a documentation element that must
    be kept synchronized with the code, at the risk of deviation or degeneration.
    Architecture is not necessarily all in one piece, and we often have to use several
    points of view, as per Kruchten [KRU 95] or as UML, for example. This is helpful
    with various static or dynamic analyses, e.g. checking the consistency of interfaces
    (typing), checking the flow of communication and a priori performance analysis.
    For a software product, variability must be able to be managed using a suitable
    design: a feature, meta- or decision model. However, this architecture can also
    integrate a more detailed design, and thus it does not need to be monostage. Can,
    for example, require several stages of configuration and resolution – it may be
    necessary to choose a particular network architecture, a programming language
    for certain components, design patterns, or even more configuration parameters
    for software components.


    The architecture of products in a software product line is actually considered
    a reusable artifact and will be defined in the domain engineering phase. According
    to Clements et al. [CLE 02] and Bass et al. [BAS 12], the architecture of a product
    line is the original artifact of the reusable artifact kernel, and thus must be
    a main development objective.


    > DEFINITION 5.5.— The architecture of a product line is an architecture specification
    shared by all the domain products. It is preplanned to support their common basis,
    variations and architectural requirements.


    The aim is to define an architecture that represents all the products in the family
    and integrates the common architecture and its variable elements. Using this concept
    allows the usual advantages to be added to those specific to product line engineering.
    However, the notations are more complex and using them to derive the product is
    more technical. A simple example is using a generic interface or pattern, which
    enables a family of types to be concisely described. However, a variable architecture
    often necessitates more complex, especially conditional, constructions for components
    and communications. For example, if the “modem” component is not present, the
    alarm is generated only at the main sound, and light if it is present, a telephonic
    alarm'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'will be produced. Using an architecture for the product line variability enables
    the complexity to be better controlled, and thus production and maintenance costs
    to be reduced. The methods for the product lines, reuse is set up with the creation
    of an architecture for the whole product rather than creating an architecture
    for each product. The concept of product line architecture (PLA), or reference
    architecture, is an artifact that captures this concept of shared architecture
    and is central in product design methods. This “super” architecture defines the
    general design of the whole product from a set of reusable components, assembly
    rules and constraints. A concrete architecture for a domain product is actually
    an instance of this generic architecture or “meta-” architecture. The design of
    this PLA is thus essential, and assumes there are notations and a method adapted
    for managing variability at the architectural level. There are some discussions
    in the literature about the differences between reference architecture and PLA.
    For most authors (and also for us), the two concepts are the same. For some authors,
    however, there is a difference in the abstraction level (see section 5.6 for further
    details). Some authors (e. Pohl et al.) and methods (such as domain-specific software
    architectures (DSSA) [TRA 93, TRA 95]) and product line software engineering-DSSA
    (PulSE-DSSA) [DEB 98]) rely on the definition of a reference architecture. [DOB
    08], the reference architecture represents the common architecture (that of product’s
    similarities) while variability is defined in the domain architecture.


    DEFINITION 5.6.— A reference architecture is a model (or PLA) or a set of architectural
    models, partially or fully instanced and aimed at making the reusable artifacts
    and their organization in all domain products of the product line more explicit.


    The aim of a reference architecture is to capture the essence of the architectural
    principles of a set of products from the same domain [CLO 10, GAL 11]. This not
    only involves reusable components, often obtained from existing projects, but
    also compositions, organization and architecture models that will give a structure
    to products in the line. This concept is thus similar to the principles of some
    standards or international bodies, which seek to promote application domains and
    formulate architecture standards. Some examples are the reference architectures
    for'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Software Architecture for Product Lines


    service-oriented systems, as defined by the OpenGroup¹ or at the OASIS initiative²
    or even AUTOSAR³ for automotive systems. Such an architecture must provide assistance
    in the development of concrete architectures for products or new systems, in the
    evolution of products, or even in the improvement of product interoperability
    and standardization[GAL 11].


    # 5.2. The music store example


    As a case study for the application of previous concepts, we will consider a relatively
    limited-size example involving an online music store. The example, called “SongStock”,
    was developed at the University of Los Angeles in Colombia to provide ongoing
    support for the design and development of software product lines.


    # 5.2.1. The field


    Putting online music sales systems in place is a well-known phenomenon nowadays,
    which has tended to replace the traditional physical stores. According to the
    International Federation of the Phonographic Industry (IFPI)⁴, in 2007 online
    music sales rose to 15% of the global music market, from 11% in 2006 and 0% in
    2003. The 2012 revenues for the companies concerned were estimated to be at $5.6
    billion, i.e. 90% more than that of 2011, and this represents a good third of
    digital industry revenues⁵. It is a global trend although the main market is North
    America; other countries such as India, Norway and Sweden also have their own
    digital music markets. The domain of music sales is thus in the process of migrating
    from a purely physical support-based domain to a digital format. There are different
    types of online stores that offer neighboring services, online radio stations
    (e.g. Pandora, Slacker and Iheartradio), playlist subscription services (e.g.
    Spotify, Deezer and Grovesark) and music stores (e.g. Apple’s iTunes and the other
    services offered by Amazon, Google, or Microsoft.


