    # ### 1.4.1. Conceptual differences


    The four paradigms studied have a very similar approach based on the construction
    of systems from existing or future software entities. They have a common goal
    of maximizing reusability that is directly derived from the object. They share
    the same overall development process that consists of identifying software entities
    (object, agent, component or services) that meet the needs, and then combining
    these entities to make the final application. They are based on the same concepts
    of composition, for the construction of new entities from existing ones to ensure
    a consistent approach where any entity can be seen as an object, agent, component
    or service. Thus, this approach facilitates incremental development and exploitation
    of knowledge.


    However, although these four paradigms have the same overall goal, the concepts
    behind the notions of objects, components, agents, and services are different.


    Thus, we confront the following four aspects:


    +   - difference in utilization and owner’s responsibility;

    - difference in coupling;

    - difference in granularity;

    - difference in cooperation and problem-solving.


