    # 1.3. Software architecture


    For many years, software architecture was described in terms of boxes and lines.
    It was not until the early 1990s that software developers became aware of the
    crucial role that software architecture plays in the successful development, maintenance
    and evolution of their software system. A good software architecture design can
    lead to a product that meets customer needs and can easily be updated, whereas
    an improper architecture can have disastrous consequences that can lead to the
    withdrawal of the project [TAY 09].


    # 1.3.1. Object-oriented software architecture


    Object-oriented modeling creates diagrams, text specifications and a programming
    source code based on object-oriented concepts to describe a software system. Object-oriented
    modeling languages are methods and techniques to graphically analyze and represent
    object-oriented software systems. There are several methods of modeling objects
    such as designing object-oriented software (DOSS) by Wirfs-Brock, object-modeling
    technique (MOT) by Rumbaugh, OOSE by Jacobson or object-oriented analysis and
    design (OOD) by Booch. However, nowadays, most of these methods have been integrated
    into Unified Modeling Language (UML) by Booch et al., and, are no longer practiced
    by analysts. Object-oriented software architecture is used to describe a system
    as a collection of classes (entities to be abstracted and the encapsulation of
    functionalities) that have objects (instances) and communicate between themselves
    by sending messages [OUS 99, OUS 05].


    # 1.3.1.1. Advantages and disadvantages of object-oriented software architectures


    Object-oriented software architectures offer several advantages as follows:


    +   - They are based on well-defined methodologies to develop systems on the basis
    of a set of requirements.'
