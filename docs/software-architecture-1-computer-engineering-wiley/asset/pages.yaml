    to be adaptable; so they focus on the design phase and suggest a number of design
    principles and suitable guidelines to enable adaptation. For the same SBA, several
    adaptation strategies can be adopted and the selection of the most suitable can
    be a complex issue, hence multiple criteria have to be considered. Therefore,
    they provide the guidelines to support this selection. The authors also discuss
    the effectiveness of the proposed methodology by means of the real-world scenarios
