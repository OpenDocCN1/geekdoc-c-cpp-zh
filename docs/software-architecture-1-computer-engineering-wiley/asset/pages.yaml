    and consists of a set of models that describe the architecture.


    # 3.3.4. The views and beyond approach


    Within the SEI (Carnegie Mellon), Clements et al. developed the V&B approach [CLE
    02] for documenting software architectures. This approach, as its name suggests,
    uses views to achieve a fundamental organization of software architectures. In
    fact, V&B approach is based on the principle that the documentation of a software
    architecture begins with the documentation of its relevant views and, thereafter,
    documenting the information linking these views together.


    As in the case of IEEE 42010, the V&B approach is for all viewpoints in the development
    process of the computer system, and aims to provide documentation of a software
    architecture that is decomposed into several views for the different stakeholders
    and meets their requirements.


    In this approach, a three-level hierarchy is defined as follows:


    +   - The viewpoints: the viewpoints defined in IEEE 42010, a viewtype represents
    a category of views and is for one or a set of stakeholders. There are three viewtypes:


    +   - the module viewtype represents the structure of the system in terms of a
    set of units of code;


    +   - the component and connector (C&C) viewtype represents a set of elements
    that interact during the execution;


    +   - the allocation viewtype represents the relationship between the software
    components and non-software components as machinery and processing elements.


    +   - The styles: an architectural style also known as an architectural pattern
    is a high-level pattern that assists to specify the basic structure of an application.
    such as the adaptability of the user interface or distribution. Styles are grouped
    in viewtypes, which are considered as categories of styles. For example, the client-server
    model is a style for the C&C viewtype. The list of styles defined for each viewtype
    is illustrated in Table 3.1. It should be noted that the concepts of style and
    category of style are not specific to the V&B'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'approach but have already been proposed and widely reported in other works
    in software architecture, especially in the book of Buschmann et al. [BUS 96].


    +   - The views: it represents collections of system elements and relationships
    that link them. Note that the architectural views are documented in a template
    defined by the designers of this approach. In fact, an architectural view is always
    consistent to a style of a typeview.


    | Viewtypes | Styles | Views |

    | --- | --- | --- |

    | Module | Decomposition | |

    | | Generalization | |

    | | Uses | |

    | | Layers | |

    | | Pipe-and-filter | |

