    in an open marketplace using grid services).


    The Business Process Execution Language for Web services (BPELWS or BPEL in short)
    [JOR 07] is an XML-based language to describe the behavior of business process
    based on Web services (in terms of WSDL). Originally, the BPEL has been released
    by Microsoft, IBM, Siebel Systems, BEA and SAP by merging the specification of
    Microsoft''s XLANG [THA 01] and IBM''s WSDL [LEY 01]. A BPEL business process
    interoperates with the Web services of its. The BPEL can be used to define two
    kinds of processes, namely executable processes and abstract processes. The abstract
    process is a protocol that specifies the message exchange between different processes
    without revealing their internal behavior. The executable process specifies the
    execution order of a number of activities. An activity can either be a primitive
    activity (e.g. invoke, reply, wait and assign) or a structured activity. The structured
    activities are a combination of primary activities in order to enable the presentation
    of complex structures such as sequence, switch, and flow.'
