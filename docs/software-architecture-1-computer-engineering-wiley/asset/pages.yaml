    # 4.7.5.3. Coordination of parallel adaptation plans


    Coordinating the executions of plans addresses the issue of applying several adaptation
    plans in parallel with a group of adaptation managers when the plans contain dependent
    adaptation actions. In such a case, applying these plans must be coordinated,
    in the sense that a specific sequence of their actions execution must be taken
    in order to achieve a consistent application configuration. It may, for example,
    involve following a particular order to apply first an a1 plan of a P1 plan, an
    a2 action of a P2 plan.


    In our approach, the coordination aspect of adaptation plan executions is considered
    since the planning phase. During this phase, we insert treatments needed to coordinate
    their execution into the adaptation plans, during the runtime phase. The treatments
    are specified in a plan in the form of coordination actions, in addition to adaptation
    actions. We call a plan including such coordination actions, which enable dependencies
    on other plans executed in parallel, a coordinated plan. Next, during the runtime
    phase, the interaction of adaptation managers enables coordination of the adaptation
    executions.


    The determination of a coordinated plan is ensured by the “Planner” component.
    To run plans in a coordinated way, the adaptation manager must include an additional
    subcomponent type “Coordinator”, and the “Executor” component is extended by new
    interface types, to communicate with it


    Then, we describe how to plan coordinated plans. Next, we specify how a group
    of coordinated plans are applied by cooperating executors. A replica consistency
    protocol adaptation example will illustrate our proposal.


