  md: 'A reference architecture design process must take into account significant
    requirements for the products in the line, as well as the evaluation of the architecture
    of each product in relation to these requirements [DEB 98]. Hence, the software
    architect must, on the one hand, derive the concrete architecture of each domain
    product from the reference architecture and, on the other hand, evaluate this
    concrete architecture to determine whether it satisfies this significant requirements.
    If an evaluation is negative, the reference architecture must be reviewed if it
    is not right.


    Approaches such as PuLSE-DSSA and the Software Engineering Institute (SEI) product
    line framework framework suggest the definition of an iterative process where
    the activities of variability management are integrated into a classic architectural
    design process [ETX 08]. For example, in their method, Clements et al. suggest
    the integration of the activity of variability management within their attribute-oriented
    method (ADD) for designing a software architecture based on quality scenarios
    for all the domain products [DEB 98]. Similarly, PuLSE-DSSA presents an iterative
    process where different types of scenarios are identified, then ordered and finally
    used to evaluate and refine the architecture.


    Figure 5.10 shows an overview of the design process for an architecture by taking
    significant requirements into consideration. It is based on the plan proposed
    by PuLSE-DSSA in [DEB 98], but is adapted for the terms and concepts in this chapter.
    The figure shows a set of entries for the process, which include a model for external
    variability and a set of significant requirements for the architecture.


    The model for external variability can be an orthogonal model such as a features
    model, or else it can be integrated into other models displaying the significant
    requirements for the architecture. From these entries, the software architect
    specifies a set of scenarios for evaluating the possible architectures. He/she
    starts with an initial architecture which is iteratively evaluated, in comparison
    with a scenario; then, the evaluation results serve to refine the architecture
    and so forth. As highlighted above, these activities must be integrated into a
    current architecture design approach such as Attribute-Driven Design (ADD). At
    the end of the process, all the evaluations and refinements have been completed,
    and in principle, the architecture integrates all the requirements necessary for
    the concrete product architectures. Figure 5.10 also shows the characteristic
    data produced by the process:'
