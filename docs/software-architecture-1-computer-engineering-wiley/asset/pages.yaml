    Hereafter, we consider that software architecture is itself a system and therefore
    responds, in the same way as a system, to the set of concepts and modeling techniques
    that we introduce later in this chapter.


    # 3.4.2. Concepts and basics


    # 3.4.2.1. Modeling


    Modeling is an act of identifying a system and then designing a model (or image)
    similar to this system. The similarity implies a one-to-one correspondence between
    the system and its image (model). This conceptualization of similarity is translated
    by:


    +   - An isomorphism: it is a bijective correspondence, such that every element
    of the model (co-domain) matches an element and only one element of the system
    (domain) and vice versa;


    +   - A monomorphism: it is an injective correspondence such that any element
    in the system (domain) corresponds to at least one element of the model (co-domain),
    but not every element of the model has a correspondence with an element of the
    system;


    +   - An epimorphism: it is a surjective correspondence, such that every element
    of the model (co-domain) matches at least one element of the system (domain),
    the opposite not being true.


    It is clear that, to study a system, the ideal correspondence is isomorphism.
    However, on the one hand, it is often impossible to have this type of correspondence
    for feasibility reasons, and on the other hand, because a system generally requires
    several models to be represented (physical, thermal models, etc.). Also, we will
    give the following definition to modeling.


    DEFINITION 3.1.— Modeling is an epimorphism between a system and a model whose
    purpose is to provide a simplified and observable representation of the structure
    and behavior of the system.'
