  md: 'Software Architecture for Product Lines 203


    works: [CZA 05a, STA 06, VOE 07]. This form of engineering enables a uniform and
    flexible display of various information appearing in a product line. It also authorizes
    a display of the transformation process, while remaining within a homogeneous
    framework. Finally, it offers numerous tools for exploiting this information,
    which is indispensable for productivity and scaling up. The book by [ARB 12] is
    rightly centered on the use of model engineering for product lines. It proposes
    an approach for the fine-grained resolution of variability, which is sometimes
    necessary for describing and realizing applications. This approach is also equipped
    with support for Eclipse¹.


    # 5.7. Conclusion


    Product line engineering aims at rationalizing the development of a set of similar
    software applications by concentrating on the reuse of a component kernel. The
    ultimate aim of this form of engineering is to improve productivity, i.e. to reduce
    the cost of development and time taken to put on the market and to increase quality.
    The practical experiments done more than 15 years ago have shown that these benefits
    are on the cards as long as the development follows certain conditions.


    An important component in this form of engineering is the reference architecture.
    It describes the encompassing architecture of all the domain products and associates
    variation points with mechanisms for adapting and assembling the components for
    generating the variable parts of products. To define a reference architecture,
    it is necessary to consider the external variability of products in the line,
    i.e. the similarities and the functional differences of applications. Very often,
    this variability is expressed through a features model, which is important for
    the architecture design and product configuration. The reference architecture
    must also integrate internal variability, i.e. that of the development choices
    or that emerge from non-functional requirements with an architectural impact.
    This variability can be displayed in various ways, using annotations, specific
    modeling languages or with the help of additional features models.


