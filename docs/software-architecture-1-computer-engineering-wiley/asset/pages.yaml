  md: '# Software Architecture 1


    The 1980s witnessed the proliferation of object-oriented languages: Objective
    C (early 1980s), C++ (C with class structure) in 1983, Eiffel in 1984, Common
    Lisp Object System in 1987. The 1990s saw the golden age of enhancement of object-oriented
    programming in different sectors of software development. Currently, the object-oriented
    approach is considered as the reference model for all other approaches.


    The object-oriented has been completed with the remote method invocation (RMI)
    mechanism, with the aim of introducing the concept of distribution in the programming
    model. RMI is mainly based on the principle of object request broker (ORB) [GAS
    92, VIN 97].


    # 1.2.2. Component-based paradigm


    The component-based paradigm was proposed by Mellroy [MCI 68] in which he implemented
    an infrastructure on Unix using pipeline components and filters. Component-based
    development appeared in the early 1990s in response to the failure of the object-oriented
    approach to meet the requirements of reuse and composition. The component-based
    approach extends the object-oriented paradigm by stressing the importance of reuse,
    the separation of problems and the promotion of composition [PAP 07].


    Reading and understanding an existing code is always a tedious task for developers;
    however, it is highly advantageous to reuse an existing code in the form of a
    component. In fact, a developer only needs to know what a component includes,
    and not how it was implemented. In addition, in the component-based approach,
    a clear distinction is made between the development of a component and that of
    a system. In the first case, we focus on the arrangement of the component and
    in the second case, we focus on the assembly and composition of compatible components.


    # 1.2.3. Agent-oriented paradigm


    The agent-oriented paradigm appeared in the 1970s under the leadership of distributed
    artificial intelligence (DAI) where Hewitt [HEW 73, HEW 11] proposed the concept
    of actors, i.e. competing interactive autonomous entities. In the mid-1990s, collective
    models called multi-agent systems (MASs) came into existence. In these models,
