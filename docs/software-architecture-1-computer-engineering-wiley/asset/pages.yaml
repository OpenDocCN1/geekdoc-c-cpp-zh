    # ### 5.3. Domain engineering


    Domain engineering is the process in which the similarities and variability of
    products in the line are defined [POH 05]. The development team starts with domain
    analysis to identify and model the common functions and product variables. This
    analysis, in fact, defines the domain, i.e the set of products in the line. Furthermore,
    this process sets in motion a true lifecycle, allowing the reference architecture
    and product production to be defined. Finally, this process will lead to the creation
    or identification of reusable elements for the product.


    > DEFINITION 5.7.– *Domain engineering is the process which comprises domain analysis
    and design.*


    # ### 5.3.1. Domain analysis


    During domain analysis, the development team analyzes the functional requirements
    of products in the line to extract their similarities and variability.


    > DEFINITION 5.8.– *Domain analysis is the process that identifies, organizes
    and documents similarities and external variability from the functional requirements
    of products in the line.*


    Due to the multiplicity and variability of products, requirements can be classified
    into several categories [CHE 98, K 90]:


    +   - mandatory requirements, which must be realized in the whole product;

    - optional requirements, which are present only in some products;

    - alternatives that are choices exclusive to each other, which certain products
    must realize.


    There are several approaches for realizing a domain analysis (e.g. [CHE 09, KHU
    09]). Each of these methods proposes the capture of similarities and variability
    and some means of specifying these elements using the previous'
  merge: -1
