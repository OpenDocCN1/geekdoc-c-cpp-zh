    # 5.5. The reference architecture design process


    In the development process for a product line, the architect must satisfy a set
    of significant requirements [BAS 12]. This set comprises the functionalities expected,
    quality attributes and technological constraints that the architect must consider
    when designing the architecture. For example, in electronic business software,
    there are requirements relating to the functionalities which must be implemented
    in each business, which occur in commercial transactions. Some elements, such
    as the type of coding used, transaction protection (security) or even the protocol
    and technologies used, have an important impact on the architecture. In the SongStock
    line, the non-functional requirements listed in section 5.2.4 can give rise to
    architectural considerations, e.g. the modularity to favor scaling up and extensibility.
    To be effective, the architecture must take into account considerations, including
    service quality, security or technological choice considerations. Normally, designing
    an architecture necessitates activities for specifying these requirements and
    constraints and also for evaluating the alternative architectures to choose the
    best compromise. The architecture design is strongly influenced by external and
    internal variability, but it is not the only aspect to consider.'
