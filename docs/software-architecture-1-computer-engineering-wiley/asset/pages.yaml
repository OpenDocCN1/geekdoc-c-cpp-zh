    deadlock-freedom, reachability and liveness) of the interaction with the adapted
    services. The adapter generation phase generates the Service Execution Trees (SETs)
    of two partner services and an adapter mediating the interaction between them.
    The SET of the BPEL process is a tree describing all the possible scenarios of
    executing the basic activities. In this phase the YAWL workflow of the adapter
    A from SET(A) is generated if the adapter has at least one successful trace.


    Kongdenha et al. [KON 06] present an adaptation approach in terms of service modification
    by proposing an *aspect-oriented* paradigm.


    The main contribution of this approach is to apply the aspect-oriented programming
    paradigm to specify the adaptation template of mismatch pattern in the form of
    an *aspect template*. Each aspect template includes a set of (*query, advice*)
    pairs that provide a collection of *adaptation aspects*. These adaptation aspects
    can be merged with the *run-time instances* of an adapted service. The pair (*query,
    advice*) determines where and based on what logic the adaptation has to be applied.
    *Advice* defines the adaptation logic by comprising the procedures with one or
    more actions to resolve an adapted mismatch. A *query* language is described as
    a *checkpoint* at which point a set of activities associated with the advice should
    be executed. The aspect template for interface mismatch can be initiated by providing
    the *query input parameters* and XQuery/XSLT transformation function using *advice
    parameters*. In the case of a business protocol mismatch, if a service needs to
    receive an *ack* message, while the partner does not supply it, the adapter can
    provide such a message by evaluating the list of order message exchanges.


    Moreover, the authors argue their motivation to exploit the aspect-oriented methodology
    for dynamic plugging and unplugging the adaptation logic to partner services at
    *runtime*. They also provide conditions for deciding which of two methods, service
    modification (respecting aspect-oriented methods) and generating a stand-alone
    adapter, is preferable. In addition, they implement a tool that assists the developers
    in semi-automatic generation of their adapter logic.


    Although the authors in [KON 09] present an approach by focusing on both adaptation
    methods (i.e. *developing stand-alone adapter and service*)'
