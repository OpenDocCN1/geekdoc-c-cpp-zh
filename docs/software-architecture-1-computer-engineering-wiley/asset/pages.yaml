  md: 'Also, we have emphasized the views and points of views are insufficient to
    develop the complex model of a software architecture and suggested the need for
    a hierarchical approach that reveals different levels of understanding in a view,
    thereby gradually controlling complexity.


    Finally, we introduced our approach called MoVAL, which offers a description of
    a software architecture based on the concepts of views, points of views and levels
    of hierarchy. It helps to divide an AD into several views and levels associated
    with reducing the complexity of the models achieved and better meeting the expectations
    of various stakeholders, namely in the personalization of models, in their representations
    at gradual levels of complexities and thereafter, in a straightforward understanding
    of the models.


