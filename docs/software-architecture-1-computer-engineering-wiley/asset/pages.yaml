    +   - Module view: it shows the structure of the architecture in terms of packages,
    classes, containment, specialization/generalization and relationships. To represent
    this view, UML class diagram can be used.


    +   - Runtime view: it shows the structure of the systems, which will be built
    on the base of reference architecture, when these systems are executing. Since
    this view refers to a view of the reference architecture, it should show the behavior
    of all the systems derived from the architecture in a higher level of abstraction.
    This view can present the subsystems, components, packages, objects, and required
    interfaces, ports and connectors. UML component diagram can be used to represent
    this view.


    +   - Deployment view: it describes the hardware (such, as server machines, database
    servers and client machines), the software or systems that are installed on that
    hardware, and the network connections if they exist. An adequate technique to
    represent this view is the UML deployment diagram.


    +   - Conceptual view: it aims at describing and supporting the understanding
    of each domain concept or term used in the reference architecture. For describing
    this view, ontologies, controlled vocabularies, taxonomies, thesauri and concept
    maps, among others, can be used. Regarding ontology, it basically consists of
    concepts and relations, as well as their definitions, properties and constraints
    expressed by means of axioms [USC 96]. ProSA-RA proposes to use ontologies to
    represent this view [NAK 07].


    Our experience has shown that these views are sufficient to represent reference
    architectures; however, other architectural views can also be adopted. For instance,
    an enterprise view can be adopted if it is required to represent the scope, purpose
    and policies of the architecture [LOP 09]; UML'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'can also be adopted to describe this view. Furthermore, when establishing reference
    architectures for critical domains, such as critical embedded systems, safety-critical
    systems and hard real-time systems, a formal representation of these architectures
    is interesting. For this, formal ADLs can be adopted [BAS 05, CHE 10, FRI 99];
    however, they must be investigated and possibly adopted to represent the reference
    architectures.


    In order to conduct this, software architects, supported by domain experts, build
    the architectural views using their experience in architectural design. At the
    end, this step results in an architectural description composed of a set of architectural
    views of the reference architecture.


    # 2.4.4. Reference architecture evaluation


    The quality of reference architectures is important, since such architectures
    will be used as the main basis of a set of systems of the given application domain.
    Thus, if these architectures have quality, the systems resulted from them probably
    have more quality as well. Quality in reference architecture refers to a set of
    quality attributes, such as completeness, applicability and understandability
    [TRI 11]. From this perspective, several initiatives can be pointed out to conduct
    the evaluation of reference architectures, for instance, adaptation of Software
    Architecture Analysis Method (SAAM) [GRA 05] and Architecture Tradeoff Analysis
    Method (ATAM) [GAL 00]. These methods can also be adopted to evaluate architectures
    in the context of ProSA-RA.


    In another direction, ProSA-RA proposes the use of a checklist-based inspection
    approach, named Framework for Evaluation of Reference Architectures (FERA) [SAN
    13], in order to evaluate the reference architectures. FERA was also proposed
    based on RAModel, which, as stated before, proposes a large set of elements that
    can be used to describe the reference architectures. In brief, a checklist corresponds
    to a list of questions that guide reviewers on detecting defects in documents
    and, specifically in our work, detects defects in documents related to the reference
    architecture design. Our checklist is composed of 78 multiple choice questions,
    whose answers vary from “fully satisfactory” to “totally unsatisfactory” (and
    a field for adding comments) and which are supposed to be answered by eight types
    of stakeholders (namely, architects, domain experts, analysts, software project'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 70 Software Architecture 1


    managers, designers/developers/implementers, integrators, testers and quality
    assurance stakeholders). In particular, the main intention during evaluation of
    reference architectures using FERA is to get information on (1) whether the reference
    architectures are adequately represented, i.e. they provide general information
    (such as the change history, potential risk, constraints and scope) and they use
    an adequate set of architectural viewpoints, views and models; (2) whether the
    documentation related to the reference architectures contains important information,
    such as architectural decisions, best practices and guidelines, policies and rules,
    international standards and interfaces among modules; (3) whether the reference
    architectures considered quality attributes, such as interoperability, security
    and scalability; (4) whether the reference architectures can be easily instantiated,
    and (5) what could be changed, if necessary, in order to improve the reference
    architecture documentation.


    It is important to highlight that step of ProSA-RA involves several stakeholders,
    including, for instance, software architects and testers, who sometimes do not
    have in-depth knowledge about the application domain; thus, the support of domain
    experts is relevant. Besides, ontologies can play an essential role in the scenario,
    because they support the understanding of concepts and terms contained in the
    reference architecture and, as a result, support the connection of the evaluation.


    # 2.5. Uses of reference architectures


    As reference architectures usually contain important knowledge about how to organize
    architectures of software systems of a given domain, they present several possibilities
    of use. Various purposes have guided their adoption and use, such as:


    +   - Building software systems: reference architectures can be considered an
    important basis on which concrete architectures of software systems are built.
    In brief, instantiation of reference architectures refers to the following tasks:
    (1) reading and understanding the documentation related to the reference architecture;
    (2) selecting the whole architecture or their parts that are interesting to be
    present in the software system to be developed; (3) refining and adapting the
    architecture or their parts, using the specification of the software system, including
    requirements, constraints, context of applications and so on; (4) documenting
    the architectural instance; (5) evaluating the'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'architectural instance; and (6) concreting the architectural instance through
    implementation. Note that instantiation is not a trivial task; therefore, processes
    and methods that systematize such a task are necessary. Furthermore, the inclusion
    of reference architectures in the current software processes of an organization
    is not trivial. Therefore, software processes need to be adequate to cover these
    new additional elements. Moreover, process models, such as Rational Unified Process
    (RUP), need to be remodeled, covering the tasks related to the reference architecture
    management. By adopting these processes and using reference architectures, a project
    team can potentially reduce the time, effort and mistakes, and thus can improve
    the productivity.


    +   - Domain standardization: reference architectures have been adopted as a mean
    to standardize software systems of a given domain. This standardization has occurred
    in the interfaces between subsystems that must establish communications, composing
    a more complex, large system. Moreover, reference architectures have also established
    the external interfaces of systems that are built on these architectures, facilitating
    the integration of these systems with other ones. Therefore, reference architectures
    have promoted internal and external interoperability in software systems.


    Reference architectures have also standardized the internal structure of software
    systems, i.e. they have established the set of modules and relationship and distribution
    of these modules based on architectural styles and patterns. This knowledge contained
    in such architectures can possibly reduce the efforts to design new systems as
    well as their internal and external interfaces.


    +   - Evolution of existing software systems: the most software systems present
    evolution as a natural, needed process, mainly in successful systems. These systems
    evolve for several purposes, for instance, to adapt to new contexts, modify their
    functionalities, improve their quality and so on. During this process, the reuse
    of knowledge about how to evolve them is certainly important. Reference architectures
    can be used in this context. In general, the following are necessary: (1) the
    selection of one or more reference architectures if they were not selected before,
    (2) the study of related documentation of these architectures, (3) the investigation
    of parts/elements contained in the reference architectures that could comply with
    the requirements of the required evolution, (4) the instantiation of these parts/elements
    through refinements and adequation and (5) the implementation of such parts/elements.'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'The successful use of a reference architecture in this context depends mainly
    on whether this architecture matches with the domain of the system to be evolved
    and also on the quality of such architecture. It is also interesting to note that
    this architecture has been proved successful in building software systems.


    - Deriving new reference architectures: existing reference architectures can be
    used as a basis to derive new reference architectures, in particular, for the
    same domain or neighboring domains. For instance, a reference architecture that
    has as a specific architectural style (such as client-server) can be derived to
    an architecture that has the service-oriented architectural style. In this case,
    modules must probably be mapped to services and other issues that appear with
    service orientation must be solved, such as the Quality of Service (QoS), orchestration
    or choreography, publication and discovery of services. Note that elements contained
    in previous architectures can be reused and adapted to the new architectures.
    Reduction in efforts can also be achieved with this approach, mainly when the
    previous architectures are more mature and have already been successfully used.
    An example is the establishment of a service-oriented reference architecture for
    software testing tools [OLI 1b] derived from a previous architecture for testing
    tools [NAK 07], which was based on two architectural styles: three-tier architecture
    and MVC.


    - Supporting the building of SPL: reuse in large numbers is an important concern
    in software product line engineering (SPLE) and, at the same time, reference architectures
    have presented a considerable, valuable body of knowledge about how to structure
    systems of a domain and, therefore, can be considered as important elements to
    be reused. In this scenario, the combination of reference architectures and SPL
    is the basis of SPL can be explored. Reusing knowledge contained in these architectures
    can contribute to reduce the effort required to build SPL artifacts, such as the
    variability model and the PL architecture, and, and, to, to improve the productivity
    during SPLE.


    In [NAK 13], a process to design product line architectures based on reference
    architectures is presented. This process, named ProSA-RA2PLA, is an iterative
    process that systematizes the steps to build product line architectures using
    the knowledge and elements contained in the reference architectures. As illustrated
    in Figure, 2.5, during the SPLE, in particular, the family engineering (when product
    line architectures are usually developed), ProSA-RA2PLA is responsible for supporting
    the product line architectures'
  merge: -1
  pgno: 85
