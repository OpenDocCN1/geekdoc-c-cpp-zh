    # 2.4.3. Reference architecture design


    The main objective of this step is to adequately design and represent

    reference architectures. In this scenario, the effective reuse of the knowledge

    contained in the reference architectures depends not only on raising the

    domain knowledge but also on efficiently documenting this knowledge

    through an adequate architectural description. Representation of reference

    architectures, i.e. their architectural description, in order to make them

    understandable for a wide variety of stakeholders (such as customers, product

    managers, project managers and engineers) consists of an activity essential

    for their success. From this perspective, although most architectures are

    represented in an informal way (for instance, using box-and-lines), initiatives

    that propose a means to more adequately document reference architectures

    can be identified [GUE 11].


    Considering the effectiveness of architectural views to represent

    software architectures [BAY 09, CLE 03], architectural views can also be

    adopt to describe reference architectures [GUE 11, NAK 08]. Lopez et al.

    [LOP 09] propose to use enterprise view, computational view and information

    Meland et al. [MEL 09] suggest using a component and connector view,

    and information view. To represent these views, use Unified Modeling

    Language (UML) diagrams, such as the use of case diagram, component

    digram, class and deployment diagram, have been adopted

    [LOP 09, MEL 09]. Besides semi-formal techniques of UML, reference

    architectures can also be represented using formal architectural descriptions

    languages (ADLs), such as ADLARS [BAS 05], pi-ADL [CHE 10] and

    WRIGHT [FRI 99].


    To build this architectural description, well-known architectural styles and

    patterns (for instance, client-server [EDE 94], three-tier architecture

    [ECK 95] and Model-View-Controller (MVC) [BUS 96]), as well as a

    combination of these and other styles, should be adopted. Furthermore, if

    architectural styles and/or architectural patterns were identified in step RA-1,

    they must also be considered. These styles and patterns are the basis on which

    concepts previously identified are organized. For instance, if a three-tier'
