    medium, high), which are awarded for each criterion and express our analysis of
    the current status of the three paradigms. Also note that Figure 1.8 shows a graphic
    interpretation of data presented in Table 1.2.


    # 1.4.3.3. Perspective of qualitative analysis


    The conceptual framework that we propose is built to make way for the definition
    of the user''s own assessment of qualitative perspectives. The chosen approach
    is that the user expresses their knowledge by specifying the perspective through
    which they want to study the four paradigms being compared. A particular perspective
    corresponds to the user''s focus on a specific factor. It defines a formula for
    evaluating this factor by combining the results received from the previous comparison,
    i.e. following the steps of our quality criteria.


    A qualitative perspective is the combination of:


    +   - the chosen factor to compare the paradigms;

    - the expression of the user''s expertise in relation to this factor.'
