    # 1.4.1.1.3. Multitenant nature


    An application is called "multitenant" [JAC 05] if it offers functionalities to
    many users simultaneously. It manages numerous instances at the same time and
    allows multiple isolated instances to be hosted in order to guarantee accurate
    results to its various customers.


    Similarly, an instance being run is dedicated to manage multiple parallel connections.
    In our example of video games, cloud gaming platforms support a large number of
    players in parallel. For each of these players, they must maintain a particular
    context in order to retain their respective information. This information is of
    two kinds:


    +   - Contract groups: the set of data related to the contract between the customer
    and the supplier that govern the use of the service (in our example: monthly subscription
    account number, quality, etc.).


    +   - Runtime groups: the set of data required to run the application throughout
    the use of the service (in our example: experience gained, games played, persistent
    instances, etc., in order to reproduce the exact status where the player stayed
    in his/her game).


    This multitenant principle is not necessary for an object/component/agent. In
    fact, although it may belong to multiple compositions, at runtime, different instances
    of the component are created and each are created under the responsibility of
    a customer in the context of a particular composition.


    To conclude, from a usage and owner responsibility perspective, object-oriented,
    component-based and agent-oriented paradigms are close.'
