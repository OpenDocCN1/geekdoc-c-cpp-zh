  md: '# Chapter 3


    # Multihierarchy/Multiview Software

    Architectures


    On the basis of a broad study of approaches and notation languages or description
    languages of the views of complex systems, in this chapter, we have identified
    the basic concepts brought by the views, from their definition to their integration
    through their decomposition into multiple hierarchies of abstraction, description,
    conceptualization and modeling.


    # 3.1. Introduction


    Software architectures have made a real contribution to the development of complex
    distributed systems. On the one hand, their main characteristics come from their
    power to manage abstractions and levels of expression of a system and, on the
    other hand, in their ability to take into account the modeling of the structure
    and behavior of a system. Nowadays, it is widely accepted that one of the critical
    issues in the design and development of any complex software system is its architecture,
    i.e. the organization of the architectural elements that constitute it. Good architecture
    can help produce the critical properties of a system (reliability, portability,
    interoperability, etc.). However, bad architecture can have disastrous consequences
    on the system. Moreover, good architecture can serve as a system’s “conscience”
    during its development. In fact, it guides the process of a system’s evolution,'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 84 Software Architecture 1


    for example by indicating which aspects of the system can be modified without
    compromising its integrity.


    Nowadays, new engineering applications, in particular those dedicated to the design
    and development of complex distributed systems, have highlighted the need for
    manipulating multiple views of the same architectural element. The sustainability,
    adaptability and scalability of such systems becomes very important economic issue.
    In fact, having needed several years of development and maintenance (human resources
    / months), it becomes imperative for these systems to allow for a consequent life
    and especially to respond to the changing needs of the different categories of
    users involved in modeling these systems. In this chapter, we discuss, in general,
    various existing approaches to the views of a system and, in particular, in software
    architectures, while stressing the key indispensable concepts for taking these
    views, and the different levels of hierarchy carried by these views, into account.


    # 3.2. Existing viewpoint approaches


    # 3.2.1. Introduction


    The viewpoint concept, also called view, takes various meanings across the field
    of computer science. In general, we are interested in the views as soon as we
    model complex systems involving a large amount of data that requires the cooperation
    of several experts from different fields of knowledge and points of interest,
    and addressing a wide range of users. As discussed in [NAJ 98], a viewpoint likes
    a designer, an ever of discourse (i.e. the system model) and the goal that the
    designer is trying to achieve. The viewpoint enables a partial representation
    of the system to be modeled, while highlighting one or more aspects of the latter
    and concealing others.


    The first work on viewpoints falls within the field of knowledge representation
    in artificial intelligence. Here, we can mention the work of Minsky [MIN 75] followed
    by KRL languages [BOB 77], LOOPS languages [BOB 83] and ROME languages [CAR 90],
    which all have highlighted the need to bestow several representations to the same
    object.


    In databases, the viewpoint concept was introduced in 1975 for the first time
    in Ansi/Sparc''s report under the name external schema. An external schema represents
    the unique point from which users can access data from the database. This is a
    part of the base, which interests a user or group of users and'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'incorporates the concept of access rights. A viewpoint restricts the visibility
    of data and/or adapts their structure to the application requirements. It helps
    solve problems related to the configuration of the user interface for the data
    protection, for the evolution of data organization needs without disrupting the
    existing organization as well as for the query optimization.


    In software engineering, the motivation of the viewpoint is the separation of
    concerns. Thus, points of views are introduced as construction elements for the
    management of the complexities of artifacts products (such as requirements specifications,
    design models and programs). In the following, we conduct a survey on views in
    four areas of software engineering, which are requirements specifications, system
    modeling, system implementation and software engineering architectures. We extend
    the review to software architecture as it is closely connected with the purpose
    of our study.


    # 3.2.2. Views in requirements specifications


    In 1979, Mullery developed a formal method for the specification and modeling
    of complex computer systems CORE [MUL 79]. In this method, he proposed to break
    down the modeling process into several steps and, for each of them, to identify
    the viewpoints associated with them, so as to finally achieve a schematic representation
    of the system while taking into account viewpoints of this system.


    +   Finkelstein et al. [FIN 89] and Robinson et al. [ROB 90] developed methods
    and tools for the derivation of the computer systems specifications from a dialogue
    between different points of view. Delugash et al. [DEL 90] represented the needs
    associated with each viewpoint in a conceptual graph. Then, an integration of
    the different graphs into a single graph is carried out. The graph achieved specified
    the requirements for the entire system. Nuseibeh et al. [NUS 94] represent the
    links and relationships that can exist between the points of view through a given
    platform. Finally, in 1997, Sommerville proposed his Preview approach [SOM 97],
    which gives architects of computer systems a method and the tools to discover
    and analyze the requirements of different viewpoints.


    # 3.2.3. Views in systems modeling


    In terms of systems modeling, the UML symbol proves that it embodies the broader
    concept of the viewpoint. In fact, in its current standard, the'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'UML proposes 13 types of diagrams where each type bestows an implied viewpoint,
    from which a complex system will be approached, thus allowing the decomposition
    of a complex system model into several less complex, more easily affordable and
    intelligible supplementary submodels. In addition, the UML proposes an extension
    mechanism that allows users to add or customize the predefined types of diagrams
    and thus add points of views.


    In the VUML approach [AN 10, AN 11, NAS 03, NAS 09], a given extension of the
    UML is proposed. It is based on the ability to make more than one class diagram
    for the system to, and then to proceed to an integration of these diagrams into
    a single one, consistent with the proposed VUML metamodel.


    Also, Dijkstra et al. [DIJ 08] presented a platform in which the computer system
    architect can model different viewpoints of the system by determining a collection
    of basic concepts that are common to all, and then associating each viewpoint
    with a suitable level of abstraction and defining the relationships that may exist
    between the viewpoints.


    Still in modeling, in [NAJ 98], the author defines five properties that an object-oriented
    model should have in order to make it a multiview object-oriented model. These
    properties are:


    +   - a range of one viewpoint at various levels;

    - multiple representation has a repository;

    - multiple representation is decentralized;

    - partial representations exchange information between them;

    - multiple representations are consistent.


    # 3.2.4. Views within programming


    In the history of programming languages, the terms “decomposition” and “modularity”
    have always been keywords to reduce the complexity of programs. Thus, we obtain
    less complex, loosely coupled and easily reusable modules.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'The separation of concerns aims to carry out a modularization of programs based
    on various concerns. The idea is to consider a system as a core with extensions.
    The core is the set of basic functional requirements for which the system is primarily
    designed and the extensions are additional secondary requirements, which add funkcalities
    to the core. An extension is a concern that cross-cuts several basic functional
    requirements. The implementation of a concern gives rise to an aspect; hence,
    the programming called "Aspect Oriented Development" [MCH 06, MIL 99]. Other paradigms
    exist on the same principle; however, they diverge for several reasons, such as
    subject-oriented programming [DIJ 08] or view-oriented programming [MIL 99]. We
    do not extend the comparison between these different paradigms. The interested
    reader can refer to [MCH 06] for such a comparison.


    # 3.3. Views in software architecture


    Within software architecture, it is almost impossible to capture the architecture
    of a complex system in a single model that is understood by all stakeholders.
    By stakeholder, we include both the user of the future system and the manufacturer
    of the latter. A manufacturer is a person or a group of people who designs, develops,
    tests, deploys or maintains the future system.


    In each of these activities, each stakeholder has its needs, interests, requirements
    and wishes that the system takes into account. Understanding the role and aspirations
    of each stakeholder is the role of the architect during the development of the
    system.


    The recommended solution for an architectural description (AD) is to partition
    it into a number of separate and interdependent points of views, which collectively
    describe the functional and non-functional aspects (such as performance, robustness,
    availability, competition and distribution) of the system. This solution is not
    new; in fact, it goes back to the work of Parnas in [PAR 71] and most recently,
    in [PER 92], to that of Perry and Wolf.


    # 3.3.1. Contributions of the views in software architecture


    The introduction of viewpoints in software architecture contributed to to the
    improvement of the process of describing architecture in several ways [ROZ 11]:'
  merge: -1
  pgno: 100
- img_proc: true
  md: '– Separation of concerns: the separation of multiple aspects of a system using
    several different models during the design process, analysis, etc., helps a particular
    aspect while being able to focus on each step.


    – Communication with viewpoint groups: communication between viewpoint groups
    with various concerns is a challenge for the architect. Approaches based on views
    provide an opportunity for stakeholders to converge quickly towards the avid that
    interest them and to respond to their concerns.


    – Managing complexity: all aspects of a system, considered simultaneously in the
    same model, result into a complexity that a human being cannot handle. The thought
    of breaking the model into models according to different views notably reduces
    the complexity.


    In follows, we describe three approaches, which have provided satisfactory solutions
    to this problem. We quote:


    +   – 1995, P. Kruchten’ss “4+1” View Model (3.3.2);


    +   – 1996, the ISO/IEC/IEEE 42010 (section 3.3.3) IEEE Architecture Planning
    Group (APG), which was approved in 2000 by the IEEE -SA Standards Board and coed
    IEEE 1471-2000. In 2007, this standard was taken by the ISO/IEC JTC1/SC7 and named
    ISO/IEC 42010:2007;


    +   – views and beyond (V&B) approach (section 3.3.4) for the documentation of
    software architectures developed by the Carnegie Mellon Software Engineering Institute
    (SEI).


    # 3.3.2. “4+1” view model


    The “4+1” model [KRU 95] was proposed by P. Kruchten of the Rational Software
    Corp. This model is based on five main views, shown in Figure 3.1, which are as
    follows:


    +   – The logical view covers mainly the functional requirements of the system,
    or in other words, what the system provides as services to users. The logical
    view shows the system objects and the relationships between them.


    +   – The process view represents a non-functional aspect of the system requirements
    such as performance, availability, concurrence, distribution and integrity. This
    view divides the system into a set of processes and represents the interactions
    that will take place between these processes.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Multierarchy/Multiview Software Architectures 89


    - The development view focuses on the modular organization of the system. Thus,
    in this view, the system is broken down into several libraries or subsystems that
    each can be implemented by a developer or a small team of developers. This view
    covers the internal requirements of the implementation such as reusability, compliance
    with implementation standards, compliance with constraints imposed by the tools
    used.


    - The physical view mainly takes the non-functional system requirements, such
    as availability, reliability, performance and scalability, into account. In the
    physical view, software elements, such as processes and objects, will be associated
    with different physical components such as processors and hard disks.


    Scenarios represent the integration of elements of the previous views using a
    small set of scenarios that seem important.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_102_0.png)


    Figure 3.1. Kruchten''s "4+1" model


    The views offered in this model are not completely independent. In fact, matches
    can be seen between these views, for example as a match practice between a small
    class or set of classes, which will normally be represented as a module or a set
    of modules in the development view, or the process for the process view, which
    will be associated with the physical media of the physical view to be performed.


    It should be noted that this model has been adopted in the iterative development
    process called rational unified process (RUP).


    # 3.3.3. ISO/IEC/IEEE 42010


    ISO/IEC/IEEE 42010 [ISO 11] was designed by the IEEE APG in order to formalize
    the definition of software architecture and its main elements,'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 90 Software Architecture 1


    and also in order to provide a common standard for the incorporation and embodiment
    of the efforts made in this field.


    IEEE 42010 defined an Architecture or AD as being the organization of a system,
    structured by a collection of components (i.e. units) and software links or relationships
    defined between these components.


    Figure 3.2 illustrates the proposed IEEE 42010 model.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_103_0.png)


    Figure 3.2. The proposed model in IEEE 42010


    According to the proposed model in IEEE 42010:


    +   - an AD addresses a broad array of stakeholders who have concerns. A concern
    may be covered by viewpoints:


    +   - a viewpoint is a specification of the construction agreements of its own
    views. These agreements may be defined in the architecture itself or imported
    from an external entity called Model kind;


    +   - a view is consistent with a viewpoint and consists of a set of models;'
  merge: -1
