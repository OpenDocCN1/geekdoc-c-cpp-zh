  md: 'approach, which is an initiative on behalf of several manufacturers, with the
    aim of making a submission to the OMG$^{10}$. There are three types of notations
    used for variability: the classic approach with features model notations, which
    exists in numerous variants, the model-oriented approaches in the sense of model
    engineering and decision models. More accurately, decision models are the software
    industry''s pragmatic solution for the derivation of products. A recent, comparative
    summary of these notations can be found in [CZA 12]. These notations are important
    for the development of a product line and they occur at different levels: domain
    analysis, the creation of architectures or derivation of products.


    # 5.6.1. PLA and reference architecture


    The concept of a reference architecture is known in contexts other than product
    lines. They have been used to document common and reusable architectures in the
    manufacturing and technology fields. According to [ANG 12], reference architectures
    can be classified as standardization architectures, which are intended for several
    organizations, and help architectures, which are intended for only one organization.
    According to [ANG 12], a reference architecture for product lines is an example
    of help architecture, which is used to normalize the creation of products for
    the business.


    The creation of a reference architecture (in addition to technical aspects, which
    are the objective of this chapter) necessitates management, organization and process
    aspects. A comparison of PLA design methods was published in ICSE in 2004 (see
    [MAT 04]). The aim was to compare five methods (COPA, FAST, FORM, KoBr and QADA)
    from the architectural design viewpoint. The paper describes a method evaluation
    framework based on the context, target user, content and validation. The stated
    objective was to give an overview of the state of the art in the design of architectures
    for product lines. The lessons obtained from this analysis are relatively abstract
    and they provide little clarity on useful architecture or variability practices
    for today''s developers. An article by Niemela et al. [NIE 04] provides an introduction
    to basic elements for a product line architecture. The main contribution of the
    work is that it shows how to evaluate a product line'
