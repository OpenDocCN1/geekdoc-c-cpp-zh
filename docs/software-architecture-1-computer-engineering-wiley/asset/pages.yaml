  md: '154 Software Architectures 1


    The major benefit of this model is that it makes it possible to modify the initial
    strategy chosen by the initiator, and construct the global strategy progressively,
    taking into account the different local contexts of the components involved. This
    guarantees better efficiency for the final strategy when the negotiation succeeds.
    However, it also increases the complexity of the decision process, particularly
    when there are a significant number of participants and reconfiguration alternatives.
    Indeed, managers risk delaying converging on a final decision and consume resources
    calculating and exchanging offers and counter-offers. We will return to this model
    in more detail in section 4.7.5.2.


    Each decision-making coordination model is right for a particular adaptation process
    family. The choice of model depends essentially on the dependencies between the
    application components, the number of decision makers and the complexity of the
    coordination process. The use of policies makes our approach flexible. Indeed,
    each decision maker can support one or more models. For example, a decision maker
    can be a slave in an adaptation scenario and a negotiator initiator in another
    scenario. Furthermore, each decision maker can be specialized with the outcome
    that it chooses a model to use in an adaptation process depending on the context.
    For example, it behaves like a master when the network resources are weak and
    it plays the role of a negotiator initiator when connectivity is high. The decision-making
    capacities of each adaptation manager are specified by either incorporating or
    not incorporating a negotiator and through the specification of its adaptation
    policy.


    # 4.7.5.2. Adaptation strategy negotiation protocol


    Negotiation is a cooperative process by which a group of adaptation managers reach
    an agreement on a global adaptation strategy. Our protocol which is different
    from other protocols thus focuses on determining adaptation strategies. Existing
    solutions provide approaches for negotiating for example, responsibilities between
    the software components [CHA 06] or the Quality of Service offered [CAV 02]. The
    negotiation must guarantee the independence of each of the adaptation managers
    in decision-making and ensure the global validity of a local decision. For this,
    the negotiators involved evaluate the situation according to the information that
    each has, to find an acceptable compromise-based solution.'
