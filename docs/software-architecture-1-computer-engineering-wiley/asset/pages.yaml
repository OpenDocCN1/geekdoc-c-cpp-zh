  md: '# Software Architecture for Product Lines 187


    The first point to note is that common features are fairly classically implanted,
    since they are present in the whole product. In other words, there are no variation
    points. For example, for Client management, it is sufficient to include the component
    implementing this function in the whole product. This component must be defined
    in a reusable way, with good interfaces, but it is from more classic technology
    of the software component and architecture domain.


    The variation points are relevant only for optional or alternative features. For
    example, some SongStock products provide tax calculation and authorize payment
    following the two possible modes. In this case, the software architect must include
    two variation points to authorize the selection of tax calculation, and that of
    payment. These variation points and the corresponding variants can be specified
    by using an integrated variability model (e.g. annotations or UML stereotypes)
    or an OVM (often features models). For example, Pohl et al. [POH 05] have suggested
    the use of OVM to specify the variation points and variants in a software artifact.


    The rest of this section presents examples of variation points and variants to
    illustrate this approach. The following examples are component diagrams where
    the variation points are implemented using an interface, and different components
    implement this same interface. In our example, the architecture must integrate
    the service interfaces for each variation point, one for the payment method and
    another for calculating charges. Figure 5.5 shows part of the SongStock architecture
    with two variation points (labeled VP) and variants (labeled V).


    An architecture can combine different types of mechanisms for managing variations,
