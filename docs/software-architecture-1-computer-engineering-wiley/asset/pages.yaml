    # 6.3. Web service incompatibility and adaptation


    Despite tremendous efforts on the evaluation of the compatibility criteria among
    services [OUE 11, TAN 09, BAR 10], there is still significant attention required
    to verify the correctness of service collaboration. The typical approach for enabling
    incompatible services to interact is service *adaptation*. While standardization
    in Web services reduces the heterogeneity and makes their interoperability easier,
    adaptation still remains necessary. Adaptation functionality can be offered to
    enable integration inside and across enterprise boundaries. The need for adaptation
    in Web services comes from the following sources: *ensuring the interoperability,
    optimization, recovery,* and *context change*. Primarily, the mediation concept
    was introduced for databases [WIE 97].


    The authors in [NEZ 06, CHA 06, BAN 05] identify the needs for adaptation in Web
    services by addressing the heterogeneity at the levels of service interface and
    business protocol:


