  md: '# 1.5. Approaches for integrating development paradigms


    Several alternative approaches for integrating paradigms were categorized by the
    entities they aim to combine (object, agent, component and service). These approaches
    are based either on conceptual proposals or combinations of technical and conceptual
    proposals (e.g. middleware, see Table 1.3).


    The active object-oriented model is an example of an object-oriented and agent-oriented
    combination, which represents an object that conceptually runs on its own thread
    and provides an asynchronous execution of method invocations. It can thus be considered
    as a higher level concept for concurrency of the object-oriented systems [SUT
    05]. Further, language extensions to support concurrency and distribution are
    provided: Eiffel [MEY 93] is an influential proposal in this direction.


    Also in the area of agent-oriented and component proposals can be found. CompAA
    [ANI 08], SoSAA [DRA 09] and agent components [KRU 03] try to extend the agent-oriented
    paradigm with the concepts and mechanisms of the component-based paradigms. In
    CompAA, a component-based model is extended with adaptation points for services.
    These adaptation points allow for service selection at runtime according to the
    specifications of the functional and non-functional properties in the model. This
    flexibility is achieved by the addition of an agent for each component that is
    responsible for selecting the service at runtime. The SoSAA architecture consists
    of a base layer with a standard component system and a layer of agents that control
    the base layer to perform reconfigurations as an example of control. In Agent
    Components, the agents are slightly rendered as components connected using ports
    with predefined communication protocols.


    Approaches that combine the agent-oriented paradigm with SOA are primarily motivated
    by the need for dynamic service composition where agents are used to dynamically
    search and select services during the execution. These approaches deal mainly
    with aspects linked to the semantic description and research of services, but
    do not aim at paradigm integration itself. As examples, we have the agent-oriented
    invocation of services using the web service integration gateway (WSIG)⁴ of the
    Java Agent'
  merge: -1
