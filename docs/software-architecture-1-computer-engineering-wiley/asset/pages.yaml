    Wang et al. [WAN 08] characterize a runtime adaptation approach for service behavioral
    interface incompatibilities. To this end, we introduce a *service adaptation mapping*
    that includes a repository of mapping rules where each rule is associated with
    an *adaptation scenario*. When a directed single mapping rule cannot be applied,
    the adaptation mechanism exploits *backward-chaining* algorithms for firing the
    rules to detect the behavioral mismatches, i.e. deadlock and interface loss (unspecified
    message).


    The adaptation idea of this paper has been implemented as a tool named *Service
    Mediation Engine* (Megine). The Megine manages a number of adapters associated
    with specific pairs of service instances by using the identifiers and references
    of the received messages. In addition the Megine, through an *administrative console*,
    is able to implement an adaptation scenario where, before forwarding a message
    by adapter to a partner service, it is possible to check whether the target service
    is in a given state to consume this message. In this approach, both the partner
    interface and adapter protocol are modeled using the FCM specifications.


    Wohlstader et al. [WHO 06] present the policy-based programming model, architecture
    and details of their proposed middleware project called Cumulus. They also discuss
    new challenges like distribution of middleware services that arise from such a
    context. The *Cumulus* middleware can be dynamically customized to support diverse
    Web services interoperability protocols that the applications need to engage in.
    The authors aim to find an appropriate programming model to *describe, discover
    and compose middleware* as separate services (MW services). Besides, the technical'
