    Becker et al. [BEC 06] present an engineering approach for component adaptation
    which is based on the introduction of a taxonomy of component mismatches and identification
    of a number of adaptation patterns to be used as generic and systematic solutions
    for eliminating them. The provided taxonomy summarizes the different types of
    component mismatches into categories and classifies them according to a hierarchy
    of interface models. Each of the distinguished interface models determines a set
    of properties that belongs to a component interface as follows:


    +   - the syntax-based interface model, which focuses on signatures as constituent
    elements of component interfaces, supports the identification and elimination
    of signature mismatches;


    +   - the behavioral interface model which contains assertions (i.e. pre- and
    postconditions) for the operations, which have been declared in the required and
    provided interfaces. By making use of an interaction-based interface model, which
    focuses on describing the interaction that takes place between connected components
    calls, developers are able to diagnose and eliminate protocol mismatches (i.e.
    ordering and extra/missing messages);


    +   - the quality-based interface model, which focuses on the description of QoS
    (i.e which is being provided by each of the interface operations by describing
    a set of quality attributes). By making use of an interface model that is based
    on the ISO 9126 quality model, it is possible to detect and eliminate the quality
    attribute mismatches such as security, persistency, transactions, reliability
    and efficiency;


    +   - a conceptual interface model, which describes the conceptual semantics of
    component interfaces as an ontology, supports the identification and elimination
    of so-called concept mismatches.


    The presented approach demonstrates both functional and non-functional adaptation
    patterns.


    Bucchiarono et al. [BUC 10] propose an extension of a basic iterative service-based
    applications (SBA) lifecycle along with the elements to deal with the adaptation-specific
    needs. From the viewpoint of the authors, adaptation works properly only in the
    case where the application is designed'
