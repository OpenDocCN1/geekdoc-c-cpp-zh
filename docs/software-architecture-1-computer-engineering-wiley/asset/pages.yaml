  md: '# 5.4.2. Product derivation


    DEFINITION 5.14.- Product derivation is the manual or automatic process that constructs
    the final product from a functional configuration and reusable elements in accordance
    with the production plan.


    The product functional requirements, which are captured in the configuration,
    are the main data for the product derivation. From there, the reusable elements
    must be adapted and assembled in accordance with the variants chosen in the variability
    model. The rules for constructing the product are defined in the production plan,
    and this makes use of the reference architecture. The production plan defines
    the general product design assembly.


    DEFINITION 5.15.- A resolution model is an instance of a decision model which
    links variability and defines the resolution of a product.


    In a resolution model, all decisions that were open in the decision model parent
    must be closed. A resolution model is intended for the creation of a particular
    product that will include a subset of variants, the subset of necessary reusable
    elements and the adaptations required for these elements.


