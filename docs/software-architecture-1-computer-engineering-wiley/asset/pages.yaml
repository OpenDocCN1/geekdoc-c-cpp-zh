    # 2.4. Reference architecture engineering


    In general, reference architectures have been built using an ad hoc approach,
    i.e. without following a systematic process. However, systematizing their building
    is certainly interesting and achieving more effective reference architectures,
    i.e. architectures that could more completely attempt their purpose. In spite
    of the relevance of this systematization, there is a lack of processes and methods.
    However, recommendations can be found. Muller [MUL 08] has proposed a set of recommendations
    in order to create and maintain reference architectures; briefly, reference architectures
    must be understandable, up-to-date and maintainable. Trikeneks et al. [TRI 11]
    proposed a set of quality attributes for reference architectures – completeness,
    acceptability, buildability, applicability and understandability – that could
    be considered during the development of reference architectures.


    In this context, ProSA-RA is a process that systematizes the design, representation
    and evaluation of reference architectures for several domains. Notably, it is
    a result of our experience in the establishment of reference architectures for
    several domains, such as software engineering [NAK 1b, NAK 07, OLI 11a] and embedded
    systems [BOR 11, DUA 12, FEI 13]. To adequately apply this process, first it is
    important to establish the scope of the reference architecture, i.e. the target
    domain of the reference architecture. This scope can be defined by considering
    the set of systems that are intended to be produced on the basis of the reference
    architecture.


    The outline structure of ProSA-RA is illustrated in Figure 2.4. Frankly, four
    basic steps need to be performed in order to build a reference architecture by
    using ProSA-RA. First, information sources are selected and investigated (step
    RA-1). Second, the architectural requirements of the reference architecture are
    identified (step RA-2), describing the common functionalities and configurations
    present in the systems of the target domain. The architectural description of
    the reference architecture is established (step RA-3) and, finally, an evaluation
    of the resulting architecture is conducted (step RA-4). Analysts, software architects
    and domain experts should be'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'involved in performing all the steps of ProSA-RA. In the following sections,
    each step is discussed in detail.


    ![](img/03d0e0c493e6c0bcbbf39f19fc226528_77_0.png)


    Figure 2.4. Overall structure of ProSA-RA


    # ## 2.4.1. Information source investigation


    In this step, the main information sources are selected. These sources must provide
    information about the processes, activities and tasks that could be supported
    by software systems of the target application domain. Since reference architectures
    are the basis of a set of software systems of a given domain, these information
    sources must involve a more comprehensive knowledge about the domain, if compared
    with information sources when developing the architecture of a specific software
    system. From this perspective, the most relevant information sources, ProSA-RA
    highlights the following:


    +   - customers, users, researchers and developers of the application domain are
    considered relevant information sources. To get information from these people,
    techniques for requirements elicitation, such as interviews and questionnaires,
    can be used. Besides, that it is also important to concentrate on the identification
    of needs and limitations that are generally found in the application domain. Examples
    include functionalities that might be available in systems of that domain or new
    legislations and standards that will come into force for that domain and, as a
    result, it will be a need in new systems.'
