  md: '# Object, Component, Agent and Service Paradigms 33


    Reusability is the oldest of the three concerns. The earlier developers quickly
    became aware of code repetition in an application and therefore sought to define
    mechanisms to limit repetition. The object-oriented paradigm focuses on this concern
    and its development is one of the outcomes of this research. The object-oriented
    concept facilitates the conservation and the transfer of experience gained across
    different systems. It further deepens reuse, which at the outset intended to reuse
    the code as it is through the inheritance process that we are able to evolve saved
    data and behavior in order to meet special requirements. Thus, the object-oriented
    paradigm provides high reusability which has paved the way for more complex applications
    and for the identification of new limits in terms of granularity, software architecture,
    communication abstraction, etc. These limits have led us to a shift in concern
    towards comparability.


    Thus, the software engineering community has developed and introduced the CBSE
    to overcome this new challenge. Szyperski’ famous phrase “components are for composition”
    [SZY 02] illustrates this case perfectly. By definition, a component must have
    a design specifically established to support the potential composition to allow
    interoperability. Component models and associated technologies CORBA component
    model CCM [OMG 12], COM + [MIC 13], Fractal [BRU 06, etc.) exist to provide specific
    development and deployment frameworks in terms of composition patterns. Such models
    implement component formats to support the construction of codes and deployment
    rules [CRN 11]. Thus, the CBSE strengthens the control of composability and clearly
    formalizes the associated processes. Ultimately, this formalization raises the
    solid foundation needed for automation opportunities. Part of the software community
    has redirected itself towards the dynamicity concern as the predominant aspect.
    SOSE has been developed from the experience gained from objects and components;
    however, at the outset, focused on how to improve dynamicity. The SOSE seeks to
    provide an appropriate response to highly volatile environments and thus overcome
    the constraints imposed by the general purpose of the CBSE.


    Figure 1.7 summarizes these displacement-related concerns. Research from the OOSE
    focuses mainly on reuse and discusses some composability and dynamicity. The CBSE
    focuses on composability, which strengthens reusability and also seeks to automate
    its processes. The SOSE focuses mainly on the dynamicity of processes to ensure
    reuse and composition. As for the AOSE, it gives more importance to the dynamicity'
