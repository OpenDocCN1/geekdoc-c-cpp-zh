    # 3.5.2.3. Links


    Links are structural elements defined in MoVAL to clarify and formalize the relationship
    between the different levels of hierarchy in a model. As already mentioned in
    section 3.4.2.6.5, these links are grouped in four categories, namely:


    +   - inter-view links, which represent the relationship between two distinct
    levels of hierarchy belonging to two distinct views;

    - interlevel links, representing similar relationships to those relations represented
    by the inter-view links, except that the two levels of hierarchy belong to the
    same view of the model;

    - intralevel links, which necessarily represent the internal relationships between
    the elements of a same level of hierarchy;

    - users links, which necessarily belong to one of the three categories above,
    and have attributes and structural or semantic properties defined *a priori* by
    the AA. In fact, this category of links provides modularity and the use and reuse
    of structural elements of a software architecture.


    The links are defined in MoVAL through four main attributes:


    +   - source: each link is defined by its origin which is either a level of hierarchy
    of abstraction or a level of hierarchy of description of a view;

    - destination: similarly, the destination of a link corresponds to either a level
    of hierarchy of abstraction or to a level of hierarchy of description of a view;

    - semantic role: the semantic role of a link defines the nature of the relationship
    between the source and the destination, it is dependent on the associated categories
    of links and the type of source and destination elements. Thus, the semantics
    of a link can have one of these roles:'
