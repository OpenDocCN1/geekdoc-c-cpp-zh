    # 4.8. Conclusion


    In this chapter, we have presented the concept of dynamic reconfiguration, first
    in general and then by emphasizing the stakes of distributed reconfiguration management.
    We have examined the current works from a conceptual point of view, on the one
    hand, and the way in which they were implemented, on the other hand. At this level,
    we have in particular sought to identify the mechanisms for coordinating several
    distributed reconfiguration processes. Finally, we have studied the facilities
    proposed for using reconfiguration infrastructures.


    We have presented the fundamental concepts linked to our approach for the reconfiguration
    of distributed component-based applications. Our contribution consists of defining
    an approach for constructing distributed adaptation systems. In particular, we
    focused on the definition of a flexible architectural model and generic mechanisms
    for ensuring the coordination of several adaptation managers’ activities.'
