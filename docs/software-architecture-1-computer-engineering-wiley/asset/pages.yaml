  md: '# 3.4.2.4. Views and levels of hierarchy


    The key point of the modeling of a complex system, such as that of a software
    architecture, structuring the pattern associated with there. Within a model, we
    also establish two types of structures:


    +   - a vertical structure: paraphrasing the different views of the same model;

    - a horizontal structure: corresponding to a hierarchy of levels of understanding
