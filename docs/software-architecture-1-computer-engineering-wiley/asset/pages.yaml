    where the Petri net is enriched by interface places for asynchronous communication
    with partners.


    One of the challenges in working with heterogeneous Web services is the need to
    ensure their interoperability and compatibility. A variety of efforts on Web services
    fundamentally focused on adaptation techniques dealing with incompatibilities
    in service interaction. In this chapter, we abstract from non-functional requirements
    (e.g. time constraint and cost), data and information semantics. Here, we focus
    only on the behavior and interface of Web services interacting with an environment.


    The chapter proceeds as follows. In section 6.2, we discuss Web service composition
    and the crucial concepts on this area. Section 6.3 is devoted to review a number
    of service adaptation approaches from the viewpoints of their interfaces or business
    protocol mismatches.


    # 6.2. Web service composition and verification


    Service orientation allows for the creation of large distributed systems by composition
    of several heterogeneous, decentralized and autonomous Web services. Nowadays,
    the interoperability of Web services as the fundamental idea of SOA [BRO 06] for
    effective business-to-business collaboration [MED 03a] has received significant
    attention from both industry and academia, e.g. Extended Enterprise (Business-to-Business)
    pattern introduced by IBM². Web service interoperability aims to provide seamless
    and automatic communication among independent services regardless of their location
    and platform. The ability of efficient composition of heterogeneous Web services
    increases the reusability and QoS, reduces costs and can satisfy a variety of
    business demands.


