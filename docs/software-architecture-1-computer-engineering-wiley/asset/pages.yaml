  md: '# 6 Software Architecture 1


    The origin of SOSE comes from requests related to volatile and heterogeneous environments
    that need to be able to withstand increasingly volatile environments such as the
    Internet and Web services [CAS 03], ambient intelligence environments [WEI 91]
    or business applications run on corporate networks such as enterprise resource
    planning (ERP) systems [PAP 07]. The productivity of a supplier and their responsiveness
    to changing needs are major issues that SOSE attempts to provide solutions in
    software development.


    The service is a software entity that represents a specific function. It is also
    an autonomous building block that does not depend on any context or external service.
    It is divided into operations that contain specific actions that the service can
    provide. A parallel can be drawn between operations and services, on the one hand,
    and methods and classes in the OOSE, on the other hand. SOSE also has a concept
    of composite service built by combining service descriptions. The implementation
    of service composition takes place during the runtime phase.


    A key element of SOSE is the pattern of service interaction, also known as service-oriented
    architecture (SOA) that enables a range of services to communicate with each other.
    SOA is a means for design and an understanding of a software system to provide
    services to applications or other services via the publication of tracked interfaces.


    A service is an action performed (a function rendered) by a provider for a customer;
    however, the interaction between the supplier and customer is established via
    a mediator (which may be a bus) responsible for binding various participants together.
    Services are usually implemented as coarse-grained software entities. They encompass
    and propose system entities. These systems can also be defined as the application
    layers. The concept of a service represents a processing entity that respects
    the following characteristics:


    +   - Coarse-grained: operations offered by a service encapsulate several functions
    and operate on a wide range of data, unlike with the component-based concept.


    +   - Interface: a service can implement several interfaces and several services
    can implement a common interface.'
