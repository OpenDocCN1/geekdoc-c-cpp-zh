  md: '# 1.3.2. Component-based software architecture


    Component-based software architectures describe systems as a set of components
    (processing or storage units) that communicate with each other via connectors
    (interaction units). Their goals are to reduce development costs, improve the
    reuse of models, share common concepts between system users and finally build
    reusable off-the-shelf component-based heterogeneous systems. To support the development
    of such architectures, it is necessary to have formal notations and tools for
    analyzing architectural specifications. Architecture description languages (ADLs)
    stand as a good solution for this purpose [OUS 05, TAY 09].


    # 1.3.2.1. Advantages and disadvantages of component-based software architectures


    In component-based software architectures:


    +   - interfaces are generally first-class entities explicitly described by ports
    and roles;

    - interactions are separate from the calculations and are explicitly defined in
    most ADLs;

    - non-functional properties are taken into account;

    - hierarchical representations are semantically richer than simple inheritance
    relationships;

    - ADLs are enhanced by architectural styles defining a design vocabulary framed
    by a set of constraints on this vocabulary;

    - the overall description of system architecture can be specified before completing
    the construction of its components;

    - the level of granularity of a component or connector is higher than of an object
    or an association.


    However, component-based software architectures:


    +   - provide only high-level models, without explaining how these models can
    be connected to the source code. Such connections are important to preserve the
    integrity of the design;'
