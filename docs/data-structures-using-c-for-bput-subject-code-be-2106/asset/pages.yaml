  md: 'In the above table, the bit status 1 specifies that all the nodes of the memory
    are already allocated to 1 to 5 programs. Assume, program 3 and 1 complete their
    execution and the memory engaged due to these programs is released. The bit status
    2 pointed the altered status. The paging technique has some drawbacks and undergoes
    trouble for searching the best possible page frame size. In case the size of the
    program is larger and memory space allocated more memory is wasted. Similarly,
    if the page frame is small, the program has to undergo several partitions and
    it will be very tedious to match the frame with the required size. In paging technique,
    the entire program will be memory resident. In this situation, if program size
    is larger than available memory, the program will not be executed.


    **Demand Paging Method** To overcome the limitations of the paging technique,
    demand paging method is followed. In this, a large program is divided into small
    sizes of program segments and first page is then loaded the memory. If few functions
    or statements of first pages, which are currently executed in the memory having
    relation with statements which are in next, then the required page is loaded from
    disk to memory. In procedure, the operating system can take part and transfer
    the required page to the disk and vice-versa. This is known as thrashing.


    # 7.10 GARBAGE COLLECTION


    Garbage collection means the de-allocation of unused memory. Deciding when to
    release the allocated memory is very simple. The deallocation is done when the
    programmer requests by executing `free()` in C and `delete` in C++ are used to
    release the memory. The garbage collection system checks the entire memory, marks
    the unused nodes and releases the memory associated with them.


    The garbage collection consists of two steps:


    **Marking** In this process, all the accessible nodes are marked and one field
    is kept for marking. The field is marked with true or false.


    **Collection** In this process, memory allocated of all the nodes, which are not
    marked, are released.


    The garbage collection is a complex procedure and has the following disadvantages:


    +   1. The garbage collection technique is applied when there is not much space.


    +   2. The garbage collection may not be helpful if the pointers associated with
    the list are not properly pointed.


    However, the memory de-allocation is not as easy as it appears. The memory allocated
    dynamically at run time can be de-allocated but some must be taken. The dynamic
    structure such as linked list contains nodes, which are dynamically created and
    contains reference of next nodes.'
