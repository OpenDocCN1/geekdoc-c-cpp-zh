  md: '# 11.4 SELECTION SORT


    The selection sort is nearly the same as exchange sort. Assume, we have a list
    containing n elements. By applying selection sort, the first element is compared
    with all remaining (n–1) elements. The smallest element is placed at the first
    location. Again, the second element is compared with remaining (n–2) elements.
    If the item found is lesser than the compared elements in the remaining (n–2)
    then the swap operation is done. This entire array is checked for the smallest
    element and swapped.


    11.3 illustrates the process of sorting elements by selection sort. In each pass,
    one element is sorted and kept at the left. Initially, the elements are temporarily
    sorted and after next pass, they are permanently sorted and kept at the left.
    Permanently sorted elements are covered with squares and temporarily with circles.
    Element inside the circle “O” is chosen for comparing with the other elements
    marked in a circle and sorted temporarily. Sorted elements inside the square “□”
    are shown.


    | Pass | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---||}{

    | 1 | 2 | 6 | | 8 | 5 |

    | 2 | | 6 | 4 | 8 | 5 |

    | 3 | 2 | 4 | 6 | 8 | 5 |

    | 4 | 2 | 4 | 5 | | 6 |

    | 5 | 2 | 4 | 5 | 6 | 8 |

    | SList | 2 | 4 | 5 | 6 | 8 |


    11.3 Selection Sort


    Consider the elements 2, 6, 4, 8, and 5 for sorting under selection method.


    Time Complexity The performance of sorting algorithm depends upon the number of
    iterations and time to compare them. The first element is compared with the remaining
    n–1 elements in pass 1. Then, n–2 elements are taken in pass 2. This process is
    repeated until the element is encountered. The mathematical expression for these
    iterations will be equal to (n–1)+(n–2)+… +(n–n–1)). Thus, the expression becomes
    n\*(n–1)/2.'
