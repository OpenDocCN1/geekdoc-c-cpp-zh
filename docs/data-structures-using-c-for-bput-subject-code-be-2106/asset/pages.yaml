    **Path** A path from edges $u_i$ to node $u_n$ is a sequence of nodes $u_0, u_1,
    u_2, \dots u_{n-1}, u_n$. Here, $u_0$ is adjacent to $u_1$, which is adjacent
    to $u_2$ and $u_{n-1}$ is adjacent to $u_n$.


    **Length of Path** Length of path is nothing but total number of edges included
    in the path from source node to destination.


    **Closed Path** When first and last nodes of the path are same, such path is known
    as closed path. In Fig. 10.9 closed path at node A is shown.


    ![](img/c2f6b24e88575cdba9137937a75b3615_382_0.png)


    Figure 10.9 Closed Path for Node A


    **Simple Path** In this path all the nodes are different with an exception that
    the first and last nodes of the path can be similar.


    **Cycle** Cycle is a simple path. The first and last nodes are same. In other
    words, a closed simple path is a cycle. In a graph path is known as cycle if it
    has one or more nodes. The starting node is connected to the last node. In an
    undirected graph path is called cycle if it has at least three nodes. The starting
    node is connected to last node. In the following figure ACDBA is a closed path.
    Example of a cycle is shown in Fig. 10.10.


    ![](img/c2f6b24e88575cdba9137937a75b3615_382_1.png)


    Figure 10.10 Example of a Cycle


    **Cycle Graph** A graph having cycle is called cycle graph. In this case the first
    and last nodes are the same. A closed simple path is a cycle. This is same as
    closed path shown in Fig. 10.11.


    **Acyclic Graph** A graph without cycle is called acyclic graph. Examples of acyclic
    graphs are shown in Fig. 10.11.


    **Dag** A directed acyclic graph is called dag after its acronym (reduction).
    Fig 10.12 is a graph showing the dag.


    **Degree** In an undirected graph, the total number of edges linked to a node
    is called degree of that node. In a directed graph there are two degrees for every
