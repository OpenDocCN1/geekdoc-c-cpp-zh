    # Explanation:


    In this program operation creation and display of linked nodes is as similar as
    explained in the last programs. Here, we are going to discuss insertion at a specified
    position carried out by a function atpo().


    The position number specified by the user after reducing value by one is passed
    to function atop(). The variable c, formal argument of p gets this value. Another
    variable c is declared in the body of atop(). The variable c is incremented and
    successive nodes of the linked list are accessed by the statement header->header->next;

    Consider the statements


    +   a. if (k==1) pr-first;

    b. if (c==k) pr=header;

    c. if (c=(k+1)) su=header;


    The insertion of node can be done between two nodes and hence the preceding and
    succeeding nodes must be stored in separate pointer variables. When the user specifies
    two, the entered value is reduced by one and becomes one and stored in variable
    k.

    When k is one, the address of first node is stored in the pointer pr. When k is
    the statement (b) has no reason to consider. The address of succeeding node is
    obtained in the statement (c). The address obtained is stored in the pointer variable
    su. Thus, by using following statements are linked:


    +   a. pr->next=nw;

    b. nw->next=su;

    c. header->next=first;


    Before execution of the above statements, the new node is created using nw pointer.
    The nw is a node to be inserted.

    The address of data field of node nw is linked to the previous node (pr) by the
    statement pr->next=nw.

    The address of succeeding node is stored in the linked field of new node by the
    statement nw->next=su.


