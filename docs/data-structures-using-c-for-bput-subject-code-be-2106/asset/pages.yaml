  md: '# 8.2 Data Structures Using C


    Infix Notation Expressions are generally expressed in infix notation with binary
    operator between the operands. The binary operator means the operator requires
    two operands such as +, *, / and %. In this type, the operator precedes the operands.
    Following are examples of infix notation:


    +   1. x+y

    2. x*y*z

    3. (x+y) *z

    4. (x+y) * (p+q)


    Every single letter (A-Z) and an unsigned integer is a legal infix expression.
    If X and Y are two valid expressions then (X+Y), then (X-Y) and (XY) are legal
    infix expressions.


    Prefix Notation The prefix notation is also called polish notation. The polish
    mathematician Lukasiewicz invented it. In this type also the operator precedes
    the operands. Following are the examples of prefix notation:


    +   1. +xy

    2. +x*yz

    3. ++xyz

    4. ++xy+pq


    Postfix Notation The postfix notation is also called as reverse polish notation.
    The operator trails the operand. Following are the examples of postfix notation:


    +   1. xy+

    2. xyz*+

    3. xyz+*

    4. xy+pq*+


    Consider the following example:


    X+Y*Z


    In the expression, we know that the multiplication has higher precedence than
    addition. The expression X+(Y*Z) is the same as the expression X Y*Z. By applying
    rules of priority, we can convert the expression to postfix notation.


    X+ (Y Z)


    Here, parentheses are not necessary.


    X+ (YZ*) +


    Here, multiplication is converted to postfix.


    X(YZ*) +


    Here, addition is converted to postfix.


    XYZ*+


    The above equation is postfix form. While doing the conversion operations, following
    points are important.


    +   1. When we convert an expression from prefix to postfix form, it is essential
    that properties like precedence, commutability and well-formed expressions of
    operators must be preserved.


    +   2. The operations with high priority are converted first and the remaining
    part of the expression are converted to postfix form. Table 8.1 shows infix to
    postfix of an expression. The remaining part is considered as a single operand.'
