  md: '# SUMMARY


    +   1. Tree is a useful data structure of non-linear type. Elements are arranged
    in a non-linear fashion in a tree. A tree structure means that data is organized
    in branches.

    2. Tree has several practical applications. It is useful in manipulating data
    and to protect hierarchical relationships among data.

    3. Root is the mother node of a tree structure. This is the most important node
    of any tree. The node of a tree stores the data and its role is the same as the
    linked list. Nodes are connected by means of links with other nodes.

    4. When the predecessor of a node is parent, all successor nodes are child nodes.
    The link is a pointer to a node in a tree structure. In other words, link connects
    the two nodes. The link drawn from one node to other node is called link.

    5. The highest number of nodes that is possible starting from the first node (root)
    to a leaf node is called the height of a tree.

    6. A general tree is similar to the family tree.The origin of the family is called
    the root node. The various generations are represented in hierarchical structure
    with nodes.A tree is a finite set of one or more nodes.

    7. A binary tree is a finite set of data elements. A tree is binary if each of
    its nodes has a maximum of two. The element is either empty or holds a single
    element root along with two disjoint sub-tree and right sub-tree,i.e. in a binary
    tree the maximum degree of any node is two.

    8. A tree is called a binary tree if each of its nodes has two children, except
    the last nodes. In other words, every non-terminal must have both children except
    the leaf nodes.

    9. Three parameters are needed for the formation of binary tree. They are node,
    left and right sub-trees. Traversing is one of the most important operations done
    on binary tree and frequently this operation is carried on data structures. Traversal
    means passing through every node of the tree by one. Every node is traversed only.

    10. A binary search tree is also known as binary sorted tree.

    11. The B-tree is also known as the balanced sort tree.The B-tree is used in external
    sorting. The B-tree is not a binary tree.

    12. The AVL tree is a binary search tree. It is also known as height balanced
    tree. It is used to minimize the search time by keeping every node of the tree
    completely balanced in terms of height. The balance factor plays an important
    role in the insertion and deletion of elements in an AVL tree.


