    We have already studied the different stack operations. Now, we will study how
    stack can be useful in problem solving. Consider a mathematical expression.


    ```

    5 - (( A * ( B + K ) / ( U-4 ) + K ) / 8 (8-4.3 ))

    ```


    The common mistake, which can be made frequently by the programmer, unbalance
    of parenthesis. For correct representation of mathematical expression, the following
    precautions must be taken:


    +   1. There must be equal number of left and right parenthesis.

    2. Each left parenthesis must be balanced by right parenthesis.


    The expressions ((x+y) and x)+y (-we are wrong).

    Thus, by using such a problem can be solved. Assume the left parenthesis as opening
    scope and right parenthesis as end of scope. Some the expression contains nested
    parenthesis, various scopes are opened but not closed. Count the number of opening
    parenthesis from beginning of expression to end. If the number of opening parenthesis
    is equal to closing parenthesis it means no scope is left open. The number of
    opening parenthesis and closing parenthesis is found same. If the parenthesis
    count in the expression is negative, it means a right parenthesis is found, but
    no left parenthesis of its pair is defined.


    ```

    ( x + y )

    1 2 1

    ```


    In the example, when opening parenthesis is encountered, counter is incremented
    and when closing parenthesis is encountered, counter is decremented.


    ```

    ) x + y ( -z

    -1 0

    ```


    In the example, when the first closing parenthesis is encountered, the counter
    is decremented.


    ```

    5 - ( A * ( ( B + K ) / ( U-4 ) + K ) / 8 ( 8-4.3 ) )

    0 1 2 3 4 3 2 1 2 1 0

    ```


    In the above example the opening and closing parenthesis are balanced.'
