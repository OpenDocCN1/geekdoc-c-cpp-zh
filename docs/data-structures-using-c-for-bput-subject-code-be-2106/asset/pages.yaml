  md: '# Introduction to Data Structures


    # SUMMARY


    +   1. A computer is an electronic device that manipulates information presented
    in the form of data.


    +   2. The study of any characteristic in computer science means the study of
    storage, retrieval, manipulation and organization of information.


    +   3. Information is symbolic representation. It has some useful meaning for
    us and allows us to make good judgments. Information is always expressed by data.
    Data is nothing but a collection of numbers, alphabets, symbols, etc., combined
    to represent information.


    +   4. The integers, real, logical data, character data, pointer and reference
    are primitive data structures. Data structures that are normally operated upon
    by machine-level instructions are known as primitive data structures.


    +   5. Operations that create data structures are known as creation.


    +   6. Destroy operations destroy data structures.


    +   7. The most commonly used operation linked with data structures is selection,
    which is used by programmers to access the data within data structures. Selection
    relationship depends upon yes/no.


    +   8. The iteration relationship depends upon repetition.


    +   9. A number has only the integer part is called an integer number.


    +   10. A number has the integer part and the fractional part is called a real
    number. Only two logical constants—true and false—are present.


    +   11. Primitive data structures also include logical data, i.e. true or false.


    +   12. All non-numeric information is represented by a sequence of characters
    strings.


    +   13. The information stored in memory is in the form of bits 0 and 1. The information
    in the memory can be viewed and understood by humans with the help of data types.
    The type of computer hardware handles the data type and the range. Ranges the
    largest and smallest possible values that can be represented.


    +   14. A pointer is a link or reference to data structures.


    +   15. A pointer is a variable that stores a memory address of another variable.
    It can have any name that is valid for the other variable and it is declared in
    the same way as any other variable. It is always denoted by ''*.


    +   16. A structure is a collection of one or more variables of different types
    grouped together under a single name and custom data type is formed.


    +   17. An algorithm is a well-organized, pre-arranged, and defined computational
    module that receives some value or set of values as input and provides a single
    or set of values as output.


    +   18. Analyzing an algorithm refers to calculating or estimating the resources
    needed for the algorithm. Resources mean computer memory, processing time, logic
    gates, etc.


    +   19. The space or memory requirement of a program is the memory space required
    to execute the program. The execution time is dependent upon the machine and the
    way of implementation.'
