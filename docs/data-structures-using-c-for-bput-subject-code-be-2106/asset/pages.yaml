    # 9.8.1 Array Representation of Binary Tree


    In any type of data structure array plays an important role. The nodes of trees
    can be stored in an array. The nodes can be accessed in sequence after another.
    In array, element counting from zero to (n-1) where n is the maximum number of
    nodes. In other words, the numbering of binary tree nodes will start from 0 rather
    than 1.


