    We know that in any expression, the first opened parenthesis is closed lastly
    and the last opened parenthesis is first, the parenthesis arrangement is like
    stack mechanism first-in-last-out. The encountered opening parenthesis are pushed
    onto the stack. When closing parenthesis of same type is found the item is popped
    from the stack. Thus, matching pairs of parenthesis are checked. If no match is
    found, the error will be displayed. In case opening parenthesis does not have
    closing parenthesis, the message displayed will be "Error in expression"


    # SUMMARY


    +   1. Stack is an important tool in programming languages. Most of the programming
    languages support stack operations. The main operations are push and pop. The
    insertion of element onto the stack is called "push", and deletion operation is
    called "pop". Due to the push operation that adds elements to the stack, the stack
    is also known as pushdown list. The most least reachable elements in the stack
    are known as the "top" and "bottom" of the stack. Stack is a set of elements in
    a last-in-first-out technique.

    2. The insertion and deletion operations are carried out at one end. Hence, the
    recent element inserted is deleted first. If we want to delete the particular
    element of the stack, it is necessary to delete all the elements appearing before
    that element.

    3. A top pointer maintains track of the top elements.

    4. When stack has no element, it is called empty stack.'
