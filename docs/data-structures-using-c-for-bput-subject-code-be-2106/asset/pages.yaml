    # 10.6.4 Topological Sorting


    Topological sorting is the process of ordering the vertices of a graph such that
    a path exists from vertex $V_i$ to $V_j$ in the graph. Topological ordering is
    **possible** if the graph is **acyclic**, i.e. the graph is not cyclic. Topological
    ordering is **not possible** if the graph is **cyclic** because $V_i$ precedes
    $V_j$ and $V_j$ precedes $V_i$. A cyclic graph doesn''t have a vertex with indegree
    zero.


    The following steps are involved in topological sorting:


    +   1. Find any vertex in the graph the indegree of which is zero.

    2. Initially, the ordering set is set to zero.

    3. Add the vertex the vertex the indegree of which is zero to an ordering set.

    4. Remove the vertex the indegree of which is zero. Also remove the edges, which
    are associated with the selected vertex the indegree of which is zero.

    5. Repeat Steps 1 to 4 till the graph is empty.'
