    # ## 5.1 INTRODUCTION


    A queue is one of the simplest data structures and can be implemented with different
    methods on a computer. Queue of tasks to be executed in a computer is analogous
    to the queue that we see in our daily life at various places. The theory of a
    queue is common to all. Queue of people in a bank, students queue in school, a
    travellers'' queue for tickets at railway station are few examples of queue. It
    is necessary to wait in a queue for obtaining the service. In the same fashion,
    in a computer there may be a queue of tasks waiting for execution, few others
    for printing, and some are for inputting the data and instructions through the
    keyboard. Unless the task comes on front, it will not executed. This data structure
    is very useful in solving various real life problems. One can simulate the life
    situations with this data structure. This chapter describes the queue and its
    types.


    A queue is a non-primitive, linear data structure, and a sub-class of list data
    structure. It is an ordered, homogenous collection of elements in which elements
    are appended at one end called rear end and elements are deleted at other end
    called front end. The meaning of front is face side and means'
