  md: '# 1.26 Data Structures Using C


    Algorithms are used to solve applications that are complex. An algorithm is said
    to be accurate and truthful only when it provides the exact wanted output, obviously,
    after implementation of algorithm into program.


    # 1.16.1 Analysing Algorithm


    When one writes an algorithm, it is essential to know how to analyse it. Analyzing
    an algorithm refers to calculating or guessing resources needful for the algorithm.
    Resources means computer memory, processing time, logic gates. In all these factors,
    time is most important because the program developed should be fast in processing.
    The analysis can also be made by reading the algorithm for logical quality, tracing
    the algorithm, implementing and checking it with some data and with a mathematical
    technique to confirm its accuracy.


    Algorithms can also be expressed in a simple method that will help the user to
    put into operation easily. However, this approach has a few drawbacks. It requires
    more space and time. It is very essential to consider the factors of time and
    space of an algorithm.


    # 1.16.2 Rate of Growth


    In practice, frequently it is not possible to act upon a simple analysis of an
    algorithm to conclude the execution time of an algorithm. The execution time depends
    on the machine and its way of implementation.


    Timing analysis depends on the input required. To accurately carry the time analysis,
    it is also very essential to know the exact directives executed by the hardware
    and the execution time passed for each statement.


    # 1.16.3 Space Requirement


    The space memory requirement of a program is the memory space required to execute
    the program. From the total allocated memory, a fixed portion occupies code, variable
    and space for data. The space analysis is only made for the memory to store data
    values. It does not include the space required for the algorithm itself. The space
    memory requirement can be calculated as follows:


    ```

    s(p) = c + sp

    c is constant

    s(p) is space requirement

    spr refers to instance attribute

    ```


    # 1.16.4 Time Requirement


    It indicates the time required for execution of the program. The complete time
    T (p) is the total of the time required for compiling and executing of the program.
    The compile time is not dependent on instance'
