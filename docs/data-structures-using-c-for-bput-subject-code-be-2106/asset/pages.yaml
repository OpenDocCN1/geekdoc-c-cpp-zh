    # 9.10 TRAVERSAL OF A BINARY TREE


    Three parameters are needed for formation of binary tree. They are node, left
    and right sub-trees. Traversing is one of the most important operations on binary
    tree and frequently this operation is carried on data structures. Traversal means
    passing through every node of tree one by one. Every tree is traversed only once.
    Assume, root is indicated by O, left sub-tree as L and right sub-tree as R. The
    following traversal combinations are:


    +   1. ORL - ROOT - LEFT-LEFT

    2. OLR - ROOT - LEFT-RIGHT

    3. LOR - LEFT - ROOT - RIGHT

    4. LRO - LEFT - RIGHT - RIGHT

    5. R - RIGHT - ROOT - LEFT

    6. RLO - RIGHT - LEFT-ROOT


    Out of six methods only three are standard and discussed in this chapter. In traversing
    always right sub-tree is traversed after left sub-tree. Hence, the OLR is preorder,
    LOR is inorder and LRO is postorder. Figure 9.22 shows a model tree (binary tree)


