    Figure 4.2 Working of Stack


    In the first half portion of Fig. 4.2, first integer 1 is inserted and 2,3,4 and
    5 are pushed on the stack. In the second half portion of the stack, the elements
    are deleted (*pop*) one by one from the top. The elements are deleted in the order
    from 5 to 1. The insertion and deletion operation is carried out at one end (*top*).
    Hence, the recently inserted element is deleted. If we want to delete a particular
    element of the stack, it is necessary to delete all the elements present above
    it. It is not possible to delete element 2 without deleting elements 5, 4. The
    stack expands or shrinks with the passage of time. In above example, the stack
    initially expands until element 5 is inserted and then shrinks after removal of
    elements. There is no higher limit on the number of elements to be inserted in
    the stack. The total capacity of stack depends on memory of the computer.


    In practical life, we come across many examples based on the principle of stack.

