    traversal method.


    ![](img/c2f6b24e88575cdba9137937a75b3615_360_1.png)


    The inorder traversal in the Fig. 9.51 will be as M-K-N-J-O-L. Two dangling pointers
    are shown to point a header node as shown below:


    +   - rchild of M is made to point to K

    - rchild of N is made to point to J

    - rchild of O is made to point to L.


    Similarly, the working of the left in binary threaded tree is illustrated in Fig.
    9.52. In this case the left child of node points to the previous node in the sequence
    of inorder traversal.


    As shown in Fig. 9.52, thread of N points to K. Here, K is the predecessor of
    N in inorder traversal. Hence, the pointer points to K. In this type of the pointers
    pointing to other nodes are as follows:


