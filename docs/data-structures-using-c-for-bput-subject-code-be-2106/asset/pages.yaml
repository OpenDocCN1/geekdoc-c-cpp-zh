    # 6.10 INSERTION IN THE LINKED LIST


    Insertion of an element in the linked list leads to several operations. The following
    steps are involved in inserting an element:


    +   - Creation of node: Before insertion, the node is created. Using malloc()
    function memory space for node is booked.

    - Assignment of data: Once the node is created, data values are assigned to members.

    - Adjusting pointers: The insertion operation changes the sequence. Hence, according
    to the sequence, the address of next element is assigned to inserted node. The
    address of current node (inserted) is assigned to previous node.


    The insertion of node can be done in different positions in the linked list by
    the following ways:


    +   - Insertion of the node at the starting: The created node is inserted before
    the first element. After insertion, the newly inserted element becomes the first
    element of the linked list. In this only the contents of successive node''s pointer
    are changed.

    - Insertion at the end of the list: A new element is appended to the end of the
    list. This operation is easy as compared to other (a) and (c) operations. In this
    only the contents of previous node''s pointer is changed.

    - Insertion at the given position in the list: In this operation, the user has
    to enter the position number. The given position is counted and the element is
    inserted. In this insertion contents of both previous and next node''s pointer
    are altered.


    # 6.11 INSERTION OF NODE AT START


    Inserting an element at the beginning involves updating links between link fields
    of two pointers. After insertion of new node, the previously existing nodes are
    moved to the front. Figures 6.12 (a) and (b) and Example 6.9 illustrates the insertion
    at the starting.'
