- img_proc: true
  md: '# Introduction to Data Structures


    **Non-homogenous** In this type of data structures, data values of different types
    are grouped, as in structures and classes.


    **Dynamic** In dynamic data structures such as references and pointers, size and
    memory locations can be changed during program execution.


    **Static** Static keyword in C is used to initialize the variable to 0 (NULL).
    The value of a static variable remains throughout the program. Value of static
    variable persists. In C++ member functions are also declared as static and such
    functions are called as static functions and can be invoked directly.


    # 1.5 PRIMITIVE AND NON-PRIMITIVE DATA STRUCTURES AND OPERATIONS


    # 1.5.1 Primitive Data Structures


    The integers, logical data, data pointer and reference are primitive data structures.
    These structures are normally operated by machine-level instructions are known
    as primitive data structures.


    # 1.5.2 Non-primitive Data Structures


    These are more complex data structures. These data structures are derived from
    the primitive data structures. They stress on formation of sets of homogeneous
    and heterogeneous data elements. The different operations that can be carried
    out on data are nothing but designing of data structures. The various operations
    that can be performed on data structures are shown in Fig.1.5.


    +   1. Create

    2. Destroy

    3. Select

    4. Update


    An operation typically used in combination with data structures and that creates
    a data structure known as creation. This operation reserves memory for the program
    elements. It can be carried out at compile time and run-time.


    For example,


    ```

    int x;

    ```


    Here, variable x is declared and memory is allocated to it.


    Another operation giving the balancing effect of a creation operation, which destroys
