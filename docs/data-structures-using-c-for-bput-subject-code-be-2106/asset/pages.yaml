    # 9.10.1 Inorder Traversal


    The functioning of inorder traversal of a non-empty binary tree is as follows:


    +   1. Firstly, traverse the left sub-tree in inorder.

    2. Next, visit the root node.

    3. At last, traverse the right sub-tree in inorder.


    In the inorder traversal firstly the left sub-tree is traversed recursively in
    inorder. Then the root node is traversed. After visiting the root node, the right
    sub-tree is traversed recursively in inorder. Fig. 9.22 illustrates the binary
    tree with inorder traversal. The inorder traversal for the tree is P-N-Q-M-R-O-S-V.
    It can be illustrated as per Fig. 9.24.


    The left part constitutes P, N, and Q as the left sub-tree of root and R, O, S,
    and V are the right sub-tree.


    Figure 9.25 depicts another example of inorder traversal. The inorder traversal
    of Fig. 9.25 is C-B-D-A-F-E-G.


