    # 10.4 GRAPH REPRESENTATION


    The graph can be implemented by linked list or array. Figure 10.15 illustrates
    a graph and its representation and implementation is also described.


    Different possibilities of graph representations are dependent on two cases:


    +   1. If there is no edge between two nodes.


    ![](img/c2f6b24e88575cdba9137937a75b3615_384_0.png)


    There is no edge between nodes P and Q.


    +   2. If there is an edge between any two nodes.


    The nodes P and Q are having an edge. Hence, Table 10.1 provides the representation
    of the graph (Fig. 10.15).


    Table 10.1 Representation of a Graph

    | Nodes | P | Q | R | S | T | U |

    | --- | --- | --- | --- | --- | --- | --- |

    | P | x | ✓ | ✓ | x | x | x |

    | Q | ✓ | x | x | ✓ | x | x |

    | R | ✓ | x | x | x | ✓ | x |

    | S | x | ✓ | x | x | x | ✓ |

    | T | x | x | ✓ | x | x | ✓ |

    | U | x | x | x | ✓ | ✓ | x |


    As per Table 10.1, there is an edge between the nodes P and Q, P and R, and there
    is no edge between nodes P and S. The symbol ✓ indicates existence of edge and
    x indicates absence of edge between two nodes.


    From the above table one can predict the path to reach a particular node. For
    example, initial node is P and the destination node U. We have to find the path
    to reach U from P. There is no edge between P and U. Then, find out the edge for
    nearest node in forward direction. By observing, we know there are two edges from
    P to Q and P to R. We can select Q or R. Suppose we have selected Q, find out
    next successive node to Q by observing column Q. The next successive forward node
    will be S. Then, refer column S and it provides two edges Q and U. The node U
    is our solution. by using above table, paths between any two nodes can be determined.
    The path should be P-Q-S-U. The graph can be represented by sequential representation
    and linked list representation.


    **Adjacency Matrix** may be used to represent the graph. The information of adjacent
    nodes will be stored in the matrix. Presence of edges from a particular node can
    be determined easily.'
