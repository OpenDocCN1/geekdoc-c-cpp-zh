    \ In C++, while defining user-defined functions, it is unavoidable to declare\
    \ its prototype. A prototype statement helps the compiler to check the return\
    \ and argument types of the function.\n\nA prototype declaration consists of function's\
    \ return type, name, and arguments list. It tells the compiler:\n\n+   a. Name\
    \ of the function\nb. Type of value returned\nc. The type and number of arguments.\n\
    \nWhen the programmer defines the function, the definition of function must be\
    \ similar to its prototype declaration. If the programmer makes a mistake, the\
    \ compiler flags an error message. The function prototype declaration statement\
    \ is always terminated with a semi-colon. The statements given below are examples\
    \ of function prototypes.\n\n| A | void show (void); |\n| B | float sum (float,\
    \ int); |\n| C | float sum (float x, int y); |\n\nIn example (A) the return type\
    \ is, i.e., the function will not return any value. The void functions are always\
    \ without return statement. The argument indicates the function will not require\
    \ any argument. By default, every function returns an integer value. To return\
    \ a non-integer value, the data type should be mentioned in function prototype\
    \ and definition. While writing definition of function, the return type must be\
