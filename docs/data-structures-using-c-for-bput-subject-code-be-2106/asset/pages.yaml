  md: '# 12.12 Data Structures Using C


    # 12.5 HASHING METHOD


    Hashing technique is one of the complex searching techniques. In this section,
    we consider a class of search techniques whose search time is dependent on the
    number of entries available in the table. In this method, we fix the position
    of the key (element) into the table or the file, which is determined by the hash
    function. The function in which we use this key is known as hashing function.


    For example, we want to search a number from the ten numbers of a file. Then,
    we must find the number throughout this range from the 1st to 10th number. When
    we use the key for fixing its position in a table then the number can be searched
    very easily.


    # 12.6 HASHING FUNCTION


    In order to follow the operation of hashing function, consider an array that comprises
    a list containing some finite number of elements. Each element of it is a key.
    On performing operations on each some value is obtained. The key is assigned to
    the index, which is having the appropriate value. The table is prepared with the
    keys called a hashing table.


    Let us use the following array that will have the hash table:


    ```

    12, 22, 32, 17, 19, 28, 25, 29, 26, 18, 13, 11,

    ```


    Let us use the method for the hash table. We divide the key by ''3'' and the key
    is placed in the index based on the remains obtained. The keys having equal remains
    are placed in the same index. Any number divided by 3 returns 0, 1, or 2. Hash
    table is prepared with three indices such as 0, 1, 2. All base keys are stored
    in these three indices as shown in Table 12.1.


    Take the first key ''12'', divide it by ''3''. The remainder is ''0'', hence insert
    it into the ''0'' index.


    Then, take the next key ''22'' divide it by the ''3'', the remainder is ''1''.
    Hence, insert the key into the ''1'' index.


    In the same way we divide the ''32'' by ''3'', its remainder is 2. Place insert
    it into the ''2'' index. For the remaining elements, the same procedure is to
    be continued and by knowing reminders numbers can be placed appropriately in the
    respective index table.


    Table 12.1 explaining hashing table.


    | Index | Key |

    |---|---|

    | 0 | 12, 15, 18 |

    | 1 | 22, 19, 28, 16, 13 |

    | 2 | 32, 17, 29, 11 |


    In, the hashing function takes the key, and maps it to some index to the array.
    In our example, division function has been selected. The programmer can take any
    other function. This function maps several keys to the same index. In the above
    table, key 12, 15 and 18 are assigned to the index 0. While keys, 22, 19, 28,
    16 and 13 are placed in index 1. Keys 32, 17, 29, 11 are in the index 2.


    After preparation of the index table, it becomes easier to search the element
    from the list. One can use any searching method to search the element from the
    hashing table,


    Consider the following program for preparation of an index using divide method.'
