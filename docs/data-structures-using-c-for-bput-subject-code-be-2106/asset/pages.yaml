    # 5.10 TYPES OF SYSTEMS


    A system may be isolated or continuous. The continuous system has some arguments,
    which can receive any real value in some gaps. Simulation of this system runs
    on these continuous arguments. The discrete system is different, it takes only
    selected set of values. The moving of a fan at home is discrete system and its
    speed can be controlled. The motion of earth or sun is an example of continuous
    system and its motion is out of control. The input and output parameters also
    defines system. The system can be either deterministic or stochastic. The input
