    # 7.5.4 Next-fit Storage Allocation


    We have learnt the first-fit allocation method and in this method searching starts
    from the beginning of the free list. Also means of next fit storage allocation
    searching starts from the last allocation in the list. This memory pointer to
    the free list is stored next to the allocation node. It is utilized to start the
    next call. The main goal of this method is to trim down the search process by
    recoiling from checking of smaller blocks, which is lengthy in execution.


    # 7.5.5 External Fragmentation


    Let us assume that a request is made for bulky amount of storage blocks and as
    the request is released, the linked list of existing blocks are searched and if
    returned it means adjacent blocks are not merged into one. This also means that
    the average block size available is small and larger blocks are not available
    as the request. If a request for a bigger block it may possibly have to be ignored
    due to lack of a single block on the free list that is large enough, the total
    amount of free storage is much greater than the requested amount. This process
    of decomposing the total available storage into a larger number of comparatively
    small blocks is known as external fragmentation.


    # 7.5.6 Internal Fragmentation


    It is possible to reduce external fragmentation to some extent by allocating a
    larger block than the requested size. It can be done by avoiding partition of
    a block into various parts. If we apply that a request for storage is rejected
    due to the lack of blocks of the desired size. This can occur even if the amount
    of storage that is wasted is more than enough to fulfill the request. Internal
    fragmentation is nothing but dividing the total unused storage into available
    blocks. Further these blocks are allocated with some parts of these blocks remains
    unused, but not made to other programs. Fragmentation must be done cautiously
    as it is a main problem in dynamic memory management.


    # 7.6 STORAGE RELEASE


    The de-allocation of the memory is a very essential process and utmost care must
    be taken by the programmer to shun the waste of memory. In static implementation
    of data structure the waste of memory is more than in the dynamic implementation.
    This topic is devoted for discussion of de-allocation of allocated memory, which
    is returned to free store. It is one type of re-cycling. The system sources allocated
    must be returned to the system if the program is not in use. This way the performance
    of the system is maintained.


    We have observed in the boundary tag system it inserts the block to the list of
    free blocks and merge recently inserted blocks with their neighbouring blocks.


