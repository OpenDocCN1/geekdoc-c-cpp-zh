  md: '# Introduction to Data Structures


    works perfectly as integer data in the range from –128 to 127 and unsigned char
    from 0 to 255. Sometimes, selection of data type is important. Just as, for example,
    if we are going to fence the house we use brick or wire. Here, the brick may be
    expensive. Likewise, if we are using signed int char to store a positive number
    (number of floors) we are wasting one byte of the system. Hence, here char is
    appropriate, which occupies only one byte.


    Electrification should be declared with char data type. Like the above example,
    in the practical application of data structures, to create data structures some
    components are involved directly or indirectly to build the system. In other words,
    data structures are a structured set of variables associated with one in different
    ways, cooperatively defining components of the system.


    The components of data can be organized and records can be maintained. Further,
    the record format leads to the development of abstract data type and database
    systems.


    In data structures, we also have to consider the storage, retrieval and operation
    that should be carried out between logically related items. For example, the data
    must be stored in memory computer-understandable format, i.e. 0 and 1 and the
    data stored must be retrieved in human-understandable format, i.e. ASCII. In order
    to transform data various operations have to be performed.


    # 1.4 TYPES OF DATA STRUCTURES


    A data structure is a structured set of variables associated with one another
    in different ways, cooperatively defining components in the system and capable
    of being operated upon in the program. As stated earlier, the following operations
    are on data structures:


    +   1. Data organisation or clubbing

    2. Accessing technique

    3. Manipulating selections for information


    Data structures are the basis of programming tools and the choice of data structures
    should provide the following:


    +   1. The data structures should satisfactorily represent the relationship between
    data elements.

    2. The data structures should be easy so that the programmer can easily process
    the data.


    Data structures have been classified in several ways. Different authors classify
    it differently. Figure 1.4 (a) shows different types of data structures. These
    data structures some other data structures such


    ![](img/c2f6b24e88575cdba9137937a75b3615_19_0.png)


    Figure 1.4 (a) Types of Data Structures'
