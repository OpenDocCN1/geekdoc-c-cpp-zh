    # ## 1.1 INTRODUCTION


    Humans use different languages to communicate data and information with each other.
    Besides, thoughts and feelings can also be communicated to others using language.
    The newspaper, television and other media use different languages for communication
    of data/information. In all occupations, language plays a vital role. In fact,
    with the help of languages humans interact with each other.'
