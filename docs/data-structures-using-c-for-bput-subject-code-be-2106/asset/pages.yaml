    # 9.14 B-TREE (BALANCED MULTIWAY TREE)


    Binary search tree is, in general multi-way search tree. The integer m is called
    the order of the tree. Each node should have maximum m. If k<m, where m is number
    of children, the node has accurately k-1 keys which divides all the keys into
    k number of sets. In some cases are empty, the children are also empty.


    The B-tree is also known as the balanced sort tree. The B-tree is used in external
    sorting. The B-tree is not a binary tree. While implementing B-tree following
    conditions are:


    +   1. The height of the tree must be minimum.

    2. There should be no empty sub-trees after the leaves of the tree.

    3. The leaves of the tree should be at the same level.

    4. All nodes excepting the leaves should have at least few children.


    # 9.14.1 B-Tree Insertion


    In-tree insertion at first search is where the new element is to be placed. If
    the node is suitable to the given element insertion is straightforward. Element
    is inserted by using an appropriate pointer in an order that number of pointers
    will be more than the number of records. In cases, the node overflows due to upper
    bound of node, splitting is mandatory. The node is divided into three parts. The
    middle part is passed upward. It is inserted into the parent. Partition may spread
    the tree. This is because the parent into which element is inserted splits its
    children nodes. If the root is needed to split, a new root is created with two.
    The trees grow by one level.

    Example: Consider the B-tree of degree 4. It can be balanced in four ways. Here,
    each node holds elements. It also has four branches. Suppose, it has the following
    values:'
