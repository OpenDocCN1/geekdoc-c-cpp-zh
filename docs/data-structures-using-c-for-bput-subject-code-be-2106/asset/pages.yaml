    # 10.6.5 Path Matrix


    A graph contains a set of vertices and edges. Consider a graph with $n$ vertices
    such as $V_1, V_2, \dots, V_n$. The path matrix is defined as $p[i][j]=1$ if and
    only if there exist a path between the vertices $V_i$ to $V_j$, $p[i][j]=0$ if
    there does not exist a path from $V_i$ to $V_j$.


    ![](img/c2f6b24e88575cdba9137937a75b3615_400_2.png)


    | | A | B | C | D |

    |---|---|---|---|\||

    | A | 0 | 1 | 1 | 0 |

    | B | 0 | 0 | 0 | 1 |

    | C | 0 | 0 | 1 | 0 |

    | D | 0 | 0 | 0 | 0 |


    Adjacency matrix of the above graph


    Figure 10.34


