    #  10.6.3 Indegree and Outdegree of Vertex


    The number of incoming vertices incident on the specific vertex of a graph is
    termed as the **indegree** of the vertex. The number of outgoing vertices from
    the specific vertex of a graph is termed as the **outdegree** of the vertex. Table
    10.2 shows the calculation of indegrees and outdegrees.


    > Example 10.4 Calculate the indegree and outdegree of the vertices of Figure
    10.28.


