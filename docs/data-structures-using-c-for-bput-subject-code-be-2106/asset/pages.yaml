    # 3.2 TYPES OF RECURSION


    Recursion little bit tough, but if we keep track of the program, in which sequence
    it is executing, it is easy to understand. Recursion is one of the most dominant
    tools used in the programming technique. There are various situations when we
    need to execute a block of statements for a number of times depending on condition
    that time recursion is useful. Recursion is used to solve a problem, which has
    iterations in reverse order. Data structures also support recursion, for example,
    tree recursion. Various programs are solved with the use of recursion. The major
    application of recursion is game programming where series of steps can be solved
    with recursion.


    When a function calls itself recursively it is known as recursion. Recursion is
    of two types:


    +   1. Direct recursion

    2. Indirect recursion.


    The recursion in which the function calls itself is called direct recursion. In
    this type, only one function is involved. In indirect recursion two functions
    call each other. Figure 3.3 describes direct and indirect recursion.


    ```

    int num () {

    int num();

    }

    ```


    ```

    int num () {

    int sum();

    } int sum() {

    num();

    }

    ```


    a. Direct Recursion b. Indirect Recursion


    Figure 3.3 Types of Recursion


    Recursion is one of the applications of stack. Stacks are explained in the next
    chapter. There are several problems in which we restrict their solution by length.


    The programming languages like C, C++ allow us to define defined functions. Functions
    in the programming languages are very useful, because using function a separate
    block of statements can be defined. This block can be invoked a a number of times
    anywhere in the program. A function which can call itself or another function
    which eventually calls another function is known as recursive function.


    Two essential conditions should be satisfied by a recursive function. First, every
    time a function should call itself directly or indirectly. Second, the function
    should have a condition to stop the recursion. Otherwise, an infinite loop is
    generated and the loop will lose control.


    Some people think recursion is a needless luxury in the programming language.
    Using iteration one can solve the problems. However, in programming in some situation
    there is no substitute for recursion.'
