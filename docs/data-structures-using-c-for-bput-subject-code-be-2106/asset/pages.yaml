  md: '# Preface


    The world today is witnessing a new kind of revolution—the Information Revolution—ushered
    in by technology. This revolution is in fact more sweeping than any other revolution
    in history in its reach and influence, bringing fundamental changes in all aspects
    of our life. Information technology (IT) is the engine used to drive information
    systems. This includes computers, software, the Internet/Intranet, and telecommunication
    systems. IT provides the means for collecting, storing, encoding, processing,
    analyzing, transmitting, receiving, and printing information. A thorough knowledge
    of the fundamentals of IT and computer programming will prove to be highly beneficial
    for the benefit of students of engineering.


    The contents of this book have been designed to meet the requirements of the core
    course on Data Structures Using C offered to the students of Biju Patnaik University
    of Technology, Rourkela, in their first year. A roadmap to the syllabus has been
    included for the benefit of students. The utility of this book has also been enhanced
    by the inclusion of three solved university question papers.


    An indispensable text for teaching and learning, Data Structures Using C provides
    an introduction to data structures and their applications in C programming. Theoretical
    concepts are supplemented by numerous programs that enable a better understanding
    of the concepts. All suggestions to improve this edition are welcome.


    # Acknowledgements


    I express my sincere gratitude towards my beloved father, Late Shri Namdev Kamthane;
    my grandfather, Late Shri Jagganath Kamthane; and my mother, Late Shrimati Sumanbai
    Namdev Kamthane. It is because of their blessings I could write this book in addition
    to several other technical books.


    I am grateful to the members of the Board of Governors of our institute for encouraging
    and inspiring me to write this book. I thank the chairman, Mr Baba N. Kalyani,
    the directors, Dr S. R. Kajale and Shri Kamlesh Pande for their support.


    I thank all the students, faculty, and non-teaching staff of this college who
    either directly or indirectly helped me to complete this book. I also take this
    opportunity to thank the editorial team at Pearson Education for their support.


    Thanks are also due to my wife V. Surekha who supported me patiently during the
    preparation of this book. Last, but not the least, my sons, Amol and Amit; daughter,
    Sangita; and daughter-in-law, Swaroopa, were also of great help and supported
    me at all times. I thank them all.


    Ashok N. Kamthane'
