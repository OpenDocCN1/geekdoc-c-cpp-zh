    **Folding method:** In this technique, a key is divided into a number of parts.
    Each part should have equal length. The split parts are then added together and
    the final carry should be ignored.


    (b) A simple approach to resolving collisions is to store the colliding record
    in the next available space. This technique is known as linear probing. Linear
    probing has collision by sequential searching. A has table beginning at the location
    is returned by the has function. We consider the array as a circular structure
    and continue looking for an empty room at the beginning of the array.


    For example: Consider the hash function $h(x) = x\%7$

    The numbers 23, 50, 30, 38 are arranged in the hash table as follows:


    ```

    0 1 2 3 4 5 6

    50 23 30 38

    ```


    The main disadvantage of linear probing is that the elements are stored in different
    locations in case of collision. Hence, searching has to be done completely within
    the sequence starting from the beginning. Since it is static in nature, the rest
    of the elements cannot be stored when the memory allocated is full.'
