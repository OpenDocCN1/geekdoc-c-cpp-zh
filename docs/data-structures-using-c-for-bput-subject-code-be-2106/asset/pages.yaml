    # SUMMARY


    +   1. Arithmetic expressions can be defined in three kinds of notation: infix,
    prefix and postfix. The prefixes ''pre'',''post'' and ''in'' indicates the relative
    location of the operator with two operands.

    2. Each operator in the postfix expression is associated with the previous two
    operands. When we read an operand from a given expression it is pushed onto the
    stack.When an operator symbol is read, the operands associated with it are the
    top elements of the stack. We can pop these two elements from the stack and perform
    the operation.

    3. In any expression, two types of components can be clubbed together. They are
    operand and operators. The operator indicates the operation to be carried out
    and the operand indicates the values. The operands are the variables on which
    the operator operates.Operators have their priority of execution. When one or
    more operators are clubbed together in a single expression the priority decides
    which operation is performed first.'
