    stack followed by Step 4 and Step 5.


    +   Step 4: If the scanned operator has lesser or equal precedence to the existing
    operator, then pop out the operators from the stack until a less precedence operator
    or opening parenthesis is found.


    +   Step 5: If the scanned operator is a closing parenthesis, then pop the operators
    from the stack up to the opening parenthesis and omit them. The popped operators
    will be stored in the postfix.'
