    An entered expression by the user is stored in the array exp[]. Using while loop
    the entire string (expression) is used to check different conditions. The switch()
    case structure within while loop and pop. If any opening bracket comes across,
    it is pushed on the stack by invoking push() function, i.e. the meet opening bracket
