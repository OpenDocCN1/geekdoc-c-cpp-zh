    Similarly $W[A][D]=0$ as a path does not exist from A to D. Thus, from the adjacency
    matrix we can analyze that


    $p[i][j]=1$ if a path exists from $V_i$ to $V_j$

    $p[i][j]=0$ if a path does not exist path from $V_i$ to $V_j$'
