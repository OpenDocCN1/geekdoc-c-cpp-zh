  md: '# 10.5 TRAVERSAL IN GRAPH


    Traversing in a graph is nothing but visiting each and every node of a graph.
    The following points are to be noted in graph:


    +   1. The graph has no first node or root. Therefore, the graph can be started
    from any node.

    2. In graph, only those nodes are traversed are accessible from the current node.
    For traversing of graph, the path can be determined by traversing nodes step by
    step.

    3. In the graph, a particular node can be visited repeatedly. Hence, it is necessary
    to keep the track of the status of every node whether a particular node, or more
    paths are available.

    4. In graph to reach traversing nodes in a graph. They are depth first and breadth
    first.


    Two techniques are used for traversing nodes in a graph. They are depth first
    and breadth first. These techniques have been elaborated in detail in the following
    sections.


    # 10.6 SPANNING TREES


    A spanning tree is an undirected tree, containing only those nodes that are necessary
    to join all the nodes in the graph. The nodes of spanning trees have only one
    path between them. In spanning trees, the number of edges is less by one than
    the number of nodes (see Fig. 10.23).


