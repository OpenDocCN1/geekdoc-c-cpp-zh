    # 3.1.2 Function Definition


    The first line is called as function declarator and then function body follows
    it. The block of statements followed by function declarator is called as function
    definition. The declarator and function-type declaration should match each other.
    The function body is enclosed within curly braces. The function can be defined
    anywhere. If the function is defined before its caller, then its prototype declaration
    is optional.


    # 3.1.3 Function Call


    A function is a latent body. It is activated only when a call to function is invoked.
    A function must be called by its name followed by argument list enclosed in parenthesis
    and terminated by semi-colon.


    # 3.1.4 Actual and Formal Argument


    The arguments declared in caller function and given in the function call are called
    as actual arguments. The arguments declared in the function declarator are known
    as formal arguments. For example,


    ![](img/c2f6b24e88575cdba9137937a75b3615_95_0.png)


    Figure 3.2 Actual and Formal Arguments


    As shown in Fig. 3.2, variable $y$ and $z$ are actual arguments $j$ and $k$ are
    formal arguments. The values of $y$ and $z$ are stored in $j$ and $k$, respectively.
