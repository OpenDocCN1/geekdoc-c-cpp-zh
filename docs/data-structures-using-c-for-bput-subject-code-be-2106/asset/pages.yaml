  md: '# Trees 9.3


    ![](img/c2f6b24e88575cdba9137937a75b3615_323_0.png)


    **Root** It is the mother node of a tree structure. It is the most important node
    of any tree. This node does not have parent. It is the first node in the hierarchical
    arrangement.


    **Node** It is the main component of the tree. The node of a trees stores the
    data and its role is same as the linked list. Nodes are connected by means of
    links with other nodes. This is shown in Fig. 9.4.


    ![](img/c2f6b24e88575cdba9137937a75b3615_323_1.png)


    **Figure 9.4** Right and Left Nodes of a Tree


    **Parent** It is an immediate predecessor of a node. In Fig. 9.5, A is the parent
    of B and C.


    ![](img/c2f6b24e88575cdba9137937a75b3615_323_2.png)


    **Figure 9.5** Parent Nodes with Child Nodes


    **Child** When a predecessor of a node is parent all successor nodes are called
    nodes. In Fig. 9.5, B and C are child nodes of A. The node at left side is called
    left child node and node at right side is called right child node.


    **Link** The link is nothing but pointer to node in a tree structure. In other
    words, link connects the two nodes. The line drawn from one node to another is
    called a link. Fig. 9.5 shows left and right child. Here, two links are shown
    from node A. More than two links from a node may be drawn in a tree. In a few
    textbooks the term edge is used instead of link. Functions of both of them are
    same.'
