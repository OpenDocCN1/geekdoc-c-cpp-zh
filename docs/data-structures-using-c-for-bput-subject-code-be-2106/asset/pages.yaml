  md: '# 11.10 Data Structures Using C


    # 11.6 QUICK SORT


    It is also known as exchange sort. It was invented by CAR Hoare. It is based on
    partition.

    Hence, the method falls under divide and conquer technique. The main list of elements
    is divided into two sub-lists. For example, a list of X elements are to be sorted.
    The quick sort marks an element in a list called as pivot or key. Consider the
    first element as a pivot. Shift all the elements whose value is less than J towards
    the left and elements whose value is greater than J to the right of J. Now, the
    key divides the main list into two parts. It is not necessary that selected key
    element must be in the middle. Any element from the list can act as key element.
    However, for best performance preference is given to middle elements. Time consumption
    of the quick sort depends on the location of the key in the list.


    Consider the following example in which five elements 8, 9, 7, 6, 4 are to be
    sorted using quick sort.

    Figure 11.5 illustrates it.


    | Pass 1 |

    | Iteration 1 | 8 | 9 | 7 | 6 | 4 |

    | Iteration 2 | 4 | 9 | 7 | 6 | 8 |

    | Iteration 3 | 4 | 8 | 7 | 6 | 9 |

    | Iteration 4 | 4 | 6 | 7 | 8 | 9 |


    Figure 11.5 Quick Sort


    Consider pass 1 under which the following iterations are made. Similar operations
    are done on pass 2, pass 3, etc.

    In iteration 1 the first element 8 is marked as pivot one. It is compared with
    the last element whose value is 4. Here, 4 is smaller than 8 the numbers are swapped.
    Iteration 2 shows the swapping operation.

    In iteration 2, 8 and 9 are compared and swapping is done after iteration 2.

    In iteration 3, 8 and 6 are compared and necessary swapping is done. After this,
    it is impossible to swap. The position of 8 is fixed. By fixing the position of
    8 the main list is divided into two parts. Towards the left of 8 elements smaller
    than 8 are placed and towards the right greater than 8 are placed.

    Towards the right of 8 only one element is present there is no need of further
    swapping. This may be considered under pass 2.

    However, towards the left of 8 there are three elements and these elements are
    to be swapped as the procedure described above. This may be considered under pass
    3.'
