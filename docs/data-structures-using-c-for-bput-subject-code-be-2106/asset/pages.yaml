    # 11.5 BUBBLE SORT


    Bubble sort is a commonly used algorithm. In this type, two successive elements
    are compared and swapping is done if the first element is greater than the second
    one. The elements are sorted in ascending order. It is easy to understand but
    it is time consuming.


    Bubble sort is an example of exchange sort. This method repeatedly comparison
    is performed between the two successive elements and if swapping of elements is
    done. Thus, step-by-step entire array elements are checked. It is different from
    the selection sort. Instead of searching the minimum element and then applying
    swapping, two records are swapped instantly noticing that they are not in order.
    The Fig.11.4 illustrates the exchange sort.


    | Initial List | 9 | 5 | 1 | 4 | 3 |

    |---|---|---|---|---||}{

    | Pass 1 | 5 | 1 | 4 | 3 | 9 |

    | Pass 2 | 5 | 4 | 3 | 5 | 9 |

    | Pass 3 | 1 | 3 | 4 | 5 | 9 |


    Figure 11.4 Bubble Sort


    Let consider the elements 9, 5, 1, 4, and 3 for sorting bubble sort.


    +   1. In pass 1, first element 9 is compared with its next element 5. The next
    element is smaller than 9. Hence, it is swapped. Now, the list is 5, 9, 1, 4,
    3. Again 9 is compared with the next element 1. The next element is smaller than
    9. Hence, swapping is done. The same procedure is done with 4 and 3 and at last
    we get the list as 5, 1, 4, 3, 9.

    2. In pass 2, the elements of pass 1 are compared. The first element 5 is compared
    with its next element 1, 5 and are swapped because 1 is smaller than 5. Now, the
    list becomes 1, 5, 4, 3, 9. 5 is compared with element 4. Again, 5 and 4 are swapped.
    This process is repeated until all successive elements are compared and if the
    succeeding number is smaller than the present number then the numbers are swapped.
    The final list at the end of this pass is 1, 4, 3, 5, 9.'
