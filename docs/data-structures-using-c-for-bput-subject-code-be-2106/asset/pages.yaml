  md: '# 4.4 Data Structures Using C


    # 4.2.1 Representation of Stack


    The stack is represented in various ways. The stack can be shown as completely
    empty or fully filled or with few elements. When stack has no element, it is called
    empty stack which is shown in Fig. 4.5 (a). The stack with completely filled elements
    is shown in the Fig. 4.5 (b) and no further elements can be inserted.


    A top pointer maintains track of the top elements as shown in Fig. 4.5 (c). For
    empty stack, the top value is zero. When stack has one element the value of top
    is one. Whenever an element is inserted (push operation) in the stack the value
    of pointer top is incremented by one. In the same, the value of pointer is reduced
    when an element is deleted from the stack (pop operation). The push operation
    can be applied to any stack, but before applying pop operation on the stack, it
    is necessary to make sure that the stack is not empty. If a pop operation is performed
    on empty stack, it results in underflow.


    ![](img/c2f6b24e88575cdba9137937a75b3615_118_0.png)


    Figure 4.5 Representation of Stack


    Stack is very helpful in every ordered and chronological processing of functions.
    The most useful application of stack is in recursion (explained in previous chapter).
    It saves memory space. The mechanism of stack last-in-first-out(LIFO) is commonly
    useful in applications such as manufacturing and accounting calculations. It is
    a well-known accounting concept.


    # 4.3 STACK IMPLEMENTATION


    The stack implementation can be done in the following two ways:


    # 4.3.1 Static Implementation


    Static implementation can be achieved using arrays. Though, it is a very simple
    method, it has few limitations. Once a size of an array is declared, its size
    cannot be modified during program execution. It is inefficient for utilization
    of memory. While declaration of an array, memory is allocated which is equal to
    array size. The vacant space of stack (array) also occupies memory space. In both
    cases, if we store less argument than declared, memory is wasted and if we want
    to store more elements than declared, array cannot be expanded. It is suitable
    only when we exactly know the number of elements to be stored.


    # 4.3.2 Dynamic Implementation


    Pointers are used for implementation of stack. The linked list is an example of
    this implementation. The limitations noticed in static implementation can be removed
    using dynamic implementation. The'
