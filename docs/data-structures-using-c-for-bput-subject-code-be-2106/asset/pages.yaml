    # # 9.12 BINARY SEARCH TREE


    A binary search tree is also called as binary sorted tree. Binary search tree
    is either empty or each node of tree satisfies the following property:


    +   1. The key value in the left child is not more than the value of root.

    2. The key value in the right child is more than identical to the value of root.

    3. All the sub-trees, i.e. left and right sub-trees follow the rules mentioned
    above.


    Binary search tree is shown in Fig. 9.49.

    In. 9.49 number 7 is the root node of the binary tree. There are two sub-trees
    to root 7. The left sub-tree is 4 and right sub-tree is 8. Here, the value of
    left sub-tree is lower than root and value of right sub-tree is 4 and higher root
    node. This property can be observed at all levels in the tree.


    ![](img/c2f6b24e88575cdba9137937a75b3615_353_0.png)


    **Figure 9.49** Binary Search Tree


