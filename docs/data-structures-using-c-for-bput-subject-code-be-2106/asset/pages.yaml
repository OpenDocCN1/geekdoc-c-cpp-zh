  md: '# SUMMARY


    +   1. Sorting is a process in which records are arranged in ascending or descending
    order.

    2. This chapter presents information on various sorting methods; each of them
    is illustrated with suitable example.

    3. Insertion sort: In insertion sort the element is inserted at appropriate place.
    Here, a real life example of playing cards can be quoted. The cards are kept in
    increasing order. The card having least value is placed at the extreme left and
    the largest one at the other side. In them the other cards are inserted in ascending
    order.

    4. Selection sort: The selection list is almost as same as exchange sort. By applying
    selection sort, the first element is compared with remaining (n-1) elements. The
    smallest is placed at the first location.Again, the second element is compared
    with remaining (n-2) elements. If the item found is lesser than the compared elements
    in the remaining n-2 elements then the swap operation is done. In this type, every
    array is checked for the smallest element and swapped.

    5. Bubble sort: Bubble sort is frequently used sorting algorithm. In this method,
    successive elements are compared and exchanging is done if the first element is
    greater than the second. The elements are sorted in ascending order.

    6. Quick sort: It is also recognized as partition exchange sort. This method also
    fails to divide and conquer technique. The main list of elements is divided into
    two sub-lists.Any element from the list is marked as pivot key in the quick sort.Now,
    the pivot divides the main list into two parts.It is not necessary that selected
    element must be at middle.Any element from the list can act as key element.For
    best performance is given to middle elements.Time consumption of the quick sort
    depends on the location of the key in the list.

    7. Tree sort: Inorder and heap sort methods are elaborated under tree sorting.Inorder
    sorting method involves arranging the elements as per rules. In this method,the
    first element of tree is chosen,then node and right node.The rule for heap prescribes
    that each parent node should have bigger value.

    8. Heap sort: In heap sort, binary tree is used in which the nodes are arranged
    in specific prearranged order.The rule prescribes that each node should have bigger
    value than its child node. The heap sort process can be followed by the figure
    and example given in this chapter.

    9. Radix sort: The radix sort is based on the position of digits. Based on the
    positions of digits sorting is done.

    10. Partition exchange sort:The partition exchange sort divides the elements into
    the two subparts. A pivot is selected among the elements.The elements whose values
    are smaller than the pivot are shifted towards left of it. The right part has
    elements whose values are greater than the pivot.'
