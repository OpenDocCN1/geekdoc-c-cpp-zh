    also be used. The reader can see Figs. 1.4 (a) and (b) for all data structures.


    ![](img/c2f6b24e88575cdba9137937a75b3615_20_0.png)


    ![](img/c2f6b24e88575cdba9137937a75b3615_20_1.png)


