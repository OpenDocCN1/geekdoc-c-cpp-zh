    # 11.11 PARTITION EXCHANGE SORT


    The partition exchange sort is the sorting technique in which list of elements
    is divided into the two subparts. Using the pivot from the list makes the subset
    of the list. The left part is called left sublist and the right part is called
    right sublist. On the quick or tree sort is performed and the two-sorted parts
    are prepared and combined. For example, consider the following list:


    +   24, 30, 27, 32, 11, 21, 19.


    Assume the pivot selected is 24 and the smaller numbers than pivot are shifted
    on its left side and remaining elements to the right of it. The element 24 divides
    the list in two parts. The Fig. 11.8 shows the partition exchange sort.


    | Initial List for Sort | 24 | 30 | 27 | 32 | 11 | 21 | 19 |

    |---|---|---|---|---|---|---|---||

    | Selecting 24 as Pivot | 24 | 30 | 27 | 32 | 11 | 21 | 19 |

    | Pivot Divide into 2 Parts | 11 | 21 | 19 | 24 | 30 | 27 | 32 |

    | After Sorting the Final Sorted List | 11 | 19 | 21 | 24 | 27 | 30 | 32 |


    ![](img/c2f6b24e88575cdba9137937a75b3615_435_0.png)


    After swapping the elements towards left of the pivot:


    11, 21, 19, 24, 30, 27, 32.


    After removing 24 the two sublists:


    11, 21, 19 and 30, 27, 32.'
