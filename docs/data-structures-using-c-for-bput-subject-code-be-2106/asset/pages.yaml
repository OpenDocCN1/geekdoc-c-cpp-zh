  md: '# 12.24 Data Structures Using C


    # 12.11 MULTIPLICATIVE HASHING FUNCTION


    The name itself indicates that the function is the multiplication operation in
    it. The multiplicative hashing function can be written as


    ```

    H(key) = (b(c*key mod 1)) +1.

    ```


    In this hashing method, the key is multiplied with the number ''c''. The c is
    used in this function as a constant. After performing the mod of this product
    with 1 again multiplication operation with the number b is 0 and 1 is added. The
    number obtained is the index number for placing the key.


    Mainly, there are two types of searching methods used with hashing function. One
    is external searching and internal search. When the records are bulky the records
    are stored in the file and the file is stored on disk, tape, etc. The record is
    outside of the computer memory. On the file searching operation is performed.
    This searching is called the external searching. Two techniques are used for the
    external search, one is hashing method and one tree search method. In another
    case, when the records are shorter and in less numbers the same can be stored
    in the computer memory array, list, etc. In the linear searching and binary search
    are used in the internal searching.


    # 12.12 DIGIT ANALYSIS METHOD


    Digit analysis method is the hashing function in which the analysis is done on
    the whole digits. In this method some digits of positions of the number are taken
    out. Then, by making the reverse of the selected digits a value is obtained. The
    key is transferred to that location. Assume a key 348526917 and just select the
    digits at the 2, 5 and 7 position. They are as 1,2 and 8. By combining these digits
    we get a number 128 and after reversing the number 821. Now, the key is transferred
    to the address location 821.


    # SUMMARY


    +   1. Searching is a technique of finding accurate location of an element in
    the given list item or set of the elements of an array, list, or trees.

    2. If the given element is present in the collected elements or array then the
    search process is said to be successful.The search to be unsuccessful if the given
    element does not exist in the array.

    3. The search method in which an element to be searched, is checked in the entire
    data structure in way from start to end is called linear search.

    4. Binary search is quicker than the linear search. However, it cannot be applied
    on unsorted data structure.This is the precondition.Before applying binary search,
    the data structure must be sorted in either ascending or descending order using
    one of the sorted methods.

    5. Hash is one of the complex searching techniques. In this method, the position
    of the key (element) is fixed in the table or the file, which is determined by
    the hash function. Division method is explained with a suitable example in this
    method. Other methods have also been discussed in detail.'
