  md: '# 10.6.1 Breadth First Search


    This is one of the popular methods of traversing graph. This method uses the queue
    data structure for traversing nodes of the graph. Any node of the graph can act
    as a beginning node. Using any node as starting node, all other nodes of the graph
    are traversed. To shun repeated visit to the same node is maintained which keeps
    status of visited node.


    Take the node P of Fig. 10.26 as a beginning node. Initially, the node P is traversed,
    After this, all the adjacent nodes of P are traversed, i.e. Q, T and S. The traversal
    of nodes can be carried in any sequence. For example, the sequence of traverse
    of nodes is Q, S and T. The traversal will be


    +   Q S T


    First, all the nodes neighbouring Q are traversed, neighbouring nodes of S and
    finally T are taken into account. The adjacent node of Q is R and T is U. Similarly,
    the adjacent node of T is U and S does not have any adjacent node. In this step
    the traversal now should be in the following:


    +   Q S R U


    The new nodes obtained are R and U after traversing. The new adjacent node of
    R is U and U does not have any adjacent node. Node U has been visited in the previous
    case it must be ignored in this step.


    # 10.6.2 Depth First Search


    In this method, also a node from graph is taken as a starting node. Traverse through
    all the possible paths of the starting node. When the last node of the graph is
    obtained and path is not available from the node; then control returns to previous
    node. This process is implemented using stack.


    Consider the graph shown in Fig. 10.27.\Consider P as starting node. Then, traverse
    the adjacent node to P and we will get Q and then R (adjacent to Q) and U (adjacent
    to R). The traversal will be


    +   P Q R U


    The search is always carried in forward direction. After reaching to U, we reach
    the end of the path and further movement in forward direction is not possible.
    Hence, the controls go to the previous node and again traverse through the available
    paths for non-traversed nodes.


    In reverse direction, we get the node R and it hasvisited node. Hence, Q is taken
    and it gives T. The node T gives U, but it is already visited. Therefore, control
    in reverse direction checks all the nodes. It takes P and it gives node S. The
    sequence of traversal will be


    +   P Q R U S


    The following program explains both the procedures.


    ![](img/c2f6b24e88575cdba9137937a75b3615_393_0.png)


    ![](img/c2f6b24e88575cdba9137937a75b3615_393_1.png)'
