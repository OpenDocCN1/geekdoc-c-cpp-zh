    # 3.8 ADVANTAGES AND DISADVANTAGES OF RECURSION


    Advantages of recursion,


    +   1. Sometimes, in programming a problem can be solved without recursion, but
    at some situations programming it is must to use recursion. For example, a program
    to display the list of all files of the system cannot solved without recursion.

    2. The recursion is very flexible in data structure like stacks, queues, linked
    list and quick sort.

    3. Using recursion, the length of the program can be reduced.


    Disadvantages of recursion,


    +   1. It requires extra storage space. The recursive calls and automatic variables
    are stored on the stack. For every recursive call separate memory is allocated
    to automatic variables with the same name.

    2. If the programmer forget to specify the exit condition in the recursive function,
    the program will execute out of memory. In such a situation user has to press
    ctrl break to pause or stop the function.

    3. The recursion is not efficient in execution speed and time.

    4. If possible, try to solve problem with iteration instead of recursion.


    # 3.9 TAIL RECURSION


    In this chapter we have studied the recursion and can say that recursion is a
    method in which set of process is given in terms of itself. Recursion is invoked
    by itself and this function is given in the same function body. If the function
    call is the last statement in the function body, the recursion is called tail
    recursion. In tail recursion, we can use return value as parameter for the function.
    All the functions are maintained using stack, however, in this type, it will not
    push function call to stack but it will replace the value of previous call with
    new. This approach decreased stack implementation time and faster execution. The
    program 3.7 is an example of tail recursion.


    # 3.10 EFFICIENCY OF RECURSION


    We have studied advantages and disadvantages of recursion. We have also studied
    the iteration which is an alternative to recursion. The major overhead of recursion
    is the memory it occupies and execution time. A non-recursive function will require
    minimum memory and less time for execution as compared with recursive function.
    The recursive function uses stack to push and pop the local variables. In non-recursive
    function the above push and pop operations with stack can be skipped. However,
    at some situation in programming use of recursion is must. If the part of program
    is invoked frequently, in such a case it is better to develop non-recursive function.'
