  md: '(b) The DFS uses stack for the traversal of graph. The procedure is as follows:


    +   1. Push the starting node into the stack.

    2. Pop an element from the stack. If it has not been traversed, traverse it. If
    it has already been traversed, just ignore it. After traversing, make the value
    of the visited array true for this node.

    3. Now push all the unvisited adjacent nodes of the popped elements on stack.
    Push the element even if it is already in the stack.

    4. Repeat Step 3 and Step 4 until the stack is empty.


    ![](img/c2f6b24e88575cdba9137937a75b3615_484_0.png)


