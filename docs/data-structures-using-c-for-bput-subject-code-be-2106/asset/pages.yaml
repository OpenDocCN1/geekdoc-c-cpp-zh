  md: '# 1.4 Data Structures Using C


    Entity An entity possesses some attributes and some values can be allocated to
    it. For example, a student is an entity of a college. The probable properties
    and the corresponding values are indicated in Table 1.3:


    Table 1.3 Information About Student

    | Entity: Student | | | |

    |---|---|---|---||

    | Information | Name | Birth date | Course |

    | Assigned Values | Harsha | 01.03.1982 | M | Data Structures |


    Every student in a college is an entity with different attributes. Sets of attributes
    are known as domain. Domains refer to possible values of a particular property.
    For example, the gender property can be assigned with M or F.


    # 1.2 DATA AND INFORMATION


    The study of computer science deals with retrieval, handling and organization
    of information. Information is generated in every sphere of life. For example,
    information about business transactions, or a student''s performance in an examination,
    can be stored in the computer memory. The same information can be retrieved, modified,
    and restored. The total marks of a student can be obtained by adding the marks
    scored in all subjects. Similarly, the average percentage of marks can be computed
    and student performance can be monitored and evaluated using different factors
    such as total marks, average marks, highest score, and lowest score. Information
    is symbolic representation. It has some useful meaning that helps us in making
    good judgments.


    # 1.3 OVERVIEW OF DATA STRUCTURES


    Data structures are a method of representing logical relationships between individual
    data elements related to the solution of a given problem. Data structures are
    the most convenient way to handle data of different types including abstract data
    type for a known problem. For example, the characteristics of a house are represented
    by the house name, house number, location, number of floors, number of rooms on
    each floor, kind of fencing to the house—with brick walls or wire,either underground
    or above, with a balcony been provided or not, etc. One can use a variety of data
    types to represent these data elements while solving with the help of computer
    language such as char, int, boolean type, etc. Figure 1.3 shows the various fields
    of. For example, with the help of computer the characteristics of a house can
    be represented: the *number of floors of a house* can be given with either *int*
    or *char* type. The house number, the number of rooms in it can be declared with
    the same type, provided that the data is within the limits of the range of data
    type. In C language, the char data type


    ![](img/c2f6b24e88575cdba9137937a75b3615_18_0.png)'
