    T₁₂, and T₁₃ are the children of the node T₁. Similarly T₁₁ is the child of the
    node T₂. So it is clear from the figure that the number of children may vary from
    node to node.


    # 9.4 BINARY TREES


    A binary tree is a finite set of data elements. A tree is binary if each node
    of it has a maximum of two branches. The data element is either or holds a single
    element called root along with two disjoint trees called left sub-tree and right
    sub-tree, i.e. in a binary tree the maximum degree of any node is two. The binary
    tree may be empty. However, the tree cannot be empty. The node can have any number
    of children whereas the node of binary tree have maximum two children. 9.9 shows
    a sample binary tree.


    In 9.9, A is the root and B and G are its children. The nodes B and G are non-empty
    nodes, hence they are called left successor and right successor of the root A.
    The root without successor is called the terminal node of root. In 9.9 the E,
    F, J, and K are the terminal nodes.


    The right tree is G and left tree is B. Next B has left tree C and right tree
    D. The right tree further has left H and right tree I. This will be continued
    up to level.


