  md: '# 9.4 Data Structures Using C


    Leaf This node is located at the end of the tree. It does not have any child hence
    it is called leaf node. ''H'', ''I'', ''F'', and ''J'' are leaf nodes in Fig.
    9.6.


    Level is a rank of tree hierarchy. The whole tree structure is levelled. The level
    of root node is always at 0. The immediate children of root are at level 1 and
    their immediate children are at level 2 and so on. If children nodes are at level
    n+1 then parent node would be at level n. Fig. 9.6 shows the levels of tree.


    ![](img/c2f6b24e88575cdba9137937a75b3615_324_0.png)


    Figure 9.6 Levels of Tree


    Height The highest number of nodes that is possible a way starting from the first
    node (root) to a leaf node is called the height of tree. In Fig. 9.6, the height
    of tree is 4. This value can be obtained by referencing three different paths
    from the source to leaf node. The A-B-D-H, A-B-E-I, and A-C-G-J have the same
    height. The height can be obtained from the number of nodes, which exists in the
    tree. The formula for finding the height of the h = i_{max}+1, where h is the
    height and i is maximum level of the tree. In the above Fig. 9.6 the maximum level
    of the tree is 3(i_{max}=3). By substituting the value into the formula it will
    be 4. The term can be used in place of height.


    Degree of a Node The maximum number of children that can exist for a node


    Sibling The children of same parent are called sibling. They are also called brothers.
    A, B and C nodes in Fig. 9.6 have two child nodes. B and C are the siblings of
    the node A, D and E are the siblings of the node B


    Terminal Node A node with zero degree is called terminal node or leaf. Fig. 9.6
    shows 4 terminal nodes and they are H, I, F and J.


    Path Length It is the number of edges from root node to destination node. In Fig.
    9.6, the path length from root node A H is three because there are three edges.


    Forest is a group of disjoint trees. If we remove a root node from the tree then
    it becomes the forest. If we remove node A then two disjoint sub-trees are observed.
    We observe left sub-tree B and right sub-tree C


    Labelled Trees In the labelled tree the nodes are labelled with alphabetical or
    numerical values. The labels are the values allotted to the nodes in the tree.
    Fig. 9.7 shows the diagram of a labelled tree. Finally obtained tree is called
    labelled tree.'
