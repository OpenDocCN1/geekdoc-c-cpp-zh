  md: '# About the Author


    ![](img/c2f6b24e88575cdba9137937a75b3615_11_0.png)


    **Ashok Namdev Kamthane** is a postgraduate in electronics from Shri Guru Gobind
    Singhji (SGGS) College of Engineering and Technology, Nanded. An eminent academician,
    he has won a number of prizes for his contribution to Information Technology including
    the Samaja Seva Bhushan Award from Ramamurthy Subhramram Trust, Bangalore.


    The author has been associated with the development of hardware and software using
    8051 (8-bit microcontroller) on Acoustic Transceiver System required in submarines.
    He has also worked at Meltron as an executive.


    With a teaching career spanning 27 years, he is Associate Professor at the Electronics
    and Telecommunications Engineering department, SGGS college of Engineering and
    Technology, Nanded. Recently elevated as Associate Dean, Academics, he teaches
    computer language subjects as C, C++, Data Structures, Wireless Communication,
    and Microprocessors and their applications. He has guided a number of undergraduate
    and postgraduate students and published several technical papers of national and
    international repute.'
