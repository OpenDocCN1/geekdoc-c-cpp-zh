    | | 7 | 9 | 8 | 1 |

    |---|---|---|---|---|

    | 0 | 1 | 2 | 3 | 4 |


    In the above figure, two more elements are appended to queue. If more elements
    are deleted, the value of front will be increased and as a result, the beginning
    portion of queue will be empty. In such a situation if we try to insert new elements
    to queue, no elements can be inserted in the queue. This is because, new elements
    are always inserted at the rear and if the last location of queue (rear) holds
    element, even though the space is available at the beginning of queue, no elements
    will be inserted. The queue will overflow.


    To overcome this problem, we must update the queue. Let us take an example, suppose
    we have allocated n bytes using malloc ( () or new (c++) function. After successful
    allocation of memory (though the program is not utilizing the memory), memory
    will be part of the program and cannot be used by other program or cannot be allocated
    to other program. To utilize this, memory must be released using free or delete
    functions. Thus, the portion of memory is not in use, we can use in our example
    of queue the beginning portion of queue which is empty due to delete operations,
    can be filled by shifting element to the beginning of the array. Thus, the space
    will be available at the rear end and new elements are inserted at the end. Thus,
    entire queue can be used to store the element. This approach also has a problem
    when the queue contains more elements. The solution to this problem is circular
    queue, which is discussed separately in this chapter.


