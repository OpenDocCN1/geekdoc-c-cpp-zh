    1. (a) A stack is a linear structure in which items may be added or removed at
    one end, which is called the top of the stack. This means that the last item to
    be added to a stack is the first item to be removed. So, stacks are also called
    first in first out (LIFO) lists. Pop is one of the basic operations of stack and
    is used to delete an element from a stack.


