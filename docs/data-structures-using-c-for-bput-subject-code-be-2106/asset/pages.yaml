    km by train. The distance between them is certainly more if travelled by road
    and shorter by plane. Here, the distance between the two stations can be indicated
    by connecting two cities by train, road, or air. The distances, both relative
    and absolute, between the cities are nothing but the train. This information helps
    a person to decide the mode of travel from station A to B. One can decide to go
    by train or bus depending upon the need, urgency and convenience. It should be
