    Figure 1.4 (c) Non-linear Data Structures


    **Linear** In linear data structures, values are arranged in linear fashion. Arrays,
    linked lists, stacks and queues are examples of linear data structures where values
    are stored in a sequence.


    **Non-Linear** This type is opposite to linear. The data values in this structure
    are not arranged in order. Tree, graph, table and sets are examples of non-linear
    data structures.


    **Homogenous** In this type of data structures, values of the same types of data
    are stored, as in an array.'
