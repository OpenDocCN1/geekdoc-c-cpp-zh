    \ order. The rule prescribes that each node should have bigger value than its\
    \ child node. The following steps are followed in heap sort:\n\n+   1. Arrange\
    \ the nodes in the binary tree form.\n2. Node should be arranged as per the specific\
    \ rules.\n3. If the inserted node is bigger than its parent then replace the node.\n\
    4. If the inserted node is less than its parent then do not change the position.\n\
    5. Do not allow entering nodes on right side until the child nodes of the left\
    \ are fulfilled.\n6. Do not allow entering nodes on left side until the child\
    \ nodes of the right are fulfilled.\n7. The procedure from step 3 to 6 is repeated\
    \ for each entry of the node.\n\n+   Consider the numbers 56, 23, 10, 99, 6, 19,\
    \ 44, 45, 23 for sorting using heap sort. Sorting process is illustrated in Fig.\
    \ 11.7.\n1. At first, we pick up the first element 56 from the list. Make it as\
    \ the root node.\n2. Next, take the second element 23 from the list. Insert this\
    \ into the left of the root node. Refer Fig.-11.7 (2)\n3. Then, take the third\
    \ element 10 from the list. Insert it to the right of the root node.\n4. Take\
    \ the fourth element 99. Insert it to the left side 23. The inserted element is\
    \ greater than the parent element, hence swap 99 with 23. But the parent node\
    \ 6 is smaller than the child node 99 hence 99 and 56 are swapped. After swapping\
    \ 99 becomes the root node. This is shown in Fig. 11.7 (4) and (5).\n5. Consider\
    \ the element 6 to insert in the tree. Insert it at left side. There exists left\
    \ node, hence insert it to the right of the 56. Refer Fig. 11.7 (6)."
