    # 9.7 EXTENDED BINARY TREE


    When every node of a tree has either 0 or 2 children then such a tree is called
    an extended binary tree or a 2-tree. The nodes with two children are called internal
    nodes. The nodes without children are known as external nodes. At some places
    in order to identify internal nodes in Figures 9.11 to 9.14 circles are used.
    The nodes in binary tree that have only one child can be extended with one more
    child. This extended binary tree can be used for implementing the algebraic equation
    because in the algebraic equation the left and right child nodes are operands
