  md: '# 6.2 Data Structures Using C


    # 6.1 INTRODUCTION


    A list is a series of linearly arranged finite elements (numbers) of same type.
    i.e. The data elements are called nodes. The list can be of two types, basic data
    type or custom data type. The elements are positioned one after the other and
    their position numbers appear in sequence. The first element of the list is known
    as head and the last element is known as tail.


    ![](img/c2f6b24e88575cdba9137937a75b3615_190_0.png)


    As shown in Fig. 6.1, the element 1 is at head position (1st position) and 2 is
    at tail position (6th). The element 5 is the predecessor of element 8 and 4 is
    the successor. Every element can act as a predecessor excluding the first element
    because it does not have a predecessor in the list. The list has following properties:


    +   - The list can be enlarged or reduced from both the ends.

    - The tail (ending) position of the list depends on how long the list is extended
    by the user.

    - Various operations such as traverse, insertion and deletion can be performed
    on the list.

    - The list can be implemented by applying static (array) or dynamic (pointer)
    implementation.


    # 6.2 LINKED LIST


    A linked list is a dynamic data structure. It is an ideal technique to store data
    when the user is not aware of the number of elements to be stored. The dynamic
    implementation of list using pointers is also known as linked list. Each element
    (data and link) of the linked list is called as node. Each node points to the
    next node. In the list, a node can be inserted or deleted at any position. Each
    node of linked list has two components. The first component contains the information
    or any data field and second part the address of the next node. In other words,
    the second part points to the next data item. The pointer variable member of the
    last record of the list is generally assigned a NULL value to indicate the end
    of the list. Fig. 6.2 indicates the linked list.


    ![](img/c2f6b24e88575cdba9137937a75b3615_190_1.png)'
