    8. Hashing technique is a complex searching technique. In this method, we fix
    the position of the key (element) into the table or the file, which is determined
    by the hash function. The function in which we use this key is hashing function.
    For example, we want to search a number from the ten numbers of a file. We must
    find the number throughout this range from the first number to tenth number. When
    we use the hash key for fixing its position in a table then it can be searched
    very easily. Some of the hashing techniques are discussed below:


    Division method: Method is considered as the simplest method. In this method,
    the integer x is divided by M and then using the remainder. This method is also
    known as the division method of hashing. The format of hash function is H(x) =
    x mod m;


    This method works just for any value of M. Care should be taken while choosing
    the value of M. It is better to take a large prime number. The main advantage
    of the division method is its simplicity.


    Middle-square method: The middle-square method employs a hashing method that avoids
    the use of division. In this method, x is multiplied by itself and the address
    is obtained by choosing an appropriate number of bits or digits from the middle
    of the square. The selection depends upon the table size and that they fit into
    one computer word of memory. The same positions in the square must be used for
    all keys.


    Multiplication method: This method is a slight variation of the middle-square
    method. In this technique, instead of multiplying the value itself, we have to
    multiply by a constant and then extract the middle K bits from the result.'
