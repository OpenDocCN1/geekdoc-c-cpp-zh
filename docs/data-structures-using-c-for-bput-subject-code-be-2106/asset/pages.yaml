  md: '# 9.2 Data Structures Using C


    ![](img/c2f6b24e88575cdba9137937a75b3615_322_0.png)


    Figure 9.1 Sample Tree


    A tree is a non-linear data structure and its elements are arranged in sorted
    order.

    Tree has several practical applications. It is immensely useful in manipulating
    data and to protect hierarchical relationship among data. The fundamental operations
    such as insertion, deletion etc is easy and efficient in tree data structure than
    in linear data structures. 9.2 represents family hierarchy, which keeps relations
    among them. The hierarchy gives relations between associates of family members.
    In this tree, node ''A'' can be assumed as a parent of ''B'' and ''C'', ''D''
    and ''E'' are the children of ''B''. ''F'' is the child of ''C''. This tree represents
    the relation between the family members.


    ![](img/c2f6b24e88575cdba9137937a75b3615_322_1.png)


    Figure 9.2 A Family Hierarchy in Tree Structure


    For example, suppose the left side member is male and right side member is female.
    Then, various relations such as sister, brother, grandfather, grandmother can
    also be implied.

    The algebraic expression can be represented with a tree. Consider the following
    example of an algebraic expression.


    ```

    Z=(J-K) / ((L*M) + N)

    ```


    The operators of the above equation have different priority. The priority of the
    operators can be represented by the tree structure. The operators of high priority
    are at low level operator and associated operators are represented in tree structure.
    Figure 9.3 illustrates the representation of an algebraic expression.


    # 9.2 BASIC TERMS


    Some of the basic concepts relevant to trees are described in this section. These
    are node, parents, roots, child, link, leaf, level, height, degree of node, sibling,
    terminal nodes, path length, and forest.'
