    (a) Abstract data types or ADTs are the mathematical specification of a set of
    data and the set of operations that can be performed on the data. They are abstract
    in the sense that the focus is on the constructors ofthese returns an abstract
    handle that represents the data, and the various operations with their arguments.
    The actual implementation is not defined and does not affect the use of the ADT.
    For example, rational numbers (numbers that can be written in the form $a/b$ where
    $a$ and $b$ are integers) cannot be represented natively in a computer.


