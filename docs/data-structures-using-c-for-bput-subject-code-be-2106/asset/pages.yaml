    to manage the memory during program execution. According to the request made by
    the program, memory can be allocated. In this technique, wastage of memory can
    be avoided. This is efficient for multiprogramming and single user environment,
    in which more than one program is executed simultaneously. The exact amount of
    memory needed for the programs can be estimated only during program execution.
    The operating system performs dynamic storage management. The linked list is an
    example of dynamic storage management. In linked list, we have noticed during
    program execution that new node is created memory is allocated. Thus, depending
    upon the need of the user, any number of nodes can be created. Following are the
