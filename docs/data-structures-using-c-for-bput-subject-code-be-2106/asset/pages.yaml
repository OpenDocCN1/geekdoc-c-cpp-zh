    # IMPORTANT TERMS


    We have already discussed in previous sections that a linked list is a non-sequential
    collection of elements called nodes. These nodes are nothing but objects. These
    nodes are declared using structure or classes. Every node has two fields and they:


    +   1. Data field: In this field, the data or values are stored and processed.

    2. Link field: This field holds address of the next data element of the list.
    This address is used to access the successive elements of the list.


    In the linked list the ordering of elements is not done by their physical location
    in the memory but by logical links, which are stored in the linked field.


    Node The components or objects which form the list nodes.


    Null Pointer The link of the last record is assigned a NULL value instead of any
    address. It means NULL pointer not pointing to any element.


    External Pointer It is a pointer to the starting node. The external pointer contains
    the base, i.e. address of first node. Once a base is available, its next successive
    nodes can be accessed.


    Empty List When there is no node in the list, it is called as empty list. If the
    external pointer were assigned a value NULL, the list would be empty.


    # 6.4.1 Static List Versus Linked List


    +   1. The static list is implemented using arrays. The linked list uses pointer
    in which memory can be allocated or de-allocated during program execution. The
    linked list is more efficient in memory management. The linked list can be expanded
    or shrunk as per requirement whereas in static list one array defines its size
    throughout the program.

    2. Once an array is declared, its size remains the same. The memory allocated
    for array may be extra or insufficient. The user cannot determine the exact amount
    of memory required. Due to this, the program execution may not be safe. The array
    has intrinsic flexibility to enlarge or reduce the capacity of storage. We are
    acquainted with pointer operations increment/decrement, which allows access to
    any memory location. The use of pointer to point the next node in the linked list
    structure indicates that elements which are logically contiguous due to linear
    organization are not physically contiguous in memory. This type of memory allocation
    is called linked allocation.

    3. The elements are stored in order as well as physically. Array elements are
    stored in successive locations. This is not the case in the linked list. Insertion
    and deletion with static list take consuming and shifting of elements is done
    to rearrange the numbers in order. In the linked list the insertion'
