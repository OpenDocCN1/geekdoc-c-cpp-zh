    # 3.6 RECURSION VERSUS ITERATION


    We have studied recursion and iteration. They can be applied to a program depending
    upon the situation. Table 3.2 explains the differences between recursion and iteration.


    # Table 3.2 Recursion Versus Iteration


    | Recursion | Iteration |

    |---|---|

    | Recursion is the term given to the mechanism of defining a set or procedure
    in terms of itself. | The block of statement executed repeatedly using loops.
    |

    | A conditional statement is required in the body of the function for stopping
    the function execution. | The iteration control itself contains statement for
    stopping the iteration. At every execution, the condition is checked. |

    | At some places, use of recursion generates extra overhead. Hence, better to
    skip when easy solution is available with iteration. | All problems can be solved
    with iteration. |

    | Recursion is expensive in terms of speed and memory. | Iteration does not create
    any overhead. All of the programming languages support iteration. |


    Figure 3.6 illustrates the iterative process.


    **Initialization** The variables involved in the iteration process are initialized.
    These variables are used to decide when to end the loop.


    **Loop continuation condition** The loop variable is used to decide whether to
    continue or discontinue the loop. When the condition is true, control goes to
    computation blocked or else it exits.


    **Computation** The required processing or computation is carried out in this
    block.'
