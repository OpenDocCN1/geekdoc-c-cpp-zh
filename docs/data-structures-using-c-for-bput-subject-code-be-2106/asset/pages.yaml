    # 12.8 MID-square METHOD


    In mid-square method the key is multiplied with itself and middle digit is chosen
    as the address of the element in the hashing table. It is defined as follows:


    H(k) = (k*k)

    For example, if the key is k=12

    H(12) = (12*12)=144.


    In this example, the key is 12, its square is 144 and its middle digit is 4. Hence,
    12 is placed in the hash table in the index a4 which is the address of 12. Similarly,
    for other keys the squares are calculated and mid digits are evaluated. Based
    on the mid digits the squares are placed in the appropriate index. Here, the mid
    digit obtained from 0 to 9. We may need up to 10 indices starting from index 0
    through index 9.


    For example, if the key is k-10

    H(10)=(10*10)=100. Its middle digit is 0. Hence would be placed in index 0. Similarly,
    the procedure is adopted for all other numbers and they are placed in different
    indices based on the mid digit value. Table 12.2 describes the above concepts.


    Consider the following for constructing the hashing table:

    12, 14, 18, 20, 26, 36, 31, 27, 23, 59.


    Table 12.2 Table of Key, Square and Mid


    | Key | Square | Mid | Key | Square | Mid |

    | 12 | 144 | 4 | 31 | 961 | 6 |

    | 14 | 196 | 9 | 27 | 729 | 2 |

    | 18 | 324 | 2 | 15 | 225 | 2 |

    | 20 | 400 | 0 | 23 | 529 | 2 |

    | 26 | 676 | 7 | 23 | 841 | 4 |'
