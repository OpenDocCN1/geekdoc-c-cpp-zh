    # 9.11 CONVERSION OF EXPRESSION INTO POSTFIX


    The arithmetic expression can be converted from infix to postfix. Consider the
    following example:

    (A+B) * (D/E)


    In the conversion of the expression into binary tree the operator divides the
    expression into two parts, and on that basis the binary tree is formed. Always
    the operators are at the root nodes and the operands are at the leaf nodes.


    In above expression at first the ''*'' operator divides the expression into the
    two parts, i.e. (A+B) and (D/E). The ''*'' is at the root of the tree.


