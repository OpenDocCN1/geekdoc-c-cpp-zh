    dynamic implementation is achieved using pointers. Using pointer implementation
    at run time is no restriction on the number of elements. The stack may be expandable.
    The memory is efficiently utilized with pointers. Memory is allocated only after
    element is pushed to the stack. Both the above implementations are illustrated
    with suitable examples in the next section.


    # 4.4 OPERATIONS ON STACK


    The following fundamental operations on stack can be carried out through static
    implementation called array implementation. Operation on stack is also possible
    with the pointers, which is called dynamic implementation. We will perform the
    following operations on the stack:


    +   1. Creating a stack

    2. Checking stack—either empty or full

    3. Initializing a stack

    4. Insert (push) an element in the stack

    5. Delete (pop) an element from the stack

    6. Access the top element

    7. Display elements of stack

    8. Status: to identify position of stack.


    Some relevant to the stack operations are narrated below.


    **Push** The procedure of inserting a new element to the top of stack is known
    as push operation. After every push operation, the top is incremented by one.
    When the array is full (if static implementation is applied) the status of stack
    is full and this condition is called stack overflow. If no further element can
    be inserted. After every *push* operation, the new element rests at the top. Fig.
    4.6 (a) shows the push operation.


    ![](img/c2f6b24e88575cdba9137937a75b3615_119_0.png)


    **Pop** The procedure of removing element from the top of the stack is called
    as *pop* operation. After every *pop* operation, the top is decremented by one.
    If there is no element in the stack, it is called as empty stack or stack underflow.
    In such a case, *pop* operation cannot be applied. Fig. 4.6 (b) illustrates the
    pop operation.'
