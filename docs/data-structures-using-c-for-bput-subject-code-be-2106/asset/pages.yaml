    # 6.19 CIRCULAR LINKED LIST


    In circular list the last node points to the header node. The linear linked list
    can be converted to linked list by linking the node to the first node. The last
    node of the linear linked list holds NULL pointer, which indicates the end of
    linked list but performance of linked list can be enhanced with minor adjustment
    in the linked list. Instead of placing the NULL pointer, the address of the first
    node can be given to the last node, a such list is called circular linked list
    (as shown in 6.22).


    The circular linked list is more helpful as compared to singly linked list. In
    the circular linked list, all the nodes of the list are accessible from the given
    node. Once a node is accessed, traversing all the nodes can be accessed in succession.


    ![](img/c2f6b24e88575cdba9137937a75b3615_235_0.png)


    Figure 6.22 Circular Linked List


    In this type of list, the deletion operation is very easy. To delete an element
    from the singly linked list, it is essential to obtain the address of the first
    node of the list. For example, we want to delete the element, five, which exists
    in the list of many. To remove the element five, we need to find predecessor of
    five. Obviously, a particular element can be searched by searching process in
    which all elements are visited and compared. In the circular list, no such process
    is needed. The address of predecessor can be found from the given element itself.
    In addition, the operation splitting and concatenation of the list (discussed
    later) are easier.\ Though the circular linked list has advantages over linear
    list, it also has some limitations. This list does not have first and last node.
    While traversing the list, due to lack of NULL pointer, there may be a possibility
    to get into an infinite loop. Thus, in the circular linked list it is necessary
