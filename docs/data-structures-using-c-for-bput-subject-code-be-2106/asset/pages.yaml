    # ## 9.1 INTRODUCTION


    In the previous chapters, we have studied various data structures such as arrays,
    stacks, queues and linked list. All these are linear data structures. In these
    data structures the elements are arranged in a linear manner, i.e. one after another.
    Tree is an equally useful data structure of non-linear type. In tree, elements
    are arranged in non-linear fashion. A tree structure means data is organized in
    branches. Figure 9.1 is a sample tree.'
