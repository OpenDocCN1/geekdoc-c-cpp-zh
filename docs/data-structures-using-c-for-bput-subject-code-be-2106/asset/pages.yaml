  md: '# Recursion


    # 3.13


    ![](img/c2f6b24e88575cdba9137937a75b3615_105_0.png)


    **Update** The decision argument is changed and shifted to next iteration.

    The common algorithm for any kind of recursive function is shown in Fig. 3.7.


    **Preliminary part** The use of this block is to store the local variables, formal
    arguments and return address. The end-part will restore these data. Only recently
    saved arguments, local variables and return address are restored. The variables
    last saved are restored first.


    **Body** If the test condition is satisfied, it performs the complete processing
    and control passes to end-block. If not, partial processing is performed and a
    recursive call is made. The body also contains calls to itself one or more calls
    can be made. Every time a recursive call is made, the preliminary part of the
    function saves all the data. The body also contains two processing boxes i.e.
    partial processing and complete processing. In some programs, the result can be
    calculated after complete processing. For this, the recursive call may not be
    required. For example, we want to calculate factorial of one. For this, it is
    needless to call function recursively. It can be solved by transferring control
    to to complete processing box.


    In other case, if five is given for factorial calculation, the factorial of five
    can be calculated in step 8. Hence, the function will be called recursively. Every
    time one is solved, i. 5*4*3 and so on. Hence, it is called partial processing.


    **Depth of Recursion** The recursion function calls itself infinite times. If
    we want to calculate factorial of five we can easily estimate the number of times
    the function would be called. In this case, we determine the depth of the recursive
    function. In complex program, it is difficult to determine the of calls of recursive
    function.'
