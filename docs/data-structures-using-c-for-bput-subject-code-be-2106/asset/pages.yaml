    Queue can be put into operation in two ways:


    +   a. Static implementation (array)

    b. Dynamic implementation (pointers).


    # 5.3.1 Static Implementation


    The static implementation is done with an array. In this implementation, we should
    know the exact number of elements to be stored in the queue. The size of array
    is declared before execution at compile time. Once the array is declared, its
    size cannot be altered during the run time of the program. The beginning of the
    array, i.e. 0th element is the front and the last memory location will be rear
    of the queue. A queue can be created by declaring an array that holds the entries.
    Here, we should keep track of both front as well as rear of the queue. Assume
    an array of integer data types as declared below.


    ```

    int queue [8];

    ```


    In the above, an array queue [] of integer type is declared.

    From the Fig. 5.5 we can see that six locations of a queue are filled and the
    remaining two are vacant. The element 5 is at front and 8 is at rear.


    +   1. If the value of front element is zero, then the queue is empty.

    2. If the value of queue [7] is non-zero then the queue is full.

    3. When an element is inserted, the position of rear increases.

    4. When an element is deleted from the queue the value of front increases by one.


