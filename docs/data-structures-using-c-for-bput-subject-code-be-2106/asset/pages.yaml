    ### 7.1 INTRODUCTION


    The fundamental purpose of any program is to manipulate data and its storage in
    the computer memory. Storage management consists of techniques that are used to
    manage the heap. Two memory management techniques are used for this purpose. They
    are:


    +   1. Static storage management

    2. Dynamic storage management.


    **Static Storage Management** It is necessary to load the program into the memory
    before execution of a program. Before execution of a program, it is essential
    that the system should have enough memory. When program execution starts, it takes
