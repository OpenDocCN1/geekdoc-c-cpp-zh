    statements is repetively executed,


    An iteration is nothing but a repetitive execution of statements. One more operation
    used in combination with data structures is update operation. This operation changes
    data of data structures. An assignment operation is a good example of update operation.
    For example,


    ```

    int X=2;

    ```


    Here, 2 is assigned to x.


    ```

    X=4;

    ```


    Again, 4 is reassigned to x. The value of x now is 4 because 2 is automatically
    replaced by 4, i.e. updated.


    # 1.6 BINARY AND DECIMAL INTEERS


    Data is expressed in terms of 0 and 1 as bits. Different number systems are used
    to represent numbers. For example, decimal, octal and hexadecimal number systems,
    can be used. The decimal system uses ten symbols from 0 to 9, octal uses 0 to
    7, hexadecimal from 0 to 9 and from A to F. We can convert from one number system
    to another. To convert a decimal to binary, the double method is used. In this
    method, the decimal number is divided by 2 and remainders are listed in reverse
    direction. The binary number obtained from this method is the equivalent of the
    decimal. For example, the binary 111 is nothing but decimal 7. In the binary system,
    every bit has its own weight. The least significant bit has 2⁰ weight. Weight
    is calculated to the power of 2. The right-most bit of a binary number has a value
    of 1, which is represented as 2⁰. The next bit has value 2¹ and so on the values
    for further bits can be calculated. In other words, weights are assigned to each
    bit in binary. The weights from the least significant bits are 1,2,4,8----.


    For example, the complete binary representation of 5 is 101. This is explained
    as follows:


    ```

    1 × 2² + 0 × 2¹ + 1 × 2⁰

    4 + 0 + 1 = 5

    ```'
