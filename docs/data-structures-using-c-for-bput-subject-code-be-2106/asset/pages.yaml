    # 9.3 GENERAL TREE


    A general tree is similar to the family tree. The origin of the family tree is
    called the root node. The various generations are represented in hierarchical
    structure with nodes. A tree is a finite set of one or more nodes. A root node
    T may have n number of children T₁, T₂, ... Tₙ. The total number of children may
    vary.


