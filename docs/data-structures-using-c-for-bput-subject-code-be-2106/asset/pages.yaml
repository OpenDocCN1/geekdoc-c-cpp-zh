    # ## 8.1 INTRODUCTION


    Stacks have various real-life applications. Stacks are used to maintain the sequence
    of processing. In solving arithmetic expressions, stacks are used. Stacks are
    used to convert bases of numbers. In a large program, various functions are invoked
    by the `main()` function; all these functions are stacked in the memory. Most
    of the calculators work on stack mechanism.


    # ## 8.2 INFIX, PREFIX AND POSTFIX NOTATIONS


    Arithmetic expressions can be defined in three kinds of notation: infix, prefix
    and postfix. The prefixes in- and post indicate the relative location of the operator
    with two operands.'
