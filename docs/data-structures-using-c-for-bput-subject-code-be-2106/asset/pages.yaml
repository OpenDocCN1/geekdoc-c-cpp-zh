    # 9.10.4 Creation of a Binary Tree from its Traversals


    We can construct a binary tree from its traversals. A unique binary tree can be
    created from two traversals. The process is as follows:


    +   • If the preorder traversal is given, the first node is the root node.

    • If the postorder traversal is given, then the last node is the root node.

    • After identifying the root node, one can easily find the nodes of the left and
    right sub-tree.


    Some examples are given below.


    Example 9.8 Construct a binary tree from the given inorder and postorder traversal.


    Inorder: CBDAFEG

    Postorder: CDBGEA


    +   1. It is clear that A is the root of the tree since the root is traversed
    last in the postorder traversal.

    2. The inorder traversal indicates all the nodes that are on the left side of
    A belonging to the left sub-tree and those on the right side of A belonging to
    the right sub-tree.


    Step 1:


    9.36 indicates that CBD is the left sub-tree of the root node A and FEG is the
    right sub-tree of the root node A. From the left sub-tree CBD, one can obtain
    the root from the postorder traversal, i.e. B is the root node. Thus, from the
    inorder traversal we can say that C is the left child of B and D is the right
    child of B. Similarly, for the right sub-tree of A, i.e. FEG, one can obtain E
    as the root node from the given postorder traversal. From the inorder traversal,
    one can obtain F as the left node of node E and G as the right node of node E.
