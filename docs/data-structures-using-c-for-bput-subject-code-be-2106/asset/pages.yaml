    +   1. First-fit storage allocation

    2. Best-fit storage allocation

    3. Worst-fit storage allocation

    4. Next-fit storage allocation.


    # 7.5.1 First-fit Allocation


    This is a straightforward way of memory allocation. In this method when a request
    is made, first available blocks are searched. When a free block of memory is obtained,
    a pointer to the same block is returned to call function. In this method, the
    memory allocated is always larger than the memory required. This process requires
    a minimum search for the needed size of memory. The first fit method allocates
    lowest memory addresses.


    # 7.5.2 Best-fit Storage Allocation


    In this type, the required memory and allocated memory are calculated. The memory
    is allocated in such a way that the need of memory and allocated amount of memory
    is satisfied. For example, required memory is R and allocated memory is A and
    assume the difference is D. Then, D is very small. In the examples, so far we
    have observed that whenever memory is needed for a single node it is requested
    by the program using malloc() function. Hence, our unit of memory is node. This
    technique reduces consumption of memory as the required memory and allocated memory
    is very close.


    # 7.5.3 Worst-fit Storage Allocation


    This method is opposite of best-fit allocation. Instead of finding a smaller block
    close to request size of block, this method searches the largest block and allocates
    it. The worst-fit allocation decreases the creation of small block as created
    in best-fit allocation.'
