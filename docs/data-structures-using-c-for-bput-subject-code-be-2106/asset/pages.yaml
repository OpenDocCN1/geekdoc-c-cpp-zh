    4.1 INTRODUCTION

    In this chapter, we will study one of the most important simple data structures
    ''stack''. Stack is an important tool in programming languages. Stack is one of
    the most essential linear data structures. Implementation of most of the system
    programs is based on stack data structure. We can insert or delete an element
    from a list, which place from one end. The insertion of element onto the stack
    is called "push" and deletion operation is called "pop", i.e. when an item is
    added to the stack the operation is called "push" and when it is removed the operation
    is called "pop". Due to the push operation from one end, elements are added to
    the stack, which is also known as pushdown list. The most and least reachable
    elements in the stack are respectively known as the "top" and "bottom" of stack.
    A stack is an arranged collection of elements into which new elements can be inserted
    or from which existing elements can be deleted at one end. A set of elements in
    a last-in-first-out technique. As per Fig. 1 the last item pushed onto the stack
    is always the first to be removed from the stack. The end of the stack from which
    the insertion or deletion operation is carried out called top. In Fig. 4.1(a)
    a stack of numbers is shown.

    As shown in Fig. 4.1(a) the stack is based on the rule last-in-first-out. The
    element appended lastly is deleted. If we want to delete element 3 it is necessary
    to delete the top elements 5 and 4 first.'
