    outgoing edges.


    Pendant Node When indedegree of node is one and outdegree is then such a node
    is called pendant node.


    Reachable If a path exists between two nodes it will be reachable from one node
    to other node.


    Isolated Node When degree of node is zero, i.e. node is not connected with any
    other node then it is isolated node. In Fig. 10.13 B node is the isolated node.


