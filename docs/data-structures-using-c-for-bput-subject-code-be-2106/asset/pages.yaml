    **Adjacency list:** Here, for each vertex we keep a list of all adjacent vertices.
    We maintain two lists in the adjacency list representation of graphs. The first
    list will keep track of all the nodes in the graph. The second list will contain
    a list of adjacent nodes for every node. Each list has a header node, which will
    be the corresponding node in the first list. The headers are sequential providing
    easy, random access to the adjacency list for any particular vertex.


