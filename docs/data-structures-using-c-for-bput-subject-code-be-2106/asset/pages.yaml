    # 8.3 EVALUATION OF POSTFIX EXPRESS


    The postfix expressions are very simple. On the other hand, programming of evaluation
    of expression is complicated. This is because the numbers and characters are mixed
    in one string. The programmer needs to separate digits and symbols and perform
    arithmetic operation.


    Each operator in the postfix expression is associated with the previous two operands.
    When we read an operand from a given expression it is pushed onto the stack. When
    an operator symbol is read, the operands associated with it are the top elements
    of the stack. We can pop two elements from the stack and perform the operation.
    The obtained result from the last operation is again pushed onto the stack. Table
    8.5 describes the algorithm for conversion of the infix expression to postfix.


    Table 8.5 Algorithm for Conversion of Infix to Postfix


    | Algorithm |

    | --- |

    | 1. Insert a '';'' at end of X, where X is an expression |

    | 2. Check X from left to right and go back the next 3 and 4 steps for every element
    of X until '';'' is found. |

    | 3. In case operands are found, push it onto the stack. |

    | 4. If any operator is found, pop the top two elements from stack. |

    | b. Evaluate the expression formed by top two elements. |

    | c. Push the result obtained onto the stack. |

    | 5. Allocate value equal to top stack element. |

    | 6. Quit. |


