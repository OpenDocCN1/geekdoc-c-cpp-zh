    # SUMMARY


    +   1. Array is a very popular and useful data structure used to store data elements
    in successive manner. Array is a linear and homogenous data structure. Homogeneous
    means same types of elements are stored in it. It may be non-homogenous if structure
    is associated with it.

    2. One-dimensional arrays having only one row of elements and elements are stored
    in successive memory locations.

    3. The various operations carried out with arrays are insertion, deletion, searching,
    sorting, etc.

    4. Two-dimensional arrays can be thought of as rectangular display of elements
    with rows and columns.

    5. A three-dimensional arrays can be thought of as array of arrays.

    6. The collection of characters, digits, and symbols enclosed within quotation
    marks are called strings. Strings are always declared as character array. Like
    other type of arrays, elements of character array are also stored in continuous
    memory location. Each character array occupies one byte in memory. One different
    thing about strings is that, the compiler automatically adds NULL (''0'') character
    at the end of string.


