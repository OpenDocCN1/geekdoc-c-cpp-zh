  md: "# 12.2 Data Structures Using C\n\n```\nstruct employee {\n  char *name;\n \
    \ int age;\n  float height;\n}\n```\n\nWe are familiar with the above declarations\
    \ and definitions. The object s contains three fields as described in the structure.\
    \ The database is collection of such fields. Each record contains the above fields\
    \ or may vary depending upon the structure defined. The sorting can be done on\
    \ any one or combination of one or more fields. Suppose, we sort the records based\
    \ on name. Then, the field name will be the key field. A record is quickly searched\
    \ in a sorted database. Thus, sorting and searching are very useful concepts of\
    \ data structure. This chapter aims to provide the information on searching and\
    \ its techniques.\n\n# 12.2 SEARCHING\n\nSearching is a technique of finding an\
    \ element from the data list or of the elements in an array, list, or trees. It\
    \ is a technique to find out an element in a sorted or unsorted list. For example,\
    \ an array of 10 elements. These data elements are stored in successive memory\
    \ locations. We need to search an element from the array. In the searching operation,\
    \ assume a particular element n is to be searched. The element n compared with\
    \ all the elements in a list starting from the first element of an array till\
    \ the last element. In other words, the process of searching is continued till\
    \ the element or list is completely exhausted. When the match is found then the\
    \ search process is terminated. In case no such element exists in the array, the\
    \ process of searching should be abandoned.\n\nIn case the element is existing\
    \ in the set of elements or array then the search process is said to be successful\
    \ as per Fig.12.1. It means that the given element belongs to the array. The search\
    \ is said to be unsuccessful if the given element does not exist in the array\
    \ as per Fig.12.2. It means that the element does not belong to the array or collection\
    \ of them.\n\nThe complexity of any searching method is determined by the number\
    \ of comparisons performed among the collected elements in order to find the element.\
    \ The time required for the operation is dependent on the complexity of the operation\
    \ or algorithm. In other words, the performance of searching algorithm can be\
    \ measured by counting the comparisons in order to find the element from the list.\
    \ There are three cases in which an element can be found.\n\nIn the best case,\
    \ the element is found during the first comparison itself. In the worst case,\
    \ the element is found only in the last comparison. Whereas in the average case,\
    \ number of comparisons are more than comparisons in the best case and less than\
    \ the worst case.\n\nThe searching can be classified into following types:\n\n\
