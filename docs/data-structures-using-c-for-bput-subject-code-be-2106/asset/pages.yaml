  md: "# Solved Question Papers\n\nQueue is a linear data structure, which follows\
    \ the principle of FIFO (First In Out). In other words, we can say that if the\
    \ FIFO principle is implemented with array, then it is termed as queue. Stack\
    \ is a data structure, which follows the principle of FIFO (Last In Out). In other\
    \ words we can say that if the FIFO principle is implemented with array, then\
    \ it is termed as stack.\n\n```\nInsert (Queue [Size], Rear, No)\nStep 1: if (rear=size\
    \ -1) then:\n  write: \"overflow\"\n  return\n  [end of if]\nStep 2: if (rear=\
    \ -1) then:\n  front=0\n  rear=0\n  else\n  rear=rear+1\n  [end of if]\nStep 3:\
    \ queue [rear] = no\nStep 4: return\n```\n\nQueues have applications in topological\
    \ sorting and BFS.\n(B) The expression can be evaluated by using stack as.\n\n\
    | | | ^ | / |\n|---|---|---|---|n| 2 | 4 | 2 | 6 |\n| 5 | (5*2) | ((5*2)-4) |\
    \ ((5*2)-4)^2) |\n| 12 | 12 | 12 | 12 |\n\n| + | |\n| (((5*2)-4)^2)/6) | 12 +\
    \ (((5*2)-4)^2)/6) |\n| 12 | |\n\n2. (a) Conversion from infix to postfix using\
    \ stack:\n\n(C - D)+ (E*F) F/ (H + W)*A*B\n\n# Procedure for conversion:\n\n+\
    \   Step 1: Insert an parenthesis at the beginning and closing parenthesis at\
    \ the end of the expression.\nStep 2: Arrange the expression in the array.\nStep\
    \ 3: Scan all the elements in the array. If an element is an operator, store it\
    \ in the postfix and push it into the stack followed by Step 4 and Step 5.\nStep\
    \ 4: If the scanned operator has a less or equal precedence to the existing operator,\
    \ pop out the operators from the stack till a precedence operator or opening parenthesis\
    \ is found."
