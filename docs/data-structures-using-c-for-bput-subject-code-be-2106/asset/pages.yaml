    # 5.9 APPLICATIONS OF QUEUES


    There are various applications of computer science, which are performed using
    data structure queue. This data structure is widely used in mission, various features
    of operating system, multiprogramming platform systems and different type of scheduling
    algorithm are implemented using queues. Round robin technique is implemented using
    queues. Printer server routines, various applications software are also based
    on queue data structure.


    # 5.9.1 Round Robin Algorithm


    Round Robin (RR) algorithm is an important scheduling algorithm. It is used especially
    for the timesystem. The circular queue is used to implement such algorithms.

    For example, there are N procedures or tasks as P1, P2, P3 ... Pn. All tasks are
    to be executed by the central processing unit (CPU) of the computer system. The
    execution times of the tasks or processes are different. The tasks are executed
    in sequence P1, P2 ... Pn and P1.

    In time, sharing modes for each task. The algorithm forms a small quantum of time
    or quantum of a task. from 10 to 100 milliseconds for each task. This time is
    called slice or time quantum of a task. The CPU executes tasks from Pi to Pn allocating
    fixed amount of time for each process. Allocating time to all tasks, CPU resumes
    the first task. That is, when all tasks are completed, it returns to Pi. In the
    timesystem, if any task is completed before the estimated time, the next task
    is taken up for execution immediately. Consider the following:


    | Tasks | Expiry Time (Units) |

    |--- |--- |

    | P1 | 10 |

    | P2 | 19 |

    | P3 | 8 |

    | P4 | 5 |


    There are total four tasks and the total time to complete all the tasks would
    be (10+19+8+5) 42 units. Suppose, the time slice is of 7 units. The RR scheduling
    for the above case would be given by the following paragraph.

    In the first pass each task takes units of time-task P4 is executed in the first
    pass whereas P1, P2, P3 requires more than 7 units of time. Hence, in the second
    round task P1 and P3 are executed. At last, P2 is executed.'
