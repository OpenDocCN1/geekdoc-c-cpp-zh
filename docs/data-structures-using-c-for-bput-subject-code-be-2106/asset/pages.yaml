    +   (b) It is also known as partition exchange sort. It was invented by C.A. R
    Hoare. It is based on partition. The method fails under the divide and conquer
    technique. The main list of elements is divided into two sub-lists. For example,
    a list of X elements is to sorted. The quick sort marks an element in a list called
    as pivot or key. Consider the first element J as a pivot. Shift all the elements
    whose value is less than J to the left and elements whose value is greater than
    J to the right of J. Now, the key element divides the main list into two parts.
    It is not necessary that the selected key element be in the middle. Any element
    from the list can act as the key element. However, for best performance, preference
    is given to middle elements. The consumption of quick sort depends on the location
    of the key in the list.'
