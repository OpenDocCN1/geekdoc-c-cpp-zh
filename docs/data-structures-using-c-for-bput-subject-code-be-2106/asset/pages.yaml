    \nWhile studying the linked representation of a binary tree, it is observed that\
    \ the number of nodes that have null values are more than the non-null pointers.\
    \ The number of left and right leaves nodes has number of null pointer fields\
    \ in such representation. These null pointer fields are used to keep some other\
    \ information for operations of binary tree. The null pointer fields are used\
    \ for storing the address fields of higher nodes in tree, which is called threaded.\
    \ Threaded binary tree is the one in which we find these of pointers from null\
    \ pointer fields to higher nodes in a binary tree. Consider the following:\n\n\
    In 9.50, there are 5 actual nodes, 7 non-null pointers (solid lines). There are\
    \ 12 total pointers out of 5 actual code nodes, 5 non-null pointer (solid lines).\
    \ For any binary tree having n nodes there are (n+1) null pointers and 2n total\
    \ pointers. All the null pointers can be replaced with appropriate pointer value\
    \ called traversal method. The null pointer can be replaced as follows:\n\nThreaded\
    \ binary tree can be traversed by any one of the three traversals, i.e. preorder,\
    \ postorder and inorder. Further, inorder threading there may be one-way inorder\
    \ threading or two-way inorder threading. In one inorder threading the right child\
    \ of the node would point to the next sequence in the inorder traversal. Such\
    \ a threading tree is called right in threaded binary tree. In both the children\
    \ of the nodes point to other nodes then such a tree is called as fully threaded\
    \ binary tree.\n\n![](img/c2f6b24e88575cdba9137937a75b3615_359_0.png)"
