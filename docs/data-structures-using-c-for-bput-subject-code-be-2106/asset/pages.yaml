    +   7. (a) The radix sort is based on the positional value of the actual digits
    of the number being stored. This method was earlier performed on a mechanical
    card sorter. For example, the number 245 in decimal notation is written with a
    2 in the hundredth position, 4 in the ten''s position and 5 in the unit''s position.
    These three digits will be sorted in a maximum of 3 passes. In the first pass,
    the unit''s digit will be sorted, in the second pass the ten''s digit will be
    sorted and in the third and final pass the hundred''s digit will be sorted.

    The radix sort technique is used when large lists of names are to be sorted alphabetically.
