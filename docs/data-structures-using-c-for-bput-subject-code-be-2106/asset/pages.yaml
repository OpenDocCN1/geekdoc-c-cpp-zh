    # 8.10 SCOPE RULES


    The above program is based on scope rule of the variable. The scope rules are
    of two kinds:


    +   1. Static scope

    2. Dynamic scope.


    **Static Scope** The static scope declares the variable in circumstances of syntactic
    program structure. In such program structure, one can easily conclude the declaration
    of variable by only reading the program. In this is why the rule is known as static.
    The static rule can be defined as:


    +   a. The scope of a variable is limited to the current block in which it is
    declared, other blocks have no access to the variable.

    b. If a variable is not declared in a particular block, in such a case, the variable
    declaration of previous block is considered. If declaration, not found, it searches
    the nested blocks until the declaration is found. This is called "most closely
    nested scope".


    For example, consider the following program from the previous program:


    ```

    {

    int j;

    printf("n Address of j =%u", j);

    }

    ```


    If we remove the statement int j, the output of the program would be:


    ```

    Address of j =65524

    Address of j =65524

    Address of j =65524

    ```


    This is because when declaration is not found in the above block, the nearest
    costly declaration is considered and this is why the address of variable j declared
    in main() is printed.


    **Dynamic Scope** The dynamic scope is different from static scope. In the dynamic
    scope, address of variable is determined at the time of program execution. The
    same variable name can be defined several times in the same program. The variable
    is activated in the memory when a sub-block is under execution. However, the variables
    have same name but their addresses are different. Hence, no ambiguous situation
    occurs for compiler.


    The declaration of variables is considered from the nearly occurring and currently
    active definition of the variable during execution of the program.


