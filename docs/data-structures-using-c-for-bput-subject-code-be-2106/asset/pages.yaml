    (c) A queue consists of a linear list of elements in which deletion takes place
    at one end called the front and insertion takes place at another end called the
    rear. Queue is also called FIFO. The disadvantages of queues are as follows:


    +   * Whenever an element is deleted from the queue, the value of front is increased
    by 1. Front = Front+1.

    * Whenever an element is inserted in a queue, the value of rear is increased by
    1. Rear = Rear+1. When the rear indicates the last location of the queue it means
    that the queue is full. If there is space in the queue but the rear indicates
    the last location, we are unable to insert the element. If we try to do so, the
    program will flag the "Queue" though it is empty.


    (d) The simplest way to resolve a collision is through closed hashing. Suppose
    there is a hash table of size b and the key of interest is mapped to an address
    location, i, with a hash function. Closed hashing can be stated as indicated below:

    Start with the hash address where the collision has occurred and let it be i.
    Then the sequence below needs to be followed:


    ```

    i, i+1, i+2,...,b, 1, 2,...,i-1

    ```


    The search will continue until one of the following cases occurs:

    * The key is found.

    * Unoccupied (or empty) location is encountered.

    * It reaches the location where the search was started.


