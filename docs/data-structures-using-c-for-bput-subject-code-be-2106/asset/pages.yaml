  md: '# 2.2 Data Structures Using C


    When we declare a variable for example,

    int X;


    The variable x is declared and a memory location of two bytes is allocated to
    it. Later, a single value can be stored in it as in Fig. 2.1.

    X=4;


    The VITA concept is associated with all variables.

    V stands for value of a variable

    T stands for identification of a variable

    T stands for type of a variable

    A stands for address of a variable


    Every variable has a name, value and memory location. Hence, from the above, we
    can say that one value can be stored in a variable.


    ![](img/c2f6b24e88575cdba9137937a75b3615_46_0.png)


    Figure 2.1 Variable, Value and Address


    # 2.1.1 Array Declaration and Initialization


    To store more than one value, programming languages have an in-built data structure
    called array.


    +   a) int num[5];


    In the above declaration, an integer array of five elements is expanded. Memory
    for 5 integers, i.e. 10 successive bytes are reserved for num array. To initialize
    a num array, the following syntax can be used:


    +   b) int num[5] = {1, 2, 4, 2, 5};


    In the above statement, all elements are initialized. It is also possible to initialize
    individual elements as follows:


    ```

    num[0]=1;

    num[1]=2;

    num[2]=4;

    num[3]=2;

    num[4]=5;

    ```


    The initialization can be done at compile time or dynamically at run time. This
    is an example of compile-time initialization. In the statement (b) declaration
    and initialization is done at once. In such declaration, the number of elements
    (5) need not to be mentioned in the []. The compiler automatically counts the
    values and assumes the number of elements initialized as the array size.


    In the above array, the element num[0], i.e. 1 is the lower bound and num[4],
    i.e. 5 is the upper element. In C, there is no checking. Hence, the programmer
    has to check it while accessing or storing elements. The array is declared, its
    lower bound cannot be changed or the upper bound can. The array itself is a constant
    pointer and, therefore, we cannot modify it. Storing in successive memory locations
    can expand the upper bound.


    The array name is a pointer. The array num is pointer to the memory location where
    element 1 is stored as in Fig. 2.2. The address stored in name is called the base
    address. To access individual elements, the following syntax is used:


    ```

    num[0] refers to the 1

    num[1] refers to the 2

    ```


    ![](img/c2f6b24e88575cdba9137937a75b3615_46_1.png)


    Figure 2.2 Arrays of Indices'
