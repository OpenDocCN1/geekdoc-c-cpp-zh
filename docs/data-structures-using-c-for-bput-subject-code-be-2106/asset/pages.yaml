  md: '# Data Structures Using C


    # 1.6.4 Integers


    We know that integers are aware of the arithmetic operations performed with them
    such as addition, subtraction, multiplication, and division. Integer-type data
    plays an important role in calculation. A counting of the number of objects can
    be shown by integers. The amount in a bank account, the number of students in
    a class and number of keys on a keyboard-all this information can be expressed
    in integers.


    The traditional method of writing negative numbers is to put a sign symbol before
    the number. This method is called as sign and magnitude method and is commonly
    used in several computers to represent signed numbers. Normally, the sign is shown
    at the first or left-most bit of the binary representation. In addition, the magnitude
    part follows by the sign.


    The left-most bit is only for indicating the sign, but it does not have weight
    as an unsigned number. In other words, a bit string beginning with zero shows
    a positive number whereas a bit string beginning with one indicates a negative
    number, if numbers are to be represented in a signed format.


    In Table 1.5, 0 and 1 are used to represent positive and negative numbers. An
    integer shown with its sign is known as a signed integer. There are two types
    of signed integers: a) positive signed integer b) negative integer. We studied
    these signs are represented in memory 0 and 1 as shown in Table 1.5. The sign
    bit is always written as the leftmost bit. While storing signed numbers, the system
    reserves the leftmost bit for representation of the sign.


    Table 1.5 Sign Bit

    | Number | Sign Bit | Magnitude |

    |---|---|--|

    | +7 | 0 | 00..0111 |

    | -6 | 1 | 10..0110 |


    Positive signed integers are shown in the form called the signed magnitude form.
    In this style, the leftmost bit, the sign is shown by 0 and magnitude is shown
    in the matching binary form. For example, +7 is shown as 0111.


    Negative signed numbers are shown in one of the following:


    +   1. Signed – magnitude form

    2. Signed – 1’s complement form

    3. Signed – 2’s complement form


    In the signed magnitude form method, 1 shows the sign of the number and magnitude
    is shown by the corresponding binary form. For example:


    +   -7 is shown as 1111 signed number.

    -7 is shown as 1,000 in one’s complement format.

    -7 is shown as 1001 in two’s complement format.


    Table 1.6 shows the various ways of representing binary and negative numbers.'
