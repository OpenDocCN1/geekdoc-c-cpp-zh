    of $P$ into the list $R$ and forward the pointer in list $P$ to access the next
    term. In this case, the pointer in the list $Q$ will point to the same term (will
    not be).

    2. If exponent of list $Q$ is greater than exponent $P$, the term from $Q$ is
    inserted in the list $R$. The pointer of list $Q$ will be forwarded to point to
    next node. The pointer in the list $P$ will remain at the same node.

    3. If exponents of both nodes are equal, addition of coefficients is taken and
    inserted in the list $R$. In this case, pointers in both lists are forwarded to
    access the next term.


    The steps involved,


    +   1. Traverse the two lists ($P$) and ($Q$) and inspect the elements.

    2. Compare corresponding exponents $P$ and $Q$ of two polynomials. The first terms
    of the two polynomials contain 8 and 9, respectively. Here, exponent of first
    term of list $P$ is smaller than the second exponent. Hence, the first exponent
    of list $Q$ is greater than the first exponent of list $P$. Hence, the term having
    larger exponent will be inserted in the list $R$. The list $R$ initially looks
    like shown in Fig. 6.44 (a).


    ![](img/c2f6b24e88575cdba9137937a75b3615_261_0.png)


    Figure 6.44 (a)


    Next, check the next term of the list $Q$. Compare it with the present term (exponent)
    of list $P$. The next node from $P$ will be taken when current node is inserted
    in the list $R$ because $8>5$. Here, the exponent of current node of list $P$
    is greater than $Q$. Hence, current term (node) of list $P$ will be inserted in
    the list $R$ and the list $R$ becomes as Fig. 6.44 (b).


    ![](img/c2f6b24e88575cdba9137937a75b3615_261_1.png)


    Figure 6.44 (b)


    After moving to next node in list $P$, the exponent is 4, and exponent of $Q$
    is 5. Compare 4 with 5. Of course $4<5$. Here the term of list $Q$ is greater
    than term of $P$. Therefore, the term of list, $Q$ (7,55) will be inserted to
    list $R$. The list $R$ becomes as Fig. 6.44 (c).


