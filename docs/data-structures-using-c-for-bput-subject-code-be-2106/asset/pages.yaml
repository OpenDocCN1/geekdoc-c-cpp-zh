    memory, they are stored in successive memory locations.


    ![](img/c2f6b24e88575cdba9137937a75b3615_162_0.png)


    **Figure 5.10** Circular Queue


    In the circular queue, the first element is stored immediately after last element.
    If last location of the queue is occupied, the new element is inserted at the
    first memory location of queue implementing an array (queue). For example, $C[n]$,
    $C$ is a queue of $n$ elements. After inserting, storing an element in the last
    memory location $[(n-1)th]$, the next element will be stored at the first location,
    if space is available. It is like a chain where storing and ending points are
    joined and a circle is formed. When an element is stored in the last location
    wrapping takes place element inserting routine of the program pointed to the beginning
    of the queue.


    Recall that a pointer (stack and queue pointer) plays an important role to know
    the position of the elements in the stack and queue. Here, as soon as last element
    is filled, the pointer is warped to the beginning of the queue by shifting the
    pointer value to one.


    A circular queue overcomes the limitation of the simple queue by utilizing the
    entire space of the queue. Like a simple queue, it has front and rear ends. The
    rear and front ends help us know the status of the queue after the insertion and
    deletion operations. In the circular queue implementation, the shifting operation
    of queue that we apply in the simple queue is not required. The pointer itself
    takes care to move at vacant location of the queue and element placed at that
    location. To simulate the circular queue a programmer should follow the following
    points:


    +   1. The front end of the queue always points to the first element of the queue.

    2. If the values of front and rear of queue are equal, the queue is empty. The
    values of front and rear pointers are only increased/decreased after insertion/deletion
    operation.

    3. Like simple queue, rear pointer is incremented by one when a new element is
    inserted and front pointer is incremented by one when an element is deleted.'
