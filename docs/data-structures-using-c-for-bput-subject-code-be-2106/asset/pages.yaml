  md: "# Solutions\n\n1. (a) In linear data structures, data are stored in sequential\
    \ order and memory is allocated in contiguous manner, e.g. array, stack, queue.\
    \ In non-linear data structures, data are stored in random manner and memory allocation\
    \ is also carried out in random manner, e.g. trees, graphs.\n\n(b) The efficiency\
    \ of an algorithm can be determined by finding the complexity of that algorithm.\
    \ Complexity refers to time complexity and space complexity. We observe the total\
    \ time required to complete an algorithm in time complexity and find the total\
    \ space required to execute the algorithm in space complexity.\n\n(c) A function\
    \ is called recursive function if it calls itself. The mechanism is called function\
    \ recursion. The stack data structure is used to implement recursion.\n\n(d) A*(BC*)\
    \ – (GH+)/L+P\n\n```\n(A^*) – (GH+)/L+P\n(AC^*) – (GH+/L) +P\n(A***)GH +/(L−)+P\n\
    ABC*GH+L/−P+\n```\n\n(e) The polynomial $2x^2+5y-7$ can be represented in a list\
    \ as follows:\n\n| 0 | -1 | -1 | \rightarrow | 2 | 2 | 0 | \rightarrow | 5 | 0\
    \ | 3 | \rightarrow | -7 | 0 | 0 | N |\n\n(f) Garbage collection refers to the\
    \ de-allocation of unused memory. Deciding when to release the allocated memory\
    \ is very simple. The memory de-allocation is done when the programmer requests\
    \ by executing a specific function. Languages like Java have in-built garbage\
    \ collection system. The function `free()` in C and `delete` in C++ are used to\
    \ release the memory. The garbage collection system checks the entity memory,\
    \ marks the unused nodes and the memory associated with them.\n\n(g) In a binary\
    \ tree, each node has exactly 2 or 0 degrees. However, in a binary tree each node\
    \ 0, 1, or 2 degrees.\n\n(h) Preorder: B, C, E, G, Y, D\nPostorder: E, C, Y, D,\
    \ G, B\n\n![](img/c2f6b24e88575cdba9137937a75b3615_474_0.png)\n\n(i) A binary\
    \ tree is called an extended or 2-tree if each node N has either 0 or 2 degrees.\
    \ At level $n$, the number of nodes = $2^n$.\n\n(j) We use stack data structure\
    \ for DFS and queue data structure for BFS."
