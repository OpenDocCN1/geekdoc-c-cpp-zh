    # 12.4 BINARY SEARCH


    The binary search approach is different from the linear search. Here, search of
    an element is not passed in sequence as in case of linear search. Instead, two
    partitions of lists are made and then the given element is searched. Hence, it
    creates two parts of lists known as binary search. Figure 12.3 illustrates the
    operation of the binary search.


    Binary search is quicker than the linear search. It is an efficient searching
    technique and works with sorted lists. However, it cannot be applied on unordered
    data structure. Before applying binary search, the linear data structure must
    be sorted in either ascending or descending order. The binary search is unsuccessful
    if the elements are unordered. The binary search is based on the approach-divide-and-conquer.
    In binary search, the element is compared with the middle element. If the expected
    element falls before the middle element, the left portion is searched otherwise
    right portion is searched. The binary searching method is illustrated in Fig.
    12.3.


    ![](img/c2f6b24e88575cdba9137937a75b3615_450_0.png)


