  md: '# Data Structures Using C


    Data is represented in the form of text or numbers or in the form of figures,
    tables, graphs, pictures, etc. The data can be stored in physical devices as note
    books and in memory as string, number, characters, etc. A computer language is
    incomplete without data.


    Information is derived from data. The following information can be drawn if data
    is provided:


    +   * Per capita income

    * Average population of the states

    * Average temperature of the city

    * Price index

    * Performance of cricketers


    1.1 illustrates how information can be drawn from data.


    ![](img/c2f6b24e88575cdba9137937a75b3615_16_0.png)


    +   1. Everyday newspapers are delivered to our houses by the service man. It
    may be The Times of India or the Indian Express, and some other local language
    newspapers as Lokmat and Janagruti. The cost of each newspaper is different. How
    many papers have been recorded in a notebook. This task is needed for calculating
    the total bill at the end of the month. The data here are the names of the newspapers,
    the dates on which they have been received and the cost of each. This data is
    needed to calculate the monthly or fortnightly bill. The total bill for the English
    newspapers as well as for the other papers can be calculated and analysed. One
    can draw different kinds of inferences as whether the family is spending money
    on English newspapers or not and if so, how much. Does the family have educated
    members? Is the amount incurred on newspapers more than on food? Data provided
    can be analysed for extracting different types of information.

    2. Information about any can be expressed with his/her name, age, gender, phone
    number, city, etc., and can be stored in the form of a table, which is as shown
    in Table 1.1.


    |Table 1.1 Information About a Particular Human

    | Information Details | Data |

    | --- | --- |

    | | Satish |

    | Gender | Male |

    | Age | 23 |

    | Phone | 23234507 |

    | City | Pune |'
