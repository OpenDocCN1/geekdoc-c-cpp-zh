    # 9.17 AVL TREE


    The AVL tree is a binary search tree. It is also known as height balanced tree.
    It is used to minimize the search time by keeping every node of the tree completely
    balanced in height. The balance factor plays an important role in the insertion
    and deletion of elements in an AVL tree. The balance factor decides whether all
    the nodes of a tree are completely balanced. The AVL tree was defined by two scientists
    Georgii Adams-Velskii and E. M. Landis.


    # 9.17.1 Balance Factor (BF)


    The height of the left sub-tree minus the height of the right sub-tree gives the
    balance factor (BF).

    h_l = Height of left sub-tree

    h_r = Height of right sub-tree

    BF = h_l - h_r

    From Fig. 9.57, the BF of root node G:

    Height of the left sub-tree of G (h) = 1

    Height of the right sub-tree of G (h) = 2

    Therefore, BF of (G) = (h_l) - (h_r)

    = -1


    Similarly, we can obtain the balance factor of all the nodes of a given tree.

    The AVL tree is said to be a balanced tree if its nodes have the balance factor
    1, 0, or -1.


    # 9.17.2 Characteristics of AVL Tree


    The main characteristics of an AVL tree are as follows:


    +   1. If the BF of a node is 0, it means the height of the left sub-tree and
    height of the right sub-tree is equal.

    2. If the BF of a node is 1, it means the height of the left sub-tree is greater
    than the height of the right sub-tree.

    3. If the BF of a node is -1, it means the height of the left sub-tree is less
    than the height of the right sub-tree.


    A tree is said to be a complete AVL tree if all the nodes of the tree satisfy
    all the three conditions discussed above. Some AVL and non-AVL trees with their
    balance factors are shown in Fig. 9.58.


    ![](img/c2f6b24e88575cdba9137937a75b3615_367_0.png)


