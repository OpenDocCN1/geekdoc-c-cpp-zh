    # Explanation:


    In this program, required variables and function prototypes are declared before
    main(). The user can perform different operations and the element entered is stored
    in the queue. Using while will ask the user to enter a choice. The option entered
    by user is passed to switch() case statement where appropriate case statement
    is executed. Actually, the case statement invokes function and operation gets
    started.


    The create function is used to insert into the queue. In this function user has
    to enter number of elements to be inserted and followed by this user to enter
    numbers. The if block is executed if the value of f (front) is zero. Using while
    loop repeatedly elements are entered and stored in the queue. The variable r is
    incremented in every loop. The insert () function is used to insert an element
    at the given position in the queue. The variable j has value 10 and its maximum
    number which the queue can hold. If the value of r (rear) is greater than j its
    simple meaning is that queue is full and the return statement suspends the function
