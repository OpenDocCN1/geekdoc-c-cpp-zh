    Figure 4.4 A Railway Track


    # 4.2 STACK-RELATED TERMS


    **Stack:** Stack is a memory portion, which is used for storing the elements.
    The elements are stored based on the principle of last-in-first-out. In the stack
    the elements are kept one above the other and its size is based on the memory.


    **Top:** The top of the pointer points to the top element in the stack. The top
    of the stack indicates its door where elements are entered or deleted. The stack
    is used to verify stack''s current position, i.e. underflow, overflow, etc. The
    top has value 0 when the stack is empty. Some programmers use -1 to the top as
    initial value. This is because when the element is added, the top is incremented
    and it would become zero. The stack is generally implemented with the help of
    an array. In an array, counting elements begins from 0. Hence, on the similar
    grounds stack top also begins from 0 and it is convenient to assign -1 to top
    as initial value.


    **Stack Underflow:** When there is no element in the stack or stack elements less
    than its capacity, the status of stack is known as *stack underflow*. In this
    situation, the top is present at the bottom of the stack. When an element is pushed,
    it will be the first element of the stack and will be one step up.


    **Stack Overflow:** When the stack contains equal number of elements as per its
    capacity and no more elements can be added, the status of stack is known as *stack
    overflow*. In such a position, the top rests at the highest position.


    **Storage:** A function containing local variables and constants is stored in
    stack. Only global variables are stored in a stack frame.


    **Stack Frames:** This data structure holds all formal arguments; return address
    and local variables on the stack at the time when function is invoked.'
