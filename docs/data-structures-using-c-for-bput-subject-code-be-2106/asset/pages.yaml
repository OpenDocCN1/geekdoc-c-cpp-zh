  md: '# THE TOWERS OF HANOI


    The Tower of Hanoi has historical roots in the ceremony of the ancient tower of
    Brahma. There are n disks of decreasing sizes mounted on one needle as shown in
    the Fig. 3.8(a). Two more needles are also required to stack the entire disk in
    the decreasing order. The use of third needle is for imperfect storage. While
    bounding the disk, following rules should be followed.


    +   1. At a time only one disk may be moved.

    2. The disk may be moved from any needle to another needle.

    3. No larger disk may be placed on the smaller one.


    Our aim is to move the disks from A to C using the needle B as an intermediate
    by obeying the above three conditions. Only top-most disks can be moved to another
    needle. The following figures and explanation clear the process of Tower of Hanoi
    stepwise.


    In Fig. 3.8 (a), the three needles are displayed in the initial state. The needle
    X contains three disks and there are no disks on Y and Z.

    In Fig. 3.8 (b), the top-most disk is moved from X to Z. The arrow indicates the
    movement of disk from one needle to another needle.

    In Fig. 3.8 (c), the disk from the X moves to the Y needle.

    In Fig. 3.8 (d), the disk from Z needle moves to the Y needle. Needle Y has two
    disks.

    In Fig. 3.8 (e), the disk from the X needle moves to the Z needle. Now there is
    no disk in the X needle.

    In Fig. 3.8 (f), the disk from the Y moves to the X needle.

    In Fig. 3.8 (g), the disk from the Y needle moves to the Z needle. The Y needle
    contains no disk.

    In Fig. 3.8 (h), the disk from the X needle moves to the Z needle. The Z needle
    contains all the three disks of the X needle shown in Fig. 3.8 (a). Thus, the
    problem is solved.


    ![](img/c2f6b24e88575cdba9137937a75b3615_107_0.png)'
