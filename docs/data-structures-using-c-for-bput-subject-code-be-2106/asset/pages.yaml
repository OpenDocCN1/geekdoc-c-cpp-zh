    searching is to be carried. Searching a name of a person from the given list,
    searching a specific card from the set of cards, etc., are few examples of searching.

    A typical example where searching technique is personal telephone diary. This
    diary is used to store phone/mobile numbers of friends, relatives, etc. For searching
    the phone number of a person one can directly search the number by using indexing
    in day. Quick search methods are to be adopted to search the data from the heap
    or large records. Two processes such searching and sorting are essential for database
    applications.

    In short, searching is a process in which given record is searched from the set
