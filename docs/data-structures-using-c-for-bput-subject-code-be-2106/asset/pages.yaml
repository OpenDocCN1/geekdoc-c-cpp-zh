  md: 'The power of two (weights) and binary bits are multiplied and the sum of all
    multiplications is taken to give the equivalent decimal number. There are two
    commonly used methods for representing negative binary numbers; they are described
    in the following sections.


    # 1.6.1 One''s Complement


    In this method, a positive integer is converted to negative by changing each bit
    to its opposite value. For example, the binary number 0101 represents 5 and its
    complement is 1010.


    # 1.6.2 Two''s Complement


    In this method, 1 is added to the representation of one''s complement. For example,
    7 is represented as 0111 with an unsigned number. With two''s complement, the
    number 7 becomes 1001 (One''s complement of 0111 = 1000 and 1 is added at its
    least significant position giving a result of 1001).


    # 1.6.3 Binary Coded Decimals


    In addition to the binary number system, the programmer can also use decimal numbers.
    For example, a string of bits can be used to represent integers in the decimal
    number system. The decimal number from 0 to 9 can be represented using only a
    four-bit combination. Table 1.4 shows the decimal number and their equivalent
    binary digits.


    A string of bits can be broken randomly into separate groups of four bits. Each
    group represents a digit. For example, the bit string 01100010 can be separated
    into two strings 0110 and 0010. The first string indicates six and the second
    two. The complete string represents 62. This method of representation is called
    as binary coded decimal.


    Table 1.4 Four Bits and Equivalent Decimal Number

    | Decimal Number | Binary-coded Decimal Code (8421) |

    |---||

    | 0 | 0000 |

    | 1 | 0001 |

    | 2 | 0010 |

    | 3 | 0011 |

    | 4 | 0100 |

    | 5 | 0101 |

    | 6 | 0110 |

    | 7 | 0111 |

    | 8 | 1000 |

    | 9 | 1001 |'
