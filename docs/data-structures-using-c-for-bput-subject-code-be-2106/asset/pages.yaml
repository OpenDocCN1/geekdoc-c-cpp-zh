    # 6.23.2 Linked Dictionary


    In compiler, creation of the linked dictionary has an important role. In compiler,
    the organization and maintenance of dictionary holding names and their corresponding
    values are maintained in the linked dictionary. This linked dictionary is called
    symbol table. When designing compiler, two factors, i.e. time and memory space
    are considered.


    The process of compiler designing has various steps. The construction and referencing
    is an important factor of linked dictionary. Construction means insertion of symbols
    with their values available. Referencing means, obtaining values from the.


    The ratio of estimated number of insertion to reference is significant factor.
    In symbol tables, access retrieve time and insertion time are very much associated.
    The quick symbol table can be constructed if large memory space is available.
    When a reference is obtained from arithmetic value of character (forming name),
    name is stored in a unique memory location.


    The easiest way to access the symbol table is linked search method. Using insertion
    can be easily done by adding symbols at the rear of the list. If any symbol is
    to be searched, by traversing each node the required element can be.


    The symbol table can also be searched using binary search. All the entries in
    the symbol table are sorted in ascending order. A middle entry is spotted and
    its value is determined. A special topic is given for this book. However, this
    method has some drawbacks.


    # 6.23.3 Addition of Long Positive Integers


    The application of adding long positive integers can be solved using circular
    list. There is always a restriction or limitation in the programming language
    that every data type has a lower and upper limit. The variables of a particular
    data type can have the values as the range. Some time, it is very essential if
    any problem to be solved is having maximum range, which exceeds the limit of the
    range. In order to add two long integers, below mentioned steps are followed:


    +   1. The digits of the given numbers are individually traversed from left to
    right.

    2. In parallel, i.e. corresponding digits and a carry from prior digits are added.


