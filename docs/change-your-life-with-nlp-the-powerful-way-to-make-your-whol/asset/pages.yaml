  md: '# How to give and receive feedback


    In NLP, a popular approach for giving feedback is the ‘feedback sandwich’. It
    isn''t the only approach but it''s one that I personally find very useful. All
    change happens at an unconscious level and the unconscious mind needs to hear
    feedback quickly after the event. Feedback that is stored up during the year for
    the day of the performance appraisal meeting is a waste of time. One of the most
    common complaints about feedback is that it takes place too long after the event
    being reviewed. Fast feedback is built into the daily routine, ideally at the
    moment that the event happens, or at the end of a meeting, or at the end of the
    day.


    ![](img/28d67ab57ddbf33d989344b5416e1e3f_192_0.png)


    The feedback sandwich process is made up of three stages, while maintaining eye
    contact at all times. First, check that you are in rapport with the person and
    then tell them what they did well – gets the unconscious mind open and interested
    in listening. Next, you give the person specific suggestions as to what they can
    do better next time – this is often called the ‘meat’ in the sandwich. Finally,
    you end with an overall positive statement. You can also confirm the learning
    by asking the person receiving the feedback what they will do differently next
    time. The important thing is to say the feedback the way it is. Be as direct as
    possible – do not leave the opportunity for misinterpretation, and give as many
    specific examples as you can. Vague feedback is meaningless.


    The unconscious mind hears the initial positive statement which makes it much
    more receptive to hearing the areas for'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'improvement. Again, it’s important to focus on what the person should do differently
    and not on what they shouldn''t do. As we learnt earlier, the unconscious mind
    cannot process a negative. Remember ‘Don’t think of a blue tree? To not think
    of a blue tree you have to first think of a blue tree. If we focus on what we
    shouldn''t do, we attract that exact thing to us.


    # Steve – experiencing the importance of the feedback sandwich


    Steve is known as ‘Meat Man’, meaning that he gives very direct feedback in the
    middle of the sandwich. He tells a story of when his boss used the feedback sandwich
    with the team. Steve had spent years in the army and did not consider that he
    needed to hear the good stuff – he just wanted the meat. He told his boss he could
    be straight with him. His boss asked him three times if that was what he truly
    wanted and said ‘yes’. The boss then began to give him just the meat. Several
    weeks went by and he realised that he was avoiding his boss. In fact, if he heard
    him coming along the corridor, he would slip into another office to hide away.
    He couldn’t understand this behaviour until one day the penny dropped. Receiving
    the feedback was nothing about being ‘tough’ and it was all about balance. If
    you give compliments, you will receive compliments and that helps to build confidence.
    He asked his boss to return to the feedback sandwich and he soon began to notice
    that he was much happier to bump into him in the corridor again.


    Receiving feedback is a fundamental precursor for being able to and having the
    right to give it. Your ability to receive feedback is central to continuous learning
    and growth as well being key to healthy relationships both in business and in
    life. Receiving feedback is also a skill to be learnt and practised. To receive
    feedback you need to hold the beliefs discussed above in your mind. If you see
    everything as feedback then the potential of failure does not exist. That makes
    it easier to listen to and'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'consider the feedback you are given. Before you receive feedback get yourself
    into a resourceful state. Remember how we learnt to anchor a positive state from
    the past (see Chapter 8). The best states may be openness, humility, self-confidence
    or curiosity. Always anticipate feedback and always invite it when appropriate
    so that feedback is in constant supply to you.


    The specific skills for receiving feedback are as follows:


    +   - Listen carefully and keep an open mind. You cannot make judgements on the
    validity if you have a closed mind.

    - Suspend judgement. Do not put up your defences; rather take your time and make
    some mental notes to check out later.

    - Let the giver finish. Wait until they have got to the end and you have a full
    picture.

    - Paraphrase to check out you have heard and to clarify your perception.

    - Ask for specific examples if they are not given.

    - Avoid arguing, denying, justifying and minimising. It’s their point of view.
    Decide what you want to do with the information. Look for patterns with other
    feedback you received before.

    - Respond in a way that presupposes acceptance, saying things like ‘In what ways
    do I do this?’ and ‘What effect does this have on you?’.

    - Gather information from other sources.

    - Decide what you want to do. Think about how you can use the information to improve
    the results. Imagine yourself having taken on board the feedback and now behaving
    in a way that demonstrates you have done so.

    - Thank the person for giving you feedback.


    The ultimate measure of the success of either giving or receiving feedback is
    that you or the other person integrates the learning from it.'
