  md: '# Results or excuses? Taking responsibility for what you really want


    What is it that makes the difference between two successful people? What makes
    one world class and the other good? This is the question that perplexed Richard
    Bandler and John Grinder, the creators of the body of knowledge we know as NLP.
    They made it their life’s work to discover the answers. One of the ways they went
    about doing this was to find worldclass models of excellence and to find out how
    they did what they did. One of the key findings was concerned with what can be
    described as the ‘mindset for success’. How do successful people create their
    model of the world, and how is it different from other people’s? Successful people
    do not have fewer problems than unsuccessful people, but they deal with problems
    in a different way. It’s not ‘luck’ that separates successful people from those
    who never make it; it’s about how they perceive a situation and how they respond
    to what happens. This is that is one of the most important chapters in this book
    because it will show you how to apply this knowledge to your own life.


    Consider for a moment. How do you live your life? Do you experience your life
    as hard and difficult or do you generally look on the positive side of life? I’m
    sure you are familiar with the ‘glass half empty/glass half full’ way of seeing
    the world. What about you? What is your starting point, point of view? Some people
    will only see problems in a situation others always see the opportunity. Are you
    someone who blames others or circumstances for whatever happens or are you someone
    who takes responsibility for whatever'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'happens to your life? Does this sound familiar to you? For example, do you
    recognise yourself as someone who says ''Yes, I''d like to but...'' or are you
    the person who says, ''Yes, let''s go for it!'' Are you buffeted by events, feeling
    out of control, disempowered, a victim? Or are you involved, interested and active
    in what you do? In NLP terms, this is called either living life at effect or at
    cause.


    # Living your life at effect


    If you are at effect, you will blame others or circumstances for your bad moods
    or for what you have not achieved, or for your life in general. You will feel
    disempowered and will depend on others in order to feel good about yourself or
    about life. ''If only my partner, my boss, my colleagues, my parents, my children...
    understood and helped me achieve my dreams or did what I wanted or what is best
    for me, then life would be great, etc.'' If you wait and hope for things to be
    different or for others to provide for your well-being, you are at effect or a
    victim of circumstances. And really, how much fun is that? And how much fun do
    you think it is for others to be around someone like you who is always moaning
    about their problems?


    Believing that someone else is responsible, or making someone responsible for
    your happiness or your different moods is very limiting and gives that other person
    some mystical power over you, which can cause you a great deal of pain. No one
    can ''make'' us do or feel anything. We react to someone else''s behaviour and
    we have a choice about how we react. For example, if I hear one of my clients
    saying something like, ''He makes me sad'', I will ask them, ''How is his behaviour
    causing you to choose to be sad?'' This puts the person back at cause where they
    have choices about how they react and behave. People at effect give away their
    power because they look outside themselves for the solution. Those who live their
    lives at effect often see themselves or live their lives as victims because they
    believe they have no choices. The irony is that they have choice and have chosen
    not to choose but to be responsive'
