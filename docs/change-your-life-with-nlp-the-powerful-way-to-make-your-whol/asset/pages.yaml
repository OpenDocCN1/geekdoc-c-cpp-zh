    # The energy button


    For the purpose of giving you an experience of programming your body and mind
    for success, I''m going to take you through a simple exercise to boost your energy
    and self-confidence. This works in an instant. The more you practise this exercise
    the more easily you will access that positive state, and you may notice that after
    a while you only need to think of a time when you were successful and you''ll
    be there because the brain learns very fast. The simple reason this is: the brain
    consists of millions of neural pathways. Whenever we do something new, we create
    a new pathway so we can re-access that experience more easily. Each time we repeat
    a particular behaviour we strengthen the associated neural pathway. I call this
    the ''energy button exercise''. I call it this because that''s the name my children
    adopted for it as they were were growing up. As soon as I learnt about anchoring
    I taught my children what to do and we set up an ''energy button'' for each of
    them that they could use before exams or at any time they needed to feel more
    energised, positive and confident.


    Exercise 22

    Creating your energy button

    Think of specific occasions in the past when you experienced really powerful,
    positive states. For example, a time when you felt energised, confident, happy,
    motivated, powerful or successful, fell down laughing or felt totally loved. Remember
    specific memories, not just general feelings. Work with one memory at a time and
    repeat this exercise for each memory. The more specific experiences you ''stack''
    on your energy button the better. And, once you have the button, you can add new
    experiences as they occur in your life. For example, next time you feel really
    great, add it to your button.'
