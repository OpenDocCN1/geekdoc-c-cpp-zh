  img_proc: true
- pgno: 189
  md: '# CHANGE YOUR LIFE WITH NLP


    if she had ever given her friend feedback about anything that really mattered
    in the whole of their twenty-year friendship. She never had. I asked her what
    she would say to her if she were to give her the feedback. She said that she would
    suggest that she wore more brightly coloured clothes, as she always wore dark
    clothes that didn''t suit her. I then asked what prevented her from giving her
    friend that feedback for over 20 years. She said that she didn''t want to hurt
    her feelings. I reframed the scenario for her by asking whether she thought it
    was better for friend to always stay the same or to have the opportunity to do
    something different and potentially feel better about herself. She looked at me
    and said that she''d never thought of it like that – that she could have held
    her friend back. She went back to the group, took a deep breath and gave her friend
    the feedback. It wasn''t as scary as either of them had anticipated and it allowed
    them to be truly honest with each other for the first time in 20 years.


    Feedback in the moment helps us to get to the next level faster because it helps
    us to adjust our actions in real time than at some arbitrary measurement point
    or, even worse, find out. All good businesses actively seek feedback in order
    to find out what they are doing right for their customers, and what needs to change.


    Feedback is also a key coaching tool in terms of personal development. It is the
    main contribution that I can make with the individuals and companies with whom
    I work. If they were better and more willing to give each other feedback, then
    my role would soon become redundant.


    # What is feedback?


    Feedback is about evaluation; it is not only about what needs to be improved but
    also what was good about the performance. That second part can often be missed
    in our society which seems too focused on feedback in terms of criticism – no
    wonder it is feared by most. Feedback only works if it leads to a change. If the
    recipient listens to the feedback and integrates it'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'then it has achieved its purpose. In our society the fear of being honest often
    leads to the ''halo'' effect. The halo effect is when we give over-complimentary
    feedback because we do not want to hurt the feelings of the recipient or we do
    not want to rock the boat. I often term this as ''bullshit feedback''! Often whole
    organisations collude with this system because it keeps everything running smoothly.
    I''ve known old friends giving each other top marks on annual appraisal forms
    which had nothing to do with their performance.


    Why do we behave in this way? Management expert, Jerry B. Harvey, argues that
    we are tempted to say nothing or dress up negative feedback because of the following:


    +   * Action anxiety – giving honest feedback creates intense anxiety in the giver
    as they think about acting in accordance with what they know to be right. As a
    result, they act in a manner incongruent with their beliefs.


    +   * Negative fantasies – the giver builds up in their minds the negative consequences
    of speaking the truth until they are completely paralysed by the thought of it.


    +   * Fear of separation – probably the biggest reason for ''bullshit feedback''
    as the giver fears separation from the norm or group if they take the risk of
    speaking out. If we think back to our two friends, one was terrified of her feedback
    changing the relationship she had and losing the friendship she valued.


    This gives us the reasons why ''bullshit feedback'' is so prevalent in our society.
    NLP assists us to change our view about feedback – both the delivery of it and
    the receipt. We know that the pre-supposition of NLP is that:


    > There is no failure only feedback.


    In other words, there is only learning. If you truly believe this, you will seek
    the learning that comes from all experiences in order to develop yourself. Feedback
    then becomes something to be welcomed and not something to be feared. Feedback
    is then fundamental to your development.'
