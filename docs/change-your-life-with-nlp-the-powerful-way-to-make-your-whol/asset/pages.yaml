    believing it to be impossible and terrified of burning her feet. after watching
    others walk safely she was still hesitant. I asked her to consider how the fire
    would change her beliefs about every area of her life. How powerful would you
    feel walking across fire? There was not a dry eye in the group as Carol walked
    successfully and painlessly across the fire. It had represented the barrier to
    her moving on and now that was gone. I watched her go from strength to strength
    after that night and she now has a new relationship and a fulfilling new life.


    Just imagine if you were to do something that thought was impossible. What impact
    would that have on all other areas of your life?


    # How do we change beliefs?


