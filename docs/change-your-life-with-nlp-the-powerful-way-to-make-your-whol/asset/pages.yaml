- pgno: 15
  md: '# The ultimate test


    it''s August and I''m on the firewalk instructors'' Trainers'' Training in Scotland
    with my trainer Peggy Dylan. It''s already day three of the week-long training
    and I''ve slowly begun to get over my fears of walking on fire. The first night
    was a stretch. We made the fire as a group – that part was fun. Then we lit the
    fire and watched as the flames grew higher and higher, hotter and hotter. After
    a couple of hours, the wood had to coals and it was time to walk. I had never
    been so terrified of anything in my life. I had experienced some other powerful
    metaphors for change – like the board break where you break a piece of pine with
    the energy and speed of your body. That had been amazing enough, yet this was
    on a different scale. The smoke from the heat of the fire made my eyes smart as
    I took my turn rake the wood into the coal bed that we would walk upon. I held
    back as my colleagues walked before me. When it was my turn the support and energy
    of the group literally ‘willed’ me over the hot coals. I was safe.


    Tonight is different from the normal firewalk preparations. Peggy asks us to sit
    in a large circle and she arrives with a box which she proceeds to hand around
    the group. It feels rather like the game of ‘pass the parcel’ as we all pick a
    number and move the box to the next person. I look at my number – 11 – about in
    the middle of the group. I''m very curious about what the numbers are all about.
    At 9 p.m., just when it''s getting dark, Peggy calls the person with the number
    ''1'' to follow her. They disappear for about 10 minutes whilst the rest of us
    sit around chatting nervously. We wonder if it is some of test of our resolve.
    When number 1 returns, number 2 is immediately led out of the room. Number'
  merge: -1
  img_proc: true
- pgno: 16
  md: '1 is calm and in an almost meditative state. Of course, we start to ask them
    questions about what had happened. They are frustratingly sworn to secrecy. This
    makes me even more nervous about what is to come. I wait as numbers 1–10 leave
    the room and all of them return 10 minutes later. They all seem very calm after
    their secret experience. Suddenly, number 10 is back and it is my turn. I follow
    Peggy out of the room tentatively. She explains that tonight a fire has been lit
    in the woods for each of us to have the experience of walking alone. She says
    that the decision to walk or not to walk is entirely our own, that we will learn
    something important whatever choice we make.


    As I walk down to the fire alone, I am aware of an eerie silence – nothing like
    the high energy of the other evenings. I can hear the crickets and birds and the
    crackling of the fire as I walk through shrubbery into the woods. It is a full
    moon and through the trees the flaming orange glow of the embers guide me down
    to the fire.


    I stand at the foot of the fire and admire it for a while. It is a delight to
    all the senses. I can see the bright orange coals, hear the crackling of the fire,
    smell the oakiness of the burning wood, taste the smoke in the air and feel the
    anticipation of the oppor- tu-nity to walk alone. It seems to me in that instant
    as I stand before the fire that everything I have achieved so far is nothing compared
    to this moment. To walk alone without the company and supportive energy of the
    group means everything. This moment symbolises whether or not I will do whatever
    it takes to achieve my dreams. Time is running away and I know that I only have
    a few more seconds to decide what I am going to do. I can literally hear my heart
    beating faster and faster in my chest. This is my moment of truth. Do I want it
    or what?'
  merge: -1
