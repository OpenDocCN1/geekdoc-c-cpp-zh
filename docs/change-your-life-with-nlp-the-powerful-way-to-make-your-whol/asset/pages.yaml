- pgno: 217
  md: '# Principles of success


    We are almost at the end and there are just a few things more for me to say. First
    of all I''d like to summarise the key principles that we have discussed in this
    book and recommend that you memorise them and use them as your blueprint for success.
    When you follow this path you will succeed, and remember to keep going until you
    get your goals.


    # Principle 1 – get clear on your goal


    Revisit the biggest goal you set at the start of this book. Double check that
    it really motivates you. Now check that your goal is specific, measurable, achievable,
    realistic and timed. Focus on your goal. Remember that whatever you put your attention
    on in your life will grow stronger.


    # Principle 2 – know why it is a must


    What are your reasons for wanting to achieve this goal? Ask yourself, ‘If I don''t
    do now what will it ultimately cost me?’ Make sure that your goal is for you and
    that you''re not achieving it for anyone else.


    # Principle 3 – take massive action


    Are you prepared to do whatever it takes to achieve your goal, including things
    you do not want to do? Revisit your personal action plan. Take one small step
    and one large step today to begin to move towards your goal. Challenge yourself
    by asking if you are taking personal and 100 per responsibility for your goal.
    Are you at cause for your goal? Because, to the extent that you are not, are you
    giving your personal power away.


    # Principle 4 – know what you are getting


    Be very aware of what works and what doesn''t. Ask for feedback, and constantly
    evaluate your approach. Think of feedback as a gift and remember to learn from
    any action that doesn''t go quite to plan.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# DO YOU WANT IT OR WHAT?


    # Principle 5 – be prepared to change your approach


    We''ve already come across saying that ''if you always do what you''ll always
    get what you''ve always got''! You must be prepared to be flexible, to move into
    the unknown. Security is an attachment to the known and the known is our past.
    No evolution in that. When you experience uncertainty you are on the right track
    – if you become too fixated on how to achieve your goal, you shut out a whole
    range of possibilities.


    # Principle 6 – ask for help from those who are already successful


    When making major life changes, the most successful people in life model those
    who have have already ''done it''. They do this by going on courses, being coached
    or simply asking for advice. You will probably find that with the appropriate
    support you will find the process of change more enjoyable, and your chances of
    success will be greatly increased.


    There''s not much more I can give to you. However, I''ve developed a light-hearted
    questionnaire that is designed to find out how far you have changed during the
    reading of this book and how determined you are to go for what you want. I suggest
    that you use the results as personal feedback about where you are right now as
    you begin your change journey and where you need to be. Have fun, enjoy and learn
    from the results.


