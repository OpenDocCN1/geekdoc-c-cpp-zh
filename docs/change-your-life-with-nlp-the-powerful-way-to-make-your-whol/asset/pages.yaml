  md: '# The power of our emotions


    In Chapter 4 we learnt that our results are dependent upon the mood or state we
    are in at that moment and that our state is driven by how we feel. Our thoughts
    or internal representations determine how we feel. For example, our result in
    an interview situation will be determined by how confident we feel in that moment
    to answer to the best of our ability all the questions we are given. How we feel
    will be determined by the thoughts we are experiencing. Are we thinking how well
    we are going to do, or are we terrified of not getting the job?


    In NLP we believe it''s possible to model ourselves – that we can bring into the
    ‘now’ positive states we have experienced from the past. For example, any occasion
    in the past when we have felt confident we can re-experience in the ‘now’. This
    is an invaluable resource that is available any time you are feeling less than
    resourceful and you need to change your feelings and your state quickly.


    We achieve this with a technique called ‘anchoring’. This is a technique to enable
    you to tap into your inner personal resources when you need them. In particular,
    anchoring is a way of managing your emotional state. Our ability to choose the
    best emotional state for a particular situation is one of the most powerful and
    yet most overlooked and undersused skills that we have. We may not be able to
    control external events and yet we can learn to control the way that we respond
    to them.


