  img_proc: true
- pgno: 215
  md: '# Exercise 31


    Keeping a diary of your proud moments


    Keep a diary for a week of all your achievements during each day. Set yourself
    the challenge to ensure the list gets longer every day. As human beings, we naturally
    focus on the things that don’t go plan. If you notice yourself doing that then,
    each day in your diary, set out two columns — one for the things you were proud
    of and the other for the things that you do better next time. The only rule is
    that the list of things you are proud of must be longer.


    As you record the things that you are proud of, notice how you begin to build
    new reference points for your belief system. Remember the analogy of building
    the house. Create new reference points and the old blocks fall away leaving the
    building unstable. Perhaps you’ll spot how much more successful than you thought
    or how good you really are at so many things. I know you’ll notice things for
    the very first time that previously you were closed to.


    # Enlist support when you need it


    On your journey towards your goals there will be times when the road seems rough
    and long. You may need some additional help at moment to keep your momentum going.
    It saves you valuable time in the longer term.


    If you need someone who is an ‘expert’ in the relevant field to work with you
    this person is called a mentor. A mentor can provide you with technical support
    to keep you on track. A mentor will assist you in gathering the tools you need
    to move closer to your goals. In organisations, high-potential staff are often
    provided with a mentor to guide them. I have worked with a mentor in the writing
    of this book. She is an expert in the field as she specialises in helping authors
    to write and publish books. She also has written books herself. At the start of'
