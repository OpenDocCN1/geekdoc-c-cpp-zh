  md: '# Influencing with integrity


    To really succeed in this world it is important to be able to work with and through
    others. It''s unlikely that you''ll achieve your goals entirely by yourself. This
    chapter is all about how influence others with integrity core elements of NLP,
    such as the presuppitions of NLP, sensory acuity, rapport, communication styles
    and eye patterns.


    The question I get asked more than any other about NLP is whether it is manipulative
    or not. I often challenge those who pose the question by asking if any sales people
    who have been taught ''manipulative'' techniques. Of course they have. Many tools
    and techniques have the potential to be used for manipulation – there are many
    sales people out there with huge sales targets who are taught to sell at all costs,
    whether the customer needs the goods or not. I would agree that the potential
    is there in NLP. What makes the difference is how you use the tools you have been
    taught. That''s why this chapter is entitled ''Influencing with integrity''. The
    difference between manipulation and influence is actually simple. It''s all about
    your intention. If you are focused on a ''win-win'' situation, how can it be manipulation?
    You achieve your result and so does the other party. Is it manipulation if I use
    my NLP toolkit to assist my client to achieve the outcome they want for themselves?
    With their permission, I''ll do whatever it takes to assist them. I see that as
    my job. Equally, if my goal is to build a successful NLP training company and
    I sell to people who have told me they need my services – is that manipulation?
    If I don''t make the sale in that situation then somebody else will! Genie Z.
    Laborde says:'
