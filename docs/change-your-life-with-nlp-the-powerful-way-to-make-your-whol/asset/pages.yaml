- pgno: 12
  md: '# Introduction – could your life be better?


    It doesn’t matter how you have lived your life until this moment. All that matters
    is what your dreams are, what you ache for in. The only moment is now. Living
    in the past can slow you down as much as worrying about the future. Change can
    happen in an instant, in the blink of an eye or the click of a finger, once you
    have made a decision to go for it. Think about it – you start to create your future
    as soon as you make a decision.


    I''m curious to know, could your life be better? Ask yourself the following questions
    to find out:


    +   * Am I getting what I want out of life? Yes / No

    * Do I have stretching goals for the future? Yes / No

    * Am I reaching my full potential? Yes / No

    * Am I fulfilled by my work? Yes / No

    * Is my relationship the way I dreamed about? Yes / No

    * Do I have enough money to do what I want to do with my life? Yes / No

    * Is my life in balance? Yes / No

    * Am I happy with my body shape? Yes / No

    * Do I have enough energy to enjoy my day? Yes / No


    If you answered ‘yes’ to all the questions, you’re probably reading the wrong
    book. Go off and enjoy your life! If, however, you answered ‘no’ to one or more
    of the questions, there is definitely potential for your life to be different
    – and so much better. You probably feel right now that your life is OK and yet'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# INTRODUCTION


    you have a yearning for something else. Do you recognise this? Perhaps there is
    a dream you have always wanted to pursue or an area of your life that is not right
    yet. This is how I felt. I wanted to set up my own business...


    I worked for many years as a coach and trainer for one of the world''s largest
    consulting firms. I was helping business leaders across the world to make positive
    changes in their lives and their companies. Yet, I was still afraid to live my
    dream.


    After a while I began to see strong patterns in how people changed. And I personally
    discovered that even making big changes can be less scary than you think. The
    keys are:


    +   - Find out what makes you truly happy – you will feel compelled to take action.

    - Focus on what you want – you will be amazed at how quickly you attract these
    things to you.

    - Adopt the right attitude so you see the benefits of all situations. Our lives
    are governed by how we react to events, not by what happens to us.

    - See your life as an adventure and you will start to enjoy the journey.

    - Keep going and keep learning along the way.


    I decided to go for it myself. I put in place small steps to follow my dream and
    I was astonished at how good it felt. I started by doing freelance work part-time.
    Then I set up my company and left my job. At that moment I cannot explain how
    wonderful I felt because I had the courage to make a decision and go for it. I
    knew life would never be the same again.


    It is that I want you to experience.


    It doesn''t have to be setting up your own business. Maybe for the dream will
    be about doing something you''ve always wanted to do, finding purpose and meaning
    in your life, improving or changing your relationship, moving to a new area or
    country, getting on top of your money issues, losing weight, finding another job
    – or all of these things!'
  merge: -1
  img_proc: true
- pgno: 14
