  md: '# CHANGE YOUR LIFE WITH NLP


    Finding the energy to do all you need to do is the first step. You will then find
    that you can live life in a more balanced and vital way. You will be able to achieve
    more than other people that you know, and others will notice how much more vitality
    you have and how younger you look and feel. Don''t be surprised if your friends
    want to know what your secret is. That is the first step.


    Remember that your energy flows where your attention goes, and one of the impacts
    of utilising your energy to the full is that you will want to maximise every moment
    of every day. You will want the time to be able to maximise every experience.
    I''m going to introduce you to a different understanding of time that means you
    can create the time you take it. I call this time distortion.


    Anybody who has ever had a long-distance relationship will know all about time
    distortion. When you are together, the time literally seems to fly past. The time
    apart until the next meeting feels like an eternity. If the long-distance relationship
    ends, time ''settles down'' and every day feels the same length again.


    Deepak Chopra writes that Einstein''s brilliant contribution to modern physics
    was the idea that linear time is superficial. It is not a straight-line process.
    Time seems to flow and move, seconds, minutes, hours, days, months and years pass
    by. Yet, this is all relative - it has absolute value. Einstein replaced the idea
    of time with something more fluid. With fluid time, it can speed up or slow down
    depending upon the context. He noted that spending a minute on a hot stove seems
    like an hour, whereas spending an hour with someone you loves like a minute. The
    conclusion is that time depends upon the situation of the observer. As the observer,
    we have personal control over our experience of time. We hear ourselves saying
    things like:


    > I don''t have time for that.


    > Time stands still.


    > Time flies by.


    > Time is running out.


    These statements say nothing about linear time measured by the clock. They do
    say a great deal about how we experience'
