- pgno: 38
  md: '# How do you move out of the Grey Zone?


    Why do people stay in the Grey Zone? In the examples I''ve discussed, the same
    reason kept everyone in the Grey Zone – **fear**. We are scared of moving into
    the unknown, doing something different. Fear comes from limiting beliefs that
    we have about ourselves and our abilities. In fact, the consequences of making
    a change are often built up in our minds to mean-something far worse than the
    actual reality of the situation. Here''s a great acronym for fear:


    False Evidence Appearing Real


    Our minds are brilliant at creating the worst case scenario in our heads, and
    then that''s what we begin to focus on as our reality. Soon we forget that it''s
    not true. We make huge assumptions about what or may not be true based on our
    belief systems. And guess what? Our beliefs generalised to us by those who influenced
    us in our early years. They are not real. The reality is very different if we
    are prepared to find out and start the journey.


    It takes one of things to move out of the Grey Zone. Either you have a goal that
    is so compelling you will take the risk of going for it. Or, in contrast, the
    pain becomes so great that you are finally tipped off the edge of change.


    Which one influences us often depends upon the way we are motivated. In NLP we
    talk about people being ''towards'' or ''away from'' motivated. Think about it.
    Do you move away from what you don''t want or move towards what you want? Are
    you a ''stick'' or a ''carrot'' person? For example, if you want to lose weight,
    do you move towards a goal of being fit and healthy and have a motivational image
    in your mind of you in that skimpy new outfit, or do you move away from being
    fat and focus on an image of you overweight and bulging out of that special outfit?'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Sticking to your resolutions


    One of the limitations of ''away from'' motivation is that it often dwindles once
    short-term improvements are gained. For example, a lot of people''s new year''s
    resolutions (although they might not realise it) are about getting out of the
    Grey Zone or even the Awful Zone. They start off well, take action and before
    too long they are moving in the right direction. As they begin to notice improvements
    in their life, they become comfortable again. As if by magic, their motivation
    vaporises and their action dwindles to nothing. In fact, the worst case scenario
    is that they begin to drift towards the Awful Zone when the pain begins to increase
    again. This is the reason why many diets do not work, because as soon as your
    target weight is reached, you feel comfortable again and are tempted to slip back
    into old habits. The alternative is to move towards a healthy lifestyle where
    taking exercise becomes part of a way of life.


