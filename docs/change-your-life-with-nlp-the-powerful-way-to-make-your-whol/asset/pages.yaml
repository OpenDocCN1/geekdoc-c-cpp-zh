    # How do you set goals?


    As well needing goals to be compelling, a goal is best stated simply and according
    to the principles of the ubiquitous SMART objectives. These principles were originally
    taken from Paul J. Meyer''s book Attitude is Everything. They are not traditional
    NLP principles but I use them as they are the best way I found to set up goals
    in a way that makes them easier to achieve.


    +   Specific – goals should be straightforward and emphas what you want to happen.
    Specifics help you to focus your efforts and clearly define what you are going
    to do. For example, instead of setting a goal to lose weight or be healthier,
    set a specific goal to lose two centimetres off your waistline or to walk five
    miles a day.


    +   Measurable – if you can''t measure it, you can''t manage it. Choose a goal
    with measurable progress, you can see the change occur. For example, ‘I want to
    write one chapter day for my book’ shows the specific target to be measured.'
