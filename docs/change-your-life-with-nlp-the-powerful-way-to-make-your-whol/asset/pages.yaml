- pgno: 24
  md: '# WHAT CAN NLP DO FOR ME?


    # Dealing with nerves


    Do you have something coming up that you are nervous about? As you think about
    that situation now, looking through your own eyes, notice the pictures, sounds
    and feelings that are associated with that situation. Now imagine stepping backwards
    out of your body so you can see yourself, in front of you. As you look at yourself,
    notice how your feelings have already changed. Increase the distance between you
    and the picture of you in front and notice how you feel even more calm now.


    How was that? Easy, wasn''t it?


    # Dealing with procrastination


    Do you ever procrastinate about a particular task or situation? We all do from
    time to time. As you think about something that you procrastinate about, do you
    have a picture? By picture, I don’t mean a picture clear as a photograph. I mean
    a sensation of thought located in some direction in relation to your body. So,
    if I were to ask you where the picture is, or what direction would you point?
    You may notice it in front of you, to one side or behind you. Any location is
    perfect. Clear the screen and the picture. Now think of something you are totally
    motivated about. As you think about it, do you have a different picture? What
    is the location of that picture? Notice that it’s different from the first picture.
    Clear the screen and the picture. Now here goes. Get back the picture of the situation
    you procrastinate about and move it into the same position as the thing you are
    totally motivated about. Notice what happens. You immediately feel more motivated
    to do the task you used to procrastinate about. That was easy too, wasn’t it?
    I always use this technique to motivate myself when it’s time to spring clean
    my cupboards at home!'
  merge: -1
  img_proc: true
- pgno: 25
