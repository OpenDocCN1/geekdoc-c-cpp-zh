- pgno: 203
  md: 'I’ve come across a number of people who expected me to sprinkle ‘magic dust’
    on them so they would leave the room having been ‘changed’. I wish it were that
    easy. If I had ‘magic dust’, then I would be a very rich woman by now. A person
    or book can only be your tour guide – you have to take responsibility for making
