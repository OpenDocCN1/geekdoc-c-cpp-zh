- pgno: 234
  md: '# Options/Procedures


    # Options people


    These people tend to be focused on a goal. They are glass ''half-full'' characters.
    They like to have possibilities and options available to them. They enjoy feeling
    they have a choice about what they do. They are good motivators of other people
    as their enthusiasm is infective.


    Words and phrases they might use: focus; goals; let''s go for it; there are many
    possibilities; opportunities for the future; choices


    # Procedures people


    These people don''t feel that they have a lot of choice about how they lead their
    lives. They often feel the weight of the world on their shoulders. They are more
    likely to be glass ''half-empty'' people. They believe they have to do what they
    do -- maybe because of family responsibilities or pressure to follow the family
    business. They may see the risks in things as they like to follow procedures and
    rules.


    Words and phrases they might use: Here are the procedures we need to follow to
    get the best result; Let''s do this in an orderly fashion; I have to do things
    this way


    # Inferential/Literal (listening style)


    # Inferential listeners


    They infers things from what is said. They are great mind readers and often jump
    to the wrong conclusions. They also think that any question is a request for action.


    Words and phrases they might use: I thought you wanted me to do something; I thought
    that''s what you meant


    # Literal listeners


    They take what is said very literally. If you want something done, you would need
    to ask them very directly or they are'
