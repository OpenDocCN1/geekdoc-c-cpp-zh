  md: '# CHANGE YOUR LIFE WITH NLP


    # Words


    Finally, let''s discover how to match words. There are a number of things to listen
    out for. We''re going to re-visit our communication styles that we discovered
    in Chapter 5 and learn how to match the different styles that people use. In addition,
    listen out for any key words that person uses over and over again. Start to use
    them in your own language. For example, if someone uses the word ''absolutely''
    a lot, start to use it when you are speaking to them. Also, listen out for common
    experiences, interests and values that you share and bring them into the conversation.
    Don''t pretend though – there''s too high a risk that you''ll come unstuck! Also,
    notice the content chunks they use, i.e. do they use short or long sentences?
    Modify your content chunks to match theirs.


    # Learning to speak a new language


    Please go back to Exercise 11. Which communication styles were your most and least
    preferred? Do you notice that you often use the literal words of your style? For
    example, what style of person would use the word ''feel'' in their language? The
    really clever thing is that you can begin to spot other people''s communication
    styles from the words or predicates that they use. Appendix 2 lists examples of
    the types of words and phrases each style will primarily use. These words reflect
    whether they are thinking using their visual, auditory, kinesthetic or audio systems,
    and this gives you an insight into how their brain is sorting information at the
    time. You can''t tell what a person is thinking but you can have a good idea how
    they are thinking! For example, visual people will use words like ''see, clear,
    illuminate,'' etc. and phrases like ''I can see that''. They are literally telling
    you that they are making a picture in their minds. A kinaesthetic person will
    use words like ''feel, touch, grasp'' and phrases like ''that feels good to me''.
    An auditory person will use words like ''hear, listen sounds'' and phrases like
    ''that sounds good to me''. An audio digital person will use words like ''sense,
    think, experience'' and phrases like ''that makes sense to me''.'
