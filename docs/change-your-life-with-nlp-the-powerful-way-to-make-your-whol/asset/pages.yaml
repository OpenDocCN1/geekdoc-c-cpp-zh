  img_proc: true
- pgno: 216
  md: '# DO YOU WANT IT OR WHAT?


    my book we worked together to map out the key messages that I wanted to deliver.
    Since then, every week, we have reviewed my progress against the objectives and
    timescales I originally set for myself. I know that this has helped me to avoid
    lengthy and painful rewrites.


    You may also get yourself a coach. The terms ''coach'' and ''mentor'' are often
    confused. A mentor is an expert and can be quite direct at times. In contrast,
    a coach is an expert facilitator, asking you questions until you come up with
    the answers for yourself. If you wanted someone to keep you on track and to assist
    you to break old patterns of procrastination and a lack of self-belief, then a
    coach may be better for you. I have also used a coach in my life when I needed
    to discover and break through limiting beliefs about myself and change old strategies.
    A coach can really assist you to become far more self-aware.


    Lastly, find a model of excellence. I have already mentioned in this book invaluable
    is to find someone who has already achieved what you want to achieve and find
    out how they did it. You do this by modelling their beliefs and strategies, and
    how they use their body (especially important when modelling sports people). In
    NLP terms, we would say that we model their:


    +   - internal process, or how do they do things

    - internal state, or why do they do.

    - external behaviour, or what they do.


    Give yourself time for self-reflection. My belief is that we absolutely benefit
    from understanding as much as we can about ourselves and the patterns and beliefs
    that we run. Working with others and taking time for self-reflection will allow
    you to grow and develop. Remember: there is no failure only feedback. Next time
