    # Deadlines


    Chopra says it is no coincidence that the word ''deadline'' includes the word
    ''dead''! Do you notice that some people are far more sensitive to time pressure
    than others? Some people blossom, others feel under threat. In business, setting
    a tight deadline is often what I would describe as a ''macho'' behaviour, with
    deadlines often set arbitrarily and set earlier than is necessary. I experienced
    this many times at the consultancy company I worked for. Often the deadline for
    a project was agreed without consideration for the impact of the deadline on the
    project team required to deliver the work. And, there were times when the delivery
    team discovered that the client would have been fine with a longer delivery period.


    We all know of people who get stuck in a particular time frame - they get stuck
    in the past which they can do nothing about or focus on being anxious about the
    future. How many people do we know who waste so much energy stuck in the past,
    feeling guilty about events long gone or wishing they had acted differently? Or
    people who spoil the present moment because they are so worrying about something
    that isn''t due to happen for weeks ahead? We can conclude that our experience
    of time is exclusively our mental focus in the moment or in the now, and that
    can be changed.


    # Being in the now


    The only time is **now**, so consider how you want to experience it. The ability
    to manage your time will shape your experience of life and your ultimate success.
    Your experience of time is shaped by your focus. Stop for a moment and consider
    how you are experiencing time right now. Are you enjoying it, wasting it, killing
    it? You can control your experience by how you focus on time.'
