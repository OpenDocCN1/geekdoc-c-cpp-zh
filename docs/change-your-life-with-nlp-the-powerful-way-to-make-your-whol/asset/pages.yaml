- pgno: 191
  md: '# CHANGE YOUR LIFE WITH NLP


    There are other beliefs that also support our ability to give and receive feedback.


    # Everyone''s perception is their own truth


    We may not agree with the feedback we have been given but it''s true for the giver
    in that situation. Each person''s perception is unique to them and represents
    their own model of the world. That does not make it right or wrong, it is just
    true for them. By accepting the feedback from someone, we are accepting that part
    of ourselves as they experience it. If everyone in a group gives an individual
    the same feedback, then there is something for them to think about.


    > If you can spot it, you got it.


    I heard NLP trainer, Sue Knight, say this at the NLP annual conference. In other
    words, we recognise in others is true about ourselves. The characteristics in
    others that touch us emotionally are a pointer towards things that we don''t like
    in ourselves. You may notice that you dissociate from the characteristics that
    you don''t like in others. Yet, these are often ''blind spots'' in us. To see
    something in others, we have to have that ''structure'' in our thinking too, otherwise
    we would not recognise it. For example, I recently gave feedback to my daughter
    about not paying her monthly housekeeping allowance on time and recognised that
    behaviour in myself when paying business bills! That was an example of a ''blind
    spot'' for me.


    Taking on these beliefs helps us to begin to change our mindset around feedback
    and to begin to see it as something precious. It also starts to become clear that
    feedback is all around us if we take the time to seek it out. It''s not just what
    others tell us, we get feedback from everything we do. For example, if everybody
    stays quiet when you suggest something, the chances are that their silent feedback
    means they don''t like the idea.'
