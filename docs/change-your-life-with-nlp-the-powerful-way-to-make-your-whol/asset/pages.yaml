- pgno: 212
  md: '# Do you want it or what?


    We''ve come a long way together, haven''t we? So you don''t blame me if as a result
    of reading this book you become successful. My goal has been to inspire you to
    think and feel differently about your life. To see what is possible and to go
    for what you want in your world.


    Throughout this book I have given you ideas, skills, tools and the motivation
    to change your life, to really go for what you want. Now, as you are nearing the
    end of this book, you have a choice to make. You can be happy that you have learned
    something new and slip quietly back into the Grey Zone. Or you can move to the
    ''C side'' and begin to nurture those powerful beliefs that will create what you
    want. If so, you are ready to take the first step. Perhaps you have already taken
    it in your mind or in reality as you made your way through all the transformational
    exercises in this book. Change leads to more change. Every step you take brings
    a success that will inspire you to make the next move. You''ve learned that the
    most important thing is to keep going until you reach your goal.


    To achieve your goal is an amazing experience and I wish you many of them.


    # How do you want to be remembered?


    So the question is, what do you want your legacy to be? It doesn''t matter where
    you are right now or how old you are. It is never too late to change. I wish for
    you to live your life fully. Live your life in the now. Give everything you do
    your 100 per cent commitment. Experience everything that you get the opportunity
    to. If someone asks you to get involved in something, just say ''yes''. That''s
    another one of my philosophies of'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'life. And the more fearful you are of the opportunity the better, as the learning
    will be greater. Experience everything; learn from your experiences and the feedback
    that you get. Remember that there is no failure only feedback.


    A few years ago, I fell in love with a man who looked like everything I had ever
    imagined I wanted. He was tall, dark and handsome with long, dark hair and a lean,
    muscular body. He had been in the SAS and was a karate champion. He was my own
    James Bond character, my Milk Tray Man. How he made me laugh and helped me to
    believe in fairy tales again. My usual cautions about how quickly to open my life
    and my heart to him evaporated in the excitement and passion of our meeting. I
    held nothing back and risked everything including my life, my children and my
    business. I let myself love and my family were afraid for me. They cautioned me
    to hold back, to take my time. I exposed myself to my colleagues, friends and
    family as a woman of deep, untidy feelings that could override my normal gift
    of being grounded and rational across all areas of my life.


    The end of the relationship left me totally numb and hollow inside and I felt
    the toll. And I would do it all again. I would not trade one moment of the passion
    for the protection of my pride. Why? Because through the experience I got some
    priceless learnings for myself. I learned what I really wanted in a relationship
    and I learned to be authentic, to be myself, because that is enough. That''s what
    I mean when I say that I want to experience everything. We do not die from being
    foolish. Why do we fear it so much?


    Life is not a rehearsal after all, so why then so many people live it in that
    too, too afraid to take any risks and keeping their heads down in case someone
    spots their real potential? Enter into your life by stepping on the stage, out
    of the Grey Zone, once and for all. Otherwise, as John Lennon memorably said,
    ‘Life is what happens while you''re busy making plans.’'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'One of my teachers, Peggy Dylan, describes our body as our prayer. It''s how
    we relate to the world. If we see it as our prayer, why then do we abuse its well-being
    with alcohol and junk food, or keep it on a tight leash lest we have any amazingly
    innovative ideas that take us closer to our dreams? Think about it. How are you
    treating your body right now? Will you keep in balance whilst you pursue your
    goals? At the very least, take regular exercise, drink loads of water each day,
    a balanced diet and get enough sleep. That is the minimum requirement for someone
    pursuing their goals to keep their energy levels and well-being at their highest.
    See your life as a pathway to growth. If you do nothing there is no opportunity
    to learn. In contrast, if you accept the opportunities and challenges that come
    your way you will get the learnings that follow.


    > “Everyone needs to keep learning. Everyone needs goals.”


    Richard Branson


    # Your proudest moments


    As you start your journey now, focus each day on what you have achieved, rather
    than on those things that didn’t go to plan. In one of my favourite songs, ''Proud'',
    Heather Small asks: ''What have you done today to make you feel proud?'' These
    do not have to be the biggest achievements of your life. They may be simple things
    like taking exercise, spending time with somebody you love, completing a task
    at work. For me, they are a mix of things that move me forward. I ask myself that
    question every day. Experiencing my life like that means that every day when I
    finally go to bed I reflect and think that today was a good day. Are you ready
    to open your eyes and focus on your achievements?'
