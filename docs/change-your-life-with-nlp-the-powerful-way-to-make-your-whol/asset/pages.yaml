  md: '# How do we create beliefs?


    When I think of beliefs I have a metaphor in my mind of a new house being built
    with basic building blocks being put on top of a foundation. From the example
    above, ''money is the root of all evil'' would be the foundation of the belief
    which was generated by a commonly held view in that family. We then begin to collect
    building blocks or ''reference experiences'', as coined by Tony Robbins we add,
    to support foundation. The more building blocks we, the stronger the belief becomes.
    My client began to filter information according to the belief that ''money is
    the root of all evil''. Her building blocks were each example of where this belief
    had been reinforced by an experience that she had seen, heard, felt and so on.
    For example, other people supported the idea, a TV programme, an article in the
    paper, a book, a film. It didn''t take long before her reticular activating system
    was only bringing to her attention evidence that the belief was true. Her RAS
    acted as a pair of ''money is the root of all evil'' tinted glasses. Other opportunities
    to see in a different light were missed as they were outside her awareness. Once
    the belief was changed, she then began to notice new opportunities coming her
