  md: '# WHO AM I?


    Your highest score indicates the style that you use most to experience the world.
    If your highest score was kinesthetic, you process information from the outside
    world through your feelings and are unlikely to take action until something feels
    ''right'' to you. You act on your ''gut feel'' or intuition a lot. If you are
    auditory, something needs to ''sound right'' for you to take action. If you are
    visual, you process using pictures and you will only act if something ''looks
    right'' to you. Finally, if you are digital or logical, you will only act if something
    makes sense to you, and often after a thorough review of all the facts.


    What''s really fascinating is that each of these styles also has characteristics
    that are common to that style and use language that represents that preferred
    communicating style. This means not only can you recognise your own style but
    can also start to spot someone else''s style easily. And, at the same time, remember
    that this is a model based on generalisations of behaviour. We are all different
    and we do not operate from one style and nor other people. What follows are generalisations
    of each style which you may or may not recognise in yourself and others. In my
    own personal experience of working with individuals and groups I find them regularly
    to be true.


