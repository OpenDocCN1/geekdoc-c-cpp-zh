- pgno: 123
  md: '# What are beliefs?


    Our beliefs are views about ourselves, other people and situations that we hold
    to true. They are emotionally held views not based on fact. They are feelings
    of certainty that we have about something. For example, if you believe you are
    fit, what you''re actually saying is you have a feeling of certainty that you
    are fit. Alternatively, if you lack of belief or, in other words, it is a limiting
    belief that you are fit, it is likely to hold you back.


    Morris Massey, a sociologist, in his book People Puzzle - Understanding Yourself,
    describes the imprint period between the ages of 0 and 7 as the moment when our
    beliefs are formed. They are shaped by key people in our lives at that time, for
    example parents, teachers, religious leaders, close family, etc. In actual fact,
    most of our beliefs are generalised that we create from life experiences. Most
    of us do not consciously decide what we believe; most of us are generously donated
    our beliefs by influential parents during our imprint period, and once we have
    a belief we forget that it can be changed and it becomes our reality. We rarely
    challenge our long-held beliefs and they become a filter through which we sieve
    all life''s expectations and experiences.


    # Bridgit – awareness is the first step to recovery


    Bridgit set up her own business but despite some successes, the company was not
    yet reaching its potential and she was dangerously close to having to close it
    down. She came to me for a breakthrough session as she couldn''t understand why
    success was proving to be elusive and so hard work it did come to her. During
    her session I did some work with her on her limiting beliefs. It became clear
    during questioning that her parents were very religious and in fact they had always
    a very different view to her about money. They believed money to be the root of
    all evil and this was often discussed in front of my client and her brothers and
