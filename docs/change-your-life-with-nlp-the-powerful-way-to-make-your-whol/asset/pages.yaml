    was playing. Maybe it was the song you shared with a special person in your life.
    In a moment you can be transported back to that place and time and you feel great
    in the now. That is the power of anchors. That is an example of an auditory anchor.
    We also have visual anchors in our everyday life: step (I hope) when we see a
    red traffic light. The smell of a certain aftershave or'
