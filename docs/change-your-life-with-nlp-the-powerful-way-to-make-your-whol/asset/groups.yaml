    # WHAT WOULD YOU DO IF YOU KNEW YOU COULDN''T FAIL


    # What if you''re really prepared to go for it?


    > I’ve come to believe that each of us has a personal calling that''s as unique
    as a fingerprint – and the best way to succeed is to discover what you love and
    then find a way to offer it to others in the form of service, working hard, and
    also allowing the energy of the universe to lead you. Oprah Winfrey


    Think about people you know who have been very successful at achieving their goals.
    What has made them stand out from the crowd?


    # Sharon – rebuilding her body with focus and dedication


    There is a myth that it''s hard to lose weight over the age of 50. Sharon was
    52 when she decided it was time for a new body. She was three stone overweight,
    in poor health and miserable. She had a very specific goal which was to lose three
    stone in three months – a tall order for anyone. She was motivated by a vision
    she had of herself being able to buy a new and younger looking wardrobe, and most
    importantly, of her health improving as a result of the weight loss. I couldn''t
    help but notice her focus and determination. Her vision gave her a discipline
    that drove her forward towards her goal. Quick results led to the motivation to
    keep at it. Even over Christmas she stuck to her new routine of eating less and
    exercising more. She experimented with a number of ways to shift the weight without
    becoming obsessed with any of them. Within three months the weight is still off.
    She is in much better health, looks younger and is full of vitality. She loves
    her new body.


