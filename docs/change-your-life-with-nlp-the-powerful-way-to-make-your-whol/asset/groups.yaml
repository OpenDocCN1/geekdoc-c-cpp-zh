    us in our early years. They are not real. The reality is very different if we
    are prepared to find out and start the journey.


    It takes one of two things to move out of the Grey Zone. Either you have a goal
    that is so compelling you will take the risk of going for it. Or, in contrast,
    the pain becomes so great that you are finally tipped off the edge of change.


    Which one influences us often depends upon the way we are motivated. In NLP we
    talk about people being ''towards'' or ''away from'' motivated. Think about it.
    Do you move away from what you don''t want or move towards what you want? Are
    you a ''stick'' or a ''carrot'' person? For example, if you want to lose weight,
    do you move towards a goal of being fit and healthy and have a motivational image
    in your mind of you in that skimpy new outfit, or do you move away from being
    fat and focus on an image of you overweight and bulging out of that special outfit?


    ## Sticking to your resolutions


    One of the limitations of ''away from'' motivation is that it often dwindles once
    short-term improvements are gained. For example, a lot of people''s new year''s
    resolutions (although they might not realise it) are about getting out of the
    Grey Zone or even the Awful Zone. They start off well, take action and before
    too long they are moving in the right direction. As they begin to notice improvements
    in their life, they become comfortable again. As if by magic, their motivation
    vaporises and their action dwindles to nothing. In fact, the worst case scenario
    is that they begin to drift towards the Awful Zone when the pain begins to increase
    again. This is the reason why many diets do not work, because as soon as your
    target weight is reached, you feel comfortable again and are tempted to slip back
    into old habits. The alternative is to move towards a healthy lifestyle where
    taking exercise becomes part of a way of life.


    ## Exercise 2


    Am I ''towards'' or ''away from'' motivated?


    Ask yourself the following question and write down your answers below:


    - ''What do I want in my life?''

    - save money ~ 100 each

    - $200 per month. happy cheap

    - have less spendy money / month

    - have a game - reduced / right school

    - less worry / fear / car

    - great body

    - Balance


    Notice how many of your answers start with what you don''t want. If your answers
    focus on what you don''t want, you are more ''away from'' motivated. For example,
    ''I don''t want to be poor'' is an example of ''away from'' motivated. If your
    answers focus on what you do want, you are more ''towards'' motivated. For example,
    ''I want abundance'' is an example of ''towards'' motivated. Or you might have
    said ''I don''t want to be bored'' (away from) as ''I want to travel'' (towards).


    Now consider what it would take to move out of the Grey Zone and write down whether
    you are ''towards'' or ''away from'' motivated.


    The good news is that you can always change. If you believe that you can, you
    will. Write down what it would take for you to move out of the Grey Zone.


    ## Exercise 3


    What do I want in my life if I knew I couldn''t fail?


    Ask yourself the following question and write down your answers below:


    If you want to change, this is the moment. Write your answers below:


    - ''What do I want in my life?''

    - save money ~ 100 each

    - $200 per month. happy cheap

    - have less spendy money / month

    - have a game - reduced / right school

    - less worry / fear / car

    - great body

    - Balance


    If you want to change, this is the moment. Write your answers below:


    ## Karen – a blooming future


    A client of mine did not feel fulfilled in her job and was becoming more and restless.
    She asked me to assist her to discover what she wanted. She was surprised, when
    asked what she would do if she couldn''t fail, to hear herself say ''open a florist
    shop''. She has since gone part-time in her old job and works every weekend at
    a successful florist in London learning the trade.


    ## Why dream?


    Thomas Edison is one of the most prolific inventors of our time. He is best known
    for inventing the light bulb. He worked on at least 3,000 different attempts to
    develop an efficient lamp. One of the most inspiring quotes that I have come across
    the years and use regularly is by Edison:


    > I am not discouraged, I''ve just found 10,000 ways that won''t work.

    '
