  mdcn: "\n\n# 关于作者\n\n**Lindsey Agness** 是一位资深且经验丰富的 NLP（神经语言程序）培训师、商业顾问以及 Change\
    \ 公司的所有者。Lindsey 利用她的技能培训并教练个人和公司帮助他们实现自我转型。她每天都会使用书中的技术，不仅用于她的客户，也用于自己，以确保自己过着自己想要的生活。她曾与商界顶许多知名人士合作，并主持过许多受欢迎的培训研讨会和励演讲。\n\
    \n# 引言——你的生活可以变得更好吗？\n\n到目前为止，你过去如何过生活并不重要。重要的是你的梦想是什么，你内心渴望什么。唯一的时刻就是现在。活在过去会像担心未来一样，拖慢你的后腿。一旦你下定付诸行动，改变可以在瞬间发生，在眨眼之间或弹指之间。想一想——从你做决定的那一刻起，你就开始创造自己的未来了。\n\
    \n我很想知道，你的生活可以变得更好吗？问自己以下问题来寻找答案：\n\n- 我是否得到了我想要的生活？是 / 否\n- 我是否对未来有具有挑战性的目标？是\
    \ / 否\n- 我是否正在发挥我的全部潜力？是 / 否 \n- 我的工作让我感到满足吗？是 / 否 \n- 我的关系如我梦想的那样吗？是 / 否 \n-\
    \ 我是否有足够的钱去做我想做的事？是 / 否 \n- 我的生活生活平衡吗？是 / 否 \n- 我对自己的体型满意吗？是 / 否 \n- 我是否有足够的能量享受我的一天？是\
    \ / 否 \n\n如果你对所有问题都回答了“是”，那么你可能读错书了。走开享受你的生活吧！然而，如果你对一个或多个问题回答了“否”，那么你的生活绝对有改变的潜力——而且会好得多。你现在可能觉得生活过得还可以，但内心却在渴望某些东西。你认同这种感觉吗？也许你有一个一直想要追求的梦想，或者你生活中某个领域还不完善。这就是我当时的感受。我想建立自己的事业……\n\
    \n我曾在一家全球最大的咨询公司之一担任了多年教练和培训师。我曾帮助世界各地的商业领袖在他们的生活和公司中做出积极的改变。然而，我仍然害怕去追求我的梦想。\n\
    \n一段时间后，我开始在人们改变的方式中发现明显的模式。我个人发现，即使是巨大的改变也比你想象的没那么可怕。关键在于：\n\n- 找到真正让你快乐的事——你将感到不得不采取行动。\n\
    - 关注你想要的东西——你将对你吸引这些东西的速度之快感到惊讶。\n- 采取正确的态度，使你能看到所有情况的益处。我们的生活取决于我们对事件的反应，而不是我们身上发生了什么。\n\
    - 将你的生活视为一场冒险，你将开始享受这段旅程。\n- 在途中继续前进并不断学习。\n\n我决定亲自付诸行动。我制定了小小的步骤来追随梦想，这种感觉之好令我惊讶。我从从兼职自由职业开始。然后我成立了自己的公司并辞去工作。在那一刻，我无法解释那种感觉有多奇，因为我有勇气做出决定并付诸行动。我知道生活将永不再重旧。\n\
    \n这就是我想让你体验的。\n\n这并不非得建立自己的事业。也许梦想是关于做你一直想做的事，在生活中寻找目标和意义，改善或改变你的关系，搬到一个新的地区或国家，解决你的财务问题，减肥，找另一份工作——或者所有这一切！\n\
    \n如果你的梦想变成你的现实会怎样？我想激励你为未来创造新的选择，并鼓励你抓住机会做一些不同的事情。每当我开始我的课程时，我总是从我最重要的培训道具的故事开始。我向学生展示一根一直戴在手腕上的橡皮筋，问他们为什么认为它很重要。你们怎么想？答案是，橡皮筋一旦被拉伸，就再也回到原来的样子。一旦你学会了新东西，你就无法忘记它。如果你读了这本书并做了书中的练习，我保证你和你的生活将永不再一样。\n\
    \n在继续下去之前，我有一个问题要问你：\n\n你是否准备好迎接你真正想要的东西？是否准备好成为你应该成为的人？是否准备好付出任何代价？\n\n如果你是，请继续读下去；如果不是，那么就带着遗憾过好的一生吧。\n\
    \n# 终极测试\n\n那是八月，我在苏格兰和我的导师 Peggy Dylan 一起参加火走教练教练培训。那已经是为期一周培训的第三天了，我开始慢慢克服在火上行走的恐惧。第一晚是一个挑战。我们聚在一起生火——那部分很有趣。然后我们点燃火，看着火焰越升越高，越来越炽热。几个小时后，木头变成了木炭，是时候走过去了。我生命中从未对任何事情如此恐惧。我经历过其他关于改变的强力比喻——比如用身体的能量和速度折断一块松木。\n\
    \n某个人很冷静，处于冥想状态。当然，我们开始询问他们发生了什么。他们却令人沮丧地保守守秘密。这让我对即将发生的事情更加紧张。我等待 1 号到 10 号离开房间，他们在十分分钟后回来。在经历过之后后，他们看起来都很冷静。\n\
    \n"
