    # About the author


    **Lindsey Agness** is a highly qualified and experienced NLP trainer, business
    consultant and owner of The Change Corporation. Lindsey uses her skills to train
    and coach both individuals and companies to transform themselves. She uses the
    techniques in this book on a daily basis, not only with her clients, but also
    on herself, to ensure that she is living the life she wants to live. She works
    with some of the biggest names in business as well as running many popular training
    seminars and motivational speaking assignments.


    # Introduction – could your life be better?


    It doesn’t matter how you have lived your life until this moment. All that matters
    is what your dreams are, what you ache for in. The only moment is now. Living
    in the past can slow you down as much as worrying about the future. Change can
    happen in an instant, in the blink of an eye or the click of a finger, once you
    have made a decision to go for it. Think about it – you start to create your future
    as soon as you make a decision.


    I''m curious to know, could your life be better? Ask yourself the following questions
    to find out:


    - Am I getting what I want out of life? Yes / No

    - Do I have stretching goals for the future? Yes / No

