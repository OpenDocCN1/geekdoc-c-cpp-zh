    # 用 NLP 改变你的生活


    - 得分最高为“B”——无论你是否想要，你都无法下主意！有时你想改变，有时又不想。你确实有很多激发你灵感的想法。问题在于，改变需要持续的努力，如果不是那么困难，你真的会改变的。你不喜欢过早排除自己的选择，这可能导致你在追求目标时采取散弹式的策略。你并不总是处于“C
    侧”，如果事情出错时你归咎于他人，你就会。你必须将精力集中在你真正想要的事情上，以便读完这本书后成功。重读第 4 章（关注你想要的）、第 6 章（结果还是借口？）和第
    7 章（相信你可以）。


    - 得分最高为“C”——想要它太冒险了！你整天梦想着那些准备冒险的人过得什么样。好吧，如果你总是做过去做的事，你就永远得到过去得到的东西。这是你的真相时刻——你到底要不要？如果答案真的是“是”，那就把你的目标分解成小块并开始采取行动。每一个小步都会鼓励你走得更远，很快你就会对自己成就了这么多感到惊讶。如果答案是“否”，那就退回到灰色地带吧，在那里你余生都将无人问。重读整本书，这次深呼吸，真的去努力一次吧。


    - 得分最高为“D”——你太忙于扮演完美的配角，以至于想要主角了！你是奥斯卡颁奖典上那个获得最佳配角男/女演员奖的人吗？关注别人的问题是否比处理自己的问题更容易？好吧，照照镜子，问问自己，现在是时候承担起对你想要的生活负责的责任了。有些人，尤其是女性，一一生都在关注别人想要什么——他们的丈夫、孩子、年迈父母等等。你想在回首时问自己这个问题：“如果……会怎样？”吗？


    # 你到底要不要？


    你满足于“这取决于你”这种想法，但我很好奇你为什么要读这本书。这是你的真相时刻：

    - 你到底要不要？迈出第一步。说“不”，看看这有多么容易。毕竟，这只是一个非常小的词。给自己留点时间。现在就开始考虑你打算如何度过余半生吧。除了“我是某人的伴侣、父母、朋友等”，你的传承是什么？现在就做。这只需要一小步。如果那太难了，就退回到灰色地带去过平庸的生活吧，但我怀疑你不会的。重读这本书，这次是为了你自己而读。


    你的问卷做得如何？你发现什么惊喜了吗？我很享受担任你的向导，但现在该由你开启属于自己的旅程了。我希望我启发了你对生活做出一些不同的改变，离开灰色地带，向绝对的辉煌区域迈进。那是我要去的地方，我想在那里见到你。记住，没有所谓的“尝试”——你要么全力以赴，要么放弃，因为低于百分之
    100 的努力都是自我破坏。祝你好运，尽管我知道你不需要运气，因为你拥有了成为、做到和拥有你所想要的一切所需的一切。正如米尔顿·艾里克森（Milton Erikson）所说：“让我的声音随你。”享受这段旅程。


    来到边缘。

    我们可能会坠落。

    来到边缘。

    太高了！

    来到边缘！

    他们来了

    他们推着

    他们飞走了……


    # 克里斯托弗·洛格（Christopher Logue）


    # 我的真相时刻


    当我站在明亮的满月下闪闪发光的火堆旁时，我问自己是否真的准备好独自行走。没有朋友的能量陪我穿行，感觉完全不同。我知道我可以说我走过了，但那将是对不起自己。这是生命中那些珍贵的时刻之一，你有机会向自己证明，你比自己想象的要强大得多，我不想错过它！我感到心跳加速，全身开始因兴奋而颤抖。能量在全身升腾。直到这一刻为止，我生活中的任何事情似乎都不再重要了。眼前的火象征着我的余生，以及我如何选择生活以及我想成就什么——所以没什么压力了……


    我静静地专注于我想成就的目标。我想要一段美好的关系、健康快乐的孩子、成功的事业。我听到脑海里有一个声音说：“去努力吧！”但我的腿现在像扎根在地上一样，就是动弹不得。火的热量令人窒息，我感到恐惧。我在脑海中反复安慰自己：“你可以的”。我正正站在火脚，除了心跳声和风穿过树木的声音，我什么也听不见。我开始对自己感到挫败，我听到自己在说：“你准备好了。”这一次，一股安静的能量充斥着身体。我专注于火堆之外的一一点，在脑海中构思我想在生活中创造的一切。我用鼻子吸气，用嘴呼气，三次，然后迈出了那至关重要的第一步，迈向未知。我突然自信地跨过了火堆。我能感觉到脚下和趾间的热量，我继续前进。我又走了几步大步，已经跨过了火，到达了另一边。这次没有人欢呼，只有一种安静而真实的感悟：我做到了，我可以完成任何事情。


    在那几个安静的片刻里，我向自己证明了我有勇气面对恐惧并付诸行动！当我轻轻走回山坡时，我感到非常自豪。12 号已经准备就绪并在等待，我静静地对他们说珍惜每一个时刻。


    # 接下来怎么办？


    ## 变革公司 – 我们的项目


    我希望这本书带给了你启发。这仅仅是一个开始！如果你想进一步提升自己，与我进行个人合作，这里是我们的业务以及你如何联系我们。


    ### 企业项目


    学习与发展。我们的客户包括联合利华（Unilever）、敦豪（DHL）、诺基亚（Nokia）、普华永道（PriceWaterhouseCoopers）、杜伦姆商学院和亨利管理学院（Henley
    Management College）。我们提供定制项目，以满足你在变革管理、领导力和团队发展方面的需求。


    咨询。我们还提供负责转型变革、文化变革和组织发展的变革顾问。


    ### 教练


    我们提供生活和执行管理包。对于需要解决特定问题的人，我们还提供一天的突破课程（Breakthrough session）。


    ### 公开课程


    用 NLP 改变生活。我们定期举办三小时体验工作坊。我们向你展示如何使用 NLP 控制你的生活并培养不可阻挡的自信。


    三天强力计划。许多人对公开演讲的恐惧超过其他任何事情。这个计划利用 NLP 建立你作为演讲者的自信和信念。你将学习如何在任何情况下展现魅力进行演讲，并获得你想要的结果。


    十天“态度年龄（Age with attitude）”。这是一个专为中年女性设计的独特项目，她们希望获得更丰富的生活，并打破任何阻碍她们的限制性信念。AWA
    不仅仅是一个个人发展计划，它更关于追求目标和成就，无论是商业还是个人。小组每 10 个月见面四次，因此它关乎长期增长而非快速解决。学员还将配备自己的个人教练，以便在各个模块之间进行交流。该项目已在公共部门（如英国国家医疗服务体系
    NHS）用于其女性员工的发展。访问 www.agewithattitude.co.uk 了解更多信息。


    七天快速通道 NLP 执业师、时间疗法执业师和催眠执业师。你将学习如何使用 NLP 技术转化自己的生活并帮助他人。我们的执业计划允许你在七天内成为 NLP
    执业师，节省了 13 天的传统课堂时间。我们通过利用预习 CD 实现这一点，在培训结束后，你仍可以使用它们作为有用的复习。你还将学习成为时间疗法师和催眠师。


    十四天快速通道 NLP 大师执业师、时间疗法大师和催眠大师。我们的大师级计划不仅能让你将执业技能提升到精通水平，还将教你许多高级技巧。在项目结束时，一切将通过一个课程汇合：你将在指导一名客户并接受指导，经历一次真正的转型体验。你还有机会成为时间疗法大师和催眠大师。该项目也包含预习部分。


