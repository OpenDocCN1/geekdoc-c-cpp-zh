    126 位信息是能够支持你目标的信息。专注于两个或三个关键领域或单一目标会对你的行为产生特殊作用。它会激活你的 RAS。我们知道大脑每秒都会受到成千上万条信息的轰炸。你看到的、听到的、闻到的、感受和触摸的一切都是进入你大脑的信息。RAS
    会过滤所有这些信息并决定哪些信息获得“头等对待”——即唤醒大脑。


