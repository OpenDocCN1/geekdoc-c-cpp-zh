    A — are very touchy feely.

    B — I can really tune in to.

    C — get to the point and make decisions quickly.

    D — give me lots of relevant information.


    ## Questionnaire answers


    Make a note below of your total scores for A, B, C or D.


    A''s (kinaesthetic/feelings) 16

    B''s (auditory) 12

    C''s (visual) 13

    D''s (audio digital / logical) 9


    ## WHO AM I?


    Your score indicates the style you use most. If your highest score was kinesthetic,
    you process through your feelings. If your highest score was auditory, you listen
    to what is said. If your highest score was visual, you use pictures. Finally,
    if you are digital, you only act if something makes sense.


    ## Characteristics of the different styles


    ### Kinaesthetic


    Kinaesthetic people take their time to process information because they process
    through their feelings. They breathe from the bottom of their lungs and tend to
    speak and move in deliberate way. They may be physically larger than the other
    styles as they are more alert to bodily needs including hunger and eating. They
    have a lower pitched voice.


    ### Auditory


    Auditory people tend to be slim and often seen with arms folded and their head
    tilted to one side as they concentrate on listening to what is said. They breathe
    from the middle of their chest. They often talk to themselves and are very distracted
    by noise. For example, one of my NLP trainers, one of my students gave me feedback
    on the last day that the course had changed her life. They remember things verbally
    and can repeat back exactly what you said to them. They remember things that were
    said months or years before. As you might expect, they enjoy talking on the phone
    and listening to music. They are particularly sensitive to tone of voice and they
    memorise things by steps, procedures and sequences.


    ### Visual


    Visual people process information quicker than the other styles because they process
    through pictures in their heads and they can change these pictures very fast.
    This happens unconsciously. They can get frustrated with the slower pace taken
    by others. They tend to be thinner than the other styles, maybe because they tend
    to move around faster. They like to stand tall and often stand back from the crowd
    so they can see what is going on. They like to keep more personal space than other
    styles and will move backwards if you get too close. They will want the seat in
    the restaurant that gives them the best vantage point to watch what is going on.
    They are often well dressed and like to ‘stand out’ in the crowd and enjoy the
    people/places/things around them to look good too. They are not good at remembering
    verbal instructions, preferring to memorise pictures. They tend to breathe from
    the tops of their lungs and speak faster than the other styles because their voices
    and breathing have to keep up with their thoughts.

