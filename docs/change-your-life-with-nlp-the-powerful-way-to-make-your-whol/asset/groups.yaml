    # WHAT WOULD YOU DO IF YOU KNEW YOU COULDN''T FAIL


    - 4. What will you see/hear/feel when you have it? (Creates a multi-sensory description
    that makes the goal more real.)

    - 5. How will you know when you have it? (Checks your evidence criteria.)

    - 6. What do you you have now and what do you need to achieve your outcome? (Checks
    the resources you require to achieve the goal.)

    - 7. What will you gain or lose if you have it? (Checks the impact of your goal
    on other areas of your life.)


    What did you notice happening to your goal as you went through that process? Most
    people find that their goals become much clearer and they feel more committed
    towards them. the sensory description (i.e. what you see/hear/feel when you have
    it) really attaches to your goal.


    The impact question (number 7) is also very interesting because it flushes out
    what is called ''secondary gain'' in NLP. It asks you to think about what you
    will lose as well as gain when you achieve your goal. For example, taking that
    job secondment to the US might be great for your career but will give you less
    time for your relationship and your children. It''s very important that consequences
    are acknowledged and addressed because any internal conflict can cause you to
    give less than 100 per cent commitment to your goal, and you may end up compromising
    or even sabotaging your own success.


    For example, secondary gain for me when I started my own company was the loss
    of my regular and generous salary. That kept me stuck in the Grey Zone for a long
    time. In fact, it took me three years to make the decision to leave my job and
    focus full-time on my company. So be honest with yourself about what you might
    lose, and later we''ll deal with the fear of giving up those things to pursue
    your dreams.


    # Letting the specifics go


    I don''t believe it''s necessary to work out detailed plans to achieve each step
    along the journey towards achieving your goal. Mike Dooley, author and collaborator
    in the film The Secret, calls them ‘the dreaded HOWs’. That might sound rather
    controversial for some people. I say this because there are a million ways in
    which you can achieve your goal. If you focus too rigidly on a particular path,
    you will not notice other possibilities that may come your way. If we focus on
    only one solution, then we miss the opportunity to spot whatever is not that one
    solution - everything else or for infinite opportunities. Why would you want to
    constrain yourself when you can achieve your goal in many different ways?


    For example, if you want to have a new relationship in your life, you may choose
    to focus all your energies on internet dating. Every evening and weekend you spend
    all your time checking any new dating prospects that have come online. Whilst
    you do that you are turning down regular opportunities to go out with your friends
    where you might also meet that special person. I''m not saying that you shouldn''t
    go on to the web - I am saying that you should leave yourself open to all the
    other ways of meeting someone new as well.


    # Face the right way


    The important thing is to set your attention in the right direction. Your energy
    then flows where your attention goes. Therefore, if you turn your attention to
    your goal and begin to take action, then success will follow. Leave the delivery
    to your unconscious mind and enjoy the journey. Just allow it to happen. You''ll
    be astonished at how quickly you begin to attract yourself people, places and
    things that will help you to achieve your goal.


    # Relax


    It is also important to let go of it not being OK for you to not get your goal.
    This may sound contradictory to what I said earlier about your goal being compelling.
    However, if it''s not OK


    # WHAT WOULD YOU DO IF YOU KNEW YOU COULDN''T FAIL


    for you to not get your goal you will focus on your anxieties about getting the
    goal. If you focus on and place your attention on what you don''t want (see Chapter
    4), you are likely to attract exactly that thing to you. How do you avoid this?
    One way is to consider the worst thing that might happen if you don''t get your
    goal – but only for as long as it takes for you to be OK with that and let it
    go. For example, I considered what would be the worst thing that could happen
    if I didn''t get my goal of running a successful company. For me that would mean
    that I would need to go back into paid employment and felt fine. I then put the
    concept out of my mind and focused all my energy on the success of my company.


    # Keep going


    John Grinder, the co-creator of NLP, said that in his experience the single key
    factor which stops people achieving their goal is that they don''t have a goal
    beyond a goal. If there''s nothing to aim for, they can become demotivated and
    even sabotage themselves. For example, let''s say my goal is to climb a mountain
    and I train hard for it over a long period of time. If, when I reach the peak
    of the mountain, I am not already looking out at the next highest peak I may become
    demotivated. I may even begin to slide back into the Grey Zone because I have
    lost focus and direction in my life. So it''s very important to enjoy the journey
    and always be aware of what comes next.


    # Responsibility for goals


    I actually left my well-paid comfortable job twice. The first time was when a
    friend of mine had asked me to become her business partner and fellow director
    of her NLP training company. I was thrilled about this although I wanted to set
    up my own business for at least two years I hadn''t had the courage go out completely
    on my own. Her company was already successful and making very good profits. However,
    after a very short period of time things began to go wrong.

