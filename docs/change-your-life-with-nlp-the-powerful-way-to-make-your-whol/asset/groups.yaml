    # CHANGE YOUR LIFE WITH NLP


    Paul had spent his career firmly in the Grey Zone. Can you imagine what would
    be like? I’m wondering to what extent your job is helping you to achieve your
    potential. Do you wake up in the mornings full of energy and eager to get started,
    or do you want to turn over, wrap yourself in the duvet and groan? Are you heading
    towards a similar experience as Paul? Be honest with yourself.


    # The Brilliant Zone


    > Every day brings a chance for you to draw in a breath, kick off your shoes,
    and dance.

    Oprah Winfrey


    The Brilliant Zone is the caretaker of our dreams. We know if you are heading
    in the direction of the Brilliant Zone because it feels exciting, motivating,
    exhilarating and stretching. These are our moments of optimal experience. In my
    experience, the journey towards the Brilliant Zone is not about the passive, receptive,
    relaxing times, although such experiences are great if we have worked hard to
    attain them. Instead, the best moments are when our bodies and/or minds are stretched
    to their limits to achieve something difficult and worthwhile. The difference
    is that these are the experiences we make happen.


    Those with courage move out of the Grey Zone and towards the Brilliant Zone. And,
    anyone can achieve this. In fact, it’s already too late for you because you know
    now that the Brilliant Zone exists and it’s possible to get there. What makes
    the difference? Those who move outside are the people with a compelling dream
    for the future. They are totally focused on their dream and failing is not an
    option. They never say ‘I can’t’. Instead they say ‘Why not!’ You can probably
    think of a number of successful people who have this philosophy in life.


    # You can or can’t you?


    Virgin boss, Richard Branson, doesn’t believe that little word like ‘can’t’ should
    stop you. He had a great teacher. His mother wanted to be a pilot during the war
    and told that only men'
  - '[PAGE 34]


    # ARE YOU IN THE GREY ZONE?


    could be pilots. Despite being very attractive, she wore a leather flying jacket
    and hid her blond hair under a leather helmet. She practised speaking with a deep
    voice and got the job she wanted. After the war, she wanted to be an air hostess.
    For this you had to speak Spanish and be trained as a nurse. Branson''s mum chatted
    up the porter at the airline and he secretly put her name on the list. Soon after
    she was an air hostess. She still couldn''t speak Spanish and wasn''t a nurse
    but she used her determination and her courage. When Branson was only four years
    of age, his mother used to stop the car few miles from their house and tell her
