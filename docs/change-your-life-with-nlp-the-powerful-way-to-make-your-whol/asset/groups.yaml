    Susie 的情况与众不同，她的说话风格充满了程序化和推论性。她一毕业就直接加入了家族企业，因为这是家人的期望，而且家里也需要她。这家企业是一家成功的餐饮公司，慢慢发展成了一个拥有
    50 名员工的团队。他们为国家一些最大的连锁餐厅提供服务。Susie 加入了财务团队，多年后晋升为公司的财务总监。她现在正值四十出头，却非常不快乐。她对工作的日常性感到非常无味，但又觉得有一种强烈的要求要“遵循家族传统”，去做那些被预期做的事。她也很不愿意向父母吐自己的感受。多年来，她暗示过自己想成为建筑师的真实愿望，这与她的创造才华更为契合，但某些东西总是在阻碍她。她来找我进行突破课程，因为她对自己的处境感到非常抑郁。她正处于“糟糕区域”（Awful
