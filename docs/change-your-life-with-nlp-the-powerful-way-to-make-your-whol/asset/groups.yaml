    79


    became aware of some of my students saying how much they were enjoying the sensation
    of the chocolate ''popping'' in their mouths. I wondered what they meant and picked
    up the now empty bag. It said something like ''champagne chocolates – put them
    on your tongue and enjoy the fizz''.

    Sometimes the biggest lessons come in the smallest examples. I wondered what there
    was for me to learn from that experience and I realised that I rushed through
    my life in search of my goals without savouring each step of the journey. It was
    one of the most important lessons I made that year and it helped me to slow down
    and enjoy living in the now. The next day of my students bought another bag of
    the same chocolates and this time I just put mine into my mouth and enjoyed the
    sensation as it literally sizzled my tongue.


    # The power of values


    I spoke in Chapter 3 of the importance of our values in the context of my career
    change. We''re going to explore them in more detail now. Our values determine
    how we spend our time. They determine what we do. They motivate us to take action
    and they are the means by which we evaluate ourselves after the event, and decide
    if we did a good job – or, indeed, the right thing. Our values also provide our
    moral code, so if we feel uncomfortable about anything we''ve done it''s likely
    to be due a conflict of values. Yet, they are largely unconscious. As a result,
    we may unknowingly choose goals that are not aligned to our values. When this
    happens we often experience an inner conflict between what is around us and how
    we feel on inside. This can manifest as unhappiness or an illness. So it''s really
    important to find out now how far your goals are aligned to values.


    # Aligning your values to your goals


    I''m going to show you a powerful process that you can use to discover your values
    in relation to your goals. If your values are aligned to your goals, it will become
    much easier to achieve them as you''ll naturally feel motivated and willing to
    do whatever it takes to achieve them.


    # WHO AM I?


    # Exercise 13 in relation to my goals


    My values in eliciting values it''s best to find someone who can work with you
    to ask them the questions. Choose a friend who can act as your coach. One of the
    rules of this exercise is to ask them to keep going with the questioning, even
    when your answers dry up. This is because your conscious values come out first,
    as they are at surface level. Your unconscious values are those that you are least
    of, and are likely to come out later and may prove to be the most important of
    all the values you identify.


    # Step 1: elicitation


    Get your exercise partner to ask you the following question: ''What''s important
    to you about achieving your goals?'' By the way, these should be goals in general
    and not necessarily the goals you set back in Exercise 5. That''s because we''re
    going to check out those goals against your values later in this exercise to ensure
    that they are fully aligned.


    Your partner must write down the words that you say and not suggest any answers,
    as these are their own values, not yours. In NLP, the words we are listening for
    are ''nominalisations''. These are abstract nouns, i.e. they don''t refer to objects
    in the real world. For example, the word ''mountain'' is an object that we can
    see and touch. The word ''responsibility'' is a noun that doesn''t refer to an
    object that we can see or touch, and is therefore a nominalisation. Also, listen
    out for answers such as ''meeting new people''. This is not a nominalisation.
    In these cases your partner should ask: ''What does meeting new people do or get
    for in relation to your goals?'' You might then say: ''It gives me personal growth''.
    Personal growth then is the value.

