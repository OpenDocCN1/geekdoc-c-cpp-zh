    Make time work for you, not the other way around.


    Don''t choose to feel stressed unless there''s a very good reason for it. I can
    tell you that I feel far less stressed than I used to. Does that mean that I work
    less or have fewer deadlines?

    Absolutely not!


    Finally, being able to control your emotions and change your state in an instant
    is one of the most valuable lessons I have learnt from NLP. On the rollercoaster
