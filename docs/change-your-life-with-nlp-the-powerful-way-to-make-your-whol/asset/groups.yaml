    C — looking at beautiful scenery. 2

    D — learning more information about a subject interests me. 1


    2. If I agree with you, I''m most likely to say:

    A — that feels right. 3

    B — I hear what you say. 2

    C — I see what you mean. 1

    D — that makes sense. 4


    3. When buying something new, I''m most likely to:

    A — go for what feels most comfortable. 3

    B — react to what is said to me and/or the sounds (if relevant) of the item. 1

    C — choose what looks best. 4

    D — set a strict criteria for what I want. 2


    4. When choosing a restaurant I for a place:

