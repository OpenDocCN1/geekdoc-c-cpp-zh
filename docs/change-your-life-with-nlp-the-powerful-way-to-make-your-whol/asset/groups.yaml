    ## Options/Procedures


    ## Options people


    These people tend to be focused on a goal. They are glass ''half-full'' characters.
    They like to have possibilities and options available to them. They enjoy feeling
    they have a choice about what they do. They are good motivators of other people
    as their enthusiasm is infectious.


    Words and phrases they might use: focus; goals; let''s go for it; there are many
    possibilities; opportunities for the future; choices


    ## Procedures people


    These people don''t feel that they have a lot of choice about how they lead their
    lives. They often feel the weight of the world on their shoulders. They are more
    likely to be glass ''half-empty'' people. They believe they have to do what they
    do -- maybe because of family responsibilities or pressure to follow the family
    business. They may see the risks in things as they like to follow procedures and
    rules.


    Words and phrases they might use: Here are the procedures we need to follow to
    get the best result; Let''s do this in an orderly fashion; I have to do things
    this way


    ## Inferential/Literal (listening style)


    ## Inferential listeners


    They infer things from what is said. They are great mind readers and often jump
    to the wrong conclusions. They also think that any question is a request for action.


    Words and phrases they might use: I thought you wanted me to do something; I thought
    that''s what you meant


    ## Literal listeners


    They take what is said very literally. If you want something done, you would need
    to ask them very directly or they are likely to ignore you. For example, literal
    listeners may not know when an inferential speaker compliments them.


    Words and phrases they might use: If you want me to do something please tell me;
    What specifically do you want me to do?


    ## Literal/Inferential (speaking style)


    ## Literal speakers


    Literal speakers will be very direct, almost to the point of being rude. They
    will find giving feedback easy. They like to come to the point very quickly and
    not mess about with hints and tips. You will always know where you stand with
    these people though you may not like it.


    Words and phrases they might use: this is what you did well; this is what you
    need to improve on; you are not performing as you should because...


    ## Inferential speakers


    These people feel awkward about being too direct. They worry about upsetting people.
    They often waste a lot of time giving ‘hints and tips’ or implying that something
    is wrong. A literal speaker would get very frustrated when communicating with
    an inferential speaker.


    Words and phrases they might use: I don''t like the way they behave, do you? What
    do you think about the latest fashions this year? Have you tried that new deodorant?


