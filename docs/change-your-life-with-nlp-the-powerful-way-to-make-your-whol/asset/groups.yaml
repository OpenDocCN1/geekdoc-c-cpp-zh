    你拥有成功所需的一切


    人们为了实现目标会不断坚持。我们也需要最大限度地利用时间。纠结于时间不够用无法完成所有想做的事情是毫无意义的。我们希望最有效地利用每一个时刻，并享受每一个时刻。

    让时间为你工作，而不是反过来让你为时间奔命。


    除非有非常充分的理由，否则不要选择感到压力。我可以告诉你，我现在的压力比以前小得多。这难道意味着我工作得更少了，或者截止日期更少了吗？

    完全不是！


    最后，能够控制自己的情绪并在瞬间改变状态，是我从 NLP（神经语言语言程序）中学到的最有价值的教训之一。在追求目标的“过山车”上，你必须能够应对顺境和逆境。顺境很容易处理，因为那是好消息。但如果你也能应对挫折、保持积极、汲取教训并尽可能地前进，那将是无价的。而且，要用最有资源的方式来处理一切。享受在每天的每一小时中发挥最大的自己。


    提示：下一次当你感到压力时，放松下来，将自己回到一段积极快乐的记忆中。数到10，然后重新开始！


    # 第9章


    > “当你想要被他人尊重时，你必须学会先尊重他们。”

    Sathya Sai Baba


    ## 以诚信产生影响力


    要在世界上真正取得成功，能够与他人合作并通过他人工作至关重要。你不太可能完全靠自己实现目标。本章将介绍如何以诚信影响他人，这是 NLP 的核心元素，例如 NLP
    的假设、感知敏锐度、同步建立、沟通风格和眼动模式。


    关于 NLP，我收到的最多的问题是它是否具有操纵性。我经常向提出这个问题的人提出挑战：是否没有任何销售人员接受过“操纵性”技巧的培训？当然有。许多工具和技术都有被用于操纵的潜力——有很多拥有巨大销售目标的销售人员被教导要不计代价地销售，无论客户是否需要这些商品。我同意
    NLP 中确实存在这种潜力。区别在于你如何使用所学的工具。这就是为什么本章题为“以诚信产生影响力”。操纵与影响之间的区别其实很简单。这取决于你的**意图**。如果你专注于“双赢”局面，这怎么可能是操纵呢？你获得了结果，对方也同样。如果我使用我的
    NLP 工具箱来协助客户实现他们想要的结果，这算操纵吗？在获得许可的情况下，我会竭尽全力协助他们。我认为这是我的工作。同样，如果我的目标是建立一家成功的 NLP
    培训公司，并且向那些告诉我需要我服务的人销售——这算操纵吗？如果在那种情况下我没卖掉，那么别人就会！Genie Z. Laborde 说：


    # 用 NLP 改变你的生活


    > 一旦你知道如何明确自己的欲望（或结果），你就可以使用相同的技术来明确沟通中涉及的任何其他方的。在实现自己目标的同时实现对方的目标，这就是我所说的以诚信影响。


    相反，以牺牲他人为代价实现你的目标就构成了操纵。例如，为了达到每月销售目标，向可能可能不需要你服务的客户不计代价地销售就是操纵。例如，几天前我联系了一家修理询问我在网上看到的一辆车。销售员立刻告诉他认为那辆车卖掉了。几分钟后，他又来告诉我一个好消息……车还在，因为之前的交易失败了。我很有兴趣地观察了这一点，并注意到它对我产生的影响……那时他完全没有问过我的任何要求，而我已经感到松了一口气，因为一辆我甚至不确定是否想要的车！


    相比之下，通过向想要你的服务并能从中获益的客户达成销售目标，是以诚信产生的影响。这就是区别。


    ## 如何建立成功的关系


    我们已经探索了 NLP 的几个假设，例如“没有失败，只有反馈”以及“我们都拥有成功所需的资源”。现在我们将探索更多这类假设。当我学习成为 NLP 执业师（Practitioner）时，我发现“NLP
    假设”对于改变我与他人的关系方式至关重要。它们设定了其他 NLP 工具使用的背景。然而，这些假设的一个奇特之处是，Bandler 和 Grinder 并没有发布一套确定的设定。它们更多是作为
    NLP 的底层原则浮现而出的，并由其他 NLP 开发人员（如 Robert Dilts）明确化。因此，你发现在文献中存在差异，而这本书也不例外！根据 Toser
    和 Mathison 的说法，其中很少几个似乎是 NLP 的原创创造；许多来自其他领域，如控制论。我选择了那些认为在与他人合作中对我帮助最大的假设，特别是在建立关系方面帮助最大的的。这些假设成功地改变了我关于沟通方式的信念系统，并且它们有潜力改变你。我将它们应用于我的工作中，尤其是关系建立。我将它们重新命名为“沟通者的信念”，因为它们能赋予我们力量，让我们更好地理解行为。


    # 沟通者的信念


    | 信念 | 含义 | 在我们的目标中 |

    | :--- | :--- | :--- |

    | 1. 每个人都有不同的世界模型。 | 我们都是独特的 | 这有助于我们变得更加灵活和包容。 |

    | 2. 沟通的意义在于你得到的反应。 | 我们的沟通是成功的 | 我们需要尝试不同的方法。 |


    # 用 NLP 改变你的生活


    3. 没有失败，只有反馈。


    我们从所有的经历中学习。如果我们把错误解读为失败，我们就会感到挫败；如果我们把错误解读为学习机会，我们就会继续进步并更快地迈向目标。


    4. 人根据他们拥有的资源尽力而为。


    当我们采取行动时，我们会做出最好的选择。一旦我们意识到这一点，它允许我们不再后悔并原谅他人。


    5. 灵活性最强的人将获得最多。 | 如果你没有得到结果，就继续尝试不同的方法。通过经常练习书中的概念，你将提高你的思维和灵活性。


    6. 所有行为背后都有积极意图。 | 为什么人们会这样做？所有的行为都源于执行者的积极意图。这并不意味着它对受行为影响的人一定也有益。 | 我们可能不同意这种行为，但如果我们寻找行为背后的积极意图，这允许我们在反应时做出选择。


    # 以诚信产生影响力


    7. 我们控制自己的思想，因此控制了结果。


    我们对想法有选择，并且知道思想影响结果。因为结果取决于心理状态，我们希望处于实现目标的状态。我们可以通过改变想法来改变状态（详见第 4 章）。


    8. 我们拥有成功所需的所有资源。


    人们有能力成为他们想要的任何样子。我们所有人都有尚未开发的品质、技能和态度储备（详见第 8 章）。最大化这些资源将帮助我们更快实现目标。


    9. 反抗是缺乏同步的信号。


    当你与个人或群体沟通时，他们的任何反抗都是提示你需要与他们建立更好的同步关系。与其指责对方“不感兴趣或无聊”，不如利用在本章中将学的同步技巧来重新回到正轨。

