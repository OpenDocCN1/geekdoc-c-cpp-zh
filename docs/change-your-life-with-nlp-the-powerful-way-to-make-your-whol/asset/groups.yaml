    让我们亲自体验一下。想象你正在见你的老板讨论年度考核。这份工作对你来说非常重要，因为你有一些债务要还，而且这是你第一次获得成功的长期职业的机会。首先，我希望你关注在非常焦虑和担心上，担心你将得到负面评价，这可能会破坏你在该职位上的长期成功。你一直担心这次会议，因为这个原因一直睡得不好。你感到压力很大，必须在会议中获得良好的结果，因为有太多的事情取决于此。


    现在，在脑海中保持这个内部表征，以及相关的画面、感觉、声音和想法。


    当你跨进老板办公室的门时，写下这将对以下产生的影响：


    - 你的思想

    - 你的情绪

    - 你的身体姿态

    - 你的行为

    - 你的结果。


    清除屏幕。这一次我希望你关注对自己在新工作中迄为止取得的结果和成功感到非常自信。这次会议是你现在与迈向下一个水平之间的一小步。你完全坚信会议将会顺利，并且将得到你想要的。


    现在，在脑海中保持这个内部表征，以及相关的画面、感觉、声音和想法。


    写下这将对以下产生的影响：


    - 你的思想

    - 你的情绪

    - 你的身体姿态

    - 你的结果。


