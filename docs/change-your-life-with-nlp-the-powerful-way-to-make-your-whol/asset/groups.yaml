    # 你到底想要吗？还是不要？


    关于我的书，我们共同梳理了我想想要传达的核心信息。从那时起，我们每周都会根据我最初设定的目标和时间表来回顾我的进展。我知道，这帮助我规避了冗长而痛苦的重写。


    你也可以为自己找一个教练。“教练（coach）”和“导师（mentor）”这两个术语经常被混淆。导师是一个专家，有时说话非常直截了当。相比之下，教练是一个专家级的引导者，他们通过向你提问，直到你自己得出答案。如果你希望有人能帮助你保持正轨，并协助你打破拖延和缺乏自我信心的旧模式，那么教练可能更适合你。当我需要发现并突破关于自己的局限性信念并改变旧策略时，我的生活中也用过教练。教练真的可以帮助你变得更具自我意识。


    最后，寻找一个卓越的典范。我已经在书中提到过，找到一个已经实现了你想要实现的目标并发现他们是如何做到的，是多么的无价。你通过模仿他们的信念、策略，以及他们如何运用身体（在模仿运动员时尤为重要）来做到这一点。在神经语言程序（NLP）的术语中，我们会说模仿他们的：


    - 内部过程，或者他们是如何做事情的

    - 内部状态，或者他们为什么要这样做。

    - 外部行为，或者他们做了什么。


    给自己留出反思的时间。我的信念是，尽可能地了解自己以及我们运行的模式和信念，我们绝对从中受益。与他人合作并花时间进行反思将让你成长和发展。记住：没有失败，只有反馈。下次当你处于一个重要的情境时，花些时间将这些收获联系起来。如果可能，请教练协助你。在头头脑脑地冲向同样的挑战之前，花出这段时间。给自己留出这种空间，并给予它应有的重视。


    # 成功原则


    我们快要结束了，我还有几句话想对大家说。首先，我想总结一下我们在书中讨论过的关键原则，并建议你记住它们，并将它们作为你成功的蓝图。当你遵循这条道路时，你将会成功，并记住一直坚持下去直到实现目标。


    # 原则 1 – 明确你的目标


    回顾你在本书开始时设定的最大目标。反复检查它是否真的能激励你。现在检查你的目标是否是具体的、可衡量的、可实现的、现实的且有时限。关注你的目标。记住，你在生活中把注意力放在什么上，什么就会变得更强大。


    # 原则 2 – 知道为什么它是必不可行的


    你想实现这个目标的原因是什么？问问自己：“如果我现在不做，最终会付出什么代价？”确保你的目标是为了你自己，而不是为了别人去实现它。


    # 原则 3 – 采取巨大的行动


    你准备好为了实现目标而付出任何努力，包括那些你不想做的事吗？回顾你的个人行动计划。今天迈出一小步和一大步，开始向你的目标移动。挑战自己，问问自己是否对你的目标承担了个人100%的责任。你是你目标的起吗？因为，在你不是原因的范围内，你是否正在交出你的个人力量。


    # 原则 4 – 知道你正在得到什么


    非常清楚什么有效，什么无效。寻求反馈，并不断评估你的方法。将反馈看作一份礼物，并记住从任何不按计划的行动中学习。


    # 你到底想要吗？还是不要？


    # 原则 5 – 准备好改变你的方法


    我们遇到过一种说法：“如果你总是做过去做的事，你永远只能得到过去得到的东西！”你必须准备好保持灵活，进入未知。安全感是对已知的执恋，而已知的是我们的过去。那里没有进化。当你经历不确定性时，你正处于正确的道路上——如果你过于执着于如何实现目标，你就会排除整个范围的可能性。


    # 原则 6 – 向那些已经成功的人寻求帮助


    在做出重大的生活改变时，生活中最成功的人会模仿那些已经“做到了”的人。他们通过参加课程、接受教练或简单地寻求建议来这样做。你可能会发现，在适当的支持下，你会发现改变的过程更加愉快，你成功的机会将大大增加。


    我能给你的已经不多了。不过，我开发了一个轻松的趣味问卷，旨在发现你在阅读这本书期间改变了多少，以及你对追求自己想要的东西有多大的决心。我建议你将结果作为个人反馈，了解在你开始改变之旅时你所处的位置，以及你需要去哪里。玩得开心，享受并从结果中学习。


    ## 我的结语


    ### 练习 32

    “你到底想要吗，还是不要？”测试

    1. 你的朋友描述你为：

    a. 坚定的 ✓

    b. 反反复常的

    c. 谨慎的

    d. 关注他人的。


    # 用 NLP 改变你的生活


    2. 你中了 50,000 英镑。你会：

    - 投资于你的未来计划？

    - 花去买你最爱的车？

    - 存入合作社账户？

    - 捐给慈善机构？


    3. 当你有对你来说重要的计划时，你会：

    - 一直思考它们？

    - 发现你的动力水平在波动？

    - 关注所有的风险？

    - 打电话给朋友寻求帮助？


    4. 你收到当地健身房的一年免费会员作为礼物。你会：

    - 养成习惯并定期去健身

    - 发现无法养成习惯，因此你的访问次数减少了？

    - 担心你是否应该接受这份礼物？

    - 把它送给朋友？


    5. 你的爱人甩了你。你会：

    - 想出下次需要做哪些不同的改变？

    - 归怪他们的一切？

    - 假装无其发生？

    - 让你的朋友从你的经验中获益？


    6. 当你想要时，你相信你真的能得到多少？

    - 绝对

    - 有时候

    - 太焦虑而无法完全投入

    - 在回答之前与他人讨论。


    7. 你刚刚遇到了梦中情人并坠入爱河。唯一的问题是，他们住在国外。你会：

    - 寻找一种在一起的方法？

    - 不知道是否应该保持联系？

    c. 觉得整个想法非常危险？

    d. 甩掉他们，因为你需要回家喂你朋友的金金鱼？


    8. 当有人向你寻求反馈时，你会：

    a. 乐意提供？

    b. 找借口避开那个时刻？

    c. 仅仅是想想就会非常焦虑？

    d. 担心你可能会伤害他们的感情？


    9. 在工作中，你被要求承担一项艰难的新挑战。你会：

    a. 立即说“好”，并对前景感到兴奋？

    b. 要求两周时间考虑一下？

    c. 拒绝，因为你还了解不够？

    d. 告诉老板把这个机会给给你最好的朋友，因为她比你更有能力？


    10. 当你需要帮助时，你会：

    a. 主动寻找谁可以协助你？

    b. 询问你认识的每个建议？

    c. 担心保密性？

    d. 找一个你可以帮助的人来让你感觉好受？


    计算你选择每个字母的次数，看看下方的结果如何描述你。


    最高分“A”最多 – 恭喜你——你真的想要！当你决定离开“灰色地带”时，你充满了动力和热情。你把精力集中在你想要的事情上，并对发生在你身上的一切负责。你有坚强的自我信念和自信。无论发生什么，你都能保持动力，并且你拥有乐观和意志力带你通过。无论你设定什么目标，你都会成功。好运，记住永远留在擂台上。


