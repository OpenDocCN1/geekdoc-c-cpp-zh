    The specific skills for receiving feedback are as follows:


    +   - Listen carefully and keep an open mind. You cannot make judgements on the
    validity if you have a closed mind.

    - Suspend judgement. Do not put up your defences; rather take your time and make
    some mental notes to check out later.

    - Let the giver finish. Wait until they have got to the end and you have a full
    picture.

    - Paraphrase to check out you have heard and to clarify your perception.

    - Ask for specific examples if they are not given.

    - Avoid arguing, denying, justifying and minimising. It’s their point of view.
    Decide what you want to do with the information. Look for patterns with other
    feedback you received before.

    - Respond in a way that presupposes acceptance, saying things like ‘In what ways
    do I do this?’ and ‘What effect does this have on you?’.

    - Gather information from other sources.

    - Decide what you want to do. Think about how you can use the information to improve
    the results. Imagine yourself having taken on board the feedback and now behaving
    in a way that demonstrates you have done so.

    - Thank the person for giving you feedback.


    The ultimate measure of the success of either giving or receiving feedback is
    that you or the other person integrates the learning from it.'
