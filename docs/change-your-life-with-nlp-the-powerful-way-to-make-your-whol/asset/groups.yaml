    # WHAT WOULD YOU DO IF YOU KNEW YOU COULDN''T FAIL?


    This should be your ideal relationship, not the way it is at the moment. You then
    brainstorm with yourself or, even better, ask someone else to work with you on
    this. You just keep asking yourself the same question. Once you run out of ideas,
    list them in priority order – you may be surprised about what comes up. You can
    do this for any area of your life (see The Wheel of Life on page 32 for other
    ideas). We''ll learn more about our values in Chapter 5.


    The moral is when setting personal goals, it''s vital to choose a goal that you
    have a burning desire to achieve for yourself, that meets your personal values.
    Napoleon Hill talks about this in his classic book Think and Grow Rich. Although
    the goal on which the book focuses is making money, the principle applies equally
    to achieving any other sort of goal. Napoleon Hill says the first step towards
    riches is desire. Whatever goal you choose, make sure you have a burning desire
    to achieve it.


    # How do you set goals?


    As well needing goals to be compelling, a goal is best stated simply and according
    to the principles of the ubiquitous SMART objectives. These principles were originally
    taken from Paul J. Meyer''s book Attitude is Everything. They are not traditional
    NLP principles but I use them as they are the best way I found to set up goals
    in a way that makes them easier to achieve.


    +   Specific – goals should be straightforward and emphas what you want to happen.
    Specifics help you to focus your efforts and clearly define what you are going
    to do. For example, instead of setting a goal to lose weight or be healthier,
    set a specific goal to lose two centimetres off your waistline or to walk five
    miles a day.


    +   Measurable – if you can''t measure it, you can''t manage it. Choose a goal
    with measurable progress, you can see the change occur. For example, ‘I want to
    write one chapter day for my book’ shows the specific target to be measured.'
  - '[PAGE 49]


    CHANGE YOUR LIFE WITH NLP


    +   - **Achievable** – all your goals should be achievable, which means they should
    be within the bounds of possibility for you. For example, it is within the bounds
    of possibility that I can win the London Marathon this year. That is because I
    have two legs, I can run and enjoy training. In NLP we say that the ‘A’ also stands
    for ‘Acting as if’, the theory that we will know all we need to know. If we begin
    to ‘act as if’, our minds believe it to be real – that’s why visualisation is
    very powerful in sports coaching.


    +   - **Realistic** – this provides the check on achievable. It may be possible
    for me to win the London Marathon but it is realistic? Realistic, in this case,
    means ‘do-able’. It means that the learning curve is not a vertical slope; that
    the skills needed to do the work are available. Set the bar high enough to find
    out what you are capable of but not so high that you will frustrate yourself when
    you never get there. Remember the elastic band. Focus on the inspirational, not
    the sensible!


    +   - **Timed** – set a time frame for the goal: for next week, in three months,
    five years, etc. Whatever fits your goal. Putting an end point on your goal gives
    you a clear target to work towards. If you don’t set a time, the commitment is
    too vague. It tends not to happen because you can start at any time. Without a
    time limit, there’s no urgency to start taking action now.


    # # Your Wheel of Life


    If you are not sure yet the Wheel of Life you want to focus on, use the Wheel
    of Life opposite to identify the areas of your life that are currently out of
    balance. The wheel contains the key areas of our lives – career, family, relationships,
    personal development, health and fitness, and wealth. These areas need to be in
    balance to achieve harmony and success. If one or more areas are out of balance,
    we are likely to be in the Grey Zone and suffering some stress.'
