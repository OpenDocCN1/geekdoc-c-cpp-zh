    # CHANGE YOUR LIFE WITH NLP


    # Words


    Finally, let''s discover how to match words. There are a number of things to listen
    out for. We''re going to re-visit our communication styles that we discovered
    in Chapter 5 and learn how to match the different styles that people use. In addition,
    listen out for any key words that person uses over and over again. Start to use
    them in your own language. For example, if someone uses the word ''absolutely''
    a lot, start to use it when you are speaking to them. Also, listen out for common
    experiences, interests and values that you share and bring them into the conversation.
    Don''t pretend though – there''s too high a risk that you''ll come unstuck! Also,
    notice the content chunks they use, i.e. do they use short or long sentences?
    Modify your content chunks to match theirs.


    # Learning to speak a new language


    Please go back to Exercise 11. Which communication styles were your most and least
    preferred? Do you notice that you often use the literal words of your style? For
    example, what style of person would use the word ''feel'' in their language? The
    really clever thing is that you can begin to spot other people''s communication
    styles from the words or predicates that they use. Appendix 2 lists examples of
    the types of words and phrases each style will primarily use. These words reflect
    whether they are thinking using their visual, auditory, kinesthetic or audio systems,
    and this gives you an insight into how their brain is sorting information at the
    time. You can''t tell what a person is thinking but you can have a good idea how
    they are thinking! For example, visual people will use words like ''see, clear,
    illuminate,'' etc. and phrases like ''I can see that''. They are literally telling
    you that they are making a picture in their minds. A kinaesthetic person will
    use words like ''feel, touch, grasp'' and phrases like ''that feels good to me''.
    An auditory person will use words like ''hear, listen sounds'' and phrases like
    ''that sounds good to me''. An audio digital person will use words like ''sense,
    think, experience'' and phrases like ''that makes sense to me''.'
  - '[PAGE 178]


    # INFLUENCING WITH INTEGRITY


    By listening to the words someone uses, you can begin to identify their preferred
    style. This, added to spotting the characteristics we discussed earlier in Chapter
    5, will make it very easy to identify the style of the person you are communicating
    with. It''s that simple—listen for the words which indicate in what sense the
    person is thinking, and adjust your communication style to match. Miscommunication
    comes from people mismatching the style of the other person. That breaks rapport.
    Using the same language will build rapport very quickly. For example, if you keep
    using auditory words to a visual person, they will unconsciously translate internally
    to their own system. This time can, be difficult for some people, and does not
    build rapport. You will find that you get along naturally more easily with people
    who have the same preference as you. If you have a challenge in some of your relationships,
    you may have been unknowingly breaking rapport until now!


    # Exercise 27


    Speaking off by picking a significant person in your life and listen to the types
    of words they use. You will notice they will probably use all types of the visual,
    auditory and kinaesthetic words... but one type will predominate. Observe their
    physical characteristics too. What do they tell you about their most likely preferred
    style? When you add their words together with their physiology you have a very
    powerful tool for building rapport. Practise translating your language to match
    their preferred style. You may find that translating into a language that is your
    least preferred style is the biggest stretch for you. It means it''s the one you
    need to practise most. The great thing is that it doesn''t matter if you get it
    wrong as you''re no worse off than when you didn''t know about this stuff! You
    can use your sensory acuity to notice when they begin to lose interest... that''s
    a sure sign you need to pick another style and experiment with that. You''ll know
    when you have their attention they will be really engaged in what you have to
    say.'
  - '[PAGE 179]


    # CHANGE YOUR LIFE WITH NLP


    For example:


    If they say ‘I don’t see your point’, don’t say, ‘Let me help you understand.’
    Say instead: ‘Let me show you what I mean’.


    If they say, ‘What you’re suggesting doesn’t feel right to me’, don’t say, ‘I
    think it makes perfect sense’. Say instead: ‘Let’s get a handle on the points
    in another way’.


    If they say ‘I’ve stopped listening to you’, don’t say, ‘You’re insensitive.’
    Say instead: ‘Let’s talk it through.’.


    Then practise with those around you, and listen to conversations on radio or television
    to develop your skills. Before long, you will find yourself doing it automatically.


    # Jamie and Julie – practice makes perfect


    Jamie had recently moved in with his girlfriend and was struggling with the way
    they were communicating. It felt like they were speaking different languages at
    times. So much for the language of love! A typical argument was about the state
    of the house. It would go something like this:


    JAMIE: I can’t see all the fuss is about. I’ve only asked you to keep the house
    clean and tidy.


    JULIE: That’s right, it’s obvious you’re feeling bad about it but for me the house
    doesn’t feel comfortable when it’s tidy. Why are you so pushy about it all the
    time? I didn’t grasp that living together would be like this.


    After Jamie learned about different communication styles it was like a light bulb
    coming on. He realised that his preference was a visual one and Julie’s was a
    kinaesthetic one. He started to translate her language like this:


    I really want to get in touch with how you feel about this. Please help me get
    a handle on it. How can we find a solution that we both feel great about?'
  - '[PAGE 180]


    Once Jamie had better rapport with Julie, he could find ways of expressing himself
    that she emphasised with. Their relationship rapidly improved and got even better
    when Jamie shared what he knew with Julie so she could use more visual language
    to match his.


    We have now learned how to build rapport using physiology, tonality and words.
    Now it''s time to start practising. By practising consciously, you''ll find that
    you begin to do things unconsciously. You may be surprised to notice how much
    you''ve learned and are already using. These skills are available to improve all
    key relationships in your life.


    # NLP eye patterns


    In the weeks following the discovery of representational systems (or communication
    styles, as I''ve called them), and Grinder discovered something else that was
    quite extraordinary. They discovered that there was a specific eye movement linked
    to each of the different communication styles. There are few patterns of NLP that
    can be claimed to be totally original (as opposed to modelling of world-class
    behaviour), the discovery of eye movements is one such pattern. Grinder describes
    how they were ''astonished by the regularity and obviousness of the associated
    eye patterns''. They coded their independent observations into what has now become
    known as the NLP ''funny face''.


    ![](img/28d67ab57ddbf33d989344b5416e1e3f_180_0.png)'
  - '[PAGE 181]


    # CHANGE YOUR LIFE WITH NLP


    These are the eye patterns of a ‘normally’ organised person as you look at them.
    They are independent of language and culture. Occasionally, people are reverse
    organised, i.e. their patterns are a mirror image of those shown above. Here''s
    how it works.

    When you:


    +   - look up and to your left, you are remembering an image of something from
    the past, e.g. your favourite holiday as a child;

    - look up and to your right, you are imagining or constructing an image of something,
    e.g. imagining what you would look like in that new suit/dress;

    - look across and to your left, you are remembering a sound from the past, e.g.
    your favourite track;

    - look across and to your right, you are constructing a sound, e.g. hearing you
    singing your favourite track;

    - look down and to your left, you are talking to yourself or working out a logical
    calculation or generating a set of logical criteria;

    - look down and to your right, you are into your feelings, e.g. you are feeling
    happy about something.


    Exercise 28

    Seeing magic

    Here is a set of questions that will help you to spot the eye patterns of another
