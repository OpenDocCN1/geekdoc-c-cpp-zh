    乔普拉（Chopra）说，“截止日期”（deadline）这个词包含了“死亡”（dead）这个词，这并非巧合！你注意到某些人对时间压力比其他人敏感得多吗？有些人因此焕发，另一些人则感到受到威胁。在商业中，设定紧迫的截止日期通常是我会描述的一种“大男子”行为，截止日期往往是人为设定的，并且比实际需要的要早。我在工作的咨询公司经历过很多次。通常，项目的截止日期在达成时，并没有考虑截止日期对需要交付工作的项目团队的影响。而且，有时交付团队发现，客户其实可以接受更长的交付周期。


    我们都知道有些人被困在特定的时间框架内——他们困在过去他们无能为力的过去，或者专注于对未来感到焦虑。我们认识有多少人困在过去，浪费了这么多能量，对早已过去的事物感到内疚，或者后悔本可以采取不同的行动？或者人们因为太担心几周后才会发生的事情而破坏了当下？我们可以得出结论：我们对时间的体验完全取决于我们在此时或当下的心理焦点，而这是可以改变的。


    ## 活在当下


    唯一的时间是**现在**。唯一的时间是现在，所以你能够以一种更平衡、更有活力的方式生活。时间是现在。我们对时间的体验完全取决于当下，这是可以改变的。停留一下，看看我们是否在享受每一分钟。专注于重要的事情是否会让你感到悲伤。


    通过神经语言程序改变NLP


    ## 练习 21


    ## 享受你的时间


    这是一个为期两周的改变时间体验的实验，所以请坚持下去。在接下来的一周里，每天记录一下你当天如何体验时间。例如，你可能会发现：


    - 享受时间

    - 感到放松

    - 处于时间压力之下

    - 一天不够用

    - 感觉时间飞逝

    - 专注于重要的而非紧急的事情

    - 或任何其他体验


    第一周后，你会更熟悉自己目前如何体验和管理时间。在第二周，尝试改变一些事情。例如：

    - 专注于重要的而非紧急的事情

    - 停止浪费能量在过去或提前担心未来

    - 在当下投入100%的能量

    '
