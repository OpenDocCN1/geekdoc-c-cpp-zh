  - '[PAGE 32]


    Over the years I have also been given many excuses (sorry, rea- sons!) by my clients
    for staying in the Grey Zone. Here are the most common ones:


    +   - I''m not good enough to get what I really want.''

    - ''I can''t risk giving up a good salary.''

    - ''I won''t get another job very easily.''

    - ''It''s too late for me to change now.''

    - ''No one will listen to me.''

    - ''It''s better to stay with my partner rather than be on my own.''


    Do these sound familiar to you? Be honest with yourself.


    # Paul – putting responsibility above happiness and fulfilment


    I met an old friend recently who had just retired after spend- ing his whole life
    in the insurance business. As I congratulated him on the 40 years he had spent
    dedicating his life to the same company, I noticed him hesitate slightly as he
    looked away for a moment. When his eyes returned my gaze, I saw what could only
    be described as a look of disappointment as he told me that he had never intended
    to stay in his job for so long. It had been his father who had encouraged him
    to go into the insurance busi- ness in the beginning as it was seen as a ''steady''
    job. He, on the other hand, had never enjoyed the sales part of his role as he
    was quite shy and reserved person. I wondered why he had never pursued a job that
    suited him more and I asked him what had prevented him from changing careers once
    he discovered that insurance was not for him. He shifted around uncomfortably
    on the spot before telling me that he had too many respon-ibilities in his life
    to be able to do what he really wanted to do for himself. I asked him if he told
    his family about how he truly felt about his insurance job. He replied that he
    had kept his dreams to himself and had gone about his work as cheerfully as possible
    over the years. I felt a sense of loss and waste on his behalf as I walked off
    the road.'
