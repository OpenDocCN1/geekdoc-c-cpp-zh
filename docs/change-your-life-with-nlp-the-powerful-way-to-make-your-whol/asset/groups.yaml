  - '[PAGE 200]


    # Get started


    # Your moment of truth


    You have the power to control what you think, you have the power to control how
    you feel and you have the power to control what you do. Now it is your moment
    of truth because it''s time to take action. You decided that you want more from
    your life. You''ve worked on your goals and I''ve assisted you with the mindset
    and beliefs you need for success. Now it''s your time to go for it. Some of you
    may be starting to feel a little unresourceful as we get down to your personal
    moment of truth and that''s normal. Recognise where you are and where those feelings
    are coming from. If you need to work more on your mindset, then do it now because
    we''re about to rock and roll!


    And, I have to let you into a secret that successful people already know – one
    of the biggest myths is that it takes a superhuman act to achieve our goals. It''s
    not just the case. It''s the small decisions that we make that affect our destiny
    as much as the big ones. If we make enough small decisions then we will get there.
    I once asked my teacher:


    > ‘What''s the secret of achieving your goals?’


    I still think about his answer at least once a day. He said:


    > ‘Keep going until you do!’


    It is a remarkably simple and very wise statement that has guided me through big
    life challenges. Stick with it and you will always achieve your goal. Last Christmas,
    there was a joke that one of my children read out of their cracker at the dinner
    table. It said:'
  - '[PAGE 201]


    # CHANGE YOUR LIFE WITH NLP


    ‘How do you eat an elephant?''


    The answer was:


    ‘In small chunks.’


    It''s the same for your goals. Each time we make a decision begin to create our
    future in advance and each time we take a decision there are consequences. It''s
    important to think these through and know that you cannot plan for every eventuality.
    It''s impossible. You jump off the edge of the cliff, have faith and learn as
    you fly.


    > Have long since come to believe that people never mean half of what they say,
    and that it is best to disregard their talk and judge only their actions.

    Dorothy Day


    When I set up my business I read all the management books, and I had done my NLP
    training that taught me if you are willing to do whatever it takes to achieve
    your goals you will get there. I had complete belief that my business would be
    a success because I believed myself to be good at what I do as a trainer, consultant
    and coach. I believed that I would be able to grow a successful company on these
    competencies. I planned everything I could think of – website, brochures, networking,
    offices and venues.


    So, when I had to postpone my first course I was bitterly disappointed. Why? Because
    I soon discovered that not only did I need to be a world-class trainer and coach,
    I also needed to know how to grow a business and be a successful businesswoman.
    While I was great at training, I was rubbish at marketing, sales and financial
    management. All important qualities when you run a business. That came as a shock
    to me and I had to buy in or develop these competencies very fast. I decided that
    I would get part-time assistance to set up and run my financial systems and marketing
    and I knew I needed to get much better at selling myself. So I began to find great
    sales-people and successful entrepreneurs to model. The important'
  - '[PAGE 202]


    # GET STARTED


    thing was that I was taking action – sometimes that felt like two steps forward
    and one step back, but it doesn''t matter as long as you are moving ahead.


    Our society is used to instant gratification through the web, emails, text messages
    and TV. Yet, we need to have a long-term focus if we are really to succeed. For
    example, if I had taken a short-term view after I postponed my first training
    programme, The Change Corporation may have ceased to exist and then never. Take,
    simple steps and when things don''t go to plan the learnings and work out what
    you need to do differently next time.


    If you take no action, then nothing will change. I''m reminded of a trip to MFI
    that I made two years ago because I wanted some new bookshelves for my study at
    home. I had seen the ones I wanted and was delighted after Christmas were in the
    sale. I bought two small bookshelves and discovered when I went to pay for what
    they needed to be put together at home. In other words, they were flat-packed.
    I was rather disappointed to find out that and and, of course, explained why they
    were cheaper than some of the other styles. Anyway, I didn''t have enough cash
    flow at the time so I bought them and proceeded to take them in the back of my
    car. Even hauling the two large boxes in and out was a real effort. I put these
    boxes in the back of my garage where they were out of the way. Two years later
    I hadn''t opened the boxes and in the end I took them to a car-boot sale and sold
    to a DIY enthusiast.


    That''s what it''s like if you take no action after reading this book. It''s like
    having all the secrets to success in a flat-packed furniture box waiting for the
    day you will have the motivation to get started. And, the longer you leave it,
    the less likely it is that you need to take. We learnt earlier about German physicist
    and Nobel Laureate, Werner Heisenberg, proposed in 1927 that 100 per cent certainty
    does not exist. Therefore, if you wait for 100 per cent before you take any action,
    you will never move forward. Successful people know they will never know everything
    and they go for it anyway. That''s my saving grace in tight situations, that and
    ''acting as if.


