    in the direction of the Brilliant Zone because it feels exciting, motivating,
    exhilarating and stretching. These are our moments of optimal experience. In my
    experience, the journey towards the Brilliant Zone is not about the passive, receptive,
    relaxing times, although such experiences are great if we have worked hard to
    attain them. Instead, the best moments are when our bodies and/or minds are stretched
    to their limits to achieve something difficult and worthwhile. The difference
    is that these are the experiences we make happen.


    Those with courage move out of the Grey Zone and towards the Brilliant Zone. And,
    anyone can achieve this. In fact, it’s already too late for you because you know
