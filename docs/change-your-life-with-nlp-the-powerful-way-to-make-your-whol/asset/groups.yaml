    goes back into the same place ever again. Once you learn something new, you can''t
    unlearn it. If you read this book and do the exercises in it, I guarantee that
    you and your life will never be the same again.


    Before we go any further, I have a question for you:


    Are you prepared to step up to what you really want in life? To be the person
