    # The link between mind and body


    Over the past 30 years, scientists have discovered an undeniable link between
    the mind and the body. The vehicle that the mind and body use to communicate with
    each other is the chemistry of emotion. The chemicals in question are molecules,
    short chains of amino acids called peptides and receptors, that are believed to
    be the ''biochemical correlate of emotion''. The peptides can be found in your
    brain, but also in your stomach, your muscles, your glands and all your major
    organs, sending messages back and forth.


    Our cells are eavesdropping on our thoughts every second of our lives. Our emotions
    have a deciding influence on our health as the neuropeptides and their receptors
    are in constant communication with the immune system. Viruses use the same receptors
    to enter the cells, as do the neuropeptides release when we are experiencing elevated
    moods. Is this the reason why depressed people have a tendency to get sick more
    often whilst those who are happy and relaxed stay healthy? That is why if we are
    feeling sick and have taken to our bed, and then the person we''ve fancied for
    months and calls us out, within minutes we are in a different emotional state
    and ready to go out? It''s because the neuropeptides flood the virus molecules
    and release energy that help us to feel much better. It


