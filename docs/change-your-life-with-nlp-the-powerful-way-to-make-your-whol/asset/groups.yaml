    ## 第一章


    “卓越的科学与改变的艺术”


    ## NLP 能为我做什么？


    这本书关于如何利用 NLP 技术来改善你的生活，实现你想要做的改变。让我们先快速了解 NLP 到底是什么以及源于哪里。20世纪70年代初，语言学家约翰·格林德（John
    Grinder）和数学家理查德·班德勒（Richard Bandler）发现了一些优秀的沟通者和个人改变技术专家。


    他们提出的问题是：“仅仅合格的人与在同一技能上表现卓越的人之间有什么区别？”这个问题的答案产生了 NLP：卓越的科学……改变的艺术。


    他们观察了许多世界级的表演者（包括著名的心理治疗师），并发现了使他们获得成功的信念、心态和策略。他们探索了个人和职业工作，发现了能够带来快速且持续效果的工具和技术。因此，他们将这些改变技术正式命名为“神经语言程序”（Neuro-Linguistic
    Programming），简称 NLP，用以象征大脑、语言、身体与所取得的结果之间的关系。由于这些建模技术，NLP 通常被描述为一种逆向工程。


    与其他那些告诉你你需要做什么的方法不同，NLP 是一项“如何做”的技术。它告诉并展示如何成为你想成为的人，拥有你想要的东西，做你想做的事。这是一个令人陶醉的结合。这意味着现在就可能获得你想要的个人成功。对于大多数人来说，事情发生了，他们只是做出反应。NLP
    提供了一种更好的方式。它给你工具让你通过选择做出不同的反应，对自己的思想、情感和行为更有觉察。然后，你就准备好对自己生活中所有领域负责了。


    ## 用 NLP 改变你的生活


    NLP 提供了一系列工具和技术，帮助你处理无用的思维和行为模式。尽管 NLP 中有很多技术，但你只需使用其中一种就能产生惊人的变化。想象一下，读完这本书你将取得多少成就！让我们逐查看
    NLP 的每个部分，我将解释它们的具体含义。


    ### 神经 (Neuro)


    神经关于我们的思考——或者说我们的思想。

    Neuro 的意思是“我们脑子里发生的事情”。我们每天有超过 6 万个想法。这些想法构成了我们内在的图像、声音和感受的世界。这就是我们在内心（手心出汗、呼吸加速、恐慌等）中进行的对话、对交流或争论。大脑学习得很快，每当一个人面对相同的刺激时，他们的身体就会产生相同的反应。令人惊讶的是，患有恐惧症的人永远不会忘记产生这种反应。这是一个完美的一次性学习策略！通常，像恐惧症一样，你运行着一些对你没有帮助的策略——它们甚至会破坏你。NLP
    教我们如何永远地改变这些无效的策略或程序。


    总而言之，NLP 象征着大脑、语言和身体之间的关系。它描述了我们的言语、思考和行为如何相互作用并影响我们的身体、行为和结果。


    ## 用 NLP 改变你的生活


    ## NLP 的应用


    通过 NLP，你可以学习如何控制自己的心理和生理状态，创造完美的关系，在事业上取得成功，赚更多的钱，增加自信并有效沟通。NLP 的优点之一是，它的设计之初就易于学习，并且可以应用于任何职业或场合。


    NLP 可以帮助你：


    - 改变低自尊

    - 感到更快乐

    - 将焦虑从生活中赶走

    - 戒掉坏习惯

    - 减肥并维持体重

    - 摆债

    - 弄清楚你在生活中所有领域想要什么

    - 找到完美的伴侣或职业

    - 更好地沟通

    - 学得更快

    - 传达信息


    请想象一下 NLP 能为你做什么。


    ## 立即体验魔法


    这里有几个快速练习，帮助改变你的感受。


    ### 处理紧张


    你是否有即将到来且让你感到紧张的事情？当你现在思考那个情境时，通过自己的眼睛观察，注意与该情境相关的图像、声音和感受。现在想象向后退，离开你的身体，这样你可以看到面前的自己。当你看着自己时，注意你的感受已经发生了变化。增加你与前方图像之间的距离，注意你现在感觉变得更加了。


    感觉怎么样？很容易，对吧？


    ### 处理拖延


    你是否会拖延某个特定的任务或情况？我们偶尔都会这样。当你想某件你拖延的事时，你脑中中有图像吗？我所说的图像不是像照片一样清晰的图像，而是位于相对于你身体某个方向的思维感觉。所以，如果我问你图像在哪里，或者你会指向哪个方向？你可能会注意到它在你面前、侧面或身后。任何位置都是完美的。清除屏幕和图像。现在想一件你完全有动力的事。当你思考它时，你有一个不同的图像吗？那个图像的位置在哪里？注意它与第一个图像不同。清除屏幕和图像。现在开始了。找回那个你拖延情境的图像，将它移动到与你完全有动力的事相同的位置。注意发生了什么。你立即感到更有动力去做那个以前拖延的任务了。


    那个也很容易，对吧？


    '
