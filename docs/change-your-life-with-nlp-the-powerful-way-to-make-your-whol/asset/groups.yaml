    The smooth is easy to deal with because it''s the good news. It''s invaluable
    if you can also take the rough, keep positive, get the learnings and move on as
    as quickly as possible. And, deal with everything in the most resourceful way
    possible. Enjoy getting the most out of yourself, every hour of every day.


