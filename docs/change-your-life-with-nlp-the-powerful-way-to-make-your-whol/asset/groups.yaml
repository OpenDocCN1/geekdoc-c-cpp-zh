  - '[PAGE 195]


    # CHANGE YOUR LIFE WITH NLP


    # Rachel – taking a risk to develop an amazing relationship


    Rachel and Eddie had been together for five years and their relationship was on
    the rocks. They had little in common and spent the majority of their spare time
    with their friends. Rachel learnt about feedback on one of our programmes and
    decided to use it as a last-ditch attempt to save her marriage as she still loved
    her husband. They did a deal with each other that they would both put 100 per
    cent commitment to understanding each other''s needs for the first time in their
    relationship. This involved being totally honest with each other about their feelings
    and about what was good and what needed to change in their relationship. It took
    courage to give the level of feedback both ways that was required. Yet, in those
    most open moments they learnt about each other and what made them both happy ever
    before. They agreed to focus on meeting each other''s needs in an atmosphere of
    deep-felt understanding. Their relationship moved to an entirely new level as
    they saw each other for the first time and enjoyed developing and changing as
    their levels of understanding grew.


    # Exercise 29


    Practising giving and receiving feedback for yourself


    Part 1 – giving feedback


    Go through the questions and decide who you want to give feedback to and for what
    purpose. This will allow you to plan for the event. Remember to consider what
    it felt like to give the feedback as well.


    +   - The person I want to give feedback to is:'
  - '[PAGE 196]


