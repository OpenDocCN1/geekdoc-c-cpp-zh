    # CHANGE YOUR LIFE WITH NLP


    The problem is that ''away'' motivation is not consistent. For example, if one
    of your values is ''not being poor'', you will take massive action to earn some
    money. Once you have money again, your motivation drops and the money stops coming
    in. You then become very motivated again and go out and earn money. However, it''s
    a ''boom and bust mentality that isn''t stable in the longer term. In contrast,
    ''towards'' values have much more consistent and long-term motivation. ''Away
    from'' values are created during significant emotional experiences - for example,
    if your parents went bankrupt, you may create a new ''away'' value of not wanting
    to be poor. These are created at an unconscious level so you are not necessarily
    aware of them consciously until you work through a process like the one in this
    book. To change these you need to become consciously aware of them first. As I''ve
    said already, awareness is a vital first step. Then ask yourself, what is there
    for you to learn from ''away'' from value. How is it specific to you, positive
    and for the future? This will make it easier to let the negative experience go.
    Go back and make sure that all your values in this exercise are towards values.


