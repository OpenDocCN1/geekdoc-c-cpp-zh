    Have you ever been at the same event as someone else and found out later that
    they had a completely different experience of it from you? Think back, for example,
    to the last time you went to a family wedding and then discussed the event with
    a relative afterwards. How different was their experience from yours? How is it
    possible that you could both be in the same place at the same time and yet experience
    the event so differently? Perhaps you even ended up wondering if you had actually
    been at the same wedding.


    # NLP communication model


    Every second of day, as we go about our daily lives, external events are impacting
    on our thoughts. We might be chatting with a friend or enjoying a great meal with
    our partner, or at work with our colleagues or out with our children. It doesn''t
    matter. Those events enter our nervous system after going through our personal
    filters. Each of us has a different set of filters, even if we come from the same
    family. The filters include our values and beliefs about the world, our memories
    and our experiences. That''s why two people can witness the same event yet experience
    it differently. It''s like every external event going through a personal sieve
    and my sieve different holes in it from yours. We end up with a different experience
    and neither of them is the actual event itself. It can never be the actual event
    because we change reality as it goes through our filters.


    Once the information enters our filters, we make pictures in our heads, hear sounds,
    have feelings and we talk to ourselves. We refer to these images in NLP as ''internal
    representations''. They are just that – representations of reality; not reality
    itself. Your own internal representations are unique to you. They are your way
    of perceiving the world – if you like, your map of the world or your thoughts.
    If we create a positive internal representation supported by positive self-talk
    about an event, we will be in a more positive emotional state, which in turn means
    we are more likely to get the result we want. An emotional state is the sum total
    of all the neurological processes occurring inside you at any one time. A simpler
    way of thinking about it is that an emotional state is the mood you are in at
    any given moment.'
