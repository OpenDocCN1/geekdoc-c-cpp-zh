    participants regularly expect to be ''fixed'' by me. They often get disgruntled
    when they realise that they have to do something different if they want something
    different.


    # Healing our lives


    If we believe we are the creators of our own universe then we will be motivated
    to keep going and do something different if we don''t at first get the result
    we want in our lives. I believe we can use the ''cause and effect'' as a model
    for all areas of our lives and across all experiences, including illness.


    I believe that disease can be a metaphor for what is happening in our emotional
    bodies. The type of illness often represents the significant emotional experience
    that the person is going through the time. Our thoughts impact on our bodies so
    this is not surprising. If you can discover the trigger for the disease and heal
