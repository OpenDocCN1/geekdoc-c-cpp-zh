    # What can NLP do for me?


    This book is about improving your life, making the changes you want to make, using
    the techniques of NLP. Let''s start with a quick look at what NLP actually is
    and where it came from. In the early 1970s, a linguist, John Grinder, and a mathematician,
    Richard Bandler, discovered individuals who were excellent communicators and technicians
    of personal change.


    The question they asked was, ''What is the difference between somebody who is
    merely competent and somebody who excels at the same skill?'' The answers produced
    NLP: the science of excellence...the art of change.


    They observed many world-class performers, including famous psychotherapists,
    and discovered the beliefs, mindset and strategies which delivered their success.
    They explored both personal and professional work to discover tools and techniques
    that deliver fast and sustainable results. As a result, they formalised their
    change techniques under the name ''Neuro-Linguistic Programming'', known as NLP,
    to symbolise the relationship between the brain, language and the body with the
    results that can be achieved. Because of these modelling techniques, NLP is often
    described as a kind of reverse engineering.


    Unlike other approaches that tell you what you need to do, NLP is a how to technology.
    It tells and shows how to be what you want to be, have what you want to have and
    do what you want to do. An intoxicating combination. This means it is possible
    to have the personal success you want right now. For most people things happen
    and they react. NLP offers a better way. It gives you tools to react differently
    by choice, to be more aware of your thoughts, feelings and behaviour. And you
    are then ready to take responsibility for your results in all areas of your life.'
  - '[PAGE 21]


    # CHANGE YOUR LIFE WITH NLP


    NLP provides a set of tools and techniques to help you deal with unhelpful patterns
    of thought and behaviour. Although there are many techniques in NLP, you can make
    amazing changes by using just one technique. So imagine how much you will achieve
    by reading this book! Let''s look at each part of NLP in turn and I''ll explain
    what it''s all about.


    # Neuro


    Neuro is all about what we think – or our thoughts.

    Neuro means ''what goes on inside our heads''. We have over 60,000 thoughts a
    day. These form our internal world of pictures, sounds and feelings. It is these
    conversations, dialogues or arguments we have with ourselves in our thinking process
    drive how we feel, our mood and ultimately how we respond to events. In NLP terms,
    these are called our internal representations. For example, if you open your curtains
    on a miserable rainy day, as a consequence, feel lousy, and this will drive your
    day goes for you. Alternatively, you can open the curtains and think to yourself,
    ''It''s a brilliantly rainy day today!'' and go off and have fun. Another example
    would be if you are getting ready for an important night out – maybe with a potential
    new partner. You are excited and focused on the evening going well and how you
    will feel as a result. This will impact directly on the success of the evening.


    The critical point to realise is that we can control our thoughts. This is very
    important because how we feel, how we behave and ultimately the results we get
    are driven by combinations of these internal representations which form repeating
    patterns or habits. We run these patterns or habits over and again unless they
    are interrupted or redirected. Sometimes patterns serve us well but often they
    sabotage our potential success. The trick is to ensure that the 60,000 thoughts
    you have every day are good ones Work for yourself what proportion of your thoughts
    is helping you to achieve what you want and what proportion is in some way holding
