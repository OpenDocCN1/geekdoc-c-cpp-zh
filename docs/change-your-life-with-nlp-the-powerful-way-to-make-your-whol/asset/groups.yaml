    # CHANGE YOUR LIFE WITH NLP


    # Questioning for achievable outcomes


    If I were to ask you whether you''ve ever had a goal in the past that you''ve
    achieved, I''ve got a feeling you''d say ''yes''. And, if I asked you whether
    you''ve ever had a goal in the past that not achieved, I''ve got a feeling that
    you''d also say ''yes''. I''m curious to know what makes the difference between
    the two goals. Maybe motivation was an issue for your goal was not compelling
    enough. I''m also curious to know why you haven''t already achieved the goal that
    you''ve just written. What if I could give you a tool that would guarantee you
    achieving your goal. What would be useful to you?


    The tool is a set of questions called ''Questioning for Achievable Outcomes'',
    here used with permission (© The Tad James Co, Tad and Adriana James). I have
    shortened the list for practical purposes.


    It''s best to find a partner for this exercise you can tell them out the answers
    to the questions. If that''s not possible you can answer the questions yourself
    and write down the answers that you come up with. It is very important to write
    the answers down once once you commit the details of your goal to paper it becomes
    much more real.


    Exercise 6

    Questioning for achievable outcomes

    It takes about 25 minutes to go through the exercise. Get your partner to ask
    the questions clearly and to assist you through the process as fast as possible.
    Ask your partner to write down your answers and give them to you after the exercise.

    1. What specifically do you want? (Checks that your goal is stated clearly.)

    2. For what purpose do you want this goal? (Checks that your goal is compelling
    to you.)

    3. Where are you now in relation to your goal? (Checks the potential length of
    the journey. Are you close to success or are you at the very start?)'
