    # How to give and receive feedback


    In NLP, a popular approach for giving feedback is the ‘feedback sandwich’. It
    isn''t the only approach but it''s one that I personally find very useful. All
    change happens at an unconscious level and the unconscious mind needs to hear
    feedback quickly after the event. Feedback that is stored up during the year for
    the day of the performance appraisal meeting is a waste of time. One of the most
    common complaints about feedback is that it takes place too long after the event
    being reviewed. Fast feedback is built into the daily routine, ideally at the
    moment that the event happens, or at the end of a meeting, or at the end of the
    day.


    ![](img/28d67ab57ddbf33d989344b5416e1e3f_192_0.png)


    The feedback sandwich process is made up of three stages, while maintaining eye
    contact at all times. First, check that you are in rapport with the person and
    then tell them what they did well – gets the unconscious mind open and interested
    in listening. Next, you give the person specific suggestions as to what they can
    do better next time – this is often called the ‘meat’ in the sandwich. Finally,
    you end with an overall positive statement. You can also confirm the learning
    by asking the person receiving the feedback what they will do differently next
    time. The important thing is to say the feedback the way it is. Be as direct as
    possible – do not leave the opportunity for misinterpretation, and give as many
    specific examples as you can. Vague feedback is meaningless.


    The unconscious mind hears the initial positive statement which makes it much
    more receptive to hearing the areas for'
