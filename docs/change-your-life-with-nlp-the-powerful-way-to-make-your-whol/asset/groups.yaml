    # Making sense of all this


    Let me pull all of these strands together. In this chapter we have explored the
    link between our thoughts, our emotional state, our physiology, our behaviour
    and ultimately our results. We can never experience the outside world in its purest
    sense as we always perceive external events through our personal filters. Everyone
    has different filters so we experience events in different ways.


    Because our nervous system cannot process negatives, it''s very important to focus
    on what you want as opposed to what you don''t want. If you focus on the wrong
    thing, then you will get the wrong thing.


    Our brains have the capacity to process huge amounts of information every second
    of our lives. We need to have goals to give our unconscious minds and our RAS
    something to work on. The purpose of your RAS is vital in the goal-getting process
    as it will search out the people, information and events that will most serve
    you. Goals give your RAS something to focus on. If you have no goals, you will
    drift through life and your results will be adversely affected.


    The quality of your thoughts will also have an impact on the well-being of your
    whole being, not just your mind. As your cells eavesdrop on all your thoughts,
    it''s vital that your thoughts, and your emotions are supportive to your system.
    Human cells have evolved to a formidable state of intelligence. Imagine if you
    spent your life focusing on negative thoughts or feelings – what damaging suggestions
    will you be giving to the rest of your body?


    > Tip: Nothing has any power over you other than that which you give it through
    your daily thoughts.'
