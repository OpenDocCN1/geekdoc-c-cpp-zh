    challenge for him. As he grew older, the challenges grew harder. His mother always
    drove him to want to do his best and to chase his dreams. Branson says that hard
    work and fun were family traits.


    I spent many years in the Grey Zone, although it might have looked to others as
    if I had the perfect job. The job wasn''t awful - if it was well paid and I got
    to travel round the world. But, still wasn''t my dream. The hours were long and
    the increasing time away from home meant that I was apart weeks from my young
