    与身体体验脱节，因为环境中的视觉部分占据了他们更多的注意力，例如，饥饿等生理需求可能被忽视。


    # 听觉-数字型


    听觉数字型非常灵活，可以具备其他系统的特征。这种额外的风格并不是 Bandler 和 Grinder 识别出的风格之一，而是后来添加的（你可以在 Lewis
    和 Pucelik 编写的《揭秘 NLP 魔法》中找到它）。你经常会注意到这些人双臂交叉抱在胸前，一只手托下巴，呈现出一种像“教授”的姿态。由于他们生活在脑子里，他们可能会与自己的情感抽离。这可能导致他们颈部和肩膀紧张。他们是非常合逻辑且务实的人，会通过问很多问题来理解他们周围的世界。他们通常会要求你提供证据，而不是全盘接受。


    记住，我们都有在不同时候表现得像类别中任何一类的能力，因此请始终相信你的经验。


    # 如何充分利用你的沟通风格


    了解你自己的风格非常重要。也许在阅读这些描述时，你为你产生了一些灵光一现的时刻。


    触觉型的人更擅长享受每一个时刻和旅程中的每一步。他们每一步都非常尽情生活。他们有直觉，并能对采取哪些步骤做出良好的选择。然而，他们采取行动和前进可能需要更长的时间。他们经常陷入情绪中，这阻碍了他们的前进。他们并不总是有一个清晰的终极愿景，因此开启旅程可能需要更长的时间。在采取行动之前，一切都必须“感觉”是对的，而这会延误他们的进度。


    Lewis 和 Pucelik 说，在西方文化中，习惯性的“听觉型”比例与其他类别相比是较小的。这使得对他们做出准确的概括变得更加困难。他们可能需要帮助来建立清晰的未来愿景，但一旦拥有，他们就会开始做需要的事情。他们很容易被噪音分心，因此在哪里度过时间对他们很重要。能让他们顺利推进想法的安静地方对他们来说最好的。他们受到声音语调的影响，因此需要记住，在某些对话中他们可能会受到这种过度的影响。例如，如果他们发现亲近的人不热于他们追求目标，他们可能会过度关注这一点。


    如果你像我一样是视觉型，你必须意识到你的注意力可能会变得全倒性，而且经常需要被提醒去吃饭！几乎完全相反，视觉型人脑子里同时可能存在太多的噪音。这使得他们难以集中精力关注优先事项。对于有目标的视觉型人来说，重要的是一次只关注一件事，并确保在目标变得无处不在时关注他们自己的需求。视觉型人通常擅长构建目标周围的“大局”。他们可以退后并为未来制定策略，然后以每小时
    100 英里的速度冲向前采取行动。然而，有时细节可能会丢失，他们可能会错过周围擅长确保他们不遗漏任何重要事情的人。他们也需要慢下来来享受旅程！


    听觉数字型可能会陷入困局，但原因非常不同。通常，他们花费太多的时间研究新想法并建立证据，以至于没有朝着实现它采取任何行动。他们可能会花费几个月甚至几年时间比较两种不同业务的收益和风险，而从未做出决定。对他们来说，风险在于他们留在灰色地带，只留下遗憾。然而，当他们采取行动时，他们的方法会比其他风格小得多。这会非常有条理，他们会把每一个细节（i
    和 t）都落实到位。在每一步中，他们往往比其他风格更少情感，如果他们对目标没有足够的迫感，这对他们来说可能是一个风险。


    # 我是谁？


    还要注意你的最低分，因为这个领域可能需要一些关注和发展。例如，如果你的最低分是听觉数字型，你如何确保对目标进行了充分的研究，以减轻任何潜在的风险？也许在开始旅程之前，你还可以收集更多证据？


    # 练习 12


    与你的目标沟通


    考虑你学到的关于自己沟通偏好的知识。问自己两个问题：


    - a. 你所偏好的风格（即得分最高的风格）如何帮助你制定目标？

    - b. 你需要采取哪些步骤来防止你最低的偏好引起任何问题？


    # Lindsey – 飞速过生活


    正如我之前提到的，我有非常强的视觉偏好。在圣诞节前不久，我正在参加一个 NLP 执业课程。一次午餐时间，我突然产生了一个主意，给所有的学生买圣诞节巧克力，在他们休假回来之前放在他们的座位上。我冲进一家著名的商店，选择了一袋色彩鲜艳的巧克力。我没有看标签，因为我很少关注那类微小的细节。我回到培训室，在每个椅子上放了一块巧克力。当我的学生回来时，他们对巧克力感到好奇，捡起来并慢慢地拆开。按照我平常的习惯，我已经拆开了我的巧克力并很快吃掉，并没有真正注意到它的任何特征。


    79


    我意识到我的一些学生在说他们有多喜欢巧克力在嘴里“砰”地弹出的感觉。我好奇他们是什么意思，于是捡起了那个空袋子。上面写着类似这样的话：“香槟巧克力——把它们放在舌尖上，享受气泡感”。

    有时，最的教训来自最小的例子。我想我从那次经历中可以学到什么，我意识到我为了寻找目标而匆忙度过生活，而没有享受旅程的每一步。这是我那年学到的最重要的教训之一，它让我慢下来享受当下。第二天，我的学生又买了一袋巧克力，这一次我把它们放进嘴里享受了那种感觉。


    # 价值观的力量


    我在第 3 章中谈到了价值观的重要性，我们现在将详细探讨它们。价值观决定了我们如何度过时间。它们激励我们采取行动，并让我们我们在事件后评估自己做得好不好——或者说，是否正确。我们的价值观提供了我们的道德准则，所以当我们感到不适时，通常是因为价值观冲突。然而，这些很大程度上是无意识的。结果是，我们可能无意中选择与价值观不一致的目标。当这种情况发生时，我们会感到内在冲突。


    # 将你的价值观与目标


    我将向你展示一个强大的过程，你可以用来发现与目标相关的价值观。如果你的价值观与目标一致，实现它们将变得容易得多，因为你自然会有动力，并愿意为实现它们付出一切。


    # 我是谁？


    # 练习 13 与目标的关系


    提取价值观时，最好是找一个能与你一起提问的人。选择一个可以担任教练的朋友。这个练习的规则之一是要求他们继续提问，即使你的回答枯竭。这是因为你的意识价值观会先出来，因为它们处于表面。你的无意识价值观是那些你最少的，可能会晚些出现，并证明是你所确定的价值观中最重要的。


    # 第一步：提取


    让你的练习伙伴问你以下问题：“实现你的目标对你来说是什么重要的？”顺便说一下，这些应该是泛指的目标，而不一定是你在练习 5 中设置的目标。那是因为我们稍后将在本练习中这些目标与你的价值观进行检查，以确保它们完全一致。


    你的伙伴必须写下你说的话，不要建议任何答案，因为那是他们自己的价值观，而不是你的。在 NLP 中，我们正在寻找的词是“名词化”。这些词是抽象名词，即它们不指代现实世界中的物体。例如，“山”这个词是一个我们可以看到并触碰的对象。“责任”这个词是一个我们无法看到或触碰的对象的名词，因此是一个名词化。

