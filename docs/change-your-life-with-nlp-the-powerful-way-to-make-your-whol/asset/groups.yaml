    Learning about all three will have the effect of bringing much information about
    who we are and how we behave to a conscious level of awareness – maybe for the
    first time ever. Are you ready for an exciting journey of self-discovery? Let''s
    begin with meta programmes.


    # Meta programmes


    A simple way of thinking about meta programmes is to think of them as your patterns
    of behaviour or – even more simply – as your personality. They are largely unconscious
    in so far as you normally react without consciously thinking about it. They are
    deep-rooted mental programmes which automatically filter our experiences and guide
    and direct your thought processes. Different combinations of meta programmes lead
    to significant differences in behaviour from one person to the next. Learning
    about your meta programmes will help you decide which elements of your personality
    are helpful in your personal development journey and which you would like to change
    in some way. Maybe you''ve had feedback in the past and have not known what to
    do about that. The first step to changing your behaviour is to be aware of how
    you react. Then you can start to make different choices about what to do in future.


