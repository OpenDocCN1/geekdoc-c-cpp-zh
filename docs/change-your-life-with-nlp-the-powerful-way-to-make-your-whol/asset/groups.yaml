    # Steve – experiencing the importance of the feedback sandwich


    Steve is known as ‘Meat Man’, meaning that he gives very direct feedback in the
    middle of the sandwich. He tells a story of when his boss used the feedback sandwich
    with the team. Steve had spent years in the army and did not consider that he
    needed to hear the good stuff – he just wanted the meat. He told his boss he could
