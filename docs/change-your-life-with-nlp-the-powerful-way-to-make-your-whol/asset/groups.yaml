  - '[PAGE 109]


    happens to your life? Does this sound familiar to you? For example, do you recognise
    yourself as someone who says ''Yes, I''d like to but...'' or are you the person
    who says, ''Yes, let''s go for it!'' Are you buffeted by events, feeling out of
    control, disempowered, a victim? Or are you involved, interested and active in
    what you do? In NLP terms, this is called either living life at effect or at cause.


    # Living your life at effect


    If you are at effect, you will blame others or circumstances for your bad moods
    or for what you have not achieved, or for your life in general. You will feel
    disempowered and will depend on others in order to feel good about yourself or
    about life. ''If only my partner, my boss, my colleagues, my parents, my children...
    understood and helped me achieve my dreams or did what I wanted or what is best
    for me, then life would be great, etc.'' If you wait and hope for things to be
    different or for others to provide for your well-being, you are at effect or a
    victim of circumstances. And really, how much fun is that? And how much fun do
    you think it is for others to be around someone like you who is always moaning
    about their problems?


    Believing that someone else is responsible, or making someone responsible for
    your happiness or your different moods is very limiting and gives that other person
    some mystical power over you, which can cause you a great deal of pain. No one
    can ''make'' us do or feel anything. We react to someone else''s behaviour and
    we have a choice about how we react. For example, if I hear one of my clients
    saying something like, ''He makes me sad'', I will ask them, ''How is his behaviour
    causing you to choose to be sad?'' This puts the person back at cause where they
    have choices about how they react and behave. People at effect give away their
    power because they look outside themselves for the solution. Those who live their
    lives at effect often see themselves or live their lives as victims because they
    believe they have no choices. The irony is that they have choice and have chosen
    not to choose but to be responsive'
  - '[PAGE 110]


    # RESULTS OR EXCUSES? TAKING RESPONSIBILITY FOR WHAT YOU REALLY WANT


    whatever is given to them. What does this remind you of?

    People in the Grey Zone tend to be at effect because they do not believe it''s
    possible to live their lives in any other way.


    # Tom - it''s not my fault


    Tom had been going for interviews for new jobs and had had 11 interviews in the
    past 3 months. He was frustrated because he kept being turned down. When he described
    the interviews to me one thing really stuck out in his language. It was never
    his fault - he was unwell, the interview panel was against him from the start,
    there was an internal candidate, he was asked the wrong questions. The list was
    endless. Because it was never his fault, he didn''t reflect on what he had learnt
    (''learnings'') as we call them) from each interview. He was ''at the effect''
    of his interview experiences. His challenge was how to move to the cause side
    of the scenario and begin to take responsibility for what was really going on.


    # Living your life at cause


    Alternatively, being at cause of what goes on around you forms the foundation
    of the ''mindset for success''. It''s a common thread throughout personal development
    books. The first of Stephen Covey''s seven habits in The 7 Habits of Highly Effective
    People is to be ''proactive''. He talks about being proactive as taking responsibility
    for everything in life. Sounds familiar, doesn''t it? In Unlimited Power, Tony
    Robbins says that whatever happens, take responsibility. He says that, ''Achievers''
    believe that no matter what happens, whether it''s good or bad, they created it.


    I do not believe that it''s coincidental that you hear the same viewpoint over
    and over again. Successful leaders talk about being at cause in one form or another,
    although they may give it another title or name.'
  - '[PAGE 111]


    # CHANGE YOUR LIFE WITH NLP


    # Results v Reasons (excuses) = Empowerment


    The Kybalion, published back in 1908, contains the seven Hermetic principles of
    success. These principles were adapted from ancient Egyptian and Greek wisdom.
    The principle of cause and effect embodies the fact that there is a cause for
    every effect that happens. This implies that there is no such thing as chance
    and nothing merely happens.


    In modern-day terms, being at cause means that you decide in what you want in
    life and you take responsibility for whatever happens – good or bad. You see the
    world as a place of opportunity and you move towards achieving what you want.
    If things are not happening as you would like, you take action and explore other
    possibilities. Above all, you know you have choice in what you do and how you
    react to people and events.


    ### Simon – staying in the ring

    Simon had been in a relationship for many years and had two grown-up daughters.
    His relationship had gone stale neither partner had been prepared to put in the
    investment of time and energy to keep the magic going. They both found it easier
    to blame each other rather than take personal responsibility for changing things.
    He began to have frequent affairs as that seemed the only way to bring the excitement
    back into his life. As the deceit and lies grew, he became depressed and lost
    the sparkle for life. He was in the Awful Zone and his wife'
  - '[PAGE 112]


    # RESULTS OR EXCERCISES? TAKING RESPONSIBILITY FOR WHAT YOU REALLY WANT


    threatened to leave him. He focused on what they both needed to make the relationship
    a success and took 100 per cent responsibility for doing whatever took to get
    things back on track. His wife agreed to give it a final. He found himself communicating
    with his wife more than he had done in years in order to work out what was important
    to both of them about the relationship. Things began to improve and they have
    just moved to France and celebrated their twenty-fifth wedding anniversary.


    # Questions are the answer


    People at cause live their lives in a different way. Essentially, they challenge
    themselves with a different set of questions. These questions are also great for
    assisting others to move to the cause side of life. Whatever happens in their
    lives, those at ask themselves:


    > How have I managed to create this in my life\and for what purpose?


    The power of this is that if you ask yourself a different question you''ll get
    a different answer. When I ask myself and my clients this question it''s amazing
    what pops into their minds to give them a new and empowering perspective on their
    situation. These answers often come directly from our unconscious minds. People
    at cause empower themselves because they keep hold of the problem. They do not
    give away the opportunity to find a solution by blaming others. You see, if you
    keep the problem inside yourself, then you will always have the opportunity to
    find a solution. Are you with me on this? This is the most empowering way to lead
    your life. Being at cause means that you have choices in your life. For example,
    if you are in a relationship that''s not working for you and you blame the other
    person, because in your model of the world they never do anything, you are likely
    to stay in the Grey Zone and remain miserable. If, however, you are at cause,
    you take responsibility for the relationship, and if it''s not working, you know
    you have the choice to do something different. There''s'
  - '[PAGE 113]


    # CHANGE YOUR LIFE WITH NLP


    always a choice for people at cause, whereas when you are at effect, it often
    feels like you have no choice.


    People at cause take more decisions than most people because they are always proactively
    searching out a new solution. The law of averages dictates that not all will work
    out well. However, people at cause ask themselves another great question. Instead
    of beating themselves up when things don''t go exactly to plan, they ask:


    > What could I do differently next time?


    This focuses them on trying something else next time instead of what they did
    wrong. I''ve noticed that many of my coaching clients get stuck in the same old
    behaviour loop. They believe that if something isn''t working well, the solution
    is to do more of it. They invest more time and money in something that is already
    proven not to work. They become like the hamster in the hamster wheel, running
    faster and faster and getting nowhere. Madness. I like to say:


    > If you always do what you''ve always done you always get what you''ve always
    got.


    I have met a woman who says this mantra quite literally changed her life, and
    it''ll change you too. Asking ''What could I do differently next time?'' helps
    you to break out of the old behavioural patterns.


    # Sally – doing something different


    One of my clients was getting very frustrated because she really fancied someone.
    He was the father of her son''s best friend. He was unattached, good looking,
    well dressed and had a great job. She is an attractive woman and had always found
    it easy in the past to get noticed by men. But not this particular one... and
    he wasn''t gay. She worked on every trick in the book – wearing sexy clothes,
    turning up in all the places she knew he''d be, finding excuses to call him to
    invite his son over to play, asking him in for coffee when he arrived to collect
    his son. Nothing worked. Exasperated, she asked me for a coaching session. I listened'
