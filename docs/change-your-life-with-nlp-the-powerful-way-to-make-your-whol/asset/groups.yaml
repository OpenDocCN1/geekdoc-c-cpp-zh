    # FOCUS ON WHAT YOU WANT


    Anyone who counts all six ''f''s first time around is a genius. Three is normal,
    four is quite rare. In this example, our brains do not process the word ''of''
    – it gets deleted.


    If I were to ask you right now how it feels to sit on your chair, you will immediately
    become aware of the feeling of your backside on the chair and your back against
    the back of the chair, although previously you had deleted the information as
    ''useless''.


    Our ability to delete portions of the barrage of input is essential to our survival.
    The interesting question is, what are you currently deleting that you need to
    pay attention to in order to achieve your goals? What are the possibilities that
    you haven''t noticed yet that will make the difference between success and never
    getting there?


    # Generalisations


    We use generalisations to speed up our learning process. One of the great things
    about NLP is that it resists generalisations and encourages us to take each context
    on its own merits. However, for most people beliefs drive all their actions, and
    beliefs are shaped by generalisations. These beliefs then become limitations for
    future decisions about who you are and what you are capable of. For example, if
    you have experienced a disappointing relationship, you might now believe that
    all future relationships will be the same. Your emotional state and psychology
    will reflect this, as you are not likely to attract the right kind of person or
    make a relationship work under these conditions. Perhaps you now believe you''re
    not good enough to achieve your goals because your parents and teachers have told
    you that in the past. Because of your generalisation, your RAS only notices the
    times when you didn''t get what you wanted. It misses the examples of when you
    have been very successful. What generalisations do you have about yourself that
    will impact your goals until you deal with them? Do you use phrases like I never...
    or I always...? We will work on these in Chapter 5.'
