  - '[PAGE 122]


    # Believe you can


    We know from Chapter 4 how important it is to focus on what we want to achieve.
    There is another principles important dimension to this. If you were to adopt
    all the principles in this book so far, i.e. setting goals, focusing on what you
    want, living life at cause, would that be enough to guarantee you success? Well,
    it depends on what you believe about yourself. For example, what would happen
    if I went after my goal to set up my own company? I focus on my success, I take
    responsibility for everything happens in my life. So far, yet if at an unconscious
    level I believe that people in my family are never going to be achievers, what
    will that do to me? As our beliefs shape what we believe to be possible, my belief
    will eventually lead to incongruence with my goal. In some way I will end up sabotaging
    my results. I''m likely to delete the many potential opportunities that come my
    way because my belief leads me to run a pattern that says it''s meant to be really
    hard or even impossible for me to achieve my success.


    I''m constantly amazed at the number of companies that put their staff through
    a training programme and expect that programme have a lasting impact on their
    people. For example, a salesperson sent on a course to improve their sales skills
    will learn new tools and techniques. This may affect their behaviour in the short
    term, yet it''s short-lived. Why? Because, if at some level they believe they
    are never going to be a brilliant salesperson, that will limit the impact of the
    training. They may do better for a while and then their limiting beliefs about
    themselves begin to creep in. Are you with me so far on this? As it is vital on
    our journey to focus on what we want in our lives, to understand our own belief
    system and the impact of this on our goals, you will need to change your beliefs
    so that your goals and beliefs are totally aligned. I''ll show you how.'
  - '[PAGE 123]


    # What are beliefs?


    Our beliefs are views about ourselves, other people and situations that we hold
    to true. They are emotionally held views not based on fact. They are feelings
    of certainty that we have about something. For example, if you believe you are
    fit, what you''re actually saying is you have a feeling of certainty that you
    are fit. Alternatively, if you lack of belief or, in other words, it is a limiting
    belief that you are fit, it is likely to hold you back.


    Morris Massey, a sociologist, in his book People Puzzle - Understanding Yourself,
    describes the imprint period between the ages of 0 and 7 as the moment when our
    beliefs are formed. They are shaped by key people in our lives at that time, for
    example parents, teachers, religious leaders, close family, etc. In actual fact,
    most of our beliefs are generalised that we create from life experiences. Most
    of us do not consciously decide what we believe; most of us are generously donated
    our beliefs by influential parents during our imprint period, and once we have
    a belief we forget that it can be changed and it becomes our reality. We rarely
    challenge our long-held beliefs and they become a filter through which we sieve
    all life''s expectations and experiences.


    # Bridgit – awareness is the first step to recovery


    Bridgit set up her own business but despite some successes, the company was not
    yet reaching its potential and she was dangerously close to having to close it
    down. She came to me for a breakthrough session as she couldn''t understand why
    success was proving to be elusive and so hard work it did come to her. During
    her session I did some work with her on her limiting beliefs. It became clear
    during questioning that her parents were very religious and in fact they had always
    a very different view to her about money. They believed money to be the root of
    all evil and this was often discussed in front of my client and her brothers and
    sisters. Consequently, whenever she got to making money with her company she would
    unconsciously sabotage the process. Once I helped her to become more aware of
    what was going on, she could begin to challenge and change that old belief. It
    became OK for her to make money and she doubled her turnover of the previous year
    in the next three months.'
  - '[PAGE 124]


    # How do we create beliefs?


    When I think of beliefs I have a metaphor in my mind of a new house being built
    with basic building blocks being put on top of a foundation. From the example
    above, ''money is the root of all evil'' would be the foundation of the belief
    which was generated by a commonly held view in that family. We then begin to collect
    building blocks or ''reference experiences'', as coined by Tony Robbins we add,
    to support foundation. The more building blocks we, the stronger the belief becomes.
    My client began to filter information according to the belief that ''money is
    the root of all evil''. Her building blocks were each example of where this belief
    had been reinforced by an experience that she had seen, heard, felt and so on.
    For example, other people supported the idea, a TV programme, an article in the
    paper, a book, a film. It didn''t take long before her reticular activating system
    was only bringing to her attention evidence that the belief was true. Her RAS
    acted as a pair of ''money is the root of all evil'' tinted glasses. Other opportunities
    to see in a different light were missed as they were outside her awareness. Once
    the belief was changed, she then began to notice new opportunities coming her
    easily and effortlessly.


    Our beliefs are often held in the deepest levels of our unconscious mind. We are
    strongly influenced by the behaviour of the significant people in our lives, frequently
    our parents, before the age of seven. One way to unravel your limiting beliefs
    is to reflect on your parents'' attitude to relationships, money, sex, etc. You
    may be unconsciously modelling them or rebelling against their behaviour.


    Limiting beliefs about ourselves act as a self-fulfilling prophecy. We know this
    from our discussions in Chapter 4 about getting what you focus on. If our beliefs
    are limiting us we act in a way that proves our beliefs to ourselves. However,
    if we have empowering beliefs we act and behave in a way that releases our potential
    and allows us to be our true selves. Let''s look at the impact of our beliefs
    on our thoughts and our actions with the example of ''getting fit''.'
  - '[PAGE 125]


    # Example 1


    Belief


    +   - I can''t get fit.


    Outcome


    I don''t want to be fat


    +   - I prepare my exercise schedule


    I join the gym and start to exercise regularly


    After a couple of weeks I begin to make excuses to myself to avoid exercising


    I begin to exercise less often


    I get demotivated when I don''t see any improvement in my fitness


    I get increasingly fed up with myself


    When I''m fed up I eat more


    I even begin to put on weight and I''m less fit than when I started


    I prove my belief to myself'
  - '[PAGE 126]


    # Example 2


    Belief


    +   - I believe I can get fit easily.


    Outcome


    I have a vision of how great I will look and feel when I''m fit


    I prepare my exercise schedule


    I join the gym and start to exercise regularly


    I feel excited and motivated as I notice my body shape changing


    I notice my weight starting to reduce


    I feel good about myself and look forward to showing off the new me


    I buy myself some new clothes to reward myself


    I continue to get fitter


    I reach my target fitness and weight


    I prove my belief to myself'
  - '[PAGE 127]


    # CHANGE YOUR LIFE WITH NLP


    Which cycle are you on at the moment? Do you spend your time focusing on your
    empowering or limiting beliefs about yourself?


    # The power of our beliefs


    Another dimension to the importance of beliefs is their potential impact on our
    health and ageing process. In Ageless Body, Timeless Mind, Deepak Chopra wrote
    that people grow old and die because they see others grow old and die. Norman
    Cousins, who developed ‘laughter therapy’, proposed that ‘belief creates biology’.
    Our inherited expectation is that our body will wear over time and that we are
    destined to suffer, grow old and die. Chopra estimates that, without negative
    influences from outside, our bodies could last between 115 and 130 years before
    the ageing process finally caused them to shut down.


    The Tarahum people in Mexico are an interesting example of what can happen when
    a tribe lives away from the rest of society and outside influences. There are
    about 40,000 of them scattered in small villages across remote mountains and canyons.
    Their name for themselves is ‘Rarámuri’ or foot runners. Running has always been
    a central part of their culture as it’s the only way for them to get around. In
    1993, Victoriano Churro won the ultramarathon, the Leadville Trail 100. This is
    the most gruelling marathon in the US because nearly all of the race is run at
    elevations of 10,000 feet. He ran in sandals made of leather tough and nails.
    The interesting thing is that Victoriano was 55 when he won the race. The Tarahumara
    believe that runners do not reach their prime until they are approaching 60 and
    this is what they create in their tribe. The best runners are in their late 50s
    and 60s.


    This is in complete contrast to the Western model. In fact, in the UK and the
    US, mandatory retirement is set at age 65. After this date you are no longer socially
    useful and you become one of society’s dependants. Medically, the impact of this
    perception shift can be disastrous. Chopra talks of ‘early retirement death’ where,
    in the first few years after retirement, heart attacks and cancer rates soar.
    Maybe time for us to consider Mexico!'
