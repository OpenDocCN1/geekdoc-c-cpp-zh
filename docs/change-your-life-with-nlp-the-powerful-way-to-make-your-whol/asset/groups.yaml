    # Voice tonality


    We can also use voice tonality to build rapport. The same principle is used –
    you match voice tonality, and, as tonality accounts for 38 per cent of the impact
    of communication, this also has a major impact.


    How do you it? If you really tune into a person''s voice, you''ll begin to notice
    that some voices are high or low, or soft and tempo is fast or slow. Really tune
    into the ''song'' of the voice. For example, the pitch of the voice tends to go
    up and down as a person speaks. Notice when their voice goes higher and when it
    gets lower. For example, is it a voice that goes ''up'' at the end of most sentences?
    To match tonality you use the same features in your voice. You do not have to
    match the voice exactly; just enough for the other person to feel a sense of familiarity.
    Dt match accents – that is a recipe for disaster. And, if you are a male matching
    a female or versa, please do not try to match the other person as it will sound
    very odd! Just take your voice up a notch if you are a man and down a notch if
    you are a woman. Start to use your sensory acuity to begin to notice the differences
    in tonality.


    People often ask me what to do when someone is shouting at you. In this situation,
    you should raise your tone, i.e. move closer to theirs and use the same words
    you would have used normally. In the past, customer-services staff were taught
    to be quiet and encourage the person to quieten down when angry. However, in NLP,
    we feel this has the impact of mismatching and is even more likely to add ''fuel
    to the fire''. This is, of course, also the technique to use to build rapport
    over the telephone.


    Exercise 26

    Matching voice tonality


    Start to match voice tempo first. Notice different rates of speech. Later move
    onto matching tones. If you get into a challenging situation, start to match tempo
    and tone and notice how quickly the disagreement begins to dry up. Experiment
    often with this to build your flexibility. Notice what happens.'
