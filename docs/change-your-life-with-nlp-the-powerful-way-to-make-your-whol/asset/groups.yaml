  - '[PAGE 162]


    # Influencing with integrity


    To really succeed in this world it is important to be able to work with and through
    others. It''s unlikely that you''ll achieve your goals entirely by yourself. This
    chapter is all about how influence others with integrity core elements of NLP,
    such as the presuppitions of NLP, sensory acuity, rapport, communication styles
    and eye patterns.


    The question I get asked more than any other about NLP is whether it is manipulative
    or not. I often challenge those who pose the question by asking if any sales people
    who have been taught ''manipulative'' techniques. Of course they have. Many tools
    and techniques have the potential to be used for manipulation – there are many
    sales people out there with huge sales targets who are taught to sell at all costs,
    whether the customer needs the goods or not. I would agree that the potential
    is there in NLP. What makes the difference is how you use the tools you have been
    taught. That''s why this chapter is entitled ''Influencing with integrity''. The
    difference between manipulation and influence is actually simple. It''s all about
    your intention. If you are focused on a ''win-win'' situation, how can it be manipulation?
    You achieve your result and so does the other party. Is it manipulation if I use
    my NLP toolkit to assist my client to achieve the outcome they want for themselves?
    With their permission, I''ll do whatever it takes to assist them. I see that as
    my job. Equally, if my goal is to build a successful NLP training company and
    I sell to people who have told me they need my services – is that manipulation?
    If I don''t make the sale in that situation then somebody else will! Genie Z.
    Laborde says:'
  - '[PAGE 163]


    # CHANGE YOUR LIFE WITH NLP


    > Once you know how to clarify your own desires (or outcomes) you can use the
    same techniques to clarify the outcomes of any other party involved in the communication.
    Achieving that party''s outcome while you achieve your own is what I call influencing
    with Integrity.


    In contrast, achieving your outcome at the expense of another constitutes manipulation.
    For example, selling at all costs to achieve your monthly sales target to customers
    who may or not want your service is manipulation. For example, I contacted a garage
    the other day to enquire about a car that I saw on the internet. The salesman
    immediately told me that he thought the car was sold. He then came a few minutes
    later to tell me the good news... it was still available as the previous sale
    had fallen through. I observed with interest and noticed the impact it had on
    me... he hadn''t asked anything about my requirements at that point and already
    I was feeling relieved that a car wasn''t sure I even wanted was!


    In contrast, making your sales target by selling to customers who want your service
    and would gain value from it, is influencing with integrity. That''s the difference.


    # How to build successful relationships


    We''ve already explored a couple of the presuppitions of NLP, such as ''there
    is no failure only feedback'' and ''we all have the resources we need to succeed''.
    We''re now going to explore more of them. When I was studying to become a Practitioner
    of NLP I found the ''presuppositions of NLP fundamental to changing the way I
    relate to others. They frame the context in which the other NLP tools are used.
    One of the curious things though about the presuppitions is that there is no definitive
    set published by Bandler and Grinder. They rather emerged as principles that underlie
    NLP and were made explicit by other NLP developers, such as Robert Dilts. Because
    of that, you will find variations amongst the literature and this book is no'
  - '[PAGE 164]


    different! According to Toser and Mathison, few of them seem to be original creations
    of NLP; many came from other fields such as cybernetics. I''selected the ones
    that I believe helped me the most in my work with others, and especially in relationship
    building. These presuppitions succeeded in changing my belief system around the
    way I communicate and they have the potential to do the same for you. I have also
    used them with my kids, my family and my team as they are all designed to empower
    and give us a greater understanding of empathy with human behaviour in general.
    I have re-named them ‘beliefs of world-class communicators’ because if you apply
    them in your daily interactions they will transform your results with others –
    I guarantee it.


    # The beliefs of the world-class communicators


    | Belief | What it means | So in the context of our goals? |

    | --- | --- | --- |

    | 1. Everyone has a different model of the world. | We are all unique. | We learn
    to accept everyone is different. This helps us to become more flexible and tolerant
    of others in the pursuit of our goals. |

    | 2. The meaning of your communication is the response you get. | Our communications
    are only successful if they get us the result we want. | It puts the responsibility
    for our communication with us. So, if one approach doesn''t work, we need to do
    something different until we get the outcome we want. |'
  - '[PAGE 165]


    # CHANGE YOUR LIFE WITH NLP


    3. There is no failure, only feedback.


    We learn from all our experiences.


    If we interpret mistakes as failures, we feel defeated. we interpret mistakes
    as learning opportunities, we continue to develop and will move faster towards
    our goals.


    4. People do the best they can with the resources they have at the time.


    You do the best you can with what you know at that time.


    When we act we make the best choice we can with everything we know in that moment.
    Once we realise this, it allows us to go of regret and forgive others.


    5. The person with the most flexibility will achieve the most.


    If you don''t get your result time round, you keep doing something different until
    you do.


    By regularly practising the concepts in this book, you will develop your thinking
    and your flexibility and achieve your potential.


    6. All behaviour has a positive intention behind it.


    Why do people do what they do? All behaviour starts with a positive intention
    by the person doing it. This does not necessarily mean it will also benefit the
    person or people that the behaviour is ''done to''.


    We may not agree with the behaviour, but if we look for the positive intention
    behind it, this allows us to have more choice in how we respond.'
  - '[PAGE 166]


    # INFLUENCING WITH INTEGRITY


    7. We control our minds, and therefore, our results.


    We have choices about what we think and we know our thoughts influence results.


    Because results are dependent on our mental state, we want to be in the best state
    to achieve our goals. We can change our state by changing our thoughts (see back
    to Chapter 4 for more information).


    8. We have all the resources we need to succeed.


    People have the capacity to be, do and have whatever they want.


    All of us have untapped reserves of qualities, skills and attitudes that we have
    not yet learned to use (see Chapter 8 for more information). Maximising these
    will help us achieve our goals faster.


    9. Resistance is a sign of a lack of rapport.


    When you communicate with another individual or a group, any resistance from them
    is a sign to you that you need to build better rapport with them.


    Rather than blame the other party as ‘not interested or bored’, use your rapport
    skills that you will learn in this chapter to get back on board.


    10. There is a solution to every problem.


    Finding new solutions to old problems is at the heart of creativity.


    This gives us confidence that we will find a way to achieve our goals no matter
    what challenges we meet on our journey.'
