    \ goal. Unless this goal can be adjusted to bring both security and fun, the level\
    \ of this person’s motivation is likely to diminish over time.\n\nAsk yourself\
    \ where are the high- and medium-risk areas for you? Go back to your goal and\
    \ work out what needs to change to bring your alignment to 100 per cent.\n\n##\
    \ Other tips about values\n\nNotice if any of the values that you elicited were\
    \ phrased as a negative ‘not being poor’. For example, in NLP, this is an example\
    \ of what is called an ‘away-from’ value. That’s because you are moving away from\
    \ what you don’t want as opposed to moving towards what you want. In contrast,\
    \ ‘having abundance’ is a ‘towards’ value. Both of these examples will create\
    \ motivation for you. However, the motivation is fundamentally different. ‘Away\
    \ from’ motivation doesn’t feel good and there is the danger that when you focus\
    \ on what you don’t want, i.e., not being poor, that’s what you’ll get (remember\
    \ Chapter 4 – focus on what you want).\n\n## CHANGE YOUR LIFE WITH NLP\n\nThe\
    \ problem is that 'away' motivation is not consistent. For example, if one of\
    \ your values is 'not being poor', you will take massive action to earn some money.\
    \ Once you have money again, your motivation drops and the money stops coming\
    \ in. You then become very motivated again and go out and earn money. However,\
    \ it's a 'boom and bust mentality' that isn't stable in the longer term. In contrast,\
    \ 'towards' values have much more consistent and long-term motivation. 'Away from'\
    \ values are created during significant emotional experiences - for example, if\
    \ your parents went bankrupt, you may create a new 'away' value of not wanting\
    \ to be poor. These are created at an unconscious level so you are not necessarily\
    \ aware of them consciously until you work through a process like the one in this\
    \ book. To change these you need to become consciously aware of them first. As\
    \ I've said already, awareness is a vital first step. Then ask yourself, what\
    \ is there for you to learn from 'away' from value. How is it specific to you,\
    \ positive and for the future? This will make it easier to let the negative experience\
    \ go. Go back and make sure that all your values in this exercise are towards\
    \ values.\n\nNow you know the process for eliciting values, use this exercise\
    \ on other core areas of your life such as career, health and fitness and your\
    \ intimate relationship. Remember, elicit your values for your ideal career, level\
    \ of fitness, relationship, etc., not the way you do or have it now. Then\n\n\
    ## Pulling it together\n\nThis chapter is all about personal leadership and awareness.\
    \ To be able to change your life and create what you want, it's vital to know\
    \ yourself first. That's why we begin by running self-assessment exercises. You\
    \ might be surprised with what you discover. In this chapter we've learned about\
    \ meta programmes, styles and values. You now know much more about your own personality\
    \ than at the start. Check out if you are aligned with each other. The biggest\
    \ difference when you have everything in alignment with your goals is that creating\
    \ change will start to feel easy. So it's worth doing then, isn't it?\n\nTip:\
    \ Remember that your meta programmes, communication styles and values are your\
    \ filters through which you experience the world. Start to change them and your\
    \ world will also shift.\n\n## Chapter 6\n\n> ‘Every cause has its effect, every\
    \ effect has its cause; everything happens according to law. Chance is but a name\
    \ for law not recognised.’\n\n*From The Kybalion*\n\n## Results or excuses? Taking\
    \ responsibility for what\n\nWhat is it that makes the difference between two\
    \ successful people? What makes one world class and the other good? This is the\
    \ question that perplexed Richard Bandler and John Grinder, the creators of the\
    \ body of knowledge we know as NLP. They made it their life’s work to discover\
    \ the answers. One of the ways they went about doing this was to find worldclass\
    \ models of excellence and to find out how they did what they did. One of the\
    \ key findings was concerned with what can be described as the ‘mindset for success’.\
    \ How do successful people create their model of the world and how is it different\
    \ from other people’s? Successful people do not have fewer problems than unsuccessful\
    \ people, but they deal with problems in a different way. It’s not ‘luck’ that\
    \ separates successful people from those who never make it; it’s about how they\
    \ perceive a situation and how they respond to what happens. Consider for a moment.\
    \ How do you live your life? Do you experience your life as hard and difficult\
    \ or do you generally look on the positive side of life? I’m sure you are familiar\
    \ with the ‘glass half empty/glass half full’ way of seeing the world. What about\
    \ you? What is your starting point, point of view? Some people will only see problems\
    \ in a situation others always see the opportunity. Are you someone who blames\
    \ others or circumstances for whatever happens or are you someone who takes responsibility\
    \ for whatever\n"
  mdcn: "\n这是一个示例，可以帮助你理解思路。当你被问及你的目标对你来说什么重要时，你会接连不断地回答：\n\n- 产生产生影响力\n- 安全感\n- 学习\n\
    - 名声\n- 财富\n- 独立\n- 灵活性\n- 多样性。\n\n接着你说“去新的地方旅行”。这并不是一个价值观，所以你的伴侣问你：“去新的地方能给你带来什么或让你得到什么？”你回答“有趣”。这才是价值观。将“有趣”加入你的列表。\n\
    \n- 产生产生影响力\n- 安全感\n- 学习\n- 名声\n- 财富\n- 独立\n- 灵活性\n- 多样性\n- 有趣。\n\n接着你说你想不出其他的了。这意味着你已经处于第一波的终点。你的伴侣继续下去，询问“对于实现目标，对你来说什么重要？”以发现你的第二波价值观，或者那些在更潜意识层面持有的价值观。\n\
    \n接着你说：\n\n- 灵感\n- 传承\n- 个人成长\n- 真实性\n- 永久性。\n\n因此，从第二波中识别出了五个价值观。\n目前的列表如下：\n\
    \n- 产生产生影响力\n- 安全感\n- 学习\n- 名声\n- 财富\n- 独立\n- 灵活性\n- 多样性\n- 有趣\n- 灵感\n- 传承\n-\
    \ 个人成长\n- 真实性\n- 永久性。\n\n## 第二步：价值观的层次结构\n\n你的练习伙伴现在应该给你价值观列表，并让你选出前八个，按优先级顺序进行排序。这看起来可能是一个挑战，但理解从最重要的到最不重要的是非常重要的。\n\
    \n## 第三步：重写你的列表\n\n你的练习伙伴随后应该按照你给出的顺序重新写写你的列表。你可能会发现，你一些最重要的价值观是在第二波引导中得出的。这非常常见，意味着你一些最重要的价值观是那些在潜意识层面持有的。\n\
    \n让我们假设这就是我们例子中的最终列表：\n\n1. 灵感 \n2. 传承\n3. 安全感\n4. 名声\n5. 多样性\n6. 有趣\n7. 个人成长\n\
    8. 真实性。\n\n你会注意到来自第二波的灵感和传承现在位于列表的第 1 和第 2 位，这证明了继续提问的重要性。\n\n## 第四步：测试\n\n你可能觉得你的价值观顺序是正确的。然而，你的练习伙伴应该按照如下方式检查它们。你的伴侣从第\
    \ 1 个价值观（最重要的）开始，并询问你（使用我们的例子）：“假设你可以拥有灵感（第 1 个价值观）但没有传承（第 2 个价值观），这对你来说可以吗？”\n\
    \n他们需要迫使你做出选择。如果你说可以，那么这些价值观顺序就是正确的。如果你说不可以，这些价值观就需要反转——换句话说，第 2 个变成第 1 个，反之亦然。然后你的伴侣会检查第\
    \ 2 个价值观与第 3 个价值观，直到你检查完八个价值观。然后你就可以确定它们的顺序是正确的。\n\n## 第五步：你的目标情况如何？\n\n现在回到练习\
    \ 5 中的目标。我们将根据你的价值观对它们进行评估。你可能需要一个一个处理目标，或者先处理对你生活影响最大的目标。查看你的八个价值观列表，根据每个价值观给你的当前目标打分（满分\
    \ 10 分）。请参考对应的假设性示例寻求指导。\n\n| 价值观 | 得分 |\n| :--- | :--- |\n| 1. 灵感 | 9/10 |\n\
    | 2. 传承 | 10/10 |\n| 3. 安全感 | 6/10 |\n| 4. 名声 | 8/10 |\n| 5. 多样性 | 8/10 |\n| 6.\
    \ 有趣 | 4/10 |\n| 7. 个人成长 | 9/10 |\n| 8. 真实性 | 10/10 |\n\n我通常将得分分为三类：\n0-4 高风险区域\n\
    5-7 中等风险区域\n8-10 关系低风险区域\n\n在我们的例子中，两个最高价值观是该目标的低风险区域。然而，从长期来看，安全感和趣味可能是该目标的严峻挑战。除非调整该目标以兼顾安全和趣味，否则这个人的动力可能会随着时间的推移而减少。\n\
    \n问问自己，对你来说高风险和中风险区域在哪里？回到你的目标，找出需要改变什么才能使你的对齐程度达到 100%。\n\n## 关于价值观的其他提示\n\n\
    注意看你引导出的任何价值观是否被表述为负面的“不贫穷”。例如，在 NLP 中，这是一个被称为“远离型”（away-from）价值观的例子。这是因为你是在远离你不想要的东西，而不是走向你想要的东西。相反，“富足”是一个“趋向型”（towards）价值观。这两个例子都会为你创造动力。但这种动力从根本上是不同的。“远离型”动力的感觉并不良好，而且存在一种危险：当你关注你不想要的东西（即不贫穷）时，你得到的就是那个（记住第\
    \ 4 章——关注你想要的）。\n\n## 用 NLP 改变你的生活\n\n问题在于“远离型”动力是不持续的。例如，如果你的价值观之一是“不贫穷”，你会采取巨大的行动去赚钱。一旦你又有了钱，你的动力就会下降，钱也停止入账。然后你又变得非常有动力并出去赚钱。然而，“趋向型”动力在长期来看是稳定的。“远离型”价值观是由于巨大的经历产生的，直到你在潜意识层面意识到它们。正如我已经说过的，意识是至关的第一步。问问自己，对你来说是什么重要的，对于未来。这会让你的创造变得更容易。那么\n\
    \n## 总结\n\n本章完全关于个人领导力和意识。为了能够改变生活并创造你想要的东西，首先了解自己至关重要。这就是为什么我们从运行自我评估开始。你可能会对发现感到惊讶。在本章中我们学习了思维程序、风格和价值观。你现在对自己的了解比开始时多得多。检查你是否保持一致。当你一切与目标一致时，创造将开始变得容易。所以这值得做，不是吗？\n\
    \n提示：记住你的思维程序、沟通风格和价值观是你体验世界的过滤器。开始改变它们，你的世界也会随之转变。\n\n## 第6 章\n\n> ‘因必有果，果必有因；一切发生都遵循规律。偶然只是未被识别的规律的名称。\n\
    \n*出自《凯巴隆》\n\n## 结果还是借口？对……负责\n\n是什么了两个成功人士之间的区别？是什么让一个人成为世界级而另一个人平平？这个问题困扰了理查德·班德（Richard\
    \ Bandler）和约翰·格林德（John Grinder），我们所熟悉的 NLP 知识体系的创造者。他们致力于发现答案。他们采取此的方法之一是寻找世界级的卓越模型，并找出他们是如何做到的。一个关键发现涉及可以描述为“成功心态”。成功人士如何创造他们的世界模型，它与他人有何不同？成功人士面临的问题并不比失败者少，但他们处理问题的方式不同。考虑一下。你是如何生活的？你经历的生活是艰难困难的，还是通常倾向于看积极的一面？我确定你熟悉“杯子半水是的”这种观察世界的方式。你呢？你的起点、观点是什么？有些人在这种情况下只会看到问题，而另一些人总是能看到机会。这些是在潜意识层面产生的，直到你在意识层面意识到它们。\n"
