    # How do you build rapport?


    In NLP the way to build rapport using physiology is by using a technique called
    matching and mirroring. Matching is when you literally match what the other person
    is doing, e.g. they cross their left leg over their right leg and you do the same.
    Mirroring is when you create a mirror image, i.e. they cross their left leg over
    their right and you cross your right leg over your left. Get it? This means that
    you use your sensory acuity to observe what they are doing with their physiology
    and you choose a couple of elements to effectively ‘copy’


