    # Who am I?


    The Greeks inscribed the words ‘Know thyself’ at the Temple of Apollo in Athens.
    In more recent times, the same words were inscribed in Latin above the door of
    the Oracle’s house in the film The Matrix. Why is self-knowledge so important,
    as we define our goals and start to focus on what we want? If our goals are fully
    aligned with who we really are and what is most important to us, then achieving
    them will be much easier because only then will we be motivated to do whatever
    it takes to move ahead. It''s as simple as that. Also, if we know our own strengths
    and development areas we can make some choices about the best way to achieve our
    goals. For example, if I learn that I operate best when I have variety in what
    I do and when I''m working with others, I''m not going to get my best results
    working in a similar routine each day on my own. The bottom line is that knowing
    yourself is key to personal leadership and strong personal leadership goals.


    In this chapter we''re going to learn more about our personalities through three
    different NLP-based lenses. In the last chapter we learned about our filters which
    we unconsciously use to manage the data coming into our nervous system. We use
    our filters to delete, distort and generalise this data to make it manageable
    for ourselves. In this chapter we''re going to explore three of these filters
    in more detail as they are critical to how we view the world.helle Rose Charlotte
    describes our filters as:


    > like a door through which we interact with the world... (our filters) simply
    describe the form of our door, what specifically we let in and out in a a given
