    # ARE YOU IN THE GREY ZONE?


    enough pain yet. Every one of us has a threshold for pain and once that threshold
    is crossed, change will occur. The threshold is different for everyone. That is
    why soldiers returning from active service may respond differently to their experiences;
    one may get on with their life as if nothing has happened and the other suffer
    from post-traumatic stress disorder. The Awful Zone is the point of no return.
    This is the place where the pain gets so great that you finally take action. At
    this point, although it is bizarre to describe it as such, the pain does you a
    favour as it drives you to take action and produce different results. This is
    the terrain of the Awful Zone.


    # Kay – facing the most challenging circumstances of her life


    Kay had worked in local government for 20 years. She was a third-tier manager
    in a busy social services department in London. She decided not to go for promotion
    until the opportunity arose as she had recently had her son. Her new boss was
    incompetent at his job and lazy. This had a “double whammy effect on as he over-delegated
    and she had to pick up the pieces when he didn''t do his job properly. She soon
    became extremely unhappy. She was in the Grey Zone as she had worked for this
    organisation for the whole of her working life and she knew nothing else. Yet,
    she was too afraid to move into nothing new.


    Then a life-changing experience occurred that tipped her into the Awful Zone.
    Her brother-in-law, who was in his mid-forties, was diagnosed with an operable
    brain tumour. He had been married to her sister for 20 years and although they
    had always thought they would have children, they had to come to terms with the
    fact that it was unlikely to happen now. Imagine how happy they were when his
    wife discovered she was pregnant. This was five months before her husband''s diagnosis.
    The pregnancy became fraught with the expectation of new life and loss of life
    at the same time. In the end, deteriorated fast and died a week after his daughter
    was born. It was as if he held on long enough to hold his new daughter in his
    arms and then it was time.'
  - '[PAGE 31]


    # CHANGE YOUR LIFE WITH NLP


    The significance of this experience for Kay was life changing: being with her
    sister and her brother-in-law throughout these tragic circumstances was the tipping
    point. She decided to take action at work and took the matter up formally. Despite
    her loyalty of service and her well-known ability to deliver results, the Authority
    failed to deal with the situation. She decided that life was too short to spend
    any more time in a job that caused so much unhappiness and she finally left.


    She decided to set up her own company where she would be the controller of her
    own universe and her life began to improve immediately.


    One of the important questions for you is, ‘when is the pain bad enough?’ Do you
    want to find yourself looking back on your life full of regret? The great thing
    is that it''s never too late to change.


    # The Grey Zone


    > People often end up feeling that their lives have been wasted, that instead
    of being filled with happiness their years were spent in anxiety and boredom.

    Mihaly Csikszentmihalyi


    I describe the Grey Zone as that place where many people spend their entire lives
    – it’s not awful and it’s certainly not brilliant. It’s the place where people
    are prepared to sell out their dreams for a comfortable existence. What a waste
    of a life! Often people are happy in the Grey Zone but that they don’t know any
    other way of living. Over the years spent coaching and training many people, I
    have realised that most of the population settle for second because they haven’t
    got the courage to do anything changing their situation. There’s a saying: ‘If
    you always do what you’ve always done you always get what you’ve always got.’
    That’s the mantra of those who live their lives in the Grey Zone. Life in the
    Grey Zone feels familiar, comfortable, unfulfilling and stuck, and those in the
    Grey Zone do not feel they have any choice but to remain where they are.'
