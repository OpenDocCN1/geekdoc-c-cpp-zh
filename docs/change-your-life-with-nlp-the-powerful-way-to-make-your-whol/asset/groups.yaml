    ## 沟通风格


    在神经语言程序（NLP）中，这些被称为“表征系统”，为了简单起见，我将它们称为我们的“沟通风格”。这一切都始于 Bandler 和 Grinder 发现人们说话时使用三种不同的语言风格——视觉、听觉或动觉。后来又增加了第四类“听觉数字”（audio
