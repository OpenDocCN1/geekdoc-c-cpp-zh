    \n- 我想要获得反馈的人是：\n1.\n2.\n3. \n\n- 使用“反馈三明治法”向他们寻求反馈。遵循本章设定的指南，以便你以最有资源且最有效的方式接收反馈。\n\
    \n- 在下方记录你从这个过程中学到了什么。\n\n## 如果你把反馈整合到日常生活中会怎样？\n\n融入反馈将帮助你加速发展进程。就你的目标而言，如果你能对自己的行为获得反馈，你最终会找到一条路。保证这一点。你会发现，生活中所有领域的人际关系都会得到改善。由于一致、开放和诚实成为焦点而非回避，这些关系将变得更深层、更有意义。某些关系可能会让你感到不适，这并不是因为在过程开始时建立足够的共情（rapport）。如果你发现某些同事、朋友和家人不想玩这种“反馈游戏”，那么请考虑这些关系的长期价值——最理想的情况下，它们只能被描述为浅薄。最重要的是，你会在你所做的事情做得更好，你给出和接收反馈的能力将被人注意到并钦佩。\n\
    \n提示：一年给一次反馈就像只在自己生日当天减肥，然后纳闷为什么自己不掉重量。\n\n## 第 11 章\n\n> “千里之行，始于足下。”\n> 老子，中国哲学家\n\
    \n## 开始\n\n## 你的真相时刻\n\n你有力量控制你的所想，你有力量控制你的感受，你还有力量控制你的所所为。现在是你的真相时刻，因为是时候采取行动了。你决定想要在生活中拥有更多。你已经为目标付出了努力，我也协助你建立了成功所需的心态和信念。现在轮到你去努力了。当我们进入个人真相时刻时，你们中有些人可能开始感到有些无从力，这是正常的。意识到你所处的位置，以及这些感受源于哪里。如果你需要在心态上多下些功夫，那么现在就去做，因为我们要开始大干一场了！\n\
    \n而且，我必须告诉你一个成功人士已经知道的秘密——最大的迷言之一就是实现我们的目标需要超人的举动。事实并非如此。我们所做的小决策对命运的影响并不亚于大决策。如果我们做了足够的小决策，我们就能到达那里。我曾问过我的老师：\n\
    \n> “实现目标的秘诀是什么？”\n\n我仍然每天至少想一次他的答案。他说：\n\n> “坚持下去，直到你做到为止！”\n\n这是一个极其简单且充满智慧的陈述，它引导我度过了生活的重大挑战。坚持下去，你将始终实现你的目标。去年圣诞，我的一个孩子在餐桌上读出了爆花筒里的一个笑话。上面写着：\n\
    \n“如何吃掉大象？”\n\n答案是：\n\n“分小块吃。”\n\n你的目标也是如此。我们每一次做决定，都在预先创造我们的未来；每一次做决定都会产生后果。想清楚并知道你无法为每一种意外做计划是非常重要的。这是不可能的。你要从悬崖边缘跳下，保持信念，并在飞行中学习。\n\
    \n> 我早已深信，人们说的话没有一半是真心的，最好的办法是忽略他们的谈话，只根据他们的行动来判断。\n> 多萝丝·日（Dorothy Day）\n\n当我创立业务时，我想找到一种增长的方法，我知道如果我采取行动，最终会找到。我注意到生活中所有领域的人际关系都会改善。由于一致、开放和诚实成为焦点，这些关系变得更深层、更有意义。我想实现我的梦想，当我第一次看到潜力时，我的旅程进入了一个全新的境界。我意识到我不需要知道，我只需要开始。\n\
    \n## 开始\n\n我们的社会习惯于通过网络、电子邮件、短信获得即时满足。然而，如果我们真正成功，我们需要长期的关注。例如，如果我在推迟第一个项目后采取了短期观点，变革公司（Change\
    \ Corporation）可能就不存在了。采取步骤，当事情不符合计划时，找出下一次你需要做什么。\n\n如果你不采取行动，一切都不会改变。\n\n"
