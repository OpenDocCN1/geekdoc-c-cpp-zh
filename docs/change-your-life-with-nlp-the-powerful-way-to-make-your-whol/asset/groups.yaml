    # Deletions, distortions and generalisations


    I spoke earlier of our primary filters, which are to distort, delete and generalise
    information coming into our nervous system. So what specifically happens when
    we delete, distort and generalise data?


    # Deletions


    Let''s have some fun for a moment. Read to yourself the text you see in the triangle
    below.


    ![](img/28d67ab57ddbf33d989344b5416e1e3f_77_0.png)


    More than likely you said to yourself ''a bird in the bush''. If this is what
    you said, then you didn''t notice that the word ''the'' is repeated twice. Look
    again! Your brain does not expect to see the second ''the'' and so it deletes
    it.


    Second test. Count every ''f'' in the text below:


    +   FINISHED FILES ARE THE RE

    SULT OF YEARS OF SCIENT

    FIC STUDY COMBINED WITH

    THE EXPERIENCE OF YEARS...'
