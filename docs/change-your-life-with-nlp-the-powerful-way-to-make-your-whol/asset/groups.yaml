    Record below what it felt like to give the feedback.


    # Part 2 – receiving feedback


    This time, identify three people who are significant to you in the context of
    the area about which you want the feedback, e.g. business, career, health and
    fitness, etc. Pick one person you like, one person you admire and one person who
    you have difficulties with.


    +   The people I want feedback from are:

    1.

    2.

    3.


    +   Ask them for feedback using the feedback sandwich. Follow the guidelines set
    in this chapter for you to receive the feedback in the most resourceful and effective
    way.'
  - '[PAGE 197]


    +   - Record below what you learned from the process.


    # What if you were to integrate feedback in your everyday life?


    Incorporating feedback will help you to fast-track your development process. In
    terms of your goals, if you were to get feedback on your actions, you will eventually
    find a way through. guarantee that. You will notice that the relationships with
    people in all areas of your life will improve. They will become deeper and more
    meaningful with congruence, openness and honesty become the focus instead of avoidance.
    Some relationships may feel uncomfortable and this is not because enough rapport
    has been built at the start of the process. If you find that some of your colleagues,
    friends and family do not want to play the feedback game then consider the long-term
    value of these relationships – at best they can only be described as shallow.
    Most importantly, you will become even better at what you do and your ability
    both to give and receive feedback will be noticed and admired.


    Tip: Giving feedback once a year is like dieting only on your birthday and wondering
    why you''re not losing weight.'
