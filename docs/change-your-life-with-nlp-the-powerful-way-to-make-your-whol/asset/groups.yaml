  - '[PAGE 203]


    I’ve come across a number of people who expected me to sprinkle ‘magic dust’ on
    them so they would leave the room having been ‘changed’. I wish it were that easy.
    If I had ‘magic dust’, then I would be a very rich woman by now. A person or book
    can only be your tour guide – you have to take responsibility for making the changes
    you want in your life.


    So, if you are hoping for some fairy dust then you are reading the wrong book.
    It’s time for you to work out what your first step is to be, and to get started
    – because nothing changes until you take that first step.


    # How to get started


    > Do or do not. There is no try.” Jedi Master Yoda


    When getting started, the most important thing to remember is to go for your goals
    at a 100 per level of commitment. I love this quote from Star Wars because trying
    to take action is like doing nothing at all. If I were to say to you that I will
    ‘try’ to meet you for lunch next week, do you think I’m really committed to meeting
    you? I don’t think so. The word ‘try’ is used in the English language as an excuse
    for doing something in a half-hearted way or not doing it at all. Related to this,
    we’ve already come across in Chapter 9 the NLP presupposition:


    Anything less than 100 per cent is sabotage.


    That means if you are not prepared to go for something 100 per then don’t waste
    your time and money you will be sabotaging your results from the start. For example,
    when I stood at the foot of the fire on the first night of my fire-walking trainer’s
    training I did not ‘try’ to walk the fire. That would be asking for an injury.
    I focused 100 per cent commitment throughout my mind and my body to walking the
    fire and I walked safely that night and every other night.'
  - '[PAGE 204]


    # Lily and Tony – sabotaging their lifestyle


    My clients bought a new house that needed complete renovation. They were newly
    married and both of them had been keen to take on the project. They also had busy
    and demanding jobs. Months went by and they felt felt like they were living in
    the middle of a building site with neither of them having the time to deal with
    the house situation. This put pressure on their relationship and they were close
    to a trial separation when they came to me. They began to understand that the
    house renovation had been too ambitious a project for them at that stage of their
    lives when they needed to be focused on other things. They were more passionate
    about their careers and having fun together. They sold the house, bought a brand
    new property and got their lives back, knowing that they would take on a renovation
    project when they could give it the attention it deserved.


    To get started there are a number of steps that you need to take. Here is a summary
    from what we’ve covered so far.


    +   - Firstly, apply the techniques in this book – set goals, focus on what you
    want, operate at case, learn to believe in yourself, use your internal resources
    to the full. If you ever begin to feel unresourceful when considering taking action
    ask yourself ‘For what purpose do I feel like this? Is it a limiting belief I
    still need to change?’ Start to create new reference points for yourself.


    +   - Secondly, be willing to be flexible and do something different – not, as
    I’ve said before, what you’ve always done. Ask yourself whether you prepared to
    change your circumstances to get your goal. Are you prepared to set boundaries
    and stick to them? For example, if there’s something you want to change in your
    relationship, are you prepared to set a new boundary and stick to it? I have a
    client who has taken back her boyfriend more times than I can count because when
    it comes to her moment of truth she will not enforce the boundary and do something
    different. I’m wondering when the pain will become great enough that she finally
    does something different.'
  - '[PAGE 205]


    +   - Thirdly, and very importantly, be prepared to do whatever it takes to reach
    your goal. When I ask at my taster sessions whether people are prepared to do
    whatever it takes, I can guarantee that a few will always put their hands up immediately.
    Some will look around first to see who has put their hands up and others go into
    fear mode because they do not know what that might mean for them.


    Fear is like many other things – we can build it out of all proportion in our
    heads. The fear feels worse because we focus on it as opposed to focusing on all
    the things that are going well. My strategy when working on fear is to ask myself
    and my clients, ''What is the worst thing that could happen to you on your path
    to achieving your goal?'' In my experience, I''ve found that once you have come
    to terms with the ''worst thing'', it rarely happens. Also, as you have already
    seen, taking small steps towards your goal can be a great way of overcoming any
    fear you used to have.


    Are you ready to get started?


    # Developing your own ‘personal journey plan’


    We are going to work through an exercise that will take you on the journey. I
    have run four marathons in my life so far. I always think that a marathon starts
    and finishes with a single step and that every step I run is a step nearer to
    the finish line. It makes the journey easier and motivates me to keep going even
    when the road seems very long.


    When we worked on our goals, we worked backwards from the point at which we had
    achieved our goal. This time, as we put our personal journey plans together, we
    are going to work outwards from now. We are going to focus on the next year to
    keep the plans manageable. Each year in December I go through a process to revisit
    what I''ve achieved the year before and to review my goals for the following year.
    Some of these goals will stand alone; others will support your longer-term goal.
    The important lesson is to keep the momentum going.'
  - '[PAGE 206]


    Go back to the goals you set for yourself in Chapter 3. Consider for a moment
    the goals you set for yourself at one month, three months, six months and one
    year. Begin the exercise by putting the date one year from today''s day and write
    down again all the goals you set for yourself for the next year. As you write
    them down, begin to think about what actions you need to take to achieve each
    of these goals:


    +   - within 24 hours


    +   - within 48 hours


    +   - within one month


    +   - within three months


    +   - within six months.


    The idea? When you break the goal and actions into smaller chunks it''s easy to
    get started. The other invaluable learning that I have got from this exercise
    is to find yourself a journey plan buddy. Seriously, this should be someone you
    respect and who will give you a hard time should you not stick to your commitments.
    Your buddy, therefore, shouldn''t necessarily be your best friend who will commiserate
    with all your excuses; they should be someone who will challenge you and remind
    you of what it is you are going for. Ideally, it should be someone you know who
    is also reading this book, or else someone who will be open and honest with you
    and who will give you a hard time if necessary. If there is no one then email
    me (details at the back of the book) because we keep a buddy register and will
    put you in touch with someone who can help you and who will ask the same in return
    from you. Book appointments with your buddy at one week, one month, three months,
    six months and the one-year anniversary of this plan. This can be in person, by
    phone or by email. You should give your buddy a copy of your goals and your plan.'
  - '[PAGE 207]


    # CHANGE YOUR LIFE WITH NLP


    # Exercise 30


    My personal journey plan


    +   1. What will I have achieved by (date in one year''s time)?

    - ....................................................................................................................................................

    - ....................................................................................................................................................

    - ....................................................................................................................................................

    - ....................................................................................................................................................

    - ....................................................................................................................................................



    +   2. What''s the first step I need to take in the next 24 hours?


    3. Forty-eight hours?'
