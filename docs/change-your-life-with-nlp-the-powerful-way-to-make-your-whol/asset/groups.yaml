    \ when one feels an impulse to soar’\n\nHelen Keller\n\n# Are you in the Grey\
    \ Zone?\n\nAs a business consultant, I learnt that it was important to begin a\
    \ new change project with a measurement or benchmark of how a company was performing\
    \ at that moment. If you don't know where you're starting from it's harder to\
    \ know where you've moved to. With that in mind, I invite you to complete the\
    \ following quiz to find out if you're in the Awful, Grey or Brilliant zones.\
    \ Be honest with yourself.\n\n# The Personal Discovery Quiz\n\n1. When you wake\
    \ up in the mornings, do you:\n   a. Jump out of bed excited about the day that\
    \ lies ahead\n   b. Have to drag yourself out from under the duvet\n   c. Feel\
    \ exhausted as you've been unable to sleep well?\n\n2. When your friend asks you\
    \ how you are, do you answer:\n   a. 'Absolutely brilliant!'\n   b. 'Mustn't grumble?'\n\
    \   c. 'Don't even ask?'\n\n3. As you consider your goals for the future, do you:\n\
    \   a. Feel really motivated?\n   b. Think 'What goals?'\n   c. Go blank as you're\
    \ struggling to get through today?\n\n4. Your best friend asks you away for an\
    \ exotic holiday. Do you:\n   a. Say 'yes' immediately?\n   b. Panic as you don't\
    \ like going abroad?\n   c. Say 'no' as you're too busy paying off all your debts\
    \ right now?\n\n5. When did you last spend time developing yourself?\n   a. Within\
    \ the past month.\n   b. You can't remember.\n   c. You think ‘What’s the point?’\n\
    \n6. An opportunity for you to go for promotion comes up. Do you:\n   a. Relish\
    \ the challenge?\n   b. Tell yourself you'll never get it?\n   c. Behave like\
    \ an ostrich as you can't be bothered to think about it?\n\nAdd up the number\
    \ of times you chose each letter, and then see below what the results suggest\
    \ about you:\n\n**Highest score ‘Cs’** – imagine that your life feels at rock\
    \ bottom right. When does it get bad enough for you to shift yourself out of the\
    \ **Awful Zone**?\n\n**Highest score ‘Bs’** – even if you don't realise it, you\
    \ are firmly in the **Grey Zone** and it's time to work out what you really want.\n\
    \n**Highest score ‘As’** – congratulations! You are already moving in the direction\
    \ of the **Brilliant Zone** where life is pretty amazing, and I'll show you how\
    \ it can get even better.\n\n# The Awful Zone\n\n> “By changing what we link pain\
    \ and pleasure to we will instantly change our behaviour.\nTony Robbins\n\nPeople\
    \ move into the Awful Zone frequently when a life-changing event occurs that leads\
    \ to the equilibrium and malaise of the Grey Zone being disturbed. For example,\
    \ the death of a loved one, the onset of a life-threatening illness, divorce and\
    \ so on.\n\nWhy is it that some people can experience pain and still fail to change?\
    \ In my experience it's because they haven't experienced enough pain yet. Every\
    \ one of us has a threshold for pain and once that threshold is crossed, change\
    \ will occur. The threshold is different for everyone. That is why soldiers returning\
    \ from active service may respond differently to their experiences; one may get\
    \ on with their life as if nothing has happened and the other suffer from post-traumatic\
    \ stress disorder. The Awful Zone is the point of no return. This is the place\
    \ where the pain gets so great that you finally take action. At this point, although\
    \ it is bizarre to describe it as such, the pain does you a favour as it drives\
    \ you to take action and produce different results. This is the terrain of the\
    \ Awful Zone.\n\n# Kay – facing the most challenging circumstances of her life\n\
    \nKay had worked in local government for 20 years. She was a third-tier manager\
    \ in a busy social services department in London. She decided not to go for promotion\
    \ until the opportunity arose as she had recently had her son. Her new boss was\
    \ incompetent at his job and lazy. This had a “double whammy effect” as he over-delegated\
    \ and she had to pick up the pieces when he didn't do his job properly. She soon\
    \ became extremely unhappy. She was in the Grey Zone as she had worked for this\
    \ organisation for the whole of her working life and she knew nothing else. Yet,\
    \ she was too afraid to move into nothing new.\n\nThen a life-changing experience\
    \ occurred that tipped her into the Awful Zone. Her brother-in-law, who was in\
    \ his mid-forties, was diagnosed with an operable brain tumour. He had been married\
    \ to her sister for 20 years and although they had always thought they would have\
    \ children, they had to come to terms with the fact that it was unlikely to happen\
    \ now. Imagine how happy they were when his wife discovered she was pregnant.\
    \ This was five months before her husband's diagnosis. The pregnancy became fraught\
    \ with the expectation of new life and loss of life at the same time. In the end,\
    \ deteriorated fast and died a week after his daughter was born. It was as if\
    \ he held on long enough to hold his new daughter in his arms and then it was\
    \ time.\n\nThe significance of this experience for Kay was life changing: being\
    \ with her sister and her brother-in-law throughout these tragic circumstances\
    \ was the tipping point. She decided to take action at work and took the matter\
    \ up formally. Despite her loyalty of service and her well-known ability to deliver\
    \ results, the Authority failed to deal with the situation. She decided that life\
    \ was too short to spend any more time in a job that caused so unhappiness and\
    \ she finally left.\n\nShe decided to set up her own company where she would be\
    \ the controller of her own universe and her life began to improve.\n\nOne of\
    \ the important questions for you is, ‘when is the pain bad enough?’ Do you want\
    \ to find yourself looking back on your life full of regret? The great thing is\
    \ that it's never too late to change.\n\n# The Grey Zone\n\n> People often end\
    \ up feeling that their lives have been wasted, that instead of being filled with\
    \ happiness their years were spent in anxiety and boredom.\nMihaly Csikszentmihalyi\n\
    \nI describe the Grey Zone as that place where many people spend their entire\
    \ lives – it’s not awful and it’s certainly not brilliant. It’s the place where\
    \ people are prepared to sell out their dreams for a comfortable existence. What\
    \ a waste of a life! Often people are happy in the Grey Zone but that don’t know\
    \ any other way of living. Over the years spent coaching and training many people,\
    \ I have realised that most of the population settle for second because they haven't\
    \ got the courage to do anything changing their situation. There’s a saying: ‘If\
    \ you always do what you’ve always done you always get what you’ve always got.’\
    \ That’s the mantra of those who live their lives in the Grey Zone. Life in the\
    \ Grey Zone feels familiar, comfortable, unfulfilling and stuck, and those in\
    \ the Grey Zone do not feel they have any choice but to remain where they are.\n"
  mdcn: "\n用 NLP（神经语言程序）改变你的生活\n\n这些练习证明了 NLP 是趣味性的且能够快速见效——它为的大脑提供了一份操作手册。\n\n# NLP\
    \ 在书中是如何运用的\n\n在书中，你将学习并应用 NLP 提供的许多工具和技术：\n\n- 理解成功的秘诀\n- 设定让你充满动力去实现的感人目标\n\
    - 理解是什么在驱动着你\n- 专注于你想要的东西以吸引它的到来\n- 对你想创造的改变承担个人责任\n- 创建关于自己的赋能信念\n- 瞬间改变你的感受和想法\n\
    - 重新建构旧观念\n- 掌控你的时间\n- 最大化你的个人能量和力量\n- 利用反馈提升到下一个水平\n- 建立你的个人韧性\n- 从经验中学习\n- 模仿他人的卓越成果\n\
    - 最后——全力以赴。\n\n其中许多工具和技术源自传统的 NLP，另一些我根据当今的现实进行了调整。我知道这本书将改变你的生活。你准备好开启这段旅程了吗？\n\
    \n提示：如果你总是做过去一直在做的事，你就只会得到一直得到的结果！信息很明确：如果你所做的事情不起作用，就去做一些不同的尝试。\n\n## 第二章\n\n\
    > “当一个人感到想要飞翔的冲动时，永远不会同意爬行”\n\n海伦·凯勒（Helen Keller）\n\n# 你处于灰色地带吗？\n\n作为一名商业顾问，我了解到在启动一个新改变项目时，对公司当时的表现进行衡量或基准测试是非常重要的。如果你不知道自己从哪里开始，就很难知道自己移动到了哪里。考虑到这一点，我邀请你完成以下测验，看看你处于“糟糕地带”、“灰色地带”还是“卓越地带”。请对自己诚实。\n\
    \n# 自我发现测验\n\n1. 当你早上醒来时，你：\n   a. 兴奋地跳下床，对到来的一天充满期待\n   b. 必须把自己从被子里拖出来\n   c.\
    \ 感到精疲力竭，因为没睡好？\n\n2. 当你的朋友问你怎么样时，你回答：\n   a. “太棒了！”\n   b. “还行吧？”\n   c. “别提了？”\
    \ \n\n3. 当你考虑未来的目标时，你：\n   a. 感到非常有动力？\n   b. 想：“什么目标？”\n   c. 大脑空白，因为你正挣扎着度过今天？\n\
    \n4. 你的好朋友邀请你去异国情调度假。你：\n   a. 立即说“好”？\n   b. 因为不喜欢出国而感到恐慌？\n   c. 说“不”，因为你现在正忙于还所有的债务？\n\
    \n5. 你上一次花时间提升自己是什么时候？\n   a. 在过去一个月内。\n   b. 你记不得。\n   c. 你在想：“有什么意义？”\n\n6.\
    \ 有一个升职机会出现。你：\n   a. 享受这种挑战？\n   b. 告诉自己你永远得不到？\n   c. 像鸵鸟一样，因为你懒得去想它？\n\n统计你选择每个字母的次数，然后查看下方的结果对你说明了什么：\n\
    \n**C 分数最高** —— 想象你的生活现在正处于谷底。什么时候情况会变得足够足够糟糕，足以让你让自己离开**糟糕地带**？\n\n**B 分数最高**\
    \ —— 即使你没有意识到，你也正稳固地处于**灰色地带**，是时候弄清楚你真正想要什么了。\n\n**A 分数最高** —— 恭喜！你已经在朝着**卓越地带**的方向移动，那里的生活非常奇，我将向你展示它可以如何变得更好。\n\
    \n# 糟糕地带\n\n> “通过改变我们对痛苦和快乐的联结，我们将立即改变自己的行为。”\n> 托尼·罗宾斯（Tony Robbins）\n\n当发生改变人生的事件时，由于这些事件打破了灰色地带的平衡和不适，人们经常会进入糟糕地带。例如，亲人的去世、致命性疾病的发作、离婚等。\n\
    \n为什么有些人即使经历了痛苦却仍然无法改变？根据我的经验，这是因为他们经历的痛苦还不够。我们每个人都有一个痛苦阈值，一旦过了那个阈值，改变就会发生。每个人的阈值都是不同的。这就是为什么从战场归来的士兵对他们的经历反应可能不同；一个人可能若无其事地继续生活，而另一个人则患有创后应激障碍。糟糕地带是不不回头之路。这是一个痛苦变得巨大到令你最终采取行动的地方。在这一点上，尽管这样描述很奇怪，但痛苦对你是有帮助的，因为它驱使你采取行动并产生不同的结果。这就是糟糕地带的领域。\n\
    \n# Kay —— 面对她中最具挑战的时刻\n\nKay 在地方政府工作了20年。她是伦敦一个繁忙的社会服务部门的三级经理。她决定在机会出现之前不寻求升职，因为她最近生了孩子。她的新老板工作上无能且懒散。这产生了一种“双重打击效应”，因为他过度分配任务，当他没能好好完成工作时，她就不得不收拾残局。她很快变得极度不快乐。她处于灰色地带，因为她在这个组织工作了整个职业，对其他事物一无所知。然而，她太害怕进入新领域了。\n\
    \n然后，一个改变人生的经历发生了，将她推入了糟糕地带。她的姐夫四十多岁，被诊断患有可以手术的脑瘤。他和她的姐姐结婚了20年，尽管他们一直认为会有孩子，但他们必须接受现在不太可能发生这种情况的事实。想象一下当他的妻子发现怀孕时，他们有多开心。这在她丈夫被诊断出疾病五个月前。怀孕充满了对新生命的期待和对生命丧失的恐恐惧。最后，病情迅速恶化，在女儿出生一周后去世了。仿佛他坚持了足够久，将新女儿抱在怀里，然后时间到了。\n\
    \n这段经历对 Kay 来说是改变人生的：在这些悲剧性的时刻全程陪伴她的姐姐和姐夫是转折点。她决定在工作中采取行动，并正式提出了该问题。尽管她服务忠诚且以交付成果的能力而闻名，但机构仍未能处理这一局面。她决定人生太短，不应该再花时间待在一个引起如此不快乐的工作中，她最终离开了。\n\
    \n她决定建立自己的公司，在那里她将成为自己宇宙的主宰人，她的生活开始改善。\n\n对你来说重要的问题之一是：“痛苦什么时候足够糟糕？”你想发现自己回首人生充满遗憾吗？最棒的一点是，改变永远不晚。\n\
    \n# 灰色地带\n\n> 人们往往觉得自己的生活被浪费了，他们的岁月并没有充满快乐，而是在焦虑和无聊中度过的。\n> 米哈里·契克森特米哈（Mihaly\
    \ Csikszentmihalyi）\n\n我将灰色地带描述为许多人度过整个生活的地方——它既不糟糕也绝不卓越。它是人们准备好为了舒适的生活而出卖梦想的地方。多么生命的浪费啊！人们在灰色地带通常是快乐的，但他们不知道其他的生活方式。在多年来教练和培训许多人的过程中，我意识到大多数人安于次之选择，因为他们没有勇气去做任何改变现状的事。有一句俗语说：“如果你总是做过去一直在做的事，你就只会得到一直得到的结果。”这是那些在灰色地带生活的人的格言。灰色地带的生活感到熟悉、舒适、不充实且停滞不前，灰色地带的人认为自己没有其他选择，只能留在原地。\n\
    \n"
