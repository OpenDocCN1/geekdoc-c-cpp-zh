    of her NLP training company. I was thrilled about this although I wanted to set
    up my own business for at least two years I hadn''t had the courage go out completely
    on my own. Her company was already successful and making very good profits. However,
    after a very short period of time things began to go wrong. I couldn''t understand
    this as I believed that I was focusing on my goal to'
  - '[PAGE 59]


    CHANGE YOUR LIFE WITH NLP

    have my own NLP training goal. Then one day something happened which had a profound
    effect on me. I had written a proposal for a potential new client and given it
    to our office manager to submit. Unknown to me, she gave it to my partner and
    it came back later covered in red pen as she disagreed with many of my ideas.
    I felt angry and hurt and suddenly dawned on me that I was dancing to her tune,
    pursuing her dream and not my own. It was one of those light-bulb moments when
    I realised I would not be happy until I was free to be true to my own goals and
    aspirations. I left soon afterwards and went back to my old employer for a while,
    rather bruised by the experience. Had seen her offer to me as a shortcut to having
    my own successful company. It seemed ideal and yet I was always likely to sell
    out on my own dreams in that situation.


    These were powerful learnings for me. One of the principles of NLP is that ''there
    is no failure – only feedback'', and I found this to be very motivating in this
    situation. I focused on my learnings from this experience, which should always
    be for the future and for yourself and be positive.


    My learnings were as follows.


    +   - When you take 100 per cent responsibility for achieving your outcome and
    are willing to do it all by yourself, you won''t have to.

    - To the extent that you are not willing to do it all by yourself, you''ll have
    to.

    - When you don''t take 100 per cent responsibility for achieving your outcome,
    you are not working magic, you are playing with luck.

    - The only benefit of not taking 100 per cent responsibility for achieving your
    outcome is that you''ll always have someone to blame.


    I refocused on my dream and though it took another three years before I finally
    made the decision to focus on my new company full-time, I got there.'
