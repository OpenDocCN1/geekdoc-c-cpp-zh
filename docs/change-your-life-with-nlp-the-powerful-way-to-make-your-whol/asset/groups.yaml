    # Proactive/Reactive


    # Proactive people


    Proactive people like to get on with things. They are more likely to take responsibility
    for making things happen and they will certainly take over if others around them
    are seen to be too ‘slow’. They enjoy action and getting stuff done.


    Words and phrases they might use: Let’s do it; it’s time; focus; action


    # Reactive people


    They prefer to wait for others to make the first move, and like to explore all
    the consequences of taking action before taking any. Often this means life has
    moved on and left them behind. They won’t make a move unless they are 100 per
    cent convinced that it’s the right thing to do.


    Words and phrases they might use: There’s no rush, let’s see what others do first,
    what will happen if I do/don’t take action, think about it, wait'
  - '[PAGE 231]


    CHANGE YOUR LIFE WITH NLP


    # Internal/External


    # Internal people


    Internal people evaluate things on the basis of what they think is appropriate.
    They provide their own motivation and make their own decisions. They decide what
    they want to do and how they will go about doing it. They can be quite opinionated
    and have difficulty accepting other people''s direction and feedback. These people
    like to decide for themselves. They have difficulty accept- either feedback or
    praise. They respond best to phrases like, ‘Only you can decide to...’


    Words and phrases they might use: Let''s do it this way; that''s the way it''s
    done; I just know.


    # External people


    External people need external feedback to feel good about themselves. Other sources
    provide the information which they accept. They need external standards and feedback.
    These people need to be managed. They need to know what to do and how to do it.
    They need feedback and praise (or constructive criticism).


    Words and phrases they might use: Tell me what you think; let me know; give me
    feedback; was it OK?


    # Sameness/Difference


    # Sameness people


    Sameness people will first notice the similarities and then notice differences.
    They may discuss how things have gradu-ally changed over time. They like things
    to remain relatively the same. They are not comfortable with change unless it
    occurs slowly and gradually. They talk about how things are the same. They will
    discuss some common features or things that have not changed. They will respond
    better to things that are ‘improved, better, or slightly more advanced’, but they
    will resist things that are new.


    214'
  - '[PAGE 232]


    # APPENDIX 1: MY META PROGRAMMES


    Words and phrases they might use: ''same; same as; in common; keep the same; maintain;
    better; same except; evolved; gradual; evolutionary


    # Difference people


    Difference people will notice things that are different from or mismatch what
    they have noticed previously. They like change and variety. They don''t like static
    or stable situations. Change doesn''t have to be revolutionary, but it does have
    to happen. Often they are constantly reorganising. Most will notice the differences
    first, and then the similarities.


    Words and phrases they might use: new; different; changed; unusual


    # Specific/Global


    # Specific people


    Specific people give you all of the small details and will go down several levels
    in explaining. They are comfortable with and able to understand small pieces of
    data. They talk with and about sequences. They prefer things to be arranged in
    sequences. When they describe something they will talk about the steps in the
    event. If interrupted, they will often go back to the first step. They are not
    able to make sense of the larger picture and often have difficulty with priorities.


    With these people it''s best to break things down into specifics and stress the
    details.


    Words and phrases they might use: exactly; specifically; precisely; first – second
    – then – next


    # Global people


    Global people give you the big picture without any of the details. They will describe
    a situation in random order without using proper nouns or extra modifiers. They
    are most comfortable with large chunks of information. They make sense of the
    world in terms of the overall framework of a situation,'
  - '[PAGE 233]


    usually seeing the whole project at once. They can conceive of and work with the
    parts as necessary, but they usually see them as random bits of the larger framework.
    They tend to speak in simple sentences with few prepositional phrases. If you
    present too many details, they will ask you what it means or ask you to move on.
    However, you should expect that they may fill in the details differently from
    the way you would.


    Words and phrases they might use: generally; overview; big picture; framework


    #  Attention on others/Self


    # Attention on others people


    You can always tell a person with attention on others because they are interested
    in what''s going around them and they like to find out about people. They have
    their attention ''outside'' of themselves and are good at building rapport with
    others. They tend to be quite animated individuals and they take notice of what
    others are doing. They are the kind of people you''d want as cabin crew on an
    airline.


    Words and phrases they might use: Can I help? How are you? What do you need? I
    noticed you were looking x''d


    # Attention on self people


    In contrast, attention on self people are very inward facing. You could drop something
    in front of them and they would be unlikely to look up. They are that behind the
    counter at the local shop who seems to ''ignore'' you for ages whilst they get
    on with what they are doing first without noticing you are there. These people
    tend to miss non-verbal clues and make short responses to you when they notice
    you there.


    Words and phrases they might use: Sorry didn''t see you there; What was it that
    you wanted? I''m busy at the moment, can it wait?'
