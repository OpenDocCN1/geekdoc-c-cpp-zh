    # Distortions


    We attach meanings to things that are our ''mind-reads''. The trouble is that
    we then confuse them with reality. For example, my bank manager looked at me in
    a disinterested way when I asked for a loan I could take that to mean that he
    will refuse my request. However, it may be that he just wants to leave work early
    nothing to do with my request! Sometimes we arbitrarily interpret reality and
    end up distorting its meaning. We attach meanings that don''t exist and end up
    making huge assumptions. A glance or a gesture may have thousands of meanings
    and it is so easy to interpret the wrong one. Distortions get in the way of our
    goals when we attach the wrong meaning to important issues. Find out a more accurate
    meaning by asking! The people who are most successful check things out: they say
    things as they are and they are not afraid to give and ask for feedback in order
    to get more accurate information.


    # The unconscious mind


    At this point it''s probably time to say something about the unconscious mind
    and why it''s important in NLP. The ''unconscious'' refers to that part of mental
    functioning of which we are often unaware. Our unconscious by definition includes
    most of what is simply not conscious thought. This includes what is actively repressed
    from conscious thought, such as negative emotions and painful experiences, as
    well as all our memories and our true feelings about things. It is believed that
    our unconscious mind holds all our memories of everything that we have ever experienced.
    We cannot hold that data consciously or else would be overloaded with information
    very quickly. Our unconscious mind often presents issues to us for resolution.
    Remember the last time something important popped into your head. That is unconscious
    mind making you aware of things: For example, if you make a conscious decision
    about something that you then get a negative feeling about, that is your unconscious
    making you aware of a potential issue. Often thoughts come into our minds during
    the day'
