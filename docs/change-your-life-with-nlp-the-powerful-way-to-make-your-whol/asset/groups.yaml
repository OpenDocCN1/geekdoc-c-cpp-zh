    # 放松


    放下“没实现目标也没关系”这一点也很重要。这听起来可能和我之前说的你的目标具有吸引力的话相矛盾。然而，如果“没实现目标”


    # 如果你知道自己不会失败，你会怎么做


    对你来说没关系，你就会专注于对获取目标的焦虑。如果你关注并将注意力放在你不想要的东西上（见第 4 章），你很可能会恰恰吸引那个东西来到你身边。如何避免这一点？一种方法是考虑如果你没实现目标可能会发生的最坏的情况——但仅持续到你接受并放手它为止。例如，我考虑过如果我没有实现经营成功公司的目标，可能发生的最坏的情况是什么。对我来说，这意味着我需要回到带薪工作，并且对此感觉良好。然后我把这个念头抛在脑后，将所有的精力集中在公司的成功上。


    # 继续努力


    NLP 的共同创造者约翰·格林德（John Grinder）说，根据他的经验，阻碍人们实现目标的单一关键因素是他们没有“目标之外的目标”。如果没有可以追求的目标，他们可能会失去动力，甚至自我破坏。例如，假设我的目标是爬上一座山，我为此进行了长时间的刻苦训练。当我到达山顶时，如果我已经在看向下一座更高的山峰，我可能会失去动力。我甚至可能滑回“灰色地带”，因为我失去了人生活的焦点和方向。所以，享受旅程并始终意识到接下来将发生什么是非常重要的。


    # 目标的责任


    我实际上辞过两次薪水优厚且舒适的工作。第一次是我的朋友邀请我成为她的业务合伙人和她 NLP 培训公司的共同董事。我对此非常兴奋，尽管我想至少在两年内建立自己的业务，但我还没有勇气完全独立。她的公司已经成功并赚取了非常丰厚的利润。然而，在很短的时间之后，事情开始变得糟糕。


