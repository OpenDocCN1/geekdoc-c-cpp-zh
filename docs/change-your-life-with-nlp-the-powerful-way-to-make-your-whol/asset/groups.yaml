    ears. During a breakthrough session she was asked what it was that she didn''t
    want to hear in her life. Sure enough, she had been influenced by a series of
    dominating men - first her father, then her brothers and then her husband. She
    wanted to break free and didn''t know how. The really interesting thing was that
