    can discover the trigger for the disease and heal it, the illness may spontaneously
    disappear. I know that it sounds far fetched but I have witnessed so many examples
    that it does happen. Here''s just one powerful example.


    > Sonja''s story

    Sonja had experienced deafness from an early age. She wore hearing aids in both
    ears. During a breakthrough session she was asked what it was that she didn''t
    want to hear in life. Sure enough, she had been influenced by a series of men
    - first her father, then her brothers and then her husband. She wanted to break
    free and didn''t know how. The really interesting thing was that she said that
    she loved to go alone to the cinema, and when in the cinema she took out her hearing
    aids and could hear.


    At the end of the session she courageously removed her hearing aids to find she
    could hear again. I witnessed the whole thing with my own eyes. Her close friend
    and travelling companion was a doctor and he couldn’t believe what he had seen.
    It was also a wonderful convincer for everyone involved of the power of the mind
    and of the power of being at cause in your universe.


    Tip: Be at cause in everything you do and notice the magic in life as nothing
    is left to chance or to others to achieve on your behalf.

