    # 用 NLP 改变你的生活


    旅程。我将为你提供帮助，并祝贺你有勇气面对正在发生的一切。对你来说，这是决策的时刻，你有机会改变未来。未来并不一定要和过去一样——你永远拥有选择。记住这一点。


    ## 练习 1


    我在生命网格中处于什么位置？


    在读了这三个区域以及其中人们的故事后，我在想你现在在哪里？你想发现答案吗？你准备好发现了吗？呼吸，找一支笔，迈出通向“辉煌区”（Brilliant Zone）旅程的第一步。


    记住你对本章开头测试的回答，在生命网格上标记出你认为所在的位置（见图表）。对自己诚实。你更接近“糟糕区”（Awful Zone）还是“辉煌区”？


    当你看着这个网格时，你会对自己自己的落点感到惊讶吗？现在你更有意识地意识到了生活的真实状态，让我们考虑一下如何开始向“辉煌区”迈出第一步。


    ![](img/28d67ab57ddbf33d989344b5416e1e3f_37_0.png)


    ## 如何离开“灰色区”（Grey Zone）？


    为什么人们会留在“灰色区”？在我讨论过的例子中，同一个原因让每个人都留在了灰色区——**恐惧**。我们害怕进入未知，害怕做一些不同的事情。恐惧源于我们对自身和能力的局限性信念。事实上，改变带来的后果往往在我们的脑海中被夸大，其意义远比实际情况要糟糕得多。这里有一个关于恐惧的绝佳缩写：


    **虚假证据伪装成事实（False Evidence Appearing Real）**


    我们的大脑非常擅长在脑海中创造最坏的情况，然后我们开始将其作为自己的现实来关注。很快，我们就忘记了那并非事实。我们根据自己的信念体系，对可能真实或不真实的事物做出巨大的假设。猜怎么着？我们的信念是由早年影响我们的人所泛化给我们的。它们并不是真实的。如果我们准备好去发现并开始这段旅程，现实会大不相同。


    离开“灰色区”需要两种情况之一：要么你有一个如此有吸引力的目标，以至于你愿意冒风险去追求；或者，痛苦变得如此巨大，最终把你推向改变的边缘。


    哪种因素影响我们通常取决于我们被激励的方式。在 NLP 中，我们谈论人们是“目标型”（towards）还是“回避型”（away from）动机。想一想：你是逃避你不想要的东西，还是趋向你想要的东西？你是“大棒”型的人还是“胡萝卜”型？例如，如果你想减肥，你是向着健身和健康的目标移动，并在脑海中浮现出自己穿那件紧身新衣服的形象，还是为了逃避肥胖，专注于自己由于超重而要挤破那件特别衣服的形象？


    ## 坚持你的决心


    “回避型”动机的局限性之一是，一旦获得短期改善，动力往往就会消失。例如，许多人的新年计划（尽管他们可能没有意识到）都是关于离开“灰色区”甚至是“糟糕区”的。他们开始得很好，采取行动，没多久他们就在朝着正确的方向移动。当他们开始注意到生活的改善时，他们又变得舒适起来。仿佛变魔法一样，他们的动力蒸发了，行动也缩减为无。事实上，最坏的情况是，当痛苦再次增加时，他们开始向“糟糕区”漂移。这就是为什么许多饮食计划无效的原因，因为一旦达到目标体重，你又感到舒适，并受到诱惑回到旧习惯。另一种选择是向健康的生活方式移动，让运动成为生活的一部分。


    ## 练习 2


    我是“目标型”还是“回避型”动机？


    问自己以下问题并写下你的答案：


    - 我在生活中想要什么？

    - 节省钱 ~ 100

    - 每月 200

    - 减少开支 / 月

    - 减少玩游戏 / 学校

    - 减少担心 / 恐惧

    - 健的身体

    - 平衡


    注意你的答案中有多少是以“不想要”开头的。如果你的答案关注的是你不想要的东西，你更可能是“回避型”动机。例如，“我不想贫穷”就是一个“回避型”动机的例子。如果你的答案关注的是你想要的东西，你更可能是“目标型”动机。例如，“我想要富裕”就是一个目标型动机的例子。或者你可能会把“我不想无聊”（回避）转为“我想旅行”（目标）。


    现在考虑离开“灰色区”需要什么，并写下你是“目标型”还是“回避型”动机。


    好消息是，你永远可以改变。如果你相信你可以做到，你就会这样做。写下离开“灰色区”需要什么。


    ## 练习 3


    如果我知道自己不会失败，我在生活中想要什么？


    问自己以下问题并写下你的答案：


    如果你想改变，现在就是时刻。写下你的答案：


    - 我在生活中想要什么？

    - 节省钱 ~ 100

    - 每月 200

    - 减少开支 / 月

    - 减少玩游戏 / 学校

    - 减少担心 / 恐惧

    - 健的身体

    - 平衡


    如果你想改变，现在就是时刻。写下你的答案：


    ## 凯伦——花开的未来


    我的一位客户在工作中感到不满足，并变得越来越躁不安。她请求我帮助她发现自己想要什么。当被问及如果不会失败会做什么时，她惊讶地听到自己说“开一家花店”。从那以后，她在旧工作中转为兼职，每个周末在伦敦的一家成功花店学习学艺。


    ## 为什么要梦想？


    托马斯·爱迪逊是一个时代最高产的发明家之一。他因发明灯泡而最为人知。为了开发一种高效的灯，他至少尝试了 3000 次。多年来，我遇到的最受启发性并经常引用的名言之一来自爱迪逊：


    > 我没有沮丧，我只是发现了 10,000 种行不通的方法。


    '
