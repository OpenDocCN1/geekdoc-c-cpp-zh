    迈克尔——思想与行为的对齐

    迈克尔经常打网球。然而，他越来越不喜欢了。他喜欢参加双打比赛，但最近第一轮就输掉了大部分比赛，想和他搭的人越来越少。他几乎要放弃这项爱好，直到他听到了思想的力量。他第一次注意自己的想法，发现自己一直在无意识地关注比赛中可能发生的所有错误。难怪他会自己吸引这些事情。一旦他意识到了这一点，他开始将想法改为积极的想法，现在有一排队的人想和他一起打。


