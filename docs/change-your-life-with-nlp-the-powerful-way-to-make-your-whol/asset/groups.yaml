  - '[PAGE 10]


    # Foreword


    The first edition of this book was my own personal example of how you can use
    NLP to change your life. I was 47 when I wrote this book. It was my first. Motivated
    and excited at the potential I''d already found for NLP to change I set upon the
    ambitious task of reaching far more people than I could ever hope to train!


    The book achieved more than I dared to dream about in assisting-readers to pluck
    up the courage to take the first step towards their dreams.


    It''s not an NLP textbook in the traditional sense of the word, nor was it ever
    meant to be. So, if you already know a lot about NLP or if you want a theoretical
    guide to NLP, this may not be the book for you. However, if you want to gain the
    basics of NLP and, most importantly, be able to apply the tools and techniques
    to make a difference in your life or the lives of others, then this book offers
    you a ''how to'' guide with lots of practical exercises explained in terms that
    anyone can understand and then apply.


    When I was asked for a second edition, I wondered what to add to widen the tools
    I could offer to you. Two new chapters emerged. The first, called ''Who am I?'',
    uses NLP tools to show you who you are at your core. Self-awareness is the initial
    step towards personal leadership as you learn about your own personality. The
    second is called ''Influencing with Integrity'', which shows you how to communicate
    more effectively and make more impact with others.


    Enjoy the journey...'
