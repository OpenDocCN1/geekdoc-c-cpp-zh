    # ## 2. Convex Polygon Base Visibility


    A polygon is convex if any line segment joining two points on it lies entirely
    or on the boundary of it. Figure 1 shows and are examples of convex polygons.
    If robots are positioned at the vertices of a convex polygon, then they are completely
    visible to each other. To our knowledge, complete visibility so far follows this
    strategy. However, we recognize that visibility does not require such an approach.
    In this paper we consider a class of "convex polygon base visibility algorithms."
    Each algorithm in this class has the following features:


    +   - Phase 0 (Initialization): A set of points that are not collinear (a de-convex
    hull). This phase puts out robots in an initial configuration, so that they can
    start with a convex hull. If all $n$ robots are in a collinear initial configuration,
    a subset of robots with a small constant distance to the line on which they form
    a convex hull. Figure 1(a) illustrates this.

    - Phase 1 (Interior Depletion): By the start of phase, all robots are on the perimeter
    or inside a convex polygon. The goal of this phase is to move all the robots from
    the interior to the convex polygon. This results in a configuration where all
    robots are either corners of the convex polygon or along its edges. See Figure
    1(b)).

    - Phase 2 (Edge Depletion): Robots on the sides of the convex polygon will move
    outward to become corners of a new convex polygon. This phase iterates multiple
    times until no robots remain, and then, all robots are corners. This configuration
    is sufficient for complete visibility.


