    **Abstract** – Controller placement problem in the software defined SDN is an
    optimization problem modeled after the classical facility location problem optimization.
    We failed to addressing the same problem in WAN, placing multiple controllers,
    building a hierarchy of controllers, covering multi-domain controllers, and recently
    trying to solve controller placement problem in hypervisor and virtual network
    environments. Thanks to the virtual network environment of SDN, organizations
    are provisioning their workloads on-premises, co-located, or on cloud infrastructures
    based on demand and service level objectives. The problem that we address in this
    paper is the collaborative controller placement problem where infrastructure providers
    are offering end-to-end services to users and offering resources for each SDN
    SDN. Collaborative controller placement problem is modeled after the classical
    facility location problem. In this paper, we developed mixed integer programming
    for the problem. We conclude that it is not fundamentally different than the forms
    of the controller placement problem but it can be used in different settings where
    infrastructure providers may charge for the resources and may create marketplace
    platforms. We outline settings and further address hierarchy and resiliency scenarios
