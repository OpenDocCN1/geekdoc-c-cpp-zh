    # ## 4. Our Method


    # ### 4.1 Consideration


    In the previous methods for fault-tolerant routing in the dual-cube, even though
    the limited-global information models are similar in that they select the node-global
    information to forward the messages. In the hypercube, the number of preferred
    nodes is equal to the distance between the current node, that is, the node that
    holds the message, and the destination node. Therefore, if the current and destination
    nodes are not coincident, there are multiple preferred nodes. Here, the routing
    algorithm selects the neighbor with the best-global information. However, in the
    dual-cube, the number of preferred nodes does not depend on the distance between
    the current node and destination node. Specifically, if those of the current node
    and destination nodes are different, the routing algorithm must select a cross-edge.
    In the situation, there is a single preferred node. Therefore, the strategy that
    selects the neighbor with the best-global information does not work well. However,
    we would introduce additional information and modify the routing algorithm in
    a dual-cube to improve performance.


    Our method is obtained by using fault information of cross-edges. In the rest
    of this section, we first explain the drawback of the method by Park et al. Then,
    we show an example in which we can solve the problem by introducing the fault
    information of cross-edges.


