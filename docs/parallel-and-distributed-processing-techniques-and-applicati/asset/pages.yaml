  md: '# Other Applications


    Complete visibility allows for other problems to be solved. For example, leader
    election and gathering can be solved without further movement if visibility is
    solved. The Gathering problem can be solved (on a model with lights), with a constant
    number of movements within the convex hull of configuration [29], [20]. Therefore
    assembly robots can operate in any arbitrary configuration with the following
    results.


    **Theorem 11.** *Leader Election and Gathering problems can be solved with lights
    having O(1) distance and spatial complexities.*


    # Conclusion


    In this paper we have introduced the ideas of spatial and temporal complexities
    of a robot swarm algorithm. These complexities assess the algorithm to preserve
    battery and component life, to operate in small spaces. We considered a class
    of visibility algorithms on corners of a convex hull and proved that all algorithms
    have O(1) distance and spatial complexities. The algorithm of [ et al. [25], [24]
    run in constant time (those of Vayidathan et al. [28]) in logarithmic time and
    of Di Lu [12], in linear time. All these algorithms consider point robots on a
    real plan, using the "infinite precision" to allocate robots into small spaces.
    The algorithm of Vayidathan and Di Lu also use this ability. Our configurations
    allow for robots with the perimeter of the convex hull which does not have sufficient
    room for all robots. In a situation in which the robots have no sufficiently large
    space (such as speed booths in the ocean), these algorithms can be easily modified
    to accommodate the robots and the algorithm would run accordingly. Unlike our
    algorithm, we use the ability of an algorithm that could turn into corners if
    it needs to operate over a large area, but some of the corners have a dense distribution
    of robots. In this context, the fact that the algorithm of Vayidathan et al. are
    slower is of the factor that they exhibit limited distance and spatial complexities.


    As we noted in Section 6, the results of this paper enable further results. That
    is, using spatial and temporal complexities in algorithm design for a wide range
    of problems would serve to amplify the utility of many algorithms.


    # References


    +   [1] H. Ando, I. Suzuki, and M. Yamamoto. Formation and agreement problems
    for multiple mobile robots with lights. In: RSC pages 453–460, 1995.


    Using Lemmas 2, 3 and 7 we have the main result of this section.


    **Theorem 8:** *(The maximum (and hence, average) distance of convex hull complete
    visibility algorithms are O(1)).*


    In Lemma 4 and Corollary 1, one could say the distance complexity of Theorem 8
    is likely optimal.


    # Spatial Complexity


    The distance complexity of a robot reflects the distance covered by the robot
    in the course of the algorithm. The spatial complexity reflects the amount of
    room needed for the robots to execute. This is an important determinant of the
    efficiency of an algorithm that may be executed in tight spaces (such as a search
    and rescue operation). A measure such as the area of the convex hull may be a
    good reflection of the space used by the robots. However, the space is likely
    to be more regular in structure (such as in).


    For every configuration $C$ we denote the area of the smallest enclosing all robots
    in configuration.


    **Lemma 9:** *For any configuration $C$ with distance $D$, spatial complexity
    $S(C) \leq 3D^2$.*


    Let $u, v$ be a pair of robots in configuration with distance $D$. Every other
    robot $r$ must be a distance $D$ from both $u$ and $v$. The spatial complexity
    of this area has a robot distance of $\sqrt{3}D$ (or a radius of $\sqrt{3}D$).
    The area of this circle is $\frac{3D^2}{4}$.


    ```

    S(C) = \max_{u,v \in C} (\distance(u,v))^2

    ```


    An algorithm that runs for any configuration $C_0$ to the final configuration.
    The spatial complexity of the algorithm is


    **Theorem 10:** *The spatial complexity of convex polygon visibility algorithms
    is O(1).


    Proof: For $0 \leq i \leq l$, let the configuration at the start of path $C_i$
    be $\delta_i$ and observe $D_i$. If the maximum distance complexity of a path
    $i$ is $\delta_i$, then $D_{i+1} \leq D_i + \sqrt{3}D_i = (1+\sqrt{3})D_i$. Since
    the distance between the last two robots can be stretched by $2\sqrt{3}D_i$ (with
    large movements in opposite directions), the new diameter could be extended by
    a factor of $\sqrt{3}$ as in the Lemma 9. If $\delta_i = 0$, then $D_{i+1} = O(D_i)$.
    For all of the paths of the algorithm (Lemmas 2, 3 and 7), $\delta_i = O(1)$.
    The algorithm uses $O(spatial\space(C_i))$ area at all points and the spatial
    complexity is O(1).'
