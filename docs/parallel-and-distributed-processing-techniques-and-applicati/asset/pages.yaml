    A simple path is a sequence of mutually distinct nodes such that there is a link
    between two consecutive nodes. Paths are internally node-disjoint (short for)
    if they do not share any common node except endpoints. Disjoint paths have a significant
    role in the study of fault tolerance and network performance because parallel
    routing routes help avoid congestion, transmission rate, and provide alternative
    transmission routes. There are three types of disjoint paths [3]: one-to-one [4,
    9], and many-to-many [2, 10, 11]. The one-to-one disjoint paths, also called the
    container, have common nodes. According to Menger''s theorem, there exists a container
    for two nodes in a network with its width, i.e. the number of disjoint paths is
    not less than the connectivity of the network. The study of paths provides measures,
    such as wide-diameter and wide-diameter,'
