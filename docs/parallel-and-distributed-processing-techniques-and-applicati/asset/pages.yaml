    The rest of this paper defines the definitions and notations with respect to the
    problem presented in Section 2. Then related works related to the dual-cube and
    the hypercube are described in Section 3. In Section 4, we propose a fault-tolerant
    routing method in dual-cubes. Finally, in Section 5, we conduct a computer experiment
