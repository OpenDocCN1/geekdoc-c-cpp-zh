    # 4. The Kahan-Kimura-discretization


    In this section, we describe a discretization method called the Kahan-Kimura discretization.
    The discretization method was introduced in 1993 by W. Kahan, first appearing
    in his unpublished notes [11]. It is applicable to any system of ODEs for $x:
    \mathbb{R} \to \mathbb{R}^n$


    ```

    $$\frac{dx}{dt} = f(x)=Q+c,$ (33)

    ```


    where each component of $Q: \mathbb{R}^n \to \mathbb{R}^n$ is a quadratic form,
    $b \in \mathbb{R}^n$. Consider a numerical method $x^n \to x^{n+1}$ with a step
    size $\delta$. The Kahan-Kimura discretization reads as follows:


    ```

    $$\frac{x^{n+1}-x^n}{\delta} = Q(x^{n+1})+\frac{1}{2}b(x^{n+1}+x^n)+c,$ (34)

    ```


    where


    ```

    $Q(x^{n+1})-Q(x^n) =\frac{1}{2}b(x^{n+1}-x^n).$ (35)

    ```


    is the symmetric bilinear form of $Q$. It is more useful to use $2\delta$ for
    the time step size to order any of the 2 formulas in the following. Kahan applied
    the discretization (34) to a Riccati equation and a two-dimensional Lotka-Volterra
    system [12]. The most remarkable feature of the scheme is that it produces solutions
    on closed curves. Most other schemes produce solutions that drift into the equilibrium
    point or out of the equilibrium point.


    Petrera, Pfaff, and Suris applied the discretization to many integrable systems,
    including the three-wave system, and showed that in many cases, the discretization
    preserves the integrability [14].


    The discretization coincides with the Runge-Kutta method when the applied system
    is restricted to quadratic vector fields $s$ for the ODE (36):


    ```

    $$\frac{dx}{dt} = f(t,x).$ (36)

    ```


    The Runge-Kutta method for (36) is as:


    ```

    $x^{n+1}-x^n = \delta\sum_{i=1}^k b_ik,\\nk_i = \delta(\delta+n)+c_i),\nc_i=x^n+\delta\sum_{j=1}^i
    a_{ij}k_j, \quad i=1,\dots,s.$ (38)

    ```


