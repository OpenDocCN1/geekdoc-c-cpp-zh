    # 5 Optimizing Strategy


    The performance of Spark can vary depending on how the cluster is configured in
    terms of the executors, the amount of memory per executor, the default number
    of partitions for RDDs [10]. Empirical testing suggests that the "sweet spot"
    of cores per executor is dependent on the computation, but falls between four
    to eight cores per executor. For our simulation and workload tests, we found the
    number of cores per executor to be four per executor, as it falls within the recommended
    range and allows us to use effectively. With this configuration, Spark can fully
    utilize all our specifications by putting two executors on the janus tasks, and
    7 executors on the panda partitions we see Table 1. We can create approximately
    four as many partitions as CPU cores could handle as that would provide a good
    balance of balance of performance of better distribution but more network traffic.
    Each executor will concurrently work on many partitions as it has cores. The important
    factor for deciding the number of partitions is the cores, not the number of executors
    [8].


    # 1.4 Apache Spark


    We use Spark™ as a framework for our computation. In Scala, Spark is an analytics
    engine that is used for applications such as data analytics, machine learning,
    and other algorithms for a batch-processing model of computation similar to MapReduce
    [2]. Spark uses a user-model of distributed computing. The master distributes
    partitions to executors, collects results, and configs the cluster. The executors
    are in the workers. They are Java virtual machines that perform the computations
    and send the results to the master when completed. Multiple executors may be put
    on one (or node) of the cluster. Each executor has a unique memory space. Executors
    may be configured to use multiple threads of the workload''s computation.


    At the core of Spark is the Resilient Distributed Dataset abstraction, or RDD.
    The RDD is a lazily evaluated, distributed dataset across a cluster. Operations
    are performed on RDD through a functional interface with methods such as aggregate,
    fold, reduce, map, fetch, etc. Each partition is a subset of the dataset accessed
    by the RDD [9]. This partitioning backing allows for simple implementation of
    a coarse-grained job scheduler which we use via a queue of tasks. The master nodes
    exist to manage the queue of partitions and as compute resources become available
    will put a partition off the queue and assign it to begin computing on which node
    had available resources. This faster computes can put partitions off the queue
    more frequently and do not idle The master also tabulates which node was responsible
    for which partitions. In the case of a failure the lost partitions are identified
    and recomputed (recovered from backup) from a different node.


    # 2. The Implementation


    We implement in a distributed way using Apache Spark™. The algorithm consists
    of two primary stages.


    In the first stage we trace the billions of rays from the observer, through the
    lens galaxy to the location of the quasar. We use RDD[Array Double] to represent
    our rays. Note that we count all partitions by X and Y coordinates into an array
    so to avoid overhead of objects in the Y. After ray-tracing, we then cast each
    partition into a KD-Tree to enable fast detection of rays colliding with and passing
    quasar. In one phase we begin with an RDD[Array Double] and once the KD-Tree is
    generated, the partition is moved to disk to free up memory for computing the
    next partition to be processed.


    In the second stage we query the KD Trees of times to generate magnification maps
    and/lightcurves. The master broadcasts the sets of points to be queried by all
    the executors. Each executor loads partitions of the RDD [KDTree] from disk, deques
    the next partition and repeats the process. Finally, all the rays counted from
    each partition are summed for each query point by the master.


