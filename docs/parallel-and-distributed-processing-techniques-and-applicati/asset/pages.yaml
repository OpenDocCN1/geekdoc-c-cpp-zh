    **Abstract**—Container-based virtualization, a lightweight virtualization technology,\
    \ has been introduced into large-scale parallel computing. In the bioinformatics\
    \ field, where different libraries and software tools need to be combined, the\
    \ container that isolates software environment and enables rapid distribution\
    \ as an immediate executable format, is expected to have many benefits. In this\
    \ study, we employed Docker, which is an implementation of Linux containers, and\
    \ implemented a distributed bioinformatics protein-protein interaction prediction\
    \ system, MEGADOCK, with virtual machines on Azure cloud computing environment,\
