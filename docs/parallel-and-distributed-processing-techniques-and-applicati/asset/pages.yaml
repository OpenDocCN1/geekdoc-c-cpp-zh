    #  1 Introduction


    Protein is a biologically important molecule and forms a structure in life. There
    are strong relationships between proteins'' structure and its function. Thus,
    protein structure determination is one of main research fields. Generally, protein
    structures can be determined by experimental methods such as X-ray crystallography
    or nuclear genetics. Accurate techniques for protein structure determination have
    been improved, the cost is still much higher than the determination of proteins.
    Thus, the gap between protein structures and that of sequences could be limited.


    Protein structure prediction is a computational technique to generate a tertiary
    structure of a given protein sequence. Since 1980''s, methods for predicting a
    protein structure have been proposed. They can be classified into two categories:
    homology modeling and template-free modeling (de novo) methods. Template-free
    prediction method often searches a minimum free structure from protein''s conformational
    space using potential energy function. The method can be applied for any protein
    but the accuracy of the


    The accuracy of homology modeling depends on two elements; template detection
    and sequence alignment accuracy. As mentioned above, homology modeling requires
    good template, which has same fold to query structure. Thus, template detection
    for remote homologs is essential for the performance of homology modeling. Most
    of researchers have used BLAST-based position-specific score matrices (PSSMs)
    from evolutionary information obtained from results of iterative homology searches
    and sensitive methods. Currently, hidden-Markov model (HMM) is one of the most
    sensitive methods to find highly homologous sequences in a database [1]. In contrast,
    the template detection and alignment accuracy was insufficient. Researchers often
    use sequence alignment based on query and subject (template) manually based on
    their biological knowledge even though researchers have already mentioned the
    importance of sequence alignment for generating final results.


    To tackle the problems, we proposed a novel method to generate more accurate sequence
    alignment for homology based on supervised machine learning technique [Ref]. The
    method is named "ExMachina", does not predict a sequence alignment directly. It
    predicts a score of dynamic programming matrix on specific position based on known
    algorithms obtained from structural alignment. The ExMachina method uses k-nearest
    neighbor as the prediction algorithm and achieve better protein prediction accuracy
    than state-of-the-art method, such as


