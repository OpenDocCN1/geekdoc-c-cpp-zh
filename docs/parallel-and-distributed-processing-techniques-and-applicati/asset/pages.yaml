  md: '# A Method to Acquire Multiple Solutions


    Tomohiro Yoshikawa¹, Kouki Maruyama¹

    Graduate School of Engineering, Nagoya University, Japan


    **Abstract** - In the main purpose of Genetic Algorithm (GA) is to acquire a solution
    with the highest evaluation in a single-objective problem or Pareto solutions
    with various evaluations in a multi-objective problem. In engineering problems,
    the acquisition of multiple solutions satisfying criteria is often more strongly
    desired than acquiring a single solution. In addition, to set design choices,
    solutions should satisfy design variable patterns from one another. Multiple objective
    functions and rather than minimized/maximized these are proposed to approximate
    certain target values. Multiple objective functions can be unified into a single-objective
    function by summing up the errors from the target values. Computing resources
    for searching can be assigned in terms of diversity in the design variable space
    rather than the objective space.


    Because of the characteristics of GA, when applying it to the acquisition of satisfied
    solutions and after a satisfied solution is acquired, searches of the population
    are intensively performed close to the acquired solution individuals might also
    be satisfied. As a result, many satisfied solutions in the design variable space
    are very similar to the first one are often acquired. These similar solutions
    lack meaning. To maintain the diversity of design variables have been proposed
    [5-7]. These methods help prevent problems from converging to local solutions
    by maintaining the diversity of design variables, rather than acquiring various
    types of satisfied.


    **Keywords:** Satisfied, Design Patterns, Unification of Objectives, Genetic Algorithm,
    Island model


    # # 1 Introduction


    In addition to improve the performance of computers, Genetic Algorithm (GA) is
    actively applied to engineering problems [1-3]. In the general, the main purpose
    of GA is to acquire a solution with the highest evaluation value in a single-objective
    problem or Pareto solutions with various evaluation values in a multi-objective
    problem. In both cases, evaluation values are the highest priority, and the variety
    of individuals is the desired objective. However, in engineering problems, the
    acquisition of multiple satisfied solutions satisfying criteria is often more
    strongly desired than acquiring a single best solution [4]. In addition, to set
    design choices, solutions should satisfy different variable patterns from one
    another.


    In the case of applying multi-objective optimization problems, searches are performed
    to acquire various and uniform solutions in the objective space [8]. In this case,
    the diversity of design is generally not constrained. Thus, various solutions
    are acquired in the objective space rather than in the design space. In general,
    the objective space has different variables. However, there is no guarantee that
    satisfied solutions have different variables.


    In contrast, for multiple objective functions, approximate certain target values
    rather than minimized/maximized. These multiple objective functions can be unified
    into a single-objective function by summing up the errors from the target values.
    Through this unification of objective functions, computing resources for searching
    can be assigned in terms of the diversity in the design variable space rather
    than the objective space.


    Engineering problems often involve many constraints. In some problems, the acquisition
    of feasible solutions is required. Feasible solutions are defined as those that
    satisfy all constraints. The constraint of solutions has a high affinity with
    approximating certain evaluation values, as described. Acquiring satisfied solutions,
    i.e., feasible solutions in the design variable space is expected to be achieved
    by achieving the above unification of objective functions to the constraints.


    In this study, a method for acquiring satisfied solutions in unified single-objective
    optimization problems using GA is proposed. To investigate the effectiveness of
    the'
