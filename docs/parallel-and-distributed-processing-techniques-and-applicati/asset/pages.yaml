    # Ex Machina


    ExMachina is a re-alignment for improving homology modeling. Generally, sequence
    alignment from homology search method as BLAST [ref] is used. However using sensitive
    homology search, the quality of sequence alignment is often insufficient and the
    prediction becomes lower than the model based on optimal structure alignment obtained
    by structural alignment of the template and structure. However, it is impossible
    to obtain a structural alignment before the determination of target protein. Thus,
    the method estimation of structural alignment by structural alignment between
    k-nearest proteins and supervised machine learning. The generation of sequence
    alignment as output of supervised learning is difficult task and almost impossible.
    Instead, the method used dynamic programming during alignment and dynamically
    predicts a score from the learned alignment and fixed substitution matrix. Supervised
    machine learning was used in this substitution score prediction method. For the
    purpose, k-nearest neighbor method was employed.


