    Abstract—In this study, we aim to improve the fault-tolerant routing algorithm
    in dual-cubes. The dual-cube is a topology developed by extending the hypercube.
    The dual-cube can interconnect the same number of nodes as the hypercube with
    half the number of edges. The fault-tolerant routing methods proposed in previous
    works have not widely used to forward the message to one of them. In case, where
    it is necessary to forward the message to one of nodes to establish a fault-path
    to the destination node, we have tried to improve the performance of the fault-tolerant
    routing by modifying it. In our method, each node calculates additional information
    about cross-edge fault status. We also modified the fault-tolerant routing algorithm
    so that it can use the information regarding the cross-edges of the neighbor nodes.
    To evaluate our method, we conducted a computer experiment in which we compared
    it with methods from previous work from the viewpoints of the ratio of successful
    routings and the ratio of errors. As a result, our method showed better performance
    than the previous methods.


    between non-faulty nodes can be treated as a fault-tolerant routing problem in
    a graph.

    Among the various topologies proposed for interconnection networks, we focus on
    the dual-cube [1]. The dual-cube is a topology that is obtained by extending the
    hypercube [2], which has been widely used for various parallel systems. The dual-cube
    can connect the same number of nodes as the hypercube with half the links. Hence,
    it can be easily studied [3]–[12].


    In this study, we aim to improve the fault-tolerant routing method in organized
