    no communications between the parallel processes. The goal here is to diversify
    the search space to avoid exploring different areas of the search space (taking
    the same path in the search). The end of our TS algorithm is reached when all
    parallel processes have completed their iterations. Before that, each process
    sends its best solution to the execution process, in order to receive the final
    result of the parallel method.


    For low-level TS parallelization, the algorithm allows the same search space and
    reaches the solution quality as the sequential one (however, the performance can
    be compared to the standard parallelization (speedup and efficiency); since the
    gain in parallelization is the execution time. For high-level TS parallelization,
    where the search space is explored by several parallel processes, the benefit
    of parallelism should include the quality of obtained solutions. For this reason,
    our experiments focus on the quality issue rather than the execution time.


    # C. Proposed Low-level Parallelization


    This approach can be seen as a low-level parallelization in which the gain is
    to speed up the execution of the TS method without improving the solution quality.
    This approach aims to exploit the multi-core processors available in all recent
    computers. This approach explores the search space in the same way as serial TS
    algorithm. One-level model is considered, since the search space and recovery
    are the same; however, the parallel approach moves faster. The parallel approach
    can be evaluated independently from the others. Hence, the serial evaluates all
    neighbors sequentially, one neighbor at a time, and chooses the best one in solution
    of quality to move to the next neighbor.


