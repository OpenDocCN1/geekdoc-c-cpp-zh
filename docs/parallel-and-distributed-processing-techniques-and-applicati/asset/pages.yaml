    **Abstract**—GPUs show high throughput based on computing units that support parallel
    processing. However, resources for parallel processing cannot be efficiently utilized
    when pipeline stall occurs. Hence, in case that data is a source, reducing the
    number of active threads can help relieve the memory contention. In this paper,
    we propose a technique that limits the number of warps dynamically when the workload
    under severe memory contention. The MSH (Miss Status Register) occupies the number
    of blocks that are frequently requested to be allocated in the cache. Our proposed
    technique limits the MSH occupancy to determine the optimal number of warps being
    executed. The proposed technique outperforms the conventional GPU architecture
    by 5% on average.


