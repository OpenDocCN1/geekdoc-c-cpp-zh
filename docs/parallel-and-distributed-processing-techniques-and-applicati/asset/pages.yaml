  md: "# 3.2 Ordering and convergence criteria\n\nIn the ordering, off-diagonal elements\
    \ in a triangular matrix $R^{(1)}$ are reduced to 0. Because the non-zero elements\
    \ appear in the lower triangular, part that is as the lower triangular matrix\
    \ $L^{(0)}$. The details are as follows:\n\nIf $|R_{i,j}| \\ge R_{k,l}$, we use\
    \ the following strategy. The off-diagonal elements are reduced to 0 in order\
    \ of $(1,2), (1,3), \\dots, (1,n), (2,3), (2,4), \\dots, (2,n), (n-2,n), (n-1,n)$.\
    \ The off-diagonal elements in the lower triangular matrix $L^{(0)}$ are reduced\
    \ to 0 in order of $(2,1), (3,1), \\dots, (n,1), (3,2), (4,2), \\dots, (n,2),\
    \ \\dots, (n,n-1)$. If $|R_{i,j}| < R_{k,l}$, we use the following strategy. The\
    \ off-diagonal elements are reduced to 0 in order of $(n,n-1), (n-1,n-2), \\dots,\
    \ (2,1), n-2, n-3, \\dots, 1, (n-1,n-2)$. The off-diagonal elements in the lower\
    \ triangular matrix $L^{(0)}$ are reduced to 0 in order of $(n,n), (n-1,n-1),\
    \ \\dots, (1,1), (n-1,n-3), (3,3), (2,2)$. By using the two-sided method, all\
    \ the-diagonal elements converge to 0. Computatively, since the number of iterations\
    \ is limited to a finite number, the off-diagonal elements may not be an exact\
    \ zero in case of eq(9):\n\n```\n$|R_{i,j}| \\le \\sqrt{|R_{j,j}| \\times |R_{k,k}|}$.\
