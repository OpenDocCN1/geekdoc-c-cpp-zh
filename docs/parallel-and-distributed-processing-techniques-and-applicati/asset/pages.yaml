    \ neural network that not only focuses on atoms alone (atom feature) but also\
    \ on atom pairs (pair feature), and can consider of non-local features. However,\
    \ the correlation between the three-dimensional distance on the graph is uncertain.\
    \ In this paper, we propose three improvements for modifying the weave module.\
    \ The distances between atoms on the graph were modified to bring the distances\
    \ on the graph closer to the coordinate distance, depending on the pair features.\
    \ A weighted distance, was used when converting pairs to atom features. The experimental\
    \ results show that the performance of the proposed method is slightly better\
