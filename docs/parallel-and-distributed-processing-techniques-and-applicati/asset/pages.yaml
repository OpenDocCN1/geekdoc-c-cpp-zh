    especially machine learning (ML) operation, a fault-tolerant and scalable solution
    is needed. One of the primary issues is synchronization, which involves handling
    communication consistency through the edge devices.

    Bulk Synchronous Parallel (BSP) is a fully synchronous parallel model with which
    nodes are updated in each iteration, synchronized through barriers. Even though
    barriers make the system robust to computational failure, it is a costly scheme
    each node has to wait for all other nodes in step. This model has been implemented
    in various ML frameworks. Sturges [9] implements consistency by a scalable barrier-based
    minimization model. REEF [10] and Mlase [11] are distributed data analysis tools
    that make use of BSP. On the other hand, asynchronous models avoid synchronization,
    which means node does not wait for other nodes to keep aware of recent updates.
    For instance, Hogwild [6] and the Stochastic Gradient Descent (SGD) algorithm
    can be implemented without any locks, asynchronous operation. Cycles [17] takes
    this notion with conflict-free parallel execution. NOMAD [7] provides a solution
    for problems handled in distributed manner, with fully asynchronous updates for
    each process.


