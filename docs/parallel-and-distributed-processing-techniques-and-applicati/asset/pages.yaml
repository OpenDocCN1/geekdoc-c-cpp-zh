    # 2. The Three-Wave System


    The three-wave system is a well known partial differential equation (PDE) appearing
    in the fields of nonlinear optics and plasma physics[2]. The three-wave system
    is as follows:


    ```

    $$\frac{\partial z_1}{\partial t} + \alpha_1 \frac{\partial z_1}{\partial x} =
    \epsilon_2 z_2 z_3, \quad (1)$\\frac{\partial z_2}{\partial t} + \alpha_2 \frac{\partial
    z_2}{\partial x} = \epsilon_3 z_3 z_1, \quad (2)$\\frac{\partial z_3}{\partial
    t} + \alpha_3 \frac{\partial z_3}{\partial x} = \epsilon_1 z_1 z_2. \quad (3)$

    ```


