    The flow of the layout analysis using semantic segmentation is described as shown
    in Figure 4. First, using the trained model, we label the segments using semantic
    segmentation on the meeting images. Next, the original image is processed layout
    output. If the segmentation map includes a frame area, we replace black pixels
    in the area defined as frame with white pixels. If the segmentation map includes
    document area, the image is clipped for document area. Finally, the character
    extraction processing is performed as described above, but when the segmentation
    map includes character area, the area extraction is performed using the character
    area.


    # 5 Experiments


