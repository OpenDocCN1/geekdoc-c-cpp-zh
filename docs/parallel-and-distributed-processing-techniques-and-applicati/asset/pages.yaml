    not been obtained. In this paper, we derive conserved quantities of the discrete
    three-wave system of Kahan-Hirota-Kimura type and show that in our discretized
    system, we have a certain variant, corresponding to the Hamiltonian of the three-wave
    ODE system, that is integrable via the Quispel-Roberts-Thompson (QRT) mapping
