    This paper is concluded in Section 6.


    **Keywords:** interconnection network, global-information, topology, hypercube


    # 1. Introduction


    Recently, large-scale computation demands are increasing in many fields. However,
    each processor has a performance limitation. Since a single processor takes too
    long to perform large-scale computation, parallel computation which reduces reduce
    contention by distributing tasks to multiple processors, has many bottlenecks.


    In a parallel system, the topology of its interconnection network and the way
    to interconnect processing elements influence the performance of the system. The
    topology of the interconnection network can be treated in the graph by replacing
    the processing elements with nodes and links with edges.


    It is rarely that may parallel system operates without faulty elements because
    it connects thousands of processing elements and links. Therefore, for the massively
    parallel system to tolerate faulty elements, In a parallel system with faulty
    elements, delivery of a message to non-faulty nodes can be treated as a fault-tolerant
    routing problem in a graph.


