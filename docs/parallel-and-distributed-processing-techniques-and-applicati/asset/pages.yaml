  md: '# A Study on the Effects of Elements of Games in Oddball Tasks for User’s Motivation
    and Event-Related Potential


    Tadashi KOIKE¹, Tomohiro YOSHIKAWA¹, and Takeshi FURUHASHI¹ Graduate School of
    Engineering, Nagoya University, Nagoya, Japan


    **Abstract**—P300 is one of the event-related potentials that arise when an infrequent
    stimulus appears. Oddball tasks are often used to create a game-based oddball
    task for users to enjoy the tasks. There are several elements in a game. This
    paper discusses the effects of score, feedback system and background in oddball
    tasks.


    **Keywords:** P300, Oddball Tasks, Score, Feedback System, Background


    the counting by the number of infrequent stimuli or pushing a button when an infrequent
    stimulus appears. The authors used an oddball task with yellow circles (Fig.2),
    although there are various oddball tasks (4). A large circle is a frequent stimulus
    (standard stimulus), and a small circle is an infrequent stimulus (target). There
    are three types of target stimuli, whose radius ratios are 90%, 70%, and 50% of
    standard stimulus. Users are required to push a button when an infrequent stimulus
    appears. The task difficulty is the radius ratio of the target stimulus because
    it is easier to push a button as the difference between the radius of target stimulus
    and that of standard stimulus is larger.


    # 1. Introduction


    The authors investigate the degree of dementia from several parameters: age, schooling
    history, the history of P300, the difficulty, and on [1]. P300 is one 300 ms after
    an infrequent stimulus appears (ERPs) for that [2]. In this paper, the latency
    of P300 is the time from the stimulus to the peak of P300, and the amplitude of
    P300 is the potential value (Fig.1).


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_172_0.png)


