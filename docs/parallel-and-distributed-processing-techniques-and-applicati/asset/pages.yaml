    # 3.2 Dynamic warp throttling


    The greater the number of concurrent warps, the higher the penalty. Unparallelism
    can be reduced by executing other types of instructions in addition to those that
    cannot be immediately processed because available resources exist. Thus, if thread-level
    parallelism (TLP) is limited, resource utilization high. The proposed technique
    limits the number of concurrent warp execution in SM by calculating the number
    of concurrent warps that are issued and not completed. The tracking of running
    warps in an SM is implemented by easily additional bits in buffer or a counter.
    We monitor the number of warps by checking the status bit. If the proposed technique
    constraints the number of concurrent warps up to N and the number of warps currently
    executing is N, then no further warp is issued. However, to limit the occupancy
    units due to performance loss, the proposed technique does not issue a memory
    request when the number of running warps reaches a limited number of warps. Conversely,
    if the number of warps is ever, the proposed technique allows warps to execute
    an instruction that is not a memory instruction. Thus, this technique ensures
    the uninterrupted use of resources for parallel processing.


    # 3 Proposed memory contention


    Memory caused by multiple threads is an important factor in GPU performance degradation.
    Therefore, we use workload monitors of the MSHR of L1 cache detect memory. Since
    the MSHR holds the information until the requested data from memory, the MSHR
