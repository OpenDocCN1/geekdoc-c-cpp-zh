    # 6. Examination


    # 6.1 Examination of the Rating Scale Method


    In the experiment of oddball task score, there were significant differences in
    the three ratings of “concentrating,” “enjoying,” and “not boring.” In the experiment
    of oddball task with feedback system, there were significant differences in the
    two ratings of “enjoying,” and “not boring.” Users can enjoy oddball tasks without
    feeling or tiring when the tasks have “score” or “feedback system” comparing with
    the simple oddball task.'
