    statement-level energy consumption optimization is to select a lower level energy
    consumption algorithm or module design method according to the context to optimize
    energy consumption. According to the method source-oriented energy consumption
    optimization can be divided into two categories: source code transformation and
    optimization. There are four main types of code transformation: data structure
    transformation, cycle transformation, transformation of programs and constants.
    Transformation is used most frequently. Changing the structure in program code
    can often improve access performance such as table hit, other effects of improving
    energy consumption. Compared with program transformation, algorithm optimization
    is more abstract, needs to be combined with the specific implementation of program
    performance and implementation. Literature [8] gives various common algorithms.


    The application software runs on the platform and is "final" of energy. Energy
    saving software with low energy consumption can also reduce the energy consumption
    of the system. There are two main points in the research of energy consumption
    optimization at the application software level, low-power optimization, and source-oriented
    energy consumption.


    Modern computers are very energy oriented code performance. The goal of general
    code optimization is to shorten the code execution time and reduce the size of
    the storage space when the program is running, and the technology for low-power
    consumption optimization is very lacking. However, low power consumption optimization
    methods intend to optimize the generated code in the generation stage such as
    [4]. These methods are all good for improving power consumption, but they are
    not mature compared with compiler performance optimization. At some time, many
    technologies rely too much on hardware and lack universality. The low-power consumption
    optimization technique needs further research and improvement.


    To sum, the research on energy consumption optimization is mainly focused on embedded
    platforms. For general-purpose computing field with many energy-requirements,
    this research is still not enough. The complexity of the platform determines that
    software-oriented energy consumption optimization, especially at the application
    software level, is difficult. However, the demand for the research and implementation
    of energy optimization in the industry is growing with the flexibility of software
    energy consumption optimization methods compared with hardware energy optimization.
    Energy consumption optimization methods at the level of application optimization
    have very good results in various realms.


    In the low-power code optimization technique, there is another big direction for
    the application software level energy consumption optimization, which is to directly
    optimize the source code of the application software so as to complete the energy
    optimization in the process of writing or modifying. The demand for energy optimization
    is limited by the complexity of the platform architecture, the source code-oriented
    energy consumption optimization has achieved good results on embedded platforms,
    but on general computing platforms, due to the complexity of the system and platform,
    the source-code-oriented energy consumption optimization technique shows slow
    progress.


    According to the object, code-oriented energy consumption optimization can be
    divided into instruction level and module level [7]. Instruction level optimization
    can use the commands provided by the compiler to optimize with small granularity.
    Statement-level energy consumption optimization attempts to reduce energy consumption
    by adopting more efficient and low-energy consuming structures and data structures.
