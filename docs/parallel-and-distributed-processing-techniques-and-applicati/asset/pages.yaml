  md: '# Layout analysis using semantic segmentation for Imperial Meeting Minutes


    Sayaka Iida, Yuki Takemoto, Yu Ishikawa, Masami Takata, Kazuki Joe

    Nara Women''s University, Japan

    2 Shiga University


    Abstract - In this paper, we propose a layout method for text extraction of Imperial
    Meeting Minutes. Character recognition depends depends on character accuracy.
    In order to improve the accuracy of character segmentation, it is necessary to
    consider the document image. Histogram analysis is usually used for layout analysis
    is difficult to perform general layout analysis using only patterns, and it is
    necessary to consider the document configuration for accurate document extraction.
    Therefore, we propose a layout method using semantic segmentation. We apply the
    proposed method to Imperial Meeting Minutes and compare the case of layout analysis
    with histogram and extracted characters to confirm the usefulness of the proposed
    method.


    In general, histogram analysis is used for the layout of document images. In this
    method, a pattern is detected from the shape and the change of a pixel projection
    histogram, and the document area is clipped from the document image according
    to the boundary. Since area between document parts and other parts is very difficult
    to be clearly detected using the histogram pattern, not always enough. In order
    to properly clip the document area, it is necessary to visually confirm the content
    of undocumented minutes currently available in the Imperial Meeting Search system
    is to fully identify the layout and each area by hand. In this method, we propose
    a layout method using semantic segmentation [4] for the Imperial Meeting Minutes.
    We apply our method to Imperial Meeting Minutes so that we can compare the case
    of layout analysis with histogram and character extraction, and confirm the usefulness
    of the proposed method.


    **Keywords:** Layout Analysis, Imperial Meeting Minutes, Semantic Segmentation


    # # 1 Introduction


    The National Diet Library [1] provides a service called Imperial Meeting Search
    System [2]. Imperial Meeting Search System publishes the records of all Imperial
    Minutes during 1890-1947. The minutes were published before standardization, and
    therefore with different fonts and formats depending on. Their images are searchable
    by the table name, index or keyword. The minutes of last two years have been converted
    to text by search while the minutes from 1944 do not have any text to be searchable
    by text. Therefore, it is necessary to convert the non-textified Imperial Meeting
    Minutes into text.


    Since the number of minutes available for the Imperial Meeting Search System is
    high (about 200,000), manual conversion is practically impossible in cost. Although
    we proposed the recognition method for early printed books [3], a large amount
    of time is required to improve the recognition in order to automatically converting
    the meeting minutes into text, it is necessary to analyze the layout of the meeting
    minutes in detail. The character recognition depends on correct lettering. It
    depends on the accuracy of document clipping from document images. The meeting
    minutes are organized in columns with straight lines in addition to the main document
    parts. Layout analysis is required to clip the document area from the meeting
    images.


    The structure of this paper is shown below. Section 2 introduces existing research
    on semantic segmentation, and Section 3 describes the method, which is a classic
    layout analysis method. Section 4 proposes a layout analysis method using semantic
    segmentation, and Section 5 describes experimental methods, experimental results,
    and discussions. Section 6 gives conclusions.


    # # 2 Existing Research on Semantic Segmentation


    Semantic segmentation is a method to classify pixels belonging to the same object
    in an image. Most semantic segmentation methods use CNN (Convolutional Neural
    Network). There are two problems in semantic segmentation using CNN before FCN
    (Fully Convolution Network). The first problem is that the size of the input image
    has to be fixed in order to use the fully connected layer. The second problem
    is that the pool layers discard the information. In the first full connectivity
    layer issue, FCN solves the problem without pooling layers. Because FCN does not
    use the fully connected layer, segmentation maps are created using images of any
    type. Most approaches to semantic segmentation after FCN are architectures that
    do not have the fully connected layer. For the second pooling layer problem, the
    encoder-decoder architecture is one of the main approaches for the information
    retention. The encoder path is useful for high-


