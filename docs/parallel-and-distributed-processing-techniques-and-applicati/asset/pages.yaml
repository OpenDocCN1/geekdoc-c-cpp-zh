    the search by using a search strategy. Then each bee takes one solution from the
    Search Area group and considers it as starting point to a local search (intensification)
    to find an optimal solution that communicates the solutions found to all its neighbors
    through a named Dance Table. The best solutions in the Dance Table bring the new
