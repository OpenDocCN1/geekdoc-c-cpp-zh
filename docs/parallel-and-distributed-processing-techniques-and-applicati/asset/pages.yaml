    A repost-based framework for single-cells and batch population [30]. The AgentCell
    framework provides for running multiple non-interacting single-cell concurrently
    on massively parallel processors. Chaste [31] is an example of ABM-based framework
    using various high-performance libraries for parallel line and mesh distributions.
    More include ABM framework with multi-core CPUs such as CellBoid [7], and Morpheus
    [33]. In these frameworks, parallelization was performed with OpenMP to improve
    the performance on single-node CPU units. Additional techniques have been proposed
    to accelerate specific biological models using both CPU or GPU [34, 35]. The aforementioned
    techniques leverage the strengths of both CPU and GPU. The ability to utilize
    both CPU and GPU simultaneously results in a sub-optimal resource utilization.
    What we work [36] addresses this by assigning appropriate computational tasks
    to the CPU while it waits for the GPUs to complete their tasks. However, these
    previous works only focus on the simulation computation. This leaves an opportunity
    in visualization optimization as an open problem.


    # 3.2 Visualization in ABMs


    The challenge in developing GPU-basedM has been well-explained. However, the same
    does not apply to the scales of data size being generated, the conventional methods
    of post hoc how visualization has become increasingly infeasible. The post hoc
    refers to a visualization process where the visualization is performed after the
    numerical simulation has completed. The output data are retrieved when written
    down during the simulation and retrieved for later on the disk and network. For
    this reason, interactive visualization has gained the interest of researchers.
    In this visualization allows the outputs to be analyzed on the same size as data.
    The ability to perform on-site data analysis reduces the amount of data movement
    between servers and remote units. This property makes interactive visualization
    an ideal way to visualize large datasets such as our case. For example Catalyst
    [37] work reported in [38] are examples of libraries developed to enable efficient
    simulation of output using online visualization frameworks as Paraview [39] and
    Vist [40]. A bitmap and quadtree-based ABM approach [42] were proposed to analyze
    the numerical output in situ and reduce non-essential data.


    # 4. Scheduling


    Simulation tasks are either computational or visualization. In general, most simulation
    computational tasks can be


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_80_0.png)


    further classified into two categories: core-grain or fine-grain. A task is labeled
    core-grain if it involves complex computations and relatively small amounts of
    data. These core-grain tasks are suitable for CPUs, as the GPU is not efficient
    at executing simple tasks that get applied large amounts of data. These tasks
    are then classified as fine-grain. The scheduling schemes we outlined in our work
    [36], out-performed related ABM works in terms of computational throughput. However,
    since the computational tasks were distributed among the host and accelerators,
    visualization was performed at the end of each iteration after the data were back
    to the host. The visualization was slow, bounded by the execution time of the
    computation and synchronization of the iteration.


    In this work, the scheduling scheme proposed in [10] was restructured to mitigate
    the bound on-simulation accuracy by (1) scheduling GPU tasks at a lower level
    to (2) GPU-tasking (GHT). The benefits of GHT are: The GPUs mainly for fine-grain
    computations (GPU^{comp}) can hyper-task between fine-grain computations and ray-casting
    (visualization subtasks). These non-screened tasks allow the GPU to aid in visualizing
    their local data and minimize peers communication. GHT renders the GPU (GPU^{vis})
    to lighten the computational loads of its peers by executing loftless fine-grain
    tasks, while maintaining high level of visualization intensity.


