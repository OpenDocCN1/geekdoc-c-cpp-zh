    The Blocking Job Scheduling (BJSS) is a version of the well known Job Shop Scheduling
    Problem (JSSP). It consists of a set of jobs and machines with storage space,
    which introduces a blocking problem. This situation is very common in production
    scheduling and easily ensures an important economic gain. In addition to terms
    involving the number of jobs and the number of machines, the BJSS is a particularly
    challenging problem due to the high ratio of infeasible solutions. One is introducing
    a random factor (FRS). This leads to reconsider the execution of some jobs to
    ensure feasibility. However, it slows down the scheduling process and increases
    the search area in the search space. In this paper, we propose to use a feasible
    multi-start Parallel Tabu Search algorithm that involves high level parallelism
    in which several instances of the TS algorithm explores the search space simultaneously.
    This parallel approach exploits the computing power of supercomputers. Experiments
    with well known benchmarks show the positive impact of parallelism not only to
    speed up the time, but also in improving the quality of the obtained solutions.


    Scheduling (BJSS) problem appears more difficult to solve than the classical JSSP
    which is an NP-hard optimization problem. In this paper, we propose a method that
    uses the Tabu Search with Swaps. A swap represents a deadlock situation that involves
    several jobs, where each job is waiting for another job to finish processing on
    the same machine. In other words, we deal with a version of the BJSS problem that
    ensures that a solution is accepted.


    Index Terms—Job Scheduling, Blocking constraint, Tabu Search


    The BJSS problem has been treated by various authors using different methods.
    On one hand, the exact resolution of this problem [1], [3], is impractical for
    large instances, and on the other hand, most of the existing approaches for this
    problem [1], [8], [12], [14–16] do not take into account the specificity of the
    blocking constraint, or involve a random factor during the search to improve stability
    for large problem instances. The Tabu-search (TS) is one of the most widely used
    methods for combinatorial optimization problems. It explores the search space
    by moving from one solution into another using a neighborhood function. To handle
    the impact of the blocking constraint, the Tabu search produces two concurrent
    operations (critical), in cases of infeasible solutions, leading to a low ratio
    of quality of results. In order to improve the feasibility of scheduling solutions,
    we propose in [4] a FRS to schedule some of jobs. However, the recovery step makes
    the TS algorithm very slow inducing a huge time to explore a small area in the
    search space.


    The classical Job Shop Scheduling (JSSP) represents one of the most studied problems
    in literature. It consists to schedule a set of jobs on a set of machines, where
    each job has its own path through the machines. The operation of a job involves
    several areas (production chain, task scheduling, etc.), there is no storage space
    between machines which leads to a blocking situation. i.e. A job, has completed
    its processing time, remains on the machine (blocks others) until not machine
    becomes available for processing. This situation is known as the blocking constraint.
    Thus, the JSSP with the blocking constraint is the Blocking Job'
