    # 2. Background


    # 2.1 Software and Hardware Environment


    Our base ABM framework was written in C++. The multiprogramming on multi-core
    GPUs was written with OpenMP. OpenMP is a portable application programming interface
    (API) for parallel computing platforms. The communication with GPUs was implemented
    using Compute Unified Device Architecture (CUDA) version 8.0.4. All programs were
    implemented with OpenGL (Open Graphics Library). The interface was using VirtualGL
    [12] and TurboVNC [13]. The pre-processing of data to predict for host-device
    data minimization was written in Python 3.7.


    Inflammation and wound healing is a complex process that our body uses to restore
    damaged tissue. The process involves a number of interacting chemical, biological
    and mechanical phenomena [14]. The temporal-spatial scale of some these phenomena
    vary substantially from others. Despite the enduring efforts in various studies
    [14], understanding the underlying mechanisms of wound healing process remains
    an open challenge. Computational models can be used to verify current understanding
    of the problem with the real information. Integration of the results of the simulation
    can help refine the agents of the wound.


    The program was compiled using the Intel C++ compiler, icpc version 15.0.0, with
    default release optimization. The source code of the video folds with all options
    described in this work can be found at: https://github.com/HFC-ABM/vf-version_v3


    Due to availability of experimental data [15], [16], the ABM rules, and parameters
    used in the model were derived from empirical local works and literature reviews
    [17], [18], [19], [20], [21], [22], [23]. The main components of the video fold
    (VF) ABM include biological signals and extracellular matrix (ECM). The biological
    cells are the agents of the model who communicate via chemical signals, and perform
    healing via secretion of ECM proteins. The roles of specific cell types and ECM
    proteins, along with their integration into the VF ABM is described in our previous
    work [10].


    All results reported in this work were obtained from experiments and benchmarks
    on a machine consisting of a 4-core Intel(R) Xeon(R) E5-2569 v4 @ 2.20 GHz with
    128 GB of memory and two accelerators, NVIDIA Tesla M40. NVIDIA Tesla M40 graphics
    cards with 3072 CUDA cores and 24 GB of global memory with compute capability
    5.2.


    # 2.2 Agent-Based Modeling


    # 2.3 Focal Tissue Inflammation and Repair


    Agent-based modeling is a way to quantitatively simulate complex dynamic systems
    [1]. ABM is defined by the autonomous agents whose decisions and actions are governed
    by user-deterministic and stochastic rules. As opposed to equations-based approaches,
    ABM is decentralized. The system behavior is determined by the collective property
    of individual agents. Thus ABM can gain insight of complex systems by yielding
    emergent behaviors from a group of simple individuals. The basic components of
    ABM are:


    +   - Autonomous agents perform action and interact with other agents and their
    environment

    - Agent Rules — Set of deterministic/stochastic behaviors of agents

    - ABM — The environment that houses the agents. This space can be continuous or
    discrete


    Agents can represent any individual from cities in economics to model inflammatory
    cells in systems


    High-density ABMs in biological applications (ABM-Bio) also involve large amounts
    of data. High-performance computing (HPC) ABM tools have been developed to address
    the challenges in these large data sets. For example, FLAME [8] is an implementation
    of an ABM framework for parallel architectures based on X-machines. FLAME has
    been used to simulate the simulation of ecological systems in various fields using
    biology systems [25]. FLAME was further extended to support Sugarcoat on steroid
    [4] is another example of ABM configured for genetic populations. These frameworks
    extended their application to biological systems such as wound damage and dental
    modeling [25]. In the real of distributed computing, Repast HPC [5] was developed
    as an MPI extension to its predecessors, Repast and Repast Swift. Repast HPC was
    adopted to accelerate the simulation of bone growth [6].


    # 3. Related Work


    Due to the popularity of ABMs in biological applications, some HPC ABMs have also
    been specifically developed for biological applications. An example is AgentCell,


    # 3.1 ABMs for Biological Applications'
