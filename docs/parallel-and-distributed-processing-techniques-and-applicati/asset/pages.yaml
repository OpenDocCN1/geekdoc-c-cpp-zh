  md: '# 2.2 SURF technique


    SURF technique was invented with the purpose to recognize features/shapes efficiently
    and accurately. Utilizing SURF technique will improve the calculation time and
    also the recognition accuracy. SURF technique has a function to calculate the
    edge connection between two adjacent surfaces of 3D CAD models (see Fig. 4). By
    referring to this edge connection information, geometry shapes/features can be
    recognized by analyzing the patterns of edge collections. Edge connection is calculated
    as


    ```

    edge connection = (v \times n_B) \cdot n_A

    ```


    where v indicates the vector of the direction of edge shared between two adjacent
    surfaces A and T. n_A and n_B represent the normal vector of each surface, which
    is calculated in the vicinity of shared edge. Edge connection calculated by Eq.
    (1) can be classified into three types as shown in Fig. 5.


    +   - Edge connection > 0 is concave connection (Fig. 5a).

    - Edge connection < 0 is convex connection (Fig. 5b).

    - Edge connection = 0 is planar connection (Fig. 5c).


    In the case of end-terminal surfaces, edge connection between two adjacent surfaces
    will convex-convex connections as shown in Fig.6. This characteristic of end-terminal
    surfaces defined by SURF technique can be helpful to solve the recognition problems
    in Offset technique. Improvement in recognition accuracy and computation time
    can be expected by adopting SURF technique. Fig. 7 shows the recognition result
    of adapting SURF technique to Offset technique.


    SURF technique is applicable not only for recognizing end-terminal surface, but
    it can be extended to recognizing ribs, flanks and many other shapes/features.
    Also, the other advantage of using SURF technique over Offset method is the reduction
    in computation cost because of its capability to find any types of features in
    such an easy way. Details about SURF technique for recognizing various types of
    geometry features is [8].


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_207_0.png)


    Fig. 5 Edge connection; (a) concave connection, (b) convex connection and (c)
    planar connection


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_207_1.png)


