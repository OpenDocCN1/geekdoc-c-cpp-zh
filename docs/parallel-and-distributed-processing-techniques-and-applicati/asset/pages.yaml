  md: 'speed computations to recover boundaries in the decoder path. This section
    describes existing CNNs that incorporate the encoder-decoder architecture.


    SegNet [6] is one of the early encoder-decoder architectures. It targets RGB landscape
    images and extracts roads, people, cars, etc. from images. In SegNet, to increase
    the resolution of segmentation map, the encoder information of maximum pooling
    layers is sent to the decoder, and feature map upsampling is performed. Also,
    it performs batch normalization after the convolution layer to prevent gradient
    loss and explosion.


    U-net [7] is a CNN proposed for segmentation of biomedical images. It targets
    gray scale images such as radiographs and MRI images, and detects the positions
    of organs and lesions from the images. In U-net, the connection from the encoder
    to the decoder is sent or horizontally. U-net retains the details features by
    FCN and ResNet as architectures to make the connection skip. Beside U-net, there
    are FCN and ResNet with the differences compared to U-net.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_145_0.png)


    There are two ways to create rectangles: top-down and bottom-up. The top-down
    method allows the rough layout structure and then gradually creates small rectangles.
    For example, an image is clipped vertically or horizontally along a space expected
    to be a boundary of character strings or a part of a rectangle to create the method
    of area. The top-down method cannot account of cross column headings or non-rectangular
    areas in the document. The bottom-up method gradually integrates a rectangle from
    an image until the document is merged as rectangles taking into account the density,
    shape, and area between the parts.


    The size of the data trained by CNN for the above mentioned semantic segmentation
    is up to 500 pixels. The size of Imperial Meeting images targeted in this paper
    is 3200 pixel width and 4500 pixel height. The CNN architecture performs semantic
    segmentation for Imperial Meeting should be daylight. Furthermore, the recording
    is binary image, and the boundary of the content area is blank. The document is
    surrounded by black backgrounds, so it is not necessary to keep the segmentation
    map boundary details. The images between content and the frame area are clearly
    separated in black and white. In this paper, we use SegNet Basic, which is a lightweight
    model to reduce the number of layers rather than SegNet.


    # 3 Existing layout analysis method


    Conventional layout analysis for document creates rectangles using histograms.
    In the histogram based method, a parser is converted into a black and white binary
    image to obtain a projection of black pixels constituting the document. A pattern
    is found from the shape of the histogram and the amount of change to be divided
    linearly. The extracted pattern is encoded in a rectangle, and the document is
    extracted based on the height of the difference. However, it is difficult to distinguish
    the difference between the document and other elements in the document image using
    the histogram pattern. To get accurate rectangles, we need to visually consider
    the possibility of the document


    Figure 1 shows images of imperial meeting images targeted in this paper. The meeting
    images are divided into two columns. Some columns have titles and other not. Columns
    and frames are framed, and in order to perform layout analysis of the meeting
    image, it is necessary to determine the boundary and the pattern of the histogram.
    However, the lines included in the meeting image are not straight lines, but are
    distorted due to the distortion of the image recording, or the deviation of the
    scanning time. As meeting images contain noise such as ink stains, in the natural
    meeting image, finding only the black pixel projection along the horizontal document
    is difficult, and it is necessary to adjust the size and position of the rectangle
    to some extent. The method uses semantic segmentation that does not require visual
    adjustment at the time of recognition. A method of automatically classifying pixels
    that belong to the same object, and suitable for extracting regions from images.
    A document area, and a frame are extracted from the meeting image, and layout
    analysis is performed in the bottom-up method.'
