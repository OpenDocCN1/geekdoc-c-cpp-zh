  md: '# 3.1 Recognition experiments


    We perform three experiments to find the best structure of CNN for early-molded
    Japanese character recognition. In Experiment 1, the kernel size for the characters
    used in this time, the kernel size is changed to various values. In Experiment
    2 and 3, the number of layers and the number of filters are changed to determine
    the structure of the convolutional layer, respectively.


    In Experiment 1, the number of filters in the convolution layer is 25, and the
    second layer is 50. Only the kernel size is changed. The kernel size is of types
    3x3, 5x5, 7x7, 9x9 and 11x11 represented by Exp-A, Exp-B, Exp-C, Exp-I-D, and
    Exp-E, respectively. Fig.1 shows the recognition rate in each experiment. The
    recognition rate increases, and in the case of 7x7, the average recognition rate
    for test data is the highest, with 88.02%. So we consider that the 7x7 filter
    is optimal, and we use the 7x7 filter as kernel size in the following experiments.


    In Experiment 2, the number of layers is increased to 3 and the number of filters
    is changed to compare the recognition results of Experiment 1. We set the number
    of filters in each convolutional layer to (5, 10, 20), (20, 40, 80), (80, 160,
    320), (160, 320, 640) represented by Exp-A, Exp-B, Exp-C, Exp-D, Exp-E and Exp-F,
    respectively. Fig.2 shows the recognition rate increases as the total number of
    filters increases. In Exp-D, the convolutional layer is three layers (160, 320,
    640), the recognition rate for test data is up to 90.36% which is the highest
    recognition rate.


    In Experiment 3, we perform it with four convolutional layers. From the results
    of Experiment 2, we consider that the recognition rate increased as the total
    number of filters increased. Therefore, the experiment is performed by increasing
