    and subjects'' feature vectors:


    ```

    $V_{xy} = (P^{query}, P^{subject})$

    ```


    P is the concatenation of position specific score matrix (PSSM) rows around the
    result, defined as


    ```

    $P_i = (P_{w_{i-w}}, ..., P_i, ..., P_{w_{i+w}})$

    ```'
