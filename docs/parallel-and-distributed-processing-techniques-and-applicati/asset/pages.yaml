    # III. THE PARALLEL TS ALGORITHM


    In this section, we present our proposed parallel approach for the BJSS problem
    with swap. The goal of the parallelism is to utilize the TS method by dividing
    the search space into several parts where each part is executed by a TS process.
    For this reason, we begin by introducing our TS algorithm and its components in
    the proposed recovery strategy used by each process during the search.


    The TS algorithm is a classical metaheuristic used to solve combinatorial optimization
    problems. We define it by Glover in 1986 [5]. As depicted in Figure 2, the TS
    algorithm works to reach the global optimum by moving from each iteration to one
    solution to another. This can be done by searching for a solution s ∈ S either
    in N(s) and the best in this solution s* is selected if it is better than v. Local
    optimum, the k visited solutions are stored in a short memory forbidding any moves
    in any of these configurations. This memory is called the Tabu List (TL). For
    additional information on the method, the reader may refer to Glover [6], [7].


    # A. TS for the BJSS Problem


    Many authors in the literature [8], [9], [13] tried to solve the BJSS problem
    using the TS algorithm. However, there results are of low quality due to the incapacity
    of exploring the search space. In the following, we describe our adaptation of
    this method for the BJSS problem. For that, we used a classical neighborhood structure
    and one of our proposed recovery strategy.


    1 Neighborhood Structure: The structure of the algorithm depends entirely on our
    chosen neighborhood. Our neighborhood function is based on the classical N1 neighborhood
    where the neighbor solutions are obtained by performing two critical operations
    on one critical path that use the same machine. In the classical N1 neighborhood
    always produces feasible solutions and converges to the local optimum [18]. However,
    applying it for the blocking cases in 98% of non feasible solutions. According
    to this classical method, neighbor solution s'' of s is obtained by performing
    two successive critical operations oi and vj assigned to the same machine.'
