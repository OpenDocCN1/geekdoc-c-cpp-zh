    # 6.2 Examination of Brainwaves


    There were no differences between comparison of the two tasks. Latency is related
    to how subjects recognize a target stimulus. Whether tasks have elements of game
    or not has to the stimuli; there were no differences in latency. Amplitude is
    related to the concentration of the user. In the rating method with and without
    score, there was significant difference in the rating of “concentration,” so it
    is expected that the amplitude of task was larger than without score.


    # 7. Conclusion


    This paper discussed the effect of “score,” “feedback system,” and “oddball” tasks.
    The following results were found. There were significant differences in the two
    ratings of “enjoying,” and “not boring” in the rating method with “score” and
    “feedback system.” On the other hand, there were no significant differences in
    all of the ratings in the scale method changed with “background.” Experiment is
    needed because there were some problems in the experiment for the study of effects.
    There were no differences in the latency and amplitude of the two tasks in elements
