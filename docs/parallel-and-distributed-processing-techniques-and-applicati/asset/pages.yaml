    for running each''s SDN controllers.


    In this paper, we introduced the problem, defined terms and notation for it, and
    developed mixed integer programming formulations. We conclude that if it can be
    modeled after the classical facility placement problem and is not different than
    the other forms of controller placement problem but it can be used in different
    settings where the infrastructure providers may charge for the resources and may
