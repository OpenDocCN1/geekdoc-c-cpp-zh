  md: '# High-Performance Host-Device-Scheduling and Data-Transfer Minimization Techniques
    for Visualization of 3D Agent-Based Wound Healing Applications


    N. Seckao¹, G. Yu², S. Yuen¹, J. Jaja¹, L. Mongeau¹ and N. Y. Ki. Li-Jensen²


    ¹Department of Electrical and Computer Engineering, University of Maryland, College
    Park, MD, USA

    ²School of Communication Sciences and Disorders, McGill University, Montreal,
    Québec, Canada

    ³Department of Mechanical Engineering, McGill University, Montreal, Québec, Canada


    **Abstract—**High-fidelity numerical simulations produce massive amounts of data.
    Analyzing these numerical data as they are generated provides useful insights
    into the processes under modeled phenomenon. Developing real-time visualization
    techniques to process large amounts of data can be challenging since the data
    does not fit on the GPU, requiring expensive GPU copies. In this work, we present
    a scheduling scheme to achieve real-time simulation and interactivity through
    GPU-tasking. The CPU-GPU communications were minimized with activity to reduce
    latency.


    host-device is a common configuration in modern personal machines. This work,
    focuses on a single-node with multi-core GPU and multiple GPUs platform configuration.


    The bottleneck of using GPU accelerators is usually the communication between
    the host and the device, and the relatively limited amount of memory available
    on the GPUs. First, data to be stored and used on the GPUs had to be transferred
    from the CPU host through a peripheral component interconnect (PCI) bus which
    is very slow (bandwidth of 2.0 to 8.0 GB/s). Second, GPU memory is much smaller
    compared to that of the CPU host. In large data applications, transfer overhead
    becomes formidable due to the on-demand transfers from host to device.


    **Keywords:** performance agent-based modeling, real-time in situ visualization,
    heterogeneous platform scheduling, wound healing, voxel model


    # 1. Introduction


    The attempt to render real-world phenomena through modeling has been ubiquitous.
    The prevalence of computing power has granted researchers and scientists to create
    increasingly complex models. As models gain higher of fidelity, the complexity
    and amounts of data grow. To make sense of these data, the analysis and visualization
    of the output data as they are generated become crucial. However, efficiently
    handling such amounts of data requires a carefully designed to make effective
    use of resources. The resulting system should exhibit impressive characteristics:
    (1) real-time performance, (2) high level of interactivity, computational steering
    and interactive data exploration.


    Graphics processing units (GPUs) are typically used for rendering as they are
    specialized accelerators designed for optimized graphics. Since GPUs were not
    designed to serve as stand-alone devices, they need a, centrally processing units
    (CPUs), to operate.


    While multiple simulation approaches apply well to biological applications, this
    work focuses on agent-based modeling (ABM) through its bottom-up structure that
    makes cell modeling and knowledge aggregation relatively simple. Theprob has been
    used widely to quantitatively simulate dynamic systems [1]. Many researchers have
    gained insights into their system of interest using [2], [3]. As complexity grows,
    high-performance computing (HPC) techniques to ABM have been reported in the publications
    [4], [5], [6], [7], [8], [9]. Unfortunately, the disparity of data visualization
    in output data interpretation means only a few works focus on the visualization
    components. Our goal is to fill this gap by presenting a combination of techniques
    that enable effective visualization of the simulated data without sacrificing
    performance.


    Our previous work [10] introduced a scheduling scheme to fully utilize the power
    of both CPU and GPUs when performing the simulation computation performed out
    other result, the visualization interactivity was very low as the output data
    were distributed among the host and device devices. In this, we addressed this
    shortcoming by constructing the scheduling scheme to accommodate the vi-'
