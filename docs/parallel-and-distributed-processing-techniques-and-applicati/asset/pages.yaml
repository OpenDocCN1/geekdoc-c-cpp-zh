  md: '# Automatic font generation


    # 2.1 The method


    In this section we describe the method that automatically generates character
    images of the particular font of earlymodern Japanese printed books with deep
    learning. In our method, we consider that character image has the character feature
    as the specific feature. We aimed at converting the font without keeping the character
    feature. The specific feature indicates the position of dots and lines which make
    up character. The specific feature identifies the thickness and the shape of dots.
    When character images of a modern font are input into the constructed NN, the
    character image converted into the particular font of earlymodern Japanese printed
    books is output.


    We show that our NN automatically generates a font. The NN consists of 4 convolutional
    layers and 4 deconvolutional layers with filter size of 3x3. To unify the image
    features between input and output, the final deconvolution layer size is 4x4.
    The number of channels in each convolutional layer is 128, 256, 512 and 1,024.
    The depth of padding is set to 1, and stride is set to 2. By setting stride to
    2, it works the functions of pooling and unpooling. As the activation function,
    we use the ReLU function by $f(x)=max(0,x)$. The dropout [7] is applied to the
    four convolutional layers to prevent overfitting. The dropout rate is set to 0.7.


