  md: '# # Fast Bayesian Restoration of Porupted Images with INLA


    Takahiro Kawashima¹ and Hayaru Shono


    ¹Graduate School of Informatics and Engineering, The University of Electro-Chofu,
    Tokyo, 182-8585, Japan


    **Abstract**—Photon-light images are often seen in fields such as medical imaging.
    The number of collected photons on an image sensor statistically follows Poisson
    distribution, this type of noise is intractable, unlike Gaussian noise. In this
    study, we propose a Bayesian restoration of corrupted image using Integrated Nested
    Laplace Approximation (INLA), which is a method to estimate posterior distributions
    of latent Gaussian models (LGM). While the original image can be regarded as ICAR
    (conditional auto-regressive model), our method performs much better than well-known
    ones such as loop propagation-based method and Markov chain Monte Carlo (MCMC)
    without decreasing the accuracy.


    On the other hand, recently nested Laplace approximation (INLA) is proposed by
    Rue et al. [6], then the validity has been reported mainly in fields of spatial
    statistics and epidemiology [7]. For example, INLA is used dense mapping [8],
    spatial-temporal observations of Ebola virus [9], and Bayesian outbreak detection
    [10]. There is also a similar research to, INLA-based framework which has been
    proposed in method.


    **Keywords:** Probabilistic Imaging, Image Restoration, Bayesian Modeling, Integrated
    Nested Laplace Approximation


    # ## 1. Introduction


    Estimating the image from a noisy source is one of the representative issues in
    the field of image processing. While a lot of denoising methods have been proposed,
    many such as Wiener filter require the assumption of additive white noise. However,
    in medical X-ray imaging, the number of detected photons stochastically follows
    Poisson distribution [1].


    From a viewpoint, it is natural to adapt observation modeling to deal with such
    issues, and then solve the inverse problem. In some cases, Bayesian methods to
    restore corrupted images have been already prepared. For Le et al. introduced
    a variational method with total-variation regularization [2]. Lefkimianitis et
    al. applied quadtree decomposition and expectation-maximization (EM) algorithm
    to handle Poisson noise [3]. Shino denied the fixed points of loops of belief
    (LBP) by approximating Poisson distribution with binomial distribution [4]. Fumella
    et al. compared the performance of multiple MCMC methods to restore corrupted
    images [5].


    EM, LBP, and MCMC methods are frequently used to evaluate the posterior (or its
    point estimate) of each pixel. In more general applications, Markov chain Monte
    Carlo (MCMC) methods succeeded due to their usability and accuracy. However, these
    iterative methods take too long computational time because X-ray images are


    high resolution. INLA is a framework that models observations marginal on latent
    variables (LGMs). LGM is a class of statistical models which includes a lot of
    structures, for example, auto-regressive (AR), conditional auto-regressive (CAR),
    and generalized linear mixture (GLM) methods [72]. INLA consists of two types
    of latent variables following Gaussian Markov random field (GMRF) and variables
    with interactions, but observations do not. INLA is based on Laplace approximations
    and numerical integrations as the subject names.


    In this study, we use INLA to restore image of corrupted images. When the original
    image suffers from noise of adjacent pixels do not vary sharply, the proposed
    method roughly equal to the result by a MCMC simulation.


    This paper organized as follows: first we give a brief description of INLA in
    Section 2. Then we explain how to model the original images in Section 3, and
    we evaluate proposed method show and results of the computational simulations
    in Section 4. At last, we summarize and conclude about our method.


    # ## 2. Methodology


    # ### 2.1 Latent Gaussian Models


    A latent Gaussian model (LGM) is a class of statistical models, which include
    many commonly used statistical models as auto-regressive (AR), conditional auto-regressive
    (CAR), and generalized linear mixture (GLM) model.


    Fig.1 shows the outline of LGM. In LGMs, latent variables $x = (x_1, x_2, \dots,
    x_n)$ follow Gaussian Markov


