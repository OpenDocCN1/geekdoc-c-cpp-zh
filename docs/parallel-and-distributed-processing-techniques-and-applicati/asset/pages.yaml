    **Abstract** - Reducing energy consumption during application operation has been
    a very urgent demand. Previous researchers have mostly optimized the energy consumption
    of application runtime by optimizing the hardware strategy or the software hardware
    operation. Optimizing energy consumption of the software level will be more flexible
    and have more optimization space. In this paper, a source code oriented energy
    optimization tool is proposed and designed and implemented. This tool can analyze
    the program structure and estimate the program energy consumption. It provides
    to users to debug programs from the perspective of energy consumption to help
    develop applications with lower energy consumption.


