  md: '# Controller Placement Problem for Virtual SDN Services


    Sakir Yucel

    Wexford, PA, USA


    **Abstract** - Network Virtualization (NV) and Software Networking (SDN) bring
    new business opportunities for network and service providers on innovative service
    creation and management. To capture opportunities and shine in competitive network-as-a-service
    market, network and service providers need to excel in addressing changing outcome
    requirements and in the operations of the SDN resources. One challenge is to place
    SDN controllers in optimum locations of the SDN networks that can effectively
    allocate resources and program the network flows that satisfy the customer requirements.
    This challenge has been identified as the “controller placement problem” and has
    evolved over time as the NV and SDN addressed problem in modern and innovative
    service offerings where the providers offer virtual networks to tenants. We introduce
    mixed programming formulations to decide where to place the SDN controllers for
    management of the virtual networks with respect to differing requirements and
    scenarios. We introduce algorithms to satisfy the costly and related objectives.


    SDNs evolved from a centralized control plane to being an enabler for virtual
    networks and network-as-a-service offerings. NV and SDN bring new business opportunities
    for network providers. By combining NV and SDN, network providers could provide
    many virtual SDN networks (vSDNs) on their physical SDN resources and offer them
    as network-as-a-service to multiple tenants. NV and SDN help to reduce cost of
    building and operations flexibility of innovation for network and service providers
    to capture opportunities and shine in the competitive network-as-a-service market.
    To de, providers need to excel in addressing the requirements and in the operations
    management of the SDN resources.


    One challenge for network and service providers is to effectively allocate resources
    and program the network elements with flows that satisfy the customer requirements.
    Placing the SDN controllers in locations of the SDN network is significant in
    timely programming of the network. This challenge has been identified as the “controller
    placement problem” which is of optimization problem and has evolved over time.
    Controller placement problem evolved when first solutions addressed placing a
    single controller in an SDN. Then it has addressed the same problem in WAN [12];
    placing multiple controllers or building a hierarchy of controllers [7][8], covering
    multi-domain controllers [9][10][11], incorporating the resiliency of controllers
    [12][14][15]; and recently trying to solve controller placement in hypervisor
    and virtual network environments [12][13]. Many studies have been done on the
    optimal placement of the controllers in different settings. Most studies formulate
    the problem as integrating and offering some heuristics for approximations. Controller
    placement problem is NP-hard and therefore some heuristics and algorithms are
    presented in these studies [3][4].


    **Keywords:** Software Defined Network, Controller Placement Problem, Virtual
    SDN Network, Virtual SDN Service


    # 1 Introduction


    Network virtualization (NV) allows creating virtual networks over physical network
    resources. Each virtual network could be tailored to the requirements of different
    applications and/or tenants. Virtual networks share the physical resources.


    Software-defined networking (SDN) separates the network control plane and the
    forwarding plane by enabling routing decisions on multiple network elements. Programming
    the network flows by SDN controllers helps the network operators to configure
    the flows based on forth policies (policy, traffic engineering and QoS policy)
    and business''s objectives. Analytics and intelligence could be employed by the
    controller to make better decisions. SDN controllers use southbound interfaces
    for programming network elements. Northbound interfaces could offer innovative
    APIs opening up many possibilities for dynamic service creation and management.


    The problem in this paper is to build on the existing research on the placement
    of controllers in virtual SDN networks, particularly to extend the work in [12].
    Our objectives with this paper is to develop terminology and formulations for
    the controller placement problems in recent and innovative virtual SDN'
