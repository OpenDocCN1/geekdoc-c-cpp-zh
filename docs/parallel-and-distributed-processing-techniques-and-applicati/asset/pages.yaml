    \n# 2.1 Multi-objective optimization problems\n\nThere are multiple objective\
    \ functions. When functions are not to be maximized/rather approximated to certain\
    \ target values, they can be unified into a single objective function by summing\
    \ the errors from the target values in each objective function. The formulas for\
    \ calculating this unification of objectives are shown in eqs. (1), (2), and (3).\n\
    \n```\n$$\\min F = \\sum_{i=1}^{l} |\\tilde{f}_i| \\quad (1)$\n$\\\tilde{f}_i\
    \ = \\frac{\\hat{f}_i}{\\hat{f}_{max}} \\quad (i=1,2,..,m) \\quad (2)$\n$\\Max(|f_i\
    \ - \\hat{f}_i| - th_i, 0) \\quad (3)$\n$\\Max(f_i - \\hat{f}_i, 0)$\n```\n\n\
    $\\hat{f}_{max}$ is the maximum value of $|\\tilde{f}_i|$ in all $i$. When a function\
    \ aims to keep the error from the target value $f_0$, within an allowable value\
    \ $th_i$ is selected as $\\hat{f}_i$. When a function aims to obtain a larger\
    \ value than the target $f_0$, (b) is selected as $\\hat{f}_i$. When a function\
    \ aims to obtain a smaller value than the target $f_0$, (c) is selected as $\\\
    hat{f}_i$. When $F$ is equal to 0 is a satisfied solution, which indicates that\
    \ all functions satisfy the given conditions.\n\n# 2.2 Many-constrained\n\nIn\
    \ optimization problems with many constraints, the unification can be applied\
    \ [10, 11].\n\n```\n$$\\min F = \\sum_{i=1}^{l} |\\tilde{f}_i| + \\sum_{i=1}^{k}\
    \ |\\tilde{g}_i| \\quad (4)$\n$\\\tilde{g}_i = \\frac{\\hat{g}_i}{\\hat{g}_{max}}\
