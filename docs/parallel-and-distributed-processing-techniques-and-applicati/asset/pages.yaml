  md: '# Foreword


    It gives great pleasure to introduce this collection of papers to be presented
    at the 2019 International Conference on Parallel and Distributed Processing Techniques
    and Applications (PDPTA19), July 29 – August 1, 2019, at Luxor Hotel (a property
    of MGM Resorts International), Las Vegas, USA. The preliminary edition of this
    book (available in July 2019 for distribution on site at the conference) includes
    only a small subset of the accepted articles. The final edition (available in
    August 2019) will include all accepted articles. This is due deadline extension
    requests from most authors who wished to continue the write-up of papers (by incorporating
    the references suggestions).


    The final edition of the proceedings will be made available at https://americancse.org/events/scce2019proceedings/


    An important mission of the World Congress in Computer Science, Engineering, and
    Applied Computing (CSC a federated congress to which these are affiliated) is
    “Providing a unique platform for a diverse community of constituents composed
    of scholars, researchers, developers, educators, and practitioners. The Congress
    makes effort to reach out to participants with diverse entities (such as universities,
    institutions, government agencies, and research centers/labs) from all over the
