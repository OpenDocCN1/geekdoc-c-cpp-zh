    # 2.1 Offset technique


    Offset technique is used to recognize shape features by evaluating the changes
    of surface area for each offset step. Offset process is executed with the direction
    facing the inner side of the model (refer to Fig. 1). The end-terminal surfaces
    to have a larger change in surface area in comparison to the offset surfaces.
    In other words, the area of end-terminal surfaces has a tendency to go zero along
    the offset process. An experiment with Offset technique is performed for a model
    in step 2, where the tendency of changes during offset process is shown in Fig.
    3. Figure 4 indicates the offset surface area ratio, and horizontal axis indicates
    the number of offsets. In graph, F1 is a filled surface on the bottom side of
    rib, while T1 and T2 are end-terminal surfaces. P1 and P2 are the other surfaces.
    Referring to Fig. 3, it is clear that T1 and T2, which have the characteristic
    as end-terminal feature, show a drastic decrease in surface area compared to the
    other types. This omission of surface area ratio can be implemented to distinguish
    end-terminal surfaces from the other. End-terminal surfaces have larger changes
    of surface area or smaller angle $\varphi$ have indicated in Fig. 3. All surfaces
    that are smaller than the threshold angle $\varphi$ have high probability as end-terminal
    surfaces.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_206_1.png)


    Fig. 2 Sample model for explanation of Offset technique


    However, it is not easy to fix the value for $\varphi$ because the offset area
    is depending on the geometry contours. The variance of offset area ratio for different
    models will cause instability if the recognition of end-terminal surfaces is determined
    by the threshold value. For example, if the threshold angle $\varphi$ is determined
    as $\varphi$ as indicated in Fig. 3, T1 will be recognized as end-terminal. On
    the other hand, if it is determined as the other surface. Therefore, the decision
    on the recognition of end-terminal based on threshold value is prone to misleading.
