    # 1 Introduction


    Early research on optimization of computer system energy consumption focused on
    circuit improvement of computer system hardware and optimization of corresponding
    physical parameters, as dynamic voltage scaling (DVS) technology commonly used
    by processor manufacturers in this field, such as reducing energy consumption
    by synchrony reducing supply voltage and frequency during program operation according
    to the characteristics of CMOS circuits. While hardware optimization is more mature,
    more attention is turned to software optimization, to achieve the achievement
    of lower power consumption and to reduce the energy consumption of the system.


    The problem of energy consumption in big data centers is more and serious, due
    to the lack of tools for searching program energy consumption that is highly integrated
    with the programming environment, software developers when implementing software,
    and do not understand the impact of their decisions on energy consumption. According
    to the situation, if developers can analyze the energy consumption of their code
    while coding, they can debug the code at any time to identify the energy consumption
    of the code. As a debugging tool to assist developers in energy consumption optimization,
