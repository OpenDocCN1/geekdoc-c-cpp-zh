    # 3.2 Dataset evaluation


    For optimizing k-nearest neighbor algorithms and their hyperparameters, we used
    a smaller dataset instead of that in original dataset which required many trials.
    We used a 1% sample of a dataset selected. In the selection of hyperparameters,
    we evaluate the accuracy of prediction because it requires huge structure. Instead,
    we measured the accuracy of k-nearest neighbor prediction. The dense score is
    used as a subroutine in dynamic programming, but we can also use the confidence
    score for checking the prediction of k-nearest neighbor on dataset. We calculated
    the area under the receiver operator characteristics (AUC) for predictions by
    each algorithm and hyperparameters, and then judge them based. We performed 10-fold
    validation, which divides a dataset into 10 subsets and 1 for the first test and
    9 for the rest. There are two viewpoints, computing time and accuracy, and thus
    it is difficult to determine the balance between them. Here, we accepted the decrease
    of accuracy in AUC less than 0.05 from original, and selected the finest ones.


    The method predicts a suitable (matching) process using the information with k-nearest
    neighbor method. k-nearest neighbor calculates the distance between an input feature
    vector and training data and checks the labels of the k nearest feature vectors.
    The label of training data is binary or unmatched generally used for classification
    tasks. Thus, the output becomes a predicted class of the input. However, predicting
    binary labels is coarse-grained for alignment task. Thus the method employed k
    = 1000, and the classification score, which is the ratio of predicted positive
    labels, was used as the substitution score.


    # 2.2 Sequence alignment by dynamic programming


    Sequence alignment between query and subject sequence was calculated by Smith-Waterman
    algorithm, which is dynamic programming for local sequence alignment. The length
    of query and subject sequence are M and N, respectively, the order of Smith-Waterman
    becomes O(MN). For every dynamic programming matrix, cells score is used. Thus,
    M times k-nearest neighbors are needed for one k-nearest neighbor prediction.
    The time required depends on the size of dataset. When using a 10% of SCOPAF8
    database [8], one prediction needed less than one. However, however proteins have
    almost 200 amino acids, and 40,000(≈200×200) predictions are required. Thus, several
    methods are needed for generating a sequence alignment.


    # 4 Reduction of k-nearest neighbor predictions


    For calculating general sequence alignment by dynamic programming, basically all
    paths in dynamic programming matrix must be checked. However, in reality we have
    already obtained a rough alignment when we searched for a database and we can
    remove irrelevant sequence regions from the query and subject. Thus, we assume
    that the optimal path will exist along the diagonal of the dynamic programming
    matrix. Using the knowledge, we use a heuristic that ignores the score of such
    regions and the component score of sequence alignment by dynamic programming.
    2 shows the chart of the acceleration of dynamic programming. The method indicates
    an optimal path may not be affected if we do not calculate the score of the regions
    at left top and right bottom. The method is essentially effective in this case
    because a k-nearest neighbor prediction is required for each score calculation
    and it is much more time than consuming general sequence alignment.


