    #  2. Methodology


    ### 2.1 The Case for VSLAM Runtime Adaptation


    In an environment where a VSLAM sensor experiences changing motion, the power
    consumption and accuracy can be balanced in the change. For example, if the sensor
    moves slowly and the observed scene may be essentially redundant with the tracking
    frame window, in case power can be reduced with little impact on accuracy. Although
    both ORB-SLAM and DSO performance tracking based on keyframes, the amount of computation
    is partially influenced by the dynamics. To illustrate this, we designed a synthetic
    dataset where the camera observes anB scene with rich features to ensure robust
    tracking on both algorithms and rule out effects caused by changes in the observed
    scene itself. The scene has a sinusoidal 2D motion with speed that peaks when
    being faster, as shown in Fig. 1; this means that the observed scene is most similar
    and easy to track at the poses. We ran ORB-SLAM and DSO on how they are affected
    in terms of computation and power consumption. To facilitate this, we pinned the
    two threads of each algorithm, the tracker and mapper threads, to separate CPU
    cores and measured the number of cycles executed per second with the power consumed
    by cores.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_13_0.png)


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_13_1.png)


    relatively power consumption can be observed when the camera moves slowly. Looking
    at the scene, the DSO is more dominant in terms of the amount of computation and
    shows more on power consumption compared to the tracker, but it is less sensitive
    to the change in camera motion. The given fact that both ORB-SLAM and DSO take
    little adjustment and redundant secrecy to perform fewer computations for saving
    power, we have an opportunity to perform runtime adaptations based on the sensor
    motion to reduce power consumption with minimal impact on the SLAM accuracy. From
