    # 2.2 The Adaptation Strategy


    In order to take advantage of the nature of camera motions, knowledge about the
    motion is required for the adaptation. In practice, the variations in camera motion
    depend on the hosting platform, eg drones or smartphones, which will be unpredictable
    in advance. To address this issue we propose a linear adaptation model based on
    min-max scaling to the changed metric, $D$ (camera pose, for example), denoted
    by $D''$ - $X$, may be varied (for example, on the DVFS levels available on the
    processor). Based on the correlation type between the scalar $D''$, and the applied
    change to the controller parameter, $X$ can be written as the following positive
    correlation:


    ```

    $X_p = X_{min} + (X_{max} - X_{min})D''_i$$

    ```


    And for negative case:


    ```

    $X_n = X_{max} - (X_{max} - X_{min})D''_i$$

    ```


    where $D''_i$ is defined as:


    ```

    $D''_i = \frac{min(D)}{max(D) - min(D)}$

    ```


    In above equations, $X_{min}$ and $X_{max}$ are the minimum and maximum values
    for the controller parameter, and $min(D)$ and $max(D)$ are the minimum and maximum
    values of the metric $D$ encountered as the sensors along its trajectory.


    This model can be used for parameter adaptation in both the SLAM system and formulation
    hardware. The advantages of this approach are two-fold, first it allows the adaptation
    to respond quickly to large changes as they are encountered in the SLAM without
    the need for prior knowledge of nature or scene. For example, when it is at its
    peak ($D = max(D)$) the model immediately ensures that the adaptation parameter
    operates at its highest value, leading to enhanced robustness. The second advantage
    is decoupling the adaptation process, which means the model can work with any
    metric. In this case we use the change in sensor motion in constant motion, the
    controller parameter $X$ will operate on its highest or lowest level, depending
    on the correlation. In such a case, the value $X_{max}/X_{min}$ can be easily
    tuned to achieve the desired result.


    The model is used to explore two general adaptation strategies that do not involve
    significant changes to the


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_14_0.png)


    SLAM base code and settings, which is useful if formula parameters and settings
    are already tuned through space exploration. Furthermore, these adaptations can
    be applied to a variety of SLAM formulations and platforms. In this paper, the
    first adaptation strategy seeks to identify and skip frames dynamically before
    they are fed to the SLAM system, indirectly affecting power consumption, and the
    second targets the platform through DVFS adaptations, directly influencing power
    consumption.


    # 2.3 Motion-based Metric


    Characterising the change in SLAM state with a small number of parameters has
    proved in [6], the Kalman-Leibler divergence is used as a measure for the change
    in sensor unless the scene has dynamic objects. In this work, we focus on the
    change in motion estimated by the SLAM as a heuristic for tracking difficulty,
    faster motion implies tracking difficulty.


    For each frame to SLAM, there is estimated translational and rotational value
    computed for the camera pose. We define the change in camera motion at time $t$
    between two subsequent frames:


    ```

    $D_t = \Delta_s / \Delta_p$$

    ```


    where $\Delta_p$ is the difference between camera pose at $t$ and $t-1$. The metric
    $D$ can be used with Eq. 3 to guide the adaptations.


    # 2.4 The Adapted Parameters


    # 2.4.1 Dynamic Frame Skipping


    Skipping frames can be useful in reducing the amount of computation required by
    the tracker. Assuming a fixed frame rate, when a frame is skipped the tracker
    thread follows until a new frame arrives for processing. Deciding which frames
    to skip without leading a significant impact on the accuracy is'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'not trivial. Dense SLAM formulations require all frames to be processed to
    build a map of the scene, whereas keyframe-based formulations rely only on one
    set of the frames for tracking, depending on formulation requirements; for example,
    the change in the field of view or brightness. Slow scene implies multiple frames
    can be skipped without losing accuracy. This is true unless there are moving objects
    in the scene, in which case it may be possible to couple the metric with a similarity
    metric to compare between subsequent frames without skipping potential frames.
    The larger the change in motion the fewer frames be skipped; It is necessary to
    determine the number of frames skipped in succession based on the number of successive
    frames (a maximum number). We denote this adaptation with (S) throughout the rest
    of the page.


    monoVO dataset on the basis that it provides full ground truth trajectory which
    is essential for in-sequence abnormal drift or loss of track, as required by our
    evaluation. EuroMAC has real video scenes captured by a stereo camera mounted
    on a drone at 20 feet (FPS). We use the collected footage in our work: 11 sequences
    with varying dynamics in terms of motion, which are similar to our evaluation.
    ICL-NUM, on the other, is a synthetic indoor dataset containing a total of 8 video
    sequences from office and living rooms with complete ground truth trajectories.
    The datasets run at 30 FPS which is suitable for comparison. We use it to evaluate
    the adaptation process with VSO on a mobile robot. Each set of frames from both
    that have varying and different motion dynamics are selected from datasets.


    # 2.4 DVFS Adaptation


    Most current CPUs employ Dynamic Voltage and Frequency Scaling (DVFS), which governs
    the operating frequency by a predefined policy, to save energy or deliver better
    performance. The goal is to adapt the frequency based on the changed motion of
    the SLAM sensor to save power with minimal impact on accuracy, the larger the
    change in motion, the higher is the desired frequency (i.e. there is a positive
    correlation between the measured change and frequency). Since the correlation
    is positive, we can learn to determine the appropriate frequency. To facilitate
    this adaptation, SLAM Tracker and Mapper threads are pinned to CPUs with the Performance
    Governor, enabling them to operate at the highest frequency. The frequency is
    then updated at runtime using the value X, according to this model. This adaptation
    is denoted by (F) throughout the rest of the page.


