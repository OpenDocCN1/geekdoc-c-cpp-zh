  md: '# A Dynamic Adaptation Strategy for Energy-Efficient

    Keyframe-Based Visual SLAM


    Abdullah Khalufa, Graham Riley, and Mikel Luján

    School of Computer Science, The University of Manchester, United Kingdom


    Abstract—This paper presents a light-weight dynamic control strategy for VSLAM.
    The control strategy relies on sensor motion for adapting the control parameters
    of the algorithm and computing device at runtime. We evaluate the strategy on
    two platforms, desktop and mobile in the context of both direct and indirect keyframe-based
    VSLAM. Our results indicate that the control change on the camera pose over the
    trajectory of the sensor. As control parameters, the strategy uses DVFS (Dynamic
    Voltage and Frequency Scaling) on the device and a frame-skipping technique to
    identify and skip keyframes with low value to the accuracy of the VSLAM. We present
    results from a number of synthetic and real scenes from the ICL-NIU MAV datasets,
    illustrating the power savings and impact on accuracy. Our results show a best-case
    power reduction of 77% with marginal impact on accuracy and robustness of the
    VSLAM algorithms over multiple runs of most of the scenes compared to original
    real-time versions of the algorithms. Analysis of the scenes which show the most
    impact indicates that this is caused by some points in the trajectory which motivates
    the continued search for improved control metrics.


    However, during VSLAM runtime, these performance objectives require knowledge
    about the deployment environment and the nature of camera motion and of the scene,
    all of which are usually unknown in advance. Coupling this with the VSLAM algorithms
    interpret the scene in different ways, a potentially adaptation strategy relies
    rarely on the camera pose as a heuristic or with large set of performance objectives.
    Using the change in motion as a heuristic can lead to a significant impact on
    tracking accuracy due to the lack of adequate tracking information, whereas VSLAM
    tracking, slow motion usually implies redundant and easy-to-track scenery, assuming
    that the scene is relatively rich in tracking information and state (without moving
    objects). In, the case of a camera with high motion, slow motion can be utilised
    for power saving, to maximise battery life. The ability to adapt to these unpredictable
    and sudden changes in motion while controlling power and accuracy is essential
    for our goal.


    **Keywords:** SLAM, Runtime Adaptation, Energy-Accuracy tradeoffs


    # 1. Introduction


    Visual localisation and mapping (VSLAM) is the process of simultaneously estimating
    and tracking the pose (primarily position and orientation) of a mobile platform
    using a camera while building a map of its surroundings. A VSLAM is a key building
    in many robotics and applications ranging from Unmanned Aerial Vehicles to augmented
    reality (AR) and gaming devices. This wide range of algorithms has resulted in
    a variety of VSLAM algorithms, formulated to achieve achieve estimation in each
    target environment.


    The deployment of these algorithms on platforms with limited computational and
    power resources is challenging and involves different performance objectives,
    such as accuracy, power consumption, or frame rate, at time by exploring the available
    parameter space [1]–3].


    +   - A novel linear adaptation strategy based on min-max minimisation of the
    loss in VSLAM tracking state.

    - A study of two portable adaptation parameters for improving power consumption
    with minimal impact on the accuracy of the two algorithms on two computing devices
    using the EuRo MAV and ICL-NIU datasets.

    - An analysis of the robustness of the algorithms over'
