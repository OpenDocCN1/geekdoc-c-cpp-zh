    inactive compounds, $N_{Neg}$ is the number of inactive compounds ranked than
    the $i$-th active compound, $N$ is the number of compounds, $N_{Pos,\}$ is the
    number of active compounds in the top $\ \%$, and $EF_{\%} = \frac{N_{Pos, \%}}{N_{Pos}}
    \times 100$.


    The AUC is 0.5 and 1.0 for random and complete predictions, $EF_{\%}$ is a value
    indicating how much the time compound can be concentrated to the top $\%$ through
