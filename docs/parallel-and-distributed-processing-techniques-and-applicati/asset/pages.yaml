    # 4. Experiments


    # 4.1 Preprocessing


    To handle general images with our model and control their contrast, firstly transform
    the pixel value $I_i$ in the original image into pixels $I = (I_1, \dots, I_n)^T$
    and its transformation $x$ consist of $n$ pixels. In particular, we use linear
    transformation


    ```

    $x_i = \frac{I_{\max} - \lambda_{\min}}{I_{\max} - I_{\min}}(I_i - I_{\min}) +
    \lambda_{\min},

    ```


    # 3.2 Proper ICAR Models


    To guarantee properness of ICAR models, regularization are frequently implemented:
    scaling $x$ by $\sum x_i=0$ or adding extra terms to the parameters of equation
    (8). We adopt the latent strategy, the number of detected photons must be non-negative.
    We use proper prior ICAR model for the GMRF of object,


    ```

    $p(x_i) = \mathcal{N} \left(x_i, \frac{\sigma^2}{|C_i| + d} \sum_{j \in C_i} |C_j|
    + d\right),

    ```


    where $d>0$ is an extra hyperparameter for stability. In this study, we configure
    in a grid without periodic boundary condition for the GMRF to deal with images.
    For instance, we consider the probability of a non-convex pixel $p(x_i)$ of an
    $L \times L$ image. Here we can define


    ```

    $p(x_i) = \mathcal{N} \left(x_i, \frac{\sigma^2}{4+d}(x_{i-1} + x_{i+1} + x_{i-L}
    + x_{i+L})\right),

    ```


    where


    ```

    $\mu_i = \frac{1}{4+d}(x_{i-1} + x_{i+1} + x_{i-L} + x_{i+L}),

    ```


    # 4.2 Evaluation Criteria


    In our simulations, we use signal-to-noise ratio (PSNR) and structural similarity
    (SSIM) [16] to measure similarities between denoised images. PSNR is defined by


    ```

    $\frac{(\max(G, H) - (G,H))^2}{MSE(G,H)}$

    ```


    ```

    $MSE(G,H) = \frac{1}{n}\sum(G_i - H_i)^2$,

    ```


    where $G = (G_1, \dots, G_n)^T$ and $H = (H_1, \dots, H_n)^T$ denote images with
    n pixels. PSNR focuses on the corresponding pixel value. To consider the perceptual
    similarity between images, we also use SSIM for the evaluation criteria. SSIM
    is defined as:


    ```

    $SSIM = \frac{(2\mu_G\mu_H + c_1)(2\sigma_G\sigma_H + c_2)}{(\mu_G^2 + \mu_H^2
    + c_1)(\sigma_G^2 + \sigma_H^2 + c_2)}$

    ```


    # 3.3 Observation Model


    In photon-images, the number of observed photons $y_i$, follows Poisson distribution
    with the true value $x_i$. Hence we


    ```

    $p(y_i) = \text{Poisson}(y_i|x_i)$

    ```


    as the observation model straightforward, and $y_i$ is assumed to be independent
