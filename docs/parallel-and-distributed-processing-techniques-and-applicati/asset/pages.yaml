    Fig. 2. System Architecture


    Figure 1 illustrates the software stack of a computing device in our system which
    includes the following: (i) Hardware Abstraction Layer (HAL) a layer that enables
    to the hardware components of computing devices such as RAM, ROM, serial interfaces,
    etc. (ii) OS Layer: Computing devices have either embedded or Real-Time Operating
    Systems (RTOS) that are particularly suited for small constrained devices and
    can provide communication specific capabilities. (iii) Runtime Environment: The
    actual runtime runs over the OS. It has several actors which interact with each
    other both locally and over the network. The runtime provides a uniform environment
    for all actors, regardless of hardware or operating systems. (iv) Application
    Layer: Actor-based applications are deployed on top of the runtime. Actors are
    defined as sets of functions which represent as actors that perform data generation
    (e., sensors), and data consumption (e., actuators). Actor code execution is triggered
    by events such as receiving a new message from actor locally or remotely, or detecting
    a change in the state of a sensor.


    In Akka, a message dispatcher is the core engine for the runtime system because
    it controls the processor cycles to actors. The dispatcher has access to the global
    message queue, actors'' mailboxes, and the pool of threads which executes actors.
    One of the necessary configuration settings to Akka message dispatcher is throughput,
    which defines the number of messages delivered to an actor at once. For example,
    if the input is set to m, and the number of messages queued in the global message
    queue is n, m messages are delivered to the actor in one and wait for the next.


    Figure 3 illustrates the life cycle of message dispatcher in Akka. When a message
    is sent to an actor, it is placed in the global message queue. When it is actor''s
    turn to execute, it requests an idle from the thread pool to create a Runnable.
    The dispatcher then moves the number of messages for actor - as determined by
    the global queue to the actor''s mailbox. Once a message has been given to an
    actor to execute, the gatekeeper examines the priorities for execution, and finally
    runs the runtime to execute the actor for those messages only if permissible.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_48_1.png)


    Fig. 3. The Life Cycle of Message Dispatching in Akka


    As shown in Figure 2, the system architecture consists of concurrent runtime environments
    on heterogeneous computing devices, which support the execution of actors and
    managing them. A gatekeeper decides whether to deliver or post the delivery of
    messages for an actor according to some priority settings by the programmer. When
    a actor sends a message to another actor deployed in the local runtime environment,
    the gatekeeper dispatches the message to the runtime dispatcher component, which
    in turn transports the message to the receiving actor using the router.


