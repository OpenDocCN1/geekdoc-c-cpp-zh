    # ## 1 Introduction


    Offline character recognition is a classical field of pattern recognition research.
    Japanese character recognition has been investigated from the alphabet based Euro-American
    character recognition to the huge number of Japanese characters and their extremely
    complicated shapes. In ''80'', feature extraction was a hot spot in Japan and
    in fundamental algorithms such as Peripheral Direction Contributivity Feature
    (PDC) [1], Weighted Index Histogram Method [2], and Classifier Features [3] have
    been proposed. With use of these algorithms, we have developed a large-scale neural
    network which recognizes 30000 Japanese handwritten characters [4][5] taken from
    ETL[6] Euro-American character recognition adopted a convolution neural network
