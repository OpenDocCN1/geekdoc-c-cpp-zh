    # 5. Experiments

    We checked if the two-sided Jacobi method (arctan and Ruthaser rotations) has
    shorter time and accuracy than the one-sided Jacobi method in LAPACK [11] for
    small matrices. Table 1 shows the experimental environment. We used eight matrices
    for the comparison:


    +   - $A_1$ size: $500 \times 500$, an upper triangular matrix

    - $A_2$ size: $1000 \times 1000$, an upper triangular matrix

    - $A_3$ size: $1500 \times 1500$, an upper triangular matrix

    - $A_4$ size: $2000 \times 2000$, an upper triangular matrix


    and

    In $A_1, A_2$, and $A_3$, all elements are set to random number $\epsilon \in
    [0, 1]$ generated by random number generator. In $A_1, A_2$, and $A_3$, all elements
    are set to 1.

    The two-sided Jacobi method (arctan and Ruthaser rotations) has shorter computation
    time and accuracy than the one-sided Jacobi method in LAPACK [11] for the $500
    \times 500$, $1000 \times 1000$, and $1500 \times 1500$ upper triangular matrices
    with elements generated by random number generator and for the $500 \times 1000$
    upper triangular matrices in which all elements are 1. The performance results
    are given in Table 2 and 3.


    # 6. Conclusion

    We confirmed through experiments that the two-sided Jacobi method (arctan and
    Ruthaser rotations) has shorter computation time and accuracy than the one-sided
    Jacobi method for smaller matrices.

    For future work, we plan to apply our two-sided Jacobi method to implement the
    modified Sakura-Sakigura method [9].


