  md: '# 5. Related work


    The Evaluation of VSLAM is based on multiple metrics, for trajectory and map accuracy,
    per-frame execution time, resource utilisation, etc. [11][12][13]. The trajectory
    accuracy can be measured by all the estimated camera translational poses [14],
    and this is the metric used in this paper. Finding the desired trade-off between
    performance metrics utilizes a large number of parameters from both VSLAM and
    the exploration strategy achieved by Dense Space Exploration (DES) [1][22]. During
    runtime, adapting all of these parameters to cope with change and environment
    is not feasible, especially under a real-time constraint. Said et al. [6] propose
    the use of a small set of parameters based on information theory to measure the
    change in the scene which is measured using KineticFusion [15]. The selection
    of set of “knots” in KineticFusion [16], because of VSLAM, is based on the sensor
    detection. Their control model is designed on the assumption that movement between
    frames is small, which is possible in such an environment, but is not available
    for the wider range of VSLAM applications. To handle the change, we propose a
    proactive approach, capable of adapting to the environment which does not require
    explicit knowledge of the VSLAM algorithm. Further, we utilize runtime adaptations
    on all of the most used key-frame formulations.


    # 6. Conclusion and Future Work


    In this paper, we have presented a runtime adaptation strategy which can provide
    significant power with small impact on the accuracy and robustness, relying on
    sensor guidance for evaluation. The evaluation of the proposed strategy using
    two VSLAM-related algorithms on that shows that the desired objective is achieved
    for the majority of scenes investigated. Analysis of the results shows that the
    objective is not fully met but the robustness is impacted at certain critical
    points in the tracking, and therefore, cannot be rejected. This motivated the
    continued search for alternative metrics which would be capable of identifying
    and tracking motion type, rather than relying on pure motion changes. Future work
    will also consider incorporating more information from the scene, which can be
    expected to provide further improvements.


