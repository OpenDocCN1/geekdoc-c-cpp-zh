    # 2.3 Reinforcement learning for partially observable Markov decision process


    Regarding the inventory with the demand forecast, we need to consider partial
    observability. The partially observable Markov decision process (POMDP) provides
    a framework for making decisions under uncertainty. A POMDP is defined as a tuple
    $(S, A, O, T, R)$ where $S, A$, and $O$ are the state, action, and observation
    space, respectively. The transition $T(s, a) = P(s''|s, a)$ is the probability
    of the agent being in $s''$ after taking action $a$. The observation $O(o|s, a)$
    is the probability of the agent receiving observation $o$ after taking action
    $a$.


    In a POMDP, the agent cannot know its exact state, but we define $b(s)$ as $b(s)
    = P(s|h)$, where $h$ denotes past observation and action. Although belief lists
    using the updating rule can form completely observable MDP, among several heuristic
    approaches for POMDP, [13] proposed $Q(b, a) = \sum_{s \in S} b(s)Q(s, a)$.


