  md: '# On an Implementation of Two-Sided Jacobi Method


    Sho Araki¹, Masami Takata², Kenji Kimura³, and Yoshimaka Nakamura¹

    ¹Graduate School of Informatics, Kyoto University, Kyoto, Kyoto, Japan

    ²Research Group of Information and Communication Technology for Life,

    Nara Women''s University, Nara, Nara, JAPAN

    ³Department of Electrical and Electronics Engineering, University of Fukui, Fukui,
    Fukui, JAPAN


    The Jacobi method for singular value decomposition can compute all singular values
    and vectors with high accuracy. Previous studies have proved that the Jacobi method
    is more accurate than the QR algorithm. The computation cost in the Jacobi method
    is higher than that of the computation, which combines the QR method and bidiagonalization
    using the Householder transformation. However, the computation cost is insignificant
    for very small matrices. Moreover, the method can be implemented as an embedded
    system such as FPGA because of its simple operation. Based on the QR method, one-sided
    and two-sided Jacobi methods are proposed. One has been implemented in LAPACK.
    There are still many parts which can be improved in the implementation of the
    two-sided method. Thus, in this paper, we prove through experiments that the two-sided
    Jacobi method has a shorter computation time and exhibits a higher accuracy than
    the one-sided Jacobi for small matrices.


    the row space in a lower bidiagonal matrix is equal to the column space in the
    upper bidiagonal matrix, it can be computed by the right singular vectors, achieved
    by the OQDS method, which was proposed in [1].


    To reduce the computation cost and improve accuracy, the Sakuchi-Sakura method
    was made improved by Imakura et al. [9]. The modified Sakuchi-Sakura method requires
    both the left and right singular vectors. The OQDS method can achieve high accuracy
    when only column space is required. Thus, the OQDS is compatible with the modified
    Sakuchi-Sakura method. Actually, when the left vectors of the lower bidiagonal
    matrix are computed by the OQDS method, the result is as large as the given size.
    The left singular vectors of a matrix are obtained by extracting the smaller matrix
    from the larger matrix. It is not guaranteed that the computed left singular vectors
    in the lower bidiagonal matrix will have high accuracy. Hence, to implement the
    modified Sakuchi-Sakura method with high accuracy, we propose a method for singular
    value decomposition, which can address all singular values and right singular
    vectors.


    **Keywords:** singular value decomposition, one-sided Jacobi, two-sided Jacobi
    method, False position method, section fused multi-algorithm


    # 1. Introduction


    Many mathematical applications require an eigenvalue formula for computing a symmetric
    matrix and a positive symmetric matrix, although these use only eigenvalues and
    the corresponding vectors. The Sakuchi-Sakura method [15] is known as a truncated
    eigenvalue decomposition and uses column space. To compute the column space, a
    rectangular matrix is first processed using bidiagonalization. Generally, a matrix
    is transformed into a bidiagonal matrix by the Householder transformation [3]
    as in [1], a method for column space, adapted to a bidiagonal matrix, is proposed.
    The proposed method uses the QDS (differential orthogonal qr with shift) methods
    [12]. The Sakuchi-Sakura method is sufficient only for singular vectors, which
    are based on the left singular vectors, in an upper bidiagonal matrix.


    James Demnel and Kevin Veselic in their paper that the Jacobi method is more accurate
    than QR [4]. Actually, one-sided and two-sided Jacobi methods have been proposed
    [5], [6], [10]. The method was implemented in LAPACK [11]. There are still many
    parts which can be improved in the implementation of the two-sided Jacobi method.
    Thus, in this paper, we improve the two-sided Jacobi method. Experimental results
    show that the two-sided Jacobi method has shorter computation time and higher
    accuracy than the one-sided Jacobi method for small matrices.


    # 2. Target methods


    The two-sided Jacobi method for eigenvalue decomposition can compute the eigenvalues
    and eigenvectors of a real symmetric matrix. More precisely, it is also possible
    to extend the method to Hermitian matrices. Actually, the two-sided Jacobi method
    for singular value decomposition can be designed to perform computations on'
