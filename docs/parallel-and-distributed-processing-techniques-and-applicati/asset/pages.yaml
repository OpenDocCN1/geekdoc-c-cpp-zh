    Abstract - The advent and proliferation of the Internet of Things calls for a
    paradigm shift toward edge computing, which facilitates collective intelligence
    of edge nodes. Among parallel machine learning models, Stale Synchronous Parallel
    (BSP) model is well-suited to operate distributed machine learning with edge nodes.
    This paper seeks for a versatile solution that warrants robustness in cost of
    computing under adverse conditions and asynchronous staleness level. Computer
    simulation reveals that the proposed approach substantially outperforms the conventional
