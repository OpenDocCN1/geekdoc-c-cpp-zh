    # 2. Docker


    Docker [11] is the most popular set of tools and platform for managing, deploying,
    and sharing of Linux containers. It is an open-source software on GitHub Repository,
    created by Mobi [21], written in Go, collected by worldwide developers. There
    are related tools and services of Docker, such as Docker Hub [6], the largest
    container image registry to exchange developed containers. Docker machine [22]
    provides environments for Windows and macOS using a combination of Docker and
    the hypervisor-based approach.


    # 2. Overview of container-based virtualization


    # 2.1 Sharing image via Docker Hub


    There are two concepts of virtualization approaches in the context of applications
    running on a cloud environment: hypervisor-based and container-based.


    # 2.1 Hypervisor-based virtualization


    A container image includes all the dependencies necessary to execute the target
    application: code, runtime, system libraries, and configurations. Thus, it allows
    us to reproduce the application environment as we build, and deploy onto onto
    with many other users. Users can share their application environment through other
    methods, but sharing of container images via the Docker Hub [6], and downloading
    (pull) of the same container image onto a different machine environment (Fig.
    2).


    In hypervisor-based virtualization, the virtual environment is provided by a higher-level
    "hypervisor" that manages the OS (Supervisor) machines (Fig. 1). The "virtual
    machine" (VM) widely used in general cloud environments is provided by the hypervisor-based
    virtualization that enables us to use various operating systems such as Windows
    and Linux on OS, which is managed by a hypervisor on the Host OS or hardware.


    # 2.3 Filesystem of Docker container image


    Docker adopts a layered file system as the file system in the container image
    to reduce the total size of the image. Each image layer corresponds to a batch
    of operations or changes in the file system and each container has a hash id.
    Its layered file system has great benefits on reproducing the operations, rollbacks,
    reuse of the same container layer that has the same id; these contributes to the
    reproducibility of the application and also of the research. Note that such a
    layered file system does not show good performance at the latency of the file
    I/O due to its differential layer management that we usage


    There are various types of implementations for the hypervisor-based virtualization,
    such as Kernel Virtual Machine (KVM), Hyper-V [18] used in Microsoft Azure, AWS
    Web Service, XEN [19] used in Linux and VMware [20].


