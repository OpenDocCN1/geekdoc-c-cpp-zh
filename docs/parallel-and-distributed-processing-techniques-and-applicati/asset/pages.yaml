    \ software environment and execution binaries, is isolated as a container, and\
    \ immediate software distribution as an executable format can be used [5], [6].\
    \ This feature facilitates the management of the software environment and distribution,\
    \ introducing new flexibility. It has also been reported that the container is\
    \ lighter than the virtual machine when used to implement common virtual machines\
    \ (VMs), and when properly configured, perform as well as running on a physical\
    \ machine [7].\n\nContainer-based virtualization has developed in areas such as\
    \ dynamic loading in distributed platforms on cloud environments which enables\
    \ rapid environment distribution and deployment. However, its introduction has\
    \ not been adopted in the computer environments at research institutes and universities\
    \ due to the concern regarding performance degradation of virtualization, there\
    \ is a trial without excellent benchmark results on parallel computing environments\
    \ and application research cases.\n\nRecently, the container-based virtualization\
    \ has been used in supercomputing environments.\n\nAs an example, the National\
    \ Energy Scientific Computing Center (NERSC) in the United States, which has a\
    \ supercomputer Cori, developed an open-source software for high-performance computing\
    \ called Shifter [9]. There are reports on the utility of the container-based\
    \ virtualization in research [10]. In addition to container implementation, Singularity\
    \ [11] is available on the TSUBAME-300 supercomputer of Tokyo Institute of Technology\
    \ and AI Cloud Building Infrastructure of National Institute of Advanced Industrial\
    \ Science and Technology (AIST), of which are world’s first-tier supercomputing\
    \ environments in Japan [12]. From the above, correspondence to the container-based\
    \ virtualization is urgent in the bioinformatics and computational biology fields.\n\
    \nIn the field of bioinformatics and computational biology, various software are\
    \ used for research tasks. Managing software environments for such experiments\
    \ is one of the most challenging issues in computational research. Recently, as\
    \ a solution to the software environment, introduction of the container-based\
