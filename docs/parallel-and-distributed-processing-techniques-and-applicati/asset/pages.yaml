    # # 4. Experiments


    # ## 4.1 Dataset


    We used the Biophysics datasets HIV, MUV, and PCBA from MoleculeNet [11]. Molecular
    data are provided in SMILES format and converted to 2-D molecular graphs using
    RDKit [9]. Hydrogen atoms are removed, and compounds with large heavy atoms exceeding
    maximum number of atoms, $n_{max}$, were excluded from the dataset. The number
    of tasks in each dataset, number of active compounds, inactive compounds, number
    of inactive and excluded compounds are shown in Table 1. Given that the same compound
    is registered with different labels between each task, the number of active and
    inactive compounds counted in duplicate.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_134_0.png)


    # ## 4.2 Training and evaluation


    The GCN model implemented using the deep learning framework, Chainer (version
    0.4.0) [15]. The parameters of GCN are listed in Table 2. We used some as Karees
    et al. [18]. We set maximum pair distance, $dist_{max}$ to 1-5. In this study,
    the prediction performance of the model was evaluated using ROC curve [16] and
    also as the curve under the curve (AUC), in Eq. (6) with the compound order in
    descending order of prediction.


    ```

    $AUC = 1 - \frac{N_{Pos}}{N_{Pos} + N_{Neg}} - \frac{N_{Neg}}{N_{Pos} + N_{Neg}}
    (6)$

    ```


    ```

    $EF_{\%} = \frac{N_{Pos, \%}}{N_{Pos}} / \frac{\%}{100} \times N (7)$

    ```


