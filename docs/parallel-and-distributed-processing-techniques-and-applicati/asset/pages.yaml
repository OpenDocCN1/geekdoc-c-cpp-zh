    # I. INTRODUCTION


    We address the fault-tolerant Non-Blocking Atomic Commitment problem, NB-AC, in
    an asynchronous distributed system where the agreement between a pair of processes
    is by a message-passing system. Channels are reliable and restarted by crash failure.
    In distributed systems, an agreement in a distributed system must be solved by
    a set of participating processes. The problem, called Atomic Commitment problem,
    requires the participants to agree whether to commit or abort [5,1.1,7]. It is
    required that every process eventually reaches the same outcome despite the other
    failures, the problem is called Non-Blocking Atomic Commitment (NB-AC). The problem
    of Non-Blocking Atomic Commitment becomes more complex in distributed systems
    (as compared to single-cluster systems) due to the lack of shared memory and a
    possible clock, and unbounded message delays. However, the agreement cannot be
    solved deterministically in a crash-asynchronous system without any information
    about failures. There is no way to detect whether a process crashed or is slow.
    Lately, no deterministic algorithm can guarantee Non-Blocking Atomic Commitment
    simultaneously. The problem stems from the famous impossibility result that consensus
    cannot be solved deterministically in an asynchronous system that is subject to
    even a single crash failure [7]


    The rest of the paper is organized as follows. Section 2 addresses motions related
    work and Section 3 describes the system model. Section 4 shows that M* is sufficient
    to solve the problem, respectively. Section 6 concludes the paper with some practical
    remarks.


