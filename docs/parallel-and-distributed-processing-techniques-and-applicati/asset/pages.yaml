    in this paper, we present a discretization of an integrable three-wave system.
    In section 2, the three-wave interaction system is discussed. In section 3, we
    review the Quispel-Roberts-Thompson (QRT) mapping. In section 4, we introduce
    an integrable discretization called the Kahan-Hirota-Kimura discretization. In
    section 5, we obtain a discrete three-wave system of Kahan-Hirota-Kimura type.
