  md: "# Intl' Conf. Par. and Dist. Proc. Tech. and App. | PDPTA ' 19\n\nData Copy\
    \ (HADC) technique to reduce the copying of redundant data.\n\n**5.2.1 HADC Algorithm**\n\
    \n. 2 demonstrates the work flow of HADC in the simulation. The ABM world is divided\
    \ into smaller sub-volumes. In each iteration, a patch gets modified, the program\
    \ identifies the sub-volume of that patch. The algorithm then looks up the corresponding\
    \ entry and increments its activity index. During the data buffering stage, only\
    \ the data in the sub-volumes that have gone through significant changes gets\
    \ copied for visualization. In this way, the amount of redundant data copies is\
    \ minimized, resulting in a faster buffering speed.\n\n![](img/b7e1ea3eadc390d7b75a034dc6a9e354_82_0.png)\n\
    \n**5.2.2 HADC Sub-Volume Size Recommendation Heuristic**\n\nThe size of the sub-volumes\
    \ is a very important factor in determining the performance of HADC. If the size\
    \ is too large, a large amount of unnecessary data copies will be performed; if\
    \ the size is too small each sub-volume will be copied in each iteration, the\
    \ latency of data copy operations will hurt the performance. To find an optimal\
    \ partition, the program runs the logs and locations in each iteration. For a\
    \ j m patches (representing activity) in a log from the most active iteration,\
    \ the goal is to find a partition of size w x h x d, where the objective is to\
    \ minimize the size of communications (time) between hot device, and where the\
    \ extremes are O(WHD)space, O(j)time and O(S),O(j)time.\n\n**Fig. 2:** An example\
    \ sequence demonstrating the Host-Device-Activity Data Copy (HADC) to minimize\
    \ the copying of redundant data. First, the ABM world is divided into smaller\
    \ sub-volumes. Each patch is modified, the parent sub-volumes get identified.\
    \ The corresponding entry in the activity map gets updated. The sub-volumes with\
