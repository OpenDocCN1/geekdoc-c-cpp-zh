    # VI. CONCLUSIONS


    In this paper, we present an approach to the efficient execution of actor-based
    applications in Akka. Particularly, we described our design and implementation
    of a distributed runtime environment where class of distributed computations could
    be implemented easily across heterogeneous machines. We evaluated the performance
    benefits of our system by implementing multiple applications running on different
    devices. We also conducted several sets of experiments to evaluate the performance
    and scalability of our system, paying particular attention to the relationship
    between the distribution of computations and the total time for executing them.
    The results showed that the computational time depends on various granularity
