    The remainder of this paper is structured as follows. In section II, we present
    the background to understand the remaining sections. To do this, we first introduce
    the MapReduce model we have chosen as parallel, then we introduce the MapReduce
    framework to implement this model in GPU. In III we introduce the sequential version
    of BSD for MD, then the parallel version using MapReduce. In IV we give details
    on experiments and discuss the results. Finally, in section V we summarize the
    results and some concluding remarks and perspectives.


    # A. MapReduce


    MapReduce is a parallel programming model designed to process data on distributed
    systems (clusters). Initially used for web page indexing, it was parallelized
    to deal with all kind of information. In this Map and Reduce functions, the user
    definitions in the run-time systems parallelize across different nodes of the
    cluster. Developers of the MapReduce model can easily create parallel programs
    without worrying about the architecture where the code will be executed, or about
    the inter-machine communication.


    In the MapReduce model, the Map function allows to distribute and work on the
    intermediate key/value pairs for each data record and then use a specific library
    to handle all values which have the same key and pass them to the Reduce function.
    Reduce function processes and assemble values with possibly one output result.


    In general, here are the steps to write a MapReduce-program:


    +   1. Choose an approach to split the data so that it can be processed by the
    Map function

    2. Choose a key to use according to the problem

    3. Write the code for Map function

    4. Write the code for the Reduce function


    Fig.2 illustrates an example of text processed in parallel with the MapReduce
    model. The aim is to find the number of occurrences of words in the input text.
    The lines of the file are split into blocks. In the "Map" phase


    # B. MapReduce framework


    MapReduce is a model introduced to create powerful algorithms in easy way. However,
    this model is designed only for distributed system like cluster with GPUs. It
    cannot be used for heterogeneous systems with GPU processors. With this issue
    MapReduce framework is created to write a MapReduce parallel programs on GPUs
    [14]. With this framework the programmer only needs to write one version of program,
    define the Map and the Reduce functions, then the MapReduce runtime generates
    automatically the GPU versions by source translation, which ensures portability
    for a high level of abstraction [15].


    Fig.3 shows the MapReduce architecture. The architecture contains two parts. The
    first part provides the programmers with a unified programming environment which
    allows him to run a MapReduce code once. The second part represents the MapReduce
    runtime which executes on heterogeneous platforms, and handles the bindings of
    data transfer.


    In the execution phase data is split by the Splitter(function)


    A hash table is used to group the key/value pair on GPU, it the data must be dynamically
    allocated. For this purpose MapReduce uses one memory allocation system to dynamically
    allocate hash table. Another problem is the framework locks concurrent insertion
    issue. MapReduce algorithm ensures that the insertion is not blocked by any particular
    thread [16].


    # III. METHODOLOGY


