    # 3.1 Structure analysis


    The system we have enabled users to obtain the function call of the program they
    have written and presented it to us for forms. At the same time, this structural
    analysis can be combined with the energy consumption measurement function to show
    the function-level energy distribution to us, so that users can analyze the energy
    consumption ratio of each function in the program to the overall, which helps
    locate energy consumption hotspots, and so focus on the optimization of high energy
    consumption functions.


    # 3.2 Energy consumption measurement


    For the evaluation of the effect of redundant motion optimization in the article
    and the energy consumption hot spot in the first structural analysis, it is necessary
    to measure the energy consumption when the program is running in this module to
    fulfill this function. The specific principle of the energy consumption measurement
    is that the target program (after structural analysis and redundancy optimization)
    RAPFI¹ is used to obtain the value of the hardware performance and then use the
    energy model to obtain energy consumption. This model can measure the energy consumption
    of the whole program, functions in the program and code segments specified by
    the user at multiple granularities. At the same time it can display these results
    in the form of charts and graphs, so that we can evaluate the effect and obtain
    detailed energy information of the program. The tool displays the energy consumption
    information of the program (for developers) in four categories: real-time power
    consumption, selected code, consumption information and energy allocation information
    during the function call. With the previous structural analysis and redundancy
    optimization functions, the debugging effect on program energy consumption is
    truly achieved.

    When the tool is implemented, each function is added to Eclipse in the form of
    plugin, which realizes better expansion and maintenance of the tool in the future.

