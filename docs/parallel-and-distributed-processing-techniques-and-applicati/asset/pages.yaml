    # # 5 Conclusions


    In this paper, in order to generate more character images, we experimented to
    find the most suitable structure of NN that automatically generates fonts. A font
    is automatically generated by NN combining various structures and parameters with
    50 data sets, and the average matching rate of pixel values is obtained for the
    Gothic font and the font used by the book publisher Shinobicho in the Meiji era.
    The structure and parameters of the changed NN are the number of convolutional
    layers, the number of output channels, the filter size, and the kind and number
    of pooling. From the results, we find that the more convolutional layers, the
    more number of output channels, the higher the average matching rate of pixel
    values to test. is better for matching pooling but the average rate is highest
    when applied to the 2 layers. When the data set is expanded to 1,297, 4 convolutional
    layers, the number of channels (64, 128, 256, 512) and a filter size of 7x7, max
    is applied to the outer 2 layers. The matching rate of pixel values to training
    data was 99.32%, and to test data was 75.79%; the font average matching rate of
    the pixel value is improved compared to the existing method, and we consider that
    the accuracy of the font is improved by changing the structure of the NN. In the
    future, we will experiment of automatic font generation with various combinations
    of filter sizes in each convolutional layer, and aim for more accurate font convolution.'
