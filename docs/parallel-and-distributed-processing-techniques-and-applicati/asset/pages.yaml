    \ More specifically, in winding worlds, most activities occur in the damaged areas.\
    \ Given these observations, we developed a Host-Activity-Aware\n\nTo determine\
    \ a good partition size, an objective algorithm is used. This heuristic consists\
    \ of two passes: split and swap. At the end of each pass, each partition (node)\
    \ will be either white (low density) or black (high density). The first pass starts\
    \ from the winding world, and split until the density conditions given by the\
