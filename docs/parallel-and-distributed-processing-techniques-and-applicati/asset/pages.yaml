    Fig.2: Oddball Tasks


    however, conventional oddball tasks are too monotonous; users often feel bored
    and the amplitude of P300 gets smaller [5]. For reason, this research attempts
    to create a game to make P300. There are several elements of games (score, feedback
    system, BGM, sound effect, and background), and it is difficult to discuss the
    effects of all elements at the same time. Thus, this paper discusses the effects
    of score, feedback system, and background, which are some of the elements mentioned
    above.


    # 2. Related Studies


    # 2.1 A brief history of P300


    The P300 was reported about 55 years ago (Sutton et al., 1965). Its discovery
    from the confluence of increased technological capacity for signal human neuroelectro
    measurements and the impact of information theory (Sutton et al., 1979). The “P300”
    is used to refer to the canonical ERP component, which is also called “P3”. The
    terms “P3a” and “P3b” denote the difference between the two components as defined
    below. The primary theoretical approaches to P300 are improved with a list of
    reviews previously (Donchin and Coles, 1988; Hilliard


    Oddball tasks are often used to measure P300. These tasks are those in infrequent
    stimuli appear in frequent stimuli to induce P300. We can observe a user’s P with
    an electroencephalograph (EEG) when he/she attempts oddball tasks. P300 is observed
    clearly when a user concentrates'
