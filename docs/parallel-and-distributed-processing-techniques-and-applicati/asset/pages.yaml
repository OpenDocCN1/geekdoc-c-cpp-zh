  md: '# 5. Conclusion


    In this study, we have proposed and evaluated various methods for denoising corrupted
    images using INLA. INLA requires an assumption of GMRF latent variables. Hence,
    its accuracy decreases when the assumption is inappropriate. When INLA is suitable
    for the situation, we can reduce compute time compared to other Bayesian algorithms,
    such as MCMC with enough accuracy.


    As a future work, we can consider other methods for latent models. For example,
    to apply segmentation to noisy images, and then evaluate the performance of each
    segmentation. In addition, we should aim to restore real X-ray imaging data, and
    evaluate its effectiveness.


