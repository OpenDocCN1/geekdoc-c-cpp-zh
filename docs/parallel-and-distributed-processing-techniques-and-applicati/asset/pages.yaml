  md: '# Conclusion


    In this study, the investigation of objective functions in multi-objective problems
    and many-constraint optimization problems was introduced. This paper proposed
    a method for acquiring multiple satisfied solutions in single-objective optimization
    problems. To investigate the effectiveness of the proposed method, an experiment
    was conducted. In the experiment, 54 constraint two-objective optimization problems
    was considered, and the proposed method and model were compared. The results showed
    that both could diverse solutions in the design variable. The results also showed
    that the proposed method could adjust the granularity of the distance acquired
    solution while Island model could not. In instance, although satisfied solutions
    could be acquired in all trials, there one trial in which the purpose of this
    study was to acquire various satisfied solutions in engineering problems, multiple
    satisfied solutions should be acquired in all trials. A study of the appropriate
    neighbor range is necessary. Further studies are also needed in order to make
    the proposed method more suitable for engineering problems.


