    different applications and/or tenants. Virtual networks share the physical network
    resources.


    SDN evolved from a centralized control plane to be an enabler for virtual networks
    and network-as-a-service for network providers. NV and SDN bring new business
    opportunities for network providers. One challenge for network and service providers
    is to effectively allocate resources and program the network with flows that satisfy
    the customer requirements. Placing the SDN controllers in optimum locations of
    the SDN is significant in timely programming of the network. This challenge has
    been identified as the "controller placement problem which is an optimization
    problem over NV and SDN provided. Controller placement problem solved over time
    with first solutions placing a single controller in WAN [1]. It has added to addressing
    the solve placement problem in WAN [2], placing multiple controllers [5], building
    a hierarchy of controllers [7] [8], covering multi-domain controllers [9][10][11],
    incorporating the resiliency of controllers [14][15][16], and recently trying
    to solve the controller placement problem in hypervisor and virtual network environments
    [12][3]. Many studies have been done on the optimum placement of the controllers
    across different settings. Most studies address the problem as integrating problem
    and use some heuristics for approximations. Controller placement problem is NP-hard
    and some heuristics and algorithms are presented in these studies [3][4].


    **Keywords:** Defined Network, Collaborative Controller Placement Problem, Virtual
    SDN Service


    # 1 Introduction


    Software-defined networking (SDN) separates the network control plane and the
    forwarding plane enabling an SDN controller to program the routing decisions on
    multiple network elements. The SDN provides the network operators with capability
    to configure, manage, secure, and optimize network resources quickly through software,
    thereby enabling them to program the networks in a very fast and agile manner.


    Network virtualization (NV) allows creating virtual networks over physical network
    resources. Each virtual network could be tailored to the requirements of


    In [17], we developed terminology and formulas for the controller placement problems
    in recent and virtual SDN deployments for no such formulations had been done before.
    In this paper, we extend to work cover scenarios where various network, cloud
    and infrastructure providers may collaborate with each other and with the customers
    to offer flexible and dynamic virtual networks using SDN. The actual networks
    could be in the edge networks of corporations, in the networks of edge infrastructure
    providers, in the networks of public and private cloud, in the networks of network
    providers. These networks could be bine and wireless.'
