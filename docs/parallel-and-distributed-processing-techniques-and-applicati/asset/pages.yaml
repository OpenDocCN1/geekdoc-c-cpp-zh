    # 1 Introduction


    With the spread of personal computers and smartphones, the Internet has made our
    everyday life convenient. Information can be obtained easily by searching the
    Internet. Online shopping allows us to buy various products by going directly
    to the stores. These advantages are that when we connect to the Internet, such
    services are available for everyone, regardless of the location or time. The Digital
    Library [1] provides a service allows us to browse image data of National Library
    collection. In this service, valuable books that are difficult to read in the
    library are also public. Some of these books are called Early-Modern Japanese
    Printed Books, published in the Meiji era or the Showa era. However, showing image
    data of the books is not available. It is necessary to read the page of the book
    to find out where the necessary information is described. In order to improve
    the convenience of the service, it is required to convert the image data of the
    book into text.


    We proposed a method for automatically generating characters of the font generated
    by publisher publication and image of early-modern japanese printed books using
    deep learning [5]. In this method, we constructed a neural network (NN) consisting
    of four convolutional and deconvolutional layers. We used this method to generate
    character images of the font type Shinindo in the mobile of the Meiji period from
    the Gothic type character books. As a result, it showed that generated images
    can be used as data of the multifont character recognition. The average matching
    of pixel values with the generated characters of Shinindo is 73.69%. In deep learning,
    the structure and set of parameters NN greatly affects the accuracy of the generated
    characters. In this paper, we conduct experiments to find the structure of NN
    suitable for font generation of early-modern japanese printed books, and aim to
    improve the accuracy of automatically generated characters and text.


