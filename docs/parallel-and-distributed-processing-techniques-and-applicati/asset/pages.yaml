    $A(a),b = \begin{pmatrix} b_1 & 0 \ 0 & b_s \end{pmatrix}, c = \begin{pmatrix}
    c_1 \ c_s \end{pmatrix}.$ (40)

    ```


    The Kahan-Kimura-discretization of the ODE (36) and the Butcher table of the scheme
