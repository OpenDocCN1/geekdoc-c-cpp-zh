    Cheng-Nan Lai


    Department of Computer Science, National Kaohsiung University of Science and Technology,
    Taiwan


    **Abstract** — Node-disjoint paths have made significant contributions to the
    study of routing, reliability, and tolerance of an interconnection network. In
    this paper, we construct m-disjoint paths from one source node to other m (not
    necessarily distinct) target nodes, and in an n-dimensional folded hypercube so
    that their total length is minimized, especially in cases where n and m are even.
    In addition, these m-disjoint paths can be constructed in O(n''m''log n) time
    and each path is shorter or nearly shortest.


    **Keywords:** Folded hypercube, hypercube, node-disjoint paths, matching, optimization


    # ## 1 Introduction


    Modern technology has made it common to build a large-scale processor system consisting
    of hundreds or thousands of processors. Before defining a multiprocessor system,
    an interconnection network for the nodes and links, respectively, to processors
    and communication channels must be determined first. The topology of a network
    greatly influences the system performance; many options have been proposed in
    the literature for practical implementations and theoretical studies. For later,
    the folded hypercube was one of the networks which have received much attention
    from outstanding researchers [1, 15, 19, 23, 32].


    A folded hypercube is basically a hypercube with additional links, where link
    connects all pairs of nodes whose distance are longest in the hypercube. An n-dimensional
    folded hypercube denoted as a n-cube [26] consists of 2ⁿ nodes that are connected
    by 2ⁿ binary strings of length n. Two nodes are connected by link and only if
    they differ by exactly one bit. The diameter of n-cube is n. On the other hand,
    an n-dimensional folded hypercube has diameter n-1 [5] and is basically an n-cube
    with 2ⁿ⁻¹ complement links. Each complement link connects two nodes whose labels
    are the complements of each other. Figure 1 shows the


    structure of a 3-cube, where (000, 111), (010, 101), and (001, 110) are the four
    complement links. With the help of complement links, the diameter of n-cube is
    reduced to ⌊n/2�. An n-cube have connectivities n and n+1, respectively. The connectivity
    of a network is the minimum number of nodes whose remove


