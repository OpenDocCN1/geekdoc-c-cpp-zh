    Email: * malika.mehdi@gmail.com,

    † ousmer.sabrine@gmail.com,

    † hafidabbenou@gmail.com,


    Molecular is becoming a key instrument in the drug discovery process. This method
    helps in deliver new candidates with quality over cost. It consists of orientation,
    position, and conformation of a new molecule (drug candidate) to an existing molecule
    (protein) to form a stable complex with lower minimum energy. In this paper, we
    propose a parallel model of bees algorithm metaheuristic to save the molecular
    docking problem. We use the MapCG framework to implement MapReduce methods on
    graphics cards (GPUs). MapCG was developed to simplify the programming process
    on GPU and design application independently of the hardware architecture. Our
    solution can run on CPU, or parallel on GPU without changing the code. Experiments
    showing docking of protein-ligand complex shows that our achieve high performance.
    Indeed, the parallel implementation using MapCG on GPU gives an average speed
    of 10x compared to a single core.


    ![](img/b7e1ea3eadc390d7b75a034dc6a9e354_214_0.png)


    Fig. 1. Illustration of docking process


    # I. INTRODUCTION


    Molecular docking (MD) methods play an important role in the field of computational
    chemistry and biomedical engineering [1]; they are frequently used to predict
    the binding position and orientation of a ligand (drug candidate) when interacting
    with a protein receptor (see Fig. 1). The method predicts the affinity and quality
    of ligand-protein complex measured by a scoring function (binding affinity)[3].
    The latter gives details of protein-docking process in chemical detail, and provides
    information about the conformation and stability of the protein-ligand complex
    [4].


    In protein-ligand docking, metaheuristics are used as search algorithm, to find
    a maximum of binding of the ligand against the target protein by searching the
    search space. These algorithms play a central role in the docking accuracy [5].


    Many metaheuristics have been proposed in the literature for MD. Some known are
    Genetic Algorithm (GA), Simulated Annealing (SA), Particle Swarm Optimization
    (PSO). However, these algorithms need improvement to better explore the search
    space.


    In docking simulations, the CPU time is spent in the evaluation phase (scoring
    function) of the metaheuristic [9]. In this paper, the calculation of the scoring


    consum more than 80 % of the total execution time and this is considered a big
    challenge in the performance of the MD. This bottleneck could be resolved through
    the parallelism of this calculation in order to enhance the performance and the
    quality of the docking process.


    Recently, Graphics Processing Units (GPUs) have been playing an important role
    in the general purpose field. It exists several high level frameworks to program
    GPUs using low level GPU APIs [10]. Low level APIs can achieve very good performance
    but require high development and maintenance costs, it raises some portability
    issues. Indeed, developers are required to write a specific code for each target
    platform architecture.


    Most of parallel solutions in literature proposed with low level GPU APIs such
    as CUDA or other language like OpenCL [Ref] which utilizes the utilization of
    threads-


    In this work, we propose parallel BSO Metaheuristic for MD. We propose a new approach
    by adding a layer to separate the code from the GPU architectures,'
