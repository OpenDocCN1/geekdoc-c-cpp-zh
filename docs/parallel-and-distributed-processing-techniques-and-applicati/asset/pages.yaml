    As the number of convolutional layers increases, the features of the character
    image can be learned more. As the number of output channels in each convolutional
    layer increases, the features that can be extracted from character images increase.
    As the filter size is larger, features of larger local area are extracted from
    the characters. The larger, the more features can be learned from the training
    data. However, when such features are learned too much from training data, the
