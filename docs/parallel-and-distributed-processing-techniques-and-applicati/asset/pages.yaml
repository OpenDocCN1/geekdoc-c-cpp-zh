    # II. BLOCKING JOB SCHEDULING PROBLEM


    In this section, we present the basic information related to the Blocking Job
    Shop Scheduling (BJSS) problem and the model used to solve it.


    # A. Problem Formulation


    The classical Job Shop Problem (JSP) aims to schedule a set of $n$ jobs ($j_1,
    ..., j_n$) on a set of $m$ machines ($m_1, ..., m_m$). Each operation on a machine
    is created. We denote by $o$ the set of operations ($o_1, ..., o_n$). Each operation
    $o_i$ needs to use a machine $M(i)$ for an uninterrupted processing time $p_i$.
    Each job has its own sequence of operations which creates a precedence constraint
    between successive operations of a job. This problem involves disjunctive resource
    constraints. Each machine can process at most one operation at a given time. A
    schedule (solution) for this problem consists of a assignment of starting and
    finishing times $t_i$ and $c_i$ for each operation $o_i$ ($i=1,...,n$); with $C_{max}=\max\{c_i\}$.
    The JSP assumes an unlimited capacity for buffers between machines which is not
    possible for real world manufacturing systems. To model these systems, the BJSS
    problem is introduced. This is a generalization of the classical JSP with no blocks,
    where a job can stay on a machine (blocking other jobs) until its next machine
    becomes available for processing.


    There are two cases of the BJSS problem depending on the application areas and
    the specification of the manufacturing systems: with blocking allowed (BWS) and
    the blocking with no-swap (BNS). In the blocking-swap case, a schedule with swap
    is considered as an infeasible, with BWS, all the swap simultaneously to their
    subsequent machine. The swap is a specification of the blocking constraint; it
    represents a deadlock between two jobs. This means that each job is waiting for
    the liberation of a machine blocked by another job in the same job.


    situation is represented by a zero length cycle in the alternative graph representation.


    # B. Alternative Graph Model


    The BJSS problem can be modeled as an alternative graph representation introduced
    by Massa and Pacciari [11], which is a generalization of the disjunctive graph
    of Roy and Smith [17]. $G=(N,F)$, where $N$ represents the set of $o$ operations
    (nodes) denoting the beginning and end of a schedule. $F$ is the set of fixed
    arcs imposed by the processing constraints. Each $(q, p)$ corresponds to a relation
    between two concurrent operations of a job and $a_{ij}$ corresponds to an alternative
    arc representing the processing order of concurrent operations (operations that
    use the same machine). Each pair $((i,j), (h,k))$ corresponds to the length of
    alternative arc $(a_i, a_j)$ which represents the length of one operation that
    must be processed before the machine can start the other operation.


    A selection $S$ is a set of alternative arcs chosen from $A$, at most one, from
    each pair. Let define $G(S)$ as the graph representation of the selection $S$.
    If there is no cycle in $G(S)$ and its evaluation equals the longest path in $G(S)$,
    we say that $S$ is a complete selection if exactly one arc is chosen from each
    pair in $A$, therefore $[A=S]$. In this way, we define a schedule (solution of
    the problem) as a complete feasible selection. The value $c_j$ is the length of
    the longest path from operation $i$ to operation $j$ in $G(S)$. An alternative
    operation represents an operation where the machine becomes immediately available
    after the end of its processing; otherwise, we denote by $\sigma(i)$ the operation
    immediately following it in the same job.


