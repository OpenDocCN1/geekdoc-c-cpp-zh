    (e.g. SMD and PC), and receives face recognition using SMD and page anytime anywhere.
    SMD is based on Android and works through using Android App. The client takes
    a picture of the person who wants to know information SMD and receives information
    from the server. Through the web page, it is possible to confirm, edit, delete,
    and insert real-time image, information of the face recognized, and face not recognized.


    # 3.2 Platform Architecture


    Figure 1 shows the flow between client and server. A server consists of a controller
    and Docker Containers. Figures 2 and 3 show the two cases in which clients request
    face recognition using SMD and PC.


    First, when the client uses SMD (see) The client uses the SMD to take an image
    of the person who wants to know the information and sends it to the server. The
    server assigns the client to the client through the Container. The container stores
    the transmitted images and sends them to the web page, simultaneously detecting
    and recognizing face. When face is performed, the facial feature data previously
    stored in the DB matches the character values from the client. In addition, we
    use the CFR API and News API provided by Harley to recognize celebrities. After
    identifying whether the celebrity is through the CFR API, the current information
    of the celebrity is obtained through the News API. The container sends information
    to web page and SMD after the face detection and recognition is finished. The
    client confirms the result.'
