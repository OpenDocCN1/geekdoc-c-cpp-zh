    to stalling of threads in SM. By using the proposed method dynamically throttle
    the number of running warps based on the amount of MSHR occupancy, the number
    of limited warps can be significantly reduced or in a short period of time. We
    estimate average MSHR usage over a period to obtain MSHR information more accurately
    and reliably.


