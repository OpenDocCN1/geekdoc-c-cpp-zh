    # 3. Proposed Tasks


    # 3.1 Oddball Task with Score


    Score is used for all tasks and a goal, the "Rank" is determined by the task score,
    and the goal is "getting the best score." Score is calculated by subtracting the
    time until pushing a button from 1400ms (the sum of stimulus-on and stimulus-off)
    as 1 per ms. In example, in the case of pushing a button 500ms after a target
    the score is 900 points (Fig.4). A user uses 700 points (+stimulus-off) if he
    pushes a button before a stimulus appears. Thus a user can get more points by
    pushing a button more quickly after a target stimulus.


    # 3.2 Oddball Task with Feedback System


    Oddball task with feedback system has the time for a feedback (200 ms). The system
