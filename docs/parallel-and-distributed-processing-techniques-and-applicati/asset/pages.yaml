    molecular docking problem can be formulated as an objective problem [18], it can
    be mathematically expressed by a vector S and an objective E(S):

    Given: S=(x,y,z,a,b,c,t1,t2,...)

    sought: E(S*) = E(S*)

    To find in a set of potential solutions S is often very large, and find the best
    S* by maximizing the scoring function E(S) calculated for each potential solution.
    S represents the vector of the decision variable , it can be seen as a set of
    three features as shown in Fig:4:

    =(D1, D2, D3)


    D1: Translation: The variables x, y and z represent the position of the ligand.

    D2: Orientation: The orientation is represented by a quaternion, a, b, and c that
    denotes the vector of the axis, and r denotes the rotation along axis.

    D3: Torsion: it is an angle associated with the i-th rotational bond, so n angles
    are required to represent all the rotational bonds, n is the number of rota-table
    bonds, we use three parameters for translation, orientation, and for torsion,
    so we need then n+3 parameters to represent the ligand''s conformation against
    the protein target.

    Fitness function: The Fitness functions (scoring function) calculate the affinity
    between the ligand and the protein, it is based on an energy density. The lower
    energy means better docking. In solution we use the semi-empirical force field
    scoring solution of AutoDock 4 framework [19], we consider various terms, such
    as the der Waals, the hydrogen bond, the electrostatic, and the solvation energies.

