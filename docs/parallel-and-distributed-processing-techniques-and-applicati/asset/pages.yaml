    # 2.2 A brief history of oddball


    Oddball task was first proposed about 45 years ago (Sires.N., Sires.C. & Hillyard,
    S.A., 1975) The task was developed into P300. For a visual oddball task, there
    might be a 95% chance for a squire to appear to the user and 5% chance for it.
    When the targets (e. circles) appear, the user must take a response, such as pushing
    a button or counting the number of target, consider the oddball task has been
    used in more than one published studies (Hermann & Knight, 2001; Picton, 1992)
    [22] [16].Figure.3 is one of the examples of visual oddball tasks [23]. There
    are not only visual oddball tasks, but also auditory oddball tasks [24].


