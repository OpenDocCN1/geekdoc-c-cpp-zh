  md: '# Joint Replenishment Policy in Multi-Product Inventory System Using Deep Q-Network
    with Reward Allocation


    Hiroshi Suetsugi¹, Yoshiaki Naruse¹, and Hiroyuki Morikawa¹

    ¹Graduate School of Engineering, University of Tokyo, Japan


    Abstract—This paper proposes a reinforcement learning approach to find the near-optimal
    dynamic ordering policy for a multi-product inventory system with non-stationary
    demands. The distinguishing feature of multi-product inventory systems is the
    need to take into account the coordination among products with the aim of cost
    reduction. The Markov decision process formation was hence to obtain an optimal
    policy. However, the curse of dimensionality makes it intractable for a large
    number of products. For more products, heuristic algorithms have been proposed
    on the assumption of a stationary demand in literature. In this paper, we propose
    an Extended Q-network (DQN) with reward allocation based on the double DQN. Our
    numerical experiments show that the proposed agent learns the coordinated policy
    without any knowledge of other products'' decisions and outperforms non-coordinated
    forecast-based economic policy.


    setting the Beer Game [21], (3), where a multi-echelon supply chain problem is
    considered under uncertain future demand and supply. [2] used a DQN agent, which
    was presented in learning algorithm. The existing literature showed results in
    multi-supply chains, only one product has been considered so far. This is because
    of the problem of large action spaces, which appear in the general RL approach.
    If each product has four discrete orders: zero (means not ordering), one, and
    two (which are the number of order, lot sizes), a combination of all possible
    orders would be 4N (where N is the number of products). Such a case is intractable
    as its combination reaches 1,048,576.


    **Keywords:** joint replenishment policy, multi-product inventory, stochastic
    inventory control, reinforcement learning, reward allocation


    # 1. Introduction


    Owned-brand goods play an important role for retailers in terms of their profits.
    At their own risk, many retail companies have tried to purchase their goods in
    the production country and deliver these goods to selling cities. In this case,
    the joint replenishment policy (JRP), which takes multiple product situations
    into account, is required to achieve the minimum cost. In a supply where multiple
    products need to be delivered via a carrier ship, the transportation costs depend
    on the quantity of demanded items. However, the JRP is considered to be non-deterministic
    polynomial (NP-hard) because of its combinatorial nature. There has been much
    research on JRP. [1], research can be divided into two categories depending on
    the demand environment: deterministic, or stochastic. In the real-world setting,
    businesses often face fluctuating demand or stochastic demand setting. We use
    the Markov decision process to solve the JRP with the stochastic demand. The problem
    is complex in the stochastic demand setting; therefore, a number of studies were
    conducted on the stationary demand which often follows a Poisson or normal distribution.


    [5] the proposed DQN (BDQN), in which approximated Q-values are represented with
    individual network followed by a shared decision policy that encodes a representation
    of the input and helps with the coordination of the architectures. These architectures
    enable the linear growth of the total number of networks with increasing action
    spaces.


    In this paper, we propose the RL agent with function approximation to find the
    near-optimal dynamic multi-product ordering policy under non-stationary demand
    by BDQN with credit assignment. The proposed agent is based on the idea of treating
    a single agent as a multi-agent learner with a credit assignment policy that is
    a hybrid of the global and local rewards with the aim of the combinatorial increase
    in the action space. From our numerical experiments, we found that branching Q-network
    with reward allocation...


    We evaluate our proposed agent by applying it to a multi-product inventory control
    problem and numerical experiments that varied the number of products and demand.
    Our agent achieves better performance than the forecast-based economic policy
    (F-EOP) and exhibits a robust learning process on a large number of products with
    non-stationary demand.


    The remainder of this paper is as follows. In Section 2, we review the literature
    on both JRP and RL. In Section 3, we present our proposed solution. In Section
    4, we present the results of the numerical experiment, and provide our conclusions
    in Section 5.


