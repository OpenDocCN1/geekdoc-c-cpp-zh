    # ##5 Conclusion


    This paper proposes the divided platform into functionality aspects and performance
    aspects. At the functionality aspects, the client requests recognition from the
    server through the client device (SD, PC) and we receive the result from the server.
    The platform also provides multi-face recognition in real time and functions that
    recognize celebrities using CFR API and APIs that are provided by Naver. With
    Docker, it is possible to check face scenes in real time, and identify and modify
    images of recognized persons. Those who are not recognized. For the performance
    aspects, Docker can provide service to deliver improved performance with fast
    response times and distribute the load of server. Server module and Cluster module
