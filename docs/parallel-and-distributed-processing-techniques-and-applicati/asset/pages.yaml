  md: 'Network and service providers have objectives of simplifying the operations
    through streamlined procedures, achieving faster results and reducing the overall
    cost and the risks. Our work can be used by network/service providers for various
    business objectives including


    +   - Effective management of service complexities: creating services using programmable
    environments and DevOps agile methodologies


    +   - Offering multiple virtual networks to their customers as a service.


    For the latter, we particularly consider the following network/service architectures
    and business agreements among network/service providers:


    +   - Network provider offers the resources to be shared by plurality providers
    while network provider is optimizing the SDN controller resources


    +   - Service provider offers specific/centric mechanisms, and by service chaining
    and by utilizing differentiated QoS, security, SLA for different applications
    (mission critical, real-time, etc.)


    +   - Service provider provides fast lanes and better than QoS to technology companies
    such as OTT providers over their Internet (which is possible due to current network
    policy). Service provider provisions separate networks for tech such companies
    that can manage their services, while service provider is optimizing the SDN controller
    resources


    +   - Service provider offers hosts to the virtual tenant networks while optimizing
    the SDN controller resources


    In section SDN Model and Definitions, we describe the virtual SDN model and provide
    relevant definitions. In section Cluster Placement Problem for Virtual SDN Model,
    we provide mathematical formulations for the problem and present approximation
    algorithms.


    # 2 Virtual SDN Model and Definitions


    In this section we will describe the virtual SDN model and provide definitions
    to its components.


    A physical network element as a switch or a router has physical resources such
    as ingress and egress ports, packet processing resources (network processor),
    switching fabric, CPU, memory,


    buffers/queues and other specialized hardware units for performing functions such
    as lookup, forwarding, queuing, packet scheduling, demodulating.


    Network virtualization (NFV) views supports executing many network functions over
    general and commodity services without requiring purpose-built network elements.
    Our focus is not NFV because our approach is using a virtualization layer (hypervisor)
    or a container environment which will allow the network/service provider to create
    virtual networks over a physical network element. A hypervisor provides a virtual
    environment for guest operating systems. Examples are KVM, HSV, Hyper-V. A container
    environment is capable of running a virtual network as a docker container.


    A physical link has bandwidth (data rate) and propagation delay associated with
    it. Multiple virtual links can be linked to a physical link each sharing the total
    bandwidth by bandwidth reservation. The propagation delay of all the virtual links
    on a physical link is assumed to be the.


    An SDN network contains SDN elements and links. SDN network routers and switches.
    Each SDN network element is capable of running a hypervisor or container environment,
    however can also be called as host or server (though we will not use the term
    server in this paper not to confuse it with network services as DNS). Therefore,
    each SDN network element is capable of hosting multiple instances of virtual network
    elements.


    A virtual (vSDN) SDN has virtual network elements and links. Virtual SDN elements
    include virtual routers and switches. A virtual switch represents elements in
    a virtual network at layer 2, or a virtual router at layer 3.


    Virtual SDN network elements could come in various stacks fashions as the following:


    +   1. Host (SDN Network Element) + Hypervisor + Virtual Switch or Virtual Router


    +   2. Host (SDN Network Element) + Hypervisor + Guest Operating System + Virtual
    Switch or Virtual Router


    +   3. Host (SDN Network Element) + Hypervisor + Nested Hypervisor+ Guest Operating
    System + Virtual Switch or Virtual Router


    +   4. Host (SDN Network Element) + Container Execution Environment + Virtual
    Switch or Virtual Router as containerized applications.'
