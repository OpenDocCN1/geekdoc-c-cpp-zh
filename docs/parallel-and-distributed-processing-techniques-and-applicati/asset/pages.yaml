    the Container has only the binary to run. This could cause the VM to take longer
    to configure the environment than the Container. One of the Containers'' most
    representative technologies is Docker [12, 13]. The Docker uses image file to
    configure features and preferences for running Container. Multiple containers
    are created by running an image file. Docker solves the problem of Service and
    builds stable and efficient environment. Docker-related research is currently
    active.


    # 3 Proposed Platform


    # 3.1 Platform Overview


    We propose a platform that provides real-time face recognition for clients using
    SMD and PC for IoT environment. The platform consists of client devices (SMD and
    PC) and a server. The Docker Container is used to access web page. The platform
    has the ability to identify and modify not only public although but celebrity
    recognition and information stored in the server''s database. In terms of performance,
    the server is composed of server Container, even if clients request face recognition
    to the server, it provides real-time service without delay time and is assigned
    to clients.


    By using the Container, many clients may receive quick response when requesting
    face recognition from


    the server. As shown in Figure 1, Docker consists of a DB Server, a Socket Server,
    and a Web server. Socket handles TCP communication with client in all TCP connections
    of, container''s IP addresses and ports are assigned differently. DB Server stores
    various data such as image, information and so on. When a client connects to a
    page, the Web server needs an IP address and port, just like Socket. The server
    Controller assigns the client to the appropriate container. The server also receives
    and processes requests from the client and uses the CFR API and News API to provide
    by Harley novelty.


