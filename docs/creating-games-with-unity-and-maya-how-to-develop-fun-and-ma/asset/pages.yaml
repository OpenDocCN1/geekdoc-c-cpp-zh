- pgno: 176
  md: "![](img/0285f88bc840f313779e011725b623a5_176_0.png)\n\n**FIGURE 7.8** Sample\
    \ of the newly created normal map.\n\n![](img/0285f88bc840f313779e011725b623a5_176_1.png)\n\
    \n**FIGURE 7.9** Sample of first level of Gaussian blur.\n\n# Why?\n\nEven with\
    \ our High Pass, there is still quite a bit of “noise” in that initial pass. Giving\
    \ a little blur helps soften the noise and keeps the information where it should\
    \ be. This shouldn’t be too high since too much of a blur will simply wipe out\
    \ all the detail (including the desirable large detail).\n\n# Tips and Tricks\n\
    \nHow much to blur this first pass is tricky. Much of it is relative to the file\
    \ being affected. A Radius of 1 might be just the trick for a 2048×2048 image,\
    \ but way too much for a 512×512. Further, if the image is stillable and much\
    \ closer, it might need to be much higher (5 or more). So keep frequent saves\
    \ to make sure you can go back to an earlier version if things aren’t going as\
    \ planned.\n\n# Layering to Increase Height\n\n**Step 10:** Duplicate the Background\
    \ layer. The quick keyboard shortcut for this is Ctrl-J (Command-J on a Mac).\
    \ This will create a new layer (Layer 1) identical to the first that sits atop\
    \ the original.\n\n**Step 11:** Change the new Layer 1 Blending to Overlay. You\
    \ can do this either within the Layers palette (immediately beneath the Layers\
    \ tab) or by double-clicking the layer and in the Blending Options section of\
    \ the Layer Style window changing the Blend Mode drop-down menu. The results can\
    \ be seen in Figure 7.10.\n\n![](img/0285f88bc840f313779e011725b623a5_176_2.png)\n\
    \n**FIGURE 7.10** Results of duplicate layer with an Overlay Blending Mode.\n\n\
    > **Warnings and Pitfalls**\n> \n> By using an additional layer and adding the\
    \ value, this is no longer a valid normal map. Remember when we talked earlier\
    \ about the normal vectors needing to equal exactly 1? Well, now they definitely\
    \ do not, so be sure not to use the file in its current state or the results will\
    \ be very unpredictable.\n\n# Why?\n\nOften the results of the NormalMapFilter\
    \ are too muted. The amount the surface will be raised is just too low. By duplicating\
    \ the information and adding the color information to the original via the Overlay\
    \ Blending Mode, the height of the normal map will increase.\n\n**Step 12:** Gaussian\
    \ blur Layer 1 with a Radius of 2 (Figure 7.11)."
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/0285f88bc840f313779e011725b623a5_177_0.png)


    *Figure 7.11* Blurring new layer.


    # Why?


    By making the next level up blurred a bit more, we are creating a stepped increase
    in the new height being created. Each successive copy will be blurred a bit more,
    thus increasing the height and spreading the up ramp out a bit.


    +   13. **Step 13:** Repeat the process of duplicating the level and then running
    a Gaussian Blur, but this time with a radius of 4.

    +   14. **Step 14:** Repeat the duplication and Gaussian blur process five more
    times, each time increasing the radius of the blur by 2 (Figure 7.12).


    *Figure 7.12* Multiple layers of increasingly blurred normal maps.


    ![](img/0285f88bc840f313779e011725b623a5_177_1.png)


    # Why?


    Take a look at Figure 7.13, which shows the initial output by NormalMapFilter
    and compares it to the result of the multiple overlayed layers. Notice how much
    more information is there, and how much richer the normal map actually is.'
