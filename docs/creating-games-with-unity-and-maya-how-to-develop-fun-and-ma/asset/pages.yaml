    and look for the IK Handle Attributes area. Expand this and change the Stickiness
    setting to sticky. Be sure to do this for all three handles.


    # Mirroring the Legs


    After the IK handles have been created and named, the leg is done (except for
    the handles we will create to control it). That makes this a great time to mirror
    the joint chain and automatically create the other leg.


    **Step 30:** Make `AC_L_Hip` a child of `AC_Root`. Do this in the Outliner by
