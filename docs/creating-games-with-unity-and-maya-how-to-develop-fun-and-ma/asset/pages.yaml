- pgno: 323
  md: '# Tutorial 10.2: Maya Skinning


    Skinning is the process of attaching vertices to joints. This means that each
    vertex can be influenced by one or more joints and as that joint moves (or rotates),
    the vertices go with it. Getting the right amount of influence for each vertex
    to the correct joint or collections of joints takes a little bit of refinement;
    however, getting the skin (the mesh) weighted (assignments to joints) correctly
    is a very important part of the process.


    **Step 1:** Bind the skin to the joints. To do this, select AC_Root and then shift-select
    AC_AegisChung_SM. This selects the parent-most joint of the skeleton and the single
    mesh that is Aegis Chung. Select Animation>Skin>Bind Skin>Smooth Bind (the default
    settings should be fine).


    # Why?


    Smooth binds are binds where vertices can share their influence between several
    joints. For most organic situations, smooth binds are the method of choice. It
    means places like the front of the knee can spread their influence across a couple
    of joints to get a gentle bend. Alternatives such as Rigid Bind work on the idea
    that each vertex is 100% assigned to one joint. Although there are some really
    interesting and compelling uses of Rigid Binds with other deformation objects
    (Lattices for instance), for our purposes we''ll go with Smooth binds.


    **Step 2:** Test the bind. Do this by moving Aegis. With the Move tool, grab AC_Root
    and move it around (he should bend his knees and squat); use the Rotate tool to
    bend the arms, wrists, head, jaw, and so on. Basically pretend he''s a doll and
    pose him to see how the default bind holds up (Figure 10.34).


    ![](img/0285f88bc840f313779e011725b623a5_323_0.png)'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# ### Why?


    Maya is smart in a lot of ways, but when it comes to skin binding it''s kind of
    dumb. Basically, on initial bind, each vertex looks around itself and allows some
    of its influence to be lent to the nearest five joints. This means that the pouches
    around the waist may lend a lot of their influence to the wrist joint and the
    gun will be influenced by the hip and wrist joint. Basically it''s all a mess,
    especially with a tightly modeled character like this one. Frankly, this is one
    of the drawbacks of modeling with the arms down; should the character have been
    in a T-pose, or even if the arms were modeled at 45 degrees, it would be less
    likely that the areas around the waist would be influenced by the wrist. Either
    way though, adjusting the skin weights is a necessary part of the gig.


    +   - Step 3: Make sure to undo all the rotations or movements.


    # ## Binding Rigid Body Parts


    There are a few parts of the body (the head for instance) and things attached
    to Aegis (like guns) that shouldn''t bend; really they should be attached 100
    percent to a particular joint. To do this we will start with a very numerically
    based method of adjusting skin weights and adjust the Component Editor.


    The Component Editor allows for, well, editing of components—like vertices and
    specifically which joints those vertices are being influenced by. This method
    will be very Excel-esque, and might not be terribly appealing at first, but is
    the quickest way to take care of rigid parts of the body.


    +   - Step 4: Make joints unselectable. At the top-left corner of the Maya interface
    are a collection of tools that allow a user to mask which types of objects are
    selectable. Turn off the ability to select joints (Figure 10.35).


    ![](img/0285f88bc840f313779e011725b623a5_324_0.png)


    # ### Why?


    We are about to do a whole lot of vertex selection. Maya has a sort of object
    selection hierarchy to actually assist in animation. This means that if a click
    is made in a view panel if there is a joint beneath the mouse (even if it is inside
    of a poly mesh) it will select that before the mesh that surrounds it. So, if
    joints are selectable, every time a marquee selection is made that touches a joint,
    whatever you were hoping to select won''t be selected—instead the joint will be
    picked.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Step 5: Select the vertices that make up the head. Don''t grab down the neck,
    just all of the head (Figure 10.36).


    ![](img/0285f88bc840f313779e011725b623a5_325_0.png)


    FIGURE 10.36 Selection of head vertices


    Step 6: Assign these vertices to AC_Head_Base. To do this, choose Window>General
    Editors>Component Editor. Click the Smooth Skins tab. Use the bottom slider to
    slide over to see AC_Head_Base (the joints will be listed alphabetically) column.
    Highlight the entire column and enter 1 (press Enter), and all the values for
    that column will change to 1 (Figure 10.37).


    ![](img/0285f88bc840f313779e011725b623a5_325_1.png)


    FIGURE 10.37 Setting a value of 1 to AC_Head_Base for all the vertices of the
    head.


    # Why?


    The paradigm here is between 0 and 1—0 is 0 percent and 1 is 100 percent. By changing
    the value of all the vertices (listed in the first column) for AC_Head_Base to
    1, these vertices will be 100 percent assigned to this joint. When AC_Head_Base
    moves, all the vertices we''ve got selected will go with it…no sharing.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '**Step 7:** Assign eye vertices to respective joints. For the eyes, this is
    actually a little simpler. Try this trick: Switch to Faces mode and double-click
    any of the faces of the left eye. This will select out until it finds the edges
    of the eyeball and go no further. Ctrl-right-click-hold and choose To Vertices
    and then all the vertices of the eye will be selected. Again, in the Component
    Editor enter 1 as the value for all the vertices under the AC_L_Eye column (be
    sure to press Enter after entering 1).


    # Why?


    There are actually a few interesting things happening here that should be pointed
    out. Notice that when we selected the vertices and went to the AC_L_Eye column,
    all the values were 0. They were 0 because in the previous step they were part
    of the collection of vertices that were assigned to the AC_Head_Base joint. A
    vertex''s total weight value will be 1. So if more influence is defined to one
    joint, the vertex must rob that influence from other places it may have been affiliated
    with. So when the eye vertices were assigned to the head, it zeroed out the influence
    AC_L_Eye had on it. Now that we''ve assigned all the influence to AC_L_Eye, the
    influence that was on the head is gone (which is what should happen).


    **Step 8:** Repeat the process for the right eye, only assign the vertices to
    be influenced 100 percent by the AC_R_Eye joint.


    **Step 9:** Use this same trick on the hip pistol and holster (assigned to AC_R_Hip),
    the knife (assigned to AC_L_Knee), the backpack, and the rifle (assigned to AC_Back_Small).


    # Why?


    None of these objects should be bending. Other than the backpack, they are all
    very rigid. By assigning them to any one joint, we''ll ensure that they won''t
    tear away or bend when other surrounding joints are moved.


    # Painting Skin Weights


    If you select AC_AegisChung_SM (the actual mesh) and look in the Channels box,
    there will be a node called skinCluster1 in the Inputs. The skinCluster node is
    actually the node that attaches the vertices to the joints, and it is part of
    the mesh (not the joints). We have already looked at how to adjust this skinCluster
    via the Component Editor, which works great for rigid parts of the body.


    However, most joints are much softer in their deformation. Most vertices on the
    body need to bend their influence to a couple of joints at a time. Maya has some
    fairly effective methods of allowing for this fine-tuning via very visual workflows.


    A note about skin weights first. We''ve already alluded to the idea that if a
    vertex has a setting of 1 assigned to any one joint, its influence setting for
    all'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'other joints is 0. Adjusting skin weights is constantly the battle of "robbing
    Peter to pay Paul." However, it should always be about paying Paul; that is, always
    think of painting vertices as painting where influence should be, not about where
    it shouldn''t.


    This means that as we paint in influence we want to be adding influence to joints,
    not taking it away. Although it is possible to paint a vertex so that its influence
    is zero in respect to a particular joint, painting away influence like this causes
    problems because you don''t know where the influence goes.


    But enough theory, let''s look at how to use the tools.


    **Step 10:** Select the mesh AC_AegisChung_5M and activate the Paint Skin Weights
    tool (Animation>Skin>Edit Smooth Skin>Paint Skin Weights (Options)). Be sure to
    select the Options square to get the interface shown in Figure 10.38.


    ![](img/0285f88bc840f313779e011725b623a5_327_0.png)


    # Why?


    The Paint Skin Weights tool interface has greatly improved in Maya 2011. There
    are some really nice tools in Maya 2011 that help a lot in the sometime arduous
    process of painting skin weights (the Hammer tool rocks!). But for quite a while
    now, the basics of this tool has remained the same. The first section (Tool Settings)
    should be a bit familiar—it allows for the user to decide the type of brush including
    size that will be used to paint across the surface of the mesh. The second area
    (Influence) lists the joints that are attached to the vertices of the mesh selected.'
  merge: -1
  img_proc: true
