- pgno: 244
  md: 'Step 91: Add new geometry and sculpt as needed. Figure 8.73 shows one more
    ring of edges inserted to allow for some extra flesh on the outer end of the palm.
    At this point, there should be plenty of geometry to create a well-shaped hand.
    Sculpt to taste.


    ![](img/0285f88bc840f313779e011725b623a5_244_0.png)


    FIGURE 8.73 Added geometry to better distribute polys and allow for proper form.


    # # Gloves


    The general hand shape is complete but you might notice that they are a little
    bulkier than they should be. This is because (as per the style sheet) they are
    actually inside of gloves. We need to make sure the arm indicates this.


    Step 92: Create an extrusion midway up the forearm to create the top end of the
    gloves. Select an entire ring of faces and use the Extrude tool to do this (Figure
    8.74).


    Step 93: Eliminate the bottom ledge of the ring by merging vertices (Figure 8.75).
    Select the vertices around the bottom edge of the newly extruded faces, and choose
    Polygons>Edit Mesh>Merge (Options). Turn the Threshold setting up to probably
    1 (this may need to be changed depending on the size of the model—the results
    should look like Figure 8.76).


    Step 94: Create glove detail. Figure 8.77 shows details atop the top of the glove.
    It was created by inserting edge loops to allow for new collections of polygons
    to be extruded. These new polygons (with very little sculpting) are further defined
    by adjusting the edge normals (Polygons>Normals>Harden Edge).'
  merge: -1
  img_proc: true
