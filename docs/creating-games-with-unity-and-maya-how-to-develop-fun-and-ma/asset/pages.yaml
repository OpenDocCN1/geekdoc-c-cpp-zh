- pgno: 502
  md: "Step 10: Apply HealthEngineScript to FPC_AegisChung. Go ahead and break the\
    \ Prefab connection when prompted, then reattach to prefab via the Prefab Apply\
    \ button. Test and play. The HealthLevel that should be displayed at the top of\
    \ the screen should swap from 0 to 100.\n\n# Why?\n\nWe'll want this health system\
    \ in all the places we're showing the GUIElements. Make it once here, reap the\
    \ benefits everywhere.\n\n# Back to Script\n\n+   1. Step 11: Reopen HealthEngineScript.\n\
    +   2. Step 12: Create the function that deducts from the health level when damage\
    \ is done.\n\n```\nvar health : int;\nprivate var healthLevel : GameObject;\n\n\
    function Awake () {\n    healthLevel = GameObject.Find(\"HealthLevel\");\n}\n\n\
    function Start() {\n    health = 100;\n    healthLevel.guiText.text = health.ToString();\n\
    }\n\nfunction ApplyDamage (damage : int){\n    health -= damage;\n    healthLevel.guiText.text\
    \ = health.ToString();\n    if (health <= 0){\n        KillPlayer ();\n    }\n\
    }\n```\n\n# Why?\n\nThe first line is defining the name of the function (applyDamage\
    \ declares a local variable “damage” that is an integer). This local variable\
    \ declared here will mean we can easily pass values to the function.\n\nThen,\
    \ the first command is a bit of programming shorthand. health -= damage means,\
    \ “subtract damage from health, and that's the new health value.” It's a little\
    \ unintuitive at first glance, but saves loads of time when doing counting sorts\
    \ of things.\n\nThe next command just says (as before), write the string version\
    \ of the health value to the text of the guiText component attached to healthLevel.\n\
    \nFinally, it checks to see if the health level is equal to or has dropped beneath\
    \ 0, and if it has, fire the function KillPlayer (which we haven't written yet)."
