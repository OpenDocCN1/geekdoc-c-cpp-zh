  md: 'variable that''s only accessible in this function called `textureColor` that
    is of type `Color`. Then use a sin curve (looks kind of like a sound wave if it''s
    been too long since your last math class that has gentle slopes up and gentle
    slopes down) to define the red value of the `textureColor` `Color`. This sin curve
