  md: "![](img/0285f88bc840f313779e011725b623a5_278_0.png)\n\n**FIGURE 9.35** Using\
    \ the Relax part of the Smooth UV tool to relax out overlapping regions.\n\n![](img/0285f88bc840f313779e011725b623a5_278_1.png)\n\
    \n**FIGURE 9.36** Using Polygon>Relax.\n\n# ## Hands\n\nUgh…hands. So beautiful,\
    \ so complex, and so difficult to UV map. Often UV mapping the hands is an exercise\
    \ in compromise. Getting all the digits unwrapped into a 2D space is just a tough\
    \ job. The following steps are a quick compromise to generate a UV map that works\
    \ very well for game situations where the hands are rarely the full-screen close-up.\n\
    \nThe process will consist of two planar projects followed by some careful relaxation\
    \ along the edges of the map.\n\n+   **Step 49:** Select the faces along the outside\
    \ of the hand (Figure 9.37).\n\n+   **Step 50:** Apply a planar projection via\
    \ Polygons>Create UVs>Planar Mapping (Options). Change the Project From setting\
    \ to X-axis. Press Project.\n\n> **Why?**\n> \n> We want to project from the side—thus\
    \ along the X-axis."
