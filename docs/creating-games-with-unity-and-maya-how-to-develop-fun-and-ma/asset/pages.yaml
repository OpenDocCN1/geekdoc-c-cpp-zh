    +   **Step 2**: Reduce the transparency of the crosshairs. With the Crosshairs
    GUITexture object selected, click the color swatch and reduce the Alpha (the A
    slider) to around 50 (Figure 14.5).


    ![](img/0285f88bc840f313779e011725b623a5_408_0.png)


