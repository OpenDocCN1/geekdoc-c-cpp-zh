- pgno: 314
  md: '# Why?


    Fingers? Why fingers and not an individual finger? A lot of this depends on the
    needs of a game and a model. In our game the character will generally be holding
    a weapon or perhaps pressing a button. This means that the index finger and thumb
    would need to be separately articulated, but the middle, ring, and pinky fingers
    would not—they would generally function as a unit. This might be different for
    different games: the hand would be rigged in a different way if all the fingers
    needed to articulate separately. But to add joints to the ring and pinky fingers
    would be another eight joints (per hand), or 16 added joints for the model, considering
    that the entire rig now is 25 joints, rigging those extra fingers is a significant
    cost.


    **Step 49:** Create a string of joints for the pointer finger as shown in Figure
    10.22. Build this chain off the wrist from either side- or front-view panels and
    remember to tweak their positions in front-side- and perspective-view panels to
    get their positioning right.


    **Step 50:** Create a string of joints for the thumb as shown in Figure 10.23.
    Again, build off the wrist in front- or side-view panels and go back and adjust
    later with just the Move tool.


    ![](img/0285f88bc840f313779e011725b623a5_314_0.png)


    ![](img/0285f88bc840f313779e011725b623a5_314_1.png)'
