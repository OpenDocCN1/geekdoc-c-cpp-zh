    Step 12: Resize the image to 512×512. Do this with Image>Image Size.


    # **Why?**


    512×512 is of course a power of two size and thus a quick renderer.


    Step 13: Save the file to the Incursion–Unity project''s Assets folder as WaterSteam_Color.


    Step 14: Adjust the import settings to include alpha. Back in Unity, the WaterSteam_Color
    image should now appear in the Project panel. Select it and in the Inspector panel
    click the Generate Alpha from Grayscale checkbox. Click Apply.'
