  md: '+   **Step 110:** Clean up the mirror plane. Select all the vertices that should
    be right on the mirror plane and snap them in the middle (you may want to double-check
    that Retain Component Spacing is still turned off in the Move tool settings).

    +   **Step 111:** Select the mesh in object mode, and choose Polygons>Mesh>Mirror
    Geometry Options. Click the –X radio button and check the Merge With Original
    check box. Press Mirror.


    **Why?**

