  md: "FIGURE 15.9 The camera “seeing” the First Person Controller.\n\n![](img/0285f88bc840f313779e011725b623a5_431_0.png)\n\
    \nStep 13: Make the light pulse. To do this we will make a looping function. To\
    \ create this looping function we’ll create a mini-state-engine to define the\
    \ state of things. The looping function will continue to loop as long as this\
    \ state is true. So we’ll need to do a few things to the script: add a Boolean\
    \ (true/false switch), define that this Boolean is true when the ray hits the\
    \ Player tag, and then fire the looping function:\n\n```\n```javascript\nvar seenSomething\
    \ : boolean;\n\nfunction Update () {\n    var hit : RaycastHit;\n    if (Physics.Raycast\
    \ (transform.position, transform\n.forward, hit, 100)) {\n    Debug.DrawLine (transform.position,\
    \ hit.point,\nColor.yellow);\n        if (hit.collider.gameObject.tag == \"Player\"\
    ){\n            seenSomething=true;\n            PulseLight();\n        }\n  \
    \  }\n}\nfunction PulseLight(){\n    while (seenSomething){\n        var textureColor\
    \ : Color;\n        textureColor.r = Mathf.Sin (Time.time * 10.0);\n        renderer.material.color\
    \ = textureColor;\n        yield;\n    }\n}\n```\n```\n\n# ### Why?\n\nSo note\
    \ the three new things. var seenSomething is the declaration of the Boolean variable.\
    \ Then in the Update function, note that we define seenSomething as true when\
    \ the ray collides with something with the tag “Player.” Then, when seenSomething\
    \ is true, we tell Unity to go fire the function PulseLight.\n\nPulseLight is\
    \ the looping function. After defining the name of the function we are saying,\
    \ “while seenSomething is true, then create a"
