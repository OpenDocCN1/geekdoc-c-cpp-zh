- pgno: 481
  md: "# Why?\n\nIf the inventory is visible, and the user presses I on the keyboard,\
    \ we need to do one thing (hide the buttons), but if it is not when the user presses\
    \ I, we need to do something else (show the buttons). We need Unity to keep track\
    \ of whether the inventory is or is not visible.\n\n**Step 59:** Tell Unity on\
    \ start that the inventory is indeed not visible.\n\n```\nfunction Start(){\n\
    \    inventoryPrompt = GameObject.Find(\"InventoryPrompt\");\n    mainCamera =\
    \ GameObject.Find(\"Main Camera\");\n    fpcAegis = GameObject.Find(\"FPC_AegisGuy\"\
    );\n    inventoryVisible = false;\n}\n```\n\n**Step 60:** Set up the scene to\
    \ make sure the inventory is indeed not visible. To do this, back in Unity, select\
    \ InventoryButton_Tab and change the Transform Position X value to -0.5. This\
    \ will slide the buttons off the screen leaving just the InventoryPrompt visible\
    \ (Figure 16.5).\n\n![](img/0285f88bc840f313779e011725b623a5_481_0.png)\n\n**Step\
    \ 61:** Lock the cursor. Unity provides a very quick and easy way to lock (and\
    \ hide) the cursor. Make sure that when the game starts, the cursor is indeed\
    \ locked.\n\n```\nfunction Start(){\n    inventoryPrompt = GameObject.Find(\"\
    InventoryPrompt\");\n    mainCamera = GameObject.Find(\"Main Camera\");\n    fpcAegis\
    \ = GameObject.Find(\"FPC_AegisGuy\");\n    inventoryVisible = false;\n    Screen.lockCursor\
    \ = true;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 482
  md: "**Step 62:** Tell Unity to listen for the player to press the I button, and\
    \ if I is pressed, run a function that shows/hides the prompt and the inventory.\
    \ Do this with a new function Update.\n\n```\n```csharp\nfunction Update()\n{\n\
    \    if (Input.GetKeyDown(KeyCode.I))\n    {\n        ToggleInventory();\n   \
    \ }\n}\n```\n```\n\n# Why?\n\nSo the code is saying, \"check every frame (function\
    \ Update) to see if I has been pressed (if (Input.GetKeyDown (KeyCode.I))). If\
    \ it has, run the function ToggleInventory.\" Of course, at this point this function\
    \ doesn't exist ... but it will.\n\n**Step 63:** Write the ToggleInventory function\
    \ to check if InventoryVisible is true, and if it is, slide the InventoryPrompt\
    \ on the screen and then slide the buttons off (then lock the cursor and free\
    \ the camera to look around). If it is not true, have the InventoryPrompt slide\
    \ off the screen and the buttons on (then unlock the cursor and lock down the\
    \ camera). Add this function to the bottom of the script:\n\n```\n```csharp\n\
    function ToggleInventory()\n{\n    if (InventoryVisible)\n    {\n        iTween.MoveTo\
    \ (InventoryPrompt, Vector3 (0, 1, 0), 1);\n        iTween.MoveTo (gameObject,\
    \ Vector3 (-.5, 1, 0), 2);\n\n        InventoryVisible = false;\n        Screen.lockCursor\
    \ = true;\n        mainCamera.GetComponent(\"MouseLook\").enabled = true;\n  \
    \      fpcAegis.GetComponent(\"MouseLook\").enabled = true;\n    } else {\n  \
    \      iTween.MoveTo (InventoryPrompt, Vector3 (0, 1.1, 0), 1);\n        iTween.MoveTo\
    \ (gameObject, Vector3 (0,1,0), 2);\n        InventoryVisible = true;\n      \
    \  Screen.lockCursor = false;\n        mainCamera.GetComponent(\"MouseLook\").enabled\
    \ = false;\n        fpcAegis.GetComponent(\"MouseLook\").enabled = false;\n  \
    \  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 483
  md: '# Why?


    The iTween.MoveTo should look familiar. After checking to see if inventoryVisible
    is true, the iTween line is saying, “take the inventoryPrompt GameObject, and
    move it to the coordinates (0,1,0), and do it over 1 second.” Also take the gameObject
    this script is attached to and move it to the coordinates (-5,1,0). If inventoryVisible
    is not true then slide inventoryPrompt to coordinate (0,1,0). Then, take the gameObject
    this script is attached to and move it to (0,1,0). Remember that 0,1,0 for a GUITexture
    means that it is aligned in the top-left corner of the interface (visible in this
    case), but that at 0,1,1,0 the GUITexture is slid off the top left of the screen
    and at (-5,1,0), the GUITexture is slid off the left of the screen. So what’s
    happening here is the prompt slides up as the buttons slide in to make inventoryVisible
    true, and the other way around to make inventoryVisible false.


    # Warnings and Pitfalls


    There can be a bit of confusion about whether or not the lockCursor is working
    when dealing with the editor environment. Make sure that when testing something
    that locks the cursor, that the cursor is indeed in the Game window when the game
    starts. Then, also realize that as the mouse is moved around within the game,
    it could be escaping and actually be invisible on some other part of the Unity
    interface. So when the mouse is clicked, Unity could be thinking you''re clicking
    something in the Hierarchy, or elsewhere. If this happens, just guide the mouse
    back to the game window and click again to tell Unity, "Yeah, I''m working in
    this window, and I want the mouse click to register here."


    +   - Step 64: Save and return to Unity. Check for syntax problems.

    +   - Step 65: Apply this new InventoryToggle script to InventoryButton_Tab in
    the Hierarchy. Apply this addition to the prefab by clicking the Prefab Apply
    button.

    +   - Step 66: Play and test. The inventory system should be all set up and running.

    +   - Step 67: Save Scene-EntryWay.

    +   - Step 68: Open Scene-Hallway.

    +   - Step 69: Delete the existing Crosshairs GUITexture from the Hierarchy.


    # Why?


    Remember that now the Crosshairs are part of the GUIElements prefab we’ve constructed.
    And since we don’t want or need two, we need to get rid of one before bringing
    in the GUIElements prefab.


    +   - Step 70: Place the GUIElements prefab in the scene. Do this by dragging
    it from the Project panel to the Hierarchy. Make sure its Transform XYZ are all
    0.


    # Why?


    Remember that the GUIElements includes our screen hints mechanism as well as our
    Crosshairs, and most importantly, our Inventory system. Bringing it in as a prefab
    makes everything work for us.'
  merge: -1
  img_proc: true
- pgno: 484
  md: '**Step 71:** Double-check the AC_ToolFunctionalityScript that should be attached
    to the Main Camera object that is a child of the FPC_AegisChung prefab already
    within the Hierarchy. Make sure that all the elements needed in this scene (Hallway
    Baked, Hallway Dark, etc.) are populated. Leave things like Keypad Lock and Keypad
    Smoke unpopulated as they are specific to the EntryWay.


    **Step 72:** Make sure FPC_AegisChung is placed at the entrance.


    # ### Why?


    When this level is loaded up, the assumption is that we''ve just walked in the
    doors. So he needs to be just inside those doors he just entered through.


    **Step 73:** Make sure AC_Flashlight, Flashlight, and AC_Pistol are all activated
    for FPC_AegisChung in the Hierarchy.


    # ### Why?


    Our InventoryButtonScript now goes out and finds these objects (if they are inactive
    Unity can''t find them) and then turns them off on start.


    **Step 74:** Activate the unbaked version (the dark version) of the hallway labeled
    Hallway_Unbaked if you''re using downloaded prefabs, and deactivate Hallway_BakedGroup.
    Be sure to Activate/Deactivate all the children as well.


    **Step 75:** Play and test.


    # ## Conclusion


    Some great stuff is happening. At this point, the inventory system works, the
    player can break into the front door, turn on the lights, and then shoot out cameras.
    The game is almost done. We still need a few more added features.


    First, we created a key that we can highlight (via the raycasting mechanism).
    But we can''t do anything with this key. Nothing happens there (other than the
    highlight). We''ll need to do just a bit of adjustment to make this key work to
    open a door later. In the last tutorial of this chapter we''ll create the mechanism
    for the key to work.


    Then we need to create a mechanism to allow the player to succeed and to fail.
    Right now, the cameras sound the alarm if they see the player, but there are no
    consequences to this besides a headache from the never-ending sirens. And, if
    the player makes it all the way down to the bottom of the stairs and finds the
    device, we haven''t a way to indicate to the player that he has indeed found the
    device and has beaten the game. In the next chapter we''ll create a simple health/success/failure
    engine to keep track of how successful the player is.'
