- pgno: 217
  md: '![](img/0285f88bc840f313779e011725b623a5_217_0.png)


    FIGURE 8.26 Roughing out the nostril.


    # Why?


    Pairs of edges are very important in most all of organic modeling because it allows
    for some roundness to a form. Especially at a place like this where the geometry
    is making a corner (from the bottom of the nostril to the side), extruded pairs
    can greatly speed up the vertex sculpting process.


    **Step 44:** Close up the top of the nose with the Append to Polygon tool (Figure
    8.27).


    FIGURE 8.27 Closing up the top of the nose.


    ![](img/0285f88bc840f313779e011725b623a5_217_1.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '**Step 45:** Complete the nostril. Select the edges that now make up the hole
    at the bottom of the nose that will become the nostril. Select Polygons>Edit Mesh>Extrude
    and then immediately swap to the Move tool. Move this new collection of edges
    up into the nose. Sculpt as needed by moving vertices (Figure 8.28).


    ![](img/0285f88bc840f313779e011725b623a5_218_0.png)


    # ### Cranium


    We''ll leave the face area for a bit here. By building up the cranium for a minute
    we can lay the foundation for tricky areas like the ears and mandible (jaw bone).


    +   - **Step 46:** Select and extrude the edges at the top of the forehead (Figure
    8.29).

    +   - **Step 47:** Continue extruding and sculpting the head until polygons are
    created over the area of the ear (Figure 8.30).

    +   - **Step 48:** Extrude off the back of the face area to meet up with the newly
    created cranium geometry (Figure 8.31).

    +   - **Step 49:** Clean up. Do this in two steps. First merge the vertices of
    this new seam between cranium and face mask (Marquee around pairs of vertices
    and use Polygons>Edit Mesh>Merge). Then do a quick pass across the middle of the
    head and make sure that all the vertices that should be on the mirror axis really
    are (Select, hold down X, and snap to the middle; Figure 8.32).


    # ### Mandible


    One of the things Jake''s models are always very good at is appropriate topology.
    The organization of polygons (and particularly, loops of polygons) is very important
    for face models because the face is a very complex form, and if the polygons are
    oriented incorrectly, and there just aren''t the places to bend, it''s impossible
    to get the right form. Picking where to extrude what polygons becomes a very important
    process, and is a big reason why I prefer this additive process to others that
    might be built from a cube.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/0285f88bc840f313779e011725b623a5_219_0.png)


    > **FIGURE 8.29** Begin extruding the cranium.


    ![](img/0285f88bc840f313779e011725b623a5_219_1.png)


    > **FIGURE 8.30** Continued extrusion over the ear.


    **Step 50:** Select an edge off the face mask that would represent where the mandible
    would drop down and extrude down and around to create the edge of the jaw bone
    (Figure 8.33).


    # Tips and Tricks


    In the style sheets (the drawings) there sometimes are some areas where the front
    and side don''t line up perfectly. This mandible area is one of those. Be sure
    to be looking at the perspective view to get the right look and anatomy. While
    good style sheets are really close in the side and front drawings, it''s very
    difficult to have them exactly right in every place.'
  merge: -1
  img_proc: true
