  md: '![](img/0285f88bc840f313779e011725b623a5_460_0.png)


    **FIGURE 15.31** EntryWay KeypadSmoke. Just a modified version of Unity''s built-in
    smoke.


    # Conclusion


    If all is working right, after the EMP is placed next to the keypad, it should
    explode, turn itself black, turn the keypad black, start the smoke coming from
    the keypad, and open the doors. If you''ve been following all the tutorials, there
    should also be a trigger set within those open doors that will move us to Scene-Hallway.


    There''s some important things left to do. Right now, we have no inventory system,
    so it''s clumsy (we have to manually activate or deactivate the tool before running
    the game). We need to build in a system so that the player can determine which
    tool or weapon to use. We also need to build in mechanisms that kill the player
    if he falls in the water, and that make the player lose if the alarms in the building
    go off for too long. Lastly, we need to build in some way for the player to win.


    In the next chapter we''ll build in this endgame sort of mechanics. At that point
    we''ll have a functioning game that''s ready to be built and distributed.'
