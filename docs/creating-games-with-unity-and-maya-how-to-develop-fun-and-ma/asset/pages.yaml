- pgno: 130
  md: '![](img/0285f88bc840f313779e011725b623a5_130_0.png)


    **FIGURE 5.12** Inspector for a selected mesh.


    in the scene and still blocks the player from walking through it, but cannot be
    seen.


    The Mesh Collider is the component that was added when Generate Colliders was
    checked in the FBXImporter settings in previous steps. This is what prevents the
    player from running through the wall.


    Finally, the last section is the Material applied to this GameObject. Notice that
    there are actually several sections here. Immediately underneath the name of the
    material is a drop-down menu allowing for the changing of the Shader. Much, much
    more on this later. But for now, just note that the default shader is “Diffuse.”
    A diffuse shader uses a color texture file to define the color of the material.
    It has no specular highlight or bump to it. This will be changed later, but is
    a nice way to get started checking out materials.


    Below that section is the Main Color section that shows the texture file that
    is being used to define the color of the material. This texture file is what we
    are interested in.


    **Step 16:** Select the color texture file. In the Inspector, in the Main Color
    section, click the Main Color texture swatch (Figure 5.13).'
