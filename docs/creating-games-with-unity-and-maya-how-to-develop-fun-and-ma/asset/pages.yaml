- pgno: 352
  md: "![](img/0285f88bc840f313779e011725b623a5_352_0.png)\n\n*FIGURE 11.5 Basics\
    \ of a script as presented in UniSciTE.*\n\n**Step 23:** Enter the following text:\n\
    \n```\n~~~csharp\nfunction Update () {\n    if (Input.GetButton(\"Vertical\")\
    \ ||\nInput.GetButton(\"Horizontal\")) {\n        audio.enabled = true;\n    }\
    \ else {\n        audio.enabled = false;\n    }\n}\n~~~\n```\n\n# ## Tips and\
    \ Tricks\n\nNotice that there is that strange || symbol. That is the script symbol\
    \ for “or” and is generally made by pressing Shift-\\ (the key right beneath the\
    \ Backspace key) on US keyboards. Also note that the line that begins with “if\
    \ (Input.GetButton)” is all one line and doesn’t end until the “||”.\n\n# ## Why?\n\
    \nOK, I know I said we weren’t going to go into great depth about what was happening\
    \ here, but it’s worth a quick look.\n\n“function Update” just means “check every\
    \ frame.” So the script tells Unity to check every frame “if” the player is pushing\
    \ the Vertical or Horizontal buttons. And if he is, it sets the audio component\
    \ to be enabled (audio.enabled=true), which means the audio is playing. If the\
    \ player is not pushing either of these buttons (else), it sets the audio component\
    \ to not be enabled (audio.enabled=false) and thus turns the sound off.\n\nVertical\
    \ and Horizontal are two inputs that are already defined in the Input section\
    \ of Unity (Edit>Project Settings>Input). Don’t worry too much about this for\
    \ now, but Horizontal are the strafing A and D keys, and Vertical are the W and\
    \ S keys. So when W, A, S, or D are pressed, the audio clip is enabled and the\
    \ sound plays.\n\n**Step 24:** Save the script (File>Save). When you return to\
    \ Unity, open the Console (Window>Console) where Unity will tell you of any obvious\
    \ syntax errors. If you find any errors, Unity will give point toward the line\
    \ number where the error exists. Go back and correct."
  merge: -1
  img_proc: true
