- pgno: 348
  md: '**Step 7:** Repeat for additional sound source in the tunnel. Duplicate Sound-Waves
    in the Hierarchy window by selecting it, then right-click it and choose Duplicate.
    Rename the copy to Sound-Waves Tunnel and then move it into place (Figure 11.2).


    ![](img/0285f88bc840f313779e011725b623a5_348_0.png)


    FIGURE 11.2 Additional wave source within the tunnel


    > **Warnings and Pitfalls**

    > When playing the game, it is possible to make changes to parameters of components
    (like Audio Sources) within the scene, and when these changes are made they will
    instantaneously be in effect. However, remember that these changes will revert
    once the game is stopped. So while tweaking things like volume while in-game are
    quick ways to find the right values, be sure to write these values down because
    they will need to be input again when the game is stopped.


    > **Why?**

    > The idea here is that the waves lapping against the side of the tunnel will
    create additional audio vibrations (sound). Placing an additional sound source
    here will ensure that this effect is heard.


