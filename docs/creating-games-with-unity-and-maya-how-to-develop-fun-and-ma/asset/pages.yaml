  md: '**FIGURE 7.18** Poor-quality shadows from the default directional light.


    ![](img/0285f88bc840f313779e011725b623a5_185_0.png)


    see the drawbacks to the default settings, but getting this to look and behave
    better is not hard. But before we look at how to fix the problem, let''s look
    for a minute at why the problem exists.


    Shadows are drawn as maps laid over the top of existing texture. In 3D-speak these
    are referred to as shadow maps. When using Maya or other 3D applications, drawing
    the shadow map can indeed be a slow process as the software figures out where
    to draw these dark blobs of pixels. A shadow map is essentially an image with
    a finite resolution (and, like any raster image, can look pixelated when viewed
    at a close range).


    Choose Edit>Project Settings>Quality. This will bring up an image like Figure
    7.19. First look at the top collections of settings (Default Standalone Quality,
    Default Web Player Quality, Editor Quality). By default these are all set to Good.
    The specifics of what Good means are contained in the following sections (Good
    and Fantastic are expanded in Figure 7.19).


    **FIGURE 7.19** Quality Settings from Edit>Project Settings>Quality


