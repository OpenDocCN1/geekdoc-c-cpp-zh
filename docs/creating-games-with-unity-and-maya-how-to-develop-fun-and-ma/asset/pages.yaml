  img_proc: true
- pgno: 315
  md: '# Tips and Tricks


    OK, this is actually a disclaimer. There are a lot of joints in this hand that
    in non-game situations would definitely be needed. If you''re screaming that there
    are no metacarpal joints, you''re right. In most higher-res situations there are
    a vital cop of hand rigging. To make matters worse, we are leaving out joints
    in the thumb that are critical for hand close-ups. But for game situations on
    hardware today we wish to strip down to the joints we need. Five years from now,
    even on mobile devices we might throw joints in with reckless abandon. Today though,
    the compromises are necessary.


    **Step 1:** Orient upper body joints. Select AC_Back_Base (probably easiest in
    the Outline), then choose Animation > Skeleton > Orient Joint. The results can
    sometimes be a little tough to see, but see the before and after shown in Figure
    10.24.


    ![](img/0285f88bc840f313779e011725b623a5_315_0.png)


    **FIGURE 10.24** Before and after orient joint image. Notice how the joints point
    toward the next joint, allowing the joints to be oriented correctly.


    # Why?


    When placing joints, it is pretty impossible (especially through the hand) to
    get them in just the right place without having to go back and move them. The
    problem is that the orientation of the parent joint (to wherever joint is created)
    is defined on the first click of placement. So when the joints are later moved
    into their correct locations, the parent joints no longer are pointing toward
    the next joint, which makes for awkward animation later. The Orient Joint command
    (which by default orients all the children of the selected joint) tells all the
    joints to take a look at the next joint in their chain and point to that chain
    (although this isn''t perfect; see the following steps). Importantly, this only
    affects the joint''s orientation, not its rotation (as can be seen in the Channels
    box). This means that later, zeroing out the rotation values of the joints will
    return them to their neutral pose.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '**Step 52:** Examine the newly oriented joints and manually adjust any that
    are needed. Swap to the Rotate tool and examine the joints in the upper body.
    Try rotating them and seeing if the axis of the rotation handle makes sense for
    that joint (be sure to undo the rotation each time). For instance, the elbow will
    really bend only in one direction. Does rotating that joint require rotation along
    only one axis? If not, it should be adjusted. Figure 10.26 shows the adjustment
    of my wrist joint (yours may or may not require such an adjustment). To adjust
    the orientation first we need to be selecting by component type and be able to
    select what Maya deems “miscellaneous components.” The easiest way to do this
    is in the top shelf (Figure 10.25—take careful note of the highlighted pressed
    buttons). Then when a joint is clicked it will show a few floating x, y, and z
    letters. Activate the Rotate tool and click any of these letters to get handles
    to adjust the orientation. Use the Rotate tool to rotate the orientation of the
    joint (Figure 10.26).


    ![](img/0285f88bc840f313779e011725b623a5_316_0.png)


    **FIGURE 10.25** Saving, orienting joint correctly.


    ![](img/0285f88bc840f313779e011725b623a5_316_1.png)


    **FIGURE 10.26** The process of adjusting joint orientation. First, click the
    x, y, or z, then use the Rotate tool to rotate the orientation to desired position.


    # **Why?**


    This can be a tedious process. Hopefully, the Orient Joint function lines things
    up pretty well for you and there is very little manual adjustment that needs to
    take place. Much of it depends on how carefully the joints are organized as they
    are placed, but if a series of joints are even just a little out of line, Maya
    will tend to twist joints to try and orient toward the next, thus they need to
    be readjusted manually.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Still, remember that the idea here is that this yields dividends by having
    joints that are oriented in ways that make the animation cleaner with fewer axes
    needing to be rotated for any movement. Further, this makes it so the joints can
    be returned to this neutral position by entering 0 in the Rotate X, Y, and Z input
    fields of the Channel box.


    Step 53: Swap to Object Mode and mirror from the clavicle down. Select AC_L_Clavicle
    and choose Animation>Skeleton>Mirror Joint.


    # Tips and Tricks


    The settings from last time this was done should still be there (the mirror axis
    along YZ and the instructions to replace L_ with R_), although if the results
    are not as anticipated, undo and check the Mirror Joint options.


    # Facial Rig


    Unfortunately, out of the box, Unity does not support blendshapes (often the preferred
    method of rigging the face for animation). However, if you''re familiar with Maya,
    you know that there are several camps when it comes to facial rigs; one fairly
    persuasive group argues that rigging the face with joints is a flexible and powerful
    solution.


    In Unity, this is the only solution; however, an extensive facial rig can become
    both a performance and time killer. If you''re playing a first-person shooter
    and are spending a lot of time examining facial expressions, there''s something
    wrong with the game. If you''re playing a third-person game, the majority of the
    time is spent looking at the character''s back, so again, an extensive facial
    rig is not called for.


    Of course, in cinematic-cut scenes a good facial rig can really be valuable. And
    in fact, great strides are being made in facial animation in games as of late
    (take a look at the work coming out of Rockstar Games'' L. A. Noire, for example).
    However, in this case, our budget doesn''t allow for good voice talent (and animators
    and programmers hardly ever provide acceptable performances) so there is no need
    for a very complex facial rig.


    However, a bit of facial movement, especially in the jaw and eyes can help a character
    have a bit of life so they don''t feel quite so much like a walking mannequin.
    So in the coming steps we will create a very simple face rig that will provide
    some facial articulation but keep the joint count low.


    Step 54: Create a two-joint chain for the jaw. Do this from the side view and
    build the chain from the AC_Head_Base joint. Create the first joint just in front
    of the ear (the hinge of the mandible) and put the second down at the end of the
    chin (Figure 10.27). Be sure to press Enter after creating the joint at the chin
    to exit the tool.


    Step 55: Create an eye joint. Do not grow this joint out of any extant joints
    (we want it to be facing straight forward), but in the side-view panel activate
    the Joint tool again and create one joint (click and then press Enter) in the
    center of the eye. In the front-view panel, adjust its location to be in the center
    of the eye (Figure 10.28). Rename the joint AC_L_Eye.'
