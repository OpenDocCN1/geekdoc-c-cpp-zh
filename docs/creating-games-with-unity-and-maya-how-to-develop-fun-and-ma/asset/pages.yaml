- pgno: 273
  md: 'FIGURE 9.26 Moving the projection center to reduce distortion on chest front
    projection.


    ![](img/0285f88bc840f313779e011725b623a5_273_0.png)


    FIGURE 9.27 Scaling projection.


    ![](img/0285f88bc840f313779e011725b623a5_273_1.png)'
