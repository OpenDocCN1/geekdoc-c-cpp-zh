- pgno: 511
  md: "# # Timers on Cameras\n\nGetting closer. We now have all sorts of ways to die.\
    \ In a few pages, we will keep track of health from level to level (right now\
    \ he miraculously is healed when he moves from the EntryWay to the Hallway). We\
    \ just need to do a little bit of cleaning up.\n\nCurrently, if the CCTV camera\
    \ sees you they throw up an awful racket, but there are no consequences. We need\
    \ to add a mechanism to the cameras so that once they see the player, a countdown\
    \ begins where if it reaches 0, the player loses the game.\n\nLuckily, much of\
