  md: "**Step 13:** Delete the default information contained in that script and enter\
    \ the following:\n\n```\n    function FindDoorHint ()\n        guiText.enabled\
    \ = true;\n        guiText.text = \"Find the secure entrance to the\n        \
    \    base.\";\n        yield WaitForSeconds (3);\n        guiText.enabled = false;\n\
