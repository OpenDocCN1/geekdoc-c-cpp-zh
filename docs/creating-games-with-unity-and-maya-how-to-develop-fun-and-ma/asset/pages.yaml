  md: '![](img/0285f88bc840f313779e011725b623a5_110_0.png)


    # # Asset Creation: Unity

    ## Scenography Importing


    # ## Unity


    The fun can begin. The assets of the level design are designed and produced. Now
    we can get to the fun where we actually get to walk around and explore the level
    within Unity.


    Remember that it is always a good idea to actually import assets into Unity well
    before this point. What looks good as the scene is tumbled around in Maya may
    not when the player is walking through the space in Unity. The textures that seem
    to be a great move in Maya just may not hold up as planned inside Unity. The process
    of prototyping a space is an important one, and dropping a prototyped space into
    Unity will provide very instructive time for the space''s feel and mood.


    However, in the linear medium that books are, we are working in the classic “finish
    this step and then do this one.” So, here we are with a completed model that we
    will be bringing into Unity.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# The Plan


    Here''s the plan for this chapter. First, out of necessity, we will very quickly
    look at the Unity interface. Because this is covered fairly well in the free Unity
    documentation we won''t spend a lot of time covering all the details of what is
    what, but we will spend just a bit of time understanding what these parts are
    and how best to use them.


    After a quick run through the interface, we will jump back into Maya to explore
    how best to prepare the file for export. There is always a bit of cleaning that
    can be done to make the process smoother. Here we will also discuss how best to
    transfer the files into Unity, and why I argue to always do the .fbx export manually
    (and not simply drag the .mb into the Unity assets folder).


    Finally, back in Unity we will import our completed scene and do a bit of optimizing
    to make sure the game can run smoothly. We will optimize our textures, and dig
    down to find the resolution we need to give the visual effect we want while keeping
    the amount of resources required to run the game low.


    # Unity Projects


    One of the reasons Maya and Unity make so much sense as sister technologies is
    that Unity''s working structure is much like Maya''s. Among the equivalencies
    is the importance of the project file. In the Maya chapters we worked very hard
    to establish a project and to make sure all relevant assets were stored in the
    appropriate locations within this project file. Unity is the same way—in fact,
    Unity will not even open unless there is a project defined.


    Before we get to defining projects, we need to talk a bit about how Unity creates
    and deals with projects.


    Like Maya, when a project is created in Unity, a new folder is created on the
    hard drive. This folder will include several subfolders that we will get into
    later. This folder is important in several ways, and treating this folder right
    will be important to an uninterrupted creation process.


    # Tutorial 5.1: Creating a Unity Project


    If you have not downloaded and installed Unity at this point, please do so now.
    Remember the standard Unity license is free and available at http://www.unity3d.com.
    Just go to the Download section. There are some very nice features in Unity Pro
    (real-time shadows, deferred rendering, occlusion culling), but to learn Unity,
    there is plenty that can be done with the standard (and free) Unity.


    To set up a new Unity project and to set up Unity to effectively allow for the
    management of projects, do the following.


    **Step 1:** After installing Unity, when run, Unity will present a Unity-Project
    Wizard window (Figure 5.1). This Wizard has two tabs: the Open Project and Create
    New Project.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/0285f88bc840f313779e011725b623a5_112_0.png)


    # ## Tips and Tricks


    If you''ve already been using Unity, there will be a slew of projects listed in
    the Open Project tab. In fact, if you''ve already been using Unity, the wizard
    may not be presented at all. Unity automatically defaults and opens to the last
    opened project and thus skips the Project Wizard. I''m not a big fan of this method
    because it opens up a lot of possible mistakes of saving files to the wrong project.
    Luckily Unity has a setting (Edit>Preferences) called Show Project Wizard at Startup.
    Activate this so that when Unity is launched you always know that you are working
    in the correct project.


    +   - **Step 2:** Select the Create New Project tab.

    +   - **Step 3:** Click the Browse... button. Choose a location to save the Project
    file. Create a new folder (Unity requires that the location of a new project be
    within an empty folder). In our case, it''s easiest to find where you have your
    Incursion-Maya folder and (not within that folder but) at the same place create
    a folder named `Incursion-Unity`. Click Select Folder.


    # ## Why?


    In the development of a game, there will be a lot of assets created and manipulated.
    If you''ve been doing 3D production for a while, you know how easily you can wind
    up in a mess if you don''t keep a good eye on where you''re storing your textures.
    In a game there not only are models and textures but a slew of other assets. By
    keeping the Maya file and the Unity projects in close proximity to each other
    it''s not only easier to get assets from one place to another, but it keeps all
    the relevant data near.


    +   - **Step 4:** Back in the Create New Project tab, look in the "Import the
    following packages" section and choose "Character Controller.unityPackage". Click
    Create.'
  merge: -1
  img_proc: true
