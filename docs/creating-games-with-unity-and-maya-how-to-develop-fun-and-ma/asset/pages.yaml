    the head and neck in the Front drawing. Copy and paste it into a new Photoshop
    document. Save it as AC_Front_Head in the sourceimages of the Maya project file
    (Incursion-Maya). Make note of the actual image size, and make a selection in
    the Side drawing of the same pixel height. Copy and paste this into a new Photoshop
    document. Save it as AC_Side_Head.


    > > **Why?**

    > >

    > > Figure 8.1 shows the completed character style sheets; this will be the basis
    of the model to be created. However, if this is imported into Maya at too high
    a resolution, Maya can be dragged to a crawl, but too low a resolution can mean
    that any detail (like the face) is just a patchwork of blotchy pixels. By working
    with a high-resolution head, most of the critical information will be available
    for that detailed modeling; then later, when it''s time to do the body, this image
    can be swapped out for a lower-resolution body.


    # Image Planes in Maya


    +   - **Step 3:** Open Maya and set the project to Incursion-Maya (File>Set Project).

