    function Update(){\n    SetActiveRecursively(true);\n}\n```\n\nSimilarly, new\
    \ ideas, concepts, or keywords will be bolded within the body of the text.\n\n\
    # A Note about the Approach\n\nI come from an art background. I have a BFA in\
    \ Theatre Set Design and an MFA in Graphic Design with an emphasis in 3D animation.\
    \ I think like a 3D artist and I teach 3D artists. Because of this, this book\
