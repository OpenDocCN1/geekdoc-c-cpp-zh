- pgno: 308
  md: '![](img/0285f88bc840f313779e011725b623a5_308_0.png)


    FIGURE 10.11  Appropriate hierarchy to this point.


    # Why?


    Notice that once this happens in the Outliner, a new bone becomes visible in the
    view panel connecting the Root to the Hip. This connection is important when we
    mirror one axis connection (that shows which joints are children of which) on
    the other side as well. So setting up this connection now is important.


    **Step 31:** Mirror the Leg. Select the AC_L_Hip (easiest to do in the Outliner).
    Choose Animation > Skeleton > Mirror Joint (Options). In Mirror Across check the
    YZ radio button and then in the Search for: enter L_ and Replace with: enter R_.
    Press Mirror (Figure 10.12).


    ![](img/0285f88bc840f313779e011725b623a5_308_1.png)


    FIGURE 10.12  Mirror joint settings.


    # Why?


    “Mirror across” is asking which plane to use as the mirror plane. If the character
    is facing forward (looking toward positive Z), YZ is the appropriate plane. The
    Replacement Names For Duplicated Joints just goes through all the joints and looks
    for L_ and replaces it with R_. This means that the left versions (designated
    by L_) are all renamed to right versions (called R_); this includes the associated
    IK handles. Cool, no?'
