  md: '**FIGURE 6.2** Placing a water prefab by dragging from Project panel to the
    Scene view. Note that this is using the Pro version of water (real-time reflection).


    ![](img/0285f88bc840f313779e011725b623a5_137_0.png)


    **FIGURE 6.3** Placed water.


    ![](img/0285f88bc840f313779e011725b623a5_137_1.png)


    **Step 7:** Play the game to check out the new water. Press the Play button (or
    press Ctrl-P on the PC or Command-P on the Mac) and walk around the scene to see
    how the water looks.


    # Why?


    Don''t worry too much about how this looks quite yet. It''s very likely that in
    the game view the water looks way too blue (even if you are using a Pro license).
    This is because the water is reflecting the sky, which at this point is just a
    flat blue. It will be prettier as we define the environment further.


    # Skyboxes


    Skyboxes are interesting things. In effect they paint a sky behind everything
    in your scene. The sky behaves visually as the real sky does (although generally
    not animated). There are a few things that are a little unintuitive about them
    though. First, a skybox is not a GameObject—it can''t be seen in the Hierarchy
    panel. Skybox materials are chosen in the Render Settings (of all places), and
    then Cameras have the option of whether to draw them or not. Second, skyboxes
    don''t affect any sort of lighting or baking. They are images that looks'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'like the sky (and this sky shows up in reflections if you have Unity Pro),
    but don''t really do anything to the scene.


    Still, even though it''s a bit unintuitive to track down where a skybox is, it
    really does help to take a scene out of that flat look that solid blue background
    gives it. In the next few steps we will set up a skybox to see how it works and
    what it does for the scene. However, this is an exploration of the tool—and in
    steps soon after that we will eliminate the skybox to give the scene a much more
    ambient effect.


    **Step 8:** Import Unity''s skybox package. Unity, as part of the standard packages
    that it ships, includes some fairly nice skyboxes. While custom skyboxes can be
    created, for now choose Assets>Import Package>Skyboxes. Again, after importing,
    the Project panel will show a new folder called Skyboxes within the Standard Assets
    folder.


    **Step 9:** Examine any of the skyboxes. In the Project panel, expand the Standard
    Packages folder, and then expand the Skybox folder. Notice that the skyboxes contained
    there are not prefabs or GameObjects at all. That circle icon represents a material.
    If any of these materials are selected, the Inspector will show that the skybox
    material actually consists of six images for each side of the box (Figure 6.4).


    ![](img/0285f88bc840f313779e011725b623a5_138_0.png)


    **FIGURE 6.4** Skyboxes are constructed with materials made of six texture images.
    No GameObjects are involved.


    **Step 10:** Apply a skybox material in the Render Settings. Select Edit>Render
    Settings. The render settings will appear in the inspector panel. There, notice
    the **Skybox Material** area. To apply a material here, either (1) drag a skybox
    material from the Project panel into the area where it says None (Material) or
    (2) click the little target icon at the far right of the Skybox Material line
    and pick a skybox material from the displayed swatches.'
  merge: -1
  img_proc: true
