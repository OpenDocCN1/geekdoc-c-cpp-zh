- pgno: 140
  md: '# ## Fog


    In Unity, fog is handy and easy to use. Think of it as more than just the gray
    fog that is seen in the real world (although Unity''s fog can be used to do that
    as well). Fog in Unity can be used to make dark scenes darker as the player gazes
    into the faraway corners of a space. Fog in Unity can be used to provide a soft
    haze on the horizon line to soften the sky/ground plane line. Fog can be used
    to make underwater feel like a murky mess, or just allow the water to “blue-out”
    as it gets further from the player. In short, fog—with a bit of tweaking—can be
    used for all sorts of interesting effects that can bring depth and polish to the
    scene.


    In the case of Incursion, fog will be used to hide the edge of the water, and
    to give the scene a damp and murky feel. It will provide a sense of ambience of
    a truly abandoned location, but one in which the player is never quite sure if
    he is alone.


    **Step 13:** Change the background color of the Main Camera to gray. The background
    color is an attribute of the Camera component. In the Hierarchy panel, expand
    the First Person Controller and select the Main Camera GameObject. Its attributes
    will appear in the Inspector. Under the Camera component, click the long blue
    swatch next to Background. Choose a new color that is rather gray-blue (this can
    be changed easily later: Figure 6.6). Jot down the RGBA values (mine were 89,101,120,255).


    ![](img/0285f88bc840f313779e011725b623a5_140_0.png)


    FIGURE 6.6 Changing the background color.


    # ### Why?


    When there is no skybox present, cameras paint a solid color behind all visible
    geometry (or actually more accurately, it draws a solid color field and then draws
    the geometry on top of it). Unfortunately, fog doesn''t affect this background
    quite as we would expect. Regardless of the density of the fog, that color field
    will still be visible. For that matter, a skybox is also still visible even if
    the fog is so thick the player can''t see any other geometry. This, of course
    is not how fog really works, so to fix this, match the background color to the
    fog color to begin with so the fog really appears to thicken the further it gets
    away from the player even if there is no geometry out there.'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# Tips and Tricks\n\nIt's important to note that the background color is an\
    \ attribute of a camera. This means that changes to the background color can only\
    \ be seen through the camera. If Main Camera is selected in the Hierarchy, a little\
    \ Camera Preview window will be set within the Scene window (Unity 3 or later\
    \ only). Or, by bringing the Game window forward by clicking its tab, the background\
    \ color changes will also become apparent. But, the background change will not\
    \ be shown in the Scene window.\n\nNote that this also means different cameras\
    \ can have different background colors. So if another camera is providing a map\
    \ view or a night-vision view, that camera can have its own black (or whatever)\
    \ color. Background color affects cameras, not the actual environment.\n\n+  \
    \ **Step 14**: Activate fog. Choose Edit > Render Settings (which will open in\
    \ the Inspector). Click the Fog check box.\n+   \n+   **Step 15**: Change the\
    \ Fog Color to match background. Still in the Render Settings, the Fog Color has\
    \ a long color swatch similar to the Background Color setting. Click this swatch\
    \ and change the color to match the background (in my case, 89, 101, 120, 255).\n\
    +   \n+   **Step 16** Adjust the Fog Density. The higher the Fog Density value\
    \ is, the closer the fog obscures objects. This value can be adjusted in a couple\
    \ of ways, either by clicking the numerical value and entering a new one or by\
    \ moving the mouse up to the Fog Density word and click-dragging left or right\
    \ (the cursor will have a double-tipped arrow appear (Figure 6.7). Adjust to about\
    \ 0. 04 (although this is to your taste).\n\n![](img/0285f88bc840f313779e011725b623a5_141_0.png)\n\
    \nFIGURE 6.7 Adjusting value by dragging left and right on the variable's word.\n\
    \n# Tips and Tricks\n\nGenerally, I find that dragging values can sometimes be\
    \ a little tricky (it either slides way too high too quickly or never seems to\
    \ move at all). A lot depends on the situation, but a quick way to work is to\
    \ drag the value higher or lower to get in the general neighborhood of the value\
    \ (and thus the look) that you are after. Then, for the fine-tuning, numerically\
    \ tweak the value to taste.\n\n# Wrapping Up\n\nThe screenshot in Figure 6.8 shows\
    \ the current results of water, fog, and background color adjustments made in\
    \ this tutorial. Notice that the water may be a different color than yours. This\
    \ comes from some tweaking made to the scene after all the previous steps were\
    \ complete. You should do this too to make the water look as you'd like."
  merge: -1
  img_proc: true
