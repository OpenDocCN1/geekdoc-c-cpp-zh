- pgno: 169
  md: '# Plan of Attack


    As implied in this chapter, the main focus will be on baking the lighting of the
    scene. This will actually take a few steps that build upon each other. First,
    before we start doing much lighting, we will look at some advanced shader construction—the
    use of Normal Maps, which will help to provide surfaces that appear bumpy (or
    not) and not just like flat objects with color on them. This advanced shader construction
    will come in handy as we look at Unity''s lighting scheme and how to control Unity''s
    lighting instruments.


    Finally, once some real-time lighting has been established we will look at baking
    strategies and settings to get a nicely baked lightmap that will look good in
    the game. Along the way, we will light the scene for a couple of different scenarios—first
    for a bright sunny day (since it allows the effects of light maps to be seen most
    clearly), and then for the dark, damp, and dismal day that the game actually calls
    for.


    # Tutorial 7.1: Normal Maps


    **Normal maps** are maps that help create more tactile-looking surfaces. Normal
    maps don''t actually change the polygons of a surface—they don''t really change
    the object they are attached to, but they present the visible representation of
    a more complex form. The grandfather of normal maps was bump maps, but normal
    maps are more powerful in some important ways.


    Bump maps were largely grayscale (or at least that was the only value that mattered
    to the 3D software rendering them). When the texture map that was used to define
    bump had pixels closer to white, they were rendered as raised and pixels close
    to black were rendered as receding. The power of this was that a surface looked
    as though it had all sorts of bumps and valleys when the geometry did not.


    Normal maps take this to the next level in that they use a similar idea, but instead
    of simply rendering the surface as raised or lowered in one direction, they describe
    the x, y, and z coordinates of a normal vector. The science and math here is well
    beyond what is relevant, but the net results are low-poly forms that are able
    to visually indicate much higher forms. The textures react to change in light
    and behave in believable and predictable ways as a player moves around them. In
    3D arenas where polycount is important (like games), normal maps are tremendously
    powerful.


    Historically, there are three ways that normal maps are usually created. The first
    is to actually model a very high-poly version of a surface (including characters)
    and then generate a normal map from that high-poly mesh that will be applied to
    a much lower-rez version of the form. In many ways this is most accurate, and
    frankly often produces the best normal maps. However,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'this essentially means creating the form twice, which can take some serious
    time. Although for characters that will be seen throughout a game, this could
    well be a worthwhile technique.


    The second method is to use some of the relatively new tools on the market (ZBrush
    or Mudbox) to paint normal maps. Essentially what these packages are doing is
    creating higher-resolution copies of a form that are sculpted (in some really
    fun ways) in these applications and then normal maps are generated and applied
    to their lower-resolution cousin. Especially for character work ZBrush and Mudbox
    are some really awesome tools. They have become ubiquitous in game character creation.
    If character design and creation are your thing, be sure to get your hands on
    one of these tools (I prefer Mudbox because it interfaces well into Maya, but
    there are fantastic results coming out of both packages).


    The third method is the method we will be exploring—extracting a normal map from
    a color map. Up to this point we have been defining a surface by the color attributes
    alone. A rock wall is painted to look like a rock wall. However, this painted
    rock wall is flat without any of the real peaks and valleys that such a wall would
    have from one rock to the next. This means that the still image might work out,
    but as a player walks up to and past the wall, there is never any of the visual
    clues that there are actually rocks coming out of that mortar.


    Because the color maps are complete, and because the raw versions of those color
    textures are carefully saved in the images folder of the Maya project file (Incursion–Maya),
    the core building blocks of this technique are at hand. A bit of time in Photoshop
    and a few additional tools will yield some reasonable normal maps.


    The drawback to using Photoshop to develop normal maps is that the creation is
    a little more opaque. Figure 7.1 shows what a bump map would look like as opposed
    to a normal map.


    ![](img/0285f88bc840f313779e011725b623a5_170_0.png)


    **FIGURE 7.1** Bump (top) vs. normal (bottom).'
  merge: -1
  img_proc: true
- pgno: 171
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/0285f88bc840f313779e011725b623a5_172_0.png)


    FIGURE 7.2  Raw version of the inner walls texture. Notice the complex collection
    of layers that will pay off here.


    # Tips and Tricks


    Remember that in the texture creation chapter (Chapter 4), whenever we built a
    texture we kept a copy of the construction texture in the images folder and a
    flattened version in the sourceimages folder (both within the Maya project folder).
    Keeping that raw version pays dividends in situations like this. Because all the
    dirt and drips are on separate layers, those can just be hidden to reveal the
    base texture beneath.


    If you are following exactly along with the tutorial and using the assets I use
    as provided on the web site (http://www.Creating3dGames.com), the file we are
    after, EntrywayWallsInnerUV, is in the images folder.


    # Cleaning up the Raw Texture


    **Step 3:** Hide all the grime, dirt, and drips layers. Do this in the Layers
    palette by just turning off the eye icon on the layers that are not wanted (Figure
    7.3).


    ![](img/0285f88bc840f313779e011725b623a5_172_1.png)


    FIGURE 7.3  Base texture without added dirt and grime'
