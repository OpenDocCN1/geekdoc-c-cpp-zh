- pgno: 477
  md: "**Why?**\n\nThis makes sure that the pistol and flashlight are turned on only\
    \ when they are called (i.e., in the ReadyFlashlight or ReadyPistol functions).\
    \ If we carefully turned them off in the editor before running the game, this\
    \ wouldn’t be a problem, but including this little code snippet helps protect\
    \ us against future carelessness.\n\n**Step 36:** Save and return to Unity. Fix\
    \ any syntax problems.\n\n**Step 37:** Turn on Flashlight, AC_Flashlight, and\
    \ AC_Pistol in the Hierarchy, select each of these objects and make sure they\
    \ are active in the Inspector.\n\n**Why?**\n\nOne of the potential drawbacks to\
    \ populating variables in Awake (or Start) functions with a GameObject.Find command\
    \ is that if an object is inactive, Unity can't find it. If the variable is a\
    \ public variable that is populated by dragging the item from the Hierarchy, this\
    \ isn't an issue. But with the method we're using here (private variables that\
    \ are populated with Find), we need to make sure that when the game starts the\
    \ objects are active to find. Remember that up in step 33, we immediately turn\
    \ them all off again, but Unity now has an understanding of what they are and\
    \ can reactivate them when told.\n\n**Step 38:** Select AegisChung_Arms_Prefab\
    \ and in the Animation component, turn off Play Automatically.\n\n**Why?**\n\n\
    Now we are carefully calling up when to play the animations of bringing up the\
    \ pistol and flashlight. Without turning off Play Automatically, the pistol would\
    \ always come up at the beginning of the game rather than when the player tells\
    \ it to.\n\n**Step 39:** Open AC_ToolFunctionalityScript.\n\n**Step 40:** Turn\
    \ off all the Booleans. Add the following lines to make sure that Unity knows\
    \ on start up that there are no tools active.\n\n```\nfunction Start()\n{\n  \
    \  pistolActive = false;\n    empathic = false;\n    empGhostActive = false;\n\
    \    flashlightActive = false;\n}\n```\n\n**Step 41:** Save and return to Unity.\
    \ Fix any syntax errors or typos.\n\n**Step 42:** Play and test. There is still\
    \ the pesky problem of the character looking up and to the left as the player\
    \ attempts to select a piece of inventory (which we’ll fix in a minute); but at\
    \ this point, the player should be able to activate any of the tools and they\
    \ should work."
  merge: -1
  img_proc: true
- pgno: 478
  md: '**Step 43:** Apply these changes to the prefab. With FPC_AegisChung selected
    in the Hierarchy, in the Inspector click the Apply button on the Prefab line.


    # **Why?**


    We want to make sure that all this work on the inventory system is functional
    in the Hallway too (and any other levels we create). By applying the changes to
    the prefab, we know that these new functionalities will work later as well.


    # Bulking up the GUI System


    We need to solve a couple of problems with our inventory system. First we don’t
    want it visible all the time; with it always there, it detracts from the immersive
    experience and the player assumes he can reach up and select a tool. The second
    problem is that we don’t want the mouse visible usually. It’d be necessary to
    have it visible when selecting tools, but it needs to go away when the game is
    running in noninventory mode. We’ll solve both of these problems by authoring
    a couple of new functions to show and hide the inventory.


    But before we go too far, let’s clean up, expand, and make a prefab of all our
    GUIElements to clean up our Hierarchy, and make the elements more easily accessible
    and reusable.


    **Step 44:** Create a new GUITexture (GameObject > Create Other > GUI Texture).
    Name it InventoryPrompt. Use ButtonInventory-Tab-Horizontal (from the Project
    panel’s 2D Assets) for the Texture. Change the Transform X = 0 and Transform Y
    = 1. Change the Pixel Inset to X = 0, Y = -32, Width = 256, Height = 32.


    # **Why?**


    This GUITexture will serve as the prompt to remind the player how to access the
    inventory.


    **Step 45:** Make InventoryButton_EMP, InventoryButton_Flashlight, and Inventory_Button_Pistol
    children of InventoryButton_Tab (in the Hierarchy, select these three GUITextures
    and drag them atop InventoryButton_Tab).


    # **Why?**


    We are going to use iTween’s MoveTo to move all the buttons on and off the map.
    By making the button all of one element (the InventoryButton_Tab), we can animate
    just the tab, and all the buttons will go with it.'
  merge: -1
  img_proc: true
- pgno: 479
  md: "**Step 46:** Create a new GUITexture, name it Crosshairs. Use the Crosshairs\
    \ texture from the project panel as the texture for the GUITexture. Leave the\
    \ Transform values as is, but change the Pixel Inset values to X = -16, Y = -16,\
    \ Width = 32, Height = 32.\n\n# Why?\n\nYeah, you're right. We made one of these\
    \ back in the Hallway. We're going to delete that one eventually. The idea is\
    \ that now that we've determined the GUI elements for the game, we'll assemble\
    \ them all there and be able to use them again and again as a prefab.\n\n> **Warnings\
    \ and Pitfalls**\n> \n> It's VERY important that the Transform values for Position\
    \ and Rotation are 0. If they are not, when they become the parents of the GUI\
    \ elements, all sorts of things will go awry as the children will need to change\
    \ their Position and Rotation to account for their parent.\n\n**Step 47:** Create\
    \ a new empty GameObject (GameObject>Create Empty). Name it GUIElements. Make\
    \ sure its Transform Position and Rotation values are all 0.\n\n**Step 48:** Make\
    \ Crosshairs, EntryWayTextHints, InventoryButton_Tab (with its children), and\
    \ InventoryPrompt all children of GUIElements (Figure 16.4).\n\n![](img/0285f88bc840f313779e011725b623a5_479_0.png)\n\
    \n*FIGURE 16.4*  All the GUIElements grouped under one GameObject, ready to be\
    \ made into a prefab.\n\n**Step 49:** Rename EntryWayTextHints to just GUITextHints.\n\
    \n**Step 50:** Open the script EntryWayTextTriggerScript.\n\n**Step 51:** Change\
    \ the guiTextObject = GameObject.Find line to read:\n\n```\nfunction Awake()\n\
    \    guiTextObject = GameObject.Find(\"GUITextHints\");\n}\n```\n\n# Why?\n\n\
    We renamed an object. Since we were finding that object via a GameObject.Find\
    \ command, we've got to make sure and change the script.\n\n**Step 52:** Save\
    \ and return to Unity. Fix any syntax problems.\n\n# Create a GUIElements Prefab\n\
    \n**Step 53:** In the Project panel, choose Create>Prefab. Rename the new prefab\
    \ GUIElements. This can be placed within a folder if you are organizing your prefabs\
