- pgno: 122
  md: 'The **Materials** folder is new since the EntryWay.fbx was imported. When Unity
    imported the .fbx and understood what it was, it created this folder and in it
    are all the materials that Unity has applied to the polygon meshes you built in
    Maya. We will be adjusting the attributes of these materials as time goes on.
    Generally, there is little need to mess with this folder or its organization.


    The **EntryWay.fbm** folder is the result (and benefit) of manually exporting
    the .fbx file from Maya. In this folder are all the texture files created for
    use in Maya. These specifically are the texture files that are used on the geometry
    contained in EntryWay.fbx.


    **EntryWay** with its unique icon is the **Prefab** of the imported Maya .fbx.
    This is the model created in Maya with the materials attached to the meshes. To
    understand what this is, we need to talk nomenclature for a minute.


    # # Unity Nomenclature


    # ## GameObject


    **GameObjects** are essentially things in your scene—anything that is in the scene
    is a GameObject. GameObjects can be thought of as containers; they can contain
    all sorts of components including cameras, lights, geometry, audio sources, audio
    listeners, and so on. GameObjects can hold lots of components at once. For instance,
    look at the Hierarchy panel of the scene and there is a Main Camera object there.
    This is a GameObject with a Camera component on it. If the Main Camera is selected
    in the Hierarchy panel, the Inspector will show all the components that are actually
    attached to this GameObject (including an Audio Listener).


    Sometimes, certain GameObjects include other important items like geometry. Looking
    at the Project panel, the prefab EntryWay is a type of GameObject that includes
    meshes with attached materials.


    # ## Prefabs


    **Prefabs** are GameObjects that can be reused. Sometimes these prefabs contain
    meshes, as EntryWay does, but they can also contain other types of components
    (audio, texture, text, particles, etc.). When prefabs are dragged into the Hierarchy
    panel (or into the Scene view, which also then populates the Hierarchy panel),
    an instance or copy is made in the scene. Multiple instances can be placed in
    the scene, and if the original prefab is ever altered the changes inherit down
    to all the instances placed within the scene.


    # ## Scenes


    Unity thinks of **Scenes** in the same way that Maya does. A Unity scene file
    will contain lots of different assembled assets. Any particular game may contain
    several scenes that the player passes through over the course of the game. A scene
    can contain a single prefab, or many. Often multiple scenes can make for'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'a quicker startup to a game (since the starting scene does not contain the
    entire game, but means that there are loads as the player moves through the game.
    Currently in our tutorial, we do not have a Unity scene saved yet but we soon
    will.


    Now that we know a bit about what is in the Unity project, we can start assembling
    and tweaking a Unity scene.


    # Tutorial 5.3: Importing, Tweaking, and Placing Scenography Assets into Unity


    **Step 1:** Save a Unity scene. Choose File > Save Scene. In the Save Scene dialog
    box, name the scene Scene-EntryWay and Save.


    # Why?


    Before we start creating or assembling things, saving the scene where things are
    going will speed up the process. Saving often is always a good idea, and being
    able to quickly press Ctrl-S or Command-S to save allows for a minimal amount
    of work to be lost.


    # Tips and Tricks


    Notice that by default Unity points to the Assets folder within the project file.
    At this point, saving the Unity scene right to the Assets folder will be fine,
    and leaving EntryWay and EntryWay.fbm at the Assets folder level is no problem.
    However later it will be important to start organizing assets.


    # Why?


    Notice that once a scene is saved to the Assets folder, a new asset will appear
    in the Project panel. This will have the Unity logo as its icon to indicate that
    indeed this is a Unity Scene file.


    **Step 2:** Delete the Main Camera. In the Hierarchy panel, select Main Camera
    and press Delete on the keyboard.


    # Why?


    Main Camera in this case is a pretty useless GameObject. Yes, it would allow us
    to see the model in the game, but it gives us no information on scale and it can''t
    even be moved in its present state in the game. Deleting it will make room for
    the kinds of camera and control that is needed.


    **Step 3:** Place a First Person Controller into the scene. In the Project panel,
    expand the Standard Assets Folder and then the Character Controllers folder. Drag
    the First Person Controller prefab from the Project panel into the Hierarchy panel.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# **Why?**


    By moving the asset from the Project panel (our library) to the Hierarchy panel,
    the prefab First Person Controller has been placed into the game. Alternatively,
    this could have been done by dragging the First Person Controller prefab into
    the Scene window.


    # **Why?**


    So why place the First Person Controller now when there is nothing for it to do?
    This is a good question and an important part of the scaling process. The First
    Person Controller prefab has some important information such as size. If the First
    Person Controller instance is selected in the Hierarchy panel, the Inspector panel
    will show the attributes of the instance. Note that the height of the Character
    Controller is 2 (meters).


    This is important because now there is a guideline object to help us understand
    how big the later-placed objects should be. As other assets are placed in the
    Unity scene, they will be scaled around the First Person Controller. Although
    this may seem counterintuitive—it seems like it would be easier to scale the controller
    to fit the scene—this ensures that the scale of the objects is appropriate for
    the world scale. This is particularly critical for functions like physics. If
    the objects in the scene are very large or very small, the physics simulations
    will always appear off.


    **Step 4:** Move the First Person Controller instance to 0,1,0. Select the First
    Person Controller instance in the Hierarchy panel. Then in the Inspector, look
    to the Transform component and change the Position X=0, Y=1, Z=0.


    # **Why?**


    By placing the First Person Controller at 0,1,0 we are placing it at the world
    center with the bottom of the controller on the ground (it''s 2 units high with
    its center at the geometric center so Y=1 puts its bottom on the "ground").


    **Step 5:** Center the First Person Controller in the Scene window. Still with
    the First Person Controller selected in the Hierarchy panel, press F on the keyboard.
    This will center the selected element (First Person Controller) in the Scene window.


    **Step 6:** Place the EntryWay prefab into the scene. This time, drag the prefab
    EntryWay from the Project panel into the Scene window.


    **Step 7:** Place the EntryWay instance at 0,0,0 in the world space. In the Hierarchy
    panel, select the EntryWay instance and in the Inspector set the Position X,Y,Z
    to 0 (Figure 5.7).'
  merge: -1
  img_proc: true
- pgno: 125
  md: '**FIGURE 5.7** Imported and placed First Person Controller and EntryWay (your
    results may be a bit different). Not quite right yet, eh?


    ![](img/0285f88bc840f313779e011725b623a5_125_0.png)


    # ### Why?


    When there is little in the scene, moving prefabs into the scene can be a strange
    experience. It is very tough to understand where an object is in world space or
    even how big the object is within that space. By moving both the First Person
    Controller and EntryWay to world center, we can get a good view of what the size
    is of the imported elements.


    **Step 8:** Scale EntryWay to fit appropriately in the scene. To do this, tweak
    the EntryWay prefab''s import settings. In the Project panel, click once on EntryWay.
    This will open the EntryWay''s characteristics in the Inspector. Specifically,
    in the FBXImporter section, the Inspector will show the settings Unity used when
    importing EntryWay.fbx into the Unity project. Change the Scale Factor to .5 and
    press the Apply button. Now adjust the Scale Factor as needed (Figure 5.8).


    **FIGURE 5.8** Scaled EntryWay. For this example the setting of 0.5 was the best.
    This may be different in your scene.


    ![](img/0285f88bc840f313779e011725b623a5_125_1.png)


    # ### Why?


    Why not simply scale the object in the Scene view? In many cases, that would be
    perfectly acceptable, and actually in this case that would work since the EntryWay
    prefab is likely to be used only once. However, when a prefab is going to be used
    a lot of times, it is best to adjust the Scale Factor'
  merge: -1
