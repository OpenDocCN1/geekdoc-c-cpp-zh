- pgno: 90
  md: '![](img/0285f88bc840f313779e011725b623a5_90_0.png)


    **FIGURE 4.3** Offset and the results.


    # Why?


    The problem with any image and trying to make it seamless is getting to the seams.
    The seams are the edges of the image. The Offset with the Wrap Around option activated
    does some important things for us. First, it offsets or slides all the pixels
    over (and/or down) and then wraps the pixels that it slides off the edge of the
    canvas around to the other side of the image. This means two important things.
    First, after the Offset filter has been applied, the right edge of the image matches
    seamlessly to the left edge of the image and the top and the bottom match as well.
    Second, it takes the old edges (the old seams) and puts them right in the middle
    of the scene where we can deal with them.


    **Step 4:** Clone Stamp out the seams. The Clone Stamp is an incredibly powerful
    tool that allows for interactively painting the pixels from one part of an image
    to another. To use it, select it from the Photoshop tool bar, then hold the Alt
    (Option on a Mac) and click the area where the pixels are to be pulled from. Release
    the Alt and mouse, and then go and paint where the pixels are to be painted (in
    this case the seams in the middle of the image). The results are seen in Figure
    4.4.


    ![](img/0285f88bc840f313779e011725b623a5_90_1.png)


    **FIGURE 4.4** Clone Stamped image.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# **Warnings and Pitfalls**


    While working out seams, watch out for areas that might be too conspicuous when
    repeated. For instance look at Figure 4-4; notice the dark black splotch. When
    repeated 20 times across a surface, this splotch will be very problematic. Use
    the Clone Stamp tool to get rid of (or at least minimize) these sorts of blemishes.


    # **Tips and Tricks**


    The [ and ] keys will change the size of the brush (bigger and smaller). Often
    this is an important step in effective seam working. Make sure to have control
    of the brush size.


    # **Tips and Tricks**


    The Clone Stamp tool has several options that (in CS5) show up at the top of the
    Photoshop interface. NEVER paint with Opacity and Flow both at 100 percent. The
    texture will become a blotchy mess very quickly, and will begin to show features
    too frequently, in effect reducing the visual information available in the texture.
    I like to paint with a Flow value of around 10 percent, which allows me to gently
    layer pixels onto a seam and through the combination with the pixels beneath,
    make an area that doesn''t exist anywhere else on the texture. Think of the process
    as massaging the seam out, not painting it out.


    # **Warnings and Pitfalls**


    This is not a trivial issue. Save this bad boy in the sourceimages folder. For
    further ratings on the importance of Maya projects see the previous chapters.


    **Step 5: Save.** File>Save and name the file `Entryway_DockColor`. Be sure to
    save it in the *sourceimages* folder of the project file.


    # **Tips and Tricks**


    The file format is not terribly important. Maya reads most image formats, although
    it can get pretty persnickety about .psd files if using Mental Ray. Unity, on
    the other hand, reads most anything. Since my original was a .jpg, I am saving
    it as a .jpg as well. But if there is a lot of layer action going on, don''t shy
    away from .psd. Unity will keep the original multilayered .psd file, and import
    it as a flattened image.


    # ## Unify the Color Balance


    **Step 6:** Run a High Pass filter on the image. Filter>Other>High Pass will open
    a dialog box. Within this dialog box, drag the Radius slider to the far right
    (250 pixels). This will make the image look quite gray (Figure 4.5).


    # ### Why?


    Often, when sampling an image or cropping, the image looks fine until it is offset.
    Then the gentle gradients that are often visible in textures becomes apparent.
    Suddenly, when the left side of the image lines up with the right side of the
    image, the colors there can be totally different. This process allows for the
    unification of the color fields. The High Pass filter desaturates much of the
    colors, but leaves a data set that will work well with the coming steps.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/0285f88bc840f313779e011725b623a5_92_0.png)


    Figure 4.5. Results of the High Pass filter.


    **Step 7:** With EntryWay..._DockColor still open, choose File>Open and open the
    original file used as the base texture (in my case ConcreteBare0312_S). This will
    become our source image.


    **Step 8:** Go back to EntryWay..._DockColor (Window > EntryWay..._DockColor).


    **Step 9:** Match color, choose Image>Adjustments>Match Color. At the bottom of
    the Match Color dialog box, choose ConcreteBare0312_S (or your image) in the Source
    drop-down menu. Press OK (Figure 4.6).


    ![](img/0285f88bc840f313779e011725b623a5_92_1.png)


    Figure 4.6. Matching color to unify texture''s color fields.


    **Step 10:** Test the texture in Photoshop. Do this by again selecting Filter>Other>Offset
    and moving the sliders around to all sorts of different values. The result should
    remain seamless; the seams that once were there should never be seen.


    **Step 11:** When satisfied, save.


    # Apply the Texture


    **Step 12:** Open Maya (make sure the project is appropriately set) and open EntryWay.mb.'
