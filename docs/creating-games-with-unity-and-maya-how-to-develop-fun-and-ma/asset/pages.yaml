- pgno: 200
  md: '![](img/0285f88bc840f313779e011725b623a5_200_0.png)


    # # Asset Creation:

    ## Maya Character Creation


    Depending on the type of game being played, the character design can be as important
    as the set. Standard third-person games mean that there is lots of looking at
    the back of yourself as the space is explored. Because this is the case, having
    a really well-designed protagonist (and more specifically, a protagonist with
    a well-designed back) becomes incredibly important to the visual impact of the
    game. Even in first-person games (like *Incursion* will be), having enemy characters
    that are interesting in design, beautiful (that includes gross) in texture, and
    dynamic in motion can make a huge difference in the level of engagement and visceral
    experience of the player.


    In *Incursion*, the primary Play mode is going to be first person, which means
    that the player will hardly ever be seen (other than the hands when holding a
    weapon or tool). In fact, in a first-person situation, there may not ever be a
    need to develop a character (unless the game is multiplayer). But character creation
    is an art with some specific topology issues that should be covered in any discussion
    of game asset creation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Because of this, in this chapter we will be modeling and texturing the player''s
    character in *Incursion*. This character will be used in the opening screen and
    will be animated. This also means that this character is available if the game
    ends up (in your able hands) morphing into a third-person game or a multiplayer
    game.


    # Aegis Chung


    The player''s character is Aegis Chung, who is part of the US Government''s Special-Ops
    Forces (or any imaginary government agency of your choosing). The specifics of
    this character would be found in the design document that would help define how
    the character should be designed. For this book, these conversations occurred
    between the character designer (Jake Green; www.jakegreenanimation.com) and the
    game designer (me). The design we settled on is shown in Figure 8.1.


    # Style Sheet


    Character style sheets are an important part of the character design process—they
    define what a character will look like from at least a front and side view. Really
    accurate design sheets can be used as reference and the 3D model can be constructed
    right over the top of the drawing within Maya (or whatever the 3D application
    might be). Occasionally I will work with a student who can


    ![](img/0285f88bc840f313779e011725b623a5_201_0.png)


    FIGURE 8.1 Aegis Chung (design by Jake Green; www.jakegreenanimation.com).'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'create a character in 3D effectively without visualizing it first in 2D—on
    paper. But overwhelmingly, the students who build the best models are working
    from a well-designed character style sheet. In studios this is especially the
    case since a character design on paper is much quicker and much cheaper to create,
    approve, or send back for revision than one created in 3D.


    This doesn''t mean that character modelers are necessarily good character designers,
    or the other way around. Some of the best characters developed in class have been
    designed by one student and modeled by another; however, the language of visual
    communication has been that character style sheet.


    # Considerations of Style Sheets


    The best style sheets will often begin on graph paper. This is because having
    the front and side views match up exactly is key. When the bottom of the nose
    is at the exact same height in both images, when the polygons that define that
    area are being constructed, the two images will help inform how those polygons
    will need to be assembled. Conversely, if any area of the face is slightly off,
    referencing the image can be murderously confusing in the modeling process.


    However, just drawing the two images (front and side) lined up is just half the
    battle. After scanning in the image, be sure to use Photoshop''s guides to assure
    that the image is still lined up. Get in close, very close, and make sure that
    the nose; eyes; tops and bottoms of ears; tops, middle, and bottom of lips; knees;
    crotch; and armpits are lined up correctly. A few extra minutes in Photoshop will
    save hours modeling. For further details on this preparation process see Appendix
    C, "Preparing Character Style Sheets."


    Arm position is often a contentious issue in the 3D community. Some people insist
    on modeling characters in the T pose (arms straight out). The reason for this
    often has to do with rigging and skinning. It is definitely easier to skin an
    arm pit when it is easily seen because the arms are at the side of the body. Here''s
    the reason I prefer not to use this: put your arm straight out and with the other
    arm feel what occurs at the top of your shoulder (your deltoid). There is a lot
    of compression of that muscle and indeed the entire shoulder deforms with a big
    bulge of muscle there. However, this bulge of muscle disappears when your arm
    is returned to your side. Modeling a character with arms outstretched then leaves
    the modeler with an impossible choice—either model the shoulder incorrectly when
    it is outstretched, or be left with a bulbous shoulder that is incorrect once
    the character is rigged, skinned, and the arm is back at the side. You have probably
    seen this sort of 3D character that seems to be in a perpetual shrug;


    I prefer to model characters with their arms either at their side or at a 45-degree
    angle to their body. Yes, it does make skinning the armpit a bit more difficult
    since there are a lot of polygons next to each other, but since skinning tools
    have become more effective this is not as big a deal as it once was. The benefit
    is that this allows the shoulders to be modeled in the form that they usually
    are in—down and relaxed with the deltoids not compressed and balled up.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# ## Chapter Overview


    In this chapter we will be using the character style sheet of Aegis Chung as designed
    and created by Jake Green to model, UV map, and texture the game character. The
    image is downloadable on the accompanying website (http://www.Creating3DGames.com),
    although you might want to use your own design if you have one that is better.
    Note that the Photoshop work of ensuring that the front and side images are lined
    up has been done and these drawings are reasonably close. So, if you are going
    to use your own, make sure you do the appropriate prep work.


    # ## Tutorial 8.1: Game Character Modeling: Aegis Chung


    As is the case in most of 3D, there are many ways to skin this cat. There are
    almost as many methods of organic modeling as there are organic modelers. The
    method we are going to use here is based upon the idea that most muscles in our
    face tend to ring the orifice they manipulate. There are rings of muscles around
    the eye and mouth. By creating polygons in rings around these objects the forms
    are easier to find, and more importantly, the area can deform in a more lifelike
    manner.


    This is largely an additive method then. The method will start with a single polygon,
    and the additional polygons will be extruded out from that.


    As always, polycount will be important. Knowing how many extrusions to make and
    how close to make them can be a tricky thing and is largely informed by experience.
    It is not too hard to go back and eliminate unwanted rings. Similarly, it is fairly
    easy to go back and add rings if added detail is needed. So as the forms are built,
    use the screenshots as a rough guide to the density of polygons, but don''t sweat
    it.


    # ### Polycount


    For this character we will be aiming at the 15,000 tri mark. If there were going
    to be 300 of this character on the screen at a time, this is likely too high.
    If this is the only character to ever be seen we could probably go higher. But
    15,000 is a very reasonable count with most hardware today and will allow for
    a good balance of efficient modeling with engaging detail.


    # ### Image Planes in Photoshop


    **Step 1:** Prepare resource image in Photoshop. If you are using the preprepared
    images contained in the downloadable files on the resource web site (http://www.Creating3DGames.com),
    you''re set. There are four images of note: AC_Front_Body, AC_Side_Body (both
    full body images), AC_Front_Head, and AC_Side_Head (just head shots). If you''re
    using your own, be sure to review the steps in Appendix C, “Preparing Character
    Style Sheets.” At the end, be sure to have two separate files, a Front view of
    the character and a Side view. Save the files that will be used for reference
    in the sourceimages folder.'
  merge: -1
  img_proc: true
- pgno: 204
