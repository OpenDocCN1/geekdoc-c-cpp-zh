  md: '# # Acknowledgments


    Books like this are the results of a lot of work by a lot of people. It is important
    to point them out.


    First, many thanks to Kelly Michel and the team at the Los Alamos National Laboratory
    that made working on this book possible. The opportunities to learn and grow have
    been exciting to me professionally, and I''ve personally very much enjoyed my
    time working with my teammates Brian Dickens, Elise Elfman, Jake Green, and Birch
    Hayes.


    Also, thanks to the tireless efforts of my tech editor, Anson Call; the book is
    more accurate, and tighter conceptually than it would have been without his meticulous
    work.


    Thanks also, of course, to the editors at Focal with whom I have worked on the
    project: Sara Scott, Laura Lewin, Katy Spencer, and Lauren Mattos.


    Finally, working on books is always a bit of an exercise in patience by the family
    of the author. This round, the patience of my forever friend Kirsten and her care
    of the little peeps has been of unimaginable help.'
