    **Step 12:** Test the game. As the player walks up to the key (inside the large
    dome-like room) or the power closet (down the long hall and in the closet to the
    left of the loading bay), the objects should highlight bright white as the crosshairs
    go over them (Figures 14.7 and 14.8).


