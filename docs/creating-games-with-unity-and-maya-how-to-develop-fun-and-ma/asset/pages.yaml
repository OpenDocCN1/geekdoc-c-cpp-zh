    # ### Why?


    And just like that all the cameras in the level can “see.” Quick and powerful
    prefabs are. Next—tags.


    # ## Tags


    Thus far, our scripts have identified objects by their names (hit.collider.gameObject.name
    == "Object''s Name"). There is something direct about this method because we have
    the script looking directly for something solely based upon the name we typed.
    However, this can also be fairly brittle as well. Especially during the prototyping
    process, objects can very easily end up renamed in either Maya or Unity to help
    suit this artist or that scripter. If this happens, all the scripts that are looking
    for that object by name break. It can be pretty icky trying to track down which
    script called for that object by name, especially if you don’t know what the name
    was. Alternatively, Unity can compare other attributes as well. One of my favorites
    is to compare an object’s tag.


    When any GameObject is selected in the Hierarchy, the Inspector will allow for
    the object to be given a tag and/or assigned to a layer. By default the tag on
    objects is set to Untagged. To assign a tag to an object, just use the drop-down
    menu next to the tag in the Inspector (Figure 15.7). While we’re


    **FIGURE 15.7** Assigning a tag to an object.


    ![](img/0285f88bc840f313779e011725b623a5_429_1.png)'
  merge: -1
  img_proc: true
- pgno: 430
  md: "![](img/0285f88bc840f313779e011725b623a5_430_0.png)\n\nhere, it's worthwhile\
    \ to point out that custom tags can be created as well. Just select Add Tag…from\
    \ the Tag drop-down menu, and the Inspector will appear like Figure 15.8 where\
    \ the user can define a new tag name.\n\nSo the power of this idea is that a script\
    \ can look for objects with a matching tag (say \"Player\"). So the main character\
    \ can be called Fred at the beginning of development, Aegis midway, and be Janine\
    \ when it's finally ready to be built, and as long as all three are tagged as\
    \ Player, the script referencing it never breaks throughout the development process.\n\
    \n+   - **Step 9:** In the Inspector panel, give First Person Controller a Player\
    \ tag.\n+   - **Step 10:** Make our camera searching script watch specifically\
    \ for objects whose tag is Player; if the ray strikes an object whose tag is \"\
    Player,\" change the LED to red (RGB value is 1,0,0);\n\n```\nfunction Update\
    \ () {\n    var hit : RaycastHit;\n    if (Physics.Raycast (transform.position,\
    \ transform\n    .forward, hit, 100)){\n        Debug.DrawLine (transform.position,\
    \ hit.point,\nColor.yellow);\n        if (hit.collider.gameObject.tag == \"Player\"\
    ){\n            renderer.material.color = Color (1,0,0);\n        }\n    }\n}\n\
    ```\n\n**Why?**\nThis should look a little familiar. Instead of checking for name,\
    \ hit.collider.gameObject.tag is checking for the tag. If they match, it takes\
    \ the renderer.material.color of the object this script is attached to (which\
    \ is the LED) and changes the color values to R = 1, G = 0, B = 0.\n\n+   - **Step\
    \ 11:** Save and return to Unity. Fix any syntax errors pointed out in the Console.\n\
    +   - **Step 12:** Test. Walk through any part of the level and as the camera\
    \ \"sees\" you, the LED on the top of the camera will change to red (Figure 15.9)."
