- pgno: 393
  md: '# Why?


    This might seem like a blast from the distant past, but when we were baking lighting,
    we marked objects or entire levels as Static. If an object is not marked as Static
    it won''t be included in the baking. However, if it is marked as Static, Unity
    assumes that it''s unmoving, that it''s, well, static. Luckily, an object can
    be marked as Static and used in baking, but be dynamic later (as in this case)
    by just turning the Static option off after baking.


    +   - **Step 13:** Test. Play the game and walk through that trigger and see if
    the timing is good. If the values of how far the door opens or the timing is not
    to your liking, adjust in the script.

    +   - **Step 14:** Turn off the Mesh Renderer for the trigger Trigger-BulkheadDoor1.


    # Sound and Scripts


    The door should now open for us as we approach, but it''s fairly creepy (and unrealistic)
    that it produces no sound as this door in an old sealed-up base opens. In this
    section we will add sound to the door and trigger it with our already extant script.


    +   - **Step 15:** On the web, track down a sound clip that you think would be
    appropriate for this big door. I used “elevator door opening.wav” from FreeSound.org.
    Edit any unnecessary dead noise at the beginning or end of the sound (Audacity
    will do this quickly if you haven''t any other sound application).

    +   - **Step 16:** Import it to your Sounds folder by dragging it there in the
    operating system.

    +   - **Step 17:** Create an empty GameObject (GameObject>Create Empty). Name
    it Sound-DoorOpenBulkhead1. Position it near where the opening door is. Drag the
    sound clip from the Project panel to this GameObject so that it contains an Audio
    Source component.


    # Why?


    Potentially this could also be attached to the character, but by actually placing
    it near where the sound would be emitting, we get the benefits of Unity''s positionally
    aware sound system.


    +   - **Step 18:** Turn off the Play on Awake option within the Audio Source component.


    # Why?


    By not playing on awake, the audio source stays silent until we ask it to play
    sound (which we will do in just a bit).'
  merge: -1
  img_proc: true
- pgno: 394
  md: "**Step 19:** Open the HallwayDoorsTriggerScript.\n\n**Step 20:** Add a variable\
    \ to store the object that emits the sound and a line to play it. Note that there\
    \ are two lines in italics here:\n\n```\nvar door : GameObject;\nvar doorOpenSound\
    \ : GameObject;\n\nfunction OnTriggerEnter (other:Collider)\n{\n    if(when.RotateTo(door,\
    \ Vector3(0,-120.0), 5.0);\n        doorOpenSound.audio.Play();\n}\n```\n\n> **Why?**\n\
    > \n> The public variable declaration allows us to define (for each trigger down\
    \ the road) the actual door that the sound belongs to (and it can be a different\
    \ sound for each door). The last line of code there says, “go find the sound,\
    \ find the audio attached to it, and play it.”\n\n+   1. **Step 21:** Save and\
    \ return to Unity. Fix any syntax errors that pop up in the console. Populate\
    \ the Door variable for the script by dragging the door that is to open from the\
    \ Hierarchy view to the variable entry in the Inspector.\n+   2. **Step 22:**\
    \ Test. Make any adjustments to the Audio Source component that you feel is needed\
    \ to make the sound softer/louder, and so on.\n\n# Cleaning Up with Destroy and\
    \ Booleans\n\nSo the sound now runs as the door opens. The only problem here is\
    \ that the trigger is still sitting there. Now, if part of the game included shutting\
    \ the door as well, this could be good as the trigger could check the state of\
    \ the door and close it if were open when we passed through it again. However,\
    \ in this case, there is little need for this trigger since the door doesn't do\
    \ anything else after this. With just a little bit of extra code we can get rid\
    \ of elements (GameObjects and or components) that we simply won't have need of\
    \ later in the game. This keeps the game snappy because Unity has less to keep\
    \ track of, and importantly makes sure that these triggers aren't used later.\n\
    \nBut, sometimes we might not want to destroy a trigger. Perhaps there are times\
    \ when the trigger is meant to play a thump or something every time the player\
    \ walks up to it (for instance a locked door). It would do no good to destroy\
    \ the trigger after our first approach. So in our script we'll build in a switch\
    \ that allows us to tell the script on a case by case basis if it's to destroy\
    \ the trigger or not.\n\nBooleans are either true or false; think of them as a\
    \ switch. They can keep track of whether a state of being is true or false. Once\
    \ this state is remembered or available, scripts can check with it to see if they\
    \ should execute a particular task based upon the Boolean state."
  merge: -1
  img_proc: true
- pgno: 395
  md: "# **Step 23:** Add the mechanism to destroy both the sound and the trigger.\n\
    \nFor HallwayDoorsTriggerScript add (in italics):\n\n```\n```text\nvar door :\
    \ GameObject;\nvar doorOpenSound : GameObject;\n\nfunction OnTriggerEnter (other:Collider){\n\
    \    iTween.RotateTo(door, Vector3(0, -120.0), 5.0);\n    doorOpenSound.audio.Play();\n\
    \    Destroy (doorOpenSound);\n    Destroy (gameObject);\n}\n```\n```\n\n# Why?\n\
    \nThe first destroy destroys the GameObject that contains the sound (that we declared\
    \ at the top of the script and populate in the editor). The second destroy destroys\
    \ the GameObject that this script is attached to, which in this case is the trigger.\n\
    \n# **Step 24:** Make the destroy wait—specifically wait for the duration of the\
    \ sound clip before destroying things. Add the following line:\n\n```\n```text\n\
    var door : GameObject;\nvar doorOpenSound : GameObject;\n\nfunction OnTriggerEnter\
    \ (other:Collider){\n    iTween.RotateTo(door, Vector3(0, -120.0), 5.0);\n   \
    \ doorOpenSound.audio.Play();\n    yield WaitForSeconds (doorOpenSound.audio.clip.length);\n\
    \    Destroy (doorOpenSound);\n    Destroy (gameObject);\n}\n```\n```\n\n# Why?\n\
    \nWithout our yield statement, the sound wouldn't be heard at all. Looking at\
    \ the script in step 21 shows a script that destroys the sound object immediately\
    \ after telling it to play—thus the sound would be gone before we get a chance\
    \ to enjoy it. Yield in JavaScript means \"wait\" or \"allow something to finish\
    \ first.\" In this case we are using yield to wait for a specific duration of\
    \ time (WaitForSeconds). The seconds that this waits for can be defined with a\
    \ simple integer (for instance: yield WaitForSeconds (3); would wait for three\
    \ seconds before executing the next step). However, we want this script to be\
    \ more flexible so it can be used with different situations and sounds. So we\
    \ tell it to check out the length of the audio clip attached to doorOpenSound\
    \ (doorOpenSound.audio.clip.length) and wait that long."
  merge: -1
  img_proc: true
