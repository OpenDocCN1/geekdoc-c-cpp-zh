- pgno: 240
  md: '![](img/0285f88bc840f313779e011725b623a5_240_0.png)


    **FIGURE 8.64** Extruding out base of fingers. Be sure to turn off Keep Faces
    Together before extruding.


    **Step 82:** Add an extra loop around the palm for additional shape and then extrude
    out the thumb. Go back up to the nub created in step 79 and begin extruding out
    the polys that will form the thumb (Figure 8.65).


    ![](img/0285f88bc840f313779e011725b623a5_240_1.png)


    **FIGURE 8.65** Beginning of the thumb.


    **Step 83:** With the new faces that define the fingers and thumb, pull out the
    rough shape for all the digits.


    **Step 84:** Add additional edge loop to allow for roundness of fingers. Do this
    with the Insert Edge Loop tool and click the edge of any side of the finger (Figure
    8.66).'
