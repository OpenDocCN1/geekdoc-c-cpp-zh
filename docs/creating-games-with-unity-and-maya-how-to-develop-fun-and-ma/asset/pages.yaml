- pgno: 84
  md: '![](img/0285f88bc840f313779e011725b623a5_84_0.png)


    # # Asset Creation: Maya Scenography Texturing


    # ## Textures, Materials, and Shaders


    Now that you''ve paid the price of UV mapping you''re ready to dive into the fun
    part of creating the visual impact of a scenography element—the color and visual
    tactile elements called "texturing."


    There are a lot of terms that sometimes get thrown around when talking about adding
    visual information to your gray (or in our case, checkered) set. But technically
    there are some very real meanings to these terms that shouldn''t get confused.


    **Textures** are really images; they can be photos or painted images. Textures
    are 2D elements that define a particular attribute of a **material**. Textures
    can be used to define a material''s color or visual tactile elements like bump.
    When a material is applied to an object, a **shader** is used to show how this
    material will react to light and the viewer''s angle of view. When someone says
    they are "texturing" a scene, they usually mean they are creating materials by
    assembling textures that will be applied to geometry that when lit will reveal
    what can be visually sophisticated forms.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# # Nature of Effective Textures


    Not all textures are created equal. Some textures (image files) are simply easier
    to envision in a 3D and texture space. Further, and importantly, some textures
    draw faster, which in game design is a critical consideration.


    # ## Be Square


    When we were working on the UV layouts, we were working in the top-right quadrant
    of the UV texture space. Notice that this quadrant is square. If any textures
    are imported into a material in Maya, it will still show up square within this
    space. Because of this, it is generally easier to visualize textures by working
    with square images. Although materials can be deformed (squash them for instance),
    we went through great effort to create perfectly squared checks when doing the
    UV layout. This means that we are assuming the texture is not deformed and the
    results will be much more predictable.


    It is important to notice, however, that texture within Maya (or within Unity)
    do not have to be square. And there may be times when an oblong texture makes
    the most sense (a long wall for example); however, Maya will still show it as
    a square image within the UV Texture Editor. So in most cases it just makes the
    creation process easier for beginners if they see the texture undistorted.


    # ## Power of Two


    Video cards draw certain assets quicker than other. Part of this has to do with
    how computer hardware is able to package information. Start with 1 and multiply
    it by 2 and in turn multiply each result by 2 and a sequence of numbers will emerge
    like this: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, and so on.
    These values are referred to as **power of two (POT)**. Textures work most efficiently
    if their pixel measurements are one of these packaged values. So if we are working
    with square textures, think 256×256, 512×512, 1024×1024, 2048×2048, or even 4096×4096.


    There was a time not long ago when video cards could not display textures that
    were not a power of two texture. Most video cards today have some strategy to
    deal with this; however, this almost always includes some sort of resampling the
    texture into a power of two texture. This means valuable horsepower is being wasted
    converting a 300×300 texture down to a 256×256. This waste of processing power
    usually results in lower frame rates and slower game play.


    Maya will happily take any size texture thrown at it with nary a complaint, which
    can lead to a false sense of security. Additionally, new to Unity 3, Unity will
    take non-power-of-two textures without griping, either—in fact it won''t even
    alert you (unless you look in the Inspector for each texture) that it''s taken
    in non-power-of-two textures and what it''s doing'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'with them. However, behind the curtain, Unity is quietly converting the non-power-of-two
    textures in power of two versions. In Unity 2.x and earlier, Unity had to be told
    to do this, but now Unity assumes you mean to and chunks you want to import depending
    the files into the size that they will work fastest with.


    However, resampling an image that is just off of power of two (say 520/520) down
    to 512/512 can lead to muddy images. It can be tough for software to know exactly
    which pixels to leave out as they resize down, or which pixels to double when
    resizing up.


    Ultimately, creating textures as power-of-two texture will yield time-saving results
    on import and create crisper images that MIP Map (more on this later) better and
    play quicker on all video cards.


    # Seamless Textures


    Some of the UV Mapping we have completed works on the idea that each pixel of
    the texture is shown once, and only once on the surface it is applied to. This
    can yield really intricate textures, but is sometimes hard to maintain good resolution
    without monstrously large files and thus lower frame rates. For other maps like
    the floor, for example, we built a UV map with the assumption that we were going
    to repeat, or tile a texture. This means that instead of seeing one 1024x1024
    texture spread across our entire dock (which would mean a very few muddy pixels
    being visible when we look down at our feet), we could repeat that texture many
    times so that we could fairly see the entire 1024x1024 texture right at our feet.
    This allows for a texture that holds up much better upon close inspection.


    However, when a texture is going to be repeated like this it becomes critical
    that there are no seams as the texture tiles. If the top of the texture doesn''t
    line up perfectly with the bottom, the tiling will be seen and the illusion of
    an unbroken surface will be destroyed.


    # Maya and Unity


    Luckily, the Unity paradigm for describing Textures/Materials/Shaders is virtually
    the same as Maya''s; it is part of why Maya and Unity make such a good pairing.
    If you understand the creation of materials in Maya, moving into Material and
    Shader creation in Unity will be much smoother.


    However, having said this, some data is lost in the .fbx conversion process when
    moving assets from Maya to Unity. Unity deals with .fbx files. What it does with
    most, say models that it imports is convert that model from Blender or Maya or
    CAD or whatever into an .fbx file. Unfortunately, complex shader networks created
    in Maya do not transfer as-is into Unity. There almost always is some rebuilding
    when the assets move from Maya (or whatever 3D application you''re using) into
    Unity.'
  merge: -1
  img_proc: true
