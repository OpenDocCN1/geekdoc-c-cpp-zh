- pgno: 490
  md: "**Step 18:** Create a new JavaScript. Name it\nHallwayDoorsLockedTriggerScript.\
    \ Open the script in your script editor.\n\n# ### Why?\n\nI can hear you hard-core\
    \ scripters screaming from here, \"Just use the HallwayDoorsTriggerScript and\
    \ alter it to be able to check for a Boolean state.\" And you'd be absolutely\
    \ right. A much more efficient method would be to create one door-opening script\
    \ that is useful in almost all situations; however, we're going to build another\
    \ to review how triggers function, and to keep the script easy to read within\
    \ the book.\n\n**Step 19:** Define variables for the door, the bulkheadHandle,\
    \ a\ndoorOpenSound, the mainCamera, and the guiTextHints:\n\n```\n    var door\
    \ : GameObject;\n    var bulkheadHandle : GameObject;\n    var doorOpenSound :\
    \ GameObject;\n    private var mainCamera : GameObject;\n    private var guiTextHints\
    \ : GameObject;\n```\n\n# ### Why?\n\nThe door is the object that opens. The bulkheadHandle\
    \ is the wheel that turns. The doorOpenSound is a sound that plays when this big\
    \ ol' door opens. The next two private variables allow us to track down where\
    \ our state engine lives (attached to Main Camera), and drive a screen hint if\
    \ the player has not gotten the key yet.\n\n**Step 20:** On Start, have the script\
    \ populate mainCamera and guiTextHints:\n\n```\n    function Start() {\n     \
    \   mainCamera = GameObject.Find(\"Main Camera\");\n        guiTextHints = GameObject.Find(\"\
    GUITextHints\");\n    }\n```\n\n# ### Why?\n\nSo why make mainCamera and guiTextHints\
    \ private variables and populate them in script and not do this for the others?\
    \ Good question; the answer is that this will make the script applicable in other\
    \ locked-door situations. In most all situations where the door is locked (and\
    \ we want to be able to open it), the state engine will be accessed, and the screen\
    \ hints will be shown. Since these two objects won't change, hard coding them\
    \ saves populating in Unity. But since the door may indeed change if this script\
    \ is used elsewhere, keeping it a public variable (along with the door handle\
    \ and sound the door plays) will allow this script more uses."
  merge: -1
  img_proc: true
- pgno: 491
  md: '# 一、建设项目基本情况


    项目名称：XX市XX区XX地块商业综合体建设项目


    建设单位：XX房地产开发有限公司


    项目性质：新建


    建设地点：XX市XX区XX路与XX大道交汇处东北角


    # 二、项目概述


    本项目拟建设集商业、办公、餐饮、娱乐于一体的综合性商业综合体，总用地面积约2.5万平方米，总建筑面积约12.8万平方米，其中地上建筑面积约9.6万平方米，地下建筑面积约3.2万平方米。项目建成后将成为该区域新的商业中心，有效提升周边居民的生活便利性。


    # 三、项目主要建设内容


