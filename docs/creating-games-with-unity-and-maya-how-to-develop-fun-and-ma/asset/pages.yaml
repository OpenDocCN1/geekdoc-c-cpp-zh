  md: '**FIGURE 7.20** Shadow resolution differences.


    ![](img/0285f88bc840f313779e011725b623a5_187_0.png)


    Finding the sweet spot for a game becomes an important piece of optimization.
    In many scenes, objects may be far away and casting shadows, but the shadows can
    hardly be seen even when visible. This is a perfect situation to decrease the
    Shadow Distance and allow more of that resolution to be used right up close to
    the camera.


    Figure 7.23 shows the quality settings high and with a shadow depth that seems
    to be a good balance in quality and coverage.


    # Tips and Tricks


    Note that Fantastic settings include High Resolution and Four Cascades. If, up
    in the Quality Settings, the Editor Quality was changed from Good to Fantastic,
    the shadows would instantly look better in the scene. However, it would still
    be important to optimize the Shadow Distance setting.'
