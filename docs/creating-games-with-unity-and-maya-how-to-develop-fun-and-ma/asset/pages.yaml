- pgno: 329
  md: '**FIGURE 10.40** Smoothing influence through Smooth Flood.


    ![](img/0285f88bc840f313779e011725b623a5_329_0.png)


    **Step 14:** Repeat this process of painting at 1 and then smoothing starting
    from the extremities and working in. So start from the toe and work up to the
    hip, then start at the finger tips and move up to the shoulders.


    # ## Conclusion


    In all the books I''ve written, writing about painting skin weights is always
    the toughest. They just don''t lend themselves well to step-by-step tutorials.
    Although we could go joint by joint and look at painting the influence for each,
    the results would be maddeningly tedious and still yield results not identical
    to mine.


    I''ve found through many years of teaching this that the best way to learn skin
    weights is to paint skin weights. So tear into it, test often (you''ll need to
    re-enable the ability to select joints to test and then turn them off again) and
    discover the fun of making the form deform correctly.


    As you work, consider the following tips:


    +   1. Remember that when painting the influence of a joint, you are painting
    what vertices are influenced by that joint, not just the vertices that are around
    the joint. So a knee joint should not just be painted around the knee; rather
    the knee joint will be affecting from the knee down the shin and the top of the
    ankle (Figure 10.41).

    +   2. Remember that painting skin weights is a dynamic process. As you paint
    skin weights on one area of the body, it is robbing influence from other parts.
    This means that the skinCluster is very fluid, and what you painted may not remain
    that way, so don''t assume that once a joint has been painted it''s complete and
    done. Multiple passes are necessary to get things right.

    +   3. Be very careful not to paint areas not intended. This seems obvious, but
    very often I see a student oriented below their character painting the end of
    the toe and end up picking up the tip of the nose. So every time the character
    picks up a foot or moves the leg, the tip of the nose moves.'
  merge: -1
  img_proc: true
- pgno: 330
  md: "![](img/0285f88bc840f313779e011725b623a5_330_0.png)\n\n**FIGURE 10.41** Influence\
    \ area of the knee; notice it's from the knee down to where the ankle takes over.\n\
    \n+   4. Watch for vertex twitching. Even when you think the skin weight is painted\
    \ well, test and look carefully for spots where the mesh is twitching (especially\
    \ along the thighs near where the hands are). This twitching of vertices means\
    \ that there is trace influence on a vertex (sometimes this can be cleaned via\
    \ Animation>Skin>Edit Smooth Skin>Prune Small Weights).\n+   \n+   5. Remember\
    \ that there is a Mirror Skin Weights function (Animation>Skin>Edit Skin>Mirror\
    \ Skin Weights). This isn't an ideal situation to use it since the character isn't\
    \ exactly symmetrical (especially with all the guns and knives and diagonal straps),\
    \ but it can be useful as long as you're willing to go back and rework some of\
    \ the rigid bind sections (guns, etc.).\n+   \n+   6. Get that brush small and\
    \ then big again. Especially when working on areas like the fingers, sometimes\
    \ the process is working down one vertex at a time. A small brush will allow for\
    \ exact painting. Scaling the brush up and down often makes for a much faster\
    \ work flow.\n+   \n+   7. Paint while posed. Painting skin weights is possible\
    \ even when the character isn't in a neutral pose (called Bind Pose, or the pose\
    \ the joints were in when they were bound to the mesh), so raise that arm up,\
    \ pull that foot up and then paint on the mesh so that the deformed places look\
    \ right, or so you know which vertices are being pulled away when they shouldn't.\
    \ Then, zero out the rotation values for any joints you rotated in the upper body,\
    \ and zero out the translation and rotate values for the foot handles if you moved\
    \ the foot.\n+   \n+   8. Remember that sometimes the easiest way to get to vertices\
    \ (as in to paint them) is from inside the mesh. This is especially true for areas\
    \ like the back beneath the backpack or inside the mouth.\n+   \n+   9. Save often.\
    \ [sarcasm] Not that Maya ever crashes [sarcasm]; but it crashes more often while\
    \ painting skin weights. It's easy to get lost in the black and grays of the process,\
    \ but it is especially painful to lose work due to a crash while painting skin\
    \ weights. Save often."
