  md: '**FIGURE 8.59** Results of elbow topology with three rings around the elbow.
    Results hold volume better and make for much more believable deformation.


    ![](img/0285f88bc840f313779e011725b623a5_237_0.png)


    results with three subdivisions at the elbow. The outside deformed area maintains
    its volume better, and with a bit of skin weight painting (more on this later),
    the inside nook of the elbow creates a more believable deformation.


    Step 77: Add additional subdivisions and sculpt the results (Figure 8.60).


    **FIGURE 8.60** Additional rings added and sculpted.


    ![](img/0285f88bc840f313779e011725b623a5_237_1.png)


    # Why?


    These additional rings help lay the foundation for further details in muscle form
    and clothing folds.'
