  md: "**Step 9:** Carefully examine the scene. Examine the scene as a player (Play)\
    \ and within the Scene window. Carefully check that the shadows that should be\
    \ there are indeed in place. Look for areas where light may be leaking through\
    \ places it shouldn't. Similarly, Figure 7.25 shows the results of the scene baked\
    \ with Unity Pro (and thus light bounces, etc.). If you are using Unity (as in\
    \ without the Pro), you may need to add a few extra lights (sometimes low intensity\
    \ directional lights work great to imitate the bounced light effect) and rebake.\n\
    \n**Step 10:** Compensate for areas with problems. Figure 7.26 shows an area inside\
    \ the tunnel that has sunlight streaming in from above. This shouldn't be there,\
    \ but has occurred because sections of the tunnel that wouldn't be seen were left\
    \ without a roof. This can be a fairly common occurrence when carefully optimizing\
    \ a scene. To fix it, create a Plane (GameObject>Create Other>Plane) and move\
    \ the plane over the tunnel part (Figure 7.26). Name the plane TunnelLightMask\
    \ and mark it as Static.\n\n![](img/0285f88bc840f313779e011725b623a5_192_0.png)\n\
    \nFIGURE 7.26 Compensating for unwanted lighting holes.\n\n# Why?\n\nThere are\
    \ actually a couple of ways to fix this issue. One is to go back into Maya and\
    \ actually add the geometry needed to plug that light leak. However, creating\
    \ and placing a plane that will never be seen is much, much quicker than opening\
    \ Maya, changing geometry, exporting, Unity importing, and so on. Sometimes Unity's\
    \ built-in polygon GameObjects are perfect for this sort of quick fix.\n\n**Step\
    \ 11:** Bake and examine again.\n\n# Deferred Lighting and Dual Lightmaps\n\n\
    Unfortunately (if you don't own Unity Pro), Deferred Lighting is a Unity Pro only\
    \ feature. If you are not using Pro, go ahead and skip down to the Foggy Day lighting\
    \ section.\n\nFor those of you lucky enough to have Unity Pro, Deferred Lighting\
    \ is one of the most powerful parts of Unity 3, especially when it comes to baked\
    \ lighting and an important idea called Dual Lightmaps. Dual Lightmaps is the\
    \ idea of creating two separate lightmaps—one for close up, which can also make\
    \ use\n\n> **Warnings and Pitfalls**\n> \n> Although Figure 7.27 is a clear illustration\
    \ of how the two lightmaps are swapped out, this should usually not be seen in\
    \ the game. Seeing a shadow change like that would be disconcerting and would\
    \ pull the player out of the experience. To most effectively use this technique\
    \ it would need to be done further away from the player so that he couldn't see\
    \ the lightmaps changing out—it should be seamless magic."
