- pgno: 438
  md: '# Why?


    Unity (and all game engines, really) work hard to make sure no processor cycles
    are being wasted on things that aren''t seen. Among the strategies it employs
    is not to calculate certain things that are not visible to the player''s camera—it
    doesn''t update them when off screen. Joint deformations are one of these things
    that Unity doesn''t bother with when it can''t see them. But, sometimes, Unity
    gets a bit confused at what it considers on screen and thus the arms disappear
    intermittently when they are right on the edge of what the camera sees. By forcing
    updates even when the arms aren''t on screen, we ensure that they always stay
    visible.


    **Step 9:** Create a prefab for this complete First Person Controller with arms.
    First, rename First Person Controller to FPC_AegisChung. Then, in the Project
    panel, choose Create>Prefab. Rename this new prefab to the same FPC_AegisChung.
    Then drag the FPC_AegisChung that is in the Hierarchy down on top of the FPC_AegisChung
    prefab in the Project panel.


    # Why?


    We''ve spent a lot of work getting this character set up and we''ll want to be
    able to use it in our other level, EntryWay. By creating the prefab, we''ll have
    quick access to it later when we replace the First Person Controller in EntryWay
    with this one.


    # Conclusion


    So there is still some functionality missing here. Once the game starts, the gun
    comes up. This is because the arms are set to automatically play the first animation
    attached to it. This means that currently, the gun is always visible once the
    game starts, which we probably don''t want it to be; and we don''t have any way
    of using the PistolFire animation yet. Don''t worry, we''ll return to controlling
    these arms later. For now though, let''s move on to being able to have the gun
    actually hit stuff.


    # Tutorial 15.3: Firing a Gun


    Fortunately, we actually have a lot of the mechanism for the gun already created.
    We created it in the raycasting tutorial that built the AC_ToolFunctionScript
    script. Open that script and take a look. We have set up already a raycasting
    system that shoots a ray from the camera and understands what it hits. In this
    tutorial we''ll build upon that mechanism to use raycasting to fire our gun.'
  merge: -1
  img_proc: true
- pgno: 439
  md: "**Step 1:** Open the script AC_ToolFunctionalityScript.\n\n**Step 2:** Make\
    \ the script know whether or not the pistol is out and ready to be fired. Declare\
    \ the following variable at the beginning of the script (since the script is getting\
    \ long, the needed added snippet will be called out by itself):\n\n```\n```\n\
    ...\nvar pistolActive : boolean = true;\n...\n```\n```\n\n# Why?\n\nWe're actually\
    \ doing several things here. We're declaring the variable `pistolActive` and telling\
    \ Unity it's going to be a type Boolean (on/off switch), and in the same line\
    \ we're telling Unity its value is true (on). Later, we're going to adjust this\
    \ so we can determine if the pistol is active via our inventory system, but for\
    \ now, we just want to turn it on and leave it on.\n\n**Step 3:** Have the script\
    \ check to see if the pistolActive is true, and if it is, instantiate something\
    \ that we'll call gunSpark (which will be a particle system). Add the following\
    \ code:\n\n```\n```\n...\n    if (hit.collider.gameObject.name == \"Hallway_Key\"\
    )\n        AddHighlight(hit.collider.gameObject);\n    }\n    if (pistolActive){\n\
    \        if (Input.GetMouseButtonDown(0))\n            var hitDirection = Quaternion\n\
    .LookRotation (hit.normal);\n            Instantiate(gunSpark, hit.point,\nhitDirection);\n\
    \        }\n    }\n...\n```\n```\n\n# Why?\n\nSo this new snippet checks to see\
    \ if pistolActive is true; if it is, it listens for the player to press the left\
    \ mouse button (if `Input.GetMouseButton(0)`); when the player does this Unity\
    \ creates a temporary variable (called hitDirection) and has it look at the normal\
    \ of where the ray is striking the surface. Remember that the normal of a surface\
    \ is the front of the surface, or the direction the surface is facing. This is\
    \ laying the groundwork so that when the gunSpark fires, it will fire out from\
    \ the direction of the surface it hits.\n\nThe last line there is the important\
    \ one for our purposes. It's instantiating or creating while the game runs an\
    \ object called gunSpark, at the location of hit.point facing the hitDirection\
    \ that we defined in the line before. So the syntax of Instantiate is Instantiate\
    \ (an object, at this spot, rotated like this)."
  merge: -1
  img_proc: true
