    ![](img/0285f88bc840f313779e011725b623a5_414_1.png)


    **FIGURE 14.8** Highlighted key.


    # Turning on the Lights


    Now that we’ve highlighted that actionable items, we need to make an action happen
    when they are clicked. The first thing we’re going to do is make the scene so
    that when the player enters the scene all the lighting are turned off. The player
    will be able to use a flashlight to find his way to the closet where the main
    power switch is on (the one we created the highlight mechanism for). When the
    player clicks on the highlighted switch, the switch itself needs to animate, and
    then the lights need to come on. We will build all this into our current script.
    However, before we continue on with the script, let’s make some adjustments to
    the scene file to make this mechanism work.'
  merge: -1
