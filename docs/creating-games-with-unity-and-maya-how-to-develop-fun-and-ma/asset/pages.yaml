    # # Unity Raycasting


    Collision detection as shown in the last chapter is an easily accessible way of
    driving interactions in Unity. It''s easy to think of triggers as triggering specific
    events or commands, and setting these things up is simple. However, there are
    some clear potential drawbacks, the biggest of which is something called frame
    miss.


    # ## Frame Miss


    Unity looks for events on frames. If a game is running at 30 frames a second,
    Unity is checking for and potentially firing commands 30 times each second. Frame
    miss is a term that refers to actions (like a collision detection) happening between
    frames. If that happens between frames, Unity misses it—Unity just doesn''t see
    it happen. In most cases involving a moving First Person Controller this is unlikely—the
    character just doesn''t move that fast (unless the collider is super small); however,
    let''s take a look at a very likely and classic scenario.


    Guns are part of a lot of games. They are part of Incursion (although we''ll be
    shooting cameras and not people). Bullets are fast, really fast, which means they
    travel a very long distance in a very short time, or more relevant to us, they
    travel a long distance in each frame. Let''s assume that a 0.22 bullet travels
    at 1500 feet per second. That means if the bullet we create in Unity is traveling
    at a realistic speed, if the game is playing at 30 frames per second,'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'that bullet travels 50 feet every frame. Unity then “sees” the bullet and checks
    for collisions every 50 feet. So a thin object that was 10 feet, 20 feet, 30 feet,
    40 feet from the gun would not be registered as hit by that bullet because Unity
    simply wasn’t looking when the bullet would have been in that object’s space.
    In fact, only objects that were 50 feet, 100 feet, 150 feet, 200 feet, and so
    on from the gun would be registered as hit. Of course if the object were 50 feet
    thick, it would register, but we digress.


    Frame miss is a very real problem for other issues as well. In one of the projects
    we use here when we are briefing on our technology, we have a pipe filled with
    particles flowing through it to show how we can illustrate building infrastructure.
    The particles are colliding off the inside of the pipe that keeps the particle
    stream contained. Occasionally, one of the particles gets moving so fast that
    Unity misses the frame where it’s supposed to calculate the end of the pipe and
    it escapes, flying through the facility, and often then bouncing off walls and
    other equipment. Although it’s pretty funny for whoever is being briefed, it always
    makes me cringe as it yanks the viewer right out of the experience of the space.


    Avoiding frame miss is an important thing to be paying attention to in the construction
    of a game.


    # Raycasting


    One way to avoid issues involved with frame miss is to use a sort of sister technology
    to collision detection called raycasting. Raycasting is the process where an invisible
    ray is “cast” or thrown from an object. This ray is cast outward (in the direction
    of the object’s forward direction (Z)) and can be defined to have a particular
    length (or to shoot out infinitely) until it hits something.


    Figure 14.1 shows a screenshot of a ray being cast from the camera attached to
    the First Person Controller. The ray shoots out until it hits the wall right ahead
    of it. The cool thing about this is that this ray is pretty smart and fast. In
    one frame, the ray shoots out until it strikes a collider (thus avoiding frame
    miss issues possible in things like collision detection) and the ray can report
    back about what it’s hit. The ray can tell us information about what the object
    is, where in world space it was stopped by an object, and all sorts of other useful
    data. We can utilize this data for some preemptive functions like deciding whether
    a bullet would hit an object.


    We are going to explore using raycasting for use in several situations. First,
    we are going to make use of raycasting as an alternative to the OnMouseOver functionality
    we used in the GUITextures tutorials. For GUITextures, OnMouseOver works fairly
    reliably and is a great way to work. In the 3D world though, it’s often more accurate
    to raycast objects via raycasting than OnMouseOver.


    Using raycasting we will highlight actionable items in the game. Namely, we’ll
    use this method to flip the main power switch in the base. Then later, we’ll also
    use it to identify and pick up a key that opens a locked door.'
  merge: -1
  img_proc: true
- pgno: 402
  md: '![](img/0285f88bc840f313779e011725b623a5_402_0.png)


    Second, we will use raycasting for firing Aegis''s pistol. After the power is
    restored, the security cameras will be on in the base and the player will need
    to take them out with his pistol. Using raycasting we will ''fire'' bullets that
    will affect and destroy the cameras. With raycasting we will avoid the problems
    previously discussed inherent in actually using a projectile moving through space
    at a high velocity.


    Finally, we are going to use raycasting to give us hints on placing an object.
    Among Aegis''s tool kit is an electromagnetic pulse mine that the player will
    use to disable the EntryWay electronic lock. Using raycasting we will instantiate
    (create in game) an object that will show the player where he potentially can
    mount the device.


    Lots of fun stuff to do with raycasting once the mechanics of it are realized.
    Let''s get to it.


    # But First...a Few Notes on Scripting and Help


    Up to this point, the scripts we have written have been pretty straightforward
    and fairly short. However, as our scripts begin to increase in length it''s worthwhile
    to note some practices that we should be following as we work.


    # Comments via //


    Scripting languages provide mechanisms to help document scripts as they are written
    right within the script itself. JavaScript (along with some other languages) allow
    comments to be injected anywhere as long as there is a // before the comment.
    Whenever Unity sees // it ignores whatever comes after that until it reaches the
    end of a line (where you press Enter). It just takes a moment to notate the script
    you are writing, but can save tons of time when it comes to trying to figure out
    what you were thinking when the script is accessed later in the project.'
