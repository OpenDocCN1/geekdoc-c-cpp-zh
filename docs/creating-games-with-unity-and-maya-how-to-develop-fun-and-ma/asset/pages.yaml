- pgno: 505
  md: "# Why?\n\nOf course we haven't made the function that actually does the damage\
    \ yet (DoDamage), but we'll create that in a minute. Do notice, however, that\
    \ in the last command in that block of code we're telling Unity to go fire DoDamage,\
    \ but take with it the gameObject attached to other (which is the collider that\
    \ entered the trigger).\n\n**Step 18: Add a function to set inTrigger to false\
    \ when the player exits the trigger:**\n\n```\n~~~\nvar damageAmount : int;\n\
    private var inTrigger : boolean;\n\nfunction OnTriggerEnter (other:Collider) {\n\
    \    if (other.gameObject.tag == \"Player\") {\n        inTrigger = true;\n  \
    \      DoDamage (other.gameObject);\n    }\n}\n\nfunction OnTriggerExit (other:Collider)\
    \ {\n    inTrigger = false;\n}\n~~~\n```\n\n# Why?\n\nFor some of the triggers\
    \ this will be used on, the player will never leave it alive. But, the player\
    \ could enter the water trigger, and then climb out via the terrain. So we need\
    \ Unity to keep track of whether the player has emerged alive or not.\n\n# Broadcast\
    \ Message\n\nWe've looked at a few ways to communicate between objects and scripts.\
    \ There's one final method we'll look at in this book—a powerful method called\
    \ Broadcast Message. What Broadcast Message does is shout a message out and objects\
    \ that are listening for it hear it and obey. In this game we're using Broadcast\
    \ Message in a fairly targeted fashion, but consider a situation in which lots\
    \ of objects in a scene need to do something (say enemies needing to reset their\
    \ target); using Broadcast Message, a weapon could \"shout\" to all of them at\
    \ once, \"oy! Now go chase this little distraction robot I've launched!\" Using\
    \ the past methods of finding an object, then accessing a specific script on that\
    \ object, and then accessing a specific function, would be problematic if there\
    \ were 100 enemies on screen. But with Broadcast Message, the enemies would hear\
    \ the command, and all fire their respective function to realign target.\n\n>\
    \ > **Warnings and Pitfalls**\n> >\n> > There are some very specific designed\
    \ restrictions to Broadcast Message that have to do with where objects are within\
    \ Hierarchy and who hears a message. So if you plan to use this extensively in\
    \ a project be sure to read the documentation on these sorts of issues."
  merge: -1
  img_proc: true
- pgno: 506
  md: "In this case, we are going to use Broadcast Message to yell specifically to\
    \ the object that has entered the collider. However, this still carries some benefits\
    \ since we just shout the message, and the object figures out which script needs\
    \ to hear it.\n\n**Step 19:** Create the DoDamage function. Include a sort of\
    \ timer in this function so that if inTrigger is active, it continues to damage\
    \ the player.\n\n```\n```\nvar damageAmount : int;\nprivate var inTrigger : boolean;\n\
    \nfunction OnTriggerEnter (other:Collider){\n      if (other.gameObject.tag ==\
    \ \"Player\"){\n            inTrigger = true;\n            DoDamage (other.gameObject);\n\
    \      }\n}\n\nfunction OnTriggerExit (other:Collider){\n      inTrigger = false;\n\
    }\n\nfunction DoDamage (target : GameObject){\n      while (inTrigger){\n    \
    \        target.BroadcastMessage(\"ApplyDamage\",\ndamageAmount);\n          \
    \  yield WaitForSeconds (2);\n      }\n}\n```\n```\n\n# Why?\n\nWe're using our\
    \ old trick of a while statement so that as long as the inTrigger is true (which\
    \ is set earlier by setting it to true when an object with tag \"Player\" enters\
    \ the trigger), every 2 seconds Unity fires the command that says \"get target\
    \ (which is the object that collided with the trigger) and broadcast the message\
    \ \"ApplyDamage\" along with the parameter of how much damage to subtract (damageAmount).\n\
    \nIn this case \"target\" will always be FPC_AegisChung, which also has attached\
    \ to it the HealthEngineScript. Remember that within this script is a function\
    \ called ApplyDamage that has a parameter of damage:int. When \"target\" hears\
    \ this broadcast message and the parameter of the damageAmount, it will subtract\
    \ the damage amount from the current health value (check out the HealthEngineScript\
    \ for review).\n\nThe cool thing here is that we didn't have to tell the object\
    \ what script to use. The object itself received the message and then passed it\
    \ along to its components. If a component couldn't do anything with it, it ignores\
    \ it. But when a component recognizes the message (like HealthEngineScript), it\
    \ obeys."
  merge: -1
  img_proc: true
