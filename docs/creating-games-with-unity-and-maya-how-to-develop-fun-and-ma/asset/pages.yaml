- pgno: 158
  md: "This small collection of primitives can be useful for a few things though.\
    \ For roughing out ideas or a temporary placeholder, using GameObject > Create\
    \ Other > to drop in a spare cube or sphere can be a real time saver and allow\
    \ for an idea to very quickly be explored. Additionally, there are times when\
    \ a polygonal object can be used to control other capabilities of Unity, like\
    \ particle emitters.\n\nIn this tutorial, we will briefly create a few polygonal\
    \ primitive GameObjects and then use them to define the attributes of a particle\
    \ system. The particle system we are going to create is a low-lying steam rising\
    \ off the water surface in this cold and uninviting scene. It will help provide\
    \ some further movement to the scene and give it further ambiance.\n\nA quick\
    \ bit of theory about what particles are. Essentially, particles in Unity are\
    \ little tiny billboards or planes (although the mesh can be more complex) that\
    \ emit into the scene and always face the camera. This gives the illusion of volume\
    \ for things like smoke when these planes are textured with semitransparent textures.\
    \ Because the default emission object is a plane, the polycount remains low but\
    \ great effects are added.\n\nParticles can be effectively used for smoke, fire,\
    \ sparks, steam, and so on.\n\n+   1. **Step 1:** Create a new Plane. GameObject\
    \ > Create Other > Plane. This will create a new Plane object in the Scene in\
    \ the middle of the green space. Note that this could be in all sorts of weird\
    \ places, so swap to the Move tool and move the Plane up to where it can be seen\
    \ in the Scene view.\n\n# Tips and Tricks\n\nNote that when creating one of Unity’s\
    \ polygonal primitives, it only shows up in the Hierarchy and Scene window (it\
    \ does not become a prefab automatically and thus does not show up in the Project\
    \ panel). It can be made into a prefab if the object needs to be used again again\
    \ after it has been created, but we’ll get to that in a minute.\n\n+   2. **Step\
    \ 2:** In the Hierarchy panel, name the Plane `WaterSteamEmitter`. Rename objects\
    \ in the Hierarchy by either right-clicking and choosing Rename, or clicking once,\
    \ waiting, and then clicking again, or by selecting it in the Hierarchy and renaming\
    \ it in the Inspector.\n+   \n+   3. **Step 3:** Remove the material. Select `WaterSteamEmitter`\
    \ in the Hierarchy panel, and in the Inspector look for the Mesh Renderer section.\
    \ Expand the Materials part, and click the target icon next on the Element 0 line.\
    \ Double-click None in the Select Material window. The mesh should turn pink.\n\
    \n# Why?\n\nThere really isn’t a hard and fast rule or need to get rid of the\
    \ material. In later steps we will be turning off the Mesh Renderer for this GameObject\
    \ completely so it won’t be seen in the scene; so the current material doesn’t\
    \ matter much. The reason we are turning it off is the scene is awfully gray,\
    \ and when a polygonal GameObject has no material it turns it bright pink, which\
    \ makes it very easy to see."
  merge: -1
  img_proc: true
- pgno: 159
  md: '**Step 4:** Scale and Move the WaterSteamEmitter to match Figure 6.24.


    **FIGURE 6.24** Placed WaterSteamEmitter


    ![](img/0285f88bc840f313779e011725b623a5_159_0.png)


    # ### Why?


    This plane is going to be the source of the water steam (as the name implies).
    Although we could create a particle system (GameObject>Create Other>Particle System)
    that is really independent of polygons or any mesh, when working with particles
    that need to come from a very specific area, making a polygonal object that matches
    this area is a quick and easy way to take control of this.


    It is a little smaller than the channel because the steam particles will be expanding,
    and when particles cut through polygons (like the side of the dock) they can make
    strange artifacts appear. So having the emitter a bit smaller will give the same
    steaming-water effect but avoid the artifacts.


    **Step 5:** Add the three key components to a Particle System: Particle Emitter,
    Particle Animator, and Particle Renderer. All three of these are in the Component
    drop-down menu. Make sure the WaterSteamEmitter is selected and then choose Component>Particles>Mesh
    Particle Emitter, Component>Particles>Particle Animator, and then Component>Particles>Particle
    Renderer.


    # ### Why?


    What each of these components do is pretty obvious from their names; but it is
    clumsy to have to add each individually. However, it''s worth noting that usually
    when a straight Particle System is created, all of these components are already
    added to the system as it is created.


    **Step 6:** Create a new material. This can be done in one of three ways. Either
    (1) Choose Asset>Create>Material, (2) in the Project panel, choose Create>Material,
    or (3) in the Project panel, right-click and choose Create>Material. Rename the
    new material WaterSteam Material.'
