    \ copy and paste the front view into the raw AegisChunk texture (Figure 9.53).\n\
    +   \n+   **Step 24:** Use Liquefy for a quick pass of adjusting. Choose Filter>Liquefy.\
    \ Move the pixels for the eyes, nose, and mouth (although we will give considerable\
