- pgno: 555
  md: '# Creating Games with Unity and Maya


    How to Develop Fun and Marketable 3D Games


    > > The book is a perfect balance between theory and practice. It''s valuable
    for everyone eager to do it right rather than to do something.

    > >

    > > — Oleg Pridiuk, Unity Mobile Specialist


    *Creating Games with Unity and Maya provides you with an end-to-end solution for
    Unity game development with Maya. Written by a twelve-year veteran of the 3D animation
    and game industry and professor of 3D animation, this book takes you step-by-step
    through the process of developing an entire game from scratch—including coding,
    art, production, and deployment.*


    > > Watkins''s comprehensive deconstruction of how games are created makes it
    fun and easy for virtually anyone to learn how to make their own video games.

    > >

    > > — Jake Green, 3D Artist & Software Developer, Los Alamos National Laboratory


    This accessible guide provides a "non-programmer" entry point to the world of
    game creation. Aspiring developers with little or no coding experience will learn
    character development in Maya, scripts, GUI interface, and first- and third-person
    interactions.


    Not just a book, *Creating Games with Unity and Maya* also gives you access to
    a powerful website, www.Creating3DGames.com, complete with:


    > > This is a must-have for budding Unity users and a boon for Maya users looking
    to expand their horizons.

    > >

    > > — Anson Call, Associate Professor of Graphic Design and Architecture, Iowa
    State University


    +   - Original versions of the images used in the book

    +   - Completed files from the tutorials

    +   - All source code from the book


    Adam Watkins is Associate Professor of 3D Animation at the School of Media & Design,
    The University of the Incarnate Word. Adam also works at the Los Alamos National
    Laboratory in New Mexico, where he is part of the VISIBLE effort creating virtual
    simulation games for use in non-proliferation exercises. He has headed up the
    3D animation program for over ten years and is the author of several books and
    over 100 articles on 3D animation. His students are the winners of multiple national
    and international animation awards and festivals.


    USER LEVEL: Beginner


    ![](img/0285f88bc840f313779e011725b623a5_555_0.png)


    Focal Press

    An imprint of Elsevier

    www.focalpress.com


    If you enjoyed this book please post a review to your favorite online bookstore
    today


    U.S. $49.95

    ISBN: 978-0-240-81881-8


    ![](img/0285f88bc840f313779e011725b623a5_555_1.png)'
