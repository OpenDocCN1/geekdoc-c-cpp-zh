- pgno: 31
  md: 'doesn''t work quite as well as you had hoped when laying it out on paper. Once
    you walk a space, or try playing the mechanics, you may find that the space you
    had planned may not be the best. If you''ve just got quick mock-ups, you can quickly
    adjust before investing all the time into the scenography asset creation.


    However, in a book setting we need to work largely in a linear progression. So
    for these tutorials we want to imagine that the prototypes have yielded results
    that have cemented the level and character design. And so, with the approval of
    the game designer, we are moving forward with our art asset creations.


    # ## Why Maya Tutorials?


    Unity is the last step in the chain of technologies that creates the game. Without
    it, an effective game can''t be made. But the success of the game will also rely
    heavily on the effectiveness of the assets that go into it. No matter how well
    the chef knows the tools and the oven when baking, if he or she uses poor quality
    ingredients, the cake is not edible.


    I''ve had many students who, when working in Unity, are unable to create the game
    they envisioned because of poor choices or techniques in their 3D application
    of choice. General 3D techniques are not necessarily the same as 3D game techniques.
    Creating economic and correctly structured 3D assets and textures is an absolutely
    critical part of creating games in Unity.


    Why Maya? Well, Maya isn''t even my favorite 3D package. However, it does have
    an amazing market penetration and without a doubt is one of the most powerful
    3D tools out there. Ironically, modeling is not one of its strongest points, but
    for our purposes its polygonal modeling tools will do just fine. Among other parallels,
    the default camera manipulation and object manipulation tools in Unity have identical
    keyboard shortcuts to Maya. Additionally, Maya has some very powerful character
    animation tools, which we will use, that import via FBX very easily into Unity.
    Ultimately, I chose to create our assets in Maya because the large base means
    there are lots of people who know how to use the software and you will have lots
    of options to further your skill set beyond this book once you are done reading
    it.


    Even if you are not a Maya user and are capable in some other 3D app, take a quick
    look at these chapters to make sure you make note of topology and texture creation
    and how to extrapolate those techniques into your own application. It will make
    your game assets stronger, tighter, and better to work within Unity.


    So here we go. In the following few chapters the art assets will come together,
    and these assets will be imported into Unity to allow for exploration and refinement.
    Although these are largely Maya-based'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'tutorials, the assumption is that you are familiar with the basic Maya tools
    (Move, Scale, Rotate) as well as how to select component parts (vertices, edges,
    faces). If you don''t understand these concepts, it will be worth your while to
    at least watch the introductory videos that are included with your Maya installation.


    # ## A Bit of 3D Theory


    Although we assume you know something about Maya''s tools, it will be vital that
    the basic theory of 3D is understood. Without this baseline understanding of how
    digital 3D works, it will be impossible to appropriately construct assets to be
    used in a game framework.


    Figure 2.1 shows the anatomy of the polygon—the building block of 3D. The main
    form that we think of as a polygon is referred to in Maya as a face. The face
    is what the video card (and thus we) “see.” The face''s shape is editable by the
    components that surround it. The face is surrounded by edges that are joined by
    vertices (singular form is vertex). Most of these sorts of concepts are covered
    in some form of junior high geometry; the one other important concept and part
    of a polygon is the normal. The normal defines the front of the polygon. In Figure
    2.1, this is indicated by the green line coming right out of the middle of the
    face. Understanding that faces have normals is important since most game engines
    save processing power by only drawing the front of a polygon. If the camera is
    behind the polygons (if the normal is facing away from the camera), the polygon
    is invisible.


    Three-dimensional forms in a 3D application are created when collections of polygons
    are put together. Think of polygons as unbending sheets of metal. Where the sheets
    of metal connect can hinge, but the polygon itself cannot. This means that the
    more polygons present, the more places the mesh can bend, and thus the more complex
    the form can be. Take a look at Figure 2.2 to see how a form goes from six polygons
    to 32 polygons to 100 polygons, and the resulting forms that are possible.


    Forms that are seen in a 3D environment are drawn by the video card in your computer
    via a rendering engine of some sort. The rendering engines see shapes by recognizing
    polygons. To be more specific, most rendering engines actually see only triangular
    polygons (sometimes called tris). There are several ways to construct these tris;
    Maya''s techniques include NURBS, Subdivs, and straight polygonal modeling. All
    of these are different methodologies of


    ![](img/0285f88bc840f313779e011725b623a5_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'FIGURE 2.2 More polygons means more places to bend. This allows for more rounded
    forms, but it requires a bigger data set.


    ![](img/0285f88bc840f313779e011725b623a5_33_0.png)


    constructing forms of assembling polygons. Some methods are derived from curves;
    others work along the line of creating polygons directly. But at the end of the
    process, all the methods'' results are turned into triangles by a process called
    **tessellation**, so that the engine can see them and the video card can draw
    them.


    # Rendering


    This drawing of polygons and the textures and lighting associated with them is
    called **rendering**. There are two kinds of rendering: software and hardware
    rendering. Software rendering is what is commonly used in television and film
    projects. The scene is built within a 3D application including lights and textures,
    and then the CPU is engaged to draw the complex interaction of the objects, colors,
    and lights in the scene. Because the results are displayed later (not in real
    time), if it takes a second for a frame to be rendered, or a minute, or even an
    hour per frame, this is acceptable. The sequential stills that are the output
    of this process are put together via a video editing package, and watched as a
    moving image.


    Hardware rendering is much different. Games are in this category because the video
    card renders the polygons within the digital space to represent 3D space. The
    hardware draws what is on the screen (including all the objects, textures, and
    light) and needs to do so at as many times per second. Generally, if players are
    getting much below 30 frames per second, they notice the choppiness of the game.


    So how does a computer draw 30 frames per second of one project, but one frame
    every 30 minutes of another? The answer is simply the size of the data set and
    the hardware dedicated to handle that set. For projects that will not be rendered
    in real time, the amount of data can be much higher. The number of polygons can
    be much more, the size and number of textures bigger, and the complex calculations
    of light more sophisticated. In real-time situations (hardware rendering, with
    dedicated hardware chugging away on this data set), the amount of data the video
    card deals with is much, much smaller.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ## Video Cards


    Video cards are a big part of the “hardware” in “hardware rendering.” Video cards
    come in lots of different configurations and power combinations. The intricacies
    of how a video card works are varied and cards that seem the same (share the same
    amount of video RAM) may not actually be identical in their ability to draw assets.
    However, for our purposes we will oversimplify and say that “bigger” cards (cards
    with more video RAM) are able to draw more information.


    “More information” can include a lot of things: more polygons, more textures,
    or larger textures. It can also mean dynamic lighting visualization. In all cases,
    a video card being able to render more information means that the complexity of
    a scene can increase as the video card gets larger.


    At this point it is worth noting that the cost of gamer''s video cards have become
    a very manageable cost in most computers. And in fact, when students come to me
    complaining about slow working conditions on their home computer, the first suggestion
    I almost always make is to upgrade the video card. One GB video cards can easily
    be had for less than $100 and it''s a quick and easy way to empower a computer
    to show more polygons more quickly.


    The technology embedded in video cards evolves so quickly it would be foolish
    to try and explain it all in a book—as soon as it was published the specs would
    be outdated. However, generally, there''s no need to buy a workstation card—the
    gamer''s cards usually do quite reasonably and come with a substantially cheaper
    price tag.


    In my 10-plus years of using Maya, I generally have had better experiences with
    NVIDIA cards. Either ATI or NVIDIA seem to get along well with Unity; but NVIDIA
    has provided the most predictable experience in authoring 3D elements when using
    Maya. This is based largely upon anecdotal evidence of my systems and the systems
    of a few hundred students, but when buying or upgrading a card to work with Maya,
    NVIDIA has worked better for me.


    # ## Limitations and Optimizations for Games


    So what does this all mean? With video cards getting bigger and better by the
    day and their price tags continually dropping, we should be able to create shapes
    with reckless abandon with no concern for the data set we are creating. Right?


    Well, unfortunately, no. For years, the implied promise of instantaneous output
    of trillions of polygons always seems to be just over the horizon. Computers get
    faster, video cards get bigger, and it seems like the process of drawing polygons
    would become a nonissue, one that just happened flawlessly behind the scenes.
    However, what has happened is that as computers get faster new things became possible.
    Suddenly, game engines could start using dynamic lighting (a light bulb swings
    around in the scene and the objects and walls reflect this change), reflections
    become the norm (which really means that everything in the scene gets'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'drawn twice, essentially doubling the number of polygons in the scene), and
    new visual effects like particles and complex shaders became used and expected
    by gamers. As the hardware got more powerful, we simply asked more of it.


    # ## Rules of 3D Game Modeling


    So now that we''ve established that there are indeed limitations to what computers
    can show, it''s easy to see that limits or rules need to be heeded when creating
    assets for Unity. We will visit new rules with each step (there are specific considerations
    for texturing, for instance, that we won''t cover until later). For this first
    tutorial, the two rules are:


    +   1. Polycount matters.

    +   2. Topology is critical (quads are best).


    # ## Polycount Matters


    All the dynamic rise in hardware means that the visual sophistication of games
    continues to rise at an exciting pace. It also means that carefully creating our
    assets to allow for room to create these great effects remains the reality. Ultimately,
    effective use of the number of polygons in a scene (**polycount**) will be critical
    to both the immersive impact of the game and, conversely, the performance in frame
    rate at which the game will play. Now, with most recent machines, polycount is
    much less of an issue than it once was. And frankly, usually if a game is dog-slow,
    it isn''t a case of the sheer number of polys—it''s usually related to other texture
    problems or other issues related to **draw calls** (more on this later). However,
    keeping an eye on the number of polys in your scene remains one of the pressures
    on a video card, and keeping a reasonable poly-budget is important (especially
    if ultimately developing for any mobile devices).


    This can sometimes be a tricky balance. Figure 2.3 shows two sphere-like objects.
    The one on the right has 1000 polygons and the one on the left has 20. Sure enough,
    the 20-polygon model will require less video card power to draw, but it really
    doesn''t appear to be a sphere anymore. Carefully dialing the details up to effectively
    communicate the shape while keeping the number of polygons low enough to draw
    quickly is part of the art that is game asset creation.


    **FIGURE 2.3** Varying polycounts can widely change the draw on a video card,
    but optimized too much moves away from the form.


    ![](img/0285f88bc840f313779e011725b623a5_35_0.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'For our uses we will be focusing primarily on polygonal modeling techniques
    (the techniques using the tools in Maya''s Polygons mode). The other methods of
    NURBS (non-uniform rational b-splines) and Subdivs are too indirect in their creation
    of polygons, and thus we lose control over polygon placement and count.


    # # Topology


    Topology refers to the structure or organization of polygons on a surface. Topology
    matters. Correctly structuring polygons makes a huge difference in how the mesh
    can be deformed later (with things like joints), how the form interprets collisions
    in Unity, and how easy it is to lay out UV maps. Much of topology concern centers
    around the tessellation process—the process of converting the form into three-sided
    polygons (tris) when it comes time to render.


    Maya, like most 3D software, allows the user to create polygons of any number
    of sides (usually called n-gons). This is relatively new in the 3D production
    history. Not many years ago, 3D software would allow polygons to be constructed
    only as tris or quads (four-sided polygons). Tris are pretty hard to work with
    and manipulate quickly, so quads became the preferred method of organizing polygons.
    To allow artists to more fluidly create forms, most 3D apps began allowing the
    user to pay no attention to the number of sides of a polygon as the form was built.
    However, woe be the modeler who doesn''t pay attention to the construction of
    his polygons. Five- (and more) sided polygons cause all sorts of problems down
    the road.


    The issue is in the tessellation process. When the 3D software (or game engine,
    like Unity) converts a 3D form into all tris (which it must for the video cards
    to draw them), there are some shapes that are easier to tessellate. A quad is
    relatively easy, since it just splits it in half from vertex to vertex (Figure
    2.4). However, the tessellation of the n-gon is often unpredictable, especially
    from a game asset creation standpoint. It does it for sure, but the resulting
    mesh is a mess (Figure 2.5).


    This messy tessellation that can be seen in Figure 2.5 may not seem to be a big
    deal here, but when these polygons are subjected to distortion techniques (like
    bending a mesh with joints), suddenly the edges where things can actually bend
    end up being in unpredictable places and result in


    ![](img/0285f88bc840f313779e011725b623a5_36_0.png)


    **FIGURE 2.4** Tessellating a quad is pretty straightforward. Just split it corner
    to corner to create two tris.'
  merge: -1
  img_proc: true
