- pgno: 71
  md: '# Tips and Tricks


    Remember to create a new material for each object or groups of objects (that are
    going to share the same material). Although all of them will share the same Checkerboard.psd
    file as their color texture, we want to be sure they have their own unique material
    assigned to them.


    # Tips and Tricks


    A nice thing about using the same checkerboard for all the UV mapping is that
    it gives a quick look at how much texture space each object will have. Knowing
    this helps show how high fidelity the texture will likely appear in a game. Notice
    in Figure 3.15 that objects that are close to the ground or on the ground have
    small checkers. This means they have a lot of texture space, which means there
    will be a lot of pixels used to describe this surface. Things that are far away
    from the player in the game (like the beams overhead) have larger checker cubes
    because they won''t need quite as much texture since they won''t be subject to
    quite so close a scrutiny.


    # Maya''s Unfold UV via Smooth UV Tool


    # Why?


    Automatic mapping works great if working with cubes or objects that are largely
    cubic in shape. But a scene full of crates makes for a pretty boring scene, and
    ultimately more organic shapes become important to most scenes that have any variation.
    Maya''s Unfold UV tool is a relative newcomer to the Maya toolset (at least in
    the configuration it currently uses). This kind of technique is available with
    other tools (see the free and powerful Roadkill http://www.pulin-shapes.co.uk/page8.htm),
    but is nice to have available in Maya. In the next few steps we will be looking
    at how Unfold works within Maya in a simple shape. However, this tool is especially
    powerful for things like faces and other complex organic shapes, so we will be
    visiting it again.


    +   1. **Step 20:** Assign new material (with checkerboard as the color texture)
    to the EntryWay_Earthwall object (if you are building off the version of the map
    downloaded from the site; if you are unsure of your version assign the new material
    to whatever you are using for the big retaining wall). For a refresher on how
    to do this, be sure to view steps 4 through 7. Name the new material `EntryWay_Earthwall1_Mat`.

    +   2. **Step 21:** Use Planar Mapping to ensure the entire object has UVs. With
    the object selected, choose `Polygons>Create UVs>Planar Mapping (Options)`. Change
    the Fit projection to: setting to **Best Plane**, and press Project (Figure 3.16).'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/0285f88bc840f313779e011725b623a5_72_0.png)


    **FIGURE 3.16** Results of Planar Mapping (showing parts that didn''t work so
    well).


    # **Why?**


    Unfold works great; however, it only unfolds UVs that exist. As we have seen before,
    when faces or edges are extruded, often the new faces that are created lack UVs.
    Using Planar Mapping does a few important things for us. First, it ensures every
    part of a particular mesh has UVs. Second, it ensures all these are part of one
    shell. Third, by choosing Best Plane in the options, we give Unfold its best chance
    at providing a distortion-free UV map.


    **Step 22:** Unfold (interactively) the UVs via the Smooth UV tool. In the UV
    Texture Editor (Window>UV Texture Editor), right-click the mesh and choose UV
    from the hotbox. Marquee select all the UVs. Select the Smooth UV tool either
    from the iconography in the top left of the UV Texture Editor or from Tool>Smooth
    UV Tool.


    **Step 23:** Drag the new Unfold button to unfold the mesh. Look for the new pop-up
    tools that are surrounded in yellow boxes. Drag the word Unfold and watch as the
    UVs unfold and reveal a much better distributed checker pattern in the View panel
    (Figure 3.17).


    **Step 24:** Resize (and rotate if needed) the UV Shell to get it to fit into
    the top-right quadrant.


    # **Why?**


    Although UVs do not need to always remain in that top-right quadrant (and in fact
    in the next setup steps we will be moving out of that space), if the situation
    calls for a nonrepeating texture, it needs to have it remain within this quadrant.
    For this earth wall, since we will be seeing all of it at once within the game,
    we will want to avoid a repeating pattern if we can. Plus, by rotating and scaling
    these UVs, it allows us further texture space to create another mini-atlas.


    # **Warnings and Pitfalls**


    At first blush, all looks well—the entire surface is covered with checks. However,
    if you look carefully at the checkers you will see that there are some really
    distorted checkers (especially in the upper-right corner of Figure 3.16). This
    is happening because Planar Mapping shoots a texture across a surface like a slide
    projector. As the image is projected against faces that are perpendicular to the
    projection plane it looks great, but as the form begins to wrap around so that
    the planes are parallel to the projection, we get stretching. If this is left
    this way, the rock texture that will be applied will also be deformed as it wraps
    around the form. Thus, the next steps are important and powerful.'
  merge: -1
  img_proc: true
