    # ## Scope and Optimizing Script


    Scope refers to the parts of the code that have access to a given variable. If
    a variable is declared at the beginning of a script, all the functions that happen
    in that script have access to it. We can even declare global variables, or variables
    that are accessible to all scripts in a game (more on this later). But we can
    also declare local variables, or variables that are accessible only within the'
