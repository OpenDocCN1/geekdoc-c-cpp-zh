  md: '![](img/0285f88bc840f313779e011725b623a5_223_0.png)


    **FIGURE 8.37** Building back toward the occipital bun.


    **Step 56:** Close off the bun. Continue extruding until the new polygons are
    aligned across the back of the head (Figure 8.38).


    ![](img/0285f88bc840f313779e011725b623a5_223_1.png)


    **FIGURE 8.38** Finishing off the occipital bun.


    # ### Why?


    In Figure 8.38 notice that the bun was closed off and then additional subdivisions
    (via the Insert Edge Loop tool) were created. This could also have been done via
    several extrusions, but sometimes re-sizing a form by adding polygons to an already
    created form is easier than extruding, moving a bunch of vertices, then extruding
    again. Figure 8.38 really shows the idea of roughing out a shape, and then going
    back in to refine.'
