- pgno: 476
  md: "```\n```csharp\naegisArms.animation(\"PistolReady\").time = aegisArms\n.animation(\"\
    PistolReady\").length;\naegisArms.animation.Play(\"PistolReady\");\nyield WaitForSeconds\
    \ (aegisArms.animation.clip\n.length);\naegisPistol.active = false;\ntoolFunctionality.pistolActive\
    \ = false;\n}\n\nfunction ReadyFlashlight(){\n    aegisArms.animation(\"FlashlightReady\"\
    ).speed = 1;\n    aegisArms.animation.Play(\"FlashlightReady\");\n    aegisFlashlight.active\
    \ = true;\n    yield WaitForSeconds (aegisArms.animation.clip\n.length);\n   \
    \ aegisFlashlight.active = true;\n    toolFunctionality.flashlightActive = true;\n\
    }\n\nfunction StoreFlashLight(){\n    flashlight.active = false;\n    aegisArms.animation(\"\
    FlashlightReady\").speed = -1;\n    aegisArms.animation(\"FlashlightReady\").time\
    \ =\naegisArms.animation(\"FlashlightReady\").length;\n    aegisArms.animation.Play(\"\
    FlashlightReady\");\n    yield WaitForSeconds (aegisArms.animation.clip\n.length);\n\
    \    aegisFlashlight.active = true;\n    toolFunctionality.flashlightActive =\
    \ false;\n}\n```\n```\n\n# Why?\n\nMost of that is pretty straightforward (i.e.,\
    \ turn on the aegisPistol right before running the animation that shows it and\
    \ turn it off after the animation that stores it). The strange one is where the\
    \ flashlight is. This is placed so that the light doesn’t turn on until after\
    \ the FlashlightReady animation has been run, and turns off right before the flashlight\
    \ is put away.\n\n**Step 35:** Make sure both pistol and flashlight are turned\
    \ off when the game begins. Do this within a Start function (if you don’t have\
    \ one). Usually this is done toward the top of the script after the variable declarations\
    \ and any Awake functions but before any other functions:\n\n```\n```csharp\n\
    function Start(){\n    aegisFlashlight.active = false;\n    aegisFlashlight.light.active\
    \ = false;\n    aegisPistol.active = false;\n}\n```\n```"
