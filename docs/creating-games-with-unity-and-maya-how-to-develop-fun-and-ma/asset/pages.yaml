  md: '![](img/0285f88bc840f313779e011725b623a5_58_0.png)


    # # Asset Creation: Maya Scenography UV Mapping


    # ## Scenography UV Layout within the Game Design Pipeline


    In the previous chapter we discussed how flexible the pipeline was when using
    Unity, and how it is often preferable to not tear through all the art assets before
    starting on game mechanics and scripting. However, in the 3D art asset pipeline,
    there are some fairly clearly delineated steps that need to be followed.


    UV layout is the second step of these strict guidelines. Generally, it is important
    to make sure the geometry (model) is just as it should be before starting your
    UV layout. If a UV layout is created, and then the geometry is changed, the UV
    layouts have to be redone.


    Similarly, the UVs need to be complete before extensive work is done on texture
    creation. Since UVs define how a texture is “attached” to a geometric form, if
    UVs are changed (or the form), the texture will no longer lay appropriately across
    it.


    So, although there is almost always some adjustments as the UV is laid out (stray
    polygons that aren''t needed are found or additional geometry is'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'needed), the more effectively this particular step of the scenography creation
    process (i.e., modeling, UV layout, texturing) is completed, the more efficient
    the process will be.


    # # UVs


    The process of creating and editing UVs can be one of the most frustrating in
    all of 3D. There is little intuitive about them. Unfortunately, understanding
    UVs and how to manipulate and utilize UV space is one of the most important aspects
    to visually believable projects—and absolutely critical to effective games.


    So what are UVs? Well, they really aren’t so much of a what as a where. UVs are
    coordinates. They are involved in the complex problem of how to take a 2D texture
    and wrap it around a 3D form. Think of the problem as much like that of cartographers
    attempting to create a map of the earth. How do you take a sphere and flatten
    it out into a flat shape on a page?


    **UV mapping** is the process of taking three-dimensional shapes, and *unfolding
    or unwrapping* them into a two-dimensional representation where a texture can
    be painted on them (Figure 3.1). UV coordinates on a surface are the locations
    at which to “pin” the textures. Once these locations are pinned down, even if
    the surface flexes or distorts, the texture will flex and distort with it.


    At the end of the day, UV mapping is what helps a texture look “right” on a surface.
    A poorly laid out UV map yields unsightly stretching and pinching of the texture
    that is applied to it. A well-executed UV map produces believable surfaces with
    textures that belie the usually simple geometry beneath it. In games especially,
    where textures do much of the visual work, a good UV map is critical to visual
    success.


    In the following tutorial, we will be looking at three ways to create UV maps.
    Through this process, it will be important that we understand texture space and
    how it relates to 3D space. We will look at the UV Texture Editor within Maya
    and how it allows for the manipulation of UVs. We will look at Maya’s automatic
    mapping options, its unfolding capabilities, and manual mapping and manipulation
    of UVs.


    ![](img/0285f88bc840f313779e011725b623a5_59_0.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ## Exploring the UV Texture Editor


    When any of Maya''s primitives are created, these primitives include a default
    UV layout. For instance, go to Create>Polygon Primitives>Cube. With this cube
    selected, choose Window>UV Texture Editor (Figure 3.2). In the UV Texture Editor,
    the six-sided cube will appear unfolded. All the faces are laid out flat in the
    top (1,1) quadrant of the UV Texture Editor space. By default, the background
    here will be a medium gray color; this is actually the texture that is applied
    to the cube. Within the UV Texture Editor, right-click and hold, and a hotbox
    will be presented that allows for choosing which type of component to select.
    The regular Edge, Vertex, and Face are presented, as well as UV.


    After choosing a component type from the hotbox, these components are now selectable
    within the UV Texture Editor. At first blush it seems that the only difference
    between Vertex and UV is the color of the component when it is selected (vertices
    highlight yellow and UVs always highlight green). This is because Maya''s primitives
    have their UVs located at the vertices of the form. However, don''t confuse the
    two. Vertices and UVs are one-dimensional—they have no geometry of their own—but
    they serve much different functions.


    In fact, once faces or edges are extruded new vertices will always be created
    along with the faces created (there cannot be faces without the vertices); however,
    these new vertices will not necessarily have new UVs attached to them. Further,
    although UVs are visible in 3D space (i.e., the View panels), they can only be
    altered—moved, rotated or scaled—in 2D space, within the UV Texture Editor.


    This transition from 2D texture space to 3D space is often a hard thing to visualize
    and even harder to explain. However, it becomes much easier to comprehend once
    it is seen in action. Because of this we won''t spend too much time pounding on
    the theory further. Let''s start seeing it in action.


    ![](img/0285f88bc840f313779e011725b623a5_60_0.png)


    FIGURE 3.2 UV Texture Editor and the UV layout of a cube primitive.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Tutorial 3.1: Game Level UV Layout, Tools, and Techniques


    In this tutorial, we will continue working on the EntryWay we began earlier. Although
    we won''t explicitly map every object, the techniques covered here are extensible
    to all the objects in this scene, and indeed into all the scenes in the rest of
    the game.


    **Step 1:** Create a checkered pattern. In Photoshop, create an image that is
    32×32 pixels. Create guides horizontally and vertically in the middle of the canvas.
    Fill the top left and right with black. Select all, choose Edit>Define Pattern.
    Name the pattern.


    **Step 2:** Create a checkered base texture. Create a new image that is 1024×1024.
    Choose Edit>Fill. In the Fill dialog box, choose Use:Pattern and pick the previously
    created checkered pattern and click OK. The results should look like Figure 3.3.
    Pretty exciting, eh?


    ![](img/0285f88bc840f313779e011725b623a5_61_0.png)


    FIGURE 3.3 Base checkered texture.


    # Why?


    Why a checkered pattern? Why not just use the checkered texture that''s canned
    in Maya? Why 1024×1024? All good questions. As we attempt to lay out the UV map,
    it will be important to know that the mapping we have created does not cause stretched
    or pinched textures. Further, sometimes we want to know how much texture is actually
    on any one part of the mesh. By using a checkered texture, we can have a quick
    reference of how the texture is mapped across the surface, and how we are distributing
    the texture in 3D space. The reason to build our own instead of using Maya is
    that the Maya checkerboard is set at the number of checks across and down. By
    creating our own, we can create a more densely populated collection of checks.
    The file is 1024×1024 because we want to get in the habit of building by **power
    of two** when working with texture (much more about this later).'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Step 3: Save as Checkerboard.psd in the sourceimages folder of the project
    file.


    # Why?


    The sourceimages folder is where Maya goes to look for textures when a new material
    is created. There are lots of other seductively logical folders (images, textures,
    etc.) but don''t succumb. The only folder that matters for saving textures within
    Maya is sourceimages.


    # Creating and Applying New Material


    Step 4: Create and apply a new material on a column. Right-click and hold on the
    column that we previously beveled. Choose Assign New Material. In the Assign New
    Material window, click Lambert. This should open a new lambert material in the
    Attributes Editor. If it does not, press Ctrl-A, and the Attribute Editor will
    show the attributes of this new material.


    # Why?


    Why a lambert? Lamberts are matte materials that Maya draws really quickly and
    well. More importantly for us, when Unity initially brings in the Maya-created
    objects, everything looks like a lambert. Any other attributes present in other
    materials (specular in Phong, etc.) has to be redefined in Unity anyway. So spending
    a lot of time tweaking settings in Maya is wasted since it has to be redone. For
    this reason, lamberts are quick, easy, and predictable ways to get textures applied
    and to see the general look of the scene.


    Step 5: Name the material. Name the material. Name the material. Did I mention
    to name the material? Name the material `EntryWay_Column_Mat`.


    # Why?


    Beginning modelers or beginning game builders often skip effective naming and
    pay the horrible price later. When moving assets between applications (like from
    Maya to Unity), assets will be tied together differently, and sometimes in the
    production process materials will become disconnected from objects. If there are
    100 materials named lambertx, you will be immensely slowed in your work. Take
    just a little time to name materials what they are, and you will save many hours
    later. Especially if you ever hope to work with others as part of a team—effective
    naming is critical to smooth work flows and keeping your job.


    Step 6: Create a Render Node for the Color attribute. In the Attribute Editor,
    at the far right of the Color channel is a little button that (ironically) looks
    like a checkerboard. Click this to bring up the Create Render Node window. Tell
    Maya to import a file to define the color attribute of the material by clicking
    the File button.'
  merge: -1
