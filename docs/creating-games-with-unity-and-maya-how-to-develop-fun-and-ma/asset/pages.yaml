- pgno: 500
  md: "```\n```\nfunction Awake () {\n    healthLevel = GameObject.Find(\"HealthLevel\"\
    );\n}\n\nfunction Start(){\n    health = 100;\n    healthLevel.guiText.text =\
    \ health.ToString();\n}\n```\n```\n\n# ### Why?\n\nThe first command of the Start\
    \ function simply defines the value of health. Later we will want to pass this\
    \ value between levels so that if Aegis gets into trouble in the EntryWay, that\
    \ his reduced health is the same when he's in the Hallway. But for now, let's\
    \ just have it set to 100 when the game starts.\n\nThe second command defines\
    \ what should be in the text of the guiText component of the GameObject healthLevel.\
    \ Notice that this makes use of the fancy ToString function. This is a built in\
    \ function in Unity that converts (in this case) an integer (which a guiText can't\
    \ display) to a string (which a guiText can display). So it just takes the value\
    \ of health, converts it to string (a collection of text), and displays that.\
    \ Seems a little laborious but it's typical of how many scripting languages work.\n\
    \nNow we haven't created the guiText GameObject yet. We'll get to that in a bit.\n\
    \n**Step 4:** Save and return to Unity. Fix syntax.\n\n# ## Creating Health Display\n\
    \n+   - **Step 5:** Open Scene-EntryWay.\n+   - **Step 6:** Create a new GUITexture\
    \ (GameObject>Create Other>GUI Texture). Label it HealthLabel and populate its\
    \ Texture with the HealthBG texture from the 2D Assets folder. Position it with\
    \ the settings shown in Figure 17.5. Make sure Transform X = -5, Y = -1. Then\
    \ be sure the Pixel Inset values are set to X = -32, Y = -64, Width = 64, Height=64.\n\
    \n# ### Why?\n\nThe image is 64x64 (thus the width and height settings). By setting\
    \ the Transform values at 0.5, 1 we're putting the bottom-left corner of the image\
    \ at the center of the top of the screen. Offsetting the image by X = -32 slides\
    \ the middle of the image to the middle of the screen, and then offsetting the\
    \ image by Y = -64, slides it down so the top of the image is at the top of the\
    \ screen."
  merge: -1
  img_proc: true
- pgno: 501
  md: "**FIGURE 17.5** Settings for HealthLabel.\n\n![](img/0285f88bc840f313779e011725b623a5_501_0.png)\n\
    \n**Step 7:** Create a GUIText object (GameObject>Create Other>GUI Text). Label\
    \ it HealthLevel. Set the Transform Position to X = 0.5, Y = 1, and Z = 2. Set\
    \ the text to read 0. Change the Anchor to \"upper center\". Change the Alignment\
    \ to \"center\". Change the Pixel Offset Y = -30 and assign a font you like (Figure\
    \ 17.6).\n\n**FIGURE 17.6** Settings for HealthLevel GUIText\n\n![](img/0285f88bc840f313779e011725b623a5_501_1.png)\n\
    \n> **Why?**\n> \n> So this GUIText is set at the top center of the screen (Transform\
    \ Position (0.5, 1, 2)) and is aligning the text center and using as its anchor\
    \ the upper center. Then we're sliding it down 30 pixels off the top of the screen.\
    \ Note that the Z = 2 makes sure that the text is drawn on top of the HealthBG.\n\
    \n**Step 8:** Make both of these children of the GUIElements prefab in the Hierarchy.\n\
    \n**Step 9:** Select GUIElements and press Prefab Apply."
