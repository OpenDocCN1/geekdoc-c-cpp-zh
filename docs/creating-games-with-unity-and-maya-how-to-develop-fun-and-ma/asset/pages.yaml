- pgno: 378
  md: 'Then, once we have set up some GUIText, we will set up triggers that designate
    when certain text should appear. Lastly, we''ll tie it all together and work with
    the particularly powerful idea of firing functions contained in one script through
    the commands of another. A quick disclaimer: The method we''re employing here
    will be a great illustration of some concepts within Unity. However, some of these
    things can be done more efficiently and we''ll revisit this mechanism later to
    tighten things up.


    **Step 1:** Open Scene-EntryWay in Unity.


    # GUIText


    **Step 2:** Create a GUIText GameObject. GameObject>Create Other>GUIText. This
    will create a new GameObject in the Hierarchy that contains a GUIText component
    accessible in the Inspector. It will also draw the words "GUI Text" in the middle
    of the Game and Scene windows.


    **Step 3:** Rename the GUIText GameObject to GUITextHints.


    **Step 4:** Select GUITextHints in the Hierarchy and in the Inspector change the
    Anchor to Lower Center. Change Alignment to Center. Change the Font Size to 30
    (or to taste). Finally use Unity''s sliding value arrows to change the Pixel Offset
    Y and pull the GUIText to the bottom of the screen (Figure 13.2).


    ![](img/0285f88bc840f313779e011725b623a5_378_0.png)


    FIGURE 13.2  Settings and results of the GUIText adjustments.


    # Why?


    GUIText has a few more options than the GUITextures, and some that are quite handy.
    For instance, Anchor allows for a different axis for the text. With a lower center
    for the Anchor setting and a center setting for the Alignment, we can easily make
    sure that the text is centered at the bottom of the screen. This is especially
    powerful because later we will be dynamically adjusting the text that actually
    appears, and these settings will ensure that the block of text down there has
    a quick and reliable typographical layout.'
  merge: -1
  img_proc: true
