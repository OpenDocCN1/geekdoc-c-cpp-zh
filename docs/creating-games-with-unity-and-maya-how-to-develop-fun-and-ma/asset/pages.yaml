  md: '**FIGURE 8.44** Continued tweaking of existing polygons; specifically working
    on the lobe


    ![](img/0285f88bc840f313779e011725b623a5_227_0.png)


    # ### Moving Down the Neck


    +   - **Step 63:** Select and Extrude the edges on the back of the head to create
    the rough outline of the back of the neck (Figure 8.45).

    +   - **Step 64:** Extrude the front of the neck from the chin/mandible down.
    Be sure to merge up the two flaps of polygons emerging down (highlighted in Figure
    8.46).


    **FIGURE 8.45** Extruding back of the neck.


    ![](img/0285f88bc840f313779e011725b623a5_227_1.png)'
