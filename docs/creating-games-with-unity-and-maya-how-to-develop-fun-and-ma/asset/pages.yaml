  md: '**FIGURE 3.24** Arranging shells.


    ![](img/0285f88bc840f313779e011725b623a5_77_0.png)


    # ### Why?


    We are going to sew some of these shells together so that the texture can move
    uninhibited across the surface. When we used Automatic Mapping the shells were
    all laid out well for us; but not so when we manually map.


    **Step 35:** Resize shells to appropriate sizes. Earlier we learned that when
