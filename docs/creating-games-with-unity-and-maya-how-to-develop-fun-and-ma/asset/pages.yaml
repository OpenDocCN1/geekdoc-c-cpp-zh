- pgno: 93
  md: '**Step 13:** Open the Hypershade and graph the EntryWay_DockCement_Mat material.
    Open the Hypershade with Window>Rendering Editors>Hypershade. In the Hypershader
    choose the Materials tab, and then select the EntryWay_DockCement_Mat swatch.
    Select Graph>Input and Output Connections. This should appear like Figure 4.7.


    ![](img/0285f88bc840f313779e011725b623a5_93_0.png)


    *FIGURE 4.7* Graphing the EntryWay DockCement_Mat material.


    # Why?


    What you''re seeing here is how the nodes are connecting to create the material.
    The far left node indicates how the texture is placed within the UV space (by
    default 1:1), the second is actually the checkerboard texture, the third is the
    shader material, and the far right is the shading group. Once the material is
    graphed like this, it''s easy to see how the material is assembled and how to
    make the desired changes.


    **Step 14:** Rename the texture node. Still in the Hypershade, double-click the
    texture node (the one with pink at the bottom). This will open the node in the
    Attributes Editor. There in the file: input field enter `EntryWay_DockCement_Color`.


    # Why?


    This is a bit of housekeeping that could have been done earlier. When a file node
    is created while creating a material, Maya automatically names it file#. In my
    case it was at file12. The problem is that this makes it hard to keep track of
    what nodes are where. Especially when there are so many checkerboards, it can
    become very difficult to see them visually. By taking a moment to rename, it becomes
    clear (especially to any other artists who may access this file later) what is
    going on.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '**Step 15:** Replace the checkerboard with the new EntryWay_DockColor. Still
    in the Attributes Editor, look at the Image name input field. It should read:
    `sourceimages\Checkerboard.psd`. To change out the cement texture, click the folder
    icon to the right of the input field. Then, in the Open dialog box that comes
    up, choose `EntryWay_DockColor.jpg`. Click Open (Figure 4.8).


    ![](img/0285f88bc840f313779e011725b623a5_94_0.png)


    # Why?


    So what just happened? Notice that the entire dock didn’t change; this is by design.
    In the previous chapter we assigned different materials to different parts of
    the dock. When we swapped out the checkerboard and defined a different image to
    describe the color attributes of the material, only the polygons with the EntryWay_DockCement
    material changed. Now we can adjust the UV sizes to make this texture the right
    size.


    # Warnings and Pitfalls


    If you press the folder button and are not taken directly to the sourceimages
    folder of the project, or if EntryWay_DockColor isn’t sitting there waiting, stop.
    It means you are either in the wrong project or you’ve saved the texture file
    to the wrong location. Take a moment and either reset your project or track down
    where you’ve errantly saved the file and get things in order.


    **Step 16:** Adjust the UVs to taste. Select the dock and choose Window > UV Texture
    Editor. Select the UVs that define the part of the dock that is our cement and
    scale (in all directions by dragging on the yellow square in the middle) the UVs
    up so that they become larger (meanwhile, your texture will begin to tile in the
    View panel). Watch the View panel as the handles are dragged in the UV Texture
    Editor to see how the size of the texture changes on the surface (Figure 4.9).


    # Tips and Tricks


    Within the UV Texture Editor notice that multiple textures can be displayed in
    the Textures drop-down menu. This is because (in this case) we have multiple materials
    assigned to a single mesh. Sometimes when working with UVs it will be important
    to see how the UVs align with a particular texture, so toggle through them here.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '**FIGURE 4.9** Scaled UVs to allow multiple repeating texture.


    ![](img/0285f88bc840f313779e011725b623a5_95_0.png)


    # ### Conclusion


    And there you have it. This same technique will work for most any texture that
    needs to be tiled. Admittedly, it can get trickier for surfaces like (ironically)
    tile, where getting the ends to line up can take some deft handling. But, the
    work will pay off. As large surfaces become visible, the effective texture will
    pay visual dividends down the road.


    Notice that there are some good things happening here. Zoom down and place the
    camera about where a player would be in the game; the texture should hold up pretty
    well. However, when the camera is way up (as in Figure 4.9), the repeating pattern
    will be pretty clear. Some of this will become a nonissue once the scene is baked,
    and since we are never very high in relation to this dock, it''s unlikely we''ll
    notice the repeating pattern. If, in the game, we do have a distracting repeating
    pattern, we can go back and scale the texture a bit, or work with a larger sampling
    of texture, or both.


    # ## Tutorial 4.2. Nontiled Textures and Their Dirt


    One of the biggest errors of young 3D students is that they are too clean. Yes,
    I agree it''s hard to believe that 18- and 19-year-olds can ever be accused of
    that, but in 3D this is almost always the case.


    This is what happens: The student goes out and does some good research, tracks
    down some great resource textures, creates the appropriate paintings of the surface
    from copying and pasting the necessary textures together, and then slaps that
    onto the surface.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "The problem emerges once everything is put together. In reality, the region\
    \ where two surfaces meet is a really interesting area. It collects all sorts\
    \ of dirt, grime, and visually interesting things if it's an inside corner (think\
    \ of where the floor meets the wall), and collects all sorts of drips on outside\
    \ corners. When the texture artist fails to take this into account, the scene\
    \ loses much of the visual information that clues the eye in on these all-important\
    \ corners.\n\nFor the first part of this tutorial, we will look at how to put\
    \ together a texture-for-texture space without overlapping UVs. For the second\
    \ part, we will take this texture and dirty it down.\n\n**Step 1:** Select an\
    \ object with nonoverlapping UVs and open the UV Texture Editor (Figure 4.10).\
    \ For this tutorial, I will be texturing the small portico (downloadable at www.Creating3dGames.com)\
    \ of the main door that lets Aegis Chung into the facility.\n\n> **Warnings and\
    \ Pitfalls**\n> \n> Make sure that the object is selected in Object Mode; if in\
    \ any component mode, the next step won't work. Outputting a UV Snapshot only\
    \ works when the whole object is selected, not just its parts.\n\n![](img/0285f88bc840f313779e011725b623a5_96_0.png)\n\
    \n# UV Snapshots\n\n**Step 2:** Output a UV Snapshot. When the UV Map is displayed\
    \ in the UV Texture Editor, choose Polygons->UV Snapshot (al within the UV Texture\
    \ Editor). Within the UV Snapshot window, make sure Size X and Size Y both read\
    \ 2048 and that the image format is set to TIFF. Change the name to EntryWay_PorticoUV.\n\
    \n# Tips and Tricks\n\nNotice that the File Name input field includes a path.\
    \ Notice that this path is (or should be) the project file and the images folder\
    \ within the project file. The images folder is one of the default output locations\
    \ for Maya. Once again, having the project set correctly raises its head.\n\n\
    # Why?\n\nWhy 2048x2048? First it's a power-of-two value texture. But why not\
    \ 1024x1024 or even 4096x4096 or even 512x512? This is a good question; what size\
    \ to make a texture is dictated largely by experience and the situation."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'In this case, we will be spending some time within this portico, and so we
    want to have a reasonable resolution so that the walls that surround the player
    hold up to visual scrutiny. Now, we may discover that we don''t need 2048×2048
    (that is in fact a big texture). I suspect a 1024×1024 might do the job just fine.
    But because Unity allows for some really easy adjustments in the size that it
    imports files to, there is little penalty from creating the texture a little larger
    for now, and then optimizing if need be or the situation allows. It''s better
    to have the resolution and not need it than the other way around.


    **Step 3:** Open the UV map in Photoshop (Figure 4.11).


    FIGURE 4.11 UV Snapshot.


    ![](img/0285f88bc840f313779e011725b623a5_97_0.png)


    # ## Preparing the UV Snapshot for Painting in Photoshop


    **Step 4:** Copy the UV guidelines to another layer. The easiest way to do this
    is to open the Channels palette (Window>Channels). Ctrl-click the Alpha 1 channel
    (this will select the white lines), choose Edit>Copy, and then Edit>Paste. Open
    the Layers palette and rename this new layer UV Guidelines.


    # ### Why?


    The UV Snapshot in Photoshop is the image that will serve as the guide to know
    what texture is being applied where. If a red line is painted through the middle
    of a wall on this map, bring this map into the color channel of the material,
    and the red line will appear in the scene (on the wall). This is tremendously
    powerful since texture is placed right where it should be on the mesh.


    However, painting on top of the default image is a problem because it covers up
    the guides that help to know where on the surface is being manipulated. By duplicating
    the UV lines onto another layer, new layers can be created between this new UV
    Guidelines layer and the Background layer. So as the texture map is created it
    remains clear where on the object you are applying texture.'
