  md: '![](img/0285f88bc840f313779e011725b623a5_344_0.png)


    # # Unity Sound


    Thus far we have imported levels that were modeled in Maya into Unity and used
    Unity''s atmospheric effects to add fog and particle-generated steam. We''ve also
    brought in an animated character who runs an idle animation in a loop. We''ve
    even used Unity''s animation tools to create animation in the game engine.


    In this chapter we will make the experience further immersive with sound. Unity
    3 includes some very nice additional sound mechanisms that allow for a very interesting
    experience for the player. Setting up sound is actually very quick and simple
    in Unity and is one of my favorite parts of the engine. So, this chapter will
    be short, but the overall effect will be huge.


    # ## Get the Sounds


    This is often a problem, especially for students. Where to get those sounds that
    can be used legally? On the one hand, if you go and record your own sounds they
    are yours to use as desired. Unfortunately, most game designers haven''t the equipment
    or know-how to record good quality audio samples. Luckily, online there are lots
    of good libraries that include some very reasonable licensing fees. Among my favorites
    is http://www.sounddogs.com.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'It allows for low-resolution versions of its sounds to be downloaded and tested.
    Then if the sound clip is effective, a license can be purchased for (usually)
    very reasonable terms. For commercial projects this is a great way to go because
    it provides good quality sounds with a good license.


    An alternative, especially for students learning, is http://www.freesound.org.
    The FreeSound Project has some great sounds released under a Creative Commons
    Sampling Plus License (although you need to register to download clips). Take
    a close look and read the full license for details of how to use the sound and
    how it can be included in your project.


    For this chapter, go to either of these sites, or to some other sound source of
    your choosing, and pick up (as in download to the hard drive and save within the
    Unity project file for incursion; see step 1 in the upcoming tutorial for details)
    the following sounds:


    +   1. **Waves**: This should be a sound as though you are hearing the waves rolling
    up on the shore. The version I am using is "oceanwavescrushing.wav" (http://www.freesound.org/samplesViewSingle.php?id=48412).
    We will use this sound whenever around the water of the EntryWay scene.

    +   2. **Mechanical rumble**: This should be a low rumble as though heavy machinery
    can be heard through a heavy door. We will use this sound when approaching the
    entrance to the facility. I used "low_register.mp3" (http://www.freesound.org/samplesViewSingle.php?id=33843).

    +   3. **Walking sound**: This should be a subtle sound of someone walking (preferably
    on cement). This sound is easy to overdo, so be sure remember this guy is supposed
    to be stealthy—so no stomping. I used "WalkGravelLoop.wav" (http://www.freesound.org/samplesViewSingle.php?id=31152).
    An alternative is "running gravel of dry leaves loop.wav" (http://www.freesound.org/samplesViewSingle.php?id=54778).

    +   4. **Pistol shot**: This will be used when Aegis (the player) fires his pistol.
    I used "Gun-Pistol(One Shot).wav" (http://www.freesound.org/samplesViewSingle.php?id=37236).

    +   5. **Others as desired**. As you walk through the model, other sounds will
    become obvious to use. Find some and place them as desired.


    > **Tips and Tricks**

    > Often a bit of editing is needed before a sound is "just right." There are many
    powerful audio editing tools on the market that can be purchased for high-end
    sound editing. However, if you are looking for a cheap (as in free) and reasonably
    powerful editing software, take a look at Audacity (http://audacity.sourceforge.net/).
    It''s Open Source and available for Mac and PC. A very handy tool to have for
    those quick tweaks, or for the occasional need in format conversion (although
    Unity is very tolerant of sound formats).'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# ## Sound Listener and Sound Source Paradigm


    Unity works with a fairly straightforward metaphor for sound—namely, one object
    contains or emits the sound, and another object hears it. Strictly speaking, an
    Audio Source (emits the sound) is a component of a GameObject placed in the scene.
    This means any object (ticking bomb, dripping pipe, etc.) can have an Audio Source
    component and thus can be the source of audio. However, an empty GameObject can
    also be created with the express purpose of emitting sound from a certain locale.


    Similarly, the Audio Listener is also a component of a GameObject in the scene.
    Cameras automatically include the Audio Listener component. So our First Person
    Controller''s Main Camera is always listening for any Audio Sources in the scene
    and then plays that sound through the player''s speakers. Because this is already
    in effect (you can take a look at it in the Inspector when Main Camera is selected),
    and because the Audio Listener really has few options, our main focus will be
    on creating and adjusting our Audio Sources.


    # ## Tutorial 11.1: Placing Sound in Unity


    As discussed earlier, Audio Source components can be added to any GameObject;
    however, I prefer to always assign static (as in not moving around within the
    scene) Audio Sources to GameObject specifically created to house them. It just
    allows for a much quicker understanding of the scene when I can see the Audio
    Sources in the Hierarchy as opposed to searching them out if they are attached
    to other GameObjects. This tutorial is built up on this preference.


    +   1. **Step 1:** Be sure that the audio clips have been imported in Unity. In
    the Project panel, choose Create>Folder. Name the new folder Sounds and make sure
    all the sounds downloaded and assembled reside here. Alternately, this organization
    could have been done previous to placing the assets into the Unity project folder
    and simply placing the entire Sounds folder within it.


    # ### Why?


    Unity is pretty friendly when it comes to sounds. Among the sounds included in
    my project is an .aif, .wav, and .mp3; and all came in without so much as a complaint
    from Unity. It''s one of the real benefits of Unity''s open arms approach.


    # ### Tips and Tricks


    If an audio clip is selected in the Project panel, the Inspector will show that
    clip. Of particular use is the Preview pane that will appear at the bottom of
    the Inspector. Here you can take a quick listen to any sound clip that is part
    of the Unity project.'
  merge: -1
  img_proc: true
