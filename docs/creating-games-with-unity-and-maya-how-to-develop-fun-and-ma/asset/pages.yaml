- pgno: 255
  md: '# # UV Mapping


    UV mapping characters can be a daunting task. When UV mapping the level, we were
    generally working with fairly simple shapes that lent themselves easily to planar
    maps and cylindrical maps. The human form really is much more complex than that
    at first blush.


    Fortunately, there have been some important tools that have emerged in the last
    few years that can assist in efficient and quickly created UV maps. Maya actually
    has some of my favorite UV editing tools; however applications like Modo have
    emerged with some really powerful UV tools that are much more efficient than Maya''s.
    To make matters even more complicated, there are free tools like RoadKill (http://www.pullin-shapes.co.uk/page8.htm)
    that integrate fairly seamlessly with Maya that allow for some extraordinarily
    fast UV mapping using all the latest pelt/LCSM mapping technologies. If you do
    a lot of UV mapping, or plan to, learning one of these two tools may be in your
    best interest.


    With all that said, Maya''s UV mapping tools have done some catching up in recent
    versions, and many of the tools and techniques available in Modo and Roadkill
    are available in Maya as well. There are enough available that we will stick to
    Maya''s tool set for this chapter''s tutorials. Many of the techniques used for
    UV mapping the human form are similar to those used for mapping the level, so
    building upon the toolset you are already familiar with will move us along quickest.


    # ## Tutorial 9.1: Character UV Mapping


    In this tutorial we will be doing several things. First, Maya''s UV tools are
    powerful, but sometimes require some very specifically created polygonal structure.
    Before we even start building UV maps, we will take a moment to make sure that
    the geometry built in the last chapter does indeed fit into these Maya-imposed
    requirements. The requirements actually are good to keep our eye out for (they
    are mostly concerned with the problems that arise from nonfour-sided polygons)
    since identifying and fixing them at this state will ultimately save time within
    Unity.


    # ### Mesh Inspection and Cleanup


    +   1. **Step 1:** Open Maya and set the project to Incursion-Maya.

    +   2. **Step 2:** Open AegisChung.mb.

    +   3. **Step 3:** Turn on Backface Culling. In the persp view panel, choose Shading>Backface
    Culling (Figure 9.1).


    > > **Why?**

    > >

    > > Figure 9.1 shows the results of the last chapter with backface culling activated.
    It appears that the entire body has the normals facing the wrong way. If you are
    using the version of Aegis Chung that is included'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'on the support web site (http://www.Creating3DGames.com), much of this cleanup
    has been done. But if you are using your own version there might be a lot of this
    type of cleanup. In the last chapter where this was modeled, we could have modeled
    with backface culling turned on to begin with, but I often find modeling that
    way tough to do as some objects that are modeled may not be seen at all at a certain
    angle, so I prefer to model characters with backface culling turned off. Unfortunately,
    that preference usually leads to a bit of cleanup later. Luckily, the cleanup
    is fast.


    ![](img/0285f88bc840f313779e011725b623a5_256_0.png)


    **FIGURE 9.1** Results of activating backface culling. Uh oh.


    **Step 4:** Fix errant normals. If your model has normals facing the wrong way,
    switch to face mode and double-click one of the incorrectly oriented faces. This
    will select outward until it hits polys that have normals facing in another direction.
    Select Polygons>Normals>Reverse.


    **Step 5:** Double-check one more time that all normals are correct.


    # ## Why?


    Reversed normals are just a general pain. It''s always a major annoyance to discover
    a see-through polygon in Unity when you''ve moved on to other Unity-specific issues.
    With a bit of careful inspection, a lot of bothersome stops in procedure can be
    prevented.


    **Step 6:** Hunt and destroy five-sided polygons. In object mode, select AC_AegisChung.
    Choose Mesh>Cleanup... In the Cleanup Effect section change the Operation radio
    button to Select Matching Polygons. In the Fix by Tesselation section check the
    Faces With More Than 4 Sides check box. Click the Apply button (Figure 9.2). This
    will highlight all the faces with more than four sides. Use the Split Polygon
    tool to cut these bad boys into three- and four-sided polygons.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/0285f88bc840f313779e011725b623a5_257_0.png)


    # **Why?**


    This cleanup trick was discovered by one of my students, Giovanni Sabella, in
    our Advanced Game class. Giovanni was having problems getting meshes to work well
    in Mudbox and discovered that most of the normals painting applications also had
    some very specific requirements for polygon topology because they did so much
    subdividing. But I''ve found this technique to be invaluable when preparing for
    UV mapping as well. The UV Unfold tools and UV smooth tools make shells disappear
    if the appropriate topology isn''t present. You learn the best stuff from students—I
    refer to this in class as the Sabella Technique.


    +   1. **Step 7:** Repeat steps 4 through 6 on the weapons as well.

    +   2. **Step 8:** Delete all history. Edit>Delete All by Type>History.


    # **Why?**


    The cleanup steps have created bits of history throughout the scene. To make sure
    that steps in the future are working with the cleanest collection of data possible,
    always delete the history before moving onto other big steps.


    # **Planning**


    In the last chapter we took great pains to make sure the model was one single
    mesh with the idea that calculations for joint-driven deformations were much faster
    with a minimal number of meshes. However, even though it is a single mesh doesn''t
    mean that the UV map has to be made of one shell. For that matter, it doesn''t
    even have to be one material (or texture). For instance, if a character had shiny
    armor plating part of his body but matte chunks of a material on other parts,
    different materials could be created and applied on a per-poly basis. Then'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'In Unity the shaders could be constructed to provide that interesting balance
    of high specularity and matte surfaces. Of course this comes with a cost, a single
    object with multiple materials means more draw calls to draw that single object,
    so generally this niche effect has to be weighed against the performance cost.


    In this case we will create a texture atlas for all three weapons, but the entire
    character mesh (AC_AegisChung) along with its eyes (AC_LeftEye and AC_RightEye)
    will use one texture. This means that all the UVs for the character must reside
    in the 1, 1 quadrant of the UV Texture Editor. But, because there are obvious
    changes in what his “real” materials are (he wears a shirt tucked into a belt
    attached to his pants, for instance), there are some obvious places where seams
    can be allowed.


    This should actually come as a great relief. Trying to get a form as complex as
    the human one into one seamless (or nearly seamless) UV shell without a lot of
    distortion is a very difficult task. With the ability to break the character up
    into various shells dictated by the change in fabric on his body brings with it
    tons of flexibility. When you build a game with a nude protagonist though, well,
    then you’ve got issues.


    Figure 9.3 shows a quick schematic of places where obvious seams would occur.
    Although in your own work these zones can usually be identified by a quick visual
    glance at the form (no need to create this kind of schematic), this image should
    show the idea of breaking shells up by the breaks in fabric.


    One other note about seams that we will address again later in the tutorial: an
    obvious place to plan seams are where there are clothing seams. Clothing


    ![](img/0285f88bc840f313779e011725b623a5_258_0.png)'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'has seams where strips of fabric are sewed together. Look at most any shirt

    and where the sleeves are connected to the bodice section, there is a seam.

    Your pants likely have a seam down the inside of the leg and another on the

    outside. These clothing seams are perfect places to allow UV seams to occur

    and allow for much more easily created distortion-free shells.


    # ### New Material


    Step 9: Create a new material for Aegis. Right-click-hold on Aegis and

    choose Assign New Material from the hotbox menu that comes up.

    Create a lambert material in the Assign New Material window. This

    should open the new material in the Attributes Editor. Name the material

    AC_AegisChung_Mat. In the Color channel import our good friend

    Checkerboard.psd (which should still be sitting in the sourceimages

    folder of the project). The results will be a tremendous mess (Figure 9.4).


    **FIGURE 9.4** Aegis with

    Checkerboard.psd assigned.


    ![](img/0285f88bc840f313779e011725b623a5_259_0.png)


    # ### Tips and Tricks


    Remember that to see any texture applied to a mesh, 6 must be pressed

    on the keyboard while the mouse is in the view panel the texture should

    be visible in.


    # ### Why?


    A mess indeed. A close look at the mesh will show chunks of him without

    texture, and other parts with squished checkers and still others with

    stretched checkers. For an even better look at the mess, open the UV

    Texture Editor (Window>UV Texture Editor) and take a look at that

    (Figure 9.5). Basically, the UVs are all over each other. There are UVs that

    fill the entire quadrant, and others that may be just a sliver. Either way,

    ultimately, the goal is to take this jumbled collection of UVs and unfold

    them all into easy-to-see, easy-to-paint shells.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/0285f88bc840f313779e011725b623a5_260_0.png)


    FIGURE 9.5 The UV Texture Editor before we work our magic.


    # Cylindrical Shapes and Projections


    We''ll start with the arms. UV mapping the arms is really picking some of the
    low-hanging fruit. The reason why the arms are fairly easy is that they are essentially
    cylinders, which lends themselves quickly to a cylindrical projection.


    Step 10: Make a selection similar to Figure 9.6.


    ![](img/0285f88bc840f313779e011725b623a5_260_1.png)


    FIGURE 9.6 Initial selection for UV Mapping the arms.


    # Tips and Tricks


    Often, when working with checkerboard textures, swapping to a smooth shade without
    texture display (press 5 on the keyboard) makes specific selection of polygons
    much easier.


    # Why?


    This selection is important because it shows where seams are obviously going to
    be (at the seam of the shoulder and at the top of the gloves). But it also is
    an important selection for what it does not include (the pouch up on the outside
    of the deltoid). This pouch is likely sewn onto the arm'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'sleeve, and thus there would be a seam all the way around where the pouch attached
    to the sleeve as well. To minimize distortion on the arm, this pouch will be mapped
    separately.


    # Tips and Tricks


    When selecting objects or components in Maya (especially when detailed selections
    like this are involved) it''s important to remember a few things about Maya''s
    selection paradigm. First, remember that Maya (by default) selects through the
    object. So as a Marquee selection is made around a collection of polygons, remember
    it is selecting the polygons on the back side of the mesh as well. Lots of students
    don''t like this at first, but in the long run it can be a huge time-saver.


    Second, remember that Shift-selecting an object or component will select the object
    if it is not selected, but will deselect an object or component that is already
    selected. Ctrl-selecting will always deselect, and Shift-Ctrl-selecting will always
    add the object or polygons to the selection.


    **Step 11:** Create a cylindrical projection. Select Polygons>Create UVs>Cylindrical
    Mapping. A new set of manipulators should appear similar to Figure 9.7.


    ![](img/0285f88bc840f313779e011725b623a5_261_0.png)


    FIGURE 9.7 Immediately after a cylindrical mapping function and the new manipulator
    handles that appear (emphasis added).


    # Why?


    It''s important to understand what we''re seeing in Figure 9.7. What the manipulator
    is displaying is a semicylinder wrapped halfway around the arm from the front.
    This means that the texture would be repeated for the back half (obviously not
    what we want). Additionally, the default projection of the cylindrical mapping
    is straight up and down, but the shape of the polygons being mapped are not straight
    up and down. Finally, currently, there would be two seams (one where the half
    cylinder starts and another where it ends), and one of those seams would be running
    down the outside of the arm—not a good place for a seam. We need to adjust this.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Tips and Tricks


    These manipulator handles are important since they will allow us to refine the
    projection to closely match the shape of the polygons being mapped. Sometimes
    though, if a click goes awry, the handles can disappear. If this happens and they
    disappear, do the following. First, change to object mode and select the mesh.
    Next, open the Channel Box and look for a node (in the INPUTS section) called
    polyCylProj1 (or some other number). Select this node, and then choose the Show
    Manipulator tool (the ninth tool down in the toolbox (just beneath the Soft Selection
    tool).


    **Step 12:** Expand the projection so it completely surrounds the arm. Do this
    by dragging the red rectangles that are at either end of the line that is at the
    cylinder’s equator (Figure 9.8). Make sure they touch.


    ![](img/0285f88bc840f313779e011725b623a5_262_0.png)


    FIGURE 9.8 Expanding the coverage of the cylindrical projection.


    # Why?


    This is an important step because it makes it so the texture does not repeat (it
    was using the texture once for the front of the arm and once for the back, which
    meant two seams). Now, the texture will wrap completely around the arm with no
    repeating, and leave us with one seam (currently across the back of the arm).'
  merge: -1
  img_proc: true
- pgno: 263
  md: '**Step 13:** Rotate the seam to the inside of the arm. The center circle of
    the projection manipulator is a handle itself. Click-drag this handle to rotate
    the seam (where the two red rectangle handles meet) to the inside of the arm (Figure
    9.9).


    **FIGURE 9.9** Rotating the seam to the inside of the arm.


    ![](img/0285f88bc840f313779e011725b623a5_263_0.png)


    # Why?


    Of constant concern to the artist tasked with UV mapping should be where to hide
    the seams. Hiding the seam across the back of a character might seem like a good
    idea at first until the game becomes third person and suddenly all we see is the
    back of the character. A much smarter place to hide seams for things like legs
    and arms are where the seam is tucked between two surfaces. It turns out that
    the inside of the arm and leg also have natural seams since that''s where the
    fabric of shirts and pants are often sewn together.


    **Step 14:** Rotate the projection to match the rotation of the arm. At the bottom
    edge of the projection cylinder is a little red T (Figure 9.10, left). Clicking
    this T will reveal a new set of manipulation handles (Figure 9.10, right) that
    allows the projection to be moved, scaled, or rotated. Use the rotation handles
    to rotate the projection to more closely match the angle of the collection of
    polygons being mapped.


    # Tips and Tricks


    Getting back to the first set of manipulation handles can be done by clicking
    the little red T again.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/0285f88bc840f313779e011725b623a5_264_0.png)


    **FIGURE 9.10** Rotating cylindrical projection to match rotation of the arm.


    **Step 15:** Press 6 on the keyboard to see how the checkers are falling into
    place (Figure 9.11).


    ![](img/0285f88bc840f313779e011725b623a5_264_1.png)


    **FIGURE 9.11** Checkers showing well-distributed texture.


    **Step 16:** Adjust the scale if needed to eliminate most distortions in the checkers.


    **Step 17:** Move this new shell to the side in the UV Texture Editor. Open the
    UV Texture Editor and this projection should still have its handles visible there.
    Grab the manipulator handles by either the yellow circle in the middle or the
    red triangle handle and move this projection (and its shell) away from the mass
    of other UVs (Figure 9.12).


    # ### Why?


    Yes, this shell is much to big—it''s taking up the size that the entire form will
    eventually take up. That''s OK. Right now the shells should be big enough to easily
    illustrate the size of the checkerboard pattern so we can see relative sizes.
    Later the shells will be scaled and arranged.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# FIGURE 9.12


    Sequestering the newly created shell.


    ![](img/0285f88bc840f313779e011725b623a5_265_0.png)


    **Step 18:** Use the Smooth UV tool to unfold the new shell. In the UV Texture
    Editor right-click-hold and select UV from the hotbox (to tell Maya you want to
    deal with UVs now). Marquee select this new shell. Activate the Smooth UV tool
    in the top-left corner of the UV Texture Editor (Figure 9.13). This will show
    two little buttons at the bottom left corner of the shell called Unfold and Relax.
    Drag the Unfold button left and right to see the shell relax. Be sure to watching
    the view panel as well to see the checker pattern relax into better proportions.


    # FIGURE 9.13


    Using the UV Smooth tool to relax a shell.


    ![](img/0285f88bc840f313779e011725b623a5_265_1.png)


    **Step 19:** Repeat process for the other arm.


    **Step 20:** Repeat this technique for each of the legs (Figure 9.14). Project
    one leg at a time and come all the way up to the bottom of the belt pouches. Note
    that there will be several shells created through this process. Be sure to use
    the UV Smooth tool to unfold each individually.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/0285f88bc840f313779e011725b623a5_266_0.png)


    FIGURE 9.14 Cylindrical mapping the legs.


    # Tips and Tricks


    Inevitably after making a projection you will discover that the projection didn''t
    cover enough polygons or you ended up grabbing polys you didn''t need. No worries.
    If a polygon is missing, just make the selection again and create another mapping.
    If you grabbed too many, just move the extras aside and pick them up in further
    mapping functions.


    # Sewing Up Certain Seams


    Among the shells are two separate shells for the fly (crotch) area. While there
    usually is a seam that runs along the side of the zipper and then down through
    the middle of the crotch, getting the zipper flap to look right when the two shells
    are separate as they are can be quite difficult.


    This can be an issue for the butt area and various other places as UV mapping
    occurs. The fly area just provides a quick and easy example of how projected shells
    can (and should) be combined to assist in later texture painting.


    **Step 21:** Find the edges where the fly is split. In the persp view panel, select
    a few of the edges along the seam. Take a look in the UV Texture Editor to find
    out what these edges are (Figure 9.15).'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'FIGURE 9.15 Tracking down which edges in 3D are represented in the UV Texture
    Editor.


    ![](img/0285f88bc840f313779e011725b623a5_267_0.png)


    Step 22: Find matching-sized shells and remove faces that offset the balance of
    the new combined crotch. The steps ahead work easiest if there are no flaps of
    polygons hanging off of a shell (your particular UV layout may be different).
    In the UV Texture Editor, begin selecting down the fly on either shell until the
    end is reached of the smaller of the two shells. Select the edges along the end
    of that desired shell (where it connects to the unwanted flap) and choose Polygons>Cut
    UV Edges. Then, select a UV on the chunk of the shell to remove. Ctrl-right-click-hold
    and select To Shell, and then use the Move tool to move this new shell away (Figure
    9.16).


    FIGURE 9.16 Finding and creating two shells that will share a common edge without
    additional flaps.


    ![](img/0285f88bc840f313779e011725b623a5_267_1.png)


    > > **Why?**

    > >

    > > Remember that the idea here is that mapping the crotch will be much easier
    if things like the fly area are one shell. Your particular situation may vary,
    but in step 22, we''re looking at getting rid of flaps of stuff that will make
    combining the crotch and then preparing the shells combine to finish the crotch.'
  merge: -1
  img_proc: true
- pgno: 268
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 269
  md: 'FIGURE 9.19 Pouch to map.


    ![](img/0285f88bc840f313779e011725b623a5_269_0.png)


    **Step 27:** Map the pouch. Choose Create UVs>Automatic Mapping (Options). Make
    sure the Planes setting is set to 6. Press Project. In the UV Texture Editor the
    faces that have just been mapped will be highlighted in salmon. Before selecting
    anything else, in the UV Texture Editor right-click-hold and choose UV. Immediately
    Marquee select all the faces that are in that top-right quadrant. At this point,
    all the other faces will show up in that space, but if the Move tool is immediately
    used, the UVs for the pouch can be moved off to the side (Figure 9.20).


    FIGURE 9.20 Initial projection on the pouch.


    ![](img/0285f88bc840f313779e011725b623a5_269_1.png)


    **Step 28:** Sew it up. Figure 9.21 shows the pouch sewn up. The process was the
    same as sewing up the pillow back in the set design: select an edge on the outside
    of a shell (which will select an edge elsewhere on another shell), check in the
    3D view if these edges should be sewn together, then use Polygons>Move and Sew
    UVs. Repeat until the pouch is assembled.


    # **Why?**


    Note that there are two shells here—one is the pouch and the second is the clasp.
    Since the clasp is another type of material, it''s an easy place to leave a seam.
    If this shell were to be sewn onto the larger shell, the results would be a very
    distorted shell.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/0285f88bc840f313779e011725b623a5_270_0.png)


    **FIGURE 9.21** Shells assembled via Move and Sew UV.


    **Step 29:** Use the Smooth UV tool and Unfold the shell to relax it.


    **Step 30:** Rotate and organize the shells. The big pouch shell will be rotated
    to make for easiest texture painting, while the latch will be tucked in to make
    use of the texture space (Figure 9.22).


    ![](img/0285f88bc840f313779e011725b623a5_270_1.png)


    **FIGURE 9.22** Completed pouch.


    **Step 31:** Repeat for all other squarish pouches (Figure 9.23).


    ![](img/0285f88bc840f313779e011725b623a5_270_2.png)


    **FIGURE 9.23** UV-mapped pouches, holsters, and sheaths—anything that is square.


    # Tips and Tricks


    As the number of shells increase, the number of functions will increase, which
    means the number of nodes increases and the file gets heavier and heavier with
    history. As I was working toward the previous steps, Maya began to get really
    sluggish as it tried to work through all that history for every step. A quick
    Edit>Delete All by Type>History cleans up the history and Maya is snappy again.'
  merge: -1
  img_proc: true
