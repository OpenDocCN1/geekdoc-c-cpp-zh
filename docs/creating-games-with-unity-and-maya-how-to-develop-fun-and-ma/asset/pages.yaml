    \ the emitters are from the player:\n\n```\nprivate var fpcAegis : GameObject;\n\
    \nfunction Start () {\n    fpcAegis = GameObject.Find(\"FPC_AegisChurch\");\n\
    }\n\nfunction Update () {\n    var dist = Vector3.Distance (fpcAegis.transform\n\
