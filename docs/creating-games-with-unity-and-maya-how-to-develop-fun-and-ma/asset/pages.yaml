    The Icon area just defines the icon that will be used to represent the .exe. It
    is populated in the Default Icon area in the Cross-Platform settings. This is
    really just a 2D texture file (the one shown in Figure 18.8 is included in the
    2D Assets folder (called BuildIcon)) that works best (without distortion) if it
    is authored'
