- pgno: 368
  md: "**Step 27:** Play the game. Move the mouse over the buttons and watch them\
    \ light up.\n\n# ### Why?\n\nBut there's a problem, no? The buttons light up but\
    \ they stay lit. The reason for this is that the script is looking for the frame\
    \ where the mouse moves over the button and on that frame it fires the command\
    \ `guiTexture.color = Color (1,1,1);` Then it doesn't do anything to this GameObject\
    \ until the mouse again is over it. It means that the guiTexture node never gets\
    \ the instructions to go back to gray. But we can fix that.\n\n**Step 28:** Reopen\
    \ the OpenSceneButtonsScript script by double-clicking it in the Project panel.\
    \ Add the following text to the script:\n\n```\n```javascript\nfunction OnMouseExit\
    \ ()\n{\n    guiTexture.color = Color (.2,.2,.2);\n}\n```\n```\n\n# ### Why?\n\
    \nTaking a look at this, you can see that the script just watches for when the\
    \ mouse exits the object, and then changes the color to RGB = 0.2 (which happens\
    \ to be the gray of the unhighlighted buttons). So we now have a function that\
    \ does one thing when the mouse is on the button, and another when it leaves.\n\
    \n**Step 29:** Save, check the console for errors, fix any that appear, and test\
    \ the game. The buttons should highlight and darken appropriately.\n\n# ### Recognize\
    \ What's Being Clicked\n\nAlrighty. The buttons highlight and dehighlight, but\
    \ they do nothing when clicked. To make this happen we need to flush out the script\
    \ still further. Now, on the one hand we could create a custom script for each\
    \ button that said OnMouseDown activate the corresponding DataPanel. However,\
    \ this would have to be custom to each button since the Bio button would need\
    \ to activate the DataPanel_Biography object and deactivate DataPanel_Mission,\
    \ but it would be the opposite for the Mission button. Then, the Button_Begin\
    \ would need yet another collection of script to launch the next game level.\n\
    \n# ### If Statements\n\nInstead, let's look at a little more elegant approach\
    \ and modify the existing script to do all of this for us. To do this, we need\
    \ Unity to check the name of the object it is clicking. To do this we need to\
    \ look at the idea of **if statements**.\n\nThe format for if statements goes\
    \ like this (this isn't real code, just an illustration):\n\n```\n```\nif(this\
    \ is true)\n{\n    do these things;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 369
  md: "There are a few ways to ask Unity to check if (this is true). One way is to\
    \ check if two values equal each other. To check this, JavaScript uses two equals\
    \ signs (==). One equal sign is used to define a value, two checks for equivalency.\
    \ So (with some pseudo code):\n\n```\n```javascript\nif (pieceofClothing == \"\
    hat\"){\n    PutOnHead\n}\n```\n```\n\nThis checks if the piece of clothing is\
    \ a hat. If it is (==“hat”), then go ahead and fire the command Put On Head.\n\
    \nWhat we're going to do there is when a button is clicked, Unity is going to\
    \ check to see if the name of the object matches \"Button_Bio\" for instance,\
    \ and then if it does, activate the DataPanel_Biography GameObject.\n\nBut before\
    \ we do that, we need to create some variables to hold the DataPanel objects.\
    \ These three variables can be used in the code to turn the DataPanels on and\
    \ off.\n\n# **Step 30:** Open OpenSceneButtonsScript. At the top of the script\
    \ make the following variable declarations (the entire code is included here with\
    \ the additions in italics):\n\n```\n```javascript\nvar dataPanelBiography : GameObject;\n\
    var dataPanelMission : GameObject;\n\nfunction OnMouseEnter ()\n    guiTexture.color\
    \ = Color (1,1,1);\n}\n\nfunction OnMouseExit ()\n    guiTexture.color = Color\
    \ (.2,.2,.2);\n}\n```\n```\n\n# **Why?**\n\nWe know it's a variable declaration\
    \ because it begins with var. Then we name the variable (dataPanelBiography and\
    \ dataPanelMission) and define its type (tell Unity what kind of information will\
    \ be housed in this variable—in this case a GameObject). This means anywhere else\
    \ in the code we can do things to, or get information from, these new variables.\
    \ Of course, we aren't doing anything with them and we have not linked them to\
    \ our GUI Textures quite yet, but we will.\n\n+   1. **Step 31:** Save and return\
    \ to Unity.\n+   2. **Step 32:** Assign the contents of the variables. Select\
    \ any of the three buttons where this script is attached and look for the Button\
    \ Highlight (Script) component that will show up in the Inspector. Notice that\
    \ there are two new input fields there (Data Panel Biography and Data Panel Mission).\
    \ These are the variables we just declared. Both should read None (Game Object).\
    \ To assign a GameObject to this variable, just drag the GameObject from the Hierarchy\
    \ onto the input field. So for Data Panel..."
  merge: -1
  img_proc: true
- pgno: 370
  md: "Biography, drag the DataPanel_Biography GUITexture object from the Hierarchy\
    \ to its input field. Do the same for Data Panel Mission. Repeat this process\
    \ for each of the buttons.\n\n# ### Why?\n\nNow each button knows what the DataPanels\
    \ are. Now it's time to define what to do with them.\n\n**Step 33:** Open OpenSceneButtonsScript\
    \ (or just swap to UniSciTE or Unitron where the script is likely still open).\n\
    \n**Step 34:** Add the following block (italicized):\n\n```\n```\nvar dataPanelBiography\
    \ : GameObject;\nvar dataPanelMission : GameObject;\n\nfunction OnMouseEnter ()\
    \ {\n    guiTexture.color = Color (1,1,1);\n}\n\nfunction OnMouseExit () {\n \
    \   guiTexture.color = Color (.2,.2,.2);\n}\n\nfunction OnMouseDown(){\n    if\
    \ (name == \"Button_Bio\"){\n        dataPanelBiography.guiTexture.enabled = true;\n\
    \        dataPanelMission.guiTexture.enabled = false;\n    }\n}\n```\n```\n\n\
    # ### Why?\n\nThe first part of the script (function OnMouseDown ()) should be\
    \ pretty clear now. We're telling Unity that when the mouse is clicked on this\
    \ object do the things within it. Then comes the powerful part; when the object\
    \ (what this script is attached to) checks to see if the name is \"Button_Bio\"\
    \ (if name == \"Button_Bio\", and it is important that the name typed here matches\
    \ exactly the name listed in the Hierarchy). If it is, turn on the dataPanelBiography's\
    \ GUITexture component (dataPanelBiography.guiTexture.enabled=true) and turn off\
    \ the dataPanelMission component (dataPanelBiography.guiTexture.enabled=false).\n\
    \nIf the name of the object clicked is not \"Button_Bio\" it moves on to the next\
    \ block of code.\n\n# ### Tips and Tricks\n\nEnabled vs Active: Generally GameObject\
    \ are activated (this.active = true), while components are enabled (this.component.enabled\
    \ = true)."
