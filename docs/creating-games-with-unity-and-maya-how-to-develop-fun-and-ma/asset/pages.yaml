  md: '![](img/0285f88bc840f313779e011725b623a5_296_0.png)


    # # Asset Creation: Maya

    ## Rigging and Skinning

    ## and Unity Animated

    ## Character Importing and

    ## Implementation


    Character creation is fun. Hard, but fun. Undoubtedly if in the previous chapters
    you''ve seen how exciting (but challenging) it is to see a character come together
    and come alive with appropriate UV mapping and carefully constructed textures.
    Of course, up to now all we have is a nicely painted mannequin that, though interesting
    to look at, is still well... dead.


    In this chapter this will change. It''s time to get this character ready to come
    alive. The process of bringing a textured character to life is fun but can be
    a little bit tricky. However, with a bit of care, there is nothing quite like
    a lifelike character moving in a scene to help immerse a player into the game.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# The Process


    The process of getting a lifelike character into a game goes like this:


    +   1. Clean up completed textured models.

    +   2. Create a **rig**. A rig is a collection of **joints** that can deform the
    polygons of a model. This rig can vary greatly in its complexity and flexibility
    and will depend on how much animation is actually needed for a given character.

    +   3. **Skin** the rig to the model. Skinning is the process of attaching the
    rig of joints to the polygons they will affect. Maya 2011 has some new skinning
    tools that help make this process faster.

    +   4. Animate the rig. Animating the rig means rotating (mostly) and moving the
    joints and setting keyframes to record that motion over time. As the joints rotate
    or move, the polygons attached to them will move and viola! the character looks
    alive.

    +   5. Bake the animation. Baking an animation is the process of simplifying animation
    of joints down to the simplest translation or rotation keyframes. This means that
    more-complex (but powerful) tools like IK (inverse kinematics) are baked out of
    the animated output thus the baked version isn''t particularly editable, but the
    results in Unity are much more predictable.

    +   6. Export the baked animated character (as an .fbx).

    +   7. Import the .fbx into Unity.

    +   8. Divide the animations.

    +   9. Call them up either via Play Automatically or via script.


    I know. That looks like a lot at first blush; but it''s actually very manageable
    in these sorts of short discreet steps. In this chapter we will be going through
    a simplified version of this entire process. The rig will be fairly simple but
    will allow us to create some animation quickly.


    Since the game is a first-person shooter, we won''t see the character very much.
    This would be very different for a third-person situation. However, knowing how
    to work with characters is an important part of Unity''s game-creation capabilities,
    so we will make a small mini-level that shows what "you" (Aegis Chung) look like
    before he, er, ... you, undertake your mission.


    # Tutorial 10.1: Rigging


    # Cleanup


    In the process of creating and texturing the character, there undoubtedly was
    quite a bit of Maya construction history that was built up. Each projection and
    every tweak generated a new node, which can be very helpful to be able to access
    while working, but at the end of the process represent a huge amount of extra
    data that we no longer need. Of further concern with these nodes is that the .fbx
    export doesn''t always do well with the nodes and some strange output files can
    be the result.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Cleaning a file frequently is always a good idea. However, before rigging and
    skinning it is especially important to provide Maya with a simple mesh that is
    just polygons and texture without any of the heavy overhead that extra nodes bring
    with it.


    Remember that the point of all these Maya exercises is to get the assets into
    Unity. We have already seen some of the strange things that happen with scaling.
    Scaling a rigged character is certainly possible, but things go much easier if
    the meshes are scaled and positioned correctly within Maya''s space before rigging
    and skinning. It keeps the Maya-centric process cleaner, and makes for more reliable
    translation from Maya to Unity.


    +   Step 1: Open the latest version of Aegis Chung in Maya.

    +   Step 2: Delete all history. Edit>Delete All by Type>History.

    +   Step 3: Name the body mesh `AC_AegisChung`. Name the weapons `AC_Rifle`, `AC_Pistol`,
    `AC_Knife`, respectively. Name the eyes `AC_LeftEye` and `AC_RightEye`.


    # Why?


    AC (of course) stands for Aegis Chung. Giving objects names that help to group
    them together has all sorts of benefits further down the road in Unity including
    the ability to quickly search for all assets dealing with the character by searching
    for AC within Unity.


    +   Step 4: Select all the meshes and press Ctrl-G (Command-G on a Mac) to group
    them together.


    # Why?


    We need to resize Aegis before moving on. By resizing the group, all the parts
    will remain correctly scaled in relationship to each other since they will all
    scale around the group''s center. This is different than selecting all the objects
    and scaling; this will scale them according to each object''s center, and all
    the meshes will separate from each other.


    +   Step 5: Create a new cylinder to use as size reference. Create>Polygon Primitives>Cylinder.
    Select the Cylinder, and then in the Channels Box, click polyCylinder1 in the
    INPUTS section. Change the Radius to 0.25 and the Height to 2 (Figure 10.1). Move
    the cylinder up so that it''s sitting on the “ground” or Z = 0 plane.


    # Why?


    Back when we were modeling the scene, we discussed briefly that one unit in Maya
    roughly equaled one unit in Unity. In Unity, we know that the First Person Controller
    is 2 units tall (about 2 meters). If we can get Aegis scaled correctly in Maya
    it will save a lot of tweaking time when he''s brought into Unity.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '**FIGURE 10.1** Reference cylinder created.


    ![](img/0285f88bc840f313779e011725b623a5_299_0.png)


    **Step 6:** Scale the Aegis group to visually match the cylinder. Be sure to select
    the group (probably best done in the Outliner). Use the Scale tool to scale the
    group down. Note that scaling him will undoubtedly also force the need to move
    him (Figure 10.2). Be sure he is moved so his feet sit on the “floor” or the grid
    at Y = 0. Also make sure to center him so the center of his body is at Z = 0,
    so that when joints are placed from the front view, they will be in the center
    of his body.


    **FIGURE 10.2** Correctly scaled Aegis.


