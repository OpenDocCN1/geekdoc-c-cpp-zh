    \ that provides good results. Luckily, with Beast's implementation, AO can be\
    \ baked right in to the lightmap.\n\n+   **Step 23:** Activate Ambient Occlusion.\
    \ Open the Lightmapping window and click the Bake Object Tab. Turn the Ambient\
    \ Occlusion to 1. Change the Max Distance to 5 and Contrast to 2.\n+   \n+   **Step\
    \ 24:** Bake the scene (Figures 7.32–7.34).\n\n![](img/0285f88bc840f313779e011725b623a5_198_0.png)\n\
    \n![](img/0285f88bc840f313779e011725b623a5_198_1.png)\n\n![](img/0285f88bc840f313779e011725b623a5_198_2.png)\n\
    \n# Conclusion\n\nThere is almost always a bit of massaging that can be done with\
    \ lighting and baking, even after you have to move on to other parts of the game.\
    \ Lighting can be tricky because a scene may look too bright on one monitor and\
    \ too dark on another. There are some predictable differences as a game moves\
    \ from PC to Mac (Mac will be brighter), and it is hard to know when a scene will\
    \ look its best on most platforms. I find that a baked solution that finally looks\
    \ good on my machine needs to be run (as a build) on other machines before I'm\
    \ confident with the solution.\n\nThe baked solutions that Unity produces can\
    \ be further adjusted in Photoshop. When baking is done but before the results\
    \ can be seen, a progress bar will pop up to show that new assets (the newly made\
    \ lightmaps) are being imported. These new assets are actually accessible in the\
    \ Project panel. In this case they"
