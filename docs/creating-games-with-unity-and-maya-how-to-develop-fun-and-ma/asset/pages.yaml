- pgno: 133
  md: 'FIGURE 5.15 Problem area found in a scene once placed in Unity


    ![](img/0285f88bc840f313779e011725b623a5_133_0.png)


    > **Warnings and Pitfalls**

    > In this case the problem was in my construction technique. As I was creating
    the doors, I duplicated a door and then scaled it using X = -1. The tricky thing
    about this is that in Maya, the normals look correct but in Unity they do not.
    The problem here is that by using the Scale X = -1 method, that mesh ends up with
    an Opposite tag that can be tough to track down. A better method is to use Mesh>Mirror
    Geometry when needing this sort of duplication.

    > To fix this problem, either reconstruct using the Mirror Geometry method (and
    then separating the duplicate from the original (Polygons>Mesh>Separate)) or,
    take the errant copy and combine it with the original. Then the normals will appear
    as they will in Unity. Reverse the normals that are reversed (Polygons>Normals>Reverse),
    and separate the two doors. Be sure to rename the newly separated meshes appropriately.


    **Step 22:** In Maya, open the Maya file EntryWay.mb (**not** the .fbx we exported).
    Fix any geometry or normals problems.


    **Step 23:** Export manually from Maya again (File>Export All), although this
    time turn off Embedded Media in the File Type Specific Options section of the
    Export All dialog box. Be sure to overwrite the old EntryWay.fbx in the Assets
    folder of your Unity project file.


    # ## Why?


    Because all the textures have already been imported into Unity, there is no need
    to include them in this new version of the .fbx. It will save loads of time in
    exporting and even more importing. By overwriting the old EntryWay.fbx, the changes
    made here will automatically fix themselves in the instances placed in the scene.


    # ## Conclusion


    So there it is—exporting manually from Maya and importing to Unity. I haven''t
    had a project yet where I didn''t have to do a little bit of tweaking to a level
    once it was imported. But because the process is so quick, it really is quite
    painless to make the necessary adjustments.


    Now the game is playable enough to walk around the scene. It still has a lot of
    problems (no lighting, the sky is that strange flat blue, etc.), but not to fear;
    in the next chapters, we will use some of Unity''s built-in asset creation tools
    to give more life to the scene.


    # ## Homework and Challenges


    **Challenge 1:** If you''ve been building the hallway (along with UV and texture),
    export the hallway from Maya and create a new scene within Unity to place it in
    (save the file as Scene-Hallway). Walk through the level to test.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/0285f88bc840f313779e011725b623a5_134_0.png)


    # Asset Creation: Unity Scenography Creation Tools


    # Asset Creation in Unity


    In the previous chapters we have looked at using Maya as the primary asset creation
    tool. Indeed through the course of those tutorials we molded polygons and textured
    them using a tool completely outside of Unity.


    Generally, this is how games are created: the assets are assembled in a package
    built for 3D object manipulation. Unity is just not a modeler (although it has
    been becoming an increasingly robust animator), and so to get complex forms and
    textures to bring those forms alive the game artist needs another package.


    However, despite these limitations, Unity does have some asset creation capabilities.
    It can do more than simply bring assets in from outside. In this chapter, the
    EntryWay scene that has been created thus far will be further augmented with some
    of Unity''s asset creation tools: built-in prefabs like water, terrains, trees,
    and particles.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# Tutorial 6.1: Adding and Manipulating\nUnity Water, Sky, and Fog\n\nBefore\
    \ getting to the business at hand, it's worthwhile to revisit the idea of Packages.\
    \ In Unity, we have seen how to import meshes that become GameObjects that have\
    \ scripts attached to them and other components. These GameObjects can also have\
    \ scripts and other functionality hung on them as additional components. When\
    \ a GameObject has scripts attached to it, or special shaders to define the visual\
    \ appearance, it can be a fairly robust asset.\n\nTo move these robust assets\
