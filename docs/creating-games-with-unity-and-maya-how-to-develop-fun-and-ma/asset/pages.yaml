- pgno: 340
  md: '# ### Why?


    Ambient light can work great in a lot of situations, but in dramatic lighting
    situations it''s a mess. Turning it off may require some adjustments to the lighting
    scheme, but the look will be much more polished. Importantly, it will allow for
    some truly black areas where white text will show up well.


    # ## Tutorial 10.5: Animating in Unity


    Unity continues to make improvements in functionality and interface. Among the
    biggest jumps has been within its built-in animation system. In many previous
    editions of Unity, everything (and I mean everything) needed to be animated outside
    for any reasonable control. There were eternal internal processes of animating
    a null-object in Maya and then importing that and parenting a camera to it to
    get good camera motion; really a pain. And then there was the awkward time when
    Unity didn''t include any animation at all. Luckily, all of that is behind us
    now and Unity has a quite reasonable and intuitive (if you''re familiar with other
    animation tools) interface.


    Still, most complex animation (like character for instance) is best done outside
    of Unity in your 3D application. But for some simple moves (camera cinematics
    for instance), Unity''s built-in animation system works just fine.


    In this tutorial, we will organize and animate Aegis so we see him spinning around
    slowly in the scene as he idles.


    +   1. **Step 1:** Create a new empty GameObject. Do this via GameObject > Create
    Empty. Make sure it''s position is at 0,0,0 and name it AegisGroup.


    # ### Why?


    In Maya, when multiple objects are grouped together, Maya automatically creates
    a null object to contain the new group. Unity does not do this. However, by creating
    the empty game object first, we can then have this as a container to hold other
    things.


    +   1. **Step 2:** Make Aegis, the floor, and any lights lighting Aegis children
    of this new AegisGroup. Do this in the Hierarchy by dragging those assets onto
    the AegisGroup GameObject (which will make them children of AegisGroup).


    +   1. **Step 3:** Create an animation for AegisGroup. In the Hierarchy panel,
    select AegisGroup. Choose Window > Animation. This will pull up the Animation
    window and timeline. In the top-left corner is a little red dot (for record).
    Click this and a Create New Animation dialog box will appear. Enter AegisGroupRotation.anim
    in the File Name input field and click Save.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# ## Why?


    What''s going on? Think of animations as components of GameObjects. Whenever an
    object is to be animated in Unity, Unity will create a separate editable file
    (with a .anim label) that will store the information. What this means is that
    the animation can be used again and again on other objects (which is powerful
    in itself). It also means that there is this new asset that will be in the assets
    folder that is important not to delete.


    Note that after the .anim file is created, the Animation window will show the
    record button in the top left highlighted in red as if pressed. This is Unity''s
    way of telling you that you can now record animations by creating and editing
    keyframes.


    **Step 4:** Set a rotation keyframe. In the Animation window, click once on the
    Rotation Y text under the Transform section of AegisGroup. Along the top of the
    interface is a little diamond with a plus next to it. Mousing over this should
    provide the screen hint of Add Keyframe. Click this button once. This will create
    a little diamond that actually records a keyframe for all the rotation values.


    **Step 5:** Create a second rotation keyframe to create rotation animation. Along
    the top of the Animation window are the current time values. These can be a little
    tricky to understand at first. The format is Second:Frame. So 1:30 is one second
    plus 30 frames'' worth of time. Unity''s timeline here is working as though the
    game is playing at 60 fps so 1:30 would be about a second and a half. Slide the
    red time marker over to any place in the timeline (besides 0). In the Inspector,
    change the Rotation Y to 360. A new keyframe will appear in the Animation window
    with a yellow line to connect the two keyframes we have thus far for RotateY.


    **Step 6:** Test the animation. In the Animation window, next to the Record button
    is a Play button. Press this to see how things are looking. Press it again to
    pause.


    **Step 7:** Adjust the timing. This second keyframe can be dragged to a new location
    in time most easily by dragging the gray diamond (keyframe) symbol on the AegisGroup
    line (not the yellow keyframe in the graph section) along in time. The timeline
    will provide more time as the keyframe is dragged to the right. I chose a 15-second
    duration (Figure 10.50). Maya''s navigation commands work here too; the window
    can be zoomed and panned by holding down the Alt button and dragging or middle-mouse
    dragging.


    **Step 8:** Set the animation to loop. Still in the Animation window, look at
    the bottom left. Next to the Show button is a drop-down menu that will read Default
    to begin with. Click this and change the value to Loop (since we don''t want the
    animation to stop).


    **Step 9:** Play the game to see everything in action.'
  merge: -1
