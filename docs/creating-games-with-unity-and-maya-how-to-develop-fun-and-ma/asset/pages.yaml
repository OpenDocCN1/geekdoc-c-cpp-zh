- pgno: 153
  md: '# Tips and Tricks


    Layering textures is a very powerful way to add nice variation to any terrain.
    However, if the layered textures are too different, no matter how much Opacity
    adjustments and Target Strength tweaks are made, the results can appear ham-fisted.
    By using textures that share a common hue balance, the transition between the
    textures can appear much gentler.


    +   - **Step 17:** Import and paint with additional textures to taste.


    # Tips and Tricks


    Be sure to spend time only on areas that will be seen. Remember that most of this
    terrain will never be seen by the player because of the fog. A quick pass or two
    with additional textures helps to make the terrain look better for sure, but if
    it isn’t going to be seen, don’t sweat it.


    To check the progress, try turning on the fog (Edit>Render Settings) and walk
    around the scene to see what holds up and what needs more refining.


    # Adding Trees and Rocks (Trees and Detail Meshes)


    Once the Terrain’s workflow is understood (as just outlined for painted textures),
    the rest of the tools fall easily into an artist’s toolkit. Within the Terrain
    paradigm, trees actually follow a similar workflow as textures. A tree is defined
    within the inspector, and then painted onto the surface of the terrain. Shift-painting
    removes all trees and Ctrl-painting removes the trees of the selected type.


    For a quick rundown of the technique and a few tricks, the next few steps will
    make use of Unity’s Terrain Assets package. We will paint in a few variety of
    trees, and look at placement and editing strategies.


    +   - **Step 18:** Import Unity''s Terrain Assets package. Among the resources
    Unity includes on its site is a collection of prebuilt Terrain Assets. They are
    available at http://unity3d.com/support/resources/assets/terrain-assets and are
    a pretty nice collection of ready-to-use textures, trees, bushes, and so on. Just
    go to the URL, download the package, and then import the package (Assets>Import
    Packages>Custom Package...). This will create a new Terrain Assets folder within
    the Assets folder of the project file.


    # Why?


    True, using prebuilt, ready-everywhere-on-the-web assets is generally a bad idea.
    If it looks good in your scene, it will look good (and exactly the same) in everyone’s
    scene. For a commercially created game, generally it is preferable to make your
    own trees—and in fact, Unity now comes with a really fun Tree generator (GameObject>Create
    Other>Tree)... But for the learning process here, downloading and using prebuilt
    assets will speed the overarching learning process.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '**Step 19:** Add a ScotsPineTypeA tree to your tree types. With the Terrain
    selected in the Hierarchy view, go to the Inspector and click the Place Trees
    button. Click the Edit Trees ... button and choose Add Tree from the drop-down
    options. In the Add Tree dialog box, click the target icon, which will pull up
    a (now well-populated) Select GameObject window. Double-click the ScotsPineTypeA
    icon. Lastly, click the Add button in the Add Tree dialog box. This will add a
    new tree in the Place Trees section of the Inspector.


    **Step 20:** With the default settings, paint on the Terrain. Insta-forest.


    **Step 21:** Undo (Edit>Undo or Ctrl-Z or Command-Z).


    # ## Why?


    The default setting of placing trees make for a very dense placement of trees.
    This actually can be a hint at how Unity plans for trees to be placed (lots and
    all over), but in our stark scene, there really isn''t need for that many trees,
    especially since there will be very visible through the fog. So the settings need
    to be tweaked.


    **Step 22:** In the Settings area adjust Brush Size to 10 and the Tree Density
    to 75. Now paint these new trees across the highest parts of the scene (Figure
    6.20).


    ![](img/0285f88bc840f313779e011725b623a5_154_0.png)


    FIGURE 6.20  Painted Scots Pines.


    # ## Tips and Tricks


    Having a smaller Brush Size allows for slightly more accurate tree placement.
    In this case, where there are not going to be many of these large trees down close
    to the entrance, an accurate placement helps. However, remember that often it
    is much easier to remove trees where they shouldn''t be than to try and get any
    one tree exactly where it needs to be.


    By throwing up a lot of trees, and then Shift-painting to remove the excess, the
    random placement of the trees holds up and saves the frustration of painting on
    an area with a low Tree Density setting and never getting the stinkin'' tree you''re
    after.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Step 23: Repeat for a few other trees or bushes. Add other trees to the tree
    library (including bushes) and experiment with various Brush Sizes, Tree Densities,
    Tree Height, and Color Variation. Place trees and bushes and remove them in places
    where they would not make sense (Figure 6.21).


    FIGURE 6.21 Several tree types and bush types placed throughout the scene.


    ![](img/0285f88bc840f313779e011725b623a5_155_0.png)


    # ### Why?


    Figure 6.21 seems to show a pretty sparse placement of trees and bushes. And it
    is. The point of the trees is to help shake up the profile of the land a bit,
    but since this game calls for a foggy outside, we only want to catch a hint of
    those trees. No need to have trees in areas of the Terrain that will never be
    seen, so careful placement will continue to keep the data set small and the game
    snappy.


    # ### Tips and Tricks


    Remember that in this game, the scene will never be seen from way up in the God-mode
    that the trees are painted in. When painting in God-mode, the trees will be continually
    popping in and out of billboards and sometimes look really strange on the Terrain.
    Be sure to get down close to see how the trees really lie across the Terrain.
    Further, be sure to Play the game and see which of the trees you can see and which
    are just invisible. Get rid of the stuff not needed and be sure to understand
    really how those trees look and feel in the game.


    Step 24: Add rocks as Detail Meshes. Still with the Terrain selected, click the
    Paint Details button in the Inspector. Here, click the Edit Details... button
    and Add Detail Mesh... from the drop-down menu. As before, click the target, and
    then choose RockMesh. Change the options to match Figure 6.22. Click the Add button.


    # ### Why?


    The Random Width and Height are settings that mean the painted rocks can be up
    to five times the size of the original mesh. For some objects, this should be
    very low (houses for instance), but for rocks, a wide variation will work much
    better.'
