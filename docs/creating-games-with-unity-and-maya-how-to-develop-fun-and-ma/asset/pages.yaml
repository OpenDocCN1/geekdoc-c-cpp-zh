- pgno: 274
  md: '![](img/0285f88bc840f313779e011725b623a5_274_0.png)


    FIGURE 9.28  Projection for the shoulder pads (emphasis added).


    # Tips and Tricks


    Notice that in Figure 9.28, projection has moved around a lot to get into that
    place. The manipulator handles can be really tough to see, especially with a strong
    texture pattern like the checkerboard. With lots of quick switches between textured
    or not (pressing 5 or 6), it can be easier to see and manipulate the handles,
    see the results, then back to seeing the handles.


    # The Face


    Here''s where the magic happens. In versions past, Maya required an incredible
    mess of projections that were painstakingly stitched together in an attempt to
    get a texture to crawl across a face correctly. With the newer UV technologies
    emerging in recent years, texturing the face has become almost . . . fun.


    **Step 39:** Select the polygons of the head and neck (Figure 9.29).


    ![](img/0285f88bc840f313779e011725b623a5_274_1.png)


    FIGURE 9.29  Selecting the faces of the head.


    **Step 40:** Create a planar projection. Select Polygons>Create UVs>Planar Mapping
    (Options). For Fit Projection To, click the Bounding Box radio button. For Project
    From, click the Z-axis radio button. Click Project.'
  merge: -1
