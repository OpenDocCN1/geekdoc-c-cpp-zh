- pgno: 116
  md: '# ## Scene


    The Scene area is where the game is actually constructed. In this window objects
    can be placed or manipulated in space. This is most like Maya''s View panels and
    even has that handy **Scene Gizmo** (in the top right corner), which helps understand
    where the editor camera is in global space and allows for quick movement to the
    various Top, Bottom, Right, and Left orthographic views.


    Note that there are several buttons at the top of the Scene area including the
    ability to show how the scene is presented. The scene can be shown as Wireframe,
    with Alpha, with or without Lights, Grid, and/or sound.


    The other thing that is important to notice about the Scene area is that it''s
    hiding the Game area.


    # ## Game


    The Game view is actually what the game will look like. When you Play the game
    (Play with a capital P meaning you press the Play button), the Game window will
    come to the foreground where you actually see what happens in the game.


    This actually seems to me to be a really unintuitive way to work. Having either
    the Scene or the Game view visible can sometimes cause real problems when trying
    to understand what is happening in the game or when troubleshooting. If you have
    a big enough monitor to support it, you will find it worth your while to rearrange
    the default workspace to be able to see both the Scene and Game at the same time.


    # ## Tips and Tricks


    To rearrange your workspace within Unity, just click and drag any of the tabs
    where the name of the area appears. So Game tab can be grabbed and remounted below
    the Scene area, or move the Hierarchy and Project views to your second monitor.
    It''s really an important update to Unity 3, and makes Unity a much more configurable
    tool. Figure 5.3 shows how I have my workspace set up with my dual monitor setup.


    ![](img/0285f88bc840f313779e011725b623a5_116_0.png)


    **FIGURE 5.3** The WalkingCustomLayout, made to utilize dual monitors by dragging
    areas of the interface around. Note the Console visible (an important tool not
    visible in the default layout).


    # ## Inspector Panel


    This does exactly what it sounds like—it allows assets to be inspected. If an
    asset is selected in any view or panel (Scene, Hierarchy, or Project), the attributes
    of that object will be visible in the Inspector panel (think the'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Attribute Editor in Maya). Not only does this allow for the inspection of the
    asset, it also allows for changes to be made to the attributes of the object.
    Lots of attributes and connections can be seen here. Which scripts are attached
    to which GameObjects can be seen. Which texture is assigned to a mesh can be seen.
    Further, even important details like which scripts are talking to which other
    objects in the scene are laid out here.


    # Hierarchy Panel


    This and the Project panel work in close concert. The Hierarchy panel shows what
    objects are in the scene. Here the organization of the objects can be changed
    (which objects are children of which) and, when the game is playing, can show
    what additional objects have been instantiated (which means “created during game
    play”). To get assets to the Hierarchy (and thus in the game), either put them
    there programmatically (via script) or drag them from the Project panel.


    Note that the Hierarchy panel has a Create drop-down menu that allows for the
    addition of all sorts of Unity-generated assets to the scene. This can also be
    done via the GameObject>Create Other drop-down menu.


    Note too, that there is a search input field to find an asset that you know is
    in the scene but that you can’t quite find by perusing the list.


    # Project Panel


    Think of this panel as the library or storage bin. This is where all the assets
    that are available for the game live until they are dropped into the Hierarchy
    (or pulled over via script). Remember that when assets are represented in the
    Hierarchy panel, they are in the game as well.


    The Project panel is essentially the Assets folder. In the OS’s file browser,
    when things are dragged into the Assets folder—after they have been imported and
    understood by Unity—they will be presented in the Project panel. It is here that
    reorganizing and deleting of assets should be done (as discussed earlier in the
    chapter).


    Notice that here too is a Create drop-down menu with a different collection of
    Unity-generated assets. Also, here the folders for organizational purposes can
    (and should) be created to organize the assets into logical bins for easy access.
    Lastly, notice that here too is a search input field to find a particular asset
    if it’s not immediately visible.


    # Using It All


    So there’s the crammed interface overview. The best way to learn an interface
    is to use it. The pieces and method to the madness begins to become clear. So
    let’s do that.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Tutorial 5.2: Exporting from Maya\n\n# Optimizing in Maya\n\n“What?!” you\
    \ cry, “I thought we were about to get into Unity...finally!” Agreed, it’s time\
    \ to walk around the space we’ve made. However, as is the case with much of 3D,\
    \ effective preparation of assets in earlier stages yield superior results later.\
    \ Cleaning up the file in Maya will ensure a smoother transition into Unity, and\
    \ exporting manually from Maya will ensure only the needed assets get transferred.\n\
    \n+   1. **Step 1:** Open the scene in Maya. In this case, it will be the Entryway.mb\
    \ file that we have been building in earlier tutorials.\n+   2. **Step 2:** Delete\
    \ All History. Choose `Edit > Delete All by Type > History`.\n\n# Why?\n\nHopefully\
    \ you’ve been cleaning your history as you were working in Maya, but here’s the\
    \ chance to make sure there are no lingering unwanted data nodes floating around\
    \ your file.\n\n+   **Step 3:** Remove unused Materials. Open the Hypershade (Window>Rendering\
    \ Editors>Hypershade). Within the Hypershade choose Edit>Delete Unused Nodes.\n\
    \n# Why?\n\nIf it’s not used, why include it in the data being passed around?\n\
    \n+   **Step 4:** Check for orphaned nodes. Open the Outliner (Window>Outliner)\
    \ and make sure that all the elements listed there are accounted for in the scene.\
    \ Occasionally, even after cleaning history, there can be some leftover remnants\
    \ of modeling process in the past (groups without anything in them, or other null\
    \ objects). If any of these are present, delete them.\n+   \n+   **Step 5:** Double-check\
    \ all the naming. In the Outliner and the Hypershade make sure there are no pCube25\
    \ objects or lambert26 materials. Every object should have a descriptive name\
    \ that makes sense not only to you, but would make sense to someone else inheriting\
    \ the file.\n\n# Why?\n\nTaking time in the middle of the creation process to\
    \ name objects and materials is not a favorite of beginning artists or students.\
    \ The students think they can select the object and know what it is, so who cares\
    \ what the thing is actually named? The problem is twofold. First, when working\
    \ in Unity and working with scripts, sometimes objects will be called by name,\
    \ not by the Unity user selecting them. If there are 50 spheres in the scene,\
    \ it really slows the process trying to track down exactly which sphere is what.\
    \ Second, game production is very often a team activity. Even a project that a\
    \ solo developer began can often end up being a team project before it sees release.\
    \ Team members that inherit a poorly named file with poorly named assets within\
    \ do not remain happy for long. Name your stuff.\n\n> **Warnings and Pitfalls**\n\
    > \n> Remember that there are some default materials that can’t be deleted (lambert1\
    \ and particleCloud1). Don’t worry about those, they can be left as is. It’s part\
    \ of the beauty of manually exporting the Maya file that none of these default\
    \ nodes will be included."
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Export Options


    Unity has attempted to make the Export/Import process very painless by doing a
    lot of the conversion process behind the scenes. Technically, this .mb file could
    just be dropped into the Assets folder of the Incursion-Unity file. Then in the
    background, Unity opens a version of Maya (the Render application actually) and
    converts the .mb into a .fbx, which it can then read. Unity actually does this
    with any of the file formats it supports (i.e., opens C4D and exports the C4D
    file into an .fbx). On the surface this seems like a really amazing and painless
    process as Unity "automatically" converts bunches of things into the formats it
    uses.


    However, I have found through many projects that I prefer to manually export files
    from their respective applications. Here are my reasons:


    +   - When Unity does the conversion (via the 3D software), there is no way of
    knowing what version of FBX the 3D software is attempting to use and if that particular
    version is compatible with the version of Unity being used. For instance, there
    were some significant differences between FBX2010 and FBX2011, and FBX2011 stuff
    was not coming into Unity at all until Unity had a chance to catch up with the
    new file format.


    +   - While Unity is doing the converting, you are powerless to intervene in the
    process. If it crashes, it is crashing on export from the 3D application or crashing
    on import into Unity? Very tough to troubleshoot without knowing which is the
    problem.


    +   - When Unity does the conversion, it is up to the user to include all the
    relevant texture files that are used in the scene. If the user misses a file,
    Unity forgets that the material is ever tied to it, which means the materials
    all have to be relinked manually. It''s quick to do this but can add up quickly.


    +   - By manually exporting you are creating another backup of your model and
    work in another file format. As a professor, I have seen at least one student
    each semester with a .mb file that suddenly shows up at 0 kb—it''s gone. While
    using Incremental Saves in Maya can help prevent some tears, it is certainly nice
    to have the asset in another format in case something goes bad with your Maya
    install, or some other catastrophe happens mid-production cycle.


    +   - In a team situation, manually exporting from Maya means that other members
    of the team do not have to have Maya installed on their machines to access the
    files that are output. This means that a team could have artists using a wide
    variety of 3D applications, and they could all be assembled on a machine without
    any licenses of the 3D applications (perhaps used by a scripter or programmer).


    +   - By manually exporting the file from Maya, all the necessary textures can
    be embedded into the .fbx exported. This means one file is moved into the Assets
    folder for each Maya scene built. When Unity unpacks the .fbx it will create a
    sister folder where it includes all the relevant textures. This means that automatically,
    all the textures involved in a particular Maya scene are organized. It makes it
    easier to find assets when in the midst of heated Unity development.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'So, if you buy my reasoning, here are the simple steps to manually control
    the export/import process in Unity.


    +   - **Step 6:** In Maya, choose File>Export All.

    +   - **Step 7:** In the Export All dialog box, change the Files of type: drop-down
    menu to FBX export.

    +   - **Step 8:** In the Options... section of the Export All dialog box expand
    the File Type Specific Options, then the Include section, and finally the Embed
    Media. Check the Embed Media option.


    # ### Why?


    Embed Media means that all the textures used in the scene will be included in
    the .fbx file that is exported. It essentially packages all the used textures
    and keeps them with the geometry file.


    +   - **Step 9:** Still in the Export All dialog box, expand the Advanced Options
    and the FBX File Format options within. In the Version drop-down menu choose FBX
    2010.


    # ### Why?


    FBX2011 is a new format that has had some problems with early versions of Unity
    3. By using FBX 2010, all the important characteristics are carried through to
    Unity, but with a much more reliable flow. Unity has a good habit of catching
    up with hotfixes, and hopefully the FBX2011 wrinkles will all be ironed out. Knowing
    and controlling the export format, however, is still an important part of the
    troubleshooting process.


    > > **Warnings and Pitfalls**

    > > These steps are very specific to Maya 2011. If you are using any earlier version
    of Maya be aware that the step details may be a bit different.


    +   - **Step 10:** Enter EntryWay into the File name: input field and navigate
    to the Assets folder of Incursion-Unity. Press Export All (Figure 5.4).


    # ## Tips and Tricks


    Next time a file is exported from Maya, these settings will be remembered. So
    it takes just a moment to set up a reliable workflow, but things go much smoother
    when it ends up in Unity. Do remember that these settings have been changed. Maya
    works hard to remember what settings were changed last time, and if you''re dealing
    in other situations, you may not want these same settings.


    # ## The Import Process


    Interestingly enough, by saving the EntryWay.fbx file into the Assets folder,
    a big chunk of the importing has been done. When Unity is swapped to or launched
    (and make sure it''s pointed at the Incursion-Unity project file), Unity will
    look at this new .fbx file and start chewing on it.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '**FIGURE 5.4** The Export All dialog box with the two important settings to
    change before exporting.


    ![](img/0285f88bc840f313779e011725b623a5_121_0.png)


    On a PC, disconcertingly the Unity interface will not be visible except for an
    Importing Assets: progress bar (although Windows 7 will show some nice detail
    of progress in the Taskbar). On a Mac, usually there is a bit more of the Unity
    interface visible. But either way, watch for this progress bar to know that Unity
    is working on understanding the new assets it has been presented with (Figure
    5.5).


    Once Unity has indeed chewed on all the assets, the project file should look something
    like Figure 5.6.


    There are several things worth noting in Figure 5.6. Let''s start from the bottom
    up.


    The **Standard Assets** folder is actually the result of setting up the project
    and importing the Character Controller package. Any of the default packages that
    ship with Unity will be placed within this Standard Assets folder. It''s a handy
    way to separate which scripts are yours and which came from Unity. It''s wise
    to not place any non-Unity provided assets within this folder to keep track of
    what assets came from where.


    ![](img/0285f88bc840f313779e011725b623a5_121_1.png)


    **FIGURE 5.5** The Importing Assets progress bar may be the only indication that
    Unity is indeed importing the assets it''s been given.


    ![](img/0285f88bc840f313779e011725b623a5_121_2.png)


    **FIGURE 5.6** Results of the export/import process.'
