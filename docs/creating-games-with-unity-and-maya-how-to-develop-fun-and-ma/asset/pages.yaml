- pgno: 281
  md: '![](img/0285f88bc840f313779e011725b623a5_281_0.png)


    *Figure 9.41* Unfolding the edges of the shells.


    # Tips and Tricks


    Note that Figure 9.41 shows the edge unfolded. Remember that when selecting the
    UVs along that outer edge, the UVs could be right on top of each other. Be sure
    to Marquee select to select all the UVs along that outer edge.


    **Step 58:** Scale the shells to an appropriate texture space usage so that the
    checker sizes match the other shells in the view pane (Figure 9.42).


    *Figure 9.42* Scaled and completed hands.


    ![](img/0285f88bc840f313779e011725b623a5_281_1.png)


    # Finishing Up


    **Step 59:** The rest of the unmapped parts, the boots and the collar, all use
    the same techniques used thus far. Apply what you''ve learned and map the rest
    of the form.


    **Step 60:** Organize the shells. Make sure that there are equal-sized checkers
    all over the mesh. Then select all the UVs and scale them down en masse. It is
    important to scale all together in order to keep the relative use of texture space
    consistent. This makes for an interesting puzzle—the idea here is to pack the
    shells in as tightly as possible without any overlapping UVs; but if one shell
    gets scaled, they all need to scale. Figure 9.43 shows my solution to the puzzle.
    Your solution may differ.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/0285f88bc840f313779e011725b623a5_282_0.png)


    # Why?


    A tightly packed set of UVs means that the texture (when applied) is efficient.
    A UV map that has a lot of wasted space means that the texture painted on that
    map will have a lot of pixels that aren''t assigned to any polygons. This means
    that the polygons will not have as high a fidelity as they could.


    In the old days, UV maps were so tightly packed that there was nary a gap between
    shells. In all reality this is not a bad technique although new hardware today
    makes large-texture maps possible and thus the absolutely most efficient map a
    little less critical. However, use all the space possible when laying out the
    map.


    In Figure 9.43 there is (admittedly) a fair amount of empty space, although not
    too bad. For me, there is a balance of creating a map that is efficient and making
    a map that is usable to paint on. There is even a tool in the UV Texture Editor
    (Polygons>Layout) that will attempt to organize the shells into the absolutely
    most efficient layout. The problem with this is that it scatters shells all over
    the place. One part of the shirt is in one corner and another part is in an entirely
    different spot. This makes deciphering what is being painted pretty tough in Photoshop.
    By doing the layout manually, body parts can be left together, costume pieces
    can be left in clusters so that when it is time to paint it is easy to know what''s
    being painted.'
  merge: -1
  img_proc: true
- pgno: 283
  md: "# Tips and Tricks\n\nOften you will see another way of working with character\
    \ UVs that includes making a separate UV set for the face and head. The idea here\
    \ is that the character will use two materials, one for the face (which is the\
    \ most important part of most characters) and another for all the body. This often\
    \ means that the face gets as much texture as the rest of the body combined.\n\
    \nIf the game calls for close-ups of the character, this is indeed a great way\
    \ to work. However, for this project, there will be no close-ups, so to keep the\
    \ draw calls down there will be only one texture for the whole character, including\
    \ the face.\n\nHowever, to cheat just a bit, the head and face shell in Figure\
    \ 9.43 is a little bigger than it should be. Since there is an easy seam between\
    \ the neck and the clothes, we can make the head UV shell just a tad larger to\
    \ use a bit more of the texture space without throwing off the balance of textures\
    \ on the rest of the model.\n\n+   **Step 61:** Delete all history. Keep the file\
    \ clean.\n+   \n+   **Step 62:** Export the UV Map. Select AC_AegisChung in Object\
    \ Mode. In the UV Texture Editor select Polygons>UV Snapshot. For now set the\
    \ resolution to 2048x2048 and save it as AegisChungUV. This will be the file used\
    \ to paint the texture in the next tutorial. Changing the Image Format to TIFF\
    \ will often yield more predictable results.\n\n# Conclusion\n\nNow on to the\
    \ fun part. The UV map is laid out, the snapshot is taken, and the file is available\
    \ for painting in Photoshop. In the next tutorial we will look at a few quick\
    \ techniques for using photos as our source for character texture painting.\n\n\
    # Tutorial 9.2: Character Texture Painting\n\nFor the most part, texturing is\
    \ texturing and the techniques to texture the level are similar to those used\
    \ to texture a character: lay down a base texture and layer on dirt, seams, and\
    \ folds. Because of this, we will move quickly in this tutorial until we get to\
    \ the area of the face.\n\nThe head is really the only skin we see on this character.\
    \ There are many ways of attacking the face of a character. Many times students\
    \ in class with some good painting skills are able to create really interesting\
    \ textures from scratch by painting within Photoshop. Still others will print\
    \ out the UV map and use more traditional media (often gouache) to paint a skin\
    \ texture that they then scan and work back into the UV map within Photoshop.\
    \ Often these result in very stylized textures, which can be really great for\
    \ the right project."
  merge: -1
  img_proc: true
