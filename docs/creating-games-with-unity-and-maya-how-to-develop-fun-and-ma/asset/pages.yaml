- pgno: 150
  md: '**Step 10:** Find a rocky base texture and make it seamless. Figure 6.17 shows
    Cliffs0168_1_5 from CGTextures (http://cgtextures.com/texview .php?id=55487) as
    the Terrain texture applied to the terrain created in earlier steps. Other textures
    could certainly work as well. Use the seamless texture techniques used in the
    previous chapter.


    # Why?


    The terrain created so far includes a sort of UV map and the textures we are going
    to apply will be tiled. Since they are tiled, they need to be seamless.


    **Step 11:** Add this new seamless texture to your available assets. In the Unity
    Project Panel, click the Create drop-down menu and choose Folder. Rename the folder
    Terrain Textures. In Photoshop save the seamless texture to this Terrain Textures
    folder (or simply drag it to this folder in the OS if the texture has already
    been saved somewhere).


    # Why?


    The project is beginning to have a larger collection of assets. A few effective
    folders keep your workspace clean and the assets easy to find.


    **Step 12:** In the Hierarchy panel, select Terrain. In the Inspector, click the
    Paint Texture tool. Click the Edit Textures... button and choose Add Texture...
    from the drop-down menu.


    **Step 13:** In the Add Terrain Texture window that will pop up click the target
    icon. The Select Texture2D window will appear. From this window find the seamless
    texture you just made and double-click it. The window will close and the texture
    will be added next to Splat in the Add Terrain Texture window. Click the Add button
    (Figure 6.16), which will close the window and add the texture to the terrain
    (Figure 6.17).


    ![](img/0285f88bc840f313779e011725b623a5_150_0.png)


    FIGURE 6.16 Adding a terrain texture.'
  merge: -1
