- pgno: 466
  md: "**Step 9:** Create the mouse over scripts to highlight each button as the mouse\
    \ moves over them. Create a new JavaScript. Name it InventoryButtonScript. Open\
    \ this script in your script editor and enter the following:\n\n```\n~~~javascript\n\
    var buttonReg : Texture2D;\nvar buttonOver : Texture2D;\n\nfunction OnMouseOver\
    \ () {\n    guiTexture.texture = buttonOver;\n}\n\nfunction OnMouseExit(){\n \
    \   guiTexture.texture = buttonReg;\n}\n~~~\n```\n\n# ### Why?\n\nFirst we're\
    \ declaring two variables, both of which are of type Texture2D, which just means\
    \ they are images used as textures. Then in a bit of code that should look a bit\
    \ familiar we say, 'when the mouse is over this object, go to the guiTexture component,\
    \ and make its texture be buttonOver. When we move out of this object, change\
    \ the guiTexture's texture to be buttonReg.'\n\nThis script will be assigned to\
    \ each button, and for each button we'll drag and drop the two versions of the\
    \ texture for that button.\n\n+   - **Step 10:** Save and return to Unity. Fix\
    \ syntax problems.\n+   - **Step 11:** Assign this script to the EMP, Flashlight,\
    \ and Pistol buttons in the Hierarchy.\n+   - **Step 12:** Populate the Button\
    \ Reg and Button Over variables for each by dragging the respective textures from\
    \ the Project panel's 2D Assets folder. So, for instance, for InventoryButton_EMP,\
    \ the Button Reg variable should be populated with ButtonInventory-EMP texture\
    \ (from the Project panel) and the Button Over variable should be populated with\
    \ the ButtonInventory-EMPText texture, and so on (Figure 16.3).\n\n![](img/0285f88bc840f313779e011725b623a5_466_0.png)\n\
    \n**FIGURE 16.3** The button-swapping script in action."
  merge: -1
  img_proc: true
- pgno: 467
  md: "**Step 13:** Play and test. This will be a little weird because the character\
    \ will be looking around and only moves to get over the buttons.\n\n**Step 14:**\
    \ Further refine by telling the texture to not only swap out, but to turn up its\
    \ Alpha value so it becomes more opaque. And then tell it to turn it back down\
    \ when the mouse exits:\n\n```\nvar buttonReg : Texture2D;\nvar buttonOver : Texture2D;\n\
    \nfunction OnMouseOver(){\n    guiTexture.texture = buttonOver;\n    guiTexture.color\
    \ = Color (.5,.5,.5,.5);\n}\n\nfunction OnMouseExit(){\n    guiTexture.texture\
    \ = buttonReg;\n    guiTexture.color = Color (.5,.5,.5,.25);\n}\n```\n\n**Step\
    \ 15:** Save. Return to Unity and fix any syntax issues.\n\n**Step 16:** Ensure\
    \ the engine state is ready. Open the AC_ToolFunctionalityScript. Toward the top\
    \ of the script (in all the variable declarations) there should be several Booleans.\
    \ Change all the Booleans to private variables (we don’t want control them in\
    \ Unity’s editor, we want the buttons to do it), and create a new variable for\
    \ flashlightActive. Your variables should look like this:\n\n```\nprivate var\
    \ flashlightActive : boolean;\nprivate var pistolActive : boolean;\nprivate var\
    \ empActive : boolean;\nprivate var empGhostActive : boolean;\n```\n\n# Why?\n\
    \nThe only ones that really matter to us for the inventory system are flashlightActive,\
    \ pistolActive, and empActive. Remember that empGhostActive is part of the EMP\
    \ mechanism.\n\n**Step 17:** Save AC_ToolFunctionalityScript.\n\n# Refresher on\
    \ Interscript Communication\n\nRemember that in the AC_ToolFunctionality script,\
    \ we are calling functions within the script, and we do so by just calling out\
    \ the name of the function (AddHighlight(hitObj), for instance, says, “go fire\
    \ the function AddHighlight with the parameter hitObj. And this function is included\
    \ here in this script”). However, we can fire functions that exist in other scripts\
    \ as well. We just need to tell Unity where that script is; particularly, what\
    \ object it’s attached to.\n\nWe do this with the following format:\n\n```\nGameObject.GetComponent(\"\
    name of script\").NameOfFunction;\n```"
  merge: -1
  img_proc: true
- pgno: 468
  md: "We can also send a message that defines one of the variables (like a Boolean)\
    \ in much the same way:\n\n```\n```text\nGameObject.GetComponent(\"name of script\"\
    ).BooleanVariable\n    = true;\n```\n```\n\nEventually we're going to want to\
    \ do both in the inventory script; we're going to want Unity to understand that\
    \ when we click a button, it needs to activate a particular Boolean in AC_ToolFunctionality.\n\
    \nWe’ll be talking to this same script a lot, so we can shorten things a bit by\
    \ declaring some additional variables and then referencing those variables throughout\
    \ the script.\n\n**Step 18:** Open InventoryButtonScript. Create a new variable\
    \ to contain the object that holds the script we’ll be referencing. Then have\
    \ the script find Main Camera on Awake:\n\n```\n```text\nvar buttonReg : Texture2D;\n\
    var buttonOver : Texture2D;\nprivate var mainCamera : GameObject;\n\nfunction\
    \ Awake(){\n    mainCamera = GameObject.Find(\"Main Camera\");\n}\n```\n```\n\n\
    # Why?\n\nRemember that AC_ToolFunctionalityScript is attached to the Main Camera\
    \ that is a child of our prefab FPC_AegisChung. So in order to reference that\
    \ script, we need to make sure this script knows where that object is.\n\nNow,\
    \ we’re taking a calculated risk here. In this case, we're making the var mainCamera\
    \ a private variable, and having the function Awake go and find it. This is in\
    \ contrast to the method we've been using of manually defining public variables\
    \ within Unity. In this case, we’re making the reasonably safe assumption that\
    \ there will only be one object named “Main Camera” in the scene. And since this\
    \ script is attached to three objects, having Unity go and find it on start is\
    \ a bit easier on us since we needn't populate the variables manually.\n\n**Step\
    \ 19:** Create another private variable that will hold the reference to the actual\
    \ script; then have this script also found on awake:\n\n```\n```text\nvar buttonReg\
    \ : Texture2D;\nvar buttonOver : Texture2D;\nprivate var mainCamera : GameObject;\n\
    private var toolFunctionality;\n\nfunction Awake(){\n    mainCamera = GameObject.Find(\"\
    Main Camera\");\n    toolFunctionality = mainCamera.GetComponent(\"AC_ToolFunctionalityScript\"\
    );\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 469
  md: "> **Why?**\n> \n> Note that this new private variable isn't typed. This is\
    \ a funky reality of JavaScript—the type does not have to be defined. It can usually\
    \ help in performance, but in this case where we're accessing a particular script,\
    \ we can leave the type blank, which is often the practice when working with scripts.\n\
    \n**Step 20:** Create a new OnMouseDown function that starts setting Booleans\
    \ via this script. Now that the script is going out and finding the script, start\
    \ passing commands to it:\n\n```\n...\n\nfunction OnMouseDown (){\n    if (name\
    \ == \"InventoryButton_EMP\"){\n        toolFunctionality.flashlightActive = false;\n\
    \        toolFunctionality.pistolActive = false;\n        toolFunctionality.empActive\
    \ = true;\n    }\n    if (name == \"InventoryButton_Pistol\"){\n        toolFunctionality.empActive\
    \ = false;\n        toolFunctionality.flashlightActive = false;\n        toolFunctionality.pistolActive\
    \ = true;\n    }\n    if (name == \"InventoryButton_Flashlight\"){\n        toolFunctionality.empActive\
    \ = false;\n        toolFunctionality.pistolActive = false;\n        toolFunctionality.flashlightActive\
    \ = true;\n    }\n}\n```\n\n> **Why?**\n> \n> That looks like a lot of script,\
    \ but it's a pretty straightforward concept. It says, \"when the user clicks on\
    \ this object (function OnMouseDown), check if this object's name is InventoryButton_EMP.\
    \ If it is, go to toolFunctionality (which we just defined as the component (script)\
    \ attached to mainCamera) and there, set the Boolean flashLightActive to false,\
    \ set the boolean pistolActive to false, and set the Boolean empActive to true.\
    \ If the object clicked is not InventoryButton_EMP, then check if it is InventoryButton_Pistol\
    \ and if it is…\" and so on. There are more elegant solutions as well (take a\
    \ look at Switch Statements or Singletons); but this one is particularly easy\
    \ to use.\n\n# Firing Animations in Script\n\nSo far we've got the InventoryButtonScript\
    \ so that it can go talk to the mini-state-engine included in AC_ToolFunctionalityScript\
    \ and turn on and off Booleans contained there. But before this works really smoothly,\
    \ we need to do a bit of additional beefing up of the functions that are included\
    \ in AC_ToolFunctionalityScript."
  merge: -1
  img_proc: true
- pgno: 470
  md: "For instance, right now, the pistol is always out since the AegisChung_Arms\
    \ prefab has the PistolReady animation running first thing. This was great when\
    \ we were setting up the firing of the gun, but is a little awkward now since\
    \ it's pretty unbelievable that the gun will make the EMP work or shine light\
    \ like a flashlight.\n\nSo we need to create a couple of functions to bring the\
    \ pistol out and put it away. We'll create these functions within the InventoryButtonScript\
    \ (with the idea that this script handles all the defining when tools are used\
    \ with their respective buttons), and call them up when the buttons are pressed\
    \ to activate or deactivate a weapon/tool.\n\nThe way we'll put the pistol away\
    \ (and the flashlight for that matter) is by playing the animation PistolReady\
    \ (and FlashlightReady) forward (to bring it out) and backward (to put it away).\
    \ The way animations are called on is like this: GameObject.animation.Play(\"\
    Name of Animation\");\n\nLet's call up some animations.\n\n**Step 21:** Still\
    \ within InventoryButtonScript, at the top of the script, declare a new variable\
    \ to hold the object that has the animations attached to it (Aegis's arms).\n\n\
    ```\nprivate var aegisArms : GameObject;\n```\n\n**Step 22:** Create a new function\
    \ to ready the pistol. And when the pistol is ready set the pistolReady Boolean\
    \ to active. Do this at the bottom of the script:\n\n```\nfunction ReadyPistol()\n\
    \    aegisArms.animation[\"PistolReady\"].speed = 1;\n    aegisArms.animation.Play(\"\
    PistolReady\");\n    yield WaitForSeconds (aegisArms.animation.clip.length);\n\
    \    ToolFunctionality.pistolActive = true;\n}\n```\n\n> **Warnings and Pitfalls**\n\
    > \n> Note that there is a subtle but important difference when working with attributes\
    \ of an animation (like changing the speed)—namely that the name of the animation\
    \ is contained in [ ] and not ( ) like it is when the clip is being played.\n\n\
    # Why?\n\nThe first line there simply says, \"on the GameObject aegisArms, find\
    \ the animation called \"PistolReady\" and set its speed to 1 (play at regular\
    \ speed). There usually is little need to change the speed of an animation (if\
    \ it's animated correctly); however, in a bit, we're going to play this animation\
    \ backward by setting the speed to -1. If we don't make sure it's set to positive\
    \ 1 here, we won't know if the animation is playing forward when it's called up\
    \ in the next line.\n\nNext we're telling Unity to wait for the animation to play—or\
    \ more specifically wait for the amount of seconds it takes for the animation\
    \ to play before going to the script contained in the ToolFunctionality variable\
    \ (which we declared on Awake as the AC_ToolFunctionalityScript that is attached\
    \ to Main Camera) and setting pistolActive to true."
  merge: -1
  img_proc: true
- pgno: 471
  md: "# **Step 23:** Create another function to store the pistol. Add this to the\
    \ bottom of the script:\n\n```\n```csharp\nfunction StorePistol(){\n    aegisArms.animation[\"\
    PistolReady\"].speed = -1;\n    aegisArms.animation[\"PistolReady\"].time = aegisArms\n\
    \        .animation[\"PistolReady\"].length;\n    aegisArms.animation.Play(\"\
    PistolReady\");\n    yield WaitForSeconds(aegisArms.animation.clip.length);\n\
    \    toolFunctionality.pistolActive = false;\n}\n```\n```\n\n# **Why?**\n\n> This\
    \ StorePistol function says, “set the speed of the animation PistolReady to –1\
    \ (plays backward), then set its current time to the length of the animation (think\
    \ of this as fast-forwarding to the last frame), and then play the animation.”\
    \ This will play the animation backward, having Aegis put the gun away. Finally,\
    \ Unity waits until the animation of putting the pistol away before it makes pistolActive\
    \ false over in AC_ToolFunctionalityScript.\n\n# **Step 24:** Create similar functions\
    \ to ready the flashlight and put it away:\n\n```\n```csharp\nfunction ReadyFlashlight(){\n\
    \    aegisArms.animation[\"FlashlightReady\"].speed = 1;\n    aegisArms.animation.Play(\"\
    FlashlightReady\");\n    yield WaitForSeconds(aegisArms.animation.clip.length);\n\
    \    toolFunctionality.flashlightActive = true;\n}\n\nfunction StoreFlashlight(){\n\
    \    aegisArms.animation[\"FlashlightReady\"].speed = -1;\n    aegisArms.animation[\"\
    FlashlightReady\"].time = aegisArms\n        .animation[\"FlashlightReady\"].length;\n\
    \    aegisArms.animation.Play(\"FlashlightReady\");\n    yield WaitForSeconds(aegisArms.animation.clip.length);\n\
    \    toolFunctionality.flashlightActive = false;\n}\n```\n```\n\n# **Why?**\n\n\
    > Again, this is just the same thing, only talking to the animation FlashlightReady.\
    \ Remember that the names of these animations were declared when the asset was\
    \ first imported. We did this way back when we brought in the full-body Aegis\
    \ as well.\n\nNote that since we are now turning the Booleans off and on in these\
    \ functions we'll need to remove them from the OnMouseDown function."
  merge: -1
  img_proc: true
- pgno: 472
  md: "**Step 25:** Look to the OnMouseDown function. Look at the new functions when\
    \ buttons are pressed. In each place where the line `toolFunctionality.pistolActive\
    \ = false;` appears, we need to replace it with the block of code:\n\n```\n```\n\
    if (toolFunctionality.pistolActive){\n    StorePistol();\n}\n```\n```\n\n# # Why?\n\
    \nInstead of just turning pistolActive to false (which would leave the arms showing\
    \ the pistol even though it couldn't be fired), we're telling Unity,\"if in the\
    \ component toolFunctionality, the state of pistolActive is true, run the function\
    \ StorePistol!\" Then in the StorePistol function the pistolActive Boolean will\
    \ be shut off in toolFunctionality.\n\n**Step 26:** Continuing in the OnMouseDown\
    \ function, replace everywhere that the script says `toolFunctionality.flashlightActive\
    \ = false;` with the following block of code:\n\n```\n```\nif (toolFunctionality.flashlightActive){\n\
    \    StoreFlashlight();\n}\n```\n```\n\n**Step 27:** In the block of code that\
    \ is checking to see if the button pressed is InventoryButton_Pistol, remove the\
    \ `toolFunctionality.pistolActive = true;` line. Remember we are now turning that\
    \ on in the ReadyPistol function. Instead, we just need to tell the script to\
    \ go and fire the ReadyPistol, which will switch the Boolean on for us. This will\
    \ make sure the gun gets pulled out before we can fire it. So the block of code\
    \ that deals with the InventoryButton_Pistol should look like this, with new code\
    \ in italics:\n\n```\n```\nif (name == \"InventoryButton_Pistol\"){\n    toolFunctionality.empActive\
    \ = false;\n    if (toolFunctionality.flashlightActive){\n        StoreFlashlight();\n\
    \    }\n    ReadyPistol();\n}\n```\n```\n\n**Step 28:** Further expand this chunk\
    \ of code to be a toggle. This will make it so that when the InventoryButton_Pistol\
    \ is clicked, Unity will pull the pistol out if it's not the active tool, but\
    \ put it away if it's already deployed:\n\n```\n```\nif (name == \"InventoryButton_Pistol\"\
    ){\n    toolFunctionality.empActive = false;\n    if (toolFunctionality.flashlightActive){\n\
    \        StoreFlashlight();\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 473
  md: "```\n```\nif (toolFunctionality.pistolActive){\n    StorePistol();\n} else\
    \ {\n    ReadyPistol();\n}\n```\n```\n\n# **Why?**\n\nSo when the InventoryButton_Pistol\
    \ is clicked, this script goes out to the toolFunctionality script and turns off\
    \ the Boolean empActive. Then, it checks to see if flashlightActive is true, and\
    \ if it is, it runs the function StoreFlashlight (which sets flashlightActive\
    \ to false). Then, it checks if pistolActive is true. If it is, it fires the StorePistol\
    \ function (which sets pistolActive to false). If pistolActive is not true, it\
    \ fires the ReadyPistol function (which sets pistolActive to true).\n\n**Step\
    \ 29:** Create an identical structure for the flashlight. Make sure it's set up\
    \ to work as a toggle as well.\n\n```\n```\nif (name == \"InventoryButton_Flashlight\"\
    ){\n    toolFunctionality.empActive = false;\n    if (toolFunctionality.pistolActive){\n\
    \        StorePistol();\n    }\n    if (toolFunctionality.flashlightActive){\n\
    \        StoreFlashlight();\n    } else {\n        ReadyFlashlight();\n    }\n\
    }\n```\n```\n\n**Step 30:** Get Unity to wait around for just a bit while animations\
    \ play and mouse clicks are registered. Add the following yield WaitForSeconds\
    \ commands:\n\n```\n```\nfunction OnMouseDown () {\n    var toolFunctionality\
    \ = mainCamera.GetComponent\n    (\"AC_ToolFunctionalityScript\");\n    if (name\
    \ == \"InventoryButton_EMP\"){\n        if (toolFunctionality.flashlightActive){\n\
    \            StoreFlashlight();\n        }\n        if (toolFunctionality.pistolActive){\n\
    \            StorePistol();\n        }\n        yield WaitForSeconds (.75);\n\
    \        toolFunctionality.empActive = true;\n    }\n    if (name == \"InventoryButton_Pistol\"\
    ){\n        toolFunctionality.empActive = false;\n```\n```"
  merge: -1
  img_proc: true
