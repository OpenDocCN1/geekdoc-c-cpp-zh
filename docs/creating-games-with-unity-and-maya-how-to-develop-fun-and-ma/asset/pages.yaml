- pgno: 331
  md: '+   10. Just as the desire to eat cake never really goes away (because, let''s
    face it, cake tastes awesome, which contrasts with weighting), painting skin weights
    often feels like it''s never done. Getting to a point that is acceptable is probably
    where you should decide to move on. Chances are, when you are animating, you''ll
    find something that bugs you and you''ll be back fixing it anyway.


    # ### Tutorial 10.3: Maya Animation


    In this game we don''t see a whole lot of Aegis moving (he''ll move his arms,
    but not his whole body in game play). But, seeing how to prepare an animated mesh
    for export from Maya and import to Unity is an important part of the game creation
    process; so we''re making a brief introduction level using our now rigged and
    skinned Aegis to illustrate these techniques.


    But before we can get him exported we need to animate him. Getting all the intricacies
    of effective animation is way beyond the scope of this book, but we will look
    at a few of the important concepts and techniques unique to animating an asset
    for game engine consumption.


    If you''re confident with your rig and skinning, use it for sure. If you grew
    tired of skinning, feel free to use the version of Aegis included on the web site
    (AegisChung-SingleMesh-Rigged).


    # ### General Notes on Game Animation


    There are a few things unique to game animation that is worthwhile to point out.
    First, think cycles. Almost every game character animation should be a cycle;
    this means that the first and the last keyframe of each motion should match. For
    walks, animate from left foot fall to left foot fall. In an idle animation, have
    the character return to exactly the same pose as he began. The reason for this
    is that most animations in games are quite short and called up via script (programmatically).
    Different animations will be called up at different times, but sometimes (like
    in an idle animation) there might not be any new input and an animation needs
    to play through more than once. Without a cycle, the animation will jump and jerk
    in very awkward ways.


    Second, remember that for game animations, most cycles should be short—or often
    shorter than they would be for high-rez projects. For example, a common problem
    for students is the jump animation. They''ve animated it before in a nongame situation
    with a lot of great squash and stretch that when used in game means the character
    hasn''t even gotten ready to jump before they should be in the air. This doesn''t
    mean that good concepts of animation (i.e., squash and stretch) shouldn''t be
    used—in fact it''s critical that they are. They just often need to happen quicker
    and subtler. The one exception to this would be an idle animation—the animation
    a character does when it''s waiting for other instructions. A longer idle animation
    keeps the repeating cycle from being quite so obvious.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Third, do the animations in place. For animations like walk, run, or jump,
    imagine that the character is on an invisible treadmill and while his feet are
    moving as though he’s covering ground, he needs to stay put, walking in place.
    The actual translation of the character will take place programmatically and the
    character will move forward, backward, or side to side based upon user input.
    Think of the walking-in-place character being in a capsule that is moved as the
    animation is played, thus giving the illusion of movement. For those of you who
    have done some high-rez work and worked with IK chains specifically to keep the
    foot from sliding this will be an adjustment; but in game walk cycles, the feet
    should always be sliding. For an illustration of what this would look like take
    a look at the animation between frames 300 and 330 in the AegisChung_SingleMesh.mb
    file on the web site (http://www.Creating3DGames.com). This frame range includes
    a quick animated-in-10-minutes walk cycle animated as a stationary cycle. A quick
    note though; for standing-still animations (like the idle), keep those feet stationary
    because when the character is not moving and the feet slide, any illusion of gravity,
    friction, and reality will be gone.


    Keep it in one file and note the range. There are actually different ways to attack
    this issue. On the one hand Unity allows you to import several files, each with
    its own animation. Then these animations can be called up later and assembled
    on one mesh. However, I generally find it easier to have all the animations created
    in one Maya file and take note of the ranges (idle: frame 1-240, walk: frames
    300-330, etc.). Then when Unity imports the .fbx we are going to export in a bit,
    you can tell Unity to interpret these different animation clips by defining the
    range of frames that that animation occurs in. This just keeps all the animations
    contained in one file and makes the housekeeping easier inside of Unity.


    **Step 1:** Save a backup copy of Aegis. Use File>Save As... and save the file
    as AegisChung-SingleMesh-Rigged. Close the file and reopen AegisChung-SingleMesh.


    # **Why?**


    Once animation is started, the file contains keyframes and poses. Although it’s
    not overwhelmingly difficult to get rid of all the keyframes or to get the character
    back into his bind pose (it’s pretty easy actually), I always prefer to save sequential
    versions of the process in case something horrific happens. We will animate AegisChung
    SingleMesh, but if need be the unanimated but ready to be animated version is
    always waiting for us.


    # **Tips and Tricks**


    An alternative to saving multiple versions like this—and one that we teach at
    UW—is to use referencing. Referencing is the process of importing an instance
    of a Maya file that can then be manipulated (including animated) but leaves the
    original referenced file untouched.'
