- pgno: 41
  md: '# Dock Creation


    **Step 9:** Begin creation of the cement dock area in a similar fashion. Start
    with a cube (renamed in the Outliner to `EntryWayDock`) that is X = 20, Y = 4,
    Z = 60 (this can be adjusted later as we build), and extrude the faces as shown
    in Figure 2.10.


    **FIGURE 2.10** Beginning to lay out dock.


    ![](img/0285f88bc840f313779e011725b623a5_41_0.png)


    **Step 10:** Continue working around the dock making sure to make extrusions at
    locations that will allow for new extrusions that will allow for holes (Figure
    2.11).


    **FIGURE 2.11** Continuing dock layout.


    ![](img/0285f88bc840f313779e011725b623a5_41_1.png)


    # Tips and Tricks


    Deciding when to make extrusions is a skill you build up over time and with experience.
    I find that sketching out the shape I want to make on a sheet of paper, and then
    sketching out the places that extrusions would need to be made, helps me quite
    a bit when it comes time to do it digitally.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '**Step 11:** Here''s where things might get a bit tricky. What we want to do
    is make sure we have new locations to build outcroppings of the dock. Look carefully
    at how extrusions are made to allow for future extrusions that make the stepping
    out. Notice that this creates some pretty inefficient topology (geometry where
    there needn''t be), but we will clean that up in a bit (Figure 2.12).


    ![](img/0285f88bc840f313779e011725b623a5_42_0.png)


    # Tips and Tricks


    This part of the process is really about roughing out the shape. It won''t be
    perfect right away, so don''t worry too much about being exact. When creating
    this tutorial, I ended up with lots and lots of Undo''s to get back to a place
    that would allow me to more efficiently create the form. 3D creation is a process
    of stops and starts to be certain.


    **Step 12:** Create a stepped section by deleting faces and filling them in with
    the Append to Polygon tool. Select the faces on the far corner (as shown in Figure
    2.13) and delete them. This will leave a hole in the mesh that needs to be filled.
    One way to fill this is the Append to Polygon tool. To use this tool, be sure
    to be in Object Mode (right-click the object and select Polygon Tool) and click
    an edge of the hole. Purple arrows will appear that show the path of the new polygon
    that will be created. Click these arrows until the face is filled and press Enter.
    Repeat for the other plane that needs to be filled.


    ![](img/0285f88bc840f313779e011725b623a5_42_1.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Tips and Tricks


    When using the Append to Polygon tool, usually there is no need to go all around
    the outside of the shape that is being filled. It is faster to click one edge,
    and then click the edge opposite that edge and press Enter. This fills the hole
    quickly as it figures out the other edges are included in the function.


    # Tips and Tricks


    Notice that after filling the hole, there will be some black chunks across the
    new planes that have been made. This is happening because the new polygon has
    **soft normals**, which are great for organic shapes, but not so great with rigid
    forms like this dock. To get rid of these, select the object and choose Polygons>Normals>Harden
    Edge.


    **Step 13:** Rotate the front of the dock. Right-click the dock and choose Vertex
    from the hotbox menu. Marquee select the vertices across the front of the dock
    as shown in Figure 2.14. Choose the Rotate tool (keyboard shortcut is the E key),
    and then (to move the axis of rotation) press and hold the D key on the keyboard.
    Move the manipulator handles back to the back corner of the collection of vertices
    that have been selected. Release the D key and rotate the vertices from this new
    axis just defined.


    ![](img/0285f88bc840f313779e011725b623a5_43_0.png)


    FIGURE 2.14 Rotating a collection of points from a new axis of rotation.


    # Tips and Tricks


    This rotation trick or moving the axis of rotation (via holding down the D key
    or by pressing the Insert key) works in Object mode too. The axis of rotation
    can be moved to wherever it needs to be for a given object. In our case, it''s
    temporary for a selection of components (vertices in this example), but when done
    while in Object mode, the object will "remember" this new axis location.


    # Dock Optimization


    **Step 14:** Optimize the mesh. In the process of outlining this shape, we have
    quickly made some shapes that could be optimized. As pointed out earlier, polycount
    is rarely the problem with slow games, but it is certainly one of them. Especially
    if you are developing for iOS (iPad, iPhone, iPod Touch) or Android, keeping a
    tight grasp on polycount will be critical.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'To optimize what we''ve created, we will be deleting edges that aren''t needed
    and rearranging some of the edges that exist. Figure 2.15 shows one such edge
    that we should delete. Double-click the edge that will attempt to select an edge
    loop and then either press Delete on the keyboard (and then select and delete
    the vertices it leaves behind), or Ctrl-right-click and choose Edge Loop Utilities
    > To Edge Loop and Delete (which will automatically delete the left-behind points).


    **Step 15:** Adjust topology to ensure four-sided polygons. Look carefully at
    Figure 2.16. Note that this top polygon is actually a five-sided polygon. It''s
    deceptive as sides 4 and 5 at first blush appear to be one edge, but there is
    a vertex in the middle where that other edge comes out. In a case like this, where
    all the polygons on the top of the deck are on the same plane, this five-sided
    poly would likely not cause any trouble; to be sure we will use another new tool,
    the **Split Polygon tool.**


    ![](img/0285f88bc840f313779e011725b623a5_44_0.png)


    FIGURE 2.15 Edge that isn''t needed and should be deleted. Make sure you delete
    the points it leaves behind.


    ![](img/0285f88bc840f313779e011725b623a5_44_1.png)


    FIGURE 2.16 Deceptive five-sided polygon.


    In Object Mode, choose Polygons>Edit Mesh>Split Polygons Tool. This tool works
    by clicking and dragging on an edge to establish where to split the polygon. Usually
    click an edge and drag along the edge to a point (Figure 2.17). Click again on
    the opposite edge and drag to the point opposite the first. This will create two
    polygons (a four-sided one and a three-sided one) where there was once a five-sided
    polygon.


    **Step 16:** Clean corners. Now that we''ve used the Split Polygon tool, we can
    further optimize our polycount in places that make right corners. Figure 2.18
    shows the result of using the Split Polygon tool to make a new cut from corner
    to corner. After this diagonal cut is made, the two straight edges that used to
    make the corner can be deleted.


    ![](img/0285f88bc840f313779e011725b623a5_44_2.png)


    FIGURE 2.17 Using the Split Polygon tool.


    ![](img/0285f88bc840f313779e011725b623a5_44_3.png)


    FIGURE 2.18 Optimizing a corner. Split Polygon tool creates the diagonal which
    then makes two edges unneeded.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Tips and Tricks


    Be sure that when getting rid of the edges that are no longer needed that those
    edges as they continue down the size and bottom of the shape are deleted as well.
    Additionally, watch for left-over vertices that should be selected and deleted
    as well.


    **Step 17:** Repeat and optimize throughout right corners (Figure 2.19).


    ![](img/0285f88bc840f313779e011725b623a5_45_0.png)


    **FIGURE 2.19** Optimized corners.


    # Why?


    Looking at Figure 2.19, you can count four four-sided polygons that were involved
    in the three right angle turns the shape made. This makes for eight tris. Compare
    that with the seven four-sided polys that were there before (14 tris), and you
    can see how this sort of optimization can whittle down a polycount in a hurry.
    Ultimately there are some tradeoffs you have to make. It takes a bit of time to
    optimize, and if you''re taking too much time out to optimize you''re eating into
    your creation time. However, I find that if I do a bit of obvious optimizing as
    I go, it saves me from hours of painful optimization later.


    **Step 18:** Delete the polygons along the bottom. We don''t see them, we don''t
    need them, get rid of them.


    There is certainly some other optimization that can be done here, but we have
    looked at the basic techniques that are used to make a lean, mean mesh. Feel free
    to further optimize, but for now we''ll move on.


    **Step 19:** Add the lip to inside of the channel. Select the faces as shown in
    Figure 2.20 (the faces that are along the inside of the channel into the mountain),
    and use the Extrude tool to extrude them out just a small bit. This will create
    a new collection of faces along the dock top. Select these and extrude up to create
    the lip.


    **Step 20:** Duplicate and place the column roughly as shown in Figure 2.21. Yes,
    I realize it would be better to UV map the column first before duplicating it.
    And in fact, these columns we are placing now will undoubtedly be deleted and
    replaced by duplicates that are UV mapped. However, placing these here allow for
    some important placement of items in the upcoming steps.'
  merge: -1
  img_proc: true
