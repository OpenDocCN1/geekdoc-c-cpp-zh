- pgno: 372
  md: "```\nif (name == \"Button_Begin\"){\n    Application.LoadLevel (\"Scene-EntryWay\"\
    );\n}\n```\n\n# Why?\n\nLastly, if the object is named \"Button_Begin\" it will\
    \ load the level or go to the level Scene-EntryWay, which is the Unity scene created\
    \ in earlier tutorials.\n\n**Step 37:** Save and return to Unity. Adjust any errors\
    \ with syntax; this can take a little while and some careful scrutiny, but remember\
    \ Unity won't run until the syntax is acceptable.\n\n**Step 38:** Deactivate DataPanel_Biography\
    \ and DataPanel_Mission GameObjects' GUITextures. One at a time, select the GameObject\
    \ in the Hierarchy, then in the Inspector click off GUITexture component. This\
    \ will make these DataPanels disappear from the Game view.\n\n# Why?\n\nWhen the\
    \ level starts, both of the DataPanels should be off and only be visible when\
    \ their corresponding button is clicked.\n\n**Step 39:** Play. Test the game.\
    \ The mission and bio buttons should both work and show the corresponding DataPanels\
    \ when clicked. The begin button assuredly will not work yet—we'll fix that in\
    \ a bit.\n\n# Further Optimization\n\nThe script works (well) mostly, but we'll\
    \ fix that Begin button in a bit; However, it's fairly clumsy to have to define\
    \ manually the DataPanels for each pesky button. It would sure be nice if Unity\
    \ would do that for us.\n\n# function Start and function Awake\n\nSo far we have\
    \ used functions that are activated when a specific user-defined event occurs\
    \ (the player moves the mouse over an object, leaves the object, or clicks the\
    \ object). We can also write functions that happen when the game begins on an\
    \ object (containing a script) that is activated.\n\n**function Awake** is a function\
    \ that is called when the game launches. Well, in theory it fires after all the\
    \ objects in the scene are loaded, but before the player can interact with the\
    \ rest of the game. This means certain settings can be set here, or variables\
    \ defined.\n\nA close cousin to function Awake is **function Start**. The difference\
    \ is that function Start fires after function Awake, and will fire only if the\
    \ object is active. This means an object could be turned off and the game started,\
    \ and"
  merge: -1
  img_proc: true
- pgno: 373
  md: "the function Start would remain dormant but would fire up as soon as the object\
    \ was activated. However, anything that is in a function Awake will still fire\
    \ whether the object is active or not.\n\nThe reason all this matters to us is\
    \ we can have the script go and find our two DataPanels and populate the variables\
    \ of the OpenSceneButtonsScript for us (no need to manually populate). For most\
    \ cases where we're defining variables, function Awake should be used because\
    \ the definitions should happen right at the beginning.\n\n# Warnings and Pitfalls\n\
    \nSome of the lines of code are longer than the format of a book will allow. Remember\
    \ that there is usually a new line at the end of each statement, and that each\
    \ statement ends with a \";\" So if a line shown here doesn't end with a \";\"\
    \ or a \"{\" (for blocks of code), keep it as a solid line of code.\n\n**Step\
    \ 40:** Reopen OpenSceneButtonsScript. Replace the variable declarations with\
    \ the following:\n\n```\n```javascript\nprivate var dataPanelBiography : GameObject;\n\
    private var dataPanelMission : GameObject;\n\nfunction Awake () {\n    dataPanelBiography\
    \ =\n        GameObject.Find(\"DataPanel_Biography\");\n    dataPanelMission =\n\
    \        GameObject.Find(\"DataPanel_Mission\");\n}\n\nfunction OnMouseEnter ()\
    \ {\n    guiTexture.color = Color (1,1,1);\n}\n\nfunction OnMouseExit () {\n \
    \   guiTexture.color = Color (.2,.2,.2);\n}\n\nfunction OnMouseDown () {\n   \
    \ if (name == \"Button_Bio\") {\n        dataPanelBiography.guiTexture.enabled\
    \ = true;\n        dataPanelMission.guiTexture.enabled = false;\n    }\n    if\
    \ (name == \"Button_Mission\") {\n        dataPanelMission.guiTexture.enabled\
    \ = true;\n        dataPanelBiography.guiTexture.enabled = false;\n    }\n   \
    \ if (name == \"Button_Begin\") {\n        Application.LoadLevel (\"Scene-EntryWay\"\
    );\n    }\n}\n```\n```\n\n# Warnings and Pitfalls\n\nGameObject.Find is a very\
    \ handy tool to have. However, it can quickly be abused. For instance, if GameObject.Find\
    \ is contained within a function Update, this means that Unity is being asked\
    \ to go find an object on every single frame. Very many of these and suddenly\
    \ Unity is more busy looking for objects than it is running the game. Generally,\
    \ use GameObject.Find when it can fire once (like in function Awake situations\
    \ or within another function that is called at a very specific time).\n\n# Why?\n\
    \nThere are two things happening here. First, private was added before each of\
    \ the variable declarations. A private variable is a variable that can be defined,\
    \ but it isn't defined in the Unity Editor via dragging items as we did before.\
    \ Although those could remain public, since they are going to be defined in the\
    \ script, it keeps another developer from trying (or feeling like they need) to\
    \ populate variables."
  merge: -1
  img_proc: true
