    ![](img/0285f88bc840f313779e011725b623a5_523_1.png)


    Specifically, the Player Settings window can allow us to start to brand the build
    we are about to output. This can include text branding but also can allow visual
    elements like what the icon looks like for the executable once the file is built
    (Figure 18.5) and what the splash image looks like when the user first launches
    the game (Figure 18.6).


    There are two ways to access Player Settings: Edit>Project Settings>Player, or
    File>Build Settings and then pressing the Player Settings button at the bottom
    of that dialog box.


    The Player Settings window has an interface that can be a little confusing at
    first glance—the buttons don''t always make it easy to see what''s happening.
    There are two main sections of the window, Cross-Platform Settings and Per-Platform
    Settings.


    The Cross-Platform Settings allows for the quick definition of your Company Name
    and the Product Name. Easy enough.


    The Per-Platform Settings actually includes quite a few sections. Resolution and
    Presentation, Icon, Splash Image, and Other Settings are all expandable sections
    that expand once you click the word. At the top of the Per-Platform settings are
    two tools for either PC and Mac Standalone mode (shown in Figure 18.7) or Web
    Player settings. It can be goofy figuring out which one is actually selected so
    be sure to just notice which is active with the line of text immediately beneath
    the buttons.


    # Resolution and Presentation


    This area of course allows for how the game is to be presented. It''s an interesting
    area though as in some ways it''s simply a “suggest how the game should look”
    section. All the default settings (Screen Width, Screen Height, Is Full Screen)
    are simply the suggested settings when the player launches the application. As
    long as the Display Resolution Dialog drop-down menu (also in this Resolution
    and Presentation area) is not enabled, the player still has the chance to change
    the resolution up or down.'
