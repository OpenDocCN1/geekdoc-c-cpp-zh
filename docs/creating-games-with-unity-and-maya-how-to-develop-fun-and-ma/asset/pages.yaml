    # Log Files


    The Console shows errors generated when playing a game within Unity’s editor.
    This is the preferred method of bug squashing and optimization since the warnings
    and errors can be fixed as the game is created. However, there are also log files
    that are created when the stand-alone game is run. These log files can be a laborious
    but comprehensive form of tracking down what’s happening in the game.


    Most beginning game designers never have need to access this level of information,
    but it’s worthwhile to point out that these logs exist and where to find them.


    For Mac users, the logs are stored at ~/Library/Logs/Unity/. For Windows XP logs
    are usually stored in C:\Documents and Settings\UserName\Local Settings\Application
    Data\Unity\Editor. On Windows 7 the logs are stored at C:\Users\UserName\AppData\Local\Unity\Editor.


    It''s important to remember though that each time the game is run, the log (Editor.log)
    is overwritten. So if you need to compare logs, be sure you''re moving copies
    of the log out of that folder or renaming them.


    # Optimizing with Textures


    Keeping an eye on the prize of maximum impact with the smallest texture file size
    is a nonstop consideration in the creation of textures for a game. However, often
    a texture is created at a resolution that we think we need and turns out not to
    be needed at that high a resolution. This is commonly where I find the quickest
    and most needed optimization to take place.


    Remember that when texture files are imported into Unity, by default its max size
    is set to 1024. This means that if an image comes in at 512x512, it remains at
    512x512, but if a 2048x2048 image is brought in, Unity down-samples it to 1024x1024.
    While putting together the Scene-EntryWay, we looked at how to up-sample this
    texture information so that Unity is indeed using the 2048x2048 if it''s needed.


    What often happens is that when creating a scene and closely scrutinizing each
    object, the tendency is to feel the need to up-sample all sorts of stuff. But
    when all is said and done, especially when lighting has been'
