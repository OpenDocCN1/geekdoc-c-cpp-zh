    # # Unity: Creating Inventory Systems


    Thus far we have created several weapons and tools (our flashlight, EMP, and pistol).
    However right now, in order to use any of the three, they have to be activated
    in the script manually before running the game. This, of course, is a useless
    method to the player. What we need to do is create an inventory system that allows
    the player to choose which tool he wants to use and when. This inventory system
    will also do the work behind the scenes of turning various tool functionality
    on and off in the scripts.


    Right now, the gun is active even when placing an EMP. The flashlight is shining
    even when the flashlight isn''t visible. We need to get these tools so we use
    them one at a time. Before we get to the nitty-gritty, though, there are a few
    core ideas to cover.


    # ## State Engine and How Many Scripts?


    A state engine is a mechanism that (for our purposes) will keep track of what
    state the game is in. Or more directly, what state the player is in. Or more specifically,
    what weapon/tool the character is using. It turns out we''ve actually been creating
    one as we''ve been building the AC_ToolFunctionalityScript.'
  merge: -1
  img_proc: true
- pgno: 463
  md: 'So far this script''s main chunk of code is a big Update function that checks
    if a list of Booleans are true or false. Depending on which Boolean is true, the
    script fires a block of code, or calls on another function within the script.
    Currently, the only way to define which Boolean is true is via the public variables
    accessible in the Inspector.


    But this state engine can be much more robust. We can build in functionality that
    allows other scripts to call back to AC_ToolFunctionalityScript and tell it that
    a certain state (Boolean) is now active, or deactivate a Boolean. With this new
    information, AC_ToolFunctionality can fire new blocks of script at the appropriate
    times.


    Currently almost all these blocks of script are housed within AC_ToolFunctionalityScript.
    And this script is getting a bit unwieldy to show in this book since it''s getting
    long. In fact, large chunks of this script could indeed be broken out into other
    distinct and discreet scripts and this AC_ToolFunctionalityScript could simply
    call out to these particular scripts when needed. There are some real benefits
    to working this way: the gun functionality can be included in a GunFunctionality
    script. Someone coming into the project can look at a script folder and see quickly
    what things are happening and what''s doing it without having to read through
    too much script. The drawback to a whole lot of scripts is the temptation to start
    letting multiple scripts control the same thing, like locking and hiding the mouse.


    I''ve been involved and have authored projects (to my shame) that have multiple
    scripts hanging around the project that have access to things like hiding the
    cursor. The problem is that as the game development progresses and there''s a
    bug that the mouse isn''t becoming visible when needed, it is a nightmare tracking
    down which script is turning it off, and which script should be turning it on
    when multiple scripts have that capability.


    Using a centralized script to house things like the mouse turning off and on,
    and what the state of the game is in means there is only one place to go when
    searching out and squashing bugs. This centralized script houses the state engine
    and coordinates what''s happening with other scripts. Other scripts can call out
    to it, but it keeps track of the central state of the game. One script to rule
    them all.


    My colleague here at Los Alamos National Laboratory who is the central programmer
    for our team has had to develop sophisticated state engines. The training modules
    he authors are a thing of beauty since the prefabs are hardly ever broken, and
    all of his scripts sit in an empty GameObject in the game called ScriptContainer.
    All the functionality is contained in that one little package. Of further interest
    is how few scripts actually sit in there—oftentimes a complex game will have only
    three or four scripts (he also is constructing custom classes similar to iTween
    that reside in the Project panel that he can call on within the few scripts he
    hangs in the Hierarchy panel).'
  merge: -1
  img_proc: true
