- pgno: 485
  md: '# Tutorial 16.2: Keys


    Hopefully, this will be a fun tutorial. In the process of this tutorial, we''ll
    make use of the techniques we''ve covered in the past tutorials. By assembling
    these skills in a new way, we''ll have a new mechanism in the game.


    The process will go like this: First we''ll need to create a trigger that checks
    to see if the player has the key when the player enters it. If the player does
    indeed have the key, the door will open; if the player does not, a text prompt
    will pop up to alert the player that he needs the key. We''ll create a PickUpKey
    function that fires when the player''s ray is cast upon the key and the player
    clicks it. When the player clicks the key, we''ll make the key disappear from
    the scene, but create a GUI element to indicate that the key is on the player''s
    person. It''s going to be fun!


    +   1. **Step 1:** Create a new GUITexture to show the key. Create a new GUITexture
    (`GameObject>Create Other>GUITexture`) and name it `KeyIcon`. Use the texture
    `Icon-Key` from the 2D Assets folder to define its texture.

    +   2. **Step 2:** Place the key in the top-right corner of the screen. Select
    `KeyIcon` in the Hierarchy and in the Inspector change the Transform X and Y values
    to 1. Change the Pixel inset values to X = -70, Y = -70, Width = 64, Height =
    64 (Figure 16.6).


    ![](img/0285f88bc840f313779e011725b623a5_485_0.png)


    # Why?


    The image is 64x64. With the GUITexture at 1,1,0, the bottom-left corner of the
    image is at the top-left corner of the screen, meaning that the image is off the
    screen. By offsetting the pixels by -70 in both X and Y, we slide the image back
    onto the screen with a 6-pixel buffer above and to the right.


    +   3. **Step 3:** Now that you can see what it will look like when visible, move
    it off the screen. Select `KeyIcon` in the Hierarchy and in the Inspector, change
    the Transform X = 1, 1.'
  merge: -1
  img_proc: true
- pgno: 486
  md: "**Why?**\n\nWe're just sliding it off the screen, so that when the key is actually\
    \ acquired, it can slide back on.\n\n**Step 4:** Make KeyIcon a child of GUIElements.\
    \ Go ahead and break the prefab. Then once the KeyIcon is a child of GUIElements,\
    \ be sure to press the Prefab Apply button.\n\n# Accessing the State Engine\n\n\
    **Step 5:** Open AC_ToolFunctionalityScript.\n\n**Why?**\n\nOur state engine exists\
    \ in the AC_ToolFunctionalityScript. Remember this is where we're keeping track\
    \ of flashlightActive, pistolActive, empActive, and empGhostActive. We need to\
    \ add a new state (a new Boolean): keyAcquired.\n\n**Step 6:** Make the state\
    \ engine is aware of a new potential state: keyAcquired. Add the following lineup\
    \ among the variable declarations:\n\n```\nprivate var flashlightActive : boolean;\n\
    private var pistolActive : boolean;\nprivate var empActive : boolean;\nprivate\
    \ var empGhostActive : boolean;\nprivate var keyAcquired : boolean;\n```\n\n**Why?**\n\
    \nWe could technically store this Boolean in other places, but keeping all the\
    \ Booleans in one place really helps when it comes time for bug squashing. If\
    \ all the states are being stored in one place, we know exactly what place to\
    \ look if the state isn't working as desired.\n\n# Building upon the Raycasting\
    \ Mechanism\n\nRemember that earlier we set up this AC_ToolFunctionalityScript\
    \ with a raycasting mechanism. Look up in the function Update section and see\
    \ that the following block of code exists:\n\n```\nif (hitObj.name == \"Hallway_Key\"\
    ){\n    AddHighlight(hitObj);\n}\n```\n\nThis exists within the raycasting mechanism\
    \ and says, \"if the object we raycast against is named 'Hallway_Key,' fire the\
    \ AddHighlight function.\" This really is just a placeholder for what's really\
    \ going to happen here."
  merge: -1
  img_proc: true
- pgno: 487
  md: "In reality, if the object that is being raycast against is named Hallway_Key,\
    \ we need to highlight it, and then if the user clicks the mouse we need to fire\
    \ a new function called PickUpKey.\n\n**Step 7:** Rework this section to read\
    \ as follows:\n\n```\n```\nif (hitObj.name == \"Hallway_Key\") {\n    AddHighlight(hitObj);\n\
    \    if (Input.GetMouseButtonDown(0)) {\n        PickUpKey();\n    }\n}\n```\n\
    ```\n\n> > **Why?**\n> >\n> > So what we're saying here is “if the object raycast\
    \ against is named Hallway_Key, then highlight it, and then (if the object being\
    \ raycast against is still Hallway_Key) if the user clicks the mouse button, fire\
    \ the function PickUpKey.”\n\n# Fleshing Out PickUpKey\n\nNow we can do all the\
    \ action involved in actually picking up the key.\n\n**Step 8:** Scroll and create\
    \ a new function called PickUpKey. Flesh the function out like this:\n\n```\n\
    ```\nfunction PickUpKey(){\n    var keyIcon : GameObject=GameObject.Find(\"KeyIcon\"\
    );\n    iTween.MoveTo (keyIcon, Vector3 (1.1,0), 1);\n    var keyGeometry : GameObject\
    \ = GameObject.Find\n    (\"Hallway_Key\");\n    keyGeometry.active = false;\n\
    \    keyAcquired = true;\n}\n```\n```\n\n> > **Why?**\n> >\n> > This does some\
    \ interesting things. First, notice that there are two local variables declared\
    \ (keyIcon and keyGeometry). We will use these only once (the character picks\
    \ up the key only once), so rather than cluttering up an already crowded block\
    \ of variable declarations, we'll declare these new variables as we need them.\n\
    > >\n> > Immediately after declaring each, and even in the same line, we tell\
    \ Unity to go out and populate them by finding objects by a particular name. Generally,\
    \ using GameObject.Find in a function can be dangerous,"
  merge: -1
  img_proc: true
