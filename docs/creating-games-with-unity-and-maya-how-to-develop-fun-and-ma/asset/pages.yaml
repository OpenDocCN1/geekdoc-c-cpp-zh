    # Why?


    There are a lot of philosophies on foot rigs. This rig is one of the most basic
    but provides a great deal of direct control. There is still some organizing to
    do, but when all is done, the feet will have some great flexibility in movement
    that will allow for foot and even toe movement.


    **Step 27:** Rename the ikHandle to `AC_L_ToeIK`.


    **Step 28:** Resize IK Handles. Go to Windows>Settings/Preferences>Preferences.
    Again, look for the Display section and choose the Kinematics section from the
