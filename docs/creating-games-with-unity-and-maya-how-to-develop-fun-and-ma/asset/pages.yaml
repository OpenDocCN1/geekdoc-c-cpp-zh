- pgno: 475
  md: "We already know how to turn objects on and off (GameObject.active = true/false);\
    \ we just need to declare the variables and then have them turned on and off in\
    \ the right places.\n\n# **Step 32:** Declare three new private variables at the\
    \ top of the script:\n\n```\nprivate var aegisFlashlight : GameObject;\nprivate\
    \ var aegisFlashlightLight : GameObject;\nprivate var aegisPistol : GameObject;\n\
    ```\n\n# **Why?**\n\nWe're declaring a variable to house the geometry of the flashlight\
    \ (aegisFlashlight), the light (created way back when working in the hallway),\
    \ and the pistol geometry (aegisPistol). We'll populate these here in our Awake\
    \ function in a bit.\n\n# **Step 33:** Populate these new private variables in\
    \ the Awake function. So it should read like this:\n\n```\nfunction Awake(){\n\
    \    mainCamera = GameObject.Find(\"Main Camera\");\n    toolFunctionality = mainCamera.GetComponent(\"\
    AC_ToolFunctionalityScript\");\n    aegisArms = GameObject.Find(\"AegisChung_Arms_Prefab\"\
    );\n    aegisFlashlight = GameObject.Find(\"AC_Flashlight\");\n    aegisFlashlightLight\
    \ = GameObject.Find(\"Flashlight\");\n    aegisPistol = GameObject.Find(\"AC_Pistol\"\
    );\n}\n```\n\n# **Why?**\n\nAgain, the assumption at this point is that we won't\
    \ be renaming things, and that we go out and find only one of the objects. Again,\
    \ the benefit of this is that we needn't populate them within Unity's editor—the\
    \ drawback is that if we rename something, this script will break.\n\n# **Step\
    \ 34:** Activate these and deactivate them in the appropriate places within the\
    \ ReadyPistol, StorePistol, ReadyFlashlight, and StoreFlashlight functions:\n\n\
    ```\nfunction ReadyPistol(){\n    aegisPistol.active = true;\n    aegisArms.animation[\"\
    PistolReady\"].speed = 1;\n    aegisArms.animation.Play(\"PistolReady\");\n  \
    \  yield WaitForSeconds(aegisArms.animation.clip.length);\n    toolFunctionality.pistolActive\
    \ = true;\n}\n\nfunction StorePistol(){\n    aegisArms.animation[\"PistolReady\"\
    ].speed = -1;\n```"
  merge: -1
