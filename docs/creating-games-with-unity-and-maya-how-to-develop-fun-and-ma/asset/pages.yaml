- pgno: 207
  md: "# Why?\n\nCreating the eyeball first provides an important starting point.\
    \ With an appropriately placed eyeball, the polygons that will become the eyelid\
    \ can quickly and easily be organized to have the appropriate shape.\n\n+   **Step\
    \ 13:** Duplicate the eyeball. Ctrl-D (Cmd-D on Mac) will duplicate the eyeball.\
    \ In the Channels Editor, change the Translate X value to a negative value (mine\
    \ went from 3.022 to -3.022).\n+   \n+   **Step 14:** Take time to name the spheres\
    \ `Left_Eye` and `Right_Eye` in the Outliner. Remember to label these relevant\
    \ to the character (the character’s left and right).\n\n# Creating Polygon Rings\n\
    \n+   **Step 15:** Create the first polygon. Choose Polygons>Mesh>Create Polygon\
    \ tool. In the Front view, create a four-sided polygon that approximates the shape\
    \ of the start of the eyelid (Figure 8.5).\n\n**FIGURE 8.5** Starting out with\
    \ the first polygon.\n\n![](img/0285f88bc840f313779e011725b623a5_207_0.png)\n\n\
    # Tips and Tricks\n\nThe Create Polygon tool will allow for the creation of those\
    \ dastardly n-sided polygons. When using this tool, be sure that after creating\
    \ the fourth side, to press the Enter button to exit the tool.\n\n+   **Step 16:**\
    \ Adjust in 3D (via the side- and persp-view panels) to get the shape of this\
    \ polygon correct in relationship to the eyeball.\n\n# Why?\n\nThis is essentially\
    \ the core process: create new polygons in one view (in this case the front view\
    \ panel) and then tweak in the other views to ensure that each newly created polygon\
    \ is the right shape in space."
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Step 17: Extrude out the new polygon. Select the top polygon''s edge and use
    the Extrude tool (Polygons>Edit Mesh>Extrude) to then pull out another polygon
    to roughly match Figure 8.6.


    ![](img/0285f88bc840f313779e011725b623a5_208_0.png)


    FIGURE 8.6 Extruding new polygons.


    # Tips and Tricks


    Notice that in Figure 8.6 the eye is no longer visible. It''s not deleted, it''s
    just hidden. Sometimes having it there is important, but other times it just makes
    things like the side view cluttered and unwieldy. To hide the eye, select it and
    press Ctrl-H. It can be made visible again by selecting it in the Outliner, then
    in the Channels Box, changing the Visible setting to On.


    Step 18: Repeat this process, being sure to rotate the new polys, to cover the
    top lid (Figure 8.7).


    Step 19: Continue extruding and rotating around the bottom of the eye.


    Step 20: Use Append to Polygon to close the final gap. When the extrusions have
    gone to where there would be one more polygon to complete the ring, exit the Extrude
    tool and choose Polygons>Edit Mesh>Append to Polygon Tool. Click the started edge
    of the first polygon, and then the ending edge of the last polygon. A new polygon
    will appear, thus closing the ring of polygons (Figure 8.8).


    ![](img/0285f88bc840f313779e011725b623a5_208_1.png)


    FIGURE 8.7 Top lid being formed.    FIGURE 8.8 Closing the ring with the Append
    to Polygons tool.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '**Step 21:** Adjust the new polygons in 3D space. Change to vertex mode. In
    the side- and persp-view panels, select and move collections (often pairs) of
    vertices **only in Z** so that they move back to the appropriate place on the
    eyeball (Figure 8.9).


    **FIGURE 8.9** Adjusting vertices around the eyeball.


    ![](img/0285f88bc840f313779e011725b623a5_209_0.png)


    **Step 22:** Provide thickness to the eyelid. Once the general shape of the eye
    is complete, change to edge mode and double-click an edge of the inside of the
    ring of polygons (this will select the ring). Choose the Extrude tool (Polygons>Edit
    Mesh>Extrude), and then immediately swap to the Move tool. Move this newly extruded
    edge back into the eyeball along the Z-axis (Figure 8.10).


    **FIGURE 8.10** Providing eyelid with thickness


    ![](img/0285f88bc840f313779e011725b623a5_209_1.png)


    # **Why?**


    Every time the Extrude tool is selected it extrudes a new collection of polygons.
    If the Extrude tool''s manipulators are used, the new polygons are moved, scaled,
    or rotated along the polygons'' normals. But swapping to the Move tool allows
    this new collection of polygons (or edges) to be manipulated *en masse* along
    a global direction (in this case Z).'
  merge: -1
  img_proc: true
- pgno: 210
  md: "**Step 23:** Mirror the mesh. Swap to object mode and select the face thus\
    \ far. Select Edit>Duplicate Special (Options). In the Duplicate Special Options\
    \ window choose Edit>Reset Settings. Change the Geometry Type to Instance. Change\
    \ the Scale X input setting (the first column of Scale) to –1. Click the Duplicate\
    \ Special button to finish the mirroring of the geometry (Figure 8.11).\n\n![](img/0285f88bc840f313779e011725b623a5_210_0.png)\n\
    \n> **Why?**\n> \n> Scaling an object –1 in any direction will create a mirror\
    \ version of the object. By making sure this duplicate is an instance, we ensure\
    \ that as one side of the face is built up, this duplicate will also update. Now\
    \ this –1 scaled half of the character will not be the one imported into Unity\
    \ (the normals are funky), but as a construction method, this works well to see\
    \ the whole face rather than just one half at a time.\n\n# Expanding Rings\n\n\
    **Step 24:** Expand the rings. Change to edge mode and double-click one of the\
    \ outer edges (this should select the outer ring of edges). Choose the Extrude\
    \ tool and then immediately swap to the Scale tool and scale (by dragging on the\
    \ middle cube manipulator handle) this new collection of edges out in every direction\
    \ (Figure 8.12).\n\n![](img/0285f88bc840f313779e011725b623a5_210_1.png)"
  merge: -1
