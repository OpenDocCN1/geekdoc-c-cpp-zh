  md: '# Explain types of inheritance with example.


    +   - Inheritance is the process, by which class can acquire the properties and
    methods of another class.

    - The mechanism of the new class is derived from a new class from an old class
    is called inheritance.

    - The new class is derived base class and old class is called the base class.

    - The derived class may have all the features of the base class and the programmer
    can add new features to the derived class.


    # Types of Inheritance:


    # Single Inheritance


    +   - If a class is derived from a single class then it is called single inheritance.

    - Class B is derived from class A


    ![](img/f20ebad23d7bd6ce200c44e70b08aa15_35_0.png)


    # Multilevel Inheritance


    +   - A class is derived from a class which is derived from another class then
    it is called multilevel inheritance

    - Here, class C is derived from class B and class B is derived from class A, so
    it is called multilevel inheritance.


    ![](img/f20ebad23d7bd6ce200c44e70b08aa15_35_1.png)


    # Multiple Inheritance


    +   - If a class is derived from more than one class then it is called multiple
    inheritance.

    - Here, class C is derived from two classes, class A and class B.


    ![](img/f20ebad23d7bd6ce200c44e70b08aa15_35_2.png)


    # Hierarchical Inheritance


    +   - If one or more classes are derived from one class then it is called hierarchical
    inheritance.

    - Here, class B, class C and class D are derived from class A.


    ![](img/f20ebad23d7bd6ce200c44e70b08aa15_35_3.png)'
