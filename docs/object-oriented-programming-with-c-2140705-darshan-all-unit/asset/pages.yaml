    2 – C++ Basics


    +   1. Arrays

    2. Function

    3. Pointers


    * We cannot use the derived data type without use of primary data type.

    * **Array**: An array is a fixed-size sequenced collection of elements of the
    same data type.

    * **Pointer**: Pointer is a special variable which contains address of another
    variable.

    * **Function**: A Group of statements combined in one for some special purpose.


    **User Defined types:**

    * We have following type of user data type in C++ language.

    * The user data type is defined by programmer as his/her requirement.

    * **Structure**: Structure is a collection of logically related items of different
    data types grouped together and by a single name.

    * **Union**: Union is like a structure, except that element shares the common
    memory.

    * **Class**: A class is a template that defines the fields and methods of things
    or objects. A class is a prototype from which objects are created.

    * **enum**: Enum is a user-defined type consisting of a set of named constants
    enumerator.


    +   * In other words enum also used to assign numeric constants to strings

    * Syntax of enumeration: enum_tag {list of variables};

    * Example of enumeration: enum day_of_week {mon=1,tue,wed,thu,fri,sat,sun};


    Describe various operators used in C++.

    An operator is a symbol that the compiler to perform certain mathematical or logical
    operation.


    1. Arithmetic Operators

    Arithmetic operators are used for mathematical calculation. C++ supports following
    arithmetic operators


    | | |

    | + | Addition or unary plus |

    | | Subtraction or unary minus |

    | * | Multiplication |

    | / | Division |

    | % | Modulo division |


    2. Relational Operators

    Relational operators are used to compare two numbers and taking decisions based
    on their relation.

    Relational expressions are used in decision statements such as if, for, while,
    etc...


    | | |

    | < | less than |

    | <= | less than equal to |

    | > | greater than |

    | >= | greater than or equal to |


