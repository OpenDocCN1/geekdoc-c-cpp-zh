  md: "# Darshan Institute of Engineering & Technology\n140705 – OOP C++\nComputer\
    \ Engineering\nUnit - 8 Templates, Exceptions and STL\n\n# 1) Explain Function\
    \ and Class Templates with appropriate example.\n\n+   * C++ templates are a powerful\
    \ mechanism for code reuse, as they enable the programmer to write code\nthat\
    \ behaves the same for any data type.\n* By template we can define generic classes\
    \ and functions.\n* It can be considered as a kind of macro. When an object of\
    \ a specific type is defined for actual use, the\ntemplate definition for that\
    \ class is substituted with the required data type.\n\n# Function Template:\n\n\
    +   * Suppose you write a function printData:\n\n```\nvoid printData(int value)\n\
    {\n    cout<<The value is \"<<value\";\n}\n```\n\n+   * Now you want to print\
    \ two double values or strings, then you have to overload the function:\n\n```\n\
    void printData(float value)\n{\n    cout<<The value is \"<<value\";\nvoid printData(char\
    \ *value)\n{\n    cout<<The value is \"<<value\";\n}\n```\n\n+   * To perform\
    \ some operation with different data type, we have to write same code multiple\
    \ time.\n* C++ provides templates to reduce this type of duplication code.\n\n\
    ```\ntemplate<typename T>\nvoid printData(T value)\n{\n    cout<<The value is\
    \ \"<<value\";\n}\n```\n\n+   * We can now use printData for any data type. Here\
    \ T is a template parameter that identifies a type. anywhere in the function where\
    \ T appears, it is replaced with whatever type the function is instantiated.\n\
    * For example:\n\n```\nint i=3;\nfloat d=4.7;\nchar s=\"hello\";nprintData(i);\
    \ // T is int\nprintData(d); // T is float\nprintData(s); // T is string\n```\n\
    \n# Function Templates with Multiple Parameters:\n\n+   * We can use more one\
    \ generic data type in the template statement, comma separated list as shown below.\n\
    * For example:\n\n```\ntemplate <class T1, class T2>\nvoid printData(T1 a, T2\
    \ b)\n{}\n```\n\nHardik Doshi, Ishan Rajani 59"
