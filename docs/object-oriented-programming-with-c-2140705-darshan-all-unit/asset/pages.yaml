    \ programming two most common types of error are logical error and syntax error.\n\
    * The syntax error is detected during compilation of program, but the logical\
    \ error will detect during execution of program.\n* The exception handling provides\
    \ mechanism to handle logical error during execution of program.\n* Steps to handle\
    \ logical error.\n\n+   1. Find the problem (Hit the exception)\n2. Inform that\
    \ an error has occurred (Throw the exception)\n3. Receive the error information\
    \ (Catch the exception)\n4. Take corrective actions (Handle the exception)\n\n\
    # Exception Handling Mechanism:\n\n+   * This mechanism is built upon three keyword:\
    \ try, throw and catch.\n* try is used to preface a block of statement that may\
    \ generate exceptions.\n* When an exception is detected, it is thrown using a\
    \ throw statement.\n* A catch block is used to catches the exceptions thrown by\
    \ throw statement and take appropriate action.\n* The relationship between try,\
    \ throw and catch is shown in below figure.\n\n| try block |\n| :--- |\n| Detects\
    \ and throws an exception |\n| catch block |\n| Catches and handles the exception\
