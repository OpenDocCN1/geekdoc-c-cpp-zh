  md: "# 3 – C++ Functions\n\nExplain Call by Value and Call by Reference with appropriate\
    \ example. Write a program to interchange value of two variables.\n\n# Call By\
    \ Value\n\n+   - In call by value, value of variable is passed during function\
    \ call.\n- And this copy will be stored in another variable at function definition.\n\
    - In call by value the original value in calling function will never change after\
    \ execution of function.\n\nExample:\n\n```\n#include<iostream>\nusing namespace\
    \ std;\n\nvoid swp(int a, int b) {\n    int temp=a;\n    a=b;\n    b=temp;\n}\n\
    int main() {\n    int x,y;\n    cout<<\"Enter value of a and b:\"\";\n    cin>>x>>y;\n\
    \    swp(x,y);\n    cout<<\"after swapping a = \"<<\"a\"<<\"and b = \"<<\"b\"\"\
    \\n    return 0;\n}\n```\n\nOutput:\nEnter value of a and b:\n45\nAfter swapping\
    \ a = 5 and b = 4\n\n# Call By Reference\n\n+   - In call by reference, reference\
    \ is passed during function call.\n- The formal arguments in the called function\
    \ become aliases to the actual function call.\n- In call by reference the original\
    \ value in calling function will change after execution of function.\n\nExample:\n\
    \n```\n#include<iostream>\nusing namespace std;\n\nvoid swp(int &a, int &b) //\
    \ It is the only difference from above program\n{\n    int temp=a;\n    a=b;\n\
    \    b=temp;\n}\nint main() {\n    int a,b;\n    cout<<\"Enter two numbers:\"\"\
    ;\n    cin>>a>>b;\n    swap(a,b);\n    cout<<\"a=\"<<\"\"a\"<<\"and b=\"<<\"\"\
    b\"\"\\n    return 0;\n}\n```\n\nOutput:\nEnter value of a and b:\n45"
