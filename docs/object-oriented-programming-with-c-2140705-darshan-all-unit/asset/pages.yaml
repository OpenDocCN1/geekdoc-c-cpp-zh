  md: "# Hybrid Inheritance\n\n+   - It is a combination of any inheritance types.\
    \ That is either multiple or multilevel or hierarchical or any other combination.\n\
    \n+   - Here, class B and class C are derived from class A and class D is derived\
    \ from class B and class C.\n\n+   - class A, class B and class C is example of\
    \ Hierarchical Inheritance and class B, class C and class D is example of Multiple\
    \ Inheritance so this hybrid inheritance is combination of Hierarchical and Multiple\
    \ Inheritance.\n\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_36_0.png)\n\nExample:\n\
    \n```\n#include<iostream>\nusing namespace std;\nclass A\n{\npublic:\n    void\
    \ dispA()\n    {\n        cout<<\"Class method\"<<endl;\n    }\n};\nclass B :\
    \ public A // Single Inheritance - class B is derived from class A\n{\npublic:\n\
    \    void dispB()\n    {\n        cout<<\"class B method\"<<endl;\n    }\n};\n\
    class C : public B // Multilevel Inheritance - class C is derived from class B\n\
