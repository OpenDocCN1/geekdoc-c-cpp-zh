  md: "# 3 – C++ Functions\n\n**After swapping a = 5 and b = 4**\n\n# **What is inline\
    \ function? Explain with example.**\n\n+   - The functions can be made inline\
    \ by adding prefix inline to the function definition.\n- An inline function is\
    \ a function that is expanded in line when it is invoked.\n- The compiler replaces\
    \ the function call with the corresponding function code.\n- Inline function saves\
    \ time of calling function, saving registers, pushing arguments onto the stack\
    \ and returning from function.\n- Preprocessor macros are popular in C, which\
    \ has similar kind of advantages mentioned above.\n- The major drawback of macros\
    \ is that they are not real functions.\n- Therefore, the usual error checking\
    \ does not occur during execution of macros.\n- We should be careful when using\
    \ inline function. If function has few lines of code and simple expressions then\
    \ it should be used.\n\n+   **Critical situations for inline function:**\n- 1)\
    \ If loop, a switch or a goto exists in function body.\n- 2) If function is not\
    \ returning any value.\n- 3) If function contains static variables.\n- 4) If function\
    \ is recursive.\n\n```\nExample:\n```cpp\ninline int cube(int n) {\n    return\
    \ n*n;\n}\nint main() {\n    int c;\n    c = cube(10);\n    cout<<c;\n}\n```\n\
    ```\n\nFunction call is replaced with expression so c = cube(10); becomes c=10*10*10;\
    \ at compile time.\n\n# **Explain Function with Default Arguments with appropriate\
    \ example.**\n\n+   - C++ allows us to call a function without specifying all\
