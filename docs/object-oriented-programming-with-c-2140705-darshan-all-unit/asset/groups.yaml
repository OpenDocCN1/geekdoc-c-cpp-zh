    - Overloading of functions with different return type is not allowed.


    # Operator Overloading:


    +   - Operator overloading is the ability to tell the compiler how to perform
    a certain operation based on its corresponding operator''s data type.

    - Like + performs addition of two integer numbers, concatenation of two string
    variables and works totally when used with objects of time class.


    # Dynamic Binding (Late Binding):


    +   - Dynamic binding is the linking of a route or object at runtime based on
    the conditions at that moment.

    - It means the code associated with a given procedure is not known until the time
    of the call.

    - At-run, the code matching the object under current reference will be called.


    # Virtual Function:


    +   - Virtual function is a member function of class, whose functionality can
    be over-ridden in its derived classes.

    - The whole function body can be replaced with a new set of implementation in
    the derived class.

    - It is declared as virtual in the base class using the virtual keyword.'
