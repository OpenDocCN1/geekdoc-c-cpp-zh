    \ 值传递 (Call By Value)\n\n- 在值传递中，变量的值在函数调用期间被传递。\n- 这种拷贝将在函数定义时存储在另一个变量中。\n- 在值传递中，调用函数中的原始值在函数执行后永远不会改变。\n\
