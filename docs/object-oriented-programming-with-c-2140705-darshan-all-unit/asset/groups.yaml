    # 1 – Concepts of OOP


    1) What is Object Oriented Programming? Differentiate procedure oriented and object
    oriented programming language. OR

    List out characteristics of POP and OOP.


    Object Oriented Programming paradigm represents concepts as objects that has fields
    and associated procedures known as methods.


    | Procedure Oriented Programming (POP) | Object Oriented Programming (OOP) |

    |---|---|n| 1. Emphasis is on doing things not on data, means it is function |
    1. Emphasis is on data rather than procedure, means object driven |

    | 2. Main focus is on the function and procedures that operate on data | 2. Main
    focus is on the data that is being operated |

    | 3. Top Down approach in program design | 3. Up approach in program design |

    | 4. Large programs are divided into smaller programs known as functions | 4.
    Large programs are divided into classes and objects |

    | 5. Most of the functions share global data | 5. Data is tied together with function
    in the data structure |

    | 6. Data moves openly in the system from one function to another | 6. Data is
    hidden and cannot be accessed by external functions |

    | 7. Adding of data and function is difficult | 7. Adding of data and function
    is easy |

    | 8. We cannot declare namespace directly | 8. We can use name space directly,
    Ex: using namespace std; |

    | 9. Concepts like inheritance, polymorphism, data encapsulation, abstraction,
    access specifiers are not available. | 9. Concepts like inheritance, polymorphism,
    data encapsulation, abstraction, access specifiers are available and can be easily
    used |

    | 10. Examples: C, Fortran, Pascal, etc... | 10. Examples: C++, Java, C#, etc...
    |


    2) Explain Basic Concepts of OOP. OR

    Explain Following terms.


    Various concepts present in OOP to make it more powerful, secure, reliable and
    easy.


    Object


    +   * An object is an instance of a class.

    * An object means anything from real world like person, computer, bench etc...

    * Every object has at least one unique identity.

    * An object is a component of a program that knows how to interact with other
    pieces of the program.

    * An object is the variable of the type class.

    * For example, If water is class then river is object.


    Class


    +   * A class is a template that specifies the attributes and behavior of things
    or objects.

    * A class is a blueprint or prototype from which objects are created.

    * A class is the implementation of an abstract data type (ADT).

    * It defines attributes and methods.'
