    # 11. Scope resolution operator (::)


    Scope resolution (::) is used to define the already declared member functions
    of the class.


    # 5) Explain Memory Management Operators of C++ with example.


    +   - For dynamic memory management, C+ provides two unary operator ''new'' and
    ''delete''.

    - An object can be created using new, and destroy using delete, and when needed.

    - Dynamic allocation of memory using new

    - Syntax of new :


    ```

    pointer_variable = new data_type;

    ```


    +   - Here pointer_variable is a pointer of any data type.

    - The new operator allocates sufficient memory to hold a data object.


    Hardik A. Doshi, CE Department | 2140705 – OBJECT ORIENTED PROGRAMMING WITH C++
