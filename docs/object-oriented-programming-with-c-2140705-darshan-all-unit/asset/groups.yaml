    }\nint main() {\n    int a,b;\n    cout << \"Enter two numbers:\";\n    cin>>a>>b;\n\
    \    swp(a,b);\n    cout << \"a=\" << a << \" and b=\" << b << \"\\n\";\n    return\
    \ 0;\n}\n```\n\n输出：\nEnter two numbers:\n45\nAfter swapping a = 5 and b = 4\n\n\
    ### 什么是内联函数？请结合示例解释。\n\n- 通过在函数定义中添加 `inline`，可以将函数设为内联。\n- 内联函数是在调用时进行内联展开的函数。\n\
    - 编译器将函数调用替换为相应的函数代码。\n- 内联函数节省了调用函数的时间、寄存器、将参数推入栈以及从函数返回开销。\n- 预处理器宏很流行，但主要的缺点是它们不是真正的函数。\n\
    - 因此，在执行宏时不会发生通常的错误检查。\n- 使用内联函数时应小心。如果函数代码行数很少且表达式简单，则应该使用它。\n\n**内联函数的关键情况：**\n\
    - 1) 如果函数体中存在循环、switch 或 goto。\n- 2) 如果函数不返回任何值。\n- 3) 如果函数包含静态变量。\n- 4) 如果函数是递归的。\n\
    \n示例：\n```cpp\ninline int cube(int n) {\n    return n;\n}\nint main() {\n    int\
    \ c;\n    c = cube(10);\n    cout<<c;\n}\n```\n函数调用被替换为表达式，因此 `c = cube(10);`\
    \ 在编译时变为 `c=10;`。\n\n### 结合适当示例解释带默认参数的函数。\n\n- C++ 允许我们在不指定所有参数的情况下调用函数。\n- 在这种情况下，函数为参数分配一个默认值。\n\
    - 默认值在函数声明时指定。\n- 我们必须从右到左添加默认参数。\n- 我们不能在参数列表中间为特定参数提供默认值。\n- 默认参数用于参数始终相同的情况。\n\
    - 例如传递。\n\n**合法的与非法的默认参数**\n\n```cpp\nvoid f(int a, int b, int c=0); // 合法的\n\
    void f(int a, int b=0, int c=0); // 合法的\nvoid f(int a=0, int b, int c=0); // 非法的\n\
    void f(int a=0, int b, int c); // 非法的\nvoid f(int a=0, int b=0, int c=0); // 合法的\n\
    ```\n\n示例：\n```cpp\n#include <iostream>\nusing namespace std;\nvoid f(int a=0,\
    \ int b=0) {\n    cout<<a << \", b=\" << b<<endl;\n}\nint main() {\n  f();\n \
    \ f(10);\n  f(10, 99);\n  return 0;\n}\n```\n输出：\n0, b=0\n10, b=0\n\n### 什么是友元函数？结合示例解释。\n\
    \n- 友元函数是通过 `friend` 关键字声明的函数。\n- 它不是类的成员，但它可以访问类的私有和受保护的成员。\n- 它不在声明为友元的类的作用域内。\n\
    - 它不能直接访问成员名。\n- 它可以声明在类的公共或私有部分。\n- 它不是类的成员，因此不能通过对象调用。\n- 通常，它将对象作为参数。\n- 它具有特殊访问权限的普通外部函数。\n\
    \n语法：\n```cpp\nclass ABC\n{\n  public:\n    friend void xyz(void); // 声明\n};\n\
    ```\n\n示例：\n```cpp\n#include<iostream>\nusing namespace std;\nclass numbers\n\
    {\n  public:\n    int num1, num2;\n    void setdata(int a, int b);\n    friend\
    \ int add(numbers N);\n};\nvoid numbers ::setdata(int a, int b) {\n  num1=a;\n\
    \  num2=b;\n}\nint add(numbers N) {\n  return (N.num1+N.num2);\n}\nint main()\
    \ {\n  numbers N1;\n  N1.setdata(10,20);\n  cout<<\"Sum = \"<<add(N1);\n}\n```\n\
    输出：Sum = 30\n\n- add 是 `numbers` 类的友元函数，因此它可以访问类的所有成员（私有、公共和受保护）。\n\n- 一个类的成员函数可以被变为另一个类的友元函数，例如...\n\
    ```cpp\nclass X\n{\n    int f();\n};\n\nclass Y\n{\n    friend int X::f();\n};\n\
    ```\n\n- 函数 f 是 X 类的成员，也是 Y 类的友元以及类的友。\n\n- 我们可以将一个类的所有的成员函数声明为另一个类的友元函数。在这种情况下，该类被称为友元类，例如类\
    \ X 是类 Z 的友元类\n```cpp\nclass Z\n{\n    friend class X;\n};\n```\n\n"
