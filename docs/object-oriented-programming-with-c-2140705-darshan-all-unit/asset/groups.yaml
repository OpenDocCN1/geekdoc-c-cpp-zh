    # 2 – C++ Basics


    +   - The pointer_variable holds the address of the memory space allocated.

    - For example:


    ```

    p=new int;

    q=new float;

    ```


    +   - Type of ''p'' is integer and type of ''q'' is float.


    +   - We can combine declaration and initialization.


    ```

    int *p=new int;

    float *q=new float;

    ```


    +   - We can dynamic allocate space for array, structure and classes by new.


    ```

    int *p=new int[10];

    ```


    +   - Allocates a memory space for an array of size 10.

    - p[0] will refer location of p[1] and p[1] will refer location of [2] and so
    on.


    +   - Release memory usage

    - When a data object is no longer needed, it is destroyed to release the memory
    space for reuse.

    - Syntax of delete_variable: delete pointer_variable;

    - The pointer_variable is the pointer that points to a data object created with
    new.

    - For example:


    ```

    delete p;

    delete q;

    ```


    +   - To free a dynamically allocated array

    delete [size] pointer_variable;

    delete [10]p;


    +   6 What is reference variable? What is its major use?

    - A reference provides an alias (alternative name) for a previously defined variable.

    - This mechanism is useful in object oriented programming because it permits the
    manipulation of objects by reference, and limits the copying of object parameters
    back and forth.

    - It is important to note that references can be created not only for built-in
    data types but also for user-defined types.

    - Syntax: Data_type & reference_name = variable

    - For example:


    ```

    int &a=100;

    int &b=a;

    ```


    +   7 Explain use of scope resolution operator (::) by giving example.

    - The scope resolution operator is used to resolve or extend the scope of variable.

    - C++ is block structured language. We know that the same variable name can be
    used to have different meaning in block.

    - The scope resolution operator will refer value of global variable from anywhere
    (also from inner block).'
