    * 静态成员在类内部声明，在类外部定义。\n* 在创建第一个类对象时被初始化为零。没有其他初始化。\n* 它在类内部可见，但其生命周期是整个程序。\n* 静态成员通常用于维护整个类的值。\n\
    \n静态成员函数：\n\n* 静态成员函数与类相关，而不是与任何对象相关。\n* 可以可以使用类名调用，而不是对象。\n* 它们可以访问类的静态成员。\n\
    * 它们不能是虚函数。\n* 它们不能声明为常量或 volatile。\n* 即使在类没有实例化时，也可以调用静态成员函数。\n* 同一个函数不存在静态和非静态版本。\n\
    \n示例：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nclass item\n{\n \
    \   int number;\n    static int count; // 静态变量声明\npublic:\n    void getdata(int\
    \ a)\n    {\n        number = a;\n        count++;\n    }\n};\nint item::count\
    \ = 0; // 静态成员定义\n\nint main()\n{\n    item obj1, obj2;\n    obj1.getdata(10);\n\
    \    obj2.getdata(20);\n    cout << \"Count: \" << item::count << endl;\n    return\
    \ 0;\n}\n```\n\n3) 解释公共和私有访问修符。\n\n公共：\n\n* 公共成员可以在任何地方访问。\n* 访问公共成员没有限制。\n* 类成员变为公共。\n\
    \n私有：\n\n* 类的私有成员可以在类内部访问。\n* 它们不能在类外部访问。\n* 如果没有指定任何访问修符，则类作为私有成员处理。\n* 如果尝试在类外部访问私有成员，会导致编译错误。\n\
    \n示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass ABC\n{\n \
    \   public:\n    int a;\n    private:\n    int b;\n};\n\nint main()\n{\n    ABC\
    \ x;\n    x.a=5;\n    cout<<\"Value of public variable = \"<<x.a;\n}\n```\n\n"
