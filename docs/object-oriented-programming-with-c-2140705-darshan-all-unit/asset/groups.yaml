    \n# 5) Explain Rethrowing an Exception with appropriate example.\n\n- A handler\
    \ may decide to rethrow the exception without processing it.\n- In such situations,\
    \ we simply invoke throw without any arguments as shown below:\n  throw;\n- This\
    \ causes the current exception to be thrown to the next enclosing try/catch sequence\
    \ and is caught by a statement listed after that enclosing block.\n\nExample:\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nvoid divide(double x, double\
    \ y)\n{\n    cout<<\"Inside function \\n\";\n    try {\n        if (y==0)\n  \
    \          throw y;\n        else\n            cout<<\"Division = <<x/y<<\\n\"\
    ;\n    } catch (double) {\n        cout<<\"caught double inside the function \\\
    n\";\n    }\n    cout<<\"End of function \\n\\n\";\n}\n\nint main() {\n    cout<<\"\
    Inside main\\n\";\n    try {\n        divide(10.5,2.5);\n        divide(4,0);\n\
    \    } catch (double) {\n        cout<<\"caught double inside main \\n\";\n  \
    \  }\n    cout<<\"End of main\\n\";\n    return 0;\n}\n```\n\n# 6) Explain short\
    \ introduction of STL.\n\n- Alexander Stepanov and Meng Lee of Hewlett-Packard\
    \ developed a set of general-purpose templated classes and function for storing\
    \ and processing of data.\n- The collection of these generic classes is Standard\
    \ Template Library(STL).\n- The STL has now become a part of the ANSI C++ library.\n\
    - Using STL, we can save considerable time and effort, and lead to high quality\
    \ programs.\n- All these benefits are possible because we are basically \"reusing\"\
    \ the well-written and well-tested components in the STL.\n- STL components which\
    \ are now part of the standard C++ library are defined in the namespace std.\n\
    - We must therefore use namespace std; to intend to use the standard C++ library.\n\
    \n# 7) List out components of STL and explain in short.\n\n- There are three core\
