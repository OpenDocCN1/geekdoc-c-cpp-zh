    第 8 单元 模板、异常与 STL\n\n## 1) 用适当示例解释函数模板和类模板。\n\n- C++ 模板是代码复用的一种强大机制，因为它们允许程序员编写对任何数据类型都行为相同的代码。\n\
    - 通过模板，我们可以定义泛型类和函数。\n- 它可以被视为一种宏。当为实际使用定义了特定类型的对象时，该类的模板定义将被替换为所需的数据类型。\n\n###\
    \ 函数模板：\n\n- 假设你写了一个函数 `printData`：\n\n```cpp\nvoid printData(int value)\n{\n\
    \    cout<<\"The value is \"<<value<<\";\n}\n``````\n\n- 现在你想要打印两个 `double` 值或字符串，那么你必须重载该函数：\n\
    \n```cpp\nvoid printData(float value)\n{\n    cout<<\"The value is \"<<value<<\"\
    ;\n}\n\nvoid printData(char *value)\n{\n    cout<<\"The value is \"<<value<<\"\
    ;\n}\n``````\n\n- 为了对不同的数据类型执行某些操作，我们必须多次编写相同的代码。\n- C++ 提供了模板来减少这种重复代码。\n\n```cpp\n\
    template<typename T>\nvoid printData(T value)\n{\n    cout<<\"The value is \"\
    <<value<<\";\n}\n``````\n\n- 我们现在可以对任何数据类型使用 `printData`。这里 `T` 是一个标识类型的模板参数。在函数任何出现\
    \ `T` 的地方，它都会被替换为函数实例化时的类型。\n- 例如：\n\n```cpp\nint i=3;\nfloat d=4.7;\nchar s=\"\
    hello\";\nprintData(i); // T 是 int\nprintData(d); // T 是 float\nprintData(s);\
    \ // T 是 string\n``````\n\n### 多参数函数模板：\n\n- 我们可以对任何数据类型使用 `printData`。这里 `T`\
    \ 是一个标识类型的模板参数。在函数任何出现 `T` 的地方，它都会被替换为函数实例化时的类型。\n- 例如：\n\n```cpp\nint i=3;\n\
