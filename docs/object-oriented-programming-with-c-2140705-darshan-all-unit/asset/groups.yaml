    140705 – OOP C++\nComputer Engineering\nUnit - 8 Templates, Exceptions and STL\n\
    \n## 1) Explain Function and Class Templates with appropriate example.\n\n- C++\
    \ templates are a powerful mechanism for code reuse, as they enable the programmer\
    \ to write code that behaves the same for any data type.\n- By template we can\
    \ define generic classes and functions.\n- It can be considered as a kind of macro.\
    \ When an object of a specific type is defined for actual use, the template definition\
    \ for that class is substituted with the required data type.\n\n### Function Template:\n\
    \n- Suppose you write a function printData:\n\n```cpp\nvoid printData(int value)\n\
    {\n    cout<<\"The value is \"<<value<<\";\n}\n```\n\n- Now you want to print\
    \ two double values or strings, then you have to overload the function:\n\n```cpp\n\
    void printData(float value)\n{\n    cout<<\"The value is \"<<value<<\";\n}\nvoid\
    \ printData(char *value)\n{\n    cout<<\"The value is \"<<value<<\";\n}\n```\n\
    \n- To perform some operation with different data type, we have to write same\
    \ code multiple time.\n- C++ provides templates to reduce this type of duplication\
    \ code.\n\n```cpp\ntemplate<typename T>\nvoid printData(T value)\n{\n    cout<<\"\
    The value is \"<<value<<\";\n}\n```\n\n- We can now use printData for any data\
    \ type. Here T is a template parameter that identifies a type. anywhere in the\
    \ function where T appears, it is replaced with whatever type the function is\
    \ instantiated.\n- For example:\n\n```cpp\nint i=3;\nfloat d=4.7;\nchar s=\"hello\"\
    ;\nprintData(i); // T is int\nprintData(d); // T is float\nprintData(s); // T\
    \ is string\n```\n\n### Function Templates with Multiple Parameters:\n\n- We can\
    \ use more one generic data type in the template statement, comma separated list\
    \ as shown below.\n- For example:\n\n```cpp\ntemplate <class T1, class T2>\nvoid\
    \ printData(T1 a, T2 b)\n{\n    cout<<\"a=\"<<a<<\"b=\"<<b;\n}\n\nint main()\n\
    {\n    printData(12, 5);\n    printData(12.5, 34);\n    return 0;\n}\n```\n\n\
    ## 2) Explain class template. Also write C++ program for class template with multiple\
    \ parameters.\n\n### Class Template:\n\n- Suppose you want to perform addition\
    \ of two integer in class\n```cpp\nclass add {\n    int a,b,c;\n    public:\n\
    \    add() {\n        a = 10;\n        b = 20;\n        c = a + b;\n    }\n  \
    \  void putdata() {\n        cout<<\"sum=\"<<c;\n    }\n};\n```\n\n- If you later\
    \ decide also to perform addition of float numbers in class then you will have\
    \ to separate class for addition of two numbers.\n```cpp\nclass add {\n    float\
    \ a,b,c;\n    public:\n    add() {\n        a = 10.5;\n        b = 20.5;\n   \
    \     c = a + b;\n    }\n    void putdata() {\n        cout<<\"sum=\"<<c;\n  \
    \  }\n};\n```\n\n- It means have to write same class two time because different\
    \ type.\n- We can solve this problem by using template:\n\n```cpp\ntemplate<class\
    \ T>\nclass Sample {\n    T a,b,c;\n    public:\n    void getdata() {\n      \
    \  cout<<\"Enter the value of a and b\";\n        cin>>a>>b;\n    }\n    void\
    \ sum() {\n        c=a+b;\n    }\n    void putdata() {\n        cout<<\"sum=\"\
    <<c;\n    }\n};\n\nint main() {\n    Sample<int> S1;\n    S1.getdata();\n    S1.sum();\n\
    \    S1.putdata();\n    Sample<float> S2;\n    S2.getdata();\n    S2.sum();\n\
    \    S2.putdata();\n    return 0;\n}\n```\n\n### Class Templates with Multiple\
    \ Parameters:\n\n- We can use more than one generic data type in a class. They\
    \ are declared as comma separated list within the template specification.\n\n\
    ```cpp\ntemplate <class T1, class T2>\nclass Sample {\n  /* Statement 1; Statement\
    \ 2; */\n}\n```\n\n### Example:\n\n```cpp\ntemplate <class T1, class T2>\nclass\
    \ Sample {\n  T1 a;\n  T2 b;\n  public:\n  Sample(T1 x,T2 y)\n  {\n    a=x;\n\
    \    b=y;\n  }\n  void disp()\n  {\n    cout<<\"a=\"<<a<<\"b=\"<<b;\n  }\n};\n\
    \nint main()\n{\n    Sample<int,float> S1(12,23.3);\n    Sample<char,int> S2('c',12);\n\
    \    S1.disp();\n    S2.disp();\n    return 0;\n}\n```\n\n## 3) What is exception\
    \ handling? Explain how to handle an exception with appropriate example. Explain\
    \ how to handle exceptions using throw, catch mechanism.\n\n- In programming two\
    \ common types of error are logical error and syntax error.\n- The syntax error\
    \ is detected during compilation of program, but the logical error will detect\
    \ during execution of program.\n- The exception handling provides mechanism to\
    \ handle logical error during execution of program.\n- Steps to handle logical\
    \ error:\n    1. Find the problem (Hit the exception)\n    2. Inform that an error\
    \ has occurred (Throw the exception)\n    3. Receive the error information (Catch\
    \ the exception)\n    4. Take corrective actions (Handle the exception)\n\n###\
    \ Exception Handling Mechanism:\n\n- This mechanism is built upon three keyword:\
    \ try, throw and catch.\n- try is used to preface a block of statement that may\
    \ generate exceptions.\n- When an exception is detected, it is thrown using a\
    \ throw statement.\n- A catch block is used to catch the exceptions thrown by\
    \ throw statement and take appropriate action.\n- The relationship between try,\
    \ throw and catch is shown in below figure.\n\n| try block | |\n| :--- | :---\
    \ |\n| try block | Detects and throws an exception |\n| catch block | Catches\
    \ and handles the exception |\n\n### Syntax:\n\n```cpp\ntry {\n  // Set of Statements;\n\
    \  throw exception;\n  // Set of Statements;\n} catch (type arg) {\n  // Set of\
    \ Statements;\n}\n```\n\n### Example:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n  int a,b;\n  cout<<\"Enter the value of a and b\\n\"\
    ;\n  try {\n    if(b != 0)\n      cout<<\"The result (a/b)=\"<<a/b;\n    else\n\
    \      throw(b);\n  } catch (int x) {\n    cout<<\"Exception caught b=\"<<x;\n\
    \  }\n  return 0;\n}\n```\n\n- When the value of b is zero at that time exception\
    \ will throw and this exception will catch in catch block and print the message\
    \ value is zero.\n\n## 4) Explain multiple catch statements with appropriate example.\n\
    \n- It is possible that a program segment has more than one condition to throw\
    \ an exception.\n- For these situations we can associate more than one catch statement\
    \ with a try block.\n- When an exception is thrown, the exception handlers are\
    \ searched in order for an appropriate match.\n- The first handler that handles\
    \ a match is executed.\n- After executing the handler, the control goes to the\
    \ first statement after the last catch block for that try.\n- Note: It is possible\
    \ that arguments of seven catch statements match the type of an exception.\n-\
    \ In such cases, the first handler that matches the exception type is executed.\n"
