    \ with one another to provide support to a variety of programming solution.\n\
    - The relationship between the three components is shown in following figure,\n\
    \n![](img/f20ebad23d7bd6ce200c44e70b08aa15_66_0.png)\n\n# Container:\n\n- A container\
    \ is an object that actually stores data.\n- It is a data way is organized in\
    \ memory.\n- The STL containers are implemented by template classes and therefore\
    \ can be easily customized to hold different types of data.\n\n# Algorithm:\n\n\
    - An algorithm is a procedure that is used to process the data contained in the\
    \ containers.\n- The STL includes many different kinds of algorithms to provide\
    \ support to tasks such as initializing, searching, copying, sorting, and merging.\n\
    - Algorithms are implemented by template functions.\n\n# Iterator:\n\n- The iterators\
    \ is an object(like a pointer) that points to an element in a container.\n- We\
