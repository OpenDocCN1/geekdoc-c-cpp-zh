    \ {\n        divide(10.5,2.5);\n        divide(4,0);\n    } catch (double) {\n\
    \        cout<<\"caught double inside main \\n\";\n    }\n    cout<<\"End of main\\\
    n\";\n    return 0;\n}\n```\n\n# 6) 请简要介绍 STL。\n\n- 惠尔-帕罗公司（Hewlett-Packard）的\
    \ Alexander Stepanov 和 Meng Lee 开发了一组通用的泛型类和函数，用于数据的存储和处理。\n- 这些泛型类的集合就成了标准模板库（STL）。\n\
    - STL 现在已成为 ANSI C++ 库的一部分。\n- 使用 STL，我们可以节省大量的时间和精力，并编写出高质量的程序。\n- 所有这些处处得以实现，是因为我们基本上是在“重用”\
    \ STL 中编写良好且经过充分测试的组件。\n- 现在作为标准 C++ 库一部分的 STL 组件定义在 `std` 命名空间中。\n- 因此，如果我们打算使用标准\
    \ C++ 库，必须使用 `namespace std;`。\n\n# 7) 列出 STL 的组件并进行简要解释。\n\n- STL 有三个核心组件，如下：\n\
    \  1. 容器 (Containers)\n  2. 算法 (Algorithms)\n  3. 迭代器 (Iterators)\n\n# Darshan\
    \ 工程与技术学院 140705 - 面向对象 C++\n计算机工程 单元 - 8 模板、异常与 STL\n\n- 这三个组件协同工作，为各种编程解决方案提供支持。\n\
    - 这三个组件之间的关系如如下所示，\n\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_66_0.png)\n\n#\
    \ 容器 (Container):\n\n- 容器是实际存储数据的对象。\n- 它是数据在内存中的组织方式。\n- STL 容器由模板类实现，因此可以很容易地自定义以存储不同类型的数据。\n\
    \n# 算法 (Algorithm):\n\n- 算法是用于处理容器包含的数据的过程。\n- STL 包含了许多不同类型的算法，以支持初始化、搜索、复制、排序和合并等任务。\n\
    - 算法通过模板函数实现。\n\n# 迭代器 (Iterator):\n\n- 迭代器是一个指向容器中元素的对象（类似于指针）。\n- 我们可以使用迭代器遍历容器的内容。\n\
    - 迭代器的处理方式就像指针一样。\n- 我们可以对其进行递增或递减。\n- 迭代器连接了算法与容器，并在操作容器中存储的数据时起着关键作用。\n\n"
