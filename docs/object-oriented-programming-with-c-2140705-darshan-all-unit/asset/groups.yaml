    \ * In any program first write header files as iostream.h, conio.h, etc..as requirement\
    \ of program.\n* After header file write class declaration or definition as per\
    \ your planning.\n* After class, define member functions which are not define\
    \ but declare inside the class.\n* In last main function without main program\
    \ execution is not possible.\nExample:\n\n```\n#include <iostream> //Header File\n\
    using namespace std;\n\nclass trial //Class\n{\n    int a;\npublic:\n    void\
    \ getdata()\n    {\n        a=10;\n    }\n    void putdata();\n};\nvoid trial::putdata()\
    \ //Member Function outside class definition\n{\n    cout<<\"The value of a =\
    \ \"<<a;\n}\nint main() //Main Function{\n    trial T;\n    T.getdata();\n   \
    \ T.putdata();\n}\n```\n\nOutput:\nThe value of a = 10\n\n2) Explain following\
    \ terms.\n\nNamespace:\n\n+   * It defines a scope for the identifiers that are\
    \ used in a program.\n* For using identifiers in namespace directive is used as\
    \ follows: using namespace std;\n* std is the namespace where ANSI C++ standard\
    \ class libraries are defined.\n* All ANSI C++ programs must include this directive.\n\
    * This will bring all the identifiers in std to the current global scope."
- md: "\n# Darshan\nInstitute of Engineering & Technology\n\n# 2 – C++ Basics\n\n\
    **Keywords:**\n\n- They are explicitly reserved identifiers and cannot be used\
    \ as names for the program variables or other user-defined program elements.\n\
    - Ex: int, class, void etc.\n\n**Identifiers:**\n\n- They refer to the names of\
    \ variables, functions, arrays, classes etc., created by the programmer.\n- Each\
    \ language has its own rules for naming these identifiers.\n- Following are common\
    \ rules for both C and C++:\n  - Only alphanumeric characters, digits and underscores\
    \ are permitted.\n  - The name cannot start with a digit.\n  - Uppercase and lowercase\
    \ letters are distinct.\n  - A declared keyword cannot be used as a variable name.\n\
    \n**Constants:**\n\n- Like variables, constants are data storage locations. But\
    \ variables can vary, constants do not change.\n- You must initialize a constant\
    \ when you create it, and you cannot assign new value later, after initialization.\n\
    \n**Defining constant using #define:**\n\n- #define is a preprocessor directive\
    \ that declares symbolic constant.\n- Example syntax:\n  ```cpp\n#define PI 3.14\n\
    \  ```\n- Every time the preprocessor sees the word PI, it puts 3.14 in the text.\n\
    \n**Example:**\n\n```cpp\n#include<iostream>\nusing namespace std;\n#define PI\
    \ 3.14\n\nint main() {\n  int r\n}\n```\n\nOutput:\nEnter Radius : 5\nArea of\
    \ Circle = 78.5\n\n**Defining constant using const keyword:**\n\n- 'const' keyword\
    \ is used to declare constant variable of any type.\n- We cannot change its value\
    \ during execution of program.\n- Syntax: const DataType Variable_Name = 2;\n\
    - Now 'a' is an integer type constant.\n\n# 2 – C++ Basics\n\n3) Explain various\
    \ Data types used in C++.\n\n- C++ provides the following data types.\n- We can\
    \ divide data types into three parts:\n  1. Primary data type\n  2. Derived data\
    \ type\n  3. User defined data type\n\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_5_0.png)\n\
    \n### Primary/Inbuilt Data types:\n- The primary data type of C++ is as follows.\n\
    \n| Size (bytes) | Range |\n|---|---|---|\n| char | 1 | -128 to 127 |\n| unsigned\
    \ char | 1 | 0 to 255 |\n| short or int | 2 | -32,768 to 32,767 |\n| unsigned\
    \ int | 2 | 0 to 65535 |\n| long | 4 | -2147483648 to 2147483647 |\n| unsigned\
    \ long | 4 | 0 to 4294967295 |\n| float | 4 | 3.4e-38 to 3.4e+38 |\n| double |\
    \ 8 | 1.7e-308 to 1.7e+308 |\n| long double | 10 | 3.4e-4932 to 1.1e+4932 |\n\n\
    ### Derived Data types:\n- Following derived data types:\n  1. Arrays\n  2. Function\n\
    \  3. Pointers\n\n- We cannot use the derived data type without use of primary\
    \ data type.\n- **Array**: An array is a fixed-size sequenced collection of elements\
    \ of the same data type.\n- **Pointer**: Pointer is a special variable which contains\
    \ address of another variable.\n- **Function**: A Group of statements combined\
    \ in one for some special purpose.\n\n### User Defined types:\n- We have following\
    \ type of user data type in C++ language.\n- The user data type is defined by\
    \ programmer as his/her requirement.\n- **Structure**: Structure is a collection\
    \ of logically related items of different data types grouped together and by a\
    \ single name.\n- **Union**: Union is like a structure, except that element shares\
    \ the common memory.\n- **Class**: A class is a template that defines the fields\
    \ and methods of things or objects. A class is a prototype from which objects\
    \ are created.\n- **enum**: Enum is a user-defined type consisting of a set of\
    \ named constants enumerator.\n\n- In other words enum is also used to assign\
    \ numeric constants to strings.\n- Syntax of enumeration: `enum_tag {list of variables};`\n\
    - Example of enumeration: `enum day_of_week {mon=1,tue,wed,thu,fri,sat,sun};`\n\
    \nDescribe various operators used in C++.\nAn operator is a symbol that the compiler\
    \ to perform certain mathematical or logical operation.\n\n### 1. Arithmetic Operators\n\
    Arithmetic operators are used for mathematical calculation. C++ supports the following\
    \ arithmetic operators:\n\n| Operator | Description |\n|---|---|\n| + | Addition\
    \ or unary plus |\n| - | Subtraction or unary minus |\n| * | Multiplication |\n\
    | / | Division |\n| % | Modulo division |\n\n### 2. Relational Operators\nRelational\
    \ operators are used to compare two numbers and taking decisions based on their\
    \ relation. Relational expressions are used in decision statements such as if,\
    \ for, while, etc...\n\n| Operator | Description |\n|---|---|\n| < | less than\
    \ |\n| <= | less than equal to |\n| > | greater than |\n| >= | greater than or\
    \ equal to |\n\n### 3. Logical Operators\nLogical operators are used to test more\
    \ than one condition and make decisions.\n\n| Operator | Description |\n|---|---|\n\
    | && | logical AND (Both non zero true, either is zero false) |\n| || | logical\
    \ OR (Both zero false, either is non zero true) |\n| ! | logical NOT (non zero\
    \ false, zero then true) |\n\n### 4. Assignment Operators\nAssignment operators\
    \ are used to assign the result of an expression to a variable. C++ also has shorthand\
    \ operators which simplify operation with assignment.\n\n| Operator | Description\
    \ |\n|---|---|\n| = | Assigns value of right to left side |\n| += | a += 1 is\
    \ same as a = a + 1 |\n| -= | a -= 1 is same as a = a - 1 |\n| *= | a *= 1 is\
    \ same as a = a * 1 |\n| /= | a /= 1 is same as a = a / 1 |\n| %= | a %= 1 is\
    \ same as a = a % 1 |\n\n### 5. Increment and Decrement Operators\nThese are special\
    \ operators in C++ which are generally not found in other languages.\n\n| Operator\
    \ | Description |\n|---|---|\n| ++ | Increments value by 1. |\n| a++ is postfix,\
    \ the expression is evaluated first and then the value is incremented. Ex.a=10;\
    \ b++; after this statement, a=11, b=10. |\n| ++a is prefix, the value is incremented\
    \ first and then the expression is evaluated. Ex.a=10; b++; after this statement,\
    \ a=11, b=11. |\n| -- | Decrements value by 1. |\n| a-- is postfix, the expression\
    \ is evaluated first and then the value is decremented. Ex.a=10; b--; after this\
    \ statement, a=9, b=10. |\n| --a is prefix, the value is decremented first and\
    \ then the expression is evaluated. Ex.a=10; b--; after this statement, a=9, b=9.\
    \ |\n\n### 6. Conditional Operator\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_5_0.png)\n\
    \nThe ternary operator is known as Conditional Operator.\n- Syntax: `condition\
    \ ? expression_if_true : expression_if_false;`\n- It is used to replace simple-else\
    \ statements.\n\n### 7. Bitwise Operators\nBitwise operators are used to perform\
    \ bitwise operations on data.\n\n| Operator | Description |\n|---|---|\n| & |\
    \ Bitwise AND |\n| | | Bitwise OR |\n| ^ | Bitwise XOR |\n| ~ | Bitwise NOT |\n\
    | << | Left shift |\n| >> | Right shift |\n\n### 8. Assignment Operators\nBitwise\
    \ assignment operators are used to perform bitwise operations and assignment.\n\
    \n| Operator | Description |\n|---|---|\n| &= | Bitwise AND assignment |\n| |=\
    \ | Bitwise OR assignment |\n| ^= | Bitwise XOR assignment |\n\n### 9. Size Operator\n\
    The size operator is used to determine the size of data types or variables in\
    \ bytes.\n\n| Operator | Description |\n|---|---|\n| sizeof | Returns the size\
    \ of the operand in bytes |\n\n### 10. Address Operator\nThe address operator\
    \ is used to get the memory address of a variable.\n\n| Operator | Description\
    \ |\n|---|---|\n| & | Returns the address of the variable |\n\n### 11. Pointer\
    \ Operator\nThe pointer operator is used to declare a pointer and dereference\
    \ it.\n\n| Operator | Description |\n|---|---|\n| * | Declares a pointer or dereferences\
    \ it |\n\n### 12. Memory Management Operators\nC++ provides two operators for\
    \ dynamic memory management:\n\n- **new**: Used to allocate memory on the heap.\n\
    - **delete**: Used to deallocate memory allocated with new.\n"
  mdcn: "\n\n# Darshan\n工程技术学院\n\n# 2 – C++ 基础\n\n**关键字：**\n\n- 它们是被显式预留的标识符，不能用作程序变量或其他用户定义程序元素的名称。\n\
    - 示例：int, class, void 等。\n\n**标识符：**\n\n- 它们指的是由程序员创建的变量、函数、数组、类等的名称。\n- 每种语言对这些标识符的命名都有其set的规则。\n\
    - 以下是 C 和 C++ 共同的规则：\n  - 仅允许字母数字字符、数字和下划线。\n  - 名称不能以数字开头。\n  - 大写字母和小写字母是可区分的。\n\
    \  - 已声明的关键字不能作为变量名。\n\n**常量：**\n\n- 与变量一样，常量也是数据存储位置。但变量的值可以变化，而常量不会改变。\n- 在创建常量时必须对其初始化，且在初始化后不能为其分配新值。\n\
    \n**使用 #define 定义常量：**\n\n- #define 是一个预处理器指令，用于声明符号常量。\n- 语法示例：\n  ```cpp\n#define\
    \ PI 3.14\n  ```\n- 预处理器每看到单词 PI，它就会在文中将其替换为 3.14。\n\n**示例：**\n\n```cpp\n#include<iostream>\n\
    using namespace std;\n#define PI 3.14\n\nint main() {\n  int r\n}\n```\n\n输出：\n\
    输入半径： 5\n圆面积 = 78.5\n\n**使用 const 关键字定义常量：**\n\n- 'const' 关键字用于声明任意类型的常量变量。\n\
    - 我们在程序执行期间不能改变它的值。\n- 语法：const 数据类型 变量名 = 2;\n- 现在 'a' 是一个整型常量。\n\n# 2 – C++\
    \ 基础\n\n3) 解释 C++ 中使用的各种数据类型。\n\n- C++ 提供了以下数据类型。\n- 我们可以将数据类型分为三个部分：\n  1. 基本数据类型\n\
    \  2. 派生数据类型\n  3. 用户定义数据类型\n\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_5_0.png)\n\
    \n### 基本/内置数据类型：\n- C++ 的基本数据类型如下。\n\n| 大小（字节） | 范围 |\n|---|---||\n| char | 1\
    \ | -128 to 127 |\n| unsigned char | 1 | 0 to 255 |\n| short or int | 2 | -32,768\
    \ to 32,767 |\n| unsigned int | 2 | 0 to 65535 |\n| long | 4 | -2147483648 to\
    \ 2147483647 |\n| unsigned long | 4 | 0 to 4294967295 |\n| float | 4 | 3.4e-38\
    \ to 3.4e+38 |\n| double | 8 | 1.7e-308 to 1.7e+308 |\n| long double | 10 | 3.4e-4932\
    \ to 1.1e+4932 |\n\n### 派生数据类型：\n- 以下是派生数据类型：\n  1. 数组\n  2. 函数\n  3. 指针\n\n-\
    \ 如果不使用基本数据类型，无法使用派生数据类型。\n- **数组**：数组是一个固定大小的、具有相同数据类型的元素的有序集合。\n- **指针**：指针是一个特殊变量，它包含另一个变量的地址。\n\
    - **函数**：为了某些特殊目的而组合在一起的一组语句。\n\n### 用户定义类型：\n- 在 C++ 语言中有以下几种类型的用户数据类型。\n- 用户数据类型由程序员根据其需求定义。\n\
    - **结构体 (Structure)**：结构是将逻辑上相关的不同数据类型的项组合在一起，并通过单一名称进行分组的。\n- **联合体 (Union)**：联合体类似于结构，区别在于元素共享公共内存。\n\
    - **类 (Class)**：类是一个模板，定义了事物或对象的字段和方法。类是用于创建对象的原型。\n- **枚举 (enum)**：枚举是一种用户定义的类型，由一组命名的常量枚举值组成。\n\
    \n- 换句话说，枚举也用于为字符串分配数值常量。\n- 枚举的语法：`enum_tag {变量列表};`\n- 枚举的示例：`enum day_of_week\
    \ {mon=1,tue,wed,thu,fri,sat,sun};`\n\n描述 C++ 中使用的各种运算符。\n运算符是编译器用于执行特定数学或逻辑操作的符号。\n\
    \n### 1. 算术运算符\n算术运算符用于数学计算。C++ 支持以下算术运算符：\n\n| 运算符 | 说明 |\n|---|---|\n| + | 加法或一元加\
    \ |\n| - | 减法或一元减 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模 |\n\n### 2. 关系运算符\n关系运算符用于比较数值。\n\
    \n| 运算符 | 说明 |\n|---|---|\n| < | 小于 |\n| <= | 小于等于 |\n| > | 大于 |\n| >= | 大于等于\
    \ |\n\n### 3. 逻辑运算符\n逻辑运算符用于逻辑。\n\n| 运算符 | 说明 |\n|---|---|\n| && | 逻辑与 |\n| ||\
    \ | 逻辑或 |\n| ! | 逻辑非 |\n\n### 4. 赋值运算符\n赋值运算符用于将值赋予变量。\n\n| 运算符 | 说明 |\n|---|---|\n\
    | = | 赋值 |\n| += | 加法赋值 |\n| -= | 减法赋值 |\n| *= | 乘法赋值 |\n| /= | 除法赋值\n| %= | 取模赋值\
    \ |\n\n### 5. 递增/递减运算符\n这些是用于改变值的特殊运算符。\n\n| 运算符 | 说明 |\n|---|---|\n| ++ | 递增\
    \ |\n| -- | 递减 |\n\n### 6. 条件运算符\n![](img/f20ebad23d7bd6ce200c44e70b08aa15_5_0.png)\n\
    \n三元运算符称为条件运算符。\n- 语法：`条件 ? 真时的表达式 : 假时的表达式;`\n- 它用于替代简单的 if-else 语句。\n\n### 7.\
    \ 位运算符\n位运算符用于对数据进行位操作。\n\n| 运算符 | 说明 |\n|---|---|\n| & | 位与 |\n| | | 位或 |\n|\
    \ ^ | 位异异 |\n| ~ | 位取反 |\n| << | 左移 |\n| >> | 右移 |\n\n### 8. 位赋值运算符\n位赋值运算符用于位操作和赋值。\n\
    \n| 运算符 | 说明 |\n|---|---|\n| &= | 位与赋值 |\n| |= | 位或赋值 |\n| ^= | 位异异赋值 |\n\n"
