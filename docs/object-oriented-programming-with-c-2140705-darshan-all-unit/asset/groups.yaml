    # Container:


    +   * A container is an object that actually stores data.

    * It is a data way is organized in memory.

    * The STL containers are implemented by template classes and therefore can be
    easily customized to hold different types of data.


    # Algorithm:


    +   * An algorithm is a procedure that is used to process the data contained in
    the containers.

    * The STL includes many different kinds of algorithms to provide support to tasks
    such as initializing, searching, copying, sorting, and merging.

    * Algorithms are implemented by template functions.


    # Iterator:


    +   * The iterators is an object(like a pointer) that points to an element in
    a container.

    * We can use iterators to move through the contents of containers.

    * Iterators are handled just like pointers.

    * We can increment or decrement them.

    * Iterators connect algorithms with containers and play a key role in the manipulation
    of data stored in the containers'
