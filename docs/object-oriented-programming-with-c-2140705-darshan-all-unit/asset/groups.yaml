    - 构造函数没有返回类型，且不能返回返回值，即使是。\n- 构造函数不能被继承，尽管派生类可以调用基类的构造函数。\n- 构造函数不能是虚函数（virtual）。\n\
    - 带有构造函数的对象不能作为 union（union）的成员。\n- 当需要分配内存时，它们隐含了对 `new` 和 `delete` 运算符。\n\n\
    # 4 – 对象与类\n\n示例：\n\n```cpp\nclass integer\n{\n    int m, n;\npublic:\n    integer()\
    \ // 默认构造函数\n    {\n        m = n = 0;\n    }\n}\n```\n\n# 2. 参数构造函数\n\n- 带有参数的构造函数称为参数构造函数。\n\
    - 有时在创建不同对象时，需要用不同的值初始化不同的数据元素。\n- 我们可以通过在创建对象时向构造函数传递参数来实现这一目标。\n\n示例：\n\n```cpp\n\
    class integer\n{\n    int m, n;\npublic:\n    integer(int x, int y) // 参数构造函数\n\
    \    {\n        m = x;\n        n = y;\n    }\n}\n```\n\n# 3. 拷贝构造函数\n\n- 拷贝构造函数用于从另一个对象声明并初始化对象。\n\
    - 例如，`integer(integer &)` 或 `integer I2 (I1)`。\n- 接受同类引用作为参数的构造函数称为拷贝构造函数。\n\n\
    示例：\n\n```cpp\nclass integer\n{\n    int m, n;\npublic:\n    integer(integer &x)\
    \ // 拷贝构造函数\n    {\n        m = x.m;\n        n = x.n;\n    }\n};\n```\n\n# 4\
    \ – 对象与类\n\n示例：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nclass rectangle\n\
    {\n    int length, width;\n\npublic:\n    rectangle() // 默认构造函数\n    {\n     \
    \   length = 0;\n        width = 0;\n    }\n    rectangle(int _length, int _width)\
    \ // 参数构造函数\n    {\n        length = _length;\n        width = _width;\n    }\n\
    \    rectangle(rectangle &r_) // 拷贝构造函数\n    {\n        length = _r_.length;\n\
    \        width = _r_.width;\n    }\n\n    // 其他读取、写入和处理的函数可以写在这里\n};\n```\n\n\
    ```cpp\nint main()\n{\n    rectangle r1; // 调用默认构造函数\n    rectangle r2(10,10);\
    \ // 调用参数构造函数\n    rectangle r3(r2); // 调用拷贝构造函数\n}\n```\n\n- 7) 结合示例解释析构函数。\n\
    \n- 析构函数用于销毁由构造函数创建的对象。\n- 析构函数是一个成员函数名必须与类名相同，但前面有一个波浪号 (~)。\n- 析构函数不接受任何参数，也不返回任何值，也没有返回类型。\n\
    - 析构函数在程序退出时自动调用。\n- 析构函数应该声明在公共区域。\n\n示例：\n\n```cpp\n#include<iostream.h>\nusing\
    \ namespace std;\nclass rectangle\n{\n    int length, width;\npublic:\n    rectangle()\
    \ // 构造函数\n    {\n        length = 0;\n        width = 0;\n    }\n    ~rectangle()\
    \ // 析构函数\n    {\n        // 其他读取、写入和处理的函数可以写在这里\n    }\n};\n```\n\n```cpp\nint\
    \ main()\n{\n    rectangle x; // 此对象调用默认构造函数\n}\n```\n\n- 8) 结合示例解释对象作为函数参数的使用。\n\
    \n- 对象像任何其他数据类型一样可以作为函数参数。可以通过以下方式实现：\n1. 将整个对象的拷贝传递给函数\n    - 这种方法称为值传递（call\
    \ by value）。\n    - 由于传递的是对象的拷贝，在函数内部对对象进行的任何更改都不会影响调用函数时的对象。\n2. 仅将对象的地址传递给函数。\n\
    \    - 这种方法称为引用传递（pass-by-reference）。\n    - 当传递对象的地址时，被调用的函数直接作用于调用时的实际对象。\n\
    \    - 这意味着函数内部对对象进行的任何更改将反映在实际对象中。\n    - 这种方法更高效，因为只需要传递对象的地址，而不是整个对象。\n\n示例：\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nclass time\n{\n    int hours;\n\
    \    int minutes;\npublic:\n    void gettime(int h, int m)\n    {\n        hours\
    \ = h;\n        minutes = m;\n    }\n    void pouttime(void)\n    {\n        cout\
    \ << hours << \" hours and \";\n        cout << \"minutes\" << \"\\n\";\n    }\n\
    \    void sum(time, time); // 使用对象作为参数的声明\n\n    void sum(time t1, time t2) //\
    \ t1,t2 是对象\n    {\n        minutes = t1.minutes + t2.minutes;\n        hours\
    \ = minutes / 60;\n        minutes = minutes % 60;\n        hours = hours + t1.hours\
    \ + t2.hours;\n    }\n};\n\nint main()\n{\n    time t1, t2, t3;\n    t1.gettime(2,45);\
    \ // 获取 t1\n    t2.gettime(3,30); // 获取 t2\n    t3.sum(t1,t2); // = t1 + t2\n\
    \    cout << \"t1: \" << t1.puttime(); // 显示 t1\n    cout << \"t2: \" << t2.puttime();\
    \ // 显示 t2\n    cout << \"t3: \" << t3.puttime(); // 显示 t3\n\n    return 0;\n\
    }\n```\n\n# 9) 结合示例解释运算符重载。\n\n- 运算符重载是编译时多态。\n- 运算符重载为对用户定义类型执行操作提供了机制。\n- 我们可以给程序中的任何运算符赋予含义。\n\
    - 运算符重载的规则：\n    1. 只有现有运算符可以被重载。\n    2. 被重载运算符的操作数可以是用户定义类型。\n    3. 我们不能改变运算符的性质。\n\
    \    4. 我们不能重载某些运算符。\n    5. 通过成员函数重载的运算符不返回值。\n    6. 通过成员函数重载的二元运算符接受一个参数。\n\
    \    7. 通过友元函数重载的运算符返回类的对象。\n    8. 通过友元函数重载的二元运算符接受两个参数。\n# 4 – 对象与类\n\n- 一元运算符重载示例\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass sample\n{\n    int\
    \ a, b;\npublic:\n    void getdata()\n    {\n        a = 10;\n        b = 20;\n\
    \    }\n    void operator - () // 一元成员函数\n    {\n        a = a - 5;\n        b\
    \ = b - 5;\n    }\n    void disp()\n    {\n        cout << \"\\nThe value of a\
    \ = \" << a;\n        cout << \"\\nThe value of b = \" << b;\n    }\n};\n```\n\
    \n- 使用友元函数的一元运算符重载示例\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    class sample\n{\n    int a, b;\npublic:\n    void getdata()\n    {\n        a\
    \ = 10;\n        b = 20;\n    }\n    friend sample operator +(sample A) // 一元友元函数\n\
    \    {\n        A.a = A.a + 5;\n        A.b = A.b + 5;\n        return A;\n  \
    \  }\n    void disp()\n    {\n        cout << \"\\nThe value of a = \" << a;\n\
    \        cout << \"\\nThe value of b = \" << b;\n    }\n};\n\nint main() {\n \
    \   sample S;\n    S.getdata();\n    S = operator +(S); // 调用一元友元函数\n    S.disp();\n\
    \    return 0;\n}\n```\n\n- 二元运算符重载示例\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass complex {\n  float real, imag;\npublic:\n  complex(float _real,\
