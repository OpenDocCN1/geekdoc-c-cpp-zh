- md: "\n# 1 – Concepts of OOP\n\n1) What is Object Oriented Programming? Differentiate\
    \ procedure oriented and object oriented programming language. OR\nList out characteristics\
    \ of POP and OOP.\n\nObject Oriented Programming paradigm represents concepts\
    \ as objects that has fields and associated procedures known as methods.\n\n|\
    \ Procedure Oriented Programming (POP) | Object Oriented Programming (OOP) |\n\
    |---|---|\n| 1. Emphasis is on doing things not on data, means it is function\
    \ | 1. Emphasis is on data rather than procedure, means object driven |\n| 2.\
    \ Main focus is on the function and procedures that operate on data | 2. Main\
    \ focus is on the data that is being operated |\n| 3. Top Down approach in program\
    \ design | 3. Up Up approach in program design |\n| 4. Large programs are divided\
    \ into smaller programs known as functions | 4. Large programs are divided into\
    \ classes and objects |\n| 5. Most of the functions share global data | 5. Data\
    \ is tied together with function in the data structure |\n| 6. Data moves openly\
    \ in the system from one function to another | 6. Data is hidden and cannot be\
    \ accessed by external functions |\n| 7. Adding of data and function is difficult\
    \ | 7. Adding of data and function is easy |\n| 8. We cannot declare namespace\
    \ directly | 8. We can use name space directly, Ex: using namespace std; |\n|\
    \ 9. Concepts like inheritance, polymorphism, data encapsulation, abstraction,\
    \ access specifiers are not available. | 9. Concepts like inheritance, polymorphism,\
    \ data encapsulation, abstraction, access specifiers are available and can be\
    \ easily used |\n| 10. Examples: C, Fortran, Pascal, etc... | 10. Examples: C++,\
    \ Java, C#, etc... |\n\n2) Explain Basic Concepts of OOP. OR\nExplain Following\
    \ terms.\n\nVarious concepts present in OOP to make it more powerful, secure,\
    \ reliable and easy.\n\nObject\n\n- An object is an instance of a class.\n- An\
    \ object means anything from real world like person, computer, bench etc...\n\
    - Every object has at least one unique identity.\n- An object is a component of\
    \ a program that knows how to interact with other pieces of the program.\n- An\
    \ object is the variable of the type class.\n- For example, If water is class\
    \ then river is object.\n\nClass\n\n- A class is a template that specifies the\
    \ attributes and behavior of things or objects.\n- A class is a blueprint or prototype\
    \ from which objects are created.\n- A class is the implementation of an abstract\
    \ data type (ADT).\n- It defines attributes and methods.\n\nExample:\n\n```cpp\n\
    class employee // Class\n{\n    char name[10]; // Data member\n    int id; //\
    \ Data member\n    public:\n    void getdata() // Member function\n    {\n   \
    \     cout<<\n    }\n};\n```\n\n- In example class employee is created and 'a'\
    \ is object of this class.\n- Object declaration can also be made in main() function\
    \ as follows:\n\n```cpp\nint main()\n{\n    employee a;\n}\n```\n\n# Data Abstraction\n\
    \n- Just represent essential features without including the background details.\n\
    - They encapsulate all the essential properties of the objects that are to be\
    \ created.\n- The attributes are sometimes called 'Data members' because they\
    \ hold information.\n- The functions that operate on these data are sometimes\
    \ called 'methods' or 'member functions'.\n- It is used to implement in class\
    \ to provide data security.\n\n# Encapsulation\n\n- Wrapping up of a data and\
    \ functions into single unit is known as encapsulation.\n- In C++ the data is\
    \ not accessible to the outside world.\n- Only those functions can access it which\
    \ is written within single unit.\n\n# Inheritance\n\n- Inheritance is the process,\
    \ by which class can acquire the properties and methods of another class.\n- The\
    \ mechanism of deriving a new class from old class is called inheritance.\n- The\
    \ new class is called derived class and old class is called base class.\n- The\
    \ derived class may have all the features of the base class.\n- Programmer can\
    \ add new features to the derived class.\n- For example, Student is a base class\
    \ and Result is derived class.\n\n# Polymorphism\n\n- A Greek word polymorphism\
    \ the ability to take more than one form.\n- Polymorphism allows a single name\
    \ to be used for more than one purpose.\n- The concept of polymorphism is characterized\
    \ by the idea of 'one interface, multiple methods'.\n- That using a generic interface\
    \ for a group of related activities.\n- It allows a single name to be used for\
    \ more than one purpose.\n\n# 1 – Concepts of OOP\n\nExample:\n\n```cpp\nint total(int);\n\
    int total(int, int);\n```\n\n# Static Binding\n\n- In example class employee is\
    \ created and 'a' is object of this class.\n- Object declaration can also be made\
    \ in main() function as follows:\n\n```cpp\nint main()\n{\n    employee a;\n}\n\
    ```\n\n- In example class employee is created and 'a' is object of this class.\n\
    - Object declaration can also be made in main() function as follows:\n\n# Dynamic\
    \ Binding\n\n- In example class employee is created and 'a' is object of this\
    \ class.\n- Object declaration can also be made in main() function as follows:\n\
    \n```cpp\nint main()\n{\n    employee a;\n}\n```\n\n- In example class employee\
    \ is created and 'a' is object of this class.\n- Object declaration can also be\
    \ made in main() function as follows:\n\n# Message Passing\n\n- In example class\
    \ employee is created and 'a' is object of this class.\n- Object declaration can\
    \ also be made in main() function as follows:\n\n```cpp\nint main()\n{\n    employee\
    \ a;\n}\n```\n\n- In example class employee is created and 'a' is object of this\
    \ class.\n- Object declaration can also be made in main() function as follows:\n\
    \n- 3) List out benefits of OOP.\n- We eliminate redundant code through inheritance.\n\
    - Development time and cost are reduced using existing methods.\n- Build secure\
    \ programs by data hiding.\n- It is easy to map objects to the problem domain.\n\
    - Through message interface between objects becomes simpler.\n- Software complexity\
    \ can be easily managed.\n- It is easy to upgrade from small to large systems.\n\
    - It allows us to reuse code.\n\n- 4) List out Applications of OOP.\nApplications\
    \ of OOP technology has gained importance in almost all areas of computing. Some\
    \ of the examples are follows:\n1. Real-time systems\n2. Simulation and modeling\n\
    3. Object oriented database\n4. Artificial intelligence and expert systems\n5.\
    \ Neural networks and parallel programming\n6. Decision support and office automation\n\
    7. CIM/CAM/CAD systems\n8. Distributed/Parallel/Heterogeneous computing\n9. Data\
    \ warehouse and data mining\n\n# 2 – C++ Basics\n\n1) What is C++? Explain Structure\
    \ of C++.\n\n- C++ is an object oriented programming language.\n- It is a superset\
    \ of C language and also called as extended version of C language.\n- It was developed\
    \ by Bjarne Ststrup at AT&T Bell lab in New Jersey, USA in the early 1980s.\n\
    - Structure of C++ program is as follow.\n\n| Include Files |\n|---|\n| Class\
    \ Declaration or Definition |\n| Member functions definitions |\n| Main function\
    \ |\n\n- In any program first write header files as iostream.h, conio.h, etc..as\
    \ requirement of program.\n- After header file write class declaration or definition\
    \ as per your planning.\n- After class, define member functions which are not\
    \ define but declare inside the class.\n- In last main function without main program\
    \ execution is not possible.\nExample:\n\n```cpp\n#include <iostream> //Header\
    \ File\nusing namespace std;\n\nclass trial //Class\n{\n    int a;\npublic:\n\
    \    void getdata()\n    {\n        a=10;\n    }\n    void putdata();\n};\nvoid\
    \ trial::putdata() //Member Function outside class definition\n{\n    cout<<\"\
    The value of a = \"<<a;\n}\nint main() //Main Function{\n    trial T;\n    T.getdata();\n\
    \    T.putdata();\n}\n```\n\nOutput:\nThe value of a = 10\n\n2) Explain following\
    \ terms.\n\nNamespace:\n\n- It defines a scope for the identifiers that are used\
    \ in a program.\n- For using identifiers in namespace directive is used as follows:\
    \ using namespace std;\n- std is the namespace where ANSI C++ standard class libraries\
    \ are defined.\n- All ANSI C++ programs must include this directive.\n- This will\
    \ bring all the identifiers in std to the current global scope.\n"
  mdcn: "\n\n# 1 – 面向对象概念\n\n1) 什么是面向对象编程？区分面向过程过程和面向对象的编程语言。或者\n列出 POP 和 OOP 的特性。\n\
    \n面向对象编程范式将概念表示为对象，对象具有字段和关联的过程（称为方法）。\n\n| 面向过程编程 (POP) | 面向对象编程 (OOP) |\n|---|---|\n\
    | 1. 重点是执行操作而不是数据，意味着它是函数驱动的 | 1. 重点是数据而不是过程，意味着它是对象驱动的 |\n| 2. 主要关注点是操作数据的函数和过程\
    \ | 2. 主要关注点是正在操作的数据 |\n| 3. 程序设计采用自上而下的方法 | 3. 程序设计采用自底向上的方法 |\n| 4. 大程序被分为较小的程序，称为函数\
    \ | 4. 大程序被分为类和对象 |\n| 5. 大多数函数共享全局数据 | 5. 数据在数据结构中与函数绑定 |\n| 6. 数据在系统中公开地从一个函数移动到另一个函数\
    \ | 6. 数据是隐藏的，不能被外部函数访问 |\n| 7. 添加数据和函数很困难 | 7. 添加数据和函数非常容易 |\n| 8. 我们不能直接声明命名空间\
    \ | 8. 我们可以直接使用命名空间，例如：using namespace std; |\n| 9. 没有继承、多态、数据封装、抽象、访问修符等概念 |\
    \ 9. 具有继承、多态、数据封装、抽象、访问修符等概念并可以方便使用 |\n| 10. 示例：C, Fortran, Pascal 等... | 10.\
    \ 示例：C++, Java, C# 等... |\n\n2) 解释 OOP 的基本概念。或者\n解释以下术语。\n\nOOP 中存在各种概念使其更加强大、安全、可靠且易用。\n\
    \n对象 (Object)\n\n- 对象是类的实例。\n- 对象意味着现实世界中的任何事物，如人、计算机、长椅等...\n- 每个对象至少有一个唯一的标识标识。\n\
    - 对象是程序的一个组件，知道如何与程序的其他部分进行交互。\n- 对象是类类型的变量。\n- 例如，如果水是类，那么河流就是对象。\n\n类 (Class)\n\
    \n- 类是一个模板，指定了事物或对象的属性和行为。\n- 类是一个蓝图或原型，从它开始创建对象。\n- 类是抽象数据类型 (ADT) 的实现。\n- 它定义了属性和方法。\n\
    \n示例：\n\n```cpp\nclass employee // Class\n{\n    char name[10]; // Data member\n\
    \    int id; // Data member\n    public:\n    void getdata() // Member function\n\
    \    {\n        cout<<\n    }\n};\n```\n\n- 在示例中创建了类 employee，'a' 是该类的对象。\n- 对象声明也可以在\
    \ main() 函数中进行，如下所示：\n\n```cpp\nint main()\n{\n    employee a;\n}\n```\n\n# 数据抽象\
    \ (Data Abstraction)\n\n- 只表示基本特征，而不包含背景细节。\n- 它们封装了要创建的对象的所有基本属性。\n- 属性有时被称为“数据成员”，因为它们持有信息。\n\
    - 对这些数据的操作函数有时被称为“方法”或“成员函数”。\n- 它用于类中实现以提供数据安全。\n\n# 封装 (Encapsulation)\n\n-\
    \ 将数据和函数封装在单个单元中被称为封装。\n- 在 C++ 中，数据对外部世界不可见。\n- 只有写在单个单元内的函数才能访问它。\n\n# 继承 (Inheritance)\n\
    \n- 继承类可以获取另一个类的属性和方法的过程。\n- 从旧类派生新类的机制被称为继承。\n- 新类称为派生类 (derived class)，旧类称为基类\
    \ (base class)。\n- 派生类可能拥有基类的所有特征。\n- 程序员可以在派生类中添加新功能。\n- 例如，Student 是基类，Result\
    \ 是派生类。\n\n# 多态 (Polymorphism)\n\n- 多态是一个希腊语，意为采取多种形式的能力。\n- 多态允许一个名称用于多个用途。\n\
    - 多态概念的特征是“一个接口，多种方法”的思想。\n- 即对一组相关活动使用通用接口。\n- 它允许一个名称用于多个用途。\n\n# 1 – 面向对象概念\n\
    \n示例：\n\n```cpp\nint total(int);\nint total(int, int);\n```\n\n# 静态绑定 (Static\
    \ Binding)\n\n- 在示例中创建了类 employee，'a' 是该类的对象。\n- 对象声明也可以在 main() 函数中进行，如下所示：\n\
    \n```cpp\nint main()\n{\n    employee a;\n}\n```\n\n- 在示例中创建了类 employee，'a' 是该类的对象。\n\
    - 对象声明也可以在 main() 函数中进行，如下所示：\n\n# 动态绑定 (Dynamic Binding)\n\n- 在示例中创建了类 employee，'a'\
    \ 是该类的对象。\n- 对象声明也可以在 main() 函数中进行，如下所示：\n\n```cpp\nint main()\n{\n    employee\
    \ a;\n}\n```\n\n- 在示例中创建了类 employee，'a' 是该类的对象。\n- 对象声明也可以在 main() 函数中进行，如下所示：\n\
    \n# 消息传递 (Message Passing)\n\n- 在示例中创建了类 employee，'a' 是该类的对象。\n- 对象声明也可以在 main()\
    \ 函数中进行，如下所示：\n\n```cpp\nint main()\n{\n    employee a;\n}\n```\n\n- 在示例中创建了类\
    \ employee，'a' 是该类的对象。\n- 对象声明也可以在 main() 函数中进行，如下所示：\n\n- 3) 列出 OOP 的优点。\n- 我们通过继承消除了冗余代码。\n\
    - 使用现有方法减少了开发时间和成本。\n- 通过数据隐藏构建安全的程序。\n- 很容易将对象映射到问题领域。\n- 通过对象之间的消息接口变得更简单。\n\
    - 可以轻松管理软件复杂性。\n- 容易从小系统升级到大系统。\n- 它允许我们重用代码。\n\n- 4) 列出 OOP 的应用。\nOOP 技术的应用在几乎所有计算领域都变得重要。某些示例如下：\n\
    1. 实时系统\n2. 仿真与建模\n3. 面向对象数据库\n4. 人工智能和专家系统\n5. 神经网络和并行编程\n6. 决策支持和办公自动化\n7. CIM/CAM/CAD\
    \ 系统\n8. 分布式/并行/异构计算\n9. 数据仓库和数据挖掘\n\n# 2 – C++基础\n\n1) 什么是 C++？解释 C++ 的结构。\n\n\
    - C++ 是一种面向对象的编程语言。\n- 它是 C 语言的超集，也被称为 C 语言的扩展版本。\n- 它是由 Bjarne Ststrup 在 80 年代初在美国新泽西\
    \ AT&T 实验室开发的。\n- C++ 程序的结构如下。\n\n| 包含文件 |\n|---|\n| 类声明或定义 |\n| 成员函数定义 |\n| 主函数\
    \ |\n\n- 在任何程序中，首先编写头文件，如 iostream.h、conio.h 等，取决于程序需要。\n- 头文件之后，根据计划编写类声明或定义。\n\
    - 类之后，定义在类内声明但未定义的成员函数。\n- 最后，没有 main 函数，程序执行是不可能的。\n示例：\n\n```cpp\n#include <iostream>\
    \ //Header File\nusing namespace std;\n\nclass trial //Class\n{\n    int a;\n\
    public:\n    void getdata()\n    {\n        a=10;\n    }\n    void putdata();\n\
    };\nvoid trial::putdata() //Member Function outside class definition\n{\n    cout<<\"\
    The value of a = \"<<a;\n}\nint main() //Main Function{\n    trial T;\n    T.getdata();\n\
    \    T.putdata();\n}\n```\n\n输出：\nThe value of a = 10\n\n2) 解释以下术语。\n\n命名空间 (Namespace)：\n\
    \n- 它为程序中使用的标识符定义了作用域。\n- 使用命名空间中标识符的指令如下所示：using namespace std;\n- std 是定义 ANSI\
    \ C++ 标准类的命名空间。\n- 所有 ANSI C++ 程序都必须包含此指令。\n- 这会将 std 中的所有标识符引入到当前的全局作用域中。\n\n"
