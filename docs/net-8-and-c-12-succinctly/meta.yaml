    More interestingly, the RandomNumberGenerator has two new methods, called GetHexString
    and GetString, as seen in Code Listing 16.


    The GetHexString method will randomly generate a cryptographically secure string
    of 25 characters in length, which you can use to create unpredictable IDs (for
    example).


    The GetString method accepts a string of characters and a length and returns a
    cryptographically secure random string of characters (based on the characters
    you provided as parameter) of the length you specified.


    # Code Listing 16: The RandomNumberGenerator Class


    ```

    var hexStr = RandomNumberGenerator.GetHexString(25);

    // 9CDC0DC099A7E41DE5F4D2E0F

    var gen = RandomNumberGenerator.GetString("bcdefBCDEFG0123456789-!@#%$^*()-+&",
    15);

    // G#7cg-g95g=b16

    ```


    A word of caution; though this can be very useful in many areas of your code,
    do not rely solely on it for generating passwords. Without cryptographically secure
    manner, it is very easy to generate a weak password. This is especially true if
    the length is small, and the characters you do not strike a nice balance among
    lowercase, uppercase, and special characters.


    # Performance-focused types


    As with .NET 7, Microsoft has focused on performance with the release of .NET
    8. There are some nice improvements out of the box, as well as some new types
    that you can use in your code. A later on, we will look at benchmarking some of
    this code. For now, let''s just have a look at the new types.


    # Frozen and FrozenDictionary


    In the .NET 8 System.Collections.Frozen namespace, we now have two new collection
    types: FrozenDictionary<TKey, TValue> and FrozenSet<T>. Once created, you cannot
    make changes to keys or values. As you can imagine, this leads to faster read
    operations using TryGetValue(), for example. With a long-lived service, types
    like these are really useful because they are populated first and then used for
    the service duration.


    # Code Listing 17: Using the FrozenSet


    ```

    var lst = new List<string> { "John", "Mark", "Jane", "Jeremy", "Daton", "Sally",
    "Mary" };

    var frozenSet = lst.ToFrozenSet();

    var theRealJeremyPleaseStandup = frozenSet.Contains("Jeremy");

    ```'
  - '[PAGE 33]


    Taking a look at the ToFrozenSet method in Code Listing 17, for example, the code
    is not particularly mind-blowing and in of itself. You will get what you expect
    here, which is a frozen set containing the names of the people in the list provided.


    What do I find interesting is what underneath. As mentioned before, this frozen
    set cannot be modified. You can see this behavior if you look at a subset of the
    code contained in the FrozenSet class, as seen in Figure 18. The FrozenSet class
    implements the ISet interface.


    ```

    /// <inherit />

    bool ISet<T>.Add(T item) => throw new NotSupportedException();


    /// <inherit />

    void ISet<T>.ExceptWith(IEnumerable<T> other) => throw new NotSupportedException();


    /// <inherit />

    void ISet<T>.IntersectWith(IEnumerable<T> other) => throw new NotSupportedException();


    /// <inherit />

    void ISet<T>.SymmetricExcept(IEnumerable<T> other) => throw new NotSupportedException();


    /// <inherit />

    void ISet<T>.UnionWith(IEnumerable<T> other) => throw new NotSupportedException();


    /// <inherit />

    void ICollection<T>.Add(T item) => throw new NotSupportedException();


    /// <inherit />

    void ICollection<T>.Clear() => throw new NotSupportedException();


    /// <inherit />

    bool ICollection<T>.Remove(T item) => throw new NotSupportedException();

    ```


    The FrozenSet does not, however, support the methods of ISet that mutate data.
    Because FrozenSet implements the ISet interface, and because ISet defines the
    number of methods of a set should have, the FrozenSet must provide an implementation
    for all the methods of ISet, even the unsupported methods. Because the FrozenSet
    is designed to be immutable, it simply throws a NotSupportedException in the implementation.


    You can even test this by casting the instance of the FrozenSet to an `ISet<string\>,
    as seen in Figure 19, and trying to add some data. Slim Shady will remain seated
    and hidden, because trying to add to the set throws the exception.


    Figure 18: The Unsupported ISet Implementations'
