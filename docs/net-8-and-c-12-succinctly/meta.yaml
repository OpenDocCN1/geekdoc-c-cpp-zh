- md: "\nMore interestingly, the RandomNumberGenerator has two new methods, called\
    \ GetHexString and GetString, as seen in Code Listing 16.\n\nThe GetHexString\
    \ method will randomly generate a cryptographically secure string of 25 characters\
    \ in length, which you can use to create unpredictable IDs (for example).\n\n\
    The GetString method accepts a string of characters and a length and returns a\
    \ cryptographically secure random string of characters (based on the characters\
    \ you provided as parameter) of the length you specified.\n\n## Code Listing 16:\
    \ The RandomNumberGenerator Class\n\n```\nvar hexStr = RandomNumberGenerator.GetHexString(25);\n\
    // 9CDC0DC099A7E41DE5F4D2E0F\nvar gen = RandomNumberGenerator.GetString(\"bcdefBCDEFG0123456789-!@#%$^*()-+&\"\
    , 15);\n// G#7cg-g95g=b16\n```\n\nA word of caution: though this can be very useful\
    \ in many areas of your code, do not rely solely on it for generating passwords.\
    \ Without cryptographically secure manner, it is very easy to generate a weak\
    \ password. This is especially true if the length is small, and the characters\
    \ you do not strike a nice balance among lowercase, uppercase, and special characters.\n\
    \n## Performance-focused types\n\nAs with .NET 7, Microsoft has focused on performance\
    \ with the release of .NET 8. There are some nice improvements out of the box,\
    \ as well as some new types that you can use in your code. A later on, we will\
    \ look at benchmarking some of this code. For now, let's just have a look at the\
    \ new types.\n\n## Frozen and FrozenDictionary\n\nIn the .NET 8 System.Collections.Frozen\
    \ namespace, we now have two new collection types: FrozenDictionary<TKey, TValue>\
    \ and FrozenSet<T>. Once created, you cannot make changes to keys or values. As\
    \ you can imagine, this leads to faster read operations using TryGetValue(), for\
    \ example. With a long-lived service, types like these are really useful because\
    \ they are populated first and then used for the service duration.\n\n## Code\
    \ Listing 17: Using the FrozenSet\n\n```\nvar lst = new List<string> { \"John\"\
    , \"Mark\", \"Jane\", \"Jeremy\", \"Daton\", \"Sally\", \"Mary\" };\nvar frozenSet\
    \ = lst.ToFrozenSet();\nvar theRealJeremyPleaseStandup = frozenSet.Contains(\"\
    Jeremy\");\n```\n\nTaking a look at the ToFrozenSet method in Code Listing 17,\
    \ for example, the code is not particularly mind-blowing and in of itself. You\
    \ will get what you expect here, which is a frozen set containing the names of\
    \ the people in the list provided.\n\nWhat do I find interesting is what underneath.\
    \ As mentioned before, this frozen set cannot be modified. You can see this behavior\
    \ if you look at a subset of the code contained in the FrozenSet class, as seen\
    \ in Figure 18. The FrozenSet class implements the ISet interface.\n\n```\n///\
    \ <inherit />\nbool ISet<T>.Add(T item) => throw new NotSupportedException();\n\
    \n/// <inherit />\nvoid ISet<T>.ExceptWith(IEnumerable<T> other) => throw new\
    \ NotSupportedException();\n\n/// <inherit />\nvoid ISet<T>.IntersectWith(IEnumerable<T>\
    \ other) => throw new NotSupportedException();\n\n/// <inherit />\nvoid ISet<T>.SymmetricExcept(IEnumerable<T>\
    \ other) => throw new NotSupportedException();\n\n/// <inherit />\nvoid ISet<T>.UnionWith(IEnumerable<T>\
    \ other) => throw new NotSupportedException();\n\n/// <inherit />\nvoid ICollection<T>.Add(T\
    \ item) => throw new NotSupportedException();\n\n/// <inherit />\nvoid ICollection<T>.Clear()\
    \ => throw new NotSupportedException();\n\n/// <inherit />\nbool ICollection<T>.Remove(T\
    \ item) => throw new NotSupportedException();\n```\n\nThe FrozenSet does not,\
    \ however, support the methods of ISet that mutate data. Because FrozenSet implements\
    \ the ISet interface, and because ISet defines the number of methods of a set\
    \ should have, the FrozenSet must provide an implementation for all the methods\
    \ of ISet, even the unsupported methods. Because the FrozenSet is designed to\
    \ be immutable, it simply throws a NotSupportedException in the implementation.\n\
    \nYou can even test this by casting the instance of the FrozenSet to an `ISet<string>`,\
    \ as seen in Figure 19, and trying to add some data. Slim Shady will remain seated\
    \ and hidden, because trying to add to the set throws the exception.\n\nFigure\
    \ 18: The Unsupported ISet Implementations\n\n```\nvar lst = new List<string>\
    \ { \"John\", \"Mark\", \"Jane\", \"Jeremy\", \"Daton\", \"Sally\", \"Mary\" };\n\
    var frozenSet = lst.ToFrozenSet();\nvar willTheRealJeremyStandup = frozenSet.Contains(\"\
    Jeremy\");\nISet<string> set = frozenSet;\nset.Add(\"Slim Shady\"); // This will\
    \ throw an error\n```\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_34_0.png)\n\n\
    Figure 19: Mutating Will Throw An Exception\n\nYou might be wondering the FrozenSet\
    \ class implements ISet if it doesn't support all the operations of a set. This\
    \ is because ISet<T> also contains a number of useful methods for querying a set.\
    \ Therefore, FrozenSet implements ISet so that it can provide implementations\
    \ for these methods.\n\nThe FrozenDictionary works exactly the same manner, as\
    \ seen in Code Listing 18.\n\n## Code Listing 18: The FrozenDictionary\n\n```\n\
    var dictionary = new Dictionary<string, int>\n{\n    { \"John\", 38 },\n    {\
    \ \"Mark\", 42 },\n    { \"Jane\", 24 }\n}\nvar frozenDictionary = dictionary.ToFrozenDictionary();\n\
    ```\n\nThis time, the FrozenDictionary implements the IDictionary interface. Similarly,\
    \ it needs to add the implementations of the interface it implements and does\
    \ so by throwing a NotSupportedException for all the methods that mutate the data.\n\
    \n## SearchValue<T>\n\n.NET 8 now also includes a new SearchValues<T> type. Methods\
    \ such as MemoryExtensions.ContainsAny, checks to see if a value is contained\
    \ in a collection, have been modified to add new overloads to accept an instance\
    \ of this new type.\n\nThis means you can now do this in Code Listing 19. I have\
    \ created an instance of SearchValues<char>, but you can also have an instance\
    \ of SearchValues<byte>.\n\n## Code Listing 19: The New SearchValues Type\n\n\
    ```\nvar strSear = @\"^:\\|?*\";\nSearchValues<char> illegalChars = SearchValues.Create(strSear);\n\
    \nvar fileName = @\"Important_|File.txt\";\nvar illegal = fileName.AsSpan().ContainsAny(illegalChars)\n\
    // illegal = true\n```\n\nYou might be wondering why this new type matters. Well,\
    \ as it turns out, when you create an instance of this type, everything that is\
    \ required to optimize subsequent searches is derived. Having all this work up\
    \ front means a performance boost for your code.\n\nIn fact, just have a look\
    \ at the .NET Runtime repo on GitHub and search for the term SearchValue. You\
    \ will see that Microsoft is using the new SearchValue type a bit.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_35_0.png)\n\
    \nFigure 20: The .NET Runtime Using SearchValues\n\nThis means that your code\
    \ will also get this performance improvement for free, by upgrading to .NET 8.\n\
