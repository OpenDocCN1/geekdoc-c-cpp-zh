    \ the Shuffle Method\n\n```\npublic void Shuffle<T>(T[] values)\n{\n    ArgumentNullException.ThrowIfNull(values);\n\
    \    Shuffle(values.AsSpan());\n}\n\npublic void Shuffle<T>(Span<T> values)\n\
    {\n    int n = values.Length;\n    for (int i = 0; i < n - 1; i++)\n    {\n  \
    \      int j = Next(i, n);\n        if (j != i)\n        {\n            T temp\
    \ = values[i];\n            values[i] = values[j];\n            values[j] = temp;\n\
    \        }\n    }\n}\n```\n\nThe Shuffle method accepts an array or a Span. If\
    \ you pass an array, it will be changed to a Span anyway, before being shuffled.\
    \ This makes it extremely efficient, as it performs an in-place shuffle of the\
    \ respective data structures, instead of returning a new array or.\n\nTherefore,\
    \ keep this in mind if you have created code that shuffles large arrays, as this\
    \ might give you a performance boost."
