  md: '# # Chapter 1 Introducing .NET 8


    Microsoft began working on .NET in 1998, and it has since evolved into a tour
    de force among developers worldwide. From its birth in 2002, .NET has advanced
    to keep up with the changing demands of the IT landscape, much like biological
    species evolve to adapt to their surroundings. Introduced as the .NET Framework,
    it offered a rich set of libraries and tools, becoming popular with an army of
    software developers globally.


    In 2016, entering the .NET Core era, Microsoft announced the open-source, cross-platform
    implementation of the .NET Framework, refactored and renamed .NET Core. For us
    old enough to remember the first incarnations of the .NET Framework, the idea
    of .NET Core seemed almost magical. Enabling developers to build and run apps
    on Windows, macOS, and Linux, .NET quickly gained adoption in the industry.


    | 2016 - 2018 | 2019 | Nov 2020 | Nov 2021 | Nov 2022 |

    |--- | --- | --- | --- | --- |

    | .NET Core | .NET Core 3.1 LTS | .NET 5.0 | .NET 6.0 | .NET 7.0 |

    | 1.0–1.1–2.0–2.1–2 | Support until Dec 2022 | Out of support | LTS until Dec
    2024 | STS release |


    ![](img/7b8ba6070e5beefbf599660730ba1d42_7_0.png)


    Microsoft finally unified the .NET ecosystem with the release of .NET 5 in 2020.
    Looking at Figure 1, you will notice that there seems to be a jump between .NET
    Core 3.1 and .NET 5 Version 4 was skipped to avoid confusion with the .NET Framework
    versions. Microsoft touted .NET 5.0 as a single, unified platform that would replace
    .NET Core, Xamarin, and the .NET Framework.


    .NET Core 1.0 was released in 2016 and heralded the start of what we now today
    as .NET 8. Before this release, developers were accustomed to the .NET Framework,
    released in the early 2000s. It was closed-source and only ran on Windows. .NET
    Core was the first, .NET version to run across platforms and is an open-source
    project.


    .NET Core saw many releases between 2016 and 2018, culminating in release of .NET
    Core 3.1 in 2019. .NET Core 3.1 was a long-term support version, with support
    for it ending in 2022.


    Many companies developed software on .NET Core 3.1 due to its long-term support
    status. It was, therefore, a very popular version of .NET Core. Then, in 2020,
    Microsoft surprised us with the release of .NET 5.0. Support for .NET 5.0 ended
    in May 2022.'
