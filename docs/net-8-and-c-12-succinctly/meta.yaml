  md: "```\nhttpContext.Response.StatusCode = 500;\nhttpContext.Response.ContentType\
    \ = \"text/plain\";\nawaitHttpContext.Response.WriteAsync($\"Custom Exception\
    \ Handler: {ex.Message}\");\n\n    return true;\n}\n\n```\n\nNow that we have\
    \ our custom exception handler, need to add it to our services, as seen in Code\
    \ Listing 56.\n\n# Code Listing 56: Modifying the Program.cs File\n\n```\nusing\
    \ ExceptionHandlingDemo;\n\nvar builder = WebApplication.CreateBuilder(args);\n\
    builder.Services.AddExceptionHandler<Custom>();\n\nvar app = builder.Build();\n\
    app.UseExceptionHandler(_ => { });\n\napp.Map(\"/api/getsetasks\", () => {\n \
    \   throw new InvalidProgramException(\"Something wrong\");\n});\n\napp.Run();\n\
    ```\n\nYou will notice that AddExceptionHandler is a new API, and we just pass\
    \ it the CustomExceptionHandler class. In effect, this adds our IExceptionHandler\
    \ implementation to the services. These implementations are then used by the exception\
    \ handler middleware to handle unexpected exceptions.\n\nWe then add the middleware\
    \ by adding code app.UseExceptionHandler(_ => { }); to the Program.cs. You should\
    \ notice the _ => {} configuration lambda here; this is because the middleware\
    \ is supposed to look for the CustomExceptionHandler we created, but it doesn't.\
    \ If you used app.UseExceptionHandler(); you will immediately see an error when\
    \ running your application. This UseExceptionHandler doesn't assume that if we\
    \ have AddExceptionHandler, that it must use our custom IExceptionHandler implementation.\n\
    \nYou can view the discussion on GitHub here.\n\nAs a workaround for this error,\
    \ we just use the empty configuration lambda using the _ discards. If we wanted\
    \ to, we could configure options here for our custom exception handler. For this\
    \ example, we just pass in the empty configuration lambda."
