  md: "```\nRandom.Shared.Shuffle(cities);\nforeach (var c in cities)\n{\n    Console.WriteLine(c);\n\
    }\n```\n\nAs can be expected, this will shuffle the cities in the array and output\
    \ them in a random order. Taking a peek at the Shuffle method, you will notice\
