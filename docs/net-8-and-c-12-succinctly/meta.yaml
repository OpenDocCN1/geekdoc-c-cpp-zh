    \ _taskRunnerService;\n\n    public TimeController(TimeService timeService, TaskRunnerService\
    \ taskRunnerService)\n    {\n        _timeService = timeService;\n        _taskRunnerService\
    \ = taskRunnerService;\n    }\n\n    [HttpGet]\n    [ActionName(\"RunMorningTasks\"\
    )]\n    public IActionResultActionResult Get();\n}\n```\n"
