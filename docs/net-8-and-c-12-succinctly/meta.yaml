    # Default lambda parameters


    Before default lambda parameters, we had to invoke the lambda by specifying the
    value of personToGreet, as seen in Code Listing 39.


    Code Listing 39: Before Default Lambda Parameters


    ```

    var greeting = (string personToGreet) => $"Hello, {personToGreet}!";nConsole.WriteLine(greeting("John"));
    // Hello, John!

    ```


    In C# 12, however, we can now set a default value for personToGreet as seen in
    Code Listing 40.


    Code Listing 40: Using Default Lambda Parameters


    ```

    var greeting = (string personToGreet = "World") => $"Hello, {personToGreet}!";

    Console.WriteLine(greeting()); // Hello, World!

    ```


    This is a small, but welcome change.'
