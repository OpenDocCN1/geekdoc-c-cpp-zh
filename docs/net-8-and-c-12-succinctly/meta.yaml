    \ 类\n\n```csharp\n[JsonCreationHandling(JsonCreationHandling.Populate)]\npublic\
    \ class StockItem\n{\n    public required string StockCode { get; set; }\n\n \
    \   public PricingData Pricing { get; set; } = new()\n    {\n        MarkupPercentage\
    \ = 15,\n        Quantity = 1\n    };\n}\n```\n\n继续运行代码并查看 `stockItem` 变量，如图 12\
