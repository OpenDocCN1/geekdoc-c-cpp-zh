    \ Counter\n{\n    public void Increment(ref int score)\n    {\n        score++;\n\
    \    }\n}\n```\n\n| Name | Value | Type |\n|---|---|---|\n| this (Counter) | Counter\
    \ | |\n| score | 31 | int |\n\nFigure 25: Value of score Variable Inside Increment\n\
    \nFigure 25 illustrates this point when looking at the call stack again. As soon\
