    \ so it wouldn't make sense to add it (unless you want to be\nexplicit in your\
    \ code).\n\n# Naming policies\n\nI don't think I can love a feature more than\
    \ I love this feature: naming policies for the\nJsonNamingPolicy class. These\
    \ are (I kid not) snake_case and kebab-case property\nname conversions. Consider\
    \ the code in Code Listing 4.\n\nCode Listing 4: JSON Naming Policies\n\n```csharp\n\
    internal class Program\n{\n    static void Main(string[] args)\n    {\n      \
    \  Student student = new()\n        {\n            Name = \"Wile E. Coyote\",\n\
    \            Age = 74,\n            SchoolName = \"Acme Code School\",\n     \
    \       SchoolAddress = \"1234 Desert Road, Arizona\"\n        }\n\n        var\
    \ options = new JsonSerializerOptions\n        {\n            NamingPolicy = JsonNamingPolicy.KebabCaseLower,\n\
    \        };\n\n        string json = JsonSerializer.Serialize(student, options);\n\
    \    }\n}\n\npublic class Student : Person\n{\n    public required string SchoolName\
    \ { get; set; }\n    public required string SchoolAddress { get; set; }\n}\n```\n\
    \n[content]]\n\n```csharp\n[JsonUnmappedMemberHandling(JsonUnmappedMemberHandling.Disallow)]\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\nYou will notice that using KebabCaseLower in the JsonSerializerOptions.\
    \ Running the code and inspecting the resultant JSON, you will see that SchoolName\
    \ and SchoolAddress have been kebab-cased, as seen in Figure 9.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_19_0.png)\n\
    \nFigure 9: Kebab Case\n\nGo ahead and change the JsonNamingPolicy from KebabCaseLower\
    \ to SnakeCaseLower and run the code again.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_20_0.png)\n\
    \nYou will see that snake casing has been applied to SchoolName and SchoolAddress.\
    \ The following naming policies are available for the JsonNamingPolicy class:\n\
    \n- CamelCase\n- KebabCaseLower\n- KebabCaseUpper\n- SnakeCaseLower\n- SnakeCaseUpper\n\
    \nI love the flexibility that this offers developers when deciding on a JSON naming\
    \ policy.\n\n# Read-only properties\n\nDeserializing into read-only properties\
    \ is now possible. Consider the code in Code Listing 5. I have a StockItem class\
    \ with a read-only property for Pricing. The property defaults to 15 percent and\
    \ a Quantity of 1.\n\nCode Listing 5: Deserializing into Read-Only properties\
    \ in .NET 7\n\n```csharp\ninternal class Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        StockItem? stockItem = JsonSerializer.Deserialize<StockItem>(@\"\
    {\n\"\"StockCode\"\": \"\"1234\"\", \"\"Pricing\"\":{\"\"MarkupPercentage\"\"\
    : 17, \"\"Quantity\"\": 7}}\");\n\n        var json = JsonSerializer.Serialize(stockItem);\n\
    \    }\n}\n```\n\n```csharp\npublic class StockItem\n{\n    public required string\
    \ StockCode { get; set; }\n\n    public PricingData Pricing { get; set; } = new(){\n\
    \        MarkupPercentage = 15,\n        Quantity = 1\n    };\n}\n\npublic class\
    \ PricingData\n{\n    public required int MarkupPercentage { get; set; }\n   \
    \ public required int Quantity { get; set; }\n}\n```\n\nRunning the code .NET\
    \ 7, the JSON payload deserialized into the StockItem class specifies a MarkupPercentage\
    \ of 17 percent and a Quantity of 7.\n\n```csharp\nStockItem item = JsonSerializer.Deserialize<StockItem>(\"\
    \\n{\\\"StockCode\\\": \\\"1234\\\", \\\"MarkupPercentage\\\": 17, \\\"Quantity\\\
    \": 7}\\n\");\n\nvar json = JsonSerializer.Serialize(item);\n```\n\n| | Q View\
    \ |\n|--- |--- |\n| stockItem.StockCode | \"1234\" |\n| stockItem.MarkupPercentage\
    \ | 15 |\n| stockItem.Quantity | 1 |\n\nFigure 11: Results from Setting Read-Only\
    \ Properties in .NET 7\n\nLooking at the results in Figure 11, you will notice\
    \ that the deserialized StockItem object ignored the 17 percent and Quantity of\
    \ 7 set in the JSON. In .NET 8, however, we can populate the read-only MarkupPercentage\
    \ by setting the JsonCreationHandling attribute to Populate, as seen in Code Listing\
    \ 6.\n\n# Code Listing 6: Modifying the StockItem Class\n\n```csharp\n[JsonCreationHandling(JsonCreationHandling.Populate)]\n\
    public class StockItem\n{\n    public required string StockCode { get; set; }\n\
    \n    public PricingData Pricing { get; set; } = new()\n    {\n        MarkupPercentage\
