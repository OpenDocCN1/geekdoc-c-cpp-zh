    \n# 命名策略\n\n我不认为我对某个功能的喜爱能超过对这个功能：针对 `JsonNamingPolicy` 类的命名策略。这些（我不是在开玩笑）snake_case（蛇形命名法）和\
    \ kebab-case（横线型命名法）属性名转换。请考虑代码列表 4 中的代码。\n\n代码列表 4：JSON 命名策略\n\n```csharp\ninternal\
    \ class Program\n{\n    static void Main(string[] args)\n    {\n        Student\
    \ student = new()\n        {\n            Name = \"Wile E. Coyote\",\n       \
    \     Age = 74,\n            SchoolName = \"Acme Code School\",\n            SchoolAddress\
    \ = \"1234 Desert Road, Arizona\"\n        }\n\n        var options = new JsonSerializerOptions\n\
    \        {\n            NamingPolicy = JsonNamingPolicy.KebabCaseLower,\n    \
    \    };\n\n        string json = JsonSerializer.Serialize(student, options);\n\
    \    }\n}\n\npublic class Student : Person\n{\n    public required string SchoolName\
    \ { get; set; }\n    public required string SchoolAddress { get; set; }\n}\n```\n\
    \n```csharp\n[JsonUnmappedMemberHandling(JsonUnmappedMemberHandling.Disallow)]\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\n你会注意到在 `JsonSerializerOptions` 中使用了 `KebabCaseLower`。运行代码并检查生成的\
    \ JSON，你会看到 `SchoolName` 和 `SchoolAddress` 已经转换为 kebab-case 格式，如图 9 所示。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_19_0.png)\n\
    \n图 9：Kebab Case\n\n继续将 `JsonNamingPolicy` 从 `KebabCaseLower` 改为 `SnakeCaseLower`\
    \ 并再次运行代码。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_20_0.png)\n\n你会发现 snake\
    \ casing 已经应用到 `SchoolName` 和 `SchoolAddress`。`JsonNamingPolicy` 类提供了以下命名策略：\n\
    \n- CamelCase\n- KebabCaseLower\n- KebabCaseUpper\n- SnakeCaseLower\n- SnakeCaseUpper\n\
    \n我非常喜欢这种策略为开发人员在决定 JSON 命名策略时提供的灵活性。\n\n# 只读属性\n\n现在可以可以将数据反序列化到只读属性中了。考虑代码列表\
    \ 5 中的代码。我有一个 `StockItem` 类，其中包含一个用于 `Pricing` 的只读属性。该属性的默认值为 15%，`Quantity` 为\
    \ 1。\n\n代码列表 5：在 .NET 7 中反序列化到只读属性\n\n```csharp\ninternal class Program\n{\n \
    \   static void Main(string[] args)\n    {\n        StockItem? stockItem = JsonSerializer.Deserialize<StockItem>(@\"\
    {\n\"\"StockCode\"\": \"\"1234\"\", \"\"Pricing\"\":{\"\"MarkupPercentage\"\"\
    : 17, \"\"Quantity\"\": 7}}\");\n\n        var json = JsonSerializer.Serialize(stockItem);\n\
    \    }\n}\n```\n\n```csharp\npublic class StockItem\n{\n    public required string\
    \ StockCode { get; set; }\n\n    public PricingData Pricing { get; set; } = new(){\n\
    \        MarkupPercentage = 15,\n        Quantity = 1\n    };\n}\n\npublic class\
    \ PricingData\n{\n    public required int MarkupPercentage { get; set; }\n   \
    \ public required int Quantity { get; set; }\n}\n```\n\n在 .NET 7 中运行代码，反序列化到 `StockItem`\
    \ 类的 JSON 负载指定了 `MarkupPercentage` 为 17%，`Quantity` 为 7。\n\n```csharp\nStockItem\
    \ item = JsonSerializer.Deserialize<StockItem>(\"\\n {\\StockCode\\\": \\\"1234\\\
    \", \\\"MarkupPercentage\\\": 17, \\\"Quantity\\\": 7}\\n\");\n\nvar json = JsonSerializer.Serialize(item);\n\
    ```\n\n| | Q View |\n|--- |--- |\n| stockItem.StockCode | \"1234\" |\n| stockItem.MarkupPercentage\
    \ | 15 |\n| stockItem.Quantity | 1 |\n\n图 11：在 .NET 7 中设置只读属性的结果\n\n查看图 11 中的结果，你会发现反序列化的\
