    \    {\n                Name = randomCityService.GetRandomCity(),\n          \
    \      Date = DateOnly.FromDateTime(DateTime.Now.AddDays(index)),\n          \
    \      Temperature = Random.Shared.Next(-20, 55),\n                Summary = randomSummaryService.GetRandomSummary()\n\
    \            })\n            .ToArray();\n        }\n    }\n}\n```\n\n生成的代码需要一些时间来适应。\n\
    \n# 编译器看到了什么\n\n让我们简化代码，看看底层的 C# 代码看起来什么样。代码列表 31 展示了一个简化的 LyingWeatherForecast\
    \ 类。\n\n# 代码列表 31：简化的类\n\n```csharp\npublic class LyingWeatherForecastController(IRandomCityService\
    \ randomCityService, IRandomSummaryService randomSummaryService) : IWidgetController\n\
    {\n    public string GetSomeWeatherData()\n    {\n        var city = randomCityService.GetRandomCity();\n\
    \        var summary = randomSummaryService.GetRandomSummary();\n        return\
    \ $\"It is {summary}\";\n    }\n}\n```\n\n看一眼底层的 C# 代码看起来什么样，代码列表 32。注意 IRandomCityService\
    \ 和 IRandomSummaryService 的私有字段不是 `readonly` 的。\n\n# 代码列表 32：底层的 C# 代码\n\n```csharp\n\
    public class LyingWeatherForecastController : IWidgetController\n{\n    [CompilerGenerated]\n\
    \    [Browsable(DebuggerBrowsableState.Never)]\n    private IRandomCityService\
    \ <randomCityService>P;\n\n    [CompilerGenerated]\n    [Browsable(DebuggerBrowsableState.Never)]\n\
    \    private IRandomSummaryService <randomSummaryService>P;\n\n    public LyingWeatherForecastController(IRandomCityService\
    \ randomCityService, IRandomSummaryService randomSummaryService)\n    {\n    \
    \    <randomCityService>P = randomCityService;\n        <randomSummaryService>P\
    \ = randomSummaryService;\n        base.ctor();\n    }\n\n    public string GetSomeWeatherData()\n\
    \    {\n        string city = <randomCityService>P.GetRandomCity();\n        string\
    \ summary = <randomSummaryService>P.GetRandomSummary();\n        return string.Concat(\"\
    It is \", summary, \" in \", city);\n    }\n}\n```\n\n因此，从类内部更改这些字段的值是可能的——所以注意这个小陷阱。\n\
    \n# 集合表达式\n\n我必须说，我喜欢集合表达式。在我看来，它剔除了一些不必要的修饰。当然，有人可以认为它的表达性没有那么，但事实就是如此。让我们来看一个例子。\n\
    \n代码列表 33：简单的数组\n\n```csharp\nint[] scores = new int[] { 97, 92, 81, 60 };\n```\n\
    \n如代码列表 33 所示，我们有一个标准的整数数组。然而，Visual Studio 将建议使用集合表达式的快速操作，如图 22 所示。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_51_0.png)\n\
    \n图 22：集合表达式重构操作\n\n你可以看到代码列表 34 中的结果代码。\n\n代码列表 34：集合表达式\n\n```csharp\nint[]\
    \ scores = [97, 92, 81, 60];\n```\n\n注意，集合表达式不能用于 `Span<T>`，如代码列表 35 所示。\n\n代码列表\
    \ 35：Span 表达式\n\n```csharp\nSpan<int> foo = [\"a\", \"b\", \"c\"];\n```\n\n集合表达式可能吸引某些开发者，但不是另一些。在\
    \ C# 中，你可以选择使用集合表达式。\n\n# 引用参数\n\n引用参数现在是 C# 中的一个东西。考虑代码列表 36。\n\n代码列表 36：谎谎的天气控制器示例\n\
    \n```csharp\nvar score = 30;\nvar c = new Counter();\nc.Increment(score);\n\n\
    Console.WriteLine($\"The score is {score}\");\n\npublic class Counter\n{\n   \
    \ public void Increment(int score)\n    {\n        score++;\n    }\n}\n```\n\n\
    正如你预期的，score 值保持不变。为什么会这样？嗯，score 参数是按值传递的。也就是说，创建了变量的副本，方法对该副本进行操作。因此，对副本的更改不会影响原始变量。\n\
    \n- 提示：值类型按值传递。\n\n当我们检查调用栈时，可以看到这种行为，如图 23 所示。\n\n```csharp\nvar score = 30;\n\
    var c = new Counter();\nc.Increment(score);\n\nConsole.WriteLine($\"The score\
    \ is {score}\");\n\npublic class Counter\n{\n    public void Increment(int score)\n\
    \    {\n        score++;\n    }\n}\n```\n\n图 23：Increment 内部的 score 值\n\n当代码执行到达\
    \ **Increment** 方法并增加 **score** 参数时，该值变为 **31**。如图 24 所示，调用代码中发生了完全不同的故事。\n\n\
    ![](img/7b8ba6070e5beefbf599660730ba1d42_54_0.png)\n\n调用代码中的 score 变量值保持在 30。这是因为正如之前提到的，增加操作作用于该变量的副本。\n\
    \n为了改变这种行为，我们可以在参数和调用代码中添加 `ref` 关键字，如代码列表 37 所示。这允许我传递 score 变量的引用而不是 score 变量的值。\n\
    \n# 代码列表 37：使用引用参数的任意代码示例\n\n```csharp\nvar score = 30;\nvar c = new Counter();\n\
    c.Increment(ref score);\n\nConsole.WriteLine($\"The score is {score}\");\n\npublic\
    \ class Counter\n{\n    public void Increment(ref int score)\n    {\n        score++;\n\
    \    }\n}\n```\n\n你可能会想，这会对我们的变量产生什么影响。\n\n一旦变量被增加，我正在增加变量 **score** 的引用，而不是值本身。这意味着我们在\
    \ **Increment** 方法外部的调用代码中看到这种效果。\n\n"
