  md: '# Preview


    Preview releases are usually offered to developers for testing. This is done ahead
    of the final release, but they are not supported by Microsoft.


    # Go-live


    These releases are supported by Microsoft in production. Go-live releases are
    release candidate builds and are usually released just before the generally available
    (GA) releases.


    # Active support


    During this support period, updates are provided to improve functionality and
    mitigate any security vulnerabilities. When it comes to functional improvements,
    these could typically include fixes to resolve reported crashes, performance issues,
    bugs, and adding support for new hardware platforms or operating system versions.


    # Maintenance support


    At this stage, .NET releases are only updated to mitigate security vulnerabilities.
    The last six months of any release (LTS and STS) are considered the maintenance
    support period. Once the maintenance support period is over, the release is considered
    out of support.


    # End of life


    When a release reaches end of life, Microsoft no longer provides fixes or updates
    for the release. If you use .NET versions that have reached end of life, your
    software and your data are at risk.


    # What''s changed in .NET 8


    .NET 8 will be supported for three years due to its long-term support release.


    > Note: You can download .NET 8 here.


    This makes it worth your while to upgrade now. If you need a little more convincing,
    consider the following changes and improvements.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "# .NET runtime\n\nThere have been many improvements made to performance (reminiscent\
    \ of the .NET 7 release), garbage collection, the core and extension libraries.\
    \ I want to highlight just a few of them.\n\n# Garbage collection\n\nThe .NET\
    \ 8 release includes the capability to adjust the memory limit on the fly. In\
    \ cloud-service scenarios, demand can increase suddenly and then drop back down\
    \ again. The cost effectiveness of these services is measured in how well they\
    \ can scale up and down the resource consumption to meet the fluctuations on demand.\n\
    \nI would argue that scaling down is not as important as scaling up as demand\
    \ fluctuates. This means that when a decrease in demand is detected, a resource\
    \ can scale down by reducing its memory limit.\n\nBefore .NET 8, however, this\
    \ scaling down would fail because the garbage collector was not aware of any changes\
    \ and might allocate more memory than the new limit. By calling `GC.RefreshMemoryLimit()`,\
    \ you can update the garbage collector to the new limit.\n\nThere are, however,\
    \ limitations of which to take note:\n\n+   - On 32-bit platforms, a new hard\
    \ limit can't be established if there isn't already one.\n- `GC.RefreshMemoryLimit()`\
    \ might fail and return a non-zero status code. This happens because the scale-down\
    \ is considered too aggressive and does not leave enough memory for the garbage\
    \ collection to work with. In this case, calling `GC.Collect(2, GCMode.Aggressive)`\
    \ might solve the issue by shrinking the current memory usage, allowing you to\
    \ call `GC.RefreshMemoryLimit()`.\n- Scaling up the memory limit beyond what the\
    \ garbage collector believes the process can handle allows `GC.RefreshMemoryLimit()`\
    \ to succeed, but it will not use more memory than the garbage collector perceives\
    \ as the limit.\n\nThe following code in Code Listing 1 illustrates setting the\
    \ hard limit to 100 MiB (mibytes).\n\nCode Listing 1: Setting the Heap Hard Limit\n\
    \n```\ninternal class Program\n{\n    static void Main(string[] args)\n    {\n\
    \        AppContext.SetData(\"GCHeapHardLimit\", (ulong)100 * 1024 * 1024);\n\
    \        GC.RefreshMemoryLimit();\n    }\n}\n```"
  merge: -1
  pgno: 15
- img_proc: true
  md: "If this hard limit is invalid, the GC.RefreshMemoryLimit() will throw an InvalidOperationException.\
    \ An invalid hard limit can be, for example, when the hard limit will be set by\
    \ the refresh is lower than what's already committed.\n\n# Core .NET libraries\n\
    \nThere are many improvements and additions in the core .NET libraries. Some of\
    \ these improvements were made to the following features.\n\n# Serialization\n\
    \nA few serialization and deserialization improvements have been made to System.Text.Json\
    \ .NET 8. I will not discuss all of them, but here are some of the more interesting\
    \ improvements and additions.\n\n# Handling missing members\n\nOne of the features\
    \ that I am quite excited about is the ability to handle missing members deserialization.\n\
    \nUsually, if you receive a JSON payload, you deserialize this into a POCO (plain\
    \ old CLR object). If your JSON payload contains properties that are missing in\
    \ your POCO when you deserialize the JSON, they are just ignored.\n\n.NET 8 allows\
    \ you to specify that all members must exist in the payload; otherwise, a JsonException\
    \ will be thrown. Consider Code Listing 2.\n\n> Code Listing 2: Deserializing\
    \ POCO with Missing Property\n\n```\ninternal class Program\n{\n    static void\
    \ Main(string[] args)\n    {\n        var pers = JsonSerializer.Deserialize<Person>(\"\
    {\"Name\": \"John\", \"Age\": 44,\"YearOfBirth\": 1980}\\}\");\n        Console.WriteLine(pers?.Name);\n\
    \        Console.ReadLine();\n    }\n}\n\npublic class Person\n{\n    public string\
    \ Name { get; set; }\n    public int Age { get; set; }\n}\n```"
  merge: -1
  pgno: 16
- img_proc: true
  md: "Here, we are deserializing a JSON payload that includes a value for YearOfBirth\
    \ that the Person POCO Serializer does not contain.\n\n```\nvar pers = JsonSerializer.Deserialize<Person>(\"\
    {\"Name\": \"John\", \"Age\": 30, \"YearOfBirth\": 1980}\");\nConsole.WriteLine(pers?.Name);\n\
    Console.ReadLine();\n```\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_17_0.png)\n\
