    # # Chapter 3 More New .NET 8 Features


    We''re not done yet with the new features in .NET 8. There are a few more things
    we need to talk about that are more suited to a chapter of their own. Starting
    off this foray into what''s new, let us look at AOT.


    # ## AOT support


    You are now able to compile your code into native code using native AOT. This
    allows you to take C# and .NET code compile it to native code the same way C++,
    Rust, or Go would compile. This means no .NET dependency, no IL code, and no JIT,
    making for very fast start times that are very memory efficient.


    AOT stands for ahead-of-time and is the counterpart of JIT, which stands for just-in-time
    compilation.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_70_0.png)


    From the illustration in Figure 34, you can see how JIT and AOT differ. With AOT,
    we are generating the native code that runs on the target machine when we compile
    the application.'
- md: "\nWith the traditional JIT compiler, the C# code is turned into IL, which is\
    \ then transformed into native code by the JIT compiler on the target machine.\n\
    \nWith .NET 7, Native AOT targeted console-type applications, but with .NET 8,\
