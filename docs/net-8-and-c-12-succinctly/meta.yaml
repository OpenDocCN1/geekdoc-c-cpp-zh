  md: '# C# 12


    Most excitingly of all, C# 12 shipped with .NET 8. The following new features
    were included in C#12:


    +   - Primary constructors

    - Collection expressions

    - Ref readonly parameters

    - Default lambda parameters

    - Alias any type

    - Inline arrays

    - Experimental attribute

    - Interceptors


    We will have a closer look at these in the next chapter.


    # .NET Aspire


    You might have heard about .NET Aspire if you watched any of the dotnet conf or
    Build content online. .NET Aspire is available by including a collection of NuGet
    packages that handle specific cloud-native concerns. In presently, it is available
    with .NET 8. Microsoft describes .NET Aspire as an "opinionated" (which makes
    no sense to me, so I prefer "highly directly"), cloud-ready stack for building
    observable, production-ready, distributed applications.


    Simply put, if you are creating distributed applications, .NET Aspire will solve
    a lot of your pain points. The main problem with many distributed applications
    is that we want to have them talk to each other, both in the dev environment and
    when we deploy them. This is what .NET Aspire aims to solve.


    This book is too short to go into an in-depth explanation of .NET Aspire, which
    deserves a book on its own. If you want to learn more about .NET Aspire, head
    over to the .NET Aspire documentation.


    # In conclusion


    This chapter introduced us to some of the goodies in .NET 8, and there is a lot
    that I left out. There is ASP.NET Core with improvements to Blazor, SignalR, minimal
    APIs, Native AOT, Kestrel, authentication, and authorization. There is .NET MAUI,
    which includes new functionality for controls as well as performance enhancements.
    EF Core made improvements to complex type objects, collections of primitive types,
    raw SQL queries, tracked-entity access, and more. Windows Forms got some love,
    as well as Windows Presentation Foundation, which now has the ability to use hardware
    acceleration and also has a new OpenFolderDialog


    Buckle up and hold on your seat, for this train is just gaining traction. Next
    up, we will have a look at C# 12 and all the new features introduced.'
