    \ and take a look at the stockItem variable, as seen in Figure 12.\n\n```csharp\n\
    StockItem? stockItem = JsonSerializer.Deserialize<StockItem>(@\"{\"\"Code\"\"\
    : \"\"1234\"\", \"\"Pricing\"\":{\"\"MarkupPercentage\"\": 17, \"\"Quantity\"\"\
    : 7}}\");\nvar json = JsonSerializer.Serialize(stockItem);\n```\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_22_0.png)\n\
    \nFigure 12: The Read-Only Properties Have Been Set\n\nLooking at the result,\
    \ you will notice that the MarkupPercentage and Quantity values have been set\
    \ to what was contained in the JSON payload. I have to admit that I am not sure\
    \ why I like this behavior.\n\nYou can read more about initializing properties\
    \ here.\n\n# Time abstraction\n\nWith .NET 8, we get a new time class, System.TimeProvider,\
    \ and an ITimer interface, System.Threading.ITimer. Let's see how to use them\
    \ and how to test-dependent code. I have a service called TaskRunnerService that\
    \ simply returns the duration of the elapsed time, as seen in Code Listing 7.\n\
    \n> Code Listing 7: The TaskRunnerService Class\n\n```csharp\npublic class TaskRunnerService\n\
    {\n    private readonly TimeProvider _timeProvider;\n    public TaskRunnerService(TimeProvider\
