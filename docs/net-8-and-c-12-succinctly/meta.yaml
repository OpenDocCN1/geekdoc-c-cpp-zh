  md: '# Extension libraries


    .NET 8 has given love to extension libraries. You might have heard about keyed
    dependency injection (DI), where you use keys to register and retrieve DI services.
    Secondly, the IHostedLifecycleService has been extended to include additional
    methods to give you more options for execution. The System.Numerics.Tensors NuGet
    package has also been updated to include the TensorPrimitives namespace. Tensor
    primitives optimize data-intensive workloads in AI and machine learning.


    # Keyed DI services


    As you know, the DI service is a way to register and retrieve services from the
    dependency injection container. Now, with keyed dependency injection, you can
    do this with multiple services of the same type using a unique key for each. Some
    of the new APIs include the following:


    +   - The interface IKeyedServiceProvider, which you use for registration/resolution
    in the constructor.

    - The attribute ServiceKeyAttribute, to inject the key you need

    - The FromKeyedServicesAttribute, to specify which keyed service to use in the
    constructor parameter.

    - New extension methods for ICollection to support keyed services.

    - The ServiceProvider implementation of IKeyedServiceProvider.


    The easiest way to illustrate keyed dependency injection is through the use of
    minimal APIs. I admit that I haven''t found myself gravitating towards using minimal
    APIs on a regular basis, but for this explanation, they''re perfect.


    > Note: I have included the minimal API code illustrated in the project KeyedDemoMinimal,
    but I have also added this code to an API project called KeyedDemo that uses controllers.
    You can find all this code in the GitHub repository that comes with this book.


    The code in Figure 20 illustrates the use of keyed DI services. It might make
    a little more sense when viewed in a code editor, as the code is a little squished
    on the page. If you prefer controllers instead, there is sample code for that.


    The code contains an interface IGreeter is used to provide the contract for two
    services, FormalGreeterService and InformalGreeterService. I have two other services,
    called CustomerService and FriendsService.


    Adding the services to the DI container is done in the usual manner for the Customer
    and FriendsService, but for the FormalGreeterService and InformalGreeterService,
    I provide each with a key.


    These keys allow me to refer each service uniquely and provide API endpoints that
    make the appropriate service. You can see this in the api/GreetFriendSpecific
    and api/GreetCustomerSpecific endpoints.'
