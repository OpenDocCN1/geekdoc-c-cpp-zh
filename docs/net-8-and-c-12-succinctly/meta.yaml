    \ body)\n    => !ModelState.IsValid ? BadRequest(ModelState) : Ok(body);\n\n \
    \   [HttpPost(\"base64demo\")]\n    public IActionResult Base64Demo([FromBody]\
    \ Base64ExampleModel body)\n    => !ModelState.IsValid ? BadRequest(ModelState)\
    \ : Ok(body);\n}\n```\n\nCode Listing 67 shows the code to test the various endpoints.\
    \ The code in the .http file will all validate successfully. If you run the project\
    \ and call these endpoints, you will receive an Ok result.\n\n# Code Listing 67:\
    \ The .http File\n\n```\n@DataAnnotationsDemo_HostAddress = http://localhost:5053\n\
    \nPOST { {DataAnnotationsDemo_HostAddress}}/demo/rangedemo\nContent-Type: application/json\n\
    {\n```"
  merge: -1
  pgno: 89
- img_proc: true
  md: "```\n{\n  \"threshold\": 50\n}\n\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/lengthdemo\n\
    Content-Type: application/json\n{\n  \"testresults\": [\n  2,\n  5,\n  7\n  ]\n\
    }\n```\n\n```\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/allowedvaluesdemo\n\
    Content-Type: application/json\n{\n  \"countryiso\": \"USA\"\n}\n```\n\n```\n\
    ###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/deniedvaluesdemo\nContent-Type:\
    \ application/json\n{\n  \"countryiso\": \"USA\"\n}\n```\n\n```\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/base64demo\n\
    Content-Type: application/json\n{\n  \"systeminput\": \"rtdfghjuytrfvcxs8796\"\
    \n}\n```\n\n# Range attribute with minimum and maximum exclusive\n\nThe Range\
    \ attribute now allows you to set exclusive bounds on the range being validated.\
    \ From the code in Code Listing 68, you will see that I have a range of 20 to\
    \ 80 set with the MinimumIsExclusive and MaximumExclusive set to true."
  merge: -1
  pgno: 90
- img_proc: true
  md: "What this means is that I do not want to accept 20 as the lower value in the\
    \ range, and I do not want to accept 80 as my upper value. The valid values are,\
    \ therefore, any values between 20 and 80, excluding 20 and 80.\n\nThis is why\
    \ \"threshold\": 50 will validate, while \"threshold\": 20 } and any value lower,\
    \ as well as \"threshold\": 80 } and any value higher, will fail validation.\n\
    \nIf you wanted to exclude 20 but exclude 80, you would set MinimumIsExclusive\
    \ = false keeping MaximumIsExclusive unchanged.\n\n# Code Listing 68: Range Attribute\
    \ with Minimum and Maximum Validation\n\n```\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace DataAnnotationsDemo.Models;\n\npublic class RangeExampleModel\n{\n\
    \    [Range(20, 80, MinimumIsExclusive = true, MaximumIsExclusive = true)]\n \
    \   public int Threshold { get; set; }\n}\n```\n\nSimple and effective. I'm not\
    \ sure how much this will get, but it is nice to have the option to include or\
    \ exclude the lower or upper bounds of the range values.\n\n# Length attribute\n\
    \nKeeping in the same vein when it comes to validation attributes, we now have\
    \ a Length attribute, as seen in Code Listing 69.\n\n# Code Listing 69: Length\
    \ Validation Attribute\n\n```\nusing System.ComponentModel.DataAnnotations;\n\n\
    namespace DataAnnotationsDemo.Models;\n\npublic class LengthExampleModel\n{\n\
    \    [Length(1, 3)]\n    public ICollection<int> TestResults { get; set; } = Array.Empty<int>();\n\
    }\n```"
  merge: -1
  pgno: 91
- img_proc: true
  md: "Here I want to validate the length of my collection of test results. I no longer\
    \ need to chain\nMinLength and MaxLength, for example [MinLength(1), MaxLength(3)],\
    \ to make this work.\nI can now simply state [Length(1, 3)] and be done with it.\
    \ Also note that the parameters for\nthe Length(a, b) attribute are always inclusive.\n\
    \n# AllowedValues attribute\n\nAs seen in Code Listing 70, you've given it, we\
    \ have the AllowedValues attribute. This\nallows you to be explicit with which\
    \ values you will allow.\n\nCode Listing 70: AllowedValues Attribute\n\n```\n\
    using System.ComponentModel.DataAnnotations;\n\nnamespace DataAnnotationsDemo.Models;\n\
    \npublic class AllowedValuesExampleModel\n{\n    [AllowedValues(\"USA\", \"GBR\"\
    , \"ZAF\")]\n    public string countryISO { get; set; } = string.Empty;\n}\n```\n\
    \nThis means the API will only accept the following values:\n\n+   - { \"countryiso\"\
    : \"USA\" }\n- { \"countryiso\": \"GBR\" }\n- { \"countryiso\": \"ZAF\" }\n\n\
    Anything else will fail validation, for example, passing ZAR instead of ZAF. ZAR\
    \ is the currency\ncode for South Africa, where ZAF is the ISO country code.\n\
    \n# DeniedValues attribute\n\nGoing hand-in-hand with AllowedValues is the DeniedValues\
    \ attribute. As seen in Code\nListing 71, you can be as explicit with values that\
    \ you do not want to allow.\n\nCode Listing 71: DeniedValues Attribute\n\n```\n\
    using System.ComponentModel.DataAnnotations;\n\nnamespace DataAnnotationsDemo.Models;\n\
    \npublic class DeniedValuesExampleModel\n{\n    [DeniedValues(\"US\", \"ZAR\"\
    )]\n}\n```"
  merge: -1
  pgno: 92
- img_proc: true
  md: "```\npublic string CountryISO { get; set; } = string.Empty;\n}\n```\n\nThis\
    \ is handy for a variety of applications. In this example, { \"countryiso\": \"\
    US\" } and { \"countryiso\": \"ZAR\" } will fail validation. Everything else is\
    \ permitted.\n\n# Base64String attribute\n\nThe last validation attribute is the\
    \ Base64String attribute. This validates that the string passed is a valid Base64\
    \ representation.\n\nCode Listing 72: Base64 Validation Attribute\n\n```\nusing\
    \ System.ComponentModel.DataAnnotations;\nnamespace DataAnnotationsDemo.Models;\n\
    public class Base64ExampleModel\n{\n    [Base64String]\n    public string SystemInput\
    \ { get; set; } = string.Empty;\n}\n```\n\nA point to note here is that this does\
    \ not determine if a string is a valid Base64 string that can be decoded into\
    \ something. In other words, if we decode QSvbG8gd29ybQG, we will get Hello world.\
    \ If, however, we try to decode rtdghuyrtfvc8576, it will decode to gibberish.\n\
    \nAll that the Base64String attribute does is check that the strings contain valid\
    \ Base64 characters (A-Z, a-z, 0-9, +,/=).\n\n# In conclusion\n\n.NET 8 brings\
    \ with it so many new features and enhancements, it's difficult to collect them\
    \ all in a single book. We haven't started looking in depth at the performance\
    \ improvements in .NET 8. That alone is significant.\n\nIf you want to read more\
    \ about the topic of performance, we have a look at this article by Stephen Toub.\n\
    \nWith the advent of AI and the expectation of AGI soon afterwards, you might\
    \ be wondering if your profession is in danger. I take solace in the fact that\
    \ AI currently needs specific instructions in order to deliver the best results."
  merge: -1
  pgno: 93
- img_proc: true
  md: 'As developers, we all know that walking on water and developing an application
    perfectly from a customer''s specification is possible if both are frozen. While
    this might be true for now, with AI serving as a supplementary assistant to humans,
    this dynamic may soon change.


    We need to remember that AI is but a machine capable of extrapolating the most
    likely answer based on terabytes of data (or gorged on if you like) during its
    training. LLMs spend eye-watering amounts of money on training and running the
    hardware to make these machines work. But the human mind, which is capable of
    feelings, emotions, and opinions, derives answers to problems elegantly with relatively
    little information.


    Now, I am not doomsayer at all, I too, have to use AI in my daily life. I also
    have a Copilot subscription, but I was surprised when I watched the interview
    between Microsoft''s Satya Nadella and Joanna Stern for The Street Journal. Satya
    Nadella mentioned Copilot+ PCs. These PCs will contain NPUs that will drive AI
    features on device.


    This Copilot+ PCs have a feature Recall that will allow users to search over their
    entire history. It will do this by continually taking screenshots of your desktop
    and then using generative AI and the NPU to process this data and make it searchable
    on your device.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_94_0.png)


    > Note: Recall can be restricted from specific websites or apps and always lives
    on your machine locally. Therefore, the promise is that it can be. Whether this
    will materialize with customers is a different story altogether.


    Artificial intelligence, waits and all, can also significantly benefit humanity.
    DeepMind AI set to solve an impossible problem in biology, the protein problem.
    3D mapping of a single protein, the building blocks of life, could take years
    to complete. What DeepMind did was an AI that could solve the protein problem
    in a fraction of the time.


    They then set it loose on the 200 million proteins that are known to science.
    Using traditional methods, according to DeepMind CEO Demis Hassabis, this would
    have taken a billion years to solve them. DeepMind took only a year, after they
    made their protein database public as a gift to humanity.


    While we need resign ourselves to the fact that AI is here to stay, we as a species
    have something that no will ever have. This is the thirst for, and attainment
    of, knowledge. The very fact that you are reading this is a testament to pursuit
    of knowledge, driven by an innate desire to learn.


    While it is true that AI may assist us, challenge our beliefs, and even change
    how we humans live and work, it will never and never replace our quest for knowledge.
    As we write these final lines, I am encouraged that our journey of learning is
    from over: there will be a .NET 9, and a .NET 10, and so on.


    Our future is bright—not because of the tools we use or the solutions we create,
    but because of the minds that wield them. The human spirit''s quest for knowledge
    is infinitely and profoundly human.


    Therefore, dear reader, thank you for reading this book and allowing me to learn
    alongside you.'
  merge: -1
  pgno: 94
