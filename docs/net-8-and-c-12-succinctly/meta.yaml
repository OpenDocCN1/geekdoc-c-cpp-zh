  md: '# # The History of .NET


    ![](img/7b8ba6070e5beefbf599660730ba1d42_11_0.png)


    # ### 2020 - .NET 5.0


    The WHO declares the COVID-19 outbreak a pandemic. C# 9.0 is released with .NET
    5.0 and includes new features such as records, init-only properties, top-level
    statements, and with-expressions.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_11_1.png)


    # ### 2021 - .NET 6.0


    In April, NASA''s Ingenuity helicopter performs the first powered flight on another
    planet. In November, .NET 6.0 is released with C# 10, bringing improvements to
    lambda expressions, record structs, global using directives, file-scoped namespace
    declarations, and more.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_11_2.png)


    # ### 2022 - .NET 7


    Elon Musk reaches an agreement to buy Twitter for $44 billion, rebranding it to
    X. C# 11 and .NET 7 are released, bringing list patterns, generic attributes,
    required members, generic math support, and more to developers. In November, OpenAI
    launches ChatGPT.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_11_3.png)


    # ### 2023 - .NET 8


    OpenAI launches ChatGPT Plus and changes computing as we know it. Soon, Visual
    Studio includes Copilot and empowers developers to become more productive. C#
    12 and .NET 8 are released in November, delivering features such as interceptors
    and inline arrays.


    Figure 5: .NET 2020 to 2023'
  merge: -1
