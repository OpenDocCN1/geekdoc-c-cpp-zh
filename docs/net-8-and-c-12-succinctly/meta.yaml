- md: '

    ## Chapter 1 Introducing .NET 8


    Microsoft began working on .NET in 1998, and it has since evolved into a tour
    de force among developers worldwide. From its birth in 2002, .NET has advanced
    to keep up with the changing demands of the IT landscape, much like biological
    species evolve to adapt to their surroundings. Introduced as the .NET Framework,
    it offered a rich set of libraries and tools, becoming popular with an army of
    software developers globally.


    In 2016, entering the .NET Core era, Microsoft announced the open-source, cross-platform
    implementation of the .NET Framework, refactored and renamed .NET Core. For us
    old enough to remember the first incarnations of the .NET Framework, the idea
    of .NET Core seemed almost magical. Enabling developers to build and run apps
    on Windows, macOS, and Linux, .NET quickly gained adoption in the industry.


    | 2016 - 2018 | 2019 | Nov 2020 | Nov 2021 | Nov 2022 |

    | :--- | :--- | :--- | :--- | :--- |

    | .NET Core | .NET Core 3.1 LTS | .NET 5.0 | .NET 6.0 | .NET 7.0 |

    | 1.0–1.1–2.0–2.1–2 | Support until Dec 2022 | Out of support | LTS until Dec
    2024 | STS release |


    Microsoft finally unified the .NET ecosystem with the release of .NET 5 in 2020.
    Looking at Figure 1, you will notice that there seems to be a jump between .NET
    Core 3.1 and .NET 5. Version 4 was skipped to avoid confusion with the .NET Framework
    versions. Microsoft touted .NET 5.0 as a single, unified platform that would replace
    .NET Core, Xamarin, and the .NET Framework.


    .NET Core 1.0 was released in 2016 and heralded the start of what we now today
    as .NET 8. Before this release, developers were accustomed to the .NET Framework,
    released in the early 2000s. It was closed-source and only ran on Windows. .NET
    Core was the first .NET version to run across platforms and is an open-source
    project.


    .NET Core saw many releases between 2016 and 2018, culminating in release of .NET
    Core 3.1 in 2019. .NET Core 3.1 was a long-term support version, with support
    for it ending in 2022.


    Many companies developed software on .NET Core 3.1 due to its long-term support
    status. It was, therefore, a very popular version of .NET Core. Then, in 2020,
    Microsoft surprised us with the release of .NET 5.0. Support for .NET 5.0 ended
    in May 2022.


    ## The History of .NET


    | 2002 - .NET Framework 1.0 |

    | :--- |

    | The Euro (coins and banknotes) is introduced as a currency in 12 European countries.
    The .NET Framework 1.0 and C# 1.0 are released. |


    YouTube is launched in February, transforming the media landscape forever. Later
    that year, the .NET Framework 2.0 and C# 2.0 are released that included features
    such as partial classes, nullable types, anonymous methods, iterators, generics,
    private setters in properties, and static classes.


    | 2006 - .NET Framework 3.0 |

    | :--- |

    | Twitter is launched in March, allowing people to connect with each other on
    a different level. November sees the release of the .NET Framework 3.0 and C#
    3.0 that includes WPF, WCF, and Windows CardSpace. |


    | 2007 - .NET Framework 3.5 |

    | :--- |

    | In June, Apple releases the iPhone and Microsoft releases the .NET Framework
    3.5 later that year. The most notable feature is LINQ, adding native data querying
    capabilities to the .NET languages. |


    Figure 2: .NET 2002 to 2007


    ### 2010 - .NET Framework 4.0


    South Africa hosts the FIFA World Cup, the first time this tournament is held
    on the African continent. The .NET Framework 4.0 and C# 4.0 are released, providing
    performance improvements, statement lambdas, and named/optional parameters.


    ### 2012 - .NET Framework 4.5


    Curiosity lands in Gale crater on Mars with the objective of determining if Mars
    ever supported life. The .NET Framework 4.5 and C# 5.0 are released two months
    later, adding async features and caller information, among other improvements.


    ### 2015 - .NET Framework 4.6


    Microsoft releases Windows 10 and the .NET Framework 4.6 in July. The new .NET
    Framework and C# 6.0 allow for the addition of expression-bodied methods, nameof
    expressions, primary constructors, string interpolation, and other features.


    ### 2016 - .NET Core 1.0


    The Summer Olympics are held in Rio De Janeiro, Brazil, the first time they are
    held in South America. Microsoft releases .NET Core 1.0, a new open-source, cross-platform
    .NET product allowing flexible deployment in your app or installed side by side,
    user or machine-wide.


    Figure 3: .NET 2010 to 2016


    ### 2017 - .NET Framework 4.7


    Nintendo releases the Switch worldwide, competing with the Xbox One and PlayStation
    4. Microsoft releases the .NET Framework 4.7 as part of the Windows 10 Creators
    Update. The .NET Framework docs become available on docs.microsoft.com.


    ### 2017 - .NET Core 2.0


    In August, .NET Core 2.0 and C# 7.0 are released, featuring out, tuples, discards,
    pattern matching, local functions, and throw expressions to name but a few.


    ### 2019 - .NET Framework 4.8


    Scientists reveal the first ever image of a black hole. Microsoft releases .NET
    Framework 4.8 with improvements to JIT and NGEN, BCL, WinForms, WCF, and WPF.


    ### 2019 - .NET Core 3.0


    In September, .NET Core 3.0 is released with C# 8.0, providing new features such
    as nullable reference types, using declarations, static local functions, and more.


    Figure 4: .NET 2017 to 2019


    ### 2020 - .NET 5.0


    The Euro (coins and banknotes) is introduced as a currency in 12 European countries.
    The .NET Framework 1.0 and C# 1.0 are released. (Wait, correcting OCR flow based
    on context)

    The COVID-19 pandemic begins globally. .NET 5.0 is released, providing a single,
    unified platform that would replace .NET Core, Xamarin, and the .NET Framework.


    ### 2021 - .NET 6.0


    The Tokyo Olympics are held after delay. .NET 6.0 is released, as a long-term
    support version. C# 10 introduces features such as records, global usings, and
    file-scoped namespaces.


    ### 2022 - .NET 7


    Russia invades Ukraine. .NET 7 is released as a standard release (STS). C# 11
    introduces features such as lambda patterns and required-only members.


    ### 2023 - .NET 8


    James Webb Space Telescope releases images. .NET 8 is released as a long-term
    support version. C# 12 introduces features such as primary constructors and raw
    strings.


    Figure 5: .NET 2020 to 2023

    '
  mdcn: '


    ## 第 1 章 介绍 .NET 8


    微软于 1998 年开始开发 .NET，从那时起已成为全球开发者中的杰出之作。从 2002 年诞生以来，.NET 不断进步以适应 IT 领域不断的需求，就像生物物种为了适应环境而进化一样。它最初以
    .NET Framework 的形式引入，提供了一系列丰富的库和工具，深受全球软件开发者的青睐。


    2016 年，进入 .NET Core 时代，微软宣布了 .NET Framework 的开源跨平台实现，并对其进行了重构和重命名为 .NET Core。对于我们这些还记得
    .NET Framework 早期版本的人来说，.NET Core 的想法似乎几乎是魔法般的。它允许开发者在 Windows、macOS 和 Linux 上构建并运行应用程序，.NET
    迅速在行业内获得采用。


    | 2016 - 2018 | 2019 | 2020年11月 | 2021年11月 | 2022年11月 |

    | :--- | :--- | :--- | :--- | :--- |

    | .NET Core | .NET Core 3.1 LTS | .NET 5.0 | .NET 6.0 | .NET 7.0 |

    | 1.0–1.1–2.0–2.1–2 | 支持到2022年12月 | 已停止支持 | LTS 支持到2024年12月 | STS 版本 |


    微软最终通过 2020 年发布 .NET 5 统一了 .NET 生态系统。观察图 1，你会发现 .NET Core 3.1 和 .NET 5 之间似乎有一个跳跃。跳过了版本
    4，以避免与 .NET Framework 版本产生混淆。微软将 .NET 5.0 誉为一个单一的统一平台，将取代 .NET Core、Xamarin 和
    .NET Framework。


    .NET Core 1.0 于 2016 年发布，预标志着我们现在所说的 .NET 8 时代的开始。在此发布之前，开发者们习惯了 2000 年代初发布的 .NET
    Framework。它是闭源的且仅在 Windows 上运行。.NET Core 是第一个跨平台运行的 .NET 版本，并且开源项目。


    .NET Core 在 2016 年到 2018 年间经历了多次发布，并在 2019 年发布 .NET Core 3.1 时达到顶点。.NET Core 3.1
    是一个长期支持版本，其支持于 2022 年结束。


    由于其长期支持状态，许多公司在 .NET Core 3.1 上开发软件。因此，它是一个非常流行的 .NET Core 版本。然后在 2020 年，微软发布的
    .NET 5.0 让我们大了一惊。.NET 5.0 的支持于 2022 年 5 月结束。


    ## .NET 的历史


    | 2002 - .NET Framework 1.0 |

    | :--- |

    | 欧元（硬币和纸币）作为货币引入 12 个欧洲国家。.NET Framework 1.0 和 C# 1.0 发布。 |


    YouTube 于 2 月上线，永远改变了媒体格局。同年晚些时候，发布了 .NET Framework 2.0 和 C# 2.0，包含了部分类、可空类型、匿名方法、迭代器、泛型、属性中的私有设置器和静态类等功能。


    | 2006 - .NET Framework 3.0 |

    | :--- |

