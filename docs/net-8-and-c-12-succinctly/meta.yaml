    # Chapter 2 A Closer Look at C#


    C# 12 has brought with it a host of new features. With the pace at which C# is
    progressing, it remains a challenge for developers to stay up to date. The new
    features of C# 12 include:


    +   * Primary constructors

    * Collection expressions

    * Ref readonly parameters

    * Default Lambda parameters

    * Alias any type

    * Inline arrays

    * Experimental attribute

    * Interceptors


    While developers might feel the pressure of staying up to date with everything
    that is new with every release of .NET and C#, I have come to a different conclusion.
    Instead of seeing it as a five-course meal that needs to be worked through in
    a single sitting, I am approaching all these new features in each release like
    a buffet table.


    A smorgabord of C# and .NET features presented as a grand spread, meticulously
    prepared by Microsoft to satisfy the eclectic cravings of the most discerning
    code connoisseurs.


    “Yes, thank you very much,” I murmur as I slowly pace the buffet with my dinner
    plate, perusing as all that is on display.


    As I saunter along the buffet table (taking not to walk too far), my plate ready
    for the taking, I whisper to myself: “A little bit of record structs, a dash of
    global using directives, a slice of file-scoped namespaces, topped with some file-scoped
    types... Ooh, primary constructors and collection expressions, haven''t tried
    you!


    I scoop just enough onto my plate so that I don''t look greedy. You see, the trick
    to navigating any buffet table is to put something on the plate, but also to put
    surreptitiously into your mouth (from the plate, not directly from the table)
    while standing at the table. This, way you get to taste more while only returning
    to your table with the flurry of new features with every release of .NET.


    You don''t have to implement every new feature in every release of .NET in your
    project you create. What you do de, however, is peruse the buffet table. You must
    walk up to it, pick something here, something there, and return to your table
    with a manageable plate of food. While this metaphor does well to illustrate how
    I can grow my skills as a developer, and while life imitates, grow as a buffet
    table producer, it does not account for the challenges developers face in the
    real world. Trying to grow as a developer while managing a healthy work-life balance
    is challenging when you try to do it all at once. But it starts with showing up
    and picking (little) bite-sized nibbles.


    As Carl Orff''s "O Fortuna" from Carmina Burana starts playing in our minds, the
    waiters, ready with the champagne, join me as we walk to the buffet table to see
    what''s on display.'
- md: "\n# Primary constructors\n\nI'm not convinced I like primary constructors.\
    \ My mind isn't yet made up. In fact, it feels like it goes against my flow of\
    \ writing code. Let me show you what I mean.\n\nCode List 29 illustrates a weather\
    \ service that generates totally random weather conditions for random locations\
    \ every time you call it.\n\nCode Listing: 29 The LyingWeatherController\n\n```csharp\n\
    using Microsoft.AspNetCore.Mvc;\nusing PrimaryConstructorsDemo.Services;\n\nnamespace\
    \ PrimaryConstructorsDemo.Controllers;\n\n[ApiController]\n[Route(\"controller\"\
    )]\npublic class LyingWeatherController : ControllerBase\n{\n    private readonly\
    \ IRandomCityService _randomCityService;\n    private readonly IRandomSummaryService\
    \ _randomSummaryService;\n\n    public LyingWeatherController(IRandomCityService\
    \ randomCityService, IRandomSummaryService randomSummaryService)\n    {\n    \
    \    _randomCityService = randomCityService;\n        _randomSummaryService =\
    \ randomSummaryService;\n    }\n\n    [HttpGet(Name = \"GetWeatherForecast\")]\n\
    \    public IEnumerable<WeatherForecast> Get()\n    {\n        return Enumerable.Range(1,\
    \ 5).Select(index => new WeatherForecast\n        {\n            Name = _randomCityService.GetRandomCity(),\n\
    \            Date = DateTimeOnly.Now.AddDays(index),\n            Temperature\
    \ = Random.Shared.Next(-20, 55),\n            Summary = _randomSummaryService.GetRandomSummary()\n\
    \        })\n        .ToArray();\n    }\n}\n```\n\nIt happens to be about 1 percent\
    \ of the time. Nevertheless, I like this method of creating classes. I have to\
    \ inject some services, I set those to private fields, and I use the services\
    \ in my class. End of story.\n\nLet's take a look at the same class using primary\
    \ constructors. The parameters on the constructor are moved up to the class level.\
    \ Now I can remove my constructor totally, as well as the private fields, and\
    \ use the injected services in my code.\n\n# Code Listing 30: Using Primary Constructors\n\
    \n```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing PrimaryConstructorsDemo.Services;\n\
    \nnamespace PrimaryConstructorsDemo.Controllers\n{\n    [ApiController]\n    [Route(\"\
    /controller\")]\n    public class LyingForecastController(IRandomCityService randomCityService,\
    \ IRandomSummaryService randomSummaryService)\n    {\n        [HttpGet(\"GetWeatherForecast\"\
    )]\n        public IEnumerable<WeatherForecast> Get()\n        {\n           \
    \ return Enumerable.Range(1, 5).Select(index => new WeatherForecast\n        \
    \    {\n                Name = randomCityService.GetRandomCity(),\n          \
    \      Date = DateOnly.FromDateTime(DateTime.Now.AddDays(index)),\n          \
    \      Temperature = Random.Shared.Next(-20, 55),\n                Summary = randomSummaryService.GetRandomSummary()\n\
    \            })\n            .ToArray();\n        }\n    }\n}\n```\n\nThis resulting\
    \ code takes some getting used to, that's for.\n\n# What the compiler sees\n\n\
    Let's simplify the code and see what the lowered C# looks like. Code Listing 31\
    \ illustrates a simplified LyingWeatherForecast class.\n\n# Code Listing 31: The\
    \ Simplified Class\n\n```csharp\npublic class LyingWeatherForecastController(IRandomCityService\
    \ randomCityService, IRandomSummaryService randomSummaryService) : IWidgetController\n\
    {\n    public string GetSomeWeatherData()\n    {\n        var city = randomCityService.GetRandomCity();\n\
    \        var summary = randomSummaryService.GetRandomSummary();\n        return\
    \ $\"It is {summary}\";\n    }\n}\n```\n\nHave a look what the lowered C# code\
    \ looks like Code Listing 32. Notice that the private fields for IRandomCityService\
    \ and IRandomSummaryService are not readonly.\n\n# Code Listing 32: The Lowered\
    \ C# Code\n\n```csharp\npublic class LyingWeatherForecastController : IWidgetController\n\
    {\n    [CompilerGenerated]\n    [Browsable(DebuggerBrowsableState.Never)]\n  \
    \  private IRandomCityService <randomCityService>P;\n\n    [CompilerGenerated]\n\
    \    [Browsable(DebuggerBrowsableState.Never)]\n    private IRandomSummaryService\
    \ <randomSummaryService>P;\n\n    public LyingWeatherForecastController(IRandomCityService\
    \ randomCityService, IRandomSummaryService randomSummaryService)\n    {\n    \
    \    <randomCityService>P = randomCityService;\n        <randomSummaryService>P\
    \ = randomSummaryService;\n        base.ctor();\n    }\n\n    public string GetSomeWeatherData()\n\
    \    {\n        string city = <randomCityService>P.GetRandomCity();\n        string\
    \ summary = <randomSummaryService>P.GetRandomSummary();\n        return string.Concat(\"\
    It is \", summary, \" in \", city);\n    }\n}\n```\n\nIt is, therefore, possible\
    \ to change the value of these fields from inside the class—so watch out for that\
    \ little pitfall.\n\n# Collection expressions\n\nI have to say that I like collection\
    \ expressions. In my opinion, it weeds out a little bit of the unnecessary fluff.\
    \ Of course, the argument can be made that it's not as expressive, but here we\
    \ are. Let's look at an example.\n\nCode Listing 33: A Simple Array\n\n```csharp\n\
    int[] scores = new int[] { 97, 92, 81, 60 };\n```\n\nAs seen in Code Listing 33,\
    \ we have a standard array of integers. Visual Studio, however, will suggest a\
    \ quick action to use collection expressions, as seen in Figure 22.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_51_0.png)\n\
    \nFigure 22: Refactoring Quick Action\n\nYou can see the resulting code in Code\
    \ Listing 34.\n\nCode Listing 34: The Collection Expression\n\n```csharp\nint[]\
    \ scores = [97, 92, 81, 60];\n```\n\nJust also note that you cannot use var with\
    \ collection expressions, as then there is no target type. Collection expressions\
    \ also apply to Span<T>, as seen in Code Listing 35.\n\nCode Listing 35: Span\
    \ Collection Expression\n\n```csharp\nSpan<int> foo = ['a', 'b', 'c'];\n```\n\n\
    Collection expressions may appeal to some developers but not to others. With C#,\
    \ you have the option to use collection expressions if you choose to to.\n\n#\
    \ Ref readonly parameters\n\nRef readonly parameters are now a thing in C# 12.\
    \ Consider the code in Code Listing 36. This simply passes a score to the Increment\
    \ method of the Counter class and then prints out the score.\n\nCode Listing 36:\
    \ Arbitrary Code Example\n\n```csharp\nvar score = 30;\nvar c = new Counter();\n\
    c.Increment(score);\n\nConsole.WriteLine($\"The score is {score}\");\n\npublic\
    \ class Counter\n{\n    public void Increment(int score)\n    {\n        score++;\n\
    \    }\n}\n```\n\nAs you would expect, the value of score remains unchanged. Why\
    \ is this the case? Well, the score parameter is passed by value. In other words,\
    \ a copy of the variable is made, and the method acts on this copy. Therefore,\
    \ changes to this copy inside the method will not affect the original variable.\n\
    \n- Tip: Value types are copied by default.\n\nWe can see this behavior when we\
    \ inspect the call stack, as seen in Figure 23.\n\n```csharp\nvar score = 30;\n\
    var c = new Counter();\nc.Increment(score);\n\nConsole.WriteLine($\"The score\
    \ is {score}\");\n\npublic class Counter\n{\n    public void Increment(int score)\n\
    \    {\n        score++;\n    }\n}\n```\n\nFigure 23: Value of score Variable\
    \ Inside Increment\n\nWhen the code execution reaches the **Increment** method\
    \ and increments the **score** parameter, the value changes to **31**. As seen\
    \ in Figure 24, a whole different story is play in the calling code.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_54_0.png)\n\
    \nThe score variable's value in the calling code remains unchanged at 30. This\
    \ is because, as mentioned previously, the increment acted on a copy of this variable.\n\
    \nIn order to change this behavior, we can add the ref keyword to the parameter\
    \ and the calling code, as seen in Code Listing 37. This allows me to pass down\
    \ the reference to the score variable instead of the value of the score variable.\n\
    \n# Code Listing 37: Arbitrary Code Example Using Ref readonly Parameters\n\n\
    ```csharp\nvar score = 30;\nvar c = new Counter();\nc.Increment(ref score);\n\n\
    Console.WriteLine($\"The score is {score}\");\n\npublic class Counter\n{\n   \
    \ public void Increment(ref int score)\n    {\n        score++;\n    }\n}\n```\n\
    \nWhat does this do to our variable, you might wonder.\n\nAs soon as the variable\
    \ is incremented, I am increasing the reference of the variable **score**, not\
    \ the value itself. This means that we will see this effect outside the **Increment**\
    \ method in the calling code.\n"
  mdcn: "\n\n# 主构造函数\n\n我不确定自己是否喜欢主构造函数。我还没有下定论。事实上，它感觉它似乎违背了我的代码编写习惯。让我向你展示我的意思。\n\
    \n代码列表 29 展示了一个天气服务，每当你调用它时，它都会为随机位置生成完全随机的天气状况。\n\n代码列表：29 谎谎的天气控制器\n\n```csharp\n\
    using Microsoft.AspNetCore.Mvc;\nusing PrimaryConstructorsDemo.Services;\n\nnamespace\
    \ PrimaryConstructorsDemo.Controllers;\n\n[ApiController]\n[Route(\"controller\"\
    )]\npublic class LyingWeatherController : ControllerBase\n{\n    private readonly\
    \ IRandomCityService _randomCityService;\n    private readonly IRandomSummaryService\
