- md: "\nPersonally, I dislike the #pragma warning directive in code, it provides\
    \ a lot of visibility and expressiveness in the fact that you are suppressing\
    \ a compiler warning. I would rather use the #pragma warning directive (even though\
    \ I dislike it) as opposed to the <NoWarn> property in the csproj file. I feel\
    \ that it is too hidden away in the csproj file.\n\nThere is an Afrikaans saying\
    \ \"Stille waters, diepe grond, onder draai die wiel,\" which translates to \"\
    Still waters run deep, and that is where the devil lurks.\"\n\nThe devil in this\
    \ detail is the <NoWarn> property in the csproj file suppressing a warning in\
    \ the code editor that you spend most of your time in. If I have suppressed a\
    \ warning, I want to know about it—and more importantly, I want other developers\
    \ who contribute to my code to know about it, too.\n\n# Interceptors\n\nOne of\
    \ the most exciting and fun features in C# 12 has to be interceptors. Microsoft\
    \ warns that interceptors are experimental and only available in preview mode\
    \ with C# 12, and that this feature may be subject to breaking changes or removal\
    \ in a future release.\n\nIt goes without saying that you are not encouraged to\
    \ use this in production. There, I've said it. With out of the way, let's get\
    \ it over with.\n\nYou will see in Code Listing 46 that I have a class called\
    \ ArraySorter with a horribly inefficient Sort method.\n\n> Tip: Do not use this\
    \ Sort method in your code... ever.\n\nThis is basically a bubble sort, but it\
    \ is not high-performance when having to sort large arrays.\n\n```\nnamespace\
    \ InterceptorDemo;\n\npublic class ArraySorter\n{\n    public void Sort(int[]\
    \ array)\n    {\n        Console.WriteLine($\"Sorting array using Bubble Sort\
    \ to sort {array.Length} elements\");\n\n        bool swapped;\n        do\n \
    \       {\n            swapped = false;\n            for (int i = 0; i < array.Length\
    \ - 1; i++)\n            {\n```\n\n```\nif (array[i] > array[i + 1])\n{\n    int\
    \ temp = array[i + 1];\n    array[i + 1] = array[i];\n    array[i] = temp;\n \
    \   swapped = true;\n}\n} while (swapped);\n```\n\nIn my Program.cs file, seen\
    \ in Code Listing 47, I am creating an array of random integers.\n\n# Code Listing\
    \ 47: The Program.cs Class\n\n```\nusing System.Diagnostics;\nusing InterceptorDemo;\n\
    ```\n\n```\nvar random = new Random();\nvar largeArray = Enumerable.Range(0, 50000).Select(x\
    \ =>\nrandom.Next()).ToArray();\n```\n\n```\nvar sorter = new ArraySorter();\n\
    ```\n\n```\nvar stopwatch = Stopwatch.StartNew();\n```\n\n```\nsorter.Sort(largeArray);\n\
    ```\n\n```\nstopwatch.Stop();\n```\n\n```\nConsole.WriteLine(\"Time taken: {stopwatch.ElapsedMilliseconds}\
    \ ms\");\nConsole.ReadLine();\n```\n\nI then instantiate my ArraySorter class\
    \ and call the Sort method, passing it the largeArray variable.\n\n```\nC:\\repos\\\
    auth-sync-2024-03\nSorting array using Bubble Sort to sort 50000 elements\nTime\
    \ taken: 6747 ms\n```\n\nFigure 31: The Bubble Sort Results\n\nThe results of\
    \ the current Sort method are displayed in Figure 31.\n\n> **Tip: Do not increase\
    \ the size of the LargeArray beyond 50,000 and run the bubble sort—you'll be here\
    \ forever and a day.**\n\nWhat I want to do is inject this inefficient Sort method.\
    \ I want to implement a coup d'état and overthrow the bubble sort. And I want\
    \ to do this without changing the calling code—otherwise, I couldn't call this\
    \ \"interceptor\" at all.\n\nCode Listing 48: The csproj File\n\n```\n<Project\
    \ Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
    \    <TargetFramework>net8.0</TargetFramework>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
    \    <Nullable>enable</Nullable>\n    <InterceptorsPreviewNamespaces>$(InterceptorsPreviewNamespaces);InterceptorDemo</InterceptorsPreviewNamespaces>\n\
    \  </PropertyGroup>\n</Project>\n```\n\nTo start off, I need to modify the csproj\
    \ file and opt in to the experimental interceptors feature. Let's add the property\
    \ **InterceptorsPreviewNamespaces** and include our **InterceptorDemo** namespace\
    \ in here.\n\nNext, we need to add the **InterceptorsLocationAttribute**, which\
    \ is crucial for implementing interceptors, as this is not available in our build\
    \ of C# 12. You can see this in Code Listing 49. Put simply, this allows us to\
    \ use the interceptor feature.\n\n# Code Listing 49: The InterceptsLocationAttribute\
    \ Helper Class\n\n```\nnamespace System.Runtime.CompilersServices\n{\n    [AttributeUsage(AttributeTargets.Method,\
    \ AllowMultiple = false)]\n    internal sealed class InterceptsLocationAttribute\
    \ : Attribute\n    {\n        public InterceptsLocationAttribute(string filePath,\
    \ int line, int column) {}\n    }\n}\n```\n\nI then create a class called Inception,\
    \ as seen in Code Listing 50.\n\n# Code Listing 50: Our Interceptor\n\n```\nusing\
    \ System.Runtime.CompilersServices;\n\nnamespace InterceptorDemo;\n\npublic static\
    \ class Inception\n{\n    [InterceptsLocation(\n        filePath: \"C:\\repos\\\
    InterceptorDemo\\Program.cs\",\n        line: 11,\n        column: 8)]\n    public\
    \ static void InterceptSort(\n        this ArraySorter arraySorter, int[] array)\n\
    \    {\n        Console.WriteLine($\"Intercept using Array.Sort to {array.Length}\
    \ elements\");\n        Array.Sort(array);\n    }\n}\n```\n\nYou need to tell\
    \ the interceptor exactly what to intercept. Let's break this down. We have the\
    \ following moving parts in our static InterceptorSort method:\n\n- **filePath**:\
    \ The path to Program.cs file.\n- **line**: The line in Program.cs where sorter.Sort(largeArray)\
    \ is found.\n- **column**: The column number of the start of the Sort method in\
    \ the Program.cs file.\n- **this ArraySorter**: The InterceptorSort method is\
    \ an extension method, so we need to tell it which class to act on (which class\
    \ we need to intercept)\n- **int[] array**: Tells us the interceptSort method\
    \ that we are passing an array of integers.\n\nTo clarify the line and column\
    \ values, have a look at Figure 32.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_68_0.png)\n\
    \nFigure 32: Finding the Line and Column Values\n\nThese values can also be found\
    \ in the bottom-right corner of your editor window in Visual Studio when you place\
    \ your cursor at the start of the Sort method.\n\n> Note: It goes without saying\
    \ that the values you will have for your InterceptorSort method for line and column\
    \ will differ from mine in the code example in Code Listing 50.\n\nYou are now\
    \ ready to run your application. Give it a whirl and look at the console window\
    \ seen in Figure 33.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_68_1.png)\n\n\
    Figure 33: The Sort Method Intercepted\n\nThe interceptor jumps into action and\
    \ grabs the call to the Sort method, allowing our code to use a more efficient\
    \ way to sort our array of integers.\n\nFor fun, try changing the number of elements\
    \ in our array of integers and running the intercepted method. Interceptors are\
    \ really great to work with when thinking about code generators, but how much\
    \ will they be to the wider community remains to be seen. That, if interceptors\
    \ make it out of the experimental phase.\n\n# In\n\n chapter took us through a\
    \ buffet of new features introduced in C# 12. One feature that I didn't cover\
    \ was inline arrays. This is because it is more aimed at the runtime team and\
    \ library authors. You can read more about inline arrays here.\n\nIt is a very\
    \ niche use case that I didn't think would benefit the larger audience of this\
    \ book. It's like finding a tub of tofu on the buffet table. Some folks will pick\
    \ at it, while others won't. Invariably, you will find it untouched after the\
    \ party is over. If I erred in omitting this feature in the book, I apologize.\
    \ Perhaps it's just me that it doesn't like tofu.\n\nThat being said, C# 12 brings\
    \ with it some really interesting features and gives me the feeling that C# 13\
    \ might build on some of these in the next release.\n\nIn the next chapter, we\
    \ will have a look at some more new features in .NET 8.\n\n# More .NET 8 Features\n\
    \nWe're not done yet with the new features in .NET 8. There are a few more things\
    \ we need to talk about that are more suited to a chapter of their own. Starting\
    \ off this foray into what's new, let us look at AOT.\n\n## AOT support\n\nYou\
    \ are now able to compile your code into native code using native AOT. This allows\
    \ you to take C# and .NET code compile it to native code the same way C++, Rust,\
    \ or Go would compile. This means no .NET dependency, no IL code, and no JIT,\
    \ making for very fast start times that are very memory efficient.\n\nAOT stands\
    \ for ahead-of-time and is the counterpart of JIT, which stands for just-in-time\
    \ compilation.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_70_0.png)\n\nFrom the\
    \ illustration in Figure 34, you can see how JIT and AOT differ. With AOT, we\
    \ are generating the native code that runs on the target machine when we compile\
    \ the application.\n"
  mdcn: "\n\n我个人并不喜欢在代码中使用 `#pragma warning` 指令，尽管在显式抑制编译器警告时，它确实提供了很高的可见性和表现力。我更倾向于使用\
    \ `#pragma warning` 指令（尽管我不喜欢它），而不是在 `csproj` 文件中使用 `<NoWarn>` 属性。我觉得它隐藏在 `csproj`\
    \ 文件中太深了。\n\n有一句南非兰语谚语说：“Stille waters, diepe grond, onder draai die wiel”，翻译过来是“水深流静，而那正是魔鬼潜伏的地方。”\n\
    \n细节中的魔鬼就在于 `csproj` 文件中的 `<NoWarn>` 属性，它抑制了你花费大部分时间在其中的代码编辑器中的警告。如果我抑制了一个警告，我想要知道它——更重要的是，我希望其他为我的代码贡献内容的开发者也能知道它。\n\
    \n# 拦截器 (Interceptors)\n\nC# 12 中最令人兴奋和有趣的功能之一一定是拦截器。微软警告说，拦截器是实验性特性，仅在 C# 12\
    \ 的预览模式下可用，并且该功能在未来的发布中可能会发生破坏性更改或被移除。\n\n言而易之，我不鼓励在生产环境中使用它。没错，我已经说了。废话少说，让我们开始开始吧。\n\
    \n你将在代码列表 46 中看到，我有一个名为 `ArraySorter` 的类，其中包含一个极其低效的 `Sort` 方法。\n\n> 提示：不要在你的代码中使用这个\
    \ Sort 方法……永远。\n\n这基本上是一个冒泡排序，但在需要排序大型数组时，它并不是高性能的。\n\n```\nnamespace InterceptorDemo;\n\
    \npublic class ArraySorter\n{\n    public void Sort(int[] array)\n    {\n    \
    \    Console.WriteLine($\"Sorting array using Bubble Sort to sort {array.Length}\
    \ elements\");\n\n        bool swapped;\n        do\n        {\n            swapped\
    \ = false;\n            for (int i = 0; i < array.Length - 1; i++)\n         \
    \   {\n```\n\n```\nif (array[i] > array[i + 1])\n{\n    int temp = array[i + 1];\n\
    \    array[i + 1] = array[i];\n    array[i] = temp;\n    swapped = true;\n}\n\
    } while (swapped);\n```\n\n在我的 `Program.cs` 文件中（见代码列表 47），我正在创建一个随机整数的数组。\n\n\
    # 代码列表 47：Program.cs 类\n\n```\nusing System.Diagnostics;\nusing InterceptorDemo;\n\
    ```\n\n```\nvar random = new Random();\nvar largeArray = Enumerable.Range(0, 50000).Select(x\
    \ =>\nrandom.Next()).ToArray();\n```\n\n```\nvar sorter = new ArraySorter();\n\
    ```\n\n```\nvar stopwatch = Stopwatch.StartNew();\n```\n\n```\nsorter.Sort(largeArray);\n\
    ```\n\n```\nstopwatch.Stop();\n```\n\n```\nConsole.WriteLine(\"Time taken: {stopwatch.ElapsedMilliseconds}\
    \ ms\");\nConsole.ReadLine();\n```\n\n然后我实例化了我的 `ArraySorter` 类并调用了 `Sort` 方法，传递了\
    \ `largeArray` 变量。\n\n```\nC:\\repos\\auth-sync-2024-03\nSorting array using Bubble\
    \ Sort to sort 50000 elements\nTime taken: 6747 ms\n```\n\n图 31：冒泡排序结果\n\n当前 `Sort`\
    \ 方法的结果显示在图 31 中。\n\n> **提示：不要将 LargeArray 的大小增加到 50,000 以上并运行冒泡排序——否则你会等上一辈子。**\n\
    \n我想做的是注入这个低效的 `Sort` 方法。我想实现一场政变并推翻冒泡排序。我想在不改变调用代码的情况下实现这一点——否则，我根本无法调用这个“拦截器”。\n\
    \n代码列表 48：csproj 文件\n\n```xml\n<Project Sdk=\"Microsoft.NET.Sdk\">\n  <PropertyGroup>\n\
    \    <OutputType>Exe</OutputType>\n    <TargetFramework>net8.0</TargetFramework>\n\
    \    <ImplicitUsings>enable</ImplicitUsings>\n    <Nullable>enable</Nullable>\n\
    \    <InterceptorsPreviewNamespaces>$(InterceptorsPreviewNamespaces);InterceptorDemo</InterceptorsPreviewNamespaces>\n\
    \  </PropertyGroup>\n</Project>\n```\n\n首先，我需要修改 `csproj` 文件并启用实验性拦截器特性。让我们添加\
    \ **InterceptorsPreviewNamespaces** 属性，并在其中包含我们的 **InterceptorDemo** 命名空间。\n\n\
    接下来，我们需要添加 **InterceptsLocationAttribute**，这对于实现拦截器至关重要，因为在我们使用的 C# 12 版本尚未可用。你可以在代码列表\
    \ 49 中看到这一点。简单来说，这允许我们使用拦截器特性。\n\n# 代码列表 49：InterceptsLocationAttribute Helper类\n\
    \n```csharp\nnamespace System.Runtime.CompilersServices\n{\n    [AttributeUsage(AttributeTargets.Method,\
    \ AllowMultiple = false)]\n    internal sealed class InterceptsLocationAttribute\
    \ : Attribute\n    {\n        public InterceptsLocationAttribute(string filePath,\
    \ int line, int column) {}\n    }\n}\n```\n\n然后我创建了一个名为 `Inception` 的类，见代码列表 50。\n\
    \n# 代码列表 50：我们的拦截器\n\n```csharp\nusing System.Runtime.CompilersServices;\n\nnamespace\
    \ InterceptorDemo;\n\npublic static class Inception\n{\n    [InterceptsLocation(\n\
    \        filePath: \"C:\\repos\\InterceptorDemo\\Program.cs\",\n        line:\
    \ 11,\n        column: 8)]\n    public static void InterceptSort(\n        this\
    \ ArraySorter arraySorter, int[] array)\n    {\n        Console.WriteLine($\"\
    Intercept using Array.Sort to {array.Length} elements\");\n        Array.Sort(array);\n\
    \    }\n}\n```\n\n你需要准确告诉拦截器要拦截什么。让我们来拆解一下。在我们的静态 `InterceptorSort` 方法中，有以下几个组成部分：\n\
    \n- **filePath**: Program.cs 文件的路径。\n- **line**: Program.cs 中找到 `sorter.Sort(largeArray)`\
    \ 的行号。\n- **column**: Program.cs 文件中 `Sort` 方法开始位置的列号。\n- **this ArraySorter**:\
    \ `InterceptorSort` 方法是一个扩展方法，所以我们需要告诉它对哪个类进行操作（即我们需要拦截的哪个类）。\n- **int[] array**:\
    \ 告诉我们 `interceptSort` 方法我们传递的是一个整数数组。\n\n为了澄清行号和列号的值，请看图 32。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_68_0.png)\n\
    \n图 32：行号和列号\n\n这些值可以在编辑器的右下角找到，当你把光标置在 `Sort` 方法处时。\n\n> 注意：显而易见，你可以在代码列表 50\
    \ 的 Visual Studio 窗口中看到这些行和列值。\n\n你现在准备好运行你的程序了。尝试更改数组中的元素并查看结果。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_68_1.png)\n\
    \n图 33：被拦截的 Sort 方法\n\n拦截器采取行动并拦截了 `Sort` 方法的调用，允许我们使用更高效的方法排序数组。拦截器在考虑代码生成器时非常棒，但它们对更广泛社区的影响如何取决于未来（如果它们退出了实验阶段）。\n\
    \n# 在\n\n本章带我们介绍了 C# 12 引入的一系列新特性。我们没有的一个特性是内联数组（inline arrays），因为它更多是针对运行时团队和库作者的。你可以在这里了解更多内联数组的信息。\n\
    \n这是一个非常小众的用例，我没必要在书中介绍。它就像自助餐桌上的豆腐。有些人会吃，而有些人则不会。在任何情况下，聚结束后你会发现它原封未动。如果我在书中忽略了这一特性，我深表歉意。也许只是我我不喜欢豆腐。\n\
    \n尽管如此，C# 12 带来了一些非常有趣的特性，并让我觉得 C# 13 在下一个版本中可能会基于这些进行构建。\n\n在下一章中，我们将查看 .NET\
    \ 8 的更多新特性。\n\n# 更多 .NET 8 特性\n\n我们还没有结束 .NET 8 的新特性。还有一些我们需要讨论的内容，它们适合单独成章。在开始这一新特性之旅之前，让我们来看看\
    \ AOT。\n\n## AOT 支持\n\n你现在可以使用原生 AOT 将代码编译为原生代码。这允许你像编译 C++、Rust 或 Go 一样将 C# 和\
    \ .NET 代码编译为原生代码。这意味着没有 .NET 依赖、没有 IL 代码也没有 JIT，从而实现了极快的启动速度和极高的内存效率。\n\nAOT 代表预编译编译（ahead-of-time），是\
    \ JIT（即时编译，just-in-time）的对应物。\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_70_0.png)\n\
    \n从图 34 的插图中，你可以看到 JIT 和 AOT 的区别。在 AOT 中，我们在编译应用程序时就生成在目标机器上运行的原生代码。\n\n"
