    \ | 9,112 KB |\n| NativeAOTDemo.pdb | 5/26/2024 12:39 PM | Program Debug D...\
    \ | 47,684 KB |\n\nFigure 38: The Published Files\n\nSeeing as Native AOT applications\
    \ don't use JIT when the application runs, these apps can run in restricted environments\
