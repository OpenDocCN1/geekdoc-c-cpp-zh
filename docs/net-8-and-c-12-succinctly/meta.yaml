  md: '# The History of .NET


    # 2010 - .NET Framework 4.0


    South Africa hosts the FIFA World Cup, the first time this tournament is held
    on the African continent. The .NET Framework 4.0 and C# 4.0 are released, providing
    performance improvements, statement lambdas, and named/optional parameters.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_9_0.png)


    # 2012 - .NET Framework 4.5


    Curiosity lands in Gale crater on Mars with the objective of determining if Mars
    ever supported life. The .NET Framework 4.5 and C# 5.0 are released two months
    later, adding async features and caller information, among other improvements.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_9_1.png)


    # 2015 - .NET Framework 4.6


    Microsoft releases Windows 10 and the .NET Framework 4.6 in July. The new .NET
    Framework and C# 6.0 allow for the addition of expression-bodied methods, nameof
    expressions, primary constructors, string interpolation, and other features.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_9_2.png)


    # 2016 - .NET Core 1.0


    The Summer Olympics are held in Rio De Janeiro, Brazil, the first time they are
    held in South America. Microsoft releases. .NET Core 1.0, a new open-source, cross-platform
    .NET product allowing flexible deployment in your app or installed side by side,
    user or machine-wide.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_9_3.png)


    Figure 3: .NET 2010 to 2016'
