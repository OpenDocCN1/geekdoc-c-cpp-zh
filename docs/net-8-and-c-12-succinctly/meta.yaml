  md: "# When to use AOT\n\nSo, how do you know when to use AOT applications? Well,\
    \ the short answer is: when you create cloud-native APIs. This will allow for\
    \ increased performance, utilizing fewer resources.\n\n# New exception handling\
    \ in ASP.NET Core 8\n\nException handling is something with which all developers\
    \ are very familiar. When something exceptional happens in your code—something\
    \ you didn't expect—you need to handle that. ASP.NET is no exception. While exception\
    \ handling in ASP.NET was possible before, it required you to write your own middleware\
    \ in order to handle it correctly.\n\nWith .NET 8, Microsoft has now given developers\
    \ the ability to have an exception handler class, specifically made for exception\
    \ handling, which you can add to your pipeline. To illustrate this, I will create\
    \ a simple Web API project as seen in Code Listing 53.\n\nCode Listing 53: A Basic\
    \ Web API Project\n\n```\nvar builder = WebApplication.CreateBuilder(args);\n\n\
    var app = builder.Build();\n\napp.Map(\"/api/gettasks\", () =>\n{\n    throw new\
    \ InvalidProgramException(\"Something went wrong\");\n});\n\napp.Run();\n```\n\
    \nI am simply throwing an exception when the /gettasks endpoint is called. I also\
    \ have a .http file that allows me to test my API inside Visual Studio. The code\
    \ is illustrated in Code Listing 54.\n\nCode Listing 54: The .http file\n\n```\n\
    @ExceptionHandlerHandlingDemo_HostAddress = http://localhost:5105\n\nGET {{ExceptionHandlerHandlingDemo_HostAddress}}/api/gettasks\n\
    Accept: application/json\n\n###\n```\n\nYour port might be different from mine,\
    \ but you can configure this in the debug properties if you like. Speaking of\
    \ the debug properties, you can find this under the Debug menu in Visual Studio,\
    \ as seen in Figure 39."
