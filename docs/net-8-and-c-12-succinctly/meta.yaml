    \n}\n```\n\nIf it is a valid refresh token, then it will return a new bearer and\
    \ refresh token for it. If you are interested in seeing what endpoints are available,\
    \ place your mouse cursor on MapIdentityAPI and press Ctrl+F12.\n\nYou will see\
    \ the following endpoints:\n\n+   * /register\n* /login\n* /refresh\n* /confirmEmail\n\
    * /resendConfirmationEmail\n* /forgotPassword\n* /resetPassword\n* /manage/2fa\n\
    * /manage/info\n\nThis makes it extremely easy to set authorization and identity\
    \ on any app. This is not exclusive to minimal web APIs.\n\n# Data annotations\
    \ updates\n\nThere are a few new data annotation attributes added to .NET8. As\
    \ you know, data annotations are used mainly for validation purposes, and in this\
    \ example, I will be using an API to call endpoints that validate the models in\
    \ my project.\n\nAs seen in Code Listing 66, I have a controller that calls out\
    \ to a few APIs. The model is validated, and if valid, just returns an Ok result.\n\
    \nIf, however, the model is invalid, it means that one of the validations applied\
    \ by the data attributes caught an invalid input.\n\nWe will be looking at the\
    \ following data annotations:\n\n+   * Range\n* Length\n* AllowedValues\n* DeniedValues\n\
    * Base64\n\nI am also going to use an .http file to test my API endpoints."
  - "[PAGE 89]\n\n# Code Listing 66: The Demo Controller\n\n```\nusing DataAnnotationsDemo.Models;\n\
    using Microsoft.NetCore.Mvc;\n\nnamespace DataAnnotationsDemo.Controllers\n{\n\
    [ApiController]\n[Route(\"controller\")]\npublic class DemoController : Controller\n\
    {\n    [HttpPost(\"rangedemo\")]\n    public IActionResult RangeDemo([FromBody]\
    \ RangeExampleModel body)\n    => !ModelState.IsValid ? BadRequest(ModelState)\
    \ : Ok(body);\n\n    [HttpPost(\"lengthdemo\")]\n    public IActionResult LengthDemo([FromBody]\
    \ LengthExampleModel body)\n    => !ModelState.IsValid ? BadRequest(ModelState)\
    \ : Ok(body);\n\n    [HttpPost(\"allowedvaluesdemo\")]\n    public IActionResult\
    \ AllowedValuesDemo([FromBody] AllowedValuesExampleModel body)\n    => !ModelState.IsValid\
    \ ? BadRequest(ModelState) : Ok(body);\n\n    [HttpPost(\"deniedvaluesdemo\")]\n\
    \    public IActionResult DeniedValuesDemo([FromBody] DeniedValuesExampleModel\
    \ body)\n    => !ModelState.IsValid ? BadRequest(ModelState) : Ok(body);\n\n \
    \   [HttpPost(\"base64demo\")]\n    public IActionResult Base64Demo([FromBody]\
    \ Base64ExampleModel body)\n    => !ModelState.IsValid ? BadRequest(ModelState)\
    \ : Ok(body);\n}\n```\n\nCode Listing 67 shows the code to test the various endpoints.\
    \ The code in the .http file will all validate successfully. If you run the project\
    \ and call these endpoints, you will receive an Ok result.\n\n# Code Listing 67:\
    \ The .http File\n\n```\n@DataAnnotationsDemo_HostAddress = http://localhost:5053\n\
    \nPOST { {DataAnnotationsDemo_HostAddress}}/demo/rangedemo\nContent-Type: application/json\n\
    {\n```"
  - "[PAGE 90]\n\n```\n{\n  \"threshold\": 50\n}\n\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/lengthdemo\n\
    Content-Type: application/json\n{\n  \"testresults\": [\n  2,\n  5,\n  7\n  ]\n\
    }\n```\n\n```\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/allowedvaluesdemo\n\
    Content-Type: application/json\n{\n  \"countryiso\": \"USA\"\n}\n```\n\n```\n\
    ###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/deniedvaluesdemo\nContent-Type:\
    \ application/json\n{\n  \"countryiso\": \"USA\"\n}\n```\n\n```\n###\nPOST {{DataAnnotationsDemo_HostAddress}}/demo/base64demo\n\
    Content-Type: application/json\n{\n  \"systeminput\": \"rtdfghjuytrfvcxs8796\"\
    \n}\n```\n\n# Range attribute with minimum and maximum exclusive\n\nThe Range\
    \ attribute now allows you to set exclusive bounds on the range being validated.\
    \ From the code in Code Listing 68, you will see that I have a range of 20 to\
    \ 80 set with the MinimumIsExclusive and MaximumExclusive set to true."
  - "[PAGE 91]\n\nWhat this means is that I do not want to accept 20 as the lower\
    \ value in the range, and I do not want to accept 80 as my upper value. The valid\
    \ values are, therefore, any values between 20 and 80, excluding 20 and 80.\n\n\
    This is why \"threshold\": 50 will validate, while \"threshold\": 20 } and any\
    \ value lower, as well as \"threshold\": 80 } and any value higher, will fail\
    \ validation.\n\nIf you wanted to exclude 20 but exclude 80, you would set MinimumIsExclusive\
    \ = false keeping MaximumIsExclusive unchanged.\n\n# Code Listing 68: Range Attribute\
    \ with Minimum and Maximum Validation\n\n```\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace DataAnnotationsDemo.Models;\n\npublic class RangeExampleModel\n{\n\
    \    [Range(20, 80, MinimumIsExclusive = true, MaximumIsExclusive = true)]\n \
    \   public int Threshold { get; set; }\n}\n```\n\nSimple and effective. I'm not\
    \ sure how much this will get, but it is nice to have the option to include or\
    \ exclude the lower or upper bounds of the range values.\n\n# Length attribute\n\
    \nKeeping in the same vein when it comes to validation attributes, we now have\
    \ a Length attribute, as seen in Code Listing 69.\n\n# Code Listing 69: Length\
    \ Validation Attribute\n\n```\nusing System.ComponentModel.DataAnnotations;\n\n\
    namespace DataAnnotationsDemo.Models;\n\npublic class LengthExampleModel\n{\n\
    \    [Length(1, 3)]\n    public ICollection<int> TestResults { get; set; } = Array.Empty<int>();\n\
    }\n```"
- md: "\nHere I want to validate the length of my collection of test results. I no\
    \ longer need to chain MinLength and MaxLength, for example [MinLength(1), MaxLength(3)],\
    \ to make this work. I can now simply state [Length(1, 3)] and be done with it.\
    \ Also note that the parameters for the Length(a, b) attribute are always inclusive.\n\
    \n## AllowedValues attribute\n\nAs seen in Code Listing 70, you've given it, we\
    \ have the AllowedValues attribute. This allows you to be explicit with which\
    \ values you will allow.\n\nCode Listing 70: AllowedValues Attribute\n\n```c\n\
    using System.ComponentModel.DataAnnotations;\n\nnamespace DataAnnotationsDemo.Models;\n\
    \npublic class AllowedValuesExampleModel\n{\n    [AllowedValues(\"USA\", \"GBR\"\
    , \"ZAF\")]\n    public string countryISO { get; set; } = string.Empty;\n}\n```\n\
    \nThis means the API will only accept the following values:\n\n- { \"countryiso\"\
    : \"USA\" }\n- { \"countryiso\": \"GBR\" }\n- { \"countryiso\": \"ZAF\" }\n\n\
    Anything else will fail validation, for example, passing ZAR instead of ZAF. ZAR\
    \ is the currency code for South Africa, where ZAF is the ISO country code.\n\n\
    ## DeniedValues attribute\n\nGoing hand-in-hand with AllowedValues is the DeniedValues\
    \ attribute. As seen in Code Listing 71, you can be as explicit with values that\
    \ you do not want to allow.\n\nCode Listing 71: DeniedValues Attribute\n\n```csharp\n\
    using System.ComponentModel.DataAnnotations;\n\nnamespace DataAnnotationsDemo.Models;\n\
    \npublic class DeniedValuesExampleModel\n{\n    [DeniedValues(\"US\", \"ZAR\"\
    )]\n    public string CountryISO { get; set; } = string.Empty;\n}\n```\n\nThis\
    \ is handy for a variety of applications. In this example, { \"countryiso\": \"\
    US\" } and { \"countryiso\": \"ZAR\" } will fail validation. Everything else is\
    \ permitted.\n\n## Base64String attribute\n\nThe last validation attribute is\
    \ the Base64String attribute. This validates that the string passed is a valid\
    \ Base64 representation.\n\nCode Listing 72: Base64 Validation Attribute\n\n```csharp\n\
    using System.ComponentModel.DataAnnotations;\nnamespace DataAnnotationsDemo.Models;\n\
    public class Base64ExampleModel\n{\n    [Base64String]\n    public string SystemInput\
    \ { get; set; } = string.Empty;\n}\n```\n\nA point to note here is that this does\
    \ not determine if a string is a valid Base64 string that can be decoded into\
    \ something. In other words, if we decode QSvbG8gd29ybQG, we will get Hello world.\
    \ If, however, we try to decode rtdghuyrtfvc8576, it will decode to gibberish.\n\
    \nAll that the Base64String attribute does is check that the strings contain valid\
    \ Base64 characters (A-Z, a-z, 0-9, +,/=).\n\n## In conclusion\n\n.NET 8 brings\
    \ with it so many new features and enhancements, it's difficult to collect them\
    \ all in a single book. We haven't started looking in depth at the performance\
    \ improvements in .NET 8. That alone is significant.\n\nIf you want to read more\
    \ about the topic of performance, we have a look at this article by Stephen Toub.\n\
    \nWith the advent of AI and the expectation of AGI soon afterwards, you might\
    \ be wondering if your profession is in danger. I take solace in the fact that\
    \ AI currently needs specific instructions in order to deliver the best results.\n\
    \nAs developers, we all know that walking on water and developing an application\
    \ perfectly from a customer's specification is possible if both are frozen. While\
    \ this might be true for now, with AI serving as a supplementary assistant to\
    \ humans, this dynamic may soon change.\n\nWe need to remember that AI is but\
    \ a machine capable of extrapolating the most likely answer based on terabytes\
    \ of data (or gorged on if you like) during its training. LLMs spend eye-watering\
    \ amounts of money on training and running the hardware to make these machines\
    \ work. But the human mind, which is capable of feelings, emotions, and opinions,\
    \ derives answers to problems elegantly with relatively little information.\n\n\
    Now, I am not a doomsayer at all, I too, have to use AI in my daily life. I also\
    \ have a Copilot subscription, but I was surprised when I watched the interview\
    \ between Microsoft's Satya Nadella and Joanna Stern for The Street Journal. Satya\
    \ Nadella mentioned Copilot+ PCs. These PCs will contain NPUs that will drive\
    \ AI features on device.\n\nThis Copilot+ PCs have a feature Recall that will\
    \ allow users to search over their entire history. It will do this by continually\
    \ taking screenshots of your desktop and then using generative AI and the NPU\
    \ to process this data and make it searchable on your device.\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_94_0.png)\n\
    \n> Note: Recall can be restricted from specific websites or apps and always lives\
    \ on your machine locally. Therefore, the promise is that it can be. Whether this\
    \ will materialize with customers is a different story altogether.\n\nArtificial\
    \ intelligence, waits and all, can also significantly benefit humanity. DeepMind\
    \ AI set to solve an impossible problem in biology, the protein problem. 3D mapping\
    \ of a single protein, the building blocks of life, could take years to complete.\
    \ What DeepMind did was an AI that could solve the protein problem in a fraction\
    \ of the time.\n\nThey then set it loose on the 200 million proteins that are\
    \ known to science. Using traditional methods, according to DeepMind CEO Demis\
    \ Hassabis, this would have taken a billion years to solve them. DeepMind took\
    \ only a year, after they made their protein database public as a gift to humanity.\n\
    \nWhile we need to resign ourselves to the fact that AI is here to stay, we as\
    \ a species have something that no will ever have. This is the thirst for, and\
    \ attainment of, knowledge. The very fact that you are reading this is a testament\
    \ to pursuit of knowledge, driven by an innate desire to learn.\n\nWhile it is\
    \ true that AI may assist us, challenge our beliefs, and even change how we humans\
    \ live and work, it will never and never replace our quest for knowledge. As we\
    \ write these final lines, I am encouraged that our journey of learning is from\
    \ over: there will be a .NET 9, and a .NET 10, and so on.\n\nOur future is bright—not\
    \ because of the tools we use or the solutions we create, but because of the minds\
    \ that wield them. The human spirit's quest for knowledge is infinitely and profoundly\
    \ human.\n\nTherefore, dear reader, thank you for reading this book and allowing\
    \ me to learn alongside you.\n"
  mdcn: "\n\n在这里，我想验证我的测试结果集合的长度。我不再需要通过链用 `MinLength` 和 `MaxLength`（例如 `[MinLength(1),\
    \ MaxLength(3)]`）来实现此功能。现在我只需声明 `[Length(1, 3)]` 即可完成。请注意，`Length(a, b)` 性的参数始终是包含边界的。\n\
    \n## AllowedValues 属性\n\n如代码列表 70 所示，我们为你提供了 `AllowedValues` 属性。这允许你显式地指定允许哪些值。\n\
    \n代码列表 70：AllowedValues 属性\n\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace DataAnnotationsDemo.Models;\n\npublic class AllowedValuesExampleModel\n\
    {\n    [AllowedValues(\"USA\", \"GBR\", \"ZAF\")]\n    public string countryISO\
    \ { get; set; } = string.Empty;\n}\n```\n\n这意味着 API 将仅接受以下值：\n\n- { \"countryiso\"\
    : \"USA\" }\n- { \"countryiso\": \"GBR\" }\n- { \"countryiso\": \"ZAF\" }\n\n\
    任何其他内容都将通过失败，例如传递 ZAR 而不是 ZAF。ZAR 是南非的货币代码，而 ZAF 是 ISO 国家代码。\n\n## DeniedValues\
    \ 属性\n\n与 `AllowedValues` 相辅相成的是 `DeniedValues` 属性。如代码列表 71 所示，你可以显式地指定你不允许的值。\n\
    \n代码列表 71：DeniedValues 属性\n\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\
    \nnamespace DataAnnotationsDemo.Models;\n\npublic class DeniedValuesExampleModel\n\
    {\n    [DeniedValues(\"US\", \"ZAR\")]\n    public string CountryISO { get; set;\
    \ } = string.Empty;\n}\n```\n\n这对于各种应用都非常有用。在这个示例中，{ \"countryiso\": \"US\" }\
    \ 和 { \"countryiso\": \"ZAR\" } 将通过失败。其他所有内容均被允许。\n\n## Base64String 属性\n\n最后一个验证属性是\
    \ `Base64String` 属性。它验证传递的字符串是否是有效的 Base64 表示法。\n\n代码列表 72：Base64 验证属性\n\n```csharp\n\
    using System.ComponentModel.DataAnnotations;\nnamespace DataAnnotationsDemo.Models;\n\
    public class Base64ExampleModel\n{\n    [Base64String]\n    public string SystemInput\
    \ { get; set; } = string.Empty;\n}\n```\n\n这里需要注意的是，这并不能确定字符串是否是一个可以解码为内容的有效 Base64\
    \ 字符串。换句话说，如果我们解码 `QSvbG8gd29ybQG`，我们将得到 `Hello world`。然而，如果我们尝试解码 `rtdghuyrtfvc8576`，它将解码为乱码。\n\
    \n`Base64String` 属性的作用仅仅是检查字符串包含有效的 Base64 字符（A-Z, a-z, 0-9）。\n\n## 结论\n\n.NET\
    \ 8 带来了许多新功能和增强。如果你想了解更多关于性能，可以参考这篇文章。\n\n随着 AI 的到来，你可能会担心你的职业是否面临危险。但在看到微软 Satya\
    \ Nadella 与 Joanna Stern 的采访时，我感到很惊讶。Satya Nadella 提到了 Copilot+ PC。这些 PC 将包含驱动\
    \ AI 功能的 NPU。\n\nCopilot+ PC 拥有一个 Recall 功能，允许用户搜索他们的整个历史。它通过持续截取桌面并使用生成式 AI 和\
    \ NPU 处理这些数据来实现。\n\n![](img/7b8ba6070e5beefbf59960730ba1d42_94_0)\n\n> 注意：Recall\
    \ 可以限制特定的网站或应用程序，并且始终运行在你的本地设备。因此，这种承诺是可以实现的。能否实现是另一个故事。\n\n人工智能无论如何都能使人类显著受益。DeepMind\
    \ AI 旨在解决生物学中一个不可能的问题——蛋白质问题。单个蛋白质（生命的基石）的 3D 映射可能需要多年才能完成。DeepMind 做的是一种可以在极短时间内解决蛋白质问题的\
    \ AI。\n\n随后，他们将其应用于已知的 2 亿种蛋白质。根据 DeepMind 首席执行官 Demis Hassabis 的说法，使用传统方法解决这些问题需要十亿年。DeepMind\
    \ 花了一年，并将他们的蛋白质数据库作为给人类的礼物公开。\n\n虽然我们需要接受 AI 已经存在的事实，但作为一个物种，我们拥有机器永远无法拥有的东西。这就是对知识的渴望和获得。你正在阅读这本书这一事实本身就是内在学习欲驱动的追求知识的证明。\n\
    \n虽然 AI 可能会协助我们、挑战我们的信仰，甚至改变我们人类的生活和工作，但它永远无法取代我们对知识的追求。当我们写下最后几行字时，我感到我们的学习旅程并未结束：会有\
    \ .NET 9、.NET 10，以此此类推。\n\n我们的未来是光明的——不是因为我们使用的工具或创造的解决方案，而是因为使用这些工具的大脑。人类精神对知识的追求是无限且深刻的。\n\
    \n因此，亲爱的读者，感谢你阅读这本书，并允许我与你一起学习。\n\n"
