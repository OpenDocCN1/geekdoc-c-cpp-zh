    \ current time is in the morning, and if so, it runs the TaskRunnerService. To\
    \ use these, I need to add them to the Program class of the API, as seen in Code\
    \ Listing 9. I want to use the new TimeProvider class, so I need to add this service,\
    \ too.\n\n# Code Listing 9: The Program Class\n\n```csharp\npublic class Program\n\
    {\n    public static void Main(string[] args)\n    {\n        var builder = WebApplication.CreateBuilder(args);\n\
    \n        // Add services to the container.\n        builder.Services.AddSingleton<TimeProvider>();\n\
    \        builder.Services.AddSingleton<TimeService>();\n        builder.Services.AddSingleton<TaskRunnerService>();\n\
    \n        builder.Services.AddControllers();\n        builder.Services.AddEndpointsApiExplorer();\n\
