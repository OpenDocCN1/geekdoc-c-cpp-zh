    Figure 40: Launch Profiles


    Running my API and sending a request to my /gettasks endpoint results in the exception,
    seen in Figure 41.


    This response window is quite rich in the information it returns. You can see
    the raw response, the headers, and the request that resulted in the exception.


    But while the default is fine, we want to handle exceptions on our own—and this
    is where the exception handler class comes into play.


    IExceptionHandler is a new interface that allows developers to handle exceptions
    from a known location. Implementations of IExceptionHandler are registered by
    calling IServiceCollection.AddExceptionHandler<T>.


    If you register multiple implementations, they are called in the order they''re
    registered. Once an exception handler handles a request, you can return true to
    stop processing, or false to continue processing.


    Any exceptions not handled by the exception handler will then fall back to the
    default behavior from middleware.


    Let''s see how to implement this in our project by looking at some code.'
