    );\n\npublic class Counter\n{\n  public void Increment(in int score)\n  {\n  \
    \  // score++;\n  }\n}\n```\n\n图 28: 结果是相同的编译错误\n\n那么，为什么要在 C# 12 中增加一个与 C# 7.2\
    \ 中引入的 **in** 关键字功能相同的新特性呢？\n\n> **注意：** 你可以在此此处阅读关于 C# 7.2 的发布说明。\n\n为了解释原因，我们首先需要理解右值（rvalue）和左值（lvalue）之间的区别。\n\
    \n右值代表“右侧值”（right-hand side value），指的是出现在赋值表达式右侧的值。换句话说，它是一个不具有持久内存位置的值。\n\n另一方面，左值代表“左侧”（left-hand\
    \ side），出现在赋值表达式的左侧。换句话说，左值通常代表一个可以赋予新值的变量或对象。\n\n观察表达式 **int x = 27;** 并应用左值和右值的定义，**27**\
    \ 是一个右值，而 x 是一个左值。\n\n简单来说，使用 **readonly** 通过警告用户传递的是右值（换句话说，不是变量）来提供额外的保证。这增强了调用处的清晰意图，表明引用正在被捕获。\n\
    \n```csharp\nvar score = 30;\nvar c = new Counter();\nc.Increment(ref score);\n\
    Console.WriteLine($\"The score is {score}\");\n// c.Increment(25);\n```\n\n```csharp\n\
    public readonly struct System.Int32\n{\n    // 表示一个 32 位有符号整数。\n}\n\n// CS9193:\
    \ 参数 1 应该是一个变量，因为它被传递给 'ref readonly' 参数\npublic void Increment(ref readonly int\
    \ score)\n{}\n```\n\n图 29: 对右值的警告\n\n通过在 C# 12 中引入 `ref readonly` 特性，你现在可以为这种指示设置默认值，表示捕获了引用，且该参数是临时值，而不是在方法调用之外存在的变量（见图\
    \ 29）。\n\n# 默认 lambda 参数\n\n在默认 lambda 参数出现之前，我们必须通过指定 `personToGreet` 的值来调用 lambda，如代码列表\
    \ 39 所示。\n\n代码列表 39: 默认 lambda 参数之前\n\n```csharp\nvar greeting = (string personToGreet)\
    \ => $\"Hello, {personToGreet}!\";\nConsole.WriteLine(greeting(\"John\")); //\
    \ Hello, John!\n```\n\n但在 C# 12 中，我们现在可以为 `personToGreet` 设置默认值，如代码列表 40 所示。\n\
    \n代码列表 40: 使用默认 lambda 参数\n\n```csharp\nvar greeting = (string personToGreet =\
    \ \"World\") => $\"Hello, {personToGreet}!\";\nConsole.WriteLine(greeting());\
    \ // Hello, World!\n```\n\n这是一个很小但广受欢迎的改变。\n\n简而言之，这一特性放宽了 `using` 别名指令的使用限制。换句话说，你现在可以元组类型（tuple）、数组类型和指针类型创建语义别名，而过去这些是做不到的。之前，你只能为命名类型创建别名，如代码列表\
    \ 41 所示。\n\n## 代码列表 41: 在命名类型上使用别名\n\n```csharp\nusing Employee = System.Collections.Generic.Dictionary<string,\
    \ string>;\nusing Foo = System.Console;\n\nEmployee employee = new();\nemployee[\"\
    Name\"] = \"John Doe\";\n\nFoo.WriteLine(employee[\"Name\"]);\n```\n\n但在 C# 12\
    \ 中，你可以为非命名类型的类型创建别名。你可以为元组创建 `using` 别名，如代码列表 42 所示。\n\n## 代码列表 42: 在元组上使用别名\n\
    \n```csharp\nusing TuplePoints = (int x, int y);\nusing Foo = System.Console;\n\
    \nTuplePoints p = (3, 4);\nFoo.WriteLine(p.x);\nFoo.WriteLine(p.y);\n```\n\n能够为任何类型创建别名是非常用的，因为它减少了代码量，使代码更具读性。\n\
    \n# Experimental 特性\n\n库作者可能会经常使用 `Experimental` 特性。\n\n## 代码列表 43: 在命名类型上使用别名\n\
    \n```csharp\nusing System.Diagnostics.CodeAnalysis;\n\npublic class Person\n{\n\
    \    public string Name { get; set; }\n\n    [Experimental(\"MyFeature\")]\n \
    \   public int GetAge(int year)\n    {\n        return year;\n    }\n}\n```\n\n\
    `Experimental` 特性允许我为我的方法添加装饰，并赋予一个诊断 ID，编译器可以使用该 ID 来报告任何该方法的使用。它还允许我设置一个指向对应文档的\
    \ URL。\n\n"
