    \"Quantity\"\": 7}}\");\nvar json = JsonSerializer.Serialize(stockItem);\n```\n\
    \n![](img/7b8ba6070e5beefbf599660730ba1d42_22_0.png)\n\n图 12：只读属性已设置\n\n查看结果，你会发现\
    \ `MarkupPercentage` 和 `Quantity` 的值已设置为 JSON 负载中包含的内容。我必须承认，我不确定为什么我喜欢这种行为。\n\
    \n你可以在此处阅读更多关于初始化属性的知识。\n\n# 时间抽象\n\n在 .NET 8 中，我们获得了一个新的时间类 `System.TimeProvider`\
    \ 和一个计时器接口 `System.Threading.ITimer`。让我们看看如何使用它们，以及如何测试依赖于时间的代码。我有一个名为 `TaskRunnerService`\
    \ 的服务，它只需返回已过去的持续时间，如代码列表 7 所示。\n\n> 代码列表 7：TaskRunnerService 类\n\n```csharp\n\
    public class TaskRunnerService\n{\n    private readonly TimeProvider _timeProvider;\n\
    \    public TaskRunnerService(TimeProvider timeProvider) => _timeProvider = timeProvider;\n\
    \n    public TimeSpan MorningTaskRunner()\n    {\n        var startTime = _timeProvider.GetTimestamp();\n\
    \        Task.Delay(5000).Wait();\n        var endTime = _timeProvider.GetTimestamp();\n\
    \n        var duration = _timeProvider.GetElapsedTime(startTime, endTime);\n \
    \       return duration;\n    }\n}\n```\n\n接下来，我有一个名为 `TimeService` 的服务，用于检查当前时间是否为早上，如代码列表\
    \ 8 所示。\n\n# 代码列表 8：TimeService 类\n\n```csharp\npublic class TimeService\n{\n\
    \    private readonly TimeProvider _timeProvider;\n\n    public TimeService(TimeProvider\
    \ timeProvider) => _timeProvider = timeProvider;\n\n    public bool RunMorningTasks()\n\
    \    {\n        var currentTime = _timeProvider.GetLocalNow();\n        return\
    \ currentTime.Hour <= 11;\n    }\n}\n```\n\n我创建了一个 API，用于检查当前时间是否为早上，如果是，它将运行\
    \ `TaskRunnerService`。为了使用这些，我需要将它们添加到 API 的 `Program` 类中，如代码列表 9 所示。我想使用 `TimeProvider`\
    \ 类，所以我也需要添加服务。\n\n# 代码列表 9：Program 类\n\n```csharp\npublic class Program\n{\n\
    \    public static void Main(string[] args)\n    {\n        var builder = WebApplication.CreateBuilder(args);\n\
    \n        // 将服务添加到容器中\n        builder.Services.AddSingleton<TimeProvider>();\n\
    \        builder.Services.AddSingleton<TimeService>();\n        builder.Services.AddSingleton<TaskRunnerService>();\n\
    \n        builder.Services.AddControllers();\n        builder.Services.AddEndpointsApiExplorer();\n\
    \        builder.Services.AddSwaggerGen();\n\n        var app = builder.Build();\n\
    \n        // 配置 HTTP 请求管道程序\n        if (app.Environment.IsDevelopment())\n  \
    \      {\n            app.UseSwagger();\n            app.UseSwaggerUI();\n   \
    \     }\n\n        app.UseHttpsRedirection();\n        app.UseAuthorization();\n\
    \n        app.MapControllers();\n\n        app.Run();\n    }\n}\n```\n\n我的 `TimeController`\
    \ 获取 GET 端点 `RunMorningTasks`，它执行所有工作。我们将在代码列表 10 中看到它。\n\n# 代码列表 10：RunMorningTasks\
    \ API\n\n```csharp\n[ApiController]\n[Route(\"api/[action]\")]\npublic class TimeController\
    \ : Controller\n{\n    private readonly TimeService _timeService;\n    private\
    \ readonly TaskRunnerService _taskRunnerService;\n\n    public TimeController(TimeService\
    \ timeService, TaskRunnerService taskRunnerService)\n    {\n        _timeService\
    \ = timeService;\n        _taskRunnerService = taskRunnerService;\n    }\n\n \
    \   [HttpGet]\n    [ActionName(\"RunMorningTasks\")]\n    public IActionResultActionResult\
    \ Get();\n}\n```\n\n"
