    \nFigure 26: Value of score Variable in Main\n\nWith C# 12, however, you can add\
    \ the readonly keyword, as seen in Figure 27.\n\n```csharp\nvar score = 30;\n\
    var c = new Counter();\nc.Increment(ref score);\nConsole.WriteLine($\"The score\
    \ is {score}\");\n```\n\n```csharp\npublic class Counter{\n    public void Increment(ref\
    \ readonly int score)\n    {\n        // score++; \n    }\n}\n```\n\nFigure 27:\
    \ Using Ref readonly\n\nUsing the ref readonly keywords in the Increment method\
    \ will result in a compilation error telling you that the reference passed is\
    \ read-only, and that you can't change it. Now you might be wondering, why not\
    \ just use the in keyword, and why do we have ref readonly to begin with?\n\n\
    Code Listing 38: Using the in Keyword\n\n```csharp\npublic void Increment(in int\
    \ score)\n{\n    // score++;\n}\n```\n\nCode Listing 38 illustrates the use of\
    \ the in keyword. Looking at Figure 28, you will see that this also results in\
    \ a compilation error.\n\n```csharp\nvar score = 30;\nvar c = new Counter();\n\
    c.Increment(score);\nConsole.WriteLine($\"The score is {score}\");\n\npublic class\
    \ Counter\n{\n  public void Increment(in int score)\n  {\n    // score++;\n  }\n\
    }\n```\n\nFigure 28: The Result Is the Same Compilation Error\n\nSo then, why\
    \ add another feature to C# 12 that does the same thing introduced in C# 7.2 with\
    \ the **in** keyword?\n\n> **Note:** You can read about the release of C# 7.2\
    \ here.\n\nTo explain the reason, we first need to understand the difference between\
    \ an rvalue and an lvalue.\n\nRvalue stands for right-hand side value and refers\
    \ to the value that appears on the right side of an assignment expression. In\
    \ other words, it is a value that does not have a persistent memory location.\n\
    \nLvalue, on the other hand, stands for left-hand side and appears on the left-hand\
    \ side of an assignment expression. In other words, an lvalue typically represents\
    \ a variable or object that can be assigned a new value.\n\nLooking at the expression\
    \ **int x = 27;** and applying the definitions for an lvalue and an rvalue **27**\
    \ is an rvalue, while x is an lvalue.\n\nTo put it simply, using **readonly**\
    \ offers additional guarantees by warning that an rvalue (in other words, not\
    \ a variable) is being passed. This enhances clarity and intent at the call site\
    \ that a reference is being captured.\n\n```csharp\nvar score = 30;\nvar c = new\
    \ Counter();\nc.Increment(ref score);\nConsole.WriteLine($\"The score is {score}\"\
    );\n// c.Increment(25);\n```\n\n```csharp\npublic readonly struct System.Int32\n\
    {\n    // Represents a 32-bit signed integer.\n}\n\n// CS9193: Argument 1 should\
    \ be a variable because it is passed to a 'ref readonly' parameter\npublic void\
    \ Increment(ref readonly int score)\n{}\n```\n\nFigure 29: Warning on rvalue\n\
    \nBy introducing the ref readonly feature in C# 12, you can now set a default\
    \ value for this indication that a reference is captured, and that the argument\
    \ is a temporary value instead of a variable that exists beyond the method call\
    \ (see in Figure 29).\n\n# Default lambda parameters\n\nBefore default lambda\
    \ parameters, we had to invoke the lambda by specifying the value of personToGreet,\
    \ as seen in Code Listing 39.\n\nCode Listing 39: Before Default Lambda Parameters\n\
    \n```csharp\nvar greeting = (string personToGreet) => $\"Hello, {personToGreet}!\"\
    ;\nConsole.WriteLine(greeting(\"John\")); // Hello, John!\n```\n\nIn C# 12, however,\
    \ we can now set a default value for personToGreet as seen in Code Listing 40.\n\
    \nCode Listing 40: Using Default Lambda Parameters\n\n```csharp\nvar greeting\
    \ = (string personToGreet = \"World\") => $\"Hello, {personToGreet}!\";\nConsole.WriteLine(greeting());\
    \ // Hello, World!\n```\n\nThis is a small, but welcome change.\n\nIn a nutshell,\
    \ this feature is relaxing the rules on where the using alias directive can be\
    \ used. In other words, you can create semantic aliases for tuple types, array\
    \ types, and pointer types where in the past, you could not. Previously, you could\
    \ only alias named types, as seen in Code List 41.\n\n## Code List 41: Using Alias\
    \ on Named Types\n\n```csharp\nusing Employee = System.Collections.Generic.Dictionary<string,\
    \ string>;\nusing Foo = System.Console;\n\nEmployee employee = new();\nemployee[\"\
    Name\"] = \"John Doe\";\n\nFoo.WriteLine(employee[\"Name\"]);\n```\n\nWith C#\
    \ 12, however, you can create an alias for a type that isn't a named type. You\
    \ can create a using alias for a tuple, as seen in Code List 42.\n\n## Code List\
    \ 42: Using Alias on a Tuple\n\n```csharp\nusing TuplePoints = (int x, int y);\n\
    using Foo = System.Console;\n\nTuplePoints p = (3, 4);\nFoo.WriteLine(p.x);\n\
    Foo.WriteLine(p.y);\n```\n\nBeing able to alias any type is useful because it\
    \ reduces the amount of code you need to write, making your code more readable.\n\
    \n# Experimental attribute\n\nLibrary authors will likely make use of the Experimental\
    \ attribute the most.\n\n## Code List 43: Using Alias on Named Types\n\n```csharp\n\
    using System.Diagnostics.CodeAnalysis;\n\npublic class Person\n{\n    public string\
    \ Name { get; set; }\n\n    [Experimental(\"MyFeature\")]\n    public int GetAge(int\
    \ year)\n    {\n        return year;\n    }\n}\n```\n\nThe Experimental attribute\
    \ allows me to decorate my method and give it a diagnostic ID the compiler can\
    \ use to report any use of it. It also allows me to set a URL for the corresponding\
    \ documentation.\n"
