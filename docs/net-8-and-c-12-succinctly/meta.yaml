    # In conclusion


    This chapter took us through a buffet of new features introduced in C# 12. One
    feature that I didn''t cover was inline arrays. This is because it is more aimed
    at the runtime team at Microsoft and library authors. You can read more about
    inline arrays here.


    It is a very niche use case that I didn''t think would benefit the larger audience
    of this book. It''s like finding a tub of tofu on the buffet table. Some folks
    will pick at it, while others won''t. Invariably, you will find it untouched after
    the party is over. If I erred in omitting this feature in the book, I apologize.
    Perhaps it''s just me that it doesn''t like tofu.


    That being said, C# 12 brings with it some really interesting features and gives
    me the feeling that C# 13 might build on some of these in the next release.


    In the next chapter, we will have a look at some more new features in .NET 8.'
