    # Figure 38: The Published Files


    Seeing as Native AOT applications don''t use JIT when the application runs, these
    apps can run in restricted environments where JIT is not allowed. You can also
    publish an app using a specific runtime identifier.


    Publishing an app for Windows as a native AOT app, you can run `dotnet publish
    -r win-x64 -c` Release.


    Publishing an app for Linux as a native AOT app, you can run `dotnet publish -r
    linux-arm64 -c` Release.


    Just note that you can''t publish cross-platform using AOT. When compiling on
    Windows, the app is native Windows x64 code. When compiling on Linux, your .exe
    will not run on Windows.


    # AOT advantages


    AOT has a number of advantages:


    +   - Improvement in startup performance.

    - Smaller app size, since it''s not JIT.

    - Consumes less memory, saving us money when running in the cloud.


    # AOT disadvantages


    There is no JIT, all native code must be generated at compile time.


    +   - Reflection is not available, which required us to add extra code to serialize
    JSON data.

    - Compile time is longer.

    - We require platform-specific tools, such as the C++ tools on Windows.

    - No cross-platform publishing means AOT apps are not portable.

    - Dependencies must also be AOT-compatible.'
