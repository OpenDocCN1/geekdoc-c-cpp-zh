  - '[PAGE 12]


    In November 2021, Microsoft released .NET 6.0, with long-term support until December
    2024. This introduced a host of new features and realized the unification of the
    various .NET platforms into a single .NET version.


    The standard term release of .NET 7.0 in November 2022 brought us closer to where
    we are today: with a unified .NET that supports cross-platform development. It
    allows developers to create a host of different applications, from desktop apps
    to cloud apps, web applications, Unity games, mobile applications, and AI apps.
    With the release of MAUI, we can create cross-platform, native UI applications.
    The unification of .NET means that we have a single BCL (or base class library)
    and SDK.


    With the release of .NET 8 in November 2023, we now have a long-term support version
    of .NET until November 2026. For companies that never upgraded their software
    to .NET 7, take note that the end of support for .NET 6 was November 2024. If
    your company implements stringent change control processes, it would be prudent
    to start planning the implementation of .NET 8 across your applications early.


    Let''s have a look at the support windows for .NET next.


    # The support window


    By now, most of your applications should be on .NET 6. However, I have come across
    a few applications myself that are still stuck on .NET Core 3.1—most notably,
    an institution in Johannesburg that is currently running software, used to manage
    the compliance of financial professionals across South Africa, on .NET Core 3.1.


    I use the word "stuck" carefully here. It is not the company that developed the
    software neglected to upgrade the version of .NET—the issue is that the company
    using the software refuses to incur additional cost to have the .NET version upgraded.


    > Note: You will incur some cost by upgrading your .NET version, since the software
    needs to be tested thoroughly after an upgrade to ensure the stability of the
    codebase.


    If you are on the fence, see when your implemented .NET version support ends.


    | Version | Original Release | Release Type | End of Support |

    |---|---|---|--|

    | .NET 8 | Nov. 14, 2023 | | Nov. 10, 2026 |

    | .NET 7 | Nov. 8, 2022 | STS | May 14, 2024 |

    | .NET 6 | Nov. 8, 2021 | LTS | Nov. 12, 2024 |


    By looking at Table 1, you can determine when support for the version of .NET
    implemented by your software ends. If your software does not implement at least
    .NET 6, then you need to upgrade your software.'
- md: "\nTable 2 outlines the version of .NET or .NET Core when support ended.\n\n\
    ## Table 2: Out of Support Versions\n\n| Version | Original Release | End of Support\
    \ |\n| --- | --- | --- |\n| .NET 5 | Nov. 10, 2020 | May 10, 2022 |\n| .NET Core\
    \ 3.1 | Dec. 3, 2019 | Dec. 13, 2022 |\n| .NET Core 3.0 | Sept. 23, 2019 | Mar.\
    \ 3, 2020 |\n| .NET Core 2.2 | Dec. 4, 2018 | Dec. 23, 2019 |\n| .NET Core 2.1\
    \ | May 30, 2018 | Aug. 21, 2021 |\n| .NET Core 2.0 | Aug. 14, 2017 | Oct. 1,\
    \ 2018 |\n| .NET Core 1.1 | Nov. 16, 2016 | June 27, 2019 |\n| .NET Core 1.0 |\
    \ June 27, 2016 | June 27, 2019 |\n\nWhen we talk about long-term support (LTS)\
    \ and standard-term support (STS), we are referring to two very distinct release\
    \ cadences. The cadences are defined as follows:\n\n- Long-term support: Supported\
    \ for three years after initial release.\n- Standard-term support: Supported for\
    \ 18 months after initial release.\n\nYou will notice that odd-numbered releases\
    \ are STS releases, and even-numbered releases are LTS releases. Therefore, you\
    \ can also say that:\n\n```\nif (version % 2 is 0)\n{\n    Console.WriteLine(\"\
    .NET \" + version + \" is a Long Term Support (LTS) release.\");\n}\nelse\n{\n\
    \    Console.WriteLine(\".NET \" + version + \" is a Standard Term Support (STS)\
    \ release.\");\n}\n```\n\nFigure 6: Cheeky Bit of Code\n\nIn all seriousness,\
    \ the release cadence enables developers and businesses to plan ahead when it\
    \ comes to their development roadmaps. To qualify for support, you need to install\
    \ the latest patch update. This means that if you are running .NET 6, you must\
    \ ensure that .NET 6.0.x is installed as a first step.\n\nIt is worth noting the\
    \ following servicing policies, which are the same for LTS and STS releases.\n\
    \n## Preview\n\nPreview releases are usually offered to developers for testing.\
    \ This is done ahead of the final release, but they are not supported by Microsoft.\n\
    \n## Go-live\n\nThese releases are supported by Microsoft in production. Go-live\
    \ releases are release candidate builds and are usually released just before the\
    \ generally available (GA) releases.\n\n## Active support\n\nDuring this support\
    \ period, updates are provided to improve functionality and mitigate any security\
    \ vulnerabilities. When it comes to functional improvements, these could typically\
    \ include fixes to resolve reported crashes, performance issues, bugs, and adding\
    \ support for new hardware platforms or operating system versions.\n\n## Maintenance\
    \ support\n\nAt this stage, .NET releases are only updated to mitigate security\
    \ vulnerabilities. The last six months of any release (LTS and STS) are considered\
    \ the maintenance support period. Once the maintenance support period is over,\
    \ the release is considered out of support.\n\n## End of life\n\nWhen a release\
    \ reaches end of life, Microsoft no longer provides fixes or updates for the release.\
    \ If you use .NET versions that have reached end of life, your software and your\
    \ data are at risk.\n\n## What's changed in .NET 8\n\n.NET 8 will be supported\
    \ for three years due to its long-term support release.\n\n> Note: You can download\
    \ .NET 8 here.\n\nThis makes it worth your while to upgrade now. If you need a\
    \ little more convincing, consider the following changes and improvements.\n\n\
    ## .NET runtime\n\nThere have been many improvements made to performance (reminiscent\
    \ of the .NET 7 release), garbage collection, the core and extension libraries.\
    \ I want to highlight just a few of them.\n\n## Garbage collection\n\nThe .NET\
    \ 8 release includes the capability to adjust the memory limit on the fly. In\
    \ cloud-service scenarios, demand can increase suddenly and then drop back down\
    \ again. The cost effectiveness of these services is measured in how well they\
    \ can scale up and down the resource consumption to meet the fluctuations on demand.\n\
    \nI would argue that scaling down is not as important as scaling up as demand\
    \ fluctuates. This means that when a decrease in demand is detected, a resource\
    \ can scale down by reducing its memory limit.\n\nBefore .NET 8, however, this\
    \ scaling down would fail because the garbage collector was not aware of any changes\
    \ and might allocate more memory than the new limit. By calling `GC.RefreshMemoryLimit()`,\
    \ you can update the garbage collector to the new limit.\n\nThere are, however,\
    \ limitations of which to take note:\n\n- On 32-bit platforms, a new hard limit\
    \ can't be established if there isn't already one.\n- `GC.RefreshMemoryLimit()`\
    \ might fail and return a non-zero status code. This happens because the scale-down\
    \ is considered too aggressive and does not leave enough memory for the garbage\
    \ collection to work with. In this case, calling `GC.Collect(2, GCMode.Aggressive)`\
    \ might solve the issue by shrinking the current memory usage, allowing you to\
    \ call `GC.RefreshMemoryLimit()`.\n- Scaling up the memory limit beyond what the\
    \ garbage collector believes the process can handle allows `GC.RefreshMemoryLimit()`\
    \ to succeed, but it will not use more memory than the garbage collector perceives\
    \ as the limit.\n\nThe following code in Code Listing 1 illustrates setting the\
    \ hard limit to 100 MiB (mibytes).\n\nCode Listing 1: Setting the Heap Hard Limit\n\
    \n```\ninternal class Program\n{\n    static void Main(string[] args)\n    {\n\
    \        AppContext.SetData(\"GCHeapHardLimit\", (ulong)100 * 1024 * 1024);\n\
    \        GC.RefreshMemoryLimit();\n    }\n}\n```\n\nIf this hard limit is invalid,\
    \ the GC.RefreshMemoryLimit() will throw an InvalidOperationException. An invalid\
    \ hard limit can be, for example, when the hard limit will be set by the refresh\
    \ is lower than what's already committed.\n\n## Core .NET libraries\n\nThere are\
    \ many improvements and additions in the core .NET libraries. Some of these improvements\
    \ were made to the following features.\n\n## Serialization\n\nA few serialization\
    \ and deserialization improvements have been made to System.Text.Json .NET 8.\
    \ I will not discuss all of them, but here are some of the more interesting improvements\
    \ and additions.\n\n## Handling missing members\n\nOne of the features that I\
    \ am quite excited about is the ability to handle missing members deserialization.\n\
    \nUsually, if you receive a JSON payload, you deserialize this into a POCO (plain\
    \ old CLR object). If your JSON payload contains properties that are missing in\
    \ your POCO when you deserialize the JSON, they are just ignored.\n\n.NET 8 allows\
    \ you to specify that all members must exist in the payload; otherwise, a JsonException\
    \ will be thrown. Consider Code Listing 2.\n\n> Code Listing 2: Deserializing\
    \ POCO with Missing Property\n\n```sharp\ninternal class Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        var pers = JsonSerializer.Deserialize<Person>(\"\
    {\\\"Name\\\": \\\"John\\\", \\\"Age\\\": 44,\\\"YearOfBirth\\\": 1980}\");\n\
    \        Console.WriteLine(pers?.Name);\n        Console.ReadLine();\n    }\n\
    }\n\npublic class Person\n{\n    public string Name { get; set; }\n    public\
    \ int Age { get; set; }\n}\n```\n\nHere, we are deserializing a JSON payload that\
    \ includes a value for YearOfBirth that the Person POCO Serializer does not contain.\n\
    \n```csharp\nvar pers = JsonSerializer.Deserialize<Person>(\"{\\\"Name\\\": \\\
    \"John\\\", \\\"Age\\\": 30, \\\"YearOfBirth\\\": 1980}\");\nConsole.WriteLine(pers?.Name);\n\
    Console.ReadLine();\n```\n\n![](img/7b8ba6070e5beefbf599660730ba1d42_17_0.png)\n\
    \nAfter deserialization, we can see that the Person class only contains values\
    \ for Age and Name, because these are the only properties it contained. But our\
    \ payload contained an additional value for YearOfBirth, which was just ignored.\n\
    \nNow consider Code Listing 3.\n\n```csharp\ninternal class Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        try\n        {\n            var pers\
    \ = JsonSerializer.Deserialize<Person>(\"{\\\"Name\\\": \\\"John\\\", \\\"Age\\\
    \": 30, \\\"YearOfBirth\\\": 1980}\");\n            Console.WriteLine(pers?.Name);\n\
    \        }\n        catch (Exception ex)\n        {\n            Console.WriteLine(ex.Message);\n\
    \        }\n        Console.ReadLine();\n    }\n}\n\n[JsonUnmappedMemberHandling(JsonUnmappedMemberHandling.Disallow)]\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\nNotice that I have added the JsonUnmappedMemberHandling\
    \ attribute and specified that it should be disallowed.\n"
  mdcn: "\n\n表 2 列出了 .NET 或 .NET Core 停止支持的版本。\n\n## 表 2：不再支持的版本\n\n| 版本 | 原始发布日期\
    \ | 支持结束 |\n| --- | --- | --- |\n| .NET 5 | 2020年11月10日 | 2022年5月10日 |\n| .NET\
    \ Core 3.1 | 2019年12月3日 | 2022年12月13日 |\n| .NET Core 3.0 | 2019年9月23日 | 2020年3月3日\
    \ |\n| .NET Core 2.2 | 2018年12月4日 | 2019年12月23日 |\n| .NET Core 2.1 | 2018年5月30日\
    \ | 2021年8月21日 |\n| .NET Core 2.0 | 2017年8月14日 | 2018年10月1日 |\n| .NET Core 1.1\
    \ | 2016年11月16日 | 2019年6月27日 |\n| .NET Core 1.0 | 2016年6月27日 | 2019年6月27日 |\n\n\
    当我们谈论长期支持 (LTS) 和标准期限支持 (STS) 时，我们指的是两种完全不同的发布周期。这些周期定义如下：\n\n- 长期支持：在初始发布后支持三年。\n\
    - 标准期限支持：在初始发布后支持 18 个月。\n\n你会发现奇数版本发布是 STS 版本，而偶数版本发布是 LTS 版本。因此，你也可以这么说：\n\n\
    ```\nif (version % 2 is 0)\n{\n    Console.WriteLine(\".NET \" + version + \"\
    \ is a Long Term Support (LTS) release.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    .NET \" + version + \" is a Standard Term Support (STS) release.\");\n}\n```\n\
    \n图 6：一段俏皮的代码\n\n说正经的，发布周期让开发者和企业在规划路线图时能够提前做好准备。要获得支持，你需要安装最新的补丁更新。这意味着如果你正在运行\
    \ .NET 6，你必须确保第一步已经安装了 .NET 6.0.x。\n\n值得注意的是以下服务策略，它们对于 LTS 和 STS 版本是相同的。\n\n\
    ## 预览版 (Preview)\n\n预览版本通常提供给开发者进行测试。这在正式发布之前进行，但微软不提供支持。\n\n## 上线版 (Go-live)\n\
    \n这些版本在生产环境中受微软支持。上线版本是候选构建版本 (RC)，通常在正式可用 (GA) 版本之前发布。\n\n## 活跃支持 (Active support)\n\
    \n在此支持期间，将提供更新以改进功能并缓解任何安全漏洞。在功能改进方面，这些通常包括修复已报告的崩溃、性能问题、错误，以及增加新硬件平台或操作系统版本的支持。\n\
    \n## 维护支持 (Maintenance support)\n\n在此阶段，.NET 版本仅通过更新来缓解安全漏洞。任何版本（LTS 和 STS）的最后六个月被视为维护支持期。一旦维护支持结束后，该版本即被认为不再支持。\n\
    \n## 生命周期终结 (End of life)\n\n当一个版本达到生命终结时，微软不再为该版本提供修复或更新。如果你使用已到终期的 .NET 版本，你的软件和数据将面临风险。\n\
    \n## .NET 8 中的变化\n\n由于 .NET 8 是长期支持版本，它将获得持续的支持。\n\n> 注意：你可以在此处下载 .NET 8。\n\n\
    这使得现在进行升级是非常值得的。如果你需要更多说服力，请考虑以下更改和改进。\n\n## .NET 运行时\n\n在性能、垃圾回收、核心和扩展库方面进行了许多改进（让人想起\
    \ .NET 7 的发布）。我想重点介绍其中的几个。\n\n## 垃圾回收 (Garbage collection)\n\n.NET 8 版本包含了动态调整内存限制的能力。在云服务场景中，需求可能会突然增加然后再次下降。这些服务的成本效益取决于它们在多大程度上扩展和缩小资源消耗以满足需求的波动。\n\
    \n我认为，随着需求的波动，缩容（scaling down）并不像扩容那么重要。这意味着当检测到需求减少时，资源可以通过减少其内存限制来缩容。\n\n然而，在\
    \ .NET 8 之前，这种缩容将会失败，因为垃圾回收器感知不到任何变化，并且可能会分配比新限制更多的内存。通过调用 `GC.RefreshMemoryLimit()`，你可以将垃圾回收器更新为新限制。\n\
    \n不过，有几点限制需要注意：\n\n- 在 32 位平台上，如果尚未建立硬性限制，则无法建立新的硬限制。\n- `GC.RefreshMemoryLimit()`\
    \ 可能会失败并返回非零状态码。这是因为缩容被认为过于激进，没有留下足够的内存供垃圾回收工作。在这种情况下，调用 `GC.Collect(2, GCMode.Aggressive)`\
    \ 可能会通过缩小当前内存占用来解决问题，允许你调用 `GC.RefreshMemoryLimit()`。\n- 将内存限制扩展到垃圾回收器认为进程可以处理的范围之外允许\
    \ `GC.RefreshMemoryLimit()` 成功，但它不会使用超过垃圾回收器感知限制的内存。\n\n代码列表 1 中的以下代码说明了如何设置限制。\n\
    \n代码列表 1：设置内存限制\n\n```\ninternal class Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        AppContext.SetData(\"HeapLimit\", (ulong)100 * 1024 *\
    \ 1024);\n        GC.RefreshMemoryLimit();\n    }\n}\n```\n\n如果 `GC.RefreshMemoryLimit()`\
    \ 失败，将抛出 `InvalidOperationException`。这是因为硬限制低于垃圾回收器感知的限制。\n\n"
