    # SearchValue<T>


    .NET 8 now also includes a new SearchValues<T> type. Methods such as MemoryExtensions.ContainsAny,
    checks to see if a value is contained in a collection, have been modified to add
    new overloads to accept an instance of this new type.


    This means you can now do this in Code Listing 19. I have created an instance
    of SearchValues<char>, but you can also have an instance of SearchValues<byte>.


    # Code Listing 19: The New SearchValues Type


    ```

    var strSear = @"^:\|?*";

    SearchValues<char> illegalChars = SearchValues.Create(strSear);


    var fileName = @Important_|File.txt";n

    var illegal = fileName.AsSpan().ContainsAny(illegalChars)

    // illegal = true

    ```


    You might be wondering why this new type matters. Well, as it turns out, when
    you create an instance of this type, everything that is required to optimize subsequent
    searches is derived. Having all this work up front means a performance boost for
    your code.


    In fact, just have a look at the .NET Runtime repo on GitHub and search for the
    term SearchValue. You will see that Microsoft is using the new SearchValue type
    a bit.


    ![](img/7b8ba6070e5beefbf599660730ba1d42_35_0.png)


    Figure 20: The .NET Runtime Using SearchValues


    This means that your code will also get this performance improvement for free,
    by upgrading to .NET 8.'
