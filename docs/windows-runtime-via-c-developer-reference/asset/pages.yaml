    [DataMember(Name = "access-token")

    public string AccessToken { get; set; }

    [DataMember(Name = "token-type")

    public string TokenType { get; set; } }

    }

    ```


    > 9 Means that you cannot use WNS for apps that are not in the store, such as
    enterprise side-loaded apps.


