    # # Background task cancellation


    While a task is running, Windows might want to cancel it prematurely (before it
    runs to completion). Windows notifies your of this by raising IBackgroundTaskTaskInstance.Cancelled
    event. Your background task should register a callback method with this event
    as soon as it starts executing. If Windows wants to cancel your task, it invokes
    this callback method, passing a BackgroundTaskCancellationReason enum (as shown
    in Table 9-6) that identifies why Windows wants to cancel the task. Your callback
    method has 5 seconds to cancel the task or Windows simply terminates the process.


    TABLE 9-6 BackgroundTaskCancellation enum values and their meanings.


    | Value | Description |

    | --- | --- |

    | LoggingOff | The user is logging off. |

    | Uninstall | The package is being uninstalled. |

    | ServicingUpdate | The package is being updated to a new version. |

    | Abort | TaskRegistration.Unregister method was called, passing true. |

    | Terminating | Process lifetime management is killing the process. This happens
    only for tasks running in the app host, not in BackgroundHost.exe. |

    | IdleTask | The task is "running" but is not using any CPU or network resources.
    The system cancels it so that the PC can go into a low-power mode. |

    | ConditionLoss | One or more conditions become unavailable. |

    | SystemPolicy | The app has too much resource pressure, such as memory consumption.
    |

    | QuietHoursEntered | The PC entered quiet hours as set in Settings > Search &
    Apps > Notifications. |


    > * Alarms and lock-screen calls do not respect quiet hours. Quiet hours are not
    engaged if you are actively using the PC. When Quiet hours starts, background
    tasks are canceled, and are restarted when Quiet Hours ends.


    Long-running background tasks that appear to be "hanging" to the system can prevent
    Windows from entering or remaining in connected standby. This has an negative
    impact on the system''s battery life. For example, when Windows is ready to enter
    connected standby, it waits for several minutes for the background task to respond
    or give any sign of life by executing some code. If that happens, Windows considers
    the task as hanging, creates a dummy file, and kills the task. These hangs show
    up in the Windows Store dashboard. Background tasks can appear to be hanging for
    different reasons. For example, it can happen there''s a bug in your code where
    you forget to complete a deferral or Windows is waiting on a slow or unresponsive
    Internet connection or server. Hence, the recommendation for background tasks
    is that they are not long-running: start the task on a trigger, do your work,
    and exit.'
