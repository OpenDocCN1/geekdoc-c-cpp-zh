    # # Updating your app


    After looking at your telemetry in the Dashboard, you might have to fix a failure.
    Or maybe your users are asking for new features that you''re ready to add. Once
    you''ve built a new release of your app, you need to submit it to the Windows
    Store. In the App Details section, you can create a new release by selecting the
    Packages link and uploading the new version of your app files. At that point,
    the Windows Store team will validate your app again, just as it did for the first
    release.


    Note that you don''t have to change your app''s bits for a new release. You can
    change any of the metadata, such as description, screenshots, price, category,
    or market, for example. Your app''s new release will still go through certification,
    because the bits haven''t changed it will likely go a lot faster. If you update
    the name of your app, you must submit new package files too. Make sure you mention
    the changes in the Notes To Testers page. Any change to your app''s information
    appears as an update to your users.


    > Note Developers frequently ask if there is a way your app can know if a newer
    version is available in order to prompt users to upgrade. Although there is nothing
    built into Windows to allow this, you can always create your own web server and
    have your app contact it requesting the latest version of your app that''s available.
    The result can be compared Package.Current.Id.Version.


    You have a Windows 8 version of your app as well as a Windows 8.1 version. There
    is a restriction over your app''s versioning, your app''s Windows 8 version number
    can never be higher than your app''s Windows 8.1 version number. The recommendation
    is to increase at least your app''s minor version number for the 8.1 release,
    which will give your Windows 8 plenty of room for updates.


    If you want to remove your app from the Windows Store, you need to submit a new
    version of the app and leave all the market options unselected. If your developer
    account expires, users who previously acquired your app are always able to reacquire
    it, but your app will not be acquirable by


