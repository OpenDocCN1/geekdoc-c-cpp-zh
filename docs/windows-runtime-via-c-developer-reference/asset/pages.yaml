  md: "# Package data and roaming\n\nAlmost every app requires the access to maintain\
    \ state on behalf of itself and the user. Typically\n\nUsing package data is quite\
    \ simple. You just need to work with the ApplicationData class, which looks like\
    \ this:¹\n\n```\npublic sealed class ApplicationData {\n  // Call this first to\
    \ access your package's ApplicationData object\n  public static ApplicationData\
    \ Current { get; }\n\n  // Returns a folder to the package's temporary file store\n\
    \  // NOTE: The files in this folder may be destroyed by the system at any time\n\
    \  public StorageFolder TemporaryFolder { get; }\n\n  // Members to access data\
    \ that always resides on the user's PC\n  public ApplicationDataContainer LocalSettings\
    \ { get; }\n  public StorageFolder LocalFolder { get; }\n\n  // Members to access\
    \ data that can roam across all of the user's PCs\n  public ApplicationDataContainer\
    \ RoamingSettings { get; }\n  public StorageFolder RoamingFolder { get; }\n  public\
    \ UInt64 RoamingStorageQuota { get; }\n  public void SignalDataChanged();\n  public\
    \ event EventHandler<ApplicationData, Object> DataChanged;\n\n  // Members related\
    \ to versioning the package's data.\n  // Typically used when the user upgrades\
    \ to a new version of the package.\n  public UInt32 Version { get; }\n  public\
    \ IAsyncAction SetVersionAsync(\n    UInt32 desiredVersion, ApplicationDataSetVersionHandler\
    \ handler);\n```\n\n> ¹ It's a shame this class isn't called PackageData to more\
    \ accurately reflect that the data is associated with the package, not with an\
    \ individual app."
  merge: -1
  pgno: 102
- img_proc: true
  md: "```\n// Members that clear all (or some) of the package's per-user data\npublic\
    \ IAsyncAction ClearAsync();\npublic IAsyncAction ClearAsync(ApplicationDataLocality\
    \ locality);\n}\n```\n\nFor your app to access its package data, it must first\
    \ gain access to its package data\nrepositories by querying ApplicationData.Current's\
    \ property:\n\nApplicationData appData = ApplicationData.Current;\n\nOnce you\
    \ have a reference to your package's ApplicationData object, you can access all\
    \ the\nclass' instance members. The next thing you must decide is the locality\
    \ of the data. Here is a descrip-\nof the three data localities:\n\n+   - Temporary\
    \ Use this locality like a cache. It is typically store in there that is\ncostly\
    \ or time consuming to acquire. Once you acquire the data, you store it in a file\
    \ in the\nTemporaryFolder. Note that any files you store in this folder can be\
    \ destroyed at any\ntime, even when your app is still running. The system has\
    \ a scheduled task that runs\nweekly to clear this data out. A user can modify\
    \ the frequency of this using the Windows Task\nScheduler. The scheduled task\
    \ is Microsoft\\Windows\\ApplicationData\\TemporaryState.\nIn addition, you can\
    \ also run Windows' Disk cleanup (CleanMgr.).\n- Local Use this locality for data\
    \ you need to persist. The system will never destroy whatever\ndata you put here\
    \ unless the user uninstalls your package.\n- Roaming Use this locality for data\
    \ you want the system to automatically copy across the\nuser's PCs. Windows Store\
    \ apps are licensed to a user, and a user is allowed to install a single\napp\
    \ on many PCs. This locality ensures your package's data to be the same across\
    \ all the user's\nPCs using an eventual consistency model. The \"Roaming package\
    \ data\" section later in this\nchapter explores the details of using this locality.\n\
    \nOnce you've decided the locality of the data, then decide how to store and access\
    \ it. There are\ntwo ways of storing data:\n\n+   - Settings Settings is a dictionary\
    \ of key/value pairs. Each key is a string (up to 255 characters\nlong) representing\
    \ the name of a setting, and the value is some WinRT type or a single\ndimension\
    \ array of these types is no more than 8 KB in size. Settings is not just a collect-\n\
    of key/value pairs; it is a hierarchical collection of counters (up to 32 levels\
    \ deep). That is,\ny can create a tree of counters to store key/value pair collections,\
    \ allowing you to organize\nyour package's data however you like.\n- Storage folder\
    \ Storage folders are for items inappropriate for settings, such as items over\n\
    8 KB in size and items you want to treat as files (images, videos, music). You\
    \ can create what-\never files you want in these folders; you can create subdirectories,\
    \ allowing you to organiza\nize your data hierarchically. In the files, you can\
    \ store whatever data you would like. Files really\n arrays of bytes, but you\
    \ can use .NET data types if you make them serializable and\nthen use .NET mechanisms\
    \ (like DataContractSerializer) to serialize the objects"
