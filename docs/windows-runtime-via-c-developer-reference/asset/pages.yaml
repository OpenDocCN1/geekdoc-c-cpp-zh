    Developers commonly ask which language or framework is the best one to use when
    building a Windows Store app. For the most part, Microsoft encourages developers
    to use what they already know. The WinRT API is equally exposed to the three technology
    stacks, but there are reasons you might prefer one over another:


    +   **Performance** Although .NET and JavaScript have a runtime with conveniences
    such as garbage collection and runtime compilers, C++ does not. For most situations,
    the penalty of these runtimes is negligible—especially if you understand how the
    runtime and the interoperability layer work. However, at times this can become
    a determining factor. For example, you can write simple canvas games in HTML and
    JavaScript; but for real-time action games, C++ and DirectX is frequently a better
    choice.


    +   **Legacy and third-party code** You might choose a technology stack because
    you already have some existing code in a particular language. You can deploy a
    library privately inside your Windows Store app package, and that code will run
    inside your app container. This means it has to abide by the same principles and
    it won''t be able to make Win32 or .NET calls that are not on the approved list.


    +   **Sharing** You might choose a technology stack because you want to write
    code once and share it across different apps. For example, you might write code
    in C# because you want to use the same logic in JavaScript app as well as in a
    Windows Phone or ASP.NET, or you might choose JavaScript to share code in a Windows
    Store app and on a webpage.


    +   **Framework** Each technology stack has strengths in different areas. For
    example, if you need to process a log of XML, .NET is a good choice because of
    LINQ-to-XML support. Similarly, C++ allows the use of STL or BOOST libraries and
    JavaScript allows the use of jQuery libraries, simplifying HTML document management.


    +   **IP protection** Windows Store apps written in JavaScript ship the actual
    source code (js files) inside the package. This means that the source files end
    up on the user''s system where savvy users can find and explore their contents,
    while Windows will not load the application if any of its files are modified.
    Similarly, .NET apps ship with assemblies whose Intermediate Language (IL) can
    easily be decompiled. This is new for .NET apps. C++ is compiled to machine language,
    which is the most difficult to reverse engineer.


    Windows Store apps written in JavaScript, HTML, and CSS run in an environment
    that is subset of Internet Explorer''s. So Windows Store apps have access to more
    features than a normal website. See http://msdn.microsoft.com/en-us/library/windows/apps/hh465143.aspx
    for more information.


