    \nIt is recommend that apps populate a DataPackage in 200 milliseconds or less.\
    \ Acquiring some data can be time consuming (for example, if data needs to be\
    \ downloaded, compressed, or encrypted). In addition, it would not be good to\
    \ allocate a lot of memory for some data if the target app is not going to consume\
    \ it. To address these two concerns, Windows supports delayed rendering of a DataPackage's\
    \ format data method. This method allows you to specify a data format and a delegate\
    \ referring to a callback method. However, Windows invokes the callback method\
    \ only when the data associated with this data format is requested. This allows\
    \ the data to be acquired on demand because a target app really wants the data.\
    \ Of course, you can call SetData-Multiple times, once for each different data\
    \ format.\n\nHere is an example showing how a callback method can perform its\
    \ time-consuming or memory-intensive task to acquire the requested data:\n\n```\n\
    // I made this method 'async' and use a deferral because it's likely that it will\
    \ want\n// to await I/O operations, which is why it is time consuming to acquire\
    \ the data\nprivate async void DataProviderHandler(DataProviderRequest request)\
    \ {\nDataProvider Deferral = request.GetDeferral();\ntry {\n    switch (request.FormatId)\
    \ {\n        case \"Bitmap\": // Perform memory intensive or await time consuming\
    \ task here;\n            request.SetData(data);\n            break;\n    }\n\
    } finally {\n    deferral.Complete();\n}\n}\n```"
