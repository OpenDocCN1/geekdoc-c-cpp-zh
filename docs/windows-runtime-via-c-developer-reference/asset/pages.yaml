  md: 'WinRT has a Windows.ApplicationModel.DataTransfer.Clipboard class that apps
    use to manipulate the clipboard. Because Windows has only one clipboard, the class
    is a static class:


    ```

    // Static class since there is only one system clipboard

    public static class Clipboard {

    // Methods called by source apps;

    public static void Clear(); // Puts an empty DataPackage on the clipboard

    public static void SetContent(DataPackage content); // Replaces any existing content

    public static void Flush(); // Keeps on clipboard even if app terminates


    // Methods called by target apps;

    public static DataPackageView GetContent(); // Returns read-only view of DataPackage

    // Raised when contents change (target apps use this to know if paste is possible)

    public static event EventHandler<object> ContentChanged;


    }

    ```


    **Important** To keep the clipboard under the user''s control, an app might call
    Clipboard''s methods from a GUI thread when the app is in the foreground or only
    if the app is running under a debugger. This prevents other apps or background
    tasks from erasing the clipboard''s contents unexpectedly.


    Here is code executed by a source app that creates and initializes a DataPackage
    object and puts it on the clipboard:


    ```

    private void PutDataPackageOnClipboard(DataPackageOperation operation) {

    DataPackage dp = new DataPackage();

    // Set properties;

    dp.Properties.ApplicationName = Package.Current.DisplayName;

    dp.Properties.Title = "DataPackage Title";

    dp.Properties.Description = "DataPackage Description";

    dp.RequestedOperation = operation; // None, Copy, Move, or Link


    // Add data formats;

    dp.SetText(m_txt.Text); // Pulling text from a TextBox


    // Optional: register event handlers;

    dp.Operation += OnCompleted; // Mandatory for Move so source can delete data

    dp.Destroyed += OnDataPackageDestroyed;


    // Put DataPackage on clipboard. NOTE: The Clipboard makes a copy of the package;

    // changes to the DataPackage object do not impact what''s already on the clipboard.

    Clipboard.SetContent(dp);

    }

    ```'
