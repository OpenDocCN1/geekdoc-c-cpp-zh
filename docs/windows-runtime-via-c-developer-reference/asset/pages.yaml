  md: 'When the user activates toast, the system resumes your app (if suspended),
    raises the Activated event,6 and calls the OnLaunched method. When the user dismisses
    a toast, the system raises the Dismissed event if your app is running. If your
    app is not running, the Dismissed event is raised after you resume your app.7
    Additionally, your Dismissed event handler passes a PassedDismissedEventArgs parameter
    indicating how long the toast lasted (the user canceled it, the toast timed out,
    or your app called ToastNotifier:hide method). Note that the system raises these
    events on non-UI threads, so you must marshal to the GUI thread if you want to
    update the UI in response to these events. The system will not raise any of these
    events if your app is terminated; the system will launch your app and call its
    OnLaunched method.


    When preparing the XML template, you need to specify how long the toast should
    appear for the user before automatically dismissing itself. By default, toast
    notifications appear for a short duration of seven seconds; the alternative is
    a long duration of 25 seconds. Typically, you use short duration toasts that do
    not require the user to launch your app—for example, the arrival of new email
    or a social media update. On the other hand, long-duration toasts are more appropriate
    for when someone is waiting, or when someone is initiating a chat message or is
    on a phone call.


    When displaying a notification, the system can also play a sound. To do this,
    you need to set the toast template "audio element". By default, this is a one-time
    sound, which is appropriate for short-duration toasts such as email notifications
    or appointment reminders. Unless your app can specify its own custom sounds, you
    can choose from a predefined set of system sounds. Your app can also specify that
    the toast needs to play the audio in a loop (loop=true), which requires the toast''s
    duration to be long.


    # Showing a toast notification at a scheduled time


    When your app is in the foreground, the usefulness of showing toast notifications
    is somewhat limited. The purpose of toast notifications is to notify the user
    of something important happening in an app that is not in the foreground. For
    this, your app can show a toast from a background task that runs when certain
    events happen, such as login or a network status change (Chapter 9). Additionally,
    your app can schedule a toast to pop up at a very specific time—for example, an
    appointment reminder. Here is how to schedule a toast to display one hour when
    the code executes:


    ```

    ScheduledToast scheduledToastNotification = new S2ScheduledToastNotification(toastXml,

    DateTimeOffset.UtcNow.AddHours(1), // Delivery time

    TimeSpan.FromMinutes(1), // Snooze interval (minimum=1 minute)

    2) { Id = "Messaging" }; // Max display count & ID

    ```


    tn.AddToSchedule(scheduledToastNotification);


    > 6 The Activated event''s signature indicates indicates that it passes a ToastNotification
    and Object; however, you can cast the argument to a ToastActivatedEventArgs and
    query its Properties to see which ToastNotification was activated.


    > 7 Interestingly, the system raises the Dismissed event before the Resuming event.
    Thus you need to be careful with assumptions about the state of your app if it
    does anything in the Resuming event handler.'
