  md: 'If you intend to distribute your package via the Windows Store, you should
    go to the Windows Store, reserve a name for your package, and use Visual Studio’s
    Associate App with the Store wizard to associate your package with your reserved
    package name. When you do this, Visual Studio automatically updates these manifest
    values: Package Name, Package Display Name, Publisher, Publisher Display Name,
    Version, and Application Display Name (on the designer''s Application tab). If
    you intend to deploy your app via the Windows Store, you can change these manifest
    values manually whenever you like.


    **Package Display Name** is the friendly name that users use in the Windows Store.
    The Windows Store requires that every package has a unique package display name.
    This was done to prevent a malicious person from producing a “Finance” app that
    has the same name and feel as a respectable company’s “Finance” app, thereby spoofing
    the user to enter her personal financial data into the malicious app, where it
    can be stolen and abused.


    **Version** identifies the major, minor, build, and revision numbers that you
    want to associate with your app’s package. We will talk about this more when we
    discuss creating an app''s.


    **Publisher** is the certificate that Visual Studio uses when signing the package
    file. This changes when you create a new project in Visual Studio, Visual Studio
    creates a certificate whose subject is the name of the user logging in to Windows.
    However, you can always generate a new certificate on your local machine, use
    a certificate obtained by your company, or obtain a certificate from the Windows
    Store as- associating your app with the Windows Store.


    **Publisher Display Name** is the friendly name of the publisher. When you create
    a new project in Visual Studio, Visual Studio sets the Publisher Display Name
    to the name of the user logging in to Windows. When you associate an app with
    the Windows Store, the Publisher Display Name is set to the value you entered
    in the Publisher field in the Windows Store dashboard.


    **Package Name** is a computed read-only value that is generated by concatenating
    two values: the Package Name and the Publisher ID. The Publisher ID is produced
    by creating a hash value for the Publisher string and then base 32-encoding this
    hash value. The result is a 13-character string that uniquely identifies the publisher
    (statistically). A package family name uniquely identifies a package from a specific
    publisher. Here is an example of my app, called Clips & Pieces: “JeffreyRichter.ClipsPieces_ape9sgs6w87m”.


    **Generate App Bundle** handles not to do with your package’s identity. It tells
    Visual Studio how to generate a package file or files. I explain what an app bundle
    package is in “Creating a bundle file section”.


    In addition to the *package family name*, there is also a string referred to as
    the *package full name*. The package full name is a concatenation of the package
    name, its version, its CPU architecture (x86, x64, ARM, or Neutral), a Resource
    ID (usually an empty string,”), and the Publisher ID. Here is an example of my
    app’s package full name: “JeffreyRichter.ClipsPieces_1.0.0_neutral_ape9sgs6w87m”.
    Most packages do not specify a Resource ID (in fact, Windows does not interpret
    this value),


