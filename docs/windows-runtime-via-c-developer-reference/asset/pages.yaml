    by the App''s Suspending event, giving your app a chance to save its state. However,
    in the future, when your app is launched you should not restore your app''s state
    because the user has explicitly taken action as opposed to the OS implicitly terminating
    your app. If you check the PreviousExecutionState, you''ll see that in these scenarios,
    it returns ApplicationExecutionState.ClosedByUser.


    Users also forcibly kill an app using the Task Manager and, of course, an app
    can kill itself by throwing an unhandled exception. Windows will automatically
    kill an app if it''s running when the user unalls it or if the system updates
    to a new version. In all these scenarios, when the app relaunches in the future,
    it should initialize itself and not restore any previous state state might have
    gotten corrupted, which is what might have caused the unhandled exception in the
    first place. If you check the PreviousExecutionState property, you''ll see that
    in these scenarios, it returns ApplicationExecutionState.Running.


    > 8 This does not make sense for every app. For some apps, if they are suspended
    for a long time, the user might not remember or about what she was doing with
    the app, your app can initialize itself and not restore your previous user state.
    You might take this approach for a newspaper app where the article might be state
    or a weather app where the data is state.


    > 9 SetNavigationState internally calls the page''s OnNavigatedTo to update its
    UI.


