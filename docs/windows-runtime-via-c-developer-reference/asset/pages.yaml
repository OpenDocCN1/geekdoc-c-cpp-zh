    The main purpose of an operating system is to abstract hardware devices to the
    application developer. For example, a PC can store files on a hard disk, an SSD
    drive, a USB drive, a DVD, a network share, and so on. The OS abstraction for
    this is a file, and an app developer can simply write code that opens a file and
    reads it. The app developer does not have to know what kind of hardware device
    contains the file and how to communicate with that. If you look closely at the
    WinRT APIs, you''ll see that many of them are abstracting hardware devices—although
    there are a few APIs (like the Application Model APIs) related to managing your
    app within the system.


