  md: "If you have objects more complex than the primitive types supported by DataWriter\
    \ and DataReader, you're probably best off using .NET serialization technology\
    \ (such as the Data-ContractSerializer or the DataContractSerializer) to convert\
    \ the objects to a byte array or JSON string first, and then you can write this\
    \ to a stream. Later, you can read it back from the stream and deserialize the\
    \ byte array back to an object graph.\n\n# # Performing transacted write operations\n\
    \nImagine you're writing an app that allows the user to enter some data and then\
    \ write the data to a file, while saving the user's data, your app crashes or\
    \ the power goes out, the file's contents are incomplete and your app might not\
    \ be able to read the file back successfully. To make matters worse, what if the\
    \ user was saving the new data in an existing file. Now the old data is destroyed\
    \ and the new data is corrupt.\n\nTo address this problem, WinRT allows you to\
    \ perform file operations in a transacted fashion. That is, either the entire\
    \ write occurs or none of it. When writing data to a file, you should use the\
    \ technique shown in this section to guarantee the consistency of data. The reason\
    \ not to use this technique is that it temporarily requires some additional disk\
    \ space, and if you are making changes to a large existing file, there is a performance\
    \ impact.\n\nTo start, you must first open a file with transacted access by calling\
    \ IStorageFile.Open-TransactedWriteAsync method. This method returns a StorageStreamTransaction\
    \ object:\n\n```\npublic sealed class StorageStreamTransaction : IDisposable {\n\
    \    public IRandomAccessStream Stream { get; }\n    public IAsyncAction CommitAsync();\n\
    \    public void Dispose();\n}\n```\n\nOnce you have this object, all you need\
    \ to do is query its Stream property, which returns an IRandomAccessStream. You\
    \ get this interface back when you call IStorageFile.OpenAsync method. With the\
    \ IRandomAccessStream, you can use all the techniques discussed in this chapter.\
    \ For example, you can use the IRandomAccessStream when constructing DataWriter\
    \ and DataReader objects.\n\nThe first time you write data to the stream, WinRT\
    \ creates a hidden file in the same directory as the original file and your writes\
    \ go into this file. For example, if the original file is named \"myfile.txt\"\
    , the hidden file is called \"myfile.txt~tmp\". This temporary file is filled\
    \ with a copy of the original file's bytes up to the offset where you start new\
    \ data. Depending on what offset you start writing, there could be a performance\
    \ impact on your app while bytes are being copied. After copying the bytes, any\
    \ new data is written to the temporary file. If your app crashes or if a power\
    \ failure occurs, the original file is left untouched and the user still has access\
    \ to the original file."
  merge: -1
  pgno: 153
- img_proc: true
  md: "Once your app has finished writing to the temporary file stream, you call StorageStreamTransaction's\
    \ CommitAsync method. This method copies any unchaged bytes from the temporary\
    \ file, and then atomically deletes the original file and renames the temporary\
    \ file with the original file's name (calls the StorageFile.RenameAsync method,\
    \ passing NameCollision-ReplaceExisting).\n\nThe following code demonstrates how\
    \ to perform an atomic write operation to a file:\n\n```\nprivate async void TransactedWriter(StorageFile\
    \ file) {\n    // Populate the file with some original data\n    const String\
    \ header = \"Data:\";\n    using (var dw = new DataWriter(await file.OpenAsync(FileAccessMode.ReadWrite)))\
    \ {\n        dw.WriteString(header + \" The original data.\");\n        await\
    \ dw.StoreAsync();\n    }\n\n    // Now, perform a transacted write to the file.\
