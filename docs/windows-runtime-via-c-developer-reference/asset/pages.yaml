    wireframe or grid that gets populated as data flows from the network. In this
    scenario, your app does not require an extended splash screen; the user can start
    interacting with it immediately.


    # Windows Store app suspension


    When the user switches away from your app, the OS suspends all the threads in
    your process. You can see this for yourself in Task Manager (shown in Figure 3-8).
    First, in Task Manager, select the View''s Status Values option and make sure
    that Show Suspended Status is active. Then launch multiple Windows Store apps.
    After a few seconds, Task Manager shows a status of Suspended for any apps whose
    threads are suspended. For suspended apps, you''ll also notice that their CPU,
    Disk, and Network consumption all go to 0. Of course, memory is not impacted because
    these apps are still resident in memory.'
