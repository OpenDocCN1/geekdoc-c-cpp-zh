    \ license is purchased, you can always acquire the receipt string by calling CurrentApp(Simulator)'s\
    \ GetProductReceiptAsync method.\n\n# Purchasing consumable in-app products\n\n\
    An app can sell in-products from within the app itself. Consumable in-app products\
    \ are similar to durable products except that do not expire based on time. For\
    \ example, a user might purchase a hint or power to get past a difficult part\
    \ of a game. A user can purchase several of these repeatedly; they expire when\
    \ used (not based on time). Consumable products behave differently than durable\
    \ products. Consumable products are not licensed, so you do not query CurrentApp.LicenseInformation\
    \ to see if a consumable product has been purchased. This also means that information\
    \ about consumable products does not automatically roam across the user's PCs.\
    \ So your app is responsible for managing consumable products. For example, you\
    \ must do the extra work yourself to get information about consumable products\
    \ to roam across the user's PCs. For this, you'll probably want to use Windows'\
    \ roaming data feature discussed in Chapter 4, \"Package data and roaming.\"\n\
    \n> Important Make sure you roam the user's consumable products properly. You\
    \ will receive customer complaints if purchased consumable products are not available\
    \ across all the user's PCs. Make sure you test this scenario. Also, a user may\
    \ uninstall a package and re-install it later. Again, any consumable products\
    \ previously purchased must remain available after the re-install. You should\
    \ test this scenario. You should also test the scenario when a user cancels a\
    \ purchase; do not accidentally grant the user the consumable product and be sure\
    \ to indicate to the user that the product was not purchased."
