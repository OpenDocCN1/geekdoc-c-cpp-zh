  md: "GetFileAsync method. This interface does not provide a GetAwaiter method, so\
    \ the compiler looks for an extension method. Fortunately, the .NET Framework\
    \ team has provided a bunch of extension methods that are callable when you have\
    \ one of WinRT's IAsyncXXX interfaces:\n\n```\nnamespace System {\n    public\
    \ static class WindowsSystemServiceExtensions {\n        public static TaskAwaiter\
    \ GetAwaiter(\n            this IAsyncAction source);\n        public static TaskAwaiter\
    \ GetAwaiter<TProgress>(n            this IAsyncWithProgress<TProgress> source);\n\
    \        public static TaskAwaiter<TResult> GetAwaiter<TResult(\n            this\
    \ IAsyncOperation<TResult> source);\n        public static TaskAwaiter<TResult>\
    \ GetAwaiter<TResult, TProgress>(n            this IAsyncOperationWithProgress<TResult,\
    \ TProgress> source);\n    }\n```\n\nInternally, these methods construct a TaskCompletionSource\
    \ and tell the IAsync object to invoke a callback that sets the TaskCompletionSource's\
    \ final state when the asynchronous operation completes. The TaskAwaiter object\
    \ returned from these methods is ultimately what C awaits. When the asynchronous\
    \ operation completes, the TaskAwaiter ensures that the code continues executing\
    \ via the SynchronizationContext that is associated with the original thread.\
    \ If the calling thread is a GUI thread, this that the await executes via the\
    \ same GUI thread, the UI to be updated correctly; there's no need to deal with\
    \ CoreDispatcher objects and writing code that marshals callbacks back to the\
    \ GUI thread.\n\nThen the thread executes the C# compiler-generated code, which\
    \ queries the TaskCompletion-Source's Result property, which returns the result\
    \ (a StorageFile in my example) or throws other exception if a failure occurred.\n\
    \n# Cancellation and progress\n\nWhat I've just shown is the common scenario of\
    \ calling an asynchronous WinRT API and discovering its outcome. However, the\
    \ preceding code ignored cancellation and progress updates. To properly handle\
    \ cancellation and progress updates, instead of having the compiler implicitly\
    \ call one of the GetAwaiter extension methods earlier, you must explicitly call\
    \ one of the AsTask extension methods that the WindowsSystemServiceExtensions\
    \ also defines:\n\n```\nnamespace System {\n    public static class WindowsSystemServiceExtensions\
    \ {\n        public static Task AsTask<TProgress>(n            this IAsyncActionWithProgress<TProgress>\
    \ source,\n            CancellationToken cancellationToken, IProgress<TProgress>\
    \ progress);\n\n        public static Task<TResult> AsTask<TResult, TProgress>(n\
    \            this IAsyncOperationWithProgress<TResult, TProgress> source,\n  \
    \          CancellationToken cancellationToken, IProgress<TProgress> progress);\n\
    \    }\n}\n// Simpler overloads not shown here\n```"
