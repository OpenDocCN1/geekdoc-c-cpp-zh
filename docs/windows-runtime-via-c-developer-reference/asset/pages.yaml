  md: 'Here is an example of the proper way to call a WinRT asynchronous method and
    then block the thread until the operation completes:


    ```

    StorageFile file = KnownFolders.MusicLibrary.GetFileAsync("Song.mp3").AsTask().GetResult();

    ```


    The AsyncTask converts the object into a .NET Task (or Task<TResult>) object.
    Then the GetAwait method returns a TaskAwaiter object that knows how to wait for
    the operation to complete. Its GetResult method blocks the calling thread until
    the operation completes, and then it returns the result or throws an exception
    if the operation failed.


    Although you could write the code like this, you should not:

    Storage file = KnownFolders.MusicLibrary.GetFileAsync("Song.mp3").AsTask().GetResult();


    The reason is that querying a Task''s property throws an AggregateException if
    the operation fails instead of throwing the correct exception.


    Be aware that blocking a UI thread with GetAwaiter().GetResult() could potentially
    deadlock the thread, forcing the user or operating system to terminate your app.
    You should really avoid blocking the thread issuing asynchronous operations whenever
    possible.


    # WinRT deferrals


    Many WinRT components offer virtual or interface methods you can implement. Additionally,
    many WinRT classes expose event your app can register callbacks with. When your
    app returns from your methods, Windows believes your code has completed the operation
    and Windows might take some time execution. For example, when your app is about
    to be suspended (discussed in Chapter 3), Windows raises an event to notify your
    app. Upon receiving this notification, you might want to persist app state to
    your hard disk. When you perform this operation asynchronously, the thread returns
    to Windows before the asynchronous operation completes. However, when the thread
    returns to Windows, Windows believes your app has successfully suspended it and
    then suspends all your app''s threads, preventing them from executing any code.


    With this deal, WinRT offers a mechanism known as a *deferral*. A deferral allows
    a method to return to Windows while indicating that the operation is not yet complete.
    This prevents performing the next action. Then later, after your app has completed
    its operation, it completes the deferral, telling Windows it can now perform the
    next action. Deferrals should be used only if your method performs some kind of
    asynchronous operation. Here is some code demonstrating the use of a deferral
    in an app''s suspending event handler:


    ```

    private async void OnSuspending(object sender, EventArgs e) {

    // A deferral tells the Windows thread may return but the work is not done

    var deferral = e.SuspendingOperation.GetDeferral();

    ```'
