    \ to simplify saving and restoring user state in case of app termination. The\
    \ most important part of the code is the following comments:\n\n```\n// Our singleton\
    \ App class; store all app-wide data in this class object\npublic sealed partial\
    \ class App : Application {\n // Invoked because DISABLE_XML_GENERATED_MAIN is\
    \ defined:\n public static void Main(String[] args) {\n  // Invoked via primary\
    \ thread each time the process initializes\n  App.Start(AppInitialization,\n\n\
    \  (F, a) => F.DeserializePageStateAsync(c_FramePageStateFileName, a));\n }\n\n\
    private static void AppInitialization(ApplicationInitializationCallback p) {\n\
    \ // Invoked via main thread\n // But the main view's CoreWindow & Dispatcher\
    \ do not exist yet;\n // they are created by Application.Start after this method\
    \ returns\n\n // Create a singleton App. It never gets GC because the base class\
    \ (Application)\n // holds a reference to it obtainable via Application.Current\n\
    \ var app = new App();\n\nprivate void App() {\n // Invoked via main thread; CoreWindow\
    \ & Dispatcher do not exist yet\n this.InitializeComponent();\n this.Resuming\
    \ += OnResuming; // Raised when main thread resumes from suspend\n this.Suspending\
    \ += OnSuspending; // Raised when main thread is suspended\n // TODO: Add any\
