  md: "# CHAPTER 6\n\n# Stream input and output\n\nn Chapter 5, \"Storage files and\
    \ folders,\" I explained how your app could navigate various storage folders to\
    \ manipulate files. However, I did not explain how to access the contents of the\
    \ files. In this chapter, you'll learn how to transfer data to and from files\
    \ using stream input and output. Streams are not just for files; you use them\
    \ as a general-access mechanism to transfer data. For example, you also use streams\
    \ to transfer data over sockets. (See Chapter 7, \"Networking.\") Streams are\
    \ also used to manipulate in-memory data, as I'll show later in this chapter's\
    \ \"Compressing and decompressing data\" and \"Encrypting and decrypting data\"\
    \ sections.\n\n# Simple file I/O\n\nBefore diving into streams, I want to show\
    \ some WinRT APIs that simplify reading and writing the contents of a file for\
    \ common scenarios. Internally, these APIs wrap the slightly more complex stream\
    \ APIs. The FileIO class looks like this:\n\n```\npublic static class FileIO\n\
    \    public static IAsyncAction WriteBytesAsync(IStoragefile file, Byte[] buffer);\n\
    \n    public static IAsyncAction WriteBufferAsync(IStoragefile file, IBuffer buffer);\n\
    \    public static IAsyncOperation<IBuffer> ReadBufferAsync(IStoragefile file);\n\
    \n    public static IAsyncAction WriteLinesAsync(IStoragefile file, IEnumerable<String>\
    \ lines);\n    public static IAsyncAction AppendLinesAsync(IStoragefile file,\
    \ IEnumerable<String> lines);\n    public static IAsyncOperation<IList<String>>\
    \ ReadLinesAsync(IStoragefile file);\n\n    public static IAsyncAction WriteTextAsync(IStoragefile\
    \ file, string contents);\n    public static IAsyncAction AppendTextAsync(IStoragefile\
    \ file, string contents);\n    public static IAsyncOperation<string> ReadTextAsync(IStoragefile\
    \ file);\n\n```\n\nFiles always contain arrays of bytes, and the first three methods\
    \ shown transfer byte arrays or buffers (which are also byte buffers). The IBuffer\
    \ interface is explained in this chapter's \"Transferring byte buffers section.\"\
    \ The remaining methods simplify working with text file. Text (characters) are\
    \ always converted to byte arrays via an encoding. The remaining six methods all\
    \ convert the specified string to a byte array using UTF-8 encoding. There are\
    \ overlaps of these six methods (not shown) that allow you to pass a UnicodeEncoding\
    \ parameter. UTF-16 (big-endian and little-endian) are supported."
