  md: "# Writing and reading primitive data types\n\nStreams contain bytes. But in\
    \ our apps, we frequently have other primitive types like Int32s, Strings, DateTimeOffsets,\
    \ and so on. To write any of these to a stream, we would have to decompose each\
    \ one into its constituent bytes. And, to read from a stream, we would have to\
    \ read the right number of bytes and then compose them into an object of the right\
    \ type. In the .NET Framework, we use the System.IO.BinaryWriter and System.IO.BinaryReader\
    \ to store and retrieve primitive data types from a stream. The equivalent WinRT\
    \ classes are the Windows.Storage.Streams.DataWriter and Windows.Storage.Streams.DataReader\
    \ classes. In essence, these provide an abstraction over a byte buffer and stream.\n\
    \nHere is what the DataWriter class looks like (personally, I think my comments\
    \ explain how the class works better than the MSDN documentation:\n\n```\npublic\
    \ sealed class DataWriter : IDWriter, IDisposable {\n    // Constructs a DataWriter\
    \ over a growable buffer (see DetachBuffer below)\n    public DataWriter();\n\n\
    \    // Constructs a DataWriter over an output stream and a growable buffer\n\
    \    public DataWriter(OutputStream outputStream);\n\n    // All WriteX methods\
    \ append data to the buffer (growing it if necessary)\n    public void WriteBoolean(boolean\
    \ value);\n    public void WriteByte(byte value);\n    public void WriteBytes(byte[]\
    \ value);\n    public void WriteBuffer(IBuffer buffer);\n    public void WriteBuffer(IBuffer\
    \ buffer, uint32 start, uint32 count);\n    public void WriteInt16(int16 value);\n\
    \    public void WriteUInt16(uint16 value);\n    public void WriteInt32(int32\
    \ value);\n    public void WriteUInt32(uint32 value);\n    public void WriteInt64(int64\
    \ value);\n    public void WriteUInt64(uint64 value);\n    public void WriteSingle(single\
    \ value);\n    public void WriteDouble(double value);\n    public void WriteGuid(Guid\
    \ value);\n    public void WriteDateTime(DateTimeOffset value);\n    public void\
    \ WriteTimeSpan(TimeSpan value);\n```\n\n```\n// For WriteX methods, indicates\
    \ how bytes are appended to the buffer (big/little endian)\npublic ByteOrder ByteOrder\
    \ { get; set; } // Default=BigEndian\n```\n\n```\n// Strings are encoded using\
    \ UnicodeEncoding (UTF8, UTF16, or UTF32) instead of ByteOrder\nublic UnicodeEncoding\
    \ Encoding { get; set; } // Default=UTF8\n```\n\n```\n// Returns how many bytes\
    \ a string requires when encoded using UnicodeEncoding\npublic uint32 MeasureString(string\
    \ value);\n```\n\n```\n// Appends the string's bytes to the buffer\npublic uint32\
    \ WriteString(string value);\n```\n\n```\n// Returns the current size of the buffer\n\
    public uint32 UnstoredBufferLength { get; }\n```"
