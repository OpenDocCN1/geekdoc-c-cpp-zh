  md: '# Libraries


    Windows, a library is a virtual folder that provides a consolidated view of files
    contained in multiple physical directories. Users can add and remove physical
    directory paths to a library; the physical directories can reside on the local
    system, a network share, or even on removable media. For example, the Music library
    typically contains the %UserProfile%%Music directory, but the user can add a network
    share on a server. Windows creates a database of files and their properties contained
    within the libraries, which allows for rich content searching, filtering, and
    ordering.


    By default, the system has libraries for Music, Pictures, Videos, and Documents.
    Users can create new libraries using the WinRT API allows to access these four.9
    Using the Windows.Storage.Library class, a Windows Store app can allow the user
    to add store folders and remove store folders from a library. An instance of this
    class can also raise an event when the user changes the folders that make up a
    library, allowing an app to rescan the library''s contents.


    Windows Store apps are forbidden from accessing a user''s files unless the user
    allows the app to do it. For an app to traverse the contents of a library, the
    app''s package manifest must first specify in the Capabilities section which libraries
    the package wants to access. Figure 5-7 shows the capabilities related to accessing
    a user''s files. Selecting a library capability in the manifest grants your package
    bulk access to a larger set of user''s files. Your package app must be diligent
    and not abuse this privilege. In fact, packages that use library capabilities
    are scrutinized more stringently than packages that use pickers when submitted
    for Windows Store certification. If you can implement your app using pickers instead
    of capabilities, you should specify library capabilities only when your package
    absolutely requires programmatic access to the user''s files.


    +   Capabilities:

    - Enterprise Authentication

    - Internet (Client)

    - Internet (Client & Server)

    - Location

    - Microphone

    - Music Library

    - Pictures Library

    - Private Networks (Client & Server)

    - Proximity

    - Removable Storage

    - Shared User Certificates

    - Videos Library

    - Webcam


    **FIGURE 5-7** Capabilities in the manifest file to access libraries.


    > 9 Libraries are not actual physical files, and when you programmatically browse
    the system, you will not find them. They are stored as XML files in %UserProfile%\AppData\Roaming\Microsoft\WindowsLibraries.


    PART II Core Windows facilities'
