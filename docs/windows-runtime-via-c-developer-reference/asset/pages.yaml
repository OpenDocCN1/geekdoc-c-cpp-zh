    must also specify what licenses Windows wants to believe the user has so that
    you can test your app. You seed the CurrentAppSimulator with your app and any
    in-app product licenses via the XML file''s LicenseInformation section. Once licenses
    are acquired (or defined in the XML file), your app can acquire and validate them
    by querying CurrentApp(Simulator)''s LicenseInformation property. This property
    returns a LicenseInformation object whose class looks like this:


    ```

    public sealed class LicenseInformation {

