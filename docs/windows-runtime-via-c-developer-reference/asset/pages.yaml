    you''ll see a list of files with a long value and size for each 64-KB compressed
    file of the app. The MakeAppx.exe utility created this AppxBlockMap.xml file.
    Windows uses the AppxBlockMap.xml file to verify the integrity of the app''s files,
    ensuring that no modifications have been made to any of the contents after the
    .appx file was created.


    Another cool feature provided by the AppxBlockMap.xml file is differential. When
    creating a new version of your app, it is common to keep most of your existing
    assets files while modifying just a few of them or including some new assets files.
    When a user installs a new version of your app, Windows uses the AppxBlockMap.xml
    file to see which files have changed and only downloads the portions (blocks)
    that have been updated. This greatly improves the speed of installing a newer
    version of an application and also reduces network usage, resulting in cheaper
    charges for the user.


    Furthermore, if multiple packages share the same files (regardless of publisher),
    the system knows that they are already installed (based the hash values) and creates
    NTFS hard links to the files. This greatly reduces download time and prevents
    the wasting of disk space by having the same files installed multiple times. For
    example, if multiple packages share the same SQLite or Bin Maps files, the files
    will be downloaded once and reside just on the user''s PC. For this reason, you
    should try to use the same files across multiple packages; avoiding special one-off
    builds here and there.


