  md: "// Writes the buffer to the underlying stream & clears the internal buffer\n\
    public DataWriterStoreOperation StoreAsync();\n\n// Returns the buffer the DataWriter\
    \ uses and associates a new empty buffer with it\npublic IBuffer DetachBuffer();\n\
    \n// Disassociates stream; stream will NOT be closed when Dispose is called\n\
    public IOutputByte DetachStream();\n\n// Closes stream (if not detached) does\
    \ NOT call StoreAsync\npublic void Dispose();\n\n// Calls FlushAsync on the underlying\
    \ stream\npublic IAsyncOperation<boolean> FlushAsync();\n\n> To work effectively\
    \ with the DataWriter class, you must really appreciate that only XxxAsync methods\
    \ perform I/O operations and all the other methods cannot perform I/O operations.\
    \ Therefore, all writeXXX methods cannot do I/O; they all append bytes to an in-memory\
    \ buffer. You must periodically call StoreAsync to write the in-memory buffer's\
    \ contents to the underlying stream. And, if you do not call StoreAsync and later\
    \ call Dispose, the contents of the in-memory buffer will not be written to the\
    \ underlying stream and the contents of it will be thrown away. Because Dispose\
    \ is not an asynchronous method, it cannot perform I/O operations and therefore\
    \ cannot internally call StoreAsync for you.\n\nThe following code shows how to\
    \ use a DataWriter to store a byte array and a string into a stream:\n\n```\n\
    private async void DataWriterSample(StorageFile file) {\n    using (var dw = new\
    \ DataWriter(await file.OpenAsync(FileAccess.Read))) {\n        dw.WriteBytes(new\
    \ byte[] { 1, 2, 3, 4, 5 });\n        const string text = \"Some text\";\n   \
    \     // Store the string length first followed by the string we can read it back\
    \ later\n        UInt32 encodedLength = text.Length;\n        dw.WriteUInt32(encodedLength);\n\
    \        dw.WriteString(text);\n        UInt32 bytesStored = await dw.StoreAsync();\
    \ // Commit buffer to stream\n    }\n// Close DataWriter & underlying stream\n\
    ```\n\nHere is what the DataReader class looks like:\n\n```\npublic sealed class\
    \ DataReader : IDataReader, IDisposable {\n    // Constructs a DataReader over\
    \ an existing stream instead of loading a buffer from a stream\n    public static\
    \ DataReader FromBuffer(IBuffer buffer);\n\n    // Constructs a DataReader over\
    \ an input stream and a growable buffer\n    public DataReader(IInputStream inputStream);\n\
    \n    // Reads count bytes from stream appending them to the buffer\n    public\
    \ DataReader LoadOperationAsync(UInt32 count);\n```\n\n128 PART II Core Windows\
    \ facilities"
