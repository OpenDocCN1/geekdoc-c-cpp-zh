  md: "# Implementing an extended (lengthy) share operation\n\nSometimes sharing data\
    \ can be a time-consuming process, especially if the target app is transferring\
    \ files. These scenarios are problematic in Windows Process Lifetime Management\
    \ (PLM) rules. For example, the system will suspend threads in the target app\
    \ if the user is not-acting with it, preventing the app from completing the sharing\
    \ operation. So, when performing an extended (lengthy) share operation, the target\
    \ app must call some additional methods.\n\nSpecifically, after the target app\
    \ has completed its use of the DataPackageView object, it should call ShareOperation's\
    \ ReportDataRetrieved method. This tells Windows that the target app no longer\
    \ needs the source running, allowing the system to suspend or terminate the source\
    \ app. If the app is going to use the background-transfer APIs (discussed in Chapter\
    \ 7, \"Networking\") to transfer files over the network, it should call ShareOperation's\
    \ ReportSubmittedBackgroundTask method. This method tells Windows that the target\
    \ app can be suspended because the transfer operation is now being performed on\
    \ its behalf by the background-transfer manager.\n\n# Share target app quick links\n\
    \nSome apps have \"destinations\" within the app itself. For example, the Mail\
    \ app allows you to send to a specific contact, and a social-networking app might\
    \ allow you to send to a specific person or group. Users intend to share with\
    \ the same destinations over and again. It would be a shame if the user had to\
    \ share with an app and then select the desired destination repeatedly. It would\
    \ be better if the user had to quickly share with an app's destination. Fortunately,\
    \ Windows supports this by using a mechanism called quick links. Quick links appear\
    \ at the top of the Share pane.\n\nAfter a user has successfully shared some data\
    \ with a target app's destination, the target app can construct and initialize\
    \ a QuickLink object:\n\n```\npublic sealed class QuickLink{\n    public QuickLink();\n\
    \    // Mandatory properties:\n    public String Title { get; set; } // Shown\
    \ in Share pane\n    public RandomAccessStreamReference Thumbnail { get; set;\
    \ } // Shown in Share pane\n    public String Id { get; set; } // App-defined;\
    \ passed to target app\n    // via ShareOperation's QuickLinkId propertyn}\n```\n\
    \n+   - At least one of these properties must be indicating the data.formats and/or\
    \ file types that cause the Share pane to show this quick link\n- public IList<String>\
    \ SupportedDataFormats { get; set; }\n- public IList<String> SupportedFileTypes\
    \ { get; set; }\n\nOnce initialized, the QuickLink object can be passed to ShareOperation's\
    \ ReportCompleted method. Now, when the user activates the Share char, if any\
    \ data formats or file types in the Data-Package match the data formats or file\
    \ types in a QuickLink, the system shows the quick link's thumbnail and title.\
    \ If the user selects the quick link, the system activates its target app and\
    \ the App's ShareTargetActivatedEventArgs. This property returns whatever value\
    \ was set in the QuickLink object's Id property. The app can use this to quickly\
    \ share with one of its destinations."
