  md: 'After the Frame object constructs an instance of your Page-derived type, it
    calls the VirtualNavigatedTo method. Your class should override this and perform
    any initialization for the page. When you call Frame''s navigate method, you get
    to pass an object reference as a parameter. Your Page-derived object can get the
    value of this parameter type by querying EventArgs'' read-only property. This
    gives you a way to pass some data from the code when navigating to a new page.
    For reasons that will be described later, in the "Lifespan management" section,
    you will pass be serialized.


    Page objects can be very expensive in memory consumption because pages tend to
    have many controls and some of these are collection controls, which might manage
    many items. When the user navigates to a new Page, keeping all the Previous Pages
    with their child objects in memory can be quite inefficient. This is why the Frame
    object maintains Page types, not instances of Page objects. When the user navigates
    to another Page, the Frame removes all references to it before garbage, freeing
    up what can be a lot of memory. If the user navigates back to a previous page,
    the Frame constructs a new Page object and calls its OnNavigatedTo method so that
    the new Page object can initialize itself, reallocating whatever it needs.


    This is all fine and good but if your Page needs to record some state in being
    garbage-collected and re-initialized? For example, the user might have entered
    text in a TextBox control or selected a specific item in a ListView or GridView.
    When the Page gets collected, all of this is destroyed by the garbage collector.
    So, when the user navigates away from a Page, in the OnNavigatedFrom method, you
    need to preserve the minimum amount of state necessary in order to restore the
    Page back to where it was. This state must be preserved in a place where it will
    not get collected.


    The recommended practice is to have your App singleton object maintain a collection
    of dictionaries; something like a List<Dictionary, Object>. You have one dictionary
    for each page managed by the Frame, and each dictionary contains a key/value pair;
    use one key/value pair for each piece of page state you need to persist. Now,
    because your App singleton stays for the lifetime of the process, it collects
    alive and the collection keeps all dictionaries.


    When navigating to a new page, you add a dictionary to the list. When navigating
    a page, look up your dictionary in the Frame''s BackStack property. Figure 3-4
    shows what objects you should have in memory after the page navigates to Page_A.
    The Frame object has a single Page_A in its collection along with its navigation
    parameter, and our list of dictionaries has just one dictionary in it. Notice
    that the Page_A object can reference the dictionary, but you must make sure that
    nothing in the App singleton object refers to any page object because this prevents
    the page object from being collected. Also, avoiding any of the page''s instance
    methods with external events also prevents the page object from being garbage


    If you are less concerned about memory conservation, you can override this default
    behavior and have the Frame object keep your page objects in memory by setting
    your Page NavigationCacheMode property. Use the SDK documentation for details.


    CHAPTER 3 Process model 61'
