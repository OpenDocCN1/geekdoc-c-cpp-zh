  md: 'Application base class constructor stores a reference to your App object in
    a private static field, ensuring that it never gets garbage collected for the
    entire lifetime of the process. You can always get a reference to your app''s
    Application object by calling Application static current property.


    > **Important** App object is a singleton object that lives throughout the entire
    lifetime of the process. This object is never destroyed, other objects directly
    or indirectly referred by any static or instance fields will prevent other objects
    from garbage collected. Be careful about this because it can be a source of memory
    leaks.


    The App object singleton is created, the primary thread checks the ActivationKind
    value to see why the app is being activated. All activations fall into one of
    two categories: main view activations or hosted activations. (See the last column
    in Table 3-1). Main view activations are what most developers are familiar with.
    A main view activation causes your app''s main window to become the foreground
    window and allows the user to interact with your app.


    Hosted activations are not as familiar to people. In this case, an app can complete
    some operation leveraging functionality by another app. The user interacts with
    Windows to create a new window and then activates the other app. Second app will
    create a small window that gets hosted inside Windows'' big window. This is why
    the activation is called a hosted view activation: the app has been activated
    to be hosted use by another app. An example of a hosted view activation is when
    the user wants to share a webpage with a friend via the Mail app. Figure 3-3 shows
    the News app as the main window the user is interacting with. If the user taps
    the Share chart and selects the Mail app, Windows creates a narrow, full-height
    window on the edge of the user''s screen. The header is displayed by Windows at
    the top of the window. The header contains the back arrow, app name (Mail), and
    logo. Underneath the header is a hosted view created and managed by the Mail app
    itself.


