  md: 'Infact, I have written a few Windows Store apps that specifically do not have
    any network capabilities tied to because I want to assure that my app does nothing
    with any personal data they enter into. Without these capabilities, there is no
    way for an app to transmit a user''s personal data. Table 7-1 shows the various
    capabilities related to networking:


    # **TABLE 7-1** Manifest capabilities related to networking.


    | Capability | Description |

    |---|---|

    | Internet (Client) | Allows outbound and access to the Internet and networks
    in public places. |

    | Internet (Client & Server) | Allows outbound and inbound to/from the Internet
    and networks in public places. This is a superset of Internet (Client). |

    | Private Networks (Client & Server) | Allows outbound and inbound to/from an
    intranet network authenticated by a domain controller or the network user has
    designated as a home or work network. |

    | Enterprise Authentication | Allows the app to access resources that require
    domain credentials. Only Windows Store apps submitted by companies (not individuals)
    can pass certification when using this capability. |

    | Proximity | Allows the app to communicate with other PCs via Near Field Communication
    (NFC) |


    If you''ve ever written a Setup.exe or other installer file, as MSI, for an application
    that access to the network, you probably had to write some code or a script to
    open up the firewall for your application (and, of course, close the firewall
    when your app is uninstalled). As you learned in Chapter 2, "App packaging and
    deployment," Windows Store apps are always installed by the system; there is no
    separate installer app. When Windows installs a Windows Store package, the system
    looks at the manifest file, sees the capabilities, and automatically opens up
    the firewall for the package''s app. You can verify this by going to the firewall
    settings and looking for your package. (See Figure 7-3)


    As explained in Chapter 1, "Windows Runtime primer," Windows Store apps are isolated
    from one another. That is, they cannot communicate with each other, each desktop
    app, or even a service running on the same PC. However, when debugging client/server
    communications, it is convenient to run the client and server applications on
    the same PC. To help developers and testers, Visual Studio exposes a Debug setting
    called "Allow Local Network Loopback." (See Figure 7-4) This setting is for development
    purposes only, and you won''t find this anywhere in the manifest file.'
