  md: 'be a credit card or gift card purchased online or at a retail store. Once users
    purchase an app, they can install it on all their PCs.


    The Store app shows only the apps that are installable on their PCs. So if the
    user is using a Windows RT PC, the Store app will show only apps that can run
    on an ARM CPU. Similar filtering is applied for user languages and age categories.
    If the user uses a Windows 8.1 system, he can see and install apps that are built
    for Windows 8 as well as for Windows 8.1. If both are available, he will see only
    the 8.1 version. Once the user upgrades his system to Windows 8.1, his apps will
    upgrade (if an 8.1 version is available).


    Any app can launch the Windows Store app to show a specific app via the ms-windows-store-protocol.
    Here is an example:


    ```

    ms-windows-store:?PFN=PackageFamily1Name

    ```


    In addition, you can add meta tags to your website, when interpreted by Internet
    Explorer (when not in desktop mode), cause Internet Explorer to show an app bar
    button, allowing the user to open your app (if it is already installed) or navigate
    to your app inside the Windows Store app (if your app isn''t installed). For more
    information about this, see http://msdn.microsoft.com/en-us/library/windows/apps/Hh974767.aspx.


    I''ll start this chapter by walking you through the process of getting your app
    in the Store, monitoring your app in the marketplace, and updating your app. The
    second part of this chapter is about the WinRT APIs you can incorporate into your
    app to use the Windows Store''s commerce engine to sell your app and in-app products.


    # Submitting a Windows Store app to the Windows Store


    Before you can submit your first app, you need to register an account with the
    Windows Store in the Dashboard on the Dev Center. Go to http://dev.windows.com
    and then select Dashboard. The Dashboard is your one-stop shop for all Windows
    Store app needs. It shows your account details, all your apps, your submission
    status, your crash data, and a financial summary. Registering for a Windows Store
    account takes a few days, and you can do this before you prepare your app. You
    register either as an individual or as an enterprise. The Windows Store authenticates
    both types of accounts. To authenticate an individual account, as a developer
    need to validate credit card details. Microsoft debits your credit card with two
    small amounts—$0.05 and $0.11. You then enter these two amounts into the Dashboard,
    and if the debited amounts are authenticated. For an enterprise account, Symantec
    is doing the authentication and, because of additional scrutiny, this might take
    a few days more. If you use the Windows Store''s commerce engine, you also have
    to complete complex forms. Although you can submit apps to the Store without the
    forms, Microsoft will not release your app for users to download.


    > 3 An enterprise account is required if your app requires special-use capabilities
    (such as Documents Library, Enterprise Authentication, and Shared User Certificates).'
