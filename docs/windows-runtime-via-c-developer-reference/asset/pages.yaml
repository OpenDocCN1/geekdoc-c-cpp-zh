    Situations arise when the system or your app runs multiple simultaneously. For
    example, if your app opened a socket to a server with a more mobile broadband
    connection, your app will continue to use that connection even if other networks
    become available. For these scenarios, you can use the NetworkStatusChanged event
    to find out a better connection has become available and re-establish the connection
    within your app''s code. If your app is suspended when a network status change
    occurs, the system will raise the event once your app resumes.


    Although the NetworkStatusChanged event does not indicate what has changed, you
    can get more information if you create a background task triggered by a SystemTrigger
    with a System-TriggerType of NetworkStateChange. However, when this executes,
