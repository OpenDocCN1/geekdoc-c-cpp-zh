  md: "Developers use the Dashboard' Selling Details page to specify the price tier\
    \ of their app, whether the app offers a trial period, and when this period expires.\
    \ This is also developers want to use a third-party commerce engine for in-app\
    \ purchases. If the developer wants to use the Windows Store's commerce engine,\
    \ users go to another webpage to specify the list of app products they wish to\
    \ make available. Each product has a string ID, price tier (Free, or $1.49 to\
    \ $999.99), and details about how long the user can use the product before expires.\
    \ This information is referred to as the app's listing information. An app's listing\
    \ information is not cached on the user's PC, so an internet connection is required\
    \ for an app to get its own listing information at runtime.\n\nWhen users purchase\
    \ an app, they acquire a license for that app. Similarly, whenever users purchase\
    \ an in-app product, Windows maintains the acquired licenses on the user's PC.\
    \ In fact, the license information is synchronized across all the user's PCs.\
    \ This allows the to purchase an app or in-app product on one PC and shortly,\
    \ the app or product will be licensed on the user's PCs as well. Of course, the\
    \ user must be connected to the Internet so that Windows can synchronize the license\
    \ information. But, once a license is on PC, an app can always check a license,\
    \ even if the PC is not currently connected to the Internet.\n\n> Note Packages\
    \ downloaded from the Windows Store are licensed to a Microsoft account. This\
    \ is usually the same account users use to log in her PC. However, they do not\
    \ have to be the same. In fact, a user can go to the Store app, display the Settings\
    \ charm > Your Account page, and change the Microsoft account she used to download\
    \ packages from the store. I do this when I want to install a package I have already\
    \ purchased on another family member's PC (where family member looks in as himself).\n\
    \n# The Windows Store commerce engine WinRT APIs\n\nYour app integrates itself\
    \ with the Windows Store commerce engine by way of WinRT's static Windows.ApplicationModel.Store.CurrentApp\
    \ class. However, when you developing an app, using CurrentApp is a problem because\
    \ your app can't interact with the Windows Store commerce engine if your app is\
    \ not in the Windows Store. So, during development, WinRT offers another static\
    \ class you use, CurrentAppSimulator. This class methods are identical to the\
    \ CurrentApp class, but they implement the methods that simulate the Windows Store's\
    \ behavior. This allows you to test your app integration with the commerce engine\
    \ during development. Here is what the CurrentApp and CurrentAppSimulator classes\
    \ look like:\n\n```\npublic static class CurrentApp(Simulator) {\n    public static\
    \ Guid AppId { get; } // Your app's Unique ID\n    public static Uri Link { get;\
    \ } // URI to app's listing in the Windows Store website\n```\n\n```\n// Call\
    \ to download your app's listing information (Internet connection required):\n\
    \    public static IAsyncOperation<ListingInformation> LoadListingInformationAsync();\n\
    ```\n\n```\n// Call to examine the app's locally cached license information:\n\
    \    public static LicenseInformation LicenseInformation { get; }\n```"
