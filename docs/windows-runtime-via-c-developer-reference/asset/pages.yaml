  md: '# Debugging background tasks


    Debugging background tasks can be challenging. For example, if you want to debug
    your timer or maintenance trigger, you set a breakpoint and wait out 15 minutes
    until the system invokes your task and hits your breakpoint. This makes debugging
    a background task quite painful. To improve this situation, Visual Studio has
    built-in support to help with debugging background tasks. Specifically, Visual
    Studio allows you to forcibly trigger a background task by using the Debug Location
    toolbar, as shown in Figure 9-8.


    ![](img/f105584195b83b4404e3d2b11f5786c3_245_0.png)


    9-8 Forcibly triggering a background task trigger using Visual Studio''s Debug
    Location toolbar.


    When your app is running (not stopped at a breakpoint), drop down the list where
    you find the Suspend and Resume triggered discussed in Chapter 3. If your app
    has registered any background tasks, the names of the background tasks (as set
    using BackgroundTaskBuilder.Name property) also appear in this list. When you
    select a background task''s name, Visual Studio forcibly invokes it. If you have
    a breakpoint, Visual Studio will stop and offer you the normal interactive debugging
    experience.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'Additionally, event log entries can help troubleshoot background task issues.
    You can find them under the following path:


    Applications And Services Logs > Microsoft > Windows > BackgroundTaskInfrastructure


    There are two logs: Operational and Diagnostic (disabled by default). Make sure
    you enable Analytic And Debug Logs from the View menu.


    In addition, Microsoft makes several Windows PowerShell commands available for
    managing background tasks, as shown in Table 9-4.


    TABLE 9-4 PowerShell commands for managing background tasks.


    | Cmdlet | Description |

    | --- | --- |

    | Enable-AppBackgroundTaskDiagnosticLog Disable-AppBackgroundTaskDiagnosticLog
    | Enables and disables background task logging in Event Viewer. |

    | Get-AppBackgroundTask | Gets background task information. |

    | Start-AppBackgroundTask | Starts a background task. |

    | Unregister-AppBackgroundTask | Unregisters a background task. |

    | Set-AppBackgroundTaskResourcePolicy | Configures the use of global pools by
    background tasks. (See the next section.) |


    Windows tracks battery consumption for multiple days, and you can see the impact
    that background tasks have on battery consumption with powercfg.exe /sleepstudy.


    # Background task resource quotas


    If your app is running in the foreground while one of its background tasks executes,
    Windows puts no limitations on the app container''s CPU or networking usage. However,
    if your app is not running in the foreground, its background tasks get restricted
    CPU and networking usage. As mentioned before, the system makes a distinction
    between apps that are on the lock screen and apps that are not. Table 9-5 shows
    how CPU usage of all of an app''s background tasks gets to share. If your app
    is not on the lock screen, all its background tasks share 1 second of CPU usage
    every 2 hours regardless of whether the PC is running on AC or DC power. If your
    app is on the lock screen, all its background tasks get to share 2 seconds of
    CPU every 15 minutes. If your background tasks do not complete in this time, Windows
    suspends the threads executing your background tasks and resumes the threads when
    your app''s quota replenishes in 2 hours or 15 minutes. Unused time does not roll.


    > 7 For more information, see http://technet.microsoft.com/en-us/library/dn296421(wps.630).aspx.

    8 Network cards are particularly resource intensive and drain the battery quickly.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# TABLE 9-5 Background task resources quotas.


    | Resource limit | Non-lock screen app every 2 hours | Lock screen app every 15
    minutes |

    |---|---|--|

    | CPU (AC & DC) | 1 sec | 2 sec |

    | Network (DC only) by MB/sec | .625MB (daily=7.5MB) | 4.69MB (Daily=45x MB) |


    When the system suspends your app''s background threads, Windows logs an event
    in the BackgroundTaskInfrastructure event log. You can also find out on the next
    invocation of your task''s run method how often the system suspended it by checking
    BackgroundAsyncTask''s SuspendedCount property.⁹


    When the machine is on battery, the system also has a quota for your app''s network
    usage. If the network can transfer 10 MB/sec, when your app is not on the lock
    screen, it can transfer 6.25 MB over 2 hours, with a maximum of 75 MB per day.
    If your app is on the lock screen, it can transfer 46.9 MB every 15 minutes, with
    a maximum of 450 MB per day.¹


    In reality, Table 9-5 indicates what the system guarantees your app''s background
    tasks. However, if there are free background tasks on the machine, your background
    tasks could use more CPU and network than these minima because Windows also has
    a global pool that can tap into. This is a problem for testing your background
    tasks because they might all run successfully if they get more than the app''s
    minima. However, a user''s PC might have many background tasks that deplete this
    global pool, so your app''s tasks share the app''s minimum resource quota, preventing
    them from completing their work.


    When testing your background tasks, you want to make sure they run successfully
    if all they get the app''s minimum CPU and network usage. As a developer, you
    can tell Windows to turn off the global pool of resources and force each app''s
    background tasks to share the app''s minimum by executing the following PowerShell
    cmdlet:


    ```

    Set-BackgroundTaskResourcePolicy -Mode Conservative

    ```


    You restore the use of the global pool with this PowerShell cmdlet (which will
    require a reboot):


    ```

    Set-BackgroundTaskResourcePolicy -Mode Normal

    ```


    You see how many resources a background task used by this PowerShell cmdlet:


    ```

    Get-BackgroundTaskTask -pfn PackageFamilyName -IncludeResourceUsage | f1

    ```


    Finally, your background task can calculate BackgroundWork''s static read-only
    CurrentBackgroundWork property to determine how much CPU and network resources
    are available for your task executes. The code shown in this chapter “Step 1:
    Implement your background task''s code” demonstrates this.


    > ⁹ If you want to specifically know if the task was cancelled due to CPU or network
    usage, you can cast the BackgroundAsyncTask to BackgroundTask2. This interface
    exposes a ThrottleCount property.

    ¹ These numbers are subject to change with different versions of Windows. Consider
    them as a rough indication.'
