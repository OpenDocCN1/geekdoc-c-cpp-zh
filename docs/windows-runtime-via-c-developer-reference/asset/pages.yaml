    # # The app''s package manifest file


    The Package.appmanifest file is referred to as the app''s package manifest file,
    and you use it to describe the following:


    +   - Your package''s identity so that the Windows Store and Windows itself can
    uniquely identify your package. It is critically important to understand that
    Windows installs apps, not packages.

    - The apps that ship inside the package and UI-related features of each app. A
    single app package can contain multiple apps. However, Microsoft''s user-experience
    discovered a series of problems with this approach. For example, if a user uninstalled
    one of the apps, how could the user re-install it later? To simplify the user
    experience, Windows Store has a policy that all packages must contain a single
    app. For this reason, Visual Studio''s manifest designer supports only single
    packages¹ in addition to, this simplification, the terms package and app are (unfortunately)
    used interchangeably.² For example, a more accurate term for application data
    is package data and a more accurate term for app container is package container
    because the data and the container are really owned by the package, which might
    consist of multiple apps. This is especially important to understand when working
    with background tasks as an app can have multiple background task processes all
    sharing the same data and container.


    > ¹ The Windows Store has one exception to this policy. The "Mail, Calendar, and
    People" package contains the three apps that ship with Windows itself.

    ² You can also create packages that have no apps in them at all. These packages
    are called framework packages. Examples of framework packages are the Windows
    Library for JavaScript apps, Microsoft C++ Runtime, and Microsoft PlayReady Content
    Protection Framework.


    Chapter 2 App packaging and deployment 2'
