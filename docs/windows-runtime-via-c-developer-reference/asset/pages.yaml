  md: '# Storage files and folders


    In this chapter, you''ll learn how Windows Store apps access storage files and
    folders. We''ll start by exploring how apps can access read-only resources such
    as images, music, and videos embedded in their package files. Then we''ll show
    how your app can access its own private, user-data folders to store package-specific
    data. Of course, apps can access files in many storage locations, such as the
    user''s documents and pictures libraries, removable media, and network-shared
    folders. For security reasons, accessing some of these locations requires either
    user interaction or that, as a developer, enable settings in your app''s manifest
    file.


    This chapter focuses on navigating through files and folders, obtaining their
    properties and thumbnail images, and performing rich queries. This chapter does
    not address how to read and write a file''s contents; this is discussed in Chapter
    6, "Stream input and output."


    # The WinRT storage object model


    Figure-5 shows the relationship between the main WinRT interfaces and classes
    you need to understand to work effectively with storage files and folders. This
    object model scares many developers when they first see it because it is much
    more complex than what is available in other developer platforms. However, I personally
    love this object model because it is well segmented and compartmentalized; all
    members were carefully placed, and new features not available on other platforms
    are prominently exposed. Note that I am excluding some important interfaces from
    Figure 5-1 to simplify the discovery.


    Let''s now walk through the object model to understand it. The IStorageItem interface
    is the core of the model. This interface exposes members that operate on both
    files and folders. For example, you can rename and delete both files and folders.
    They also share several properties, such as Name, Path, DateCreated, and Attributes.


    StorageFolder inherits from IStorageItem and adds members that are specific to
    folders; StorageFolder is the concrete class implementing these two interfaces''
    members. Similarly, IStorageFile also inherits from IStorageItem and adds members
    that are specific to files; StorageFile is the concrete class implementing these
    two interfaces'' members.'
