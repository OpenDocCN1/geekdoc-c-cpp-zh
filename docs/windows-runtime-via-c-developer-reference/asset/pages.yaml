  md: "# Package data storage folders\n\nHere is code demonstrating how to write and\
    \ read a file from a package's local storage folder: \n// Gain access to our package's\
    \ data repositories\nApplicationData appData = ApplicationData.Current;\n\n```\n\
    // Store some text in a file:\nStorageFile file = await appData.LocalFolder.CreateAsync(\"\
    SomeAppData\");\nawait file.WriteTextAsync(\"Here is some data to persist\");\n\
    ```\n\n```\n// Later, we can read it:\nfile = await appData.LocalFolder.GetAsync(\"\
    SomeAppData\");\nString persistedData = await fileIO.ReadTextAsync(file);\n```\n\
    \nFiles store only arrays of bytes, but there are many ways of converting richer\
    \ data into arrays. For example, FileIO's WriteTextAsync and ReadTextAsync methods\
    \ in the previous code convert strings to and from bytes by using a UTF-8 encoding.\
    \ For details about manipulating files, see Chapters 5 and 6.\n\nWindows does\
    \ not impose limits on a package's data files. Files can be extremely large (264\
    \ bytes), and there is no restriction on the number of package data files you\
    \ can create. So package data can fill all of the user's hard disk. To see how\
    \ much disk space individual packages are using, go to Settings charm > Change\
    \ PC Settings > Search And Apps, App Sizes. The indicated size is generally the\
    \ sum of the package itself and its folders.\n\nFor debugging purposes, it is\
    \ useful to know that all of a package's storage files can be found in the following\
    \ directories:\n\n+   - Temporary files %AppData%Packages\\PackageFamilyName\\\
    TempState\n- Local files %AppData%Packages\\PackageFamilyName\\LocalState\n- Roaming\
    \ files %AppData%Packages\\PackageFamilyName\\RoamingState\n\n# Versioning package\
    \ data\n\nAs you revise your app (creating new versions of its), you'll likely\
    \ want to change the kind or format of your package's data. Consequently, when\
    \ a user upgrades your package to a newer version, you might want to execute a\
    \ routine that updates your package's data. To help you manage your package's\
    \ data, the system associates a version number (a 32-bit unsigned integer) with\
