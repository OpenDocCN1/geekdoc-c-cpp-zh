    # # The Windows Runtime type system


    The WinRT APIs that ship as part of Windows are all written in native C/C++, which
    makes sense for platform code because it is to be fast and use little memory as
    possible. However, these WinRT APIs are callable from C#, VB, Basic, and JavaScript.
    To call WinRT APIs from all of these languages, a small and simple type system
    has to be defined. This type system must use features available to all consuming
    programming languages. Here are the concepts you need to know to consume the WinRT
    type system by C#:


    +   - Common base type WinRT components do not share a base class. Using a WinRT
    component from C# makes the component look like it is from System.Object; therefore,
    you can pass it throughout your code. In addition, allRT components inherit System.Object''s
    public methods like ToString, GetHashCode, Equals, and GetType; all these methods
    are callable on WinRT objects. Because WinRT components are implemented as extended
    COM objects, the CLR uses Runtime Callable Wrappers (RCWs) to access them. Invoking
    an RCW''s members causes a managed-to-native code transition, which incurs some
    performance overhead.


    +   - Core data types The WinRT type system supports the data types, as Booleans;
    unsigned bytes, 16-bit, 32-bit, and 64-bit signed and unsigned integers; precision-double
    floating-point-numbers; 16-bit characters; strings; and void. In the CLR, all
    other data types are composed from these core data types. For a complete list,
    see http://msdn.microsoft.com/en-us/library/rt205768(v=vs.8).aspx.


    +   - Classes WinRT is an object-oriented type system, meaning that WinRT components
    support data abstraction, inheritance, and polymorphism. However, some languages
    (like JavaScript) do not support type interface. Cater to these languages, almost
