    // Read Uint32 response from server:

    await dr.LoadAsync(sizeof(Uint32));

    Int32 sum = dr.ReadInt32();

    ```


    When calling IInputStream''s ReadAsync method or when using a DataReader (which
    calls ReadAsync internally), think about the InputStreamOptions bit flags. Here
    is what the flags mean:


    +   - None (0) The ReadAsync or LoadAsync operation will not complete until the
    number of bytes requested has come over the socket. None is useful when you''re
    expecting a specific number of bytes.


    +   - Partial (1) The ReadAsync or LoadAsync operation completes when one or more
    bytes are available; all the bytes you requested might not be available. Partial
    is useful when you''re expecting a stream of data and your app must parse to know
    how many additional bytes your app expects. I show an example using this technique
    in the StreamWriter-SocketClientAsync method later in this chapter.


    +   - Readahead (2) The ReadAsync or LoadAsync operation might complete with more
    bytes than actually requested. Readahead is useful to reduce latency and improve
    performance.'
