  md: 'Without going into the details of Package Explorer implementation, here are
    some of the methods used:


    +   - It uses PackageManager''s static FindPackagesForUser method to get all installed
    packages. PackageManager also has methods to add and remove packages from the
    PC.


    +   - It uses ApplicationDataManager''s static CreateForPackageFamily method to
