    +   - Takes advantage of your own custom cache implementation


    +   - Injects simulated network failures to test the resiliency of your app''s
    code


    Really, you''re only limited by your imagination. Microsoft has already implemented
    some of these filters for you. You can download the source code for them from
    the MSDN website. For sample filters showing retry and metered networks, see http://code.msdn.microsoft.com/windowsapps/HttpClient-sample-55700664.
    For a sample showing authentication, see http://code.msdn.microsoft.com/windowsapps/Web-Authentication-d0485122
    and look at its AuthFilters folder.


    # Windows Runtime sockets


    Windows provides sockets that allow apps to communicate using special protocols
    like SMTP, MAPI, Telnet, and so on. Table 7-2 shows the different kinds of sockets
    you can use in your Windows Store app.


    TABLE 7-2 Windows Runtime sockets.


    | Class | Protocol | Side |

    |---|---|--|

    | StreamReader | TCP | Client |

    | StreamWriterListener | TCP | Server |

    | StreamWebSocket | WebSocket | Client |

    | MessageWebSocket | WebSocket | Client |

    | DatagramSocket | UDP | Peer |


    Once a connection is established, all sockets offer objects implementing the IIInputStream
    and IOutputStream interfaces as discussed in Chapter 6. By implementing these
    interfaces, you transfer data through sockets which you may transfer data files
    to and get to leverage for all the classes, such as DataReader, DataWriter, DataProtectionProvider,
    Compressor, and so on.


    When performing I/O operations, your app can be suspended. In general, this is
    not a problem and your app should avoid connections before being suspended and
    re-establish connections when resumed. When an app initiates an I/O operation,
    that operation is to a Windows device driver and the driver performs the actual
    operation. The driver is capable of accessing the app''s data even when the app''s
    threads are suspended, so the I/O continues. Of course, if the app is terminated,
    the app''s buffers are destroyed and the driver cancels any of the app''s outstanding
    I/O operations. Connections will have to be re-established when the app is relaunched.'
