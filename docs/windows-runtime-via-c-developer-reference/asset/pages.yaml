  md: "+   - Framework projections Framework projections are mapped explicitly in\
    \ your code leveraging APIs introduced in .NET Framework Class Library. Framework\
    \ projections are required when the impedance mismatch between the WinRT type\
    \ system and the CLR's type system is too great for the CLR to do implicitly.\
    \ Framework projections are used for asynchronous programming (discussed later\
    \ in this chapter) and when working with streams and data buffers (discussed in\
    \ Chapter 6, \"Stream input and output\")\n\n# Calling asynchronous WinRT APIs\
    \ from .NET code\n\nWhen a thread performs an I/O operation synchronously, the\
    \ thread can block for an indefinite amount of time. When a GUI blocks for an\
    \ I/O operation to complete, the application's user interfaces responding to user\
    \ input—such as touch, and stylus events—causing the user to get frustrated with\
    \ the application. To keep apps responsive, WinRT components that perform I/O\
    \ operations expose the functionality via asynchronous APIs exclusively. In fact,\
    \ WinRT components that perform compute operations also expose this functionality\
    \ as asynchronous exclusively if the CPU operation could take greater than 50\
    \ milliseconds. For more information about building responsive applications, see\
    \ Part V, \"Threading,\" of CLR, Fourth Edition by Jeffrey Richter.\n\nBecause\
    \ the WinRT APIs are mostly abstracting hardware, many APIs perform I/O operations;\
    \ therefore, many WinRT APIs are asynchronous. So, for you to produce them requires\
    \ that you understand how to work with C#. To understand this, examine the following\
    \ code:\n\n```\npublic static void WinRTAsyncIntro() {\n    IAsyncOperation<StorageFile>\
    \ asyncOp = KnownFolders.MusicLibrary.GetFileAsync(\"Song.mp3\");\n    asyncOp.Completed\
    \ = OpCompleted;\n    // Optional: cancel asyncOp.Cancel(some later)\n}\n\n//\
    \ NOTE: Callback method executes via GUI or thread pool:\nprivate static void\
    \ OpCompleted(IAsyncOperation<StorageFile> asyncOp, AsyncStatus status) {\n  \
    \  if (status == AsyncStatus.Canceled) {\n        // Process cancellation...\n\
    \        try {\n            StorageFile file = asyncOp.GetResults(); // Throws\
    \ if operation failed\n            // Process result (do something with file)...\n\
    \        }\n        catch (Exception ex) {\n            // Process exception...\n\
    \        }\n    }\n\n    asyncOp.Close();\n}\n```\n\nThe WinRTAsyncIntro invokes\
    \ the WinRT GetFileAsync method to find a file in the user's library. All WinRT\
    \ APIs that perform asynchronous operations are named with the Async suffix, and\
    \ return an object whose type implements a WinRT IAsyncXXX interface—in this example,\
    \ IAsyncOperation<TResult> interface where TResult is the WinRT StorageFile"
