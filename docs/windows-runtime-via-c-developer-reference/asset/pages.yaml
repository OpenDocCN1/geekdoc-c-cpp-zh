    lunch"));

    ScheduledTileNotification stn =

    new ScheduledTileNotification(tileXml, DateTimeOffset.Now.AddHours(2)) {

    ExpirationTime = DateTimeOffset.Now.AddMinutes(30)

    };

    TileUpdateManager.CreateUpdaterForApplication(stn);

    ```


    We schedule a tile notification that activates itself in two hours. Additionally,
    the tile notification expires 30 minutes from the time it is scheduled. You can
    schedule up to 4,096 tiles in advance. This is useful if you want to implement
    a countdown timer.


    # Updating a tile periodically


    Your app can tell the system to get tile notifications from a web server periodically.
    Here is an example that has the Start screen poll a web server of your choosing
    every 30 minutes for a new tile template:


    ```

    TileUpdater tu = TileUpdateManager.CreateUpdaterForApplication();

    t.StartPeriodicUpdate(

    new Uri("http://WintellectNOW.blob.core.windows.net/public/TileTemplates/"),

    DateTimeOffset.UtcNow.AddSeconds(10), PeriodicUpdateRecurrence.HalfHour);

    ```


    Of your app, can, use the URL to provide additional information to the web server
    in a string. For example, your app can send a ZIP code to indicate location information
    that the web server can return to return an XML template targeted for your app''s
    specific needs ("http://SomeWeServer.com?Zip=98033").


    Call TileUpdateManager''s StopPeriodicUpdate method to have the Start screen stop
    polling your web server.


    In your app''s package manifest, you can enable periodic updates for your app''s
    tile. This allows your app''s tile to show useful information right after the
    user installs your app. See the Tile Section on the Application tab in Visual
    Studio''s package manifest designer.


    # Secondary tiles


    In addition to an app''s main tile, you can have one or more secondary tiles on
    the Start screen. Secondary tiles have the same capabilities as the app''s main
    tile, including badges, peek tiles, queuing up to five tile notifications, scheduled
    updates, periodic updates, and also Windows Push Notifications. When a user launches
    your app from a secondary tile, the system passes in a launch parameter to your
    app so that it can display different content depending on which tile was used.
    Examples of secondary tiles are stock-ticker apps with several tiles for different
    stocks'
