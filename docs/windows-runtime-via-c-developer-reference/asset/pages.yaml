    \ Object e) {\n // Invoked via main thread when it resumes from suspend\n // TODO:\
    \ Update any stale state in the UI (news, weather, scores, etc.)\n }\n\nprivate\
    \ void OnSuspending(Object sender, SuspendingEventArgs e) {\n // Invoked via main\
    \ thread when app is suspended or closed by user\n\n // Windows gives 5 seconds\
    \ for app to suspend or OS kills the app\n // Windows Store certification requires\
    \ suspend to complete in 2 seconds\n\n // TODO: Save session state in case app\
    \ is terminated\n // (see ApplicationData.Current.LocalFolder)\n // NOTE: I perform\
