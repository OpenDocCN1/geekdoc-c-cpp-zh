  md: '# CHAPTER 7


    # Networking


    Today, almost all apps transfer data over a network to other PCs and servers.
    In this chapter, I present the WinRT APIs available for you to use in your Windows
    Store apps.¹1 However, before you roll up your sleeves and start coding against
    these APIs, you should see if there is some simpler system-provided functionality
    that you can leverage.


    For example, Windows can automatically sync a package''s settings and files across
    a user''s PCs. (See Chapter 4, "Package data and roaming") Or your app might post
    some data to a social networking site or share data through a messaging app. Instead
    of writing code that works with a specific service, you could use the Windows
    Share charm. (See Chapter 10, "Sharing data between apps.") For updating tiles
    or badges, or for displaying a toast notification, your own service could use
    the Windows Push Notification Service (WNS) to send a WNS notification to update
    your app. (See Chapter 8, "Tiles and toast notifications.") You can also send
    a raw WNS notification to execute code in response to an input message over the
    network. (See Chapter 9, "Background tasks.")


    It''s recommend, when possible, to use the highest abstraction that you can because
    this simplifies your code. But, if your app needs more traditional networking
    (HTTP, TCP, WebSockets, and UDP), WinRT does APIs for you, and using these APIs
    is the focus of this chapter.


    # Network information


    Windows supports different kinds of networks, such as LAN, Wi-Fi, and mobile (GSM,
    3G/4G, and so on). Each of these networks has its own characteristics (such as
    bandwidth) that might affect your app''s responsiveness. Additionally, these networks
    might have different costs associated with their usage. LAN and Wi-Fi at home
    or work are usually considered unlimited. Connections in hotel rooms or hotspots
    might be capped, and mobile networks could have additional restrictions as roaming-costs.
    When connecting to a network, Windows prioritizes a user''s available networks.
    It prefers lower cost and better performance networks such as LAN and Wi-Fi to
    mobile networks. Additionally,


    ¹ Note that many of the WinRT APIs described in this chapter are also usable by
    Windows desktop apps.


    145'
