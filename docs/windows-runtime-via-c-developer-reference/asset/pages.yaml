  md: '# About the authors


    JEFFREY RICHTER is a cofounder of Wintlect (http://www.Wintlect.com/), a training
    and consulting company dedicated to helping companies produce better software
    faire. Jeffrey has authored many video courses that can be viewed at http://WintlectNOW.com.


    He has also written or contributed books about Windows and .NET Framework programming,
    including Windows Runtime via C# (Microsoft Press, 2013), CLR over C#, Fourth
    Edition (Microsoft Press, 2012), Windows via C/C++, Fifth Edition (Microsoft Press,
    2000), and Programming Server-Side Applications for Microsoft Windows 2000 Magazine,
    where he wrote numerous feature articles and has the Win32 Q&A columnist, .NET
    Q&A columnist, and Concurrent Affairs columnist. Jeffrey also speaks at various
    trade conferences worldwide, includingintlect''s Discovery, LLive, and Microsoft''s
    TechChD and Professional Developers Conference.


    Jeffrey has consulted for many companies, including AT&T, DreamWorks, General
    Electric, Hewlett-Packard, IBM, and Intel. He ships code in many Microsoft products,
    among them Microsoft Visual Studio, Microsoft Office, and various versions of
    Windows. Jeffrey consulted with the .NET Framework team for eight years and maintains
    an ongoing close relationship with that team as well as the Windows team. Most
    recently, Jeffrey worked with Microsoft to design the new asynchronous programming
    model supported by C# and Visual Basic. This model is similar to what Jeffrey
    made available with his Power Threading Library since 2005.


    On the personal front, Jeffrey holds both airplane and helicopter pilot licenses.
    He is also a member of the International Brotherhood of Magicians and enjoys showing
    sleight-of-hand card tricks from time to time. Jeffrey''s other hobbies include
    music (especially jazz and progressive rock from the 1970s), drumming, and model
    railroad. He also enjoys traveling (which he gets a bit of) and theater. He lives
    in Kirkland, Washington, with his wife, Kristin, and his two sons, Aidan and Grant.


    ![](img/f105584195b83b4404e3d2b11f5786c3_316_0.png)'
  merge: -1
  pgno: 316
- img_proc: true
  md: '![](img/f105584195b83b4404e3d2b11f5786c3_317_0.png)


    MAARTEN VAN DE BOOSPORT is a principal consultant with the Premier Services for
    Developers division in Microsoft. The Windows division has involved him from the
    early days of the Windows Runtime to work with partners on showcase cases. He
    teaches classes on writing Windows Store apps, and in this capacity he has trained
    hundreds of Microsoft internal and external developers worldwide to write WinRT
    apps. For the last eight years, Maarten has been consulting for the Windows product
    group, partnering with all major independent service vendors (ISVs) during Windows
    operating system (OS) betas to ensure that critical apps would continue to run
    on the new version of Windows. Maarten has assisted countless ISVs with architecting
    their software and optimizing their performance for the newest versions of the
    operating system.


    Maarten moved with multiple stops from The Netherlands to the Seattle area in
    1997. He appreciates living in the Pacific Northwest with its familiar culture
    and climate. Early in the morning, Maarten enjoys playing tennis with friends,
    and it would have been good if he had made up his mind about 20 years ago as to
    what instrument was best to really play his favorite jazz and bebop tunes. He
    lives in Bellevue, Washington, with his wife, Brigitte, and his two sons, Jules
    and Joris.'
