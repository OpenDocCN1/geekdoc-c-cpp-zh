    At this point, the target app should call ShareOperation''s ReportStarted method.
    This method tells Windows to keep the source app running so it can deliver any
    delay-rendered content being accessed by the target app. In addition, the system
    adds an entry to the sharing pane''s outstanding share operations list (discussed
    in more detail shortly). After calling ReportStarted, the target app should call
    ShareOperation''s DismissUI method. This method hides the app''s hosted view,
    allowing the user to interact with the source app. The target''s hosted view continues
    performing the share operation.


    If the user desires, he can open the Share pane to monitor all the outstanding
    share operations. If any share operations are in progress, the text “Check progress”
    appears at the bottom of the Share pane. If the user taps on it, the Share pane
    shows the outstanding share operations. Selecting an outstanding operation causes
    the target app''s hosted view to reappear. The hosted view can show the user more
    specific progress information and also offer the user the ability to cancel the
    operation.


    If the operation completes successfully, the hosted-view thread should call ShareOperation''s
    ReportCompleted method. This method calls the hosted view and its thread to be
    destroyed. In addition, the ReportCompleted method removes the share operation
    from the Share pane''s outstanding operations list.


    If the operation fails, the hosted-view thread should call ShareOperation''s ReportError
    method, passing a string indicating the reason for failure. This method also calls
    the hosted view and its thread to be destroyed. However, Windows will display
    a toast notification to the user containing the reason for the failure string
    and which operation failed to complete. The system will not remove the share operation
    from the Share pane because the user might have missed the toast notification.
    If the user opens the Share pane, he will see “Something went wrong” at the bottom.
    Tapping on this text displays the list of outstanding share operations. Failed
    operations show the text “Something went wrong.” The user can then select an operation
    to see the reason for failure and to clear the failed operation from the list.
    The user will have to retry the share operation from the beginning to try to get
    it to work.'
