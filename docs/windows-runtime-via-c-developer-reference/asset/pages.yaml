  md: '# CHAPTER 3


    # Process model


    n this chapter, we delve into a Windows Store app''s process model. Specifically,
    we''ll look at the various ways an app gets activated as well as how it uses threads
    and windows. We''ll also talk about how to best architect your app so that it
    uses memory efficiently as it navigates the user from page to page. We''ll conclude
    with a discussion of process lifetime management (PLM) and how Microsoft manages
    your app''s lifetime to further conserve memory, reduce CPU usage, and simplify
    the end-user experience.


    Understanding this topic is critical to building Windows Store apps. If you are
    familiar with the Windows desktop app process, you know that it is relatively
    easy to understand because you can usually get away with just one thread, a main
    window, and lots of child windows. However, the Windows Store app process is substantially
    different and more complex because it uses several threads, each having at most
    one window, and child controls are simply drawn on a window. And this is just
    the tip of the iceberg in complexity. The additional complexity is the result
    of two factors:


    +   - Windows Store apps are single instance. Windows allows only one instance
    of a Windows Store app to run at a time on the system. This conserves memory because
    multi-instance apps would each have their own memory. Because most apps have a
    single window, switching between apps is simpler for users. Instead of needing
    many windows they can switch to, users now see fewer windows. However, this makes
    your app more complex because you must now write the code to manage multiple documents
    or tabs.


    +   - Windows Store app activations. Windows Store apps can be activated for myriad
    reasons. All activations re-activate the already-running app and some activations
    cause other threads and windows to be created that your code has to manage.


    # App activation


    In this section, we talk about app activation. Specifically, we''ll discuss how
    Windows creates it for your app and allows your app to initialize itself, and
    then we''ll look at how your app can start working on behalf of the user.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'An app can be activated for several reasons. The most obvious is when the user
    taps your app''s title from the Start screen. This kind of activation is a launch
    activation, and all Windows Store apps must support launch activation; there is
    no way for a Windows Store app to opt out of it. But Windows Store app can also
    be activated by the user tapping one of your secondary tiles on the Start screen
    or if the user selects a toast notification that your app displays (See Chapter
    8, "Tiles and toast notifications," for more information). Activating your app
    by a secondary tile or toast notification is in addition to launching. You can
    optionally support other activations. For example, you can activate your app to
    be activated by the user opening a file in File Explorer, attaching a device (like
    a camera) to the PC, attempting to share content with your app, and so on. In
    WinRT-enumerated type called Windows.ApplicationModel.Activation.Kind identifies
    all the ways an app can be activated. Table 3-1 shows the values offered by this
    activation and briefly describes each. Some of these activations are discussed
    other in this book, and some are very rarely used, so we will not discuss them
    at all.


    | ActivationKind value | Activates your app when | Main |

    |---|---|---|n| Launch | User taps your app''s primary tile, a secondary tile,
    or a toast notification. | Main |

    | Search | User uses the Search charm to search within your app while it''s in
    the foreground. | Main |

    | File | Another app launches a file type is supported by your app. | Main |

    | Protocol | Another app launches a URI scheme is supported by your app. | Main
    |

    | Device | User attaches a device to the PC that is supported by your app (AutoPlay).
    | Main |

    | Contact | User wants your app to post, message, call, video call, or map a contact.
    | Main |

    | LockScreen | User taps a toast that answers when the user has locked their PC.
    | Main |

    | AppointmentsProvider | Another app wants your app to add, replace, or remove
    an appointment. | Main |

    | ShareTarget | User wants to share content from another app with your app. |
    Hosted |

    | FileOpenPicker | Another app allows the user to open a file from a location
    your app has access to. | FileSavePicker | Another app allows the user to save
    a file to a location your app has access to. | Hosted |

    | CachedFileUpdater | Another app uses a file your has cached. | Hosted |

    | ContactPicker | Another app allows the user to access a contact maintained by
    your app. | Hosted |

    | PrintTaskSettings | Your app is an app associated with a printer and exposes
    its settings. | Hosted |

    | CameraSettings | Your app is an app associated with a camera and exposes its
    settings. | Hosted |'
