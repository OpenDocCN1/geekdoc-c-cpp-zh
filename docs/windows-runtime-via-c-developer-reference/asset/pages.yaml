    \ appear and disappear a few times. Be aware that some of the tests examine performance,\
    \ such as the time it takes for your app to launch or suspend. For reason, it's\
    \ recommended to close all other applications and leave the machine alone while\
    \ the tests are running.\n\nOnce you've run the tests, the WACK tool generates\
