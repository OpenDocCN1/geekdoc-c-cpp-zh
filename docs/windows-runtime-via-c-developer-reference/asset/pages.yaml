  md: '# # App trials and purchasing an app license


    if you use a time-based trial for your app, you do not have to write any code.
    Once the trial period expires, Windows will not let the app launch; instead, Windows
    prompts the user to purchase the app. You might want to write code to handle a
    scenario in which the trial expires the app is running. In this case, you could
    write code that prompts the user to purchase the app. If the user refuses to purchase
    the app, you throw an unhandled exception to terminate the app or let the app
    run while periodically reminding the user to purchase.


    You can query the CurrentApp.LicenseInformation.ExpirationDate property to find
    out when the trial period expires. You might want to show this to users so they
    know when they''ll have to purchase the app or stop using it. If you want to offer
    a feature-differentiated trial, you can simply enable the features after the user
    has purchased an app license:


    ```

    if (CurrentApp.LicenseInformation.IsActive && CurrentApp.LicenseInformation.IsTrial)
    {

    // appropriately licensed, enable feature here...

    } else {

    // not purchased & trial expired, app side-loaded, or purchase refunded

    }

    ```


    If you want to purchase a license for the app from within it, you can show the
    user how it will cost by querying ListingInformation''s FormattedPrice property.
    Then, to actually let the user purchase the app, call CurrentApp(Simulator).RequestAppPurchaseAsync
    method:


    ```

    private async void OnAppPurchase(object sender, EventArgs e) {

    String msg;

    if (m_licenseInfo.IsTrial) {

    msg = "App already licensed";

    } else {

    try {

    // Prompt the user to purchase a license for the app

    String receipt = await CurrentApp.RequestAppPurchaseAsync(true);

    msg = m_licenseInfo.IsActive

    ? "App license purchased" : "App license purchase cancelled";

    }



    catch (ArgumentException ex) { msg = ex.Message; }

    catch (OutOfMemoryException ex) { msg = ex.Message; }

    catch (COMException ex) {

    if (ex.HResult != E_FAIL) throw;

    msg = ex.Message;

    }

    catch (Exception ex) {

    if (ex.HResult != ERROR_NETWORK_UNREACHABLE) throw;

    msg = ex.Message;

    }

    await new MessageDialog(msg).ShowAsync();

    }

    ```


    The call to CurrentAppSimulator.RequestAppPurchaseAsync shows a dialog box you
    can use to simulate failures you might want to handle in your code. The previous
    code fragment shows'
