    converted to equivalent values in foreign markets) Choose Free if you do not intend
    to use the Microsoft commerce engine. Apps must be free, as such as Windows Store
    apps. (See https://msdn.microsoft.com/en-us/library/windows/apps/hh649090.aspx)


    On this page, you also set a trial that allows users to try your app for a certain
    period for free. You can choose from Never Expires, 1 Day, 7 Days, 15 Days, and
    30 Days. After a user installs your app and the expiration period passes, the
    app will no longer run on the user''s PCs. Note: you do not have to do anything
    in your app''s code to support trials, although you can create a better user experience
    by letting them purchase the app once the trial period expires. See "The Windows
    Store commerce engine" to see how to do this.


    By default, the Windows Store makes your app available as soon as it passes certification.
    If you prefer, you can specify a specific release date. This page also allows
    you to set a category and subcategory for your app to help users locate it in
    the Store. Finally, in the Hardware Requirements section, you indicate what level
    of DirectX and how much RAM the user''s PC must have to install your app. This
    is done to prevent users from installing your app on a machine that is not powerful
    enough for your app''s graphics and memory requirements, because this would lead
    to poor user ratings. Finally, you can indicate that your app is suitable for
    accessibility.


    +   * Services This page takes you to other pages that give you information about
    integrating other services with your app, such as the Windows Push Notification
    Service (WNS), Windows Azure Mobile Services, and Live Connect. You also use this
    page to define any in-app offers to sell products within your app. The pricing
    for in-app offers is the same as for your app''s pricing. For more detail, see
    this chapter''s "The Windows Store commerce engine" section.


    +   * Age Rating And Certificates This page allows you to set the age rating for
    your app according to the type of content you display. This page also lets you
    upload game-rating certificate files.


    +   * Cryptography On this page, you declare whether your app uses encryption
    technologies (such as SSL). This is required because your app''s package files
    reside in the United States and the U.S. government regulates the export of technology
    that you use cryptography.


    +   * Packages Use this page to upload your app''s package files to the Store.
    The maximum allowable package size is 8 GB.


    +   * Description On this page, you provide the information users see when viewing
    your app in the Store app, such as the following:


    +   * Descriptive text and pictures.


    +   * Release notes (bug fixes or new features).


    +   * Recommended hardware for having the best experience with your app.


