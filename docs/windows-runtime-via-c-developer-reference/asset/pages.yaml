  md: "To improve application performance, WinRT offers a simple Windows.Back-groundTransfer\
    \ class:\n\n```\npublic static class ContentPrefetcher {\n// Set URIs to contain\
    \ the system periodically downloads and caches for your app\n// Use when URIs\
    \ do not change between runs of the app (Ex: a URI to weather in a city)\npublic\
    \ static I IList<Uri> ContentUris { get; }\n\n// To an XML file the system periodically\
    \ downloads. The XML file contains prioritized\n// URIs to other the system will\
    \ also download and cache. Use when these URIs to\n// content change between runs\
    \ of the app.\n// Example: A URI to an XML file with URIs to the latest news stories\n\
    public static Uri IndirectContentUri { get; set; }\n\n// NOTE: The system can\
    \ prefetch data up to 40 units. ContentUris takes precedence\n// over URIs in\
    \ the XML file referred to by IndirectContentUri\n}\n```\n\nAfter populating the\
    \ ContentPrefetcher with some URIs, the system uses heuristics to deter-mine to\
    \ periodically download the content on your app's behalf. The goal is, when your\
    \ app runs, that it has already been downloaded and stored in the cache so that\
    \ the app can simply make an HTTP request, get the data from the cache, and show\
    \ the user relevant data without incurring network performance hit. The heuristics\
    \ are not documented and are subject to change, but they take into account power\
    \ and network conditions as well as how often the app actually consumes the prefetched\
    \ data and how often it is used. The ContentPrefetcher is best for an app shows\
    \ at startup, frequently used data, and data whose usefulness is long-lived.\n\
    \nIn addition to a cache, each package also has a user-set of cookies. 11 Using\
    \ HttpBaseProtocolFilter::CookieManager property, your app can examine cookies\
    \ returned from HTTP servers. It can also create cookies to a server. The following\
    \ code demonstrates how to examine the cookies returned in an HTTP response from\
    \ a server:\n\n```\nusing (HttpBaseProtocolFilter filter = new HttpBaseProtocolFilter())\n\
    using (HttpClient client = new HttpClient()) {\n  HttpRequestMessage request =\
    \ new\n    new HttpRequestMessage(HttpMethod.Get, new Uri(\"http://Bing.com/\"\
    ));\n  HttpResponseMessage response = await client.SendAsync(request);\n  // See\
    \ the returned cookies (HttpCookieManager has SetCookie and DeleteCookie methods)\n\
    \  foreach (HttpCookie cookie in filter.CookieManager.GetCookies(request.Uri))\
    \ {\n    String cookieInfo = String.Format(\n      \"Domain={0}, Expires={1},\
    \ HttpOnly={2}, Name={3}, Path={4}, Secure={5}, Value={6}\",\n      cookie.Domain,\
    \ cookie.Expires, cookie.HttpOnly, cookie.Name, cookie.Path,\n      cookie.Secure,\
    \ cookie.Value);\n  }\n}\n```\n\n11 Cookies are stored at %LocalAppData%Packages\\\
    PackageName\\AC\\NetCookies. The InetCookies-irectory is hidden, so you won't\
    \ normally see it when using File Explorer or a CMD prompt."
