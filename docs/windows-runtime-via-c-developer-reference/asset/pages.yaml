  md: '# Package data settings


    Here is code demonstrating how to write and read a setting from local package
    data:


    ```

    // Gain access to our package''s data repositories

    ApplicationData appData = ApplicationData.Current;


    // Store an item in the collection: Key="DataUpdated", Value=DateTimeOffset.Now

    appData.LocalSettings.Values["DataUpdated"] = DateTimeOffset.Now;


    // Later, we can read it back:

    DateTimeOffset dateTimeUpdatedAt = (DateTimeOffset)appData.LocalSettings.Values["DataUpdatedAt"];

    ```


    You can store only simple WinRT (not .NET) types in data. The valid WinRT data
    types are Boolean, UInt8, Int16, Int32, Uint32, Int64, Uint64, Double, Char, String,
    DateTimeOffset, TimeSpan, Guid, Point, Size, and Rect. You can also store multidimensional
    arrays of these data types, but the valid value cannot be larger than 8 KB in
    size. However, there is no limit to the key/value pairs you can add to the collection.
    The Values property returns an ApplicationDataContainerSettings object, which
    implements the IObservableMap interface, which offers a MapChanged event whenever
    an item in the collection changes.


    In addition to the simple data types, there is one special data type you can use:
    ApplicationDataCompositeValue. This type allows you to store multiple pieces of
    data atomically. For example, if you had:


    ```

    String videoName = ...;

    appData.LocalSettings.Values["LastVideoWatched"] = videoName;


    // Imagine an unhandled exception occurs here!

    Int32 videoPosition = ...;

    appData.LocalSettings.Values["LastVideoPosition"] = videoPosition;

    ```


    Then it is possible that your app store the last video the user was watching and
    terminate before storing the user''s position within the movie. If the user restarts
    the app, it loads the last video the user was watching but positions it at the
    last place in the previous video'
  merge: -1
