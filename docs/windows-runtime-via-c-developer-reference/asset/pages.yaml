    # # Accessing user files via explicit consent


    Users typically have files they care about in various folders, such as the Documents,
    Pictures, Music, and Videos libraries, network shares, and so on. Windows desktop
    apps have always been able to access the user''s files folders arbitrarily. This
    allows desktop apps to traverse the user''s folders and modify any files it finds
    there. Or, an not ideal situation and it has caused users to be scared to use
    Windows desktop applications. To address users'' concerns, a Windows Store app
    can access only its own package files without user consent.


    If your app wants to manipulate a user file, you can present the user with a folder
    or file picker. (See Figure 5-2) The picker allows the user to navigate over hen
    folders and files securely. The user can then select a single folder, single file,
    or set of files, granting your app access to the selected item or items only.
    In addition, the user can cancel the picker, granting your app no access to anything.
    The key point is that the user is in control of here, not your app.


    > Note In reality, the user is granting your package access to the folder or files.
    So your app can prompt the user for consent to allow a background task(that is
    part of the same package) access to the folder or files.'
