  md: "Here's the same function written in native C++:\n\n```\nnamespace Windows::Storage;\n\
    namespace Windows::UI::Popups;\n\nvoid SimpleExample::MainPage::ReadText() {\n\
    \    auto filename = \"MyFile.txt\";\n    create_task(ApplicationData::CurrentFolder->GetFileAsync(filename))\n\
    \    then([this](StorageFile file) {\n        create_task(file::ReadTextAsync(file)).then([this](String\
    \ txt) {\n            MessageDialog* dialog = new MessageDialog(txt, \"File Text\"\
    );\n            dialog->ShowAsync();\n        });\n    });\n}\n```\n\nReaders\
    \ familiar with C++/CLI might think this is actually managed using ref new and\
    \ ^. The syntax used is called C++ Component extensions, or C++/CX. It is a set\
    \ of extensions to the C++ language, making it statically easy to invoke WinRT\
    \ APIs.¹11\n\nAnd here's the same function written in JavaScript:\n\n```\nfunction\
    \ readText() {\n    var filename = 'MyFile.txt';\n    var localFolder = Windows.Storage.ApplicationData.current.localFolder;\n\
    \    localFolder.getFileAsync(filename).then(function(file) {\n        Windows.Storage.File.ReadTextAsync(file).then(function(txt)\
    \ {\n            var dialog = new Windows.UI.Popups.MessageDialog(txt, 'File Text');\n\
    \            dialog.showAsync();\n        });\n    });\n}\n```\n\nNotice that\
    \ in JavaScript the first letter of the WinRT methods start with a lowercase letter\
    \ (like getFileSize). This is how the Internet Explorer projects the WinRT API\
    \ methods to the JavaScript developer. This gives the developer a natural experience\
    \ because initial lowercase letters are a standard convention in JavaScript. For\
    \ .NET developers, there are two kinds of projections:\n\n+   CLR projections\
    \ CLR projections are mappings performed implicitly by the CLR, usually-reiter\
    \ to reinterpreted metadata. The CLR makes all WinRT components look like they\
    \ are derived from System.Object (as mentioned earlier). WinRT types also have\
    \ well-known-.NET types that .NET developers are familiar with. (some of which\
    \ are listed in Table 1-1) converted back and forth between .NET and WinRT, and\
    \ the .NET projection type has more features (properties and methods) than the\
    \ WinRT equivalent. For example, WinRT defines a System.Foundation.Uri type; to\
    \ .NET developers, this is exposed as the System.Uri type.¹²"
