    #  Package and user files


    As your app runs, it can access various files that are classified as follows:


    +   - **Read-only package files are static, read-only files that you include in
    your app’s package.** Package files are installed once per machine and shared
    by all users. By default, Windows installs package files under the %ProgramFiles%\WindowsApps\PackageFullName\.
    Your’s binary files, WinRT components, and other assets are all staged (installed)
    in this directory. When all users uninstall this version of your package, this
    directory and its contents are permanently removed.


    +   - **Read-write package files are for per-user data created by your app (or
    background tasks) at runtime.** Windows manages the per-user package files under
    the %UserProfile%\AppData\Local\Packages\PackageName directory. This directory
    has several subdirectories to support local, roaming, and temporary package files
    that were discussed in Chapter 4, “Package data and roaming.” The system itself
    creates additional subdirectories to manage system services (such as the background
    transfer service and Internet cache in Chapter 7, "Networking") on your package.
    Your app can create whatever files it desires under the LocalState, RoamingState,
    and TempState directories. These are for your package and remain on the user’s
    machine when the user upgrades to newer versions of your package. The package
    files are permanently destroyed if the user uninstalls your package.


    +   - **User files are considered to be owned and managed by the user, not an
    app or a package.** They typically contain documents, pictures, music, or videos.
    The user decides where these files are stored, but they usually reside in one
    of the user’s Documents, Pictures, Music, or Videos libraries. However, they can
    also reside on network shares or in cloud storage (such as SkyDrive). Your app
    can access user files only with user consent choosing to install a folder picker
    or implicitly consenting to install your package after being notified that your
    package has specified a user file capability in its manifest. More details regarding
    consent are presented later in this chapter. Because user files are managed by
    the user, the files can be accessed by multiple apps and also be accessed by multiple
    users. Upgrading


    > The %ProgramFiles%\WindowsApps directory is a hidden directory, so you will
    not be able to see it in File Explorer unless you choose to show hidden items.
    Once you find the directory and try to open it, you’ll get an "access denied"
    error. However, you can open any of the directory’s subdirectories. Windows automatically
    determines the path via the PackageRoot value, which can be found in the registry
    in the HKEY_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Appkey.


    CHAPTER 5 Storage files and folders 93'
