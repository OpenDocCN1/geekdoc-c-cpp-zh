  md: '# Debugging background transfers


    Because your app can be suspended, background transfers execute in a separate
    process. You can see this in Task Manager. Figure 7-5 shows the App1 app suspended,
    but there is also an App1 Download/ Upload Host that is not suspended. If you
    tap and hold this process and choose Go To, Task Manager takes you to the Details
    tab, selecting a process called BackgroundTransferHost.exe. (This process ships
    with Windows itself)


    ![](img/f105584195b83b4404e3d2b11f5786c3_183_0.png)


    FIGURE 7-5 Task Manager showing the separate process Windows uses to perform background
    transfers.


    Each app using WinRT background transfer API gets its own instance of the BackgroundTransferHost.exe
    process, and each instance runs in the package''s app container. If your app uses
    the background- transfer API, you must turn on the Internet (Client) capability
    in your package''s manifest so that the host process gets this capability.


    As always, you can use the Windows Event Viewer (EventVwr.exe) to see system logs
    related to background transfer. Here''s where to look for the log entries: Applications
    And Service Logs > Microsoft > Windows > Runtime-Networking-BackgroundTransfer?


    +   7 Show Analytic And Debug Logs has to be enabled from the Event Viewer View
    menu. This log is disabled by default.'
