  md: '# CHAPTER 2


    # App packaging and deployment


    In Chapter 1, "Windows Runtime primer," you learned that one of the design goals
    for Windows Store apps was that Windows should be able to cleanly install and
    uninstall the app so that users have confidence that an app will not irreparably
    affect their system. This means that your Windows Store app needs to run successfully
    be combined together so that the system knows the complete footprint of your app.
    The resulting file is called an app package, and it contains binaries such as
    your executable, libraries, and Windows Runtime (WinRT) components. It also contains
    resource files your app uses such as images and media. You use Microsoft Studio
    to build your app and create your app''s package file. This package file then
    be uploaded to the Windows Store, enabling users to install it on their PCs, or
    you can manually distribute the package, enabling users to manually install (sidel)
    on their PCs. Of course, Windows only installs packages that come from trusted
    sources, and it will make sure that the package''s contents have not changed in
    transit.


    In this chapter I will show how to build a package and what the package contains.
    You will also see the different ways to deploy a package to PCs. I will go into
    more details on package installation, including staging and registration. Finally,
    I will finish with some specifics regarding the use of Visual Studio and debugging.
    This is a very important chapter in helping you understand how to work with Windows
    Store apps. The concepts presented in this chapter are very useful and will help
    you understand the concepts presented throughout later chapters in this book.


    # A Windows Store app''s project files


    In this section, we look at the various files that make up a Windows Store app''s
    package, with an emphasis on the manifest file. I''ll also show how Visual Studio
    builds all the files and places them into a package file.


    The first time you create a Windows Store app project in Visual Studio, Visual
    Studio prompts you with a dialog box telling you that you need to get a developer
    license, as you see in Figure 2-1. Developer licenses also run apps that have
    not been downloaded from the Windows Store. This is certainly useful when developing,
    testing, and debugging an app. Developer licenses expire every 30 days (90 days
    if you have registered an account with the Windows Store), but they are free to
    acquire. After your developer license expires, Visual Studio automatically prompts
    you to renew it. It provides PowerShell commands (shown in Table 2-1) to manage
    a PC''s developer license.'
