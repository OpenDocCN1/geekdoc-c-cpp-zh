  md: "# Socket addressing\n\nBefore showing examples with sockets, I need to explain\
    \ how your app identifies a remote system to WinRT, WinRT offers a Windows.Networking.Hostname\
    \ class that abstracts the name or address of a remote system:\n\n```\n```csharp\n\
    public sealed HostName : IString {\n    // Constructor\n    public HostName(string\
    \ hostName); // e.g. \"server\", \"192.168.1.125\", etc.\n\n    // Read-only information\
    \ about the host name:\n    public HostNameType Type { get; } // DomainName, IPv4,\
    \ IPv6, Bluetooth\n    public String RawName { get; } // Same value passed to\
    \ constructor\n    public String DisplayName { get; } // String that can be shown\
    \ to a user\n    public String CanonicalName { get; } // String that can be used\
    \ by the app's code\n    public IPInformation IP { get; } // NetworkAdapter info\
    \ for an IPv4/IPv6 address\n```\n```\n\n```\n```csharp\n// Methods to compare\
    \ canonical hostnames with one:\npublic bool IsEqual(HostName hostName);\nstatic\
    \ Int32 Compare(String value1, String value2);\n```\n```\n\nYou can construct\
    \ a HostName object, passing an IPv4 or IPv6 literal, an actual host name (\"\
    Wintellect.com”), or a Bluetooth address. The constructor sets the Type to indicate\
    \ what kind of string you pass in, determines the DisplayName version of the host\
    \ (which you can show to a user), and also determines the CanonicalName version\
    \ (which you can programmatically within your code).\n\nThe HostName class also\
    \ provides IsEqual and Compare methods, which compare the canonical version of\
    \ two names. Here is an example demonstrating how to compare hosts:\n\n```\n```csharp\n\
    // The top-level domain for the Russian Federation is \"--plai\" (in ASCII) and\
    \ \"пф\" (in Cyrillic). For more information, see http://en.wikipedia.org/wiki/%D1%80%D1%84\n\
    String kremlinAscii = \"prezident.xn-plai\";\nHostName kremlin = new HostName(kremlinAscii);\n\
    String display = kremlin.DisplayName; // \"президент.пф\"\nString canonical =\
    \ kremlin.CanonicalName; // \"президент.пф\"\n```\n```\n\n```\n```csharp\n// Compare\
    \ canonical names:\nBoolean same = kremlin.IsEqual(new HostName(\"президент.пф\"\
    )); // true\nInt32 order = Hostmlin.Compare(kremlinAscii, \"президент.пф\"); //\
    \ 0\n```\n```\n\n// Compare IPv6 addresses\n\n```\n```csharp\nHostName hostname\
    \ = new HostName(\"::1::\");\nsame = hostname.IsEqual(\"::0::1\");           \
    \                     // true\n```\n```\n\n// Compare host names\n\n```\n```csharp\n\
    hostname = new HostName(\"WINTLECT.COM\");\nsame = hostname.IsEqual(new HostName(\"\
    Wintellect.com\")); // true\n```\n```"
