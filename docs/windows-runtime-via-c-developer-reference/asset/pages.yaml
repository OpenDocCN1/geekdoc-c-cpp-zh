  md: 'You should also know that securing network traffic from a Windows Store app
    to your own web service is pretty easy. Here are the steps:


    +   1. Create a certificate (it can be self-signed), and install it in the certificate
    store on your server.

    2. Export the certificate''s public key into a .cer file.

    3. In Visual Studio, open your Windows Store app''s package manifest and go to
    the Declarations tab.

    4. Under Available Declarations, select Certificates and click Add.

    5. In the Trust Flags section, select Exclusive Trust if you want your Windows
    Store app to use only your certificate, ignoring any other certificates installed
    on the user''s PC. If your app will communicate securely with multiple servers,
    do not select Exclusive Trust.

    6. In the Store Name field, enter the name of the certificate store (such as Root)
    where you want the public key stored. Each package has its own private certificate
    store. In the Content field, navigate to the .cer file you exported in step 2.


    Executing the preceding steps embeds the public key of your certificate in your
    package file and allows it to be used when communicating via SSL.'
