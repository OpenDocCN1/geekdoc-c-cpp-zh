    # Deploying a Windows Store package


    A Windows Store package can be deployed (installed) to a user''s PC using three
    different techniques. The technique you depend on the reach—that is, how many
    installs you anticipate. Here are the three reach categories and descriptions
    of which one you use:


    +   - Restricted deployments Use restricted deployments when you want to deploy
    a package to a small set of people. Typically, you use this technique for testing
    scenarios or when you want to give your package to some friends or family members
    for evaluation.

    - Enterprise deployments Use this technique when you want to make a package installable
    by members of your company or enterprise but not to the public at all. This technique
    is typically used for packages containing an app that performs functions related
    to a company''s way of doing business. This technique is frequently referred to
    as sideloading.

    - Windows Store deployments Use this technique when you want to make your package
    available to the general public. Once your package is deployed to the Windows
    Store, anyone running Windows can install your package via the built-in Windows
    Store app. See Chapter 11 for more information about these techniques in detail.


    # Restricted deployments


    Table 2-4 shows the files produced by Visual Studio''s Create App Packages wizard.
    You can copy these files to another PC and install the package by running the
    Add-AppxDevPackage.ps1 PowerShell script. This script performs the following:


    +   1. Prompts the user to acquire a developer license (if one is not already
    installed) by running the Show-WindowsDeveloperLicenseRegistration PowerShell
    script.

    2. Installs the package''s certificate (.cer file) in the PC''s Trusted Store
    by running the CertUtilexe utility.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '3. Unzips the package''s contents (and any dependent framework packages) to
    a directory to the user''s PC by running the Add-AppxPackage PowerShell script.


    Developer licenses are free, but to get one, the machine must have an Internet
    connection and the user must have a Microsoft account. Also, developer licenses
