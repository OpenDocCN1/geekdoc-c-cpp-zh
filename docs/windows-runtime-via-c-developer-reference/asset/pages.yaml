  md: '# Windows Runtime via C#


    # Expert guidance for building Windows Store apps with the Windows Runtime


    Delve inside the Windows Runtime—and learn best ways to design and build Windows
    Store apps. By Jeffrey Richter, a well-known expert in Windows and .NET programming,
    along with principal Windows consultant Maarten de Bospo, you''ll master essential
    concepts. And you''ll gain practical insights and tips for how to architect, design,
    optimize, and debug your apps.


    # With this book, you will:


    +   * Learn how to consume Windows Runtime APIs from C#

    * Understand the principles of architecting Windows Store apps

    * See how to build, deploy, and secure app packages

    * Understand how apps are activated and the process model controlling their execution

    * Study the rich features available when working with files and folders

    * Explore how to transfer, compress, and encrypt data via streams

    * Design apps that give the illusion of running using live tiles, background transfers,
    and download tasks

    * Get advice for monetizing your apps through the Windows Store


    # Get Visual C# code samples


    Download from:

    ://Winintellect.com/Resource-WinRT-Via-Csharp microsoft.com/msspress


    # About this Book


    +   * Requires knowledge of .NET Framework, C#, and the Visual Studio IDE

    * Targeted to programmers building Windows Store apps

    * Some chapters also useful to those building desktop apps


    # Technologies Covered


    +   * Windows 8.1

    * Microsoft Visual Studio 2013


    # About the Authors


    Jeffrey Richter is a cofounder of Winintellect (www.winintellect.com), a training
    and consulting firm helping companies build better software faire. He is the author
    of the classic CLR for C#, now in its fourth edition, and of other popular .NET
    programming books and courses.


    Maarten de Bospoort is a principal consultant with the Premier Services for developers
    in Microsoft. In this role, he teaches professional developers worldwide how to
    write Windows apps and helps independent software vendors architect and optimize
    their code for Windows.


