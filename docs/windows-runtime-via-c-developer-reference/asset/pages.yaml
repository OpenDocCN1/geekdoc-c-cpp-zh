    # # Toast notifications


    An app can pop up toast notifications that notify the user of some time-sensitive
    information. Examples include incoming calls, completion of a download, a printer
    running out of paper, and so on. Note that the app can always pop up a toast notification;
    the user does not have to be interacting with the app. Figure 8-7 shows what a
    toast notification looks like (The 30-pixel logo is shown at the bottom right).
    The user can ignore, dismiss, or tap the toast notification. Toast notifications
    can be accompanied by sound, and they can vary in duration and be tailored for
    different purposes, such as incoming calls or calendar reminders⁴


    > ⁴ Desktop apps can use WinRT APIs to show toast notifications as well. See the
    sample at http://code.microsoft.com/windows/desktop/sending-toast-notifications-71e23d0a2.


    194 PART II Core Windows facilities'
