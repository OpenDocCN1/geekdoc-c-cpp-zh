  md: '+   - Can resume downloads and uploads even if network connectivity issues
    arise during the transfer


    +   - Support HTTP(S) with custom headers (typically used for authentication)
    and FTP (download only) protocols


    +   - Support progress reporting, pause/resume (downloads only), and cancel operations


    +   - Support normal and high-priority transfer operations


    +   - Support transfer groups, allowing you to perform a set of transfers serially
    or in parallel


    +   - Can update a title or display a toast notification when a transfer or transfer
    group completes or fails


    +   - Allow your app to read the data while downloading; your app does not have
    to wait for the download to complete


    Performing a background transfer starts with two classes in the Windows.Networking.BackgroundTransfer
    namespace: BackgroundLoader and BackgroundUpdater. Because it is more common for
    apps to download data, I''ll focus the discussion on downloading. However, because
    these two classes are practically identical, the discussion applies to uploading
    as well. Where appropriate, I will point out differences. The BackgroundLoader
    class looks like this:


    ```

    public sealed class BackgroundLoader : IBackgroundBase

    public BackgroundLoader();

    ```


    ```

