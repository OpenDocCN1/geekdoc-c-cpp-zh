    This method allows the user if the downloads can proceed if the PC is on battery
    power

    public static IAsyncOperation<UnconstrainedTransferResult> RequestUnconstrainedDownloadsAsync(IEnumerable<DownloadOperation>
    operations);


    These static methods (discussed later) resume transferring when

    a terminated process reaches

    public static IAsyncOperation<IReadOnlyList<DownloadOperation>> GetCurrentDownloadsAsync();

    public static IAsyncOperation<IReadOnlyList<DownloadOperation>> GetCurrentDownloadsForTransferGroupAsync(BackgroundTransferGroup
    group);


