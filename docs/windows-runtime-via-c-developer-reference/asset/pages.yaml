  md: "# HttpBaseProtocolFilter\n\nWinRT defines a Windows.Web.Filters.HttpBaseProtocolFilter\
    \ class. When you construct a HttpClient object using its default constructor,\
    \ the object uses an instance of the HttpBaseProtocolFilter class internally.\
    \ It is the HttpBaseProtocolFilter object establishes the TCP socket connection\
    \ with the server, sends the bytes to it, and receives the response back. In addition,\
    \ this class manages caching, cookies, credentials, and a slew of other communication\
    \ parameters. The class looks like this:\n\n```\npublic sealed class HttpBaseProtocolFilter\
    \ : IHttpFilter, IDisposable {\n    public HttpBaseProtocolFilter();\n\n    //\
    \ Get an object allowing you to set cache read and write behavior\n    public\
    \ HttpCacheControl CacheControl { get; set; }\n\n    // Returns the cookie manager\
    \ allowing you to get and set cookies\n    public HttpCookieManager CookieManager\
    \ { get; set; }\n\n    // Allows you to set the maximum connections from filter\
    \ to an HTTP server\n    public UInt32 MaxConnectionsPerServer { get; set; }\n\
    \n    // Can filter follow a redirect response (default = true)\n    public Boolean\
    \ AllowAutoRedirect { get; set; }\n\n    // Can filter automatically decompress\
    \ response data (default = true)\n    public Boolean AllowAutomaticDecompression\
    \ { get; set; }\n\n    // Ignorable SSL errors\n    public IList<ChainValidationResult>\
    \ IgnorableServerCertificateErrors { get; set; }\n\n    // Can use a proxy to\
    \ send request\n    public Boolean UseProxy { get; set; }\n\n    // Sets HTTP\
    \ proxy credentials\n    public ProxyCredential ProxyCredential { get; set; }\n\
    \n    // Sets client certificate to send to (if requested)\n    public Certificate\
    \ ClientCertificate { get; set; }\n\n    // Sets HTTP server credentials\n   \
    \ public PasswordCredential ServerCredential { get; set; }\n\n    // Can filter\
    \ prompt for user credentials at server's request (default = false)\n    public\
    \ Boolean AllowUIUI { get; set; }\n\n    // Sends HTTP request over the wire (HttpRequestAsync\
    \ is IHttpFilter's only member)\n    public IAsyncOperationWithProgress<HttpResponseMessage,\
    \ IProgress> SendRequestAsync(HttpRequestMessage request);\n\n    // Releases\
    \ unmanaged resources associated with the HttpBaseProtocolFilter\n    public void\
    \ Dispose();\nn\n```"
