  md: "Each package has a per-user cache that can hold downloaded HTTP content.9 This\
    \ prevents one package's content downloaded by one user from being visible to\
    \ another user who happens to be using the same package. Using HttpBaseProtocolFilter.CacheControl\
    \ property, you can control how HTTP responses are cached on the user's local\
    \ machine and use this to alter your app's performance.\n\nBefore making an HTTP\
    \ request, you can set CacheControl.ReadBehavior to Default as described in RFC\
    \ 2616. Most(if the server has more recent data, get it; otherwise, use cached\
    \ data),10 or OnlyFromCache(get data from cache when a PC is offline or at startup\
    \ time to show what is cached quickly). You can also set CacheControl.WriteBehavior\
    \ to control how the read data gets into the user's local cache. The possible\
    \ values are Default (save the response in the local cache) and NoCache (do not\
    \ save the response in the local cache (useful when streaming media)). When your\
    \ app gets a response, HttpResponse.Message indicates whether the response came\
    \ from the server or from the user's local cache.\n\nHere is an example that reads\
    \ the most recent data from the server (or cache if it exists); if read from the\
    \ server, the data is not cached locally:\n\n```\nusing (HttpBaseProtocolFilter\
    \ filter = new HttpBaseProtocolFilter())\nusing (HttpClient client = new HttpClient(filter))\
    \ {\n    // Try to get most recent data from server (cache)\n    filter.CacheControl.ReadBehavior\
    \ = CacheControl.MostRecent;\n\n    // If we get from server, don't store it in\
    \ cache\n    filter.CacheControl.WriteBehavior = CacheControlWriteBehavior.NoCache;\n\
    \n    HttpRequest request = new HttpRequest(HttpMethod.Get, new Uri(\"http://intellect.com/\"\
    ));\n    HttpResponseMessage response = await client.SendAsync(request);\n   \
    \ switch (response.Source) {\n        case HttpResponseMessageSource.Cache: //\
    \ Data from cache\n            break;\n        case HttpResponseMessageSource.Network:\
    \ // Data from server\n            break;\n    }\n}\n```\n\n9 The cache is stored\
    \ under %LocalAppData%Packages\\PackageFamilyName\\AC\\NetCache. The INetCache\
    \ directory is hidden, so you won't normally see it when using File Explorer or\
    \ a CMD prompt.\n\n10 This option causes the HttpBaseProtocolFilter to add an\
    \ If-Modified-Since header to the request. If the server returns 200 (OK) or 304\
    \ (Not modified) status code, the cache version is returned, conserving bandwidth\
    \ and improving performance.\n\nCHAPTER 7 Networking 165"
