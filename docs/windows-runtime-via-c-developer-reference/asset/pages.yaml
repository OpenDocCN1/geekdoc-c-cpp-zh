    When the user switches back to a suspended app, the system simply resumes the
    app''s threads and allows the app to interact with the user again. This is great,
    but what if your app real-time data like temperature, stock prices, or sports
    scores? Your app could have been suspended for weeks or maybe months. In this
    case, you wouldn''t want your app to simply resume and show the stale data. So
    WinRT''sApplication base class offers a Resuming event (which really just wraps
    CoreApplication''s Resuming event). When an app is resumed, this event is raised
    and your code can refresh its data to show the user current information. To know
    how long your app was suspended, query the time in the Suspending event and subtract
    this value from the time obtained in the Resuming event; there might be no need
    to refresh data if only a small amount of time passed. There is no time restriction
    on your Resuming event''s callback method. Many apps do not have real-time data,
    so your apps have no need to register with the Resuming event.


    > If Windows suspends your app and subsequently activates it with a hosted view
    activation (such as Share), Windows does not resume all the threads in your app;
    the main thread remains suspended. This can lead to blocking threads if you attempt
    to perform any kind of cross-thread communication.


    # Windows Store app termination


    In this chapter, we''ve talked a lot about how to efficiently manage memory of
    your app. This is critically important because many mobile PCs do not have the
    amount of memory that desktops traditionally have. But, even if all Windows Store
    apps manage their memory as described in this chapter, there is still a chance
    that the user could start Windows Store apps and the system'
