- img_proc: true
  md: 'Apps that are working critically important data can FlushAsync to reduce the
    chance of being lost. Beware that because a power failure could still occur between
    calling WriteAsync and FlushAsync. WinRt''s FlushFileAsync does the same thing
    as Win32''s FlushFileBuffers. (See https://msdn.microsoft.com/en-us/library/windows/desktop/a364439.aspx.)
    Note that calling FlushAsync hurts the performance of your app, and this is why
    many apps will not call it.¹


    The IInputStream and IOutputStream methods allow you to access a stream sequentially
    and are useful when you don''t know the number of bytes in a stream (as is with
    network streams). However, the IRandomAccessStream interface allows you to access
    the underlying stream randomly. Because IR IRandomAccessStream inherits from both
    IInputStream and IOutputStream, it can be used for reading and writing.


    To start reading or writing to a specific byte within a stream, IRandomAccessStream''s
    Seek method positions you to the desired byte and then call ReadAsync or WriteAsync
    to start the stream sequentially from the desired position. Alternatively, you
    can GetInputStreamAt or OutputStreamAt to get a stream starting at a byte offset
    within the stream. The stream''s Position advances whenever you call ReadAsync
    or WriteAsync.


    > Important Make sure you read and write operations sequentially with a single
    stream to maintain the integrity of the stream''s current position. Issuing multiple
    requests concurrently produces non-deterministic results.


    The IRandomAccessStream interface offers a Size property you can query or set
    the size of the stream. Under normal circumstances, you would not set the size
    because the system grows when appending to a random-access stream. But, if you
    know what size you want the stream to be before writing to it, you might want
    to set the size first because this tends to improve performance when writing to
    the stream.


    Therefore, to read or write to a file, you would simply call IStorageFile''s Open
    method to obtain an IRandomAccessStream and then calling its ReadAsync or WriteAsync
    methods. When done, you can call Dispose or let the garbage collector take care
    of it. You''ll see code demonstrating this. IStorageFile offers an OpenTransactionalWriteAsync
    method that returns a reference to a StorageStreamTransaction object that implements
    the IClobable interface. The StorageStreamTransaction is discussed in this chapter''s
    "Performing written operations section."


    Understanding the streams object model is critically important when building Windows
    Store apps because many components use streams. For example,


    +   - IRandomAccessStream interface is used by storage files, images, bitmaps,
    thumbnails, media, and the InMemoryRandomAccessStream class.


    ¹ For more information, read https://blogs.msdn.microsoft.com/bloldnew/archive/2010/09/09/10059575.aspx.'
