    Having your app support roaming settings is free, and it couldn''t be easier to
    implement. All you have to do is add settings to ApplicationData\RoamingSettings
    or add files to Application-RoamingFolder. Windows takes care of everything. For
    example, Windows automatically roam the data when an Internet connection is available,
    Windows will keep the user''s data, and Microsoft provides the storage servers
    that persist the user''s data.³ Note that Microsoft''s servers limit how much
    storage package can roam. An app can determine this amount by querying ApplicationData\RoamingStorageQuota
    property. Currently, this returns a value of 100 KB. If your package goes over
    its quota, Windows starts roaming any of your package''s data⁴ It is up to capacity
    limit how you use your package''s roaming storage. This means you should store
    small pieces of data. For example, instead of roaming content, link to the content
    index. If you need more than the allowed quota, you will have to build your own
    roaming infrastructure (servers, authentication and communication mechanisms,
    and so forth.),⁵ The purpose of the Windows-provided roaming is to allow any developer,
    college student, and enthusiast to roam data without having to deal with these
    infrastructure details.


    > ³ Your package''s data is actually in the user''s SkyDrive account, but the
    storage is not part of the user''s quota and the user has no direct access to
    the data maintained by SkyDrive.


    > ⁴ Windows does not limit the amount of data that can be stored in roaming settings
    or folders, but there is a limit to how much of that can be synced with the cloud.


    > ⁵ One is option to help your app use Drive APIs to explicitly sync your package''s
    data with the user''s SkyDrive-account. This will require the user''s permission.


