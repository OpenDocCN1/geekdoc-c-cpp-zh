  md: '# Maintenance and time triggers


    Maintenance and time triggers behave identically. they execute some code at some
    future time. To allow the system to sleep as much as possible (conserving battery),
    these triggers fire at most 96 times a day (every 15 minutes). You can configure
    these triggers so that Windows runs your code just once, or you can have Windows
    run your code repeatedly (like once an hour).


    The difference between these two triggers is that a maintenance trigger executes
    your code only if the PC is plugged in on AC power² On the other hand, a time
    trigger executes your code when the PC is on AC or battery power. Most people
    think that a time trigger is the better choice because your code is more likely
    to run. However, users must put your app on their lock screen in order for a time
    trigger to execute your task''s, and users might decide not to do so. Putting
    an app on their lock screen is how users indicate that they are willing to let
    your background tasks consume battery power. I’ll talk about lock-screen apps
    later in this chapter’s “Lock-screen apps”


    Although maintenance and time triggers behave identically, they serve different
    purposes. You typically use maintenance triggers for nonurgent opportunistic work,
    such as content indexing and renewing a Windows Push Notification Service (WNS)
    channel for updating tile, toast, and raw notifications.³ See Chapter 8) On the
    other hand, you typically use time triggers for urgent work that an end user really
    cares—for example, an email program that periodically polls a server looking for
    new mail messages.


    # System triggers


    The system trigger allows your code to execute when a system-related event occurs.
    Table 9-2 lists all the system types and their lock-screen requirements.


    TABLE 9-2 System triggers and lock-screen requirements.

    | System trigger type | When trigger fires | Requires lock screen |

    |---|---|---|

    | InternetAvailable | When internet connectivity is established | X |

    | NetworkStateChange | When the connection state changes (cost, LAN/WiFi/3G) |
    X |

    | ServingComplete | After a new version of your app is installed | X |

    | OnlineConnectedStateChange | When the Microsoft account associated with the
    logon changes | X |

    | TimeZoneChange | When the PC’s time zone changes | X |

    | SmsReceived | When the device receives an SMS message | X |

    | LockScreenApplicationAdded | When the user puts your app on the lock screen
    | X |


    ² If a maintenance trigger fails to fire when the machine is on battery, the system
    executes your code as soon as the PC is plugged back into AC power.


    ³ WNS channels expire every 30 days and, of this writing, I’m not aware of any
    computer that can last a full 30 days on battery power. Therefore, updating a
    WNS channel is not something that requires urgent attention.'
