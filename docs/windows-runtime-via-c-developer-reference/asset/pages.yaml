  md: "# Deploying a new version of your app\n\nBeware that previously registered\
    \ background tasks remain registered when a user installs a newer version of your\
    \ app's package. So, as you are creating a new version of your app, do not change\
    \ the names of your background tasks' classes or the name of the .WinMD files\
    \ that contain; if you do, your background tasks will just stop running. If you\
    \ need to alter your background tasks with a new version of your app, register\
    \ a background task using a system trigger with a ServicingComplete trigger type.\
    \ This trigger fires just after a user installs a newer version of your app's\
    \ package. In this task run, you can unregister any old tasks and register any\
    \ new tasks (with any class name or .WinMD filenames) you wish.\n\nUse BackgroundTaskRegistration\
    \ class static AllTasks property to iterate through all the currently registered\
    \ tasks and unregister any you no longer want. This code shows how to unregister\
    \ all of them:\n\n```\nforeach (var task in BackgroundTaskRegistration.AllTasks)\n\
    \    task.Value.Unregister(true);\n```\n\nOnce your loop completes, you can register\
    \ any background tasks the new version of your app requires.\n\nI recommend that\
    \ you always register a background task using a system trigger with a ServicingComplete\
    \ trigger type, even if its Run method does nothing. This allows a new version\
    \ of your app's package to execute code after installation, even without starting\
    \ the new version of your app. You can unregister tasks and register new tasks,\
    \ of course. But this is also useful for upgrading your package's data (as discussed\
    \ in Chapter 4).\n\n# Background task progress and completion\n\nEach background\
    \ task can notify its app of its progress and completion. Of course, this information\
    \ is useful only if the app is actually running, not suspended or terminated.\
    \ Because of this, the notification mechanism is not reliable and an app should\
    \ not require getting these notifications. However, I will explain briefly how\
    \ to enable these notifications. The best way to reliably transfer data between\
    \ an app and its background tasks is to use package data settings or files as\
    \ described in Chapter 4. If the app and background task are running, one could\
    \ notify the other of the change by calling ApplicationData.s DataChanged method.\n\
    \nFirst, the app must get a reference to a background task's BackgroundTaskRegistration\
    \ object. You get this by calling BackgroundTaskBuilder's Register method or by\
    \ calling BackgroundTaskRegistration class's static AllTasks property.\n\nOnce\
    \ you have a BackgroundTaskRegistration object, it exposes Progress and Completed\
    \ events with which you can enlist callback methods. Note that your callback methods\
    \ are not invoked using the GUI thread, so if you want to manipulate user interface,\
    \ you will have to call CoreDispatcher's RunAsync method."
