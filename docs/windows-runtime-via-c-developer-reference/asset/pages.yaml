  md: '# Submitting your app


    Once you''ve established a developer account, you can submit an app to the Windows
    Store. The Dashboard makes this really straightforward by giving you a step-by-step
    approach for getting your app into the Store, as shown in Figure 11-1. This is
    where you fill out most of the data users see in the Windows Store.


    ![](img/f105584195b83b4404e3d2b11f5786c3_272_0.png)


    **Figure 11-1** Steps for submitting your app to the Store.


    Let''s walk through some of these steps.


    +   - **App Name** First you have to reserve a name for your app. To prevent spoofing,
    the Windows Store requires that all names be unique and that you have the rights
    to use the name. If you want to localize your app''s name, you can provide those
    translations here as well. You can reserve a name up to one year before submitting
    your app to the Store. If you do not submit an app within one year, someone else
    can take the name. When you use Microsoft Visual Studio to associate your app
    with the Store, Visual Studio modifies your app''s package manifest file so that
    your package''s display name and app''s display name are both set to your reserved
    name.'
