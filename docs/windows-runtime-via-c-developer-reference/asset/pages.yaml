  md: 'JavaScript developers embed their source code into package file when submitting
    to Windows Store certification. Because the source code is just text, it is CPU
    agnostic; therefore, only one package file needs to be submitted. At runtime,
    Microsoft''s Internet Explorer virtual machine parses the source code, allowing
