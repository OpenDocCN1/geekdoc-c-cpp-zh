  md: "# StreamSocketListener: Server-side TCP communication\n\nAlthough it's not\
    \ as common as client-side communication, your Windows Store app can listen for\
    \ TCP connections coming into it. This is useful for peer-to-peer scenarios where\
    \ your app wants to let multiple users collaborate with each other or on his PC.\
    \ A game might like this would allow two players to play against each other. Setting\
    \ your app as a TCP listener requires the use of the StreamSocketListener class,\
    \ which looks like this:\n\n```\npublic sealed class StreamSocketListener : IDisposable\
    \ {\n    public StreamSocketListener()\n\n    // OPTIONAL: Modify connection (QoS)\
    \ before calling BindXxxAsync\n    public StreamSocketListenerControl Control\
    \ { get; }\n\n    // Returns read-only information about the connection (local\
    \ port)\n    public StreamSocketListenerInformation Information { get; }\n\n \
    \   // This event is raised whenever a client connects to this StreamSocketListener,\n\
    \    public event EventHandler<StreamSocketListenerConnectionReceivedEventArgs>\
    \ ConnectionReceived;\n\n    // Start listening on local IP addresses of all NICs\n\
    \    // If localServiceName is \"\", system picks port\n    public IAsyncAction\
    \ BindServiceNameAsync(string localServiceName);\n\n    // Start listening on\
    \ the hostname/IP address and service name specified.\n    // If localHostName\
    \ is \"null\", local IP is used; if localServiceName is \"\". OS picks port.\n\
