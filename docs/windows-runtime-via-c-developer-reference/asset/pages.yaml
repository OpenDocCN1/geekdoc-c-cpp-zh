  md: '# Tiles and badges


    Your app can use its tile for a variety of purposes. Of course, users can always
    tap or click a tile to launch an app. If the app is in the suspended state when
    the user taps its tile, the system brings the app back to the foreground, using
    the tile as a mechanism to switch tasks. Users select one or more tiles by right-clicking
    and pressing the spacebar, or with a tap and hold gesture. The Start screen''s
    app bar offers options to control the selected tiles. Specifically, the user can
    unpin an app''s tile from the Start screen, uninstall the app, change the tile''s
    size, and disable tile updates by tapping Turn Tile Off. (See Figure 8-1)


    ![](img/f105584195b83b4404e3d2b11f5786c3_207_0.png)


    Figure 8-1 App bar for the Start screen for a selected tile.


    A user can remove personal information from all tiles (for example, when giving
    a presentation) via Settings pane > Tiles > Clear. Also, users can rearrange their
    tiles, group them, and assign names to groups. In addition, users can zoom out
    to see more tiles using semantic zoom. Desktop apps also have tiles; however,
    the tiles are always square and cannot be updated. In addition, Internet Explorer
    can pin a website to the Start screen; this tile can update its contents periodically.
    For more information, see http://www.buildmypindesite.com.


    The Start screen supports four tile sizes (as shown in Figure 8-2). An app must
    provide static logos (images) for tile that Windows requires and optionally provide
    logos for tile sizes the app wishes to support. An app must also provide a logo
    for the app''s branding. The app must provide some additional logos if it supports
    certain background tasks that allow the app to be placed on the user''s lock screen.
    (See Chapter 9, "Background tasks," for more information.) Table 8-2 lists the
    logos related to Start screen tiles, branding, and the lock screen.


    ![](img/f105584195b83b4404e3d2b11f5786c3_207_1.png)


    Figure 8-2 The Start screen showing four small tiles (top left), one medium tile
    (with "Mail" as the badge) and "1" as the tile (bottom left, with a branding),
    and one large tile with "Weather" as the branding name.


    +   1 Enter semantic zoom mode by pinching your fingers together, using Ctrl+Mouse
    wheel, or using Ctrl+Plus Sign or Ctrl+Minus Sign.


    PART II Core Windows facilities'
