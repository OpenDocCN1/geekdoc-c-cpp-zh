    // Send message header (Uint32) and message bytes to server:

    Byte[] messageData = new byte[] { 1, 2 };

    dw.WriteUint32((Uint32)messageData.Length);

    dw.WriteBytes(messageData);

    await dw.StoreAsync();

    ```


