    # The Windows Store commerce engine


    Many Windows Store apps are available to users for free. Maybe the app didn''t
    take much effort to develop and the developer just wants to make it available.
    Or maybe the app is a rich client over a service that users purchase in some other
    way (like the Netflix app, which is free because users must already have a valid
    Netflix subscription) to use the app. Some apps are also free because they incorporate
    advertising into the app using an advertising SDK, such as the Microsoft Advertising
    SDK for Windows. Be aware that advertising requires network access, forcing you
    to a private state for your app, and advertising also works when the user''s PC
    is connected to a network.


    Developers can also integrate a commerce engine into their app, which allows them
    to collect when users purchase the app or any in-app products. The Windows Store
    provides a commerce engine you can use within your app. However, you do not have
    to use the Windows Store commerce engine. You can use third-party commerce engines.
    In fact, PayPal offers a commerce engine and an SDK using WinRT components, which
    is available from http://Services.WindowsStore.com/. If you use a third-party
    commerce engine, you must list your app as Free on the Windows Store and notify
    users who the provider is when they make a purchase. (See the requirements-section,
    4.7.)


    This section focuses on the Windows Store commerce engine because it is expected
    that many developers will use it and because the WinRT APIs to integrate with
    it are built into the Windows operating system itself.


    The Windows Store commerce engine supports many features, including the following:


    +   - Free app trials (time-based and feature differentiated). Providing a free
    trial of your app is strongly encouraged because statistics show that users are
    much more likely to purchase an app that they have tried and liked. Users are
    much less likely to purchase an app before they have the opportunity to try it
    out.

    - A wide range of price points, ranging from $1.49 all way up to $999.99.

    - The ability to accept money in local currencies for 200 different markets around
    the globe.

    - After a user purchases an app, the app can sell in-app products (like the ability
    to turn in-app advertising or enabling the viewing of some video). In-app products
    can expire after some period of time like 1 day, 1 month, or year.


    If you choose to use the Windows Store commerce engine, Microsoft pays you 70
    percent of the first $25,000 and 80 percent of all revenue beyond the $25,000.
    Having different versions of your app does not affect this. That is, the total
    revenue earned does not reset if you create a newer version of your app.'
