  md: 'If your app accesses a network, it must provide a privacy statement as stated
    in requirement 4.1.1. The reason is because network requests include the client''s
    IP address, which is personal information. The privacy policy must indicate what
    you intend to do with this personal information: discard it, log it, use it to
    determine a person''s name and address, and so on. You must provide the link to
    your privacy policy in the Dashboard (via the Description web), and users must
    be able to get to your app''s Settings page. When Visual Studio creates a new
    Windows Store app project, it turns on the Internet (Client) capability by default,
    you must either turn this capability off or provide a privacy statement for your
    app to pass certification.


    > > Important Section 6.2 of the app-certification requirements mandates that
    any app that transmits personal information must be assigned a Windows Store age
    rating of 12 or over. So any app that specifies a network capability in its manifest
    must be rated for users who are at least 12 years old or your app will not pass
    certification.


    Make sure you test on all platforms, with without keyboard, mouse, touch, and
    with different sizes. Also, test the availability of network connections. You
    can use the simulator to simulate restricted network conditions with roaming and
    data limits. (See Figure 11-5-


    ![](img/f105584195b83b4404e3d2b11f5786c3_277_0.png)


    # Monitoring your app


    Once your app is available to users, you can periodically see how your app is
    doing by logging in to your Windows Store Dashboard (https://appdev.microsoft.com/StorePortals).
    Here, you will find a wealth of information about all your apps. You can get all
    the following details:


    +   * Downloads per day This report allows you to filter or get by market, age,
    and gender. You can hone in on the last month or the last 3, 6, 12 months, and
    the Dashboard shows how your app is stacking up to the average of the top five
    apps in its subcategory.

    * In-app purchases This report shows if your app offers in-app purchases.

    * Usage This report shows the total usage of your app in minutes per day.'
