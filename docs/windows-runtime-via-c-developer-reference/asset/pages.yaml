    \ your code can access the ShareOperation's Data property; it returns a DataPackageView\
    \ object containing the data passed to the share target app. With this, your code\
    \ can execute some of its properties and data formats to populate the hosted view's\
    \ user interface as you desire.\n\nUltimately, your app's share target page must\
