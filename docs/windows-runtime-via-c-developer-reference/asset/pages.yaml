    # Windows Store deployments


    This method of deployment is by far the most important, and Chapter 11 is dedicated
    to covering the Windows Store in great detail. This section focuses on the mechanics
    of deploying an app via the Windows Store.


    After reserving a name for your package via the Windows Store dashboard, you can
    use Visual Studio''s Associate Your App With The Store item to associate your
    package with the reserved package name. Once you''ve done this, Visual Studio
    creates a temporary untrusted signing certificate of the subject is now a GUID
    (assigned by the Windows Store). This GUID is your Publisher ID, and it uniquely
    identifies you as the publisher when you registered your individual or business
    account with the Windows Store. In your package''s manifest file, Visual Studio
    updates the Package Name, Package Display Name, Publisher Display Name, and Application
    Display Name. Of course, the Package Family Name and Full Name are also updated
    to reflect the new Publisher ID value (GUID).


    When you finish developing and testing your app, upload your final .appxupload
    to the Windows Store via the dashboard. Microsoft tests your app. After pass certification,
    the Windows Store signs your package file with a Windows Store certificate where
    your Publisher ID GUID is the subject. The Windows Store certificate is already
    installed on all Windows PCs (which is why it is not necessary to have a developer
    license or Enterprise Sideloading installed on users'' PCs).


    Now when a user downloads your package from the Windows Store, Windows unzips
    the package''s contents into the %ProgramFiles%WindowsApps directory, registers
    the app with the system for the current user, and the user can launch the app.'
