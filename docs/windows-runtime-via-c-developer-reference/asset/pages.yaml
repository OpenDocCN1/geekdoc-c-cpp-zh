  md: '# Package data change notifications


    When Windows copies a package''s roaming data from the cloud onto a user''s PC,
    Windows raises ApplicationData.DataChanged. If your app registers with this event,
    it can refresh its new roaming settings and modify its behavior on the fly while
    the user is interacting with your app. Note that Windows raises this event on
    a thread pool thread, so you''ll have to use a CoreDispatcher if you want to update
    your app''s user interface.


    Windows raises the DataChanged event automatically whenever the PC downloads new
    roaming data. But your app can raise this event itself by calling ApplicationData.DataChanged
    method. Calling this method is useful if a changes in one part of your app and
    you need to let another part of your app know that settings have changed so that
    it can query its new value. This is also useful if you need your app to signal
    a setting change to one of its background tasks (as discussed in Chapter 9) or
    vice versa.'
