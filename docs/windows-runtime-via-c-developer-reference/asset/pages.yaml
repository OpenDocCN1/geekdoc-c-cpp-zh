  md: "```\nnamespace System.Runtime.Interop.WindowsRuntime\n[ComImport]\n[InterfaceType(ComInterfaceType.InterfaceIsUnknown)]\n\
    [Guid(\"905a0ffef-bc53-11df8-8c49-001e4fc686da\")]\ninternal interface IByteBufferAccess{\n\
    \    unsafe Byte* Buffer { get; }\n}\n```\n\nInternally, the CLR can take an IBuffer\
    \ object, query for it and then query the buffer to get an unsafe pointer to the\
    \ bytes contained within the buffer. With the pointer, the bytes can be accessed\
    \ directly.\n\nTo avoid having developers unsafe code that manipulates pointers,\
    \ the .NET Framework Class Library includes a WindowsBufferExtensions class defines\
    \ a bunch of methods that .NET Framework developers explicitly call to convert\
    \ between .NET byte arrays and WinRuntime objects. These methods are shown here:\n\
    \n```\n// Defined in System.Runtime.Interop.WindowsRuntime.dll\nnamespace System.Runtime.Interop.WindowsRuntime\
    \ {\npublic static class WindowsRuntimeExtensions {\n    public static IByteBuffer\
    \ AsBuffer(this Byte[] source);\n    public static IByteBuffer GetWindowsBuffer(this\
    \ MemoryStream stream);\n\n    public static Byte[] ToArray(this IByteBuffer source);\n\
    \    public static Stream AsStream(this IByteBuffer source);\n\n    // Not shown:\
    \ overloads, CopyTo, GetByte, & IsSameData\n}\n```\n\n> Note In general, methods\
    \ that start with As (like AsBuffer and AsStream) are casts; that is, they make\
    \ one type look like another. These methods are fast and efficient. On the other\
    \ hand, methods that start with To (like ToArray) convert one type to another\
    \ by copying data and are therefore not efficient as the methods.\n\nThis is code\
    \ demonstrating how to use many of WindowsRuntimeExtension's framework projection\
    \ methods:\n\n```\nprivate async void SimpleWriteAndRead(StorageFile file) {\n\
    \    using (IRandomAccessStream raStream = await file.OpenAsync(FileAccessMode.ReadWrite))\
    \ {\n        byte[] bytes = new[] { 1, 2, 3, 4, 5 };\n        uint32 bytesWritten\
    \ = await raStream.WriteAsync(bytes.AsBuffer()); // Byte[] -> IByteBuffer\n\n\
    \        using (var ms = new MemoryStream()) {\n            using (var sw = new\
    \ StreamWriter(ms)) {\n                sw.WriteLine(\"A string in a stream\");\n\
    \                sw.Flush(); // Required: Flushes StreamWriter's contents to underlying\
    \ MemoryStream\n            }\n            await raStream.WriteAsync(ms.GetWindowsBuffer());\
    \ // Stream -> IByteBuffer\n        }\n        // Close the stream\n    }\n}\n\
    }\n```"
