    and see this package''s unzipped contents. Also, Wintint''s Package Explorer Desktop
    app (discussed later) can enumerate all packages installed by the current user.


    At this point, the package is installed and integrated with the operating system.
    The user can go to the Start screen or App view screen and launch the package''s
    app until either the developer license or the package''s certificate expires.


    # Enterprise deployments


    Many companies produce line-of-business (LOB) or enterprise (B2B) apps whose sole
    purpose is to be used by employees or partners of the company. For these kinds
    of apps, it would be too much of a burden to have all users install and personally
    renew developer licenses. In addition, the developer license is free for a company
    not wanting to post its internal business apps in the Windows Store where anyone
    could install them. To install a package containing an app, Windows allows sideloading.


    To sideload a package, the enterprise must obtain a Software Publisher Certificate
    (SPC) from a trusted certificate authority. Windows trusts many certificate authorities
    without any additional configuration. If your package''s certificate is one of
    these already trusted authorities, you don''t need to deploy and manage additional
    certificates to the targeted Windows PCs. Alternatively, you can use a certificate
    from your company''s internal Certificate Authority (CA) to sign your package.'
