  md: "```\nusing (IRandomAccessStream stream = await File.OpenAsync(FileMode.Read))\n\
    // NOTE: This is the most efficient way to allocate, parse & access data:\nByte[]\
    \ data = new Byte[5]; // Allocate the Byte\nIBuffer proposedBuffer = data.AsBuffer();\
    \ // Wrap it in an object that implements IBuffer\nIBuffer returnedBuffer = await\
    \ stream.ReadAsync(proposedBuffer, proposedBuffer.Capacity, InputStreamOptions.None);\n\
    if (returnedBuffer != proposedBuffer {\n// The proposed & returned IBuffers are\
