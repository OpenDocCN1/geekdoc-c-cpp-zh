- img_proc: true
  md: "was watching. This would result in very poor user experience. You can rewrite\
    \ the code using the ApplicationDataCompositeValue to fix this:\n\n```\nApplicationDataCompositeValue\
    \ compositeValue = new ApplicationDataCompositeValue {\n  \"LastVideoWatched\"\
    , videoName,\n  \"LastVideoPosition\", videoPosition\n};\nappData.LocalSettings.Values[\"\
    LastVideoInfo\"] = compositeValue;\n```\n\n```\n// This shows how to read the\
    \ information out:\ncompositeValue = (ApplicationDataCompositeValue)appData.LocalSettings.Values[\"\
    LastVideoInfo\"];\nvideoName = (String)compositeValue[\"LastVideoWatched\"];\n\
    videoPosition = (Int32)compositeValue[\"LastVideoPosition\"];\n```\n\nNow, the\
    \ assignment of the ApplicationDataCompositeValue object is an all-or-nothing\
    \ transaction so that an unhandled exception means the next time your app starts\
    \ up it will either have the old video information or the latest video information;\
    \ it cannot have some and some new information. A single ApplicationDataCompositeValue\
    \ object can contain up to 64 KB of data.\n\nWhen building and debugging an app,\
    \ it is useful to know how Windows handles your package's data settings. The settings\
    \ are stored in a registry file called Settings.dat. You can find this file in\
    \ the following directory: %LocalData%\\Packages\\PackageFamilyName\\Settings.\
    \ You can view and modify a package's data settings by loading this file into\
    \ RegEdit. To do this, start RegEdit, select HKEY_LOCAL_MACHINE, and then select\
    \ File, Load Hive. In the Load Hive dialog box, select the key name you created,\
    \ and explore. Although it is easy to see all the key values, you expand the HKEY_LOCAL_MACHINE\
    \ node, unfortunately all the data is shown as byte arrays, which makes it a bit\
    \ difficult to read and modify.\n\nAs an alternative, you can use Intellect's\
    \ Package Explorer desktop app (discussed in Chapter 2, \"App packaging and deployment\"\
    ) to see all of a package's data settings. Package Explorer uses the documented\
    \ Windows.Management.Core.ApplicationDataManager class CreateForPackageFamily\
    \ method to access a package's data.\n\nThe ability for desktop applications to\
    \ access a Windows Store package data is quite powerful. For example, you can\
    \ create a tool that exports and imports a package's data. This can be useful\
    \ for repeatedly testing against a known set of initial data. Also, companies\
    \ can produce diagnostic tools that customers can use to capture information about\
    \ their environment (including package data) to send back to the company to help\
    \ diagnose customer issues. And, once package data is exported, it can be imported\
    \ by many PCs, enabling a way to configure all these PCs identically. For example,\
    \ an enterprise can use a desktop app or script to preset a Windows Store app.exe\
    \ configuration settings, connection strings, and so on."
