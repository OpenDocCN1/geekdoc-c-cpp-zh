    public Boolean IsTrial { get; } // True for a trial license

    public DateTime OffsetExpirationDate { get; } // For a trial license, indicates
    expiration

    ```


    ```

    // This member return information about each product''s license

    public IReadOnlyDictionary<String, ProductLicense> ProductLicenses { get; }

    ```


    ```

    // Raised when an app or product license changes on the local PC or on another
    PC

    public event LicenseChangedEventHandler LicenseChanged;

    ```


    The ProductLicense class looks like this:


    ```

    public sealed class ProductLicense {

    public String ProductId { get; } //s name of product

    public Boolean IsActive { get; } // False if product not licensed

    public DateTime OffsetExpirationDate { get; } // For a consumable, indicates expiration

    ```


    > Note: When licenses change using CurrentAppSimulator, only the license information
    in memory is updated; the XML file is not updated to reflect the licenses. If
    you stop your app, restart it, and call CurrentAppSimulator''s ReloadSimulatorAsync
    with the XML file you used before, all licenses will revert to the stated state
    in the XML file.


    > Note: The code that accompanies this book has some very useful classes that
    can greatly simplify working with the Windows Store commerce engine. The classes
    allow you to dynamically at runtime the XML you need to pass to the simulator.
    These classes support IntelliSense and compile-time type-safety. Having the ability
    to dynamically construct the XML greatly simplifies and enables automated testing
    of app and product purchase scenarios. In addition, the code automatically updates
    the XML file as licenses change. This allows you to start with no licenses, acquire
    new licenses, stop debugging, restart the app, and retain all the licenses you
    acquired during the previous session.


