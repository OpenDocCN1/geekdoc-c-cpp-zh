    # # Step 4: Register your app''s background tasks


    Once you''ve implemented the WinRT background task components in a .WinMD file
    and declared your app''s background tasks in the manifest, you''re ready to have
    your app register the background tasks with Windows itself with additional details
    about the tasks and when they should execute. Many people want to register their
    app''s background tasks as soon as the user installs the app. However, this is
    not possible. The user must run your app, and then your app can register its background
    tasks. In some corporate environments or with original equipment manufacturer
    (OEM) PCs, the PC might have many pre-installed apps that never launches. If Windows
    allowed registration of an app''s tasks upon installation, all these apps'' background
    tasks could run even though the user might not care about any of the apps at all.


