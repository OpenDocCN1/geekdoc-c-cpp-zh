    # Encrypting data traversing with the network with certificates


    Frequently, when sending data over a network, you encrypt the data you''re sending.
    There are many ways to encrypt data as it traverses a network, but the most common
    way is using certificates. There are two ways a client app can encrypt data it
    wants to send to a server. The first is by using a URI scheme, when using the
    BackgroundDownloader, BackgroundUploader, or HttpClient, simply use "https://"
    instead of "http://". When using the WebSocketClient or DatagramWebSocket class,
    use "wss://" instead of "ws://".


    When using StreamSocket, you can specify a ProtectionLevel enumeration calling
    ConnectAsync, or you can make a call to UpgradeToSecureAsync after establishing
    a connection. The StreamListener class does not have a mechanism of setting up
    Sockets Layer (SSL) on the server side. Thus, your Windows Store app can participate
    only in an SSL connection to a server that exposes SSL, not to another Windows
    app.'
