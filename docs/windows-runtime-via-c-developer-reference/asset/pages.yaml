    CheckNetIsolation.exe is monitoring the firewall, and if it finds that your app
    is trying to reach an address the firewall has blocked, it flags it. As you can
    see from the preceding example, it has noticed that the app was trying to reach
    an address on the intranet and flagged the capability missing.


    > A Windows Store app is always allowed to establish itself both as a server and
    client, and Windows does allow the app to communicate with itself. This allows
    you to have a clean architecture where the client code connect to the server code
    as if the client were connecting via the network. In addition, if your Windows
    Store app is just talking to itself, you do not need to add the Internet (Client
    & Server) capability to your package''s manifest.


    # Network connection profile information


    Network connections are tenuous, especially Wi-Fi and mobile connections. This
    means you must code your app to be resilient against dynamic network changes,
    bandwidth changes, and cost changes. Your app learns about the current state of
    the network by calling the NetworkInformation class'' static GetInternetConnectionProfile
    method:


    ```

    ConnectionProfile cp = NetworkInformation.GetInternetConnectionProfile();

    ```'
