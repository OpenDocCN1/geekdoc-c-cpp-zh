  md: 'type. This object, whose reference I put in asyncOp variable, represents the
    asynchronous operation. Your code must somehow receive notification when the pending
    operation completes. To do this, you must implement a callback method (CompleteListener
    in my example), create a delegate to it, and assign the delegate to the asyncOp''s
    Completed property. Now, when the operation completes, the callback method is
    invoked via some thread (not necessarily the GUI thread). If the operation completes
    before assigning the delegate to the OnCompleted property, the system invokes
    the callback as soon as possible. In other words, there is a race condition here,
    but the object implementing the IAsyncXxx interface resolves the race for you,
    ensuring that your code works correctly.


    As noted in the WinRTAsyncIntro, you can call a Cancel method offered by IAsyncXxx
    interfaces if you want to cancel the pending operation. All asynchronous operations
    complete for one of three reasons: the operation is explicitly cancelled, or the
    operation fails. When the operation completes due to any of these reasons, the
    system invokes the callback method, passing a reference to the object that the
    original XxxAsync method returned and an AsyncStatus. In my OnCompleted method,
    I examine the status parameter and either process the result due to the successful
    completion, handle the explicit cancellation, or handle the failure. Also, note
    that processing the operation''s completion, the IAsyncXxx interface object should
    be cleaned up by calling its Close method.


    Figure 2 shows the WinRTAsyncXx interfaces. The main interfaces all derive from
    the IAsync interface. The two IAsyncAction expose a GetResult method with a void
    return type. If the operation failed, this method throws an exception that you
    can catch, allowing your error-recovery code to execute. The two IAsyncOperation
    interfaces expose a GetResult method with a non-void return type. Calling this
    method returns the result of the operation or throws an exception if the operation
    failed.


    The two IAsyncXxxProgress interfaces allow you to receive periodic progress updates
    through your work. Most asynchronous operations do not offer progress updates,
    but some do (like background downloading and uploading, which are discussed in
    Chapter 7, "Networking”). To receive periodic progress updates, you define another
    callback method in your code, create a delegate that refers to it, and assign
    the delegate to the IAsyncXxxProgress object''s Progress property. When your callback
    method is invoked, it is passed as an argument which matches the generic TProgress
    type. We will show an example of this in the "Cancellation and progress" section.


    13 The IAsyncInfo interface offers a Status property that contains the same value
    that is passed into the callback method''s status parameter. Because the parameter
    is passed by value, your application is better if you access the parameter rather
    than querying IAsyncInfo''s Status property. This is because querying the property
    invokes a WinRT API via an RCW.


