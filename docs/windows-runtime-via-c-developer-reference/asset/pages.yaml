    \ of the DataPackage object (this is what target apps get)\npublic DataPackage\
    \ GetView();\n```\n\nAfter the share app constructs an instance of this class,\
    \ it sets DataPackageProperties describing the data (ApplicationName, Title, Description,\
    \ and so on). If the data is to be shared via the clipboard, the app can set the\
    \ DataPackageOperation. The next thing is to add content to the DataPackage object.\n\
    \nA DataPackage is supposed to characterize a single piece of content. However,\
    \ single piece of content can exist in many different data formats. For example,\
    \ HTML text would have a Rich Text (RTF) format, and would have a plain text format.\
    \ An image could have an image format and a text format that describes the image\
    \ or a URI indicating where the image came from.\n\nThe source app calls DataPackage.SetData\
    \ method once for each data format. Each call to adds a format (a String) and\
    \ the data (an Object) representing that format to a dictionary. WinRT defines\
    \ a static StandardDataFormats class with read-only String properties describing\
    \ the predefined standard formats:"
