  md: "```\npublic interface IStorageItemAccessList {\n  UInt32 ItemsAllowed { get;\
    \ } // Returns 100 or 25\n  void Clear(); // Erases all entries in the collection\n\
    \n  String AddToItem(IStorageItem item, string metadata); // Returns token (GUID)\n\
    \  void AddOrReplace(String token, IStorageItem file, String metadata);\n  void\
    \ Remove(String token);\n```\n\n```\nBoolean ContainsItem(String token);\nIAsyncOperation<IStorageItem>\
    \ GetItemAsync(String token);\nIAsyncOperation<IFolder> GetFolderAsync(String\
    \ token);\nIAsyncOperation<IStorageFile> GetFileAsync(String token);\n```\n\n\
    +   AccessListEntry Entries { get; } // Returns collection of token/metadata pairs\n\
    // Some members not shown here\n\nOne of the really cool features of these lists\
    \ is that they automatically track changes to the storage item. Specifically,\
    \ if the user uses another application (for example, File Explorer or cmd.exe)\
    \ to rename or move the item to another subdirectory on the same disk, you will\
    \ still be able to access it with its new name or location after extracting it\
    \ from a list.\n\n> When your app accesses files or folders with the picker or\
    \ one of the IStorageItemAccessList classes, WinRT forwards the storage APIs your\
    \ app calls to another process called a Broker (RuntimeBroker.exe). The broker\
    \ process is a very important part of the Windows security model because it ensures\
    \ that your app is allowed to access only the files and folders the user connects\
    \ to. Because WinRT APIs now have to make an additional cross-process call through\
    \ the broker instead of going directly to the file system, you be aware that performance\
    \ might suffer in order to provide users with the additional security of restricting\
    \ apps' access to the file system.\n\n# File-type associations\n\nWhen a user\
    \ double-clicks a file in File Explorer or opens a text file from within an email\
    \ application, typically Notepad starts up and opens the document. Because Windows\
    \ has associated Notepad.exe with the file extension .txt, you can associate file\
    \ extensions with your Windows Store app. Your app can define its own file extension,\
    \ or it can use an already-existing extension such as .txt. When a user opens\
    \ a file, Windows checks to see how many apps have registered for the file extension.\
    \ If multiple apps have registered for the file extension, Windows presents the\
    \ user with a list of these apps. The user can then decide which one to use and\
    \ indicate if this app should be the default in the future. (See the dialog box\
    \ shown in Figure 5-3)\n\nFor the curious, Windows assigns a unique ID to all\
    \ files on an NTFS volume and this is how it tracks changes. For more information\
    \ about this, check out the Win32 OpenFileById function and the FILE_ID_DESCRIPTOR\
    \ parameter on MSDN."
