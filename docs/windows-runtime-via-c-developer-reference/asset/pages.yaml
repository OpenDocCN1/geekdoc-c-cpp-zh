  md: '# Send the channel URI to your app''s web service


    Once your app has a channel URI, it needs to send it and its expiration time to
    your app''s web service. The web service is responsible for storing this information
    and any other information you might need to associate it with the user. The user
    uses this channel to periodically push notifications to the user''s PC. The web
    service should automatically purge any expired channel URIs; avoid pushing notifications
    to an expired URI via WNS.


    WNS does not give your app bandwidth to push notifications. WNS has a quota per
    that is not documented. WNS returns HTTP 404 (not found) or 410 ([channel expired])
    errors when channel URIs you send it no longer valid; your app''s web service
    should remove these from its database and no longer attempt to use them. Unless
    it makes sense for your scenario, the app''s web service should avoid renewing
    POSTs to WNS.


    To prevent from pushing notifications to your app, you must register your app
    with the WNS service. You configure your app to WNS using the Windows Store Dashboard
    of Microsoft''s Dev Center (http://dev.windows.com/).9 First, you need to register
    an app name in the Windows Store (as discussed in Chapter 11, "Windows Store").
    Then, from Visual Studio, associate your app with the reserved name using Project
    menu > Store > Associate App With The. The wizard creates Store-assigned package
    identity name and pop in your app''s manifest file. Alternatively, you can use
    the dashboard to show this information and you can edit the manifest XML file
    yourself.


    The Windows Store creates a Package Security ID (SID) and Client secret for your
    package. Your app''s web service must authenticate with these credentials. You
    get these values by going to your app in the Windows Store dashboard, clicking
    Services > Live Services > Authenticating Service. The values will look like these:


    Package Security Identifier (SID)

    ms-app://s-1-15-2-84216977-2665019123-2024476369-118581892-194604365-2052745452-3234447176


    Client secret

    6Tbb00HVmQVXbm7r/X+4QV9IbXY


    You need the next step to authenticate your app''s web service with WNS.


    # Pushing a notification from your app''s web service to the user''s PC


    To push a notification, your app''s web service will first have to authenticate
    with WNS, which will return an OAuth token. The following code demonstrates how
    to do this:


    ```

