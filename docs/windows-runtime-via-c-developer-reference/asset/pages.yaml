  md: "# CHAPTER 10\n\n# Sharing data between apps\n\nThe ability to share data is\
    \ extremely useful for users and greatly simplifies the effort required by software\
    \ developers. For end users, sharing allows a user to use one app to create some\
    \ content and then use other apps to edit or view the content. For software developers,\
    \ sharing allows developers to focus on what their app is best. An app can be\
    \ great at editing photos but not great at sharing photos with online accounts\
    \ like Facebook. Or the app might not be great at creating collages of adding\
    \ photos to a diary. Other apps might be good at these but not good at editing.\
    \ In addition, via sharing, users can decide for themselves which apps they want\
    \ to complete their task.\n\nIn this chapter, I will talk about how apps share\
    \ data with each other. First, I'll talk about how an app packages data so that\
    \ it can be shared with other apps. Then I'll show how to share data using the\
    \ clipboard and how to share data using the Windows Share charm.\n\nOne thing\
    \ to note is that sharing should always be investigated by the user and under\
    \ the user's control. An app should not try to automatically share some data with\
    \ another app because this might be a breach of security: the user might not want\
    \ one app to access the data produced by another app. When we speak of apps sharing\
    \ data, the app creating the data to share is called the source app and the app\
    \ receiving the shared data is called the target app.\n\n# Apps transfer data\
    \ via a DataPackage\n\nWinRT defines a Windows.ApplicationModel.DataTransfer.DataPackage\
    \ class. Source apps construct a DataPackage object and initialize it with the\
    \ data the app is willing to share with a target app. The DataPackage class looks\
    \ like this:\n\n```\npublic sealed class DataPackage {\n    public DataPackage();\
    \ // Constructs a new DataPackage\n\n    // Use to set properties (ApplicationName,\
    \ Title, Description, Thumbnail, etc.)\n    public DataProperties Properties {\
    \ get; set; }\n\n    // Optional: Use this to indicate why you're sharing the\
    \ package (None, Copy, Move, Link)\n    public DataPackageOperation RequestedOperation\
    \ { get; set; }\n\n    // Call SetData several times to add the same content in\
    \ different formats\n    public void SetData(String formatId, Object value);\n\
    ```"
