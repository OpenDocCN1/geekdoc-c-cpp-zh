    \ great news for both your user's battery as well as its network bandwidth.\n\n\
    In addition to titles, badges, and toast notifications, WNS can also send a raw\
    \ string to a background task (or to your app if it happens to be running). Your\
    \ app subscribes to these raw notifications, and because a raw string is an app-defined\
    \ string payload, your server can send whatever it wants. You'll learn more about\
    \ this in Chapter 9.\n\nYou can see the flow of events for WNS in Figure 8-10.\
    \ The architecture consists of three pieces: Windows and your app, WNS, and your\
    \ app's web service. At a high level, here are the workflow steps you need to\
    \ perform to push notifications from your app's web service to your user's PC:\n\
    \n+   1. Your app registers itself and the user's PC with WNS; WNS returns a unique-channel\
    \ URI.\n\n+   2. Your app sends this channel URI to your app's web service. Typically,\
    \ you save all user's channel URIs in a database of some store.\n\n+   3. When\
    \ your app's web service needs to notify of something, it looks up the user's\
    \ channel URI from the database and sends the desired tile, badge, toast, or raw\
    \ notification to WNS.\n\n+   4. WNS then pushes the notification down to your\
