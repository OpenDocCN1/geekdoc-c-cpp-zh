  md: '# Foreword


    O kidding! Take your seats, everyone, so we can get started. If you haven''t a
    clue what is being discussed, you need to put this book down. Go back to the book
    store and buy Jeff Richter''s CLR via C#, Fourth Edition (Microsoft Press, 2012).
    Really, you need it anyway. After you have read the Foreword, you may join us!


    If you''re on time, there is the CliffsNotes version: in Jeff''s previous two
    books, he vowed to write another one. Well, here we are all again. No empty promises.
    Jeff will probably write another book. After so many years of his lies about stopping,
    I can no longer support him. We are all here for the intervention. How much more
    can be said, right? I mean, aren''t literally thousands of pages of stuff written
    on this already because Maarten came up with the initial research and prose, Jeff
    was rewriting the book, so it doesn''t count. We all see through this guise. It
    is not our first order.


    Maybe you all can appreciate Jeff''s humble origins. He was never fully understood
    by his family. His parents didn''t believe there was a future in computers and
    hoped he would ''get over it'' and find a real career. When he quit his first
    job to write a book, they could not believe a living if you didn''t wear a tie
    every day. His mother never forgot the fact that he wore jeans to work. His grandmother
    held a book of in his hand and then decided that "windows" meant the manne-quins
    at Macy''s. Like he was an expert on shopping and merchandising at the mall. I
    am not kidding; it is true. Let me tell you Jeffrey is not an expert on, and that
    is malls and shopping. So maybe that is why he continually write, explaining over
    and over the importance of technology—this is just to justify his life to his
    family. It is the only explanation I can come up with.


    The amazing thing is this new book does have stuff about the Windows Store! His
    grandma would be so excited—finally, she can go for shopping in a store that has
    to do with Windows. Hopefully that this will provide the validation she need.


    I will warn you. Jeff is becoming a bit of an old timer. Oh, it''s true. While
    I was trying to understand this book (which of course I don''t), he couldn''t
    stop himself from harkening to the day. When programs were real programs. They
    did meaningful things, like run media software and financial software. Now we
    have applications and even that is too complex, we call them apps. They are available
    for $1.49, and they do things like pass gas or make a flashlight. There is nothing
    missing critical about this Jeff feels with all his skills, the best he can do
    is to create- an app that will outsell Pet Rescue. He then talked about how this
    book will make'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'programming so easy. Windows 8.1 is so clean and smooth. There is not the same
    level of intensity for programming for it.


    Although, between you and me, there is a little secret that should be shared.
    Under full NDA, just because we are friends. Jeff wrote a few of these apps for
    the Windows Store, and they were rejected. So maybe making a flashlight is not
    so easy?


    Really, this whole book thing is not even. I mean, now you can hear him with WintellectNOW''s
    on-demand video training. It is like a Lullaby—you can turn off Jeff''s videos
    anytime you need the comfort of another human''s voice. Reading is just a silly
    old-school skill that we used to need. Now we have the Internet and video feeds.
    So whenever you have issues with your code, inject Jeffrey into your office for
    a little lesson. If you happen to need a nap at the same time, well napping is
    one of the 7 habits of highly effective people.


    So, with Windows 8.1 released, a new paradigm is in place. Jeffrey is clearly
    in front of this situation. He has his fingers on the pulse(or at least the touch-sensitive
    screen) of this situation. Who knows, someday may even get me to update to this
    new version of Windows.


    I would like to close with some thoughts from some old (I mean, longtime) friends,
    his business partners and fellow Wintellectuals.


    John Robbins says:


    > Jeffrey and I go back. Back to the time when Steve Ballmer had hair and modern
    applications used this amazing technology called a “Windows message.” When Jeffrey
    started development with Windows, you were doing really well if you could get
    two programs running at the same time. After some detours through Windows XP and
    the like, you could run dozens of applications concurrently. Windows 8.1 brings
    us to the future of modern applications where you can run side by side.


    Prosise says:


    > One of our favorite Jeffrey-isms: “This code is so bad, I feel sorry for the
    compiler that has to compile it!


    > Jeffrey has an admitted inability to build user interfaces. Ergo Jeffrey-ism
    #2: “There is no UI problem that can''t be solved with a command prompt."'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'And in closing, Mark Russinovich, author of the cyber thriller Zero Day, says:


    I have known Jeff since 1997 when he heckled me during a talk I was giving. He
    had a point, though, so we''ve been friends ever since. Jeff has come a long way
    since I first started mentoring him and he continues to impress me with his ability
    to solve Portal 2 puzzles.


    I hope you all enjoy this book! I am patiently awaiting the return of my husband.

    Kristin Trace (Jeff''s wife)

    October 2013


    ![](img/f105584195b83b4404e3d2b11f5786c3_16_0.png)


    A typical father-and-son LEGO project.'
