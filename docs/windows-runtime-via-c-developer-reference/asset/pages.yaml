  md: "# HttpClient: Client-side HTTP(S) communication\n\nProbably the most common\
    \ form of network communication is client-side HTTP(S) communication. To accomplish\
    \ this with WinRT, you use the Windows.Web.HttpClient class, which looks like\
    \ this:^8\n\n```\npublic sealed class HttpClient : IDisposable, IStringable {\n\
    \    public HttpClient(); // Construct using HttpBaseProtocolFilter\n    public\
    \ HttpClient(HttpRequest filter); // Construct with a specific filter\n\n    //\
    \ Use this property to set request headers with each request.\n    public HttpRequestHeader\
    \ Collection DefaultHeaders { get; }\n\n    // This method sends a request. The\
    \ operation is considered complete\n    // after reading headers or the entire\
    \ response.\n    public IAsyncOperationWithProgress<HttpResponseMessage, IProgress<Uri>>\n\
    SendRequestAsync(HttpRequestMessage request);\n    public IAsyncOperationWithProgress<HttpResponseMessage,\
    \ IProgress<Uri>>\n        SendRequestAsync(HttpRequestMessage request, HttpCompletionOption\
    \ completionOption);\n\n    // These methods simplify calling SendRequestAsync\
    \ for common operations:\n    public IAsyncOperationWithProgress<HttpResponseMessage,\
    \ IProgress<Uri>>\nPostAsync(Uri uri, HttpContent content);\n    public IAsyncOperationWithProgress<HttpResponseMessage,\
    \ IProgress<Uri>>\n        PutAsync(Uri uri, HttpContent content);\n    public\
    \ IAsyncOperationWithProgress<HttpResponseMessage, IProgress<Uri>>\n        DeleteAsync(Uri\
    \ uri);\n    public IAsyncOperationWithProgress<HttpResponseMessage, IProgress<Uri>>\n\
    \        GetAsync(Uri uri);\n    public IAsyncOperationWithHttpResponse<string>\
    \ GetAsync(Uri uri, HttpCompletionOption completionOption);\n\n    // These methods\
    \ simplify calling GetAsync for common HTTP GET operations:\n    public IAsyncOperationWithProgress<string,\
    \ IProgress<Uri>>\n        GetStringAsync(Uri uri);\n    public IAsyncOperationWithProgress<byte[],\
    \ IProgress<Uri>>\n        GetBufferAsync(Uri uri);\n    public IAsyncOperationWithProgress<Stream,\
    \ IProgress<Uri>>\n        GetInputStreamAsync(Uri uri);\n\n    public string\
    \ ToString(); // Returns filter and default header information\n    public void\
    \ Dispose(); // Releases unmanaged resources associated with the HttpClient\n\
    }\n```\n\nOnce you've created an HttpClient object, you can easily download a\
    \ string like this:\n\n```\nusing (HttpClient client = new HttpClient()) {\n \
    \   String html = await client.GetStringAsync(new Uri(\"http://intellectNOW.com/\"\
    ));\n}\n```\n\nThis is very simple, but sometimes you need to have more control\
    \ over the communication. All of the sample Xxx methods are just wrappers around\
    \ HttpClient's more capable\n\n> WinRT's Windows.Web.HttpClient is the latest\
    \ and greatest class from Microsoft that allows developers to perform HTTP(S)\
    \ requests. You should use this class instead of the .NET Framework's System.Net.HttpClient\
    \ class."
