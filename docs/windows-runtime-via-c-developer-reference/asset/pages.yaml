    \n+   - Special-use capabilities (Documents Library, Enterprise Authentication,\
    \ and Shared User Certificates require an enterprise account. If your app uses\
    \ any of these capabilities, the Windows Store team looks very closely at your\
    \ app, ensuring that it uses these capabilities for legitimate reasons. In particular,\
    \ the Documents Library capability is frequently abused. This is why Visual Studio\
