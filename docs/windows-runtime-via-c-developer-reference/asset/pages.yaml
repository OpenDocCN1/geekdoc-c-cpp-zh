  md: '# CHAPTER 11


    # Windows Store


    here you are. You''ve developed your app, tested it on all your available systems
    and on the simulator for different screen sizes, and now you''re ready to reap
    the benefits of all those long days and nights. You want to submit your app to
    the Windows Store so that users can easily discover it and install it. Also, any
    updates you make to your app are automatically deployed to your users.¹ In addition,
    the Windows Store developer portal dashboard gives you a lot of information about
    your app and its users, such as download volume and reviews, but it also gives
    you crash data that you can use to quickly close the loop with your customers
    and give them fixes for your app.


    If you want to make money with your app, you have the option of using the Windows
    Store as a commerce engine. But Microsoft does not force apps deployed via the
    Windows Store to use its commerce engine; you are free to use other engines, such
    as PayPal. Microsoft''s commerce engine has a global reach of around 200 countries
    and over 100 languages and offers several commerce schemes, including trials,
    in-app purchases, and consumables. I''ll discuss the Windows Store commerce engine
    later in this chapter.


    Let''s start by taking a quick look at the Windows Store app itself. The main
    page presents you with a few different promotions: a primary spotlight with a
    handful of noteworthy apps, a section with apps that are recommended for you based
    on previous purchases and usage of apps, a section with popular apps, new releases,
    paid apps, and free apps. You can browse around in two dozen categories by selecting
    the navigation bar on top, and you can obviously search in the Store. You will
    even find some desktop apps, although you won''t be able to install them directly
    from the Store; vendors can provide a link to where you can download the desktop
    apps. And on your website, you can display a link to your app in the Windows Store
    (available for both Windows Store and desktop apps).


    When viewing an app, the user is shown the description, publisher, category, size,
    age rating, and a few screenshots. All of this information is provided when a
    developer submits an app to the Windows Store. The user is also shown the permissions
    the app needs to run on the system; this information is obtained from the app''s
    package manifest file. When a user installs your app, Windows debits the user''s
    payment method on file (if the app is not free and there''s no trial period) and
    installs the package as discussed in Chapter 2, "App packaging and deployment."
    This payment method can


    > ¹ Users can turn automatic updates off using the Windows Store app''s Settings
    > App Updates > Automatically Update Apps.


    > ² Your desktop app will have to pass Windows Certification in order to be listed
    in the Windows Store.'
