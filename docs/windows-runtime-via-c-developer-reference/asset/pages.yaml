    To make this page appear, you have to override your App''s OnShareTargetActivated
    method. When the user selects your share target for the Share pane, Windows activates
    your app via a hosted view and invokes the OnShareTargetActivated method, passing
    to a ShareTargetActivatedEventArgs object. This object has a ShareOperation property
    that returns a Share-Operation object:


    ```

    public sealed class ShareOperation {

    // 1. Target app gets DataPackageView to show user what''s being shared

    public DataPackageView Data { get; }


    // 2. Target app calls this when the user consents to sharing the data

    public void ReportStarted(); // Keeps source app running, adds share op to progress
    list


    // 3. Target app calls this to hide the hosted view, letting user go back to the
    source app

    public void DismissUI();


    // 4. Target app calls one of these after the share operation completes

    public void ReportCompleted(); // Removes share operation from progress list

    public void ReportError(String value); // Notifies user with toast; updates progress
    list


    // Methods for extended shares ("Implementing an extended (length) share operation")

    public void ReportDataRetrieved(); // Allows source app to be suspended/terminated

    public void ReportSubmittedBackgroundTask(); // Allows target app to be suspended


    // Methods for manipulating quick links ("Share target app can use quick links")

    public void ReportCompleted(QuickLink quicklink); // Call when share complete;
    adds quick link

    public String QuickLinkId { get; } // Contains the QuickLink''s Id

    public void RemoveThisQuickLink();

    }

    ```


