  md: '# CHAPTER 1


    # Windows Runtime primer


    The Microsoft Windows operating system (OS) offers many features, which application
    developers use to simplify building applications. This book explains many of these
    Windows features and offers guidance and best practices when using them. Windows
    exposes its features via an application programming interface (API), called the
    Windows Runtime (WinRT). WinRT APIs are callable using many programming languages,
    including JavaScript, C++, and .NET C# and Visual Basic. However, in this book,
    I chose to demonstrate consuming the WinRT APIs via the C# programming language
    due to C#''s widespread adoption and the productivity gains it provides over the
    other languages.


    The Windows OS supports many application models. Windows supports several client-side
    application models, including console user interface (CLI) applications and graphical
    user interface (GUI) applications. It also supports server-side application models
    for building services, such as Internet Information Service (IIS), SQL Server,
    and Exchange. Collectively, all these application models are referred to as desktop
    apps. Admittedly, the desktop API is not a great choice because some of these
    application models have no visible presence on the user''s desktop. As Windows
    8, Windows now supports a new client-side GUI application model referred to as
    Windows Store apps. This term is also not ideal because Windows Store apps are
    not to be installed by way of the Windows Store; they can be manually installed
    (side-loaded) via other means for development, or employee usage.


    Because the WinRT API is part of the OS, any app built using any of the application
    models can technically consume the API. However, due to time constraints, Microsoft
    was not able to test many of the WinRT APIs from desktop apps, some are not sanctioned
    for use-Windows apps. Furthermore, Windows Store apps run in a different security
    context than desktop apps. This security context is called an app container (discussed
    in the appendix), and it restricts which resources a Windows Store app can access.
    For these reasons, this book focuses heavily on using the WinRT APIs from Windows
    Store apps. However, some of the WinRT APIs described in this book are consumable
    from desktop apps as well. You should also note that there are some WinRT APIs
    that are callable only from desktop apps, not Windows Store apps. MSDN documentation
    for each WinRT type contains a Requirements section indicating whether the API
    is callable from desktop apps, Windows Store apps, or both.


    While reading the various chapters in this book, keep in mind the Microsoft Windows
    in mind designing the Windows Store app model. If you''re wondering why a certain
    feature works the way it does or why a certain feature is missing, most likely
    it is because it didn''t fit in the'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'principles. As you implement Windows Store apps yourself, you''ll need to consider
    these principles:

    Here are the principles:


    +   Secure Windows Store apps cannot access the user''s data without the user''s
    permission. This gives the user confidence that an app cannot delete, modify,
    or upload the user''s data to an unknown Internet location. It also means that
    an app cannot acquire the user''s location or record audio or video without the
    user''s consent.


    +   Power efficient For the most part, Windows Store apps can execute code only
    when the user is interacting with the app. The OS suspends all threads when the
    app is in the background. This forbids an app from using system resources (like
    the CPU, network, and storage) that consume battery power while the app is in
    the background. Blocking the use of system resources also helps the foreground
    app remain fast and fluid. WinRT does some facilities that allow an app to look
    like it is running while it''s in the background. Various chapters of this book
    explore these facilities.


    +   The user is always in control Windows Store apps cannot overwrite a user''s
    desires. For example, the user must grant permission for an app to add to the
    Start screen or to show a toast notification. The user decides if an app can sync
    between the user''s PCs. The user decides which files or folders an app access.
    The user decides whether an app can use the network when roaming or by doing so
    exceeds the user''s monthly data limit. Apps cannot decide these things on behalf
    of the user. The OS itself actively enforces many of these limitations. However,
    some of them (such as using the network when roaming or going over the user''s
    data limit) are enforced by Windows Store policy. That is, your app will be certified
    and placed on the Windows Store if it violates this principle.


    +   Isolation Windows Store apps are forbidden from accessing the OS or other
    apps the user has installed. For example, Windows Store apps cannot access data
    created and maintained by other apps (unless the user grants access via a file
    picker). Furthermore, apps cannot communicate with other installed apps; allprocess
    communication is prohibited. However, Windows Store apps can communicate with
    other apps via well-defined mechanisms.


    +   Confident install, upgrade, and uninstall Users can easily discover and install
    Windows Store apps via the Store app included with Windows. With Windows Store
    apps, users are confident the app adheres to all these principles. Installed apps
    remain up to date with the latest bug fixes and features. In addition, users can
    easily install apps via the Start screen. When uninstalling an app, users are
    assured the app is fully installed (no leftover directories, files, or registry
    settings). Moreover, due to app isolation, installing an app cannot negatively
    affect the OS or other installed apps. Furthermore, unlike desktop apps, which
    can be installed only by an administrator, Windows Store apps are installable
    by a standard user.


    +   Simplified app management Historically, desktop apps have many usability problems.
    These are largely because a user can run multiple instances of an app, each with
    its own window. For example, when a user is tapping on an app''s icon, the system
    should launch a new instance of the app or bring the already running instance
    to the foreground? And, if the app has multiple instances, which instance should
    come to the foreground? Exacerbating the problem, users sometimes forget that
    an app is running if its window is obscured by another


    PART 1 Core concepts'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'app''s window. On the other hand, Windows Store apps are always single instance,
    so selecting the app launches if it''s not running or brings it to the foreground
    if it is.


    Another problem with desktop apps is that the user must decide which app to terminate
    if the system is running low on memory. The user doesn''t know which is consuming
    the most of memory. To fix this, users never have to close a Windows Store app.
    The system can terminate the app automatically if memory is running, and the system
    can automatically relaunch the app if the user switches back to it. Also, the
    system automatically terminates an app if the user upgrades the app to a new version
    or uninstalls it. To help make this experience seamless for the user, you (the
    app developer) must do some additional work in your code. (See Chapter 3, "process
    model.\'')


    +   - Fast and fluid Windows Store apps always respond to input so that the user
    feels in control of the app and with a pleasant experience with it.


    +   - Content over chrome Windows Store apps tend to have a touch-optimized user
    interface that emphasizes its content over chrome (menus, tooling, frames, and
    so on). This affords the user an immersive experience with the app and its data.


    +   - Device flexibility Windows and apps built for it to enjoy a wide variety
    of hardware devices. This allows users to purchase PCs right for them. Windows
    supports three CPU architectures (ARM, x86, and x64) as PCs with varying amounts
    of RAM, storage, and display resolution. Windows PCs also support a large set
    of peripherals, including local area network (LAN), wide area network (WAN), and
    mobile network adapters, cameras, scanners, printers, game controllers, and so
    on.


    > Any app that violate one or more of these principles should not use the Windows
    Store application model. For example, apps that need to affect the OS and other
    apps—such as debuggers and other system tools and utilities—must be implemented
    as desktop apps.


    > When Windows is running on a PC with an ARM CPU, we call that PC Windows RT
    PC. On a Windows RT PC, users can install only Windows Store or desktop apps signed
    by Microsoft''s division (like Task Manager, Microsoft Office apps, or Studio''s
    Remote Debugging tools!). Developers frequently ask why they cannot install their
    own desktop apps on a Windows RT PC. The reason for this is because the principles
    listed. Because desktop apps do not adhere to the principles, a desktop app could
    compromise the PC, thereby causing concern, weakening security, hurting responsiveness,
    and wasting battery power. By preventing the installation of arbitrary desktop
    apps on a Windows RT PC, Microsoft is assuring users that their Windows RT PC
    will be an excellent user experience over the lifetime of the PC.


    For more information about remote debugging, see http://msdn.microsoft.com/en-us/library/visualstudio/7/zsqaa.aspx.


    CHAPTER 1 Windows runtime'
