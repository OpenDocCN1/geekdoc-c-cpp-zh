    # Performing file and folder queries


    This chapter has discussed how to work with folders, files, properties, thumbnail
    images, and libraries. In this section, I will show how to quickly search for
    items within a folder using a query that can filter on multiple properties, such
    as date, size, rating, or even user-defined strings. You can also specify how
    you want the query results sorted. Additionally, you can receive notifications
    when storage items are added or removed.


    The following code demonstrates how to perform a query over the user''s Pictures
    library. The query returns a set of virtual folders, with each folder representing
    a year.^10 Then, with each folder, pictures that you are returned. Let me make
    something perfectly clear: this works regardless of how the user organizes his
    pictures in Pictures library. That is, all the pictures could be at the root of
    the user''s Pictures library, or could be in subdirectories organized by person
    or location. None of these matters; the following code returns the pictures by
    year:


    ```

    // CreateQueryOptions to filter/sort results; this example groups the results
    by year

    QueryOptions qo = new QueryOptions(CommonFolderQuery.GroupByYear)

    { FolderDepth = FolderDepth.Deep };

    ```


    ^10 You can easily tell that the folders do not physically exist by looking at
    each StorageFolder.Path property. For virtual folders, the property will show
    the empty string ("") because there is no actual path to a disk location that
    can be shown.'
