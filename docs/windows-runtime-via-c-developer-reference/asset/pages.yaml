    # Push notification triggers


    PushNotificationTrigger is for real-time communication (RTC) apps, such as mail,
    instant messaging, and Voice over IP (VoIP). Apps using this trigger can execute
    code when the PC is running on battery power or if the PC is in a low-power, connected-standby
    state. When a network message comes in, the PC wakes up and executes the background
    task. For this trigger, users must add the app to their lock screen. (See the
    “Lock-screen apps section”) When the trigger fires, the task''s code can show
    a toast notification on the user''s lock screen. If the user unlocks the PC, Windows
    activates the app that registered the background task, bringing it to the foreground.


    In Chapter 8, I discussed the Windows Push Notification Service (WNS). In that
    chapter, I showed how an app registers a channel URI and sends it to your app''s
    web service.⁴ Then, your service can push an XML template to render a tile, or
    toast notification to the user''s PC. In that chapter, I also mentioned that there
    is a fourth kind of notification referred to as a raw notification. The payload
