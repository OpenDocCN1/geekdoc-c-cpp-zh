    \ based on what is shown to the user. For example, when sharing from Internet\
    \ Explorer, the URI for the currently viewed webpage is shared unless the user\
    \ has explicitly selected some content on the page. In this case, the text is\
    \ shared.\n\nTo receive notification when the user selects the Share charm, a\
    \ share source app must use WinRT's DataManager class:\n\n```\npublic sealed class\
    \ DataTransferManager {\n    // DataTransferManager associated with an app's main\
    \ or auxiliary (not hosted) view\n    public static DataTransferManager GetCurrentView();\n\
    \n    // Raised when the user selects the Share charm when the view is activated\n\
    \    public event EventHandler<DataTransferManager, DataRequestedEventArgs> DataRequested;\n\
    \n    // Raised when the user chooses a target (rarely used) so source knows the\
    \ target app name\n    public event TypedEventHandler<DataTransferManager, TargetApplicationChosenEventArgs>\
    \ TargetApplicationChosen;\n\n    // Call this to programmatically activate the\
    \ Share charm\n    public static void ShowShareUI();\n}\n```\n\nThe first, the\
    \ app must get a reference to the DataTransferManager associated with its main\
    \ view or one of the app's auxiliary views via the GetCurrentView() static method.\
    \ Hosted views cannot use a DataTransferManager object. Then the app must register\
    \ a callback method with the DataTransferManager's DataRequested event:\n\n```\n\
    DataTransferManager dtm = DataTransferManager.GetCurrentView();\ndtm.DataRequested\
    \ += OnDataRequested;\n```\n\n> 2 By the way, you can create a screenshot of an\
    \ app using a tablet-by holding the Windows volume-down button. This puts a screenshot\
    \ in the Pictures library's Screenshots folder. On the keyboard, Windows+Print\
    \ Screen does the same thing.\n3 An app can prevent itself from being captured\
    \ by a screen by setting its ApplicationView's IsScreenEnabled property to False.\
    \ Apps typically use this to protect confidential information (like credit card\
    \ or financial information) from being captured.\n\nCHAPTER 10 Sharing data between\
    \ apps 237"
