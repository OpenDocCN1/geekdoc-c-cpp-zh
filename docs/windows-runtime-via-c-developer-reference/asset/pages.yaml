  md: "# Transferring byte buffers\n\nNow that you have the basic concepts around\
    \ working with streams, let's take a closer look at the specifics. The IInputStream\
    \ and IOutputStream interfaces are shown here:\n\n```\npublic interface IInputStream\
    \ : IDisposable {\n    IASyncOperationWithProgress<IBuffer, UInt32> ReadAsync(\n\
    \        IBuffer buffer, UInt32 count, InputStreamOptions options);\n}\n```\n\n\
    ```\npublic interface IOutputStream : IDisposable {\n    IAsyncOperation<UInt32>\
    \ WriteAsync(IBuffer buffer);\n    IAsyncOperation<Boolean> FlushAsync();\n}\n\
    ```\n\nAs you can see, the ReadAsync and WriteAsync methods both operate on IBuffer\
    \ objects. So, what is an IBuffer? Well, an IBuffer object represents a byte array\
    \ and the interface looks like this:\n\n```\npublic interface IBuffer {\n    UInt32\
    \ Capacity { get; } // Maximum size of the buffer (in bytes)\n    UInt32 Length\
    \ { get; set; } // Number of bytes currently in use by the buffer\n}\n```\n\n\
    As you can see, the IBuffer interface has length and capacity properties. Odd\
    \ enough, this interface offers no way to access the buffers. The reason for this\
    \ is that WinRT types cannot express pointers in their metadata because pointers\
    \ do not map to some languages (like JavaScript or C# code). The interface could\
    \ offer a method to access individual bytes in the buffer, but calling a method\
    \ to get each byte would hurt performance too much. Therefore, an IBuffer object\
    \ lets you pass buffers around, but you cannot access its contents.\n\nHowever,\
    \ it is not lost because all WinRT IBuffer objects implement an internal COM interface\
    \ known as IBufferAccess. Note that this interface is a COM interface (because\
    \ it returns a pointer) and it is not a WinRT interface. The CLR defines an internal\
    \ (not public) Runtime Callable Wrapper (RCW) for this COM interface that looks\
    \ like this:"
  merge: -1
