  md: '# App containers


    Users may be confident that Windows Store apps cannot just access any of the user''s
    data or PC resources. Windows restricts what apps can do on a PC. This appendix
    explores Windows'' security model and how it is enforced.


    Windows defines security groups, such as Administrators and Users, and each group
    has different privileges. When a user is assigned to a group, individual inherits
    the group''s rights and privileges. For example, if a user belongs to the Administrators
    group, the user can install desktop apps, change the system time, modify the content
    of the %System32% directory, and so on. If the user is only a member of the Users
    group (a standard user), the user cannot perform any of these operations. A standard
    user, however, can still start most apps, read files from all over the system,
    and access registry locations.


    When a user logs in a PC with their credentials, Windows starts a logon session
    for user and produces an access token. This access token contains the identity
    and privileges of the user''s account. Now, when the user launches an app, that
    app gets a copy of the user''s access token so that Windows knows what the app
    can do on behalf of the user. Thus, if a user is a member of the Users group,
    an app running as that user has a standard user hash. Prior to Windows Vista,
    it also meant that if a user was a member of the Administrators group, all applications
    could write to the registry or app''s files, with administrative privileges. Here,
    any application able to install other apps, write to the registry or app''s files,
    sends those files over the Internet, and so forth. From a security perspective,
    this was far from ideal, and Microsoft introduced User Account Control (UAC) starting
    with Windows Vista. With UAC, apps launched by a member of the Administrators
    group with a standard user token. For more, you can read http://msdn.microsoft.com/en-us/library/windows/desktop/bb648869.aspx
    and also Windows via C/C++. (Fifth Edition, 2011).


    For Windows Store apps, UAC still does not provide user confidence with the OS,
    Windows Store apps must not be able to look into the user''s files without the
    explicit permission of the user. Additionally, to fulfill the promise of clean
    install and uninstall of Windows Store apps, apps should not be able to clutter
    the machine''s registry or file system. For these reasons, Windows needs to restrict
    apps from doing things that a standard user can do. Therefore, Windows Store apps
    run in a restrictive security sandbox called app container.


    To enforce this sandbox, Windows Store apps uses another security feature introduced
    in Windows Vista: mandatory integrity control. On a high level, it has focus.
    Every process gets a mandatory label associated with its access token. For apps
    or user processes, a label can have three levels: low, medium, and high. By default,
    a process launched by a standard user gets a medium level and'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'process launched by an administrator gets a high level. On the other hand,
    every resource—such as a folder, or registry key—has a level well, with medium
    the default level. When an app wants to access a resource, Windows checks the
    integrity level of the app''s process and the integrity level of the resource.
    In general, a process does not write access to a resource with a level higher
    than its. When you look at the properties of a Windows Store app with a tool like
    Explorer (which is shown in Figure A-1), you see that the process has a low integrity
    level (Mandatory Label;Low Mandatory Level). Thus, Windows Store apps will not
    be able to write anywhere on the system, except for their dedicated location on
    disk. In Chapter 4, "Package data and roaming," and Chapter 5, "Storage files
    and folders," you find that every Windows Store app gets a location on disk that
    it can use to store data and settings.


    The low integrity level prevents apps from cluttering the system, but it does
    nothing to prevent one app from accessing another app''s resources (which also
    has a low integrity level). To keep accessing each other''s data, Windows assigns
    every app its Application Security ID (SID).An app will have permission to access
    a resource unless Windows explicitly allows an permission by adding the app''s
    Application SID to the resource. You can see this Application SID in Figure A-1;
    it is the entry with AppContainer in the flags column.You can find this SID back
    in File Explorer if you navigate to this app''s subdirectory in %LocalData%\Packages\
    When you bring up the Folder properties—example, the LocalState folder—you''ll
    see that the SID has full access to this resource.


    Now we know Windows restricts apps from accessing most of the system. However,
    apps might still need to do things like access files outside of the sandbox, such
    as the Pictures. Because the integrity level and app container restrict the app
    from accessing these files directly, Windows uses broker processes (for example,
    RuntimeBroker.exe) to access the files on behalf of the Windows Store app. This
    broker process runs outside of the container with a medium integrity level. As
    a developer, you indicate what your app needs by checking capabilities in the
    app''s manifest file. When Windows creates the process for a Windows Store app,
    it looks at the manifest file and adds a Matching SID to the process'' access
    token for each capability specified. When the app tries to access a resource,
    such as a picture in the Pictures library, Windows looks at the process'' access
    token to find the Capability SID, and it creates the broker process that subsequently
    accesses the required file on the app''s behalf. Because of this level of indirection,
    there is a slight performance penalty for accessing user files.


    +   1 This is, of course, a simplification. Mandatory integrity control provides
    for execute, and write.

    2 An Application SID is derived from the package''s family name using an algorithm
    with no random factors. That is, an app''s Application SID is always the same
    value, even when an app is installed on different PCs.

    3 App containers are mostly used by Windows Store apps. If you run Explorer in
    enhanced protected mode, it will also use app containers for its tasks.

    4 In Chapter 9, "Background tasks," I discuss how Windows Store apps can have
    background code running in their own process (BackgroundTaskHost.exe). Windows
    assigns the same Application SID as the Windows app itself. This means that the
    background task is running in the same app container and can therefore share data
    with its Windows Store app.


    272 APPENDIX App containers'
