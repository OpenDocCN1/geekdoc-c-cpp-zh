    # Debugging share target apps


    Debugging share target apps can be quite challenging. Sure you can put a breakpoint
    in the activation code, but when the debugger hits the breakpoint, Windows'' light
    dismiss behavior immediately cancels the share operation. The easiest way to debug
    a share target app is to run it in the simulator or on a remote PC. In addition,
    you''ll have to launch the app normally first, enabling you to put breakpoints
    in the share-target activation code. Or you can open the project''s properties
    and select the Project Properties > Debug > Do Not Launch, But Debug My Code When
    It Starts option.'
