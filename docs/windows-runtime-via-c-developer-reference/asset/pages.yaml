  md: '# Purchasing durable in-app product licenses


    An app can sell durable in-products from within the app itself. These products
    typically unlock app features for some period of time. For example, your app could
    sell a durable in-app product that grants the user a special weapon he can use
    in a game or enables to turn off advertising for three days.


    To sell a durable in-app product, the developer must first enter these products
    into the Dashboard under Services (See Figure 11-6). You assign each in-app product
    a Product ID, a Price Tier, a Product Lifetime (Forever or between 1 day and 365
    days), and a Content Type. Users won''t see the Product ID; it is a string that
    you use to identify it. The pricing scheme for the in-app products is identical
    to the tiered scheme for free. For each product you add, you''ll also have to
    add a description for it via the Dashboard''s Description page.


    | Product ID | Price tier | Product Lifetime | Content type |

    |---|---|---||

    | DurableProduct | 4.49 USD | Forever | Inher from app |

    | DurableExpiringProduct | 1.49 USD | 3 days | Electronic software download |


    **Figure 11-6** Using the Dashboard to add a durable in-app product to your purpose.


    The Content Type is field for tax purposes. You can choose from Inher From App,
    Electronic Software Download, Software As a Service, Music Streaming, Music Download,
    Video Streaming, Video Download, Online Data Storage/Services, Electronic Books,
    Electronic Magazine Single Issue, and Electronic Newspaper Single Issue. Most
    of these values are self-explanatory. The default value is Inher From App, which
    means the in-app product fall in the same tax category as the app. At the time
    of this writing, the tax category of all apps is Electronic Software Download,
    hence there is no difference between leaving the value as Inher From App or Electronic
    Software Download. This should be the desired category for the overwhelming majority
    of in-app purchases. The types that refer to - and online-based services are very
    specific categories that are taxed differently. If your app uses these in-app
    products, we recommend you consult with a tax advisor.


    To test in-app products, you must add them to the XML and then have CurrentAppSimulator.ReloadAsync
    load the XML file. The XML file shown earlier describes two durable in-app products
    in its Listing section. The "DurableProduct" product never expires (has no LicenseAttribute),
    but the "DurableExpiringProduct" product expires every three days.


    In reality, these two products work the same way: after a user purchases other,
    the license is granted with an expiration. For a nonexpiring product, the expiration
    date is 12/30/9999 (effectively nonexpiring), and for an expiring product, the
    expiration date is the purchase date plus the number of days identified by the
    LicenseAttribute. In your code, you can treat durable in-app products and durable
    expiring in-app products the same.


    Here is how an app determines if the user has a valid license for a durable in-app
    product:'
