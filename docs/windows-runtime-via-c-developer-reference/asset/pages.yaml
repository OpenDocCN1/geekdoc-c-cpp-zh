  md: '![](img/f105584195b83b4404e3d2b11f5786c3_144_0.png)


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_1.png)


    Projected to .NET as\IDisposable/Dispose


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_2.png)


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_3.png)


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_4.png)


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_5.png)


    ![](img/f105584195b83b4404e3d2b11f5786c3_144_6.png)


    **Figure 6-1** WinRT''s object model.


    > **Important** One thing to take note of is that all WinRT APIs that perform
    I/O operations are implemented asynchronously. Because the name for ICloseable''s
    method is Close and not CloseAsync, the Close method cannot perform any I/O operations.
    This is semantically different from how Dispose works in the Microsoft .NET Framework.
    .NET Framework-implemented types, calling Dispose can do I/O and, in fact, frequently
    caused data to be flushed before actually closing a device. When C# code calls
    Dispose on a WinRT type, however, I/O (flushing) will not be performed and a loss
    of data is possible. You must be aware of this and, in some cases, you might have
    to flush data in your code explicitly. I will explicitly point out this in this
    chapter when it is necessary to do this.


    InputStream and IOutputStream are the basic interfaces that read buffers (byte
    arrays) and write to a stream. InputStream''s ReadAsync method reads bytes from
    a stream into a buffer and IOutputStream''s WriteAsync method writes bytes from
    a buffer to a stream.


    OutputStream has an additional method: FlushAsync. Most apps will never call this
    method. Let me explain its purpose. When writing to a stream, Windows internally
    buffers (caches) the data in memory and writes to the stream when the memory buffer
    fills or if the buffer idles for a while. Windows does this to improve performance
    for apps that frequently use small write operations accessing the hardware (which
    is slower than RAM) incurs a performance hit. Because of this, an app could "write
    data to a stream" and if the power fails on the machine the data is flushed to
    the stream, the data would be lost.'
  merge: -1
