  md: '# TABLE 8-3 prefixes for tile images.


    | URL prefix | Description | Notes |

    |---|---|--|

    | ms-app:/// | Use this to refer to an image file shipped in your app''s package.
    | The three slashes after the colon are required. See Chapter 5 for more details.
    |

    | ms-appdata://local/ | Use this to refer to an image file existing in your app''s
    local storage folder. Note cannot refer to images under your app''s temporary
    or roaming folders. | |

    | http:// or https:// | Use this to refer to an image that should be downloaded
    from a web server. | The system can automatically concatenate a query string to
    the URL indicating the required image scale (80, 100, 140, 180), and language
    based on the user''s current environment. | |


    Important The system supports JPEG, PNG, GIF image formats only. In addition,
    images must not exceed 200 KB, and neither the height nor the width can be more
    than 1024 pixels. If you violate any of these rules, the system discards your
    XML and does not update your app''s tile. This can be quite frustrating, because
    the APIs do not provide any indication of failure. However, the system will write
    an error entry to the event log at Applications And Services Logs > Microsoft
    > Windows > Apps > Microsoft-Windows-TwinUI-Operational.


    # Placing a badge on a tile


    Placing a badge on a tile is similar to how you update a tile''s contents. Instead
    of using TileUpdateManager, you use BadgeUpdateManager to retrieve one of the
    two BadgeTemplateTypes: BadgeNumber or BadgeGph. When you modify the XmlDocument,
    use the document to create a BadgeNotification, and hand the notification to the
    badge:


    ```

