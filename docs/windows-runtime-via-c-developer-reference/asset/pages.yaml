  md: 'For example, the following code creates a query that returns files in the rock
    genre that are older than November 5, 2004 and whose album title contains the
    "Sky":


    ```

    QueryOptions qo = new QueryOptions(CommonQuery.GroupByPublishedYear) {

    FolderDepth = FolderDepth.Deep,

    ApplicationSearchFilter = "date:11/05/04 AND genre:rock AND System.Music.AlbumTitle:--Sky"

    };

    ```


    StorageFolderQueryResult folders = KnownFolders.MusicLibrary.CreateQueryWithOptions(qo);

    By the way, your app doesn''t have all of query''s results. The StorageFolderQuery-Result
    class offers an overload of the FileQueryAsync method that takes a starting index
    and a max number of items. Similarly, the StorageFileQueryResult class offers
    an overload of the GetFilesAsync method that takes a starting index and a max
    number of items.


    Here is another example that creates a query resulting in a flat set of pictures
    ordered by date:


    ```

    QueryOptions qo = new QueryOptions(CommonQuery.OrderBy, new[] { "*" });


    StorageFileQueryResult folders = KnownFolders.PicturesLibrary.CreateQueryWithOptions(qo);

    files.Changed += OnOptionsChanged;

    files.ContentsChanged += OnOptionsChanged;

    ```


    This creates a ordered list of all files using a wild card (*). In addition, the
    OptionsChanged event handler will invoke our OnOptionsChanged method whenever
    one of the QueryObject''s properties gets changed. Also, the ContentsChanged event
    handler will invoke if any storage items change affect the results of our query.
    An app can dynamically update its user interface in response to this event.


    It is common to process the resulting files and, getting thumbnail images and
    properties for each storage item, iterating over all the items to get this data
    would be quite time-consuming, and it is also unlikely that all the information
    could fit on the user''s screen anyway. To acquire thumbnail images more efficiently,
    QueryOptions'' SetThumbnailPrefetch method causes the system to start loading
    thumbnail images immediately; this approach uses more resources but makes retrieval
    on query results much faster. The QueryOptions class also offers a SetPropertyPrefetch
    method to get storage item properties


    The following code demonstrates using these methods to improve the performance
    of fetching properties and thumbnail images:


    ```

    // Create QueryOptions to filter/sort results

    QueryOptions qo = new QueryOptions(CommonQuery.OrderBy, new[] { "*" });


    // Improve performance of fetching properties and/or thumbnails

    String[] propertiesToRetrieve = new String[] { "Size" };

    qo.SetPropertyPrefetch(PropertyPrefetchOptions.ImageProperties, propertiesToRetrieve);

    qo.SetThumbnailPrefetch(ThumbnailMode.Pictures, 190, ThumbnailOptions.None);


    // From virtual call Create[File|Folder|Item]QueryWithOptions

    StorageFileQueryResult folders = KnownFolders.PicturesLibrary.CreateQueryWithOptions(qo);

    ```'
