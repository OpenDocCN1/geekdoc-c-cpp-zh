  md: '# CHAPTER 9


    # Background tasks


    n Chapter 3, "Process model," I explained how Windows Store apps have their threads
    suspended when not in the foreground. This prevents background apps from consuming
    battery power. In addition, it prevents the app when your app is not interacting
    with affecting the responsiveness of the foreground app. Windows provides Windows
    Store apps that have tremendously powerful features to stay current and provide
    the latest relevant information to users. We saw some good examples in Chapter
    8, "Tiles and toast notifications," when we examined how the system can update
    your tile or show a toast notification even when, "Net-working." I showed how
    your app could transfer large files when not in the background.


    However, some apps need to execute code when suspended in the background or even
    terminated. Take, for example, an instant messaging (IM) app or a Voice-over-IP
    (VoIP) app. Users need to receive notifications when they are contacted by friends
    and family. And these notifications still need to come in when users play a game,
    browse the Internet, watch a movie, or even when the PC is locked or standby.
    These apps clearly have advanced requirements when they are suspended or even
    terminated. In this chapter, I will show how Windows Store apps can execute code
    when not in the foreground by using background tasks. Background tasks are the
    only mechanism Windows offers that enables your code to run when your app is not
    in the foreground.


    > Important When possible, avoid background tasks; use tile and toast notifications
    or background grounds tasks instead. Background tasks complicate your app and
    negatively impact system responsiveness and power consumption. For this reason,
    background tasks cannot run continuously; they must execute code having short
    duration. Finally, the user must approve certain background task features, so
    they complicate the usability of your app too.


    # Background task architecture


    Before diving into all the details, let''s explore the Windows background task
    architecture. If your app needs to have some code execute periodically, you must
    perform the following steps:


    +   Implement the code you executed as a background task.


    +   Decide what triggers your background task code (for example, timer, user logs
    in, network connectivity change).'
