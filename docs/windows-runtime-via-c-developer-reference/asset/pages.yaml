  md: 'To comply with the principles, Windows Store apps are created and deployed
    as self-contained packages (ZIP files), as discussed in Chapter 2, "App packaging
    and deployment.\ Everything an app needs to be in this package. Because the package
    is a completely self-contained deployment unit, it includes all necessary dependencies.
    When a user installs an app, Windows automatically deploys its dependencies in
    the same directory. Hence, another app that needs the same component or dependency
    gets its own copy in its own directory.


    Package files contain an XML manifest file describing how the app integrates into
    the system. The file specifies what capabilities (system resources)—such as storage
    locations, network access, location, webcam, and so on—the app desires. Before
    installing the app, the user sees what capabilities the app desires and the user
    decides to install the app or not. The app also declares in the manifest file
    which ways the system can activate the app. For example, an app that declares
    it can be activated to run code in the background, perform certain file types
    or protocols, or accept shared data. Chapter 3 explains how an app supports these
    various activations.


    When installing an app''s package, the system parses the XML file and integrates
    the app into the system. When uninstalling the app, the system parses the XML
    file again and undoes the integration. By taking full control of install and uninstall,
    Windows ensures that uninstall leaves no files, directories, or registry keys
    behind and ensures that no part of the system or another app depends on a component
    or setting that has been removed.


    Microsoft''s vision is that Windows Runtime offers one programming model, allowing
    developers to write apps for any Windows device, including phones, tablets, notebook
    PCs, desktop PCs, server PCs, Xbox, and even large devices like MicrosoftSense.
    Unifying the programming model for all these devices takes time, and Microsoft
    admits that it has a long way to go. This book does not focus on Windows Phone
    or Xbox directly, it is my hope that the book will help you if you decide to target
    any of these other devices.


    # Store app technology stacks


    1-1 shows the three technology stacks you can use to create a Windows Store app.
    The bottom of the figure shows a large rectangle titled "Windows." This indicates
    the various features that Windows exposes to developers. On the right, the "Win32
    and COM" represents APIs that have shipped with Windows for many versions; these
    technologies continue to ship in order to support desktop apps. The Win32 and
    COM APIs are old and complicated. Furthermore, they were designed to be used by
    native C/C++ developers. The WinRT box on the left represents the new WinRT APIs.
    WinRT is a modern, simple, and object-oriented API designed for use by many programming
    languages. By the way, the boxes are not shown to scale: there are far more Win32
    and COM APIs than there are WinRT APIs.


    Technically speaking, all the Win32, COM, and WinRT APIs are callable from both
    desktop apps as well as Windows Store apps. However, the WinRT APIs are simpler
    and easier to use, so you should use them whenever possible. Although a Windows
    Store app can call any Win32 or COM API,'
