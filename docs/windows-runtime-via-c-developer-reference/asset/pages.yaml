    CreateStreamedFileAsync creates a temporary and read-only StorageFile object.
    Conceptually, this StorageFile is in memory and querying its Path returns an empty
    string. However, the StorageFile is implicitly created by a file that Windows
    creates. The data written to the stream by the OnDataObject method is persisted
    in this file. This way, if the receiving app opens the StorageFile again (or passes
    it to another app), the callback method is not invoked again; the data is simply
    returned from the Windows created. If a StorageFile object is passed to a desktop
    app, the system creates a read-only copy of the file in the user''s Temporary
    Files directory (similar to what Outlook does when the user opens an email attachment).


