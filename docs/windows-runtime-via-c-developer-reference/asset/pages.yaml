  md: "The last thing I want to say about filters is that you can chain them. Through\
    \ IHttpClient interface with SendRequestAsync, you can create your own classes\
    \ and then you create instances of your class and pass them to HttpClient's constructor.\
    \ Your filter class should accept another filter object in order to maintain the\
    \ chain of filters. Here is an example of a filter that calculates how much time\
    \ it takes for the server to respond to each request:\n\n```\ninternal sealed\
    \ class RequestDurationFilter : IHttpClient{\n    private readonly IHttpClientFilter\
    \ _m_nextFilter;\n\n    public RequestDurationFilter(IHttpClient nextFilter) {\n\
    \        if (nextFilter == null) throw new ArgumentNullException(\"nextFilter\"\
    );\n        _m_nextFilter = nextFilter;\n    }\n\n    public void Dispose() {\
    \ _m_nextFilter.Dispose(); }\n\n    public TimeSpan RequestDuration { get; private\
    \ set; }\n\n    public async Task<HttpResponseMessage> SendRequestAsync(HttpRequestMessage\
    \ request, CancellationToken cancellationToken = default) {\n        Stopwatch\
    \ time = Stopwatch.StartNew();\n        HttpResponseMessage response = await _m_nextFilter.SendRequestAsync(request).AsTask(cancellationToken);\n\
    \        RequestDuration = time.Elapsed;\n        if (cancellationToken.IsCancellationRequested)\
    \ throw new OperationCanceledException();\n        return response;\n    }\n}\n\
    ```\n\nUsing this filter is extremely simple:\n\n```\nusing (RequestDurationFilter\
    \ filter = new RequestDurationFilter(new HttpBaseProtocolFilter(new HttpClient()))\
    \ {\n    using (HttpClient client = new HttpClient()) {\n        HttpRequestMessage\
    \ request = new HttpRequestMessage(HttpMethod.Get,\n            new Uri(\"http://www.IntellectNOW.com/\"\
    ));\n        HttpResponseMessage response = await client.SendRequestAsync(request);\n\
    \        string s = String.Format(\"Request took {0}ms\", filter.RequestDuration.TotalMilliseconds);\n\
    \    }\n}\n```\n\nCustom filters open up all kinds of possibilities. You could\
    \ create a filter that\n\n+   - Automatically retries sending a request when a\
    \ server responds with an HTTP 503 (service unavailable)\n- Checks if the user's\
    \ PC is on a metered network, and produces an error instead of attempting the\
    \ network access\n- Automatically authenticates against the server it wants to\
    \ communicate"
