  md: 'Note For Windows desktop apps, the ability to launch a file has created security-related
    issues for Windows. For example, mail attachments run .exe files install viruses
    or do other harm to the user''s PC. To greatly improve the security of a user''s
    PC, Windows Store apps are greatly restricted as to files they can launch. For
    example, Launcher''s methods prevent launching a desktop app (which runs less
    restricted than a Windows Store app) by files that execute code, such as .asp,
    .aspx, .bat, .com, .dll, .exe, .inf, .jar, .js, .mdb, .msi, .pl, .vb, .vbs, .wf,
    and so forth.


    In addition, you''ll notice that LaunchFileAsync returns a Boolean (true if the
    launch is successful, and false if the launch failed). If the launch fails, the
    system exposes no way to find out the reason. No additional information is given
    because Microsoft doesn''t want malicious apps to learn about the failure in order
    to attempt to work around it. Also, calling LaunchFileAsync throws an exception
    if it''s not called from a UI thread or if it''s window is not active. This prevents
    from popping up and activating them at arbitrary times, disturbing the user''s
    workflow, and from capturing user input (like passwords). And finally, there is
    an overload of the LaunchFileAsync method that accepts a LauncherOptions object.
    Your app can create one of these and set options that force the user to select
    the app to be launched for a file type or always display a warning to the user
    that the file being launched is potentially unsafe.


    It''s also possible to launch an app to access a file via a URI. This is useful
    for apps that can access files directly from an Internet location. This feature
    is called direct invoke, and it requires that you associate a content type with
    your file-type association. For more about content types, see the IANA website:
    http://www.iana.org/assignments/media-types. Because our file-type association
    declared a content type of "application/jpeg", another app can launch our app
    via a URI as follows:


    ```

    Uri uri = new Uri("http://Internet.com/SomeFile"); // URI to file on Internet

    LauncherOptions options = new LauncherOptions { ContentType = "application/jpeg"
    };

    Boolean ok = await LauncherUriAsync(uri,options);

    ```


    Launching an app also causes its OnFileActivated method to be called; the URI
    can be found in the StorageFile''s FolderRelativeId.


    Developers frequently ask how their Windows Store app can launch another app.
    Because of security concerns, there is no direct way for one app to launch another.
    However, Windows Store apps can be activated if they declare file-type associations
    (as discussed) or if they declare URI protocols. Both of these techniques are
    indirect; that is, an app launches a file or a URI protocol, and the user controls
    which app starts running in response to this. The user views and edits all the'
