    // Bytes are compressed in a buffer of ''blocksize'' bytes and written to underlying
    stream

    public Compressor(IOutputStream stream, CompressAlgorithm algorithm, UInt32 blockSize);


    // Compresses a buffer; the first write includes a header indicating the algorithm

    ublic IAsyncOperationWithProgress<UInt32, UInt32> WriteAsync(IBuffer buffer);


    // After last WriteAsync; stores internal buffer''s remaining bytes to stream

    ublic IAsyncOperation FinishAsync();


    // Disassociates stream; stream will NOT be closed when Dispose is called

    public IOutputStream DetachStream();


    // Closes stream (if detached) does NOT call FinishAsync

    public void Dispose();


    // Calls FlushAsync on underlying stream

    public IAsyncOperation<Boolean> FlushAsync();

    }

    ```


