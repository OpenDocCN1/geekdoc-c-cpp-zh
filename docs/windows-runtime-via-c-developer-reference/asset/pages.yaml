    # Network isolation


    When Visual Studio creates a Windows Store app, it sets one capability in the
    manifest file: Internet (Client). With this, Microsoft is assuming that all Windows
    Store apps will make outgoing connections over the Internet. However, if your
    app performs all its networking using other features (like roaming settings, sharing,
    or WNS), your app does not need this capability and you should turn it off.


    > **Important** Packages that enable network capability *must* have a privacy
    policy when they are submitted to the Windows Store for certification. The reason
    is because network request includes the user''s IP address, and this is considered
    personal information. The privacy policy must be part of the package''s description
    and also be available via the app''s settings as displayed in the Windows Settings
    charm. This can open a webpage displaying the privacy policy. The privacy policy
    simply states what you intend to do with the user''s personal information. Of
    course, the policy can say that you may discard any personal information; you
    just have to make it clear to users what you intend to do with their information.


    CHAPTER 7 Networking 147'
