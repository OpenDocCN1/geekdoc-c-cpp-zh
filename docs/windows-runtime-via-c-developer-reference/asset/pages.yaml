  md: "So now, we can add cancellation and progress. Here's how to call an asynchronous\
    \ WinRT API and fully leverage progress for those times when you need these enhancements:\n\
    \n```\nusing System;\n    // For WindowsSystemExtensions/AsTask\nusing System.Threading;\n\
    \    // For CancellationTokenSource\n```\n\n```\ninternal sealed class MyClass\
    \ {\n    private CancellationTokenSource m_cts = new CancellationTokenSource();\n\
