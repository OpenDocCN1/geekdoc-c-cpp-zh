  md: "```\npublic static class DataFormats {\n    public static String Text { get;\
    \ } // \"Text\"\n    public static String Rtf { get; } // \"Rich Text Format\"\
    \n    public static String Html { get; } // \"HTML Format\"\n    public static\
    \ String Bitmap { get; } // \"Bitmap\"\n    public static String ApplicationLink\
    \ { get; } // \"ApplicationLink\"\n    public static String WebLink { get; } //\
    \ \"UniformResourceLocatorw\"\n    public static String StorageItems { get; }\
    \ // \"ShellIDList Array\"\n}\n```\n\nFor the standard formats, DataPackage offers\
    \ simple, strongly-typed methods that internally call SetData:Text, SetRtf, SetHtmlFormat,\
    \ SetBitmap, SetApplicationLink, SetWebLink, and SetStorageItems.\n\nHowever,\
    \ you are not limited to these standard formats. An DataPackage can define its\
    \ own, custom data and add this custom format of the content into the DataPackage\
    \ object. Of course, the target app will know the same format name in order to\
    \ get data out of the DataPackage object. There are many recognized data formats\
    \ described at http://schema.org for things such as books, movies, recipes, events,\
    \ places, restaurants, products, offers, reviews, and more. If you want to use\
    \ one of these formats, check out the NuGet package at https://github.com/AndreiMarukovich/Transshipment.\
    \ This package includes code to support these formats, which simplifies the code\
    \ you have to write.\n\n> **Important** The order in which an app adds formats\
    \ to the DataPackage is important: it should add the highest fidelity formats\
    \ first and the format with the least fidelity last. For example, HTML text should\
    \ have its formats added in this order: HTML, RTF, and then Text. A target app\
    \ can enumerate the available formats in order. (See DataPackage's AvailableFormats\
    \ property.) The target app should take the highest fidelity format to support.\
    \ If a target app does not support the HTML format, it could use the RTF format\
    \ (if it supports this) or the Text format (if it supports this). Of, the target\
    \ might not support any of the formats placed in the DataPackage object by the\
    \ source app; in this case, the target app simply cannot accept any of the content.\n\
    \n# Sharing via the clipboard\n\nSince its inception, Windows has supported sharing\
    \ data via the clipboard. The great thing about the clipboard is that it allows\
    \ users to select exactly what they want to share. The app also decides how to\
    \ share with. As long as the source and target apps have at least one format in\
    \ common, the data is shareable. Another great thing about the clipboard is that\
    \ it allows sharing of data between Windows Store apps and desktop apps.\n\nCHAPTER\
    \ 10 Sharing data between apps 231"
