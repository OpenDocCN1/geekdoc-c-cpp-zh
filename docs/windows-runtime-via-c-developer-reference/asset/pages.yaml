  md: 'Important Whereas the Pictures library contains videos, the Music library contains
    music, and the Videos library contains all kinds of files on behalf of the user.
    My personal Documents library contains Microsoft Excel files, PowerPoint files,
    Word files, PDF files, Microsoft Money files, C# source code files, and the list
    goes on and on. Having access to all files opens up security issues where user
    files could too easily be accessed and uploaded to somewhere on the Internet.
    For this reason, packages are strongly discouraged from enabling the Documents
    Library in the manifest. In fact, as you can see in Figure 5-7, Visual Studio
    doesn''t show "Documents Library" in the list of Capabilities. If you really want
    to use this capability, you must manually add it to the manifest''s XML file.


    In addition, packages that specify the Documents Library capability will not pass
    Windows Store certification if submitted using an individual account. Only company
    accounts (which are verified) can submit packages that specify the Documents Library
    capability. Furthermore, a package that specifies the Documents Library capability
    must also specify one or more file-type associations. This gives the app access
    to only the specified file types within the library. From a security perspective,
    having apps declare a file-type association is the equivalent of having a virtual
    documents library like "My Excel Files," which the user can feel more comfortable
    granting access to.


    Then, when the user goes to the Store app to install the package, the Store app
    shows the user what capabilities the package requires. By installing the package,
    the user is implicitly granting the package access to the specified capabilities.
    Figure 5-8 shows how the Store app shows a package''s required capabilities to
    a user before the user installs the package.


