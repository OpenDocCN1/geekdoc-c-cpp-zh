  md: 'when connecting to a Wi-Fi network, the system prefers the most recently-connected-to
    and available access point.


    The Windows Runtime provides APIs so you can get information about the network''s
    speed and cost, allowing your app to make informed decisions. However, the system
    not always have all the necessary information to decide if a connection should
    be metered (for example, when it is being used in hotel rooms). Therefore, Windows
    allows users to change a connection to Set As A Metered Connection as shown in
    Figure 7-1 by going to PC Settings > Network > Connections > network name. Changing
    a connection like this is also useful for developers so they can test how their
    app behaves with different connection types. Additionally, the simulator allows
    you to modify these network settings.


    ```

    nebelux5

    ```


    Find devices and content


    Find PCs, devices and content on this network and automatically connect to devices
    like printers and TVs. Turn this off for public networks to help keep your stuff
    safe.


    On


    Data usage


    Show my estimated data use in the Networks list


    On


    Set as a metered connection

    Off


    FIGURE 7-1 Setting a connection as metered using the PC Settings > Network > Connections
    settings.


    Windows surfaces this information to your app, as you’ll see in this chapter’s
    “Network profile information section.” The system itself also changes its behavior
    when on a metered network. For example, open PC Settings and look at SkyDrive,
    SkyDrive > Sync Settings, and PC & Devices > Devices. All of these provide a Metered
    Connections section, allowing a user to control network costs.


    Users can use Task Manager’s App History tab (shown in Figure 7-2) to see how
    much bandwidth individual apps have consumed. Task Manager manages Network usage,
    Metered Network usage, and also Tile Updates. If a user gets a large bill at the
    end of a month, he can easily find out which app or apps are using the most bandwidth.
    The user can then alter how he works with that app or uninstall it entirely.'
