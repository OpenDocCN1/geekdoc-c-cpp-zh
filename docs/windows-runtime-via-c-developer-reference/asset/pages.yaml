  md: 'app’s drawing surface while hosted. When the hosted view is no longer required
    by the hosting app, every time your host app is activated with a hosted activation,
    a new hosted view thread and CoreApplicationView are created. In fact, multiple
    apps could host an app implementing the FilePicker contract simultaneously. If
    this happens, your app’s process will have one hosted view thread and CoreApplicationView
    for each app that is currently running your app. On the other hand, your app’s
    process will never have more than one main view thread and main CoreApplicationwindow.


    While your app is running, it can be activated with more view activations. This
    happens if the user taps one of your app’s secondary tiles or a toast notification.
    In this case, the app comes to the foreground but the act of tapping a tile or
    toast notification directs the app to show something special when brought to the
    foreground. When an already-running app is activated with a new main view activation,
    the process primary thread will not create the main view thread and its CoreApplicationView
    because these have already been created. Because the window has already been created,
    the virtual OnWindowCreated method will not be called, but the proper virtual
    method indicating why the view is re-activated will be. This virtual method should
    respond accordingly by deciding which UI to show and activating the main view
    so that the user can interact with it.


    > Avoid registering event handlers inside a main view activation because these
    methods can be called multiple times and you do not to register callbacks with
    a single event over the lifetime of your process. It can be OK to register callback
    methods with events inside the OnWindowCreated method because this method is called
    only once per thread/window.


    Note that your app might not be running at all, and then a user can activate your
    app for a hosted view. This causes your app’s primary thread to be created, and
    then a hosted view thread and your window are created. But your app’s main view
    thread and window are not created at this time. If the user now activates your
    app with a main view activation, Windows will now create your app’s main view
    thread and window, call the OnWindowCreated method, and then call the virtual
    method indicating why your app is being activated with a main view activation.


