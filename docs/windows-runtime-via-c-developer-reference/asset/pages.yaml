    # Location triggers


    The LocationTrigger allows an app to execute some code when the user''s PC arrives
    or leaves a particular location. For example, an app could show a coupon when
    near a particular location. Apps using this trigger can execute code when the
    PC is running on battery power or if the PC is in the low-power-standby mode.
    For this trigger, users must add their app to the lock screen. (See the "Lock-screen
    apps" section). When the trigger fires, the task''s code can show a toast notification
    on the user''s lock screen. If the user activates the toast and unlocks the PC,
    Windows activates the app that is registered, bringing it to the foreground.


    To use this trigger, your app must get a reference to the GeofenceMonitor singleton
    object and give it one or more Geofence objects it should monitor:


    ```

    private async Task InitializeGeofenceMonitorAsync(){// Get reference to the app''s
    singleton GeofenceMonitor object

    GeofenceMonitor gm = GeofenceMonitor.Current;

    gm.Geofences.Clear(); // Erase all its Geofence objects


    // Get the PC''s current location (requires Location capability)

    Geoposition position = await new Geolator().GetGeopositionAsync();


    // Register a Geofence whose state changes when the PC goes within 1 meter of
    it

    Geofence gf = new Geofence("InitialLocation", // Geofence Id

    new Circle(position.Point, 1), // Point & radius

    nMonitoredGeofenceStates.Entered | MonitoredGeofenceStates.Exited, // When task
    should run

    false, // Not at time

    TimeSpan.FromSeconds(5), // Dwell time

    DateTimeOffset.Now, // Start time

    TimeSpan.FromMinutes(1)); // Duration

    gm.Geofences.Add(gf); // Add the Geofence object to the GeofenceMonitor''s collection

    }

    ```'
