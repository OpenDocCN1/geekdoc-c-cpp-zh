  md: 'The Windows Store cannot easily verify that your app adheres to these policies.
    However, if users of your app complain about your network consumption because
    it is not adhering to these policies, your app will be removed from the Windows
    Store.


    That being, your app can offer the user a setting that allows you to violate restrictions,
    but the important thing is the user must be in control. Here is an example of
    an extension method you can use in your app before initiating a transfer operation.
    This method returns the maximum size of the transfer in megabytes allowed given
    the current network connection and the user''s preference:


    ```

    public static UInt64 GetTransferSizeInMegabytes(this ConnectionProfile cp,

    Boolean userOptIn = false,

    NetworkLevel requiredLevel = NetworkConnectivityLevel.InternetAccess) {


    // If no physical connection or less, return 0 bytes

    if (cp == null) || (cc.NetworkConnectivityLevel() < requiredLevel)) return 0;


    // If the user opts in full network usage, there is no limit

    if (userOptIn) return UInt64.MaxValue;


    ConnectionCost cc = cp.GetConnectionCost();


    // If expensive, don''t transfer anything (your app can use ImB more)

    if (cc.Roaming || cc.OverDataLimit) return 0;


    // No limit if not metered

    Boolean isMetered = cc.NetworkType == NetworkType.Fixed

    || cc.NetworkType == NetworkType.Variable;

    if (isMetered) return UInt64.MaxValue;


    // Return MaxTransferSizeInMegabytes (if exists) or no limit

    return cp.GetDataPlanStatus().MaxTransferSizeInMegabytes ?? UInt64.MaxValue;

    }

    ```


    When your app is about transfer data, call this method to see how large a transfer
    it can do to keep your users happy with your app''s network consumption and also
    to provide Windows Store certification.


    In addition to costs, there are other issues to keep in mind when building a networking
    app—for example, power consumption. Apps should use little bandwidth as possible
    to decrease power consumption. Avoid frequent periodic requests because this prevents
    the network hardware from entering an idle state. Instead, batch requests together
    and perform them all simultaneously less frequently. Also, considering cache offline
    to avoid unnecessary network requests and to give your users a good experience
    with your app when a network is unavailable.


    # Network connectivity notifications


    Your app can receive a notification whenever network connectivity changes by having
    a callback method with the NetworkInformation class'' static NetworkStatusChanged
    event. Apps typically use this to re-establish connections whenever network connectivity
