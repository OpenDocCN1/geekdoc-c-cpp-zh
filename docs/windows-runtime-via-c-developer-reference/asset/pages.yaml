    # DatagramSocket: Multicast UDP communication\n\nWith DatagramSocket, you can\
    \ also send and receive multicast packets. Multicast allows one machine to broadcast\
    \ a data packet to a number of other machines simultaneously. The sender sends\
    \ the packet once, and the network infrastructure (like routers) replicates the\
    \ data as it gets forwarded to the receivers. Multicast is typically used to stream\
    \ audio and video to a large number of clients.\n\nYou set up a PC as a multicast\
    \ listener the exact same way you set up a DatagramSocket listener. But then you\
    \ must join the socket to a multicast group by specifying a multicast IP address\
    \ (which you can learn more about http://en.wikipedia.org/wiki/Multicast_address):\n\
    \n```\n// NOTE: Don't let the DatagramSocket garbage collected\n    until you\
    \ no longer want to accept messages\nprivate async Task<DatagramSocket> StartMulticastListenerAsync(string\
    \ localServiceName) {\n    DatagramSocket multicastlistener = new DatagramSocket();\n\
    }\n\n// You must register handlers before calling BindXxxAsync\nmulticastlistener.MessageReceived\
    \ += OnMulticastListenerMessageReceived;\nawait multicastlistener.BindServiceName(localServiceName);\
    \ // Listen on desired port\n\n// IPv4 multicast addresses: 224.0.0.0 to 239.255.255.255\n\
    hostname hostname = new HostName(\"224.168.1.102\"); // Pick a multicast IP address\n\
    multicastlistener.JoinMulticastGroup(hostname); // Join socket to the multicast\
    \ IP address\nreturn multicast;\n```\n\nWhen the socket receives a message, you\
    \ process it as normally in the OnMulticastMessageReceived event handler. In the\
    \ handler, you can examine the DatagramSocketMessageReceivedEventArgs object's\
    \ RemoteAddress and RemotePort properties to determine which machine sent the\
    \ data packet.\n\nYou can check how the multicast address is bound to the network\
    \ cards with netsh ipv4 show joins. The output will be similar to what shown next.\
    \ Note that 224.168.100.2 is bound to all interfaces."
