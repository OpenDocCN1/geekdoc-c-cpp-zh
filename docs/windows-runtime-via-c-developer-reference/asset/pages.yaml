  md: '# Package staging and registration


    The previous section explored the various ways of deploying a package to a user''s
    PC. In this section, we explore how a package integrates itself with the system,
    allowing a user to activate the package''s app. Specifically, we will talk about
    staging and registration. Packages are staged once per PC and registered once
    per user profile. Note that packages downloaded from the Windows Store are licensed
    to a Microsoft account but they are staged to the user''s account on the PC. Usually
    these are one and the same; that is, a user has linked her PC with her Microsoft
    account. However, they do not have to be the same. In fact, a user can go to the
    Store app, display the Settings charm > Your account page, and change the Microsoft
    account she used to download packages from the Windows Store. In I do when I want
    to install a package I have already processed on another family member''s PC (where
    that family member logs in as him).


    Staging occurs when Windows unzips the package contents into the %ProgramFiles%WindowsApps\PackageFullName
    directory. You''ll notice that Windows uses the package full name, which includes
    the package''s version number. This allows the system to have different versions
    of the same app installed by side on a single PC under the %ProgramFiles%WindowsApps
    directory. Because the content of this folder is read-only, it can be shared by
    all users on a PC. The system keeps older versions of the package until all users
    have uninstalled or upgraded away from the older version. When a particular version
    of a package is installed, the subdirectory for the package is completely destroyed,
    ensuring that the package leaves no footprint behind.


    Registration occurs when a user installs a package for himself. During registration,
    Windows adds entries to the registry for the package. For example, this package
    under the key this:


    ```

    HKCU\Software\Classes\ActivatableClasses\PackageFullName

    ```


    This key contains node information with as the full path to the package''s app
    executable and entry point. Additionally, Windows registers each app''s declared
    activation types (contracts). All apps must implement the Launch activation, and
    Windows registers that here:


    ```

    HKCU\Software\Classes\Extensions\ContractId\...Windows\Launch

    ```


    For those of you with COM, you will recognize some concepts.


    During registration, Windows also creates a directory for the package''s per-user
    state. This directory created here:


    ```

    %UserProfile%\AppData\Local\Packages\PackageFamilyName

    ```


    Package staging and storage folders are discussed in Chapter 4, "Package data
    and roaming," and in "Chapter 5, "Storage folders and folders." Using the %ProgramFiles%WindowsApps\PackageFullName
    directory created during staging, this directory uses the package''s family name
    instead of the package''s name. The system does not need the version number for
    the package''s data, because a user can use only one version of a package at a
    time. Therefore, while a PC can have multiple versions of a package installed
    for different users at the same time, an individual user will have only one version
    of the package installed for'
