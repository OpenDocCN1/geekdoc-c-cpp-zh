  md: '# Process lifetime management


    Back when the Windows operating system (OS) was first created (in the early 1980s),
    there were no computers that ran on battery power. Instead, all computers were
    plugged into an AC power source, which effectively meant that there was an infinite
    amount of power to draw on. Because power was in infinite supply, Windows allowed
    apps to run all the time. Even when the user was not interacting with the app,
    the app was allowed to consume power-consuming resources such as CPU time, disk
    I/O, and network I/O.


    But today, users want mobile computer systems that run on battery power and want
    the battery to last as long as possible between charges. For Windows to meet user
    demands, Windows Store apps are allowed to consume system resources (and power)
    only when the user is interacting with the app; when the user switches away from
    a Windows Store app, the OS suspends all threads in the process, preventing the
    app from executing any of its code, and this prevents consumption of power.


    In addition, the original version of Windows was designed for keyboard and mouse
    input only. Nowadays, users systems that are more intuitive and touch-based input.
    By using a mouse as an input device, users are more likely to tolerate a lag.
    For example, when paging down a document, the user can click on a scroll bar and,
    after releasing the mouse button, the document scrolls. The user *clicks and*
    the document scrolls. With touch input, the document needs to scroll as the user
    swipes their finger. With touch, users won''t tolerate a lag between swiping and
    the scrolling. When apps are allowed to run and consume resources when the user
    is not interacting with them, these apps can take resources from the app user
    is interacting with, negatively affecting the performance and introducing lag
    for the user. This is why Windows Store apps have all their threads suspended
    when the user is not interacting with them.


    Furthermore, Windows puts a lot of restrictions on Windows Store apps. If your
    app does not meet a time restriction, the OS terminates your app, bringing the
    user back to the Start screen where he can relaunch your app or run another app
    that performs satisfactorily.


    3-7 shows the lifetime of a Windows Store app. When your app is activated, Windows
    immediately shows your app''s splash screen (as specified in your app''s manifest
    file). This gives the user immediate feedback that your app is initializing. While
    the splash screen is visible, Windows invokes your app''s Main method and runs
    through all the activation steps as described at the beginning of this chapter.
    One of the last things your app does after initializing is activate its window
    (drawing) by calling Windows.UI.Activate method. If your app does not call this
    method within 15 seconds, the OS terminates your app and returns the user to the
    Start screen.³ While the OS gives your app 15 seconds to activate it, your app
    must activate activate its window within 5 seconds in order to pass Windows Store
    certification. You should really design your app to complete its initialization
    and activate its window within 5 seconds, not 15 seconds.


    > Actually terminates your app only if the user navigates away from its splash
    screen. If the user leaves the screen in the foreground, the app is not terminated.


    64 | PART I Core concepts'
