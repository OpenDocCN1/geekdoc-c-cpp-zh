  md: "To accommodate users with screens varying dots-per-inch (DPI), you should provide\
    \ DPI scalings for each tile logo: 80%, 100%, 140%, and 180%. So, when creating\
    \ your app's medium logo, you should create four files: Logo.scale-80.png, Logo.scale-100.png,\
    \ Logo.scale-140.png, and Logo.scale-180.png. For more information, see the \"\
    Accessing read-only package files\" section in Chapter 5, \"Storage files and\
    \ folders.\"\n\n# # Updating a tile when your app is in the foreground\n\nYour\
    \ app describes your tile's content declaratively. That is, your app creates an\
    \ XML document describing the desired contents of the tile and then your app passes\
    \ this XML document to Windows. Windows defines several XML templates; each offers\
    \ a different way to lay out text and images on the tile. Windows then parses\
    \ the document, builds the tile's image, and displays that image on the user's\
    \ Start screen. The XML schema for templates is documented at http://msdn.microsoft.com/en-us/library/windows/apps/br212859.aspx\
    \ The catalog of tile templates, with examples of what each template produces,\
    \ is documented at http://msdn.microsoft.com/en-us/library/windows/apps/hh761491.aspx.\n\
    \nLet's look at some code that updates your app's tile. Here we'll update a square\
    \ 150-150 pixel tile. This by creating an XML document matching one of the predefined\
    \ templates. To simplify this, WinRT provides an API that returns a predefined\
    \ template. Here is an example of how to get an empty, predefined tile template:\n\
    \n```\nXmlDocument tileXml =\nTileUpdateManager.GetTemplateContent(TileTemplate.TileSquare150x150Text);\n\
    ```\n\nOnce you have the template, you modify the tile's text by retrieving the\
    \ tile element from the XmlDocument and adding a text node to it:\n\n```\ntileXml.GetElementsByName(\"\
    text\")[0].AppendChild(tileXml.CreateNode(\"New text\"));\n```\n\nThe XML document\
    \ now looks like this:\n\n```\n<tile>\n  <visual version=\"2\">\n    <binding\
    \ template=\"TileSquare150x150Text01\" fallback=\"TileSquareText01\">\n      <text\
    \ id=\"1\">New text</text>\n      <text id=\"2\"></text>\n      <text id=\"3\"\
    ></text>\n      <text id=\"4\"></text>\n    </binding>\n  </visual>\n</tile>\n\
    ```\n\nNow you create a TileNotification object, passing it the XmlDocument. A\
    \ TileNotification offers some additional properties to manage the lifetime of\
    \ the tile notification;"
