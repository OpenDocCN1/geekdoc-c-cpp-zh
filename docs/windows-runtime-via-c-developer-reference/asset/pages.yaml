  md: 'Of course, the reason to do this is that you can perform programmatic queries
    against the indexed files. The following code demonstrates how to create the "Indexed"
    folder, add some text files to it, and then perform a query against the folder:


    ```

    // Create the local folder''s "Indexed" subdirectory:

    StorageFolder localFolder = ApplicationData.Current.LocalFolder;

    StorageFolder indexedFolder = await localFolder.CreateFolderAsync("Indexed");

    ```


    ```

    // Create two text files in the "Indexed" subdirectory:

    await FileIO.WriteTextAsync(indexedFolder.CreateFileAsync("File1.txt"), "abc");

    await FileIO.WriteTextAsync(indexedFolder.CreateFileAsync("File2.txt"), "abcd");

    ```


    ```

    // Create a query that looks for text files containing "abcd"

    var query = new QueryOptions(CommonQuery.DefaultQuery, new[] { ".txt" })

    ApplicationSearchFilter = "abcd"

    IndexerOption = IndexerOption.OnlyUseIndexer // Indexed files only!

    FolderDepth = Folder.Depth // Search subdirectories too

    StorageFileQueryResult results = await localFolder.FileQueryWithOptions(query);

    ```


    ```

    // Perform the query and get the results

    IReadOnlyList<StorageFile> result = await results.GetFilesAsync();

    // ''result'' contains a single StorageFile object referencing File2.txt

