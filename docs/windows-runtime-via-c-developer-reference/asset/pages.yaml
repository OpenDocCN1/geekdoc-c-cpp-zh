    ```

    // Read the lines of text from the file (decoded with UTF-8):

    IList<string> input = await PathIO.ReadLinesAsync(file, Path);

    ```


    As you can see, FileIO''s and PathIO''s methods are straight forward to use. All
    their methods open the file, transfer the data, and subsequently close the file.
    These methods are great for common scenarios, but they provide little control
    and are certainly not suitable for working with large files because they read
    the whole file into memory all at once. When you need more control over the stream,
    you''ll use the WinRT interfaces and classes defined in the Windows.Storage.Streams
    namespace. These types make up the streams object model.


    # The streams object model


    Figure 6-1 shows WinRT streams object model. Both IInputStream and IOutputStream
    inherit from IDisposable. This indicates that classes implementing either these
    wrap a new resource like a file or socket handler. In Chapter 1, "Windows runtime,"
    I discussed how the CLR projects WinRT''s streams. Foundation.IClosable interface
    (which has only a Close method) as the .NET Framework''s System.IDisposable interface
    allows you to use C# using statement with WinRT IDisposable types so that your
    Close method is called within a finally block, causing cleanup to occur immediately
    after the try executes or if an exception is thrown as opposed to waiting for
    a future garbage collection.'
