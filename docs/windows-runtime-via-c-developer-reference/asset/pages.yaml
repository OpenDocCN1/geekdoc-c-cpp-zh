    # # Storage items


    The IStorageItem interface offers properties applicable to both files and folders.
    These properties are Name, Path, DateCreated, and Attributes (Normal, ReadOnly,
    Directory, Archive, and Locallycomplete). In addition, the StorageFile and StorageFolder
    classes implement the IStorageItemProperties interface, which defines the Name,
    Display-Type, and FolderRelativeId properties. The IStorageFile interface offers
    some file-specific properties: FileType and ContentType. Table 5-4 shows all these
    properties and an example of what they look like.


    **TABLE 5-4** Various properties available on a StorageFile object.


    | Interface/class | Property | Example value |

    | --- | --- | --- |

    | IStorageItem | Name | "photo.JPG" |

    | | Path | "E:\Pictures\2013\photo.JPG" |

    | | DateCreated | (5/22/2013 11:59:00 AM - 07:00) |

    | | Attributes | FileAttributes.Archive |

    | IStorageItemProperties | DisplayName | "photo" |

    | | DisplayType | "JPEG image" |

    | | FolderRelativeId | "5EF38814DAD2922E\photo.JPG" |

    | StorageFile | FileType | "JPG" |

    | | ContentType | "image/jpeg" |


    > Other class attributes like Hidden, System, Device, SparseFile, ReparsePoint,
    Compressed, Offline, NotContentindexed, Encrypted, IntegrityStream, andScrubData
    are not exposed.'
