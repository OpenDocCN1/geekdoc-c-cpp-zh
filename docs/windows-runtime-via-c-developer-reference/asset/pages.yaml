  md: 'After you construct a BackgroundLoader object, you set any desired properties
    and option-add any needed requests. Let''s discuss a few of these properties.


    The CostPolicy property controls the cost of the transfer. Here are the possible
    values and what each means:


    +   - Default The transfer occurs on unrestricted networks or on metered networks
    if roaming or the data limit. Note that a download operation won''t start if the
    file size is known and would not take the connection over its data limit.


    +   - UnrestrictedOnly The transfer occurs on unrestricted networks. Your app
    should specify this value if only the user opts into this. To do this, you could
    call BackgroundLoader''s RequestUnconstrainedDownloads async.


    The method property for HTTP(S) requests; it returns an empty string, which means
    GET for a download operation and POST for an upload operation. The TransferGroup
    property allows you to assign a bunch of operations to a group (typically by a
    string (GUID)) and whether you want the operations to transfer sequentially or
    in parallel (the default). The operations that are part of this group can be obtained
    when calling the static getCurrentDownloadsForTransferGroup method (discussed
    later). Transfer groups allow you to use a third-party component to initiate transfers
    using a group name that is unknown to the app. Because the app doesn''t know the
    group name string, it can''t discover and manipulate the component''s transfers.
    The ProxyCredential and ServerCredentials allow you to specify any username/password
    words.


    After you initialize a BackgroundLoader object, you can create one or more transfers.
    You create a transfer by calling its Create method. A download operation downloads
    from the specified URI to IStorageFile. For an FTP download, the URI must include
    credentials and must look like this:


    ```

    ftp://username:password@server.com/FolderName/FileName.ext

    ```


    If you want to process the data as it downloads without persisting it into your
    file, pass null for the result parameter and then call DownloadOperation''s GetResultStream
    method, which returns an InputStream you can use to read the data is downloading.
    Note that a ground operation always stores the downloaded data to a system-created
    temporary file; the GetResultStream method also returns an InputStream to this
    temporary file. Downloading to a temporary file allows your app to be suspended
    while the download continues and then process the data when your app resumes.
    I show an example using this technique in the "Populating a stream on demand"
    section of Chapter 6, "Stream input and output"


    6 The temporary files are created in the %UserProfile%AppData\Local\Packages\PackageFamilyName\AC\BackgroundTransferApi
    directory.


    156 PART II Core Windows facilities'
