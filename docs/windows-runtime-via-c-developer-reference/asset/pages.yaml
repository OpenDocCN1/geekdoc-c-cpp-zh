  md: 'will still run out of memory. At this point, a user has to close currently
    running app in order to run some new app. But which apps should close the user?
    A choice is the one using the most amount of memory, how does the user know which
    app it is? There is no good answer to this question, and even if there is, puts
    a big burden on the user to figure this stuff out and to manage it.


    So, for Windows Store apps, Microsoft has taken this problem away from the user
    and instead solved the problem in the OS itself—although you, as a software developer,
    must consider solving the problem. When memory is running low, Windows automatically
    terminates a Windows Store app that you are not interacting with. Of course, the
    user is not aware that this has happened because the app is not interacting with
    it. The system remembers that the app was running and allows the user to switch
    back to the app via the Windows Store app task list (Windows+Tab). When the user
    switches back to the app, the OS automatically relaunches the app so that the
    user can interact with it again.


    > Note The less memory your app uses, less likely the OS is to terminate it.


    Of course, an app uses its memory to maintain state on behalf of the user. And,
    when the OS terminates an app, the memory is freed up and therefore the state
    is discarded. This is where, as a developer, come in. Before your app is terminated,
    it must save its state to disk and, when your app is relaunched, it must restore
    its state. If your app does this, it gives the illusion to the user that your
    app was never terminated and remained in the memory while the time (although your
    app''s splash screen is shown while your app re-initializes). The result is that
    users do not have to manage an app''s lifetime; the OS works with you to manage
    it, resulting in a better end-user experience. Again, this is especially useful
    with mobile PCs, which have limited amounts of memory.


