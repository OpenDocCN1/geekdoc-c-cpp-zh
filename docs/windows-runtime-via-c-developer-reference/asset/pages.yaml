    # Background transfer


    Many Windows Store apps transfer files (documents, pictures, audio, and video)
    over the network. Typically, users use an app to initiate a transfer and then
    the user works with other apps while the transfer takes place. However, as discussed
    in Chapter 3, "Process model," Windows Store apps are suspended when not in the
    foreground, and the file transfer stops. This is clearly not an ideal user experience.


    Fortunately, Windows provides a background transfer feature allowing an app to
    initiate a transfer, and then the system continues while the app is running or
    suspended (but not if the app is terminated). The WinRT background transfer APIs
    are simple to use and have the following capabilities:


    +   - Support all and large transfers (although they are most commonly used for
    large transfers)

    - Automatically take connection profile and cost into account so that you don''t
    have to worry about this'
