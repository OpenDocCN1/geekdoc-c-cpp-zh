    # Creating a bundle package file


    The .appx package file described in the previous section is sometimes referred
    to as a fat package because it can become huge. It becomes huge if the package
    includes resources for languages, many screen resolutions, or if it contains texture
    maps for various versions of DirectX. When a user installs a package, that user
    may only ever need set of language resources, for their monitor''s resolution,
    and one set of texture maps for their video card. Installing a fat package installs
    all of them whether the user needs them or not. Depending on the package, this
    can be a huge waste of bandwidth and huge waste of disk space.


    You can improve this situation for users by creating a bundle package file. A
    bundle package file is a different kind of package. Like an .appx package file,
    a bundle package file also has an identity composed of a package name, version,
    publisher ID; the resource ID is always tied (–), and the CPU architecture is
    "neutral".


    In Figures 2-2 and 2-5, you saw the Generate App Bundle option. If it''s set to
    Never, a bundle file will not be produced. However, if it''s set to Always or
    Needed, the MakeAppx.exe tool is passed a "switch" to create an .appx package
    file (if you have resources). This is just another ZIP file containing its own
    XML manifest file as well as other .appx-ages. The schema for the .appbundle package
    file''s XML manifest can be found at http://ms.microsoft.com/en-us/library/windows/apps.
    There will be one .appx package for CPU architecture you desire (x86, x64, or
    ARM), one .appx file for each set of language resources (en, es, fr, de and so
    on), one .appx file for each scale (80%, 100%, 140%, and 180), and one .appx file
    for each version of DirectX you have texture maps for (dx9, dx10, and dx11).


    What you upload to the Windows Store is one .appbundle package file. Then, when
    a user goes to install your package, the system detects the user''s CPU and the
    .appx package matching the code. The system detects the user''s installed languages,
    monitors, and video card and installs just the .appx files the user requires.
    The remaining .appx package files are not downloaded and installed. This saves
    time and disk space.


    At any time, you can modify or reset your app and use the App Packages Wizard
    to create a new version of the .appbundle package file. You then upload the new
    version of the package file to the Windows Store. About once a day, each user''s
    PC checks the Windows Store to see if a new version of the bundle package file
    exists and, if so, the PC downloads all of the blocks that changed. (Remember
    the discussion of the block map in the previous section.) This keeps the parts
    of your package that are relevant to the user up to date on each user''s PC.


    Also, sometimes in the future, you might install another language, change the
    monitor, or upgrade a video card. Within a day of these changes, the system detects
    this and automatically installs any of the bundle package''s embedded .appx resources
    that are now relevant to the user;'
