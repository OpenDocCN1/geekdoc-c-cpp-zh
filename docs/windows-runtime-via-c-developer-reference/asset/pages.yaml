  md: 'client initiate an HTTP(S) communication with a server. And then, once communication
    is established, the client and server continue using the same TCP protocol. This
    establishes the connection successfully through the firewall (proxy servers) and
    then allows for high-performance, bidirectional communication thereafter.¹³ The
    bidirectional aspect allows a server to send data to the client when it wants
    to; there''s no need for clients to periodically poll the server, long-polling,
    or to establish the client as a server, too, so that it can accept requests.¹⁴


    Of course, the client and server must support the WebSocket protocol, and today,
    not many servers support this protocol. A WebSocket client connects to a server
    by specifying a URL with "ws://" or "wss://" schema. The former initiates the
    conversation over HTTP and transfers data in the clear over the network, while
    the later initiates the conversation over HTTPS and encrypts the data as it goes
    over. In most cases, you''ll want to use a secure WebSocket connection because
    this sets up a secure end-to-end tunnel that intermediate proxy servers allow,
    dramatically increasing the chance that connection succeeds.


    WinRT offers two classes that allow a Windows Store app to initiate the client-side
    communication to a WebSocket server: StreamWebSocket and MessageWebSocket.¹⁵ I''ll
    talk about the StreamWebSocketSocket class in this one and the MessageWebSocket
    class in the next section. The StreamWebSocketSocket class is very similar to
    the StreamSocket class; here is what it looks like:


    +   13 Beware that some proxy servers and routers do not support the WebSocket
    protocol properly, thus preventing its use in environments.

    14 Internally, the WebSocket protocol definition includes Ping and Pong frames
    that are used for keep-alive, heartbeats, network status polling, latency instrumentation,
    and so forth. For, some situations where real-time response is not necessary,
    polling might still be preferred because it doesn''t keep the connection open,
    thereby freeing up resources.

    15 WinRT does not offer any class that allows an app to be a WebSocket server.
    However, Windows itself does support this, and the .NET framework offers a System.Net.Sockets
    namespace containing classes usable by desktop apps.'
