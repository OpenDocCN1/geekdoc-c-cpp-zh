    public PasswordCredential ProxyCredential { get; set; } // For HTTP requests

    public PasswordCredential ServerCredential { get; set; }

    publicpublic void SetRequestHeader(string headerName, string headerValue); //
    For HTTP requests

    public TileNotification SuccessNotification { get; set; } // If ALL success

    public TileNotification FailureNotification { get; set; } // If ANY fail

    public ToastNotification SuccessToastNotification { get; set; } // If ALL success

    public ToastNotification FailureToastNotification { get; set; } // If ANY fail

    ```


