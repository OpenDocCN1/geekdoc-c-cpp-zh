  md: "Here is an example that uses a StreamSocketListener to process requests when\
    \ clients connect.\nEach client sends the service a set of bytes. The service\
    \ sums the bytes together and returns the sum back to the client:\n\n```\n// NOTE:\
    \ Don't let the returned StreamSocketListener garbage collected\n    // until\
    \ you no longer want to accept connections\nprivate async Task<StreamSocketListener>\
    \ StartTcpServiceAsync(string localServiceName) {\n    var tcpServer = new StreamSocketListener();\n\
    \n    // You must register handlers before calling BindXxxAsync\n    tcpServer.ConnectionReceived\
    \ += OnConnectionReceived;\n    await tcpServer.BindAsync(new HostName(localServiceName));\
    \ // Listen on desired port\n    return tcpServer;\n}\n\nprivate async void OnConnectionReceivedAsync(StreamSocketListener\
    \ listener, SocketSocketReceivedEventArgs args) {\n\n    using (Socket client\
    \ = args.Socket)\n    using (DataReader reader = new DataReader(client.Socket.InputStream))\n\
    \    using (DataWriter writer = new DataWriter(client.Socket.OutputStream)) {\n\
    \        // Read header from client:\n        await reader.LoadAsync(sizeof(Int32));\n\
    \        UInt32 messageLength = await reader.ReadUInt32Async();\n\n        //\
    \ Read data from client:\n        await reader.LoadAsync(messageLength);\n   \
    \     Byte[] bytes = new Byte[messageLength];\n        reader.ReadBytes(bytes);\n\
    \n        Int32 sum = bytes.Sum(number => number); // Calculate response\n\n \
    \       // Send response to client:\n        writer.WriteInt32(sum);\n       \
    \ await writer.StoreAsync(); // Required to send the response back to the client\n\
    \    }\n}\n```\n\n# StreamWebSocket: Streaming client-side WebSocket communication\n\
    \nMany organizations configure their firewalls to disable traditional socket communication\
    \ to better secure their resources. However, many organizations allow their firewalls\
    \ to flow HTTP and HTTPS traffic over ports 80 and 443, respectively. This allows\
    \ Internet access to the World Wide Web. But HTTP(S) traffic has its own shortcomings.\
    \ For example, it is a request/response protocol that has a lot of overhead associated\
    \ with it, making it less efficient using the TCP protocol that HTTP(S) is built\
    \ upon.\n\nTo address the HTTP(S) protocol's strengths and weaknesses, the WebSocket\
    \ protocol was created. See http://www.w3.org/TR/websockets/) The WebSocket protocol\
    \ allows asynchronous, bidirectional, high-performance communication through firewalls\
    \ using ports 80 and 443. It works by having"
