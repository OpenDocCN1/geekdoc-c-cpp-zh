  md: '3. Add a manifest declaration so that Windows knows how to activate background
    task code.


    4. Register your app''s background tasks with Windows the first time your app
    is activated.


    The next four sections explain these steps in more detail.


    Figure 9-1 summarizes the interaction between your app, Windows, and your background
    task code. After your app executes step 4 in the preceding list, Windows waits
    for the desired trigger event to occur. When the trigger occurs, Windows creates
    a new process, loads your background task code into it, and calls a predefined
    entry point. Now, your background task code is executing within this process.
    When your method completes, the process terminates and Windows waits for the trigger
    to occur again. Windows will not run multiple instances of your task concurrently.


    ![](img/f105584195b83b4404e3d2b11f5786c3_229_0.png)


    FIGURE 9-1 Interaction between your app, Windows, and your background task code.


    > Important Because background tasks typically execute in a different process
    than the app''s process and because the app''s process might be terminated when
    the background task code executes, the background task code is not allowed to
    update the app''s user interface. However, a background task can update its tiles
    or badges, or cause the display of a toast notification. In addition, the background
    task process runs in the package''s container. This means the manifest''s package
    capabilities and app declarations do apply to the background task process. In
    addition, the background task process can write to the package''s data settings
    and folders (discussed in Chapter 4, "Package data and roaming"), and the package''s
    app can subsequently read this information. Similarly, an app can write to its
    data and its background tasks can read this data. This is the easiest way for
    an app and its background tasks to communicate data with each other. One process
    can signal when data is ready by calling ApplicationData''s SignalDataChanged
    method, which raises a DataChanged event.


    PART II Core Windows facilities'
