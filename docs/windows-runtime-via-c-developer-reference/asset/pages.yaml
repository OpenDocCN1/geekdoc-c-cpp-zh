    # Windows Push Notification Service (WNS)


    Table 8-1 listed four ways to update tiles, badges, and toast notifications. In
    this section, we focus on the last technique, Windows Push Notification Service
    (WNS).


    Periodic updates with URLs go a long way in updating your app''s tiles and badges,
    especially because you can personalize the notifications by query strings. I already
    mentioned providing a ZIP code for weather apps. You can also provide a list of
    symbols to adjust the tile to the user''s preferences, and so on. Periodic updates
    suffer from their resolution; they can update no quicker than every 30 minutes.
    For some scenarios, you want to notify the user immediately that something has
    occurred. Examples include flight updates, incoming messages, social updates,
    and investment changes. WNS sends real-time tile, badge or toast notifications
    to a specific user on a specific PC. Whereas periodic updates use a polling mechanism,
    WNS allows you to push a notification to a user/machine when you need to. Because
    WNS doesn''t waste bandwidth or CPU cycles for


