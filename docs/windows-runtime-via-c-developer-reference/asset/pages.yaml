  md: '# Testing your app


    In the Technical Compliance step in Figure 11-2, your app is submitted to a set
    of certification tests. Some of these tests are automated, while some of them
    are performed by an actual person. The automated tests are performed by a tool
    called the Windows App Certification Kit (WACK). This tool also ships with Visual
    Studio and the Windows SDK, allowing you to run the test before you upload your
    app to the Windows Store. If the WACK tool detects a violation in your app, your
    app will definitely fail certification if you upload it to the Windows Store.
    You should use this tool before submitting your app to save time and effort. You
    can run the WACK tool on your local PC or on a remote PC. You can also download
    an ARM version for Windows RT systems. The WACK tool has a graphical UI, but you
    can also run the command-line version of the tool (AppCert.Exe). For details about
    the kit, see http://msdn.microsoft.com/en-us/library/windows/apps/h694081.aspx.


    After you have created your package, the VS Wizard offers you the option of running
    the WACK tool on the package files. Alternatively, you can start the WACK tool
    from the Start screen or desktop app. WACK app needs to start your Windows Store
    app through a COM API call, which requires elevated privileges; hence, Windows
    prompts you with a User Account Control (UAC) dialog box before showing the list
    of tests, as shown in Figure 11-3. You can run all tests at once, or you can run
    tests independently, which can save time if you''re focusing on removing specific
    violations. For details on the individual tests and what they do, see http://msdn.microsoft.com/en-us/library/windows/apps/


    ![](img/f105584195b83b4404e3d2b11f5786c3_275_0.png)


    **FIGURE 11-3** The required tests for certification in the Windows App Certification
    Kit.'
  merge: -1
