    +   - Package Explorer is able to launch apps by calling ApplicationActivationManager''s
    ActivateApplication. This is a COM interface you can use from desktop apps to
    launch Windows Store apps given their UserModel ID string.


    Most of these methods are callable only from a Windows desktop app because these
    APIs require standard user privileges and Windows Store apps don''t have these
    within their container. You are unlikely to need any of these APIs for your Windows
    Store development.


    # # Debugging Windows Store apps


    This section presents some general information about debugging a Windows Store
    app with Visual Studio. Other chapters in this book give additional debugging
    tips and tricks.


    When you use Visual Studio to build and debug your app, Visual Studio creates
    all your packages under your project build directory; the files are not zipped
    into an .appx package file; therefore, nothing is signed with a certificate and
    no package is installed under the %ProgramFiles%\Windows directory. The app runs
    directly from the project directory. This means that the app is registered for
    the user, but the app was never actually stood onto the machine. Winlect''s Package
    Explorer displays "Development" in the "Type" column for any packages that are
    registered and not.


    Of course, if you just delete the files from the project''s output directory,
    the app will still registered with the system. Attempting to launch the app via
    a Start tile immediately, returning you right to the Start screen. If you select
    the app and then tap Uninstall, the package will be officially unregistered, meaning
    that all the app''s footprint for the user is destroyed but the package doesn''t
    really get uninstalled because it was never actually stood.


    When you make changes to your app in Visual Studio, rebuild it, and run it, any
    per-package data (discussed in Chapter 4) remains on your machine. This is usually
    desirable because you can create your app, make some fix, a bug and then test
    the fix against the state. However, in some circumstances, Visual Studio will
    automatically unregister and register your app, thereby deleting any-package data.
    Visual Studio shows this if you run the app from a different location (for example,
    switching from a Debug build to a Release build), or change manifest files (such
    as Start screen loops), and you might want to force Visual Studio to delete any
    per-package data each time you run your app. Visual Studio enables this via its
    Uninstall And Then Re-Install My Package check box, which is available to you
    when you look at your project''s debugging settings. (See Figure 2-8).'
