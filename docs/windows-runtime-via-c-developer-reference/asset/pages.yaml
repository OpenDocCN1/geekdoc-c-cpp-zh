  md: "your app is suspended. Windows remembers the most recent events and raises\
    \ them when your app resumes. In this case, Windows stops the transfer operation.\
    \ Then, when the user switches back to your app, Windows automatically relaunches\
    \ your app. But, at this point, any callback methods you've registered for progress\
    \ reporting and completion have been destroyed. Furthermore, Windows doesn't automatically\
    \ detect that your app reloaded, so it will not resume your app's transfers.\n\
    \nSo, when your app relaunches, it must call the BackgroundDownloader.GetCurrentAsync\
    \ and BackgroundUploader.GetCurrentAsync. These methods return a collection of\
    \ XxxOperation objects—one object for each transfer you initiated by calling StartAsync.\
    \ Just calling these methods is enough to have Windows resume the transfers; you\
    \ not actually have to iterate through the returned collections. Note that uploads\
    \ using the HTTP PUT method restart, while uploads the HTTP POST method do not.\n\
    \nIf you want, you can iterate through these collections and register any process,\
    \ cancellation, and completion notifications you'd like:\n\n```\n// NOTE: This\
    \ code uses CancellationToken for all transfer operations.\n// It also assumes\
    \ one progress and completion callback for all downloads & for all uploads\n//\
    \ You must modify this code if you desire different behavior\n```\n\n```\nprivate\
    \ async void AttachToBackgroundTransfers(CancellationToken ct, String group,\n\
    Progress<DownloadOperation> downloadProgress,\nTask<DownloadOperation> downloadComplete,\n\
    Progress<UploadOperation> uploadProgress,\nTask<UploadOperation> uploadComplete)\
    \ {\n```\n\n```\nforeach (DownloadOperation dop in\n    await BackgroundDownloader.GetCurrentAsync(group))\
    \ {\n```\n\n```\nvar naming = dop.AttachAsync().AsTask(ct, downloadProgress)\n\
    \    .ContinueWith(downloadComplete);\n```\n\n```\nforeach (UploadOperation uop\
    \ in\n    await BackgroundUploader.GetCurrentAsync(uop)) {\n```\n\n```\nvar naming\
    \ = uop.AttachAsync().AsTask(ct, uploadProgress)\n    .ContinueWith(uploadComplete);\n\
    ```\n\n```\n}\n```\n\nWhen you start a transfer, the system remembers it. If your\
    \ app closes or terminates, you must reattach to the previously started transfer\
    \ operations or they will remain dormant in the system, wasting resources. Your\
    \ app has to complete or cancel each operation to release its resources. For forget\
    \ about this when debugging your app. When you stop a debugging session, the system\
    \ remembers any initiated operations. If you debug and stop a lot, your app can\
    \ accumulate a lot of transfer operations. The easy way to destroy all of the\
    \ operations is to go to your app's properties in Visual Studio, or on the Debug\
    \ page, select the \"Uninstall and re-install my package. All information about\
    \ the application state is deleted.\" and then start your app again."
