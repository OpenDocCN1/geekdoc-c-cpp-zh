    \ are the same.\n    // The returned bytes are already in the original Byte[]\n\
    }\n```\n\n```\ndata = new Byte[stream.Size - 5]; // Allocate Byte[]\nproposedBuffer\
    \ = data.AsBuffer(); // Wrap it in an object that implements IBuffer\nreturnedBuffer\
    \ = await stream.ReadAsync(proposedBuffer, proposedBuffer.Capacity, InputStreamOptions.None);\n\
    ```\n\n```\n// We use the returned IBuffer here\nusing (var sr = new StreamReader(returnedBuffer.AsStream()))\
    \ {\n    String str = sr.ReadToEnd();\n}\n// Close the stream\n```\n\nWhen you\
    \ call AsBuffer, it internally constructs a System.Runtime.InteropServices.WindowsRuntimeBuffer\
    \ object around your byte array. The WindowsRuntimeBuffer class also offers a\
    \ static Create method that can allocate the array and wrap it with a WindowsRuntimeBuffer\
    \ object.\n\nSimilarly, WinRT offers a Windows.Storage.Streams.Buffer class that\
    \ creates an IBuffer whose bytes are in the native heap. For most .NET Framework\
    \ developers, there should be less need to use this class because memory in the\
    \ managed heap can be pinned and accessed from native code without copying.\n\n\
    When calling ReadAsync, you pass a IBuffer where the code implementing the InputStream\
