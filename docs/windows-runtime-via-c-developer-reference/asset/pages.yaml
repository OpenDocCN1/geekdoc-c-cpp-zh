  md: "+   - The IInputStream interface is used by the background transfer manager\
    \ and the DataReader, DataProtectionProvider, Decompressor, and AtomPubClient\
    \ classes.\n\n+   - The IOutputStream interface is used by networking, as well\
    \ as the DataWriter, DataProtectionProvider, Compressor, and InkManager classes.\n\
    \n# # Interoperating with WinRT streams and .NET streams\n\nThe .NET Framework\
    \ has its System.IO.Stream class (and many types derived from it), and are many\
    \ useful classes in the .NET Framework designed to take input and output from\
    \ these Stream-derived classes. LINQ to XML and the serialization technologies\
    \ are two that immediately come to mind. So if you want to use these .NET technologies\
    \ with WinRT storage files, you're going to have to use the framework projection\
    \ methods (as discussed in Chapter 1) in the System.IO.WindowsRuntimeStorageExtensions\
    \ to help you:\n\n```\nnamespace System.IO { // Defined in System.Runtime.WindowsRuntime.dll\n\
    \    public static class WindowsRuntimeStorageExtensions {\n        public static\
    \ Task<Stream> OpenForReadAsync(this IStorage file);\n        public static Task<Stream>\
    \ OpenForWriteAsync(this IStorage file);\n\n        public static Task<Stream>\
    \ OpenForReadAsync(this IStorageFolder rootDirectory,\n            String relativePath);\n\
    \        public static Task<Stream> OpenForWriteAsync(this IStorageFolder rootDirectory,\n\
    \            String relativePath, CreationOption option);\n    }\n```\n\nHere\
    \ is an example that uses a WinRT StorageFile and reads its contents into a .NET\
    \ Framework.System.Linq.XDocument object:\n\n```\nStorageFile winRTFile = await\
    \ Package.Current.InstalledLocation\n    GetFileAsync(\"AppManifest.xml\");\n\
    using (NetStream stream = await winRTFile.OpenForReadAsync()) {\n    XDocument\
    \ xml = XDocument.Load(stream);\n    // Use the xml here...\n```\n\nThe System.IO.WindowsRuntimeStorageExtensions\
    \ also offer extension methods, which \"cast\" WinRT stream interfaces (as IRandomAccessStream,\
    \ IInputStream, or IOutputStream) to the .NET Framework's stream type and vice\
    \ versa:\n\n```\nnamespace System.IO { // Defined in System.Runtime.WindowsRuntime.dll\n\
    \    public static class WindowsRuntimeStreamExtensions {\n        public static\
    \ Stream AsStream(this IRandomAccessStream winRTStream);\n        public static\
    \ Stream AsStream(this IRandomAccessStream winRTStream, Int32 bufferSize);\n\n\
    \        public static Stream AsStreamForRead(this IInputStream winRTStream);\n\
    \        public static Stream AsStreamForRead(this IInputStream winRTStream, Int32\
    \ bufferSize);\n```"
