  md: "| IAsyncAction |\n| :--- | :--- |\n| Completed | [delegate] |\n| GetResults\
    \ | [void] |\n\n| IAsyncInfo |\n| Id (UInt32)\nStatus (AsyncStatus)\nErrorCode\
    \ (HResult)\nCancel()\nClose()\n\n| IAsyncWithProgress<TProgress> |\n| :--- |\
    \ :--- |\n| Completed | [delegate] |\n| GetResults | [void] |\n| Progress | [delegate]\
    \ |\n\n| IAsyncAction<TResult> |\n| :--- | :--- |\n| Completed | [delegate] |\n\
    | GetResults | [TResult] |\n\n| IApiOperationWithProgress<TResult, TProgress>\
    \ |\n| :--- | :--- |\n| Completed | [delegate] |\n| GetResults | [TResult] |\n\
    | Progress | [delegate] |\n\nFIGURE 1-2 WinRT interfaces related to performing\
    \ asynchronous I/O and compute operations.\n\n# Simplifying the calling of asynchronous\
    \ methods\n\nIn the .NET Framework, we use types the System.Threading.Tasks namespace\
    \ for asynchronous operations. In addition, C# offers the async and await keywords,\
    \ allowing you to perform asynchronous operations by a sequential programming\
    \ model, thereby simplifying your code substantially. We will now look at how\
    \ C# developers work with asynchronous WinRT APIs.\n\nThe following code is a\
    \ rewrite of the WinRTAsyncInto method shown earlier. However, this version leverages\
    \ framework projections (extension methods) supported by the .NET Framework Class\
    \ Library. This code does not show progress reporting (because GetFileAsync doesn't\
    \ offer it) and also ignores cancellation.\n\n```\nusing System;// Required for\
    \ framework projection extension methods defined\n// by the WindowsRuntimeExtensions\
    \ class\n\n// NOTE: If invoked by a GUI thread, all code executes via that GUI\
    \ thread:\npublic async static void WinRTAsyncInto()\n{\n    StorageFile file\
    \ = await KnownFolders.MusicLibrary.GetFileAsync(\"Song.mp3\");\n    // TODO:\
    \ Completed code\n}\ncatch (SomeErrorException ex)\n{\n    // Error code\n}\n\
    ```\n\nWhat's happening here is the use of C#'s await operator causes the compiler\
    \ to look for a GetAwaiter method on the IApiOperation<StorageFile> interface\
    \ returned from the"
