    For the folder and file-open picker, the FileFilterproperty is mandatory. This
    property is a collection of strings telling the picker which files to show. When
    you can use the wildcard (**) string to show all files to the user. All the other
    properties are self-explanatory except for, SettingsIdentifier. You can set the
    SettingsIdentifier property to any string value. When your app uses a picker for
    the first time, the picker will navigate to the folder specified by the SuggestedStartLocation.
    However, the user can use the picker to navigate to a different folder. When the
    user subsequently picks a location or closes the picker, the system saves this
    last selected location. If, in the future, your app brings a picker with the same
    SettingsIdentifier value, the picker remembers the user''s last location and navigates
    to it directly, overriding the SuggestedStartLocation. This is the reason why
    the property is SuggestedLocation; it is a suggested location and not a demand.


    A FolderPicker returns a StorageFolder object representing the folder that the
    user is using your app to use. With this StorageFolder object, you can access
    any files in this folder and any child items such subfolders and files in subfolders.
    This grants your app a lot of power; use it wisely. The folder picker UI not give
    any indication to the user that your app gets access to the folder and its complete
    contents.


