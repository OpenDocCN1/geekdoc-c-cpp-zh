  md: 'When the user selects a file via a picker, the system returns a StorageFile
    object, allowing your app access to switch away from your app, causing the system
    to suspend and possibly even terminate it. (See Chapter 3 for reasons why). When
    the user switches back to your app, the system launches again and your app is
    supposed to act as if it were running the whole time. However, when Windows terminates
    your app, the StorageFile object gets destroyed and now your app can no longer
    access the user-selected file. Your app could present the user with another picker
    and have her consent to your app again, but this would be a horrible user experience.
    What we need is a mechanism that allows your app to remember the StorageFile and
    StorageFolder objects that the user granted your app''s package access to.


    Fortunately, this mechanism exists, and it calls the FutureAccessList. Each package
    has a single FutureAccessList property exposed by the static type ApplicationPermissions-it''s
    a simple dictionary of key/value pairs. The keys are Strings, and we call them.
    The values contain an IStorageItem and a String, which we call metadata. The metadata
    string is optional; if you don''t specify it, the empty string ("") is used. When
    adding an IStorageItem to the FutureAccessList, you can specify a specific key,
    but you don''t have to. If you omit a key (token), a GUID will be generated and
    used as the key.


    The following line adds an entry to the FutureAccessList. The key is "FileWereUsing",
    and the value is some StorageFile object as some metadata String:


    ```

    StorageApplicationPermissions.FutureAccessList.AddOrReplace(

    "FileWereUsing", storage_file, "SomeMetadata");

    ```


    If your app terminates and launches again, you regain access to the file by this:


    ```

    StorageFile file = await

    StorageApplicationPermissions.FutureAccessList.GetFileAsync("FileWereUsing");

    ```


    Getting the metadata back (if you need it) is a bit tricky:


    ```

    String metadata = StorageApplicationPermissions.FutureAccessList.Entries

    .First(e => e.Token == "FileWereUsing").Metadata;

    ```


    The FutureVersion can hold up to 1000 storage items, and your code controls addition
    and removal. The StorageApplicationPermissions class also holds a MostRecentlyUsedList
    property. The MostRecentlyUsedList works exactly like the FutureAccessList, except
    it holds up to 25 items and Windows manages them automatically for you. So, when
    you add a new storage item and it has reached its limit of 25, the oldest item
    is automatically removed. Moreover, the system sorts the items in the MostRecentlyUsedList;
    thus, if you enumerate the storage items, they are returned in most-recently-used
    order. Finally, because both lists implement the IStorageItemAccessibility interface,
    their APIs are identical. The interface looks like this:'
