    2013-08-05T20:10:31Z\"\n  LicenseType=\"Full\"\n</Receipt>\n```\n\nReceipts are\
    \ used if your app has a companion web service. They allow your service to verify\
    \ that the calling client is authorized to use some feature or download some content.\
    \ Also, at any time the app is licensed, you can acquire the receipt by calling\
    \ CurrentApp(Simulator)'s GetAppReceiptAsync method and then send this receipt\
    \ to your service. A receipt is generated with a standard XML digital signature,\
    \ allowing your server to verify that it comes from the Windows Store. To learn\
    \ how your service can validate a receipt, see http://msdn.microsoft.com/en-us/library/windows/apps/ji6497137.aspx.\
    \ To download the certificate used to sign the receipt from https://lic.microsoft.com/licensing/certificates?cid=CertificateId,\
    \ where CertificateId is the value of Receipt's CertCertificateId attribute (a\
    \ certificate thumbprint). The ReceiptDeviceId identifies the device used to purchase\
    \ the license, and the AppReceipt's Id uniquely identifies the app receipt, which\
    \ is guaranteed to be the same across all of a user's PCs.\n\nWhen a trial expires,\
    \ the user pays the current price of the app. This might differ from the price\
    \ listed when the user originally installed (the app.) App licenses are granted\
    \ as either full or trial. Once a user has a full license, regardless of the price\
    \ at the time it was acquired (free or paid), it's a full license. This includes\
    \ future versions of the app. If a developer changes an app's price, the price\
    \ affects new customer purchases only; existing customers are unaffected. If a\
    \ user installs supporting trials and installs a new version of an app that does\
    \ not support trials, the trial is still in effect until it expires; making an\
    \ app for purchase affects only new users of the app.\n\n# CHAPTER 11 Windows\
