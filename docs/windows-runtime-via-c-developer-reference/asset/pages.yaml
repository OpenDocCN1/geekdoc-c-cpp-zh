    # Implementing a share target app


    While many apps can and should share source apps, few apps should be share targets
    because many apps don''t have something to do with shared content. However, there
    are some apps that make great share target apps. These apps include communication
    (social networking and mail) apps, note-taking apps, and some apps that communicate
    to devices.


    Creating a share target is pretty straightforward. The first thing you must do
    is add the Share Target declaration to your package manifest. When you add this
    declaration, you indicate via the Share Description field what your app intends
    to do with the shared data. This text appears in the Share pane and helps users
    understand what the target app will do with the data without the user having to
    activate the target app. For example, the Reading List app shows "Bookmark for
    later" in the Share pane.


    In the manifest, you also indicate what formats your share target app supports.
    Examples are "Text", "Rtf", "HTML Format", and "Bitmap". Figure 10-3 shows how
    to add a Share Target declaration. Specifying anything in the Supported File Types
    section implies support for the "PastPositions" format. If you supports Any File
    Type, your target app will show up in the Share cham if any storage items are
    in the DataPackage. If you specify file types and do not specify Any File Type,
    your app will appear in the Share cham only if the file type in the DataPackage
    matches one of the file types your app supports.


    The next thing you do is define a XAML Page-derived class that shows your app''s
    sharing interface that the user has to consent or cancel the sharing process with
    your app. If you want, you can have Microsoft Studio jump-start your effort by
    selecting Project > Add New Item > Windows C# > Share Target. This uses Visual
    Studio to produce a basic Page-derived class with some code-behind that will take
    some of the DataPackage''s properties (like Title, Description, and Thumbnail)
    and display them in XAML. When a DataPackage is given to the target app, the system
    prepopulates the LogoBackgroundColor and Square3030Logo properties. (A source
    app can change these values if it chooses.) These values can be displayed by the
    share target app so that the user knows the source app that produced the share.
    The Reading List app shows this source-app branding with each item.


    Of course, you''ll probably want to customize this page''s appearance substantially
    to meet your app''s needs. There I''ll discuss shortly.'
