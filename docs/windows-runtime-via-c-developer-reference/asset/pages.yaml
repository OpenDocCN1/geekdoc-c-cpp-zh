    # Roaming package data


    Increasingly, users have multiple PCs that they use on a regular basis. they might
    have a PC at home, a PC at work, and a tablet that they travel with. It is a pain
    for users to configure all PCs similarly for each app they use. For this reason
    Windows provides the ability for Windows Store apps to roam any package settings
    and storage files. Now, a user can configure your app once, and the configuration
    will automatically roam across all the user''s PCs where the has installed your
    package. In addition, your app can offer a continuous experience where the user
    starts an operation with your app on PC and continues the operation on a different
    PC. For example, imagine you is using your app to watch a video on her desktop
    PC then she grabs the tablet and opens your app, and the video continues from
    where it left off. In the fact, may want for users to force the current PC''s
    settings to sync with their other PCs is locking their PC.


    Many settings in Windows itself roam across the user''s PCs automatically as well,
    as desktop background images, Internet favorites, and language settings. To have
    roaming, users must log in to their Windows PC using their Microsoft account or
    link their local or domain account with their Microsoft account. Users associate
    their Microsoft account with Windows by opening the Settings charm > Change PC
    Settings > Accounts > Your Account > Connect To Microsoft Account.


