  md: "In addition needing a HostName, your app also needs the name of a service that\
    \ it needs to communicate with a remote system. The service name is represented\
    \ by a string. You can use a numeric literal for a port number (like \"80\" for\
    \ HTTP) or a service name. Service names are similar to DNS names. DNS names are\
    \ strings passed to a DNS server that returns the IP address. Likewise, service\
    \ names can be passed to a DNS server whose SRV record returns a port number.¹\
    \ Instead of querying DNS servers, Windows can map a host name to an IP address\
    \ by looking up the host name in the %WinDir%\\System32\\Drivers\\Et\\Hosts file.\
    \ Similarly, Windows can map a service name to a port number by looking up the\
    \ service name in the %WinDir%\\System32\\Drivers\\Et\\Services file.\n\nThe combination\
    \ of a host name and service name results in an endpoint. When your app's local\
    \ socket connects to a remote server, you have a pair of endpoints. WinRT defines\
    \ an EndpointPair class that encapsulates connection information:\n\n```\npublic\
    \ sealed class EndpointPair {\n    public EndpointPair(\n        HostName localHostName,\
    \ String localServiceName,\n        HostName remoteHostName, String remoteServiceName)\n\
    ```\n\n```\npublic HostName LocalHostName { get; set; }\npublic String LocalServiceName\
    \ { get; set; }\npublic HostName RemoteHostName { get; set; }\npublic String RemoteServiceName\
    \ { get; set; }\n}\n```\n\nAs you'll see, some WinRT APIs accept an EndpointPair\
    \ argument.\n\n# StreamSocket: Client-side TCP communication\n\nTo accomplish\
    \ client-side TCP communication with WinRT, you use the StreamSocket class, which\
    \ looks like this:\n\n```\npublic sealed class StreamSocket : IDisposable {\n\
    \    public StreamSocket();\n}\n```\n\n```\n// OPTIONAL: Modify connection (keep\
    \ alive, outbound buffer size, QoS)\n// before calling ConnectAsync\npublic StreamSocketControl\
    \ Control { get; }\n\n```\n\n```\n// Returns connection read-only (bandwidth,\
    \ host/service names, timings)\npublic StreamSocketInformation Information { get;\
    \ }\n\n```\n\n```\n// Connect to a service on a remote machine (other overloads\
    \ not shown here)\npublic IAsyncAction ConnectAsync(HostName remoteHostName, String\
    \ remoteServiceName,\n    SocketProtectionLevel protectionLevel);\n```\n\n> ¹\
    \ For information about DNS SRV records, see http://tools.iet.org/html/rfc2782.\
    \ For a list of well-known service-to-port mappings, see http://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml."
