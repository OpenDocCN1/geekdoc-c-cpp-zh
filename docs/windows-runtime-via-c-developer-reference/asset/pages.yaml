  md: 'CHAPTER 8


    # Tile and toast notifications


    The Start screen is the users'' personal dashboard, containing information they
    care about. It consists of tiles, all nicely ordered with animating content. One
    glance shows you new email, the latest price of your favorite stocks, and what
    your next appointment is, the latest weather information for locations you care
    about, and so on.


    For developers, these tiles provide tremendous advantages compared to other platforms.
    Showing useful information in a tile compels the user to open your app more often.
    And the more time spent in your app, the better it is for you as an app developer
    if you offer in-app advertising or in-app purchases. In addition to updating tile
    content, your app can also place a badge over a tile drawing the user''s attention
    to important information such as new emails or missed calls. The Start screen
    is designed to show information the user cares about. So users control whether
    your app''s tile reside on their Start screen, the size of the tile, and whether
    your app can update the tile''s content. Your app cannot control these things.
    In addition to containing tiles and badges, your app can also pop up toast notifications
    that inform the user of time-critical information, such as an incoming call or
    meeting reminders. Again, the user is in control and can silence toast notifications
    produced by your.


    In Chapter 3, "Process model," you saw that the system gives CPU time only to
    Windows Store apps in the foreground. So you might wonder how an app can update
    its tiles content or pop up a toast notification when the app is in the background
    or not running at all. All tiles, badges, and toast notifications are updated
    using four techniques, summarized in Table 8-1. All of these techniques are explained
    in this chapter.


    Table 8-1 Four techniques to update tiles, badges, and toast notifications.


    | Update technique | Applies to | Description and examples |

    |---|---||

    | Foreground | Tile Badge Toast | App''s code updates the notification while the
    app is running in the foreground. Examples: Music app shows the current song;
    Game app shows the high score; Badge when the app updates to reset an "unseen"
    notification (described later). |

    | Scheduled | Tile Toast | App''s code schedules the notification update for a
    future time. Examples: Calendar reminders, countdowns to |

    | Periodic | Tile Badge | App''s code instructs Windows to periodically poll an
    HTTP(S) server. This is great for distributing the same content to a wide audience.
    You specify the URI, start time, and frequency of recurrence (such as a ½ hour,
    1 hour, 6 hours, or 24 hours). Examples: Weather update, "daily deals" to |

    | Push (WNS) | Tile Badge Toast | App''s companion server pushes the notification
    to Windows on demand. This is great for personalized data, real-time data, or
    both. Examples: Breaking news, sports updates, social updates, incoming messages
    |


    183'
