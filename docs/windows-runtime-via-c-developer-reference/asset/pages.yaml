    over C#, Fourth Edition (Microsoft Press, 2012) by Jeffrey Richter.

    - In the References folder, you''ll find two entries. The first, “.NET for Windows
    Store apps,” exposes the subset of the .NET Class Library you can call from Windows
    Store apps (as discussed in Chapter 1). The second, "Windows," exposes the WinRT
    APIs provided by the Windows operating system that are callable by Windows Store
    apps.

    - The Assets folder contains nonexecutable (resource) files, such as images and
    media files. These files are packed and deployed with your app. By default, Visual
    Studio places image files in this folder that are for your app''s store logo,
    splash screen, and primary Start screen tile.

    - Package.appmanifest is an XML file that describes your Windows Store app. We''ll
    explore the manifest in this chapter''s next section and refer back to it frequently
    throughout this book. If you open the file in Visual Studio, you can see that
    the IDE provides a user-friendly editor for this manifest file. This user interface
    is called the manifest designer.


    PART I Core concepts'
