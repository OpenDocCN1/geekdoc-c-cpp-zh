    \ dpv.Properties.Title, dpv.Properties.Description);\n    await md.ShowAsync();\n\
    \    dpv.ReportOperationCompleted(dpv.RequestedOperation);\n}\n```\n\n# Sharing\
    \ via the Share cham\n\nIn addition to the clipboard, Windows Store apps can take\
    \ advantage of mechanism to share data between apps: the Share cham. Unlike the\
    \ clipboard, which requires the user to switch to the target app to accept it\
    \ the shared data, the Share cham is designed to allow quick, contextual sharing\
    \ scenarios that the users want to complete without leaving the source app. The\
    \ Share cham allows the user to post a video link to a social network, add a link\
    \ to a reading list, email a web URL to a friend, and so on. It can also be used\
    \ to send a photo to a photo-editing app, making the editing app aware of the\
    \ photo. But then the user has to launch the photo-editing app explicitly to manipulate\
    \ the photo. This scenario would be better served by launching the photo-editing\
    \ app by way of a file type association or a protocol association (discussed in\
    \ the \"File type associations\" section in Chapter 5, \"Storage files and folders\"\
    ).\n\nFor developers, the Share-cham mechanism allows developers to focus on what\
    \ their app does best. Their source app doesn't have to know how to post entries\
    \ to a social network, how to maintain a reading list, or how to email something.\
    \ The target app knows how to do these things, and the user initiates the action\
    \ via the Share cham.\n\nThe basic Share-cham workflow goes like this:\n\n+  \
