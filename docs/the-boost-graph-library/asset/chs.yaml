  \ is (u,v) == (v,u) ? false\nweight[(u,v)] = 1.2\nweight[(v,u)] = 2.4\n```\n\n接下来是无向图的示例代码：\n\
  \n```cpp\ntemplate <typename UndirectedGraph> void undirected_graph_demo2()\n{\n\
  \n  const int V = 2;\n  UndirectedGraph undigraph(V);\n  typename graph_traits<UndirectedGraph>::vertex_descriptor\
  \ u, v;\n  typedef typename UndirectedGraph::edge_property_type Weight;\n  typename\
  \ property_map<UndirectedGraph, edge_weight_t>::type\n      weight = get(edge_weight,\
  \ undigraph);\n  typename graph_traits<UndirectedGraph>::edge_descriptor e1, e2;\n\
  \  bool found;\n\n  u = vertex(0, undigraph);\n  v = vertex(1, undigraph);\n  add_edge(u,\
