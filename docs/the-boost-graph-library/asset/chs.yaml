  }\n```\n\n输出结果：\n```\nin an undirected graph is (u,v) == (v,u) ? true\nweight[(u,v)]\
  \ = 3.1\nweight[(v,u)] = 3.1\n```\n\n### 12.1.2 图\n\n`Graph` 概念定义了所有图概念通用的关联类型。这些关联类型是在许多图操作中起辅助作用的辅助类型。与\
