  \  typedef typename DirectedGraph::edge_property_type Weight;\n  typename property_map<DirectedGraph,\
  \ edge_weight_t>::type\n      weight = get(edge_weight, digraph);\n  typename graph_traits<DirectedGraph>::edge_descriptor\
