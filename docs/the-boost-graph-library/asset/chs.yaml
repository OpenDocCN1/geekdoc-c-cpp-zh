  邻接迭代器类型。\n（AdjacencyGraph 要求。）\n\n### 成员函数\n\n`adjacency_list(const GraphProperties&\
  \ p)`\n默认构造函数。创建一个零顶点、零边的空图。\n（DefaultConstructible 要求。）\n\n`adjacency_list(vertices_size_type\
  \ n, const GraphProperties& p)`\n创建一个具有 `n` 个顶点的图。\n\n`adjacency_list(const adjacency_list&\
  \ other)`\n拷贝构造函数。\n（CopyConstructible 要求。）\n\n`adjacency_list& operator=(const\
  \ adjacency_list& other)`\n赋值运算符。将一个图的内容拷贝到另一个图。\n（Assignable 要求。）\n\n`adjacency_list(VertexIterator\
  \ begin, VertexIterator end, const GraphProperties& p)`\n从一组顶点构造图。\n\n`adjacency_list(EdgeIterator\
  \ begin, EdgeIterator end, const GraphProperties& p)`\n从一组边构造图。\n\n`adjacency_list(VertexIterator\
  \ v_begin, VertexIterator v_end, EdgeIterator e_begin, EdgeIterator e_end, const\
  \ GraphProperties& p)`\n从一组顶点和边构造图。\n\n`vertex_iterator vertices()`\n返回指向第一个顶点的迭代器。\n\
  （VertexListGraph 要求。）\n\n`edge_iterator edges()`\n返回指向第一边的迭代器。\n（EdgeListGraph 要求。）\n\
  \n`out_edge_iterator out_edges(VertexDescriptor v)`\n返回指向顶点 `v` 的第一个出边的迭代器。\n（IncidenceGraph\
  \ 要求。）\n\n`in_edge_iterator in_edges(VertexDescriptor v)`\n返回指向顶点 `v` 的第一个入边的迭代器。\n\
  （BidirectionalGraph 要求。）\n\n`adjacency_iterator adjacent_vertices(VertexDescriptor\
  \ v)`\n返回指向与顶点 `v` 相接的第一个顶点的迭代器。\n（AdjacencyGraph 要求。）\n\n`vertices_size_type vertices_size()`\n\
  返回图中顶点数。\n（VertexListGraph 要求。）\n\n`edges_size_type edges_size()`\n返回图中边数。\n（EdgeListGraph\
  \ 要求。）\n\n`degree_size_type degree(VertexDescriptor v)`\n返回顶点 `v` 的度。\n（IncidenceGraph\
  \ 要求。）\n\n`vertex_type add_vertex(const VertexProperties& p = {})`\n向图中添加一个顶点并返回其描述符。\n\
  \n`edge_type add_edge(VertexDescriptor u, VertexDescriptor v, const EdgeProperties&\
  \ p = {})`\n在 `u` 和 `v` 之间添加一条边并返回其描述符。\n\n`remove_vertex(VertexDescriptor v)`\n\
  删除顶点 `v` 及其所有的关联边。\n\n`remove_edge(EdgeDescriptor e)`\n删除边 `e`。\n\n`clear()`\n移除图中所有的顶点和边。\n\
  \n`has_vertex(VertexDescriptor v)`\n检查顶点 `v` 是否存在。\n\n`has_edge(EdgeDescriptor e)`\n\
  检查边 `e` 是否存在。\n\n`has_edge(VertexDescriptor u, VertexDescriptor v)`\n检查 `u` 和 `v`\
  \ 之间是否存在边。\n\n`clear_out_edges(VertexDescriptor v)`\n移除顶点 `v` 的所有出边。\n\n`clear_in_edges(VertexDescriptor\
  \ v)`\n移除顶点 `v` 的所有入边。\n\n`clear_edges(VertexDescriptor v)`\n移除与顶点 `v` 相关的所有边。\n\
  \n`vertex_properties(VertexDescriptor v)`\n返回顶点 `v` 的属性。\n\n`edge_properties(EdgeDescriptor\
  \ e)`\n返回边 `e` 的属性。\n\n`set_vertex_properties(VertexDescriptor v, const VertexProperties&\
  \ p)`\n更新顶点 `v` 的属性。\n\n`set_edge_properties(EdgeDescriptor e, const EdgeProperties&\
  \ p)`\n更新边 `e` 的属性。\n\n### 非成员函数\n\n`vertices(const adjacency_list& g)`\n返回图 `g`\
  \ 中所有顶点的迭代范围。\n\n`edges(const adjacency_list& g)`\n返回图 `g` 中所有边的迭代范围。\n\n`adjacent_vertices(VertexDescriptor\
  \ v, const adjacency_list& g)`\n返回图 `g` 中与 `v` 相接的顶点的迭代范围。\n\n`out_edges(VertexDescriptor\
  \ v, const adjacency_list& g)`\n返回图 `g` 中顶点 `v` 的出边的迭代范围。\n\n`in_edges(VertexDescriptor\
  \ v, const adjacency_list& g)`\n返回图 `g` 中顶点 `v` 的入边的迭代范围。\n\n`next(VertexIterator\
  \ it)`\n`next(EdgeIterator it)`\n`next(OutEdgeIterator it)`\n`next(InEdgeIterator\
  \ it)`\n`next(AdjacencyIterator it)`\n返回序列中的下一个迭代器。\n\n\n\n\n\n进入顶点 `u` 的边数。只有在为\
  \ `Directed` 模板参数指定了 `bidirectionalS` 时，此操作可用。\n\n（由 BidirectionalGraph 需要。）\n\n\
