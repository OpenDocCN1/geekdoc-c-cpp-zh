  white_color 常量, 56\n\nwho_owes_who 函数, 231\n\n## 脚注\n\n### 前言\n^(1) 我想感谢 John Wilkinson,\
  \ Mark Manasse, Marc Najork 和 Jeremy Siek 提供的许多宝贵建议。\n\n### 序\n^(2) LSC 自此以后演变为开放系统实验室\
  \ (OSL) [`www.osl.iu.edu`](http://www.osl.iu.edu)。尽管名称和地点发生了变化，但研究议程保持不变。\n\n###\
  \ 第 1 章\n^(1) 顶点（vertex）的常用名称是 `node`，边（edge）的另一个名称是 `arc`。\n\n^(2) 出于审美考虑，我们在声明模板参数时倾向于使用\
  \ `typename` 而不是等 `class`。\n\n### 第 2 章\n^(1) 当 `::` 作用域运算符左侧的类型某种程度上取决于模板参数时，在类型前面使用\
  \ `typename` 关键字。\n\n^(2) Koenig 查找是以发明者 Andrew Koenig 命名的。它有时被称为“依赖参数的查找”（argument\
  \ dependent lookup）。\n\n^(3) 这是 D&E [41] 中描述的惯用的泛化。\n\n### 第 3 章\n^(1) 如果有更多的 C++\
  \ 编译器符合标准，定义新的属性标签将简单得多。\n\n### 第 4 章\n^(1) 我们通泛地使用 `actor` 一词来指代男、女演员。\n\n^(2)\
  \ 弗吉尼亚大学计算机系使用互联网电影数据库为他们的“培根神谕”项目提供图数据。\n\n### 第 5 章\n^(1) 对于具有可用版本 `std::iterator_traits`\
  \ 的编译器，`edge_list` 的值类型和差异类型模板参数是不必要的，因为已经提供了正确的默认参数。\n\n### 第 10 章\n^(1) 某些如 Visual\
  \ C++ 6.0 等不符合标准的编译器不支持部分特化。在这种情况下，为了访问关联类型，必须针对特定的顶点和边类型对 traits 类进行完全特化。或者，可以使用一个包含\
  \ LEDA 图和所需嵌套定义的包装类。\n\n### 第 13 章\n^(1) 这里使用的算法通过不一次性将所有 `V` – `S` 顶点放入优先级队列来节省空间，而是只将那些已发现且因此距离小于无穷大的\
  \ `V` – `S` 顶点放入其中。\n\n^(2) 事实上，BGL 的 Prim 算法实现仅仅是调用 Dijkstra 算法，并为 `distance_compare()`\
  \ 和 `distance_combine()` 参数传递了特定的参数。\n\n### 第 14 章\n^(1) 前提是你所使用的 STL 实现实现了 `std::slist`。\n\
  \n^(2) 前提是你所使用的 STL 实现实现了 `std::hash_set`。SGI STL 是此类实现的一个示例。\n\n### 第 15 章\n^(1)\
  \ 在之前描述 BGL 的论文中，属性访问器概念（property accessor concept）被命名为装饰器（Decorator）。在 Dietmar\
  \ Kühl 的硕士论文 [24] 中，属性访问器被称为数据访问器（data accessors）。\n\n"
