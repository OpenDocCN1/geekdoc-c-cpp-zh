  \ 访问者概念\n\n访问者概念（visitor concepts）在 BGL 中的作用类似于函数对象在 STL 中的作用。函数对象提供了一种扩展算法的机制——用于自定义算法每一步所执行的操作。访问者允许用户在图算法的不同步骤插入自己的操作。与\
  \ STL 算法不同，图算法通常有多个事件点，用户可能希望通过函数对象插入回调。因此，访问者没有像函数对象那样单一的 `operator()` 方法，而是有多个对应于事件点的方法。每个算法都有不同的事件点。在本节中，我们为主要的\
  \ BGL 算法定义了访问者概念。\n\n与 STL 中的函数对象一样，访问者在 BGL 算法是通过值传递的。这意味着在访问者对象中存储状态时必须小心。\n\n\
