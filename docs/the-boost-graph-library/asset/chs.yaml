  \ long,\n            property<edge_residual_capacity_t, long,\n                property<edge_reverse_t,\
  \ Traits::edge_descriptor> > >\n    > Graph;\n    Graph g;\n    property_map<Graph,\
  \ edge_capacity_t>::type\n        capacity = get(edge_capacity, g);\n    property_map<Graph,\
  \ edge_residual_capacity_t>::type\n        residual_capacity = get(edge_residual_capacity,\
  \ g);\n    property_map<Graph, edge_reverse_t>::type\n        rev = get(edge_reverse,\
  \ g);\n    Traits::vertex_descriptor s, t;\n    read_dimacs_max_flow(g, capacity,\
  \ rev, s, t);\n    long flow = push_relabel_max_flow(g, s, t);\n    std::cout <<\
  \ \"c The total_flow:\" << std::endl;\n    std::cout << \"s \" << flow << std::endl;\n\
