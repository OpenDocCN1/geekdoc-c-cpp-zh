  \ g); ei != e_end; ++ei) {\n            if (capacity[ei] > 0)\n                std::cout\
  \ << \"f \" << i << \" \" << target(ei, g) << \" \"\n                    << (capacity[ei]\
  \ - residual_capacity[ei]) << std::endl;\n        }\n    }\n}\n```\n输出：\n```\nc\
