  \ 7 章 连接通分量\n\n关于网络的一个基本问题是哪些顶点之间是可以相互到达的。例如，一个设计良好的网站在网页之间应该有足够的链接，使得所有页面都能从首页访问。此外，如果有返回首页的链接，或者至少是返回序列中的上一个页面会更好。在有图中，相互可达的顶点组称为*强连通分量*。在无向图中，相互可达的顶点组称为*连通分量*。\n\
  \n对 2 亿个网页的研究显示，互联网上的 5600 万个网页形成了一个大的强连通分量 [7]。研究还显示，当视为无向图时，有一个包含 1.5 亿页的大型连通分量，约有\
  \ 5000 万页与该大分量断开（它们存在于自身更小的连通分量中）。\n\n\n\n\n\nBGL 提供了两个用于计算图的所有连通分量的函数：一个用于图不变的情况（或仅需计算一次连通分量的情况），另一个用于图不断增长的情况。BGL\
  \ 还实现了 Tarjan 算法，用于线性时间内计算图的强连通分量。\n\n在接下来的章节中，我们首先从一些定义开始，然后将 BGL 连通分量函数应用于万维网网络。\n\
  \n## 7.1 定义\n\n`path`（路径）是一个顶点的序列，其中每个顶点与路径中的下一个顶点之间都有边连接。如果从顶点 `u` 到 `w` 存在路径，则我们说顶点\
  \ `w` 对于顶点 `u` 是`reachable`的（可达的）。`connected component`（连通分量）是无向图中一组相互可达的顶点。`strongly\
  \ connected component`（强连通分量）是有向图中一组互为可达的顶点。无向图的可达关系和有向图的互可达关系都是`等价关系`（equivalence\
  \ relations）：它们具有自反性、对称性和传递性。满足等价关系的对象构成一个`等价类`（equivalence class）。因此，连通分量是可达关系的一个等价类，同样，强连通分量也是互可达关系的一个等价类。结果，这两种可达关系将图的顶点划分成互不交的子集。\n\
  \n## 7.2 连通分量与网络连接\n\n计算无向图的连通分量是深度优先搜索的应用。其思想是在图上运行 DFS，并将同一 DFS 树中的所有顶点标记为同一个连通分量。BGL\
  \ 的 `connected_components()` 实现调用了 `depth_first_search()` 并传入一个特殊的访问对象，该对象为每个发现的顶点标记当前分量标签，并在“起始顶点”事件点增加当前分量的计数。\n\
  \n计算图 7.1 所示网络连通分量的步骤如下：(1) 将网络读入内存，(2) 使用 BGL 图表示它，(3) 调用 `connected_components()`\
  \ 函数。图中的每个顶点都被分配一个整数，表示该顶点所属的分量。以下是程序的大纲。\n\n**图 7.1. 一组互联网路由器，边表示直接连接。**\n\n![image](img/07fig01.jpg)\n\
