  \  // 计算割边的正向边\n  return c;\n}\n```\n\n实现的第一个部分创建了一些类型定义，以便为访问图性性（graph traits）中的类型提供更短的名称。根据输入的无向图\
  \ `g` 创建了一个网络流图（一种有向图），因此使用了 `adjacency_list` 图类。\n\n### 类型定义\n```cpp\ntypedef typename\
  \ graph_traits<VertexListGraph>::vertex_descriptor vertex_descriptor;\ntypedef typename\
  \ graph_traits<VertexListGraph>::degree_size_type degree_size_type;\ntypedef color_traits<default_color_type>\
  \ Color;\ntypedef typename adjacency_list_traits<vecS, vecS, directedS>::edge_descriptor\
  \ edge_descriptor;\ntypedef adjacency_list<vecS, vecS, directedS, no_property,\n\
  \  property<edge_capacity_t, degree_size_type,\n    property<edge_residual_capacity_t,\
  \ degree_size_type,\n      property<edge_reverse_t, edge_descriptor> > > > FlowGraph;\n\
  ```\n\n我们使用 `std::set` 来处理集合 `S` 和 `S` 的邻居，因为必须确保插入时的唯一性。集合 `S` 和 `S` 的非邻居使用 `std::vector`\
  \ 表示，因为我们预先知道插入的元素是唯一的。\n\n### 变量声明\n```cpp\nvertex_descriptor u, v, p, k;\nedge_descriptor\
  \ e1, e2;\nbool inserted;\ntypename graph_traits<VertexListGraph>::vertex_iterator\
  \ vi, vi_end;\ndegree_size_type delta, alpha_star, alpha_S_k;\nstd::set<vertex_descriptor>\
  \ S, neighbor_S;\nstd::vector<vertex_descriptor> S_star, nonneighbor_S;\nstd::vector<default_color_type>\
  \ color(num_vertices(g));\nstd::vector<edge_descriptor> pred(num_vertices(g));\n\
  ```\n\n网络流图基于输入图构建。流图中的每条边都有三个属性——容量、剩余容量和反向边——分别通过属性映射对象 `cap`、`res_cap` 和 `rev_edge`\
  \ 访问。\n\n### 从无向图创建一个网络流图\n```cpp\nFlowGraph flow_g(num_vertices(g));\ntypename\
  \ property_map<FlowGraph, edge_capacity_t>::type cap = get(edge_capacity, flow_g);\n\
  typename property_map<FlowGraph, edge_residual_capacity_t>::type res_cap = get(edge_residual_capacity,\
  \ flow_g);\ntypename property_map<FlowGraph, edge_reverse_t> ::type rev_edge = get(edge_reverse,\
  \ flow_g);\n\ntypename graph_traits<VertexListGraph>::edge_iterator ei, ei_end;\n\
  for (tie(ei, ei_end) = edges(g); ei != ei_end; ++ei) {\n  u = source(*ei, g), v\
  \ = target(*ei, g);\n  tie(e1, inserted) = add_edge(u, v, flow_g);\n  cap[e1] =\
  \ 1;\n  tie(e2, inserted) = add_edge(v, u, flow_g);\n  cap[e2] = 1;\n  rev_edge[e1]\
  \ = e2;\n  rev_edge[e2] = e1;\n}\n```\n\n在主算法中，若干功能被被分为独立的函数。第一个是寻找最小度顶点，通过遍历所有顶点并比较它们的度来实现。\n\
  \n### 寻找最小度顶点\n```cpp\ntemplate <typename Graph>\nstd::pair<typename graph_traits<Graph>::vertex_descriptor,\
  \ typename graph_traits<Graph>::degree_size_type>\nmin_degree_vertex(Graph& g) {\n\
  \  typename graph_traits<Graph>::vertex_descriptor p;\n  typedef typename graph_traits<Graph>::degree_size_type\
  \ size_type;\n  size_type delta = std::numeric_limits<size_type>::max();\n  typename\
  \ graph_traits<Graph>::vertex_iterator i, iend;\n  for (tie(i, iend) = vertices(g);\
  \ i != iend; ++i) {\n    if (degree(*i, g) < delta) {\n      delta = degree(*i,\
  \ g);\n      p = *i;\n    }\n  }\n  return std::make_pair(p, delta);\n}\n```\n\n\
  我们还需要将每个顶点（以及一组顶点）的所有邻居插入到集合中的能力，这可以通过检查 `adjacent_vertices()` 实现。我们假设输出迭代器类似于 `std::set`\
  \ 的 `std::insert_iterator`。\n\n### 输出邻居辅助函数\n```cpp\ntemplate <typename Graph, typename\
  \ OutputIterator>\nvoid neighbors(const Graph& g, typename graph_traits<Graph>::vertex_descriptor\
  \ u, OutputIterator result) {\n  typename graph_traits<Graph>::adjacency_iterator\
  \ ai, aend;\n  for (tie(ai, aend) = adjacent_vertices(u, g); ai != aend; ++ai) {\n\
  \    *result++ = *ai;\n  }\n}\n\ntemplate <typename Graph, typename VertexIterator,\
  \ typename OutputIterator>\nvoid neighbors(const Graph& g, VertexIterator first,\
  \ VertexIterator last, OutputIterator result) {\n  for (; first != last; ++first)\
  \ {\n    neighbors(g, *first, result);\n  }\n}\n```\n\n算法的初始步骤是寻找最小度顶点 `p`，设置 `S`，然后计算\
  \ `S` 的邻居和非邻居。我们使用 `std::set_difference` 计算 `V - S`（其中 `V` 是顶点集合）。\n\n### 寻找最小度顶点并计算\
  \ S 的邻居和非邻居\n```cpp\ntie(p, delta) = min_degree_vertex(g);\nS_star.push_back(p);\n\
  alpha_star = delta;\nS.insert(p);\nneighbor_S.insert(p);\nneighbors(g, S.begin(),\
  \ S.end(), std::inserter(neighbor_S, neighbor_S.begin()));\nstd::set_difference(vertices(g).first,\
  \ vertices(g).second, neighbor_S.begin(), neighbor_S.end(), std::back_inserter(nonneighbor_S));\n\
  ```\n\n算法的迭代部分在 `nonneighbor_S` 为空时结束。在循环中，使用 Edmonds-Karp 算法计算 `p` 与非邻居 `k` 之间的最大流。在流算法期间标记（非白色）的顶点对应于割的一侧。因此，如果割的大小是目前最小的，则将标记顶点记录在\
  \ `S*` 中，将 `k` 插入 `S`，并重新计算 `S` 的邻居和非邻居。\n\n### 主循环\n```cpp\nwhile (!nonneighbor_S.empty())\
  \ {\n  k = nonneighbor_S.front();\n  alpha_S_k = edmunds_karp_max_flow(\n    flow_g,\
  \ p, k, capacity_map(cap).residual_capacity_map(res_cap),\n    reverse_edge_map(rev_edge).color_map(&color[0]).predecessor_map(&pred[0]));\n\
  \  if (alpha_S_k < alpha_star) {\n    alpha_star = alpha_S_k;\n    S_star.clear();\n\
  \    for (tie(vi, vi_end) = vertices(flow_g); vi != vi_end; ++vi) {\n      if (color[*vi]\
  \ != Color::white()) {\n        S_star.push_back(*vi);\n      }\n    }\n  }\n  S.insert(k);\n\
  \  neighbor_S.insert(k);\n  neighbors(g, k, std::inserter(neighbor_S, neighbor_S.begin()));\n\
  \  nonneighbor_S.clear();\n  std::set_difference(vertices(g).first, vertices(g).second,\
  \ neighbor_S.begin(), neighbor_S.end(), std::back_inserter(nonneighbor_S));\n}\n\
  ```\n\n\n\n最后一步是找到割中的边，这些边是指一个顶点在 `S` 中而另一个顶点在 ![image](img/s-bar-star.jpg) 中的边。这些边被写入名为\
  \ `disconnecting_set` 的输出迭代器，并返回割中边的数量。\n\n![image](img/open.jpg)计算割的入向边 ![image](img/106fig01.jpg)\
  \ 110b![image](img/close.jpg) ≡\n\n```cpp\nstd::vector<bool> in_S_star(num_vertices(g),\
  \ false);\n\ntypename std::vector<vertex_descriptor>::iterator si;\n\nfor (si =\
  \ S_star.begin(); si != S_star.end(); ++si)\n  in_S_star[*si] = true;\n\ndegree_size_type\
  \ c = 0;\nfor (si = S_star.begin(); si != S_star.end(); ++si) {\n  typename graph_traits<VertexListGraph>::out_edge_iterator\
  \ ei, ei_end;\n  for (tie(ei, ei_end) = out_edges(*si, g); ei != ei_end; ++ei)\n\
  \    if (!in_S_star[target(*ei, g)]) {\n      *disconnecting_set++ = *ei;\n    \
  \  ++c;\n    }\n}\n```\n\n图 8.1 显示应用边连通性算法的示例图。\n\n**图 8.1 边连通性的示例图。**\n\n![image](img/08fig01.jpg)\n\
  \n![image](img/open.jpg)edge-connectivity.cpp 111![image](img/close.jpg) ≡\n\n```cpp\n\
  #include <algorithm>\n#include <utility>\n#include <boost/graph/edmunds_karp_max_flow.hpp>\n\
  #include <boost/graph/push_relabel_max_flow.hpp>\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/graphviz.hpp>\nnamespace boost {\n  ![image](img/open.jpg)寻找最小度顶点函数\
  \ 108b![image](img/close.jpg)\n  ![image](img/open.jpg)输出邻居辅助函数 109a![image](img/close.jpg)\n\
  \  ![image](img/open.jpg)边连通性算法 107a![image](img/close.jpg)\n}\nint main()\n{\n\
  \  using namespace boost;\n  GraphvizGraph g;\n  read_graphviz(\"figs/edge-connectivity.dot\"\
  , g);\n  typedef graph_traits<GraphvizGraph>::edge_descriptor edge_descriptor;\n\
  \  typedef graph_traits<GraphvizGraph>::degree_size_type degree_size_type;\n  std::vector<edge_descriptor>\
  \ disconnecting_set;\n  degree_size_type c = edge_connectivity(g, std::back_inserter(disconnecting_set));\n\
  \  std::cout << \"The edge connectivity is \" << c << \".\" << std::endl;\n  property_map<GraphvizGraph,\
  \ vertex_attribute_t>::type\n      attr_map = get(vertex_attribute, g);\n  std::cout\
  \ << \"The disconnecting set is {\";\n  for (std::vector<edge_descriptor>::iterator\
  \ i = disconnecting_set.begin();\n       i != disconnecting_set.end(); ++i)\n  \
  \  std::cout << \"(\" << attr_map[source(*i, g)][\"label\"] << \",\"\n      << attr_map[target(*i,\
  \ g)][\"label\"] << \") \";\n  std::cout << \"}.\" << std::endl;\n  return EXIT_SUCCESS;\n\
  }\n```\n\n示例程序的输出如下：\n边连通性为 2。\n割割集为 {(D,E) (D,H) }。\n\n# 第 9 章 隐式图：骑士巡游\n\n骑士巡游问题如下：为骑士找到一条路径，恰好访问一次\
  \ $n \\times n$ 棋盘上的所有格子。骑士巡游是哈密顿路径（Hamiltonian path）的一个例子——即通过图中每个顶点的简单路径（其中棋盘上的每个格子被视为一个顶点）。图的边由骑士跳跃的模式决定（例如向上两格再向一格）。在本节中，我们使用通用的回溯算法来寻找骑士巡游。回溯算法是暴力的且速度非常慢，我们还展示了使用\
  \ Warnsdorff 启发式算法的改进。哈密顿路径问题是 NP 完全困难的（对于较大规模的问题，无法在合理的时间内解决）。普通 $8 \\times 8$\
  \ 棋盘上的骑士巡游示例见图 9.1。\n\n**图 9.1 骑士巡游的示例。**\n\n![image](img/09fig01.jpg)\n\n该示例的一个独特之处在于，它没有使用显式的数据结构（如\
  \ `adjacency_list` 类）来表示图。相反，它根据骑士在棋盘上允许的移动推导出一个隐式图结构 `knights_tour_graph`。\n\n\
  ## 9.1 骑士跳跃作为图\n\n`knights_tour_graph` 是 `AdjacencyGraph` 的模型，因此我们需要实现一个 `adjacent_vertices()`\
  \ 函数，返回一对相邻迭代器。`knights_tour_graph` 是根据棋盘上骑士允许的移动推导出的隐式图结构。`adjacent_vertices()`\
  \ 函数需要实现一个返回相邻迭代器对的函数。\n\n```cpp\ntypedef std::pair<int, int> Position;\nPosition\
  \ knight_jumps[8] = {\n  {2, 1}, {1, 2}, {-1, 2}, {-2, 1},\n  {-2, -1}, {-1, -2},\
  \ {1, -2}, {2, -1}\n};\n```\n\n`knights_tour_graph` 是 `AdjacencyGraph` 的模型，因此我们需要实现一个\
  \ `adjacent_vertices()` 函数，返回一对相邻迭代器。`adjacent_vertices()` 函数需要实现一个返回相邻迭代器对的函数。\n\
  \n```cpp\nstruct knight_adjacency_iterator\n  : public boost::forward_iterator_helper<\n\
  \    knight_adjacency_iterator, Position, std::ptrdiff_t, Position*>\n{\n  knight_adjacency_iterator()\
  \ { }\n  knight_adjacency_iterator(int ii, Position p, const knights_tour_graph&\
  \ g)\n  : m_pos(p), m_g(&g), m_i(ii) { valid_position(); }\n  Position operator*()\
  \ { return m_pos + knight_jumps[m_i]; }\n  void operator++() { ++m_i; valid_position();\
  \ }\n  bool operator==(const knight_adjacency_iterator& x) const { return m_i ==\
  \ x.m_i; }\n\nprotected:\n  void valid_position();\n  Position m_pos;\n  const knights_tour_graph*\
  \ m_g;\n  int m_i;\n};\n```\n\n```cpp\nvoid knight_adjacency_iterator::valid_position()\
  \ {\n  Position new_pos = m_pos + knight_jumps[m_i];\n  while (m_i < 8 && (new_pos.first\
  \ < 0 || new_pos.second < 0\n      new_pos.first >= m_g->m_board_size\n      | new_pos.second\
  \ >= m_g->m_board_size)) {\n    ++m_i;\n    new_pos = m_pos + knight_jumps[m_i];\n\
  \  }\n}\n```\n\n```cpp\nstd::pair<knights_tour_graph::adjacency_iterator, knights_tour_graph::adjacency_iterator>\n\
  adjacent_vertices(knights_tour_graph::vertex_descriptor v, const knights_tour_graph&\
  \ g) {\n  typedef knights_tour_graph::adjacency_iterator Iter;\n  return std::make_pair(Iter(0,\
  \ v, g), Iter(8, v, g));\n}\n```\n\n`knights_tour_graph` 类只包含棋盘的大小（存储为数据成员）以及 `AdjacencyGraph`\
  \ 所需的类型定义。`num_vertices()` 函数返回棋盘上的格子数量。\n\nstruct knights_tour_graph\n\n{\n\n\n\
  \n\n\n```cpp\ntypedef Position vertex_descriptor;\ntypedef std::pair<vertex_descriptor,\
  \ vertex_descriptor> edge_descriptor;\ntypedef knight_adjacency_iterator adjacency_iterator;\n\
  typedef void out_edge_iterator;\ntypedef void in_edge_iterator;\ntypedef void edge_iterator;\n\
  typedef void vertex_iterator;\ntypedef int degree_size_type;\ntypedef int vertices_size_type;\n\
  typedef int edges_size_type;\ntypedef directed_tag directed_category;\ntypedef disallow_parallel_edge_tag\
  \ edge_parallel_category;\ntypedef adjacency_graph_tag traversal_category;\nknights_tour_graph(int\
  \ n) : m_board_size(n) { }\nint m_board_size;\n};\n\nint num_vertices(const knights_tour_graph&\
  \ g) { return g.m_board_size * g.m_board_size; }\n```\n\n既然骑士的移动已经映射到 Boost 图接口上，我们就可以查看一些可以解决骑士巡游问题的图算法了。\n\
  \n## 9.2 回溯图搜索\n\n回溯图搜索的思想与深度优先搜索相似，它们都会探索路径直到遇到死胡同。回溯图搜索的不同之处在于，在遇到死胡同后，算法会回溯并取消死胡同路径的标记，然后沿着不同的路径继续。在下面的代码中，回溯搜索使用栈（而不是递归方法）实现，并使用属性映射（property\
  \ map）记录每个顶点的发现时间。栈中包含了时间戳-顶点的对，以便在从死胡同回溯后能够获得正确的时间戳。一旦所有顶点都已访问，或者所有可能的路径都已耗尽，搜索即完成。\n\
  \n尽管上一节中定义的图是隐式的（特别地代表了棋盘上骑士的移动），但它仍然模拟了一个 BGL 图。因此，回溯算法是针对 `Graph` 实现的，而不仅仅是针对\
  \ `knights_tour_graph`。生成的算法可以复用于任何建模 `Graph` 的图数据结构。\n\n```cpp\ntemplate <typename\
  \ Graph, typename TimePropertyMap>\nbool backtracking_search(Graph& g,\n    typename\
  \ graph_traits<Graph>::vertex_descriptor src, TimePropertyMap time_map)\n{\n   \
  \ // 创建栈并初始化时间戳 116\n    S.push(std::make_pair(time_stamp, src));\n    while (!S.empty())\
  \ {\n        // 从栈顶获取顶点，记录时间，并检查是否完成 117a\n        // 将所有相邻顶点推入栈 117b\n        //\
  \ 如果处于死胡同，回滚 117c\n    } // while (!S.empty())\n    return false;\n}\n```\n\n使用\
  \ `std::stack` 来记录需要探索的顶点。顶点推入栈的时间戳也被记录了。\n\n```cpp\n// 创建栈并初始化时间戳 116\ntypedef\
  \ typename graph_traits<Graph>::vertex_descriptor Vertex;\ntypedef std::pair<int,\
  \ Vertex> P;\nstd::stack<P> S;\nint time_stamp = 0;\n```\n\n下一步是记录栈顶顶点的时间戳，并检查图中的所有顶点是否已记录，从而判断算法是否结束。\n\
  \n```cpp\n// 从栈顶获取顶点，记录时间，并检查是否完成 117a\nVertex x;\ntie(time_stamp, x) = S.top ();\n\
  put(time_map, x, time_stamp);\n// 所有顶点都已访问，成功！\nif (time_stamp == num_vertices(g)\
  \ - 1)\n  return true;\n```\n\n现在扫描所有相邻顶点，如果相邻顶点尚未被访问，则将其加入栈。没有可用的相邻顶点则表示遇到了死胡同。\n\
  \n```cpp\n// 将所有相邻顶点推入栈 117b\nbool deadend = true;\ntypename graph_traits<Graph>::adjacency_iterator\
  \ i, end;\nfor (tie(i, end) = adjacent_vertices(x, g); i != end; ++i)\n  if (get(time_map,\
  \ *i) == -1) {\n    S.push(std::make_pair(time_stamp + 1, *i));\n    deadend = false;\n\
  \  }\n```\n\n如果算法到达死胡同，则从栈中弹出顶点，直到找到一个尚未探索的顶点为止。当我们回溯时，每个顶点的时间戳都会被重置，因为这些顶点可能通过更好的路径到达。\n\
  \n```cpp\n// 如果处于死胡同，回滚 117c\nif (deadend) {\n  put(time_map, x, -1);\n  S.pop();\n\
  \  tie(time_stamp, x) = S.top();\n  while (get(time_map, x) != -1) { // 回溯到上顶点\n\
  \    put(time_map, x, -1);\n    S.pop();\n    tie(time_stamp, x) = S.top();\n  }\n\
  }\n```\n\n## 9.3 Warnsdorff 启发式\n\nWarnsdorff 选择下一次跳跃位置的启发式是预瞻每一个可能的跳跃，并查看从该格子可以进行多少跳跃。我们称之为*后继数*（number\
  \ of successors）。选择后继数最少的格子作为下一步移动。这种启发式之所以有效，是因为它优先访问受限制最多的顶点，从而避免了某些潜在的终点。下面的函数计算一个顶点的后继数。\n\
  \n```cpp\ntemplate <typename Vertex, typename Graph, typename TimePropertyMap>\n\
  int number_of_successors(Vertex x, Graph& g, TimePropertyMap time_map) {\n  int\
  \ s_x = 0;\n  typename graph_traits<Graph>::adjacency_iterator i, end;\n  for (tie(i,\
  \ end) = adjacent_vertices(x, g); i != end; ++i)\n    if (get(time_map, *i) == -1)\n\
  \      ++s_x;\n  return s_x;\n}\n```\n\n为了实现这种算法，我们从回溯算法开始，但不是将相邻顶点推入栈，而是首先根据后继数对它们进行排序。排序通过将相邻顶点放入队列来实现。一旦所有相邻顶点都在队列中，就将它们弹出并推入栈。队列为空意味着死胡同。\n\
  \n```cpp\ntemplate <typename Graph, typename TimePropertyMap>\nbool warnsdorff (Graph&\
  \ g, typename graph_traits<Graph>::vertex_descriptor src,\n    TimePropertyMap time_map)\n\
  {\n  // 创建栈并初始化时间戳 116\n  S.push(std::make_pair(time_stamp, src));\n  while (!S.empty())\
  \ {\n    // 从栈顶获取顶点，记录时间，并检查是否完成 117a\n    // 将相邻顶点放入局部优先队列\n    std::priority_queue<P,\
  \ std::vector<P>, compare_first> Q;\n    typename graph_traits<Graph>::adjacency_iterator\
  \ i, end;\n    int num_succ;\n    for (tie(i, end) = adjacent_vertices(x, g); i\
  \ != end; ++i)\n      if (get(time_map, *i) == -1) {\n        num_succ = number_of_successors(*i,\
  \ g, time_map);\n        Q.push(std::make_pair(num_succ, *i));\n      }\n    bool\
  \ deadend = Q.empty();\n    // 将局部优先队列中的顶点移动栈\n    for (; !Q.empty(); Q.pop()) {\n\
  \      tie(num_succ, x) = Q.top();\n      S.push(std::make_pair(time_stamp + 1,\
  \ x));\n    }\n    // 如果处于死胡同，回滚 117c\n  } // while (!S.empty())\n  return false;\n\
  }\n```\n\n# 第 10 章 与其他图库接口\n\n尽管 BGL 的主要目标是辅助新应用程序和图算法的开发，但有很多现有代码可以从使用 BGL 算法中受益。与现有图数据结构配合\
  \ BGL 算法的一种方法是将数据从旧图格式复制到 BGL 图中，然后使用 BGL 算法。这种方法的问题在于，执行这种复制可能不方便且开销很大。另一种方法是通过为现有数据结构封装一个\
  \ BGL 接口来直接使用它。\n\n\n\n\n\n适配器模式 [14] 是为现有类提供新接口的一种机制。这种方法通常要求将被适配的对象包含在一个提供所需接口的新类中。在为\
  \ BGL（骨架图库）封装图时，不需要这种包含关系，因为 BGL 图接口完全由自由函数（全局非成员函数）组成。对于这种接口，适配一个接口不需要创建一个新的图类，只需要对构成该接口的自由函数进行重载即可。在\
  \ §10.3 中，我们将详细展示这种工作机制是如何运作的。\n\nBGL 包含了针对 LEDA [29] `GRAPH` 类型、Stanford GraphBase\
  \ [22] `Graph*` 类型的重载，以及针对 STL `std::vector` 的重载。LEDA 是一种流行的用于组合计算的面向对象库，包含了图数据结构和算法。由\
  \ Donald Knuth 编写的 Stanford GraphBase 是一系列图数据集、图生成器以及在这些图上运行图算法的程序。\n\n在接下来的章节中，我们将展示如何使用\
  \ BGL 算法结合 LEDA 和 SGB 图数据结构。然后，我们将查看针对 LEDA 图的 BGL 适配函数的实现，并提供如何为其他图库实现适配器的示例。\n\
  \n在 §1.4.1 中，我们通过将 `topological_sort()` 同时应用于由列表向量表示的图 `std::vector<std::list<int>>`\
  \ 以及一个由 `boost::adjacency_list` 表示的图，展示了 BGL 算法的灵活性。我们将在后续两个章节中继续该示例——调度一组相互依赖的任务——首先使用\
  \ LEDA 的 `GRAPH` 类型，然后使用 Stanford GraphBase (SGB) `Graph` 类型。\n\n## 10.1 结合 LEDA\
  \ 图使用 BGL 拓扑排序\n\n头文件 `boost/graph/leda_graph.hpp` 包含了函数重载，这些函数将 LEDA 参数化的 `GRAPH`\
  \ 类型适配到 BGL 接口。针对 LEDA `GRAPH` 的 BGL 接口记录在 §14.3.5 中。LEDA–BGL 接口使用 LEDA 版本 4.1 进行测试，这是\
  \ LEDA 最后免费版本之一。除了包含 `leda_graph.hpp` 头文件外，你必须安装 LEDA，设置编译器的包含路径和库路径，并链接 LEDA 库。详情请参\
  \ LEDA 文档。\n\n以下是任务调度程序的大纲，这次使用 LEDA `GRAPH` 来表示任务依赖关系。\n\n![image](img/open.jpg)topo-sort-with-leda.cpp\
  \ 120a![image](img/close.jpg) ≡\n\n```cpp\n#include <vector>\n#include <string>\n\
  #include <iostream>\n#include <boost/graph/topological_sort.hpp>\n#include <boost/graph/leda_graph.hpp>\n\
  \n// 取消与 C++ 标准库冲突的 LEDA 宏。\n#undef string\n#undef vector\n\nint main()\n{\n   \
  \ using namespace boost;\n    ![image](img/open.jpg)创建一个以任务 120b 标记顶点的 LEDA 图![image](img/close.jpg)\n\
  \    ![image](img/open.jpg)向 LEDA 图添加边 121a![image](img/close.jpg)\n    ![image](img/open.jpg)对\
  \ LEDA 图执行拓扑排序 121b![image](img/close.jpg)\n    return EXIT_SUCCESS;\n}\n```\n\n\
  LEDA `GRAPH` 类允许用户将对象附加到图的顶点和边上，因此在这里我们将任务名称（`std::string` 形式）附加到顶点上。我们使用常用的 BGL\
  \ `add_vertex()` 函数向 `leda_g` 添加顶点，并将任务名称作为要附加到顶点的属性对象传入。我们将 `add_vertex()` 返回的顶点描述符存储在\
  \ `vector` 中，以便在添加边时能够快速访问任何顶点。\n\n![image](img/open.jpg)创建一个以任务 120b 标记顶点的 LEDA\
  \ 图![image](img/close.jpg) ≡\n\n```cpp\ntypedef GRAPH<std::string, char> graph_t;\n\
  graph_t leda_g;\ntypedef graph_traits<graph_t>::vertex_descriptor vertex_t;\nstd::vector<vertex_t>\
  \ vert(7);\nvert[0] = add_vertex(std::string(\"pick up kids from school\"));\nvert[1]\
  \ = add_vertex(std::string(\"buy groceries\"));\nvert[2] = add_vertex(std::string(\"\
  get cash at ATM\"));\nvert[3] = add_vertex(std::string(\"drop off kids at practice\"\
  ));\nvert[4] = add_vertex(std::string(\"cook dinner\"));\nvert[5] = add_vertex(std::string(\"\
  eat\"));\nvert[6] = add_vertex(std::string(\"dinner\"));\n```\n\n下一步是添加边。我们再次使用\
  \ BGL 函数![image](img/open.jpg)向 LEDA 图添加边 121a![image](img/close.jpg) ≡\n\n```cpp\n\
  // (基于上下文的添加边的实现)\n```\n\n现在我们有了图，可以调用 `topological_sort()`。我们再次使用 LEDA 的 `node_array`\
  \ 来标记顶点。在 `boost/graph/leda_graph.hpp` 中定义的 `make_leda_property_map` 函数创建了一个满足 `PropertyMap`\
  \ Concept 的适配器。\n\n![image](img/open.jpg)对 LEDA 图执行拓扑排序 121b![image](img/close.jpg)\
  \ ≡\n\n```cpp\nstd::vector<vertex_t> topo_order;\nnode_array<color_type> color_array(leda_g);\n\
  topological_sort(leda_g, std::back_inserter(topo_order), make_leda_property_map(color_array));\n\
  std::reverse(topo_order.begin(), topo_order.end());\nfor (std::vector<vertex_t>::iterator\
  \ i = topo_order.begin(), n = 1; i != topo_order.end(); ++i, ++n)\n    std::cout\
  \ << n << \": \" << leda_g[*i] << std::endl;\n```\n\n## 10.2 结合 SGB 图使用 BGL 拓扑排序\n\
  \nSGB 定义了一个实现邻接列表风格数据结构的 `Graph` 结构体。`boost/graph/stanford_graph.hpp` 中的重载函数将 SGB\
  \ `Graph` 结构体适配到 BGL 接口。除了包含 `stanford_graph.hpp` 头外，你必须安装 Stanford GraphBase，并应用\
  \ SGB 分发包中的 PROTOTPES 修改文件。这是因为原始 SGB 头文件没有定义函数的 ANSI 标准原型，而 C++ 编译器需要这些。编译使用 SGB–BGL\
