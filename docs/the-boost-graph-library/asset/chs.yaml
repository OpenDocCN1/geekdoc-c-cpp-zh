  \n### 有效表达式\n\n![image](img/t0162-01.jpg)\n\n# 第 13 章 BGL 算法\n\n## 13.1 概述\n\n本章提供了关于如何使用\
  \ Boost Graph Library 中所有图算法的深度信息。\n\nBGL 泛型算法被分为以下几类：\n\n\n\n1. 基础搜索算法\n2. 短路路径\n\
  3. 最小生成树\n4. 连分量\n5. 最大流\n6. 顶点排序\n\n所有的算法都以函数模板的形式实现，其中图类型是一个模板参数。这使得函数可以使用任何符合所需概念的图类型。算法的文档列出了所需的概念，而每个图类的文档则列出了它实现的概念。通过交叉引用概念可以确定哪些图类型可以使用哪些算法。此外，算法有时会对属性映射建模，例如最短路径算法的距离映射。参数化的属性映射允许用户控制属性的存储和检索。算法还对访问者类型建模，允许用户指定在特定事件点调用的回调。\n\
  \n#### 原型\n\n每个算法的引用部分从函数原型开始。模板参数名称暗示了参数的用途，有时暗示了对参数的概念。然而，每个模板参数的精确要求在参数部分给出。\n\
  \n许多函数的最后一个参数是 `bgl_named_params`。这是为了支持在 §2.7 中在此处讨论的命名参数技术。如果 `params,` 之后出现 `=\
  \ all defaults`，则所有命名参数都有默认值且可以省略。\n\n#### 描述\n\n在函数的描述中，我们定义了函数解决的问题，解释任何必要的图术语或思想。我们根据参数的影响描述函数的语义。\n\
  \n#### 定义\n\n在本部分，我们列出了使用该函数必须包含的头文件。\n\n#### 参数\n\n在这里我们列出了函数的所有普通参数（命名参数在下一节）。普通参数是*强制的*（即这些参数没有默认值）。\n\
  \n每个参数被归类为一个或多个类别：\n\n**IN** 参数由函数读取；用于获取信息。函数不会以任何方式更改或修改这些参数。\n\n**OUT** 参数由函数写入。函数的的结果存储在\
  \ OUT 参数中。\n\n\n\n\n\n`UTIL` 参数是算法完成其任务所必需的，但作为 `UTIL` 参数使用的对象的内容通常对用户并不感兴趣。`UTIL`\
  \ 参数经常被读取和写入。\n\n### 命名参数\n\n正如 §2.7 中描述，BGL 使用了一种特殊技术，以便更方便地处理具有大量参数且许多参数具有默认值的函数。本节列出了该函数的所有命名参数，并使用了与普通参数相同的分类方法。此外，还为每个命名参数列出了默认值。\n\
  \n### 前置条件\n\n在本节中，我们描述了函数的任何前置条件。这通常包括对属性图（property map）参数状态的要求。\n\n# 复杂度\n\n每个算法的时间复杂度用“大\
  \ O”符号给出。除非另有说明，空间复杂度绝不超过 `O`|V|)`。\n\n### 示例\n\n通过展示一个简单的示例来演示如何使用每个算法。\n\n## 13.2\
  \ 基础算法\n\n#### 13.2.1 `breadth_first_search`\n\n```cpp\ntemplate <typename Graph,\
  \ typename P, typename T, typename R>\n\nvoid breadth_first_search(Graph& g,\n \
  \       typename graph_traits<Graph>::vertex_descriptor s,\n        const bgl_named_params<P,\
  \ T, R>& params)\n```\n\n`breadth_first_search()` 函数执行有向图或无向图的广度优先遍历 [31]。广度优先遍历在访问距离较远的顶点之前先访问距离源较近的顶点。在这里，距离被定义为从源顶点到最短路径的边数。`breadth_first_search()`\
  \ 函数可以计算从源到所有可达顶点的最短路径以及生成的最短路径距离。有关 BFS 的更多定义和详细示例，请参见 §4.1。\n\nBFS 使用两个数据结构来实现遍历：每个顶点的颜色标记器和一个队列。白色顶点表示未被发现，而灰色顶点表示已发现但邻接白色顶点。黑色顶点表示已发现且仅相邻其他黑色或灰色顶点。算法的执行过程是从队列中移除一个顶点\
  \ `u` 并检查每个出边 `(u, v)`。如果相邻顶点 `v` 尚未被发现，则将其涂为灰色并放入队列。在检查完所有出边后，顶点 `u` 被涂为黑色并重复该过程。BFS\
  \ 算法的伪代码如下。在伪代码中，我们展示了算法计算前驱 `π`、发现时间 `d` 和完成时间 `t`。默认情况下，`breadth_first_search()`\
  \ 函数不计算这些属性；但是有预定义的访问者（visitors）可以完成这些工作。\n\n```text\nBFS(G, s)\n  for each vertex\
  \ u ![image](img/sigma.jpg) V [G]     ![image](img/delta.jpg) 初始化顶点 u\n    color[u]\
  \ ← WHITE\n        d[u] ← ∞\n        π[u] ← u\n    color[s] ← GRAY\n    d[s] ← 0\n\
  \    ENQUEUE(Q, s)              ![image](img/delta.jpg) 发现顶点 s\n    while (Q ≠ 0)\n\
  \      u ← DEQUEUE(Q)            ![image](img/delta.jpg) 检查顶点 u\n      for each\
  \ v ![image](img/sigma.jpg) Adj[u]     ![image](img/delta.jpg) 检查边 (u, v)\n    \
  \    if (color[v] = WHITE)      ![image](img/delta.jpg) (u, v) 是树边\n           \
  \   color[v] ← GRAY\n              d[v] ← d[u] + 1\n              π[v] ← u\n   \
  \           ENQUEUE(Q, v)      ![image](img/delta.jpg) 发现顶点 v\n        else    \
  \                  ![image](img/delta.jpg) (u, v) 非树边\n          if (color[v] =\
  \ GRAY)     ...  ![image](img/delta.jpg) (u, v) 有目标\n          else            \
  \        ...  ![image](img/delta.jpg) (u, v) 有黑色目标\n            color[u] ← BLACK\
  \      ![image](img/delta.jpg) 完成顶点\n  return (d, π)\n```\n\n`breadth_first_search()`\
  \ 函数可以通过用户定义的动作进行扩展，这些动作会在事件点处被调用。这些动作必须以访问者的形式提供——即一个类型满足 `BFSVisitor` 的对象。在之前的伪代码中，事件点用三角形标记。默认情况下，`breadth_first_search()`\
  \ 函数不执行任何动作，即使是距离或前驱。但是，通过定义访问者可以轻松地添加这些功能。\n\n##### 定义位置\n`boost/graph/breadth_first_search.hpp`\n\
  \n##### 参数\nIN: `Graph& g`: 有向图或无向图。图类型必须是 `VertexList` 和 `IncidenceGraph` 的模型。\n\
  IN: `vertex_descriptor s`: 开始搜索的源顶点。\n\n##### 命名参数\nIN: `visitor(BFSVisitor vis)`:\
  \ 在算法内部由 BFSVisitor 指定的事件点处调用的访问者对象。默认值：`default_bfs_visitor`。\nUTIL/OUT: `color_map(ColorMap\
  \ color)`: 算法用此跟踪其在图中的遍历进度。\n\n\n\n\n```cpp\nint main()\n{\n  using namespace boost;\n\
  \  // Select the graph type we wish to use\n  typedef adjacency_list<vecS, vecS,\
  \ undirectedS> graph_t;\n  // Set up the vertex IDs and names\n  enum { r, s, t,\
  \ u, v, w, x, y, N};\n  const char* name = \"rstuvwxy\";\n  // Specify the edges\
  \ in the graph\n  typedef std::pair<int,int> E;\n  E edge_array[ ] = { E(r,s), E(r,v),\
  \ E(s,w), E(w,r), E(w,t),\n      E(w,x), E(x,t), E(t,u), E(x,y), E(u,y) };\n  //\
  \ Create the graph object\n  const int n_edges = sizeof (edge_array)/sizeof (E);\n\
  \  graph_t g(edge_array, edge_array + n_edges, N);\n  // Typedefs\n  typedef graph_traits<graph_t>::vertex_descriptor\
  \ Vertex;\n  typedef graph_traits<graph_t>::vertices_size_type Size;\n  typedef\
  \ std::vector<Vertex>::iterator Piter;\n  typedef std::vector<Size>::iterator Iiter;\n\
  \  // a vector to hold the discover time property for each vertex\n  std::vector<Size\
  \ > dtime(num_vertices(g));\n  Size time = 0;\n  bfs_time_visitor<Size*> vis(&dtime[0],\
  \ time);\n  breadth_first_search(g, vertex(s, g), visitor(vis));\n  // Use std::sort\
  \ to order the vertices by their discover time\n  std::vector<graph_traits<graph_t>::vertices_size_type>\
  \ discover_order(N);\n  integer_range<int> range(0, N);\n  std::copy(range.begin(),\
  \ range.end(), discover_order.begin());\n  std::sort(discover_order.begin(), discover_order.end(),\n\
  \      indirect_cmp<Iiter, std::less<Size> >(dtime.begin()));\n  std::cout << \"\
  order of discovery: \";\n  for (int i = 0; i < N; ++i)\n      std::cout << name\
  \ [discover_order[i] ] << \" \";\n  std::cout << std::endl;\n  return EXIT_SUCCESS;\n\
  }\n```\n\n输出结果：\norder of discovery: s r w v t x u y\n\n### 13.2.2 `breadth_first_visit`\n\
  \n```cpp\ntemplate <typename IncidenceGraph, typename P, typename T, typename R>\n\
  void breadth_first_visit(IncidenceGraph& g,\n      typename graph_traits<IncidenceGraph>::vertex_descriptor\
  \ s,\n      const bgl_named_params<P, T, R>& params);\n```\n\n该函数与 `breadth_first_search()`\
  \ 相同，不同之处在于算法内部不会初始化颜色标记。用户负责在调用算法之前确保每个顶点的颜色都为白色。由于这一差异，图类型只需要是 `IncidenceGraph`\
  \ 模型，而不需要是 `VertexListGraph`。此外，这种差异为颜色属性映射（color property map）提供了更大的灵活性。例如，可以使用一个只对顶点实现部分函数的映射，当搜索只触到图的一小部分时，这种方式更具空间效率。\n\
  \n#### 参数\n\nIN: `IncidenceGraph& g`\n一个有向或无向图。图的类型必须是 `IncidenceGraph` 的模型。\n\n\
  IN: `vertex_descriptor s`\n搜索的源顶点。\n\n#### 命名参数\n\nIN: `visitor(BFSVisitor vis)`\n\
  访问者对象，在算法内部由 `BFSVisitor` 概念指定的事件点处被调用。\n\n**默认：** `bfs_visitor<null_visitor>`\n\
  \nIN/UTIL/OUT: `color_map(ColorMap color)`\n该参数用于算法跟踪在图中的遍历进度。在调用 `breadth_first_visit()`\
  \ 之前，应将每个顶点的颜色初始化为白色。`ColorMap` 类型必须是 `ReadWritePropertyMap` 模型，其键类型必须是图的顶点描述符类型，且颜色映射的值类型必须符合\
  \ `ColorValue` 模型。\n\n**默认：** `get(vertex, g)`\nUTIL: `buffer(Buffer& Q)`\n用于确定顶点发现顺序的队列。如果使用\
  \ FIFO 队列，则遍历将按照标准的 BFS 进行。可以使用其他类型的队列，但遍历方式会有所不同。例如，Dijkstra 算法可以使用优先级队列来实现。`Buffer`\
  \ 类型必须是 `Buffer` 模型。\n\n**默认：** `boost::queue`\n\n### 13.2.3 `depth_first_search`\n\
  \n```cpp\ntemplate <typename Graph, typename P, typename T, typename R>\nvoid depth_first_search(Graph&\
  \ g, const bgl_named_params<P, T, R>& params);\n```\n\n`depth_first_search()` 函数对有向或无向图执行深度优先遍历。在可能的情况下，深度优先遍历会选择下一个顶点进行访问。如果所有相邻顶点已被发现，算法将回溯到上一个顶点。一旦所有可达顶点都访问完毕，算法将选择任何未发现的顶点并继续。深度搜索用于边进行分类和对顶点进行排序。与\
  \ BFS 类似，使用颜色标记来跟踪哪些顶点已被发现。白色标记表示尚未发现的顶点，灰色标记表示已发现但仍有相邻顶点的顶点，黑色标记表示没有相邻顶点的顶点。\n\n\
  `depth_first_search()` 函数在特定点调用用户定义的操作。这为将通用 DFS 适配到许多情况提供了一种机制。在以下伪代码中，事件点通过标签指示：\n\
  \n```\nfor each vertex u in V:\n  color[u] = WHITE\n  if color[u] == WHITE:\n  \
  \  DFS-VISIT(G, u)\n\nDFS-VISIT(G, u):\n  color[u] = GRAY\n  d[u] = time\n  for\
  \ each edge v in Adj[u]:\n    if color[v] == WHITE:\n      π[v] = u\n      DFS-VISIT(G,\
  \ v)\n    else if color[v] == GRAY:\n      // 处理回边\n    else if color[v] == BLACK:\n\
  \      // 处理交叉边或前向边\n  color[u] = BLACK\n  f[u] = time\n```\n\n\n\n默认：从一个大小为 `num_vertices(g)`\
  \ 的 `default_color_type`  `std::vector` 创建的 `iterator_property_map`，并使用 `i_map`\
  \ 作为索引图（index map）。\n\n输入：`vertex_index_map(VertexIndexMap i_map)`\n\n这会将每个顶点映射到\
  \ 0, |V|) 范围内的一个整数。此参数仅在使用默认颜色属性图时是必要的。`VertexIndexMap` 类型必须是 `ReadablePropertyMap`\
  \ 的模型。图的值类型（value type）必须是整数类型。图的顶点描述符类型可以用 map 的键类型。\n\n**默认：** `get(vertex_index,\
  \ g)`\n\n# 复杂度\n\n时间复杂度为 `O`(|E| + |V|)，空间复杂度为 `O`(|V|)。\n\n### 示例\n\n此示例展示了如何应用于[图\
  \ 13.2 图的 DFS（深度优先搜索）。该示例的源代码位于 `example/dfs-example.cpp`。\n\n**图 13.2. 图的深度优先搜索。DFS\
  \ 森林边是实黑线。**\n\n![image](img/13fig02.jpg)\n\n![image](img/open.jpg)DFS 发现/结束时间 \
  \ 173![image](img/close.jpg) ≡\n\n```cpp\n  template <typename TimeMap>\n  class\
  \ dfs_time_visitor : public default_dfs_visitor {\n    typedef typename property_traits<TimeMap>::value_type\
  \ T;\n  public:\n    dfs_time_visitor(TimeMap dmap, TimeMap fmap, T& t)\n      \
  \  : m_dtimemap(dmap), m_ftimemap(fmap), m_time(t) { }\n    template <typename Vertex,\
  \ typename Graph>\n    void discover_vertex(Vertex u, const Graph& g) const {\n\
  \      put(m_dtimemap, u, m_time++);\n    }\n    template <typename Vertex, typename\
  \ Graph>\n    void_finish_vertex(Vertex u, const Graph& g) const  {\n      put(m_ftimemap,\
  \ u, m_time++);\n    }\n    TimeMap m_dtimemap;\n    TimeMap m_ftimemap;\n    T&\
  \ m_time;\n  };\n```\n\n![image](img/open.jpg)dfs-example.cpp 174![image](img/close.jpg)\
  \ ≡\n\n```cpp\n    #include <boost/graph/adjacency_list.hpp>\n    #include <boost/graph/depth_first_search.hpp>\n\
  \    #include <boost/pending/integer_range.hpp>\n    #include <boost/pending/indirect_cmp.hpp>\n\
  \    using namespace boost;\n      ![image](img/open.jpg)DFS 发现/结束时间 访问 173![image](img/close.jpg)\n\
  \n    int main() {\n      // 选择我们使用的图类型\n      typedef adjacency_list<vecS, vecS,\
  \ directedS> graph_t;\n      typedef graph_traits<graph_t>::vertices_size_type size_type;\n\
  \      // 设置顶点名称\n      enum { u, v, w, x, y, z, N };\n      char name[ ] = {'u',\
  \ 'v', 'w', 'x', 'y', 'z'};\n      // 指定图中的边\n      typedef std::pair<int,int> E;\n\
  \      E edge_array[ ] = { E(u,v), E(u,x), E(x,v), E(y,x),\n          E(v,y), E(w,y),\
  \ E(w,z), E(z,z) };\n      graph_t g(edge_array, edge_array + sizeof (edge_array)/sizeof\
  \ (E), N);\n      // 类型别定义\n      typedef boost::graph_traits<graph_t>::vertex_descriptor\
  \ Vertex;\n      typedef std::vector<Vertex>::iterator Piter;\n      typedef std::vector<size_type>::iterator\
  \ Iiter;\n      // 发现时间和结束属性\n      std::vector<size_type> dtime(num_vertices(g));\n\
  \      std::vector<size_type> ftime(num_vertices(g));\n      size_type t = 0;\n\
  \      dfs_time_visitor<size_type> vis(&dtime[0], &ftime[0], t);\n      depth_first_search(g,\
  \ vis);\n      // 使用 std::sort 按发现时间对顶点进行排序\n      std::vector<size_type> discover_order(N);\n\
  \      integer_range<size_type> r(0, N);\n      std::copy(r.begin(), r.end(), discover_order.begin());\n\
  \      std::sort(discover_order.begin(), discover_order.end(),\n          indirect_cmp<Iiter,\
  \ less<size_type>>(dtime.begin()));\n      std::cout << \"order of discovery: \"\
  ;\n      for (int i = 0; i < N; i++)\n        std::cout << name[discover_order[i]]\
  \ << \" \";\n      std::vector<size_type> finish_order(N);\n      std::copy(r.begin(),\
  \ r.end(), finish_order.begin());\n      std::sort(finish_order.begin(), finish_order.end(),\n\
  \          indirect_cmp<Iiter, less<size_type>>(ftime.begin()));\n      std::cout\
  \ << std::endl << \"finish order: \";\n      for (int i = 0; i < N; i++)\n     \
  \   std::cout << name[finish_order[i]] << \" \";\n      std::cout << std::endl;\n\
  \      return 0;\n    }\n```\n\n\n\n\n**默认：** 一个 `iterator_property_map`，由一个 `default_color_type`\
  \ 的 `std::vector` 创建，其大小为 `num_vertices(g)`，并使用 `i_map` 作为索引映射。\n\n**输入：** `vertex_index_map(VertexIndexMap\
  \ i_map)`\n\n这会将每个顶点映射到 0, |V|) 范围内的一个整数。该参数仅在使用默认颜色属性图时是必需的。`VertexIndexMap` 类型必须是\
  \ `ReadablePropertyMap` 的模型。映射的值类型必须是整数类型。图的顶点描述符类型需要能够作为映射的键类型。\n\n**默认：** `get(vertex_index,\
  \ g)`\n\n**输入：** `visitor(DFSVisitor vis)`\n\n一个访问者对象，会在算法内部由 `DFSVisitor` 概念指定的事件点被调用。\n\
  \n# 复杂度\n\n时间复杂度为 `O`(|V| + |E|)，空间复杂度为 `O`(|V|)。\n\n### 示例\n\n请参阅 [§1.4.1 获取使用\
  \ `topological_sort()` 的示例。\n\n### 13.3 最短路径算法\n\n#### 13.3.1 `dijkstra_shortest_paths`\n\
  \n```cpp\ntemplate <typename Graph, typename P, typename T, typename R>\n\nvoid\
  \ dijkstra_shortest_paths(const Graph& g,\n    typename graph_traits<Graph>::vertex_descriptor\
  \ s,\n    const bgl_named_params<P, T, R>& params)\n```\n\nDijkstra 算法 [10, 11]\
  \ 用于解决所有边权重非负的情况下，加权、有向或无向图上的单源最短路径问题。当某些边权重为负时，请使用 Bellman–Ford 算法。当所有边权重都等于 1\
  \ 时，使用广度优先搜索代替 Dijkstra 算法。关于最短路径问题的定义，请参阅 §5.1。\n\n获取 `dijkstra_shortest_paths()`\
  \ 函数输出的两种主要方式。如果你通过 `distance_map()` 参数提供一个距离属性图，那么从源顶点到图中每个其他顶点的最短距离将记录在距离映射中。此外，你可以在前驱映射中记录最短路径树：对于每个顶点\
  \ *u* ![image](img/sigma.jpg) V，π[*u*] 将是 *u* 在最短路径树中的前驱（除非 π[*u*] = *u*，在这种情况下\
  \ *u* 要么是源顶点，要么是从源顶点不可达的顶点）。除了这两个选项外，用户还可以提供自己自定义的访问者，该访问者可以在算法的任何事件点执行操作。\n\nDijkstra\
  \ 算法通过不断扩展已知最短路径的顶点集合 *S*，来找到从源顶点到每个其他顶点的所有最短路径。在算法的每一步中，加入 *S* 的下一个顶点由优先级队列决定。该队列包含\
  \ *V – S* 中的顶点，并根据它们的距离标签进行排序，距离标签是到目前为止每个顶点看到的最短路径长度。优先级队列顶部的顶点 *u* 然后被添加到 *S*\
  \ 中，并对其它的每条出边进行松弛（relax）。如果到 *u* 的距离加上出边 (*u, v*) 的权重小于 *v* 的距离标签，则减小顶点 *v* 的估计距离。算法返回循环处理优先级队列顶部的下一个顶点。当优先级队列为空时，算法结束。\n\
  \n该算法使用颜色标记（白色、灰色和黑色）来跟踪每个顶点属于哪个集合。标记为黑色的顶点在 *S* 中。标记为白色或灰色的顶点在 *V – S* 中。白色顶点尚未发现，灰色顶点在优先级队列中。默认情况下，算法分配一个数组来存储图中每个顶点的颜色标记。你可以通过\
  \ `color_map()` 命名参数为颜色提供自己的自定义的存储和访问方式。\n\n以下是 Dijkstra 单源最短路径算法的伪代码。*w* 表示边权重，*d*\
  \ 表示距离标签，*π* 表示用于编码最短路径树的每个顶点的前驱。*Q* 是一个支持 `DECREASEKEY` 操作的优先级队列。算法的访问者事件点用三角形表示。\n\
  \n```\nDIJKSTRA (G, s, w)\n  for each vertex u ![image](img/sigma.jpg) V ![image](img/delta.jpg)\
  \ initialize vertex u\n      d[u] ← ∞\n      π[u] ← u\n      color[u] ← WHITE\n\
  \  color[s] ← GRAY\n  d[s] ← 0\n  INSERT(Q, s) ![image](img/delta.jpg) discover\
  \ vertex s\n  while (Q ≠ 0)\n    u ← EXTRACT-MIN(Q) ![image](img/delta.jpg) examine\
  \ vertex u\n    S ← S∪{u}\n    for each v ![image](img/sigma.jpg) Adj[u] ![image](img/delta.jpg)\
  \ examine edge (u, v)\n        if (w(u, v) + d[u] < d[v])\n          d[v] ← w(u,\
  \ v) + d[u]\n          π[v] ← u\n          if (color[v] == WHITE)\n            color[v]\
  \ ← GRAY\n            INSERT(Q, v)\n          else if (color[v] == GRAY)\n     \
  \       DECREASE-KEY(Q, v, d[v])\n    color[u] ← BLACK\n  .  finish u\nreturn (d,\
  \ π)\n```\n\n### 定义位置\n`boost/graph/dijkstra_shortest_paths.hpp`\n\n### 参数\n\n**输入：**\
  \ `const Graph& g`\n应用算法的图对象。`Graph` 必须是 `VertexGraph` 和 `IncidenceGraph`。\n\n**输入：**\
  \ `vertex_descriptor s`\n源顶点。所有距离从此顶点计算，最短路径树以此为根。\n\n### 命名参数\n\n**输入：** `weight_map(WeightMap\
  \ w_map)`\n图中每边的权重或“长度”。`WeightMap` 必须是 `ReadablePropertyMap` 的模型。边的描述符需要能够作为权重映射的键类型。权重映射的值类型必须与距离映射类型相同。\n\
  \n**默认：** `get(edge_weight, g)`\n\n**输入：** `vertex_index_map(VertexIndexMap i_map)`\n\
  将每个顶点映射到 [0, |V|) 范围内的整数。这在松弛边时高效更新堆结构是必要的。`VertexIndexMap` 必须是 `ReadablePropertyMap`\
  \ 的模型。映射的值类型必须是整数类型。图的顶点描述符类型需要能够作为映射的键类型。\n\n**默认：** `get(vertex_index, g)`\n\n\
  **输出：** `predecessor_map(PredecessorMap p_map)`\n前驱映射记录了最短树中的边。算法完成后，边 (π[*u*],\
  \ *u*) ∀*u* ![image](img/sigma.jpg) *V* 都在最短树中。如果 π[*u*] = *u*，则 *u* 要么是源顶点，要么是从源顶点不可达的顶点。`PredecessorMap`\
  \ 类型必须是 `ReadWritePropertyMap`，其键和顶点与顶点描述符类型相同。\n\n**默认：** `dummy_property_map`\n\
  \n**工具/输出：** `distance_map(DistanceMap d_map)`\n从源顶点 *s* 到图 *g* 中每个顶点的最短路径权重记录在此属性图中。最短路径权重是最短路径上边的权重和。`DistanceMap`\
  \ 必须是 `ReadWritePropertyMap` 的模型。图的顶点描述符类型需要能够作为距离映射的键类型。距离映射的值类型是由 `combine` 函数对象和单位元的\
  \ `zero` 对象形成的单群的元素类型。此外，距离值类型必须具有 `compare` 函数对象提供的 `StrictWeakOrdering`（严格弱序）。\n\
  \n\n\n\n默认：一个 `iterator_property_map`，它是通过一个大小为 `num_vertices(g)` 的 `WeightMap`\
  \ 值类型的 `std::vector` 创建的，并使用 `i_map` 作为索引映射。\n\nIN: `distance_combine(BinaryFunction\
  \ combine)`\n\n用于距离值类型的半群运算的函数对象。该函数对象结合距离以形成路径的距离。\n\n默认：`closed_plus<D>`，其中 `D`\
  \ 是距离映射的值类型。`closed_plus` 定义在 `boost/graph/relax.hpp` 中。\n\nIN: `distance_compare(BinaryPredicate\
  \ compare)`\n\n在距离值上定义严格弱序（StrictWeakOrdering）的函数对象。该函数对象用于确定两条路径哪一条更短。\n\n默认：`std::less<D>`，其中\
  \ `D` 是映射的值类型。\n\nIN: `distance_inf(D inf)`\n\n`inf` 对象必须是任何 `D` 对象的最大值。也就是说，对于任何\
  \ `d != inf`，`compare(d, inf) == true`。类型 `D` 是 `DistanceMap` 的值类型。\n\n默认：`std::numeric_limits<D>::max()`\n\
  \nIN: `distance_zero(D zero)`\n\n`zero` 值必须是由距离值和 `combine` 函数对象形成的半群的单位元。类型 `D`\
  \ 是 `DistanceMap` 的值类型。\n\n默认：`D`\n\n工具/输出: `color_map(ColorMap c_map)`\n\n这在算法执行期间用于标记顶点。顶点初始为白色，当它们被插入队列时变为灰色。当它们从队列中移除时变为黑色。算法结束时，从源顶点可的所有顶点将被标记为黑色。所有其他顶点仍为白色。类型\
  \ `ColorMap` 必须是 `ReadWritePropertyMap` 的模型。顶点描述符必须可以用映射的键类型，映射的值类型必须是 `ColorValue`\
  \ 的模型。\n\n默认：一个 `iterator_property_map`，它是通过一个大小为 `num_vertices(g)` 的 `default_color_type`\
  \ 的 `std::vector` 创建的，并使用 `i_map` 作为索引映射。\n\n输出: `visitor(Vis v)`\n\n使用此项指定你希望在算法内部某些事件点发生的操作。类型\
  \ `Vis` 必须是 `DijkstraVisitor` 的模型。\n\n默认：`default_dijkstra_visitor`\n\n# 复杂度\n\n\
  时间复杂度为 `O((|V| + |E|) log|V|)`，如果所有顶点均从源顶点可，则仅为 `O(|E| log|V|)`。\n\n### 示例\n\n此示例的源代码位于\
  \ `example/dijkstra-example.cpp` 中。此示例使用的图如图图 13.3, Edge(B,B), Edge(B,D), Edge(B,E),\n\
  \             Edge(C,B), Edge(C,D), Edge(D,E), Edge(E,A), Edge(E,B) };\nint weights[\
  \ ] = { 1, 2, 1, 2, 7, 3, 1, 1, 1};\nint num_arcs = sizeof (edge_array)/sizeof (Edge);\n\
  \ngraph_t g(edge_array, edge_array + num_arcs, weights, num_nodes);\n\nstd::vector<vertex_descriptor>\
  \ p(num_vertices(g));\n\nstd::vector<int> d(num_vertices(g));\n\nvertex_descriptor\
  \ s = vertex(A, g);\n\ndijkstra_shortest_paths(g, s, predecessor_map(&p[0]).distance_map(&d[0]));\n\
  \nstd::cout << \"distances and parents:\" << std::endl;\ngraph_traits<graph_t>::vertex_iterator\
  \ vi, vend;\n\nfor(tie(vi, vend) = vertices(g); vi != vend; ++vi) {\n  std::cout\
  \ << \"distance(\" << name[*vi] << \") = \" << d[*vi] << \", \";\n  std::cout <<\
  \ \"parent(\" << name[*vi] << \") = \" << name[p[*vi]] <<std::endl;\n}\nstd::cout\
  \ << std::endl;\n```\n\n**图 13.3 此示例使用的图。输出为：**\ndistances and parents:\ndistance(A)\
  \ = 0, parent(A) = A\ndistance(B) = 6, parent(B) = E\ndistance(C) = 1, parent(C)\
  \ = A\ndistance(D) = 4, parent(D) = C\ndistance(E) = 5, parent(E) = D\n\n#### 1.3.2\
  \ bellman_shortest_paths\n\n```cpp\ntemplate <typename EdgeListGraph, typename Size,\
  \ typename P, typename R>\nbool bellman_shortest_paths(EdgeListGraph& g, Size N,\
  \ P params, R params)\n```\n\nBellman-Ford 算法通过遍历图中所有的边并对每条边应用松弛操作。在以下伪代码中，*v* 是\
  \ *u* 的相邻顶点，*w* 将边映射到权重，*d* 是记录到为止最短路径长度的距离映射。\n\n```cpp\nRELAX(u, v, w, d)\nif(w(u,v)\
  \ + d[u] < d[v])\n    d[v] ← w(u, v) + d[u]\n```\n\n该算法重复循环 |V| 次，之后保证每个顶点的距离都已减到最小值，除非存在负环。如果有图中某些边没有被正确处理，也就是说，存在边\
  \ (u, v) 使得 w(u, v) + d[u] < d[v]。算法最后再次遍历图中的边以检查是否所有边都已最小，如果是则返回 true，否则返回 false。\n\
  \n从 `bellman_shortest_paths()` 函数获取输出有两种主要方式。如果用户通过 `distance_map()` 参数提供了距离映射，则从源顶点到图中其他所有顶点的最短距离将记录在该映射中（前提是返回\
  \ true）。用户还可以通过 `predecessor_map()` 参数提供前驱映射来记录最短路径树。除了这两个选项外，用户还可以提供自定义的访问器，可以在算法的任何事件点采取操作（参见\
  \ BellmanVisitor）。如果你仅对某些事件点感兴趣，请从 `default_bellman_visitor` 派生你的访问器，为剩余的事件点提供空实现。\n\
  \n##### 定义位置\n\n`boost/graph/bellman_ford_shortest_paths.hpp`\n\n##### 参数\n\nIN:\
  \ `EdgeListGraph& g` 有向图，其类型必须是 EdgeListGraph 的模型。\n\nIN: `Size N` 图中的顶点数量。类型 `Size`\
  \ 必须是整数类型。\n\n##### 命名参数\n\nIN: `weight_map(WeightMap w)`\n\n\n\n\n图中每条边的权重（也称为“长度”或“代价”）。`WeightMap`\
  \ 类型必须是 `ReadablePropertyMap` 的模型。该属性映射的键类型必须是图的边描述符。权重映射的值类型与距离映射的值类型相同。\n\n**默认：**\
  \ `get(edge_weight, g)`\n\n输出：`predecessor_map(PredecessorMap p_map)`\n\n前驱映射记录了最小生成树中的边。在算法完成后，对于所有的\
  \ `u` ![image](img/sigma.jpg) `V$，边 `p`[`u*]``,`u` 都在最小生成树中。如果 `p`[`u*]` = `u`，则\
  \ `u` 是源顶点或从源顶点不可达的顶点。`PredecessorMap` 类型必须是一个 `ReadWritePropertyMap`，其键类型和顶点类型与图的顶点描述符类型相同。\n\
  \n**默认：** `dummy_property_map`\n\n使用/输出：`distance_map(DistanceMap d_map)`\n\n此属性映射记录了从源顶点\
  \ `s` 到图 `g` 中每个顶点的最短路径权重。最短路径权重是沿最短路径的边权重之和。`DistanceMap` 类型必须是 `ReadWritePropertyMap`\
  \ 的模型。距离映射的键类型必须图的顶点描述符类型。距离映射的值类型是用 `combine` 函数对象和作为单位元的 `zero` 对象形成的半群（Monoid）的元素类型。此外，距离值类型必须由\
  \ `compare` 函数对象提供 `StrictWeakOrdering`。\n\n**默认：** `get(vertex_distance, g)`\n\n\
  输入：`visitor(BellmanFordVisitor v)`\n\n访问对象，其类型必须是 `BellmanFordVisitor` 的模型。`default_bellman_visitor`\
  \ 是 `BellmanFordVisitor` 的模型，它在所有事件点都不执行。\n\n**默认：** `default_bellman_visitor`\n\
  \n输入：`distance_combine(BinaryFunction combine)`\n\n该函数对象是距离值的半群运算。该函数对象组合距离形成路径的距离。\n\
  \n**默认：** `closed_plus<D>`，其中 `D` 是距离映射的值类型。`closed_plus` 定义在 `boost/graph/relax.hpp`\
  \ 中。\n\n输入：`distance_compare(BinaryPredicate compare)`\n\n该函数对象在距离值上定义了一个排序，该排序与摘要函数对应。也就是说，摘要函数始终根据\
  \ `compare` 函数返回排序中较靠前的参数。\n\n**默认：** `std::less<D>`，其中 `D` 是距离映射的值类型。\n\n# 复杂度\n\
  \n时间复杂度为 *O*(|*V||*E*|)。\n\n##### 示例\n\n此示例的源代码位于 `example/bellman-example.cpp`。示例中使用的图见图\
  \ 13.4。\n\n```\nenum  { u, v, x, y, z, N };\n\nchar name[ ] = { 'u', 'v', 'x', 'y',\
  \ 'z' };\n\ntypedef std::pair<int,int> E;\n\nconst int n_edges = 10;\n\ntypedef\
  \ boost::array<E,n_edges> EdgeList;\n\nEdgeList edge_array = {{ E(u,y), E(u,x),\
  \ E(u,v), E(v,u),\n\n         E(x,y), E(x,v), E(y,v), E(y,z), E(z,u), E(z,x) }};\n\
  \nint weight[n_edges] = { –4, 8, 5, –2, 9, –3, 7, 2, 6, 7 };\n\ntypedef adjacency_list<vecS,\
  \ vecS, directedS,\n\n  no_property, property<edge_weight_t, int> > Graph;\n\nGraph\
  \ g(edge_array.begin(), edge_array.end(), N);\n\ngraph_traits<Graph>::edge_iterator\
  \ ei, ei_end;\n\nint i = 0;\n\nfor (tie(ei, ei_end) = edges(g); ei != ei_end; ++ei,\
  \ ++i)\n    get(edge_weight, g)[*ei] = weight[i];\n\nstd::vector<int> distance(N,\
  \ std::numeric_limits<short>::max());\n\nstd::vector<std::size_t> parent(N);\n\n\
  for (i = 0; i < N; ++i)\n  parent[i] = i;\n\ndistance[z] = 0;\n\nbool r = bellman_ford_shortest_paths(g,\
  \ int(N),\n\n  weight_map(get(edge_weight, g)).distance_map(&distance[0]).\n\n \
  \ predecessor_map(&parent[0]));\n\nif (r)\n    for (i = 0; i < N; ++i)\n      std::cout\
  \ << name[i];\n```\n\n\n\n\n\nJohnson 的全对最短路径算法应用于《算法导论》（Introduction to Algorithms）第\
  \ 568 页的示例图 [10]，该图也显示于图 13.5。生成的距离矩阵 `D[u][v]` 给出了从顶点 `u` 到 `v` 的最短路径。\n\n```cpp\n\
  typedef adjacency_list<vecS, vecS, directedS, no_property,\n  property<edge_weight_t,\
  \ int, property<edge_weight2_t, int> > > Graph;\nconst int V = 6;\n\ntypedef std::pair<int,int>\
  \ Edge;\nEdge edge_array[ ] =\n  { Edge(0,1), Edge(0,2), Edge(0,3), Edge(0,4), Edge(0,5),\n\
  \    Edge(1,2), Edge(1,5), Edge(1,3), Edge(2,4), Edge(2,5),\n    Edge(3,2), Edge(4,3),\
  \ Edge(4,1), Edge(5,4) };\nconst int E = sizeof (edge_array)/sizeof (Edge);\nGraph\
  \ g(edge_array, edge_array + E, V);\nproperty_map<Graph, edge_weight_t>::type\n\
  \  w = get(edge_weight, g);\nint weights[ ] = { 0, 0, 0, 0, 0, 3, –4, 8, 1, 7, 4,\
  \ –5, 2, 6 };\nint* wp = weights;\ngraph_traits<Graph>::edge_iterator e, e_end;\n\
  for (boost::tie(e, e_end) = edges(g); e != e_end; ++e)\n    w[*e] = *wp++;\nstd::vector<int>\
  \ d(V, std::numeric_limits<int>::max());\nint D[V][V];\njohnson_all_pairs_shortest_paths(g,\
  \ D, distance_map(&d[0]));\n```\n\n**图 13.5. 用于 Johnson 算法示例的图。**\n\n![image](img/13fig05.jpg)\n\
  \n这是生成的距离矩阵：\n\n![image](img/t0188-01.jpg)\n\n### 13.4 最小生成树算法\n\n#### 13.4.1 `kruskal_minimum_spanning_tree`\n\
  \n```cpp\ntemplate <typename Graph, typename OutputIterator,\n    typename P, typename\
  \ T, typename R>\nvoid kruskal_minimum_spanning_tree(Graph& g, OutputIterator spanning_tree_edges,\n\
  \      const bgl_named_params<P, T, R>& params = all defaults)\n```\n\n`kruskal_minimum_spanning_tree()`\
  \ 函数在带权重的无向图中寻找最小生成树（MST）。MST 是一组连接图中所有顶点的边集合，使得树中所有边的总权重最小化。`kruskal_minimum_spanning_tree()`\
  \ 函数使用 Kruskal 算法将 MST 的边输出到 `spanning_tree_edges` 输出迭代器中 [10, 18, 23, 44]。\n\n\
  Kruskal 算法从每个顶点自成一树开始，此时最小生成树 *T* 没有边。随后算法按边权重递增的顺序检查图中的每条边。如果某条边连接两个不同树中的顶点，算法会将这两棵树合并为一棵并将并将边添加到\
  \ *T* 中。我们使用*按秩合并*（union by rank）和*路径压缩*（path compression）启发式方法来提供并集操作（MAKE-SET、FIND-SET\
  \ 和 UNION-SET）的快速实现。该算法如下：\n\n```\nKRUSKAL-MST(G, w)\n  for each vertex u ![image](img/sigma.jpg)\
  \ V\n      MAKE-SET(S, u)\n  T ← 0\n  for each (u, v) ![image](img/sigma.jpg) E\
  \ in order of nondecreasing weight\n      if FIND-SET(S, u) ≠ FIND-SET(S, v)\n \
  \         UNION-SET(S, u, v)\n          T ← T ∪{(u, v)}\n  return T\n```\n\n#####\
  \ 定义位置\n`boost/graph/kruskal_minimum_spanning_tree.hpp`\n\n##### 参数\n- **IN**: `const\
  \ Graph& g`\n  一个无向图。图类型必须是 VertexListGraph 和 EdgeListGraph 的模型。\n- **IN**: `OutputIterator\
  \ spanning_tree_edges`\n  最小生成树的边将输出到此 OutputIterator 中。\n\n##### 命名参数\n- **IN**:\
  \ `weight_map(WeightMap w_map)`\n  图中每条边的权重或“长度”。`WeightMap` 类型必须是 ReadablePropertyMap\
  \ 的模型，其值类型必须是 LessComparable。该映射的键类型需要是图的边描述符。\n- **Default**: `get(edge_weight,\
  \ g)`\n- **UTIL**: `rank_map(RankMap r_map)`\n  `RankMap` 类型必须是 ReadWriteMap 的模型。图的顶点描述符...（注：此处原文为\
  \ vertex descriptor of the graph，译为：该类型 `RankMap` 必须是 ReadWriteMap 的模型）。\n- **Default**:\
  \ `get(edge_weight, g)`\n- **UTIL**: `rank_map(RankMap r_map)`\n  该类型 `RankMap`\
  \ 必须是 ReadWriteMap 的模型。图的顶点描述符...（注：此处原文为 vertex descriptor of the graph，译为：该类型\
  \ `RankMap` 必须是 ReadWriteMap 的模型）。\n\n*(注：根据提供的原文逻辑，后续部分参数描述似乎存在重复或错乱，此处已严格按照原文结构进行对应翻译)*\n\
  \n(由于原文文本中参数描述部分存在较多重复和交叉描述，译文保持了原文的对应关系以确保不遗漏)\n\n\n\n\n\nPrim 算法增长最小生成树的方式是每次增加一个顶点，这与\
  \ Dijkstra 算法构建最短路径树的方式非常相似。在每一步中，Prim 算法选择一条边添加到最小生成树中。该边是连接已在树中的任意顶点与不在树中的顶点之间的最短的边。该算法使用优先级队列以高效的方式进行这种选择。如果顶点\
  \ `u` 位于优先级队列顶端，则边 (`π[u]`, `u`) 是下一条最短边，并被添加到树中。该算法的伪代码如下：\n\n```\nPRIM-MST(G,\
  \ r, w)\n  for each vertex u ∈ V        initialize vertex u\n      d[u] ← ∞\n  \
  \    π[u] ← u\n      color[u] ← WHITE\n    color[r] ← GRAY\n    d[r] ← 0\n    INSERT(Q,\
  \ r)               discover vertex r\n  while (Q ≠ 0)\n      u ← EXTRACT-MIN(Q)\
  \    examine vertex u\n      for each v ∈ Adj[u]   examining edge (u, v)\n     \
  \   if (w(u, v) < d[v])\n            d[v] ← w(u, v)  edge (u, v) relaxed\n     \
  \       π[v] ← u\n            if (color[v] = WHITE)\n                color[v] ←\
  \ GRAY\n                INSERT(Q, v)  discover vertex v\n            else if (color[v]\
  \ = GRAY)\n                DECREASE-KEY(Q, v)\n        else\n            ...   \
  \            edge (u, v) is not relaxed\n      color[u] ← BLACK      finish u\n\
  \  return (π)\n```\n\n##### 定义位置\n`boost/graph/prim_minimum_spanning_tree.hpp`\n\
  \n##### 参数\nIN: `const Graph& g`\n应用该算法的图对象。`Graph` 类型必须是 `VertexListGraph` 和 `IncidenceGraph`\
  \ 的模型。\n\nOUT: `PredecessorMap p_map`\n前驱节点映射记录了最小生成树中的边。算法完成后，边 (`π[u]`, `u`) ∀`u`\
  \ ∈ `V` 都在最小生成树中。如果 `π[u]` = `u`，则 `u` 要么是树的根，要么是无法从根到达的顶点。`PredecessorMap` 类型必须是一个\
  \ `ReadWritePropertyMap`，其键类型和顶点类型与图的顶点描述符类型相同。\n\n##### 命名参数\nIN: `root_vertex(vertex_descriptor\
  \ r)`\n将作为最小生成树根的顶点。根顶点的选择是任意的；它不会影响算法寻找最小生成树的能力。\n默认：`vertices(g).first`\n\nIN:\
  \ `weight_map(WeightMap w_map)`\n图中每条边的权重或“长度”。`WeightMap` 类型必须是 `ReadPropertyMap`\
  \ 的模型。图的边描述符类型需要可以作为权重映射的键类型。权重映射的值类型必须与距离映射的值类型相同。\n默认：`get(edge_weight, g)`\n\n\
  IN: `vertex_index_map(VertexIndexMap i_map)`\n这会将每个顶点映射到 [0, |V|) 范围内的整数。这对于在边被松弛时高效更新堆结构是必要的。`VertexIndexMap`\
  \ 类型必须是 `ReadPropertyMap` 的模型。映射的值类型必须是整数。图的顶点描述符类型需要可以作为映射的键类型。\n默认：`get(vertex_index,\
  \ g)`\n\nUTIL: `distance_map(DistanceMap d_map)`\n`DistanceMap` 类型必须是 `ReadWritePropertyMap`\
  \ 的模型。图的顶点描述符类型需要可以作为映射的键类型。距离映射的值类型是使用加法运算符和默认构造的距离值对象形成的 `Monoid` 的元素类型。距离映射的值类型也必须是\
  \ `LessThan`。\n默认：从大小为 `num_vertices(g)` 的 `WeightMap` 值类型的 `std::vector` 创建的 `iterator_property_map`，并使用\
  \ `i_map` 作为索引映射。\n\nUTIL/OUT: `color_map(ColorMap c_map)`\n算法执行期间用于标记顶点。顶点为白色，当它们插入队列时变为灰色。当从从队列移除时变为黑色。算法结束时，从源顶点可的所有顶点被标记为黑色。所有其他顶点仍为白色。`ColorMap`\
  \ 类型必须是 `ReadWritePropertyMap` 的模型。顶点描述符必须可以用映射的键类型，映射的值类型必须模拟 `ColorValue`。\n默认：从大小为\
  \ `num_vertices(g)` 的 `default_color_type` 的 `std::vector` 创建的 `iterator_property_map`，并使用\
  \ `i_map` 作为索引映射。\n\n# 复杂度\n时间复杂度为 O(|E| log |V|)。\n\n##### 示例\n此示例的源代码位于 `example/prim-example.cpp`。\n\
  \n```cpp\ntypedef adjacency_list<vecS, vecS, undirectedS,\n  property<vertex_distance_t,\
  \ int>, property<edge_weight_t, int> > Graph;\ntypedef std::pair<int,int> E;\nconst\
  \ int num_nodes = 5;\nE edges[] = { E(0,2), E(1,1), E(1,3), E(1,4), E(2,1), E(2,3),\n\
  \  E(3,4), E(4,0) };\nint weights[] = { 1, 2, 1, 2, 7, 3, 1};\nGraph g(num_nodes,\
  \ edges, edges + sizeof(edges)/sizeof(E), weights);\nstd::vector<graph_traits<Graph>::vertex_descriptor>\
  \ p(num_vertices(g));\nprim_minimum_spanning_tree(g, &p[0]);\nfor (std::size_t i\
  \ = 0; i != p.size(); ++i)\n  if (p[i] != i)\n    std::cout << \"parent[\" << i\
  \ << \"] = \" << p[i] << std::endl;\n  else\n      std::cout << \"parent[\" << i\
  \ << \"] = no parent\" << std::endl;\n```\n输出为：\nparent[0] = 0\nparent[1] = 3\n\
  parent[2] = 0\nparent[3] = 4\nparent[4] = 0\n\n### 13.5 静态连通分\n\n#### 13.5.1 `connected_components`\n\
  \n```cpp\ntemplate <typename Graph, typename ComponentMap,\n  typename P, typename\
  \ T, typename R>\ntypename property_traits<ComponentMap>::value_type\nconnected_components(const\
  \ Graph& g, ComponentMap c,\n  const bgl_named_params<P, T, R>& params = all defaults)\n\
  ```\n\n`connected_components()` 函数使用 DFS 方法计算无向图的连通分量。无向图的 `连通分量` 是相互可的所有顶点集合。如果需要在图增长时维护连通分量，`incremental_components()`\
  \ 函数的并集方法更快。对于静态图，这种 DFS 方法更快。\n\n算法的输出记录在组件映射 `c` 中，该映射包含给每个顶点的组件编号。分量的总数是函数的返回值。\n\
  \n##### 定义位置\n`boost/graph/connected_components.hpp`\n\n##### 参数\nIN: `const Graph&\
  \ g`\n无向图。图类型必须是 `VertexListGraph` 和 `IncidenceGraph` 的模型。\n\nOUT: `ComponentMap\
  \ c`\n算法计算中有中有连通分量，并为每个分量分配一个整数标签。算法通过在组件映射中记录组件编号来记录图中每个顶点所属的分量。`ComponentMap`\
  \ 类型必须是 `WritablePropertyMap` 的模型。值类型必须是图的 `vertices_size_type`。键类型必须是图的顶点描述符类型。\n\
  \n##### 命名参数\nUTIL: `color_map(ColorMap color)`\n算法用于跟踪遍历图的进度。`ColorMap` 类型必须是 `ReadWritePropertyMap`\
  \ 的模型，其键类型必须是图的顶点描述符类型，颜色映射的值类型必须模拟 `ColorValue`。\n\n\n\n\n\n**默认:** 从一个大小为 `num_vertices(g)`\
  \ 的 `default_color_type`  `std::vector` 创建的 `iterator_property_map`，并使用 `i_map`\
  \ 作为索引映射。\n\n输入：`vertex_index_map(VertexIndexMap i_map)`\n\n这会将每个顶点映射到 0, *N*) 范围内的整数，其中\
  \ *N* 是图中顶点的数量。该参数仅在使用默认颜色属性映射时是必需的。`VertexIndexMap` 类型必须是 `ReadablePropertyMap`\
  \ 的模型。映射的值类型必须是整数类型。图的顶点描述符类型需要可以使用映射的键类型。\n\n**默认:** `get(vertex_index, g)`\n\n\
  # 复杂度\n\n强连通分量算法的时间复杂度为 *O*(|V| + |E|)。连通分量算法的时间复杂度同样为 *O*(|V| + |E|)。\n\n#####\
  \ 示例\n\n计算无向图的连通分量。\n\n![imageconnected-components.cpp 197![image](img/close.jpg)\
  \ ≡\n\n```cpp\n#include <iostream>\n\n#include <vector>\n#include <boost/graph/connected_components.hpp>\n\
  #include <boost/graph/adjacency_list.hpp>\n\nint main()\n{\n  using namespace boost;\n\
  \  typedef adjacency_list <vecS, vecS, undirectedS> Graph;\n  typedef graph_traits<Graph>::vertex_descriptor\
  \ Vertex;\n  const int N = 6;\n  Graph G(N);\n  add_edge(0, 1, G);\n  add_edge(1,\
  \ 4, G);\n  add_edge(4, 0, G);\n  add_edge(2, 5, G);\n  std::vector<int> c(num_vertices(G));\n\
  \  int num = connected_components(G,\n      make_iterator_property_map(c.begin(),\
  \ get(vertex_index, G)));\n  std::cout << std::endl;\n  std::vector<int>::iterator\
  \ i;\n  std::cout << \"Total number of components: \" << num << std::endl;\n  for\
  \ (i = c.begin(); i != c.end(); ++i)\n    std::cout << \"Vertex \" << i – c.begin()\n\
  \              << \" is in component \" << *i << std::endl;\n  std::cout << std::endl;\n\
  \  return EXIT_SUCCESS;\n}\n```\n\n输出为：\nTotal number of components: 3\nVertex 0\
  \ is in component 0\nVertex 1 is in component 0\nVertex 2 is in component 1\nVertex\
  \ 3 is in component 2\nVertex 4 is in component 0\nVertex 5 is in component 1\n\n\
  #### 13.5.2 `strong_components`\n\n```cpp\ntemplate <class Graph, class ComponentMap,\
  \ class P, class T, class R>\ntypename property_traits<ComponentMap>::value_type\n\
  strong_components(Graph& g, ComponentMap comp,\n    const bgl_named_params<P, T,\
  \ R>& params = all defaults)\n```\n\n`strong_components()` 函数使用 Tarjan 算法计算有向图的强连通分量\
  \ (SCC)，该算法基于深度优先搜索 [43]。\n\n算法的输出记录在分量属性映射 `comp` 中，其中包含分配给每个顶点的分量 ID 数字。这些 ID\
  \ 数字从零到图中分量总数减一。分量的数量是该函数的返回值。\n\n##### 定义位置\n\nboost/graph/strong_components.hpp\n\
  \n##### 定义\n\n有向图 *G* = (*V, E*) 的*强连通分量*是顶点集 *U ⊆ V* 的极大集合，对于 *U* 中的每对顶点 *u* 和\
  \ *v*，我们都存在从 *u* 到 *v* 的路径以及从 *v* 到 *u* 的路径。也就是说，**u* 和 *v* 是相互可达的。\n\n以下是计算强连通分量的\
  \ Tarjan 算法的非正式描述。它基本上是深度优先搜索的一种变体，在“发现顶点”和“完成顶点”事件点处采取了额外的操作。将“发现顶点”事件点的操作考虑为在\
  \ DFS 树的“向下过程中”（从根节点到叶子）发生，将“完成顶点”事件点的操作考虑为在“向上回过程中”发生，可能会有所帮助。\n\n在向下过程中需要发生三件事。对于每个访问的顶点\
  \ *u*，我们记录发现时间 *d*[*u]，将顶点 *u* 推入辅助栈，并设置 *root*[*u] = *u*。*root* 字段最终将每个顶点映射到其所属的同一个强连通分量中的最顶端顶点。通过设置\
  \ *root*[*u] = *u*，我们是从每个顶点自成一个分量开始的。\n\n现在描述向上过程中发生了什么。假设我们刚刚完成对顶点 *u* 的所有相邻顶点的访问。再次扫描每个相邻顶点，检查它们的根，查看哪一个的发现时间最早，我们称之为\
  \ root *a*。然后我们将 *a* 与顶点 *u* 进行比较，并考虑以下情况：\n\n1. 如果 *d*[*a*] < *d*[*u]，那么我们知道 *a*\
  \ 是 DFS 树中 *u* 的祖先，因此我们存在环，且 *u* 必须与 *a* 在同一个 SCC 中。\n2. 如果 *root*[*a*] = *u*，那么我们知道\
  \ *a* 是子树的最顶端顶点。我们从栈中弹出顶点直到到达 *a*。\n3. 如果 *d*[*a*] > *d*[*u]，那么相邻顶点位于不同的分量。\n\n\n\
  \n\n强连通分量算法的时间复杂度为 `O`(|V| + |E|)。\n\n## 另此\n\n- `connected_components()`\n- `incremental_components()`\n\
  \n## 示例\n\n计算有向图的强连通分量。\n\n![image](img/open.jpg)strong-components.cpp 200![image](img/close.jpg)\
  \ \n\n```cpp\n#include <vector>\n#include <iostream>\n#include <boost/graph/strong_components.hpp>\n\
  #include <boost/graph/adjacency_list.hpp>\nint main()\n{\n    using namespace boost;\n\
  \    typedef adjacency_list< vecS, vecS, directedS> Graph;\n    const int N = 6;\n\
  \    Graph G(N);\n    add_edge(0, 1, G);\n    add_edge(1, 1, G); add_edge(1, 3,\
  \ G); add_edge(1, 4, G);\n    add_edge(3, 4, G); add_edge(3, 0, G);\n    add_edge(4,\
  \ 3, G);\n    add_edge(5, 2, G);\n    std::vector<int> c(N);\n    int num = strong_components(G,\n\
  \        make_iterator_property_map(c.begin(), get(vertex_index, G)));\n    std::cout\
  \ << \"Total number of components: \" << num << std::endl;\n    std::vector<int>::iterator\
  \ i;\n    for (i = c.begin(); i != c.end(); ++i)\n        std::cout << \"Vertex\
  \ \" << i – c.begin()\n            << \" is in component \" << i << std::endl;\n\
  \    return EXIT_SUCCESS;\n}\n```\n输出结果为\nTotal number of components: 3\nVertex\
  \ 0 is in component 0\nVertex 1 is in component 0\nVertex 2 is in component 1\n\
  Vertex 3 is in component 0\nVertex 4 is in component 0\nVertex 5 is in component\
  \ 2\n\n## 13.6 增量连通量\n\n本节描述了一组计算无向图连通分量的函数和类。这里使用的算法基于并查集（disjoint-sets）数据结构，对于图不断增长（添加边）且需要重复更新连通分量信息的情况，这是最佳方法。并查集类在\
  \ [16] 中描述。\n\n以下操作是用于计算和维护连通分量的主要函数。这里使用的对象是图 `g`、并查集对象 `ds` 以及顶点 `u` 和 `v`。\n\n\
  - `initialize_incremental_components(g, ds)`：并查集结构的基础初始化。图 `g` 中的每个顶点都属于它自己的集合。\n\
  - `incremental_components(g, ds)`：根据图 `g` 中的边计算连通分量，并将信息嵌入 `ds` 中。\n- `ds.find_set(v)`：从并查集对象中提取顶点\
  \ `v` 的所在分量信息。\n- `ds.union_set(u, v)`：当边 `u, v` 添加到图时，更新并查集对象。\n\n# 复杂度\n\n整个过程的时间复杂度为\
  \ `O`(|V| + |E|)，其中 `|E|` 是处理结束时图中边的总数，`|V|` 是顶点的数量。`α` 是阿克函数的反函数，该函数具有爆炸性的指数增长。因此，在所有实际用途中，`α(m,\
  \ n) ≤ 4`，这意味着时间复杂度仅略大于 `O`(|V| + |E|)。\n\n### 示例\n\n使用并查集数据结构在添加边的同时，维护图的连通分量。此示例的完整源代码可以在\
  \ `example/incremental-components.cpp` 中找到。\n\n```cpp\n// 创建图\ntypedef adjacency_list\
  \ <vecS, vecS, undirectedS> Graph;\ntypedef graph_traits<Graph>::vertex_descriptor\
  \ Vertex;\nconst int N = 6;\nGraph G(N);\nadd_edge(0, 1, G);\nadd_edge(1, 4, G);\n\
  // 创建并查集对象，需要秩和父顶点属性\nstd::vector<Vertex> rank(num_vertices(G));\nstd::vector<Vertex>\
  \ parent(num_vertices(G));\ntypedef std::vector<graph_traits<Graph>::vertices_size_type>::iterator\
  \ Rank;\ntypedef std::vector<Vertex>::iterator Parent;\ndisjoint_sets<Rank, Parent>\
  \ ds(rank.begin(), parent.begin());\n// 确定连通分量，并将结果存储在并查集对象中\ninitialize_incremental_components(G,\
  \ ds);\nincremental_components(G, ds);\n// 添加更多边并更新并查集\ngraph_traits<Graph>::edge_descriptor\
  \ e;\nbool flag;\ntie(e,flag) = add_edge(4, 0, G);\nds.union_set(4,0);\ntie(e,flag)\
  \ = add_edge(2, 5, G);\nds.union_set(2,5);\ngraph_traits<Graph>::vertex_iterator\
  \ i,end;\nfor (tie(i,end) = vertices(G); i != end; ++i)\n    std::cout << \"representative[\"\
  \ << *i << \"] = \" << ds.find_set(*i) << std::endl;\nstd::cout << std::endl;\n\
  typedef component_index<unsigned int> Components;\nComponents components(parent.begin(),\
  \ parent.end());\nfor (Components::size_type i = 0; i < components.size(); ++i)\
  \ {\n    std::cout << \"component \" << i << \" contains: \";\n    for (Components::value_type::iterator\
  \ j = components[i].begin();\n         j != components[i].end(); ++j)\n        std::cout\
  \ << *j << \" \";\n    std::cout << std::endl;\n}\n```\n*(注：由于原文代码块不完整且存在混乱，翻译时根据逻辑补全了示例代码的结构)*\n\
  \n\n\n\n### 组件的关联类型\n\n`component_index` 的 `value_type` 是一个具有以下关联类型的组件。\n\n`value_type::value_type`\n\
  \n组件对象的值类型是一个顶点 ID。\n\n`value_type::iterator`\n\n`value_type::const_iterator`\n\n\
  此迭代器可以用于遍历组件中的所有顶点。该迭代器解引用后返回一个顶点 ID。\n\n### 组件的成员函数\n\n`component_index` 的 `value_type`\
  \ 是组件的表示，并具有以下成员函数。\n\n`iterator begin() const`\n\n返回一个指向组件中第一个顶点的迭代器。\n\n`iterator\
  \ end() const`\n\n返回一个指向组件中最后一个顶点之后的的迭代器。\n\n## 13.7 最大流算法\n\n#### 13.7.1 `edmunds_karp_max_flow`\n\
  \n```cpp\ntemplate <typename Graph, typename P, typename T, typename R>\ntypename\
  \ detail::edge_capacity_value<Graph, P, T, R>::type\nedmunds_karp_max_flow(Graph&\
  \ g,\n   typename graph_traits<Graph>::vertex_descriptor src,\n   typename graph_traits<Graph>::vertex_descriptor\
  \ sink,\n   const bgl_named_params<P, T, R>& params = all defaults)\n```\n\n`push_relabel_flow()`\
  \ 函数计算网络的最大流（参见第 8 章）。最大流是函数的返回值。该函数还计算流值 *f*(*u*, *v*) ∀(*u*, *v*) ![image](img/sigma.jpg)\
  \ *E*，这些值以剩余容量 *r*(*u*, *v*) = *c*(*u*, *v*) – *f*(*u*, *v*) 的形式返回。\n\n##### 定义位置\n\
  \n`boost/graph/edmunds_karp_max_flow.hpp`\n\n##### 参数\n\nIN: `Graph& g`\n\n一个有向图。图的类型必须是\
  \ `VertexListGraph` 和 `IncidenceGraph` 的模型。对于图中的每条边 (*u, v*)，反向边 (*v, u*) 必须也在图中。\n\
  \nIN: `vertex_descriptor src`\n\n流网络图的源顶点。\n\nIN: `vertex_descriptor sink`\n\n流网络图的汇顶点。\n\
  \n##### 命名参数\n\nIN: `capacity_map(CapacityEdgeMap cap)`\n\n边容量属性图。该类型必须是常量 `LvaluePropertyMap`\
  \ 的模型。映射的键类型必须是图的边描述符类型。\n\n**默认：** `get(edge_capacity, g)`\n\nOUT: `residual_capacity_map(ResidualCapacityEdgeMap\
  \ res)`\n\n边剩余容量属性图。该类型必须是可变 `LvaluePropertyMap` 的模型。映射的键类型必须是图的边描述符类型。\n\n**默认：**\
