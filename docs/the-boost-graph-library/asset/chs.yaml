  , g);\n```\n\n# 第 8 章 最大流\n\n最大流问题是确定某种数量（例如水）能够通过网络传输的最大量的问题。\n\n求解最大流问题的算法有着悠久的历史，第一个算法由\
  \ Ford 和 Fulkerson 提出 [12]。目前为止已知的通用算法是 Goldberg 的 push-relabel（推重标记）算法 [9, 16,\
  \ 17]，它基于 Karzanov 引入的*预流*（preflow）概念 [20]。\n\nBGL 包含了两种计算最大流的算法：Edmonds–Karp 算法（Ford–Fulkerson\
  \ 算法的改进版）和 push-relabel 算法。\n\n## 8.1 定义\n\n*流网络*是一个有向图 *G* = (*V, E)*，包含一个*源*顶点\
  \ *s* 和*汇*顶点 *t*。每条边都有一个正实值的*容量*（capacity），并且在每对顶点上定义了一个*流函数* *f*。流函数必须满足三个约束：\n\
  \n![image](img/105fig01.jpg)\n\n网络的*流*是进入汇顶点 *t* 的净流量。边的*残量容量*是 *r*(*u, v*) = *c*(*u,\
  \ v*) – *f*(*u, v*)。*r*(*u, v*) > 0 的边是残量边 *E[f]*，它们引导出残量图 *G[f]* = (*V, E[f]*)。*r*(*u,\
  \ v*) = 0 的边是*饱和*（saturated）。\n\n![image](img/105fig02.jpg)\n\n最大流问题是确定 *|f|* 的最大可能值以及图中每对顶点对应的流值。流网络的一个重要属性是最大流与割（cut）有关。根据最大流最小割定理\
  \ [12]，从源 *s* 到汇 *t* 的最大流等于割开两者的最小容量。\n\n## 8.2 边连通性\n\n无论工程师是在设计电话网络、局域网还是互联网，一个重要的考虑因素是网络对损伤的韧性。例如，如果电缆在风暴中被中断，是否还有其他电缆可以传输？在图术语中，这通过图的边连通性来描述。计算图的边连通性可以转化为一系列最大流问题。\n\
  \n具体来说，对于无向图，让 *α*(*u, v*) 表示断开顶点 *u* 和 *v* 的最小边数。如果将这两个顶点视为源汇汇并将每条边的容量设置为 1，那么最小容量割（通过最大流算法计算）就等于最小边数。因此，通过求解最大流，我们也确定了可以切断的边。现在，为了找到整个图的边连通性，可以对每对顶点运行最大流算法。所有顶点对割的最小值将是图的最小割。\n\
  \n对每对顶点执行最大流代价很大，因此减少需要检查的顶点对会更好。这可以通过利用最小断开集的特殊属性来实现![image](img/106fig02.jpg)。设\
  \ *p* 为最小度顶点，*δ* 为最小度。如果 *α*(*G*) = *δ*，则 *S** 就是 *p*。如果 *α*(*G*) ≤ δ – 1，则可以证明对于\
  \ *S** 的任何子集 *S*，相对于 *S* 中顶点的非邻居顶点集合是非空的。这意味着最小割可以通过从 *S* = *p* 开始，从 *S* 的非邻居集合中选取顶点\
  \ *k*，计算 *α*(*p, k*)，然后将 *k* 加入 *S* 来重复此过程，直到 *S* 的非邻居集合为空。\n\n\n\n我们将边连通性算法实现为一个函数模板，它使用了\
  \ `BGL VertexListGraph` 接口。该函数返回图的边连通性，并将断开集中的边写入输出迭代器。边连通性函数的概要如下。\n\n```cpp\n\
  template <typename VertexListGraph, typename OutputIterator>\ntypename graph_traits<VertexListGraph>::degree_size_type\n\
  edge_connectivity(VertexListGraph& g, OutputIterator disconnecting_set)\n{\n  //\
