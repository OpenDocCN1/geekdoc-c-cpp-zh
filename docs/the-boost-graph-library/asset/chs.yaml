  \n![image](img/open.jpg)topo-sort-with-sgb.cpp 122a![image](img/close.jpg) ≡\n\n\
  ```cpp\n#include <vector>\n#include <string>\n#include <iostream>\n#include <boost/graph/topological_sort.hpp>\n\
  #include <boost/graph/stanford_graph.hpp>\n\nint main()\n{\n    using namespace\
  \ boost;\n    ![image](img/open.jpg)创建一个 SGB 图 122b![image](img/close.jpg)\n   \
  \ ![image](img/open.jpg)为任务创建标签 122c![image](img/close.jpg)\n}\n```\n\n\n\n\n\n\
  ![image](img/open.jpg)向 SGB 图添加边 123a![image](img/close.jpg)\n\n![image](img/open.jpg)对\
  \ SGB 图进行拓扑排序 123b![image](img/close.jpg)\n\n```cpp\ngb_recycle(sgb_g);\n\nreturn\
  \ EXIT_SUCCESS;\n}\n```\n\n我们通过调用 SGB 函数 `gb_new_graph()` 创建一个 SGB 图。\n\n![image](img/open.jpg)创建一个\
  \ SGB 图 122b![image](img/close.jpg) ≡\n\n```cpp\nconst int n_vertices = 7;\nGraph*\
  \ sgb_g = gb_new_graph(n_vertices);\n```\n\n接下来，我们为图中的任务（顶点）编写标签。由于在 `stanford_graph.hpp`\
  \ 中定义了 `sgb_vertex_id_map`，通过它可以轻松地将 SGB 顶点描述符转换为整数，因此将标签存储在数组中是非常方便的。\n\n![image](img/open.jpg)为任务创建标签\
  \ 122c![image](img/close.jpg) ≡\n\n```cpp\nconst char* tasks[ ] = {\n  \"pick up\
  \ kids from school\",\n  \"buy groceries (and snacks)\",\n  \"get cash at ATM\"\
  ,\n  \"drop off kids at soccer practice\",\n  \"cook dinner\",\n  \"pick up kids\
  \ from soccer\",\n  \"eat dinner\" };\nconst int n_tasks = sizeof(tasks) / sizeof(char*);\n\
  ```\n\nSGB 图将图的顶点存储在数组中，因此我们可以通过数组的偏移量访问任何顶点。`gb_new_edge` 函数接受两个 `Vertex*` 参数和一个边权重（我们不需要它）。\n\
  \n![image](img/open.jpg)向 SGB 图添加边 123a![image](img/close.jpg) ≡\n\n```cpp\ngb_new_arc(sgb_g->vertices\
  \ + 0, sgb_g->vertices + 3, 0);\ngb_new_arc(sgb_g->vertices + 1, sgb_g->vertices\
  \ + 3, 0);\ngb_new_arc(sgb_g->vertices + 1, sgb_g->vertices + 4, 0);\ngb_new_arc(sgb_g->vertices\
  \ + 2, sgb_g->vertices + 1, 0);\ngb_new_arc(sgb_g->vertices + 3, sgb_g->vertices\
  \ + 5, 0);\ngb_new_arc(sgb_g->vertices + 4, sgb_g->vertices + 6, 0);\ngb_new_arc(sgb_g->vertices\
  \ + 5, sgb_g->vertices + 6, 0);\n```\n\n接下来，我们执行拓扑排序。我们将 SGB 图原封地传递给算法。这一次，我们不再创建颜色映射，而是让算法为自己创建一个。然而，为了实现这一点，`topological_sort()`\
  \ 函数需要一个从顶点到整数的映射。SGB–BGL 接口提供了这种属性映射。顶点到索引的属性映射通过调用 `get(vertex_index,sgb_g)` 获取。\n\
  \n![image](img/open.jpg)对 SGB 图进行拓扑排序 123b![image](img/close.jpg) ≡\n\n```cpp\n\
  typedef graph_traits<Graph*>::vertex_descriptor vertex_t;\n\nstd::vector<vertex_t>\
  \ topo_order;\ntopological_sort(sgb_g, std::back_inserter(topo_order),\n  vertex_index_map(get(vertex_index,\
  \ sgb_g)));\n\nint n = 1;\nfor (std::vector<vertex_t>::reverse_iterator i = topo_order.rbegin();\n\
  \     i != topo_order.rend(); ++i, ++n)\n  std::cout << n << \": \" << tasks[get(vertex_index,\
  \ sgb_g)[*i]] << std::endl;\n```\n\n## 10.3 实现图适配器\n\n为其他图库和数据结构实现新的适配器并不困难。作为创建新适配器的示例，本节将详细解释为\
  \ LEDA `GRAPH` 提供的 BGL 接口的实现方法。\n\n创建适配器面临的首要问题是应该实现哪些 BGL 概念。以下概念在 LEDA 之上实现起来非常简单：`VertexListGraph`、`BidirectionalGraph`、`VertexMutableGraph`\
  \ 和 `EdgeMutableGraph`。\n\n与 BGL 图类相关的所有类型都通过 `graph_traits` 类访问。该 traits 类可以按照以下方式对\
  \ LEDA `GRAPH` 类进行部分特化。`node` 和 `edge` 类型是 LEDA 中顶点和边描述符的等价物。LEDA `GRAPH` 用于有向图，因此我们为\
  \ `directed_category` 选择了 `directed_tag`。LEDA `GRAPH` 不会自动防止并行边的插入，因此我们为 `edge_parallel_category`\
  \ 选择了 `allow_parallel_edge_tag`。LEDA 函数 `number_of_nodes()` 的返回类型为 `int`，因此我们为图的\
  \ `vertices_size_type` 选择该类型。用于 `traversal_category` 的标签类型必须反映图类型模拟了哪些遍历概念。因此，我们创建了一个继承自\
  \ `bidirectional_graph_tag`、`adjacencygraph_tag` 和 `vertex_list_graph_tag` 的标签类。迭代类型将在后文中描述。\n\
  \n![image](img/open.jpg)LEDA 图的 traits 124![image](img/close.jpg) ≡\n\n```cpp\n\
  namespace boost {\n\n  struct leda_traversal_category:\n    public bidirectional_graph_tag,\n\
  \    public adjacencygraph_tag,\n    public vertex_list_graph_tag;\n\n  template\
  \ <typename V, typename E>\n  struct graph_traits<GRAPH> {\n    typedef node vertex_descriptor;\n\
  \    typedef edge edge_descriptor;\n    typedef directed_tag directed_category;\n\
  \    typedef allow_parallel_edge_tag edge_parallel_category;\n    typedef int vertices_size_type;\n\
  \    typedef leda_traversal_category traversal_category;\n  };\n}\n```\n\n首先编写 `BidirectionalGraph`\
  \ 的 `source()` 和 `target()` 函数。我们使用 LEDA `GRAPH` 类型作为图参数，并使用 `graph_traits` 指定边参数。如果需要更改顶点或边的类型，只需在\
  \ `graph_traits` 中一处完成。LEDA 提供了 `source()` 和 `target()` 函数，因此我们只需调用它们。\n\n```cpp\n\
  template <typename V, typename E>\ntypename graph_traits<V,E> >vertex_descriptor\n\
  source(typename graph_traits<V,E> >edge_descriptor e, const GRAPH& g)\n{\n  return\
  \ e.source();\n}\n\ntemplate <typename V, typename E>\ntypename graph_traits<V,E>\
  \ >vertex_descriptor\ntarget(typename graph_traits<V,E> >edge_descriptor e, const\
  \ GRAPH& g)\n{\n  return e.target();\n}\n```\n\n我们需要实现的来自 `IncidenceGraph` 的下一个函数是\
  \ `out_edges()`。该函数返回一对出边迭代器。由于 LEDA 不使用 STL 风格的迭代器，因此需要实现它们。幸运的是，Boost 有用于实现迭代器的工具，即\
  \ `iterator_adaptor`。`iterator_adaptor` 类允许用户通过提供策略类来创建标准的迭代器。以下代码是我们出边迭代器的策略类。在\
  \ LEDA 中，边对象本身被用作迭代器。它具有 `Succ_Adj_Edge()` 和 `Pred_Adj_Edge()` 函数用于移动到下一个和前一个边。\n\
  \n![image](img/open.jpg)出边迭代器策略 125b![image](img/close.jpg) ≡\n\n```cpp\nstruct\
  \ leda_out_edge_iterator_policies\n{\n  template <typename Iter>\n  static void\
  \ increment(Iter& i) { i.base() = Succ_Adj_Edge(i.base(), 0); }\n\n  template <typename\
  \ Iter>\n  static void decrement(Iter& i) { i.base() = Pred_Adj_Edge(i.base(), 0);\
  \ }\n\n  template <typename Iter>\n  static typename Iter::reference dereference(const\
  \ Iter& i) { return i.base(); }\n\n  template <typename Iter>\n  static bool equal(const\
  \ Iter& x, const Iter& y) { return x.base() == y.base(); }\n};\n```\n\n现在使用 `iterator_adaptor`\
  \ 来填充 `out_edge_iterator` 类型。`iterator_adaptor` 的两个模板参数是适配类型和策略类。后续参数指定了迭代器的关联类型，例如值类型和引用类型。\n\
  \n![image](img/open.jpg)出边迭代器类型 125c![image](img/close.jpg) ≡\n\n\n\n\n\n```cpp\n\
  typedef iterator_adaptor<edge, leda_out_edge_iterator_policies,\n  edge, const edge&,\
  \ const edge*, std::forward_iterator_tag, std::ptrdiff_t\n> out_edge_iterator;\n\
  ```\n\n有了在 `graph_traits` 中定义的 `out_edge_iterator`，我们就可以准备定义 `out_edges()` 函数了。在下面的定义中，返回类型应该是一对出边迭代器，因此我们使用\
  \ `std::pair` 然后通过 `graph_traits` 来访问出边迭代器类型。在函数体中，我们通过传入第一个相邻边作为起始迭代器，并传入 `0` 作为结束迭代器（`0`\
  \ 在 LEDA 中被用作结束哨兵）来构造出边迭代器。`First_Adj_Edge` 的参数 `0` 告诉 LEDA 我们想要的是出边（而不是入边）。\n\n\
  ![image](img/open.jpg)LEDA 的出边函数 126a![image](img/close.jpg) ≡\n\n```cpp\ntemplate\
  \ <typename V, typename E>\nstd::pair<typename graph_traits< GRAPH<V,E> >::out_edge_iterator,\n\
  \          typename graph_traits < GRAPH<V,E> >::out_edge_iterator>\nout edges(typename\
  \ graph_traits < GRAPH<V,E> >::vertex_descriptor u,\n          const GRAPH<V,E>&\
  \ g)\n{\n  typedef typename graph_traits< GRAPH<V,E> >::out_edge_iterator Iter;\n\
  \  return std::make_pair( Iter(First_Adj_Edge(u, 0)), Iter(0) );\n}\n```\n\n其余迭代器类型和接口函数是使用相同技术构建的。LEDA\
  \ 包装接口的完整代码位于 `boost/graph/leda_graph.hpp`。在下面的代码中，我们使用 BGL 概念检查来确保我们正确实现了 BGL 接口。这些检查并不测试实现的运行时行为；运行时行为是在\
  \ `test/graph.cpp` 中测试的。\n\n![image](img/open.jpg)leda-concept-check.cpp 126b![image](img/close.jpg)\
  \ ≡\n\n```cpp\n#include <boost/graph/graph_concepts.hpp>\n#include <boost/graph/leda_graph.hpp>\n\
  int main()\n{\n  typedef GRAPH<int,int> Graph;\n  function_requires < VertexListGraphConcept<Graph>\
  \ >();\n  function_requires < BidirectionalGraphConcept<Graph> > ();\n  function_requires\
  \ < VertexMutableGraphConcept<Graph> >();\n  function_requires < EdgeMutableGraphConcept<Graph>\
  \ > ();\n  return EXIT_SUCCESS;\n}\n```\n\n# 第 11 章 性能指南\n\n在本章中，我们讨论了 BGL 图族 `adjacency_list`\
  \ 各种选择选择对性能的影响。其目的是为 BGL 用户提供一些基本指南，说明在不同情况下哪些图类型可能效率最高。我们展示了一系列实验，显示了在几种 BGL `adjacency_list`\
  \ 变体上不同基本操作的性能。实验研究了稀疏图和稠密图，并使用了两种不同的编译器（Microsoft Visual C++ 和 GNU C++）。\n\n作为主要的\
  \ BGL 图组件，`adjacency_list` 允许用户控制用于内部图结构的实际数据结构。它的前两个模板参数 `EdgeList` 和 `VertexList`\
  \ 分别用于选择实际的容器来表示出边序列和顶点序列。用户可以使用 `vecS`、`listS` 或 `setS` 作为 `EdgeList`，以选择 `std::vector`、`std::list`\
  \ 或 `std::set`。用户可以指定 `vecS` 或 `listS` 分别选择 `std::vector` 或 `std::list` 作为骨干。\n\n\
  ## 11.1 图类比较\n\n实验比较了 `adjacency_list` 几种变体的性能。实验涵盖了大多数基本图操作：插入和删除顶点及边，以及沿着顶点、边和每个顶点的出边遍历图。实验是在小型（100\
  \ 个顶点）、中型（1,000 个顶点）和大型（10,000 个顶点）的稀疏图和稠密图上进行的。对于稀疏图，边的数量是顶点数的十倍。对于稠密图，边的总数是顶点数的平方。\n\
  \n计时运行在一台具有双 733MHz CPU 的 Dell 机器上，内存为 512 MB。实验针对两个编译器进行了重复：cygwin 下的 Microsoft\
  \ Visual C++ 6.0 和 GNU C++ 2.95.3。Visual C++ 的优化标志设置为最高速度。Visual C++ 的 `-O3` 优化标志被设置为最高速度。\n\
  \n### 11.1.1 结果与讨论\n\n### 添加边和顶点\n\n对于第一个实验，我们调用 `add_vertex()` 和 `add_edge()` 直到图拥有边和顶点。结果所示图\
  \ 11.1。这里的这里的获胜者是带有 `VertexList=listS` 选择器的 `adjacency_list` 类之一。\n\n**图 11.1 添加边和顶点的结果。**\n\
  \n### 添加边\n\n对于这个实验，我们向已有顶点的图添加边。结果所示图 11.2。使用 Visual C++ 的明显获胜者是带有 `VertexList=vecS`\
  \ 选择器的 `adjacency_list`，无论图的大小和稀疏程度如何。使用 GNU C++ 时，当图稀疏时，带有 `EdgeList=listS` 的 `adjacency_list`\
  \ 类胜出。\n\n**图 11.2 添加边的计时结果。**\n\n### 删除边\n\n这个实验在带有顶点的图上添加和删除边。结果所示图 11.3。对于顶点数较少的图，这里的结果并不明显。然而，显然，带有\
  \ `VertexList=setS` 选择器的 `adjacency_list` 是大型图的获胜者。\n\n**图 11.3 删除边的计时结果。**\n\n\
  ### 删除顶点\n\n这个实验向图中添加顶点和边，然后删除所有顶点。结果所示图 11.4。这里的明显获胜者是 `listlist`，它是专门为此操作设计的。`adjacency_list`\
  \ 的其他变体在此项操作上的表现糟糕，因为它的实现不是常数时间复杂度。\n\n**图 11.4 删除顶点的计时结果。**\n\n\n\n\n\n此实验向图中添加了\
  \ |V| 个顶点和 |E| 条边，然后清除并移除所有顶点。`clear_vertex()` 操作会遍历图并移除所有引用该顶点的边。结果如图图 11.5 所示。随着图规模不断增大，显然带有\
  \ `VertexList=vecS` 的 `adjacency_list` 是获胜者。\n\n**图 11.5. 清除顶点的实验计时结果。**\n\n![image](img/11fig05.jpg)\n\
  \n### 顶点集遍历\n\n此实验遍历图中的所有顶点，从每个顶点读取一个内部属性值。结果如图图 11.6 所示。在头三种图类型中这里没有明显的获胜者。由于这些图类具有相同的\
  \ `VertexList=vecS`，因此顶点遍历速度非常快。对于大图，`listlist` 的顶点遍历速度较慢，因为它使用了 `VertexList=listS`。\n\
  \n**图 11.6. 遍历顶点集的实验计时结果。**\n\n![image](img/11fig06.jpg)\n\n### 边集遍历\n\n此实验遍历图中所有的边，从每条边读取一个内部属性值。结果如图图\
  \ 11.7 所示。这里的明显获胜者是带有 `EdgeList=vecS` 的 `adjacency_list`。\n\n**图 11.7. 遍历边集的实验计时结果。**\n\
  \n![image](img/11fig07.jpg)\n\n### 出边遍历\n\n此实验遍历图中每个顶点的出边，从每个顶点和每条出边读取内部属性。结果如图图\
  \ 11.8 所示。这里的明显获胜者是带有 `EdgeList=vecS` 的 `adjacency_list`。\n\n**图 11.8. 遍历出边的实验计时结果。**\n\
  \n![image](img/11fig08.jpg)\n\n## 11.2 结论\n\n不同的组合在遍历速度和插入/删除速度之间有不同的权衡。以下总结了我们的实验结果。\n\
  \n- 为 `EdgeList` 使用 `vecS` 通常可以提供高效的出边遍历。\n- 为 `VertexList` 使用 `vecS` 通常可以提供高效的顶点集遍历。\n\
  - `EdgeList` 使用 `setS` 支持高效的边删除。特别是对于出边序列应使用 `std::set`。\n- 为了高效添加边，`EdgeList` 应使用\
  \ `vecS` 或 `listS`。\n- 如果移除顶点是常见操作，则应为 `VertexList` 使用 `listS`，因为使用 `std::list`\
  \ 作为骨干可以实现常时间内移除顶点。\n- 对于清除顶点，`VertexList` 使用 `vecS` 是一个很好的选择（可以使用 `clear_vertex()`\
  \ 函数移除所有关联边）。\n\n# 第二部分。参考手册\n\n## 第 12 章.BGL 概念\n\n本章描述了 BGL 中图的底层接口（基本概念）。这些概念分为三类：提供图遍历机制的机制、提供图修改机制的机制，以及访问附加在顶点和边上的属性的访问者（visitors）。\n\
  \n### 所有图概念需求中所使用的记法在此处汇总。\n\n![image](img/t0137-01.jpg)\n\n## 12.1 图遍历概念\n\nBoost\
  \ 图库（BGL）的核心是接口（以概念的形式表示），这些接口定义了如何以数据结构中立的方式检查和操作图。事实上，如第 9 章所示，BGL 图接口甚至不需要使用显式数据结构来实现。对于某些问题，基于某些函数隐式地定义图会更自然或更高效。\n\
  \nBGL 图接口并不是以单一概念的形式出现。相反，它被分解为更小的、不同的部分。概念的目的是封装算法的接口需求。为了最大化算法的可重用性，重要的是不要在接口中包含实际上对于算法正确运行所必需的操作。通过将图接口分解为更小且不同的概念，我们为图算法编写者提供了良好的选择，让他们从中选出提供算法所需功能的最小概念。\n\
  \n图 12.1 显示了图遍历概念之间的细化化关系。表 12.1 给出了图遍历概念的有效表达式和相关类型的总结。\n\n**图 12.1. 图概念及细化关系。**\n\
  \n![image](img/12fig01.jpg)\n\n**表 12.1. 图遍历概念总结。**\n\n![image](img/t0139-01.jpg)\n\
  \n![image](img/t0139-02.jpg)\n\n### 12.1.1 无向图\n\nBGL 为访问和操作无向图提供的接口与有向图的接口相同。接口相同是因为无向图和有向图之间存在等效性。也就是说，任何无向图都可以表示为有向图，其中每个无向边\
  \ (u, v) 被替换为两条有向边：(u, v) 和 (v, u)。这种有向图被称为无向图的`有向版本`。图 12.2 展示了一个无向图及其有向版本。注意，对于无向图中的每条边，有向图都有两条边。因此，BGL\
  \ 使用 `out_edges()` 函数（或 `in_edges()`）来访问无向图中的关联边。同样，BGL 使用 `source()` 和 `target()`\
  \ 来访问顶点。起初看起来可能违背直觉。然而，通过识别无向图和有向图之间的等效性，BGL 允许许多算法应用于有向图和无向图。\n\n**图 12.2. 一个无向图及其等效向图。**\n\
  \n![image](img/12fig02.jpg)\n\n下面的示例演示了如何在无向图在使用 `out_edges()`、`source()` 和 `target()`。虽然边的方向对于无向图并不重要，但当对顶点\
  \ u 应用 `out_edges()` 函数时，边描述符的源顶点始终是 u，而目标顶点是 u 的相邻顶点。`in_edges()` 函数的情况亦然。\n\n\
  ```cpp\ntemplate <typename UndirectedGraph> void undirected_graph_demo1() {\n  const\
  \ int V = 3;\n  UndirectedGraph undigraph(V);\n  typename graph_traits<UndirectedGraph>::vertex_descriptor\
  \ zero, one, two;\n  typename graph_traits<UndirectedGraph>::out_edge_iterator out,\
  \ out_end;\n  typename graph_traits<UndirectedGraph>::in_edge_iterator in, in_end;\n\
  \  zero = vertex(0, undigraph);\n  one = vertex(1, undigraph);\n  two = vertex(2,\
  \ undigraph);\n  add_edge(zero, one, undigraph);\n  add_edge(zero, two, undigraph);\n\
  \  add_edge(one, two, undigraph);\n  std::cout << \"out_edges(0): \";\n  for (tie(out,\
  \ out_end) = out_edges(zero, undigraph); out != out_end; ++out)\n    std::cout <<\
  \ *out;\n  std::cout << std::endl << \"in_edges(0): \";\n  for (tie(in, in_end)\
  \ = in_edges(zero, undigraph); in != in_end; ++in)\n    std::cout << *in;\n  std::cout\
  \ << std::endl;\n}\n```\n\n输出结果为\n\nout_edges(0): (0,1) (0,2)\n\nin_edges(0): (1,0)\
  \ (2,0)\n\n\n\n\n尽管无向图的接口是相同的，但由于边的等价性定义不同，它们存在一些行为差异。在有向图中，边 `(u, v)` 永远不等于边 `(v,\
  \ u)`，但在无向图中它们可能是相等的。在不允许平行边的无向图（即非多图）中，`(u, v)` 与 `(v, u)` 是同一条边。然而，在多图中，这两个边可能是不同的（因为两条边\
  \ `(u, v)` 也可能是不同的）。\n\n在以下示例中，对于 `(u, v) = (v, u)` 的边等价性测试在有向图中返回 `false`，而在无向图中返回\
  \ `true`。这种差异也影响了 `add_edge()` 的含义。在有向图示例中，边 `(u, v)` 和 `(v, u)` 都被添加了，而在无向图示例中只添加了一条条边\
  \ `(u, v)`。如果在无向图中也添加了 `(v, u)`，我们将在 `u` 和 `v` 之间添加一条平行边（前提是图类型允许平行边）。边等价性的差异还影响附加的边属性。在有向图中，边\
  \ `(u, v)` 和 `(v, u)` 可以具有不同的权重，而在无向图中，`(u, v)` 的权重与 `(v, u)` 的权重相同，因为它们是同一条边。\n\
  \n首先是有向图的示例代码：\n\n```cpp\ntemplate <typename DirectedGraph>void directed_graph_demo()\
  \ {\n\n  const int V = 2;\n  DirectedGraph digraph(V);\n  typename graph_traits<DirectedGraph>::vertex_descriptor\
  \ u, v;\n  typedef typename DirectedGraph::edge_property_type Weight;\n  typename\
  \ property_map<DirectedGraph, edge_weight_t>::type\n      weight = get(edge_weight,\
  \ digraph);\n  typename graph_traits<DirectedGraph>::edge_descriptor e1, e2;\n \
  \ bool found;\n\n  u = vertex(0, digraph);\n  v = vertex(1, digraph);\n  add_edge(u,\
  \ v, Weight(1.2), digraph);\n  add_edge(v, u, Weight(2.4), digraph);\n  tie(e1,\
  \ found) = edge(u, v, digraph);\n  tie(e2, found) = edge(v, u, digraph);\n  std::cout\
  \ << \"in a directed graph is \";\n  std::cout << \"(u,v) == (v,u) ? \"\n      \
  \        << std::boolalpha << (e1 == e2) << std::endl;\n  std::cout << \"weight[(u,v)]\
  \ = \" << get(weight, e1) << std::endl;\n  std::cout << \"weight[(v,u)] = \" <<\
  \ get(weight, e2) << std::endl;\n}\n```\n\n输出结果：\n```\nin a directed graph is (u,v)\
  \ == (v,u) ? false\nweight[(u,v)] = 1.2\nweight[(v,u)] = 2.4\n```\n\n接下来是无向图的示例代码：\n\
  \n```cpp\ntemplate <typename UndirectedGraph> void undirected_graph_demo2()\n{\n\
  \n  const int V = 2;\n  UndirectedGraph undigraph(V);\n  typename graph_traits<UndirectedGraph>::vertex_descriptor\
  \ u, v;\n  typedef typename UndirectedGraph::edge_property_type Weight;\n  typename\
  \ property_map<UndirectedGraph, edge_weight_t>::type\n      weight = get(edge_weight,\
  \ undigraph);\n  typename graph_traits<UndirectedGraph>::edge_descriptor e1, e2;\n\
  \  bool found;\n\n  u = vertex(0, undigraph);\n  v = vertex(1, undigraph);\n  add_edge(u,\
  \ v, Weight(3.1), undigraph);\n  tie(e1, found) = edge(u, v, undigraph);\n  tie(e2,\
  \ found) = edge(v, u, undigraph);\n  std::cout << \"in an undirected graph is \"\
  ;\n  std::cout << \"(u,v) == (v,u) ? \"\n              << std::boolalpha << (e1\
  \ == e2) << std::endl;\n  std::cout << \"weight[(u,v)] = \" << get(weight, e1) <<\
  \ std::endl;\n  std::cout << \"weight[(v,u)] = \"   << get(weight, e2) << std::endl;\n\
  }\n```\n\n输出结果：\n```\nin an undirected graph is (u,v) == (v,u) ? true\nweight[(u,v)]\
  \ = 3.1\nweight[(v,u)] = 3.1\n```\n\n### 12.1.2 图\n\n`Graph` 概念定义了所有图概念通用的关联类型。这些关联类型是在许多图操作中起辅助作用的辅助类型。与\
  \ STL 的迭代器类似，关联类型通过特性的类（traits class）来访问——在这种情况下，是 `graph_traits` 类。使用特性的类机制是 BGL\
  \ 算法如此灵活的原因之一。例如，图数据结构识别顶点的方式非常多样。邻接列表风格的实现可能使用整数来表示顶点，使用该整数偏移到相应的出边列表。面向对象的图实现可能使用指向堆分配的顶点对象的指针。通过\
  \ `graph_traits` 类，这些差异被 `vertex_descriptor` 关联类型隐藏了。\n\n在接下来的示例中，`(u, v) = (v,\
  \ u)` 的边等价性测试在有向图中返回 `false`，在无向图中返回 `true`。这种差异也影响了 `add_edge()` 的含义。在有向图示例中，边\
  \ `(u, v)` 和 `(v, u)` 都被添加了，而在无向图示例中只添加了一条边 `(u, v)`。如果在无向图中也添加了 `(v, u)`，我们将在 `u`\
  \ 和 `v` 之间添加一条平行边（前提是图类型允许平行边）。边等价性的差异还影响了附加的边属性。在有向图中，边 `(u, v)` 和 `(v, u)` 可以具有不同的权重值，而在无向图中，`(u,\
  \ v)` 的权重与 `(v, u)` 的权重相同，因为它们是同一条边。\n\n首先是有向图的示例代码：\n\n```cpp\ntemplate <typename\
  \ DirectedGraph>void directed_graph_demo() {\n\n  const int V = 2;\n  DirectedGraph\
  \ digraph(V);\n  typename graph_traits<DirectedGraph>::vertex_descriptor u, v;\n\
  \  typedef typename DirectedGraph::edge_property_type Weight;\n  typename property_map<DirectedGraph,\
  \ edge_weight_t>::type\n      weight = get(edge_weight, digraph);\n  typename graph_traits<DirectedGraph>::edge_descriptor\
  \ e1, e2;\n  bool found;\n\n  u = vertex(0, digraph);\n  v = vertex(1, digraph);\n\
  \  add_edge(u, v, Weight(1.2), digraph);\n  add_edge(v, u, Weight(2.4), digraph);\n\
  \  tie(e1, found) = edge(u, v, digraph);\n  tie(e2, found) = edge(v, u, digraph);\n\
  \  std::cout << \"in a directed graph is \";\n  std::cout << \"(u,v) == (v,u) ?\
  \ \"\n              << std::boolalpha << (e1 == e2) << std::endl;\n  std::cout <<\
  \ \"weight[(u,v)] = \" << get(weight, e1) << std::endl;\n  std::cout << \"weight[(v,u)]\
  \ = \" << get(weight, e2) << std::endl;\n}\n```\n\n输出结果：\n```\nin a directed graph\
  \ is (u,v) == (v,u) ? false\nweight[(u,v)] = 1.2\nweight[(v,u)] = 2.4\n```\n\n接下来是无向图的示例代码：\n\
  \n```cpp\ntemplate <typename UndirectedGraph> void undirected_graph_demo2()\n{\n\
  \n  const int V = 2;\n  UndirectedGraph undigraph(V);\n  typename graph_traits<UndirectedGraph>::vertex_descriptor\
  \ u, v;\n  typedef typename UndirectedGraph::edge_property_type Weight;\n  typename\
  \ property_map<UndirectedGraph, edge_weight_t>::type\n      weight = get(edge_weight,\
  \ undigraph);\n  typename graph_traits<UndirectedGraph>::edge_descriptor e1, e2;\n\
  \  bool found;\n\n  u = vertex(0, undigraph);\n  v = vertex(1, undigraph);\n  add_edge(u,\
  \ v, Weight(3.1), undigraph);\n  tie(e1, found) = edge(u, v, undigraph);\n  tie(e2,\
  \ found) = edge(v, u, undigraph);\n  std::cout << \"in an undirected graph is \"\
  ;\n  std::cout << \"(u,v) == (v,u) ? \"\n              << std::boolalpha << (e1\
  \ == e2) << std::endl;\n  std::cout << \"weight[(u,v)] = \" << get(weight, e1) <<\
  \ std::endl;\n  std::cout << \"weight[(v,u)] = \"   << get(weight, e2) << std::endl;\n\
  }\n```\n\n输出结果：\n```\nin an undirected graph is (u,v) == (v,u) ? true\nweight[(u,v)]\
  \ = 3.1\nweight[(v,u)] = 3.1\n```\n\n### 12.1.2 图\n\n`Graph` 概念定义了所有图概念通用的关联类型。这些关联类型是在许多图操作中起辅助作用的辅助类型。与\
