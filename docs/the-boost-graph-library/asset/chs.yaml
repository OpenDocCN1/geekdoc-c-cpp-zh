  \ I will ensure it's there).\n\n### 12.1.2 Graph\n\n`Graph` 概念定义了所有图概念通用的关联类型。这些关联类型是在许多图操作中起辅助作用的辅助类型。与\
  \ STL 的迭代器类似，关联类型通过特性的类（ traits class）来访问——在这种情况下，是 `graph_traits` 类。使用特性的类机制是 BGL\
  \ 算法如此灵活的原因之一。例如，图数据结构识别顶点的方式非常多样。邻接列表风格的实现可能使用整数来表示顶点，使用该整数偏移到相应的出边列表。面向对象的图实现可能使用指向堆分配的顶点对象的指针。通过\
  \ `graph_traits` 类，这些差异被 `vertex_descriptor` 关联类型隐藏了。\n\n\n\n\nBidirectionalGraph\
  \ 概念细化了 IncidenceGraph 概念，并增加了对高效访问每个顶点入边（in-edges）的要求。该概念与 IncidenceGraph 离离开，是因为对有向图的入边提供高效访问通常需要更多的存储空间，而且许多算法并不访问入边。对于无向图来说，这不是问题，因为不需要额外的空间即可提供对入边的访问。\n\
  \n### 细化自\nIncidenceGraph\n\n### 关联类型\n`graph_traits<G>::in_edge_iterator`\n\n针对顶点\
  \ `v` 的入边迭代器提供了对 `v` 的入边的访问。因此，入边迭代器的值类型是该图的描述符类型。入边迭代器必须满足 `MultiPassInputIterator`\
