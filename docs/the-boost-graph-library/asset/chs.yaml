  \n（由 VertexListGraph 需要。）\n\n```\nedges_size_type num_edges(const adjacency_list&\
  \ g)\n```\n返回图 `g` 中的边数量。\n\n（由 EdgeListGraph 需要。）\n\n```\nvertex_descriptor vertex(vertices_size_type\
  \ n, const adjacency_list& g)\n```\n返回图顶点列表中的第 `n` 个顶点。\n\n```cpp\nstd::pair<edge_descriptor,\
  \ bool>\nedge(vertex_descriptor u, vertex_descriptor v, const adjacency_list& g)\n\
  ```\n返回图 `g` 中连接顶点 `u` 和顶点 `v` 的边。\n\n（由 AdjacencyMatrix 需要。）\n\n```cpp\nstd::pair<out_edge_iterator,\
  \ out_edge_iterator>\nedge_range(vertex_descriptor u, vertex_descriptor v, const\
  \ adjacency_list& g)\n```\n返回一对出边迭代器，提供从 `u` 到 `v` 的所有并行边的范围。此函数仅当 `adjacency_list`\
  \ 的 `EdgeList` 是一个根据目标顶点排序出边并允许并行边的容器时才有效。`multisetS` 选择器会选择这样的容器。\n\n```cpp\nstd::pair<edge_descriptor,\
  \ bool>\nadd_edge(vertex_descriptor u, vertex_descriptor v, adjacency_list& g)\n\
  ```\n向图中添加边 `(u, v)` 并返回新边的边描述符。对于不允许并行边的图，如果该边已于图中，则不会添加重复边，且 `bool` 标记位将为 `false`。此外，如果\
  \ `u` 和 `v` 是同一个顶点的描述符（创建了自环）且该图是无向的，则不会添加该边且标记位为 `false`。当标记位为 `false` 时，该边描述符是无效的，对其进行任何使用都是未定义的。新边在出边列表中的位置通常未指定，尽管可以通过选择\
  \ `EdgeList` 来完成出边的排序。如果 `VertexList` 选择器是 `vecS`，且顶点描述符 `u` 或 `v`（均为整数）的值大于图中当前的顶点数，则图会被扩展，使顶点数变为\
  \ `std::max(u,v) + 1`。如果 `EdgeList` 选择器是 `vecS`，则此操作会使顶点 `u` 的任何 `out_edge_iterator`\
  \ 失效。如果 `EdgeList` 是一个在调用 `push(container, x)` 时失效迭代器的用户定义容器，也适用。如果图也是双向的，则 `v`\
  \ 的任何 `in_edge_iterator` 也会失效。如果图是无向的，则 `v` 的任何 `out_edge_iterator` 也会失效。如果图是有向的，`add_edge()`\
  \ 还会使任何 `edge_iterator` 失效。\n\n（由 EdgeMutableGraph 需要。）\n\n```cpp\nstd::pair<edge_descriptor,\
  \ bool>\nadd_edge(vertex_descriptor u, vertex_descriptor v, const EdgeProperties&\
  \ p, adjacency_list& g)\n```\n向图中添加边 `(u, v)` 并将 `p` 附加为边内部属性存储的值。更多细节请参见上一个 `add_edge()`\
  \ 成员函数。\n\n（由 EdgeMutablePropertyGraph 需要。）\n\n```cpp\nvoid remove_edge(vertex_descriptor\
  \ u, vertex_descriptor v, adjacency_list& g)\n```\n从图中移除边 `(u, v)`。此操作会导致任何指向边 `(u,\
  \ v)` 的现有边描述符或迭代器失效。此外，如果 `EdgeList` 选择器是 `vecS`，则此操作会使指向顶点 `u` 边列表的迭代器失效，无向和双向情况下的顶点\
  \ `v` 也是如此。此外，对于有向图，这将使任何 `edge_iterator` 失效。\n\n（由 EdgeMutableGraph 需要。）\n\n```cpp\n\
  void remove_edge(edge_descriptor e, adjacency_list& g)\n```\n从图中移除边 `e`。在多图情况下，这与\
  \ `remove_edge(u, v, g)` 函数不同。此 `remove_edge(e, g)` 函数移除单条边，而 `remove_edge(u, v,\
  \ g)` 函数移除所有边 `(u, v)`。此操作会使由描述符 `e` 指向同一边的任何现有边描述符和迭代器失效。此外，此操作会使任何指向 `target(e,\
  \ g)` 边列表的迭代器失效。此外，对于有向图，这将使图的任何 `edge_iterator` 失效。\n\n（由 EdgeMutableGraph 需要。）\n\
  \n```cpp\nvoid remove_edge(out_edge_iterator iter, adjacency_list& g)\n```\n这与 `remove_edge(iter,\
  \ g)` 效果相同。区别在于该函数在向图中具有常数时间复杂度，而 `remove_edge(e, g)` 的时间复杂度为 `O(|E|/|V|)`。\n\n\
  （由 MutableIncidenceGraph 需要。）\n\n```cpp\ntemplate <typename Predicate>\nvoid remove_out_edge_if(vertex_descriptor\
  \ u, Predicate predicate, adjacency_list& g)\n```\n移除图中满足谓词的顶点 `u` 的出边。如果谓词应用于边描述符返回\
  \ `true`，则该边被移除。对描述符和迭代器的影响与对每个移除的边调用 `remove_edge()` 相同。\n\n（由 MutableIncidenceGraph\
  \ 需要。）\n\n```cpp\ntemplate <typename Predicate>\nvoid remove_in_edge_if(vertex_descriptor\
  \ v, Predicate predicate, adjacency_list& g)\n```\n移除图中满足谓词的顶点 `v` 的入边。如果谓词应用于边描述符返回\
  \ `true`，则该边被移除。对描述符和迭代器的影响与对每个移除的边调用 `remove_edge()` 相同。\n\n（由 BidirectionalGraph\
  \ 需要。）\n\n```cpp\ntemplate <typename Predicate>\nvoid remove_edge_if(Predicate predicate,\
  \ adjacency_list& g)\n```\n移除图中满足谓词的边。如果谓词应用于边描述符返回 `true`，则边被移除。对描述符和迭代器的影响与对每个移除的边调用\
  \ `remove_edge()` 相同。\n\n（由 MutableEdgeListGraph 需要。）\n\n```cpp\nvertex_descriptor\
  \ add_vertex(adjacency_list& g)\n```\n向图中添加顶点并返回新顶点的顶点描述符。\n\n（由 VertexMutableGraph\
  \ 需要。）\n\n```cpp\nvertex_descriptor add_vertex(const VertexProperties& p, adjacency_list&\
  \ g)\n```\n向图中添加顶点并返回新顶点的顶点描述符。\n\n（由 VertexMutablePropertyGraph 需要。）\n\n```cpp\n\
  void clear_vertex(vertex_descriptor u, adjacency_list& g)\n```\n从图中进入和离开顶点 `u` 的所有边。该顶点仍在顶点集中。对描述符和迭代器的影响与对所有源或目标为\
  \ `u` 的边调用 `remove_edge()` 相同。\n\n（由 EdgeMutableGraph 需要。）\n\n```cpp\nvoid clear_out_edges(vertex_descriptor\
  \ u, adjacency_list& g)\n```\n移除顶点 `u` 的所有边。该顶点仍在顶点集中。对描述符和迭代器的影响与对所有源为 `u` 的边调用\
  \ `remove_edge()` 相同。此操作不适用于无向图（请用 `clear_vertex()` 代替）。\n\n```cpp\nvoid clear_in_edges(vertex_descriptor\
  \ u, adjacency_list& g)\n```\n从图中移除进入和离开顶点 `u` 的所有边。该顶点仍在顶点集中。对描述符和迭代器的影响与对所有源或目标为\
  \ `u` 的边调用 `remove_edge()` 相同。此操作仅适用于双向图。\n\n```cpp\nvoid remove_vertex(vertex_descriptor\
  \ u, adjacency_list& g)\n```\n从图中移除顶点 `u`。\n\n\n\n\n从图中顶点集中移除顶点 `u`。假设在移除顶点 `u`\
  \ 时，没有指向或来自该顶点的边。确保这一点的一种方法是预先调用 `clear_vertex()`。如果 `adjacency_list` 的模板参数 `VertexList`\
  \ 为 `vecS`，则此操作会导致图中所有的顶点描述符、边描述符和迭代器失效。每个顶点的内置 `vertex_index_t` 属性将被重新编号，以便在操作后顶点索引仍然形成一个连续范围\
  \ [0, |V|)。如果你使用基于内置顶点索引的外部属性存储，则需要调整外部存储。另一种选项是不使用内置顶点索引，而是使用一个属性来添加你自定义的顶点索引属性。如果你需要频繁使用\
  \ `remove_vertex()` 函数，那么 `listS` 选择器是 `VertexList` 模板参数更好的更好的选择。\n\n（由 `VertexMutableGraph`\
  \ 要求。）\n\n```cpp\ntemplate <typename PropertyTag>\nproperty_map<adjacency_list,\
  \ PropertyTag>::type\nget(PropertyTag, adjacency_list& g)\n```\n\n返回一个由 `PropertyTag`\
  \ 指定的顶点属性的可变属性映射对象。`PropertyTag` 必须匹配图中 `VertexProperties` 模板参数中指定的属性之一。\n\n（由 `PropertyGraph`\
  \ 要求。）\n\n```cpp\ntemplate <typename PropertyTag>\nproperty_map<adjacency_list,\
  \ PropertyTag>::const_type\nget(PropertyTag, const adjacency_list& g)\n```\n\n返回一个由\
  \ `PropertyTag` 指定的顶点属性的常量属性映射对象。`PropertyTag` 必须匹配图中 `VertexProperties` 模板参数中指定的属性之一。\n\
  \n（由 `PropertyGraph` 要求。）\n\n```cpp\ntemplate <typename PropertyTag, typename X>\n\
  typename property_traits<\n  typename property_map<adjacency_list, PropertyTag>::const_type\n\
  >::value_type\nget(PropertyTag, const adjacency_list& g, X x)\n```\n\n这返回 `x` 的属性值，`x`\
  \ 是顶点描述符或边描述符。\n\n（由 `PropertyGraph` 要求。）\n\n```cpp\ntemplate <typename PropertyTag,\
  \ typename X, typename Value>\nvoid put(PropertyTag, const adjacency_list& g, X\
  \ x, const Value& value)\n```\n\n这将 `x` 的属性值设置为 `value`。`x` 是顶点描述符或边描述符。`Value`\
  \ 必须转换为 `typename property_traits<property_map<adjacency_list, PropertyTag>::type>::value_type`。\n\
  \n（由 `PropertyGraph` 要求。）\n\n```cpp\ntemplate <typename GraphProperties, typename\
  \ GraphProperties>\ntypename property_value<GraphProperties, GraphProperties>::type&\n\
  get_property(adjacency_list& g, GraphProperties);\n```\n\n返回附加到图对象 `g` 的由 `GraphProperties`指定的属性。`property_value`\
  \ 特性类定义在 `boost/pending/property.hpp` 中。\n\n```cpp\ntemplate <typename GraphProperties,\
  \ typename GraphProperties>\nconst typename property_value<GraphProperties, GraphProperties>::type&\n\
  get_property(const adjacency_list& g, GraphProperties);\n```\n\n返回附加到图对象 `g` 的由\
  \ `GraphProperties`指定的属性。`property_value` 特性类定义在 `boost/pending/property.hpp` 中。\n\
  \n## 选择 `Edgelist` 和 `VertexList`\n\n本节重点介绍了如何在不同情况下决定使用哪个版本的 `adjacency_list` 类。`adjacency_list`\
  \ 就像瑞士军刀，可以以许多方式进行配置。在本节中关注的参数是 `EdgeList` 和 `VertexList`，它们控制用于表示图的底层数据结构。`EdgeList`\
  \ 和 `VertexList` 的选择会影响许多图操作的时间复杂度以及图对象的空间复杂度。\n\nBGL 使用 STL 中的容器（如 `std::vector`、`std::list`\
  \ 和 `std::set`）来表示顶点集和图的邻接结构（出边和入边）。使用了几种选择器类型来指定 `EdgeList` 和 `VertexList` 的容器选择：\n\
  \n- `vecS` 选择 `std::vector`。\n- `listS` 选择 `std::list`。\n- `slistS` 选择 `std::slist`。\n\
  - `setS` 选择 `std::set`。\n- `hash_setS` 选择 `std::hash_set`。\n\n### 选择 `VertexList`\
  \ 类型\n\n`VertexList` 参数决定了使用何种容器来表示顶点集或图的二维结构。该容器必须建模为 Sequence 或随机访问容器 RandomAccessContainer。通常，如果你需要快速添加和删除顶点，`listS`\
  \ 是一个很好的选择。代价是与选择 `vecS` 相比会有额外的空间开销。\n\n### 空间复杂度\n\n`std::list` 的每个顶点空间开销比 `std::vector`\
  \ 高，每个顶点多存储两个指针。\n\n### 时间复杂度\n\n`VertexList` 的选择影响以下操作的时间复杂度。\n\n`add_vertex()`\n\
  \n该操作对于 `vecS` 和 `listS` 都是摊还常数时间（通过 `push_back()` 实现）。然而，当 `VertexList` 类型为 `vecS`\
  \ 时，该操作有时很大，因为向量会重新分配内存并复制整个图。\n\n`remove_vertex()`\n\n该操作对于 `listS` 是常数时间，对于 `vecS`\
  \ 为 $O(|V| + |E|)$。`vecS` 的时间复杂度大是因为顶点描述符（在这种情况下是顶点在列表中的索引）必须在整个出边列表中进行调整。\n\n`vertex()`\n\
  \n该操作对于 `vecS` 是常数时间，对于 `listS` 为 $O(|V|)$。\n\n### 选择 `EdgeList` 类型\n\n`EdgeList`\
  \ 参数决定了使用何种容器来存储图中每个顶点的出边（以及可能的入边）。用于边的列表容器必须满足 Sequence 或关联容器 AssociativeContainer\
  \ 的要求。\n\n选择 `EdgeList` 时要考虑的因素之一是，是否希望 `adjacency_list` 强制图中不存在并行边（即强制图不会变成多图）。如果你希望执行这种限制，请使用\
  \ `setS` 或 `hash_setS` 选择器。如果你想表示多图，或者知道你不会向图中插入并行边，则选择其中一种 Sequence 类型：`vecS`、`listS`\
  \ 或 `slistS`。此外，你还需要考虑各种图操作的时间和空间复杂度差异。我们用 |V| 表示顶点总数，用 |E| 表示边总数。此处讨论的操作均为常数时间。\n\
  \n`add_edge()`\n\n\n\n\n\n当 `EdgeList` 是类似 `std::set` 的 `UniqueAssociativeContainer`\
  \ 时，在添加边时会强制执行不存在并行边。涉及的额外查找时间复杂度为 ![image](img/226fig01.jpg)。建模 `Sequence` 的 `EdgeList`\
  \ 类型不进行此类检查，因此 `add_edge()` 是摊化常数时间。这意味着，如果你不在乎图中是否存在并行边，或者知道输入到图的数据不包含并行边，那么使用基于序列的\
  \ `EdgeList` 更好。基于序列的 `EdgeList` 的 `add_edge()` 是 `push_front()` 或 `push_back()`\
  \ 实现的。然而，对于 `std::list` 和 `std::slist`，此操作通常比 `std::vector` 快，因为后者偶尔会重新分配并拷贝所有元素。\n\
  \n```cpp\nremove_edge()\n```\n\n对于基于序列的 `EdgeList` 类型，该操作通过 `std::remove_if()` 实现，这意味着平均时间为\
  \ ![image](img/225fig01.jpg)。对于基于集合的 `EdgeList` 类型，该操作通过 `erase()` 成员函数实现，平均时间为\
  \ ![image](img/226fig02.jpg)。\n\n```cpp\nedge()\n```\n\n当 `EdgeList` 类型为 `Sequence`\
  \ 时，该操作的时间复杂度为 ![image](img/226fig03.jpg)，当 `EdgeList` 类型为 `AssociativeContainer`\
  \ 时，为 ![image](img/226fig04.jpg)。\n\n```cpp\nclear_vertex()\n```\n\n对于使用基于序列的 `EdgeList`\
  \ 类型的向图，时间复杂度为 $O(|V| + |E|)$，而对于基于关联容器的 `EdgeList` 类型，该操作更快，时间复杂度为 ![image](img/226fig05.jpg)。对于无向图，此操作为\
  \ ![image](img/226fig06.jpg)。\n\n```cpp\nremove_vertex()\n```\n\n无论 `EdgeList` 类型如何，该操作的时间复杂度均为\
  \ $O(|V| + |E|)$。\n\n```cpp\nout_edge_iterator::operator++()\n```\n\n该操作对于所有 `EdgeList`\
  \ 类型均为常数时间。然而，不同类型之间存在显著的常数因子时间差异，这很重要，因为该操作是大多数图算法的核心工作。该操作速度从快到慢的顺序为 `vecS`、`slistS`、`listS`、`setS`、`hash_setS`。\n\
  \n```cpp\nin_edge_iterator::operator++()\n```\n\n该操作是常数时间，并且相对于 `EdgeList` 的选择，表现出与\
  \ `out_edge_iterator` 相似的速度排序。\n\n```cpp\nvertex_iterator::operator++()\n```\n\n\
  该操作是常数时间且快速（与增加指针相同）。`OneD` 的选择不影响此操作的速度。\n\n```cpp\nedge_iterator::operator++()\n\
  ```\n\n该操作是常数时间，并且相对于 `EdgeList` 的选择，表现出与 `out_edge_iterator` 相似的速度排序。遍历整个边集的时间为\
  \ $O(|V| + |E|)$。\n\n```cpp\nadjacency_iterator::operator++()\n```\n\n该操作是常数时间，并且相对于\
  \ `EdgeList` 的选择，表现出与 `out_edge_iterator` 相似的速度排序。\n\n##### 迭代器和描述符的稳定性/失效\n\n在更改图的结构（通过添加或删除边）时，必须小心。取决于\
  \ `adjacency_list` 的类型和操作，指向图的某些迭代器或描述符对象可能会失效。例如，以下代码会导致未定义（坏的）行为：\n\n```cpp\n\
  // VertexList=vecS\ntypedef adjacency_list<listS, vecS> Graph;\nGraph G(N);\n//\
  \ 填充图...\n\n// 尝试移除所有顶点。错误！\ngraph_traits<Graph>::vertex_iterator vi, vi_end;\n\
  for (tie(vi, vi_end) = vertices(G); vi != vi_end; ++vi)\n    remove_vertex(*vi,\
  \ G);\n\n// 另一个尝试移除所有顶点。这仍然是错误的！\ngraph_traits<Graph>::vertex_iterator vi, vi_end,\
  \ next;\ntie(vi, vi_end) = vertices(G);\nfor (next = vi; vi != vi_end; vi = next)\
  \ {\n    ++next;\n    remove_vertex(*vi, G);\n}\n```\n\n之所以这是一个问题，是因为我们调用了 `remove_vertex()`，当它与\
  \ `VertexList=vecS` 的 `adjacency_list` 一起使用时，会使图的所有迭代器和描述符（如 `vi` 和 `vi_end`）失效，从而在循环的后续迭代中引发麻烦。\n\
  \n如果我们使用另一种类型（即 `VertexList=listS`），那么调用 `remove_vertex` 不会导致迭代器失效，除非该迭代器指向被移除的实际顶点。下一页的代码演示了这一点。\n\
  \n```cpp\n// VertexList=listS\ntypedef adjacency_list<listS, vecS> Graph;\nGraph\
  \ G(N);\n// 填充图...\n\n// 尝试移除所有顶点。错误！\ngraph_traits<Graph>::vertex_iterator vi,\
  \ vi_end;\nfor (tie(vi, vi_end) = vertices(G); vi != vi_end; ++vi)\n    remove_vertex(*vi,\
  \ G);\n\n// 另一个尝试移除所有顶点。这仍然是错误的！\ngraph_traits<Graph>::vertex_iterator vi, vi_end,\
  \ next;\ntie(vi, vi_end) = vertices(G);\nfor (next = vi; vi != vi_end; vi = next)\
  \ {\n    ++next;\n    remove_vertex(*vi, G);\n}\n```\n*(注：此处原文示例代码逻辑与描述存在微差异，已按原文逻辑翻译)*\n\
  \n实际上，从 `adjacency_list` 中移除多条边最安全且高效的方法是使用 `remove_if()` 函数。\n\n稳定性问题也会影响描述符。例如，假设你使用顶点描述符向量来跟踪路径树中顶点的父节点（前驱）（参见\
  \ `example/dijkstra-example.cpp`）。你通过调用 `dijkstra_shortest_paths()` 创建了父向量，然后从图中删除了顶点。随后你尝试使用父向量，但由于所有顶点描述符已失效，结果是错误的。\n\
  \n```cpp\nstd::vector<Vertex> parent(num_vertices(G));\nstd::vector<Vertex> distance(num_vertices(G));\n\
  dijkstra_shortest_paths(G, s, distance_map(&distance[0]), predecessor_map(&parent[0]));\n\
  \n// 以下是一个坏主意！它使父向量中的顶点描述符失效\nremove_vertex(s, G);\n\n// 以下将产生错误结果\nfor(tie(vi,\
  \ vend) = vertices(G); vi != vend; ++vi)\n    std::cout << p[*vi] << \" 是 \" <<\
  \ *vi << \" 的父节点\" << std::endl;\n```\n\n注意，在讨论中，迭代器和描述符失效关注的是*并非直接受操作影响*的迭代器和描述符。例如，无论\
  \ `adjacency_list` 类型如何，`remove_edge(u,v,g)` 总是会让 (u, v) 的边描述符或指向 (u, v) 的边迭代器失效。在迭代器和描述符失效的讨论中，我们只关注\
  \ `remove_edge(u,v,g)` 对其他边（非 (u, v)）描述符和迭代器的影响。\n\n##### 有向和无向邻接列表\n\n\n\n\n`adjacency_list`\
  \ 类可以用于表示有向图和无向图，取决于传递给 `Directed` 模板参数的参数。选择 `directedS` 或 `bidirectionalS` 会选择有向图，而\
  \ `undirectedS` 则选择无向图的表示。关于 BGL 中有向图和无向图的区别描述，请参阅 §12.1.1。`bidirectealS` 选择器指定图将提供\
  \ `in_edges()` 函数以及 `out_edges()` 函数。这会导致每条边的空间开销增加一倍，这就是为什么 `in_edges()` 是可选的性。\n\
  \n### 内部属性\n\n可以通过属性接口将属性附加到 `adjacency_list` 图的顶点或边上。`adjacency_list` 类的模板参数 `VertexProperties`\
  \ 和 `EdgeProperties` 用于由属性类填充，该类的声明如下：\n\n```cpp\ntemplate <typename PropertyTag,\
  \ typename T, typename NextProperty = no_property>\nstruct property;\n```\n\n`PropertyTag`\
  \ 是一种仅用于标识或为属性提供唯一名称的类型。有几个预定义的标签（参见 §15.2.3），并且添加更多标签也很容易。为了方便，BGL 还提供了标签类型的预定义对象（在这种情况下为枚举值），用作期望属性标签对象的函数的参数（例如\
  \ `adjacency_list` 的 `get()` 属性映射函数）。\n\n`property` 的 `T` 参数指定属性值的类型。`NextProperty`\
  \ 参数允许 `property` 类型嵌套，以便在同一张图上附加任意数量的属性。\n\n以下代码展示了如何组装顶点和边属性类型并使用它们创建一个图类型。我们在图的顶点上附加了一个类型为\
  \ `float` 的距离属性，和一个类型为 `std::string` 的名称属性。我们在图的边上附加了一个类型为 `float` 的权重属性。\n\n```cpp\n\
  typedef property<distance_t, float,\n      property<name_t, std::string> > VertexProperties;\n\
  \ntypedef property<weight_t, float> EdgeProperties;\n\ntypedef adjacency_list<mapS,\
  \ vecS, undirectedS,\n      VertexProperties, EdgeProperties> Graph;\n\nGraph g(num_vertices);\
  \ // 构建一个图对象\n```\n\n然后可以使用属性映射从读取和写入属性值。请参阅 § 3.6 关于如何从图中获取属性映射的描述，并阅读整个第 15 章\
  \ 关于如何使用属性映射。\n\n### 顶点索引属性\n\n如果图的 `VertexList` 是 `vecS`，则图具有内置的顶点索引属性，通过 `vertex_index_t`\
  \ 属性访问。索引范围在 [0, |V|) 范围内且是连续的。当删除一个顶点时，索引会进行调整以保留这些属性。在使用这些索引访问外部属性存储时，必须小心，因为用户必须记得更新外部存储以匹配新的顶点索引。\n\
  \n### 自定义边属性\n\n创建自己的属性类型和属性很容易；只需为你的新属性定义一个标签类。在这里我们为容量和流属性定义了一个标签类，将其附加到图的边上。\n\
  \n```cpp\nenum edge_capacity_t { edge_capacity };\n\nenum edge_flow_t { edge_flow\
  \ };\n\nnamespace boost {\n  BOOST_INSTALL_PROPERTY(edge, flow);\n  BOOST_INSTALL_PROPERTY(edge,\
  \ capacity);\n}\n```\n\n现在，你可以在属性定义中使用你的新属性标签，就像使用内置标签一样。\n\n```cpp\ntypedef property<capacity_t,\
  \ int> Cap;\n\ntypedef property<flow_t, int, Cap> EdgeProperties;\n\ntypedef adjacency_list<vecS,\
  \ vecS, no_property, EdgeProperties> Graph;\n```\n\n与之前一样，可以通过 `get()` 函数从图中获取这些属性的属性映射。\n\
  \n```cpp\nproperty_map<Graph, edge_capacity_t>::type\n  capacity = get(edge_capacity,\
  \ G);\n\nproperty_map<Graph, edge_flow_t>::type\n  flow = get(edge_flow, G);\n```\n\
  \n`edge_property.cpp` 文件显示了此示例的完整源代码。\n\n### 自定义顶点属性\n\n在顶点上附加自己的属性与在边上附加属性一样简单。在这里我们想给图的顶点附加人的名字。\n\
  \n```cpp\nenum vertex_first_name_t { vertex_first_name };\n\nnamespace boost {\n\
  \  BOOST_INSTALL_PROPERTY(vertex, first_name);\n}\n```\n\n现在我们可以在 `property` 类中以及图类型的组装中使用新标签。以下代码展示了创建图类型，然后创建图对象。我们填充了边并为顶点分配了名称。边代表“谁欠谁钱”。\n\
  \n```cpp\ntypedef property<vertex_first_name_t, std::string> FirstNameProperty;\n\
  \ntypedef adjacency_list<vecS, vecS, undirectedS,\n      FirstNameProperty> GraphType;\n\
  \ntypedef pair<int,int> Pair;\n\nPair edge_array[11] = { Pair(0,1), Pair(0,2), Pair(0,3),\
  \ Pair(0,4), Pair(1,2), Pair(1,3), Pair(1,4), Pair(2,3), Pair(2,4), Pair(3,4), Pair(4,0)\
  \ };\n\nGraphType G(5);\n\nfor (int i = 0; i < 11; ++i)\n    add_edge(G, edge_array[i].first,\
  \ edge_array[i].second);\n\nproperty_map<GraphType, vertex_first_name_t>::type\n\
  \  name = get(vertex_first_name, G);\n\nput(name, 0, \"Jeremy\");\nput(name, 1,\
  \ \"Rich\");\nput(name, 2, \"Andrew\");\nput(name, 3, \"Jeff\");\nname[4] = \"Kinis\"\
  ;\n```\n\n`who_owes_who()` 函数是以泛型方式实现的。输入是模板化的，因此我们不知道具体的图类型。为了找到名称的属性映射类型，我们需要使用\
  \ `vertex_property_map` traits 类。使用 `const_type` 是因为图参数是 `const`。一旦我们有了属性映射，就可以使用\
  \ `property_traits` 类推导出属性的值类型。在这个示例中，我们知道属性的值类型是 `std::string`，但通过这种泛型编写，`who_owes_who()`\
  \ 函数可以处理其他属性值类型。\n\n```cpp\ntemplate <typename EdgeIter, typename Graph>\nvoid who_owes_who(EdgeIter\
  \ first, EdgeIter last, const Graph& G)\n{\n  // 获取此图的属性访问类型\n  typedef typename\
  \ vertex_property_map<Graph,\n      first_name_t>::const_type NamePA;\n  NamePA\
  \ name = get_vertex_property_map(G, first_name_t());\n  typedef typename property_traits<NamePA>::value_type\
  \ NameType;\n  NameType src_name, targ_name;\n  while (first != last) {\n    src_name\
  \ = get(name, source(*first, G));\n    targ_name = get(name, target(*first, G));\n\
  \    cout << src_name << \" owes \"\n      << targ_name << \" some money\" << endl;\n\
  \    ++first;\n  }\n}\n```\n\n输出是\n\n\n\nJeremy owes Rich some money\nJeremy owes\
  \ Andrew some money\nJeremy owes Jeff some money\nJeremy owes Kinis some money\n\
  Andrew owes Jeremy some money\nAndrew owes Kinis some money\nJeff owes Jeremy some\
  \ money\nJeff owes Rich some money\nJeff owes Kinis some money\nKinis owes Jeremy\
  \ some money\nKinis owes Rich some money\n\n\n\n\n\n`adjacency_list` 类使用两种类型的容器实现。一种类型的容器持有图中所有的顶点，另一种类型的容器持有每个顶点的出边列表（以及可能存在的入边列表）。BGL\
  \ 提供了选择器类，允许用户在 STL 的几种容器中进行选择。也可以使用你自己的容器类型。在自定义 `VertexList` 时，你需要定义一个容器生成器（container\
  \ generator）。在自定义 `EdgeList` 时，你需要定义一个容器生成器和并行边特性（parallel edge traits）。`container_gen.cpp`\
  \ 文件提供了如何使用自定义存储类型的示例。\n\n### 容器生成器\n\n`adjacency_list` 类使用一个名为 `container_gen`\
  \ 的特征类将 `EdgeList` 和 `VertexList` 选择器映射到用于图存储的实际容器类型。该特征类的默认版本如下，并包含了该类如何为 `listS`\
  \ 选择器进行特化的示例。\n\n```cpp\nnamespace boost {\n\n  template <typename Selector, typename\
  \ ValueType>\n  struct container_gen { };\n\n  template <typename ValueType>\n \
  \ struct container_gen<listS, ValueType> {\n    typedef std::list<ValueType> type;\n\
  \  };\n\n}\n```\n\n要使用你选择的其他容器，请定义一个选择器类，然后为你的选择器特化 `container_gen`。\n\n```cpp\n\
  struct custom_containerS { }; // 你的选择器\n\nnamespace boost {\n\n  // 针对你的选择器的特化\n\
  \  template <typename ValueType>\n  struct container_gen<custom_containerS, ValueType>\
  \ {\n    typedef custom_container<ValueType> type;\n  };\n\n}\n```\n\n在某些情况下，你可能想使用具有比\
  \ `ValueType` 更多模板参数的容器。例如，你可能想提供分配器类型。这样做的方法是在 `container_gen` 的特化中硬编码额外的参数。然而，如果你想要更大的灵活性，可以给选择器类添加一个模板参数。在下面的代码中，我们展示了如何创建一个选择器，允许指定与\
  \ `std::list` 使用的分配器。\n\n```cpp\ntemplate <typename Allocator> struct list_with_allocatorS\
  \ {};\n\nnamespace boost {\n\n  template <typename Alloc, typename ValueType>\n\
  \  struct container_gen<list_with_allocatorS<Alloc>, ValueType>\n  {\n    typedef\
  \ typename Alloc::template rebind<ValueType>::other Allocator;\n    typedef std::list<ValueType,\
  \ Allocator> type;\n  };\n\n}\n\n// 现在你可以使用 std::list 和特定的分配器定义图\n\ntypedef adjacency_list<\
  \ list_with_allocatorS< std::allocator<int> >,\n  vecS, directedS> MyGraph;\n```\n\
  \n### 并行边特性\n\n除了特化 `container_gen` 类外，还必须特化 `parallel_edge_traits` 类，以指定容器类型是否允许并行边（并且是序列\
  \ Sequence），或者容器是否不允许并行边（并且是关联容器 AssociativeContainer）。\n\n```cpp\ntemplate <typename\
  \ StorageSelector>\nstruct parallel_edge_traits { };\n\ntemplate <> struct parallel_edge_traits<vecS>\
  \ {\n  typedef allow_parallel_edge_tag type;\n};\n\ntemplate <> struct parallel_edge_traits<setS>\
  \ {\n  typedef disallow_parallel_edge_tag type;\n};\n//. . .\n```\n\n### 针对边列表容器的\
  \ Push 和 Erase\n\n必须告诉 `adjacency_list` 如何高效地从边列表容器中添加和删除边。这是通过为自定义容器类型重载 `push()`\
  \ 和 `erase()` 函数来实现。`push()` 函数必须返回一个指向新插入边的迭代器，以及一个表示边是否插入成功的布尔标志。如果你在 `parallel_edge_traits`\
  \ 中指定了 `allow_parallel_edge_tag`，则 `push()` 应该始终插入边并返回 `true`。如果你在 `parallel_edge_traits`\
  \ 中指定了 `disallow_parallel_edge_tag`，则当相同的边已于容器时，`push()` 必须返回 false 不插入边，且返回的迭代器应该指向已存在的边。\n\
  \n已经为所有 STL 容器类型提供了默认的 `push()` 和 `erase()` 函数。`push_dispatch()` 和 `erase_dispatch()`\
  \ 函数重载族处理了标准容器进行插入和删除的不同方式。\n\n```cpp\ntemplate <typename Container, typename T>\n\
  std::pair<typename Container::iterator, bool>\npush(Container& c, const T& v)\n\
  {\n  return push_dispatch(c, v, container_category(c));\n}\n\ntemplate <typename\
  \ Container, typename T>\nvoid erase(Container& c, const T& x)\n{\n  erase_dispatch(c,\
  \ x, container_category(c));\n}\n```\n\n#### 14.1.2 `adjacency_matrix`\n\n`adjacency_matrix<Directed,\
  \ VertexProperty, EdgeProperty, GraphProperty>`\n\n`adjacency_matrix` 类使用传统的邻接矩阵存储格式实现\
  \ BGL 图接口。对于具有 $|V|$ 个顶点的图，使用一个 $|V| \\times |V|$ 的矩阵，其中每个元素 $a[ij]$ 是一个布尔标志，表示从顶点\
  \ $i$ 到顶点 $j$ 是否存在边。图 14.4 显示了图的邻接矩阵表示法。\n\n**图 14.4 有向图的邻接矩阵表示法。**\n\n![image](img/14fig04.jpg)\n\
  \n与邻接列表相比，这种格式的优点是插入和删除是常数时间。缺点是：内存占用是 $O(|V|²)$ 而不是 $O(|V|+|E|)$；遍历每个顶点的边的操作（如广度搜索）将是\
  \ $O(|V|²)$ 而不是 $O(|V|+|E|)$。对于稠密图，使用 `adjacency_matrix` 更好；对于稀疏图，使用 `adjacency_list`\
  \ 更好。在无向图的情况下，`adjacency_matrix` 类不使用完整的 $|V| \\times |V|$ 矩阵，而是使用下三角（对角线），这使得存储减少到\
  \ $(|V|²)/2$。图 14.5 显示了无向图的邻接矩阵表示法。\n\n**图 14.5 无向图的邻接矩阵表示法。**\n\n![image](img/14fig05.jpg)\n\
  \n### 示例\n\n创建 图 14.4 中的图\n\n```cpp\nadjacency_matrix<Directed, VertexProperty,\
  \ EdgeProperty, GraphProperty>\n```\n（等待，示例代码继续...)\n\n```cpp\nenum { A, B, C, D,\
  \ E, F, N };\nconst char* name = \"ABCDEF\";\ntypedef boost::adjacency_matrix<boost::directedS>\
  \ Graph;\nGraph g(N);\nadd_edge(B, C, g);\nadd_edge(B, F, g);\nadd_edge(C, A, g);\n\
  add_edge(C, C, g);\nadd_edge(D, E, g);\nadd_edge(E, D, g);\nadd_edge(F, A, g);\n\
  \nstd::cout << \"vertex set: \";\nboost::print_vertices(g, name);\nstd::cout <<\
  \ std::endl;\nstd::cout << \"edge set: \";\nboost::print_edges(g, name);\nstd::cout\
  \ << std::endl;\nstd::cout << \"out-edges: \" << std::endl;\nboost::print_graph(g,\
  \ name);\n```\n\n输出结果为\n\nvertex set: A B C D E F\nedge set: (B,C) (B,F) (C,A) (C,C)\
  \ (D,E) (E,D) (F,A)\nout–edges:\nA –>\nB –> C F\nC –> A C\nD –> E\nE –> D\nF –>\
  \ A\n\n创建 图 14.5 中的图\n\n```cpp\nenum { A, B, C, D, E, F, N };\nconst char* name\
  \ = \"ABCDEF\";\ntypedef boost::adjacency_matrix<boost::undirectedS> UGraph;\nUGraph\
  \ ug(N);\nadd_edge(B, C, ug);\nadd_edge(B, F, ug);\nadd_edge(C, A, ug);\nadd_edge(D,\
  \ E, ug);\nadd_edge(F, A, ug);\n\nstd::cout << \"vertex set: \";\nboost::print_vertices(ug,\
  \ name);\nstd::cout << std::endl;\nstd::cout << \"edge set: \";\n\n\n\n\n\n```\n\
  boost::print_edges(ug, name);\n\nstd::cout << std::endl;\n\nstd::cout << \"incident\
  \ edges: \" << std::endl;\n\nboost::print_graph(ug, name);\n\nstd::cout << std::endl;\n\
  ```\n\n输出为：\n``````\nvertex set: A B C D E F\nedge set: (C,A) (C,B) (E,D) (F,A)\
  \ (F,B)\nincident edges:\nA <––> C F\nB <––> C F\nC <––> A B\nD <––> E\nE <––> D\n\
  F <––> A B\n```\n\n## 定义位置\n`boost/graph/adjacency_matrix.hpp`\n\n## 模板参数\n![image](img/t0238-01.jpg)\n\
  \n## 模型\n`VertexListGraph`, `EdgeListGraph`, `IncidenceGraph`, `AdjacencyGraph`,\
  \ `AdjacencyMatrix`, `VertexMutablePropertyGraph` 和 `EdgeMutablePropertyGraph`\n\
  \n## 类型要求\n属性值类型必须是 `DefaultConstructible`（可可构造）和 `CopyConstructible`（可拷贝）。\n\n\
  ## 关联类型\n- `graph_traits<adjacency_matrix>::vertex_descriptor`\n与 `adjacency_matrix`\
  \ 关联的顶点描述符类型。（Graph 要求。）\n- `graph_traits<adjacency_matrix>::edge_descriptor`\n\
  与 `adjacency_matrix` 关联的边描述符类型。（Graph 要求。）\n- `graph_traits<adjacency_matrix>::vertex_iterator`\n\
  `vertices()` 返回的迭代器类型。（VertexListGraph 要求。）\n- `graph_traits<adjacency_matrix>::edge_iterator`\n\
  `edges()` 返回的迭代器类型。（EdgeListGraph 要求。）\n- `graph_traits<adjacency_matrix>::out_edge_iterator`\n\
  `out_edges()` 返回的迭代器类型。（IncidenceGraph 要求。）\n- `graph_traits<adjacency_matrix>::adjacency_iterator`\n\
  `adjacent_vertices()` 返回的迭代器类型。（AdjacencyGraph 要求。）\n- `graph_traits<adjacency_matrix>::directed_category`\n\
  提供关于图是有向的（`directed_tag`）还是无向（`undirected_tag`）的信息。（Graph 要求。）\n- `graph_traits<adjacency_matrix>::edge_parallel_category`\n\
  邻接矩阵不允许插入并行边，因此此类型始终为 `disallow_parallel_edge_tag`。（Graph 要求。）\n- `graph_traits<adjacency_matrix>::vertices_size_type`\n\
  用于处理图中顶点数量的类型。（VertexListGraph 要求。）\n- `graph_traits<adjacency_matrix>::edges_size_type`\n\
  用于处理图中边数量的类型。（EdgeListGraph 要求。）\n- `graph_traits<adjacency_matrix>::degree_size_type`\n\
  用于处理顶点出边数量的类型。（IncidenceGraph 要求。）\n- `property_map<adjacency_matrix, PropertyTag>::type`\n\
  - `property_map<adjacency_matrix, PropertyTag>::const_type`\n图中顶点或边属性的映射类型。该属性由模板参数\
  \ `PropertyTag` 指定，并且必须与图的 `VertexProperty` 或 `EdgeProperty` 中指定的某个属性之一匹配。（PropertyGraph\
  \ 要求。）\n\n## 成员函数\n- `adjacency_matrix(vertices_size_type n, const GraphProperty&\
  \ p = GraphProperty())`\n  创建一个具有 `n` 个顶点和零条边的图对象。\n- `template <typename EdgeIterator>\
  \ adjacency_matrix(EdgeIterator first, EdgeIterator last, vertices_size_type n,\
  \ const GraphProperty& p = GraphProperty())`\n  创建一个具有 `n` 个顶点的图对象，其边由范围 `[first,\
  \ last)` 提供的边列表指定。`EdgeIterator` 的值类型必须是 `std::pair`，其中对中的类型是整数类型。这些整数对应于顶点，且它们必须落在\
  \ `[0,n)` 范围内。\n- `template <typename EdgeIterator, typename EdgePropertyIterator>\
  \ adjacency_matrix(EdgeIterator first, EdgeIterator last, EdgePropertyIterator ep_iter,\
  \ vertices_size_type n, const GraphProperty& p = GraphProperty())`\n  创建一个具有 `n`\
  \ 个顶点的图对象，其边由范围 `[first, last)` 提供的边列表指定，且边属性由 `ep_iter` 指定的边属性列表指定。`EdgeIterator`\
  \ 的值类型必须是 `std::pair`，其中对中的类型是整数类型。这些整数对应于顶点，且它们必须落在 `[0,n)` 范围内。`ep_iter` 的 `value_type`\
  \ 应该是 `EdgeProperty`。\n\n## 非成员函数\n- `std::pair<vertex_iterator, vertex_iterator>\
  \ vertices(const adjacency_matrix& g)`\n  返回一个迭代器范围，用于访问图 `g` 的顶点集。（VertexListGraph\
  \ 要求。）\n- `std::pair<edge_iterator, edge_iterator> edges(const adjacency_matrix&\
  \ g)`\n  返回一个迭代器范围，用于访问图 `g` 的边集。（EdgeListGraph 要求。）\n- `std::pair<adjacency_iterator,\
  \ adjacency_iterator> adjacent_vertices(vertex_descriptor v, const adjacency_matrix&\
  \ g)`\n  返回一个迭代器范围，用于访问图 `g` 中与 `v` 相邻的顶点。（AdjacencyGraph 要求。）\n- `std::pair<out_edge_iterator,\
  \ out_edge_iterator> out_edges(vertex_descriptor v, const adjacency_matrix& g)`\n\
  \  返回一个迭代器范围，用于访问图 `g` 中顶点 `v` 的出边。如果图无无的，则提供所有与 `v` 边的边。（IncidenceGraph 要求。）\n\
  - `vertex_descriptor source(edge_descriptor e, const adjacency_matrix& g)`\n  返回边\
  \ `e` 的源顶点。（IncidenceGraph 要求。）\n- `vertex_descriptor target(edge_descriptor e,\
  \ const adjacency_matrix& g)`\n  返回边 `e` 的目标顶点。（IncidenceGraph 要求。）\n- `degree_size_type\
  \ out_degree(vertex_descriptor u, const adjacency_matrix& g)`\n  返回离开顶点 `u` 的边数。（IncidenceGraph\
  \ 要求。）\n- `vertices_size_type num_vertices(const adjacency_matrix& g)`\n  返回图 `g`\
  \ 中的顶点数量。（VertexListGraph 要求。）\n- `edges_size_type num_edges(const adjacency_matrix&\
  \ g)`\n  返回图 `g` 中的边数量。（EdgeListGraph 要求。）\n- `vertex_descriptor vertex(vertices_size_type\
  \ n, const adjacency_matrix& g)`\n  返回图 `g` 中的第 `n` 个顶点。\n- `std::pair<edge_descriptor,\
  \ bool> edge(vertex_descriptor u, vertex_descriptor v, const adjacency_matrix& g)`\n\
  \  返回图 `g` 中连接顶点 `u` 和顶点 `v` 的边。（AdjacencyMatrix 要求。）\n- `std::pair<edge_descriptor,\
  \ bool> add_edge(vertex_descriptor u, vertex_descriptor v, adjacency_matrix& g)`\n\
  \  向图中添加边 `(u, v)` 并返回新边的描述符。如果该边已经在图中，则不会添加且布尔标记为假。此操作不会使图的任何迭代器或描述符失效。（EdgeMutableGraph\
  \ 要求。）\n- `std::pair<edge_descriptor, bool> add_edge(vertex_descriptor u, vertex_descriptor\
  \ v, const EdgeProperty& p, adjacency_matrix& g)`\n  向图中添加边 `(u, v)` 并将 `p` 作为边内部存储的值。更多细节见之前的\
  \ `add_edge()` 成员函数。\n- `void remove_edge(vertex_descriptor u, vertex_descriptor\
  \ v, adjacency_matrix& g)`\n  从图中移除边 `(u, v)`。（EdgeMutableGraph 要求。）\n- `void remove_edge(edge_descriptor\
  \ e, adjacency_matrix& g)`\n  从图中移除边 `e`。（EdgeMutableGraph 要求。）\n- `void clear_vertex(vertex_descriptor\
  \ u, adjacency_matrix& g)`\n  移除离开顶点 `u` 的所有边。该顶点仍然出现在图顶点集中。对描述符和迭代器稳定性的影响等同于调用\
  \ `remove_edge()` 所有以 `u` 为源或目标的边。（EdgeMutableGraph 要求。）\n- `template <typename\
  \ Property> property_map<adjacency_matrix, Property>::type get(Property, adjacency_matrix&\
  \ g)`\n- `template <typename Property> property_map<adjacency_matrix, Property>::const_type\
  \ get(Property, const adjacency_matrix& g)`\n\n\n\n\n返回由 `Property` 指定的属性映射对象。`Property`\
  \ 必须匹配图的 `VertexProperty` 模板参数中指定的属性之一。\n\n（`PropertyGraph` 强制）\n\n```cpp\ntemplate\
  \ <typename Property, typename X>\ntypename property_traits<\n  typenamae property_map<adjacency_matrix,\
  \ Property>::const_type\n>::value_type\nget(Property, const adjacency_matrix& g,\
  \ X x)\n```\n这返回 `x` 的属性值，`x` 可以是顶点或边的描述符。\n\n（`PropertyGraph` 强制）\n\n```cpp\ntemplate\
  \ <typename Property, typename X, typename Value>\nvoid put(Property, const adjacency\
  \ matrix& g, X x, const Value& value)\n```\n这会将 `x` 的属性值设置为 `value`。`x` 均是顶点或边的描述符。`Value`\
  \ 必须能够转换为由 `Property` 标签指定的属性映射的值类型。\n\n（`PropertyGraph` 强制）\n\n```cpp\ntemplate\
  \ <typename GraphProperties, typename GraphProperty>\ntypename property_value<GraphProperties,\
  \ GraphProperty>::type&\nget_property(adjacency_matrix& g, GraphProperty);\n```\n\
  返回附加到图对象 `g` 的由 `GraphProperty` 指定的属性。`property_value` 特性类定义在 `boost/pending/property.hpp`\
  \ 中。\n\n```cpp\ntemplate <typename GraphProperties, typename GraphProperty>\nconst\
  \ typename property_value<GraphProperties, GraphProperty>::type&\nget_property(const\
  \ adjacency_matrix& g, GraphProperty);\n```\n返回附加到图对象 `g` 的由 `GraphProperty` 指定的属性。`property_value`\
  \ 特性类定义在 `boost/pending/property.hpp` 中。\n\n## 14.2 辅助类\n\n#### 14.2.1 `graph_traits`\n\
  \n`graph_traits<Graph>`\n\n`graph_traits` 类提供了访问图类型*关联类型*的机制，这些类型由各种 BGL 图概念定义（参见节\
  \ §[12.1]）。当你想要使用图的某个关联类型时，使用图类型实例化 `graph_traits` 模板并访问相应的类型定义。例如，要获取某些图的 `vertex_descriptor`\
  \ 类型，执行以下操作：\n\n```cpp\ntemplate <typename Graph> void my_graph_algorithm(Graph&\
  \ g)\n{\n  // 使用图类型实例化 graph_traits。\n  typedef boost::graph_traits<Graph> Traits;\n\
  \  // 访问关联类型。\n  typedef typename Traits::vertex_descriptor Vertex;\n  //...\n}\n\
  ```\n`graph_traits` 类模板的未特化化（默认）版本假设图类型为所有关联类型提供了嵌套类型定义。该版本定义在此。\n\n```cpp\nnamespace\
  \ boost {\n  template <typename G>\n  struct graph_traits {\n      typedef typename\
  \ G::vertex_descriptor             vertex_descriptor;\n      typedef typename G::edge_descriptor\
  \              edge_descriptor;\n      typedef typename G::adjacency_iterator  \
  \        adjacency_iterator;\n      typedef typename G::out_edge_iterator      \
  \      out_edge_iterator;\n      typedef typename G::in_edge_iterator          \
  \   in_edge_iterator;\n      typedef typename G::vertex_iterator              vertex_iterator;\n\
  \      typedef typename G::edge_iterator                edge_iterator;\n      typedef\
  \ typename G::directed_category          directed_category;\n      typedef typename\
  \ G::edge_parallel_category      edge_parallel_category;\n      typedef typename\
  \ G::traversal_category        traversal_category;\n      typedef typename G::vertices_size_type\
  \        vertices_size_type;\n      typedef typename G::edges_size_type        \
  \    edges_size_type;\n      typedef typename G::property_type             property_type;\n\
  \  };\n}\n```\n`graph_traits` 类模板的未特化化（默认）版本假设图类型为所有关联类型提供了嵌套类型定义。该版本定义在此。（注：为了简洁起见，省略了完整的实现细节，但遵循所提供的结构）。\n\
  \n\n\n\n\n此类提供了访问 `adjacency_list` 类中某些关联类型的替代方法。该类的主要原因是，有时用户可能想要创建取值为顶点或边部描述符的图属性。如果你尝试使用\
  \ `graph_traits` 来实现此功能，将会遇到相互递归类型的问题。为了解决这个问题，提供了 `adjacency_list_traits` 类，它允许用户访问顶点和边部描述符类型，而不需要用户为图提供属性（property）类型。\n\
  \n```cpp\ntemplate <typename EdgeList, typename VertexList, typename Directed>\n\
  \  struct adjacency_list_traits {\n    typedef ... vertex_descriptor;\n    typedef\
  \ ... edge_descriptor;\n    typedef ... directed_category;\n    typedef ... edge_parallel_category;\n\
  \  };\n```\n\n### 定义位置\n`boost/graph/adjacency_list.hpp`\n\n### 模板参数\n![image](img/t0246-01.jpg)\n\
  \n### 遵循模型\n默认可构造（DefaultConstructible）和可赋值（Assignable）\n\n### 成员\n`adjacency_list_traits::vertex_descriptor`\n\
  用于标识图中顶点的对象类型。\n\n`adjacency_list_traits::edge_descriptor`\n用于标识图中边的对象类型。\n\n`adjacency_list_traits::directed_category`\n\
  说明图是无向的（`undirected_tag`）还是有向的（`directed_tag`）。\n\n`adjacency_list_traits::edge_parallel_category`\n\
  说明图允许插入并行边（`allow_parallel_edge_tag`）还是自动移除并行边（`disallow_parallel_edge_tag`）。\n\n\
  ### 另\n`adjacency_list`\n\n### 14.2.3 `adjacency_matrix_traits`\n`adjacency_matrix_traits<Directed>`\n\
  \n此类提供了访问 `adjacency_matrix` 类中某些关联类型的替代方法。该类的主要原因是，有时用户可能想要创建取值为顶点或边部描述符的图属性。如果你尝试使用\
  \ `graph_traits` 来实现此功能，将会遇到相互递归类型的问题。为了解决这个问题，提供了 `adjacency_matrix_traits` 类，它允许用户访问顶点和边部描述符类型，而不需要用户为图提供属性类型。\n\
  \n```cpp\ntemplate <typename Directed>\n  struct adjacency_matrix_traits {\n   \
  \ typedef ... vertex_descriptor;\n    typedef ... edge_descriptor;\n    typedef\
  \ ... directed_category;\n    typedef ... edge_parallel_category;\n  };\n```\n\n\
  ### 定义位置\n`boost/graph/adjacency_matrix.hpp`\n\n### 模板参数\n![image](img/t0247-01.jpg)\n\
  \n### 遵循模型\n默认可构造（DefaultConstructible）和可赋值（Assignable）\n\n### 成员\n`adjacency_matrix_traits::vertex_descriptor`\n\
  用于标识图中顶点的对象类型。\n\n`adjacency_matrix_traits::edge_descriptor`\n用于标识图中边的对象类型。\n\n\
  `adjacency_matrix_traits::directed_category`\n说明图是无向的（`undirected_tag`）还是有向的（`directed_tag`）。\n\
  \n`adjacency_matrix traits::edge_parallel_category`\n邻接矩阵不允许插入并行边，因此该类型为 `disallow_parallel_edge_tag`。\n\
  \n### 另\n`adjacency_matrix`\n\n### 14.2.4 `property_map`\n`property_map<Graph, PropertyTag>`\n\
  \n用于访问图的内部属性映射（property map）类型的 traits 类。对于建模 PropertyGraph Concept 的类型，需要对此 traits\
  \ 类进行特化处理。\n\n### 示例\n以下示例创建了一个带有顶点名称内部属性的图，然后使用 `property_map` traits 类访问顶点名称属性映射类型。使用\
  \ `get()` 函数从图中获取属性映射对象。\n\n![image](img/open.jpg)property-map-traits-eg.cpp 248![image](img/close.jpg)\
  \ ≡\n\n```cpp\n#include <string>\n#include <boost/graph/adjacency_list.hpp>\nint\
  \ main()\n{\n  using namespace boost;\n  typedef adjacency_list<listS, listS, directedS,\n\
  \      property<vertex_name_t, std::string> > graph_t;\n  graph_t g;\n  graph_traits<graph_t>::vertex_descriptor\
  \ u = add_vertex(g);\n  property_map<graph_t, vertex_name_t>::type\n    name_map\
  \ = get(vertex_name, g);\n  name_map[u] = \"Joe\";\n  std::cout << name_map[u] <<\
  \ std::endl;\n  return EXIT_SUCCESS;\n}\n```\n输出为 Joe\n\n### 定义位置\n`boost/graph/properties`\n\
  \n### 模板参数\n![image](img/t249.jpg)\n\n### 遵循模型\n无。\n\n### 公有类\n无。\n\n### 关联类型\n\
  `property_map<Graph, PropertyTag>::type`\n用于访问内部属性的可变属性映射类型。\n\n`property_map<Graph,\
  \ PropertyTag>::const_type`\n用于访问内部属性的常量属性映射类型。\n\n### 成员函数\n无。\n\n### 非成员函数\n无。\n\
  \n### 14.2.5 `property`\n`property<PropertyTag, T>`\n此类可以与 `adjacency_list` 和 `adjacency_matrix`\
  \ 类结合使用，用于指定附加到顶点以及图本身的属性类型。\n\n### 模板参数\n![image](img/t250.jpg)\n\n### 定义位置\n`boost/property`\n\
  \n### 属性标签（Property Tags）\n以下属性标签定义在 `boost/graph/properties.hpp` 中：\n```cpp\nnamespace\
  \ boost {\n  enum edge_name_t { edge_name };\n  enum edge_weight_t { edge_weight\
  \ };\n  enum edge_index_t { edge_index };\n  enum edge_capacity_t { edge_capacity\
  \ };\n  enum edge_residual_t { edge_residual };\n  enum edge_reverse_t { edge_reverse\
  \ };\n  enum vertex_name_t { vertex_name };\n  enum vertex_distance_t { vertex_distance\
  \ };\n  enum vertex_index_t { vertex_index };\n  enum vertex_color_t { vertex_color\
  \ };\n  enum vertex_degree_t { vertex_degree };\n  enum vertex_out_degree_t { vertex_out_degree\
  \ };\n  enum vertex_in_degree_t { vertex_in_degree };\n  enum vertex_discover_time_t\
  \ { vertex_discover_time };\n  enum vertex_finish_time_t { vertex_finish_time };\n\
  \  enum graph_name_t { graph_name };\n  BOOST_INSTALL_PROPERTY(vertex, index);\n\
  \  BOOST_INSTALL_PROPERTY(edge, index);\n  // . .\n}\n```\n\n## 14.3 图适配器\n\n####\
  \ 14.3.1 `edge_list`\n`edge_list<EdgeIterator, ValueType, DiffType>`\n`edge_list`\
  \ 类是一个适配器，它将边迭代器对转换为建模 EdgeListGraph 的类。edgeiterator 的 `value_type` 必须是 `std::pair`（至少具有\
  \ `first` 和 `second` 成员）。pair 的 `first_type` 和 `second_type` 必须相同，它们被用于图的 `vertex_descriptor`。模板参数\
  \ `ValueType` 和 `DiffType` 只有当编译器不支持特化一时才需要，否则它们将默认为正确的类型。\n\n### 示例\n参考 5.3 使用\
  \ `edge_list` 的示例。\n\n### 模板参数\n![image](img/t251-01.jpg)\n\n### 遵循模型\nEdgeListGraph\n\
  \n### 定义位置\n`boost/graph/edge_list.hpp`\n\n### 关联类型\n`graph_traits<edge_list>::vertex_descriptor`\n\
  这是与 `edge_list` 关联的顶点描述符类型。它与作为 edgeiterator 值类型的 `std::pair` 的 `first_type` 类型相同。\n\
  \n`graph_traits<edge_list>::edge_descriptor`\n与 `edge_list` 关联的边描述符类型。\n\n`graph_traits<edge_list>::edge_iterator`\n\
  `edges()` 返回的迭代器类型。`edge_iterator` 的迭代器类别与 `EdgeIterator` 相同。\n\n### 成员函数\n```cpp\n\
  edge_list(EdgeIterator first, EdgeIterator last)\n```\n\n\n\n\n\n创建一个具有 `n` 个顶点，且边由范围\
  \ `first, last)` 给定的边列表指定的图对象。\n\n## 非成员函数\n\n```cpp\nstd::pair<edge_iterator, edge_iterator>\
  \ edges(const edge_list& g)\n```\n返回一个用于访问图 `g` 边集的迭代器范围。\n\n```cpp\nvertex_descriptor\
  \ source(edge_descriptor e, const edge_list& g)\n```\n返回边 `e` 的源顶点。\n\n```cpp\n\
  vertex_descriptor target(edge_descriptor e, const edge_list& g)\n```\n返回边 `e` 的目标顶点。\n\
  \n### 14.3.2 reverse_graph\n\n```cpp\nreverse_graph<BidirectionalGraph>\n```\n\n\
  `reverse_graph` 适配器会反转 `BidirectionalGraph` 的入边和出边，有效地实现了图的转置。`reverse_graph` 的构造是常数时间的，提供了一种获取图转置视图的高效方法。\n\
  \n### 示例\n\n该示例来自 `examples/reverse_graph.cpp`。\n\n```cpp\ntypedef adjacency_list<vecS,\
  \ vecS, bidirectionalS> Graph;\n\nGraph G(5);\n\nadd_edge(0, 2, G);\nadd_edge(1,\
  \ 1, G);\nadd_edge(1, 3, G);\nadd_edge(1, 4, G);\nadd_edge(2, 1, G);\nadd_edge(2,\
  \ 3, G);\nadd_edge(2, 4, G);\nadd_edge(3, 1, G);\nadd_edge(3, 4, G);\nadd_edge(4,\
  \ 0, G);\nadd_edge(4, 1, G);\n\nstd::cout << \"original graph:\" << std::endl;\n\
  print_graph(G, get(vertex_index, G));\n\nstd::cout << std::endl << \"reversed graph:\"\
  \ << std::endl;\nprint_graph(make_reverse_graph(G), get(vertex_index, G));\n```\n\
  \n输出为：\n\n```\noriginal graph:\n0 ––> 2\n1 ––> 1 3 4\n2 ––> 1 3 4\n3 ––> 1 4\n4\
  \ ––> 0 1\nreversed graph:\n0 ––> 4\n1 ––> 1 2 3 4\n2 ––> 0\n3 ––> 1 2\n4 ––> 1\
  \ 2 3\n```\n\n### 参数\n\n![image\n\n### 模型\n\n`BidirectionalGraph` 以及可选的 `VertexListGraph`\
  \ 和 `PropertyGraph`\n\n### 定义位置\n\n`boost/graph/reverse_graph.hpp`\n\n### 相关类型\n\
  \n- `graph_traits<reverse_graph>::vertex_descriptor`: 与 `reverse_graph` 关联的顶点描述符的类型。（Graph\
  \ 要求。）\n- `graph_traits<reverse_graph>::edge_descriptor`: 与 `reverse_graph` 关联的边描述符的类型。（Graph\
  \ 要求。）\n- `graph_traits<reverse_graph>::vertex_iterator`: `vertices()` 返回的迭代器类型。（VertexListGraph\
  \ 要求。）\n- `graph_traits<reverse_graph>::edge_iterator`: `edges()` 返回的迭代器类型。（EdgeListGraph\
  \ 要求。）\n- `graph_traits<reverse_graph>::out_edge_iterator`: `out_edges()` 返回的迭代器类型。（IncidenceGraph\
  \ 要求。）\n- `graph_traits<reverse_graph>::adjacency_iterator`: `adjacent_vertices()`\
  \ 返回的迭代器类型。（BidirectionalGraph 要求。）\n- `graph_traits<reverse_graph>::directed_category`:\
  \ 提供关于图是有向图还是无向图的信息。（Graph 要求。）\n- `graph_traits<reverse_graph>::edge_parallel_category`:\
  \ 描述图类是否允许插入并行边。两个标签为 `allow_parallel_edge_tag` 和 `disallow_parallel_edge_tag`。`setS`\
  \ 和 `hash_setS` 变体不允许并行边，而其他变体允许。（Graph 要求。）\n- `graph_traits<reverse_graph>::traversal_category`:\
  \ 遍历类别反映了图类支持何种类的迭代器。对于 `reverse_graph`，该类型与底层图的 `traversal_category` 相同。（Graph\
  \ 要求。）\n- `graph_traits<reverse_graph>::vertices_size_type`: 用于处理图中顶点数量的类型。（VertexListGraph\
  \ 要求。）\n- `graph_traits<reverse_graph>::edge_size_type`: 用于处理图中边数量的类型。（EdgeListGraph\
  \ 要求。）\n- `graph_traits<reverse_graph>::degree_size_type`: 用于处理图中与顶点相关的边数量的类型。（IncidenceGraph\
  \ 要求。）\n- `property_map<reverse_graph, Property>::type` / `property_map<reverse_graph,\
  \ Property>::const_type`: 图顶点或边属性的属性映射类型。具体属性由 `Property` 模板参数指定，必须与图的 `VertexProperty`\
  \ 或 `EdgeProperty` 中指定的属性之一匹配。（PropertyGraph 要求。）\n\n### 成员函数\n\n```cpp\nreverse_graph(BidirectionalGraph&\
  \ g)\n```\n构造函数。创建图的反转（转置）视图。\n\n### 非成员函数\n\n```cpp\ntemplate <class BidirectionalGraph>\n\
  reverse_graph<BidirectionalGraph> make_reverse_graph(BidirectionalGraph& g)\n```\n\
  创建 `reverse_graph` 的辅助函数。\n\n```cpp\nstd::pair<vertex_iterator, vertex_iterator>\
  \ vertices(const reverse_graph& g)\n```\n返回一个访问顶点集的迭代器范围。（VertexListGraph 要求。）\n\
  \n```cpp\nstd::pair<edge_iterator, edge_iterator> edges(const reverse_graph& g)\n\
  ```\n返回一个访问边集的迭代器范围。（EdgeListGraph 要求。）\n\n```cpp\nstd::pair<out_edge_iterator,\
  \ out_edge_iterator> out_edges(const reverse_graph& g, vertex_descriptor v)\n```\n\
  返回一个访问顶点 `v` 的出边的迭代器范围。（IncidenceGraph 要求。）\n\n```cpp\nstd::pair<in_edge_iterator,\
  \ in_edge_iterator> in_edges(const reverse_graph& g, vertex_descriptor v)\n```\n\
  返回一个访问顶点 `v` 的入边的迭代器范围。（IncidenceGraph 要求。）\n\n```cpp\nstd::pair<adjacency_iterator,\
  \ adjacency_iterator> adjacent_vertices(const reverse_graph& g, vertex_descriptor\
  \ v)\n```\n返回一个访问顶点 `v` 的相邻顶点的迭代器范围。（BidirectionalGraph 要求。）\n\n```cpp\nvertex_descriptor\
  \ source(edge_descriptor e, const reverse_graph& g)\n```\n返回边 `e` 的源顶点。（IncidenceGraph\
  \ 要求。）\n\n```cpp\nvertex_descriptor target(edge_descriptor e, const reverse_graph&\
  \ g)\n```\n返回边 `e` 的目标顶点。（IncidenceGraph 要求。）\n\n```cpp\ndegree_size_type out_degree(vertex_descriptor\
  \ u, const reverse_graph& g)\n```\n返回顶点 `u` 的出边数。（IncidenceGraph 要求。）\n\n```cpp\n\
  degree_size_type in_degree(vertex_descriptor u, const reverse_graph& g)\n```\n返回顶点\
  \ `u` 的入边数。此操作在指定了 `directedS` 时可用。（BidirectionalGraph 要求。）\n\n```cpp\nvertices_size_type\
  \ num_vertices(const reverse_graph& g)\n```\n返回图 `g` 的顶点数量。（VertexListGraph 要求。）\n\
  \n```cpp\nvertex_descriptor vertex(vertices_size_type n, const reverse_graph& g)\n\
  ```\n返回顶点列表中的第 `n` 个顶点。（VertexListGraph 要求。）\n\n```cpp\nstd::pair<edge_descriptor,\
  \ bool> edge(vertex_descriptor u, vertex_descriptor v, const reverse_graph& g)\n\
  ```\n返回图 `g` 中连接顶点 `u` 和顶点 `v` 的边。（AdjacencyMatrix 要求。）\n\n```cpp\ntemplate <class\
  \ Property>\nproperty_map<reverse_graph, Property>::type\nget(Property, reverse_graph&\
  \ g)\n```\n返回由 `Property` 指定的映射对象。\n\n```cpp\ntemplate <class Property>\nproperty_map<reverse_graph,\
  \ Property>::const_type\nget(Property, const reverse_graph& g)\n```\n返回由 `Property`\
  \ 指定的映射。\n\n```cpp\ntemplate <class Property, class X>\ntypename property_traits<property_map<reverse_graph,\
  \ Property>::const_type>::value_type\nget(Property, const reverse_graph& g, X x)\n\
  ```\n返回 `x` 的属性值，结果是一个顶点或边描述符。\n\n```cpp\ntemplate <class Property, class X, class\
  \ Value>\nvoid put(Property, const reverse_graph& g, X x, const Value& value)\n\
  ```\n将 `x` 的属性值设置为 `value`。\n\n\n\n\n\n```cpp\ntemplate <class GraphProperties,\
  \ class GraphProperty>\n\ntypename property value<GraphProperties, GraphProperty>::type&\n\
  \nget_property(reverse_graph& g, GraphProperty);\n```\n这返回附加到图对象 `g` 的由 `GraphProperty`\
  \ 指定属性。`property_value` 特性类定义在 `boost/pending/property.hpp` 中。\n\n```cpp\ntemplate\
  \ <class GraphProperties, class GraphProperty>\n\nconst typename property_value<GraphProperties,\
  \ GraphProperty>::type&\n\nget_property(const reverse_graph& g, GraphProperty);\n\
  ```\n这返回附加到图对象 `g` 的由 `GraphProperty` 指定属性。`property_value` 特性类定义在 `boost/pending/property.hpp`\
  \ 中。\n\n### 14.3.3 `filtered_graph`\n\n```cpp\nfiltered_graph<Graph, EdgePredicate,\
  \ VertexPredicate>\n```\n`filtered_graph` 类模板是一个适配器，创建一个图的过滤视图。边和顶点谓词函数对象决定了原始图中的哪些顶点和边会出现在过滤图中。任何顶点谓词返回\
  \ `false` 的顶点以及任何边谓词返回 `false` 的边都将看起来从图中移除。`filtered_graph` 类没有创建原始图的副本，而是使用原始图的引用。原始图的生命周期必须持续到任何过滤图的使用之后。`filtered_graph`\
  \ 不改变原始图的结构，但可以通过过滤图的属性映射更改原始图的顶点和边属性。\n\n#### 示例\n\n下面的函数对象是一个谓词示例，用于过滤掉权重非正数的边。\n\
  \n```cpp\ntemplate <typename EdgeWeightMap>\n\nstruct positive_edge_weight {\n \
  \  positive_edge_weight() { }\n   positive_edge_weight(EdgeWeightMap weight) :m_weight(weight)\
  \ { }\n   template <typename Edge>\n   bool operator()(const Edge& e) const {\n\
  \     return 0 < get(m_weight, e);\n   }\n   EdgeWeightMap m_weight;\n};\n```\n\
  此示例使用带有上述 `positive_edge_weight` 谓词的 `filtered_graph` 来小型图的过滤视图。边 (`A`, `C`)、(`C`,\
  \ `E`) 和 (`E`, `C`) 的权重均为零，因此不会出现在过滤图中。\n\n```cpp\ntypedef adjacency_list<vecS,\
  \ vecS, directedS,\n   no_property, property<edge_weight_t, int> > Graph;\n\ntypedef\
  \ property_map<Graph, edge_weight_t>::type EdgeWeightMap;\n\nenum { A, B, C, D,\
  \ E, N };\n\nconst char* name = \"ABCDE\";\n\nGraph g(N);\n\nadd_edge(A, B, 2, g);\n\
  add_edge(A, C, 0, g);\nadd_edge(C, D, 1, g);\nadd_edge(C, E, 0, g);\nadd_edge(D,\
  \ B, 3, g);\nadd_edge(E, C, 0, g);\n\npositive_edge_weight<EdgeWeightMap> filter(get(edge_weight,\
  \ g));\nfiltered_graph<Graph, positive_edge_weight<EdgeWeightMap> >\n   fg(g, filter);\n\
  \nstd::cout << \"filtered edge set: \";\nprint_edges(fg, name);\nstd::cout << \"\
  filtered out-edges:\" << std::endl;\nprint_graph(fg, name);\n```\n输出为：\nfiltered\
  \ edge set: (A,B) (C,D) (D,B)\nfiltered out–edges:\nA ––> B\nB ––>\nC ––> D\nD ––>\
  \ B\nE ––>\n\n#### 定义位置\n`boost/graph/filtered_graph.hpp`\n\n#### 模板参数\n![image](img/t0259-01.jpg)\n\
  \n#### 实现的模型\n`filtered_graph<Graph,EP,VP>` 建模的概念取决于 `Graph` 类型。如果 `Graph` 建模任何一种\
  \ `VertexListGraph`、`EdgeListGraph`、`IncidenceGraph`、`BidirectionalGraph`、`AdjacencyGraph`\
  \ 和 `PropertyGraph`，那么 `filtered_graph<Graph,EP,VP>` 也是。\n\n#### 关联类型\n- `graph_traits<filtered_graph>::vertex_descriptor`:\n\
  \  与 `filtered_graph` 关联的顶点描述符类型。（Graph 要求。）\n- `graph_traits<filtered_graph>::edge_descriptor`:\n\
  \  与 `filtered_graph` 关联的边描述符类型。（Graph 要求。）\n- `graph_traits<filtered_graph>::vertex_iterator`:\n\
  \  由 `vertices()` 返回的迭代器类型。该 `vertex_iterator` 与适配图的 `vertex_iterator` 类型相同。（VertexListGraph\
  \ 要求。）\n- `graph_traits<filtered_graph>::edge_iterator`:\n  由 `edges()` 返回的迭代器类型。该迭代器类型建模\
  \ `MultiPassInputIterator` 概念。（EdgeListGraph 要求。）\n- `graph_traits<filtered_graph>::out_edge_iterator`:\n\
  \  由 `out_edges()` 返回的迭代器类型。该迭代器类型建模 `MultiPassInputIterator` 概念。（IncidenceGraph\
  \ 要求。）\n- `graph_traits<filtered_graph>::in_iterator`:\n  由 `in_edges()` 返回的迭代器类型。（BidirectionalGraph\
  \ 要求。）\n- `graph_traits<filtered_graph>::adjacency_iterator`:\n  由 `in_edges()`\
  \ 返回的迭代器类型。（AdjacencyGraph 要求。）\n- `graph_traits<filtered_graph>::directed_category`:\n\
  \  关于图是否为有向的信息（`directed_tag` 或 `undirected_tag`）。Graph 要求。）\n- `graph_traits<filtered_graph>::parallel_category`:\n\
  \  描述图是否允许并行边。（Graph 要求。）\n- `graph_traits<filtered_graph>::vertices_size_type`:\n\
  \  处理顶点数量的类型。（VertexListGraph 要求。）\n- `graph_traits<filtered_graph>::edges_size_type`:\n\
  \  处理边数量的类型。（EdgeListGraph 要求。）\n- `graph_traits<filtered_graph>::degree_size_type`:\n\
  \  处理顶点出边数量的类型。（IncidenceGraph 要求。）\n- `property_map<filtered_graph, PropertyTag>::type`:\n\
  \  顶点或边属性映射类型。（PropertyGraph 要求。）\n\n#### 成员函数\n- `filtered_graph(Graph& g, EdgePredicate\
  \ ep)`:\n  根据谓词 `ep` 创建图 `g` 的边视图。\n- `filtered_graph(Graph& g, EdgePredicate ep,\
  \ VertexPredicate vp)`:\n  根据边谓词 `ep` 和顶点谓词 `vp` 创建图 `g` 的过滤视图。\n\n#### 非成员函数\n\
  `filtered_graph` 支持的功能取决于底层 `Graph` 类型。例如，如果 `Graph` 类型不支持 `in_edges()`，那么 `filtered_graph`\
  \ 也不支持。这里列出了给定 `Graph` 建模 `VertexListGraph`、`EdgeListGraph`、`IncidenceGraph`、`BidirectionalGraph`、`AdjacencyGraph`\
  \ 和 `PropertyGraph` 时，`filtered_graph` 可能支持的所有。\n\n```cpp\nstd::pair<vertex_iterator,\
  \ vertex_iterator> vertices(const filtered_graph& g);\n```\n返回访问 `g` 顶点集的迭代器范围。（VertexListGraph\
  \ 要求。）\n\n```cpp\nstd::pair<edge_iterator, edge_iterator> edges(const filtered_graph&\
  \ g);\n```\n返回访问 `g` 边集的迭代器范围。（EdgeListGraph 要求。）\n\n```cpp\nstd::pair<adjacency_iterator,\
  \ adjacency_iterator> adjacent_vertices(vertex_descriptor v, const filtered_graph&\
  \ g);\n```\n返回访问 `g` 中相邻 `v` 的顶点的迭代器范围。（AdjacencyGraph 要求。）\n\n```cpp\nstd::pair<out_edge_iterator,\
  \ out_edge_iterator> out_edges(vertex_descriptor v, const filtered_graph& g);\n\
  ```\n返回访问 `g` 中顶点 `v` 出边的迭代器范围。（IncidenceGraph 要求。）\n\n```cpp\nvertex_descriptor\
  \ source(edge_descriptor e, const filtered_graph& g);\n```\n\n\n\n\n\n返回边 `e` 的源顶点。\n\
  \n（`IncidenceGraph` 需要。）\n\n```cpp\nvertex_descriptor target(edge_descriptor e,\
  \ const filtered_graph& g)\n```\n\n返回边 `e` 的目标顶点。\n\n（`IncidenceGraph` 需要。）\n\n\
  ```cpp\ndegree_size_type out_degree(vertex_descriptor u, const filtered_graph& g)\n\
  ```\n\n返回离开顶点 `u` 的边数。\n\n（`IncidenceGraph` 需要。）\n\n```cpp\nvertices_size_type num_vertices(const\
  \ filtered_graph& g)\n```\n\n返回底层图 `g` 中的顶点数量。\n\n（`VertexListGraph` 需要。）\n\n```cpp\n\
  edges_size_type num_edges(const filtered_graph& g)\n```\n\n返回图 `g` 中的边数。\n\n（`EdgeListGraph`\
  \ 需要。）\n\n```cpp\ntemplate <typename Property>\nproperty_map<filtered_graph, Property>::type\n\
  get(Property, filtered_graph& g)\n```\n\n```cpp\ntemplate <typename Property>\n\
  property_map<filtered_graph, Property>::const_type\nget(Property, const filtered_graph&\
  \ g)\n```\n\n返回由 `Property` 指定的属性映射对象。`Property` 必须与图的 `VertexProperty` 模板参数中指定的属性之一匹配。\n\
  \n（`PropertyGraph` 需要。）\n\n```cpp\ntemplate <typename Property, typename X>\ntypename\
  \ property_traits<\n  typename property_map<filtered_graph, Property>::const_type\n\
  >::value_type\nget(Property, const filtered_graph& g, X x)\n```\n\n这返回 `x` 的属性值，`x`\
  \ 是顶点或边描述符。\n\n（`PropertyGraph` 需要。）\n\n```cpp\ntemplate <typename Property, typename\
  \ X, typename Value>\nvoid put(Property, const filtered_graph& g, X x, const Value&\
  \ value)\n```\n\n这将 `x` 的属性值设置为 `value`。`x` 是顶点或边描述符。`Value` 必须能够转换为指定属性的数值类型。\n\
  \n（`PropertyGraph` 需要。）\n\n### 14.3.4 SGB `Graph` 指针\n\n`Graph*`\n\nBGL 头文件 `boost/graph/stanford_graph.hpp`\
  \ 将 Stanford GraphBase (SGB) `Graph` 指针适配为与 BGL 的图。注意，并没有使用图适配器类；通过定义多个函数重载，SGB\
  \ 的 `Graph*` 本身变成了多个 BGL 图概念的模型（见下文的“Model Of”部分）。\n\n确保对您安装的 SGB 应用 `PROTOTYPES`\
  \ 更改文件，以便 SGB 头文件符合 ANSI C（因此可以使用 C++ 编译器编译）。\n\n感谢 Andreas Scherer 为此 SGB `Graph*`\
  \ 适配器的实现和文档工作提供的帮助。\n\n#### 示例\n\n参见 `example/miles_span.cpp`、`example/girth.cpp`\
  \ 和 `example/roget_components.cpp`。\n\n#### 模板参数\n\n无。\n\n#### Model Of\n\n`VertexListGraph`、`IncidenceGraph`、`AdjacencyGraph`\
  \ 和 `PropertyGraph`。可用于 SGB 图的属性标签集在本节稍后的“顶点和边属性”中描述。\n\n#### 定义位置\n\n`boost/graph/stanford_graph.hpp`\n\
  \n#### 相关类型\n\n`graph_traits<Graph*>::vertex_descriptor`\n\n与 SGB `Graph*` 关联的顶点描述符类型。我们使用类型\
  \ `Vertex` 作为顶点描述符（`Vertex` 是 `gb_graph.h` 中的类型定义）。\n\n（`Graph` 需要。）\n\n`graph_traits<Graph*>::edge_descriptor`\n\
  \n与 SGB `Graph*` 关联的边描述符类型。使用的类型是 `boost::sgb_edge`。除了支持 BGL 边描述符的所有要求操作外，`boost::sgb_edge`\
  \ 类 get 此构造函数：`sgb_edge::sgb_edge(Arc* arc, Vertex* source)`。（`IncidenceGraph` 需要。）\n\
  \n`graph_traits<Graph*>::vertex_iterator`\n\n`vertices()` 返回的迭代器类型。该迭代器模型为 RandomAccessIterator。\n\
  \n（`VertexListGraph` 需要。）\n\n`graph_traits<Graph*>::out_edge_iterator`\n\n`out_edges()`\
  \ 返回的迭代器类型。如果 `EdgeList=vecS`，则该迭代器模型为 MultiPassInputIterator。\n\n（`IncidenceGraph`\
  \ 需要。）\n\n`graph_traits<Graph*>::adjacency_iterator`\n\n`adjacent_vertices()` 返回的迭代器类型。该迭代器模型与\
  \ out-edge 迭代器相同。\n\n（`AdjacencyGraph` 需要。）\n\n`graph_traits<Graph*>::directed_category`\n\
  \n提供关于图是有向还是无向的标识。SGB `Graph*` 是有向的，因此此类型为 `directed_tag`。（`Graph` 需要。）\n\n`graph_traits<Graph*>::edge_parallel_category`\n\
  \n描述图类是否允许插入并行边（源和目标相同的边）。SGB `Graph*` 不阻止添加并行边，因此此类型为 `allow_parallel_edge_tag`。\n\
  \n（`Graph` 需要。）\n\n`graph_traits<Graph*>::traversal_category`\n\nSGB `Graph*` 提供对顶点集、出边和相邻顶点的遍历。遍历类别定义如下：\n\
  \n```cpp\nstruct sgb_traversal {\n    typedef vertex_list_tag vertex_list_tag;\n\
  \    typedef edge_list_tag edge_list_tag;\n    typedef adjacency_tag adjacency_tag;\n\
  \    typedef directed_tag directed_tag;\n    typedef allow_parallel_edge_tag allow_parallel_edge_tag;\n\
  }; sgb_traversal_tag;\n```\n\n（`Graph` 需要。）\n\n`graph_traits<Graph*>::vertices_size_type`\n\
  \n处理顶点数量的类型。（`VertexListGraph` 需要。）\n\n`graph_traits<Graph*>::edges_size_type`\n\
  \n处理边数量的类型。（`EdgeListGraph` 需要。）\n\n`graph_traits<Graph*>::degree_size_type`\n\n\
  处理顶点出边的类型。（`IncidenceGraph` 需要。）\n\n`property_map<Graph*, PropertyTag>::type`\n\n\
  图中顶点或边的属性映射类型。由 `PropertyTag` 指定，且必须是“属性”章节中描述的标签之一。（`PropertyGraph` 需要。）\n\n####\
  \ 成员函数\n\n无。\n\n#### 非成员函数\n\n```cpp\nstd::pair<vertex_iterator, vertex_iterator>\
  \ vertices(const Graph* g)\n```\n\n返回访问顶点集的迭代器范围。（`VertexListGraph` 需要。）\n\n```cpp\n\
  std::pair<edge_iterator, edge_iterator> edges(const Graph* g)\n```\n\n返回访问边集的迭代器范围。（`EdgeListGraph`\
  \ 需要。）\n\n```cpp\nstd::pair<adjacency_iterator, adjacency_iterator> adjacent_vertices(vertex_descriptor\
  \ v, const Graph* g)\n```\n\n返回访问图中顶点 `v` 相邻顶点的迭代器范围。（`AdjacencyGraph` 需要。）\n\n\
  ```cpp\nstd::pair<out_edge_iterator, out_edge_iterator> out_edges(vertex_descriptor\
  \ v, const Graph* g)\n```\n\n返回访问图中顶点 `v` 出边的迭代器范围。如果是无向图，该迭代器范围提供所有关联顶点 `v` 的边。（`IncidenceGraph`\
  \ 需要。）\n\n```cpp\nvertex_descriptor source(edge_descriptor e, const Graph* g)\n\
  ```\n\n返回边 `e` 的源顶点。（`IncidenceGraph` 需要。）\n\n```cpp\nvertex_descriptor target(edge_descriptor\
  \ e, const Graph* g)\n```\n\n返回边 `e` 的目标顶点。（`IncidenceGraph` 需要。）\n\n```cpp\ndegree_size_type\
  \ out_degree(vertex_descriptor u, const Graph* g)\n```\n\n返回离开顶点 `u` 的边数。（`IncidenceGraph`\
  \ 需要。）\n\n```cpp\nvertices_size_type num_vertices(const Graph* g)\n```\n\n返回图 `g`\
  \ 中的顶点数量。（`VertexListGraph` 需要。）\n\n```cpp\nedges_size_type num_edges(const Graph*\
  \ g)\n```\n\n返回图 `g` 中的边数。（`EdgeListGraph` 需要。）\n\n```cpp\nvertex_descriptor vertex(vertices_size_type\
  \ n, const Graph* g)\n```\n\n返回图顶点列表中的第 `n*` 个顶点。\n\n\n\n\n\n```cpp\ntypename property_map<Graph*,\
  \ PropertyTag>::const_type::value_type;\n\nget(PropertyTag, const Graph* g, X x);\n\
  ```\n这返回 `x` 的属性值，`x` 是一个顶点或边描述符。\n（`PropertyGraph` 需要。）\n\n```cpp\ntemplate <typename\
  \ PropertyTag, typename X, typename Value>\nvoid put(PropertyTag, const Graph* g,\
  \ X x, const Value& value);\n```\n这会将 `x` 的属性值设置为 `value`。`x` 是一个顶点或边描述符。`Value`\
  \ 必须能够转换为与 `PropertyTag` 对应的属性值类型。\n（`PropertyGraph` 需要。）\n\n## 顶点与边的属性\n\nSGB 的\
  \ `Vertex` 和 `Arc` 结构提供了用于存储额外信息的实用字段。我们提供了 BGL 包装器，通过属性映射（property maps）访问这些字段。此外，还还提供了顶点索引映射和边长度映射。可以使用上一节描述的\
  \ `get()` 函数从 SGB `Graph*` 获取属性映射对象，并通过 `property_map` 特性类获取属性映射类型。\n\n可以使用以下属性标签（property\
  \ tags）列表来指定您想要获取映射的实用字段。\n\n// 顶点属性标签\n```cpp\ntemplate <typename T> u_property;\n\
  template <typename T> v_property;\ntemplate <typename T> w_property;\ntemplate <typename\
  \ T> x_property;\ntemplate <typename T> y_property;\ntemplate <typename T> z_property;\n\
  ```\n// 边属性标签\n```cpp\ntemplate <typename T> a_property;\ntemplate <typename T>\
  \ b_property;\n```\n这些标签的模板参数 `T` 限于 SGB 头文件 `gb_graph.h` 中声明的 `util` 联合体中的类型，即\
  \ `Vertex*`、`Arc*`、`Graph*`、`char*` 和 `long`。实用字段的属性映射是 LvaluePropertyMap 的模型。\n\
  \n可以使用 `vertex_index_t` 标签获取顶点索引映射，该属性映射是一个 `ReadablePropertyMap`。可以使用 `edge_length_t`\
  \ 标签获取边长度映射，该属性映射是一个 LvaluePropertyMap，其值类型为 `long`。\n\n## 14.3.5 LEDA GRAPH<V,E>\n\
  \n`GRAPH<V,E>`\n\n由于 `boost/graph/leda_graph.hpp` 中定义了一些函数重载，LEDA 的 `GRAPH` 类模板可以直接作为\
  \ BGL 图来使用。\n\nLEDA `GRAPH` 类的 BGL 接口实现在 §10.3 中进行了讨论，作为如何为非 BGL 图类编写 BGL 适配器的示例。\n\
  \n### 示例\n\n![image](img/open.jpg)leda-graph-eg.cpp 267![image](img/close.jpg) ≡\n\
  \n```cpp\n#include <boost/graph/leda_graph.hpp>\n#include <iostream>\n#undef string\
  \ // LEDA macro!\nint main()\n{\n    using namespace boost;\n    typedef GRAPH<std::string,\
  \ int> graph_t;\n    graph_t g;\n    g.new_node(\"Philoctetes\");\n    g.new_node(\"\
  Heracles\");\n    g.new_node(\"Alcmena\");\n    g.new_node(\"Eurystheus\");\n  \
  \  g.new_node(\"Amphitryon\");\n    typedef property_map<graph_t, vertex all_t>::type\
  \ NodeMap;\n    NodeMap node_name_map = get(vertex_all, g);\n    graph_traits<graph_t>::vertex_iterator\
  \ vi, vi_end;\n    for (tie(vi, vi_end) = vertices(g); vi != vi_end; ++vi)\n   \
  \     std::cout << node_name_map[*vi] << std::endl;\n    return EXIT_SUCCESS;\n\
  }\n```\n输出为\n```\nPhiloctetes\nHeracles\nAlcmena\nEurystheus\nAmphitryon\n```\n\n\
  ### 模板参数\n\n![image](img/t0268-01.jpg)\n\n### 模型自\n\n`VertexListGraph`、`BidirectionalGraph`\
  \ 和 `AdjacencyGraph`。此外对于 LEDA 图中的 `V` 和 `E` 对象还提供了 `VertexMutableGraph` 和 `EdgeMutableGraph`。`vertex_index_t`\
  \ 和 `edge_length_t` 标签提供了访问 LEDA 分配给每个节点和边的 ID 数字。\n\n### 定义位置\n\n`boost/graph/leda_graph.hpp`\n\
  \n### 相关类型\n\n`graph_traits<GRAPH>::vertex_descriptor`: 与 `GRAPH` 关联的顶点类型。\n`graph_traits<GRAPH>::edge_descriptor`:\
  \ 与 `GRAPH` 关联的边类型。\n`graph_traits<GRAPH>::vertex_iterator`: `vertices()` 返回的迭代器类型。\n\
  `graph_traits<GRAPH>::out_edge_iterator`: `out_edges()` 返回的迭代器类型。\n`graph_traits<GRAPH>::in_edge_iterator`:\
  \ `in_edges()` 返回的迭代器类型。\n`graph_traits<GRAPH>::adjacency_iterator`: `adjacent_vertices()`\
  \ 返回的迭代器类型。\n`graph_traits<GRAPH>::directed_category`: 有向图的 LEDA 类型。\n`graph_traits<GRAPH>::parallel_category`:\
  \ 允许并行 LEDA 类型。\n`graph_traits<GRAPH>::traversal_category`: 该图类型提供了顶点迭代器、出边迭代器和入边迭代器。\n\
  `graph_traits<GRAPH>::vertices_size_type`: 表示图中顶点数量的类型，为 `int`。\n`graph_traits<GRAPH>::edges_size_type`:\
  \ 表示图中边数量的类型，为 `int`。\n`graph_traits<GRAPH>::degree_size_type`: 表示顶点出边数量的类型，为 `int`。\
  \ \n`property_map<GRAPH, PropertyTag>::type`: 图中顶点或边的属性映射类型。\n\n### 成员函数\n\n没有额外的成员函数（特别是因为需要修改\
  \ LEDA 源码）。\n\n### 非成员函数\n\n`std::pair<vertex_iterator, vertex_iterator> vertices(const\
  \ GRAPH& g);`\n\n`std::pair<adjacency_iterator, adjacency_iterator> adjacent_vertices(vertex_descriptor\
  \ v, const GRAPH& g);`\n\n`std::pair<out_edge_iterator, out_edge_iterator> out_edges(vertex_descriptor\
  \ v, const GRAPH& g);`\n\n`std::pair<in_edge_iterator, in_edge_iterator> in_edges(vertex_descriptor\
  \ v, const GRAPH& g);`\n\n\n\n\n返回一个迭代器范围，提供访问图 `g` 中顶点 `v` 的入边的权限。如果 `Directed`\
  \ 模板参数指定了 `directedS`，则此操作不可用。它对于 `undirectedS` 和 `bidirectionalS` 可用。\n\n（由 BidirectionalGraph\
  \ 需要。）\n\n```cpp\nvertex_descriptor source(edge_descriptor e, const GRAPH& g)\n\
  ```\n返回边 `e` 的源顶点。\n\n（由 IncidenceGraph 需要。）\n\n```cpp\nvertex_descriptor target(edge_descriptor\
  \ e, const GRAPH& g)\n```\n返回边 `e` 的目标顶点。\n\n（由 IncidenceGraph 需要。）\n\n```cpp\n\
  degree_size_type out_degree(vertex_descriptor u, const GRAPH& g)\n```\n返回离开顶点 `u`\
  \ 的边数。\n\n（由 IncidenceGraph 需要。）\n\n```cpp\ndegree_size_type in_degree(vertex_descriptor\
  \ u, const GRAPH& g)\n```\n返回进入顶点 `u` 的边数。此操作仅在 `Directed` 模板参数指定了 `bidirectionalS`\
  \ 时才可用。\n\n（由 BidirectionalGraph 需要。）\n\n```cpp\nvertices_size_type num_vertices(const\
  \ GRAPH& g)\n```\n返回图 `g` 中的顶点数。\n\n（由 VertexListGraph 需要。）\n\n```cpp\nedges_size_type\
  \ num_edges(const GRAPH& g)\n```\n返回图 `g` 中的边数。\n\n（由 EdgeListGraph 需要。）\n\n```cpp\n\
  std::pair<edge descriptor, bool>\nadd_edge(vertex_descriptor u, vertex_descriptor\
  \ v, GRAPH& g)\n```\n向图中添加边 `(u, v)` 并返回新边的边描述符。对于这种图类型，`bool` 标志将始终为 `false`。\n\
  \n（由 EdgeMutableGraph 需要。）\n\n```cpp\nstd::pair<edge descriptor, bool>\nadd_edge(vertex_descriptor\
  \ u, vertex_descriptor v, const E& ep, GRAPH& g)\n```\n向图中添加边 `(u, v)` 并将 `ep` 属性边内部属性存储的值。\n\
  \n（由 EdgeMutablePropertyGraph 需要。）\n\n```cpp\nvoid remove_edge(vertex_descriptor\
  \ u, vertex_descriptor v, GRAPH& g)\n```\n从图中移除边 `(u, v)`。\n\n（由 EdgeMutableGraph\
  \ 需要。）\n\n```cpp\nvoid remove_edge(edge_descriptor e, GRAPH& g)\n```\n从图中移除边 `e`。在多图的情况下，这与\
  \ `remove_edge(u, v, g)` 函数不同。此 `remove_edge(e, g)` 函数移除单条边，而 `remove_edge(u, v,\
  \ g)` 函数则移除所有的边 `(u, v)`。\n\n（由 EdgeMutableGraph 需要。）\n\n```cpp\nvertex_descriptor\
  \ add_vertex(GRAPH& g)\n```\n向图中添加一个顶点并返回新顶点的顶点描述符。\n\n（由 VertexMutableGraph 需要。）\n\
  \n```cpp\nvertex_descriptor add_vertex(const VertexProperties& p, GRAPH& g)\n```\n\
  向图中添加一个顶点并返回新顶点的顶点描述符。\n\n（由 VertexMutablePropertyGraph 需要。）\n\n```cpp\nvoid clear_vertex(vertex\
  \ descriptor u, GRAPH& g)\n```\n移除所有指向和离开顶点 `u` 的边。该顶点仍在图的顶点集中。\n\n（由 EdgeMutableGraph\
  \ 需要。）\n\n```cpp\nvoid remove_vertex(vertex_descriptor u, GRAPH& g)\n```\n从图的顶点集中移除顶点\
  \ `u`。\n\n（由 VertexMutableGraph 需要。）\n\n```cpp\ntemplate <typename PropertyTag>\n\
  property_map<GRAPH, PropertyTag>::type\nget(PropertyTag, GRAPH& g)\n```\n返回一个由 `PropertyTag`\
  \ 指定顶点属性的可变属性映射对象。\n\n（由 PropertyGraph 需要。）\n\n```cpp\ntemplate <typename PropertyTag>\n\
  property_map<GRAPH, PropertyTag>::const_type\nget(PropertyTag, GRAPH& g)\n```\n\
  返回一个由 `PropertyTag` 指定顶点属性的常量属性映射对象。\n\n（由 PropertyGraph 需要。）\n\n```cpp\ntemplate\
  \ <typename PropertyTag, typename X>\ntypename property_traits<\n    property_map<GRAPH,\
  \ PropertyTag>::const_type\n>::value_type\nget(PropertyTag, const GRAPH& g, X x)\n\
  ```\n返回 `x` 的属性值，其值可以是顶点或边描述符。\n\n（由 PropertyGraph 需要。）\n\n```cpp\ntemplate <typename\
  \ PropertyTag, typename X, typename Value>\nvoid put(PropertyTag, const GRAPH& g,\
  \ X x, const Value& value)\n```\n将 `x` 的属性值设置为 `value`。`x` 可以是顶点或边描述符。\n\n（由 PropertyGraph\
  \ 需要。）\n\n#### 14.3.6 `std::vector<EdgeList>`\n\n```cpp\nstd::vector<EdgeList>\n\
  ```\n`boost/graph/vector_as_graph.hpp` 中的重载函数使得 `std::vector<std::list<int>>` 等类型可以像图一样。\n\
  \n##### 示例\n\n在此示例中，我们使用标准库类构造图，并使用 BGL `print_graph()` 函数（基于 BGL 图接口编写）输出该图。\n\n\
  ![image](img/open.jpg)vector-as-graph.cpp 272![image](img/close.jpg) ≡\n\n```cpp\n\
  #include <vector>\n#include <list>\n#include <boost/graph/vector_as_graph.hpp>\n\
  #include <boost/graph/utility.hpp>\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <iostream>\n\ntypedef std::list<int> EdgeList;\ntypedef boost::adjacency_list<boost::listS,\
  \ int, boost::undirectedS, int, int> Graph;\n\nint main() {\n    Graph g;\n    boost::add_edge(0,\
  \ 1, g);\n    boost::add_edge(1, 2, g);\n    boost::add_edge(2, 0, g);\n    boost::print_graph(g,\
  \ std::cout);\n    return 0;\n}\n```\n\n\n\n\n`vertices_size_type num_vertices(const\
  \ std::vector& g)`\n\n返回图 `g` 中的顶点数量。\n\n（由 `VertexListGraph` 要求。）\n\n# 第 15 章 属性图库\
  \ (Property Map Library)\n\n大多数图算法都需要访问与图顶点和边相关的各种属性。例如，算法可能需要问题数据（如边的长度或容量），也可能需要辅助数据标记（如颜色，用于指示顶点是否被访问过）。这些属性在内存中的存储方式有多种，从顶点和边对象的成员，到通过某些索引访问的数组，再到在需要时计算的属性。为了使通用算法与底层属性表示细节隔离开，引入了*属性图*（property\
  \ map）^(1) 抽象。\n\n有几类属性访问器提供了不同的访问能力：\n\n- **可读 (readable)**：关联的属性数据只能读取。数据以值的形式返回。许多定义问题输入（如边权重）的属性图可以定义为可读属性图。\n\
  - **可写 (writable)**：关联的属性只能写入。用于记录广度优先搜索树中路径的父数组是定义为可写属性图的一个示例。\n- **读/写 (read/write)**：关联的属性既可以写也可以读。Dijkstra\
  \ 最短路径算法中使用的距离属性需要同时提供读和写能力。\n- **左值 (lvalue)**：关联的属性实际上在内存中表示，并且获取它的引用。lvalue 类中的属性图也支持读/写属性图的要求。\n\
  \n对于每一类属性图，都有一个标签结构体（tag struct）。\n\n```cpp\nnamespace boost {\n  struct readable_property_map_tag\
  \ { };\n  struct writable_property_map_tag { };\n  struct read_write_property_map_tag:\n\
  \    public readable_property_map_tag,\n    public writable_property_map_tag { };\n\
  \  struct lvalue_property_map_tag:\n    public read_write_property_map_tag { };\n\
  }\n```\n\n类似于 STL 的 `iterator_traits` 类，这里有一个 `property_traits` 类，它可用于推断与属性图类型相关的类型：键（key）类型、值（value）类型以及属性图类别。`property_traits`\
  \ 有特化，使得指针可以作为属性图对象。\n\n```cpp\nnamespace boost {\n  template <typename PropertyMap>\n\
  \  struct property_traits {\n      typedef typename PropertyMap::key_type key_type;\n\
  \      typedef typename PropertyMap::value_type value_type;\n      typedef typename\
  \ PropertyMap::reference reference;\n      typedef typename PropertyMap::category\
  \ category;\n  };\n\n  // 用于指针作为属性图的特化\n  template <typename T>\n  struct property_traits<T*>\
  \ {\n      typedef T value_type;\n      typedef T& reference;\n      typedef std::ptrdiff_t\
  \ key_type;\n      typedef lvalue_property_map_tag category;\n  };\n\n  template\
  \ <typename T>\n  struct property_traits<const T*> {\n      typedef T value_type;\n\
  \      typedef const T& reference;\n      typedef std::ptrdiff_t key_type;\n   \
  \   typedef lvalue_property_map_tag category;\n  };\n}\n```\n\n## 15.1 属性图概念 (Property\
  \ Map Concepts)\n\n属性图接口由一组概念组成，这些概念定义了一种通用的机制，将键对象映射到相应的值对象，从而为使用属性图的算法隐藏了映射实现的具体细节。属性图的要求在键对象和值对象的类型上故意设计得很模糊，以允许最大程度的灵活性。由于属性图操作是全局函数，可以重载映射函数，使得可以使用几乎任意的属性图类型和键类型。属性图的接口由三个函数组成：`get()`、`put()`\
  \ 和 `operator[]`。下面的具体示例展示了如何使用这三个函数来访问与不同人物相关的地址。\n\n```cpp\ntemplate <typename\
  \ AddressMap>\nvoid foo(AddressMap address)\n{\n  typedef typename boost::property_traits<AddressMap>::value_type\
  \ value_type;\n  typedef typename boost::property_traits<AddressMap>::key_type key_type;\n\
  \  value_type old_address, new_address;\n  key_type fred = \"Fred\";\n  old_address\
  \ = get(address, fred);\n  new_address = \"384 Fitzpatrick Street\"\n  put(address,\
  \ fred, new_address);\n  key_type joe = \"Joe\";\n  value_type& joes_address = address[joe];\n\
  \  joes_address = \"325 Cushing Avenue\";\n}\n```\n\n对于每个属性图，都有一组定义了映射有效键。在无效键上调用属性图会导致未定义行为。属性图必须指定这组有效键。\n\
  \n### 符号 (Notation)\n\n后续章节使用的符号在此处汇总。\n\n![image](img/t279-01.jpg)\n\n### 15.1.1\
  \ ReadablePropertyMap\n\nReadablePropertyMap 通过 `get()` 函数提供对与键关联的值对象的读访问权限。`get()`\
  \ 函数返回对象的拷贝。\n\n- **细化自 (Refinement Of)**：无。\n- **关联类型 (Associated Types)**：\n \
  \ - `property_traits<PMap>::value_type`：属性的类型。\n  - `property_traits<PMap>::reference`：值类型的引用类型。\n\
  \  - `property_traits<PMap>::key_type`：键的类型。属性图可能对键进行模板化，此时该定义为 `void`。\n  - `property_traits<PMap>::category`：属性的类别：可转换为\
  \ `readable_property_map_tag` 的类型。\n\n![image](img/t280-01.jpg)\n\n### 15.1.2 WritablePropertyMap\n\
  \nWritablePropertyMap 通过 `put()` 函数设置与给定键关联的值。\n\n- **细化自 (Refinement Of)**：可构造\
  \ (Constructible)。\n- **关联类型 (Associated Types)**：\n  - `property_traits<PA>::value_type`：属性的类型。\n\
  \  - `property_traits<PA>::key_type`：查找属性的键的类型。属性图可能对键进行模板化，此时该定义为 `void`。\n  -\
  \ `property_traits<PA>::category`：属性的类别：可转换为 `writable_property_map_tag` 的类型。\n\n\
  ![image](img/t280-02.jpg)\n\n### 15.1.3 ReadWritePropertyMap\n\nReadWritePropertyMap\
  \ 概念细化了 ReadablePropertyMap 和 WritablePropertyMap 概念。它还增加了 `property_traits<PA>::category`\
  \ 必须是可转换为 `read_write_property_map_tag` 的类型的要求。\n\n### 15.1.4 LvaluePropertyMap\n\
  \nLvaluePropertyMap 提供对属性对象的引用访问（而不是像 `get()` 那样返回拷贝）。LvaluePropertyMap 可以是变的或不可变的。可变的\
  \ LvaluePropertyMap 返回引用，而不可变的返回常量引用。\n\n- **细化自 (Refinement Of)**：不可变的细化 ReadablePropertyMap，可变的细化\
  \ ReadWritePropertyMap。\n- **关联类型 (Associated Types)**：\n  - `property_traits<PMap>::reference`：引用类型，必须是属性图值类型的引用或常量引用。\n\
  \  - `property_traits<PMap>::category`：属性的类别：可转换为 `lvalue_property_map_tag` 的类型。\n\
  \n![image](img/t281-01.jpg)\n\n## 15.2 属性图类\n\n### 15.2.1 `property_traits`\n\n\
  `property_traits<PropertyMap>`\n\n`property_traits` 类提供了访问属性图*关联类型*的机制。`property_traits`\
  \ 未特化（默认）版本假设属性图提供了所有关联类型的类型定义。\n\n\n\n\n\n```cpp\nnamespace boost {\n\n  template\
  \ <typename PA>\n  struct property_traits {\n    typedef typename PA::key_type key_type;\n\
  \    typedef typename PA::value_type value_type;\n    typedef typename PA::reference\
  \ reference;\n    typedef typename PA::category category;\n  };\n} // namespace\
  \ boost\n```\n\n`category` 类型定义应该是以下类型之一的定义，或者是继承自以下任一之一的类型。\n\n```cpp\nnamespace\
  \ boost {\n\n  struct readable_property_map_tag { };\n  struct writable_property_map_tag\
  \ { };\n  struct read_write_property_map_tag : readable_property_map_tag,\n    writable_property_map_tag\
  \ { };\n  struct lvalue_property_map_tag:read_write_property_map_tag { };\n} //\
  \ namespace boost\n```\n\n通常情况下，将指针作为属性映射对象非常方便，此时 `key_type` 是相对于指针的整数偏移量。提供了 `property_traits`\
  \ 的以下特化版本以及 map 函数重载以适应这种用法。\n\n```cpp\nnamespace boost {\n\n  template <typename\
  \ T>\n  struct property_traits<T*> {\n    typedef std::ptrdiff_t key_type;\n   \
  \ typedef T value_type;\n    typedef value_type& reference;\n    typedef lvalue_property_map_tag\
  \ category;\n  };\n\n  template <typename T>\n  void put(T* pa, std::ptrdiff_t k,\
  \ const T& val) { pa[k] = val; }\n\n  template <typename T>\n  const T& get(const\
  \ T* pa, std::ptrdiff_t k) { return pa[k]; }\n\n  template <typename T>\n  T& at(T*\
  \ pa, std::ptrdiff_t k) { return pa[k]; } }\n} // namespace boost\n```\n\n### 模板参数\n\
  ![image](img/t0283-01.jpg)\n\n### 定义位置\n`boost/property_map.hpp`\n\n### 成员\n\n`property_traits::key_type`\n\
  查找属性的键对象的类型。\n\n`property_traits::value_type`\n属性的类型。\n\n`property_traits::reference`\n\
  对值类型的引用。\n\n`property_traits::category`\n属性映射的类别标签。\n\n#### 15.2.2 `iterator_property_map`\n\
  \n`iterator_property_map<Iterator, IndexMap, T, R>`\n这是一个适配器，它封装了实现 `RandomAccessIterator`\
  \ 的类型以创建一个 LvaluePropertyMap`。该适配器通常用于从数组创建属性映射，其中键是数组的整数偏移量，数组包含值对象。当键类型为整数时，只需为\
  \ `IndexMap` 模板参数使用 `identity_property_map` 即可。否则，你需要提供一个可以将键类型转换为整数的属性映射。例如，图可能有一个内部属性\
  \ `vertex_index_t`，该属性可以通过 `property_map` 属性轨迹类来获取。\n\n### 示例\n下面的示例演示了如何从数组创建属性映射。\n\
  \n![image](img/open.jpg)iterator-property-map-eg.cpp 283![image](img/close.jpg)\
  \ ≡\n\n```cpp\n    #include <iostream>\n    #include <boost/property_map.hpp>\n\
  \    int main()\n    {\n      using namespace boost;\n      double x[] = { 0.2,\
  \ 4.5, 3.2 };\n      iterator_property_map<double*, identity_property_map> pmap(x);\n\
  \      std::cout << \"x[1] = \" << get(pmap, 1) << std::endl;\n      put(pmap, 0,\
  \ 1.7);\n      std::cout << \"x[0] = \" << pmap[0] << std::endl;\n      return 0;\n\
  \    }\n```\n输出为：\n`x[1] = 4.5`\n`x[0] = 1.7`\n\n### 定义位置\n`boost/graph/property_map.hpp`\n\
  \n### 模板参数\n![image](img/t0284-01.jpg)\n\n### 符合的\nLvaluePropertyMap\n\n### 关联类型\n\
  LvaluePropertyMap 需要的所有类型。\n\n### 成员函数\n`iterator_property_map(Iterator iter = Iterator(),\
  \ IndexMap index_map = IndexMap())` 构造函数。\n`template <typename Key> reference operator[](Key\
  \ k) const;` 返回 `*(iter + get(index_map, k))`。\n\n### 非成员函数\n`template <typename\
  \ Iterator, typename IndexMap> iterator_property_map<Iterator, IndexMap, std::iterator_traits<Iterator>::value_type,\
  \ std::iterator_traits<Iterator>::reference> make_iterator_property_map(Iterator\
  \ iter, IndexMap index_map)` 创建迭代器属性映射。\n\n### 15.2.3 属性标签\n```cpp\nnamespace boost\
  \ {\n  enum vertex_index_t { 1};\n  enum edge_index_t { 2};\n  enum edge_name_t\
  \ { 3 };\n  enum edge_weight_t { 4 };\n  enum vertex_name_t { 5 };\n  enum graph_name_t\
  \ { 6 };\n  enum vertex_distance_t { 7};\n  enum vertex_color_t { 8 };\n  enum vertex_degree_t\
  \ { 9 };\n  enum vertex_in_degree_t { 10 };\n  enum vertex_out_degree_t { 11 };\n\
  \  enum vertex_discover_time_t { 12 };\n  enum vertex_finish_time_t { 13 };\n}\n\
  namespace boost {\n  BOOST_INSTALL_PROPERTY(vertex, index);\n  BOOST_INSTALL_PROPERTY(edge,\
  \ index);\n  BOOST_INSTALL_PROPERTY(edge, name);\n}\n```\n\n### 15.3 创建你的属性映射\n\
  属性映射接口的主要目的是为泛型算法引入灵活性。它允许属性以许多不同的方式存储，同时为算法提供通用的接口。接下来的章节包含一个使用属性映射来适配第三方库 Stanford\
  \ GraphBase (SGB) 的示例。之后，我们将查看如何使用 `std::map` 实现属性映射。\n\n#### 15.3.1 用于 Stanford\
  \ GraphBase 的属性映射\n针对 Stanford GraphBase 的 BGL 适配器包含了属性映射，用于访问 SGB 中使用的 `Vertex`\
  \ 和 `Arc` 结构中的各种字段。在本节中，我们描述了实现的一个部分。\n\n本节描述了如何作为 SGB 适配器的一个来实现属性映射。SGB 使用以下 `Vertex`\
  \ 结构体来存储关于顶点的信息。本节描述了如何为 `name` 字段创建属性映射。\n\n```cpp\ntypedef struct vertex_struct\
  \ {\n  struct arc_struct* arcs;\n  char* name;\n  util u, v, w, x, y, z;\n} Vertex;\n\
  ```\n\n实现的主要思路是定义属性映射函数 `operator[]`、`get()` 和 `put()` 以访问结构体成员。`put_get_helper`\
  \ 类使得这项工作变得更容易，它根据 `operator[]` 实现 `put()` 和 `get()`。因此，只需要实现 `operator[]`。此外，必须定义属性映射所需的关联类型。\n\
  \n下面是 `sgb_vertex_name_map` 的实现。我们使用 `put_get_helper` 类（定义在 `boost/property_map.hpp`\
  \ 中）来简化这种属性映射的创建。我们实现了 `operator[]()`，而 `put_get_helper` 实现了 `put()` 和 `get()`。传递给类模板的第一个类型参数是\
  \ `operator[]` 的返回类型，在本例中为 `char*`。第二个参数是属性映射本身。`reference` 类型只有在属性映射是 LvaluePropertyMap\
  \ 时才需要是真正的引用。在这种情况下，我们正在创建一个 `ReadablePropertyMap`。SGB 适配器使用 `Vertex*` 作为图的 `vertex_descriptor`，因此它是属性映射的\
  \ `key_type`。\n\n```cpp\nclass sgb_vertex_name_map\n  : public put_get_helper<char*,\
  \ sgb_vertex_name_map>\n{\npublic:\n  typedef boost::readable_property_map_tag category;\n\
  \  typedef char* value_type;\n  typedef char* reference;\n  typedef Vertex* key_type;\n\
  \  reference operator[](Vertex* v) const { return v–>name; }\n};\n```\n\n#### 15.3.2\
  \ 使用 `std::map` 实现的属性映射\n\n\n\n\n在之前的示例中，属性映射（property map）对象不需要包含任何状态，因为可以通过键直接获取值对象。情况并非总是如此。通常，键被用于在某些辅助数据结构中查找值对象。此类数据结构的一个显而易见的候选是\
  \ `std::map`。使用 `std::map` 作为实现的属性映射需要存储一个指向该关联容器的指针。下面的代码实现了这种属性映射。我们将容器类型设为模板参数，以便该属性映射可以与诸如\
  \ `hash_map` 等其他容器。描述这种容器的概念命名为 `UniquePairAssociativeContainer`。\n\n```cpp\ntemplate\
  \ <typename UniquePairAssociativeContainer>\n\nclass associative_property_map\n\
  \  : public put_get_helper<\n      typename UniquePairAssociativeContainer::value_type::second_type&,\n\
  \      associative_property_map<UniquePairAssociativeContainer> >\n{\n  typedef\
  \ UniquePairAssociativeContainer C;\npublic:\n  typedef typename C::key_type key_type;\n\
  \  typedef typename C::value_type::second_type value_type;\n  typedef value_type&\
  \ reference;\n  typedef lvalue_property_map_tag category;\n  associative_property_map()\
  \ :m_c(0) { }\n  associative_property_map(C& c) :m_c(&c) { }\n  reference operator[](const\
  \ key_type& k) const {\n      return (*m_c)[k];\n  }\nprivate:\n  C* m_c;\n};\n\
  ```\n\n# 第 16 章 辅助概念、类与函数\n\n## 16.1 Buffer（缓冲区）\n\nBuffer 是一个可以放入和移除元素的容器。Buffer\
  \ 概念的要求非常少。它不要求存储元素的任何特定顺序，也不要求移除时元素的特定顺序。然而，通常会有某种排序策略。\n\n### 符号\n\n![image](img/t0289-01.jpg)\n\
  \n### 要求\n\n要使一个类型模型化 Buffer 概念，它必须具有以下成员。\n\n`B::value_type`\n存储在缓冲区中的对象类型。值类型必须是\
  \ `Assignable`（可赋值的）。\n\n`B::size_type`\n用于表示缓冲区中对象数量的无符号整数类型。\n\n`b.push(t)`\n\
  将 `t` 插入缓冲区。`b.size()` 将增加 1。\n\n`b.pop()`\n从缓冲区中移除一个对象，即与 `b.top()` 返回的相同的对象。`b.size()`\
  \ 将减少 1。\n前置条件：`b.empty()` 为假。\n\n`b.top()`\n返回缓冲区中某个对象的引用（或常量引用）。\n前置条件：`b.empty()`\
  \ 为假。\n\n`b.size()`\n返回缓冲区中对象的数量。\n不变性：`b.size()` >= 0。\n\n`b.empty()`\n返回类型为 `bool`，结果值等于\
  \ `b.size() == 0`。\n\n### 复杂度保证\n\n- `push()`、`pop()` 和 `size()` 的时间复杂度相对于缓冲区的大小最坏为线性时间级。\n\
  - `top()` 和 `empty()` 必须是摊还常数时间。\n\n### 模型\n\n`std::stack`、`boost::mutable_queue`、`boost::queue`\
  \ 和 `boost::priority_queue`。\n\n## 16.2 ColorValue（颜色值）\n\n该概念描述了用于颜色值的类型的要求。许多\
  \ BGL 算法使用颜色属性映射来标记算法遍历图的进度。颜色值类型必须是 `EqualityComparable`（可相等比较的），并且 `color_traits`\
  \ 类必须针对 `T` 进行特化，以便定义以下函数。`T` 是 `ColorValue` 模型的类型。\n\n![image](img/t0290-01.jpg)\n\
  \n## 16.3 MultiPassInputIterator（多遍输入迭代器）\n\n该概念是 `InputIterator` 的完善，增加了以下要求：迭代器可以用于对范围进行多次遍历，并且如果\
  \ `it1 == it2` 且 `it1` 可解引用，则 `*++it1 == *++it2`。MultiPassInputIterator 与 `ForwardIterator`\
  \ 类似。唯一的区别是 `ForwardIterator` 要求 `reference` 类型必须是 `value_type&`，而 MultiPassInputIterator\
  \ 类似于 `InputIterator`，其 `reference` 类型只需要能够转换为 `value_type` 即可。\n\n## 16.4 Monoid（半群）\n\
  \nMonoid 是一个描述简单代数系统的概念。它由元素集合 *S*、一个二元运算和一个单位元组成。Monoid 的 C++ 表示由一个实现该二元运算的函数对象、一组表示元素\
  \ *S* 的对象，以及一个表示单位元的对象组成。\n\n### 完善\n\n元素类型必须是 `Assignable`（可赋值的）且 `CopyConstructible`（可拷贝构造）。函数类型必须是\
  \ `BinaryFunction`（二元函数）。\n\n### 表达式\n\n类型 `X` 是元素。对象 `op` 实现二元运算。\n\n![image](img/t0291-01.jpg)\n\
  \n### 不变性\n\n- 封闭性：`op(a, b)` 是 *S* 中的一个元素。\n- 结合律：`op(op(a, b), c) == op(a, op(b,\
  \ c))`\n- 单位元定义：`i` 是类型 *S* 的一个元素。\n\n## 16.5 mutable_queue（可变队列）\n\n`mutable_queue<IndexedType,\
  \ Container, ID>`\n该适配器提供了一种特殊的优先级队列（基于堆实现），具有 `update` 操作。当 `x` 的顺序发生变化时，必须调用 `Q.update(x)`。为了在队列中高效查找\
  \ `x`，必须提供一个映射 `x` 到堆的函数。生成的 ID 必须在 0 到 N 之间，其中 N 是传递给 `mutable_queue` 构造函数的数值。\n\
  \n### 模板参数\n\n![image](img/t292-01.jpg)\n\n### 成员\n\n`value_type`\n同 `IndexedType`。\n\
  \n`size_type`\n用于表示队列的类型。\n\n`mutable_queue(size_type n, const Compare& c, const\
  \ ID& id = ID())`\n构造函数。为 `n` 个元素预留空间。\n\n`template <class InputIterator> mutable_queue(InputIterator\
  \ first, InputIterator last, const Compare& c, const ID& id = ID())`\n构造函数。默认容器\
  \ `std::vector` 从范围 `[first, last)` 填充。\n\n`bool empty() const`\n返回队列为空。\n\n`void\
  \ pop()`\n从队列中移除顶元素。\n\n`value_type& top()`\n返回队列顶元素的引用。\n\n`value_type& front()`\n\
  `top()` 的别名。\n\n`void push(const value_type& x)`\n将对象 `x` 的拷贝插入队列。\n\n`void update(const\
  \ value_type& x)`\n元素的“值”发生了变化，应更新堆排序。该方法假设堆中有一个旧元素 `y` 满足 `index(y) == index(x)`，且\
  \ `x` 是元素的新值。\n\n## 16.6 Disjoint Sets（并集）\n\n### 16.6.1 disjoint_sets\n\n`disjoint_sets<RankMap,\
  \ ParentMap, FindCompress>`\n该类提供了并集操作，有时称为并查集（union-find）数据结构。并集数据结构维护一组不相交集合 *S\
  \ = S*[1],S*[2],...,S[k]*。每个集合由其内部的某个*代表元*来标识。集合由根树表示，这些树编码在 `ParentMap` 属性映射中。使用了两种启发式：*按秩合并*（union\
  \ by rank）和*路径压缩*（path compression）来加速操作。\n\n#### 模板参数\n\n![image](img/t0293-01.jpg)\n\
  \n#### 示例\n\n`disjoint_sets` 的典型用法模式可以在 `kruskal_minimum_spanning_tree()` 算法中看到。在这个示例中，我们调用\
  \ `link()` 而不是 `union_set()`，因为 `u` 和 `v` 是通过 `find_set()` 获取的，因此已经是它们所属集合的代表元。\n\
  \n\n\n\n```cpp\n// . . .\n\ndisjoint_sets<RankMap, ParentMap, FindCompress> dsets(rank,\
  \ p);\n\nfor (ui = vertices(G).first; ui != vertices(G).second; ++ui)\n    dsets.make_set(*ui);\n\
  \n// . . .\n\nwhile ( !Q.empty() ) {\n    e = Q.front();\n    Q.pop();\n    u =\
  \ dsets.find_set(source(e));\n    v = dsets.find_set(target(e));\n    if ( u !=\
  \ v ) {\n        *out++ = e;\n        dsets.link(u, v);\n    }\n}\n```\n\n### 成员\n\
  \n`disjoint_sets(RankMap r, ParentMap p)`\n构造函数。\n\n`disjoint_sets(const disjoint_sets&\
  \ x)`\n拷贝构造函数。\n\n```cpp\ntemplate <typename Element>\nvoid make_set(Element x)\n\
  ```\n创建一个包含元素 `x` 的单元素集。\n\n```cpp\ntemplate <typename Element>\nvoid link(Element\
  \ x, Element y)\n```\n合并由元素 `x` 和 `y` 表示的两个集。\n\n```cpp\ntemplate <typename Element>\n\
  void union_set(Element x, Element y)\n```\n合并元素 `x` 和 `y` 的两个集。这等同于 `link(find_set(x),find_set(y))`。\n\
  \n```cpp\ntemplate <typename Element>\nElement find_set(Element x)\n```\n返回包含元素\
  \ `x` 的集的代表元素。\n\n```cpp\ntemplate <typename ElementIterator>\nstd::size_t count_sets(ElementIterator\
  \ first, ElementIterator last)\n```\n返回不交集的数量。\n\n```cpp\ntemplate <typename ElementIterator>\n\
  void compress_sets(ElementIterator first, ElementIterator last)\n```\n平坦化父树，使得每个元素的父节点都是其代表元素。\n\
  \n# 复杂度\n\n时间复杂度为 `O(mα(m, n))`，其中 `α` 是反阿克曼函数，`m` 是并集集合的操作次数（`make_set()`、`find_set()`\
  \ 和 `link()`），`n` 是元素的数量。`α` 函数的增长非常缓慢，远比对数函数。\n\n### 16.6.2 `find_with_path_halving`\n\
  \n`find_with_path_halving`\n\n该仿函数找到与元素 `x` 属于同一分量的代表顶点，同时使用路径减半（path-halving）压缩树。\n\
  \n```cpp\ntemplate <typename ParentMap, typename Element>\nElement operator()(ParentMap\
  \ p, Element x)\n```\n\n### 16.6.3 `find_with_full_path_compression`\n\n`find_with_full_path_compression`\n\
  \n该仿函数找到与元素 `x` 属于同一分量的代表顶点，同时使用全路径压缩（full path compression）压缩树。\n\n```cpp\ntemplate\
  \ <typename ParentMap, typename Element>\nElement operator()(ParentMap p, Element\
  \ x)\n```\n\n### 16.7 `tie`\n\n```cpp\ntemplate <typename T1, typename T2>\ntuple<T1,\
  \ T2> tie(T1& a, T2& b);\n```\n这是由 Jaakko Jäarvi 提供的 Boost Tuple 库函数，它使得处理返回对（或通用的元组）的函数更加方便。`tie()`\
  \ 函数的作用允许将对中的两个值赋值给两个独立的变量。\n\n#### 定义位置\n`boost/tuple/tuple.hpp`\n\n#### 示例\n一个将\
  \ `tie()` 函数与 `vertices()` 函数使用的示例，`vertices()` 返回一个类型为 `std::pair<vertex_iterator,\
  \ vertex_iterator>` 的对。迭代器对赋值赋值迭代器变量 `i` 和 `end`。\n\n```cpp\ngraph_traits<graph_t>::vertex_iterator\
  \ i, end;\n\nfor(tie(i,end) = vertices(g); i != end; ++i)\n  // . . .\n```\n\n这是另一个使用\
  \ `tie()` 处理 `std::set` 操作的示例。\n\n```cpp\n#include <set>\n#include <algorithm>\n\
  #include <iostream>\n#include <boost/tuple/tuple.hpp>\n\nint main()\n{\n  typedef\
  \ std::set<int> SetT;\n  SetT::iterator i, end;\n  bool inserted;\n  int vals[5]\
  \ = { 5, 2, 4, 9, 1 };\n  SetT s(vals, vals + 5);\n  int new_vals[2] = { 3, 9 };\n\
  \  for (int k = 0; k < 2; ++k) {\n    // 使用 tie() 处理返回 pair<iterator, bool> 的返回值\n\
  \    boost::tie(i,inserted) = s.insert(new_vals[k]);\n    if (!inserted) std::cout\
  \ << *i << \" was already in the set.\" << std::endl;\n    else std::cout << *i\
  \ << \" successfully inserted.\" << std::endl;\n  }\n  return EXIT_SUCCESS;\n}\n\
  ```\n输出为：\n3 successfully inserted.\n9 was already in the set.\n\n### 16.8 `graph_property_iter_range`\n\
  \n`graph_property_iter_range<Graph, PropertyTag>`\n该类生成一对起始/结束迭代器，用于访问图中所有顶点的顶点属性，或所有边的边属性。\n\
  \n#### 示例\n此示例遍历图中的所有顶点，并将字符串赋值到 name 属性中。然后再次循环并将名称打印到标准输出。\n\n```cpp\n#include\
  \ <boost/graph/adjacency_list.hpp>\n#include <boost/graph/property_iter_range.hpp>\n\
  \nint main()\n{\n  using namespace boost;\n  typedef adjacency_list<listS, vecS,\
  \ directedS, property<vertex_name_t, std::string> > graph_t;\n  graph_t g(3);\n\
  \  const char* vertex_names[] = { \"Kubrick\", \"Clark\", \"Hal\" };\n  int i =\
  \ 0;\n  graph_property_iter_range<graph_t, vertex_name_t>::iterator v, v_end;\n\
  \  for (tie(v, v_end) = get_property_iter_range(g, vertex_name); v != v_end; ++v,\
  \ ++i) {\n    *v = vertex_names[i];\n    tie(v, v_end) = get_property_iter_range(g,\
  \ vertex_name);\n    std::copy(v, v_end, ostream_iterator<std::string>(std::cout));\n\
  \    std::cout << std::endl;\n  }\n  return 0;\n}\n```\n输出为\nKubrick\nClark\nHal\n\
  \n#### 定义位置\n`boost/graph/property_iter_range.hpp`\n\n#### 模板参数\n\n#### 关联类型\n`graph_property_iter_range::iterator`\n\
  值类型为指定属性的迭代器。\n`graph_property_iter_range::const_iterator`\n值类型为指定属性的常量迭代器。\n`graph_property_iter_range::type`\n\
  类型为 `std::pair<iterator, iterator>`。\n`graph_property_iter_range::const_type`\n\
  类型为 `std::pair<const_iterator, const_iterator>`。\n\n#### 成员函数\n无\n\n#### 非成员函数\n\
  ```cpp\ntemplate<typename Graph, typename Tag>\ntypename graph_property_iter_range<Graph,\
  \ Tag>::type\nget_property_iter_range(Graph& graph, const Tag& tag)\n```\n返回一对用于访问属性的迭代器，遍历所有顶点或边。\n\
  \n```cpp\ntemplate<typename Graph, typename Tag>\ntypename graph_property_iter_range<Graph,\
  \ Tag>::const_type\nget_property_iter_range(const Graph& graph, const Tag& tag)\n\
  ```\n返回一对用于访问属性的常量迭代器，遍历所有顶点或边。\n\n## 参考文献\n[1] Dimacs implementation format. [`dimacs.rutgers.edu/Challenges/`](http://dimacs.rutgers.edu/Challenges/).\n\
