- pgno: 98
  md: '# Our Categories of Metrics


    There are different ways to classify metrics. We follow the five classifications
    of data mentioned in Chapter 1 and work with the corresponding five types of metrics:


    +   1. Business metrics

    +   2. Project metrics

    +   3. Process metrics

    +   4. Subprocess metrics

    +   5. Product metrics


    Some of these categories could overlap depending on the definitions used in the
    organization. The same metrics could be reused in a different context under a
    different category. For example, reuse is generally regarded as a process metric.
    However, it can be used as a product metric to evaluate product behavior, as a
    project metric to understand time saved by reuse, and as a business metric to
    estimate profit generated by reuse. Context influences categorization.


    # Business Metrics


    These are defined and deployed to implement business strategy in the organization.
    The metrics are strategic in nature. A popular example of the use of business
    metrics may be seen in the balanced score card framework of Kaplan et al. [3].
    In this framework, metrics are identified under four categories: finance, process,
    learning and growth, and customer. Kaplan promises progress through measurements.
    These metrics interact and from a system with cause–effect relationships. Deriving
    business metrics from business strategy is very similar to the approach in the
    GQM paradigm of Victor Basili [1]. However, instead of using a translation tree,
    metrics are mapped to strategy.


    > *Business metrics are driven by strategy and situation.*


    # Project Metrics


    Managing a software project needs some minimum metrics such as effort, schedule,
    quality, productivity, and customer satisfaction (measured through surveys). Project
    metrics are based on project requirements and customer requests. These are driven
    by project scope. The list of project metrics is extended to accommodate customer
    requirements such as reliability and maintainability. Some customers show keen
    interest in knowing product quality, down to the module level. They seek reports
    on module quality and module performance during testing. Project metrics'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'also have to satisfy information to be communicated to stakeholders. For example,
    resource utilization can become an important metric sought by human resources
    and finance departments. Server downtime is a metric that would help the facilities
    management department. Projects also measure risk by internal surveys.


    In general, project metrics are requirement driven. They are to be specified during
    scope definition. Project metrics also serve as information devices and assist
    in project communication.


    # BOX 5.3 ANALOGY: CONSTRUCTING A BUILDING


    Software development is analogous to constructing a building in some ways. The
    natural metrics in a civil construction are the size of the building, the grade
    of quality of interior and materials used, and the reliability of the building
    against natural forces such as wind and rain. Similarly, in constructing a software
    product, the basic metrics are size, complexity, and reliability. In a construction
    business, routinely maintained design and construction logbooks show these metric
    data. In software projects, these metrics are slowly being accepted; a few organizations
    maintain these records, and many others still wait.


    # Process Metrics


    Every process presents opportunities for metrics at the input, process, and output
    stages. Such a process metric is used first to understand, then to control the
    process, and later to improve the same.


    > Use metrics to understand, control, and improve.


    Software delivery is made through a chain of processes, and one or more metrics
    can be used to control and improve each process stage in the chain. The total
    number of process metrics is equal to or more than the number of stages. Metric
    choice is driven by process control needs. This choice of metrics is further influenced
    by the life cycle model used. For example, in the waterfall life cycle, metrics
    such as requirement stability, design complexity, code size, and test effectiveness
    can be used to address control needs in each development phase.


    # Subprocess Metrics


    A more detailed process control takes us to the subprocess. For example, a process,
    such as design, can be broken down to manageable subprocesses such as design,
    design review, and redesign. The metrics for controlling these subprocesses are
    design effort, design review effort, and design rework effort. Subprocess metrics'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'present a management challenge because these metrics get closer to the individuals
    who fear exposure and hence refrain from sharing data. As Deming said, we need
    to “drive out fear” if we want to collect subprocess metric data.


    # Product Metrics


    Software product structure and performance are monitored through product metrics.
    For example, we can measure software code size by lines of code, structure by
    function point, quality by defect density, and reliability by mean time between
    failure. In the design stage, we can measure structure by function point and size
    by number of design pages. In the requirement stage, we can measure size by number
    of features. Product metrics can be used to monitor “product health.”


    # BOX 5.4 EARTHQUAKE


    Earthquake prediction uses esoteric metrics. For example, the rise and fall of
    water levels in deep wells in China are measured; elsewhere, in a scientific approach,
    weak magnetic signals are monitored using sophisticated equipment to measure seismic
    activity. Seismic vibrations are picked up along fault lines and analyzed to predict
    earthquakes. All these metrics are special, expensive, and based on geological
    models. Likewise, software reliability prediction needs special metrics. Metric
    choice depends on the reliability model selected for prediction. These metrics
    are not routine but special, and they belong to the category of “model-driven
    metrics.” They have to be specially designed and deployed, and the extra cost
    and effort should be approved by business leaders.


    # Case Study: Power of Definitions


    The definition of metrics precedes metric data. Metric definitions shape our approach
    to engineering before data validates our approach. The names of metrics with their
    definitions are part of the engineering and management vocabulary. Richer vocabulary
    reflects richer practices. Asking how many metrics we need is like asking how
    many words we need to converse effectively.


    > A few words are enough to exchange pleasantries,

    > A hundred are enough to manage simple conversations,

    > A thousand makes one an expert communicator, and

    > Many more are used by professionals.'
