- pgno: 105
  md: 'This is the most serious concern of any project manager, time being a scarce
    resource that cannot be bought out but can only be saved. The trick is to track
    time performance using any convenient metric every milestone. The metric could
    be schedule variance or schedule slippage or earned value metrics (EVM).


    # **Cost**


    This metric is tracked often as man days; the overhead can be added by a finance
    expert.


    # **Quality**


    Every work product quality should be tracked by counting defects and normalizing
    the defect count by an appropriate expression of size.


    # **Productivity**


    Size developed per man day is a common expression of this metric. There are several
    other definitions to choose from depending upon the purpose of measurement.


    # **Time to Repair**


    The time taken to fix bugs is an important metric and is tracked automatically
    through the bug tracking tool.


    # **Customer Satisfaction**


    This metric is obtained using quarterly surveys or annual surveys.


    # **Requirement Volatility**


    Score creep or requirement volatility is a crucial metric and is to be closely
    tracked by the project team.


    # **Examples of Product Metrics**


    # **Requirement Size**


    Requirement management suggests we measure the size in terms of number of features
    or number of pages or simply the number of requirements. Some use “use case points”
    or another specially designed metric.'
  merge: -1
  img_proc: true
