    # Appendix 1.1: Definition of Descriptive Statistics


    # Number of Data Points


    When we see a metric value, we should also know the size of the sample used in
    the calculation.


    Number of data points (observations) n


    # Sum


    This is a plain total of all values, useful as a meta-calculation:


    Sum = Σ_{i=1}^{i=n} x_i


    # Variance


    This is a mathematical calculation of data dispersion obtained from the following
    formula:


    Variance = ( Σ_{i=1}^{n} (x_i - x̄)^2 ) / (n - 1)


    where n is the sample size and x̄ is the sample mean. Variance is the average
    squared deviation from the mean.


    # Standard Deviation


    Square root of variance is equal to standard deviation. This is the mathematical
    expression of dispersion. This is also a parameter to normal distribution.'
  merge: -1
  img_proc: true
