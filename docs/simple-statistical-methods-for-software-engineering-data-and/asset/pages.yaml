  md: '# Analyzing Extreme Problems


    Instead of seeing problems as tails of some parent distribution, extreme value
    analysis using Gumbel distributions allows us to look at the problem squarely
    in the eye.


    The Gumbel distribution can be used to analyze several extreme problems in addition
    to the two we have discussed so far. For example, we can do a simple schedule
    variance analysis by collecting data, as shown in Figure 20.5.


    This shows the distribution of maximum values of schedule variances in a development
    project. The PDF is built with a location parameter of 20 and a scale parameter
    of 12.


    Likewise, we can easily analyze extremely error prone modules, extremely costly
    effort escalations, extreme volatility of requirements, and so on. There is a
    great opportunity for such modern and innovative analysis.


    There are a few cautions to be taken before we do extreme value analysis.


    > First, data collection needs care. Data must be drawn from samples that are
    independent and identical (the iid criterion). Extreme values in a single organization
    approximately meet this requirement of identicality, assuming similar process
    run in all projects. Data samples also can be easily made independent (one sample
    does not influence another). Doing extreme value analysis across distinctly different
    processes is not suggested.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_336_0.png)


    Figure 20.5 Gumbel maximum of extreme values of schedule variance.'
  merge: -1
