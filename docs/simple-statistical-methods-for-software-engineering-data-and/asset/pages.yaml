  md: 'At 60 years of age, when many people are thinking of retiring, Mr. Humphrey
    embarked on a new career at Carnegie Mellon University, where he established the
    software process program that instilled a discipline to software development.


    His colleague, Anita Carleton, the director of the Carnegie Mellon Software Engineering
    Institute’s Software Engineering Process Management Program, said that before
    Mr. Humphrey came along, software engineers created programs by coding and testing.
    He changed the culture of the discipline to develop a more systematic approach
    to planning, developing, and releasing new software.


    His work earned him the National Medal of Technology, which was presented to him
    by President George W. Bush in 2005.


