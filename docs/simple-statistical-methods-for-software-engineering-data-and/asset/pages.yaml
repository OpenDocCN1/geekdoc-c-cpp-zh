  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_300_0.png)


    Figure 18.5 Gamma cumulative distribution of clarification time with a shape of
    1.2 and a scale of 30.1352.


    If there is a tolerance limit for clarification time set at 80 days by the maintenance
    team, then we can mark a line at x = 80 at the PDF. This line defines a tail,
    whose area represents risk. This line is marked in Figure 18.4. This is a fat
    tail indeed, indicating high risk. We have chosen gamma distribution to produce
    this fat tail and capture the hidden risk loud and clear.


    To judge risk, we better plot the cumulative gamma distribution for the same scale
    and shape parameters. This CDF is shown in Figure 18.5.


    The line from the tolerance limit of 80 days meets the CDF, and from the meeting
    point, a horizontal line is drawn, which meets the y axis at around 0.9. The y
    axis represents cumulative probability, and 0.9 means that there is a 90% chance
    of clarification time being within the limit. The risk of exceeding the limit
    is therefore 10%.


    # Shifting the Gamma PDF


    Assume that the customer specifies a minimum time they need to resolve this problem,
    given the fact that the related managers are constantly traveling and communication
    with them slows down. Assume further that the customer specified a minimum of
    4 days. Building this minimum time into the gamma function means “shifting of
    the curve” to the right by 4 units of time, as shown in Figure 18.4. That means
    that the location of the curve is shifting from x = 0 to x = 4. This minimum defines
    the location parameter μ.'
