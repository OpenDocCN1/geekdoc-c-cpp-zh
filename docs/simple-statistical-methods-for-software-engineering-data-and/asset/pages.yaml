    \ module is counted from the defect log.\n\nSize is a base measure. Defect count\
    \ is another base measure. The ratio of defects to size is called defect density.\
    \ It is a derived measure, a composite derived from two independent base measures.\
    \ It denotes product quality.\n\nProductivity is another example for a derived\
    \ measure.\n\nMeasures are directly mapped values. Metrics are meaningful indicators\
    \ constructed against requirements.\n\n![](img/2f042205c6c0e14747f198ed8f9c9f40_92_0.png)\n\
    \nA “measure” refers to directly mapped value.\nA “metric” refers to a meaningful\
    \ indicator.\n\nTechnically speaking, size is a measure, and complexity is a metric.\
    \ Arrival time is a measure, and delay in the arrival is a metric.\n\nMetrics\
    \ carry more meaning than measures. Hence, metrics are “meaningful indicators.”\n\
    \n# Estimation and Metrics\n\nA few metrics such as effort variance and schedule\
