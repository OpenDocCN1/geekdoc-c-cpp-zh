  md: '# BOX 13.3 GAUSSIAN SMOOTHENING


    In image reconstruction Gaussian distribution is used.


    In the domain of electromagnetic radiation, antenna beam widths are Gaussian reconstructed
    from the half power beam widths, which are easier to measure. The empirical construction
    of the beam with multiple data points is time consuming and looks less attractive
    when Gaussian smoothening is an accepted scientific practice. Gaussian smoothening
    saves time and money, and yet succeeds in constructing truth. In image processing,
    Gaussian smoothening is widely used.


    An example of a common algorithm used to perform image smoothening is Gaussian.
    Each pixel is convolved with a Gaussian kernel and summed up; the result is suppression
    of noise, better signal-to-noise ratio, and better quality image. The bell curve
    is used to beat noise.


    In digital signal processing, the Gaussian filter retrieves truer signals. In
    spatial smoothening MRI images, Gaussian smoothening is used to enrich the picture.
    Gaussian smoothening blurs the noise. The degree of smoothening is determined
    by the standard deviation of the Gaussian. Larger standard deviation Gaussians,
    of course, require larger convolution kernels to be accurately represented. “The
    Gaussian outputs a ‘weighted average’ of each pixel’s neighborhood, with the average
    weighted more towards the value of the central pixels.”


    During the reconstruction of scanned images, Gaussian smoothening is like a low-pass
    filter. The Gaussian window is an attractive option for volume visualization in
    CT scans [8].


    # Combining Normal Probability Density Functions (PDF): The Law of Quadrature


    A very useful property of the normal distribution is that we can easily combine
    several normal PDFs using a simple rule set:


    > Add the means to obtain the overall mean.

    > Add the variances to obtain the overall variance.


    For example, the schedule performance of milestones can be combined using this
    property. The overall schedule for the project is the sum of schedules of milestones.
    The overall variance in the project schedule is the sum of individual milestone
    schedule variances. An example is available in Table 13.2.


    The root cause for risk is variance, and Table 13.2 provides variance data across
    the project at every declared milestone. These milestones constitute on the critical
    path. Their variances are added by using the law of quadrature to obtain the overall'
