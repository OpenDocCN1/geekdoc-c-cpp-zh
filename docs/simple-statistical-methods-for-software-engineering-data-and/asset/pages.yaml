- pgno: 236
  md: 'Alignment depends on how close the process mean is to the process target. Alignment
    can be measured by the distance between process mean and process target. Processes
    tend to drift away from the target. Drift diminishes capability. A drifted process
    achieves only a part of its potential. Hence, we have the concept of achieve process
    capability index Cpk, shown as follows:


    Cpk, achieved process capability = Cp(1 − k)


    where k = process drift/half of specification window.


    The more the drift, the more will be the value of k and the less will be the value
    of Cpk.


    There is an established tradition that puts Cp at 1.0 for acceptable quality and
    2.0 for excellent quality.


    Besides, if Cpk < Cp, then the process requires alignment to the target.


    An example calculation is shown in Table 13.3. Effort variance metric is used
    for this example calculation. The mean is 5%, and the SD is 7%. Specification
    limits typically are ±10%. In Table 13.3, Cp is calculated as 0.48, and Cpk is
    calculated as 0.24. Two improvement opportunities emerge from these calculations.
    The first opportunity is to improve Cpk and make it equal to Cp; this involves
    process alignment, meaning a shift in the central tendency. The next opportunity
    is to achieve


