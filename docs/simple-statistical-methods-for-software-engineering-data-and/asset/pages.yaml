    # Classic Metrics: Unpopular Science


    Classic software metrics have become an unpopular science, at least in parts,
    because of the evolution of software engineering. A few rigorous metrics have
    rendered truth less accessible, and such ill-designed metrics turned out to be
    masks; instead of revealing, they hid truth. Ambiguous metrics have made things
    worse being subject to multiple interpretations. The majority of classic metrics
    are not direct.


    Effort variance, for example, is seldom based on true effort spent but is based
    on permissible numbers. An engineer may have spent 14 hours in a day but is asked
    to enter only 8 hours because that is the billable amount and the client is not
    paying for overtime. In this case, metrics breed hypocrisy, the very evil it seeks
    to fight. Users need to “understand” the hidden context and guess the hidden meaning.


    Schedule variance in a business governed by a service-level agreement has no meaning
    but is still mentioned in the metric plan. Numbers are entered to fill reports;
    no one from the project takes such metric report seriously.


    Productivity metrics and corporate goals on productivity are a source of perennial
    conflict. A common goal is set for all categories of tasks, unmindful of the differences
    in the underlying engineering principles and process capabilities. In such a case,
    no one believes productivity data.'
