- pgno: 65
  md: '# Standard Deviation


    If we take the square root of the variance of bug fix time, we will obtain 11.190
    days. This is the standard deviation, SD, of bug repair time, the most commonly
    used measure of dispersion. This is larger than the average absolute deviation.


    > The standard deviation is always larger than the average absolute deviation.


    The exact formula for standard deviation, SD, has a small correction for sample
    size. Instead of using n as the number of data points, the exact calculation uses
    n − 1, the degrees of freedom; that is,


    ```

    SD = sqrt( sum_{i=1}^{n} (x - x̄)^2 / (n - 1) )  (3.3)

    ```


    The corrected value of standard deviation for bug repair time is 11.284.


    Process dispersion can be defined in terms of standard deviation, sigma. It is
    a tradition dating back to the 1920s to take process variation as ±3 sigma. The
    normal distribution beyond ±3 sigma is disregarded. Mathematically speaking, the
    normal distribution runs from minus infinity to plus infinity. We trim the tails
    and take the span from −3 sigma to +3 sigma as the process dispersion. The trimming
    rules are associated with confidence level. The ±3 sigma trimming rule is associated
    with a confidence level of 97.3%.


    # BOX 3.3 THUMB RULES


    With experience, people develop thumb rules about using dispersion measures. Although
    the rules depend on the individual person, here is an educative example. The following
    table shows three ways of applying dispersion.


    | SNo | Purpose | Range Considered | Confidence Level |

    |---|---|---|---|

    | 1 | Business decisions | Interquartile | 50% |

    | 2 | Process decisions | 3–97 percentile | 94% |

    | 3 | Risk avoidance | Max–min | 100% |


    Business decisions are customarily taken to accommodate IQR of variation. To accommodate
    more would need an unrealistic budget. Process decisions are made with expectations
    of reasonably stringent discipline. Risk avoidance involves understanding and
    accommodating extreme values. You can form your own rules of thumb to manage dispersion.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Skewness and Kurtosis


    # Pearson’s Skewness


    Skewness is a measure of asymmetry in data. Pearson’s formula for skewness is
    based on the difference between mean and mode. If the difference is more, there
    is more asymmetry. The formula is given as follows:


    Skewness = (Mean − Mode) / SD  (3.4)


    Applying this formula to bug repair time data, we obtain a skewness of 0.666.
    The value is positive, indicating the presence of more large data. Data are said
    to be skewed to the right. If the skewness is negative, data would be negatively
    skewed, or skewed to the left.


    If the mode is ill defined, then we can use the following modified formula based
    on the difference between mean and median:


    Skewness = 3(Mean − Median) / SD  (3.5)


    For bug repair time data, this formula yields a skewness of 0.669.


    # Bowley’s Skewness


    A robust estimate of skewness is based on quartiles and median. This is also known
    as quartile skewness or Bowley’s skewness. The formula is given as follows:


    Bowley’s skewness = (Q₃ + Q₁ − 2Median) / (Q₃ − Q₁)  (3.6)


    For bug repair time data, Bowley’s skewness was calculated as 0.259. This value
    is much smaller than Pearson’s value. Bowley’s skewness is on a different scale;
    it varies from −1 to +1. Pearson’s skewness varies from −3 to +3.


    # Third Standardized Moment


    Skewness can be considered using the method of moments. Skewness is the third
    standardized moment. This convention is followed in Excel in the function SKEW
    that uses the following formula:


    Skewness = [n / ((n−1)(n−2))] Σ ((xᵢ − x̄) / s)³  (3.7)


    where n is the sample size, x̄ is the sample mean, and s is the sample standard
    deviation.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'It may be noted that in the formula, deviations are raised to the third power.
    Also, like in all skewness calculations, the value is normalized or standardized
    with a division by standard deviation.


    The moment-based calculation skewness—using Excel function SKEW—for bug repair
    time data is 1.271. This is a more sensitive measure of skewness.


    # BOX 3.4 SKEWED LIFE


    A good amount of software project data are skewed. Symmetrical and normal data
    are an exception. Data from simple processes show symmetry. Data from complex
    processes are skewed. Software development is certainly a collection of several
    processes and is expected to produce skewed data. If data collection is a process
    of observation, then we must recognize skew in data and learn to accept skew as
    a reality of life. The transformation of skewed data into symmetrical data is
    an artificial step performed often to apply some statistical tests. The untransformed
    raw data from software projects is often skewed. An outstanding example is the
    skew in complexity data. Another is skew in TAT data. In such cases, skew is the
    DNA of a process. Skew may restrict the application of several classic statistical
    methods while testing the data, but that is a secondary issue.


    # Kurtosis


    The flatness of data is measured as kurtosis. The lower the value of kurtosis,
    the flatter the data distribution. There are different conventions in computing
    kurtosis. The Excel function KURT uses a formula for kurtosis given as follows:


    Kurtosis = \frac{n}{(n-1)(n-2)(n-3)} \sum\left(\frac{x_i - \bar{x}}{s}\right)^4
    - \left(\frac{3(n-1)^2}{(n-2)(n-3)}\right) (3.8)


    where n is the sample size, \bar{x} is the sample mean, and s is the sample standard
    deviation.


    The formula has been adjusted to make the kurtosis of normally distributed data
    equal to zero. The Pearson method of calculating kurtosis yields a value of 3
    for normal distribution. If we subtract 3 from the Pearson result, we will obtain
    excess kurtosis. Hence, the Excel KURT formula gives “excess kurtosis,” the value
    in excess of normal kurtosis. If this “excess kurtosis” value is positive, data
    are more peaked; if it is negative, data are broader.


    Kurtosis for bug repair time data has been calculated. It is +1.676; hence, data
    are peaked.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Coefficient of Dispersion


    The term coefficient is commonly used in algebra. The coefficient of a variable
    tells us the magnitude of the effect of the variable on the result. In metallurgy,
    the coefficient of expansion of metals can be used to calculate the expansion
    of metals. Here the coefficient is a metal property. The design of a coefficient
    of dispersion has a different purpose, although the connotations of the term are
    not entirely strange.


    # Coefficient of Range


    The simplest coefficient of dispersion is the coefficient of range (COR), calculated
    as follows:


    ```

    COR = (Max − Min) / (Max + Min)  (3.9)

    ```


    For the bug repair data, COR can be computed as follows:


    +   Max 58 days

    +   Min 6 days

    +   Max − Min 52 days

    +   Max + Min 64 days

    +   COR 0.8125 (dimensionless ratio)


    # Coefficient of Quartile Deviation


    COR is based on extreme values and hence is not robust. Coefficient of Quartile
    Deviation (CQDD) is based on quartiles and hence is not influenced by extreme
    values. The formula for CQD is given as follows:


    ```

    CQD = (Quartile₃ − Quartile₁) / (Quartile₃ + Quartile₁)  (3.10)

    ```


    For the bug repair time data, CQD is computed as follows:


    +   Q₃ 26.5 days

    +   Q₁ 13 days

    +   Q₃ − Q₁ 13.5 days

    +   Q₃ + Q₁ 39.5 days

    +   CQD 0.342 (dimensionless ratio)


    It may be seen that using quartiles gives a favorable value for the process of
    repairing bugs. CQD is much better than (smaller than) COR.'
  merge: -1
  img_proc: true
