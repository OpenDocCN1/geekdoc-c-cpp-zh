  md: '# Chapter 2


    # Truth and Central Tendency


    We have seen three statistical expressions for central tendency: mean, median,
    and mode. Mean is the arithmetic average of all observations. Each data point
    contributes to the mean. Median is the middle value of the data array when data
    are arranged in an order—either increasing order or decreasing order. It is the
    value of a middle position of the ordered array and does not enjoy contribution
    from all observations as the mean does. Mode is the most often repeated value.
    The three are equal for symmetrical distributions such as the normal distribution.
    In fact, equality of the three values can be used to test if the data are skewed
    or not. Skew is proportional to the difference between mean and mode.


    # Mean


    Use of mean as the central tendency of data is most common. The mean is the true
    value while making repeated measurements of an entity. The way to obtain truth
    is to repeat the observation several times and take the mean value. The influence
    of random errors in the observations cancel out, and the true value appears as
    the mean. The central tendency mean is used in normal distribution to represent
    data, even if it was an approximation. Mean is the basis for normal distribution;
    it is one of the two parameters of normal distribution (the other parameter is
    standard deviation). One would expect the mean value of project variance data
    such as effort variance, schedule variance, and size variance to reveal the true
    error in estimation.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Once the true error is found out, the estimation can be calibrated as a measurement
    process.


    It is customary to take a sample data and consider the mean of the sample as the
    true observation. It makes no statistical sense to judge based on a single observation.
    We need to think with “sample mean” and not with stray single points. “Sample
    mean” is more reliable than any individual observation. “Sample mean” dominates
    statistical analysis.


    # Uncertainty in Mean: Standard Error


    The term “sample mean” must be seen with more care; it simply refers to the mean
    of observed data. Say we collect data about effort variance from several releases
    in a development project. These data form a sample from which we can compute the
    mean effort variance in the project. Individual effort variance data are used
    to measure and control events; sample mean is used to measure and control central
    capability. Central tendency is used to judge process capability.


    Now the Software Engineering Process Group (SEPG) would be interested in estimating
    process capability from an organizational perspective. They can collect sample
    means from several projects and construct a grand mean. We can call the grand
    mean by another term, the population mean. Here population refers to the collective
    experience of all projects in the organization. The population mean represents
    the true capability of organization.


    If we go back to the usage of the term truth, we find there are several discoveries
    of truth; each project discovers effort variance using sample mean. The organization
    discovers truth from population mean.


    Now we can estimate the population mean (the central tendency of the organizational
    process) from the sample mean from one project (the central tendency of the local
    process). We cannot pinpoint the population mean, but we can fix a band of values
    where population mean may reside. There is an uncertainty associated with this
    estimation. It is customary to define this uncertainty by a statistic called standard
    error. Let us look further into this concept.


    It is known that the mean values gathered from different projects—the sample means—vary
    according to the normal distribution. The theorem that propounds this is known
    as the central limit theorem. The standard deviation of this normal distribution
    is known as the standard error.


    If we have just collected sample data from one project with n data points, and
    with a standard deviation s, then we can estimate standard error with reasonable
    accuracy using the relation'
