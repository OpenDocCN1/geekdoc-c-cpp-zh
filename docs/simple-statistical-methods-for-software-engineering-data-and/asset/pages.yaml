- pgno: 202
  md: '# BOX 12.3 SIMÉON DENIS POISSON (1781–1840)


    Siméon Denis Poisson was a French mathematician. His teachers Lap lace and Lagrange
    quickly saw his mathematical talents. They became friends for life with their
    extremely able young student, and they gave him strong support in a variety of
    ways.


    His paper on the theory of equations written in his third year was of such quality
    that Poisson could graduate without taking the final examination. He was employed
    as a tutor and appointed deputy professor 2 years later in 1802. In 1806, he become
    a full professor.


    One of Poisson’s contributions was the development of equations to analyze random
    events, later dubbed the Poisson distribution. It describes the probability that
    a random event will occur in a time or space interval under the conditions that
    the probability of the event occurring is very small but the number of trials
    is very large; hence, the event actually occurs a few times.


    The fame of this distribution is often attributed to the following story. Many
    soldiers in the Prussian Army died due to kicks from horses. To determine whether
    this was due to a random occurrence or the wrath of god, the Czar commissioned
    a Russian mathematician to determine the statistical significance of the events.
    It was found that the data fitted remarkably well to a Poisson distribution. There
    was an order in the data, and deaths were now statistically predictable.


    Poisson never tried experimental designs. He said,


    > Life is good for only two things, discovering mathematics and teaching mathematics.


    # Poisson Distribution


    The exponential law for discrete events can be expressed as follows:


    ```

    P(x,λ) = e^{-λ} λ^x / x! (12.5)

    ```


    where x takes discrete integer values 0, 1, 2, …, and λ is the mean value of x.


    The Poisson distribution can be solved in Excel using the statistical function
    POISSON.DIST. For given values of x and λ, the function returns Poisson probability.
    While entering data by making cumulative = 0, we get probability distribution
    function, and by making cumulative = 1, we get cumulative probability.'
  merge: -1
  img_proc: true
