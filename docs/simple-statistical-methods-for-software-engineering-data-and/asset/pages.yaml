- pgno: 164
  md: 'This histogram is skewed. There are few classes with large weighted methods
    per class. The larger the number of methods in a class, the greater the potential
    effect on children; children inherit all the methods defined in the parent class.
    Classes with many methods are likely to limit the possibility of reuse. They are
    also difficult to understand and test. Those few complex objects require review
    and a relook. A lot more metrics show skewed shapes; time to repair, defect density,
    and productivity are known for their skew.


    # BOX 10.1 HISTOGRAM IN CAMERAS


    Histogram is a digital signature of reality. It is used in modern digital cameras
    to present a pictorial view of light intensity in the field of view. The light
    profile of objects seen through the lens is scanned, digitized, and converted
    into a histogram. The photographer can derive clues from this histogram to the
    settings required to get a good picture.


    Understanding image histograms is probably the single most important concept to
    become familiar with when working with pictures from a digital camera. A histogram
    can tell you whether or not your image has been properly exposed, whether the
    lighting is harsh or flat, and what adjustments will work best. It will not only
    improve your skills on the computer, but as a photographer as well. (http://www.cambridgeincolour.com/tutorials/histograms1.htm)


    Before the histogram, photography enthusiasts had to go through a lot more effort
    to get good exposures.


    Image editors typically have provisions to create a histogram of the image being
    edited. The histogram plots the number of pixels in the image (vertical axis)
    with a particular brightness value (horizontal axis). Algorithms in the digital
    editor allow the user to visually adjust the brightness value of each pixel and
    to dynamically display the results as adjustments are made. Improvements in picture
    brightness and contrast can thus be obtained. (http://en.wikipedia.org/wiki/Image_editing)'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# Choosing the Number of Intervals\n\n# Square Root Formula\n\nThe elements\
    \ of a histogram, namely, the peak, the body, and the outliers, can change if\
    \ we change the number of interval N. Normally, we choose the number of intervals\
    \ to be the square root of the number of data points in the sample n.\n\n$$N =\
    \ n^{0.5} \\tag{10.1}$$\n\nThis square root formula is taken as a default value\
    \ in histogram analysis.\n\n# Alternate Approaches\n\nThere are three other conventions\
    \ as well in selecting the number of intervals.\n\n+   1. The Sturges rule,\n\
    +   \n+   $$N = \\log_2 n + 1 \\tag{10.2}$$\n\n+   2. The Freedman–Diaconis rule,\n\
    +   \n+   $$N = \\frac{\\text{Range}}{2 IQR \\sqrt[n-1/3]{}} \\tag{10.3}$$\n\n\
    +   3. The Scott rule, which suggests fewer intervals,\n+   \n+   $$N = \\frac{\\\
    text{Range}}{3.5 \\sigma \\sqrt[3]{n}} \\tag{10.4}$$\n\n# Exploratory Iterations\n\
    \nWe can see how the histogram varies when the number of bin intervals—and as\
    \ a direct consequence the bin sizes—vary according to the four rules previously\
    \ mentioned. Our trials need not be limited to these four rules. We can try our\
    \ own choice of bin size and extract patterns to suit our inquiry. Bin size reduction\
    \ increases the resolution of histogram graph. For example, in the first iteration,\
    \ with just nine bins, effort variance data yield a histogram shown in Figure\
    \ 10.3. The histogram shows stability and a single peak. We can explore further\
    \ by improving the resolution of the histogram and choose 20 bins; we get a histogram\
    \ shown in Figure 10.4.\n\nThis histogram has three modes, or three clusters.\
    \ This is merely an estimate. Extracting different histogram estimates with the\
    \ same data set is known as non-parametric density function estimation."
  merge: -1
