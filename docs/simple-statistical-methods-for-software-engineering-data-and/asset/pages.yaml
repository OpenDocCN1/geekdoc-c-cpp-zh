- pgno: 349
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_349_0.png)


    # Figure 21.6 Ohishi’s version of Gompertz reliability growth model.


    The model predicts current reliability as 0.975 and suggests the presence of five
    residual defects. The model indicates that another 4 weeks of testing is required
    to reach a reliability level of 99%.


    # How to Implement Gompertz Model in Software Testing


    To begin with, one must acknowledge cautions suggested by Faqih in implementing
    any SRGM. The concerns of Stringfellow and Andrews are also valid. These ideas
    have been already cited in this chapter in the Building a Reliability Growth Curve
    section.


    Further care and preparations are required for implementing Gompertz SRGM in real
    life.


    Gompertz is an organic model, a characteristic well seen in the way it fits the
    growth of sharks. Gompertz, the discoverer of the model, uses the organic force
    of life to drive the equation to predict mortality. Testing must be performed
    in an organic manner. That means that testing must be a well-coordinated and homogeneous
    process. There must be a visibly great understanding between testers and developers.
    The arrival of components for tests must follow a systematic pattern without ad
    hoc breaks. Testing must be performed with great sincerity. Defects must be logged
    promptly without delay.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '*Often there is an uncertainty in the exact time of defect discovery. The logged
    time could differ from the discovered time. The authenticity of time stamp is
    questionable. This uncertainty will distort data and introduce unnatural ripples
    into data.*


    To make the model more effective, test cases must be developed early, as soon
    as requirements are clear. All possible usage scenarios should be identified and
    considered during requirements collection. Requirement coverage and code coverage
    must be high enough.


    *To get better Gompertz fit, the test processes must be streamlined. Better Gompertz
    fit is not merely the result of statistical manipulation but presupposes testing
    process improvement.*


    Swaminathan [12] observed that proper test management and cooperation among teams
    are critical to the success of the Gompertz model. Some customers insist on Gompertzian
    testing; they expect establishment of the Gompertz model as part of the testing
    process and use it for prediction in an appropriate manner. Swaminathan noted,


    Customers are expecting software vendors to give an assurance on the quality of
    the delivered product. They insist that this assurance be backed up by a valid
    statistical model and mere verbal assurances would not do.


    How do we give this assurance to the customer?


    It is not just for the customers. Even for the software vendors, who have to make
    decisions on the size of the team for the support phase, they need to know by
    when the software would reach a certain maturity and thereby when they could reduce/stop
    testing.


    How can software vendors know when their product will reach a 90% maturity or
    99% maturity?


    This has become an important aspect to address for both the customers and the
    vendors.


    On his experience with building a live Gompertz model and running it, Swaminathan
    indicated,


    We started building a tool based on excel.4. The input to the tool was the number
    of defects found every week and the output was the predicted defects for the future
    weeks and the maximum number of defects that were likely to be found.


    Making the excel tool as per the details given was relatively simple. But the
    bigger challenge was to make it work for a particular team context.


    As the test data started flowing from the team, we started using the data to predict
    the maximum number of defects for the product under test.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'The tools predictions turned out to be different from the intuitive predictions
    of the software team. When we tried to understand the reason, we found that the
    testing was done quite randomly.


    Table 21.1 gives an example. Defects found during six weeks of testing are tabulated.
    Test cases executed have been included in the table to set the context and environment.
    Figure 21.7 contains the cumulative plot of defects. Apparently, the curve is
    not Gompertzian. There is a hike in the number of test cases executed that corresponds
    to the hike in the defects discovered.


    In the tool, we were looking at only the week number and number of defects. We
    had ignored very crucial data in number of test cases executed. So, instead of
    looking at the absolute number of defects, we started looking at the defects in
    the context of the test cases executed every week. Even after this change, the
    predictions did not match with


    **Table 21.1 Test Results**


    | Week No. | No. of Test Cases Executed | No. of Defects Found | Cumulative Defects
    Found |

    |----------|----------------------------|----------------------|--------------------------|

    | 1        | 100                        | 10                   | 10                       |

    | 2        | 10                         | 0                    | 10                       |

    | 3        | 50                         | 3                    | 13                       |

    | 4        | 75                         | 0                    | 13                       |

    | 5        | 30                         | 2                    | 15                       |

    | 6        | 100                        | 5                    | 20                       |


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_351_0.png)'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'what the Project Manager expected. When we investigated the reason, it turned
    out that the software was not completely developed.


    We learned that the Gompertz model can only be used in the test–analyze–fix cycle
    and not when full-fledged software development is in progress. We also learned
    that the model should not be used for prediction at the early stages of the test–analyze–fix
    cycle. The product under test has to reach a certain maturity before we start
    using the data for predicting.


    As a Gompertzian rule of thumb, until inflection is visible, the model should
    not be used for prediction. It takes time and sufficient data to reach the inflection
    point. The model is to be kept dormant until such a time.


    # Gompertz Curve versus GO NHPP Model


    The two-parameter GO model is discussed in Chapter 12. This original model has
    been criticized because it is concave and lacks the flexibility of the S curve.
    A third parameter c was added by Goel to this model to make it reflect real-life
    testing. The model is known as the generalized GO model, (NHPP: non homogeneous
    poisson process) as shown in Figure 21.8.


    This model can be compared with the Gompertz curve for ready reference, also shown
    in Figure 21.8. The two curves shown are representative samples from the generalized
    GO family and the Gompertz family.


    Both are S curves; the similarity is interesting coming from two different domains,
    one from computer science and the other from actuarial studies. Both the models,
    generalized GO and Gompertz curve, are capable controlled inflection. However,
    the Gompertz curve is a wee bit more practical and flexible.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_352_0.png)


    Figure 21.8 Gompertz curve versus GO NHPP model.'
