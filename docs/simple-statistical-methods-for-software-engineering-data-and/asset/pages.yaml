  md: '# Putnam’s Rayleigh Curve for Software Reliability


    Remembering that the Rayleigh curve is similar to the Weibull Type II distribution,
    let us look at Lawrence Putnam’s Rayleigh curve, as it was called, for software
    reliability:


    ```

    E_m = 6 \frac{E_x}{t_d^2} t e^{-3 \frac{t^2}{t_d^2}}  (19.8)


    MTTD = \frac{1}{E_m} after milestone 4

    ```


    where E_x is the total number of errors expected over the life of the project;
    E_m is the errors per month; t is the instantaneous elapsed time throughout the
    life cycle; t_d is the elapsed time at milestone 7 (the 95% reliability level),
    which corresponds to the development time; and MTTD is the mean time to defect.


    To apply this curve software, the life cycle must be divided into nine milestones
    as prescribed by Putnam and define the parameters by relating them to the relevant
    milestones [11,12]. There are many assumptions behind this equation. This model
    works better with large full life cycle projects that follow the waterfall life
    cycle model. Putnam claimed,


    > With this Rayleigh equation, a developer can project the defect rate expected
    over the period of a project.


    # Cost Model


    Putnam used the same Rayleigh curve to model manpower build up and cost during
    the software development project. The equation was used in his estimation model.
    The same equation was used to define productivity. Putnam’s mentor Peter Norden
    had originally proposed the curve in 1963. Putnam realized its power and applied
    it well. The equation came to be known popularly as the software equation. Technically,
    it is known as the Norden–Rayleigh curve.


    Putnam recalls [11],


    > I happened to stumble across a small paperback book in the Pentagon bookstore.
    It had a chapter on managing R&D projects by Peter Norden of IBM. Peter showed
    a series of'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'curves which I will later identify as Rayleigh curves. These curves traced
    out the time history of the application of people to a particular project. It
    showed the build up, the peaking and the tail off of the staffing levels required
    to get a research and development project through that process and into production.
    Norden pointed out that some of these projects were for software projects, some
    were hardware related, and some were composites of both. The thing that was striking
    about the function was that it had just two parameters. One parameter was the
    area under the curve which was proportional to the effort (and cost) applied,
    and the other one was the time parameter which related to the schedule.


    # Defect Detection by Reviews


    Defect detection by reviews can be modeled by using the Weibull curve. Typically,
    we begin with a shape factor of 2, the equivalent of the Rayleigh curve.


    Figure 19.9 shows a typical Weibull model for review defects. The cumulative curve
    ends at 0.86, before becoming flat. This roughly indicates that 14% of defects
    are yet to be uncovered, but the review process has been stopped beforehand. The
    PDF is clearly truncated.


    At a more granular level, the review defect Weibull model can be applied to requirement
    review, design review, code review, and so on. It is cheaper to catch defects
    by review than by testing, and using such models would motivate reviewers to spend
    extra effort to uncover more defects.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_321_0.png)


    **Figure 19.9** Weibull curve of family 2 showing premature closure of review.'
