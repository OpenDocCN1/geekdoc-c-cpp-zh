  md: '# Chapter 6


    # Achieving Excellence in Software Development Using Metrics


    We have seen metric development to suit the context, address needs and fulfill
    performance goals in Chapter 5. Now we shall discuss how to apply metrics to manage
    the software development cycle and achieve excellent results.


    Let us look at a few representative metrics shown in the following paragraphs
    for developing the approach. For a comprehensive study of metrics, see Fenton
    [1], Grady [2], Stephan Kan [3], Pandian [4], and Putnam [5].


    # Examples of Project Metrics


    # Time to Deliver


    > The first 90 percent of the code accounts for the first 90 percent of the development
    time ... The remaining 10 percent of the code accounts for the other 90 percent
    of the development time.


    Tom Cargill'
