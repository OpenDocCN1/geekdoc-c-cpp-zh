- pgno: 305
  md: 'Working with a PDF such as gamma has further advantages. First, gaps in data
    are filled by the equation. Second, one can extrapolate mathematically and see
    beyond boundaries. Third, strategic planners can estimate risk.


    There are several options available while choosing a PDF for rainfall data. Statistical
    techniques include the compound Poisson–exponential distribution; the log, square
    root, and cube root normal distributions; the gamma distribution; various normalizing
    transforms; the kappa distribution, the Weibull distribution, and the Box–Cox
    transformation.


    However, the gamma distribution is frequently used to represent precipitation
    because it provides a flexible representation of a variety of distribution shapes
    while using only two parameters: shape and scale (based on Husak [4]).


    # NIST Formula for Gamma Parameter Extraction


    Instead of the approach we used in plotting Figure 18.4 where we had used visual
    judgment of histogram of data to decide on shape and the method of moment formula
    given in Equation 18.2, to calculate scale, we can use the more rigorous NIST
    [5] formulas presented in Equations 18.5 and 18.6 for parameter extraction:


    Shape α = (x̄ / s)²

    (18.5)


    Scale β = s² / x̄

    (18.6)


    where x̄ is the mean and s is the standard deviation.


    # Applying Gamma Distribution to Software Reliability Growth Modeling


    Gamma distribution has been used in reliability studies. The gamma cumulative
    distribution function (CDF) is an S curve and can represent cumulative defects
    discovered in software. An example of CDF, although on a different metric, may
    be found in Figure 18.5. A CDF plotted with cumulative defects is known as the
    software reliability growth curve, a subject treated in detail in Chapter 19 where
    the Weibull distribution is used and in Chapter 21 where the Gompertz distribution
    is used.


    Although the Weibull distribution is popularly used to fit failure data, the gamma
    distribution is more suited in certain cases. In a research study, Sonia Meskini
    [6] applies gamma distribution to construct a software reliability growth model
    for smart phones. Sonia observes,'
