  md: '3. Reuse density (RD): It measures how much reuse is in a product with respect
    to the size of the product. It is the ratio of total number of lower level items
    reused inside a higher level item normalized to the size of the higher level item.


    The question is if the three metrics are redundant. To solve the problem, the
    authors have used histograms of correlations. The analysis shows interesting findings
    with statistical confidence made available by histograms. Instead of using an
    average level of correlation, the authors have preferred histogram expressions
    of correlations. They conclude,


    > It is evident that from a statistical point of view in the considered C projects,
    RL and RF measure very similar properties of the code, while RD presents an independent
    perspective on the amount-of-reuse.


    Just two metrics are enough to manage reuse.


