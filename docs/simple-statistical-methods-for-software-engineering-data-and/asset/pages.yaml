  md: 'Table 13.6 has two parts. In part A, the tail areas have been computed the
    usual way. This suggests a defect level of 1.97 parts per billion for a process
    to qualify as a Six Sigma process. This requirement was contested internally in
    Motorola by pragmatic managers who wanted an allowance for long-term drifts in
    processes. In particular, they wanted the “Shewhart allowance of 1.5 sigma drift
    in control charts” to be made available in Six Sigma considerations. Part B of
    Table 13.6 has been computed with Shewhart allowance; this table suggests 3.4
    PPM defects for a Six Sigma process, approximately 1726 times more defects than
    the pure scale. Finally, the practical scale has prevailed and is widely used
    as a quality standard.


    In Six Sigma culture, we respond to mathematically derived tail probabilities
    even if there is no physical event in the tail region.


    # Statistical Tests


    Gaussian properties are extensively used in statistical tests to compare results.
    If two processes are represented by adjacently located Gaussian curves and if
    the tails do not overlap, they are distinctly different processes. If tails overlap,
    perhaps they are not so different. To resolve this problem, we resort to statistical
    tests, such as z test, t test, and F test. In all tests, we find a p value, the
    probability of finding one sample from the other lot. To calculate p value, in
    commonly used statistical tests, the Gaussian curve is used.


    We have seen how the bell curve can be put to a variety of applications in software
    engineering and management.


    # BOX 13.5 ELECTRON CHARGE TO MASS RATIO MEASUREMENT


    Nobel laureate J. J. Thomson measured the invisibly small particle electron in
    1897 at the well-known Cavendish laboratory in Cambridge, England.


    By carefully measuring how the cathode rays were deflected by electric and magnetic
    fields, Thomson was able to determine the ratio between the electric charge (e)
    and the mass (m) of the rays. Thomson’s result was


    ```

    e/m = 1.8 × 10⁻¹¹ coulombs/kg

    ```


    He received the Nobel Prize in 1906 for the discovery of the electron, the first
    elementary particle.


    Nobelprize.org'
  merge: -1
  img_proc: true
