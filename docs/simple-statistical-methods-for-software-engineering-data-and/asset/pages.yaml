- pgno: 276
  md: '# TAILED

    DISTRIBUTIONS


    Tailed distributions occupy a special position in pattern recognition. They are
    used to describe extreme events. The representation of such less likely events
    is not often the primary interest of project managers and engineers. Attention
    to central tendencies and overall generic expressions of dispersion have dominated
    managerial thinking. The prediction of tails is a specialist domain, not a generalist''s
    credo. In recent years, interest in tails has increased. Software buyers would
    like to estimate residual defects. Business managers would like to estimate scope
    creep. Engineering managers would like to predict size growth. Hence, models of
    software evolution were created.


    The following five chapters are devoted to the use of a few tailed distributions:
    log-normal, gamma, Weibull, Gumbel, and Gompertz. Each distribution has unique
    characteristics that entail unique applications. Together, these five distributions
    can handle most extreme events in software engineering. A remarkable application
    of such distributions is in the construction of software reliability growth models,
    described in Chapters 19 and 21.


    Despite the mathematical form, which might dissuade a casual reader, these distributions
    are simple to use; they are widely used in the industry. Computations needed for
    solving these expressions are minimal and can be accomplished using MS Excel.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Chapter 17


    # Software Size Growth:

    Log-Normal Distribution


    # Log-Normal Processes


    Software grows in the development cycle. Software metrics, namely, size, effort,
    defects, and reliability, all manifest growth of software.


    Growth is a multiplicative process. This sharply contrasts with the additive process
    of gambling.


    Growth of sites on the Web, growth of organisms in biology and ecology or growth
    of fatigue cracks in semiconductors, growth of Web pages in the Internet, growth
    of pollutants in the atmosphere, growth of cancer in people, growth of corrosion
    in metals, growth of phone traffic in a communication network, and growth of words
    are examples of multiplicative processes.


    Growth is inadequately represented in the bell curve. A different curve, namely,
    the log-normal distribution, first used in 1836 (see Box 17.1), is seen to represent
    adequately well such growth events. The log-normal distribution is built on a
    simple premise that logarithms of skewed data will be normally distributed without
    skew; taking logarithms removes skew. The logarithmic scale is often used to present
    complex nonlinear data in a simplified linear form (see Box 17.2). Logarithmic
    transformation of observations allows us to apply the familiar properties of the
    bell curve to the transformed data.


    Consider software design complexity, which is relatively skewed when compared
    with the bell curve. We analyzed the NASA data [1] on module design complexities
    of 505 modules written in C language.'
  merge: -1
