  md: 'Tamar et al. [6] consider EVM in Scrum and find that “the implementation of
    the Agile EVM process has no noticeable impact on a Scrum team’s velocity. Also,
    the value of the data was confirmed by the team who had access to the metrics,
    as well as the Scrum Master and management stakeholders for the project. Thus,
    we are encouraged that the Agile EVM metrics do indeed add value to Scrum projects.”


    In a study of EVM in waterfall and agile projects, Sam Ghosh [7] concludes that
    “the concept of EVM is applicable in agile software project.”


    # BOX 9.4 RANK THE MESSAGE


    Sometimes the message is not in absolute values but in the relative order. To
    transform nonnormal data into normal data, we consider ranks, for example. When
    there is deterioration in data, ranks still hold true. A dentist gives times to
    five of his clients: 10, 10:30, 11, 11:30, and 12:00. Patients come and wait,
    but the doctor arrives 30 minutes late. The first patient complains she has lost
    30 minutes. The desk operator is cool and says, “You are the first patient the
    doctor will see. You are first in the queue. Ignore the actual time promised to
    you. But we will maintain the order.” The patient reflects upon this response.
    The dental clinic is committed not to the time schedules but to the order. That
    is how the clinic sees it. Their message seems to be in the order, or the rank.
    The exact values of numbers are lost; the ranks are remembered and retained. It
    requires a greater disciple to remember exact values.


    # Review Questions


