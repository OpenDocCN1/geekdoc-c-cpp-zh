- pgno: 293
  md: '# BOX 17.3 ANALOGY—ACCELERATED LIFE TEST


    If we record time served by computer hardware before the first failure occurs,
    what we obtain is life data, and the distribution is called life distribution.
    Life data manifest log-normal distribution, both for machines and for humans.
    Log-normal distribution for machine failure is used to measure and improve reliability.
    Log-normal distribution for human life is used to calculate life insurance premiums.
    In both the cases, we estimate or “measure” life properties using log-normal distribution.


    In accelerated life tests of systems, extreme conditions are created, mimicking
    real-world scenarios, to stimulate failure events much earlier than normal. Moreover,
    the tests are stopped either after a certain time or after a certain number of
    failures occur. Tests are neither conducted indefinitely nor till all failures
    occur. Life data thus obtained are truncated or “censored.” The picture obtained
    is partial, but the full picture can be constructed by statistical analysis. One
    such attempt is to fit log-normal distribution to censored life data and see even
    the unseen part of the full story of failure probabilities. Accelerated life tests
    are faster and cheaper.


    Dube et al. [8] discussed the problem of applying log-normal distribution to censored
    life data, particularly parameter extraction. They analyze car failure data from
    Lawless [9] for this purpose. The Lawless data “shows the number of thousand miles
    at which different locomotive controls failed in a life test involving 96 controls.
    The test was terminated after 135,000 miles, by which time 37 failures had occurred.”


    Dube et al. took up and answered the question whether the data fit the log-normal
    distribution or not. They showed that “the data fits reasonably well.” Analogically,
    software is stressed by usage testing (e.g., user acceptance testing), triggering
    failure events. A record of failure times is called life data. Tests are not indefinitely
    conducted but terminated at some point of time, either after a certain number
    of defects have been found or after the lapse of certain time, depending on estimation
    and strategy of testing. Life data thus obtained can be fitted to log-normal.


    # Review Questions


    +   1. Compare normal distribution with log-normal distribution.

    +   2. Provide an example of the logarithmic scale used in practice.

    +   3. What is the formula for the mean of log-normal distribution with shape
    σ and scale β?

    +   4. What is the formula for the variance of log-normal distribution with shape
    σ and scale β?

    +   5. Who invented the log-normal distribution?'
  merge: -1
  img_proc: true
