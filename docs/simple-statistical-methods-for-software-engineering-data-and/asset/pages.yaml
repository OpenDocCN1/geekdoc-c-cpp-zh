    Monroe [9]. He argues, “Goal setting by entitlement does not quantify opportunity
    for breakthrough improvement.”


    # BOX 10.5 A STUDY OF REUSE


    The benefits of software reuse range from decreased development time and increased
    product quality to improved reliability and decreased maintenance costs. The amount
    of reuse is measured by several metrics. Curry et al. [10] focused on three metrics:


    +   1. Reuse level (RL): It measures the ratio between different lower level items
    reused verbatim inside a higher level item versus the total number of lower level
    items used.

    +   2. Reuse frequency (RF): It measures the number of references to reused items
    rather than counting items only once, as was performed for the reuse level. This
    metric measures the percentage of references to lower level items reused verbatim
    inside higher level items versus the total number of reference.'
