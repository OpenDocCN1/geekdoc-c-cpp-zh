  md: '# 3. Geometric distribution


    The probability k of Bernoulli trials needed to obtain one success is given by
    the following expression:


    ```

    P(X = k) = (1 - p)^{k-1} p    (11.7)

    ```


    where p is the probability of success (same for each trial) and k is the number
    of successes observed in n trials.


    ```

    Mean = 1/p    (11.8)

    ```


    ```

    Variance = (1 - p)/p²    (11.9)

    ```


    # Example 11.3: Geometric Distribution


    # QUESTION


    The right first-time design probability in a software development project is estimated
    at 0.7. Estimate the probability of needing four trials to find a defect-free
    feature design. Plot a graph between trials and geometric probability.


    # ANSWER


    In this problem, p = 0.7 and k = 4.


    Inserting these values in Equation 11.3, we obtain the geometric probability (0.0189).


    Figure 11.3 shows the graph.


    # 4. Hypergeometric distribution


    The hypergeometric distribution is a discrete probability distribution that describes
    the probability of k successes in n draws without replacement from a finite population
    of size N containing exactly K successes. This is given by the following equations:


    ```

    P(X = r) = [C_r^K C_{n-r}^{N-K}] / C_n^N    (11.10)

    ```


    ```

    Mean = n K / N    (11.11)

    ```


    ```

    Variance = n ((N - K)/N) ((N - n)/(N - 1))    (11.12)

    ```'
