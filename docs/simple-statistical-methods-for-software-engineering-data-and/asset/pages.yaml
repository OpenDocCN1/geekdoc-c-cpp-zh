  md: '+   - See process drift

    +   - Compare processes

    +   - Plan process improvement


    # Twin Box Plot


    Let us take the case of reestimating software development effort. Teams are reluctant
    to do a second estimate and are in a hurry to move forward with development. However,
    it is a best practice to do a second estimate after a fortnight into the project
    when many project details become visible. We get to know the requirements better,
    teams communicate better, risks are seen with clarity, and we are enlightened
    by the early lessons. The second estimate is expected to be more accurate. We
    wish to compare the second estimates with first estimates and study the improvement.


    The box plot can be eminently used to compare the two results. In Figure 4.4,
    a twin box plot is shown comparing two sets of effort variance data.


    The twin box plot offers what might be called a visual test, a preliminary analysis
    before we start rigorous tests. Visual judgment of the following can provide vital
    clues regarding the differences between two results:


    +   1. Is there a difference between the whisker-to-whisker widths?

    +   2. Is there a difference between the box widths?

    +   3. Is there a relative shift in the position of the median?


    If the answer is yes to any one of these questions, we need to take a deeper look
    at the box plots. Sometimes the presence or absence of outliers could make a difference.
    Sometimes the skew of the median line inside a box could provide a clue.


    If the difference is significant, the boxes in the two plots may be completely
    disjointed. They may not overlap. Using the box plot representation, it is rather
    easy to see if the new result is different from the old.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_82_0.png)


    Figure 4.4 Comparison of two estimates using box plots.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'If results due to innovation show improvement, one or more of the following
    visual clues may be present:


    +   - The overall length of the box plot would have decreased

    +   - Outliers might have disappeared

    +   - The central line might show a favorable shift

    +   - The box might have shrunk

    +   - The box might be relocated in a favorable region

    +   - The unfavorable whisker might have diminished


    If an improvement is not visible in a box plot, it may not be an improvement in
    the first place. The question of looking for significance does not arise.


    > However, in most cases, people take pains to go through lengthy procedures to
    execute significant tests to check differences, without box plot visual checks.
    In some cases even after box plot rejections, people go through the ritual of
    significance tests.


    # Holistic Test


    The twin box plot test is a holistic approach; it can compare two populations
    (two groups) in a complete balanced fashion that no other test can offer. The
    price we pay for completeness is loss of rigor. It so happens that rigorous tests
    have narrower scope than robust tests; approximate analysis can sweep more terrain
    than precise analysis. We need such a holistic test before we go into more sophisticated
    tests.


    The twin box plot shown in Figure 4.4 offers a holistic comparison described in
    the following paragraphs.


    First, it compares the median values. The median of the first estimate is 4.67%,
    and the median of the second estimate is 1.27%. Comparing medians is more robust
    than comparing means, which makes sense even with nonnormal data. This is a comment
    on central tendency.


    Then dispersion is compared at two levels; the first IQR is 23.45 and the second
    and improved value is 8.54. It is evident that the core of the estimation process
    covering 50% of results shows less dispersion—an order of magnitude less. The
    new dispersion is one-third the old. The old whisker-to-whisker range is 86.48,
    whereas the new whisker-to-whisker range is 20.32, four times less. It is evident
    that the dispersion is reduced in the new estimation technique; it is more reliable.
    The box plot provides an order of magnitude test before we resort to p values
    for judgment.


    The box plot identifies outliers in the second group; not every estimate has been
    well performed. The best practice must spread. The second process has philosophical
    problems called statistical outliers. However, in a practical sense, even the
    outliers are better than the first process.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Application Summary: Twin Box Plot


    The twin box plot is a qualitative test and should be performed before any hypothesis
    test.


    The only way to compare overall performance of data sets is the twin box plot.


    We can compare the following aspects of process using twin box plots:


    +   - Quartile-to-quartile distance (IQR)

    +   - Whisker-to-whisker distance

    +   - Median (central tendency)

    +   - Outliers

    +   - Skew


    Each comparison can provide a unique clue about difference in processes.


    We can use a rule of thumb: if boxes overlap, there is no significant shift in
    central value.


    After seeing the twin box plot, we can decide which confirmatory test must be
    performed.


    +   - If there is shift in central value, confirm it with a t test.

    +   - If dispersion is different, confirm it with an F test.

    +   - If outliers are present, cross check them with a control chart.


    We can take preliminary decisions with the box plot, followed by confirmatory
    tests to make the final decision.


    When data are nonnormal, twin box plots provide more reliable clues than conventional
    tests.


    # BOX 4.2 EVALUATING IMPROVEMENT


    The need to evaluate that improvement occurs more often than we think in software
    projects. In the very first place, we collect data because we wish to improve
    performance. We are thus made to check if performance has really improved after
    data collection and reporting. To do this, we need two sets of performance data,
    before and after improvement. Then we just have to prepare a twin box plot and
    compare the results, as described in this chapter. There are other circumstances
    when we consciously improve performance through six sigma and lean; once again,
    we can use box plots to compare results before and after improvement. Sometimes
    we may do special experiments and invariably use the box plot to portray data
    using box plots as evidence for improvement. Box plots are widely used as graphical
    companion to experiments. High maturity in software engineering involves continual
    improvement, and the box plot is a very valuable tool.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Case Study 1: Business Perspectives from CSAT Box Plots


    This case study is about managing CSAT across a large organization with four strategic
    business units (SBUs). The annual average CSAT index of the organization has been
    computed as 3.217, which is far below the target of 4 in a Likert scale of 1–5.
    The CSAT data are obtained by a survey of the overall satisfaction of customers.
    The calculation of the average of ordinal data is a subject of ongoing debate.
    Strictly speaking, average is meaningless in ordinal data, but average is taken
    as an effective indicator. It is easier to estimate and report. If we use box
    plots instead of mean, we tend to see more details of CSAT. If we plot separate
    box plots for different SBUs, we get more information and an easy intercomparison,
    as shown in Figure 4.5.


    # CSAT Analysis across SBUs


    In one glance, we are able to take in several details of CSAT. The linear structure
    of box plot accommodates several box plots in one chart. In Figure 4.5, there
    are lower whiskers; the lower whiskers touch the floor level, particularly in
    SBU 1 and SBU 3. These lower whiskers are the real problems; customers tend to
    remember negative results longer. If Kano’s model of CSAT can be used, the lower
    whiskers fall in the zone of asymptotically crashing dissatisfaction.


    > The key message of CSAT Box Plots is not in the central values but in the lower
    whiskers.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_85_0.png)


    **Figure 4.5** Customer satisfaction analysis across SBUs using box plots.'
