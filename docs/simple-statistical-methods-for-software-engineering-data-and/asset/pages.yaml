- pgno: 94
  md: "Software Engineering Institute (SEI) introduced the GQ(I)M paradigm [2] as\
    \ a value adding refinement to the GQM paradigm. GQ(I)M uses Peter Singe’s mental\
    \ models to drive metric choice and indicators to convey meaning. GQ(I)M certainly\
    \ has helped to widen the reach of GQM.\n\n> **BOX 5.1  FLYING A PLANE AND GQM**\n\
    > \n> Even the simplest propeller airplane would have meters to measure altitude\
    \ and fuel. These measurements are intrinsic to the airplane design. The meters\
    \ are fitted by the manufacturer and come with the airplane as basic parts of\
    \ the airplane. One cannot fly without altitude, speed, and fuel level metrics.\
    \ Flying a plane without altimeter is unthinkable. A plane without a speedometer\
    \ is unrealistic. A pilot cannot make decisions without a fuel indicator. These\
    \ metrics are not “goal driven” and certainly not business strategy driven but\
    \ are driven by design requirements. One can think of purposes for each metric,\
    \ but these purposes are not derived from business strategies and business goals;\
    \ these purposes are implicitly inherent in product engineering. Whether there\
    \ are goals or not, these meters will be fitted to the plane, almost spontaneously,\
    \ like a reflex action triggered by survival needs. There are no options here.\
    \ These metrics are indispensable and obvious. One does not need a GQM approach\
    \ to figure them out.\n> \n> Hence, cost, schedule, and quality metrics are also\
    \ indispensable in a software development project. These are not “goal driven”\
    \ but are based on operational needs. One does not have a choice.\n\n# Difficulties\
    \ with Applying GQM to\nDesigning a Metrics System\n\nFirst, the intermediate\
    \ stage (question) in the GQM paradigm is not very helpful. We simply map metrics\
    \ to goal. The mapping phase in COSMIC size measurement is a great illustration.\n\
    \nSecond, while applying GQM, people tend to start with corporate goals and attempt\
    \ to drill down to metrics. This often turns out to be a futile attempt. Large\
    \ organizations have spent days with GQM, getting lost in defining goals, subgoals,\
    \ and sub-subgoals. All these goals go into goal translation and could never make\
    \ it to metric definitions in a single workshop. Rather, we would first derive\
    \ performance goals from business goals using a goal tree. This is a goal deployment,\
    \ a leadership game. Designers of metrics should discriminate metrics mapping\
    \ from goal deployment. Designers of metrics should pick up selected performance\
    \ goals and map them to metrics.\n\nThird, some metrics are specified by clients.\
    \ Customer-specified metrics seem to run very well in organizations. Data collection\
    \ is smooth. There is no need for a separate mechanism to identify and define\
    \ these metrics."
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Fourth, some metrics are driven by requirements. If requirements include that
    the software must be developed for maintainability, there is a natural metrics
    associated with this requirement, that is, the maintainability index. Meeting
    both functional and nonfunctional requirements might need metrics support. Thus,
    the recognized performance targets easily and organically map into performance
    metrics. One need not apply GQM and make heavy weather.


    Fifth, metrics are often constructed to serve information needs in the organization.
    Hence, management information systems (MIS) automatically capture many metrics.
    These metrics are an inherent part of MIS. Metric teams have to extract metric
    data from the MIS or ERP systems. These metrics do not follow the GQM road.


    Sixth, some metrics are derived from operational needs, for example, schedule
    variance. Such needs are compelling, and one does not have a chance to exercise
    options. When the needs are clearly and decisively known, we need not rediscover
    them by GQM.


    Seventh, even in the Six Sigma way of problem solving, where the Y and X variables
    are defined to characterize the cause-and-effect relationships that constitute
    the problem, metrics are derived by mapping through a cause–effect diagram. The
    selection of the problem to be solved is a goal-driven process, but deriving the
    variables (metrics) is conducted through causal mapping, not GQM.


    # Need-Driven Metrics


    It is our finding that successful metrics are driven by transparent needs. The
    link between metrics and needs must be organic, spontaneous, and natural. The
    bottom line:


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_95_0.png)


    > If we can do without metrics, we will do without metrics. We use metrics only
    when they are needed.


    The system of assigned goals, personal goals, and all the subgoals finally boil
    down to performance goals that reflect the pressing needs of the system. Once
    a metric connect with needs, it works.


    The connection between needs and metrics must be concrete, spontaneous, transparent,
    and direct. Hence, mapping is the preferred connecting mechanism. Using “questions”
    is too verbose to be of practical value.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_95_1.png)


    > Mapping is a better connector than question.


    A more serious concern would be to obtain commitment from agents to support metrics.
    A need-based system enables commitment harder than inquiries and questions.'
  merge: -1
  img_proc: true
