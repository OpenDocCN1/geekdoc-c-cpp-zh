- pgno: 122
  md: "# Chapter 7\n\n# Maintenance Metrics\n\n# Fusion of Frameworks in Software\
    \ Maintenance\n\nSoftware maintenance assimilates three management styles: project\
    \ management, operations management, and service management. Maintenance metrics\
    \ design mirrors this fusion. The big maintenance work gains from project management\
    \ framework, the small tasks gain from operations management, and all maintenance\
    \ tasks, by necessity, subscribe to service management framework. The project\
    \ approach harmonizes all.\n\n> Operations keeps the lights on, strategy provides\
    \ a light at the end of the tunnel, but project management is the train engine\
    \ that moves the organization forward.\n> \n> Joy Gumz\n\nMaintenance engineering\
    \ is based on multiple principles. On the one side, we have enhancement tasks\
    \ (adaptive maintenance), which are mini projects to change the functionality\
    \ of software [1]. Knowledge areas from Project Management Body of Knowledge (PMBOK)\
    \ are often used as founding principles. On the other side, we have quick jobs\
    \ of bug fixing (corrective maintenance), which are more like service tasks. Managing\
    \ these tasks uses operations management, ITIL, ISO 20000, and CMMi SM concepts\
    \ as founding principles. Metrics in these two different types of maintenance\
    \ accordingly differ in their scope, nature, and intent. Metrics interpretations\
    \ reflect the respective founding principles."
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Occasionally, we also come across perfective maintenance where quality and
    performance of the software is improved. Perfective maintenance tasks are product
    and process improvement projects. IEEE standard defines perfective maintenance
    as “modification of a software product after delivery to improve performance or
    maintainability.” It is now widely believed that software reliability enhancement
    is a social responsibility; it makes life safer. To fulfill these social expectations,
    responsible maintenance organizations gather such metrics. These are product and
    process performance metrics. Such metrics have rather complex definitions and
    are often based on mathematical models.


    Corrective maintenance dominates the scenarios in some maintenance organizations.
    Some take up pure enhancements. In several other organizations, the three types
    coexist in a 3:1:1 ratio according to a study made by NC State University [2].
    The ratio could be 1:3:1 in certain business contracts where the focus is on bug
    fixing. NC State University also mentions that corrective maintenance—the quick
    fixes—come in two styles: without document changes and with document changes in
    the 2:1 ratio.


    In huge system enhancement contracts, such as in aerospace, a large number (thousands)
    of change requests are clubbed into a development package, and it goes through
    a full development life cycle for many years. Multiple variants of the product
    are released periodically. This becomes more complex than regular green field
    development projects. Additional activities such as impact analysis and regression
    testing are included to ensure that system integrity is maintained. For these
    projects, the metric approaches suggested in Chapter 6 are relevant and may be
    followed.


    In maintenance projects, many data are collected by automated tools. However,
    the construction of metrics and models seems to be more difficult in maintenance
    projects than that in development projects. Maintenance tasks are shorter, and
    there is no time for manual data collection. Tool-collected data go into a database
    (“write-only” data base, Humphrey quipped) and is revisited by analysts who prepare
    reports for management and customers. Data, much less metrics, are not that visible
    to support teams.


    Extraction of metrics from the database is performed based on the purpose at hand.
    The purpose could be weekly management reports or occasional construction of performance
    models.


    Let us take a look at some typical maintenance metrics.


    # BOX 7.1 SHOULD MAINTENANCE TEAM MEASURE SOFTWARE RELIABILITY?


    Reliability is a product metric and is often considered as a development metric.
    However, the role of reliability assurance shifts with time, from the development
    team to the maintenance team. Under maintenance tasks, reliability can either
    grow or deteriorate. Many support teams do not measure reliability unless the
    contract demands such a metric. As software evolves during maintenance, entropy
    sets in and quality gradually diminishes.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "> As a system evolves its complexity increases unless work is done to maintain\
    \ or reduce it; the quality of such systems will appear to be declining unless\
    \ they are rigorously maintained and adapted to operational environment changes.\n\
    > \n> Lehman’s Laws of Software Evolution\n\n> It is becoming an implied need\
    \ that the support teams look after software reliability too and hence must measure\
    \ reliability.\n\n# Maintainability Index\n\nA code is maintainable if it is understandable,\
    \ modifiable, and testable, three factors identified by Syvasya [3]. A simple\
    \ rule is\n\n> The more complex a code turns, the less maintainable it becomes.\n\
    \nA widely used and practical working metric, maintainability index, is defined\
    \ as follows:\n\nMI = 171 - 5.2lnV - 0.23G - 16.2lnLOC\n\nwhere MI is the maintainability\
    \ index, V is the Halstead volume, G is the cyclomatic complexity, and LOC is\
    \ the count of source lines of code (SLOC).\n\nWay back during coding, this metric\
    \ could be used by a programmer to simplify a code in a systematic and measurable\
    \ manner. The same metric can be used by the maintenance team to assess the application\
    \ under maintenance. During the series of enhancements and feature additions,\
    \ care may be taken to sustain high maintainability or even improve maintainability\
    \ in preventive maintenance. This metric plays a fundamental role in the phases,\
    \ coding, and maintenance:\n\n> What is measured, improves.\n\nTracking this metric,\
    \ during evolution of software during maintenance, helps to regulate and guide\
    \ maintenance efforts.\n\n# Change Requests Count\n\nAt the outset, the software\
    \ size grows following an evolutionary path, release followed by release. Only\
    \ a part of the software is not modified, as suggested by Lehman et al."
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_125_0.png)


    # Figure 7.1 Change request (CR) arrival.


    [4], and shows an example: the total size of a system in modules and the part
    of the system not touched at each release are plotted as a function of release
    number. Both measures are expressed as a percentage of the largest size achieved
    by the system.


    In this dynamic environment, maintenance teams have to respond to change requests
    from the field—from customers. Change requests need to be validated and analyzed,
    and fixes must be designed, built, tested, and finally released. The arrival of
    change requests from two applications under maintenance is shown in Figure 7.1.


    Change requests from application 1 show a trend of growth, suggesting more changes
    in the months to come, whereas change requests from application 2 seem to have
    reached a plateau region, suggesting negligible number of changes in the months
    to come. Cumulative plots of change request counts are of immense value to the
    maintenance team. They indicate work done and predict work to be done. The metric
    is a direct count and does not involve complex calculations. Meaningful are the
    patterns discernible to the human eye.


    # Customer Satisfaction Index


    Measurement of customer satisfaction (CSAT) has a strong business purpose: it
    helps businesses grow. Maintenance metrics framework placed great emphasis on
    CSAT survey.


    Customers take a more direct interest in bug fixing and tend to fill in customer
    satisfaction survey forms regularly and frequently. The factors selected for CSAT
    survey are unique and resemble typical sets used in the service industry. Zeithaml
    and Parasuraman’s [5] RATER model measures the following factors:'
