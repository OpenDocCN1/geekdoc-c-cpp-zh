- pgno: 260
  md: 'It shows a prominent central tendency.

    It is capable of representing symmetry.

    It is capable of showing skew, both left and right.


    All these representations can be achieved with great agility.


    # Three-Point Schedule Estimation


    Let us consider an example of schedule estimation by expert judgment for a software
    component development:


    +   Optimistic value = 25 days

    +   Pessimistic value = 50 days

    +   Most likely value = 30 days


    Applying the triangular PDF, the expected value of schedule is as follows:


    Mean = (25 + 50 + 30)/3


    = 35 days


    This may be compared with the conventional estimation technique using the program
    evaluation review technique (PERT) formula. The PERT formula will place the estimate
    as follows:


    PERT = (tₒ + 4tₘ + tₚ)/6


    = (25 + 4 × 30 + 50)/6


    = 32.5 days


    It is seen that the triangular PDF gives a safer and more conservative estimate.


    # Beta Option


    There have been interests in generalized triangles with curvature added. Wahed
    published “The Family of Curvi-Triangular Distributions” [2]. Brizz [3] has constructed
    two-faced triangles with one face a straight line and the second face exponential.
    However, the classic beta distribution provides smoothly curved bounded functions,
    and in the opinion of the authors, the good old beta distribution must be exploited
    first before experimenting with curvilinear versions of the triangle. A typical
    beta distribution model is shown in Figure 15.7. The problem of productivity is
    revisited with beta.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_261_0.png)


    # Figure 15.7 Beta distribution of productivity (FP/person-month).


    For fixed upper and lower bounds 30 and 15, three curves have been drawn for three
    sets of shape parameters. The beta distribution bounded between 0 and 1 is defined
    as follows:


    ```

    Beta(x, α, β) = x^{α-1}(1 - x)^{β-1} / [Γ(α)Γ(β) / Γ(α + β)] (15.8)

    ```


    where Γ represents the gamma function, and α and β are the shape parameters.


    Figure 15.7 looks more appealing than triangles, but the equation intimidates
    users. Beta distribution can offer an impressive array of bounded shapes. However,
    while implementing bounded functions in real-life projects, beta distribution
    was less acceptable despite its inherent power, and the “intuitive” triangular
    model was considered.


    # Triangular Risk Estimation


    Like with any PDF, the triangle can be used for risk analysis. Figure 15.8 shows
    risk measurement in the triangular way.


    Risk computation based on triangular function should be taken with far more seriousness
    and treated more urgently than risk measured based on tailed distributions. Tails
    in bell curves and other tailed distributions are mere extrapolations into extremes,
    whereas the triangle means business. Risk measured by typical triangular models
    should be specially treated because we do not generally anticipate risks in the
    triangular side of the world. Measuring risk with the body of a probabilistic
    distribution is very different from measuring risk with tails.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_262_0.png)


    Figure 15.8 Risk estimation using triangular distribution.


    # Parameter Extraction


    Precise parameters make precise models. In the case of the triangular model, we
    use expert judgment, Delphi, or wideband Delphi in the absence of data. Group
    judgment is more robust, resulting in a less skewed triangle. If data were available,
    we use histograms and visually match a triangle first and then, if called for,
    a least square error method after optimally binning the histogram. Going for MLE
    or other rigorous techniques is not warranted for triangular models. If more precise
    judgment of risk is involved, then the beta distribution should be chosen or the
    triangular model must be refined as van Dorp and Kotz [4] have done: They extended
    the model into a four-parameter version that allows even J-shaped forms. It may
    be seen that the TD offers all the facilities available in classical distribution
    models; it supports risk estimation and simulation; It is used in 3 point estimation
    and first order approximation of processes. All this is accomplished using elementary
    linear consideration.


    # BOX 15.2 A CRYSTAL CLEAR WORLD


    The triangle offers a tailless view of process. This is a crystal clear world
    without the ambiguity. The presence of tails makes comparing two processes a complex
    affair; one often needs hypothesis testing and abstruse rules. It is quite plain
    with triangles, and one can make commonsense-based judgments.


    For example, let us consider a productivity model defined by a triangle (30, 40,
    and 60) lines of code (LOC) per person day. To answer a question whether a productivity
    data point 61 belongs to this process or an outlier is rather easy. The data point
    in question is outside the triangle.


    Had we used a bell curve, the answer is not so easy; at least it will not be a
    straightforward reply. One would say there is chance p that the data point'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'belongs to the process. Then we will apply a policy to decide whether the p
    value is less than the “critical value.” If the p value is less, then we would
    say that the data point is significantly different from the process. It is a round-about
    way of saying that p is outside and is certainly confusing to many who would rather
    have a simple and transparent answer.


    The triangle presents a crystal clear view of process and facilitates straight
    decision making.


    # Review Questions


    +   1. Why is the triangular distribution preferred in the place of uniform distribution
