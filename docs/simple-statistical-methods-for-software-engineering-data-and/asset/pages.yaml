- pgno: 53
  md: '# BOX 2.3 A GOLDEN RULE TO OBTAIN TRUTH


    Estimating a software project using the “expert judgment” method is knowledge
    driven. However, selective memory could taint human judgment because knowledge
    is embedded in the human mind. A golden rule to extract truth from expert judgment
    is to make the expert recall extreme values as well as the central value from
    previous experience and use a weighted average using the 1:4:1 ratio. This estimate
    is respected as a golden estimate, and the rule is hailed as the golden rule.


    # Application Notes


    # Managing Software Projects Using Central Tendency Values


    After collecting all the data, software projects are more commonly managed with
    values of central tendency. Managers prefer to take decision with summary truths.


    > Goal tracking is done using mean values while risk management is done using
    variances.


    Weekly and monthly reports make liberal use of mean values of data collected.
    Performance dashboards make wide use of mean values. Means are compared to evaluate
    performance changes.


    # Making Predictions


    Basic forecasts address mean values. Most prediction models present mean values.
    In forecasting business volumes and resource requirements, central tendencies
    are predicted and used as a rule. The prediction of variance is performed as a
    special case to estimate certainty and risk.


    # BOX 2.4 ALIGNING THE MEAN


    Aligning the mean of results with target is a great capability. Process alignment
    with target is measured by the distance between mean and target. The lesser the
    distance, the greater is the alignment. Aligned processes synchronize with goals,
    harmonize work flow, and multiply benefits. The mean of results is particularly
    important in this context. The quality guru Taguchi mentions that the loss to
    society is proportional to the square of the drift of process mean from target,
    that is, Loss = (target – mean)²


    Drift favorable to the consumer creates loss to the supplier; drift in the opposite
    direction creates loss to the consumer. Either way, drift causes loss to someone
    in society.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# ⚙ **Case Study: Shifting the Mean**


    Performance is often measured by the mean. This is true even in the case of engineering
    performance. Code complexity is an engineering challenge. Left to themselves,
    programmers tend to write complex codes, a phenomenon known as *software entropy*.
    Code complexity is measured by the McCabe number. Shifting the mean value of the
    McCabe number in code requires drive from leaders and motivation from programmers.
    To make a shift in the mean complexity is a breakthrough in software engineering.
    Lower complexity results in modules that are testable and reliable. Nevertheless,
    achieving lower complexity requires innovation in software structure design and
    programming approaches.


    This case study is about a software development project that faced this challenge
    and overcame it by setting a visible goal on mean complexity. The current state
    is defined by the mean McCabe number, and the goal state is defined by the desired
    McCabe number. The testing team suggested an upper limit of 70, beyond which code
    becomes difficult to comprehend in terms of test paths; test coverage also suffers.
    Data for the current state show huge variation in complexity from 60 to 123 and
    even 150 occasionally. The project manager has two thoughts: fix an upper limit
    on complexity of individual objects or fix an upper limit for the mean complexity
    number for a set of objects that define a delivery package. Although these two
    options look similar, the practical implications are hugely different. On the
    first option of setting an upper limit on individual events, the limit contemplated
    by testers is 70. The second option is about setting limit on the central tendency;
    this really is setting an optimum target for software development. The number
    chosen for this target is 40. This is a stretch goal, making the intention of
    the project manager very clear. Figure 2.3 shows the chart used by the project
    team to deploy this stretch goal for shifting the mean.


    In reality, the team is gradually moving toward the targeted mean value. The direction
    of shift in the mean is very satisfying.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_54_0.png)'
