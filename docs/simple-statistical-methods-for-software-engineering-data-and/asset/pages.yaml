    # Process Capability Indices


    A process is said to be capable if two conditions are met: it should show less
    variation, and it should be aligned to goal.


    Variation must be contained inside the specification window available. The practical
    range of the process (truncated) must be less than the gap (USL – LSL). How much
    of the specification window is consumed by the process determines capability.
    Hence, we use the following two equations in assessing the first index, known
    as Cₚ, process potential:


    Specification window = USL – LSL

    Cₚ, process potential = specification window/6σ'
