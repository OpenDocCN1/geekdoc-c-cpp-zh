  md: 'Both B and C control the inflection point. At the inflection point, growth
    attains 0.36788 (this number = 1/e, where e is the Euler constant) of the plateau
    value A. This means 36.788% of the total defects at the inflection point. This
    property characterizes the Gompertzian way of testing and finding defects. The
    inflection point, as we have already seen, also represents peak value in growth
    rate (here defect discovery rate).


    The time when the inflection happens has been defined by Kececioglu et al. [4].
    For the different values of B and C used in Figure 21.1, the following inflection
    times have been computed:


    | B | 0.1 | 0.01 | 0.001 | 0.1 | 0.01 | 0.001 |

    | C | 0.3 | 0.3 | 0.3 | 0.6 | 0.6 | 0.6 |

    | Inflection time | 0.693 | 1.268 | 1.605 | 1.633 | 2.990 | 3.783 |


    From these results, we may see the influence of B and C on inflection time. Large
    inflection time indicates delayed defect discovery.


    # Dimitri Shift


    Kececioglu et al. [4] worked out a modified Gompertz curve by adding a constant
    D to displace the curve vertically by a distance D. This shift results in a four-parameter
    Gompertz model defined in the following equation:


    ```

    G(t) = D + A(B^(C^t))

    ```


    This shift of the Gompertz curve in the y axis is analogous to the familiar location
    shift in the x axis we have seen in Chapter 20. The shift factor D is some kind
    of a location parameter. A plot of the shifted Gompertz curve is shown in Figure
    21.3.


    The shifted curve suggests a significant amount of defects discovery immediately
    after the start. This is not agreeable to intuitive reasoning. However, Dimitri
    et al. [4] claimed that the modified model fits better with data. They observe
    from several data sets that


    Reliability growth data could not be adequately portrayed by the conventional
    Gompertz model. They point-out that the reason is due to the model''s fixed value
    of reliability at its inflection point. As a result, only a small fraction of
    reliability growth datasets following an S-shaped pattern could be fitted.'
  merge: -1
  img_proc: true
