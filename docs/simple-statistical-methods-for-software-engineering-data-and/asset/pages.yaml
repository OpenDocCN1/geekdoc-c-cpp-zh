- pgno: 60
  md: 'a center slightly away from the target. In both the scenarios, the hits are
    scattered around a center, the mean value.


    Dispersion is measured in terms of deviations from the mean. Data with larger
    dispersion show larger deviations from the mean. The following are different expressions
    making use of this basic idea.


    # Average Deviation


    If we calculate the deviations of all data points—all the N hits—from the mean
    x̄ and take the average, we will obtain a measure of scatter, or dispersion. The
    average deviation for N hits from the field gun is a fairly representative estimate
    of dispersion. Every deviation is measured in meters, and the average deviation
    is also in meters.


    The formula is given as follows:


    $$D_{\bar{x}} = \frac{\sum_{i=1}^{N} (x - \bar{x})}{N}\tag{3.1}$$


    When we try the same formula to obtain the average deviation in bug repair times
    (data shown in Table 3.1), we encounter a problem. The average deviation can be
    seen as zero.


    The deviation values have a direction; the value can be positive or negative.
    In the process of calculating the average deviation, the positive values have
    cancelled out the negative values.


    # Average Absolute Deviation


    To avoid the sign problem, we can take absolute values of deviation, as shown
    in this modified formula. This is a workaround.


    $$D_{\bar{x}} = \frac{\sum_{i=1}^{N} |x_i - \bar{x}|}{N}\tag{3.2}$$


    Absolute deviations have been calculated and shown in Table 3.1. The average absolute
    deviation from the mean is 8.669 days. This number defines dispersion of bug repair
    time around the data mean of 20.517.


    We can use this measure to compare scatter in 2-month bug repair data.


    # Median Absolute Deviation


    The scale of scatter of data can be computed with respect to any center. Normally,
    we use mean as the center as we have conducted in computing the average absolute'
