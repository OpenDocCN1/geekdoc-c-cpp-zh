  md: '# LAWS OF

    PROBABILITY


    In Section III, we shall see some time-tested laws of statistics. However, the
    foundation lies in empirical patterns of evidential data because all these laws
    are inspired by patterns in evidential data.


    Chapter 10 on histogram establishes the rules of thumb of pattern extraction from
    data. Chapter 11 presents the binomial process, the binomial and related laws.
    Historically, a good deal of statistical concepts evolved around these laws, both
    to conceive them and to apply them. Chapter 12 presents the exponential law, the
    related Poisson process. Chapter 13 presents the bell curve, which has become
    a social law of universal status and great potential. Statistical thinking is
