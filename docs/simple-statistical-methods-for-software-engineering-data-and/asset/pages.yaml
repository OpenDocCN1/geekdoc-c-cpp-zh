- pgno: 308
  md: '# Chapter 19


    # Weibull Distribution:

    A Tool for Engineers


    The genesis of the Weibull distribution goes back to the Rayleigh distribution.
    The Rayleigh distribution was invented in 1905 (see Box 19.1). The Weibull distribution
    was invented much later by Waloddi Weibull in Sweden in 1939 (see a brief biographical
    note in Box 19.2). Since the discovery of the Weibull distribution, it has cast
    great influence in engineering, especially in reliability analysis. The scope
    of its application has widened to several areas of physics and management (see
    Box 19.3 for a few instances).


    # BOX 19.1 RAYLEIGH FLIGHT


    It so happens that the Rayleigh distribution, invented in 1905, is a special case
    of the Weibull distribution invented in 1939. The Weibull distribution type II
    with location constant 0 and shape factor 2 is the Rayleigh curve. Both are skewed
    to the right.


    The discovery follows research on the historic “random walk” problem posed by
    Pearson.


    Pearson posed his problem in Nature (July 27, 1905).


    A man starts from a point 0 and walks l yards in a straight line; he then turns
    through any angle whatever and walks another l yards in a second'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'straight line. He repeats this process n times. I require the probability that
    after n of these stretches he is at a distance between r and r + δr from his starting
    point.


    Rayleigh pointed out that, for large values of n, the answer given by Rayleigh
    was


    ```

    2/(n l²) e^(-r²/(n l²)) r δr

    ```


    (19.1)


    This actually has the shape of a normal distribution, centered at the origin.
    In this equation Rayleigh assumed that the drunkard walks in one dimension. The
    model suggests that the drunkard will return to the origin after a random walk.
    If we allow two additional dimensions and solve the problem, a new phenomenon
    called Rayleigh Flight occurs. The distribution now is Rayleigh. The drunkard
    will not return to the origin.


    Rayleigh missed Smoluchowski’s 1906 paper on the motion of colloidal particles,
    in which he introduces the random flight idea.


    A one-dimensional walk is Gaussian. A multidimensional walk is Rayleigh. Brownian
    motion in one dimension is Gaussian. The vector sum of Brownian movements in several
    dimensions is Rayleigh. Simple processes follow Gaussian. A combination of several
    simple processes is Rayleigh.


    Software development is due to the combined work of several people and several
    processes. Even if the individual processes are Gaussian, the combined result
    can be the skewed Rayleigh. This being the essential case, can we expect team
    results to be normally distributed? Relentless pursuit of normality in software
    engineering data is futile.


    IBM’s Peter Norden (see Box 19.4) favored the Weibull equation over the logistic
    curve to model software development project cost. Lawrence Putnam promoted the
    Weibull curve with shape factor = 2 as a Rayleigh distribution. Putnam used this
    in his estimation model SLIM to estimate cost and defect. He went further to call
    this distribution the software equation.


    > The Weibull distribution is by far the world’s most popular statistical model
    for life data. It is also used in many other'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'applications, such as weather forecasting and fitting data of all kinds. Among
    all statistical techniques it may be employed for engineering analysis with smaller
    sample sizes than any other method.


    Robert B. Abernethy


    # Weibull Curves


    We will start with Weibull plots with three standard values for the shape parameter:
    1, 2, and 3. These three plots are shown in Figure 19.1. We have chosen a scale
    factor of 20 and have kept it the same for the three plots. The shapes of these
    three curves resemble the shapes of the exponential distribution, the Rayleigh
    distribution, and the normal distribution, respectively. The three figures represent
    a family of curves known as the Weibull family.


    The curves shown are possible models for service time in a software maintenance
    project with a median value of 20 days and hypothetically equating the scale parameter
    to the median value.


    The Weibull equation, which has been used in creating the curves, is given as
    follows:


    ```

    W(x) = α/β (x/β)^{α-1} e^{-(x/β)^α}    α, β > 0    (19.2)

    ```


    where α is the shape parameter and β is the scale parameter.


    The value of shape factor is not limited to the three integers shown in Figure
    19.1. It can be any positive number and can be used to generate an infinite number
    of the Weibull curves.


    # Parameter Extraction


    # Rules of Thumb


    The shape factor can be judged by looking at data histograms. To start the iteration
    of curve fitting, it is good to begin with the nearest of the three shapes 1,
    2, and 3 and then converge using the least square error method. Scale is substantially
    influenced by median, as shown in the following rule of thumb:


    ```

    Scale = C₁ median

    ```


    ```

    C₁ = 0.09 shape factor + 0.636

    ```'
