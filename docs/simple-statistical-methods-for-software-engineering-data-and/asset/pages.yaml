- pgno: 278
  md: '# BOX 17.1 THE FIRST APPEARANCE OF LOG-NORMAL


    It began with geometric mean. If a variable can be thought of as the multiplicative
    product of some positive independent random variables, then it could be modeled
    as log-normal.


    The basic properties of log-normal distribution were discussed long ago in 1836
    by Weber [2]. McAlister described the log-normal distribution around 1879. Kapteyn
    and Van Uven, in 1916, gave a graphical method of estimating the parameters; the
    log-normal distribution was found to be accurately representing the distribution
    of critical dose for several drugs; this was also the first time that log-normal
    distribution was applied in real life.


    > NASA software defect data sets have been made publicly available and extensively
    used by researchers.


    The data may be viewed in the box plot provided in Figure 17.1.


    In the box plot, it may be seen that design complexity data are right skewed with
    several outliers too. (Box plot is a good data visualizer; it produces a rich
    picture of data. Further information about the reading a box plot is available
    in Chapter 4.)


    Having seen the picture of raw data, we can choose to take logarithms of data
    and examine the result to see how data have been transformed, in particular, how
    well data have been unskewed, by logarithms. We plot the logarithms of data in
    a box plot in Figure 17.2.


    The new box plot has noteworthy and serious differences. Comparing Figure 17.2
    with Figure 17.1 reveals two consequences of the transformation:


    +   1. The box has become symmetric.

    +   2. There is a drastic reduction in the number of outliers.


    The new box plot is a better fit. It is as if data after transformation have found
    its destination pattern.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_278_0.png)


    Figure 17.1 Design complexity data.'
