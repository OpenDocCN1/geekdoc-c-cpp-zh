- pgno: 56
  md: '# # Chapter 3


    # ## Data Dispersion


    Data dispersion arises because of sources of variation, including variations in
    measurements and results due to changes in the underlying process. Which one varies
    more, measurement or processes under measurement? We proceed in this chapter with
    the assumption that there is sufficient measurement capability behind the data;
    that means the measurement errors are very small compared with process variation.
    If this condition is met, dispersion in data will represent dispersion in the
    process under measurement.




    Dispersion or variation in process is viewed as uncertainty in the process outcome.
    To deal with uncertainty, we need to measure, express, and understand it. Range
    is a good old way of measuring dispersion. This has been used in the traditional
    X-Bar and R control charts, where R stands for range and X-Bar stands for sample
    mean. Range is the difference between maximum and minimum values in data.


    There is another convention to leave out extreme values and the considered range.
    Typically, the values below the 3rd percentile and the values above the 97th percentile
    are disregarded. To understand this, we need to construct the data array and sort
    data in some order and then chop off the upper 3rd percentile and the lower 3rd
    percentile. (If the length of the array L, the 3rd percentile point will rest
    at a point on the array at a distance of 0.03L from the origin. Similarly, the
    point of the 97th percentile will rest at a distance of 0.97L from the origin.)
    This range is the empirical difference between the 3rd and the 97th percentile
    values.


    The two calculations previously mentioned are conservative. In a third approach,
    the interquartile range (IQR) is taken as the core variation of the process. IQR
    is the difference between Q3 and Q1. It may be noted that 50% of observations
    remain in IQR.'
  merge: -1
  img_proc: true
