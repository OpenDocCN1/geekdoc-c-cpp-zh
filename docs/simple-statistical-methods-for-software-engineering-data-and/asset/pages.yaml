- pgno: 302
  md: 'Our knowledge of existing pattern and the gamma parameters we have derived
    from existing data are very relevant clues for this model.


    Let us begin with an assurance given by the customer to reduce the mean clarification
    time from the current 36.16 days to 20 days. The customer has already declared
    that he needs a minimum of 4 days for clarification. These two numbers, 4 and
    20, represent the two agreed performance levels as declared by the customer, the
    minimum and the mean. These are really minimal data gathered to characterize clarification
    time. Gamma distribution will do the rest and fit behavioral details into the
    model based on known patterns.


    > Where data are minimal, gamma distribution fills the gap.


    The minimum value 4 represents the location parameter, a fixed value in the models
    we are going to build.


    We construct three types of customer responses defined by gamma with three values
    for shape factors: 1.2, 2.0, and 3.0. This selection is intuitive and is based
    on familiarity and knowledge of maintenance teams of customer behavior as well
    as of gamma distribution shapes.


    With the help of Equation 18.2, we can estimate the scale parameter as follows:


    +   Corresponding to the shape factor 1.2, the scale factor is = mean/1.2 = 20/1.2
    = 16.67.

    +   Corresponding to the shape factor 2.0, the scale factor is = mean/2.0 = 20/2.0
    = 10.

    +   Corresponding to the shape factor 3.0, the scale factor is = mean/3.0 = 20/3.0
    = 6.67.


    Agreeing to the two customer suggestions, now the maintenance team has to predict
    expected variations in customer response by applying the gamma PDF.


    Three sets of gamma parameters, the scale and the shape factors, set the theater
    for simulation. The values of μ, α, and β for the three scenarios are as follows:


    +   Scenario I    gamma [4, 1.2, 16.67]

    +   Scenario II   gamma [4, 2.0, 10.00]

    +   Scenario III  gamma [4, 3.0, 6.67]


    The three gamma distributions, depicting the three scenarios, are plotted in Figure
    18.6.


    # Modes


    It may be seen that each scenario has a distinctly unique mode. The modes are
    7, 14, and 17 days. This means that according to Scenario I, the customer is most
    likely to resolve clarification queries in 7 days. According to Scenario II, the
    most likely clarification time is 14 days. According to Scenario III, the most
    likely clarification time is 17 days. These modes represent the most visible customer
    performance. The modes represent performance highlights.'
