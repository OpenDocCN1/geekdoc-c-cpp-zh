- pgno: 295
  md: '# Chapter 18


    # Gamma Distribution:

    Making Use of

    Minimal Data


    Gamma distribution is a more general version of the exponential distribution.
    It provides all the advantages of the exponential distribution: it can model arrival
    times, and it has a fat tail and can characterize failure data. Gamma distribution
    has the extra advantage: it provides us a prominent mode and gives us the freedom
    to set the mode wherever we want by adjusting the shape factor. Gamma distribution
    retains the fat tail of the exponential distribution. This is not surprising because
    gamma distribution can be proven as a sum of exponential distributions.


    The gamma distribution has two parameters, shape parameter α and scale parameter
    β. The probability density function (PDF) is given by the following:


    ```

    G(x) = 1 / (β^α Γ(α)) x^{α-1} e^{-x/β}   α, β > 0   (18.1)

    ```


    where α is the shape parameter, β is the scale parameter, and Γ(α) = (α − 1)!
    (gamma function).


    In the previously mentioned PDF, the symbol Γ(α) stands for the gamma function.
    The PDF is plotted in Figure 18.1 to show how the shape of the distribution changes
    when we change the value of shape parameter from 1.2 to 2 and 3 in the plots.
    The scale parameter is kept constant at 10.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_296_0.png)


    # Figure 18.1 Gamma distribution.


    The plots have been made using the Excel function GAMMADIST. This function returns
    both the PDF and the Cumulative Distribution Function CDF.


    The Excel syntax is defined as follows:


    ```

    PDF(x) = GAMMA.DIST (x, shape parameter, scale parameter, 0)

    ```


    ```

    CDF(x) = GAMMA.DIST (x, shape parameter, scale parameter, 1)

    ```


    # BOX 18.1 SIMILARITY BETWEEN GAMMA AND LOG-NORMAL: MAKING THE CHOICE


    Gamma and log-normal distributions look alike.


    Kundu and Manglick [1] compared gamma and log-normal distribution and found them
    remarkably similar. They have used Lawless [2] data of bearing failure for this
    study. Let us develop some ideas around this analysis.


    For Lawless data, we obtain gamma shape = 3.7138 and scale = 19.4489, relating
    to Equation 18.1. Using Excel GAMMA.DIST (x, shape, scale, 0), the gamma curve
    can be realized.


    For the same data, we can obtain logarithms and find log-normal parameters, mean
    of natural logarithms, and standard deviation of natural logarithms of data. The
    log-normal curve can be realized by using Excel LOGNORM.DIST (x, mean of Ln, standard
    deviation of Ln, 0).'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_297_0.png)


    # Figure 18.2 Comparison of gamma and log-normal distributions of bearing life.


    Both the curves are shown in Figure 18.2.


    The curves look similar. Kundu and Manglick have used the maximum likelihood estimation
    (MLE) technique to obtain parameters, and they obtain slightly different values
    but nearly identical distributions. (The Kolmogorov–Smirnov (K-S) distance between
    the fitted empirical distribution function and the fitted log-normal distribution
    function is 0.09, and the K-S distance between the fitted empirical distribution
    function and the fitted gamma distribution function is 0.12.)


    These distributions are close to one another, and the log-normal is nearer to
    empirical data based on the K-S distance analysis.


    The similarity is superficial. There is a difference in the approach and assumptions
    in constructing both the distributions.


    Hence, we face the question, which distribution should be used? Are there preferences?


    > The gamma distribution may be used while taking shape based decisions by expert
    judgment of shapes and mean values.

    > Log-normal distribution may be used for more rigorous numerical treatment based
    on parameter extraction from data alone.


    Gamma distribution has a definite advantage: it can quickly convert visual judgment
    to a mathematical model.'
  merge: -1
  img_proc: true
