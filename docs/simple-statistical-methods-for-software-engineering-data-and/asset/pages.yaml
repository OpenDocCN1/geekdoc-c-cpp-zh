  md: '# New Trend


    The defect discovery performance of contemporary projects may be seen to be dramatically
    different from the traditional models. In a recent data benchmark done by Bangalore
    SPIN (2011–2012), a consolidated view of the defect curves across eight life cycle
    phases is presented. A summary is available for public view in their website bspin.org,
    and a detailed report can be obtained from them.


    BSPIN reports two types of defect curves coming from two groups of projects shown
    in Figure 19.10.


    In one group, the unit test seems to be poorly done, and the defect curve is not
    a smooth Rayleigh but broken. It looks as if the first defect discovery process
    ends and another independent defect discovery process starts during later stages
    of testing. The defect curve is a mixture. As a result, the tail is fat, much
    fatter than the homogeneous Rayleigh (Weibull II) would be able to support. In
    the second group unit, the test was performed well and the defect curve had no
    tail. Again, the defect curve with abruptly ending slope is not the unified Putnam’s
    Rayleigh.


    We may have to look for a special three-parameter Weibull with unconventional
    shape factors to fit these data. Both the curves affirm that a new reality is
    born in defect management. There is either a low maturity performance where the
    testing process shows a disconnect resulting in postrelease defects or a high
    maturity process with effective early discovery that beats the Rayleigh tail:
    a mixture curve with double peak or a tailless curve. In the first case, the vision
    of a smooth, unified, homogeneous and disciplined defect discovery has failed.
    In the second case, defect discovery technology has improved by leaps and bounds,
    challenging the traditional Rayleigh curve.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_322_0.png)


    Figure 19.10 Defect distribution across project lifecycle phases.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'This change reflects changes in life cycle models and practices. The modern
    projects follow new paradigms, self-designed and custom-tailored.


    # Weibull Model for Defect Prediction—Success Factors


    Weibull model, be it for cost prediction or for defect prediction, is holistic
    in nature and can be applied early in the project. Weibull holistic models should
    be used by leaders to predict the future and to manage projects. With a few data
    and indicators, one can foresee what lies ahead.


    However, there is some reluctance in applying holistic models when a lot more
    details have accumulated. People refuse to look at the larger picture. Weibull
    distribution presents a larger picture. The predictive use of Weibull cost models
    that resemble earned value graphs or Weibull defect curves that resemble reliability
    growth graphs is easily forgotten.


    Alagappan [13] presented three patterns of details that overstep the holistic
    Rayleigh curve:


    +   1. Fluctuating defect trend

    +   2. Lower actual defect density

    +   3. Effective defect management (early defect removal)


    These details come after project closure. Weibull can be constructed reliably
    enough halfway through the project. This advantage is untapped by the industry.


    Stoddard and Goldenson [14] mentioned the Rayleigh model as a process performance
    model in an SEI Technical Report (2010). The report presents a successful case
    study on a Rayleigh model from Lockheed Martin in which the authors of the case
    study described,


    The use of Rayleigh curve fitting to predict defect discovery (depicted as defect
    densities by phase) across the life cycle and to predict latent or escaping defects.
    Lockheed Martin’s goal was to develop a model that could help predict whether
    a program could achieve the targets set for later phases using the results to
    date.


    Research indicates that defects across phases tend to have a Rayleigh curve pattern.
    Lockheed Martin verified the same phenomenon even for incremental development
    approaches, and therefore decided to model historical data against a Rayleigh
    curve.


    Two parameters were chosen: the life-cycle defect density (LDD) total across phases
    and the location of the peak of the curve (PL). Outputs included planned defect
    densities by phase with a performance range based on the uncertainty interval
    for LDD and PL and estimated latent defect density.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Inputs to the model during program execution included the actual defect densities
    by phase. Outputs during program execution included fitted values for phases to
    date, predicted values for future phases and estimated LDD, PL, and latent defect
    density.


    The presentation suggested that those who want to be successful using defect data
    by phase for managing a program need to be believers in the Rayleigh curve phenomenon
    for defect detection.


    The belief in the Rayleigh curve, mentioned as an ingredient for success, is the
    point we wish to highlight.


    # BOX 19.4 VIEWS OF NORDEN WHO FIRST APPLIED WEIBULL TO SOFTWARE ENGINEERING


    Peter V. Norden has been a consultant with IBM’s Management Technologies practice,
    specializing in the application of quantitative techniques to management problems
    and project management systems. He was a member of the team that developed IBM’s
    worldwide PROFS communication system, which eventually became the Internet.


    Norden [15] created history by applying the Weibull distribution to software development.
    He was building quantitative models when he noticed,


    > It turned out, however, that time series and other models built on these data
    had relatively poor predictive value. It was only when we noticed that the manpower
    build-up and phase-out patterns related to why the work was being done (i.e.,
    the purpose of the effort, such as requirements planning, early design, detail
    design, prototyping, release to production) that useful patterns began to emerge.
    The shapes were related to problem-solving practices of engineering groups and
    explained by Weibull distributions.


    Subsequent researchers (notably Colonel L. H. Putnam, originally of the U.S. Army
    Computer Systems Command) referred to them as Rayleigh curves but were dealing
    with the same phenomenon.


    The life cycle equation computes the level of effort (labor-hours, labor-months,
    etc.; the scale is arbitrary) required in the next work period (day, week, month,
    etc.) as a function of the time elapsed from the start of this particular cycle,
    the total effort forecast for the cycle, and a scaleless “trashiness” parameter
    that could represent the urgency of the job.'
