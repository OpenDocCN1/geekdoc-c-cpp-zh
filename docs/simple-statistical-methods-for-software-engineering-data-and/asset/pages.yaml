    discovered until now. We can also calibrate the y axis in terms of the percentage
    of defects found, if we have an estimate of the total defects in the application.
    The expression “percentage of defects found” is believed to be a direct measure
    of the percentage of reliability.


    The growth curve starts at some fixed point, and the growth rate increases monotonically
    to reach an inflection point. After this point, the growth rate approaches a final
    value asymptotically. According to this model assumption, failure detection increases
    until the inflection point and then decreases.


    In Figure 21.1, the inflection point is marked on the growth curve. Also shown
    is the growth rate curve, which is obtained by differentiating the growth curve.
    The inflection point in the growth curve corresponds with the peak of the growth
    rate curve. A vertical dashed line is drawn to show the correspondence.'
