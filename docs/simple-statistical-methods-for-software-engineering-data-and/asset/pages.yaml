- pgno: 126
  md: '+   Reliability

    +   Assurance

    +   Tangibles

    +   Empathy

    +   Responsiveness


    More factors are added, and the previously mentioned factors are also tailored
    based on the business contract and customer’s special requirements.


    Customer satisfaction against each factor is measured using the Likert scale.
    However, a continuous scale from 0 to 10 is simpler, more granular, and has advantages,
    presented as follows:


    Undesirable 0 o—o—o—o—o—o—o—o—o—o—o 10 Excellent


    The maintenance CSAT factors are very different from the factors used in development
    projects, and the priorities are different. Preferably, the factors should be
    selected in consultation with the customer to have a perfect alignment with customer’s
    expectations.


    The CSAT index is a metric religiously collected in corrective maintenance operations;
    this is also the metrics more often seen by top management.


    # Resource Utilization


    There is always a mismatch between the volume of maintenance tasks and the available
    resources. Workload is not constant but fluctuates. Projects could be understaffed
    or resources could be idle.


    Typical maintenance projects are run with minimal resources to reduce overhead
    costs; as a consequence, there is a backlog. However, the resource utilization
    metric will be reported as 100% every month. This metric is a fallacy unless it
    is seen in the context of performance and customer satisfaction. If there is overtime
    and if it is also recorded, human resources utilization will touch 120% and more,
    as has been occasionally reported in the industry. Such high scores are alarming;
    employees could be put under stress, and quality of work may be compromised. Fatigue
    affects the way the team members communicate and empathize with customers. The
    healthy range of this metric is between 95% and 98%.


    Along with this metric, team skill index can also be measured using the data collection
    form shown in Figure 7.2. When the team skill index is low, it has two significant
    consequences: customer satisfaction falls low, and it takes longer to fix bugs.


    # Service-Level Agreement Compliances


    Service levels are specified in the maintenance contract. There are stringent
    specifications on the time to deliver each category of service. For example, the
    delivery time'
