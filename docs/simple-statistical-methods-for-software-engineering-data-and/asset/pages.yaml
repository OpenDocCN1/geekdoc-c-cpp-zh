- pgno: 286
  md: 'Earthquakes are measured in a logarithmic scale. If the power unleashed is
    10 times larger in the Richter scale (invented by Charles F. Richter in 1934)
    for measuring earthquake strength, the signal jumps one point. The release of
    a million-fold strong outburst appears as a mere six-point movement in the Richter
    scale. At the same time, the Richter scale is sensitive enough to register very
    small seismic activities, too small to be detected by humans. The range of the
    Richter scale is enormous.


    Orders of magnitude are seen through logarithms. The conversion from logarithms
    to real scale is achieved by taking antilogarithms. A trained human mind quickly
    does a conversion by applying rules and examples. In this context, the log-normal
    distribution is a return to a natural way of dealing with huge magnitudes. One
    just has to get used to it.


    # Application of the Log-Normal Model 1


    If an engineering limit on design complexity is set at 6, then we can find the
    probability of meeting this limit (certainty) from the CDF. In the CDF shown in
    Figure 17.6, a vertical line runs from x = 6 to meet the CDF; from the point of
    intersection, a horizontal line is drawn, which meets the y axis at approximately
    0.9.


    The exact value is obtained from the CDF as follows:

    Probability that design complexity is <6:


    ```

    = CDF (x = 6)

    = LOGNORM.DIST (6,0.693,0.930,1)

    = 0.8813

    ```


    The above number represents the certainty of meeting the design complexity goal
    of 6.

    We can extend the analysis to calculate the risk of design complexity exceeding
    the limit of 6.

    The risk of design complexity exceeding the limit of 6 is as follows:


    ```

    = 1 - CDF (x = 6)

    = 1 - LOGNORM.DIST (6,0.693,0.930,1)

    = 1 - 0.8813

    = 0.1187

    ```


    Calculating certainty and risk is a most useful application of log-normal distribution.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Application of the Log-Normal Model 2


    The next application refers to developing a control chart for design complexity.
    We cannot apply the Shewhart Control Chart with the mean μ as the central line
    and μ ± 3 σ as the control limits. Shewhart chart assumes a normal distribution,
    and its design complexity is log-normal. Shewhart limits are symmetrical design
    complexity limits that cannot be symmetrical. We have established design complexity
    as a skewed distribution. Besides, we do not need a lower control limit for complexity.
    All we need is an upper control limit.


    Shewhart limits include 99.73% of process inside the limits and keep only 0.27%
    as outliers. Shewhart limits apply better for manufacturing processes. For creative
    processes such as software design, the authors suggest a different rule for control
    limits. The proposed limits include 95% (0.95) of processes inside the limits
    and mark 5% of processes as outliers. This upper control limit is obtained from
    the CDF shown in Figure 17.6 as an x value corresponding to a y value of 0.95.


    ```

    Upper control limit for y = 0.95

    = LOGINORMINV (y, scale, shape)

    = LOGINORMINV (0.95,0.693,0.93)

    = 9.2324

    ```


    This sets the statistical limit for upper control of design complexity.


    # Features Addition in Software Enhancement


    In Chapter 13, we treated requirement volatility to a Gaussian with a standard
    deviation of approximately 3.3% and a mean value of 4%, for full life cycle development
    projects with stringent business control on requirements. In large enhancement
    projects, the Gaussian model does not hold; here changes are far more common.
    Features added after requirements are “finalized” can touch high values, as high
    as 50%. The growth of features is log-normal. The pattern of growth varies. Three
    examples, A, B, and C, are presented in Figure 17.7.


    Model C has the largest scale of 20 and the fattest tail. Model B has a scale
    of 10 and a medium-sized tail. Model A has a scale of 4 and has an early finishing
    point. All three models represent the customer’s processes over which the maintenance
    team has no direct control. In such cases, statistical management reduces to empirical
    understanding of the process with data and creating the appropriate PDFs. To recognize
    if variation is Gaussian or log-normal is the first step; this is enabled by histograms.
    Fitting the appropriate PDF by parameter extraction is the next step. Applying
    the model to solve problems and take decisions is the goal.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_288_0.png)


    Figure 17.7 Log-normal PDF of software enhancements.


    # A Log-Normal PDF for Change Requests


    The process of “change requests” in a support project is a mixture; it is composed
    of assorted tasks, including bug fix, feature addition, and patchwork. A PDF of
    change requests is modeled with the following parameters:


    Shape σ = 1

    Scale β = 7


    The scale factor is set at the median of data. The shape factor is chosen by an
    iterative search for best fit. The log-normal PDF for change requests is plotted
    in Figure 17.8.


    However, this is merely curve fitting. This model does not benefit from the ideological
    context such as that present in the model for feature addition or design complexity.
    Despite this limitation, the model can still be used for forecasting.


    A better approach, beyond the scope of this book, would be to create a mixture
    model, combining inherent probabilistic characteristics of the components.


    > Bug fixes may be denoted by Weibull distribution, patchwork by beta distribution
    and feature addition by log-normal distribution.


    Mathematically combining the three would require a series of approximations and
    special analytical treatments, which would require a specialist’s knowledge. However,
    such a combination can also be achieved digitally by simulation.'
