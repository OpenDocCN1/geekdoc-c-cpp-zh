  md: '+   c Process mode

    +   a Lower boundary of process

    +   b Upper boundary of process


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_259_0.png)


    is a model of process aligned to some convenient lower bound.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_259_1.png)


    is a model of a centered process.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_259_2.png)


    is a model of a process stretching to the maximum tolerance.


    # Figure 15.5 Triangular distribution—three examples.


    The formula for skew is as follows:


    ```

    Skew = √2 (a + b - 2c)(2a - b - c)(a - 2b + c) / [5 (a² + b² + c² - ab - ac -
    bc)^(3/2)] (15.7)

    ```


    Equation 15.7 is used to construct a relationship between skew and mode c for
    a given a = 0 and b = 10. A graph of the relationship is plotted in Figure 15.6.


    We can generate a wide range of skews using the relationship. In software development
    projects, the challenge arises in the form of skew. In a Gaussian-dominated statistical
    thinking, skew does not even exist. The triangular model provides a simple model
    to represent skew. Hence, the inherent advantages of the triangular model are
    threefold:


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_259_3.png)


    # Figure 15.6 Relationship between Skew and mode c.'
