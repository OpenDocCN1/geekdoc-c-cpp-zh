- pgno: 312
  md: 'It is a good idea to fit Weibull by equating the median of data to the median
    value of the distribution. Weibull, being a skewed curve, is best represented
    by median. This formula is simple.


    # Moments Method


    The scale factor can be estimated by the method of moments. The mean value of
    the distribution is equated to the mean value of data. The variance of the distribution
    is equated to the variance of data.


    Equation to the mean of the distribution is given as follows:


    μ = βΓ(1 + 1/α) (19.3)


    Equation to the variance of the distribution is given as follows:


    σ² = β²[Γ(1 + 2/α) − Γ²(1 + 1/α)] (19.4)


    # MLE


    A commonly accepted approach to the general problem of parameter estimation is
    based on the principle of maximum likelihood estimation (MLE). Moments-based estimators
    have been popular because of their ease of calculation, but MLEs enjoy more properties
