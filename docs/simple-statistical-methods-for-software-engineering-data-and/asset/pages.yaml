- pgno: 342
  md: '# Building a Reliability Growth Curve


    Building a reliability growth curve in real life is fraught with basic problems.
    Software reliability models have not delivered the desirable deliverables that
    they are intended to realize, as commented by Faqih [2], who listed eight major
    causes for this problem,


    > Unfounded types of assumption, complexity of the software, complexity of the
    reliability models, weakness of the reliability models, the misconception of fault
    and failure phenomena, inaccurate modeling parameters, difficulty in selecting
    the reliability model, difficulty in building software operational profile.


    There are many who will adopt a cautious approach to reliability growth models.
    Stringfellow and Andrews [3] saw many challenges,


    > It is difficult to define operational profiles and perform operational tests.
    Defects may not be repaired immediately. Defect repair may introduce new defects.
    New code is frequently introduced during the test period. Failures are often reported
    by many groups with different failure-finding efficiency. Some tests are more
    or less likely to cause failures than others. Test effort varies due to vacations
    and holidays.


    Whether growth is Gompertzian is the next question.


    # Gompertz Software Reliability Growth Model Curves


    The Gompertz software reliability growth model (SRGM) is defined as follows:


    ```

    G(t) = A(B^(C^t))  (21.1)

    ```


    where G(t) is the defects found until time (t), A is the total defects in the
    application, B and C are the constants with fractions between 0 and 1, and t is
    the time elapsed from the start of testing.


    Constraining C to values less than 1 is of paramount importance; that is what
    makes the expression within the inner brackets decrease with time. Likewise, constraining
    B'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'to values less than 1 is equally important to make the overall function grow
    with time. The constant A is equal to the number of total defects in the application.


    Figure 21.2 contains two sets of Gompertz curves. The first set of three curves
    are constructed with C = 0.3. The second set of three curves are plotted with
    C = 0.6. The value of A is fixed at 100.


    The effect of C on the curves can be easily seen on the patterns that discriminate
    the two sets. Increasing C delays defect discovery.


    Within each group, three values of B are shown: 0.1, 0.01, and 0.001. Decreasing
    B delays defect discovery.


    The x axis of the graph is time varying from 0 to 10 units. It could be days,
    weeks, or months. It could also be proxies for time. However, we had weeks in
    mind while plotting the graph; this roughly coincides with the time required to
    find 100 defects in a small project.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_343_0.png)


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_343_1.png)


    # Figure 21.2 Gompertz reliability growth curves for C = 0.3 and C = 0.6.'
