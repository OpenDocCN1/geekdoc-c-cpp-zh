    # Study of Customer Complaint Arrival Rate Based on Poisson Distribution


    Customer complaints regarding field failure arrive at the Poisson rate. Let us
    consider a case where the average number of failure complaints arriving per month
    is λ. One question that comes to our mind is “Can we think about the maximum number
    of complaints that are likely to arrive?” Is there enough evidence in λ to predict
    the maximum number of complaints? Poisson distribution is applied to such cases.
    A c chart is plotted with the number of complaints arriving per month. The upper
    limit in the chart is calculated by the same formula used above. We find that
    the maximum number of complaints likely to arrive per month is


    ```

    λ + 3√λ

    ```


    This number could defy intuitive judgment of customer complaints; intuitive judgment
    hovers around the average value. The predicted number may exceed the maximum ever
    number of complaints received in any given month so far. The Poisson boundary
    easily exceeds the trend forecast. The Poisson approximation to customer complaint
    arrival is a very valuable aid.


    An example of customer complaints arrival is shown in Figure 12.10.'
