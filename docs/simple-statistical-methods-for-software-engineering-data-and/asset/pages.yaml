    +   \n+   3. In a survey of software reliability models, Pai [8] considers the\
    \ GO model. He makes a salient observation regarding the GO model usage, “The\
    \ model requires failure counts in the testing intervals and completion time for\
    \ each test period for parameter estimation.”\n\nIn our opinion, this practice\
    \ gives extra credibility to the mean value function and invests it with more\
    \ decision making power. An exponential model that uses sums of the defects found\
    \ in test intervals and the completion time of the test interval as the argument\
    \ does not depend so much on Poisson abstraction.\n\n+   4. Liu et al. [9] propose\
    \ a generalized NHPP that uses a bell curve for fault detection rate. The bell\
    \ curve handles variations due to fluctuations in debugging, learning, and fault\
    \ removal efficiency. The results show that the proposed model fits failure data\
