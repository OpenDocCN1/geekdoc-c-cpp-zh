    > The Gaussian distribution allows us to see the two sides of truth: tendency
    and dispersion and facilitates fair judgment.


    For example, from remembered mean value of effort variance = 5% and range = 30%,
    we can construct the Gaussian distribution shown in Figure 13.4. The central tendency,
    pictorially seen, reveals the problem. If planning and estimation practices were
    perfect, the central tendency would be zero. Nonzero tendency is a remark on project
