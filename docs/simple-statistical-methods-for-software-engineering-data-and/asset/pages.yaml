    # Dispersion as Deviation from Center


    The range of data is a fairly good measure of dispersion. However, if we look
    at the scatter of data around a center, we will obtain a better and more complete
    picture. To visualize this, let us look at hits from a field gun on an enemy target.
    The hits are scattered around the target. If the gun is biased, the hits may be
    scattered around'
