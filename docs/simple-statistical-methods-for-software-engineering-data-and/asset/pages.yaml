- pgno: 157
  md: '# Adding More Agile Metrics


    The present metric system is a victim of poor implementation. It is overdesigned
    but underutilized. Agile metrics are simple and easy to implement; they have to
    be simple to honor the very spirit of agile methodology.


    Hartmann and Dymond [1] list 10 attributes of a typical agile metric system as
    follows:


    +   1. It affirms and reinforces lean and agile principles.

    +   2. It follows trends, not numbers. Measure “one level up” to ensure you measure
    aggregated information, not suboptimized parts of a whole.

    +   3. It belongs to a small set of metrics and diagnostics. A “just enough” metrics
    approach is recommended: too much information can obscure important trends.

    +   4. It measures outcome, not output.

    +   5. It is easy to collect.

    +   6. It reveals rather than conceals.

    +   7. It provides fuel for meaningful conversation.

    +   8. It provides feedback on a frequent and regular basis.

    +   9. It measures value.

    +   10. It encourages “good enough” quality.


    It may be noted that the above attributes can be applied to metrics in conventional
    life cycles too.


    Hartmann and Dymond conclude that the key agile metric should be business value,
    and they note,


    > Agile methods encourage businesses to be accountable for the investment in software
    development efforts. In the same spirit, the key metrics we use should allow us
    to measure this accountability. Metrics should help validate businesses that make
    smart software investments and teams that deliver business value quickly.


    ROI begins with the first release of feature. Value must be measured. Delivering
    value early is the hallmark of agile projects.


    However, in extreme programming, project teams have added metrics that are not
    so simple. Teams use the following metrics where refactoring takes place at the
    end of each iteration source code:


    +   1. Coupling

    +   2. Cyclomatic complexity'
