    \ of wisdom have helped us to connect our book with the evolution of science,\
    \ knowledge and engineering. Eventhough there are many books on statistics, there\
    \ are few dedicated to the application of statistical methods to software engineering.\
    \ Pure textbooks provide scholarly treatment, whereas practitioners need basic\
    \ understanding and application knowledge. Very few statistical books provide\
    \ application knowledge to software engineers. We have been working toward bridging\
    \ this gap for about two decades and have come out with the current book.\n\n\
    Statistical methods are often discussed in the context of six sigma, Capability\
    \ Maturity Model Integrated (CMMI), establishing capability baselines, and constructing\
    \ process performance models. Driven by CMMI auditors, such practices have become\
    \ rituals that rely heavily on automated statistical packages, which are rarely\
    \ well understood. We have been promoting excel-based solution to statistics and\
    \ have presented practical solutions, such as those achieved in this book.\n\n\
    > \"Statistics is the grammar of science.\"\n> \n> Karl Pearson\n\nWe also realize\
    \ that sophisticated statistics is not the ideal approach to solve problems. Simpler\
    \ techniques provide easy solutions that connect with the intuition of problem\
    \ solvers. Although sophisticated techniques sound impressive but merely academic,\
    \ simpler techniques are flexible and can easily penetrate to the root of the\
    \ problem. In this book, we have consciously selected simpler tools. We have also\
    \ simplified several standard techniques.\n\nThe techniques presented in this\
    \ book appear to us as a minimum set of intellectual tools for software engineers\
    \ and managers. True software engineering"
