  md: 'mere deviations from the ideal. Variations came from “constant causes” and
    some extreme perturbations came from “accidental causes.” (We are reminded of
    Shewhart’s common causes and special causes, a profound idea that would appear
    in 1920, a hundred or so years later, in his statistical process control.)


    Quetelet was convinced that “there is a general law which dominates our universe.”
    He presented a most important and extensive role for the average man. The physician
    could thus determine the most useful remedies and the action to be taken, in both
