    # Application Notes


    A primary application of the ideas we have seen in this chapter is in presenting
    data summaries. The design of summary tables deserves attention.


    First, presenting too many metrics in a single table must be avoided. Beyond seven
    metrics, the brain cannot process parallel data. Data summary tables with 40 metrics
    go overhead. Such data can be grouped under the five categories: business, project,
    process, subprocess, and product. If such a categorization is not favored, the
    summary table can have any of the following categories:


    +   Long term–short term

    +   Business–process

    +   Project–process

    +   Project–process–product


    What is important is that the table must be portioned into tiles; the parts may
    be presented separately connected by digital links. This way, different stakeholders
    may read different tables. Whoever picks up a table will find the data relevant
    and hence interesting.


    Next, for every metric, the five-point summary may be presented instead of the
    usual mean and sigma for one good reason: most engineering data are nonnormal.
    The five-point summary is robust and can handle both normal and nonnormal data.


    # Concluding Remarks


    It is important to realize the context of data to make both data collection and
    interpretation effective enough.'
