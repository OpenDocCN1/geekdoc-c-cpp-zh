- pgno: 204
  md: 'contained the Poisson distribution, which predicts the pattern in which random
    events of very low probability occur in the course of a very large number of trials.
    Poisson distribution is called the *law of rare events*.


    A biographical note on the inventor of this distribution, Poisson, may be seen
    in Box 12.3. Poisson seems to have touched upon a universal law. Poisson distribution
    and its extensions are actively pursued by researchers in many domains, including
    software engineering.


    # A Historic Poisson Analysis: Deaths of Prussian Cavalrymen


    In the historic data analysis done by von Bortkiewicz in 1898, deaths of Prussian
    cavalrymen due to horse kicks were fitted to a Poisson distribution. We can look
    at the data made available in *Statistics: The Poisson Distribution* [2], where
    the mean value of death per corps is given as *p* = 0.5434. Substituting this
    value in Equation 12.5 and treating *x* as the number of deaths, we can construct
    a Poisson distribution as follows:


    ```

    $$P(x,0.5434)=\frac{e^{-0.5434}\,0.5434^{x}}{x!}\tag{12.6}$$

    ```


    where *x* is number of deaths in a single corps.


    Figure 12.7 shows a plot of this Poisson distribution.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_204_0.png)


    Figure 12.7 Poisson distribution of Prussian cavalrymen deaths.'
