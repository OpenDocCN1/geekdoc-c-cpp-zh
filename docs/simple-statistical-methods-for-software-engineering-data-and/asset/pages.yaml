    Skewness is a measure of asymmetry in data. Positive skewness indicates a distribution
    with an asymmetric tail extending toward more positive values. Negative skewness
    indicates a distribution with an asymmetric tail extending toward more negative
    values (see Chapter 3 for the formula).


