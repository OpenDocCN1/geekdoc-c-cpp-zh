    # Gumbel Maximum: Complexity Analysis


    Data maxima follow the Gumbel maximum PDF defined as follows:


    F(x) = 1/β e^(-(x-μ)/β) e^(-e^(-(x-μ)/β))  (20.3)


    where μ is the location parameter and β is the scale parameter.


    Let us consider the case of extremely large complexity in some modules. The specification
    limit on cyclomatic complexity is 70. Higher values are dubbed outliers and examined
    one by one. We wish to use these outliers collectively as a group by constructing
    an exclusive PDF for these outliers. We separate these data from the database
    and for a special group of outliers and obtain the following statistics:


    +   Data mean = 219.2

    +   Data mode = 169


    Thus, the model parameters, obtained by applying moments equations, are as follows:


    +   Location = 169

    +   Scale = 87


    Using these parameters, the PDF is constructed and shown in Figure 20.3.


    It shows the distribution of complexity maxima in software development. This model
    can be used to manage technical risks in development projects.'
