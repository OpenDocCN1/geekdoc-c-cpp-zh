- pgno: 301
  md: 'With the inclusion of a location parameter μ, the gamma PDF equation experiences
    a change. The change is realized by substituting in Equation 18.1 (x − μ) in the
    place of x. After the inclusion of μ, the new equation of the shifted gamma PDF
    is given as follows:


    ```

    G(x)= 1/(β^α Γ(α)) (x−μ)^{α−1} e^{−(x−μ)/β}    x > μ; α, β > 0    (18.4)

    ```


    # BOX 18.2 INVENTOR OF GAMMA DISTRIBUTION


    Leonhard Euler (1707–1783), one of the greatest mathematicians of all time, is
    credited with the discovery of gamma function. Some say his teacher, Bernoulli,
    another mathematician, invented it first.


    Euler was born in Switzerland, in the town of Basel. At 13 years of age, Euler
    was already attending lectures at the local university. In 1723, he gained his
    master’s degree, with a dissertation comparing the natural philosophy systems
    of Newton and Descartes. He wrote two articles on reverse trajectory, which were
    highly valued by his teacher Bernoulli.


    At this time, a new center of science had appeared in Europe—the Petersburg Academy
    of Sciences. As Russia had few scientists of its own, many foreigners were invited
    to work at this center, among them Euler. On May 24, 1727, Euler arrived in Petersburg.


    Euler took a very active role in the observation of the movement of Venus across
    the face of the sun, although at this time he was nearly blind. He had already
    lost one eye in the course of an experiment on light diffraction in 1738, and
    an eye disease and botched operation in 1771 led to an almost total loss of vision.


    However, this did not stop Euler’s creative output. Until his death in 1783, the
    academy was presented with more than 500 of his works. The academy continued to
    publish them for another half century after the death of the great scientist.
    To this day, his theories are studied and taught, and his incredibly diverse works
    make him one of the founding fathers of modern science.


    # Generating Clarification Time Scenarios with Gamma PDF Built from Minimal Data


    The three-parameter gamma function in Equation 18.4 retains the properties of
    the two-parameter version. Equations 18.2 and 18.3 are still relevant.


    Let us try to use the gamma PDF defined in Equation 18.4 to model clarification
    time by the customer for three possible scenarios in a maintenance project.'
