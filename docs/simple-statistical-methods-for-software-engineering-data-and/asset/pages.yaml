    could be 24 hours for express service, 48 hours for next priority tasks, a week
    for regular tasks, a fortnight for odd tasks, and so on. There are different performance
    slabs for different task categories. If delivery had been made within the stipulated
    time, the service-level agreement (SLA) is complied; if not, it is a noncompliance
    and a breach of contract. The customer virtually controls the maintenance team
    by closely monitoring the SLAs. The criteria are often designed to minimize risk
    to the customer.


    The SLA compliance metric is based on counts, defined as follows:


    ```

    SLA compliance = (Number of deliveries that met SLA / Total number of deliveries)
    × 100

    ```


    Customers sign different SLAs with the maintenance organization for each of the
    delivery attributes such as quality, response time, priority levels, and volume
    delivered per month. Every month, the percentage of the SLA compliance level is
    measured for each. Noncompliance may attract penalties, and hence these metrics
    are respected and sincerely tracked.'
