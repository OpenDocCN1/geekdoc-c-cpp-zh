    # Generalized Pareto Distribution


    Open source projects have a different DNA. They follow the Pareto distribution.


    Simmons and Dillon [4] note a Pareto distribution in the size of the number of
    developers participating in open source projects with most projects having only
    one developer and a much smaller percentage with larger, ongoing involvement.


    Kolassa et al. [5] have proposed a generalized Pareto distribution to define commit
    sizes in open source projects.


    The equation to the model is shown as follows:


    ```

    f(x) = 1/σ |1 + ξ (x - θ)/σ|^(-1/ξ)   for ξ ≠ 0   (16.6)

    ```


    where θ is the location parameter (controls how much the distribution is shifted),
    σ is the scale parameter (controls the dispersion of the distribution), and ξ
    is the shape parameter (controls the shape).


