- pgno: 87
  md: '# BOX 4.3 THE BOX OF THE BOX PLOT


    The box plot has a lean structure. It is remarkably simple and uncluttered. The
    earliest version of the box plot was a straight line. Tukey added the box. The
    box achieves its purpose by dominating the plot. This is an intended domination.
    The box has the median and contains 50% of central evidence. The first glance
    makes us recognize the box and other details are subdued; the box emerges as the
    primary message. This helps managers to grasp the essential behavior of processes
    sans the secondary details. Dispersion beyond the box is considered secondary.
    Outliers are tertiary. Moreover, the box is plain and unpopulated. It is just
    an outline drawing. For quick decisions regarding budgeting, the box is all we
    need to consider. For systematic process management, we consider the whiskers.
    For strategic risk management and problem solving, we consider the outliers. The
    structure of the box plot helps with this progression of management decisions.


    # CSAT Analysis across Attributes


    The chart provides a very easy comparison that we can quickly navigate through.
    Performances in ENGG and TIME have earned the lowest scores. The lower whisker
    in ENGG touches the floor and provides a red alert to the organization. COMM and
    PRICE have earned the best scores, assuring customer delight from within the “box”
    area. If we take the target as 4, then RESP and QUAL still need improvement. The
    box plots provided very useful information graphically.


    # Review Questions


    +   1. What are the elements in a box plot?

    +   2. What are fences?

    +   3. How is the length of a whisker calculated?

    +   4. How are the hinges calculated?

    +   5. How robust are the rules used in detecting outliers in the box plot?


    # Exercises


    +   1. Draw a box plot using the data provided in Data 4.1, using the macros provided
    in Refs. [4] and [5], and interpret the same. You can also download free Excel
    box plot plotters from the web.

    +   2. Draw a box plot of lines of code developed by yourself or various objects.
    See how the box plot helps in statistical thinking.'
  merge: -1
  img_proc: true
