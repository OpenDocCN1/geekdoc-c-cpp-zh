- pgno: 327
  md: '# Chapter 20


    # Gumbel Distribution

    for Extreme Values


    # A Science of Outliers


    Convention has it that outliers must be marked, studied, and analyzed for root
    causes. In process management, outliers represent high cost, poor quality, and
    rework. The temptation seems to be to attach a stigma to outliers and build probability
    density functions (PDFs) for the remaining data. A scientific way would be to
    treat outliers statistically and even predict their occurrence. These outliers
    can be called *extreme values* and be subjected to treatment by the science of
    *extreme value theory*, invented by Fréchet (see Box 20.1). The behavior of extremes
    can be modeled by extreme value distributions.


    Cláudia Neves et al. [1] summarized the characteristics of extreme value distributions
    as follows:


    > A distribution function that belongs to the Fréchet domain of attraction is
    called a heavy-tailed distribution, the Weibull domain encloses light-tailed distributions
    with finite right endpoint and the particularly interesting case of the Gumbel
    domain embraces a great variety of tail distribution functions ranging from light
    to moderately heavy, whether detaining finite right endpoint or not.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# BOX 20.1 FIVE PEOPLE AND EXTREME VALUE THEORY


    Five people have contributed to extreme value theory. Fréchet proposed an extreme
    value distribution in 1927. Fisher and Tippet refined it in 1928 and proposed
    three types of extreme value distributions. In 1948, Gnedenko formulated the Fisher–Tippett–Gnedenko
    theory (generalized extreme value theory). Gumbel worked on type I extreme value
    distribution (called the Gumbel distribution after him) and provided simpler derivation
    and proof in 1958.


    Fréchet—Maurice René Fréchet (1878–1973), a French mathematician who made several
    important contributions to the field of statistics and probability.


    Fisher—Ronald Aylmer Fisher (1890–1962), an English statistician who created the
    foundations for modern statistical science.


    Gumbel—Emil Julius Gumbel (1891–1966), a German mathematician and political writer
    who derived and analyzed the probability distribution that is now known as the
    Gumbel distribution in his honor.


    Tippett—Leonard Henry Caleb Tippett (1902–1985), an English statistician who pioneered
    extreme value theory along with R. A. Fisher and Emil Gumbel.


    Gnedenko—Boris Vladimirovich Gnedenko (1912–1995), a Soviet mathematician who
    is a leading member of the Russian school of probability theory and statistics.


    Of the three types of extreme value distributions, the more popular one is the
    Gumbel distribution (see Box 20.4). There are different notations corresponding
    to the application of the Gumbel distribution. We follow the notation used in
    the NIST Handbook, where this is known as type I extreme value distribution [2].


    The presence of extremes in process data may be seen in the box plot presentation
    of data (see Chapter 4). Beyond the threshold called fences, we can see extreme
    values on either end of typical box plots. On the right, we have extremes known
    as “maxima,” and on the left, we have extremes known as “minima.” Both the extremes
    can have a significant effect on the process. Gumbel distributions can be used
    to model both the maxima and the minima.'
