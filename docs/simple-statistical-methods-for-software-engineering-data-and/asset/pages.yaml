  md: '# Maximum


    This is the largest value in the sample. Large values of effort variance indicate
    a special problem and are worth scrutiny. The questions here are “How bad is the
    worst value? Is it beyond practical limits?” This statistic is a simple recognition
    of a serious characteristic of data.


    # Minimum


    This is the other end of data values. The question is similar: “How low is the
    minimum value?” In effort variance, the minimum value can have a negative sign,
    suggesting cost compression. Usually, cost compression is good news, but process
    managers get cautious when the value becomes deeply negative. The questions that
    bother them are as follows: Has there been some compromise? Will cost saving have
    a boomerang effect?


    # Range


    Range is obtained by subtracting the minimum from the maximum. Range represents
    process variation, in an empirical sense. This statistic is widely used in process
    control. It is simple to compute and yet sensitive enough to alert if processes
    vary too much.


    Range is just the difference between the largest and the smallest values:


    Range = maximum – minimum


    # Mode


    Mode is the most often repeated value. It is an expression of central tendency.


    # Median


    Median is the value that divides data—organized into an ordered array—into two
    equal halves. This is another expression of central tendency.


    In simple words, median is the middle value in the list of numbers. A list should
    be arranged in an ascending order first to calculate the median value. Then the
    formula is stated as follows:


    If the total number of numbers (n) is an odd number, then the formula is given
    as follows


    Median = ((n + 1) / 2)th term'
