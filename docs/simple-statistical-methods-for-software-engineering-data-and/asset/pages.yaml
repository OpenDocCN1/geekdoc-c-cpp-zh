    # Sigma Level: Safety Margin


    As the story goes, in 1986 Bill Smith, the father of Six Sigma, showed a bell
    curve to the CEO Bob Galvin and proved that there is a finite probability that
    processes cross the limits and explained why defects reach customers despite multiple
    testing. Six Sigma began as a reliability model. Jack Welch made Six Sigma a discipline
    in GE and later opined, “the mean is fine it is the standard deviation that spells
    trouble.”'
