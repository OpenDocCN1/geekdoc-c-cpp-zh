    # BOX 16.3 THE 80/20 LAWS


    The 80/20 principle—that 80% of result flows from just 20% of the causes—is the
    one true principle of highly effective people. It has become a management law.
    Its effect on all facets of life may be seen from the following compilation:


    Pareto’s historic observations:


    +   - 80% of Italy’s land was owned by 20% of the population

    +   - 20% of the pea pods in his garden contain 80% of the peas


