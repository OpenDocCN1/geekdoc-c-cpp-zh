    # Duane’s Model


    J. T. Duane has developed a reliability growth model based on the Pareto distribution
    (power law), which has long been in use National Institute of Standards and Technology
    (NIST).


    This model implies that the reliability during any specific interval can be represented
    by the negative exponential model:


    λ_C = k t_T^{-α}  (16.7)


    where C is the average estimate of cumulative failure rate, t_T is the total accumulated
    operating hours, k is the constant representing cumulative failure rate at t_T
    = 1, and α is the improvement rate constant.


    # Tailing a Body


    In a novel attempt, Herraiz et al. [6] fit a Pareto tail to a log-normal body
    with object-oriented software metrics. The Pareto distribution, known for its
    prominent tail, fits the larger values better while the smaller values follow
    the log-normal distribution. Herraiz et al. [6] called the mixture model double
    Pareto distribution. Not all OO metrics need a double Pareto. Two metrics, the
    number of children and the lack of cohesion in methods, are better described using
    a power law for the entire range of values. Three metrics, weighted methods per
    class, coupling between object classes, and requests for a class, are better described
    by a double Pareto.


    In another study, Herraiz et al. [7] have studied a large quantity of open source
    code, approximately 700,000 C files. In particular, the following metrics were
    studied: source lines of code, lines of code, number of blank lines, number of
    comment lines, number of comments, number of C functions, McCabe’s cyclomatic
    complexity, number of function returns, and Halstead metrics. All the metrics
    were found to follow a double Pareto distribution.


    Pareto is the simplest distribution available. It is also the flexible and easy
    to adapt. The 80/20 law derived from Pareto principle are used extensively in
    business'
