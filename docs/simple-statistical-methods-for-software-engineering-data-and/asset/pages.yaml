  md: 'The entire Six Sigma methodology depends on the normal distribution. Assuming
    normal distribution, we can calculate sigma level of safety margin to the customer
    using the following definition:


    ```

    Sigma level = (USL − mean)/σ, or

    = (Mean − LSL)/σ

    Whichever is smaller

    (13.7)

    ```


    The sigma level can be converted into risk using ideas developed early in this
    chapter. Risk is expressed in parts per million or defects per million opportunities
    (DPMO). For example, we can consider two-tailed problems and find tail areas for
    different distances of tails from the mean: 1, 2, 3, 4, 5, and 6 sigmas as shown
    in Table 13.6. The distances are known as sigma levels. The tail areas are known
    as defect levels. In Table 13.6, defect levels are presented first in fractions,
    then in percentage, and finally in PPM or DPMO in the last column.


