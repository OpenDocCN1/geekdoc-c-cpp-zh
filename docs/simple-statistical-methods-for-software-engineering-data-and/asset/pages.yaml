- pgno: 194
  md: '# BOX 11.5 THE THEORY THAT WOULD NOT DIE


    Sharon McGrayne’s book, *The Theory That Would Not Die: How Bayes’ Rule Cracked
    the Enigma Code, Hunted Down Russian Submarines, and Emerged Triumphant from Two
    Centuries of Controversy*, presents a history of Bayes’ theorem. The following
    is an excerpt from the review of this book in http://www.lesswrong.com.


    Bayes’ system was Initial Belief + New Data → Improved Belief. Mathematicians
    were horrified to see something as whimsical as a guess play a role in rigorous
    mathematics; this problem of priors was insurmountable.


    Pierre-Simon Laplace, a brilliant young mathematician, and the world’s first Bayesian,
    came to believe that probability theory held the key, and he independently rediscovered
    Bayes’ mechanism.


    Joseph Bertrand was convinced that Bayes’ theorem was the only way for artillery
    officers to correctly deal with a host of uncertainties about the enemies’ location,
    air density, wind direction, and more.


    Geologist Harold Jeffreys made Bayes’ theorem useful for scientists, proposing
    it as an alternative to Fisher’s p-values and significance tests, which depended
    on “imaginary repetitions.”


    For decades, Fisher and Jeffreys were the world’s two greatest statisticians,
    traded blows over probability theory in scientific journals and in public. Fisher
    was louder and bolder, and frequentism was easier to use than Bayesianism. This
    marked a short lived decline of the Bayesian paradigm.


    In 1983, the US Air Force sponsored a review of NASA’s estimates of the probability
    of shuttle failure. NASA’s estimate was 1 in 100,000. The contractor used Bayes
    and estimated the odds of rocket booster failure at 1 in 35. In 1986, Challenger
    exploded. Frequentist statistics worked okay when one hypothesis was a special
    case of another, but when hypotheses were competing and abrupt changes were in
    the data, frequentism did not work.


    One challenge had always been that Bayesian statistical operations were harder
    to calculate, and computers were still quite slow. This changed in the 1990s,
    when computers became much faster and cheaper than before.


    # Review Questions


    +   1. Give an example of the application of binomial distribution.

    +   2. Give an example of the application of the hypergeometric distribution.

    +   3. Give an example of the application of the negative binomial distribution.

    +   4. Give an example of the application of the geometric distribution.

    +   5. What is Bayes theorem?'
