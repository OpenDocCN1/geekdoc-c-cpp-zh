    # BOX 18.3 GAMMA MODELING OF RAINFALL


    Gamma distribution is often used in rainfall modeling.


    In water resource projects, it is necessary to collect all the information related
    to the region and then to analyze the collected data. A frequency analysis of
    the rainfall data is the most commonly applied method. The hydrologist searches
    for a mathematical equation characterizing the available data in hand, to fill
    the gaps in the observations and to extrapolate it to a longer period.


    Typically, two-parameter gamma distributions are fitted to rainfall data. The
    shape and scale parameters of the gamma distribution, α and β, are determined
    from the daily rainfall data of the gauging station.'
