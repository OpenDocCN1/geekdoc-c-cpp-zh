    \ observational data can be used to estimate the probability of events in real-world\
    \ situations. This is what is now known as the law of large numbers. Interestingly,\
    \ when he wrote the book, he named this idea the “Golden theorem.”\n\nBernoulli\
    \ had received several awards and/or honors. One of the honors given to him was\
