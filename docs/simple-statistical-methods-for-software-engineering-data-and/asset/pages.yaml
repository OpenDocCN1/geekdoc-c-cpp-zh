    # BOX 1.2 POWER OF TABLE


    Managing software development is a complex task. A manager applied data-driven
    management in a novel manner to make his task easy. He identified 12 milestones
    and selected the data he needed to collect for each milestone for effective management.
    That led him to design a data table with 12 rows and 10 columns. The data columns
    included dates, size defects, effort, and pertinent feature numbers. The milestones
    coincided with deliveries, and the data table came to be called the milestone
    table. With this simple table, he realized he could manage a project almost of
    any size and duration. He also found extra bandwidth to manage many more projects
    simultaneously. His teams never missed milestones because he took milestone level
    data seriously and reviewed the results objectively and with precision. His projects
    were often delivered on time, with quality and within budget.'
