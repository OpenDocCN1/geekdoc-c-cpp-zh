  md: 'Mean = (a + b + c) / 3


    a = 15 History

    b = 30 History

    Mean = 20 (recent benchmark)

    Therefore, c = (20 × 3) − 15 − 30

    = 15


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_256_0.png)


    # Figure 15.3 Productivity model.


    Here is an example of the equation application. Let us take the case of a project
    manager trying to give input to a simulator. Let us say he is required to define
    a PDF for productivity. From his own experience, he recalls that function point
    (FP)/person-month had varied from 15 to 30. He has also obtained a recent benchmark
    report claiming that the mean value of productivity is 20 FP/person-month. Following
    the Bayesian spirit, we can combine both these data, first a historic probability
    and then a recent piece of evidence. Substituting these three values in Equation
    15.3, we derive the following:


    a = 15

    b = 30

    Mean = 20

    Therefore, c = (20 × 3) − 15 − 30 = 15


    This is a right-angled triangle skewed to the right, as shown in Figure 15.3.
    This model can now be used in Monte Carlo simulation as an input.


    # Median


    If we are lucky enough to obtain the median value for a skewed result, then we
    can apply the formulas in Equations 15.4 and 15.5, as follows:


    Median = a + √[(b − a)(c − a)] / √2    when c ≥ (a + b)/2    (15.4)'
