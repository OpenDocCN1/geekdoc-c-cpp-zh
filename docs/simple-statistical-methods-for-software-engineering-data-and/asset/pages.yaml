  md: '# Chapter 12


    # Law of Rare Events


    Science pursues the study of rare events with fervor. The probability of rare
    events is a skewed one. In this chapter, we discuss one continuous distribution
    and one discrete distribution to represent rare events.


    # BOX 12.1 AGE DETERMINATION—CARBON DATING


    In the mid-1940s, Willard Libby, then at the University of Chicago, realized that
    the decay of carbon 14 might lead to a method of dating organic matter. Wood samples
    taken from the tombs of two Egyptian kings, Zoser and Sneferu, were dated by radiocarbon
    measurement to an average of 2800 BC plus or minus 250 years. These measurements,
    published in Science in 1949, launched the “radiocarbon revolution” in archaeology
    and soon led to dramatic changes in scholarly chronologies. In 1960, Libby was
    awarded the Nobel Prize in chemistry for this work. The equation governing the
    decay of a radioactive isotope is


    N = N₀ e^{-λt}


    where N₀ is the number of atoms of the isotope at time t = 0, N is the number
    of atoms left after time t, and λ is a constant that depends on the particular
    isotope. It is an exponential decay. Using this equation, the age of the sample
    can be determined. (http://en.wikipedia.org/wiki/Radiocarbon_dating)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Exponential Distribution


    It is common knowledge in science that decay is defined as an exponential form,
    a simple and beautiful mathematical structure, as given in the following equation:


    f(t) = e^{-λt} (12.1)


    where λ is a constant describing the rate of decay and t is the time variable.

    Nobel laureate Ernest Rutherford used this equation to describe the radioactive
    decay of thorium in 1907 [1].


    It is the basis for the Nobel Prize in Chemistry he was awarded in 1908 "for his
    investigations into the disintegration of the elements, and the chemistry of radioactive
    substances."


    If we use the Geiger counter and counted the radiated particles, the data will
    fit a discrete Poisson distribution. If we measure loss of weight of the parent
    or the interarrival time of particles, the data will fit a continuous Exponential
    distribution.

    When we fit a curve to Rutherford data, we will obtain the following equation:


    y = 144.03e^{-0.172x} (12.2)

    R² = 0.9991


    Figure 12.1 shows the Rutherford data and the exponential plot. The exponential
    form fits like a glove to the decay data. Rutherford also defined a parameter
    called half-life, the time taken for the parent matter to lose half its weight.
    On the exponential graph, half-life represents the median. The half-life point
    is marked in Figure 12.2 (4.03 days), where thorium activity becomes half of the
    start value. The start value is 144, and the half value is 72. The time required
    for this loss of activity is 4.03 days.


    The exponential distribution is memoryless.


    This can be demonstrated using Figure 12.2. For thorium activity to drop from
    72 to a half of 72, that is, 36, it will take another 4.03 days. This is exactly
    the time taken for thorium activity to drop from 144 to 72. The second drop takes
    the same time as the first drop because the exponential curve has no memory of
    the first drop. Each time, decay starts afresh with a new account and a fresh
    experience of the same half-life. Half-life is the property of the decaying matter
    represented in the exponential form. For thorium activity, it is 4.03 days.


    The exponential nature of radioactive decay is exploited in carbon dating (see
    Box 12.1).'
