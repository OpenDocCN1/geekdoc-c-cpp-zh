  md: '# BOX 8.4 SMOKE TEST DEFECT DENSITY


    Smoke tests are very useful; they shorten the testing cycle. They ensure that
    the code is working and the build is stable. They should be capable of exposing
    major problems. It is instructive to calculate defect density for each component
    with smoke test defects. Smoke test defect density is an indicator of risks in
    the components and an early predictor of problems. The real power of metrics is
    realized when metrics are used to predict. The smoke test is simple, fast, and
    cheap, but smoke test defect density is priceless.


    Smoke tests must be identified during requirements.


    For example, safety requirements can be smoke tested very early in the project.


    The smoke test sets the minimum entry criteria for starting test execution.


    # Defect Classification


    During defect capturing, we can register the different attributes of defects:
    defect type, defect severity, phase injected, trigger, cause, and complexity.
    Then we can classify defects according to each of the attributes and derive broad
    perspectives about defect population. Classification is also a measurement. The
    defect attribute analysis report is a valuable input to the development team to
    support defect prevention.


    # Testing Size: Test Case Point


    The test case point (TCP) can be used as an estimator for the entire software
    development project also.


    Testing size can be measured in terms of TCP. Each test case is assigned a weight
    based on test case complexity and test case type. Test case complexity depends
