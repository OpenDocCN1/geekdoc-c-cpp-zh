  md: 'theorem, but it became generally known as Bernoulli’s theorem. This theorem
    was applied to predict how much one would expect to win playing various games
    of chance.


    From sufficient data from real-life events, we can arrive at a probability of
    success (p) and trust that the future can be predicted based on this.


    Prediction means estimation of two values: mean and variance (which denote central
    tendency and dispersion).


    In this chapter, we consider four distributions to describe four different ways
    of describing the dispersion pattern.


    +   1. Binomial distribution


    The probability of getting exactly k successes in n trials is given by the following
    binomial expression:


    P(X = k) = C_k^n p^k (1 − p)^{n−k}  (11.1)


    where n is the number of trials, p is the probability of success (same for each
    trial), and k is the number of successes observed in n trials, calculated as follows:


    Mean = n p  (11.2)


    Variance = n p (1 − p)  (11.3)


    Equation 11.1 is a paradigm for a wide range of contexts. In service management,
    success is replaced by arrival, and the Bernoulli process is called arrival-type
    process. In software development processes, we prefer to use the term success.
    The coefficient C is a binomial coefficient, hence the name binomial distribution.


    Software development processes may consist of two components:


    +   a. An inherent Bernoulli component that complies with the law of large numbers

    +   b. Influences from spurious noise factors


    Bernoulli distribution is used in statistical process control. The spurious noise
    factors must be identified, analyzed, and eliminated. For example, in service-level
    agreement (SLA) compliance data, one may find both these components. If the process
    is restricted to the Bernoulli type, the process is said to be under statistical
    control. (Shewhart called this variation due to “common causes” and ascribed spurious
    influences to special causes.)


    Equation 11.1 is used in the quality control of discrete events.'
  merge: -1
  img_proc: true
