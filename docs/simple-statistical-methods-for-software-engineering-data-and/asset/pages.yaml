    \ to the next layer of abstraction and kept invisible, for the present, to the\
    \ manager.\n\n# BOX 15.1 THREE POINTS FOR GUIDANCE\n\nIt is good to know that\
    \ as a general navigation concept, guidance is available from three points of\
    \ reference. If you have three, you get your bearing. Here is a related quote:\n\
    \n> Sailors and seafarers find their bearings at sea by means of natural points\
    \ of reference located along the coast. These points, for example church spires,\
    \ hills, water-towers or lighthouses that generally stand out from the rest of\
    \ the coastline, are called amers [seamarks or landmarks]. All you have to do\
    \ is identify three such landmarks in complementary directions so as to be able\
    \ to construct a triangle which inevitably contains your ship. This triangle drawn\
    \ on the navigation map is called the “triangle of uncertainty.”\n> \n> Cécile\
    \ Le Prado\n\nLikewise, in software development, project three-point estimates\
    \ provide great guidance. Managers can navigate through the project life cycle\
    \ with this help.\n\n# Mental Model for Estimation\n\nThe triangular distribution\
    \ is both bounded and peaked. Hence, it carries the advantages of being bounded\
    \ like the uniform distribution and has the additional advantage of having a strong\
    \ central tendency. The triangular distribution is a simplified model of process\
    \ results and a pragmatic substitute for normal and other distributions. The project\
    \ management variables of time, cost, and performance can be elegantly modeled\
    \ using the triangular distribution.\n\nA plot of the triangle may be seen in\
    \ Figure 15.2. The bottom edges a and b represent optimistic and pessimistic values.\
    \ The middle edge c represents the most likely value. This is the estimation triangle\
