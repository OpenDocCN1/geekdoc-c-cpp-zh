- pgno: 304
  md: 'Different techniques are used in estimating the parameters: the graphical method,
    the least squares method, the method of moments, and the maximum likelihood method.


    In the analysis of 30 years of rainfall data, it is seen that α varies between
    0.341 and 0.569 and β varies between 6.892 and 19.94 in a year. These gamma distribution
    parameters summarize the pattern of rain fall (based on Aksoy [3]).


    # Scenario Analysis


    The gamma model enables us to evaluate three scenarios, three kinds of responses,
    from the customer. The first response has a shorter mode of 7 days but a higher
    risk of 8.68%. This could happen if the customer is requested to provide earlier
    response as a top priority.


    The second response has a mode of 14 days but a lower risk of 5.4%. Judging by
    the apparent central tendency, mode, the customer seems to have slowed down, but
    the overall risk has reduced in a counterintuitive way.


    In the third scenario, perhaps the customer is in his element, the mode is delayed
    further and reached a value of 17 days while the overall risk has come down further
    to a low value of 3.03%.


    The tricky balance between demonstrated mode and real risk is a lesson we learn
    from this study.


    Like in the case of customer clarification time in maintenance projects, gamma
    models can be built for internal clarification time taken by developers to respond
    to queries from testers in during software development. Gamma models can also
    be built for requirements elicitation time in software development. In all these
    cases, the gamma lesson can be applied:


    > Early closure is a myth; closure needs a natural time for understanding, analysis,
    training, and response.


    # BOX 18.4 PACKING HISTORY INTO A GAMMA PDF WITH MINIMAL DATA


    Rainfall data can be huge, especially when one wants to study history. Presenting
    descriptive statistics such as maximum, minimum, mean, median, and variance is
    still not adequate. Climatologists prefer to fit mathematical models such as gamma
    distribution to represent the overall pattern. Descriptive statistics and more
    are inherent in the equation. All that is required is just two parameters—the
    shape and scale parameters—for a season and location.'
  merge: -1
