- pgno: 128
  md: 'SLA metrics enable teams to perform within the limits set. They do not measure
    the exact performance but only register whether the SLA is met or not. For example,
    while providing a work around governed by a 48-hour SLA criterion, the agent does
    not report the actual time. Even if the agent completes the job within 12 hours,
    delivery will be officially logged only at the 48th hour because the SLA says
    so. Twelve hours is unaccounted for. This is where Parkinson’s law plays a role:


    > Work expands to fill the time available.


    There is no motivation to do your best, but to do just so much, the bare minimum,
    merely to avoid penalty. Under SLA, we never know the true capabilities of teams.
    SLA compliance is a business metric in its strict sense.


    # Percentage of On-Time Delivery


    Of all the service attributes, time is the most crucial. A special metric is constructed
    to track the % of deliveries made on time. The on-time delivery (OTD) metric elicits
    respect from the maintenance team because of its inherent business context.


    This metric is very different from schedule variance (SV), which is a process
    metric and measures delay. As a process metric, even the magnitude of delay is
    captured as information. In OTD, the magnitude of delay is not captured. ITD is
    a discrete metric, whereas SV is a continuous metric. OTD captures partial information,
    whereas SV captures complete information. If we have not delivered on time, there
    is no consolation we get in measuring the delay. Even if the delay is small, no
    mercy is shown. The delivery is said to have failed. OTD belongs to a pass/fail
    world of hard decisions.


    # Enhancement Size


    The enhancement size metric helps in understanding the enhanced job better, besides
    serving as an estimator of cost, schedule, and quality. The Netherlands Software
    Metrics Users Association (NESMA) guideline “Function Point Analysis for Software
    Enhancement Version 2.2.1” defines enhancement as changes to the functionality
    of an information system, so-called adaptive maintenance. Enhancement involves
    three possible tasks:


    +   - Addition of functionality

    +   - Deletion of functionality

    +   - Change of functionality


    Addition of functionality is measured as added FP. The deletion of functionality
    is measured as 0.40 × deleted FP. Changed functionality is measured as impact
    factor × changed FP; the impact factor could take values from 0 to 1.


    The total is called the enhancement size, calculated as follows: enhancement function
    point (EFP) = added FP + 0.40 deleted FP + IF × changed FP.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'The previously mentioned equation shows the effect of deletion and change.
    To work with EFP is a good practice.


    As a proxy, LOC can also be used to judge enhancement size, though such a metric
    may not be available early in the enhancement life cycle and may not help in estimation.
    It is a pity to see that some projects do not include deleted size and changed
    size in their calculation.


    # BOX 7.2 BUG REPAIR TIME METRIC


    A maintenance manager desired to statistically establish the team’s bug repair
    capability and circulated a form to gather data. Senior engineers responded truthfully.
    The time spent on bug fixing was approximately 5–6 hours every day. A new recruit
    did not know how to respond and simply wrote “From 9 am till 6 pm, I spent time
    on bug fixing”, a statement too good to be true. The new recruit filled in what
    he thought as an appropriate value and not what he actually did. Bug repair time
    is a metric difficult to collect and even more difficult to validate.


    # Bug Complexity


    In a lower scale of measurement, bug complexity is measured as high, medium, or
    low by the maintenance engineer. This is a subjective measurement, but it works.


    Bug complexity can also be assessed on a continuous scale of 1–10, 10 being the
    most complex and 1 being the least. This is still subjective but has better granularity
    and has the extra advantage of being a numerical expression allowing further calculations.


    The objective treatment of bug size considers factors driving bug fixing effort.
    In one model by Andrea De Lucia [6], the number of tasks required and the application
    size are considered as the factors, and the linear regression equation relating
    these two to effort is constructed.


    The purpose of measuring bug complexity is to use the answer to predict bug fixing
    effort. That means the purpose is to build an estimation model. During analysis,
    such an estimate is made by the maintenance engineer, usually on the fly. Because
    analysis of the bug is made to fix the bug and not to build a model, exploring
    additional factors or increasing the depth of measurements is not suggested. Bug
    fixing is the main objective, model building a concomitant one. Moreover, we do
    not need extraordinary precision in estimating the bug fixing effort; we need
    a reasonably useful indicator.


    > Do not measure with a micrometer, mark with a chalk and cut with an axe.


    Murphy’s Law of Measurement'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'There are several equally simple ways of building an estimation model, including
    estimation by analogy and proxy-based estimation.


    Bug complexity is thus measured with consciously selected level of approximation.
    Later, this is going to affect the effort variance metric.


    # Effort Variance (EV)


    The formula for the effort variance metric remains the same as before:


    Effort variance = (Actual effort − Estimated effort) / Estimated effort × 100


    However, context and interpretation change in maintenance. This metric can be
    easily applied to enhancement projects where estimation is performed reasonably
    well, and the metric accordingly carries full meaning. It is beneficial to calculate
    effort variance twice, first with the initial estimate and later with a revised
    estimate after the change request is better understood. Even after the second
    estimate, the first estimate is still used as a budget control metric and the
    second as a process control metric.


    In bug fixing, effort variance can be calculated, if at all, only approximately
    because of approximations in estimation.


    # Schedule Variance (SV)


    The SV metric is treated like effort variance. Often, this is restricted to enhancement
    projects and not implemented in bug fixing tasks for two principal reasons: bug
    fixing is tightly controlled by SLAs, and the actual time of fixing is not available.
    Many times, bug fixing happens without estimation.


    # Quality


    # Quality of Enhancement


    Quality metric is calculated by dividing defect count by size and is expressed
    as defects per EFP. The quality of each release is monitored.


    # Quality of Bug Fix


    Sometimes, maintenance activities inadvertently harm quality; while fixing a bug,
    another could be introduced. In a typical bug-fixing environment, the support
    team does not know if a fixed bug opens in the field. If the same bug returns,
    people still may not detect this arrival because there is no traceability. Usage-triggered
    failures seldom come to the knowledge of the bug fixer. Bug arrival rate is not
    usually connected with quality because no one connects the dots. In such a fluid
    situation, unless quality metric is defined and collected, the quality of the
    software under maintenance cannot be known and improved. However, such a step
    needs to be negotiated with the customer'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'and be seen as a business need. If quality improves, maintenance cost will
    come down and the customer will benefit; but preventive maintenance has to be
    paid.


    # Productivity


    Productivity can be expressed in different ways. We suggest the EFP metric per
    man month. This metric eventually controls cost of maintenance; it helps in cost
    control.


    For measuring bug fixing productivity, the number of fixes per man month could
    be a basic metric.


    Measuring productivity is straightforward, but estimating productivity from contributing
    factors is not. If the metric includes estimation (which in a broader sense is
    a right expectation), then making use of models such as COCOMO may be included
    in our purview.


    # Time to Repair (TTR)


    This is a metric automatically collected by the bug-tracking tool. If one wants
    to improve the process of bug fixing, optimize it, and achieve excellence, subprocess
    metrics such as (1) time for replication, (2) time for analysis and design, and
    (3) time for implementation and testing can be collected. These subprocess metrics
    can be obtained by a quick survey. The bug tracker tool may not be equipped to
    collect subprocess metrics. Such surveys are performed occasionally to obtain
    information to improve the process. It is quite possible to collect metrics at
    more granular levels, measure analysis time separately, and design time separately
    if the cost is justified by expected gain. One can go a step further and apply
    lean techniques such as value stream map analysis, waiting time analysis, and
    idle time analysis. This metric will help to make the operation more efficient.


    Most certainly, one does not choose subprocess metric for regular data collection
    till the organization achieves high maturity and people volunteer to provide “personal”
    data. However, whatever be the level of granularity, bug repair time is one of
    the most effective and beautiful metrics in software engineering.


    # BOX 7.3 THE QUEUE


    Bugs form a queue, and customers wait for fixes. Customer satisfaction increases
    with response time and quality; both depend on human resources. When resource
    utilization is 100%, customer satisfaction is less than the best. When resource
    utilization is 90%, customer satisfaction improves. Moral of the story: some human
    reserves must be maintained to boost customer satisfaction, and there is a trade-off
    between the two. Maintenance organization keeps buffer resources and operates
    at less than 100% resources utilization because losing customer satisfaction is
    costlier.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Backlog Index


    This index measures the percentage of bugs in the backlog queue and represents
    an operational challenge in maintenance projects.


    # Bug Classification


    Classification is categorical data. To understand bugs better, they are classified
    in the bug tracker database. Typical fields are origin, cause, trigger, type,
    and solution. More can be added; ODC use may be considered. A periodical analysis
    of bug distribution among the various classifications is a good revelation of
    the problem.


    # Fix Quality


    Bug fixes could have problems. Bugs may reopen and cause rework and delay. The
    percentage of bug fixes that are performed right the first time can be measured.
    Rework can be measured for cost control.


    # Refactoring Metrics


    To improve quality of software and reduce maintenance costs by refactoring, we
    measure coupling and cyclamate complexity. Coupling measures the flow of data
    between modules. Cyclomatic complexity measures complexity in module structure.


    # Reliability


    Reliability of the product under maintenance can be computed from “failure intensity,”
    which is the number of bugs reported per month. From this metric, we can judge
    whether the product is recovering or crashing. A time series plot of cumulative
    bugs discovered called *reliability growth curve* can be used as a visual representation
    of reliability. The mean time between failure also can be computed.


    # Metric-Based Dashboards


    We would consider the top seven metrics for constructing a graphical dashboard
    for managing software maintenance. The other metric data may be presented in the
    form of a tabular record. The choice of metrics for graphical presentation is
    entirely up to the maintenance teams. Stark uses the following metrics [6]:


    +   1. Backlog

    +   2. Cycle time

    +   3. Reliability

    +   4. Cost per delivery'
  merge: -1
  img_proc: true
