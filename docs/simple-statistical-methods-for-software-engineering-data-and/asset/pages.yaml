  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_242_0.png)


    # Figure 13.12 Gaussian error curves.


    In reality, measurements do not get reported by a single value. We have either
    a range of values or a mean with associated standard deviation. We are discussing
    e/m measurements of electrons in coulombs per kilogram. The numbers presented
    here must be multiplied by 10¹¹.


    Todays’ accepted mean e/m is 1.758820088 with a standard deviation of 0.000000013.


    Earlier trials by J. J. Thomson gave results between 1.1 and 1.4 [10]. Norton
    et al. [11] have shown results with a mean value of 1.60 and a standard deviation
    value of 0.29. Earlier attempts by Millikan [12] result in a mean value of 2.82
    and a standard deviation of 0.55. These three results are shown as reconstructed
    Gaussian curves in Figure 13.9.


    The three bell curves indicate measurement reliabilities available in those experiments.
    The broader the curve, the less the measurement reliability. It may also be noted
    that broader curves have shorter peaks. In this context, one can intuitively feel
    that the height of the peak can also be considered as an indicator of measurement
    reliability. Narrower curves indicate “precision” in measurement (Figure 13.12).


