- pgno: 25
  md: "# Chapter 1\n\n# Data, Data Quality, and Descriptive Statistics\n\n# The Challenge\
    \ That Persists\n\nData refer to facts in contrast to opinion or conjecture. Data\
    \ are evidence, results, an expression of reality, and all such concrete realizations.\
    \ Data are the result of observation and measurement (of life in general) of processes\
    \ and products in software development. We use the term data to represent the\
    \ basic measures (raw) and derived (manipulated) metrics.\n\nData collection remains\
    \ a challenge even after fifty years of history. The challenge engulfs the two\
    \ types of data collection: the routine data collection and the special purpose\
    \ data collection, such as in improvement programs and experiments. Problems in\
    \ these areas are more in the first kind. A summary of the problems in data collection\
    \ was presented by Goethert and Siviy [1], who find that “inconsistent definitions\
    \ of measures, meaningless charts” are among the reasons for poor data.\n\nThey\
    \ complain that “the big picture is lost.” We miss the forest for the trees. They\
    \ also point fingers at a serious problem: the context of the indicators is not\
    \ understood. Not finding a context for data is becoming a major crisis.\n\n>\
    \ Data have no meaning apart from their context.\n> \n> Shewhart\n\nThe routine\
    \ data collection can be studied from five contexts, viewing from five management\
    \ layers: business management, project management, process"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'management, product management, and the recently introduced subprocess management.
    When data lose their context, they are considered irrelevant and are thus dismissed.
    When managers lose interest, data are buried at the source. The solution is to
    categorize metrics according to context and assure relevance to the stakeholders.
    The periodical metrics data report should be divided into interlinked and context-based
    sections. Different stakeholders read different sections of the report with interest.
    Context setting should be performed before the goal question metric (GQM) paradigm
    is applied to the metrics design.


    Several software development organizations prefer to define “mandatory data” and
    call the rest as “optional data.” Mandatory metrics are chosen from the context
    of the organization, whereas optional metrics are for local consumption. Mandatory
    metrics are like the metrics in a car dashboard display; the industry needs them
    to run the show. The industry chooses mandatory metrics to know the status of
    the project and to assess the situation, departing from the confines of GQM paradigm
    in response to operational requirements.


    SEI’s GQ(I)M framework [2] improved the GQM methodology in several ways. Using
    mental models and including charts as part of the measurement process are noteworthy.
    Instant data viewing using charts connects data with decision making and triggers
    biofeedback. Creating charts is a commendable achievement of statistical methods.
    Spreadsheets are available with tools to make adequate charts.


    Mapping is frequently used in engineering measurements. The mapping phase of software
    size measurement in COSMIC Function Points is a brilliant exposition of this mapping.
    The International Function Point Users Group defines counting rules in a similar
    vein. Counting lines of code (LOC) is already a long established method. Unambiguous
    methods are available to measure complexity. These are all product data regarded
    as “optional.” Despite the clarity provided by measurement technologies, product
    data are still not commonly available.


    Moving up, business data include key performance indicators, best organized under
    the balanced scorecard scheme. These data are driven by strategy and vision and
    used in a small number of organizations as a complement to regular data collection.


    Data availability has remained a problem and is still a problem. The degree of
    data availability problem varies according to the category of data. A summary
    is presented in the following table:


    | Category | Data Availability |

    |---|---|

    | 1. Business data | Medium availability |

    | 2. Project data | High availability |

    | 3. Process data | Low availability |

    | 4. Subprocess data | Extremely low availability |

    | 5. Product data | Very low availability |'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Collecting data in the last two categories meets with maximum resistance from
    teams because this data collection is considered as micromanagement. The previously
    mentioned profile of data availability is typical of software business and contrasts
    with manufacturing; for example, product data are easily available there.


    # Bringing Data to the Table Requires Motivation


    A strong sense of purpose and motivation is required to compile relevant data
    for perusal, study, and analysis. Different stakeholders see different sections
    of data as pertinent. Business managers would like to review performance data.
    Project managers would like to review delivery related data, including some performance
    data they are answerable to. Process managers would like to review process data.
    Model builders and problem solvers dig into subprocess data. An engineering team
    would be interested in looking at product data.


    Data are viewed by different people playing different roles from different windows.
    Making data visible in each window is the challenge. The organizational purpose
    of data collection should be translated into data collection objectives for different
    stakeholders and different users. Plurality of usage breeds plurality in usage
    perspectives. Plurality is a postmodern phenomenon. Single-track data compiling
    initiatives fail to satisfy the multiple users, resulting in dismally poor metric
    usage across the organization.


    The mechanics of data compilation and maintaining data in a database that would
    cater to diverse users is now feasible. One can look up data warehouse technology
    to know the method. A common, structured platform, however, seems to be a goal-driven
    process to bring data to the data warehouse.


    # Data Quality


    # On Scales


    Software data have several sources as there are several contexts; these data come
    in different qualities. A very broad way of classifying data quality would be
    to divide data into qualitative and quantitative kinds. Verbal descriptions and
    subjective ratings are qualitative data. Numerical values are quantitative data.
    Stevens [3] developed scales for data while working on psychometrics, as follows:
    nominal, ordinal, interval, and ratio scales. The first two scales address qualitative
    data. The remaining two address quantitative data. Stevens restored legitimacy
    for qualitative data and identified permissible statistical analyses for each
    scale. Each scale is valuable in its own way, although most analysts prefer the
    higher scales because they carry data with better quality and transfer richer
    information.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '> *When data quality is low we change the rules of analyses; we do not discard
    the data.*


    Steven’s measurement theory has cast a permanent influence in statistical methods.


    The lower scales with allegedly inferior data quality found several applications
    in market research and customer satisfaction (CSAT) measurement. CSAT data are
    collected in almost every software project, and an ordinal scale designed by Likert
    [4] is extensively used at present for this purpose. We can improve CSAT data
    quality by switching over to the ratio scale, as in the Net Promoter Score approach
    invented by Frederick [5] to measure CSAT. CSAT data quality is our own making.
    With better quality, CSAT data manifest better resolution that in turn supports
    a comprehensive and dependable analysis.


    The advent of artificial intelligence has increased the scope of lower scale data.
    In these days of fuzzy logic, even text can be analyzed, fulfilling the vision
    of the German philosopher Frege, who strived to establish mathematical properties
    of text. Today, the lower scales have proved to be equally valuable in their ability
    to capture truth.


    # Error


    All data contain measurement errors, whether the data are from a scientific laboratory
    or from a field survey. Errors are the least in a laboratory and the most in a
    field survey. We repeat the measurement of a product in an experiment, and we
    may get results that vary from trial to trial. This is the “repeatability” error.
    If many experimenters from different locations repeat the measurement, additional
    errors may appear because of person to person variation and environmental variation
    known as “reproducibility” error. These errors, collectively called noise, in
    experiments can be minimized by replication.


    The discrepancy between the mean value of measured data and the true value denotes
    “bias.” Bias due to measuring devices can be corrected by calibrating the devices.
    Bias in estimation can be reduced by adopting the wide band Delphi method. Bias
    in regularly collected data is difficult to correct by statistical methods.


    Both bias and noise are present in all data; the magnitude varies. Special purpose
    data such as those collected in experiments and improvement programs have the
    least. Data regularly collected from processes and products have the most. If
    the collected data could be validated by team leaders or managers, most of the
    human errors could be reduced. Statistical cleaning of data is possible, to some
    extent, by using data mining approaches, as shown by Han and Kamber [6]. Hundreds
    of tools are available to clean data by using standard procedures such as auditing,
    parsing, standardization, record matching, and house holding. However, data validation
    by team leaders is far more effective than automated data mining technology. Even
    better is to analyze data and spot outliers and odd patterns and let these data
    anomalies be corrected by process owners. Simple forms of analysis such as line
    graphs, scatter plots, and box plots can help in spotting bad data.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Data, Data Quality, and Descriptive Statistics


    Cleaned data can be kept in a separate database called a data warehouse. Using
    data warehouse techniques also help in collecting data from heterogeneous sources
    and providing data a structure that makes further analysis easy. The need for
    a commonly available database is felt strongly in the software industry. More
    and more data get locked into personal databases of team members. Although data
    collection is automated and data quality is free from bias and noise, the final
    situation is even worse: data are quietly logged into huge repositories with access
    available only to privileged managers. They do not have the time for data related
    work. The shoemaker syndrome seems to be working.




    This is one of the earliest known methods. Data must be grouped, categorized,
    or stratified before analysis. Data categories are decided from engineering and
    management standpoint. This should not be left to statistical routines such as
    clustering or principal component analysis.


    In real life, stratification is performed neither with the right spirit nor with
    the required seriousness. For instance, a common situation that may be noticed
    is attempts to gather software productivity data and arriving at an organizational
    baseline. Productivity (function point/person month) depends on programming language.
    For example, Caper Jones [7] has published programming tables, indicating how
    the level of language increases as productivity increases.




    Descriptive statistics is used to describe and depict collected data in the form
    of charts and tables. Data are summarized to facilitate reasoning and analysis.
    The first depiction is the visual display of data, a part of indicators in the
    GQ(I)M paradigm [1]. The second depiction is a numerical summary of data.


    Visual display is an effective way of presenting data. It is also called statistical
    charting. Graphical form communicates to the human brain better and faster, allowing
    the brain to do visual reasoning, a crucial process for engineers and managers.
    Park and Kim [8] proposed a model for visual reasoning in the creative design
    process. There is growing evidence to show that information visualization augments
    mental models in engineering design (Liu and Stasko [9]). Data visualization is
    emerging into a sophisticated discipline of its own merit.


    Let us see an example two simple graphs. First is a radar chart of project risks
    shown in Figure 1.1. This provides a risk profile of project environment at a
    glance. The radar chart presents an integrated view of risk; it is also an elegant
    summary. This chart can be refreshed every month, showing project managers the
    reality. Reflecting upon the chart, managers can make decisions for action. The
    second chart is a line graph'
  merge: -1
  img_proc: true
