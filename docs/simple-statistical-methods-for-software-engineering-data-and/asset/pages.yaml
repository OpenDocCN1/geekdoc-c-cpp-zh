- pgno: 172
  md: 'Figure 10.7 is a histogram of defects found per test case, a key metric in
    software testing. The LSL has been set at 0.08, and the USL has been specified
    at 0.5. Perhaps specifying a USL is unnecessary, but it is meant to cause an alert
    on product quality in this case.


    The lower limit is less controversial; the team expects a minimum return from
    test cases. The target 0.3 defects found per test case is also marked for reference.
    Visually, the histogram reveals capability-related issues: the process peak is
    not on target, and a good deal of results (roughly 28%) fall below the lower specification
    limit. The process has a lot to improve. The capability index is 0.26, much lower
    than the desirable value of at least 0.8.


    The test case metric “defects found per test case” is a double-edged sword. If
    more defects are found, it could be either due to the poor quality of product
    on test or highly effective test cases. If few defects are found, it could mean
    that the product is good or the test cases are not effective. One has to appreciate
    both the possibilities and use extraneous evidence to judge the histogram.


    # Histogram as a Judge


    There is a very significant use of the histogram as a judge. First, it is a visual
    judge of the normality of data. There are debates about the normality of metric
    data, and people do a normality test. A visual judgment of the histogram of the
    data can be a first-order judgment of normality. If data are not normal, people
    do not do esoteric statistical tests on the data.


    > *Process data in software development is often nonnormal.*


    In these cases, the histogram is used to visualize data and to make a decision
    about statistical tests. For example, time to repair data are avowedly nonnormal;
    all known histograms testify to this. The problem is now escalated: one should
    use nonparametric tests, or one should transform data appropriately and do statistical
    tests. The author prefers the first. Let us keep data in its purest form.


    There is an area where we are sure data will have to be normal: prediction errors.
    In any prediction model, errors are symmetric around the mean, and the mean error
    value is zero. A histogram is of the errors usually plotted, to see if it is symmetrical
    around zero, to validate the prediction model.


    > *Good regression models leave behind errors, or residuals, which are normally
    distributed and can be tested with histograms.*


    If the histogram is skewed, the model is not accepted and needs to be improved.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# BOX 10.4 WEB CONTENT EXTRACTION


    The content of web pages is extracted by using the HTML document’s Text-To-Tag
    Ratio histograms. Web content extraction is seen as a histogram clustering task.
    Histogram clustering is a widely researched topic that is especially popular with
    image researchers. This is especially true among researchers who wish to use the
    histogram footprints of images as a means for classification, segmentation, etc.
    These clustering techniques are also enhanced with the use of histogram smoothing
    techniques. High recall and precision are achieved by this technique. (Weninger
    and Hsu [8])


    # From One Point to One Histogram


    To judge a process or a product, a single observation is not enough. We need multiple
    observations and a histogram constructed out of the multiple observations. The
    minimum element in statistical structure seems to be a histogram. If we have to
    judge a process, we need to make enough observations and plot a process capability
    histogram. If we have to study product behavior, we need to collect enough data
    from a minimum number of modules and construct a histogram. Both the process and
    the product can be observed only through histograms.


    # Case Study: Goal Entitlement


    Setting stretch goals is a tricky challenge. Such goals have to be realistic too.
    The goal setting process must be transparent as well. This case study presents
    the use of histograms in setting stretch goals.


    Productivity analysis using histogram reveals the presence of two clusters. The
    stronger peak seems to be of higher productivity. The smaller cluster is closer
    to the present goal of 50 lines of code (LOC) per day.


    There is every reason to increase the goal to the best practice cluster peak,
    marked B, following a natural path of improvement shown in Figure 10.8.


    > Entitlement is the best you can possibly operate without redesigning your process.
    It is the difference between the current level of performance and the best documented.


    This is the core concept in “goal entitlement.” A conservative stretch goal will
    be to set any intermediate point C on the path of improvement such that 70% of
    the ideal improvement is targeted. Thus, C becomes a new goal. With the histogram
    in the background, the entire analysis and planning is data based and realistic
    and makes it easy for people to accept the stretch goal without any reservation.'
