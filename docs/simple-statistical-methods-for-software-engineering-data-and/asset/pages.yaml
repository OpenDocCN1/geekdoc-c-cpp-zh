    \ effort is directed  \n*Need:* a condition requiring supply or relief\n\nGoals\
    \ are complex; they consist of interconnected layers and are influenced by “personal\
    \ goals” and “self-efficacy.” Goals have multiple dimensions, are likely to drive\
    \ discussions of metric design into inconclusive divergence, and are correspondingly\
    \ undesirable to rely on for deriving metrics. Needs have a simple structure and\
