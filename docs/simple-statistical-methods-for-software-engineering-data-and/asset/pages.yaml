- pgno: 81
  md: "> An approximate answer to the right problem is worth a good deal more than\
    \ an exact answer to an approximate problem.\n> \n> John W. Tukey\n\nBox plots\
    \ help us to identify and define the right problems.\nThe productivity box plot\
    \ shown in Figure 4.1 highlights three opportunities for innovation:\n\n+   1.\
    \ *Removal of outliers:* This is the easiest innovation. There is no outlier in\
    \ the lower side of the plot. That is good news. The outliers with higher values\
    \ might appear as welcome outcomes. Here is the good old question of specifying\
    \ an upper limit even for the better side of events. It may be suspected that\
    \ extreme value of productivity is the result of a compromise, a slow acting fuse,\
    \ that might show up later somewhere as an issue. Although we need to understand\
    \ all the outliers, the outliers beyond the outer fence may be studied in detail.\
    \ The presence of more outliers on the right side also indicates the possible\
    \ existence of a tail or skew in the distribution.\n+   2. *Shifting the median\
    \ toward higher levels:* This means the expected value of productivity can be\
    \ improved.\n+   3. *Reduction of IQR as well as whisker-to-whisker width:* Process\
    \ variation, depicted both by the IQR and whisker-to-whisker width, can be reduced\
    \ to minimize variation.\n\nThe three innovations could coexist. Improving the\
    \ median may be accompanied by reduction in outliers, and vice versa. It is a\
    \ good strategy to take up one at a time, in the previously mentioned order, and\
    \ take the beneficial side effects in the other two.\n\n# Core Benefits of Box\
    \ Plot\n\nTukey’s box plot contains sufficient statistical strategies and yet\
    \ retains its intended simplicity. Many attempts are being made to enhance the\
    \ information content in box plots and make them colorful as well. We focus on\
    \ the simple box plot in this chapter and find that it has great potential. The\
    \ box plot can be applied to the following:\n\n+   - Provide a visual summary\
    \ of data\n+   - See process variation\n+   - Detect outliers\n+   - Detect skew\
    \ in data"
