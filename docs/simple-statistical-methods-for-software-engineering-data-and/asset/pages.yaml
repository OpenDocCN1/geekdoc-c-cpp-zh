- pgno: 266
  md: 'Pareto became famous by the Pareto Optimum in economics and the Pareto distribution.
    In 1896, he found that the distribution of income does not follow the normal distribution
    but is mostly inclined to the right side. His discovery of the “distribution curve
    for wealth and incomes” of 1895 made Pareto famous as a statistician.


    The Pareto principle was named after him and built on observations of his such
    as that 80% of the land in Italy was owned by 20% of the population.


    Pareto was the first to realize that utility was a preference ordering. With this,
    Pareto not only inaugurated modern microeconomics but also demolished the alliance
    of economics and utilitarian philosophy. Pareto said “good” cannot be measured.
    He replaced it with the notion of Pareto optimality, the idea that a system is
    enjoying maximum economic satisfaction when no one can be made better off without
    making someone else worse off. Pareto optimality is widely used in welfare economics
    and game theory. A standard theorem is that a perfectly competitive market creates
    distributions of wealth that are Pareto optimal.


    His legacy as an economist was profound. Partly because of him, the field evolved
    from a branch of social philosophy as practiced by Adam Smith into a data-intensive
    field of scientific research and mathematical equations. (http://en.wikipedia.org/wiki/Pareto_principle;
    http://en.wikipedia.org/wiki/Pareto_distribution)


    # Structure of Pareto


    Pareto is known as a fat-tailed distribution. Gaussian, exponential, and Pareto
    tails are compared in Box 16.2. It is shown that Pareto has the largest tail.


    A graph of the Pareto distribution is plotted in Figure 16.1. The probability
    of usage of software features is the metric plotted in Figure 16.1. The distribution
    begins from its mode and extends asymptotically to the right. The decline of usage
    is gradual.


    The Pareto probability density function (PDF) depends on two parameters, mode
    m and shape factor α. The equation to the PDF is shown as follows:


    ```

    PDF = α m^α / x^(α+1)  (16.1)

    ```


    The equation can be rewritten by marking the constant term separately and bringing
    the variable term to the numerator, as follows:


    ```

    f(x) = (α m^α) x^{-(α+1)}  (16.2)

    ```


    The equation is clearly a form of the power law with a negative exponential x^{-b}.
    Power law is one of the favorite curves used in data mining.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_267_0.png)


    Figure 16.1 Pareto distribution of features usage.


    # BOX 16.2 A STORY OF TAILS


    The Gaussian tail dies soon. The exponential tail stretches longer but is limited.
    The Pareto tail, resulting from the power law, is unlimited. We can compare the
    standard forms of these three tail equations:


    Gaussian, standard form = e^(-1/2 x^2)

    Exponential, standard form = e^(-x)

    Pareto, standard form = x^(-1)


    In the previously mentioned expressions, scale factor = 1 and location = 0. If
    we check the value of tails at x = 6, we find


    Gaussian tail = 0.0000000152

    Exponential tail = 0.00248

    Pareto tail = 0.167


    At x = 6, the Gaussian tail is nearly zero, and the exponential tail is 162,755
    times bigger. In turn, the Pareto tail is 67 times stronger than the'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'exponential. For larger values of x, divergence among the three tails increases
    further. The Gaussian tail will be dead, the exponential tail will slide toward
    zero, and the Pareto tail will still have significant values for a long distance.


    These three tails represent three aspects of engineering and management. Gaussian
    is drawn to its center; its body is accentuated and its tail attenuated, a true
    model of process behavior. The Gaussian tails are either process defects or rejection
    areas.


    Exponential curve represents decay or defects in a product. There seem to be special
    mechanisms in a product that cause decay or vulnerabilities that cause defects.
    By definition, exponential tail represents failure, not performance of products.


    Pareto is often a model for external factors that influence a product or a process
    from outside the organization.


    Business comprises effects represented by these three tails.


    The cumulative distribution function is shown in Figure 16.2. The y-axis directly
    reads usage probability, while the x-axis reads the number of features. Using
    this model, we can find quickly the usage probability of n number of features
    in a software product.


    The equation to cumulative distribution is rather simple and is shown as follows:


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_268_0.png)


    Figure 16.2 Cumulative Pareto distribution of features usage.'
