- pgno: 136
  md: '# Chapter 8


    # Software Test Metrics


    The broad benefits of metrics discussed in Chapters 1 and 5 are relevant to software
    testing too. Although testing is part of the full life cycle, it has become a
    project of its own kind, with its own unique objectives. Testing is conducted
    to find defects and to improve product quality. The three objectives of any project,
    that is, faster, better, and cheaper, also apply to testing. Metrics would help
    to push testing to greater levels.


    # Project Metrics


    Definitions of test project metrics are exactly same as metrics definitions in
    any project, with the same meaning and purpose. Project metrics help to conserve
    project resources and make optimal use of them. Project metrics track requirement
    changes and help to take corrective measures when requirement changes threaten
    the project. Project metrics also help to satisfy customers.


