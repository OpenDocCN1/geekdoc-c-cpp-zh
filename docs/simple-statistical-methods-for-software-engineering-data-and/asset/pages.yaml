- pgno: 145
  md: '# Predicting Quality


    As testing progresses, the quality of SUT would be progressively measured. Halfway
    through in testing, we have sufficient data to predict the quality level of the
    product at the end of completing test execution. We should be in a position to
    predict residual defects when testing is performed and the application is released.
    On the basis of this prediction, we can make a decision to stop testing once the
    targeted quality level is achieved. If a quality level is defined as 99.999% correct
    code and if prediction shows only 0.001% defects are undiscovered, we can release
    the application.


    In this context, the purpose all test metrics is to make this prediction. Chapter
    21 describes a method for predicting defects.


    # Metrics for Test Automation


    Test automation requires special effort, almost a project on its own merit. Automation
    promises to rapidly find defects that manual testing cannot find. This increases
    the quality of SUT.


    Automation could be a huge effort, especially for large projects.


    > Windows NT 4 had 6 million lines of code, and 12 million lines of test code.


    By using test automation metrics, this huge effort could be managed better and
    more defects could be found in the SUT.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_145_0.png)


    # Return on Investment


    Return on investment (ROI) of automation is a strategic measure that justifies
    automation. The simple formula for ROI is a direct ratio given as follows:


    ROI = Cost saved by automation / Cost of automation


    Cost savings from automation is usually distributed across several projects that
    benefit from the automation scripts; calculating ROI from single project information
    is not fair.


    # Percentage Automatable


    Another lead metric in test automation is % Automatable. This metric must be established
    upfront:


    % Automatable = Number of test cases that can be automated / Total number of test
    cases × 100'
