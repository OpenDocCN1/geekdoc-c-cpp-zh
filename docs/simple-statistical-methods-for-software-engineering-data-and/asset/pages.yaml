    # Figure 21.3 Modified Gompertz reliability growth curve with shift.


    In any case, the four-parameter model offers more options during curve fitting,
    and this could be an advantage.


    # Predicting with the Gompertz Model


    Once test data arrives, we may wish to begin asking the following questions:


    > How many more defects remain in the application?

    > How long would it take to detect those defects?


    These are the prediction questions the Gompertz model strives to answer. There
    are two prediction scenarios. The first is when we use an auxiliary model to estimate
    defects in the application. For example, we might predict defects based on the
    size and complexity of the application using regression equations based on historical
    data. In this case, we know the constant A. All we have to do is to derive the
    remaining parameters B, C, and D from data and predict time.


    In the second scenario, all four parameters are unknown. We do not have any estimate
    of the defects in the application. In this case, one short cut is to wait for
    the defect discovery rate to go through a peak and start symptoms of steady decline.
    The peak is the Gompertzian inflection point. If the defects found until the inflection
    point is known, then the overall defects A can be obtained by using the following
    relationship:


    ```

    Defects found until inflection = total defects in the application × 0.36788

    ```


    This calculation completes the prediction of total defects in the application.'
