- pgno: 339
  md: '# Chapter 21


    # Gompertz Software Reliability Growth Model




    The S curves in software project management represent cost evolution and reliability
    growth within projects. The strength of the S curve is that it is based on nature.
    It represents a natural law of growth. The forecasting power of the S curve is
    due to the basic concept of limiting resources that lies at the basis of any growth
    process.


    The earliest known S curve is the logistic function, introduced to describe the
    self-limiting growth of a population by Verhulst in 1838, based on the Principle
    of Population published by Thomas Malthus. Benjamin Gompertz developed the Malthusian
    growth model further and invented the law of mortality, a Gompertz curve, in 1825
    (see Box 21.1 for a brief biography).


    Since then, S-shaped curves have been applied for studies in various fields. The
    more precise the data and the bigger the section of the S curve they cover, the
    more accurately the parameters can be recovered. When a system is closer to the
    end of its evolution, it increases the accuracy of the forecast with the S curve
    [1].'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# BOX 21.1 BENJAMIN GOMPERTZ 1779–1865


    Benjamin Gompertz, a member of a distinguished Jewish family, was born in London,
    where his father and grandfather had been successful diamond merchants. It is
    said that so great was his thirst for knowledge while he was a boy that frequently,
    when his parents had removed all candles to prevent him from injuring his health
    by studying too late at night, he stole out into the garden and pursued his investigations
    by moonlight.


    He turned his attention to the theory of imaginary quantities. He would have liked
    the Royal Society to publish the results of his work on this subject, but his
    paper was rejected by the society, apparently on the basis that it was too profound
    and that no one would understand it.


    The last published paper by Gompertz on astronomy was produced in 1829. He maintained
    an interest in the subject until his death, studying other people’s papers and
    investigating meteors, shooting stars, comets, and so on.


    It was as an actuary, however, that Gompertz’s most lasting work was performed.
    His two famous papers on the subject of life contingencies were submitted to the
    Royal Society in 1820 and 1825. Gompertz discovered that “The force of mortality
    at age x might be denoted by Bc^x.”


    Gompertz then proceeded to test several mortality tables that were in use at the
    time and to show that they followed his “law” approximately over a limited range
    of ages such as 10 to 50 or 15 to 55.


    Gompertz’s paper of 1825 marked the beginning of a new era, not merely because
    his formula was, for several reasons, an enormous improvement on others, which
    had been suggested previously, but because it opened up a new approach to the
    life table.


    In 1860, he contributed a paper to the International Statistical Congress. In
    this paper, he suggested modifications to his “law” of mortality, which would
    make it applicable over the entire period of life from birth to old age. Gompertz’s
    name will be known by future generations of actuaries not only because it cannot
    be omitted from any textbook on life contingencies but also because his outstanding
    brilliance as a mathematician was equaled by his modesty and generosity (JIA 91,
    1965).


    # Modeling Reliability Growth with Gompertzian S Curves


    The application of the Gompertz curve as a software reliability model (more than
    a century later after Gompertz introduced his curve) is of interest to us.


    The Gompertz growth curve is shown in Figure 21.1. The y axis represents reliability
    growth. In practice, the y axis is calibrated in terms of cumulative defects'
  merge: -1
