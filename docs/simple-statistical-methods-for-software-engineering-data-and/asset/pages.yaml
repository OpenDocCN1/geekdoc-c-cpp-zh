- pgno: 193
  md: 'Chulani et al. have used the Bayesian paradigm to calibrate the Cost Construction
    Model (COCOMO), combining expert judgment with empirical data. This illustration
    has great significance and holds great promise. This makes us think differently
    about data. In a Bayesian sense, data include an intuitive guess. The study of
    Chulani et al. proves that a healthy collaboration between empirical data and
    an intuitive guess, such as available in Bayes, is a practical solution to a hitherto
    unsolved problem.


    Fenton [6] used the Bayesian belief networks (BBNs), a commendable expansion of
    the Bayesian paradigm, to predict software reliability.


    Bibi et al. [7] applied BBNs as a software productivity estimation tool. They
    find that BBN is a promising method whose results can be confirmed intuitively.
    BBNs are easily interpreted, allow flexibility in the estimation, can support
    expert judgment, and can create models considering all the information that lay
    in a data set by including all productivity factors in the final model.


    Wagner [8] used BBNs inside a framework of activity-based quality models in studying
    the problem of assessing and predicting the complex concept of software quality.
    He observes,


    > The use of Bayesian networks opens many possibilities. Most interestingly, after
    building a large Bayesian network, a sensitivity analysis of that network can
    be performed. This can answer the practically very relevant question of which
    of the factors are the most important ones. It would allow to reduce the measurement
    efforts significantly by concentrating on these most influential facts.


    # A Comparison of Application of the Four Distributions and Bayes Theorem


    In the case of the binomial distribution, the trials are independent of one another.
    Trials are done with replacement.


    The hypergeometric distribution arises when sampling is performed from a finite
    population without replacement, thus making trials dependent on one another.


    In NBD, the number of trials is not fixed. Trials go until a specified number
    of successes are obtained.


    The geometric distribution is a special case of NBD where trials are observed
    until the first success is achieved.


    Bayes theorem provides a way to combine historical distribution with fresh evidence.'
