    # An Inverse Problem


    Let us revisit Equation 13.2, which defines the Gaussian PDF. The integration
    of this PDF leads to the cumulative distribution function (CDF), F(x), defined
    as follows:


    ```

    F(x) = \frac{1}{\sqrt{2\pi}} \int_{-\infty}^{x} e^{-\frac{(x-\mu)^2}{2\sigma^2}}
    dx

    (13.4)

    ```


    This CDF can be plotted using Excel NORMDIST(x, mean, SD, 1). As an example, we
    plot the CDF for requirement volatility with mean = 3.3% and standard deviation
    = 4% in Figure 13.9. The inverse problem is given that the Gaussian F(x) = 0.78;
    what is x? This question and its answer are shown in Figure 13.9. The answer is
    marked as 6.39. This solution has been obtained graphically.


    We can use the Excel function NORMINV to find x, as follows:


    ```

    NORMINV(0.78, 3.3, 4) = 6.3888

    ```


