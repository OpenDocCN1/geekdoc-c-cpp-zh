    \ of Probability. Once the limits are known, filling the distribution is easy.\n\
    \n> The scientific imagination always restrains itself within the limits of probability.\n\
    > \n> Thomas Huxley\n\nIt is also an approximate distribution: The comfort of\
    \ approximation is matched by convenience of usage and freedom. This freedom offered\
    \ by the triangular distribution makes it a favorite choice during business decision\
