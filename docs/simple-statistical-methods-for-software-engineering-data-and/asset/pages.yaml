    \ Jacob graduated from the University of Basel with a master’s degree in philosophy\
    \ in 1671 and a master’s degree in theology in 1676. When he was working toward\
    \ his master’s degrees, he would also study mathematics and astronomy. In 1681,\
    \ Jacob Bernoulli met mathematician Hudde. Bernoulli continued to study mathematics\
    \ and met world-renowned mathematicians such as Boyle and Hooke.\n\nJacob Bernoulli\
    \ saw the power of calculus and is known as one of the fathers of calculus. He\
    \ also wrote a book called Ars Conjectandi, published in 1713 (8 years after his\
    \ death).\n\nBernoulli added upon Cardano’s idea of the law of large numbers.\
    \ He asserted that if a repeatable experiment had a theoretical probability p\
    \ of turning out in a certain “favorable” way, then for any specified margin of\
    \ error, the ratio of favorable to total outcomes of some (large) number of repeated\
