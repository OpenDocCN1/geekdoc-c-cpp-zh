    rules by the International Function Point Users Group. More than that, metrics
    are readily used. Graphical elements have become signifiers instead of numerical
    indicators, where possible. The burn-down chart has replaced several metrics at
    once. Agile metrics influence day to day decision making.


    # The Price of Humanization


    Agile metric data are mostly in the ordinal scale (like in “high–medium–low” judgments).
    Ordinal data can be collected quickly without hassle. Ordinal data also have a
    degree of calculated approximation. The contrast is between precise but less used
    classic metric data versus approximate but humanized agile data. Working with
    a lower scale suffers information loss, a price we pay for humanization. However,
    that loss does not make agile metrics less scientific than classic metrics, if
    users are aware of the degree of approximation.'
  merge: -1
  img_proc: true
