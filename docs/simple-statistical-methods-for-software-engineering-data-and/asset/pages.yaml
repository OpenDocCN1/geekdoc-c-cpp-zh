  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_208_0.png)


    # Figure 12.10 Control chart for customer complaints.


    The Poisson boundary is marked as an upper bound. A trend line is also included
    in the figure to show how the Poisson boundary shows a complaint rate higher than
    indicated by the trend.


    In this context, the application of Poisson distribution to model baseball events
    is illustrated in Box 12.5.


    # Applying Poisson Distribution to Software Maintenance


    The arrival of service requests follows Poisson distribution. The interarrival
    time follows exponential distribution. Both are memoryless. The time to repair
    a bug does not depend on previous records. Mean time to fix bugs in a particular
    setup controls dispersion of results. Month or week, teams may experience the
    same Poisson curves. Sophisticated models for queues have been built, but the
    building block is the exponential law.


    # Bathtub Curve of Reliability:

    A Universal Model of Rare Events


    Failure of components is extensively used in reliability analysis because it is
    a Poisson process. The bath tub curve of reliability has three zones. The first
    is characterized by a rapidly decreasing failure rate. This region is known as
    the early failure period (also called infant mortality period). Next, the failure
    rate levels off and remains constant in the flat portion of the bathtub curve.
    Finally, the failure rate begins to increase as materials wear out and degradation
    failures occur at an ever increasing rate. This is the wear out failure period
    (see Figure 12.11).'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Figure 12.11 Bath tub curve.


    The flat bottom is governed by a Poisson process that has a constant failure rate
    (or hazard rate). To be more specific, this is called as the homogeneous Poisson
    process (HPP). The term homogeneous is due to a constant failure rate or hazard
    rate. The infant mortality period is also a period of growth in reliability. The
    failure rate in this period is not constant but steadily reducing; hence, it is
    called nonhomogeneous. This associated process is the nonhomogeneous Poisson process
    (NHPP). The wear out period is also an NHPP, the difference being the fact that
    failure rate here steadily increases until the system is discarded.


    It may be noted that in the example of the bath tub curve shown in Figure 12.11,


    +   - In the infant mortality period,

    +     $$m(t) = \lambda t^{-\beta},\ 0 < \beta < 1\tag{12.10}$$ defines a decreasing
    failure rate and an NHPP.


    +   - In the middle region,

    +     $$m(t) = \lambda,\ \beta = 0\tag{12.11}$$ defines a constant failure rate
    and an HPP.


    +   - In the wear out period

    +     $$m(t) = \lambda t^{-\beta},\ \beta < 0\tag{12.12}$$ defines an increasing
    failure rate and an NHPP, in a reverse direction.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_209_0.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The HPP can be described only by exponential law, an oversimplification though.
    Constant failure rate, a key assumption in HPP, is too ideal to be true even in
    the case of mechanical systems. A bulb, under HPP, will have the same reliability
    after burning through 400 hours or any time fixed by the analyst. Physically this
    is meaningless. Similarly, the physical meaning of a failure rate in a situation
    shown in Figure 12.2 begs explanation. No software ever operates at a constant
    failure rate, although the exponential representation produces such a parameter.
    It must be borne in mind that Figure 12.2 has been obtained by numerical curve
    fitting rather than by using physically reasonable reliability parameters such
    as failure rates or MTBF or MTTF.


    The bath tub curve, in its entirety, is true for mechanical systems. In the case
    of software, failures are constrained to Region 1, which records reliability growth.
    Hence, software failure models are called *reliability growth models*. For both
    the cases, we now need the help of NHPP modeling for a more accurate representation
    of real world failure patterns.


    # Nonhomogeneous Poisson Process (NHPP)


    Real-life software defect arrival is more complex than simple exponential curves,
    an example available in Figure 12.12. It presents a typical defect arrival pattern
    during system testing. Approximately 140 defects are discovered over a time span
    of about three months. It is not a smooth exponential cumulative distribution.
    The curve is


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_210_0.png)


    Figure 12.12 Defect arrival pattern—empirical model.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'irregular; defects seem to be triggered in different rates in different periods.
    There seem to be short test cycles within the main testing process. The curve
    also has several linear climbs. These details mark clear departure from the simple
    exponential, making a case for building NHPP.


    The equation to an NHPP is given as follows:


    ```

    $$P(x, m(t)) = \frac{e^{-m(t)} m(t)^x}{x!}\quad(12.13)$$

    ```


    where $m(t)$ is the mean value function that takes the place of the traditional
    failure rate constant $\lambda$ in the HPP model presented in Equation 12.5.


    It may be noted that Equation 12.13 is exactly Equation 12.5, except for a redefinition
    of the rate constant $\lambda$. An NHPP is completely defined by its mean value
    function $m(t)$. Building an NHPP model decreases the identification of the right
    function for $m(t)$ and the derivation of the parameters of the function from
    failure data.


    There are many options available to choose a function for $m(t)$. Researchers
    have used different functions to suit different situations. The list includes
    exponential, logarithms, Gaussians, Weibulls, and logistic functions. Even mixtures
    of functions have been used to deal with complex events.


    It is now a custom to think of NHPP with two equations. The bigger Poisson equation
    in Equation 12.13 defines the structure, and the mean value function in Equations
    12.10–12.13 defines a central component. In fitting NHPP to data, we derive the
    coefficients of the mean value function $m(t)$ from data. There is no need to
    consult the Poisson equation for this purpose. The Poisson is in the background,
    as an abstraction of the model.


    > *Think of NHPP, think of mean value function.*


    An early application of the NHPP power law is by Duane [3], who in 1964 observed,


    > When he plotted cumulative MTBF estimates versus the times of failure on log-log
    paper, the points tended to line up following a straight line. This was true for
    many different sets of reliability improvement data and many other engineers have
    seen similar results over the last three decades. This type of plot is called
    a Duane Plot and the slope beta of the best line through the points is called
    the reliability growth slope or Duane plot slope. A straight line on a Duane plot
    is equivalent to the NHPP Power Law Model.


    The NHPP power law has been used as a model for “reliability improvement.”'
  merge: -1
  img_proc: true
