- pgno: 72
  md: '# Case Study: Dispersion Analysis of Data Sample


    This case study is from a support project. The data volume is pretty large. Around
    15,000 incidents are logged every week. The turnaround time (TAT) of resolving
    the issues is taken for our study. We take a random sample of 30 data points from
    the database for dispersion analysis. Using a sample has its own risks: we may
    obtain a limited view of reality, and dispersion seen in the entire database may
    be quite large. However, analysis of a small sample is easy and provides a perspective
    and guidance for further analysis. The range of 30 data sample is 199 days, and
    it seems odd given the fact that there are tightly controlled service level agreements.
    The analyst remembers a 7-day service level agreement and is prompted to form
    clusters in the data. Three clusters emerge by visual analysis. The first cluster
    agrees with the memory recall of the analysts: the data are around 7 days. There
    seems to be a second cluster around 50 days. Two data points show extreme values
    of 80 and 200 days. A better evaluation of dispersion is possible if we use coefficients
    of dispersion and the analyst chooses the coefficient of MAD (CMAD). For the raw
    data, CMAD is high. After forming clusters and creating categories, the CMAD values
    become small and reasonable, as shown in Figure 3.1.


    Category C seems to be special cases; perhaps those events were put on a low priority
    queue and were taken up very late. There is no information regarding this in the
    database; the only data logged in are time stamps of entry and release. A dispersion
    analysis of the data sample brought the problem in the database and prompted the
    analyst to create categories. Lessons learned from data sample dispersion analysis
    help in designing a framework for the big job: analysis of the total database.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_72_0.png)


    Figure 3.1 Dispersion analysis of data sample.'
