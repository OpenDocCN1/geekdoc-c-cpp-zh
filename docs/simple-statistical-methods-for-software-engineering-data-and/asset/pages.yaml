- pgno: 91
  md: '# Chapter 5


    # Deriving Metrics


    # Creating Meaning in Data


    Direct observations are also called *base measures* or *raw data*. Such data are
    either entered in the computer by people or recorded automatically by machines.
    Automated data collection is gaining currency. When people enter data, they have
    a chance to see what they are keying in and validate the data. Data caught by
    machines are not immediately seen by people; such automatic data are visited during
    report generation or process analysis.


    Derived measures are computed from base measures. Derived measures are known by
    several names. Two of these names are significant: key performance indicators
    and metrics; we use the term metrics. Errors in base measure propagate into metrics.
    In a broader sense, metrics also constitute data. However, metrics carry richer
    information than base measures. We create meaning in data by creating metrics.


    # Deriving Metrics as a Key Performance Indicator


    Measurement is essentially a mapping process. The primitive man counted sheep
    by mapping his cattle, one to one, to a bundle of sticks. If a sheep is missing,
    it will show up as a mismatch. Word was not yet invented, but there was mapping
    all the same. A similar mapping is performed for function point counting; measurement
    is seen as a “counting process,” a new name for mapping. The mapping phase in
    measurement is well described in the COSMIC function point manual. With the help
    of language, we have given a name for what is counted—software size. With the
    help of number theory, we assign a numerical value applying rules.


    In a similar manner, we count defects in software. Here the mapping is obvious.
    The discovery of defect is conducted by a testing process. Each defect is given'
  merge: -1
  img_proc: true
- pgno: 92
