- pgno: 137
  md: '# Cost


    The cost of testing per release is measured. Cost variance tracks dollars spent
    in excess of the budget. In addition to human cost, we need to consider investment
    on tools and outsourcing and see if we can execute testing within budget.


    # BOX 8.1  S CURVES IN TESTING


    There are a few S curves used in testing. Cumulative defects arrived is the first
    curve. This is also called the reliability growth curve. This curve ends in a
    plateau zone beyond which further testing does not find defects. The product is
    said to have become stable, as far as we know, and can be shipped. Cumulative
    test cases executed is another S curve. The pattern of this S curve tells a lot
    about the nature and quality of test progress. Experienced testers can interpret
    this pattern and take appropriate decisions.


    # Human Productivity


    From the view of project management, we look at defects found per tester. The
    result is used to provide feedback to testers and hence improve test results.
    Defect discovery rate is one of the metrics used as an index of team productivity.


    # Requirement Stability


    Testing closely follows requirements. Test cases mirror use cases. Hence, the
    biggest uncertainty in testing is requirement stability. This is measured and
    tracked. The requirement stability index (RSI), also called requirement volatility,
    is defined as follows:


    RSI = (Original req + Req changed + Req added + Req deleted) / Original req


    RSI is a metric that might already exist in the metrics system developed for the
    entire development project. One has just to reuse it.


    # Resource Utilization


    From an operational perspective, resource utilization is a key metric. This metric
    is extended to tools, systems, and people.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Customer Satisfaction


    Eventually, testing is a service. Customer satisfaction must be measured by conducting
    surveys to improve service quality.


    # Test Effectiveness


    This metric captures the percentage of defects found by testing. Of course, the
    stretch goal of the test team is to reach 100% effectiveness. The metric is defined
    as follows:


    Test effectiveness = Defects found by tests / Defects found by tests + Defects
    found by business users


    # BOX 8.2 MEASURING THE RETURN ON INVESTMENT OF TEST AUTOMATION


    It is good to automate test cases. Test automation needs creativity. Carefully
    directing test automation will result in cost saving. To make sure that automation
    is kept profitable, we introduce a metric ROI of test automation.


    Regression tests can be automated; the ROI is great. When manual testing is difficult
    or impossible, automation is required. The simulation of a test scenario is difficult
    manually and is best performed through automation. In special cases such as testing
    a firmware, automation is the only way. In testing middle layers with missing
    upper or lower layers, automation is the only way.


    Investment on automation may yield benefits beyond the current project. The tool
    must be generic enough to accommodate the needs of different projects. The tool
    need not aim at solving the requirements of a single project; it must be planned
    to address the needs of upcoming projects. It is an organizational asset.


    ROI from automation may vary from two to ten, typically.


    # Process Metrics


    The testing process is managed with several metrics, continuously tracked during
    testing life cycle. A few of them are cumulatively graphed to derive deeper meanings.'
  merge: -1
