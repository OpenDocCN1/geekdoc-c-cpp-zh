- pgno: 31
  md: 'Even lower-scale data can be graphed. For example, a bar graph on discovered
    defect types can be very instructive. Most categorical variables are plotted as
    bar graphs and pie charts, and they make a lot of sense.


    The graphs must be interpreted. A picture is worth a thousand words; but each
    one needs a few words of explanation articulating the context and meaning. Commentaries
    on graphs are rare; it may perhaps be assumed that truth is self-evident in the
    graphs. However, it makes a huge difference to add a line of comment to a graph.


    # BOX 1.1 SHOW ME A GRAPH


    This organization was dedicated to software maintenance. Every month, a huge list
    of change requests are received. The operations manager found “backlog” a burning
    issue. The backlog seemed to grow every month. After due contemplation, he devised
    a simple management technique to address this issue. He suggested a simple pie
    chart report at the end of every month. The pie chart showed distribution of bugs
    according to the following category:


    +   a. Bugs taken up—complex category

    +   b. Bugs taken up—simple category

    +   c. Bugs analyzed but found as nonissues

    +   d. Bugs in queue—yet to be taken up

    +   e. Bugs delivered


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_31_0.png)


    The pie chart had a noteworthy consequence. The backlog queue dwindled, and more
    bugs were fixed monthly. Later, the manager happened to'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'know about “visual management” and ascribed success of the pie chart to visual
    management.

    The pie chart was so simple and yet so effective; it soon became a weekly report
    and became very popular. The pie chart turned the company around.


    # Numerical Descriptive Statistics

    (Numerical Summary of Data)


    The numerical summary of data has a standard set of statistics. There is a difference
    between data and statistic. Data are a result of measurement. Statistic is a result
    of statistical processing of data. There is a prerequisite for doing descriptive
    statistics. We need a set of observations—a sample of data points—to prepare a
    numerical summary. A few components should have been made or a few executions
    of a process should have been made before we think of a numerical summary. This
    constraint is not imposed on graphs. Data 1.1 presents the data sample and shows
    the effort variance data in a typical development project.


    What does the data mean? Quantitative reasoning begins with a statistical inquiry
    into effort variance. What is the center of the process? What is the range of
    the process? Is the process data symmetrical as one would expect, or is it skewed?
    Does the process have a strong peak or is it flat? The answers to such queries
    are formally available in the form of some basic statistics. These statistics
    have been computed for the effort variance data using the Excel Data Analysis
    Tool “Descriptive Statistics.” Data 1.2 presents the report from this tool.


    Data 1.1  Effort Variance Data (%)

