    # BOX 9.2 MEDICAL ANALOGY: MRI SCAN AND PULSE READING


    A doctor asks for an MRI scan of the head to treat a headache. He wants to eliminate
    possible cause: clots in the brain. The MRI scan is a costly and elaborate procedure.
    The doctor is going through a causal analysis. The scan is normal, and the doctor
    pursues further causes of the headache, with the cost paid by the patient through
    trial and error. Finally, the patient could not be cured of his headache.


    The patient decides to take naturopathy treatment. The skilled doctor reads his
    pulse, understands the problem, and suggests physiotherapy exercises and yoga
    for a month. The patient is cured.


    Agile metrics are similar to reading the pulse. Data are cheap, simple, and quick;
    the solution is self-healing. The pulse reading reveals more to a trained doctor
    than the MRI scan.


