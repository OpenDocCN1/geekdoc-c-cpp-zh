  md: '# Defect Removal Efficiency


    This metric is used in a special context in testing projects. There are other
    definitions for this metric in other contexts. Defect removal efficiency (DRE)
    in testing means the number defects removed per unit time, defined as follows:


    DRE = Number of defects / Detection time + Resolution time + Retesting time


    The inverse of this number is called defect turnaround time (TAT), defined as
    follows:


    TAT = 1 / DRE


