- pgno: 154
  md: 'Software requirements are broken into small features called *user stories*.
    The story point scale is used to judge the size of “user stories.”


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_154_0.png)


    > *User stories are analogous to the classical use cases.*

    > *Story Points are analogous to Use Case Points.*


    # Technical Debt


    Number of defects discovered per iteration.


    # Tests


    The number of tests that have been developed, executed, and passed to validate
    a story.


    # Level of Automation


    The percentage of tests automated.


    # Earned Business Value (EBV)


    Business value attached to stories delivered. According to Dave Nicolette, “EBV
    may be measured in terms of hard financial value based on the anticipated return
    on investment (ROI) prorated to each feature or user story.”


    # Burn-Down Chart


    Burn down represents the remaining work of the project versus the remaining human
    resources. This information can be presented every week until a complete release.
    Burn-down chart is a famous agile visual used to track progress. Figure 9.1 shows
    an example of a burn-down chart.


    A common practice is to plot a burn-down chart for every team and for each iteration.
    This provides the necessary biofeedback to teams to control backlog and to attain
    iteration goals in time.


    # Burn-Up Chart


    Burn up represents work finished. Figure 9.2 illustrates a burn-up chart (BUC).


    The y-axis is a cumulative plot of stories developed iteration by iteration. The
    ideal performance line is plotted along the actual performance line to provide
    guidance and to measure performance gaps. The BUC can be used when several stories
    are developed concurrently. This is a chart of stories built and work done; this
    records achievement and not merely activities.'
  merge: -1
  img_proc: true
