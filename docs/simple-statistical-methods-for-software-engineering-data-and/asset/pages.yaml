- pgno: 220
  md: '# BOX 13.1 ORIGINS OF A SOCIAL LAW


    Normal distribution has cast its influence in almost every field of life and research.
    It has gained the status of a social law.


    French-born British mathematician Abraham de Moivre (1667–1754) published *A Doctrine
    of Chance: A Method of Calculating the Probabilities of Events in Play* in 1718,
    wherein he addressed the gambling problem. The third edition appeared in 1756;
    it contained the approximation to the binomial distribution by the normal distribution.


    > de Moivre actually had written the equation down in 1708; obtained it as a limit
    of coins tossing or binomial distribution. We think of a coin being tossed ‘n’
    times, and note the proportion of k heads. After many k-fold trials, we obtain
    a graph showing the number of occasions on which we get 0 heads, 1 head, 2 heads,
    … n heads. The curve will peak around the probability of getting heads with the
    coin. As the number of tosses ‘n’ grows without a bound, a normal distribution
    results [1].


    de Moivre’s concern was with games of chance, and his discovery showed the power
    of sampling to determine patterns in a population by examining only a few members.
    He spent the last part of his life by solving problems of chance for gamblers
    as the resident statistician of Slaughter’s Coffee House in London.


    In 1809, German mathematician and astronomer Johann Carl Friedrich Gauss (1777–1855)
    showed that errors of measurement made in astronomical observations followed a
    symmetric distribution called *normal distribution*. Gauss was also the first
    to develop the utility of the normal distribution curve, which had been discovered
    earlier by de Moivre. This distribution is now often called *Gaussian*.


    > The curve was developed by observational astronomers who used the ideas of normal
    distribution to verify the accuracy of measurements. They measured a distance
    many times and graphed the results. If most measurements clustered around the
    mean, then the average of the results could be considered reliable. Outliers or
    deviant measurements could be discounted as inaccurate [2].'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'The normal distribution has been studied under various names for nearly 300
    years. To the historically inclined, it is Laplace’s second law, Gaussian law,
    or Laplace–Gaussian curve. The names law of deviation and error curve could make
    more sense to experimenters. Pearson, Fisher, and Galton have called it the normal
    curve, the name greatly favored by statisticians.


    Today, in statistics books, we tend to call this the normal distribution. In the
    world of science, the favored name is Gaussian distribution.


    the distribution. There is no separate shape parameter because the shape is fixed:
    it is a bell shape.


    ```

    F(x,μ,σ) = 1/√(2πσ) e^(-(x-μ)²/(2σ²))  (13.2)

    ```


    where μ is the mean (location parameter), and σ is the standard deviation (scale
    parameter).


    Mean and standard deviation are part of descriptive statistics, discussed in Chapter
    1. For any data set, we can estimate these two parameters. The equation is a natural
    sequel.


