    Estimate = (1O + 4ML + 1P) / (1 + 4 + 1)

    ```


    Expert judgment of a milestone schedule (days) is shown in Table 2.2. A proper
    estimate is obtained by applying weighted average.


    In the previous example, the arithmetic mean is 50 days, and the weighted mean
    is 45 days.


    # Robust Means


    The robust estimate of the mean is less affected by extreme values.


    # Trimmed Mean


    Arithmetic mean breaks down if an extreme value is introduced. Even the presence
    of one extreme value can change this mean. In other words, it has a 0 breakdown
    point.


    Trimming data gives us robust estimates of the mean, in the sense that the mean
    is resistant to changes in outlier data. Calculating the arithmetic mean after
    removing x% of data in the lower side and x% of data in the higher side will lead
    us to x% trimmed mean. Practically, x% can vary from 3% to 25%; x% is also called
    breakdown point.


    In schools, the mean score of a class is calculated after removing 5% from the
    top and 5% from the bottom scores. It is 5% trimmed mean.


    In process management, trimming is not a very straightforward step. Trouble in
    the process is normally revealed in the outliers. We identify outliers and do
    root cause analysis on them for process improvement. We cannot mindlessly discard
    extreme values while data cleaning. We can trim data to find a robust expression
    for central tendency, but the removed data have meaning elsewhere and need to
    be stored.


    For more on trimmed means, refer to the thesis by Wu [3].'
