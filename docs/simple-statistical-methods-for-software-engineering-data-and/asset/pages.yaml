- pgno: 215
  md: '7. Kim et al. [12] find that the GO model can be applied to safety critical
    software, although


    it is generally known that software reliability growth models such as the Jelinski-Moranda
    model and the Goel–Okumoto’s non-homogeneous Poisson process (NHPP) model cannot
    be applied to safety-critical software due to a lack of software failure data.


    Their analysis confirms the fear: the estimated total number of inherent software
    faults varies from 27.32 to 34.83 for the GO model as the software failure numbers
    change from 24 to 34. Results are sensitive to the number of failure data points.


    8. Lin and Huang [13] finds the Weibull model better than the GO model in a special
    application but chooses to refer to the GO model as a benchmark.


    9. Gokhale and Trivedi [14] propose an enhanced NHPP, called the mean value function,
    as a coverage function and use the log logistic function instead of exponential
    to get better results than the GO model.


    # BOX 12.5 RARE BASEBALL EVENTS


    Huber and Glen [15] have studied three sets of rare baseball events—pitching a
    no-hit game, hitting for the cycle, and turning a triple play—which offer excellent
    examples of events whose occurrence may be modeled as Poisson processes. From
    1901 to 2004, there have been 206 no-hitters, 225 cycles, and 511 triple plays.
    The associated mean values per year have been calculated as follows:


    +   No-hitter = 1.98.

    +   Cycle = 2.16.

    +   Triple plays = 4.91.


    The above mean values characterize the respective Poisson distributions. The researchers
    have also calculated mean interarrival times as follows:


    +   No-hitter = 772 games.

    +   Cycle = 720 games.

    +   Triple play = 316 games.'
