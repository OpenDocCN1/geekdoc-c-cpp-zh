- pgno: 79
  md: '# Seeing Process Drift


    If the median is not on a process target value, we can say that the process has
    drifted. The amount of drift can be easily seen if we draw a target line on the
    box plot. Figure 4.3 shows a box plot of bug repair time. The corporate goal is
    to fix bugs within a maximum of 16 days. The goal is marked on the box plot for
    easy interpretation.


    # Detecting Skew


    The box plot is an eloquent way of expressing problems in process. One can see
    clearly if the process results are skewed. If the median is in the middle of the
    box, data are not skewed. If the median shifts to the right, data are left skewed.
    If the median shifts to the left, data are right skewed. Another sign of skew
    is the length of whisker. If the right whisker is longer, as seen in Figure 4.3,
    the process is skewed to the right.


    # Seeing Variation


    The width of the box is a measure of process variation. Box width shows variation
    with 50% confidence level. The whisker-to-whisker width also expresses variation,
    perhaps with better clarity and more dramatic effect. The whisker-to-whisker range
    is an expression of variation with confidence levels more than 90%. In Figure
    4.3, the whisker-to-whisker range is from 6 to 45 days. The variation is far in
    excess of what is anticipated.


    ![](img/2f042205c6c0e14747f198ed8f9c9f40_79_0.png)


    Figure 4.3 Box plot of bug repair time, days.'
  merge: -1
