- pgno: 116
  md: 'When use cases are known, by assigning different weight factors to different
    actor types, we can calculate use case point. This metric can be set up early
    in the project and used as an estimator of cost and time. Technical and environmental
    factors can be incorporated to enrich the use case point for estimation.


    Similarly, when test cases are developed, a metric called *test case point* (TCP)
    can be developed by assigning complexity weights to the test cases. The sum of
    TCP can be used to estimate effort and schedule.


    Alternatively, we can measure object points based on screens and reports in the
    software.


    Use case points, test case points, and object points are variants of functional
    size. They can be converted into FP by using appropriate scale factors.


    > *Measure functional size as the project starts.*

    > *This will bring clarity into requirements and help in the estimation of cost,
    schedule and quality.*


    Once functional size is measured, the information is used to estimate manpower
    and time required to execute the project. This is conveniently performed by applying
    any regression model that correlates size with effort. COCOMO is one such model,
    or one can use homegrown models for this purpose.


    There is a simpler way to estimate effort. We can identify the type of software
    we have to develop. Yong Xia identifies five software types: end-user software
    (developed for the personal use of the developer), management information system,
    outsourced projects, system software, commercial software, and military software.
    On the basis of type, we can anticipate the FP per staff month, which can vary
    from 1000 to 35 [9]. Using this conversion factor, we can quickly arrive at the
    effort estimate. Once effort is known, we can derive time required, again by using
    available regression relationships.


    Early metrics capture functional size and arrive at effort estimates; measurement
    and estimation are harmoniously blended.


    # Project Progress Using Earned Value Metrics


    # Tracking Progress


    Whether one builds software or a skyscraper, earned value metrics can be used
    to advantage. To constrict earned value metric, we need to make two basic observations:
    schedule and cost are measured at every milestone.


    The first achievement of EVM is in the way it distinguishes value from cost. Project
    earns value by doing work. Value is measured as follows:


    > *Budgeted cost of work is its value.*'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_117_0.png)


    # Figure 6.3 Tracking project progress.


    In EVM terminology, this is referred to as *budgeted cost of work*. From a project
    plan, one can see how the project value increases with time. The project is said
    to “earn value” as work is completed. To measure progress, we define the following
    metrics.


    Planned value = budgeted cost of work scheduled (BCWS)

    Earned value = budgeted cost of work performed (BCWP)


    An example of project progress tracked with these two metrics is shown in Figure
    6.3.


    At a glance, one can see how earned value trails behind planned value, graphically
    illustrating project progress. This is known as the *earned value graph*.


    # Tracking Project Cost


    The actual cost expended to complete the work reported is measured as the actual
    cost of work performed (ACWP). Cost information can be included in the earned
    value graph, as shown in Figure 6.4.


    In addition to the earned value graph, we can compute performance indicators such
    as project variances and performance indices. We can also predict the time and
    cost required to finish the project using linear extrapolation. These metrics
    are listed in Data 6.1.


    An earned value report would typically include all the earned value metrics and
    present graphical and tabular views of project progress and project future.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_118_0.png)


    # Figure 6.4 Tracking project cost.


    # Data 6.1 Earned Value Metrics


    Core Metrics


    +   - Budgeted cost of work scheduled (BCWS) (also planned value [PV])

    +   - Budgeted cost of work performed (BCWP) (also earned value [EV])

    +   - Actual cost of work performed (ACWP) (also actual cost [AC])


    Performance Metrics


    +   - Cost variance = PV – AC

    +   - Schedule variance = EV – PV

    +   - Cost performance index (CPI) = EV/AC

    +   - Schedule performance index (SPI) = EV/PV

    +   - Project performance index (PPI) = SPI × CPI

    +   - To complete schedule performance index (TCSPI)


    Predictive Metrics


    +   - Budget at completion = BAC

    +   - Estimate to complete (ETC) = BAC – EV

    +   - Estimate at completion (EAC)

    +     - EAC = AC + (BAC – EV) Optimistic

    +     - EAC = AC + (BAC – EV)/CPI Most likely

    +     - EAC = BAC/CPI Most likely*simple (widely use d)

    +     - EAC = BAC/PPI Pessimistic

    +   - Cost variance at completion (VAC) = BAC – EAC


    The project management body of knowledge (PMBOK) treats earned value metrics as
    crucial information for the project manager. Several standards and guidelines
    are available to describe how EVM works. For example, the EVMS standard released
    by design of experiments (DOE) utilizes the EVMS information as an effective project
    management system to ensure successful project execution.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# BOX 6.4 WHY IS SIZE METRIC MISSING?


    We measure the size of what we build. If we construct a house, we measure the
    floor area. If we build a truck, we measure its length, height, and breadth, among
    other parameters. Size measurement is a hallmark of engineering.


    When we build a software, we are reluctant to measure size. Some of us do not
    measure size at all. This is a disappointment for we have failed to uphold software
    engineering. Come to think of it, it is rather easy to measure size. If we find
    IFPUG function point or FFP time consuming and cumbersome, especially for large
    modules, we have alternatives to choose from. For example, we can use any of the
    following established metrics:


    +   - Albrecht function point

    +   - Mark II FP

    +   - Object point

    +   - Test case point

    +   - Use case point

    +   - PROBE

    +   - Feature point


    Doug Hubbard’s book titled *How to Measure Anything* [10] can help to overcome
    mental barriers in measuring things considered impossible to measure. He observes
    that the perceived impossibility of measurement is an illusion caused by not understanding
    the concept of measurement, the object of measurement, and the methods of measurement.


    You can build your own proprietary size metric. Some have constructed engineering
    size unit as a metric. Others have invented requirement size unit. Homegrown complexity
    metrics are doing the rounds as well. Having an approximate size metric is infinitely
    better than not having one.


    # Review Questions


    +   1. Mention your choice of a product metric in software development.

    +   2. Mention your choice of a process metric in software development.

    +   3. Mention your choice of a project metric in software development.

    +   4. Mention your choice of a process for establishing subprocess metrics. Identify
    and list the subprocess metrics for the process you have selected.

    +   5. Why is function point a success?'
