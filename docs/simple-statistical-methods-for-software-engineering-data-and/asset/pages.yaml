    For each release, the faults were always heavily concentrated in a relatively
    small number of files. For example, they find that in a certain release, 10% of
    files account for 68% of the faults. Interestingly, they find that in a certain
    release, a small number of files contain more code; a small number of files contain
    more code.


    In yet another example, Murgia et al. [3] studied the defects in two open source
