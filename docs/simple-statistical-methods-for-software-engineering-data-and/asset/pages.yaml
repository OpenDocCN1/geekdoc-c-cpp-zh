    the central tendency, which is exactly the mean.


    # BOX 11.3 TESTING RELIABILITY USING NEGATIVE BINOMIAL DISTRIBUTION


    To test reliability, we randomly selected and run test cases covering usage. Executing
    a complete test library is costly, so we resort to sampling. We can choose inverse
    sampling and choose and execute test cases randomly until a preset number of defects
    are found (unacceptable defect level). If this level is reached, the software
    is rejected. Using regular sampling and under binomial distribution, we can do
    an acceptance test, but we might require to execute a significantly large number
    of test cases to arrive at an equivalent decision. Inverse sampling under NBD
    is more efficient in user acceptance testing.


    With this information, we can construct the negative binomial distribution of
    defects. The salient overall point of the comparison is that, unless the software
    is nearly perfect, the negative binomial mode of sampling brings about large reductions
    in the average number of executions over the binomial mode of sampling for identical
    false rejection and false acceptance risks [1].'
