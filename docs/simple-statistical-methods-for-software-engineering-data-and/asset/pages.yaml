- pgno: 134
  md: '+   3. Self-regulation—a system evolution process is self-regulating with distribution
    of product and process measures close to normal.

    +   4. Conservation of organizational stability (invariant work rate)—the average
    effective global activity rate in a system is invariant over product lifetime.

    +   5. Conservation of familiarity—a system evolves all associated with it; developers,
    sales personnel, and users, for example, must maintain mastery of its content
    and behavior to achieve satisfactory evolution. Excessive growth diminishes that
    mastery. Hence, the average incremental growth remains invariant as the system
    evolves.

    +   6. Continuing growth—the functional content of a system must be continually
    increased to maintain user satisfaction over its lifetime.

    +   7. Declining quality—the quality of a system will appear to be declining unless
    it is rigorously maintained and adapted to operational environment changes.

    +   8. Feedback system evolution processes constitute multilevel, multiloop, and
    multiagent feedback systems and must be treated as such to achieve significant
    improvement over any reasonable base.


    # Review Questions


    +   1. What is the most important metric in adaptive (enhancement) maintenance?

    +   2. What is the most important metric in corrective maintenance?

    +   3. What is the most important metric in perfective maintenance?

    +   4. Which among the previously mentioned three metrics is the toughest to collect?

    +   5. If you were to design a dashboard for a support project and if you were
    asked to limit the number of metrics to just seven, which seven would you choose?


    # Exercises


    +   1. Develop a metrics list for a support project if the adaptive–corrective–perfective
    maintenance task ratio is 3:10:2.

    +   2. Develop a metrics list for an exclusive support contract for the perfective
    maintenance of software with an express goal of improving maintainability.


    # References


    +   1. NESMA, Function Point Analysis for Software Maintenance Guidelines, Version
    2.2.1, Professional Guide of the Netherlands Software Metrics Users Association,
    Netherland 2009.'
