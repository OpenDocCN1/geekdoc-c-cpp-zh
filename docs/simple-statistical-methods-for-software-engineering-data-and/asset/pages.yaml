- pgno: 114
  md: 'specification limits does not have meaning. Delay should be measured in real
    time. The cost of time depends on the context. For example, a single day delay
    in software delivery to large Aerospace Systems may incur huge costs. Where thousands
    of vendors are involved, scheduled delay can have catastrophic cumulative effects.
    Thus, the following metric must be used:


    ```

    Schedule slip = (actual schedule – planned schedule) in days

    ```


    The time loss must then be converted into monetary loss. Dollars lost due to schedule
    slip is a better metric than the percentage of process compliance. A 1-day slip
    might translate into millions of dollars in some large projects. Customers may
    levy sizable penalty on schedule slips.


