    # BOX 13.2 IS THE BELL CURVE FAIR?


    The power of the bell curve is linked to the central limit theorem (CLT): sample
    means tend to be normally distributed as sample size N tends to be large. French
    mathematician Pierre-Simon Laplace rescued the CLT from the nearly forgotten work
    of Abraham de Moivre and published it in his monumental work Théorie Analytique
    des Probabilités. In 1901, Russian mathematician Aleksandr Lyapunov defined it
    in general terms and proved precisely how it worked mathematically [3].'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Sir Francis Galton described the CLT as follows [4]:


    > I know of scarcely anything so apt to impress the imagination as the wonderful
    form of cosmic order expressed by the “Law of Frequency of Error.” Whenever a
    large sample of chaotic elements are taken in hand and marshaled in the order
    of their magnitude, an unsuspected and most beautiful form of regularity proves
    to have been latent all along.


    The actual term central limit theorem was first used by George Pólya in 1920 in
    the title of a paper. Pólya referred to the theorem as central because of its
    importance in probability theory [5].


    According to Le Cam, the French school of probability interprets the word central
    in the sense that “it describes the behaviour of the centre of the distribution
    as opposed to its tails” [6].


    Between 1870 and 1913, Markov, Chebyshev, and Lyapunov contributed to CLT. During
    1920 to 1937, Lindeberg, Feller, and Lévy perfected the CLT [7].


    CLT sets the context for a bell curve paradigm. The science of measurements presents
    another truth. Whatever we measure, we make repetitions to make measurements credible,
    and we measure the bell curve of the measured parameter. The limit or peak of
    the bell curve is the truth. The tails denote errors. Criticism of the bell curve
    as a grading curve (by some educationalists) is ill founded. The bell curve represents
    data and cannot be made responsible for hypothesis.


    To sum it up, the bell curve represents truth better than isolated data.


    # Estimation Error


    Variance metrics is a double-edged sword. On the one side, it measures how well
    a plan is executed; on the other side, it measures how well a project is estimated.
    If applied to estimation, this metric can be renamed as the percentage of estimation
    error.


    When processes mature, estimation errors tend to be the curve shown in Figure
    13.5. Estimation errors are measurement errors; they resemble the astronomical
    measurement errors used by Gauss when he discovered a path breaking application
    of normal distribution. This is true in the case of size estimation, schedule
    estimation, and effort estimation and even defect count estimation; errors in
    all these are Gaussian.'
  merge: -1
  img_proc: true
