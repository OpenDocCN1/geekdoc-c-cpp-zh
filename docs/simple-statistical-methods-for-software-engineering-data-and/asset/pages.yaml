  md: '# METRICS

    II


    Deriving metrics from data is the key to observation and understanding. Metrics
    endow people with objective observations and deeper understanding. In Section
    II of this book, Chapter 5 is devoted to deriving metrics from data to gain this
    advantage.


    Common metrics for all life cycle phases are not an effective approach. Compartmentalizing
    metrics helps. A simple way of doing this is to separately discuss development
    metrics, maintenance metrics, and test metrics. Chapters 6, 7, and 8 are devoted
    to these three categories of metrics.


    The advent of agile methods has redefined the way life cycles are managed and
    measured. Chapter 9 addresses agile metrics.'
