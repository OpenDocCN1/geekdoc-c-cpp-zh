  md: '# Chapter 14


    # Law of Compliance:

    Uniform Distribution


    In sharp contrast to the bell curve, the uniform distribution looks plain, flat,
    and simple but has some interesting applications. There are no tails in the uniform
    distribution. There is no peak either. Uniformly distributed processes are rare
    in manufacturing, but nearly uniformly distributed processes exist in IT services.


    Uniform distribution is a continuous distribution bounded between two limits,
    A and B. The probability density function (PDF) may be stated as follows:


    ```

    F(x) = 1 / (A - B)   for A ≤ x ≤ B    (14.1)

    ```


    The plot of uniform distribution, shown in Figure 14.1, is a rectangle.


    Hence, uniform distribution is also known as the rectangular distribution. It
    may be recalled that by integrating a PDF, we get a cumulative distribution function
    (CDF). It is also known that when we integrate a rectangle, we get a triangle.
    In this case, the PDF is rectangle. Integrating the PDF, we get a triangle which
    is the CDF. Obviously, the CDF is a triangle.


    The PDF has the following statistics:


    +   Mean = (A + B)/2

    +   Median = (A + B)/2

    +   Range = B - A

    +   Variance = (B - A)² / 12'
  merge: -1
  img_proc: true
