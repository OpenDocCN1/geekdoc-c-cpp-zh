- pgno: 167
  md: "# BOX 10.2 HISTORY OF HISTOGRAMS\n\nThe word “histogram” is of Greek origin,\
    \ as it is a composite of the words “istos” (= “mast”) and “gram-ma” (= “something\
    \ written”). Hence, it should be interpreted as a form of writing consisting of\
    \ “masts,” i.e., long shapes vertically standing, or something similar. The term\
    \ “histogram” was coined by the famous statistician Karl Pearson to refer to a\
    \ common form of graphical representation. Histograms were used long before they\
    \ received their name, but their birth date is unclear. It is clear that histograms\
    \ were first conceived as a visual aid to statistical approximations. Bar charts\
    \ most likely predate histograms and this helps us put a lower bound on the timing\
    \ of their first appearance.\n\nYannis Ioannidis\nDepartment of Informatics and\
    \ Telecommunications, University of Athens\n\n# Process Signature\n\n> Our humanity\
    \ rests upon a series of learned behaviors, woven together into patterns that\
    \ are infinitely fragile and never directly inherited.\n> \n> Margaret Mead\n\n\
    Data of process performance can be converted into histogram signatures. These\
    \ process signatures represent process characteristics. They are used to manage\
    \ processes.\n\n+   1. *Process stability:* Histogram can be applied to test process\
    \ stability. Stable processes produce histograms with a single peak.\n+   2. *Mode:*\
    \ Histogram reveals process mode.\n+   3. *Multiple peaks:* If data come from\
    \ a mixture of several processes, we will see multiple peaks in the histogram.\n\
    +   4. *Cluster analysis:* If data have natural clusters, histograms show them.\n\
    +   5. *Outliers:* Histogram can easily show outliers.\n+   6. *Natural boundary:*\
    \ Histogram reveals natural process boundaries that can be used in goal setting.\n\
    \nThe histogram in Figure 10.5 is an example of process signature. It captures\
    \ the way time to repair is managed in projects and presents a broad summary of\
    \ historic performance."
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/2f042205c6c0e14747f198ed8f9c9f40_168_0.png)


    # Figure 10.5 Process signature histogram of time to repair.


    This is a typical experience in fixing high-priority bugs without any SLA constraint.
    The team treats high-priority bugs with utmost earnestness and tries to ship the
    fix at the earliest. The histogram is skewed and has a thick tail on the right
    side. There is a sure probability that the repair time would be high.


    Beaumont [3] shows a more disciplined histogram for time to repair. The dispersion
    is far less. Barkman et al. [4] present histograms for 16 selected metrics in
    open source projects. (Data have been collected from 150 distinct projects with
    over 70,000 classes and over 11 million lines of code.) This is really a gallery
    of histogram signatures; entries range from well-behaved symmetrical histograms
    to extremely skewed ones. The signature structures typically represent the metrics.
    These patterns are more or less the same across the entire IT industry.


    # Uniqueness of Histogram Signature


    Histograms are true signatures.


    > Process histograms reflect people.

    > Product histograms reflect design.


    People leave their signatures in their deliveries. The uniqueness of histograms
    can be used to advantage. Software Engineering Institute (SEI) has presented a
    series of histograms that change with the maturity of the organization from level
    2 to level 5 in their several communications. Process histogram is a signature
    of an organization’s maturity. Well-constructed histograms with the right metrics
    can be used as more precise signatures that can be used to compare and predict
    performance.'
