    \ at the state level, time is measured more precisely using a digital stopwatch.\
    \ In Olympic sprints, time is measured by laser systems controlled by computers\
    \ to the precision of a millisecond. As the capability of running improves, the\
    \ precision of measurement also is improved. Likewise, when software engineering\
    \ practices become more mature, metric capability also is improved. The quality\
    \ of metric data also is improved. Metrics and maturity go together.\n\n# Meaning\
    \ of Metrics: Interpreting Metric Data\n\nWe define a metric by defining the relationship\
    \ the metric has with raw data. Metric definition inheres the meaning of that\
    \ metric. The defining equation is more significant than the name we give to a\
    \ metric. Names could mislead, but definitions do not. It is good to recall metric\
    \ definitions, even if obvious, before beginning interpretation.\n\nHaving recalled\
    \ the metric definition, we now look at metric data. It is better to work with\
