    deterioration can be modeled by gamma distribution. The occurrence of earthquakes
    is a Poisson process (see Chapter 12, Law of Rare Events), but cumulative wear
    is a gamma process. Structure reliability is obtained by estimating the probability
    of cumulated damage exceeding the threshold (based on Iervolino and Chioccarelli
