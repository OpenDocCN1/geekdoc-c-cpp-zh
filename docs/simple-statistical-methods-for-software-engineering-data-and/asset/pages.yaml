  md: "On the same metric, we can pose another inverse problem. If we reject 5% of\
    \ events on either side of the Gaussian distribution, what is the range of requirement\
    \ volatility within the acceptable region? The upper rejection point has a cumulative\
    \ probability of 0.95 and the corresponding x value is as follows:\n\n```\nNORMINV(0.95,\
    \ 3.3, 4) = 9.879%\n```\n\nThe lower rejection point has a cumulative probability\
    \ of 0.05, and the corresponding x value is as follows:\n\n```\nNORMINV(0.05,\
    \ 3.3, 4) = -3.279%\n```\n\nTherefore, requirement volatility has a range defined\
    \ by the interval [-3.279, 9.879] when 5% of events are rejected in both tails.\
    \ Sometimes it helps to discard extreme ends of the mathematical function and\
    \ consider the truncated interval as the practical dispersion. User’s judgment\
    \ is required to decide on how much to cut off. Typically, people choose any one\
    \ of 1%, 5%, and 10% truncations. The truncated range accordingly shrinks in progression.\
    \ When it comes to determining range, it depends on how the problem gets formulated.\
    \ Whatever be the formulation, the Gaussian can provide a simple and ready answer.\n\
    \n> The formulation of the problem is often more essential than its solution,\
    \ which may be merely a matter of mathematical or experimental skill.\n> \n> Albert\
    \ Einstein\n\n# BOX 13.4 IS THERE AN AVERAGE MAN?\n\nA landmark in the history\
    \ of the bell curve is the notion of the average man put forward by Lambert Adolphe\
