    be viewed as varying about a normal state in a manner to be accurately described
    by beautiful bell-shaped curves of perfect symmetry but of varying amplitude.
    Thus, it is that the individual varies about his normal self and the members of
    a group vary about their average. In social physics, the bell curve represents
    the true mechanics of human history.


    The average man is free from excess and defect. Nature is striving to produce
    the average man but fails because of the interference from a multitude of causes
    [9].


    Lesson learned: By analogy, likewise, the industry strives to achieve ideal processes
