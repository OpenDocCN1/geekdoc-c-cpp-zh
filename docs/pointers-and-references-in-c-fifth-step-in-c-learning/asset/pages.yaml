    To decrement a pointer, we use the — operator. This moves the pointer to the previous
    element based on the size of the pointed data type. Again, since ptr is an int*,
    decrementing it moves the pointer back to the previous integer in the array.


    Pointer arithmetic is based on the size of the pointed data type because it allows
    the compiler to correctly calculate the memory address to which the pointer should
    point after an increment or decrement. When you increment or decrement a pointer,
    the compiler automatically takes into account the size of the data type the pointer
    is pointing to. This ensures that the pointer moves to the correct memory location.


    In the example program, we use pointer arithmetic to access different elements
    of the array by moving the pointer forward or backward based on the size of int,
    which is typically 4 bytes. You can see how the pointer is incremented or decremented
    by 1 or multiple positions to access different elements in the array.


    Note: It’s important to exercise caution when performing pointer arithmetic to
    avoid accessing memory outside the valid range of the array, as it can lead to
    undefined behavior and potential crashes.'
