  md: "# Pointer Arithmetic\n\nHere’s an example program in C++ that demonstrates\
    \ arithmetic operations on a pointer variable:\n\n```\n#include <iostream>\n\n\
    int main() {\n    int numbers[] = {1, 2, 3, 4, 5};\n    int* ptr = numbers;  //\
    \ Pointer to the first element of the array\n\n    // Increment the pointer and\
    \ access the next element\n    ptr++;  // Moves the pointer to the next integer\
    \ in the array\n    std::cout << \"Next element: \" << *ptr << std::endl;\n\n\
    \    // Decrement the pointer and access the previous element\n    ptr--;  //\
    \ Moves the pointer back to the previous integer in the array\n    std::cout <<\
    \ \"Previous element: \" << *ptr << std::endl;\n\n    // Perform arithmetic operations\
    \ on the pointer\n    ptr += 2;  // Moves the pointer two positions forward\n\
    \    std::cout << \"Element at index 2: \" << *ptr << std::endl;\n```"
