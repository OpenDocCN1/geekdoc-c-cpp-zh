  md: "# Reference to Member Variable in Lambda Capture\n\nHere’s an example program\
    \ that demonstrates capturing a member variable of a class in a lambda function\
    \ through a reference:\n\n```\n#include <iostream>\n\nclass MyClass {\npublic:\n\
    \    MyClass(int value) : myMember(value) {}\n\n    void doOperation() {\n   \
    \     int multiplier = 2;\n        auto lambda = [this, &multiplier]() {\n   \
    \         myMember *= multiplier;\n            std::cout << \"Inside lambda: myMember\
    \ = \" << myMember << std::endl;\n        };\n\n        lambda();\n        std::cout\
    \ << \"After lambda: myMember = \" << myMember << std::endl;\n    }\n}\n```"
