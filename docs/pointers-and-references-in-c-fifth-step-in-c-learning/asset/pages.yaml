    Pointers in C++ are variables that store memory addresses. They allow you to indirectly
    access and manipulate data stored in memory. When you declare a pointer variable,
    you need to specify the type of data it will point to by using the appropriate
    type specifier (e.g., int* for an integer pointer).


    To assign the address of a variable to a pointer, you use the address-of operator
