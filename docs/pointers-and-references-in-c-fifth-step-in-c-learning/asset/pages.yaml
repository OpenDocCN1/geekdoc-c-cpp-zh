    # Advantages of passing variables by reference in C++:


    +   1. Modifying the original variable: When a variable is passed by reference
    to a function, any modifications made to that variable within the function will
    directly affect the original variable in the calling code. In the example above,
    the modifyValue function modifies the original number variable, and we can see
    the changes reflected in the main function.

    +   2. Efficiency: When passing large objects or structures by value, a copy of
    the entire object is made, which can be inefficient in terms of memory usage and
    performance. However, passing by reference avoids this overhead since only the
    reference to the object is passed, rather than creating a new copy.

    +   3. Avoiding unnecessary object copying: Some objects may not be copyable due
    to the absence of a copy constructor or an expensive copy operation. By passing
    such objects by reference, we can avoid the need for copying altogether.

    +   4. Multiple returns or output values: Functions can return only a single value,
    but by passing variables by reference, we can effectively return multiple values
    or modify multiple variables within a single function call.'
