    Now, let’s discuss the similarities and differences between pointers and references
    in C++:


    # Memory Usage:


    +   - Pointers: Pointers hold memory addresses as their values. They require additional
    memory to store the address they are pointing to.

    +   - References: References are aliases for variables. They do not occupy additional
    memory because they refer directly to the object they are referencing.


    # Syntax:


    +   - Pointers: Pointers are declared using the asterisk (*) symbol. They need
    to be dereferenced using the asterisk symbol to access the value they are pointing
    to.

    +   - References: References are declared using the ampersand (&) symbol. They
    do not require any special syntax to access the value they refer to.


