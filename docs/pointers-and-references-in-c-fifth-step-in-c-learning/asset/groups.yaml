    \ value 变量。\n\n## Pointer to Constant\n\n下面是一个 C++ 程序，演示了指向常量的指针的概念以及它如何强制只读访问：\n\
    \n```\n#include <iostream>\n\nint main() {\n    int value = 5;\n    const int*\
    \ ptr = &value;  // Pointer to a constant integer\n\n    std::cout << \"Value:\
    \ \" << *ptr << std::endl;\n\n    // Attempting to modify the value pointed by\
    \ the pointer\n    *ptr = 10;  // Compilation error: assignment of read-only location\n\
    \n    return 0;\n}\n```\n\n在这个程序中，我们声明一个整型变量 value 并将其初始化为 5。然后，我们声明一个类型为“指向常量整型的指针”的指针\
    \ ptr，使用 const 关键字。指针声明中的 const 关键字\n\n表示不能通过该指针修改指针所指向的值。\n\n当我们尝试使用 `*ptr =\
    \ 10` 赋值来修改值时，程序无法编译。它会生成一个编译错误，提示“assignment of read-only location”。此错误发生的原因是指针\
    \ ptr 指向一个常量值，尝试修改常量值违反了指针强制的只读访问。\n\n指向常量的指针提供了一种机制来强制对它所指向的数据进行只读访问。它确保不能使用该指针修改指针所指向的值。这在你想将数据传递给函数或在代码的多个部分共享数据，同时确保其保持不变的场景中很有用。\n\
    \n通过将指针声明为 `const int*`，你向编译器做出承诺，不会通过该指针修改值。这允许编译器执行额外的优化并保证常量数据的完整性。\n\n## Constant\
    \ Pointer\n\n下面是一个 C++ 示例程序，声明了一个常量指针并尝试修改它所指向的内存地址：\n\n```\n#include <iostream>\n\
    \nint main() {\n    int number = 5;\n    int* const ptr = &number;  // Declare\
    \ a constant pointer and initialize it with the address of 'number'\n\n    std::cout\
    \ << \"Value of number: \" << *ptr << std::endl;\n    std::cout << \"Memory address\
    \ stored in ptr: \" << ptr << std::endl;\n\n    // Attempt to modify the memory\
    \ address stored in ptr\n    // Uncommenting the line below will cause a compilation\
    \ error\n    // ptr = nullptr;\n\n    // Modify the value stored at the memory\
    \ address pointed by ptr\n    *ptr = 10;\n}\n```\n```cpp\nstd::cout << \"Modified\
    \ value of number: \" << *ptr << std::endl;\n\nreturn 0;\n}\n```\n\n在这个程序中，我们使用\
    \ int* const 语法声明了一个名为 ptr 的常量指针。这意味着 ptr 是一个指向整数的指针 int*，并且是常量 const。它使用 & 运算符初始化为变量\
    \ number 的内存地址。\n\n常量指针 ptr 强制使用固定的内存位置，因为一旦初始化，就不能修改它以指向不同的内存地址。此限制由 const 限定符强制执行。\n\
    \n在程序中，如果你取消注释行 ptr = nullptr;，你会遇到编译错误，因为这是尝试修改常量指针 ptr 的值。然而，你仍然可以使用解引用运算符 *\
    \ 修改 ptr 所指向的内存地址处存储的值。在示例中，我们通过赋值 *ptr = 10; 修改了 number 的值。这是可以的，因为常量指针 ptr 只强制固定的内存位置，而不是该位置存储的值。\n\
    \n运行程序时，你会看到 number 的值已通过常量指针 ptr 成功修改。\n\n## Pointer to Constant vs. Constant\
    \ Pointer\n\n下面是一个 C++ 程序，演示了指向常量的指针和常量指针之间的区别：\n\n```\n#include <iostream>\n\n\
    int main() {\n    int value = 10;\n    int anotherValue = 20;\n\n    // Pointer\
    \ to a constant\n    const int* ptrToConst = &value;\n    std::cout << \"Pointer\
    \ to a constant:\" << std::endl;\n    std::cout << \"Memory Address: \" << ptrToConst\
    \ << std::endl;\n    std::cout << \"Pointed Value: \" << *ptrToConst << std::endl;\n\
    \n    // Uncomment the line below to see the compilation error\n    // *ptrToConst\
    \ = 5; // Error: Assignment of read-only location\n\n    // Constant pointer\n\
    \    int* const constPtr = &value;\n    std::cout << \"\\nConstant pointer:\"\
    \ << std::endl;\n```\n```\nstd::cout << \"Memory Address: \" << constPtr << std::endl;\n\
    std::cout << \"Pointed Value: \" << *constPtr << std::endl;\n\n// Uncomment the\
    \ line below to see the compilation error\n// constPtr = &anotherValue; // Error:\
    \ Assignment of read-only variable\n\nreturn 0;\n}\n```\n\n## Explanation:\n-\
    \ 1. Pointer to a constant (const int* ptrToConst): This means that the value\
    \ being pointed to is constant and cannot be modified through the pointer. The\
    \ pointer itself is not constant and can be reassigned to point to different memory\
    \ addresses. In the example, ptrToConst points to the memory address of value.\
    \ The pointed value can be accessed but not modified through this pointer. If\
    \ you uncomment the assignment *ptrToConst = 5;, it will result in a compilation\
    \ error because it attempts to modify the value.\n- 2. Constant pointer (int*\
    \ const constPtr): This means that the pointer itself is constant and cannot be\
    \ reassigned to point to a different memory address. However, the value being\
    \ pointed to can be modified. In the example, constPtr is a constant pointer that\
    \ points to the memory address of value. The pointed value can be accessed and\
    \ modified through this pointer. If you uncomment the assignment constPtr = &anotherValue;,\
    \ it will result in a compilation error because it attempts to reassign the constant\
    \ pointer.\n\nIn summary, a pointer to a constant allows you to modify the pointer\
    \ itself but not the pointed value, while a constant pointer allows you to modify\
    \ the pointed value but not the pointer itself.\n\n"
