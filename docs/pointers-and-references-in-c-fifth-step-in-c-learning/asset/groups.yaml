    要初始化指针，我们将其赋值为函数的地址。例如，`pFunc = Add;` 将 Add 函数的地址赋给指针 pFunc。这使得 pFunc 指向 Add 函数。\n\
    \n要通过指针调用函数，我们只需使用指针名称后跟括号并提供必要的参数即可。例如，`result = pFunc(5, 3);` 调用 pFunc 指向的函数，参数为\
    \ 5 和 3，并将结果赋给 result 变量。\n\n在示例中，我们首先通过指针调用 Add 函数执行加法，然后将指针改为指向 Subtract 函数。我们通过指针调用\
    \ Subtract 函数执行减法，并再次获得结果。\n\n请注意，函数指针可用于实现动态分派，并且在需要根据某些条件或用户选择在运行时选择并调用不同函数的情况下特别有用。\n\
    \n## Pointer to Member Variable\n\n下面是一个演示 C++ 中指向成员变量的指针用法的示例程序：\n\n```cpp\n\
    #include <iostream>\n\nclass MyClass {\npublic:\n    int myVariable;\n};\n\nint\
    \ main() {\n    MyClass obj;\n    obj.myVariable = 42;\n\n    int MyClass::*ptr\
    \ = &MyClass::myVariable;  // Declare a pointer to a member variable\n\n    //\
    \ Accessing the member variable directly\n    std::cout << \"Value of myVariable\
    \ (direct access): \" << obj.myVariable << std::endl;\n\n    // Accessing the\
    \ member variable through the pointer\n    std::cout << \"Value of myVariable\
    \ (pointer access): \" << obj.*ptr << std::endl;\n\n    // Modifying the member\
    \ variable through the pointer\n    obj.*ptr = 100;\n\n    std::cout << \"Modified\
    \ value of myVariable: \" << obj.myVariable << std::endl;\n\n    return 0;\n}\n\
    ```\n\n在该程序中，我们有一个名为 MyClass 的类，其中包含一个公共成员变量 myVariable。在 main() 函数内部，我们创建了一个名为\
    \ obj 的 MyClass 实例，并将 myVariable 的值设置为 42。\n\n要声明指向成员变量的指针，我们使用语法 `type_of_member\
    \ Class::*ptr_name`。在此例中，我们声明 `int MyClass::*ptr`，表示 ptr 是指向 MyClass 类的整数成员变量的指针。\n\
    \n要直接访问成员变量，我们使用对象名 obj 后跟成员变量名 myVariable。这是访问成员变量的常规方式。\n\n要通过指针访问成员变量，我们使用对象名\
    \ obj 后跟指针名 ptr 和指针到成员运算符 `.*`。这种语法允许我们通过指针间接访问成员变量。\n\n在程序中，我们演示了直接和通过指针访问及修改成员变量。最后，我们打印\
    \ myVariable 的修改后值以验证修改是否成功。\n\n程序的输出为：\n\n```text\nValue of myVariable (direct\
    \ access): 42\nValue of myVariable (pointer access): 42\nModified value of myVariable:\
    \ 100\n```\n\n正如你所见，直接访问和通过指针访问产生相同的结果。语法上的区别在于访问成员变量时使用指针到成员运算符 `.*`。\n\n## Pointer\
    \ to Member Function\n\n下面是一个演示如何在 C++ 中声明和使用指向成员函数的指针的示例程序：\n\n```cpp\n#include\
    \ <iostream>\n\nclass MyClass {\npublic:\n    void myFunction() {\n        std::cout\
    \ << \"Hello from myFunction!\" << std::endl;\n    }\n};\n\nint main() {\n   \
    \ // Declare a pointer to member function\n    void (MyClass::*functionPtr)()\
    \ = &MyClass::myFunction;\n\n    // Create an instance of MyClass\n    MyClass\
    \ obj;\n\n    // Access member function through the pointer\n    (obj.*functionPtr)();\n\
    \n    // Call member function directly\n    obj.myFunction();\n\n    return 0;\n\
    }\n```\n\n在该程序中，我们有一个类 MyClass，其中包含成员函数 myFunction()。\n\n要声明指向成员函数的指针，你需要指定类类型和函数签名。声明指向成员函数的指针的语法如下：\n\
    \n```cpp\nreturn_type (Class::*pointer_name)(arguments);\n```\n\n在我们的示例中，我们声明了一个名为\
    \ functionPtr 的指针，指向 MyClass 的成员函数，该函数不带参数且返回 void。\n\n要将成员函数的地址赋给指针，你使用 & 运算符后跟类名和函数名：\n\
    \n```cpp\nfunctionPtr = &MyClass::myFunction;\n```\n\n要通过指针访问成员函数，你需要使用 `.*` 或\
    \ `->*` 运算符。在我们的例子中，由于我们有一个 MyClass 的实例 obj，因此我们使用 `.*` 运算符：\n\n```cpp\n(obj.*functionPtr)();\n\
    ```\n\n当通过指针调用成员函数时需要这种语法，因为它明确指定了应调用该成员函数的对象。\n\n另一方面，直接调用成员函数不需要使用指针，并遵循调用成员函数的常规语法：\n\
    \n```cpp\nobj.myFunction();\n```\n\n程序的输出为：\n\n```text\nHello from myFunction!\n\
    Hello from myFunction!\n```\n\n对 myFunction() 的两次调用产生相同的结果，但一次是通过指向成员函数的指针 ((obj.*functionPtr)())\
    \ 进行的，另一次是直接调用 (obj.myFunction())。语法上的差异是由于通过指针调用成员函数时需要明确指定对象。\n\n## Pointer\
    \ to Member Function and Polymorphism\n\n在 C++ 中，你可以使用指向成员函数的指针来实现运行时多态。运行时多态允许你通过基类指针调用派生类成员函数，从而在运行时实现函数的动态绑定。下面是一个演示此概念的示例程序：\n\
    \n```cpp\n#include <iostream>\n\nclass Base {\npublic:\n    virtual void display()\
    \ {\n        std::cout << \"This is the Base class\" << std::endl;\n    }\n};\n\
    \nclass Derived : public Base {\npublic:\n    void display() override {\n    \
    \    std::cout << \"This is the Derived class\" << std::endl;\n    }\n};\n\nint\
    \ main() {\n    Base baseObj;\n    Derived derivedObj;\n\n    Base* ptr = nullptr;\n\
    \n    // Point the base class pointer to the derived class object\n    ptr = &derivedObj;\n\
    \n    // Call the display() function using the pointer to achieve polymorphism\n\
    \    ptr->display();\n\n    return 0;\n}\n```\n\n在此示例中，我们有一个基类 Base 和一个从 Base\
    \ 继承的派生类 Derived。display() 函数在基类中声明为 virtual，并在派生类中被重写。\n\n在 main() 函数中，我们创建了基类和派生类的对象。我们还声明了一个类型为\
    \ Base 的指针 ptr。\n\n通过将派生类对象 derivedObj 的地址赋给 ptr 指针 (ptr = &derivedObj;)，我们可以实现多态。这是因为\
    \ display() 函数在基类中声明为 virtual，允许根据指针在运行时指向的对象的实际类型调用正确的函数。\n\n当我们使用 ptr->display()\
    \ 调用 display() 函数时，程序将调用派生类的 display() 函数而不是基类的函数，因为指针指向的是派生类对象。\n\n此程序的输出为：\n\
    \n```text\nThis is the Derived class\n```\n\n"
