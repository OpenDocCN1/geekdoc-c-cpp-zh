  mdcn: "\n在 C++11 及更高版本中，您可以使用 `using` 关键字代替 `typedef`，以提高清晰度和可读性。\n\n## SegFormer：基于\
    \ Transformer 的简单高效语义分割设计\n\nEnze Xie, Wenhai Wang, Zhiding Yu, Anima Anandkumar,\
    \ Jose M. Alvarez, Ping Luo\n\n### 摘要\n\n语义分割是计算机视觉中的一项基础任务。我们提出了 SegFormer，一种简单、高效且强大的语义分割方法，它将\
    \ Transformer 与轻量级多层感知机（MLP）解码器统一起来。SegFormer 有两个吸引人的特性：1) 分层设计，无需位置编码即可提取多尺度特征；2)\
    \ 解耦的编码器-解码器，支持任意分辨率的高效表示。\n\n### 1 引言\n\n语义分割是计算机视觉中长期存在的问题，也是许多应用中的关键组成部分。现有方法通常依赖于基于距离或基于顺序的方法...\n\
    \n![](img/d04caa5ae4a627c620b221e510ce52a5_89_0.png)\n\n```\nvoid displayDerived()\
    \ {\n    cout << \"Derived variable: \" << derivedVar << endl;\n}\n};\n\nint main()\
