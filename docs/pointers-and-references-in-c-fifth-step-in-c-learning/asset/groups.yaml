    \n    // Access derived class member using object\n    derivedObj.derivedVar =\
    \ 20;\n    derivedObj.displayDerived();\n\n    // Access base class member using\
    \ derived class object\n    derivedObj.baseVar = 30;\n    derivedObj.displayBase();\n\
    \n    // Access base class member using pointer\n    Base* basePtr = &derivedObj;\n\
    \    basePtr->baseVar = 40;\n    basePtr->displayBase();\n\n    // Access derived\
    \ class member using pointer\n    Derived* derivedPtr = &derivedObj;\n    derivedPtr->derivedVar\
    \ = 50;\n    derivedPtr->displayDerived();\n\n    // Access base class member\
    \ using reference\n    Base& baseRef = derivedObj;\n    baseRef.baseVar = 60;\n\
    \    baseRef.displayBase();\n\n    // Access derived class member using reference\n\
    \    Derived& derivedRef = derivedObj;\n    derivedRef.derivedVar = 70;\n    derivedRef.displayDerived();\n\
    \n    return 0;\n}\n```\n\n在这个程序中，我们有一个基类 `Base` 和一个继承自 `Base` 的派生类 `Derived`。下面说明如何使用指针和引用来访问基类和派生类的成员：\n\
    \n### 使用对象访问基类成员：\n\n- 我们创建基类 `Base` 的一个对象（`baseObj`），并直接访问其成员变量 `baseVar` 和成员函数\
    \ `displayBase()`。\n\n### 使用对象访问派生类成员：\n\n- 我们创建派生类 `Derived` 的一个对象（`derivedObj`），并直接访问其成员变量\
    \ `derivedVar` 和成员函数 `displayDerived()`。\n\n### 使用派生类对象访问基类成员：\n\n## 指针和引用转换\n\
    \n下面是一个示例程序，演示了在 C++ 中不同类型指针和引用之间的转换：\n\n```\n#include <iostream>\n\nclass Base\
    \ {\npublic:\n    virtual void display() {\n        std::cout << \"Base class\"\
    \ << std::endl;\n    }\n};\n\nclass Derived : public Base {\npublic:\n    void\
    \ display() override {\n        std::cout << \"Derived class\" << std::endl;\n\
    \    }\n};\n\nint main() {\n    // Casting between pointers\n    Derived derivedObj;\n\
    \    Base* basePtr = &derivedObj;\n    Derived* derivedPtr = static_cast<Derived*>(basePtr);\n\
    \    derivedPtr->display();  // Outputs \"Derived class\"\n\n    // Casting between\
    \ references\n    Derived derivedObj2;\n    Base& baseRef = derivedObj2;\n   \
    \ Derived& derivedRef = static_cast<Derived&>(baseRef);\n    derivedRef.display();\
    \  // Outputs \"Derived class\"\n\n    // static_cast\n    float f = 3.14;\n \
    \   int i = static_cast<int>(f);  // Converts float to int\n\n    // dynamic_cast\n\
    \    Base* basePtr2 = new Derived();\n    Derived* derivedPtr2 = dynamic_cast<Derived*>(basePtr2);\n\
    \    if (derivedPtr2 != nullptr) {\n        derivedPtr2->display();  // Outputs\
    \ \"Derived class\"\n    }\n\n    // reinterpret_cast\n    int* intPtr = new int(10);\n\
    \    double* doublePtr = reinterpret_cast<double*>(intPtr);\n    std::cout <<\
    \ *doublePtr << std::endl;  // Undefined behavior, dangerous cast!\n\n    // const_cast\n\
    \    const int constant = 5;\n    int& nonConstRef = const_cast<int&>(constant);\n\
    \    nonConstRef = 10;\n    std::cout << constant << std::endl;  // Outputs \"\
    10\"\n\n    delete basePtr2;\n    delete intPtr;\n\n    return 0;\n}\n```\n\n\
    不同类型的转换说明：\n\n- **1. static_cast**：用于基本类型转换，例如在数值类型之间进行转换，或在继承层次结构中执行向上转换和向下转换。它也可用于相关类型之间的隐式转换。它在编译时执行检查，但不执行运行时类型检查。\n\
    - **2. dynamic_cast**：用于更复杂的类型转换，特别是在多态场景中。它允许在继承层次结构中进行向上转换和向下转换。与 static_cast\
    \ 不同，dynamic_cast 执行运行时类型检查，如果转换失败则返回空指针。它要求涉及的类至少有一个虚函数。\n- **3. reinterpret_cast**：用于无关类型之间的底层不安全转换。它允许你将一种类型的位模式重新解释为另一种类型。使用这种转换时应谨慎，因为它绕过了类型系统，可能导致未定义行为。\n\
    - **4. const_cast**：用于为变量添加或移除 const/volatile 限定符。它通常用于移除变量的 const 属性以修改其值。通过\
    \ const_cast 获得的非 const 引用或指针修改 const 变量会导致未定义行为。\n\n根据具体需求选择合适的转换方式非常重要，并且要理解每种转换的含义和局限性。\n\
    \n## 模板中的指针和引用\n\n下面是一个示例程序，演示了模板类和模板函数中指针和引用的用法：\n\n```\n#include <iostream>\n\
    \n// Template class with a pointer member\ntemplate <typename T>\nclass PointerClass\
    \ {\npublic:\n    PointerClass(T* ptr) : ptr_(ptr) {}\n\n    T* getPointer() const\
    \ {\n        return ptr_;\n    }\n\nprivate:\n    T* ptr_;\n};\n\n// Template\
    \ function that accepts a reference\ntemplate <typename T>\nvoid referenceFunction(T&\
    \ ref) {\n    std::cout << \"Value: \" << ref << std::endl;\n}\n\nint main() {\n\
    \    // Template class with a pointer member\n    int* intValue = new int(42);\n\
    \    PointerClass<int> intPtrClass(intValue);\n    std::cout << \"Pointer value:\
    \ \" << *(intPtrClass.getPointer()) << std::endl;\n\n    // Template function\
    \ that accepts a reference\n    int intValueRef = 10;\n    referenceFunction(intValueRef);\n\
    \n    delete intValue;\n    return 0;\n}\n```\n\n在这个程序中，我们有两个示例：模板类 `PointerClass`\
    \ 和模板函数 `referenceFunction`。\n\n模板类 `PointerClass` 有一个构造函数，它接受一个指针 `ptr` 作为参数并初始化\
    \ `ptr_` 成员变量。它还提供了一个成员函数 `getPointer()`，用于返回存储的指针。\n\n在 `main()` 函数中，我们创建了一个\
    \ `int*` 指针 `intValue`，并用动态分配的整数值初始化它。然后，我们创建模板类 `PointerClass<int>` 的一个实例 `intPtrClass`，并将\
    \ `intValue` 指针传递给其构造函数。最后，我们使用 `getPointer()` 函数打印指针中存储的值。\n\n模板函数 `referenceFunction`\
    \ 接受一个引用 `ref` 作为其参数并打印其值。在 `main()` 函数中，我们创建了一个 `int` 变量 `intValueRef`，并以值 10\
    \ 初始化它。然后调用模板函数 `referenceFunction`，并将 `intValueRef` 作为参数传递。\n\n():\n```\n(*lambdaPtr)(42);\n\
    ```\n\n### 下面是一个演示完整用法的示例：\n\n```\n#include <iostream>\n\nint main() {\n    auto\
    \ myLambda = [](int x) const {\n        std::cout << \"The value is: \" << x <<\
    \ std::endl;\n    };\n\n    auto* lambdaPtr = &myLambda;\n    (*lambdaPtr)(42);\n\
    \n    return 0;\n}\n```\n\n在此示例中，lambda 函数接受整数参数 `x` 并打印其值。该 lambda 使用 `const`\
    \ 限定符声明为常量。然后我们声明一个指针 `lambdaPtr`，指向该常量 lambda。最后，我们通过解引用该指针并传入参数 42 来调用 lambda\
    \ 函数。\n\n请注意，lambda 函数不应从周围作用域捕获任何可能在指针创建后发生变化的变量。否则，尝试通过指针调用该 lambda 可能导致未定义行为。\n"
