    \ `ref`，因此 `original` 也变成了 100。这是因为引用 `ref` 和原始变量 `original` 指向相同的内存位置。\n\n引用提供了访问变量的另一种语法，因为它们的表现类似于原始变量的别名。对引用执行的任何操作都会直接反映在原始变量上，反之亦然。这允许我们在不显式解引用的情况下，用引用变量代替原始变量。\n\
    \n在希望将变量按引用传递给函数，以便在函数作用域内修改原始变量的场景中，使用引用尤其有用。\n\n总的来说，引用提供了一种方便且简洁的方式来处理变量，避免了显式指针解引用的需要，并提供了一种访问和修改值的替代语法。\n\
    \n## 引用初始化\n\n在 C++ 中，引用必须在声明时初始化，并且不能重新赋值以引用另一个变量。下面是一个演示引用初始化的示例程序：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int num1 = 5;\n    int num2 = 10;\n\n\
    \    int& ref = num1; // 用 'num1' 初始化引用变量 'ref'\n\n    std::cout << \"num1: \"\
    \ << num1 << std::endl; // 输出：5\n    std::cout << \"num2: \" << num2 << std::endl;\
    \ // 输出：10\n    std::cout << \"ref: \" << ref << std::endl;   // 输出：5\n\n    //\
    \ 尝试将引用重新赋值给另一个变量\n    // 这将导致编译错误\n    // ref = num2; // 取消注释此行将导致编译错误\n```\n\
    \n```cpp\nreturn 0;\n}\n```\n\n在上述程序中，我们有两个整数变量 `num1` 和 `num2`。我们声明了一个引用变量 `ref`，并使用语法\
    \ `int& ref = num1;` 用 `num1` 的值对其进行初始化。\n\n初始化之后，引用 `ref` 与 `num1` 指向相同的内存位置，对\
    \ `ref` 所做的任何更改也会影响 `num1` 的值。这意味着 `ref` 充当 `num1` 的别名。\n\n尝试将引用 `ref` 重新赋值给另一个变量（如\
    \ `num2`）将导致编译错误，因为引用在初始化后不能重新赋值。一旦引用被初始化，它将在其整个生命周期内保持绑定到同一个对象。因此，示例中注释掉了 `ref\
    \ = num2;` 这一行，以避免编译错误。\n\n通过在声明时强制执行引用初始化，C++ 确保引用始终具有有效且一致的值，防止意外的重新赋值，并提供更安全的编程体验。\n\
    \n## 引用与函数参数\n\n下面是一个 C++ 示例程序，演示了引用作为函数参数的用法：\n\n```cpp\n#include <iostream>\n\
    \n// 使用引用参数修改变量值的函数\nvoid modifyValue(int& num) {\n    num += 10;\n}\n\nint main()\
    \ {\n    int number = 5;\n\n    std::cout << \"Original value: \" << number <<\
    \ std::endl;\n\n    modifyValue(number); // 按引用传递 'number'\n\n    std::cout <<\
    \ \"Modified value: \" << number << std::endl;\n\n    return 0;\n}\n```\n\n在这个程序中，我们定义了一个名为\
    \ `modifyValue` 的函数，它接受一个整数引用参数。该函数将参数的值增加 10。在 `main` 函数中，我们声明了一个初始值为 5 的整数变量\
    \ `number`。然后我们调用 `modifyValue` 函数，将 `number` 作为参数传入。\n\n程序的输出将是：\n\n```\nOriginal\
    \ value: 5\nModified value: 15\n```\n\n### 在 C++ 中按引用传递变量的优点：\n- 1. 修改原始变量：当变量按引用传递给函数时，函数内对该变量所做的任何修改都会直接影响调用代码中的原始变量。在上面的示例中，`modifyValue`\
    \ 函数修改了原始变量 `number`，我们可以在 `main` 函数中看到这些更改。\n- 2. 效率：当按值传递大型对象或结构时，会复制整个对象，这在内存使用和性能方面可能效率较低。然而，按引用传递避免了这种开销，因为只传递对象的引用，而不是创建新的副本。\n\
    - 3. 避免不必要的对象复制：某些对象可能无法复制，例如由于没有拷贝构造函数或复制操作代价昂贵。通过按引用传递此类对象，我们可以完全避免复制的需要。\n\
    - 4. 多个返回值或输出值：函数只能返回一个值，但通过按引用传递变量，我们可以有效地在单个函数调用中返回多个值或修改多个变量。\n\n5. **与调用代码的一致性：**\
    \ 通过按引用传递变量，调用代码不需要改变其变量访问语法。这可以使代码更具可读性和可维护性，尤其是在处理复杂的数据结构时。\n\n将引用用作函数参数提供了一种在\
    \ C++ 中传递变量和对象的强大机制，提供了灵活性、效率以及修改原始变量的能力。\n\n## 指针与引用的对比\n\n下面是一个演示 C++ 中指针和引用之间区别的程序：\n\
    \n```cpp\n#include <iostream>\n\nvoid manipulateValue(int* ptr, int& ref) {\n\
    \    (*ptr)++;    // 递增 ptr 指向的值\n    ref++;       // 递增 ref 引用的值\n}\n\nint main()\
    \ {\n    int value = 5;\n    int* ptr = &value;  // 指向 value 的指针\n    int& ref\
    \ = value;   // 对 value 的引用\n\n    // 打印初始值\n    std::cout << \"Initial value:\
    \ \" << value << std::endl;\n    std::cout << \"Pointer value: \" << *ptr << std::endl;\n\
    \    std::cout << \"Reference value: \" << ref << std::endl;\n\n    // 修改值\n```\n\
    \n"
