  - '[PAGE 33]


    +   - **Pointers:** Pointers can be reassigned to point to different objects or
    be set to a null value (`nullptr`). They can also be used for pointer arithmetic.

    +   - **References:** References cannot be reseated to refer to a different object
    once initialized. They must be initialized with an object and cannot be null.
    References do not support pointer arithmetic.


    # Nullability:


    +   - **Pointers:** Pointers can be null, which means they do not point to any
    valid object.

    +   - **References:** References cannot be null and must be initialized with a
    valid object.


    # Initialization:


    +   - **Pointers:** Pointers can be declared without initialization or be initialized
    later. They can be assigned to the address of an existing object using the address-of
    operator (`&`) or by using the `new` keyword to dynamically allocate memory.

    +   - **References:** References must be initialized at the time of declaration.
    They cannot be assigned to a different object after initialization.


    # Function Parameters:


    +   - **Pointers:** Pointers can be passed as function parameters to allow modification
    of the original object or to achieve pass-by-reference semantics.

    +   - **References:** References can also be passed as function parameters to
    achieve pass-by-reference semantics. They provide a more intuitive syntax and
    avoid the need for pointer dereferencing.


    In the provided example, the `manipulateValue` function takes both a pointer and
    a reference as parameters. It increments the values they point to/refer to. After
    calling the function, you can observe that both the pointer and reference modify
    the original value variable.'
