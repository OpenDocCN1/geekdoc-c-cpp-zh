  md: 'pinNumber: integer specifies which pin is to be accessed.


    status: constant specifying whether pin is to be set to +5v or 0 volts.


    +   HIGH: sets pin to +5 volts.


    +   LOW: sets pin to 0 volts.


    example: digitalWrite(3, HIGH); // sets pin 3 to 5v.


    # Electronics and Ohm''s Law


    Underlying everything the Arduino~ are voltage, current, and resistance. These
    will appear again and again, taking some time to understand what will make future
    challenges easier. Electricity is all about electrons — how many there are, how
    badly they want to get from one place to another, and how difficult it is for
    them to move.


    # Table 4-3. Components of Ohm''s Law


    | | |

    |---|---|

    | Voltage | The difference in electric potential between two points in space,
    measured in volts. How badly electrons want to get from one place to another.
    |

    | Current | A flow of electric charge, measured in amperes (amps). How many electrons
    want to move. |

    | Resistance | The degree of opposition an electrical current will encounter when
    passing through an electrical conductor, measured in ohms. How much electrons
    will encounter in attempting the move. |


    The relationship of this is described by Ohm''s Law:


    Ohm''s Law: V = IR




    where:

    V is voltage, in volts

    I is current, in amps

    R is resistance, in ohms


    The LED is a device made from semiconducting material, usually silicon. In an
    LED it is modified to conduct electrical current easily but only in one direction.
    A problem occurs when the LED is connected to power because the LED has a low
    resistance. A quick look at Ohm''s law shows that if the resistance (R) is low,
    the current (I) will be high.


    For that reason, an LED is always connected to power in series with a resistor,
    usually 220 ohms for a source of +5 volts. This is the value of the resistor used
    in these lessons.


