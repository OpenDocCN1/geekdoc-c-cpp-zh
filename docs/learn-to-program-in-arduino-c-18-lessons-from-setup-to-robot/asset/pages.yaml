  md: '# 0 5


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_98_0.png)


    Figure 9-1. Analog port representation of voltage


    The C language provides a tool for translating analog readings into other scales,
    from 0 to 100 for example. This is called mapping.


    # Analog output


    While it is true that an analog port can accurately measure any voltage from 0
    through +5, the Arduino™ Uno has no way of providing an output voltage in that
    range. The output voltage of an Arduino pin, be it an analog or digital, is +5
    volts or zero, and nothing in between.


    The C language provides a way of writing an analog value that approximates the
    range of 0 through +5 volts. It does not by this switching rapidly between 0 volts
    and +5 volts.


    If the output of a pin is +5 volts half the time and 0 volts the other half, the
    average voltage is 2.5 volts. Not only that, but an LED attached to that pin will
    produce as much light when the average voltage is +5 volts.


    By modifying the ratio of the time the output pin is +5 volts to the time it is
    at 0 volts, the average output voltage can be set to any value from zero through
    +5 volts.


    The process of repeatedly setting an output pin HIGH for a fixed time then returning
    it to LOW is called pulsing. A single rise, wait, and fall cycle of the output
    voltage is called a pulse. The length of time the pulse is HIGH is the pulse width.
    Finally, using pulses alternating with periods of LOW output is pulse width modulation.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_98_1.png)


    Figure 9-2. Pulse width modulation with average voltage +2.5 v'
  merge: -1
  pgno: 98
- img_proc: true
  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_99_0.png)


    Figure 9-3. Pulse width modulation with average voltage +1.25 v


    Not all digital pins of the Arduino Uno can be pulsed. Those that can are indicated
    on the Arduino™ by a tilde mark ( before the pin number. There are six such pins:
    3, 5, 6, 9, 10, and 11.


    Table 9-1. Vocabulary


    | Term | Definition |

    | --- | --- |

    | analog | A thing that is representative of the state of another thing. In this
    lesson, the read value for a potentiometer will be a number between 0 and 1023.
    The actual number is analogous to the rotation of the shaft of the potentiometer.
    The farther it is turned the higher the number |

    | duty cycle | The length of that specified pin is HIGH vs. LOW; duty cycle is
    expressed as a percentage. |

    | mapping | The determination of a number within a range based on another number
    and its range. If the number 8 is between 1 and 12 the mapped number between 100
    and 160 is 140. The proportions are the same. |

    | pulse | The setting of a pin from LOW to HIGH for a specific time then returning
    it to LOW. |

    | pulse width | The length of that pulse is HIGH. |

    | pulsing | Repeatedly sending an output pin HIGH for a fixed time then returning
    it to LOW. |

    | pulse width modulation | Using pulses alternating with periods of LOW output.
    |

    | potentiometer | A variable resistor, usually disk shaped with a knob that may
    be turned to select the resistance |


    # Description:


    Although they are related, reading an analog value from an analog pin is different
    from writing an analog value, which is sent to a digital output pin capable of
    sending pulses.


    Learn to Program in Arduino™: 18 Lessons, from setup() to robots'
