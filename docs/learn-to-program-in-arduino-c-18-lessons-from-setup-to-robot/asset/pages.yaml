  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_142_0.png)


    # Figure 13-3. Cycle within a portion of a pulse


    > These modulation cycles may be thought of as pulses within pulses. The IR itself
    is the time the IRED is on. When it is on it is actually turning on and off very
    rapidly. This rapid on and off is the modulation.


    Why 13 microseconds, followed by 13 microseconds? It''s math.


    +   Step 1: Calculate the time for one cycle:


    ```

    tcycle = 1 / 38000 cycles / second

    = 2.6 x 10⁻⁵ seconds / cycle

    = 26 x 10⁻⁶ seconds / cycle

    = 20 µs / cycle

    ```


    +   Step 2: Assume a symmetrical cycle. This means the time on must equal the
    time off.


    ```

    t_on = 13 µs

    t_off = 13 µs

    ```


