  md: '# How-To #3: Make and Use a Motor Controller Shield


    The Arduino™ single-board computer can be used to control servos and motors. But
    sometimes more current is required than the Arduino™ can provide, because the
    motors demand high current or because the applications require multiple motors
    to operate at the same time.


    The motor controller shield constructed in this How-To is an inexpensive way to
    deliver adequate current to simultaneous control of several motors and servos.
    Each motor can have this current delivered at a regulated six volts or the voltage
    provided by a power source plugged into the power connector of the Arduino.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_227_0.png)


    Figure HT3-1. Motor controller shield


    The shield also provides a small prototyping board for adding related components
    such as infrared navigation, remote control, infrared lights, and sounds.


    A special two-row header permits the addition of the H-bridge breakout board described
    in How-To #7, enabling control of two DC motors or a stepper motors or a single
    stepper motor.


    # Background:


    Many of the devices made with the Arduino™ involve motion. Wheels turn, propellers
    spin, arms reach out, pincers grip, and flags wave. The devices that cause these
    motions are called motors. The shield built in these instructions is designed
    to control the types of motors commonly found in robotics.


    These motors can be divided into three groups:


    Group 1: Motors that move back and forth. These are called servos. Typical uses
    are to raise and lower elevators on an aircraft and to open and close arms on
    a robot. The direction and amount of motion is specified by the width of a pulse
    sent by the Arduino.


    Servos used with an Arduino™ are usually designed for six volts.


    Group 2: Motors that spin but are controlled by the Arduino™ as they are servos.
    These, in turn, fall into two subgroups: continuous rotation servos and motors
    controlled with electronic speed controllers (ESCs).


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Continuous rotation servos: these are servos similar in appearance to those
    that move back and forth have been modified to move a certain amount in one direction
    without returning. They are often used as propulsion for small robots, such as
    the Boe-bot or the Parallax Corporation. As with other servos, the continuous
    rotation usually requires six volts.


    ESC-controlled motors: these are motors that are connected to the Arduino via
    an electronic speed controller, a special device that uses pulses from the Arduino
    to select the direction and speed of the motor. The controlled motor, in turn,
    connects to the ESC and not to the Arduino” itself.


    Because the ESC controls the delivered current, ESC-controlled motors can be high
    power and high speed. Such motors are used to turn the propellers of model airplanes
    and the wheels of larger, powerful model cars.


    Group 3: Motors that spin clockwise or counterclockwise, depending on the polarity
    of their connection to their power source, and whose speed depends by the average
    voltage. Proper operation of these motors requires a special control circuit called
    an H-bridge. The yellow motors used in the rolling robot of Lessons 15 and 18
    are examples of such motors.


    What is important to notice is that all the types of motors in groups 1 and 2
    are controlled in the same way. Regardless of their task, moving the rudder of
    an airplane or spinning the propeller that powers it, these motors appear to the
    Arduino” as servos and are programmed as shown in Lesson 11.


    This shield can control up to four of these motors. Group 3 motors, by contrast,
    are programmed as shown in Lesson 14.


