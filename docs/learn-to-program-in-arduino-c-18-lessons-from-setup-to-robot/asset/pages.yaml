  md: '# Lesson 13 Infrared Transmitters


    # The Big Idea:


    In Lesson 12 the ability to detect infrared radiation modulated at 38,000 Hertz
    was added to the Arduino.. This lesson brings the ability to generate modulated
    infrared. The two can be used in combination to make a system that can detect
    nearby objects and obstacles. IR is transmitted, and the IR sensor looks for reflections.


    Lesson 15 uses a pair of generators and sensors to add the ability to turn away
    from (or toward) an obstacle. But this has many uses. Model railroad enthusiasts,
    for example, can detect trains. Elevators use these combinations to determine
    the precise position of the door relative to the floor.


    Figure 13-1 shows a pair of infrared transmitter/receivers used by some Sears
    garage door openers to detect the presence of small children and pets.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_140_0.png)


    # Background:


    About infrared transmission


    By now the light-emitting diode (LED) is familiar. It is simply a semiconductor
    device that can emit electromagnetic radiation in the frequencies of visible light.
    Semiconductor technology makes up most of what is referred to as electronics.
    In addition to diodes, this family of devices includes transistors and integrated
    circuits, the building blocks of computers including the ATmega 328 that is the
    heart of the Arduino Uno.


    An infrared transmitter is almost exactly the same as an LED. It, too, is a diode
    that emits electromagnetic radiation. But the frequencies of this radiation are
    just below the red end of the visible light spectrum. This is the range named
    infrared. The term "infra" is Latin meaning "below."


    Because of the similarity to the LED, the infrared diode is referred to as'
