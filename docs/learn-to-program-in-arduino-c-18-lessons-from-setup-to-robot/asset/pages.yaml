    # Exercise 11-2. Increase and decrease LED brightness according to degree


    Add an LED that increased brightness as the servo angle approaches 0 degrees and
    dims as the angle approaches 180 degrees. The LED should be dark at 180 degrees
    and full brightness at 0 and fade evenly over the values in between.


    Keep in mind the following:


