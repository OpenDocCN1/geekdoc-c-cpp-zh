    device. The text should appear in the Serial Monitor.


    22. Enter text in the top field of the Serial Monitor, then click Send. That text
    should appear in the UART application.


    Congratulations! You have established text communication between the robot and
    a smart phone / tablet.


    # Configure for Robot


    BTLERobotNameAndPINSetup is a sketch that allows you to personalize the Bluefruit
    LE device to make it easier to identify in a list of Bluetooth LE devices and
    to require entry of a four-digit PIN before turning control of the robot.


    23. In the same manner as used for the BTLETerminal sketch, download and install
    the BTLERobotNameAndPINSetup sketch.


    24. Open the sketch via File -> Sketchbook. Verify that two file tabs are visible:
    BTLobotNameAndPINSetup and BluefruitConfig.h


    25. Verify the constants in BluefruitConfig.h. These should be the same as in
    BluefruitConfig,h in the BFLETerminal sketch.


    26. Make certain the Bluefruit LE device is properly connected to the Arduino™
    and the Arduino™ to the computer.


    27. Select the communications protocol in BTLERobotNameAndPINSetup for software
    UART for a Bluefruit LE UART Friend or hardware SPI for Bluefruit LE SPI Friend.


    28. Upload the sketch, open the Serial Monitor, and follow the instructions that
    appear.


    # Control Robot


    29. In the same manner as used for the BTLETerminal sketch, download and install
    the BTLERobotControl sketch.


    30. Open the sketch via File -> Sketchbook. Verify that three file tabs are visible:
    BTLERobotControl, BluefruitConfig.h, and RobotControl.'
