  md: "7. Upload strandtest to your Arduino™ The NeoPixels should provide a rather\
    \ entertaining display. All five LEDs should light, flash, and change color.\n\
    \n# Writing your own sketches\n\nThe strand is fun, but the real reason for the\
    \ NeoPixel library is to provide programming tools for making your own color patterns.\
    \ To this end, the AdaFruit library provides the following methods:\n\n# Constructor\n\
    \nUse this method to create an object to communicate with your string of NeoPixels:\n\
    \n```\nAdafruit_NeoPixel(unsigned int numberOfNeoPixels,\n  byte pinNumber,\n\
    \  byte flags)\n```\n\nwhere\n\n+   numberOfNeoPixels is the number of NeoPixels\
    \ to be controlled\npinNumber is the Arduino™ pin connected to the first NeoPixel\
    \ in the string\nflags specifies the color order and communication data rate.\
    \ These are dependent on the type of NeoPixel being used. These are defined as:\n\
    \n```\nNEO_GRB = green blue then red\nNEO_RGB = red green then blue\nNEO_KHZ400\
    \ = 400 kilohertz\nNEO_KHZ800 = 800 kilohertz\n```\n\nExample HT8-1.\nAdafruit_NeoPixel\
    \ myPixels = Adafruit_NeoPixel(5, 6,\nNEO_RGB + NEO_KHZ800);\n\n# Other methods\n\
    \nUpdate the entire string of NeoPixels to the values in the sketch. No color\
    \ or brightness settings appear on any NeoPixels until this method is called.\n\
    \n```\nvoid show()\n```\n\nExample HT8-2.\n\n```\nmyPixels.show()\n```\n\nInitialize\
    \ communication with the NeoPixels. This method typically is called from the Arduino™\n\
    setup() method.\n\n```\nvoid begin()\n```\n\nLearn to Program in Arduino™ C: 18\
    \ Lessons, from setup() to robots"
