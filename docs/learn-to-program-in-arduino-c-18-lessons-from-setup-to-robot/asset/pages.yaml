  md: 'To avoid such ambiguity, a digital pin for input is usually preset to a default
    state. This lesson uses a resistor, called a pull-up resistor, to place +5 volts
    on an input pin. The default state for that pin, then, is HIGH.


    A push button or other device can be connected directly between that pin and ground.
    Pushed, the state of the digital pin immediately drops to LOW.


    # Table 8-1. Vocabulary


    | Term | Definition |

    | --- | --- |

    | closed circuit | A circuit with a path for electrical current to travel from
    +5 volts to ground. |

    | ground | The zero-voltage counterpart to +5 volts. Electrical current will flow
    between +5 volts and ground. On Arduino™, the three ground pins are marked GND.
    These pins are electrically identical and their use interchangeable. |

    | open circuit | An electrical circuit that does not provide a complete path from
    +5 volts to ground. Often, a switch is part of a circuit in such a way that it
    is set off the circuit is open. |

    | pull-up resistor | A high-value resistor, usually 10,000 ohms, connected between
    a digital pin and +5 volts to that pin HIGH by default.


    # Description:


    Before a sketch is written to test a digital pin and an LED on or off, based on
    the results, a circuit must be wired that includes a push button, some resistors,
    an LED, and some connections to the Arduino.


    For now, assume the digital pin 12 is connected to the push button and the LED
    to be lit or extinguished is connected to digital pin 5.


    # The electronics


    The wiring on an LED and its current-limiting resistor were covered in Lesson
    4. The push button, access to voltage on the Arduino™, and the pull-up resistor
    are new.


    # The push button


    The push buttons used in these lessons have four legs and, when used on a breadboard,
    are inserted straddling the channel that runs lengthwise down the center. The
    legs, or pins, are electrically connected when the button is pushed but not connected
    when it is not pushed.


    On is referred to as closed circuit and off as open circuit.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_87_0.png)


    Figure 8-1. Push button


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
