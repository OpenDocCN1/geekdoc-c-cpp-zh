  md: '# Lesson 8 Digital Input, If Else


    # The Big Idea:


    This lesson adds the ability of an Arduino™ sketch to respond to its environment,
    taking different actions for different situations. If some condition is true,
    then execute one set of programming statements. If it is not, then execute a different
    set.


    # Background:


    With the sole exception of reading text and sending it back to the Serial Monitor,
    all of the Arduino™ sketches so far have been passive. No information has been
    sensed from the world outside the Arduino™. Nor has any sketch made any decisions
    based on outside information.


    But the ability to receive and send information is essential for any useful robotic-type
    application of the Arduino. A robot that can navigate a maze is an upcoming, must
    be able to sense the walls. A quadcopter must sense tilt, roll, yaw, altitude,
    and direction. A musical instrument needs to know which keys are pressed and be
    able to sense the information needed to generate the appropriate sounds.


    This ability to sense and receive is referred to as Input / Output, or IO for
    short. The mechanics, electronics, and programming of IO is often specified in
    industry standards, in order for devices and software from different companies
    to work together. The Arduino Uno offers several of these, including implementations
    of the industry standards TWI, also known as the Inter Integrated Circuit (I2C)
    and Serial Peripheral Interface (SPI).


    This lesson focuses on the simplest of inputs, detection of a voltage at a digital
    pin. If +5 volts is applied to a digital pin, and if that pin''s mode has been
    set to INPUT, then an attempt to read that pin will return a status of HIGH. If
    that pin has no voltage applied, then that same read will return a status of LOW.
    Program commands exist in the C language to set this mode, to read the pins, and
    to test the results.


    These commands will be used to detect the status of a push button. It is either
    pushed or it is not. The results of this reading will be used to turn an LED when
    the button is pushed and when it is not.


    But program commands are not sufficient. Some new electronics are required to
    connect the push button, and some new C-language commands need to be act on the
    results of the pin. These commands are **if** and **else**.


    In this digital pin will have its mode set to INPUT, meaning its state may be
    read with the programming statement `digitalRead()`. If left unconnected to anything,
    a pin will have a state that is unpredictable. Sometimes `digitalRead()` will
    return HIGH and LOW.'
  merge: -1
