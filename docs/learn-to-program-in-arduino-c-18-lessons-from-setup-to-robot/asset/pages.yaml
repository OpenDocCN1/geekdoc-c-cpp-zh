  md: '# # Lesson 6 Serial Input


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_65_0.png)


    #  The Big Idea:


    Information coming into an Arduino sketch is called input. This lesson focuses
    on text in the form of characters that come from the user via the Serial Monitor.
    The Serial Monitor can also be used to send text back to Arduino.


    Background:

    To read the incoming text, the programmer needs to be able to detect that a character
    is ready to be read and have a way to retrieve the waiting character. To do so,
    three new programming statements are introduced. These are:


    +   1. Serial.available() returns the number of characters waiting to be read
    from the serial port.

    2. Serial.read() retrieves a character from the serial port and assigns it to
    a character variable.

    3. if(<condition>) is a means of performing some programming statements if the
    condition evaluates to true.


    Later lessons focus on methods used to transmit information to a sketch running
    on the Arduino, including push buttons, switches, sensors of all sorts, even gravity
    and movement. The Arduino has many ways of respond to that information, including
    movement, lights, sounds, and text liquid crystal panels.


    About Serial

    Serial.println have been used without examining what serial means. Think for a
    moment as Samuel Morse, who is frequently credited with developing the first practical
    electrical telegraph in the United States in the 1830s. Telegraph consisted of
    wire that allowed operators to send and receive messages one at a time. For example,
    to transmit the word "hello" first the letter "h" was sent, then the "e", then
    the "l" (twice), and finally the "o." Each character was identified by a series
    of pulses, some long and some short. Each pulse was sent one at a time.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Table 6-1. Serial communication via Morse Code


    | Letter | Pulses (in order) |

    | h | short short short |

    | e | short |

    | l | short long short short |

    | l | short long short short |

    | o | long long long |


    This is called serial communication because each letter, in fact each pulse for
    each letter, is sent one at a time, in order, first to last.


    If, however the word "hello" were simply written on a card and that card handed
    to the recipient, all letters would be sent and received at the same time. This
    is parallel communication.


    Serial has the advantage over parallel that only a few wires are needed to send
    as much information could be wanted.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_66_0.png)


    The Arduino™ Uno has one serial port. When it is not being used to communicate
    with the IDE''s Serial Monitor, it can transmit data via pin 1 and receive it
    via pin 0. A close look at these ports will reveal they are identified as TX and
    RX.(Other Arduino™ single-board computer models may have more than one. The Arduino™
    Mega, for example, has four serial ports.)


    Figure 6-1. Arduino™ Uno with serial port called out


    # About characters


    So far the Arduino has sent messages to the Serial Monitor using letters, such
    as "Hello, world!" But computers don''t really know anything letters. Rather,
    a computer everything is a number. In order for a letter to appear, two things
    must happen. First, the computer must be given, or select, the number to be representing
    a letter and then be given the instructions necessary to read or display that
    number as a letter.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Table 6-2. Data types


    | Data Type | Description | Examples |

    | --- | --- | --- |

    | char | character, a single letter or number to be interpreted as text | char
    myChar;

    myChar can be set to ''a,'' ''3,'' ''!'', ''B'', and any other character. |

    | int | an integer | int myInt;

    int can be set to 3, 19, -212, and any other integer. |

    | String | a collection of characters | String myStr;

    myStr can be set to "The answer is 42," "Heck no, I won''t go," and any other
    collection of characters. |


    This lesson examines the relationship of characters to the integers used to represent
    them inside the Arduino™. The capital letter A, for example, is stored in the
    Arduino™. Whether the Arduino™ chooses to display it as 65 or the character A
    is determined by the variable it contains is declared. Either way, in binary format
    this number is 01000001. The serial port sends each bit, one at a time. This serial
    communication of the bits [Send] button matches the 65, in turn, to translate
    the letter A is, for the Arduino 16-equivalent of Samuel Morse''s short and long
    pulses of the telegraph.


    # About if testing


    The sketch in this lesson uses a statement, Serial.available(), which returns
    an integer greater or equal to 0. This is the number of characters waiting to
    be read from the serial port after the [Send] button is clicked.


    The keyword if is a test. The result of that must be true or false. In this lesson
    the number returned from Serial.available is tested to see if it is greater than
    zero. If it is, then the statements between the curly braces are executed. Otherwise,
    these statements are skipped.


    Lesson 8 covers if in more detail.


    # Table 6-3. Vocabulary


    | Term | Definition |

    | --- | --- |

    | BIN | BIN is binary, the number used by computers. |

    | DEC | DEC is decimal, which is in common use by people. Its base is 10 symbols,
    0 through 9. |

    | HEX | HEX is hexadecimal, the numbering scheme used by computer science to economically
    represent binary values. It has 16 symbols, 0 through 9 plus A, B, C, D, E, and
    F. |


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
