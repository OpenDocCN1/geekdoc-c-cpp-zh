  md: '# Lesson 2 Communicating with the Arduino™


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_15_0.png)


    # The Big Idea:


    An Arduino™ can be programmed to send messages to receive messages from the computer
    being used to write and upload sketches. A feature called the serial port makes
    this communication possible. This lesson shows how to use the serial port to send
    messages from an Arduino™ sketch and to use a feature of the Arduino IDE called
    the Serial Monitor to view those messages.


    Background:

    Any computer must have, at a minimum, the features listed in Table 2-1.


    Table 2-1. Computer features, purposes, and examples


    | Feature | Purpose | Examples |

    |---|---|--|

    | input | To receive information from to outside world. | Keyboard, mouse, network
    connection, touch screen, voltage sensor |

    | output | To display information or to control devices. | Monitor, lights, printer,
    motor, network connection |

    | processor | To manipulate information. | Intel Core i5, ATMega 328 |

    | storage | To contain programs to be run and data to be accessed. | Memory, hard
    disk, cloud storage |


    # Serial Port


    Arduino™ is a complete computer possessing all of the features listed in Table
    2-1. In this lesson, you will have the opportunity to write your first Arduino™
    sketches. The sketches take advantage of the output ability of the Arduino™ to
    send text to the Arduino™ Integrated Development Environment (IDE) via a built-in
    serial port. This port is composed of electronic components specifically designed
    to send and receive data from another device, in this case a computer via USB,
    some special hardware designed to communicate text. The port can also send data
    out pin 1 of the Arduino and receive it via pin 0. These pins are marked TX for
    transmit and RX for receive.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Serial Port pins


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_16_0.png)


    Figure 2-1. USB connector and pins controlled by the serial port


    The ability of the port to transmit and receive data is very handy. It is especially
    useful for discovering why sketches don''t operate as expected. The process of
    fixing things that are wrong with a sketch is called debugging. A common technique
    for debugging is putting into a sketch the sending of messages to the IDE.


    The Arduino™ Sketch

    To use of the sketch, or any other feature of the Arduino,” a sketch is required.
    A sketch is a collection of instructions for your Arduino.” A specific instruction
    within a sketch is called a programming statement. An example of a statement is
    shown in Example 2-1.


    Example 2-1. Programming statement

    Serial.print("Hello");


    | | Programming statements end with a semicolon. |


    The programming statement in Example 2-1 instructs the Arduino™ to send the word
    "Hello" out of the serial port.


    Statements that, taken together, perform a specific task may be grouped and named.
    Such a group is called a method. A method is a collection of programming statements
    that, when executed in order, perform some subtask to the overall purpose of the
    sketch. If the sketch operates a robot, for example, one subtask is to detect
    surrounding obstacles. Another subtask controls motors. Another detects and decodes
    messages from a remote control. Each of these subtasks appears in the sketch as
    a method. Each method has a name, return type, and some programming statements.'
