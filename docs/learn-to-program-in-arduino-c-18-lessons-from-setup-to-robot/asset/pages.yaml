  md: '# Lesson 1 Microcontrollers and SBCs


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_4_0.png)


    # The Big Idea:


    This book is about computer science.


    It is not about the Arduino,™ the C programming language, electronic components,
    or the mathematics of electricity—even though we refer to them extensively in
    the lessons in this book.


    The Arduino,™ the C programming language, electronic components, and the mathematics
    of electricity are the tools this book uses to teach computer science.


    These tools allow readers to learn by doing, to learn with their hands. Every
    lesson is either an experiment or a project. Some projects, lighting LEDs, for
    example, are simple. Others are complex. Laser tag is an excellent example. But
    simple or complex, none of the projects does anything unless some computer science
    has been applied to bring them to life.


    # Background: What, precisely, is computer science?


    For the purposes of this text, computer science is the application of numbers
    and logic to make devices, algorithms, and languages that, together, can model
    just about anything. This book uses the tools listed in Table 1-1.


    |Table 1-1. Tools this book uses

    | Tool | Description |

    | devices | The Arduino™ family of Single-Board Computers (SBCs). |

    | algorithms | The collection of programming techniques, tools, and libraries
    we use to build our models. |

    | language | The C programming language. |'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'The key word is model. Consider Table 1-2, examples of the uses of models in
    computing.


    # Table 1-2. Examples of models in computing


    | Example | What is modeled | How model connects to world |

    |---|---|---|

    | League of Legends | A fantasy world where characters possess magical and physical
    powers | Players (humans) participate by controlling the actions of some of the
    characters. High quality graphics and game allow the user to suspend disbelief
    and pretend the world is real and that the player is actually being controlled.
    |

    | Digital medical imaging via Magnetic Resonance | The detailed densities of the
    portions of the body being scanned. | By collecting data about movement of molecules
    in response to a changing magnetic field, a model of the scanned object is created.
    This model is presented to the user as startling detailed 2D and 3D images of
    what would be found if the subject operated surgically. |

    | Microsoft Word | The appearance of formatted text as it were typed directly
    onto a piece of paper. | The user can add to and modify both the content and appearance
    of this text and cause a copy of the model to be printed on paper. |

    | Aircraft Autopilot | The stable flight of an aircraft. | The computer collects
    data (speed, direction, physical orientation of the aircraft, altitude) and uses
    the model to control wing surfaces and engine speed. |


    Note that in each case the computer creates and maintains a model. Model might
    be exists in reality or entirely fictional. And the output from the model may
    be information that appears on a screen, instructions that control physical devices,
    or a physical product, such as text or graphics printed on paper or plastic.


    The important takeaway is: **all computer programs are models.**


    The lessons in this book contain experiments and projects that explore concepts
    and build models that control light, sounds, run robots, rotors motors, detect
    and compose messages, and Some of these models will collect and respond to data
    from their environments. Some will provide text as their output, and others will
    control physical devices. But every experiment and project is controlled by an
    Arduino™ running a model of what is being built. And that model will be written
    with the programming language.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
