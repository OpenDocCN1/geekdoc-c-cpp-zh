  md: '# Lesson 15 Infrared Navigation


    # The Big Idea:


    The content of the previous lessons can be combined to make something new. Such
    combinations are called integrating projects. This lesson''s integrating project
    is a rolling robot that combines infrared-emitting diodes (IREDs), infrared sensors,
    resistors, and servos. This robot can detect and turn away from toward obstacles.
    With a different sketch, described in Lesson 18, this robot can be operated from
    an ordinary remote control.


    Background:

    This is the first lesson after integration, combining the contents of the previous
    lessons to make a device that actually does something new. By the end of the lesson,
    you will have assembled completely from scratch a robot capable of detecting and
    avoiding obstacles. The robot motors are a pair of DC motors of the type explored
    in Lesson 14. The infrared illuminates the robot''s path, and the infrared sensors
    of Lesson 12 identify the presence of obstacles. The programming of all the previous
    lessons was in the creation of a sketch that operates the infrared devices, interprets
    what it sees, decides what to do, and executes the decision with commands to the
    motors.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_167_0.png)


    The principles of starting the sketch are pretty simple. If no obstacles are detected,
    the robot moves forward. If an obstacle is detected on one side or to the other,
    the robot turns away from that side. If obstacles are ahead on both sides, the
    robot backs up. One of the exercises calls for adding sophistication to this sketch
    to allow the robot to find its way through a maze.


    Because this is a project that works in a working device, some components need
    to be procured or fabricated. These are:


    +   - A chassis, the box that serves as the robot body. The Arduino, the motors,
    and the rear wheels are attached to the chassis.

    - A navigation circuit board to which the electronic components are connected.
    The motor controller shield or Arduino™ shield described in "How-To #3" works
    well for this project. Because it is a "shield, it plugs nearly into the top of
    the Arduino,” adding a solderless prototyping board and full access to all the
    pins and voltages of the Arduino. Instructions can be found in the How-To section
    of this book and at LearnCSE.com.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 167
- img_proc: true
  md: '3. An H-bridge circuit board to enable the Arduino™ control power delivered
    to the motors. Instructions for this device are in the How-To section of LearnCSE.com.


    4. DC motors with gearing appropriate for a small rolling robot.


    5. Wheels to be attached to the DC motors.


    6. Infrared headlights. These are simply two of the IR headlights assembled for
    Lesson In. Instructions can also be found in “How to Make an Infrareding” on LearnCSE.com.


    As first, the robot will behave as much as any other IR-guided rolling robot,
    such as the Parallax Boe-Bot. The design allows for some important differences.
    Among these are:


    +   1. The robot’s dimensions allows for adoption of other motors, including the
    popular VEX model 393. However, these motor mount and attach to their wheels differently,
    requiring the maker to modify the side panels.


    +   2. The choice of wood as the building material provides a solid base that
    is easily modified and extended with inexpensive hand tools and common materials.


    +   3. The surface has mounting holes specifically for the Arduino™ Uno, although
    other single-board computers can be accommodated.


    +   4. In addition to the Arduino, the surface provide sufficient room for a battery
    holder connecting AA alkaline cells or a rechargeable battery if more powerful
    motors are used.


    +   5. The top surface has unallocated space for additional circuit boards. One
    such board is for power regulation and distribution for the VEX motors.


    # About bread-boards


    None of the lessons leading up to this required a circuit board. Rather, a bread-board
    and jumper wires have been used to connect all electronic components. This project,
    however, does not offer an opportunity to use a bread-board.


    Certainly your circuit could be prototyped on a bread-board. But that option has
    been omitted because of the complexity of the circuit. The number of jumper wires
    required to connect a voltage regulator, two capacitors, two infrared sensors,
    two infrared headlights, and two motors is just too great to have a reasonable
    expectation of correct wiring or of the wiring staying in, even when correctly
    done.


    In place of the bread-board, two circuit boards are constructed using the parts
    from earlier lessons. These are the motor controller shield and the H-bridge.
    The motor controller shield includes a small bread-board for prototyping the IR
    sensing components and, later in Lesson 18, the components necessary to capture
    the messages from a remote control.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# About power


    This rolling robot is powered by six AA batteries, producing approximately +9
    volts. The motor controller shield uses a voltage regulator to provide a stable
    +6 volts to the DC motors.


    # Table 15-1. Vocabulary


    | Term | Definition |

    |---|---|n| Arduino™ shield | A printed circuit board configured in such a way
    as to plug directly into a full-sized Arduino™ single-board computer and, by doing
    so, add capacity. The Arduino™ shield is also the motor controller shield. |

    | chassis | The rigid body of the rolling robot, although the term is also used
    to refer to the rigid container of components in many devices, including cell
    phones and automobiles. |

    | integrating | A project that uses material learned in previous lessons and applies
    them to something new, in this case a rolling robot that can sense and respond
    to its environment. |

    | pivot | A turn in which the inside wheel of the spin is stationary while only
    the outside wheel turns. |


    # Description:


    The robot constructed here is using infrared sensors and headlights to enable
    writing sketches for the following behaviors:


    +   * Detecting and turning away from obstacles: useful for maze navigation.

    * Following a wall: a common strategy for escaping a maze.

    * Detecting and turning toward an obstacle: useful for robot "combat".

    * Closing in on but maintaining a distance from an obstacle. This has been used
    for follow-the-leader activities in which one robot leads others.'
