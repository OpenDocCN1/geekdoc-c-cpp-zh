- img_proc: true
  md: "This set of tasks to be completed for each stranger the real world equivalent\
    \ of the programming statements to be repeated. Suppose, further, that this person\
    \ perform her tasks in an organized manner. She might then take the following\
    \ approach:\n\n+   Step 1: Before beginning, write the number 1 on a piece of\
    \ paper. This is a counter and reflects attempt she is about to undertake. This\
    \ is the initial condition. Her first attempt is number 1. So the counter is set\
    \ to 1.\n\n+   Step 2: Examine the counter on the piece of paper. If it is less\
    \ than equal to 5? If yes, she isn't done and make one more attempt. But if it\
    \ is greater than 5, then she has completed five attempts and will stop.\n\n+\
    \   Step 3: Perform the tasks: locate, introduce, and learn.\n\n+   Step 4: Increment\
    \ the counter by adding 1 to it and recording the new value.\n\n+   Step 5: Go\
    \ to Step 2.\n\n# The for loop in C\n\nReferring back to Lesson 3, suppose the\
    \ setup() method is initialize pins 2 through 7 to the OUTPUT mode so that the\
    \ attached can be turned on and off in the loop() method. Instead of having six\
    \ separate and nearly identical pinMode statements, a for loop can be used to\
