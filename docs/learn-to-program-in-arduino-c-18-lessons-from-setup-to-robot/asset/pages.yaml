    the Serial Monitor and displays both their character value and hexadecimal values.
    Then verify these values are correct by looking up characters on the Unicode Character
    Set found at http://unicode-table/en/control-character.


    Unicode is the parent container of computer characters. It includes the commonly
    used ASCII characters plus characters from most of the world''s major languages.


