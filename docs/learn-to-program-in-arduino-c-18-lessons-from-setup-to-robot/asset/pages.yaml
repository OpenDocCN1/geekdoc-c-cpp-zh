  md: "```\n// the 12 data bits are collected and put into an unsigned\n// integer\
    \ for later decoding.\n\n// Notice how readIR() makes extensive use of the wait()\n\
    // method.\nboolean readIR()\n{\n    currMessage = 0;\n\n    if(wait(HIGH, MAXREST)\
    \ == -1)\n    //timeout ( before sees a low pulse)\n        return false;\n  \
    \  }\n\n    if(wait(LOW, MAXPULSE) == -1) //start pulse\n    {\n        return\
