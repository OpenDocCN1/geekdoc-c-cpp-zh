  md: '# Lesson 9


    # Analog IO


    The Big Idea:

    Computers are binary. Everything is on or off, high or low, one or zero. There
    are no gradations in

    between. The real world is analog. A light may have an infinite number of brightness
    settings

    off off to full on. Sounds range from barely detectably painfully loud.


    In this lesson we learn to connect the Arduino™ to the analog world that we can

    detect where an input is within its range, and control an analog device by providing
    an

    output that matches its natural range.


    # Background:


    Up to now all work with the Arduino has been with digital inputs and outputs.
    A button is either

    "pushed" or not. An LED is either or it isn''t. The digitalRead() statement returns
    either

    HIGH or LOW, while the digitalWrite() statement sets a pin HIGH or LOW.


    But the real world doesn''t work that way. States have an infinite number of values.
    Here are some

    examples:


    +   - The music was very loud.

    - She spoke in a moderate voice.

    - The piano played softly.

    - Miracle Max, from The Princess Bride (1987), says, "It just so happens that
    your friend here

    is only mostly dead."


    # Analog input


    In mode a digital pin is either HIGH or LOW, never anything in between. This characteristic
    is

    referred to as binary, meaning it is either one thing or not that thing. This
    is sufficient if what

    to be measured is binary. Examples are a button that has been pushed or not, a
    sensor that

    se a light or doesn''t, and a switch that is either on or off.


    But what needs to be measured is not binary but can have something that can have
    multiple

    values between the binary extremes? Examples of this: How far is the knob turned?
    How loud is

    the sound? How bright is the light? How salty is the water?


    The Arduino™ Uno''s analog pins, pin A0 through A5, can each measure a voltage
    between 0 and

    +5 volts to an accuracy of about 0.005 volts. This measurement is expressed as
    a number between

    0 and 1023.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
