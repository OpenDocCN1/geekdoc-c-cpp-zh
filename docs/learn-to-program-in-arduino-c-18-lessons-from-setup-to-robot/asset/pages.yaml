  md: 'What this means for this lesson is if pin 1 is connected to +5 volts and pin
    3 is connected to ground (GND), then the voltage on pin 2 can be adjusted to any
    value from 0 through +5 volts.


    The potentiometer, in this case, is called a voltage divider. Pin 2 is an ideal
    input to an Arduino™ analog pin.


    # Goals:


    By the end of this lesson readers will:


    +   1. Be able to identify a potentiometer and know that it is merely a resistor
    whose value can be adjusted.


    +   2. Write an Arduino™ sketch that can use an analog pin to read the relative
    position of a potentiometer and translate that into an integer between 0 and 1023.


    +   3. Write a sketch that generates a series of pulses. Use these pulses to set
    the brightness level of a light-emitting diode (LED).


    +   4. Recognize that the brightness of the LED is proportional to the width of
    these pulses.


    +   5. Write a sketch that allows a user to control the brightness of an LED by
    turning a potentiometer.


