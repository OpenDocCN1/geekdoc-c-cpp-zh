    # Discussion:


    This lesson implements an IRED in combination with an infrared sensor to construct
    an obstacle sensor, much as is used by a rolling robot to find its way through
    a maze. The programming statements to do fit neatly into a helper method. This
    method has three basic steps: light the IRED for a short time; determine if the
    IR sensor saw any infrared reflections from an obstacle; and return the results
    to the method that called it.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_143_0.png)


