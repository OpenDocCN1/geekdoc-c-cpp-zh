  md: '| Term | Description |

    |---|---|

    | infrared | The frequency of electromagnetic radiation just below light visible
    to humans. The first visible color is red, hence the name infrared (means below).
    |

    | infrared sensor | Electronic component with an output pin that is normally +5
    volts. When this device detects modulated infrared, its output voltage drops to
    zero. |

    | modulate | The process of turning a pulse on and off very rapidly that the pulse
    is in the ON, or HIGH, state. |


    # Description:


    The infrared sensor is a small electronic component with three wires. One is connected
    to the Arduino™ +5, one is small to ground (GND), and the third is the device
    output, typically connected to an Arduino™ digital pin configured for INPUT mode.


    The output is HIGH when no modulated infrared is detected (or sensed). When the
    receiver detects infrared modulated at 38 kHz, the voltage on its output pin drops
    to LOW.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_134_0.png)


    Table 12-2. Pin 1 status and meaning


    | Pin 1 status | Meaning |

    |---|---|

    | HIGH | No modulated infrared detected. |

    | LOW | Modulated infrared is detected. |


    > Generally speaking, pin 1 of the IR sensor may be connected to any Arduino Uno
    digital port configured for INPUT. But the Uno also has a built-in LED and current-limiting
    resistor connected to pin 13. As a result, special care must be taken before using
    it for INPUT. See http://arduino.cc/en/Tutorial/DigitalPins for specifications.
    These lessons do not attempt to use this pin for input.


    This lesson does not decode incoming infrared messages. It merely decodes them.
    Refer to Lesson 15 for decoding of messages.'
