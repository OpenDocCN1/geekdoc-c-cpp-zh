- img_proc: true
  md: '# Lesson 3 Variables and Strings


    # The Big Idea:


    This lesson extends what we know about working with text in an Arduino™ sketch
    by adding the ability to change it as the sketch is running.


    # Background:


    In Lesson 2, an Arduino™ sketch used the serial port to send text to a computer
    screen, where it appeared in the Serial Monitor. The programming world that the
    text was:


    ```

    serial.println("Hello, world!");

    ```


    The text was contained inside double quotation marks. Such information is pre-set.
    It cannot be changed as the sketch runs. It is used literally. Such information
    that is programmed exactly as it is to be used is called a `literal`.


    Further, a collection of characters, such as the `Hello`, `world!` message, is
    called a `String`.


    A String (note that this word always begins with a capital letter) is a kind of
    data. Kind of data are referred to as `type`. Putting these together, the String
    in the programming statement is a `String literal`. Another way of saying this
    is that the message `Hello`, `world!` is a literal of type `String`.


    Most Arduino™ sketches, including nearly all the lessons in this book, need a
    way to store values so the values can change over time and so multiple parts of
    the sketch can access the values. This is accomplished by employing a `variable`.
    You may be familiar with variables from algebra. Here the variable X is set to
    the number 42.


    ```

    X = 42

    ```


    The variable is X. The value is the integer 42.


    Computer programming languages, including C, provide ways to create and name variables.
    With each variable C also sets aside in computer memory to store the values being
    represented. Once created, a variable may be assigned a value. That value may
    be retrieved or replaced with another whenever the sketch requires.


    What would a sketch have for a variable? Making sketches provides some examples.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Table 3-1. Uses of variables in sketches


    | Kind of sketch | Possibly use for a variable |

    | Laser Tag | A variable to store energy level is set when the game is started.
    The sketch refers to the variable when tagging or receiving a tag. |

    | Quad Copter | A variable to store the desired throttle setting to determine
    if the copter is climbing, hovering or descending. The value is set by the user''s
    manipulation of a control and is compared to the copter''s actual throttle setting.
    |

    | Digital Musical Keyboard | Lots of variables are used to hold the frequencies
    of different notes and to provide the correct note output when the corresponding
    key is pressed. |


    Just as in algebra, variables have names. Unlike with algebra, programmers can
    give meaningful names, which aid in making the programming instructions in Arduino™
    understandable. Suppose, for example, a sketch that programs the Arduino™ to play
    a game. A variable to keep track of a player''s name is playerName.


    Notice is how we use words: player. How they are combined into one by means of
    a naming convention called camel notation. Under this convention the first letter
    of the first word of the variable is lowercase, and there are no spaces between
    words. The first letters of all subsequent words in the variable are capitalized.


    The process of setting aside memory for a variable and assigning variable''s name
    to that space is called declaration. Before it can be used, a variable must be
    declared. The programmer has the option of assigning an initial value to the variable
    at that time.


    # Table 3-2. Vocabulary


    | Term | Definition |

    | assignment operator | The symbol used in a programming statement to store a
    value to a variable. The symbol is the equals sign, = |

    | camel notation | A convention for naming variables where words are joined together
    to form a meaningful phrase to describe what is being assigned. Example of a possible
    variable in camel notation: playerHighScore |

    | concatenation | The process of appending the value of one String variable to
    the value of another String variable. |

    | declaration | A programming statement that sets aside memory for a particular
    type of data and assigns the variable name that will refer to that type. |

    | delimiter | The character used to identify the beginning and end of the values
    for some types of data. For data of the type String the delimiter is the quotation
    mark: "" |


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
