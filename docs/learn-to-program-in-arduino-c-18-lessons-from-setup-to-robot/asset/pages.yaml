- img_proc: true
  md: '# Lesson 4 Digital Pins and Constants


    # The Big Idea:


    This lesson is the first step toward learning to connect the Arduino™ to its surrounding
    world. You will connect lights to your Arduino™ and write sketches to turn them
    on and off in desired pattern. In the process you will learn how to configure
    the digital pins of the Arduino™ in order to control devices and to turn those
    devices on and off. You will also learn how to use a solderless breadboard to
    connect electronic devices together and to the Arduino™. Later lessons expand
    this connection ability to control motors, make sounds, detect light, and receive
    and transmit messages.


    # Background:


    In Lesson 3, sketches use the serial port to send text from the Arduino™ Uno to
    the computer running the Arduino™ IDE. In Lesson 4, you will learn to make things
    happen by taking advantage of Arduino™ pins.


    A pin is a connection with the Arduino™ can be wired to external devices — everything
    from motors and switches to display panels.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_41_0.png)


    Digital pins 0 through 13


    Analog pins A0 through A5


    The Arduino™ has two kinds of pins for receiving analog and sending information:
    analog and digital. The six analog pins, pictured on the upper right side of the
    Arduino™ in Figure 4-1, are the subject of a future lesson. This lesson is about
    digital pins, of which Arduino™ has 14. These are numbered from 0 through 13 and
    are found along one side of the board.


    Figure 4-1. Arduino™ Uno with digital and analog pins called out


    A digital pin has only two states; on or off. The names for these states are HIGH
    and LOW. A HIGH state means that a volt meter connected to that pin would measure
    +5 volts. LOW, by contrast, a measurement of zero volts.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Suppose a pin is HIGH. Where does the +5 volts come from? This depends on the
    mode of that pin. A digital pin can be set to detect the presence or absence of
    +5 volts coming from outside the Arduino™. This voltage can come from a battery
    or some sort of sensor device. A digital pin that is set to detect the presence
    or absence of +5 volts from outside the world is to be in INPUT mode. Such a pin
    can detect signals from the outside world.


    But an Arduino sketch can set a pin to HIGH or LOW. A pin that can have its voltage
    set from within a sketch is set to be in the OUTPUT mode. Pins in OUTPUT mode
    are used to turn devices on and off, send signals, control motors, and to generate
    sounds.


    # Table 4-1. Summary of modes and states of pins


    | Pin Mode | Pin Status | Meaning* |

    | --- | --- | --- |

    | OUTPUT | HIGH (on) | The Arduino™ raises the voltage of the pin to +5 volts,
    meaning devices connected to this pin have access to electricity. A light, for
    example, could come on, or a motor could start to turn. |

    | | LOW (off) | The Arduino™ sets the voltage of the pin to zero volts. A light
    connected to this pin would go dark; a motor would stop. |

    | INPUT | HIGH (on) | The presence of +5 volts is detected on this pin. This voltage
    is coming from outside the Arduino™ and can be from a switch or a sensor. Some
    sensors are +5 volts when not detected. |

    | | LOW (off) | The voltage of the pin is determined to be zero. This may reflect
    a button being pushed or a sensor detecting signal. |


    *The meanings in this table are merely possibilities that reflect what commonly
    happens. What actually happens depends on the device and how it is wired to the
    Arduino™. For example, in these lessons push buttons are usually connected in
    such a way as to produce +5 volts on a pin in INPUT mode when the button is not
    pushed. The voltage drops to zero when the button is pushed.


    This lesson will confine itself to digital pins in the OUTPUT mode. It also introduces
    some new electronic components and the schematic diagram.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_42_0.png)'
