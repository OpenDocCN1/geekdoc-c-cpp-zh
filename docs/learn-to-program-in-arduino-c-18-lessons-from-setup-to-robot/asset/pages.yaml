  md: '# Electronics


    This lesson introduces the potentiometer. A potentiometer is a resistor, much
    like those used to limit current for LEDs and to pull a digital pin to +5 volts.
    But it is mechanically different. The resistor itself is a flat, curved surface.
    A slider controlled by a knob moves across this surface. Pins are connected to
    each end of the surface with a third pin connected to the slider. The slider,
    then, becomes a variable resistor.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_101_0.png)


    Figure 9-4. Photograph and schematic symbol for potentiometer


    As Figure 9-5 shows, the total resistance is between pins 1 and 3. The resistance
    between pin 1 and 2 increases as the potentiometer is turned clockwise and the
    wiper moves further away from pin 1. Also, the resistance between pins 2 and 3
    decreases as the wiper gets closer to pin 3.


    The relationship of R1 and R2 to Rtotal is also true for voltage. If pin 3 is
    connected to ground and pin 1 is connected to +5 volts, the voltage at pin 2 will
    be proportional to the position of the wiper on the resistive material. Translating
    this into an equation:


    V_{total} = V_1 + V_2


    where:

    V_{1} = voltage from pin 1 to pin 2

    and:

    V_{2} = voltage from pin 2 to pin 3


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_101_1.png)


    Figure 9-5. Resistance in a potentiometer


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
