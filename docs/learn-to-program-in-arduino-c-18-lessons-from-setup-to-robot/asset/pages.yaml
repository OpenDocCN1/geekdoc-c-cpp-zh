  md: '11. Download the sketch Lesson15HBIRNav.ino from the Learn To Program page
    of LearnCSE.com. Unzip the file in your Arduino™ folder, then upload the sketch
    to your robot. Your six AA cells in the battery pack and plug it into the Arduino.
    Your robot should move forward unless reflected infrared light is detected. The
