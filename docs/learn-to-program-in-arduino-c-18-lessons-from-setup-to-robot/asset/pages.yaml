    \ is above 15. The program code would look something like that shown in Example\
    \ 8-2.\n\nExample 8-2. The if statement\n\n```\nif(energyLevel > 15) {\n    Serial.print(\"\
    Energy level is: \");\n    Serial.println(energyLevel);\n}\n```\n\nNote that nothing\
    \ is printed if the energy level is equal to or less than 15. But what if the\
    \ programmer wishes the message, \"Energy level is CRITICAL!\" to be printed in\
    \ this situation? This is accomplished by the if-else combination."
