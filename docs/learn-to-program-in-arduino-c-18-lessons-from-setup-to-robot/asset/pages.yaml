  md: '# Lesson 10 Simple Tones


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_110_0.png)


    The Big Idea:

    This lesson is about enabling an Arduino™ to play musical tones. This capability
    will be used in Lesson 17 to turn a common television remote control into a sort
    of musical instrument that produce different sounds when its buttons are pushed.
    That lesson, in turn, provides the technical base for using remotes for more sophisticated
    things and, eventually, creating devices that generate their own messages.


    Background:

    A tone is nothing more than the turning on and off of something that moves the
    air. A violin string, moves back and forth rapidly, moving the surrounding air.
    The musical note A is heard when a violin string moves 440 times per second. The
    number of vibrations per second is called frequency.


    A speaker is a device with a coil of wire suspended near a permanent magnet. The
    wire is glued to a paper cone called a diaphragm. When an electrical current moves
    through the wire, a magnetic field is set up that pushes against that of the magnet
    causing the cone to move.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_110_1.png)


    Typical speaker. Small earphones are similar but often use a plastic membrane
    in place of the paper cone.


    Figure 10-1. Speaker


    If a speaker is connected to a digital port on an Arduino™ and that port is turned
    on and off, the speaker diaphragm will move in and out. As with the violin string,
    if the port turns on and off 440 times per second, the musical note A will be
    heard coming from the speaker.


    As it happens, there is a C-language method that does precisely this. It is tone().\
    The C-language method noTone() stops a tone from playing.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Table 10-1. Vocabulary


    | Term | Definition |

    |---|---|

    | coupling capacitor | An electronic component that passes on current that is
    increasing or creasing in magnitude but does not allow a steady flow of electrons.
    For audio allows only the sound produced by the Arduino™ to reach the speaker.
    |

    | frequency | The ratio of the number of times repeating event occurs per unit
    of time. For audio most common ratio is cycles per second. The unit name for this
    is Hertz. |

    | Hertz | The name of the unit of measure for cycles per second or frequency,
    abbreviated as Hz. 1 Hertz = 1 cycle / second. |

    | period | The duration of one cycle. For a frequency of 1000 Hz the period is
    1/1000 second, or 1 x 10⁻³ seconds. |

    | sine wave | A repeating event the magnitude of which is sinusoidal. A sine wave
    of audio frequency is a pure tone. |

    | speaker | A mechanical device that translates electrical current into the movement
    of air. Examples include loudspeakers and ears bad. Many technologies are used
    to perform this translation, and electromagnetism and piezo crystal are the most
    common. |

    | square wave | A repeating event in which the resulting voltage is a square wave,
    high for one-half the period and low for one-half the period. The sound produced
    is not pure, but it is suitable for steady tones, sound effects, and simple melodies.
    |

    | tone | The turning on and off of something that moves the air. |


    Description:


    A "pure" tone is a sine wave. But an Arduino™ is a digital device. It simply turns
    on and off. The resulting voltage is then a square wave, high for one-half the
    period and low for one-half the period. The duration of one cycle is called the
    period. The speaker, being a mechanical device takes time to respond to changes
    in voltage, is most sensitive to the output frequency, but other frequencies are
    present as well. As a result, the sound of a square wave is not pure, but the
    pitch is obvious to the listener. Square wave audio is suitable for steady tones,
    sound effects, and simple melodies.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 111
- img_proc: true
  md: '| +5 Volts | A sine wave in audio frequencies produces a pure, clean, and undistorted
    tone. The Arduino™ cannot produce a sine wave with added components. |

    |---|---|

    | 0 Sine Wave | |

    | | A square wave in audio frequencies produces a clear pitch that is dominant
    but not pure. Many other frequencies are in lower volumes. The Arduino™ excels
    at producing square waves. |

    | 0 Square Wave |


    Figure 10-2. Sine wave and square waves


    The musical note A has a frequency of 440 cycles per second. The unit of frequency
    is the Hertz. So we say an A has a frequency of 440 Hertz. The duration of a single
    pulse, up and down, is the inverse of the frequency, as shown in Figure 10-3.


    duration = 1 / frequency in Hertz => duration of an A = 1 / 440


    duration of an A = 2.28 milliseconds.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_112_0.png)


    Figure 10-3. Portion of a square wave that produces the musical note A


    To make an Arduino™ produce a sound, all that needs to be done is to alternately
    set a pin HIGH then LOW for the duration of half a cycle of the desired frequency.
    Fortunately, the Arduino method tone() does precisely that.'
  merge: -1
