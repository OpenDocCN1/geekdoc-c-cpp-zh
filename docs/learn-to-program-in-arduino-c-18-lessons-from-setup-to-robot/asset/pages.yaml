  md: '# How-To #8: Work with Smart LEDs


    This How-To shows how to connect and control a number of special light-emitting
    diodes, each of which can be set to any color and brightness. We will use NeoPixels
    from Adafruit and control them with the Arduino™ library Adafruit provides.


    # Background


    We LEDs. Most of them light in only one color. True, so-called biber LEDs light
    one color when connected one and a second color when the connection is reversed.
    But what we really want is an LED that can light up any color and can be generated
    by mixing red, green, and blue light.


    Tricolor LEDs that do this are available. To drive one of these LEDs requires
    three separate digital Arduino pins, one for each color. And for each LED, Want
    five in a row? Get ready to find 15 pins digital. This is not practical.


    Adafruit offers LEDs refers to as NeoPixels that meet our requirements perfectly.
    These LEDs come in several forms, from small chips that can be sewn into clothing
    to strips and even individual NeoPixels that look like ordinary LEDs with a few
    many wires. These devices are for us because each NeoPixel mixes the light from
    three LEDs—one green, one blue, and one red. Even better, each NeoPixel comes
    with its own built-in microprocessor that lets it be controlled with just one
    wire.


    Even better still, data that comes in through wire can be sent out another wire
    to another NeoPixel, meaning multiple NeoPixels can be connected Even better still,
    data that comes in through wire can be sent out another wire to another NeoPixel,
    meaning multiple NeoPixels can be connected all in a row. We can set the brightness
    and color of as many LEDs as we want from only one Arduino™ digital pin. Figure
    HT8-1 shows a pinout of the NeoPixel used in this How-To.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_257_0.png)


    > An individual NeoPixel can require up to 60 milliamperes. This might not sound
    like a lot, but the upper limit of the Arduino™ is about 400 milliamperes and
    can be quickly exhausted. So, while we show the NeoPixels connected to the +5
    volts pin of the Arduino,™ sizeable projects will require a separate five-volt
    power supply.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 257
