    ahead.


    # Exercises:


    Exercise 15-1. Robot combat


    At some point you will want your robot to find its way through a simple maze.
    Current-DC motors turn quickly and can overcompens for a detected obstacle. Slow
    this process to make obstacle detection more graceful without slowing the straight-ahead
    speed. The speed of each motor is specified by a variable declared near the top
    of the Lesson15HBIRNav.ino sketch, speedMotorLeft for the left motor and speedMotorRight
    for the right motor.


    These values are interpreted by the sketch as percentage of full speed motor to
    turn. A percentage of 100 means full speed, while zero means stop (Values set
    at over 100 are treated as 100, and values set at less than 0 are treated as 0).
    In practice you need to be careful with values less than 30. This is because,
    as learned in Lesson 9, what is really happening is the motor is being turned
    on and off several times. The slower it appears to turn, the longer the periods
    are compared with the ones. Each time the motor is turned on, it must overcome
    the inertia of being off. If this inertia is great, such as when a robot is at
    rest, the period might not be long enough to overcome the inertia and result in
    movement.


    Save the sketch with the new name Lesson15Exercise1.ino. Then modify this new
    sketch so that the robot spins left, spins right, moves forward at full speed,
    and reverses slowly when responding to an obstacle.


    Exercise 15-2. Robot combat


    The default sketch for this robot has the robot moving away from obstacles. Save
    a copy of the Lesson15HBIRNav.ino sketch as Lesson15exercise2.ino. Then modify
    this copy to do the following:


    +   1. run at half speed or full speed when no object is detected ahead

    2. turn away a detected object instead of turning away

    3. increase the robot''s speed to 100 percent in an attempt to hit an object that
    is directly ahead, as detected by both IR sensors.


