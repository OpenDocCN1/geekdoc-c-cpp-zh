    +   5. Modify line 118 to reflect which device code the robot is to respond to.
    In the case of the VCR,


    _8 addressUS = ADDRESS_VCR;


    +   6. Connect the robot’s Arduino™ to the PC. Upload the Lesson18HBridgeMotorIRControl.ino
