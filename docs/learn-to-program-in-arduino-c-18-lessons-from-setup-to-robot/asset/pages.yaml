  md: 'The schematic symbol for the push button is simply two pins that are electrically
    connected when the button is pushed. The push button illustrated by the schematic
    in Figure 8-2 is not pushed. Its circuit is open.


    Figure 8-2. Schematic of push button with circuit open


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_88_0.png)


    # Arduino™ +5v and GND


    The convention used in these lessons for a push button connected to a digital
    pin is that the pin should be at +5 volts, and when closed, when the button is
    pushed, the pin should be at zero volts.


    The Arduino™ provides pins for both of these. +5 volts may be found at the pin
    marked +5v and zero at the pin marked GND. GND is an abbreviation for ground,
    meaning zero volts. The Arduino™ Uno has three such pins for wiring convenience.
    Any one of the GND pins may be used for this lesson.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_88_1.png)


    Figure 8-3. Arduino™ GND and +5 volt pins


    # The pull-up resistor


    One side of the push button is wired to ground, the other to an Arduino™ digital
    pin configured for the INPUT mode. When the button is pushed, then the voltage
    at that pin will be zero. But the'
