  md: '# Introduction


    The Arduino™ is an extremely popular single-board computer that can be used to
    make a vast variety of intelligent devices. With this book you will learn how
    to work with the Arduino™ itself, to identify and control common electronic components
    used with an Arduino,, and most important of all, to write programs for the Arduino™.


    This book is for you if you want to understand, program, and use the Arduino™
    to make things that work. It is also for you if you want to teach Arduino™ programming.
    We believe this mastery is valuable for three reasons:


    +   1. Industry demands and career opportunity: The key component of the Arduino™
    is a microcontroller from the Atmel Corporation. Learning to program and apply
    an Arduino™ is also learning to program and apply a microcontroller, a skill that
    is in heavy demand in industry.


    +   2. As a basis for learning other programming languages: The Arduino™ is programmed
    in a version of the C programming language. Consequently, knowledge of the syntax
    of Arduino™ transfers to learning higher-level languages, including C++, C#, Java,
    and Python, which are all currently used in industry.


    +   3. Satisfaction and fun: The Arduino™ can be used as the computing component
    for many different kinds of devices. Students who have completed the lessons in
    this book have gone on design, build, and program robots that walk, sensors that
    record and report data, musical instruments, and quadcopters that fly, among other
    things.


    You will guide and pace your own learning. Each lesson builds upon and extends
    the content of the preceding lessons. And each lesson is constructed as it would
    be presented in a classroom, beginning with key concepts and ending with exercises
    to apply that:


    Big Idea: The major concept or skill the lesson conveys. Everything else in the
    lesson supports this idea.


    Background: The underlying theory, and, when appropriate, the science behind the
    content of the lesson. Understanding the background of new material enhances your
    ability to apply that knowledge.


    Vocabulary: New terms are highlighted in yellow when they introduced in text.
    Those terms and their definitions are also conveniently arranged in a table (with
    a yellow banner heading) for reference.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'Description: Further detail of the concepts covered in the lesson and other
    information that will put the lesson''s procedure and exercises into the context
    of the Big Idea.


    Goals: The specific set of concepts you will learn and skills you will develop
    while completing the lesson.


    Materials: A list of the electronic materials and tools used in the lesson. Each
    item on the list has a number linking it to a Parts Catalog (available at LearnCSE.com),
    which provides information about where the part can be purchased.


    Procedure: A set of ordered steps for conducting the experiment or building the
    project that illustrates the content of the lesson.


    Exercise(s): A set of one or more additional experiments or projects you can do
    in order to apply and reinforce what you have learned in the lesson.


    Support in the form of sample programs (referred to as “sketches") for the Arduino,"
    FAQs, the Parts Catalog, new topics, projects, and a blog can be found at www.LearnCSE.com.


    The lessons in this book have been classroom tested. Students have created projects
    of their own designs based on what they''ve learned with earlier versions of these
    lessons. They have made model helicopters and airplanes, elaborate rolling robots,
    musical instruments, light panels, keyboards to drive synthesizers, "laser" tag
    games, hover boards, Segway-like vehicles, and more.


    Whether you are using this book for yourself or to teach others, I hope you find
    the content engaging and useful. I invite you to share your thoughts, suggestions,
    and cool projects of your own. Visit us anytime at www.LearnCSE.com.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
