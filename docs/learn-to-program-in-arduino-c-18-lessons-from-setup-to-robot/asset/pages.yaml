  md: '# Table 2-3. Vocabulary


    | Term | Definition |

    |---|---|

    | baud | A unit of the speed of data going into and out of a serial port. |

    | comment | Text inside a sketch that is present to provide the human reader of
    the sketch insight into some aspect of the sketch''s operation but that is ignored
    by the Arduino™ as it obeys programming statements. |

    | debugging | Finding and fixing improper behaviors in an Arduino™ sketch (and
    in other programs). |

    | escape sequence | An escape sequence is a pair of characters embedded in text
    where the first character is a backslash (\). The second character is a command
    to do something when that is printed on a computer screen via the Serial.print()
    and Serial.println() programming statements. The second characters are: the double
    quote (""), used to print the quotation mark as text, the lower-case letter t,
    which moves printing to the next line, the lower-case letter n, which moves to
    a new line, and the backslash itself (\), which prints the backslash as text.
    |

    | keyword | A word that has a specific and predefined meaning in the C programming
    language. |

    | loop | One of the two essential methods in each Arduino™ sketch. The C-language
    statements in this method run over. |

    | method | A collection of C-language statements that perform a specific task.
    A method always has a name. Some methods can receive and return data. |

    | programming statement | A computer language instruction, a set of pre-written
