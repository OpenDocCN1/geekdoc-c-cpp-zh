  md: "Finally, some words have special meaning to the C language as it is used with\
    \ the Arduino™. These are called keywords. A keyword cannot be used for any other\
    \ purpose. The programming statement delay() uses the keyword delay.\n\nOther\
    \ commonly used keywords are: double int switch void while long return short signed\
    \ if goto else do const char case break false true\n\nIn this lesson you will\
    \ create the sketch shown in Sketch 2-1. Note the comments, methods, and programming\
    \ statements.\n\n# Sketch 2-1. First Arduino™ sketch\n\n```\n/* MyFirstArduino™Sketch.ino\n\
    W. P. Osborne\n6/30/15\n*/\n\nvoid setup(){\n  serial.begin(9600);\n}\n\nvoid\
    \ loop(){\n  // print message at one second intervals\n  Serial.println(\"Hello,\
    \ world!\");\n  delay(1000);\n}\n```\n\n> Throughout this book, sketches and snippets\
    \ that the reader will type on or his keyboard appear in a gray box, as seen in\
    \ Sketch 2-1.\n\nIn the sketch shown in Sketch 2-1, the first three lines are\
    \ comments. The first line is the name of the sketch: the second line names the\
    \ author; the third line the sketch was created.\n\nThe sketch also has two methods:\
    \ setup() and loop(). The setup() method contains only one programming statement\
    \ while the loop() method contains two. The loop() method also includes a comment.\n\
    \nLearn to Program in Arduino™ C: 18 Lessons, from setup() to robots"
