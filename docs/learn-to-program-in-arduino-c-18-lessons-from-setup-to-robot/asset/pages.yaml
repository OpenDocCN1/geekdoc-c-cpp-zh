  md: '# Putting it all together


    To use the library for your sketch, follow these steps:


    +   1. In the Arduino™ IDE create a new sketch.


    +   2. At the top of the sketch file include the library header file with the
    statement:


    #include <Adafruit_NeoPixel.h>


    +   3. Before writing any methods, create a NeoPixel object. This example assumes
    five NeoPixels with data coming from pin 6.


    Adafruit_NeoPixel1 myStrip = Adafruit_NeoPixel(5, 6, NEO_RGB + NEO_KHZ800);


    +   4. Initialize the string of NeoPixels inside the setup() method.


    myStrip.begin();


    +   5. Use the NeoPixel methods as needed in the rest of the sketch. Remember,
    in this example each begins with myStrip.'
