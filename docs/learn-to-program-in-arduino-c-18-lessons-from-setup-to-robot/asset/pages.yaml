  md: '# Description:


    The **for loop** is used to execute a set of programming statements multiple times.
    It consists of two parts. These are the set of programming statements to be run
    and the **for loop** programming statement sets the criteria for allowing them
    to run and determining execution should stop.


    As illustrated in Figure 7-1, the programming statements to be executed are contained
    within a set of curly braces `{}` immediately following the **for** loop statement.


    The **for** loop statement itself has three parts. Each plays a role in setting
    up and running a logic test that determines how many times the statements are
    executed. These are the initial condition, the test, and the increment. Each contains
    one or more programming statements.


    Eventually the programming statements in increment will create a situation where
    the test no evaluates to true. When this happens, the programming statements within
    the curly braces are no longer executed, and the program will move to what comes
    after the **for** loop.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_77_0.png)


    Figure 7-1. Parts of the for loop statement


    The **for** loop statement itself has three parts. The underlying idea is that
    an integer counter is created to keep track of the number of times the programming
    statements are run. Each time they run is called a **loop**. After each loop,
    the counter changes somehow. This is the **increment**, the counter is tested
    to see if the loop should run again.


    Suppose, for example, someone who has enrolled in a public speaking course. As
    part of this course, she is to perform the following set of tasks five times:


    +   - Locate a complete stranger.

    - Introduce herself.

    - Learn something about this stranger.

    - Record the stranger''s name and what was learned.


    **Learn to Program in Arduino™** C: 18 Lessons, from setup() to robots'
  merge: -1
