  md: '# Lesson 16


    # The Big Idea:


    The common television remote encodes messages in infrared light. These messages
    can be received and decoded with an infrared sensor (Lesson 12) and an Arduino.
    Being able to decode these messages enables two possibilities. The first is that
    remote controls can be used to control devices, such as robots and musical instruments,
    operated by the Arduino. The second is that by understanding how messages are
    encoded, you can program an Arduino to transmit its own messages via an infrared
    headlight, as used in Lesson 13. This combination of being able to receive and
    decode infrared messages, along with the ability to encode and transmit messages,
    enables an entire class of Arduino™ devices, such as communicators and laser tag.


    Background:

    Infused in Lessons 12, 13, and 15 was limited to the illumination and detection
    of obstacles. No actual information is exchanged. By turning the infrared light
    on and off in patterns, actual information can be conveyed. This is precisely
    what entertainment remote controls do. Pressing a button on a remote control causes
    a message to be sent. This message has two parts—the address and the command (Figure
    16-1).


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_179_0.png)


    Table 16-1. Parts of an infrared message


    | Command | The action the device is to take. Examples are: increase volume, switch
    to a different channel, start playing. |

    | Address | The identification of the device that is to respond to the command.
    Examples are: television, DVD player, satellite box. |


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'The message is encoded by turning the infrared transmitter on and off in a
    pattern of pulses. Different manufacturers have different methods of encoding
    messages. In these lessons we use the method employed by the Sony Corporation
    and refer to it as the Sony Infrared (IR) Protocol.


    | Term | Definition |

    | --- | --- |

    | carrier signal | The base frequency of the infrared as it comes from the diode.
    In this class this frequency is 38,500 Hertz (cycles per second). |

    | communications protocol | The set of rules used to encode and decode the information
    imposed with PWM on the carrier signal. |

    | pulse width modulation (PWM) | The encoding of the carrier signal by turning
    it on and off in a pattern. |

    | resting states | A period of no IR signal of a specific length that indicates
    the start of an encoded message. |

    | Sony Infrared (IR) Protocol | The method of encoding infrared messages transmitted
    between remote controls and the Arduino™ that is used by Sony and other manufacturers
    and has become de facto standard. |


    Table 16-2. Vocabulary


    Description:

    Recall that the output of the infrared sensor is HIGH when no infrared is detected
    and that this drops to LOW when infrared is detected. This is illustrated in Figure
    16-2.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_180_0.png)'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'With this in mind, consider the format of the Sony-protocol infrared message
    as it appears on the output pin of an infrared sensor. This message has three
    parts, as shown in Table 16-3.


    # Table 16-3. The three parts of a Sony-protocol infrared message


    | Start | A pulse of unusual length that follows a period of no pulse. The start
    pulse indicates the beginning of a message. |

    | Command | A set of seven pulses that indicates a pattern of seven ones and zeroes.
    This is a number in binary form. The value of number indicates the action to be
    taken. |

    | Address | A set of five pulses that indicates a pattern of five ones and zeros.
    This, too, is a number in binary form. The value of number identifies device is
    to respond to the command. |


    Figure 16-3 is a diagram of a typical Sony-protocol infrared message. Notice that
    pulses are separated by so-called resting states. The duration of a data pulse
    indicates its value. A pulse duration of 0.6 milliseconds, for example, indicates
    that the bit''s value is zero. A bit of one is indicated by a pulse duration of
    1.2 milliseconds. The start pulse is 2.4 milliseconds.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_181_0.png)


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Detecting and decoding a Sony-protocol IR message is a four-step process, as
    shown in Table 16-4.


    Table 16-4. Steps for detecting and decoding a Sony-formatted message


    | Step 1 | Wait for the beginning of a message. In this step the Arduino™ program
    waits for the output of the infrared sensor to drop to zero. If this doesn''t
    happen within the time expected for a rest period, we stop and return without
    doing anything more. There''s no message. But, if the output does drop, then IR
    is detected. |

    | Step 2 | Measure the duration of this first pulse. If it is not about 2.4 ms,
    then the pulse is not a Start pulse. Return without doing anything more. But if
    the duration is about 2.4 ms, then a start pulse has been detected. The next 12
    pulses are the command and message. |

    | Step 3 | Get the next 12 pulses and determine the command and address. If there
    are fewer than 12 pulses or if a pulse exceeds 1.2 ms or if a rest period is longer
    than 0.6 ms, return without doing anything more. |

    | Step 4 | If all 12 pulses are detected and are either 1.2 ms or 0.6 ms, then
    decode the message into its command and address; Detection is a success. |


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_182_0.png)


    Lesson 16 Sony IR Protocol'
  merge: -1
  pgno: 182
