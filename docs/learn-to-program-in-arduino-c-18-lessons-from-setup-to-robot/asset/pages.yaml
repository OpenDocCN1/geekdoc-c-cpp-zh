  md: '# Lesson 18 IR Robot Remote Control


    # The Big Idea:


    This lesson uses DC motors controlled by an H-bridge. The result is a quick and
    agile robot that responds to an infrared remote control.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_206_0.png)


    # Background:


    This lesson makes use of the rolling robot constructed for Lesson 15. All the
    components plugged into the small solderless bread-board in the center of the
    motor controller shield should be removed. Of, one infrared sensor and three male-to-male
    jumpers will be needed for this lesson. Lesson 15 the sensors were programmed
    to detect infrared light reflected from obstacles.


    In this lesson, one of those sensors is repurposed to detect messages from the
    common infrared remote control. The detection and decoding of these messages was
    used in Lesson 17 to make a sort of musical instrument. In this lesson we combine
    the robot and an infrared sensor from Lesson 15 with what we know of infrared
    messages from Lessons 16 and 17 to make a robot that can be remotely controlled.


    How-To #1 contains instructions for assembling a complete rolling robot by DC
    motors.


    How-To #7 shows how to assemble an H-bridge circuit board suitable for connection
    to an Arduino.


    Finally, this lesson provides a sketch for controlling that rolling robot. The
    result is an attractive and nimble little robot.


    # Description:


    This lesson results in a rolling robot that responds to infrared messages from
    a common infrared remote control. The components and wiring of the robot are identical
    to those used in Lesson 15 with the exception that the solderless bread-board
    contains only an infrared sensor used to detect messages.


    The focus of this lesson is on the actual programming of this robot. The sketch
    must detect, decode, and act upon infrared messages. Act in this case means determining
    if a message is intended for this robot and, if so, the command is translated
    into speed and direction instructions for the DC motors.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'A starter sketch is provided that can perform these tasks but is limited to
    having the robot move forward, reverse, spin left, spin right, and stop. Further,
    when moving, the motors are at top speed. Although these commands may work, they
    do not provide sufficiently subtle control of the robot to allow the operator
    to perform tasks such as playing robot soccer with grace, parallel parking the
    robot, or allowing the variety of approaches necessary to win at robot sumo.


    At least, the programmer needs to enhance this starter sketch by adding the ability
    to turn right and left while moving forward and to change the robot''s overall
    speed. An understanding of this sketch is essential in order to make these enhancements.


    Recall that every Arduino™ sketch requires at least two methods—setup() and loop().


    # # The setup() method


    This method is run only once when the robot is started. As shown in Figure 18-2,
    the mode of the digital pin used for the IR sensor is set to INPUT.


    The setup() method goes on initializes the digital pins that control the H-bridge,
    which in turn, controls the two DC motors that provide propulsion.


    The basic robot does not use any servos, but the motor controller shield can accommodate
    up to three. Programs sometimes find servos useful for adding features to their
    robots such as grasping the ball in robot soccer and lowering a blade in robot
    sumo. If servos are present, they are initialized here and assigned to Arduino
    pins.


    Although are not reflected in Figure 18-2, any other initializations a programmer
    might be using setup() as well. Examples are a digital pin used for sound effects
    or music or another pin to light an LED to indicate the robot is powered and ready
    to use.


    Incoming messages contain the address for the type of device to be controlled.
    This could be a television, a DVD player, a cable box, or a recorder. setup()
    identifies which device address the sketch will respond to.


    Finally, the robot motors are set to “stop,” meaning the robot is not moving but
    is ready to respond to commands.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_207_0.png)


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# The loop() method


    Figure 18-3 illustrates the program flow of the loop() method. This method appears
    deceptively simple. The loop() method looks for a message, and if it finds one,
    takes action.


    The loop() method performs only two tasks. Each time it runs it another method,
    checkForMessages(), to see if an incoming infrared message has been detected and
    decoded. If such a message has been sent, the loop() method acts on that message
    by calling processMessage().


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_208_0.png)


    Figure 18-3. Flow chart of the loop() method


    # The checkForMessages() method


    Called by the loop() method, checkForMessages() uses the program code from Lesson
    12, Infrared Sensors. Details of how this method works and the methods it calls,
    in turn, are contained in that lesson.


    # The processMessage() method


    The processMessage() method is called by the loop() method only if a valid message
    has been detected and decoded. Recall from Lesson 12 that an incoming message
    contains two pieces of information—the device for which the message is intended,
    the address, and the button pushed, called. The processMessage() method first
    looks at the address. If it does not match the address assigned by the setup()
    method then no action is taken. If, however, there is a message then processMessage()
    examines the command portion of the message to determine what action to take.
    This starter sketch, Lesson18IRControlRollingRobot.ino, provides only five possible
    actions: go forward, reverse, spin left, spin right, and stop. Exercise 18-2 extends
    this set. Note that the exercise suggests turning right and left as spinning,
    but other responses could be added, such as blinking lights, playing a sound,
    or operating additional servo or motor.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Called by the loop() method if a valid message has been detected and decoded,
    the processMessage() method first determines whether the message is meant for
    some other recipient. If it is not, the method then tests that the command is
    a change from what the robot is currently doing. If the message is to go forward,
    for example, and if the robot is currently going forward, then no action is taken.
    But if the command is a change, then processMessage() calls yet another method,
    setDirection(), to effect the change.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_209_0.png)


    Figure 18-4. Flow chart of the processMessage() method


    # ## setDirection()


    This method is a sort of switch. It sends the appropriate commands to the servos
    that reflect the command. Notice the set of options is easily expanded to include
    other buttons on the remote control.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_210_0.png)


    Called by processMessage() from within loop() the setDirection() method translates
    the infrared message''s command into specific actions for the motors. Notice that
    the five commands recognized here are easily added to extend the types of commands
    the servos receive as well as to perform just any other task, such as playing
    a sound effect or blinking lights. This method is intended to be expanded.


    Figure 18-5. Flow chart of the setDirection() method'
  merge: -1
