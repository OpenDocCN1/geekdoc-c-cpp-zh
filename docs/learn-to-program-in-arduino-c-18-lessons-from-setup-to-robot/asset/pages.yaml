    # Mathematical operators and equations


    Arithmetic Operators:

    Just as algebra, mathematics in C involves addition, subtraction, multiplication,
    and division. In addition, C also has assignment and modulus. These are called
    arithmetic operators. Each has a symbol that is used to indicate the operator
    in a programming statement.


    In Table 5-4, assume the letters A, B, and C are declared numeric variables of
    some type.


    | Operator | Symbol | Description | Example |

    | Addition | + | Adds two values. | A + B |

    | Subtraction | - | Subtracts the second value from the first. | A - B |

    | Multiplication | * | Multiplies two values. | A * B |'
