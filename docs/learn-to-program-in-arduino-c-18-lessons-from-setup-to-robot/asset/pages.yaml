    \ |\n| AB + AC =A(B + C) | int myInt;\n myInt = 7 + 12; |\n| | | The variable,\
    \ myInt, has been assigned the value of 19. |\n| | | The following programming\
    \ statement modifies this value.\n myInt = myInt + 3; |\n| | | The expression\
    \ on the right retrieves the value assigned to myInt, adds 3 to it, then stores\
    \ the result to myInt. The value of myInt is now 22. |"
