  md: '# Table 10-2. Tone-related Arduino™ methods


    | Method Signature | Description |

    | --- | --- |

    | tone( pin, frequency) | Sends a pulse with the specified frequency to the specified
    pin. The pulse is repeated until the noTone() method is called or the tone() method
    is called again.<br><br>pin'': Pin number of the digital port.<br><br>frequency:
    Frequency of the tone. |

    | tone( pin, frequency, duration) | Sends a pulse with the specified frequency
    to the specified pin. The pulse is repeated for the time specified in "duration".<br><br>pin:
    Pin number of the digital output port.<br><br>frequency: desired frequency of
    tone.<br><br>duration: duration of tone in milliseconds. |

    | noTone(pin) | Stops tone playing.<br><br>pin: specifies pin where note is to
    be stopped. |


    Notes:


    +   1. Even though noTone specifies a pin number, the Arduino™ will not play more
    than one tone at a time. If a tone is started on pin 3 and then another on pin
    7, the tone on pin 3 will stop immediately when the tone on pin 7 begins.


    +   2. The duration is observed if only no other tone is started and noTone is
    not called. In the code shown in Example 10-1, the 440 Hertz tone will not be
    heard because the 1000 Hertz begins immediately after the 440 tone was started.


    Example 10-1.


    ```

    tone(3, 440, 500);  // won''t be heard

    tone(3, 1000, 500); // might be heard

    ```


    The code shown in Example 10-2, however, play the 440 tone followed-half second
    later by the 1000 Hertz tone.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
