- img_proc: true
  md: 'These two boards perform similar functions but communicate with the Arduino™
    via different protocols.


    UART: Universal Asynchronous Receiver / Transmitter is an integrated circuit for
    serial communication of data between a computer and a device. In our case the
    computer is an Arduino, and the device is the Adafruit Bluefruit LE UART Friend.
    While the definition assumes an integrated circuit is managing this communication,
    the process can also be emulated in software running on the Arduino™. The former
    is called hardware UART; the latter software UART.


    SPI: Serial Peripheral Interface, a protocol for exchange of data between two
    electronic devices one at a time. One device is declared the master, the other
    the slave. In our case the master device is the Arduino™, with the Bluefruit LE
    SPI Friend the slave. The Arduino™ includes electronics specifically for managing
    this interface, but it can also be emulated in software running on the Arduino™.
    The former is called hardware SPI, the latter software SPI.


    +   2. Solder the male headers to the underside of the BT device as shown in Figure
    HT10-2. This is three-step process:


    # Steps


    | BT LE UART | BT LE SPI |


    Locate device and male header


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_275_0.png)


    Insert short side of male pins into underside of device


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_275_1.png)


    Solder


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_275_2.png)


    > Figure HT10-2. Soldering male headers to BT device


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
