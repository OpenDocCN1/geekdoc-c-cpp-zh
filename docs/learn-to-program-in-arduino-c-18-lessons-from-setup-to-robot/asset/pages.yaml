    | 1 | Arduino™ Uno | | Single-board computer. This board is delicate and should
    be handled with care. When you are not using it, keep it in a box or plastic bag.
    | 3102 |

    | 1 | USB Cable | | This is the standard USB adapter cable with the flat connector
