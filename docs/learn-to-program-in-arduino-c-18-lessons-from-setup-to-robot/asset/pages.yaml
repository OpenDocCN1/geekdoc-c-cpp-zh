  md: "All methods comply with this format. If a method does not have parameters,\
    \ empty parentheses are used in the name. (A parameter is a special kind of variable\
    \ used by a method to refer to data provided as input.) If no values are to be\
    \ returned, the return type is void. Example 2-3 is an Arduino™ method that has\
    \ no parameters and no values returned. This method merely plays sounds.\n\n#\
    \ Example 2-3. Example of Arduino™ method with no parameters\n\n```\nvoid playSounds(){\n\
    \  tone(5, NOTE_A4, 50);\n  delay(600);\n  tone(5, NOTE_E4, 50);\n  delay(300);\n\
    \  tone(5, NOTE_C4, 80);\n  delay(400);\n}\n```\n\nEvery Arduino™ sketch must\
    \ use, at a minimum, the two methods listed in Table 2-2.\n\n# Table 2-2. Methods\
    \ required in every Arduino™ sketch\n\n| Method | What the statement does | Return\
    \ Type |\n|---|---|-|\n| setup() | Initializes the Arduino™ and its components\
    \ | void |\n| loop() | Performs a task | void |\n\nBoth setup() and loop() have\
    \ void as the return type (or type of data that the method yields) because neither\
    \ ever any values. Neither has parameters, which is why their names are followed\
    \ by empty parentheses. To help other people understand you, the programmer, have\
    \ done and when and to aid you when you revisit a sketch, you can embed notes\
    \ within a sketch. These notes have nothing to do with how the sketch works; they\
    \ are for information only.\n\nOne way of entering a note is to begin with a pair\
    \ of slashes. The Arduino™ is executing programming statements, it ignores anything\
    \ following a pair of slashes. The following programming statement has a note:\n\
    \n```\nserial.println(\"Greetings.\"); // First line the user sees\n```\n\nAnother\
    \ method of entering a note is to use slash-asterisk bookends: /* and /. The content\
    \ between them becomes a comment, and the Arduino™ ignores the comment when it\
    \ is carrying out programming statements.\n\n# Example 2-4.\n\n```\n/* MyArduino™Sketch\n\
    <author>\n<date>\n*/\n```\n\nLesson 2 Communicating with the Arduino™"
