  md: '# Exercises:


    Exercise 4-1. LED thermometer

    Make a sketch called Thermometer that makes all six LEDs light up, going from
    pin 2 through pin 7, and then dark from pin 7 through pin 2, with 1/10th second
    between each change, thermometer style.


    The sketch must:


    +   - Begin with all LEDs off.

    - Light the LED connected to pin 2, then wait 1/10th second.

    - Leaving the LED connected to pin 2 on, light the LED connected to pin 3. Wait
    1/10th second.

    - Leaving the first two LEDs (pins 2 and 3) on, light the LED connected to pin
    4. Wait 1/10th second, and continue until the LEDs on pin 2 through 7 are on.

    - After leaving all LEDs on for 1/10th second, extinguish the LED connected to
    pin 6 and wait 1/10th second.

    - Leaving the LED connected to pin 7 extinguished, turn off the LED connected
    to pin 6 and wait 1/10th second, and continue until all LEDs are off. Wait 1/10
    second. By placing the code that does this in the loop() method, the pattern should
    repeat over and over.


