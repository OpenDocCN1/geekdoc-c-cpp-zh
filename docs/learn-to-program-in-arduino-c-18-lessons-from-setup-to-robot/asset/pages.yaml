- img_proc: true
  md: '| Term | Definition |

    | --- | --- |

    | initialization | The initial value assigned to a newly declared variable. |

    | literal | A notation for representing a fixed value in source code. Its value
    cannot be changed as a sketch runs. Literals are often used to initialize variables.
    |

    | scope | The portions of the Arduino™ sketch where a variable can be accessed.
    Scope comes in two kinds:

    * global: the variable is declared at the beginning of the sketch and may be accessed
    anywhere.

    * local: the variable is declared within a set of curly braces and may be accessed
    only within those curly braces. This will be discussed in a later lesson.


    String A sequence of characters treated as one object. Example: "Hello, World!"


    type The kind of data to be assigned to a variable. The type used in this lesson
    is String. Other types, which will be introduced in future lessons, are: boolean,
    int, double, and char.


    variable A name given to a location where a value can be stored. A variable is
    for a specific type. The name must follow naming rules. Putting a value into memory
    is referred to as assigning that value to the variable.


    # Description:


    The rules for using variables in C are:


    +   1. Declare a variable before assigning a value to it.

    2. Assign a value to a variable before using it for some other purpose, such as
    printing or having its value assigned to another variable.

    3. Give variables valid names, meaning the names follow some simple rules.

    4. Give variables meaningful names in accordance with good practices. Do not access
    a variable outside of its scope. Local variables may be accessed only from within
    their set of curly braces, while global variables may be accessed from anywhere
    within a sketch. The limitation on access is referred to as scope.


    # Declaring variables


    In order for Arduino sketch to use a variable, the sketch must first know two
    things about the variable: its name and its type.


    # Naming variables


    A variable can be given any name, subject to the following rules:


    +   1. A variable name may not begin with a number but can begin with an underbar
    (_) or a dollar sign ($).'
  merge: -1
  pgno: 32
- img_proc: true
  md: '2. A variable name may not contain spaces.


    3. A variable name may not contain mathematical operators: + - / * % =


    4. A variable name may not contain the symbols for logical operators: > < !


    5. A variable name may not contain a comma.


    Table 3-3. Examples of names of variables


    | Example | Comment |

    |---|---|

    | volumeOfCube | valid and descriptive. |

    | correct_answer | valid. |

    | ThreeForChange | invalid; cannot begin with a number. |

    | answerForQuestion5 | valid; number is allowed, not just the first character.
    |

    | location of wumpus | invalid; contains a space. |

    | taxrate | invalid; contains mathematical operator. |

    | age1,age2 | invalid as one name. C will interpret this as two variables, one
    age1 and the other named age2. |

    | FrodoLives | valid but not good practice as the name is not likely to be meaningful
    in the context of the sketch. |


    # Declaration


    A declaration is the C-language programming statement that makes a variable available
    to a sketch.


    For these first lessons, all variables will be given global scope, meaning they
    are declared near the top of the sketch, before the setup() function.


    The declaration statement consists of two required parts and one optional part.
    The type and the name are required. As part of declaring a variable, the programmer
    has the option of giving the variable an initial value. The format of the variable
    declaration is simple, consisting of three parts: the type, followed by the name
    and, optionally, an initial value for the variable.


    Example 3-1. String variable declarations in the C language


    ```

    String nameAccountHolder;

    String playerName = "Deputy Dog";nString capital;

    ```


    Notice the following about each of the declarations in Table 3-4:


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
