    Helper methods

    Sometimes a sketch will contain tasks that need to be performed in more than one
    place in the program code. Good practice calls for these tasks to be placed in
    their own methods. These are called [helper methods](https://www.arduino.cc/en/Tutorial/Function).


    Helper methods are also appropriate for containing a set of program instructions
    that perform a specific task that is easily separated from others. Setting a servo
    pulse width is an example of such a task.


    A helper method looks very much like the setup() or loop() method but with a different
    name. Helper methods may have parameters and may return a value of some type.


    Learn to Program in Arduino™: 18 Lessons, from setup() to robots'
