  md: '| Term | Definition |

    |---|---|

    | pulse | The setting of a pin from LOW to HIGH for a specific time, then returning
    to LOW. A single rise, wait, and fall cycle of the output voltage. |

    | pulse width | The length of time of a pulse is HIGH. |

    | Pulse Width Modulation | The act of sending information by varying the width
    of pulses. |

    | servo library | A set of predefined methods for communicating with and controlling
    servos. |

    | servo object | A copy of the Servo library that controls a specific servo. An
    object is made with a statement of the form Servo servo_1; In this example is
    made with a type of Servo. |

    | standard servo | A type of motor that moves in response to a pulse. The servo
    width (length of time it is HIGH) specifies the direction and angular distance
    of the turn. The range of 0 through 180 degrees is common. |


    # ## Description:


    Programming and controlling the servo


    As mentioned, the Servo library makes available a set of methods specifically
    intended to control servos. The steps for using this library in Arduino™ sketch:


    +   1. Connect a servo to an Arduino™.

    2. Include the Servo library in the sketch.

    3. Create a servo object for each servo to be controlled.

    4. Initialize each servo object.

    5. Use the methods in the servo objects to position the servos as needed.


    ### Step 1: Connecting a servo to an Arduino™

    Servos come with three wires to be connected to the Arduino,™ one to be connected
    to ground (gnd), one to be connected to a positive voltage (+5 or +6 volts), and
    one to receive the signal (pulse). Each wire has its own color indicating the
    type of purpose of the wire.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 123
