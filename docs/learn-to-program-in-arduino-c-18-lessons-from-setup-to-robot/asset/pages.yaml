  md: '# Arrays


    An array is a collection of like values. In that sense, it can be considered a
    list and be given a name. To be used, an array must first be created, filled with
    the desired values, and finally accessed by the sketch.


    # Creating an array of integers


    Suppose there is need for a list of numbers three. The list needs a name. That
    name is a variable. As with any variable it has `array type`, in this case integer
    array, and a name. The act of creating it is `array declaration`. The C statement
    in Example 17-1 declares a variable of type `integer array`. The resulting array
    has room for three integers.


    # Example 17-1. Declaring an array


    ```

    int myNumbers[3]; // create int array of length three

    ```


    # Setting the values of each cell in the array


    Each location in an array is called cell. The array in Example 17-1 has three
    cells. Cells are numbered beginning with the number 0. The number of the last
    cell in an array is always the length of the array minus 1.


    The programming statements in Example 16-2 set the value of the first cell to
    -27, the second cell to 45, and the third cell to 14.


    # Example 17-2. Setting the value of a cell


    ```

