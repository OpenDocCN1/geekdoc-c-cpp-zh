  md: 'voltage is to be +5 volts when the button is not pushed. To bring the pin voltage
    to +5 when the button is open, a high-value resistor is used. A typical value
    is 10,000 ohms. This resistor looks just like the current-limiting resistor used
    for the LED except that the color stripes are brown, black, orange.


    Complete push button schematic. Notice the push button connects the Arduino™ pin
    12 to ground. But when not pushed +5 volts is present at pin 12 via the 10,000
    ohm pull-up resistor. The resistor is "pulling the pin voltage up to +5."


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_89_0.png)


    Figure 8-4. Schematic diagram of Arduino™ push button circuit


    # Programming statements


    # Reading from a digital port


    To read from a digital port, the port must be first configured for input mode.
    This is accomplished with the setMode command.


    ```

    setMode(pin, mode);

    pin: the number of the pin to be read from or written to


    mode: either INPUT IF the pin is to be read from or OUTPUT if written to

    ```


    The actual reading is accomplished with the digitalRead command. This command
    returns a status of either HIGH, reflecting +5 volts is present, or LOW, indicating
    the voltage at the pin is zero.


    ```

    int status = digitalRead(pin);


    status: HIGH if +5 volts is present, else LOW

    pin: the number of the pin to be read

    ```


    The code shown in Example 8-1 sets pin 12 to the INPUT mode, reads its status,
    and stores that status to a status variable.


