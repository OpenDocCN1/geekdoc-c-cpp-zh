  md: 'The human eye does not respond to infrared. But some inexpensive digital cameras
    of the type found in older cell phones. The circuit shown in Figure 13-2 will
    produce infrared light easily seen by one of these cameras.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_141_0.png)


    An infrared diode is electrically almost the same as a light-emitting diode. The
    difference is that the light emitted is not visible to the human eye. This is
    why infrared diodes are used for television remote controls.


    To accurately mimic what the eye can see, better digital cameras filter infrared
    light. But older cell phone cameras lacked this filter.


    Figure 13-2. IRED circuit diagram


    Recall from Lesson 12 that infrared is very common. For this reason, infrared
    used in remote control electronics is modulated at 38,000 Hz. This modulation
    is unlikely to be found in nature.


    # About modulation


    Lesson 12 introduced the terms modulation, frequency, and the Hertz. This lesson
    will show how an Arduino can be programmed to transmit modulated pulses of infrared
    via an IRED. To do this, a little more needs to be understood about this modulation.


    The IRED must be turned on for a short time and then turned off for a short time;
    this must happen 38,000 times per second. This pair of events is called cycle.
    The length of time consumed by one cycle is called period.


    The units of time used for the Arduino™ are the second, the millisecond, and the
    microsecond. The relationships are: 1000 microseconds equals one millisecond,
    and one thousand milliseconds equals one.


    Table 13-1. Arduino™ C-language time units


    | Unit | Symbol | Relation to second | Programming example |

    |---|---|---|-|

    | second | s | | none |

    | millisecond | ms | 1 ms = 10⁻³ | delay<ms> |

    | microsecond | µs | 1 µs = 10⁻⁶ seconds | delayMicroseconds(µs)> |


    Figure 13-3 shows a few of the cycles within a pulse of a pulse. One of these
    is identified; the duration in microseconds shown.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
