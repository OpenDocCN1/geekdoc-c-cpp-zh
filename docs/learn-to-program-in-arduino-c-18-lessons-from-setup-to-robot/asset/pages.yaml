  md: '# Lesson 14


    # The Big Idea:


    The DC motor is a simple device, requiring only a connection to a source of direct
    current of voltage capable of delivering the current motor requires. This simplicity,
    however, brings with it three potential liabilities. First, these motors have
    electricity-conducting brushes that produce electrical interference. This can
    cause problems with sensors and other devices that work by watching for and interpreting
    pulses.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_155_0.png)


    Second, to develop much DC motors turn at speeds high for directly driving wheels
    of cars or propellers for boats. Gearing is used to reduce the revolutions per
    minute to values appropriate for such purposes. The motor shown in Figure 14-1
    is attached to a set of gears for just this purpose. The gears are in the yellow
    housing. The motor is the attached silver and black cylinder.


    Third, DC motors are difficult to control precisely and, are unsuitable for fine
    work such as driving the head on a 3D printer. This can be compensated some by
    adding components for detecting the speed and direction of the motor. The disc
    on the motor in Figure 14-1 contains magnets that are part of an encoder, a device
    for this purpose.


    Despite their limitations DC motors are useful because they are easy to control,
    respond quickly to changes in speed, make a satisfying whirring sound when spinning,
    and are inexpensive.


    In this lesson we learn how to provide appropriate power to a motor and control
    its direction and speed from an Arduino.


    # Background:


    This lesson refers to brushed DC motors. Other types are also in common use, particularly
    less motors and servo motors. The theory of operation is not discussed here. Wikipedia
    offers an explanation and animated illustrations of the operation of DC motors
    at https://en.wikipedia.org/wiki/DC_motor.


    # Voltage regulation


    One characteristic of the DC motor that is very important for the purposes of
    this lesson is the motor''s electrical resistance. The slower the motor the lower
    its electrical resistance and, therefore, the greater demand for electrical current.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'The reason this is important is in these lessons the motors are powered by
    batteries. Batteries, in turn, have an internal resistance. As the resistance
    of a motor goes down, the voltage across the motor drops as the proportion of
    the battery''s internal resistance to total resistance increases. The result is
    all motors being driven by the batteries slow. To the observer, the DC motors
    just seem to be running poorly.


    To minimize effect, this lesson uses a battery with a higher voltage than what
    was intended for the motor and a voltage regulator to maintain the voltage delivered
    to the motor at a lower but constant value. This approach works because the internal
    resistance of the battery impacts the voltage delivered to the regulator, not
    to the motor.


    # Electrical noise


    The DC motor turns because a magnetic field generated by coils of wire switches
    polarity frequently. This is accomplished by brushes that are constantly breaking
    and making electrical connections. Each make and break generates a tiny spark
    that can be picked up by nearby wiring, possibly contaminating whatever electrical
    messages are being conveyed by wires.


    This interference cannot be completely eliminated, but we do two suppression steps
    to reduce the interference to an acceptable level.


    One step is the soldering of a 0.1 microfarad capacitor across the electrical
    terminals of each motor.


    The other is the careful preparation and dressing of the wires that bring the
    electricity to each motor. In particular, these wires are:


    +   1. made just long enough to reach the power source,


    +   2. twisted tightly together, and


    +   3. routed in a way that keeps them away from the wiring of devices that are
    sensitive to interfer-nence.


    # H-bridge


    The direction a DC motor is dictated by the polarity of the electricity delivered
    to the motor terminals. Unlike the servo motor described in Lesson 11, with a
    DC motor, specifying a pulse width cannot control the motor''s direction and speed.
    However, the digital pins of an Arduino™ operate an electronic switch capable
    of controlling the motor''s direction and speed.


    This device is called an H-bridge. Its internal operations aren''t described here,
    but Figure 14-2 shows how one is configured for use with an Arduino. The direction
    of the attached motor is the result of the values written to the Arduino™ pins.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_157_0.png)


    The H-bridge is an integrated circuit. The five-volt connection to the Arduino™
    powers the circuit''s logic. The six volts from the voltage regulator is for the
    motor. The Arduino™ pins are set to OUTPUT mode. and which direction the DC motor
    turns depends on the values written to those pins, as shown in Table 14-1.


    Table 14-1. Results of Arduino™ pin values


    | Pin connected to MC1 | Pin connected to MC2 | Motor |

    | --- | --- | --- |

    | HIGH | HIGH | Stops |

    | HIGH | LOW | Turns counterclockwise |

    | LOW | HIGH | Turns clockwise |

    | LOW | LOW | Stops |


    Speed


    Any pair of Arduino™ digital pins can control the direction of a DC motor. If
    the digital pin connected to MC1 is set to HIGH and the digital pin connected
    to MC2 to LOW, the motor will turn clockwise, at full speed. One way to control
    the speed of a DC motor is to reduce the average voltage. This can be done if
    one of the digital pins is capable of analog output. Analog output and how it
    can result in a lower average voltage is discussed in Lesson 9.


    For the example just given, the clockwise rotation of the motor can be controlled
    by setting the pin connected to MC1 to send a series of pulses instead of being
    set to HIGH.


    Suppose the motor has connections as seen in Table 14-2.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Table 14-2. Arduino™ pin connections to H-bridge


    | Arduino™ Pin | H-bridge connection | Notes |

    |---|---|---|

    | 3 | MC1 | Analog-capable |

    | 4 | MC2 | Not analog-capable |


    The programming statements that cause the motor to turn full-speed counterclockwise:


    ```

    digitalWrite(3, HIGH); // full-speed counterclockwise

    digitalWrite(4, LOW);

    ```


    The following programming statements will also cause the motor to turn full-speed:


    ```

    analogWrite(3, 255); // full-speed counterclockwise

    analogWrite(4, LOW);

    ```


    The speed of the motor can now be reduced by reducing the average output of pin
    3. This is accomplished by reducing the second parameter to a value less than
    255.


    ```

    analogWrite(3, 200); // less than full-speed

    analogWrite(4, LOW);

    ```


    Note: if the analog-capable pin is set to LOW instead of HIGH, the speed control
    process is similar, but instead of reducing the parameter from 255 it is increased
    from 0. The following statements cause the motor to turn clockwise at full speed:


    ```

    analogWrite(3, 0); // Clockwise at full speed

    digitalWrite(4, HIGH);

    ```


    and at reduced speed:


    ```

    analogWrite(3, 100); // clockwise at reduced speed

    digitalWrite(4, HIGH);

    ```


    # Table 14-3. Vocabulary


    | Term | Definition |

    |---|---|

    | DC motor | A type of motor that uses brushes to cause changes in a magnetic
    field in order to turn. Requires a two-wire connection, positive and one negative.
    Speed is controlled by changing the supplied voltage. |

    | H-bridge | An electronic circuit that can be used to control the polarity of
    the voltage delivered to a DC motor.'
