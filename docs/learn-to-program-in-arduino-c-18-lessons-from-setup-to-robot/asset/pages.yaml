  md: '3. Modify the MyBlink sketch to make the light blink on and off at half-seconds
    by changing the number 1000 to 500 in the two delay moments. Do not be concerned
    about understanding the sketch at this time. The intent of this step is simply
    to verify the proper operation of the Arduino™ and the IDE.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_13_0.png)


    4. Save the modified sketch by selecting [File] then [Save].


    5. Upload the sketch to the Arduino™. If you''re successful, the light should
    blink twice as fast as before.


    Exercise 1-2. Verify sketch runs on Arduino™ and experiment with time delays


    +   1. Verify that the modified sketch is, in fact, running on the Arduino and
    not on the computer to which the Arduino™ connects. This can be done by unplugging
    the Arduino™ from its USB cable and providing power to the Arduino™ by means of
    a wall-plug power supply (3101 in Parts Catalog) or a battery pack. Note: The
    light should blink even though the Arduino™ is independent of the computer.

    2. The number used in the delay statement, delay(500); is a measure of milliseconds.
    The number "500" is 500 milliseconds, or one half second. This is a common technique
    used to save power. For example, roadside flashers turn their lights on for short
    periods of time while leaving them off for a longer period. Experiment with the
    values of MyBlink to find the shortest blink time that still appears to be long
    enough to be noticed by a casual observer.


