  md: '# Procedure:


    Follow the instructions for the type of glue. Drying and curing times are different.
    "Dry" often means the glued object does not need continued support. But the glue
    hasn''t reached its full strength until it is "cured," that is, when the chemical
    reactions are complete. Curing usually requires several hours.


    +   1. Glue the front and rear panels to the side panels as shown in Figure HT1-1.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_219_0.png)


