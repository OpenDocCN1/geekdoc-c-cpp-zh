  md: '# How-To #1: Assemble DC-Motor Robot Chassis


    Background:

    A chassis is the frame of a device. The components are attached to this frame.
    The chassis described in this How-To is for two geared DC motors with wheels,
    an Arduino™ with a motor controller shield, a battery pack, an H-bridge circuit
    board, and a rear wheel.


    This chassis is made from wood, although other materials will certainly serve.
    The wood is pre-cut into five pieces: the front panel, the rear panel, two side
    panels, and a deck. Modeling glue for wood is the recommended adhesive. For precisely
    rectangular construction a corner clamp is high-ly recommended, although is not
    absolutely required.


    # Materials:


    Included in Robot Body kit (part RB103)

    All parts necessary to assemble the chassis and attach it to the Arduino,™ navigation
    shield, the battery pack, and the DC motors are included in the kit.


    | Quantity | Part | Image | Notes | Catalog Number |

    |---|---|---|---|--|

