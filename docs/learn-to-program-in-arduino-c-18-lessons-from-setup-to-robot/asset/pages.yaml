  md: '# Lesson 17 - Control Tone with IR Remote


    # The Big Idea:


    The ability to detect and decode Sony-protocol infrared messages, which was explored
    in Lesson 16, can be added to any Arduino™ sketch. This means that with the addition
    of an infrared sensor, an Arduino™ sketch can be made to respond to the buttons
    pushed on a remote control.


    This lesson combines remote controllability with the techniques for generating
    musical notes explored in Lesson 10 to transform a television remote into a sort
    of musical instrument.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_188_0.png)


    Figure 17-1. Create musical instrument using remote control, Arduino™ and speaker


    # Background:


    Clearly a television remote control does not make a good musical instrument. But
    that''s not really the purpose of this lesson. The next lesson, Lesson 18, adapts
    the infrared remote to the rolling robot built in Lesson 15. The purpose of this
    lesson is to introduce adding the ability to detect and decode infrared messages
    to a sketch intended to do something, in this case play a musical note. The final
    sketch will play eight different notes in response to pressing the numbers 1 through
    8 of the remote control.


    This lesson also introduces the array, a programming tool for managing a group
    of values. In this case the array holds the values of the eight notes the remote
    can play. Arrays are extremely useful in programming and, therefore, very common.'
  merge: -1
  pgno: 188
- img_proc: true
  md: "# Table 17-1. Vocabulary\n\n| Term | Definition |\n|---|---|\n| array | A set\
    \ of values, in this case integers that represent different musical notes. |\n\
    | array declaration | The programming statement that creates and initializes an\
    \ array. |\n| array type | The type of data that a cell may contain. In this lesson\
    \ the array is of type int, meaning each cell may only store an integer. But arrays\
    \ can be of other types, including boolean, double, and string. |\n| cell | An\
    \ individual address within an array. A value is stored in a cell. |\n| index\
    \ | The address of a cell within an array. These are assigned in order, beginning\
    \ with zero. The index of the first cell is always 0, the second is 1, the third\
    \ is 2, and so on. A cell of length 5, for example, has the index numbers of 0,\
    \ 1, 2, 3, and 4. |\n| value | The contents of a cell. |\n\nDescription:\n\nThe\
    \ Lesson17IRPlaytones sketch in Lesson 16 is Lesson16SonyProtocol.ino. A reminder\
    \ here: the approach and method of the code in this sketch is from LadyAda tutorial,\
    \ as noted in the heading comments. Contained in this sketch is the methodFull(),\
    \ which abstracts and prints the address and command components of the message.\n\
    \nThe sketch for this lesson Lesson17IRPlaytones.ino It is essentially a copy\
    \ of the Lesson 16 sketch but with the following changes:\n\n+   1. An array of\
    \ eight integers is added to identify the different musical notes that are to\
    \ be played in correspondence with the buttons 1 through 8 on the remote control.\
    \ The actual values contained in each cell of this array are defined by the file\
    \ pitches.h, which was introduced in Lesson 10. This is also included in this\
    \ sketch.\n2. The printFull() method is renamed playNote() and its contents modified\
    \ as:\n   a. The command is evaluated to see if it is one of the buttons 1 through\
    \ 8. If not, then any tone currently being played is stopped.\n   b. If a button\
    \ 1 through 8 is being pushed, then the note corresponding to the array positions\
    \ of the button is played.\n\nBut this only works because that array of integers.\n\
    \nLearn to Program in Arduino C: 18 Lessons, from setup() to robots"
