    \ connected. Male-to-male jumper wires are used to make the electrical connections\
    \ between components. Female-to-female jumper wires simply extend male jumpers\
    \ too small for a job.\n\n![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_46_1.png)\n\
    \n# Programming a Digital Pin\n\nIn this lesson digital pins are used to light\
    \ LEDs. This requires setting each pin to the status of OUTPUT.\n\nTwo new C-language\
    \ parameters are required, pinMode() and digitalWrite(). Both of these statements\
    \ require parameters. These are the pin number and desired mode for pinMode()\
    \ and pin number and status for digitalWrite().\n\npinMode() and digitalWrite()\n\
    \n```\npinMode( pinNumber, mode)\npinNum- integer that specifies which pin is\
    \ to be accessed.\ber: constant specifying the pin's direction.\nOUTPUT: program\
    \ can set the pin's voltage to +5V or 0V.\nINPUT: program can detect a voltage\
    \ applied to the pin.\n```\n\nexample: pinMode( 2, OUTPUT); // sets pin 2 to output\
    \ ndigitalWrite( pinNumber, status)"
