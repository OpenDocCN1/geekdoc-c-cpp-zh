  md: '# How-To #2: Create a PCB using Fritzing and OSH Park


    Background:

    This-To provides instructions on how to create a printed circuit board (PCB) using
    the Fritzing (http://www.fritzing.org/) open-source design tool and then prepare
    that for fabrication by OSH Park (http://www.oshpark.com/), which provides an
    economical fabrication service suited for small volumes.


    Because the production files Fritzing produces are not a perfect match to the
    requirements of OSH Park, this document provides step-by-step instructions for
    modifying the Fritzing files and uploading them to OSH Park for production. The
    instructions ensure the circuit-board designer an OSH Park; accounts are free
    and easy to set up on the website.


    > This-To does not include information about using the Fritzing software to design
    a circuit board. The Fritzing website provides excellent tutorials for this purpose.
    Keep in mind that circuit-board design is both an art and a science. Important
    will be mastered with practice.


    Fritzing is unusual in that it allows a designer to begin with an interactive
    tutorial of a breadboard, jumper wires, components, and an Arduino() single-board
    computer. The user can enter her bread-board experiment, then edit the schematic
    diagram generated by Fritzing, and finish by laying out the resulting circuit
    board. Some users prefer to go directly to the circuit-board layout and bypass
    the bread-board and schematic views.


    The Infrared Navigation circuit board used by the Rolling Robot project is the
    example used here. Figure HT2-1 shows the three views of this circuit as inside
    the Fritzing software.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_224_0.png)


    | Bread-board (pictorial) view | Schematic view | Circuit-board view |


    The bread-board view in HT2-1, is a pictorial view — a picture or drawing of how
    the parts are physically connected.


    The schematic view is an economical representation of the way the electricity
    flows.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'The actual Fritzing design file for this circuit board can be found on LearnCSE.com.


    # Procedure:


    +   1. Design the circuit board using Fritzing. (Instructions and tutorials for
    Fritzing are found on the organization''s website, http://www.fritzing.org)

    2. Create a set of Gerber files for exporting production. The menu path is:


    File -> Export -> for Production -> Extended Gerber (RS-274X...)


    A set of nine files will be created for the IR Navigation board, the files are:


    ```

    IRNavigationVerPt6DoubleSidedGroundFill_contour.gm1

    IRNavigationVerPt6DoubleSidedGroundFill_copperBottom.gbl

    IRNavigationVerPt6DoubleSidedGroundFill_copperTop.tpl

    IRNavigationVerPt6DoubleSidedGroundFill_maskBottom.gbs

    IRNavigationVerPt6DoubleSidedGroundFill_maskTop.gs

    IRNavigationVerPt6DoubleSidedGroundFill_silkBottom.gbo

    IRNavigationVerPt6DoubleSidedGroundFill_silkTop.txt

    IRNavigationVerPt6DoubleSidedGroundFill_drill.txt

    IRNavigationVerPt6DoubleSidedGroundFill_fnp.txt

    ```


    This listing was taken from a Macintosh computer. The listing on a Windows computer
    will be similar, but the .txt file will be missing from the _drill file.


    +   3. Look for the file that ends with _drill. On a Macintosh it will also have
    the suffix .txt, indicating it is the suffix to .xln. Thus, in this example,


    IRNavigationVerPt6DoubleSidedGroundFill_drill.txt

    ncomes

    IRNavigationVerPt6DoubleSidedGroundFill_drill.txt.xln


    For a Macintosh computer, the .txt file exists but is hidden from the user. (The
    file would be named IRNavigationVerPt6doublesidedgroundfill_drill.) Windows computers
    users will then open the file with a good text editor, such as Notepad++. Then
    save the file as a.* and add the file extension .xln to the name. This will result
    in two files ending in _drill suffix. Delete the one without the .xln suffix.


    +   4. Locate the file that specifies the top silk screen. It will end with _silkTop,
    followed by the suffix .gto. Make a copy of this file to change the suffix to
    .gko. This will result in two files for the top silk screen, one with the suffix
    .gto and the other with the suffix .gko.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 225
