    \nTable 5-2. Differences between algebraic math and math in C\n\n| Algebra | C\
    \ Programming language |\n|---|---|\n| Equals sign ( ) | Indicates equality. That\
    \ is, the expression on the left of the equals sign evaluates to the same result\
