  md: 'This is a comparison of the value of the variable piNum with the integer literal
    7. The result of this comparison is either true or false. The symbols <= combination
    is called a comparison operator. This particular one is read as "less than or
    to" and is one of six comparison operators in the C language. The set of six comparison
    operators appears in Table 7-2.


    Table 7-2. Comparison operators


    | Operator | Example | Meaning |

    | --- | --- | --- |

    | Greater than | > | a>b | True if the value of a is greater than the value of
    b. Otherwise false,v |

    | Greater than or equal to | >= | a=>b | True if the value of a is greater than
    the value of b or if a is equal to b. Otherwise false. |

    | Less than | < | a<b | True if the value of a is less than the value of b. Otherwise
    false. |

    | Less than or equal to | <= | a<=b | True if the value of a is less than the
    value of b or if a is equal to b. Otherwise false. |

    | Equal to | == | a==b | True if the value of a is equal to the value of b. Otherwise
    false. |

    | Not equal to | != | a!=b | True if the value of a is not the same as the value
    of b. Otherwise false. |


