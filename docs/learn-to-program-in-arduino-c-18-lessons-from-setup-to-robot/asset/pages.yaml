  md: '# Table 1-3. Vocabulary


    | Term | Definition |

    | --- | --- |

    | algorithm | A means of or steps to performing a specific task. For a computer,
    an algorithm is usually expressed in a set of computer program instructions. |

    | Arduino™ | A single-board computer and an open-source electronics platform based
    on easy-to-use hardware and software. It''s intended for anyone making interactive
    projects. |

    | C programming language | The programming language used to write sketches for
    the Arduino™ SBC. The syntax is similar to several other used programming languages,
    C++, C#, and Java. |

    | Integrated Development Environment (IDE) | A collection of computer programs
    used to create other programs. |

    | microcontroller | A complete self-contained computer in a chip, including the
    memory for a program and its data. This small microprocessor also contains the
    necessary electronics to communicate with external devices. |

    | microprocessor | A complex electronic integrated circuit that performs the processing
    tasks of a computer, including input, output, and computation. |

    | output | Information of any sort that comes out of a computer. |

    | single-board computer (SBC) | An entire microcomputer on a printed board. Abbreviated
    SBC. Examples include the Arduino™ and the Raspberry Pi. |

    | sketch | A computer program written for the Arduino™. |


    # Description:


    Arduino™ is a name given to a family of single-board computers (SBCs). The particular
    family member used in lessons in this book is the Arduino™ Uno. All Arduinos™
    contain an integrated circuit called a microcontroller. A microcontroller is a
    small but complete microprocessor capable of input, output, and computation. In
    addition, a microcontroller includes storage memory for a computer program and
    its data.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_7_0.png)


    Figure 1-1. The Arduino™ Uno


    Surrounding this microcontroller are the electronic components, connectors, and
    rows of sockets to bring power to the microcontroller, allow it to receive information
    from the outside world, and to transmit information.


    The term single-board means that the entire computer fits on a single circuit
    board. Different members of the Arduino™ family have different features. Some
    are small and light enough to be sewn into clothing, while others are sufficiently
    powerful to perform complex tasks very quickly. But they are a family that are
    all programmed with the same language. The syntax of this language is so very
    close to C that it is referred to as the C language. Mastery of this language
    serves as an excellent base for other commonly programming languages, including
    C++, C#, and Java.


    The upcoming lessons explore most of the features of the Arduino™ Uno. This first
    lesson begins with installation and testing of the set of computer programs used
    to write Arduino™ sketches. This collection of computer programs is the Arduino™
    Integrated Development Environment (IDE). A program written for the Arduino™ is
    called a sketch.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 7
