  md: '+   1. Each declaration begins with the type of variable. In this case each
    variable is of type String.


    +   2. The type of variable is followed by the variable name.


    +   3. These names follow the naming rules, convey meaning, and comply with the
    camel naming convention.


    +   4. The variable playerName is assigned an initial value.


    # Assigning using values


    Once declared, a variable can be assigned a value using the equals sign. In C,
    the equals sign is referred to as assignment operator. That value may be replaced
    by the assignment of a new value. For the example:


    ```

    nameAccountHolder = "Flintstone";\stores the String literal Flintstone to the
    variable nameAccountHolder.

    ```


    This statement:


    ```

    Serial.println(nameAccountHolder);

    ```


    will cause the String Flintstone to appear on the Arduino™ IDE''s Serial Monitor.


    This statement changes the value stored to the variable nameAccountHolder:

    nameAccountHolder = "Rubble";


    Now the statement:


    ```

    Serial.println(nameAccountHolder);

    ```


    will cause the String Pebble to appear on the Serial Monitor.


    # Concatenation


    Finally, the plus (+) may be used to append one String to another. This is called
    concatenation. For example, consider the following two declarations:


    ```

    String actorFirstName = "Yogi";

    String actorfamilyName = "Bear";

    ```


    Suppose the programmer needs to have the full name stored to another variable,
    called actorFullName. Further, a space is required between the two names. One
    way to do this is with concatenation, where the first name, a space String literal,
    and the last name are combined. See Example 3-2.'
