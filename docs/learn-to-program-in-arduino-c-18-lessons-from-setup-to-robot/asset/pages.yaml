  md: '# Description:


    The heart of the H-bridge circuit built here is the L293 integrated circuit. The
    pinout for these is in Figure HT7-3.


    | To Arduino pin for enabling motor 1, or to +5v | 1 | Vcc Arduino +5 volts |

    |---|---|---|

    | To first Arduino pin for motor 1 | 15 | To first Arduino pin for motor 2 |

    | To motor 1+ | 14 | To motor 2+ |

    | Ground | 13 | Ground |

    | Ground | 12 | Ground |

    | To motor 1- | 11 | To motor 2- |

    | To second Arduino pin for motor 1 | 10 | To second Arduino pin for motor 2 |

    | Vcc- or to 1v | 9 | To Arduino pin for enabling motor 2, or to +5v |


    Figure HT7-3. Pinout of L293 integrated circuit


    Notice how each side of this integrated circuit controls one motor from a pair
    of "Arduino" pins. Pins 1 and 9 can be used to enable and disable their respective
    motors. For this circuit board we permanently enable both motors by connecting
    these pins to +5 volts.


    > The notch at the top indicates the end of the integrated circuit close to pin
    1. This notch to orient the circuit with the circuit board. Reversing it will
    result in an H-bridge circuit board that cannot function.


    # Building or Buying the Circuit Board


    The raw circuit board used here is double-sided. It has designed for ease of assembly
    by using large traces for easy. It can be obtained in the following ways:


    +   1. Buy it directly from LearnCSE.com. The board can be purchased by itself
    or as part of a kit containing all the other necessary components.


    +   2. Do-it-Yourself fabrication. The Fritzing (www.fritzing.org) project file
    is available for download from LearnCSE.com. The Fritzing application can print
    accurately scaled masks for each side of the board.


    +   3. Have the board commercially made by a board fabricator such as OSH Park.
    Instructions for submitting a Fritzing-designed board to OSH Park can be found
    on LearnCSE.com.'
  merge: -1
