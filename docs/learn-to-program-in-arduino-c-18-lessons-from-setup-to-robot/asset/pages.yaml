  md: '# Programming statements


    The three C-language commands that work with analog input and output are analogRead,
    analogwrite, and map.


    The command analogRead() returns a number from 0 through 1023 that is proportional
    to the voltage from 0 through +5 volts on the read pin. The command analogWrite()
    sets an output pin''s average voltage between 0 and +5 by writing an integer in
    the range of 0 through 255.


    The command map() remaps a number from one range to another.


    # analogRead


    ```

    analogRead(pinNumber) value Integer between 0 and 1023

    ```


    +   - pinNumber Integer that specifies which analog port is to be accessed. On
    the Arduino" Uno the analog ports are 0 through 5.

    - example int val;


    ```

    val = analogRead(A2); // returns 0 to 102

    ```


    # analogwrite


    analogwrite(pinNumber, value)


    value Integer from 0 through 255 that specifies how much time the pin specified
    by pinNumber is HIGH vs. LOW. Expressed as a percentage of 255, this value is
    called the duty cycle. For example, a value of 153 specifies a duty cycle of 60%,
    meaning the pin is switching rapidly between HIGH and LOW in such a way that it
    is HIGH 60% of the.


    +   - pinNumber Integer that specifies which pin is to be accessed. Use of pins
    5 and 6 are not recommended.

    - example analogwrite(3, 100);


    # map()


    | map ( value,fromRangeLow,fromRangeHigh,toRangeLow,toRangeHigh) |

    | value The number to be mapped. It is expected to be between fromRangeLow and
    toRangeLow. |

    | fromRangeLow Integer representing the low end of the range being converted from.
    |

    | fromRangeHigh: Integer representing the high end of the range being converted
    from. |

    | toRangeLow Integer representing the low end of the range being converted to.
    |

    | toRangeHigh Integer representing the high end of the range being converted to.
    |'
  merge: -1
