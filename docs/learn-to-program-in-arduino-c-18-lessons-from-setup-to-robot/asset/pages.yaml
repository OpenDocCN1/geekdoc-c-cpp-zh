    IRnavigationVerPt60DoubleSidedGroundFill_maskBottom.gbs

    IRnavigationVerPt60DoubleSidedGroundFill_silkTop.gto

    IRnavigationVerPt60DoubleSidedGroundFill_silkBottom.gbo

    IRnavigationVerPt60DoubleSidedGroundFill_silkTop.gko

    IRnavigationVerPt60DoubleSidedGroundFill_drill.xln


    The zip file can be given any valid name. In the example, the name is:

    IRnavigationVerPt60DoubleSidedGroundFill.zip


    +   6. Go to http://www.oshpark.com/, click the ([Get Started] button, and follow
