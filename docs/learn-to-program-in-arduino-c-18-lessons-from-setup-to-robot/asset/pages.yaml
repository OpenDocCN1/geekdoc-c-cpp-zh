  md: '# Description:


    This lesson introduces electronic components for the first time—in particular,
    the light-emitting diode (LED) and the resistor. It also includes drawings of
    how these components are wired and connected to digital pins on the Arduino. A
    picture or drawing of this connection is called a pictorial.


    The nice thing about a pictorial wiring diagram is that it is easy to duplicate.
    Just the wires as shown. The trouble with the pictorial, however, is that showing
    even modest complex circuits become difficult. Engineers use a kind of drawing
    shorthand, such as schematic, for showing how components are wired together. A
    schematic is concise; it does an excellent job of showing how electricity is moved
    through a circuit. Complex circuits are much easier to diagram. To the point,
    it is far easier for a programmer or engineer to understand complex circuitry
    by reading a schematic rather than a pictorial.


    But schematics are also abstract. They reflect the electricity flows, not how
    the parts and wires are physically arranged. Reading a schematic is a learned
    skill. As components are introduced, the images are accompanied by their schematic
    symbol. For the next lessons, wiring diagrams will be presented in both pictorial
    and schematic form. Later lessons present wiring diagrams in schematic


    # Components


    This lesson introduces the light-emitting diode (LED) and the resistor. These
    are added to the bill component that has been in use since Lesson 1, the Arduino™
    itself. Each has a pictorial and a schematic symbol.


    # Light-emitting diodes


    LED is a semiconductor device that lights up when properly connected to a source
    of electrical current. A proper connection means the anode is positive relative
    to the cathode. For an Arduino™ this usually means the cathode is connected to
    ground (GND).


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_44_0.png)


    Figure 4-2. LED shown in pictorial and schematic forms


    # Resistors


    A resistor is a component that inhibits the flow of electrons. A resistor has
    many uses, but in this case it is used to limit the electrical current that goes
    through an LED. Most resistors are made from some carbon compound. They come a
    wide variety of values; color stripes indicate the value of an individual resistor.'
