  md: '# Exercises:


    Exercise 18-1. Add direction buttons to arrows

    This exercise may not work with your Sony-compatible remote control. The goal
    is to make control of your robot more intuitive by having it respond to up, down,
    left, and right arrows common on controls. These are usually grouped around a
    center button that may say like stop or select or may have a simple symbol.


    Take a look at your remote control. If it has such arrows, and these arrows are
    not marked as changing volume or channel, refer to the table of addresses and
    commands you made in Lesson 16. Notice that each arrow button, including the center
    one, transmits an address and a command. Unlike the 0 through 9 number buttons,
    the command values may not be the same for different addresses. Unlike Up for
    Arrow may be different than Up Arrow for DVD.


    Make a copy of the Lesson18bridgeMotorControl.ino sketch and save it as Lesson18Exercise1.ino.
    Modify Lesson18exercise1.ino as follows:


    +   1. Set the address to ADDRESS_TV.


    +   2. Locate where the command values for different buttons are defined. This
    section is about line 100 and has some comments titled


    ```

    // DEFINE WHICH BUTTON ON THE REMOTE DOES WHAT.

    ```


    +   3. Add definitions for each of the four arrow buttons and the center button.
    Following are two examples. Do not trust the values to be correct.


    ```

    #define MOTORS_FORWARD_ARROWUP 65

    #define MOTORS_REVERSE_ARROWDOWN 76

    and so on. Again, these particular values are probably wrong. Use the ones on
    your table.

    ```


    +   4. Modify any other parts of the sketch to make your robot respond to the
    arrow keys as well as the number keys.


    HINT: Motors forward might look something like this:


    ```

    case MOTORS_FORWARD:

    case MOTORS_FORWARD_ARROWUP:

    forward();

    break;

    ```'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Exercise 18-2. Add the ability to pivot


    The sketch Lesson18BridgeMotorIRControl.ino provides for changing direction only
    by spinning, which can be difficult to manage.


    If you completed Exercise 18-1 and created Lesson18Exercise1.ino, make a copy
    of that sketch and save it as Lesson18Exercise2.ino. Otherwise, make a copy of
    Lesson18BridgeMotorIRControl.ino and save it as Lesson 18Exercise2.


    Extend the capabilities of Lesson18Exercise2.ino by adding the ability to pivot
    four different ways:


    +   1. pivot right going forward when the number 3 is pressed. This means the
    right wheel is stopped and the left is turning counterclockwise. Put the code
    for this in a method named pivotRightForward().


    +   2. pivot left going forward when the number 1 is pressed. This means the left
    wheel is stopped and the right is turning clockwise. Put the code for this in
    a method named pivotleftForward().


    +   3. pivot right going backwards when the number 9 is pressed. This means the
    left wheel is stopped and the right is turning counterclockwise. Put the code
    for this in a method named pivotLeftReverse().


    +   4. pivot left going backwards when the number 7 is pressed. This means the
    right wheel is stopped and the left is turning clockwise. Put the code for this
    in a method named pivotRightReverse().


    To make this work, you will need to define four new commands at the top of the
    sketch. Add these commands to the switch in the setdirection() method.


    # Exercise 18-3. Add an LED to robot and turn on and off


    Make a copy of Lesson18BridgeIRcontrol.ino, Lesson18Exercise1.ino, or Lesson18Exercise2.ino,
    and save it as Lesson18Exercise3.ino. Then, add a speaker and the field effect
    to Lesson 10. Modify Lesson18Exercise3.ino so that your robot makes a "beep, "beep"
    sound when backing up.


    One of the problems with remote control of robots is when the wheels are not turning
    the robot around. It''s not really off; it''s just waiting for a command from
    your remote control. Meanwhile, the robot is consuming power from the batteries.
    (In addition, it''s possible for your robot to respond to commands issued by remote
    controls other than yours.) In this exercise, you add a current-limiting resistor
    and LED to your robot so it lights when the robot is on stopped. You can then
    tell at a glance whether the robot is on or off. The LED turns off when the robot
    is in motion.


    Make a copy of your choice of a working Lesson18 sketch and save it as Lesson18Exercise14.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 215
