  md: '# Install Adafruit Bluetooth Connect on smartphone or tablet


    8. This is a free application that is used to connect to the Bluetooth device.
    It may be found and downloaded from the app stores for Apple’s iOS and Google’s
    Android operating systems.


    # Update Bluefruit LE device firmware


    > > Important

    This is an absolutely essential step. Many features of the Adafruit Bluetooth
    LE library will not function without doing this. Unfortunately, the process is
    simple.


    9. Apply power to the Arduino™ to which the Bluefruit device is connected. The
    red indicator LED will begin to flash.


    10. Open the Adafruit Bluetooth application on the smartphone or tablet. A list
    of devices will appear. A new Bluefruit LE device will appear in a box labeled
    Bluefruit LE.


    11. Select the device by touching the rectangle. If a firmware update is required,
    a notice will appear. If this happens, follow the steps to install the update.


    This firmware update comes from a GitHub repository. Internet systems, including
    those found in public schools, will block access to GitHub. If this happens, the
    update will appear quickly when, in fact, no update has occurred at all. If you
    have any reason to suspect the update was not installed, connect to the phone
    service’s Internet access instead of WiFi and try again.


    # Test connectivity with BTLETerminal


    12. Download the BTLETerminal.zip file from LearnCSE.com. This file may be found
    in the Sketches menu on the right side of the Learn program and the How-to page.


    13. Unzip this file into the Arduino™ folder so that BTLETerminal appears as an
    Arduino™ sketch.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_278_0.png)


    Figure HT10-5. File structure of BTLETerminal sketch after being unzipped


    14. Using File -> Sketchbook open BTLETerminal. The Arduino™ IDE should look something
    like Figure HT10-6.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_278_1.png)'
