    \ the logical operators and their application in logical statements that resolve\
    \ to either true or false. These same operators may be used to direct the flow\
    \ of an Arduino™ sketch. If such-and-or-condition is true, then he does these\
    \ things. Else, do those different things.\n\nif and else are C-language keywords.\n\
    \n# The if statement:\n\nThe general form of an if statement is:\n\n```\nif(<logical\
    \ expression> {\n    <programming statement>\n    <programming statement>\n  \
    \  <programming statement>\n}\n```\n\n> Programming statements to be executed\
    \ if the logical expression resolves to true\n\nExample 8-5. General form of an\
    \ if statement\n\nFor example, suppose energyLevel is an integer with a value\
