    should be visible when the chassis is complete. | |

    | 1 | Front Panel | ![image]() | Curved along the bottom. Attaches on each side
    to the end of the side panel with the large rectangular cut-out. | |

    | 2 | Side Panels | ![image]() | End with large rectangular cutout should be near
    the front panel. | RB103 |

    | 1 | Rear Panel | ![image]() | U-shaped opening, should be attached with the
    U opening down-ward. | |

    | 1 | Rear Wheel | ![image]() | One-inch diameter wood ball with a hole through
    the center. | |

