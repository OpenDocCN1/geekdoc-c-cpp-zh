    | 7 | Jumper wires | | Male – Male | 3105 |


    # Procedure:


    The following steps will result in an Adafruit Bluetooth LE (low-energy) device
    being used to control the rolling robot of Lesson 15 from a smartphone. The smartphone
    application itself is from Adafruit (Adafruit.com) and may be found in the IOS
    and Android app stores.


    # Wiring


    +   1. Determine which Bluetooth LE Friend you are working with. The images in
    Figure HT10-1 are taken from the Adafruit website:


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_274_0.png)


    Figure HT10-1. Bluefruit LE UART Friend and Bluefruit LE SPI Friend'
