  md: '# Table 11-3. Servo wires


    | Wire connection | Standard | Continuous Rotation |

    |---|---|---|n| Signal | Orange | White |

    | Power | Red | Red |

    | Ground | Brown or Black | Black |


    About the power connection – most servos used with Arduinos™tm prefer +6 volts.
    Further, standard size servos can draw considerably more current than can be delivered
    by an Arduino™. For these, a regulated source of & +6 volts could be provided.
    One way of doing this is shown in the retired Lesson 11 and is built into the
    Motor Controller Shield described in How-To #3.


    Small servos, as used on radio-control airplanes, and larger servos lightly loaded
    will work when connected to the Arduino’s +5 volts.


    # Step 2: Including the Servo libary


    Before an Arduino™ sketch can begin using Servo objects, the library must be included.
    Notice the word Servo is capitalized and the statement is not followed by a semicolon.


    ```

    #include Servo.h

    ```


    Notice that this statement must appear before any reference to the Servo library
    can be made. All statements in an Arduino™ sketch are usually placed near the
    top, just below introductory comments.


    # Step 3: Creating the Servo object


    Below the include statement before any methods, global variables are created.
    Global variables are those that may be accessed by any method. The following statement
    creates a Servo object and names it myServo.


    ```

    Servo myServo;

    ```


    # Step 4: Initialize the Servo object


    Initialization of an object is the act of telling it to perform any required startup
    actions. It also provides any required information. In the case of a Servo object,
    the number of pin to which the servo is connected is provided.


    This statement is usually found in the sketch’s setup() method. In this case,
    the sketch is telling the myServo object to initialize and that the servo to be
    controlled is connected to pin number 9 on the Arduino.'
