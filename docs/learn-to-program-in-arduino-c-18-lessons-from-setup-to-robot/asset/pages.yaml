  md: '# Goals:


    By the end of this lesson readers will:


    +   1. Understand that in order to perform predictably a robot must have some
    means of detecting and responding to its surroundings.


    +   2. Know how infrared-emitting diodes and infrared sensors can be used by an
    Arduino™ sketch to detect nearby objects.


    +   3. Know how to assemble a rolling robot powered by two DC motors and mount
    on that robot an Arduino, an Arduino™ motor controller shield, and a nine-volt
    power supply.


    +   4. Be able to program the robot to avoid obstacles and find its way out of
    a maze.


