  md: '# Lesson 11 Standard Servos and Helper Methods


    # The Big Idea:


    A servo is an electric motor whose rotation is controlled by an electrical signal
    called a pulse. Servos come in two types: the standard servo and the continuous
    rotation servo. The standard servo has a shaft that can be positioned at an angle,
    usually between 0 and 180 degrees. The angle depends on the duration of the pulse.
    Such servos are often used to position the angle of control surfaces of a model
    airplane or steer a model car.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_117_0.png)


    The other type, the continuous rotation servo, is not discussed in this lesson.


    This lesson shows how a servo, hereafter referred to as "servo," can be connected
    to and how to control by an Arduino. Along the way, the concept of helper methods
    is introduced.


    # Background:


    # Servo motors


    As described in Lesson 9, analogwrite() sets the output of the Arduino() pin to
    an average between 0 and 5 volts. It does this by rapidly switching the pin on
    and off. In the Arduino() C language, these two states are referred to as LOW
    and HIGH. The switch from LOW to HIGH and back to LOW is called a pulse.


    Once called, the analogwrite() command sends the pulse repeatedly. The ratio of
    the duration of HIGH to each pulse pulse, LOW, determines the output voltage.
    For example, if the pulse duration is three times the pulse LOW, the output voltage
    is 3/4ths of the maximum possible voltage. Usually the output voltage ranges from
    0 (pulse is never on) to +5 volts (pulse is never off). An average output voltage
    of +2.5. An Arduino() can be configured to provide voltage higher or lower than
    5 volts, but how to do this is the scope of this lesson.


    This lesson focuses on how the pulse is used to control the servo.


    A motor is similar to other motors in that it has a shaft that rotates, usually
    up to 180 degrees. How far it moves between 0 and 180 degrees depends on the pulse
    width. Table 11-1 shows the typical movement of the servo arm for 600 microseconds,
    1500 microseconds, and 2400 microseconds and the resulting rotation of the servo
    arm.


    Learn to Program in Arduino C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 117
- img_proc: true
