  md: '# How-To #5: Make Arduino™ Tones Louder


    The Arduino™ can generate what can be called a passable tone using the function
    tone(). This How-To shows how a few inexpensive parts can be used to make these
    tones dramatically louder than those heard when a speaker is connected directly
    to an Arduino™ output pin.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_244_0.png)


    # Background:


    The Arduino™ can make sounds, but they aren''t loud.


    Many Arduino™ tutorials, including those on our home aren are LearnCSE.com, have
    a lesson that uses the Arduino™ function tone() to generate a sound. Typically
    a speaker is connected to an Arduino pin, by either coupling a capacitor or a
    resistor.


    While this connection works well for teaching the use of the function, it has
    the disadvantage of producing a low-volume tone. Many of us, particularly when
    we want to add sound effects to something we''ve made that is powered by an Arduino,
    want a much louder sound.


    A linear audio amplifier can make them louder, but at the expense of several parts.


    An audio amplifier, such as the ubiquitous LM386, can be added but at the cost
    of the integrated circuit and all its supporting components, including up to four
    capacitors, a resistor, and some sort of potentiometer if volume control is desired.


    But an Arduino tone is a square wave with a 50% duty cycle repeated at the desired
    frequency. It''s not very musical, but it is simple. It doesn''t need to be "amplified."
    To sound louder all that''s needed is a way to increase current through the speaker.
    And this can be done by reducing the overall resistance of the speaker circuit.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_244_1.png)


    Figure HT5-1. Square wave'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'Figure HT5-2. Pictorial for FET


    To do all we need is to connect the speaker directly to a source of electrical
    current, switch this current on and off as the square wave goes to +5 volts and
    zero. The device that can do this is a Field Effect Transistor (FET). There are
    many types of FETs; we will use a 2N7000, which is an N-channel, Metal Oxide Semiconductor,
    Field Effect Transistor (MOSFET). As Figure HT5-2 shows, this device has three
    pins labeled (S), Gate (G), and Drain (D). The schematic symbol for this FET is
    shown in Figure HT5-3.


    Figure HT5-3. Schematic for FET


    The feature of the FET that will be advantage of is when the gate is positive
    relative to the source the resistance between the drain and source drops to nearly
    zero. This is the "switch". As the schematic Figure HT5-4 shows, the drain is
    connected to the Vin of the Arduino via the speaker. The source is connected to
    ground. And, finally, the gate, as the switch, is connected to the pin of the
    Arduino™ that is generating the square wave.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_245_0.png)


    Notice the connection to Vin rather than +5 volts. This allows greater current
    than be delivered via the Arduino™ itself.


    Figure HT5-4. Schematic for using FET to amplify square wave generated by Arduino™


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 245
- img_proc: true
