  md: '# About flow charting


    The chart in Figure 13-4 is an example of flow charting, a process commonly used
    by engineers to diagram processes. Figure 13-4 shows how the IR transmitter and
    sensor can be used together to detect an obstacle. It also serves to guide the
    writing of the C-language program to make this happen. Each shape has a specific
    meaning.


    # Table 13-3. Shapes used in flow charting in this lesson


    | Symbol | Name | Description |

    | --- | --- | --- |

    | | Start / End | Identifies the beginning of a process and the end. A process
    may have more than one end but not more than one beginning. In C, the beginning
    is the name of a method. |

    | | Process | A specific task. In C, this is a collection of programming statements
    that do one thing. An example is using a for loop to light and modulate an IRED.
    |

    | | Decision | Selects what is to happen next based on state of some variables.
    In C, this is usually represented by if and if-else. |


    # Program code


    Because the task of attempting to detect an obstacle is self-contained, it fits
    well into its own method. For illustration, suppose that method is named lookForReflection().
    The flow chart says either an obstacle is detected or it is not. This is a true
    or a false, where a returned value of true means yes, an obstacle reflected some
    infrared light.


    # Boolean data type


    C has a type called boolean. A boolean variable is one that can have a value only
    true or false. These are, in fact, words used to represent values. Example 13-1
    shows the declaration of a variable of type boolean and the setting of the value
    of true.


    # Example 13-1. Declaring variable type of boolean and value of true


    ```

    boolean gameOver; // declares variable of type boolean

    gameOver = true; // gameOver is now true

    ```


    The helper method lookForReflection() is to return true if an obstacle reflects
    infrared. Otherwise it is to return false. So, for this reason, the variable is
    written as having a return type of boolean.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_144_0.png)'
