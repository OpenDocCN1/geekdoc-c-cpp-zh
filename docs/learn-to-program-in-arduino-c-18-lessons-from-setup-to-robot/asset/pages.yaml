    Exercise 6-3. Show character values and hexadecimal

    The programming statement Serial.print can be forced to use a specific format
    for displaying a character. This is done by adding a comma and a formatting as
    follows:

    ```

    char myChar = ''A''; // character literals are

    //delimited by single quotes

    Serial.println(myChar); // prints the letter A

    Serial.println(myChar, DEC); // prints 65

    Serial.println(myChar, HEX); // prints 41

    Serial.println(myChar, BIN); // prints 1000001

    ```


    DEC, HEX, and BIN indicate a number base. DEC is decimal, which is in common use
    by people. Its base is 10, through 9.


    HEX is hexadecimal, the numbering scheme used by computer science to economically
    represent binary values. It has 16 symbols, 0 through 9 plus A, B, C, D, E, and
    F.


    BIN is binary, the number base used by computers.


