  md: '```

    // COMMON SETTINGS

    //

    // These settings are used in both SW UART, HW UART and SPI mode

    //

    #define BUFFERSIZE              128 // Size of the read buffer for incoming data

    #define VERBOSE_MODE            true // If set to ''true'' enables debug output

    #define BLE_READPACKET_TIMEOUT 500 // Timeout in ms waiting to read a response

    ```


    ```

    // UART SETTINGS

    //

    // The following macros declare the pins that will be used for ''SW'' serial.

    // You should use this option if you are connecting the UART Friend to an UNO

    //

    #define BLUEPRINT_SWUART_RX_PIN 9 // Required for software serial!

    #define BLUEPRINT_SWUART_TX_PIN 10 // Required for software serial!

    #define BLUEPRINT_UART_RX_PIN  11 // Required for software serial!

    #define BLUEPRINT_UART_TX_PIN  -1 // Optional, set to -1 if unused

    ```


    ```

    // HARDWARE UART SETTINGS

    //

    // The following macros declare the HW serial port you are using. Uncomment

    // this line if you are connecting the BLE to Leonardo/Micro or Flora

    //

    #ifndef Serial  // this makes it not conflict on compilation if there''s no Serial

    #define BLUEPRINT_HWSERIAL_NAME     Serial

    #endif

    ```


    ```

    // SHARED UART SETTINGS

    //

    // The following macros set the Optional Mode pin, it is recommended but not required

    //

    #define BLUEPRINT_UART_MODE_PIN 12 // Set to -1 if unused

    ```


    ```

    // SHARED SPI SETTINGS

    //

    // The following macros declare the pins to use for HW and SW SPI communication.

    // using SCK, MISO and MOSI should be connected to the HW SPI pins on the Uno
    when

    // using HW SPI. This should be used with nRF51822 based Bluetooth LE modules

    // using SPI (Bluetooth LE Friend).

    //

    #define BLUEPRINT_SPI_SCK      8

    #define BLUEPRINT_SPI_IRQ      7

    #define BLUEPRINT_SPI_RST      -1 // Optional but recommended, set to -1 if unused

    ```


    ```

    // SOFTWARE SPI SETTINGS

    //

    // The following macros declare the pins to use for SW SPI communication.

    // This should be used with nRF51822 based Bluetooth LE modules that use SPI

    // (Bluetooth LE Friend).

    //

    #define BLUEPRINT_SPI_SCK      13

    #define BLUEPRINT_SPI_MISO     12

    #define BLUEPRINT_SPI_MOSI     11

    ```


    16. Upload the sketch to the Arduino.


