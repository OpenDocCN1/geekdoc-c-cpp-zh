  md: '# How-To #7: Assemble an H-bridge Circuit Board


    Making a DC motor turn is relatively easy: simply connect the motor''s terminals
    to a power supply. But what if the motor is to be controlled by an Arduino, and
    what if that motor requires more current at a higher voltage than the Arduino™
    can deliver?


    For this we use the H-bridge, a device under the control of two digital pins that
    can turn a motor on and off and set its direction. Further, if one of these pins
    is capable of pulse-width modulation, the H-bridge can also control the speed
    of motor.


    In How-To we assemble an H-bridge that brings the ability to control two DC motors
    to the Motor Controller Shield of How-To #3, simply plugging it in.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_250_0.png)


    # Background:


    The DC motors this H-bridge can control are common, inexpensive, and extremely
    useful. They are "brushed" motors, meaning each is composed of a coil of wire
    inside a magnet. When electrical current is run through the wire to coil it opposes
    the field of the permanent magnet, causing the coil to move. How such motor works
    is described and illustrated on Wikipedia at https://en.wikipedia.org/wiki/Brushed_DC_motor#Simple_two_pole_DC_motor.


    An Arduino™ can directly control a motor, the motor requires about 5 volts and
    very little current. Most useful motors, however, are designed for higher voltages
    and currents. The motors used in the lessons in this book and the companion website
    (LearnCSE.com), for example, run best at six volts and draw between 0.15 and 0.4
    amps, depending on how much work they are attempting.


    An H-bridge connects a DC motor to an appropriate power supply but it does it
    in a way that a pair of Arduino™ digital pins can turn that power on and off,
    and set the polarity, thus setting the spin direction.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_251_0.png)


    The values of the Arduino™ pins turn the DC motor on or off and set the directions,
    as shown in Table HT7-1.


    | MC1 | MC2 | Motor |

    |---|---|---|

    | HIGH | HIGH | Stopped |

    | HIGH | LOW | Spins one direction |

    | LOW | HIGH | Spins reverse direction |

    | LOW | LOW | Stopped |


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
