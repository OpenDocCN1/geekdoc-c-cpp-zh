    #define pinPushButton 12\n\nvoid setup(){\n  pinMode(pinLED, OUTPUT);\n  pinMode(pinPushButton,\
    \ INPUT);\n}\n```\n\nNotice the use of the C-language keyword define. The statement\
    \ that begins #define creates a name for a value. That name, then, can be used\
    \ everywhere the programmer would otherwise have had to use an integer literal.\
    \ This makes programming easier that, should the programmer decide to use a different\
    \ pin for one of these, a change need to be in only one place in the sketch.\n\
    \nIn a sense, a name created this way is similar to a variable. But a defined\
    \ value has two important differences:\n\n+   - The value cannot be changed while\
