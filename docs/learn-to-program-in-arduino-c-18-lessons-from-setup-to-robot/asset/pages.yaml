  md: '# # Lesson 12 Infrared Sensors


    # ## The Big Idea:


    With the addition of a small electronic device called the infrared sensor, we
    can add to an Arduino™ the ability to detect infrared radiation. Infrared is simply
    light, although it is light outside the frequency range visible to humans. Future
    Lessons will use two ways: first, to detect objects and later, to detect and decode
    messages. This lesson is about detection. Detection of objects is one of the first
    exercises with the rolling robot of Lesson 15 and decoding messages of Lesson
    16.


    # ## Background:

    Previous lessons introduced the Serial Monitor, the push button, and the potentiometer
    as for bringing information into an Arduino™ sketch. This lesson introduces infrared,
    the first of two wireless technologies used in these lessons to connect the Arduino™
    to the surrounding world. The second technology, to be addressed, is radio.


    # ### Infrared


    Infrared (IR) is a particular frequency range of electromagnetic radiation, similar
    to that of visible light. IR, in fact, sits just before the red end of the visible
    light.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_132_0.png)


    Figure 12-1. Visible light spectrum


    Infrared is ubiquitous. It is present in sunshine and is generally associated
    with objects radiating heat, which is everything from a human body to freshly
    baked bread. And it is by the most commonly used technology for remote control
    of electronic devices, including home entertainment systems.


    This presents a problem. How is it that the television receiver can respond instantly
    to an infrared message from a remote control but is somehow able to ignore a warm
    chocolate chip cookie?'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'The answer is that infrared radiation as it is used in common remote controls
    and will be used in these lessons modulated. In other words, when it is on it
    is actually being turned on and off 38,000 times per second. The infrared receivers
    used in this lesson are specially designed to detect only infrared that is flashing
    on and off this frequency. The infrared from the cookie, which is not modulated,
    is ignored.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_133_0.png)


    Figure 12-2. Unmodulated vs. modulated infrared radiation


    This lesson deals only with detection of infrared energy being transmitted by
    an electronic device. But note that actual messages can be encoded into the transmitted
    infrared by changing the lengths of the pulses and the times between them. This
    is how a television remote is able to perform tasks. Encoding will be used in
    later lessons to remotely control a rolling robot and play a sort of musical instrument.


    The rate at which some signal is turned on and off is called the frequency. And
    on one pair is called a cycle. Frequency is the number of cycles per unit in time,
    in this cycles per second. The unit for cycles per second is the Hertz, named
    after Heinrich Hertz, a German physicist generally credited with proving the existence
    of electromagnetic waves. The abbreviation for Hertz is Hz. For convenience, frequency
    is usually referred to in thousands of cycles per second, for which the abbreviation
    is kHz.


    | Term | Description |

    | --- | --- |

    | cycle | A single pulse followed by a period of no pulse just before another
    pulse |

    | frequency | The number of times the pulse is turned on and off per second. Infrared
    used for control of electronic devices is typically modulated at a frequency of
    38,000 cycles per second. |

    | Hertz | The unit of measure for frequency. One Hertz is equal to one cycle per
    second. The abbreviation is Hz. |


