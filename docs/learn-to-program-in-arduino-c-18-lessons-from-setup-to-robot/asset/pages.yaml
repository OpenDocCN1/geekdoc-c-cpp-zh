  md: '# How-To #10: Add Bluetooth LE Control to Rolling Robot


    The robot built in Lesson 15 and operated with an infrared remote control in Lesson
    18 can be upgraded with a smartphone running either Apple''s iOS or Google''s
    Android operating systems. This upgrade takes advantage of Bluetooth Low Energy
    (Bluetooth LE), a 2010 addition to the Bluetooth standard. More can be learned
    about Bluetooth, including technical specifications, at https://www.bluetooth.com.


    Adding Bluetooth LE to the robot comes with several advantages over infrared control.
    Among these are:


    +   Much crisper responsiveness of robots because of reduced signal interference,
    even when dozens of robots are being operated simultaneously.


    +   Ability to take advantage of smartphone sensors, including the accelerometer.
    For example, a robot or devices on it may be controlled by simply tilting the
    phone.


    +   Robots respond to button "pushes" in a more natural way. The robot moves while
    the button is being held and stops instantly when the button is released.


    +   A path is open for student-writer iOS and Android applications.


    # About Bluetooth LE Devices


    This How-To describes how to use of the two Bluetooth LE devices made by the Adafruit
    company and available for purchase from them and from our LearnCSE.com store.
    The devices are:


    Bluefruit LE SPI Friend communicates with the robot''s Arduino™ via hardware Peripheral
    Interface.


    Bluefruit UART Friend communicates with the robot''s Arduino™ via a software serial
    port.


    The devices sell for the same price and, for our purposes, provide the same service—receipt
    of text data from the smartphone that is used to control the robot. There are,
    however, two important differences:


    +   The two devices are wired differently.


    +   A few lines of program code need to be added to manage communications. These
    lines are different for each of the devices.


    Once wired and configured for the proper communication protocol, the devices are
    identical in how they are accessed and how their data is used.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 273
- img_proc: true
