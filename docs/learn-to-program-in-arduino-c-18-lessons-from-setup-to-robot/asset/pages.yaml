  md: "# How-To #9: Make a Printed Circuit Board\n\nBackground:\nFabricricating a\
    \ circuit board is a four-step process.\n\n+   1. Exposure: Use light and a mask\
    \ to set the image of the desired traces on the circuit board.\n\n+   2. Develop:\
    \ Chemically remove the light-sensitive coating of the circuit board, except for\
    \ the image of the traces.\n\n+   3. Etch: Chemically remove copper from the board\
    \ everywhere except in the image of the traces.\n\n+   4. Drill: Use a drill press\
    \ to make holes for mounting and soldering components.\n\nMany methods exist to\
    \ create a circuit board from a trace pattern. The methods shown in this How-To\
    \ were developed at a large public high school, where they have been used for\
    \ several years. Other methods may be faster or more precise, but the methods\
    \ have proven to be reliable and reasonably safe.\n\nMaterials:\n\n| Tool | Image\
    \ | Notes |\n|---|---|---|n| Photo exposure lamp | | Light is from an appliance\
    \ fluorescent bulb, very bright. |\n| Developer | | Used to develop image after\
    \ exposure. \n> Caution: The developer contains sodium hydroxide.\n> Dilute 10:1\
    \ (10 parts water to 1 part developer) before using. |\n| Ferric chloride | |\
    \ Used to etch all exposed copper from the developed circuit board. |\n\nLearn\
    \ to Program in Arduino™ C: 18 Lessons, from setup() to robots"
  merge: -1
  pgno: 267
- img_proc: true
  md: '| Tool | Image | Notes |

    | --- | --- | --- |

    | 2 Trays |   | Need two small plastic photographic trays, one for developing
    and the other for etching. |

    | Electric tea kettle |   | Used to heat water for a hot bath to speed etching.
    |

    | Glass or plastic pan |   | Holds hot water for bathing the tray when etching
    the circuit board. |

    | Flat board and matching glass |   | Used to hold raw circuit board and mask
    during exposure. |

    | Sponge |   | Used to gently wipe the raw circuit board during development. |

    | Paper towels |   | Used to dry board after developing and again after etching.
    |


    # Procedure:


    Expose


    > Exposure is a photographic process. The copper foil on your raw circuit board
    is coated with a light-sensitive material. Do not peel the protective tape on
    the board until just making the exposure. After the exposure, protect the board
    from light until after it is developed.


    Make the photo exposure as follows:


    +   1. Make an "exposure carrier" using the flat 8" by 10" along with a matching
    sheet of glass. Make certain the glass is clean and dry.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '2. Make a "sandwich" of the carrier as follows and as shown in Figure HT10-1:


    +   a. The bottom layer is the carrier board.


    +   b. The next layer is the raw circuit board with the white tape removed, photosensitive
    side facing up. This is the side from which the tape was removed.


    +   c. The next layer up is the mask. Make certain the mask is placed in the center
    of the raw board and that the text is clearly readable, left to right.


    +   d. The top layer is the sheet of glass. It presses the mask close to the raw
    board, assuring a sharp image.


    Assembled "sandwich" as seen from top. Glass, mask, and raw board must be clean
    and dry. Any dust or scratch will appear on the finished board.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_269_0.png)


    Sandwich as seen from end.


    Figure HT10-1. Assembled "sandwich" as seen from top and from end


    > The mask must be positioned near the center of the raw board with the words
    clearly readable–not mirror imaged. The glass must be clean; it must also press
    the mask flat against the raw board.


    3. Place the sandwich under the exposure light. Leave it undisturbed for twelve
    minutes.


    > Do not touch the sandwich or the light during exposure. Even careful movement
    of the board can result in a blurred image on the raw circuit board.


    4. After exposure, disassemble the sandwich and protect the raw board from exposure
    to light until you are ready to develop the image.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Develop corrected image


    This step uses a chemical labeled "Developer" on the bottle. The active solution
    is sodium hydroxide. The sodium hydroxide dissolves the coating on the raw circuit
    board, but only where coating was exposed to the light. The result will be a green
    pattern on the board that looks exactly like the black pattern on the mask. Where
    the mask was clear, the board will now be bare copper.


    ![](img/c4fe45b0f14fd7a10c094df75f8e8a2c_270_0.png)


    +   1. In one of the trays, 20 ml of developer with 200 ml of water. This is more
    dilute than the instructions on the bottle produce, but it also slows the development
    process enough to make it easily managed.

    2. Submerge the exposed board in the developer in the tray. Use the sponge to
    gently brush the board until the trace pattern is clearly visible.

    3. Remove the board the moment no trace green is seen in the bare copper portions
    of the board.


    > An underdeveloped board will appear light green in the non-trace areas and will
    not etch properly. However, developing too long will result in the traces as well
    as the non-trace areas being erased. Developing must be stopped the moment light
    areas are clear of all trace of green.


    A properly developed board has crisp, green traces and tint. Copper in open areas
    is clear and shiny.


    +   4. Wrap the developed board in a paper towel to prevent scratching the green
    pattern before etching.

    5. The developer is good for several boards. It may be kept in a tightly closed
    plastic bottle. Either store the developer or pour it down the drain with plenty
    of water.

    6. Rinse and dry the developer and anything that came in contact with the developer.

    7. Rinse your gloves to remove all traces of the developer. Remove them and throw
    them away.


    # Etch


    This step uses an aqueous solution of ferric chloride, sometimes known as iron
    chloride. The ferric chloride will dissolve the exposed copper on the circuit
    board. The copper under the green trace pattern will remain on the board.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'During developing, ALWAYS wear lab safety goggles and gloves!


    Work in a well-ventilated space.


    Ferric chloride stains almost anything, permanently!


    +   1. Fill the electric kettle with water and heat it to a boil.

    2. While the water is heating the circuit board pattern side up in the second
    plastic tray.

    3. Pour enough ferric chloride in the plastic tray to cover the circuit board
    by about 1/8 inch.

    4. Pour the hot water from the tea kettle into the plastic tub.

    5. Float the tray containing the circuit board and ferric chloride on the hot
    water. The idea is to raise the temperature of the ferric chloride and, thus reduce
    the time required to etch the board.

    6. Gently rock the tray to "slosh" the ferric chloride over the circuit board.
    The entire etching process should take between 10 and 15 minutes.

    7. Occasionally pull the board out of the ferric chloride to assess progress.
    Stop when light can be seen through the circuit board everywhere except where
    the traces are.

    8. Wash the board and your gloves thoroughly in running water.

    9. Place the ferric chloride in a closable bottle for later use.


    NEVER POUR FERIC CHLOR DOWN A DRAIN! Damage to the plumbing is possible. Spent
    ferric chloride can be disposed of at a hazardous waste site. The solution now
    contains copper chloride, which is not healthy for the environment.


    +   10. Pour the water out of the tub. Rinse it and dry it thoroughly.

    11. Rinse your gloves one more time, remove them and throw them away.


    You are now ready to drill.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
  pgno: 271
