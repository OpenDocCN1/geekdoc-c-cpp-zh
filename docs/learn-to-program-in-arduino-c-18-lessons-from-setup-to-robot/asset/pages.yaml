  md: '# Lesson 5


    # The Big Idea:


    In algebra we all learned to deal with numbers in the abstract by using letters
    to represent numbers. The equation for a straight line, example, is y = mx + c.
    In this equation we know that y is a value that is found by evaluating the expression
    mx + c. But all the letters—y, m, x, and c—are names for placeholders of actual
    values. The equation expresses how they relate to each other.


    These names are called variables. Variables to store text (Strings) were first
    introduced in Lesson 2. The C language uses variables to store numbers. In this
    unit you will learn to work with variables and be aware of some of the subtle
    differences between how they are used in C and in algebra.


    # Background:


    Lesson 3 introduced variables, in particular variables of the type String. String
    variables are useful when the programming task is collecting, manipulating, and
    displaying text. Arduino™ sketches also need the ability to work with numbers.
    A sketch used to control a quad copter, for example, must sense the angle of the
    craft to the earth and use that information to adjust the speed of the motors.
    This cannot be done without mathematics, and mathematics requires numbers.


    In addition to the String for text, the C language provides several variable types
    to use with numbers, as shown in Table 5-1.


    Table 5-1. Variables used in lessons in this book


    | Type | Description | Examples |

    |---|---|---|

    | String | A collection of characters; a type of data | Hello, world! |

    | int | signed integer with no decimal point. Range is -32767 to 32767 | 5, 18,
    -2776, 0, 83, -21822 |

    | double | Precise number with a decimal, useful for most mathematic purposes
    | 98.6, 0.7, -236.99, 0.0, -5280.1 |

    | float | Number with a decimal, not as precise as a double but with a large range—from
    | 6.02E+23, 3.7E+8, 7.0, -89.2234E18 |


    The Arduino™ website reference for float numbers cautions that the lack of precision
    of float numbers may make for some strange behaviors when compared with other
    numbers.


    Learn to Program in Arduino™ C: 18 Lessons, from setup() to robots'
  merge: -1
