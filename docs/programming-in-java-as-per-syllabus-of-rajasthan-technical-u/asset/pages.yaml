    \ statement. Apart from simple classes, you can also create classes within classes.\
    \ Let's discuss about nested classes.\n\nJava allows you to create classes within\
    \ classes. A class declared inside another is called nested class. A nested class\
    \ has the following features:\n\n+   - The scope of the nested classes is within\
    \ the class where it is declared. In other words, if a class is declared within\
    \ the class Employee, the Address class is known to the Employee class only and\
    \ not outside the Employee.\n- A nested class can access members of the enclosing\
    \ class including its private members, whereas the enclosing class does not have\
    \ access to members of the enclosing class.\n- Static nested classes: A nested\
    \ class declared with the static keyword or within a context of enclosing class\
    \ is called static nested class. A static nested class cannot access the instance\
    \ variables of the enclosing class needs object of enclosing class to access its\
    \ member. Due to this limitation, the static nested class is not properly used.\n\
    - Non-static nested classes: A normal nested class declared without using the\
    \ static keyword is called non-static nested class. It is also called inner class.\
    \ The nonstatic nested class access the instance variables of the enclosing classes\
    \ directly, without instantiating it. Therefore, you can conclude that the non-static\
    \ nested class is fully within the scope of the enclosing class.\n\nListing 2\
    \ shows an example of nested class (you can find the NestedDemo.java file on the\
    \ CD in the CodeChapter folder):\n\n+   Listing 2: Creating a Nested Java Class\n\
    \n```\nclass Enclosing {\n    int outer_num=100;\n    void display() {\n     \
