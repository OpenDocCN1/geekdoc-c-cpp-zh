  md: '# 316 ► Chapter 9


    | Table 1: Explaining the Noteworthy Classes of the AWT Package |

    | Class | Description |

    | Component | Serves as an abstract superclass for various AWT components, such
    as buttons and check boxes. |

    | Container | Contains AWT components, such as buttons and check boxes. |

    | Panel | Creates a panel for a Windows application. |

    | Window | Provides the container where a Windows application can attach other
    components, including other panels. The Window class is a subclass of the Component
    class. |

    | Frame | Creates a frame for a Windows application. |


    Now, let''s describe these classes in greater detail in the following subsections.


    +   * **Exploring the Component Class**

    The Component is the base class of the java.awt package on which all the visual
    components are based. For example, the Button class is directly derived from the
    Component class. The Component class contains many methods that are used to create
    GUI-based applications. Table 2 lists the noteworthy methods available in the
    Component class.


    | Table 2: Discussing the Noteworthy Methods of the Component Class |

    | Method | Description |

    | getFont() | Returns the font of the text of a component. |

    | void setFont(Font ft) | Sets the specified font for the text of a component.
    |

    | Color getColor() | Returns the foreground color of a component. |

    | void setForeground(Color c) | Sets the foreground color of a component. |

    | Color getBackground(Color c) | Returns the background color of a component.
    |

    | void setBackground(Color c) | Sets the background color of a component. |

    | String getName() | Returns the name of a component. |

    | void setName(String name) | Sets a new name for a component. |

    | int getHeight() | Returns the height of a component in pixels as an integer
    value. |

    | int getWidth() | Returns the width of a component in pixels as an integer value.
    |

    | Dimension getSize() | Returns the size of a component. |

    | int getX() | Returns the current x coordinate of a component. |

    | int getY() | Returns the current y coordinate of a component. |

    | Point getLocation() | Returns the location of a component in the form of a point.
    |

    | void setLocation(int x, int y) | Sets a component at a new location according
    to the specified x and y coordinates. |

    | void setSize(int width, int height) | Sets a component size according to the
    specified width and height. |'
