  md: "```\nclass A\n{\n    //members of class A\n}\nclass B extends A\n{\n    //members\
    \ of class B\n}\n```\n\nIn the preceding code snippet, the derived B class inherits\
    \ class A by using the extends keyword.\n\nInheritance is an important feature\
    \ of OOP, which helps to improve the code structure and programming flexibility.\
    \ A key advantage of inheritance is that it allows code to be reused. This reusability\
    \ of code ensures that programs are written once and used many times with slight\
    \ modifications. This feature relieves a programmer from writing the same code\
    \ repeatedly, saving both time and effort.\n\nInheritance also helps in the refinement\
    \ of code, which allows you to improve an existing code by subclassing its subclass.\
    \ For example, in case of overriding, you can implement a method in a subclass\
    \ with the same name as in the superclass. However, the method definition is different\
    \ in the subclass.\n\nInheritance is analogous to the generalization and specialization\
    \ relation between classes. For example, the Car subclass is a generalization\
    \ of the Maruti subclass. Moreover, the Maruti subclass inherits those properties\
    \ of the Car superclass that are common to cars, such as four wheels, brakes and\
    \ an engine. Figure 20 shows the generalization and specialization relation between\
    \ the Car and Maruti classes:\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_120_0.png)\n\
    \n**Figure 20: Displaying Generalization and Specialization in a Class**\n\nFigure\
    \ 20 represents the generalization - specialization relation between the Car and\
    \ Maruti classes. In Figure 20, the upward arrow represents specialization and\
    \ the downward arrow represents generalization. Now, let's consider the various\
    \ forms of inheritance that are implemented in Java programming.\n\n# 4.6 Using\
    \ Forms of Inheritance\n\nInheritance is an extension of a previously declared\
    \ base class. In practice, a class can be inherited from more than one class.\
    \ Depending on the number and nature of a class, the inheritance is classified\
    \ into the following forms:\n\n+   - Single inheritance\n- Hierarchical inheritance\n\
    - Multilevel inheritance"
