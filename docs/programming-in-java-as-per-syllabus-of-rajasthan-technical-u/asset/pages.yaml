  md: "# Using if-else Statement\n\nThe if-else statement is used in situations where\
    \ we can provide an alternative course of action, in case the if clause returns\
    \ false. For example, if the conditional expression or if clause evaluates to\
    \ false, the statements coded in else clause gets executed.\n\nFollowing is the\
    \ general syntax for 'if-else':\n\n```\nif (conditional expression)\n    statement1\
    \ to be executed in case it's true;\nelse\n    statement2 to be executed in case\
    \ it's false;\n```\n\nIn the preceding syntax, the condition is written inside\
    \ the parenthesis ( ). According to the preceding syntax, the condition specified\
    \ after 'if' is true, Statement1 is executed; else, Statement2 is executed. List\
    \ 2 shows how to use if-else statement (you can find the IfElseDemo.java file\
    \ on the CD\\Chapter3 folder):\n\n+   Listing 2: Using if-else Statement\n\n```\n\
    class IfElseDemo {\n    public static void main(String[] args)\n    {\n      \
    \  int a = 10, b = 20;\n        if (a > b) {\n            System.out.println(\"\
    a > b\");\n        }\n        else {\n            System.out.println(\"b > a\"\
    );\n        }\n    }\n}\n```\n\nIn List 2, the 'if' statement is used to test\
    \ a condition that whether value stored in variable 'a' is greater than that of\
    \ 'b' set to 20, or not. Since the value stored in variable 'a' is set to 10 and\
    \ that of 'b' to 20, the condition automatically evaluates to false and the statement\
    \ immediately following the else construct gets executed, as shown in Figure 2:\n\
    \n![](img/d3faa73f55d3d314bb5bfb277886900d_70_0.png)\n\nIn Figure 2, the statement\
    \ inside the else block is executed as the condition in if statement is false.\
    \ In both the preceding examples, only one if is used, you can use multiple if\
    \ in your program also. Let's discuss this in the following section."
