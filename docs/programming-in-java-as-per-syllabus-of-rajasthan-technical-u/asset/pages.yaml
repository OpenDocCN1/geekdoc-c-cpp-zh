    \ of *continue* statement with the help of an example shown in Listing 13 (see\
    \ the *ContinueDemo.java* file on the CD in the *Code\\Chapter3* folder):\n\n\
    +   Listing 13: Using continue Statement\n\n```\nclass ContinueDemo{\n    public\
    \ static void main(String[] args)\n    for (int i=1;i<=20;i=i+2)\n{\n        if\
