  md: '# Working with Control Statements


    +   - if statement

    - if-else statement

    - multiple if-else statement

    - switch statement


    Q4. Explain the difference between the if statement and the if-else statement?


    Ans. The if statement is a conditional construct that helps in evaluating an expression
    for a boolean value. In case, the expressions return true, the statements following
    the conditional expression will be executed otherwise not. The if-else statement
    is used in situations where we can provide an alternative course of action, in
    case, if the clause returns false. For example, when the conditional clause evaluates
    to false, the statements coded in the if clause gets executed.


    Q5. What is the basic idea behind the iteration statements?


    Ans. Repeating the execution of same code fragment several times is called looping
    or iteration. The process of repeating a sequence of statements continues until
    a certain condition is met. When this condition is false, the iteration ends,
    and the loop is completed. There are numerous types of iteration statements, such
    as while, do-while, for, loop for, and for-each loop that are available in Java.
    In Java, the iteration statements are also known as loops.


    Q6. Explain the continue statement in brief?


    Ans. The continue statement is used to stop the current iteration of the loop
    and begin the execution of the next iteration of the loop. When continue used
    without a label, it starts a new iteration of the innermost loop, otherwise starts
    a new iteration of the named loop.


    Q7. List the different jump statements that are available in Java?


    Ans. Jump statements are those statements that transfer control from one part
    of the program to another. The jump statements supported by Java are as follows:


    +   - break

    - continue

    - return


    Q8. Why is there a need of the switch statement in a Java program?


    Ans. When there are several options for switch and we have to choose one option
    among them, on the basis of the selected option, a particular task is performed.
    Here, refer to one or more statements.


    Q9. Explain the nested loop in brief?


    Ans. A nested loop states that there is for loop within another for loop. In case
    of nested loop, the execution starts from the outer for loop and the control passes
    to the inner for loop. The inner for loop continue the execution till the condition
    evaluates to true. Once the inner loop gets completed, the flow of execution is
    passed to outer loop for the next iteration and executes till the evaluation returns
    true.'
