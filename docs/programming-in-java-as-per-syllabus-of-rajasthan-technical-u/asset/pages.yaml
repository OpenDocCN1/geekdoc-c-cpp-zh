  md: "In the preceding code snippet, notice that when the thread object is created,\
    \ the instance of the class that implements the Runnable interface is passed as\
    \ an argument to the constructor of the Thread class. This is because the run()\
    \ method is invoked only when you create a thread by extending the Thread class.\
    \ However, in the preceding snippet, you need to invoke the run() method explicitly.\
    \ The explicit invocation of the run() method is achieved by passing the object\
    \ as an argument of the class that implements the Runnable interface when the\
    \ object of the Thread class is created. The object passed as an argument is sometimes\
    \ called target or target Runnable.\n\nYou have learned how to define and instantiate\
    \ a thread. In the new state (the states of a thread are discussed later in this\
    \ chapter). After instantiating a thread, you need to invoke the start() method\
    \ to make it functional. The following code snippet shows how to invoke the start()\
    \ method using a thread object:\n\n# Starting Threads\n\nWhen a thread is instantiated,\
    \ it is in the new state (the states of a thread are discussed later in this chapter).\
    \ After instantiating a thread, you need to invoke the start() method to make\
    \ it functional. The following code snippet shows how to invoke the start() method\
    \ using a thread object:\n\n```\nthread.start(); //Thread named thrd started\n\
    ```\n\nIn the preceding code snippet, the start() method is invoked by the thrd\
    \ object. The following events take place when a thread object invokes the start()\
    \ method:\n\n+   - A new thread of execution starts with a new stack\n- The state\
    \ of the thread changes from new state to the runnable state\n- The run() method\
    \ is executed when the thread is of high priority.\n\nRemember that the start()\
    \ method is always invoked by the instance of the Thread class and not by the\
    \ objects of the class implementing the Runnable interface.\n\nListing 1 shows\
    \ an example of defining, instantiating, and starting a thread (you can find the\
    \ MyThread.java file in the Code/ChapterB folder):\n\nListing 1: Defining, Instantiating,\
    \ and Starting a Thread\n\n```\nclass SampleThread implements Runnable {\n   \
    \ public void run() {\n        {\n            for (int i=0;i<5;i++)\n        \
    \    {\n                System.out.println(\"Hello world\");\n            }\n\
    \        }\n    }\n\n    public class MyThread {\n        public static void main(String[]\
    \ args[]) {\n            {\n                SampleThread thrd=new SampleThread();\n\
    \            }\n        }\n}\n```"
