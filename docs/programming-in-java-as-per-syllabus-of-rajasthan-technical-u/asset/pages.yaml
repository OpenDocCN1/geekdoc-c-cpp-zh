  md: "# Chapter 8\n\nAfter discussing threads and the various ways of creating them,\
    \ let's learn how to instantiate thread that it can be used in a program.\n\n\
    # 8.2 Instantiating a Thread\n\nA thread is an object that executes as an instance\
    \ of the Thread class; therefore, to make a thread functional, you must instantiate\
    \ it, irrespective of the way it is created. You can instantiate a Thread class\
    \ by using constructors. The constructors of the Thread class that are used to\
    \ instantiate threads as follows:\n\n+   - Thread()(Default Constructor)\n- Thread(Runnable\
    \ trgt)\n- Thread(Runnable trgt, String threadname)\n- Thread(String threadname)\n\
    \nThe constructor to instantiate a thread varies depending on the way it is created.\
    \ When a thread is created by extending the Thread class, you can instantiate\
    \ the thread by using the following code snippet:\n\n```\nSampleThread thrd=new\
    \ SampleThread();\n```\n\nIn the preceding code snippet, the SampleClass is the\
    \ class that extends the Thread class and thrd is an instance of this class. Similar\
    \ to other objects in Java, the thrd object is instantiated using the new keyword.\n\
    \nIf, however, you want to create a thread by implementing the Runnable interface,\
    \ then you can instantiate the thread by performing the following steps:\n\n+\
    \   1. Create an object of the class that implements the Runnable interface\n\
    2. Get an instance of the Thread class and pass the object created in the first\
    \ step when instantiating the object of the Thread class\n\nThe following code\
    \ snippet shows the implementation of the preceding steps:\n\n```\nclass SampleThread\
    \ implements Runnable {\n    public void run() {\n        System.out.println(\"\
    the code to perform function by thrd\");\n    }\n    public class MyClass {\n\
    \        public static void main(String[] args) {\n            SampleThread thrd=new\
    \ SampleThread();\n            Thread T=new Thread(thrd);\n        }\n    }\n\
    }\n```\n\nIn the preceding code snippet, the first of the SampleClass is created,\
    \ and then the T instance of the Thread class is created, the thrd object is passed\
    \ to the Thread constructor as a parameter."
