    > ▲ Figure 36: Output of the MyOverride Class\n\nSome rules about overriding a\
    \ method:\n\n+   - You cannot override the final method.\n- You cannot override\
    \ a static method to make it non-static.\n- The overriding method and the overridden\
    \ method must have the same return type.\n- The number and types of parameters\
    \ in the overriding method must be the same as those in the overridden method\
    \ and the types must be in the same order. However, the names of the parameters\
    \ may vary.\n- During compilation, an error would generate if a public method\
    \ is overridden and declared protected.\n- When the overriding method declaration\
    \ includes throws clause, the overridden method must also include that clause.\n\
    - You cannot override a method that is not inherited.\n\nNow, let's discuss the\
    \ concept of method overloading."
