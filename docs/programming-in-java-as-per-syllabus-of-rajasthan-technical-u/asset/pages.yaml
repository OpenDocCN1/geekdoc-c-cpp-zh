    \ Method\n- Invoking the repaint(i) Method\n- Implementing Multithreading with\
    \ Applets\n- Passing Parameters to Applets\n- Let's discuss these in detail one\
    \ by one.\n\n# Using the HTML <APPLET> Tag\n\nThe <APPLET> tag loads a compiled\
    \ applet (class file of an applet) in the applet viewer or in Web browser. Beside\
    \ this, the <APPLET> tag is used to embed an applet in HTML page. The syntax is\
    \ given to use the <APPLET> tag:\n\n```\n<APPLET>\n  [CODEBASE = URL]\n  CODE\
    \ = filename\n  [ALT = alternateText]\n  [NAME = instanceName]\n  WIDTH = pixels\n\
    \  HEIGHT = pixels\n  [ALIGN = alignment]\n  [VSPACE = pixels]\n  [HSPACE = pixels]\n\
    \  > <PARAM NAME = name VALUE = value>\n  <PARAM NAME VALUE = value>\n</APPLET>\n\
    ```\n\nHere are the attributes of the <APPLET> tag:\n\n+   - CODEBASE: Specifies\
    \ the directory in which the applet code is found, including the extension .class\n\
    - ALT: Refers to the name of the applet text that should be displayed on Web browser,\
    \ if the applet is not displayed by any reason\n- NAME: Refers to the name of\
    \ the other applet displayed on the Web browser\n- WIDTH: Refers to the width\
    \ of the space reserved for the applet\n- HEIGHT: Refers to the height of the\
    \ space reserved for the applet\n- ALIGN: Specifies the alignment of the applet.\
    \ LEFT, RIGHT, TOP, BOTTOM, MIDDLE, BASELINE, TEXTTOP, AMSMIDDLE, ABSBOTTOM\n\
    - VSPACE: Allocates space vertically, above and below the applet\n- HSPACE: Allocates\
    \ space horizontally, to the right and left around the applet\n- PARAM NAME: Refers\
    \ to the name of a parameter to be passed to the applet\n- PARAM VALUE: Refers\
    \ to the value of a parameter"
