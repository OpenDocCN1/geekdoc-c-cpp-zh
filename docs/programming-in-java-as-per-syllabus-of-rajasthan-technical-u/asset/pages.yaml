  md: '# 02 Exploring the Basic Programming Elements


    # OBJECTIVES


    +   - Learn about the Primitive Data Types

    - Explore the Variables

    - Learn How to Use Operators in Java

    - Learn How to Use Arrays in Java


    Java introduces the basic programming elements, which helps the programmer to
    make the programming better and easier. These program elements are data types,
    variables, operators, and so on. Java is a strongly typed language, therefore
    it is important to understand the data types available in Java. To store data
    within a program, Java provides us containers or placeholders, which is known
    as variables. Apart from that, Java allows a programmer to perform certain arithmetic
    or logical operations on data and variables using different operators. Java also
    introduces the concept of arrays, which is a collection of data storage locations,
    each of which holds the same type of data.


    In this chapter, you learn about primitive data types. This chapter also helps
    you to explore variables in Java. You learn how to declare variables in Java.
    In addition the chapter also discusses how to use operators in Java. You learn
    different types of operators. Towards the end of the chapter, you learn how to
    use arrays in Java. Let''s start with the primitive data types.


    # 2.1 Primitive Data Types


    It is not possible to declare a variable without specifying its data type in Java
    program. Primitive data types can be divided into four broad categories:


    +   - Integer: Represents integers using byte, short, int, and long

    - Floating-point: Represents fractional numbers using float and double data types

    - Character: Represents char, which is used to store characters

    - Boolean: Represents logical values using boolean data type


    Let''s start with discussion Integer data types first.


    # Integer Data Types


    Integer data types are used to store integer data items. Java provides four integer
    data types to store the integer values — byte, short, int, and long. As Java only
    supports the signed integers, these integers have -ve and +ve values. Among all,
    byte is the smallest integer data type while long is the largest integer data
    type.'
