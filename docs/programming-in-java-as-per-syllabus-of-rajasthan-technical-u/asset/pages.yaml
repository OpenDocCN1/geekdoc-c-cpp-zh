    # The Float Data Type


    The float data type is used to represent the single-precision values, which use
    32 bits (4 byte) of the memory space. You are suggested to use float data type
    when you do not need to store a large degree of precision. A float data type can
    store maximum 7 digits after the decimal point. While declaring and using float
    data type, you must add the f suffix to the data. If you declare and initialize
    a float data type variable without the f suffix, it causes the compilation error.
    As all floating-point numbers are considered as double in Java. For example, consider
    the code snippet:


    ```

    float height=6.1;   //incorrect

    float height=6.1f; //correct

    ```


    In the preceding code snippet, the first declaration is incorrect as f postfix
    is not added at the end of data, therefore it is considered as double.


    # The Double Data Type


    The double data type is used to represent the double-precision values, which use
    64 bits (8 bytes) of the memory space. You are suggested to use double data type
    when you need to do iterative calculations, which results in a value of larger
    width. Although in Java, all the floating-point numbers are considered as double,
    you can use the d or D postfix with double data type. It does not make any difference
    whether you use the d or D postfix. For example, consider the following code snippet:


    ```

    double pi=3.14;

    double p=3.14;

    ```


