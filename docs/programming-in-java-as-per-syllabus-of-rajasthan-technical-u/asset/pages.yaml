    # Short Answer Questions


    +   Q1. Explain two types of errors which can occur in a program.


    Ans. There are two types of errors in Java: compile-time errors and run-time errors.
    Compile-time errors usually occur due to syntactic problems in a program; whereas,
    runtime errors occur due to certain conditions, such as memory failure and internal
    errors.


    +   Q2. What is the exception hierarchy?


    Ans. All the possible exceptions supported by Java are organized as subclasses
    under a hierarchy in Java. Therefore, the Throwable class is the root class of
    the exception hierarchy. The Throwable class is an immediate subclass of the Object
    class, which is located at the root of the exception hierarchy.


    +   Q3. How can you read from a file and write data to a file in Java?


    Ans. In Java, byte streams are used to handle the I/O operations on files. Java
    provides the java.io package that contains various classes, such as FileInputStream
    and OutputStream. Therefore, the java.io package must be imported in the Java
    program to perform I/O operations. All the classes of byte stream are derived
    from the InputStream and OutputStream classes; therefore, the InputStream and
    OutputStream classes are considered as the main classes of the byte stream.


    +   Q4. What are the main differences between byte streams and character streams?


    Ans. Byte streams are the classes that input and output of 8-bit bytes, whereas
    character streams are the classes that support input and output of 16-bit Unicode
    characters. The byte streams are provided by the java.io package. The InputStream
    class, the OutputStream class, and their subclasses are provided in the java.io
    package. On the other hand, the character streams are provided by the Reader class,
    Writer class, and their subclasses in package. The methods present in the character
    streams usually accept parameters of char data type whereas the methods in the
    byte streams usually accept parameters of the byte data type. Name of character
    streams ends with the suffix Reader or Writer, and name of byte streams ends with
    the suffix InputStream or OutputStream.


    +   Q5. Explain the need of the BufferedInputStream for input of bytes in a Java
    program.


    Ans. Buffering input is a well-known technique to enhance the performance of reading
    and writing bytes from and to the data source. The BufferedInputStream enables
    another input stream to buffer the input and support the mark and reset methods
    of the InputStream class. On creation of BufferedInputStream object, an internal
    buffer array is implicitly created. When the read() method is called multiple
    times on an input stream, the multiple read bytes from the input stream are provided
    to the internal buffer at a time. As many read bytes are provided to the internal
    buffer from the input stream at a time, this saves time and resources occupied
    by the input stream.'
