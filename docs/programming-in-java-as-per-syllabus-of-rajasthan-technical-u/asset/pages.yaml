    \ <interface clauses>\n{\n  //Interface body\n  <constant declarations>\n  <method\
    \ prototype declarations>\n}\n```\n\nThe rules for declaring an interface are\
    \ as follows:\n\n+   - There is no need to explicitly specify the public and abstract\
    \ keywords while declaring a method in an interface. In other words, all methods\
    \ of an interface are implicitly public and abstract.\n- An interface declares\
    \ only constants.\n- The variables declared in an interface must be implicitly\
    \ public, static, and final.\n- Interface methods must not be static, or native.\n\
    - An interface can extend one or more interfaces.\n- An interface cannot implement\
    \ another interface or class.\n\nAs stated, the definition of an interface includes\
    \ two components, the interface declaration component and the body component.\
    \ The interface declaration component contains various interface attributes, such\
    \ as the name of the interface or whether or not it extends an interface. The\
    \ body component consists of constants and method declarations in an interface.\
    \ The following code snippet shows an interface definition:\n\n```\npublic interface\
    \ Predator {\n  void catchPrey();\n  void eatPrey();\n}\n```\n\nIt is not essential\
    \ to specify the public and abstract keywords while declaring the methods in an\
    \ interface. therefore, methods are declared without using these keywords.\n\n\
