  md: "The following code snippet shows how to use the <APPLET> tag in a Web page:\n\
    \n```\n```html\n<html>\n<body>\n<APPLET>\n  CODE=HelloApplet.class\n  WIDTH=300\n\
    \  HEIGHT=200\n</APPLET>\n</body>\n</html>\n```\n```\n\nIn the preceding code\
    \ snippet, you are not specifying a code base, therefore, you place HelloApplet.class\
    \ in the same directory as HelloApplet.html. The output of HelloApplet.html file\
    \ in the Windows Internet Explorer is shown in Figure 15:\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_360_0.png)\n\
    \n▲ Figure 15: Displaying Applet in the Windows Internet Explorer\n\nIn Figure\
    \ 15, the text message (Hello from Java!) of the HelloApplet applet is shown in\
    \ a Web page.\n\n> If an applet does not work in Web browser that means the browser\
    \ does not support the current version of Java.\n\nLet's learn how to initialize\
    \ and terminate an applet in the next subsection.\n\n# Initializing and Terminating\
    \ an Applet\n\nInitialization and termination of an applet is controlled by a\
    \ set of methods. When an applet is loaded in the memory, it is initialized with\
    \ some resources, such as variables used in the init() method and when an applet\
