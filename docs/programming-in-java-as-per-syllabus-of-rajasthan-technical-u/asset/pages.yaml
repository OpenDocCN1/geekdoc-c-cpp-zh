  md: '# # Programming in Java


    This book introduces the Java programming language and demonstrates with code
    examples the of various Java concepts, such as control statements, packages, interfaces,
    and threads. Java is an object-oriented programming language that inherits its
    features from C++. The book covers all the features of Java 6.


    # Key features of the book


    +   - INTRODUCING JAVA: Introduces OOP principles, features of Java, bytecode,
    and JVM

    - EXPLORING THE BASIC PROGRAMMING ELEMENTS: Discusses primitive data types, variables,
    operators, and arrays

    - WORKING WITH CONTROL STATEMENTS: Demonstrates the implementation of selection
    statements, such as if...else; iteration statements, such as for; and jump statements,
    as break and continue.

    - WORKING WITH OBJECTS AND CLASSES: Helps you to learn how to declare classes,
    create objects, constructors, implement inheritance, use the super keyword, find
    the final keyword, override and overload methods, and declare abstract classes

    - IMPLEMENTING PACKAGES AND INTERFACES: Discusses access modifiers, packages in
    Java, setting the classpath,

    - STRING HANDLING: Helps in learning to work with string constructors, find the
    length of a string, perform special string operations, modify a string, search
    and compare strings, and use the StringBuffer

    - EXCEPTIONS AND IO OPERATIONS: Discusses exceptions, types of exceptions, exception
    handling, and Input/Output operations

    - IMPLEMENTING THREADS IN JAVA: Discusses threads in Java, how to start a thread,
    start and execute multiple threads, thread states and priorities, and thread synchronization
    mechanism

    - WORKING WITH GUI: Discusses Abstract Window Toolkit (TWT), AWT frames, applet
    and its class, the Graphics canvas, and the Color class


    # About the Authors


    **D. M. Chaudhary**, Professor of Computer Science and Engineering at Swami Keswani
    Institute of Technology, Management and Ganesham, Jaipur, has made contributions
    to the Computer research domain of Software Engineering and Design. His specialized
    area of Object Oriented Programming, UI Design Patterns and Software Development
    Methods. With teaching experience of more than a decade, he has published research
    papers in journals and conferences. He has immense recognition with industry leaders,
    such as IBM, TCS and Infosys in lite technologies and academic programs.


    **Mahender Kumar Binwal** has the M.Tech. degree in Computer Science. He is currently
    Reader (Department of Computer Science & Engineering) at Swami Keswani Institute
    of Technology, Management & Gamot, Ramnaggaria, Jagipur, Jaipur, Rajasthan, where
    he is involved in teaching graduate and postgraduate courses in Computer Science,
    Information Technology. His area of research includes OOP, Data Mining, and Compiler
    Design.


    **Pankaj Dadhesh** has the M.Tech. degree in Computer Science. He is currently
    Senior Lecturer & DY (Department of Computer Science & Engineering) at Swami Keswani
    Institute of Technology, Management & Gamot, Ramnaggaria, Jagipur, Jaipur, Rajasthan,
    where he is involved in teaching undergraduate and postgraduate courses in Computer
    Science, and Information Technology. His area of research includes OOP, Data Mining,
    and Compiler Design.


    The proficient teams at **Cogent Learning Solutions Inc.** and **Dreamtech Press**
    have seized the market of engineering textbooks, bringing excellent content in
    engineering and technical education to the fore. The teams at Cogent Learning
    Solutions, Inc., and Dreamtech Press are committed to providing excellence in
    quality of content by judiciously analyzing the needs of readers and ensuring
    dedication of their authors and editors in meeting these needs.


