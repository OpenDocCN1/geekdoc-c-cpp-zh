  md: '# Chapter 8


    # 8.5 Exploring the Thread States


    When an instance of the Thread class is created, you need to invoke methods to
    make the thread functional. In other words, when you created a thread, it is only
    an instance of the Thread class inside an instance of an independently executed
    thread. The start() method of the Thread class is invoked by a Thread object to
    make the thread eligible for execution. After invoking the start() method, the
    thread moves to its runnable state.


    However, to work with threads in a program, you need to identify the thread state.
    Let''s discuss how to identify the thread state, in the following subsection.


    +   - Thread States

    Threads are scheduled for execution by the thread scheduler, which is a part of
    JVM. Threads are stored in a runnable pool and the scheduler selects the threads
    that are ready for execution. The runnable pool is a collection of threads that
    are in the runnable state (ready for execution). The thread selected by the scheduler
    starts executing and terminates so as the execution of the run() method is complete.

    You need to identify the thread state to work with threads in a program. Let''s
    discuss the thread states in detail.


    # The New State


    A thread is known to be in the new state when it has been instantiated but the
    start() method has not been invoked by it yet. In other words, the Thread object
    exists but cannot execute any instruction as it is not yet alive.


    # The Runnable State


    Threads on which the start() method has been invoked and which are ready to run
    but the thread scheduler has not yet selected them for execution are said to be
    in the runnable state. Threads in the runnable state are stored inside the runnable
    pool where the scheduler selects them for execution. Runnable threads are also
    called live threads. A thread attains the runnable state when the start() method
    is called for the first time.


    # The Running State


    When a thread is selected by the thread scheduler from the runnable pool for execution,
    the thread achieves the running state where it performs its actual functions.
    A thread can achieve the runnable state from the running or new states. However,
    a thread can return to the running state only from the runnable state. Figure
    4 shows the ways in which a thread can move from one state to another:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_293_0.png)


    > Figure 4: showing the States of Threads


    Let''s now learn about the waiting/blocking/sleeping state.'
