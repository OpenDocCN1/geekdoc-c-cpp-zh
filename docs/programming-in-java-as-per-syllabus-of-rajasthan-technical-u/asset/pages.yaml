    or Writer. Application written with the help of character streams, in place of
    bytes streams, is implicitly ready for internationalization.


    Q7. What is the need of BufferedOutputStream class of bytes in a Java


    Ans. BufferedOutputStream allows another output to buffer the bytes to be written.
    On creation of a BufferedOutputStream object, an internal buffer is automatically
    created. When the write() method is called multiple times on an output stream,
    the bytes that are to be written to output stream are provided to the internal
    buffer at a time. As many bytes, which are to be written, are provided to the
    internal buffer from the output stream, this saves time and resources occupied
    by the output stream.


    Q8. What are the main difference between the ObjectInputStream and the ObjectOutputStream
    class?


    Ans. The ObjectOutputStream saves the state of an object, which is to be serialized,
    to the output stream, while the ObjectInputStream class retrieves the state of
    a saved object from the input stream. The write() method of the ObjectOutputStream
    saves the state of the object to the output stream. On the other hand, the readObject()
    method of the ObjectInputStream object retrieves the state of the stored object
    from the input stream.


    Q9. Explain the built-in exception in brief?


    Ans. Built-in exceptions are those exceptions that are already available in Java.
    These exceptions are thrown by the Java runtime system. Built-in exceptions are
    categorized into the following types:


    +   - Checked Exceptions: The checked exceptions are those classes that are extended
    from the Exception class excluding the RuntimeException class. The compiler can
    detect the checked exceptions during compilation-time itself. A few examples of
    checked exceptions are ClassNotFoundException, ClassNotSupportedException, and
    IllegalAccessException.


    +   - Unchecked Exceptions: The Unchecked exceptions are those classes that are
    extended from the RuntimeException class. The compiler is not able to detect the
    unchecked exceptions during compilation. A few examples of these are ArrayIndexOutOfBoundsException,
    ArithmeticException, and NullPointerException:


