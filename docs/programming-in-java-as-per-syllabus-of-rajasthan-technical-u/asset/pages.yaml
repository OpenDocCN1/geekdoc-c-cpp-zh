  md: '# Exceptions Handling and I/O Operations


    support input and output of 16-bit Unicode characters. Unicode is a character
    encoding that assigns a unique number to each character, and each uniquely identifies
    an object, which can be used on different platforms. Byte streams and character
    streams are provided by the classes present in java.io package. Byte streams are
    provided by the InputStream class, OutputStream class, and their subclasses in
    the java.io package. On the other hand, character streams are provided by the
    Reader class and Writer class, and their subclasses present in the java.io package.
    Character streams usually accept parameters of character type, and the methods
    in the character streams usually accept parameters of byte type. The name of the
    character ends with the suffix Reader or Writer, and the name of the byte streams
    ends with the suffix InputStream or OutputStream. A good example to make clear
    is when you use the character stream to read data from a file, you will use the
    java.io.FileReader class, and when you use the byte stream to read data from a
    file, you will use the java.io.FileInputStream class. Let''s first discuss the
    java.io package.


    +   Exploring the java.io Package

    Java IO Framework provides a simple and standardized API for reading and writing
    data that is in the form of characters or bytes, from various data sources. It
    contains a collection of the Reader and Writer classes, such as BufferedReader,
    BufferedWriter, and PrintWriter, which provide useful abstractions and better
    I/O performance. These classes are wrapper classes of the InputStream and OutputStream
    classes. Input streams are streams that receive or read data; output streams are
    streams that send or write data. All streams are represented by classes in the
    java.io (input/output) package. For example, the ObjectInputStream class provides
    methods that allow you to read data from a stream as a Java object, and the ObjectOutputStream
    class provides methods that allow you to write data to a stream as a Java object.


    Note that java.io is a subpackage of java.lang package. The Reader and Writer
    classes are derived from the Object class. Figure 14 shows the class hierarchy
    of the Object class:


