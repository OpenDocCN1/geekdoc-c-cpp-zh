  md: '# Using One-Dimensional Array


    A one-dimensional array is a set of the same data type variables. The dimension
    of an array represents the number of indexes associated with it. To represent
    elements in one dimensional array, single index value is used. In this section,
    we discuss the following broad-level steps to use a one-dimensional array:


    +   - Declaring a One-Dimensional Array

    - Creating an One-Dimensional Array

    - Initializing an One-Dimensional Array

    - Developing a Program Using One-Dimensional Array


    Now, let''s discuss these steps in the following section.


    # Declaring a One-Dimensional Array


    The first step to start working with an array is to declare an array. In Java,
    an array is declared in the same way as a data variable is declared. The syntax
    to declare a one-dimensional array is:


    ```

    data_type var_name = [];

    ```


    In the preceding syntax:


    +   - data_type is the type of an array, which specifies the type of elements
    that will be stored in an array.

    - var_name is the name of the array.

    Another syntax to declare a one-dimensional array is:


    ```

    data_type [] var_name;

    ```


    See the following examples in which arrays named roll_no and tele_no of data type
    int are declared:


    ```

    int roll_no[] [];

    int tele_no;

    ```


    Both arrays given in examples are declared correctly according to the Java syntaxes.
    Declaring an array does not create an array. To create an array, memory must be
    allocated to it. Until memory is not allocated to an array, the null value is
    assigned to the declared array.


    # Creating a One-Dimensional Array


    Once you have declared a one-dimensional array, the next step is to actually create
    array by allocating memory to it. The new operator is used to allocate memory
    to an array. The syntax to create an array is as follows:


    ```

    var_name = new data_type [size];

    ```


    In the preceding syntax:


    +   - var_name is the name of the array declared in the preceding section

    - new is the operator, which is used to allocate memory to var_name.'
