  md: '# Short Answer Questions


    Q1. What is an Applet? Should applets have any constructor?

    Ans. An applet is a program written in a Java programming language that can be
    included in an HTML Web page, in the same way an image is included in a Web page.
    It can be used in both static and dynamic Web pages to either display or share
    information through the Web application.

    In applets, there is no constructor. It can be invoked through either browser
    or appletviewer provided by JDK.


    Q2. What are the Applet''s Life Cycle methods? Explain them.

    Ans. A Web browser manages the life of an applet, by calling certain methods.
    The Applet class executes these methods automatically in a proper sequence as
    the life cycle methods of an applet. The following are the methods in the life
    cycle of an Applet.


    +   - init() method: This is the first method to be called. The public void init()
    is executed only once, when an applet is loaded for the first time.

    - start() method: This is executed after the execution of the init() method. The
    public void start() is invoked to start the applet. This is the heart of the applet.
    This method executes every time an HTML page containing applets is displayed on
    the screen. For a user minimizes a Web page, the execution of the public start()
    method is stopped, whereas maximizing the Web page resumes the execution of this
    method.

    - stop() method: This method stops an applet from executing.

    - destroy() method: This method removes an applet from the memory of the applet
    container manages these methods.


    It is not necessary to use these methods while creating an applet, the applet
    container manages these methods.


    Q3. In which sequence, an applet calls methods involved in applet''s life cycle?

    Ans. When an applet is started, the AWT calls the following methods in sequence:


    +   1. init()

    2. start()

    When an applet is terminated, the following sequence of method is called:

    1. stop()

    2. destroy()


    Q4. What are the differences between an applet and applications?

    Ans. An applet and an application have many difference. An application is used
    to design stand alone application where an applet is used to design Web application.
    Some of the common differences between applications and applets are:


    +   - An applet has an HTML document but there is no HTML document in an application.

    - An application has a special static method called main() which serves as the
    execution entry point of an application. An applet does not have a main() method.'
