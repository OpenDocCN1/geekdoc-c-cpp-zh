  md: '# Chapter 4


    # 4.5 Understanding Inheritance in Java


    Inheritance facilitates the creation of a subclass from a superclass by inheriting
    the properties of the superclass. The relationship between a subclass and superclass
    forms a hierarchy, which can be graphically represented. Figure 18 shows a good
    example of the inheritance relationship between the Animal, Mammal, Cat, and TabbyCat
    classes, which forms an inheritance hierarchy:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_119_0.png)


    ▲ Figure 18: Representing the Inheritance Hierarchy


    In Figure 18, the inheritance hierarchy of the TabbyCat class is represented as
    deriving from the Cat class. Moreover, the Mammal class is the superclass of the
    Cat and the subclass of the Animal class.


    In Java, inheritance is implemented by extending a class and adding fields and
    methods in its subclass. Let''s consider two classes, class A and class B, where
    class B is formed by extending class A. In this case, class B is called a subclass
    and class A is called a superclass. Generally, the subclass inherits the structure
    and behavior of the superclass, but the subclass can also add its own members.
    Figure 19 shows the relation between a subclass and a superclass.


    | Class B | Class A |

    |--- |--- |

    | //fields | //fields |

    | //methods | //methods |

    | | Derived from |


    ▲ Figure 19: Showing Class B that is Derived from Class A


    Figure 19 represents the relation between a subclass and a superclass. The arrow
    towards class A denotes that class B is derived from class A.


    Programmatically, a derived class is created by using the extends keyword. The
    following code snippet shows how to declare the base class A and the derived class
    B:'
