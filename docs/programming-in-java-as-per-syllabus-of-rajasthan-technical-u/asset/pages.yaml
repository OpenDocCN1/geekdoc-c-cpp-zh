  md: 'Q2. List the important uses of threads.


    Ans. The important uses of threads are as follows:


    +   - Threads are used in server-side Java programs to serve the needs of multiple
    clients on the network or the Internet. On the Internet, the server has to cater
    to needs of thousands of clients at time. Threads are used to handle multiple
    clients simultaneously.


    +   - Threads are used to create games and animations. For example, you can use
    threads to show a picture in motion. In such a case, you have to set a thread
    that sleeps and is activated for specific periods of time, and the cycle is continued
    in this way. Threads can be used in this way to create animations.


    +   - In many games, a user generally has to perform more than one task simultaneously.
    Threads are very useful in such situations:


    Q3. Define the thread briefly.


    Ans. During the execution of a program, JVM creates a thread automatically to
    execute the main() method, which is called the main thread. If any other thread
    is not created in the program, it terminates when the main() method finishes its
    execution.


    Q4. How are threads created?


    Ans. The two ways are used to create threads in a Java program:


    +   - By extending the Java.Thread class


    +   - By implementing the Java.Runnable class


    Q5. What is a thread scheduler?


    Ans. The component of JVM decides the order in which threads are executed is a
    thread scheduler. Even though you have multiple threads in a program, the system
    that has a single processor executes only a single thread at a particular point
    of time. This means that even if there are active threads, the resources are allocated
    only to the thread that is executing. The scheduler selects a thread for execution
    from the runnable pool and sends back the execution depending on the priority
    of the threads and the code inside the run() method of the thread.


    Q6. List the important points that you must remember when creating threads by
    extending the Java.Thread class are as follows:


    Ans. The important points to keep in mind while creating threads by extending
    the Java.Thread class are as follows:


    +   - The class that extends the Thread class overrides the run() method where
    the code executed by the thread is defined.


    +   - The constructor of the Thread class may be explicitly called in the constructor
    of the class extending it by using the super keyword to initialize the thread.


    +   - The class extending the Thread class invokes the start() method, which is
    inherited from the Thread class to make the thread eligible for running.'
