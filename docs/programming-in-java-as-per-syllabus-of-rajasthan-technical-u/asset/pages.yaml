  md: '# 9.5 Creating Applets


    For creating an applet, make sure that Java is installed on your system. It is
    also necessary to ensure that either Java interpreter or enabled Web browser is
    available on your system to run an applet. All applets are subclass of the Applet
    class, which is available in the java.applet package. Therefore to create an applet,
    you must import the java.awt package and extend the Applet class. In addition,
    the java.awt package, as it is required to provide a interface to an applet, and
    the applet can have controls as buttons, checkboxes, and forms.


    The applets are based on the java.applet.Applet class, which is itself a subclass
    of the java.awt.Container class as shown in following hierarchy:


