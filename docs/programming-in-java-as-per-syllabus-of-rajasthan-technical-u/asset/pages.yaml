    \ constructor will also have the name Demo. Constructors are syntactically similar\
    \ to methods and used to initialize the objects. Constructors initialize as soon\
    \ as the object is created. Following are few important points that must be remembered\
    \ while working with constructors:\n\n+   The name of the constructor should be\
    \ same as that of a class.\n\n+   A constructor does not have any return type—not\
    \ even void—because implicitly, the return type of a constructor is a class itself.\n\
    \nQ2. Why does not support multiple inheritance?\n\nJava does not support multiple\
    \ inheritance to eliminate code complexity and confusion. Instead, it provides\
    \ an interface that permits multiple implementations. Implementing multiple interface\
    \ implementations, a class can implement more than one interface at a time. The\
    \ class that provides the implementation of the interface also implements the\
    \ methods of the interfaces inherited by that interface.\n\nQ3. What are the differences\
    \ between overriding and overloading?\n\nAns. Method overriding is the declaration\
    \ of a superclass with the same signature (name and parameters) in a subclass.\
    \ Only the non-final methods of a superclass are overridden in a subclass. Method\
    \ overloading occurs when a method name is the same but the parameters are different.\
