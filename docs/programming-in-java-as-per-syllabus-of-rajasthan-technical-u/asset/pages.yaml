  md: '# 07 Exceptions Handling and

    /O Operations


    # OBJECTIVES


    +   - Learn about the Exceptions

    - Explore the types of Exceptions

    - Learn how to handle the Exceptions

    - Learn how to handle the Input/Output operations


    Exceptions are certain abnormal conditions or errors that occur at runtime and
    can cause an abrupt termination of a program. A program should have the capability
    to handle exceptions in an effective manner, so that the problem of sudden termination
    becomes that exception can be resolved. Consider that we have a Java program for
    performing division operations. Now, if we make an attempt to divide a number
    by zero, it would generate an Arithmetic Exception (a built-in exception in Java).
    Java offers several mechanisms for handling exceptions. In addition to, it also
    offers Input/Output (I/O) framework to read and write data that is in the form
    of characters or bytes, from multiple data sources. The I/O framework of the java.io
    package contains various classes, such as PrintWriter, InputStream, and OutputStream.
    These are wrapper classes of the InputStream and OutputStream classes. Input streams
    are streams that receive or read data; whereas, output streams are streams that
    write data. The java.io package represents all streams.


    The chapter discusses how to handle exceptions in Java with the help of try and
    catch block. Moreover, the exception hierarchy and the concept of nested try and
    catch are also discussed. From exception handling, the concept of handling i/o
    operations is also discussed with the help of the classes within the java.io package.
    Let''s start first with the basic fundamentals of exception handling.



    # 7.1 Introducing Exception Handling


    When your Java program is compiled successfully, you may feel that it executes
    successfully as well. However, you can expect program interruptions due to various
    uncertainties arising from the programmer''s ignorance. A mechanism of handling
    such uncertainties in a Java program is known as exception handling. In a Java
    program, you can handle such uncertainties by using try and catch block.'
