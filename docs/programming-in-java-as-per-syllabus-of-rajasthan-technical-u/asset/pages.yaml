    Now, let''s discuss about the operator precedence in the next section.


    # Operator Precedence


    In Java, each operator has an associated precedence which helps in determining
    how an expression is evaluated if more than one operator is used. On the basis
    of operator precedence, the evaluation of an operator depends. In other words,
    the operators at the higher level of precedence are evaluated first and operators
    of same precedence are evaluated from left to right or vice versa. A property
    of an operator is known as associativity. Table 12 describes the operator precedence
    and its associativity:


    | Table 12: Operator Precedence and its Associativity |

    | Order | Operator | Associativity |

    | --- | --- | --- |

    | 1 | () [] ++ (Post-increment) | Left to Right |

    | 2 | -- (Unary Minus) ++ (pre-decrement) ! ~ | Right to Left |

    | 3 | * / % | Left to Right |

    | 4 | + (Subtraction) | Left to Right |

    | 5 | << >>> | Left to Right |

    | 6 | < <= > = | Left to Right |'
