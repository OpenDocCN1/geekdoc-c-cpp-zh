    # The Calendar Class


    The Calendar class is an important class of the java.util package. This class
    offers certain methods that are helpful in converting a particular instant into
    a group of calendar fields. It also provides methods to allow you to manipulate
    the calendar fields, such as month, day, and hour. The Calendar uses two modes,
    lenient and non-lenient to interpret different fields. In the lenient mode, calendar
    accepts a large number of calendar field values, in fact more than it actually
    generates. In the non-lenient mode, a calendar immediately throws an exception
    if inconsistent calendar fields are found.


