    \ overriding in the next section.\n\n# 4.9 Overloading and Overriding Methods\n\
    \nThe technique of re-implementing or rewriting a method of a class in its subclass\
    \ is\nknown as overriding, and overloading is the process of using the same method\
    \ name to\nimplement different functionalities in it. In order to understand this\
    \ concept, you need\nto focus on how an overloaded or overridden method is declared.\
    \ You must also know about the\nloaded constructors and the superclass version\
    \ of the overridden method.\nWe begin by discussing the concepts of overriding\
    \ and overloading.\n\n+   - Method Overriding\n\nA subclass inherits all the non-private\
    \ class members of a class. In a class hierarchy, a\nsubclass method is invoked\
    \ from a subclass reference variable, it is the overridden\noverridden version\
    \ of that method that is invoked. The concept of overriding methods can be clarified\n\
    with the help of an example. In this example, we declare the X and Y classes,\
    \ which\noverride the display() method. Listing 35 declares the superclass X and\
    \ the subclass Y\n(you can find the MyOverride.java file in the CD/CodeChapter4\
    \ folder):\n\nListing 35: The MyOverrideClass\n\n```\n// Method Overriding\npackage\
    \ com.kogent;\nclass X {\n\tint num1, num2;\n\nX(int a, int b) {\n\t\tnum1 = a;\n\
    \t\tnum2 = b;\n\t}\n\n//display the values of num1 and num2\n\tpublic void display()\
    \ {\n\t\tSystem.out.println(\"Num1 \" + num1 + \" \" \" + num2\");\n}\n//declaring\
    \ the subclass\n```"
