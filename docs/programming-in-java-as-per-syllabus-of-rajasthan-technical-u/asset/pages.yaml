    \nThis operator >> shifts the bits to the right by a specified number of positions.\
    \ The number of positions upto which the shifting should occur depends on the\
    \ value given after the operator. When shifting right >>, the lost bits are filled\
    \ in previous leftmost bits.\nTo understand right shift operator more clearly,\
    \ let's see the example:\n\nConsider 78 whose binary equivalent is:\n\n```\n00000000\
    \ 00000000 00000000 01001110\n```\n\nBy shifting it >> 2 times, the output we\
    \ get:\n\n```\n00000000 00000000 00000000 00100111 ( = 19 )\n```\n\n# The Left\
    \ Shift Operator\n\nThis operator shifts the bits to the left by a specified number\
    \ of positions. When you shift <<, the void left behind by the shift is filled\
