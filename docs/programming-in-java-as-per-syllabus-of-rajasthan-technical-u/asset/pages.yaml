  md: '# Initializing a Multi-Dimensional Array


    The process to initialize a multi-dimensional array is similar to initializing
    a one-dimensional array. The syntax to initialize a multi-dimensional array is
    as follows:


    ```

    var_name [ row_no ] [ col_no ] = col_val;

    ```


    In the preceding syntax:


    +   - var_name is the array name.

    - row_no is the row number in multi-dimensional array

    - col-val is the value that will be stored at the specified column number of the
    specified row.


    See the following example to initialize a multi-dimensional array:


    ```

    even_no[0][0] = 2;

    even_no[0][1] = 4;

    even_no[0][2] = 6;

    even_no[1][0] = 10;

    even_no[1][1] = 12;

    even_no[1][2] = 14;

    even_no[2][0] = 16;

    even_no[2][2] = 18;

    ```


    You can initialize a multi-dimensional array at the time of declaration. You do
    not need to use the new keyword to assign memory to elements. You also do not
    need to specify the size of an array. Syntax to initialize an array at the time
    of declaration is as follows:


    ```

    data_type var_name [ ] = {{row0_col0, row0_col1, row0_coln}, {row1_col0, row1_coln}};

    ```


    In the preceding syntax:


    +   - data_type is the data type of a multi-dimensional array, which specifies
    the type of elements that will be stored in a multi-dimensional array.

    - var_name is the name of the array.

    - row0_col0 in the first braces is representing an array element in 0th row at
    0th column. One brace represents one row while the column number can be extended
    up to nth size.

    - row1_col0 in the second braces is representing an array element in 1st row at
    0th column.


    While initializing at the time of declaration, you do not need to specify row
    numbers. This is because, the JVM at runtime itself calculates the row numbers
    based on the total number of curly braces separated by commas in the multi-dimensional
    array. Therefore, the JVM internally assigns memory to the multi-dimensional array
    on the basis of the calculated array size. This following example initializes
    a multi-dimensional array, odd_no at the time of array declaration:


    ```

    int odd_no[][][] = {{3, 5, 7}, {1, 7, 9}, {5, 5, 35}};

    ```'
