    To search a string, the indexOf() and lastIndexOf() methods are used. The indexOf()
    and lastIndexOf() return the first index and the last index, respectively, of
    the occurrences of a character or string passed in these methods. Table 2 lists
    the various forms of the indexOf() and lastIndexOf() methods:


    | Table 2: Forms of the indexOf() and lastIndexOf() Methods |

    | Method | Description |

    | --- | --- |

    | indexOf(int char) | Returns the first index of the given character in the invoking
    string. You can also pass the ASCII value of a character to search for. For example,
    you can use indexOf(65) in place of indexOf ''A''. |

    | indexOf(int char, int start_index) | Works similar to the preceding method,
    but starts searching for the character from the given index. For example, indexOf(''a'',5);
    |

    | | In the preceding example, the index of the character, a is searched from the
    5th index of the invoking string. |

    | indexOf(String str) | Returns the first index of the given string, in the invoking
    string. |

    | indexOf(String str, int start_index) | Works similar to the preceding method,
    but start searching for the string index from the given index. For example, indexOf("abc",5);
    |'
