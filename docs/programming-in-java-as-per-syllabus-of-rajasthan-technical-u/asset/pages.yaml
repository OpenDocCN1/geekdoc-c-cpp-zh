  md: '# 174 Chapter 5


    Q5. Define the Package in Java?


    Ans. Java API consists of multiple classes and interfaces, which are arranged
    in the form of packages according to their similar functionality. These are the
    built-in packages of Java API and instead of using these built-in packages: you
    can also create your own packages in an application.


    Q6. Discuss the important categories of package in brief?


    Ans. In Java, packages are divided into the following categories:


    +   - The built-in packages: Offers some built-functionalities that you can use
    in your programs. These functionalities are coded in the form of classes and interfaces.


    +   - The user-defined packages: Permits a user to create a package in order to
    perform some specific tasks. These packages can also be imported and used in the
    same way as built-in packages.


    Q7. Define the Interface in Java?


    Ans. In Java, an interface is similar to an abstract class. Interfaces do not
    provide any method implementations; therefore they are abstract by nature. An
    abstract class can define both the abstract and non-abstract methods, whereas
    interfaces have only abstract methods.


    Q8. Write down the syntax of interface?


    Ans. The syntax of an interface is given in the following code snippet:


    Q9. Discuss the rules for declaring an interface are given as follows:


    Ans. The rules for declaring an interface are:


    +   - An interface declares only constants: not the instance variables.


    +   - The variables declared in an interface must be implicitly static, public,
    and final.


    +   - Interface methods must not be static, native or final.


    +   - An interface can extend another class or interface.


    +   - An interface cannot implement another class or interface.


    Q10. Explain in brief how import package in Java?


    Ans. Importing packages in any application allows you to take the advantages of
    classes stored in those packages. You can import as many packages as you require
    in an application. Apart from that, you can also import user-defined packages.
    In a Java program, you can take the benefit of any package by using the import
    statement with the package name. Import statement must come before the class definition
    and after the package specification.'
