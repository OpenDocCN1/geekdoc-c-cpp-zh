  md: "# Working with Objects and Classes\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_132_0.png)\n\
    \nFigure 34: Displaying an Error Message on Inheriting a Private Member\n\nNow,\
    \ we discuss the use of the super keyword in Java.\n\n# 4.8 Using the super Keyword\n\
    \nThe super is used to access the members of a class in a subclass. Unlike the\
    \ this keyword, the super keyword cannot be used to refer to the current object\
    \ of a class but is instead used to override the overridden method and hidden\
    \ variables in a subclass. In other words, the super keyword is used whenever\
    \ you need to refer to a superclass from a subclass.\n\nYou can also declare a\
    \ field in a subclass with the same name as provided in the superclass. In such\
    \ a case, the fields in the superclass cannot be accessed by the names in the\
    \ subclass, because they have the same name. To solve this problem, the super\
    \ keyword is used in the subclass to refer to the superclass members from the\
    \ subclass. Listing 34 shows the use of the super keyword to access the members,\
    \ and from a subclass from a superclass (you can find the Sub.java file on the\
    \ CD in the Code(Chapter4 folder):\n\n+   Listing 34: Implementing the super Keyword\n\
    \n```\npackage com.kogent;\nclass SuperDemo {\n    int val_1 = 100;\n    class\
    \ SubDemo extends SuperDemo {\n        int val_1 = 200;\n        public void show()\
    \ {\n            System.out.println(\"From superclass:\" + \n            super.val_1);\n\
    \            System.out.println(\"From subclass:\" + \n            val_1);\n \
    \       }\n        public static void main(String[] s) {\n            System.out.println(\"\
    using super:\");\n            Sub ob ob = new SubDemo();\n            ob.show();\n\
    \        }\n    }\n}\n```"
