  md: '# Exploring the Basic Programming Elements 47


    **Q5. What do you understand by conditional operator?

    Ans.** The conditional (?) operator is a ternary operator that takes three operands.
    It works similar to an if-else statement. The conditional (?) operator evaluates
    a boolean expression and gives the result based on this boolean expression. The
    conditional operator is constructed using a question mark (?) and a colon (-)
    symbol.


    ```

    operand1:operand3

    ```


    **Q6. Define a one-dimensional array.

    Ans.** A one-dimensional array is a set of the same data type variables. The dimension
    of an array represents the number of indexes associated with it. To represent
    elements in one-dimensional array, single index value is used.


    **Q7. How many data types are available in Java? Describe briefly.

    Java is a strongly typed language, and all the manipulation of data is done along
    the associated data type. In Java programming, you cannot declare a variable without
    specifying its data type. The data types available in Java can be divided into
    four categories:


    +   - Integer: Represents integers using byte, short, int, and long

    - Floating: Represents fractional numbers using float and double types

    - Character: Represents chars, which is used to store characters

    - Boolean: Represents logical values using boolean data type


    **Q8. Explain character data type with example.

    Ans.** In Java programs, the character data type is used to represent and store
    the character constants. This datatype follows the Unicode character set to represent
    the characters that can be uniquely identified. Unicode represents a standard
    character set that supports all the international characters of various languages,
    such as American. char has 2 bytes and range of 0 to 65535.


    An examples of char data types is given in the following code snippet:


    ```

    char grade=''A'';

    ```


    In the preceding code snippet, A is a character stored in grade.

    **Q9. Define arithmetic operators.

    Ans.** The operators that are used to carry out arithmetic operations are called
    arithmetic operators.


    **Q10. Explain class variable briefly.

    Ans.** Class variables are declared inside the class as its member with static
    modifier. Class variables are associated with class and allocate only one memory
    space for all the objects of that class. In other words, same value of the class
    variable is shared by all the objects of that class. Class variables are available
    in a program till the existence of their associated class.'
