  md: "# Working with Objects and Classes\n\n```\ncalc.addem(1)\ncalc.addem(int)\n\
    calc.addem(array)\ncalc.addem(obj)\n```\n\nWhen you pass a simple variable or\
    \ literal to a method, the value of the variable or literal is passed to the method—this\
    \ process is called passing by value. On the other hand, when you pass an object\
    \ or array, you are passing a reference to that object or array (in fact, when\
    \ you store an array or object in a variable, you are storing a reference to the\
    \ array or object). For that reason, the code in the called method has direct\
    \ access to the original array or object, not a copy of it. Therefore, if that\
    \ code changes some part of the array or object, such as an element in the array\
    \ or a data member of the object, the original array or object is changed.\n\n\
    # Returning Values from Methods\n\nYou can use the return statement in a method\
    \ to return a value from the method. You can also indicate the type of return\
    \ when you define the method as:\n\n```\n[access][static] type method_name([type\
    \ parameter_name1,[type parameter_name2...]])\n```\n\nThe return type can be any\
    \ type that Java recognizes—for example, int, float, double, the name of a class\
    \ you have defined, int[] to return an integer array, or float[] to return a float\
    \ array. Listing 11 is an example in which the class Calculator has a method named\
    \ addem that takes two integer parameters. adds them, and returns the result.\
    \ The following code snippet declares the addem method:\n\n```\nclass Calculator\n\
    {\n  int addem(int op1, int op2)\n  {\n  }\n}\n```\n\nThe following code snippet\
    \ shows how the sum of the values passed to addem, using the return statement:\n\
    \n```\nclass Calculator\n{\n  int addem(int op1, int op2)\n  {\n    return op1\
    \ + op2;\n  }\n}\n```"
