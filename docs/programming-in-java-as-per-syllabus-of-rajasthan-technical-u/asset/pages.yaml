  md: "# Using if Statement\n\nThe if statement is a conditional construct that is\
    \ used to evaluate an expression for an boolean value. In case, the expression\
    \ returns true, the statements following the conditional expression will be executed\
    \ but in case, it returns false, the code following the conditional expression\
    \ would not be executed and the program would just move along to the next statement.\
    \ Following is the general syntax for the if statement:\n\n```\nif (conditional\
    \ expression)\n<Statements to be executed when conditional expression evaluated\
    \ to>;\n```\n\nIn the preceding statement, if it is the keyword and inside the\
    \ parenthesis, the conditional expression is provided.\n\nListing 1 shows how\
    \ to use the if statement (you can find the IFDemo.java file on the CD in the\
    \ CodeChapter3 folder):\n\n+   Listing 1: Using if Statement\n\n```\nclass IFDemo\n\
    {\n    public static void main(String args[])\n    {\n        int age;\n     \
    \   age=16;\n        if (age>=18)\n            System.out.println(\"Not eligible\
    \ to vote\");\n    }\n}\n```\n\nIn Listing 1, if statement is used to test a condition\
    \ that whether age variable specified in the program is less than 18 or not. The\
    \ value for age is set to 16 in the program. Since, 16 is less than 18, the condition\
    \ set in the if statement becomes automatically true. Therefore, the statement\
    \ following the if condition is displayed, as shown in Figure 1:\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_69_0.png)\n\
    \nIn Figure 1, the statement provided inside the if block is displayed, because\
    \ the condition is true. Apart from executing statements when the statement is\
    \ true, you can also write code to execute statements when the condition is false.\
    \ Let's discuss how it can be achieved in the following section."
