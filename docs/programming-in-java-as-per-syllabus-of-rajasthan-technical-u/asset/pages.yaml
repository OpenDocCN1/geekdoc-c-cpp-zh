  md: '# Data Hiding and Encapsulation


    The concept of wrapping data and functions into a single unit is known as encapsulation.
    It is a mechanism that binds class members (variables and methods) together and
    prevents them from being accessible by other classes. The term data hiding implies
    that the data is not accessible by other classes and only the methods which are
    wrapped within the class access it. The methods that serve as a mediator between
    the object''s data and the program are known as member methods. Figure 1 shows
    the concept of data hiding:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_16_0.png)


    > ▲ Figure 1: Displaying Data Hiding


    In Figure 1, the data members are hidden from the other classes and they can only
    access the member methods.


    # Data Abstraction


    The concept of representing important features without including the background
    details is known as abstraction. Abstraction is the mechanism by which we hide
    data that is not required by a user. The basic notion is to hide unwanted data
    from the users and provide them the flexibility to work with only the needed.


    Let''s take the example of the car to understand the concept of abstraction. As
    the owner of the car, you must know how to drive it. This obviously implies that
    you know about the various components of the car and how to use them. For example,
    you know that the accelerator pedal is used to increase the speed of the car and
    pressing the brake pedal stops it. To perform these simple actions, you just need
    to know how to use these components, and not how they function. Similarly, in
    OOP, you need to know about the specific classes or methods that are called to
    implement specific program logic, without knowing how these classes or methods
    work. This concept is known as abstraction.'
