    \ non-synchronized methods, in which the data that you not not to protect can\
    \ be manipulated. You should remember the following points while using synchronized\
    \ and non-synchronized methods:\n\n+   - There are many chances of occurring deadlock\
    \ when synchronized methods are used. Apart from synchronized methods, multiple\
    \ threads can also invoke non-synchronized methods.\n\n+   - If a thread has an\
    \ object that goes to the sleep state, it does not relinquish the object lock.\n\
    \n+   - If a thread is executing a synchronized method and needs to invoke another\
    \ synchronized method, it can get the object lock to invoke the method. After\
    \ any finishes the method, it relinquishes the lock.\n\n+   - If a acquires an\
    \ object lock for a particular object, any synchronized method associated with\
    \ the object can be invoked by the thread without a new lock for the object.\n\
    \nIn the Java programming language, you can also synchronize static methods. While\
    \ synchronizing static methods, a thread needs to acquire the class lock instead\
    \ of an object lock. The following code snippet shows how to synchronize the static\
    \ method:\n\n```\npublic static synchronized void display() {\n    System.out.println(\"\
    This is synchronized method\");\n}\n```\n\nIn the preceding code snippet, the\
    \ static display() method is created as a synchronized method.\n\n# Synchronized\
    \ Blocks\n\nSynchronizing methods may result in a deadlock, which can be avoided\
    \ by synchronizing certain blocks of code instead of a complete method. When a\
    \ block of code is synchronized, the thread executing the block needs to acquire\
    \ the object lock of an arbitrary object. Generally, it is the current object\
    \ whose lock is acquired by a thread to invoke the synchronized block, as shown\
