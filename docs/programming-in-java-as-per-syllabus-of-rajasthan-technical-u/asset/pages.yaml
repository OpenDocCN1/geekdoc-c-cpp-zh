  md: '# Working with GUI 317


    | Table 2: Discussing the Notworthy Methods of the Component Class |

    | Method | Description |

    | --- | --- |

    | void setVisible(boolean b) | Sets the visibility of a component, that is, if
    the parameter b is set to true, otherwise, it is hidden.

    | void setEnabled(boolean b) | Enables a component if the parameter b is set to
    true; otherwise, the component is disabled.

    | void setBounds(int x, int y, int w, int h) | Sets the component in rectangular
    bounds. The x and y parameters of setBounds() set the x and y coordinates of the
    rectangle and the w and h parameters set the width and height |


    Next, let''s discuss the Container class.


    +   * Exploring the Container Class

    An AWT object represents a component that has the ability to hold other AWT components.
    The tracking of the components in a container is done in a list. This list helps
    in defining the order of the components placed in a container. Note that components
    are added to the end of the list if no index is defined for them. The Container
    class is an abstract class that cannot be instantiated and some of its methods
    must be implemented by its subclass. Table 3 lists noteworthy methods of the Container
    class:


    | Table 3: Explaining the Notworthy Methods of the Container Class |

    | Method | Description |

    | --- | --- |

    | Component add(Component comp) | Appends a component, passed as an argument,
    to the end of a container.

    | Component add(Component comp, int index) | Appends a component, passed as an
    argument, at the specified position in a container.

    | Component getComponentAt(int x, int y) | Retrieves the component with x and
    y coordinates.

    | void remove(int index) | Removes the given component placed in a container.

    | LayoutManager getLayout() | Gets the layout manager for a container.

    | void setFont(Font f) | Sets the font for the text of a container.

    | void setLayout(LayoutManager l) | Sets the layout for a container.

    | void update(Graphics g) | Updates a container.


    Let''s discuss the Panel, Window and Frame classes in the subsections.


    +   * Exploring the Panel Class

    The Panel is a subclass of the Container class and a superclass of the Applet
    class. A panel serves as a container for attaching other components or panels.
    You can add a title bar and border to a panel window. When screen output of an
    applet is displayed inside a browser, the screen output appears on the Panel object
    in the application. because of the absence of a title bar, menu bar, or border,
    you do not see these items when'
