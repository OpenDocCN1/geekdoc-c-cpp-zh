  md: '# 03 Working with Control Statements


    +   OBJECTIVES

    - Explore Selection Statements

    - Explore Iteration Statements

    - Explore Jump Statements


    In a Java program, to achieve certain results, some specific operations need to
    be performed repeatedly. The execution of these operations is based on the fulfilment
    of certain conditions. These conditions are placed in various control flow statements,
    such as conditional statements, iteration statements, and jump statements. The
    operation to be performed is a control statement that allows choosing between
    two or more execution paths in a program. The itation statements repeatedly execute
    the code block on the basis of the conditional statement. The conditional statement
    evaluates to false, the loop exits. After that, the control transfers to the next
    statement that follows the loop. Jump statements explicitly redirect the flow
    of program execution.


    This chapter discusses various control statements. You learn the selection statements,
    iteration statements, and jump statements. In selection statements, the chapter
    covers if, if-else statement, multiple if-else statement, and switch statement.
    Next, the chapter discusses the iteration statements. You learn while loop, do-while
    loop, for loop, for-each loop, and nested loops. At the end of the chapter, the
    chapter discusses the jump statements. In the jump statements, you learn break,
    continue, and return statement. Let''s start first with the selection statements.


    # 3.1 Using Selection Statements


    Selection statements, as the name itself suggests, cause a program to execute
    a block of code on evaluating a conditional expression and selecting code for
    execution. If the conditional expression comes out to be true, the accompanying
    block of code is executed and if it is false, the accompanying block of code is
    bypassed. Following are the selection statements available in Java:


    +   - if statement

    - if-else statement

    - multiple if-else statement

    - switch statement


    Let''s discuss these selection statements in detail.'
