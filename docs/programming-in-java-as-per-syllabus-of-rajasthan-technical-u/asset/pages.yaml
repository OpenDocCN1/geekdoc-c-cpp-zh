  md: '# Chapter 1


    +   - Simple


    Java is simple to learn and use. In Java, it is easy to write and debug programs
    because Java does not use pointers. Moreover, Java provides bug free system due
    to strong memory management and also has automatic memory allocation and deallocation
    system. Unlike other programming languages, which provides dozens of complicated
    ways to perform a simple task, Java provides a simple and clear approach to achieve
    a given task. If a programmer understands the basic concepts of OOP, it becomes
    easier for him to learn Java.


    +   - Secure


    In today''s world, everybody needs safety and security. Due to the threat of hackers,
    people feel unsafe performing commerce over Internet. To overcome such fears,
    Java provides the safety and security features.


    While using Java compatible, everyone can safely download Java applets by relaxing
    their minds from the fear of virtual infection or malicious intent. Since Java
    programs are confined to the Java runtime environment, they can access only that
    part of your computer which is required for program execution. The data outside
    Java runtime environment cannot be accessed by Java programs, and downloading
    a Java application will not harm your computer. That''s why Java is a secure language.


    +   - Portable


    In the distributed world of Internet, an application developed with the help of
    a programming language might be accessed on various computers having different
    kinds of operating systems. It''s not guaranteed that the application is portable,
    that is the application runs successfully on all operating systems. To overcome
    this portability issue, Java introduces a concept of bytecode, which is a set
    of instruction generated by the Java compiler.


    +   - Robust


    Generally, programs fail for the following two reasons:


    +   - Memory management: Lack of memory management for allocating and deallocating
    memory for objects.


    +   - Exceptional Conditions: Occurrence of unexpected exceptions.


    Considering the preceding reasons, Java was designed to provide the ability to
    create robust programs. Java compiles the programs to resolve the mistakes during
    compilation. Java also frees the programmer from the worries of common causes
    of programming errors as the program code is verified during compilation.


    Java also eradicates the problem of memory management by performing automatic
    garbage collection. It manages the memory allocation and deallocation for unused
    objects.


    # Multithreading


    Java is a programming language that is designed for the distributed environment
    of the Internet and for the concept of multithreading is implemented. This feature
    helps to write interactive programs wherein multiple tasks can be performed simultaneously;
    thus making it a robust programming language.'
