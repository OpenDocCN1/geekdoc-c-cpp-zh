    +   - Java Virtual Machine


    Bytecode is the machine language for JVM and is not machine specific. Instead,
    the machine specific code is generated by the Java interpreter, which serves as
    a mediator between virtual machine and real machine. Figure 4 shows the process
    of compilation and conversion of bytecode into machine.


    ![](img/d3faa73f55d3d314bb5bfb277886900d_21_0.png)


    **Figure 4: Displaying Process of Compilation and Execution in Java**


    In order to run a Java program on a different computer, you need a Java interpreter
    for Java bytecode. Although Java bytecode interpreter is required depending upon
    the type of operating system in use, but once a computer has an interpreter, it
    can run a Java bytecode. In other words, the most important feature of Java is
    that the same compiled program can run on any operating system, as shown in Figure
    5:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_21_1.png)


    **Figure 5: Displaying Process of Running Program on Any Operating System**


    Java is implemented as the JVM, which is the application that actually executes
    the Java program. When JVM is installed on a computer, it can run Java programs.
    Java programs, therefore, don''t need to be self-sufficient, and they don''t have
    to include all the machine-level code that runs on the computer. Instead, Java
    programs are compiled into compact bytecodes, and the JVM reads and interprets
    these bytecodes to run your program. To host Java on numerous computers, Sun only
    had to rewrite JVM to work on those computers. Since your program is stored in
    a bytecode file, it will run on any computer on which a JVM is installed. This
    is all about the bytecodes and the JVM. With this come to the end of the chapter,
    let''s summarize the concepts that you have learned in the chapter.'
