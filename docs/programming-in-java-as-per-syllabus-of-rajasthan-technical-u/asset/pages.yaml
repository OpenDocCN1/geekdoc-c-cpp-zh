  md: "# Extending the Thread Class\n\nIn a Java program, you can create threads by\
    \ extending the java.lang.Thread class. This is the simplest form of creating\
    \ threads in a program. Some of the important points to keep in mind while creating\
    \ threads in this way are as follows:\n\n+   - The class that extends the Thread\
    \ class should have the ability to override the Thread class run() method.\n-\
    \ The constructor of the Thread class may be called explicitly in the constructor\
    \ of the class extending it by using the super keyword to initialize it.\n- The\
    \ class extending the Thread class invokes the start() method inherited from the\
    \ Thread class to make the thread eligible for running.\n\nConsider the following\
    \ code snippet that shows the SampleThread class extending Thread class:\n\n```\n\
    class SampleThread extends Thread {\n    public void run() {\n        System.out.println(\"\
    the code to perform specific function by thread\");\n    }\n}\n```\n\nIn the preceding\
    \ code snippet, the SampleThread class is created by extending the Thread class.\
    \ The run() method of the Thread class is overridden by the SampleThread class\
    \ to provide the code to be executed by a thread.\n\nIn Java, you cannot extend\
    \ a class from more than one class. Therefore, while creating a thread by extending\
    \ the Thread class, you cannot simultaneously extend any other class. For example,\
    \ while creating a GUI application using the Swing Application Interface (API),\
    \ you need to extend the JFrame class and therefore, you cannot extend the Thread\
    \ class in the same application to create threads. However, in such cases, you\
    \ create threads by implementing the Runnable interface.\n\n# Implementing the\
    \ Runnable Interface\n\nYou can also create threads by implementing the java.lang.Runnable\
    \ package. This package allows you to define a class that can implement the Runnable\
    \ interface and extend any other class, if needed. Creating a thread by implementing\
    \ the Runnable interface is very similar to creating a thread by extending the\
    \ Thread class. The following code snippet shows how to create a thread by implementing\
    \ the Runnable interface:\n\n```\nclass SampleThread implements Runnable {\n \
    \   public void run() {\n        System.out.println(\"the code to perform specific\
    \ function by thread\");\n    }\n}\n```\n\nIn the preceding code snippet, the\
    \ SampleThread class is created by implementing the Runnable interface and overriding\
    \ the run() method in which it defines the code to be executed by a thread."
