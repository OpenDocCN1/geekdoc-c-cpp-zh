    # 2.3 Operators


    An operator is a symbol that allows a programmer to perform certain arithmetic
    or logical operations on data and variables. In this section, we discuss the following
    operators in Java:


    +   ■ Assignment operator

    ■ Arithmetic operator

    ■ Bitwise operator

    ■ Relational


    +   ■ Boolean logic operator

    Let''s discuss all these operators and their implementation in detail.


    # ■ Assignment Operator


    The equal (=) symbol is known as the assignment operator. The assignment is to
    store or assign a value to a variable. For example, in expression, i=10, we are
    used to store or assign a value 10 to the variable i. Remember that in expression
    i=10, we are not comparing the variable i with 10; rather we are assigning the
    value 10 to the variable.

    In Java, assignment operators can be used in two ways--simple and compound. In
    simple assignment, we use the equal (=) operator for assigning a value to a variable.
    The following code snippet shows an example of simple assignment:


    ```

    x = 10;          //x stores 10

    x += 10;         //x stores 20

    x = x + 5 * 15;   //x stores 95

    ```


    In compound assignment, we use the +=, -=, *= and %= operators. The following
    code snippet shows an example of compound assignment:


    ```

    i = 10;          //i is initialized with the value 10

    i += 15;         //i is compound assigned with 25

    i -= 5;          //i is compound assigned with 20

    ```


    In the preceding code snippet, the variable i is assigned with the value 10. In
    the expression i+=15, the value 15 is added to the value already contained in
    the variable i and the total value is reassigned to i, so i will contain 25. In
    the expression i-=5, the value 5 is subtracted'
