  md: '# 212 Chapter 7


    +   - RuntimeException: Thrown when the arithmetic operations performed in a program
    are incorrect and of common exceptions, such as ArithmeticException, IndexOutOfBoundsException.


    +   - ClassNotFoundException: Thrown when a class that needs to be loaded is not
    found.


    +   - CloneNotSupportedException: Thrown when a method does not implement the
    Cloneable interface but uses the clone ( ) method.


    +   - IllegalAccessException: Thrown when a method is called in another method/class.
    However, the calling method/class does not have permission to access that method.


    +   - InstantiationException: Thrown when an abstract class or an interface is
    instantiated.


    +   - InterruptedException: Thrown when a thread in the sleeping or waiting state
    is interrupted by another thread.


    +   - NullPointerException: Thrown when an undefined variable is used in a program.


    +   - NoSuchMethodException: Thrown when an undefined method is used in a program.


    As discussed, the RuntimeException class contains several other subclasses that
    are used to handle specific types of exceptions. Therefore, we discuss these subclasses.
    The subclasses of the RuntimeException are:


    +   - ArithmeticException: Thrown when an arithmetic problem, such as when a number
    is divided by 0, is encountered.


    +   - IndexOutOfBoundsException: Thrown when an array or String is going out of
    the specified index. This exception class has two subclasses: ArrayOutOfBoundsException
    and StringOutOfBoundsException.


    +   - ArrayOutOfBoundsException: Thrown when an array element is out of index
    is accessed. The StringOutOfBoundsException exception is thrown when a String
    or the StringBuffer element out of the index is accessed.


    +   - ArrayStoreException: Thrown when you try to store any value in an array,
    which is not of the type. For example, suppose that an array is of integer type
    but the value is of another type.


    +   - ClassCastException: Thrown when inappropriate types are typecast.


    +   - IllegalArgumentException: Thrown when an illegal argument is passed to a
    method. This class has two subclasses: IllegalThreadException and NumberFormatException.
    The ThreadStateException is thrown when you try to perform any operation on a
    thread, which is not compatible with the thread''s current state. The NumberFormatException
    is thrown when a numeric value is passed into a string but the process fails.


    +   - IllegalMonitorStateException: Thrown when a thread that does not have an
    object''s monitor rights tries to access the object''s wait( ), notify( ), and
    notifyAll( ) methods.


    +   - IllegalStateException: Thrown when the runtime environment is not in an
    appropriate state to call any method.


    +   - NegativeArraySizeException: Thrown when you try to create a negative size
    array in a program.'
