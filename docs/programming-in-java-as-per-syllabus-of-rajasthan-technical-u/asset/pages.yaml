    # Exploring Types of Exceptions


    Java users to handle exceptions that are supported by it. These exceptions are
    known as built-in exceptions. Apart from these Built-in exceptions, Java also
    allows users to create their own exceptions to be thrown in a Java program, and
    are known as user-defined exceptions. In this section, we will explore the types
    of exceptions in the following sub-headers:


    +   - Built-in Exceptions

    - User-defined Exceptions

    Let''s discuss them one by one in detail.


    # Built-in Exceptions


    Built-in exceptions are exceptions that are already available in Java. These exceptions
    are thrown by the Java runtime system to explain the condition. Built-in exceptions
    are further categorized into the following types:


    +   - Checked Exceptions: The Checked exceptions are classes that are extended
    from the Exception class except the RuntimeException class. The Checked exceptions
    must be caught using either the implicit or explicit exception handling techniques.
    The compiler is able to detect the checked exceptions during compilation time.
    Some of the examples of Checked exceptions are ClassNotFoundException, CloneNotSupportedException,
    IllegalAccessException.

    - Unchecked Exceptions: The Unchecked exceptions are classes that are extended
    from the RuntimeException class. The compiler is not able to detect the unchecked
    exceptions at the time of compilation. These exceptions are not required to be
    caught using either the implicit or explicit exception handling techniques. Some
    of the examples of Unchecked exceptions are ArrayIndexOutOfBoundsException, ArithmeticException,
    NullPointer.


    Table 1 explains most commonly used built-in exceptions in


    | Exception | Description |

    | --- | --- |

    | ArithmeticException | Thrown when an arithmetic operation is noticed by the
    Java runtime system. For example, this exception is thrown when a number is divided
    by 0. |

    | ArrayIndexOutOfBoundsException | Thrown when you try to access an array with
    an illegal index. Let''s suppose you have declared an array to store a maximum
    of 5 elements, but while traversing the loop, you try to access the 6th element.
    In such a situation, this exception will be thrown. |

    | ClassNotFoundException | Thrown when you try to access a class, which is not
    defined in your Java program. |'
