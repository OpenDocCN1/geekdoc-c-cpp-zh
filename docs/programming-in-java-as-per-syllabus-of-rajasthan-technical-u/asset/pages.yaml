  md: '# Setting Method Access


    You can add an access modifier to the methods in a class, using the following
    way where access is the access modifier:


    ```

    access class className [extends ...] [implements ...]

    {

    [access] [static] type method1 (parameter_list)

    {

    }


    [access] [static] type methodN (parameter_list)

    {

    }

    }

    ```


    Access modifiers can be classified into public, private, protected, and default.
    These access modifiers are discussed as follows:


    +   - The Public Access Modifier: Public class members are those members that
    are accessible from any class inside or outside the package it is declared.

    - The protected Access Modifier: Protected class members are those members that
    are accessible from all the classes of a particular package and only from the
    subclasses in another package.

    - The private Access Modifier: Private class members are those members that are
    not accessible outside their class and they cannot be accessed even by their subclasses,
    either from the current package or from another package.

    - The default Access Modifier: Class members remain visible to the associated
    class and subclasses within the same package.


    > You will learn about the packages in detail in the next chapter.


    Listing 9 is an example to add a private method to the example class. This method
    may only be called from other methods in the Example class. Listing 9 shows the
    code for the Printer class (you can find the Printer.java file on the CD in the
    Code\Chapter4 folder):


    # Listing 9: Showing on Example to Set Method Access


    ```

    class Example

    {

    public void print()

    {

    internal_use_only();

    }\private void internal_use_only ()

    {

    }

    ```'
