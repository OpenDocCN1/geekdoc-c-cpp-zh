  md: '# 318  Chapter 9


    an applet runs in a browser. However, when you run an applet using an applet viewer,
    the applet viewer displays the title bar and check boxes. You can add other components,
    such as buttons and check boxes, to the Panel object using the add() method. After
    adding these components, you can position and resize them using the various methods
    of the Component class, such as setLocation(), setSize(), or setBounds().


    # Exploring the Window Class


    The Window class is a subclass of the Container class. An object of the Window
    class represents a top-level window with no menu bar or border. The WindowAdapter
    class responds to events, as WINDOW_OPENED and WINDOW_CLOSED, of the Window object.
    You should create an object of the Frame class, instead of creating an instance
    of the Window class. The Frame class is the subclass of the Window class and the
    Frame class provides a normal window with a title bar.


    # Exploring the Frame Class


    As the Frame class is a subclass of the Window class and contains a title bar
    and borders; therefore, when you create an object of the Frame class within an
    applet a warning message is displayed during execution.


    The default layout of a window is BorderLayout. A Frame window generates events,
    such as WINDOW_OPENED, WINDOW_CLOSED, WINDOW_ACTIVATED, and WINDOW_DEACTIVATED.


    Now that you are familiar with the various classes of the java.awt package, let''s
    learn how to create a frame window and its various properties to display, hide,
    and close the window.


    # 9.2 Using AWT Frames


    In this section, you learn how to create a frame window by the AWT API. Depending
    on a user''s requirement, a Windows application may consist of several components,
    such as windows, text boxes, check boxes, and buttons. All these AWT components
    can be added in a window.


    Now, let''s create a frame in a Windows application using the java.awt package.
    To do so, the following broad steps are performed:


    +   - Create a Frame window

    - Hide and display the Frame window

    - Set the title of the Frame window

    - Close the Frame window


    Now, let''s perform these steps one by one.


    # Creating a Frame Window


    A frame window is created by extending the functionality of the Frame class. This
    window has a title bar, menu bar, borders, and resizing options, such as minimize,
    maximize, and close. Before creating a frame window, however, let''s list the
    noteworthy constructors of the Frame class that help to create a frame window,
    as shown in Table 4:'
