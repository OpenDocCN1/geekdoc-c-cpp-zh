  md: '# Introducing Java


    # OBJECTIVES


    +   - Introduce Object Oriented Programming

    - Explore Object Oriented Programming Principles

    - Explore Features of Java

    - Learn the Bytodes and the Java Virtual Machine (JVM)


    Java is an Object Oriented Programming language that inherits its features from
    C++. Java language was created by a software developer, James Goling, at Microsystems
    in 1991. It was first called Oak; the name changed to Java in 1995, when it was
    first released for public use.

    Before the advent of Java and C++, C was extremely popular language among programmers,
    and it seemed that C was the perfect programming language containing the best
    elements of low-level language and higher-level languages into a programming language.
    However C had its limitations; when C grew longer, they became more unwieldy,
    programmers could not reduce C into self-contained programs. This meant that the
    code in the first line of a long program could interfere with the code in the
    last, and the programmer had to keep the code in mind while programming. Then,
    the concept of Object Programming (OOP) was introduced to cut long programs into
    semi-autonomous units. This led to the emergence of C++ programming language.


    The chapter begins with the discussion on OOP and its principles. In the Object
    oriented programming principles section, the chapter discusses the method overloading
    and overriding, encapsulation, and polymorphism. Moreover, the chapter also states
    the features of Java. In addition, the chapter discusses the bytecode. Towards
    the end, you learn about the Java virtual machine. Let us start with the Object
    oriented programming.


    # 1.1 Introducing Object Oriented Programming


    OOP is a technique that allows you to implement many famous programming: "divide
    and conquer". The notion is to make each object semi-autonomous by encapsulating
    private data and methods into objects. The concept of OOP can be better understood
    with the help of a scenario. Imagine you have placed several pipes, pumps, a compressor,
    and all kinds of switches in your kitchen to keep food cool. The temperature of
    the food gets hot, high on the turn you adjust the valve value by cranking the
    compressor manually. Now, you wrap all these functionalities into an object, a
    refrigerator, in which all these operations are handled automatically with the
    object proper proper coordination between the various parts. This is the concept
    of encapsulation; or in other words, encapsulation hides the complexity of a class
    by providing an object of a class. The object handles all the work internally
    and can be easily conceptualized, similar to the preceding example of refrigerator.
    If the first dictum of OOP is "divide and conquer", the second is surely "out
    of sight, out of mind". Now, let''s discuss some fundamental concepts and principles
    in OOP.'
  merge: -1
  pgno: 14
