  md: '# 2 ► Chapter 1


    # 1.2 Exploring the Object Oriented Programming Principles


    The OOP provides basic concepts which help in programming. Java, being an Object
    OrientednProgramming language, implements and applies the concept of OOP. Consequently,
    you must become familiar with the OOP concepts. The basic concepts of OOP are
    as follows:


    +   - Objects

    - Classes

    - Data Hiding and Encapsulation

    - Data abstraction

    - Inheritance

    - Polymorphism

    - Dynamic binding

    - Message passing


    Now let''s discuss each of them in detail.


    Objects are basic runtime entities in OOP. An object can represent a person, a
    place, a bank

    account, or user-defined data such as vectors, lists, and collections. When a
    program is

    , the objects interact with each other by sending messages. For example, if employee\and
    salary are two objects in a company program, the employee object may send a message
    to

    the salary object requesting the annual salary. Each object contains data, and
    code to

    manipulate data.


    OOP allows decomposing a problem into a number of entities known as objects and
    then the

    methods are invoked using the objects. Therefore, an object is a combination of
    data and

    methods.


    # Classes


    In OOP, classes provide a sort of template for objects. You use a class to create
    an

    object and then you can call the object''s methods from your code. In other words,
    objects are

    types of type class. After defining a class, any number of objects belonging to
    that class

    be declared.


    A class is a collection of objects of similar type. For example, car, bike, and
    scooter are

    members of the Vehicle class. The syntax for declaring an object of a class is:


    ```

    class_name object_name;

    ```


    Now considering the example of the Vehicle class, the following code snippet declares
    the

    of of the Vehicle class:


    ```

    vehicle v;

    ```


    In the preceding code snippet, the v object is declared of the Vehicle class.'
  merge: -1
