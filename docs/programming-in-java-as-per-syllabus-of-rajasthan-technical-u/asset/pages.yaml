    Q6. Explain character streams in brief?


    Ans. Character streams are those classes that support input and output of 16-bit
    Unicode characters. Character streams are provided by the classes present in the
    java.io package, and by the Reader class. Writer, and their subclasses present
    in the java.io package. The methods present in the character streams accept parameters
