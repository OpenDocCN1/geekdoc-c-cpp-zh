  md: '# 06 Strings Handling


    # OBJECTIVES


    +   * Learn about String Constructors

    * Learn how to Find Length of a String

    * Explore Special String Operations

    * Study Character Extraction

    * Learn how to Modify a String

    * Learn how to Search and Compare Strings

    * Learn the StringBuffer Class


    Strings are very important in the world of programming languages as they are used
    to process long textual/symbolic information. For example, when you visit a bank
    to open an account, you are asked to provide information, such as your name and
    address. The information you provide is in the form of an ordered sequence of
    characters and symbols. This ordered sequence is known as a string.


    In programming languages like C and C++, strings are considered fundamental data
    types. In programming languages, character arrays are used to process long textual
    information. However, using character arrays to process long textual information
    is a bit tedious and consuming. Therefore, in Java, strings are not considered
    fundamental data types. Instead, in Java, the String class is provided to work
    with strings as well as with character arrays. In Java, you can either use character
    arrays or the String class as per your requirement.


    In Java strings are immutable, once an object of the String class is created and
    initialized with a value, the value cannot be changed. However, you might sometimes
    need to manipulate the value of a String object. For this, Java provides the StringBuffer
    class.


    In this chapter, you learn about strings in Java. The chapter also helps you to
    explore the String constructors. Moreover, the chapter discusses the special string
    operations. Furthermore, the character extraction is also described in the chapter.
    You also learn how to search and compare the strings. In addition, you learn how
    to calculate the length of a string. You also learn how to modify a string. Towards
    the end of the chapter, you learn about the StringBuffer class. Let''s start first
    with the string constructors.


    # 6.1 String Constructors


    In Java, the primitive type stores integers and the float primitive type stores
    floating-point numbers, but there is no primitive type to store string data. You
    need objects of the String class to handle string data in Java. The String class
    is included in the java.lang package. As this package is imported by default,
    each class in Java can use the String class. Table 1 lists the most commonly used
    constructors of String class, which allow you to work with String objects:'
