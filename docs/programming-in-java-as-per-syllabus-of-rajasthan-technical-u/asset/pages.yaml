  md: "# Using throws Clause\n\nThe throws clause is used when you know that a method\
    \ may cause exceptions, but the method is incapable of handling exceptions. In\
    \ such a case, a user has to throw exceptions to the caller of the method by using\
    \ the throws clause. A throws clause is used with a method declaration. The syntax\
    \ of the throws clause is:\n\n```\nreturn_type method_name(para) throws excep1,\
    \ excep2, excep_n {\n    method body\n}\n```\n\nIn this code snippet, return_type\
    \ is any literal type returning to the values that the method returns. method_name\
    \ is any literal method name. para is a list of parameters that needs to be passed.\
    \ the throws clause is used to throw exceptions. excep1, excep2, and excep_n are\
    \ the exceptions you want to throw. Multiple exceptions can be thrown. If you\
    \ want to throw more than one, separate them with commas.\n\nThe compiler does\
    \ not check for the exception type that is thrown using the throws clause. Some\
    \ of the rules that be kept in mind when you are using the throws clause:\n\n\
    +   - A subclass overrides the method of the superclass, which means that the\
    \ overriding method also overrides the exceptions thrown in the overridden method.\n\
    - An overriding method must declare the exception thrown in either the overridden\
