    # Adding Check Box and Radio Button


    A check box is a square-shaped box, which displays an option to the user. When
    the user selects the check, a visual indication of some kind, such as a check
    mark, appear to specify that the check box is selected. If the check box is selected,
    then the check box is cleared.

    A radio button, on other hand, is round-shaped, and only one button can be selected
    from the given group of radio buttons as compared to check boxes, which you can
    select more than one at a time. Radio buttons are created by adding check boxes
    to a check box group. The class used to create the radio buttons is known as the
    CheckboxGroup class, while the class used to create a check box is the Checkbox
    class. Table 12 lists the noteworthy constructors of the Checkbox class.


    Table 13 lists the noteworthy methods of the Checkbox Class:

