  md: '# 08 Implementing Threads in Java


    # OBJECTIVES


    +   - Learn about Threads in Java

    - Learn how to Start a Thread

    - Learn how to Start and Execute Multiple Threads

    - Learn about Thread States and Priorities

    - Learn about Thread Synchronization Mechanism


    Thread is the smallest unit of an executable code in a program. It helps you to
    divide a process multiple parts to speed up the process. A process is a program
    that executes as a single thread.


    Programs that run as single threads can cause problems when you perform two or
    more tasks simultaneously. For example, while playing an online game, you come
    across a situation where the game does not show the updated score but still displays
    the graphics properly. In this example, displaying the graphics of the game and
    updating the score are two different tasks are to be handled simultaneously. Therefore,
    it is important to ensure that the game provides support to handle these tasks
    to make the game fast and interactive enough to play.


    However, to overcome some problems, Java provides built-in support for multithreaded
    programming, which enables a program to perform multiple tasks simultaneously.
    In the multithreaded programming, each thread is a separate task, and each thread
    executes independently in a program. Multiple threads within a program share the
    same memory address space, and share the same set of variables and objects among
    them.


    In this chapter, you learn about threads and their states. You also learn how
    to create, instantiate, and terminate threads. The concepts of thread synchronization,
    inter-thread communication, thread priorities, and deadlocks, are also discussed
    in the chapter. Let''s begin by providing an overview of threads.


    # 8.1 Defining Threads


    Threads are used to implement concurrency in Java programs. Concurrency is the
    simultaneous execution of multiple tasks. These tasks can be implemented as separate
    processes, or as a set of threads within a single program. For example, working
    in a word processor while listening to an audio file at the same time are two
    tasks implemented as separate processes. However, you need a single program or
    process to perform multiple tasks at the same time, such as a word processor that
    calculates the number of words in a document while printing the document. The
    word processor is a single program that performs two tasks simultaneously, calculating
    the number of words in the document and printing the document. These two tasks
    are implemented as two separate threads within the word processor.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 274 Chapter 8


    **Threads** are light-weight processes, because creating a new thread requires
    fewer resources than creating a new process. For example, a newly created thread
    shares the same address space with the other threads in a program, whereas every
    individual process has its own separate space. Therefore, creating a thread involves
    less overhead than creating a process.


    The simultaneous execution of threads is implemented with the needs of time-slice.
    The time each thread gets for its processing is known as time-slice. Each thread
    executes according to the time-slice allotted to it until you it appears as if
    these threads are running at the same time.


    The objective of executing multiple threads simultaneously is to use the idle
    time of Central Processing Unit (CPU). For example, CPU remains idle until you
    create a character from the keyboard or move the mouse.


    Some important uses of threads are as follows:


    +   - Threads are used in server-side programs to serve the needs of multiple
    clients on the network or the Internet.


    +   - Every program executes a set of instructions. These instructions are executed
    in a predefined manner or path of execution. This path of execution is known as
    execution requirement; Each program has at least one execution thread, although,
    depending on the requirement; more than one execution thread can be created in
    a program through which you can perform multiple tasks simultaneously.


    In the Java programming language, a program can have more than one thread, where
    each thread has its own path of execution. All the threads in a program share
    the same address space, data, and code in a program; therefore, threads are considered
    processes.


    You can create a thread by extending and instantiating the Thread class or by
    implementing the Runnable interface. If you implement the Runnable interface to
    create a thread, then you need to pass the object to the Thread constructor. Whether
    or not you create any other thread in a Java program, you must create the main
    thread. Let''s discuss about the main thread in the following


    # Describing the Main Thread


    During the execution of a program, Java Virtual Machine (JVM) creates a user thread
    to automatically execute the `main()` method, which is the main thread. If any
    user thread is not created in the program, the main thread terminates when the
    `main()` method finishes execution. In addition to the main thread, a Java program
    can also have child threads. Apart from the main thread, all the threads created
    in the program inherit the status of the main thread. In this case, even if the
    `main()` method terminates, the program keeps running until the user threads finish
    their execution.


    Let''s discuss how threads are created and used. In Java, a thread can be created
    in the following ways:


    +   - Extending the Thread Class


    +   - Implementing the Runnable Interface


    Let''s discuss these ways in detail.'
