  md: "In the preceding code snippet, the paint() method takes one parameter g of\
    \ type Graphics class to draw all kind of drawings, as line and rectangle, and\
    \ text in an applet. Let's learn how to use the update() method of an applet.\n\
    \n# Using the update(i) Method\n\nThe update() method is called when a portion\
    \ of the applet is to be redrawn. This method can be used to make small changes\
    \ to display an applet. This method is defined in the Component class and is called\
    \ when an applet needs a portion of window to be redrawn. The default version\
    \ of the update() method simply calls the paint() method before filling the default\
    \ background color of an applet. It means that when you fill the background color\
    \ using the paint() method, a flash of background is occurred, each time the update()\
    \ method is called. To avoid this problem, override the update() method and then\
    \ call it within the method. The following code snippet shows how to override\
    \ the update() method:\n\n```\nimport java.awt.Applet;\nimport java.awt.*;\npublic\
    \ class FirstApplet extends Applet {\n    public void update(Graphics g) {\n\n\
    \        // redisplay your window.\n    }\n    public void paint(Graphics g) {\n\
    \n        update(g);\n    }\n}\n```\n\nIn the preceding code snippet, the FirstApplet\
    \ overrides the update() method and calls this method within the paint() method.\
    \ The update() method has one parameter of Graphics type that contains the graphics\
    \ context to run applet in graphics environment. This graphic content is used\
    \ to print message and various shapes, as oval and polygon in an applet.\n\n#\
    \ Invoking the repaint(i) Method\n\nThe repaint() method is used whenever an applet\
    \ needs to update information in its window. AWT defines the repaint() method\
    \ which causes the AWT runtime-system to execute the update() method of an applet.\
    \ Further method also calls the paint() method to display the information. For\
    \ example, if you need a string value as an output, you can store this value in\
    \ a String variable and call the repaint() method. Inside the paint() method,\
    \ this string will be output using the drawString() method. The following are\
    \ four forms of the repaint():\n\n+   - repaint(): Repaints an entire window of\
    \ an applet.\n\n+   - repaint(int left, int top, int width, int height): Repaints\
    \ a window of an applet with specified region in terms of left, top, width, height.\
    \ Using the repaint() method you can update a small portion of a window and repaint\
    \ only specified region efficiently.\n\n+   - repaint(long maxDelay): Updates\
    \ a window in the maximum number of milliseconds specified with maxDelay."
