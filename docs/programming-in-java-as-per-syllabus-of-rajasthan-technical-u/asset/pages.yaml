  md: "# Method Overloading\n\nIn Java, you can declare two or more methods with the\
    \ same name in the same class, provided their parameter declarations vary. This\
    \ process is known as overloading a method. Overloading is a technique which you\
    \ can use to implement polymorphism in your code. Before we take up overloaded\
    \ methods, we need to keep in mind the following rules:\n\n+   - You can change\
    \ the argument list of an overloaded method.\n- It is allowed to modify the overloaded\
    \ method return type\n- It is allowed to modify the overloaded method access modifier\n\
    - You can declare the new checked exceptions for the overloaded method.\n- You\
    \ can overload a method in the same class or in a subclass.\n\nYou must be able\
    \ to differentiate between an overloaded method and an overridden method. Here,\
    \ we primarily focus on the declaration and invocation of the overloaded method\
    \ and differentiate between overloading and overriding.\nWhen an overloaded method\
    \ is invoked, Java uses the number of arguments, or type of arguments in an argument\
    \ list to determine the method to be invoked. Therefore, the number of arguments\
    \ or type of arguments in an argument list must vary in the overloaded method.\
    \ Listing 36 shows how to overload the display() method within the same class\
    \ (you can find the MyOverload.java file in the Code/Chapter4 folder):\n\n**Listing\
    \ 36: Method Overloading within the Same Class**\n\n```\npackage com.mget;\npublic\
    \ class MyOverload {\n    public void display() {\n        System.out.println(\"\
    welcome to the world of overloading\");\n    }\n    //overloading display method\
    \ by changing argument type\n    public void display(String str) {\n        System.out.println(\"\
    welcome to the world of overloading \" + str);\n    }\n    //overloading display\
    \ method by changing the number of arguments\n    public void display(String a,\
    \ int b) {\n        System.out.println(\"welcome to the world of overloading \"\
    \ + a + \" \");\n        Number assigned is:\" + b);\n    }\n    public static\
    \ void main(String[] args) {\n        //Creating an instance of the MyOverload\
    \ class\n        MyOverload sub = new MyOverload();\n        //Invoking the display\
    \ method with no argument\n        sub.display();\n        //Invoking the display\
    \ method with String argument\n        sub.display(\"Deepika\");\n        //Invoking\
    \ the display method with String and integer argument\n        sub.display(\"\
    Deepika\", 100);\n    }\n}\n```"
