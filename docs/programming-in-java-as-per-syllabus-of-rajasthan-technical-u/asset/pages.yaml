    # Short Answer Questions


    Q1. Java API consists of many classes and interfaces, which are arranged in the
    form of packages according to their similar functionality. These are the built-packages
    of the Java API.


    Q2. List the packages in Java API.


    Ans. The packages available in Java API:


    +   - java.lang

    - java.io

    - java.util

    - java.net

    - java.awt

    - java.applet


    Q3. What are constants in interfaces?


    Ans. An interface can contain constants, which are defined by field definitions
    in the form of public, static or final members. They are initialized during interface
    declaration and by the classes implementing the interface.


    Q4. Explain the modifiers in brief?


    Ans. The members of a class have accessibility either in the same class or other
    classes. How and where the member of a class is accessed is determined by the
    access modifier. Following are the access modifiers:


    +   - The public access modifier: Specifies when a class is declared with the
    public access modifier, it can be accessed from anywhere in the program.

    - The protected access modifier: Specifies when a class is declared with the protected
    access modifier, it can be accessed from within the same class to which the methods
    and fields belong, within its subclasses, and within classes of the same package,
    but not from other packages.

    - The private access modifier: Specifies when you declare a method or field as
    private. It is not visible to subclasses and not inherited by subclasses.

    - The default access modifier: States that, if you do not specify any access modifier
    while declaring class, method, or field, then they are considered as default access
    modifier. Note that the class members remain visible to the associated class and
    subclasses within the same package.'
