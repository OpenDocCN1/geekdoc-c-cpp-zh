    # Short Answers


    +   Q1. List all the operators used in Java.

    Ans. The operators in Java are as follows:

    - Arithmetic

    - Relational

    - Boolean logical

    - Bitwise


    +   Q2. What are the rules which you must keep in mind to declare a legal identifier?

    Ans. An identifier is a symbolic name that refers to the name of variables, methods,
    classes, packages, or interfaces in a Java program. Legal identifiers are identifiers
    that conform to the rules that Java compiler uses to determine whether or not
    the name is legal. In Java, a legal identifier:

    - Must start with an underscore (_), a letter, or a dollar sign ($)

    - May consist of a letter, an underscore, and a dollar sign

    - Does not allow spaces in between an identifier

    - Cannot have a name that is similar to a Java reserved keyword

    - Are case-sensitive, that is word, Salary, and SALARY are three different identifiers


    +   Q3. What do you understand by operator precedence?

    Ans. In Java, each operator has an associated precedence that helps in determining
    how an expression is evaluated if more than one operator is used. The evaluation
    of an expression depends on the operator precedence. The operators, which are
    at the higher level of precedence are evaluated first and operators with the same
    precedence are evaluated from left to right or vice-versa.


    +   Q4. What is the instanceof operator?

    Ans. The instanceof operator is a binary operator that checks whether an object
    is of a particular type (here, type can be a class, interface, or an array). It
    is used for object reference variables only. The syntax to use the instanceof
    operator is:


    ```

    <objectReference> instanceof <xxx>

    ```'
