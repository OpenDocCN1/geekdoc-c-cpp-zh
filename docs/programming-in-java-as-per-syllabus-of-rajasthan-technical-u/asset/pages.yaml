    # Using Multi-dimensional Array


    So far, we have seen only one-dimensional arrays where only a single value can
    be allocated but there can be a case when values are needed to represent the elements
    of an array. In this case, multi-dimensional array can be used to represent the
    data.


    A multi-dimensional array is also known as array of arrays. The process to declare,
    create, initialize, and use a multi-dimensional array will be discussed in the
    following headings:


    +   Declaring a Multi-dimensional Array

    Creating a Multi-dimensional Array

    Initializing an Multi-dimensional Array

    Declaring an Uneven Multi-dimensional Array

    Developing a Program Using Multi-dimensional Array


    Now, let''s discuss these processes in the following sections.


    # Declaring a Multi-dimensional Array


    A multi-dimensional array is the first step to start working with a multi-dimensional
    array. The syntax to declare a multi-dimensional array is:


    ```

    data_type_var_name []][];

    ```


    In the preceding syntax:


    +   data_type is the data type of an array, which specifies the type of elements
    that will be stored in an array.

    var_name is the name of the array.

    [] is the first/left bracket pair, which represents the row numbers.

    [] is the second/right bracket pair, which represents the column numbers.'
