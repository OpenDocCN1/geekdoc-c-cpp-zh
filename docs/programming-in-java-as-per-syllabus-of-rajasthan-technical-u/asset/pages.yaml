  md: "# Chapter 4\n\nNow that you have a fairly good idea of the various forms of\
    \ inheritance in Java, let's move on and discuss how private, protected, and public\
    \ members of a superclass are inherited in a subclass.\n\n# 4.7 Working with Access\
    \ Modifiers in Inheritance\n\nThe behavior of inherited members change according\
    \ to the access modifiers used with them. In inheritance, the behavior of private,\
    \ protected and public members is different from one another. In the following\
    \ subsections, we describe the inheritance of the public, private, and protected\
    \ members of a superclass.\n\n+   * The public Access Modifier\nThe public access\
    \ modifier is the least restrictive of all the modifiers. In other words, a public\
    \ class member can be accessed within the class in which it is declared or within\
    \ its subclass. In addition, a public class member is accessible from any class\
    \ inside or outside the package it is declared. If the members of a superclass\
    \ are public, then they can be accessed from a subclass either inside or outside\
    \ the package.\nLet's consider the MyData subclass that contains a public member\
    \ radius, which is accessed from its subclass, CalArea. Listing 27 shows the public\
    \ member in the CalArea class (you can find the CalArea.java file on the CD in\
    \ the Code\\Chapter4 folder):\n* Listing 27: Showing the CalArea.java file\n\n\
    ```\nclass MyData {\n    public double radius;\n}\nclass CalArea extends MyData\
    \ {\n    public double calArea(double r) {\n        return 3.14*r*r;\n    }\n\
    \    public static void main(String[] args) {\n        CalArea num = new CalArea();\n\
    \        num.radius = 10;\n        double result = num.calArea(num.radius);\n\
    \        System.out.println(\"Area calculated:\" + +Result);\n    }\n}\n```\n\n\
    In Listing 27, the CalArea subclass inherits the public members of the MyData\
    \ superclass. The radius public member is initialized with a value 10 and passed\
    \ as an argument of the calArea() method. The successful execution of Listing\
    \ 27 indicates that you can access a public member of a superclass from a subclass.\
    \ Figure 29 shows the output when the CalArea class is executed."
