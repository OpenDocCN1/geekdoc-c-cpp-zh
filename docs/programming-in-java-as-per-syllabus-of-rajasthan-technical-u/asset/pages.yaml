  md: '# 342 Chapter 9


    +   Applets are used to send messages on Internet by using the getApplet() method
    of the AppContext interface.


    +   Applets can play sound files, by using the AudioClip interface of the java.applet
    package.


    To create an applet (a Java program), first you need to import the packages, such
    as java.applet, and java.awt, and extend the user class with the Applet class.
    The java.applet package provides the Applet class that is used to create an applet.
    The java.awt provides the Component class, which develops the User Interface (UI)
    components, such as button and checkbox. This Component class has the paint()
    method that allows to print a string in an applet.


    Let''s discuss the life cycle of an applet in the next section.


    # 9.4 Exploring Life Cycle of an Applet


    An applet executes within the Web browser or in an applet window. When an applet
    is executed, it goes through the four stages of its life cycle. These stages are
    as follows:


    +   Initialization of an applet that loads the applet first time into the memory


    +   The applet starts


    +   The applet stops


    +   The applet is unloaded or destroyed from the memory


    The life cycle of an applet is basically built on four methods of the Applet class.
    By calling these methods, a Web browser manages the life cycle of an applet. The
    following are methods that constitute the life cycle of an applet:


    +   The init() method: Loads the applet in the memory. The public void init()
    method is executed only once, when an applet is loaded for the first time. When
    the init() method is called, an applet is loaded in the memory and initializes
    all variables of this method.


    +   The start() method: Starts the execution of the applet. The public void start()
    method is called to start the applet activity. This method executes every time
    an applet is displayed on the screen. When a user minimizes a Web page to move
    to another page, the execution of the public void start() method is stopped, maximizing
    the Web page resumes execution of the method.


    +   The stop() method: Stops the execution of the applet.


    +   The destroy() method: Removes the applet from the computer.


    It is not necessary to use these methods when creating an applet, because applet
    container manages these methods. However, when you use these methods, ensure that
    they are used in a proper sequence as described.


    Moreover, the main() is not required to execute the applets. You can use the following
    options in Java to run the applets:


    +   appviewer: Allows to display an applet on the computer''s applet window.


    +   Web browser: Allows you to display an applet embedded in an HTML page. It
    can be any browser, as Internet Explorer or Mozilla, but should be Java-enabled.


    Let''s learn how to create applets in the next section.'
