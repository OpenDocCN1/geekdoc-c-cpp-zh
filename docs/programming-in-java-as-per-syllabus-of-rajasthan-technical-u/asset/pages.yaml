  md: '# 05 Implementing Packages and Interfaces


    # OBJECTIVES


    +   - Learn about the Access Modifiers

    - Explore the Packages in Java

    - Learn how to set the classpath

    - Learn how to import the Packages

    - Explore the Interfaces in Java


    A Java programmer, you may need to work on small projects, and intend to put all
    the Java files into a single directory, which is easy and fast. However, the same
    is not true with the bigger projects including large number of files; it would
    be difficult to place all these files into a single directory. In Java, you can
    solve this by creating packages. In a package, files are organized into different
    categories based on their functionality, usability, and category. In one package
    would have different functionalities than those of another. To avoid collision
    class in case one class has the same name as that of another. There are a number
    of packages available in Java, but in this chapter, we discuss only two types,
    `java.lang` and `java.util`. Java does not provide the facility of multiple inheritance.
    Instead, it provides the concept of interface that permits multiple interface
    implementation.


    In this chapter, you learn different types of access modifiers available in the
    Java programming language. Further, the chapter discusses about the packages of
    the Java programming language. The concept of classpath is also described in chapter.
    At the end of the chapter, you learn the interfaces and how it works in an application.


    Let''s learn the different types of access modifiers which are used in a Java
    program.


    # 5.1 Introducing the Access Modifiers in Java


    The members of a class has its accessibility in the same class or other classes.
    How and where a member of a class is determined by access modifier. In the Java
    programming language, `public`, `protected`, `private`, and `default` are the
    available access modifiers. You can use access modifiers with classes and methods
    to specify the accessibility of these programming elements in the program.


    The access modifiers available in Java are described as follows:'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 144 Chapter 5


    +   The public access modifier: Specifies that when a class member is declared
    with the public access modifier, it can be accessed from anywhere in the program.
    For example, you can access public classes, methods, and fields from everywhere.


    +   The protected access modifier: Specifies that when a class member is declared
    with the protected access modifier, it can be accessed from the same class to
    which the methods and fields belong, within its subclasses, and within classes
    of the same package, but not from other packages. The protected access modifier
    cannot be used with class declaration.


    +   The private access modifier: Specifies that when a method or field is declared
    as private, it is not visible within subclasses and not inherited by subclasses.
    You can access the private methods and fields only within the same class as which
    the methods and fields belong. The private access modifier works opposite to the
    public access modifier. The concept of encapsulation, in which data are hidden
    within the class and access methods is implemented using the private access modifier.


    +   The default access modifier: Indicates that, if you do not specify any access
    modifier while declaring class, method, or field, then they are considered default
    access modifier. The class, method or field with default access modifier can be
    accessed from the same package to which the class, method, or field belong. These
    are not accessible outside the package they belong to.


    In the next section, let''s learn how to work with packages in Java.


    # 5.2 Working with Packages


    A package is considered a directory or folder, which allows you to store various
    classes related to each other in an application. In Java, you cannot create two
    classes with the same name. This means that you have to assign a different name
    for every new class, which is a tedious task. In Java, you can solve this problem
    by creating packages. Let''s consider an example, which shows how packages resolve
    name collision problem. Suppose you have created some classes with the names,
    such as Pass and Detail in an application, so that the purpose of a class is identified
    by its name. Now, if you want to use the classes with the same names, then you
    have to create another application to do so. However in Java, to resolve name
    collision you can put the related classes in a package. Therefore, the Pass and
    Detail classes that you created in the example can be added to a package and you
    can use the same name to create other classes outside the package.


    # Defining Package


    Java Application Programming Interface (API) consists of many classes and interfaces,
    which are arranged in the form of packages according to their similar functionality.
    These are the built-in packages of Java API. After using these built-in packages,
    you can also create your own packages in an application.


    In Java, packages are divided into the following two categories:


    +   The built-in packages


    +   The user-defined packages


    Let''s discuss about each category of package in detail.'
