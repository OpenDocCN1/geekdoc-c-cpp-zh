  md: '# Implementing Threads in Java 289


    For example, consider a scenario of the railway reservation system, where two
    passengers are trying to reserve seats from Delhi to Mumbai in Rajdhani Express.
    Although the passengers are at different locations, they have access to the same
    railway reservation system. Now, let suppose that both passengers start their
    reservation process at 1 pm and observe that seats are available. The first passenger
    reserves these two seats and simultaneously the second passenger reserves one
    seat. The available numbers of seats were two and the number of seats reserved
    is three. Due to inconsistency in the asynchronous access to the railway reservation
    system, both passengers can be considered as two threads, and the reservation
    system can be as a single object, which is modified by these two threads asynchronously.


    This problem is known as the race condition, in which multiple threads access
    the same object and modify the object''s state inconsistently. The solution to
    this problem is to provide a mechanism, that if one thread is modifying an object''s
    state, the other thread does not have access to the same point of time. In other
    words, the modification of the state of an object must be synchronized and atomic.


    Synchronization in a Java program is done with the help of locks. Every object
    in the programming language has a default object lock, which can be used for synchronization.
    Threads gain access to a shared object of a program by first acquiring the lock
    associated with it. When a thread acquires the lock associated with an object,
    the other threads are prevented from acquiring the lock with the object at that
    point of time. This guarantees that only one thread modifies the state of the
    object at a time. The Object lock, also known as monitor, allows the thread to
    use the shared resources at a time. In java, the lock implements mutual exclusion.


    In a Java program, the access to the shared resources (objects) is synchronized
    by the lock mechanism. The rules that need to be followed when synchronizing shared
    resources are as:


    +   - A thread must acquire the lock associated with a shared object before it
    uses the shared object. The runtime system ensures that if a thread acquires lock
    on the shared object, it will not allow another thread to access the shared object.
    If a thread needs to access the shared resource at the same time, it is blocked
    and has wait until the resource becomes available.

    - When a thread completes its execution and finishes modifying the shared resource,
    the runtime system again ensures that the lock of the shared resource has been
    relinquished by the thread using the resource. The resource is then assigned to
    the waiting for it.

    - Methods or blocks can be synchronized, but not variables or classes.

    - Only one lock is associated with each object/shared resource.

    - In Java, you can synchronize code by using the following two ways:

    - Synchronized Methods

    - Synchronized Blocks


    Now, let''s discuss these in detail in the following subsections.'
