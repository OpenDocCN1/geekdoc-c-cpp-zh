  md: "# Chapter 3\n\nA nested for loop is the for loop within another loop. In case\
    \ of nested loop, execution starts from the outer for loop and the control passes\
    \ to the inner for loop. The inner loop continues to execute until the condition\
    \ evaluates to true. Once the loop is completed, the execution is passed to outer\
    \ loop for the next iteration and executes till the evaluation returns true. Let's\
    \ understand the use of nested loop with the help of an example shown in Listing\
    \ 10 (you can find the NestedLoopDemo.java file on the CD in the CodeChapter3):\n\
    \n+   Listing 10: Using nested loop statement\n\n```\nclass NestedLoopDemo {\n\
    \    public static void main(String[] args) {\n        int num1,num2;\n      \
    \  for(num2 = 0; num2 <= 3; num2++) {\n            for(num1 = 0; num1 <= 2; num1++)\
    \ {\n                System.out.println(num2 + \" \" + num1);\n            }\n\
    \        }\n    }\n}\n```\n\nIn Listing 10, executions begin with the outer for\
    \ loop in which num2 is initialized to 0. Now, the execution enters the inner\
    \ for loop where num1 is set to 0. The inner for loop continues to execute until\
    \ the condition becomes false. In this way, the inner loop is executed three times,\
    \ with num1 changing its value from 0 to 2.\n\nOnce the inner loop is completed,\
    \ the execution goes to the outer for loop and num2 is set to 1. This time, the\
    \ execution comes into the inner for loop and the statements following this loop\
    \ will execute again for three times. Again, the control goes back to the outer\
    \ for loop and num1 is set to 2. The outer loop executes till its value exceeds\
    \ 3. In this way, the outer loop executes for 4 times.\n\nIn Listing 10, for loop\
    \ is executed 4 times and the inner for loop is executed 3 times for each value\
    \ of num2 and hence loop is executed 12 times, as shown in Figure 10.\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_79_0.png)\n\
    \n> Figure 10: Output of the NestedLoop Demo Program"
