  md: '# Inheritance


    Inheritance is one of the OOP concepts by which a class acquires the properties
    of another class. A class that is inherited from another class is known as the
    subclass and the class from which the subclass is inherited is known as the superclass
    or the base class. The concept of inheritance supports hierarchical classification.
    Without inheritance, you need to define all the characteristics of each object
    explicitly. For example, a Tabby Cat is a type of Cat, which in turn, belongs
    to the Mammal class which comes under the larger class, Animal. Figure 2 shows
    the hierarchical tree of this example:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_17_0.png)


    ▲ Figure 2: Displaying the Hierarchical Tree Demonstrating Inheritance


    Now, let''s look at Figure 2 from the programming aspect. In Figure 2, the Animal
    class is a superclass and Mammal is the subclass extending or inheriting all the
    attributes of the superclass.


    In OOP, the inheritance concept facilitates reusability as we can append additional
    features in an existing class without modifying it by deriving a new class from
    the existing one. The subclass derived from the superclass contains the combined
    features of both the classes.


    # Polymorphism


    The term polymorphism comes from two Greek words, poly, meaning many, and morphs,
    meaning forms. Therefore, polymorphism means many forms. In OOP, polymorphism
    allows you to perform various operations using the same method. The behavior of
    an operation depends upon the type of data used in the operation.


    For example, let''s consider the operation of addition, which can be addition
    of two numbers or concatenation of two strings. In the first case, the operands
    are int, and in the other case, the operands are strings. The concept of using
    a single method name to perform different types of tasks is known as method overloading.
    Figure 3 displays the concept of polymorphism:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_17_1.png)


    ▲ Figure 3: Displaying Polymorphism'
