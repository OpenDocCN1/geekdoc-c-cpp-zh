  md: 'In Figure 3, the speed() method of the Vehicle class is used in different forms
    in the Bike, and Scooter classes. The objects of the respective class are passed
    as an argument to the speed() method. Moreover, it is important to note that polymorphism
    is extensively used in implementing inheritance.


    # Dynamic Binding


    The process of linking a method call to the executable code in response to the
    call is known as binding. The binding process initiated at runtime is called dynamic
    binding. This means that when a method is called, the method call is bound to
    the method body during the runtime of the program. The Java compiler is not aware
    of the method to be invoked during compilation; therefore, the JVM invokes the
    relevant method during runtime. Hence, this is also called runtime polymorphism
    or dynamic binding.


    # Message Passing


    +   Object-oriented program comprises a set of objects that communicate with each
    other. The following steps are involved in the programming of OOP:

    - Create classes that define objects and their behaviors

    - Create objects from class definitions

    - Establish communication among objects

    - One or more objects can communicate with one another by sending and receiving
    information. This process is similar to the way people pass messages to each other.
    A message for an object is a request for execution of a method. Then, the method
    is invoked which provides the desired result. Message passing involves specifying
    the name of the object, the name of the method, and the information to be sent.


    ```

    Car c;

    c.speed(c);

    ```


    In the preceding code snippet, the c instance of the Car class invokes the speed()
    method and c is passed as an argument.

    Now, let''s discuss the features of Java.


