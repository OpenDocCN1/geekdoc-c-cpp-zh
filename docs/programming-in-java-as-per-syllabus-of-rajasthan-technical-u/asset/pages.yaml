    # Using the FileWriter Class


    The FileWriter class is used to write a sequence of characters to a file. The
    write() method of the FileWriter writes a single character to the specified file,
    and the flush() method flushes the stream (a flow of data). Some buffering takes
    place whenever you write data or not. The flush() method guarantees that the data
    you write gets to file. The close() method of the FileWriter closes the stream
    after flushing. Invoking the write() or flush method after the stream is closed
    throws an exception, IOException, though a previously closed stream has no effect.


    The constructors are used to create an object of the FileWriter class:


    +   - FileWriter (File file): Helps in creating a FileWriter object with the specified
    File object

    - FileWriter (File file, boolean append): Helps in creating a FileWriter object
    if a File object and a boolean variable is given. This boolean variable helps
    in deciding whether to append the data written.

    - FileWriter (FileDescriptor fd): Helps in creating a FileWriter object if the
    file descriptor is specified or given.

    - FileWriter (String fileName): Helps in creating a FileWriter object if the file
    name is provided.

    - FileWriter (String fileName, boolean append): Helps in creating a FileWriter
    object if the file name and a boolean variable is given. This boolean variable
    helps in deciding whether to append the data written or not.


    Table 3 lists some common methods of the FileWriter class:


    | Table 3: Methods of the FileWriter Class |

    | Method | Description |

    | void write(int c) | Writes only one character |

    | void write(char[] buf, int off, int len) | Writes a part of an array that contains
    characters |

    | void write(String str, int off, int len) | Writes a part of a String |

    | void flush() | Flushes the stream |

    | void close() | Closes the stream |


