  md: '# Chapter 6


    # Table 1: Constructors of the String Class


    | Constructor | Description |

    | :--- | :--- |

    | String () | Constructs a String object with no value. For example, String str=
    new String(); |

    | String (String str) | Constructs and initializes a String object with the given
    string value. For example, String str=new String("Hello"); The str object now
    contains Hello. |

    | String (char charArr []) | Constructs and initializes a String object with the
    values of the given character array. For example, char item [] = {''C'', ''O'',
    ''P'', ''Y''}; String testString = new String(item); The testString object now
    contains the value stored in the character array name. |

    | String (char charArr startIndex, int count) | Constructs and initializes a String
    object with a part of a character array. For example, char inputArray[] = {''P'',''U'',''S'',''H'',''Y''};
    The testArr object now contains the value POP because the starting index is 4
    and the total number of characters to be copied is 3 |

    | String (byte byteArr []) | Constructs and initializes a String object with a
    part of an array having Standard Code for Information Interchange (ASCII) values.
    After constructing and initializing a String object, this constructor also decodes
    the array values according to the system''s default character set. |

    | String (byte byteArr [], int startIndex, int count) | Constructs and initializes
    a String object with a part of an array having ASCII values. This constructor
    also decodes ASCII values according to the system''s default character set.


    Apart from using a constructor to create and initialize a String object, you can
    use the following code snippet to create and initialize a String object:


    ```

    String str = "Hello";

    ```


    The preceding code snippet creates a String object, str and initializes it with
    the value, Hello. You can also assign the value of a String object into another
    String object. Consider the following code to assign value of a String object
    to another String object:


    ```

    String str1="Now";

    str2="Are";

    str1=str2; // now the str1 contains the value Are

    ```


