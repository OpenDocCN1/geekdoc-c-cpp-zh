  md: '# 288 Chapter 8


    The threads that are instantiated and used in a program have a definite life cycle
    and finally get determined at the end of their life cycle.


    +   * Thread Termination

    A thread moves to the dead state from either the runnable or running state. Moreover,
    a thread is said to be in the dead state when it finishes executing its run()
    method, which also implies that the thread is terminated. If any other thread
    or event does not interrupt a thread, it terminates normally. If a running thread
    is interrupted, it throws the InterruptedException exception and is terminated
    without moving into the dead state, it cannot make it even by invoking the start()
    method.

    When an attempt to use the start() method is made on a dead thread, the method
    throws the IllegalThreadStateException. In Java, the invocation of methods that
    are not allowed in a particular thread state throws an IllegalThreadStateException.

    With this, we can consider another important concept related to threads, which
    is, deadlock.


    +   * Deadlock

    When multiple threads are used in a program, they share resources. A particular
    resource is allocated to a thread that acquires the Object lock for that resource.
    Object locks are variables that are acquired by any thread from the runnable pool.
    Deadlock is a situation where two threads wait for the Object locks acquired by
    each other. The Object locks are not released by the respective threads before
    completing their execution. This situation, where threads are waiting for the
    Object lock, leads to a deadlock. Figure 9 shows a deadlock:


    ![](img/d3faa73f55d3d314bb5bfb277886900d_301_0.png)


    Figure 9: Showing the Deadlock Condition


    Figure 9 shows that the thread1 and thread2 are in a deadlock. The thread1 holds
    the lock for the R1 resource and waits for the R2 resource, which is acquired
    by the thread2 resource. At the same time, the thread2 waits for the lock of the
    R1 resource, which is held by the thread1. Therefore, both the threads keep waiting,
    leading to a deadlock. After understanding deadlock, let''s discuss about synchronization
    of threads.


    # 8.6 Implementing the Thread Synchronization Mechanism


    When multiple threads are used in a Java program, it is possible that more than
    one thread accesses the same instance of a class. When multiple threads try to
    modify the state of an object simultaneously without intimating the other threads,
    it leads to an inconsistency in the state of the object.'
