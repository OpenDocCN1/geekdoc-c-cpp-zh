  md: '# Implementing Threads in Java 283


    # Thread Scheduler


    A component of JVM decides the order in which threads are executed is called the
    thread scheduler. A system with a single processor, when executing a program,
    executes only a single thread at a particular point though the program may have
    multiple threads. This means that if there are multiple active threads, the resources
    are allocated only to the executing thread. The thread scheduler selects a thread
    for execution from the runnable pool and sends back the executing thread to the
    pool depending on the priority of the thread.


    In a Java program, you need not write explicit code to control the thread scheduler
    as it is the part of JVM. In most cases, the thread scheduler maps a thread of
    your program to the operating system of your machine. You cannot control the sequence
    of execution; rather, you can invoke methods of the Thread class to influence
    the thread scheduler. Now, let''s discuss the methods that can affect the activities
    of the thread scheduler.


    # Running and Yielding


    Sometimes, the runnable pool receives a thread of higher priority than the thread
    that is currently running. In such situations, the thread scheduler sends the
    currently running thread back to the runnable state and that that has the higher
    priority starts executing. You can invoke the static method, yield(), of the Thread
    class to send a running thread back to the runnable state, as shown in the following
    code snippet:


    ```

    yield()

    ```


    In the preceding code snippet, the yield() method is invoked by the Thread object.
    Invoking the yield() method by Thread object pauses the execution of the current
    thread and allows another thread of equal or higher priority to start its execution.
    Invoking the yield() method on a Thread object does not guarantee that the yield()
    method has been invoked for further execution. Moreover, the scheduler can select
    the thread on which the yield() method has been invoked. Moreover, invocation
    of the yield() method on a Thread object does not move to the waiting, sleeping,
    or blocking state; it sends the Thread object to the runnable state, which can
    be resumed to the running state later.


    In some situations, you need to deliberately make a thread sleep to make it release
    resources for a particular interval of time. Let''s discuss how to enforce a thread
    to the sleeping state.


    # Sleeping and Waking Up Threads


    Sometimes you need to make a thread sleep for a particular interval of time. For
    example, consider the scenario of the thread reservation system, however the reservation
    status must be updated frequently to know the current status. However, the status
