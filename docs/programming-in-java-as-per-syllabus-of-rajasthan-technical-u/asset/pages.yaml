    # # 9.7 Working with the Color Class


    The java.Color class is used to create new color, or use some predefined color
    constants, as red, green in an applet or a standalone application. Java allows
    us to create up to 24 different colors. Table 24 lists the fields of the Color
    class :


    | Table 24: Discussing the Fields of the Color Class |

    | static Color black | static Color blue | static Color cyan |

    | static Color darkGray | static Color gray | static Color green |

    | static Color lightGray | static Color magenta | static Color orange |

    | static Color pink | static Color red | static Color white |


    The fields provided in Table 24 are used to set a color or get the current color
    of an applet. Table 25 lists the constructors of the Color class:


    | Table 25: Describing the Constructors of the Color Class |

    | Constructor | Description |

    | Color(ColorSpace cspace, float[]) | Helps in creating a color in the color space
    of the given ColorSpace. |

