    language, which is not bound to any specific operating system. In other words,
    Java programs can be executed on any system. No other programming language, before
    the evolution of Java, was platform independent and therefore, it can be said
    that Java is a revolutionary technology. Apart from cross-platform in source form,
    Java is also platform-independent in binary form.


    +   - Distributed


