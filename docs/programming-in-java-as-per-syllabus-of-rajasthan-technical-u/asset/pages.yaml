  md: "Implementation of nested loops is shown in Figure 10. In Listing 10, a for\
    \ loop is used within another for loop. The outer for loop is first executed.\
    \ Variable for controlling the iteration for loop is num2, which is set to an\
    \ initial value of 0. The control soon goes to the inner loop where num1 is set\
