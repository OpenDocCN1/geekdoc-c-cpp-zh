    # 5.3 Working with Interfaces in Java


    An interface in Java is similar to an abstract class. Classes do not provide any
    method

    implementations and are therefore abstract by nature. An abstract class can define
    both

    abstract and non-abstract methods, but interfaces can have only methods.


    Java does not provide the facility of multiple inheritance (a subclass inheriting
    from

    more than one superclass). Instead, an interface permits multiple interface

    implementation. Interfaces are declared by using the interface keyword, and contain
    constant

    method declarations. Therefore, it is not possible to create an object of an interface.

    The implements keyword used to implement an interface in a class. The class that

    implements an interface is known as an implementation class. An implementation
    class is

    required to define all the methods of the interface that are implemented by the
    class.


    In the subsequent subsections, we define and implement an interface. We also discuss
    how tonuse reference variables of an interface, extend an interface from other
    interfaces, and access

    its variables.


    +   - Declaring Interfaces


    Declaring an interface is similar to declaring a class. the class keyword is used
    while

    declaring a class, and the interface keyword is used while declaring an interface.
    The

    syntax of an interface is shown in the following code snippet:'
