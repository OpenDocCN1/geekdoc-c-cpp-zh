    # 9.3 Getting an Overview of Applets


    An applet is a small Internet-based program that has the Graphical User Interface
    (GUI), written in the Java programming language. Applets are designed to run inside
    a Web browser or using the appletviewer to facilitate the user to animate the
    graphics, play sounds, and design the GUI components, such as text box, button,
    and radio button. An applet can be embedded into a webpage-much in the same way,
    an image can be embedded in a page. The page that contains an applet can be viewed
    by the Java enabled browser, so that the applet''s code is transferred from the
    source system to the user system and executed by the browser''s Java Virtual Machine
    (JVM).


    An applet is required to build dynamic and static Pages of a Web application.
    For example, a Web page displays the examination result published on Web site
    or the reservation status of an Airplane application. Applets are helpful in the
    following areas:


    +   - Applets can load data from a file that is specified with a relative Uniform
    Resource Locator (URL).

    - Applets display documents in Web browser. The AppletContext interface provides
    the showDocument() method to display documents in Web browser by using a specified
    URL.'
