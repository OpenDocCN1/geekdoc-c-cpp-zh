  md: '# 09 Working with GUI


    # OBJECTIVES


    +   - Learn about Abstract Window Toolkit (AWT)

    - Learn how to Use AWT Frames

    - Explore Applet and its Life Cycle

    - Learn about the Graphics Class

    - Learn about the Color Class


    Until now, you have studied the console-based Java programs. In today''s scenario,
    people prefer General User Interface (GUI) based applications in comparison to
    console-based applications as the former are a more interactive user interface.
    A GUI-based application is an application in which a user interacts through various
    components, such as text fields and buttons. Java provides Abstract Window Toolkit
    (AWT) and the Swing Application Programming Interface (API) to create interactive
    GUI-based applications. You can use the `java.awt` and `javax.swing` packages,
    which contain various classes, interfaces, and methods, to create GUI-based applications.
    You will explore important classes and interfaces of the awt package.


    In this chapter, you will learn about another type of Java programs that allow
    us to communicate with the world of the Web. Such programs are known as applet.
    An applet is an Internet-based program written in Java programming language, which
    any computer can download. It is usually embedded in an HTML page on a Web site
    and can be executed from a browser. Users are allowed to personalize an applet
    by it works as a menu, and using its various settings, and then you can select
    any option from this menu to load the responding page. The page contains an applet
    that can be written in Java classes, such as Internet Explorer. An applet can
    use various classes, such as Graphic, Font, and Color of the awt package, to perform
    various tasks, such as drawing rectangles and arcs, selecting fonts to write messages,
    and filling the color in rectangles. The `Graphics` class creates various shapes,
    such as lines and rectangles, in applets. The `Color` class fills or sets the
    colors into the shapes, and the `Font` class sets the fonts to write text in applets.


    Let''s start with learning about AWT in the next section.


    # 9.1 Introducing AWT


    AWT is a toolkit, which is provided by an API, that helps to create GUI-based
    (Windows) applications. The AWT API provides various classes, stored in the java.awt
    package, to create GUI components in the application. Using the java.awt package,
    you can create and display buttons, labels, check boxes, text fields, and other
    user interface components that you want to display in a Windows application. Table
    1 lists the noteworthy classes provided in the java.awt package that help you
    create a GUI-based application:'
  merge: -1
