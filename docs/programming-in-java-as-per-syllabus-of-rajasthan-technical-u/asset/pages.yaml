  md: '# Short Answer Questions


    Q1. What do you mean by OOP?


    Ans. OOP is a technique that permits you to implement famous programming dictum:
    "divide and conquer". The basic idea behind OOP is to encapsulate private data
    and methods into objects, making each object selfautonomous, and enclose the data
    and methods in a way that prevents them from cluttering the namespace.


    Q2. What do you mean by inheritance?


    Ans. Inheritance is one of the OOP principles by which a class acquires the properties
    of another class. Without inheritance, you need to describe all the characteristics
    of each object explicitly.


    Q3. What is the role of the JVM in Java?


    Ans. In each programming language, a compiler translates source code into machine
    code for a specific computer. In Java, a compiler translates the source code into
    an intermediate code as bytecode for a virtual machine, which is known as Java
    Virtual Machine (JVM). Bytecode is the machine language for JVM and not machine
    specific. Instead, the machine specific code is generated by the Java interpreter,
    which acts as a mediator between Java virtual machine and real machine.


    Q4. Explain method overloading.


    Ans. Method overloading is an object-oriented technique that allows us to define
    several versions of a method with the same name, but with a different parameter
    list. When you use an overloaded method, the Java compiler will know which one
    you mean by the number and/or types of the parameters you pass to the method,
    finding the version of the method with the right parameter list.


    Q5. Explain the concept of encapsulation in brief?


    Ans. Encapsulation is a mechanism that binds class members together and protects
    them from being accessed by the other classes. In Java, you can consider a class
    as an example of encapsulation, because a class binds data and code and hides
    its complexity from others.


    Q6. Discuss the role of abstraction in object programming?


    Ans. Abstraction is the process which helps in hiding data that is not required
    by a user. The concept of representing important features excluding the background
    details is known as the abstraction. An advantage of abstraction is that the user
    can work only with the required data and does not need to view undesirable data.


    Q7. List down the features of java?


    Ans. Java is a simple, robust, and platform independent programming language.
    It is designed to meet the real world requirements with the following features:


    +   - Simple


    +   - Secure


    +   - Robust


    +   - Multithreaded'
