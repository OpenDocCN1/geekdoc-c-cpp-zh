  md: '# Chapter 8


    Q7. What is a deadlock?

    Ans. When shared threads are used in a program, they share resources. A particular
    resource is allocated to a thread that acquires the Object lock for the resources
    from the runnable pool. A deadlock is a situation where two threads wait for the
    Object locks acquired by each other. The Object locks are not released by the
    respective threads before the completion of their execution. This situation, where
    the threads are waiting for the Object lock, leads to a deadlock.


    Q8. List the rules that you must follow when synchronizing shared resources.

    Ans. The following rules must be followed during the synchronization of shared
    resources.


    +   - A thread must acquire the object lock associated with a shared object before
    it uses the object. The execution process ensures that if a thread acquires the
    lock on the shared object, it will not allow another thread to access the shared
    object. If another thread needs to access the resource at the same time, it is
    blocked and has to wait until the resource becomes available.

    - When a thread completes the execution and finishes modifying the shared resource,
    the execution process ensures that the lock of the shared resource has been relinquished
    by the thread that was using the resource. The resource is then assigned to the
    thread waiting for it.

    - Methods or blocks can be synchronized, but not variable or classes.

    - Only one lock is associated with each object or shared resource.


    Q9. List the non- static methods of the object class?

    Ans. The non- static methods of the object class are as follows:


    +   - wait()method

    - notify()method


    Q10. List states of a thread.

    Ans. The different states of a thread are as follows:


    +   - The New State

    - The Runnable State

    - The Running State

    - The Waiting State

    - The Dead State'
