  md: "# Synchronized Methods\n\nIn a Java program, methods associated with an object\
    \ can be invoked by multiple threads. The methods that modify the state of the\
    \ object must be synchronized. You can synchronize a method by using the synchronized\
    \ keyword before the name of the method while defining the method. When a method\
    \ is synchronized, a thread needs to acquire the object lock to invoke the method.\
    \ If the object lock is not available, the calling thread is blocked and has to\
    \ wait until the lock becomes available. After a thread completes executing the\
    \ synchronized method, it releases the object lock and allows other threads waiting\
    \ for this lock to proceed.\n\nSynchronizing methods is important in situations\
    \ where the methods invoked by threads modify the state of an object. The concurrent\
    \ execution of such methods leaves the object in an inconsistent or a corrupt\
    \ state. Let's consider an example of stack implementation, which two threads\
    \ are used to insert and retrieve data to and from the stack. However, if the\
    \ insert and retrieve operations are performed on the same stack, then problems\
    \ may occur due to the inconsistent state of the stack. Listing 7 shows an example\
    \ of the implementation of unsynchronized method invocation (you can find the\
    \ UnsynchronizedDemo.java file on the CD/Chapter8B folder):\n\n+   Listing 7:\
    \ Showing the UnsynchronizedDemo.java File\n\n```\nclass DemoStack {\n    private\
    \ Object[] stck;\n    private int top;\n    public DemoStack(int capacity) {\n\
    \        stck = new Object[capacity];\n        top=-1;\n    }\n\n    public boolean\
    \ push(Object obj) {\n        if (top>stck.length-1) {\n            return false;\n\
    \        }\n        ++top;\n        try {\n            Thread.sleep(500);\n  \
    \      } catch (Exception E) { }\n        stck[top] = obj;\n        return true;\n\
    \    }\n\n    public Object pop() {\n        if (top<0) {\n            return\
    \ null;\n        }\n        Object obj = stck[top];\n        stck[top] = null;\n\
    \        try {\n            Thread.sleep(500);\n        } catch (Exception E)\
    \ { }\n        top--;\n        return obj;\n    }\n}\npublic class UnsynchronizedDemo\
    \ {\n    public static void main(String[] args[]) {\n        // ...\n    }\n}\n\
    ```"
