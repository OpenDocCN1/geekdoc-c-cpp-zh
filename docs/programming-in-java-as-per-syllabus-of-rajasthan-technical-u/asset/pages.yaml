  md: "# Chapter 4\n\nJava supports two types of methods: class methods and instance\
    \ methods. Instance methods are invoked on objects (objects are instances of class).\
    \ Class methods, on the other hand, are invoked on a class. Listing 7 shows the\
    \ code for the App class (you can find the App.java file on the Code:Chapter4\
    \ folder):\n\n+   Listing 7: Using the class Methods\n\n```\npublic class App\n\
    \  public static void main(String[] args) {\n    double value = 4;\n    double\
    \ sqrt = Math.sqrt(value);\n    System.out.println(\"The square root of \" + value\
    \ + \"=\" + sqrt);\n  }\n```\n\nIn Listing 7, the java.lang.Math class has a method\
    \ named sqrt that calculates a square root, where no object is needed and the\
    \ result is shown in Figure 7.\nFigure 7 shows the output when you run the preceding\
    \ code:\n\n![](img/d3faa73f55d3d314bb5bfb277886900d_107_0.png)\n\n# Declaring\
    \ Methods\n\nA class consists of attributes and methods. Methods can have any\
    \ name, such as disp and are considered functions that are used to perform some\
    \ specific tasks in an application. Depending on the requirement, many methods\
    \ can be created in a program. The syntax to create a method is follows:\n\n```\n\
    <return_type> <method_name> ([para_list])\n{\n  // body\n}\n```\n\nIn the preceding\
    \ syntax, return_type can be any data type depending on the type of values. If\
    \ the method is not returning, then the data type is replaced with void. A method\
    \ returns the value to call routine through the return statement. The method_name\
    \ is the name of the method and the para_list represents a list of parameters\
    \ that is passed in a method. It may happen that there is no need to use parameters\
    \ in a method. In that case, the para_list is not used and methods return a null\
    \ value. The body of the method is written within the curly braces."
