    - Declare Abstract Classes


    A Java program comprises Object Oriented Programming (OOP) components, such as
    classes, variables, and methods which are known as Java members. A Java class
    is a template to create Java programs consisting of variables (state) and methods
    (behavior). The variables are used to hold data items, whereas the methods are
    used to perform specific operations on those data items. Each object of a class
    has its own unique set of variables and methods. All these Java members are identified
    by a unique name, which is known as identifier in Java.


    Inheritance is one of the most important features of Object Oriented Programming
    (OOP). It facilitates the creation of a new class by extending a previously declared
    class. The class that is used to create a new class is called a base class, super
    or parent class, and the newly created class is called a subclass, child or derived
    class. The process of creating a derived class from a base class is called inheritance.


    In this chapter, you learn about classes and objects. The chapter also helps you
    to explore constructors in Java. Moreover, the chapter discusses inheritance and
    its forms, inheritance of public, private, default, and protected members of a
    subclass, final keyword, and super keyword. Towards the end of the chapter, you
    learn the concept of abstract class.


