  md: '# The Built-in packages


    Similar to other programming languages, Java also provides some built-in functionalities
    that you can use in your programs. These built-in functionalities are coded in
    the form of classes and interfaces. These classes and interfaces are grouped in
    packages according to their purposes. Table 1 lists the important packages available
    in Java API:


    Table 1: List of Built-in Packages available in Java API

    | Package Name | Description |

    |---|---|

    | java.lang | Includes important Classes, such as java.lang.Thread class. It is
    important to note that this package is allowed to be imported into each of the
    source files automatically. |

    | java.io | Includes classes to handle input and output streams, and strings.
    This package also includes classes to read and write data files. |

    | java.util | Includes a set of useful classes, such as collections. Classes are
    used to work with sets of objects. |

    | java.net | Contains the classes used to implement network applications. This
    package primarily provides classes for network support. |

    | java.awt | Contains all of the classes to create user interfaces and graphics
    paints, images, windows, dialog boxes, buttons, checkboxes, lists, menus, scrollbars,
    and text fields |

    | java.applet | Provides the classes necessary to create an applet and the classes
