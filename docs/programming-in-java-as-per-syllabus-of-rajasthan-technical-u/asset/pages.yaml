    \ loop executes 3 times with value of num2 set to 0 and that of num1 as 0, 1,\
    \ and 2 respectively in all the three executions.\n\nThe flow of execution is\
    \ passed back to the outer loop where the value of num2 is set to 1 after undergoing\
    \ increment. Again, the control is passed to the Inner loop and it will execute\
    \ for 3 times with the value of num2 set to 1 and that of num1 as 0, 1, and 2\
    \ respectively. The outer loop continues until the value of num2 exceeds 3 and\
    \ the condition becomes false. In that case, the outer loop continues to execute\
    \ as the value of num2 is equal to 3. Similar to the for loop, other loops can\
    \ also be nested.\n\nSo far, we have discussed control flow statements, such as\
    \ selection statements and iteration statements. In the next section, we discuss\
    \ another kind of control flow statements known as jump.\n\n# 3.3 Using Jump Statements\n\
    \nJump statements are the statements that transfer control from one part of the\
    \ program to another. The jump statements supported by Java are as follows:\n\n\
    +   - break\n- continue\n- return\n\nLet's discuss the types of jump statements\
    \ in detail in the following sections.\n\n# Using break Statement\n\nOne of the\
    \ important purposes of break statement is to exit from switch statement. At times,\
    \ we need to break out of a loop before the whole thing gets executed. The break\
    \ statement allows us to get out of a loop before it is completely executed. This\
    \ statement is written in the form of a break keyword followed by a semicolon.\
    \ Let's understand the use of break statement with the example shown in Listing\
    \ 11 (you can find the BreakDemo.java file in the CD in Chapter3 folder):\n\n\
    +   ▶ Listing 11: Using break Statement\n\n```\nclass BreakDemo {\n    public\
    \ static void main(String[] args) {\n        int i = 0;\n        while (true)\
    \ // loop will execute infinitely {\n            i+=2;\n            if (i > 10)\
    \ {\n                break; // when the condition becomes true break\n       \
    \         will get execute\n            }\n        }\n    }\n}\n```"
