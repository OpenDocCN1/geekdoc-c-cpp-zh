  md: "# Implementing Threads in Java 293\n\nIn the preceding code snippet, only the\
    \ second print statement is synchronized, instead of the entire display()method.\n\
    Synchronizing blocks allow threads to have more than one lock for code synchronization\
    \ within a single object. If a thread acquires an object lock to execute a synchronized\
    \ block, then other threads are blocked to wait for the object lock that is relinquished\
    \ by the currently executing thread after it finishes its execution. You should\
    \ remember the following points while blocking threads:\n\n+   - In a program,\
    \ threads calling static methods in the same class can block each other.\n- Threads\
    \ that wait to call non-synchronized methods can block each other in this case\
    \ as they invoke the methods with the help of the same instance.\n- A non-synchronized\
    \ method and a synchronized method cannot block each other as a non-static method\
    \ locks an instance of the class, whereas static methods lock the class itself.\n\
    - In of a synchronized block, threads that synchronize the same object can block\
    \ each other, whereas threads that synchronize different instances cannot block\
    \ each other.\nNow let's discuss about implementing thread interaction in detail.\n\
    \n# 8.7 Implementing Thread Interaction\n\nMultiple threads in a program are capable\
    \ of interacting with each other and sharing certain information, as their state\
    \ and locking status. For example, a thread in the waiting state continuously\
    \ checks whether a lock for a synchronized method is available or not, which causes\
    \ unnecessary wastage of time and resources. When the current thread releases\
    \ the shared resources, it can notify the threads about the status of the lock.\
    \ Threads can interact with each other by using the following methods provided\
    \ by the Object class.\n\n+   - wait()\n- notify()\n- notifyAll()\n\nThese methods\
    \ must be invoked from a synchronized context, that is, from a synchronized method\
    \ or block. A thread can invoke the wait() and notify() methods using an object\
    \ only when it has acquired the lock for the object. If the thread invoking the\
    \ method does not acquire the lock, it throws the IllegalMonitorStateException\
    \ exception. As it throws an, consider the following code snippet, which shows\
    \ the implementation of the wait() and notify() methods:\n\n```\nclass MyThread\
    \ extends Thread {\n    public void run() {\n        synchronized(this) {\n  \
    \          notify();\n        }\n    }\n```"
