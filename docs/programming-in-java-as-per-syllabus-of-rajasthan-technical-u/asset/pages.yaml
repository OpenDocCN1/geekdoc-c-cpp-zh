  md: '# Introduction


    Congratulations on buying the Programming in Java! This book endorses our continued
    commitment towards delivering quality IT books based on intensive research on
    the requirements of our readers. The book is the result of rich implementation
    of instructional acumen and technical proficiency of the authors and editors at
    Kogent Learning Solutions Inc. and Dreamtech Press, and promises to offer an affluent
    solution to students and professionals who want to master the Java Platform Standard
    Edition (Java SE). This book further extends our philosophy of providing comprehensive
    and easily understandable reference material on Web and enterprise technologies.
    The book has been written for the diverse audience of the Java technology, and
    promises an exceptional learning experience by presenting relevant, appropriate,
    and real-life examples. In addition, the book also includes code snippets and
    executable applications to demonstrate the concepts related to Java.


    We have designed this book to grow with you, providing the reference material
    you need as you move towards software proficiency. Java is no ordinary technology;
    it inspires devotion, passion, exaltation, eccentricity-not to mention exasperation
    and frustration! Many companies use Java to build applications that are platform
    independent, reliable, secure, and scalable. The IT market has witnessed major
    corporations shifting from C++ to Java for in-house programming. The influence
    of Java is spreading fast, and there is no stopping or looking back! We hope that
    your learning experience with this book will prove to be irresistible to you as
    it has proved to us while authoring and editing the book.


    # About this Book


    Programming in Java extends the approach of providing comprehensive reference
    material on new IT technologies. The book goes beyond simple descriptions on features
    and code examples to ensure that it caters to the every-day real-life challenges
    confronted by developers. The range of topics and coverage offered by this book
    is a superior mix of description about concepts related to Java, with all relevant
    details and practical examples to implement them. Empowered with exclusive details
    and precision, the book promises to provide you with all the required knowledge
    and functional skill sets to work with Java.


    This book promises to increase your productivity by its presentation of Java application
    creation and execution process on Java Development Kit (JDK) 1.6, which has been
    used to run applications. Enriched with the extensive coverage and easy to understand
    examples, this book will serve to be an almost indispensable resource for any
    Java developer.

    In brief, it will serve as both a reference book as well as a tutorial to acquire
    the required expertise on the Java concepts.'
