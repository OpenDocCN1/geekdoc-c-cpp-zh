    \ Constructors\n\nThe constructors are known as parameterized constructors. In\
    \ parameterized constructors, the instance variable is initialized automatically\
    \ at run time according to the values passed to parameters during the object creation.\
    \ Parameterized constructor allow us to initialize the instance with different\
    \ values; whereas, in case of default constructor, the value remains the same\
    \ for all objects. For example of default constructor, we have to initialize the\
    \ instance variables with some fixed value and that value remains the same for\
    \ all the objects of the class. In case of parameterized constructor, we do not\
    \ initialize the instance variable with some fixed values; rather we use parameters\
    \ to initialize variables. Parameters in parameterized constructor receive the\
    \ value passed during object creation and use parameterized constructor. Listing\
    \ 5 shows how to create and use parameterized constructor (you can find the ParamConstructorDemo.java\
    \ file CD in the Code\\Chapter4 folder):\n\n+   Listing 5: Creating Parameterized\
    \ Constructor\n\n```\nclass ParamConstructorDemo{\n    int x, y;\n    ParamConstructorDemo(int\
    \ a, int b) // parameterized constructor\n        x=a;\n        y=b;\n    }\n\
    \    public void mul() // method to calculate the product of two numbers\n   \
    \     int m=x*y;\n        System.out.println(\"Value after multiplication of two\
    \ numbers is=\" + m);\n    }\n    public static void main(String[] args){\n  \
    \      ParamConstructorDemo chk = new ParamConstructorDemo(12, 5);\n        ParamConstructorDemo\
    \ chk1 = new ParamConstructorDemo(15, 5);\n        //invoking mul method\n   \
