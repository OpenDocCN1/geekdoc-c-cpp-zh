    They are used to handle I/O operations on characters. To use the character stream
    classes, you have to import the java.io package in your Java program. The two
    main classes of character stream are Reader and Writer. These classes support
    the Unicode character set, which is a 16-bit character set designed to support
    world''s many languages such as Chinese and Russian. Besides these two classes,
    character stream includes many other classes. Table 10 lists the various classes
    of the character stream.


