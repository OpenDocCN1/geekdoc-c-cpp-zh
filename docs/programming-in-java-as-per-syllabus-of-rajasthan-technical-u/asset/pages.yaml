    # Using the try and catch Block


    The try block in a Java program is used to enclose a statement that may lead to
    an exception. A try block must be followed by a catch block. The catch block acts
    as an exception handler and contains the object of the specified exception class,
    which handles the raised exception. The code within the catch block is executed
    when the exception handler is invoked by the Java runtime system. Figure 6 shows
    the flow structure of handling exceptions using the try-catch construct.


    ![](img/d3faa73f55d3d314bb5bfb277886900d_230_0.png)


    ▲ Figure 6: Showing the Flow Structure of the try-catch Construct


    Figure 6 shows the process of using the try-catch construct in exception handling.
    When a program is executed, its methods are checked for errors and if any error
    is encountered, its corresponding exception handler techniques are searched. If
    no exception handling technique is found, the program abruptly terminates. However,
    if the exception handling technique is found then the code written in the catch
    block is executed. The following code snippet represents the basic working structure
    of the try-catch construct:'
