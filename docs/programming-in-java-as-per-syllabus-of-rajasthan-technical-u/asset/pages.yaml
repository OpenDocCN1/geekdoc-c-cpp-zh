    | --- | --- |

    | Reader | Signifies an abstract class, which is used to read character input
    stream. The most commonly used method of this class is the read() method that
    reads a single character at a time.

    | Writer | Represents an abstract class, which is used to write character output
    stream. The most commonly used methods of this class are the write(int n) method
    that writes a single character at a time and the write(String str) that writes
    a complete string to the output stream.

