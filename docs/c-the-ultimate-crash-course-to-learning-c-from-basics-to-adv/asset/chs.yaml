  \ `y`，类型是 `double`。\n\n赋值语句将特定值赋予变量 `y`。在示例中，`y` 被赋值为 `20.5` 的值。\n\n输出语句只需打印特定项或变量的值。上面的示例输出将为\
  \ `20`。\n\n![](img/00007.jpeg)\n\n变量的声明和赋值也可以同时进行；这被称为初始化。重要的是记住，初始化变量的唯一时刻是在定义它时。\n\
