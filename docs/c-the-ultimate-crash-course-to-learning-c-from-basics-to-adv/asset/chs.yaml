- "# C++：学习 C++ 的终极快速课程（从基础到高级）（指南、C 编程、HTML、Javascript、编程、全部、互联网、编码、CSS、Java、PHP\
  \ 书籍 2）\n\n\n\n![](img/00102.jpeg)\n\n\n\n# 引言\n\n如果你正在阅读这本书，意味着你正在主动学习 `C++`。`C++`\
  \ 由 Bjarne Stroustrup 于 1979 年首次开发。它是一种通用且高效的编程语言，具有不可替代性。\n\n`C++` 是 `C` 编程语言的扩展。Bjarne\
  \ 对 `SIMULA` 语言及其面向对象模型的知识帮助他为 `C` 创建了类扩展。它最初被名为 `C with Classes`，后来更命名为 `C++`。\n\
  \n`C++` 具有多种特性。这些特性包括：\n\n- `C++` 是高效的。\n- `C++` 是一种静态编程语言。\n- `C++` 是一种面向对象的语言：对象的使用允许通过类和对象将较大的程序划分为较小的子集。\n\
  - `C++` 是多范式的：这让开发者能够自由选择想要使用的编程风格。共有 7 种不同的风格供选择。\n- `C++` 利用标准库：这意味着 `C++` 能够通过利用库项来扩展其语言的功能。\n\
  \n学习 `C++` 可以让你的简历提升到一个新的水平。它仍然用于许多主流应用程序、游戏、浏览器等更多领域。人们不断地开发和扩展 `C++` 的功能。像 `Github`\
  \ 这样的开源平台拥有成千上万个 `C++` 仓库。随着 `C++` 的增长，开发者机会也在增长。在这些职位中，平均薪资达到 100,000 美元，每月有数千个职位招聘广告。虽然这本书是一个完美的起点，但不要期望一夜就能学会\
  \ `C++`。这门语言需要实践和坚持。如果你在疑惑，不需要在掌握 `C++` 之前了解 `C`。请将以下章节和练习作为你旅程的路线图，知识在等着你。\n\n\
  # 第 1 章 – 开始 C++\n\n![topt-blog-image-148596944883-7529aa20bf60d8bb95e63c50d96](img/00001.jpeg)\n\
  \n在开始进行 `C++` 开发之前，你必须先设置一个允许你高效工作的环境。话虽如此，你需要一种运行和编译 `C++` 程序的方法。这可以通过多种方式实现。这些方法包括：\n\
  \n1. **在线**：在网上运行和编译程序是避免过量下载软件的简单方法。这也是快速运行程序时的一个很好的选择。有很多网站可以实现这一点。`Ideone.com`\
  \ 就是很好的选择。\n2. **Mac OS X**：可以使用 `Xcode` 程序在 MAC 操作系统上运行。可以从苹果开发者页面下载。建议使用最新版本。\n\
  3. **Linux**：为了在 Linux 上高效运行程序，你需要安装一个编译器。`GCC` 是推荐初学者或在该操作系统上新编程的用户使用的编译器。你还需要下载一个文本编辑器，例如\
  \ `Gedit`。\n4. **Windows**：由于 Windows 是一个标准且广泛的平台，有几个选项可用。这些包括 `CodeBlocks`、`JGrasp`\
  \ 或 `Eclipse`。\n\n为了更好地理解 `C++` 程序的结构，将使用 `Hello World` 作为模板。`Hello World` 程序通常用于各种编程语言的入门。\n\
  \n![](img/00002.jpeg)\n\n程序的第一行用于在程序中包含头文件。这允许我们使用其中包含的操作。需要 `std` 命名空间以便准确引用各种操作，而无需在每个\
  \ `cout` 语句前面编写 `std`。这一行基本上是指使用标准命名空间。\n\n![2ebbc66df182280fa0b086fb319cd](img/00003.jpeg)\n\
  \n第三行简单指的是这是你程序的 `main` 函数。程序的体位于括号内部。`cout` 语句只需打印引号内的项或在某些情况下打印变量名。这取决于 `cout`\
  \ 语句中列出的内容。括号之前的最后一行很重要，因为它本质上关闭了或终止了程序的 `main` 函数。\n\n如果你熟悉其他编程语言，很容易理解所有程序都只是为计算机执行的一系列有序的指令或命令。这些指令由语句组成。语句是编程语言的最小单元，相当于英语语言中的句子。在\
  \ `C++` 中，使用分号来完成一个语句，而不是句号。变量的概念也是广泛存在且在编程时被频繁使用的。变量是赋予内存中某个空间的名称，可以根据程序的指令进行更改。\n\
  \n变量可以有多种类型。这些类型指示了特定变量中可以存储什么。变量类型包括：\n\n- 整数 (`int`)：这种变量类型只存储没有小数的单体整数。例如 `5`\
  \ 或 `4509`。它们必须至少有 16 位长。例如 `7854` 或 `34`。\n- 字符 (`char`)：这种类型指的是单个字符，如 ‘a’，且至少有\
  \ 8 位长。\n- `float`：存储浮点值，如 `3.1555`。通常为 32 位长。\n- `double`：与 `float` 类似但精度加倍。通常为\
  \ 64 位长。\n- 布尔值 (`bool`)：存储真/假值。\n- `void`：不能直接存储数据，作用类似于占位符。\n\n![10321_0ea1_7](img/00004.jpeg)\n\
  \n![](img/00005.jpeg)\n\n## 使用变量\n\n变量是程序非常基础的一部分。它们可以使用字母数字命名法，但必须以字母开头。变量用于程序中的各种语句。\n\
