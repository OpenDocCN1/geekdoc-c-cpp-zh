  \n## 使用修饰符与限定符\n\n修饰符也可以用于各种类型。修饰符可以表示数字符号或提供关于变量的更详细信息。修饰符用于字符、整数和任何 `double` 类型。修饰符用于将变量操作到精确场景。数据类型修饰符包括：\n\
