  \   a) 指针\n   b) 条件\n   c) 循环\n\n# 第 5 章 – 指针\n\n指针让某些复杂任务变得简单，而且它们非常容易使用。指针被定义为存储变量地址的变量。与变量一样，指针在使用之前必须先定义。`type\
  \ *var-name;`\n\n使用指针时，类型取决于它所指向的类型。例如，如果我的指针指向一个 double，那么我的指针必须是 double。`var-name`\
  \ 是你指针的名称。必须使用星号来表示指针。\n\n`int *int_point;` // 指向整数的指针\n`double *dou_point;` //\
  \ 指向 double 的指针\n`float *flo_point; // 指向 float 的指针\n`char *ch_point; // 指向字符的指针\n\
  \n以下示例展示了指针中存储的信息，运行以下代码以更好地理解指针。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main () {\n  int variable = 10; // 实际变量\n  int *ipointer; // 指针变量\n\
  \  cout << \"Value of variable: \";\n  cout << variable << endl; // 指针可用地址的值\n \
  \ cout << \"Value of ipointer: \";\n  cout << *ipointer << endl;\n  return 0;\n\
  }\n```\n\n## 空指针\n\n赋值为 `NULL` 的指针被称为空指针。空指针在声明时赋值。它通常持有值为 0。\n\n## 指针运算\n\n由于指针持有的是数值，它们也具有执行基本算术的能力。在某些程序中，开发者可能会选择使用指针而不是数组。这在一定是因为指针可以递增，而数组在没有循环帮助的情况下不能。\n\
  \n以下程序展示了如何成功地增加变量指针以访问数组的每个元素：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nconst int MAX = 4;\nint main () {\n  int var[MAX] = {10, 100, 200, 300};\n\
  \  int *ptr; // 让指针持有数组地址\n  ptr = var;\n  for (int j = 0; j < MAX; j++) {\n   \
  \ cout << *ptr << endl;\n    ptr++;\n  }\n  return 0;\n}\n```\n\n指针持有数值，它们也可以递减。运行以下代码展示指针如何递增：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main\
  \ () {\n  int var[MAX] = {10, 100, 200, 300};\n  int *ptr;\n  ptr = var;\n  for\
  \ (int j = 0; j < MAX; j++) {\n    cout << \"Value of var[\" << j << \"]: \";\n\
  \    cout << *ptr << endl;\n    ptr++;\n  }\n  return 0;\n}\n```\n\n除了递增，指针还可以使用关系运算符进行比较。这包括\
  \ `==`、`<` 和 `>`。\n\n# 第 6 章 – 函数\n\n函数是为了完成特定任务而编写的有用代码段。当它们一起使用时可以创建更整洁的程序。函数的基本结构如下。请注意，原型是声明函数的另一种方式。\n\
  \n`返回值 名称 (数据类型变量, 数据类型变量...)`\n\n- **返回值**：返回值指的是函数执行完成后返回的内容。例如，如果我创建一个计算学生平均年龄的程序，我会使用\
  \ `int`，因为我不需要小数位。因此，截断是可以接受的。我的返回值类型应该是 `int`。\n- **名称**：这是函数的名称。在相同的示例中，我可以将此函数命名为\
  \ `average_age`\n- **数据类型**：数据类型简单指的是变量。这些是函数可以用来使用的项。它可以是一个，也可以是多个。\n\n函数的开头看起来如下所示：\n\
  `int average_age(int x, int y)`\n\n原型的位置如下所示所示：\n\n```cpp\n#include <iostream>\n\
  int average_age (int x, int y);\nint main() {\n  //主程序\n  return 0;\n}\n\nint average_age\
  \ (int x, int y) // 注意这里没有分号\n{\n  // 函数将写在这里\n}\n```\n\n运行以下程序作为示例以观察函数是如何工作的。以下程序中的函数用于相两个变量并返回它们的和。\n\
  \n// 完整的工作程序\n```cpp\n#include <iostream>\ndouble summation (int a, int b); // 原型\n\
  int main() {\n  int x, y;\n  int c;\n  cin >> x; // 用户输入 x 的值\n  cin >> y; // 用户输入\
  \ y 的值\n  c = summation(x,y); // 调用函数 summation 并传递你读取的变量\n  cout << \"The sum of\
  \ the 2 numbers is \" << c << endl;\n  return 0;\n}\n```\n\n\n\n\n\n```cpp\ndouble\
  \ summation (int a, int b) //定义函数\n{\n    double z;\n    //'a' 存储 'x' 的值，'b' 存储\
  \ 'y' 的值\n    z = a+b;\n    return z; //将 'z' 的值返回给 main 函数中的变量 'c'\n}\n```\n\n\
  除了返回数字或变量的函数外，还有不返回任何内容的。这些是空函数。\n\n```cpp\nvoid sum (int x)\n```\n\n这仅仅意味着像最后所示的那样没有返回值。\n\
