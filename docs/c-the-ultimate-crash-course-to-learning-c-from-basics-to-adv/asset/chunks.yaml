    \ From the given options, which of the following options shows the correct way\
    \ to initialize values in an array?\n   a) `sample_array [5] = (5,3,4,2,7);`\n\
    \   b) `sample_array [5] = {5;3;4;2;7};`\n   c) `sample_array [5] = {5,3,4,2,7};`\n\
    \n7. Refer to question 6. What is the value in the space located at `this_array\
    \ [3]`?\n   a) The value is 7\n   b) The value is 3\n   c) The value is 4\n\n\
    8. Is there a way for an entire array be printed out all at once?\n   a) yes\n\
    \   b) no\n\n9. What must be used when attempting to print out or assign items\
    \ in an array?\n   a) pointers\n   b) conditions\n   c) loops\n\n# Chapter 5 –\
    \ Pointers\n\nPointer make certain complex tasks easier and they are fairly simple\
    \ to use. A pointer is defined as a variable that holds the address of another\
    \ variable. Much like a variable, before its use it must be defined. `type *var-name;`\n\
    \nWhen using a pointer, the type is whatever the type is. For example, if my pointer\
    \ is pointing to a double, my pointer must be a double. The `var-name` is the\
    \ name of your pointer. The asterisk must be used in order to denote a pointer.\n\
    \n`int *int_point;` // pointer to integer\n`double *dou_point;` // pointer to\
    \ double\n`float *flo_point;` // pointer to float\n`char *ch_point;` // pointer\
    \ to character\n\nThe following example shows the information which is stored\
    \ in pointer, run the following code to get a better understanding of pointers.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n  int variable\
    \ = 10; // actual variable.\n  int *ipointer; // pointer variable\n  cout << \"\
    Value of variable: \";\n  cout << variable << endl; // access the value at the\
    \ address available in pointer\n  cout << \"Value of ipointer: \";\n  cout <<\
    \ *ipointer << endl;\n  return 0;\n}\n```\n\n## Null Pointers\n\nA pointer that\
    \ is assigned to `NULL` is referred to as a null pointer. A null pointer is assigned\
    \ at the time of declaration. It generally holds a value of zero.\n\n## Pointer\
    \ Math\n\nBeing that pointers hold values for numbers, they also have the ability\
    \ to perform basic arithmetic. In some programs the developer may choose to use\
    \ a pointer instead of an array. This is in part because pointers can be incremented\
