    \ (i=5; i=10; i++)\n\n5.  What type of loop will execute at least once?\n\nPractice\
    \ Question Solutions:\n\n1.  bye\n\n    bye\n\nbye\n\n2.  hi\n\n    hi\n\n   \
    \ hi\n\n    bye\n\n3.  This code will not print anything because y is equal to\
    \ zero and it can therefore never be less than zero.\n\n4.  C.\n\n5.  A do while\
    \ loop will execute at least once.\n\n## Break & Continue Statements\n\nThe break\
    \ and continue statements alter the usual flow of a program.  A break statement\
    \ concludes a loop and a switch statement, which will be covered later, immediately\
    \ when it appears. \n\nA break statement works with while, do while and for loops. \
    \ The image below shows how a break operates in each loop type.\n\n![](images/00029.jpeg)\n\
    \nThe continue statement is used to skip certain conditions within a loop.  This\
    \ statement is used within a condition statement.  The diagram below illustrates\
    \ how a continue statement operates.\n\n![](images/00030.jpeg)\n\nRun the following\
    \ program to see how a continue statement operates in code.\n\n#include <iostream>\n\
    \nusing namespace std;\n\nint main()\n\n{\n\n    for (int j = 1; j <= 10; ++j)\n\
    \n    {\n\n        if ( j == 6 || j == 9)\n\n        {\n\n            continue;\n\
    \n        }\n\n        cout << j << \"\\t\";\n\n    }\n\n    return 0;\n\n}\n\n\
    ## Switch Statements\n\nSwitch statements are used when multiple if else statements\
    \ are needed.  Switch statements usually execute faster than multiple nested if\
    \ statements.  They are also easier to comprehend and program. \n\nThe syntax\
    \ of a switch statement is as follows:\n\nswitch (n)\n\n{\n\n    case constant1:\n\
    \n        // code to be executed if n is equal to constant1;\n\n        break;\n\
    \n    case constant2:\n\n        // code to be executed if n is equal to constant2;\n\
    \n        break;\n\n    default:\n\n        // code to be executed if n doesn't\
    \ match any constant             \n\n}\n\n![](images/00031.jpeg)\n\nThe above\
    \ syntax and diagram show that when a case constant is located which matches n,\
    \ the program’s control passes to the associated case block. A block of code will\
    \ be implemented until the program reaches the break statement or it is the end\
    \ of a block.\n\n## Practice with Switch Statements\n\nUse these questions to\
    \ practice with switch statements and their uses.\n\n1.  Write a program that\
    \ determines a student’s letter grade based on their numerical grade.  The program\
