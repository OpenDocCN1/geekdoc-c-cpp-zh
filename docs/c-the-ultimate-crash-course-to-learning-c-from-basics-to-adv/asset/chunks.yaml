    在 C++14 出现之前，并不支持如 `11111101` 这样的二进制字面量。为了使用它们，需要将它们转换为支持的类型。下面的代码段展示了如何在编程中使用它们。


    ![](img/00097.jpeg)


    二进制字面量以 `0b` 或 `0B` 开头。该前缀之后跟着一系列 0 和 1。类似的语法在许多其他编程语言中也可以找到。这些编程语言包括 `Java`、`Perl`
    和 `Python`，它们都已提供对二进制字面量的支持。


    二进制字面量的类型为 `int`。它可以在所有接受常量字面量的地方使用。


    ## 变量模板


    变量模板的设计目的是为了使编码变得更简单，并简化常量的定义和使用。变量模板本质上是一组变量的定义。


    变量模板是通过声明变量的地方使用模板声明创建的。


    ![C-4-562x309-OPx](img/00098.jpeg)


    这些仅仅是 C++14 引入的一些特性。虽然引入了许多其他特性，但并不是强有力的进展。C++14 包含的一些小特性包括带尺寸的位置（sized deal locations）和一些语法清理。尽管
    C++14 的版本更新与 C++11 的重大更新相比，但它是必要的。


    ## 结论


    恭喜你，通过学习和应用每一章列出的内容，你已经到达这本书的末尾！记住，这只是一个开始。为了真正精通 C++，你必须不断学习并应用你所学的。既然你已经开启了
    C++ 之之旅，保持警惕是十分重要的。


    C++ 是一种通用语言，可以处理各种大型系统，也可以处理较小的系统。在创建商业应用时，它是一种主流语言。有大量使用 C++ 编写的项目，包括：


    * 像 `Linux` 和 `Mac OS X` 等操作系统

    * 如《魔兽世界》和《暗黑破坏》系列的游戏

    * 流行的 `Wii`、`PlayStation` & `XBOX` 游戏

    * 编程语言的虚拟机（这些语言包括 `Python`、`Java`、`Rudy`、`PFP`、`Perl`）

    * 流行软件如 `MS Office`、`Adobe Photoshop`、`Inventor` 和 `AutoCAD`

    * Web 浏览器（`Chrome`、`Internet Explorer` 和 `Firefox`）

    * 许多 `Apple iOS` 应用


    这个列表证明了 C++ 是一种能够做任何事情的通用语言。


    如果你想知道 C++ 在明天或 10 年后是否仍然适用，答案是肯定的！


    C++ 结合其前身 `C` 提供了对硬件的访问和高层次的抽象。它是仅次于 `C` 的第三常用语言（`Java` 则位居第一）。目前，还没有竞争对手可以取代
    C++。


    C++ 速度快，能够有效高效地利用资源。大多数高质量的嵌入式应用程序是用 `C` 和 `C++` 创建的。


    C++ 最初于 1985 年 10 月实现商业化。C++ 在其整个生命周期内不断演进，并遵循一套独特的规则。这些规则包括以下。这些规则摘自 `Bjarne
    Stroustrup` 写的 *Evolving a language in and for the real world: C++ 1991-2006*。


    ### 通用规则


    * C++ 的演进必须由真实的问题驱动。

    * 不要陷入对完美的盲目追求中。

    * C++ 现在必须是实用的。

    * 每个特性都必须有合理且显见的实现。

    * 始终提供过渡路径。

    * C++ 是一种语言，而不是一个完整的系统。

    * 为每种支持的风格提供支持。


    ### 设计支持规则


    * 支持良好的设计理念。

    * 为程序组织提供便利。

    * 言之有物。

    * 所有功能都必须是可以负担得起的。

    * 允许一个实用的功能比防止所有的误用更重要。

    * 支持从单独开发的部件组合成软件。


    ### 语言技术规则


    * 不得隐式地违反静态类型系统。

    * 为用户定义类型提供与内置类型一样优异的支持。

    * 局部性是好的。

    * 避免顺序依赖。

    * 如果有疑问，选择最容易教学的特性变体。

    * 语法很重要（往往以扭曲的方式）。

    * 应该消除预处理器的使用。


    ### 低级编程支持规则


    * 使用传统的（笨陋的）链接器。

    * 不要与 `C` 产生无故的不兼容性。

    * 在 C++ 之下不要留给更低级语言的空间（汇编除外）。

    * 你不使用的无需付费（零开销规则）。

    * 如果有疑问，提供手动控制的方法。


    总的来说，人们使用 C++ 有许多理由。简单来说，C++ 是：


    * **灵活** —— C++ 是灵活的，因为它没有强制使用某种编程语言的限制。它可以毫不费力地用于各种应用领域。

    * **高效** —— 支配 C++ 的基本概念反映了日常计算机的概念。

    * **可用** —— 在所有计算机上通常都有可用的 `C` 编译器。还有其他工具和其他资源，使得开发者不需要从头开始编写。

    * **可移植** —— 移植使用 C++ 项目相当简单且通常可行。


    你已经学习了 `C++11` 和 `C++14` 之间的区别，以及它们提供的功能。然而，你的知识并不止于此。


    为了在高效地使用 `C++11` 和 `C++14` 进行编程时充分获得动力，你必须坚持下去。这涉及持续且一致地学习、阅读和应用这些内容。很快你就能精通 `C++17`。虽然它尚未发布，但向前展望并为即将到来的做好准备是重要的。


    ![Без标题](img/00099.jpeg)


    非常感谢购买这本书！


    我希望你会喜欢阅读它。如果你想帮助我制作更多材料，请在 Amazon 上留下好评。


    这确实会产生影响！


