  trans: "\n\n```cpp\nint d = 33;\n```\n\n在上面的示例中，`c` 和 `d` 都是左值（l-values）：\n\n```cpp\n\
    c = d;\nd = c;\nc = c * d;\n```\n\n在上述项中，`c * d` 是一个右值（rvalue）。\n\n```cpp\nint\
    \ e = c * d;\n```\n\n这条语句是正确的，因为右值位于赋值的右侧。\n\n```cpp\nc * d = 47;\n```\n\n这条语句是不允许的，因为右值位于赋值的左侧。\n\
    \n![codeish-v1-0-lightblue](img/00060.jpeg)\n\n引入这些右值引用（rvalue references）的原因是移动语义（move\
    \ semantics）。移动无法与对象的拷贝进行直接比较。在移动过程中，目标对象从源对象内部获取资源。这本质上使得源对象失去了任何资源或处于“空”状态。当不需要拷贝或拷贝开销可能时，通常使用移动操作。\n\
    \n为了充分发挥移动语义的潜力（包括利用性能提升），应该考虑字符串交换（string swapping）。\n\n一个非常基础的实现类似于下例所示：\n\n\
    ```cpp\nvoid basicswap(string &b, string & c){\n    string temporary = b;\n  \
    \  b=c;\n    c= temporary;\n}\n```\n\n上面的示例可以归类为基础或天真，因为这种实现被认为是开销巨大的。字符串的拷贝意味着必须分配原始内存。这意味着字符需要从源移动到目标。而当字符串被移动时，数据成员只是被简单地交换了。这在不分配内存、不删除内存且不拷贝字符的情况下完成。\n\
    \n![Top-10-IDE’s-For-C_C-Copy](img/00061.jpeg)\n\n右值引用的行为与普通引用相似。然而，右值引用有几个例外。\n\
    \n除了解决移动语义问题外，它还试图解决完美转发（perfect forwarding）。完美转发允许开发者编写构造函数或函数，并将参数作为右值或左值进行转发。\n\
    \n以下代码展示了字符串的移动，它仅仅交换了两个数据成员。这种做法没有分配或删除内存，也没有拷贝字符数组。\n\n```cpp\nvoid moveswap(string&\
    \ blank, string & full){\n    //pseudo code\n    size_t sz=blank.size();\n   \
    \ const char *p= blank.data();\n    //将 full 的资源移动到 blank\n    empty.setsize(full.size());\n\
    \    empty.setdata(full.data());\n    //full 变为 blank\n    full.setsize(sz);\n\
    \    full.setdata(p);\n}\n```\n\n在实现支持移动的类时，可以声明移动构造函数和赋值运算符。这类似于下面：\n\n```cpp\n\
    class Ablemove\n{\n    Ablemove (Ablemove &&); // 移动构造函数\n    Ablemove && operator=(\
    \ Ablemove &&); // 移动赋值运算符\n};\n```\n\n需要注意的是，C++11 标准库大量利用了移动语义。因此，大量的算法和容器现在都经过移动优化。\n\
    \n## C++11 标准库\n\n![terminal](img/00062.jpeg)\n\n技术报告 1（Technical Report 1）首次在\
    \ C++03 中引入。随着该库的实现，C++ 经历了重大的重构。它包含了各种新的容器类以及用于正则表达式、函数包装器等组件的新库。随着 C++11 的到来，技术报告\
    \ 1 正式并标准。这带来了许多新库。\n\nC++11 为 C++ 语言引入了许多新库，包括：\n\n* 正则表达式库\n* 线程库\n* 原子操作库\n\
    * 容器库中的各种特性\n\n## 线程库\n\nC++11 的一个显著新增是增加了并发（concurrency），即同时执行多条指令。C++11 现在为开发者提供了一个\
    \ `thread` 类，代表一个执行线程。这被称为承诺（promises）和未来（futures）。这些对象主要用于并发环境中的同步。\n\n使用新的线程功能非常简单，将在下面的示例中演示。只需简单地添加线程头文件即可：\n\
    \n```cpp\n#include <thread>\n```\n\n下面的示例仅利用了“Hello World”，这是编程教程中最基础的内容。\n\n\
    ![](img/00063.jpeg)\n\n在你的机器上运行上述代码。C++11 还允许在线程中使用参数。我们有能力添加任意数量的参数。以下代码已修改为使用参数的形式，并展示了给定的输出。\n\
    \n![](img/00064.jpeg)\n\n![](img/00065.jpeg)\n\n你可能会注意到某些结果是困惑或混乱的。这是因为所有线程恰好在竞争同一个资源。该资源是\
    \ `stdout`。\n\n可以通过互斥锁（mutexes）或屏障（barriers）来避免这些混乱的结果。这些屏障允许开发者组织线程共享特定资源。\n\n\
    ## 新智能指针类\n\n![c-2-min1](img/00066.jpeg)\n\n如果你不知道，智能指针目前定义在内存头文件的 `std` 命名空间中。它们是\
    \ RAII 的要素。RAII 代表资源获取初始化（Resource Acquisition Initialization），确保资源获取与对象初始化的同时发生。\n\
    \n之前的 C++ 版本（如 C++98）有一个智能指针类。该类是 `auto_ptr`，现在已被废弃。C++11 带来了两个新的智能指针类，分别是 `shared_ptr`\
    \ 和 `unique_ptr`。这两个新组件都与标准库的其他组件兼容。因此，指针可以存储在标准容器中并使用标准算法处理。\n\n![prog_langs](img/00067.jpeg)\n\
    \n以下定义取自 MDSN.com，并准确解释了这些组件。\n\n### unique_ptr\n\n`unique_ptr` 的底层指针只允许一个所有者。除非你确定需要\
    \ `shared_ptr`，否则应作为默认选择。它可以移动到新的所有者，但不能拷贝或共享。对比 `boost::scoped_ptr`。支持右值引用以便从\
    \ STL 集合中快速插入和提取。头文件：`<memory>`。\n\n下面的图说明了所有权如何在两个 `unique_ptr` 之间转移。\n\n![Moving\
    \ the ownership of a unique_ptr](img/00068.jpeg)\n\n示例演示了如何在代码中传递和创建 `unique_ptr`\
    \ 实例。\n\n![](img/00069.jpeg)\n\n### shared_ptr\n\n这种指针类型是引用智能指针。`shared_ptr` 用于多个指针需要拥有同一个原始指针的情况。例如，当你从容器返回指针副本但想保留原始指针时。当所有\
    \ `shared_ptr` 所有者离开作用域或放弃所有权时，原始指针可以被删除。它的大小为两个指针；对象使用其中一个指针，而共享控制块中的引用计数使用另一个。头文件：`<memory>`。\n\
    \n下图显示一个内存位置有多个指向它的 `shared pointers`。\n\n![Shared pointer](img/00070.jpeg)\n\n\
    下面的代码示例说明了 `shared_ptr` 实例的声明和初始化。一旦分配了对象，这些实例将获得该对象的所有权。\n\n![](img/00071.jpeg)\n\
    \n共享指针还可以被传递给其他函数。可以通过以下方式实现：\n\n* 按值传递\n* 按引用传递\n\n"
- fmt: "\n*   Passed to the underlying object\n\n## New C++ Algorithms\n\nC++11 also\
    \ introduces a variety of new algorithms. 8 algorithms to be exact. These new\
    \ algorithms include:\n\n* `all_of()`\n* `any_of()`\n* `none_of()`\n* `is_sorted()`\n\
    * `is_sorted_until()`\n* `is_partitioned()`\n* `is_permutation()`\n* `minmax_element()`\n\
    \n### All_of, any_of, none_of Algorithms\n\nThese three algorithms are very similar.\
    \ They essentially check if the unary predicate returns true for none, all or\
    \ some.\n\n![](images/00072.jpeg)\n\n### is_sorted()\n\nThis algorithm essentially\
    \ checks to see if the elements within a specific range are sorted in ascending\
    \ order. The elements within this range are compared using `operator<`. They are\
    \ also compared using `comp`, the binary comparison function.\n\nAn example of\
    \ it’s usage can be found below, along with its given output.\n\n![](images/00073.jpeg)\n\
    ![](images/00074.jpeg)\n\n### Is_sorted_until()\n\nThis algorithm is similar to\
    \ the `is_sorted()` algorithm. It performs the same function by checking if a\
    \ set of elements are sorted in ascending order however this algorithm returns\
    \ an iterator. This iterator is to the upper bound which is of the largest sub\
    \ range. This range is sorted of course. The following provides an example of\
    \ a program using `is_sorted_until()` and its given output.\n\n![](images/00075.jpeg)\n\
    ![](images/00076.jpeg)\n\n### Is_partitioned()\n\nThis algorithm does exactly\
    \ what you would think based on its name. It checks to see if a range is partitioned.\
    \ This means, it checks to see if a range is sorted according to a given unary\
    \ predicate. All elements which do not satisfy the given predicate must be returned\
    \ after those which do.\n\nThe following program is an example of how to use the\
    \ `is_partitioned()` algorithm.\n\n![](images/00077.jpeg)\n\n### Minmax_element()\n\
    \nThe `minmax_element()` algorithm finds the minimum and maximum number within\
    \ a given range. Once it is successfully ran, it returns a pair of iterators for\
    \ the corresponding elements. Three things we must remember about this algorithm\
    \ include:\n\n* When a given, range has no values or is otherwise empty, the algorithm\
    \ will simply return `std::make_pair(first, first)`.\n* If there are multiple\
    \ minimums within a given set of values it will simply return the first one.\n\
    * If there are multiple maximums within a given set of values it will simply return\
    \ the last one.\n\nThe function can be seen in action within the following code,\
    \ with its given output:\n\n![](images/00078.jpeg)\n![](images/00079.jpeg)\n\n\
    ### Is_permutation ()\n\nThis algorithm is used to determine if one range of elements\
    \ is permutated from a different elements range. An example of `is_permutation`\
    \ in action can be found below.\n\n![](images/00080.jpeg)\n\nOverall there are\
    \ a number of changes which were incorporated C++11. So many changes to the point\
    \ that some consider it almost a different language. You will need time to adjust\
    \ to the changes. Don’t expect to understand them all over night. C++14 brought\
    \ about great revisions to many of the things introduced in C++11. The next chapter\
    \ will focus on providing those components and examples of them.\n\n# Chapter\
    \ 10 – The New Versions: C++ 14\n\nC++ 14 was released in December of 2014. It\
    \ was often coined “C++1y” up until it’s release. C++14 added a plethora of updates\
    \ to the core language. In many instances C++14 builds upon functionality which\
    \ was added within C++11. Overall it is a much daintier version with less impact\
    \ on users.\n\n![grade-28199_960_720](images/00081.jpeg)\n\n## Return Type Deduction\n\
    \nC++11 brought about the onset of lambda expressions and allowed them to determine\
    \ the return type based on the expression. This newer version gave this ability\
    \ to all functions. The use of `auto` is needed in order to determine the return\
    \ type.\n\n![](images/00082.jpeg)\n\n## Relaxed Restrictions constexpr\n\n![cpp_lesson1](images/00083.jpeg)\n\
    \nC++11 also brought about the notion of `constexpr`- declared function. This\
    \ is essentially a function which can be execute at the time of compile. In C++11\
    \ a `constexpr` function could only have one expression.\n\nC++14 decreased the\
    \ amount of restrictions which were present in version 11. These functions are\
    \ now able to include the following:\n\n* All declarations except `thread_local`\
    \ or `static` variable types or any declarations without initialization\n* Conditions\
    \ including `if` statements and `switches`\n* Any loop statements including `for`\
    \ or `while`\n\nThe use of `goto` statements has been forbidden in this version\
    \ of C++.\n\n## Number Separators\n\nC++14 now gives users the option of using\
    \ digit separators. This is simply a single quote used in numeric literals. This\
    \ includes integers and floating integers.\n\nThe feature is anything but earth\
    \ shattering however it is useful for the reading of numbers. The separator will\
    \ not change the evaluation of the number and holds no particular coding advantage\
