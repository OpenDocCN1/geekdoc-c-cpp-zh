    \ 接收什么类型的数据？\n    a) `double`\n    b) `char`\n    c) `int`\n\n7. 如所示 `double summation\
    \ (double a, double b)`，从 main 程序调用该函数的正确方式是什么？\n    a) `summation (a)`\n    b)\
    \ `summation (a,b)`\n    c) `summation (b)`\n\n8. 如果在函数内部声明了一个变量，这是哪种变量？\n   \
    \ a) 全局变量\n    b) 局部变量\n    c) 扩展变量\n\n9. 如果有一个函数 `double go (double b)`，我们可以在主程序中向它发送不同的变量，还是必须是\
    \ `b`？例如 `go (x)`\n    a) 是\n    b) 否\n\n# 第 7 章 – 类与对象\n\nC++ 的主要功能之一是在 C 语言中引入面向对象。由于由于，类是\
    \ C++ 程序涉及特征之一。这些有时被称为用户定义类型。\n\n## 为什么要使用类？\n\n使用类是为了详细描述对象的结构。它们用于操作对象。\n\n\
    ## C++ 定义\n\n实际上，类是一个大纲。它是对象的蓝图。以下是类的示例：\n\n```cpp\nclass Person {\npublic:\n\
    \    double weight;\n    double height;\n    int age;\n};\n```\n\n上面的信息仅仅是对象的的基本概述。有几个概念需要深入研究。\n\
    \n## 定义 C++ 对象\n\n由于类被认为是蓝图，因此创建了对象。\n\n```cpp\nPerson Person1;\nPerson Person2;\n\
    ```\n\n`Person1` 和 `Person2` 拥有它们的数据。\n\n## 访问数据成员\n\n/images/0003..)\n\n类型的数据可以简单地使用访问运算符。\n\
    \n## 成员函数\n\n成员函数对类对象进行操作。它是类定义内部的函数。在类定义之外，成员函数也可以使用作用域运算符 `::` 分别定义。这相当于内联声明函数。\n\
    \n上面的示例如下所示。\n\n/images/00036.jpeg\n\n## 类成员修饰符\n\npublic、private 和 protected\
    \ 对类体内的各种类成员提供了访问限制。这些关键字可以称为指定符。类有能力拥有多个不同访问级别的块。\n\n/images/0038.jpeg\n\n##\
    \ 构造函数与析构函数\n\n构造函数是类的一个函数，每当创建新对象时都会实现。它们与类名相同，但没有返回类型或 void。下面的示例显示了如何使用构造函数。\n\
    \n/images/00039.jpeg\n\n虽然构造函数通常没有参数，但它仍然具有这种能力。这有助于你在创建对象时赋值。带参数的构造函数的示例如下所示。\n\
    \n/images/00040.jpeg\n\n析构函数在对象离开作用域时执行。当 delete 表达式应用于对象指针时，也会执行。\n\n析构函数与类名相同，但以波浪号\
    \ `~` 为缀。它不能返回或接收参数。在释放资源时非常有用。以下是析构函数的示例。\n\n/images/00041.jpeg\n\n## 友元函数\n\n"
- fmt: "\nA friend function is defined outside of the scope of the class, however,\
    \ it is able access all private and protected members. Member functions can not\
    \ be friend functions. In order to declare a function as a friend, the function\
    \ must be preceded by the keyword `friend`. The example below shows how friend\
    \ functions are used.\n\n![](images/00042.jpeg)\n\n## Static Class Members\n\n\
    Static class members are defined using the keyword `static`. This means that no\
    \ matter how many object may exist there is only one copy of the static class\
    \ member.\n\nThe following example shows how static class members are used.\n\n\
    A static member function may be called even when no objects of the class exist.\
    \ It is important to remember that static functions are accessed by simply using\
    \ the class name and the scope resolution operator `::`. A static member function\
    \ is only able to access a static data member, static member functions and any\
    \ other functions from outside the class.\n\nStatic data members, static member\
    \ functions and any other functions from outside the class can be accessed by\
    \ a static member function. It can also be used to determine if objects have not\
    \ been created or if they have. \n\nThe following is an example of using static\
    \ function members.\n\n![AAEAAQAAAAAAAAkKAAAAJDZlZDJhYzJiLWJiYzAtNDIwZS05OTE2LTE5YWZlOGQxMjY3Nw](images/00043.jpeg)\n\
    \n![](images/00044.jpeg)\n\n![](images/00045.jpeg)\n\n## Basic Practice Problems\n\
    \n1. Write a program using classes that takes in a name and age from a user and\
    \ prints that information on screen to the user. Your class should contain the\
    \ name and age of the person.\n\n2. Assuming that a class is inherited publicly,\
    \ which of the listed statements is correct?\n    A) Public members of the base\
    \ class would stay as protected members of derived class.\n    B) Private members\
    \ of the derived class become private members of derived class.\n    C) Private\
    \ members of the base class become protected members of derived class.\n    D)\
    \ Public members of the base class become public members of derived class.\n\n\
    3. Which of the following is the default access type for classes in C++.\n   \
    \ A) Private\n    B) Public\n    C) Static\n    D) Binding\n\n4. An instance of\
    \ a class is also known as _____?\n    A) Function\n    B) class\n    C) object\n\
    \n## Practice Problem Solutions\n\n1. /* Creating Basic Classes in C++ */\n\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\n// Class -------------------\n\
    class person\n{\npublic:\n//Varibale Declaration\n  string name;\n  int age;\n\
    };\n\n//----------------------\n//Main Function\nint main()\n{\n    person info;\n\
    \    //Get Input Values For Object Varibales\n    cout<<\"Enter the Name :\";\n\
    \    cin>>info.name;\n    cout<<\"Enter the Age :\";\n    cin>>info.age;\n   \
    \ //Show the Output\n    cout << info.name << \": \" << info.age << endl;\n  \
    \  return 0;\n}\n```\n\n2. Assuming that a class is inherited publicly, which\
    \ of the listed statements is correct?\n    A) Public members of the base class\
    \ would stay as protected members of derived class.\n    B) Private members of\
    \ the derived class become private members of derived class.\n    C) Private members\
    \ of the base class become protected members of derived class.\n    D) Public\
    \ members of the base class become public members of derived class.\n\n3. Which\
    \ of the following is the default access type for classes in C++.\n    A) Private\n\
    \    B) Public\n    C) Static\n    D) Binding\n\n4. An instance of a class is\
    \ also known as _____?\n    A) Function\n    B) class\n    C) object\n\n# Chapter\
    \ 8 – Inheritance\n\nObject Oriented programming languages which C++ is, is modeled\
    \ around objects instead of actions. OOO has 7 major components. \n\n![768340_bd19_2](images/00046.jpeg)\n\
    \nThese components include:\n* Abstraction– This refers to the hiding of details\
    \ related to a feature but showing the essential features.\n* Encapsulation– This\
    \ is the binding of functions with variables.\n* Inheritance– It allows for the\
    \ reuse of code without being written over and over. This also allows for classes\
    \ to inherit information from a base class.\n* Polymorhphism– This allows for\
    \ the creation of functions which contain the same name but utilize a variety\
    \ of arguments. Even though these functions have similar naming conventions the\
    \ behave differently.\n\nThis chapter will focus on inheritance and using inheritance\
    \ in C++. Inheritance makes your code cleaner and easier to understand.\n\n##\
    \ Derived Classes\n\nA class has the ability to be derived from multiple classes.\
    \ This means that it can inherit functions and data from various base classes.\n\
    \nA class derivation list is used to define a derived class. It names one or multiple\
    \ base classes. The form of a derivation list is shown below.\n\n```cpp\nclass\
    \ derived-class: access-specifier base-class\n```\n\n## Access Control and Inheritance\n\
    \nA derived class has the ability to access all non private base class members\
    \ meaning that the base class members should not be accessible to the functions\
    \ of a derived class.\n\nThe different access types are shown below according\
    \ to who can access them and in what specific way.\n\n| Access | Public | protected\
    \ | private |\n| :--- | :--- | :--- | :--- |\n| Same class | Yes | yes | yes |\n\
    | Derived classes | Yes | yes | No |\n| Outside classes | Yes | no | No |\n\n\
    ## Type of Inheritance\n\nWhen a class is being derived from a base class, the\
    \ base class can be inherited in 3 different ways. It can be done through either\
    \ public, protected or private inheritance. The inheritance type is determined\
    \ by the access- specifier, which was covered in the previous section.\n\nThe\
    \ most commonly used inheritance is public. Private and protected are rarely used\
    \ but are still useful to know. The following rules should be utilized when using\
    \ varying types of inheritance. \n\n* Public Inheritance: When using public inheritance,\
    \ the key is to remember that everything that is cognizant of the base and the\
    \ child will also be aware that the child inherits the base.\n* Protected Inheritance:\
    \ When you are using protected inheritance one must remember that only the child\
    \ and its children are aware that they inherit from the base.\n* Private Inheritance:\
    \ When utilizing private inheritance, it is more closed off. No one other than\
    \ the child is aware of the inheritance.\n\n## Multiple Inheritances\n\nIn C++\
    \ a class has the ability to inherit members from multiple classes. The syntax\
    \ is as follows.\n\n```cpp\nclass derived-class: access baseA, access baseB\n\
    ```\n\nIn the given syntax, access would be one of the following: public, protected\
    \ or private. The access would be assumed for every one of the base classes.\n\
    \n# Chapter 9 – The New Versions: C++ 11\n\nThe first iteration in C++ occurred\
    \ roughly in 1998. Although there was a long wait for it, C++ 11 was approved\
    \ in August 2011, 13 years after the first iteration. It has been said that although\
    \ version 11 is an improvement if the same language, it feels brand new.\n\n![633832_b4e7_2](images/00047.jpeg)C++11\
    \ is capable of supporting a number of new functionalities which include the following:\n\
    * Lambda expressions\n* Delegating constructors\n* Deleted & defaulted function\
    \ declarations\n* Null pointers\n* Rvalue references\n* Renovation of the C++\
    \ standards library\n    * New algorithms\n    * New container classes\n    *\
    \ Type traits\n    * Atomic operations\n    * Multithreading library\n\nWithin\
    \ this chapter, you will learn more about core functionality and things in C++11\
    \ operate.\n\n## Lambda Expressions\n\n![1-aOJJilDvkpP0GOlV9-Vw1g](images/00048.jpeg)Lambda\
    \ expressions can be defined as large or small blocks of executable statements,\
