    \nAs a refresher, within the context of C, an lvalue is an expression that can\
    \ on the right or left side of a given assignment. An rvalue, as the name implies\
    \ can be seen only on the right side of the assignment. Some examples of lvalues\
    \ are listed.\n\n```cpp\nint c = 47;\n```\n"
  raw: "The highlighted statement begins with the lambda introducer, [].  The statement\
    \ between the {} serves as the function to be executed, similar to a normal function. \
