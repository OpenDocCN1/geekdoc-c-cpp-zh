    \ arr+12, 1, factorial);\n\ncout<<\"12!=\"<<res<<endl; //\n\nIn the example above\
    \ the factorial closure multiplies the current element’s value for every iteration\
    \ and the value that has been accumulated. The result will be the factorial of\
