    \ or equal             6 <= 10 TRUE\n\n==     equal to                       \
    \ 6 == 6 TRUE\n\n!=     not equal to                   7 != 3  TRUE\n\n`&&` AND\n\
    `||` OR\n`!` NOT\n\n## Using `if` Statements\n\nIn order to fully understand `if`\
    \ statements within C++ you must first understand how they function.\n\nThe structure\
    \ of an `if` statement is as follows:\n\n```cpp\nif (TRUE)\n{\nPerform the next\
    \ statement\n}\n\nif (TRUE)\n{\n    Perform this block of statements if True\n\
    }\nelse\n{\n    Perform this block of statement if False\n}\n```\n\nIn the first\
    \ example, if the given expression is true, the statement will implement. However,\
    \ in the second statement, if the statement is true, the statement will execute\
    \ but if the statement is false, the `else` statement will execute.\n\n![633832_b4e7_2](images/00019.jpeg)\n\
    \n![](images/00020.jpeg)The following program will demonstrate how `if` statements\
