    \ & ) = delete;\n\nNoCopy ( const NoCopy & ) = delete;\n\n};\n\nNoCopy a;\n\n\
    NoCopy b(a); //compilation error, copy ctor is deleted\n\n## Nullptr\n\n ![prg-banner-201309](images/00057.jpeg)\n\
    \nSince the inception of the C language, 0 has served as not only a null pointer\
