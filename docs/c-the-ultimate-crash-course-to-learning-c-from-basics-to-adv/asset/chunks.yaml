    \ncase(3):\n\nif  (grade <  80)\n\ngrade =  'C';\n\nbreak;\n\ncase(4):\n\nif \
    \ (grade <  90)\n\ngrade =  'B';\n\nbreak;\n\ndefault: grade =  'A';\n\n2.  C.\
    \ Break\n\n3.  No, switches cannot have conditions\n\n4.  This is wrong because\
    \ a case cannot have a condition.\n\n5.  Nothing is wrong with this statement.\n\
    \n6.  False.\n\n# Chapter 4 – Working with Arrays\n\nArrays are extremely useful\
    \ for not only storing data under a single variable name but also for storing\
    \ elements in an ordered list format.  They are ultimately used to organize large\
    \ amounts of data and information.  When attempting to iterate through an array\
    \ loops are a highly useful tool for assigning values and for printing them out.\n\
    \n![dynamic](images/00032.jpeg)\n\nIn a situation where you have multiple variable\
    \ like the one listed below, it would be easier to simply use an array.  The information\
    \ below simply shows the ages of 5 different people.\n\nint Person1=15;\n\nint\
    \ Person2=24;\n\nint Person3=54;\n\nint Person4=33;\n\nint Person5=120;\n\nInstead\
    \ of declaring each person as a different variable it would be easier to simply\
    \ declare an array of 5 with various people’s ages.\n\nThe declaration of this\
    \ array would be the following: int person_ages [5];\n\nint person_ages [5];\n\
    \nThe array type would be int, this is the type of the information that would\
    \ be being stored.  The second item is simply the array name.  In this case the\
    \ name is person_ages.  The last piece within the brackets holds the amount of\
    \ items in your array.\n\n## Initializing Arrays\n\nThere are two ways to initialize\
    \ an array.  The first way is to simply list the array position and set the value.\
    \ This is done, as shown below.\n\nperson_age[0]=43;\n\nperson_age[1]=49;\n\n\
    person_age[2]=5;\n\nperson_age[3]=10;\n\nperson_age[4]=70;\n\nWhen manually setting\
    \ the values in the array you also have the option to set them as shown below.\n\
    \n//initialize\n\nperson_age = {43,49,5,10,70};\n\nAlthough manually setting an\
    \ array may be okay for an array with 5 items.  What do you do when your array\
