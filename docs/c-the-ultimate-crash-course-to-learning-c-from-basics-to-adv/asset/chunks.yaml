    \n ![9](images/00050.jpeg)\n\nTo convert the expression a number of guidelines\
    \ must be followed.  These guidelines include:\n\n*   Morphing the lambda’s body\
    \ into one of an overloaded operator.\n\n*   The expression’s parameter list also\
    \ becomes that of the overloaded operator.\n\n*   The variables that are captured,\
    \ are turned into data members of the overloaded operators. \n\nThe closure object\
    \ is a large part of a lambda expression.  This is the compiler generated function\
    \ object. \n\nWhen a variable is “captured by copy” becomes a copied data member\
    \ of the variable from the enclosed scope.  When a variable is “captured by reference”\
    \ it becomes bound as a reference to a variable from the enclosed scope.  When\
    \ an item is categorized as a default capture, it is the capture method for all\
