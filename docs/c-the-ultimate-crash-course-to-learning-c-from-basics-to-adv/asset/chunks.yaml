    \ example below uses a for loop to iterate through an array for the purpose of\
    \ printing, although the same can be implemented for initializing depending on\
    \ the function of your code.\n\n#include <iostream>\n\nusing namespace std;\n\n\
    int main()\n\n{\n\n    int a;//a is your counter variable\n\n    int person_age\
    \ [5];\n\n    ages={45,24,5,95,12};\n\nfor (a=0; a<5; a++)//set 'a' to 0 execute\
    \ while 'a' is less than 5\n\n   {\n\ncout<<person_age[a]<<endl;\n\n   }\n\nreturn\
    \ 0;\n\n}\n\nRun the above program in your environment to see it in action and\
    \ see what it prints.\n\nThe example below shows how you can use for loops in\
