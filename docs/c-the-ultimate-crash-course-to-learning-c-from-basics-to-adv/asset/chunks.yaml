    \ type is verbose.\n\n ![c++](images/00055.jpeg)\n\nThis new version offers a\
    \ mechanism for capturing the type of an expression.  decltype returns the type\
    \ of an expression. \n\n![](images/00056.jpeg)\n\nThe primary intended usage of\
    \ decltype is to declare function templates.  These function template types depend\
    \ on the type of parameter.\n\n## Deleted and Defaulted Functions\n\nThe example\
    \ shown below is known as a default function.\n\nstruct A\n\n{\n\nA()=default;\
    \ //C++11\n\nvirtual ~A()=default; //C++11\n\n};\n\nThe bolded portion of the\
    \ code, =default, tells the compiler to create the default implementation.\n\n\
    There are 2 major advantages to default functions.  These include:\n\n*   Default\
    \ functions, compared to manual implementations, are far more efficient.\n\n*\
    \   Default functions also free the developer from defining functions manually.\n\
    \nDefaulted functions also have a counterpart.  The opposite of a defaulted function\
    \ is a deleted function.\n\nThe function has the structure:\n\nint func()=delete;\n\
    \nThese functions are useful when attempting to prevent the copying of objects. \
