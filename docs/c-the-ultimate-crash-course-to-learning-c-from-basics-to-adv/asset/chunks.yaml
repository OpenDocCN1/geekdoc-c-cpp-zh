    \ example below.\n\n```cpp\n#include  <iostream>\n\nusing  namespace std;\n\n\
    int main(  )  {\n char petname[40];\n char yourname[60];\ncout <<  \"Please enter\
    \ the name of your pet: \";\ncin >> petname;\ncout <<  \"Your name is: \"  <<\
    \ petname << endl;\ncout <<  \"Please enter your full name: \";\ncin >> yourname;\n\
