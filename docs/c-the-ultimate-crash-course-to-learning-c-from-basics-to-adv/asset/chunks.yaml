    \ a*b;\n\n}\n\n## Automatic Type Deduction and decltype\n\nIn a previous version\
    \ of C++, version 3, a type must be specified upon declaration.  An initializer\
    \ is often included with an object’s declaration.  C++11 allows the declaration\
    \ of object without specifying their types.  Some examples of this are provided\
