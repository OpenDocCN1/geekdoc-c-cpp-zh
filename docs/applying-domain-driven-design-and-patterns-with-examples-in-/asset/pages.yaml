  md: "# Why Not the I-name Convention for Interfaces?\n\nLet me ask you what good\
    \ would it do you? This convention came from an environment where the notion of\
    \ an interface itself was a convention, a rule, and not a first-class language\
    \ concept (that changed, more or less, with midl). When it comes to trying to\
    \ instantiate an interface (with `new`) the C# compiler (at least my version)\
    \ treats abstract classes and interfaces as one and the same.\n\n```\n```csharp\n\
    [View full width] public interface Bar {}\npublic class Foo { public static void\
    \ Main() { new Bar(); } }\ningo.cs(2,47): error CS0144: Cannot create an instance\
    \ of the\nabstract class or interface\n'Bar'\n```\n```\n\nWhy do we not have an\
    \ A-name convention for abstract classes? Because when you refer to a type that\
    \ has methods and properties, you don't care if it is an interface, abstract class,\
    \ or concrete ditto. The I-name convention seems to have been adopted by the *Framework\
    \ Class Library* (FCL) without further consideration.\n\n# Alternative Explanation/Rambling\n\
    \nThe I-name convention made sense in COM. COM wasn't really object-oriented,\
    \ was it? It was (well, *is*) component-oriented. Is there a reason to treat interfaces\
    \ of components as something inherently different from the component itself? Maybe,\
    \ but the question to ask is if interfaces in FCL are interfaces to components\
    \ or if they are the answer/compromise to the difficult (compiler) problem of\
    \ multiple inheritance. If so, an interface in CLR is very close to an abstract\
    \ class. There's no A-name convention for abstract classes. Drop the I-name convention;\
    \ it serves no purpose. When you refer/use a type that has methods and properties,\
    \ you don't care if it is an interface, abstract class, or concrete ditto.\n\n\
    I'll also mock this interface as a self-shunt. Of course, the form model needs\
    \ to know about its retriever. With all this in account, the test fixture starts\
    \ as the following:\n\n```\n```csharp\n[TestFixture] public class PickCandyTests:\
    \ PickCandyView, CandySourceRetriever\n{\n    void PickCandyView.SourceItem(string\
    \ text, bool pickable)\n    {\n        SrcPanel += text + (pickable ? \">\"\n\
    \            : string.Empty) + \" \";\n    }\n\n    IList CandySourceRetriever.Retrieve()\n\
    \    {\n```\n```"
