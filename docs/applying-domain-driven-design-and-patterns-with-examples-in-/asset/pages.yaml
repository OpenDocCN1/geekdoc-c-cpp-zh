- pgno: 268
  md: "Another problem with the solution shown in the code snippet is that the `_orderRepository`\
    \ is injected in the `order` instance. If you reconstitute an order from persistence\
    \ and you do that by using an O/R Mapper, you're not in charge of the creation\
    \ of the `order` instance. You could inject the `_orderRepository` in the Repository\
    \ during reconstitution, though, but it feels a little bit like a hack (consider,\
    \ for example, when you read a list of orders and you have to inject the Repository\
    \ into each instance of the list). After having thought about it, let's try to\
    \ keep the responsibility in the order for checking itself, but provide the Repository\
    \ via a setter instead or at the time of the check as a parameter to the `OrderNow()`\
    \ method (but that strategy has a tendency of not scaling well).\n\n# Note\n\n\
    I think this discussion points out a weakness in at least some OR Mappers: that\
    \ you don't control the instance creation during reconstitution as much as you\
    \ would like, especially considering the growing popularity of Dependency Injection\
    \ frameworks, as we will discuss in [Chapter 10](#), \"Design Techniques to Embrace.\"\
    \n\n# Locating Set-Based Processing Methods\n\nNo matter which of the styles previously\
    \ discussed you prefer, you might think a minute or two about how to check the\
    \ current debt. Of course, you could write code like this (assuming that we use\
    \ orders and not invoices for determining the current debt, which is probably\
    \ a bit twisted):\n\n```\n```csharp\n//Order, code for checking current debt for\
    \ OrderNow()\ndecimal orderSum = 0;\nIList<Order> orders = _orderRepository.GetOrders(c);\n\
    \nforeach (Order o in orders)\n{\n    if (_HasInterestingStateRegardingDebt(o))\n\
    \        orderSum += o.TotalValue;\n}\n```\n```\n\nI think that code is a no-no!\
    \ A better solution would be to expose a method on the `OrderRepository` with\
    \ a method called something like `CurrentDebtForCustomer()`, taking a `Customer`\
    \ instance as a parameter.\n\n# Note\n\nWith Repository interface design, it's\
    \ often a good idea to provide overloads, such as `X(Customer)` and `X(Guid)`.\
    \ It isn't handy to instantiate a `Customer` just to be able to call the method\
    \ if you hold on to the ID of the `Customer`."
