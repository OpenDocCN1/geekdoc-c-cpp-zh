- pgno: 95
  md: 'Add to that metaphor the element that the engine could also be fetched from
    another location, such as from the shelf of a local or a central stock; that is,
    an old instance should be reconstituted by fetching it from the database and materializing
    it. This is totally different from creating the instance in the first place, both
    for a real, physical engine and for an Order instance in software.


    We are close to the pattern solution now. Let''s use a solution similar to the
    second proposal, but factor out the creational behavior into a class of its own,
    forgetting about the "fetch from database" for now (which is dealt with by another
    Domain Pattern called Repository, which we will discuss a lot in later chapters).


    # Solution Proposal Three


    So now we have come to using the Factory pattern as the Domain Pattern. Let''s
    start with a diagram, found in Figure 2-7.


    # Figure 2-7. An instance diagram for the Factory pattern


    ![](img/89fb3513cb9b6343875aadbfd042005d_95_0.png)


    The code could look like this from a consumer perspective to obtain a ready-made
    new Order instance:


    ```

    anOrder = OrderFactory.Create(aCustomer);

    aReservation = OrderFactory.CreateReservation(aCustomer);


    aCredit = OrderFactory.CreateCredit(anOldOrder);

    aRepeat = OrderFactory.CreateRepeat(anOldOrder);

    ```


    This is not much harder for the consumer than it is using an ordinary constructor.
    It''s a little bit more intrusive, but not much.


    In order for the consumer to get to an old Order, the consumer must talk to something
    else (not the Factory, but a Repository). That''s clearer and expressive, but
    it''s another story for later on.


    To avoid the instantiation of orders via the constructor from other classes in
    the Domain Model if the Factory code is in an external class is not possible,
    but you can make it a little less of a problem by making the constructor internal,
    and hopefully because the Factory is there, the Domain Model developers themselves
    understand that that''s the way of instantiating the class and not using the constructor
    of the target class directly.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Note


    Eric Evans commented on the previous paragraph with the following: "I hope someday
    languages will support concepts like this. (Just as they have constructors now,
    perhaps they will allow us to declare factories, etc.)"


    # More Comments


    First of all, please note that sometimes a constructor is just what we want. For
    example, there might not be any interesting hierarchy, the client wants to choose
    the implementation, the construction is very simple, and the client will have
    access to all properties. It''s important to understand *not* to just go on and
    create factories to create each and every instance, but to use factories where
    they help you out and add clarity to and reveal the intention of the Domain Model.


    What is typical of the Factory is that it sets up the instance in a valid state.
    One thing I have become pretty fond of doing is setting up the sub-instances with
    Null Objects [Worf Null Object] if that''s appropriate. Take an `Order`, for example.
    Assume that the shipment of an order is taken care of by a `transporter`.


    At first, the `Order` hasn''t been shipped (and in this case we have not thought
    much about shipment at all), so we can''t give it any `transporter` object, but
    instead of just leaving the `Transporter` property as null, I set the property
    to the empty ("not chosen," perhaps) `transporter` instead. In this way, I can
    always expect to find a description for the `Transporter` property like this:


    ```

    anOrder.Transporter.Description

    ```


    If `Transporter` had been null, I would have needed to check for that first. The
    Factory is a very handy solution for things like this. (You could do the same
    thing in the case of a constructor, but there might be many places you need to
    apply Null Objects, and it might not be trivial to decide on what to use for Null
    Objects if there are options. What I''m getting at is that the complexity of the
    constructor increases.)


    You can, of course, have several different Factory methods and let them take many
    parameters so you get good control of the creation from the outside of the Factory.


    Using Factories can also hide infrastructure requirements that you can''t avoid.


    It''s extremely common to hear about Factories and see them used in a less semantic
    way, or at least differently so that all instances (new or "old") are created
    with Factories. In COM for example, every class has to have a class factory, as
    do many frameworks. Then it''s not the Domain Pattern Factory that is used: similar
    in name and in technique, different in intention.


    Another example is that you can (indirectly) let the Factory go to the database
    to fetch default values. Again, it''s good practice to not have much processing
    in constructors, so they are not a good place to have logic like that.'
  merge: -1
