  md: 'This approach relieves you and your system of having to reset the entire database
    before the test call. Instead, you issue a set of commands to the database before
    or after the test, again typically in the setup and/or teardown methods. The good
    news is that you have much less to do for a single class of tests. The previous
    techniques can still be used, but now you have the additional option of issuing
    simple insert, update, or delete statements as well. This is now less painful,
    even if logged, because the impact is less. Again, reducing the logging effort
    with database setup options is still a good idea if your system supports it.


    There is a downside, though. As soon as you make the leap to assuming you know
    exactly what data will be affected by your test, you have tied yourself into understanding
    what not just the code under test is doing with data, but also what additional
    code the code under test calls out to. It may get changed without you noticing
    it. Tests may break that are not an indication of broken code. A bug will get
    filed that may not be a bug at all but is maintenance work just the same.


    It is possible to use this technique successfully, but after many years of test
    writing, I have found this approach to be the most likely to break without good
    reason. You can minimize this, though. If you mock out the classes your code under
    test calls out to, that code won''t affect the database. This is in spirit much
    closer to what is meant by a unit test. Mocking is not useful if you are automating
    system tests where the interactions between real classes are exactly what you
    want to test. At any rate, doing this requires an architecture decision to allow
    for easy substitution of external classes by the testing framework. If you are
    going to do that, you have naturally found yourself working toward the final option
    I am covering here.


    # Don''t Forget Your Evolving Schema!


    You will no doubt find yourself making changes to the database over time. While
    in the initial stages you may want to just modify the database directly and adjust
    your code as needed, after you have a released system, it''s time to think about
    how these changes should become part of your process. Working with a test system
    actually makes this easier.


    I prefer the approach of creating and running alter scripts against your database.
    You could run these scripts immediately after your database reset, but because
    all that database state is contained in your source controlled development environment,
    it probably makes sense to develop the scripts and use them to modify your test
    environment. When your tests pass, you check it all in and then have the scripts
    automatically set up to run against your QA environment as needed.


    It''s even better if this happens on your build server because the running of
    the alter scripts is then tested often before it''s applied to your live systems.
    Of course, that assumes you regularly reset your QA environment to match your
    live environment. I''m sure there are many variations of this process, but the
    most important thing is to plan ahead to ensure a reliable release of both code
    and database changes.


    # Separate the Testing of the Unit from the Testing of the Call to the Database


    Few things in the Agile community''s mailing lists and forums generate more discussion
    than the testing of code that interacts with databases. Among those who are practicing
    (and still defining) the techniques of TDD, it is a highly held value that all
    code can be tested independently as units as'
