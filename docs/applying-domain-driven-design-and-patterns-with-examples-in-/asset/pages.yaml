- pgno: 54
  md: '# Refactor for Deeper Knowledge


    A value I definitely think should be valued is continuous evaluation, and that
    goes for DDD, as well. Is the current model the best one? Every now and then,
    question the current model constructively, and if you come up with important simplifications,
    don''t be afraid to refactor.


    The same also applies when you find something new. A couple of simple refactorings
    might make that new feature not only possible but also easy to achieve so it fits
    well within the model.


    Refactorings alone might also lead to deeper knowledge, like when you do a refactoring
    that can open everything up and lead to one of those rare "eureka!" moments.


    We will come back to refactoring shortly, but first I''d like to talk about something
    closely related, namely Test-Driven Development.


    # Test-Driven Development


    I''ve often heard developers say that they can''t use automatic unit testing because
    they don''t have any good tools. Well, the mindset is much more important than
    the tools, although tools do help, of course.


    I wrote my own tool (see Figure 1-6) a couple of years ago and used it for registering
    and executing tests of stored procedures, COM components, and .NET classes. Thanks
    to this tool, I could skip those forms with 97 buttons that have to be pressed
    in a certain order in order to execute the tests.


    Figure 1-6. Screen shot of my old test tool called JnskTest


    [View full size image]


    ![](img/89fb3513cb9b6343875aadbfd042005d_54_0.png)


    Later on, when NUnit [NUnit] (a derivate from the other xUnit versions) was released
    (see Figure 1-7), I started using that tool instead. Using NUnit is way more productive.
    For example, my tool didn''t reflect on what the existing tests were. Instead
    you had to explicitly register information about them.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Figure 1-7. NUnit, the GUI version


    [View full size image]


    ![](img/89fb3513cb9b6343875aadbfd042005d_55_0.png)


    # Note


    Now I use another tool, called Testdriven.Net, but as I said, what tool you use
    is of less importance.


    No matter what process you use, you can use automatic unit tests. For an even
    larger positive effect, I strongly recommend you find out if Test-Driven Development
    (TDD) is for you.


    # The Next Level


    TDD is about writing tests before writing the real code. In doing this, the tests
    will drive your design and programming.


    TDD sounds dull and boring, and developers often expect it to be a pain in the
    backside. They couldn''t be more wrong! In my experience, the opposite is true:
    it''s actually great fun, which came as a surprise to me. I guess the reason that
    it is so fun is that you get instant feedback on your changes, and because we
    are professionals, we enjoy creating high-quality applications.


    Another way to put it is that TDD isn''t about testing. It''s about programming
    and design. It''s about writing simpler, clearer, and more robust code! (Sure,
    the "side-effect" of created unit tests is extremely important!)'
