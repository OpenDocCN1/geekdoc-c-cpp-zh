- pgno: 314
  md: 'specific scenario with the same approaches for generated code and reflective
    code, it is often possible to squeeze out better performance from generated static
    code than from reflective code.


    Perhaps a worse problem is that of new generator versions. I have the gut feeling
    that it’s hard to get a new version of a generator into production because it
    will have to re-generate all the code.


    Also, if the database schema changes, it''s not possible to make changes at runtime
    without a recompile. But this is something that’s rarely recommended anyway. These
    sorts of changes should involve the developers.


    The code generation being of roundtrip style or forward only is a pretty big difference.
    If it is roundtrip style, your changes to the generated code will be preserved,
    while in the case of forward only style, you should never change the generated
    code because changes will be lost at next generation.


    Let''s end on an up note. Debugging might be easier with a solution based on code
    generation than based on metadata mapping. All the code is "there," but the code
    might be hard to understand, and there is a lot of it.


    Often the catalyst for wanting to look further is the lack of dynamics, such as
    when it comes to querying. And I also said that if we decide to implement dynamic
    querying, Unit of Work, Identity Map, and so on, I think we should take a good
    look at the next category: the O/R Mapper.


    # Metadata Mapping (Object Relational (O/R) Mapper)


    A specific style of the Data Mapper pattern is what is called the Metadata Mapping
    pattern. You define the relationship between the Domain Model and the Relational
    database in metadata. The rest of the work is done for you automatically.


    The most typical implementation is probably that of O/R Mappers. I will use the
    term O/R Mapper as a product family that takes care of Metadata mapping.


    # Note


    My friend Mats Helander describes O/R Mapping as Tai Chi.


    Tai Chi is composed of two halves. The first half is about learning to elevate
    and lower the arms slowly, in harmony with the breathing. The second half is everything
    else. This isn''t a joke. No matter how good you get at Tai Chi, you are "expected"
    or recommended to continue to spend as much time on the first move as on all the
    other moves together.


    O/R Mapping is also composed of two halves. The first is about shuffling data
    between objects in memory and rows in the database and back. The other half is
    everything else.


    As you can probably guess by now, most O/R Mappers have built-in support for Unit
    of Work, Identity Map, Lazy Load, and Querying.'
