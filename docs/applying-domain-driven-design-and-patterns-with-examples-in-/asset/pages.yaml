  md: "The idea regarding `ParticipatingLogicalFields` is that the consumer should\
    \ be able to mark out the fields that are affecting a certain broken rule.\n\n\
    And a rule class could look like the following example. This one is for checking\
    \ that a date is within a certain range:\n\n```\npublic class DateIsInRangeRule\
    \ : RuleBase\n{\n    public readonly DateTime MinDate;\n    public readonly DateTime\
    \ MaxDate;\n\n    //Note: Only the \"largest\" constructor is shown here.\n  \
    \  public DateIsInRangeRule(DateTime minDate, DateTime maxDate,\n        int ruleId,\
    \ string[] participatingLogicalFields,\n        string fieldName, object holder)\n\
    \        : base(ruleId, participatingLogicalFields, fieldname\n        , holder)\n\
    \    {\n        MinDate = minDate;\n        MaxDate = maxDate;\n    }\n    public\
    \ override bool IsValid\n    {\n        get\n        {\n            DateTime value\
    \ = (DateTime)base.GetValue();\n\n            return (value >= MinDate && value\
    \ <= MaxDate);\n        }\n    }\n}\n```\n\nI also needed a base class (`RuleBase`)\
