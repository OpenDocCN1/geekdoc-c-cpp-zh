- pgno: 308
  md: 'the works or being introduced, which might be a good solution to the problem.


    One more problem is that there is no obvious choice for a query language. There
    are some open source alternatives, but again, this feels a bit immature at the
    moment. This problem gets bigger when you consider reporting and the need for
    ad-hoc querying done by end users and not just querying from within the application.
    For example, typical report writer tools for end users are pretty useless in this
    case.


    # Note


    If possible, reporting should be done on a dedicated server and dedicated database
    anyway, so this might be less of a problem than what was first anticipated. On
    the other hand, in reality there is often at least a grey zone of what are reports
    and what are lists for supporting the daily transactional work, so to speak. And
    voilà, the problem is back.


    Yet another problem is that navigation in the Domain Model is typically based
    on traversing lists. There might not be built-in support for indexing. Sure, you
    can use hash tables here and there, but they only solve part of the problem. You
    can, of course, add an in-memory indexing solution if you need it. On the other
    hand, you should note that this certainly won''t be a problem as early on as it
    is for disk-based solutions.


    Finally, as I''ve already said a couple of times, I consider this approach to
    be a bit immature, but very interesting and promising for the future, at least
    in certain situations.


    # File System


    Another solution is to use the file system instead of RAM. What to persist is
    the same as with RAM, namely the Domain Model objects or XML. As a matter of fact,
    this solution could be very close to the RAM solution. It could be the same if
    the database is small, and it might "only" spill out to disk when the RAM is filled
    to a certain level.


    This approach has similar problems to the previous one, except that the size of
    RAM isn''t as much of a limiting factor in this case. On the other hand, the performance
    characteristics will probably be less impressive.


    I believe that it might be pretty appealing to write your own solution for persisting
    the Domain Model (or XML documents also), but as always when you decide to roll
    your own infrastructure, you have to be prepared for a lot of work. I know that
    nothing is more inspiring to a developer than hearing that "it''s too hard" or
    "too complex," so if they haven''t already done so, now just about everybody will
    be writing their own file system-based solution, right? Just be prepared for it
    to be deceptively simple at first, but the devil is in the details, and the complexity
    increases as you move forward.


    If you do decide to build a Domain Model that could spill out to disk when persisting,
    what you actually create is quite like an object database. (Perhaps that gives
    a better sense of the amount of work and complexity.)'
