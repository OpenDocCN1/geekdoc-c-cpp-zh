  md: '# Note


    Mark Burhop commented as follows:


    Hmmm... This was the original argument against C++ from C programmers in the early
    90s. "C++ sticks in new code I didn''t write." "C++ hides what is really going
    on." I don''t know that this argument holds much water anymore.


    It''s also harder to inject code at the byte level for .NET classes compared to
    Java. It''s not supported by the framework, so you''re on your own, which makes
    it a showstopper in most cases.


    What is most often done instead is to use some alternative techniques, such as
    those I mentioned with runtime-subclassing in combination with a provided factory,
    but it''s not a big difference compared to injected code. Let''s summarize with
    calling it emitting code.


    # The Cost for PI Entitites/Value Objects


    I guess one possible reaction to all this is "PI seems great why not use it all
    the time?" It''s a law of nature (or at least software) that when everything seems
    neat and clean and great and without fault, then come the drawbacks. In this case,
    I think one such is overhead.


    I did mention earlier in this chapter that speed is something you will sacrifice
    for a high level of PI-ness, at least for runtime PI, because you are then directed
    to use reflection, which is quite expensive. (If you think compile-time PI is
    good enough, you don''t need to use reflection, but can go for an AOP solution
    instead and you can get a better performance story.)


    You can easily prove with some operation in a tight loop that it is magnitudes
    slower for reading from/writing to fields/properties with reflection compared
    to calling them in the ordinary way. Yet, is the cost too high? It obviously depends
    on the situation. You''ll have to run tests to see how it applies to your own
    case. Don''t forget that a jump to the database is very expensive compared to
    a lot you''re doing in your Domain Model, yet at the same time, you aren''t comparing
    apples and apples here. For instance, the comparison might not be between an ordinary
    read and a reflection-based read.


    # A Typical Example Regarding Speed


    Let''s take an example to give you a better understanding of the whole thing.
    One common operation in a persistence framework is deciding whether or not an
    instance should be stored to the database at the end of a scenario. A common solution
    to this is to let the instance be responsible for signaling IsDirty if it is to
    be stored. Or better still, the instance could also signal itself to the Unit
    of Work when it gets dirty so that the Unit of Work will remember that when it''s
    time to store changes.


    But (you know there had to be a "but," right?) that requires some abuse of PI,
    unless you have paid with AOP.'
