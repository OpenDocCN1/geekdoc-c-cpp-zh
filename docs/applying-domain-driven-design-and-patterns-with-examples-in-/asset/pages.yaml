- pgno: 110
  md: '+   - **False sense of security**


    Just because you get a green bar doesn’t mean that you have zero bugs; it just
    means that your tests haven''t detected any bugs. So that TDD doesn''t lead you
    into a false sense of security. Remember that a green test doesn''t prove the
    absence of bugs, only that that particular test executed without detecting a problem.


    On the other hand, just because your tests aren''t perfect doesn''t mean that
    you shouldn''t use them. They will still help you quite a lot with improving the
    quality!


    As my friend Mats Helander once said, the value isn''t in the green, but in the
    red!


    +   - **Losing the overview**


    TDD can be seen as a bottom-up approach, and you must be aware that you might
    lose the overview from time to time. It''s definitely a very good idea to visualize
    your code from time to time as UML, for example, so you get a bird''s eye perspective.
    You will most certainly find several refactorings that should be applied to prepare
    your code for the future.


    +   - **More code to maintain**


    The maintenance aspect is a double-edged sword. The tests are great for doing
    maintenance work, but you also have more code to maintain.


    I just said that TDD is hard to apply for the UI and database, and that''s just
    one more reason why the Domain Model pattern shines because you can typically
    run more meaningful tests without touching the database and the UI compared to
    when other logical structures have been used! That said, we will discuss both
    database testing and UI testing in later chapters.


    Anyway, all in all I think TDD is a great tool for the toolbox!


    # ## The Next Phase?


    That was an introduction to the basic concepts, but we have only scratched the
    surface a little bit. When you start applying TDD, it will probably work smoothly
    after you pass those first start-up problems.


    Then after a while you will probably find that setting up some tests gets overly
    complex and too dependent on uninteresting parts/uninteresting parts of testing
    for the test itself at least. That''s a good sign that you have reached the next
    phase of TDD. My friend Claudio Perrone will talk more about that in the next
    section called mocks and stubs.


