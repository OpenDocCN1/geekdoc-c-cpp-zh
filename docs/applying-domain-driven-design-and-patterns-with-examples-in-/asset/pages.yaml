  md: '# One or Two Repository Assemblies?


    With all this in place, you understand that you have many different possibilities
    for how to structure the Repositories, but you might wonder how it''s done in
    real-world projects.


    In the most recent large project of mine (which is in productionit''s not a toy
    project), I use a single set of Repositories, both for Fake execution and execution
    against the database. There are a few optimizations that use native SQL, but I
    used a little hack there so that if the optimized method finds an injected connection
    string, it calls out to another method where I''m totally on my own.


    Otherwise, the un-optimized code will be used instead. That way, the Fake will
    use the un-optimized version, and the database-related code will typically use
    the optimized version.


    Again, this is only used in a handful of cases. Not extremely nice and clean,
    but it works fine for now.


    # Specifications as Queries


    Yet another approach for querying is to use the Specification pattern [Evans DDD]
    (encapsulate conceptual specifications for describing something, such as what
    a customer that isn''t allowed to buy more "looks like"). The concept gets a describing
    name and can be used again and again.


    Using this approach is similar to creating type safe Domain Model-specific queries,
    but it goes a step further because it''s not generic querying that we are after,
    but very specific querying, based on domain-specific concepts. This is one level
    higher than the query definitions that live in the Domain Model, such as `CustomerQuery`.
    Instead of exposing generic properties to filter by, a specification is a concept
    with a very specific domain meaning. A common example is the concept of a gold
    customer. The specification describes what is needed for a customer to be a gold
    customer.


    The code gets very clear and purposeful because the concepts are caught and described
    as Specification classes.


    Even those Specification classes could very well spit out `IQuery` so that you
    can use them with `GetByQuery()` of `IWorkspace` (or equivalent) if you like the
    idea of an abstraction layer.


    # Other Querying Alternatives


    So far we have just talked about Query Objects as being the query language we
    need (sometimes embedded in other constructs, though). As a matter of fact, when
    the queries get complex, it''s often more powerful to be able to write the queries
    in, for example, a string-based language similar to SQL.'
