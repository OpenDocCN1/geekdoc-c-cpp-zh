  md: 'procedures; for example, doing several operations and affecting many rows in
    each call.


    # The Right Efficiency


    Even though hardware capability is probably still growing in accordance with something
    like Moore''s law, the problem of performance is an everyday one. At the same
    time as the hardware capabilities increase, the size of the problems we try to
    solve with software also increases.


    In my experience, performance problems are more often than not the result of bad
    database access code, bad database structure, or other such things. One common
    reason for all this is that no effort at all has been spent on structuring the
    database, only on object-orientation purity. This in its turn has led to an extreme
    number of roundtrips, inefficient and even incorrect transaction code, bad indexing
    schemes, and so on.


    To make it a bit more concrete, let''s look at an example where object orientation
    has been thought of as important while database handling has not. Let''s assume
    you have a `Customer` class with a list of `Orders`. Each `Order` instance has
    a list of `OrderLine` instances. It looks something like Figure 1–2.


    # Figure 1–2. UML diagram for Customer/Order example


    ![](img/89fb3513cb9b6343875aadbfd042005d_37_0.png)


    Moreover, let''s assume that the model is very important to you and you don''t
    care very much about how the data is fetched from and stored to the relational
    database that is being used. Here, a possible (yet naïve) schema would be to let
    each class (`Customer`, `Order` and `OrderLine`) be responsible for persisting/depersisting
    itself. That could be done by adding a Layer Superty​pe [Fowler PoEAA] class (called
    `PersistentObject` in the example shown in Figure 1–3) which'
  merge: -1
