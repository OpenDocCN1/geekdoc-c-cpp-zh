- pgno: 306
  md: '# Where to Store Data


    Assume we start with a clean sheet of paper; how would we like to store the data?
    We have at least four choices:


    +   - RAM

    +   - File system

    +   - Object database

    +   - Relational database


    # Note


    I realize that this may be a case of apples and oranges because it is a two-part
    problem: what to store (Objects, Hierarchies, such as XML, or Tables) and where
    to store it: (RAM, File system, Object database, or Relational database). But
    that''s not without problems, either. After thinking through it a couple of times,
    I think my original way of describing it is good enough, so let''s move on.


    I''ll start with RAM.


    # RAM


    Storing the data in RAM isn''t necessarily as silly as it might first sound. What
    I''m thinking about is seeing the Domain Model as the database itself while at
    the same time keeping persistent storage of all changes as a log on disk so that
    the Domain Model can be re-created in case of a system crash.


    The beauty is that you avoid mapping from the Domain Model onto something else.
    The Domain Model is persistent by itself.


    You could also store hierarchies in memory, with XML documents as a typical example.
    Then you do get some impedance mismatch because you are using two models and need
    to transform between them. On the other hand, you do get some functionality for
    free, such as querying if you find XPath and XQuery to be good languages for that.


    No matter what you "store" in RAM, one problem is the size of RAM. If you have
    2 GB of RAM in your machine leftover when the system and other applications have
    taken their part, your database'
