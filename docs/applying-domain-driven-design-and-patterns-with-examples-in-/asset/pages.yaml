  md: "The first problem still applies. If the instance isn't valid, it might well\
    \ be interesting to find out which rules have been broken. The Aggregate root\
    \ will aggregate the broken rules from all its children as well as from itself\
    \ and return the broken rules as an IList.\n\nLet's add to the interface for dealing\
    \ with this. It could look like this:\n\n```\npublic interface IValidatableRegardingPersistence\n\
    {\n    bool IsValidRegardingPersistence {get;}\n    IList BrokenRulesRegardingPersistence\
    \ {get;}\n}\n```\n\n# Note\n\nAs I see it, the list of broken rules is an implementation\
    \ of the Notification pattern [Fowler PoEAA2].\n\nOne important thing mentioned\
    \ with that pattern is that it's not only errors that we need to be informed about,\
    \ but warnings/information as well. Another thought that springs to mind is that\
    \ the broken rules list I have talked about is pretty focused on Aggregates, but\
    \ we can, of course, aggregate (pun not intended) several such lists into a single\
    \ one in an Application layer [Evans DDD], such as from several Aggregate root\
    \ instances.\n\n# We Allowed an Incorrect Transition\n\nSure, the Note became\
    \ too long, and that could be considered to be a transition to an invalid state.\
    \ But I can't say I think of that thing as very interesting most often. I would\
    \ probably let the order be around with a too-long Note for some time to make\
    \ it possible for the user to delete a few letters of the Note.\n\nUnfortunately,\
    \ in this case, the too-long Note won't be possible to save. That transition between\
    \ not persisted and persisted, on the other hand, is interesting here. But it\
    \ won't be allowed. (As I said, I will get an exception or the string will be\
    \ truncated silently.)\n\nThe transition to persisted is a bit \"special.\" We\
    \ will get back to the problem of allowing incorrect transitions in the context\
    \ of domain-related rules shortly.\n\n# What If We Forgot to Check?\n\nIf the\
    \ consumer doesn't follow the protocol of first checking the possibility of a\
    \ transition before trying to make the transition, we have an exceptional situation,\
    \ and exceptional situations throw exceptions. The same applies here, too. So\
    \ if we tried to transition to persisted, we would like to throw an exception\
    \ that is subclassing ApplicationException and will hold an IList of broken rules."
