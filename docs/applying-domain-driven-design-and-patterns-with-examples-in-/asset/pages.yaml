  md: '# 基于 Struts 2 的通用查询模块的设计与实现


    摘要：为适应不同业务系统的查询需求，解决企业级应用手工编码完成查询功能的开发效率低、 可维护性差等冋题， 按需求抽取通用查询功能， 提出了一种基于 Struts2
    框架的通用查询模块的设计。依据 Struts 2 框架分层设计思想， 该模块在 Dao 层实现对查询语句的自动构造， 在 Service 层提供通用的业务逻辑，
    在页面层通过配置和标签库实现查询界面可定制。该模块已在企业信息系统开发中应用， 提高了企业应用的开发效率。


    关键词：查询模块；Struts 2；通用查询；Hibernate；查询界面定制


    1 通用查询模块的需求分析

    在企业级应用开发过程中， 有许多业务系统都需要实现查询功能。例如办公自动化系统要查询与本系统有关的待办事项、已办事项等；人力资源管理系统中要查找职工基本信、职工考勤信息等。这类查询往往涉及到多表，查询条件灵活多变，
    具有鲜明的个性。查询功能是管理信息系统必不可少的功能， 也是用户使用最频繁的功能。

    由于查询的多样性， 程序员在为每个业务系统编程实现查询功能时，往往将大部分时间花在了页面编写、SQL语句的书写与调试上， 尤其是多表查询， 涉及到的查询条件可能很多，
    并且要考虑到多表间的连接， 费时费力， 且程序可重用性差， 维护困难， 开发效率低。为解决上述问题， 可以将查询功能抽取为一个独立的功能模块， 即在做具体业务系统前，
    先做一个通用的查询模块。用户通过使用该模块， 可以灵活地定制查询条件， 形成查询界面， 不需要修改程序即可实现多变的查询需求，从而提高了软件开发效率。

    通用查询模块需要满足以下需求：

    (1) 查询界面的可定制化。使用者可通过页面配置查询项、设置查询方式， 动态生成查询页面。

    (2) 数据库访问的通用化。使用者通过配置即可访问数据库， 进行增加、删除、修改、查询等操作。


    ![](img/89fb3513cb9b6343875aadbfd042005d_136_0.png)


    图1 通用查询模块总体框架


    Design and Implementation of Common Query Module Based on Struts 2'
