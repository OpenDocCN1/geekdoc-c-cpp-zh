- pgno: 466
  md: '# Object-Oriented Data Model, Smart Service Layer, and Documents


    By Mats Helander


    Sometimes, during dark winter nights, I recall faintly what life was like in the
    days before the Domain Model. It is at times like those that I pour a little cognac
    into my hot chocolate and throw an extra log on the fire.


    The evolution of the architecture in my applications, finally leading up to the
    use of the Domain Model, followed a pattern some readers may feel familiar with.
    I''m going to outline this evolution quickly, as it helps put my current approach
    for using the Domain Model into context.


    # In the Beginning


    I started out writing client-server applications where all the application code
    was stuffed into the client, which would talk directly to the database. When I
    started writing Web applications, they consisted of ASP pages with all the application
    code in them including the code for calling the database.


    Because the result of this type of application architecture is, without exception,
    a horrific mess whenever the application grows beyond the complexity of a "Hello
    World" example, I soon learned to factor out most of the code from the presentation
    layer and to put it in a Business Logic Layer (BLL) instead.


    Immediately, the applications became easier to develop, more maintainable, and
    as a bonus the BLL could be made reusable between different presentation layers.
    It should also be noted that in those days, it could make a big difference to
    the performance and scalability of a Web application to have the bulk of its code
    compiled in a component.


    The next step was to lift out all the code responsible for communicating with
    the database from the BLL and put it in a layer of its own, the Data Access Layer
    (DAL). I recall that I was slightly surprised to see that the DAL was often substantially
    larger than the BLL meaning more of my application logic dealt with database communication
    than with actual business logic.


    At this time, I was almost at the point where the Domain Model would enter into
    the equation. The PL would talk to the BLL that would talk to the DAL that would
    talk to the database. However, all data from the database was passed around the
    application in the form of Recordsets, the in-memory representation of rows in
    the database (see Figure A-1).


    Figure A-1. Classic, pre-Domain Model layered application architecture'
  merge: -1
  img_proc: true
- pgno: 467
  md: '![](img/89fb3513cb9b6343875aadbfd042005d_467_0.png)


    Sometimes, working with the data in its relational form is just what you want,
    and in those cases the architecture described earlier still fits the bill nicely.
    But, as I was becoming aware of, relational data structures aren''t always ideal
    for the business logic to work with.


    # Object-Orientation and Relational Data Structures


    From some work I had done with an object-oriented database from Computer Associates
    called Jasmine, I had come to understand that an object-oriented data structure
    was quite often a lot easier to work with when developing the business logic than
    the corresponding relational structure.


    Relationships between entities are simpler, for one thing. In the case of many-to-many
    relationships, this is especially so, because the relational data structure requires
    an additional table whereas no additional class is required in the object-oriented
    data structure.


    Collection properties are another case where an additional table is used in the
    relational model but no extra class is required in the object-oriented data structure.
    Furthermore, object-oriented data structures are type safe and support inheritance.


    # The Domain Model and Object-Relational Mapping


    The problem was that OO databases weren''t that common. Most projects I encountered
    still revolved around the relational database. This is where Object-Relational
    Mapping entered the picture.


    What Object-Relational Mapping does is to let you take an object-oriented data
    structure and map it to the tables in a relational database. The advantage is
    that you will be able to work with your object-oriented data structure as if working
    with an OO database like Jasmine, while in reality you''re still using a relational
    database to store all your data.


    Furthermore, you can add business logic to the classes of the object-oriented
    data structure in the form of business methods. As you may have guessed, the object-oriented
    data structure with business methods that I’m talking about is that''s right—the
    Domain Model.


    By learning about Object-Relational Mapping I could finally take the step toward
    including the Domain Model in my application architecture. Inserted between the
    BLL and the DAL, the Domain Model layer now allowed my business logic to work
    with an object-oriented data structure (see Figure A-2).


    **Figure A-2. Updated, layered application architecture including Domain**'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# Model


    | Layer |

    |---|

    | Presentation Layer(s) |

    | Business Logic Layer |

    | Domain Model Layer |

    | Data Access Layer |

    | Relational Database(s) |


    This meant that a BLL method that had previously been working with a `Recordset`
    containing a row from the `Employees` table would now instead work with an `Employee`
    Domain Model class. I gained type safety, and the code became shorter and easier
    to read not to mention that I could navigate my data structure during development
    using Microsoft''s IntelliSense feature!


    Ever since, I''ve been a devoted user of the Domain Model and I haven''t looked
    back except during those cold, dark winter nights.


    As I mentioned, another advantage with the Domain Model is that it lets you distribute
    your business logic over the Domain Model classes. I''ve experimented a lot with
    where to put my business logic. I''ve shifted between putting most of it in the
    Business Logic Layer to putting most of it in the Domain Model Layer and back
    again.


    # Service Layer


    I''ve also come to prefer the term Service Layer [Fowler PoEAA] to Business Logic
    Layer, as it better covers what I''m doing at times when most of my business logic
    is in the Domain Model Layer. When most of my business logic is in the Service
    Layer I see no reason to switch back to the term Business Logic Layer, though
    I sometimes refer to it as a "thick" Service Layer to distinguish it from a more
    conventionally thin Service Layer.


    These days I almost always put most of the business logic in a "thick" Service
    Layer. While some OO purists might argue that structure and behavior should be
    combined, every so often I find it practical to keep the business logic-related
    behavior in the Service Layer.


    The main reason for this is that in my experience, business rules governing the
    behavior of the Domain Model will usually change at a different pace, and at different
    times, from the rules governing the structure of the Domain Model. Another reason
    is that it easily lets you reuse the Domain Model under different sets of business
    rules.


    Normally, the only business methods I would put on the Domain Model objects themselves
    are ones that I believe are fundamental enough to be valid under any set of business
    rules and are probably going to change at the same time and pace as the structure
    of the Domain Model.


    With most of my business logic in the Service Layer, the application architecture
    is nicely prepared for the step into the world of SOA. But before we go there
    and take a look at how I would tackle Jimmy''s example application, I''d just
    like to stress another particular benefit of this approach.


    # Combining Things'
  merge: -1
  img_proc: true
- pgno: 469
  md: 'As I mentioned earlier, the object-oriented data structure offered by the Domain
    Model isn''t the perfect fit for *every* operation you''ll want to perform. There
    are reasons why relational databases are still so popular and why many people
    prefer to use Object-Relational Mapping before going with an actual OO database.
    For many tasks, the relational data structure and the set-based operations offered
    by SQL are the *perfect fit*.


    In these cases, slapping methods onto the Domain Model objects that will actually
    be performing set-based operations directly on the relational data structures
    may not seem like a very natural way to go.


    In contrast, letting Service Layer methods that access the database directly (or
    via the DAL) co-exist side by side with methods that operate on the Domain Model
    is not stretch at all. Converting a Service Layer method from using one approach
    to the other is also easily accomplished.


    In short, I''m free to implement each Service Layer method as I see fit, bypassing
    the Domain Model Layer where it is not useful as well as taking full advantage
    of it where it *is* useful (which, in my experience, happens to be quite often).


    # Jimmy''s Application and SOA


    Having said that, let''s return to Jimmy''s application and the brave new world
    of SOA. So far I have only really described what my application architecture looks
    like on the server, which may be enough for a Web application, but now we''re
    going to deal with a Rich Client, and I''d like to focus on application servers
    as a variation to the rest of the book.


    In cases where a lot, if not all, of the business logic has been distributed over
    the Domain Model, a tempting approach is to try to export both data and behavior
    packaged together in this way to the Rich Client by giving it access to the Domain
    Model. With the architecture I''m using, where most of the behavior is found in
    the Service Layer, a more natural approach is to expose the behavior and the data
    separately.


    Concretely, the Service Layer is complemented with a Web Service façade (a type
    of the Remote Façade pattern [Fowler PoEAA]), which is just a thin layer for exposing
    the business logic methods in the Service Layer as Web Services. The Rich Client
    communicates with the server by calling the Web Services, exchanging XML documents
    containing serialized Domain Model objects.


    For our example application, this means that each time the Rich Client needs new
    information it will call a Web Service on the server that will return the information
    in the form of an XML document. To begin with, let''s take the case of listing
    customers matching a filter.


    I would begin by creating a `GetCustomersByFilter()` Service Layer method implementing
    the actual filtering. The Service Layer method would take the filter arguments
    and return the matching Domain Model objects. Then I''d add a `GetCustomersByFilter()`
    Web Service exposing the Service Layer method to the Rich Client.


    The Web Service accepts the same filter arguments and passes them on in a call
    to the Service Layer method. The Domain Model objects returned by the Service
    Layer method would then be serialized to an XML document that would finally be
    returned by the Web Service. The Rich Client can then use the information in the
    XML document to display the list of customers to the user (see *Figure A-3*).'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# Figure A-3. Rich Client Application Server layered application architecture
    including Domain Model


    ![](img/89fb3513cb9b6343875aadbfd042005d_470_0.png)


    It is completely up to the Rich Client application developers if they want to
    create a client-side Domain Model that they can fill with the data from the XML
    document. They may also decide to store the information for offline use. One way
    is to just save the XML documents to disk. Another is to persist the client-side
    Domain Models to an offline database on the client machine.


    Note that the eventual client-side Domain Model doesn''t have to match the Domain
    Model on the server. Accordingly, if the client-side Domain Model is persisted
    to an offline database, the client-side database will presumably follow the design
    of the client-side Domain Model and thus doesn''t have to look like the server-side
    database.


    # Note


    One important difference regarding the schema of the server-side database and
    the client-side database is that if a server-side database table uses automatically
    increasing identity fields, the corresponding client-side database table normally
    shouldn''t.


    Say that a new employee is created on the server. As a new row is inserted in
    the Employees table it is automatically given a value in its auto-increasing ID
    Column. The employee is then serialized and sent to the client, which fills a
    client-side Domain Model with the data and stores it in the client-side database
    for offline use.


    The new row in the client-side Employees table should not be assigned with a new
    ID. The ID that was assigned to the employee in the server-side database should
    be used. This means that the properties for the ID columns may be different on
    the client and the server.


    The point here is that the developers of the Rich Client application are free
    to decide whether or not they want to use a Domain Model at all, and if they want
    one they are free to design it as they see fit. The communication between client
    and server is 100% document-oriented, and no assumptions about the Domain Models
    on either side are made by the other.


    For example, maybe the Rich Client calls Web Services of many different companies,
    all capable of returning lists of customers but all with slightly different fields
    in their XML documents. One way to'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'deal with this would be to create a "superset" client-side Customer Domain
    Model object with properties for all the different fields that were returned from
    all the companies called.


    Next, we want the user of the Rich Client application to be able to look at the
    orders belonging to a particular customer. The unique ID of each customer was
    of course included in the XML document returned by the first Web Service, so we
    know the ID of the customer in which we''re interested.


    What I have to do is to implement a Web Service that takes the ID of a customer
    and returns the orders for that customer. Again, I begin by creating a GetOrdersByCustomerID()
    Service Layer method that accepts the ID of a customer and returns the Domain
    Model Order objects belonging to the customer.


    I''ll then proceed by adding a GetOrdersByCustomerID() Web Service that takes
    a customer ID, passes it along to the Service Layer method, and finally serializes
    the returned order objects into an XML document that can be returned by the Web
    Service.


    However, in this case, some extra attention has to be paid to the XML serialization.
    We want the XML document to include the total value for each order, but the Order
    Domain Model object doesn''t contain any TotalValue property because the total
    value of an order is not stored in any field in the database.


    Rather, the total value is calculated whenever it is needed by adding the values
    of the order lines together. The value of each order line, in its turn, is calculated
    by multiplying the price that the purchased product had when it was bought by
    the number of items bought.


    Because the order lines aren''t included in the XML document sent to the client,
    the client application can''t calculate the total values for the orders, which
    means that the calculation has to be done on the server and the result has to
    be included in the XML document.


    The methods for calculating the value of an order line and the total value for
    an order are good examples of the type of method that many people would prefer
    to put on the OrderLine and Order Domain Model objects but that I prefer to put
    in the Service Layer.


    # Service Layer Design


    This may be a good time to mention that I usually organize my Service Layer around
    the same entities that are used in the Domain Model, rather than by task, which
    is otherwise also popular. This means that if I have an Employee object in the
    Domain Model Layer, I''ll have an EmployeeServices class in the Service Layer.


    For services that don''t need any transaction control, I also usually implement
    the Service Layer methods as static methods so that they can be called without
    instantiating any object from the Service Layer classes.


    In the case at hand, I would thus place a static GetValue() method on the OrderLineServices
    Service Layer class and a static GetTotalValue() method on the OrderServices class.
    These methods will accept the objects they should work with as parameters. This
    means I won''t be calling a method on the Order object itself in the following
    fashion:


    ```

    myOrder.GetTotalValue();

    ```'
