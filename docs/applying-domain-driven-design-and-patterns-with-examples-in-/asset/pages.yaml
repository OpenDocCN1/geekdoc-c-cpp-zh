  md: 'with the most rules that are not bound to the context the entity is used in,
    and it is a good candidate to add to the entity class as behavior. Single-entity-oriented
    Business Logic) is often not a good candidate to add to the entity class as behavior,
    because much of the rules in that category, which are used to make an entity *valid*
    in a given *context*, can and will change when the entity is used in another context.
    Rules in the multi-entity-oriented Business Logic category span more than one
    entity and are therefore not placeable in a single entity, besides the fact they''re
    too bound to the context in which they''re used.


    # ## Pluggable Rules


    To keep an entity usable as a concept that isn''t bound to a given context, the
    problem with context-bound Business Logic rules in the category attribute-oriented
    Business Logic and the category single-entity-oriented Business Logic can be solved
    with *pluggable rules*. Pluggable rules are objects that contain Business Logic
    rules and that are plugged into an entity object at runtime. The advantage of
    this is that the entity classes are not tied to a context they are used in but
    can be used in any context the system design asks for: just create per-context
    a set of pluggable rules objects, or even more per entity, and depending on the
    context state, rules can be applied to the entity by simply setting an object
    reference. The processes that decide which rules objects to plug into entities
    are the processes maintaining the context the entity is used in: the processes
    representing actual business processes.


    # ## Functional Processes


    In the previous section, "The Importance of Functional Research Results," the
    functional research phase was described, and the point was made concerning how
    important it is to keep a strong link between researched functionality and actual
    implementation of that functionality. Often a system has to automate certain *business
    processes*, and the functional research will describe these processes in an abstract
    form. To keep the link between research and implementation as tight as possible,
    it''s a common step to model the actual implementation after the abstract business
    process, resulting in classes that we''ll call *functional processes* because
    they''re more or less dataless classes with sole functionality.


    The functionality processes are the ideal candidates in which to implement multi-entity-oriented
    Business Logic rules. In our example of the Gold Customer, a process to upgrade
    a Customer to a Gold Customer can be implemented as a functional process that
    consumes a Customer entity object and its Order entity objects, updates some fields
    of the Customer entity, and persists that Customer entity after the upgrade process
    is complete. Furthermore, because functional processes actually perform the steps
    of a business process, they are also the place where a context is present in which
    entities are consumed and the only correct place to decide which rules to plug
    into an entity object at a given time T for a given context state.


