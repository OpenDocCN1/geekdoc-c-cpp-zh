    \ order is committed. However, there is a problem concerning transaction handling\
    \ here, a problem that is often overlooked or oversimplified. If you're not careful,\
    \ the check can come out alright, in other words without any discrepancies, but\
    \ when you commit the order, for instance the last item in stock has been \"assigned\"\
    \ to another order and customer. I'm saying that the discrepancy check should\
    \ happen in the same transaction as the order commit and with locks that prevent\
    \ others from \"stealing\" items from the warehouse that you're about to sell.\n\
    \n# ItemStoreDifferent Implementations in Client, Server, and Test\n\nIt might\
    \ be interesting to take a closer look at `ItemStore`. I talked about a local\
    \ client version as well as a middle tier, transactional, version in the text\
    \ earlier. What's that all about? Well, let me show you.\n\nIn Figure A-13 you\
    \ can see how `POrderBuilder` holds a reference to an `ItemStore`. The reference\
    \ is implemented as a public property that is assigned by the application code.\
    \ In the client I use an implementation of `ItemStore` that is, and I'm sorry\
    \ if I overstate this, very different from the transactional implementation that\
    \ I use in the middle tier during order submit. `ItemStore` isn't much of an interface\
    \ to implement when it comes to the number of methods; however, it is very central\
    \ to the `POrderBuilder`. The `ItemStore` is, for instance, used by all methods\
    \ showed in Figure A-13."
  merge: -1
  img_proc: true
- pgno: 494
  md: "# Figure A-13. The relationship between `POrderBuilder` and `ItemStore`\n\n\
    ![](img/89fb3513cb9b6343875aadbfd042005d_494_0.png)\n\nI've implemented the client\
    \ version of `ItemStore` as a simple \"read all items from store and cache.\"\
    \ This strategy is fine as long as the number of items isn't too great. If it\
    \ comes to that, it's no big deal to implement a version that queries the middle\
    \ tier \"smarter.\" In the client, when the order taker has the privilege to \"\
    work with an order,\" a `POrderBuilder` is instantiated and assigned an instance\
    \ of the client side `ItemStore` implementation. At any time, a `CheckDiscrepancies()`\
    \ against the client `ItemStore` is possible.\n\nIf the customer accepts, the\
    \ next step is submission of the order to the middle tier. The `POrderBuilder`\
    \ instance is serialized over the wire, but not the `ItemStore` instance. The\
    \ reference to `ItemStore` is marked as `[NonSerialized]`. In the facade object,\
    \ a connection/transaction is created and the job to take the order is handed\
    \ over to the process object (the business object). This is shown in here:\n\n\
    ```\n```csharp\npublic POrderDiscrepancyReport TakeOrder(POrderBuilder order)\n\
    {\n    POrder bo = new POrder();\n    CnTxWrap cn =\n        CnTxWrap.BeginTransaction(bo.CreateConnectionForMe()\
    \ );\n    try\n    {\n        POrderDiscrepancyReport res = bo.TakeOrder(cn, order);\n\
    \        cn.Commit();\n        return res;\n    }\n    catch\n    {\n        cn.Rollback();\n\
    \        throw;\n    }\n}\n```\n```\n\nWhile we're at it, let's take a look at\
    \ the process object's `TakeOrder()` method in the following listing:\n\n```\n\
    ```csharp\n[PrincipalPermission(SecurityAction.Demand, Role = Roles.User)]\n[PrincipalPermission(SecurityAction.Demand,\
    \ Role =\n    @\"InternalUnitTesting\")]\npublic POrderDiscrepancyReport TakeOrder(CnTxWrap\
    \ cn,\n    POrderBuilder order)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 495
  md: "```\n{\n    ItemStore itmStore = new TxItemStore(cn);\n    order.ItemStore\
    \ = itmStore;\n    POrderDiscrepancyReport res = order.CheckDiscrepancies();\n\
    \n    POrderPh ordr =\n        ((POrderBuilder.IOrderInternal)order.POrder).POrder;\n\
    \    new POrder().InsertNoRBS(cn, ordr);\n\n    OrderLine olproc = new OrderLine();\n\
    \    for(int i=0; i<order.OrderLineCount; i++)\n    {\n        OrderLinePh ol\
    \ =\n            ((POrderBuilder.IOrderLineInternal)order[i]).OrderLine;\n   \
    \     olproc.InsertNoRBS(cn, ol);\n    }\n\n    return res;\n}\n```\n\nYou can\
    \ see how ItemStore is actually an instance of TxItemStore that is passed the\
    \ parameter cn containing/wrapping a database connection and an ongoing transaction.\
    \ This implementation of ItemStore reads the store with an UPDLOCK hint (or whatever\
    \ method you prefer), causing the store to be locked for update by others at this\
    \ point. Granted, this is something of a bottleneck but correctness is high.\n\
    \nCheckDiscrepancies() will throw an exception in case there are severe business\
    \ rule violations, such as if the global maximum limit is exceeded. If the only\
    \ discrepancies are price differences or stock shortage, these will be noted in\
    \ the report, but the order will be fully placed.\n\nDo you remember what I said\
    \ about double-checking business rules that \"run\" on both the client and the\
    \ server? The essence is never to trust the client. Well, the checking is done\
    \ in CheckDiscrepancies(). For instance, any tampering with the prices on the\
    \ client side would come out as a discrepancy. In this particular situation, the\
    \ client is running in your controlled environment, but you should nevertheless\
    \ be cautious. Code executing on the server is much safer than code on the client.\
    \ Remember that the server can't know (not generally) if the caller is your program\
    \ sending information on the wire or if it's another program.\n\n# Some Final\
    \ Points\n\nLet's be honest. This isn't what most people would call pure OO. For\
    \ instance, I'm not afraid of using somewhat \"weaker\" object references than\
    \ the language itself provides. Have a look at my item reference in the form of\
    \ a Guid in Figure A-13. But if you're a bit daring, ask yourself what's so obvious\
    \ about using \"pointer\" references anyway. Compare it to proxy references, which\
    \ give you an option of late/lazy instantiation.\n\nWhat I want to say is don't\
    \ get hung up on what's right and what's wrong. Generally, there is no such thing\
    \ (I'm sure Jimmy agrees). Get the job done. Supply your business with the software\
    \ it needs. Know what your design goals are (for instance, having the business\
    \ rules in one place), and"
  merge: -1
