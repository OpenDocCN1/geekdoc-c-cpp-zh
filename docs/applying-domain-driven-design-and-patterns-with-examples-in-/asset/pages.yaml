  md: "# # Requirements for a Basic Rules API Related to Persistence\n\nNow that we\
    \ have decided on a specific context for now, that of the transition to the state\
    \ of persisted, let's start the discussion about an API regarding that. We will\
    \ get back to other (and from the model's point of view, more interesting) state\
    \ transition problems, both general and specific, afterward.\n\n# ## Note\n\n\
    As usual, the discussion here is really more about some *generic* ideas than the\
    \ API itself. I'm not trying to tell you how you should create your inter-faces/APIs,\
    \ I'm just trying to give my thoughts on the subject and hope that you may be\
    \ prompted to find your own solutions.\n\nI'd like to take a new code example\
    \ where we apply the idea about being proactive regarding not persisting exceptional\
    \ state errors and/or problems that will throw exceptions from the persistence\
    \ engine.\n\nI'm going for the latter: showing a situation when the persistence\
    \ engine would throw an exception. (Again, the former problem should be hard to\
    \ get to. If everything works as expected, that state shouldn't be possible to\
    \ reach.)\n\nAssume that `Order` has `Note`, and `Note` is defined as `VARCHAR(30)`\
    \ in the database. Depending on your solution for persistence, you might get an\
    \ exception when trying to save a long string, or you will lose information silently.\
    \ The important thing here is that I will proactively catch the problem. It could\
    \ look like this:\n\n```\n```csharp\n[Test]\npublic void CantExceedStringLengthWhenPersisting()\n\
    {\n    Order o = new Order(new Customer());\n    o.Note = \"0123456789012345678901234567890\"\
    ;\n\n    Assert.IsFalse(o.IsValidRegardingPersistence);\n}\n```\n```\n\nSo instead\
    \ of asking if the order is `IsValid`, I changed the name of the property to `IsValidRegardingPersistence`\
    \ to make it very clear that the order isn't valid in the context of being"
