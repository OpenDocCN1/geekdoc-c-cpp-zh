  md: 'the question. I quickly realized that Domain Model was more or less the de
    facto standard in their case.


    To set all this straight, I''d like to clarify two things. First, I do *not* say
    that you should choose the Domain Model pattern because of performance reasons.
    Rather that you often *can* choose the Domain Model pattern without getting performance
    problems.


    Second, I do *not* say that to be able to use a model focus, you need a certain
    technology. Different technologies are more or less appropriate for expressing
    the model in software in close resemblance with the domain. Of course, there is
    not a single technology that is always best. Different domains and different problems
    set different factors for what is an appropriate technology. So I see technology
    as an enabler. Different technologies can be better enablers than others.


    To summarize this, it''s very much a matter of design if the Domain Model pattern
    can be used efficiently enough or not.


    Some good news regarding this is that there is lots of good information to gain.
    Domain-Driven Design and its style for structuring Domain Models provides lots
    of valuable help, and that is something we will spend a lot of time trying out
    in the book.


    # ## One Root Structure


    So if we choose to focus on a Domain Model, it means that we will get all the
    people on the project to buy into the model. This goes for the developers, of
    course.


    It might even be that the DBAs can agree on seeing the Domain Model as the root,
    even though the database design will be slightly different. If so, we have probably
    accomplished getting the DBA to speak the ubiquitous language, too! (As a matter
    of fact, the more you can get your DBA to like the Domain Model and adhere to
    it, the easier it will be to implement it. This is because you will need to create
    less mapping code if the database design isn''t radically different from the Domain
    Model, but more like a different view of the same model.) Oh, and even the users
    could buy into the Domain Model. Sure, different stakeholders will have different
    needs from the Domain Model, different views regarding the detail level, for example,
    but it''s still one root structure structure to live with, grow with, change....


    As you will find, I''m going to put a lot of energy into discussing Domain Model-based
    solutions in this book from now on, but before doing that, I''d like to talk a
    bit about other architecture values. Let''s leave the domain focus for a while
    and discuss some more technically focused areas. First is how to deal with the
    database.


    # ## Handle the Database with Care


    In the past, I''ve thought a lot about performance when building systems. For
    example, I used to write all database access as handwritten, stored procedures.
    Doing this is usually highly effective performance-wise during runtime, especially
    if you don''t just have CRUD (Create Read Update Delete) behavior for one instancesuch
    as a single customerat a time, but have "smarter" stored'
