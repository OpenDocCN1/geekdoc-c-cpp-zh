    # Replacing Collaborators with Mock Objects\n\nA notable variation to stubs is\
    \ the concept of mock object. A mock object is a simulation of a real object.\
    \ It replaces a collaborator and provides expected values to the code under test.\
    \ In addition, it supplies a mechanism to set up expectations about how it should\
    \ be used and can provide some self-validation based on those expectations.\n\n\
    To illustrate what this means, let's create a test that focuses on the interaction\
    \ of UserBC with the collaborating objects. This time we will use a popular .NET\
    \ mock objects framework called NMock [NMock]. A nice feature of this open source\
    \ framework is that it uses reflection to generate mocks dynamically from existing\
    \ classes or interfaces at run time.\n\n```\n[Test]\npublic void TestUserBCSaveUserInteractsWell()\n\
    {\n    // (1 - Setup) Create mocks dynamically based on interface\n    DynamicMock\
    \ mockUser =\n        new NMock.DynamicMock(typeof(IUserInfo));\n    DynamicMock\
    \ mockUserDao =\n        new DynamicMock(typeof(IUserDao));\n\n    // Set up canned\
    \ values (same as stubs)\n    mockUser.SetupResult(\"FirstName\", \"Claudio\"\
    ,\n        typeof(string));\n    ...\n    mockUser.SetupResult(\"ID\", NEW_OBJECT_ID,\
    \ typeof(int));\n    mockUser.SetupResult(\"IsNew\", true, typeof(bool));\n\n\
    \    // Generate mock instances (need to cast)\n    IUserInfo user = (IUserInfo)\
    \ mockUser.MockInstance;\n    IUserDao daoUser = (IUserDao) mockUserDao.MockInstance;\n\
