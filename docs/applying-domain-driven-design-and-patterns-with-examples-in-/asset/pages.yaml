- pgno: 16
  md: '# # 中级统计工作实务


    **【说明】** 根据全国统计专业技术资格考试大纲，中级统计师考试统计工作实务科目，主要考察统计调查设计、经济统计、国民经济核算、统计法规等内容。


    # ## 第一章 统计调查设计


    本章重点内容包括：统计调查总体方案设计、统计调查方法选择、调查问卷设计、统计调查组织与实施。重点掌握概率抽样与非概率抽样的区别及应用场景。


    | 调查方法 | 抽样方式 | 适用场景 |

    | --- | --- | --- |

    | 全面调查 | 非抽样 | 经济普查、人口普查 |

    | 抽样调查 | 概率抽样 | 居民收支调查、价格调查 |

    | 典型调查 | 非概率抽样 | 政策快速评估 |

    | 重点调查 | 非概率抽样 | 重点企业监测 |


    # ## 第二章 经济统计


    经济统计部分考察的内容包括：生产活动统计、收入分配统计、价格统计、财政统计、金融统计等。需要掌握各种经济指标的含义和计算方法。


    > > 重要提示：国内生产总值（GDP）是反映一国一定时期内生产活动最终成果的核心指标，计算方法包括生产法、收入法和支出法三种。


    # ## 第三章 国民经济核算


    本章讲解了国民经济核算的基本框架、五大核算表（国内生产总值表、投入产出表、资金流量表、国际收支平衡表、资产负债表）的基本结构及相互关系。


    ```

    GDP = 总消费 + 总投资 + 净出口

    GDP = 劳动者报酬 + 生产税净额 + 固定资产折旧 + 营业盈余

    ```


    以上公式为支出法和收入法核算GDP的基本表达式，考试中常以计算分析题形式出现。'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'complements DDD in a different way. In the absence of a focus on refining an
    ever more useful model, TDD is prone to fragmented applications, where a single-minded
    attack on one feature at a time leads to an unextendable system. A comprehensive
    test suite actually allows such a team to continue making progress longer than
    would be possible without it, but this is just the basest value of TDD.


    At its best, the test suite is the laboratory for the domain model and a technical
    expression of the ubiquitous language. Tests of a particular style drive the modeling
    process forward and keep it focused. This book steps us through examples of developing
    such tests.


    Jimmy Nilsson has a rare combination of self-confidence and humility, which I
    have observed to be characteristic of the best designers. We get a glimpse of
    how he got to his current understanding as he tells us what he used to believe
    and why that opinion changed, which helps to take the reader past the specifics
    of the techniques to the underlying principles. This humility makes him open to
    a wide range of influences, which gives us this fusion of ideas from different
    sources. He has tried a lot of things and has let his results and experience be
    his guide. His conclusions are not presented as revealed truth, but as his best
    understanding so far with an implicit recognition that we never have complete
    knowledge. All this makes the advice more useful to the reader. And this attitude,
    in itself, illustrates an important element of successful software development
    leadership.


    **Eric Evans**'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Preface: Bridging Gaps


    On the cover of this book is a picture of the Øresund Bridge that connects Sweden
    and Denmark. It seems that all software architecture books must have a bridge
    on the cover, but there are some additional reasons the bridge is appropriate
    for this book.


    This bridge replaced a ferry that I took many times as a child. I enjoy very much
    driving over it even after dozens of times


    On a personal note, my father was on the team that built the highest parts of
    the bridge.


    But beyond these, the main reason is that this book is very much about bridging
    gaps; bridging gaps between users and developers; bridging gaps between business
    and software; bridging gaps between logic and storage. Bridging gaps between "DB-guys"
    and "OO-guys"...


    I will refrain from making a joke about the Bridge pattern [GoF Design Patterns].
    Hey, how geeky can a preface be?


    # Focus of This Book


    The main focus of the book is how a Domain Model could be constructed to be clean,
    yet still be persistence-friendly. It shows what the persistence solution could
    look like for such a Domain Model and especially how to bridge that gap between
    the Domain Model and the database.


    Put another way, my vision has been to provide a book that will put Eric Evans''
    Domain-Driven Design [Evans DDD] and Martin Fowler''s Patterns of Enterprise Application
    Architecture [Fowler PoEAA] in context.


    DDD might be perceived as a bit abstract. Therefore, more concrete examples are
    helpful regarding persistence, for example. Mine may be fairly basic, but it is
    a platform to start from. This book not only explains how to use the patterns,
    but also how the patterns are used in O/R Mappers, for example.


    It has become very clear to me that "one size does not fit all" when it comes
    to architecture. Having said that, patterns have proven to be general enough to
    use and reuse in context after context.


    The focus isn''t on the patterns themselves, but this book uses patterns in every
    chapter as a tool and language for discussing different design aspects. A nice
    side effect is that patterns-ignorant readers will also gain some insight and
    interest into patterns along the way.


    That also goes for TDD. Not all developers have become interested in this yet.
    I think it''s especially common in the .NET community that TDD (just as patterns)
    is considered a niche technique at best, or it might even be totally unknown.
    Readers will learn how to apply TDD.'
  merge: -1
  img_proc: true
