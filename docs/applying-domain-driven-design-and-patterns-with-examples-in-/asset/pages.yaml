- pgno: 126
  md: "# Note\n\nDo you remember that I said that a failing test is red and a test\
    \ that executes successfully is green, but that a need for refactoring doesn't\
    \ have a color? As a matter of fact, the refactoring tool ReSharper uses orange\
    \ to tell you that refactoring is needed (according to ReSharper, that is). So\
    \ before starting a new iteration, you should also see to it that you change the\
    \ orange into green by cleaning up the code before moving on. Of course, this\
    \ won't make it possible for you to stop thinking about what code is smelly yourself;\
    \ it's just a help.\n\nWhen you see a developer in the flow with a good refactoring\
    \ tool in his hands, the speed at which he moves is just amazing, and without\
    \ creating bad code. It's rather the opposite regarding the code quality!\n\n\
    So far we have mostly dealt with simple stuff. There's nothing wrong with that,\
    \ of course, but from time to time you just aren't happy with the code even after\
    \ cleaning up the small things. It might also be that you have a situation where\
    \ there is a steady stream of new problems that needs to be cleaned up.\n\n# Prevent\
    \ Growing Problems\n\nPerhaps you think that using patterns is the natural solution\
    \ to that problem. The problem with patterns is that they are traditionally used\
    \ for up-front design, which often means too much guesswork (whereas refactoring,\
    \ as we have discussed, is used later on during development). Should you choose\
    \ patterns or refactoring?\n\nBefore discussing that any further, I think a short\
    \ example of another pattern is in order. I'd like to discuss the Template Method\
    \ pattern [GoF Design Patterns]. The idea is that you define the overall algorithm,\
    \ or template method, in a base class like this:\n\n```\npublic abstract class\
    \ TotalBase\n{\n    public void TotalAlgorithm()\n    {\n        _DoSomeStuff();\n\
    \n        VariationPoint();\n\n        _DoSomeMoreStuff();\n    }\n\n    protected\
    \ abstract void VariationPoint();\n}\n```"
