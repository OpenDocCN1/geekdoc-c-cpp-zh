  md: "# Inversion of Control and Dependency Injection\n\nBy Erik Dörnenburg\n\nPrevious\
    \ chapters discussed how domain objects and the corresponding infrastructure can\
    \ be designed and developed. In this section, I want to present a particular design\
    \ technique, or pattern, that can be used to assemble objects at runtime. The\
    \ general principle is known as *Inversion of Control* and the particular pattern\
    \ has been named *Dependency Injection.*\n\n# No Object Is an Island\n\nAlmost\
    \ any object in our applications that provides business functionality depends\
    \ on other objects. These can be objects that provide data or a service of some\
    \ form. When we design and develop our objects using TDD, we usually explicitly\
    \ provide the objects required, and often we use stubs or mocks in place of them\
    \ to isolate the object under test. At runtime, however, our objects require a\
    \ real implementation, and in one way or another all objects in our application\
    \ must be instantiated and wired up.\n\nThe most common approach to resolving\
    \ a dependency between one object and another is to place the responsibility for\
    \ creating or acquiring the dependent object with the object that has the dependency.\
    \ The simplest way to do this is to have the object that has the dependency instantiate\
    \ the object it requires.\n\nAs an example, let us assume we are creating a pricer,\
    \ an object that calculates the price for a financial instrument such as a bond.\
    \ Of course, the pricer needs the bond that should be priced, but we decide that\
    \ this is not part of the state of the pricer object and is to be passed in with\
    \ each pricing request. Therefore, our class could look as follows:\n\n```\n```\n\
    public class BondPricer {\n    public double GetPrice(Bond bond) {\n        /*\
    \ do something really complicated here */\n    }\n}\n```\n```\n\nThe price of\
    \ the bond depends on other factors, though, and one example is something called\
    \ a discount curve. (It does not matter whether you are familiar with the domain\
    \ or not; for this example, the pricer could also depend on a wombat and nothing\
    \ would be different.) A curve can be used to price many different bonds and remains\
    \ relatively constant. We therefore decide that the curve should be part of the\
    \ state of the pricer and keep it in a member variable which is initialized in\
    \ the constructor.\n\n```\n```\n//BondPricer\nprivate readonly DiscountCurve curve;\n\
    ```\n```"
