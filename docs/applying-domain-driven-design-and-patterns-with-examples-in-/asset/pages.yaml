- pgno: 12
  md: 'Gunther Lenz, program manager and author


    > > *"Not so very long ago, I blogged about my overall feeling that as architects
    we may be failing to provide enough guidance for developers to sort through the
    hundreds of different ways to build software. There are many ideas out there that
    are excellent by themselves and come with perfectly well-reasoned justifications,
    working examples, and an impassioned community of believers. Very few of them
    can be used by themselves to build applications, much less systems of applications
    and services. This leaves it up to developers to find ways to put the individual
    ideas together into applications. This is always much harder in reality than the
    proponents of any particular approach, like to think about. Developers, on the
    other hand, need to get some work done and often don''t care to wade through all
    this every time they start a new application. This is true even when they are
    truly interested in the potential gains of new approaches or ideas. Jimmy’s book
    is pointed directly at this problem. How do you apply some of the great ideas
    that have come forward in the last few years to real, live development? I think
    this book does a great job of both explaining the underlying ideas with enough
    detail to make them practical and putting the group of ideas together in a way
    that will help developers see a path from start to end. Domain-Driven Design,
    Test-Driven Development, Dependency Injection, persistence, and many other practical
    issues are covered. After reading this book, I think a reader will really be able
    to take these important ideas and use them together effectively. Considering the
    great value of the individual ideas presented, but the limited numbers of examples
    of people really using them, this work represents a great win for us all. I highly
    recommend it."*


    Philip Nelson, chief scientist for PAi, xcsk i w inn.org/community/blogs/panmanphil/default.aspx


    > > *"Taking the leap from a data-centric mindset to the deeper realization of
    OOP found in Domain-Driven Design, Test-Driven Development, object/relational
    persistence, and other Agile methods and patterns can be an arduous and disorienting
    undertaking for the uninitiated.*


    > > *"With a patient, pragmatic, and mentoring style, Jimmy takes the reader along
    for the leap, exploring the issues and the options, giving sound advice along
    the way. This book shows you how to integrate the various methods and patterns
    into a fully coherent approach to designing and creating superbly maintainable
    .Net software."*


    George Hicks, senior developer for Property Works


    > > *"If you have ever read his blog, you already know that Jimmy Nilsson likes
    to challenge established ‘truths’ in the .NET community, looking for better ways
    to design software. He acknowledges that software design is hard, and that one-size-fits-all
    solutions do not work; pros and cons have to be balanced in context of the problem
    at hand before ruling a winner. For building testable and maintainable software
    with complex business requirements, Jimmy chooses to use Domain-Driven Design,
    and he brings along a toolbox of proven and established principles, patterns,
    and practices to carry it out. Jimmy’s informal writing style and use of examples
    and Test-Driven Development make this book very approachable, especially considering
    all the ground that is covered. Because he is on top of the DDD stuff, Jimmy (and
    friends) brings you distilled knowledge on, and references to, many of the most
    valuable techniques and resources within software development today. I believe
    this book to be a valuable guide to applying DDD, and for developers who want
    to improve their general design skills."*


    Andreas Brink, software developer'
  merge: -1
  img_proc: true
