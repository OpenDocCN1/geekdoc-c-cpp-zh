- pgno: 21
  md: 'Even though we try to push the infrastructure aspects as far off in the future
    as possible, it''s good to think a little bit ahead and prepare the Domain Model
    for the infrastructure needs. In this chapter, there is a lot of discussion about
    pros and cons of Persistence Ignorant Domain Models.


    +   - [Chapter 7](#), "Let the Rules Rule"


    This chapter talks about business rules in the form of validation and how a Domain
    Model-based solution can deal with the need for such rules, connecting back to
    the requirements set up in [Chapter 4](#).


    # Part III: Applying PoEAA


    In this part, we put several of the patterns in Fowler''s *Patterns of Enterprise
    Application Architecture* [Fowler PoEAA] into context by discussing what we need
    from the infrastructure for providing persistence support to our Domain Model.
    We will take a look at how those requirements are fulfilled by an example tool.


    +   - [Chapter 8](#), "Infrastructure for Persistence"


    When we have a fairly good Domain Model, it''s time to think about infrastructure,
    and the main type of infrastructure in this book is infrastructure for persistence.
    This chapter discusses different properties of persistence solutions and how to
    categorize a certain solution.


    +   - [Chapter 9](#), "Putting NHibernate into Action"


    This chapter uses the categorizations of the prior chapter with an example of
    a persistence solution, namely NHibernate [NHibernate].


    # Part IV: What''s Next?


    In this part, there is a focus on other design techniques to keep an eye on and
    start using. The other focus is on how you can deal with the presentation layer
    when it comes to bridging that gap to the Domain Model, but also how to deal with
    developer testing of the UI. This part is almost exclusively written by guest
    authors.


    +   - [Chapter 10](#), "Design Techniques to Embrace"


    After a short discussion about Bounded Context, this chapter discusses design
    techniques to keep an eye on now and for the future, such as Service Orientation,
    Dependency Injection/Inversion of Control, and Aspect Orientation.


    +   - [Chapter 11](#), "Focus on the UI"


    This chapter focuses on how the UI can be connected to the Domain Model and how
    to increase testability for the user interface when using a Domain Model, both
    for rich client applications and Web applications.'
