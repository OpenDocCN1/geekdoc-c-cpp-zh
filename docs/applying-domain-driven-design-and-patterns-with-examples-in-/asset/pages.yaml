    pc.RegisterComponentImplementation ("pricer", typeof(BondPricer));

    ```


    By placing the declarations into code, we remove redundancy and we get better
    support from the IDE because it is now able to detect misspelled type names, and
    it can also safely rename types in automated refactorings.


    The objects are obtained from the container in almost the same way as they are
