- pgno: 364
  md: '# Controlling Concurrency


    Finally, we need support for controlling concurrency. Fowler [Fowler PoEAA] describes
    the following solutions to the problem:


    +   - Coarse-Grained Lock

    +   - Implicit Lock

    +   - Optimistic Offline Lock

    +   - Pessimistic Offline Lock


    NHibernate deals with Optimistic Offline Lock if you add a <version> tag to the
    entities, like this:


    ```

    <version name="Version" access="field.camelcase-underscore" />

    ```


    Then, if the row in the database has another value of the version column compared
    to what you expect it to be at persist time, someone else has updated the row,
    and there''s a conflict in concurrency (and you''ll get a StaleObjectStateException
    ).


    You''ll have to deal with the other three mechanisms yourself. NHibernate doesn''t
    support them out of the box.


    # Bonus: Validation Hooks


    Something that wasn''t discussed in Chapter 8 but that I added here as a small
    bonus is validation hooks. NHibernate has an IValidatable interface that will
    get calls by NHibernate at Flush() .


    But then I need to reference the nhibernate.dll in the Domain Model, so I prefer
    a solution like the one I used in Chapter 7, "Let the Rules Rule." I mean, I can
    use an IInterceptor (yet another NHibernate interface, but in this case not used
    by the Domain Model) implementation for checking the rules implicitly and thereby
    use whatever interface of my Domain Model classes I want to. (And using an interface
    for the Domain Model classes isn''t necessary at all, of course.)


    To use a custom IInterceptor implementation, you provide it as a parameter when
    instantiating ISession like this:


    ```

    //A consumer

    _session = NHConfig.GetSessionFactory()

    .OpenSession(new MyCustomInterceptorImpl());

    ```


    Just watch out that you can''t do everything in the validation code when using
    this approach; for example, you can''t call out by using the same ISession instance,
    which might create a problem here and there, but we have touched on some strategies
    that can be used for dealing with this problem in Chapter 7 , so I won''t repeat
    those here.'
