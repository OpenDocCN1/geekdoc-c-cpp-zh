- pgno: 437
  md: '# Test-Driving a Web Form


    By Ingemar Lundberg


    How can you unit test and thereby also use TDD for your GUI?


    In this short section I''ll try to give you a general idea of how you can unit
    test your GUI. In the process, techniques such as self-shunting [Feathers Self-Shunt]
    and mocking will be shown. However, the TDD process in itself is not described.
    Self-shunting is (very briefly) a technique where you''re letting the test class
    also act as a stub or mock.


    # Background


    Typical GUI code consists of a bunch of callback methods that are called as a
    result of something the user does with the GUI, such as pressing a button. Typically,
    a callback method does something with a domain object (or possibly even executes
    some SQL). The problem is that the callback methods get called from an environment,
    such as WinForms or ASP.NET, that isn''t easy to hook up in your NUnit tests.
    You simply can''t do it.


    The goal is to have as little untested code as possible. The first thing to do
    is to move as much code as possible out of the callback methods. If the code isn''t
    tangled in the callback methods, you''ve created the possibility to unit test
    it.


    But that isn''t enough. What about the state of the GUI? You know, things like
    if the user has selected that row, this and that button should be disabled. This
    will not be covered simply by moving code out of the callback methods. Don''t
    get me wrong it is a good first step.


    To take it further, we need to use the sharpest tool in our box: abstraction.
    We need a model of the interaction, and we need an abstraction of the form we''re
    programming. At this point, I''ll stop talking about the GUI in general terms
    and start talking about a form, or more specifically about an ASP.NET Web Form.
    However, this technique is also applicable to Windows Forms, and it is even platform
    neutral.


    # An Example


    This is, in my opinion, by far the hardest part of writing about programming finding
    a problem scenario that could be used to illustrate your point without sidetracking
    the reader. I need an example that makes my GUI change state; in other words,
    something needs to be disabled when the user does something special.


    In Sweden we have the tradition of only letting our kids have candy on Saturdays.
    Let''s say that I have one box of chocolate bars, one of lollipops, and one of
    portion-sized peanut bags. The kids'
