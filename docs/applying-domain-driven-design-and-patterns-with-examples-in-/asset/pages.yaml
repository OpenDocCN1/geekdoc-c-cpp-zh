    That principle is the ideal. In reality, it will be hard not to break certain
    rules during a multiple step action. For example, should you disallow the change
    of the name of a customer to a name that the rule thinks is too short? Well, perhaps,
    but it might just prevent the user from doing what he wants to do: namely deleting
    the old name and inserting a new one instead.


    It''s possible to deal with this by having a method called `Rename(string newName)`
    that takes care of the work. During the execution of the method, the state of
    the object isn''t correct, but we only consider it a problem before and after
    the method execution.


    # Note


    This is in line with invariants according to *Design by Contract* [Meyer OOSC].
    Such invariants are like assertions that the instance should abide by at all times,
    both before the method execution and after. The only exception is *during* the
    method execution.


    Another approach is to simply not set the property until you''ve finished with
    the change. Let''s see if I can come up with another example. Assume that there
    are two fields, and either both field have to be set or neither of them. Again,
    a method would solve the problem, but if you scale up this problem or consider
    that the UI would prefer to have the properties exposed with setters, it''s clear
    that it''s hard not to get into an inconsistent state there from time to time.


    Another question might be if we should trust that we *didn''t* reach an invalid
    state? And *if* we against all odds did reach an invalid state (a *really* invalid
    one, such as an erroneous change when the state of the `order` is Ordered), should
    we allow that to be stored?


    It might be that the database won''t allow us to have that protection for some
    error situations. But even if you try hard to let the database take care of itself
    regarding rules, you will probably let some things slip through, and if you have
    moved to Domain Model-focused way of building applications, your database is probably
    not as rigid when it comes to self-protection. After all, domain-focused rules
    that are somewhat advanced are most often *much* easier to express in the Domain
    Model than in a Relational database, and you also *want* to have them in the Domain
    Model.


    The question is: can we trust the "environment"? I mean, can we trust that we
