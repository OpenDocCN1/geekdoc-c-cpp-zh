- pgno: 459
  md: 'look slightly different for different presentation purposes, in which case
    the Identity Map is of no help at all.


    This could lead to conflicts. On the other hand, it also opens up the possibility
    of more sophisticated, disconnected data management.


    For example, a mapped set of PM objects may be worked with for a long time in
    isolation in some wizard. At the last step of the wizard, the user could decide
    to commit the work to the Domain Model (and then to commit the updated Domain
    Model to the database) or to discard the changes. Had the user been working with
    a set of PM objects that directly wrapped the Domain Model objects, this option
    of canceling the changes would not have been available because the Domain Model
    objects would have been continuously updated when the user worked in the wizard!


    Certainly, the option of canceling so that the changes aren''t forwarded to the
    database is there even without the PM, assuming your Domain Model supports disconnected
    operations (for example, by using a Unit of Work [Fowler PoEAA]). However, if
    you press cancel at the end of a wizard that works directly with the Domain Model,
    even if your database is spared from the changes, your Domain Model will still
    have been changed so that when you present it in the next screen of your application,
    the changes are visible.


    If you are prepared to throw away your Domain Model if the user cancels, there
    is no problem. There is also no problem if the Unit of Work supports full rollback
    of the state in the Domain Model. But if you are writing a rich client where you
    intend to let the Domain Model live for the scope of the application (for example,
    you don''t want to throw the DM away if the user cancels) and your Unit of Work
    does not support full rollbacks, you may well run into this issue.


    In some situations, you''ll find that wrapping best suits your needs, while mapping
    works better in other situations. Sometimes you''ll use both in the same application,
    perhaps using wrapping as the default approach but using mapping just for wizards
    or other "batch jobs" that should be possible to discard without committing.


    # Final Thoughts


    Sometimes you''re just plain lucky. Whenever you''re able to present your Domain
    Model to the user right away (or with a minor amount of supportive hacks) you
    should thank your lucky stars, because there''s no getting around the fact that
    connecting a PM to a Domain Model can be quite headache-inducing.


    The headache is significantly reduced if you decide to go with "flattened" PM
    objects, because most of the more severe issues arise directly as a result of
    trying to manage reference properties.


    The choice between wrapping and mapping is influenced by a number of factors,
    including how state is managed and the opportunities for reducing the amount of
    boilerplate code in your applications via code generation (wrapping) or via using
    an O/O Mapping framework (mapping).


    By trying to keep structural transformations outside the scope of any frameworks
    or code generators you employ (instead placing all such advanced transformation
    logic in code within your PM classes and hiding non-transformed members in the
    PM by making them protected), you greatly reduce the complexity required by such
    frameworks/code generators and thereby improve your chances of writing something
    useful yourself or finding something available online.'
