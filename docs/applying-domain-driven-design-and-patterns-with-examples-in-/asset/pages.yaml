- pgno: 349
  md: 'to optimize every call to the database because it most often doesn''t matter
    much anyway. Instead, you can always go to the code and optimize the places where
    it really is needed. Still, the requirement is set because I don''t want to optimize
    at all more than is necessary, and when I optimize I don''t want to have to go
    to ordinary SQL more than is absolutely necessary.


    # Note


    I hope this didn''t sound like "avoid SQL at any price" or "use only O/R Mappers
    that are extremely function-rich."


    SQL is great, and I like using it when that''s the best solution.


    So what are the problem areas to look out for regarding NHibernate? An obvious
    one I think is that when we move processing out from the database, for example,
    we avoid having logic in stored procedures (and actually avoid stored procedures
    altogether). This is intentional because we want to achieve a better maintenance
    story by having all the logic in the Domain Model and its nearby surroundings.
    (And again, when we really have to, we can optimize the rare places with stored
    procedures.)


    Another typical example of a problem area is when we do processing that is normally
    set-based, such as increasing a column value of all instances of a certain class
    (for example, setting the Price of all products to Price = Price * 1.1). Doing
    that in SQL is perfectly normal and recommended. With NHibernate, the sets will
    be single row sets regarding how it''s processed against the database. This can
    also be a good thing, because the validation rules are most often instance-based,
    and we want them to be processed for large updates, too. However, the cost might
    be too high.


    A third problem is that the consumer of the Domain Model probably doesn''t care
    about the database at all. He or she might create a huge load on the back-end
    without realizing it or actually be almost incapable of realizing it. That''s
    one drawback to the nice isolation and abstraction the Domain Model provides.


    A fourth problem is that of selective updates if a certain criterion is met, such
    as


    ```

    UPDATE x SET y = 42 WHERE y >= 1

    ```


    That has to be dealt with by a pre-read instead.


    A fifth is the "reading way too much" problem when too many complex types are
    read even though just a tiny amount of information is really needed. This is especially
    common if you haven''t used a somewhat careful Aggregate design and haven''t used
    Lazy Load.


    Yet another classic problem is that of n+1 selects. Assume you fetch all Orders
    in the database and that OrderLines are Lazy Loaded. Then you touch each Order
    and its OrderLines. Then there will be a new SELECT issued for each Order''s OrderLines.
    If you don''t use Lazy Load, the problem will be smaller, but then you run the
    risk of getting into the problem just mentioned of fetching too much in some scenarios.'
  merge: -1
  img_proc: true
