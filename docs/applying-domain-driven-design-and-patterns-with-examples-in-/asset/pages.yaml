- pgno: 481
  md: 'The advantage of modeling the research findings with techniques like NIAM or
    ORM is that the abstract model both documents the research findings during the
    functional research phase and at the same time it is the source for the relational
    model the application is going to work with. Using tools like Microsoft Visio,
    a relational model can be generated by generating an E/R model from an NIAM/ORM
    model, which can be used to construct a physical relational model in a database
    system. The metadata forming the definition of the relational model in the database
    system can then be used to generate classes and construct mappings.


    The advantage of this is that the class hierarchy the developers work with has
    a theoretical basis in the research performed at the start of the project. This
    means that when something in the design of the application changes, such as a
    piece of functionality, the same path can be followed: the NIAM model changes,
    the relational model is adjusted with the new E/R model created with the updated
    NIAM model, and the classes are adjusted to comply to the new E/R model. The other
    way around is also true: to find a reason for code constructs the developer has
    to work with. For example, for code constructs to traverse relationships between
    entity instance objects, you only have to follow back the path from the class
    to the functional research results and the theoretical basis for the code constructs
    is revealed. This strong connection between a theoretical basis and actual code
    is key to a successful, maintainable software system.


    # Functional Processes as Data Consumers and Location of Business Logic


    As the real entity definitions live in the relational model, inside the database,
    and in-memory instances of entities are just mirrors of real instances of entities
    in the database, there is no place for behavior, or Business Logic rules, in these
    entities. Of course, adding behavior to the entity classes is easy. The question
    is whether this is logical, when entity classes represent entity definitions in
    the relational model. The answer depends on the category of the Business Logic
    you want to add to the entity as behavior. There are roughly three categories:


    +   - Attribute-oriented Business Logic

    +   - Single-entity-oriented Business Logic

    +   - Multi-entity-oriented Business Logic


    Attribute-oriented Business Logic is the category that contains rules like `OrderId
    > 0`. These are very simple rules that act like constraints placed on a single
    entity field. Rules in this category can be enforced when an entity field is set
    to a value.


    The category of single-entity-oriented Business Logic contains rules like `ShippingDate
    >= OrderDate`, and those also act like constraints. Rules in this category can
    be enforced when an entity is loaded into an entity object in memory, saved into
    the persistent storage, or to test if an entity is valid in a given context.


    The multi-entity-oriented Business Logic category contains rules spanning more
    than one entity: for example, the rule to check if a `Customer` is a Gold Customer.
    To make that rule true, it has to consult `Order` entities related to that `Customer`
    and `Order Detail` entities related to these `Order` entities.


    All three categories have dependencies on the *context* the entity is used in,
    although not all rules in a given category are context-dependent rules. Attribute-oriented
    Business Logic is the category'
