  md: "```\n```csharp\n}\n\npublic bool IsLocked\n{\n    get\n    {\n        return\
    \ isLocked && sessionId\n            != HttpContext.Current.Session.SessionID;\n\
    \    }\n}\n}```\n```\n\nSo far we've created an introduction that we want to use.\
    \ Now we need to create an advice that will\nenforce the lock implemented by this\
    \ introduction.\n\n# Implementing a Lock Enforcement Advice\n\nIn this particular\
    \ case, we don't need a full-blown *around advice*, such as the one we used in\
    \ the\nlogging example. All that our advice needs to do is to check whether the\
    \ target object is locked and\nthrow an exception if it is.\n\nFor that purpose,\
    \ we can use a somewhat simpler *before advice*, which doesn't require us to make\n\
    a call to `MethodInvocation.Proceed()`:\n\n```\n```csharp\nusing System;\nusing\
    \ System.Reflection;\nusing Spring.Aop;\n\nnamespace LockableAspectDemo\n{\n \
    \   public class LockEnforcerAdvice : IMethodBeforeAdvice\n    {\n        public\
    \ void Before(MethodBase method, object[] args,\n        object target)\n    \
    \    {\n            ILockable lockable = target as ILockable;\n            if\
    \ (lockable != null && lockable.IsLocked)\n            {\n                throw\
    \ new LockViolationException\n                    (\"Attempted to modify locked\
    \ object.\", target);\n            }\n        }\n    }\n}\n```\n```\n\n# Applying\
    \ Locking Aspect to Domain Objects"
