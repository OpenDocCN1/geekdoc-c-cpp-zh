  md: "flexible than they need to be and usually requires code modification when business\
    \ rules change.\nBy moving some of the business rules into aspects, you can make\
    \ the application much easier to\ncustomize. Unlike in previous examples, removing\
    \ code duplication is usually not the main reason\nyou would move business rules\
    \ into aspects—the primary driver in this case is increased application\nflexibility.\n\
    \nThe best candidates are rules that cause secondary logic to be implemented along\
    \ with the core\nlogic. For example, the core logic of the `Account.Withdraw()`\
    \ method from the previous example is\nto reduce the account balance. Secondary\
    \ logic would be to enforce minimum balance requirements\nor to send an email\
    \ alert to the account holder when balance falls below a certain amount.\n\nLet's\
    \ see what our `Account` class would look like if we added both minimum balance\
    \ enforcement\nand a balance alert to it.\n\n```\n```csharp\nusing System;\n\n\
    namespace BusinessRulesDemo.Domain\n{\n    public class Account\n    {\n     \
    \   private AccountHolder accountHolder;\n        private string name;\n     \
    \   private double balance;\n        private double minimumBalance;\n        private\
    \ double alertBalance;\n\n        // Spring.NET IoC injected collaborators\n \
    \       private INotificationSender notificationSender;\n\n        public Account()\
    \ { }\n\n        public Account(string name, double balance)\n        {\n    \
    \        Name = name;\n            Balance = balance;\n        }\n\n        public\
    \ virtual Person AccountHolder\n        {\n            get { return accountHolder;\
    \ }\n            set { accountHolder = value; }\n        }\n\n        public virtual\
    \ string Name\n        {\n            get { return name; }\n            set {\
    \ name = value; }\n        }\n\n        public virtual double Balance\n      \
    \  {\n            get { return balance; }\n```\n```"
