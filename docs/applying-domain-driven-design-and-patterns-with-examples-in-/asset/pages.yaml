  md: 'Neither of these examples is specific to NHibernate, but they are pretty normal
    for O/R Mappers. An example of a problem that I think is more related to NHibernate
    is that of `IDENTITY` or sequences. Using such an Identity Field leads to earlier
    `INSERTS` to the database than what you probably expect.


    All in all, it''s my opinion that NHibernate does a good job of fulfilling those
    overview requirements, especially if you are happy with the nature of how O/R
    Mappers typically work and the tradeoffs that are involved!'
