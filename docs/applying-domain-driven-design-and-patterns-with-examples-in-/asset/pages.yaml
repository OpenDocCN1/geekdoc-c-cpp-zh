- pgno: 41
  md: 'do with the model that I want to focus on. To use a common quote by Donald
    Knuth, "Premature optimization is the root of all evil." It''s better to avoid
    optimizations until you have metrics saying that you have to do them.


    To make a quick and long jump here, I think that decent design, together with
    Object Relational Mapping (O/R Mapping), is often good enough, and when it isn''t,
    you should hand tune. O/R Mapping is a bit like the optimizer of database servermost
    of the time it is smart enough, but there are situations when you might need to
    give it a hand.


    # ### Note


    Decent design and O/R Mapping will be discussed a lot throughout the book. For
    now, let''s define O/R Mapping as a technique for bridging between object orientation
    and relational databases. You describe the relationship between your object-oriented
    model and your relational database and the O/R Mapper does the rest for you.


    So one approach is to use tools such as O/R Mappers for most of the database access
    code and then hand write the code that needs to be handwritten for the sake of
    execution efficiency.


    Let''s take a closer look at the problem something like an O/R Mapper will have
    to deal with, namely mapping between two different worlds, the object-oriented
    and the relational.


    # ## The Impedance Mismatch Between Domain Model and Relational Database


    I mentioned previously that mapping to the UI is one problem when using Domain
    Models. Another well-known problem is mapping to relational databases. That problem
    is commonly referred to as _impedance mismatch_ between the two worlds of relational
    and object-orientation.


    I''d like to give my thoughts on what that impedance mismatch is, although it
    is something of a pop version. For further and more formal information see Cattel
    [Cattell ODD].


    First of all, there are two type systems if you use both a relational database
    and an object-oriented model. One part of the problem is caused by the fact that
    the type systems are in different address spaces (even if not on different machines),
    so you have to move data between them.


    Secondly, not even primitive types are exactly the same. For example a `string`
    in .NET is of variable length, but in Microsoft SQL Server a string is typically
    a `varchar` or a `char` or `text`. If you use `varchar`, you have to decide on
    a maximum width. If you use `text`, the program model is totally different than
    for the other string types in SQL Server.


    Another example is `DateTime`. `DateTime` in .NET is pretty similar to SQL Server,
    but there are differences. For instance, the precision is down to 100 nanoseconds
    for .NET, but "only" down to 3/1000 of a second in SQL Server. Another "fun" difference
    is if you set a `DateTime` in .NET to `DateTime.MinValue` it will lead to an exception
    if you try to store it in a SQL Server `DateTime`.'
