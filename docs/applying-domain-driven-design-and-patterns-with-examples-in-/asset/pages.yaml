- pgno: 428
  md: '# The Model-View-Controller Pattern


    By Christoffer Skjoldborg


    The intent of the Model-View-Controller pattern (MVC) is to break UI behavior
    up into separate pieces in order to increase reuse possibilities and testability.
    The three pieces are the View, the Model, and the Controller.


    The Model is some representation of entity state. It can range from simple data
    structures (XML documents, DataSets, and Data Transfer Objects) to a full-blown
    Domain Model if you have one.


    The View should consist only of logic directly related to "painting the pixels
    on the screen." Keeping the View as "dumb as possible" is often the major design
    objective when applying MVC. The rationale is that Views/Screens in practice require
    a human eye to be tested. This is an error prone and costly process compared to
    automated unit tests. If we minimize the logic we put in the Views in the first
    place, we minimize the risk of introducing bugs that can only be detected by manual
    testing, or, in other words, we minimize the manual testing efforts we have to
    apply.


    Finally, the Controller, which is really the heart of the MVC, is the glue that
    ties the Model and the View together. The Controller receives messages when the
    user interacts with the View, translates those messages into actions that are
    performed on the underlying Model, and then updates the View accordingly.


    The MVC Pattern has its roots in the Smalltalk community back in the 70s and 80s
    [MVC History].


    As mentioned, one of the main reasons for introducing MVC is to increase testability.
    Other benefits are as follows:


    +   - The very process of explicitly extracting the code from the Views does tend
    to force more structure upon the UI code than would otherwise have been the case.
    Many modern tools make it very easy to just click your way around and quickly
    add code behind various events without thinking too hard. By deploying the MVC
    pattern, one must exercise a bit more effort and be very explicit about what goes
    on in the UI.

    +   - It makes it easier to change the look and feel or even support entire new
    UIs or even Platforms. The reuse value in MVC is sometimes exaggerated a bit,
    especially when it comes to cross platform (rich client/Web/handheld device) portability.
    Often the Controller will have to be modified significantly in order to make full
    use of the target platform''s capabilities.

    +   - Different team members can work simultaneously on the View and the controller,
    even if you use a file-locking source control system, because they can now easily
    be separated.


    # Example: Joe''s Shoe Shop'
