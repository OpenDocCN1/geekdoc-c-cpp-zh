- pgno: 118
  md: 'responsibility for the creation of their concrete implementation to the container.
    Because the class is not in control of the creation of its collaborators anymore,
    this principle is also known as *Inversion of Control*.


    The second principle, Service Locator, means that a class internally locates its
    concrete collaborators through the dependency on another object (the locator).
    A simple example of a locator could be a factory object that uses a configuration
    file to load the required collaborators dynamically.


    # Note


    There will be much more coverage about Dependency Injection, Inversion of Control,
    and Service Locator in Chapter 10, "Design Techniques to Embrace."


    # Consequences


    Mock objects and stubs permit you to further isolate the code that needs to be
    tested. This is an advantage, but can also be a limitation, as tests can occasionally
    hide integration problems. While tests tend to be quicker, they are often coupled
    too closely with the system under test. Consequently, they tend to become obsolete
    as soon as a better implementation for the system under test is found.


    Refactoring activities aimed at introducing mocks tend to decouple objects from
    a particular implementation of their dependencies. Although it is generally achievable
    to create mocks from classes containing virtual methods, it is usually recommended
    to use interfaces whenever possible. As a result, it is not rare to observe that
    systems designed to be tested using mock objects contain a significant number
    of interfaces introduced for testing purposes only.


    # Further Information


    For a more in-depth discussion of the differences between mock objects and stubs
    (and state-based versus interaction-based testing), see Martin Fowler''s "Mocks
    Aren''t Stubs" [Fowler Mocks Aren''t Stubs].


    Thanks Claudio! We are strengthened with yet another tool; can we resist getting
    yet one more? Next up is refactoring.'
