- pgno: 435
  md: 'the Adapter would simply delegate the call it receives to the actual implementation.


    # Decouple the Controller from the View


    It can sometimes be advantageous to decouple the Controller from the View. This
    can be done in several ways. A simple solution is to create an interface for the
    Controller and have the View know about that only and not the actual implementation.
    A more complex way is to have Views raise events to anonymous subscribers (Observer
    pattern [GoF Design Patterns]). I''m not a big fan of this approach as I cannot
    imagine why one View would need to communicate user interactions to multiple subscriberslet
    alone subscribers of unknown types! If different Controllers or even other Views
    need to know about a change to a particular View, the Controller for that View
    should notify them. This can be done through events if neededthe point is that
    the Controller should have 100% control of who gets to know about it.


    Regardless of the implementation details, the advantage of decoupling the Controller
    from the View is that we can vary the Controller behind the View. This can be
    very useful when a View can show up in a lot of different contexts, and it might
    not make sense to always have to enforce a particular Controller to go along with
    it. An example of this could be special logic that has to be applied to the View
    for particular customers. In this case, we could have a factory method that serves
    up the appropriate Controller depending on which customer the system is dealing
    with.


    # Combining Views/Controllers


    More complex Views are often made up of multiple smaller Views. Examples are wizards
    where the user navigates through a bunch of Views through next and previous buttons
    or maybe even jump back and forth several steps at a time. Information might be
    saved along the way, but it does not really get committed until the user clicks
    Save on the final screen.


    Another example is Master/Details Views where changes made to the details View
    might cause changes in the Master View as well.


    Both examples can technically be coded with one huge Controller, but it will most
    likely be a messy experience minimizing the reuse possibilities. We may want to
    use some of the steps in the wizard elsewhere in the application, or we may want
    to show the Master View without the Detail View, for example. The solution here
    is obviously to separate the View and Controllers into smaller pieces. ("If you
    want to eat an elephant you have to do it in small pieces.") In the case of the
    wizard, we could have a FlowController that controls the basic flow back and forth
    through the wizard, and each step could have its own View and Controller.


    In the Master/Detail, we might have the Controller for the Detail View raise an
    event on changes. Any other Controller could then subscribe to this event, including
    the Controller for the Master View.


    # Is It Worth It?


    The key benefit of applying the MVC pattern is that it makes your UI code testable.
    Secondarily, it forces a very structured approach onto the coding/design process
    of the UI, which may in itself'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'cause cleaner code in the end. You''re forced to think a little more, so to
    speak.


    On the flip-side it should be noted that just because we *can* test every line
    of code does not mean we *should*. With the MVC in place, it is possible to write
    an extensive test suite for every View, and it sure feels good the first couple
    of times getting a bunch of green bars for the UI logic. However, the value of
    tests that test something very simple that is unlikely to get broken with future
    changes because of low interdependence with other parts of the system may not
    be that huge. Especially if those UI test suites impose huge maintenance overhead
    on your codebase. Every time you change the UI slightly, you have to make a lot
    of changes to the corresponding UI tests.


    Thanks, Chris!


    Whether we want to test the UI with rigorous unit tests or not, I think what Christoffer
    just showed us is a very valuable technique for making the view part of a Windows
    Forms application thinner, so it''s just about painting the forms and factoring
    out some of the presentation logic into a layer of its own.


    That''s pretty much the theme of the next section as well, but this time in the
    context of the Web. Ingemar Lundberg discusses how he applies the MVP pattern
    [Fowler PoEAA2] as the tool for testing a Web application.


