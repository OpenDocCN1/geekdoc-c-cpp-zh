    # Dependency Injection with the Spring.NET Framework


    The Spring.NET application framework [Spring.NET], which is a port of the widely
    used Java Spring framework [Spring], provides a very flexible IoC container that
    supports various flavors of Dependency Injection. This container is simply a component,
    actually an interface with several implementations, that is responsible for loading
    the configuration and setting up the objects accordingly. Historically, the term
    container was used to illustrate that an IoC container can be an alternative to
    a standard J2EE container on the Java platform.


    Returning to the constructor injection example described earlier, let us examine
    how we would use the container provided by Spring.NET to get a configured instance
    of a pricer.


    The preferred way to describe components and their dependencies with Spring.NET
    is with an XML configuration file. We declare our objects by type, including the
    assembly they are loaded from, and then resolve the dependency of the pricer on
    the discount curve by a nested constructor-arg element in the declaration of the
    pricer.


    ```

    <objects>

    <object name="DbCurve" type="MyBank.DatabaseDiscountCurve, MyBank"/>

    <object name="DbPricer" type="MyBank.BondPricer, MyBank">

    <constructor-arg><ref local="DbCurve"/></constructor-arg>

    </object>

    </objects>

    ```


    To access the objects in our code, we can create an instance of IApplicationContext,
    tell it to load the configuration from the config file, and then ask it for an
    object by name. The context ensures that all dependent objects are created and
    injected where required.


    ```

    IApplicationContext context = new XmlApplicationContext("spring.xml");

    BondPricer pricer = (BondPricer)context.GetObject("DbPricer");

    ```


    In real applications, it is uncommon to use the application context so directly
    because it makes the code that creates the pricer dependent on the context. This
    is very similar to the dependency between our classes and the registry in the
    Registry pattern that we wanted to avoid. If we assume that the class that requires
    the pricer is a Windows form, we can use dependency injection for the form itself
    and add the form to the XML configuration. Now, when the form is created, the
    pricer is injected by the container and the form does not have to deal with the
    application context.


    In this case, however, there must be some other piece of code that creates the
    form, and this code would look up the form from the context and would therefore
    be coupled to the context. Clearly, it cannot be turtles all the way down. To
    solve this issue most containers provide integration with the application frameworks,
    Spring.Web for example, such that the initial application-specific components,
    the Windows forms and Web pages, can simply use dependency injection while the
    application framework is responsible for creating them using the context. If there
    is no integration for a particular container/framework combination it is best
    to use dependency injection as much as possible and limit the dependency on the
    context to one class.'
