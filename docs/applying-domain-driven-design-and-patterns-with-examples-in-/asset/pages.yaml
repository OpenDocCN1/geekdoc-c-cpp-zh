- pgno: 339
  md: "With that in place, I can regenerate the development database as often as I\
    \ like, even before every test execution (if it's not becoming too slow).\n\n\
    Let's take it piece by piece. First, you need to describe the document, something\
    \ like this for\n\n```\nCustomer.hbm.xml:\n\n<?xml version=\"1.0\" encoding=\"\
    utf-8\" ?>\n<hibernate-mapping xmlns=\"urn:nhibernate-mapping-2.0\"\n        namespace=\"\
    ADDDP.Ordering.DomainModel\"\n        assembly=\"ADDDP.Ordering.DomainModel\"\
    >\n```\n\nI provided the `namespace` and `assembly` tags here, so the rest of\
    \ the mapping information can be expressed less verbosely because that information\
    \ won't have to be repeated.\n\n# Note\n\nIf you want the metadata to be within\
    \ the assembly, don't forget to set the property of the XML file to be an Embedded\
    \ Resource.\n\nThen you describe the name of the class for the Entity and the\
    \ name of the table. For example, like this:\n\n```\n<class name=\"Customer\"\
    \ table=\"Customers\">\n```\n\nThen you describe the Identity Field [Fowler PoEAA],\
    \ not only the name in the class and the table (in the upcoming example the property\
    \ name and the column name are the same, so the `column` tag isn't needed), but\
    \ also the strategy that is used for creating a new value. It could look like\
    \ this:\n\n```\n<id name=\"Id\" access=\"field.camelcase-underscore\"\n      \
    \  unsaved-value=\"00000000-0000-0000-0000-000000000000\" >\n        <generator\
    \ class=\"guid\" />\n</id>\n```\n\nIn this specific example, a `guid` is generated\
    \ by NHibernate when a new instance is associated with the `ISession`.\n\nThen\
    \ the simple properties are mapped, such as `Name`, like this:\n\n```\n<property\
    \ name=\"Name\" type=\"AnsiString\" length=\"100\"\n        not-null=\"true\"\
    \ />\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "Normally NHibernate can understand what type to use for the properties by investigating\
    \ the class\nby reflection, but in the case of strings, I provide a specific `type`\
    \ to get `VARCHAR` instead of `NVARCHAR`\nif I automatically generate the schema\
    \ from the mapping information. The `length` is also used for\ngenerating DDL\
    \ from the mapping information, but because I like moving along that route, I\
    \ take\nthe extra work of adding that information.\n\n# Note\n\nInformation like\
    \ this is also very useful for your custom validation.\n\nNHibernate also makes\
    \ it possible to map not only properties, but fields as well. As a matter of fact,\n\
    `Customer.Name` isn't a property (which NHibernate considers the default and therefore\
    \ doesn't have\nto be expressed) but a public field, so I need to add an `access`-tag\
    \ like this to get it all correctly:\n\n```\n```xml\n<property name=\"Name\" access=\"\
    field\" type=\"AnsiString\"\n          length=\"100\" not-null=\"true\" />\n```\n\
    ```\n\nAnd it works for all accessor types, even private, so you are pretty free\
    \ to choose a strategy. For\nexample, you often expose something slightly different\
    \ in your property to get what is stored, or\nyou do some interception on get/set.\
    \ In these cases, you need to map, for example, the private\nfield instead.\n\n\
    Mapping a private field could look like this:\n\n```\n```xml\n<property name=\"\
    _customerNumber\"\n          access=\"field\" not-null=\"true\" />\n```\n```\n\
    \nAssuming that you do map private fields, it's a good idea to use naming rules.\
    \ This is so your query\ncode doesn't have to be written to use the name of the\
    \ private fields (for example, is\n`_customerNumber`), but rather ordinary, nice\
    \ property names (like `CustomerNumber`). It could look like\nthis:\n\n```\n```xml\n\
    <property name=\"CustomerNumber\"\n          access=\"field.camelcase-underscore\"\
    \ not-null=\"true\" />\n```\n```\n\n# Note\n\nSure, there are pitfalls here (as\
    \ always), but I usually find it good enough to map private\nfields instead of\
    \ introducing separate private properties purely for the aspect of\npersistence.\
    \ If it works, fine. If not, I can always change it when/if the need arises.\n\
    \nThis is the topic of a heated debate, though. Many prefer to map to persistency-specific\n\
    private properties instead."
  merge: -1
  img_proc: true
