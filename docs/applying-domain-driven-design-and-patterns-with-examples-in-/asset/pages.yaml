  md: '# Note


    To be fair, singletons can be used without affecting testability in the previous
    code if the singleton is injected by the consumer. Then you can use a test object
    during testing, and the real singleton during runtime.


    Problems? Well, the most apparent problem is that if you need the value way down
    in the call stack, the parameter is sent a long way before it''s used. On the
    other hand, it''s very clear where the value is used, and this might be a sign
    of smelly code in itself that might need some refactoring. So singletons might
    actually hide smelly code.


    It''s also the case that Dependency Injection (which will be discussed in Chapter
    10) will gracefully reduce the problem of too many singletons.'
