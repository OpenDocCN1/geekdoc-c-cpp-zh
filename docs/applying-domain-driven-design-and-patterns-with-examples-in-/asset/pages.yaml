  md: 'An important observation is that this code does not depend on anything but
    concepts related to the problem domain. It does not require a reference to a factory
    or registry, and it is not concerned with finding or creating the instances. As
    such, dependency injection promotes the design of elegant software, which usually
    exhibits a good separation between domain and infrastructure concerns.


    Figure 10-11 shows the design using dependency injection. We have also included
    an assembler object that is responsible for creating the pricer and the curve
    on which the pricer depends. The diagram highlights the fact that with this design
    there is no dependency from any domain specific object to generic infrastructure
    code such as the assembler.


    # Figure 10-11. Dependencies when Dependency Injection is used


    ![](img/89fb3513cb9b6343875aadbfd042005d_395_0.png)


    The fact that the bond pricer is not coupled to any infrastructure code also improves
    testability. Consider the first implementation of the pricer, which used the initial
    implementation of the discount curve that loads its points from the database.
    Tests of this class would always hit the database, and we know from previous chapters
    that this is a bad idea. With constructor injection, we can easily supply a stub
    or a mock implementation of each dependency, and so it is very straightforward
    to make the tests of the pricer independent of the database.


    ```

    [Test]

    public void testPriceIncludesValuesForOutstandingCoupons () {

    IMock curveMock = new DynamicMock(typeof(IDiscountCurve));

    IDiscountCurve curve = curveMock.MockInstance as IDiscountCurve;

    BondPricer pricer = new BondPricer(curve);

    /* do actual test */

    }

    ```'
