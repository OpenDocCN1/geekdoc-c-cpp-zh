- pgno: 215
  md: '# PI for Our Repositories


    I admit it: saying you use PI for Repositories as well is pushing it. This is
    because the purpose of Repositories is pretty much to give the consumer the illusion
    that the complete set of Domain Model instances is around, as long as you adhere
    to the protocol to go to the Repository to get the instances. The illusion is
    achieved by the Repositories talking to infrastructure in specific situations,
    and talking to infrastructure is not a very PI-ish thing to do.


    For example, the Repositories need something to pull in order to get the infrastructure
    to work. This means that the assembly with the Repositories needs a reference
    to an infrastructure DLL. And this in its turn means that you have to choose between
    whether you want the Repositories in a separate DLL, separate from the Domain
    Model, or whether you want the Domain Model to reference an infrastructure DLL
    (but we will discuss a solution soon that will give you flexibility regarding
    this).


    # Problems Testing Repositories


    It''s also the case that when you want to test your Repositories, they are connected
    to the O/R Mapper and the database.


    # Note


    Let''s for the moment assume that we will use an O/R Mapper. We''ll get back to
    a more thorough discussion about different options within a few chapters.


    Suddenly this provides you with a pretty tough testing experience compared to
    when you test the Entities and Value Objects in isolation.


    Of course, what you could do is mock your O/R Mapper. I haven''t done that myself,
    but it feels a bit bad on the "bang for the bucks" rating. It''s probably quite
    a lot of work compared to the return.


    # Problems Doing Small Scale Integration Testing


    In previous chapters I haven''t really shown any test code that focused on the
    Repositories at all. Most of the interesting tests should use the Domain Model.
    If not, it might be a sign that your Domain Model isn''t as rich as it should
    be if you are going to get the most out of it.


    That said, I did use Repositories in some tests, but really more as small integration
    tests to see that the cooperation between the consumer, the Entities, and the
    Repositories worked out as planned. As a matter of fact, that''s one of the advantages
    Repositories have compared to other approaches for giving persistence capabilities
    to Domain Models, because it was easy to write Fake versions of the Repositories.
    The problem was that I wrote quite a lot of dumb code that has to be tossed away'
