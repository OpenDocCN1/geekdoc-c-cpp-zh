    \  \n+     For some applications, the load is just too high for a single machine\
    \ to cope with it. It might also be that, financially, you don't want to buy the\
    \ most expensive machine around on day one. You may instead want to add more machines\
    \ to the problem when the problem increases, without throwing away the old machines.\n\
    \nIf you do need a distributed system, it's extremely important to think long\
    \ and hard about the design, because then you have one big design challenge that\
    \ can easily create big throughput problems, for example. When talking about distribution,\
    \ messaging is an important concept.\n\n# Messaging Focus\n\nThe focus of this\
    \ book is design of *one* application or *one* service, not so much about how\
    \ to orchestrate several services. Even so, I think it's good to at least start\
    \ thinking about messaging (if you haven't already). I guess this will just become\
    \ more and more important for us in the future.\n\n# Messages as a Core Programming\
    \ Model Thingy\n\nI used to think it was good to abstract away or hide the network\
    \ in distributed systems. In this way, the client programmer didn't know if a\
