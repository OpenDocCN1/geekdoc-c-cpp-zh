- pgno: 27
  md: '# Overall Values


    In the past, I was very good at planning ahead. I often added functionality, structures,
    and mechanisms to my projects proactively. That part usually turned out pretty
    well, but I often forgot about the artifacts added on that never came to any good
    use. Of course, I added loads of them, too. The cost was pretty large, both in
    development time and in increased complexity.


    Over the last few years, we''ve been encouraged to use another approach: "Do the
    simplest thing that could possibly work." To a large extent, the idea comes from
    the *Extreme Programming* (XP) movement [Beck XP]. Another fairly similar way
    to put it is "You Aren''t Going to Need It" (YAGNI), which is a good way of helping
    you stay in line. I guess "Keep It Simple Stupid" (KISS) could go here, too.


    Both approaches are kind of the two extremes (add all you can think of up front
    versus do the simplest thing), but I think they both miss something in that they
    don''t address the tradeoffs they make. Just about every question regarding "is
    this or that best" can be answered with "it depends." It''s about tradeoffs. I
    tend to prefer an approach that is somewhere in the middle, moving in one or the
    other direction depending upon the situation. The word "lagom" is a Swedish word
    meaning something like "just right" or "not too much, not too little." "Lagom"
    or "to balance" together with being context sensitive are the overall values I’d
    like to value, as well as continuous learning.


    Let''s have a closer look at a couple of more specific areas of values (architecture
    and process ingredients), starting with some aimed at architecture to get us into
    the right mood.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Architecture Styles to Value


    Architects and developers must make design decisions based on the requirements
    of the project. I haven''t collected an exhaustive list of values regarding architecture
    styles here, but I have decided on a few main things I''d like to comment on to
    some extent, such as model focus, domain models, databases, distribution, and
    messaging. First, I think it''s wise to keep a model focus.


    # Focus on the Model


    For a long time, I have liked the object-oriented paradigm a lot, but it wasn''t
    until pretty recently that I made the full move to that paradigm myself. There
    have been platform problems with using the paradigm before, but now the platforms
    are mature.


    # Note


    As a reviewer pointed out, maturity depends on the platform we are talking about.
    If you come from a VB background, what was just said is reasonable, but if you
    come from Java, SmallTalk, C#, and so on, the platform has been mature for quite
    some time.


    Around 13 years ago, I tried to use a visual model to communicate my understanding
    of the requirements of a system I was about to build, and I used some OMT [Rumbaugh
    OMT] sketches. (OMT stands for Object Modeling Technique and was a method with
    a process and a notation. The notation was very similar to the one in Unified
    Modeling Language, UML, which isn''t just a coincidence because OMT was the main
    inspiration for the notation in UML.) We were discussing multiplicity between
    classes, where behavior should belong, and so on. I realized after a few sessions
    that using my technique for discussion with expert users, instead of their technique,
    was a complete failure. They answered my questions randomly and didn''t see or
    add much value at all in the discussion. (The system at large wasn''t a failure,
    it''s still being used and it''s the core system there, but the development process
    didn''t go as smoothly as it could have. I had to change method.)


    # Use Case Focus


    I have thought about that experience several times and have actually joked about
    how naive I was. In the years following, I always tried to play by the methodologies
    of the target groups; I mean the methodologies of the users with the users, and
    the methodologies of software development with developers. One technique that
    worked pretty well in both camps was the use case technique [Jacobson OOSE]. (At
    least it worked out well in the informal manner of XP [Beck XP] stories, short
    text descriptions, which was what I used. Such a description is a short description
    of a piece of'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'functionality in a system. An example is "Register Order for Company Customer.")


    It was very natural to users and could be made natural to developers, too, so
    it became the bridging tool of mine for years. The way I did the bridging was
    to have one class per use case in the software.


    It did come to my attention that thanks to my way of applying use cases, I became
    pretty procedural in my thinking. I was designing a little bit like Transaction
    Script [Fowler PoEAA], but I tried to balance it by generalizing as much behavior
    as possible (or at least suitable).


    A few years ago I heard Ivar Jacobson talking about use cases, and I was pretty
    surprised when I realized that he didn''t encapsulate the use cases in classes
    of their own as I had expected and had done for a long time.


    Another thing that got me kind of worried about this method was the constant struggle
    I was having with my friend and Valhalla-developer Christoffer Skjoldborg when
    we worked with the Domain Model pattern [Fowler PoEAA]. He saw little value in
    the use case classes, maintaining that they could even get in the way because
    they might become a hindrance when mixing and matching use case parts.


    # Different Patterns for Dealing with the Main Logic


    Before we continue, I must say a few words about Transaction Script and Domain
    Model, which we have already touched upon.


    Martin Fowler discusses three ways of structuring the main logic in application
    architecture in his book Patterns of Enterprise Application Architecture [Fowler
    PoEAA]. Those are Transaction Script, Table Module, and Domain Model.


    Transaction Script is similar to batch programs in that all functionality is described
    from start till end in a method. Transaction Script is very simple and useful
    for simple problems, but breaks down when used for dealing with high complexity.
    Duplication will be hard to avoid. Still, very many very large systems are built
    this way. Been there, done that, and I''ve seen the evidence of duplication even
    though we tried hard to reduce it. It crops up.


    Table Module encapsulates a Recordset [Fowler PoEAA], and then you call methods
    on the Table Module for getting information about that customer with id 42. To
    get the name, you call a method and send id 42 as a parameter. The Table Module
    uses a Recordset internally for answering the request. This certainly has its
    strengths, especially in environments when you have decent implementations for
    the Recordset pattern. One problem, though, is that it also has a tendency to
    introduce duplication between different Table Modules. Another drawback is that
    you typically can''t use polymorphic solutions to problems because the consumer
    won''t see the object identities at all, only value-based identities. It''s a
    bit like using the relational model instead of the object-oriented model.


    Domain Model instead uses object orientation for describing the model as close
    to the chosen abstractions of the domain as possible. It shines when dealing with
    complexity,'
  merge: -1
  img_proc: true
- pgno: 30
  md: '> > both because it makes usage of the full power of object orientation possible
    and because it is easier to be true to the domain. Usage of the Domain Model pattern
    isn''t without problems, of course. A typical one is the steep learning curve
    for being able to use it effectively.


    # Domain-Driven Design Focus


    The real eye-opener for me regarding the usage of use cases was *Domain-Driven
    Design* (DDD) [Evans DDD]. (We will talk a lot about DDD soon, but for now, let’s
    just say it’s about focusing on the domain and letting it affect the software
    very much.) I still think that the use case technique is a great way of communicating
    with users, but DDD has made me think it can help a lot if we can manage to actively
    involve the users in discussions about the core model. It can head off mistakes
    very early and help the developers understand the domain better.


    # Note


    "Model" is one of those extremely overloaded terms in software. I think we all
    have an intuitive idea about what it is, but I''d like to describe how I think
    about it. Instead of trying to come up with *the* definition, here in all simplicity
    (this could fill a book of its own by the right author) are a few properties of
    a model that you can compare to your own understanding of the term. A model is


    +   - Partial

    +   - For a certain purpose

    +   - A system of abstractions

    +   - A cognitive tool


    Also,


    +   - A model has several presentations (for example: language, code, and diagrams).

    +   - There are several models in play in a system.


    If you would like to read more, very much has been written about what a model
    is. A good place to start is the first pages in Eric Evans’ book [Evans DDD].
    (A special thanks to Anders Hesselund and Eric Evans for inspiration.)


    The model is a great tool for communication between developers and users, and
    the better the communication is between those groups, the better the software
    will become, both in the short and the long run.


    We (including me) have been using models forever, of course, but the difference
    between one of my old models and those that have been built with the ideas of
    DDD is that my old models had'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'much more infrastructure focus and technical concept focus. My new models are
    much cleaner from such distractions and instead focus totally on the core domain,
    its main concepts, and the domain problems at hand. This is a big mind shift.


    Another way of expressing it is that technicalities (such as user interface fashion)
    come and go. Core business lasts. And when the core business changes, we *want*
    to change the model and the software.


    It''s not rocket science so far, and I''m probably just kicking in open doors.
    I think, however, this lies at the very core of how to achieve efficient software
    development, and in my experience it is rarely used. By this I mean focusing on
    the model, having a model (with different presentations) that is used by both
    users and developers, and not getting distracted by unimportant details.


    # Why Model Focus?


    I''d like to exaggerate this a bit. Let''s play a game: What kind of developer
    would be the best one for building a very large system in a special field, let''s
    say in finance? It goes without saying that the developer should be technically
    savvy, very skilled and experienced, have a huge social network, and so on. It
    would also be very nice if he was extremely skilled in the business domain itself
    and it wouldn''t hurt if he had worked as, say, a trader for ten years, if that''s
    the kind of system to be built.


    Finding developers like that does happen, but in my experience it''s more the
    exception than the rule. In the case of the developer being able to move on to
    another domain for a new system when the financial system is up and running, that
    exception becomes even more rare. This is because developers just can''t have
    ten years of experience in logistics, health care, insurance, and the rest.


    Another solution can be to let the domain expert users develop the software themselves.
    This has been an old dream for decades, and to a degree it''s slowly becoming
    more and more viable all the time. At the same time, it takes away time from them,
    time they often can use better for their core work. There''s also too many technical
    problems still involved.


    So what''s the next best thing? The answer is obvious (at least from today''s
    standpoint): make the developer learn as much as possible about the domain he
    or she is working on and add users to the picture to bring the domain expertise
    to the project team and to actively and constructively work within the project.
    The users would not just set the requirements—although that is also very important—but
    would actually help out with designing the core of the system. If we can manage
    to create this atmosphere, nobody is more skilled than the domain expert user
    at deciding on what the core is, what the key abstractions are, and so on.


    Of course, as developers we are also necessary. The whole thing is done in cooperation.
    For example, what might be seen as a tiny detail to businesspeople can be a huge
    thing to us in the domain model. They might say: "Oh, sometimes it''s like this
    instead," and everything is totally different, but because it''s not the most
    common variant, they think it''s unimportant.


    # Time to Try Discussing the Model with Customers Again


    Why would I now succeed in discussing the model with the customers when I failed
    before? Many things have changed. First, it''s important to have a sense of the
    context and the project group. Second, use cases can help a lot when getting started,
    and then you can switch the focus later to'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'the core model itself. Third, building systems is something many more people
    have experience in and have been taught about now. Fourth, to be picky, the model
    represented as graphical, UML-like sketch for example is not the most important
    thing to have users work on; it''s still typically a representation that developers
    like better than users. What we are looking for is the ubiquitous language [Evans
    DDD].


    The ubiquitous language is not something like UML, XML Schema, or C#; it''s a
    natural, but very distilled, language for the domain. It''s a language that we
    share with the users for describing the problem at hand and the domain model.
    Instead of us listening to the users and trying to translate it to our own words,
    a ubiquitous language would create fewer reasons for misunderstandings, and it
    will become easier for the users to understand our sketches and actually to help
    correct mistakes, helping us gain new knowledge about the domain. If it''s suitable,
    you can discuss ubiquitous language in the context of the graphical/code models
    with the users. If not, you still have the most important thing done if you catch
    the ubiquitous language.


    # Note


    Eric Evans commented on the previous with the following:


    > > Something to make clear is that the ubiquitous language isn''t just the domain
    expert''s current lingo. That has too many ambiguities and assumptions and also
    probably too large a scope. The ubiquitous language evolves as a collaboration
    between the domain experts and the software experts. (Of course, it will resemble
    a subset of the domain jargon.)


    The ubiquitous language is something that you should work hard to keep well-defined
    and in synch with the software. For example, a change in the ubiquitous should
    lead to a change in the software and vice versa. Both artifacts should influence
    each others.


    # If You Have a Model Focus, Use the Domain Model Pattern


    If we have agreed on having a deep model focus and using object-orientation, I
    believe the natural result is to use the Domain Model pattern [Fowler PoEAA] for
    structuring the core logic of the applications and services. You find an example
    of a small Domain Model in Figure 1-1.


    Figure 1-1. An example of a Domain Model, an early sketch for the example application,
    further discussed in Chapter 4, "A New Default Architecture"'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/89fb3513cb9b6343875aadbfd042005d_33_0.png)


    # Note


    If you aren''t up to speed on UML, I think a good book to read is UML Distilled
    [Fowler UML Distilled]. It''s not essential that you understand UML, but I think
    it will be helpful to know the bones because I will be using UML as a sketch tool
    here and there (of course, you will benefit from it at other times as well, not
    just with this book).


    Even though Figure 1-1 shows just an early sketch of a small domain model, I think
    we can see that the model expresses domain concepts and not technical distractions.
    We can also see that it contains several cooperating small pieces, which together
    form a whole.


    # Note


    If you wonder why Figure 1-1 is handwritten, it is to stress the point that it
    is a sketch. We will explore and develop the details in code for example, with
    the help of Test-Driven Development (TDD). (We will discuss TDD later in this
    chapter, as well as in Chapter 3, "TDD and Refactoring.")'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Before we talk more about the specific style I used for the Domain Model, I
    think it''s time to look back again.


    # Domain Model History from My Rear View Mirror


    I still remember the first time I tried to use the Domain Model, even though I
    didn''t call it that at the time. It was around 1991, and I couldn''t understand
    how it should match up in the UI. I don''t remember what the application was,
    but I remember that I tried to decide on what the menus should look like in order
    to be object-oriented. I didn''t come over that first hurdle that time. I think
    I was looking for a very close mapping between the UI and the Domain Model and
    couldn''t find out how to achieve it.


    A few years prior to that, I worked on an application that was said to use object-oriented
    ideas, for example, for the UI. There were no big breakthroughs, perhaps, but
    it managed to achieve small things. For example, instead of first choosing a function
    and then deciding to what object (such as a portfolio) to apply it, the user first
    chose the object and then decided between the different functions that were possible
    for the chosen object. At the time this was pretty different from how most business
    applications were navigated in the UI.


    # A Few Words About Naked Objects


    Perhaps I wasn''t totally off with my intentions. Perhaps what I was trying to
    achieve was something like *Naked Objects* [Pawson/Matthews Naked Objects], but
    I really didn''t get very far with it.


    Without going into details about Naked Objects, I think a short explanation is
    in order. The basic idea is that not only developers but users also like object-orientation.
    They like it even more than we normally think, and they would quite often be happy
    with a UI that is very close to the Domain Model itself, so close that the UI
    can be created automatically by a framework directly based on the Domain Model.


    A system based on naked objects automatically presents a form to a user that contains
    widgets exposing the properties in the Domain Model class.


    For more complex tasks, there is some need for customization (as always), but
    the idea is to cut down on that as well, again thanks to the framework that understands
    what UI to create from the Domain Model fragments. So when the Domain Model is
    "done," the UI is more or less done as well.


    For the moment I don''t have first-hand experience with the concept and technique,
    but an appealing twist to me of the idea is that the users will really get a chance
    to see and feel the model, which should be very helpful in bridging the gap between
    developers and users.


    After that, I tried Domain Model approaches many times over the years. I found
    problems with using it, especially related to performance overhead (especially
    in distributed scenarios). That said,'
