- pgno: 317
  md: '# Classification


    Let''s have a closer look at what an O/R Mapper is. We''ll discuss this from two
    different angles. First, we''ll discuss it from one dimension: different characteristics.
    Next, we''ll discuss it from some of the PoEAA patterns that are implemented.
    We''ll reuse those classifications when giving examples of how it all works in
    a specific O/R Mapper in the next chapter.


    To be clear, everything I''m about to discuss is applicable even in the case of
    custom code (except for mapping style). That also goes for the patterns description.
    But in order to become more concrete, we will be thinking about O/R Mappers from
    now on.


    The first classification is about the style of Domain Model that is supported.


    # Domain Model Style


    How much, and in what way, do we have to adapt the Domain Model to work with the
    O/R Mapper? The three most typical and general aspects are


    +   - Persistent Ignorant

    +   - Inheritance

    +   - Interface implementation


    # Persistent Ignorant


    Persistent Ignorant means that you make no changes at all to the Domain Model
    in order to make it persistable. Of course, there''s a scale here, and it''s not
    a matter of being completely black or white. For example, reflection-based approaches
    set some requirements. AOP-based approaches set other requirements.


    # Inheritance


    A common approach historically is to require the Domain Model classes to inherit
    from a super class provided by the Persistence Framework.


    # Interface Implementation


    Finally, another common approach historically is to require the Domain Model classes
    to implement one or more interfaces provided from the Persistence Framework.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'This was just one aspect showing how you might have to adapt your Domain Model
    to fit the persistence framework. Loads of other things might have to be done
    regarding Versioning and Lazy Load, for example, but we''ll come back to that
    later in the chapter.


    # Mapper Style


    Metadata-based mappings are often implemented in two different ways:


    +   - Code generation

    +   - Framework/reflective


    As the sharp-eyed reader will have noticed, I just mentioned code generation again,
    this time in the context of O/R Mappers. However, there''s one important difference.
    Now the code generation is done, typically just before compilation, by reading
    metadata and spitting out the mapping code. Of course, code generation of custom
    code could be done in a similar way, but the main difference is that the appetite
    regarding what to support varies. This definition is not extremely distinct, but
    it''s a start.


    Framework/reflective means that there is no source code generated before compilation
    time for the mapping work. Instead, the mapping is dealt with by reading metadata
    at runtime.


    # Note


    As you probably suspect, things are even fuzzier. For example, how should we categorize
    static AOP? I try to keep the description and categorization simple and clean.


    It''s also important to note that code generation and framework don''t have to
    be mutually exclusive.


    # Starting Point


    When you are working with a certain O/R Mapper, you can often choose one or more
    starting points from the following list:


    +   - Database schema

    +   - Domain Model

    +   - Mapping information


    By starting point I mean what you focus on when you start building your application.
    Of course, it''s beneficial if the O/R Mapper supports several starting points
    because there''s then a greater chance you can use it for the different situations
    in which you will find yourself.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'As you know by now, I prefer to start working from the Domain Model; however,
    you can''t always have that and may have to start from the database schema instead
    or at least keep a close eye on the database schema. You may also have to start
    working from the mapping information instead, describing the classes'' relationships
    to tables in a UML-like diagramming tool, for example.


    If you prefer starting from the Domain Model, but the persistence framework that
    you want to try out doesn''t support that, you can work around the problem by
    seeing the UML Editor or Database Design as a way of writing your Domain Model.
    It''s a bit awkward, though. And TDD, for example, won''t be as natural to apply.


    # Mapping Legacy Databases


    Even though the starting point might be the database, this doesn''t have to imply
    that it is forced by the persistent framework or that the designer prefers to
    work in this way. It can also be that you have a legacy database that must be
    used.


    Be prepared for it to be much harder to go that route with an O/R Mapper (unless
    it''s specialized for that), especially if you aren''t allowed to change the design
    of the database at all. Often it''s at least allowed to add views, columns, and
    tables to the database even if you aren''t allowed to change existing columns.
    That can help! (Changes that existing apps aren''t affected by are pretty likely
    to be allowed, but watch out because the existing apps might not be the most robust
    around.)


    It''s especially troublesome if the legacy database design isn''t in great shape,
    which can happen if the application has been in production for a couple of years.


    Something else about this point is how do you move further when you are "done"
    with the first one (such as the Domain Model)? Does the chosen O/R Mapper provide
    any help with creating the other two parts to any extent? For example, you have
    the Domain Model, and now you need the database and metadata. Can you get that
    automatically? It''s not as though this is a show-stopper if it''s not supported;
    you can often create such basic tools on your own pretty easily. But it''s an
    advantage if that has been taken care of for you.


    So let''s now assume that we have the Domain Model, database, and mapping information
    in place. Let''s discuss what the API will look like.


    # API Focus


    The API focus comes in two alternatives:


    +   - Relational Tables

    +   - Domain Model'
