  md: "```\n```csharp\n{\n    public void Transferfunds(Account from, Account to\n\
    \        , double amount)\n    {\n        ILockable acctFrom = from as ILockable;\n\
    \        ILockable acctTo = to as ILockable;\n\n        try\n        {\n     \
    \       acctFrom.Lock();\n            acctTo.Lock();\n\n            from.Withdraw(amount);\n\
    \            to.Deposit(amount);\n        }\n        finally\n        {\n    \
    \        acctFrom.Unlock();\n            acctTo.Unlock();\n        }\n    }\n\
    }\n}\n```\n```\n\nAs you can see, by using AOP we can truly modularize the object\
    \ locking feature and apply it wherever appropriate without the shortcomings of\
    \ the pure OOP approaches.\n\n# Note\n\nWhile the previous example is technically\
    \ no different than if we used `lock` statements to synchronize access to `acctFrom`\
    \ and `acctTo` from the multiple threads, there is a big difference in the semantics\
    \ between the two. With `ILockable` we could keep the lock for the duration of\
    \ the multiple HTTP requests, not just for the single request.\n\n# Moving Business\
    \ Rules into Aspects\n\nThe final example we are going to show in this section\
    \ demonstrates a somewhat advanced AOP usage. We do not recommend that you start\
    \ experimenting with AOP by moving all your business rules into aspects. It is\
    \ probably the best idea to introduce AOP into your projects slowly by making\
    \ them handle obvious crosscutting concerns, such as logging, security, and transactions.\
    \ However, we feel it is important that you understand its full potential so you\
    \ can apply it effectively when you become more familiar with it.\n\nEvery business\
    \ application has various business rules that are typically embedded into the\
    \ application logic. While this works just fine for most rules and most applications,\
    \ it makes them less"
