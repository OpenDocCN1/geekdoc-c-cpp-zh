    Let''s take a closer look at the reasoning behind the decisions discussed so far.


    # Reasons for the Decisions


    Why did I choose as I did? First, I want to use the Unit of Work pattern. I want
    its characteristics: to create a logical Unit of Work.


    So you can make lots of changes to the Domain Model, collect the information in
    the Unit of Work, and then ask the Unit of Work to save the collected changes
    to the database.


    There are several styles of Unit of Work to use. The one I prefer is to make it
    as transparent as possible for the consumer and therefore the only message needed
    is to say `Add()` to the Repository (which in turn will talk to the Unit of Work).


    If the reconstitution is done via the Repository, the Unit of Work-implementation
    can inject some object that can collect information about changes. Otherwise,
    there can be a snapshot taken at read time that will be used to control the changes
    by the Unit of Work at persist time.


    I also chose to control save or not save (`PersistAll()`) outside of the Repositories.
    In this particular example, I could just as well have had `PersistAll()` directly
    on the `CustomerRepository`, but I chose not to. Why? Why not let Repositories
    hide Unit of Work completely? Well, I could, but I often find that I want to synchronize
    changes to several Aggregates (and therefore also to several different Repositories)
    in a single logical unit, and that''s the reason. So code like this is not only
    possible to write, but also very typical:


    ```

    ```csharp

    Customer c = new Customer();

    _customerRepository.Add(c);

    ```

    ```'
