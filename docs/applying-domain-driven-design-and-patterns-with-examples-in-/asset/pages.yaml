    \    {\n        private Employee employee;\n\n        public EmployeeWrapper (Employee\
    \ employee)\n        {\n            this.employee = employee;\n        }\n\n \
    \       public int Id\n        {\n            get { return this.employee.Id; }\n\
    \            set { this.employee.Id == value; }\n        }\n\n        public string\
    \ FullName\n        {\n            get\n```\n```"
