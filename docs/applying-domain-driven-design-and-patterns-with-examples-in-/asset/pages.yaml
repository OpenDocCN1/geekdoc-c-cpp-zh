  md: '# Mapping Classes onto Tables Versus Mapping Tables onto Classes


    O/R Mapping deals with the transformation between the relational model and the
    object model: that is, transforming objects into entity instances in the persistent
    storage and back. Globally, it can be defined as the following:


    A field in a class in the object model is related to an attribute of an entity
    in the relational model and vice versa.


    A chicken-egg problem arises: what follows what? Do you first define the entity
    classes (classes *representing* entity definitions), like an `Order` class representing
    the `Order` entity) and create relational model entities with attributes using
    these classes, or do you define a relational model first and use that relational
    model when you define your entity classes?


    As with almost everything, there is no clear "this is how you do it" answer to
    that question. "It depends" is probably the best answer that can be given. If
    you''re following the Domain Model, it is likely you start with domains, which
    you use to define classes, some probably in an inheritance hierarchy. Using that
    class model, you simply need a relational model to store the data, which could
    even be one table with a primary key consisting of the object ID, a binary blob
    field for the object, and a couple of metadata elements describing the object.
    It will then be natural to map a class onto elements in the relational model after
    you''ve made sure the relational model is constructed in a way that it serves
    the object model best.


    If you start with the relational model and you construct an E/R model, for example,
    it is likely you want to map an entity in your relational model onto a class.
    This is different from the approach of the Domain Model, for instance, because
    the relational model doesn''t support inheritance hierarchies: you can''t model
    a hierarchy like Person < Employee < Manager such that it also represents a hierarchy.
    It is, of course, possible to create a relational model that can be semantically
    interpreted as an inheritance hierarchy; however, it doesn''t represent an inheritance
    hierarchy by definition.


    This is the fundamental difference between the two approaches. Starting with classes
    and then working your way to the database uses the relational model and the database
    just as a place to store data, while starting with the relational model and working
    your way towards classes uses the classes as a way to work with the relational
    model in an OO fashion.


    As we''ve chosen to use Chen''s way of defining entities, we''ll use the approach
    of defining the relational model first and working our way up to classes. Later
    on in the "The Ideal World" section we''ll see how to bridge the two approaches.


    # Working with Data in an OO Fashion


    Entity-representing classes are the developer''s way to define entities in code,
    just as a physically implemented E/R model with tables defines the entities in
    the persistent storage. Using the O/R Mapping technique discussed in the previous
    section, the developer is able to manipulate entity instances in the persistent
    storage using in-memory mirrors placed in entity class instances. This is always
    a batch-style process, as the developer works disconnected from the persistent
    storage. The controlling environment is the O/R Mapper, which controls the link
    between entity instances in the persistent storage and the in-memory mirrors inside
    entity class instances.


    A developer might ask the O/R Mapper to load a given set of `Order` instances
    into memory. This'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'results in, for each `Order` instance in the persistent storage, a mirror inside
    an entity class instance. The developer is now able to manipulate each entity
    instance mirror through the entity class instance or to display the entity instance
    mirrors in a form or offer it as output of a service. Manipulated entity instance
    mirrors have to be persisted to make the changes persistent. From the developer''s
    point of view, this looks like saving the manipulated entity instance data inside
    the objects to the persistent storage, like a user saves a piece of text written
    in a word processor to a file. The O/R Mapper is performing this save action for
    the developer. But because we''re working with mirrors, the actual action the
    O/R Mapper is performing is *updating* the entity instance in the persistent storage
    with the changes stored in the mirror received from the developer''s code.


    The relationships between the entities in the relational model are represented
    in code by functionality provided by the O/R Mapper. This allows the developer
    to traverse relationships from one entity instance to another. For example, in
    the `Order` system, loading a `Customer` instance into memory allows the developer
    to traverse to the `Customer`''s `Order` entity instances by using functionality
    provided by the O/R Mapper, be it a collection object inside the `Customer` object
    or a new request to the O/R Mapper for `Order` instances related to the given
    `Customer` instance.


    This way of working with entities is rather static: constructing entities at runtime
    through a combination of attributes from several related entities does not result
    in entity-representing classes, as classes have to be present at compile time.
    This doesn''t mean the entity instances constructed at runtime through combinations
    of attributes (for example, through a select with an outer join) can''t be loaded
    into memory; however, they don''t represent a persisting entity, but rather a
    virtual entity. This extra layer of abstraction is mostly used in a read-only
    scenario, such as in reporting applications and read-only lists, where a combination
    of attributes from related entities is often required. An example of a definition
    for such a list is the combination of all attributes of the `Order` entity and
    the "company name" attribute from the `Customer` entity.


    To successfully work with data in an OO fashion, it is key that the functionality
    controlling the link between in-memory mirrors of entity instances and the physical
    entity instances offers enough flexibility so that reporting functionality and
    lists of combined set of attributes are definable and loadable into memory without
    needing to use another application just for that more dynamic way of using data
    in entity instances.


    # Functional Research as the Application Foundation


    To efficiently set up the relational model, the mappings between entity definitions
    in the relational model and entity representing classes and these classes itself,
    it is key to reuse the results from work done early in the software development
    project, the Functional Research Phase. This phase is typical for a more classical
    approach to software development. In this phase, the functional requirements and
    system functionality are determined, defined in an abstract way and documented.
    Over the years, several techniques have been defined to help in this phase; one
    of them is NIAM [Halpin/Nijssen Conceptual Schema], which is further developed
    by T.A. Halpin [Halpin IMRD] to *Object Role Modeling* (ORM). NIAM and ORM make
    it easy to communicate functional research findings with the client in easy to
    understand sentences like "Customer has Order" and "Order belongs to Customer."
    These sentences are then used to define entities and relationships in an abstract
    NIAM/ORM model. Typically, a visual tool is used for this, such as Microsoft Visio.


    # The Importance of Functional Research Results'
