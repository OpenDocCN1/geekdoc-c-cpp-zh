  md: "Now we have talked a lot about the functionality that is important for NWorkspace,\
    \ but not for the Fake version of NWorkspace. Let's get back on track and focus\
    \ for a while on the Fake and its implementation instead.\n\n# ## The Implementation\
    \ of the Fake\n\nI'm not going to drag you through the details of the Fake implementation—I'm\
    \ just going to talk conceptually about how it's built, mostly in order to get\
    \ a feeling for the basic idea and how it can be used.\n\nThe fake implementation\
    \ uses two layers of Identity Maps. The first layer is pretty similar to ordinary\
    \ Identity Maps in persistence frameworks, and it keeps track of all Entities\
    \ that you have read within the current scenario. The second layer of Identity\
    \ Maps is for simulating the persistent engine, so here the instances aren't kept\
    \ on a scenario level, but on a global level (that is, the same set of Identity\
    \ Maps for all scenarios).\n\nSo when you issue a call to `GetById()`, if the\
    \ ID is found in the Identity Map for the requested type, there won't be a roundtrip\
    \ to the database (or in case of the Fake, there won't be a jump to the second\
    \ layer of Identity Maps). On the other hand, if the ID isn't found in the first\
    \ layer of Identity Maps, it's fetched from the second layer, copied to the first\
    \ layer, and then returned to the consumer.\n\nThe `MakePersistent()` is pretty\
    \ simple; the instance is just associated with the first layer of Identity Maps.\
    \ And when it's time for `PersistAll()`, all instances in the first layer are\
    \ copied to the second layer. Simple and clean.\n\nThis describes the basic functionality.\
    \ Still, it might be interesting to say a bit about what's troublesome, also.\
    \ One example is that I don't want the Fake to influence the Domain Model in any\
    \ way at all. If it does, we're back to square one, adding infrastructure-related\
    \ distractions to the Domain Model, or even worse, Fake-related distractions.\n\
    \nOne example of a problem is that I don't know which is the Identity field(s)\
    \ of a class. In the case of the real infrastructure, it will probably know that\
    \ by some metadata. I could read that same metadata in the Fake to find out, but\
    \ then the Fake must know how to deal with (theoretically) several different metadata\
    \ formats, and I definitely don't like that.\n\nThe simplistic solution I've adopted\
    \ is to assume a property (or field) called `Id`. If the developer of the Domain\
    \ Model has used another convention, it could be described to the Fake at instantiation\
    \ of the `FakeWorkspace`.\n\nAgain, this was more information than you probably\
    \ wanted now, but it leads us to the important fact that there are additional\
    \ things that you can/ need to do in the instantiation phase of the Fake compared\
    \ to the infrastructure implementations of NWorkspace.\n\nTo take another example,\
    \ you can read from file/save to file like this:\n\n```\n```csharp\n//Some early\
    \ consumer\nIWorkspace ws = new\n    NWorkspaceFake.FakeWorkspace(\"c:/temp/x.nworkspace\"\
    );\n\n//Do stuff...\n```\n```"
