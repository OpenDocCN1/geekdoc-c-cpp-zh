- pgno: 368
  md: 'Let''s take a step back. We just took the O/R Mapper for granted and discussed
    how it could fit in with the concept of repositories.


    Think about it the other way around. I mean, we have a repository and now we want
    to fill it with real code. Assume that you decide to write manual code there.
    The API for the repository consumer can be the same thing with other implementations,
    of course, but instead of the following line:


    ```

    Customer c = (Customer)_session.Load(typeof(Customer), theId);

    ```


    you would probably have to write quite a lot of code. For example, you need to
    define the SELECT statement so you get all the columns you need for the customer
    instance you are about to reconstitute.


    Then you need to instantiate the customer instance and shuffle all the values
    from the resultset row to the instance.


    Sure, we can all do that. It''s not the complexity that is the problem; it''s
    that this most often is an uninteresting piece of work. And there is a lot more
    to it. For example, the customer also had a list of ReferencePersons that should
    be reconstituted at the same time and a whole bunch of other things as well.


    When we are done with that code, every single change to the schema or Domain Model
    will lead to more tedious work for us. Remember, this was a single get operation
    of a single object.


    If we instead use an O/R Mapper, changes are often dealt with by making a few
    changes to the mapping information and that''s it. I believe I''m *much* more
    efficient dealing with changes when I don''t hand code the uninteresting persistence
    code.


    That thought can be seen in a larger perspective also, because if I know that
    changes won''t be too expensive, I''m much more inclined to do refactorings than
    in the opposite case!


    Let''s end this section with a short story from a recent project. I think changes
    in that project that only affect the pieces (the Domain Model and the database
    schema) that are dealt with by the O/R Mapper are probably done a magnitude cheaper
    compared to the changes that affect the persistence code that we have hand tuned!
    (That said, don''t forget that O/R Mappers are *of course* not the silver bullet
    either. There are pros and cons.)'
