  md: 'consumer to use it. Probably, the consumer will find that the API is better
    and more stable

    than it would have been otherwise.


    +   - **Future maintenance**


    Maintenance goes like a dream when you have extensive test suites. When you need
    to make

    changes, the tests will tell you immediately if it breaks on consumer.


    If you don''t have extensive test suites when you need to make changes, you can
    go ahead

    and create tests before making the changes. It''s not much fun, and you probably
    won''t be

    able to create high-quality tests long after the code was written, but it''s often
    a better

    approach than just making the changes and crossing your fingers. You then have
    tests when

    it''s time for the next change, and the next.


    Despite using TDD, bugs will appear in production code. When it happens and you
    are about

    to fix the bug, the process is very similar to the ordinary TDD one. You start
    by writing a test

    that exposes the bug, and then write the code that makes the tests (the new and
    all the old

    tests) execute successfully. Finally, you refactor if necessary.


    +   - **Documentation**


    The tests you write are high-quality documentation. This is yet another good reason
    for

    writing them in the first place. Examples are really helpful in order to understand
    something,

    and the tests are examples both of what should work and what shouldn''t.


    Another way of thinking about the unit tests is that they reveal your assumptions,
    and that

    goes for the other developers, too. I mean, they reveal their assumptions about
    your class. If

    their tests fail, it might be because your class isn''t behaving as is expected,
    and this is very

    valuable information to you.


    +   - **A smarter compiler**


    In the past I have tried hard to make the compiler help me by telling me when
    I do something

    wrong. Tests are the next level up from that. The tests are pretty good at finding
    out what the

    compiler misses. Another way of stating it is that the compiler is great at finding
    syntax

    problems, and the tests will find semantic problems.


    It''s even the case that you probably will value type safety a little less when
    you are using TDD

    because tests will catch type mistakes easily. That in its turn means that you
    can take

    advantage of a more dynamic style.


    If you follow the ideas of TDD, you will also find that you don''t need to spend
    nearly as much

    time with the debugger as you would otherwise have to.


    # Note


    Even so, there might be situations where you need to inspect the values of variables,
    and

    so on. You can use `Console.WriteLine()` calls, and you can run the tests within
    the

    debugger. Personally I think it''s a sign of too big leaps or too few tests when
    I get the

    urge to use those techniques.'
