  md: 'Furthermore, the delegation code for properties that don''t require any advanced
    transformations can be fruitfully attacked with code generation solutions or even
    just code snippet templates. If all else fails, let the intern write the boilerplate
    code!


    # Mapping the Presentation Model to Domain Model


    The alternative to wrapping your DM objects with your PM objects is to actually
    copy the data back and forth between the DM objects and the PM objects. In this
    case, you''d be writing code like the following:


    ```

    ```text

    //Moving data manually between Presentation Model

    //and Domain Model

    Employee employee = employeeRepository.GetEmployeeById(42);

    EmployeeView employeeView = new EmployeeView();


    employeeView.Id = employee.Id;

    employeeView.Salary = employee.Salary;

    employeeView.FullName = employee.FirstName + " " +

    employee.LastName;

    ```

    ```


    As with the wrapping example, the code for copying the data could be placed in
    the constructor of the PM object, in which case the constructor would accept the
    DM object in a parameter. The previous example shows only the operative lines
    of code for clarity.


    If you suffer from the same affliction as I, *abstractus manicus*, you will immediately
    recognize the potential for abstracting this work into a framework of some kind.
    In short, we should be able to specify (in, say, an XML file) what PM properties
    map to what DM properties and then let the framework use reflection to move the
    data.


    Such a framework would have to map one set of objects to another set of objects,
    and so the logical term for this type of framework would be "Object/ Object Mapper"
    or O/O Mapper for short!


    If you decide to write such a framework, you may realize that solving the non-transformational
    cases, such as mapping `Id` to `Id` and `Salary` to `Salary` in the previous case,
    should be a pretty straightforward task. Mapping `FullName` to `First-Name` and
    `LastName`, on the other hand, is trickier.


    It is quite solvable, but the question becomes if it is the right approach to
    try to build advanced transformation services into the O/O Framework.


    The alternative is to avoid charging the O/O Mapper with responsibility for actual
    structural transformations and let it concentrate on just moving data back and
    forth between objects that share the same or a very similar structure.


    In our example, the solution becomes giving the PM `Employee` class a `FirstName`
    and a `LastName` property in addition to its `FullName` property, but also making
    the `FirstName` and `LastName` properties protected.


    The O/O Mapper should have no problems accessing the protected PM properties using
    reflection, so it will be able to map to them from the Domain Model''s `FirstName`
    and `LastName` properties, but only the `FullName` property will be exposed to
    the client by the PM object.'
