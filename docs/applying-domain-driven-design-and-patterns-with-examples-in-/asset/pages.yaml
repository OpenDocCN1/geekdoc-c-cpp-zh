  md: "+   - Use specially provided datatypes, such as for collections\n+   - Implement\
    \ a specific interface\n+   - Provide specific constructors\n+   - Provide mandatory\
    \ specific fields\n+   - Avoid certain constructs\n\nThere is at least one more,\
    \ and one that is so obvious that I forgot. You shouldn't have to write database\
    \ code such as calls to stored procedures in your Domain Model classes. But that\
    \ was so obvious that I didn't write specifically about it.\n\nLet's take a closer\
    \ look at each of the other points.\n\n# Inherit from a Certain Base Class\n\n\
    With frameworks, a very common requirement for supporting persistence is that\
    \ they require you to inherit from a certain base class provided by the framework.\n\
    \nThe following might not look too bad:\n\n```\n```csharp\npublic class Customer\
    \ : PersistentObjectBase\n{\n    public string Name = string.Empty;\n\n    ...\n\
    \n    public decimal CalculateDepth()\n    ...\n}\n```\n```\n\nWell, it wasn't\
    \ too bad, but it did carry some semantics and mechanisms that aren't optimal\
    \ for you. For example, you have used the only inheritance possibility you have\
    \ for your Customer class because .NET only has single inheritance. It's certainly\
    \ arguable whether this is a big problem or not, though, because you can often\
    \ design \"around\" it.\n\nIt's a worse problem if you have developed a Domain\
    \ Model and now you would like to make it persistent. The inheritance requirement\
    \ might very well require some changes to your Domain Model. It's pretty much\
    \ the same way you start developing a Domain Model with TDD. You have the restriction\
    \ from the beginning that you can't use inheritance and have to save that for\
    \ the persistence requirement.\n\nSomething you should look out for is if the\
    \ inheritance brings lots of public functionality to the subclass, which might\
    \ make the consumer of the subclass have to wade through methods that aren't interesting\
    \ to him.\n\nIt's also the case that it's not usually as clean as the previous\
    \ example, but most of the time PersistentObjectBase forces you to provide some\
    \ method implementations to methods in PersistentObjectBase, as in the Template\
    \ Method pattern [GoF Design Patterns]. OK, this is still not a disaster, but\
    \ it all adds up."
