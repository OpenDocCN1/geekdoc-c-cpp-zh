  md: 'is outside doesn''t really matter that much.


    From a narrow perspective, a good reason for the division into several Bounded
    Contexts is to be able to think about all the details within one model and to
    be able to keep it pure. At the same time, from a wider perspective we can think
    about "large" abstractions that are easy to grasp and think about in overview
    terms.


    A strong advantage of the Aggregate is its boundary. It simplifies life, decreases
    coupling, and makes connections more explicit. Again we find advantages of a boundary,
    this time on a higher level with the Bounded Context.


    # Note


    Although I see great value in boundaries, there are also costs. You might introduce
    a lot of overhead when it comes to communication and performance. As usual, keep
    it simple and add complexity when you gain more than the cost.


    If we bind this to the example I used in the previous chapters, that of the sales
    order, there might be one bounded context for ordering and another for shipping.
    This is not how I started to talk about it in my little example, but in a real-world,
    large scale situation it might make sense from a technological standpoint, and
    different parts of the organization might very well be dealing with each of those
    business processes, which might be a good reason for the split.


    # How Do Bounded Contexts and Partitions Relate?


    I''ve been talking about partitions and Bounded Contexts, but that doesn''t mean
    that I see them as the same thing. It''s possible that the Bounded Context is
    the same as a typical partition. It might also be that a Bounded Context is built
    up of several partitions instead, but probably not the opposite.


    # Scaling up DDD Projects


    A typical reason for applying Bounded Contexts is that they provide a way of making
    it possible to scale up DDD to larger contexts. Instead of having one huge Domain
    Model that a huge team touches, it might make the effort of understanding the
    model much easier if you split the model into several smaller ones, letting the
    development groups focus on their own models.


    Bounded Contexts might also help preserve the Ubiquitous Language from becoming
    un-crisp and having loose definitions. Instead what you will get are several Ubiquitous
    Languages, one per Bounded Context, which is partly a bad buy. But on the other
    hand, each of these will be more powerful and exact. Rather two good, than one
    bad.


    When you find out that what you thought was a single model has started to have
    concepts with different meanings and that the Ubiquitous Language isn''t as clear
    and crisp as before, that can'
