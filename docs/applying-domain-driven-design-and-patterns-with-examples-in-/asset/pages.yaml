  md: "There are several things that make this class suitable for proxy-based AOP.\
    \ First of all, properties are implemented using a combination of private fields\
    \ and property getters and setters. If you used public fields instead, it would\
    \ be impossible for an AOP proxy to intercept property access.\n\nSecond, all\
    \ properties and methods are declared as virtual. This allows Spring. NET to create\
    \ a dynamic proxy by inheriting the `Account` class and injecting interception\
    \ code. If methods were final, the `Account` class would have to implement an\
    \ interface in order to be proxied using the composition proxy. If neither interface\
    \ nor virtual methods were present, it would've been impossible to create a proxy\
    \ for the `Account` class and apply AOP advices to it.\n\nThe final thing to notice\
    \ is the usage of the `StateModifier` attribute. We defined this attribute primarily\
    \ to show how advices can be applied based on attributes, but this is also a case\
    \ where using an attribute makes a lot of sense. It provides additional metadata\
    \ that makes it very obvious which methods modify object's state.\n\nWe could've\
    \ used the `StateModifier` attribute in front of property setters as well, but\
    \ in my opinion that is somewhat redundant. In addition to that, omitting `StateModifier`\
    \ in the case of properties gives us an opportunity to show you how to define\
    \ a composite pointcut.\n\nWhile it is possible to configure the locking aspect\
    \ using a code-only approach, it is somewhat cumbersome, so we'll show you only\
    \ the declarative approach in this case.\n\n```\n```xml\n<aop:aspect name=\"LockEnforcementAspect\"\
    >\n    <aop:pointcut name=\"StateModifiers\"\n        expression=\"class(Account+)\n\
    \        and (setter(*) or attribute(StateModifier))\"/>\n    <aop:advice type=\"\
    LockableAspectDemo.LockableIntroduction\"\n        pointcut=\"class(Account+)\"\
    />\n    <aop:advice type=\"LockableAspectDemo.LockEnforcerAdvice\"\n        pointcut-ref=\"\
    StateModifiers\"/>\n</aop:aspect>\n```\n```\n\nMost of the declaration should\
    \ be self-explanatory. Things that deserve attention are\n\n+   - The plus sign\
    \ behind the class name in the pointcut definition specifies that the pointcut\
    \ should match the specified class and classes derived from it.\n+   - The expression\
    \ `\"setter(*)\"` is used to match all property setters, regardless of their type\
    \ and name.\n+   - The expression `\"attribute(StateModifier)\"` is used to match\
    \ all the members that are marked with the `StateModifier` attribute.\n\nFinally,\
    \ we need to create a client that will leverage the introduced `ILockable` interface\
    \ the same way as if it was implemented directly by the `Account` class.\n\n```\n\
    ```csharp\nusing LockableAspectDemo.Domain;\n\nnamespace LockableAspectDemo.Services\n\
    {\n    public class AccountManager\n```\n```"
