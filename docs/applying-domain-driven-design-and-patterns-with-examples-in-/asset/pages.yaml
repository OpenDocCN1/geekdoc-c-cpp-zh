  md: 'I know what the database guys are thinking right now. "What about real-time
    consistency? Will the Repository method execute with the transaction isolation
    level of serializable in an explicit transaction during save at least?" Well,
    it is possible, but there are problems.


    One problem is that the O/R Mapper you are using (if we assume for the moment
    that an O/R Mapper is being usedmore about that in later chapters) might not allow
    you to take detailed control of the persist process regarding validation, locking,
    and so on. Another problem is that the nature of the persist process means it
    might take some time if you have lots of dirty instances to be persisted, so the
    lock time for all orders for the customer might be pretty long.


    I think that in this case it’s usually OK not to expect real-time consistency
    here, only something pretty close to real-time consistency. I mean, check the
    sum of the other orders just before saving this order, but do not span the read
    with a high isolation level or not even do the check within the same transaction.


    I think that goes pretty much hand in hand with what Evans says regarding Aggregates
    [Evans DDD]. He says something like strive for real-time consistency within an
    Aggregate, but not between Aggregates. Consistency problems between Aggregates
    can be dealt with a little later.


    So if you find the approach acceptable (again, we are talking about a pretty low
    risk here, for a typical system at least), but you would like to detect the problem,
    you could create some batch program that kicks in every now and then and checks
    for problems like this and reports back. Or why not put a request on a queue at
    persist time that checks for problems like this regarding the particular customer?
    It''s such an unlikely problem, so why should any user have to wait synchronously
    for it to be checked?


    The fact that I think the method is atomic signals that we should use a Service
    [Evans DDD] instead to make the whole thing more explicit. The Service could check
    the current debt and therefore be used proactively by the Order at good places
    in time. It could also be used pretty much reactively at save time, and some sort
    of request could be put on a queue and be used reactively after save. The Service
    would probably use the same Repository method as was just discussed, but that’s
    not anything the caller needs to know, of course.


    What should it do reactively after the save? Perhaps move the order to one of
    two states so that when the user stores an order, it goes into state NewOrder.
    Then the Service kicks in and moves the order to state Accepted or Denied, as
    shown in Figure 7-1.


    # **Figure 7-1. State graph**'
