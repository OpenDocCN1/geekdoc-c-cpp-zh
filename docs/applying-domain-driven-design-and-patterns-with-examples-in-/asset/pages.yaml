- pgno: 125
  md: "I think this is slightly clearer and more fluent.\n\nWhat's left is the calculation\
    \ itself when we have the unusual situation taken care of. It looks like this:\n\
    \n```\nint years = DateTime.Now.Year - BirthDate.Year;\nif (DateTime.Now.DayOfYear\
    \ < BirthDate.DayOfYear)\n    years--;\n\nreturn years;\n```\n\nYet again I use\
    \ the Extract Method refactoring, moving the calculation to another private method\
    \ called _NumberOfYears(). The complete HowOld() method then looks like this:\n\
    \n```\n//Person\npublic int HowOld()\n{\n    if (_IncorrectBirthDate())\n    \
    \    throw new ArgumentException(\"Incorrect birthdate!\");\n\n    return _NumberOfYears();\n\
    }\n```\n\nSure, we could find more to do (for example in the newly created private\
    \ method _NumberOfYears() or factoring out some logic from the class itself),\
    \ but you get the message by now.\n\nIt's important to stress that we should re-execute\
    \ the tests after each step to confirm that we didn't introduce any errors, according\
    \ to the tests at least.\n\nWhat we did, though, was time-consuming and error\
    \ prone. If you use lots of discipline, it is possible to deal with the error\
    \ proneness, but it's still time-consuming. Having the concepts in place, but\
    \ finding out that they are time-consuming to apply is a perfect situation for\
    \ using the support of a tool, if you ask me.\n\n# Cleaning Tool\n\nThere are\
    \ several different refactoring tools around. If we focus on .NET, we have, for\
    \ example, ReSharper [ReSharper] and Refactor! [Refactor!], which are add-ins\
    \ to Visual Studio .NET. In the 2005 edition of Visual Studio .NET, there is also\
    \ built-in refactoring support in the IDE.\n\nThose refactoring tools make the\
    \ changes similar to what we just made in order to help us become more productive.\
    \ The value of this should certainly not be underestimated. As a matter of fact,\
    \ when you get used to a refactoring tool, there's no way you will want to give\
    \ it up!\n\nThe tools not only help you make the changes you want, they can also\
    \ tell you about when and what changes need to be made. In this way, the tools\
    \ free you to some small degree from some of the discipline of having to think\
    \ about refactoring by providing a visual reminder."
