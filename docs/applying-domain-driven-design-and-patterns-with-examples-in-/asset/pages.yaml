  md: '# A Few Words About Saving


    I mentioned saving data previously. `AddOrder()` isn''t really saving; it just
    adds the `Order` to the `Repository`. Or should it mean saving also? No, I don''t
    think I want that behavior. What I want from `AddOrder()` is that the `Repository`
    (and underlying infrastructure) from that point should know about the instance
    and deal with it when I ask for a `PersistAll()`.


    I need to ask the infrastructure to deal with the save functionality. The question
    for now is if I want to state the `PersistAll()` to the `Repository` instance
    or to something at a higher level that monitors instances for all the `Repositories`.
    Again, I think I''m drifting away from the Domain Model and into the infrastructure
    part. I''m glad the question was raised, but parts of the discussion will have
    to wait until the next chapter. There is a great deal that we need to discuss
    as far as that is concerned. For now, I''m happy with `AddOrder()` as a way of
    letting the `Repository` know about the instance. As far as the tests that have
    been written so far are concerned, it doesn''t really matter that the instance
    is transient (but prepared for being persisted) and not persistent at that point
    in time.


    OK, I''m as eager as you are to get writing some more tests. What''s on the list?
    Well, I have dealt with most of it in feature 2, "List the orders when looking
    at a specific customer." What I haven''t dealt with there is showing the total
    amount for each order, type of order, and reference person.


    Let''s take them one by one, starting with total amount for each order.


    # Total Amount for Each Order


    At first this seems like a trivial task. I need to create an `OrderLine` class
    that I hook into the `Order` class as a list. Then I can just iterate over the
    `OrderLine` collection and calculate the total amount. I could actually do that
    from the consumer code, of course, but I don''t want to. That would reveal the
    algorithm to the consumer, and it''s not all that clear or purposeful either.
    In reality, the algorithm will become much harder when we move further, adding
    discounts of many different kinds, for example. Instead, I want a read-only property
    called `TotalAmount` on the `Order` class. Again, it could internally iterate
    over the `OrderLine` collection and calculate the value.


    But this is getting to be too much for me, the "premature optimizer guy" that
    I am (even though I''m trying hard not to be). Instantiating all `OrderLines`
    for each `Order` for a `Customer` just to be able to show the `TotalAmount` of
    the orders sets off the alarm bells. This might not be a problem depending upon
    the execution environment and chosen infrastructure. On the other hand, in the
    case of a distributed system, it is a problem, and potentially a big one that
    can hurt the database server, the network, and the garbage collector.


    I must admit I have to force myself not to deal with this optimization right away.
    It''s simple to fix it directly, but it''s not really important right now when
    I''m crunching what the Domain Model should look like. It''s much more important
    right now to design for simplicity and clarity, and get back later with a profiler
    to see if it''s a *real* performance problem. So I start with the simplest solution
    and can then refactor the `TotalAmount` property later on if the performance characteristics
    aren''t good enough.'
