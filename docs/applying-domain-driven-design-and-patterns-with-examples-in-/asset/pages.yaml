  md: "Just as with the Repositories, it would be nice to write the queries \"correctly\"\
    \ from day one in a single implementation which could be used both with the Fake\
    \ and with the real infrastructure. How can we deal with this?\n\nLet's assume\
    \ that we want to work with Query Objects [Fowler PoEAA] (encapsulate queries\
    \ as objects, providing object-oriented syntax for working with the queries) and\
    \ we also change the signature from `GetAll()` to call `GetByQuery()` and to let\
    \ it take an `IQuery` (as defined in NWorkspace) instead. The code could now look\
    \ like this:\n\n```\n```csharp\n//OrderRepository\npublic IList GetOrders(int\
    \ orderNumber)\n{\n    IQuery q = new Query(typeof(Order));\n    q.AddCriterion(\"\
    OrderNumber\", orderNumber);\n    return _ws.GetByQuery(q);\n}\n```\n```\n\nOK,\
    \ that was pretty straightforward. You just create an `IQuery` instance by saying\
    \ which type you expect in the result. Then you set the criteria you want for\
    \ holding down the size of the result set as much as possible, typically by processing\
    \ the query in the database (or in the Fake code, in the case of when you're using\
    \ the Fake implementation).\n\n# Note\n\nWe could pretty easily make the query\
    \ interface more fluent, but let's stay with the most basic we can come up with\
    \ for now.\n\nThat was what to do when you want to instantiate part of the Domain\
    \ Model. Let's get back to the `_GetNumberOfStoredCustomers()` that we talked\
    \ about earlier. How could that code look with our newly added querying tool?\
    \ Let's assume it calls the Repository and a method like the following:\n\n```\n\
    ```csharp\n//CustomerRepository\npublic int GetNumberOfStoredCustomers()\n{\n\
    \    return _ws.GetByQuery(new Query(typeof(Customer))).Count;\n}\n```\n```\n\n\
    **It works**, but for production scenarios that solution would reduce every DBA\
    \ to tears. At least it will if the result is a SELECT that fetches all rows just\
    \ so you can count how many rows there are. It's just not acceptable for most\
    \ situations.\n\nWe need to add some more capabilities in the querying API. Here's\
    \ an example where we have the possibility of returning simple types, such as\
    \ an `int`, combined with an aggregate query (and this time aggregate isn't referring\
    \ to the DDD pattern Aggregate, but, for example, to a SUM or AVG query in SQL):"
