    \ that depends on the particular application. Letting the `Order` check the current\
    \ debt for the `Customer` when it's time for `OrderNow()` might be a bit late\
    \ regarding the usability aspect for the user. Perhaps a better solution would\
    \ be to ask what the maximum amount of a new order can be before creating the\
