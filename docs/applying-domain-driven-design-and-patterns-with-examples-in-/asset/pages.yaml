- pgno: 359
  md: "+   - O/R Mapper\n\nIn the case of the guid, you can generate it in all the\
    \ layers, but it's recommended that you do it in the O/R Mapper. In the example\
    \ with IDENTITY just shown, the value is generated in the database, and that actually\
    \ affects the programming model a lot. First, there will be a database jump earlier\
    \ than you expect. Second, there might be an INSERT just to grab the IDENTITY\
    \ value. Both examples are something I consider to be problems, and therefore\
    \ I don't like to use IDENTITY s more than is necessary.\n\n# NHibernate Supports\
    \ COMBs\n\nAs a matter of fact, Guid s are often a very nice solution. But perhaps\
    \ some of you have read my article about a possible cost of INSERT s when you\
    \ use Guid s as primary keys [Nilsson COMB]. The problem is that the INSERT throughput\
    \ might be many times lower for tables with Guid s for primary keys than if you\
    \ use int s. That's not a problem you will typically get, but it might come and\
    \ bite you if you have very large tables and a high INSERT load. I suggested a\
    \ solution to the problem in the article I called \"COMB.\" It's basically a Guid\
    \ , but kind of a sequential one. I was very surprised to see that NHibernate\
    \ added support for COMB in a specific alpha version. To use the COMB generator,\
    \ the metadata could look like this (the only difference is that generator is\
    \ guid.comb and not just guid ):\n\n```\n```xml\n<id name=\"Id\" access=\"field.camelcase-underscore\"\
    \nunsaved-value=\"00000000-0000-0000-0000-000000000000\" >\n    <generator class=\"\
    guid.comb\" />\n</id>\n```\n```\n\nIt is easiest for you if you let NHibernate\
    \ generate the Guids for you, but that's not always possible, of course. Sometimes\
    \ you must use assigned Identity Fields instead, which makes it quite a bit harder.\
    \ For example, you can't let NHibernate determine using UPDATE or INSERT by looking\
    \ at unsaved-value . Instead, you will typically tell NHibernate what to do with\
    \ explicit calls to Save() or Update() instead of SaveOrUpdate() .\n\n# Note\n\
    \nAs I said earlier in this chapter, you can use the version tag-unsaved-value\
    \ tag for helping you out when you prefer to set the Identity Field values on\
    \ your own.\n\nThese were just a few examples of strategies for Identity Fields.\
    \ NHibernate supports many more. You can also plug in your own strategies quite\
    \ easily.\n\n# Foreign Key Mapping"
