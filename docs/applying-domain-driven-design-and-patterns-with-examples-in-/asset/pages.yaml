- pgno: 253
  md: '# Principles for Rules and Their Usage


    I think the word principle is very good because it''s not strict. It''s much easier
    to come up with principles than categories, probably because of the built-in vagueness.
    Still, principles are descriptive regarding intention. That''s exactly what I
    need here and now.


    # Two-Way Rules Checking: Optional (Possible) to Check Proactively, Mandatory
    (and Automatic) to Check Reactively


    You should be able to check in advance (proactively) whether there will be a problem
    (for example, trying to persist the current changes) so that you can take corrective
    measures. That way, the programming model will be easier.


    And if you fail to check in advance, there is no mercy, but you will learn (reactively)
    that there were problems via an exception.


    # All States, Even When in Error, Should be Savable


    Users hate to learn from applications that they can''t save the current changes
    because of errors. A friend of mine has compared it to not being allowed to save
    a word processing document if you have spelling errors.


    All is a "big" word, but we will try to at least come close. We should try to
    avoid reaching those states that won''t be persistable.


    It''s also important to think about what error means here. An order might be considered
    to be in error if it''s too large. But until the user tries to submit the order
    it''s not really an error, just a situation he needs to deal with before submitting.
    And he should be able to save that order before he submits it so he can continue
    working on it later on, to solve the problem and submit it then.


    # Rules Should Be Productive to Use


    It should be productive to work with rules, both when consuming the rules and
    when defining the rules themselves.


    The productivity for consuming rules will be addressed by making it possible to
    fetch metadata to be used for setting up the UI. That will cut the times you find
    problems when you check because the UI has helped so that some problems just won''t
    happen. (Just watch out so you don''t trust the UI to be all that is needed regarding
    rules checking.)


    The productivity goal for defining rules might be reached with a small framework
    that lets you focus on the interesting parts of the rules, and the boilerplate
    code will be dealt with for you.'
