    But then I have two different Unit of Work instances and two Identity Maps (it
    doesn''t have to be that way, but let''s assume it for the sake of the discussion),
    which can give pretty strange effects if we aren''t very careful. After all, all
    five lines in the first example were one scenario, and because of that I find
    it most intuitive and appropriate to treat it like one scenario regarding how
    I deal with the Unit of Work and Identity Map as well. I mean, the scenario should
    just have one Unit of Work and one Identity Map.


    Another thing that might be a problem is that when the Repository hid the Unit
    of Work it probably meant that there were two database transactions. That in turn
    means that you might have to prepare to add compensating operations when the outcome
    of a scenario isn''t as expected. In the previous case, it''s probably not too
    disastrous if the Customer is added to the database but not the Order. However,
    it can be a problem, depending upon your Aggregate design.


    That said, Aggregates "should" be designed so that they are in a consistent state
    at PersistAll() time. But the loose relationship between Aggregates doesn''t typically
    live under such strict requirements. That might make you like the second solution.
    On the other hand, the second solution would store two totally unrelated customers
    in the same PersistAll() if both of those customers were associated to the Repository.
    That is actually less important than grouping a customer and its orders together.
    Aggregates are about objects, not classes.


    What speaks for the solution in the second example is if one Aggregate comes from
    one database and the other Aggregate is stored in another database at another
    database server. Then it''s probably easiest to have two Unit of Work-instances
    anyway, one for each database. So, solution two is slightly less coupled.


    # Note


    I could even let Add() fulfill the transaction, but then I have different semantics
    from those I have discussed and expressed so far. It would be crucial to call
    Add() at the right point in time. This is less important with the solution I have
    chosen, as long as the call is done before PersistAll().'
