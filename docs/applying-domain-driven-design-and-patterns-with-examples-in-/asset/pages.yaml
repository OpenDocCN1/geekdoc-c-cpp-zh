- pgno: 270
  md: '![](img/89fb3513cb9b6343875aadbfd042005d_270_0.png)


    After all this rambling I think we have three decent solutions to the problem:
    one with pretty tight coupling (everything being done in real time, possibly with
    high transaction isolation level), one with less coupling (but that is perhaps
    a bit more complex because there are more "moving parts"), and finally one where
    we don''t do anything extra beyond what was shown in the test (but with a small
    risk of inconsistency that we will have to track delayed). Would one of these
    suit you?


    OK, we touched upon using a Service for helping us out with a costly processing
    problem. Services in the Domain Model often arise from another necessity as well.


    # Service-Serviced Validation


    Completely by coincidence, we do need such a rule that is by its very nature service-based.
    I''m thinking about feature 8, "Before a new customer is considered OK, his or
    her credit will be checked with a credit institute."


    We could very well call that credit institute service in the Grant() method, or
    we could use a solution similar to the one I just sketched, letting our Service
    kick in after persist, taking care of both calling the external service and moving
    the customer to one of two states. One problem with this approach is that I''m
    binding domain rules a bit too much to persistence.


    Another big problem with this approach of moving some functionality out of the
    sandbox of the current Unit of Work/Identity Map is that what you might have in
    your local cache will be out of sync with the database because processing takes
    place in the autonomous Service. Of course, that''s the risk you always have with
    caching, if the cache could be bypassed.


    If you know that the cache will be invalidated because of an explicit Service
    call in real time, it''s pretty easy. Just kill the cache. It might be expensive
    to recreate it, though, or perhaps you even know exactly what needs to be refreshed.
    On the other hand, if you don''t know when the operation that invalidates the
    cache will happen, you have to take extra care and refresh the cache as often
    as possible. As I see it, all this hints at being aggressive with your cache management
    and not letting the cache get too big and live for a long time, at least not for
    the data that changes quite frequently.


    # Note'
