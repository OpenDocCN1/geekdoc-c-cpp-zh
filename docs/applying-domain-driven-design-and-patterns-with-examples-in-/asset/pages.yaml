  md: '# 4. Concurrency Conflict Detection Is Important


    Hmmm...feature 4 is tricky. I think a reasonable solution here is that `Customer`
    is on its own, and `Order` together with `OrderLines` is a concurrency unit of
    its own. That fits in well with making it possible to use the Domain Model for
    the logic needed for features next. I use the pattern called Aggregate [Evans
    DDD] for this, which means that you decide what objects belongs to the certain
    clusters of objects that you typically work with as single units, loading together
    (by default, at least for write scenarios), evaluating rules together, and so
    on.


    It''s important to note, though, that the Aggregate pattern isn''t first and foremost
    a technical pattern, but rather should be used where it adds meaning to the model.


    Concurrency unit is one thing Aggregate is used for. (See Figure 4-6.)


    # Figure 4-6. Aggregates


    ![](img/89fb3513cb9b6343875aadbfd042005d_146_0.png)


    # 5. A Customer May Not Owe Us More Than a Certain Amount of Money


    Feature 5 is also pretty tricky. The first solution that springs to mind is probably
    to add a `TotalCredit` property on the `Customer`. But this is problematic because
    it''s then a bit too transparent, so that the consumer sees no cost at calling
    the property. It''s also a consistency issue. I''m not even seeing the `Customer`
    Aggregate as having the `Orders`, so I don''t expect the unit to be the correct
    one for assuming consistency handling directly in the Domain Model, which is a
    good sign that I should look for another solution.'
