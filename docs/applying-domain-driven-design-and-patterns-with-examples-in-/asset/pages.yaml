- pgno: 450
  md: '# Mapping and Wrapping


    By Mats Helander


    With the aid of O/R Mapping, we are able to connect our Domain Model to the relational
    database. Together with the business methods that we add to the Domain Model classes
    and possibly to a Service Layer [Fowler PoEAA], we have a pretty solid architecture
    in place for the structural and functional foundation of the application.


    That brings us to the last stretch—the *Presentation Layer* (PL). While you and
    I may consider the Domain Model to be the heart of the application, end users
    are likely to think of whatever they are presented with as the final basis for
    judgment.


    This means that no matter how cool your Domain Model (and supporting Service Layer)
    is, no one will applaud your work (except a fellow developer) unless you provide
    access to your model via some whiz-bang UI.


    The good news is that, if you''re lucky, connecting a PL to your Domain Model
    can be a piece of cake. The bad news is that, whenever you''re not that lucky,
    it can be quite a challenge.


    In the simplest case, your Domain Model is already "presentable" and you could
    just data bind directly to the Domain Model objects. However, the interface of
    an application frequently demands that information is presented in a more "user
    friendly" form than it was in the Domain Model.


    # Mapping and Wrapping


    Whenever the Domain Model objects fall short of being immediately presentable,
    you''ll have to make a choice: Should you just *wrap* your DM objects or should
    you *map* a new set of objects to them?


    For example, say that you have a DM class called `Person`, with `FirstName` and
    `LastName` properties. However, in the UI, you want to have a single text box
    for editing a person''s full name.


    One way of doing this, of course, is to have some code in your UI that simply
    reads from the DM `Employee` object''s first and last names and writes to the
    textbox and that reads from the textbox and writes to the `Employee` object properties
    when the user hits Save.


    A lot of the time, in the so called "real world," this is how UI requirements
    are solved—by what is essentially an accumulating heap of hacks.


    In the end, this is not the path toward a maintainable application, and that is
    what motivates us to look for a design that will scale with increasing complexity
    and size of the application.


    One recurring solution is to complement the Domain Model objects with a new set
    of objects, often'
