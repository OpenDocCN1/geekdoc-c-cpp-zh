- pgno: 100
  md: '# # Test-Driven Development (TDD)


    After having used TDD for a couple of years now, I''m still getting even fonder
    of the technique. I''m becoming more and more convinced that TDD is the single
    most important technique in becoming a better programmer. Strong words any substance?
    You’ll have to try it out on your own to know for yourself, of course, but let''s
    have a look at what it''s all about. Let''s start with a short repletion from
    Chapter 1, "Values to Value," about the flow.


    # ## The TDD Flow


    First, you start writing a test. You make the test fail meaningfully so that you
    can be sure that the test is testing what you think it should.


    The second step is to write the simplest possible code that makes the test pass.


    The third step is to refactor.


    Then you start all over again, adding another test.


    If we use xUnit lingo, the first step should give you a red light/bar, and the
    second step should give you a green light/bar. (Unfortunately, compilation errors
    and refactoring don''t have colors yet.)


    So the mantra is Red, Green, Refactor. Red, Green, Refactor…


    # ## Time for a Demo


    I''m assuming that you are familiar with Testdriven.net [Testdriven.net], NUnit
    [NUnit], or some other similar tool (or pick up some such tool now and learn the
    basics on your own). So instead of a tool discussion, I''ll focus on how to apply
    the concept of TDD.


    I know, I know. There are an enormous number of good demonstration texts on how
    to use TDD, such as [Beck TDD], [Astels TDD], [Martin PPP]. Anyway, I''d like
    to have a go at demonstrating it myself. Rather than doing what is most common,
    I won''t use a homemade toy example, but I''ll use an example from a real-world
    application of mine.


    A few years ago, I was asked by Dynapac to write an application that they could
    bundle with a new line of planers that they produced. The planers are used for
    removing old asphalt before paving out new. Asphalt milling is used to restore
    the surface of asphalt pavement to a specified profile. Bumps, ruts, and other
    surface irregularities are removed, leaving a uniform, textured surface.


    The application would be used for calculating a number of different things, helping
    to optimize the usage of the planers. The application needed to be able to calculate
    the hardness of the old asphalt, the time needed to plane a certain project, the
    trucks needed to keep milling with the minimum cost, and lots of other things.'
  merge: -1
  img_proc: true
