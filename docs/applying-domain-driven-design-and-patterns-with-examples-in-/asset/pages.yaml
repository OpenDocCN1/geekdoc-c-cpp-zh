    Is it good or bad that NHibernate is using the Framework/reflective approach?
    I really believe that

    it is mostly a good thing when it comes to O/R Mappers.


    # Starting Point


    When you are working with a certain O/R Mapper, you can often choose one or more
    starting points

    from the following list:


