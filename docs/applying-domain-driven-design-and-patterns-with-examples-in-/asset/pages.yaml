    I think it''s moving away from the style I like. I think it breaks the *Single
    Responsibility Principle* (SRP) [Martin PPP], and it''s low PI-level. I think
    I''m also moving into "matter of taste" territory.


    I also have a problem with inconsistency if one save goes well and others do not.
    (You could argue that physical transaction and Unit of Work don''t have to be
    the same, but that increases complexity in my opinion. The way I see it is if
    you don''t have to do something, you shouldn''t.)


