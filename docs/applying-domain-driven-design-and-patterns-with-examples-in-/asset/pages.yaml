- pgno: 460
  md: 'If you doubt that all this extra architectural overhead in the form of PMs,
    O/O Mappers, and transformation logic methods is really necessaryfine, perhaps
    you''re lucky enough to find yourself with a presentable Domain Model.


    The bottom line, however, is that you should *really, really* try to avoid modifying
    the Domain Model in order to suit it to the needs of the PLdon''t try to make
    your Domain Model work double as a PM unless you can get away with that without
    changing the Domain Model.


    As soon as you recognize that there is a difference between the way you want to
    represent your Domain Model in the core of the application and the way you want
    to present it to the user, you recognize the need for a PMat least as long as
    you want to follow the advice of *never burdening the Domain Model with PL aspects.*


    I am slightly fanatic about keeping my Domain Model objects completely oblivious
    of PL aspects. This means that if my Domain Model could be data bound to directly
    and if only some attributes were added to the properties (like attributes for
    specifying category and default value for binding to the property grid), I''ll
    refrain from adding those PL attributes to my Domain Model objects. Instead I''ll
    opt for complementing my Domain Model with a PM even if it is in every detail
    exactly the same as the Domain Model, except for the attributes. If you can''t
    identify yourself with the lunatic fringe demographic, though, perhaps you''ll
    stop short of that.


    But one reason I keep doing that is that as soon as the PM is thereas well as
    the supporting infrastructure for Wrapping or Mapping to the Domain Model I usually
    find plenty of opportunity for refining the presentational aspects of the PM,
    and soon enough the two models will begin to become more and more different, making
    it easier and easier to motivate complementing the Domain Model with a PM.


    Thanks, Mats!


    ⬅ PREV


    NEXT ➡'
