    \ If we modify our test so that it uses a UserDaoStub object, we will also need\
    \ to set up the expected result by setting the UserResult property before the\
    \ Insert() method is executed.\n\nA second aspect to consider is that the dependency\
    \ on the database is now completely removed and our initial test is now much faster.\n\
    \nBecause SaveUser() delegates most of its behavior, however, such a test provides\
    \ virtually no value. Actually, on second thought, I would also add that we are\
    \ committing the deadly (but unfortunately common) sin of putting assertions on\
    \ values returned from our stubs. So we are effectively testing our stubs rather\
    \ than UserBC!\n\nOn the other hand, it's a different story if we want to know\
    \ how our UserBC class reacts when the data access layer throws an exception such\
    \ as DalUnique-ConstraintException a situation that could occur if the user login\
    \ already exists on the database.\n\nThe Insert() method in the stub class now\
    \ becomes\n\n```\n//UserDaoStub\npublic void Insert(IUserInfo user)\n{\n    if\
    \ (ThrowDalUniqueConstraintExceptionOnInsert)\n        throw new DalUniqueConstraintException();\n\
    \    \n    user.ID = UserResult.ID;\n    user.Name = UserResult.Name;\n    //\
    \ etc\n}\n```\n\nAssume we'd like the UserBC to catch the DalUniqueConstraintException\
    \ and throw a proper business exception to maintain the abstraction of the layers.\
    \ The following test illustrates this scenario:\n\n```\n[Test] // Note no database\
    \ is needed anymore!\n[ExpectedException(\n    typeof(BusinessException),\n  \
    \  \"The provided login already exists.\")]\npublic void TestUserBCSaveUserThrowsBusinessException()\n\
    {\n    // Setting stubs to remove all dependencies\n    IUserInfo user = new UserInfoStub\
    \ (\n        \"Claudio\", \"Perrone\", \"Login\", \"MyPassword\");\n    \n   \
    \ UserDaoStub daoUser = new UserDaoStub();\n```"
