- pgno: 343
  md: '```

    Customer c = new Customer();

    c.Name = "Volvo";


    _session.Reconnect();

    _session.Save(c);

    _session.Flush();

    _session.Disconnect();

    ```


    In this case, I was specific and told the ISession that it should lead to an INSERT
    (because I called Save()). I could have called SaveOrUpdate() instead, and then
    NHibernate would have decided on its own whether it should be an INSERT or an
    UPDATE. The information used in that case is the value of the Identity Field,
    and it''s compared to what you indicated for unsaved-value in the mapping file
    ("00000000-0000-0000-0000-000000000000" in the case of Guids). If the Identity
    Field matches the unsaved-value, it''s time for an INSERT; otherwise, it would
    be an UPDATE.


    It is also important pointing out that the INSERT is delayed and won''t happen
    when you say Save(), but rather when you say Flush(). The reason for this is that
    you should be able to make many changes in the consumer and then get them all
    persisted together and as late as possible.


    Did we succeed in writing to the database? The easiest way to check that is to
    read the instance back, so let''s do that.


    # CRUD-R (One): Read One


    The second example is to read one instance (row in the database) by its Identity
    Field. From now on, let''s assume that we use the ordinary reconnect/disconnect
    snippet and just focus on the specific code instead.


    As usual, you talk to the ISession instance. You call Load()/Get() and say what
    type you are looking for and its Identity Field value. It could go like this:


    ```

    Customer c = (Customer)_session.Load(typeof(Customer), theId);

    ```


    But beware. This didn''t necessarily prove anything if you didn''t close the ISession
    since the last Flush(), because the ISession will provide you with the instance
    from the Identity Map [Fowler PoEAA] when you call Load()/Get() instead of going
    to the database. What you can do to force a database jump (instead of opening
    a new ISession) is to call Evict() on the instance by saying that you don''t want
    the Identity Map to keep track of the instance any longer. It could look like
    this:


    ```

    _session.Evict(customer);

    ```


    That was good, but what if you don''t know the identity value? Perhaps you only
    know part of the name of the customer and want to fetch all instances that match
    that name pattern. This takes us over to the next example, that of read many.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# CRUD-R (Many): Read Many


    There are two specific languages for querying in NHibernate. But we are going
    to use Hibernate Query Language (HQL) for this example. It''s pretty similar to
    SQL, yet different. In order to fetch all customers with a name that starts with
    "Vol", the code could look like this:


    ```

    //A consumer

    string hql = "select from Customer where Name like ''Vol%''";

    IList result = _session.CreateQuery(hql).List();

    ```


    So in the result, you will get a list of customers with names that start with
    "Vol", just as you expected.


    Normally, you wouldn''t write code as static as this and would use parameterization
    instead. But again, I just want to show very simple code here in order to give
    you a quick feeling of how it could be done.


    # CRUD-U: Update


    We found lots of instances with names starting with "Vol". We saw that we needed
    to make some changes to one of them. We made the changes to the properties of
    that instance, and we are now ready to persist the changes. Again, we can use
    SaveOrUpdate(), but here we know that it''s a question of an UPDATE, so we use
    Update() like this instead (continuing from the previous snippet):


    ```

    Customer c2 = (Customer) result[0];

    c2.Name = "Ford";

    _session.Update(c2);    //Can be skipped

    _session.Flush();

    ```


    As a matter of fact, because we found the instance via a read, we didn''t have
    to make the Update() call at all. The instance was already associated with the
    ISession and so it would have been taken care of anyway at Flush() time.


    # CRUD-D: Delete


    One of the found instances was wrong, so it should be deleted. That could be done
    like this:


    ```

    //A consumer

    Customer c3 = (Customer) result[1];

    _session.Delete(c3);

    _session.Flush();

    ```


    As you probably guessed, Delete() is delayed until Flush().


    That was pretty straightforward, wasn''t it?'
  merge: -1
  img_proc: true
- pgno: 345
  md: "# # Transactions\n\nBefore we leave the API example, I think it's important\
    \ to have a look at how transactions can be controlled when NHibernate is used,\
    \ because transactions are used a great deal.\n\nIf you are used to other ways\
    \ of manual transaction control, it's easy to understand how it's done with NHibernate\
    \ as well. What you do is grab an `ITransaction` instance, which you can then\
    \ use to make either a `Commit()` or `Rollback()` (`Commit()` will by default\
    \ automatically do a `Flush()`). The complete snippet could look like this:\n\n\
    ```\n```csharp\n//A consumer\nITransaction tx = _session.BeginTransaction();\n\
    try\n{\n    tx.Commit();\n}\ncatch (Exception ex)\n{\n    tx.Rollback();\n}\n\n\
    ...\n```\n```\n\n# ## Note\n\nSuddenly I used exception handling in the code snippet.\
    \ The reason is that `Rollback()` makes most sense then. Of course, exception\
    \ handling should be used for the other snippets as well, but here in the book\
    \ it would mostly be a distraction.\n\nI think that finishes an extremely short\
    \ introduction. See the NHibernate site [NHibernate] for much more information\
    \ on how to get started.\n\nWe now move on to positioning the chosen example of\
    \ a Persistence Framework with the structure that was presented in [Chapter 8](#).\
    \ First, let's take a look at the overall requirements."
