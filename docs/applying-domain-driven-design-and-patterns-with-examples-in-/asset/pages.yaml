- pgno: 164
  md: '# Note


    There is an open source project called Prevayler [Prevayler] (and there are others
    that are similar) that supports Domain Model instantiations that are stateful,
    shared, and complete. So that means more or less that the Domain Model and the
    database are the same thing. For that to be possible, we need large amounts of
    RAM, but that''s less of a problem today because memory prices are falling, and
    64-bit machines are becoming commonplace.


    The idea is that it writes to a sequential log file each time there is a change
    to the database. If the power goes, the Domain Model instantiation can come back
    by reading an image created at a certain point in time and reading through the
    log file. This is pretty simple and extremely efficient execution-wise because
    all data is in memory.


    What we have then is basically an object database, but a simple one because there
    is no need for faulting or other such things. All instances are in memory all
    the time, and there is no need for O/R Mapping from/ to a relational database,
    not even from/to an object database. There is just the Domain Model instantiation.


    OK, from now on in this book I will leave the added complexity because of the
    application server and just assume that we work with the rich client including
    the Domain Model or a web application, which again talks directly to the Domain
    Model.


    One reason for this decision is that I think the classic way of using application
    servers is in a way disappearing, or at least changing. What''s the driving force
    regarding that? Perhaps SOA, but that''s another story (which we talk a bit about
    again in Chapter 10).'
