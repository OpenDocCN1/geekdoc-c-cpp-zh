- pgno: 127
  md: "Now the subclasses can inherit from TotalBase and provide a custom implementation\
    \ of the VariationPoint() method. It could look like this:\n\n```\npublic class\
    \ TotalSub : TotalBase\n{\n    protected override void VariationPoint()\n    {\n\
    \        Console.WriteLine(\"Hello world!\");\n    }\n}\n```\n\nThe consumer code\
    \ isn't aware of how the algorithm is created. It doesn't even know about the\
    \ base class, only the subclass. The consumer code could look like this:\n\n```\n\
    //Some consumer\nTotalSub t = new TotalSub();\nt.TotalAlgorithm();\n```\n\nNote\
    \ that you decide in the base class if the hook should be optional or mandatory.\
    \ In the previous example, I used a mandatory one because I used abstract for\
    \ the VariationPoint() method. With virtual, it would have been optional instead,\
    \ such as when you want to make it optional for subclasses to define a piece of\
    \ the total template method.\n\nLet's say we decide up front to use Template Method,\
    \ which then gives us the problem of deciding where we should make variations\
    \ possible or forced. That's a very tough decision.\n\nNevertheless, patterns\
    \ are extremely useful, and we don't have to choose; we can use both patterns\
    \ and refactoring. As a matter of fact, I think that's the way to go. Refactoring\
    \ toward, to, or from patterns! This is what Kerievsky talks about in his book\
    \ Refactoring to Patterns [Kerievsky R2P].\n\nLet's see this in action with a\
    \ fourth example, which will connect to the pattern we just talked about.\n\n\
    # Prevent Growing Problems Example One: Form Template Method\n\nLet's assume that\
    \ we have written a batch monitor in which we can hook in different programs.\
    \ For a program to be a batch program, it has to adjust to some rules, and those\
    \ are basically to tell the batch monitor (by some custom logging routines) when\
    \ the program starts and finishes.\n\nAfter a while, we will probably have written\
