  md: 'You could get help with bi-directionality so that you don''t have to code it
    on your own. This is yet another example of something an AOP solution can take
    care of for you.


    # Implement a Specific Interface


    Yet another very regular requirement on Domain Model classes for being persistable
    is that they implement one or more infrastructure-provided interfaces.


    This is naturally a smaller problem if there is very little code you have to write
    in order to implement the interface(s) and a bigger problem if the opposite is
    true.


    One example of interface-based functionality could be to make it possible to fill
    the instance with values from the database without hitting setters (which might
    have specific code that you don''t want to execute during reconstitution).


    Another common example is to provide interfaces for optimized access to the state
    in the instances.


    # Provide Specific Constructors


    Yet another way of providing values that reconstitute instances from the database
    is by requiring specific constructors, which are constructors that have nothing
    at all to do with the business problem at hand.


    It might also be that a default constructor is needed so that the framework can
    instantiate Domain Model classes easily as the result of a Get operation against
    the database. Again, it''s not a very dramatic problem, but a distraction nonetheless.


    # Provide Mandatory Specific Fields


    Some infrastructure solutions require your Domain Model classes to provide specific
    fields, such as Guid-based Id-fields or int-based Version-fields. (With Guid-based
    Id-fields, I mean that the Id-fields are using Guids as the datatype.) That simplifies
    the infrastructure, but it might make your life as a Domain Model-developer a
    bit harder. At least if it affects your classes in a way you didn''t want to.


    # Avoid Certain Constructs/Forced Usage of Certain Constructs


    I have already mentioned that you might be forced to use virtual properties even
    if you don''t really want to. It might also be that you have to avoid certain
    constructs, and a typical example of this is read-only fields. Read-only (as when
    the keyword readonly is used) fields can''t be set from the outside (except with
    constructors), something that is needed to create 100% PI-Domain Model classes.


    Using a private field together with a get-only property is pretty close to a read-only
    field, but not'
