- pgno: 367
  md: "Note that the Domain Model doesn't have a dependency to NHibernate now. Still,\
    \ the Domain Model can use the Repositories if needed. One approach is that the\
    \ Repositories are implementing interfaces that are in the Domain Model. Then\
    \ those interface implementations (repositories) are injected in the Domain Model\
    \ instances at suitable spots.\n\n# ISession and Repositories\n\nFor all this\
    \ to work, it assumes that the consumer injects ISession instances to the repositories.\
    \ That means that the following snippet:\n\n```\nCustomer c = (Customer)_session.Load(typeof(Customer),\
    \ theId);\n```\n\ncan be transformed into the following code if a repository takes\
    \ care of some of the work (not much in this simple case, but some):\n\n```\n\
    Customer c = customerRepository.GetCustomer(theId);\n```\n\nThat snippet assumed\
    \ that the customerRepository was instantiated this way:\n\n```\n//A consumer\n\
    ICustomerRepository customerRepository =\n    new CustomerRepository(_session);\n\
    ```\n\nSo from that point and forward, the repository would have an ISession to\
    \ use for talking to the backend.\n\n# ISession, Repositories, and Transactions\n\
    \nFinally, I prefer to control the start and end of the unit of work in the consumer,\
    \ outside of the repositories. The following snippet explains what it can look\
    \ like (with very compact and not recommended transaction code):\n\n```\n//A consumer\n\
    customerRepository.Add(customer);\norderRepository.Add(order);\n_session.BeginTransaction().Commit();\n\
    ```\n\nIn that snippet, both repositories are sharing the same ISession.\n\n#\
    \ What Did We Gain?"
