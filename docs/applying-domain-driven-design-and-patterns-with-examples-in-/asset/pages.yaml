  md: '# # The Basis of the New Default Architecture


    As I just said, my new default architecture is based on a Domain Model. We discussed
    Domain Models a lot in [Chapter 1](#), “Values to Value,” but let’s discuss it
    here, also.


    > > **Note**

    > >

    > > Paul Gielens said that a warning is in place regarding the word "Default"
    in the name of this chapter. The risk is that some readers will get the feeling
    that this is the way to approach all systems. Let me stress that this is definitely
    not the case; this book is not aiming to be a template or something like that.
    Absolutely not! It’s in the spirit of DDD to let the *business problem* govern
    what your solution looks like!


    When one says "Domain Model" in the context of architecture, what is usually meant
    is usage of the Domain Model pattern [Fowler PoEAA]. It''s like old school object-orientation,
    in that you try to map a simplified view (or more correctly stated, the chosen
    abstraction) of the reality from your problem domain as closely as possible with
    an object-oriented model. The final code will be very close to the chosen abstractions.
    That goes for both state and behavior, as well as for possible navigation paths
    and relationships between objects.


    > > **Note**

    > >

    > > Someone (unfortunately, I don’t remember who) called the application of the
    Domain Model pattern in C# "programming C# as if it was Small-Talk." To some,
    that might not sound positive at first, but it was said and meant as a very positive
    thing.


    The Domain Model is not the silver bullet, but it certainly comes with several
    positive properties, especially for large-scale and/or complex applications that
    are long lasting. And as Martin Fowler says [Fowler PoEAA], if you start using
    Domain Model for one project, you will probably find yourself wanting to use it
    even for small, simple applications later.'
  merge: -1
  img_proc: true
