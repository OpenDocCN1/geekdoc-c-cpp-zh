  md: 'otherwise.


    I don''t know if you''ve noticed it, but I come back to one of the DDD-patterns,
    the Aggregate, over and over again. I''d like to take a break and talk about that
    before moving on.


    # Aggregates as the Tool Again


    The unit for checking rules is... Aggregates! I have found Aggregate design to
    be extremely important, and it is something I spend quite a lot of time on in
    my current design work.


    I briefly talked about rules aggregation earlier in this chapter, but let''s reiterate
    and delve a little bit deeper.


    # Aggregate Roots Aggregate Rules


    When the consumer of an Aggregate root asks for broken rules regarding persistable
    or not, he should receive broken rules from the complete Aggregate and not only
    the root instance.


    The aggregation doesn''t necessarily have to use the same `IValidatableRegardingPersistence`
    interface for the children classes; I actually prefer it not to because that will
    disturb my strategy for reactively checking for validity at persist. (I don''t
    mean disturb as in creating severe problems, but more as in duplicating execution
    cycles for no reason.)


    Also, this way the Aggregate root has to decide if the ordinary rules of the children
    should be used or not. Context is king.


    # An Obvious Aggregate-Level Rule: Versioning


    I''d like to end this short section about Aggregates with just a few words about
    feature 4. Concurrency conflict detection is important. That feature could be
    thought about as a kind of business rule, but I''d like to think about it as a
    technical problem more than a business problem. It''s also the case that most
    O/R Mappers have at least some support for concurrency conflict detection, but
    I''ll leave talking about that here and postpone it until Chapter 8, "Infrastructure
    for Persistence," and Chapter 9, "Putting NHibernate into Action."


    Let''s change focus a little bit. Before we get into discussing the implementation
    of the API, let''s first see if we should add anything more.'
