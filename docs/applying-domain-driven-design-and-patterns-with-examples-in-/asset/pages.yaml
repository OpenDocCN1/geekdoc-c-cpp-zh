- pgno: 294
  md: "# Binding to the Persistence Abstraction\n\nIn the previous chapter, I talked\
    \ about how to prepare for the persistence infrastructure by working with an abstraction\
    \ layer that I called NWorkspace (which is just an example of such an abstraction\
    \ of course). As you might have guessed, it has some support for validation as\
    \ well, because the reactive nature needs to be dealt with when we make calls\
    \ to PersistAll().\n\nOf course, I don't want the persistence abstraction to expect\
    \ a certain interface to be implemented on the Aggregate roots.\n\n# Make the\
    \ Validation Interface Pluggable\n\nTherefore, I made it possible to inject an\
    \ IValidator to the IWorkspace. The IValidator interface looks like this:\n\n\
    ```\npublic interface IValidator\n{\n    bool IsValidatable(object entity);\n\
    \    bool IsValid(object entity);\n    IList BrokenRules(object entity);\n}\n\
    ```\n\nThe IWorkspace implementation talks to the IValidator implementation, and\
    \ the IValidator implementation then decides what interfaces to look for on the\
    \ entities. In my case, the IValidator implementation looks for IValidatableRegardingPersistence\
    \ implementations and knows what to do with the IValidatableRegardingPersistence\
    \ implementation in order to throw an exception during PersistAll(), if necessary.\
    \ To make this a bit more concrete, see Figure 7-3.\n\nFigure 7-3. Overview of\
    \ the collaborating pieces\n\n![](img/89fb3513cb9b6343875aadbfd042005d_294_0.png)"
