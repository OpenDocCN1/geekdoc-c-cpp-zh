  md: '+   - Should a combination of these be used?

    +   - Should the same behavior be used regardless of the message?


    The other advantage in using the previous design for services instead of the classic
    RPC-style design is that the domain logic performed when a remote service is unavailable
    is cleanly separated from the main message-handling path. In the RPC-style design,
    an exception would have been thrown in the middle of the message-handling code,
    and the code that would have to be written to handle the exception in the various
    ways described by the previous questions would cloud the intent of the domain
    logic.


    In the interaction diagram shown in Figure 10-8, we can see that the code that
    handles timeouts is not only separated from the message-handling code, but is
    separated in time as well. Both request and failure handling logic are encapsulated.


    # Figure 10-8. Applying a timeout watcher


    ![](img/89fb3513cb9b6343875aadbfd042005d_387_0.png)


    # Complex Messaging Processes


    When developing services using the previous design, we are also able to construct
