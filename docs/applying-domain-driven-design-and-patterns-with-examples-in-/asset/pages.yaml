    \ = value; }\n        }\n    }\n}\n```\n\nThis approach is often very useful,\
    \ especially because many UI controls are designed for showing tables of rows,\
    \ and flattened objects adapt well to this paradigm. But whenever you are interested\
    \ in representing navigable, deep structures rather than just grids of stuff,\
    \ the flattened approach falls short. However, you may often find yourself complementing\
