- pgno: 320
  md: 'This is stretching things, because from the start the whole purpose of O/R
    Mappers was to let developers work with objects instead of tables. Therefore,
    for typical O/R Mappers, the API focus is always Domain Model. (An example of
    an API that is more focused on relational tables is that of the Recordset pattern,
    implemented with DataTable in .NET.)


    Another very important aspect of the API, and one that isn''t the same for every
    O/R Mapper, is querying.


    # Query Language Style


    I find it quite hard to categorize this one, but let''s give it a try. From the
    developer''s perspective, the querying with the O/R Mapper is generally done in
    one or more of the following ways:


    +   - String-based, SQL-ish

    +   - Query Object-based


    I believe it''s fitting to explain each of these a little bit more.


    # String-Based, SQL-ish


    By this I mean query languages that look quite similar to SQL, but work with classes
    in the Domain Model instead of the tables in the database. Some queries, especially
    advanced ones, are very well expressed in a language like this. On the other hand,
    the typical drawback is the lack of type safety.


    It''s important to note, though, that this way of stating queries isn''t necessarily
    string-based at the implementation level, only at the API level.


    # Query Object-Based


    The second typical query language is to use objects to represent queries, following
    the Query Object pattern [Fowler PoEAA]. Simple queries are often better expressed
    in this approach, it''s possible to have type safety, and the developer doesn''t
    have to know much about querying semantics in order to be efficient. The problem,
    though, is that complex queries might require lots of code to express, and the
    code quickly gets hard to read.


    # Raw SQL


    Yet another nice solution to have for rare cases is to be able to express the
    query in SQL, but to receive the result as Domain Model instances. Of course,
    that has the problem of making your code database-coupled, but if you can''t find
    another solution, it''s great to at least have the option. This is very handy
    when you need to optimize. And if you need to get entities as the result and the
    SQL-integration can take care of that for you, it will cut down on the code amount
    you have to write.


    Of course we should be allowed to jump out to SQL without receiving the result
    as Domain Model'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'instances as well.


    # Which Approach?


    As I see it, ideally the tool should support several approaches. This is because
    sometimes string-based expressions are best, while for other situations query
    object-based expressions are most suitable.


    The querying style in itself is only part of the story. Another important aspect
    is how competent the querying solution is. That is part of the next topic.


    # Advanced Database Support


    Or "How much will the DBA respect you?"


    To be flexible enough for you not to have to jump out of the sandbox all the time,
    the O/R Mapper needs to support some database close operations that aren''t obvious
    from the Domain Model perspective. However, they are great when the time comes
    for optimizations.


    Some examples are


    +   - **Aggregates**

    +     A very basic feature of SQL is the capability to do things like `SELECT
    SUM(x), MIN(y), MAX(z)`. When you work with a Domain Model focus, it might be
    slightly less common that you need those aggregates, but they are still very useful
    and sometimes necessary.

    +   - **Ordering**

    +     It might prove most efficient to order the result set in the database without
    having to do the ordering in the Domain Model.

    +   - **Group By**

    +     Something else you can do when you work with SQL is to use `GROUP BY`. It''s
    especially common for ad-hoc queries and reporting, but is still occasionally
    useful in Domain Model-focused applications.

    +   - **Scalar queries**

    +     It''s not necessarily the case that you always want to fetch complete instances
    back. Sometimes it''s just field values, perhaps some from one class and some
    from another.


    It''s also very nice if there are other ways to move functionality to the database,
    functionality that fits best in the database, typically data-intensive operations.
    What I''m thinking about here is usually the capability to call stored procedures,
    but it could also include other custom ways of moving functionality, such as user-defined
    functions.


    The main problem with this is that we might lose portability of the application
    and the database'
  merge: -1
