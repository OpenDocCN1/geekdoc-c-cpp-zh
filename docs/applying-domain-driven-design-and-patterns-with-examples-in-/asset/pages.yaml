    \    <property name=\"LastName\"\n            access=\"field.camelcase-underscore\"\
    \ not-null=\"true\"/>\n    </composite-element>\n</bag>\n```\n\nLet's take another\
    \ example. In earlier chapters I sketched that OrderLine should be a Value Object.\
    \ If so, the mapping in the Order regarding OrderLine might look similar to what\
