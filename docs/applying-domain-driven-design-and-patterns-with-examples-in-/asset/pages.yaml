  md: 'Because of the increased interest in partitioning, the interest in layering
    might lessen. It''s just not as important or beneficial with a rigorous layering
    design for a tiny partition.


    Let''s have a closer look at the reasons for partitioning.


    # ## Reasons for Partitioning


    While layering is often based on technical reasoning, partitioning is often based
    on organizational reasons. Sure, partitioning could also be done for a technical
    reason; for instance, a certain partition might become stale faster and might
    be one we''d like to swap for another implementation later on. The idea then might
    be to make it obvious and easy to achieve when the day comes.


    But again, organizational reasons are important for partitioning, such as because
    one team takes care of this and another team takes care of that. This is totally
    in line with a discussion I had with some colleagues about motivations for layering.
    None of them thought that layering was good to use for organizing a team. That''s
    something I''ve done from time to time, and (to my mind) with success. What I
    think they all really meant was that it''s a better idea to organize the team
    around partitions instead. And then the layering is less stressed inside each
    partition. We will, of course, still see that different people have different
    main interests and expertise, and we shouldn''t fight that. We should just not
    create a large department of UI developers that builds the UI for all applications,
    another department of Domain Model developers, and yet one more department of
    database developers. Out of those two dimensions (if you have to choose), the
    most important is the domain problems that should be solved, not what technologies
    to use. Remember that when organizing the team also.


    What also matters regarding whether you need partitioning or not is the size of
    the development effort. For a tiny system, one partition might be all that is
    needed; for a large system, a good partition design might be extremely important
    to succeed.


    To summarize this, I think that first it''s a matter of partitions, and then inside
    those partitions it’s a question of layers, not the opposite.


    Let''s see if we can couple this to DDD, which brings me to talking a little about
    the Bounded Context pattern [Evans DDD].


    # ## Bounded Context


    A common question is "How should we deal with complexity?" And just as common
    an answer is ”divide and conquer.” Use of hierarchies is one way of dividing and
    conquering.


    DDD is pretty much about hierarchies. One extremely useful tool that I''ve been
    emphasizing a lot is the Aggregate pattern, which is a pretty coarse-grained unit.
    Entities is another unit, and Value Objects is yet another (all found and discussed
    at length in [Evans DDD]).


    If we go in the opposite direction, "up" from Aggregates, we will find that Bounded
    Contexts isn''t the same as aggregates, but rather the same as subsystems or sub-models.


    The basic idea with Bounded Context is to be very explicit about in what context
    the model applies. You should also be very strict about the model and its concepts
    within the Bounded Context; what'
