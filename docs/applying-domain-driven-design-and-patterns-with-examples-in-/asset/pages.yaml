  md: 'By the way, you shouldn''t ask the customer if you should use TDD or not, at
    least not if you’re asking for more payment/time/whatever at the same time. He
    will just tell you to do it right instead. When considering the project from start
    to finish, if using TDD incurs no extra cost, I believe you should just go ahead.
    The customer will be happy afterward when he gets the quality he expects.


    # Note


    Let''s for a moment skip TDD and focus only on automatic tests.


    A colleague of mine has been *extremely* skeptical of the need for automatic unit
    tests (created before or after real code). He told me that during his two-decade
    career, automatic unit tests would not have helped him once. However, I think
    he changed his mind a bit recently. We were working together on a project where
    he wrote a COM component in C++ and I wrote tests as specifications and as just
    tests. When we were done, the customer changed one thing in the requirements.
    My colleague made a small change, but the tests caught a bug that occurred just
    four times in 1,000 executions. The bug was found after only seconds of testing,
    compared to hours if it had been done manually. And if it had been done manually,
    the bug would most probably not have been found at all, but would have shown itself
    during production.


    # The TDD Flow


    Now I have tried to get you motivated to start with TDD, so let''s have a closer
    look at how the process flows. (We''ll get back to this in [Chapter 3](#) when
    we will investigate it in a bit more depth with a real world demo.) Assuming you
    have a decent idea about the requirements, the flow goes like this:


    First of all, you start writing a test. You make the test fail meaningfully so
    that you can be sure that the test is testing what you think. This is a simple
    and important rule, but even so, I have skipped over it several times and that
    is just asking for trouble.


    The second step is to write the simplest possible code that makes the test pass.


    The third step is to refactor if necessary, because you identify code that smells
    (for example, code duplication), and then you start all over again, adding another
    test.


    If we use NUnit lingo, the first step should give you a red light/bar, and the
    second step should give you a green light/bar.


    I mentioned refactoring previously and as the third step in the general process
    of TDD, and I think I should briefly explain the term a bit more.


    # Refactoring'
