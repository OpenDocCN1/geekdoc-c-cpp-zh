  md: '# Database Constraints


    Even though you might choose to focus on putting all your rules in the Domain
    Model, you will still probably end up with some rules in the database. A typical
    reason for this is efficiency. Some rules are most efficiently checked in the
    database; that’s just how it is. You can probably design around most of them,
    but there will probably still be a couple of situations where this is a fact of
    life.


    Another reason is that you might not be able to design a new database, or you
    might not be able to design the database exactly as you would like it, but you
    have to adjust to a current database design. Yet another reason is that it''s
    often considered a good thing that the database can take care of itself, especially
    if several different systems are using the same database.


    The impedance mismatch between object-orientation and Relational databases that
    we discussed in Chapter 1, "Values to Value," will also show up here. For example,
    the strings in the database will most likely have static max lengths, such as
    `VARCHAR(50)`. That a certain string isn''t allowed to be longer than that is
    kind of a generic rule, but it''s mostly related to persistence. The transition
    to Persisted state won''t be allowed if the string is too long.


    So it''s probable that you will have to deal with rules whose invalidity won''t
    be detected until the state is persisted to the database. That in its turn represents
    a couple of problems.


    First, parsing error information is troublesome, especially when you consider
    that a typical O/R Mapping solution often tries to be portable between different
    databases. Or rather, the heart of the problem is that the O/R Mapper probably
    won''t be able to do the mapping for you when it comes to errors and tell you
    what field(s) caused the problem in the Domain Model; for example, when there''s
    a duplicate key error.


    Furthermore, the error will come at an inconvenient point in time. Your Domain
    Model has already been changed, and it will probably be very hard for you to recover
    from the problem without starting all over again. In fact, the general rule is
    often that you should start over instead of trying to do something smart.


    Still, we do like the idea of making it possible to save our instances at any
    time. (In any case, we have set up some *preferences* even if we can''t follow
    them to 100%. The extreme is often extremely costly.)


    As I see it, try to design for as much proactivity as possible (or as appropriate)
    so that the number of exceptions from the database will be extremely few. For
    those that are still possible, be prepared to deal with them one by one in code,
    or be prepared to roll back the transaction, toss out the Domain Model changes,
    and start all over again. A bit drastic, but that’s the way I see it. The key
    to all this is design, so you make the problem as small as possible.


    OK, that was the purely technical side of it (that the database might show its
    discomfort with us). But it''s not just a matter of that the rules are infrastructure-related
    *only* or domain-related *only*. There are connections.


    # Bind Rules to Transitions Related to the *Domain* or the *Infrastructure*?


    What we have said so far is that we should try hard to not enter an invalid state.
    If we follow that, we can always persist (if we don''t think about the infrastructure-related
    constraints for the'
