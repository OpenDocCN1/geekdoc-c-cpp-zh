- pgno: 218
  md: 'Even though I think it''s a negative aspect, it''s not nearly as bad as my
    having the silly code in the Fake versions of the Repositories. That feels just
    bad.


    # A Better Solution?


    The solution I decided to try out was creating an abstraction layer that I call
    NWorkspace [Nilsson NWorkspace]. It''s a set of adapter interfaces, which I have
    written implementations for in the form of a Fake. The Fake is just two levels
    of hashtables, one set of hashtables for the persistent Entities (simulating a
    database) and one set of hashtables for the Unit of Work and the Identity Map.
    (The Identity Map keeps track of what identities, typically primary keys, are
    currently loaded.)


    The other implementation I have written is for a specific O/R Mapper.


    # Note


    When I use the name NWorkspace from now on, you should think about it as a "persistence
    abstraction layer." NWorkspace is just an example and not important in itself.


    Thanks to that abstraction layer, I can move the Repositories back to the Domain
    Model, and I only need one Repository implementation per Aggregate root. The same
    Repository can work both against an O/R Mapper and against a Fake that won''t
    persist to a database but only hold in memory hashtables of the instances, but
    with similar semantics as in the O/R Mapper-case. See Figure 6-2.


    # Figure 6-2. A single set of Repositories thanks to an abstraction layer'
  merge: -1
