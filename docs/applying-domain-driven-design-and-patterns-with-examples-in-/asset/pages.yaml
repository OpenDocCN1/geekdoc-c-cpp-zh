  md: 'a.m. The same problem exists for your stock; is the item available or do you
    need to order it from your supplier?


    One way to solve this problem is to have the middle tier notify all clients (order
    takers) as soon as there is a price or stock change so that the client can take
    measures for this. However, this would complicate things considerably. The client
    is no longer only talking to the middle tier, the middle tier is also, on its
    own initiative so to speak, talking to all the (active) clients. And besides that,
    the timing problem isn''t eliminated, only minimized.


    I want to keep it simple but still support the needs. I need to look at the business
    process. The order taker talks with a customer on the phone. They discuss what
    the customer needs, and price and availability is communicated. Eventually the
    customer decides to buy, and the order taker submits the order to the middle tier.
    In response, the middle tier returns a report. The report states the final prices
    and availability. The latter will have an impact on delivery date. All discrepancies
    with the previously (orally) given facts are marked in the report (if any). The
    order taker discusses them with the customer and if he is unhappy with that, the
    order can be cancelled. Cancelling the order is a transaction of its own, an undo/delete
    transaction.


    I understand that if you give a price to a customer you may have to stick to it
    to some extent at least.[5] This can be corrected quite easily. One cheap way
    is to leave the price setting to a few people who only change prices after business
    hours. Another way is to have the system itself postpone effectuation of price
    changes to the next non-demand moment. If the client caches price information,
    she must somehow have the knowledge to refresh (or drop) the cache on suit-able/strategic
    occasions.


    [5] If you, an order taker, misread two zeroes in the price, are you then liable?


    The problem with availability (stock) is, however, in contrast to prices, a dynamic
    one. Therefore, the need to have a report given as a response to an order submitted
    stands. It might as well report any price discrepancies found even if a policy
    to avoid that is implemented, just to be sure. The report will also have the final
    say on whether the order is within the global maximum limit or not and if the
    customer''s credit is exceeded or not.


    When an order is persisted, we stick to the price given. We don''t want to tick
    our customer off with an invoice with higher prices than promised. This forces
    us to store the promised prices (`OrderPrice` in **Figure A-5**) with the order
    instead of just referring to the item (that has a price). An alternative is to
    have price history on the items, which is too much of a hassle. And, yes, we do
    not "reopen" submitted orders for complementing items in case of, say, the customer
    realizing he wants three instead of two of something shortly after talking to
    us. We might place an order with no cost for delivery and/or invoicing to take
    care of this situation.[6] Changing an order line to fewer items is another story
    that we can handle easily (it might affect high-volume discounts in the real world).


