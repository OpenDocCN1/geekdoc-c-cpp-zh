  md: "behavior either directly or by making them inherit from some base class that\
    \ implements core locking and unlocking functionality.\n\nThe former solution\
    \ is bad because it results in a lot of duplicate code. The second solution is\
    \ OK as long as the classes that need locking behavior belong to the same class\
    \ hierarchy and all of them need to support locking. If they belong to different\
    \ hierarchies, or if you don't want to introduce locking behavior into them all,\
    \ you are back to square one.\n\nA much better approach is to leverage AOP features\
    \ and declaratively add locking support only to the classes that need it. This\
    \ can be easily accomplished using a combination of introduction and before advice.\n\
    \n# Implementing Locking Introduction\n\nThe first step in this case is to create\
    \ an introduction that will be used to add state and behavior to advised classes.\
    \ In order to do that, we need to define an interface that we want to introduce.\n\
    \n```\nnamespace LockableAspectDemo\n{\n    public interface ILockable\n    {\n\
    \        void Lock();\n        void Unlock();\n        bool IsLocked { get; }\n\
    \    }\n}\n```\n\nThe next step is to create an introduction class that implements\
    \ this interface. In this example, we will assume that we are writing an ASP.NET\
    \ Web application and will use HttpContext.Current.Session.SessionID as a session\
    \ ID for locking purposes.\n\n```\nusing AopAlliance.Aop;\n\nnamespace LockableAspectDemo\n\
    {\n    public class LockableIntroduction : ILockable, IAdvice\n    {\n       \
    \ private bool isLocked;\n        private string sessionId;\n\n        public\
    \ void Lock()\n        {\n            isLocked = true;\n            sessionId\
    \ = HttpContext.Current.Session.SessionID;\n        }\n\n        public void Unlock()\n\
    \        {\n            isLocked = false;\n            sessionId = null;\n   \
    \     }\n```"
