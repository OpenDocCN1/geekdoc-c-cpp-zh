    \ Add(Customer c);\n}\n```\n\nThen two classes (for example, `FakeCustomerRepository`\
    \ and `MyInfrastructureCustomerRepository`) will be located in two different assemblies\
    \ (but all in one namespace, that of the Domain Model, unless of course there\
    \ are several partitions of the Domain Model). See Figure 6-1.\n\n# Figure 6-1.\
    \ Two Repository assemblies\n\n![](img/89fb3513cb9b6343875aadbfd042005d_217_0.png)\n\
    \nThat means that the Domain Model itself won't be affected by the chosen infrastructure\
    \ when it comes to the Repositories, which is nice if it doesn't cost anything.\n\
    \nBut it does cost. It also means that I have to write two Repositories for each\
    \ Aggregate root, and with totally different Repository code in each case.\n\n\
    Further on, it means that the production version of the Repositories lives in\
    \ another assembly (and so do the Fake Repositories), even though I think Repositories\
    \ are part of the Domain Model itself. \"Two extra assemblies,\" you say, \"That's\
    \ no big deal.\" But for a large application where the Domain Model is partitioned\
    \ into several different assemblies, you'll learn that typically it doesn't mean\
    \ two extra assemblies for the Repositories, but rather the amount of Domain Model\
    \ assemblies multiplied by three. That is because each Domain Model assembly will\
    \ have its own Repository assemblies."
