  md: 'one-liners had to be broken into result assignment and its return, just so
    the result could be printed in the logging code.


    +   - If you had to remove logging code at some point, you would be faced with
    a daunting task of manually removing or commenting out all the logging code from
    your classes.


    +   - If you decided that you want to log the full class name, including namespace,
    you would have to find all the methods that contain logging code and add missing
    namespace information by hand.


    +   - The same applies if you decide that you want to log exceptions such as overflow
    and division by zero when they occur—you''d have to add a try/catch block and
    a statement that would log exceptions in many, many places throughout your code
    base.


    Of course, one could argue that if you used a sophisticated logging solution,
    such as Log4Net [Log4Net] or Enterprise Library Logging Application Block [Enterprise
    Library Logging], instead of plain `Console.Out.WriteLine` statements, you could
    turn logging off by simply changing the configuration setting, without the need
    to touch any of your classes.


    While that is entirely true, it really misses the point in this case. Your core
    logic would still be intermingled with ancillary logging code, and you would still
    have to edit many methods by hand if you wanted to make any changes to the logging
    logic. Moreover, if we change our example from logging to security policy enforcement
    or transactions, you won''t be able to turn it on or off so easily either.


    What AOP promises to do for you is to allow you to separate crosscutting code,
    such as logging or security, into aspects and to apply those aspects easily to
    all the classes and methods that need them. Of course, there is a lot more to
    AOP than this. It also allows you to separate business rules from the core logic
    and to change your existing objects by adding both state and behavior to them.
    We''ll see examples of this in the following sections.


    What is important to understand is that AOP is not a replacement for OOP—it is
    simply an extension to it that allows you to go to places that are difficult to
    reach with OOP alone. Good object-oriented principles and practices still apply.
    Actually, it is probably even more important than ever before to have a solid
    OO design in place, as it will make application of aspects much easier.


    # AOP Terminology Defined


    Before we dig deeper and show you examples of AOP in action, it is important to
    understand basic AOP terminology, which is not as difficult as it first seems.
    So I offer some definitions for the following terms:


    +   - An **advice** is a piece of code that you want to encapsulate and reuse.
    For example, logging code would be implemented as an advice and applied wherever
    you need it. There are several types of advice, such as *before*, *after*, and
    *around* advice.


    +   - An **introduction** is a somewhat special type of advice that only applies
    to classes. Introductions allow you to introduce new members into existing classes,
    both state and behavior, and could be used to achieve the benefits of multiple
    inheritance in languages that do not support it, without its tradeoffs. (Introduction
    is called *mixin* in some languages.)'
