- pgno: 392
  md: "Before we discuss Inversion of Control and Dependency Injection, let us first\
    \ look at another common approach to solving these issues.\n\n# Factories, Registries,\
    \ and Service Locators\n\nOne way to address the coupling issue is through the\
    \ use of the Factory pattern. We create a factory class that provides the required\
    \ objects; in our case, an object that implements the discount curve interface.\n\
    \n```\n```csharp\npublic class DiscountCurveFactory {\n    public static IDiscountCurve\
    \ GetCurve() {\n        return new DatabaseDiscountCurve();\n    }\n}\n\npublic\
    \ class BondPricer {\n    private readonly IDiscountCurve curve;\n\n    public\
    \ BondPricer() {\n        curve = DiscountCurveFactory.GetCurve();\n    }\n}\n\
    ```\n```\n\nWith this factory, the pricer is no longer tightly coupled to a curve\
    \ implementation, which is what we wanted to achieve. Unfortunately, in its place,\
    \ the factory class itself is now tightly coupled to a specific IDiscountCurve\
    \ implementation, so it remains difficult to use different curve implementations\
    \ in different applications of the pricer. To overcome this problem we could create\
    \ a factory interface and pass in different factory implementations, but this\
    \ means that we would have to solve the problem of getting the right factory,\
    \ which is similar to getting the right objects. In other words, we would add\
    \ a level of indirection that provides additional flexibility but would just move\
    \ the key problem we had.\n\nWhat we have not shown in the code is that the Factory\
    \ pattern also addresses the issue of instance management. Because we have a central\
    \ place in our code that is responsible for providing curve instances, namely\
    \ the GetCurve() method, we can choose to implement alternative policies that\
    \ apply to the entire application. For example, rather than always creating a\
    \ new curve, we could maintain a single instance or, if our application is multi-threaded,\
    \ we could choose to manage a pool of instances.\n\nIn a further step toward complete\
    \ decoupling, we can replace the factory with an implementation of the Registry\
    \ pattern [Fowler PoEAA]. Much like a factory, a registry provides objects of\
    \ a given type but rather than hard-coding the type of object, it externalizes\
    \ this decision and instantiates the objects using reflection. This approach represents\
    \ an improvement on the Factory pattern for our purposes because we have now separated\
    \ two concerns: We have one class that is responsible for the provisioning of\
    \ objects, the registry, and we can move the code that decides which concrete\
    \ class to use in each case to other more suitable places in our code base.\n\n\
    The implementation of such a registry is simple but effective and finally achieves\
    \ our goal of decoupling BondPricer from a concrete implementation of IDiscountCurve."
