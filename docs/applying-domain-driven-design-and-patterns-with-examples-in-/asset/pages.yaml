- pgno: 35
  md: 'some of my real world applications were built in that style, especially the
    simpler ones. What is also important to say is that however much I wanted to build
    very powerful, well-designed Domain Models, they didn''t turn out as I had anticipated.


    That wasn''t the only problem I had, though....


    # Old Truths Might Be Wrong


    I''ve believed in Domain Models and tried to use them several times in the past,
    but most attempts to implement it in object-oriented fashion led me to the conclusion
    that it doesn''t work. That was, for example, the case with my COM+ applications
    in Visual Basic 6 (VB6). The main problem was that performance overhead was too
    high.


    When I wrote my previous book [Nilsson NED], which described a default-architecture
    for .NET applications, I reused my old VB6/COM+ knowledge and didn''t make the
    discussed architecture Domain Model-based at all.


    Later on I started up new experiments again, trying to see if I could get down
    to something like 10% in response-time overhead on common scenarios (such as fetching
    a single order, fetching a list of orders for a customer, or saving an order)
    when using Domain Model in .NET compared with Transaction Scripts and Recordset.
    To my surprise, I could get lower overhead. The old truths had become wrong. The
    Domain Model-based architecture is very much more possible now in .NET than in
    VB6. One reason for this is that the instantiation time is reduced by orders of
    magnitude. Therefore, the overhead is just much lower when you have very many
    instances. Another reason is that it''s trivial to write Marshal By Value (so
    that not only is the reference to the instance moved, but the whole instance,
    at least conceptually, is moved) components in .NET. It was not simple in the
    COM world. (It wasn''t even possible to do it in the ordinary sense in VB6.)


    # Note


    The importance of Marshal By Value is of less importance because we now most often
    prefer to not send the Domain Model as-is over the wire, but my early tests were
    using that.


    Yet another reason is that .NET better supports object-orientation; it''s just
    a much better toolbox.


    # Note


    Also worth mentioning is that there hasn''t been much emphasis on the Domain Model
    in the Microsoft community in the past. The Java community, on the other hand,
    is almost the opposite. I remember when I went to a workshop with mostly Java
    people. I asked them about what their favorite structure for the logic was, perhaps
    if they used Recordset (added in JDBC version 3) a lot. They looked at me funnily
    as if they hadn''t understood'
