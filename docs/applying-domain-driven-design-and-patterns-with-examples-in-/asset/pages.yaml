    # Note


    I''m going to use MTS as the name here, but you could just as well use COM+ or
    COM+ Component Services or Enterprise Services.


    Fine, for some systems it was very suitable to be distributed. Moving some processing
    out from the client and from the database to an application server had its benefits,
    like resource sharing (for example, connection pooling at the server-side so that
    hundreds of clients could be served by just a handful of database connections).
    These benefits were very much needed for some systems, and it became easier and
    more productive to get those benefits.


    # Overuse Is Never Good


    Unfortunately, the benefits were so appealing that things went a bit overboard
    from time to time. For example, the server-side work might be split at several
    different application servers. Not that the application servers were cloned so
    that all clients could use any of them and get all services needed, but rather
    the client called one of the application servers. That server called another application
    server, which called another application server. There were small benefits, but
    huge drawbacks because of increased latency and lower availability.


    Another mistake was that simple applications with just two simultaneous users
    were written for and executed in MTS. It''s a very good example of making a mountain
    out of a molehill because of a belief that the application will probably be very
    popular in some distant future and be used by thousands of users simultaneously.
    The problem wasn''t just a more complex operational environment, but that the
    design of the application had lots of implications if you wanted to be a good
    MTS citizen. A typical example of this was to avoid chatty communication between
    certain (or even worse, between all) layers. Those implications did increase the
    complexity of the design to quite an extent. Well, overuse is never good.


    Did you notice that I avoided talking about the normal pitfalls that beginners
    of distributed systems encounter when making their first attempts with distributed
    systems, such as chatty communication? Well, even if, against all odds, for some
    reason those mistakes were avoided, there are other, slightly more subtle problems.


    All these problems led Martin Fowler to come up with his First Law of Distributed
    Object Design, which is "Don''t distribute" [Fowler PoEAA]. If you absolutely
    don''t have to, don''t do it. The cost and complexity will just go sky high. It''s
    a law of nature.


    # Distribution Might Be Useful


    Still, there are good things about distribution too, both now and in the future,
    for example:'
