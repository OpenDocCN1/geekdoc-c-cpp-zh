  md: "```\n```java\npublic BondPricer() {\n    curve = new DiscountCurve();\n}\n\
    ```\n```\n\nNote that we could have created the curve on demand, but the discussion\
    \ on when lazy instantiation is useful is a different one. In any case, the pricer\
    \ now has a direct dependency on the curve. It is also likely that the discount\
    \ curve object itself depends on other objects that it instantiates at an appropriate\
    \ time. This looks like a viable approach, but upon closer inspection problems\
    \ become visible: We have a functioning set of objects to price our bonds, but\
    \ how flexible and maintainable is our solution?\n\nLet us assume that the discount\
    \ curve object reads the individual points of the curve from a database. This\
    \ is what the users wanted. In a later iteration, we are asked to build a feature\
    \ that allows the users to analyze what-if scenarios. For this the users want\
    \ to specify the points for the curve in the UI. Nothing easier than that: We\
    \ create an interface from the `DiscountCurve` class and provide two separate\
    \ implementations, `DatabaseDiscountCurve` and `InMemoryDiscountCurve`. We change\
    \ `BondPricer` class so that it only uses the methods on the interface and is\
    \ thus no longer coupled to the database-based implementation.\n\nUnfortunately,\
    \ even though the calculation code in the bond pricer only depends on the discount\
    \ curve interface, we must instantiate a concrete implementation of the `DiscountCurve`\
    \ interface at some point, the constructor of `BondPricer` in this example. At\
    \ this point, we have to decide which of our two implementations we want to instantiate,\
    \ but whichever one we choose, our class is coupled to the interface as well as\
    \ to that implementation. The following diagram (Figure 10-9) shows the class\
    \ design and clearly illustrates the problem: the *creates* link between the `BondPricer`\
    \ and the `DatabaseDiscountCurve`.\n\n# Figure 10-9. Dependencies when direct\
    \ instantiation is used\n\n![](img/89fb3513cb9b6343875aadbfd042005d_391_0.png)\n\
    \nAnother issue with direct instantiation is that there is no single place in\
    \ the application to control the creation of discount curves, which makes it impossible\
    \ to reuse the same instance for different purposes. This can be quite problematic,\
    \ and if we consider that the original version of the curve loads information\
    \ from a database, it becomes obvious that recreating new instances can have a\
    \ severe impact on the performance of our application."
