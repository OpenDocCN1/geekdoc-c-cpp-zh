  md: 'The main *problem* with that is how to deal with data if we use a relational
    database.

    Therefore, it''s more important to focus a bit more on the data than normal when
    it comes to object-orientation.


    With the problems/features in place, it''s time to discuss a possible solution
    for how to deal with them.


    # Dealing with Features One by One


    What does all this come down to? Let''s find out by examining how I would typically
    solve the problems/features listed earlier in this chapter. I will focus solely
    on the Domain Model so that we concentrate on the "right" things for now and try
    to catch and form the Ubiquitous Language without getting distracted by the infrastructure
    or other layers.


    Still, it can be good to have *some* idea about the technical environment as well.
    We keep down the technical complexity and decide that the context is a Rich GUI
    application executing at the client desktops together with the Domain Model and
    a physical database server with a relational database, all on one LAN.


    # Note


    I''m going to mention loads of patterns everywhere, but please note that we will
    come back to those in later chapters and talk and show a lot about them then.
    (See Appendix B.)


    Without further ado...


    # 1. List Customers by Applying a Flexible and Complex Filter


    The first requirement is pretty much about data and a piece of search behavior.
    First, let''s sketch what the `Customer` class and surroundings (without the `Order`
    for now) could look like (see Figure 4-2).


    # Figure 4-2. The Customer class and surroundings'
