  md: '+   - Reset the database before each test.

    +   - Maintain the state of the database during the run.

    +   - Reset the data for just the test or set of tests you are running before
    the run.

    +   - Separate the testing of the unit from the testing of the call to the database.


    # Reset the Database Before Each Test


    At first glance, this might seem the most desirable, but possibly the most time-consuming,
    option. The plus to this approach is that the whole system is in a known state
    at the start of the test. You don''t have to worry about strange interactions
    during test runs because they all start at the same place. The downside is time.
    After you have gotten past the initial parts of your project, you will find yourself
    waiting while your test suite runs. If you are doing unit testing and running
    your tests after each change, this can very quickly become a significant part
    of your time. There are some options that can help. How they apply to you will
    depend on many things, from the type of architecture you use to the type of database
    system you use.


    One simple but slow approach is to restore the database from backup before each
    test. With many database systems, this is not practical because of the amount
    of time it takes. However, there are some systems where it is possible. If you
    are programming against a file-based database, for example, you may only need
    to close your connections and copy a file to get back to the original state. Another
    possibility is an in-memory database, such as HSQL for Java, that can be restored
    very quickly. Even if you are using a more standard system like Oracle or SQL
    Server, if your design for data access is flexible enough, you may be able to
    switch to an in-memory or file-based database for your tests. This is especially
    true if you are using an O/R Mapper that takes the responsibility of building
    the actual SQL calls for you and knows multiple dialects.


    The project DbUnit offers another way to reset a database before the test runs.
    Essentially, it''s a framework for JUnit that allows you to define "data sets"
    that are loaded on clean tables before each test run. Ruby on Rails has a similar
    system that allows you to describe your test class data in the open YAML (YAML
    Ain''t Markup Language) format and apply it during test setup. These tools can
    work well, but you may start running into problems as these database inserts may
    be logged operations that can be too slow. Another approach that could work for
    you is to use bulk load utilities that may not be as extensively logged. Here
    is how this might work for SQL Server. First, use a database recovery option on
    your test database of Simple Recovery. This eliminates most logging and improves
    performance. Then, during test design, do the following:


    +   - Insert data into a test database that will only act as a source of clean
    data for your tests

    +   - Call transact sql commands that export the test data to files

    +   - Write transact sql commands to do bulk insert of the data in these files


    Then during the test setup method, do the following:


    +   - Truncate all your tables. This is not a logged operation and can be very
    fast.'
