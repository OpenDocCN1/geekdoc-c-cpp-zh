- pgno: 335
  md: '# A Short Introduction to NHibernate


    What we are about to discuss here is a product that deals with Metadata Mapping
    [Fowler PoEAA], an O/R Mapper, which is called NHibernate.


    As I said, NHibernate is a port from the very popular O/R Mapper in Java-land
    called Hibernate, originally created by Gavin King [Bauer/King HiA]. The port
    is based on version 2.1 of Hibernate, which is considered a pretty old version,
    but the port doesn''t strictly just move the code base for that particular Hibernate
    version. Instead, features from later versions of Hibernate as well as other features
    have been added here and there.


    NHibernate (and Hibernate) is open source. As I write, NHibernate is released
    as version 1.0. You can download it from here: [NHibernate].


    The proof of the pudding is in the eating, so let''s see how NHibernate is used.


    # Preparations


    Let''s assume you have a Domain Model and you now want to write some consumer
    code against the Domain Model.


    # Note


    One more requirement is that you want to make the Domain Model persistent. Therefore,
    you also have a database product, but don''t think about the database schema for
    the moment.


    First, you need to set a reference in the consumer to the NHibernate framework
    (namely nhibernate.dll). That wasn''t too hard.


    Then you need to configure the usage of NHibernate in the consumer of the Domain
    Model. You can either do that in code or in a .config file. Typically a .config
    file is used, so let''s assume that. Some things that are configured can be what
    the database product in question is, the connection string to the database, and
    logging. You will find lots of examples of .config files to copy and paste from
    at the NHibernate site, so I won''t go into detail here, but I''ll just take it
    for granted that you have a suitable .config file in place.


    What you then try to do just once per application execution is to set up a SessionFactory.
    The reason for not creating several is that the cost is fairly high. The SessionFactory
    will analyze all metadata and build up memory-based structures for that. As you
    might guess from its name, the SessionFactory is then used for instantiating new
    instances that implement ISession.'
  merge: -1
  img_proc: true
- pgno: 336
  md: "iSession is the string to pull in order to get work done against the database\
    \ and is also the interface that you will interact with all the time from the\
    \ consumer perspective.\n\nNext, it's nice if you can use a helper for the ISession\
    \ management. This can be done with different levels of sophistication, but here\
    \ a simple attempt would be good enough for our purpose. If we assume that our\
    \ Domain Model is called ADDP.Ordering.DomainModel, a simplified helper called\
    \ NHConfig could look like this:\n\n```\n```csharp\npublic class NHConfig\n{\n\
    \    private static ISessionFactory _sessionFactory;\n\n    static NHConfig()\n\
    \    {\n        Configuration config = new Configuration();\n        config.AddAssembly(\"\
    ADDP.Ordering.DomainModel\");\n        _sessionFactory = config.BuildSessionFactory();\n\
    \    }\n\n    public static ISessionFactory GetSessionFactory()\n    {\n     \
    \   return _sessionFactory;\n    }\n}\n```\n```\n\nMaking more assumptions, we\
    \ are now working with a rich client application; therefore, we think it's enough\
    \ to have a single iSession instance. At least, let's start that way. Then the\
    \ following code might be suitable for the start of the application, or perhaps\
    \ for a single form:\n\n```\n```csharp\n_session = NHConfig.GetSessionFactory().OpenSession();\n\
    _session.Disconnect();\n```\n```\n\nSo when you want to get an ISession to act\
    \ on, you can use the following little snippet over and over again:\n\n```\n```csharp\n\
    _session.Reconnect();\n\n//Do stuff...\n\n_session.Disconnect();\n```\n```\n\n\
    And finally, when the application terminates (or the form is closed, depending\
    \ upon your chosen strategy), you close the ISession like this:\n\n```\n```csharp\n\
    _session.Close();\n```\n```"
  merge: -1
  img_proc: true
