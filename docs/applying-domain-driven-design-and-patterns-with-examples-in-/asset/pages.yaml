- pgno: 58
  md: 'Continuous learning was something we heard about in school all the time. It''s
    very much true in the case of refactoring [Fowler R]refactoring to get a better
    model, for example.


    Refactoring is about making small, well-known changes step by step in order to
    improve the design of existing code. That is, to improve its maintainability without
    changing its observed behavior. Another way to say it is to change how, not what.


    In a nutshell, what refactoring does is to take you from smelly code to nice code.
    It''s as simple as that.


    So you don''t have to come up with a perfect design up-front. That is good news,
    because it can''t be done anyway.


    # Why Use Refactoring?


    None of us have any trouble in recognizing smelly code. What might be more troublesome
    is to know when to fix it. As I see it, you should deal with the problem as soon
    as it arises. You should use refactoring because without continuous maintenance
    of your code, it will start to degenerate and crumble.


    # Note


    Mark Burhop said the following: "A good friend keeps a list of Software Development
    Laws. One goes something like "Code, left untouched, will develop bugs.""


    Let''s use the analogy of your home. Problems you choose to ignore, such as fixing
    windows, repairing the roof, painting the woodwork, and so on, ignored problems
    like these will grow in time. That''s an immutable law. So sooner or later your
    house will fall to bits, and at that point it''s worthless. Nobody wants that
    situation, right?


    Software is different because it''s not built of organic material and won''t become
    affected from weather and wind if not changed. Still, we intuitively have a feeling
    for what''s happening over time with software when refactoring isn''t applied
    during bug fixes and when the software is extended.


    # How Should I Use Refactoring?


    Refactoring can be used in all phases of the application lifecycle; for instance,
    during development of the first version of an application. But just assume we
    don''t use refactoring, but an up-front, traditional design heavy process instead
    (now often referred to as Big Design Up-Front, BDUF). We will spend quite a lot
    of time on initial detailed design, creating loads of detailed UML diagrams, but
    as a result we will expect the development to go very smoothly and quickly. Even
    assuming that it does, there is still a risk that the code will be, well, smelly.


    Instead, let''s say we just accept the fact that we can''t get it right up front
    the first time. In this case, a slightly different approach is to move some of
    the effort from initial detailed design over to'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'development instead (and of course all development, especially in this case,
    *is design*) and to be prepared for doing refactoring continuously when we learn
    more. Learning more is exactly what we do during development, and as I see it,
    this approach results in higher quality code.


    So instead of doing too much guessing, we do more learning and proofing!


    # Note


    I was probably overly positive to BDUF so as to not distract you from the point
    that I was after regarding smell code. Doing a lot of guesswork on day one will
    often lead to wasted time because it is just guesswork.


    My friend Jimmy Ekbäck commented on this by saying, "BDUF can be even worse than
    wasted time because of incorrect guesses. BDUF can also lead to self-fulfilled
    prophesies."


    # Refactoring + TDD = True


    In order to be able to use refactoring in a safe way, you *must* carry out extensive
    tests. If you don''t, you will introduce bugs and/or you will prioritize, not
    making any changes simply for the sake of maintainability, because the risk of
    introducing bugs is just too large. And when you stop making changes because of
    maintainability, your code has slowly started to degrade.


    # Note


    You will find much more coverage, with focus on hands-on examples, about both
    TDD and Refactoring in [Chapter 3](Chapter 3).


    It''s a good idea to use TDD and refactoring for bugfixing also. First expose
    the bug with a red test, then solve the bug so you get green, and then refactor.


    # Which Ingredient or a Combination?


    Again, I''m sure many of you are wondering which way to go. For instance, should
    you focus on up-front design or TDD?


    As I see it, you can mix up-front design and TDD successfully. For example, set
    up some up-front architecture, work with Domain-Driven Design, and for each piece
    of behavior build it with TDD (including refactoring). Then go back to your architecture
    and change it in accordance with what you have learned. Then work with Domain-Driven
    Design, and continue like that.'
