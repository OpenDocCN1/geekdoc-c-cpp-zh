  md: '# # Praise for *Applying Domain-Driven Design and Patterns*


    > > "I don''t know what it was I professed to doing before I had added Domain-Driven
    Design and Test-Driven Development to my toolkit, but from my present perspective,
    I''m reticent to call it anything but chaotic hacking. Domain-Driven Design and
    Test-Driven Development are two approaches that have consistently guided me toward
    a practical application of software design principles, and brought my projects
    to fruition with healthy, sustainable software. This is a book that puts its money
    where its mouth is in terms of concretely communicating Agile software development
    practice. It''s potentially one of the most impactful guides to software development
    success practices yet offered to the .NET software development community."


    Scott Bellware, Microsoft MVP for C#, DDD and TDD Blogger


    > > "Jimmy Nilsson does his readers a great service by showing them how to apply
    the foundational principles of enterprise application design and development taught
    by Evans, Fowler, and other thought leaders. The book uses a worked example not
    only to explain, but also to demonstrate Domain-Driven Design, Patterns of Enterprise
    Application Architecture, and Test-Driven Development. Jimmy''s insight and experience
    make reading it a pleasure, and leave the reader with the certainty that they
    have learned from a master practitioner. Enterprise developers looking to master
    these principles will find the book a valuable guide."


    Jack Greenfield, Enterprise Tools architect, Visual Studio Team System, Microsoft


    > > "Good software architects reserve the right to get smarter. Beyond the goal
    of shipping their current system, they''re on a quest to discover better ways
    to design and build software. This book is a travelogue of sorts in which Jimmy
    documents his journey through a wide range of patterns, practices, and technologies,
    explaining how his thinking about enterprise systems has evolved along the way.
    If you''re traveling the same road, this book is a good companion."


    Tim Ewald, principal architect at Foliage Software Systems and author of *Transactional
    COM+: Building Scalable Applications*


    > > "This book does an excellent job at making tangible the large but very important
    ideas of Domain-Driven Design."


    Floyd Marinescu, author of *EJB Design Patterns* and creator of [InfoQ.com](https://InfoQ.com)
    and [TheServerSide.com](https://TheServerSide.com)


    > > "Understanding the concepts and driving forces in the problem domain is paramount
    to the success of software development. Jimmy Nilsson has drawn inspiration from
    the past ten years of studies into patterns and Domain-Driven Design as well as
    recorded his own experiences from concrete development projects. This book contains
    compelling examples of how theory can be translated into practice. It demonstrates
    the author''s profound understanding of design choices and trade-offs involved
    in object-oriented development."'
  merge: -1
  img_proc: true
