    \    private CustomerRepository _repository;\n\n    protected abstract IWorkspace\
    \ _CreateWorkspace();\n\n    [SetUp]\n    public void SetUp()\n    {\n       \
    \ _ws = _CreateWorkspace();\n        _repository = new CustomerRepository(_ws);\n\
    \    }\n\n    [TearDown]\n    public void TearDown()\n    {\n        _ws.Clean();\n\
