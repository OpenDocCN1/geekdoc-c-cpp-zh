    \ between `order` and `Customer` classes. That's why I ask the `OrderRepository`\
    \ for help (as one of several possible strategies for simulating bidirectionality)\
    \ for going from `Customer` to its `Orders`.\n\nWe could deal with that by injecting\
    \ `_orderRepository` to the order in the constructor like this:\n\n`Order o =\
