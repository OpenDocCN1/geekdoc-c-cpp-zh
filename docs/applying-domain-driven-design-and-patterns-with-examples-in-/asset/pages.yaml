- pgno: 84
  md: 'We try to split the classes so that the responsibilities are cohesively dealt
    with from a technological point of view.


    Therefore, the old classes will now only focus on the domain meaning (let''s call
    the layer Domain layer). The presentation (or rather consumption) responsibilities
    are dealt with by another set of classes (another layer called the Consumer layer),
    and the persistence responsibilities are dealt with by yet another set of classes
    (the Persistence layer).


    Three layers spontaneously felt like a typical solution here, one per responsibility
    category. The two new layers have two *implementations* each for dealing with
    both the old requirements and the new.


    The dependencies between the layers are also defined, and in this case we decided
    that the consumption layer will depend on the domain layer, and the domain layer
    will depend on the persistence layer. That way, the Consumer layer is totally
    unaware of the Persistence layer, which was something we decided was good in this
    particular project.


    We will get back to the subject of layering again in [Chapter 4](#chapter-4),
    "A New Default Architecture," and then approach it a bit differently.


    # Another Example: Domain Model Pattern


    We have already discussed the Domain Model pattern [Fowler PoEAA] in [Chapter
    1](#chapter-1) (and will do so much more throughout the book). I think about the
    Domain Model pattern as an example of an Architectural Pattern.


    We''re not going to discuss an example about the Domain Model pattern here and
    now because the whole book is about just that. Instead, we''ll continue by focusing
    on another dimension of the patterns, regarding domain-dependence or not. Next
    up are Design Patterns for specific types of applications.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Design Patterns for Specific Types of Applications


    Another set of Design Patterns isn''t as generic as those discussed so far, but,
    for example, patterns for building enterprise applications.


    Defining an enterprise application is tricky, but you can think of it as a large-scale
    information system with many users and/or a lot of data.


    The main book dealing with the patterns in this category is Martin Fowler''s Patterns
    of Enterprise Application Architecture [Fowler PoEAA].


    The patterns here at first sight might not seem as cool or amazing as some of
    the Design Patterns, but they are extremely useful, cover a lot of ground, and
    contain a lot of experience and knowledge. As I said, they are less generic than
    the other Design Patterns and focused just on large-scale information systems.


    They come into play for the chosen structure of the logic; for example, the Domain
    Model. The patterns here aren''t so much about how the Domain Model itself (or
    any of the other models for structuring the main logic) should be structured,
    but more about the infrastructure for supporting the Domain Model.


    To make it more concrete, I''d like to discuss an example, and I choose Query
    Objects [Fowler PoEAA].


    # An Example: Query Objects


    Let''s assume for a moment that you have a Domain Model for a SalesOrder application.
    There is a Customer class and an Order class, and the Order class in particular
    is composed of a number of other classes. This is simple and clear.


    There are several different solutions from which to choose in order to navigate
    the Domain Model. One solution is to have a global root object that has references
    to root-like collections. In this case, a customer collection would be an example
    of one of these. So what the developer does is to start with the global root object
    and navigate from there to the customer collection, and then iterate the collection
    until what is needed is found, or perhaps navigate to the customer''s sales orders
    if that''s what''s of interest.


    A similar paradigm is that all collections are global so you can directly access
    the customer collection and iterate over it.


    Both those paradigms are easy to understand and simple to use, but one drawback
    is that they are lacking somewhat from the perspective of a distributed system.
    Assume you have the Domain Model running at the client (each client has one Domain
    Model, or rather a small subset of the Domain Model instances, and no shared Domain
    Model instances) and the database is running at a database server (a pretty common
    deployment model). What should happen when you ask the root object to get the
    customer collection of one million customers? You can get all the customers back'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'to the client so the client can iterate over the collection locally. Not so
    nice to wait for that huge collection to be transmitted.


    Another option is to add an application server to the picture and ask it to only
    send over a collection reference to the client side, and then much less data is
    transmitted, of course. On the other hand, there will be an incredible amount
    of network calls when the client is iterating the list and asking for the next
    customer over the network one million times. (It will be even worse if the customer
    instances themselves aren''t marshaled by value but only by reference.) Yet another
    option is to page the customer collection so the client perhaps gets 100 customers
    from the server at a time.


    I know all these solutions have one problem in common; you don''t often want to
    look at all the customers. You need a subset, in which case it''s time to discuss
    the next problem.


    # Problem


    The problem is that the users want a form where they can search for customers
    flexibly. They want to be able to ask for all customers who


    +   - Have a name with "aa" in it. (Hidden marketing for a Swedish car company.)

    +   - Ordered something last month.

    +   - Have orders with a total amount greater than one million.

    +   - Have a reference person called "Stig."


    But on the same form, they should also be able to ask for just customers in a
    certain part of Sweden. Again, the search form needs to be pretty flexible.


    I''m going to discuss three different solution proposals, namely "filtering within
    Domain Model," "filtering in database with huge parameter lists," and "Query Objects."


    # Solution Proposal One: Filter Within Domain Model


    Let''s take a step back and admit that we could use any of the solutions already
    discussed so that the collection is materialized somewhere and then the filter
    is checked for every instance. All instances meeting the filter criteria are added
    to a new collection, and that is the result.


    This is a pretty simple solution, but practically unusable in many real-world
    situations. You will waste space and time. Not only were there one million customers,
    but you also had to materialize the orders for the customers. Phew, that solution
    is just impossible to use and it''s even worse when you scale up the problem....


