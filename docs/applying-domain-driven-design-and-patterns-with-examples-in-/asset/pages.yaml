- pgno: 473
  md: 'There''s no news in how this is implemented: The client calls a Web Service
    with the ID of the order, the Web Service forwards the call to a Service Layer
    method and serializes the results to XML. By now, we know the drill for letting
    the client fetch data. What about letting the client submit data?


    # Submitting Data


    Let''s say we want the user to be able to update the status of an order from "Not
    inspected" to "Approved" or "Disapproved." At first glance it may seem like a
    straightforward request, but we''re really opening a Pandora''s Box of concurrency
    problems here as we move from read-only to read-write access.


    So let''s begin by sticking with the first glance and not look any closer for
    a little while. How would we do it then?


    The first thing to do is to create an `UpdateOrderStatus()` Service Layer method
    and a corresponding Web Service. The methods should accept the ID of the order
    and the new order status as parameters and return a bool value telling you if
    the operation completed successfully. (We won''t go into any advanced cross-platform
    exception handling here even though it''s a whole bunch of fun!)


    So far, so good; the Service Layer method is easy enough to implement, and the
    Web Service is just a wrapper, forwarding the call to the Service Layer method.
    Now let''s look at the problems we''re going to run into.


    The problems arise if two users try to update the status of the same order at
    the same time. Say that user A fetches an order, notes that it is "Not inspected"
    and goes on to inspect it. Just a little later, user B fetches the same order,
    notes the same thing, and also decides to inspect it. User A then notes a small
    problem with the order, causing her to mark the order as "Disapproved" in her
    following call to the `UpdateOrderStatus()` Web Service.


    Just after user A has updated the status of the order, user B proceeds to call
    the same Web Service for updating the status of the same order. However, user
    B hasn''t noticed the problem with the order and wants to mark the order as "Approved."
    Should user B be able to overwrite the status that A gave the order and that is
    now stored in the database?


    A standard answer would be "No, because user B didn''t know about the changes
    user A had made." If user B had known about the change that user A made and still
    decided to override it, the answer would be "Yes" because then B could be trusted
    not to overwrite A''s data by mistake. So the challenge becomes this: How do we
    keep track of what B, or any other client, "knows"?


    One approach is to keep track of the original values from the database for updates
    fields and then at the time when the modified data is saved to the database, check
    if the original values match those that are in the database now. If the values
    in the database have changed, the client didn''t know about these changes and
    the client''s data should be rejected.


    This approach is called *optimistic concurrency*. Let''s look at a very simple
    way that optimistic concurrency could be implemented for the case at hand.


    To begin with, the client application has to be coded so that when the user changes
    the status of an order, the status that was originally returned from the database
    via the XML document is still kept around.'
  merge: -1
  img_proc: true
- pgno: 474
  md: 'Then the `UpdateOrderStatus()` Web Service and the Service Layer method with
    the same name have to be modified to accept an additional parameter for the original
    order status value. Thus, when the client calls the Web Service, three parameters
    are passed: the ID for the order, the new order status, and the original order
    status.


    Finally, the `UpdateOrderStatus()` Service Layer method should be updated to include
    a check if the current status for the order in the database matches that which
    was passed to the parameter for the original order status, executing the update
    only if the values matched.


    This version of optimistic concurrency, matching the original values of updated
    fields with those in the database, will give good performance and scalability,
    but it can be a bit cumbersome to implement, at least in a Rich Client scenario.
    An alternative way of using optimistic concurrency is to add a versioning field
    to the tables in your database.


    Sometimes even strategies like optimistic concurrency won''t work, so domain-specific
    solutions have to be applied in those cases. A normal theme is to use some sort
    of check-in/out system, where the user marks an object as "checked out" or "locked"
    when it is fetched for write access, preventing other users from updating it until
    she is done. Other, more sophisticated schemes include merging of concurrently
    updated data.


    The only way to decide on what strategy is appropriate in the particular case
    is to ask the domain specialist, that is, the person understanding the business
    implications of these decisionsthat behavior is desired. There''s no general way
    to select a concurrency strategy.


    Even so, I''m guessing that the appropriate way to go in this case would be to
    use optimistic concurrency, with or without a versioning field. The point is that
    it is still up to somebody who knows what the expected behavior is for their business
    to decide.


    Perhaps the biggest problem with the approach we have used here is that we have
    asked the client to keep track of the original values for us. This is probably
    asking a bit too much of the client application developer, so a better alternative
    might be to store the original values on the server in a `Session` variable or
    a similar construct.


    # How Fine-Grained?


    Another thing to consider is whether the service is too fine-grained. Rather than
    providing a separate Web Service for every field of an order that can be updated,
    could we, perhaps, implement a single `UpdateOrder()` Web Service instead?


    In this case, rather than providing a parameter for each updateable field, the
    Web Service could accept an XML document representing the updated order. That
    is, instead of this:


    ```

    ```csharp

    [WebMethod]public bool UpdateOrder(int orderID, int orderStatus

    , DateTime orderDate, int customerID)

    ```

    ```


    you could use this:


    ```

    ```csharp

    [WebMethod]

    public bool UpdateOrder(string xmlOrder)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 475
