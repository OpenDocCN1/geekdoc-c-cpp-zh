  md: "# Generics and Anonymous Methods to the Rescue\n\nIf you are using an environment\
    \ that supports generics (such as .NET 2.0), you can of course apply generics\
    \ to the solution proposals discussed previously and gain slightly in explicitness,\
    \ type safety, and performance. That goes, by the way, for most of the chapters\
    \ discussed so far.\n\nTo take a small example, instead of this:\n\n```\nIList\
    \ BrokenRulesRegardingPersistence {get;}\n```\n\nYou could with generics use:\n\
    \n```\nIList<IRule> BrokenRulesRegardingPersistence {get;}\n```\n\nNot a dramatic\
    \ improvement or something we can't live without (as is shown throughout the book),\
    \ but an improvement that will affect (again positively) many places in your code.\n\
    \nAnother technique I have not had in the environments I've been working in most\
    \ of the time is anonymous methods (similar to blocks or closures as it's called\
    \ in other languages).\n\nThe idea is to be able to send a block of code as a\
    \ parameter to a method, but the block of code can use variables that are in scope\
    \ of the method that received the block.\n\nSome people have discussed it as a\
    \ way of implementing Specifications without creating new classes, although I\
    \ think that means that you will lose some of the explicitness and clarity with\
    \ the Specifications naming, which is a powerful feature of Specifications. Instead,\
    \ I currently think of anonymous methods more as a good technique for providing\
    \ variations to reusable assets. For example, you can inject part of the implementation\
    \ of a method at will. It's a different way of thinking about customizability.\n\
    \nJust to give you a taste of the whole thing if you are new to the technique,\
    \ let's combine generics and anonymous methods to a snippet we discussed previously\
    \ and see if it can be improved. Do you remember the loop for seeing if a Customer\
    \ needs to be invoiced? It looked like this:\n\n```\n//Customer\npublic IList\
    \ OrdersToInvoice(ReadyToInvoiceSpecification\n    specification)\n{\n    IList\
    \ orders = _orderRepository.GetOrders(this);\n    IList result = new ArrayList();\n\
    \    foreach (Order o in orders)\n    {\n        if (specification.Test(o))\n\
    \            result.Add(o);\n```"
