  md: '![](img/89fb3513cb9b6343875aadbfd042005d_219_0.png)


    The Fake can also be serialized to/deserialized from files, which is great for
    creating very competent, realistic, and at the same time extremely refactoring-friendly
    early versions of your applications.


    Another possibility that suddenly feels like it could be achieved easily (for
    a small abstraction layer API at least) could be to Mock the infrastructure instead
    of each of the Repositories. As a matter of fact, it won''t be a matter of Mocking
    one infrastructure-product, but all infrastructure products that at one time will
    have adapter implementations for the abstraction layer (if that happens, that
    there will be other implementations than those two I wroteit''s probably not that
    likely). So more to the point, what is then being Mocked is the abstraction layer.


    It''s still a stretch to talk about PI Repositories, but with this solution I
    can avoid a reference to the infrastructure in the Domain Model. That said, in
    real-world applications I have kept the Repositories in a separate assembly anyway.
    I think it clarifies the coupling, and it also makes some hacks easier to achieve
    and then letting some Repository methods use raw SQL where that proves necessary
    (by using connection strings as markers for whether optimized code should be used
    or not).


    However, instead of referring to the Persistence Framework, I have to refer to
    the NWorkspace DLL with the adapter interfaces, but that seems to be a big step
    in the right direction. It''s also the case that there are little or no distractions
    in the Repositories; they are pretty "direct" (that is, if you find the NWorkspace
    API in any way decent).


    So instead of writing a set of Repositories with code against an infrastructure
    vendor’s API and another set of Repositories with dummy code, you write one set
    of Repositories against a (naïve) attempt for a standard API.


    # Note'
