  md: 'in large systems as it avoids the problematic situation where different components
    to be used in a system are tied to different locator implementations.


    Another advantage of the Dependency Injection pattern, especially with Constructor
    Dependency Injection, is that all dependencies of an object are easily visible
    in code. Modern IDEs are capable of highlighting all usages of a service locator
    in a given class (by pressing Ctrl-Shift-F7), but even with a sophisticated IDE
    this is not as easy as looking at a constructor.


    It is often stated that Dependency Injection couples the life cycle of the object
    A that has the dependencies with the life cycles of the objects B and C it depends
    on, because B and C must be created before A so that they can be injected. This
    is not a problem with the Service Locator pattern because the creation of B and
    C can be postponed until they are requested from the locator by A. Fortunately,
    the same can be achieved, if not as naturally, with the Dependency Injection pattern,
    as one usage of the Component Adaptors in PicoContainer shows. Instead of injecting
    an instance of the actual class, the container injects a proxy that only creates
    the real instance when it is first used and from then on forwards all method calls
    to it. This is completely transparent to the object that has the dependencies,
    but it effectively decouples their lifecycles.


    # Summary


    In this section, we looked at two issues that arise in the construction of any
    software system: the coupling of objects that depend on other objects and the
    managing of component instances. We first described how these issues can be addressed
    with the commonly used Factory, Registry, and Service Locator patterns. Realizing
    that these patterns have certain shortcomings, we discussed the Dependency Injection
    pattern, which addresses these issues in a novel way. This pattern, which is based
    on the Inversion of Control principle, provides better decoupling and scales well,
    from simple problems to very complex dependencies. It also improves testability,
    which is important for TDD, and allows domain models to be completely separated
    from infrastructure code, which makes it a useful tool for DDD.


    As with almost any pattern, Dependency Injection is not a silver bullet and one
    cannot make the general recommendation to always replace the use of the Service
    Locator pattern with Dependency Injection. It is important to understand the differences
    and benefits of each pattern and use them appropriately. We have also seen that
    the Dependency Injection pattern has several flavors that provide trade-offs.
    Fortunately, choosing a certain flavor does not affect testability, which is important
    for development, and the containers that are used at runtime generally support
    all main variants. We can therefore choose, or even mix, different flavors as
    required.


    The most important consideration when designing systems is to separate concerns,
    in this case configuration and usage of components, and then choose the most suitable
    design pattern from a rich catalogue.


    Thanks, Erik!


    I just want to stress once more what Erik ended with. You can think about Dependency
    Injection as what Martin Fowler talks about in his DSL article [Fowler LW] when
    he says that development can be thought of as creating good abstractions and then
    configuring them. Dependency Injection is one approach to taking care of part
    of the configuration.


