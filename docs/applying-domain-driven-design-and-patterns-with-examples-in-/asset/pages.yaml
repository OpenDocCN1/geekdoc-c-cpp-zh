    \ could look like this:\n\n```\n<bag name=\"ReferencePersons\" access=\"field.camelcase-underscore\"\
    \n    cascade=\"all\">\n    <key column=\"OrderId\" />\n    <composite-element\
    \ class=\"ReferencePerson\">\n        <property name=\"FirstName\"\n         \
