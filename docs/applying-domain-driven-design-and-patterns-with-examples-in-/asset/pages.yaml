    \ to the database during the persist method or detecting which instance has the\
    \ problem in the first place (and for which column if there are several candidate\
    \ keys for the instance).\n\nAll these problems can be avoided if you accept holes\
    \ in the number series and if the method for grabbing the next number also commits\
