- pgno: 422
  md: "In this example we are using an after advice that checks if the new balance\
    \ is below the alert balance level and sends a notification if it is. We also\
    \ defined several properties on the advice class in order to show how you can\
    \ configure advices using the Spring.NET IoC container.\n\nTight coupling between\
    \ the advice and our Account class is not a problem in this case because we know\
    \ that our advice will only apply to instances of the Account class anyway we\
    \ are simply using the advice to move the notification sending rule outside the\
    \ core logic of the Account class.\n\nWhat this really buys us is flexibility.\
    \ If we sell the application to another client who wants us to remove the notification\
    \ we can easily do it by removing the advice application from the configuration\
    \ file. Similarly, if a client asked us to implement the logic in such a way that\
    \ automatic transfer from a Line of Credit account happens whenever the balance\
    \ falls below a minimum amount allowed, we could easily implement another advice\
    \ and apply it to our Account class instead, or even in addition to the notification\
    \ advice.\n\n# Applying the Advice\n\nJust like in the previous example, we will\
    \ only show the declarative aspect configuration to complete this example.\n\n\
    ```\n<aop:aspect name=\"BalanceNotificationAspect\">\n    <aop:advice\n      \
    \  type=\"BusinessRulesDemo.AccountBalanceNotificationAdvice\"\n        pointcut=\"\
    class(Account+) and method(Withdraw)\">\n        <aop:property name=\"Sender\"\
    \ ref=\"NotificationSender\"/>\n        <aop:property name=\"Subject\" value=\"\
    Low Balance\"/>\n        <aop:property name=\"Template\"\n            value=\"\
    ~/Templates/LowBalance.vm\"/>\n    </aop:advice>\n</aop:aspect>\n```\n\nThe only\
    \ thing worth pointing out here is that you can use Spring IoC features to configure\
    \ your advices, just like you would use it to configure any other object. In this\
    \ example, we are using that to specify the notification subject and the filename\
    \ of the NVelocity message template, as well as the instance of the notification\
    \ sender to use.\n\n# Summary\n\nAOP can help you solve some of the problems you\
    \ are facing every day. While it would be great to have support for AOP in .NET\
    \ on the language and CLR level, there are tools in the .NET open source community\
    \ that can give you a decent set of AOP features today.\n\nProbably the best way\
    \ to start learning more about AOP is to download some of these tools and experiment\
    \ with them, and maybe even start introducing them into real-world projects to\
    \ help with the basic usage scenarios, such as logging or profiling. As you become\
    \ more knowledgeable about AOP and more familiar with the tool of your choice,\
    \ you will likely find many other areas of your application where aspects can\
    \ help you."
