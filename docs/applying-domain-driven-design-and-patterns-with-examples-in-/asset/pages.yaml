    # Avoiding Problems


    Feature 9, "An order must have a customer; an order line must have an order,"
    is a great example of a rule that I''d like to not have as a rule at all if possible,
    but I''d rather force it in the constructor instead. Then there''s no need to
    check for it.


    Clean, simple, efficient. Just good. I know, I know, this sets your alarm bells
    ringing. Of course there are problems, too.


    For example, it''s possible that you''d like to have an instance of an order without
    first having to decide on the customer because of the UI design.


    # Note


    This can be dealt with in the UI, of course, in several different ways. Still,
    it might not feel good to create a "problem" if we don''t have to.


    Another problem is that the creation code might get so complex that it can throw
    exceptions itself, and then we are back into the problems again with how to expose
    broken rules, and so on. We also said that exceptions should be exceptional, so
    it just doesn''t feel right to toss exceptions in the creation code for saying
    that there was a broken rule.


    There is one thing that eases the burden somewhat. We could let the feature request
    talk about persistent instances and not transient instances. I''m thinking about
    `OrderLine`, for example. In my current design, `OrderLine` isn''t an Aggregate
    on its own, but is one part of the `Order` Aggregate instead. Therefore, the only
    way to make an `OrderLine` persistent is to associate it to an `Order` with `AddOrderLine()`.
    Until then, I probably don''t care that the `OrderLine` doesn''t have an `Order`.
    The `OrderLine` can''t be stored, and the persist method won''t throw an exception
    either because of an orphan `OrderLine` (because the persist method won''t know
    about it at all).


    Sure, it might be the case that some processing in the `OrderLine` requires knowledge
    of the `Order`, but if not, I think this is a fine solution.


    # Note


    And right now I think it''s arguable whether the `OrderLine` needs the knowledge
    of its `Order` at all. We can probably most often avoid that bidirectionality
    that we will have'
