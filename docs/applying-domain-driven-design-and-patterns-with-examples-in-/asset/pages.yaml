    q.AddCriterion(sub2);


    q.AddCriterion("ReferencePersons.FirstName", Op.Equal, "Stig");

    ```

    ```


    # Note


    The parameter to the Query constructor is not a table name but a Domain Model
    class-name. The same goes for the parameters to AddCriterion(); I mean it''s not
    table columns, but class fields/properties. In that case, property names or field
    names are used in the Domain Model.


    Also note that in this specific example, I didn''t need a subquery for the criterion
    regarding the ReferencePersons because the Domain Model was navigable from Customer
    to ReferencePerson. On the other hand, subqueries were needed for the Orders for
    the opposite reason.


    # More Comments


    If you are SQL-literate, your first impression might be that the SQL-version was
    more expressive, easier to read, and just better. SQL is certainly a powerful
    query language, but remember what we want to accomplish. We want to be able to
    work as much as possible with the Domain Model (within limits) and thereby achieve
    a more maintainable solution. Also note that the C# code just shown was needlessly
    talkative. Later on in the book we will discuss how the syntax could look by writing
    a thin layer on top of a general query object implementation.


    So what we gained was further transparence of our code with regard to the database
    schema. Generally, I think this is a good thing. When we really need to, we can
    always go out of this little sandbox of ours to state SQL queries with the full
    power of the database and without a lifeline.


