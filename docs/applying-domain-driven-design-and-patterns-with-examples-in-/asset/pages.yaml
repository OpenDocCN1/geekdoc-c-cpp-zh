    \   string[] names = value.Split(\" \".ToCharArray()\n        , 2);\n    this.employee.FirstName\
    \ = names[0];\n    this.employee.LastName = names[1];\n}\n}\n}\n}\n}\n```\n```\n\
    \nUsing the `EmployeeWrapper` class is a matter of bringing up an `Employee` object\
    \ from the Domain Model and then passing it to the `EmployeeWrapper` constructor\
    \ (see the following code listing).\n\n```\n```csharp\n//Using the Presentation\
    \ Model wrapper object\nEmployee employee = employeeRepository.GetEmployeeById(42);\n\
    EmployeeWrapper employeeWrapper = new EmployeeWrapper(employee);\n\nSomeControl.DataSource\
    \ = employeeWrapper;\n```\n```\n\nBig advantages with the wrapping approach include\
    \ simplicity and flexibility. You can write pretty much any transformations you\
    \ like in your wrapper objects, transformations far more complex than our relatively\
    \ simple `FullName` transformation, if required.\n\nA big drawback is that you\
    \ will find yourself writing a lot of repetitive code in your wrapper classes\
    \ for delegating to properties that don't need any transformation like the `Id`\
    \ property in the previous example.\n\nThis may make it tempting to just go ahead\
    \ and let the Presentation Model objects inherit from the Domain Model objects\
    \ instead, overriding whatever properties that need transformation, but leaving\
    \ all others as they are. The problem with this is that then you are stuck with\
    \ the public API of the Domain Model, because all public members of a superclass\
    \ are inherited by the subclass.\n\nIn our example, we could have let the PM `Employee`\
    \ inherit from the Domain Model `Employee`, and we could have added the `FullName`\
    \ property to the PM `Employee`, but the PM `Employee` would also have exposed\
    \ the `FirstName` and `LastName` properties from the Domain Model `Employee`,\
    \ because these public properties would be inherited.\n\nWrapping your Domain\
    \ Model objects rather than inheriting from them gives a higher level of encapsulation\
    \ that is usually well worth the extra, admittedly tedious, work of delegating\
    \ between PM and Domain Model properties."
