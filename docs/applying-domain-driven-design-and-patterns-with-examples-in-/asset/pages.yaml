  md: "# Note\n\nIf you have the possibility of using *Aspect-Oriented Programming\
    \ (AOP)*, it might not take more than a few minutes to add tracing afterward.\
    \ We will discuss AOP quite a lot in Chapter 10, \"Design Techniques to Embrace.\"\
    \n\n# Tracing in Place\n\nIf you have a working tracing solution in place, you\
    \ know how efficient it might be to find and solve the problem instead. The days-long\
    \ delay is gone, and you are on the way to tracking down the problem in minutes.\n\
    \nSo it’s important to be careful and not think \"You Aren't Going to Need It\"\
    \ (YAGNI) too often when it comes to operational mechanisms. Using YAGNI often\
    \ will cost too much when it comes to adding the mechanism if (or rather when)\
    \ you will need it. Remember, the idea with YAGNI is that the cost of adding something\
    \ is pretty much the same now and later, in which case you can always wait until\
    \ you really need it. When the cost is low now and high later, and there's a good\
    \ chance you will need it, you should make a different decision.\n\n# Some Examples\
    \ of Operational Mechanisms\n\nHere I have listed a short number of operational\
    \ mechanisms that can be considered for most enterprise scale applications:\n\n\
    +   - **Tracing**\n+   \n+     As we just discussed, it's nice to be able to listen\
    \ to what is going on at the same time as users run scenarios in the system. This\
    \ is not only a very efficient solution for tracking down bugs, but it can be\
    \ used for investigating where the bottlenecks are located, for example.\n+  \
    \ \n+   - **Logging**\n+   \n+     Errors, warnings, and information messages\
    \ must be logged. This is extremely important for investigating problems after\
    \ they have occurred. We can't expect the users to write down the exact messages\
    \ for us. It might also be that we want to collect information that we don't want\
    \ to show to the users.\n+   \n+   - **Config**\n+   \n+     Have you had to recompile\
    \ old applications just because the database server was switched to a new machine\
    \ with a new name? I have. Of course, that kind of information should be configurable\
    \ and depending on the application, this might be the case for loads of information.\n\
    +   \n+   - **Performance monitoring**"
