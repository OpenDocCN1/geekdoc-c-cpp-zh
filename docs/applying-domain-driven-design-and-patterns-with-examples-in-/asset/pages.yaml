  md: "# Refactoring\n\nI mentioned refactoring previously as the third step in the\
    \ general process of TDD, and I think I should briefly explain the term a bit\
    \ more. Refactoring is about making small, well-known changes step-by-step in\
    \ order to improve the design of existing code. That is, you make changes to improve\
    \ the maintainability of the code without changing its observed behavior. Another\
    \ way to say it is to change how, not what.\n\nThe term \"refactoring\" has become\
    \ something of a buzzword; it's much overused and also misused. For instance,\
    \ instead of saying that we are going to make loads of significant and ground-breaking\
    \ changes to our code base, we say that we will refactor it. That's not, however,\
    \ the central meaning of the term.\n\nWe talked quite a lot about what refactoring\
    \ is and why you should use it in Chapter 1. In this section about refactoring,\
    \ we'll take a look at how it's used. We will start with some basic refactorings\
    \ for routine cleaning. Then we'll talk briefly about how productivity could gain\
    \ from new tooling support. Finally, we'll refactor to, toward, or from patterns\
    \ for preventing the occurrence of maintainability issues.\n\n# Let's Clean Some\
    \ Smelly Code\n\nWe did discuss some refactorings in the previous TDD example,\
    \ but I think it's time to have a look at another refactoring example. Let's start\
    \ with the following piece of code, a Person class:\n\n```\n```csharp\npublic\
    \ class Person\n{\n    public string Name = string.Empty;\n    public DateTime\
    \ BirthDate = DateTime.MinValue;\n    public IList Children = new ArrayList();\n\
    \n    public int HowOld()\n    {\n        if (BirthDate != DateTime.MinValue &&\n\
    \            BirthDate < DateTime.Now)\n        {\n            int years = DateTime.Now.Year\
    \ -\n                BirthDate.Year;\n            if (DateTime.Now.DayOfYear <\n\
    \                BirthDate.DayOfYear)\n                years--;\n\n          \
    \  return years;\n        }\n        else\n            return 0;\n    }\n}\n```\n\
    ```"
