  md: "will) for fulfilling the query. To find out if we have that, we need to hit\
    \ the database. This brings us to another problem. `GetById()` starts with the\
    \ Identity Map; `GetByQuery()` does not. This is totally different behavior, and\
    \ it actually means that `GetByQuery()` bypasses the cache, which is problematic.\
    \ If you ask for the new `Customer` Volvo that has been added to the Identity\
    \ Map/Unit of Work, but has not been persisted, it will be found if you ask by\
    \ ID but not when you ask by name with a query. Weird.\n\nTo tell you the truth,\
    \ it was a painful decision, but I decided to let `GetByQuery()` do an implicit\
    \ `PersistAll()` by default before going to the database. (There's an override\
    \ parameter to `GetByQuery()` to avoid this, but again, it's the default to implicitly\
    \ call `PersistAll()`.) I came to the conclusion that this default style is probably\
    \ most in line with the rest of NHibernate and its goal of simplicity and the\
    \ lessened risk of errors. This is why I made some sacrifices with transactional\
    \ semantics. Some might argue that this violates the principle of least amount\
    \ of surprise. But I think it depends on your background, what is surprising in\
    \ this case.\n\nThe biggest drawback is definitely that when doing `GetByQuery()`,\
    \ you might get save-related exceptions. What a painful decisionbut I need to\
