  md: "# # Querying\n\nQuerying is extremely different in different infrastructure\
    \ solutions. It's also something that greatly risks affecting the consumer. It\
    \ might not be apparent at first when you start out simply, but after a while\
    \ you'll often find quite a lot of querying requirements, and while you are fulfilling\
    \ those, you're normally trying yourself to the chosen infrastructure.\n\nLet's\
    \ take a step back and take another solution that is not query-based. Earlier,\
    \ I showed you how to fetch by identity in a Repository with the following code:\n\
    \n```\n```csharp\n//OrderRepository\npublic Order GetOrder(int orderNumber)\n\
    {\n    return (Order)_ws.GetById(typeof(Order), orderNumber);\n}\n```\n```\n\n\
    However, if orderNumber isn't an identity, the interface of the Repository method\
    \ must clearly have to change to return a list instead, because several orders\
    \ can have orderNumber 0 but there have reached a certain state. But then what?\
    \ GetById() is useless now, because orderNumber isn't an Identity (and it's assume\
    \ it's not unique because I said the answer could be a list). I need a way to\
    \ get to the second layer of Identity Maps of the Fake for the Orders. Let's assume\
    \ I could do that with GetAll(Type, typeOfResult) like this:\n\n```\n```csharp\n\
    //OrderRepository\npublic IList GetOrders(int orderNumber)\n{\n    IList result\
    \ = new ArrayList();\n    IList allOrders = _ws.GetAll(typeof(Order));\n\n   \
    \ foreach (Order o in allOrders)\n    {\n        if (o.OrderNumber == orderNumber)\n\
    \            result.Add(o);\n    }\n\n    return result;\n}\n```\n```\n\nIt's\
    \ still pretty silly code, and it's definitely not what you want to write when\
    \ you have infrastructure in place, at least not for real-world applications.\n\
    \n# ## Single-Set of Query Objects"
