  md: "# Reference Person for an Order\n\nIt's time to talk about `ReferencePerson`\
    \ of an `Order` again. There I think we have an example of a Value Object [Evans\
    \ DDD], although it is a bit different than the `OrderType` (which was a value\
    \ object candidate) because reference people aren't global for the whole system\
    \ but rather specific per `Customer` or `Order`. (Well, that's a good indication\
    \ that `ReferencePerson` shouldn't be an enum.)\n\nIn _Figure 5-15_, you can see\
    \ the `ReferencePerson` \"in action.\"\n\n![](img/89fb3513cb9b6343875aadbfd042005d_199_0.png)\n\
    \nWhen we go for a Value Object pattern [Evans DDD], it might feel obvious that\
    \ we should use a struct in .NET instead of a class, but there are recommendations\
    \ for size regarding when to use a struct and when not to, and you'll get more\
    \ problems with infrastructure when it comes to structs. It's also the case that\
    \ you will see more boxing when using structs, so the decision isn't clear-cut.\
    \ I'm actually leaning to using classes, but most often I'm making them immutable.\
    \ If you go that route, you need to use all the values of the class for when you\
    \ are overriding the `Equals()`.\n\nThis is what the `Equals()` could look like\
    \ for the Value Object `ReferencePerson`. (Note that I'm comparing all the fields\
    \ of the Value Object, unlike how I did it with the Entity before. Also note that,\
    \ Identity Map or not, overriding `Equals()` for Value Objects is needed.)\n\n\
    ```\n```csharp\n//ReferencePerson\npublic override bool Equals(object o)\n{\n\
    \    if (o == null)\n        return false;\n\n    if (this.GetType() != o.GetType())\n\
    \        return false;\n    ReferencePerson other = (ReferencePerson) o;\n\n \
    \   if (!FirstName.Equals(other.FirstName))\n        return false;\n    if (!LastName.Equals(other.LastName))\n\
    \        return false;\n\n    return true;\n}\n```\n```"
