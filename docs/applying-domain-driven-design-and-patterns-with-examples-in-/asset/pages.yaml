- pgno: 358
  md: "# Another Classification: Infrastructure Patterns\n\nWithout further ado, let's\
    \ get started with type of metadata.\n\n# Metadata Mapping: Type of Metadata\n\
    \nIn Chapter 8 , I defined three different types of metadata for the Metadata\
    \ Mapping pattern [Fowler PoEAA]:\n\n+   - XML document(s) or other document formats\n\
    +   - Attributes\n+   - Source code\n\nThis category was simple regarding NHibernate\
    \ because its metadata is typically XML documents. You can describe the metadata\
    \ in source code as well in the works, but that's not the mainstream thing to\
    \ do at all.\n\nThere are attribute-based approaches as well, but they generate\
    \ metadata as XML documents.\n\n# Identity Field\n\nI have already touched on\
    \ the matter of how you deal with Identity Fields in NHibernate, but I'd like\
    \ to go a little deeper. Earlier I showed how to map an Identity Field that is\
    \ of the Guid type. Let's take a look at the Product Entity, which has an int\
    \ for the Identity Field, and the value is generated with an IDENTITY (auto incrementing\
    \ column) in the database. It could then look like this:\n\n```\n<id name=\"Id\"\
    \ access=\"field.camelcase-underscore\"\nunsaved-value=\"0\" >\n    <generator\
    \ class=\"identity\" />\n</id>\n```\n\nAs I said in Chapter 8 , when it comes\
    \ to new entities, the values for Identity Fields can be generated in at least\
    \ four different layers:\n\n+   - Consumer\n+   - Domain Model\n+   - Database"
  merge: -1
