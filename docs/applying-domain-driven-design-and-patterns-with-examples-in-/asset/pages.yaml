- pgno: 363
  md: 'placing the Identities in the Map to support future Load() calls from the Identity
    Map.


    If you''d like to force an instance away from the Identity Map, you can call Evict()
    on the ISession , or Clear() to clear the Identity Map from all instances, or
    of course Close() the ISession .


    # Unit of Work


    It probably won''t come as a surprise to learn that NHibernate uses the Unit of
    Work pattern [Fowler PoEAA] as well, and again it''s dealt with in the ISession
    . That said, the implementation is pretty different from the most typical one.
    Instead of registering what has happened with the Unit of Work, NHibernate takes
    a snapshot of the instances when they are read from the database. At flush time,
    the instances known by ISession are compared to the snapshots to create a Unit
    of Work at that point in time.


    To be clear, in a way deletes are registered and so are notifications of new instances
    with, for example, SaveOrUpdate() .


    As always, there are pros and cons to this solution, and one obvious drawback
    is when there are many instances to investigate, only to find that just one should
    be flushed. That''s one reason for why Hibernate (that''s right, Hibernate, not
    N Hibernate, at least not at the time of this writing) 3 has been changed regarding
    this.


    # Lazy Load/Eager Load


    If you do want to use (automatic) Lazy Load [Fowler PoEAA] with NHibernate, that''s
    easily done. You just declare it in the metadata like this, for example:


    ```

    <bag name="OrderLines" access="field.camelcase-underscore" cascade="all" lazy="true">

    <key column="OrderId" />

    <one-to-many class="OrderLine" />

    </bag>

    ```


    Now the OrderLines of an Order are lazily loaded when the OrderLines are needed
    for the first time. In order for this to work, however, you must have a connected
    ISession .


    If you don''t use the lazy="true" declaration in the metadata, you will effectively
    get Eager Load instead. NHibernate supports several different approaches for Eager
    Load, such as OUTER JOIN and several SELECT statements batched after each other.


    What might be important is that when you do Eager Load with several SELECT statements,
    you might get read inconsistency (which might be a bigger problem in the case
    of Lazy Load) in this case, too. This can be avoided with explicit transaction
    control and by increasing the Transaction Isolation Level to serializable [Nilsson
    NED], but it''s rarely a serious problem, so I won''t go into details here.


    You can also control in code whether you want Eager/Lazy Load. That''s something
    you can do when you use querying, but we are satisfied with the discussion about
    querying we''ve had already in this chapter.'
