  md: "referred to as the *Presentation Model* (PM).\n\nThe Presentation Model objects\
    \ are a part of the PL and should have a structure and behavior\nmatching the\
    \ requirements of the PL (in effect, matching the needs of the UI). In our example,\
    \ the\nPM Person class would have a FullName property rather than FirstName and\
    \ LastName properties\nfound in the Domain Model Person class.\n\nWhy not just\
    \ put the GetFullName() method in the Domain Model Person class? We could, if\
    \ it had\na use in some business logic operation, but if the only use of the GetFullName()\
    \ method is in the\nPL, the method should go in the PM and not in the Domain Model.\n\
    \nKeeping your Domain Model free of non-business aspects, such as presentation\
    \ and persistence, is\nevery bit as important as it was to keep the Business Logic\
    \ Layer of yesteryear free of Presentation\nlogic and Data Access logic, and for\
    \ just the same reason: Keeping the Domain Model free from any\nnon-business aspects\
    \ is key to keeping the \"heart\" of your application understandable and\nmaintainable.\n\
    \nSo for this example, assume that GetFullName() is only used in presentation\
    \ and is thus a good\ncandidate for a method that should go on a PM rather than\
    \ on the Domain Model.\n\nThe question becomes how we can connect the PM classes\
    \ to the Domain Model classes, and thus\nwe arrive at the choice: *Mapping* or\
    \ *Wrapping*?\n\n# Wrapping the Domain Model with the Presentation Model\n\nWrapping\
    \ is often the easier solution, requiring no additional framework for state management\
    \ in\nthe PM. The idea here is that you pass the DM Employee object to the constructor\
    \ method of the PM\nEmployee object. The PM Employee then keeps an internal reference\
    \ to the DM object and delegates\nall calls to the DM properties. See the following\
    \ code listing.\n\n```\n```csharp\n//Presentation Model wrapper object\nnamespace\
