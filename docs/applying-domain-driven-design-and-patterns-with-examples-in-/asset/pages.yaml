- pgno: 92
  md: '# Domain Patterns


    Domain Patterns have a very different focus from the Design Patterns and the Architectural
    Patterns. The focus is totally on how to structure the Domain Model itself, how
    to encapsulate the domain knowledge in the model, and how to apply the ubiquitous
    language and not let the infrastructure distract away from the important parts.


    There is some overlap with Design Patterns, such as the Design Pattern called
    Strategy, [GoF Design Patterns] which is considered to be a Domain Pattern as
    well. The reason for the overlap is that patterns such as Strategy are very good
    tools for structuring the Domain Model.


    As Design Patterns, they are technical and general. As Domain Patterns, they focus
    on the very core of the Domain Model. They are about making the Domain Model clearer,
    more expressive, and purposeful, as well as letting the knowledge gained of the
    domain be apparent in the Domain Model.


    When I ended the previous section, I mentioned that the Specification pattern
    as a Domain Pattern is an alternative to Query Objects pattern. I think that''s
    a good way of explaining how I see what Domain Patterns are. Query Objects is
    a technical pattern where the consumer can define a query with a syntax based
    on objects, for finding more or less any of the objects in the Domain Model. The
    Specification pattern can be used for querying as well, but instead of using a
    generic query object and setting criteria, one by one, a specification is used
    as a concept that itself encapsulates domain knowledge and communicates the purpose.


    For example, for finding the gold customers, you can use both query objects and
    specifications, but the solutions will differ. With Query Objects, you will express
    criteria about how you define gold customers. With a Specification, you will have
    a class that is perhaps called `GoldCustomerSpecification`. The criteria itself
    isn''t revealed or duplicated in that case, but encapsulated in that class with
    a well-describing name.


    One source of Domain Patterns is [Arlow/Neustadt Archetype Patterns], but I have
    chosen a Domain Pattern-example from another good source, Eric Evans'' book Domain
    Driven Design [Evans DDD]. The chosen example pattern is called Factory.


    # Note


    Pattern-aware readers might get confused because I talk about the Domain Pattern
    Factory here and the Design Patterns book [GoF Design Patterns] also has some
    Factory patterns. Again, the focus of Design Patterns is more on a technical level
    and the focus of Domain Patterns is on a semantic Domain Model level.


    They are also different regarding the detailed intents and typical implementations.
    The Factory patterns of GoF are called Factory Method and Abstract Factory. Factory
    Method is about deferring instantiation of the "right" class to subclasses. Abstract
    Factory is about creating families of dependent objects.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The Factory pattern of DDD is straightforward implementation-wise and is only
    about capturing and encapsulating the creation concept for certain classes.


    # An Example: Factory


    Who said that the software industry is influenced by industrialism? It''s debatable
    whether it''s good, but it is influenced. We talk about engineering as a good
    principle of software development; we talk about architecture, product lines and
    so on and so forth. Here is another such influence, the Factory pattern. But first,
    let''s state the problem that goes with this example.


    # Problem


    The problem this time is that the construction of an order is complex. It needs
    to be done in two very different flavors. The first is when a new order is created
    that is unknown to the database. The second is when the consumer asks for an old
    order to be materialized into the Domain Model from the database. In both cases,
    there needs to be an order instance created, but the similarity ends there as
    far as the construction goes.


    Another part of the problem is that an order should always have a customer; otherwise,
    creating the order just doesn''t make sense. Yet another part of the problem is
    that we need to be able to create new credit orders and repeated orders.


    # Solution Proposal One


    The simplest solution to the problem is to just use a public constructor like
    this:


    ```

    public Order()

    ```


    Then, after having called this constructor, the consumer has to set up the properties
    of the instance the way it should be to be inserted or by asking the database
    for the values. Unfortunately, this is like opening a can of worms. For example,
    we might have dirty tracking on properties, and we probably don''t want the dirty
    tracking to signal an instance that was just reconstituted from persistence as
    dirty. Another problem is how to set the identification, which is probably not
    settable at all. Reflection can solve both problems (at least if the identifier
    isn''t declared as readonly), but is that something the Domain Model consumer
    developer should have to care about? I definitely don''t think so. There are some
    more esoteric solutions we could explore, but I''m sure most of you would agree
    that a typical and obvious solution would be to use parameterized constructors
    instead. Because I have spent a lot of programming time in the past a long time
    ago with VB6. I haven''t been spoiled by parameterized constructors. Can you believe
    that not having parameterized constructors? I''m actually having a hard time believing
    it myself. Anyway, in C# and Java and so on, we do have the possibility of parameterized
    constructors, and'
