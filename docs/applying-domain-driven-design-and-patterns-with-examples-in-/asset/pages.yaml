    \ grid in your application.\n\n> \"Flattened\" PM objects provide a good example\
    \ of how the PM often looks very different from the Domain Model and, of course,\
    \ the more different they are, the more motivated we are to have two separate\
    \ models instead of just adding the features needed by the PL to the Domain Model.\n\
    \n# Matters of State\n\nWhen making the choice between Mapping and Wrapping, special\
    \ attention should be paid to the difference in how state is handled in the two\
    \ approaches.\n\nWhen wrapping your Domain Model objects, only one instance of\
    \ the data is used by the application. If you have two views showing the same\
    \ employee at the same time, and you update the employee's name in one view, the\
    \ single instance of the data in the wrapped object is updated. If the second\
    \ view is then refreshed, it should display the updated data, because it is also\
    \ mapping directly to the same wrapped, updated object.\n\nWhen mapping your PM\
    \ objects to your Domain Model objects, however, you could potentially have several\
    \ different sets of PM objects representing the same Domain Model object, but\
    \ with different state in them.\n\nEven if you have an Identity Map for your PM,\
    \ you may have two different PM Employee classes that"
