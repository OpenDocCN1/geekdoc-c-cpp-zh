- pgno: 376
  md: '# An Introduction to SOA


    By Udi Dahan


    Both DDD and SOA are relatively new concepts, the first being quite well-defined,
    and the second less so. While there are those who claim that SOA has been around
    since the early CORBA days, never has there been such broad vendor and industry
    buy-in for "just an architecture."


    # So What Is SOA Anyway?


    Although a number of definitions of SOA have been proposed, no one definition
    has been declared the victor. Most definitions are based around the idea that
    systems are composed of independent services. However, what exactly constitutes
    a service is unclear. One definition of SOA that cannot be refuted is that SOA
    is a way to develop software. Specifically, SOA deals with systems or applications
    that are, or can be, distributed. The acknowledgement that distribution is a primary
    architectural issue is one of the underlying currents of SOA.


    # Why Do We Need SOA?


    Software that is meant to run in a distributed environment needs to be designed
    differently. This is a fundamental shift from distributed object thinking where
    applications would use non-local resources "transparently," with no knowledge
    of the location of these resources. The problems that arose with distributed object
    architectures were primarily found in performance. The semantics of working with
    local and remote resources need to be different, a hard-learned lesson that has
    become a litany in distributed systems development: "Chunky over chatty."


    Chunky interfaces, also known as coarse-grained interfaces, cause more work to
    be performed in a single call than fine-grained interfaces, which require multiple
    calls to perform the same amount of work. The explicit coordination and resource-locking
    that needs to take place over fine-grained interfaces is totally encapsulated
    in a single chunky call. This results in client code that is less coupled to the
    server code implementation.


    In fact, the evolution of distributed systems architecture has been punctuated
    by the introduction of new ideas and the sobering effects of reality/performance.
    Despite the fact that Moore''s law has held over the years, and apparently will
    continue to hold, the world of large-scale systems development continues to be
    preoccupied with performance. However, it is not so much performance as a static
    measure that is interesting, but rather scalability, the dynamic measure of performance
    over varying loads, that architects strive to maximize.


    SOA is the next step on the ladder of architectural evolution that will enable
    new systems to be built, and older systems to be utilized, in scalable solutions.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# How Is SOA Different?


    While current distributed systems development practices design layers and deploy
    them in physical tiers, SOA unifies these two concepts into "services," which
    are both the unit of design and deployment. The other aspect that differentiates
    SOA from current practice is the codification of communication between services;
    while there are no restrictions on how layers or tiers should communicate, services
    must communicate according to message-exchange-patterns defined by a schema. There
    is also both theoretical and practical support for using only one-way asynchronous
    messaging for inter-service communication; however, this has not yet won industry-wide
    support.


    # Note


    Note that "schema" doesn''t necessarily dictate XML, but rather the set of messages
    that flow between services.


    While XML, and SOAP by extension, are not prerequisites of SOA, the extensibility
    of XML makes the versioning of schema much easier.


    # What Is a Service?


    Besides being both the unit of design and the unit of deployment, services are
    surprisingly ill-defined for the size of the buzz surrounding SOA. Instead of
    defining what a service is, most of the literature describes properties of services.
    One such example is the four tenets of Service Orientation:


    +   - Services are autonomous

    +   - Services have explicit boundaries

    +   - Services expose schema and contract, not class or type

    +   - Service compatibility is determined based on policy


    While these properties do indeed drive the design of scalable services (and will
    be discussed in more detail later), they apparently provide little guidance on
    the design of distributed systems. Architects just beginning to employ service-oriented
    techniques to their designs have no information about which elements should be
    grouped together into services, how to recognize and define service boundaries,
    and how these services are to be implemented using classic OO patterns. On top
    of that, the technologies surrounding the "pure" architectural aspects of SOA
    continue to be in a state of flux, and the various vendor offerings appear to
    be little more than repackaging of current products. Is it any wonder that SOA
    is already being dismissed as hype?


    # What Goes in a Service?'
