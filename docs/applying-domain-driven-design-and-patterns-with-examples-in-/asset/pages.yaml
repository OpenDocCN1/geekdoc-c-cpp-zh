  md: '# Yet Another Dimension


    So far in this chapter, I have mostly talked about the logical structure of the
    Domain Model, which is just one dimension of the picture, of course. There are
    others. I''d also like to discuss different execution styles for a while. Let''s
    start with the deployment environment set up for the feature list. There, I said
    that we are creating a rich client (WinForms) application without an Application
    Server. It could look similar to Figure 4-16.


    # Figure 4-16. WinForms and no Application Server


    ![](img/89fb3513cb9b6343875aadbfd042005d_161_0.png)


    For the sake of the discussion here, let''s increase the complexity quite a bit
    for a moment and add a requirement of an application server as shown in Figure
    4-17.


    # Figure 4-17. WinForms and Application Server


    ![](img/89fb3513cb9b6343875aadbfd042005d_161_1.png)


    The first question is on what tier(s) should the Domain Model execute? Should
    it only execute on the Application Server and then you give out dumb data structures,
    Data Transfer Objects (DTO) [Fowler PoEAA] to the Consumer tier? Or should the
    Domain Model only execute on the consumer side, and you fill it by asking for
    DTOs from the Application server? Or perhaps you want the'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Domain Model to execute on both tiers? Perhaps two different Domain Models?


    # Note


    It''s important to think about the purpose of the application server, that it''s
    really needed and that you really need to distribute the Domain Model. Remember
    Fowler''s First Law of Distributed Object Design: Don''t distribute your objects!
    [Fowler PoEAA]


    Let''s assume for a second that the Domain Model should (at least) execute at
    the Application server. Should it then be a shared Domain Model instantiation,
    so that there is a single instance for representing a single customer to be used
    by all users? Or should it be one Domain Model instantiation per user or per session
    so that there are several instances representing a certain customer at a certain
    point in time?


    The third question is, should the Domain Model instantiation be stateful between
    calls, or should it go away after each call?


    Fourth, should we try to build up a complete Domain Model instantiation by fetching
    as much data as possible at each request, and never let go of instances?


    We have lots of questions and, as always, the answers depend on the situation.
    One problem with the discussion is that I haven''t (in a DDD-ish manner) decided
    too much about the infrastructure.


    Anyway, I''d like to say a few words about how I usually prefer to deal with this.


    # Note


    What I mean with the term "Domain Model instantiation" is a set of instances of
    the Domain Model instead of its classes. Of course, we are sharing the classes
    between users much more often than the instances. Yet I think this term adds clarity
    to the discussion.


    # Location of the Domain Model


    First, if I''m in control of both the consumer and the Application Server, I think
    it might be fine to expose and use the Domain Model both at the consumer and the
    Application Server. If we don''t use it at both places, there is a risk of unnecessary
    work and less power because then we might create two similar, but slightly different,
    Domain Models, one being for the consumer and one for the Application Server.
    We also need adapters that can transform between the two Domain Models. (The most
    important thing here is probably to be very aware of which situation you have
    one model or two. If you think it''s one but it''s actually two in reality, you
    will run into subtle problems.)


    It''s important to mention, for complex scenarios I''m fond of Presentation Model
    [Fowler PoEAA2] as'
