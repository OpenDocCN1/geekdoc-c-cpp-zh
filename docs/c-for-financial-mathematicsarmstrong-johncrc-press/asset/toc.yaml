  - 19.4.2. 编写一个函数来计算在 Black–Scholes 模型中具有任意到期收益 $f(S)$ 且到期时间为 $T$ 的期权价格。你的代码应通过利用公式
    (A.3) 通过积分计算期望收益来实现。
- - '######'
  - '19.4.3. 假设 $f: [a, b] \to \mathbb{R}$ 是一个连续函数，我们希望在某个位于 $f(a)$ 和 $f(b)$ 之间的值
    $y$ 处求解方程 $f(x) = y$。显然存在一个解，且该解必须位于两个子区间 $[a, (a+b)/2]$ 或 $[(a+b)/2, b]$ 之一中。根据
    $f$ 在 $(a+b)/2$ 处的值，我们可以确定需要查看这两个子区间中的哪一个来求解方程：只需选择 $y$ 位于区间端点 $f$ 值之间的那个区间。'
- - '######'
  - 19.4.4. 在 Black–Scholes 公式中，校准所有参数到市场数据很容易，除了波动率 $\sigma$。
- - '######'
  - 19.4.5. 查找 S&P 500 指数看涨期权的当前市场数据，并绘制隐含波动率随执行价格变化的曲线图。如果 Black–Scholes 模型完全准确，隐含波动率将与执行价格无关。由于
    Black–Scholes 模型做出了一些不切实际的假设，你会发现隐含波动率实际上随执行价格变化。这证明虽然 Black–Scholes 模型很有用，但它不够精确以复制实际市场价格，必须使用更复杂的模型。
