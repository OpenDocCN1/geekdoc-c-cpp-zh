    \ user logs into the identity provider, which prompts the user to confirm the\
    \ sending of information to your application. If the confirmation is successful,\
    \ the user will be redirected back to your return address to allow with the claims\
    \ requested, and provide information to stop reply attacks. Luckily, an Open Source\
    \ project exists to take care of all for you: DotNetOpenAuth, available from http://dotnetopenauth.net:8000/\n\
