- pgno: 122
  md: 'software running on a user''s machine. If this risk is a concern you can mitigate
    this by turning off cache for a page, using the OutputCache directive on a page,
    as shown here:


    ```

    ## OutputCache Location="None" VaryBy="None"

    ```


    Alternatively, you can accomplish this by adding the following code to your Page_Load
    event:


    ```

    Response.Cache.SetCacheability(HttpCacheability.NoCache);

    ```


    Always disable caching for pages that contain sensitive data.


    # ERROR HANDLING AND LOGGING


    Error messages are probably one of the most useful places to find information
    when attacking a Web application. Sending unexpected data to an application can
    cause internal errors which gives away clues about how an application works, and
    provides information about further routes of attack — all leading to the discovery
    of vulnerabilities. Errors in .NET are represented as exceptions. When an exception
    occurs, ASP.NET can expose the internal workings of your application through an
    error page, one shown in Figure 5-2.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_122_0.png)


    FIGURE 5-2: The ASP.NET application error page'
  merge: -1
  img_proc: true
- pgno: 123
  md: "# CHAPTER 5 CONTROLLING INFORMATION\n\nThis page is full of useful information\
    \ for developers and, unfortunately, for attackers. For example, you can see the\
    \ exception, the source line, a trace of your application, the version of ASP.NET\
    \ running on the Web server, and the location of the files on the disk drive hosting\
    \ the Web application. Luckily, ASP.NET, by default, only serves this error to\
    \ requests originating from local connections. Remote users will see an error\
    \ page like the one shown in Figure 5-3.\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_123_0.png)\n\
    \nFIGURE 5-3: The default remote ASP.NET application error page\n\nThe default\
    \ error page indicates to an attacker that an exception occurred (by telling the\
    \ attacker that there was an Application Error) and also indicates that the application\
    \ is an ASP.NET application. You should avoid using the default error pages because\
    \ of this.\n\nError pages are controlled by the customErrors configuration element\
    \ in web.config:\n\n```\n<system.web>\n  <customErrors mode=\"On\"\n        defaultRedirect=\"\
    ~/error.aspx\">\n  </customErrors>\n</system.web>\n```\n\nIn the previous configuration\
    \ sample, the defaultRedirectAttribute has been set to error.aspx . This configuration\
    \ means all errors get sent to error.aspx in the root of your Web application,"
  merge: -1
  img_proc: true
- pgno: 124
  md: "allowing you to present a custom error page to your users. Often, you want\
    \ to present different error pages, depending on the errors shown. For example,\
    \ the following configuration would redirect Page Not Found to notfound.aspx.\n\
    \n```\n<system.web>\n  <customErrors mode=\"On\"\n    defaultRedirect=\"/error.aspx\"\
    >\n    <error statusCode=\"404\"\n          redirect=\"/notfound.aspx\" />\n \
    \ </customErrors>\n</system.web>\n```\n\nThis is a simple approach to manage errors,\
    \ but it does have the following two downsides:\n\n+   - The Client browser is\
    \ forvard to the error page via a 302 Object Moved HTTP response code. This is\
    \ easily detected by scanning tools that will often flag this as a potential error\
    \ condition.\n- The conditions that lead to the error cannot be easily accessed,\
    \ so you have no record of what the application used, which possibly leaves errors\
    \ undiscovered.\n\nOften, developers are tempted to debug errors on a Web server\
    \ by turning on full error messages so that they can view them from their remote\
    \ locations. However, there is no way to limit the full error page to particular\
    \ machines, and switching on the full error page means anyone who causes an error\
    \ to occur will see a page like shown in Figure 5-2.\n\n> NOTE OWASP refers to\
    \ the vulnerabilities such as these as improper error handling, which is a type\
    \ of information leakage.\n\n# # Improving Your Error Handling\n\nASP.NET provides\
    \ events that you can respond to at both a page level (Page_Error) and application\
    \ level (Application_Error). By intercepting errors via the error events, you\
    \ can discover information about the error itself by accessing Server.GetLastError\
    \ (which returns the last exception thrown) and via HttpContext (extra state contained\
    \ within the page class).\n\nFollowing is an example of handling errors within\
    \ a page class, using an Error class defined elsewhere in the project to provide\
    \ logging functions:\n\n```\npublic partial class MyPage : System.Web.UI.Page\n\
    {\n  protected void Page_Error(object sender, EventArgs e)\n  {\n    // Log Errors.\n\
    \    Exception ex = Server.GetLastError();\n  }\n```"
  merge: -1
  img_proc: true
