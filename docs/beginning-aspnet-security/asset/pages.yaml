  md: "```\n<EncryptedData\n<Type=\"http://www.w3.org/2001/04/xmlenc#Element\"\n \
    \ xmlns=\"http://www.w3.org/2001/04/xmlenc#\">\n<EncryptionMethod\n  Algorithm=\"\
    http://www.w3.org/2001/04/xmlenc#aes-256-cbc\" />\n<CipherData>\n  <CipherValue>p1D/...FIT2Q==</CipherValue>\n\
    </CipherData>\n</EncryptedData>\n</envelope>\n```\n\nYou can see that the message\
    \ element has been replaced with anEncryptedData element that contains the CipherData\
    \ element, as well as information on the method used (the EncryptionMethod element).\
    \ If the receiving party shares the key and IV, this is enough information to\
    \ decrypt the data.\n\nTo decrypt the data, you would use a method like the one\
    \ shown in Listing 10-3. Remember that with symmetric algorithms, you use the\
    \ same key and IV to decrypt encrypted data.\n\n# LISTING 10: Decrypting XML using\
    \ a symmetric key\n\n```\npublic static void Decrypt(XmlDocument xmlDocument,\n\
    \  SymmetricAlgorithm algorithm)\n{\n  // Check the arguments.\n  if (xmlDocument\
    \ == null)\n    throw new ArgumentNullException(\"xmlDocument\");\n  if (algorithm\
    \ == null)\n    throw new ArgumentNullException(\"key\");\n\n  // Find the EncryptedData\
    \ element in the XmlDocument.\n  XmlElement encryptedElement =\n    xmlDocument.GetElementsByTagName(\"\
    EncryptedData\")[0] as XmlElement;\n\n  // If the EncryptedData element was not\
    \ found,\n  if (encryptedElement == null)\n    throw new XmlException(\"No encrypted\
    \ element was found.\");\n\n  // Create an EncryptedData object and populate it.\n\
    \  EncryptedData encryptedData = new EncryptedData();\n  encryptedData.LoadXml(encryptedElement);\n\
    \n  // Create a new EncryptedXml object.\n  EncryptedXml encryptedXml = new EncryptedXml(encryptedXml);\n\
    \n  // Decrypt the element using the symmetric algorithm.\n  byte[] rgbOutput\
    \ =\n    encryptedXml.DecryptData(encryptedData, algorithm);\n```"
