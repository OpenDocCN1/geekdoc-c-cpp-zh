- pgno: 414
  md: 'It is worth noting that, in addition to HTML encoding, the methods contained
    in HtmlHelpers to produce input fields will encode HTML and attributes for you.
    Of course, you can use the AntXSS project at http://antixss.codplex.com, although
    the Security Runtime Engine will not work. Your Views and Controllers are still
    protected by ASP.NET request validation. So, by default, your requesting & dangerous
    combinations will cause an exception to be thrown. With Web Forms, you should
    never disable this on an application, but instead choose to loosen the restrictions
    on a page-by-page basis once you are sure that you have encoded every possible
    output.


    # Protecting an MVC Application Against CSRF


    Because ASP.NET MVC has left ViewState and the page lifecycle behind, ViewState
    user keys nor the AntiCSR approach will work in protecting your application against
    CSRF. The MVC framework provides an HTML helper to generate a token. You can generate
    a token in your form by the following:


    ```

    <form action="/update/" method="post">

    @Html.AntiforgeryToken()

    </form>

    ```


    Html.AntiforgeryToken outputs an encrypted value in a hidden input field, such
    as the one shown (which has been shown for readability) and provides a matching
    HTTP-only session cookie:


    ```

    <input name="__RequestVerificationToken" type="hidden" value="J..." />

    ```


    Of course, token validation is pretty useless. The validation functionality is
    provided by an ActionFilter, which you must specifically apply to the action methods
    in your controller, as follows:


    ```

    [ValidateAntiforgeryToken]

    public ActionResult Update(...)

    ```


    Because forgery is only applicable POST requests, the rule of thumb discussed
    in Chapter 4 (that GET requests should never change state) still applies.


    TheAntiforgeryToken methods also allow an optional salt value This salt value
    should be an application-wide, constant, enabling you to limit the anti-forgery
    token to your application — which provides token isolation for applications running
    on the same host.


    Underneath the token is turned into a string value using the state serialization
    functions from the ASP.NET page so encryption is controlled in the same way as
    ViewState encryption (via the machine key). If you are hosting the same application
    over multiple servers in a load-balanced environment, then your machine key must
    match. (See Chapter 5 for instructions on how to generate and set a machine key.)


    # Securing Model Binding


    ASP.NET MVC provides scaffolding for common actions (such as displaying model
    details, editing an item, and adding a new one), along with binding functionality
    to provide an easy way to change model items. Consider a bulletin board where
    a post is represented as a BoardPost class,'
