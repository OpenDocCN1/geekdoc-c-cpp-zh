    \ run=\"server\"\n  ErrorMessage=\"Your web site address does not appear to be\
    \ valid.\" Text=\"***\"\n  ValidationExpression=\"http(s)?\\//[\\w-]+\\/[\\w-]+\\\
    .\\\\\\w%&]*\"\n  ControlToValidate=\"website\" />\n<br /><Comment>\n<asp:RequiredValidator\
    \ ID=\"commentRequired\" run=\"server\"\n  ErrorMessage=\"You must enter a comment\"\
    \ ControlToValidate=\"comment\"\n  Display=\"Dynamic\" Text=\"* />\n<br /><asp:TextBox\
    \ ID=\"comment\" run=\"server\" Columns=\"50\" Rows=\"5\" /> <br />\n<asp:Button\
    \ ID=\"submit\" Text=\"Submit\"\n  OnClick=\"submit_OnClick\"/>\n</form>\n```\n\
    \n> If you have a button on your ASP.NET page, you may not have a click handler\
    \ for the button. It's not necessary. However, if you don't have a click handler,\
    \ ASP.NET validation does not happen automatically, and when you check the validation\
    \ status using Page.IsValid(), then an exception will be thrown in some versions\
    \ of ASP.NET. If you don't want to add an event handler, then you can manually\
    \ perform validation by calling Page.Validate() before you check Page.IsValid().\n\
    \n# ASP.NET Validation Controls\n\nASP.NET provides six validation controls:\n\
    \n+   * RequiredValidator\n* RangeExpressionValidator\n* RegularExpressionValidator\n\
    * CompareValidator\n* CustomValidator\n\nEach control has some additional common\
    \ properties\n\n+   * ControlToValidate — The name of the control the validation\
    \ rule applies to.\n* EnableClientScript — When set false, no client-side validation\
    \ will occur, and checks will only happen once the page is submitted to the server."
