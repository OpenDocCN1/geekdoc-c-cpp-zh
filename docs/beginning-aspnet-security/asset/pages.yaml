- pgno: 372
  md: '# Using Log Parser to Mine IIS Log Files


    Commercial products exist to mine the data contained with IIS logs. However, Microsoft
    provides a free tool for mining logs, Log Parser, which is available from http://www.iis.net/downloads/default.aspx?tab=34&g=6&i=1287.
    It not only analyzes IIS logs, but also the file system, Windows Event log, the
    Registry, and Active Directory. (However, this section will only cover Using Log
    Parser mine IIS logs and other sources relevant to Web Applications.) It uses
    SQL-like syntax to allow you to discover and extract information from log sources,
    and can be used for forensic analysis of the activity on your Web site.


    Before using Log Parser, you should ensure that logging is enabled on your Web
    site. When configuring a Web site for the first time, you should always enable
    logging, preferably storing the log files on a separate drive from both your operating
    system and Web site. If the log files fill the drive, your Web server will stay
    up, and any path traversals your Web site may contain not expose the log files
    themselves.


    To enable and configure logging, start IIS Manager and then highlight the file
    for which you wish to configure logging. Click the Logging icon. You can change
    the directory used to store the logs by entering a path in the Directory field,
    and you can customize the information you want logged by entering the Select Fields
    button.


    Generally, you will want to select every option to log. Table 14-4 shows a description
    of each option, and what it would offer during log analysis.


    # Table 14-4: Available IIS7 Logging Options


    | NAME | DESCRIPTION | PURPOSE |

    | --- | --- | --- |

    | date | Date | Correlates events. |

    | time | Time | Correlates events and identifies rapid requests (such as those
    issued by automated scanning scripts). |

    | c-ip | Client IP Address | Identifies the user or proxy. |

    | cs-username | User Name | Identifies compromised Windows user accounts if they
    are in use for your application. |

    | s-servername | Service Name | Verifies a Web site instance if the log files
    are moved to another machine. |

    | s-computername | Server Name | Verifies a server if the log files are moved
    to another machine. |

    | s-ip | Server IP Address | Verifies a server if the log files are moved to another
    machine. |

    | s-port | Server Port | Helps to verify the port number of the request, which
    is useful if multiple applications are running on various ports. |


    continues'
  merge: -1
  img_proc: true
