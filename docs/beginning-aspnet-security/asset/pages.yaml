    \ the Page_Load event to add a CAS demand, as shown here:\n\n```\nprotected void\
    \ Page_Load(object sender, EventArgs e)\n{\n```\n\n```\nWebPermission webPermission\
    \ =\n    new WebPermission(NetworkAccess.Connect, WroxRssUrl);\n\ntry\n{\n   \
