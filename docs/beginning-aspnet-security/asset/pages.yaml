    You must course, select a certificate with which to sign. The certificate selection
    can either be placed in the application configuration using the Service Configuration
    Editor, or in code setting the ServiceCertificate property on the ClientCredentials
    property of the client class. As with the certificate the client must have access
    to the private key of the certificate to use to sign the message. Using the example
    from the beginning of this chapter, the code to select a client would look something
    like this:


    ```

    EchoServiceClient client = new EchoServiceClient();

    client.ClientCredentials.ClientCertificate.SetCertificate(

    StoreLocation.CurrentUser,

    StoreName.My,

    X509FindType.FindBySerialNumber,

    "*1234567890*\);

    ```


    By default, WCF will validate certificates by PeerOrChainTrust. This mode validates
    a signing certificate by checking that the certificate can be validated, or that
    the public portion of the signing certificate is in the Trusted people store.
    Other options include ChainTrust (which only checks the signing certificate is
    valid), Trust (which only checks is in the trusted people store), and None (which
    performs no checks at all). If you want extensibility, you can use your own custom
    validator by implementing a class based on X509CertificateValidator, where you
    could, check certificates against a SQL database.


    If you need to access the signing certificate without your service instance (for
    example, to record who signed the message), use the AuthorizationContext. This
    class is in the System .IdentityModel assembly, under the System.IdentityModel.Policy
    namespace. When certificate authentication is used, the AuthorizationContext will
    contain an X509CertificateClaimSet, which, in turn, contains details of the signing
    certificate.


    The following code snippet extracts the signing certificate subject name into
    a string for further processing:


    ```

    AuthorizationContext context =

    ServiceSecurityContext.Current.AuthorizationContext;

    X509CertificateClaimSet claimSet =

    context.Claims[0] as X509CertificateClaimSet;

    if (claim != null)

    string subject = claimSet.X509Certificate.Subject;

    ```


    # LOGGING AND AUDITING IN WCF


    WCF provides very detailed logging and auditing functionality that allows a service
    to log security events such as failed logins or failed authorization. The audit
    logs can help you detect an attack (if you monitor your server''s event log),
    or help debug security-related problems. Message logging can also allow you to
    log malformed requests, or to trace incoming messages, help you analyze any problems.'
