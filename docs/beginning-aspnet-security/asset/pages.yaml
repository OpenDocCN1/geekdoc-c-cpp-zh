- pgno: 308
  md: "and after you have finished and sent a response from your code. This validation\
    \ logic can be shared across multiple Web services and multiple implementations,\
    \ reducing the code needed within an implementation for common validation scenarios.\n\
    \nTo write a Parameter Inspector, you code a class that implementsIParameterInspector\
    \ , as shown in Listing 11-8.\n\n# LISTING 18: A simple parameter inspector\n\n\
    ```\nusing System;\nusing System.ServiceModel.Dispatcher;\nusing System.ServiceModel;\n\
    \nnamespace WCFSecurity\n{\n    public class CustomParameterInspector : IParameterInspector\n\
    \    {\n        public void AfterCall(string operationName,\nobject[] outputs,\n\
    object returnValue,\nobject correlationState)\n        }\n\n        public object\
    \ BeforeCall(string operationName, object[] inputs)\n        {\n            string\
    \ echoParameter = inputs[0] as string;\n            if (echoParameter != \"Hello\
    \ WCF\")\n            {\n                throw new FaultException(\"Unexpected\
    \ parameter value\");\n            }\n            return null;\n        }\n  \
    \  }\n}\n```\n\nAs you can see, you must implement two methods,BeforeCall (which\
    \ takes place before your service method is reached) and AfterCall (which takes\
    \ place after your service method has been completed). Parameters are passed to\
    \ these functions as an array in the order they appear in your contract. You must\
    \ create one thing to apply the validator to your contract: an attribute, as shown\
    \ in Listing 11-9.\n\n# LISTING 19: A custom service behavior attribute\n\n```\n\
    using System;\nusing System.ServiceModel.Channels;\nusing System.ServiceModel.Description;\n\
    using System.ServiceModel.Dispatcher;\n```"
