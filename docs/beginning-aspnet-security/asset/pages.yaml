- pgno: 331
  md: "If you are certain that your application will not need access to the hosting\
    \ DOM, or you are embedding an unknown, third-party Silverlight application in\
    \ your page (for example, a Silverlight advertising banner), then you should disable\
    \ it. DOM access is enabled by default for pages on the same domain as the Silverlight\
    \ application. You can check if the HTML Bridge is enabled for your application\
    \ by evaluating the HtmlPage.IsEnabled property.\n\n# Exposing Silverlight Classes\
    \ and Members to the DOM\n\nSilverlight also provides the quite to let JavaScript\
    \ code call a method in your application, or expose an entire class within managed\
    \ code. This is opt-in—you must specifically decorate your classes/or members,\
