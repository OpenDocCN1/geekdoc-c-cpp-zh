  md: '# 138 | CHAPTER 6 KEEPING SECRETS — HASHING AND ENCRYPTION


    As you can see from Figure 6-4, each store has numerous compartments, three of
    which are the most commonly used:


    +   - Personal—Certificates in the Personal store have an associated private key
    for use in decrypting or signing data.


    +   - Other—Certificates in the Other store only have the public key available
    for use in encrypting data. This is generally used for email signing, and acts
    as an address book for other systems.


    +   - Trusted Root Certification Authorities—This tells the CAs from which you
    accept certificates. This comes preloaded with certificates for well-known authorities
    such as Veresign. If you create your own self-signed certificate, or request a
    certificate from an unknown CA, you may have to import the certificate into this
    store.


    When you create certificates, you should always create a backup of the certificate.
    Right-click on the certificate, select All Tasks, and choose Export. You should
    export certificates twice, once with the private key (to be stored in a secure
    backup location), and for importing on all machines that need to decrypt data
    and without the private key (for exchanging with systems that only need to encrypt
    data).


    # Encrypting Your Data


    The functionality for certificate asymmetric encryption is split into two namespaces:


    +   - System.Security.Cryptography.X509Certifications—This namespace contains
    the classes to manipulate certificates, including searching for loading a certificate.


    +   - System.Security.Cryptography.Pkcs—This namespace contains the symmetric
    encryption and signing algorithms, as well as an implementation of the standard
    messaging format for exchanging asymmetrically encrypted data—Cryptographic Message
    Syntax (CMS) and Public Key Cryptography Standards 7 (PKCS#7). You will need to
    add a reference to System.Security to your project before you can use this namespace.


    Before any encryption can take place, you must load the certificate you are going
    to use. To access a certificate, you must first access the correct Certificate
    Store (user or machine), and the container (Personal or Other People). The following
    code opens the Personal store for the current user:


    ```

    X509Store myStore = new X509Store(

    StoreName.My,

    StoreLocation.CurrentUser

    );

    mStore.Open(OpenFlags.ReadOnly);

    // Perform actions

    myStore.Close();

    ```


    You may have noticed that the StoreName does not match the name you see in the
    Certificate Store manager. The Personal store is StoreName.My; the Other People
    is StoreName.AddressBook.


    Once you have the store open, you can search for and load certificates. The best
    way to refer to a certificate is by its subject key identifier—this will be a
    unique value. If you examine the properties'
