- pgno: 119
  md: '# CHAPTER 5 CONTROLLING INFORMATION


    encryption if a control requests it, but obviously this is not recommended. Once
    ViewState is encrypted, programs such as ViewDecoder will not be able to look
    at its contents.


    To enforce ViewState encryption for an entire application, you should set the
    viewStateEncryptionMode attribute on the element in web.config, as shown here:


    ```

    pages ... viewStateEncryptionMode="Always" ... />

    ```


    You can programmatically request ViewStateEncryption on a per-page basis by calling
    Page.RegisterViewState(); within your code, or by setting the ViewStateEncryptionMode
    attribute in the page directive, as shown here:


    ```

    <@ Page Language="C#" ViewStateEncryptionMode="Always" %>

    ```


    Encrypting ViewState will increase the time it takes for a page to render, and
    respond, as affect the size of the hidden form field. Be sure to run tests to
    see if any increases are acceptable in terms of load time and bandwidth.


    # Protecting Against ViewStateOnClick Attacks


    ViewState validation ensures that no one can tamper with the contents, while optional
    ViewState encryption ensures no one can view the data. However, one vulnerability
    remains—replay attack occurs when an attacker takes a ViewState from a previous
    request and sends it at a later point, or under the context of another user.


    Often, a view-click attack can be used in the favor of Cross Site Request Forgery
    (CSRF) called a one-click attack, where a form is submitted via JavaScript to
    a vulnerable page. To do this, the attacker needs a valid ViewState that can be
    acquired by simply browsing to a page. Unfortunately, ViewState does not stop
    the attack, the form will work forever.


    In light of this attack, ASP.NET provides the ViewUserStateKey as a way to lock
    ViewState to a specific user or session. If this property is set, ASP.NET uses
    this value as part of the key for integrity checking and validation. This value
    is set to the username of a currently authenticated user, or if this is not available,
    the session identifier for the current session. This effectively locks the ViewState
    so that it cannot be used in another session or by user. Using the session identifier
    also adds an expiration time to the ViewState when the session expires. You should
    be aware of this if your forms take a long time to complete. If the session expires
    as a user is submitting the form an exception will occur, because the ViewState
    will no longer be valid.


    Because the ViewUserStateKey must be set before the ViewState is created (or loaded)
    and parsed, it must be set early in the page lifecycle, within the Init event.
    Generally, you will want to apply a ViewUserState across every single page. There
    are several possible approaches, responding to the PreRequestHandlerExecute event
    global.asax, or by using a custom base class for all your pages. The author’s
    personal preference is to respond to the event in global.asax, as shown in Listing
    5-2.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# LISTING 2: Setting a ViewState User Key in global.asax\n\n```\n%%@ Application\
    \ Language=\"C#\" %>\n<script runat=\"server\">\n\nvoid Application_PreRequestRequestHandlerExecute(\n\
    \    (object sender, EventArgs args)\n{\n    HttpContext context = HttpContext.Current;\n\
    \    // Check we we are actually in a webforms page.\n    Page page = context.Handler\
    \ as Page;\n    if (page == null)\n    {\n        // Use the authenticated user\
    \ if one is available,\n        // so the user key does not expire over\n    \
    \    // application recycles.\n        if (context.Request.IsAuthenticated)\n\
    \        {\n            page.ViewStateUserKey = context.User.Identity.Name;\n\
    \        }\n        else\n        {\n            page.ViewStateUserKey = context.Session.SessionID;\n\
    \        }\n    }\n}\n</script>\n```\n\nThis approach has the advantage of not\
    \ needing to remember the base class for every page, and not having to remember\
    \ change it. If you prefer to use a custom pass class, you can use the OnInit\
    \ event of the page lifecycle, as shown in Listing 5-3.\n\n# LISTING 5: Setting\
    \ a ViewState User Key in a Base Class\n\n```\nusing System;\nusing System.Web.UI;\n\
    \npublic class ProtectedViewStatePage : Page\n{\n    protected override void OnInit(EventArgs\
    \ args)\n    {\n        if (Request.IsAuthenticated)\n        {\n            ViewStateUserKey\
    \ = User.Identity.Name;\n        }\n        else\n        {\n            ViewStateUserKey\
    \ = Session.SessionID;\n        }\n    }\n}\n```\n\ncontinues"
