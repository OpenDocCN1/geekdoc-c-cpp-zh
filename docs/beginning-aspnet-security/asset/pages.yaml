- pgno: 121
  md: "# LISTING 5-3 (continued)\n\n```\nbase.OnInit(e);\n}\n\n```\n\nYou should then\
    \ change the pages you inherit from the new base class you created. If you do\
    \ not use code behind, then you can set the base class application-wide by using\
    \ the <pages> element in web.config, as shown here:\n\n```\nsystem.web>\n  pages\
    \ baseStateType=\"ProtectedViewStatePage\">\n</pages>\n</system.web>\n```\n\n\
    # Removing View from the Client Page\n\nAnother mechanism to protect ViewState\
    \ is to remove it altogether from the client page. ASP.NET2.0 introduced the PageStatePersister\
    \ to accomplish this. By default, pages use HiddenFieldPageStatePersister, which\
    \ stores ViewState in a hidden field in the HTML page. However, ASP.NET also uses\
    \ SessionPageStatePersister, which places ViewState within session. To switch\
    \ to the persistence mechanism that a page uses, you override the PageStatePersister\
    \ property on a page, as shown here:\n\n```\nprotected override PageStatePersister\
    \ PageState {\n  get {\n    return new SessionPageStatePersister(this);\n  }\n\
    }\n```\n\nIf you add this property declaration to your page, you may wonder why\
    \ the ViewState hidden field still appears in your HTML page. If you use the ViewDecoder\
    \ utility, you will see that the ViewState in your page no longer holds keys and\
    \ values, but rather a reference to the SessionPageStatePersister to retrieve\
    \ the values from its memory.\n\nYou can configure SessionPageStatePersister on\
    \ a per-page basis, or within a common base class for all pages. By default, SessionPageStatePersister\
    \ keeps savedViewStates for a session. If the maximum number is reached, the oldest\
    \ ModelState is discarded. This limits the number of windows that users can open\
    \ in your application. You can increase the number of ViewStates saved within\
    \ the sessionPageState configuration element. However, this obviously will affect\
    \ the available memory on your Web server.\n\n# Disabling Browser Caching\n\n\
    You should be aware of browser caching—which means that a browser may cache a\
    \ page on the local hard drive. This cached copy of a page is vulnerable to inspection\
    \ by spyware or other"
