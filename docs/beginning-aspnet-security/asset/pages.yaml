- pgno: 419
  md: "Some enterprising developers have explored alternative ways to provide validation\
    \ both within the model (XVal, available from http://xval.codlex.com), and with\
    \ the action (Validator Toolkit for ASP.NET MVC, hosted at http://mvcvalidatortool.codlex.com/).\
    \ Both of these packages are free and Open Source, and provide extra, valuable\
    \ tools for validation.\n\n# AUTHENTICATION AND AUTHORIZATION WITH ASP.NET MVC\n\
    \nASP.NET MVC uses the same underpinnings as Web Forms for authentication, supports\
    \ both Windows authentication and Forms authentication. In fact, the default MVC\
    \ site templates come with login, logout, and registration pages configured for\
    \ Forms authentication. (If you want more options, you can look at the MVC Membership\
    \ Starter kit at http://mvcmembership.codlex.com/) implementing authorization\
    \ takes a little form work.\n\n> NOTE Authentication and authorization for Web\
    \ Forms applications are covered in Chapter 7. If you haven't already read that\
    \ chapter, you should do so now, as this section assumes some familiarity with\
    \ ASP.NET authenticates.\n\n# Authorizing Actions and Controllers\n\nWith Web\
    \ Forms, authorization was a simple matter of defining the authorization rules\
    \ in the applications web.config file as follows:\n\n```\n<location path=\"admin\"\
    >\n  <system.web>\n    <authorization>\n      <allow roles=\"Administrators\"\
    \ />\n      <deny users=\"*\" />\n    </authorization>\n  </system.web>\n</location>\n\
    ```\n\nThis is fine for a file-based application, but ASP.NET isn't file-based\
    \ — URLs do not map to a file, but to a route, and maps to a Controller. If you\
    \ are careful, you can still use the old-fashioned file-based authorization approach,\
    \ but this is fraught with danger. Multiple routes can access the same account\
    \ and Controller, if you lock down a directory/file combination, another route\
    \ mapped to the action and Controller is accessed via a different URL, and then,\
    \ will not be protected. Obviously, you must authorize differently. This is achieved\
    \ by the [Authorize] attribute.\n\nThe Authorize attribute is applied to Controllers\
    \ or actions within them. For example, if an entire Controller was limited to\
    \ only authenticated users, then you could apply the attribute to the Controller,\
    \ as shown here:\n\n```\n[Authorize]\nPublic class MembersOnlyController : Controller\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 420
  md: "If you want one or more actions in a Controller protected (for example, only\
    \ allowing authenticated users to create a thread on your bulletin board), you\
    \ can apply the attribute to the individual action methods, as shown here:\n\n\
    ```\nPublic class BoardController : Controller {\n    ActionResult Index() {\n\
    \        ...\n    }\n\\    [Authorize]\n    ActionResult Create() {\n        ...\n\
    \    }\n}\n```\n\nLike web.config authorization, you can also authorize by roles\
    \ and/or usernames, specifying multiple usernames or roles as a comma-separated\
    \ list. You can also combine both role and username authorization, as shown here:\n\
    \n```\n[Authorize(Roles=\"Administrators\")\nActionResult Moderate()\n{}\n```\n\
    \n```\n[Authorize(Roles=\"olivers, steveharman\")\nActionResult Nuke()\n{}\n```\n\
    \n# Protecting Public Controller Methods\n\nOccasionally, your Controller may\
    \ have publicly accessible methods. But, by default, the ActionInv (which calls\
    \ the method on your Controller that was specified in your routing configuration)\
    \ will allow access to all public methods. In this situation, you can opt methods\
    \ on your Controller by using the [NonAction] attribute, as shown here:\n\n```\n\
    [NonAction]\npublic KeySet GetEncryptionKeys()\n```\n\nRemember, any methods in\
    \ your Controller are Web accessible. Either keep your methods private, or, if\
    \ necessity makes them public, decorate them with [NonAction].\n\n# Discovering\
    \ the Current User\n\nAs Web Forms, the current user is accessed through the User\
    \ property of the request context. You can access this in your Views and Controllers\
    \ using the User property. For example, a View could show or hide information\
    \ based on a user's authentication status like:"
  merge: -1
  img_proc: true
- pgno: 421
  md: "```\n<% if User.Identity.IsAuthenticated %>\n<p><%= User.Identity.Name %></p>\n\
    <% end %>\n```\n\n```\npublic ActionResult Edit(int id)\n{\n    BoardPost post\
    \ = boardRepository.Get(id);\n    if (BoardPost.Owner != User.Identity.Name)\n\
    \    {\n        return View(\"BadOwner\");\n    }\n\n    Return View(post);\n\
    }\n```\n\nA model could use a user's identity in its actions, as shown here:\n\
    \nBe aware that embedding calls to the User instance and, indeed, anything that\
    \ relies on the current HttpContext, makes testing your controller more difficult.\
    \ Instead, you can use an ActionFilter to access the context and add the username\
    \ as a parameter to your action, which will reduce the need to mock an HttpContext\
    \ (a challenge in the best of times). Listing 16-2 shows the code for such a filter,\
    \ and an example of its use.\n\n# LISTING 16: Parameterizing user information\
    \ with an ActionFilter\n\n```\n[Authorize]\n[UserName]\npublic ActionResult Edit(string\
    \ userName, int id)\n{\n}\npublic class UserNameFilter : ActionFilterAttribute\n\
    {\n    const string userName = \"userName\";\n    public override void OnActionExecuting(ActionExecuting\
    \ filterContext)\n    {\n        if (filterContext.HttpContext.ActionParameters.ContainsKey(userName))\n\
    \            if (filterContext.HttpContext.User.Identity.IsAuthenticated)\n  \
    \              filterContext.ActionParameters[userName] = filterContext.HttpContext.User.Identity.Name;\n\
    \    }\nn\n```\n\n# Customizing Authorization with an Authorization Filter\n\n\
    When a user performs an action you may wish to perform extra authorization checks,\
    \ such as limiting edits to a particular IP address. These sorts of checks cannot\
    \ be expressed using the Authorize attribute, and it is tempting to embed the\
    \ logic in your action methods. However, authorization is a cross-cutting concern.\
    \ The code to authorize can be applied in"
  merge: -1
  img_proc: true
- pgno: 422
  md: "many places, and really does not belong in the action methods themselves. ASP.NET\
    \ filters provide you with the capability to implement cross-cutting concerns.\n\
    \nASP.NET MVC provides three filters as standard:\n\n+   - Authorize—As you have\
    \ seen, this limits access to a Controller or Controller action.\n- HandleError—This\
    \ allows you to implement code that runs when an exception is thrown from an action.\n\
    - OutputCache—This is used to provide output caching in more detail.\n\nWriting\
    \ authorization filters is not a task to be undertaken lightly. If you examine\
    \ the ASP.NET MVC source code, and look at the AuthorizeAttribute class, you will\
    \ see how difficult it is to make an authorization filter work properly with caching.\
    \ The lack of a base class for an authorization filter was a design decision made\
    \ by the MVC development team to underscore this fact.\n\nHowever, there may be\
    \ times when you wish to implement your own authorization filter. The following\
    \ code is a simple example of an authorization filter, which stops an action if\
    \ the day of the week is Sunday:\n\n```\n[AttributeUsage(AttributeTargets.Class\
    \ | AttributeTargets.Method, Inherited=true, AllowMultiple=false)]\npublic class\
    \ NoSundayAccessAttribute : FilterAttribute, IAuthorizationFilter\n{\n    public\
    \ void OnAuthorization(AuthorizationContext filterContext)\n    {\n        if\
    \ (DateTime.Now.DayOfWeek == DayOfWeek.Sunday)\n        {\n            filterContext.Result\
    \ = new ContentResult(\n                Content = \"It's Sunday, get some rest\"\
    \n            );\n        }\n    }\n}\n```\n\nSetting the Result on AuthorizationContext\
    \ stops the execution of any remaining action filters, and execution jumps to\
    \ ExecuteResult on the result you set within the filter. If you apply the [NoSundayAccess]\
    \ attribute to an action and attempt to access it, you will see that, if it's\
    \ Sunday, a message appears telling you to get some rest.\n\n# ERROR HANDLING\
    \ WITH ASP.NET MVC\n\nIn an ideal world, your exception will never occur. But\
    \ for safety's sake, you should assume that, at some point, an exception will\
    \ occur that you don't catch, and the usual ASP.NET process begins. Obviously,\
    \ you will need to log errors when they reveal attack attempts. There are two\
    \ ways to do this: the OnException method in Controller, and implementing an exception\
    \ filter.\n\nController.OnError is called when any unhandled exception is thrown\
    \ from an action. To use it, simply override the method in your controller like\
    \ so:"
  merge: -1
  img_proc: true
- pgno: 423
  md: "```\nprotected override void OnException(ExceptionContext filterContext)\n\
    {\n    // Log the error somehow then continue\n    // Mark the error as handled\
    \ and switch execution to the error view\n    filterContext.ExceptionHandled =\
    \ true;\n    this.View(\"Error\").ExecuteResult(\n        filterContext.Controller.ControllerContext,\
    \ users);\n}\n```\n\nIf you forget to mark the exception as handled, your users\
    \ will see the novel ASP.NET error page.\n\nOne drawback of usingController.OnError\
    \ is that the code to handle the exception (via logging or any other method) is\
    \ in your Controller. But handling exceptions is not another example of an orthogonal\
    \ concern that should belong to all Controllers.\n\nAs before, with authorization,\
    \ ASP.NET MVC provides you with a filter, IExceptionFilter, to handle errors.\
    \ A HandleError attribute is also provided, which allows you to nominate a view\
    \ to display a particular exception occur. For example, the following code will\
    \ load the CustomError view when the productId is empty:\n\n```\n[HandleError(ExceptionType=typeof(ArgumentException),\
    \ View=\"Argument\"]\npublic ActionResult ProductListing(string id)\n{\n    if\
    \ (String.IsNullOrEmpty(id))\n        throw new ArgumentNullException(\"id\");\n\
    \    return View();\n}\n```\n\nIf a null or empty string is passed to this action,\
    \ an ArgumentNullException is thrown. Because ArgumentNullException derives from\
    \ ArgumentException, it will be handled by the exception filter.\n\nIt is possible\
    \ to have multiple HandleError attributes on an action, which allows for finer\
    \ granularity in your error handling. When you add multiple exception filters,\
    \ you should specify the order in which they are evaluated, the most specific\
    \ types first. For example, consider the following snippet:\n\n```\n[HandleError(Order=1,\n\
    \    ExceptionType=typeof(ArgumentNullException),\n    View=\"MissingArgumentError\"\
    )\n[HandleError(Order=2,\n    ExceptionType=typeof(ArgumentException),\n    View=\"\
    ArgumentError\")\npublic ActionResult ProductListing(string id)\n{\n    if (String.IsNullOrEmpty(id))\n\
    \        throw new ArgumentNullException(\"id\");\n    return View();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 424
  md: "Here, the first filter is more specific than the second, catching the ArgumentNullException\
    \ and displaying the MissingArgumentError view. Let's say you switched the order\
    \ around like so:\n\n```\n[HandleError(Order=1,\n    ExceptionType=typeof(Exception),\n\
    \    View=\"ArgumentError\")\n[HandleError(Order=2,\n    ExceptionType=typeof(NullException),\n\
    \    View=\"MissingArgumentError\")\npublic ActionResult ProductListing(string\
    \ id)\n    if (String.IsNullOrEmpty(id))\n        throw new ArgumentNullException(\"\
    *\");\n    return View();\n}\n```\n\nHere, the error resulting from a null id\
    \ parameter would be caught by the first filter, because ArgumentNullException\
    \ derives from ArgumentException.\n\nWhen a HandleError filter handles an exception,\
    \ it creates an instance of the HandleErrorInfo class, and sets the Model property\
    \ on the view to be rendered. You can use this to access information about the\
    \ error, the name of the action that threw the exception, the name of the controller\
    \ within which the action is contained, and the exception itself: The following\
    \ snippet shows a view that accesses these properties:\n\n# CustomView\n\nController:\
    \ <%= ((HandleErrorInfo)ViewData.Model).ControllerName %>\n\nAction: <%= ((HandleErrorInfo)ViewData.Model).ActionName\
    \ %>\n\nMessage: <%= ((HandleErrorInfo)ViewData.Model).Exception.Message %>\n\n\
    Stack Trace: <%= ((HandleErrorInfo)ViewData.Model).Exception.StackTrace %>\n\n\
    Because you have the complete exception and information about where the error\
    \ originated, you can add logging code to your error pages in order to help you\
    \ track down problems, and help you watch for potential attacks."
  merge: -1
  img_proc: true
- pgno: 425
  md: '# A CHECKLIST FOR SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK


    Following is a checklist of items to consider when developing an application with
    ASP.NET MVC:


    +   - Always encode your output when adding it to your View—Encoding your output
    will protect you against XSS attacks.

    - Protect POST actions with an anti-forgery token.—An anti-forgery token will
    protect you from CSRF, but remember that it is a two-step process: add the form
    to the token and apply the `[ValidateAntiForgeryToken]` attribute to your action.

    - Secure your model binding—Whitelist the properties binding to avoid malicious
    updates by the inclusion of extra input fields.

    - Perform authorization on actions in your Controller, not based upon URLs—Authorization
    rules based on URLs may not work because you can create multiple routes to a Controller.

    - Use filters to provide common exception handling and custom authorization logic.—Placing
    common code like this in a filter allows for it to be reused across multiple Controllers
    and actions.'
  merge: -1
  img_proc: true
