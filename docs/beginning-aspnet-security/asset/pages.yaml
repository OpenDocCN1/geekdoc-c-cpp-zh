    \ file, specifying where log files should be written and enabling logging within\
    \ the system.serviceModel configuration section. If you want to use the diagnostics\
    \ tracing, you should remove any system.SecurityAudit settings — you can only\
    \ use one of them.\n\n```\n<configuration>\n...\n<system.diagnostics>\n  <sources>\n\
    \    <source name=\"System.ServiceModel.MessageLogging\" switchValue=\"Warning,\
    \ ActivityTracing\">\n      <listeners>\n        <add type=\".System.Diagnostics.DefaultTraceListener\"\
