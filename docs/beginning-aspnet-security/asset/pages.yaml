- pgno: 126
  md: 'Each of the exceptions shown in Table 5-1 should be specifically handled within
    your application-wide error handler in global.asax . Any thirdparty software you
    install may provide specialized exceptions for potential security problems. Obviously,
    these should be handled in the same way as the exceptions shown in Table 5-1.


    It is possible for unexpected exceptions to cause your entire application to crash
    if they occur outside of a page request. An example might be in a background worker
    thread, or within a garbage collector. Microsoft recommends that an HttpModule
    be used to catch these types of errors. You can find an example at http://support.microsoft.com/?id=91816.


    # Logging Errors and Monitoring Your Application


    Now that you know how to catch errors, you must implement the other half of an
    error-handling strategy: logging. Logging is not just a security strategy — it
    will enable you to discover potential problems in your application occurring.
    Logging should also be used positively, to log events like successful authentication,
    access to protected resources and so on. Logging will provide auditing of your
    application. There are several ways to log errors, with the right one depending
    on your environment. For example, if you run a large data center and monitor your
    applications via Microsoft Operations Manager, you may log via Windows Management
    Instrumentation (WMI). For a single server, you may have software that monitors
    the Windows Event Log. If you are in a hosted environment, your options may be
    limited to logging to a database or sending an email to your account manager.


    Whatever option you choose, it must be monitored, and the messages you send to
    must clearly indicate the problem. An email message sent to a monitored account
    may not require complete details of an error message, but could point to a locked
    administrator-only URL that displays a captured stack dump and other information
    you could use to replicate the error.


    > WARNING It is very important that under no circumstances you log sensitive information
    such as a user''s password or a credit card verification (CCV) code. Assume that
    your log itself may be compromised.


    # Using the Windows Event Log


    The Windows Event Log is probably the most common logging framework available
    to a Windows application, and the .NET framework provides specific classes for
    manipulating the Windows Event Log within the EventLog namespace. To write an
    to the Windows Event Log, use EventLog.WriteEntry. An entry requires an event
    source (usually the name of your application or layer), the event message, an
    application-specific number for the event, and an event type (for example, warning,
    error, or critical). The following code will write an error event to the Windows
    Event Log:'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# CHAPTER 5 CONTROLLING INFORMATION


    EventLog.WriteEntry("MyWebApplication",

    "Something bad happened",

    EventLogType.Error,

    101);


    However, if you run this code as, you will get an exception. Event sources must
    be created before they can be used. The capability to create an event source is
    limited to administrative users, and, for Vista and Windows 2008, an application
    that is User Account Control (UAC) elevated. The following code creates an event
    source in the Windows Application Event Log:


    ```

    EventLog.CreateEventSource("MyWebApplication", "Application");

    ```


    > NOTE Generally, event sources are created during an installation, creating an
    event source requires administrative access. However, because ASP.NET applications
    generally do not have installers, you may want to create a command-line application
    to create your event sources. You will need the capability to log in to the server
    desktop and run the command line application as an administrator. Once the application
    source is created, the least-privilege your application can run to the event log.


    If you have multiple event sources (for example, an event source for every assembly
    or logical layer), you can create a custom event log to contain your events by
    specifying the log name when you create a source, as shown here:


    ```

    EventLog.CreateEventSource("FrontEnd", "WroxApp");

    EventLog.CreateEventSource("BackEnd", "WroxApp");

    ```


    This code will create a custom event log "WroxApp" that contains two sources:
    "FrontEnd" and "BackEnd". The code for logging to your custom event varies slightly.
    You must first retrieve an instance of the custom event log and source, as shown
    here:


    ```

    EventLog customLog =

    new EventLog("WroxApp", ".", "FrontEnd");

    customLog.WriteEntry("Something bad happened",

    EventLogType.Error,

    101);

    ```


    This code writes an entry to the "WroxApp" event log from the "FrontEnd" event
    source.


    # Using Email to Log Events


    A common approach to logging is to email non-urgent alerts and logs to a monitored
    account. If you choose this approach, you should remember that emails may be delayed,
    and delivery is guaranteed at all. An inbox overwhelmed with events may cause
    frustration and cause the recipient to ignore messages as they arrive. The .NET
    framework contains two namespaces for email: System.Web.Mail andSystem.Net.Mail.'
