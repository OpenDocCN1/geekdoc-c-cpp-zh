- pgno: 401
  md: '# CHAPTER 15 THIRD-PARTY AUTHENTICATION


    If you are using multiple partners (some of which are not using Geneva server),
    or delivering role types using the Microsoft claim name, you can map their claims
    to roles, or indeed transform any claims by using a ClaimsAuthenticationMapper.


    This may seem overly complicated for just accepting an identity from a UI-driven
    selector. And, if you want a simple-to-use ASP.NET server control, Dominic Baier
    has written one, and made it available at http://infocardslector.codplex.com/)
    But this barely scratches the surface of Microsoft’s claims-based identity.


    Remember, Microsoft’s Claims solution consists of three parts: WIF (which you
    have just used to accept SAML and Information Cards), Windows Cardspace (the identity
    selector to select information cards and communicate with an Identity Provider),
    and the ADFS (an identity provider that uses Active Directory to authenticate
    users and deliver claims from various claim stores such as AD, SQL Server and
    others). If ADFS does not meet your needs, then you can use the WIF to write your
    own secure selector.


    Using Microsoft’s various options, you can issue your own identities and accept
    those from trusted parties, or from any compatible identity provider with ease.
    Furthermore, WIF leverages the WS-Federation standard, a WIF solution is interoperable
    with other federated identity providers. So, for example, a company that uses
    Active Directory as identity server can use Geneva to provide identity information
    to a company using IBM Tivoli Identity Manager. Furthermore, by using claims-based
    authentication and authorization, you can also access the control services Azure
    provides to authenticate with your corporate Active Directory or other identity
    provider, and future your application should you move it to Microsoft’s cloud
    offering. A step-by-step guide to WIF and Azure is available at http://code.msdn.microsoft/com/wifwafpassive.


    # # USING OPENID WITH YOUR WEB SITE


    OpenID is probably the most widespread third-party authentication method on the
    Internet today, both in terms of providers and Web sites that we accept. Major
    providers include AOL, Google, Microsoft, Veris, and Yahoo!, not to mention the
    myriad of smaller providers who sprang up before the standard OpenID takes the
    form of a unique URL, for example http://wrox.openid.example, which a user will
    enter in an OpenID login form hosted by your web site, and is identified by the
    OpenID code.


    | OpenID Login | Login | |

    |---| Example: http://your.name.myopenid.com register |

    | Remember me |


    FIGURE 15-3: An example of an OpenID login form


    When a user enters or his OpenID, the form is submitted to your site, the RP.
    Then RP accesses the Web site specified by the OpenID and looks for the OpenID
    provider information by parsing the page and extracting the open.server link.


    If the OpenID server is not your application has conversed with, your application
    must then send an associate request, which requests a shared secret between your
    application and the OpenID provider, safely exchanged via Diffie-Hellman key exchange.
    Once you have a shared secret'
