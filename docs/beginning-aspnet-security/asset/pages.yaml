  md: "The ReadXml function uses the handlers you registered earlier in the page lifecycle\
    \ to parse the token. The AuthenticateSecurityToken will validate the IssuerNameRegistry\
    \ you registered and convert it into a class that implements IClaimsPrincipal,\
    \ which, in turn, implements IPrincipal—the standard that the .NET framework treats\
    \ identity.\n\nIf you don't have an existing authentication scheme and wish to\
    \ use tokens that WIFI can understand, you can use the WIFI SDK to claim the information\
    \ and use it as a session authentication mechanism. By adding two functions, you\
    \ can enable this, as shown in Listing 15-1.\n\n# LISTING 15: Helper functions\
    \ for WIFI session authentication\n\n```\nstatic TimeSpan GetSessionLifetime(){\n\
    \    TimeSpan lifetime =\n        SessionSecurityTokenHandler.DefaultTokenLifetime;\n\
    \    if (FederatedAuthentication.ServiceConfiguration.SecurityTokenHandlers ==\
    \ null) {\n        SessionSecurityTokenHandler ssth =\n            FederatedAuthentication.ServiceConfiguration.SecurityTokenHandlers[\n\
    \                typeof(SessionSecurityToken)] as\n            SessionSecurityTokenHandler;\n\
    \        if (ssth == null) {\n            lifetime = ssth.TokenLifetime;\n   \
    \     }\n    }\n    return lifetime;\n}\n\nstatic void CreateLoginSession(IClaimsPrincipal\
    \ principal,\nSecurityToken token) {\n    WSFederationAuthenticationModule activeModule\
    \ =\n        new WSFederationAuthenticationModule();\n    activeModule.SetPrincipalAndWriteSessionToken(\n\
    \        new SessionSecurityToken(\n            principal,\n            GetSessionLifetime(),\n\
    \            token,\n            true));\n}\n```\n\nGetSessionLifetime gets the\
    \ default session lifetime, or the lifetime configured in your site configuration\
    \ file. CreateLoginSession sets the identity for the current user, and writes\
    \ a session token into a protected cookie that is sent to the browser. From that\
    \ point on, the User property in your page will be populated with an identity\
    \ derived from the original SAML token sent when the user authenticated. The identity\
    \ can also be used for role-based operations"
