    <network>

    username="mailUsername"

    password="mailPassword"

    host="mailServer.domain.example" />

    </network>

    </smtp>

    </mailSettings>

    system.net>

    ```


    To send a message, you create an instance of the Message class, create the message
    details you want to send, and then pass them to an instance of the SmtpClient
    class, as shown here:


    ```

    System.Net.Mail.MailMessage message =

    ew System.Net.Mail.MailMessage(

    "from@webapp.domain"

    "webMonitor@company.example",

    message.Subject = "Unexpected exception in +Context.Request.;

    message.Body = Server.GetLastError().ToString();

