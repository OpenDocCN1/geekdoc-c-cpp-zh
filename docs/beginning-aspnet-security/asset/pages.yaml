- pgno: 222
  md: '# More Security for SQL Server


    This connection string does not contain usernames or passwords, unlike ones that
    you may be using. Instead, it specifies trusted connections . A trusted connection
    uses the Windows authentication to connect, alleviating the need to specify a
    username and password (although you should still encrypt your connection strings
    using the techniques shown in Chapter 5).


    Using trusted connections works well when the database you are connecting to is
    on the same machine, assuming the user account you are running under has access
    to the database. However, if the database is on another machine, it may not work
    because, by default, ASP.NET runs without the context of a local account, Network
    Service (as discussed in Chapter 2). This is generally why, in hosted environments,
    you will be forced to use a connection string that specifies a username and password.
    Hosting companies tend not to use Active Directory, so an account that exists
    on the Web server does not exist on the SQL server.


    If you are not using SQL Server Express but have SQL Server on your machine, you
    must add access for the user account under which your Web site runs. To grant
    permissions to an account, you can use SQL Server Management Studio, or use the
    CREATE LOGIN command.


    To use SQL Management Studio to grant permissions, the program to connect to your
    database server, and expand the Security folder. If you expand the folder, you
    can see the current list of users. To add a new user, right-click the Login folder
    and choose the “New Login . . . item. The dialog shown in Figure 8-3 appears.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_222_0.png)


    Figure 8-3: Adding a new user in SQL Server Management Studio'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# CHAPTER 8 SECURELY ACCESSING DATABASES


    To grant access to SQL Server for a Windows account, ensure that the Windows authentication
    radio button is selected. Then click the Search button and enter the account name
    in the select box, or click the Advanced button and then Find all the available
    users and groups. Click OK and you will be returned to the “Login – New” screen.
    Select the database to you want the account to access and click OK. This user
    account will now have access to the database as a “public” SQL server. This means
    that the new account can now access SQL items (such as stored procedures, tables,
    or views) to which the public role has granted access. You may have guessed that
    if you saw Windows groups in the search results box, you can add groups to SQL.
    When you add a Windows group to SQL, members of that group will be granted access.


    If you want your ASP.NET applications to be able to connect using Trusted Connections,
    you must grant access to the account they run. By default, this is Network Service,
    but you can change this by changing the Application Pool settings. Chapter 14
    provides more information on how to configure application pools


    If you have full control of the hosting environment and want to set your SQL server
    from your Web server, you have two methods to avoid using usernames and passwords.


    +   * Place both machines in an Active Directory (AD), you can specify that IIS
    runs under a specific account on the AD, and grant appropriate permissions within
    SQL to that account.

    * Duplicate accounts in a workgroup– If you are not in an AD, you can use trusted
    connections by mirroring accounts. On both machines, create a Windows login account
    with the same name and password. (Obviously, you should use a strong password.)
    Then configure your ASP.NET process to run under that user account on the IIS
    server, and grant permissions to the mirrored local user on the SQL server. Trusted
    connections will now happen using the mirrored accounts.


    # SQL Permissions


    SQL provides a granular permission mechanism for databases and tables, much like
    Windows does for files and objects. To perform any action on a database, the connecting
    account must have permissions to do so. Table 8-1 shows the main table-based permissions
    in SQL Server.


    TABLE 8-1: SQL Server Permissions


    | PERMISSION | DESCRIPTION |

    |---|---|n| SELECT | Allows the user to read data from a table or a view. This
    permission can be applied to individual columns in a table or view. |

    | INSERT | Allows the user to insert data into a table or view. |

    | DELETE | Allows the user to delete data from a table or view. |

    | UPDATE | Allows the user to update data in a table or view. Like SELECT, it
    can also be applied to individual columns. |

    | EXECUTE | Grants permission for a user to execute a stored procedure. |'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'SQL also has the concept ofroles. By default, new user accounts belong to the
    Public role for databases that they have access. Each role has inherent permissions
    associated with it — for example, the DBA role can perform any action on a database.


    # Adding a User to a Database


    Just because a login exists, doesn''t give it access to a database. You must first
    grant an account access to the database. You can do this with the following SQL
    command:


    ```

    CREATE USER Ole FOR Login Ole;

    ```


    This command creates a user within the database it is run in — in this example,
    creating a user Ole for the login account. But this account cannot do anything
    without further work.


    # Managing SQL Permissions


    To manage SQL permissions, you can use either the SQL Server Management Studio
    or the GRANT, DENY, and REVOKE statements. Knowing and using the SQL statements
    is useful because you can include them in your stored procedure scripts, which
    should have source control.


    The following example grants the SELECT permission on the Example table to view
    the guest on my laptop, called PUCK. The full name of the Windows guest account
    on that machine is a combination of the machine name and the windows account,
    separated by a \ , (as iPUCK\Guest).


    ```

    GRANT SELECT ON Example TO PUCKGuest

    ```


    To deny the permission, you would use the following:


    ```

    DENY SELECT ON Example To Ole

    ```


    And, to revoke a previously granted permission, you would use the following:


    ```

    REVOKE SELECT ON Example To Ole

    ```


    However, if you are isolating access to your tables via stored procedures as previously
    suggested, you would not want to grant any table permissions at all. Instead,
    you would want to grant EXECUTE permissions to a stored procedure, as shown in
    the following example:


    ```

    GRANT EXECUTE ON GetLogins To Ole

    ```


    # Groups and Roles


    With all permissions, it is better to set permissions to roles, rather than individuals.
    SQL allows you to create database roles to which you can add users and grant permissions.
    You can either use SQL Management Studio to create rules, or create them in SQL,
    as shown here:


    ```

    CREATE ROLE auditors AUTHORIZATION db_owner;

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Roles must be owned by either a specific user or another role. In the previous
    example, a role called auditors is created, which is owned by the db_owner role,
    a built-in SQL role to which the database owner belongs. You can add users to
    role using the following command:


    ```

    EXEC sp_addrolemember ''auditors'', ''PhilHa''

    ```


    This would add the author PhilHa to the auditors group. You can then grant (or
    deny) rights to the group rather than individual users, as shown here:


    ```

    GRANT EXECUTE ON ReadAuditLogin TO auditors

    ```


    # Least Privilege Accounts


    It''s all tempting to give your Web application full control over the database.
    But, as you can see from the SQL injection attack demonstration, it is dangerous.
    You should give your Web application the least amount of privileges and permissions
    it needs to function.


    For example, if you are writing a reporting application, then it is unlikely your
    application will need to write data. So do not give it the ability to do so. You
    may have tables containing audit information inserted by stored procedures. It''s
    unlikely your main application would need to either read or write to those tables,
    although an administration application might need to read the audit logs. The
    more privileges you grant to an application, the more scope there is for a successful
    attack to affect the database.


    If all data access is through stored procedures or permissions, you can use the
    REVOKE permission against the underlying tables, including revoking all rights
    for the Public role so that only database administrators can access the tables
    directly.


    # Using Views


    Under some circumstances, you may need to access the underlying schema for data.
    For example, some Object Relationship Mapping tools (ORMs) do not work well with
    stored procedures, and some ad-hoc reports require direct access to the schema
    (that is, the structure of the tables themselves). A view can be used to enhance
    security in these circumstances. A view is, in essence, a virtual table. It does
    not physically exist, but is the result of a query performed over tables.


    Because a view is querybased, it can be used to restrict access to the base tables.
    The types of views can show the following:


    +   A subset of the rows of a base table


    +   A subset of the columns of a base table


    +   A subset of both rows and columns of a base table


    +   A subset of another view, or a combination of views and tables


    +   Data calculated from a base table (such as a statistical summary)


    The permissions on views are entirely separate from the permissions on an underlying
    table. If, for example, the Public role were denied all access to the employee
    table, you could create a view that'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'retrieves data from that table, grant access to the Public role, and accounts
    within that role could see the contents of the view.


    For example, the following SQL command creates an employee table:


    ```

    CREATE TABLE employee(

    EmployeeId INT NOT NULL PRIMARY KEY,

    Surname VARCHAR(30) NOT NULL,

    Firstname VARCHAR(30) NOT NULL,

    Salary MONEY NOT NULL

    )

    ```


    As you imagine, salary is sensitive data, and you would not want to allow anyone
    who has not been authorized to view this data. If you cannot use stored procedures,
    you can use views to limit access. First, grant permissions to those who are allowed
    access (the Accounting role, for example, for ad-hoc reporting) using the following
    command:


    ```

    GRANT SELECT ON employee TO Accounting

    ```


    Then you remove permissions from everyone else, as shown here:


    ```

    DENY SELECT ON employee TO Public

    ```


    However, there may be circumstances when other roles require access to part of
    the employee table. For example, the TechnicalSupport role may need to perform
    reporting. You can create a view to support this and grant access to the view:


    ```

    CREATE VIEW employeeList

    AS

    SELECT firstname, surname

    FROM employee

    GO

    ```


    ```

    GRANT SELECT ON employeeList TO TechnicalSupport

    GO

    ```


    Now any account in the TechnicalSupport role can use the view to support their
    reporting. For ORM scenarios, ORMs will manage the capability to update tables.
    Views can support UPDATE and DELETE operations, with the following restrictions:


    +   A view cannot modify more than one table. If a view is based on more than
    one table, DELETE operations will fail. If you execute an INSERT or UPDATE statement
    over the view, all columns referenced within the statement must belong to the
    same table.


    +   A view containing DISTINCT clause, a GROUP clause, or any type of calculated
    columns, cannot be updated.


    As you can see, for situations that would normally require table access, views
    can present a more secure alternative.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# SQL Express Instances


    When Microsoft designed SQL Express, one of the goals was tighter integration
    with Visual Studio. This was achieved by allowing a SQL database to be treated
    as any other file, and allowing the automatic attachment of these files to SQL
    server. This feature is known as user instances.


    The following connection string shows how user instances can be configured:


    ```

    add-name="database"

    connectionString="Server=\SQLExpress;\nAttachDbFilename=|DataDirectory|database.mdf;\nDatabase=database;\nIntegratedSecurity=True;

    UserInstance=True;

    provider=System.Data.SqlClient" /

    ```


    While this is undoubtedly useful during the development process (and you''ve used
    it in all the examples in this chapter), it presents a problem. When a database
    is loaded as an instance, it is (as you might imagine from the name) for a particular
    user. That user account then becomes the database administrator for that instance,
    bypassing any security restrictions on the tables, views, and stored procedures
    on that database. This makes it incredibly difficult to test any security measures
    you have put in place.


    If possible, instead use either the SQL Server Management Studio, or SQL Server
    Development to develop against, as this will enforce security. Microsoft has stated
    that instances for non-administrators will be dropped from a future version of
    SQL Server — another good reason to rely on it.


    # Drawbacks of the VS Built Web Server


    Another problem is when the Web server built into Visual Studio 2008 runs under
    the context of the logged-in user. This user account may have database administration
    rights during development, and, so, like user instances, you bypass all security,
    making it difficult to catch or test security controls. You should be aware of
    this, and plan to test your application hosted within IIS and running under a
    limited user account, configured to the least privileges possible.


    # Dynamic SQL Stored Procedures


    One commonly held false assumption is that stored procedures will protect you
    from SQL injection. In fact, this is not true. Certain stored procedures may build
    their SQL dynamically (for example, search procedures). For example, a search
    procedure might look something like the following:


    ```

    CREATE PROCEDURE search_orders@CustID nchar(5) = NULL,

    @shipTo nvarchar(40) = NULL AS

    DECLARE @sql nvarchar(4000)

    SELECT @sql = '' SELECT OrderID, OrderDate, Customer,ShipTo '' +

    FROM dbo.Orders WHERE 1 = 1

    IF @CustID IS NOT NULL

    SELECT @sql = @sql + '' AND LIKE LIKE '''''' + @customerID + ''''''''''

    ```'
  merge: -1
  img_proc: true
