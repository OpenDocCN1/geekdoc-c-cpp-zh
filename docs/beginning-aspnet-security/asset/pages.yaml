  md: 'same value will always result in the same hash, only a user who supplies the
    correct password will

    be able to pass the validation procedure.


    > WARNING Never store passwords in clear text. If your password store is

    compromised or stolen, then you are extremely vulnerable to fake logins and

    privacy complaints from your users, or even lawsuits in some countries.


    Hashing passwords is better than encrypting passwords. This is because, if your

    password store is compromised, it may be possible to decrypt the passwords

    and discover them. Hashing is a one-way function – generally you cannot

    discover a clear text value from its hash.


    # Salting Passwords


    However, storing passwords as hashes is not that simple. Because a hashing algorithm

    deterministic (that is, producing the same results for identical), it is possible
    to produce

    pre-calculated lists of common hashes (for example, to produce a database of hashes
    for every word

    a dictionary). The initial time to produce these lists is significant. However,
    once produced,

    lookup is simple.


    Raw hashes are also vulnerable to rainbow tables, a method of balancing the need
    for pre-computation

    of hashes and the obviously large storage necessary to keep an dictionary of hashes.
    A rainbow

    table contains values that are used to “zoom in” to the clear text value through
    multiple iterations

    through the rainbow table, rather than a simple lookup that a pre-computed hash
    dictionary offers.


    These approaches make attacks against hashes. Even without these problems, using
    a raw

    h means that two or more users with the same password would have the same password
    hash,

    representing an information.


    The standard approach to avoiding these weaknesses is known as salting. Salting
    involves the

    addition of entropy to protect the password hash by storing the combined hash
    of a salt (a random value)

    and the password. The salt does not need to be secret, and so it can be stored
    with the password

    hash. The combination of a salt password means that a dictionary of hash lookups

    have to be produced for every possible salt value, which would take both a significant
    amount of

