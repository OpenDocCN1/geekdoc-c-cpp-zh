- pgno: 245
  md: "# 218 | CHAPTER 9 USING THE FILE SYSTEM\n\nyour Web site from Google, the referring\
    \ URL would be http://google.com/. If a user embedded one of your files or images\
    \ (for example, via an img tag), then, generally, the referring URL would contain\
    \ the URL and page name where the file is embedded.\n\nThis is accessible via\
    \ the UrlReferrer property on the Request instance to access your page. The UrlReferrer\
    \ property is of the type, enabling easy access to parts of the referring URL,\
    \ as shown in the following example:\n\n```\nif (Request.UrlReferrer.Host != \"\
    mysite.example&\" \\\n    Request.UrlReferrer.Host != \"www.mysite.example\")\n\
    {\n    Response.End();\n}\nelse{\n    // Continue\n}\n```\n\nHowever, remember\
    \ that, like anything from the HttpRequest referrer is untrusted input and could\
    \ be faked by an attacker. Furthermore, some privacy software strips the referrer\
    \ from a request, and a direct access to a file with its full URL will also mean\
    \ the referrer is blank. You should always save the file if the referrer is blank.\n\
    \n# Accessing Files on a Remote System\n\n+   - Place machines in an Active Directory\
    \ (AD)—By placing both machines in an AD, you can specify that the application\
    \ pool runs as a specific account on the AD, and then grant permission to the\
    \ share and access control lists (ACLs) to the AD account.\n- Duplicate accounts\
    \ in a workgroup—If you are not in an AD, you can access remote resources by mirroring\
    \ accounts. Create a Windows login account with the same account name and password.\
    \ (Obviously, you should use a strong password.) Then configure your ASP.NET process\
    \ to run under that local user account on the IIS server, and grant share and\
    \ ACL permissions to the mirrored local user on the file server.\n\n# CREATING\
    \ FILES SAFELY\n\nIf you are serving files via a script, you may also need to\
    \ dynamically create files on the file system. If you file uploads, you create\
    \ files outside of the Web root in a directory where your application pool has\
    \ access to create files, but Web users cannot directly access them. To add permissions\
    \ to the directory where you are going to create files, right-click on the directory\
    \ and"
