    \  }\n\n    [ScriptableMember]\n    public void ChangePageText(string text)\n\
    \    {\n        Text.Text = text;\n    }\n\n    public void InternalChangePageText(string\
    \ text)\n    {\n        Text.Text = text;\n    }\n}\n```\n\nWhen registering a\
    \ scriptable type, you specify a JavaScript object name and the instance of the\
    \ type you wish to expose. To access the type and manipulate its members, your\
    \ JavaScript must find the Silverlight control, access the content property, and\
    \ then use the object name you specified when registering the instance, as shown\
    \ here:\n\n```\nfunction updateSilverlightText(id) {\n    var control = document.getElementById(\"\
    silverlightcontrol\");\n    control.content.ChangePageText(\"Hello from the DOM\"\
    );\n}\n```\n\nIn Listing 12-5, only the ChangePageText method can be called because\
    \ it is the only method decorated with the ScriptableMember attribute. In addition,\
    \ unless you register the instance of a"
