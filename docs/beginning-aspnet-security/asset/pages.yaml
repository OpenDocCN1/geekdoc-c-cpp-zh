- pgno: 258
  md: "To add the schema pointer, you must first add a reference to the XML Schema\
    \ namespace.\nThis extends the XML file to support schemas. Once you add the schema,\
    \ you will see that\nin invalid element is highlighted. If you try to change the\
    \ XML elements to vary from\nthe schema or add new invalid elements, you will\
    \ see Visual Studio highlights errors, or\nschema in Figure 10-1.\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_258_0.png)\n\
    \n# 8. Now load the XML document through a suitably configured XML reader. Change\
    \ the source code to the following:\n\n```\n<@ PageLanguage=\"C#\" ValidateRequest=\"\
