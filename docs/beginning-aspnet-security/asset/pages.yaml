  md: "# Adding Authentication inASP.NET | 63\n\n```\n<asp:CreateUserWizard ID=\"\
    CreateUserWizard1\" runat=\"server\">\n<WizardSteps>\n  <asp:CreateUserWizardStep\
    \ \n    ID=\"CreateUserWizardStep1\" runat=\"server\">\n  </asp:CreateUserWizardStep>\n\
    \  <asp:CompleteWizardStep \n    ID=\"CompleteWizardStep1\" runat=\"server\">\n\
    \  </asp:CompleteWizardStep>\n</WizardSteps>\n</asp:CreateUserWizard>\n</div>\n\
    </form>\n<body>\n</html>\n```\n\nIf you now attempt to view the default page,\
    \ you will see a dialog to create registration, like the one you used in the administration\
    \ controls. Here, you can register another user and try it out.\n\n> NOTE If you\
    \ are not prompted to log in, this indicates that you still have an authentication\
    \ cookie from a previous login that has not expired. Clear your cookies and close\
    \ your browser. This will remove the cookie and allow you to log in.\n\nThe wizard\
    \ control allows a lot of customization, far more than can be detailed here. These\
    \ include the sending of emails, extra wizard steps, and the auto-generation of\
    \ passwords (which can then be sent in emails to confirm an email address). See\
    \ the book, Professional ASP.NET 3.5 Security, Membership and Role Management\
    \ with C# and VB, by Bilal Haidar (Indianapolis: Wiley Publishing, 2008) for more\
    \ detail.\n\nOne thing to note is its functionality. ASP.NET will generate a default\
    \ email for you, but it is likely you will want to change it. The email property\
    \ is the name of a text or HTML file containing the message you wish to send.\
    \ The control automatically replaces `<UserName>` and `<Password%>` with appropriate\
    \ values before sending the email.\n\n# Examining How Users Are Stored\n\nIf you\
    \ open the database you configured for membership, you will see a large number\
    \ of tables. The main membership information is contained in the aspnet_Membership\
    \ table.\n\nIf you have allowed ASP.NET to create the database, you can double-click\
    \ the ASPNET.MDF file in your App_Data folder to open it, as shown n Figure 7-4.\
    \ Right-click on the table and choose Show Table Data. The actual username of\
    \ an account is kept in the aspnet_Users table. You can see that, in line with\
