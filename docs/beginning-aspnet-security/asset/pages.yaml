  md: '# CHAPTER 7 ADDING USNAMES AND PASSWORDS


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_189_0.png)


    FIGURING 7-3: Adding a user to the IIS Administration tool


    However, using either of the administration tools limits you to creating users
    manually, which is not a scalable solution. To allow your visitors to create their
    own accounts, you can use the CreateUserWizard control. Open your login page again
