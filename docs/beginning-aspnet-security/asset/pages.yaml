- pgno: 328
  md: '> WARNING It is important to note that the vulnerabilities that affect typical
    Web applications also affect Ajax applications. You should still HTML-encode all
    user-modifiable data displayed in the response of an Ajax application to protect
    against XSS.


    # SECURITY IN SILVERLIGHT APPLICATIONS


    Launched in 2007, Microsoft Silverlight is a framework for providing rich applications
    in the browser (although with Silverlight 3, its reach will expand to the desktop
    as well). Silverlight interfaces are designed with Extensible Application Markup
    Language (XAML). Underneath a cut-down version of the Common Language Run-time
    (CLR), the CoreCLR, which provides a subset of .NET framework.


    # Understanding the CoreCLR Security Model


    The security model for the CoreCLR is simpler than that of the .NET CLR, as shown
    in Figure 12-4. It is simpler, and safe code into the following three categories:


    +   * *Transparent code*—This is safe code. It cannot access information on the
    host computer, it cannot access sensitive resources, and it cannot escalate its
    privileges. All you write in a Silverlight application is transparent code.

    * *Critical code*—This is code which can make operating system calls, access system
    resources, and perform unsafe operations. Critical code can only be part of the
    underlying Silverlight platform—it cannot be called directly by Silverlight.

    * *Safe critical*—This acts as the gatekeeper between transparent code and critical
    code. Safe critical canonicalizes inputs to critical code, taking parameters and
    turning them into the expected, standard format. It also sanitizes output (for
    example, removing information leakages). Safe critical is the protection layer
    in the CoreCLR.


    | User Code Transparent Wants to write a file |


    The canonicalization of input ensures the safety of the CoreCLR by removing potentially
    dangerous inputs. For example, if a request to write to the file with .boot.dat
    is made, the safe critical sitting between your code and the framework will strip
    the directory information from the filename, and simply pass .boot.dat.


    The Safe critical layer also protects the CoreCLR from information leaks. For
    example, if a function returns "Permission Denied" if one user was logged in,
    or "Does not exist" in another security context, an attacker could use this information
    to discover that an assert does, in fact, the safe critical layer would only return
    "Does not exist" to transparent code.


    | WINAPI—CreateFile Critical code Create file


    FIGURE 12-4: How to call a write file follows the CoreCLR security model


    | System.IO.OpenStorageFile Safe critical Validates input then calls API |'
