    In summary, the HTML Bridge offers bidirectional communication between the hosting
    page and your Silverlight application. The hosting page can control access to
    itself by using EnableHtmlAccess access to the Silverlight object. The application
    can control access to its internals via the ScriptableType and ScriptableMethod
    attributes and the HtmlPage.Register* methods, and additionally can expose its
    internals to cross-domain access using the ExternalCallersFromCrossDomain property
    in the manifest.


    Figure 12-5 shows an example of controlling interactions between scripts and Silverlight.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_333_0.png)


    FIGURE 12-5: Controlling interactions between scripts and Silverlight


    # Accessing the Local File System


    Silverlight code is not allowed to read from, or write to, the file system, except
    under strict controls. If this were possible, it would break the security sandbox
    Silverlight offers. Your application may need to store data locally, and this
    is possible using isolated storage.


    Isolated storage, a feature introduced in the .NET framework, provides access
    to a small area of storage. Isolated storage limits the amount of space available
    to your application and stores it under a user''s profile directory. You should
    view isolated storage as the Silverlight equivalent of persistent browser cookies
    — you can store limited information in it, but you don''t know where on a hard
    drive they will reside.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Isolated storage is a great way to store user-specific information such as
    user preferences, a local action history, or as a cache to store data before it
    is submitted to a Web service. However, isolated storage is not suitable for saving
    information that should be secured (such as passwords) because isolated storage
    is not encrypted or otherwise protected unless you encrypt the file itself.


    Isolated storage is unique for every combination of users and applications. Each
    user on a computer will have a separate area of isolated storage, and every application
    that user runs will have individual storage areas. It''s important to note that
    isolated storage is not affected by the browser. Users using Internet Explorer
    and Firefox running with the same application in all will have the same isolated
    storage location in both browsers.


    Isolated storage size limits are shared between applications served from the same
    site. The initial storage limit is 1MB per site, but more can be requested from
    users — although they are free to refuse the request, delete any currently stored
    information, or disable isolated storage altogether.


    Table 12-4 shows how the application identity and identity are derived.


    | APPLICATION URL | APPLICATION IDENTITY | SITE IDENTITY |

    |---|---|----|

    | http://www.d.e/app.xap | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://WWW.D.E/app.xap | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e/app.xap?param51 | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e:80/app.xap | HTTP://WWW.D.E/ APP.XAP | HTTP://WWW.D.E |

    | http://www.d.e:8080/app.xap | HTTP://WWW.D.E:8080/ APP.XAP | HTTP://WWW.D.E:8080
    |

    | http://d.e/app.xap | HTTP://D.E/ APP.XAP | HTTP://D.E |

    | https://d.e/app.xap | HTTPS://D.E/APP.XAP | HTTPS://D.E |

    | http://www.d.e/app1.xap | HTTP://WWW.D.E/APP1.XAP | HTTP://D.E |


    For example, an application served from http://www.d.e/app.xap and http://www.d.e/app.xap
    shares the same application identity and site identity, and thus shares the same
    isolated storage area. An application served from http://www.d.e/app.xap and https://www.d.e/app.xap
    has different schemes (http) and thus has different application identities and
    site identities. So the application will receive a different isolated storage
    area. An application served from http://www.d.e/app.xap and http://www.d.e/app1.xap
    has identical site identities, but different application identities — meaning
    that they have different isolated storage areas but because the site identity
    is shared, the disk space limitation (which is applied on a site basis) is between
    both applications.


    Figure 12-6 shows how isolated storage is shared between sites and applications.'
