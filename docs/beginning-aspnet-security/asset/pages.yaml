- pgno: 282
  md: '# 11

    Sharing Data with Windows Communication Foundation


    Microsoft added the Windows Communication Foundation (WCF) in .NET 3.0. WCF was
    not only a new way of writing Web services, but also a framework that applied
    a service-oriented approach to other methods of connectivity, and brought extensions
    previously available in the Web Services Enhancement (WSE) packages (such as security,
    transactions, and reliable messaging) into the framework as first-class citizens.
    In doing so, Microsoft introduced a standards-based, interoperable service-oriented
    architecture into .NET.


    In this chapter, you will learn the following:


    +   - The differences between transport-based and message-based security

    - How to add authentication to a WCF service

    - How to add authorization to a WCF service

    - How to write a custom authenticator

    - How to return errors correctly without leaking information


    This chapter only addresses the security aspects of WCF. If you have not encountered
    or used WCF before, you should read Learning WCF, First Edition by Michelle Leroux
    Bustamante (Sebastopol, CA: O''Reilly, 2007). If you want to learn more advanced
    WCF techniques, then Professional WCF Programming: .NET Development with the Windows
    Communication Foundation by Scott Klein (Indianapolis: Wrox, 2007) is a good,
    detailed book.'
  merge: -1
  img_proc: true
- pgno: 283
  md: "# CREATING AND CONSUMING WCF SERVICES\n\nTo illustrate the use of WCF security\
    \ in this chapter, you will write a simple WCF service and the code to consume\
    \ it. Visual Studio 2008 comes with specific project types for a WCF service that\
    \ you can use to get started, and provides you with a test service, but this service\
    \ is not hosted within a Web site. Instead, you will create a new Web site and\
    \ a WCF service to it. You will then write a client application to connect to\
    \ this WCF service. The example is also found in your book's website at www.wrox.com.\n\
    \nTo start, create a new ASP.Net Web application called WCFSecurity . add a reference\
    \ to System.ServiceModel. Rightclick on the project and select \"Add New Item\"\
    \ from the context menu. From the Add New Item dialog choose WCF service and name\
    \ the new service EchoService. This will create three files in your project: IEchoService.cs,EchoService.svc,andEchoService.cs.\
    \ Edit IEchoService.cs and replace the contents of the file with the code shown\
    \ in Listing 11-1.\n\n+   LISTING 11: A sample WCF data contract — IEchoService.cs\n\
    \n```\nusing System;\n\nnamespace WCFSecurity\n{\n    [ServiceContract]\n    public\
    \ interface IEchoService\n    {\n        [OperationContract]\n        string Echo(string\
    \ message);\n    }\n}\n```\n\nNow, replace the default code in EchoService.cs\
    \ with code shown in Listing 11-2.\n\n+   LISTING 12: Implementing the Echo Service\
    \ — EchoService.cs\n\n```\nusing System;\nusing System.ServiceModel;\n\nnamespace\
    \ WCFSecurity\n{\n    public class EchoService : IEchoService\n    {\n       \
    \ public string Echo(string message)\n        {\n            return (\"You sent\
    \ * \" + message);\n        }\n    }\n}\n```\n\nRight-click on the EchoService.svc\
    \ file in Solution Explorer and choose \"Set as Start Page.\" Press F5 (or Debugging+)\
    \ Start Debugging from the menu) and you will see the information page for your\
    \ service, as shown in Figure 11-1."
