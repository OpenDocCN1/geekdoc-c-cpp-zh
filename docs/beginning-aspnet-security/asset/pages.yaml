- pgno: 60
  md: '3. ASP.NET creates a new object and re-creates the controls, using the __VIEWSTATE
    to set the objects back to where they were when the page was last sent to the
    client, and runs the page initialization event.


    4. If the __EVENTTARGET and __EVENTARGUMENT fields are set, ASP.NET uses the __VALIDATION
    field to check if the event is valid (For example, if a hacker hacked an event
    from a hidden or disabled control, an exception would occur.) ASP.NET then uses
    the __EVENTTARGET and __EVENTARGUMENT fields to decide which server-side event
    to fire, (such as calculating a new price, or retrieving information from a database).


    5. Finally, the modified page is rendered to HTML and sent to the client. The
    Page object (and its members) is released from memory. If another PostBack occurs,
    the process starts again at Step 2.


    If you are interested in the __VALIDATION and __VIEWSTATE fields, they covered
    in Chapters 4 and 5. During the life cycle, many events are fired to construct
    the page, recreate the contents from ViewState, and eventually render the page.
    If you want to see the main events in a page life cycle, you can turn on tracing
    by adding a Trace="true" to the page declaration, as shown here:


    <% Page Language="C#" Trace="true" %>


    When you tracing, debugging information is appended to every page. Figure 2-8
    shows sample event from a trace. You can see the postbacks events handled after
    a page has loaded. Never Trace on a production Web site, because it may reveal
    information to an attacker.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_60_0.png)


    FIGURE 28: Event data trace'
