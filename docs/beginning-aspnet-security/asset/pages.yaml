- pgno: 66
  md: '# # 3

    Safely Accepting User Input


    One of the most basic functions a Web site offers is the capability to accept
    input from a user. Input can arrive in various guises — controls on a form, or
    HTML links that pass parameters in the URI. There are also less visible inputs
    into your application — cookies and request headers.


    In this chapter, you will learn about the following:


    +   - How user input can be dangerous

    - How to safely accept user input

    - How to safely redirect user input on a Web page

    - How the ASP.NET validation controls work

    - How to write your own ASP.NET validation controls


    # ## DEFINING INPUT


    Inputs anything that comes into your program from the outside. This can be from
    various sources — including forms submitted by a user, data read from a database
    (or retrieved from a Web service), headers sent from the browser, or files read
    from the Web server itself. All of these types of data can be processed by your
    application, and will shape how your application acts and what it outputs.


    In the highly recommended book, *Writing Secure Code, Second Edition* (Redmond,
    Washington: Microsoft Press, 2003), authors Michael Howard and David LeBlanc state
    the problem succinctly: "All input is evil — until proved otherwise." As a developer,
    it is your job to determine if input entering your Web application is safe, or
    to either make it safe or reject the "evil" input.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# CHAPTER 3 SAFELY ACCEPTING USER INPUT


    A common concept in deciding whether input is safe a trust boundary, which can
    be thought of as a border or line drawn in your application. On one side of the
    border, data is untrusted; on the other side of the border, data can be assumed
    to be trusted. It is the job of validation and sanitation logic to allow data
    to safely move from the untrusted side of the border to the trusted side. Figure
    3-1 shows a small system and its trust boundaries.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_67_0.png)


    FIGURE 3-1: Trust boundaries and validation locations


    Howard and LeBlanc indicate, the basic rule of thumb is to trust everything. As
    you discovered in Chapter 2, it is easy to craft an HTML request demonstrating
    that any request your application receives may not come from a user or a Web browser
    as well from an External Service or data loaded from an external data source also
    should not be trusted.\With other input sources, their position inside or outside
    the trust boundary is a judgment call. For example, web.config is generally within
    the trust boundary. However, if the capability to upload files to the web server
    is available to external sources, even accidentally, then a risk exists that the
    web.config or other files may be changed without your knowledge. Even if you can
    trust an input source, can you be completely sure that data entered into your
    system is valid? Malformed or'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Echoing User Input Safely


    Cross Scripting (XSS) allows an attacker to alter a Web page on a vulnerable Web
    site because of the way a Web site displays user-supplied data. While this may
    not sound problematic, it can be prone to numerous illegitimate uses, including
    the following:


    +   - Installation/exploitation of browser add-ins—An attacker could insert an
    <object> tag into a page that contains an ActiveX Control, Flash, Java, or any
    other add-in controlled in this manner, and exploit a vulnerability in the add-in
