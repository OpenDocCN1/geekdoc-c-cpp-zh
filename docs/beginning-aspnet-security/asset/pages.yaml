- pgno: 114
  md: '# Controlling Information


    Once your application has accepted data from the user (even if it is only a display
    page), your application must generate output. You have already seen how to validate
    request to input, and how to sanitize it for output. However, there are unexpected
    ways that sensitive information about your application can be leaked.


    In this chapter, you will learn about the following:


    +   - How information can be leaked with ViewState

    - How to secure and encrypt with ViewState

    - Strategies and approaches for error logging

    - Strategies and approaches for securing sessions

    - Other ways information can become exposed


    # CONTROLLING VIEWSTATE


    One of the defining features of ASP.NET Web forms is the event model, which turns
    actions (such as clicking a button, or changing the selected item in a list) into
    server-side events, an approach that matches Windows Forms programming. To support
    this model, Microsoft introduced ViewState, a mechanism whereby pages maintain
    their state over multiple client requests and responses. When a property is set
    on a control, the control can save the property value into its control''s state.
    Each control''s state is added into the ViewState for a page, which is sent by
    the server and returned by the client as a hidden field such as:


    ```

    <input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="WEPDUWMTcwMz5nQYMYGYQAUeX19Db250cmsc9J1ccVpQbb3N0Qg9uMja0f0leV9FFgL2n0dBAWJlHaW5BQgGfJI2UhhbvrR1cRFZG0b3IkQ29tbWudfJf2g1VnQ0Qg9uBS9jDGww
    />

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 8 CHAPTER 5 CONTROLLING INFORMATION


    MCRNWYWlU0Qh2YVib2b2XkXRWqRAHJYSWRpB0JHRvbGUY3R9ENWbW1NSYWRpB0JHRvbGUY3RMDAKTAWRFpbBes

    HYN1SG9ZGJJYVEkaKrcRIHJ1YSWRpB0JHRvbGUY3RMDAKTAWRFpbBe1YWN1SG9ZGJJYVEkaKrcIRCB2R5GVGVd4

    


    ViewState has advantages and disadvantages. As these are loaded to a page, ViewState
    grows and can callidotes to a page size, affecting the speed at which a page is
    loaded and returned to a client. However, without it, ASP.NET cannot support its
    event-driven programming model, and controls would lose their properties when
    a page is reloaded. ViewState is a property bag. You can use it to store whatever
    you passed around every request by accessing the ViewState property in the Page
    class, as shown in the following example


    ```

    ViewState["MyExample"] = "xrowc;

    ```


    Looking at thisViewState example, you might think that the data is encrypted but
    it is not. In the previous example, the ViewState value is Base64-encoded. Base64
    encoding takes binary data and translates it into a text-based representation
    in base 64 — 64 characters was the maximum subset that most character set shared
    and were printable. This combination leaves a Base64 encoding data stream unlikely
    to be modified altered in transit through legacy systems such as each.


    You can perceive it as translating from one representation to another, or like
    taking a word in English and translating it into French. If someone who does not
    know French sees it as translated (or encoded) text, he or she may assume that
    it is meaningless, or gibberish. However, someone who knows both English and French
    will be able to use the translation and decode the version into English.


    Encryption works by default. It takes values and locks them using a key that only
    key holders can open. While it may be possible for observers to know what type
    of lock is used, the encrypted data cannot be decoded by any other application
    that understands without the key in their position.


    BecauseViewState is only encoded by default, Fritz Onion (one of the founders
    of Pluralsight, an organization delivering technical content and training, and
    a frequent contributor to ASP.NET conferences and MSDN magazine) has written such
    a utility, called ViewState Decoder (Figure 5-1). It is available from http://www.pluralsight.com/community/media/p/51688.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Controlling ViewState


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_116_0.png)


    FIGURE 5-1: ViewState Decoder


    As you can see from Figure 5-1, ViewState Decoder makes it simple to take a ViewState
    field from a Web page and decode the values that are stored inside. If you are
    using ViewState to store sensitive information in your application, an attacker
    could use this tool to find sensitive data inside.


    > NOTE The Open Web Security Application Project (OWASP) refers to the vulnerabilities
    in this chapter as information leakage. Applications can unintentionally expose
    information that an attacker can use to learn about the internals of an application.


    # Validating ViewState


    If you know ViewState is encoded, you may assume that you can create a completely
    fake ViewState value and submit it to an ASP.NET page. This would enable you to
    add, change, or delete values stored within the page. This kind of modification
    could potentially allow an attacker to take over the behavior of controls in the
    server-side code.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "# CHAPTER 5 CONTROLLING INFORMATION\n\nHowever, despite ASP.NET after it is\
    \ created, it cannot be changed. It does this by hashing the ViewState values,\
    \ and creating a unique value from the contents of the ViewState. This hash is\
    \ encrypted with a key that is stored on the server, and then the encrypted hash\
    \ is placed into the ViewState.(Hashing and encryption are explained in more detail\
    \ in Chapter 6.) During postback, ASP.NET uses the ViewState by decrypting the\
    \ embedded hash and recomputes the hash value based on the ViewState contents.\
    \ If the hashes do not match, the ViewState must have been tampered with, and\
    \ a ViewException is thrown. Although an attacker could send a fake ViewState\
    \ with his or her own hash value, the attacker cannot decrypt the encryption key\
    \ values. And, so, ASP.NET attempts to decrypt the attacker's ViewState, it will\
    \ fail and throw an exception.\n\nThis validation mechanism can cause two problems.\
    \ The first problem arises when you must host your application on multiple machines.\
    \ By default, the encryption key (or machine key) used to encrypt the validation\
    \ hash is randomly generated on machine If a request requesting is sent by machine\
    \ A to the browser, but is received by machine B, then the decryption will fail\
    \ because machine A and B have different machine keys. Second, if your application\
    \ restarts, the machine key is regenerated; if a page is sent to a client browser,\
    \ the application restarts before the page is submitted and the sent ViewState\
    \ will fail.\n\nWhile it is possible to disable ViewState validation by setting\
    \ the EnableViewStateMac attribute to false on a page or for the entire application,\
    \ this is obviously a bad idea, because it allows attackers to tamper with data\
    \ in the ViewState. You should ensure that each machine has an identical machine\
    \ key. The machine key is configured via the machineKey element in your web.config\
    \ file. By default, it is stored in the global web.config file in the .NET framework\
    \ installation directory and contains the following settings:\n\n```\nmachineKey\n\
    validationKey=\"AutoGenerate, IsolateApps\"\nderyptionKey=\"AutoGenerate, IsolateApps\"\
    \nvalidation=\"Auto\" />\n```\n\nTo set the keys manually, you must create new\
    \ random numbers and encode them in hexadecimal format. Listing 5-1 shows a program\
    \ that generates a suitable machineKey element that you can paste into your web.config\
    \ file.\n\n# LISTING 5-1: Generating a Machine Key\n\n```\nusing System;\nusing\
    \ System.Security.Cryptography;\nusing System.Text;\n\nnamespace Wrox.BeginningSecureASNET.MachineKeyGenerator\n\
    {\n    class Program\n    {\n        static readonly RNGCryptoServiceProvider\
    \ rngProvider =\n            new RNGCryptoServiceProvider();\n```\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_117_0.png)"
