- pgno: 169
  md: '# CHAPTER 6 KEEPING SECRETS SECURE — HASHING AND ENCRYPTION


    For Vista and Windows 2008, you can use the Certificate Management snap-in. Simply
    right-click the certificate, choose “All tasks,” and select “Manage Private Key,”
    which will present you with the familiar access control (ACL) dialog shown in
    Figure 6-5


    Cert used for SSL do not need to have permissions widened. The Windows Service
    that provides the SSL facility at a higher level than the ASP.NET application
    pool, which has access to the private key by default.


    # Creating Test Certificates with MAKECERT


    The Visual Studio SDK comes with a utility,MAKECERT, that enables you to create
    certificates for use development and testing. If you’re using the Visual Studio
    Express edition, you must download the SDK from http://www.microsoft.com/downloads/details.aspx?familyID53040263-93ca-479a-867-c0dc4516445b


    The first thing you must do is to create a root certificate. A root authority
    is the master certificate from which all other certificates will be issued. Open
    an elevated Visual Studio Tools command prompt (right-click on the item in your
    Start Menu, and choose “Run as Administrator). Change directory to your Documents
    directory and execute the following command:


    ```

    makecert -pe -n "Development Root Authority" -ss my -sr LocalMachine -sha1 sky-key-sign
    -r "Development Root Authority.cer

    ```


    This command creates the root certificate and exports the public part of the certificate
    to the development root authority.cer file. You may then use the Certificate Manager
    MMC snap-in to import this file into the machine Trusted Root Certification Authority
    folder to allow your certificates to be trusted.


    Now you must to create a certificate suitable for use on a server. To do this,
    use the following command, replacing myserver with your computer’s name:


    ```

    makecert -pe -n "myserver" -ss my -sr LocalMachine -sha1 exchange -eku 1.3.6.1.5.5.7.3
    -in "Development Root Authority" -is my -ir LocalMachine -sp "Microsoft RSA Shannon
    Cryptographic Provider" -sy myserver .cer

    ```


    You needn’t worry what the parameters mean. They are documented on MSDN if you’re
    interested. Now you have a certificate in your local machine store with a subject
    name of CN=myserver and a file, myserver.cer, containing the public certificate
    you can use to encrypt data for this server. On systems where you want to encrypt
    data, you can import this certificate into the Other People certificate store.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_169_0.png)


    FIGURE 6-5 Setting permissions on a certificate’s private key in Vista'
