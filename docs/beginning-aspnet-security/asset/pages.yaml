- pgno: 384
  md: '# A CHECKLIST FOR SECURING INTERNET INFORMATION SERVER (IIS)


    This chapter has covered the basics of securing IIS, giving you the basic knowledge
    that you, as a developer, should know.


    IIS is the environment under which your application will run, and a poorly configured
    IIS server is just as dangerous as a vulnerable application itself. Of course,
    configuration of these facilities will be provided by your company''s network
    administrator, or your Web hosting provider. However, as a developer, you should
    be aware of the security functionality that IIS provides, if only so that you
    can configure your development servers to match the servers you will be deploying
    onto. This ensures you check that your application still works in that environment
    before your customers discover it!


    The following is a checklist you should follow when securing:


    +   - Configure application pool identities —Configuring a separate application
    pool identity will isolate multiple Web sites on the same machine. Setting a specific
    application pool identity (if the identity has the appropriate permissions) allows
    you to access networked resources.


    +   - Configure appropriate trust levels for ASP.NET applications —Limiting what
    your application can do is best practice, because your applications will run under
    the least privilege possible. If the standard trust levels do not meet your needs,
    then customize and create your own.


    +   - Configure logging in IIS —Log files can provide a valuable source of information
    when trying to track down attacks, or to evaluate successful ones.


    +   - Filter requests with IIS—Using IIS''s filtering will stop potentially dangerous
    requests from reaching your application, and provides another layer of defense.


    +   - Use the Windows Certificate Authority to generate test certificates for
    HTTPS sites and Web services —Using a test CA provides support for certificate
    validation and revocation, allowing you to develop your code without lowering
    the security level on certificate-handling code. This, in turn, removes the risk
    of insecure test code making it into a production environment.'
  merge: -1
  img_proc: true
