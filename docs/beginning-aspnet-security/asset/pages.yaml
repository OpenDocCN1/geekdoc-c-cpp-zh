- pgno: 111
  md: '# CHAPTER 4 USING QUERY STRINGS, FORM FIELDS, EVENTS, AND BROWSER INFORMATION


    A common mistake made when dealing with browser information is to trust it implicitly.
    Like everything else from the client, browser information can be faked or removed.
    For example, the Referer header (the spelling mistake of "Referrer") is now enshrined
    in the HTTP standards) commonly stripped by some browser privacy software. It
    is supposed to contain the URL for the page that referred the current request,
    either via a link or a form submission. For example, if http://www.wrox.com/example.html
    contained a link to http://www.example.com/then, when the link is clicked, the
    browser updates the Referer header with http://www.wrox.com/example.html.


    However, as you discovered in Chapter 2, you can make requests with any value
    you want. A common spam tactic is to send requests to blogs, which blindly display
    refer information for their pages. These fake requests contain a Referer header
    that points to the Web site you are prompting. The blog software will then believe
    the information and display it.


    Matt''s Mail Script is a Perl email script developed by Matt Wright and used by
    Common Gateway Interface (CGI) driven web sites. Initially, when the Internet
    was generally free of mischief, the script was simple and took form from its fields.
    As you have discovered, this is not wise any more. Spammers realized that Matt''s
    script worked (the source is freely available). The spammers wrote software that
    looked for the script, and then created requests that sent out spam emails through
    it. When this started, one of the lines of defense was checking the Referer header,
    on the assumption that a real Request would contain a Referer Header. This worked
    for a short while, until spammers changed their spam software to fix the Referer
    header to the Web site hosting the script, which then passed the checks, at which
    point the spam flowed through the script again.


    NET also includes defenses against header-splitting attack. This attack happens
    when an attacker includes extra carriage return or line characters in a request,
    which can cause an application to return two responses, the second being under
    the control of the attacker. This protection is enabled by default, but can be
    disabled by setting the enableHeaderChecking attribute on the elapsedTime in your
    application''s web.config file. This setting is there for the rare occasions when
    your application may use header continuation and performs its own checks - a very
    unlikely scenario. Leave header checking turned on!


    > NOTES You can read more about the details of this attack in Amit Klein''s whitepaper
    "Divide and Conquer: HTTP Response Splitting, Web Cache Poisoning Attacks, and
    Related Topics," available from http://www.packetstormsecurity.org/papers/general/whitepaper_httpresponse.pdf.


    This should demonstrate to you that every input should be validated.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# A CHECKLIST FOR QUERY STRINGS, FORMS, EVENTS, AND BROWSER INFORMATION


    The following is a checklist you should follow when deciding how to deal with
    query strings, forms, and browser information:


    +   - Never change state via GET request.—The HTTP specifications state that GET
    requests must not change state.


    +   - Do not use direct, sequential object references—Always use indirect object
    references (such as a GUID) to refer to resources on a Web server. Direct object
    references can be changed easily to allow attackers to access objects they should
    not be able to see. Check that the current user is authorized to see the object
    requested.


    +   - Do not use hidden fields to hide sensitive information, unless they are
    properly protected.—Remember that form fields (and query strings) can be manipulated
    by attackers.


    +   - Add a CSRF token to your forms—This will allow you to check that the request
    came from your own Web site.


    +   - Check the Request type when checking if a request is a postback—This will
    protect you from ASP.NET considering query string-driven requests as potential
    postbacks.


    +   - Do not disable event validation, but do not rely on it—Registering for event
    validation is optional for controls. Always check conditions within postback events.


    +   - Do not rely on request headers.—Combine the steps outlined in this chapter
    with the validation checklist provided in Chapter 3.'
  merge: -1
  img_proc: true
