- pgno: 295
  md: "1. First, you want to change the security mode from transport security to TransportWithMessageCredential.\
    \ This option combines both security methods and the authentication details in\
    \ the message itself. This allows for usernames and passwords to be stored in\
    \ authentication stores other than Active Directory or the Windows username and\
    \ password database. Once the security mode has changed, you can set up the credential\
    \ type on the message.\n\n2. Open the web.config file in your project setup, and\
    \ change it as follows:\n\n```\nbindings\n<wsHttpBinding>\n  <binding name=\"\
    wsHttp\" hostComparisonMode=\"Exact\">\n    <security mode=\"TransportWithMessageCredential\"\
    >\n      <transport clientCredentialType=\"None\" />\n      <message clientCredentialType=\"\
    Username\"/>\n    </security>\n  </binding>\n</wsHttpBinding>\n<bindings>\n```\n\
    \nThis updates the server configuration. If you run the test client and attempt\
    \ to connect, an exception of type FirebaseAuth will be thrown, which tells you\
    \ this might be caused by a binding mismatch. Edit the app.config file for the\
    \ test client and change the binding entry to as follows:\n\n```\nbindings\n<wsHttpBinding>\n\
    \  <binding name=\"EchoService\">\n    <security mode=\"TransportWithMessageCredential\"\
    >\n      <transport clientCredentialType=\"None\" />\n      proxyCredentialType=\"\
    None\"\n      realm=\"/>\n      <message clientCredentialType=\"Username\"/>\n\
    \    </security>\n  </binding>\n</wsHttpBinding>\n</bindings>\n```\n\nIf you now\
    \ run the test application, you will see an InvalidOperationException , which\
    \ informs you that you may have the binding correct, but you are missing one thing\
    \ — the actual credentials.\n\n3. Open program.cs in the test client and add the\
    \ following lines after the declaration of the client object:\n\n```\nEchoServiceClient\
    \ client = new EchoServiceClient();\nclient.ClientCredentials.Username = \"username\"\
    \nclient.ClientCredentials.Password = \"password\";\n```\n\nThe WCF client uses\
    \ a Credentials property, which you can use to specify the credentials sent with\
    \ an operation. No matter which credential type you accept at your service, the\
    \ ClientCredentials class will contain the property you use to attach the appropriate\
    \ details to. In this example, the Username credentials type is used, so you use\
    \ the Username property."
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Adding Security to an Internet Service\n\nBut where are these usernames being\
    \ checked against? By default, the credentials are checked against the local Windows\
    \ username and password store. So you must set appropriate value in the test program\
    \ — for example, your own username and password. Run your updated test client\
    \ and you will see that the service performs as expected.\n\n> WARNING you should\
    \ never hard-code a username and password or any other credential into your programs.\
    \ This is done here for illustrative purposes only.\n\nNow you have a Web service\
    \ that accepts a username and password. But how do you discover which user has\
    \ authenticated? Like ASP.NET, WCF carries the identity of the current user as\
    \ part of a context object, specifically SecurityContext.Current.PrimaryIdentity.\
    \ The PrimaryIdentity has a type of IIdentity. Each different authentication type\
    \ will have its own concrete class, but the IIdentity interface specifies that\
    \ it must have a Name property.\n\nOpen the EchoService.cs file and change its\
    \ contents to reflect the current identity to the client program, as shown in\
    \ Listing 11-6.\n\n+   LISTING 16: Accessing the name of the current user in a\
    \ WCF service\n\n```\nusing System;\nusing System.ServiceModel;\n\nnamespace WCFSecurity\n\
    {\n    public class EchoService : IEchoService\n    {\n        public string Echo(string\
    \ message)\n        {\n            return (\"You sent \" + message + \" as \"\
    \ + ServiceSecurityContext.Current.PrimaryIdentity.Name);\n        }\n    }\n\
    }\n```\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_296_0.png)\n\nWhen you run\
    \ the test client, you will see the username that the client authenticated with.\
    \ Because the default behavior is to check against the Windows user store, you\
    \ will see that the username will also include the machine name — for example\
    \ WROX-VPC\\WROX.\n\nThis is as far as it gets, but using the Windows store is\
    \ not particularly suitable for Internet sites. For ASP.NET applications, user\
    \ management is normally provided by the Membership provider. Luckily, WCF can\
    \ make use of a membership provider to validate usernames and passwords against.\
    \ (If you haven't already read Chapter 7, which discusses the ASP.NET membership\
    \ functions, you may want to do so now.)"
  merge: -1
  img_proc: true
- pgno: 297
  md: "# CHAPTER 11 SHARING DATA WITH WINDOWS COMMUNICATION FOUNDATION\n\n# TRY OUT\
    \ Using the ASP.NET Membership Provider for WCF Authentication\n\nFor this exercise,\
    \ you must first add the membership database to the sample Web site and add a\
    \ user.\n\n+   1. Choose Project ASP.NET Connection. Select the switch to switch\
    \ and click “Select authentication type”. Then select “From the Internet” and\
    \ click Done.\n\n+   2. Now create a new user, with username wrox and a suitable\
    \ password. You can now close the Administration Tool browser.\n\n+   3. The next\
    \ step is to configure the service to use the membership provider as the authentication\
    \ backend, rather than using the Windows user store.\n\nStart the Service Configuration\
    \ Editor (Tools -> WCF Service Configuration Editor) and open the web.config file\
    \ for the service. The authentication setup is part of the behavior of a service,\
    \ so, in the Configuration pane, double-click the Advanced folder, then the Service\
    \ Behaviors editor. Right-click on the Service Behavior WCFSecurity.EchoBehavior\
    \ and choose Add Service Behavior Element. In the Adding Behavior Element Details\
    \ dialog, choose serviceCredentials and then Add Add.\n\n+   4. In the Configuration\
    \ pane, you will see a new entry, serviceCredentials. Select it, and in the right-hand\
    \ pane, set the UserNamePasswordValidationMode to MembershipProvider . In the\
    \ MembershipProviderName field, enter AspSqlMembershipProvider if you had a custom\
    \ membership provider, or enter the name it listed under in your web.config file.\n\
    \n+   5. Save the configuration and close the Service Configuration Editor.\n\n\
    If you examine the behaviors section in your web.config, you will see a new section\
    \ has been added:\n\n```\n<behaviors>\n  <behavior name=\"WCFSecurity.EchoBehavior\"\
    >\n    <serviceMetadata httpGetEnabled=\"false\" httpsGetEnabled=\"true\" />\n\
    \    <serviceCredentials excludeDetailInFaults=\"false />\n    <serviceCredentials>\n\
    \      <userNameAuthentication>\n        userNamePasswordValidationMode=\"MembershipProvider\"\
    \n        membershipProviderName=\"AspSqlMembershipProvider\"/>\n      </userNameAuthentication>\n\
    \    </serviceCredentials>\n  </behavior>\n</behaviors>\n```\n\n+   6. Now you\
    \ all need to update your test client to use the username and password you just\
    \ created. This time, when you run your updated client, you will see the username\
    \ is simply the name from the membership user store — there is no domain or name\
    \ prefix.\n\nOf course, you may not be using the membership database, and may\
    \ have your usernames and passwords stored elsewhere. So how can you leverage\
    \ an existing authentication store?\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_297_0.png)"
  merge: -1
  img_proc: true
- pgno: 298
  md: "# Adding Security to an Internet Service | 271\n\nWCF allows you to write your\
    \ own username and password validation routines in the System.IdentityModel assembly,\
    \ which contains two classes that can be used for custom validation: UserNamePasswordValidator\
    \ (for user names and passwords) and X509CertificateValidator (to allow for custom\
    \ checking of client certificates).\n\n# Writing a Custom Name Validation Class\n\
    \nThis exercise shows you how to write a custom user name validation class.\n\n\
    +   1. Firstly, add a reference to the System.IdentityModel assembly in your service\
    \ project and create a new class called CustomValidator in the project.\n\n+ \
    \  2. Create the custom validator class as follows:\n\n```\nusing System;\nusing\
    \ System.IdentityModel.Selectors;\nusing System.IdentityModel.Tokens;\n\nnamespace\
    \ WCFSecurity\n{\n    public class CustomValidator : UserNamePasswordValidator\n\
    \    {\n        public override void Validate(string username, string password)\n\
    \        {\n            if (null == username || null == password)\n          \
    \      throw new ArgumentNullException();\n\n            if (username != password)\n\
    \                throw new SecurityTokenException();\n        }\n    }\n}\n```\n\
    \nThis example is obviously very insecure and would not be used in production\
    \ — all it does check if the username and password are identical. If validation\
    \ fails, then a SecurityTokenException is thrown, indicating the username and\
    \ password could not be validated.\n\n+   3. Once you have your custom validator,\
    \ you need to plumb it into WCF via the configuration files. After again, the\
    \ configuration settings are part of the service behavior. The web.config file\
    \ for the service project and the editor to be as follows:\n\n```\n<serviceBehaviors>\n\
    \    <behavior name=\"WCFSecurity.EchoServiceBehavior\">\n        <serviceMetadata\
    \ httpGetEnabled=\"false\" httpsGetEnabled=\"true\" />\n        <serviceDebug\
    \ includeExceptionDetailFaults=\"false\" />\n        <serviceCredentials>\n  \
    \          <userNameAuthentication userNameValidationMode=\"Custom\" userNamePasswordValidatorType=\"\
    \n```"
  merge: -1
  img_proc: true
- pgno: 299
  md: '# CHAPTER 11 SHARING DATA WITH WINDOWS COMMUNICATION FOUNDATION


    ```

    "WCFSecurity.CustomValidator, WCFSecurity/ \

