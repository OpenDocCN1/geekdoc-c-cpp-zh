- pgno: 206
  md: '# Managing Role Members Programmatically


    Of course, a role is useless without any members. To add a single user to a role,
    you use AddUserToRole(). To add a user to multiple roles, you use AddUserToRoles().


    ```

    Roles.AddUserToRole(string username, string rolename)

    Roles.AddUserToRoles(string username, string[] roleNames)

    ```


    To add multiple users to a role, you use AddUsersToRole(). To add a user to multiple
    roles, you use Roles.AddUsersToRoles().


    ```

    Roles.AddUsersToRole(string[] usernames, string rolename)

    Roles.AddUsersToRoles(string[] usernames, string[] roleNames)

    ```


    You can get the users of a particular role by using the GetUsersInRole() method,
    which returns an array of strings containing the role''s members.


    ```

    Roles.GetUsersInRole(string rolename)

    ```


    Alternatively, if you want to get the roles for a particular user, you use GetRolesForUser(),
    which returns an array of strings containing the role names user belongs to.


    ```

    Roles.GetRolesForUser(string username)

    ```


    Finally, should you wish to delete a single user from a role, you use RemoveUserFromRole(),
    or to remove a user from multiple roles, you use RemoveUserFromRoles().


    ```

    Roles.RemoveUserFromRole(string username, string rolename)

    Roles.RemoveUserFromRoles(string username, string[] roleNames)

    ```


    To remove users from a role, you use RemoveUsersFromRole(). To remove users from
    multiple roles, you use Roles.RemoveUsersFromRoles().


    ```

    Roles.RemoveUsersFromRole(string[] usernames, string rolename)

    Roles.RemoveUsersFromRoles(string[] usernames, string[] roleNames)

    ```


    # Roles with Windows Authentication


    As with authentication, roles with Windows authentication, do not take ASP.NET
    configuration. You simply enable the role manager in your web.config file. When
    Windows authentication is used, roles directly map to the user''s Windows group
    membership. For example, if a user is in the WROX Active Directory and is a member
    of the Editors group, ASP.NET will treat this as being part of the WROX\Editors
    role.


    Because group membership is provided by the Windows user management functionality,
    you cannot add or remove roles, or add or remove members from roles unless you
    implement your own Role Manager provider.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Limiting Access to Files and Folders


    So far, you have seen examples of how to stop all users and all authenticated
    users from accessing all resources, as well as how to allow specific users access
    to all resources. You may want to be more granular in your access rules, denying
    or allowing access to certain files, or using roles in your access rules.


    As users and roles, you can use the ASP.NET Configuration tool (Figure 7-9) or
    the IIS administration tool (Figure 7-10) to create access rules for your application.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_207_0.png)


    FIGURE 7-9: Adding a new authorization rule in the ASP.NET Configuration tool'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Authorization in ASP.NET 31


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_208_0.png)


    FIGURE-10: Adding a new IIS authorization rule in the IIS Management tool


    To use the ASP.NET configuration tool, highlight your project, and then start
    it by Project -> ASP.NET configuration. Select the Security link in the browser.


    The IIS Management tool creates rules for IIS Authorization. They run with every
    request, even if the resource is not mapped to managed code (for example, an .aspx
    or .svc page). This means that IIS authorization rules can protect static results,
    as .JPG , PNG , and so on.


    IIS authorization rules are evaluated differently. Table 7-6 shows the differences
    between the two types.


    TABLE 76: Differences Between ASP.NET and URL Authorizations in IIS7


    | DIFFERENCE | ASP.NET URL AUTHORIZATION | IIS7 URL AUTHORIZATION |

    | --- | --- | --- |

    | Rule Evaluation Order | Lowest level up Evaluated in order of appearance | Deny
    rules evaluated first, then in order of appearance |

    | UI | No IIS7 Management UI | Managed by the Authorization Rules UI |

    | Configuration Section | system.web/authorization | system.webServer/security/authorization
    |

    | Content | Applies only to resources mapped to a managed handler | Applies to
    all resources |'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Both these tools act upon the web.config file and place the rules they generate
    into an authorization> section. You can examine these rules by opening your web.config
    file.


    Of course, you may find it easy to create rules by hand, rather than with a tool.
    You''ve already seen how to protect folders. To recap, the following configuration
    will stop all users from accessing any resources in the current directory or any
    of its subdirectories:


    ```

    <authorization>

    <deny users="*" />

    </authorization>

    ```


    The following authorization rule set will reject any unauthenticated users accessing
    resources in the current directory and any subdirectories:


    ```

    <authorization>

    <deny users="?" />

    </authorization>

    ```


    You can also specify specific users access, as shown in the next rule set, which
    will only allow access to the barryd and plip users: For example, the following
    rule set will allow access to access.


    ```

    <authorization>

    <allow users="barryd, plip" />

    <deny users="*" />

    </authorization>

    ```


    As discussed earlier, using individual usernames is not a scalable solution. Instead,
    you can use roles as a basis for access. control to anyone in the Finance role:


    ```

    <authorization>

    <allow roles="Finance" />

    <deny users="*" />

    </authorization>

    ```


    Finally, you can combine and use roles. The following rule set allows access to
    anyone in the Finance and Administrators role, as well as the named users barryd
    andplip:


    ```

    <authorization>

    <allow roles="Finance, Administrators" />

    <allow users="barryd, plip" />

    <deny users="*" />

    </authorization>

    ```


    If you want to apply more granularity and control access to a single resource,
    use the <location> element. This element sits outside of the <system.web> settings,
    and initiates a new system.Web configuration document for that specific location.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "For example, the rule set has no authentication at all for a directory, but\
    \ turns on Windows authentication for the admin.aspx page in that directory, and\
    \ limits access to members of the Administrators group:\n\n```\n<configuration>\n\
    \  <system.web>\n    <authentication mode=\"None\" />\n  </system.web>\n\n  <location\
    \ path=\"admin.aspx\">\n    <system.web>\n      <authentication mode=\"Windows\"\
    \ />\n      <authorization>\n        <allow roles=\"Administrators\" />\n    \
    \    <deny users=\"*\" />\n      </authorization>\n    </system.web>\n  </location>\n\
    </configuration>\n```\n\nIf you want to change rules in subdirectories, simply\
    \ create another.config fle in the subdirectory with appropriate rules. For ASP.NET\
    \ authorization, these rules will be evaluated before any rules in parent directories.\
    \ For IIS authorization, the parent rules will be evaluated.\n\n> NOTE One thing\
    \ to note that access rules will not apply to authentication login page (by default,\
    \ login.aspx). After all, stopping users from accessing that would be rather unhelpful!\n\
    \n# Checking Users and Roles Programmatically\n\nAt some point, you may wish to\
    \ vary your page output based on a user's identity or role membership You have\
    \ already discovered how to do this — you can access a user's authenticated identity\
    \ using User.Identity() and a users role membership via User.IsInRole().\n\nA\
    \ common scenario for programming could is to show or hide controls based on a\
    \ user’s identity — for example, adding a \"Delete\" option to a form if a user\
    \ is an administrator. As part of a \"defense in depth\" strategy, it is important\
    \ that you check your rules during code execution, and not just when creating\
    \ the UI. For for example, if you have an ASP.NET button for a delete function\
    \ and showed it based on a user’s role during Page_Load(), you should also check\
    \ that the user belongs to the role in the method that handles the OnClick() event.\n\
    \n# Securing Object References\n\nChecking a user’s identity name is essential\
    \ to avoiding the Insecure Direct Object Reference vulnerability. Chapter 4 introduced\
    \ to how query strings can be edited to manipulate object references, and how\
    \ you can use a GUID or indirect object reference to avoid enabling"
  merge: -1
  img_proc: true
- pgno: 211
  md: 'attackers to explore resources in your Web site. If you have resources that
    belong to a user (such as a message, a document, or account details), then you
    should also store the owner of these resources, and check User.Identity.Name before
    serving them. This secures the object reference, lessening the risk of attack
    if a valid object reference is discovered.


    # A CHECKLIST FOR AUTHENTICATION AND AUTHORIZATION


    The following is a checklist of items to consider when adding authentication and
    authorization to your application:


    +   - Do not roll your own unless you have to—There are some cases where you may
    wish to develop your own authentication and authorization functions, but doing
    so is fraught with potential mistakes. If you have an existing user database,
    then consider implementing the membership and role providers models. This will
    enable you to use the standard methods to control access.


    +   - Encourage your users to logout—Persistent authentication can lead to CSRF
    attacks. For high-value systems, encourage users to log out by providing a visible
    and consistent logout button and do not provide “Remember Me” functionality.


    +   - Always start with a deny access role—Being specific in who you allow to
    access resources is safer than specifying who does not have access.


    +   - Be aware of the differences between ASP.NET and IIS authorization rules—IIS
    authorization rules run against every resource. ASP.NET authorization rules will
    only protect resources mapped to a managed code handler.


    +   - If you use programmatic authorization checks to run or display controls,
    ensure those authorization checks run during execution of the underlying code.—If
    you show or hide user elements as buttons based on role checks, check again in
    any method bound to those buttons such as OnClick() event.


    +   - If resources belong to a user check the current user before serving them.—If
    a resource such as a message is for a particular user then check the current user
    has access to that resource.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 8 Securely Accessing Databases


    At some point, it is likely your Web application will need to use a database.
    And, as soon as you introduce a database, you introduce a new set of potential
    vulnerabilities.


    In this chapter you will learn about the following:


    +   - How simple data queries can expose your data

    - How to safely query databases

    - How to secure your SQL Server databases


    > The vulnerability described in this chapter is known as SQL injection. It is
    part of a family of injection vulnerabilities that attacks can use to "inject"
    extra syntax into external commands.


    It is an extremely common problem on the Web. In June 2008, tens of thousands
    of sites were compromised via SQL injection, including those of the security vendor
    Computer Associates. The attack injected commands caused the applications to append
    JavaScript to every page. This JavaScript used a two-year old Windows vulnerability
    to infect visitors to the site with malware. You can read further details at http://www.computerworld.com.au/article/202731/mass_hack_infect_thousands_sites.
    The attack did not use a vulnerability in ASP.NET or SQL Server, but rather in
    the application running on each Web site.


    Because this book is firmly focused on ASP.NET and the Microsoft technology stack,
    SQL injection attacks are demonstrated on Microsoft SQL Server. However, nearly
    all database servers are vulnerable to injection attacks. The mitigations in this
    chapter are equally applicable to Oracle, PostgreSQL, and to a lesser extent,
    MySQL. The more fully featured a database server is, the more harm can be done
    with a SQL injection attack.'
  merge: -1
  img_proc: true
