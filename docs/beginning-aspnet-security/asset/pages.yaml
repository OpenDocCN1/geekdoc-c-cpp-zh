- pgno: 174
  md: "# Using the Windows DPAPI\n\nIf all that seems like too much hard work, you\
    \ can let Windows take care of key management for you. The Windows Data Protection\
    \ API (DPAPI) is a core system service provided by Windows that is managed by\
    \ the most secure process in the operating system: the Local Security Authority\
    \ (LSA).\n\nThe DPAPI is accessed using the ProtectedData class in the System.Security.Cryptography\
    \ namespace and provides key management and symmetric encryption. To encrypt data,\
    \ you call the Protect method, and to decrypt, you call the Unprotect method.\
    \ Each of these methods works a byte array of Entropy that acts as an additional\
    \ key (and, if used, must be cryptographically random and for decryption), and\
    \ a scope. Like certificate services, DPAPI has the concept of machine and user\
    \ stores — the scope defines from which a key should be retrieved. The optional\
    \ Entropy parameter is used to further partition data within the store, allowing\
    \ programs that share the same DPAPI key to isolate their data from each other\n\
    \nFor IIS6, you should use the LocalMachine scope. IIS7 allows the use of the\
    \ CurrentUser scope if you configure an application pool to load the user profile.\
    \ This is more secure because you specify different application pools and for\
    \ servers running multiple Websites, isolating the encryption and decryption keys\
    \ between pools.\n\nThe following snippet shows functions to encrypt and decrypt\
    \ using DPAPI:\n\n```\n// This is an example of entropy. In a real application\n\
    // it should be a cryptographically secure array of random data.\nprivate byte[]\
    \ entropy = (1, 3, 5, 7, 9, 11, 15, 17, 19);\n\nstatic byte[] EncryptingUsingDPAPI(byte[]\
    \ clearText)\n{\n    return ProtectedData.Protect(\n        clearText,\n     \
    \   entropy,\n        DataProtectionScope.LocalMachine);\n}\n\nstatic byte[] DecryptUsingDPAPI(byte[]\
    \ encryptedText)\n{\n    return ProtectedData.Unprotect(\n        encryptedText,\n\
    \        entropy,\n        DataProtectionScope.LocalMachine);\n}\n```\n\nAs you\
    \ can see, you do not need to specify keys or algorithms. DPAPI takes care of\
    \ that for you.\n\n> WARNING Be to back up your operating system and the DPAPI\
    \ key store on a regular basis so that you can recover in the event of a hardware\
    \ failure or other occurrence that necessitates a reinstall of the operating system."
  merge: -1
  img_proc: true
- pgno: 175
  md: '# A CHECKLIST FOR ENCRYPTION


    The following is a checklist of items to follow when choosing an encryption mechanism
    for your application:


    +   Choose an appropriate method for your situation— If your application must
    encrypt and decrypt the same data, choose a symmetric algorithm. If your application
    talks to an external system, choose an asymmetric algorithm.


    +   Use the appropriate integrity checks for your data— Encryption is not enough
    when to detect changes in data. Even unencrypted data may need a mechanism for
    detecting changes. Use hashing, MACs or certificate signing to give you the capability
    to check when data has changed.


    +   Choose your algorithm carefully— Some algorithms are now considered broken
    or easy to break. Use the recommended algorithms for your situation — SHA256 or
    SHA512 for hashing, and AES for symmetric encryption.


    +   Protect your keys— If your keys are compromised, so is your data. Store your
    key separately from your encrypted data, and tightly control access to them. Ensure
    that you have a secure, separate backup of your keys and certificates.


    +   Plan ahead for algorithm changes— As time passes, algorithms are proven unsafe.
    Plan ahead, and consider how you could change your algorithm, and how you could
    support older data.'
  merge: -1
