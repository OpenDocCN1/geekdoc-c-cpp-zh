- pgno: 240
  md: "# Making Static Files Secure\n\nAnother problem exists with the sample as it\
    \ stands — the files are stored underneath the Web root and can be directly accessed\
    \ by their filename (for example, through http://localhost/documents/example1.txt).\n\
    \nASP.NET provides a special folder, App_Data, which is generally used to hold\
    \ the ASP.NET database during development. However, it the App_Data folder is\
    \ configured so that any file it holds cannot be accessed via the browser. You\
    \ can try this by putting a text file (or any other type of file) in App_Data\
    \ and trying to browse it. You will see an exception thrown.\n\nFor added security,\
    \ if you have full control of the Web server hosting, you can place files you\
    \ serve via code in a directory outside of the Web root directories, as shown\
    \ in Figure 9-2. This means that you are not relying on the special configuration\
    \ of App_Data, which could be removed easily by an administrator editing the global\
    \ web.config file.\n\nBy moving files out of the Web root, you can no longer use\
    \ Server.MapPath. You must specify the full path to your files when you create\
    \ the file. The code you have just written would be the following:\n\n```\nusing\
    \ System;\nusing System.IO;\n```\n\n```\npublic partial class getfile : System.Web.UI.Page\n\
    {\n    protected void Page_Load(object sender, EventArgs e)\n    {\n        Response.Clear();\n\
    \        string filename = Path.GetFileName(Request.QueryString[\"filename\"]);\n\
    \        FileInfo file = new FileInfo(Server.MapPath(\"c:\\inetpub\\documents\\\
    \" + filename));\n        Response.AddHeader(\"Content-Length\", file.Length.ToString());\n\
    \        Response.WriteFile(file.FileName);\n        Response.End();\n    }\n\
    }\n```\n\nFor added security, if you care all measures to prevent traversal (or\
    \ a new vulnerability is discovered in IIS or ASP.NET), you should host your Web\
    \ applications on a drive separate from your operating system, and preferably\
    \ a drive dedicated to just your application.\n\nIf you move your files outside\
    \ of your Web root or onto another drive, you must ensure that the process under\
    \ which ASP.NET runs has access to them. Remember that the account your application\
    \ runs under is defined by the application pool (or by impersonation settings).\
    \ To check\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_240_0.png)\n\nFigure 9-2:\
    \ A suitable directory structure for serving files via script"
  merge: -1
  img_proc: true
- pgno: 241
  md: "# CHAPTER 9 USING THE FILE SYSTEM\n\nthe application pool identity, you can\
    \ view the advanced application pool settings in IIS7, as shown in Figure 9-3,\
    \ or through the Identity on the application pool properties dialog in IIS6, as\
    \ shown in Figure 9-4.\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_241_0.png)\n\
    \n![](img/742122f18de7bcb6f7bd43fe51fe45bd_241_1.png)\n\nFIGURE 9-3: The application\
    \ pool settings dialog for IIS7\n\nFIGURE 9-4: The application pool identity tab\
    \ for IIS6\n\nDepending on how you authenticate, and if you are using impersonation\
    \ (Chapter7 for more details), the application pool identity may not be the current\
    \ identity. Before setting permissions, you may need to validate the identity\
    \ of your Web runs site. You can do this with the code file shown in Listing 9-1.\n\
    \nLISTING 9: whoami.aspx — Discovering the application pool identity through code\n\
    \n```\n<%@ Page Language=\"C#\" %>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0\
    \ Transitional//EN\"\n\"http://www.w3.org/TR/xhtml/xhtml-transitional.dtd\">\n\
    <html xmlns=\"http://www.w3.org/1999/xhtml\"\n<html runat=\"server\">\n<head>\n\
    <title>who am I?</title>\n</head>\n<body>\n<form id=\"form\" runat=\"server\"\
    >\nApplication pool ID : \n<% System.Security.Principal.WindowsIdentity.GetCurrent().Name\
    \ %>\n</form>\n</body>\n</html>\n```\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_241_2.png)"
  merge: -1
