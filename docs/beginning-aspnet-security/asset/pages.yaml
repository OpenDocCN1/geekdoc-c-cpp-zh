  md: "# 244 | CHAPTER 10 SECURING XML\n\nIf you use the sample document from the\
    \ symmetric encryption example shown earlier in Listing 10-2, the encrypted XML\
    \ will look like the following, the CipherValue elements have been truncated for\
    \ sake of publishing:\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<envelope>\n\
    \  <to>barry@idnun.org</to>\n  <from>yourbank@bank.com</from>\n  <EncryptedData\
    \ id=\"encryptedMessage\">\n    Type=\"http://www.w3.org/2001/04/xmlencElement\"\
    \n    xmlns=\"http://www.w3.org/2001/04/xmlenc#\">\n    <EncryptionMethod\n  \
    \    Algorithm=\"http://www.w3.org/2001/04/xmlenc-aes256-cbc\" />\n    <KeyInfo\
    \ xmlns=\"http://www.w3.org/2000/09/xmldig#\">\n      <EncryptedKey xmlns=\"http://www.w3.org/2001/04/xmlenc#\"\
    >\n        <EncryptionMethod\n          Algorithm=\"http://www.w3.org/2001/04/xmlenc-rsa-1_5\"\
    \ />\n        <KeyInfo xmlns=\"http://www.w3.org/2000/09/xmldig#\">\n        \
    \  <KeyName>rsaKey</KeyName>\n        </KeyInfo>\n      </EncryptedKey>\n    </KeyInfo>\n\
    \    <CipherData>\n      <CipherValue>nFUPT...KMu</CipherValue>\n    </CipherData>\n\
    \    <ReferenceList>\n      <DataReference URI=\"#encryptedMessage\" />\n    </ReferenceList>\n\
    \  </EncryptedData>\n</KeyInfo>\n<CipherData>\n  <CipherValue>R5RTQvAvGGwMVD...ah-gWFin5xu5Q==</CipherValue>\n\
    </CipherData>\n</envelope>\n```\n\nIf you compare this result to the encrypted\
    \ XML generated by the symmetric key, you will notice two instances of the CipherData\
