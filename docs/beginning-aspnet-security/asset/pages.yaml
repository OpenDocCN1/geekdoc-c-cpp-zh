    # Using the RegularExpressionValidator


    The RegularExpressionValidator validates the value of a control with a regular
    expression set in the ValidationError property. In design mode, Visual Studio
    provides a list of common regular expressions, including email address, Web address,
    and various postal codes for countries. You should remember that a regular expression
    is simply a pattern match. For example, if you are accepting a ZIP code, you should
    perform further checks on its validity, as shown here:


    ```

    asp:TextBox runat="server" ID="zipcode" /

    asp:RegularExpressionValidator runat="server" ID="zipcode"

    ControlToValidate="zipcode"

    ValidationExpression="\d(5)(\d(4)?"

    ErrorMessage="Please enter a valid zipcode"

    Text="***" / >

    ```


    # Using the CompareValidator


    The CompareValidator compares the value of a control against a static value, the
    value of another control, or a data type. In addition to the data type check,
    the control provides comparison types, GreaterThan, GreaterThanEqual, LessThan,
    LessThanEqual, NotEqual.


    The following example compares the contents of a textbox against a value of Yes
    :


    ```

    asp:TextBox runat="server" ID="confirm" /

    asp:CompareValidator runat="server" ID="confirm"

    ControlToValidate="confirm"

    ValueToCompare="yes"

    Type="String"

    Operator="Equal"

    ErrorMessage="Enter yes to continue"

    Text="***" / >

    ```


    If you want to compare the value of two controls (for example, a password change
    dialog), you set the ControlToCompare and the operator to Equal, as shown here:


    ```

    asp:TextBox runat="server" ID="password" TextMode="Password" /

    asp:TextBox runat="server" ID="passwordconfirmation" Text="Password" /

    asp:CompareValidator runat="server" ID="passwordValidator"

    ControlToValidate="password"

    ControlToCompare="passwordconfirmation"

    Operator="Equal"

    ErrorMessage="Passwords do not match"

    Text="***" / >

    ```'
