- pgno: 354
  md: "# .NET 4 Changes for Trust and ASP.NET\n\nVersion 4 of the .NET framework has\
    \ some major changes to the security model. As it stands, CAS is large and unwieldy\
    \ to configure, and can lead to confusing and unreliable behavior. With Version\
    \ 4, applications run with Full Trust as the default, and the hosting environment\
    \ uses the simple sandbox API to control permissions. For developers who wish\
    \ to code in a sandbox, this is a simpler.\n\n> NOTE This section is based on\
    \ Beta 1 version of the .NET 4 Framework. As any discussion based on beta software,\
    \ the information in this section is subject to change before release. The changes\
    \ in .NET 4 are large, and this section only covers those of immediate use to\
    \ ASP.NET developers. Shawn Farkas is probably the best recognized CAS expert\
    \ within Microsoft, and his blog at http://blogs.msdn.com/shawnfa/ contains more\
    \ details on the upcoming changes, as well as a lot of useful discussion around\
    \ CAS internals.\n\nThe major change for ASP.NET developers is the capability\
    \ to avoid using the GAC to host Full Assemblies.\nLike Silverlight, partially\
    \ trusted code in .NET 4 is securitytransparent. Unlike Silverlight, you can also\
    \ write Safe Critical code which acts as a gatekeeper that may have consequences\
    \ as writing a file. Code that does very unsafe actions (such as calling the Windows\
    \ API) will be Critical, and can only be called via Safe Critical code. Listing\
    \ 13.4 shows a typical Safe Critical block.\n\n+   LISTING 13-4: A safe critical\
    \ block in .Net 4.0\n\n```\n[assembly: AllowPartiallyTrustedCallers]\n\nnamespace\
    \ MyApplication.WebAccess\n{\n    public class WebAccess\n    {\n        [SecuritySafeCritical]\n\
    \        public public string GetWebPage(string url)\n        {\n            //\
    \ Validate the requested url,\n            ...\n            // If passed, continue\n\
    \n            WebPermission webPermission =\n                new WebPermission(NetworkAccess.Connect,\
    \ url);\n            try\n            {\n                webPermission.Assert()\n\
    \                // Now retrieve the web page.\n            }\n```\n\ncontinues"
  merge: -1
  img_proc: true
- pgno: 355
  md: "# 328 | CHAPTER 13 UNDERSTANDING CODE ACCESS SECURITY\n\nLISTING 13-4 (continued)\n\
    \n```\ncatch (SecurityException)\n{\n  ...\n}\n}\n```\n\nThis may not look much\
    \ different, but within this the Safe Critical block is where you can provide\
    \ input validation, security checks, and canonicalization of output. The other\
    \ change from the 1.0-3.5 model is that Safe Critical is an in-process check,\
    \ which means that any code not marked as Safe Critical in a trusted assembly\
    \ will not be allowed to perform sensitive functions.\n\nASP.NET gains the capability\
    \ to select these assemblies in Full Trust without the need to place them in the\
    \ GAC. The web.config has a new element, fullTrustAssemblies which contains a\
    \ list of assembly names, their versions, and the public key from their strong\
    \ name key pair. Following is an example of that element:\n\n```\nFullTrustAssemblies\n\
    <assemblyName=\"MyTrustedLibrary\"\n  version=\"1.0.0\"\n  publicKey=\"0012...dbd\"\
    \ />\nFullTrustAssemblies\n```\n\nOf course, unlike any other configuration section\
    \ in ASP.NET, an administrator may not allow you to nominate your assemblies as\
    \ trusted. If you require more flexibility in deciding trust levels for assemblies,\
    \ you can write your HostSecurityPolicyResolver, and decide trust levels based\
    \ on the evidence provided by each assembly.\n\n# A CHECKLIST FOR CODE NOT UNDER\
    \ FULL TRUST\n\nThe following is a checklist of items to consider when writing\
    \ code that may not run under Full Trust:\n\n+   Always wrap code that creates\
    \ CAS permissions with a demand.—You should specify minimum permissions for your\
    \ code, or fail gracefully, or disable functionality if the demand fails.\n\n\
    +   Place code that always requires Full Trust in a separate assembly stored in\
    \ the GAC—GAC assemblies will always run as Full Trust.\n\n+   Remember to allow\
    \ partially trusted callers.—The .NET framework will stop code hosted in partial\
    \ trust environments from calling GAC assemblies, unless you opt-in and mark your\
    \ assembly with the AllowPartiallyTrustedCallers attribute.\n\n+   Remember to\
    \ use Demand/Assert in APTC assemblies.—This will check the calling assemblies\
    \ are allowed to perform the function. If you want to override this, then remember\
    \ that anyone can call a GAC assembly, unless you add a StrongNameIdentityPermission."
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 14

    Securing the Internet Information Server (IIS)


    Not only can your application be vulnerable to attack — the infrastructure around
    it, if badly configured, also provide places for a hacker to probe and exploit.
    Over the years, Internet Information Server (IIS) and the Windows operating system
    have improved security immensely, but configuration is extremely important. This
    chapter provides an overview of some of the security configuration settings for
    IIS7. If your applications are hosted by large companies, or by a hosting provider,
    it is unlikely that you will have to configure Windows or IIS. However, every
    developer should deat least be aware of the security facilities provided by the
    infrastructure.


    In this chapter, you will learn about the following:


    +   - How to install and configure IIS7 securely

    - How to configure application pools

    - How to set a trust level for ASP.NET applications

    - How to query IIS logs with Log Parser

    - How to filter potentially harmful requests

    - How to request a Secure Socket Layer (SSL) certificate

    - How to use Windows to set up a development certificate authority (CA)


    If you are configuring your own infrastructure, then you should document every
    step you make during configuration as well as scheduling regular backups. Remember,
    however, that if your Web site is attacked successfully, you may not notice immediately,
    and so you could be backing up a compromised site. Careful documentation of the
    initial configuration and any subsequent changes will help you in the event that
    you need to rebuild a hacked server.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 330 | CHAPTER 14 SECURING INTERNET INFORMATION SERVER (IIS)


    > NOTE This chapter is written for Windows Server 2008, but most of the information
    will also apply to Windows Vista and Windows 7. IIS7 authentication and authorization
    is covered in Chapter 7.


    # INSTALLING AND CONFIGURING IIS7


    Starting with SQL Server 2005, and continuing with Vista and Windows 2008, Microsoft
    realized that installing every feature and enabling it by default was a bad idea.
    Nowhere is this more apparent than Windows Server 2008. With Windows Server 2008,
    everything is not just turned off, but installed — even file sharing.


    To install IIS for Windows Server 2008, you add the Web Server role through Server
    Manager. Follow these steps:


    +   1. Server Manager.

    2. Right-click on the Icons and choose Add New Role to start the Add Roles Wizard.

    3. In the wizards Server Roles section, check the box beside Web Server (IIS).

    4. Click Next and continue to the Role Services screen.


    As you can see from the Role Services shown in Figure 14-1, the minimum amount
    of functionality is installed, reducing the attack surface of the default installation.
    The base install


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_357_0.png)


    Figure 14-1: IIS Role Services'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'allows static content, error messages, directory browsing, and adds the logging
    tool, leaving you with a Web server unable to run ASP.NET applications. Checking
    the ASP.NET functionality will add the dependencies it needs. As a rule of thumb,
    you should only install the features that you need, avoiding any potential vulnerability
    in components you are not using.


    Unlike previous versions of IIS (where configuration information was hidden in
    a database called the metastabase), IIS stores its configuration in .config files,
    making it easy to copy configurations from one machine to another. A change made
    to an individual site in the IIS Manager will insert or change the required lines
    in an application''s web.config file. This means that you can trail and test configurations
    on your development machine, and then simply copy the configuration file to a
    live server where (unless an administrator has locked particular settings) your
    configuration will become active.


    # IIS Role Services


    Table 14-1 lists the myriad options that IIS supports and their purposes. Remember
    that IIS Role Services support all Web sites on a server. If one Web site on a
    server allows directory browsing but others do not, then installing directory
    browsing will make it available to every Web site, not just the one that requires
    it. However, some common services can be configured on an individual-site basis
    in the system.WebServer section of your web.config file.


    Table 14-1: IIS Role Services


    | ROLE SERVICE | PURPOSE |

    |---|---|

    | Static Content | Static Content supports the serving of static files (such as
    HTML, image, and text files). As such, it''s very rare that you will need this.
    |

    | Default Document | This allows you to configure a default document to be served
    should users not specify a filename in the requested URL. Again, it''s very likely
    you will need this unless, for example, your Web server hosts Web services for
    every client knows the direct URL. |

    | Directory Browsing | Directory browsing produces an automatically generated
    list of files and directories when the user does not specify a file in the URL,
    and when default documents are disabled or not configured. This is often not needed,
    and so can be deselected during installation, or uninstalled afterward. |

    | HTTP Errors | This facility allows you to customize the error messages returned
    by IIS to a client browser. This order is overridden by the ASP.NET custom errors
    for any file that passes through the ASP.NET engine (or all files in integrated
    pipeline mode). |

    | HTTP Redirection | This allows requests to be redirected to another URL, and
    is useful for supporting migration from older applications. |'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# TABLE 14-1 (continued)


    | ROLE SERVICE | PURPOSE |

    |---|---|

    | ASP.NET | Obviously, you will want to install the ASP.NET role service to support
    the running of your applications. |

    | .NET Extensibility | This role supports HTTP modules and the extension of the
    request pipeline. It is required when you install the ASP.NET service role. |

    | ASP | This role supports classic Active Server Pages (ASP) applications. If
    your server will not run ASP applications, then do not install this role. It is
    not required to run ASP.NET applications. |

    | CGI | This role supports Common Gateway Interface (CGI) applications. If your
    server will not run CGI applications, then do not install this role. It is not
    required to run ASP.NET applications. |

    | ISAPI Extensions | This role is required for ASP.NET applications. |

    | ISAPI Filters | This role is required for ASP.NET applications. |

    | Server Side Includes | Server Side Includes (SSI) is a method of creating dynamic
    HTML files by including one in another. Like CGI and ASP, if your application
    does not use this facility, do not install it. |

    | HTTP Logging | This provides request logging in a standard format used by most
    Web servers, as well as in addition to logging that IIS places in the Windows
    event log. The logs include details on every request made to your server, and
    are a great source of information about potential attacks. HTTP logging should
    be enabled on any Web server. |

    | Logging Tools | This optional facility installs a scriptable object, logscript.dll,
    that allows programs to easily parse log files. Some logging analysis may require
    this. Because it is not remotely callable, it is safe to install this when you
    configure HTTP logging. |

    | Request Monitor | The Request Monitor allows a server administrator to examine
    requests, as well as the processes and application pools these requests run in.
    This can be useful in tracking down requests that slow a Web server response.
    You can access the Request Monitor by highlight the server in the IIS Administration
    tool, and clicking Worker Processes. (Application pools are discussed in more
    detail in this chapter). |

    | Tracing | This facility is separate from ASP.NET tracing. It allows rules to
    be configured for requests. The rules can trigger on various conditions, including
    errors and long running requests. Like Request Monitor, this can be useful in
    tracking down requests that cause a Web application to slow, or to track specific
    error conditions that would not normally show in the IIS logs.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Installing and Configuring IIS7 | 33


    | ROLE SERVICE | PURPOSE |

    | --- | --- |

    | Custom Logging | This feature allows you to write a custom logging module to
    be used when IIS generates log files. This may be useful if you have multiple
    Web servers and want to centralize logs for monitoring. |

    | ODBC Logging | This feature allows you to have IIS log to an Open Database Connectivity
    (ODBC) data source as SQL Server. This may be useful if you have multiple Web
    servers and want to centralize logs for purposes of monitoring. |

    | Basic Authentication | Basic authentication provides a username and password
    prompt, checking the username and password against the local Windows database
    or Active Directory (AD). Of all the authentication options, it offers the widest
    browser compatibility, but usernames and passwords are sent in plain text. This
    is rarely used in external-facing applications. If you must use basic authentication,
    then you should only use it on an SSL-protected site. |

    | Windows Authentication | Windows authentication is suitable for intranet applications,
    and Internet Explorer can be configured to automatically authenticate to a Windows
    Authentication-protected Web site. While it can be configured to check users against
    the local Windows database, it is most commonly used in conjunction with AD. |

    | Digest Authentication | Digest authentication sends a password hash rather than
    a plain password, but requires a domain controller, and has relatively low support
    in non-Microsoft browsers. It should be considered as an alternative to the Basic
    authentication facility if your application does not require wide-browser support.
    |

    | Client Certificate Mapping | Client Certificate Mapping is one of the two authentication
    methods supported by IIS. A user issues a client X509 certificate, which is sent
    to the Web server during authentication, and mapped to a user account. Client
    Certificate Mapping uses Active Directory and Certificate services to map certificates
    to users. (Certificates are discussed in more detail later in this chapter.) |

    | IIS Certificate Mapping | IIS Certificate Mapping uses a mapping store for client
    certificates without the need for AD. This is faster than Client Certificate Mapping,
    but can be more difficult to manage. |

    | URL Authorization | URL Authorization replaces the previous access control functionality,
    which used the underlying file system control lists to authorize access to resources.
    IIS7 authorization is examined in Chapter 7. |


    continues'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# 334 CHAPTER 14 SECURING INTERNET INFORMATION SERVER (IIS)


    # TABLE 14-1 (continued)


    | ROLE SERVICE | PURPOSE |

    | --- | --- |

    | Request Filtering | Request Filtering examines all incoming requests before
    they reach your application, and acts upon them based upon rules set. For example,
    requests for a file with a .bak extension can be rejected, or all requests over
    56KB in size can be rejected. This is discussed in more detail later in this chapter.
    |

    | IP and Domain Restrictions | This feature enables you to allow or deny access
    to resources based on the originating IP address or domain name of the request.
    |

    | Static Content Compression | This feature allows for the compression of static
    resources, making efficient use of bandwidth. |

    | Dynamic Content Compression | This feature allows for the compression of dynamic
    content, at a cost of CPU load. |

    | IIS Management Console | The IIS Management Console allows for GUI administration
    of local and remote IIS servers. |

    | IIS Management Scripts and Tools | The scripts and tools in this feature allow
    command-line configuration of IIS via scripts. |

    | Management Service | This service allows IIS to be remotely managed from another
    computer, and should not be installed without the capability to limit management
    connections via a firewall or domain infrastructure. |

    | IIS6 Metabase Compatibility | This feature provides the capability to configure
    IIS using the same metastabase API that previous versions of IIS used. It is necessary
    if you want to publish or configure applications within Visual Studio 2008. However,
    if you are not directly publishing from Visual Studio 2008, you should not need
    this feature. |

    | IIS6 WMI Compatibility | WMI allows you to continue using software queries and
    utilizes the Windows Management Instrumentation (WMI) API to monitor or configure
    IIS. If you do not use these tools, then do not install this feature. |

    | IIS6 Scripting Tools | This allows you to continue using administration scripts
    that used Active Directory Service Interface (ADSI) or ActiveX Data Objects (ADO).
    If you do not currently use these tools, then do not install this feature. |

    | IIS6 Management Console | This feature installs the IIS6 Management Console,
    allowing management of remote IIS6 servers. It''s unlikely a production Web server
    will need this feature. |'
  merge: -1
  img_proc: true
- pgno: 362
  md: "# Removing Global Features for an Individual Site\n\nWhen an IIS option is\
    \ installed, it is registered in the IIS global configuration file, %windir%\\\
    system32\\inetsrv\\applicationHost.config, located in the globalModules section\
    \ which contains all native modules. If you open this file in a text editor, you\
    \ will see the names and locations of all the modules.\n\nModules are globally\
    \ enabled or disabled in the modules section of the same file. Modules written\
    \ in managed code do not need to be registered in the globalModules section, but\
    \ only appear in the modules section of applicationHost.config file.\n\nTo remove\
    \ a module at an application level, you can use the <system.WebServer>/</modules>\
    \ section of your application web.config file. For example, the following snippet\
    \ will remove the Windows Authentication mode from your application:\n\n```\n\
    <system.WebServer>\n  <modules>\n    <name=\"WindowsAuthentication\" />\n  </modules>\n\
    </system.WebServer>\n```\n\nA server administrator can remove the capability to\
    \ add or remove modules at an application level by adding the lockItem attribute\
    \ to an individual module, or to the entire modules section in applicationHost.config\
    \ file. Modules that are locked by default, but depending on the module, may still\
    \ be enabled or disabled, rather than removed.\n\n# Creating and Configuring Application\
    \ Pools\n\nWith the introduction of IIS6 the concept of application pools, which\
    \ are holding pens for applications. Each application pool offers an isolated\
    \ identity in which one or more applications run under a particular identity.\
    \ An application that crashes, affecting its hosting application pool, will not\
    \ affect any applications running in other application pools.\n\nAn application\
    \ pool can be configured to run under a particular Windows user account, limiting\
    \ or widening the files, directories, and other resources it can access. Generally,\
    \ when hosting multiple sites on a single server, each Web site should be configured\
    \ to run in its own application pool, under its own identity. That, if an application\
    \ needs access to its own directories or other areas of a machine, this can be\
    \ safely granted using the Windows Access Control functionality without compromising\
    \ the safety of other applications. This is because one application identity will\
    \ not be able to access resources owned by another application identity.\n\nCreating\
    \ a new application pool is a simple process using IIS Manager. You just right-click\
    \ on the Application Pools node in the tree view and select New from the context\
    \ menu that appears. Figure 14-2 shows the dialog controlling the creation of\
    \ a new application pool.\n\nYou must enter a name for the new application pool,\
    \ select the .NET framework version as appropriate, and choose a Managed Pipeline\n\
    \n![](img/742122f18de7bcb6f7bd43fe51fe45bd_362_0.png)\n\nFIGURE 14-2: Creating\
    \ a new application pool"
  merge: -1
  img_proc: true
- pgno: 363
  md: 'mode. The “Integrated” pipeline shown in Figure 14-2 integrates the IIS and
    ASP.NET request pipelines, which allows you to write HTTP modules (such as the
    one demonstrated in Chapter 4) that will affect all requests. The “Isolated” pipeline
    separates the IIS pipeline and the ASP.NET pipeline, which is generally used for
    backward compatibility with older applications.


    ASP.NET 1.1 applications will always run in an isolated application pool. Once
    an application pool has been created, you can continue to configure its options,
    including its identity and the criteria under which an application pool will recycle
    — a process by which the application pool downs, freeing all its resources, and
    restarts.


    To place an application in an application pool, click the Web site in the view
    list and then click Basic Settings in the Edit Site dialog to produce a list of
    application pools into you can place the Web site or application.


    In previous versions of IIS, all worker processes created as LocalSystem. From
    a security standpoint, this was a bad idea. LocalSystem has access to every resource
    on the computer. With application pools, worker processes run, by default, under
    the NetworkService account.


    +   - Adjust the memory quota for a process

    - Log on as a service

    - Allow logon locally

    - Access the computer from the network

    - Replace process+level tokens

    - Impersonate a client after authentication

    - Generate security audits


    To configure the application pool runs, you must first create the Windows user
    account and add it to the IIS_IUS group (or the IIS_WPG group for IIS6/Windows
    2003). This group adds the right permissions for a Windows account to be used
    as an application pool identity.


    Next, in IIS Manager, right-click the application pool you wish to reconfigure
    in the application pool list, and then choose Advanced Settings from the context
    menu. Under the Process Model settings, you can choose the Windows identity that
    the pool will run under. If your application is running in a domain environment,
    you can configure the application pool to run as a domain user and grant any access
    to resources that the configured domain user can. If your user is running in a
    group environment but it must access resources on another computer (such as a
    server in a network share), you can create identical usernames and passwords on
    both computers, and configure the application pool to run under this mirrored
    account. You then grant access to the network shares or other resources to the
    mirrored account on the remote machine.


    With IIS7, application pools will be isolated from each other by default, even
    if they share the same pool identity. Under IIS7, each Web application has an
    application pool configuration file'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'dynamically generated when the pool is started. It is stored, by default, in
    the c:\netpub\temp\appPools. Each Web application has an additional Security Identifier
    (SID) generated for it, which is injected into the w3wp.exe process that hosts
    the pool. The application pool configuration file is then locked via the NTFS
    Access Control List (ACL) to allow any SID to access it, isolating each pool configuration
    from other pools.


    Using this SID, it is possible to lock the directories a Web application without
    having to create specific users. To secure directories based on the application
    pool identity, you must follow these steps:


    +   1. Configure each Web site or Web application you wanted to isolate in its
    own application pool.


    +   2. Configure anonymous authentication to use the application pool identity
    (rather than USR account). Click the Authentication option for the Web site, and
    then right-click on Anonymous Authentication. Choose Edit from the context menu
    and select Application Pool Identity in the credentials dialog appears.


    +   3. Remove the NTFS permissions for the IUSR group and IUSR account for the
    application folders and files.


    +   4. Grant read permissions (and any other appropriate permissions) to the application
    folders and files to the IISPOOL ApplicationPoolNamereplacing ApplicationPoolName
    with the name of your application pool.


    Application pools can be configured to recycle on a regularly timed basis, after
    a particular number of requests, or based the amount of memory an application
    pool consumes. This can be useful for memory leaks in applications which you do
    not have the source code.


    To configure the recycling options, begin by right-clicking the application pool
    and choosing the Recycling from the context menu. It is difficult to estimate
    which values you should set because they will vary from application to application.
    You can use Process Explorer from SysInternals to monitor your Web application
    over a period of time to get a feel for how much memory it will under normal conditions.
    You can download Process Explorer from http://technet.microsoft.com/en-us/sysinternals.


    As application pool restarts an application, all internal session states and caching
    will be cleared.


    # Configuring Trust Levels in IIS


    As you read in Chapter 13, all .NET applications are subject to Code Access Security
    (CAS) permissions. A trust level is a set of defined CAS permissions that the
    hosting application environment grants to any applications that run in it.


    The .NET Framework has five default trust levels, as shown in Table 14-2.'
  merge: -1
  img_proc: true
- pgno: 365
  md: "# TABLE 14-2: Default .NET Trust Levels\n\n| TRUST LEVEL | RESTRICTIONS |\n\
    | --- | --- |\n| Full | None. |\n| High | Cannot call unmanaged code. Some restrictions\
    \ placed on reflection. |\n| Medium | In addition to High restrictions: Cannot\
    \ create Web requests. Can only write files to the application directory and below.\
    \ Has some restrictions on the environment variables accessibility. |\n| Low |\
    \ In addition to Medium restrictions: Cannot make any out-of-process calls (for\
    \ example, to a database, to the network, or to send emails). |\n| Minimal | Denied\
    \ pretty much everything |\n\nYou should consider an application or Web site to\
    \ run with the minimum amount of privileges it needs by selecting the appropriate\
    \ trust level. For example, it's unlikely that the majority of Web applications\
    \ need to call unmanaged code, and so the trust level could be reduced from Full\
    \ (the default) to High. To set an application's trust level, navigate to the\
    \ site or application in IIS Manager, and double-click .NET Trust Levels in the\
    \ Features View. Select a trust level from the Trust Level drop-down list.\n\n\
    Changing the trust level will add a trust element to the `system.web` section\
    \ of an application web `config` file. For example, the following snippet sets\
    \ an application's trust level to High:\n\n```\n<system.web>\n  <trust level=\"\
    High\" />\n</system.web>\n```\n\nMicrosoft recommends that the majority of applications\
    \ run under Medium trust.\n\n# Locking Trust Levels\n\nIf you want to stop applications\
    \ from changing their trust levels, you can select and lock a trust level by editing\
    \ the .NET framework's `web.config` file, which is contained in the C:\\Windows\\\
    Microsoft.NET\\Framework\\<version>directory. The definitions for Trust Levels\
    \ are contained in the `<system.web <securityPolicy>` section.\n\nIf you open\
    \ the file, you will see this section wrapped by a `<location>` element. If you\
    \ change the `allowOverride` parameter on the `<location>` element to false, the\
    \ trust level specified in the `<trust>` element of the security policy will apply\
    \ to all applications hosted by IIS. Any attempt to"
  merge: -1
  img_proc: true
- pgno: 366
  md: "change the trust level via web.config will cause an exception to be thrown,\
    \ and the application will not start.\n\nThe following code illustrates a configuration\
    \ where all applications will run in Medium trust:\n\n```\n<location allowOverride=\"\
    false\"&&gt;\n  <system.web>\n    <securityPolicy>\n      <trustLevel name=\"\
    Full\" policyFile=\"internal\"/&gt;\n      <trustLevel name=\"High\" policyFile=\"\
    web.htightrust.config\"/&gt;\n      <trustLevel name=\"Medium\" policyFile=\"\
    web_mediumiumrust.config\"/&gt;\n      <trustLevel name=\"Low\" policyFile=\"\
    web.lowtrust.config\"/&gt;\n      <trustLevel name=\"Minimal\" policyFile=\"web_minitrust.config\"\
    /&gt;\n    </securityPolicy>\n    <trustLevel name=\"Medium\" originUrl=\"\"/&gt;\n\
    \  </system.web>\n</location>&gt;\n```\n\n# Creating Custom Trust Levels\n\nYou\
    \ may discover that the recommended Medium trust level is too restrictive for\
    \ some applications (generally those that making outgoing Web calls to Services\
    \ or remote content providers), High trust may grant too many permissions. In\
    \ this scenario, you can create a custom trust level. For example, you may have\
    \ a level on Medium trust, but allow all outgoing network connections.\n\nThe\
    \ following instructions illustrate how to use the Medium trust configuration\
    \ as a base, and then add permission to make outgoing network connections:\n\n\
    +   1. Open the c:\\windows\\Microsoft.NET\\(version) \\CONFIDE.\n\n+   2. Copy\
    \ the Medium trust configuration, web_mediumrust.config, to a new file in the\
    \ same directory (for example, web_mediumiumrust.config), and open it in a text\
    \ editor.\n\n+   3. Find the WebPermission section in the configuration file,\
    \ which should look like the following:\n\n```\nIPermission class=\"WebPermission\"\
    \ version=\"1\"&gt;\n  <ConnectAccess>\n    <URI uri=\"$originHost\"/&gt;\n  </ConnectAccess>\n\
    </IPermission>&gt;\n```\n\n+   4. Change this section by removing theConnectAccess\
    \ element and adding an Unrestricted attribute with a value of true, like so:\n\
    \n```\nIPermission class=\"WebPermission\" version=\"1\"&gt;\n  Unrestricted=\"\
    true\"/&gt;\n</IPermission>&gt;\n```\n\n+   5. You can also remove (by commenting\
    \ out) the PrintingPermission if your application does not talk to printers, and\
    \ the EnvironmentPermission if your application does not need access to environment\
    \ variables."
  merge: -1
  img_proc: true
- pgno: 367
  md: "6. Finally, you must add the new trust configuration to the available levels\
    \ by editing the .NET framework web.config file Open this file in a text editor\
    \ and search for the securityPolicy. Add a new trustLevel element that specifies\
    \ your new configuration, and lock it if required, as shown here:\n\n```\n<location\
    \ allowOverride=\"false\">\n  <system.web>\n    <securityPolicy>\n      <trustLevel\
    \ name=\"Full\" policyFile=\"internal\"/>\n      <trustLevel name=\"High\" policyFile=\"\
    web_hightrust.config\"/>\n      <trustLevel name=\"Medium\" policyFile=\"web_mediumtrust.config\"\
    />\n      <trustLevel name=\"Low\" policyFile=\"web_lowtrust.config\"/>\n    \
    \  <trustLevel name=\"Minimal\" policyFile=\"web_minimaltrust.config\"/>\n   \
    \   <trustLevel name=\"MediumPlus\" policyFile=\"web_mediumplus.config\"/>\n \
    \   </securityPolicy>\n    <trust level=\"MediumPlus\" originUrl=\"\"/>\n  </system.web>\n\
    </location>\n```\n\nAll applications by IIS will now run under your new MediumPlus\
    \ trust level.\n\n# FILTERING REQUESTS\n\nThe IIS7 Request Filter begins as URLScan\
    \ for IIS4, an extension that examined requests for potentially harmful exploits\
    \ (such as double-escaped URLs) and stopped them from reaching any applications\
    \ running on the server. In IIS7, these features were rolled into the Request\
    \ Filter role service.\n\nRequest filtering be configured globally using applicationHost.config\
    \ and for each application in the web.config. If you prefer a GUI to configure\
    \ request filtering, the IIS7 Admin Pack (downloadable from http://www.iis.net/extensions/AdministrationPack)\
    \ provides one. You should be aware that request filtering constrains input, and\
    \ can stop your Web site from working if you misconfigure the filters. Requests\
    \ can be filtered and rejected based on a number of rules:\n\n+   - Doubledencoded\
    \ requests\n- Requests with nonASCII characters\n- A filter based on a request\
    \ file extension\n- A filter based on request sizes\n- A filter based on HTTP\
    \ verbs\n- A filter based on URL sequences\n- A filter based on request segments\n\
    - A filter based on request headers"
