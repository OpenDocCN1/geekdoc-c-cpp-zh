    truly random because the numbers that they generate are completely determined
    by the data used to initialize the algorithm.


    Cryptographically secure pseudo-random number generator (CSPRNG) has two requirements.
    First, the results must be statistically random, and second, hold up against attack.
    The attack-proofing provides protection against next-bit guessing (where it is
    computationally time-consuming to guess the next value produced) and against a
    state compromise (where, if the generators state is guessed or compromised, it
    would be impossible to reconstruct the previous values produced). In banking,
    government, and other high-security situations, specialized hardware is used to
    produce true random numbers from a physical process such as the noise produced
    by a microphone, or the nuclear decay of a radioactive source.


    The NET Framework provides a CSPRNG class, System.Cryptography. RNGCryptoServiceProvider,
    which you should use whenever you want to generate random data for cryptographic
    purposes. For salting purposes, you will want a salt size between 4 and 8 bytes,
    which you can generate like so:


    ```

    byte[] saltBytes;

    int minSaltSize = 4;

    int maxSaltSize = 8;


    // Generate a random number to determine the salt size.

    Random random = new Random();

    int saltSize = random.Next(minSaltSize, maxSaltSize);


    // Allocate a byte array, to hold the salt.

    saltBytes = new byte[saltSize];


    // Initialize the cryptographically secure number generator.

    RNGCryptoServiceProvider rng = new RNGCryptoServiceProvider();


    // Fill the salt with cryptographically strong byte values.

    ng.GetNonBytes(saltBytes);

    ```


    Once you have the salt value, you must combine it with the text to produce a salted
    hash, using the salt value as a prefix to the clear text, or appending it to the
    clear text before calculating the hash. The following code snippet appends the
    salt calculated from the snippet to the clear text before calculating a SHA256
    hash:


    ```

    // Convert the clear text into bytes.

    byte[] clearTextBytes = Encoding.UTF8.GetBytes(clearText);


    // Create a new array to hold clear text and salt.

    byte[] clearTextWithSaltBytes =

    new byte[clearTextBytes.Length + saltBytes.Length];


    // Copy clear text bytes into the new array.

    for (int i=0; i < clearTextBytes.Length; i++)

    clearTextWithSaltBytes[i] = clearTextBytes[i];


    // Append salt bytes to the new array.

    for (int i=0; i < saltBytes.Length; i++)

    clearTextWithSaltBytes[clearTextBytes.Length + i] = saltBytes[i];

    ```'
