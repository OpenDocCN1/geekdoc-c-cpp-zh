- pgno: 22
  md: '# INTRODUCTION


    OVER THE PAST SEVERAL YEARS, I''ve been regularly presenting security in .NET
    at conferences and user groups. One of the joys of these presentations is that
    you know when you''ve taught something new. At some point during the presentation,
    you can see one or two members of the audience starting to look very worried.
    Security is a difficult topic to discuss. Often, developers know they must take
    security into account during their development life cycle, but do not know what
    they look for, and can be too timid to ask about the potential threats and attacks
    that their applications be subjected to.


    This book provides a practical introduction to developing securely for ASP.NET.
    Rather approaching security from a theoretical direction, this book shows examples
    of how everyday code can be attacked and takes you through the steps you must
    follow to fix the problems.


    This book is different from most others in the Wrox Beginning series. You will
    not be building an application, but rather, each chapter is based upon a task
    a Web site may need to perform — accepting input, accessing databases, keeping
    secrets, and so on. This approach means that most chapters can be read in isolation
    you encounter the need to support these tasks during your application development.
    Instead of exercises, many chapters will end with a checklist for the particular
    task covered in the chapter discussions, which you can use during your development
    as a reminder, and as a task list to ensure you have considered and addressed
    each potential flaw or vulnerability.


    When you decide to test your applications for vulnerabilities, be sure that you
    run any tests against a development installation of your site. If you have a central
    development server, ensure that you inform whoever manages the server that you
    will be performing security testing. Never run any tests against a live installation
    of your application, or against a Web site that is not under your control.


    Be aware that your country may have specific laws regarding encryption. Using
    some of the methods outlined in this book may be restricted, or even illegal,
    depending on where you live.


    # WHO THIS BOOK IS FOR


    This book is for developers who already have a solid understanding of ASP.NET,
    but who need to know about the potential issues and common security vulnerabilities
    that ASP.NET can have. The book does not teach you how to construct and develop
    an ASP.NET Web site, but instead expand upon your existing knowledge, and provide
    you with the understanding and tools to secure your applications against attackers.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# INTRODUCTION


    # HOW THIS BOOK IS STRUCTURED


    This book is divided into three very broad sections, each containing several chapters.


    Chapter 1,“Why Web Security Matters,” begins with a general introduction to Web
    security, illustrates an attack on an application, and introduces some general
    principles for secure development.


    Part I,“The ASP.NET Security Basics,” addresses everyday common functions of an
    ASP.Net site — the functions that you can expose your application, and how you
    can secure them. The following chapters are included in this section of the book:


    +   * Chapter 2,“How the Web Works,“ explains some aspects of HTTP and ASP.NET
    Web Forms, shows how to examine requests and responses, and how the ASP.NET pipeline
    works.


    +   * Chapter 3,“Safely Accepting User Input,” discusses how to use your application,
    and how it can be used to attack your application, and how you should protect
    yourself against this.


    +   * Chapter 4,“Using Query Strings, Form Fields, Events, and Browser Information,”
    covers parameters, query strings, and forms, and how you can safely use them.


    +   * Chapter 5,“Controlling Information,” takes a look at how information can
    leak from your application, the damages this exposes, and how you can lock information
    away from accidental exposure.


    +   * Chapter 6,“Keeping Secrets Secret — Hashing and Encryption,” delves into
    the basics of cryptography — showing you how to encrypt and decrypt data, and
    sign it to protect against changes.


    Part II,“Securing Common ASP.NET Tasks,” focuses on common tasks for applications.
    The following chapters are included in this section of the book:


    +   * Chapter 7,“Adding Usernames and Passwords,” shows how to add usernames and
    passwords to your application.


    +   * Chapter 8,“Securing Accessing Databases,” demonstrates the problems with
    accessing databases, and how you can protect against common attacks related to
    them.


    +   * Chapter 9,“Using the File System,” talks about the file system, and how
    your application can safely use it.


    +   * Chapter 10,“Securing XML,” looks at XML, how you can validate it, and how
    to safely query XML data.


    Part III,“Advanced ASP.NET Scenarios,” looks at more advanced topics that not
    every application may use. The following chapters are included in this section
    of the book:


    +   * Chapter 11,“Sharing Data with Windows Communication Foundation,“ covers
    Web services, and the risks they may expose.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introduction


    +   > Chapter 12,"Securing Rich Internet Applications," provides an introduction
    to Rich Internet Applications, and shows how you can safely utilize Ajax and Silverlight
    to communicate with your server.


    +   > Chapter 13,"Understanding Code Access Security," provides you with some
    of the security underpinnings of the .NET run-time, and shows how you can use
    them within ASP.NET.


    +   > Chapter 14,"Securing Internet Information Server (IIS)," provides a brief
    introduction to securing your infrastructure, and you will appreciate how IIS
    can act as a first line of defense.


    +   > Chapter 15,"Third-Party Authentication," looks at bringing third-party authentication
    systems into your application, and discusses claims-based authentication, OpenAPI,
    and Windows Live ID.


    +   > Chapter 16,"Secure Development with the ASP.NET MVC Framework," provides
    a summary of the ways that an ASP.NET MVC application can be protected against
    attacks.


    Every effort has been made to make each chapter as self-contained as possible.
    There is no need to read each chapter in order. Instead, you can use the instructions
    in each chapter to secure each part of your Web site as you develop it. Some of
    the later chapters will contain references to previous chapters and explanations
    — these are clearly marked.


    # WHAT YOU NEED TO USE THIS BOOK


    This book was written using version 3.5 of the .NET Framework and Visual Studio
    2008 on both Windows Vista and Windows Server 2008. The sample code has been verified
    to work with .NET 3.5 and .NET 3.5 SP1. To run all of the samples, you will need
    the following:


    +   > Windows Vista or Windows Server 2008


    +   > Visual Studio 2008


    Most do not require a paid version of Visual Studio 2008, and you may use Visual
    Studio Web Developer Express edition.


    Some samples will need to run under Internet Information Server (IIS), and some
    samples will require SQL Server installed — they will work with SQL Server 2005
    or later, and have been tested with SQL Server Express.


    The code in this book is written in C#.


    # CONVENTIONS


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# INTRODUCTION


    The Try It Out is an exercise you should work through, following the text in the
    book.


    +   1. These usually consist of a set of steps.

    2. Each step has a number.

    3. Follow the steps to complete the exercises.


    > WARNING Boxes like this one hold important, notto-be forgotten information that
    is directly relevant to the surrounding text.


    > NOTE Notes, tips, hints, tricks, and asides to the current discussion are offset
    and displayed like this.


    As for styles in the text:


    +   * Wehighlight new terms and important words when we introduce them.

    * We show keyboard strokes like this: Ctrl+A.

    * We show filenames, URLs, and code within the text like: persistence.properties.

    * We present code in two different ways:


    We use a monof type with no highlighting for most code examples.

    We use boldface to emphasize code that that is of particular importance in the
    present context.


    # SOURCE CODE


    As you work through the examples in this book, you may choose either to type in
    all the code manually, or to use the source files that accompany the book. Some
    of the source code used in this book is available for download at http://www.wrox.com
    . Once at the site, simply locate the book''s title (either by using the Search
    box, or by using one of the title lists), and click the Download Code link on
    the book''s detail page to obtain all the source code for the book.


    > NOTE Because books have similar titles, you may find it easiest to search by
    ISBN; this book''s ISBN is 978-0-470-74365-2.


    Once you download the code, just decompress with your favorite compression tool.
    Alternately, you can go to the main Wrox code download page at http://www.wrox.com/dynamic/books/download.aspx
    to see the code available for this book and all other Wrox books.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# ERRATA


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books (such as a spelling mistake or faulty piece of code), we would
    be very grateful for your feedback. By sending errata you may save another readers
    of frustration and, at the same time, we will be helping you provide even higher-quality
    information.


    To find the errata page for this book, go to http://www.wrox.com and locate the
    title using the Search box, or one of the title lists. Then, on the book details
