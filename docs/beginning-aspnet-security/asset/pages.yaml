- pgno: 351
  md: '# Using the Global Assembly Cache to Run Under Full Trust


    Every machine with the .NET framework installed on it has a Global Assembly Cache
    (GAC), a machine-wide store of assemblies designated to be shared between multiple
    applications, such as the .NET framework assemblies. An assembly loaded from the
    GAC runs under Full Trust, even if the calling assembly is not hosted in a Full
    Trust environment.


    So what does this mean for you? A problem with Medium Trust is that a lot of Web
    applications these days want to talk to other Web applications on other Web sites,
    but Medium Trust restricts this. You can extract your security-sensitive code
    to a separate, well-tested assembly, and install it into the GAC, where it runs
    under Full Trust and thus, be allowed to make connections. The separation of code
    is much simpler when logically distinct functionality such as data-access code
    is handled in a separate assembly.


    To put an assembly into the GAC, you must first get a strong name. Strong naming
    involves signing the assembly with a cryptographic key. The cryptographic signature
    combined with the assembly prevents components from clashing if they have the
    same name, and allows consuming applications to ensure that they are using the
    correct assembly.


    ```

    sn -k "C:\DirectoryToPlaceKey\[KeyName].snk"

    ```


    Once you have generated your key file, you must associate it with an assembly.
    In Visual Studio''s Solution Explorer, right-click on the project you wish to
    strong-name and choose Properties. Select the Signing tab and check the "Sign
    Assemble" checkbox. Browse and select your key file. Your key file will be added
    to your assembly. From now on, your assembly will be strong-named.


    You can test this by compiling and using the following command:


    ```

    sn -v "assemblyName.dll"

    ```


    If all is well, you will see a message saying your assembly is valid. Once a strongly
    named assembly, you can place it into the GAC in one of the following three ways:


    +   - Use installer software such as InstallShield, Wix, or Advanced Installer
    to install a package for that application installs the assembly into the GAC.

    - Use Windows Explorer by opening: \\Windows\Assembly and dragging and dropping
    your strongly named assembly into the GAC.

    - Use thegacutil.exe utility to install your assembly with the command gacutil
    -i C:\[Path]\[AssemblyName].dll "


    > WARNING The gacutil.exe utility is only included with Visual Studio and the
    .NET Framework SDK. It is not available to end users, and must be run from an
    elevated command prompt.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Once your assembly is in the GAC, you can add a reference to it in your main
    application by right-clicking on your application project and choosing Add Reference.
    Click the Browse tab, to find the directory containing your strongly named assembly,
    and select it. Once the assembly reference is added, select it in the References
    folder and ensure that the Copy Local setting is False . This will ensure that
    the version in the GAC is loaded.


    This will work nicely until your application is placed into a Non-Full Trust environment.
    By default, GAC assemblies do not allow calls from partially trusted callers or
    assemblies, because they may contain security-sensitive operations. Opt-in to
    letting partially trusted callers use your GAC assembly, you must mark it with
    the AllowPartiallyTrustedCallers attribute, as shown in Listing 13-3


    # LISTING 13: Add AllowPartiallyTrustedCallers setting to an assembly


    ```

    using System.Reflection;

    using System.Runtime.CompilerServices;

    using System.Runtime.InteropServices;

    using System.Security;


    // Normal assembly attributes

    [assembly: AssemblyTitle("StrongAssemblyName")

    [assembly: Guid("4e62c5f5-a2b2-44ff-b86c-52e9df2c1add")

    [assembly: AssemblyVersion("1.0.0.0")

    [assembly: FileFileVersion("1.0.0.0")

    ```


    [assembly: AllowPartiallyTrustedCallers]


    > WARNING You should only do this once you are sure your assembly will not expose
    any security flows. The AllowPartiallyTrustedCallers attribute is an assembly-wide
    attribute, and is applied by editing the assembly.cs file in your project.


    When writing an assembly that will allow partially trusted callers, you should
    follow the Demand / Assert pattern when performing sensitive operations. A Demand
    for permission walks the stack examining each calling function for the specified
    permission. If the Demand succeeds then you can Assert the permission and perform
    the desired action. Here is an example:


    ```

    FileIOPermission FilePermission =

    new FileIOPermission(FileIOPermissionAccess.Write, Directory);


    try

    {

    // Check the complete call stack.

    FilePermission.Demand();


    // If the demand succeeded, assert permission and

    // perform the operation.

    FilePermission.Assert();

    ```'
  merge: -1
  img_proc: true
- pgno: 353
  md: "```\n// Perform the operation\n\n// Revert the Assert when the operation is\
    \ complete.\nCodeAccessPermission.RevertAssert();\n}\ncatch (SecurityException)\n\
    {\n  // Handle error\n}\n```\n\nSimply calling Assert does not perform any checks\
    \ on the code, and the GAC may pose a security risk - because, by default, any\
    \ code can use an assembly in the GAC. If you want to limit GAC assembly to your\
