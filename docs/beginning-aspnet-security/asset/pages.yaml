- pgno: 193
  md: "The sample web.config in Listing 7-7 removes the need for a secret question\
    \ and answer, and loosens the password requirements. These settings will be used\
    \ by the Visual Studio administration tool and by the CreateUserWizard control.\
    \ You should not changing the settings will not change any existing users. If\
    \ you increase the minimum password complexity, any user already in the system\
    \ will still be allowed to use his or her password.\n\n# LISTING-7: Configuring\
    \ ASP.NET to use an existing, prepared membership database\n\n```\n<configuration>\n\
    \  <system.web>\n    ...\n    <membership>\n      <providers>\n        <clear/>\n\
    \        <add name=\"AspNetSqlMembershipProvider\"\n             connectionString=\"\
    LocalSqlServer\"\n             enablePasswordRetrieval=\"false\"\n           \
    \  enablePasswordReset=\"true\"\n             requiresQuestionAnswer=\"false\"\
    \n             applicationName=\"\"\n             requiresUniqueEmail=\"true\"\
    \n             passwordFormat=\"Hashed\"\n             minRequiredPasswordLength=\"\
    5\"\n             minRequiredNonAlphanumericCharacters=\"0\"\n             type=\"\
    System.Web.SqlMembershipProvider, System.Web, Version=2.0.0.0, Culture=neutral,\
    \ PublicKeyToken=b03f5f7171d5d0a3‍\" />\n      </providers>\n    </membership>\n\
    \    ...\n  </system.web>\n</configuration>\n```\n\n# Creating Users Programmatically\n\
    \nYou are not limited to use the server controls for creating users. ASP.NET provides\
    \ you with the Membership API to perform this task. The API includes the CreateUser\
    \ method, with four possible signatures:\n\n```\nMembership.CreateUser(username,\
    \ password)\nMembership.CreateUser(username, password, email)\nMembership.CreateUser(username,\
    \ password, email, passwordQuestion, passwordAnswer, isApproved, status)\nMembership.CreateUser(username,\
    \ password, email, passwordQuestion, passwordAnswer, isApproved, providerUserKey,\
    \ status)\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: "Because the Membership class is static, you don't need to create an instance;\
    \ you can use it directly. If you use one of the signatures that has a status\
    \ parameter, this is a ByRef parameter and returns one of the System.Web.Security.MembershipCreateStatus\
    \ values, indicating the result of the method call.\n\n# Supporting Password Changes\
    \ and Resets\n\nASP.NET provides two controls for common actions: the PasswordRecovery\
    \ control and the ChangePassword control.\n\nThePasswordRecovery control provides\
    \ the functionality to retrieve or reset a user's password based on his or her\
    \ username. The new recovered password is sent to the user via an email. Like\
    \ the CreateUserWizard control, the PasswordRecovery control honors the provider\
    \ configuration settings, and you can override the email sent by the MailDefinition\
    \ property. Control automatically replaces <%Username%> and <%Password%> with\
    \ appropriate values before sending the email.\n\nIf your passwordFormat is configured\
    \ to Hashed (see Table 7-3), only password resets are supported. If yours is Encrypted\
    \ or Clear, then password recovery is supported. Obviously, Encrypted is the most\
    \ secure option but encryption uses the machine key in the web.config file as\
    \ its key. If you don't set it manually a machine key will be automatically generated\
    \ when your application starts. The machine key is also used to protect ViewState.\
    \ Listing 5-1 in Chapter 5 shows how to generate a new machine key and use it.\
    \ If you are running your application on multiple Web servers, the machine key\
    \ must match.\n\nTheChangePassword control, not surprisingly, allows an authenticated\
    \ user to change his her password, confirming an existing password. If a user\
    \ uses this control but is not authenticated, the user will be authenticated first,\
    \ and then his or her password will be changed. Like the PasswordRecovery control,\
    \ it honors the membership configuration, and can send a confirmation email to\
    \ the user's email address.\n\n# Windows Authentication\n\nIn contrast to forms\
    \ authentication, Windows authentication does not take ASP.NET configuration and\
    \ requires no user controls. This is because the usernames and passwords are managed\
    \ by Windows, and the authentication is handled by IIS and the browser. Windows\
    \ authentication has the advantage that, if an application is deployed into an\
    \ intranet environment and IIS is configured correctly, any user logged into the\
    \ domain will not need to authenticate manually. You use this type of automatic\
    \ login at the beginning of this chapter.\n\nWindows authentication this type\
    \ is configured by setting the authentication attribute to Windows\" :\n\n```\n\
    <system.web>\n  <authentication mode=\"Windows\" />\n</system.web>\n```\n\nThe\
    \ Visual Studio web server takes care of everything for you. But if you move your\
    \ site to IIS, you must configure IIS to perform authentication."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Configuring IIS for Windows Authentication


    To configure IIS to perform authentication, start the IIS Manager application
    and expand the Sites tree. Click on the Web site you wish to edit and select the
    Authentication icon to see the dialog shown in Figure 7-5.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_195_0.png)


    FIGURE 7-5: Configuring IIS Authentication


    As you can see from Table 74, IIS supports a number of types of authentication
    methods, but it is the user that sees the difference, not your code.


    # TABLE 74: Common IIS Authentication Types


    | AUTHENTICATION TYPE | DESCRIPTION |

    | :--- | :--- |

    | Anonymous | Allows any user to access any public content. This is enabled by
    default. |

    | Basic Authentication | Requires a valid username and password before access
    is granted using HTTP authentication, part of the HTTP specification. The prompt
    appears as a dialog in the browser. This should only be used over a secure connection
    as usernames and passwords are sent as unencrypted plain text. |

    | Digest Authentication | Uses a Windows domain controller to authenticate users.
    This is stronger than basic authentication. |

    | Windows Authentication | This provides automatic logins within an intranet environment.
    |'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Adding Authentication inASP.NET


    If you are working with Windows, you can access specific Windows account properties
    in your code using the WindowsIdentity object from the System.Security.Principle
    namespace. 7-8 shows you the common properties of the WindowsIdentity class.


    # LISTING-7 Viewing the properties of the WindowsIdentity


    ```

    <@ Page Language="C#" %>

    @ Import Namespace="System.Security.Principal" %>

    <!DOCTYPE html>

    PUBLIC "-//W3C//DTD HTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head id="Head" runat="server">

    <title></title>

    </head>

    <body>

    <form id="form" runat="server">

    <h1>Hello Authenticated <%= User.Identity.Name %></h1>

    <p>User Name <%= User.Identity.Name %></p>

    <p>IsAuthenticated <%= User.Identity.IsAuthenticated %></p>

    <p>Authentication Type <%= User.Identity.AuthenticationType %></p>

    <hr />

    <p>Windows Authentication

    <% WindowsIdentity.GetCurrent().AuthenticationType %></p>

    <p>Name

    <% WindowsIdentity.GetCurrent().Name %></p>

    <p>IsAuthenticated

    <% WindowsIdentity.GetCurrent().IsAuthenticated %></p>

    <p>Anonymous

    <% WindowsIdentity.GetCurrent().IsAnonymous %></p>

    <p>Guest

    <% WindowsIdentity.GetCurrent().IsGuest %></p>

    <p>IsSystem

    <% WindowsIdentity.GetCurrent().IsSystem %></p>

    <p>Impersonation Level

    <% WindowsIdentity.GetCurrent().ImpersonationLevel.ToString() %></p>

    <p>Group membership

    <% foreach (var group in WindowsIdentity.GetCurrent().Groups) %>

    {

    Response.Write(group.Value + "<br>");

    } %p>

    </form>

    </body>

    ```


    If you run this code, you will see something like Figure 7-6. You will notice
    that the groups are not Windows group names, but instead strings. These strings
    are Security Identifiers (SIDs). Checking group membership is covered in the later
    section of this chapter, “Authorization in ASP.NET."'
  merge: -1
