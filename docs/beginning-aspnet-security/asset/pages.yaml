- pgno: 181
  md: '# 154 CHAPTER 7 ADDING USNAMES AND PASSWORDS


    ASP.NET comes with four authentication modes, as shown in Table 7-1.


    **Table 7**: The ASP.NET Authentication Modes


    | MODE | DESCRIPTION |

    | --- | --- |

    | None | Uses no authentication. Your application expects only anonymous users,
    or if you wish, your application can provide its own authentication process. |

    | Forms | Uses ASP.NET formsbased authentication as the default authentication
    mode. |

    | Windows | Uses Windows authentication. This setting passes responsibility to
    the underlying web server (IIS or the test server for Visual Studio). The web
    server can use any of the authentication methods (Basic authentication, NTLM,
    Kerberos, and so on) to authenticate and pass the results through ASP.NET. |

    | Passport | Uses Microsoft Passport for the authentication process. This setting
    is deprecated. Replacement third-party authentication options such as OpenID,
    Identity Cards, and LiveID are discussed in Chapter 15. |


    So what happens if you change the authentication type in your `web.config` file?
    Obviously, the contents of the `Request.User` property change. Go ahead and try
    it. If you set the authentication type to `None` or `Forms` in the previous example,
    you will see no username or authentication type, and `IsAuthenticated` will be
    `false`.


    The next section explores the various authentication stores available to you in
    ASP.NET, and how you can use them.


    # ADDING AUTHENTICATION IN ASP.NET


    This section examines two types of authentication:


    +   * Forms authentication

    * Windows authentication


    # Using Forms Authentication


    Forms authentication is a set of .NET libraries and ASP.NET controls that allows
    you to authenticate users, and maintains authentication via a token contained
    in a cookie, or in the page URL.


    # Configuring Forms Authentication


    To use authentication, you can create a login page that collects the user''s credentials,
    and then write code to authenticate them. If a user attempts to access a resource
    that is protected, typically he or she will be redirected to the login page. In
    its simplest form, forms authentication is configured in the `web.config` file
    by specifying the authentication mode and a login page.'
  merge: -1
  img_proc: true
- pgno: 182
  md: "Using the Web site you created for Listing 7-1, enable forms authentication\
    \ by modifying your web.config as shown in Listing 7-2.\n\n# LISTING 7-2: Modifying\
    \ web.config to enable forms authentication\n\n```\n<system.web>\n  <authentication\
    \ mode=\"Forms\">\n    <forms loginUrl=\"login.aspx\">\n      <credentials passwordFormat=\"\
    Clear\">\n        <user name=\"peter\" password=\"curd\"/>\n        <user name=\"\
    alex\" password=\"mackey\"/>\n      </credentials>\n    </forms>\n  </authentication>\n\
    \n  <authorization>\n    <deny users=\"?\"/>\n  </authorization>\n</system.web>\n\
    ```\n\nThe modifications shown turn on forms authentication, specify the login\
    \ page URL and some users, and then tell ASP.NET to access any user who is not\
    \ authenticated (authorization is covered in more detail later in this chapter).\n\
    \nTable 7-2 describes all the possible attributes for the <forms> element.\n\n\
    # TABLE 7-2: The <forms> Element Attributes\n\n| ATTRIBUTE | DESCRIPTION |\n|---|---|\n\
    | name | This is the name of the cookie used to store the authentication token.\
    \ By default, this is .ASPXAUTH. |\n| loginUrl | Specifies the URL to which the\
    \ application will redirect if a user is not authenticated and seeks access to\
    \ a protected resource. The default value is Login.aspx. |\n| protection | This\
    \ controls the amount of protection applied to the authentication cookie. The\
    \ four settings are: |\n| | All | ASP.NET uses both validation and encryption\
    \ to protect the cookie. This is the default setting. |\n| | None —Applies no\
    \ protection to the cookie (which is obviously not advisable and should be avoided).\
    \ |"
  merge: -1
  img_proc: true
- pgno: 183
  md: '# TABLE 7-2 (continued)


    | ATTRIBUTE | DESCRIPTION |

    | --- | --- |

    | | Encryption —ASP.NET encrypts the cookie, but does not validate it. This may
    leave your application open to attack. Validation —ASP.NET validates the cookie,
    but does not encrypt it. This may expose information to an attacker. |

    | path | Specifies the path for the authentication cookies issued by the application.
    The default value is /, /, and it is unlikely you will want to change this if
    you have a single Web application on your site. If you have multiple Web applications
    running on a single site (for example http://example.com/app1/ and http://example.com/app2/)
    and want to have a user log in for each application, then you can set the path
    to the directory containing your application. |

    | timeout | Specifies the amount of time (in minutes) an authentication cookie
    lasts for. The default value is 30 minutes. |

    | cookeless | If true, ASP.NET will use the URL for authentication information
    in the URL and not in a cookie. |

    | defaultUrl | Specifies the default URL a user will be redirected to if no redirect
    URL is specified. This defaults to default.aspx. |

    | domain | Specifies the domain name for the authentication cookie. |

    | slidingExpiration | If true, the authentication cookie expires with every request.
    |

    | enableCrossAppsRedirect | Specifies if crossapplication redirection of authenticated
    users is allowed. The default is false. |

    | requireSSL | Specifies if the authentication cookie can only be transmitted
    over SSL connections. |


    > NOTE The web.config example in Listing 7.2 shows usernames and passwords stored
    without any encryption or hashing. This obviously is strongly discouraged, but
    is suitable for demonstrating the login process.


    Of course, without a login page, users cannot authenticate. ASP.NET provides FormsAuthentication
    class to enable you to programmatically validate users against your data store.
    Listing 7-3 shows how to do this.'
