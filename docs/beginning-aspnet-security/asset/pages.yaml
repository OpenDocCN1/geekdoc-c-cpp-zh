- pgno: 416
  md: 'If the form submission contains Title and Content, the binding will update
    these properties automatically. But if the request is changed before it is sent,
    an Author field value added to it the default data, the binder will also set the
    Author property on the model, despite it being on the original form (because the
    model binder has no way of knowing what fields were on the edit form).


    There are a few approaches to fixing this. The most obvious is to avoid binding,
    and retrieve the form data from FormControl parameter in your Action. But this
    is laborious and error-prone. Another approach is to accept named parameters in
    your Action method, rather than a FormCollection, as shown here:


    ```

    [AcceptVerbs(HttpVerbs.Post)]

    public ActionResult Edit(int id, string Title, string Content)

    ```


    Another approach would be to create a specific View model for the Edit view, rather
    than relying on the core model exposed by your repository. The View model would
    only contain properties for the data edit, and any extra, tampered fields would
    be ignored.


    Binding can be locked down in a per-use basis by providing the data binder with
    a specific list of properties it can update. This is done by passing an array
    of strings containing the allowed properties, like:


    ```

    UpdateModel(boardPost, new string[] { "Title", "Content" });

    ```


    If you are passing an object to your Action method, rather than using a FormsCollection,
    the [Bind] attribute enables the include list functionality, as shown:


    ```

    [AcceptVerbs(HttpVerbs.Post)]

    public ActionResult Edit([Bind(Include = "Title, Content")]) BoardPost

    ```


    Finally, you can set binding rules on a type itself (or programmatically in global.asax
    —enabling to restrict binding on classes that you do not have for). Here is an
    example:


    ```

    [Bind(Include = "Title, Content")

    public partial class BoardPost {

    }

    ```


    In keeping with secure development best practices, the examples provided here
    use a whitelist approach, choosing properties that are specifically allowed for
    binding, rather than excluding properties (which is also supported). Whitelisting
    is safer, because any new properties added to your model are protected by default,
    and you must specifically enable them.


    # Providing Validation for Error Messages from Your Model


    While strictly a security problem, you will want to ensure that the data processed
    by your system is valid, and feedback is given to users if it is not. If your
    model provides validation, then the MVC framework will provide basic error-highlighting
    information for you. results of setting a rating on a post to 11 when the model
    limits it to values between 0 and 10 — the field causing a problem is highlighted
    and an asterisk is next to it.'
