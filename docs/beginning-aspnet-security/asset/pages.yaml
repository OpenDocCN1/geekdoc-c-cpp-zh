- pgno: 292
  md: '# Adding Security to an Internet Service


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_292_0.png)


    **FIGURE 11-8:** The Microsoft Security Configuration Editor


    Following the three steps to secure a WCF service that were mentioned previously,
    you must select a security mode, then the credential type, and finally, configure
    your service to use the new service type. Typically, authentication to Internet
    is either anonymous or via a username and password. Anonymous authentication does
    not mean that you are unprotected — it simply means a credential will not be required.
    However, Transport security will still protect the message against eavesdropping
    and sign it against changes.


    # TRY OUT Configuring an Internet-facing WCF Service for Transport Security


    In this exercise you will configure an internet-facing WCF service to use transport
    security.


    +   1. The first step in this exercise is to switch to use transport security.
    So you must choose a binding from Table 11-1 that supports this. use wsHttpPost.


    +   2. To configure the binding, start the Service Configuration Manager against
    the web.config file in the Web application, right-click on the Bindings in the
    Configuration window and choose New Binding Configuration. Choose wsHttpPost from
    the list presented and click OK. Enter a name of wsHttpPost in the name field,
    and change the HostNameComparisonMode to Exact. Now switch the Security tab and
    change the Mode to Transport, and the TransportCredentialType to None.


    +   3. Now expand the WCFSecurity.EchoService node in the Configuration window
    and open the Endpoints folder. There will be two endpoints already configured,
    each of which is labeled as (“Empty Name).” These are the original endpoints with
    no security configured. Right-click on each node and Delete Endpoint.'
  merge: -1
  img_proc: true
- pgno: 293
  md: "4. Now you must configure a new, secure endpoint. Right-click on the Endpoints\
