  md: "# 140 CHAPTER 6 KEEPING SECRETS — HASHING AND ENCRYPTION\n\nYou can see that\
    \ it is not quite simple as symmetric encryption. When you encrypt data using\
    \ a certificate, you must add a reference to the certificate whose public key\
    \ you used so the receiving side knows which certificate's private key to use\
    \ when decrypting. The standard way to do this is to use the CMS/PKCS#7 standard,\
    \ which creates an “envelope” around the encrypted data and adds a reference to\
    \ the message. Remember that you must add a reference to the System.Security assembly\
    \ to your project using the CMS/PKCS#7 classes.\n\n# Decrypting Your Data\n\n\
    Decrypting encrypted and formatted CMS/PKCS#7 is a simpler method. We decrypt\
    \ a CMS envelope from the cipher data, and the .NET framework will use the certificate\
    \ reference in the envelope to retrieve the certificate, with its private key,\
    \ and decrypt the data, as shown here:\n\n```\nstatic byte[] DecryptWithCertificate(byte[]\
    \ cipherText)\n{\n    EnvelopedCms envelopedCms = new EnvelopedCms();\n    envelopedCms.Decode(cipherText);\n\
    \    envelopedCms.Decrypt();\n\n    return envelopedCms.ContentInfo.Content;\n\
    }\n```\n\nYou may notice that you do not need to specify the certificate for decryption.\
    \ An encrypted message contains enough information for the decryption process\
    \ to automatically find the right certificate with which to decrypt.\n\n# Ensuring\
    \ That Data Does Not Change\n\nTo sign data, you use the SignedCms class. When\
    \ you sign a message, you use your own certificate, one for which you have both\
    \ the public and private key. Following is an example:\n\n```\nstatic byte[] SignWithCertificate(byte[]\
    \ clearText, X509Certificate certificate)\n{\n    // Load the clear text into\
    \ the CMS/PKCS #7’ data structure\n    ContentInfo contentInfoInfo = new ContentInfo(clearText);\n\
    \n    // Set who is signing the data\n    CmsSigner signer = new CmsSigner(certificate);\n\
    \n    // Create a suitable signed message structure\n    SignedCms signedCms =\
    \ new SignedCms(contentInfo);\n\n    // Sign the data\n    signedCms.ComputeSignature(signer);\n\
    \n    // Return the signed data structure\n    return signedCms.Encode();\n}\n\
    ```"
