  md: "Messages are sent to the logger when the Log button on the test page is clicked\
    \ by calling the log.Debug() method with the message to be logged. The logging\
    \ methods also have overload that takes an exception as well as a message.\nlog4net\
    \ supports five levels of messages: Debug, Info, Warn, Error, and Fatal. To log\
