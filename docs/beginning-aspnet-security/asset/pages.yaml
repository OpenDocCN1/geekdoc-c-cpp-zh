    \ to be an HTTP address, WCF will throw an exception because it knows HTTP cannot\
    \ implement transport security.\n\n# TRY OUT Adding Authentication to an Internet-Facing\
    \ Service\n\nNow that the message is protected, you can add authentication. Right\
    \ now, the service uses an authentication type of None. You are going to use a\
