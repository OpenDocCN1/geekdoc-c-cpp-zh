- pgno: 242
  md: "# Checking Your Application Can Access Files\n\nWhen you access a file in Windows,\
    \ the file system checks that your user account has permissions to use the file.\
    \ .NET programs have another layer of security that checks if the application\
    \ is authorized to use the file system. This extra security layer is called access\
    \ Security (CAS), which is covered in greater detail in Chapter 13. Without delving\
    \ the details, you can use the following steps to check application is authorized\
    \ to open files.\n\nThe process of checking your application authorization involves\
    \ constructing a FileIoPermission for the file application wishes to access, and\
    \ demanding that permission. If the demand fails, a SecurityException will be\
    \ thrown, and you can inform the user accordingly. If you were to change the code\
    \ you wrote previously to include a CAS demand, it would look like this:\n\n```\n\
    using System;\nusing System.IO;\nusing System.Security;\nusing System.Security.Permissions;\n\
    \npublic partial class class : System.Web.UI.Page\n{\n    protected void Page_Load(object\
    \ sender, EventArgs e)\n    {\n        Response.Clear();\n        string filename\
    \ = Path.GetFileName(Request.QueryString[\"filename\"]);\n        string fullPath\
    \ = Server.MapPath(\n            Path.Combine(\"c:\\inetpub\\wwwroot\", filename));\n\
    \        FileIoPermission accessPermission = \n            new FileIoPermission(FileIoPermission.Access.Read,\
    \ fullPath);\n\n        try\n        {\n            accessPermission.Demand();\n\
    \            FileInfo file = new FileInfo(\n                Path.Combine(\"documents\"\
    , filename));\n            Response.AddHeader(\"Content-Length\", file.Length.ToString());\n\
    \            Response.WriteFile(file.FileName);\n        }\n        catch (SecurityException)\n\
    \        {\n            Response.Write(\"Access Denied!\");\n        }\n\n   \
    \     Response.End();\n    }\n}\n```\n\nYou can see that this code now has two\
    \ namespaces:System.Security andSystem.Security.Permissions.System.Security.Permissions\
    \ contains the namespaces and classes for CAS. System.Security holds the SecurityException\
    \ class. To check if you have access to a file, you construct a new FileIoPermission\
    \ specifying the type of access desired (the ones used are Read, Write, Append,\
    \ and All Access), as well as the file you wish to access. If a file does not\
    \ exist, but you would have permission to it if it did (for example, the directory\
    \ that would hold"
  merge: -1
  img_proc: true
- pgno: 243
  md: 'it allows access), then the CAS permission will succeed. You must still check
    if a file exists or the process identity has access to after the CAS demand has
    taken place. Just because a CAS demand passes does not mean that your user application
    runs as cas the file.


    > NOTE If you are testing your application using Visual Studio''s builtin Web
    server, then the application will run under your user account, potentially masking
    any permission problems.


    # Making a File Downloadable and Setting Its Name


    You can use the Response headers to set the filename of the file being served
    using the Content-Disposition header like so:


    ```

    Response.AddHeader("Content-Disposition", "filename=&filename");

    ```


    Furthermore, you can useContent-Disposition to cause a download rather than rendering
    in the browser, as shown here:


    ```

    Response.AddHeader("Content-Disposition", "attachment; filename=&filename");

    ```


    # Adding Further Checks to File Access


    Once you have a secure mechanism to access files, you can expand the mechanism
    with more checks and features. Two of the most common uses are role-based file
    access and anti-leeching checks for images.


    # Adding Role Checks


    In IIS7, if your applications run in the default integrated pipeline, all file
    access is checked using the web.config authorization rules. In IIS6, or IIS7 class
    mode only, file types are mapped by IIS to the ASP.NET API extension, and access
    checks are performed on the currently logged-in user and the rules in web.config
    (authentication and authorization are covered in Chapter 7). If you are running
    under IIS6, or IIS7 classic, or you are following best practice and storing files
    you wish to serve programmatically outside your Web root, you must programmatically
    authorize file access.


    The easiest way to support role-based access to files is to have the serving page
    itself role-protected by ASP.NET, and separate the files into directories outside
    the Web root based on role. For example, if you only want to serve these files
    to members, but not to anonymous users, you could place the serving script in
    a members directory, and limit access to the serving page with the web.config
    file shown in Listing 9-2.'
  merge: -1
  img_proc: true
- pgno: 244
  md: "# LISTING 2: Denying unauthenticated users\n\n```\n```xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<configuration>\n  <system.web>\n    <authentication mode=\"Forms\"\
    \ />\n    <authorization>\n      <deny users=\"*\" />\n    </authorization>\n\
    \  </system.web>\n</configuration>```\n```\n\nYou may remember from Chapter 7\
    \ that deny users=\"*\" / will stop all unauthenticated users accessing the current\
    \ directory. If you want to be more specific and limit access to a particular\
    \ role (for example, if you have varying levels of membership), you can limit\
    \ access by role, as shown\n\n# LISTING 3: Denying unauthenticated users\n\n```\n\
    ```xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n  <system.web>\n\
    \    <authentication mode=\"Forms\" />\n    <authorization>\n      <allow roles=\"\
    GoldMember\" />\n      <deny users=\"*\" />\n    </authorization>\n  </system.web>\n\
    </configuration>```\n```\n\nIn this instance, you should practice defense-in-depth\
    \ (in case of, for example, an undiscovered vulnerability in forms authentication),\
    \ and you also have more complex authorization requirements that can only be expressed\
    \ in code. Programmatic role checking can take various approaches — the simplest\
    \ being a call to IsInRole on the User instance available within a page, as shown\
    \ here:\n\nHowever you addition, you should ensure that you do not allow ASP.NET\
    \ or IIS to cache the output of your serving code by specifying the output cache\
    \ in your ASP.NET page like this:\n\n```\n```<%@ OutputCache Duration=\"1\" Location=\"\
    None\" NoStore=\"true\" VarByParam=\"*\" %>```\n```\n\n# AntLeeching Checks\n\n\
    Another use for serving files code, not directly, is to stop leaching and hot-linking,\
