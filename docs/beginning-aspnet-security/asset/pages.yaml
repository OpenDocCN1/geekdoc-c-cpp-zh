    If you create a new ASP.NET web project and replace the contents of default.aspx
    with Listing 7.1, you will see something similar to Figure 7-1.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_180_0.png)


    **FIGURE 7-1:** Typical results of running the User Property Code


    You can see from Figure 7.1, or the results of running Listing 7.1, that you are
    an authenticated user. Your username will be your computer name, followed by a
    \ and then your web login name. So why were you authenticated in this way? The
    reason why it did lies in the web.config file, which contains authentication mode="Windows"/
    . This allows Windows ASP.NET to provide authentication, depending on your browser
    settings and the URL the application is running on, will automatically negotiate
    with the browser and log in silently. The Windows login method uses an authentication
    protocol called NT LAN Manager, or NTLM, which you can see the authentication
    type in the sample application.'
