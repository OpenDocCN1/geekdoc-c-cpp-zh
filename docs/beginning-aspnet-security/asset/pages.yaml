    6. Finally, in the page load event, the authentication cookie created by the authentication
    handler, and you use the WindowsLiveLogin class. If it goes well, you will see
    a GUID once you have authenticated with ID. This GUID is an identifier for the
    user that is unique to your application ID. Another developer using a separate
    application ID will see a different GUID, which guarantees the privacy of the
    user. You can then use the Live ID identifier as a primary key in your database
    for whatever purposes you like.


    # STRATEGY FOR INTEGRATING THIRDPARTY AUTHENTICATION WITH FORMS AUTHENTICATION


    You may have noticed that each of the third-party authentication methods give
    you your own type of identifier or user object, of which link to the ASP.NET authentication
    system. If you have an existing authentication system and want to use it with
    a third-party system, you have two approaches:


    +   - Drive new user registration using the unique identifiers each system provides

    - Add a custom database table where your unique identifiers are stored and checked,
    creating a suitable forms authentication once they are validated.


    To drive registration you can augment your registration page to accept a third-party
    login, read any of the claims, and create a membership user for them manually
    using the third-party unique identifier, identified by UserId in the following
    code snippet:


    ```

    MembershipUser=

    Membership.CreateUser(UserId, UserId,

    "emailFromRegistrationPageOrClaim");

    ```


    You can then respond to an authentication event in your login page and manually
    create the token using FormsAuthentication.RedirectFromLoginPage(UserId, true),
    where the Boolean value indicates if a persistence cookie is to be created.'
