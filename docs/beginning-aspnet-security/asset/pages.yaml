- pgno: 185
  md: "# 158 | CHAPTER 7 ADDING USNAMES AND PASSWORDS\n\nThe login functionality is\
    \ provided by two methods:\n\n+   - Authenticate, authenticates the user against\
    \ the user store.\n- RedirectFromLoginPage, redirects the user back to the page\
    \ originally requested. This method takes two parameters: the name of the user,\
    \ and a Boolean value indicating if a persistent authentication cookie should\
    \ be used.\n\nWhen you first attempted to load the protected page, you may have\
    \ noticed the URL, which will be something like this:\n\n```\nhttp://localhost:49231/login.aspx?ReturnUrl=%2fDefault.aspx\n\
    ```\n\nYou can see that ASP.NET redirects users to the login page, the page they\
    \ are trying to access is specified in the query string. This is used to redirect\
    \ users back to their original resource once a login has been successful.\n\n\
    Of course, using web.config as a store for your usernames and passwords is not\
    \ scalable, which is why ASP.NET provides a framework for writing membership stores\
    \ — the MembershipProvider. Of the box ASP.NET designed the membership system\
    \ using a provider model, other database suppliers (such as MySQL, Oracle, and\
    \ VistaDB) also have providers made for their databases. But using the one you\
    \ chose will be exactly the same.\n\n# Using SQL as a Membership Store\n\nsuitable\
    \ for storing authentication details. By default, ASP.NET is configured to use\
    \ a SQL Express database placed in your App_Data directory. The first time you\
    \ use one of the built-in ASP.NET regsql.exe utility found in the framework will\
    \ be created for you. Alternatively, you can use the (for example, C:\\Windows\\\
    Microsoft.NET\\Framework\\v2.0.50727). This will ask you to connect to an existing\
    \ server, and then create the membership tables, views, and stored procedures\
    \ for you.\n\nLet's start off by augmenting the custom login page and using the\
    \ built-in ASP.NET login control. Remember, this will create a suitable database\
    \ for listing. Listing 7-4 illustrates a simple use of the login control.\n\n\
    # LISTING-7-4 Using the ASP.NET login control\n\n```\n<@ Page Language=\"C# %>\n\
    <!DOCTYPE html>\n<! PUBLIC \"//W3C//DTD HTML 1.0 Transitional//EN\"\n \"http://www.w3.org/TR/html/xhtml-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\nhead runat=\"server\"\
    >\n<title>Login</title>\n</head>\n```\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_185_0.png)"
  merge: -1
  img_proc: true
