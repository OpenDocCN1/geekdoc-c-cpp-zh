- pgno: 197
  md: '![](img/742122f18de7bcb6f7bd43fe51fe45bd_197_0.png)


    FIGURE 7-6: The Windowsidentity properties


    # ADDING AUTHENTICATION TO INTERNET INFORMATION SERVER


    If you don''t see all the authentication options shown in Figure 7-6, it may be
    you have not installed them. By default, IIS7 does not install many features —
    it does not even enable ASP.NET support.


    To add features to IIS on Vista, use the Control Panel, choose the Programs option,
    and click "Turn features on or off." Expand "The World Wide Web", and then expand
    the "Security" settings. Tick the authentication options you would like to use.


    In Windows 2008, authentication is part of the role configuration. Using the Server
    Manager, add the "Web Server (IIS)" role. This will allow you to choose the various
    authentication methods. If you have already installed IIS, you can expand the
    roles tree. Select "Web Server (IIS)" and then use "Add Role Services" to add
    the various authentication types.


    Certain authentication types may not be available to you, depending on your computer
    configuration. For example, Client Certificate authentication is not available
    unless your computer is part of an Active Directory.'
