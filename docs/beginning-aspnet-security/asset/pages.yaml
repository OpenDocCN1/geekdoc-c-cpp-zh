- pgno: 96
  md: "# REQUEST FORGERY AND HOW TO AVOID IT\n\nIn 2008, Princeton University researchers\
    \ William Zeller and Edward W. Felten discovered vulnerabilities in four major\
    \ Web sites — including one against INGDirect, which allowed them to access a\
    \ victim's bank account and transfer money from one account to another. The attack\
    \ was made possible by forging a request who was already logged into INGDirect\
    \ to perform the money transfer, a vulnerability known as Cross Site Request Forgery\
    \ (CSRF). The transfer process is driven by multiple form submissions, which the\
    \ researchers authenticated by writing an HTML page that contained a copy of the\
    \ forms, and then submitted without user intervention via JavaScript. We read\
    \ their findings and the methods they used in the paper published at: http://citp.princeton.edu/csrf/.\n\
    \nIn order to understand how the attacks work, when a user logs into a Web site,\
    \ the Web site will generate create a cookie for the user's machine. From that\
    \ moment forward, the cookie expires or is deleted when the browser is closed,\
    \ that browser is authenticated and authorized by the Web site. If an authenticated\
    \ Web site is to send a request to the vulnerable Web site, the site has no way\
    \ of knowing that it is under attack. Since the Web site already trusts its cookie\
    \ (because of the authentication cookie), the Web site executes the request and\
    \ processes it as if the user had made the request deliberately. If a Web site\
    \ uses HTTP authentication (where the user is prompted for their username and\
    \ password by a dialog box in the browser, rather than an HTML page), then it\
    \ is the browser that has the user authenticated to the Web site and will send\
    \ the username and password with each subsequent request.\n\nConsider a simple\
    \ Web site that allows users to read and delete messages. The Web site has badly\
    \ written and the send message forms using query string parameters. For example,\
    \ http://www.example.com/sendMessage.aspx?to=boss@example.com&subject=I+ resign\
    \ message=Take+ this job and ... would send an email to boss@example.com explaining\
    \ the user has registered. An attacker has to exploit this is to somehow get the\
    \ user's browser to send a request for sendMessage.aspx, doing so is simple. The\
    \ attacker creates a Web page including the following code:\n\n```\nimg src=\"\
    http://www.example.com/ \nsendMessage.aspx?to=boss@example.com&subject=I+resign&message=\n\
    Take+this+joband... \">\n```\n\nIf an unfortunate user logged into example.com\
    \ and is lured to a page containing the img tag shown previously, the browser\
    \ will load it. The example.com Web application will receive the incoming request\
    \ and the authentication cookie it placed when the user logged in, recognize the\
    \ user, and run the code contained in sendMessage.aspx. The attacker's has forged\
    \ a request, sourced from the attacking site, but for the vulnerable Web site,\
    \ this crossing sites. Figure 4-1 shows how this type of CSRF works."
  merge: -1
  img_proc: true
