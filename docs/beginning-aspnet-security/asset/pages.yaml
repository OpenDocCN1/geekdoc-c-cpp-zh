- pgno: 140
  md: "Well-behaved robots can be controlled by using a robots.txt fle, or by adding\
    \ a ROBOTS metetag to your pages. Both of these approaches are de facto standards,\
    \ and depend on support in the crawling software. Robots can ignore these control\
    \ methods — malware searching for email addresses or security vulnerabilities\
    \ almost certainly will.\n\n# Controlling Robots with a Metatag\n\nIn individual\
    \ pages, you can add the ROBOTS metetag to tell robots not to index a page, and/or\
    \ not to follow any links within a page. To do this, add the following to your\
    \ HTML code:\n\n```\n<html>\n<head>\n  <title>...</title>\n  <meta name=\"ROBOTS\"\
    \ content=\"NOINDEX, NOFOLLOW\" />\n</head>\n...\n</html>\n```\n\nThen value for\
    \ the metag must be ROBOTS. The content value must be a combination of INDEX,\
    \ NOINDEX, FOLLOW, or NOFOLLOW. Obviously, only certain combinations make sense.\
    \ If no tag is specified, the default value will be \"INDEX, FOLLOW\".\n\n# Controlling\
    \ Robots with robots.txt\n\nAdding a metadata to every page on your Web site takes\
    \ some effort, and is prone to mistakes. Another way of controlling robots is\
    \ with a text file, robots.txt (the filename should be all lowercase). This file\
    \ should be placed in the root directory of your Web site. This file follows a\
    \ simple format, as shown in Listing 5.\n\n> LISTING5: A Sample robots.txt File\n\
    \n```\n# This is a comment in a robots.txt file\n\nUser-Agent: r2d2\nDisallow:\n\
    \nUser-Agent: c3po\nDisallow: /trashCompactor\n\nUser-Agent: *\nDisallow: /deathStarPlans\n\
    Disallow: /logs\n```\n\nIn the code shown in Listing 5, any robot that identifies\
    \ itself as \"r2d2\" has nothing disallowed. A robot that identifies itself as\
    \ \"c3po\" should not crawl through the /trashCompactor directory. Any other robots\
    \ should exclude the /deathStarPlans directory and the /logs directory. Each disallowed\
    \ line should only contain a single path, and wildcard characters are not supported\
    \ in paths."
  merge: -1
  img_proc: true
- pgno: 141
  md: 'To stop all well-behaved robots from crawling your site, your robots.txt file
    should contain the code shown in Listing 5-10.


    # LISTING 5-10: A Sample robots.txt File that Stops All Crawling


    ```

    User-agent:*

    Disallow: /

    ```


    Unfortunately, a robots.txt file can only contain disallowed areas. Attackers
    often check this file for directories where robots should not go, and attempt
    to load those directories to see what happens. One other thing to note is that
    the robots.txt file should be in a Unix format — this means only LineFeed marks
    the end of a file, not Carriage Return and Line Feed combination that Windows
    uses. You can use Visual Studio to save a file in the correct format by selecting
    File | Advanced Save and choosing Unix from the Line Ending drop-down menu.


    > WARNING If you are implementing your search service using indexing software
    (such as Microsoft Index Server or Lucerne), it is important that you work on
    a whitelist approach, choosing directories that should specifically be indexed,
    rather than excluding directories.


    # PERILS OF MICROSOFT INDEX SERVER


    Quite a few years ago, the author was asked to quickly create a search system
    on a simple Web site using Microsoft Index Server. Index Server was created to
    index the entire site, and everything was publicly available. Unfortunately, a
    member of the sales staff had access to the Web site, and few months later, created
    his own directory and started uploading files to exchange with others (including
    a document listing prices and margins). Index Server did as it was configured.
    It indexed this new directory and started serving files as search results for
    phrases such as “Price.\ Always be specific on directories and files that are
    included.


    # PROTECTING PASSWORDS IN CONFIG FILES


    Often, you will have multiple configuration files for your application — for example,
    one for development, one for staging, and one for live. You may upload new configuration
    files to your Web site, backing ASP.NET refuse to serve files ending in .config.
    A common mistake is to rename your existing file to web.config.backup or .config.bak—files
    that ASP.NET will never serve. A lot of security scanning software will work for
    these common filenames and retrieve them.


    Your configuration files may include sensitive information (such as database passwords
    in connection strings, mail server usernames, and so on). ASP.NET provides functionality
    to encrypt sections of a configuration file and automatically decrypt them.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "At its simplest, you can encrypt a section in the web.config fle by opening\
    \ a command line\nprom, changing to the directory holding the web.config fle you\
    \ wish to encrypt parts of, and, by\nusing the aspnet_regiis, specify the section\
    \ you encrypted.\n\n```\naspnet_regiis -pef SecretSection\n```\n\nTheaspnet_regiis\
    \ utility is found in the .NET framework installation folder, %windows%\nMicrosoft.NET\\\
    Framework\\v2.0.50727.\n\nThe drawback to this approach is, if the web.config\
    \ fle is moved to another server, decryption\nwill fail. If you have multiple\
    \ servers in a Web farm, the command must be on every server.\nFor this scenario,\
    \ you must use a Rivest, Shamir, Adleman (RSA) key container that can be exported\n\
    from one machine and imported onto another. In an elevated command prompt (right-click\n\
    the command prompt and choose \"Run as administrator\") the following steps will\
    \ create an\\RSA key container and then export it:\n\n+   1. Create a new key\
    \ for exporting:\n   aspnet_regiis -pc MyConfigurationKey\n   -size 2048 -exp\n\
    2. Export the key to an XML file:\n   aspnet_regiis -px MyConfigurationKey\n \
    \  c:\\myconfigurationkey.xml\n3. Import the key on every server:\n   aspnet_regiis\
    \ -pi MyConfigurationKey\n   myconfigurationkey.xml\n4. Set permissions on the\
    \ key container for the account under which your application runs:\n   aspnet_regiis\
    \ -pa MyConfigurationKey\n   \"machineName\\=Account\"\n\nOnce you move to a key\
    \ container, you must add a section to your configuration file to tell ASP.NET\n\
    that you want to use your new key container. The following snippet from a web.config\
    \ fle replaces\nt default configuration provider with one that uses your custom\
    \ configuration key:\n\n```\n<configuration>\n  <configProtectedData>\n    <providers>\n\
    \      <remove name=\"RsaProtectedConfigurationProvider\"/>\n      <add name=\"\
    RsaProtectedConfigurationProvider\"\n           type=\"System.Configuration.RsaProtectedConfigurationProvider,\n\
    \           System.Configuration, Version=2.0.0.0, Culture=neutral,\n        \
    \   PublicKeyToken=b0b3f5f71d50a3a\"\n           keyContainerName=\"MyConfigurationKey\"\
    \n           cspProviderName=\"\"\n           useASEP=\"false\"\n           useMachineContainer=\"\
    true\" />\n    </providers>\n  </configProtectedData>\n</configuration>\n```"
  merge: -1
