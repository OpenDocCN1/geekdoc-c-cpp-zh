- pgno: 267
  md: '# 240 | CHAPTER 10 SECURING XML


    LISTING 10-1 (continued)


    ```

    // Replace the original element with the encrypted data

    // and algorithm information

    EncryptedXml.ReplaceElement(

    elementToEncrypt, encryptedData, false);

    )

    ```


    The code searches for the XML document for the specified element, encrypts it
    into an Xml object. This is then encrypted by the EncryptedData method of the
    EncryptedXml class. At this point, you have the encrypted data, but this must
    be formatted before it can be used.


    TheEncryptedData class is used to encapsulate everything needed to create a correctly
    encrypted element, and an instance of this class is created. The EncryptionMethod
    property is set to identify the algorithm used, and the encrypted data is added
    to the CipherValue property of the CipherData property of the EncryptedData class.
    Finally, the ReplaceElement method of the EncryptedXml class is used to replace
    the clear element in the original document with the correctly formatted encrypted
    element.


    Now, say you have the sample document in Listing 10-2.


    LISTING 10-2: A sample document for encryption


    ```

    <xml version="1.0" encoding="utf-8" ?>

    <envelope>

    <to>barryd@idunno.org</to>

    <from>yourbank@bank.com</from>

    <message>You have just been paid.</message>

    </envelope>

    ```


    You could then encrypt the message using the following snippet:


    ```

    XmlDocument document = new XmlDocument

    {

    PreserveWhitespace = true

    };

    // Load the document and then continue.

    RijndaelManaged algorithm = new RijndaelManaged();

    Encrypt(document, "message", algorithm);

    ```


    You may remember from Chapter 6 that creating a new instance of a symmetric algorithm
    will create encryption keys automatically, but so does not set any keys. In production,
    you would load the keys from a secure key store, or save the keys securely after
    you have used them. The encrypted XML would look like this (the CipherValue element
    has been truncated for ease of publishing):


    ```

    <xml version="1.0" encoding="utf-8"?>

    <envelope>

    <to>barryd@idunno.org</to>

    <from>yourbank@bank.com</from>

    ```'
