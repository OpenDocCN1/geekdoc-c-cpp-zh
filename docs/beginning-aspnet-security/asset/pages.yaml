- pgno: 260
  md: 'To validate, you must first create an instance of the XmlReaderSettings class
    and set the validation type, flags, and a callback method. After that, you must
    load your XML schema into an XmlSchema object and attach it to the settings instance.
    Once you have both the settings configured, you can use them with an XmlReader
    to populate your XmlDocument.


    Every time an error is encountered in the document, the callback function will
    be called. In this example, this simply sets a flag to say the document was invalid.
    However, in a real life scenario, you would probably want to read each error from
    the ValidationError and log the errors, or display error messages to the user.


    # 9. Run your new page and see if your XML validates against the schema you created.
    Invalidate your XML and see what happens.


    There are other ways of validating with schemas and DTDs. These are documented
    in the Microsoft KB articles 307379 (C#) and 315533 (VB).


    A strictly defined schema is a powerful tool in validating any XML input or ensuring
    that you output valid XML. Without a schema, your parsing functionality might
    crash, or unexpected data may slip through. Schemas can include information on
    the type of element, maximum and minimum occurrences, lengths of elements or attributes,
    the order of data, and even enumeration values.


    The previous sample used local schemas to validate. However, when you write XML
    third-party schemas, these schemas may be hosted on external URIs.


    TheReaderSettings class exposes a property, XmlResolver. By default, this is configured
    to use a default resolver with no user credentials. If your application is hosted
    behind a proxy that requires authentication, you must create an XmlResolver instance
    and set the Credentials properly. However, the use of external schemas introduces
    a dependency on their availability, and your server''s availability to retrieve
    them. Also, retrieved XML schema definitions (XSDs) are not cached.


    You may want to consider retrieving schemas and adding them to your solution,
    or implementing a custom XmlResolver that caches schemas. MSDN has an example
    of a custom, caching resolver available at http://msdn.microsoft.com/en-us/library/bb669135.aspx.


    You should also consider exposing your schemas using your data formats. This will
    enable you to validate before sharing your information, and, hopefully, reduce
    the number of errors you encounter. If you publish your schema on an HTTPS URI,
    the connecting clients will have a way to check the identity of the server hosting
    the schema. Of course, you should not not rely on a third-party XML document conforming
    to your schema, and perform your own validation.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "# QUERYING XML\n\n> NOTE One thing to consider when validating is XML normalization.\
    \ Normalization controls how a parser handles things like whitespace, character\
    \ cases, and default attribute values. This is potentially dangerous, because\
    \ character-encoded values (those specified by the Unicode values, as &#0;) slip\
    \ through validation, and may cause problems when you manipulate the data.\nTheReaderSettings\
    \ class contains the CheckCharacters property that configures the reader to check\
    \ for potentially invalid characters. The default value is true. Other properties\
    \ that may affect validation include IgnoreComments, IgnoreProcessingInstructions,\
    \ and IgnoreWhitespace.\n\nOf course, XML, like any data format, is limited in\
    \ use unless you process it. While simple processing sending a document is fairly\
    \ trivial, XML has its own language, XPath. XPath allows a developer to select\
    \ elements in a document or query filter. Major use of XPath is with XML Transformations\
    \ (XSLTs), where you can style parts of the presentation of an XML document by\
    \ selecting the data (or nodes, in XPath) and apply a transformation or style\
    \ to them.\n\nUsing thebooks.xml data presented in this chapter, you can select\
    \ all the available bookTitles by executing a suitable XPath:\n\n```\nXmlNodeList\
    \ bookTitles =\nxmlDocument.SelectNodes(\"/Books/Book/Title\");\nforeach (XmlNode\
    \ bookTitle in bookTitles)\n{\n  // Do something with the node.\n```\n\nYou can\
    \ perform other queries using XPath expressions. For example /Books/Book[1] would\
    \ select the first Book in the document and /Books/Book[last()] would select the\
    \ last Book node in the document.\n\nFurthermore, like SQL, you can query specific\
    \ values. The following code snippet would select all books with more than 400\
    \ pages:\n\n```\nXmlNodeList bookTitles =\nxmlDocument.SelectNodes(\"/Books/Book[Pages=400]\"\
    );\nforeach (XmlNode bookTitle in bookTitles)\n{\n  // Do something with the node.\n\
    ```\n\nIt is this type of query that is open to abuse. Like SQL queries, XPath\
    \ expressions can be vulnerable to injection attacks. Consider the following XML\
    \ document:"
  merge: -1
  img_proc: true
- pgno: 262
  md: "```\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<Accounts>\n  <Account ID=\"\
    1\">\n    <FirstName>Phil</FirstName>\n    <LastName>Pursglove</LastName>\n  \
    \  <Username>ppursglo</Username>\n    <Password>secret</Password>\n  </Account>\n\
    \  <Account ID=\"2\">\n    <FirstName>Richard</FirstName>\n    <LastName>Hopton</LastName>\n\
    \    <Username>rhopon</Username>\n    <Password>pass</Password>\n  </Account>\n\
    </Accounts>\n```\n\nThe following XPath expression would check a login for the\
    \ user 'ppursglo', returning the username if the specified account and password\
    \ match:\n\n```\nstring(//Account[Username/text()='ppursglo' and\nPassword/text()='secret']/Username/text())\n\
    ```\n\nOften, these queries will be built via code, using concatenation or string.\
    \ Format like this:\n\n```\nXPathNavigator navigator =\nxmlDocument.CreateNavigator();\n\
    XPath expression = navigator.Compile(\n  \"//Account[Username/text()=\" + username\
    \ + \" and \" + +\n  \"/Password/text()='\" + password + \"']']/Username/text())\"\
    ;\nstring count = Convert.ToString(navigator.Evaluate(expression));\n```\n\nIf\
    \ you have already read Chapter 8, this might look familiar. By appending ' or\
    \ ''=' to both the username and password, an attacker can change the expression\
    \ to always return the first username from the XML data. XPath does not have the\
    \ equivalent of a comment operator, the mechanism for injection is slightly different.\
    \ This query will always return a value, because or operators will always cause\
    \ a value to be returned.\n\n> This vulnerability is known as XQuery Injection,\
    \ another member of the injection family of vulnerabilities that attackers can\
    \ use to \"inject\" extra clauses into your queries.\n\nAdministrative users are\
    \ usually configured before normal users, it's likely that an authentication system\
    \ attacked by the string above would validate the attacker as an administrative\
    \ account. Like SQL injection, error information from a stack can start to give\
    \ out information about the XML document containing the data. For example, if\
    \ an attacker"
  merge: -1
  img_proc: true
- pgno: 263
  md: 'entered a apostrophe as the username, and your Web site was configured to show
    full error information, the screen shown in Figure 10-2 would.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_263_0.png)


    FIGURE 10-2: An error after entering an apostrophe as a user name


    With such information, attackers could discover to steal the length of field names
    that they know. node(position()=1)=4 or string-length(/Username)=1 would change
    the query to ask if the length of the first username was 4 characters. If the
    answer were true, the application would react if a proper login had taken place.


    This sort of attack can be easily automated until the schema and length of all
    fields is discovered."Blind XPath Injection," a paper by Amit Klein (from available
    http://www.modsecurity.org/archive/blind-xpath-injection.pdf) details how an attacker
    can build up of a schema and gradually extract the full XML from a document.


    # # Avoiding XPath Injection


    just like SQL injection, XPath injection can be avoided by using a parameterized
    XPath expression and passing input as a parameter value. This has added the bonus
    of enabling you to reuse a compiled XPath expression, saving CPU cycles.'
  merge: -1
  img_proc: true
- pgno: 264
  md: "The .NET framework provides support for parameterized expressions via the XsltContext\
    \ class. This class acts as a wrapper around the XSLT processor used by XPath,\
    \ and programmatically allows you to replace parameter markers with their values\
    \ as the expression is parsed. This approach, if possible, is a lot of hard work,\
    \ and is poorly documented. Daniel Cazolino (an XML MVP) has released mvp-xml,\
    \ an Open Source library from http://mvpxml.codeplex.com/ that makes parameterized\
    \ queries easier to.\n\nFor example, using the previous username and password\
    \ expression, you can change it to become parameterized like:\n\n```\nstring xPath\
    \ =\n  \"string(//Account[Username/text()=$username] +\n  and * +\n  \"[Password/text()=$password]/Username/text())\"\
    ;\n\n// This could be performed in a constructor to avoid\n// the CPU hit needed\
    \ each time an expression is compiled.\nXPathNavigator navigator = xmlDocument.CreateNavigator();\n\
    XPathExpression expression = DynamicContext.Compile(xPath);\n```\n\n```\nDynamicContext\
    \ ctx = new DynamicContext();\nctx.AddVariable(\"username\", username);\nctx.AddVariable(\"\
    password\", password);\nexpression.SetContext(ctx);\n```\n\n```\nstring account\
    \ =\nConvert.ToString(navigator.Evaluate(expression));\n```\n\nYou can see that,\
    \ by compiling the XPath expression through the XPathNavigator class, it is instead\
    \ compiled through the DynamicContext class, found in the mvp.Xml.Common namespace.\
    \ The XPath expression contains parameters, indicated by a $. For example, $username\
    \ is a parameter named username. Then, when you use the expression, you create\
    \ a new instance of DynamicContent, add the parameters to it, and finally, execute\
    \ the methods you want to use on the XPathNavigator.\n\n> WARNING Remember that\
    \ you should treat XML as untrusted input at all times. If you are using data\
    \ extracted from it as content on your Web page, then you should encode it correctly\
    \ (as detailed in Chapter 3) to avoid Cross Site Scripting (XSS) attacks.\n\n\
    # SECURING XML DOCUMENTS\n\nXML has its own standard for encryption and signing.\
    \ The encryption standard (KMLEnc) specifies how a document should be encrypted,\
    \ and how the encryption keys are exchanged. It is published at http://www.w3.org/TR/xmlenc-core/.\
    \ The standard for signing XML (XMLDSig) can be found at http://www.w3.org/TR/xmldsig-core/\
    \ ."
  merge: -1
  img_proc: true
- pgno: 265
  md: "You may recall from Chapter 6 that encryption allows you to hide the contents\
    \ of a document (or elements within a document) so that only a receiver with suitable\
    \ keys can decrypt it. XML can be signed with X509 certificates or an asymmetric\
    \ key, and can be encrypted with X509 certificates, a shared key, or an asymmetric\
    \ key. However, encryption does not prove an XML document has not changed, does\
    \ it prove who encrypted it—the addition of a digital signature provides this.\
    \ If you haven't already read Chapter 6 and are unsure about cryptography, you\
    \ should read it before continuing with this section.\n\nThe same guidelines that\
    \ apply to cryptographic systems generally apply to XML encryption, including\
    \ the selection of key lengths, algorithms, and the situations suitable to them.\
    \ These rules are covered in Chapter 6. (If you have not read that chapter yet,\
    \ now would be a good time to do so.)\n\n# Encrypting XML Documents\n\nWhen XML\
    \ is encrypted, the entire document may be encrypted, or encryption may only be\
    \ applied to particular elements. In addition to the encrypted XML, anXmlElement\
    \ will also contain information on the encryption algorithm used when the document\
    \ was encrypted, as well as references to the encryption keys used.\nThe classes\
    \ for XML cryptographic functions are contained in the System.Security.Cryptography\
    \ namespace, which is part of the System.Security assembly.\n\n# Using a Symmetric\
    \ Encryption Key with XML\n\nWhen you use a symmetric algorithm (such as AES)\
    \ you must use the same key to encrypt and decrypt the data, and both parties\
    \ must agree on the key and the algorithm. Generally, this is suitable when a\
    \ single application must encrypt and decrypt data.\nListing 10 shows a suitable\
    \ for encrypting an XML element within a document. This takes a document, the\
    \ element to encrypt, and a populated instance of a symmetric algorithm.\n\n>\
    \ LISTING 10: Encrypting XML using a symmetric key\n\n```\npublic static void\
    \ Encrypt(XmlDocument document,\n    string elementNameToToEncrypt,\n    SymmetricAlgorithm\
    \ algorithm)\n{\n    // Check the arguments.\n    if (document == null)\n    \
    \    throw new ArgumentNullException(\"document\");\n    if (elementNameToToEncrypt\
    \ == null)\n        throw new ArgumentNullException(\"elementNameToToEncrypt\"\
    );\n    if (algorithm == null)\n        throw new ArgumentNullException(\"key\"\
    );\n\n    // Extract the element to encrypt.\n    XmlElement elementToEncrypt\
    \ =\n        document.GetElementsByTagName(\n            elementNameToToEncrypt)[0]\n\
    \        as XmlElement;\n```"
