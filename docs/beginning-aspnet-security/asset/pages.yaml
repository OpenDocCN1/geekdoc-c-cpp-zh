- pgno: 229
  md: 'SQL 2008 adds transparent encryption, which encrypts the entire database, by
    encrypting the database files themselves. Because this discussion serves as a
    very simple introduction to SQL encryption, transparent encryption and certificate
    encryption (which varies according to the version of SQL you are using) cannot
    be easily created. Microsoft has a number of papers on SQL security, including
    SQL cryptography in general, and transparent encryption. You can find published
    on MSDN at http://msdn.microsoft.com/en-us/library/dd631807(sql.10).aspx.


    # Encrypting by Pass Phrase


    The easiest encryption mechanism is to use a pass phrase. The following SQL snippet
    encrypts a string using a pass phrase, and then decrypts it:


    ```

    DECLARE @plaintext AS VARCHAR(128)

    DECLARE @passPhrase AS VARCHAR(64)

    DECLARE @encryptedText AS VARBINARY(MAX)

    DECLARE @decryptedText AS VARBINARY(MAX)


    SET @plaintext = ''MySecret''

    SET @passPhrase = ''T0p!Secr3''


    SET @encryptedText = EncryptByPassPhrase(@passPhrase, @plaintext)


    PRINT @encryptedText


    SET @decryptedText = DecryptByPassPhrase(@passPhrase, @encryptedText)


    PRINT CONVERT(VARCHAR(100), @decryptedText)

    ```


    If the wrong password is specified, the decryption function will return null.


    # SQL Symmetric Encryption


    Now let''s look at symmetric encryption. You will remember from Chapter 6 that
    this uses the same key for both encryption and decryption. To use symmetric encryption,
    you must first create the key you wish to use. The simplest type of symmetric
    key is protected by a password, and is created as follows:


    ```

    CREATE SYMMETRIC KEY MySymmetricKey

    WITH ALGORITHM = AES_128

    ENCRYPTION BY PASSWORD = ''N''AsSuperStrongPassword''

    ```


    This creates a key namedSymmetricKey in the master database, using the AES algorithm
    with a key length of 128. SQL Server supports DES, 3DES, AES, RC2 and decrypted
    RC4. You can check which keys exist by running the following command:


    ```

    SELECT * FROM sys.symmetric_keys

    ```


    Once you have a key, you must open it before use, using the password you specified
    when you created it. Then you can encrypt and decrypt as shown in the following
    example:'
  merge: -1
  img_proc: true
- pgno: 230
  md: "```\nDECLARE @plainText VARCHAR(100)\nDECLARE @encryptedText BINARY(MAX)\n\
    DECLARE @decryptedText BINARY(MAX)\n\nSET @plainText = 'Hello AES'\n\nOPEN SYMMETRIC\
    \ KEY MySymmetricKey\n  DECRYPTION BY PASSWORD = N'ASuperStrongPassword'\n\nSET\
    \ @encryptedText = \n  EncryptByKey(GUID('MySymmetricKey'), @plainText)\nPRINT\
    \ @encryptedText\n\nSET @decryptedText = DecryptByKey(@encryptedText);\n```\n\n\
    You can delete a symmetric key using the dropcmd command, as shown here:\n\n```\n\
    DROP SYMMETRIC KEY MySymmetricKey\n```\n\nOf course, once you delete a key, you\
    \ will no longer be able to decrypt any information that had been encrypted with\
    \ it. You can control access to the key by granting permission to it. The following\
    \ example grant read access to the key to the user ScottGal in the current database:\n\
    \n```\nGRANT VIEW DEFINITION ON\nSYMMETRIC KEY::MySymmetricKey To ScottGal\n```\n\
    \nThe symmetric encryption functions can also take an authenticator. Authenticators\
    \ stop the inference of data from encrypted fields, and lock an encrypted field\
    \ to the authenticator. For example, consider the table of outgoing payments shown\
    \ in Table 8-2.\n\n# TABLE 8-2: Outgoing Payments\n\n| PAYMENTID | COMPANY | VALUE\
    \ |\n|---|---||\n| 1 | ComputerSupplier | Bd7E17^ghds00 |\n| 2 |ing Inc. | C977^E99&01D\
    \ |\n| 3 | Paper Is Us | A76Ashdka&& |\n\nIt's likely that the value of payments\
    \ to the ComputerSupplier is higher than that of Sandwiches Inc. If any attacker\
    \ has control over Sandwiches Inc., he or she could increase the payment sent\
    \ to that company by taking the value for ComputerSupplier and using it to update\
    \ the value of the payment sent to Sandwiches Inc."
  merge: -1
  img_proc: true
- pgno: 231
  md: 'By specifying an authenticator value when encrypting, the encrypted value will
    be unique for

    that authenticator. In Table 8-2, the payment ID is a suitable authenticator value.
    If the wrong

    authenticator value is supplied during decryption, the decryption will fail. So,
    if an attacker

    were to take the value of payment ID 1 and put it into the value of payment ID
    2 , then the

    dryption process would not work.


    To use an authenticator, simply add it as the final parameter to EncryptByKey
    and DecryptByKey,

    like so:


    ```

    SET @encryptedText =

    EncryptByKey(KEY_GUID(''MySymmetricKey''),@plaintext, @authenticator);


    SET @decryptedText = DecryptByKey(@encryptedText, @authenticator);

    ```


    # SQL Asymmetric Encryption


    To create an asymmetric key, the process is much like that for symmetric keys:


    Like .NET, only one asymmetric algorithm is available, RSA. You can specify the
    key length by

    using RSA_512,RSA_1024 or RSA_2048 when creating the key. You probably won''t
    be surprised to

    learn that you can check which keys exist by running the following command:


    ```

    SELECT * FROM sys.asymmetric_keys

    ```


    Encrypting with an asymmetric key does not need anything special because, of course,
    public keys

    are generally public. Decrypting with an asymmetric key needs the key password.


    ```

    DECLARE @plaintext AS VARCHAR(100)

    DECLARE @encryptedText BINARY(MAX)

    DECLARE @decryptedText BINARY(MAX)


    SET @plaintext = ''Hello RSA''


    SET @encryptedText =

    EncryptByAsymmetricKey(AsymmetricKey_ID(''MyAsymmetricKey''),@plaintext);

    PRINT @encryptedText


    SET @decryptedText = DecryptByAsymmetricKey(AsymmetricKey_ID(''MyAsymmetricKey''),

    @encryptedText, N''AnotherStrongPassword'');

    ```


    Like before, you can delete an asymmetric key using the drop command, as shown
    here:


    ```

    DROP ASYMMETRIC KEY MyAsymmetricKey

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'You can control access to the public key by granting permission to it. The
    following example grants read access to the public key to the user ScottGal in
    the current database. Access to the private key is still controlled by the use
    of the key password.


    ```

    GRANT DEFINITION ON

    ASYMMMMETRIC KEY::MyAsymmetricKey To ScottGal

    ```


    # Calculating Hashes and HMACs in SQL


    Of course, detecting changes to data encryption is not enough. You must produce
    a MAC. SQL provides the HashBytes function that will provide a SHA, SHA1, MD2,
    MD4, or MD5 hash of data. Used in combination with the encryption key, this can
    produce an HMAC value, allowing you to check the integrity of the encrypted data.
    Raul Garcia has a good example of this on his blog at http://blogs.msdn.com/raulga/archive/2006/03/11/549754.aspx.


    # A CHECKLIST FOR SECURELY ACCESSING DATABASES


    The following is a checklist of items to follow when writing data-access code:


    +   - Never dynamically build SQL queries—Dynamic queries are a vector for SQL
    injection.

    - Always use SQL parameters—SQL parameters will automatically escape dangerous
    characters and help you void SQL injection.

    - Control access to your data—If you can, use stored procedures and SQL permissions
    to limit access to the underlying database. If you cannot use stored procedures,
    use updatable views to limit access to the underlying database. Stored procedures
    are not a panacea because they can, in turn, contain SQL themselves.'
  merge: -1
  img_proc: true
