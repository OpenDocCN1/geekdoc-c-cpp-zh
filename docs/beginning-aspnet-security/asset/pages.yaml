    \ KoanyasustiusWilliams, which exceeds the arbitrary upper limit of 50 characters.\
    \ The regular expression for name also excludes characters such as an apostrophe\
    \ ('), so anyone with a surname of O'Dell, for example, would not be accepted.\
    \ The regular expression simply checks the format of the email, looking for text\
    \ made of characters or numbers, an @ sign and more text to the right of the @\
    \ sign, a period, and then a minimum of three characters. This excludes many email\
    \ addresses and, of course, there is no way to tell if an email address is valid\
    \ without sending a message to it and requiring a response.\n\nFurthermore, the\
    \ validation function does not indicate whether it failed or if there was more\
    \ than a single failure. This makes it difficult for the user to figure out why\
    \ input was rejected. The code runs on the server, so a user must submit the form\
    \ before being told that the validation failed.\n\nAdding validation functions\
    \ to every form is a laborious process, and one that is prone to error. ASP.NET\
    \ includes validation controls that allow you to minimize the coding you must\
    \ perform, and, if the validation controls provided as standard are not suitable,\
    \ you can write your own.\n\n# Validation Controls\n\nAll ASP.NET validation controls\
    \ are normal ASP.NET controls that also implement the IValidator interface, as\
    \ shown here:\n\n```\npublic interface IValidator\n(\n    void Validate();\n \
    \   string ErrorMessage { get; set; }\n    bool IsValid { get; set; }\n)\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "As you can see, the validator interface defines two properties (ErrorMessage\
    \ and IsValid) and a single method (Validate). When a control is placed on a page,\
    \ it adds itself to the Validators collection. The Page class provides a Validate\
    \ method that iterates through the Validators, calling each registered control.\
    \ Each control performs validation logic has been written, and then sets the IsValid\
    \ and ErrorMessage properties appropriately. Each standard validation control\
    \ also has a ControlToValidate property that attaches the validation to the input\
    \ you wish to validate.\n\nnASP.NET controls that trigger a postback have a CausesValidation\
    \ property. When set to true , a postback will cause the page's Validate method\
    \ to be called before any of the control event handlers run. Some controls (such\
    \ as Button) have a default CausesValidation value of false; others (generally\
    \ those that do not automatically trigger a postback) do not.\n\nPage processing\
    \ does not stop when validation fails. Instead, the property IsValid is set to\
    \ false. It is up to you (the developer) to check this property and decide execution\
    \ should continue. If validation has not occurred at all, and you attempt to check\
    \ Page.IsValid, an exception will occur.\n\nIn addition to the ErrorMessage property\
    \ (which can be shown in the ValidationSummary control), the standard ASP.NET\
    \ validation controls also provide a Text property. This property can be used\
    \ to provide a visual indicator beside a field that has failed validation, as\
    \ shown in Figure 3-6.\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_83_0.png)\n\
    \nFIGURE 3-6: An example validation screen showing a validation summary and validation\
    \ controls\n\nThe screen displayed in Figure 3-6 shows the basic validation controls\
    \ in action. The form that produced this screen is as follows:\n\n```\n<form id=\"\
    form1\" run=\"server\">\n  <asp:ValidationSummary ID=\"ValidationSummary\" runat=\"\
    server\" />\nName: <asp:TextBox run=\"server\" ID=\"name\"><asp:TextBox\n  <asp:RequiredFieldValidator\
    \ ID=\"RequiredValidator\" runat=\"server\"\n  ErrorMessage=\"You must enter your\
    \ name\" ControlToValidate=\"name\"\n  Display=\"Dynamic\" Text=\"*\" />\n  <br\
    \ />Email: <asp:TextBox runat=\"server\" ID=\"email\" />\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Validating Form Input\n\n```\n<asp:RequiredValidator ID=\"emailRequired\"\
    \ run=\"server\"\n  ErrorMessage=\"You must enter your email\"\n  ControlToValidate=\"\
    email\" Display=\"Dynamic\" Text=\"* />\n<asp:RegularExpressionValidator ID=\"\
    emailValidator\" run=\"server\"\n  ErrorMessage=\"Your email address does not\
