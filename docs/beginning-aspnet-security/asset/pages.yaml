- pgno: 386
  md: '# 15


    # # Third Party Authentication


    As you browse the Web and register on various sites, it becomes problematic to
    remember the username and password for each new site you visit. You have several
    choices:


    +   - Use the same username and password everywhere (meaning if one Web site gets
    hacked, or your trust in the company keeping your information secret is misplaced,
    then your login information for other sites is now at)

    - Use individual usernames and passwords and rely on the browser to remember them
    for you (as well as to remember back up your authentication list)

    - Install a password program where passwords are created and stored on your computer
    and are automatically or manually put into the browser, or

    - Use a browser plugin to generate strong passwords and store them in a third-party
    service (hoping that the service continues)


    In this chapter, you will learn about the following:


    +   - The history of third party authentication

    - How to integrate Security Assertion Markup Language (SAML)/Information Cards
    into your Web site

    - How to integrate OpenID into your Web site

    - How to integrate Windows Live ID into your Web site


    (SAML)/Information Cards, OpenID, and Live ID are all ways of delivering a third-party
    authentication token to your Web site.


    # ## A BRIEF HISTORY OF FEDERATED IDENTITY


    Federated identity is a generic term describing the scenario where a user''s identity
    can be used across multiple systems, within a single organization, or on systems
    external to the organization providing the identity. The term describes the technology
    and standards that'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# 30 | CHAPTER 15 THIRD-PARTY AUTHENTICATION


    enable this. The end goal is to enable users of one domain (be it a company, an
    '' provider, a Live ID user, or any other identity provider) to seamlessly and
    secure access to systems or data belonging to another domain, without each system
    having to maintain its own redundant user administration functions.


    Imagine that W wants to give Amazon access to a database containing information
    about new books. While it''s certainly possible for an administrator at Wrox to
    create an authentication system and add user details for Amazon accounts, this
    would rapidly become unwieldy. In addition, Amazon members would have to Wrox
    of new accounts, and when to disable old accounts as their staff make new jobs
    with other companies. A better approach would be to let Amazon provide the authentication
    against their internal systems (as Active Directory), and forward details of the
    users (such as their names, their job titles, and so on), and for Wrox to use
    this information to authorize and grant or deny access parts of the Wrox system
    appropriately.


    By doing this, Wrox''s application would be known as a relying party (RP). The
    RP requests the user''s identity, and the user is directed to log into an identity
    provider (IP), which, in the example, is a system within Amazon. This may be via
    the browser, via a special client that runs on the user''s computer (sometimes
    called an identity selector), or provided automatically for them by some internal
    corporate system. The identity provider authenticates the user and packages information
    about the user''s identity, which is then sent to the RP, either from the IP or
    via the user, which processes it and allows access as appropriate. Figure 15-1
    shows this process.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_387_0.png)


    FIGURE 15-1: The typical flow for accessing information through your federated
    identity'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# A Brief History of Federated Identity


    The first major Web-based federation identity solution was Microsoft’s Passport
    service, which was designed as a "single sign-on" server for e-commerce sites.
    Microsoft Passport had various problems, including privacy and security concerns,
    as well as a lack of adoption from both customers and other companies.


    In response to Passport, the Liberty Alliance was created by Sun, Oracle, and
    other rivals as an alternative identity system. While their implementation was
    never widely adopted, they did release specifications for federated identity to
    the Organization for the Advancement of Structured Information Standards (OASIS),
    which it formed the base for the Security Authentication Markup Language (SAML),
    the XML-based industry standard for enhancing authentication and authorization
    data between systems.


    SAML is a standard generally used between corporate entities. When a user from
    corporation A wants to access a resource from corporation B, the corporation A
    browsers to the resource URL. The user is then presented with a login form, which
    will direct the login request back to the internal IP. The IP validates the authentication
    information and constructs a SAML token containing assertions about the user’s
    identity. This token is cryptographically signed by the IP and, sometimes encrypted
    for the receiving party. The token is sent to the resource provider (typically
    an HTML form submission), which checks to ensure that the signature is one it
    recognizes. The resource performs authentication based on the identity within
    the SAML token. SAML is not limited to the Web, for it can be used to flow identity
    between internal systems, but this chapter will focus on its use in Web applications.


    Passport was re-branded Live ID, with Microsoft dropping its goal of generalizing
    all e-commerce functions (such as purchasing) and now acting as a simple authentication
    system that can be used by other Web sites.


    An alternative to Live ID is OpenID, a decentralized authentication standard allowing
    users to use a single digital identity to log onto any supporting Web site. Unlike
    Passport and Live ID (where Microsoft can identify users), anyone can become an
    OpenID provider, and the protocols do not rely on any central authority. OpenID
    was developed in 2005 by Brad Fitzpatrick, creator of Livejournal. It is a lightweight
    identity system making use of the Internet protocols and specifications such as
    URIs, HTTP, and SSL. Of all the identity solutions, OpenID is currently the most
    supported, in terms of acceptance by Web sites, as well the places from which
    you can acquire an identity.


    One of the major detractors of Microsoft Passport was Kim Cameron. Cameron had
    published the "Seven Laws of Identity"http://www.identityblog.com/part/35) which
    represented his vision for a successful identity solution. With Cameron as his
    Chief Identity Architect, Microsoft implemented his vision of an identity metasystem
    with Information Cards and Windows CardSpace.


    Information Cards are based on existing open standards (WS-Trust, WS-Security,
    and SAML), which an Information Card representing a digital identity in a piece
    of software called an identity selector, which runs on a user’s computer. When
    an RP requests an identity, the selector presents an Information Card that contains
    the RP’s criteria. The user selects the card, and the selector then contacts the
    IP who has issued the card to retrieve the requested identity. Because the identity
    selector runs on the user’s computer, it presents the user with a consistent interface
    that reduces the risk of phishing, which OpenID and Live ID are vulnerable to.'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'The identity token currently used in Information Cards is the SAML standard,
    so any SAML-accepting Web site can accept Information Cards with a minimal amount
    of work. However, the Information Card is token-agnostic. There is work going
    on to create an OpenID Information Card, where the response from a compatible
    identity provider can contain an OpenID response instead of a SAML response.


    WindowsSpace is the Windows client for Information Cards, providing the Identity
    Selector piece of the information card process. Microsoft is currently developing
    a new version of Active Directory Federation Services (ADFS) that will provide
    an identity provider for SAML, and an Information Card that uses Active Directory
    as its identity store and the Windows Identity Foundation (WIF) to allow developers
    to write their own information providers. These providers would accept both SAML
    and Information Cards on their Web sites and in their Web services.


    No matter solution you choose to integrate, the important thing is that a third
    party is authenticating users on your behalf. The authentication will flow to
    your WIF site in the form of a token (via URLs, SAML, an HTTP POST, or other method).
    Once you receive the token, you parse it and decide if the user is authorized
    to access your resources.


    Generally, tokens contain claims about a user''s identity. A LiveID token may
    contain a claim detailing the unique reference ID to us, an Information Card may
    contain a claim about a user''s date of birth, or an OpenID token may contain
    a claim about a user''s email address. It is up to you, the developer, to decide
    how much you can trust these claims. This decision is usually based on where the
    claims are coming from.


    When a user registers for OpenID, the provider may ask the user for and confirm
    his or her email address. However, when the email address is delivered to your
    Web site, you have no way of knowing if that email is still active and belongs
    to you. Similarly, an Information Card system may issue claims about a user''s
    date of birth or address, but until you know how these have been verified by the
    identity provider, you cannot assign a level of trust to these claims, and should
    treat them like any untrusted provider.


    # USING THE WINDOWS IDENTITY FOUNDATION TO ACCEPT SAMLAND INFORMATION CARDS


    The Windows Identity Foundation (WIF) provides a framework for building claims-based
    applications and service. With WIF you can enable for ASP.NET applications and
    provide claims-based authorization for both ASP.NET and WCF. In addition, WIF
    provides you with the building blocks necessary to build a security token service
    to issue claims-based identities either via SAML tokens or identity selector as
    information cards. When accepting identities WIF supports two types of federated
    identities:


    +   - Passive SAML—This is where you are redirected to your identity provider,
    which issues identity and then redirects the browser to the Web site asking for
    identity.


    +   - Information Cards—This is where the accepting Web site (the relying party)
    triggers the Information Card client, which talks to your identity provider and
    returns a SAML token to the requesting Web site.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Using the Windows Identity Foundation to Accept SAML and Information Cards


    In this section, you will learn how to create a claimsaware Web site for SAML
    authentication, and how to add Information Card support to an existing Web site.


    Originally, with .NET 3.0, Information Card support was minimal. To add it to
    your site, you had to use some code that was fragile and made assumptions. Microsoft
    changed this in Geneva 2008 with the beta release of the "Geneva" platform. It
    is composed of three parts:


    +   Windows Identity Foundation (WIF)—is a library that helps .NET Web sites consume
    the tokens issued by a Security Token Service (STS), and also helps developers
    write custom security services.


    +   Active Directory Federation Services—the server is a ready-made STS that uses
    Active Directory to authenticate users, and to issue claims about their identities.


    +   Windows CardSpace—this is an identity selector, or the user interface that
    runs on Windows. It allows the user to select an Information Card to use, and
    retrieves a token from the STS before delivering it to the requesting Web site.


    If you want to learn more about Windows CardSpace and Information Cards, then
    see the book, Understanding CardSpace: An Introduction to the Concepts and Challenges
    of Digital Identities by Vittorio Bertocci, Garrett Steck, and Caleb Baker (Boston:
    Addison-Wesley, 2009). For a higher-level view of the identity problem, Kim Cameron''s
    blog at http://www.identityblog.com is a must read, and Vittorio blog at http://blogs.msdn.com/vertocci
    lots of code samples, Web Cards, and other deep technical resources.


    Before you will need to download WIF from the MSDN security site at http://msdn.microsoft.com/security/a57035l.aspx.
    The WIF download comes with the runtime and a separate SDK download that adds
    templates into Visual Studio — You should download and install both WIF and the
    WIF SDK. Use WIF-based Open source identity provider by Dominik Baier, which you
    can download from http://starterts.codeplex.com/.


    After installing the WIF SDK you should download and unzip the StarterTS package.
    You will need to create a Web Application for StarterTS and add an HTTPS certificate
    to it. Chapter 14 contains instructions on how to create and use an HTTPS certificate.
    You should then follow the configuration instructions for Starter. Register a
    username and password within (see Chapter 7 on how to use WIF tools to add users
    and roles to a membership database), and test that you can log using it. You may
    also want to set up roles, to see how they are used. Next you will also need to
    configure StarterTS to use HTTPS by verifying the certificate in certificates.config.
    Finally, the starterts.config file and change the requireSSL and allowKnownRealmsOnly
    settings to false. Loosening these settings will allow you to run your tests within
    Visual Studio without publishing them to IIS.


    # Creating claims-Aware Web Site


    The WIF SDK comes with some tools to help you set up a Web site that will accept
    passive SAML authentication. This involves configuring a partnership with an identity
    provider.


    In the simplest scenario, which you will build here, when an unauthenticated user
    comes to your claims-aware Web site, the user will be redirected to the identity
    provider for that. The identity provider will authenticate the user and parcel
    it information about the'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# 364 | CHAPTER 15 THIRD-PARTY AUTHENTICATION


    user to SAML token. The user''s browser then forwards this token to your Web site,
    where it is parsed and turned into an IIdentity pair, which is attached to the
    request. If this sounds fancy, this principle attachment helps, with authentication
    and windows authentication. The SAML parsing happens behind the scenes. You simply
    read the thread identity and decide what you want to do.


    # TRY OUT Creating a Claims-Aware Web Site


    In this exercise, you will create a Web site that accepts a SAML token, and partner
    it with an installation of StartSTS downloaded, configured, and running with at
    least one username and password in its member database.


    +   1. Start Visual Studio and select File New Website. Select Claims-aware ASP.NET
    WebSite" from the list of templates. This will create a new Web site containing
    two pages, default.aspx and login.aspx.


    +   2. Look carefully at the result. At first glance, nothing looks out of place
    until you examine the web.config file. If you examine the assemblies list, you
    will see a reference to Microsoft IdentityModel. If you scroll down and look at
    the httpModules section of web.config, you will see an entry, ClaimsPrincipalModule
    is responsible for taking the identity of the current request and turning it into
    IPrincipal. If you are using Application Projects rather than Web sites you can
    simply copy these web.config entries into aeb.config for a Web Application Project
    to enable WiFi.


    If you using Windows Authentication, Windows will transform that identity into
    WindowsClaimsPrincipal. If you are Forms Authentication, a ClaimsPrincipal class
    would be created. This transformation takes the Properties of the original identity
    and transforms them into claims. A Windows identity will gain claims such as the
    Account Security Identifier, while a forms identity will gain claims such as the
    authentication method.


    This common IClaimsPrincipal still works with the old style IsInRole(security)
    model, but provides the major benefit of claims-based approach is that your application
    is no longer locked to a specific authentication method, be it Windows Authentication,
    forms authentication, or anything else. The ClaimsPrincipalModule will take any
    authentication token, unless it comes from outside our country, or from a non-Windows
    system, and change it into a standard class that you can use. You are now ready
    more from the backwards-compatible role security IClaimsPrincipal, then roles
    will be replaced with the more granular authorization artifact them.


    David Chaphall has produced a paper calledDigital Identity for .NET applications:
    A Technology Overview," which delves into the approaches, advantages, and challenges
    a claims-based identity system. You can download the white paper from http://microsoft.com/en-gb/library/bb882216.aspx.


    +   3. When you create a new Claims-aware ASP.NET Web site it doesn''t appear
    to do anything. If you run it, you will see a forms-based login page that you
    can use to authenticate, after a list of'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Using the Windows Identity Foundation to Accept SAML and Information Cards


    claims will be presented to you — the name of the user, the user authenticated,
    and how the user authenticated. You will see that each claim type is a unique
    URI, and you can also see how Microsoft has implemented specific claim types for
    the authentication instance and type.


    +   4. Now, you must add a partnership to an identity provider, in case StarterSS.
    Right-click on the project in Solution Explorer and choose "STS reference." This
    will start the Federation Utility, an application that allows you to configure
    the trust relationship between your Web application and the third-party authentication
    service (the STS). The "Application configuration location" and the "Application
    URI" will be filled for you on the project properties, so just click the Next
    button. You will receive a warning that the application is not hosted on HTTPS.
    Click Next to continue.


    +   5. You will be prompted for the details of the STS. Select the Use an existing
    STS option. You must now enter the location of the STS federation metadata. This
    URI is a document published by an STS that lists (other things) the location of
    the login page and the claims it offers. If you log in to StarterSTS, you will
    see a link to view the WS-Federation metadata. Click the link. Copy the URI from
    the browser bar and paste into the location field in the Federation Utility. Now
    click Next.


    +   6. You will now be asked about encryption. For live systems, tokens will generally
    be encrypted against an X509 certificate, so only the relying party can decrypt
    the token. But since you are just setting up a site, it is unlikely you have a
    suitable certificate. Leave the No Encryption option selected and click Next.


    +   7. You will be presented with a list of claims that the STS can deliver. This
    screen is informational, so click Next to be presented with the final summary,
    and then click Finish.


    +   8. Now run your application. This time, you will not see the login screen
    delivered by the application. Instead, your browser will be redirected to the
    login screen for StarterSTS. If you log in using your StarterSTS account, you
    will see that StarterSTS has performed the authentication and sent the identity
    information to your claims-Web site, which has been parsed and turned into a claims
    identity, including any roles defined within StarterSTS that the user is a member
    of.


    The claims identity can be treated as you forms identity, or a Windows identity.
    You can use the normal ASP.NET authorization configurations detailed in Chapter
    7 to grant (or limit) access to your application based on the username or roles
    sent by StarterSTS. You now have a federated identity solution!


    # Accepting Information Cards


    Windows has another method of transporting federated identity that does not use
    browser redirection or federated partnerships — WindowsSpace. CardSpace is an
    identity selector, a piece of software that sits between the user and the relying
    party, allowing the user to select identity he or she wants to use, and forwarding
    the identity information to the relying party.'
