- pgno: 368
  md: "Configuration options for request filtering are made in the %system.WebServer>/<Security>/%requestFiltering\
    \ section of the configuration files.\n\n# Filtering DoubleEncoded Requests\n\n\
    An attacker can attempt to bypass filters on a URL by ampersand(& in a request\
    \ may normally be encoded to %26, where the percent sign indicates the following\
    \ digits ASCII value. An attacker could disguise this by encoding the percent\
    \ sign to %25, making the disguised ampersand%2526. If request filtering is configured\
    \ to reject a double-encoded request, it will attempt to normalize the request\
    \ twice, rejecting it if the result of the second normalization differs from the\
    \ result of the first normalization.\n\nTo configure for double-encoded requests,\
    \ use the allowDoubleEscaping attribute on the requestFiltering element, as shown\
    \ here:\n\n```\nsystem.webServer>\n<security>\n  <requestFiltering allowDoubleEscaping=\"\
    false\" />\n</security>\nsystem.webServer>\n```\n\n# Filtering Requests with non-ASCII\
    \ Characters\n\nIf your application does not use non-ASCII characters in its requests\
    \ (that is, those with a “high bit” set), you can safely reject them, lowering\
    \ the attack surface on your application. This option is configured using the\
    \ allowHighBitCharacters attribute, as shown here:\n\n```\nsystem.webServer>\n\
    <security>\n  <requestFiltering allowHighBitCharacters=\"false\" />\n</security>\n\
    system.webServer>\n```\n\n# Filtering Requests Based on File Extension\n\nFile-extension\
    \ filtering can work in either a whitelist or a blacklist configuration by using\
    \ the fileExtensions section of requestFiltering. When configured for a whitelist,\
    \ only requests that match the configured file extensions will be allowed. When\
    \ configured for a blacklist, requests made to the configured extensions will\
    \ be rejected.\n\nBy default, request filtering will stop requests for particular\
    \ files such as .config,.asax,.cs ,and .vb files. But if you use a whitelist to\
    \ limit requests to the extensions, then you should extend the default blacklist\
    \ filter to stop requests for .bak files as well. The following example\n\n```\n\
    system.webServer>\n<security>\n  <requestFiltering>\n    <fileExtensions allowUnlisted=\"\
    true\" >\n```"
  merge: -1
  img_proc: true
- pgno: 369
