- pgno: 256
  md: "# Validating XML\n\n3. Next, create a schema to validate. With the XML file,\
    \ from the Visual Studio menu, choose XML -> Create Schema. A new window will\
    \ open in the editor containing a suggested schema file. Leave this unchanged\
    \ for now, and save it into the directory containing your Web site.\n\n4. In your\
    \ project, add a Web form called validate.aspx. Change the contents of the file\
    \ to be the following:\n\n```\n<@ Page Language=\"C#\" Request=\"false\" %>\n\
    <%@ Import Namespace=\"System.Xml\" %>\n<!DOCTYPE html PUBLIC\n    \"//W3C//DTD\
    \ HTML 1.0 Transitional//EN\"\n    \"http://www.w3.org/TR/xhtml/DTD/xhtml-transitional.dtd\"\
    >\n>\n\n<script runat=\"server\">\n    protected void Page_Load(object sender,\
    \ EventArgs e) {\n        XmlDocument xmlDocument = new XmlDocument();\n     \
    \   xmlDocument.Load(Server.MapPath(\"/books.xml\"));\n        WellFormed.Visible\
    \ = true;\n    }\n</script>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n \
    \ <head id=\"Head1\" runat=\"server\">\n    <title>Validating Schemas</title>\n\
    \  </head>\n  <body>\n    <form id=\"form1\" runat=\"server\">\n      <asp:Label\
    \ ID=\"WellFormed\"\nrunat=\"server\" Visible=\"false\">\n        <p>Your XML\
    \ was well formed.</p>\n      </asp:Label>\n    </form>\n  </body>\n</html>\n\
    ```\n\n5. Run this project and view the results. You will see that the parser\
    \ verifies your XML is well-formed. Edit the books.xml file if it is not well-formed\
    \ and check that the parser throws an XmlException. Restore books.xml to its well-formed\
    \ state.\n\nThe sample schema created by Visual Studio is:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<xs:schema attributeDefault=\"unqualified\"\nelementFormDefault=\"\
    qualified\">\n<xs:element xmlns=\"http://www.w3.org/2001/XMLSchema\"\nname=\"\
    Books\">\n<xs:complexType>\n<xs:complexType?>\n<xs:sequence>\n  <xs:element maxOccurs=\"\
    unbounded\" name=\"Book\">\n  <xs:complexType>\n  <xs:sequence>\n  <xs:element\
    \ name=\"Title\" type=\"xs:string\" />\n  <xs:element name=\"Author\" type=\"\
    xs:string\" />\n```"
  merge: -1
  img_proc: true
