- pgno: 310
  md: "# USING MESSAGE INSPECTORS\n\nWCF provides another type of inspector, the message\
    \ inspector. A message inspector can be used as a filter that intercepts and inspects\
    \ messages as they arrive into your service, before they reach your service implementation.\
    \ They can be used for various purposes, including, for example, security functions\
    \ such as limiting message acceptance based on IP address.\n\nTo define a message\
    \ inspector suitable for a WCF service, you simply implement IDispatchMessageInspector,\
    \ which is contained in the System.ServiceModel.Dispatcher namespace. A base message\
    \ inspector is showing in Listing 11-10.\n\n# LISTING 11-0: A base message inspector\n\
    \n```\nusing System.ServiceModel;\nusing System.ServiceModel.Channels;\nusing\
    \ System.ServiceModel.Dispatcher;\n\npublic class IAddressInspector : IDispatchMessageInspector\n\
    {\n    public object AfterReceiveRequest(\n        ref Message request,\n    \
    \    IClientChannel channel,\n        InstanceContext context)\n    {\n      \
    \  throw new NotImplementedException();\n    }\n\n    public void BeforeSendReply(\n\
    \        ref Message reply,\n        object correlationState)\n    {\n       \
    \ throw new NotImplementedException();\n    }\n}\n```\n\nYou can see that implementing\
    \ IDispatchMessageInspector requires you to write two methods, AfterReceiveRequest\
    \ and BeforeSendReply. You will note that both methods use a message parameter\
    \ by reference. This allows you to replace the message during processing with\
    \ a changed version of the original message, or a completely new message, should\
    \ you want to do so. By setting the message to null in the AfterReceiveRequest,\
    \ your implementation will never be called. You can also send an object between\
    \ the two methods by returning it from AfterReceiveRequest, which becomes the\
    \ correlationState parameter in BeforeSendReply.\n\nYou can put this all together\
    \ and write a simple message filter that checks in that service has been accessed\
    \ via localhost, as the shown in Listing 11-11."
  merge: -1
  img_proc: true
- pgno: 311
  md: "# LISTING 111: A simple message inspector to limit connections to localhost\n\
    \n```\nusing System.Net;\nusing System.ServiceModel;\nusing System.ServiceModel.Channels;\n\
    using System.ServiceModel.Dispatcher;\n\npublic class IPAddressInspector : IDispatchMessageInspector\n\
    {\n    private static readonly object AccessDenied = new object();\n}\n\npublic\
    \ object AfterReceiveRequest(\n    ref Message request,\n    IClientChannel channel,\n\
    \    InstanceContext instanceContext)\n{\n    RemoteEndpointMessageProperty remoteEndpoint\
    \ =\n        request.Properties[RemoteEndpointMessageProperty.Name]\n        as\
    \ RemoteEndpointMessageProperty;\n    IPAddress ipAddress =\n        IPAddress.Parse(remoteEndpoint.Address);\n\
    \n    if (!IPAddress.IsLoopback(ipAddress))\n    {\n        request = null;\n\
    \        return AccessDenied;\n    }\n    return null;\n}\n\npublic void BeforeSendReply(\n\
    \    ref Message reply,\n    object correlationState)\n{\n    if (correlationState\
    \ == AccessDenied)\n    {\n        HttpResponseMessageProperty accessDenied =\n\
    \            new HttpResponseMessageProperty();\n        accessDenied.StatusCode\
    \ = (HttpStatusCode)401;\n        accessDenied.StatusDescription = \"Access Denied\"\
    ;\n        reply.Properties[\"httpResponse\"] = accessDenied;\n    }\n}\n```\n\
    \nAs before, with parameter inspectors, you must write a custom attribute to attribute\
    \ it to your service implementation. However, this time it will be an IServiceBehavior,\
    \ which is applied to a service, rather than individual operations. Listing 11-12\
    \ shows a suitable implementation."
  merge: -1
  img_proc: true
- pgno: 312
  md: "# LISTING 112: A service-wide behavior attribute for the IP address inspector\n\
    \n```\nusing System;\nusing System.Collections.ObjectModel;\nusing System.ServiceModel;\n\
    using System.ServiceModel.Channels;\nusing System.ServiceModel.Description;\n\
    using System.ServiceModel.Dispatcher;\n```\n\n```\npublic class IPAddressInspectorBehavior\
    \ :\n    Attribute, IServiceBehavior\n{\n    public void AddBindingParameters(\n\
    \        ServiceDescription serviceDescription,\n        ServiceHostBase serviceHost,\n\
    \        Collection<ServiceEndpoint> endpoints,\n        BindingParameterCollection\
    \ bindingParameters)\n    {\n}\n```\n\n```\npublic void ApplyDispatchBehavior(\n\
    \    ServiceDescription serviceDescription,\n    ServiceHostBase serviceHost)\n\
    {\n    for (int i = 0;\n        i < serviceHost.Channel.Dispatchers.Count;\n \
    \       i++\n    {\n        ChannelDispatcher channelDispatcher =\n          \
    \  serviceHost.Channel.Dispatchers[i]\n            as ChannelDispatcher;\n   \
    \     if (channelDispatcher == null)\n        {\n            foreach (EndpointDispatcher\
    \ endpointDispatcher\n                in channelDispatcher.Endpoints)\n      \
    \      {\n                IPAddressInspector inspector = new IPAddressInspector();\n\
    \                endpointDispatcher.DispatchRuntime.\n                MessageInspectors.Add(inspector);\n\
    \            }\n        }\n    }\n}\n```\n\n```\npublic void Validate(\n    ServiceDescription\
    \ serviceDescription,\n    ServiceHostBase serviceHost)\n{\n}\n```\n\nThis attribute\
    \ can then be applied to the service contract, as shown in the following code\
    \ snippet. Once applied, every call to the contract will flow through the inspector."
  merge: -1
