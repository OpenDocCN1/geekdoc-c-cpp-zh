  md: "Error.Log(ex);\n\n}\n\nFollowing is an example of handling errors within global.asax:\n\
    \n```\n## Application Language=\"C#\" %>\n<script runat=\"server\">\nvoid Application_Error(object\
    \ sender, EventArgs e)\n{\n    // Log Errors.\n    Exception ex = Server.GetLastError(ex);\n\
    \    Error.Log(ex);\n}\n</script>\n```\n\nOf course, these error handlers are\
    \ a last resort. You should be wrapping your code in try / catch blocks and reacting\
    \ accordingly.\n\nIf you implemented the error logging as shown in the example\
    \ code snippets, your errors would be logged twice because of error bubbling.\
    \ ASP.NET will first look for a page-level error handler, an application-wide\
    \ error handler, and finally, if neither of these is found, the default error\
    \ handler will kick into play. However, if it is up to an error handler to either\
    \ cancel the error by calling Server.ClearError, or indicate to ASP.NET that it\
    \ has handled by redirecting to another page via Server.Transfer. The latter is\
    \ preferable to Response.Redirect with no redirection response will be sent to\
    \ the client, thwarting software that watches these messages to detect errors.\n\
    \n# Watching for Special Exceptions\n\nASP.NET throws certain exceptions that\
    \ may indicate a security problem, such as request validation failures. It logs\
    \ these differently from \"normal\" exceptions (for example, sending a text message\
    \ to a mobile phone, or logging the event with specific error-code monitoring\
    \ software that can detect and respond to the threat). Table 5-1 provides some\
    \ examples of exceptions that indicate a potential threat.\n\nTABLE 5-1: Exceptions\
    \ That Indicate a Potential Threat\n\n| EXCEPTION | WHEN OCCURS |\n|---|---|n|\
    \ HttpRequestValidationException | Occurs when request validation (see Chapter\
    \ 3) is on, and potentially threatening characters are sent with a request. |\n\
    | ArgumentException | Occurs when event validation fails (see Chapter 4), indicating\
    \ an attempt to fire an event that is not valid for a page. |\n| ViewStateException\
    \ | Occurs when an invalid ViewState has been sent (previously described in this\
    \ chapter) |"
