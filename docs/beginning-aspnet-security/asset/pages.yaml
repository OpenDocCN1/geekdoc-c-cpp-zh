    Generate your own—The .NET framework includes a command-line utility called MakeCert
    can be used to generate certificates. These certificates should only be used for
    testing because they contain no CA details and no certificate revocation list.
    Each certificate must be individually trusted by systems which you use. The available
    command-line options for MakeCert you may find examples of how to use the utility
    at http://msdn.microsoft.com/en-us/library/bfsk3ys (V0.8).


    If you are using IIS 7, Vista or with Windows 2008, IIS Manager can generate SSL
    certificates for a web site. You can access this by clicking the Certificates
    icon in IIS Manager, and choosing “Self-Signed certificate” from the menu on the
    right-hand side of the management application.


    Like a symmetric key, a certificate that contains both the public and private
    key should be protected. Windows has a mechanism for this: the Certificate Store.
    The Certificate Store presents a standard interface to use, regardless of where
    a certificate is stored (such as on a hard disk, on a smart card or in special
    storage location).


    Within the Store are two store types: the machine store and the user store. The
    machine store keeps certificates that are potentially available to the machine
    (and users on machine, if they have permissions to the certificate). Certificates
    used by ASP.NET will generally be in the machine store. The user store contains
    certificates that are for a specific user. To manage the Certificate Store, you
