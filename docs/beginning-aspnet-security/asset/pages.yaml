  md: "# 370 CHAPTER 15 THIRD-PARTY AUTHENTICATION\n\n```\nthis.signinButton.Visible\
    \ = true;\nthis.signedInMessage.Visible = false;\n}\n```\n\nSAML tokens are limited\
    \ by their audience — in this case, the Web page requesting it. However, if you're\
    \ requesting it from default.aspx, this may have multiple URLs — http://localhost/default.aspx,\
    \ or http://localhost/Default.aspx. So the first thing you must do is check the\
    \ URL for the current request. If it's not the one you wish (in the example, /Default.aspx),\
    \ then the browser is redirected to it.\n\nNext, the code configures the token\
    \ handlers. The token handlers are a pipeline WIF puts each token through, which\
    \ takes the token and checks if it was issued by a partner application trusts\
    \ via the IssuerNameRegistry. The handler setup also checks the audience restrictions,\
    \ if the token meets the requirements for an application, and a parser for the\
    \ token format. In this example, encrypted tokens and SAML 1.1 tokens are handled.\n\
    \n+   Now that the parsers are configured, you actually parse the token sent.\
    \ Change the PageLoad event to the following:\n\n```\nvoid Page_Load(object sender,\
    \ EventArgs e)\n{\n    if (Page.PostBack)\n    {\n        string tokenXml = Request.Form[\"\
    *tokenXml\"];\n        if (false == String.IsNullOrEmpty(tokenXml))\n        {\n\
    \            SecurityToken token = ReadXmlToken(tokenXml);\n            if (null\
    \ == token)\n            {\n                this.loginError.Text = \"Unable to\
    \ process xml token.\";\n            }\n            else\n            {\n    \
    \            ClaimsPrincipal principal =\n                    AuthenticateSecurityToken(Request.RawUrl,\
    \ token);\n                if (principal == null)\n                {\n       \
    \             this.loginError.Text = \"Unable to authenticate user.\";\n     \
    \           }\n                else\n                {\n                    ShowClaims(principal);\n\
    \                }\n            }\n        }\n    }\n}\n```\n\n+   Now you also\
    \ must add a couple of helper functions to aid in parsing the token, and convert\
    \ it to a usable form:\n\n```\nSecurityToken ReadXmlToken(string tokenXml)\n{\n\
