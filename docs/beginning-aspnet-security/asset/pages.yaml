- pgno: 269
  md: "# LISTING 10-3 (continued)\n\n```\n// Replace the encryptedData element with\
    \ the\n// plaintext XML element,\nencryptedXml.ReplaceData(encryptedElement, rgbOutput);\n\
    }\n```\n\nThis method will look through a document for the first encrypted data\
    \ element and attempt to decrypt it.\n\n# Using an Asymmetric Key Pair to Encrypt\
    \ and Decrypt XML\n\nYou should remember from Chapter 6 that asymmetric encryption\
    \ does not require the sharing of secret keys. Decryption is only possible by\
    \ the holder of the private key matching the public key. However, asymmetric encryption\
    \ has a drawback—it can only encrypt small amounts of data.\n\nChapter 6 discussed\
    \ the concept of a session key, an automatically created symmetric key that is\
    \ used to do the data encryption. Session keys also must be encrypted by asymmetric\
    \ algorithms, so the session key is encrypted using the asymmetric key, and then\
    \ transferred with the encrypted data. The XML encryption standard has a defined\
    \ method of transferring the session key, as well as details about the asymmetric\
    \ key used to protect it.\n\nThe code shown in Listing 10-4 takes an XML document,\
    \ the element name to encrypt, and an RSA key, and exactly that—generate a session\
    \ key and encrypting it using the public asymmetric.\n\n# LISTING 10: Encrypting\
    \ XML using an asymmetric RSA key\n\n```\npublic static void Encrypt(XmlDocument\
    \ document,\n    string elementNameToEncrypt, RSAParameters rsaParameters)\n{\n\
    \    const string KeyName = \"RSAKey\";\n    const string EncryptedElementName\
    \ = \"encryptedMessage\";\n\n    // Create a new instance of the RSA algorithm\
    \ and load the key.\n    RSryptoServiceProvider rsa = new RSryptoServiceProvider();\n\
    \    rsa.ImportParameters(rsaParameters);\n\n    // Get the element for encryption.\n\
    \    XmlElement elementToEncrypt =\n        document.GetElementsByTagName(elementNameToEncrypt)[0]\n\
    \        as XmlElement;\n    if (elementToEncrypt == null)\n    {\n        throw\
    \ new XmlException(\"The specified element was not found\");\n    }\n\n    //\
    \ Create a session key as asymmetric algorithms\n    // cannot encrypt large amounts\
    \ of data.\n```"
