- pgno: 87
  md: '# CHAPTER 3 SAFELY ACCEPTING USER INPUT


    If you want to check that the input entered matches a particular data type, then
    you set the Operator property to DataTypeCheck, and the Type property on the control
    to Currency,Date, Double,Integer, or String. Here is an example:


    ```

    asp:TextBox runat="server" ID="anInteger" />

    asp:CompareValidator runat="server" ID="validateValidator"

    ControlToValidate="anInteger"

    Operator="DataTypeCheck"

    Type="Integer"

    ErrorMessage="You must enter an integer"

    Text="***"

    ```


    # Using the CustomValidator


    TheCustomValidator allows you to create your custom validators that implement
    your business logic. To add server-side validation, you implement a handler for
    the ServerValidate event. If you want to add client-side validation via JavaScript,
    you can specify a function name in the ValidationFunction property. You can specify
    if the validator triggers even if the control''s value is empty by setting the
    ValidateEmptyText to true. However, if you want to match the behavior of the standard
    controls, you can use a RequiredFieldValidator instead.


    The serverside event handles everything in the ServerValidateEventArgs. This parameter
    has a Value property, which contains the value from the control that triggered
    your validation. It is also best practice to set IsValid to false at the start
    of your code, and only set it to true after successful validation. This ensures
    that if something goes wrong in your code, the logic is safer to fail (marking
    a field as invalid) hovidly.


    For example, the following code would define a field and its custom validator:


    ```

    asp:TextBox runat="server" ID="quantity" />

    asp:CustomValidator runat="server" ID="validateQuantity"

    ValidateEmptyText="false"

    ControlToValidate="quantity"

    OnServerValidate="validateQuantity"

    ErrorMessage="Quantities must be divisible by 10"

    Text="***"

    ```


    The serverside code for this custom control would look something like the following:


    ```

    protected void OnValidateQuantity(object source,

    ServerValidateEventArgs args)

    {

    args.IsValid = false;


    int value;

    if (int.TryParse(args.Value, out value))

    {

    if (value % 10 == 0)

    {

    args.IsValid = true;

    }

    }

    }

    ```'
