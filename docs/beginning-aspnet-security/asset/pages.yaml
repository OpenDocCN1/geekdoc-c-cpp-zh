  md: '# 350 | CHAPTER 14 SECURING INTERNET INFORMATION SERVER (IIS)


    The IP address at the top of the results belongs to Yahoo; the other IP address
    was my own. If you wanted to see which browser identifier was sent by a particular
    IP address, you would use the following query:


    ```

    LogParser `SELECT DISTINCT c-ip, cs(User-Agent) from ex081213.log

    WHERE c-ip=''69.147.90.42*'' -rtp:1`

    ```


    This query returned the following results, which indicate that it was simply a
    Yahoo robot for blogs, probably following links to tests I made and then deleted.


    ```

    c-ip                            cs(User-Agent)

    69.147.90.42    Yahoo!MyBlogLog+API+Client+(curl)+5.2.5

    ```


    Statistics:


    ```

    Elements processed: 919

    Elements output: 1

    Execution time: 0.01 seconds

    ```


    Another piece of data is the status codes returned to the browser. Status codes
    can indicate error conditions or brute login attempts. Status code 401 indicates
    an unauthorized request; status code 500 indicates a server-side error in your
    application. To mine the status codes, use the following:


    ```

    logparser `SELECT cs-uri-stem, sc-status, Count(*)

    AS Total FROM ex*.log

    WHERE (TO_LOWERCASE(cs-uri-stem) LIKE ''%.asp%'' OR

    TO_LOWERCASE(cs-uri-stem) LIKE ''%.svc'') AND

    sc-status >400 GROUP BY cs-uri-stem, sc-status

    ORDER BY cs-uri-stem, sc-status -rtp:1`

    ```


    Finally, a potential indicator of problems is a higher-than-normal number of bytes
    sent to a page, or to query the amount of bytes from a page, you could use the
    following:


    ```

    logparser `SELECT cs-uri-stem, Count(*) AS Hits, AVG(cs-bytes)

    AS Avg,

    MAX(cs-bytes) AS Max, MIN(cs-bytes) AS Min, Sum(cs-bytes) AS Total

    FROM ex*.log WHERE TO_LOWERCASE(cs-uri-stem) LIKE ''%.asp%'' OR

    TO_LOWERCASE(cs-uri-stem) LIKE ''%.svc''

    GROUP BY cs-uri-stem ORDER BY cs-uri-stem -rtp:1`

    ```


    To query the amount of bytes by a page, you could use:


    ```

    logparser `SELECT cs-uri-stem, Count(*) AS Hits, AVG(cs-bytes)

    AS Avg,

    MAX(cs-bytes) AS Max, MIN(cs-bytes) AS Min, Sum(cs-bytes) AS Total

    FROM ex*.log WHERE TO_LOWERCASE(cs-uri-stem) LIKE ''%.asp%'' OR

    TO_LOWERCASE(cs-uri-stem) LIKE ''%.svc''

    GROUP BY cs-uri-stem ORDER BY cs-uri-stem -rtp:1`

    ```'
