- pgno: 61
  md: "# Examining the ASP.Net Pipeline\n\nNow that you understand how ASP.NET creates\
    \ a page, only one piece of the jigsaw remains. How does ASP.NET know what a request\
    \ is, and what code to use to serve it? ASP.NET works on a pipeline model. A request\
    \ goes through the ASP.NET pipeline passing HTTP Modules, which can examine the\
    \ request and act upon it, rewrite the URL, or even exceptions stop any further\
    \ progression and return an error to the user. If the request makes it through\
    \ the pipeline's HTTP Modules, it is passed to an HTTP Handler, which processes\
    \ the request and creates the response. The handler used is based on the file\
    \ extension of the request. When a handler is installed, it is configured to act\
    \ as an endpoint for one or more file extensions.\n\nIIS 6 and IIS 7 have different\
    \ pipelines. The handler ASP.NET routes to is based on the file extension contained\
    \ in the request. .aspx files are routed to System.Web.PageHandler.svc files are\
    \ routed to System.ServiceModel.Activation.HttpHandler, and so on. IIS6 and IIS7\
    \ have different pipelines. IIS6 only routes mapped to the ASP.NET ISAPI filter,\
    \ while IIS7 introduced an integrated pipeline, where all requests pass through\
    \ the ASP.NET pipeline and can be examined by HTTP Modules.\n\nHandlers and modules\
    \ are registered in the web.config file for a machine or Web site. If you examine\
    \ the web.config file contained in C:\\Microsoft\\.NET\\Framework\\v2.0.50727\\\
    CONFIG directory, you can see the default handlers and modules in the httpHandlers\
    \ and modules sections. If you are on a site, then you can add it to the .NET\
    \ framework web.config. If you want to register them for a single site, you add\
    \ them to that site's web.config file.\n\nWriting a HTTP Handler is relatively\
    \ rare occurrence, limited to situations when you want to create a custom file\
    \ extension like .RSS. HTTP Handlers can selectively respond to requests based\
    \ on the request — GET, POST, and any of the other verbs HTTP supports.\n\nTo\
    \ register an HTTP Handler, simply add an element in the httpHandlers section\
    \ of the web.config file, as shown here:\n\n```\n<httpHandlers>\n  <add verb=\"\
    supported http verbs\" path=\"path\"\n       type=\"namespace.classname, assemblyname\"\
    \ />\n</httpHandlers>\n```\n\nThe other component of the ASP.NET pipeline is the\
    \ HTTP Module.\n\n# Writing HTTP Modules\n\nEvery ASP.NET request passes through\
    \ every registered HTTP Module. Modules can be used to provide verification and\
    \ validation functionality. Chapter 4 contains a detailed walk-through to create\
    \ an HTTP Module that prevents the attack known as Cross Request Forgery (CSRF).\
    \ HTTP Modules are very simple to write."
  merge: -1
  img_proc: true
- pgno: 62
  md: "# TRY OUT Writing an HTTP Module\n\nIn this exercise, you will write a simple\
    \ HTTP Module that adds a timestamp to the top of every request made to an ASP.NET\
    \ Web page.\n\nAn HTTP Module is a class that implements IHttpModule. This interface\
    \ has two methods: public void Init(HttpApplication context) and public void Dispose().\n\
    \n+   1. In Visual Studio, create a new Web Application by choosing File -> New\
    \ Project, and choosing ASP.NET Web Application in the New Project dialog. Name\
    \ the project SimpleHttppModule.\n\n+   2. Right-click on the project in Solution\
    \ Explorer and select Add -> Class. Name your new class TimestampModule.cs. Replace\
    \ the default class with the following skeleton implementation:\n\n```\nusing\
    \ System;\nusing System.Web;\n\nnamespace SimpleTimestampModule\n{\n    public\
    \ class TimestampModule : IHttpModule\n    {\n        public void Dispose()\n\
    \        {\n        }\n\n        public void Init(HttpApplication application)\n\
    \        {\n        }\n    }\n}\n```\n\n+   3. Within the Init method, you can\
    \ examine the Request via the context parameter, including adding events to be\
    \ fired when a request begins and a request ends. So's add an event to the module\
    \ to be fired when a request adds a timestamp to the output. Add the methods to\
    \ the class:\n\n```\nvoid OnEndRequest(object sender, EventArgs e)\n{\n    HttpContext.Current.Response.Write(\"\
    <p> Served at \" + DateTime.Now + \"</p>\");\n}\n```\n\n+   4. Finally, you must\
    \ write out the events within the Init method of the module, so adding the lines\
    \ to the Init method:\n\n```\npublic void Init(HttpApplication application)\n\
    {\n    context.EndRequest += OnEndRequest;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "5. Now, you must wire your module into the ASP by adding them into the web.config\
    \ file for your application. Edit the web.config in your application and adding\
    \ the following line to the httpModules section, giving the module entry name\
    \ and specifying the type by listing the full class name and the assembly that\
    \ contains the class:\n\n```\n<httpModules>\n  <add name=\"TimestampModule\" type=\"\
    SimpleHttp.TimestampModule, SimpleHttpModule\"/>\n  // other modules\n</httpModules>\n\
    ```\n\n6. Because the module is part of the assembly generated when you compile\
    \ the project, compile it by choosing Build <B>; right-click on the default.aspx\
    \ and choose View in Browser. You will see that the module has added a timestamp\
    \ to the bottom of the request.\n\nOne problem with this implementation is that\
    \ it will affect every single request sent through ASP.NET, including those for\
    \ JavaScript requests, Web services, and other requests that should not be timestamped.\
    \ To limit the timestamp to ASP.NET pages, you can examine the ASP.NET HTTP Handler\
    \ that served the request and attempt to create an instance of System.Web.UI.Page.\
    \ If the cast succeeds, you know that it is an ASP.NET Web page, and you can safely\
    \ append a timestamp. The OnRequest method to implement the following:\n\n```\n\
    void OnRequest(object sender, EventArgs args)\n{\n  if (HttpContext.Current.Handler\
    \ != null)\n  {\n    System.Web.UI.Page page = HttpContext.Current.Handler as\
    \ System.Web.UI.Page;\n    if (page != null)\n    {\n      HttpContext.Current.Response.Write(\"\
    <p> Served at \" + DateTime.Now + \"</p>\");\n    }\n  }\n}\n```\n\nThe timestamp\
    \ will now only be applied to pages that are served by the ASP.NET page handler.\
    \ You have now written your first HTTP Module. Rather than a simple timestamp,\
    \ you could check IP addresses, inbound requests with query parameters, all kinds\
    \ of request examination and validation — and stop them before they access your\
    \ page classes.\n\nYou should now have an understanding of the ASP.NET pipeline\
    \ and how to write a simple HTTP Module. If you want to know more about writing\
    \ HTTP Modules and HTTP Handlers, Chris Lowe has published two Wrox blog entries,\
    \ \"Leveraging httpHandlers to Stream Custom Content in ASPNET\" and \"Leveraging\
    \ httpModules for Better ASP.NET applications\", both of which are available from\
    \ the Wrox site (www.wrox.com)."
  merge: -1
  img_proc: true
- pgno: 64
  md: '# SUMMARY


    This chapter was designed as a gentle introduction to the HTTP protocol and introduced
    you to how easily requests can be edited or completely faked. At this point, you
    can take this warning and keep it firmly in mind as you progress through the book
    and secure your applications.


    In this chapter you learned about the following:


    +   - The HTTP protocol

    - How an HTTP request and response are constructed

    - The differences between a GET and POST request

    - How you can create your own requests without a browser

    - How ASP.NET turns the HTTP request into a server side event

    - How you can examine each request and modify it as appropriate


    These concepts underpin the ASP.NET framework. From here, you will build upon
    them, examining how ASP.NET applications can be attacked and how you can protect
    against this.'
