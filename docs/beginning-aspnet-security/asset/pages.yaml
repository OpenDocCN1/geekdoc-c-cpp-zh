    \ your assemblies with a strong name. You then use the sn to retrieve the public\
    \ key of signed assemblies, as shown here:\n\nsn -Tp MyAsNetWeb.dll for an assembly:\n\
    \nThis will display the key for an assembly:\n\n```\nMicrosoft (R) .NET Framework\
    \ Strong Name Utility Version 3.5.30729\nCopyright (C) Microsoft Corporation 1998-2001.\
    \ All rights reserved.\n```\n\n```\nPublic key is\n01234567890abcdef01234567890abcdef01234567890abcdef01234567890abcdef\n\
    01234567890abcdef01234567890abcdef01234567890abcdef01234567890abcdef\n01234567890abcdef01234567890abcdef01234567890abcdef01234567890abcdef\n\
    01234567890abcdef01234567890abcdef01234567890abcdef01234567890abcdef\n012345678\n\
    ```\n\nPublic key token is 1bf524cade3def500\n\nThis can be used with the permission\
    \ on an assembly level, or a class/method level like so (the key has been truncated\
    \ for illustration):\n\n```\n[StrongNameIdentityPermission (SecurityAction.Demand,\
    \ \nPublicKeys=\"01234567890abcdef01234567890abcdef\" + \n\n\"01234567\"\npublic\
    \ MySecureClass\n{}\n```\n\nThere are a couple of other \"gotchas\" associated\
    \ with GAC assemblies:\n\n+   Recompiling an assembly will not add the updated\
    \ version to the GAC. You must remove previous versions and add the new version\
    \ to the GAC in order for your changes to take effect.\n\n+   If the version number\
    \ of your GAC assembly changes, then assemblies with different versions will live\
    \ side by side in the GAC. To use the new assembly, you must remove the reference\
    \ to the old one from your project, and re-add a reference to the assembly with\
    \ the new version number."
