- pgno: 339
  md: "# Accessing the Web and Web Services with Silverlight\n\nSilverlight has three\
    \ ways of accessing Webhosted resources:\n\n+   - Via System.Net.WebClient class,\
    \ which allows you to retrieve resources\n- Via System.Net.WebRequest class, which\
    \ allows you to post values to Web pages\n- Via Web services\n\nHowever, before\
    \ you attempt to use any external resource, you must be aware of the security\
    \ restrictions Silverlight applies to any code that utilizes HTTP. If you've attempted\
    \ use Ajax to access resources across domains, there is no direct way to do so\
    \ — you are limited by the Same-Origin Policy explained earlier in this chapter.\
    \ Silverlight is not restricted, and borrows an approach from Flash.\n\nIf Silverlight\
    \ attempts to access a resource outside of its hosting, it will first check for\
    \ clientaccesspolicy.xml file in the root of the destination Web server. If this\
    \ is not found, Silverlight will also check for crossdomain.xml — a file originally\
    \ used by Flash. These files enable a Web site to access to resources from applications\
    \ outside of its domain.\n\nFor example, the clientaccesspolicy.xml file in Listing\
    \ 12-8 allows access to any Web service or resource on your server from any Silverlight\
    \ application.\n\n# LISTING 12: A clientaccesspolicy.xml file allowing access\
    \ from anywhere\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\" ?>\n<access-policy>\n\
    \  <cross-domain-access>\n    <policy>\n      <allow-from>\n        <domain url=\"\
    ***\" />\n      </allow-from>\n      <grant-to>\n        <resource path=\"/\"\
    \ include-subpaths=\"true\" />\n      </grant-to>\n    </policy>\n  </cross-domain-access>\n\
    </access-policy>\n```\n\nTheclientaccesspolicy.xml file in Listing 12-9 allows\
    \ access to the /servicesdirectory on your Web server from example.com.\n\n# LISTING\
    \ 12: A clientaccesspolicy.xml file allowing limited access\n\n```\n<xml version=\"\
    1.0\" encoding=\"utf-8\" ?>\n<access-policy>\n  <cross-domain-access>\n    <policy>\n\
    \      <allow-from>\n        <domain url=\"http://www.example.com\" />\n     \
    \ </allow-from>\n  </allow-from>\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "```\n<grant-to>\n  <resource path=\"/services/\" include-subpaths=\"true\"\
    \ />\n</grant-to>\n<policy>\n  <cross-domain-access>\n  faccess-policy>\n</policy>\n\
    ```\n\nTheclientaccesspolicy.xml file allows more granular control of resource\
    \ access, and should be used in preference to Flash's crossdomain.xml file, which\
    \ can only restrict by source domain.\n\nWriting a Web service for Silverlight\
    \ is identical to writing one for Ajax. Consuming the Web service is the same\
    \ as calling a Web service from a full .NET application. You add a service reference,\
    \ and then use the generated proxy class, although all Web calls in Silverlight\
    \ are asynchronous.\n\nThere are however, limitations on the type of service Silverlight\
    \ can call. With WCF, you can write Web services using the WS* standards, allowing\
    \ transport and security. Silverlight does not support these types of Web service.\
    \ Like Ajax, it can only call HTTP Web services, those with an httpBinding or\
    \ webBinding. The Silverlight service stack does not support setting any type\
    \ of credential header, so you cannot WCF authentication. If you are sending sensitive\
    \ information to a Web service through Silverlight, you should host it on an SSL-secured\
    \ Web site.\n\n# USING.ASNET AUTHENTICATION AND AUTHORIZATION IN AJAX AND SILVERLIGHT\n\
    \nYou may have noticed when you inspected the calls to a Web service from Ajax,\
    \ or if you watch Silverlight Web service calls with Fiddler, the cookies belonging\
    \ to the page go with the Web call (assuming, of course, that the cookies are\
    \ on the same domain as the hosting page). Normally, WCF is independent of the\
    \ hosting ASP.NET platform. However, for Ajax and Silverlight, it is useful to\
    \ allow WCF to some of the ASP.NET features like authentication, authorization,\
    \ membership, and profiles. Compatibility mode is a global setting configured\
    \ in the web.config file:\n\n```\n<system.serviceModel>\n  <serviceHostingEnvironment\n\
    \    aspNetCompatibilityEnabled=\"true\" />\n</system.serviceModel>\n```\n\nYou\
    \ then enable the compatibility mode for your Web service by decorating the class\
    \ with the AspNetCompatibilityRequirements attribute, as shown in the following\
    \ snippet:\n\n```\n[AspNetCompatibilityRequirements(RequirementsMode =\nAspNetCompatibilityRequirementsMode.Allowed)]\n\
    public class ExampleImplementation : IExample\n```\n\nYou may have noticed that\
    \ the Ajax Web service in this chapter is already marked with the AspNetCompatibilityRequirements\
    \ attribute."
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Once a service is marked to use ASP.NET compatibility, it can make use of the
    authentication provided by ASP.NET''s membership provider and the authorization
    provided by the roles provider. The current user identity and roles will flow
    through your Ajax or Silverlight Web services. This allows you to authorize the
    Web service calls using PrincipalPermission demands (covered in Chapter 11), or
    by accessing the HttpClient.User.Identity object within your service methods.


    # A CHECKLIST FOR SECURING AJAX AND SILVERLIGHT


    The following is a checklist of items to consider when writing Ajax or Silverlight
    services:


    +   * Ajax and Silverlight are constrained by crossdomain policies — Ajax can
    only communicate with services and resources on the same domain. Silverlight can
    access external resources from the external Web site allows it.

    * UpdatePanel could be considered more secure than ScriptManager — UpdatePanel
    hides implementation, reduces the attack surface, and is easier to implement than
    ScriptManager services, making it a more secure option. However, ScriptManager
    services are more scalable.

    * You can use the ASP.NET security model — This enables you to use the authentication
    token created by the ASP.NET login process to authenticate and authorize access
    to your Web services.

    * The Silverlight security model has restrictions — The Silverlight security model
    restricts the classes you can inherit from, as well as the methods you can implement
    or override.

    * Silverlight Isolated storage is discoverable by users — Do not use isolated
    storage to save sensitive information.

    * All Silverlight cryptography functions need initial values — You cannot store
    keys, hashes, or initialization vectors (IVs) securely on the local machine. Use
    a Web service in conjunction with the ASP.NET membership functions to store cryptographic
    keys on your server.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 13


    # Understanding Code

    Access Security


    .NET framework has two major security mechanisms: role-based security and code
    access security (CAS). Both of these features are threaded throughout the .NET
    framework. CAS ensures that code does not perform actions or access resources
    it should not be able to, and provides an extra layer of safety on top of the
    operating system functions. The environment in which your application runs can
    be configured to only allow a subset of the full .NET framework functionality.
    It is important that you know how to properly request permissions at run-time,
    rather than assuming your application has access to everything it can do.


    In this chapter you will learn about the following


    +   * What CAS is

    * How to ask for permissions in your code

    * How CAS and the ASP.NET trust levels together

    * How the Global Assembly Cache (GAC) affects trust


    > NOTE This chapter covers the basics of CAS. This is a wide-ranging subject that
    touches on ClickOnce, plug-in architecture, isolation of third-party components,
    and other things that you may end up requiring as your applications become more
    advanced. If you want to know more, MSDN has an entire section on CAS at http://msdn.microsoft.com/en-us/library/930b76w0.aspx.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# UNDERSTANDING CODE ACCESS SECURITY


    Traditionally, software runs using the operating system-level, roles, and permissions
    of the user who executes the program. But, in today''s world of mobile code, where
    software can come from the Internet or other networks, this approach requires
    enhancement. Java and ActiveX provide a sandbox (that is, an isolated environment
    in programs run) that acts as a security boundary between running code and potentially
    sensitive resources on the computer.


    The .NET Framework uses Code Access Security (CAS) to provide an optional sandbox
    for managed code. CAS is used to limit access that programs have to protected
    resources and operations, regardless of the user running the program.


    For example with a non-CAS program such as Notepad, an Administrator could write
    a text file to C:\Windows because his or her account has permission to do, and
    no restrictions are placed on the Notepad program. A CAS-based text editor, could
    have restrictions set upon it — for example, it may not be allowed to write to
    C:\Windows. Even though the Administrator has the capability to write files to
    C:\Windows, it would fail when it attempts to save a file to location.


    Normally when you run a .NET application on your desktop, it runs in Full Trust
    (Full Trust is a term used in .NET security that all CAS checks will pass — that
    is, it has all permissions). The default configuration for IIS also hosts ASP.NET
    applications in Full Trust, as does Visual''s built-in web server. This change
    can in a shared hosting environment, or any locked-down configuration. You have
    three options for dealing with this type of situation:


    +   - You can specify a minimum set of permissions without your code will not
    run.


    +   - You can design your application so that code requiring more privileges (for
    example, data access code) will be placed in its well-tested assembly. This isolated
    assembly as be granted the elevated permissions, reducing the exposure of the
    application as a whole.


    +   - You can fail gracefully, and disable certain application functions if you
    do not have the necessary permissions. For example, you might disable file uploading
    if you do not have the permission to write to the local file system.


    CAS identifies code on its origin, publisher, string name, or other types of evidence.
    Based on the identity of the code, CAS assigns permissions by consulting the .NET
    security policies. In ASP.NET CAS can be leveraged by assigning trust levels.
    Trust levels are used to restrict the functionality to a Web site. Code running
    in site A may require more permissions than running code in site B on the same
    machine. If you are writing code that will run on a web server you do not control,
    then you cannot assume that you can wander around freely. You will not know how
    to evaluate what you can do, and fail gracefully, or disable functionality.


    It''s important to note that CAS runs alongside the operating system security,
    as shown in Figure 13-1.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_343_0.png)


    FIGURE 13-1: How CAS and OS security mesh'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'For example, if your .NET application attempts to write a file to disk, CAS
    will evaluate the .NET permissions granted to your code when it was loaded. The
    .NET permissions do not allow your code to write a file, then the run-time will
    throw a security exception. However, if your program has been granted the CAS
    permission to write to the hard drive, then the .NET run-time will grant access
    to the Windows APIs.


    At this point, the operating system checks to see if the user running the program
    has the appropriate Windows permissions to write the file in the specified directory.
    If the user does not have permission then Windows will deny access, and the .NET
    run-time will throw an unauthorized access exception. If the user has permission
    from Windows to write the file then the file will be written.


    Table 13-1 provides a breakdown of the CAS permission classes in the .NET framework.


    **Table 13-1:** The .NET Framework Code Access Permission Classes


    | NAMESPACE | CLASS | DESCRIPTION |

    | --- | --- | --- |

    | System.Data | OdbcPermission | Allows access to an Open Database Connectivity
    (ODBC) data source |

    | System.Data | OleDbPermission | Allows access to an OLE DB data source |

    | System.Data.OracleClient | OraclePermission | Allows access to an Oracle database
    |

    | System.Data.SqlClient | SqlClientPermission | Allows access to SQL databases
    |

    | System.Diagnostics | EventLogPermission | Allows read or write access to the
    event log |

    | System.DirectoryServices | DirectoryServicesPermission | Allows access to the
    DirectoryServices classes |

    | System.Drawing.Printing | PrintingPermission | Allows access to printers |

    | System.Messaging | MessageQueuePermission | Allows access to Microsoft Message
    Queuing (MSMQ) |

    | System.Net | DnsPermission | Allows access to Domain Name System |

    | System.Net | WebPermission | Allows the making or accepting of connections on
    a Web address |


    continues'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 318 | CHAPTER 13 UNDERSTANDING CODE ACCESS SECURITY


    TABLE 13-1 (continued)

    | NAMESPACE | CLASS | DESCRIPTION |

    | :--- | :--- | :--- |

    | System.Net | SocketPermission | Allows access to transport sockets for communication
    |

    | System.Security.Permissions | EnvironmentPermission | Allows read or write access
    to environment variables |

    | System.Security.Permissions | FileDialogPermission | Allows access to files
    selected by a user from an Open file dialog |

    | System.Security.Permissions | FileIOPermission | Allows access to the file system
    |

    | System.Security.Permissions | IsolatedStoragePermission | Allows access to isolated
    storage |

    | System.Security.Permissions | ReflectionPermission | Allows access to reflection
    to discover information about a type at run-time |

    | System.Security.Permissions | RegistryPermission | Allows read, write, and delete
    access to the registry |

    | System.Security.Permissions | SecurityPermission | Allows calls into unmanaged
    code, permission assertions, and other security functions |

    | System.Security.Permissions | UIPPermission | Allows access to desktop user-interface
    functionality |

    | System.ServiceProcess | ServiceControllerPermission | Allows access to Windows
    services |


    # Using ASP.NET Trust Levels


    ASP.NET has five trust levels, which are preset permissions sets that grant the
    capability to perform certain tasks. Each trust level (apart from Full Trust)
    can be customized, or new trust levels can be created.


    Table 13-2 shows the main restrictions provided by each trust level. If you want
    to see the exact limitations, you can open the web-*.trust.config file for each
    level from C:\Windows\Microsoft\.NET\Framework\v2.0.50727\CONFIG.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# TABLE 13-2: Default Restrictions for ASP.NET Trust Levels


    | TRUST LEVEL | RESTRICTIONS |

    | --- | --- |

    | Full | None |

    | High | Cannot call unmanaged code |

    | Medium | Some restrictions on reflection (In addition to High restrictions)
    Cannot create Web requests Can only write files to the application directory and
    below Some restrictions on the environment variables accessible |

    | Low | (In addition to Medium restrictions) Cannot make any out-of-process calls
    (for example, to a database, to the network, or to send emails) |

    | Minimal | Denied almost everything |


    Ideally, your code would be able to cope with differences in trust levels without
    crashing. But how do you accomplish this?


    # Demanding Minimum CAS Permissions


    If your application will not function with a particular permission set, you can
    embed this minimum requirement as part of your assembly.


    When you create a new application or assembly, an AssemblyInfo.cs file is created
    in the properties directory of your project. You can add your minimum requirements
    into this file by adding the CAS permissions necessary for your application to
    run. For example adding the following indicates that your application must be
    granted the FileIOPermission:


    ```

    [assembly: FileIOPermission(SecurityAction.RequestMinimum, Unrestricted=true)]

    ```


    If your application is hosted in an ASP.NET trust level that does not grant this
    permission, it will fail to load, and will see an exception detailing that the
    hosting environment “Failed to grant minimum permission requests.",'
  merge: -1
  img_proc: true
- pgno: 347
  md: "# Asking and Checking for CAS Permissions\n\nIf you want to have control over\
    \ permissions (for example, disable optional functionality when your hosting environment\
    \ does not grant the necessary permissions), you can use two ways to express your\
    \ CAS requirements:\n\n+   - Imperativedemands, which use the standard methods\
    \ implemented by each permission class\n- Declarativedemands, which use the associated\
    \ attribute\n\n# Imperative Demands\n\nImperative demands are written in .NET\
    \ code. First, you instantiate the appropriate permission class, providing any\
    \ parameters necessary to specify the operation you wish to perform. You can then\
    \ use the Demand method on the class. If the run-time environment in which your\
    \ application is configured to not allow the permissions you are requesting, a\
    \ SecurityException will be thrown. Listing 13-1 shows an example.\n\n> LISTING\
    \ 13-1: Requesting a security permission imperatively\n\n```\n// Create an instance\
    \ of the permission class\n// and set the properties to express the\n// desired\
    \ operation.\n\nFileIOPermission filePermission = new\nFileIOPermission(FileIOPermissionAccess.Write,\n\
    @C:\\example.wrox);\n\ntry {\n    // Request the permission to write to c:\\example.wrox\n\
    \    filePermission.Demand();\n    // Now perform the operation\n...\n} catch\
    \ (SecurityException ex) {\n    // Environment has not granted permission\n  \
    \  // Fail gracefully\n}\n```\n\nListing 13-1 illustrates how you would request\
    \ permission to write to a file called example.wrox in the root directory of the\
    \ C:\\ drive. The demand for permission will only succeed if your code (and any\
    \ code that has called it) has permissions to do so. Because the permission demand\
    \ is in code, you can react accordingly. You can save to a secondary location,\
    \ or disable all save functionality within your application."
  merge: -1
  img_proc: true
- pgno: 348
  md: "# Declarative Demands\n\nDeclarative demands are expressed using attributes\
    \ that become part of the metadata for your assembly during compilation. For a\
    \ CAS permission object, the equivalent attribute exists, which is then applied\
    \ to a method or class. Listing 13-2 shows an example.\n\nLISTING 13-2: Requesting\
    \ a security permission declaratively\n\n```\n// Create an instance of the permission\
    \ class\n// and set the properties to express the\n// desired operation.\n[FileIOPermission(SecurityAction.Demand,\n\
    \    Write = \"C:\\example.wrox*\")\nvoid SaveFile(){\n    // Save the file\n\
    }\n```\n\nBecause declarative permissions are compiled into your assembly metadata,\
    \ the permissions cannot be changed at run-time, providing less flexibility than\
    \ imperative demands. However, as metadata, it can be extracted by the run-time\
    \ and other tools to review the permissions your assembly requires. System administrators\
    \ can use a tool such as PermCalc (included with the Windows SDK) to gauge the\
    \ permissions your application may need, and configure your environments accordingly.\n\
    \n# Testing Your Application Under a New Trust Level\n\nNow that you're familiar\
    \ with how trust works, how you can demand permissions, and how you can react\
    \ to a lack of them, you might want to test your application under them. The simplest\
    \ way to do this is to set the trust level you wish to test in the system.web\
    \ section of your application's web.config file, as shown here:\n\n```\n<system.web>\n\
    \n<trust level=\"Medium\"/>\n</system.web>\n```\n\n> NOTE When running under IIS,\
    \ an administrator can configure ASP.NET to not allow you to set your own trust\
    \ level. Chapter 14 details how to configure custom trust levels and how to lock\
    \ them."
  merge: -1
  img_proc: true
- pgno: 349
  md: "# 322 CHAPTER 13 UNDERSTANDING CODE ACCESS SECURITY\n\n# TRY OUT Adding Permission\
