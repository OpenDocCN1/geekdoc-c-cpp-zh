    \n# LISTING 12: Sending a GET request with an XHR object\n\n```\nvar xhr = new\
    \ XMLHttpRequest();\nxhr.open(\"GET\", \"test.txt\",true);\nxhr.onreadystatechange=function()\
    \ {\n  if (xhr.readyState==4) {\n    alert(xhr.responseText);\n  }\n}\nxr.send(null);\n\
    ```\n\nAt this point, you might be concerned — if the XHR can make requests just\
    \ like a Web browser, how is it to stop a malicious script (perhaps injected via\
    \ XSS) from sending information to, or receiving information from, the attacker's\
    \ site?\n\n# The Ajax Same Origin Policy\n\nThe Origin Policy is a security concept\
    \ applied to a number of client-side technologies, including the XMLHttpRequest\
    \ object. In short, the policy allows an XHR instance created via a page loaded\
    \ from a site to only access resources on the same site.\n\nFor example, if JavaScript\
    \ were included in http://www.wrox.com/example.html, it would be able to use the\
    \ XHR to access resources from www.w.com, but could not send requests or receive\
    \ information from www.microsoft.com. The origin of a page is calculated from\
    \ the domain name, the port on which the application is hosted. If (and only if)\
    \ all these factors are identical the original site will be considered the same.\
    \ Table 12-1 lists the outcome of origin checks for a page hosted at http://www.wrox.com/example.html.\n\
    \n# TABLE 12-4: Origin Comparisons for a Page Hosted at http://www.wrox.com/example.html\n\
    \n| COMPARED URL | SAME ORIGIN | REASONING |\n|---|---|---|n| http://www.wrox.com/s/example.html\
    \ | Yes | Identical protocol, host, and port number. |\n| http://www.wrox.com/s2/test.html\
    \ | Yes | Identical protocol, host, and port number. |\n| https://www.wrox.com/s/example.html\
    \ | No | The protocol is different. |\n| http://www.wrox.com:81/s/example.html\
    \ | No | The port number is different. |\n| http://www.wrox2.com/s/example.html\
