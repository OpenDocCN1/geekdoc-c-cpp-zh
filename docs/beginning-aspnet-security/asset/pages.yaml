- pgno: 134
  md: "```\nPerformanceCounter badGuysFoundPerSecond =\nnew PerformanceCounter(\"\
    SecuringASPNet\",\n\"BadGuysFoundPerSecound\",\n\"My Instance Name\",\nfalse);\n\
    ```\n\nLike, performance counters can be used for positive purposes such as the\
    \ number of new users registered on your Web site. Changing the value of a performance\
    \ counter requires that your Web application runs in Full Trust. (Chapter 13 discusses\
    \ trust, and the various ways you can place selected elements in Full Trust while\
    \ leaving the trust level of your application in a lower trust level).\n\n# UsingWMI\
    \ Events\n\nThe Windows Management Interface (WMI) is another standard feature\
    \ of Windows. It is the Microsoft implementation of Web-Based Enterprise Management\
    \ (WBEM), a standard used to watch and control devices and software on a network.\
    \ Because it is standards-based, monitoring of WMI information is not just limited\
    \ to Microsoft software (as is the case with Hewlett Packard, Tivoli from IBM,\
    \ but you can use it with other management tools such as OpenView and various,\
    \ Open Source products (such as OpenPegasus).\n\nWMI works on a provider/consumer\
    \ model. Aprosider describes itself using Managed Object Format (MOF) and its\
    \ availability in the WMI repository (the Common Information Model, or CIM, Database)\
    \ via the CIM Object Management (CIMOM). Consumers can query the WMI repository\
    \ for information. However, WMI itself does not hold information. The information\
    \ registered by providers to contact the providers and retrieve the information\
    \ requested.\n\nTo create a WMI event, you add a reference to the System.Management\
    \ assembly to your project, create a class for the event, and inherit from BaseEvent\
    \ in the System.Management Instrumentation class. You provide event information\
    \ by adding fields to your class, as shown in Listing 5-5.\n\n# LISTING 5: A Sample\
    \ WMI Event Class\n\n```\nusing System.Management.Instrumentation;\n\nnamespace\
    \ WMIEvents\n{\n    public class BadGuysDetectedEvent : BaseEvent\n    {\n   \
    \     public bool HasMoustache;\n\n        public BadGuysDetectedEvent(bool hasMoustache)\n\
    \        {\n            this.HasMoustache = hasMoustache;\n        }\n    }\n\
    }\n```"
