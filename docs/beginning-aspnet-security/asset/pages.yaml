- pgno: 98
  md: "# Request Forgery and How to Avoid It\n\nThe obvious mitigation to a URL-based\
    \ attack like this would be to switch to HTML forms. Using forms would be obeying\
    \ the HTML specification — a URL-driven (GET) request should not change state.\
    \ RFC2616 (the HTTP 1.1 specification) states in section 9.1.2 the GET and HEAD\
    \ HTTP methods should not have the significance of taking action other than retrieval.\
    \ Each GET request should be idempotent — that is, every request should return\
    \ the result.\n\n> WARNING You may recall from Chapter 2 that a postback occurs\
    \ when an ASP.NET page submits a form it generates to itself, usually via a JavaScript-triggered\
    \ form submission. Checking.IsPostback is a reasonable way to check that a request\
    \ is not driven by the query string. Unfortunately, this is not the case. If you\
    \ send a GET request to an ASP.NET page that includes the __State parameter, the\
    \ __EventValidation parameter, and any other form parameters from your page in\
    \ the query, then ASP.NET considers this to be a postback. Depending on your page's\
    \ function, you may end up changing state — breaking the HTTP specification. You\
    \ should always check the HttpMethod of the request in addition to Page.IsPostback\
    \ like:\n\n```\nif (Page.IsPostback && Request.HttpRequest==\"POST\")n{\n    //\
    \ Perform my actions\n}\n```\n\nMoving to forms is not enough. An attacker can\
    \ easily build a form on his or her Web site using the same field names and types\
    \ as on your Web site. The attack form would then have its action parameter set\
    \ to the vulnerable Web site and JavaScript to submit the form without user interaction.\
    \ This was how the INDirect attack worked.\n\nYou may be aware that, during an\
    \ HTTP request, a header called REFERER may contain the URL of the previous page\
    \ in the browser history. This header could be used to check if a form was submitted\
    \ from a page on the same site, except that some browsers and Internet privacy\
    \ software strip this header. So what can you do to ward off CSR attacks?\n\n\
    # MitigatingAgainstCSRF\n\nFor a CSRF attack to work, the following conditions\
    \ must be met\n\n+   - The attacker must have knowledge of sites on where the\
    \ victim is currently authenticated.\n- The target site must use ambient authority,\
    \ where the browser sends authentication credentials with each request.\n- The\
    \ target site must not have secondary authentication for actions, such as a requirement\
    \ to re-enter a password."
  merge: -1
  img_proc: true
- pgno: 99
  md: '# CHAPTER 4 USING QUERY STRINGS, FORM FIELDS, EVENTS, AND BROWSER INFORMATION


    The common mitigation technique against CSRF for ASP.NET sites is to useViewState
    in combination with a ViewStateKey. (See Chapter 5 for more details.) However,
    this presents some disadvantages:


    +   - ViewState must be enabled, which may always be the case in optimized Web
    sites.

    - You must have a way of uniquely identifying users, either by their login identity
    or by using a session identifier.

    - TheViewStateUserKey must be manually set within your code, something that is
    easy to forget.


    If theViewStateUserKey does not meet your needs, another method of mitigation
    is to add a token to every form, which is verified in session or in a cookie on
    the web server, insert the token (or a value generated from it) into each form,
    and check it with every form submission. However, you can automate the process
    by implementing an HTTP Module.


    An HTTP Module (as you may remember from Chapter 2) is an object that sits in
    the ASP.NET pipeline, and can hook into the processing of a request or the return
    of a response. To add CSRF protection every form submission, you should implement
    the following actions:


    +   1. If a request is from a new user (no cookie is sent), generate a unique
    token for that user.

    2. If the request is a GET request, store the token in a session cookie on the
    user’s browser (A session cookie is one that is deleted when the user closes the
    browser).

    3. If the request is a POST (or PostBack) and the token is not present, reject
    the request as a potential CSRF attack.

    4. If the request is a POST (or PostBack), read the token from the user’s browser
    and compare it to the token embedded in the ASP.NET Web form. If the tokens do
    not match, or the token is missing, reject the request as a potential CSRF attack.

    5. If the tokens match, allow the response to continue.

    6. When the request is completed, before the response is sent, examine the response
    to look for an ASP.NET Web form. If one is present, automatically add the token
    (or a value generated from it) into the form as a hidden field.


    You should note that only form submissions are protected. Any pages driven by
    query strings (GET requests) are not protected, so you should be obeying the HTML
    specification.


    # TRY OUT Writing an HTTP Module to Protect Against CSRF Attacks


    In this example, you will write an HTTP Module that will perform the various actions
    necessary to protect against a CSRF attack. In doing so, you will not only protect
    your Web application, but you will learn how to hook into various stages of the
    ASP.NET pipeline and perform actions automatically without adding any code to
    your pages'' classes.'
  merge: -1
  img_proc: true
