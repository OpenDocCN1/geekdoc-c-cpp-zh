- pgno: 153
  md: '# Choosing a Symmetric Algorithm


    The .NET framework provides the most common symmetric encryption algorithms:


    +   - Data Encryption Standard (DES)

    - Triple Data Encryption Algorithm (3DES/TDEA)

    - RC2

    - Rijndael/Advanced Encryption Standard (AES)


    Each one is derived from the SymmetricAlgorithm class in the System.Security.Cryptography
    namespace. Advances in computing power mean the AES is now considered easily broken,
    so it should be used with U.S. export requirements. RC2 was invented by Ronald
    Rivest for RSA Data Security to comply. Rijndael was produced as part of a competition
    by the National Institute of Standards and Technology (NIST) to find a new encryption
    algorithm. Its name is a portanteau of the inventor''s names, Joan Daemen and
    Vincent Rijmen.


    Generally, you should use RijndaelManaged and AesManaged classes because they
    are the most commonly used symmetric algorithms in use today. (The algorithm for
    the Advanced Encryption Standard, or AES, is really the Rijndael algorithm with
    a fixed block size and iteration count.)


    # Generating Keys and Initialization Vectors


    As previously mentioned, a key and an IV should be a truly random set of bytes.
    As you learned earlier in the section, "Hashing," the RNGCryptoServiceProvider
    class is the cryptographically secure way of generating such bytes.


    The allowed size of a key varies according to the algorithm. The base SymmetricAlgorithm
    supports a property, LegalKeySizes, which will allow you to discover the minimum
    and maximum key sizes for each algorithm. Table 6-1 shows minimum and maximum
    key sizes for .NET''s symmetric encryption algorithms.


    TABLE 6-1: Current Minimum and Maximum Key Sizes for .NET''s Symmetric Encryption
    Algorithms


    | ALGORITHM | MINIMUM KEY SIZE (BITS) | MAXIMUM KEY SIZE (BITS)n| DES | 64 | 64
    |

    | Triple DES | 128 | 192 |

    | Rivest Cipher 2 (RC2) | 40 | 128 |

    | Rijndael/AES | 128 | 256 |'
