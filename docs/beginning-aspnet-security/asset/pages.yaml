    \    using (StreamReader sr = new\n    StreamReader(httpResponse.GetResponseStream()))\n\
    \    {\n        retrievedPage = sr.ReadToEnd();\n    }\n    pageContents.Text\
    \ = Server.HtmlEncode(retrievedPage);\n}\n\n</script>\n\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD HTML 1.0\nTransitional//EN\"\n\"http://www.w3.org/TR/xhtml/DTD/\n\
    Xhtml-transitional.dtd\">\\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n\
    <head runat=\"server\">\n<title>title</title>\n<head>\n<body>\n<form id=\"webRequestTest\"\
    \ runat=\"server\">\n    <asp:Literal ID=\"pageContents\" runat=\"server\" />\n\
    </form>\n</body>\n</html>\n```\n\n+   2. If you run this code, you will see the\
    \ XML from the Wrox RSS feed is displayed. Open your web.config file and add trust\
