- pgno: 374
  md: '# Using Log Parser to Mine IIS Log Files | 37


    Before running any data on your log files, you should make a copy of it and run
    the mining operations on the copy. You should need evidence in the case of a hacked
    web site, log files can only be used if they are authentic and untouched. Copying
    the files also presents another advantage. You can reduce the amount of data to
    look through by only copying files applicable to the time period when you think
    an attack has happened.


    After a potential attack, the first query you will want to run is the number of
    hits to resources hosted on your web site. A high number of requests from a single
    resource may show a resource under attack. The following command line uses Log
    Parser to parse and display any entries as *.aspx pages and Windows Communications
    Foundation (WCF) services (ending in .svc):


    ```

    LogParser SELECT TOP 10 cs-uri-stem as url,\COUNT(cs-uri-stem) as hits

    FROM ex* WHERE cs-status=400 OR cs-status =500 AND

    (TO_LOWERCASE(cs-uri-stem) LIKE ''*.aspx*'')

    OR TO_LOWERCASE(cs-uri-stem)

    LIKE ''*.svc*'') GROUP BY url ORDER BY hits DESC

    ```


    When run against logs from an instance of Graffiti that I host on a server for
    testing purposes, this query returns data somewhat like the following. You will
    notice out of the ordinary for a blog server, the comments pages, the home page,
    and individual entries, which are the most commonly loaded pages.


    | url | hits |

    |---|---|

    | /CommentView.aspx | 5885 |

    | /Default.aspx | 3051 |

    | /Default.aspx.n/CommentView.guid,3dedal1a-74e6-49e9-af3d-09d27d15b19e.aspx |
    870 |

    | /FormatPage.aspx | 803 |

    | /Trackback.aspx | 711 |

    | /2006/09/03/TestTitlePostUsingWindowsLiveWriterBeta.aspx | 602 |

    | /Login.aspx | 535 |

    | /Archives.aspx | 448 |

    | /feed/Default.aspx | 405 |


    ```

    Statistics:

    -------

    Elements processed: 62143

    Elements output: 10

    Execution time: 1.98 seconds

    ```


    Let examine the query more closely to show how Log Parser works. Table 14-5 shows
    a breakdown of the parts of the SQL query used.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# TABLE 14-5: Breakdown of the Log Parser Query


    | QUERY PART | PURPOSE |

    | --- | --- |

    | SELECT TOP 10 cs-uri-stem AS url, COUNT(cs-uri-stem) AS hits | Selects the cs-uri-stem
    column, renames it to url, and also selects the number of hits it received by
    totaling the number of appearances it has in the log files processed. It names
    column hits. The TOP 10 restriction instructs Log Parser to only return the top
    ten results found. |

    | FROM ex*.log | Selects the data source to be used — in this case, any file beginning
    with ex and having an extension of .log. |

    | WHERE (sc-status<400) OR (sc-status>=500) | Limits the records processed to
    exclude any request that returned a status code between 400 and 500. The HTTP
    specification states indicate a clear error, such as requesting a response that
    does not exist. |

    | AND (TO LOWERCASE(cs-uri-stem) LIKE ''%.as%'' OR LOWERCASE(cs-uri-stem) LIKE
    ''%.svc'') | Limits the records processed to URLs that are in .as% (where .as
    is a wildcard) or .svc, thus limiting the query to the default ASP NET page extensions.
    |

    | GROUP BY url ORDER DESC | Groups the results by URL, and then sorts the results
    in descending order of hits, putting the most popular request at the top of the
    results. |


    You can break down parser usage into hits per day in the following:


    ```

    LogParser "SELECT TO_STRING(TO_TIMESTAMP(date, time),

    ''yyyy-mm-dd'') AS day,

    cs-uri-stem AS url, COUNT(cs-uri-stem) AS hits FROM ex*.log WHERE

    (sc-status<400 OR sc-status>=500) AND

    (TOLOWERCASE(cs-uri-stem) LIKE ''%.as%''

    OR LOWERCASE(cs-uri-stem) LIKE ''%.svc'') GROUP BY day,

    ORDER BY day DESC" -rtp:1

    ```


    A higher number of hits on a particular resource may indicate a potential attack,
    which bears further investigation.


    Another indicator is the number of errors within an hour. A higher-than-normal
    number of errors may indicate that an attacker is running scanning software against
    your application. The following query returns any hour where there were more than
    50 errors under examination. You will obviously need to tweak the rate limit to
    match your Web site.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '```

    LogParser *SELECT date, QUANTIZE(time, 3600) AS hour, sc-status

    Count(*)

    AS Errors FROM ex*.log WHERE sc-status =400

    GROUP BY date, hour, sc-status

    HAVING Errors>50 ORDER BY Errors DESC -rtp:-1

    ```


    When the query was executed against sample test logs, this returned the following
