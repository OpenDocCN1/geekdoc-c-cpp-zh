  md: "When the page is loaded, it calls ConvertTotal() to display the total order\
    \ value in the currency the user selects from the drop-down list of available\
    \ currencies. (The total price is hard-coded in this example. Obviously, in the\
    \ real world, it would be calculated based on the order items). When the page\
    \ is initially loaded, the currency field does not exist, and in this case, it\
    \ is taken care of the initial null case statement, which detects the currency\
    \ to U. dollars.\n\nIf an attacker changes the drop-down so it selects an unexpected\
    \ value — for example HACKED ? The function would then return a total price of\
    \ 0, which may be then when taking the money from a credit card. The hacker has\
    \ taken free goods. This kind of attack doesn't need Fiddler to be created; other\
    \ simpler tools are available.\n\nSo let's examine another approach. Firefox has\
    \ an extension called Tamper Data (Figure 2-7) that allows the user to change\
    \ values in an easy-to-use way before the HTTP request reaches the server.\n\n\
    A better approach (with safety by default) would be to throw an exception, or\
    \ otherwise indicate an error if an unknown currency is found, as shown in the\
    \ following code snippet An unknown currency is an indication that the request\
