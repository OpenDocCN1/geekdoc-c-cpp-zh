    If you test a value in the input field, is it reported as being part of the Request
    collection, but also as you create a form that specifies the example value as
    part of the query string and as of a submitted form? You can force the form line
    URL to contain a value for the example by changing the form declaration to the
    following:


    ```

    <form action="Default.aspx?example=QueryString" methods="post">

    ```


    Now, when you submit the form, you will see that Request.QueryString contains
    a value, as does Request.Form, which contains the value you entered in the input
    box. You can also see that the value in the query string takes precedence over
    the form if you access the values via the Request[] indexer. In fact, the first
    index checks the query string, then the forms collection, and finally, the cookies
    collection for a request. You should always be specific about where you find your
    values to be retrieved; otherwise, an attacker, simply by including a field and
    on a page URL, can override any values contained within a form submitted by a
    POST request.


    You have now seen how any input into your Web application can be altered or faked.
    You may be thinking that changing the contents of a text box isn''t much of a
    concern. But what if you have a drop-down list containing valid values for your
    application, and you limit the valid values based on a user''s identity?


    Consider the example code shown in Listing 2-3, which could be part of an order
    process.'
