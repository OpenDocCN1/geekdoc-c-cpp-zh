    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head run=\"server\">\n<title>Accessing\
    \ Files</title>\n</head>\n<body>\n<h1>Accessing Files</h1>\n<form id=\"form\"\
    \ runat=\"server\">\n<asp:ListBox id=\"filename\" runat=\"server\">\n<asp:ListItem\
    \ Text=\"example1.txt\" Value=\"example1.txt\" />\n<asp:ListItem Text=\"example2.txt\"\
    \ Value=\"example2.txt\" />\n</asp:ListBox>\n<asp:Button ID=\"submit\" runat=\"\
    server\"\nonclick=\"submit_OnClick\" />\n</form>\n</body>\n</html>\n```\n\n2.\
    \ In the code file, default.aspx.cs, change the contents to the following:\n\n\
    ```\nusing System;\npublic partial class _Default : System.Web.Page\n{\n    protected\
    \ void Page_Load(object sender, EventArgs args)\n    {\n    }\n    protected void\
    \ submit_OnClick(object sender, EventArgs args)\n    {\n        Response.Redirect(\"\
    getfile.aspx?filename=\"+ filename.SelectedValue);\n    }\n}\n```\n\n3. Finally,\
    \ create two text files, example1.txt and example2.txt, and enter any text you\
    \ like in them.\n\nIf you run this page, you will see that the Response.Redirect\
    \ means the direct URI is visible in the browser bar — which could then be bookmarked,\
    \ or shared, bypassing any logging or authorization code.\n\n4. So how do you\
    \ stop the address from being revealed? You must read the file and serve it in\
    \ code. Create a new Web form called getfile.aspx and change the code in file\
    \ contents to the following:"
