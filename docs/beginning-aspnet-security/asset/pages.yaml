  md: '# ABOUT THE AUTHOR


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_10_0.png)


    BARRY DORRANS is a consultant based in the United Kingdom, a public speaker, and
    Microsoft MVP in the “Visual Tools — Security” category. His development experience
    started out with a Sinclair ZX Spectrum, graduating through IBM PCs, minicomputers,
    mainframes, C++, SQL, Visual Basic, and the .NET framework. His approach to development
    and speaking blends humor with the paranoia suitable for considering security.
    In recent years, Barry has mentored developers through the full lifecycle of ASP.NET
    development, worked on the SubText Open Source blogging platform, and started
    his own Open Source project for Information Card identity providers, SharpSTS.
    Born in Northern Ireland, he still misses the taste of real Guinness.'
