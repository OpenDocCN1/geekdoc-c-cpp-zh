    <add fileExtension="*.bak" allowed="false"/>

    <fileExtensions>

    </requestFiltering>

    </security>

    <system.webServer>

    ```


    # # Filtering Requests Based on Request Size


    Often, third-party components for which you do not own the source may exhibit
    vulnerabilities on buffer overflows or other adverse reactions to large requests.
    You can configure request to filter requests based on request size, the size of
    the URL, or the size of the query string in the URL using the RequestLimits element
    and maxAllowedContentLength, maxURL, and maxQueryString attributes in this element.


    The content length size is expressed in bytes; the URL and query string sizes
    are measured in characters, as shown here:


    ```

    system.webServer>

    <security>

    <requestFiltering>

    <requestLimits>

    maxAllowedContentLength="300000000"

    maxUrl="260"

    maxQueryString="25"

    </requestLimits>

    </requestFiltering>

    </security>

    </system.webServer>

    ```


    # # Filtering Requests Based on HTTP Verbs


    In Chapter 2, you were introduced to the GET and POST verbs. The HTTP specification
    provides for other verbs and protocols on top of HTTP, and developers may use
    their own verbs. If you are certain that your application does not need additional
    verbs, then you can reduce the attack surface by limiting the verbs allowed to
    reach your application using the verbs element. Like filtering by file extension,
    this can work on either a whitelist or blacklist list.


    The following snippet shows how to limit the verbs that reach your application
    to GET and POST :


    ```

    system.webServer>

    <security>

    <requestFiltering>

    <verbs allowedUnlisted="false" />

    <add verb="GET" allowed="true" />

    <add verb="POST" allowed="true" />

    </verbs>

    </requestFiltering>

    </security>

    </system.webServer>

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: "# Filtering Requests Based on URL Sequences\n\nOften, third-party components\
    \ may exhibit problems based on URL sequences, such as directory transversal attacks\
    \ that put ... / into a URL to attempt to break out of the application's directory.\
    \ Request filtering can be configured using the denyUrlSequences section to stop\
    \ requests based on a sequence within the URL.\n\nFor example, the following configuration\
    \ will reject any request containing a .. sequence:\n\n```\nsystem.webServer\n\
    <security>\n  <requestFiltering>\n    <denyUrlSequences>\n      <add sequence=\"\
    ..\"/>\n    </denyUrlSequences>\n  </requestFiltering>\n  </security>\n</system.webServer>\n\
    ```\n\n# Filtering Requests Based on Request Segments\n\nSegment filtering allows\
    \ you to reject URLs that try to access a particular area of your application.\
    \ By default, IIS uses segment filtering to reject all requests that attempt to\
    \ access the bin,App_code, App_GlobalResources,App_LocalResources,App_WebReferences,App_Data,andAppBrowsers\
    \ directories. This is more flexible than URL sequences if you have areas that\
    \ share partial names as \"bin\" and \"binaries.\" Using URL filtering, you would\
    \ have to filter on \"bin,\" which would also block requests to \"binaries.\"\n\
    \nThe following snippet will block access to the \"bin\" segment, but allow access\
    \ to the \"binaries\" segment:\n\n```\nsystem.webServer\n<security>\n  <requestFiltering>\n\
    \    <hiddenSegments>\n      <add segment=\"bin\"/>\n    </hiddenSegments>\n \
    \ </requestFiltering>\n  </security>\n</system.webServer>\n```\n\n# Filtering\
    \ Requests Based on a Request Header\n\nFinally, requests can be rejected on the\
    \ length of a request header. With request sizes and URL sequences, this can be\
    \ useful in stopping attacks against third-party vulnerable components where updates\
    \ are not available. You can filter based on header size by adding the header\
    \ to"
  merge: -1
  img_proc: true
- pgno: 371
  md: "the headerLimits section, specifying the header name and the maximum size in\
    \ characters, as shown here:\n\n```\nsystem.webServer>\n<security>\n  <requestFiltering>\n\
    \    <requestLimits>\n      <headerLimits>\n        <add header=\"Example\" sizeLimit=\"\
    2\" />\n      </headerLimits>\n    </requestLimits>\n  </requestFiltering>\n</security>\n\
    system.webServer>\n```\n\n# Status Codes Returned to Denied Requests\n\nEach request\
    \ filtering rule returns a 404 status, with a specific sub-code, allowing you\
    \ to monitoring the log performance using IIS log monitoring tools. Table 14.3\
    \ lists the status codes returned by each role.\n\nTABLE 14-3: Status Codes Returned\
    \ by Request Filtering\n\n| ERROR | STATUS CODE |\n|--- |--- |\n| URL Sequence\
    \ Denied | 404.5 |\n| Verb Denied | 404.6 |\n| File Extension Denied | 404.7 |\n\
    | Denied by hidden segment | 404.8 |\n| Denied because request header is too big\
    \ | 404.10 |\n| Denied because URL was double-escaped | 404.11 |\n| Denied because\
    \ of high bit characters | 404.12 |\n| Denied because content length too large\
    \ | 404.13 |\n| Denied because URL too long | 404.14 |\n| Denied because query\
    \ string too long | 404.15 |\n\n# USING LOG PARSER TO MIN IIS LOG FILES\n\nIIS\
    \ log files are a useful source of information about activity against a Web application,\
    \ and can be used proactively (for example, to monitor the log files for suspicious\
    \ activity) and reactively (for example, to try to figure out what went wrong\
    \ if your application has been hacked). But processing the log files manually\
    \ is a painful task."
  merge: -1
