- pgno: 57
  md: "# EXAMINING HOW ASP.NET WORKS\n\nWhen Microsoft introduced ASP.NET, among the\
    \ main advantages were the event model and built-in state management that allowed\
    \ Windows developers to apply the same skills to Internet applications that they\
    \ learned on desktop applications. However, as you can see from examining the\
    \ requests and responses sent during an HTTP transaction, there is nothing in\
    \ the HTTP protocol itself that provides this sort of functionality. ASP.NET had\
    \ to build it using the existing HTTP standard.\n\nThe ASP.NET event model allows\
    \ developers to place a control in an ASP.NET page, and then write an event handler\
    \ for that event (for example, a button that will offer a Click event). Unlike\
    \ Windows or JavaScript applications where the event is raised and handled by\
    \ the (client), ASP.NET events are raised by the client, but handled by code that\
    \ runs on the ASP.NET server. When an event is raised by the client, the information\
    \ must be captured and transmitted to the server, which then examines it to determine\
    \ what event occurred and what caused it, before calling the appropriate method\
    \ within your code.\n\nWhen you write code to handle ASP.NET events, you don't\
    \ need to be aware of how the underlying mechanism works. However, as you have\
    \ seen, the information sent with request cannot be trusted, so it is worth noting\
    \ that ASP.NET turns a click on button into a server-side event.\n\n# Understanding\
    \ How ASP.NET Events Work\n\nSo does ASP.NET turn a click on an HTML button into\
    \ a Click() event on the server? To find out, you must examine an ASP.NET page\
    \ with a suitable control.\n\nListing 2-4 shows a simple Web page with Label controls\
    \ that tell you the type of the request (GET or POST), true or false indicating\
    \ if the page was a PostBack (postbacks were explained in just a moment), and\
    \ a message that appears if the link button on page is clicked. The page also\
    \ shows the form parameters that were sent, if any.\n\n+   LISTING 2: An ASP.NET\
    \ Page with an Event Bound to a Button\n\n```\n@ Language=\"C#\"\n<!DOCTYPE html\
    \ PUBLIC \"-W3C//DTD HTML 1.0 Transitional//EN\"\\n\"http://www.w3.org/TR/html1/DTD/html1-transitional.dtd\"\
    >\n<script runat=\"server\">\nprotected void Page_Load(object sender, EventArgs\
    \ e)\n{\n    requestType = Request.HttpMethod;\n    cameFromPostBack.Text = Page.PostBack.ToString();\n\
    }\nprotected void button_Clicked(object sender, EventArgs e)\n{\n    message.Text\
    \ = \"You clicked the button\";\n}\n</script>\nhtml xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n<title>Postback Demo</title>\n</head>\n```"
  merge: -1
  img_proc: true
