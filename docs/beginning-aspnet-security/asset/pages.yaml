  md: 'Now, when you press F5, you will see your console application, as well as the
    Web browser. The test application will wait for you to press a key before attempting
    to access the service because it must wait until the Web application has started.
    Press F5, and once your browser has completed loading, select the console application.
    Press Enter and you should see the results of the WCF call. The console application
    will wait for you to again press Enter before closing. Once the console application
    has closed, you should then close the browser to return to Visual Studio. You
    now have a very simple WCF service to which you can add the various types of security.


    # SECURITY AND PRIVACY WITH WCF


    Adding security to a WCF service is a three-step process:


    +   1. Select a security mode on the service side.

    2. Select the desired credential type on the client side.

    3. Set the client credential values on the client side.


    WCF offers two security modes:


    +   * Transport security

    * Message security


    # Transport Security


    Transport security provides point-to-point security between the client and the
    server. With transport security, the communication layer is responsible for protecting
    the messages. For example, Secure Sockets Layer (SSL) over HTTPS is a transport
    security mechanism. SSL encrypts and signs the messages sent through it, as shown
    in Figure 11-4.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_286_0.png)


    FIGURE 11-4: Transport security in WCF'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Transport security is suitable for the following scenarios:


    +   - When there are no intermediate systems between the client and the server.


    +   - When both the client and the server are hosted on the same intranet.


    Transport security has the following advantages:


    +   - Neither system has to understand any of the WSsecurity standards used for
    message security, simplifying the requirements made of a development framework.


    +   - Specialized hardware (such as SSL accelerators) may be used to further increase
    the performance and scalability of the solution.


    However, transport security also has the following disadvantages:


    +   - It supports a limited set of credentials.


    +   - It is dependent on the underlying transport, and some transports do not
    support security.


    +   - It precludes the use of routing or multiple hops, such as systems that expose
    a message router that accepts a message and forwards it to another internal system.


    # Message Security


    Message security is the converse of transport security. Instead of relying on
    the underlying transport, each message is signed and/or encrypted before it reaches
    the transport layer using the WS-Security specification. Message security also
    allows for a wider range of credentials, as long as both the client and the server
    agree on the type. Figure 11-5 illustrates message security.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_287_0.png)


    **FIGURE 11-5:** Message security in WCF'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Security and Privacy with WCF | 26


    Message security is suitable in the following scenarios:


    +   - When intermediate systems may route messages to other systems.

    - When custom authentication mechanisms may be used.


    Message security has the following advantages:


    +   - It is transport independent.

    - Only parts of a message may be signed or encrypted as appropriate, thus improving
    performance.

    - It provides end-to-end security, allowing routing.


    However, message security has the following disadvantages:


    +   - The client and server must understand the WSSecurity standard. Some programming
    frameworks may not support WS-Security.

    - The encryption of individual messages may decrease performance.


    # Mixed Mode


    In addition to transport and message security, .NET also supports a mixed mode,
    or a combination of the two approaches. In mixed mode, the integrity and encryption
    are provided by the transport layer, and authentication is taken care of at the
    message layer.


    # Selecting the Security Mode


    To select a security mode, follow these general steps:


    +   1. Select the appropriate binding for your application requirements. By default,
    nearly all of the WCF bindings have security enabled. The only exception to this
    is nearly BasicHttpBinding. Table 11-1 lists the common Web service bindings and
    the security options they offer.

    2. Select one of the security modes for your service binding. The binding you
    select may limit the security mode you can select. For example, WSualHttpBinding
    does not allow transport mode security.

    3. If you choose transport security, then configure the host Web server with an
    SSL certificate.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# TABLE 11-1: Common WCF Bindings and the Security Modes They Support


    | BINDING | NONE | TRANSPORT | MESSAGE | MIXED MODE |

    | --- | --- | --- | --- | --- |

    | BasicHttpBinding | X | X | X | X |

    | WSHttpBinding | | X | X | X |

    | WSDualHttpBinding | X | | X | |

    | WSFederationHttpBinding | X | | X | X |

    | BasicHttpContextBinding | X | | X | X |

    | WSHttpContextBinding | | X | X | X |


    # Choosing the Client Credentials


    Once you choose the type of security mode you will use and the binding you will
    use, you can select the credentials you will accept for your Web service. The
    credentials available for use depend on the security mode you choose.


    Table 11-2 shows transport client credential types


    # TABLE 11-2: Transport Client Credential Types


    | CREDENTIALS | DESCRIPTION |

    | --- | --- |

    | None | Configures the service not to need any credentials. Clients will be anonymous.
    |

    | Basic | Configures the service for Basic HTTP authentication (see RFC2617).
    |

    | Digest | Configures the service for the Digest HTTP authentication (see RFC2617).
    |

    | Ntlm | Specifies NT LAN Manager authentication. This uses the Windows username
    and password is not available in situations where Kerberos is out (for example,
    client/server communication outside of a domain). |

    | Windows | Specifies Windows authentication, preferring Kerberos. |

    | Certificate | Performs client authentication using an X509 certificate. |'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Table 11-3 shows message client credential types.


    # TABLE 11-3: Message Client Credential Types


    | CREDENTIALS | DESCRIPTION |

    | --- | --- |

    | None | Configures the service to not need any credentials. Clients will be anonymous.
    |

    | Windows | Configures message exchange to use a Windows security context. |

    | User name | Requires a username and password that is validated using Windows
    authentication, the ASP.NET membership database, or a custom solution. Because
    WCF cannot perform any functions (such as signing), username credentials are only
    allowed when using a secure transport such as HTTPS. |

    | Certificate | Performs client authentication using an X509 certificate. |

    | Issued Token | Requires a security token issued by a secure token service. For
    more details, see Chapter 15 for a discussion of the Windows Identity Framework
    and Windows Dataspace, which support secure token services. |


    # ADDING SECURITY TO AN INTERNET SERVICE


    Before you add security to the demonstration service, you will need to host the
    application under IIS rather than Visual Studio''s test service (which does not
    support SSL). If you are running underneath Vista with UAC enabled, then Visual
    Studio must be run as an administrator to use IIS. So you will need to close Visual
    Studio, right-click on its icon, and choose "Run as administrator."


    In the Solution Explorer, rightclick the Web project WCFSecurity and choose Properties.
    Select the Web tab, select the option to Use Local IIS Web Server and you will
    see the project is now hosted under IIS URL. Open a browser and load http://localhost/WCFSecurity/EchoService.svc
    to see this.


    Now you must generate a certificate for IIS. Start the IIS Manager and click your
    machine name in the Connections list. In the Features View, you will see a Server
    Certificates icon in the IIS area. Double-click it and you will see a list of
    available service certificates. In the action list on the right-hand side of the
    screen, choose the Create Self-Signed Certificate option. Enter a friendly name.
    (This can be anything you like because it is used to describe the certificate.)
    Once you click OK, you will see your newly created certificate in the Server Certificates
    list, as shown in Figure 11-6.'
