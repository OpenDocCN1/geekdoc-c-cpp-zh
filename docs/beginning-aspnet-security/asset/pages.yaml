    Again, it is smaller and the format of the returned message is also JSON.


    With Communications Foundation (WCF), you can write Web services that use the
    WS* standards, allowing transport and message security. Ajax does not support
    these Web standards — it can only call HTTP or HTTPS Web services. If you are
    sending sensitive information to a Web service through Ajax, you should ensure
    that all communications happen over SSL.


    # Security Considerations with UpdatePanel and ScriptManager


    Examining the requests and responses from UpdatePanel obviously shows it outperforms
    an UpdatePanel — it sends only the data it needs to make the request and receives
    a smaller response. However, from a security viewpoint, the results are not so
    clear. In designing a secure application, you want to minimize the attack surface
    and the transparency of the application. You also want to reduce complexity —
    the more complex a solution, the more chances there are to make mistakes.


    Currently, using UpdatePanel is less complex. You simply add the necessary code
    to a Web service and ASP .NET controls. If you use ScriptManager, then you must
    write the Web service itself, register it, write the JavaScript to call the generated
    response and to it, parsing the response and acting on it.


    Examining the requests and responses for transparency, it is obvious that UpdatePanel
    is the winner. With the ScriptManager implementation, you had JavaScript embedded
    in the page to call the service and control the response; UpdatePanel has none
    of this — it generates JavaScript for you and takes care of updating controls.
    In embedding code within the page, you may be moving the logic of your application
    onto it and exposing it to an attacker. UpdatePanel keeps any logic on the server,
    and limits the client-side to that generated by the ASP.NET framework, which only
    sends the request and parses the response.


    Finally, you can examine the attack surface. When using ScriptManager , you are
    connecting to Web services. The address of these Web services is embedded in the
    JavaScript for the page. Try browsing the Web service directly and you will see
    something like the screen in shown Figure 12-3.'
