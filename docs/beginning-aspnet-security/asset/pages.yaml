    encryptedSessionKey.KeyInfo.AddClause(keyName);\n\n// And finally replace the\
    \ text with the cipher text.\nencryptedData.CipherData.CipherValue = encryptedElement;\n\
    EncryptedXml.ReplaceElement(elementToEncrypt, encryptedData,\nfalse);\n\nsessionKey.Clear();\n\
