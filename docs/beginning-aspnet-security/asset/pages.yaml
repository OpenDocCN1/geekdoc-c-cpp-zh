  md: "# CHAPTER 16 SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_417_0.png)\n\
    \n**FIGURE 16-2** The default MVC presentation of errors when model binding\n\n\
    If you want your model to provide more informative messages in much the same way\
    \ validation controls in Web Forms, then you can use the IDataErrorInfo interface\
    \ to provide it. This interface is part of the .NET framework itself, living in\
    \ System.Component model. It exposes two properties:\n\n+   - The Error property\
    \ gets a single error message indicating what is wrong with the object.\n\n+ \
    \  - The Item property takes a parameter and returns an error message indicating\
    \ what is wrong with that property.\n\nWith the Set accessor of your model, you\
    \ can build a dictionary of errors, indexed by their property name and log validation\
    \ problems as they happen. Listing 16-1 provides an example.\n\n# **LISTING 16**:\
    \ Implementing IDataErrorInfo\n\n```\npublic class BoardPost : IDataErrorInfo\n\
    {\n...\n    Dictionary<string, string> errorInformation = new Dictionary<string,string>();\n\
    \    public int Rating\n    {\n        get {\n            return this.rating;\n\
    \        }\n        set {\n            if (value < 0 || value > 10)\n{\n     \
    \           errorInformation.Add(\"Rating\", \"Ratings must be between 0 and 10\"\
    );\n            }\n        }\n    }\n}\n```"
