- pgno: 415
  md: "# CHAPTER 16 SECURE DEVELOPMENT WITH THE ASP.NET MVC FRAMEWORK\n\nwith an ID\
    \ property, an Author property, a Title property, and a Content property. The\
    \ Edit view would contain input fields for the title and content, but would not\
    \ allow the author to be changed. The Controller action may look something like\
    \ the following, retrieving the post, applying the changes, saving the changes,\
    \ and returning to a screen that will display the updated post:\n\n```\n[AcceptVerbs(HttpVerbs.Post)]\n\
    public ActionResult Edit(int id, FormCollection collection)\n{\n    BoardPost\
    \ boardPost = this.boardPostRepository.Get(id);\n    UpdateModel(boardPost);\n\
    \    this.boardPostRepository.Save();\n    return RedirectToAction(\"Details\"\
    , new { id = boardPost.Id });\n}\n```\n\nUpdateModel is a method provided by the\
    \ Base Controller class that uses a model binder to apply changes from the FormCollection\
    \ to the instance of the specified model. The default model binder takes the name\
    \ of the form field, and looks for a property with the same name in the model\
    \ class. If a match is found, it sets the property to the value of the form field.\n\
    \nThis is incredibly convenient, but also dangerous. Using a tool TamperData (https://addons.mozilla.org/en-US/firefox/addon/966)\
    \ for Firefox, an attacker can change a request before it is sent to your application,\
    \ as shown in Figure 16-1.\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_415_0.png)\n\
    \nFIGURE 16-1: The TamperData Firefox plug-in intercepting a request"
