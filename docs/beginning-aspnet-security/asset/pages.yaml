  md: "# CHAPTER 12 SECURING RICH INTERNET APPLICATIONS\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_327_0.png)\n\
    \nThis is a Windows Communication Foundation service.\n\nMetadata publishing for\
    \ this service is currently disabled.\n\nIf you have access to the service, you\
    \ can enable metadata publishing by completing the following steps to modify your\
    \ web or application config.file.\n\n1. Create the service behavior configuration:\n\
    \n```\n<ServiceBehaviors>\n  <behavior name=\"MyServiceTypeBehaviors\">\n    <ServiceMetadata\
    \ httpEnabled=\"true\" />\n  </behavior>\n</ServiceBehaviors>\n```\n\n2. Add the\
    \ behavior configuration to the service:\n\n```\n<service name=\"MyNamespace.MyService\"\
    \ behaviorConfiguration=\"MyServiceTypeBehaviors\">\n```\n\nNote: the service\
    \ name must match the configuration name for the service implementation.\n\n3.\
    \ Add the endpoint to your service:\n\n```\n<endpoint contract=\"IMetadataExchange\"\
    \ binding=\"wsHttp\" address=\"mex\" />\n```\n\nNote: your service must have an\
    \ http address to bind the endpoint.\n\nFIGURE 12-3: Browsing an Ajax-enabled\
    \ Web service\n\nBrowsing the service allows the attacker knocking, other than\
    \ that the service exists. This is because an Ajax Web service will not expose\
    \ metadata — or Service Definition Language (WSDL) — such as the supported operations,\
    \ the parameters they take, and the responses they give. The proxy scripts to\
    \ support Ajax calls are fairly exposed to an attacker. If you add js to the URL\
    \ for the service, you will receive a JavaScript source file. The snippet shows\
    \ the proxy functions\n\n```\nGetTime:function(invoke, succeededCallback, failedCallback,\
    \ userContext) {\n  return this.invoke(this.get_path(_),\n  'GetTime', false,succeededCallback,failedCallback,userContext);\n\
    AddTime:function(hours, succeededCallback, failedCallback, userContext) {\n  return\
    \ this.invoke(this.get_path(_),\n  'AddTime', false,(hours:hours),succeededCallback,failedCallback,userContext));\\\
    }\n```\n\nThese functions show all the operations on the Web service and their\
    \ parameters. Each function and parameter is another possible vector for attack,\
    \ and needs separate validation. UpdatePanel does not expose any additional routes\
    \ into your code.\n\nFrom a security standpoint, the UpdatePanel can be more secure,\
    \ as it reduces the attack surface — at the cost of request and responses. Only\
    \ you can decide if the need for scalability and speed is enough to expose your\
    \ application to more risk, and the need to write more validation code, when using\
    \ ScriptManager."
