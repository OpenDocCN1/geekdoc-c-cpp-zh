- pgno: 236
  md: "# Accessing Existing Safely | 209\n\n```\nusing System;\nusing System.IO;\n\
    \nublic partial class getfile : System.Web.UI.Page\n{\n    protected void Page_Load(object\
    \ sender, EventArgs args)\n    {\n        Response.Clear();\n        string filename\
    \ = Request.QueryString[\"filename\"];\n        FileInfo file = new FileInfo(Path.Combine(\n\
    \            Request.ApplicationPath, filename));\n        Response.AddHeader(\"\
    Content-Length\",\n            file.Length.ToString());\n        Response.WriteFile(file.FileName);\n\
    \        Response.End();\n    }\n}\n```\n\n5. Run this may. Choose a file name\
    \ from the drop-down list and click the Get button. You should see your example\
    \ file served by the browser.\n\nAfter performing the previous \"Try It Out\"\
    \ exercise, you may spot a potential problem — the filename is passed via the\
    \ query string.\n\n> NOTE The example code has introduced another example of the\
    \ Insecure Direct Object Reference vulnerability. If you haven't read Chapter\
    \ 4, you may wish to do so now. That discusses this vulnerability and its mitigations\
    \ in greater detail.\n\nBecause the sample code allows the user to specify the\
    \ filename, it can be easily hijacked to serve other files by changing the URI\
    \ for getfiles.aspx from a valid file to web.config. For example, say that your\
    \ address bar shows the following:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=example1.txt\n\
    ```\n\nThen let's say you change the URI to the following:\n\n```\nhttp://localhost:32715/Accessing%20files/getfile.aspx?filename=web.config\n\
    ```\n\nAs you can see, the file serving bypassed the built-in ASPNET protection\
    \ that stops configuration files from being sent to the browser, and served up\
    \ web.config as if it were another file. However, if this weren't enough, you\
    \ could go further. For example, depending on where you have created the application,\
    \ the application may access any files in your Windows directory:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=..\\\
    ..\\..\\..\\..\\..windows\\win.ini\n```\n\n![](img/742122f18de7bcb6f7bd43fe51fe45bd_236_0.png)"
  merge: -1
  img_proc: true
- pgno: 237
  md: "# 210 | CHAPTER 9 USING THE FILE SYSTEM\n\n> NOTE The formal name for this\
    \ type of attack is a \"Path Traversal Attack.\" Path traversal attacks can use\
    \ relative paths and the \"double-dot\" sequence, or less frequently, direct path\
    \ access, such as sending C:\\windows\\win.ini as a parameter to a page.\n\nYou\
    \ may look at this URI and decide that simply filtering and rejecting a filename\
    \ with \\ would be enough. The following URI would also work:\n\n```\nhttp://localhost:32715/Accessing%20Files/getfile.aspx?filename=../../../../../../windows/win.ini\n\
    ```\n\n# TRY IT OUT Stopping Path Traversal\n\nFollow this method for stopping\
    \ path traversals.\n\n+   1. In the code below, getfile.aspx.cs, change the code\
    \ to the following:\n\n```\nusing System;\nusing System.IO;\n\npublic partial\
    \ class getfile : System.Web.UI.Page\n{\n    protected void Page_Load(object sender,\
    \ EventArgs args)\n    {\n        Response.Clear();\n        string filename =\
    \ Request.QueryString[\"filename\"];\n        FileInfo file = new FileInfo(Server.MapPath(filename));\n\
    \        Response.AddHeader(\"Content-Length\", file.Length.ToString());\n   \
    \     Response.WriteFile(file.FullName);\n        Response.End();\n    }\n}\n\
    ```\n\n+   2. Now, the URIs that you attempt to navigate out of your application\
    \ directory. You will see that an HttpException is thrown with a message \"cannot\
    \ use a leading .. to exit above the top directory.\" Now you have some protection\
    \ against path traversals.\n\nServer.MapPath will not return any path outside\
    \ of your Web application. However, if your files are stored in subdirectories,\
    \ it is still possible for the serving to move out of directory (but still within\
    \ the Web root) should allow an attacker .. / as part of the filename.\n\nTo stop\
    \ all attacks, you must extract the filename from the input. The .NET framework\
    \ provides a class, Path, for mapping file paths. The Path class has a method\
    \ that will return just the filename, GetFileName. Even by limiting files to their\
    \ filename, the previous code would have another problem — it would serve web.config\
    \ if asked. So you must limit files to a particular directory."
  merge: -1
  img_proc: true
- pgno: 238
  md: "# 3.\n\nTo list a single directory, create a new directory in your web application\
    \ called documents and create in another two text files, example1.txt and example2.txt.\
    \ In the code behind file, getfile.aspx.cs, change the code to the following:\n\
    \n```\nusing System;\nusing System.IO;\n\npublic partial class getfile : System.Web.UI.Page\n\
    {\n    protected void Page_Load(object sender, EventArgs e)\n    {\n        Response.Clear();\n\
    \        string filename = Path.GetFileName(Request.QueryString[\"filename\"]);\n\
    \        FileInfo file = new FileInfo(filename);\n        Server.MapPath(\"documents\"\
    , filename));\n        Response.AddHeader(\"Content-Length\", file.Length.ToString());\n\
    \        Response.WriteFile(file.FileName);\n        Response.End();\n    }\n\
    }\n```\n\n# 4.\n\nNow, run your project and see if you can access web.config or\
    \ any other file outside of the documents directory.\n\n> WARNING Of course, exposing\
    \ a filename as a parameter in a query string or form parameter is considered\
    \ a direct object reference vulnerability (even when secured to a particular directory)\
    \ and is at least a form of information leakage. It is a best practice to use\
    \ an indirect object reference, such as a GUID, which is resolved in code to an\
    \ actual filename. If you are generating GUIDs in a short amount of time, there\
    \ is a risk that they may be sequential — something you could mitigate by pausing\
    \ for a small, random period of time between each GUID generation.\n an indirect\
    \ object reference also prevents the need to check the validity of the specified\
    \ files, and also alleviates the risk of serving web.config and other sensitive\
    \ files, because it stops from opening reserved file names, such as CON, PRN,\
    \ LPT1 and others, because, again, the mapping would not exist.\n\nOne thing missing\
    \ from the example is setting the correct Multipurpose Internet Mail Extensions\
    \ (MIME) type of the download. A browser uses the MIME type of a file to decide\
    \ how to handle the file. A MIME type of image/png would identify the file as\
    \ a PNG image. MIME types are set as part of the HTTP response headers, and the\
    \ browser use them to decide what to do with a file. Normally, the MIME types\
    \ are set on the server configuration. But if you are serving files manually,\
    \ you must ensure that you set the correct MIME type."
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 212 | CHAPTER 9 USING THE FILE SYSTEM


    A MIME type of application/vnd.openxmlformats-officicedocument.wordprocessingml
    document would identify the file as a Microsoft Word 2007 DOCX file.


    You can discover the MIME files registered on your system using the registry editor.
    Expand the HKEY_CLASSES_ROOT and select the file extension for which you want
    to discover the MIME type. In the list of entries, you will see a Content type,
    as shown in Figure 9-1. This is the MIME type for the file.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_239_0.png)


    **FIGURE 9-1:** The registry editor showing the Content Type of bitmap files


    To set a MIME type, you must add the correct response header by setting the ContentType
    property on the Response object. If the code in the previous "Try It Out" exercise
    were always limited to text files (which have a MIME type of text/plain), then
    you could set the MIME type by making the following change:


    ```

    Response.Clear();

    string filename =

    Path.GetFileName(Request.QueryString("filename"));

    FileInfo file = new FileInfo(

    Server.MapPath(

    Path.Combine("documents", filename))));

    Response.AddHeader("Content-Length",

    file.Length.ToString());

    Response.ContentType = "text/plain";

    Response.WriteFile(file.FullName);

    Response.End();

    ```'
  merge: -1
