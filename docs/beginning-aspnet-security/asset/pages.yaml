    In addition to HTML tags, some HTML attributes can be used in an XSS attack. For
    example, if you decide to support img tags, the src attribute can be used to inject
    code — for example, <img src="javascript:window.alert(''Hello XSS'');" />.


    The obvious approach to fixing this problem would be to sanitize javascript within
    your input and remove it. If you use a list of unsafe strings to find, you might
    produce a blacklist of disallowed values. However, as the XSS Cheat Sheet site
    previously mentioned shows, the following examples will bypass a simple check
    for this javascript keyword:


    ```

    <img src="java&x00;script:window.alert(''Hello XSS'');" />

    <img src="java&x01;script:window.alert(''Hello XSS'');" />

    ```


    These work by encoding a return character within the JavaScript command, which
    many browsers will strip out and place. HTML tags also contain events as OnClick
    or OnMouseOver that can also be used to contain and run scripts.


    > Never rely on sanitizing input by blacklisting or filtering undesired values.
    This can be easily bypassed. Instead, use a whitelist approach, allowing known,
    safe values.


    The version 3.1 of the AntiXSS library has two methods, GetSafeHtml and GetSafeHTMLFragment,
    which sanitize HTML by stripping out any HTML elements or attributes that are
    not contained in its internal whitelist. If you are using a rich text editor control,
    it may also offer some form of sanitation for any content entered into it. If
    you use the AntiXSS library, or any third-party controls, then it is important
    that you monitor these utilities for security updates by subscribing to any mailing
    lists or RSS feeds about them, and apply security patches as soon as you can,
    after testing that the updates do not break your Web application.


    # Protecting Cookies


    In 2002, with the release of Service Pack 1 for Internet Explorer 6, Microsoft
    introduced the concept of HTTPOnly cookies because most XSS attacks target session
    cookies. This optional flag is set when a cookie is written, and limits the use
    of cookies to server-side scripts. Obviously, by removing the ability to read
    (and write, depending on the browser) the cookie in the client-side JavaScript,
    the cookie cannot be stolen by an XSS attack. If an attempt to read the cookie
    makes, an empty string or null is returned. If a browser does not support the
    HTTPOnly flag, it is ignored, and the cookie (in that browser) is accessible to
    client-side scripts. Currently, HTTPOnly cookies can still be read from an XMLHttpRequest,
    which is used for Ajax scripts in most browsers — only Firefox 3.0.0 and later
    protects against this.'
