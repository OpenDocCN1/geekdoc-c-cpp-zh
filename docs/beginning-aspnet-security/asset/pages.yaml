    > WARNING Remember that MD5, SHA1, and RIPEMD are considered broken algorithms
    and you should not use them in new code. The American National Security Agency
    has a list of recommended algorithms at http://www.nsa.gov/ia/cryptography/index.html.
    You can find the seminal academic paper, "How to Break MD5 and Other Hashes,"
    by Xiaoyun Wang and Hongbo Yu at http://www.infosec.edu.cn/upload/papers/How%20to%20Break%20MD5%20and%20other%20Hash%20Functions.pdf.
    It is mathematically heavy, but Table 2 gives examples of different byte arrays
    that produce the md5 hash.


    # Protecting Passwords with Hashing


    If you recall the characteristics of a secure hash algorithm, you will remember
    that it is one-way—the data that produced the hash cannot be reconstructed from
    the hash. This functionality makes a hash perfect for storing passwords securely.
    If you store the hash (rather than the clear text) of a password, then in your
    validation procedure, you can take the value the user provides, hash it again,
    and check it against your password store. Because hashing the'
