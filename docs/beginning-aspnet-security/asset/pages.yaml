- pgno: 381
  md: '# Configuring a Site to Use HTTPS


    To configure a site using HTTPS, you edit the site bindings. Start the IIS Administration
    Manager and highlight the site for which you wish to configure SSL. Then select
    Bindings from the Actions menu. If the site has never been configured for SSL,
    click Add, which will bring up the Add Site Binding dialog shown in Figure 14-5.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_381_0.png)


    FIGURE 14-5: Adding a site binding


    In the binding dialog, change the type to “https” from the drop-down list. When
    you click OK, the certificate will be activated on your site, and you can browse
    to it using the HTTPS protocol. If you must change a certificate (for example,
    renewing one that has expired), then you can edit the bindings and select the
    new certificate.


    One final thing is to ensure that the SSL2 algorithm is disabled because it is
    insecure. IIS allows you to choose the algorithms used for SSL using the Key_Local_Machine\System\CurrentControlSet\SecurityProviders\SCHANNEL\Protocols
    Registry key. Windows 2008 disables SSL by default, which you can check by looking
    for an SSL 2.0 client subdirectory that contains a DisabledByDefault entry with
    a DWORD value of 0. You can also check if SSL 2.0 is disabled by using the Advanced
    settings in Internet Explorer, and only enabling SSL 2.0 in the Security settings
    for the browser. You should try to load your web site over SSL.


    # Setting up a Test Certification Authority


    Certificates are expensive, but during development and testing, you will often
    want to mirror your production environment as much as possible, including certificate
    capability of IIS, or the makecert utility that comes with the Windows SDK. It
    is often recommended to use the self-signing certificates. These have some disadvantages.


    A selfsigned certificate has no root CA, while a makecert -generated certificates
    can generate its own root CA. However, in this case, the certificates do not have
    a Certificate Revocation List (CRL), a facility that CAs provide that lists certificates
    that may have been compromised and should not be trusted. WCF looks for a trusted
    CA and a CRL when it checks certificates, unless you configure not to — which
    is risky because you must always remember to check the back in production.


    A better option is to use the CA that comes with Windows Server and create your
    own test CA, complete with a CRL. However, in order for CRL checking, the CRL
    must always be available. You may need to set up the CA on a machine or virtual
    machine that is always connected to your development network.


    To set up a CA in Windows 2008, you must add the Active Directory Certificate
    Services role — which doesn’t actually require Active Directory at all, but rather
    simply extras if you are in an AD environment. Follow these steps:'
