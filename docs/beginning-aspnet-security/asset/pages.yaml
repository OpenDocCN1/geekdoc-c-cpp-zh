    ```


    You can see that you have added the serviceCredentials section and specified a
    customUsernameValidatorType using the fully qualified name and the assembly it
    is contained in.


    +   4. Now run your test and see what happens if you have an identical username
    and password, or when there is a mismatch.


    You have now learned about the authentication options for an Internet-facing service,
    but what about intranet scenarios? For an intranet, users will typically be in
    an Active Directory, and it makes sense to use the credentials for the web service,
    in the same way that integrated authentication works in IIS.


    # TRY OUT Adding Authentication to an Intranet Service


    Changing the authentication type to use the current user''s Windows credentials
    involves two changes: one on the server and on the client.


    +   1. On the server, you must change the binding in the web.config file and switch
    the message client-credentialType to Windows like:


    ```

    <wsHttpBinding>

    <binding name="wsHttp" hostComparisonMode="Exact">

    <security mode="TransportWithMessageCredential">

    <transport clientCredentialType="None" />

    <message clientCredentialType="Windows" />

    </security>

    </binding>

    </wsHttpBinding>

    ```


    +   2. On the client side, you must make an identical change in its app.config
    file. Once you have this, you can remove the code in the client application that
    sets credentials, because your Windows credentials will be used. Run the test
    application and you will see that, even without specifying credentials in code,
    you will be authenticated to the WCF service.


    Of course, authentication is only half of the story. You may need to implement
    authorization well. Once the service has authenticated a user, you can determine
    if a user is allowed perform the operations that have been requested. For example,
    you may write a Web service that allows the posting of comments on a Web site.
    The same service might also expose an operation to delete comments, which would
    be limited to administrative users.


    WCF can make use of roles to authorize users, as long as it has a role provider
    configured. Active Directory provides roles using the Windows groups that a username
    belongs to. The ASP.NET membership provider has its own role provider.'
  merge: -1
  img_proc: true
- pgno: 300
  md: "# TRY OUT Using Roles to Authorize Service Operations\n\nIn order to configure\
    \ WCF to use roles, you must configure the service. To use Windows groups, you\
    \ must obviously be authenticating as a Windows user (for example, in the intranet\
    \ configuration shown earlier, or via a username and password configuration that\
    \ uses the Windows user store).\n\n+   1. With the sample you have previously\
    \ developed (which uses Windows authentication), edit the service behavior in\
    \ the web.config to add a new serviceAuthorizationElement as follows:\n\n```\n\
    serviceBehaviors:\n<behavior name=\"WCF.EchoServiceBehavior\">\n  <metadata httpEnabled=\"\
    false\" httpsGetEnabled=\"true\" />\n  <serviceDebug includeExceptionInFaults=\"\
    false\" />\n  <serviceAuthorization principalPermissionMode=\"UseWindowsGroups\"\
    \ />\n</behavior>\n```\n\n+   2. Now you must specify the roles that are allowed\
    \ to call the Echo operation. This is done by adding a PrincipalPermission to\
    \ the implementation class. Open EchoService.svc.cs and change it to add the permission\
    \ attribute like so:\n\n```\nusing System;\nusing System.ServiceModel;\nusing\
    \ System.Security.Permissions;\nusing System.Security.Principal\n```\n\nnamespace\
    \ WCFSecurity\n\n```\n{\n  public class EchoService : IEchoService\n{\n    [PrincipalPermission(SecurityAction.Demand,\
    \ Role=\"Administrators\")]\n    public string Echo(string message)\n    {\n \
    \     return (\"You sent \" + message + \n              \" as \" + SecurityContext.Current.PrimaryIdentity.Name);\\\
    n    }\n  }\n}\n```\n\n+   ► PrincipalPermission is added to each method you use\
    \ to authorize the PrincipalPermissionAttribute:\n\n```\nPrincipalPermission(SecurityAction.Demand,\n\
    Role=\"Administrators *\")\n```\n\n+   ► You can go further limiting and not by\
    \ role, but by username:\n\n```\nPrincipalPermission(SecurityAction.Demand,\n\
    Name=\"WROG\\exampleUser\")\n```\n\n+   ► You can combine both types of permissions\
    \ and apply multiple permissions to a single method. This sample allows the Echo\
    \ operation to any user who is part of the Administrators group."
  merge: -1
  img_proc: true
- pgno: 301
  md: "# 3. Run the client and see what happens. Assuming you are a member of the\
    \ Administrators group on your machine, you will see that the operation performs\
    \ as expected. If you change the group name in the PrincipalPermission to a group\
    \ you are not a member of, or one that does not exist, you will discover that\
    \ a SecurityAccessDeniedException is thrown when you attempt to perform the operation.\n\
    \n# 4. If you programmatically check group membership inside a method, you can\
    \ use the following code:\n\n```\nWindowsIdentity user =\nServiceSecurityContext.Current.PrimaryIdentity\
    \ as WindowsIdentity;\nif (user.IsInRole(\"Administrators\"))\n{\n    throw new\
    \ SecurityAccessDeniedException();\n}\n```\n\nThe same approach applies using\
    \ the ASP.NET Membership Roles database, although you must configure the serviceAuthorization\
    \ as follows:\n\n```\n<serviceAuthorization\nprincipalPermissionMode=\"UseAspnetRoles\"\
    \nroleProviderName=\"AspNetSqlProvider\" />\n```\n\nThe code to manually check\
    \ group membership is slightly different:\n\n```\nIIdentity user =\nServiceSecurityContext.Current.PrimaryIdentity\
    \ as IIdentity;\nif (!System.Web.Security.IsUserRole(user\n```\n\nUsing a PrincipalPermission\
    \ will work in both scenarios, so it is obviously preferred.\n\n# SIGNING MESSAGES\
    \ WITH WCF\n\nWCF gives you the capability to sign any or parts of a message using\
    \ a client certificate — you have already discovered how to sign XML in Chapter\
    \ 10.\n\nTo sign messages with WCF you need two certificates. First you require\
    \ a server certificate. The client uses the public key from the server to encrypt\
    \ the message or parts of a message and the encrypted data is decrypted using\
    \ the private key on server. The second certificate needed is the client certificate.\
    \ This is used to sign the data. The client certificate allows the server to discover\
    \ who signed the message, non-repudiation. Non-repudiation means that neither\
    \ party can dispute who the message came from — signing a message can only be\
    \ done by using the private key contained in the X509 certificate, which is kept\
    \ secret by the sender of the message."
  merge: -1
  img_proc: true
- pgno: 302
  md: "# Signing Messages with WCF\n\nTo provide more granularity WCF message level\
    \ protection can be configured at the interface level or data contract by setting\
    \ the ProtectionLevel to the appropriate parts.\n\nIn the original example at\
    \ the start of this chapter, you defined the service contract as follows:\n\n\
    ```\n[ServiceContract]\npublic interface IEchoService\n{\n  [OperationContract]\n\
    \  string Echo(string message);\n}\n```\n\nTo sign all messages for a service,\
    \ you add the ProtectionLevel setting to the service contract like (so the default\
    \ is EncryptAndSign):\n\n```\n[ServiceContract(ProtectionLevel = ProtectionLevel.Sign)\
    \ ]\npublic interface IEchoService\n{\n  [OperationContract]\n  string Echo(string\
    \ message);\n}\n```\n\nIf you wanted to sign all the parts of a message, you apply\
    \ the ProtectionLevel property to the OperationContract attribute, as shown here:\n\
    \n```\n[ServiceContract(ProtectionLevel = ProtectionLevel.Sign)]\npublic interface\
    \ IEchoService\n{\n  [OperationContract(ProtectionLevel = ProtectionLevel.Sign)]\n\
    \  string Echo(string message);\n}\n```\n\nIf you are using message contracts,\
    \ you can be more granular, signing or signing encrypting, various parts of the\
    \ message contract, as shown here:\n\n```\n[MessageContract(ProtectionLevel =\
    \ ProtectionLevel.EncryptAndSign)]\npublic class Order\n{\n  [MessageHeader(ProtectionLevel\
    \ = ProtectionLevel.Sign)]\n  public string From;\n  [MessageBodyMember(ProtectionLevel\
    \ = ProtectionLevel.EncryptAndSign)]\n  public string PaymentDetails;\n}\n```\n\
    \nOnce you have your contracts decorated with ProtectionLevel attributes, you\
    \ must select the correct binding, message-level transport with client authentication.\
    \ You can do this via the WCF Service Configuration Editor, or by manually setting\
    \ the clientCredentialType in the binding portion of the configuration file. You\
    \ must also select a certificate to the server to use, independent of the HTTPS\
    \ configuration that IIS uses.\n\nThe certificate's private key must be available\
    \ to the account under which the service will run. You can do this by starting\
    \ MMC, adding the certificate snap-in for the Local Computer."
  merge: -1
  img_proc: true
- pgno: 303
  md: "Right-click on the certificate, choose All All Tasks Manage Private Key, and\
    \ grant the Read permission to the appropriate user. You can then specify the\
    \ certificate in the binding configuration.\n\nBy default, WCF will attempt to\
    \ map a client to a Windows account, but for public-facing Web sites this may\
    \ not be what you want. You can control this by setting the mapClientCertificate\
    \ property of the clientCertificate behavior to false.\n\nThe following configuration\
    \ file shows a suitable configuration for message security with client certificates,\
    \ with Windows account mapping disabled. The server certificate is found by its\
    \ name (in this case, wrox-vpc).\n\n```\n<system.serviceModel>\n<bindings>\n \
    \ <wsHttpBinding>\n    <binding name=\"http\" hostNameComparisonMode=\"Exact\"\
    >\n      <security mode=\"Message\">\n        <transport clientCredentialType=\"\
    None\">\n          <extendedEndpointProtectionPolicy policyEnforcement=\"Never\"\
    \ />\n        </transport>\n        <message clientCredentialType=\"Certificate\"\
    \ />\n      </security>\n    </binding>\n  </wsHttpBinding>\n</bindings>\n<behaviors>\n\
    \ <serviceBehaviors name=\"WCFSecurity.EchoServiceBehavior\">\n  <serviceMetadata\
    \ httpGetEnabled=\"false\" httpsGetEnabled=\"true\" />\n  <serviceDebug includeExceptionDetailInFaults=\"\
    false\" />\n  <serviceCredentials>\n  <clientCertificate>\n  <authentication certificateValidationMode=\"\
    PeerOrChainTrust\" />\n  trustedStoreLocation=\"LocalMachine\"\n  revocationMode=\"\
    Online\" />\n  mapClientCertificateToWindowsAccount=\"false\" />\n </clientCertificate>\n\
    \  <serviceCertificate x509FileType=\"FindBySubjectName\" findValue=\"wrox-vpc\"\
    \ />\n </serviceCredentials>\n </behavior>\n</serviceBehaviors>\n</services>\n\
    <service behaviorConfiguration=\"WCFSecurity.EchoServiceBehavior\" name=\"WCFSecurity.EchoService\"\
    >\n <endpoint>\n address=\"*\" binding=\"wsHttpBinding\"\n bindingConfiguration=\"\
    wsHttp\"\n contract=\"WCFSecurity.IEchoService\"\n <identity>\n <dns name=\"wrox-vpc\"\
    \ />\n </identity>\n </endpoint>\n</service>\n</system.serviceModel>\n```"
