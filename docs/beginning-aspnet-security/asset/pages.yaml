    \ you would call log.Warn() method, and so on.\nTheThreshold value in the configuration\
    \ file is used to control which message types are actually emitted to the log\
    \ destinations:\n\n+   - A threshold level of All or Debug would record every\
    \ message type.\n- A threshold level of Info would log messages of an Info, Warn,\
    \ Error, and Fatal.\n- A threshold level of Warn would only log Warn, Error, and\
    \ Fatal messages.\n\nBy using a suitable threshold level, you can fine-tune the\
    \ log output without having to remove any commands from your code.\nThe configuration\
    \ file also allows for multiple logging types and destinations. For example, a\
