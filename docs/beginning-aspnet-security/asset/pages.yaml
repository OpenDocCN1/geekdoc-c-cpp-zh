    n    ICryptoTransform transform = rijndael.CreateDecryptor(key, iv);\n\n    //\
    \ Create the streams for input and output\\n    MemoryStream outputStream = new\
    \ MemoryStream();\n    CryptoStream inputStream = new CryptoStream(\\n       \
    \ outputStream,\n        transform,\n        CryptoStreamMode.Write);\n\n    //\
    \ Feed our data into the crypto stream.\\n    inputStream.Write(cipherText, 0,\
