- pgno: 144
  md: '# # Keeping Secrets Secret-

    Hashing and Encryption


    Most Web applications will store data that may be considered sensitive — credit
    card information, Social Security Numbers, and, of course, passwords. In Chapter
    5, you saw how you can encrypt ViewState and portions of your configuration files
    to prevent information leakage, how do you encrypt other data you wish to protect?


    In this chapter, you will learn about the following


    +   - The four basic areas of cryptography: hashing, generating random numbers,
    symmetric encryption, and asymmetric encryption

    - Where it is appropriate to use hashing and how to use it

    - The difference between symmetric and asymmetric encryption

    - How to encrypt and decrypt

    - What the Windows Data Protection API provides, and how to use it


    As you read through this chapter, you will find a list of references to “clear
    text.” “Clear text simply refers to the unencrypted data you wish to secure. It
    may not be text at all. Generally, encryption algorithms work on binary data.
    However, clear text is a phrase derived from “plain text”, which refers to information
    in the language of the communicating parties, a concept used long before computers
    were available. So cryptography has stuck with using the word “text” when actually
    it can refer to binary data as well. When reading cryptography, “plain text” and
    “clear text” are often synonymous.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The Open Security Application Project (OWSAP) secures insecure cryptographic
    storage as one of its top ten vulnerabilities. This is not a specific vulnerability,
    but an encompassment of flaws, such as choosing an insecure cryptography algorithm,
    using your own (invented) algorithm, or not protecting sensitive data in any manner.


    Cryptography is not just about encrypting data. It provides the following functions:


    +   * Authentication—The common example of cryptographic authentication is the
    X509 certificate used during a Secure Sockets Layer (SSL) conversation with a
    Web server. This certificate provides information about the server in a secure
    manner, and allows a user to decide if the Web site is legitimate or not. Certificates
    can also be used on a server to establish the identity of a remote user (or a
    remote system). For example, the pass card Microsoft employees use to access to
    their building also incorporates a chip that contains an X509 certificate. This
    smartcard is used to authenticate an employee when he or she remotely accesses
    internal systems from home.


    +   * Nonrepudiation—a method of proving a made request, and not allowing a user
    to deny his her actions. For example, a message may be sent from one system to
    another for the transfer of money, but, the originating system may have never
    sent the request. Nonrepudiation through cryptography (typically, through the
    use of digital signatures that have signed the request) proves that the request
    was sent from the originating system.


    +   * Confidentiality—the original goal of cryptography. From the Caesar Cipher
    (in which Julius Caesar used to keep messages safe from spying) to the Enigma
    machines (used during World War II to protect military communications in Germany
    through a series of substitution ciphers) to the numerous and complex algorithms
    used in SSL and Transport Layer Security (TLS) on the Internet, encryption ensures
    that only users with appropriate access can decrypt and read data.


    +   * Integrity—Cryptography (through hashing algorithms) can ensure that data
    is not changed during transmission or storage.


    Cryptography is an advanced topic, which has many books on it. This chapter simply
    shows you some practical uses of cryptography. If you want to understand the underlying
    concepts and extend your knowledge beyond a simple application of the techniques,
    the book Practical Cryptography (Indianapolis: Wiley, 2003) by Niels Ferguson
    and Bruce Schnier is highly recommended.


    # PROTECTING INTEGRITY WITH HASH


    Hashing a cryptographic function that is used to provide a secure fingerprint
    of data. A common usage you have encountered is to check a file you have downloaded
    — some sites provide a Message Digest algorithm 5 (MD5) or Secure Hash Algorithm
    (SHA) checksum for a file. By running an appropriate program (for example, HashTab
    available from http://beeblebox.org/) against the file you downloaded, you can
    then be confident that your file was not changed since the checksum was generated,
    and that it was not corrupted during the download process. If course,'
  merge: -1
  img_proc: true
- pgno: 146
  md: "Web site has been compromised, and both the files for download and the published\
    \ checksums have been replaced, then checksums provide no protection at\n\nA hashing\
    \ algorithm has four characteristics:\n\n+   - The output is of a known, fixed\
    \ length — The length varies according to the algorithm. However, it is unaffected\
    \ by the size of the input data.\n- It is deterministic — The hash output is always\
    \ the same for a given input.\n- It is away — Data cannot be reconstructed from\
    \ its hashed value.\n- (Almost) Every hash is unique — When a hashing algorithm\
    \ produces the same hash for two different sets of data, this is called a collision.\
    \ Every hash function has a risk of collisions, a good hashing algorithm should\
    \ minimize the risk by producing extremely different output, even if the input\
    \ has changed by a single bit.\n\n# Choosing a Hashing Algorithm\n\nThe .NET framework\
    \ provides several algorithms in the System.Security.Cryptography namespace, with\
    \ all hashing classes derived from the HashAlgorithm class. You will notice that\
    \ some algorithms appear to be implemented twice, for example SHA1Provider and\
    \ SHAManaged. Classes that end in CryptoProvider are wrappers around the native\
    \ Crypto API, which classes ending in Managed are implemented in managed code.\
    \ The wrapper implementations are considerably faster than the managed code. However,\
    \ their use will introduce a performance penalty. If you want to be portable to\
    \ Mono or other Common Language Runtime time (CLR) implementations, you should\
    \ only use managed classes.\n\nThe most common algorithms in use are MD5 and SHA1.\
    \ Both of these (as well as RACE Integrity Primitives Message Digest, or RIPEMED)\
    \ have been shown to have weaknesses, and should be avoided whenever possible.\
    \ The current recommended algorithms are SHA256 and SHA512.\n\n# TRY OUT Hashing\
    \ Data\n\nWith .NET, creating an instance of the hash is very easy. You simply\
    \ create an instance of the class for your desired algorithm and call ComputeHash().\
    \ The method takes a single parameter, the data for which you want the hash to\
    \ be calculated. Both the input and the result are byte arrays. If you are working\
    \ with strings, the System.Text namespace provides the Encoding classes to use\
    \ for the conversion. You should choose the correct encoding for your input and\
    \ call GetBytes(). For example, if your string was in UTF8, you would use Encoding.UTF8.GetBytes(data\
    \ ).\n\n+   1. The following code snippet uses the SHA256 algorithm to calculate\
    \ a hash for the provided string. Try it out on some of your data.\n\n```\nprivate\
    \ string CalculateSHA256Hash(string input)\n{\n    // Encode the input string\
    \ into a byte array.\n    byte[] inputBytes = Encoding.UTF8.GetBytes(input);\n\
    \n     Create an instance of the SHA256 algorithm class\n    SHA256Managed sha256\
    \ = new SHA256Managed();\n```"
