- pgno: 198
  md: "# Impersonation with Windows Authentication\n\nUsing Windows authentication\
    \ offers the advantage of impersonation. By default, IIS is configured to run\
    \ your applications as a build in the Windows account, Network Service. This account\
    \ is limiteded in the access it has to resources on the server, and cannot access\
    \ resources on other computers at all.\n\nYou can change the account by configuring\
    \ the application pool, but what if you want to run under the identity of an authenticated\
    \ user (for example, to authenticate as that user against a SQL server or a network\
    \ resource)? Listing 7-9 shows how you do the three types of identity a-pity you\
    \ can have.\n\n+   LISTING 7-9: Discovering the underly IIS Windows account\n\n\
    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_198_0.png)\n\nIf you run this code using\
    \ the Visual Studio tool, you will see your own login details for every identity\
    \ (assuming you have Windows authentication enabled in the web.config file). But\
    \ if you place the code on an IIS server, configured for anonymous access, you\
    \ will see a different behavior - the page and thread identity are blank, and\
    \ the Windows identity is NT AUTHORITY\\NETWORK SERVICE.\n\nIf you configure your\
    \ new IIS to use integrated authentication and reload the page, you will see that\
    \ the Page and Thread identity are now the account you authenticated with, but\
    \ the Windows identity still remains as the Network Service Account. This is the\
    \ account used to authenticate against other network resources — why hasn't it\
    \ changed?\n\nFor security reasons NTLM credentials cannot hop between servers,\
    \ or if you try to, for example, login to a SQL server using Trusted Connections\
    \ you will find that the account used will be the application pool identity. So\
    \ what can you do? If you want to pass the user's identity to another system then\
    \ you need to wrap the call in the following code\n\n```\nusing (((HttpContext.Current.User.Identity).Impersonate())\n\
    {\n    // Perform database or network access here\n}\n```"
  merge: -1
  img_proc: true
- pgno: 199
  md: "# AUTHORIZATION IN ASP.NET\n\nNow that you have authenticated users, you can\
    \ continue to the next step: authorizing access to resources. In Listing 7-2 earlier\
    \ in this chapter, you already made use of the authorization element in the web.config\
    \ file:\n\n```\n<authorization>\n  <deny users=\"*\"/>\n</authorization>\n```\n\
    \nIt is this element that controls access to your resources — but how do you use\
    \ it? Create a new Web application and replace the web.config file with Listing\
    \ 7-10.\n\n+   LISTING-7-10: Denying access to all users with web.config\n```xml\n\
    <?xml version=\"1.0\"?>\n<configuration>\n  <system.web>\n    <authentication\
    \ mode=\"Windows\" />\n    <authorization>\n      <deny users=\"*\"/>\n    </authorization>\n\
    \  </system.web>\n</configuration>\n```\n\nIn this example, the web.config file\
    \ has configured authentication to use Windows-based authentication, and also\
    \ has an authorization configuration. The <authorization> element is used to define\
    \ what users can access in the current directory or any of its subsidiaries. The\
    \ <deny> element in the example specifies that all users, regardless of their\
    \ authentication state, are denied access. If you try to browse to a page in your\
    \ new Web site, you will receive an \"Access is denied\" error.\n\nIn most instances,\
    \ you will want to allow some users access to your resources. To do this, you\
    \ use the <allow> element. Let's start off by allowing a single user.\n\nListing\
    \ 7-11 shows how the <allow> element takes precedence over <deny> elements. If\
    \ you replace the <deny> element with your own username, you will see that you\
    \ can now browse to pages on your new Web site. However, allowing users by name\
    \ is not the most scalable control method — which is where the concept of roles\
    \ comes in. First, however, you should examine the <allow> and <deny> settings.\n\
    \n+   LISTING-7-11: Allowing a single user access with web.config\n```xml\n<?xml\
    \ version=\"1.0\"?>\n<configuration>\n  <system.web>\n    <authentication mode=\"\
    Windows\" />\n    <authorization>"
  merge: -1
  img_proc: true
- pgno: 200
  md: '```

    <allow users="*WROX\barryd*">

    <deny users="*"/>

    </authorization>

    </system.web>

    <configuration>

    ```


    # Examining&lt;allow&gt; and &lt;deny&gt;


    The &lt;allow&gt; and &lt;deny&gt; attributes allow you to control how you can
    access your resources. Each element supports the following attributes:


    +   * users --Enables you to specify a list of users by their domain and/or name.

    * roles --Enables you to specify groups of users that allowed or denied access.

    * verbs --Enables you to allow or limit access based on the HTTP verb of the request.


    When using any of these attributes, you can use the asterisk (*) as a wildcard.
    For example, the following configuration line will allow access to any user in
    *roles*:


    ```

    allow roles="*"

    ```


    You can also use the question mark (?) with the *users* attribute to specify unauthenticated
    users. For example, the following line will deny access to any unauthenticated
    user:


    ```

    deny users="?"

    ```


    When adding users, roles, or verbs, you can specify multiple values in two ways.
    You can specify these in separate elements, as shown here:


    ```

    allow users="thesheet"

    allow users="plip"

    ```


    Or, you can provide them as a comma-separated value, as shown here:


    ```

    allow users="thesheet, plip"

    ```


    By default, the global.web.config file has a rule that allows all access to all
    resources. When locking resources, you should override this default rule by a
    &lt;deny&gt; setting - either all users &lt;deny&gt; users="*"/ or all unauthenticated
    users &lt;deny&gt; users="?"/ - and then added users, groups, or verbs. This is
    an example of whitelist values, rather than working from a blacklist.


    The verbs configuration is used for read-only resource directories, as a directory
    containing static HTML, images, or other resources that do not contain HTML forms.
    By blocking all except the GET verb, you are protecting your application against
    undiscovered bugs that might occur should one of those resources caused unintended
    consequences (if, for example, an attacker used it as the target for a form submission).
    If you do not start the block rule, then it would be possible to bypass your rules
    by web tampering, a technique detailed by Arshanshahi in his whitepaper *Bypassing
    Web Authentication and Authorization with HTTP Verb Tampering*, which you can
    find at http://aspectsecurity.com/documents/Bypassing_VBAAC_with_HTTP_Tampering.pdf.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "# RoleBased Authorization\n\nAs you may realize, configuring access by listing\
    \ every single user your Web site may have is not a scalable solution, nor is\
    \ it best practice. Instead, you should use role-based authentication. Roles are\
    \ containers for any number of users. For example, a forum application may have\
    \ a role of Moderators who are allowed to hide or close threads. You can use roles\
    \ to allow or deny access to a directory of resources using the roles attribute,\
    \ and you can programmatically check role membership during the execution of your\
    \ code.\n\n# Configuring Roles with Forms-Based Authentication\n\nTo enable roles\
    \ for authentication, you simply set the enabled attribute for the roleManager\
    \ element in web.config to be True, as shown in Listing 7-12. It is disabled by\
    \ default to avoid breaking changes for users migrating from ASP.NET 1.0.\n\n\
    > LISTING-7-12: Enabling roles for forms authentication\n\n```\n<?xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <roleManager enabled=\"True\" />\n\
    \    <authentication mode=\"Forms\" />\n    <authorization>\n      <deny users=\"\
    /\"/>\n    </authorization>\n  </system.web>\n</configuration>\"\n```\n\nroleManager\
    \ provider acts like the membership provider — you can let ASP.NET create the\
    \ database for you, or use the aspnet_reg utility to configure an existing database.\
    \ If you are using an existing database, you must add a providers element to the\
    \ roleManager section in your web.config file to use your connection string, and\
    \ then specify your new provider name, as shown in Listing 7-13. The roleManager&gt>\
    \ element also allows configuration of various settings, as shown in Table 7-5.\n\
    \n> LISTING-7-13: Configuring the role manager for a custom connection string\n\
    \n```\n<system.web>\n<roleManager>\n  enabled = \"true\"\n  createPersistentCookie\
    \ = \"false\"\n  cacheRolesInCookie = \"false\"\n  cookieName = \".ASPROLES\"\n\
    \  cookieTimeout = \"30\"\n  cookiePath = \"/\"\n  cookieRequireSSL = \"false\"\
    \n  cookieSlidingExpiration = \"true\"\n  cookieProtection = \"All\"\n</roleManager>\n\
    </system.web>\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "```\ndefaultProvider = \"MyCustomRoleProvider\"\ndomain = \"\"\n<providers>\n\
    \  <add name=\"MyCustomRoleProvider\"\n    connectionString=\"MyConnectionString\"\
    \n    applicationName=\"/\"\n    type=\"System.Web.Security.SqlRoleProvider,System.Web,\n\
    Version=2.0.0.0, Culture=neutral,\nPublicKeyToken=b03f5f7f11d50a33a\" />\n</providers>\n\
    </roleManager>\n</system.web>\n```\n\n# TABLE 75: The <roleManager> Element Attributes\n\
    \n| ATTRIBUTE | DESCRIPTION |\n|---|---|\n| enabled | Iftrue, the role used by\
    \ the role manager. |\n| cookieName | This is the name of the cookie used by the\
    \ role manager. By default, this is .ASPXRoles. This can be used to separate multiple\
    \ applications within the Web site, with the path setting. |\n| createPersistentCookie\
    \ | Specifies if the role manager should be persistent. This is not advisable\
    \ for security reasons. |\n| cacheRolesInCookie | Defines the roles for a user\
    \ can be in the role manager cookie. This is more scalable. However, it is more\
    \ insecure. ASP.NET does not have to retrieve roles with every request. The role\
    \ cookie protected against changes, then attackers could edit their cookie to\
    \ put themselves into a role. If the cookie is not encrypted, attackers could\
    \ view the roles they are. |\n| path | Specifies the path for the role manager.\
    \ The default value is / , and it is unlikely you will want to change this. If\
    \ you have multiple Web applications running on a single site (for example http://example.com/app1/\
    \ and http://example.com/app2/) and you want to have a user login separately for\
    \ each application, then you can set the path to match the directory containing\
    \ your application. |\n| cookieTimeout | Specifies the amount of time (in minutes)\
    \ a role manager cookie lasts for. The default value is 30 minutes. |\n| domain\
    \ | Specifies the domain name for the role manager cookie. |\n| cookieSlidingExpiration\
    \ | If settrue, the role manager expiry will be reset with every request. |\n\
    | requireSSL | Specifies if the role manager cookie can only be transmitted over\
    \ SSL connections |"
