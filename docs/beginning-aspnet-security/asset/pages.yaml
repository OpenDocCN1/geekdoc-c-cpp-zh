    # Using Session Keys


    Someanalytic attacks are easier with more data encrypted with a specific key.
    In other words, the more you use a key, the easier it becomes to break it. The
    mitigation against this is to use a session key. A session key is used to encrypt
    a single set of data—for example, a single record in the database, or all messages
    within a single communication session. Using session keys introduces complexity
    into your application. You suddenly have a large number of keys to keep secure.


    If it''s not feasible to store session keys separately from your data, then you
    can use session keys using a master key. The master key is kept in a secure store,
    completely separate from the data to be encrypted, or derived from a password
    entered by the application user. A session key is used to encrypt the data to
    be protected. The session key is encrypted with the master key and stored alongside
    the data that it applies to, while the master key remains in a secure key store.


    # Ensuring Data Does Not Change


    Now you have methods to encrypt and decrypt data from a known key and IV. However,
    there is one final problem to consider — how to detect changes to our encrypted
    data. An attacker could change your encrypted data without having to decrypt it,
    causing corruption, or if the attacker is very careful (or lucky), alter the entire
    meaning of the data.


    You have already discovered a way to take a fingerprint of data through hashing,
    for integrity checking, you also need to ensure the hash cannot be changed. There
    are two methods of this:


    +   - You can hash the unencrypted data, and store the hash somewhere secure and
    separate from the data.

    - You can encrypt the hash so an attacker must know the encryption key to change
    the hash.


    Storing the hash separately introduces administrative complexity.


    The standard approach for generating an encrypted hash is to create a Message
    Authentication Code (MAC). You already encountered one of these in Chapter 5,
    the ViewStateMac.


    Storing a MAC for encrypted data provides two benefits:


    +   - You can verify that data has not been changed (integrity).

    - You can verify that the data was created by someone who knows the secret key
    (authenticity).'
