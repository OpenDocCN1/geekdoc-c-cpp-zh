    # LISTING 5: A Sample WMI Installer Class\n\n```\nusing System.ComponentModel;\n\
    using System.Management.Instrumentation;\n\nnamespace WMIEvents\n{\n    [RunInstaller(true)]\n\
    \    public class ProviderInstaller: DefaultManagementProjectInstaller\n}\n```\n\
    \nYou should put all of WMI classes in a separate assembly. With an installer\
    \ class in the assembly, you can use InstallUtil or a custom MSI action to set\
    \ up your events.\n\n# Another Alternative: Logging Frameworks\n\nEvent log, performance\
    \ counters, and WMI are not for everyone because of the administrative requirements\
    \ necessary to configure them Another common approach is to log events to a database.\
    \ There are a few libraries for this, including the built-in ASP.NET Health Monitoring\
    \ Framework, Microsoft's Enterprise Library Logging Application, and log4net (a\
    \ port of a popular log4j framework). Generally, logging frameworks offer a selection\
    \ of targets for their output (Windows Event Log, files, emails, and databases),\
    \ as well as the capability to develop new targets, should the need arise. A third\
    \ party framework may provide the flexibility you need to log in a restricted\
    \ environment.\n\nThe following examples utilize one of the most commonly used\
