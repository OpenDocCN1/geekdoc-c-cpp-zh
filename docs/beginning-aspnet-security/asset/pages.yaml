- pgno: 191
  md: '# CHAPTER 7 ADDING USNAMES AND PASSWORDS


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_191_0.png)


    FIGURE 7-4: Viewing the Membership table in Visual Studio


    # Configuring the Membership Settings


    When you created an account, you may have tried to use a simple password, only
    to have it rejected. By default, ASP.NET membership requires strong passwords
    — a minimum of eight characters, containing at least one number and one non-alphanumeric
    character, as well as a mixture of case letters. This may be overkill for your
    sites, or difficult for users to remember, so they end writing it down. It''s
    difficult to advise what password policies you should use. It depends on your
    application. A banking Web site should use strong passwords, such as the ASP NET
    default.


    You can use the forms provider entry in the membership> configuration element
    to configure the password policy, as well as the need for a secret question and
    answer, and other settings. Table 7-3 lists the configuration settings for the
    membership provider.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# TABLE 73: The SQL Membership Provider Attributes


    | ATTRIBUTE | DESCRIPTION |

    | --- | --- |

    | connectionString | The name of the connection string for the membership database.
    The default connection string name is LocalSqlServer |

    | applicationName | The name of the application under which membership data is
    stored. This enables multiple applications to share a membership database. Applications
    with different names have their own membership entries. Applications with identical
    names share membership entries. |

    | commandTimeout | The number of seconds the provider will wait for a SQL command
    to finish timeout. |

    | enablePasswordRetrieval | Iftrue, the membership provider will allow the retrieval
    of passwords. This is not supported if the password format is Hashed. |

    | enablePasswordReset | Specifies if the membership provider will allow password
    resets. The SQL membership provider defaults to true. |

    | maxInvalidPasswordAttempts | The number of maximum password attempts allowed
    before a user account is locked. |

    | minRequiredNonAlphanumericCharacters | The number of special characters that
    must be present in a password. |

    | minRequiredPasswordLength | The minimum length of a valid password. |

    | passwordAttemptWindow | The number of minutes during which failed password attempts
    are tracked. Entering an invalid password resets the window. The default value
    is 10 minutes. |

    | passwordStrengthRegularExpress | Specifies a regular expression used to validate
    password strength. |

    | requiresQuestionAndAnswer | Specifies if the membership provider will require
    a password to a special question to reset passwords. |

    | requiresUniqueEmail | Specifies if an email address must be unique when a new
    account is created. |

    | passwordFormat | Specifies the format of the stored password. This may be a
    value of Clear,Hashed,ofEncrypted. This defaults to Hashed |'
