  img_proc: true
- pgno: 246
  md: 'choose the Properties menu item. Then click the Security tab and you should
    see the screen shown in Figure 9-5.


    Click the Edit button and then click Add. Enter the account name under which your
    application pool runs and click OK. In the Permissions list, check the Allow checkbox
    beside each of your permissions you require, then click Apply. If you select "Full
    control", then your application will now be able to read, write, create, and delete
    files in the directory.


    There are two core problems with creating files:


    +   * What to name the files

    * How to clean them up once their period has passed


    If files are temporary, you can use GetTempFileName() method supplied by the Path
    class. This will generate a filename with a .TMP extension and a zero length file
    located in the system directory, and create the number of temporary files is limited
    to 63,535, so old files must be cleaned as quickly as possible.


    Because this may create an artificial restriction on your application, you should
    use Path.GetRandomFileName(), which generates a cryptographically random value
    that you can use to create a file or directory. You can then combine this with
    the path to the directory in which you are creating files, and write your file.


    Once you have created the file, you can serve it using the secure techniques earlier
    in this chapter.


    Of course, creating files takes up space. You should never create files of unknown
    length on the disk containing the operating system. Instead, isolate the directory
    where, if space runs out, out of space will result in a recoverable condition.


    You may also need to implement a cleaning mechanism, according to your application
    requirements. If you have full control over the server, you could schedule a PowerShell
    or Windows Script to clean the empty directory of older files. If you do not have
    access to the operating system, or if you wish to include your cleaning mechanism
    in your application, you can implement a scheduler.


    One of the easiest ways to do this is by technique by Omar Azbir at http://www.codeproject.com/KB/aspnet/ASHTTPService.aspx.
    This technique utilizes the threading model already built into the ASP.NET cache
    with a callback function that is called when the item is removed from the cache.
    It also allows you to schedule jobs of varying frequency, without creating your
    own background threads, by adding a few lines of code to the global.asx file in
    your application. Listing 9-4 shows an example.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_246_0.png)


    FIGURE 9-5: The file system tab for a directory'
  merge: -1
  img_proc: true
- pgno: 247
  md: "# 220 | CHAPTER 9 USING THE FILE SYSTEM\n\n# LISTING 9: A quick and easy serializer\
    \ using the ASP.NET cache\n\n```\n<@ Application Language=\"C#\">\n<script runat=\"\
    server\">\n    private const string CleanUpTask = \"appCleanFiles\";\n\n    private\
    \ static CacheItemRemovedCallback OnCacheRemove = null;\n\n    void Application_Start(object\
    \ sender, EventArgs e)\n{\n        // code that runs on application startup\n\
    \        AddTask(CleanUpTask, 0);\n    }\n\n    private void AddTask(string taskName,\
    \ int frequency)\n{\n        OnCacheRemove = this.CacheItemRemoved;\n        HttpRuntime.Insert(typeName,\
    \ frequency, null, DateTime.Now.AddSeconds(frequency), Cache.SlidingExpiration,\
    \ CacheItemPriority.NotRemovable, OnCacheRemove);\n    }\n    public void CacheItemRemoved(string\
    \ key, object value, CacheItemReason reason)\n{\n        switch (key)\n      \
    \  {\n            case CleanUpTask:\n                // Perform our cleanup here\n\
    \                break;\n        }\n\n        // re-add your task so it recurs\n\
    \        AddTask(key, Convert.ToInt32(value));\n    }\n</script>\n```\n\nOf course,\
    \ you must know what files you can clean up. You could iterate through the directory\
    \ and check the file for creation date, or, as you create files, you could store\
    \ them in a list, along with an expiry time. You could then iterate through the\
    \ list looking for expired files when the cleanup runs.\n\n# HANDLING USER UPLOADS\n\
    \nASP.NET 1.0 and 1.1 included an HTML FileUpload control that allowed users to\
    \ upload files. This control introduced an <input type=\"file\"> element into\
    \ your Web page to enable uploads. However, before you could use the file, you\
    \ had to modify the page to include the enctype=\"multipart/form-data\" attribute\
    \ to the page's <form> element. ASP.NET 2.0 introduced a new FileUpload server\
    \ control that handles all of the necessary processing for file uploads."
  merge: -1
  img_proc: true
