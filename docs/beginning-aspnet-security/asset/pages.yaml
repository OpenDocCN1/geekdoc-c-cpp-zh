  md: '# 58 | CHAPTER 3 SAFELY ACCEPTING USER INPUT


    +   - SetFocusOnError—When true, this will place the cursor inside the first field
    that fails validation.


    +   - Display—This controls how the error message is shown. The Display property
    can have one of the three values:


    +   - None—The validation message is never displayed.


    +   - Static—Space for the validation message is always reserved in the page layout.


    +   - Dynamic—Space for the validation message is only reserved if the validation
    fails.


    +   - ValidationGroup—A validation group allows you to place controls on a page
    into logical groups, with each separate for form submission. When a button with
    a ValidationGroup is clicked, any validation controls with a matching ValidationGroup
    property will be fired.


    # Using the RequiredFieldValidator


    TheRequiredFieldValidator checks the value of a control is different from its
    initial value. At its simplest, when you add text to a box, the control ensures
    the text is not empty, as shown here:


    Name:<asp:TextBox run="server" ID="name" /><asp:TextBox>


    ```

    <asp:RequiredFieldValidator ID="RequiredValidator" runat="server"

    ErrorMessage="You must enter your name" ControlToValidate="name"

    Display="Dynamic" />

    ```


    The control may also be used to list boxes or drop-down menus. In this case, set
    the InitialValue property on the validation control, as shown here:


    ```

    <asp:DropDownList runat="server" ID="country">

    <asp:ListItem Selected="True">Select a country --</asp:ListItem>

    <asp:ListItem Text="Armenia"/</asp:ListItem>

    <asp:ListItem Text="Australia"/</asp:ListItem>

    <asp:ListItem Text="Germany"/</asp:ListItem>

    <asp:ListItem Text="Canada"/</asp:ListItem>

    <asp:ListItem Text="Denmark"/</asp:ListItem>

    </asp:DropDownList>

    ```


    ```

    <asp:RequiredFieldValidator runat="server" ID="requiredCountry"

    InitialValue="" ControlToValidate="country"

    ErrorMessage="You must select a country*" />

    ```


    All validators will only run when the control they are validating is not empty
    (although the CustomValidator may be configured to run on empty controls if necessary).
    If a field is mandatory, you must use a RequiredFieldValidator.


    # Using the RangeValidator


    TheRangeValidator checks if the value of a control falls within a desired range
    for a desired type (Currency, Date, Integer or String). The default type is String.
    The following example will validate a box that has a value between 18 and 30:'
