- pgno: 29
  md: '# CHAPTER 1 WHY WEB SECURITY MATTERS


    > DISCLAIMER: DO IT TO YOURSELF, BUT NOT TO OTHERS

    This book sets out to teach you about common Web vulnerabilities. It does so by
    illustrating the problem and showing how bad code can be used to attack an unprotected
    Web site. I firmly believe this is the best way to illustrate the problem and
    drive home the fact that Web security is something every Web developer should
    keep in mind as or she develops a new site. It may be tempting to try out some
    of the techniques shown on a friend''s Web site, or your company''s Web site,
    or even a Web that you visit on a regular basis. I have a single word of advice
    about this — dont! hacking is illegal in the majority of countries, regardless
    of the intent behind it, and using any of the exploits described in this book
    may land you in serious trouble. The author nor Wox condone or defend anyone who
    attacks systems they do not own, or have not been asked to attack by the owner.


    # ANATOMY OF AN ATTACK


    Figure-2 shows a typical layout of the hardware involved in a Web site: the client
    (or attacker), a firewall, the Web server, and perhaps a SQL server and file server
    to store uploaded documents. In the early days of Web security, most hacks made
    use of vulnerabilities in the Web server software, the operating system hosting
    it, or the ancillary services running on it (such as FTP or email).


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_29_0.png)


    FIGURE 12: A typical network for a Web site


    Often, an exploit in the operating system or Web server would allow access to
    the underlying file system, or allow an attacker to run code on the hosting machine.
    During the late 1990s, Microsoft''s reputation for security was poor because exploits
    come out against Windows and IIS on a regular'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'basis. Administrators would find themselves installing a patch against one
    problem, only to find another unpatched problem was now being exploited. The poor
    reputation for security undoubtedly resulted in lost sales, but it also resulted
    in a push at Microsoft to develop more secure systems by changing the company''s
    development process.


    When the main focus of an attack was the operating system or Web server, hackers
    would begin running fingerprinting tools like NMap against the target system to
    discover the exact version of the operating system and server software in use.
    The hacker could then use this to determine potential avenues of attack known
    exploits for that operating system. As the operating system security improved,
    it became more difficult to exploit. The security of the hosting environment also
    improved because firewalls became more commonplace, and protected the systems
    by closing off services that did not need to be exposed to the outside world (such
    as databases or file servers). The attackers had to find a new weak point to attack
    — and the only thing available to them were the Web applications themselves, which
    are generally easier to exploit the operating system they run on.


    Hypertext Transfer Protocol (HTTP) is the protocol used to retrieve and send information
    to Web sites. It is text-based and incredibly simple. So you don''t specialized
    tools to send requests and receive responses. This is different from exploits
    used against the operating system. Attackers exploiting the operating system would
    have to send commands (a stream of non-textual information) to the targeted machine.


    HTTP is also stateless, which means that every request contains all the information
    necessary to receive a response. So an attacker does not have to craft a series
    of requests and responses. A single request can be enough to compromise a Web
    application. For some exploits against an operating system, an attacker needs
    a complicated sequence of requests and responses to worm his way into the system.


    An attacker will begin by discovering the platform the application is running
    under. This is normally easy to determine the format of the application URLs,
    and the fact that Web servers tend to advertise their software name when you connect
    to. The platform may drive certain actions. For example, if the hosting platform
    is Windows, the database used by an application hosted on is Microsoft SQL Server.
    From there, attackers will look at the pages available to them and the parameters
    set with each page, in the URL or HTML forms. The hacker will start to change
    the values to what he wants, and to see if an error can be triggered or a common
    exploit.


    For example, a numeric parameter, such as the ID parameter in http://www.com/bookdetails?id=12345
    can be changed to letters if it causes an error. If an error is displayed, the
    error information may give away information about the underlying application.
    A field can be filled with special characters, potentially including HTML. If
    this data is redirected without being properly encoded, the system may be vulnerable
    to Cross Site Scripting (XSS), which attackers can use to deface the site, or
    redirect browsers to a site of their own.


    The Microsoft defacement shown in Figure 1-1 was made not by an operating system
    vulnerability, but by a badly coded application that implemented access in an
    insecure manner. This allowed arbitrary SQL commands to be run from the Web page,
    and changes to be made to the contents of the database from which the page was
    generated.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# CHAPTER 1 WHY WEB SECURITY MATTERS


    The classic example of SQL injection is used to bypass a login screen, so let''s
    look at a typical username and password system. The user details are stored in
    a database table called Users, with a column for the username and a column for
    the password. The login screen (a typical example of which is shown in Figure
    1-3) asks for a username and password. When the login button is clicked, the developer''s
    code runs a SQL query looking for a row that matches the specified username and
    password. If a row is returned, the correct, the user is allowed access to the
    system. If no data is returned from the query, the login fails, and the user is
    informed and allowed to try again.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_31_0.png)


    Behind the scenes in the login page, the developer builds up the query using the
    following SQL string:


    ```

    private const string LoginSql = "select * from users where username=''0'' and
    password=''1''1";

    ```


    The developer uses format to insert the contents of the username and password
    into the query before sending it onto the database, so a query would look like
    this:


    ```

    select * from users where username=''harry'' and password=''wrox''

    ```


    The hacker knows developers do this, and the hacker knows the standard way to
    bypass this dynamic query: enter into the user field and a "magic" value of OR
    1=1--; in the username field. What happens to the query now? It becomes following:


    ```

    select * from users where username=''hack'' OR 1=1-- and password=''wrox''

    ```


    If your SQL skills are a little rusty, the -- characters do not count in SQL.
    They (and anything following) will be ignored, the SQL query is really the following:


    ```

    select * from users where username=''hack'' OR 1=1;

    ```


    The OR condition on the SQL query will always return true, and so this query would,
    in fact, return all rows from the database. The developer who simply checks that
    data has been returned will believe this to be a valid login, and will allow the
    attacker to continue.


    In the Microsoft events exploit shown in Figure 1-1, the attacker changed the
    v2=1 parameter in the address to become v2=1''. This caused a syntax error in
    the query, which caused'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Risks and Rewards | 5


    an error to occur. The error message was displayed to the attacker using the developer
    error page you probably have seen when developing your own Web sites. The error
    page displayed the full query that caused the problem, which contained table and
    column names.


    Now, the attacker could write a SQL statement to change database records. Because
    the database records were used to generate the page (a typical feature of content
    management systems), the attacker could change how a page looked. In fact, the
    attacker added content to events page with `<link href="http://.lashtport.com/remoter/css.css
    type=css rel=stylesheet"> which was a prepared Cascading Style Sheet (CSS) that
    displayed the images and text desired, thus spoiling someone''s sunny day.


    Was the developer behind this system a bad developer? Probably not—keeping up
    with the threat landscape for Web applications can be difficult. If you have no
    awareness of the threats, how can you defend your application against them? This
    is the purpose of this book — to raise your awareness of the threats against Web
    applications, and to help you understand the solutions to protect yourself and
    your customers.


    # RISKS AND REWARDS


    The media portrays hackers as individuals or groups for money or at the beck and
    call of an enemy government. While this may be true for some, it isn''t the whole
    story.


    In the 1940s, some of practical hackers at the Massachusetts Institute of Technology
    (MIT) used the word "hack" to describe their hijinks, in recent years, having
    including balloons on the football field that inflated during a game against Yale,
    or decorating the Great Dome to like R2-D2 two days before The Phantom Menace
    was due for its cinematic release. The R2-D2 hack, implemented detailed instructions
    on how to dismantle the structure without causing any damage. The instructions
    were attached carefully to the dome, also included The instructions were addressed
    to "Imperial Drones" and signed "Rebel Scum". (You can see a collection of hacks
    from 1989 to the present day http://hacks.mit.edu/)


    The first electronic hackers were the phakers in the 1950s who used dials to hijack
    AT&T tone-dining systems to make free-distance calls. The majority of the computer
    hackers we see today are those that cause damage. However, this may be because
    they are the most noteworthy ones. As indicated in Table 1-1, the Web Hacking
    Incidents Database Report for 2008 produced by Breach Security Inc. (available
    from http://www.breach.com/confirmation/2008WHID.html) shows that the most frequent
    goal of attacks was defacement. The Microsoft hack depicted in Figure 1-1 showed
    a simple message from the attacker who probably did it just to gain kudos from
    his peers.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# TABLE 11: Goals for Hacks in 2008


    | ATTACK GOAL | PERCENTAGE OF ATTACKS |

    |---|---|

    | Defacement | 24 |

    | Stealing Sensitive Information | 19 |

    | Planting Malware | 16 |

    | Monetary Loss | 13 |

    | Downtime | 8 |

    | Phishing | 5 |

    | Deceit | 2 |

    | Worm | 1 |

    | Link Spam | 1 |

    | Information Warfare | 1 |


    > Source: The Web Hacking Incidents Database Annual Report 2008, Breach Security
    Inc. (http://www.breach.com/resources/whitepapers/downloads/WP_WebHackingIncidents_2008.pdf)


    The risks for a hacker are low. It''s easy to hide behind proxies on the Internet
    that disguise the source of attack. Stolen credit cards are swapped on underground
    Web sites, enabling hackers to register accounts on Web hosts to capture information.
    Defacement of Web sites can be more subtle than a simple “I did this” message.
    The attacks can instead attempt to drop malware that infect a user machine. This
    malware can capture login information for banking sites, look for credit card
    information, or add the machine to a botnet. (A botnet is a collection of infected
    machines the botnet controller can instruct to do things, such as spam flood or
    flood a Web site with requests).


    The rewards from these attacks are equally simple. Information such as credit
    card data, bank logins, or the control of an infected machine all attackers can
    sell. Distributed Denial-of-service (DDoS) attacks, which are made easy by botnets,
    can be used to blackmail companies who pay for their sites to remain available.
    In 2008, DDoS attacks were commonly reported by gambling Web sites, especially
    during popular events that represented a large amount of gambling revenue.


    Regardless of why people hack, the risks are present for you and your applications.
    Consider how your customers would react to even a simple defacement, let alone
    a hack that compromises their information. Customers expect a service they are
    using, or an application they buy, will be secure. A security incident (or multiple
    security incidents) damages the reputation of the software manufacturer, and impacts
    the sales of the product.


    # BUILDING SECURITY FROM THE GROUND UP


    When you gather the requirements for your system, you normally consider functionality,
    performance, the user experience, maintainability, and other attributes. But about
    what security?'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Building Security from the Ground Up


    Security should be built into your system from the start, and should be part of
    a system''s specification and functional requirements. This may be a struggle
    — customers or project managers may assume that security is inherent in a system.
    They may balk at having it written down and taken into account during development
    — after all, the more that is written down, the more software may cost and the
    longer it may take.


    However, the assumption that security does not need to be specified is a huge
    risk. When security is not explicitly part of the software requirements, it may
    never get considered. Microsoft itself has made great advances in years of developing
    secure code by changing its approach and embracing the Security Development Lifecycle
    (SDL), which highlighted the need to integrate security into the software development
    lifecycle. The SDL consists of seven steps:


    +   1. Gather security requirements.

    2. Secure the design.

    3. Incorporate threat modeling.

    4. Perform code reviews.

    5. Perform penetration tests.

    6. Secure the deployment of the application.

    7. Integrate feedback into the next iteration of the development cycle.


    Security is secured with every step in the development process, including the
    requirements gathering — after all, it is cheaper to fix potential problems during
    design and when it is a breach after one has taken place. One of the most difficult
    aspects of building secure software is analyzing the threats against your application,
    and which areas of your system represent the highest risks. The practice of threat
    modeling helps uncover how an application can be attacked, and how it should be
    secured against those attacks.


    The SDL allows developers to identify threats and develop countermeasures early
    in the development lifecycle, creating the countermeasures as an application feature.
    Some potential attacks as application defects right from the start, formally logged
    in any bug-tracking system, and finally signed off when mitigation is complete.
    That way, the threats are never forgotten and also will be visible until countermeasures
    are developed.


    Microsoft Press has published three books that can help you understand the process
    Microsoft uses:


    +   > Writing Secure Code, Second Edition by Michael Howard and DavidLeBlanc (Redmond,
    WA: Microsoft Press, 2002)

    > The Security Development Lifecycle Michael Howard and Steve Lipner (Redmond,
    WA: Microsoft Press, 2006)

    > Threat Modeling by Frank Swiderski and Newton Snyder (Redmond, WA: Microsoft
    Press, 2004)


    These books contain a wealth of information about secure development techniques,
    and are useful companions to this and other software security books.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# CHAPTER 1 WHY WEB SECURITY MATTERS


    Over the years, coding best practices and approaches have become formalized, tested
    and shared. Security principles are no different. The following section lists
    some general security principles you should follow during your application development.


    # Defense in Depth


    Never rely on a single point of defense. Your application is often the last layer
    between an attacker and back-end systems such as a database or a file server,
    which in turn, may be connected to a corporate network. If your application is
    hacked, these systems may be exposed to the attacker. By using layers of defensive
    techniques in your application as input validation, secure SQL construction, and
    proper authentication and authorization, your application will be more resilient
    against attack.


    # Never Trust Input


    As discovered in the example attack earlier in this chapter, a simple change to
    an input into the application may result in a security breach. Input is everything
    that comes into your application during run-time — data entry, the click of a
    button, data loaded from a database or remote system, XML files, anything you
    can know about the your application is compiled. Every single piece of input should
    be validated and proved correct before you process it. If invalid input is sent
    to your application, then your application must cope with it correctly, and not
    crash or operate upon it.


    # Fail Gracefully


    Error handling is often the last developers add to their applications. Your customers
    want to see things working, not failures. As such, error handling is usually barely
    tested, and it can be difficult to test some errors through manual testing. The
    error messages raised during the Microsoft hack shown earlier in this chapter
    gave enough information to the attackers that they were able to inject arbitrary
    SQL commands. A combination of developer discipline, testing with unexpected,
    random, or invalid data, in combination with careful design, will ensure that
    all areas of your code (including error conditions) are securely constructed.


    # Watch for Attacks


    Even if you handle errors gracefully, you may not be logging what occurred. Without
    a logging strategy, you will miss potential attacks against your application,
    a valuable source of information that you can use to strengthen the next version.
    Error logging and a regular auditing of the error logs is vital in knowing what
    is happening to your Web site.


    # Use Least Privilege


    When I speak at user groups and conferences, I often ask how many people use an
    administrator account for development purposes. The majority of hands in the audience
    go up. It is often tempting to solve file access problems or database connection
    errors by running as a system account or a database administrator account. However,
    when an attacker takes over an application, the attacker runs as the user application
    under.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Your applications should run under the lowest privilege level. Your applications
    will rarely need access to C:\Windows or the capability to create and drop tables
    in a database. Even when you are developing with the built-in Web server provided
    with Visual Studio, it will run under your user account, with all the privileges
    you have, disguising any problems your application may have running in a locked-down
    environment. It should be developed for, and testing against, a least-privilege
    account.


    On rare occasions, a part of your application may need more access. This part
    can be extracted and run with elevated permissions under a different user context
    with a clearly defined (carefully tested) interface between the normal application
    and its privileged section.


    # Firewalls and Cryptography Are Not a Panacea


    There are two Web security fallacies I hear on a regular basis:


    +   - We have a firewall so we’re protected.

    - "Encrypted, so it’s secure."


    Neither of these statements is true. Firewalls protect infrastructure, hiding
    services from the outside world and reducing the exposed surface area of your
    network. But in order for your application to be of any use, it must be exposed
    to its users, with the firewall configured to allow access. An application firewall
    is a relatively new addition to the market that monitors communication into your
    application for suspected attacks. Attacks are often customized to your application,
    and that is not something an application firewall can recognize.


    Cryptography, on the other hand, can be an effective security mechanism, but alone
    does not provide security. The security of the encryption keys, the algorithm
    used, the strength of passwords, and other factors impact the effectiveness of
    the cryptographic system. If one of these factors is weak, then your encryption
    can be easily cracked.


    # Security Should Be Your Default State


    The SQL Slammer taught Microsoft an invaluable lesson — don’t turn on unneeded
    functionality by default. The SQL Slammer attacked the SQL browser, which isn’t
    used on most machines, but was enabled by default. You will now find that SQL
    2005 and SQL 2008, as well as Windows 2003 and beyond, Microsoft does not enable
    services unless the administrator selects and configures them.


    Some applications come with default passwords for administrator accounts, something
    a careless administrator or non-technical end user ever need. The default passwords
    become widely known, attackers will test Web sites using these to see if they
    can authenticate with them — and often can. If your application contains authentication
    functionality, then choose secure settings. Randomly generate temporary passwords,
    rather than setting a default one. If your application contains optional functionality,
    then do not install or expose it unless required, reducing the attack surface
    exposed to a hacker.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# Code Defensively\n\nWhen developing, you should consider defensive programming,\
    \ input validation, checking for out-of-range errors, and so on. This attitude\
    \ should even extend to things such as the humble statement. Consider the code\
    \ snippets in Listing 1-1 and 1-2.\n\nLISTING 11: A Sample if Statement\n\n```\n\
    if (model.ValidationStatus == ValidationStatus.Invalid)\n  return false;\nelse\n\
    \  return true;\n```\n\nLISTING 12: Another Sample if Statement\n\n```\nif (model.ValidationStatus\
    \ == ValidationStatus.Valid)\n  return true;\nelse\n  return false;\n```\n\nWhich\
    \ of these statements is more secure? Are they the? What happens if ValidationStatus\
    \ has three states: Valid, Invalid, and Unknown? If ValidationStatus was Unknown\
    \ in Listing 1-1, then true would be returned. This would mean that the code will\
    \ start to treat the object as valid. Listing 1-2, however, specifically checks\
    \ for Valid, and defaults to a negative outcome, which is a more secure value.\n\
    \n# THE OWASP TOP TEN\n\nThe Open Web Application Project (OWASP), based on the\
    \ Web at http://www.owasp.org/, is a global community that focuses on improving\
    \ the state of Web application security. All OWASP materials are available under\
    \ an Open Source license, and their meetings (with more than 130 local chapters)\
    \ are free to attend.\n\nOne prominent OWASP project is the Top Ten Project (http://www.owasp.org/index.php/).Category:OWASP_Top_Project,\
    \ a document compiling the most critical Web application security flaws. The Top\
    \ Ten Project has been used by the U.S. Defense Information Systems Agency as\
    \ part of their certification process, and adopted by the Payment Card Industry\
    \ standard, a set of regulations for any merchant accepting credit card information.\n\
    \nFollowing is the 2007 list (the most current as of this writing), and the chapters\
    \ in the book that address each of the issues."
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Cross Site Scripting(XSS) —This attack uses flaws in an application to inject
    JavaScript that can be used to redirect users, change the content of a page or
    steal a user''s session. The attack and mitigation techniques are covered in Chapter
    3.


    Injection flows —Injection flaws are exploited by malformed input data, causing
    the change to queries or run commands against a back-end system such as SQL. This
    is covered in Chapter 8 and Chapter 10.


    Malicious file execution —This involves the execution of files that are not part
    of your application, either via a reference to an external object, or if your
    application allows, files uploaded to your server. ASP.NET does not allow the
    inclusion of executable code from remote sources, but if you allow users to upload
    content, you may still be at risk. Securing uploads is covered in Chapter 9.


    Insecure object reference —If a developer exposes a reference to an internal object
    (such as a database''s primary key


    Cross Request Forgery(CSRF) —A CSRF attack forces a logged-in victim''s browser
    to submit requests to a vulnerable application, which are executed as if the application
    itself caused the request. This exploit and mitigations against it are covered
    in Chapter 4


    Information leakage and improper error handling—An attacker can use errors to
    discover information about your application. Error handling is discussed in Chapter
    5, and encryption of configuration files in Chapter 6


    Broken authentication and session management—A poorly implemented authentication
    system is as useful as a chocolate teapot—providing a false sense of security
    because credentials may not be encrypted or may be easy to hijack. Writing a secure
    authentication protocol is a difficult task, and you will be better served by
    using implementations native to your development platform. Chapter 7 introduces
    ASP.NET member providers, and discusses Windows authentication. Chapter 11 introduces
    authentication for Web services.


    Insecure cryptographic storage—Until you understand the cryptographic building
    blocks and their suitable uses


    Insecure communications—Applications often do not encrypt traffic between the
    application and the user, or to back-end components. Encryption of Web traffic
    is covered in Chapter 14, and encryption of Web services is covered in Chapter
    11.


    Failure to restrict URL access—Authentication without authorization is a key piece
    of the security puzzle. Applications can authenticate users, but fail to restrict
    access to sensitive areas. Authorization with ASP.NET is discussed in Chapter
    7. Chapter 11 covers authorization with Web services, and Chapter 16 covers authorization
    with the ASP.NET model-view-controller (MVC) paradigm.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# MOVING FORWARD


    Your Web application is a target for mischief makers and malicious hackers. By
    its very nature, it is exposed to the world at large. Without knowing about potential
    attacks, it is difficult to protect yourself against them. This book will arm
    you with knowledge to secure your application — but this is just the beginning.
    New attacks arise, new techniques are discovered — it’s up to you to continue
    reading blogs by security experts, attend user groups, delve into security forums,
    browse the OWASP Web Site, and use any useful resources you can find to keep on
    top of security and guard yourself, your application, and your customers.


    # CHECKLISTS


    At the end of most chapters in this book, you will find helpful checklists that
    spotlight important points made throughout the chapter.


    Chapter 2 takes a look at how the Web works, examining the protocol used when
    requesting and receiving Web pages, how forms submissions work, and how ASP.NET
    uses these fundamentals to provide its framework for Web development. After the
    underpinnings of the Web are explored, future chapters will examine how Web applications
    can be exploited, and what you can do to prevent your application from being hacked.'
  merge: -1
