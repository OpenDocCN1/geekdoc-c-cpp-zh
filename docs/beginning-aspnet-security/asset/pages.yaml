- pgno: 136
  md: "To use log4net, download and unzip the installation package. Add reference\
    \ to the log4net assembly to your project by right-clicking on your project in\
    \ Solution Explorer, choosing Add Reference, and then browsing to bin/net/2.0/\
    \ subdirectory of the unzipped package.\n\nThe next step is to create a configuration\
    \ for log4net, which defines what will be logged and how it will be logged. For\
    \ example, for the sake of simplicity, you will configure log4net to use a file.\
    \ In a real-scenario, the log file would be stored outside of your Web application\
    \ directory, and access to it would be strictly controlled. Alternatively, another\
    \ logging destination (such as a SQL Server database) would be used, with strict\
    \ controls on which user can view the log data.\n\nAdd a new file to your solution\
    \ called log4net.config and enter the contents of Listing 5-7.\n\n# LISTING 5:\
    \ A sample log4net.config File\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<log4net>\n <root>\n  <level value=\"DEBUG\" />\n  <appender-ref ref=\"\
    FileAppender\"\n</root>\n <appender name=\"FileAppender\" type=\"log4net.Appender.FileAppender\"\
