- pgno: 90
  md: '# TYPICAL UNTRUSTED INPUT SOURCES


    The following is a list of common untrusted input sources. It is by no means exhaustive
    — input varies with each application. You must decide on the trustworthiness of
    your inputs.


    +   - Form Blds (from Web controls or directly from the request object)

    - Query string variables

    - Databases

    - External Web services

    - Cookies

    - HTTP headers

    - Session variables

    - ViewState


    # A CHECKLIST FOR HANDLING INPUT


    The following is a checklist you should follow when deciding how to deal with
    user input and how to output it to a Web page:


    +   - Review all inputs to a system and decide if they are trustworthy— Remember
    that all inputs should be considered untrusted by default. If input must be trusted
    and comes from outside your application, it must be validated and sanitized. A
    good practice is to perform validation for all inputs, untrusted or not.

    - Review code that generates output— Remember that XSS attacks are dependent on
    untrusted input as output direct. Look your code for Response.Write, &= and setting
    Text of Web Controls as well as other properties on ASP.NET controls.

    - Examine output functions and determine if they use untrusted input parameters—
    Once all output parameters have been discovered, examine the values they are using
    to generate output. If they are using untrusted input, then it will require encoding.
    Typical input sources that generate output database queries, the reading of files
    from the file system, and calls to Web services.

    - Determine what encoding the output expects— Different output types require different
    encoding methods. For example, HTML requires HTML encoding, URLs require URL encoding,
    and so on.

    - Encode output— When assigning output, use the encoding you have determined to
    make the output safe.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   Ensure cookies are marked HttpOnly. — As part of your layered defense,
    ensure that any cookies that you do not need to access on the Web client are marked
    with the HttpOnly attribute.


    +   Do not disable request validation on a site-wide basis. — Request validation
    should be disabled on a per-page basis. This ensures that any page where you forget
    that input is accepted will be protected until you add encoding to the page output
    and request validation off.


    +   Use Microsoft AntiXSS library and SRE. — The Microsoft AntiXSS library provides
    more robust and flexible encoding methods than the standard .NET framework. In
    addition, the SRE automatically encode output for controls it knows about. However,
    this is not an excuse to avoid explicitly encoding output yourself.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 4 Using Query Strings, Form Fields, Events, and Browser Information


    Input arrives into your Web application from various sources. Chapter 3 discussed
    how you should treat input, how input should be considered untrustworthy by default,
    how you can validate it, and how you can output it safely. This chapter introduces
    some of ways input can arrive, the vulnerabilities each of these vectors are susceptible
    to, and how you can mitigate against them.


    In this chapter, you will learn about the following:


    +   - How to pass input via query strings

    - How to use hidden fields

    - How forms can be hijacked

    - How the ASP.NET event model works

    - How to avoid common mistakes with browser information


    # USING THE RIGHT INPUT TYPE


    HTTP allows input into your application in the following four ways:


    +   - The query string

    - Form fields

    - HTTP headers

    - Cookies'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The base class for ASP.NET pages, Page, contains a property, Request of typeHttpRequest.
    When your Page class is created by ASP.NET, you have access to the Request property.
    It is initialized and contains the various inputs as part of the page request,
    as well as other information provided by the ASP.NET runtime (such as the identity
    of the user, whether the page has been requested over SSL, and so on). The Page
    class also contains a Response property that allows you to manipulate the response
    when your page has finished processing.


    # QUERY STRINGS


    Query string is part of a URL that contains data to be passed to a Web application
    as part of a request. A question mark separates the query string from the address
    part of a URL (as defined in RFC1738 and RFC3986). A typical URL containing a
    query string would be as follows:


    ```

    http://site.com/path/page.aspx?querystring

    ```


    Generally, query strings are used as parameters to a page consisting of name/value
    pairs, name separated from the value by an equals sign (=), and the pair separated
    from other pairs by an ampersand(&), as shown here:


    name1=value&name2=value&name3=value


    The name plus value plus amplus is a convention set out in the HTML specification.
    It is by no mandatory. The obvious problem with using a query string to pass data
    is that query strings are visible in the Web browser address. Tampering with the
    query string is a simple matter of typing.


    In 2007, the government of the United Kingdom (UK) introduced a new application
    system called the Medical Training Application Service (MTAS) for doctors who
    were requesting placements. A doctor changing the query string parameter, could
    view messages to other doctors offering jobs. The system and information exposed
    for at least eight hours. It was further discovered that, by manipulating the
    query string, personal information such as phone numbers, previous convictions
    and even sexual orientation of applicants were available. The formal name for
    this type of vulnerability is Insecure Direct Object Reference.


    The MTAS took a message identifier as one of parameters. This message identifier
    was a direct object reference to an internal data record and, consisted of four
    digits assigned in consecutive order (for example, 0001, 0002, 0003). An attacker
    (or even a normal user, in the case of MTAS) could tamper with the message identifier
    to access other messages. Usually, the reference to a unique reference within
    a database (or any exposed data construct) could be vulnerable to this type of
    attack.


    Another common error is specify filenames with query strings (or, indeed, any
    parameter). If an attacker passes c:\windows\system32\config\sam and your code
    not check whether filenames are contained within their own scope, the possibility
    exists that your application may serve up the Windows password directory, the
    Security Accounts Manager (SAM) file, or a relative path such as ..\windows\system32\config\sam
    is provided, which breaks out of your


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'application directory by using .. to navigate to the parent directory of the
    current directory. (This is known as a Path Traversal Attack.)


    > NOTE, this is a worst-case scenario. Most Web applications run in a security
    context that restricts them to a particular area on the Web server. For more information,
    see Chapter 9 and Chapter 14.


    The best protection against this attack is to avoid exposing direct references
    to objects such as files and database records in a query string or other parameter.
    Instead, use any other key, index, map, or indirect method that is easy to validate.
    If a direct object reference must be used, then you must ensure that the user
    is authorized before using it.


    For example, consider a system that contains orders, and users have the capability
    to view their order status. Order numbers usually must be sequential, and the
    temptation is to have a URL such as the following:


    ```

    http://mysystem/viewOrder.aspx?orderID=1001

    ```


    Rather than using a direct object reference, you can mitigate against an insecure
    direct reference vulnerability by adding a new reference to the objects in the
    order class or order table — in a manner that is not incremental or easy to guess.
    Typically, a Globally Unique Identifier (GUID) is used. Your URL would look like
    the following:


    ```

    http://mysystem/viewOrder.aspx?orderID=E109F32-A533-42c7-A5FF-45F034C909E

    ```


    In addition, you must implement an access control (if appropriate) because GUIDs
    are only guaranteed to be unique, not difficult to guess, and, if used in a query
    string, could be discovered by an attacker looking through the browser history
    or other logs. In the orders scenario, you would typically not allow anonymous
    access to the page, and you would check that the user who is attempting to view
    the order is, in fact, the person who placed it, or a user within your company
    who is authorized to do so (such as an account manager or an employee responsible
    for fulfilling the order).


    In ASP.NET, query strings are typically used with the HyperLink control, or as
    part of the cross-page postback mechanism provided by the PostBackURL property
    on controls that can trigger postbacks.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# FORM FIELDS


    Hidden form fields are another method of embedding input in a page. A hidden form
    field is a type of form input field that is not displayed to the user — for example
    `input type="hidden" name="example" value="hidden" />`. A user (or an attacker)
    can only see these fields by viewing the source of an HTML page.


    Because the field is hidden from view it is tempting to assume that the values
    set in these fields do not change. But this would be a mistake.


    Shopping cart software has a popular cult trust in the immutability of hidden
    form fields. In 2000, the Common Weakness Enumeration site (http://cwe.mitre.org/)
    listed free shopping cart allowed price modifications because for individual items
    was exposed in a hidden form field. In that year, the Lyric List Manager allowed
    list subscribers to obtain administrator access to the Web control panel by modifying
    the value of `list_admin` hidden field.


    The mitigation for this vulnerability (known as External Control of Assumed Immutable
    Web in the Common Weakness Enumeration Database, a dictionary of common software
    flaws available at http://cwe.mitre.org/) is simple — never assume hidden form
    values, or indeed, any client-side parameter will never change. Furthermore, never
    store data that you don''t want the user to know (like system passwords or cryptographic
    keys) inside a hidden form field.


    In ASP.NET, you can pass data between postbacks in a special hidden field called
    `ViewState`. This does not free you to put secrets into `ViewState` because, by
    default, `ViewState` is not encrypted. It is, however, protected against tampering
    by default. `ViewState` is covered in detail in Chapter 5.


    > WARNING The Request class allows you to access input by its name—for example
    `Request["example"]`. This method of accessing your input should be avoided at
    all costs because the Request indexer first fetches the query string, then form
    variables, then cookies, and finally server variables to supply the named input.
    If there are duplicate input names in any of these locations, only the first matching
    input will be returned, with no indication of where it came from and no indication
    if there are more matches. It is safest to be specific when looking for input,
    and to use the `Request.Query`, `Request.Form`, `Request.Cookies` and `Request.ServerVariables`
    collections.'
  merge: -1
