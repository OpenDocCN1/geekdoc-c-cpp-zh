- pgno: 250
  md: "# Handling User Uploads | 223\n\nBy following the techniques for uploading,\
    \ you can protect yourself against directory traversal attacks. The correct filename\
    \ can then be discovered by reading the FileInfo class to discover the true length\
    \ of the saved file. The following code snippet shows a safer way to save and\
    \ access the properties of the uploaded file:\n\n```\nstring filename = System.IO.Path.GetFileName(\n\
    fileUpload.PostedFile.Filename);\nstring fullPath = Server.MapPath(System.IO.Path.Combine(\n\
    \"@d:\\inetpub\\inbound\\\", filename));\nfileUpload.SaveAs(fullPath);\n```\n\n\
    ```\nSystem.IO.FileInfo fileInfo = new System.IO.FileInfo(fullPath);\nuploadDetails.Text\
    \ = +\n\"File Name \" + filename + \"<br />\" + fileInfo.Length + \"<br />\" +\
    \ \n\"Content type:\" + fileUpload.PostedFile.ContentType;\n```\n\nFor added safety,\
    \ you should ignore any filename sent with the upload request, you should create\
    \ a random filename and save the original filename (for example, in a database,\
    \ mapping the filename to the original filename). You can then use the original\
    \ filename as part of a ContentDisposition header when you serve the file back\
    \ to users.\n\nA final problem — the content type. This is a difficult to overcome\
    \ because you must validate the contents of the file itself. For example, let's\
    \ say the GIF format has a header with the following hexadecimal values: 47 49\
    \ 46 38 39 61. In ASCII, this becomesGIF8a.. Each file format is different in\
    \ its distinguishing characteristics, you will have to write custom code to discover\
    \ the MIME type of an uploaded file. If you send the wrong MIME type to a file\
    \ back to a browser, then the application will load and crash.\n\nOne thing to\
    \ note is that the file being uploaded is stored in memory, which can cause your\
    \ application to slow down (or even fail) if not enough memory is available to\
    \ process the inbound request. You can control the maximum allowed file size by\
    \ changing the actual request size permitted for your application. Setting a size\
    \ restriction will protect your application from malicious users attempting to\
    \ use up the available memory and processes by uploading large files — an Denial\
    \ of Service (DOS) attack to perform. To change the maximum request size, use\
    \ the httpRuntime element in web.config, as shown here:\n\n```\n<?xml version=\"\
    1.0\"?>\n<configuration>\n  <system.web>\n    <httpRuntime\n      executionTimeout=\"\
    90\"\n      maxRequestLength=\"4096\"\n    />\n  </system.web>\n</configuration>\n\
    ```\n\n*"
  merge: -1
  img_proc: true
- pgno: 251
  md: 'The maxRequestLength property allows you to adjust the maximum size of requests
    accepted in kilobytes. For example, changing the maxRequestLength to 10240 will
    increase the maximum request size to 10MB. Remember that the request is not just
    made up of file, but also includes headers and other fields. When changing the
    maxRequestLength property, you should also change the executionTimeout to a suitable
    value. The executionTimeout property sets the length of time (in seconds) ASP.NET
    will wait for a request to finish before terminating it. As you increase the maximum
    request size, you must increase the execution timeout appropriately.


    > **WARNING** Increasing the maxRequestLength and executionTimeout properties
    may expose your application to a DOS attack. Experiment with your server configuration
    to discover the maximum values your hardware will support. It is always advisable
    to keep both properties at the lowest value that works for your application.


    # A CHECKLIST FOR SECURELY ACCESSING FILES


    The following is a checklist of items to follow when writing data access code.


    +   - Truncate specified file names and extract just the file name from any potential
    path Use the Path.GetFileName() to safely remove all directory information.

    - Serve content from a directory outside of your Web application— If you serve
    content from within your application path, then use Server.MapPath() to resolve
    directories. Server.MapPath() will stop any directory resolution of escaping the
    root of your application.

    - Use code Access demands to ensure your application has the ability to access
    the file system — Remember that .NET applications have their own permissions in
    addition to the underlying file permissions.

    - Create your own filenames — Use Path.GetFileName() to generate filenames and
    directory names when you create files. This will avoid the overwriting of existing
    files, or any traps with reserved names and directory traversal attacks.

    - Limit the maximum request size and execution timeout for your application to
    prevent DOS attacks — Never trust any input from file uploads. Generate your own
    filenames and use indirect object references to retrieve these files.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 10


    # # Securing XML


    Extensible Markup Language (XML) has emerged as the standard way to transfer data
    and metadata between systems. XML is a rich standard, and its extensibility has
    led to various additions, including schemas and query languages. You may have
    already used it without knowing it. XML underpin Web services, .NET configuration
    files, and even IIS7 configuration. However, as you add XML support to your application,
    you are adding another vector for attack and potential vulnerabilities. Like any
    input, XML should be considered untrusted until you validate and sanitize it.


    In this chapter, you will learn about the following:


    +   - How to accept and validate XML

    - How to query XML safely

    - How to sign XML documents to ensure them against tampering

    - How to encrypt XML to prevent eavesdropping


    > NOTE This chapter will only concentrate on the security aspects of XML. For
    a more detailed exploration of XML and all its associated technologies, Professional
    XML by Bill Evjen, Kent Sharkey, Thiru Thangarathinam, Michael Kay, Alessandro
    Vernet, and Sam Ferguson (Indianapolis: Wrox, 2007) is highly recommended.


    # # VALIDATING XML


    Like any input, XML should be validated before trusting and using it. XML has
    two validation points:


    +   - Is it well-formed?

    - Is it valid?'
  merge: -1
  img_proc: true
- pgno: 253
  md: "# WelFormed XML\n\nAn XML document is said to be well-formed when it conforms\
    \ to the XML syntax specification, and contains no references to external resources\
    \ unless a document type definition (DTD) is specified.\n\nFollowing is an example:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<Books>\n  <Book>\n    <Title>Example\
    \ Title</Title>\n    <Author>John Smith</Author>\n    <Pages>500</Pages>\n  </Book>\n\
    \  <Book>\n    <Title>Another Title</Title>\n    <Author>John Doe</Author>\n \
    \   <Pages>250</Pages>\n  </Book>\n</Books>\n```\n\nThis XML document is well-formed.\
    \ However, this does not mean that a document is valid. The term \"well-formed\"\
    \ is borrowed from formal mathematical logic. An assertion is well-formed if it\
    \ meets grammatical rules, but does not take into account the truth of assertion.\n\
    \n# Valid XML\n\nAn XML document is considered valid if it is well-formed, meets\
    \ certain validity constraints, and matches a grammar describing the document's\
    \ content. The rules for specifying a document's grammar can be expressed in a\
    \ DTD or in an XML schema. These rules allow the document producer to specify\
    \ things as, \"A book must have a title.\" This is like a database administrator\
    \ setting certain fields to be unique or not null.\n\nFor example, an XML schema\
    \ for the previous Books XML code might look like this:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\
    \n      elementFormDefault=\"unqualified\"\n      targetNamespace=\"http://wrox.example/example\"\
    >\n  <xs:element name=\"Books\">\n    <xs:complexType>\n      <xs:sequence>\n\
    \        <xs:element maxOccurs=\"unbounded\" name=\"Book\">\n          <xs:complexType>\n\
    \            <xs:sequence>\n              <xs:element name=\"Title\"\n       \
    \         type=\"xs.string\" minOccurs=\"1\" maxOccurs=\"1\" />\n            \
    \  <xs:element name=\"Author\"\n                type=\"xs.string\" />\n      \
    \      </xs:sequence>\n          </xs:complexType>\n        </xs:element>\n  \
    \    </xs:sequence>\n    </xs:complexType>\n  </xs:element>\n</xs:schema>\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: "```\n<xs:element name=\"Pages\"\n      type=\"xs:unsignedShort\" minOccurs=\"\
    1\" maxOccurs=\"*\" />\n  </xs:sequence>\n  </xs:complexType>\n  <xs:element>\n\
    \  </xs:sequence>\n  </xs:complexType>\n</xs:element>\n</xs:schema>\n```\n\nThis\
    \ example schema specifies that a book must have a title and a number of pages.\
    \ There are no restrictions on the number of authors or the number of books in\
    \ a book collection. Without such a rule, you would have to manually write code\
    \ to validate the XML, according to the rules you require. Using XML schemas provides\
    \ a more flexible approach. The schemas can be shared with external customers\
    \ who can also use them to check that the documents they are sending are valid\
    \ (although, of course, you should never rely on them, and validate any XML input\
    \ yourself).\n\n# XML Parsers\n\nIn addition setting the syntax for XML, the World\
    \ Wide Web Consortium (W3C) describes some of the behavior of XML parsers. There\
    \ are two types of parsers:\n\n+   - NonvalidatingThis type of parser only ensures\
    \ that an XML document is well-formed.\n- ValidatingThis parser uses a definition\
    \ or schema to ensure that a well-formed XML document matches the rules specified.\n\
    \nAny XML parser that encounters malformed XML will report this to the application.\
    \ The .NET framework provides parsers via the XmlElement and XmlDocument classes.\
    \ The .NET framework will check if an XML document is well-formed when you load\
    \ it into the XmlDocument class. If the XML fails a well-formed, an exception\
    \ will be thrown.\n\nFollowing is an example:\n\n```\nXmlDocument xmlDocument\
    \ = new XmlDocument();\nxmlDocument.LoadXml(\"books\");\n```\n\nThis code snippet\
    \ will throw an XmlException with a message of \"Unexpected end of file has occurred.\
    \ The following elements are not closed: Line 1, position 8.\"\n\n# TRY OUT Validating\
    \ XML\n\nLet's go through the various steps of loading a simple XML file, checking\
    \ to see that it is well-formed, creating a schema for it, and validating against\
    \ it:\n\n+   1. Create a web application or site. Replace default.aspx > with\
    \ the following:\n\n```\n<@ Page Language=\"C#\" ValidationError=\"false\" %>\n\
    <%@ Import Namespace=\"System.Xml\" %>\n<!DOCTYPE htmlDocument\n\"-//W3C//DTD\
    \ HTML 1.0 Transitional//EN\">\n```"
  merge: -1
  img_proc: true
