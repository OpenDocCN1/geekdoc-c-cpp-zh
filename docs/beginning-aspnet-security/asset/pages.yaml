- pgno: 160
  md: '# Sharing Secrets with Asymmetric Encryption


    You may have noticed a drawback with symmetric encryption — if two parties are
    involved, both need to share the encryption key. This presents risks where one
    party may not securely store the key. Additionally, it isn''t possible to say
    which party encrypted the data. In addition, exchanging the keys in a secure manner
    is a problematic exercise. Asymmetric encryption was developed to eliminate the
    need to share keys by using two — one for encryption (known as the public key)
    and one for decrypting (known as the private key). As its name indicates, the
    public key does not have to be a secret, and can be given to anyone who wants
    to encrypt against it. Data encrypted against the public key can only be decrypted
    using the private key (which, like a symmetric key, is highly secret), as shown
    in Figure 6-2.


    Asymmetric algorithms are often used with digital signatures, a technology that
    allows the recipient of encrypted data to validate the data came from, and that
    it was not tampered with. asymmetric encryption is used to provide non-repudiation.
    An important concept in digital security, non-repudiation is the property that
    a particular transaction was performed by a person or entity in a way that cannot
    be denied. To achieve non-repudiation, digital signatures require proof of the
    integrity of the message through secure hashing and of the origin of the message,
    provided by the sender’s public key and knowledge of the private key.


    ![](img/742122f18de7bcb6f7bd43fe51fe45bd_160_0.png)


    FIGURE 6-2: Key use in symmetric encryption


    Digital signatures can be created with digital certificates. When you install
    software on your computer, The Windows operating system may tell you the publisher
    of the software package. This information comes from a digital signature embedded
    in the installer, and is created from a digital certificate issued to the publisher.
    When the installer is created, the publishing process embeds the public key from
    the digital certificate, along with some of the certificate properties (such as
    the name of the company or person the certificate was issued to). A checksum is
    also embedded so that the package can be validated to ensure that it has not been
    tampered with after it was signed.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# SUITABLE SCENARIOS FOR ASYMMETRIC ENCRYPTION


    One of the first mainstream uses for asymmetric encryption was Pretty Good Privacy
    (PGP) created by Philip Zimmermann in 1991. The use of an asymmetric algorithm
    that others could publish their public key, typically on a Web page or a key server.
    Other PGP users could retrieve the key and encrypt against it, knowing that only
    the owner of the private key could decrypt the data.


    Consider an e-commerce system where payments are handled by a separate payment
    system located and protected on an internal network, and not exposed to the Internet.
    The order system must pass the payment information securely before forgetting
    it. Using the same key on both systems presents a risk — if the order systems
    is compromised, all payment information is also compromised.


    Instead, in the example could use asymmetric encryption. When creating a payment
    message, the order system would encrypt using the payment system''s public key,
    and then place the request. Only the payment system can decrypt these messages
    with its private key. If the order system is compromised, the payment system messages
    are still safe.


    One thing to note is that asymmetric encryption is computationally heavier than
    symmetric encryption by a significant amount. This has important considerations
    for its use, and has given rise to a hybrid approach where an asymmetric encryption
    key is created and securely sent between systems using an asymmetric algorithm.
    This method is much faster than asymmetric encryption.


    This approach is used behind the scenes of SSL/TLS, the protocol behind secure
    HTTP. .NET asymmetric encryption implementation, the RSACryptoServiceProvider
    class, is limited in the amount of data it can encrypt. If you reach these limits
    (which are dependent on the size of the key), you should switch to this hybrid
    approach by using asymmetric encryption to exchange a symmetric key, which is
    then used to encrypt your data. As a rough guide, a 1,024-bit RSA key can encrypt
    245 bytes.


    Unlike symmetric encryption (which uses random data as its keys), the RSA algorithm
    uses large prime numbers as the starting point for its keys. Two large prime numbers,
    P and Q, are pushed through a set of mathematical formula to produce six additional
    parameters, which, along with the original primes, provide the private key. The
    two derived parameters, the modulus and exponent, are also the public key.


