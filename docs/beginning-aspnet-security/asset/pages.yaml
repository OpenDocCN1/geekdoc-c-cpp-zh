    The HTML source contains a few points of interest. When this page was created
    to write this chapter, it was called PostbackDemo.aspx. The Reaction parameter
    for the HTML form in the page points back to the page itself. You will also see
    that the page has four form fields that are not present in the ASP.NET server:
    __EVENTTARGET, __ARGUMENT, __EVENTVALIDATION and __VIEWSTATE. Some JavaScript
    has also been inserted that includes a doPostBack() function. Finally, the link
    button has been rendered as an a element with a client-side event that calls the
    inserted __doPostBack() function, passing in the name of the button.


    When you examine the __doPostBack() function, you will see that two of the hidden
    fields, __EVENTTARGET and __ARGUMENT, before calling the JavaScript submit method
    on the form, which causes the browser to submit, including the hidden fields.


    It is the combination of posting a page back to itself (PostBack) using JavaScript
    to set the source of the event (and any arguments) that ASP.NET to implement its
    event model. The life cycle of PostBack is as follows


    +   1. Your page loads for the first time (usually via a GET request). ASP.NET
    creates the Page object and the controls within it. The Page events are fired,
    and the HTML for the page is rendered and returned to the client. At this point,
    the Page object (and all that it) is released, and eventually, the memory used
    by it will be freed before the .NET garbage collector runs.


    +   2. In the client browser, the user will perform an action that creates a PostBack,
    such as clicking a link, a button, or choosing a selection on a list box. These
    actions are wired with client-side JavaScript events, which culminate in a call
    to __doPostBack(). The page and the form data is submitted to the server.'
