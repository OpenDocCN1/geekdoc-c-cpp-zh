    \ the behavior. Listing 11-7 shows how you might add the auditing configuration\
    \ to the behavior for the example service at the beginning of this chapter.\n\n\
    # LISTING 11-7: Configuring security auditing for a service\n\n```\n<behaviors>\n\
    \  <serviceBehavior name=\"WCF.EchoServiceBehavior\">\n    <serviceMetadata httpEnabled=\"\
    true\" />\n    <serviceSecurityAudit\n      auditLogLocation=\"Application\"\n\
    \      serviceAuthorizationAuditLevel=\"SuccessOrFailure\"\n      messageAuthenticationAuditLevel=\"\
    SuccessOrFailure\" />\n    ...\n  </serviceBehavior>\n</behaviors>\n```\n\nThis\
    \ will audit security events to the Application event log. You can view the event\
