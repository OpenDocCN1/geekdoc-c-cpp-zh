  md: '# Encrypting Data


    Finally, you need another certificate for the client software that will be used
    to sign the encrypted data that the server knows the origin of the message and
    that the message has not been changed or corrupted since it was signed. This needs
    one final foray makecert, this replacing myname with your own name, and replacing
    any spaces with underscores (for example "Barry Dorrans" will become "Barry_Dorrans")


    ```

    makecert -pe n -cn cn=typename -ss - my -er LocalMachine \

    - a shal sky exchange -ck 1.3.6.1.5.7.3.1 \

    -in Development Root Authority -is MY -ir LocalMachine \

    -sp Microsoft RSA Schannel Cryptographic Provider \

    -sy 12 "typename.cer"

    ```


    Now you have two certificates that one can use to encrypt and decrypt, and the
    other for signing and validating the message authentication.


    You may be confused as to why you are using two certificates, one to encrypt and
    one to sign. Remember that with certificates, and all asymmetric algorithms, you
    must keep the private key secret. When you are encrypting data for a server, which
    needs the server''s public key. However, when you sign the message, you are using
    your own certificate, the client certificate, and that requires the private key.
    By signing with a specific certificate held only by you, the server can be because
    only you hold that certificate. If you used the same key to encrypt and sign,
    this proof does not occur.


    Listing 6-2 shows a sample of code that wraps a piece of clear data into a CMS
    envelope, which uses a local certificate with a subject name Barry_Dorrans, and
    then encrypts it against a public key certificate loaded from a file, myserver.cer.
    The data is decrypted, the CMS envelope is recreated, and the signatures are created.
    A list of the certificate subject names is created, and, the final text is returned
    for further processing.


    # LISTING 6: Signing, Encrypting, Unencrypting, and Verifying Signatures


