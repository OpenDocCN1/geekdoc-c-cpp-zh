    true\" %>\n@ Import Namespace=\"System.IO\" %>\n@ Import Namespace=\"System.Net\"\
    \ %>\n@ Import Namespace=\"System.Security\" %>\n<script run=\"server\">\n\nprivate\
    \ const string WroxRssUrl =\n    @\"http://www.wrox.com/WileyC/feed/\nRSS_WROX_ALLNEW.xml\"\
