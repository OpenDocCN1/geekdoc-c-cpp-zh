- pgno: 309
  md: "```\nnamespace WCFSecurity\n{\n    public class CustomInspectorAttribute :\n\
    \        Attribute, IOperationBehavior\n    {\n        #region IOperationBehavior\
    \ Members\n        public void AddBindingParameters(\n            OperationDescription\
    \ operationDescription,\n            BindingParameterCollection bindingParameters)\n\
    \        {}\n\n        public void ApplyClientBehavior(\n            OperationDescription\
    \ operationDescription,\n            ClientOperation clientOperation)\n      \
    \  {}\n\n        public void ApplyDispatchBehavior(\n            OperationDescription\
    \ operationDescription,\n            DispatchOperation dispatchOperation)\n  \
    \      {\n            CustomParameterInspector inspector = \n            new CustomParameterInspector();\n\
    \            dispatchOperation.ParameterInspectors.Add(inspector);\n        }\n\
    \n        public void Validate(OperationDescription operationDescription)\n  \
    \      {\n        }\n        #endregion\n    }\n}\n```\n\nBecause you will be\
    \ applying this to a server, you must inject your behavior in the ApplyDispatchBehavior\
    \ method. Finally, you can apply the behavior to any method in your service contract\
    \ using the new attribute, as shown here:\n\n```\n[ServiceContract]\npublic interface\
    \ IEchoService\n{\n    [OperationContract]\n    [CustomInspectorAttribute]\n \
    \   string Echo(string message);\n}\n```\n\nThe code samples provided for this\
    \ chapter on this book's companion Web site (www.wrox.com ) include an implementation\
    \ of a Parameter Inspector you can examine."
