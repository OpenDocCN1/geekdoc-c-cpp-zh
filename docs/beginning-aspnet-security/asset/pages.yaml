- pgno: 216
  md: '# Writing Bad Code: Demonstrating SQL Injection


    This initial attempt at a login page is vulnerable to SQL injection. If you examine
    the code, you can see that it builds a SQL query by inserting the text from the
    username field and the password field. Using the example login, the SQL command
    will be the following:


    ```

    select * from logins username = ''example'' and password = ''wrox''

    ```


    This is perfectly valid SQL. But what happens when you try a username of O''Leary?
    You get an exception thrown, because of the apostrophe in the username, which
    blocks the query. If you find this, an attacker can submit crafted values to modify
    the meaning of the query. If you enter '' or 1=1-- the username and in the password
    field, the SQL command becomes the following:


    ```

    select * from logins username = '''' or 1=1-- and password = ''anything''

    ```


    --The sequence in SQL marks the beginning of a comment. Anything following it
    is ignored. This means the SQL query is executed as follows:


    ```

    select * from logins username = '''' or 1=1

    ```


    The inclusion of the or 1=1 clause changes the query further. This expression
    always evaluates to true, so a record will always be returned. Because the code
    in the login page simply checks for a non-null record, the login can be bypassed
    without a password because of SQL injection vulnerability.


    This vulnerability opens up other possibilities for an attacker. A blank username
    may not be the best approach because somewhere in the application the username
    may be checked to ensure that it is not null or empty value. Attackers could try
    a username which exists by entering example''-- the username. This makes the query
    as follows:


    ```

    select * from logins username = ''example''-- and password = ''''

    ```


    This query in turn reduces to the following:


    ```

    select * from logins username = ''example''

    ```


    If you try this, you will see that the login application will now respond as if
    a login has occurred. The SQL injection has removed the password check altogether.


    As you can see, the combination of an apostrophe to terminate the first equality
    operator and the comment delimiter can be used to return a result, potentially
    affecting the checks that happen after the query run.


    If you have followed the approaches discussed in Chapter 5 by enabling custom
    error pages, a wider problem exists, one that can allow an attacker to discover
    the layout of your database tables and then run commands against them.


    Before attempting to insert or delete data from your database tables, an attacker
    must know the table and column names, information not normally exposed to the
    outside world. So, instead of attempting to bypass the login page, the attacker
    attempts to cause an error, using the ''1=1-- as or her username. This turns your
    query into the following:


    ```

    select * from logins username = '''' having 1=1

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'If you try this attack using the vulnerability in the code, you will see a
    very detailed error page that displays the underlying problem — Column logins.username
    is invalid in the select list because it is not contained in either an aggregate
    function or the GROUP BY clause. As you can see, the error message displays a
    table name and the name of a column in that table. By refining the query again
    and again, each newly discovered column to a GROUP BY clause, an attacker could
    retrieve all the column names for the table. An attacker with the column structures
    he or she can start to discover the type of data of the columns. For example,
    the attacker could enter the following in the username field:


    ```

    union select sum(username) from logins

    ```


    This attack causes an error message to be displayed that Operand data type varchar
    is invalid for sum operator. From this error message, the attacker can deduce
    the username field is a varchar. Once an attacker has the column names and types,
    he or she can try to insert data into the underlying table. For example, the attacker
    could enter the following into the username field to create a new record in the
    logins:


    ```

    ; insert into logins values(''yourUsername'',''yourPassword'')--

    ```


    This is a simple example of how SQL injection can be used to attack a database.
    The semicolon in the SQL statement acts as a command separator, like a colon used
    in BASIC. Anything after the semicolon is treated as a new command. Now the query
    becomes two commands:


    ```

    select * from logins username = '''';

    insert into logins values(''yourUsername'',''yourPassword'')

    ```


    There are several additional attack vectors. By entering the following in the
    username field:


    ```

    union select @Version,''--

    ```


    You can see that the exact version of SQL Server is now displayed on the screen,
    with details about the operating system. As a final trick, entering the following
    into the username field:


    ```

    union select (select * from logins xml),'' from logins

    ```


    At first, this doesn''t appear to anything. But if you view the source of the
    HTML page, you will discover (toward the bottom) that the entire contents of the
    logins table have been embedded as XML. This would illustrate the importance of
    not only avoiding SQL injection, but of hashing passwords, as discussed in Chapter
    6.


    If you want further details and walkthroughs of advanced SQL injection attacks,
    Chris Anley of NGSoftware has a highly recommended whitepaper available from http://ngsoftware.com/papers/advanced_sql_injection.pdf.


    # THE VULNERABILITY


    The vulnerability arises because the SQL query is dynamically constructed via
    string concatenation. The way to fix it is to avoid string concatenation entirely
    and parameterize the query, or to use stored procedures.'
