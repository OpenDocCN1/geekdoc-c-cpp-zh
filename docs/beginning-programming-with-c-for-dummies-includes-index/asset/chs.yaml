  前四行是所有 C++ 源文件的模板。下一行是 `factorial.h` 包含文件，我将在本章进一步讨论。之后是第 11 章中出现的 `factorial()`\
  \ 函数。\n\n包含文件遵循不同的规则。例如，与 C++ 中的其他语句不同，`#include` 必须从第一列开始，结尾不需要分号。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 不要尝试编译 `factorial.cpp`，因为你还没有创建 `factorial.h`。\n\n### 创建 #include 文件\n\n下一步是创建一个包含文件。好的，什么是包含文件？\n\
  \n正如我在第 11 章中讨论的，原型声明通过提供参数的数量、类型以及返回值类型来描述要调用的函数。你调用的每个函数在调用之前的某处都有原型声明。\n\n你可以为要使用的每个函数手动列出原型声明，但幸运的是不需要。相反，C++\
  \ 允许创建函数的程序员创建一个包含该函数原型声明的包含文件。然后可以将该文件包含在调用这些函数的源文件中。\n\n\n\n\n\n与其这样做相反，`C++`\
  \ 包含了一个理解极少指令的预处理器。这些指令中的每条都以第 1 列的井号（`#`）开头，后紧跟一个命令。（预处理器命令同样在行尾结束，不需要分号。）\n\n\
  最常见的预处理器命令是 `#include \"filename.h\"`。该命令在 `#include` 所在处复制并粘贴 `filename.h` 的内容，创建一个所谓的中间源文件。然后，预处理器会将该中间源文件传递给\
  \ `C++` 编译器进行处理。这一过程在图 12-3 中以图表形式所示。\n\n**图 12-3：** 预处理器在 `#include` 命令所在处插入包含头头文件的内容，然后将结果传递给\
  \ `C++` 编译器。\n\n![617977-fg1203.eps](img/617977-fg1203_fmt.jpeg)\n\n#### 包含 #include\
  \ 文件\n\n`Code::Blocks` 向导让创建包含文件变得毫不轻松。只需执行以下步骤：\n\n1. 选择 `File⇒⇒New⇒File`。\n`Code::Blocks`\
  \ 像之前一样响应打开了图 12-1 所示的窗口。这次你正在创建一个包含文件。\n2. 选择 `Include File` 然后点击 `Go`。\n3. 在下一个提示你即将进入\
  \ `Include File Wizard` 的窗口中，点击 `Next`。\n4. 点击 `Filename with Full Path` 提示旁边的 `...`。出现一个\
  \ `File Open` 对话框。\n5. 输入 `factorial.h` 作为包含文件的名称并点击 `Save`。\n6. 你希望此文件被添加到你创建的所有可执行文件中，因此在构建目标中选择\
  \ `All`。\n\n完成后，对话框看起来应该像图 12-4 所示。\n\n**图 12-4：** `C/C++` 头文件对话框允许你输入新包含文件模块的名称\
  \ `factorial.h`。\n\n![617977-fg1204.eps](img/617977-fg1204_fmt.jpeg)\n\n7. 点击 `Finish`\
  \ 创建一个空的包含文件，其内容如下：\n\n```cpp\n#ifndef FACTORIAL_H_INCLUDED\n\n#define FACTORIAL_H_INCLUDED\n\
  \n#endif // FACTORIAL_H_INCLUDED\n```\n\n8. 通过如下方式添加 `factorial()` 函数的原型来编辑该包含文件：\n\
