  \ 中包含 `factorial.h` 呢？毕竟，`factorial()` 不需要它自身的原型。你这样做是为了一种错误检查的形式。当编译 `factorial.cpp`\
  \ 时，如果 `factorial.h` 中的原型声明与函数定义不匹配，`C++` 将生成错误信息。这确保了其他源代码模块使用的原型声明与函数定义相匹配。\n\n\
