  \ 包含了对 `Student` 的引用，而 `Student` 包含了对 `Teacher` 的引用。\n\n如果没有对 `Student` 的前向声明，`Teacher`\
  \ 内部对 `Student *pList[100]` 的声明将产生编译器错误，因为编译器还不知道 `Student` 是什么。调换定义的顺序，`Student`\
  \ 内部的 `Teacher *pTeacher` 声明将产生编译器错误，因为 `Teacher` 尚未被定义。\n\n前向声明通过告知编译器耐心等待——这个新类的定义很快就会到来解决了这个问题。\n\
  \n一个类的成员可以被声明为另一个类的友元：\n\n```cpp\nclass Student;\n\nclass Teacher\n{\n  // ...其他成员...\n\
  \  public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\nclass\
  \ Student\n{\n  friend void Teacher::assignGrade(Student*, int, double);\n  // ...其他成员...\n\
  };\n```\n\n整个类可以被声明为另一个类的友元。这样做的效果使得该类的每个成员函数都成为友元。例如：\n\n```cpp\nclass Student;\n\
  \nclass Teacher\n{\n  protected:\n    int noStudents;\n    Student* pList[128];\n\
  \n  public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\n\
  class Student\n{\n  friend class Teacher;\n  // ...其他成员...\n};\n```\n\n现在 `Teacher`\
  \ 的每个成员都可以访问 `Student` 的受保护成员（但反之则不然）。将一个类声明为另一个类的友元会将这些类不可分割地绑定在一起。\n\n# 第 25 章\n\
  \n## 让对象有一个良好的开始\n\n### 本章内容\n- 创建一个构造函数\n- 检查构造函数调用方式的限制\n- 复习一个示例构造函数\n- 构造数据成员\n\
  - 引入“非构造函数”——析构函数\n\n通常情况下，对象在创建时会被初始化，如下所示：\n\n```cpp\ndouble PI = 3.14159;\n```\n\
  \n对于类对象也是如此：\n\n```cpp\nclass Student\n{\n  public:\n    int nHours;\n    double\
  \ dGrade;\n};\n\nStudent s = {0, 0.0};\n```\n\n然而，如果数据元素被声明为受保护，且创建对象的函数不是该类的友元或成员（在大多数情况下它不是），那么就不再可能这样做。\n\
  \n需要其他机制在对象创建时初始化它们，这就是构造函数的用场。\n\n### 构造函数\n\n初始化带有受保护成员的对象的一种方法是创建一个 `init()`\
  \ 成员函数，应用程序可以在对象创建时调用它。这个 `init()` 函数会将对象初始化到某个合法的起始点。事实上，这正是我在第 24 章中所做的。\n\n这种方法可行，但它并不完全符合面向对象编程的“微波炉”规则，因为它类似于建造了一个要求你在对其进行任何操作之前必须先按下\
  \ RESET 按钮的微波炉。这就像是制造商在说明书中写了一份巨大的免责声明：“在首先按下 RESET 按钮之前，不要启动任何命令序列。这样做可能会导致微波炉爆炸并杀死周围所有人，或者更糟。”（还有比这更糟的吗吗？）\n\
  \n我不是律师，但即使是我知道，如果你在说明书中加入这样的免责声明，当你因为有人被微波炉爆炸的碎片割伤而上法庭时，这并救不了你的命。\n\n## 构造函数的限制\n\
  \n构造函数只能由 C++ 自动调用。你不能像调用普通成员函数一样调用构造函数。也就是说，你不能这样做：\n\n```cpp\nvoid fn()\n{\n \
  \ Student s;\n  // ...do stuff...\n  // 现在将 s 重置为初始状态\n  s.Student(); // 这不起作用\n\
  }\n```\n\n构造函数不是普通的函数。此外，构造函数没有返回类型，甚至没有 `void`。默认构造函数也没有参数。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 下一章将介绍如何声明和使用带参数的构造函数。\n\n最后，构造函数必须声明为公共，否则你只能在成员函数内部创建对象。\n\n构造函数可以调用其他函数。因此，初始化函数被称为构造函数，它与类名同名。\n\
  \n配备构造函数后，`Student` 类如下所示：\n\n```cpp\nclass Student\n{\n  protected:\n    int noStudents;\n\
  \    double dGrade;\n\n  public:\n    Student()\n    {\n      nSemesterHours = 0;\n\
  \      dGrade = 0.0;\n    }\n    // ...其他成员函数...\n};\n\nvoid fn()\n{\n  Student\
  \ s; // 创建对象并调用\n  // 构造函数\n}\n```\n\n在声明 `s` 的点，C++ 嵌入了对 `Student()` 的调用。\n\n注意每个对象调用一次构造函数。因此，下面的声明调用了五次构造函数：\n\
  \n```cpp\nvoid fn()\n{\n  Student s[5];\n}\n```\n\n\n\n\n```cpp\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n\
  {\nprotected:\n    double dGrade; // 学生的 GPA\n    int nSemesterHours;\n\npublic:\n\
  \    // 构造函数 - 将学生初始化为合法状态\n    Student()\n    {\n        cout << \"Constructing\
  \ a Student object\" << endl;\n        dGrade = 0.0;\n        nSemesterHours = 0;\n\
  \    }\n\n    // getGrade() - 返回当前成绩\n    double getGrade()\n    {\n        return\
  \ dGrade;\n    }\n\n    // getHours() - 获取用于毕业的学分\n    int getHours()\n    {\n \
  \       return nSemesterHours;\n    }\n\n    // addGrade - 将成绩加入 GPA 和总学分中\n   \
  \ double addGrade(double dNewGrade, int nHours)\n    {\n        double dWtdHrs =\
  \ dGrade * nSemesterHours;\n        dWtdHrs += dNewGrade * nHours;\n        nSemesterHours\
  \ += nHours;\n        dGrade = dWtdHrs / nSemesterHours;\n        return dGrade;\n\
  \    }\n};\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 创建一个学生并初始化\n\
  \    cout << \"Creating the Student s\" << endl;\n    Student s;\n    // 添加三门课程的成绩\n\
  \    s.addGrade(3.0, 3); // 一个 B\n    s.addGrade(4.0, 3); // 一个 A\n    s.addGrade(2.0,\
  \ 3); // 一个 C（平均分应该是 B）\n    // 现在打印结果\n    cout << \"Total # hours = \" << s.getHours()\n\
  \         << \", GPA = \" << s.getGrade()\n         << endl;\n\n    // 创建一个 Student\
  \ 数组\n    cout << \"Create an array of 5 Students\" << endl;\n    Student sArray[5];\n\
  \n    // 现在在堆上分配一个\n    cout << \"Allocating a Student from the heap\" << endl;\n\
  \    Student *pS = new Student;\n\n    // 在程序终止前等待用户就绪\n    // 以允许用户查看程序结果\n   \
  \ system(\"PAUSE\");\n    return 0;\n}\n```\n\n该程序的输出如下：\n\n```\nCreating the Student\
  \ s\nConstructing a Student object\nTotal # hours = 9, GPA = 3\nCreate an array\
  \ of 5 Students\nConstructing a Student object\nConstructing a Student object\n\
  Constructing a Student object\nConstructing a Student object\nConstructing a Student\
  \ object\nAllocating a Student from the heap\nConstructing a Student object\nPress\
  \ any key to continue . . .\n```\n\n`Student` 类配备了一个构造函数，该函数不仅将学期学分和平均点数初始化为零，还向控制台输出一条消息，宣布正在创建一个\
  \ `Student` 对象。\n\n`main()` 程序随后以各种方式创建了 `Student` 对象：\n\n- 第一个声明创建了一个单个 `Student`\
  \ 对象 `s`，导致 C++ 调用构造函数。\n- 第二个声明创建了一个包含五个 `Student` 对象的数组。C++ 调用了五次构造函数，数组中的每个对象调用一次。\n\
  - 程序在堆上分配了一个 `Student` 对象。C++ 再次调用构造函数来初始化该对象。\n\n### 构造数据成员\n\n类的数据成员与对象本身同时创建。考虑以下简单的\
  \ `TutorPair` 类，它包含一个 `Student` 和一个 `Teacher`：\n\n```cpp\nclass TutorPair\n{\nprotected:\n\
  \    Student s;\n    Teacher t;\n    int nNumberOfMeetings;\n\npublic:\n    TutorPair()\n\
  \    {\n        nNumberOfMeetings = 0;\n    }\n    // ...其他内容...\n};\n```\n\n初始化成员\
  \ `Student` 或成员 `Teacher` 不是 `TutorPair` 类的职责；这些对象应该由它们各自类中的构造函数进行初始化。`TutorPair`\
  \ 的构造函数只负责初始化类的非类成员。\n\n因此，当创建一个 `TutorPair` 时，C++ 会执行以下操作（按所示顺序）：\n\n1. 它调用 `Student`\
  \ 对象 `s` 的构造函数。\n2. 它调用 `Teacher` 对象 `t` 的构造函数。\n3. 它进入 `TutorPair` 自身的构造函数。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 数据成员的构造函数按照它们在类中出现的顺序被调用的。\n\n\
  ![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `TutorPairConstructor` 程序演示了：\n\n```cpp\n\
  //\n// TutorPairConstructor - 此程序演示了\n// 数据成员是如何自动构造的\n//\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n{\nprotected:\n\
  \    double dGrade; // 学生的 GPA\n    int nSemesterHours;\n\npublic:\n    // 构造函数\
  \ - 将学生初始化为合法状态\n    Student()\n    {\n        cout << \"Constructing a Student\
  \ object\" << endl;\n        dGrade = 0.0;\n        nSemesterHours = 0;\n    }\n\
  };\n\nclass Teacher\n{\npublic:\n    // 构造函数 - 将学生初始化为合法状态\n    Teacher()\n    {\n\
  \        cout << \"Constructing a Teacher object\" << endl;\n    }\n};\n\nclass\
  \ TutorPair\n{\nprotected:\n    Student s;\n    Teacher t;\n    int nNumberOfMeetings;\n\
  \npublic:\n    TutorPair()\n    {\n        cout << \"TutorPair members\" << endl;\n\
  \        nNumberOfMeetings = 0;\n    }\n};\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 创建 TutorPair 并初始化\n    cout << \"Creating the TutorPair\"\
  \ << endl;\n    TutorPair tp;\n    // 在程序终止前等待用户就绪\n    // 以允许用户查看程序结果\n    system(\"\
  PAUSE\");\n    return 0;\n}\n```\n\n`main()` 程序输出了一条消息，然后创建了一个 `TutorPair` 对象 `tp`。这导致\
  \ `TutorPair` 构造函数输出了最后一行：\n\n```\nCreating the TutorPair\nTutorPair members\n```\n\
  \n### 析构函数\n\n正如对象被创建一样，它们也会被销毁（我想有这种说法）。如果一个类可以有一个构造函数来设置内容，它也应该有一个特殊的成员函数来拆解对象并释放构造函数可能使用的资源。这个函数被称为析构函数。\n\
  \n析构函数的名称前面有一个波浪号（`~`）。与构造函数一样，析构函数没有返回类型（即使是 `void`），并且不能像普通函数那样调用。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 技术上，你可以显式调用析构函数：`s.~Student()`。然而，这种情况很少，只有在高级编程技术中需要，例如在预定的内存地址上分配对象。\n\n![tip.eps](img/tip.jpeg)\
  \ 在逻辑学中，波浪号有时表示“非”，所以析构函数就是“非构造函数”。懂了吗？很有趣。\n\nC++ 在以下三种情况下自动调用析构函数：\n\n1. 局部对象离开作用域时被调用析构函数。\n\
  2. 在堆上分配的对象在传递给 `delete` 时被调用析构函数。\n3. 全局对象在程序终止时被调用析构函数。\n\n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `StudentDestructor` 程序展示了一个在构造函数在堆上分配内存的 `Student` 类。因此，该类需要一个析构函数将该内存返回堆。\n\
  \n该程序在函数 `fn()` 中创建了几个对象，然后在函数返回时这些对象离开作用域并被析构。函数返回一个由 `fn()` 在堆上分配的对象的指针。该对象在 `main()`\
  \ 中被返回堆。\n\n```cpp\n//\n// StudentDestructor - 此程序演示了\n// 使用析构函数返回构造函数分配的资源\n//\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Student\n{\nprotected:\n    double* pdGrades;\n    int* pnHours;\n\npublic:\n\
  \    Student()\n    {\n        cout << \"Constructing a Student object\" << endl;\n\
  \        pdGrades = new double[3];\n        pnHours = new int[3];\n    }\n\n   \
  \ ~Student()\n    {\n        cout << \"Destroying a Student object\" << endl;\n\
  \        delete[] pdGrades;\n        delete[] pnHours;\n    }\n};\n\nStudent* fn()\n\
  {\n    Student s1;\n    Student s2;\n    Student* s3 = new Student;\n    return\
  \ s3;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Student* pS = fn();\n\
  \    delete pS;\n    return 0;\n}\n```\n\n输出如下：\n\n```\nConstructing a Student object\n\
  Constructing a Student object\nConstructing a Student object\nDestroying a Student\
  \ object\nDestroying a Student object\nDestroying a Student object\n```\n\n\n\n\n\
  \n```cpp\n// 构造函数 - 将学生初始化为合法状态\n\nStudent()\n{\n  cout << “Constructing a Student\
  \ object” << endl;\n  pdGrades = new double[128];\n  pnHours = new int[128];\n}\n\
  \n~Student()\n{\n  cout << “Destructing a Student object” << endl;\n  delete[] pdGrades;\n\
  \  pdGrades = 0;\n  delete[] pnHours;\n  pnHours = 0;\n}\n\n};\n\nStudent* fn()\n\
  {\n  cout << “Entering fn()” << endl;\n  // 创建一个学生并对其进行初始化\n  cout << “Creating\
  \ the Student s” << endl;\n  Student s;\n  // 创建一个 Student 数组\n  cout << “Create\
  \ an array of 5 Students” << endl;\n  Student sArray[5];\n  // 现在在堆上分配一个\n  cout\
  \ << “Allocating a Student from the heap” << endl;\n  Student *pS = new Student;\n\
  \  cout << “Returning from fn()” << endl;\n  return pS;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n  // 现在在堆上分配一个\n  Student *pS = fn();\n  // 删除 fn() 返回的指针\n\
  \  cout << “Deleting the pointer returned by fn()” << endl;\n  delete pS;\n  pS\
  \ = 0;\n  // 在终止程序前等待用户准备就绪\n  // 以允许用户查看程序结果\n  system(“PAUSE”);\n  return 0;\n\
  }\n```\n\n程序的输出如下：\n\n```\nEntering fn()\nCreating the Student s\nConstructing a\
  \ Student object\nCreate an array of 5 Students\nConstructing a Student object\n\
  Constructing a Student object\nConstructing a Student object\nConstructing a Student\
  \ object\nConstructing a Student object\nAllocating a Student from the heap\nConstructing\
  \ a Student object\nReturning from fn()\nDestructing a Student object\nDestructing\
  \ a Student object\nDestructing a Student object\nDestructing a Student object\n\
  Destructing a Student object\nDestructing a Student object\nDeleting the pointer\
  \ returned by fn()\nDestructing a Student object\nPress any key to continue . .\
  \ .\n```\n\n第一条消息来自 `fn()` 本身，它显示了一个启动幅让我们知道控制权已进入该函数。`fn()` 函数随后创建了一个对象 `s`，这导致构造函数输出了一条消息。接着它创建了一个包含五个\
  \ `Student` 对象的数组，导致 `Student` 构造函数又输出了五条消息。最后 `fn()` 使用 `new` 关键字在堆上又分配了一个 `Student`\
  \ 对象。\n\n`fn()` 在返回之前最后做的一件事是输出退出消息。C++ 会自动调用析构函数六次：五次针对数组元素，一次针对函数开头创建的 `s` 对象。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 你无法从输出中看出，但对象的析构顺序与它们的构造顺序是相反的。\n\n在 `main()` 删除由\
  \ `fn()` 返回的指针之前，在堆上分配对象的析构函数不会被调用。\n\n![remember.eps](img/remember_fmt.jpeg) 当指向该对象的指针超出作用范围时，在堆上分配的内存块不会超出作用范围。确保使用\
  \ `delete` 命令将对象返回堆中是程序员的责任。\n\n![remember.eps](img/remember_fmt.jpeg) 使用 `delete`\
  \ 返回非数组指针。使用 `delete[]` 返回数组。\n\n### 析构数据成员\n\n数据成员也会被自动析构。析构发生的顺序与构造顺序相反：首先调用析构函数的体体，然后按照数据成员构造的相反顺序调用每个数据成员的析构函数。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 为了演示这一点，我在 `TutorPairConstructor` 程序中添加了一个析构函数。整个列表较长，不便包含在这里，但它包含在附带的\
  \ CD-ROM 中，文件名为 `TutorPairDestructor`。我在这里仅包含了 `TutorPair` 类：\n\n```cpp\nclass TutorPair\n\
  {\nprotected:\n  Student s;\n  Teacher t;\n  int nNumberOfMeetings;\npublic:\n \
  \ TutorPair()\n  {\n    cout << “Constructing the TutorPair members” << endl;\n\
  \    nNumberOfMeetings = 0;\n  }\n  ~TutorPair()\n  {\n    cout << “Destructing\
  \ the TutorPair object” << endl;\n  }\n};\n\nvoid fn()\n{\n  // 创建一个 TutorPair 并对其进行初始化\n\
  \  cout << “Creating the TutorPair tp” << endl;\n  TutorPair tp;\n  cout << “Returning\
  \ from fn()” << endl;\n}\n```\n\n该程序的输出如下：\n\n```\nCreating the TutorPair tp\nConstructing\
  \ a Student object\nConstructing a Teacher object\nConstructing the TutorPair members\n\
  Returning from fn()\nDestructing the TutorPair object\nDestructing a Teacher object\n\
  Destructing a Student object\nPress any key to continue . . .\n```\n\n此程序在 `fn()`\
  \ 函数内部创建了 `TutorPair` 对象。构造函数的赋值与 `TutorPairConstructor` 程序相同。`TutorPair` 析构函数的消息在控制权返回\
  \ `main` 时出现，它们出现的顺序与构造函数消息的顺序完全相反，首先来自 `~TutorPair`，然后是 `~Teacher`，最后是 `~Student`。\n\
  \n### 静态成员\n\n一种值得单独说明的数据成员类型被称为类成员或静态成员，它使用 `static` 关键字标记：\n\n```cpp\nclass Student\n\
  {\nprotected:\n  static int nStudents;\n  int SemesterHours;\n  double dGrade;\n\
  public:\n  Student()\n  {\n    nSemesterHours = 0;\n    dGrade = 0.0;\n    // 统计有多少学生\n\
  \    nStudents++;\n  }\n  ~Student()\n  {\n    nStudents--;\n  }\n};\n\n// 为静态成员分配空间（当程序启动时）\n\
  // 构造函数在这里初始化它\nint Student::nStudents = 0;\n```\n\n静态成员是类的属性而不是每个对象的属性。在这个示例中，一个变量\
  \ `nStudents` 被所有 `Student` 对象共享：这种\n\n静态成员在程序启动时初始化。你可以在 `Student` 构造函数中操作它们，并在析构函数中递减它们。\n\
  \n## 第 26 章：构造参数\n\n### 本章内容\n- 创建并调用带参数的构造函数\n- 重载构造函数\n- 带参数构造数据成员\n- 展望 2009\
  \ 标准的新构造格式\n\n第 25 章中的 `Student` 类非常简单——简单得不合理。毕竟，学生有姓名、ID 以及平均绩分和各种数据。我在第 25 章中选择\
  \ GPA 作为建模的数据，因为我知道不需要别人告诉我如何初始化它——我只需将其清零即可。但我不能直接清零姓名和 ID 字段；没有名字且 ID 为空可能不是一个有效的学生。有时我需要向构造函数传递参数，告诉它如何初始化不可预测的字段。\n\
  \n### 带参数的构造函数\n\nC++ 允许程序如所示定义带参数的构造函数：\n\n```cpp\nclass Student\n{\npublic:\n\
  \  Student(const char* pszName, int nNewID)\n  {\n    int nLength = strlen(pszNewName)\
  \ + 1;\n    pszName = new char[nLength];\n    strcpy(pszName, pszNewName);\n   \
  \ nID = nNewID;\n  }\n  ~Student()\n  {\n    delete[] pszName;\n    pszName = 0;\n\
  \  }\n\nprotected:\n  char* pszName;\n  int nID;\n};\n```\n\n这里构造函数的参数是一个指向 ASCII\
  \ 字符串的指针，包含了新学生的姓名和学生 ID。构造函数首先为学生的姓名分配空间。然后将新姓名复制到 `pszName` 数据成员中。最后，复制学生 ID。\n\
  \n![technicalstuff.eps](img/technicalstuff_jpeg)\n\n\n\n\n记住，你不能像调用函数那样调用构造函数，因此你必须在声明对象时，以某种方式将参数与构造函数关联起来。下面的代码段展示了如何实现：\n\
  \n```cpp\nvoid fn()\n{\n    // 正常情况下将参数放在对象旁边\n    Student s1(“Stephen Davis”, 1234);\n\
  \    // 或者在堆上分配对象时，将参数放在类名旁边\n    Student* pS2 = new Student(“Kinsey Davis”, 5678);\n\
  }\n```\n\n参数在正常情况下出现在对象旁边，在从堆上分配对象时出现在类名旁边。\n\n### 来看示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面这个 `NamedStudent` 程序使用了一个与代码段中所示相似的构造函数来创建一个 `Student` 对象，并显示我的——我的意思是，是他的——名字：\n\
  \n```cpp\n//\n// NamedStudent -此程序演示了\n// 带参数的构造函数的用法\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing namespace std;\n\n\
  class Student\n{\nprotected:\n    char* pszName;\n    int nID;\n    double dGrade;\n\
  \    int nSemesterHours;\n\npublic:\n    Student(const char* pszNewName, int nNewID)\n\
  \    {\n        cout << “Constructing “ << pszNewName << endl;\n        int nLength\
  \ = strlen(pszNewName) + 1;\n        pszName = new char[nLength];\n        strcpy(pszName,\
  \ pszNewName);\n        nID = nNewID;\n        dGrade = 0.0;\n        nSemesterHours\
  \ = 0;\n    }\n\n    ~Student()\n    {\n        cout << “Destructing “ << pszName\
  \ << endl;\n        delete[] pszName;\n        pszName = 0;\n    }\n\n    // getName()\
  \ - 返回学生的名字\n    const char* getName()\n    {\n        return pszName;\n    }\n\n\
  \    // getID() - 获取学生的 ID\n    int getID()\n    {\n        return nID;\n    }\n\
  \n    double getGrade()\n    {\n        return dGrade;\n    }\n\n    int getHours()\n\
  \    {\n        return nSemesterHours;\n    }\n\n    // addGrade - 将分数加到 GPA 和总小时数\n\
  \    double addGrade(double dNewGrade, int nHours)\n    {\n        double dWtdHrs\
  \ = dGrade * nSemesterHours;\n        dWtdHrs += dNewGrade * nHours;\n        nSemesterHours\
  \ += nHours;\n        dGrade = dWtdHrs / nSemesterHours;\n        return dGrade;\n\
  \    }\n};\n\nStudent* fn()\n{\n    // 创建一个学生并初始化\n    cout << “Constructing a local\
  \ student in fn()” <<endl;\n    Student student(“Stephen Davis”, 1234);\n    //\
  \ 显示学生的名字\n    cout << “The student’s name is “\n    << student.getName() << endl;\n\
  \    // 现在在堆上分配一个\n    cout << “Allocating a Student from the heap” << endl;\n \
  \   Student *pS = new Student(“Kinsey Davis”, 5678);\n    // 显示这个学生的名字\n    cout\
  \ << “The second student’s name is “\n    << pS->getName() << endl;\n    cout <<\
  \ “Returning from fn()” << endl;\n    return pS;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 调用创建学生对象的函数\n    cout << “Calling fn()” << endl;\n\
  \    Student* pS = fn();\n    cout << “Back in main()” << endl;\n    // 删除由 fn()\
  \ 返回的对象\n    delete pS;\n    pS = 0;\n    // 等到用户准备好后再终止程序\n    // 以允许用户看到程序结果\n\
  \    system(“PAUSE”);\n    return 0;\n}\n```\n\n`main()` 程序首先输出一条消息，然后调用函数 `fn()`。该函数创建了一个名字不太罕见的“Stephen\
  \ Davis”且 ID 为 `1234` 的学生。随后，该函数向对象请求其名字，以证明该名字已准确地记录在对象中。函数继续创建另一个 `Student` 对象（这次是在堆上创建），并同样要求它显示自己的名字。\n\
  \n`fn()` 函数随后将控制权返回给 `main()`；这导致学生对象超出作用范围，从而触发 C++ 调用析构函数。`main()` 使用 `delete`\
  \ 关键字将 `fn()` 返回的内存恢复到堆。这会触发该对象的析构函数。\n\n`Student` 类的构造函数接受一个指向 ASCIIZ 字符串的指针和一个\
  \ `int` 学生 ID。构造函数从堆上分配一个新的字符数组，然后将传递的字符串拷贝到该数组中。接着它拷贝学生 ID 的值。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 如果你不记得什么是 ASCIIZ 字符串或 `strlen()` 的作用，请参考第 16 章。\n\n`Student` 类的析构函数通过将 `pszName`\
  \ 中的地址传递给 `delete[]`，将构造函数分配的内存恢复到堆。\n\n![remember.eps](img/remember_fmt.jpeg) 恢复数组时使用\
  \ `delete[]`，恢复单个对象使用 `delete`。\n\n`getName()` 和 `getID()` 成员函数是名字和 ID 的访问函数。将 `getName()`\
  \ 的返回类型声明为 `const char*`（指向常量字符指针）而不是简单的 `char*`，意味着调用者无法通过 `getName()` 返回的地址更改名字。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 如果你不记得 `const char*` 和 `char * const` 区别（或者完全不知道我在说什么），请参考第\
  \ 18 章。\n\n此程序的输出如下：\n\n```\nCalling fn()\nConstructing a local student in fn()\n\
  Constructing Stephen Davis\nThe student’s name is Stephen Davis\nAllocating a Student\
  \ from the heap\nConstructing Kinsey Davis\nThe second student’s name is Kinsey\
  \ Davis\nReturning from fn()\nDestructing Stephen Davis\nBack in main()\nDestructing\
  \ Kinsey Davis\nPress any key to continue . . .\n```\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 我以前说过（而你可能忽略了），但这次我真的必须强调：你必须调用构造函数。\n\n你可以拥有多个构造函数，只要它们通过参数数量区分开来。这被称为构造函数重载。\n\
  \n重载函数意味着定义多个名称相同但参数不同的函数。关于函数重载的讨论请参考第 12 章。\n\n但如果你需要一个默认构造函数怎么办？\n\n你可以定义一个没有参数的构造函数。这就是默认构造函数。\n\
  \n重载构造函数意味着定义多个具有不同类型参数的构造函数。\n\n\n\n从 `Student` 类开始，你可以看到 `Student` 内部第一个构造函数接受一个名称、一个学生\
  \ ID 以及以初始平均学分（`GPA`）和学期学时形式存在的转学分。第二个构造函数只接受名称和 ID；此构造函数为新学生设计，因为它会将 `GPA` 和学分初始化为零。目前还不清楚第三个构造函数的用途是什么——这个默认构造函数将所有内容初始化为零。\n\
  \n`main()` 函数使用第二个构造函数创建了一个名为“Stephen Davis”的新学生；然后它使用第二个构造函数创建了一个名为“Kinsey Davis”的转学学生。程序为两者都添加了三个小时的学分（只是为了说明这仍然有效），并显示了生成的\
  \ `GPA`。\n\n该程序的输出如下：\n\n```\nConstructing Stephen Davis as a new student.\nConstructing\
  \ Kinsey Davis as a transfer student.\nStudent Stephen Davis has a grade of 3\n\
  Student Kinsey Davis has a grade of 3.4\nPress any key to continue . . .\n```\n\n\
  注意前两个 `Student` 构造函数是多么的相似。这并不罕见。在这种情况下，你可以创建一个两个构造函数都会调用的 `init()` 函数（为了起，示例中只显示了构造函数）：\n\
  \n```cpp\nclass Student\n{\nprotected:\n    void init(const char* pszNewName, int\
  \ nNewID, double dXferGrade, int nXferHours)\n    {\n        cout << “Constructing\
  \ “ << pszNewName << “ as a transfer student.” << endl;\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \        nID = nNewID;\n        dGrade = dXferGrade;\n        nSemesterHours = nXferHours;\n\
  \    }\npublic:\n    Student(const char* pszNewName, int nNewID, double dXferGrade,\
  \ int nXferHours)\n    {\n        init(pszNewName, nNewID, dXferGrade, nXferHours);\n\
  \    }\n    Student(const char* pszNewName, int nNewID)\n    {\n        init(pszNewName,\
  \ nNewID, 0.0, 0);\n    }\n    // ...class continues as before...\n};\n```\n\n通常情况下，`init()`\
  \ 函数的形式看起来像最复杂的那个构造函数。所有简单的构造函数都会调用 `init()`，并为某些参数传递默认值，例如为新学生的转学成绩和学分传递 0。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 你也可以如下所示为构造函数（或任何函数）设置默认参数：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student(const char* pszNewName, int nNewID,\
  \ double dXferGrade = 0.0, int nXferHours = 0);\n    // ...and so it goes...\n};\n\
  ```\n\n如果在声明中没有提供参数，C++ 将提供默认参数。然而，默认参数可能会产生奇怪的错误信息，并且超出了本书的讨论范围。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 你也可以从 C++ 2009 标准开始，从一个构造函数调用另一个构造函数。然而，截至本书写作，我不知道哪个编译器支持这一特性。\n\n### 默认构造函数\n\
  \n对于 C++ 而言，每个类都必须有一个默认构造函数；否则你无法创建对象。如果你不提供构造函数，C++ 会提供一个隐式定义的默认构造函数。如果你的类已经有了构造函数，你就必须定义它。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 结果是：\n\n```cpp\nclass Student\n\
  {\npublic:\n    Student(const char* pszNewName, int nNewID);\n    // ...\n};\n```\n\
  \n通常，`init()` 函数的形式看起来像最复杂的那个构造函数。所有的构造函数都调用 `init()` 具有构造函数的...\n\n### 构造数据成员\n\
  \n在之前的示例中，所有数据成员都是简单类型，如 `int` 和 `double`。对于这些简单类型，在构造函数内部赋值就足够了。但如果类包含用户定义类的数据成员呢？\n\
  \n```cpp\nclass StudentID\n{\nprotected:\n    static int nBaseValue;\n    int nValue;\n\
  public:\n    StudentID()\n    {\n        nValue = nBaseValue++;\n    }\n    int\
  \ getID()\n    {\n        return nValue;\n    }\n};\n```\n\n`StudentID` 类设计用于顺序分配\
  \ ID。该类在静态变量 `StudentID::nBaseValue` 中保留“下一个值”。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 静态数据成员（也称为类成员）被所有对象共享。\n\n每当创建一个 `StudentID` 时，构造函数会将 `nBaseValue` 的“下一个值”分配给\
  \ `nValue`，然后增加 `nBaseValue`，为下一次构造构造做准备。\n\n```cpp\nint StudentID::nBaseValue =\
  \ 1000;\n\nclass Student\n{\nprotected:\n    char* pszName;\n    StudentID sID;\n\
  public:\n    Student(const char* pszNewName)\n    {\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \    }\n    ~Student()\n    {\n        delete[] pszName;\n    }\n    const char*\
  \ getName()\n    {\n        return pszName;\n    }\n    int getID()\n    {\n   \
  \     return sID.getID();\n    }\n};\n```\n\n`Student` 类已更新，`sID` 字段现在的类型是 `StudentID`。构造函数现在接受学生名称，但依赖\
  \ `StudentID` 在每次创建新的 `Student` 对象时分配顺序 ID。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 在传递控制到 `Student` 构造函数体之前，每个数据成员的构造函数（包括 `StudentID`）都会调用。\n\n`Student` 构造函数需要做的只是复制学生的名称——`sID`\
  \ 字段会自动处理。\n\n### 使用不同的构造函数初始化数据成员\n\n现在老板来了并想要程序增加功能。她想更新程序，使其能够分配新的学生 ID，而不是总是接受\
  \ `StudentID` 类传递的值。\n\n因此，我做了如下更改：\n\n```cpp\nclass StudentID\n{\nprotected:\n\
  \    static int nBaseValue;\n    int nValue;\npublic:\n    StudentID(int nNewID)\n\
  \    {\n        nValue = nNewID;\n    }\n    StudentID()\n    {\n        nValue\
  \ = nBaseValue++;\n    }\n    int getID()\n    {\n        return nValue;\n    }\n\
  };\n```\n\n\n\n\n```cpp\nstrcpy(pszName, pszNewName);\n\n}\n\npublic:\n\nStudent(const\
  \ char* pszNewName, int nNewID)\n{\n    initName(pszNewName);\n    StudentID sID(nNewID);\n\
  }\n\nStudent(const char* pszNewName)\n{\n    initName(pszNewName);\n}\n\n~Student()\n\
  {\n    delete[] pszName;\n    pszName = 0;\n}\n\n// getName() - 返回学生的名字\nconst char*\
  \ getName()\n{\n    return pszName;\n}\n\n// getID() - 获取学生的 ID \nint getID()\n\
  {\n    return sID.getID();\n}\n};\n```\n\n我为 `StudentID` 添加了一个构造函数，允许调用者传递一个值作为学生\
  \ ID 使用，而不是接受默认值。现在，如果程序没有提供 ID，则该学生将被分配下一个顺序递的 ID。然而，如果程序提供了 ID，则会使用该 ID，并且静态计数器保持不变。\n\
  \n我还为 `Student` 添加了一个构造函数，允许程序在创建学生时提供 `studentID`。这个 `Student(const char*, int)`\
  \ 构造函数首先初始化学生的名字，然后并在 `sID` 上调用 `StudentID(int)` 构造函数。\n\n然而，当我执行程序时，我失望地发现这似乎没有产生任何明显的区别。无论是否传递了替代值，学生仍然被分配了顺序的学生\
  \ ID。\n\n我很快意识到，问题出在 `Student(const char*, int)` 构造函数并没有在数据成员 `sID` 上调用新的 `StudentID(int)`\
  \ 构造函数。相反，它在构造函数内部创建了一个名为 `sID` 的新局部对象，然后立即将其丢弃，而没有对同名的数据成员产生任何影响。\n\n请记住，数据成员的构造函数是在控制权传递到构造函数体之前被调用的。我不需要在本地创建一个新值，而是需要某种方法告诉\
  \ C++ 在创建数据成员 `sID` 时使用除默认构造函数以外的构造函数。C++ 使用以下语法用特定的构造函数初始化数据成员：\n\n```cpp\nclass\
  \ Student\n{\npublic:\n    Student(const char* pszName, int nNewID) : sID(nNewID)\n\
  \    {\n        initName(pszName);\n    }\n    // ...类的其余部分保持不变...\n};\n```\n\n\
  数据成员出现在冒号之后（该冒号用于将此类声明与函数参数隔开），但在函数本身的左括号之前。这导致了 `StudentID(int)` 构造函数被调用，并将 `nNewID`\
  \ 值传递过去作为新的学生 ID。\n\n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `CompoundStudent`\
  \ 程序创建了一个具有默认顺序学生 ID 的 `Student` 对象，同时为第二个 `Student` 对象 分配了一个特定的学生 ID：\n\n```cpp\n\
  //\n// CompoundStudent - 此版本的 Student 类\n// 包含一个类型同样为\n// 用户定义类型的数据成员\n//\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\nusing namespace\
  \ std;\n\nclass StudentID\n{\nprotected:\n    static int nBaseValue;\n    int nValue;\n\
  \npublic:\n    StudentID()\n    {\n        nValue = nBaseValue++;\n    }\n    StudentID(int\
  \ nNewValue)\n    {\n        nValue = nNewValue;\n    }\n    int getID()\n    {\n\
  \        return nValue;\n    }\n};\n\n// 为类属性分配空间\nint StudentID::nBaseValue = 1000;\n\
  \nclass Student\n{\nprotected:\n    char* pszName;\n    StudentID sID;\n    void\
  \ initName(const char* pszNewName)\n    {\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \    }\n\npublic:\n    Student(const char* pszNewName, int nNewID) : sID(nNewID)\n\
  \    {\n        initName(pszNewName);\n    }\n    Student(const char* pszNewName)\n\
  \    {\n        initName(pszNewName);\n    }\n    ~Student()\n    {\n        delete[]\
  \ pszName;\n        pszName = 0;\n    }\n    // getName() - 返回学生的名字\n    const char*\
  \ getName()\n    {\n        return pszName;\n    }\n    // getID() - 获取学生的 ID\n\
  \    int getID()\n    {\n        return sID.getID();\n    }\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 创建学生并初始化它\n    Student student1(\"\
  Stephen Davis\");\n    // 显示学生的名字和 ID\n    cout << “第一个学生的名字是 ”\n    << student1.getName()\n\
  \    << “, ID 是 ”\n    << student1.getID()\n    << endl;\n    // 对第二个学生执行相同的操作\n\
  \    Student student2(\"Janet Eddins\");\n    cout << “第二个学生的名字是 ”\n    << student2.getName()\n\
  \    << “, ID 是 ”\n    << student2.getID()\n    << endl;\n    // 现在创建一个具有唯一 ID 的转学学生\n\
  \    Student student3(\"Tiffany Amrich\", 1234);\n    cout << “第三个学生的名字是 ”\n   \
  \ << student3.getName()\n    << “, ID 是 ”\n    << student3.getID()\n    << endl;\n\
  \    return 0;\n}\n```\n\n\n\n\n在这里，函数 `someOtherFn()` 创建了一个 `Student` 对象，并将该对象的拷贝传递给\
  \ `fn()`。\n\n![remember.eps](img/remember_fmt.jpeg)\n默认情况下，C++ 按值传递对象，这意味着它必须对对象进行拷贝以传递给所调用的函数（更多信息请参阅第\
  \ 23 章）。\n\n考虑一下，创建一个对象的拷贝意味着创建一个新对象，并且根据定义，这意味着调用了构造函数。但是，该构造函数的参数会是什么呢？显然，是原始对象的引用。这根据定义就是拷贝构造函数。\n\
  \n### 默认拷贝构造函数\n\nC++ 提供了一个在大多数情况下都能工作的默认拷贝构造函数。这个拷贝构造会对源对象到目标对象进行逐成员的拷贝。\n\n![tip.eps](img/tip_fmt.jpeg)由于某些很快就会变得明朗的原因，这种逐成员的拷贝也被称为**浅拷贝**（shallow\
  \ copy）。\n\n然而，在某些情况下，逐个拷贝一个成员并不是一件好事。考虑一下第 26 章中的 `Student` 类：\n\n```cpp\nclass\
  \ Student\n{\nprotected:\nchar* pszName;\nint nID;\n// ...other stuff...\n};\n```\n\
  \n将 `int` 数据成员 `nID` 从一个对象拷贝到另一个对象没有问题。然而，将指针 `pszName` 从源对象拷贝到目标对象可能会导致问题。\n\n\
  例如，如果 `pszName` 指向堆内存（它几乎总是这样）怎么办？现在你有两个对象，它们都指向堆上的同一块内存。这如图 27-1 所示。\n\n**图 27-1：**\
  \ 默认情况下，C++ 执行逐成员的“浅”拷贝来创建对象的拷贝，例如将对象传递给函数时。\n\n![617977-fg2701.eps](img/617977-fg2701_fmt.jpeg)\n\
  \n当 `Student` 对象的拷贝离开作用范围时，该类的析构函数可能会删除 `pszName` 指针，从而将该块内存返回堆，尽管原始对象仍在使用该内存。当原始对象再次删除同一个로指针时，堆就会被破坏，程序肯定会带有一个诡异且很大程度上误导性的错误信息而崩溃。\n\
  \n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `ShallowStudent` 程序演示了浅拷贝会导致严重的问题：\n\
  \n```cpp\n//\n// ShallowStudent - 这个程序演示了为什么\n// 默认的浅拷贝构造函数\n// 不总是正确的选择。\n//\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  \nusing namespace std;\n\nclass Student\n{\nprotected:\nchar* pszName;\nint nID;\n\
  public:\nStudent(const char* pszNewName, int nNewID)\n{\ncout << “Constructing “\
  \ << pszNewName << endl;\nint nLength = strlen(pszNewName) + 1;\npszName = new char[nLength];\n\
  strcpy(pszName, pszNewName);\nnID = nNewID;\n}\n~Student()\n{\ncout << “Destructing\
  \ “ << pszName << endl;\ndelete[] pszName;\npszName = 0;\n}\n// access functions\n\
  const char* getName()\n{\nreturn pszName;\n}\nint getID()\n{\nreturn nID;\n}\n};\n\
  \nvoid someOtherFn(Student s)\n{\n// we don’t need to do anything here\n}\nvoid\
  \ someFn()\n{\nStudent student(“Adam Laskowski”, 1234);\nsomeOtherFn(student);\n\
  cout << “The student’s name is now “\n<< student.getName() << endl;\n}\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\nsomeFn();\n// wait until user is ready before\
  \ terminating program\n// to allow the user to see the program results\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n这个看似简单的程序包含一个严重的问题。`main()` 函数做的仅仅是调用了 `someFn()` 函数。该函数创建了一个本地学生对象并按值传递给函数\
  \ `someOtherFn()`。这第二个函数除了返回到调用者外什么都没做。`someFn()` 函数然后显示学生的名字并返回到 `main()`。\n\n\
  程序的输出显示了一些有趣的结果：\n\n```\nConstructing Adam Laskowski\nDestructing Adam Laskowski\n\
  The student’s name is now X$±\nDestructing X$±\nPress any key to continue . . .\n\
  ```\n\n第一条消息来自 `Student` 构造函数，因为学生对象在 `someFn()` 的开头被创建。用于创建 `someOtherFn()` 的 `Student`\
  \ 拷贝的默认拷贝构造函数没有生成消息。析构消息在 `someOtherFn()` 结束、本地对象 `s` 离开作用域时被调用。\n\n`someFn()` 中的输出消息显示对象现在已经乱了，因为\
  \ `Student` 构造函数为存储学生姓名分配的内存已经返回到了堆。随后在 `someFn()` 结束时调用的析构函数证实了情况不妙。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)这种类型的错误通常是致命的（对程序而言，而不是对程序员而言）。该程序没有崩溃是因为它本来就要停止了。\n\
  \n### 创建拷贝构造函数\n\n类在构造函数中分配资源时，通常需要拷贝构造函数来创建资源的拷贝。例如，拷贝构造函数应该分配新的堆内存并将原始对象的名称拷贝进去。**27-2：**\
  \ 类在构造函数中分配资源需要拷贝构造函数来执行深拷贝。这如图 27-2 所示。\n\n![617977-fg2701.eps](img/617977-fg2701_fmt.jpeg)\
  \ 拷贝构造函数将源对象的名称拷贝到新的堆内存被称为深拷贝（相对于浅拷贝）。\n\n![tip.eps](img/tip_fmt.jpeg)onthecd.eps\
  \ 以下 `DeepStudent` 程序包含了拷贝构造函数 `Student(const Student&)`：\n\n```cpp\n//\n// DeepStudent\
  \ - 这个程序演示了如何\n// 执行深拷贝\n// 构造函数来解决拷贝问题\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n#include <cstring>\n\nusing namespace std;\n\nclass Student\n\
  {\nprotected:\nchar* pszName;\nint nID;\npublic:\nStudent(const char* pszNewName,\
  \ int nNewID)\n{\ncout << “Constructing “ << pszNewName << endl;\nint nLength =\
  \ strlen(pszNewName) + 1;\npszName = new char[nLength];\nstrcpy(pszName, pszNewName);\n\
  nID = nNewID;\n}\nStudent(const Student& s)\n{\ncout <<”Constructing copy of ”<<\
  \ s.pszName << endl;\nint nLength = strlen(s.pszName) + 1;\nthis->pszName = new\
  \ char[nLength];\nstrcpy(this->pszName, “Copy of “);\nstrcat(this->pszName, s.pszName);\n\
  this->nID = s.nID;\n}\n~Student()\n{\ncout << “Destructing “ << pszName << endl;\n\
  delete[] pszName;\npszName = 0;\n}\n// access functions\nconst char* getName()\n\
  {\nreturn pszName;\n}\nint getID()\n{\nreturn nID;\n}\n};\n\nvoid someOtherFn(Student\
  \ s)\n{\n// we don’t need to do anything here\n}\nvoid someFn()\n{\nStudent student(“Adam\
  \ Laskowski”, 1234);\nsomeOtherFn(student);\ncout << “The student’s name is now\
  \ “\n<< student.getName() << endl;\n}\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\nsomeFn();\n// wait until user is ready before terminating program\n// to allow\
  \ the user to see the program results\nsystem(“PAUSE”);\nreturn 0;\n}\n```\n\n这个程序与它的\
  \ `ShallowStudent` 兄弟完全相同，只是增加了拷贝构造函数 `Student(const Student&)`，但它对程序的输出产生了多大的影响：\n\
  \n```\nConstructing Adam Laskowski\nConstructing copy of Adam Laskowski\nDestructing\
  \ Copy of Adam Laskowski\nThe student’s name is now Adam Laskowski\nDestructing\
  \ Adam Laskowski\n```\n\n\n\n该构造函数首先为拷贝的 `pszName` 分配了一块新的堆内存。然后，它将字符串 `Copy of`\
  \ 复制到该字段中，并在下一行中拼接学生的名称。\n\n![tip.eps](img/tip_fmt.jpeg) 通常情况下，你会对名称进行真正的复制，而不是在前面加一个\
  \ `Copy of`；出于教学考虑，我才这么做。\n\n当 `s` 在 `someOtherFn()` 结束时离开作用域并调用的析构函数，现在显然是将名称的拷贝返回到堆，而不是原始字符串。这在回到\
  \ `someFn()` 后通过了验证，此时学生的名称仍然完好无损（正如你所预期的那样）。最后，`someFn()` 结尾的析构函数将原始字符串返回到堆。\n\n\
  ## 避免拷贝\n\n按值传递参数只是 C++ 调用拷贝构造函数创建对象临时副本的几个原因之一。你可能会想：“这些创建和删除副本的操作难道不费时间吗？”显而易见的答案是：“当然了！”有什么方法可以避免创建副本吗？\n\
  \n一种方法是不按值传递对象，而是传递对象的地址。如果 `someOtherFn()` 如下所示声明，就不会有问题：\n\n```cpp\n// 以下代码不会导致拷贝的创建\n\
  \nvoid someOtherFn(const Student *pS)\n{\n    // ...这里可以进行任何操作...\n}\n\nvoid someFn()\n\
  {\n    Student student(“Adam Laskowski”, 1234);\n    someOtherFn(&student);\n}\n\
  ```\n\n这种方法更快，因为单个地址比整个 `Student` 对象要小，而且它还避免了在堆上分配内存来存储学生名称副本的需求。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)你可以像下面一样使用引用参数来实现相同的效果：\n\
  \n```cpp\n// 以下函数也不会创建拷贝\n\nvoid someOtherFn(const Student& s)\n{\n    // ...无论你想做什么操作...\n\
  }\n\nvoid someFn()\n{\n    Student student(“Adam Laskowski”, 1234);\n    someOtherFn(student);\n\
  }\n```\n\n如果你不记得引用参数了，请参阅第 23 章。\n\n# 第六部分\n## 高级技巧\n\n![617977-pp0601.eps](img/617977-pp0601_fmt.jpeg)\n\
  \n在本部分中……\n\n在这里你将处理一些对任何 C++ 程序员都重要的遗留问题：你将学习如何重载赋值运算符，学习如何执行文件 I/O 操作，并发现如何抛出错误异常。\n\
  \n## 第 28 章：类的继承\n\n### 本章内容\n- 引入继承\n- 在 C++ 中实现继承\n- 复习示例程序\n- 比较 HAS_A（包含）与 IS_A（是一个）\n\
  \n继承每天都发生在我们身边。我是一个人类。我从 `Human` 类继承了某些属性，例如我（差不多）智能对话的能力，以及对空气、水和像 Twinkies 这种基于碳化合物的营养的依赖。这些属性并不是人类所独特。`Human`\
  \ 类从 `Mammal`（哺乳动物）类继承了这些属性（以及关于产胎的特性），后者从 `Animal`（动物）类继承了它们，以此类推。\n\n传递属性的能力是非常强大的能力。它让你能够以一种经济的方式描述事物。例如，如果我儿子问我：“什么是鸭子？”我可能会说：“它是一种会漂浮并会嘎嘎叫的鸟。”尽管你的第一反应可能是如此，但那个答案实际上传达了大量的知识。我儿子知道什么是鸟。他知道鸟有翅膀，鸟会飞（他现在还不知道鸵），而且鸟会下蛋。现在，他对鸭子知道了所有这些事情，加上鸭子会漂浮和发出嘎嘎声的事实。（这也许是参考第\
  \ 21 章关于微波炉及其与烤箱、厨具之间关系讨论的好时了。）\n\n面向对象的语言通过允许一个类继承另一个类来表达这种关系。因此，在 C++ 中，`Duck`\
  \ 类完全可能继承自 `Bird`，而该类可能也继承自 `Animal`。C++ 具体是如何做到的正是本章的主题。\n\n### 继承的优点\n\nC++ 增加继承有几个原因。当然，主要原因是表达继承关系的能力：即\
  \ `MicrowaveOven`（微波炉）是一个 `Oven`（烤箱），是一个 `KitchenAppliance`（厨房电器）。关于 `IS_A` 关系的更多内容将在本章和下一章稍稍后介绍。\n\
  \n一个次要原因是减少你我需要编写的字数和代码行数。你可能注意到 C++ 中的命令可能很短，但要完成任何事情都需要大量的命令。C++ 程序往往会变得很长，所以任何可以减少字数的做法都是好事。\n\
  \n为了看到继承如何减少字数，考虑一下 `Duck` 的示例。我不需要记录所有关于 `Duck` 飞行、降落、进食和下蛋的属性。它从 `Bird` 继承了所有这些东西。我只需要添加\
  \ `Duck` 的“嘎嘎性”属性和它的漂浮能力。这是一个相当大的节省。\n\n一个更重要且相关的问题是热门词：复用。软件科学家早在某时候就意识到，每个新项目都从零开始并重建相同的软件组件是没有什么意义的。\n\
  \n将软件行业的情况与其他行业进行比较。有多少汽车制造商在每次想设计汽车时都从零开始？其他行业的从业者发现，在设计新汽车时，从螺丝、螺母、甚至发动机和变速箱等现有组件开始更有意义。遗憾，除了\
  \ C++ 标准库中那些非常小的函数外，否则很难找到完全符合你要求的软件组件。通常，这些组件需要“微调”。继承允许你采用现有类的主要功能，并微调这些功能以适应新的应用。\n\
  \n这还带来了另一个虽然微妙但同样重要的优点：适应性。从不失效的是，用户一看到你最近的程序，他们想要再增加一个修复或功能。考虑一下账户。在我完成了处理账户的程序后，多久之后银行会推出一种可以产生利息的“特殊”账户？当然，并不是所有人都有这种账户（那太简单了）——只有某些客户拥有\
  \ `InterestChecking` 账户。然而，通过继承，我不需要遍历整个程序并重写所有的账户函数。我只需要创建一个继承自 `Checking` 的新子类\
  \ `InterestChecking`，并拥有一个额外的属性 `accumulatesInterest()`，功能就实现了。（当然这并不那么简单，但比那复杂不了。我会在第\
  \ 29 章向你展示如何这样做。）\n\n### 学习术语\n\n在进一步继续之前，你必须明确一些术语。`Dog` 类从 `Mammal` 类继承属性。这被称为继承。我们还说\
  \ `Dog` 是 `Mammal` 的 `subclass`（子类）。把句子反过来，我们说 `Mammal` 是 `Dog` 的 `base class`（基类）。我们也可以说\
  \ `Dog` IS_A `Mammal`。（我使用大写字母是为了表达这种独特的关系。）C++ 与其他面向对象的语言共享这些术语。\n\n\n\n请注意，尽管\
  \ `Dog` 是一种 `Mammal`，但反之则不然。`Mammal` 并不是 `Dog`。（这样的陈述总是指的是一般情况。某个特定的哺乳动物确实可能是 `dog`，但通常情况下哺乳动物不是\
  \ `dog`。）这是因为 `Dog` 共享了其他 `Mammals` 的所有属性，但 `Mammal` 并不具备 `Dog` 的所有属性。例如，并不是所有的\
  \ `Mammals` 都会汪叫或摇尾巴。\n\n## 在 C++ 中实现继承\n\n以下是如何从一个类继承到另一个类的大纲：\n\n```cpp\nclass\
  \ Student\n{\n// ...这里可以放置任何内容...\n};\n\nclass GraduateStudent : public Student\n\
  {\n// ...这里可以放置研究生特有的内容...\n};\n```\n\n`Student` 类按照通常的方式声明。该类的出现方式是名称后跟着冒号、关键字\
  \ `public` 以及基类的名称 `Student`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 关键字 `public` 意味着可能存在一种被称为受保护继承（protected inheritance）。确实有，但受保护继承非常罕见，我没有在这本书中讨论它。\n\
  \n现在，我可以说 `GraduateStudent` 是一个 `Student`。更进一步地说，我可以在任何需要 `Student` 的地方使用 `GraduateStudent`\
  \ 对象，包括作为函数的参数。也就是说，以下操作是允许的：\n\n```cpp\nvoid fn(Student* pS);\n\nvoid someOtherFn()\n\
  {\n    GraduateStudent gs;\n    fn(&gs);\n}\n```\n\n这是允许的，因为 `gs` 对象拥有 `Student`\
  \ 的所有属性。为什么呢？因为 `GraduateStudent` 是一个 `Student`！\n\n### 查看示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `GSInherit` 程序通过创建一个 `Student` 类和一个 `GraduateStudent` 类，并调用它们各自的函数，使这一点变得更加具体：\n\
  \n```cpp\n//\n// GSInherit - 通过创建一个\n// 继承自 Student 的 GraduateStudent// 类来演示继承。\n\
  //\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  using namespace std;\n\nclass Student\n{\nprotected:\n    char* pszName;\n    int\
  \ nID;\n    double dGrade; // 学生的 GPA\n    int nSemesterHours;\n\npublic:\n    Student(const\
  \ char* pszNewName, int nNewID)\n    {\n        cout << \"Constructing student \"\
  \ << pszNewName << endl;\n        pszName = new char[strlen(pszNewName) + 1];\n\
  \        strcpy(pszName, pszNewName);\n        nID = nNewID;\n        dGrade = 0.0;\n\
  \        nSemesterHours = 0;\n    }\n    ~Student()\n    {\n        cout << \"Destructing\
  \ \" << pszName << endl;\n        delete[] pszName;\n        pszName = 0;\n    }\n\
  \    // 访问函数\n    const char* getName()\n    {\n        return pszName;\n    }\n\
  \n    int getID()\n    {\n        return nID;\n    }\n\n    double getGrade()\n\
  \    {\n        return dGrade;\n    }\n\n    int getHours()\n    {\n        return\
  \ nSemesterHours;\n    }\n    // addGrade - 将成绩加入 GPA 和总学时\n    double addGrade(double\
  \ dNewGrade, int nHours)\n    {\n        double dWtdHrs = dGrade * nSemesterHours;\n\
  \        dWtdHrs += dNewGrade * nHours;\n        nSemesterHours += nHours;\n   \
  \     dGrade = dWtdHrs / nSemesterHours;\n        return dGrade;\n    }\n};\n\n\
  class Advisor\n{\npublic:\n    Advisor() { cout << \"Advisor constructed\" << endl;}\n\
  };\n\nclass GraduateStudent : public Student\n{\nprotected:\n    double dQualifierGrade;\n\
  \    Advisor advisor;\n\npublic:\n    GraduateStudent(const char* pszName, int nID)\
  \ :\n    Student(pszName, nID)\n    {\n        cout << \"Constructing GraduateStudent\"\
  \ << endl;\n        dQualifierGrade = 0.0;\n    }\n};\n\nvoid someOtherFn(Student*\
  \ pS)\n{\n    cout << \"Passed student \" << pS->getName() << endl;\n}\n\nvoid someFn()\n\
  {\n    Student student(\"Lo Lee Undergrad\", 1234);\n    someOtherFn(&student);\n\
  \    GraduateStudent gs(\"Upp R. Class\", 5678);\n    someOtherFn(&gs);\n}\n\nint\
  \ main(int nNumberofArgs, char* pszArgs[])\n{\n    someFn();\n    // 在程序终止前等待用户准备好\n\
  \    // 以允许用户查看程序结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\n这个示例乍看很长。但幸运的是，`Student`\
  \ 类与其之前章节中的前类完全相同。\n\n![remember.eps](img/remember_fmt.jpeg) `Student` 类没有改变是一个非常重要的点：你不需要修改一个类就可以继承自它。为了创建子类\
  \ `GraduateStudent`，我不需要对 `Student` 做任何更改。\n\n`GraduateStudent` 类通过添加数据成员 `dQualifierGrade`\
  \ 扩展了 `Student` 类。此外，我为 `GraduateStudent` 提供了一个接受学生姓名和 ID 的构造函数。当然，`GraduateStudent`\
  \ 不需要自己处理学生的姓名和 ID —— 它通过调用功能良好的 `Student` 构造函数来完成，如下代码片段所示：\n\n```cpp\nGraduateStudent(const\
  \ char* pszName, int nID) :\nStudent(pszName, nID)\n{\n    cout << \"Constructing\
  \ GraduateStudent\" << endl;\n    dQualifierGrade = 0.0;\n}\n```\n\n基类的构造函数会在当前类的任何部分构造之前调用。输出如下：\n\
  \n```\nConstructing student Lo Lee Undergrad\nPassed student Lo Lee Undergrad\n\
  Constructing student Upp R. Class\nAdvisor constructed\nConstructing GraduateStudent\n\
  Passed student Upp R. Class\nDestructing Upp R. Class\nDestructing Lo Lee Undergrad\n\
  Press any key to continue . .\n```\n\n# HAS_A 关系\n\n请注意 `GraduateStudent` 类包含了 `Student`\
  \ 和 `Advisor` 的成员，但方式不同。通过定义 `Advisor` 类的数据成员，`GraduateStudent` 内部包含了 `Advisor`\
  \ 的所有成员。然而，你不能说 `GraduateStudent` 是一个 `Advisor`。相反，`GraduateStudent` 有一个 `Advisor`。\n\
  \n这个类比就像一辆带有发动机的汽车。逻辑上，你可以说汽车是 `vehicle` 的子类，因此它继承了所有车辆的属性。同时，汽车有一个发动机。如果你买了一辆汽车，逻辑上可以认为你也买了一个发动机（除非你去我上次买那堆废铁的二手车行）。\n\
  \n如果有些朋友邀请你周六开上你喜欢的车辆参加集会，而你开汽车过去，他们不能抱怨并把你赶出去。但如果你徒步抱着一个发动机出现，你的朋友会有理由把你笑出门，因为发动机不是车辆。\n\
  \n这些断言在 C++ 中编写如下：\n\n```cpp\nclass Vehicle {};\nclass Motor {};\n```\n\n\n\n\n\
  ```cpp\nclass Car : public Vehicle\n{\npublic:\n    Motor motor;\n};\n\nvoid vehicleFn(Vehicle*\
  \ pV);\nvoid motorFn(Motor* pM);\nvoid someFn()\n{\n    Car c;\n    vehicleFn(&c);\
  \ // this is allowed\n    motorFn(&c.motor); // so is this\n    motorFn(&c); //\
  \ this is not allowed\n}\n```\n\n# 第 29 章：虚函数真的存在吗？\n\n### 本章内容\n- 类中成员函数之间的重写（Overriding）\n\
  - 引入虚成员函数\n- 关于虚函数的某些特殊考虑\n- 将析构函数声明为虚函数——什么时候该做，什么时候不该做\n\n继承使用户能够通过另一个类来描述一个类。同样重要的是，它突出了类与类的关系。我将鸭子描述为“一种……的鸟”，这种描述指出了鸭子和鸟之间的关系。然而，从\
  \ C++ 的角度来看，拼图仍然缺失了一块。\n\n你可能已经注意到了，但微波炉看起来和普通烤箱完全不像，内部工作原理也不同。尽管如此，当我说“烹饪”时，我并不想担心每个烤箱内部工作的细节。本章将用\
  \ C++ 的术语来描述这个问题，然后将继续描述其解决方案。\n\n### 重载成员函数\n\n只要参数不同，在同一个类中用另一个成员函数重载成员函数是一直是可能的：\n\
  \n```cpp\nclass Student\n{\npublic:\n    double grade(); // 返回学生的 gpa\n    double\
  \ grade(double); // 设置学生的 gpa\n    // ...其他内容...\n};\n```\n\n你在第 26 章和第 27 章中大量地看到了这一点，我在那些章节用许多不同类型的构造函数重载了构造函数。即使参数相同，用另一个类中的函数重载一个类中的函数也是可能的，因为类本身不同：\n\
  \n```cpp\nclass Student\n{\npublic:\n    double grade(double); // 设置学生的 gpa\n};\n\
  \nclass Hill\n{\npublic:\n    double grade(double); // 设置山丘的坡度\n};\n```\n\n继承提供了另一种混淆问题的方法：子类中的成员函数可以重载基类中的成员函数。\n\
  \n重载基类成员函数被称为`重写`（overriding）。\n\n### 早期绑定\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 重写是非常直接。例如，考虑下面的 `EarlyBinding` 演示程序：\n\n```cpp\n//\n// EarlyBinding - 展示了在子类中\n\
  // 用另一个成员函数重写一个成员函数时的早期绑定。\n//\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n    double calcTuition()\
  \ { return 0.0; }\n};\n\nclass GraduateStudent : public Student\n{\npublic:\n  \
  \  double calcTuition() { return 1.0; }\n};\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n    // 以下调用了 Student::calcTuition()\n    Student s;\n    cout <<\
  \ “The value of s.calcTuition() is “\n    << s.calcTuition()\n    << endl;\n   \
  \ // 以下调用了 GraduateStudent::calcTuition()\n    GraduateStudent gs;\n    cout <<\
  \ “The value of gs.calcTuition() is “\n    << gs.calcTuition()\n    << endl;\n \
  \   // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n\
  }\n```\n\n在这里，`Student` 和 `GraduateStudent` 类都包含一个 `calcTuition()` 成员函数（不再包含其他内容，为了保持列表简短）。假设大学对研究生和本科生的学费计算方式不同，但对于这个演示来说，确定调用了哪个函数是唯一重要的事情。因此，`Student::calcTuition()`\
  \ 返回 0，而 `GraduateStudent::calcTuition()` 返回 1 —— 没有比这更简单的了！\n\n`main()` 函数首先创建一个\
  \ `Student` 对象 `s`，然后调用 `s.calcTuition()`。不出所料，正如此处引用的程序输出所示，该调用被传递给了 `Student::calcTuition()`。`main()`\
  \ 函数随后对 `GraduateStudent` 执行了同样的操作，结果是可预见的：\n\nThe value of `s.calcTuition()` is\
  \ 0\nThe value of `gs.calcTuition()` is 1\n按任意键继续 . . .\n\n在这个程序中，C++ 编译器能够在编译时运行时根据\
  \ `s` 和 `gs` 的声明类型决定调用哪个成员函数。\n\n![remember.eps](img/remember_fmt.jpeg) 根据对象的声明类型来解析对重写成员函数的调用被称为`编译时绑定`或`早期绑定`。\n\
  \n这个简单的例子到目前为止并不太奇怪，但让我在这块简单的织物上增添一点波折。\n\n### 歧义情况\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `AmbiguousBinding` 程序与早的 `EarlyBinding` 程序几乎相同。唯一的区别是，这个版本的程序不是直接调用 `calcTuition()`，而是通过一个传递给函数的指针来调用该函数：\n\
  \n```cpp\n//\n// AmbiguousBindng - 展示了一个不确定\n// 应该发生什么的情况。在这种\n// 情况下，C++ 采用了早期绑定\n\
  // 而像 Java 和 C# 等语言使用了后期绑定。\n//\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nclass Student\n{\npublic:\n    double calcTuition()\
  \ { return 0.0; }\n};\n\nclass GraduateStudent : public Student\n{\npublic:\n  \
  \  double calcTuition() { return 1.0; }\n};\n\ndouble someFn(Student* pS)\n{\n \
  \   return pS->calcTuition();\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    // 以下调用了 Student::calcTuition()\n    Student s;\n    cout << “The value of\
  \ s.calcTuition() is “\n    << someFn(&s)\n    << endl;\n    // 以下调用了 GraduateStudent::calcTuition()\n\
  \    GraduateStudent gs;\n    cout << “The value of gs.calcTuition() is “\n    <<\
  \ someFn(&gs)\n    << endl;\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n与 `EarlyBinding` 示例一样，这个程序首先创建一个 `Student` 对象 `s`。然而，这个版本并不是直接调用\
  \ `s.calcTuition()`，而是将 `s` 的地址传递给 `someFn()`，由该函数来执行。程序对 `GraduateStudent` 对象 `gs`\
  \ 重复了这一过程。\n\n现在在不看结果的情况下，我有一个问题：当 `main()` 将 `GraduateStudent` 的地址传递给 `someFn()`\
  \ 时，`pS->calcTuition()` 调用哪个 `calcTuition()`？你可以认为它调用 `Student::calcTuition()`，因为\
  \ `pS` 的声明类型是 `Student`。另一方面，你也可以认为同一个调用将调用 `GraduateStudent::calcTuition()`，因为“真实类型”是\
  \ `GraduateStudent`。\n\n![remember.eps](img/remember_fmt.jpeg) “真实类型”被称为运行时（与声明类型相对）。这些分别被称为`动态类型`和`静态类型`。\n\
  \n该程序的输出如下：\n\nThe value of `someFn(&s)` is 0\nThe value of `someFn(&gs)` is 0\n\
  按任意键继续 . . .\n\n你可以看到，默认情况下，C++ 根据对象的声明类型做出决定。因此，`someFn()` 调用了 `Student::calcTuition()`，因为无论调用中提供的运行时类型如何，对象都是这样被声明的。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 早期绑定的替代方案是根据对象的运行时类型来决定调用哪个成员函数。这被称为`后期绑定`。\n\n因此，我们说\
  \ C++ 偏好于早期绑定。\n\n\n\n\n早期绑定并没有抓住面向对象编程的本质。让我们回到第 21 章中我是如何制作纳玉米的。在某种意义上，我充了晚绑定器的角色。食谱说：“在烤箱中加热纳玉米。”它并没有说：“如果烤箱类型是微波炉，执行此；如果是对流烤箱，执行此；如果是传统烤箱，执行此；如果使用营营火，执行此。”食谱（代码）依赖于我（晚绑定者）来决定当动作\
  \ `heat`（成员函数）作用于烤箱（`Oven` 类的特定实例）或其任何变体（子类），如微波炉（`MicrowaveOven`）时意味着什么。人们是这样思考的，沿着这些思路设计语言可以使软件模型更准确地描述人们可能想到的现实世界解决方案。\n\
  \n维护性和可重用性等平凡理由也证明了晚绑定的合理性。假设我围绕 `Student` 类编写了一个很棒的程序。这个程序虽然很酷，但它做了很多事情，其中之一就是计算学生下年的学费。经过几个月的设计、编码和测试，我发布了该程序，并获得了同行的广泛赞誉和荣誉。\n\
  \n时间流逝，我的老板要求我更改研究生的学费计算规则。我需要保持学生的规则不变，但要给研究生提供某种学费减免，以便大学能吸引更多、更好的研究生候选人。在程序深处，`someFunction()`\
  \ 如下调用了 `calcTuition()` 成员函数：\n\n```cpp\nvoid someFunction(Student* pS)\n{\n  pS->calcTuition();\n\
  \  // ...function 继续...\n}\n```\n\n![tip.eps](img/tip_fmt.jpeg) 这看起来应该很熟悉。如果没有，请参考本章的开头。\n\
  \n如果 C++ 不支持晚绑定，我将需要编辑 `someFunction()` 来类似于下面的操作：\n\n```cpp\nvoid someFunction(Student*\
  \ pS)\n{\n  if (pS->type() == STUDENT)\n  {\n    pS->Student::calcTuition();\n \
  \ }\n  if (pS->type() == GRADUATESTUDENT)\n  {\n    pS->GraduateStudent::calcTuition();\n\
  \  }\n  // ...function 继续...\n}\n```\n\n使用包含类名在内的函数扩展名，会强制编译器使用 `calcTuition()`\
  \ 的特定版本。\n\n我会为类添加一个返回某些常量的成员 `type()`。我可以在构造函数中建立该常量的值。\n\n这种变化似乎并不糟糕，直到你考虑到 `calcTuition()`\
  \ 不仅在一个地方被调用；它在整个程序中都被调用。我能找到所有调用它的地方概率并不大。\n\n即使我找到了所有地方，我是在编辑（读作“破坏”）之前已经调试过、测试过、检查过并经过认证的代码。编辑可能是耗时且无聊的，并且会引入错误的机会。我的任何一次编辑都可能是错误的。至少，我必须重新测试并重新认证每条涉及\
  \ `calcTuition()` 的路径。\n\n当我的老板想要另一个更改时会发生什么？（我的老板和所有老板一样那样。）我不得不重复整个过程。\n\n我真正想要的是\
  \ C++ 跟踪对象的实时类型，并使用晚绑定执行调用。\n\n![tip.eps](img/tip_fmt.jpeg) 执行晚绑定的能力被称为多态（“poly”\
  \ 意味着“多样的”，“morph” 意味着“形式”）。因此，单个对象可以根据其运行时类型采取多样的动作。\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 我需要做的仅仅是在基类的成员函数声明中添加 `virtual` 关键字，如下面的 `LateBinding` 示例程序所示：\n\n```cpp\n//\n\
  // LateBinding - 增加关键字 ‘virtual’\n// 将 C++ 从早期绑定转变为晚\n// 绑定。\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n\
  {\npublic:\n  virtual double calcTuition() { return 0.0; }\n};\n\nclass GraduateStudent\
  \ : public Student\n{\npublic:\n  virtual double calcTuition() { return 1.0; }\n\
  };\n\ndouble someFn(Student* pS)\n{\n  return pS->calcTuition();\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n  // 以下调用了 Student::calcTuition()\n  Student\
  \ s;\n  cout << “The value of someFn(&s) is “\n  << someFn(&s)\n  << endl;\n  //\
  \ 以下调用了 GraduateStudent::calcTuition()\n  GraduateStudent gs;\n  cout << “The value\
  \ of someFn(&gs) is “\n  << someFn(&gs)\n  << endl;\n  // 直到用户准备好后再终止程序\n  // 以允许用户看到程序结果\n\
  \  system(“PAUSE\");\n  return 0;\n}\n```\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 没有必要在子类中也添加 `virtual` 关键字，但这样做是常见做法。晚绑定的成员函数被称为虚成员函数。\n\n除了 `virtual` 关键字外，`LateBinding`\
  \ 程序和它的歧义版本没有其他区别：\n\nThe value of someFn(&s) is 0\nThe value of someFn(&gs) is\
  \ 1\n按下任意键继续 . .\n\n这正是我想要的：C++ 现在根据运行时类型而不是声明类型来决定哪个 `calcTuition()` 版本。这种绑定是基于其运行时类型，这令人惊讶，但晚绑定为每个调用增加极少量的开销。\n\
  \n### 什么时候不是虚函数\n\n你认为某个函数是晚绑定的并不意味着它就是。需要关注的最关键点是所有的成员函数声明是否一致。如果它们没有在子类中声明，就不可能是晚绑定。考虑以下代码：\n\
  \n```cpp\nclass Base\n{\npublic:\n  virtual void fn(int x);\n};\n\nclass Subclass\
  \ : public Base\n{\npublic:\n  virtual void fn(double x);\n};\n\nvoid test(Base*\
  \ pB)\n{\n  pB->fn(1);\n  pB->fn(2.0);\n}\n```\n\n`fn()` 不是晚绑定的，因为参数不匹配。并不意外，`test()`\
  \ 中的第一个 `fn()` 调用进入了 `Base::fn()`，即使向 `test()` 传递的是 `Subclass` 对象。令人惊讶的是，第二次调用在转换\
  \ `double` 为 `int` 后也进入了 `Base::fn()`。同样，没有晚绑定。\n\n该规则的唯一例外可以通过以下示例完美解释：\n\n```cpp\n\
  class Base\n{\npublic:\n  virtual Base* fn();\n};\n\nclass Subclass : public Base\n\
  {\npublic:\n  virtual Subclass* fn();\n};\n```\n\n在这里，`fn()` 函数是晚绑定的，尽管返回类型不匹配。在实践中，这非常自然。如果一个函数处理\
  \ `Subclass` 对象，它似乎自然也应该返回一个 `Subclass` 对象。\n\n### 虚函数考量\n\n在调用中指定类名会强制调用早期查找该函数是否声明为虚函数。例如，以下调用是针对\
  \ `Base::fn()`，因为程序员指示了她的意图：\n\n```cpp\nvoid test(Base* pB)\n{\n  pB->Base::fn();\
  \ // 此调用不是晚绑定的\n}\n```\n\n构造函数不能声明为虚函数，因为在调用构造函数作为晚绑的基础时，还没有完成的对象。\n\n相反，析构函数几乎总是声明为虚。否则，你将面临无法完全析毁对象的风险，如下所示：\n\
  \n```cpp\nclass Base\n{\npublic:\n  ~Base() {} // 这应该声明为虚\n};\n\nclass Subclass\n\
  {\nprotected:\n  MyObject* pMO;\npublic:\n  Subclass()\n  {\n    pMO = new MyObject;\n\
  \  }\n  ~Subclass()\n  {\n    delete pMO;\n    pMO = 0;\n  }\n};\n\nBase* someOtherFn()\n\
  {\n  return new Subclass;\n}\n```\n\n\n\n\n```cpp\nvoid someFn()\n{\nBase* pB =\
  \ someOtherFn();\ndelete pB;\n}\n```\n\n该程序有一个细微但致命的错误。当 `someFn()` 被调用时，它会立即调用\
  \ `someOtherFn()`，而该函数创建了一个 `Subclass` 类的对象。`Subclass` 的构造函数在堆上分配了一个 `MyObject`\
  \ 类的对象。表面上看，一切都是正常的，因为当 `Subclass` 对象被析构时，它的析构函数会将 `MyObject` 返回给堆。\n\n然而，当 `someFn()`\
  \ 调用 `delete` 时，它传递的是一个 `Base*` 类型的指针。如果允许此调用早期绑定，它将调用 `Base` 的析构函数，而该函数对 `MyObject`\
  \ 一无所知。内存将不会返回给堆。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 我意识到从技术上来说\
  \ `delete` 是一个关键字而不是函数调用，但语义是相同的。\n\n将 `Base` 的析构函数声明为 `virtual` 可以解决这个问题。现在，对 `delete`\
  \ 的调用变为后期绑定——由于意识到传递给 `delete` 的指针实际上指向一个 `Subclass` 对象，`delete` 会调用 `Subclass`\
  \ 的析构函数，内存也将按预期被返回。\n\n那么，是否存在你不不想将析构函数声明为 `virtual` 的情况？只有一种。我之前提到过 `virtual` 函数会引入“极小的”开销。让我更具体一点：它们增加的一个东西是每个对象多了一个额外的隐藏指针——不是每个\
  \ `virtual` 函数一个指针，仅仅只有一个指针，仅此。没有 `virtual` 函数的类没有这个指针。\n\n现在，一个指针听起来并不什么，事实也如此，除非满足以下两个条件：\n\
  \n1. 该类没有许多数据成员（因此与已有的成员相比，一个指针占了很大）。\n2. 你创建了大量该类的对象（否则，这种开销并不重要）。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 如果这两个条件中任一不成立，请始终将你的析构函数声明为 `virtual`。\n\n# 第 30 章\n\n## 重载赋值运算符\n\n### 本章内容\n\
  - 重载运算符——通常情况下是坏坏主意\n- 重载赋值运算符——为什么那个运算符至关重要\n- 当你实在懒得写赋值运算符时该怎么办\n\n像 `+`、`−`、`=`\
  \ 等小符号被称为运算符。这些运算符已经为 `int` 和 `double` 等内建类型进行了定义。然而，C++ 允许你为你创建的类定义现有的运算符。这被称为运算符重载。\n\
  \n运算符重载听起来是一个很棒的主意。通常命名的示例类类如表示复数的 `Complex` 类。（如果你不知道什么是复数，不用担心。只需知道 C++ 并不内建处理它们即可。）定义了\
  \ `Complex` 类后，你就可以定义加法、乘法、减法和除法运算符（这些操作对于复数都是定义的）。然后你就可以写出酷代码：\n\n```cpp\nComplex\
  \ c1(1, 0), c2(0, 1);\nComplex c3 = c1 + c2;\n```\n\n事实证明，运算符重载在实践中比在理论上困难得多。困难到以至于我认为运算符重载超出了本书的范围，有两个例外，其中一个是本章的主题：重载赋值运算符。第二个值得重载的运算符是下一章的主题。\n\
  \n### 重载运算符\n\nC++ 将运算符视为函数调用的特殊特例。它认为 `+` 运算符是函数 `operator+()` 的简写。事实上，对于任何运算符\
  \ `%`，其函数版本被称为 `operator%()`。因此，例如，为了定义当应用于 `Complex` 对象时加法意味着什么，你仅需定义以下函数即可：\n\n\
  ```cpp\nComplex& operator+(Complex& c1, Complex& c2);\n```\n\n你可以定义现有运算符在应用于你创建的对象时的含义，但在重载运算符时，有很多事情是你无法做的。这里只是其中的几点：\n\
  \n- 你不能定义新运算符，只能重新定义现有运算符应用于你的用户定义类时的含义。\n- 你不能重载内建运算符，如 `operator+(int, int)`。\n\
  - 你不能影响运算符的优先级。\n\n此外，赋值运算符必须是一个成员函数——它不能像刚才定义的加法运算符那样是一个非成员函数。\n\n## 重载赋值运算符至关重要\n\
  \nC++ 语言确实提供了默认的赋值运算符。这就是为什么你可以写出类似下面的代码：\n\n```cpp\nStudent s1(“Stephen Davis”,\
  \ 1234);\nStudent s2;\ns2 = s1; // 使用默认赋值运算符\n```\n\n默认赋值运算符会将右侧对象中的每个数据成员逐个拷贝到左侧对象中。这与默认拷贝构造函数完全类比。记住，这种逐个成员拷贝被称为浅拷贝。（有关拷贝构造函数和浅拷贝的更多信息，请参阅第\
  \ 27 章。）\n\n默认赋值运算符固有的问题与拷贝构造函数类似但更为糟糕。考虑以下代码片段：\n\n```cpp\nclass Student\n{\nprotected:\n\
  \    char* pszName;\n    int nID;\npublic:\n    Student(const char* pszNewName,\
  \ int nNewID)\n    {\n        cout << “Constructing “ << pszNewName << endl;\n \
  \       int nLength = strlen(pszNewName) + 1;\n        pszName = new char[nLength];\n\
  \        strcpy(pszName, pszNewName);\n        nID = nNewID;\n    }\n    ~Student()\n\
  \    {\n        cout << “Destructing ” << pszName << endl;\n        delete[] pszName;\n\
  \        pszName = 0;\n    }\n    // 其他成员...\n};\n\nvoid someFn()\n{\n    Student\
  \ s1(“Stephen Davis”, 1234);\n    Student s2(“Cayden Amrich”, 5678);\n    s2 = s1;\n\
  }\n```\n\n`someFn()` 函数首先创建一个对象 `s1`。`Student(char*, int)` 构造函数为 `Student` 在堆上分配内存以存储名称。随后将\
  \ `s1` 赋值给 `s2`。这做了两件事，都是坏的：\n\n1. 将 `s1.pszName` 拷贝到 `s2.pszName`，导致两个对象指向同一块堆内存。\n\
  2. 清除了 `s2.pszName` 原有的值，导致存储名称的内存块丢失。\n\n`Student` 的赋值运算符需要做的是：\n\n- 删除 `s2.pszName`\
  \ 指向的内存（类似于析构函数）。\n- 将 `s1.pszName` 深拷贝到 `s2.pszName` 新分配的数组中（类似于拷贝构造函数）。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 事实上，你可以得出这一通用结论：赋值运算符像析构函数一样清除当前值，然后像拷贝构造函数一样将新值拷贝到对象。\n\n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `StudentAssignment` 程序包含一个 `Student` 类，它拥有构造函数和析构函数，以及拷贝构造函数和赋值运算符——自律类所需的一切！\n\
  \n```cpp\n//\n// StudentAssignment - 程序演示了如何\n// 创建与构造函数相同的赋值运算符\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing namespace std;\n\
  \nclass Student\n{\nprotected:\n    char* pszName;\n    int nID;\n    void init(const\
  \ char* pszNewName, int nNewID)\n    {\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \        nID = nNewID;\n    }\n    void destruct()\n    {\n        delete[] pszName;\n\
  \        pszName = 0;\n    }\npublic:\n    Student(const char* pszName, int nNewID)\n\
  \    {\n        cout << “Constructing ” << pszNewName << endl;\n        init(pszNewName,\
  \ nNewID);\n    }\n    Student(Student& s)\n    {\n        cout<<”Constructing copy\
  \ of ”<< s.pszName << endl;\n        init(s.pszName, s.nID);\n    }\n    virtual\
  \ ~Student()\n    {\n        cout << “Destructing ” << pszName << endl;\n      \
  \  destruct();\n    }\n    // 重载赋值运算符\n    Student& operator=(Student& source)\n\
  \    {\n        // 如果赋值给自身，则什么都不做\n        if (this != &source)\n        {\n   \
  \         cout << “Assigning ” << source.pszName\n            << “ to “ << pszName\
  \ << endl;\n        }\n    }\n};\n\nvoid someFn()\n{\n    Student s1(“Stephen Davis”,\
  \ 1234);\n    Student s2(“Cayden Amrich”, 5678);\n    s2 = s1; // 这种合法的\n}\n```\n\
  \n\n\n\n\n```cpp\n// 首先析构现有对象\n\ndestruct();\n\n// 现在拷贝源对象\n\ninit(source.pszName,\
  \ source.nID);\n\n}\n\nreturn *this;\n\n}\n\n// 访问函数\n\nconst char* getName()\n\n\
  {\n\n    return pszName;\n}\n\nint getID()\n\n{\n\n    return nID;\n}\n\n};\n\n\
  void someFn()\n\n{\n\n    Student s1(“Adam Laskowski”, 1234);\n    Student s2(“Vanessa\
  \ Barbossa”, 5678);\n    s2 = s1;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  \n{\n\n    someFn();\n    // 在终止程序前等待用户准备好\n    // 以允许用户查看程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```此此 `Student` 类的数据成员与之前章节中的版本相同。构造函数和拷贝构造函数也是相同的，区别在于实际工作是在一个从两个构造函数中调用的\
  \ `init()` 函数中执行的。赋值运算符也可以复用同一个 `init()` 函数来执行它的构造功能。\n\n实现析构序列的代码也从 `~Student()`\
  \ 转移到了受保护的 `destruct()` 成员函数。\n\n紧跟析构函数之后赋值运算符 `operator=()`。该函数首先测试传递的对象地址是否与当前对象相同。这是为了检测以下情况：\n\
  \n`s1 = s1;`\n\n在这种情况下，赋值运算符什么都不做。如果源对象和当前对象不同，该函数首先析构当前对象，然后将源对象的内容拷贝到当前对象中。最后，它返回当前对象的引用。\n\
  \n`someFn()` 函数展示了这在实践中是如何运作的。在先声明两个 `Student` 对象 `s1` 和 `s2` 之后，`someFn()` 执行了赋值\n\
  \n`s2 = s1;`\n\n这被解释为就像写了：\n\n`s2.operator=(s1);`\n\n也就是说，赋值运算符析构 `s2`，然后将 `s1`\
  \ 的内容拷贝到 `s2`。\n\n在 `someFn()` 结束时调用的析构函数证明两个对象 `s1` 和 `s2` 并不指向同一块堆内存。程序的输出如下：\n\
  \n正在构造 Adam Laskowski\n正在构造 Vanessa Barbossa\n正在将 Adam Laskowski 赋值给 Vanessa Barbossa\n\
  正在析构 Adam Laskowski\n正在析构 Adam Laskowski\n按任意键继续 . . .\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 赋值运算符返回当前对象的引用是为了允许：\n\n`s3 = s1 = s2;`\n\n## 编写你自己的（或不编写）\n\n我不指望你学会运算符重载的所有细节；但是，如果你遵循\
  \ `Student` 示例给出的模式，就不会出错：\n\n1. 检查并确保左侧和右侧对象不相同——如果是，则直接返回而不执行任何操作。\n2. 析构左侧对象（即由\
  \ `this` 指向的当前对象）。\n3. 使用右侧对象作为源对左侧对象进行拷贝构造。\n4. 返回左侧对象的引用（即返回 `*this;`）。\n\n如果这太复杂了，你总是可以采取这样做：\n\
  \n```cpp\nclass Student\n{\nprotected:\n    Student& operator=(Student&)\n    {\n\
  \        return *this;\n    }\n    // ...其他任何内容...\n};\n```\n\n这个赋值运算符什么都没做，但通过将其声明为\
  \ `protected`，它阻止了任何应用程序尝试使用默认赋值运算符。现在，\n\n`s1 = s2;` 将产生一个编译错误。\n\n## 第 31 章：执行流\
  \ I/O\n\n### 本章内容\n\n* 使用流 I/O —— 概述\n* 打开对象用于文件输入输出\n* 在执行文件 I/O 时检测错误\n* 向文件格式化输出\n\
  * 使用内部缓冲区上的流类进行简单的字符串格式化\n\n在第 2 章中生成新程序时，我给出了一个可以遵循的模板。由于你刚刚开始 C++ 之之旅，我要求你相信该模板中的许多内容；在随后的章节中，我解释了模板的每个特性。现在剩最后一项：流输入/输出（通常简写为\
  \ `I/O`）。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 我必须警告你，流 I/O 无法在一个章节内完全涵盖——整本书都只致力于这一个主题。幸运的是，你不需要了解过多流\
  \ I/O 就可以编写大多数程序。\n\n### 流 I/O 如何工作\n\n流 I/O 基于重载的 `operator>>()` 和 `operator<<()`\
