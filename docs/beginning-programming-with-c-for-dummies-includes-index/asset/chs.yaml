  \ `input.fail()` 检查输入对象以确认一切工作是否正常。如果 `fail()` 为真，程序将丢弃所读的所有内容，并带有错误消息向用户输出该行。\n\
  \n`Student` 构造函数是你在书中其他地方看到的典型构造。程序使用 `Student::display()` 函数来显示 `Student` 对象的内容。它以一种相当优雅的方式实现，只需将\
  \ `ostrstream` 对象与提供的数组关联，然后向对象插入内容。`main()` 所需要做的就是输出结果。\n\n这比直接向 `cout` 输出的替代方案要灵活得多——程序可以对包含学生数据的\
  \ `szBuffer` 数组进行任何操作。它可以将其写入文件、发送到 `cout`，或者放入表格中，这仅仅是三种可能性。\n\n注意 `display()`\
  \ 插入的最后一个对象是 `ends`。这某种程度上是 `ends` 的用法，它会 `ends` 结束。\n\n\n\n\n\n```cpp\nwhile(n\
  \ > 1)\n{\n    nAccum *= n--;\n}\n\nreturn nAccum;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    try\n    {\n        cout << \"Factorial of 3 is \"\n\
  \        << factorial(3)\n        << endl;\n        cout << \"Factorial of -1 is\
  \ \"\n        << factorial(-1)\n        << endl;\n        cout << \"Factorial of\
  \ 5 is \"\n        << factorial(5)\n        << endl;\n    }\n    catch(const char*\
  \ pMsg)\n    {\n        cerr << \"Error occurred: \" << pMsg << endl;\n    }\n \
  \   catch(...)\n    {\n        cerr << \"Unexpected error thrown\" << endl;\n  \
  \  }\n    // wait until user is ready before terminating program\n    // to allow\
  \ the user to see the program results\n    system(\"PAUSE\");\n    return 0;\n}\n\
  ```\n\n`main()` 函数以关键字 `try` 开始，后面跟着一个左大括号，最终是一个右大括号。括号内的所有内容被称为位于 `try` 块中。该函数接着显示三个值的阶乘：3、−1\
  \ 和 5。唯一的问题是负数的阶乘是未定义的。\n\n你可以在 `factorial()` 函数中看到这一点。这个版本的函数现在包含了对负数参数的检查，以及对大到会导致\
  \ `int` 溢出的参数的检查。如果任一条件成立，控制权将传递到一条语句，该语句由关键字 `throw` 后一个包含错误描述的 ASCIIZ 字符串组成。\n\
  \n回到 `main()`，在 `try` 块的末尾有两个 `catch` 短句。每个短句由关键字 `catch` 后一个参数组成。这些 `catch` 短句的设计用于捕获从\
  \ `try` 块内部抛出的任何异常。第一个 `catch` 短句将捕获指向 ASCIIZ 字符串的指针。该短句会显示该字符串。第二个 `catch` 短句（使用省略作为参数的那个）设计用于捕获任何内容。这个通配符\
  \ `catch` 短句也会显示一条消息，但由于该短句非常通用，它并不知道异常是从哪里抛出的，也不知道如何解释该异常，因此它只输出一条通用的错误消息。\n\n\
  在实践中，程序的运行方式如下：第一次调用 `factorial(3)` 跳过了两个错误条件并返回值 6。到目前为止没有问题。\n\n第二次调用 `factorial(-1)`\
  \ 导致控制权传递到语句 `throw “Argument for factorial is negative\"`。这条命令立即将控制权离开 `factorial()`\
  \ 并传递到 `try` 块的末尾，在那里 C++ 开始将“Argument for factorial is negative”（顺便说一下，它是 `const\
  \ char*` —— 你知道的）的类型与每个 `catch` 参数比较。\n\n幸运的是，对象的对象的类型与第一个 `catch` 短句的类型匹配。这显示了字符串“Error\
  \ occurred:”，随后是从 `factorial()` 内部抛出的字符串。然后，控制权传递到最后一个 `catch` 短句之后的第一个语句，即通常的 `system(\"\
  PAUSE”)` 调用。\n\n在执行过程中，程序的输出显示如下：\n\nFactorial of 3 is 6\nError occurred: Argument\
  \ for factorial is negative\nPress any key to continue . . .\n\n注意对 `factorial(5)`\
  \ 的调用从未被执行。无法从 `catch` 中返回。\n\n### 详细检查异常机制\n\n现在，仔细观察 C++ 如何处理异常。\n\n当 C++ 遇到 `throw`\
  \ 时候，它首先将抛出的对象拷贝到函数局部内存之外的某个中间位置。然后它开始在当前函数中寻找当前 `try` 块的结束。如果没有遇到，它将从函数执行一个 `return`\
  \ 并继续搜索。C++ 会继续返回并搜索、返回并搜索，直到找到当前 `try` 块的结束。这被称为栈回溯（unwinding the stack）。\n\n栈回溯的一个重要特性是，当每个栈被回溯时，超出作用域的对象会被析构，就像函数执行了\
  \ `return` 语句一样。这防止了程序丢失资源或留下悬空对象。\n\n当找到外层的 `try` 块时，代码会搜索第一个 `catch` 短句，查看参数类型是否与抛出的对象匹配。如果不匹配，它将检查下一个\
  \ `catch` 短句，依此类推，直到找到匹配项。\n\n如果没有找到匹配的 `catch` 短句，那么 C++ 将继续向外螺旋形寻找下一个更高层级的 `try`\
  \ 块，直到找到合适的 `catch`。如果未找到匹配的 `catch` 短句，程序将终止。\n\n一旦找到 `catch` 短句，该异常就被认为已处理，控制权将传递到最后一个\
  \ `catch` 短句之后的语句。\n\n`catch(...)` 短句捕获所有异常。\n\n## 抛出异常的特殊考虑\n\n我需要提到关于抛出异常的几个特殊考虑。你需要小心不要抛出指向局部内存中对象的指针。随着栈的回溯，所有局部变量都会被销毁。C++\
  \ 会将对象拷贝到安全的内存位置以防止其被销毁，但 C++ 无法得知指针可能指向什么。\n\n注意，我在早先的示例中通过抛出一个指向 `const` 字符串的指针避免了这个问题\
  \ —— 这些字符串被保留在不同的内存区域，而不是栈上。你将在下一节中看到避免此问题的更好方法。\n\n如果你不知道如何处理错误，就不要捕获异常。这听起来可能显而易见，但确实如此。异常机制允许程序员在能够真正处理错误的地方进行处理。例如，如果你正在编写一个数据存储函数并从磁盘获取异常，捕获它并没有意义。\n\
  \n`catch` 短句可以通过执行 `throw` 关键字（不带参数）来重新抛出异常。这允许程序员在部分处理错误的地方进行处理。例如，数据库函数可能会捕获异常，关闭任何打开的表或数据库，并将异常重新抛给应用程序以便在那里进行良好的处理。（假设析构函数还没有完成这些。）\n\
  \n最后，函数可以在声明中声明它将抛出的对象类型。换句话说，我可以这样声明 `factorial()`：\n\n`int factorial(int n) throw(const\
  \ char*)`\n\n我用“可以”是因为尽管有些人认为异常声明是良好的做法，但并不是强制性的。甚至不清楚异常声明是否是一个好主意。（个人而言，我不这么认为。）\n\
  \n如果你声明了函数抛出的对象类型，那么每个抛出都会与该列表进行比较，如果函数尝试抛出其他内容，则会产生错误。如果你不在声明中包含 `throw`，那么函数可以抛出它喜欢的任何内容。###\
  \ 创建自定义异常类\n\n`throw` 后面的内容实际上是创建某种对象的表达式。在早先的示例中，对象是一个指针，但它可以是任何你喜欢的对象（带有一个稍后在本节中会提到的一个例外）。\n\
  \n例如，我可以专门创建一个类用于存储错误信息的目的。对于 `factorial()` 示例，我可以创建一个 `ArgOutOfRange`，它包含了关于越界参数的所有所需信息。通过这种方式，我可以存储尽可能的信息来调试错误（如果是错误的话）、处理异常并向用户准确报告问题。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 CustomExceptionClass 程序创建了一个 `ArgOutOfRange`\
  \ 类，并使用它为 `factorial()` 中遇到的错误提供准确描述：\n\n```cpp\n// CustomExceptionClass - 通过创建\n\
  // 自定义异常类来演示异常\n//机制的灵活性\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  #include <cstring>\n#include <exception>\n#include <strstream>\n\nusing namespace\
  \ std;\n\nclass ArgOutOfRange : public exception\n\n{\n\nprotected:\n```\n\n\n\n\
  \n\n```cpp\nchar szMsg[256];\n\nint nValue;\n\nint nMaxLegal;\n\nint nMinLegal;\n\
  \npublic:\n  ArgOutOfRange(const char* pszFName, int nVal,\n  int nMin = 0, int\
  \ nMax = 0)\n  {\n    nValue = nVal;\n    nMinLegal = nMin;\n    nMaxLegal = nMax;\n\
  \    ostrstream out(szMsg, 256);\n    out << “Argument out of range in “ << pszFName\n\
  \    << “, arg is “ << nValue;\n    if (nMin != nMax)\n    {\n      out << “, legal\
  \ range is “\n      << nMin << “ to “ << nMax;\n    }\n    out << ends;\n  }\n \
  \ virtual const char* what()\n  {\n    return szMsg;\n  }\n};\n\n// factorial -\
  \ 计算阶乘\nint factorial(int n)\n{\n  // 参数必须为正；如果 n 为负数则抛出异常\n  if (n < 0)\n  {\n\
  \    throw ArgOutOfRange(“factorial()”, n, 0, 100);\n  }\n  // 超过 100 将溢出\n  if\
  \ (n > 100)\n  {\n    throw ArgOutOfRange(“factorial()”, n, 0, 100);\n  }\n  //\
  \ 继续计算阶乘\n  int nAccum = 1;\n  while(n > 1)\n  {\n    nAccum *= n--;\n  }\n  return\
  \ nAccum;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n  try\n  {\n  \
  \  cout << “Factorial of 3 is “\n    << factorial(3)\n    << endl;\n    cout <<\
  \ “Factorial of -1 is “\n    << factorial(-1)\n    << endl;\n    cout << “Factorial\
  \ of 5 is “\n    << factorial(5)\n    << endl;\n  }\n  catch(ArgOutOfRange e)\n\
  \  {\n    cerr << “Error occurred:\\n” << e.what() << endl;\n  }\n  catch(...)\n\
  \  {\n    cerr << “Unexpected error thrown” << endl;\n  }\n  // 等待用户准备好后再终止程序\n\
  \  // 允许用户看到程序结果\n  system(“PAUSE”);\n  return 0;\n}\n```\n\n`main()` 程序的启动方式与示例相同。`factorial()`\
  \ 函数包含了相同的测试。然而，这个版本的 `factorial()` 不再抛出一个简单的字符字符串，而是抛出一个 `ArgOutOfRange` 类的对象。`ArgOutOfRange`\
  \ 的构造函数为函数名、违规参数的值以及该参数的合法范围提供了空间。\n\n所有的实际工作都在 `ArgOutOfRange` 类中完成。首先，该类继承了 `exception`\
  \ 类，该类定义在 `exception` 包含文件中。`exception` 类定义了虚成员函数 `what()`，你必须重写它并提供一个输出你的消息的版本。其他内容都是可选的。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 用户定义的异常类应该继承 `exception`，这样当未能捕获异常时，C++ 才知道该如何处理你的异常。\n\
  \n`ArgOutOfRange` 的构造函数接受函数名、参数值以及参数的最小和最大合法值。为这些参数提供默认值使它们成为可选的。构造函数使用 `ostrstream`\
  \ 类（在第 31 章中讨论过）在内部数组 `szMsg` 中创建问题的复杂描述。它还保存了参数本身。\n\n一个完整的 `ArgOutOfRange` 版本会提供访问函数，以便在需要时从应用程序代码查询这些每一个值。为了保持程序尽可能短，我不得不省略这些细节。\n\
  \n回到 `factorial()`，那两个 `throws` 现在抛出带有适当信息的 `ArgOutOfRange` 对象。`main()` 中的 `catch`\
  \ 是为了处理 `ArgOutOfRange` 对象的。这个块的作用仅仅是显示错误消息以及由 `ArgOutOfRange::what()` 返回的描述。\n\n\
  由于所有实际工作都在构造函数中完成了，`what()` 函数除了返回存储在对象中的消息指针外什么都不需要做。\n\n程序的输出现在非常有描述性：\n\nFactorial\
  \ of 3 is 6\nError occurred:\nArgument out of range in factorial(), arg is -1, legal\
  \ range is 0 to 100\nPress any key to continue . . .\n\n### 异常类的限制\n\n我提到过异常机制可以抛出几乎任何类型的对象。唯一的实际限制是该类必须是可拷贝的。这意味着要么\
  \ C++ 提供的默认拷贝构造函数足够了（`ArgOutOfRange` 就是此类情况），要么该类提供了自己的拷贝构造函数。\n\n这个限制是因为 C++ 必须在栈回溯之前，将异常对象从本地存储拷贝到某个“安全区域”。C++\
  \ 再次使用拷贝构造函数将对象拷贝到 `catch` 的存储区域。\n\n# 第七部分：十之篇\n\n![617977-pp0701.eps](img/617977-pp0701_fmt.jpeg)\n\
  \n在本部分中……\n任何一本《傻傻指南》书如果没有它的“十之篇”将是不完整的。在本部分中，你将看到十种避免最常见编码错误的方法，以及当你对 C++ 语言更加熟悉时可能想要尝试的十种高级语言特性。\n\
  \n## 第 33 章：避免 Bug 的十种方法\n\n### 本章内容\n- 启用所有编译器警告消息\n- 采用清晰且一致的编码风格\n- 在编写代码时编写注释\n\
  - 在调试器中至少对每条路径进行单步执行\n- 限制成员的可见性\n- 跟踪堆内存\n- 在删除所指向的内容后将指针置零\n- 使用异常处理错误\n- 将析构函数声明为虚\n\
  - 提供拷贝构造函数和重载的赋值运算符\n\n### 启用所有编译器警告消息\nC++ 语法允许进行大量的错误检查。当编译器遇到它无法理解的结构时，它别无选择只能输出消息。这迫使程序员修复所有错误——她没有选择。\n\
  \n然而，当 C++ 遇到一个它能理解但结构看起来很可疑的结构时，C++ 会生成一条警告消息。因为 C++ 非常确定它理解了你想要什么，它会继续创建一个可执行文件，这样如果你愿意，就可以忽略警告。\n\
  \n![warning_bomb.eps](img/warning_bomb.jpeg) 禁用或忽略警告是一个极其糟糕的主意。这有点像你因为讨厌它就拔掉汽车仪表盘上的检查灯。忽略问题并不会让它消失。这并不意味着你总是解决问题——例如，我忽略了第\
  \ 31 章关于 `strstream` 已过时的警告——但你至少需要理解警告。你不知道的东西会害了你。如果你的编译器有“地狱语法检查”模式，请开启它。\n\n\
  ### 采用清晰且一致的编码风格\n以清晰且一致的风格编写 C++ 代码不仅增强了程序的可读性，而且导致了更少的编码错误。这种出人意料的状态源于大脑计算能力是有限的这一事实。当你阅读整洁且遵循你熟悉的风格的代码时，你在解析\
  \ C++ 语句上花费的大脑力很少。这留下了更多的大脑 CPU 容量来解码程序试图做什么，而不是它是如何做的。\n\n良好的编码风格让你能够轻松地完成以下操作：\n\
  - 区分类名、对象名和函数名\n- 根据名称理解该类、函数或对象的用途\n- 区分预处理器符号与 C++ 符号（即，`#define` 对象应该脱颖而出）\n\
  - 识别相同层级的 C++ 代码块（这是一致缩进的结果）\n\n\n\n\n\n![tip.eps](img/tip_fmt.jpeg) 所有参与同一个项目的程序员都应该使用相同的编码风格。一个由多种不同编码风格拼凑而成的程序会令人困惑且显得不专业。\n\
  \n## 在编写代码时编写注释\n\n如果你在编写代码的同时就编写注释，就可以避免错误，而不是等所有代码都运行正常后再回去添加注释。我可以理解为什么不以后再花时间写冗长的头文件和函数描述，但我从未理解过为什么在编码时不写简短的注释。\n\
  \n你是否曾有过这样的经历：向某人提问，甚至当你问到问题的末尾时就已经知道了答案？通过某种方式，组织问题的过程迫使你充分地组织思路，使得答案变得显而易见。\n\n\
  写注释也是如此。编写注释迫使你审视自己正试图做什么。短注释无论是在你以后阅读它们还是在编写它们时，都是具有启发性的。\n\n写注释时就像在和另一个精通此道的程序员交流。你可以假设读者理解程序的各种基础，所以请不要解释\
  \ `C++` 是如何工作的。除非你在使用该语言某些晦涩的特性（例如 `switch` 语句的穿透能力），否则写注释解释 `switch` 语句的工作原理是没有意义的。\n\
  \n## 在调试器中至少单步执行每个路径\n\n这听起来像是一个显而易见的陈述，但我还是要说一遍：作为一个程序员，理解你的程序正在做什么是非常重要的。程序输出预期的值是不够的。你需要理解程序正在执行的一切。没有什么比使用良好的调试器（如\
  \ `Code::Blocks` 自带的那个）对程序进行单步执行，更能让你更清楚地感受底层到底发生了什么了。\n\n此外，在调试程序时，你有时需要原始素材来弄清楚某些怪异的行为。没有什么比在每个函数调用时对其进行单步执行，更能给你提供这些素材了。\n\
  \n最后，当一个函数编写完成并准备好添加到程序中时，每条逻辑路径都需要至少执行一次。与其对函数本身进行检查，比在它被扔进和其他函数大在一起——而且你的注意力已经转移到新的编程挑战之后后再寻找\
  \ Bug，要容易得多。\n\n### 限制可见性\n\n限制类内部实现对外部的可见性是面向对象编程的基石。类应该对它的内部状态负责——如果类内部出了问题，那是类程序员的责任。应用程序程序员应该担心的是解决眼下的问题。\n\
  \n具体来说，限制可见性意味着数据成员不应能在类外访问——也就是说它们应该被标记为 `protected`。此外，应用程序软件不需要的成员函数也应该被标记为 `protected`。不要暴露比完成任务所需要的更多的类内部实现。\n\
  \n一个相关的规则是，公共成员函数应该尽可能少信任应用程序代码，即使类程序员和应用程序程序员是同一个人。类程序员应该表现得好像“应用程序程序员是一个惯犯黑客”是一个既定事实；如果你的程序可以通过互联网访问，很多时候这个假设是正确的。\n\
  \n### 跟踪堆内存\n\n丢失对堆内存的跟踪是发布到市场上的程序出现致命错误最常见的来源，同时也是最难追踪和消除的问题（因为这类错误太难发现和删除了，所以它们在你购买的程序中非常普遍）。你可能需要运行程序好几个小时，问题才会开始出现（取决于内存泄漏有多大）。\n\
  \n作为一条一般规则，程序员应该始终在同一个“级别”上分配和释放堆内存。如果成员函数 `MyClass::create()` 分配了一块堆内存并将其返回给调用者，那么应该有一个成员\
  \ `MyClass::release()` 将其返回给堆。具体来说，`MyClass::create()` 不应该要求父函数来释放内存。\n\n如果可能，`MyClass`\
  \ 应该自己跟踪这些内存指针并在析构函数中删除它们。\n\n当然，这不能避免所有的内存问题，但它在某种程度上减少了问题的普遍性。\n\n## 在删除指向的内容后将指针置零\n\
  \n作为前一节警告的推论，要确保在指针不再有效后将其置零。这样做的原因随着经验的增长而变得清晰：你经常可以继续使用一个已经返回给堆的内存块而甚至完全不知道。一个程序在\
  \ 99% 的时间内可能运行良好，这使得要找到那 1% 内存块被重新分配且程序无法运行的情况变得非常困难。\n\n如果你将不再无效的指针置零，并尝试使用它们来存储一个值（你无法在位置\
  \ `0` 或附近的位置存储任何内容），你的程序将立即崩溃。崩溃听起来很糟糕，但事实如此。问题确实在那里，只是取决于你在将其投入生产环境之前是否能发现它。\n\n\
  这好比在 X 光片早期阶段发现肿瘤。在容易治疗的早期阶段发现肿瘤是一件好事。鉴于肿瘤无论如何都会在那里，不发现它要糟糕得多。\n\n### 使用异常处理错误\n\
  \n`C++` 中的异常机制设计用于方便且高效地处理错误。通常情况下，你应该抛出一个错误指示，而不是返回一个错误标志。生成的代码更容易编写、读取和维护。此外，其他程序员已经习惯了这一点，你也不想让他们失望，对吧？\n\
  \n话虽如此，将对异常的使用限制在真正的错误上。如果返回“未工作”指示是该函数的日常工作，那么没有必要从该函数抛出异常。考虑一个返回两个参数的最小公倍数的函数\
  \ `lcd()`。当遇到两个互质数时，该函数不会返回任何值。这不是一个错误，也不应该导致异常。\n\n## 将析构函数声明为虚\n\n如果构造函数分配了需要在对象终结时返回的堆内存等资源，不要忘记为你的类创建一个析构函数。这个规则很好教。学生们更难记住的是：在创建析构函数后，不要忘记将其声明为虚（virtual）。\n\
  \n“但是，”你说，“我的类没有派自于任何类，也没有被其他类继承。”是的，但它在未来可能会成为基类。除非你有充分理由不将析构函数声明为虚，否则在第一次创建类时就应该这样做。（参见第\
  \ 29 章关于虚析构函数的详细讨论。）\n\n## 提供拷贝构造函数和重载赋值运算符\n\n另一条必须遵守的规则：如果你的类需要析构函数，它几乎也需要拷贝构造函数和重载赋值运算符。如果你的构造函数分配了堆内存等资源，默认的拷贝构造函数和赋值运算符只会通过生成指向相同资源的指针来制造混乱。当这些对象中一个析构函数被调用时，它会恢复资源。当另一个拷贝的析构函数随后出现时，它会搞砸一切。\n\
  \n\n\n\n如果你觉得太懒、或者太困惑，或者你不需要拷贝构造函数和赋值运算符，那么就声明“什么都不做”的版本，但要将它们设为受保护（protected），这样应用程序就不会意外调用它们。更多细节请参阅第\
  \ 30 章。（2009 年 C++ 标准允许你删除默认拷贝构造函数和赋值运算符，但将它们声明为受保护的效果几乎一样。）\n\n# 第 34 章：本书未涵盖的十个特性\n\
  \n### 本章内容\n- `goto` 命令\n- 三元运算符\n- 二进制逻辑\n- 举举类型\n- 命名空间\n- 纯虚函数\n- `string` 类\n\
  - 多重继承\n- 模板和标准模板库\n- 2009 C++ 标准\n\nC++ 语言包含了太多的特性，要在单本书中涵盖每一个特性——尤其是一本专为初级程序员编写的书中——是不可能的。幸运的是，你并不需要为了编写大型的现实世界程序而掌握语言的所有特性。\n\
  \n尽管如此，你可能想提前了解一下书中未选入这本入门书中特性，以防你在其他人的程序中看到它们。\n\n## goto 命令\n这个命令一直追溯到 C，即 C++\
  \ 的祖先。在原理上，使用这个命令是简单的。你可以在任何需要的地方放置 `goto label;`。当 C++ 遇到这个命令时，控制会立即传递到标签，如代码段所示：\n\
  \n```cpp\nfor(;;)\n{\n    if (conditional expression)\n    {\n        goto outahere;\n\
  \    }\n    // ...任何你想做的...\n}\n\noutahere:\n// ...程序从这里继续...\n```\n\n但在实践中，`goto`\
  \ 引入了许多出错的方式——比我在这里能详述的要多得多。无论如何，程序员很快就注意到，`goto` 的两种最常用用法是退出循环和跳转到循环内的下一个 `case`。C\
  \ 标准委员会引入了 `break` 和 `continue`，几乎完全消除了对 `goto` 命令的需求。我可以说，我用 C 和 C++ 编程了几乎 20 年，我从未遇到过任何无法用其他更清晰的方式来处理的\
  \ `goto` 应用场景。\n\n### 三元运算符\n三元运算符是 C 和 C++ 特有的运算符。它的工作方式如下：\n\n```cpp\nint n =\
  \ (conditional) ? expression1 : expression2;\n```\n\n`?` 运算符首先评估 `conditional`。如果条件为真，则\
  \ `expression` 的值等于 `expression1` 的值；否则，它等于 `expression2` 的值。\n\n例如，你可以这样实现 `max()`\
  \ 函数：\n\n```cpp\nint max(int n1, int n2)\n{\n    return (n1 > n2) ? n1 : n2;\n}\n\
  ```\n\n三元运算符可以应用于任何数值类型，但不能被重载。三元运算符是一个真正的表达式，而不是像 `if` 那样的控制语句。\n\n### 二进制逻辑\n\
  我选择完全跳过了二进制算术的主题。某些读者会认为这是不可理喻的。毕竟，如果不深入到 0 和 1，你如何谈论编程呢？并不是我不认为这个主题值得探讨——我发现正确解释这个主题需要很多页，并且会让读者感到有些困惑，而在实践中它很少被使用。当你对\
  \ C++ 编程基础熟悉后，去搜索一下这个主题即可。\n\n## 举类型\n这是一个几乎未被选入本书的主题。简单的想法是你可以定义常量并让 C++ 为它们分配值，如下：\n\
  \n```cpp\nenum Colors {BLACK, BLUE, GREEN, YELLOW, RED};\nColors myColor = BLACK;\n\
  ```\n\n枚举类型的问题在于实现：C++ 使用的是整数而不是创建一个真正的类型。在这种情况下，`BLACK` 被赋值为 0，`BLUE` 被赋值为 1，`GREEN`\
  \ 被赋值为 2，以此此类推。这导致了特殊情况，使得这个主题不值得费费精力。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 2009 年 C++ 标准库通过创建真正的枚举类型“修复”了这个问题，但为了保持与现有程序的兼容性，它并没有删除整数版本。结果比以前更加困惑。\n\n###\
  \ 命名空间\n两个不同库中的不同实体可以具有相同的名称。例如，`Student` 库中的 `grade()` 函数可能分配成绩，而 `CivilEngineering`\
  \ 库中的 `grade()` 函数可能设置山坡侧的坡度。为了避免这个问题，C++ 允许程序员将代码放在一个独立的 `namespace` 中。因此，`Student`\
  \ 命名空间内的 `grade` 与 `CivilEngineering` 中的 `grade` 是不同的。\n\n`namespace` 位于类名之外。`CivilEngineering`\
  \ 命名空间中 `BullDozer` 类的 `grade()` 成员函数具有扩展名称 `CivilEngineering::BullDozer::grade()`。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 所有库对象和函数都在 `std` 命名空间中。程序模板开头的 `namespace\
  \ std;` 语句表示，如果你在默认命名空间中没有看到指定的对象，就去 `std` 中查找。如果没有这个，我必须显式地包含命名空间，如下代码段所示：\n\n\
  ```cpp\nstd::cout << “Hello, world!” << std::endl;\n```\n\n### 纯虚函数\n你在第 29 章学习了如何声明\
  \ `virtual` 函数。我当时没有提到，你不需要定义一个函数。然而，情况变得复杂起来。例如，一个包含一个或多个纯虚函数的类被称为抽象类，不能创建对象。在熟悉\
  \ `virtual` 函数之后处理这个主题。\n\n## string 类\n这是另一个几乎未被选入的主题。大多数语言将 `string` 类作为内置类型来轻松处理字符。在理论上，`string`\
  \ 类应该对 C++ 这样做。但在实践中，并非如此简单。出现问题时，编译器生成的错误信息与自定义类相关。对于初学者来说，这些信息很难解释。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 它比我描述的还要糟糕——`string` 甚至不是类。它是模板类的实例。错误信息可能会令人震惊。\n\n### 多重继承\n我在第 28 章介绍了如何使用继承让一个类基于另一个类。我当时没有提到，一个类实际上可以扩展多个基类。当两个基类包含相同名的成员函数时，这听起来简单但会变得非常复杂。或者当两个基类都是某个公共类的子类时。事实上，产生的问题太多，C++\
  \ 是唯一支持多重继承的 C 类语言。Java 和 C# 都源自 C++，都放弃了多重继承。我建议初级程序员避免这个主题。\n\n\n\n现在程序员可以通过将\
  \ `T` 替换为 `int` 并编译结果来创建一个 `max(int, int)`，通过将 `T` 替换为 `double` 创建 `max(double,\
  \ double)`，依此类推。标准委员会甚至基于模板类发布了整个类库，被称为标准模板库（简简称 STL）。\n\n然而，对于初学者来说，模板类的主题在语法上开始变得非常复杂。此外，当你模板实例化错误时，编译器生成的错误即使对专家也会感到困惑，更不用说初学者了。这绝对是一个需要等到你对基础语言熟悉之后后再考虑的话题。\n\
  \n### 2009 C++ 标准\n\nC++ 标准于 20 世纪 90 年代后期发布并通过。随后的几年里，情况变化不大，但对语言新增的需求不断增长，直到最终在\
  \ 2008 年底发布 2009 标准供征求。该标准的问题在于，它引入了许多似乎几乎没有需求的新功能。该标准超过了 1400 页。（承认，它包含了许多非常枯燥、重复的库定义，但尽管如此，C++\
  \ 也不再是一门小语言了。）截至本文写作时（2010 年初），没有编译器实现完整的 2009 标准。\n\n# 附录\n\n## 关于 CD\n\n### 本附录内容\n\
  - 系统要求\n- 在 Windows、Linux 和 Mac 上使用 CD\n- 你将在 CD 上找到什么\n- 故障排除\n\n本节介绍了附在《Beginning\
  \ Programs with C++ for Dummies》书后的后的 CD-ROM。所有读者都会喜欢书中程序的源代码——使用这些代码可以节省你大量的打字时间。此外，32\
  \ 位 Windows 用户将欢迎 `Code::Blocks` C++ 开发环境，该环境配合 `GNU C++` 编译器，已准备好在 Windows 2000、Windows\
  \ XP、Windows Vista 或 Windows 7 上安装。（Macintosh、Linux 和 64 位 Windows 用户可以从 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 下载 `Code::Blocks`。）\n\n### 系统要求\n\n请确保你的计算机符合列表所示的最低系统要求。如果你的计算机不符合这些要求的大部分项，你在使用\
