  \ `factorial()` 函数的定义并添加了 `#include \"factorial.h\"`。\n\n#### 构建结果\n\n现在你可以构建程序了（通过选择\
  \ `Build⇒Build`）。注意输出消息，编译器现在编译了两个文件：`main.cpp` 和 `factorial.cpp`。随后是单一的链接步骤。\n\n\
  当执行时，此版本的输出与之前的版本无二致，如下所示的测试输出所证明：\n\n```\nThis program calculates factorials of\
  \ user input.\nEnter a negative number to exit\nEnter number: 5\n5 factorial is\
  \ 120\nEnter number: 6\n6 factorial is 720\nEnter number: -1\nPress any key to continue\
  \ . .\n```\n\n#### 标准库文件\n\n![tip.eps](img/tip_fmt.jpeg) 为什么在 `factorial.cpp` 中包含\
  \ `factorial.h` 呢？毕竟，`factorial()` 不需要它自身的原型。你这样做是为了一种错误检查的形式。当编译 `factorial.cpp`\
  \ 时，如果 `factorial.h` 中的原型声明与函数定义不匹配，`C++` 将生成错误信息。这确保了其他源代码模块使用的原型声明与函数定义相匹配。\n\n\
  #### 变量作用域\n\n变量的存储类型取决于它们在何处以及如何定义，如下所示所示：\n\n```cpp\nint nGlobalVariable;\nvoid\
  \ fn()\n{\n    int nLocalVariable;\n    static int nStaticVariable = 1;\n    nStaticVariable\
  \ = 2;\n}\n```\n\n定义在函数内部的如 `nLocalVariable` 在控制通过声明之前是不存在的。此外，`nLocalVariable`\
  \ 仅在 `fn()` 中定义——当离开 `fn()` 函数时它不再存在。\n\n相比之下，变量 `nGlobalVariable` 在程序开始执行时创建，并在运行期间一直存在。所有函数都可以访问\
  \ `nGlobalVariable`。\n\n![remember.eps](img/remember_fmt.jpeg) 我们说 `nLocalVariable`\
  \ 具有局部作用域，而 `nGlobalVariable` 具有全局作用域。\n\n`static` 关键字可以用于创建某种混合体——全局和局部变量之间的某种。静态变量\
  \ `nStaticVariable` 在第一次调用 `fn()` 到达声明处时创建。与 `nLocalVariable` 不同，`nStaticVariable`\
  \ 在程序执行从函数时并没有被销。相反，它从一次调用到下一次调用都保留其值。\n\n在这个示例中，`nStaticVariable` 在第一次调用 `fn()`\
  \ 时初始化为 1。函数将其值改为 2。在随后的每次调用中，`nStaticVariable` 都保持值 2——一旦它被创建，就不会被重新初始化。在第一次调用\
  \ `fn()` 之后的后续调用中，声明中的初始化部分都会被忽略。\n\n然而，`nStaticVariable` 的作用域仍然局限于函数。函数外部的代码无法访问\
  \ `nStaticVariable`。\n\n\n\n\nC++ 函数代表了进一步卓越或搞砸的更多机会。缺点是，只有当你的程序被分为多个函数时，才可能出现错误。然而，将程序划分为函数允许你检查、测试和调试每个函数，而不必考虑该函数在外部程序中是如何被使用的。这让你能够创建一个更加健壮的程序。\n\
  \n## 调试一个功能异常的程序\n\n为了演示将程序划分为函数如何使结果更易读和维护，我创建了一个 `SwitchCalculator` 程序的版本，其中计算器操作被拆分为一个独立的函数（如果我那时候就知道函数的话，它本该被拆分的）。遗憾的是，我在在这个过程中引入了一个错误，这个错误在执行测试之前并没有出现。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 下列列表出现在随附的 CD-ROM 上，名为 `CalculatorError1`：\n\
  \n```cpp\n// CalculatorError1 - the SwitchCalculator program\n\n// but with a subtle\
  \ error in it\n\n//\n\n#include <cstdio>\n\n#include <cstdlib>\n\n#include <iostream>\n\
  \nusing namespace std;\n\n// prototype declarations\n\nint calculator(char cOperator,\
  \ int nOper1, int nOper2);\n\nint main(int nNumberofArgs, char* pszArgs[])\n\n{\n\
  \n// enter operand1 op operand2\n\nint nOper1;\n\nint nOper2;\n\nchar cOperator;\n\
  cout << “Enter ‘value1 op value2’\\n”\n\n<< “where op is +, -, *, / or %:” << endl;\n\
  cin >> nOper1 >> cOperator >> nOper2;\n\n// echo what the user entered followed\
  \ by the\n// results of the operation\n\ncout << nOper1 << “ “\n\n<< cOperator <<\
  \ “ “\n\n<< nOper2 << “ = “\n\n<< calculator(cOperator, nOper1, nOper2)\n\n<< endl;\n\
  \n// wait until user is ready before terminating program\n\n// to allow the user\
  \ to see the program results\n\nsystem(“PAUSE”);\n\nreturn 0;\n}\n\n// calculator\
  \ -return the result of the cOperator\n// operation performed on nOper1 and nOper2\n\
  \nint calculator(char cOperator, int nOper1, int nOper2)\n{\n\nint nResult = 0;\n\
  \nswitch (cOperator)\n\n{\n\ncase ‘+’:\n\nnResult = nOper1 + nOper2;\n\ncase ‘-’:\n\
  \nnResult = nOper1 - nOper2;\n\nbreak;\n\ncase ‘*’:\n\ncase ‘x’:\ncase ‘X’:\n\n\
  nResult = nOper1 * nOper2;\n\nbreak;\n\ncase ‘/’:\n\nnResult = nOper1 / nOper2;\n\
  \nbreak;\n\ncase ‘%’:\n\nnResult = nOper1 % nOper2;\n\nbreak;\n\ndefault:\n\n//\
  \ didn’t understand the operator\n\ncout << “ is not understood”;\n\n}\n\nreturn\
  \ nResult;\n}\n```\n\n该程序的开头与它的前身 `SwitchCalculator` 相同，只是增加了新创建的 `calculator()`\
  \ 函数的原型声明。注意这里 `main()` 变得整洁了多少：它提示用户输入，然后回显输出以及来自 `calculator()` 的结果。非常干净。\n\n\
  `calculator()` 函数也比以前更简单，因为它所做的只是执行由 `cOperator` 指定的计算。那些提示用户输入并显示结果的无关代码都消失了。\n\
  \n现在剩下的做的就是测试结果。\n\n## 执行单元级测试\n\n将程序拆分为函数不仅允许你分段编写程序，还允许你单独测试程序中的每个函数。在 `SwitchCalculator`\
  \ 程序的这个函数版本中，我需要通过向函数提供所有可能的输入（包括合法的非法的）来测试 `calculator()` 函数。\n\n首先，我为 `calculator()`\
  \ 生成了一组测试用例。显然，我需要对 `switch` 语句中的每个用例进行测试。我还需要一些边界条件，例如“当被要求除以 0 时，函数如何响应？”。表 13-1\
  \ 概述了我需要测试的一些用例。\n\n### 表 13-1 `calculator()` 的测试用例，显示预期结果和实际结果\n\n| 运算符 | 操作数 1\
  \ | 操作数 2 | 预期结果 | 实际结果 | 解释 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| +\
  \ | 10 | 20 | 30 | | 简单情况 |\n| - | 20 | 10 | 10 | | 简单情况 |\n| - | 10 | 20 | −10\
  \ | | 生成负数 |\n| * | 10 | 20 | 200 | | 简单情况 |\n| * | 10 | −5 | −50 | | 使用负参数尝试 |\n\
  | X | 10 | 20 | 200 | | 使用乘法运算符的另一种形式 |\n| / | 20 | 10 | 2 | | 简单情况 |\n| / | 10\
  \ | 0 | 产生错误且程序不崩溃即可 | | 尝试除以 0 |\n| % | 23 | 10 | 3 | | 简单情况 |\n| % | 20 | 10 |\
  \ 0 | | 生成零结果 |\n| % | 23 | −10 | 3 | | 尝试对负数取模 |\n| y | 20 | 10 | 产生错误且程序不崩溃即可\
  \ | | 非法输入 |\n\n事实证明，在这种情况下我是幸运的——调用函数 `main()` 允许我向函数提供任何我输入。我可以将这些测试用例中的每一个发送给函数。\n\
  \n\n\n\n```cpp\n// operation performed on nOper1 and nOper2\n\nint calculator(char\
  \ cOperator, int nOper1, int nOper2)\n{\n  printErr(__LINE__, cOperator, nOper1,\
  \ nOper2);\n  int nResult = 0;\n\n  switch (cOperator)\n  {\n    case ‘+’:\n   \
  \   printErr(__LINE__, cOperator, nOper1, nOper2);\n      nResult = nOper1 + nOper2;\n\
  \    case ‘-’:\n      printErr(__LINE__, cOperator, nOper1, nOper2);\n      nResult\
  \ = nOper1 - nOper2;\n      break;\n    case ‘*’:\n    case ‘x’:\n    case ‘X’:\n\
  \      printErr(__LINE__, cOperator, nOper1, nOper2);\n      nResult = nOper1 *\
  \ nOper2;\n      break;\n    case ‘/’:\n      printErr(__LINE__, cOperator, nOper1,\
  \ nOper2);\n      nResult = nOper1 / nOper2;\n      break;\n    case ‘%’:\n    \
  \  printErr(__LINE__, cOperator, nOper1, nOper2);\n      nResult = nOper1 % nOper2;\n\
  \      break;\n    default:\n      // didn’t understand the operator\n      cout\
  \ << “ is not understood”;\n  }\n  return nResult;\n}\n```\n\n`printErr()` 函数显示了运算符和两个操作数的值。它还显示了调用该函数的行号。行号是由\
  \ C++ 预处理器以 `__LINE__` 符号的形式提供的。在错误消息中打印行号可以告诉我如何区分调试输出与程序的正常输出。\n\n你可以通过检查这个新配备版本的程序的输出来查看它是如何运行的：\n\
  \n输入‘value1 op value2’\n其中 op 为 +, -, *, / 或 %:\n\n10 + 20\n\n第 50 行：‘+’ 操作数 1 =\
  \ 10，操作数 2 = 20\n\n第 55 行：‘+’ 操作数 1 = 10，操作数 2 = 20\n\n第 58 行：‘+’ 操作数 1 = 10，操作数\
  \ 2 = 20\n\n10 + 20 = -10\n\n按任意键继续 . . .\n\n图 13-1 显示了 CodeBlocks 编辑器中的程序显示，包括左侧的行号。\n\
  \n**图 13-1：** CodeBlocks 编辑器中 `calculator()` 函数的视图，显示了行号。\n\n![617977-fg1301.tif](img/617977-fg1301_fmt.jpeg)\n\
  \n在我输入“10 + 20”并按下回车键后，程序立即从第 50 行调用 `printErr()` 函数。这是因为这是函数的的第一行。检查值，你可以发现输入似乎是正确的：`cOperator`\
  \ 为‘+’，`nOper1` 为 10，`nOper2` 为 20，正如你预期的那样。\n\n下一次调用 `printErr()`发生在第 55 行，这是加法分支的第一行，同样符合预期。值没有变化，所以一切看起来都正常。\n\
  \n接下来的一行完全出乎意料。由于某种原因，`printErr()` 在第 58 行被调用。这是减法分支的第一行。由于某种原因，控制直接从加法分支穿透到了减法分支。\n\
  \n然后我发现了！加法分支末尾缺少了 `break` 语句。程序正确地计算了和，然后穿透到下一个分支，并用差值覆盖了该值。\n\n首先，我添加了缺失的 `break`\
