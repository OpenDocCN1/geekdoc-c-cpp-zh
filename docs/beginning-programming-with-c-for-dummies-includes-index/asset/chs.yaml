  \n### 从 Code::Blocks 环境向你的程序传递参数\n\n你可以通过在 Code::Blocks 内部向程序传递参数，只需选择 `Project⇒Set\
  \ Projects’ Arguments`。这将打开如图 18-9 所示的对话框。在 `Program Arguments` 输入字段中输入参数。\n\n**图\
  \ 18-9：** 你可以设置参数。\n\n\n\n\n你可以将不同类型的关联数据存储在所谓的“并行数组”中。例如，我可能会使用一个名为 `pszFirstNames`\
  \ 的字符串数组来存储人的名字，第二个名为 `pszLastNames` 的数组来存储姓氏，第三个名为 `nSocialSecurities` 的数组来存储对应的社会安全号。我存储数据的方式使得任何给定的索引\
  \ `n` 都能指向特定个人的数据。\n\n因此，我的个人数据可能位于偏移量 `3` 处。在这种情况下，`szFirstNames[3]` 将指向“Stephen”，“`szLastNames[3]`\
  \ 将指向“Davis”，而 `nSocialSecurityNumbers[3]` 将包含 . . …… 嗯，你明白我的意思。这在图 19-1 中所示。\n\n\
  **图 19-1：** 在不支持类的语言中，并行数组有时被用于存储一组相关但不同类型的数据。\n\n![617977-fg1901.eps](img/617977-fg1901_fmt.jpeg)\n\
  \n这种方法虽然可行，但它很容易出错，因为除了索引之外，没有什么能直接将名字、姓氏和社会安全号关联起来。你可以很容易想象，如果这里那里漏掉一条指令，我就会变成“Stephen\
  \ Eddins”或任何其他姓氏的随机组合。\n\n幸运对我们来说，C++ 提供了一种更好的方法。\n\n## 类 (The Class)\n\n名字或社会安全号如果脱离了所属者的语境，就没有任何意义——这类数据必须通过与其它相关数据的关联来创建一个语境。我们希望能够创建一个结构体，例如\
  \ `Person`，它包含了构成人的所有相关属性（在本例中，为名字、姓氏和社会安全号）。\n\nC++ 使用一种名为 `class`（类）的结构，其格式如下：\n\
  \n```cpp\nclass Person\n{\npublic:\nchar szFirstName[128];\nchar szLastName[128];\n\
  int nSocialSecurityNumber;\n};\n```\n\n类的定义以关键字 `class` 开头，后面紧跟类名以及一个左大括号。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 类名的命名规则与变量名相同：第一个字母必须是‘a’到‘z’或‘A’到‘Z’之间的字母，或者是下划线。名称中的后续每个字符必须是这些字符或数字‘0’到‘9’。按照惯例，类名始终以大写字母开头。类名通常由多个单词组合而成，每个单词都以大写字母开头。\n\
  \n在早期示例中，左大括号内的第一个关键字始终是 `public`。我将在第 24 章中描述 `public` 的替代方案，但目前只需将其视为声明的一部分即可。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 你也可以使用关键字 `struct` 来代替 `class`。`struct` 在各个方面都与 `class`\
  \ 相同，区别在于 `struct` 假设成员是公共的。由于历史原因，`class` 术语在 C++ 中更流行，而 `struct` 术语在 C 程序中使用更多。\n\
  \n`public` 关键字之后是描述该类的各项条声明。`Person` 类包含两个用于名字和姓氏的数组，以及第三个存储社会安全号的项。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 类中的项被称为类的成员（members）或属性（properties）。\n\n## 对象 (The Object)\n\n在 C++ 中声明一个 `class`\
  \ 就像定义一个新变量类型。你可以按照如下方式创建类的新实例：\n\n```cpp\nPerson me;\n```\n\n类的实例被称为**对象**（object）。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 人们对 `class` 和 `object` 之间的区别感到困惑；有时人们甚至互换这两个术语。实际上，通过例子很容易解释这种区别。`Dog`\
  \ 是一个 `class`。我的狗 Lollie 是一个 `dog` 的实例。我的另一只狗 Jack 是另一个、独立的 `dog` 实例。`Dog` 是一个 `class`；`lollie`\
  \ 和 `jack` 是对象。\n\n你可以通过在对象名后加上点和成员名来访问对象的成员，如下所示：\n\n```cpp\nPerson me;\nme.nSocialSecurityNumber\
  \ = 456789012;\ncin >> me.szLastName;\n```\n\n这里 `me` 是 `Person` 类的对象。元素 `me.nSocialSecurityNumber`\
  \ 是 `me` 对象的成员或属性。`me` 的类型是 `Person`。`me.nSocialSecurityNumber` 的类型是 `int`，其值被设置为\
  \ `456-78-9012`。`me.szLastName` 的类型是 `char[]`（读作“字符数组”）。\n\n类对象在创建时可以如下方式初始化：\n\n\
  ```cpp\nPerson me = {“Stephen”, “Davis”, 456789012};\n```\n\n赋值是默认情况下为用户定义类定义的唯一操作。其用法在此所示：\n\
  \n```cpp\nPerson copyOfMe;\ncopyOfMe = me; // 将 me 的每个成员拷贝到 copyOfMe\n```\n\n默认赋值运算符将右侧对象的成员拷贝到左侧成员。赋值运算符两侧的对象类型必须完全相同。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 你可以定义赋值运算符应用到类时意味着什么。\n\n##\
  \ 对象数组 (Arrays of Objects)\n\n在 C++ 中声明一个 `class` 就像定义一个新变量类型。你可以按照如下方式声明并初始化对象数组：\n\
  \n```cpp\nPerson people[5] = {{Adam”, “Laskowski”, 123456789}, {Kinsey”, 234567890},\
  \ {Janet”, 345678901}, {Stephen”, “Davis”, 456789012}, {Tiffany”, “Amrich”, 567890123}};\n\
  ```\n\n`people` 在内存中的布局如所示。这种方法虽然可行，但它很容易出错，因为除了索引之外，没有什么能直接将名字、姓氏和社会安全号关联起来。你可以很容易想象，如果这里那里漏掉一条指令，我就会变成“Stephen\
  \ Eddins”或任何其他姓氏的随机组合。\n\n幸运对我们来说，C++ 提供了一种更好的方法。\n\n**图 19-1：** 在不支持类的语言中，并行数组有时被用于存储一组相关但不同类型的数据。\n\
  \n## 查看示例 (Looking at an Example)\n\n在没有示例程序的情况下，我已经解释得足够类对象是如何出现在程序中的。下面的 `InputPerson`\
  \ 程序输入对象数组的数据。然后按社会安全号对数组进行排序并输出列表。\n\n**图 19-2：** `people` 在内存中的布局。\n\n```cpp\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \n// Person - 存储名字和社会安全号\nclass Person\n{\npublic:\nchar szFirstName[128];\nchar\
  \ szLastName[128];\nint nSocialSecurityNumber;\n};\n\n// getPerson - 从键盘读取一个 Person\
  \ 对象\n// 并返回给调用者\nPerson getPerson()\n{\nPerson person;\ncout << “\\nEnter another\
  \ Person\\n”\n<< “First name: “;\ncin >> person.szFirstName;\ncout << “Last name:\
  \ “;\ncin >> person.szLastName;\ncout << “Social Security number: “;\ncin >> person.nSocialSecurityNumber;\n\
  return person;\n}\n\n// getPeople - 读取一个 Person 数组数组\n// 返回读取的数量\nint getPeople(Person\
  \ people[], int nMaxSize)\n{\n// 继续直到操作员停止或// 直到空间不足\nint index;\nfor(index = 0;\
  \ index < nMaxSize; index++)\n{\nchar cAnswer;\ncout << “Enter another name? (Y\
  \ or N):”;\ncin >> cAnswer;\nif (cAnswer != ‘Y’ && cAnswer != ‘y’)\n{\nbreak;\n\
  }\n}\n}\nreturn index;\n}\n\nint main()\n{\n    // 排序和显示的实现细节将放在此处\n    return 0;\n\
  }\n```\n\n\n\n\n```cpp\npeople[index] = getPerson();\n\n}\n\nreturn index;\n\n}\n\
  \n// displayPerson - 在默认显示器上显示人员\nvoid displayPerson(Person person)\n{\n    cout\
  \ << “First name: “ << person.szFirstName << endl;\n    cout << “Last name : ” <<\
  \ person.szLastName << endl;\n    cout << “Social Security number : ”\n    << person.nSocialSecurityNumber\
  \ << endl;\n}\n\n// displayPeople - 显示一个 Person 对象的数组\nvoid displayPeople(Person\
  \ people[], int nCount)\n{\n    for(int index = 0; index < nCount; index++)\n  \
  \  {\n        displayPerson(people[index]);\n    }\n}\n\n// sortPeople - 根据社会安全号码对\
  \ nCount 个 Person 对象的数组进行排序\n// (这使用了冒泡排序)\nvoid sortPeople(Person people[], int\
  \ nCount)\n{\n    // 持续执行直到列表按好为止\n    int nSwaps = 1;\n    while(nSwaps != 0)\n\
  \    {\n        // we can tell if the list is in order by\n        // the number\
  \ of records we have to swap\n        nSwaps = 0;\n        // 遍历列表...\n        for(int\
  \ n = 0; n < (nCount - 1); n++)\n        {\n            // ...如果当前条目大于\n       \
  \     // 后一个条目...\n            if (people[n].nSocialSecurityNumber > people[n+1].nSocialSecurityNumber)\n\
  \            {\n                // ...就交换它们...\n                Person temp = people[n+1];\n\
  \                people[n+1] = people[n];\n                people[n] = temp;\n \
  \               // ...并计数加 1。\n                nSwaps++;\n            }\n      \
  \  }\n    }\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 为一些名字分配空间\n\
  \    Person people[128];\n    // 提示用户输入\n    cout << “Read name/social security\
  \ information\\n”;\n    int nCount = getPeople(people, 128);\n    // 排序列表\n    sortPeople(people,\
  \ nCount);\n    // 现在显示结果\n    cout << “\\nHere is the list sorted by ”\n    <<\
  \ “social security number” << endl;\n    displayPeople(people, nCount);\n    //\
  \ 在终止程序前等待用户准备好\n    // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n}\n```\n\
  \n程序开始时声明了 `Person` 类，其中包含名字、姓氏和社会安全号码的数据成员。与良好的编程习惯相反，此程序使用固定长度数组来处理名称字符串。（如果我为商业软件包编写这些代码，我会使用变长数组，或者包含一个测试以确保来自键盘的输入不会溢出缓冲区。如果你不知道我在说什么，请参阅第\
  \ 17 章。）\n\n第一个函数 `getPerson()` 提示用户输入描述单个 `Person` 对象所需的数据。然后，它将该 `Person` 的副本返回给调用者。\n\
  \n第二个函数 `getPeople()` 重复调用 `getPerson()` 函数以检索多个个人的数据。它将检索的 `Person` 对象存储在 `people`\
  \ 数组中。该函数接受 `people` 数组的最大大小作为参数，并向调用者返回存储在该处的实际元素数量。\n\n`displayPerson()` 和 `displayPeople()`\
  \ 函数是 `getPerson()` 和 `getPeople()` 函数的输出对应。`displayPerson()` 输出单个人的信息，而 `displayPeople()`\
  \ 则对 `people` 数组中定义的每个元素调用该函数。\n\n`sortPeople()` 函数按照社会安全号码的顺序对 `people` 数组的元素进行排序。该函数在“冒泡排序”侧边栏中描述。不要过于担心这个函数是如何工作的。如果你能跟上程序的其余部分，已经领先一步了。\n\
  \n该程序测试运行的输出如下：\n\n```\nRead name/social security information\nEnter another name?\
  \ (Y or N):y\nEnter another Person\nFirst name: Adam\nLast name: Laskowski\nSocial\
  \ Security number: 123456789\nEnter another name? (Y or N):y\nEnter another Person\n\
  First name: Stephen\nLast name: Davis\nSocial Security number: 456789012\nEnter\
  \ another name? (Y or N):y\nEnter another Person\nFirst name: Janet\nLast name:\
  \ Eddins\nSocial Security number: 345678901\nEnter another name? (Y or N):n\nHere\
  \ is the list sorted by social security number.\nFirst name: Adam\nLast name : Laskowski\n\
  Social Security number : 123456789\nFirst name: Janet\nLast name : Eddins\nSocial\
  \ Security number : 345678901\nFirst name: Stephen\nLast name: Davis\nSocial Security\
  \ number: 456789012\nPress any key to continue . . .\n```\n\n你已经看到了 C++ 大部分非面向对象的特性。下一章将向你介绍\
  \ Code::Blocks 调试器，它总结了专门我所谓的函数式编程的章节。之后，我将在第五部分进入面向对象编程的内容。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n## 冒泡排序\n\n本书的大部分内容都在介绍 C++ 的语法。然而，除了语言细节之外，你还需要学习常见的排序算法以成为一名熟练的程序员。冒泡排序是每个人应该掌握的算法之一。\n\
  \n许多排序算法都有自己的优势。通常情况下，简单的算法执行速度较慢，而快速算法更难以编写。冒泡排序很容易编写，但对于小数据，其简单性远大于性能开销。\n\n在冒泡排序中，程序多次遍历数组。在每次遍历中，它将每个元素与下一个元素进行比较。如果\
  \ `N` 小于 `N+1`，那么这两个已经是有序的，冒泡排序不采取行动。然而，如果 `N` 大于 `N+1`，冒泡排序就会交换它们并处理下一个元素。在实践中，如下：\n\
  \n```cpp\nif (people[n].nSocialSecurityNumber > people[n+1].nSocialSecurityNumber)\n\
  {\n    // ...就交换它们...\n    Person temp = people[n+1];\n    people[n+1] = people[n];\n\
  \    people[n] = temp;\n    // ...并计数加 1。\n    nSwaps++;\n}\n```\n\n在对数组进行第一次遍历后，最大的元素将移动末尾，但数组的其他部分仍然没有顺序。然而，反复遍历数组会导致每个元素“泡”到正确的位置。冒泡排序通过在遍历列表之前将\
  \ `nSwaps` 清零来设置每次遍历的交换次数。该算法并不真正关心执行了多少交换；如果执行了任何交换，那么数组就没有序。\n\n然而，一旦冒泡排序能够完全遍历列表而不执行任何交换，它就知道数组是有序的。\n\
  \n图中展示了冒泡排序如何对整数数组排序。在第一次遍历列表期间执行了两次交换。在第二次遍历中，算法只执行了一次交换。结果列表是有序的，但只有当它完全遍历数组而没有进行任何交换时（如第三次遍历所示），算法才知道这一点。此时，冒泡排序结束了。\n\
  \n## 第 20 章：调试你的程序，第 3 部分\n\n### 本章内容\n- 使用内置调试器进行调试\n- 使用带有调试信息的版本来构建你的应用程序\n-\
  \ 设置断点\n- 单步执行程序\n- 修复示例问题\n\n我在第二部分（第 8 章）和第三部分（第 13 章）结束时介绍了一些寻找错误的技巧。现在你已经接近第四部分的结束，我想最后提一下调试技术。在本章中，我向你介绍了\
  \ Code::Blocks 开发环境中内置的调试工具（大多数其他环境也有类似的工具）。学习使用调试器将让你清晰地了解程序正在做什么（以及在某些时候没有做什么）。\n\
  \n\n\n\n\n# 一种新的调试方法\n\n第 8 和第 13 章演示了如何在关键位置添加输出语句来发现问题。输出关键变量可以让你看到程序计算的中间值，以及它在\
  \ C++ 代码中执行的路径。\n\n然而，输出技术有几个明显的缺点。第一个是很难知道应该显示什么。在小型程序中（如书中的大多数程序），你可以显示几乎所有内容——因为没有那么多变量需要费力去查。然而，在一个大型程序中，可能有成百上千个变量，特别是当你包含了数组中的所有元素时。知道要显示哪些变量可能会是一个问题。\n\
  \n第二个问题是重新编译程序所需的时间。同样，对于小型程序来说这不是问题。`Code::Blocks` 只需要几秒钟就能重新编译小型程序。在这种情况下，添加或更改输出语句花费不超过几分钟。然而，我参与过的一些项目，重新编译整个程序需要几个小时。在一个大型程序中，当你定位一个\
  \ bug 时，添加新的输出语句可能需要很长时间。\n\n最后，使用输出法调试指针问题是非常困难的。如果指针是无效的，任何使用它的尝试都会导致程序终止，而仅仅通过在\
  \ `cout` 上显示它的值，几乎不可能区分有效指针和无效指针。\n\n### 解决方案\n\n你需要的是一种在程序执行过程中停止程序并查询关键变量值的方法。这正是调试器所做的。\n\
  \n调试器实际上是内置在 `Code::Blocks` 环境中的一个工具。每个环境都有一种类型的调试器，它们都提供相同的基本功能，尽管具体的命令可能不同。调试器允许程序员控制其程序的执行。她可以一次执行程序中的一步，可以在任何点停止程序，并且可以检查变量的值。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 与标准化的 C++ 语言不同，每个调试器都有它自己的命令集。幸运的是，一旦你学会了如何使用 `Code::Blocks`\
  \ 调试器，你在学习使用你喜爱的 C++ 环境自带的调试器时就不会遇到任何困难。\n\n程序员通过在 `Code::Blocks` 环境中从键盘输入命令来控制调试器，就像她使用编辑命令修改\
  \ C++ 源代码或使用构建命令创建可执行程序一样。调试命令可以通过菜单项也可以通过热键来使用。\n\n学习如何使用 `Code::Blocks` 调试器的最好方法是使用它在你已经见过的某个程序的\
  \ bug 版本中寻找几个棘手的问题。\n\n## 傻痴虫虫学\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `Concatenate`\
  \ 程序版本（你可以在附带的光盘上找到 `ConcatenateError1`）代表了我对第 18 章 `ConcatenateHeap` 程序的第一次尝试。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 这个版本至少有两个严重的 bug，两个都在 `concatenateString()` 函数中。\n\
  \n```cpp\n//\n\n// ConcatenateError1 - 与 ConcatenatePtr 类似\n\n// 此版本有几个 bug\n//\
  \ 可以通过调试器\n// 很容易找到\n\n//\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\
  #include <cstring>\n\nusing namespace std;\n\n// concatenateString - 将两个字符串合并\n\
  // 到一个在堆上分配的数组\nchar* concatenateString(const char* pszSrc1, const char* pszSrc2)\n\
  {\n    // 分配足够长度的数组\n    int nTargetSize = strlen(pszSrc1)+strlen(pszSrc2)+1;\n\
  \    char* pszTarget = new char[nTargetSize];\n    // 首先将第一个字符串拷贝到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容拷贝\n\
  \    // 到第一个字符串的末尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ =\
  \ *pszSrc2++;\n    }\n    // 将结果字符串返回给调用者\n    return pszTarget;\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 提示用户\n    cout << \"This program accepts\
  \ two strings\\n\"\n         << \"from the keyboard and outputs them\\n\"\n    \
  \     << \"concatenated together.\\n\" << endl;\n    // 输入两个字符串\n    cout << \"\
  Enter first string: \";\n    char szString1[256];\n    cin.getline(szString1, 256);\n\
  \    cout << \"Enter the second string: \";\n    char szString2[256];\n    cin.getline(szString2,\
  \ 256);\n    // 现在将一个合并到另一个末尾\n    cout << \"Concatentate first string onto the\
  \ second\" << endl;\n    char* pszT = concatenateString(szString1, szString2);\n\
  \    // 显示结果\n    cout << \"Result: <\" << pszT << \">\" << endl;\n    // 将内存归堆\n\
  \    delete pszT;\n    pszT = NULL;\n    // 在终止程序前等待用户准备好\n    // 以允许用户看到程序结果\n\
  \    system(\"PAUSE\");\n    return 0;\n}\n```\n\n下面显示执行程序的结果：\n\n```\nThis program\
  \ accepts two strings\nfrom the keyboard and outputs them\nconcatenated together.\n\
  Enter first string: this is a string\nEnter the second string: THIS IS A STRING\n\
  Concatentate first string onto the second\nResult: <THIS IS A STRING>\n```\n\n###\
  \ 启动调试器\n\n假设我已经告诉 `Code::Blocks` 在可执行文件中包含调试信息。\n\n我有相当把握问题出在 `concatenateString()`\
  \ 函数本身。因此，我决定在调用 `concatenateString()` 时停止程序执行。为了这一点，我需要执行所谓的“设置断点”。\n\n断点是向调试器发送的一个命令，表示如果运行到这里，就停止程序执行。至少有四种设置断点的方法，它们都是等效的：\n\
  \n- 点击第 60 行行号右侧的区域（图 20-2）。\n- 右键点击第 60 行，从出现的菜单中选择 `Toggle Breakpoint`（它是第一个选项）。\n\
  - 将光标放在第 60 行并选择 `F5` (`Toggle Breakpoint`)。\n\n\n\n\n\n将光标置于第 60 行并选择 `Debug⇒Toggle\
  \ Breakpoint`。\n\n对于本章中描述的几乎每一个其他调试器命令，都有多种方法进入，但为了简洁起见，我只描述一种。你可以通过实验找到其他方法。\n\n\
  在行号右侧会出现一个小小的停止符号，如图 20-2 所示。\n\n**图 20-2：** 一个小小的红色停止符号表示指定位置已设置断点。\n\n![617977-fg2002.eps](img/617977-fg2002_fmt.jpeg)\n\
  \n要启动程序，我选择 `Debug⇒Start`。起初，程序似乎运行得正常。它首先提示我输入第一个字符串，接着提示我输入第二个字符串。然而，当我输入该字符串时，程序似乎停止了，源代码显示器的停止符号内部出现了一个小小的黄色箭头。如图\
  \ 20-3 所示。这个小小的黄色箭头是当前位置指示器。它指向下一个将执行的 C++ 行。\n\n**图 20-3：** 当程序遇到断点时，程序停止执行，并在下一行执行处出现一个小小的黄色箭头。\n\
  \n![617977-fg2003.eps](img/617977-fg2003_fmt.jpeg)\n\n你从图 20-3 中还会注意到另一个工具栏出现了。调试器工具栏包含了最常用的调试命令，包括我在本章中演示的大部分命令。（我为本章稍后描述的命令添加了注记。）\n\
  \n### 使用调试器在程序中导航\n\n好了，我已成功地使用调试器在程序中间停止了执行。现在我能做什么？\n\n我将从逐条语句执行 `concatenateString()`\
  \ 函数开始。我可以在函数的第一条指令处设置新断点，但在每行上都设置新断点是乏味的。幸运的是，Code::Blocks 调试器提供了一个更方便的选择：`Step\
  \ Into`（单步进入）命令。\n\n![tip.eps](img/tip_fmt.jpeg) 在调试栏上，这是从左边数的第五个命令。然而，如果你感到困惑，此菜单有工具提示（Tool\
  \ Tips）——只需指向工具栏上的命令并保持箭头静止。几秒钟，命令的名称就会弹出。或者你可以从主菜单选择 `Debug⇒Step Into`。\n\n`Step\
  \ Into` 命令执行单条 C++ 语句；在这种情况下，该命令进入函数调用。执行在 `concatenateString()` 中的第一条可执行语句之前立即停止。接下来，我选择\
  \ `Debug⇒Debugging Windows⇒Watches`（监视窗口）来显示图 20-4 所示的窗口。从这个窗口，我看到函数的两个参数 `pszSrc1`\
  \ 和 `pszSrc2` 似乎是正确的。\n\n![remember.eps](img/remember_fmt.jpeg) 此时 `nTargetSize`\
  \ 和 `pszTarget` 的值意义，因为它们还没有初始化。\n\n**图 20-4：** 监视窗口显示了函数的参数以及任何局部定义的变量。\n\n![617977-fg2004.eps](img/617977-fg2004_fmt.jpeg)\n\
  \n我可以再次选择 `Step Into` 以向前移动，但这会将我进入 `strlen()` 函数。由于这些是 C++ 库例程，我愿意接受它们运行正常。\n\n\
  另一个选项被称为 `Next Line`（逐行执行）。`Next Line` 跳到当前函数中的下一行 C++ 代码，将函数调用视为与任何其他 C++ 命令一样。\n\
  \n![tip.eps](img/tip_fmt.jpeg) `Step Into` 和 `Next Line` 合称为单步执行命令。对于函数调用以外的命令，这两个命令是等价的。许多调试器使用\
  \ `Step Over`（单步跳过）术语而非 `Next Line` 来强调与 `Step Into` 的区别。\n\n我从调试栏选择 `Next Line`。注意当前位置指针如何从第\
  \ 21 行移动到第 22 行，如图 20-5 所示。此外，`nTargetSize` 变量在监视窗口中被高亮显示，表示其值已更改。`nTargetSize`\
  \ 的值现在是 38，即两个字符串和的正确长度。\n\n**图 20-5：** 选择 `Next Line` 将当前位置指针移动到第 22 行并初始化 `nTargetSize`。\n\
  \n![617977-fg2005.eps](img/617977-fg2005_fmt.jpeg)\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你需要绝对清楚刚刚发生了什么。你看到的只是屏幕闪烁，当前位置指针向下移动一行。实际发生的情况是调试器在第 22 行设置了一个临时断点，然后从第 21 行重新启动程序。程序执行了两次\
  \ `strlen()` 调用，然后执行了加法，并将结果存储在 `nTargetSize` 中。你可能只看到执行了一行代码，但实际上在 `strlen()` 函数内部执行了许多行\
  \ C++ 代码（实际上执行了两次）。\n\n到目前为止一切顺利，所以我又点击几次 `Next Line` 直到进入 `while` 循环。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 这个 `while` 循环的结构与你看到的略有不同。这个 `while` 循环的结构与你之前看到的略有不同（注：原文此处重复，已按意翻译）。在这里，我在 `while`\
  \ 循环本身中递增指针，而不是在 `for` 循环赋值语句中，如下：\n\n```cpp\nwhile(*pszSrc1 != '\\0')\n{\n    *pszSrc++\
  \ = *pszSrc1++;\n}\n```\n\n程序的第 27 行说，“将 psz1 存入目标”。图 20-6 显示了我在执行几次循环后在监视窗口中的高亮显示。\n\
  \n**图 20-6：** while 循环递增了 pszTarget。\n\n![617977-fg2006.eps](img/617977-fg2006_fmt.jpeg)\n\
  \n此外注意到指向 `pszSrc1` 的字符串似乎在缩小。这是因为随着 `pszSrc1` 递增，它最终指向空字符。那时控制将离开 `while` 循环并继续。\n\
  \n但等等！指向 `pszTarget` 的字符串并没有增长。记住意图是将 `pszSrc1` 的内容复制到 `pszTarget`。发生了什么？\n\n思考片刻，答案显而易见：我同时也改变了\
  \ `pszTarget` 的值，并留下了复制的字符。这就是我的函数最初错误所在。现在我知道了问题（至少是一个问题），我通过点击调试栏上的 `Stop Debugger`\
  \ 停止调试器。控制应用程序对话框立即消失，Code::Blocks 显示返回到用于编辑的界面\n\n### 修复（第一个）错误\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 为了解决我发现的问题，我只需要保存 `new` 返回的值并返回它，而不是函数修改后的 `pszTarget` 指针。这里只包含修改后的 `concatenateString()`\
  \ 函数（整个程序位于随附的光盘中，命名为 ConcatenateError2）：\n\n```cpp\nchar* concatenateString(const\
  \ char* pszSrc1, const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    char* pszT = pszTarget; // 保存返回的指针\n\n    // 首先将第一个字符串复制到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n\n    // 现在将第二个字符串的内容复制到\n\
  \    // 第一个字符串的结尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n\n    // 返回原始指针给调用者\n    return pszT;\n}\n```\n\n\n\n我重新构建了应用程序，然后重复之前的步骤，单步执行\
  \ `concatenateString()` 内部的循环。图 20-7 显示了执行七次循环后的显示。\n\n**图 20-7：**更新后的 `concatenateString()`\
  \ 函数的 Watches（监视）窗口显示了正在 `pszT` 指向的数组中构建字符串。\n\n![617977-fg2007.eps](img/617977-fg2007_fmt.jpeg)\n\
  \n注意 `pszT` 如何指向一个包含源字符串前七个字符的数组。此外，注意 `pszTarget` 的值比 `pszT` 大了 7。\n\n但也要注意 `pszT`\
  \ 字符串中在 `this is` 之后的所有垃圾字符。`Code::Blocks` 显示了额外的垃圾字符，是因为目标字符串没有终止空字符符。它现在不需要终止符，因为我还没有完成它的构建。\n\
  \n### 寻找并修复第二个错误\n\n这两个源字符串并不长，因此我使用 `Next Line`（逐行执行）命令执行整个循环。图 20-8 显示了最后一次执行第二个循环后的\
  \ Debug（调试）窗口。在这里，`pszT` 指向已完成的目标字符串，两个源字符串拼接在一起。然而，由于没有终止空字符，字符串在最后一个字符之后仍然显示为垃圾字符。\n\
  \n**图 20-8：**最后一次执行第二个循环后的 Debug 窗口。\n\n![617977-fg2008.tif](img/617977-fg2008_fmt.jpeg)\n\
  \n由于我已经完成了该函数，我从 `Code::Blocks` 菜单中选择了 `Debug⇒Continue`。这使得调试器从程序停止的地方继续运行，并继续运行到下一个断点或程序结束，以先到者为准。\n\
  \n果如其其，显示的拼接数组包含了我在调试器中看到的垃圾字符：\n\n```\nThis program accepts two strings\nfrom the\
  \ keyboard and outputs them\nconcatenated together.\n\nEnter first string: this\
  \ is a string\nEnter the second string: THIS IS ALSO A STRING\nConcatentate first\
  \ string onto the second\nResult: <this is a stringTHIS IS ALSO A STRING![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)>\n\
  Press any key to continue . . .\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 如果我没有包含终止空字符，那么是什么导致 `concatenateString()` 返回的字符串终止了呢？为什么字符串没有继续显示好几页？简短的回答是：“什么都没有”。可能是\
  \ C++ 必须显示成千上万个字符，最终才会遇到一个包含空字符的字符。在实践中，这种情况很少发生。零是内存中最常见的值。你通常不需要找太远就能找到一个包含零的字节，从而终止字符串。\n\
  \n要解决这个问题，我所做的是在最后一个 `while` 循环之后添加一个终止空字符：\n\n```cpp\nchar* concatenateString(const\
  \ char* pszSrc1, const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    char* pszT = pszTarget; // 保存用于返回的指针\n\n    // 首先将第一个字符串拷贝到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n\n    // 现在将第二个字符串的内容拷贝到\n\
  \    // 第一个字符串的末\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n\n    // 添加终止 NULL\n    *pszTarget = '\\0';\n\n    // 将未修改的指针返回给调用者\n  \
  \  return pszT;\n}\n```\n\n在调试器中执行此版本将创建如图 20-9 所示的显示。注意，一旦添加了终止空字符，`pszT` 指向的字符串就魔术般“清理”了，丢失了在我放入那里的数据之后的所有垃圾字符。\n\
  \n![remember.eps](img/remember.jpeg)\n\n***\n\n### 第 21 章：什么是面向对象编程？\n\n## 什么是面向对象编程？\n\
  \n本章内容\n### 抽象化细节\n### 将面向对象的方法与函数式方法进行对比\n### 对事物分类\n\n日常生活中的对象无处不在。就在我面前有一把椅子、一张桌子、一台电脑和一个红杯子。我可以毫不困难地根据属性将这些对象分类。例如，杯子是一个容器，它还是热绝缘体，所以我可以用它盛装热的或冷的东西，它有质量，所以我可以把它当作镇纸或或向狗扔。面向对象编程将这种世界观应用于编程。为了解释我的意思，让我从一个故事说起。\n\
  \n### 抽象与微波炉\n\n有时当我儿子一起看足球时，我会快速做一批墨西哥玉米片（nachos）。注意，这并不复杂——我往盘子里倒一些玉米片，撒上压制豆泥、奶士和一些墨西哥辣椒，然后放入微波炉中加热五分钟。使用微波炉时，我打开门，把玉米片放在里面，按下面板上的几个按钮，然后点击开始。几分钟后，铃声响告诉我它们好了。如果我做错了，微波炉会向我鸣叫并不启动。有时它会在小屏幕上显示错误信息。\n\
  \n这听起来并不深奥，只有当你考虑到我使用微波炉时没有做的事情时，它才变得意义：\n\n我将自己限制在微波炉的前面板上。我不查看外壳内部。我不查看告诉处理器单元该做什么的代码列表。我不研究贴在外壳内侧壁上的接线图。\n\
  \n为了让微波炉工作，我并没有重写或更改其内部的任何内容。我用来制作玉米片的微波炉，就是我之前用来加热热狗的同一台微波炉（我们家里只有健康食品）。它也将将是我明天用来加热麦片片的同一台微波炉（假设它没坏的话）。\n\
  \n\n\n\n这些并不是什么深刻的洞察。人类在任何时刻能思考的内容都是有限的。我们倾向于通过抽象掉所有小细节来减少需要处理的事物。这使我们能够在与尝试解决的问题相匹配的细节水平上工作。\n\
  \n注意：在面向对象（OO）术语中，这种细节水平被称为**抽象级别**。\n\n当我做墨西哥玉米卷（nachos）时，我把我的微波炉看作一个黑盒。除非它坏了，否则我并不关心那个盒内部发生了什么。那时，我可能会拆下顶盖，看看能不能弄清楚哪里出了问题；那时，我就在另一个抽象级别上工作了。我仍然不会拆开电路板上芯片的顶部，也不会尝试拆解单个组件。（我没那么疯狂。）\n\
  \n只要微波炉还在加热食物，我就把自己限制在它向外界暴露的接口上：键盘和 LCD 显示屏。非常重要的一点是，通过这个界面，我做的任何事情都不会导致微波炉：\n\n\
  * 进入不一致的状态并崩溃（导致我必须重启微波炉）\n* 更糟糕的是，把我的墨西哥玉米卷变成变成焦黑、冒着火的团块\n* 甚至更糟，起火烧掉房子\n* 完正常的墨西哥玉米卷\n\
  \n### 功能正常的墨西哥玉米卷\n\n假设我让我儿子写一个算法来制作墨西哥玉米卷，使用第 1 章中更换轮胎相同的基本方法。他可能会写类似这样的：“打开一罐豆子，磨碎一些奶士，切开辣椒”，等等。对于加热墨西哥玉米卷的部分，他会写类似的话：“在烤箱中烹饪直到奶士融化。”\n\
  \n这种描述非常直接且完整，但它并不是函数式程序员编写制作墨西哥玉米卷程序的方式。函数式程序员生活在一个没有微波炉等对象的世界里。他们倾向于担心那些具有无数功能路径的流程图。在函数式解决方案中，控制流将从我的手指穿过微波炉的前面板，然后进入该设备的内部。很快，流向就会在复杂的逻辑路径中穿行，这些路径涉及到给某个电容器充电多久，以及是否该响“来吃饭了”的提示音了。\n\
  \n在这样的世界里，很难以抽象级别的角度来思考。没有对象，没有可以隐藏内在复杂性的抽象。\n\n### 面向对象的墨西哥玉米卷\n\n在制作墨西哥玉米卷的面向对象方法中，我将首先识别问题中的对象类型：芯片、豆子、奶士和烤箱。这些是我必须处理的名词。完成后，我将识别与每个对象相关的动词。接下来，我将仅使用之前识别出的名词和动词来解决问题。最后，然后只有在最后，我才会在软件中实现这些每一个对象。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 我在第 1 章中为你识别了与换轮胎相关的名词和动词。你剩下的工作就是使用我给给你的名词和动词来实现解决方案。\n\
  \n当我编写对象级代码时，可以说我是在基础对象的抽象级别上工作（并思考）的。我需要考虑制作一个实用的烤箱，但我还不需要考虑制作墨西哥玉米卷的过程。毕竟，我微波炉的设计师们并没有考虑过我制作零食的特定问题。相反，他们致力于设计和建造一个实用的微波炉的问题。\n\
  \n在我成功编码并测试了所需的对象后，我就可以提升到下一个抽象级别。我可以开始在制作墨西哥玉米卷的水平上思考，而不是在制作微波炉的水平上。在这一点上，可以直接把我儿子的指令翻译成\
  \ `C++` 代码。\n\n### 分类与微波炉\n\n抽象概念的关键点是**分类**。如果我问我儿子：“什么是微波炉？”他可能会说：“它是一个……的烤箱。”如果我接着问：“什么是烤箱？”他可能会回答：“它是一个……的厨房电器。”我可以一直问这个问题，在抽象阶梯上不断向上爬，直到最后得到：“它是一个东西”，这是另一种表达方式，即“它是一个对象”。\n\
  \n我儿子理解，我们这个特定的微波炉是被称为“微波炉”这类事物的**实例**。此外，他还把微波炉看作仅仅是一种特殊的烤箱，而烤箱反过来是一种特殊的厨房电器，以此此类推。\n\
  \n这种技术性的说法是，我们的烤箱是 `microwave` 类的实例。`microwave` 类是 `oven` 类的子类，而 `oven` 类是 `microwave`\
  \ 类的父类。\n\n人类进行分类。我们世界的一切的一切都被组织在分类法中。我们这样做是为了减少我们需要记忆的事物数量。例如，考虑你第一次看到混合动力汽车。广告称它为“一种革命性的汽车，与你见过的任何汽车都不同”，但你和我知道事实并非如此。当然，它的动力系统与传统汽车不同，但它仍然是一辆汽车，因此做着所有汽车都做的事情：将你和亲属从一个地方运到另一个地方。它有方向盘、座椅、电机、刹车等等。我打赌我甚至可以在没有帮助的情况下自己开一辆。\n\
  \n我不需要用我有限的存储空间填满混合动力汽车与其他汽车的所有共同点。我只需要记住“一辆混合动力汽车是一辆……的汽车”，然后加上那几件混合动力汽车特有的东西。汽车是轮式车辆的子类，轮式车辆还有其他成员，如卡车和皮卡。也许轮式车辆是交通工具的子类，交通工具包含了船只和飞机。以此类推。\n\
  \n### 为什么要这样构建对象？\n\n对于一个特定的问题，专门为之设计并建造一个微波炉，似乎是更容易的，而不是建造一个通用的烤箱对象。例如，假设我建造一个只用来做墨西哥玉米卷的微波炉。我不需要在上面放任何面板，除了一个\
  \ `START` 按钮。我总是相同的时间烹饪墨西哥玉米卷。我可以省掉所有 `DEFROST`（解冻）和 `TEMP COOK`（温度烹饪）之类的废话。微波炉可以很小。它只需要装一个大盘子。它的立方空间将完全浪费在墨西哥玉米卷上。\n\
  \n说回来，假设我直接放弃“微波炉”的概念。我真正只需要烤箱的内部。那么在食谱中，我可以放入运行它的指令：“把墨西哥玉米卷放入盒子里。将红线连接到黑线。听到轻微声。如果你打算有孩子，不要站太近。”类似的话。\n\
  \n尽管如此，函数式方法确实存在一些问题：\n\n* **过于复杂**：你不希望制作烤箱和玉米卷的细节混合在一起。如果你不能定义对象并将它们从细节泥中提取出来单独处理，你就必须同时处理问题的所有复杂性。\n\
  * **缺乏活性**：如果你需要将微波炉更换为其他类型的烤箱，只要新烤箱的接口与旧的相似，你就可以这样做。如果没有简单且清晰定义的接口，想要干净地移除一个对象类型并替换另一个是不可能的。\n\
  * **不可重用**：烤箱用于制作许多不同的菜。你不希望每次遇到新食谱就创建一个新烤箱。一旦解决过某个问题，在未来的程序中重用解决方案将是很好的。\n\n\n\n\
  \n\n编写一个通用对象的成本确实更高。但制造一个专门为玉米片（nachos）制作的微波炉会更便宜。你可以省去制作玉米片不需要的昂贵计时器、按钮等部件。然而，一旦你在多个应用中使用通用对象，那么使用一个稍微贵一点的类的成本，将远大于为每个新应用重复构建更便宜但灵活性更低的类所带来的成本。\n\
  \n## 自包含的类\n\n现在，是时候反思一下你学到的了。在面向对象的编程方法中：\n\n- 程序员确定解决问题所需的类。（我很清楚地知道，我需要一个烤箱来做正宗的玉米片。）\n\
  - 程序员创建符合问题要求的自包含类，而不必担心整个应用程序的细节。\n- 程序员使用刚刚创建的类来编写应用程序，而无需考虑它们内部是如何工作的。\n\n这种编程模型不可或缺的一部分是：每个类都对自己负责。类在任何时候都应该处于定义的状态。不能通过使用非法数据或非法顺序的正确数据调用类来导致程序崩溃。\n\
  \n后续章节中展示的 C++ 许多功能旨在赋予类保护保护自己的能力，免受那些正等着出错的程序的侵害。\n\n## 第 22 章：结构化执行：让类运行起来\n\n\
  ### 本章内容\n\n- 向类中添加成员函数\n- 定义成员函数\n- 调用成员函数\n- 从一个成员访问另一个成员\n- 重载成员函数\n\n类引入到 C\
  \ 语言中是作为组织一组不同但相关数据元素的方便方式——例如，同一个人的社会安全号码和姓名。这就是我在第 19 章中介绍它们的方式。C++ 扩展了类的概念，赋予了它们模拟现实世界对象的能力。这就是\
  \ C 和 C++ 之间的本质区别。\n\n在上章节中，我从高层次回顾了面向对象编程的概念。在本章中，我将通过研究类的活动特性使其更加具体，这些特性允许类更好地模拟我们所处的面向对象的世界。\n\
  \n### 激活我们的对象\n\nC++ 使用类来模拟现实世界的对象。然而，第 19 章中的类在这方面有所缺失，因为类会执行操作。（第 19 章中的类没有任何与它们关联的动词——它们什么都不做。）例如，考虑一个储蓄账户。`Savings`\
  \ 类需要保存所有者的姓名、可能是她的社会安全号码，肯定的还有她的账号和余额。但这些是不够的。现实世界中的对象会做事。烤箱会烹饪。储蓄账户会积累利息。定期在提前提取时收取巨额罚金。之类的操作。\n\
  \n考虑在 `Savings` 账户类中处理存款的问题。函数式程序通过函数执行操作。因此，函数程序可能会创建一个单独的函数，将想要更新的 `Savings` 账户对象的指针作为参数，然后是待存款的金额。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 现在先不要管如何传递 `Savings` 账户对象的指针。你将在下一章看到更多相关内容。\n\
  \n但这不是现实世界中储蓄账户的工作方式。当我开车来到银行窗口并告诉他们我想给我的储蓄账户存款时，柜台员并没有递给我一个账本让我在上面记录存款并写下新余额。她也没有自己亲手做。相反，她在某个终端机上输入存款金额，然后将该金额放入收银机。机器吐出一张印有新余额的存款单，她把它递给我，一切就完成了。我们双方都没有直接触碰银行的账本。\n\
  \n这看起来像是一个愚蠢的练习，但考虑一下为什么银行不按“函数式方法”办事。暂时忽略我可能在加总之前在存款末尾多加几个零的诱惑。银行不这样做的原因与我不通过在箱内部连接和断开电线来给微波炉供电的原因一样——银行希望对余额发生的情况保持严格的控制。\n\
  \n如果出了什么差错，我的储蓄账户余额增加了百万美元左右（“天哪，这是怎么发生的？”），银行有切利益去准确查明发生了什么，并确保它不再发生。我或柜台员犯的简单算术错误不足以解释那样的错误。银行有法律和信托责任维护其账户的良好。如果每个来到柜台窗口的人都能直接访问账本，它就无法做到这一点。\n\
  \n这种关注也延伸到了程序员。你晚上可以安心睡睡觉，因为并不是每个程序员都能直接访问银行余额。只有最受信任的程序员才能编写增加和减少银行余额的代码。\n\n我在这里使用“受信任”一词有两个层含义。首先，银行信任这些个人不会蓄意偷窃。然而，银行也信任这些程序员会采取所有必要的流程步骤，充分审查和测试\
  \ `deposit()` 和 `withdraw()` 函数，以确保它们没有 true 并准确地实现了银行的规则。\n\n为了让 `Savings` 类模拟现实世界的储蓄账户，它需要它自己的活动属性，如\
  \ `deposit()` 和 `withdrawal()`（在我的情况下，由于谁知道，还有 `chargePenalty()`）。只有这样，`Savings`\
  \ 类才能对其状态负责。\n\n### 创建成员函数\n\n作为类定义一部分函数被称为成员函数。类内部的数据被称为数据成员。成员函数是类的动词，而数据成员是名词。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 成员函数也被称为方法（methods），因为它们在最初的面向对象语言\
  \ Smalltalk 中被称为方法。方法在 Smalltalk 中有意义，但在 C++ 中没有特殊含义，除了说起来更容易且在对话中听起来更有面。我会尽量不让这些琐事烦你，但你会在面向对象的派对上听到这个词，所以最好习惯它。我会尽量坚持使用成员函数这个术语，但有时也会滑入技术术语。\n\
  \n注意：到目前为止看到的函数都不是类的成员，当我需要将它们与成员亲戚区分开来时，我称它们为成员函数。\n\n向类中添加成员函数有三个方面：定义函数、命名函数和调用函数。当你这样说时，显而易见。\n\
  \n### 定义成员函数\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的类如何在 `Savings` 账户类中定义两个关键成员函数\
  \ `deposit()` 和 `withdraw()`：\n\n```cpp\n// Savings - 一个简单的储蓄账户类\nclass Savings\n\
  {\npublic:\n\nint nAccountNumber;\ndouble dBalance;\n\n// deposit - 向余额存款金额；\n//\
  \ 存款必须是正数；返回\n// 结果或出错时返回零\ndouble deposit(double dAmount)\n{\n// 没有负存款——那是提款\n\
  if (dAmount < 0)\n{\nreturn 0.0;\n}\n// 好的——加到余额并返回总额\ndBalance += dAmount;\nreturn\
  \ dBalance;\n}\n\n// withdraw - 如果资金充足则执行提款\ndouble withdraw(double dAmount)\n{\n\
  \nif (dBalance < dAmount)\n{\nreturn 0.0;\n}\n\ndBalance -= dAmount;\nreturn dBalance;\n\
  }\n\n};\n\n```\n\n\n\n\n\n![remember.eps](img/remember_fmt.jpeg) 一个真实的储蓄账户类会包含许多其他信息，比如客户姓名。然而，添加这些额外的内容并无助于解释概念，因此为了保持示例尽可能短，我省略了它们。\n\
  \n你可以看到 `deposit()` 和 `withdraw()` 成员函数的定义看起来与其他任何函数完全无异，只是它们出现在类本身的定义内部。还有一些细微的差别，我将在本章稍后的部分对其进行说明。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 可以在类之外定义成员函数，正如你在本章稍后将看到的 true。\n\
  \n## 类成员的命名\n\n成员函数非常像家庭中的一员。`deposit` 函数的全名是 `Savings::deposit(double)`，就像我的全名是\
  \ Stephen Davis。除非我惹了麻烦，否则我母亲不会那样叫我。通常情况下，我的家人直接叫我的名名，Stephen。同样地，在 `Savings` 类内部，`deposit`\
  \ 函数被简单地称为 `deposit(double)`。\n\n开头的类名表示这是对 `Savings` 类成员函数 `deposit()` 的引用。`::`\
  \ 仅仅是类名与成员名之间的分隔符。类名是成员函数扩展名的一部分，就像 Stephen Davis 是我的扩展名一样。（如果你不记得扩展名了，请参阅第 11 章。）\n\
  \n![tip.eps](img/tip_fmt.jpeg) 类通常使用描述概念的名词来命名，如 `Savings` 或 `SavingsAccount`。成员函数通常使用关联的动词命名，如\
  \ `deposit()` 或 `withdraw()`。除此之外，成员函数遵循与其他函数相同的命名规范。数据成员通常使用描述特定属性的名词来命名，如 `szName`\
  \ 或 `nSocialSecurityNumber`。\n\n你可以定义一个与 `Savings` 类完全无关的 `deposit()` 函数 —— 世界上有很多\
  \ Stephen，他们与我家人没关系的 Stephen。（我的意思是字面意义上的：我认识几个与我的家人互不相干 Stephen。）例如，`Checking::deposit(double)`\
  \ 或 `River::deposit()` 很容易与 `Savings::deposit(double)` 区分开。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 非成员函数可以带有空类名出现。例如，如果存在一个不属于任何类的存款函数，它的名字将是 `::deposit()` 或简单的 `deposit()`。\n\n\
  ### 调用成员函数\n\n在向你展示如何调用成员函数之前，让我快速复习一下如何访问对象的数据成员。根据之前 `Savings` 类的定义，你可以编写以下代码：\n\
  \n```cpp\nvoid fn()\n{\n  Savings s;\n  s.nAccountNumber = 0;\n  s.dBalance = 0.0;\n\
  }\n```\n\n函数 `fn()` 创建了一个 `Savings` 对象 `s`，然后将该对象的数据成员 `nAccountNumber` 和 `dBalance`\
  \ 置零。\n\n注意，以下代码是没有意义的：\n\n```cpp\nvoid fn()\n{\n  Savings s1, s2;\n  nAccountNumber\
  \ = 0; // 不起作用\n  dBalance = 0.0;\n}\n```\n\n你指的是哪个 `nAccountNumber` 和 `dBalance`？是\
  \ `s1` 或 `s2` 的账户号码和余额？还是完全另一个对象？对数据成员的引用只有在对象的上下文中才有意义。\n\n调用成员函数的方法是一样的。你必须先创建一个对象，然后就可以在该对象上调用成员函数：\n\
  \n```cpp\nvoid fn()\n{\n  // 创建并初始化对象 s\n  Savings s = {0, 0.0};\n  // 现在存款 100\
  \ 美元\n  s.deposit(100.0);\n  // 或者取款\n  s.withdraw(50.0);\n}\n```\n\n调用成员函数的语法看起来像是访问数据成员的语法与调用函数语法的结合体。点符号的右侧看起来像传统的函数调用，但在点符号左侧是一个对象。\n\
  \n当你思考时，这种语法是有意义的。在调用 `s.deposit()` 时，`s` 是要执行 `deposit()` 的储蓄对象。如果你不知道向哪个账户存款，就无法存款。没有对象的情况下调用成员函数，比没有对象的情况下引用数据成员毫无意义。\n\
  \n## 从成员函数内部访问其他成员\n\n我能预见到你的想法：你对自己重复道，“没有对象的引用，就无法访问成员。没有对象的引用就无法访问成员。你不可能……”\
  \ 然后，砰的一声，你突然开窍了。`Savings::deposit()` 看起来恰好就是这样做：\n\n```cpp\ndouble deposit(double\
  \ dAmount)\n{\n  // 不允许负数存款 - 那是取款\n.  if (dAmount < 0)\n  {\n    return 0.0;\n\
  \  }\n  // 好的 - 加到余额并返回总额\n  dBalance += dAmount;\n  return dBalance;\n}\n```\n\n\
  `Savings::deposit()` 函数在没有显式引用任何对象的情况下引用了 `dBalance`。这就像那个电视节目：“它们是怎么做到的？”\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 所以，好吧，到底是怎样的？你能不能在没有对象的情况下引用成员？相信我，答案是不行的。当你没有引用对象的情况下引用成员时，这种引用被称为“当前对象”。什么是当前对象？为了简洁起见，我在这里提取了示例的关键元素：\n\
  \n```cpp\nclass Savings\n{\npublic:\n  int nAccountNumber;\n  double dBalance;\n\
  \  double deposit(double dAmount);\n};\n\nvoid fn()\n{\n  // 创建并初始化两个对象\n  Savings\
  \ s1 = {0, 0.0};\n  Savings s2 = {1, 0.0};\n  // 现在向一个账户存款 100 美元\n  s1.deposit(100.0);\n\
  \  // 然后是另一个\n  s2.deposit(50.0);\n}\n```\n\n当通过 `s1` 调用 `deposit()` 时，对 `dBalance`\
  \ 的无成员引用指向 `s1.dBalance`。在那个时刻，`s1` 是“当前对象”。在调用 `s2.deposit(50.0)` 时，`s2` 变成了当前对象。在此调用期间，对\
  \ `dBalance` 的无成员引用指向 `s2.dBalance`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ “当前对象”有一个名字。它被称为 `this`。它的类型是“当前类对象的指针”。我会在第 23 章讨论对象指针时详细介绍这一点。\n\n## 在类之后保留成员函数\n\
  \n我不喜欢 C++ 的点之一是它提供了多种方法。出于对灵活性的偏好，C++ 允许你在类之外定义成员函数，只要它们在类内部已经声明过。\n\n以下是 `withdraw()`\
  \ 函数在类之外定义的示例（再次，我省略了错误检查以使示例尽可能短）：\n\n```cpp\n// 这部分通常位于 Savings.h 头文件中\nclass\
  \ Savings\n{\npublic:\n  int nAccountNumber;\n  double dBalance;\n  double deposit(double\
  \ dAmount);\n};\n\n// 这部分出现在独立的 Savings.cpp 文件中\ndouble Savings::deposit(double\
  \ dAmount)\n{\n  dBalance += dAmount;\n  return dBalance;\n}\n```\n\n现在，`Savings`\
  \ 的定义只包含成员函数 `deposit()` 的原型声明。函数的实际定义出现在稍后。然而，注意，当它出现时，它是以完整的扩展名形式出现的，包括类名 —— 在类定义之外没有默认的类名。\n\
  \n\n\n\n你可以像重载任何其他函数一样重载成员函数。然而，请记住，类名是扩展名称的一部分。这意味着下面的代码是完全合法的：\n\n```cpp\nclass\
  \ Student\n{\npublic:\ndouble grade(); // 返回 Student 的成绩\ndouble grade(double dNewGPA);\
  \ // 设置 Student 的成绩\n};\n\nclass Hill\n{\npublic:\ndouble grade(double dSlope);\
  \ // 设置坡度\n};\n\nvoid grade(double);\n\nvoid fn()\n{\nStudent s;\nHill h;\n// 设置学生的成绩\n\
  s.grade(3.0);\n// 现在查询成绩\ndouble dGPA = s.grade();\n// 现在为山丘设置 3 度的坡度\nh.grade(3.0);\n\
  // 调用非成员函数\ngrade(3.0);\n}\n```\n\n在调用成员函数时，对象的类型与参数的数量和类型同样重要。第一次调用 `grade()` 会调用函数\
  \ `Student::grade(double)` 来设置学生的平均学点。第二次调用是 `Student::grade()`，它会返回学生的平均学分而不改变它。\n\
  \n第三次调用是一个完全无关的函数 `Hill::grade(double)`，它设置山体侧的坡度。最后一次调用是非成员函数 `::grade(double)`。\n\
  \n## 第 23 章：对象指针\n\n### 本章内容\n- 向类中添加成员函数\n- 定义成员函数\n- 调用成员函数\n- 从一个成员访问另一个成员\n\
  - 重载成员函数\n\n第 17 章和第 18 章侧重于指针维护和处理的各个方面。你可能认为，关于这个主题已经没有什么可以说的了。但在这些章节之前，我还没有介绍过“类”的概念。在本章中，我将描述指针变量与面向对象编程的交汇。本章将处理类对象指针的概念。我将描述如何创建它、如何使用它，以及在完成后如何删除它。\n\
  \n## 对象指针\n指向程序员定义类型（如类）的指针，工作原理与指向内置类型的指针基本相同：\n\n```cpp\nint nInt;\nint* pInt\
  \ = &nInt;\n\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\n\
  };\n\nSavings s;\nSavings* pS = &s;\n```\n\n第一对声明定义了一个整数 `nInt` 和一个指向整数的指针 `pInt`。指针\
  \ `pInt` 初始化为指向整数 `nInt`。\n\n同样，第二对声明创建了一个 `Savings` 对象 `s`。然后它声明了一个指向 `Savings`\
  \ 对象的指针 `pS`，并将其初始化为 `s` 的地址。`pS` 的类型是“指向 Savings 的指针”，写为 `Savings*`。\n\n当我说“等一下！还有！”时，我觉得自己就像已故\
  \ Billy Mays。相似性还在持续。下面的语句将值 1 赋值给 `pInt` 所指向的整数：\n\n```cpp\n*pInt = 1;\n```\n\n\
  同样，下面的代码为 `pS` 指向的 `Savings` 对象的账号和余额赋了值：\n\n```cpp\n(*pS).nAccountNumber = 1234;\n\
  (*pS).dBalance = 0.0;\n```\n\n![remember.eps](img/remember_fmt.jpeg) 括号是必要的，因为 `.`\
  \ 的优先级高于 `*`。如果没有括号，`*pS.nAccountNumber = 1234` 将被解释为 `*(pS.nAccountNumber) = 1234`，这意味着“将\
  \ 1234 存储在 `pS.nAccountNumber` 所指向的位置”。这会产生编译器错误，因为 `nAccountNumber` 不是指针（`pS` 也不是\
  \ `Savings`）。\n\n### 箭头语法\n我唯一能想到的是 C 语言的作者们可能字字不太好。他们在寻找表达内容的简写方式上毫不努力。这是另一个他们为了减少击键次数而发明简写的例子，发明了一个新运算符\
  \ `->` 来代表 `*()`\n\n```cpp\npS->dBalance = 0.0; // 等同于 (*pS).dBalance = 0.0\n```\n\
  \n尽管两者等价的，但箭头运算符几乎被专门使用，因为它更易读（且输入起来更方便）。然而，不要忘记这两种形式是完全等价的。\n\n### 调用所有成员函数\n使用指针调用成员函数的语法与访问数据成员相似：\n\
  \n```cpp\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\ndouble\
  \ withdraw(double dAmount);\ndouble deposit(double dAmount);\n};\n\nvoid fn()\n\
  {\nSavings s = {1234, 0.0};\nSavings* pS = &s;\n// 向 pS 指向的账户存款\npS->deposit(100.0);\n\
  }\n```\n\n此代码段的最后一条语句是“调用 `pS` 指向的对象的 `deposit()` 成员函数”。\n\n### 将对象传递给函数\n将指针传递给函数只是使用指针多种方法之一。\n\
  \n### 使用对象值调用函数\n如你所知，C++ 默认通过值传递参数给函数。如果你不知道这一点，请参阅第 11 章。复杂的用户定义对象也是按值传递的：\n\n\
  ```cpp\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\ndouble\
  \ withdraw(double dAmount);\ndouble deposit(double dAmount);\n};\n\nvoid someOtherFunction(Savings\
  \ s)\n{\ns.deposit(100.0);\n}\n\nvoid someFunction()\n{\nSavings s = {1234, 0.0};\n\
  someOtherFunction(s);\n}\n```\n\n在这里，`someFunction()` 创建了一个 `Savings` 对象 `s`。然后它将其副本传递给\
  \ `someOtherFunction()`。它是副本这一事实很重要，原因有两个：创建大型对象的副本效率可能非常低，导致你的程序运行变慢。对副本所做的更改对原始对象没有影响。\n\
  \n### 使用对象指针调用函数\n如下所示，程序员可以传递对象的地址而不是对象本身：\n\n```cpp\nclass Savings\n{\npublic:\n\
  int nAccountNumber;\ndouble dBalance;\ndouble withdraw(double dAmount);\ndouble\
  \ deposit(double dAmount);\n};\n\nvoid someOtherFunction(Savings* pS)\n{\npS->deposit(100.0);\n\
  }\n\nvoid someFunction()\n{\nSavings s = {1234, 0.0};\nsomeOtherFunction(&s);\n\
  }\n```\n\n`someOtherFunction()` 参数的类型是“指向 Savings 的指针”。这体现在 `someFunction()` 执行调用的方式上，它传递的不是对象\
  \ `s` 而是对象的地址 `&s`。在 `someOtherFunction()` 中进行的更改是永久的，因为它们引用的是原始对象而不是副本。\n\n**图\
  \ 23-1**：默认情况下，C++ 将 Student 对象 `s` 的副本传递给 `someOtherFunction()`。（注：原文在上下文中交替使用\
  \ Student/Savings）。\n\n**图 23-2**：通过传递原始 Savings 对象的地址，程序员可以避免创建原始对象的副本。\n\n###\
  \ 示例分析\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的程序演示了按值传递对象与按地址传递对象之间的区别：\n\n```cpp\n\
  // 传递 - 此程序演示了按值传递\n// 对象与按地址传递\n// 对象的区别\n//\n\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n#include <cstring>\n\nusing namespace std;\n\n// Savings -\
  \ 一个简单的储蓄账户类\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\n\
  // deposit - 将金额存款到余额；\n// 存款必须是正数；返回\n// 结果余额或出错时返回零\ndouble deposit(double dAmount)\n\
  {\n// 不允许负存款——那是取款\nif (dAmount < 0)\n{\nreturn 0.0;\n}\n// 好的 - 加到余额并返回总额\ndBalance\
  \ += dAmount;\nreturn dBalance;\n}\n\n// withdraw - 如果资金充足时执行取款\ndouble withdraw(double\
  \ dAmount)\n{\n```\n\n\n\n\n```cpp\nif (dBalance < dAmount)\n{\n    return 0.0;\n\
  }\n\ndBalance -= dAmount;\nreturn dBalance;\n}\n}\n\n// balance - 返回当前对象的余额\ndouble\
  \ balance()\n{\n    return dBalance;\n}\n};\n\n// someFunction(Savings) - 按值传递对象\n\
  void someFunction(Savings s)\n{\n    cout << \"In someFunction(Savings)\" << endl;\n\
  \    cout << \"Depositing $100\" << endl;\n    s.deposit(100.0);\n    cout << \"\
  Balance in someFunction(Savings) is \" << s.balance() << endl;\n}\n\n// someFunction(Savings*)\
  \ - 接收对象的地址\nvoid someFunction(Savings* pS)\n{\n    cout << \"In someFunction(Savings*)\"\
  \ << endl;\n    cout << \"Depositing $100\" << endl;\n    pS->deposit(100.0);\n\
  \    cout << \"Balance in someFunction(Savings) is \" << pS->balance() << endl;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Savings s = {0, 0.0};\n\
  \    // 首先，按值传递\n    someFunction(s);\n    cout << \"Balance back in main() is \"\
  \ << s.balance() << endl;\n    // 现在传递地址\n    someFunction(&s);\n    cout << \"\
  Balance back in main() is \" << s.balance() << endl;\n    // 等待用户准备就绪后再终止程序\n  \
  \  // 以允许用户看到程序结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\n该程序首先开始定义了一个传统的\
  \ `Savings` 类，其中包含 `deposit()`、`withdrawal()` 和 `balance()` 成员函数（后者仅返回当前余额）。\n\n\
  随后，该程序定义了两个重载函数 `someFunction()`，其中一个接受 `Savings` 类型的对象作为参数，另一个接受一个指向 `Savings`\
  \ 类型对象的指针（写为 `Savings*`）。这两个函数执行的操作相同：首先输出一条“我在这里处”的消息，然后向账户存入 100 元。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n### 按引用传递\n\n为了简化操作，C++ 增加了一层复杂度，允许程序员声明如下的按引用接受参数的函数：\n\n```cpp\n// 按引用传递\nvoid\
  \ someFunction(Savings& refS)\n{\n    refS.deposit(100.0); // 这会将金额存回 fn() 中的原始\n\
  \    // 对象中，尽管看起来像是\n    // 拷贝语义\n}\n\nvoid fn()\n{\n    Savings s;\n    someFunction(s);\
  \ // 传递的是引用，而不是拷贝\n}\n```\n\n这导致 C++ 将 `s` 的地址传递给函数 `someFunction(Savings)`。在函数内部，C++\
  \ 会自动为你对该地址进行解引用。其效果与你自己传递地址完全相同，不同之处 C++ 处理了指针语法。你可能会认为这让事情变得简单了（我怀疑 C++ 的作者们也是这么想的）。但在实践中，这让事情变得更复杂了，因为很难区分值和引用。\n\
  \n我提到按引用传递并不是为了鼓励你使用它，而是因为你可能会看到其他人在使用引用操作指针时并不像你那样自在。我建议你在真正精通指针之前避免使用引用。\n\n`main()`\
  \ 程序创建了一个 `Savings` 对象 `s`，并首先将其传递给 `someFunction(Savings)`。然后它将 `s` 对象的地址传递给 `someFunction(Savings*)`。\n\
  \n程序的输出如下：\n\n```text\nIn someFunction(Savings)\nDepositing $100\nBalance in someFunction(Savings)\
  \ is 100\nBalance back in main() is 0\nIn someFunction(Savings*)\nDepositing $100\n\
  Balance in someFunction(Savings) is 100\nBalance back in main() is 100\nPress any\
  \ key to continue . . .\n```\n\n注意这两个函数是如何向一个 `Savings` 账户对象存入 100 元的。然而，由于 `someFunction(Savings)`\
  \ 是在拷贝上进行存款，`main()` 中的原始对象 `s` 保持不变，正如余额为 0 所示的那样。\n\n通过将 `s` 的地址传递给 `someFunction(Savings*)`，程序允许该函数修改原始对象，因此该值在\
  \ `main()` 中“保持被修改状态”，正如控制权返回后余额为 100 元所示的那样。\n\n### 在堆上分配对象\n\n你可以使用 `new` 关键字在堆上分配对象，如下例所示：\n\
  \n```cpp\nSavings* newSavings(int nAccountNum)\n{\n    Savings* pS = new Savings;\n\
  \    pS->nAccountNumber = nAccountNum;\n    pS->dBalance = 0.0;\n    return pS;\n\
  }\n```\n\n该函数分配了一个新的 `Savings` 类对象，然后使用作为参数传递的账号数字和零余额对对其进行初始化。\n\n当你不知道需要多少个对象时，这种情况非常有用，例如第\
  \ 18 章中动态大小的字符数组。在这种情况下，我首先计算需要多少空间的字符，然后在堆上分配一个相应大小的数组。\n\n在这种情况下，我可以确定内存中一次需要多少个\
  \ `Savings` 账户，并在堆上动态分配它们。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 当然，还有如何存储未知数量的对象。C++ 提供了变长数据结构，除了固定大小数组。标准模板库 (STL) 的通用讨论超出了范围。\n\n![warning_bomb.eps](img/warning_bomb.jpeg)\
  \ \n\n# 第 24 章请勿扰：保护成员\n\n### 本章内容\n- 保护类成员\n- 为什么要这样做？\n- 类友声明\n\n我的这部分目标是从第 21\
  \ 章开始，使用 C++ 类结构建模现实世界对象。在第 22 章中，我引入了成员函数以分配属性。回到第 21 章的微波炉示例，分配属性允许我给 `Oven` 类赋予\
  \ `cook()` 和 `defrost()` 等属性。然而，这只是故事的一部分。我还没有对内部保护。只要内部暴露给任何想动它的人，我就无法对此负责。\n\n\
  通过限制某些成员的访问，本章为类加上了“盒子”。\n\n### 保护成员\n\n类成员可以使用 `protected` 关键字标记为从类外部不可访问。这与 `public`\
  \ 关键字直接相反，后者指定了所有函数可访问的成员。公共成员形成了类的接口（想象微波炉前面的键盘），而保护成员构成了内部机制。\n\n第三种类型是 `private`。`private`\
  \ 成员和 `protected` 成员之间的区别在于它们对继承的反应，我直到第 28 章才会介绍。\n\n### 到底什么是 this？\n\n在第 22 章中，我提到当前对象有一个名字：`this`。我本可以这样写\
  \ `Savings` 类：\n\n```cpp\nclass Savings\n{\npublic:\n    int nAccountNumber;\n \
  \   double dBalance;\n    double withdraw(double dAmount)\n    {\n        this->dBalance\
  \ -= dAmount;\n        return this->dBalance;\n    }\n\n    double deposit(double\
  \ dAmount)\n    {\n        this->dBalance += dAmount;\n        return this->dBalance;\n\
  \    }\n\n    double balance()\n    {\n        return this->dBalance;\n    }\n};\n\
  ```\n\n事实上，即使没有显式引用它，你一直在使用 `this`。如果你在成员函数内部没有指定对象，C++ 会假设一个指向 `this` 的引用。\n\n\n\
  \n\n将成员声明为 `protected`（保护）允许类为自己围成一个保护层。这使得类对自己的内部状态负责。如果类内部的某个地方出了问题，类本身——而不是类的作者——除了自己之外，无处可找。然而，如果任何一个函数都可以伸进去并捣乱它，那么要求程序员对类的状态负责是不公平的。\n\
  \n此外，限制类的接口可以使得对于在程序中使用该接口的程序员来说，该类变得更容易学习。通常情况下，我并不真正关心微波炉内部是如何工作的，只要我知道如何使用控制控件即可。同样，只要我理解公共成员函数的参数，我通常不会担心库类的内部工作机制。\n\
  \n最后，将类接口限制为某些选定的公共函数，可以减少类与应用程序代码之间的耦合水平。\n\n**注意：** 耦合指的是应用程序对类内部工作方式的了解程度，反之亦然。紧耦合的类对周围的应用程序有深入的了解并利用了这些知识。松耦合的类仅通过简单的、通用的公共接口工作。松耦合的类对其周围环境的了解极少，同时也隐藏了大部分自己的内部细节。松耦合的类更容易测试、调试，并且在应用程序更改时更容易替换。\n\
  \n我知道你们那些函数式编程爱好者在说什么：“你不需要某些花哨的功能来完成这一切。只需制定一条规则规定某些成员是公开访问的，而其他成员不是。”这在理论上是正确的，我甚至参加过采用此类规则的项目，但在实践中它行不通。人们初衷是好的，但只要语言没有至少阻止直接访问保护成员，这些良好的初衷就会交付产品的压力下被粉碎。\n\
  \n### 将成员设为保护\n\n在类中添加 `public:` 关键字会使后续成员变为公开可用。添加 `protected:` 关键字会使后续成员变为保护的，这意味着它们只能被同类的其他成员或显式声明为朋友的函数访问（本章稍后部分将详细介绍）。它们的作用就像开关——后一个会覆盖前面的。你可以随心所欲在\
  \ `protected` 和 `public` 之间切换。\n\n以 `Student` 类为例，它描述了大学生的显著特征。该类有以下公共成员函数：\n\n\
  - `addGrade(int nHours, double dGrade)` — 为学生添加成绩。\n- `grade()` — 返回学生的平均绩点 (GPA)。\n\
  - `hours()` — 返回为了毕业的学期时长。\n\n`Student` 的其余成员应该声明为 `protected`，以防止窥探的表达式干涉其事务。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `SimpleStudent` 程序定义了这样一个 `Student` 类，并包含一个调用这些函数的简单\
  \ `main()`：\n\n```cpp\n//\n// SimpleStudent - 此程序演示了如何使用\n// protected 关键字来保护\n\
  // 关键内部成员\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Student\n{\nprotected:\ndouble dGrade; // 学生的 GPA\nint\
  \ nSemesterHours;\n\npublic:\n// init() - 初始化学生到合法状态\nvoid init()\n{\ndGrade = 0.0;\n\
  nSemesterHours = 0;\n}\n// getGrade() - 返回当前成绩\ndouble getGrade()\n{\nreturn dGrade;\n\
  }\n// getHours() - 获取毕业所需的学期时\nint getHours()\n{\nreturn nSemesterHours;\n}\n//\
  \ addGrade - 向 GPA 和总学时添加成绩\ndouble addGrade(double dNewGrade, int nHours)\n{\n\
  double dWtdHrs = dGrade * nSemesterHours;\ndWtdHrs += dNewGrade * nHours;\nnSemesterHours\
  \ += nHours;\ndGrade = dWtdHrs / nSemesterHours;\nreturn dGrade;\n}\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n// 创建一个学生并初始化它\nStudent s;\ns.init();\n//\
  \ 添加三门课程的成绩\ns.addGrade(3.0, 3); // 一个 B\ns.addGrade(4.0, 3); // 一个 A\ns.addGrade(2.0,\
  \ 3); // 一个 C (平均应该是 B)\n// 现在打印结果\ncout << “Total # hours = “ << s.getHours()\n\
  << “, GPA = “ << s.getGrade()\n<< endl;\n// 在程序终止前等待用户就绪\n// 以允许用户看到程序结果\nsystem(“PAUSE”);\n\
  return 0;\n}\n```\n\n这个 `Student` 类保护了它的成员 `dGrade` 和 `nSemesterHours`。外部函数无法通过插入以下代码来悄悄设置自己的高\
  \ GPA：\n\n```cpp\nvoid MyFunction(Student* pS)\n{\n// 将我的成绩设为 A+\npS->dGrade = 3.9;\
  \ // 编译错误\n}\n```\n\n此赋值会产生编译错误。\n\n![tip.eps](img/tip_fmt.jpeg) 你可以从 `protected`\
  \ 或 `public` 成员开始；这并不重要。事实上，你可以随心所欲地反复切换。\n\n任何函数都可以通过 `getGrade()` 函数读取学生的 GPA。这被称为访问函数（access\
  \ function）。然而，尽管外部函数可以读取一个值，但它们不能通过此访问函数更改该值。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 访问函数也被称为获取函数（getter function，如“获取值”）。设置值的函数也被称为设置函数（setter function）。\n\n`main()`\
  \ 函数创建了一个 `Student` 对象 `s`。由于成员是保护的，它无法将 `s` 初始化为合法状态。幸运的是，`Student` 类提供了一个 `init()`\
  \ 函数供 `main()` 调用，以初始化成员到正确状态。\n\n在初始化 `s` 后，`main()` 调用 `addGrade()` 添加了三个课程，并使用访问函数打印结果。结果如下：\n\
  \nTotal # hours = 9, GPA = 3\n\n按任意键继续 . .\n\n### 所以怎样？\n\n又怎样？这有什么大不了的？“好吧，”你说，“我明白不让其他函数设置任意值的这一点，但难道就此而已了吗？”不。更深层次的观点在于这种松耦合。我选择了以尽可能简单的方式实现计算\
  \ GPA 的算法。只需花五分钟，我就可以构想出三种不同的内部存储成绩和学时的方法，每种方法都有优缺点。\n\n例如，我可以将每个成绩连同学时保存在内部数组中。这将允许学生查看进入其\
  \ GPA 的成绩。\n\n这一点在于，程序员程序员不应该关心。只要成员函数 `getGrade()` 和 `hours()` 准确计算了 GPA 和总时长，任何应用程序都不会关心。\n\
  \n现在假设学校更改了计算 GPA 的规则。例如，假设它宣布某些课程为通过/不及格，这意味着你获得了毕业学分，但该课程成绩不进入 GPA 计算。这可能需要完全重写\
  \ `Student` 类。反过来，这将需要修改任何依赖于信息存储方式的函数——即任何访问保护成员的函数。然而，那些限制在公共成员的函数不受更改的影响。\n\n\
  这才是松耦合的真正优势：对变化的忍受。\n\n# 谁需要朋友呢？\n\n偶尔，你需要让一个非成员函数访问类的保护成员。你可以通过将该函数声明为朋友（friend）来实现这一点。将一个函数声明为朋友意味着你不需要通过将其声明为公共而将保护成员暴露给所有人。\n\
  \n这就像给邻居一把钥匙，让他们在你度假期间帮忙照看你的房子。给非家人提供房屋钥匙通常不是个好主意，但比把房子门不锁着要好。\n\n\n\n\n友元声明出现在受保护（protected）成员所在的类中。友元声明由关键字\
  \ `friend` 后紧跟一个原型声明组成。在下面的示例中，`initialize()` 函数被声明为非成员。然而，`initialize()` 显然需要访问该类的所有数据成员，无论是否受保护保护：\n\
  \n```cpp\nclass Student\n{\n  friend void initialize(Student*);\n\n  protected:\n\
  \    double dGrade; // 学生的 GPA\n    int nSemesterHours;\n\n  public:\n    double\
  \ grade();\n    int hours();\n    double addGrade(double dNewGrade, int nHours);\n\
  };\n\nvoid initialize(Student* pS)\n{\n  pS->dGrade = 0.0;\n  pS->nSemesterHours\
  \ = 0;\n}\n```\n\n一个函数可以同时被声明为两个不同类的友元。虽然这看起来很方便，但它倾向于将这两个类绑定在一起。然而，有时类由于其本质就是绑定在一起的，如下面的教师-学生示例所示：\n\
  \n```cpp\nclass Student; // 前向声明\n\nclass Teacher\n{\n  friend void registration(Teacher*,\
  \ Student*);\n\n  protected:\n    int noStudents;\n    Student *pList[128];\n\n\
  \  public:\n    void assignGrades();\n};\n\nclass Student\n{\n  friend void registration(Teacher*,\
  \ Student*);\n\n  protected:\n    Teacher *pTeacher;\n    int nSemesterHours;\n\
  \    double dGrade;\n};\n```\n\n在这个示例中，`registration()` 函数可以进入 `Student` 对象设置 `pTeacher`\
  \ 指针，也可以进入 `Teacher` 对象向教师的学生列表添加学生。\n\n![tip.eps](img/tip_fmt.jpeg) 注意 `Student`\
  \ 类是如何首次出现而没有实体的。这被称为前向声明（forward declaration），它声明了程序员在模块内的某处定义 `Student` 类的意图。这有点像函数的原型声明。这通常只有在两个或多个类相互引用时才是必要的；在这种情况下，`Teacher`\
  \ 包含了对 `Student` 的引用，而 `Student` 包含了对 `Teacher` 的引用。\n\n如果没有对 `Student`的前向声明，`Teacher`\
  \ 内部对 `Student *pList[100]` 的声明将产生编译器错误，因为编译器还不知道 `Student` 是什么。调换定义的顺序，`Student`\
  \ 内部的 `Teacher *pTeacher` 声明将产生编译器错误，因为 `Teacher` 尚未被定义。\n\n前向声明通过告知编译器耐心等待——这个新类的定义很快就会到来解决了这个问题。\n\
  \n一个类的成员可以被声明为另一个类的友元：\n\n```cpp\nclass Student;\n\nclass Teacher\n{\n  // ...其他成员...\n\
  \  public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\nclass\
  \ Student\n{\n  friend void Teacher::assignGrade(Student*, int, double);\n  // ...其他成员...\n\
  };\n```\n\n整个类可以被声明为另一个类的友元。这样做的效果使得该类的每个成员函数都成为友元。例如：\n\n```cpp\nclass Student;\n\
  \nclass Teacher\n{\n  protected:\n    int noStudents;\n    Student* pList[128];\n\
  \n  public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\n\
  class Student\n{\n  friend class Teacher;\n  // ...其他成员...\n};\n```\n\n现在 `Teacher`\
  \ 的每个成员都可以访问 `Student` 的受保护成员（但反之则不然）。将一个类声明为另一个类的友元会将这些类不可分割地绑定在一起。\n\n# 第 25 章\n\
  \n## 让对象有一个良好的开始\n\n### 本章内容\n- 创建一个构造函数\n- 检查构造函数调用方式的限制\n- 复习一个示例构造函数\n- 构造数据成员\n\
  - 引入“非构造函数”——析构函数\n\n通常情况下，对象在创建时会被初始化，如下所示：\n\n```cpp\ndouble PI = 3.14159;\n```\n\
  \n对于类对象也是如此：\n\n```cpp\nclass Student\n{\n  public:\n    int nHours;\n    double\
  \ dGrade;\n};\n\nStudent s = {0, 0.0};\n```\n\n然而，如果数据元素被声明为受保护，且创建对象的函数不是该类的友元或成员（在大多数情况下它不是），那么就不再可能这样做。\n\
  \n需要其他机制在对象创建时初始化它们，这就是构造函数的用用场。\n\n### 构造函数\n\n初始化带有受保护成员的对象的一种方法是创建一个 `init()`\
  \ 成员函数，应用程序可以在对象创建时调用它。这个 `init()` 函数会将对象初始化到某个合法的起始点。事实上，这正是我在第 24 章中所做的。\n\n这种方法可行，但它并不完全符合面向对象编程的“微波炉”规则，因为它类似于建造了一个要求你在对其进行任何操作之前必须先按下\
  \ RESET 按钮的微波炉。这就像是制造商在说明书中写了一份巨大的免责声明：“在首先按下 RESET 按钮之前，不要启动任何命令序列。这样做可能会导致微波炉爆炸并杀死周围所有人，或者更糟。”（还有比这更糟的吗呢？）\n\
  \n我不是律师，但即使是我知道，如果你在说明书中加入这样的免责声明，当你因为有人被微波炉爆炸的碎片割伤而上法庭时，这并救不了你的命。\n\n一个类的成员可以被声明为另一个类的友元：\n\
  \n```cpp\nclass Student;\n\nclass Teacher\n{\n  // ...其他成员...\n  public:\n    void\
  \ assignGrade(Student*, int nHours, double dGrade);\n};\n\nclass Student\n{\n  friend\
  \ void Teacher::assignGrade(Student*, int, double);\n  // ...其他成员...\n};\n```\n\n\
  整个类可以被声明为另一个类的友元。这种效果使得该类的每个成员函数都成为友元。例如：\n\n```cpp\nclass Student;\n\nclass Teacher\n\
  {\n  protected:\n    int noStudents;\n    Student* pList[128];\n\n  public:\n  \
  \  void assignGrade(Student*, int nHours, double dGrade);\n};\n\nclass Student\n\
  {\n  friend class Teacher;\n  // ...其他成员...\n};\n```\n\n现在 `Teacher` 的每个成员都可以访问\
  \ `Student` 的受保护成员（但反之则不然）。将一个类声明为另一个类的友元会将这些类不可分割地绑定在一起。\n\n---\n\n等等，我重新审视了后面的翻译部分：\n\
