  \n### 这一部分 . . .\n\n你将学习编程计算机意味着什么。你还将首次尝试编程——我将带你通过输入、构建和执行你的第一个程序的步骤。这一部分的一切可能都会有些神秘，但我保证很快就会变得明朗。\n\
  \n### 第 1 章：什么是程序？\n\n### 本章内容\n\n- 理解程序\n- 编写你的第一个“程序”\n- 查看计算机语言\n\n在本章中，你将学习什么是程序，以及编写程序意味着什么。你将在“人类计算机”上练习。然后你将看到一些为真实计算机编写的代码片段。最后，你将看到第一个用\
  \ `C++` 编写的代码片段。\n\n到目前为止，运行在你计算机上的所有程序都是由别人写的。很快，情况将不再如此了。你将加入那少数自豪的人的行列：程序员。\n\
  \n### 我儿子和计算机有什么区别？\n\n计算机是一台速度极快但极其愚蠢的机器。计算机可以执行你告诉它的任何事情（在合理范围内），但它完全完全按照指令执行——不多，也不少。\n\
  \n在这方面，计算机几乎与人类完全相反：人类会根据直觉做出反应。当我学习第二门语言时，我了解到仅仅理解所说的话是不够的——理解那些未说出口的话同样重要，而且要困难得多。这是说话者通过共同经验或教育与听者分享的信息——那些不需要说出来的事情。\n\
  \n例如，我会对我儿子说一些话，比如“洗碗”（尽管对我没什么用）。这看起来似乎是足够清楚的指令，但该句子中包含的大部分信息是隐含且未说出口的。\n\n假设我儿子知道什么是碗，也知道脏碗通常在水池里。但刀和叉子呢？毕竟，我只说了“碗”，没有提到任何餐具，更不用说玻璃器皿了。而且我的意思是手洗它们，还是把它们放进洗碗机里自动清洗、冲洗并烘干也可以？\n\
  \n但事实是，“洗碗”对我儿子来说是充分的指令。他可以拆解这个句子并将其与我们共同分享的信息（包括对脏碗的广泛实践知识）相结合，从而对我想要他做的事情产生意义的理解——他是否真的去做那是另一回事了。我猜他理解这个句子所需的心理头脑体操时间，和我说这句话花费的时间差不多——大约是\
  \ 1 到 2 秒。\n\n计算机无法从像“洗碗”这样模糊的事情中看出任何头绪。你必须准确告诉计算机如何处理每种不同类型的碗，如何洗洗一把叉子，而不是一个勺子，或一个杯子。程序什么时候停止洗碗（也就是说，它怎么知道碗洗干净了）？\n\
  \n\n\n\n5. 安装螺母。\n6. 降下汽车。\n\n(我知道从技术上讲，螺母是将轮子固定在汽车上而不是轮胎，但这种区别在这里并不重要。在讨论中，我将“轮子”和“轮胎”同义化使用。)\n\
  \n尽管这些指令看起来非常详尽，但它们并不是一个程序。这被称为算法。算法是对要执行步骤的描述，通常处于高抽象层级。算法是详细的，但具有通用性。我可以使用这个算法来修理我经历过或将来将要经历的任何爆胎。但是，算法并不包含足够的细节，来让我们那个故意表现得迟钝的“人类计算机”完成这项任务。\n\
  \n# 换轮胎语言\n\n在编写程序之前，我们需要一种大家都能认同的语言。在本书的剩余部分，这种语言将是 `C++`，但在本示例中，我使用了新发的 `TCL`（换轮胎语言，Tire\
  \ Changing Language）。我专门针对换轮胎问题调整了 `TCL`。\n\n`TCL` 包含了换轮胎世界常见的几个名词：\n- `car`（汽车）\n\
  - `tire`（轮胎）\n- `nut`（螺母）\n- `jack`（千顶）\n- `toolbox`（工具箱）\n- `spare tire`（备胎）\n\
  - `wrench`（扳手）\n\n`TCL` 还包含了以下动词：\n- `grab`（抓取）\n- `move`（移动）\n- `release`（松开）\n\
  - `turn`（旋转）\n\n最后，执行 `TCL` 的处理器需要计数和做出简单判断的能力。这就是换轮胎机器人所理解的所有内容。任何不属于换轮胎语言的指令都会让人类换轮胎“处理器”报以困惑的呆视。\n\
  \n## 程序\n\n现在是时候将用英语编写的算法转换为用换轮胎语言编写的程序了。以“取下螺母”这个短语为例。实际上，这句话中很多内容没有明说。“移除”一词不在处理器的词汇中。此外，完全没有提到扳手。\n\
  \n以下步骤仅使用换轮胎语言中包含的动词和名词实现了“取下一个螺母”这一短语：\n1. `grab wrench`（抓取扳手）。\n2. `move wrench\
  \ to lug nut`（将扳手移动到螺母）。\n3. `turn wrench counterclockwise five times`（扳手逆时针旋转五次）。\n\
  4. `move wrench to toolbox`（将扳手移动到工具箱）。\n5. `release wrench`（松开扳手）。\n\n我没有解释换轮胎语言的语法。例如，每条命令都以单个动词开头，或者动词\
  \ `grab` 需要一个名词作为其对象，而 `turn` 需要一个名词、一个方向以及旋转次数的计数。尽管如此，这段程序片段也应该足够易读（记住，这并不是一本关于换轮胎语言的书）。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 你可以用换轮胎语言应付差事，但你必须学习每个 `C++` 命令的语法。\n\
  \n程序从第 1 步开始，并依次执行每个步骤，直到到达第 5 步。在编程术语中，我们说程序从第 1 步流到第 5 步。当然，程序并没有去任何地方——处理器在完成所有的工作，但“程序流”（program\
  \ flow）是一个通约定。\n\n即使对这个程序进行粗略检查也会发现一个问题：如果没有螺母怎么办？我假设在没有螺母的螺栓上转动扳手是无害的，但这样做浪费时间，而且这不是我目中良好的解决方案。换轮胎语言需要一种分支能力，允许程序根据外部条件采取某条路径。我们需要一个像下面这样的\
  \ `IF` 语句：\n\n1. `grab wrench`。\n2. `If lug nut is present`（如果螺母存在）\n3. `{`\n4.\
  \ `move wrench to lug nut`。\n5. `turn wrench counterclockwise five times`。\n6. `}`\n\
  7. `move wrench to toolbox`。\n8. `release wrench`。\n\n程序像以前一样从第 1 步开始并抓取扳手。然而在第二步中，在程序对着空螺栓无用地挥动扳手之前，它会检查螺母是否存在。如果是，流程将像以前一样继续第\
  \ 3、4 和 5 步。但是，如果没有，程序流将跳过这些不必要的步骤，直接进入第 7 步将扳手归工具箱。\n\n在计算机术中，你称程序执行了逻辑表达式 `is\
  \ lug nut present?`。这个表达式返回 `true`（是，螺母存在）或 `false`（否，那里没有螺母）。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 我所谓的“步骤”（steps），在语言中通常被称为“语句”（statement）。表达式是返回值的语句的一种类型，例如 `1 + 2` 就是一个表达式。逻辑表达式是一个返回\
  \ `true` 或 `false` 值的表达式，例如“这本书的作者帅吗？”是 `true`。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 换轮胎语言中的大括号是必要的，用来告诉程序当条件不成立时应该跳过哪些步骤。第 4 步和第 5 步只有在条件为真时才会执行。\n\n我意识到，如果没有螺栓要拆卸的螺母，就没必要去抓取扳手，但请配合我一下。\n\
  \n这个改进后的程序仍然有一个问题：你如何知道扳手旋转 5 次足以取下螺母？对于我熟悉的大多数轮胎来说，这肯定是不够的。你可以将次数增加到一个看起来可能过量的数字，比如\
  \ 25 次。如果螺母在第 20 次旋转后松动，那么扳手就会多转 5 次。这无害但浪费。\n\n更好的方法是在换轮胎语言中添加某种“循环并测试”语句：\n1.\
  \ `grab wrench`。\n2. `If lug nut is present`。\n3. `{`\n4. `move wrench to lug nut`。\n\
  5. `While (lug nut attached to car)`（当螺母连接在汽车上时）\n6. `{`\n7. `turn wrench counterclockwise\
  \ one turn`。\n8. `}`\n9. `}`\n10. `move wrench to toolbox`。\n11. `release wrench`。\n\
  \n程序像以前一样从第 1 步开始，从工具箱抓取扳手。然而从第 2 步开始，程序为轮子上的每个螺栓循环执行到第 12 步。\n\n在第 5 步，处理器必须做出判断：螺母是否连接？在第一轮中，我们假设答案是定的，因此处理器执行第\
  \ 7 步并逆时针旋转一次。此时，程序返回第 5 步并重复测试。如果螺母仍然连接，处理器再次重复第 7 步。最终，螺母会松动，第 5 步的条件将返回 `false`。此时，程序跳转到第\
  \ 9 步，并像以前一样继续。\n\n这个解决方案优于前一个：它对取下螺母所需的旋转次数没有任何假设。它不会因为旋转不再连接的螺母而浪费时间，也不会因为螺母只取了一半而失败。\n\
  \n尽管这个解决方案很好，但它仍然有一个问题：它只取下了一个螺母。大多数中型汽车每个轮上有五个螺母。我们可以重复第 2 到第 9 步五次，每个螺母一次。然而，这种效果也不好。大多数小型汽车只有四个螺母，而大型皮卡有八个。\n\
  \n以下程序扩展了我们的语法，包含了跨螺母循环的能力。该程序无论轮上有多少螺母都有效：\n1. `grab wrench`。\n2. `For each lug\
  \ bolt on wheel`（对于轮子上的每个螺栓）\n3. `{`\n4. `If lug nut is present`。\n5. `{`\n6. `move\
  \ wrench to lug nut`。\n7. `While (lug nut attached to car)`。\n8. `{`\n9. `turn wrench\
  \ counterclockwise one turn`。\n10. `}`\n11. `}`\n12. `}`\n13. `move wrench to toolbox`。\n\
  14. `release wrench`。\n\n该程序像以前一样从从工具箱抓取扳手开始。然而，从第 2 步开始，程序为轮上的每个螺母螺循环执行到第 12 步。\n\
  \n注意第 7 步到第 10 步仍然重复。这被称为嵌套循环。第 7 步到第 10 步被称为内层循环，而第 2 步到第 12 步是外层循环。\n\n整个程序由算法中每个步骤的相似实现组成。\n\
  \n计算机处理器\n\n\n\n\n从汽车上卸下轮子似乎是一项非常简单的任务，然而在一种专门为更换轮胎设计的语言中，仅仅需要 11 条指令才能卸下螺母。完成后，这个程序可能包含\
  \ 60 多或 70 个步骤，并有许多循环。如果再添加用于检查螺母滑丝或缺失等错误情况的逻辑，步骤会更多。\n\n想一想仅仅为了完成像在显示屏幕上移动窗口这样平淡的事情，需要执行多少条指令（记住，典型的屏幕可能显示\
  \ `1280 x 1024` 或略多一百万个像素）。幸运的是，尽管计算机处理器很笨，但它的运行速度非常快。例如，你 PC 中的处理器每秒可能可以执行几十亿条指令。你通用处理器中的指令并没有做什么太大作用——仅仅移动一个像素就需要几条指令——但当你能一次处理十亿左右条指令时，滚动区区百万像素就变成了轻而易举的事。\n\
  \n计算机不会执行任何它没有被程序设定过的事情。创建一种“换轮胎语言”并不足以解决我的爆胎问题——必须有人编写程序指令，逐步规划出计算机将要执行的每一个步骤。而编写一个旨在处理所有可能出现的特殊情况的真实世界程序并非易事。编写一个工业级的程序可能是你所承担的最具挑战性的任务。\n\
  \n所以问题变成了：“为什么要费劲呢？”因为一旦计算机经过了适当的编程，它就可以反复地、不知疲倦地执行所需的功能，而且通常比人类控制的运行速度快得多。\n\n\
  ## 计算机语言\n\n当然，“换轮胎语言”并不是一种真正的计算机语言。真实的计算机没有像“抓取”或“旋转”这样的机器指令。糟糕糟糕，计算机使用一系列 0 和\
  \ 1 来“思考”。每条内部命令都只不过是一串二进制数字。真实的计算机拥有有诸如 `01011101` 这样的指令，它可能会给特殊寄存器中的一个数字加 `1`。尽管在\
  \ `TCL` 中编程可能很困难，但通过编写长数字字符串来编程甚至更加困难。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 计算机的本质语言被称为机器语言，通常表示为用二进制（二进制）或十六进制（十六进制）编写的数字序列。以下代表了第 3 章 `Conversion` 程序中的前\
  \ 64 个字节。\n\n```\n<main+0>: 01010101 10001001 11100101 10000011 11100100 11110000\
  \ 10000011 11101100\n<main+8>: 00100000 11101000 00011010 01000000 00000000 00000000\
  \ 11000111 01000100\n<main+16>:00100100 00000100 00100100 01110000 01000111 00000000\
  \ 11000111 00000100\n<main+24>:00100100 10000000 01011111 01000111 00000000 11101000\
  \ 10100110 10001100\n<main+32>:00000110 00000000 10001101 01000100 00100100 00010100\
  \ 10001001 01000100\n```\n\n幸运的是，现在没有人用机器语言编写程序了。很早以前，有人发现人类将 `ADD 1,REG1` 理解为“向寄存器\
  \ 1 中的值加 1”，比理解 `01011101` 要容易得多。在“后机器语言时代”，程序员用这种所谓的汇编语言编写程序，然后将其提交给一个名为 `assembler`（汇编器）的程序，该程序会将每条指令转换为对应的机器语言。\n\
  \n人们编写的程序被称为 `source code`（源代码），因为它们是一切恶之源头。计算机实际执行的 0 和 1 被称为 `object code`（目标代码），因为它们是许多挫败感的对象。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 以下代表了 `Conversion` 程序在编译为在执行\
  \ Windows 的 Intel 处理器上运行时的前几条汇编指令。这与之前以二进制形式显示的信息相同。\n\n```\n<main>: push %ebp\n\
  <main+1>: mov %esp,%ebp\n<main+3>: and $0xfffffff0,%esp\n<main+6>: sub $0x20,%esp\n\
  <main+9>: call 0x40530c <__main>\n<main+14>: movl $0x477024,0x4(%esp)\n<main+22>:\
  \ movl $0x475f80,(%esp)\n<main+29>: call 0x469 <operator<<\n<main+34>: lea 0x4(%esp),eax\n\
  <main+38>: mov %eax,0(%esp)\n```\n\n## 高级语言\n\n汇编语言可能更容易记忆，但它与机器语言之间仍有很大差距。\n\n\
  人们继续创建不同的编程语言，每种语言都有自己的优缺点。像 `COBOL` 这样的语言非常啰嗦，但易于阅读。其他语言则是为非常特定的领域设计的，例如数据库语言或用于创建交互式网页的语言。\n\
  \n这些语言之一是 `COBOL`（常用业务处理语言）。`COBOL` 的理念是让程序员编写的代码尽可能像英语句子。突然，程序员开始编写像下面的句子来转换摄氏度：\n\
  \nINPUT CELSIUS_TEMP\nSET FAWRITE_TEMP TO CELSIUS_TEMP * 9/5 + 32\nWRITE FAWRITE_TEMP\n\
  \n程序的第一行从键盘或文件读取一个数字并将其入 CELSIUS_TEMP。下一行将该数字乘以 9/5 并加上 32，以计算相应的华氏度。程序将此结果存储在名为\
  \ FAWRITE_TEMP 的变量中。最后一行输出该转换后的值。\n\n## C++ 语言\n\n`C++`（顺便说一下，读作“C 加加”）是一种符号化的高级语言。`C++`\
  \ 起源于 70 年代的贝尔实验室，最初仅仅是 `C`。当时有几个人正在开发一种名为 `Unix` 的新操作系统（Linux 和 Mac OS 的原型，至今仍用于工业界和学术界）。贝尔实验室创建的原始\
  \ `C` 语言经过了微调，并于 1980 年初被采纳为国际标准。`C++` 是基础 `C` 语言的扩展，主要通过添加功能实现的。当我说 `C++` 是符号化的，我的意思是它并不啰嗦，倾向于使用符号而不是\
  \ `COBOL` 那种长单词。然而，一旦习惯了所有符号的含义，`C++` 是很容易读的。之前在 `COBOL` 中显示的相同的摄氏度到华氏度转换代码在 `C++`\
  \ 中如下：\n\n```cpp\ncin >> celsiusTemp;\nfahrenheitTemp = celsiusTemp * 9 / 5 + 32;\n\
  cout << fahrenheitTemp;\n```\n\n第一行将值读入变量 `celsiusTemp`。随后的计算像之前一样将摄氏度温度转换为华氏度，第三行输出结果。\n\
  \n`C++` 与其他高级语言相比还有其他几个优势。首先，`C++` 是通用的。几乎每种存在的计算机都有 `C++` 编译器。\n\n\n\n\n此外，C++\
  \ 是高效的。高级语言尝试自动执行的操作越多以让你的编程工作变得简单，其生成的机器码效率往往就越低。对于书中的这类大多数小型程序来说，这并不会产生影响，但在处理海量数据（例如在屏幕上移动像素）或当你追求极端的实时性能时，这会产生巨大的差异。Unix\
  \ 和 Windows 使用 C++ 编写，而 Macintosh 操作系统是用一种与 C++ 非常相似的语言编写的，这并非偶然。\n\n## 第 2 章：安装\
  \ Code::Blocks\n\n### 本章内容\n- 回顾编译过程\n- 安装 Code::Blocks 开发环境\n- 使用默认程序测试你的安装\n-\
  \ 回顾常见的安装错误\n\n在本章中，你将回顾如何从 C++ 源代码创建可执行的程序，这些程序可以在 Windows、Linux 或 Macintosh 计算机上运行。然后，你将安装书中其余部分将用到的\
  \ Code::Blocks 集成开发环境，并构建一个默认测试程序来检查你的安装情况。如果一切运行正常，当你读到本章结束时，你就准备好开始编写和构建自己的 C++\
  \ 程序了——当然，这还需要一点帮助！\n\n### 回顾编译过程\n\n创建你自己的 C++ 程序需要两个程序。首先，你需要一个可以用来输入 C++ 指令的文本编辑器。任何能够生成纯\
  \ ASCII 文本字符的编辑器都可以胜。我曾使用 Windows 自带的 `Notepad` 编辑器编写过程序。然而，一个了解 C++ 语法的编辑器会更好，因为它可以为你节省大量的打字时间，并且有时在你输入时高亮你可能犯的错误，就像拼写检查器在文字处理器中高亮拼写错误的单词一样。\n\
  \n你需要的第二个程序是编译器，它将你的 C++ 源码语句转换为计算机可以理解和解释的机器语言。这种从 C++ 源语句转换为目标机器码的过程被称为“构建”（building）。在图形上，这个过程类似于图\
  \ 2-1 所示。\n\n构建程序的过程实际上有两个步骤：C++ 编译器首先在名为“编译”（compiling）的步骤中将你的 C++ 源代码语句转换为机器可执行格式。然后，在第二步即“链接”（linking）中，它将你程序中的机器指令与\
  \ C++ 标准库集中的指令结合，从而创建一个完整的可执行程序。\n\n**图 2-1：** C++ 程序开发过程。\n\n![617977-fg0201.eps](img/617977-fg0201_fmt.jpeg)\n\
  \n如今大多数 C++ 编译器都以所谓的集成开发环境（IDE）形式提供。这些 IDE 将编辑器、编译器和几个其他实用的开发程序组合并在一个通用的软件包中。这不仅让你免于了单独购买这些程序的需要，将它们合并成一个包还带来了若干生产力上的益处。首先，编辑器可以快速调用编译器，而不需要你手动来回切换。此外，大多数\
  \ IDE 中的编辑器提供了快速高效查找和修复代码错误的方法。\n\n某些 IDE 包含视觉化编程工具，允许程序员在显示器上绘制常见的窗口（如对话框）——IDE\
  \ 会自动生成显示这些窗口所需的 C++ 代码。\n\n![remember.eps](img/remember_fmt.jpeg) 虽然这听起来很不错，但自动生成的代码只显示窗口。程序员仍然必须生成当操作员选择这些窗口内的按钮时执行的真实代码。\n\
  \n毫无疑问，这些视觉化 IDE 与某一个操作系统紧密耦合在一起。例如，流行的 `Visual Studio` 与 Windows 中的 .NET 环境强力绑定。如果不学习\
  \ .NET 环境以及关于 Windows 和 C++（或其他 .NET 语言之一）的知识是不可能使用 `Visual Studio`。此外，生成的程序只在 .NET\
  \ 环境中运行。\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 在书中，你将使用一个名为 `Code::Blocks` 的公有领域\
  \ C++ IDE。`Code::Blocks` 有 Windows、Linux 和 MacOS 版本——Windows 版本包含在随书附的 CD-ROM 中。Macintosh\
  \ 和 Linux 的 `Code::Blocks` 版本可以在 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 免费下载。\n\n你将使用 `Code::Blocks` 来生成书中的程序。这些程序被称为控制台应用程序（Console Applications），因为它们从控制台窗口获取输入并向其显示文本。虽然这不像窗口化开发那么酷，但坚持使用控制台应用程序将让你专注于\
  \ C++，而不会被窗口环境的要求分心。此外，使用控制台应用程序将使书中的程序在 `Code::Blocks` 支持的所有环境中相同的运行。\n\n### 安装\
  \ Code::Blocks\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 《C++ 编程傻呆》在 CD-ROM 中包含一个\
  \ Windows 版的 `Code::Blocks`。本节提供了该版本的详细安装说明。从 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 下载和安装 `Code::Blocks` 版本的必要步骤将类似。\n\n1. 将随附的 CD-ROM 插入你的计算机。\n这非常简单。\n\n2. 阅读用户许可协议\
  \ (EULA) 并选择“接受”（Accept）。\n\n3. 选择“软件”（Software）选项卡，然后选择 `Code::Blocks` 来安装 `Code::Blocks`\
  \ 环境。\n\n在某些版本的 Windows 上，你可能会看到一条消息：“未识别的程序想要访问你的计算机”。当然，那个未识别的程序就是 `Code::Blocks\
  \ Setup`。\n\n4. 选择“允许”（Allow）。\n\n安装程序现在解压它运行 `Code::Blocks Setup` 所需的文件。这可能需要一分钟。完成后，会出现图\
  \ 2-2 所示的启动窗口。\n\n5. 关闭其他正在运行的程序并选择“下一步”（Next）。\n\n安装向导显示通用的用户许可协议（EULA）。这里没什么兴奋的。\n\
  \n**图 2-2：** `Code::Blocks Setup` 向导引导你完成安装过程。\n\n![617977-fg0202.eps](img/617977-fg0202_fmt.jpeg)\n\
  \n6. 选择“同意”（I Agree）。\n\n向导随后显示你可以选择安装的组件列表。默认设置是可以的，但你可能想像图 2-3 所示勾选“桌面快捷方式”（Desktop\
  \ Shortcut）选项。这样做会在桌面上创建一个图标，让你无需通过“程序文件”菜单即可启动 `Code::Blocks`。\n\n**图 2-3：** 勾选桌面快捷方式将创建一个可以快速启动\
  \ `Code::Blocks` 的图标。\n\n![617977-fg0203.eps](img/617977-fg0203_fmt.jpeg)\n\n7.\
  \ 选择“下一步”（Next）。\n\n下一个窗口要求你选择安装位置。该窗口还会告诉 `Code::Blocks` 需要多少磁盘空间（取决于你选择的选项，约 150MB）以及你的硬盘上有多少可用空间。如果没有足够的空磁盘空间，你需要在继续之前删除一些捕捉的\
  \ YouTube 视频以腾空间。\n\n8. 默认安装位置是可以的，所以一旦你有足够的磁盘空间，选择“安装”（Install）。\n\n在此时，`Code::Blocks\
  \ Setup` 向导真正开始工作了。它提取数以十计的文件，并将它们安装在凡人无法理解的众多子目录中。这个过程可能需要几分钟。\n\n9. 安装完成后，会弹出一个对话框询问你现在是否运行\
  \ `Code::Blocks`。选择“否”（No）。\n\n如果到为止一切顺利，将出现图 2-4 所示的安装完成窗口。\n\n\n\n\n\n**图 2-4:**\
  \ “安装完成”窗口表示 Code::Blocks 已成功安装。\n\n![617977-fg0204.eps](img/617977-fg0204_fmt.jpeg)\n\
  \n10. 点击 `Next`（下一步）。\n\n最后，出现了“完成 Code::Blocks 设置向导”窗口。最后一步将创建启动应用程序所需的图标。\n\n\
  11. 点击 `Finish`（完成）。\n\n你完成了！你已经安装了 Code::Blocks。现在剩下的就是测试它是否运行，然后你就可以开始编程了。\n\n\
  ### 测试 Code::Blocks 安装\n\n在本节中，你将构建一个 Code::Blocks 自带的默认程序。这个程序的功能仅仅是在显示器上显示“Hello,\
  \ world!”，但成功构建并运行此程序将验证你已正确安装了 Code::Blocks。\n\n1. 双击桌上创建 Code::Blocks 图标，或选择 `Programs⇒Code::Blocks⇒Code::Blocks`\
  \ 来启动 Code::Blocks。\n\n这将打开一个类似于图 2-5 所示的窗口。\n\n窗口顶部是常用的菜单选项，从 `File`（文件）、`Edit`（编辑）、`View`（视图）等开始。右上角写有“Start\
  \ here”（从这里开始）的窗口是你运行到那里时源代码将存放的地方。右下角的窗口是 Code::Blocks 向用户显示消息的地方。编译器错误信息会出现在此空间。左侧标记为\
  \ `Management`（管理）的窗口是 Code::Blocks 跟踪组成程序的文件的地方。现在应该是空的，因为你还没有创建程序。你需要做的第一件事是创建一个项目。\n\
  \n**图 2-5:** Code::Blocks 环境的启动界面。\n\n![617977-fg0205.eps](img/617977-fg0205_fmt.jpeg)\n\
  \n### 什么是项目？\n\n你希望 Code::Blocks 只创建控制台应用程序（Console Applications），但它可以创建许多不同类型的程序。对于\
  \ Windows 程序员来说，Code::Blocks 可以创建动态链接库（也简称为 `DLLs`）。它可以创建 Windows 应用程序。它还可以为 Linux\
  \ 和 MacOS 创建静态和动态链接库。\n\n此外，Code::Blocks 允许程序员对这些每个目标的构建方式设置不同的选项。我将在后面的章节中向你展示如何调整其中的一些设置。最后，Code::Blocks\
  \ 会记住你为每个项目配置的窗口。当你返回项目时，Code::Blocks 会将窗口恢复到最后的配置以为你节省时间。\n\nCode::Blocks 将它所需的关于你构建的程序类型、可选设置和窗口布局的信息存储在两个项目文件中。设置存储在与程序同名但扩展名为\
  \ `.cbp` 的文件中。窗口配置存储在与同名但扩展名为 `.layout` 的文件中。\n\n### 创建项目\n\n1. 选择 `File⇒New⇒Projects`（文件⇒新建⇒项目）以打开图\
  \ 2-6 所示的窗口。\n\n这是 Code::Blocks 知道如何构建的所有类型应用程序列表。\n\n**图 2-6:** 从提供的许多类型目标中选择控制台应用程序（Console\
  \ Application）。\n\n![617977-fg0206.eps](img/617977-fg0206_fmt.jpeg)\n\n幸运的是，你将专注于其中一种，即控制台应用程序。\n\
  \n2. 选择 `Console Application`（控制台应用程序）并选择 `Go`（执行）。\n\nCode::Blocks 响应显示如图 2-7 所示的内容。在这里，Code::Blocks\
  \ 为你提供创建 C 或 C++ 程序的选项。\n\n3. 选择 `C++` 并点击 `Next`（下一步）。\n\nCode::Blocks 打开一个对话框，你可以在其中输入项目的名称和可选的子文件夹。首先，点击小小的\
  \ `...` 按钮创建一个存放你的项目的文件夹，导航到工作磁盘的根目录（在 Windows 机器上，它将是 `C` 或 `D`，可能是 `C`）。选择窗口左下角的\
  \ `Make New Folder`（新建文件夹）按钮。将新文件夹命名为 `Beginning_Programming-CPP`。\n\n**图 2-7:**\
  \ 选择 C++ 作为你的语言选择。\n\n![617977-fg0207.eps](img/617977-fg0207_fmt.jpeg)\n\n4. 当你的显示看起来如图\
  \ 2-8 所示时，点击 `OK`（确定）。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 你创建的存放项目的文件夹名称中不能包含任何空格。此外，路径中的任何文件夹都不应包含空格。这自动排除了将项目放在桌面的情况，因为桌面的路径包含空格。你也应该避免在项目名称中使用空格。你可以使用下划线来分隔单词。Code::Blocks\
  \ 编译器会对文件名中的空格感到困惑，并产生晦涩且很大无意义的错误。\n\n**图 2-8:** 创建文件夹 `Beginning_Programming-CPP`，你将并在其中收集你的\
  \ C++ 项目。\n\n![617977-fg0208.eps](img/617977-fg0208_fmt.jpeg)\n\n现在输入项目名称 `HelloWorld`。注意\
  \ Code::Blocks 会自动创建一个同名的子文件夹来包含组成项目的文件。\n\n5. 当你的显示看起来如图 2-9 时，点击 `Next`（下一步）。\n\
  \n**图 2-9:** 将你的第一个项目命名为 HelloWorld。\n\n![617977-fg0209.eps](img/617977-fg0209_fmt.jpeg)\n\
  \n6. 当你的显示像图 2-9 时，点击最后一页上的 `Finish`（完成）。图 210。\n\n![617977-fg0210.eps](img/617977-fg0210_fmt.jpeg)\n\
  \n**图 2-10:** 选择 Finish 完成项目。\n\n### 测试默认项目\n\n当你选择向导上的 `Finish` 时，Code::Blocks\
  \ 会创建一个控制台应用程序项目并填充一个运行良好的程序。要查看该程序，点击左侧管理窗口中 `Sources`（源代码）旁 `+` 号。下拉列表显示一个文件 `main.cpp`。双击\
  \ `main.cpp` 在右侧源代码窗口中显示以下简单程序：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main()\n{\n    cout << “Hello world!” << endl;\n\nreturn 0;\n}\n```\n\
  \n现在我将跳过这些内容的某些含义，但程序的核心位于 `main()` 之后的大括号之后。这是执行的地方。`cout << “Hello world!” <<\
  \ endl;` 的意思是将“Hello world!”输出到 `cout`，默认是命令行。下一行 `return 0;` 导致控制权返回操作系统，从而有效地终止程序。\n\
  \n1. 选择 `Build⇒Build`（构建⇒构建）将 C++ 源语句构建成可执行机器语言程序。\n\n（如果你喜欢，可以按 `Ctrl+F9` 或点击构建图标。）立即，你应该会在右下屏幕看到\
  \ `Build Log`（构建日志）标签，随后是一系列复杂的命令，如图 2-11 所示。这是 Code::Blocks 告诉 C++ 编译器如何使用项目文件中存储的设置来构建测试程序。细节并不重要。然而，重要的是\
  \ Build Log 的最后两行应该是\n\n```\nProcess terminated with status 0 (0 minutes, 1 seconds)\n\
  0 errors, 0 warnings\n```\n\n终止状态为 0 表示构建过程运行正常。“0 errors, 0 warnings”意味着程序在没有错误或警告的情况下通过编译。（1\
  \ 秒的构建时间并不重要。）\n\n**图 2-11:** 构建默认程序应该得到一个没有错误且没有警告的运行良好的程序。\n\n![617977-fg0211.eps](img/617977-fg0211_fmt.jpeg)\n\
  \n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 如果你得到的状态不是 0（且有 0 个错误和\
  \ 0 个警告），那么你的安装或项目出了问题。常见的错误来源有：\n\n• 你在安装 Code::Blocks 之前，电脑上已经安装了 `gcc` 编译器。Code::Blocks\
  \ 使用的是特殊版本的 GNU `gcc` 编译器，但它会使用你电脑上可能安装的任何其他 `gcc` 编译器。最稳妥的方法是卸载 Code::Blocks，卸载其他的\
  \ `gcc` 编译器，然后从头重新安装 Code::Blocks。\n\n• 你在一个名称包含空格的目录中构建了项目；例如，你在桌面上构建了项目。确保你在用户磁盘根目录（Windows\
  \ 机器通常为 `C` 盘）下的 `Beginning_Programming-CPP` 文件夹中构建项目。\n\n• 你直接从随书附带的 CD-ROM 中构建了项目。（这不适用于这里的步骤，但它是一个常见的错误来源。你无法在\
  \ CD-ROM 这样的只读介质上构建程序。你必须先将文件从 CD-ROM 复制到硬盘。）\n\n2. 选择 `Build⇒Run` (`Ctrl+F10`)\
  \ 来执行程序。\n\n随后会立即弹出一个窗口，显示“Hello, world!”消息，接着是返回代码零以及“Press any key to continue,”消息，如图\
  \ 2-12 所示。\n\n3. 按 `Enter`。\n\n窗口将消失，控制权返回到 Code::Blocks 文本编辑器。\n\n**图 2-12：**默认程序显示“Hello,\
  \ world!”并等待按键。\n\n![617977-fg0212.tif](img/617977-fg0212_fmt.jpeg)\n\n如果你能通过执行程序看到“Hello,\
  \ world!”消息，那么恭喜你！你成功安装了开发环境，并成功构建并执行了你的第一个 C++ 程序。如果没有成功，请删除 `Beginning_Programming_CPP`\
  \ 文件夹，卸载 Code::Blocks 并重试，仔细对比你的显示内容与本章中的插图。如果你仍然遇到问题，请参考 `www.stephendavis.com`\
  \ 获取关于可能错误的提示，那里还有我的电子邮件链接，你可以向我发送问题和建议。我无法替你完成编程作业，但我可以回答问题帮助你上手。\n\n## 第 3 章：编写你的第一个程序\n\
  \n### 本章内容\n* 编写你的第一个 C++ 程序\n* 编译并执行你的程序\n* 检查可能出现问题的地方\n* 执行你的程序\n* 回顾程序的工作原理\n\
  \n本章将引导你创建第一个 C++ 程序。你将使用 Code::Blocks C++ 环境。由于这是你第一次尝试，所有操作都会有点像“照菜谱”一样。我将在从第二部分开始的后续章节中解释构成该程序的各个部分，但现在你需要先无条件地接受一些内容。很快，一切都将揭晓，你在本章中所做的事情都将变得完全合理。\n\
  \n## 创建新项目\n\n一如既常，你必须创建一个新项目来存放你的程序。按照这里的简要步骤操作（或你可以使用第 2 章中的详细步骤）：\n\n1. 在 Code::Blocks\
  \ 打开的状态下，选择 `File⇒New⇒Project`。\n2. 选择 `Console Applications` 并选择 `Go`（或双击 `Console\
  \ Applications` 图标）。\n3. 选择 `C++` 作为你的语言选择并点击 `Next`。\n4. 输入 `Conversion` 作为项目标题。\n\
  \n如果你遵循了第 2 章的步骤，“Folder to create project in”应该已经设置为 `Beginning_Programming-CPP`。如果不是，现在点击\
  \ `...` 按钮并在工作磁盘的根目录下创建该文件夹也不太晚。（这在第 2 章中有详细描述）。Code::Blocks 向向会自动为你填写项目名称和生成的程序名称。\n\
  \n完成后，你的窗口看起来应该像图 3-1 所示。\n\n**图 3-1：**Conversion 程序的项目窗口。\n\n![617977-fg0301.eps](img/617977-fg0301_fmt.jpeg)\n\
  \n5. 选择 `Next`。\n\n下一个窗口允许你更改目标文件夹。默认设置即可。\n6. 选择 `Finish`。\n\nCode::Blocks 会创建一个新项目并将其添加到之前的\
  \ `HelloWorld` 项目中。（参见“Organizing projects”侧边栏以解释为什么会这样。）结果显示应该像图 3-2 所示。\n\n**图\
  \ 3-2：**创建 Conversion 项目后的初始显示。\n\n![617977-fg0302.eps](img/617977-fg0302_fmt.jpeg)\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\n### 项目组织\n\n你可能好奇为什么 Code::Blocks\
  \ 会将新的 `Conversion` 项目添加到现有的 `HelloWorld` 项目而不是替换它。一个涉及多个开发人员的大型工程可能会被分成若干个设计为协同工作的程序。为了支持这一点，Code::Blocks\
  \ 允许同时加载任意数量的不同项目。\n\n所有项目的集合被称为 `workspace`（工作空间）。由于你在启动 Code::Blocks 时没有指定 `workspace`，你到为止创建的项目都进入了默认的\
  \ `workspace`。`workspace` 中一次只能有一个项目处于激活状态。这就是以加粗显示的项目（再次参考图 3-2，你会发现 `Conversion`\
  \ 是粗体的，而 `HelloWorld` 没有）。你执行的任何 Code::Blocks 命令都是针对激活项目的。默认情况下，你最后创建的项目是激活项目，但你可以通过在\
  \ Management 窗口中右键点击它并选择 `Activate Project` 来更改激活项目。\n\n如果你现在查看一眼 `Beginning_Programming-CPP`\
  \ 文件夹，你会发现两个子文件夹：`HelloWorld` 和 `Conversion`。这两个子文件夹都包含一个扩展名为 `.cbp` 的项目文件（其中包含编译器设置），一个扩展名为\
  \ `layout` 的布局文件（它描述了你在开发此项目时希望设置窗口的方式），以及一个包含 C++ 程序的 `main.cpp` 文件。`HelloWorld`\
  \ 还包含一个名为 `Debug` 的子文件夹。\n\nC++ 程序可以有任何你喜欢的名称，但应以 `.cpp` 结尾。你将在第 12 章看到如何创建多个不同名称的\
  \ C++ 源文件。\n\n## 输入你的程序\n\n现在是时候按照步骤输入你的第一个程序了：\n\n1. 确保 `Conversion` 在 Management\
  \ 窗口中加粗显示（参考图 3-2）。这表示它是激活项目。如果不是，右键点击 `Conversion` 并从下拉菜单选择 `Activate Project`。\n\
  2. 通过选择 `File⇒Close all files` 关闭所有打开的源文件窗口。或者，你也可以通过点击编辑器标签文件名旁的小 `X` 只关闭你需要的源文件。你不希望意外编辑错误的源文件。\n\
  3. 点击 Management 窗口中 `Conversion` 下 `Sources` 旁的小加号打开 `Sources` 文件夹。下拉菜单应该显示单个文件\
  \ `main.cpp`。\n\n### 文件扩展名\n\nWindows 有在显示文件名时隐藏文件扩展名的坏习惯。对于某些应用程序这可能是个好主意，但对于程序员来说几乎从不是好主意。在隐藏扩展名的情况下，Windows\
  \ 可能会显示三个四个同名为 `HelloWorld` 的文件。当你显示扩展名并发现它们都是不同的时，这种混乱的局面就会迎解决了。\n\n你应该禁用 Windows\
  \ 隐藏扩展名的功能。具体方法取决于你使用的 Windows 版本：\n\n* Windows 2000：`Start⇒Settings⇒Control Panel⇒Folder\
  \ Options`。\n* Windows XP 默认视图：`Start⇒Control Panel⇒Performance and Maintenance⇒File\
  \ Types`。\n* Windows XP 经典视图：`Start⇒Control Panel⇒Folder options`。\n\n\n\n\n默认视图下的\
  \ Windows Vista：选择“开始”⇒控制面板⇒外观和个性化⇒显示隐藏的文件文件夹。\n\n经典视图下的 Windows Vista：选择“开始”⇒设置⇒控制面板⇒文件夹选项。\n\
  \n现在，导航到出现的“文件夹选项”对话框的 `View` 选项卡。向下滚动直到找到“隐藏已知文件类型的扩展名”。确保此选框未勾选。选择 `OK` 关闭对话框。\n\
  \n4. 双击 `main.cpp` 在编辑器中打开该文件。\n\n5. 输入以下程序来编辑 `main.cpp` 的内容，完全按照此处所示。\n\n结果如图\
  \ 3-3 所示。\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 这绝对是最困难的部分，所以请慢慢来，并保持耐心：\n\n```cpp\n\
  //\n\n// Conversion - 将温度从\n// 摄氏度转换为华华的程序：\n// Fahrenheit = Celsius * (212 - 32)/100\
  \ + 32\n//\n\n#include <cstdio>\n\n#include <cstdlib>\n\n#include <iostream>\n\n\
  using namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    //\
  \ 输入摄氏度温度\n    int celsius;\n    cout << “Enter the temperature in Celsius:\";\n\
  \    cin >> celsius;\n\n    // 将摄氏度转换为华氏度值\n    int fahrenheit;\n    fahrenheit\
  \ = celsius * 9/5 + 32;\n\n    // 输出结果（后跟换行）\n    cout << “Fahrenheit value is:”;\n\
  \    cout << fahrenheit << endl;\n\n    // 在终止程序前等待用户准备好\n    // 让用户看到程序结果\n   \
  \ system(\"PAUSE\");\n    return 0;\n}\n```\n\n**图 3-3：** 转换程序编辑后的 `main.cpp` 文件。\n\
  \n![617977-fg0303.eps](img/617977-fg0303_fmt.jpeg)\n\n我说的“完全按照你看到的”是什么意思？C++ 对语法非常挑剔。它不容忍缺失分号或拼写错误的单词。只要额外的空格没有出现在单词中间，它并不在乎。例如，`int\
  \ fahren heit;` 与 `int fahrenheit;` 不同，但 `int fahrenheit;` 是没问题的。C++ 将制表符、空格和换行符全部视为相同，并统称为空白字符。\n\
  \n也许只是我个人的问题，但我花了很长时间才习惯 C++ 区分大写和小写。因此，`int Fahrenheit;` 与 `int fahrenheit;` 不是同一个东西。最后一个提示是：C++\
  \ 会忽略出现在 `//` 之后的任何内容，所以你不需要担心把那些内容写对。\n\n6. 选择 `File`⇒Save all files` 来保存文件。\n\n\
  ### 编译程序\n\n现在到了整个软件开发过程中最令人紧张的部分：编译你的程序。在这一步中，C++ 会检查你的工作成果，看看它是否能从你写的内容中读出任何意义。\n\
  \n程序员是永恒的乐观主义者。在我们内心深处，我们真的相信每当我们点击 `Build` 按钮时，一切都会正常运行，但事实几乎从不是如此。不出所料，缺失的分号或拼写错误的单词会让\
  \ C++ 感到失望，并带来大量的错误信息，就像我们小学老师的许多批评一样在我们耳边轰轰落下。\n\n实际上，构建程序只需要一步：你选择 `Build`⇒Build`\
  \ 或按下 `Ctrl+F9` 或点击小小的 `Build` 图标。\n\n### 寻找可能出现的问题\n\n无意，但 `Build` 步骤几乎不可能在没有错误的情况下完成。金星程序是指你第一次编译并执行时就能运行的程序。在整个编程生涯中，你几乎永远写不出金星程序。\n\
  \n幸运的是，`Code::Blocks` 编辑器与编译器的集成非常好，它可以自动引导你找到非常接近错误的地方。大多数时候，它可以将光标放置在包含错误的精确行。为了证明这一点，让我带你查看几个示例错误。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 这些只是在 C++ 中出错的无数种方式中的两种。我不可能向你展示所有的错误。学习如何解释编译器通过其错误和警告信息试图传达的内容，是学习这门语言的重要部分。这只能通过几个月的实践和积累该语言的经验获得。希望这两个例子能给你一个启动。\n\
  \n### 拼写错误的命令\n\n拼写错误的命令是最容易识别和纠正的错误。为了演示这一点，我在前面的代码第 14 行添加了一个额外的 `t`，所以它现在读作：\n\
  \n```cpp\nintt celsius;\n```\n\n与 `int` 不同，单词 `intt` 对 C++ 没有任何意义。编译生成的程序产生了图 3-4\
  \ 所示的显示。\n\n**图 3-4：** 拼写 `int` 导致的错误信息。\n\n![617977-fg0304.eps](img/617977-fg0304_fmt.jpeg)\n\
  \n首先注意第 14 行上的红色小块，表示该行某处有问题。你可以在右下角窗口的 `Build Messages` 选项卡中阅读全部信息。在这里你可以看到以下消息：\n\
  \n```\nIn function ‘int main(int, char**)’:\n14 error: ‘intt’ was not declared in\
  \ this scope\n14 error: expected ‘;’ before ‘celsius’\n16 error: ‘celsius’ was not\
  \ declared in this scope```\n\n第一行指示了包含错误的函数。我将在第 12 章详细介绍，但很容易相信所有的代码都在名为 `main`\
  \ 的函数中。下一行是关键。它基本上说 C++ 不理解第 14 行的 `intt`。错误信息有点晦涩，但足以说明每当你拼写错误时，都会得到这个错误消息。其余错误信息只是原始错误的副产品。\n\
  \n![warning_bomb.eps](img/warning_bomb.jpeg) 一个 C++ 错误可能会引发一系列错误消息。在编译尝试中识别并修复多个错误，但需要经验来判断哪些错误源于何。现在，专注于第一个错误。修复它并重新编译程序。\n\
  \n### 为什么 C++ 如此挑剔？\n\n你很快就会发现 C++ 就像拼字比赛的评员一样挑剔。一切必须完全符合，否则编译器就不会接受。有趣的是，事实并非必须如此：有些语言选择尝试理解你给它的任何内容。这种方法的极端版本是\
  \ IBM 在 70 年代为其大型机推广的一种语言，被称为 `PL1`（这代表“编程语言 1”）。这种版本的编译器会尝试理解你扔给它的任何东西。我们极客过去在计算机中心深夜，通过一个只由\
  \ `IF` 或 `WHILE` 单词组成的程序来折磨编译器，获得巨大的乐趣。通过某种扭曲的逻辑，`PL1` 会根据这一个命令构建出整个程序。\n\n编程语言的另一个阵营（C++\
  \ 所属的阵营）持有相反观点：这些语言强迫程序员准确说明她的意图。每个声明都会与每个用法进行检查，以确保一切匹配。没有任何缺失的分号或声明错误的标签不受惩罚。\n\
  \n事实证明，C++ 采用的严厉方法实际上更高效。`PL1` “自由爱”方法的问题在于，它在理解我的意图时几乎总是是错误的。`PL1` 最终创建了一个可以编译但在执行时运行与我预期的不同的程序。如果某些地方不符合检查，C++\
  \ 会生成编译器错误，以迫使我清晰、明确地表达我的意图。\n\n### 缺失分号\n\n另一个常见的错误是漏掉分号。该错误产生的消息可能有点困惑。为了演示，我删除了第\
  \ 14 行声明中的分号，使其读作：\n\n```cpp\nint celsius\n\ncout << “Enter the temperature in Celsius:\"\
  ;\n```\n\n\n\n`C++` 对此违规行为报告的错误指向的第 14 行，而是下面的第 15 行：\n\n```\n15 error: expected\
  \ initialization before ‘cout’\n16 error: ‘celsius’ was not declared in this scope\n\
  ```\n\n考虑到 `C++` 将换行符仅仅视为另一种形式的空格，这就更容易理解了。如果没有分号，`C++` 会将这两行合在一起运行。不再有独立的第 14 行了。`C++`\
  \ 可以解释第一部分，但它无法理解以 `cout` 开头的连句。\n\n![tip.eps](img/tip_fmt.jpeg) 缺少分号通常生成的错误信息与实际错误信息几乎没有相似之处，而且它们几乎总是出现在实际错误之后的下一行。如果你怀疑缺少了分号，请从报告的错误所在的行开始，向后扫描。\n\
  \n## 使用附带的 CD-ROM\n\n如果你确实无法正确输入程序，你始终可以从附带的 CD-ROM 中复制程序。（如果你对使用 CD-ROM 有任何疑问，请参阅附录；附录详细说明了你将在\
  \ CD-ROM 上找到的内容，以及在需要时提供的故障排除提示。）\n\n![tip.eps](img/tip_fmt.jpeg) 在放弃并求助于 CD-ROM\
  \ 之前，你真的应该先尝试手动输入程序。只有通过解决自己的错误，你才能对这种语言的工作原理建立一种感觉。\n\n你有几种方法来使用附带的 CD-ROM。最直接的方法是如下所示将\
  \ CD-ROM 上文件的内容复制并粘贴到你自己的文件中：\n\n1. 将附带的 CD-ROM 插入你的计算机。\n2. 在 `Code::Blocks` 内部选择\
  \ `File⇒Open`（文件⇒打开）。导航到 `X:\\Beginning_Programming-CPP\\Conversion`，其中 `X` 是你的\
  \ CD-ROM 驱动器的器器符。\n3. 选择文件 `main.cpp`。\n`Code::Blocks` 将在编辑器窗口的新标签页中以 `ReadOnly`\
  \ 模式打开该文件。\n4. 选择 `Edit⇒Select All`（编辑⇒全选）或按下 `Ctrl+A`。这将选择源文件的全部内容。\n5. 选择 `Edit⇒Copy`（编辑⇒复制）或按下\
  \ `Ctrl+C`。这将将整个文件复制到剪贴板。\n6. 选择对应于你程序的 `main` 标签。\n7. 再次选择 `Edit⇒Select All`（编辑⇒全选）或按下\
  \ `Ctrl+A`。\n8. 选择 `Edit⇒Paste`（编辑⇒粘贴）或按下 `Ctrl+V`。这将用 CD-ROM 上对应文件的内容覆盖你一直编写的 `main.cpp`\
  \ 的全部内容。\n9. 点击文件名旁边的小 `X` 来关闭包含 CD-ROM 版本文件的标签页。\n\n## 运行程序\n\n一旦你获得了整洁的编译结果（即\
  \ 0 个错误和 0 个警告），你就可以按照以下步骤执行程序：\n\n1. 选择 `Build⇒Run`（生成⇒运行）或按下 `Ctrl+F10`。这将在不使用调试器的情况下执行程序。（如果你不知道调试器是什么，不要担心；我将在第\
  \ 20 章中教你如何使用它。）\n程序将打开一个 80 列 25 行的窗口，并提示你输入一个摄氏度温度。\n2. 输入一个已知的温度，例如 100 度。按下\
  \ `Enter`（回车键）。\n程序会立即响应等值为 212 的华氏度：\n```\nEnter the temperature in Celsius:100\n\
  Fahrenheit value is:212\nPress any key to continue . . .\n```\n3. 按两次 `Enter` 退出程序并返回编辑器。\n\
  \n## 程序是如何工作的\n\n尽管这是你的第一个程序，但我不想在结束这一章时没有让你对这个程序是如何运作的稍有所了解。\n\n### 模板\n\n程序的第一部分我称之为“基础编程模板”。这将是书中所有程序使用的相同的魔力咒语。它的结构如下：\n\
  \n```cpp\n//\n// ProgramName - 关于程序作用的简短说明\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nint main(int nNumberofArgs, char*\
  \ pszArgs[])\n{\n// 程序代码写在这里\n// 在终止程序之前等待用户准备就绪\n// 以允许用户看到程序结果\nsystem(\"PAUSE\"\
  );\nreturn 0;\n}\n```\n\n### 注释\n\n此模板中的前几行看起来是自由格式的文本。要么是这些“代码”是为了人类阅读的，要么是计算机比任何给过它的评价都要聪明。这前四行被称为注释。注释是\
  \ `C++` 编译器忽略的一行或行的一某部分。注释允许程序员解释她在编写特定代码段时正在做什么或想什么。\n\n`C++` 注释以双正斜杠开头并以换行符结束。你可以在注释中放入任何字符，而且注释的长度可以随你意意，尽管习惯上将它们限制在\
  \ 80 个字符左右，因为这正是一个普通屏幕的宽度。\n\n注意：你可能认为 `C++` 或任何其他编程语言中有一种专门被编译器忽略的命令很奇怪；然而，所有的编程语言都有某种形式的注释。对于程序员来说，能够解释编写某段代码时脑子里在想什么至关重要。对于接手并使用或修改程序的下一个人来说，这可能并不显而易见。事实上，在程序员自己工作了一段时间后，这可能也不再显而易见。\n\
  \n### 包含文件\n\n接下来的几行被称为包含语句，因为它们导致命名文件的内容被包含。包含文件始终以 `#include` 开头，后面跟着要包含的文件名。\n\
  \n### main\n\n每个程序在某处都必须有一个 `main()`。程序执行从 `main()` 之后的大括号开始，并在 `return` 语句结束。`main()`\
  \ 的具体格式将稍后说明。\n\n注意标准模板在 `return 0` 之前以 `system(\"PAUSE\")` 结束。此命令导致程序等待用户按键。\n\n\
  ![technical.eps](img/technical.jpeg) 只要你在 `Code::Blocks` 环境中运行程序，调用 `system(\"PAUSE\"\
  )` 就是没有必要的。`Code::Blocks` 也会等待用户按键。然而，并不是所有的环境都是如此。如果去掉它，`C++` 通常会在你有机会读取输出之前关闭应用程序。\n\
  \n## 转换程序除去模板后的转换程序部分所示：\n\n```cpp\n// 输入摄氏度温度\nint celsius;\ncout << \"Enter the\
  \ temperature in Celsius:\";\ncin >> celsius;\n\n// 将摄氏度转换为华氏度\nint fahrenheit;\n\
  fahrenheit = celsius * 9/5 + 32;\n\n// 输出结果（后跟一个换行符）\ncout << \"Fahrenheit value\
  \ is:\";\ncout << fahrenheit << endl;\n```\n\n跳过 `C++` 都会忽略的注释行，此程序首先声明了一个名为 `celsius`\
  \ 的变量。变量是你可以用来存储数字或字符的地方。\n\n下一行向用户显示提示：“Enter the temperature in Celsius:”。`cout`\
  \ 对象默认指向控制台窗口。\n\n下一行读取操作输入的任意数字并将其存储在之前声明的变量 `celsius` 中。\n\n接下来两行声明了第二个变量 `fahrenheit`，然后将其赋值为变量\
  \ `celsius * 9/5 + 32`，这是摄氏度到华氏度温度的转换公式。\n\n最后两行输出字符串“Fahrenheit value is:”以及上述计算并存储在变量\
  \ `fahrenheit` 中的值。\n\n\n\n\n既然你已经熟悉了如何编写和构建程序，现在就可以开始学习 C++ 本身了。这部分将向你介绍 C++ 的基本元素：变量声明和表达式。如果你能受得了，你甚至会发现如何在程序中做出决策。最后，你将看到一些在程序中查找错误的入门技巧。\n\
  \n## 第 4 章：整数表达式\n\n### 本章内容\n- 声明变量\n- 创建表达式\n- 拆解复合表达式\n- 分析赋值运算符\n- 使用一元运算符增加变量\n\
  \n在本章中，你将学习整数声明和表达式。代数课已经向你引入了变量和表达式的概念。代数老师通常会在黑板上写类似这样的内容：\n\n```\nx = 1\n```\n\
  \n这定义了一个变量 `x` 并将其赋值为 `1`，直到后续某个语句由于某种原因改变了它。术语 `x` 变成了 `1` 的替代品。然后老师会写下以下表达式：\n\
  \n```\ny = 2x\n```\n\n因为我知道 `x` 是 `1`，所以我现在知道 `y` 等于 `2`。这在七年级是一个真正的突破。所有传统的计算机语言都遵循这种创建和操作变量的模式。\n\
  \n## 声明变量\n\n整数变量声明以关键字 `int` 开始，后面紧跟变量名和分号，如下例所示：\n\n```cpp\nint n1; // 声明变量 n1\n\
  ```\n\nC++ 中的所有变量在使用之前都必须先声明。变量声明在内存中预留一小块空间，仅够存储单个整数，并为其分配一个名称。你可以在同一个声明中声明多个变量，如下例所示，但由于某些原因（这些原因在你学习后续章节时会变得清晰），这不是好主意：\n\
  \n```cpp\nint n2, n3; // 声明变量 n2 和 n3\n```\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 关键字是一个对 C++ 具有意义的单词。你不能使用关键字相同的名称来命名变量。因此，你不能创建一个名为 `int` 的变量。然而，由于关键字是区分大小写的，你可以创建一个名为\
  \ `Int` 或 `INT` 的变量。在后续的章节中，你将接触更多的关键字。\n\n使用关键字 `int` 而不是 `integer` 仅仅反映了 C++ 语言整体的简洁性。该语言的设计者可能是个打字高手，希望尽量减少他们的打字量。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 与代数课不同，C++ 中整数的范围不是无限的。然而，它确实非常大。如果你超过了\
  \ `int` 的范围，你将得到错误的答案。我将在第 14 章讨论变量的大小和范围。\n\n### 变量名\n\n你可以为变量命名任何名称，但需遵循以下限制：\n\
  - 变量的首字母必须是 `a` 到 `z`、`A` 到 `Z` 序列中的字符或下划线 (`_`）。\n- 首字母后的每个字母必须是 `a` 到 `z`、`A`\
  \ 到 `Z`、下划线 (`_`) 或数字 `0` 到 `9`。\n- 变量可以是任意长度。所有字符都有意义。\n\n以下是合法的变量名：\n\n```cpp\n\
  int myVariable;\nint MyVariable;\nint myNumber2Variable;\nint _myVariable;\nint\
  \ my_Variable;\n```\n\n以下是不合法的变量名：\n\n```cpp\nint myPercentage%; // 包含非法字符\nint\
  \ 2ndVariable; // 以数字开头\nint my Variable; // 包含空格\n```\n\n变量名应该具有描述性。不建议使用像 `x`\
  \ 这样的变量名。\n\n### 给变量赋值\n\n每个变量从声明的那刻起就有一个值。然而，在你给它赋值之前，变量将仅仅假设分配时该内存位置上恰好存在的任何“垃圾值”。这意味着你不知道它的值是多少，而且它在每次运行程序时都可能发生变化。\n\
  \n你可以使用等号给变量赋值，如下例所示：\n\n```cpp\nint n; // 声明变量 n\nn = 1; // 将其设置为 1\n```\n\n这看起来与代数课上的赋值语句非常相似，但效果并不完全相同。在\
  \ C++ 中，赋值语句的意思是“取等号右侧的值”（在本例中为 `1`）“并将其存储在左侧的位置，覆盖掉之前的任何内容”（在本例中为 `n`）。\n\n你可以在下面的表达式中看到区别：\n\
  \n```cpp\nn = n + 1; // 变量 n 加 1\n```\n\n这条语句在代数课上完全没有意义。`n` 如何能既等于 `n` 又等于 `n +\
  \ 1` 呢？然而，如果你遵循上述赋值的定义，这条语句在 C++ 中完全合理：“取存储在变量 `n` 中的值”（1）“加 1 并存储结果”（2）“存入变量 `n`”。这在图\
  \ 4-1 中所示。\n\n**图 4-1：** 当 `n` 初始值为 `1` 时，执行表达式 `n = n + 1` 的效果。\n\n![617977-fg0401.eps](img/617977-fg0401_fmt.jpeg)\n\
  \n### 在声明时初始化变量\n\n你可以在声明时初始化变量，通过在后面紧跟一个等号和一个值：\n\n```cpp\nint n = 1; // 声明并初始化\n\
  ```\n\n### 忘记初始化变量\n\n在使用之前忘记初始化变量是 C++ 中一个非常常见的错误。如果你不初始化变量，它将从内存中获取留下的随机值。考虑以下语句：\n\
  \n```cpp\nint n1, n2 = 0;\n```\n\n这只初始化了 `n2` 而没有初始化 `n1`。这是不建议在单个声明中声明多个变量的原因之一。（参见侧栏“忘记初始化变量”。）\n\
  \n## 整数常量\n\nC++ 将任何以数字开头且仅包含数字的符号视为整数常量。以下是合法常量：\n\n```\n123\n1\n256\n```\n\n常量不能包含任何奇怪字符。以下是不合法的：\n\
  \n```\n123Z456\n```\n\n以下是合法的，但意思并不是你想的：\n\n```cpp\n123+456\n```\n\n这实际上定义了常量 `123`\
  \ 和 `456` 的和，即值 `479`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 通常\
  \ C++ 假设常量是十进制（底数）。然而，出于历史原因，以 `0` 开头的数字被认为是八进制（底 8）。同样，以 `0x` 或 `0X` 开头的数字被认为是十六进制。十六进制使用字母\
  \ `A` 到 `F` 或 `a` 到 `f` 来表示 9 之后的数字。因此，`0xFF`、`0377` 和 `255` 都是等价的。如果你不知道八进制或十六进制，不用担心——我们在这书中不会使用它们。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 除非你想让它是八进制，否则不要以 0 开头常量。\n\n整数常量可以在末尾附加某些符号来改变其类型。你将在第\
  \ 14 章看到不同的整数常量。\n\n## 表达式\n\n变量和常量只有在你能用它们进行计算时才是有用的。“表达式”一词是 C++ 中“计算”的术语。你已经见了最简单的表达式：\n\
  \n\n\n\n```cpp\nint n; // declaration\n\nn = 1; // expression\n```\n\n表达式总是涉及变量、常量和运算符。运算符对其操作数执行某些算术操作。大多数运算符接受两个参数——这些被称为二元运算符。少数运算符接受单个参数——这些是一元运算符。\n\
  \n所有表达式都返回一个值和一个类型。（注意，`int` 是本章中描述的所有表达式的类型。）\n\n## 二元运算符\n\n二元运算符接受两个参数的运算符。如果你可以说\
  \ `var1 op var2`，那么 `op` 必须是一个二元运算符。最常见的二元运算符是你在小学学过的那些简单操作。常见的二元运算符出现在表 4-1 中。（该表还包含了在本章稍后部分描述的一元运算符。）\n\
  \n### 表 4-1 按优先级排序的数学运算符\n\n| 优先级 | 运算符 | 含义 |\n| :--- | :--- | :--- |\n| 1 | `-`\
  \ (一元) | 返回其操作数的负值 |\n| 2 | `++` (一元) | 增一 |\n| 2 | `--` (一元) | 减一 |\n| 3 | `*`\
  \ (二元) | 乘法 |\n| 3 | `/` (二元) | 除法 |\n| 3 | `%` (二元) | 取模 |\n| 4 | `+` (二元) | 加法\
  \ |\n| 4 | `-` (二元) | 减法 |\n| 5 | `=`, `*=`,`%=`,`+=`,`=` (特殊) |  类型 |\n\n最简单的二元运算符是等号标记的赋值运算符。赋值运算符的意思是“取右侧的值并存储在运算符左侧的位置”。（我将在本章结束描述特殊的赋值运算符。）\n\
  \n乘法、除法、加法、减法和取模是执行算术运算的运算符。它们的工作方式与你在小学学的算术运算符相同，但有以下特殊考虑因素：\n\n乘法必须始终显式表示，永远不会像代数中那样被隐含。考虑以下示例：\n\
  \n```cpp\nint n = 2; // 声明变量\n\nint m = 2n; // 这将产生错误\n```\n\n上面的表达式没有将 `2` 乘以 `n`\
  \ 的值赋给 `m`。相反，C++ 尝试将 `2n` 解析为变量名。由于变量名不能以数字开头，它在构建阶段产生错误。\n\n程序员的意思是：\n\n```cpp\n\
  int n = 2;\n\nint m = 2 * n; // 这是好的\n```\n\n整数除法会丢弃余数。因此，如下：\n\n```cpp\nint n =\
  \ 13 / 7; // 将值 1 赋给 n\n```\n\n14 除以 7 是 2。13 除以 7 是 1。（你将在第 14 章可以看到处理小数的变量类型。）\n\
  \n取模运算符返回除法的余数（你可能不记得取模了）：\n\n```cpp\nint n = 13 % 7; // 将 n 设置为 6\n```\n\n14 取\
  \ 7 余 0。13 取 7 余 6。\n\n## 分解复合表达式\n\n单个表达式可以包含多个运算符：\n\n```cpp\nint n = 5 + 100\
  \ + 32;\n```\n\n当所有运算符都相同时，C++ 从左到右评估表达式：\n\n```\n5 + 100 + 32\n105 + 32\n137\n\
  ```\n\n当不同的运算符组合在单个表达式中时，C++ 使用一种称为“优先级”的属性。优先级是运算符在复合表达式中评估的顺序。考虑以下示例：\n\n```cpp\n\
  int n = 5 * 100 + 32;\n```\n\n先执行的是乘法还是加法？或者这个表达式仅仅简单地从左到右评估？参考表 4-1，它告诉你乘法的优先级为\
  \ `3`，高于加法的优先级 `4`（值越小，优先级越高）。因此，乘法先发生：\n\n```\n5 * 100 + 32\n500 + 32\n532\n```\n\
  \n操作顺序被运算符的优先级所覆盖。正如你看到的：\n\n```cpp\nint n = 32 + 5 * 100;\n```\n\n产生了相同的结果：\n\n\
  ```\n32 + 5 * 100\n32 + 500\n532\n```\n\n但如果你真的想要 100 加 32 之和的 5 倍呢？你可以通过将你想要先执行的表达式用括号起来来覆盖运算符的优先级：\n\
  \n```cpp\nint n = 5 * (100 + 32);\n```\n\n现在，加法在乘法之前执行：\n\n```\n5 * (100 + 32)\n\
  5 * 132\n660\n```\n\n你可以组合括号使表达式变得任意复杂。C++ 总是从它能找到的最深嵌套括号开始，并向外处理。\n\n```\n(3 +\
  \ 2) * ((100 / 20) + (50 / 5))\n(3 + 2) * (5 + 10)\n5 * 15\n75\n```\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 你始终可以使用中间变量来分解复杂的表达式。下面的是安全的：\n\n```cpp\nint factor = 3 + 2;\n\nint principal\
  \ = (100 / 20) + (50 / 5);\n\nint total = factor * principal;\n```\n\n为中间值命名还允许程序员解释复杂方程的部分，使下一个人更容易理解。\n\
  \n## 一元运算符\n\n一元运算符是接受单个参数的运算符。一元数学运算符是 `-`、`++` 和 `--`。\n\n减号运算符改变其操作数的符号。正数变成负数，负数变成正数。\n\
  \n\n\n\n赋值运算符对任何计算机语言来说都是至关重要的。如果没有它，我如何存储计算出的值呢？然而，C++ 提供了一套完整的赋值运算符额外版本，这些版本看起来似乎没那么关键。\n\
  \nC++ 的作者们一定注意到，以下形式的表达式非常常见：\n\n```cpp\nx = x # value;\n```\n\n这里的 `#` 代表某个二元运算符。在对简洁性近乎狂热的追求中，作者为每种这种形式的二元运算符都创建了单独的赋值运算符：\n\
  \n```cpp\nx #= value; // 其中 # 是任意二元运算符之一\n```\n\n因此，例如\n\n```cpp\nn = n + 2;\n```\n\
  \n可以写成\n\n```cpp\nn += 2;\n```\n\n注意：你可能并不会经常看到这种写法，我在这里介绍它主要是为了完整性。\n\n## 第 5 章：字符表达式\n\
  \n### 本章内容\n- 定义字符变量和常量\n- 字符编码\n- 声明字符串\n- 向控制台输出字符\n\n第 4 章引入了整数变量的概念。本章向我们内部人士介绍了整数的更小的兄弟——字符或\
  \ `char`（读音多种，如 care、chair，或 charcoal 的第一个音节）。我在前面章节的程序中使用过字符——现在是时候正式地介绍它们了。\n\n\
  ## 定义字符变量\n字符变量的声明方式与整数相同，只是用关键字 `char` 替换了 `int`：\n\n```cpp\nchar inputCharacter;\n\
  ```\n\n字符常量被定义为用单引号括起来的单个字符，如下所示：\n\n```cpp\nchar letterA = ‘A’;\n```\n\n这可能看起来像是个愚蠢的问题，但“A”到底是什么？为了回答这个问题，我需要解释编码的含义。\n\
  \n## 字符编码\n正如我在第 1 章中提到的，计算机中的一切都由 1 和 0 的模式表示，这些模式可以被解释为数字。因此，位模式 `0000 0001` 在被解释为整数时是数字\
  \ `1`。然而，当同一个位模式被处理器解释为指令时，它的含义就完全不同。所以，计算机通过给每个字母分配一个数字来编码字母表字符，这并不意外。\n\n考虑字符‘A’。只要我们达成共识，你可以为它分配任何你想要的值。例如，如果你愿意，你可以给‘A’分配值\
  \ `1`。在逻辑上，你随后可能会给‘B’分配值 `2`，给‘C’分配值 `3`，依此类推。在这种方案下，‘Z’将获得值 `26`。然后你可以重新开始，给‘a’分配值\
  \ `27`，给‘b’分配值 `28`，一直给‘z’分配 `52`。这仍然剩下数字‘0’到‘9’以及所有的特殊符号，如空格、句号、逗号、斜杠、分号以及你在按住\
  \ Shift 键按下数字键时看到的趣味字符。再加上制表符和换行符等不可打印字符。最后，你可以使用 `1` 到 `127` 之间的数字编码整个英语键盘。\n\n\
  我说“你可以”为‘A’、‘B’和剩余字符分配值；然而，这并不是一个好主意，因为这已经被实现了。在 1963 年左右，对于如何编码英语字符达成了一个通用共识。表\
  \ 5-1 所示的 `ASCII`（美国信息交换标准代码）字符编码几乎被全球采用，除了一家公司。IBM 同样在 1963 年发布了自己的标准。这两种编码标准竞争了大约十年，但到了\
  \ 20 世纪 70 年代初 C 和 C++ 创建时，`ASCII` 已经赢得了这场战斗。`char` 类型的设计时考虑了 ASCII 字符编码。\n\n###\
