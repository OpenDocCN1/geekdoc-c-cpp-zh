  - Debbie Stailey，排版服务总监\n\n## 引言\n欢迎阅读《C++ 编程入门傻瓜》。本书旨在想要学习编程的读者准备。\n\n多年来，编程不知为何与数学、逻辑、微积分以及其他复杂事物联系在一起。我一直无法理解这一点。编程是一项技能，就像写广告、画画或摄影一样。它确实需要透彻思考问题的能力，但我见过一些非常优秀的程序员，他们的数学能力为零。有些人天生擅长学得很快，另一些则没那么擅长学得也不快。尽管如此，任何有足够的耐心和“韧性”的人都能学习计算机编程。甚至我也行。\n\
  \n## 关于《C++ 编程入门傻瓜》\n学习编程意味着意味着学习一种编程语言。本书基于 `C++` 编程语言。书中随附的 CD-ROM 包含了建议的编译器的\
  \ Windows 版本。Macintosh 和 Linux 版本可以在 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 下载。（别担心：我在书中包含了如何安装该包以及构建你的第一个程序的逐步说明。）\n\n本书的目标是教你 `C++` 编程的基础，而不是让你沉浸在 `C++`\
  \ 编程语言的每一个细节中。在本书结束时，你将能够编写一个相当复杂的 `C++` 程序。你也将能够快速掌握许多其他相似的语言，例如 `Java` 和 `C#.NET`。\n\
  \n在本书中，你将发现什么是程序，它是如何工作的，以及如何进行以下操作：\n- 安装 CodeBlocks `C++` 编译器并使用它构建程序\n- 创建和评估表达式\n\
  - 指导程序的控制流\n- 创建能更好地模拟现实世界的数据结构\n- 定义并使用 `C++` 指针\n- 操作字符字符串以生成你想看到的输出\n- 写入文件并从文件中读取内容\n\
  \n## 傻化的假设\n我尽量在书中对读者做出极少的假设，但我确实假设了：\n- 你有一台电脑。大多数读者拥有运行 Windows 的电脑；然而，书中的程序在\
  \ Windows、Macintosh、Linux 和 Unix 上运行同样良好。事实上，由于 `C++` 是一种标准语言，这些程序应该运行在任何带有 `C++`\
  \ 编译器的电脑上。\n- 你知道使用电脑的基础知识。例如，我假设你知道如何运行程序、复制文件、创建文件夹等。\n- 你知道如何导航菜单。我包含了许多指令，如“点击‘文件’然后点击‘打开’”。如果你遵循这条指令，那就没问题了。\n\
  - 你是编程初学者。我不假设你了解任何关于编程的知识。嘿，我甚至不假设你知道什么是编程。\n\n## 本书使用的约定\n为了帮助你尽可能高效地阅读本书，我使用了一些约定：\n\
  - `C++` 术语使用等宽字体，像这样。\n- 新术语用*斜体*强调（并给出定义）。\n- 你需要遵循的编号步骤和需要输入的字符均设为**粗体**。\n\n\
  ## 你不需要阅读的内容\n我鼓励你阅读书的一个部分；然后把书收起来玩一会儿，再移动到下一部分。本书的结构安排使得在每个部分结束时，你已经掌握了足够的新材料，可以去编写程序了。\n\
  \n我想增加以下建议：\n- 如果你已经知道什么是编程，但对 `C++` 一无所知，你可以跳过第 1 章。\n- 我建议你使用书中附带的 CodeBlocks\
  \ 编译器，即使你在完书后想使用不同的 `C++` 编译器。然而，如果你坚持不想使用 CodeBlocks，可以跳过第 2 章。\n- 如果你已经做过一点计算机编程，请略读第\
  \ 3 章。\n- 即使你有 `BASIC` 等其他语言的经验，也从第 4 章开始集中精力。\n- 如果你开始感到饱和，可以在第 20 章后停止阅读。第 21\
  \ 章开启了对象对象编程这一新话题——在你觉得对目前所学内容感到非常自在之前，你不想尝试它。\n- 你可以跳过任何 `TechnicalStuff`（技术细节）图标。\n\
  \n## 本书是如何组织的\n《C++ 编程入门傻瓜》分为七部分。你不需要按顺序阅读它，甚至不需要阅读某个章节中的所有章节。你可以使用目录和索引来找到你需要的信息并快速获得答案。在这一节中，我简要描述了你将在每个部分发现的内容。\n\
