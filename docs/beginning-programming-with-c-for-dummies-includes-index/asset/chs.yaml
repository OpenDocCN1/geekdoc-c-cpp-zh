  \ 指针。\n\n## 第五部分：面向对象编程\n这是你扩展知识到面向对象技术的地方，即使 `C++` 不同于其前身（最特别是 `C`）的特性。（如果你不知道什么是面向对象编程，不要担心——你现在就不应该知道。）在跳到这部分之前，你可能希望对第一到第四部分的内容感到熟悉，但在你完成这部分时，你将成为一名更强大的程序员。\n\
