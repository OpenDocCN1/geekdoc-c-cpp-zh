  \ `factorial` 函数。\n3. 创建 `Factorial.h` 包含文件（无论它是什么），供所有想要调用的模块使用。\n4. 更新 `main.cpp`\
  \ 以使用 `factorial()` 函数。\n\n### 创建 Factorial.cpp\n\n由 `Code::Blocks` 创建的初始控制台应用程序只有一个源文件，`main.cpp`。下一步是创建第二个源文件，其中包含\
