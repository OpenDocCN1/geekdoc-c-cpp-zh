  \ Windows 或内核为 `2.4` 或更高版本的 Linux PC\n- 运行 Apple OS X 或更高版本的 Macintosh\n- 互联网连接（仅在下载\
  \ Macintosh 或 Linux 版本的 `Code::Blocks` 时需要）\n- CD-ROM 驱动器\n\n如果你需要更多关于基础的信息，请查看\
  \ Wiley 出版书籍：Dan Gookin 写的《PCs For Dummies》；Edward C. Baig 写的《Macs For Dummies》；Mark\
  \ L. Chambers 写的《iMacs For Dummies》；以及 Andy Rathbone 写的《Windows XP For Dummies》、《Windows\
  \ Vista For Dummies》 和《Windows 7 For Dummies》。\n\n### 使用 CD\n\n这些步骤将帮助你将 CD 中的项目安装到硬盘上：\n\
  \n1. 将 CD 插入计算机的 CD-ROM 驱动器。\n   出现许可协议。\n   Windows 用户注意：如果你禁用了自动运行，界面将不会启动。在这种情况下，选择\
  \ `开始⇒运行`。（对于 Windows Vista，选择 `开始⇒所有程序⇒辅助工具⇒运行`）。在出现的对话框中，输入 `D:\\Start.exe`。（如果你的\
  \ CD 驱动器使用不同的字母，请将 `D` 替换为相应的字母。如果你不知道，请查看“我的电脑”如何列出 CD 驱动器。）点击确定。\n   Mac 用户注意：当桌面出现\
  \ CD 图标时，双击图标打开 CD 并双击 `启动` 图标。\n   Linux 用户注意：不同版本的 Linux 挂载和使用 CD 的细节差异很大。如果你在使用此\
  \ CD 时遇到困难，请查看你特定系统的手册或帮助信息。\n\n2. 阅读许可协议，如果你想使用此 CD，请点击 `接受` 按钮。\n   出现 CD 界面。该界面允许你只需点击一次或两次按钮即可浏览内容并安装程序。\n\
  \n3. 将 C++ 源代码拷贝到硬盘上。\n   你可以在 CD-ROM 上查看源代码，但无法在上面构建或执行程序。\n\n4. Windows 用户将想要安装\
  \ `Code::Blocks` 环境。\n   第 2 章将带你了解如何安装 `Code::Blocks` 以及如何创建第一个程序的逐步说明。\n\n## 你将在\
  \ CD 上找到什么\n\n以下章节按类别排列，提供了你将在 CD 上找到的软件和其他额外内容的摘要。如果你在安装 CD 提供的项目时需要帮助，请参考前一节中的安装说明。\n\
  \n对于列出的每个程序，我都提供了程序运行平台（Windows 或 Mac）以及软件类型。程序属于以下类别之一：\n\n- **共享软件（Shareware programs）**是受版权保护程序的完整功能免费试用版。如果你喜欢某些程序，可以支付少量费用向作者注册并获得许可、增强版和技术支持。\n\
  - **免费软件（Freeware programs）**是免费的受版权游戏、应用程序和实用工具。你可以免费将它们拷贝到任意数量的计算机上，但它们不提供技术支持。\n\
  - **GNU 软件**受其许可约束，许可包含在 GNU 软件文件夹内部。GNU 软件的分发不受限制。更多详细信息请参见 CD 根目录下的 GNU 许可。\n\
  - **软件的试用版、演示版或评估版**通常受时间或功能限制（例如，在创建项目后不让你保存）。\n\n### CPP 程序\n\n适用于所有环境。书中提供的所有示例都位于\
  \ CD 上的 `Beginning_Programming-CPP` 目录，适用于 Macintosh、Linux 和 Windows 以及后来的计算机。这些文件包含了书中的示例代码。每个示例程序都在自己的文件夹中。例如，`Conversion`\
  \ 程序位于：\n\n`Beginning_Programming-CPP\\Conversion`\n\n适用于 Windows。我为 `Code::Blocks`\
  \ 构建了一套工作空间和一套项目文件，允许你通过单击即可重新编译书中所有的程序。`AllPrograms.workspace` 文件位于 `Beginning_Programming-CPP`\
  \ 文件夹中。（请参见第 2 章关于 Code::Blocks 项目文件的说明）。在使用它之前，你必须将源代码从 CD-ROM 拷贝到你的硬盘上。\n\n###\
  \ Code::Blocks 开发环境\n\n适用于 Windows。`Code::Blocks` 是一个“开源、跨平台”免费软件环境，设计用于与多个编译器配合。CD-ROM\
  \ 中包含的版本附带适用于 32 位 Windows 版本的 `GNU C++` 编译器（版本 `4.4`）（如果你不知道你的 Windows 是否是 32 位，它几乎都是）。`Code::Blocks`\
  \ 由“Code::Blocks 团队”支持。你可以在 `www.codeblocks.org` 找到更多信息。\n\n适用于非 Windows。你可以在 `www.codeblocks.org`\
  \ 下载适用于你操作系统的 `Code::Blocks` 版本。\n\n### 故障排除\n\n我已尽力编译了可以在符合最低系统要求的计算机上运行的程序。遗憾的是，你的计算机可能不同，某些程序由于某些原因无法正常工作。\n\
  \n我为包含的 C++ 源代码提供了 `Code::Blocks` 工作空间和项目文件。这允许你通过字面上的单击即可重新编译所有程序。然而，这些项目文件假设程序安装在\
  \ `C:\\Beginning_Programming-CPP` 目录下。如果你决定将源代码安装在不同的目录，你需要自己设置项目文件。\n\n\n\n\n其他常见问题是您没有足够的内存（RAM）来运行想要使用的程序，或者有其他程序正在运行，影响了程序的安装或运行。如果您收到诸如\
  \ `Not enough memory` 或 `Setup cannot continue` 等错误消息，请尝试以下一个或多个建议，然后再次尝试使用软件：\n\
  \n- 关闭计算机上正在运行的任何杀毒软件。安装程序有时会模拟病毒活动，可能会让您的计算机错误地认为自己正受到病毒感染。\n- 关闭所有运行中的程序。运行的程序越多，留给其他程序的内存就越少。安装程序通常会更新文件和程序；因此，如果您保持其他程序运行，安装可能无法正常进行。\n\
  - 让您的本地电脑商店为您的电脑增加更多 `RAM`。诚然，这是一个非常激进且有些昂贵的步骤。然而，增加内存确实可以提高计算机运行速度，并允许更多程序同时运行。\n\
