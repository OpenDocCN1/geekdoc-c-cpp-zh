    The first aim of the study is to examine the distribution and functions of the
    PP in four native English varieties, and with the findings to shed light on the
    question of whether the various readings of the PP represent semantic structures
    or different realizations of a single meaning. It is our conviction that these
    questions of type are appropriately illuminated via a detailed analysis of naturally
    occurring linguistic data, and moreover that such analysis is not necessarily
    incompatible with the practice of appealing to one’s linguistic intuitions. The
    second aim of the study is to identify similarities and differences in the functions
