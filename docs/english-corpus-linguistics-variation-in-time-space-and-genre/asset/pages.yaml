    Lack of syntactic integration of this kind is not exceptional but pervasive in
    cleft constructions in spoken English. Calude, for example, finds 30 unintegrated
    wh-clefts in a total of 74 instances in her study of the Wellington corpus (2009:
    170). In her analysis of a standard example from the literature similar to (1),
    Miller and Weiner’s (1998: 292) cause what you’re doing ''is you go up on the
    side of the allotments, she also argues that “the cleft constituent is, in effect,
    a fully independent clause, which is separate from the rest of the cleft” (2009:
    170). Apart from clefts, there are several other constructions with weak or non-existent
    syntactic integration which are generally absent from written language or to be
    purged from written representations of spoken language – such as, for example,
    left and right dislocation of noun phrases (this man, I can’t stand him or gets
    on my nerves, this man). A focus similar to the one illustrated in (1) will serve
    as a test case for our exploration of the history of spoken English before.


    The complex noun-phrase premodification illustrated in example (2), by contrast,
    serves as a device to maximize compress information, which is not a priority in
    most types of spoken communication. Such clear contrasts between grammatical preferences
    in speech and writing raise two questions:


    +   (a) Are our corpus-based histories real histories of English, or just histories
    of the written (and standard) language, potentially misrepresenting or even disregarding
    developments in informal speech?


    +   (b) If so, can we recover the largely lost or submerged diachrony of the spoken
    language? For after all, constructions such as the one represented in example
    (1) are probably not new innovations but have a history of their own.


