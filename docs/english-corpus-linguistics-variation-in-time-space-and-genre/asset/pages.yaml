  md: '# 170 Cristina Suárez-Gómez & Elena Seoane


    candidate for an emerging form in the expression of perfect meaning in which the
    time reference is made clear by the adverbs just, ever, never and yet, since it
    represents the most frequently used form in both spoken and written AsEs, and
    it is not absent from BrE either.


    The base form illustrated in (7), then, seems to be consolidating itself as an
    alternative structure in perfect constructions in combination with some temporal
    markers in these varieties of English. A number of factors can be adduced here
    to account for the high infancy of base forms in our data. The first of these
    is the explicit presence of an adverb, which makes the perfect meaning clear and
    render the grammatical affix unnecessary and redundant. Such a development would
    be in accordance with the well-known tendency in emerging English to simplify
    morphology and optimise syntactic means of grammatical meaning, especially with
    regular verbs (Mesthrie and Bhatt 2008: 58-59; Kortmann and Szrecsmanyi 2004:
    1191). This would be with analyticity in Szrecsmanyi and Kortmann (2009) and Tagliamone
    (2009), among others, that is, the ongoing typographical change of English from
    a synthetic to an analytic language. It would also lend support to Miller’s (2000:
    335–244) view that perfect meaning in English has come to rely on the presence
    of certain adverbs, like the ones analyzed here, which are on their way to becoming
    grammaticalised as perfect markers:


    > [T]he information inherent in the Perfect construction is that some entity possesses
    in present time the result of some past event. For a given clause in the Perfect,
    the rest of the interpretation comes from the lexical items in the clause, from
    the context and, crucially for the present purposes, from the above-mentioned
    adverbs [ever, yet and just]. The recent past-time component is signalled by just,
    the experiential component is signalled by ever and the resultative component
    is signalled by yet (Miller 2000: 334-335).


    Secondly, the use of the base form has been found to depend on a large extent
    to phonological and morphological conditions: as shown in Table 2, regular verbs
    whoseed form ends in a consonant cluster, where either final [t] (e.g. parked)
    or [d] (e.g. turned), tend to occur more frequently in the base form than regular
    verbs with final [id] (e.g. folded). Similar findings were obtained by Ho and
    Platt (1993: 74-141) in their study of past tense marking in Singapore English
    (SinE). The occurrence of regular verbs in the base form involves a phonological
    simplification which would be related to case of production (in the case of reduced
    consonant clusters) and case of perception (the low perceptual saliency of final
    [d] in regular verbs compared to [id]), factors that tend to play a role in cases
    of language contact (e.f. Filippula et al. 2009: 3–4). Moreover, in this connection
    cannot dismiss the influence of the substrate language, as most of the cases found
    (95 out of 99) occur in Hong Kong English (HKE) and SinE, both having Chinese'
