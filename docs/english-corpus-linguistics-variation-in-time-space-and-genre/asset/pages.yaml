  md: '# 3. Results


    # 3.1 Combining academic key verbs and high frequency verbs


    The two vocabulary extraction methods described in section 2 clearly adopt different
    approaches. The keyness method, based on statistics, extracts the verbs that are
    significantly more frequent in LOCRA than in the contrasting corpus of fiction,
    thereby identifying the verbs that can be considered as typical of EAP. The frequency
    analysis, on the other hand, does not contrast corpora or inferential statistical
    measures, but enables the identification of the verbs that were used most frequently
    in LOCRA, thereby identifying the verbs that can also be considered as typical
    of EAP.


    The verb lists yielded by these two methods are not completely dissimilar, as
    a large number of verbs appear in the two lists (e.g. suggest, use, compare, examine,
    etc.). The two lists mainly differ in that a number of highfrequency verbs which
    have typical EAP uses (e.g. make a contribution or find a correlation) appear
    in the high-frequency verb list and not in the key verb list. This does not mean
    that the analysis of frequencies provides better results. By including high-frequency
    verbs such as find or make, the frequency analysis may not have extracted all
    the academic verbs that the keyness analysis did. This study illustrates how these
    two methods are complementary and should, therefore, be combined, for pedagogical
    purposes, to extract academic vocabulary.


    The key verb and the high-frequency verb lists of each sub-corpus in LOCRA were
    merged. As shown in Table 7, the final verb lists do total between 300 and 400
    verbs each. When combining the lists of each sub-corpus, there was an overlap
    of approximately 200 verbs. In words, about 50% of each final academic verb list
    was extracted by both the keyness and the frequency analysis. Table 8 shows that
    the new academic verb lists now represent between 12.4 and 14.9% of the total
    number of verb types and around 83% of the total number of verb tokens in each
    discipline. These figures indicate that, although the academic verbs identified
    in LOCRA represent a small proportion of the total number of verb types (c. 10%),
    they still represent a clear majority of the total number of verb tokens (c. 80%).'
