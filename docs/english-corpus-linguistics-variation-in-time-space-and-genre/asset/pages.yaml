  md: '# Discourse communities and their writing styles: A case study of Robert Boyle


    Lilo Moessner


    RWTH Aachen


    # Abstract


    In this paper the disciplines medicine and natural science are interpreted as
    discourse communities, and it is assumed that discourse communities are characterized
    by their writing styles. The difference between the writing styles of the two
    discourse communities is demonstrated by a multidimensional analysis of five medical
    and five science texts of the 17th century. Robert Boyle (1627-1691) is introduced
    as a member of the medical and of the science discourse community. A corpus of
    five his medical and five of his science texts is analyzed to test the hypotheses
    that his medical and his science writing styles were different from each other
    as the writing styles of the authors of the other 17th century medical and science
    texts, and that Boyle followed the practices of his contemporaries. Both hypotheses
    are refuted, and Boyle’s deviating writing styles are explained as manifestations
    of his authorial identity. The appreciation of Boyle’s achievements by the medical
    and science discourse communities of the 18th century is taken as the motivation
    for the hypothesis that his writing styles, too, were admired and imitated. This
    hypothesis is tested through a diachronic analysis of 17th century medical and
    science texts, Boyle’s medical and science texts, and 18th century medical and
    science texts. A comparison of their linguistic profiles weakly support the hypothesis
    in case of Boyle’s writing style and strongly in the case of his medical writing
    style. As a conclusion it is suggested that future research should treat science
    and medicine as distinct disciplines already in the 17th century and that linguists
    should pay more attention to Boyle’s medical texts.


    # 1. Introduction


    One of the most influential definitions of the concept of discourse community
    is given by John Swales (1990: 25-27). He establishes six properties by which
    discourse communities are identified. They possess a set of common public goals,
    they develop characteristic mechanisms of interconnection, which they primarily
    use for information and feedback, their all are pursued in community-specific
    genres, their discourses contain specialized terms, and their members have a suitable
    level of expertise in community-relevant topics and discourse'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 32 Lilo Moessner


    practices. Although he points out that his definition does not restrict discourse
    communities to academic contexts, it is for the analysis and description of academic
    language that the concept of discourse community is used most frequently (Duff
    2010; Hyland 2011; Noguchi 2006; Römer 2008). Hyland (2000 [2004]: 8f) discusses
    the possibility of viewing individual academic disciplines as discourse communities
    fulfils Swales'' criteria. Their members know the research goals of their disciplines,
    they successfully participate in disciplinary discourses, in meetings with their
    colleagues exchange information and get feedback, they use the accepted genres
    and the appropriate terminology, and they can name the leading experts of their
    disciplines.


    Although it is unquestionable that medicine and science in its modern sense are
    different disciplines today, Present-Day English texts of both disciplines are
    sometimes grouped together in electronic corpora (Biber and Gray 2011:14), suggesting
    that their linguistic profiles are very similar. Also the conclusion to be from
    studies analysing the linguistic structure of ‘science’ texts, using data from
    medicine (González-Álvarez and Pérez-Guerra 1998, Taavitsaiten 2001, 2005). In
    A Representative Corpus of Historical Registers (ARCHER), ‘medicine’ and ‘science’
    are treated as text categories, but a comprehensive diachronic study based on
    this is lacking. In paper I will show that the linguistic profiles of medical
    and science texts (in the sense of natural science) are sufficiently different
    from each other so that they can be interpreted as reflecting the discourse practices
    of two disciplines.


    Swales'' (1990: 30) definition of discourse community implies that individuals
    may belong to several discourse communities. It will be argued that Robert Boyle
    (1627-1691) was a case in point. He is best known for his discovery of the inverse
    proportion of pressure and the volume of the air, the so-called Boyle-Mariotte
    Law. Yet Boyle’s interests went beyond the boundaries of natural science. He was
    also active in medicine, practising dissection and conducting experiments on blood
    circulation. Boyle’ engagement in both disciplines is not unnoticed by a number
    of book-length publications, but also by his contributions to the Philosophical
    Transactions of the Royal Society and his extensive correspondence with famous
    representatives of both disciplines. So far, linguists have paid attention to
    only his science texts, focusing on the new writing style he advocated in Pro휼
    Essay (Gotti 1996, 2001; Laro and Reyes 2007); Contributions to the discipline
    machine have been extensively discussed by social historians, who have analyzed
    Boyle’s role in the controversy between Galenists and Paracelsists (Harwood 1994,
    Hunter 1997, Kaplan 1993).


    As a member of two discourse communities, Boyle could be assumed to adopt the
    discourse practices of the corresponding disciplines, and use a writing style
    in his medical texts that differed from his science texts in the same way as the
    writing styles of other 17th century authors of medical and science texts. Both
    assumptions will be proved wrong by empirical evidence.'
