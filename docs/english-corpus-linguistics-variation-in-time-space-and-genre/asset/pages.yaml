  md: 'Appraisal theory and corpus-linguistic methods. The analysis presented here
    suggests that Appraisal is an important aspect of the language of corporate social
    reporting, which has significant implications for the construction of a corporate
    identity, and for the discursive negotiation of a company’s relations with stakeholders.
    The results seem to indicate that different companies operating in different contexts
    do, in fact, deploy Appraisal resources differently. BP’s and IKEA’s use of Appraisal
    resources may be interpreted as a response to public concerns and an attempt to
    foster a positive relationship with their stakeholders. From a methodological
    point of view, the present study seeks to confirm, with Ä and Reppen (2008), discourse
    analysis and corpus tools can fruitfully combined to enable deeper empirically
    informed understanding of language phenomena, ensuring “statements about genre
    and discourse are substantiated with reference to data” (Boni 2008: 35).


    This study has some limitations, which proper opportunities for future research.
    Based on the findings presented here, further conclusions about general trends
    in the use of evaluative language in the genre of corporate social reports is,
    therefore, not possible. The analysis is limited in scope and depth. The analysis
    of Attitude is restricted to the general categories of Affect, Judgement and Appreciation.
    The analysis of Engagement is confined to the categories of Proclaim and Entertain,
    and within these categories, only a finite group of resources is considered. In
    addition, the system of Graduation is not systematically analysed in this study.
    A more comprehensive analysis of Appraisal in the BP and IKEA reports could improve
    our understanding of the differences in the patterns of evaluative language observed
