    A comparison between Asian varieties and BrE (cf. the Total columns) shows that
    in both varieties the most common way of expressing meaning in the selected contexts,
    although not the only one, is by means of the canonical have + past participle
    construction. However, this tendency is more pronounced in BrE, with 65.5% of
    all cases, and in ASEs with 55.5%. In both varieties the most frequent form is
    the preterite, but this is more common in ASEs (34% against 31%). The difference
    between the use of the have + past participle and the preterite is statistically
    significant (p < 0.5).


    The two forms, (7) and (8), seem to represent fairly established forms in ASEs,
    since they occur in 104 instances (4.7% and 2.2% of cases), while their presence
    in BrE is residual or non-existent (since instances of the base form, none of
    have + base form). For the remaining forms in Table 1, they are also less frequent
    in BrE, where they make up 1.4% of all forms, while in ASEs they are used in 3.4%
    of cases. So ASEs have a larger number of variants to express meaning in the analyzed
    contexts, and the forms other than the canonical have + past participle are more
    frequent in these varieties than in BrE (and almost as frequent as the canonical
    form, since all of them together amount to 44.5% in ASEs, to 34.5% in BrE). This
    can be understood by the fact that these Asian varieties, in contrast to BrE,
    do not have an established norm to follow (or are norm-developing, in Kachru’s
    1985 terms), which might account for the disparity found between ASEs and BrE.


    As for the influence of the mode on the use of perfect meaning forms, in BrE there
    is a strong association between the written mode and conformity to what is established
    in grammar of English, which favour of the have + past participle periphrasis
    over other forms. The only exception is the preterite, which in any comes to less
    than one fifth of the occurrences (19.3%). Regarding the Asian varieties, it is
    the written mode which comes closer to the BrE variety, with similar values in
    the use of the most frequent forms (have + past participle and preterite) and
    with the virtual absence of non-canonical forms. In the spoken mode, however,
    we see that most of the alternative variants, and in this sense it differs greatly
    from BrE.'
