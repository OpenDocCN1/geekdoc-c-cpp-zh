  md: '# New developments in corpus linguistics


    Variation in time: Corpus studies in the history of English


    Christian Cair''s article addresses one of the most important limitations of corpus-based
    descriptions of past stages of the language, even in the case of well-documented
    languages like English, namely the general restriction of the available data to
    the written medium. By looking at the history of a particular kind of cleft construction,
    the specific cleft of the type What I did was called the police, Maire demonstrates
    the value of using corpora to investigate change in the spoken language. He discusses
    the potential of studying “real speech in real time” by focusing on two types
    of evidence: on the one hand, sound recordings from the 20th century, specifically
    those of the World War 1 Phonographische Kommission, which he considers to be
    “a unique resource for the study of historical dialectology”; and on the other
    hand, speech-written genres, which provide information about the history of the
    spoken language “by proxy.” Drawing on data from the Literature Online (LION)
    database, the Old Bailey proceedings and the COHA and COCA corpora, he is able
    to shed light on the development of this focusing construction which is strongly
    associated with spoken English, thus showing how the corpus linguist may approach
    the spoken language of earlier stages of English.


    Lilo Moessner considers the medical and (natural) science texts of the 17th century
    scientist Robert Boyle compares them to other medicine and science texts from
    the 17th and 18th century. Moessner''s point of departure is that medicine and
    science are two different discourse communities (defined by Swales 1990), and
    that they will be characterised by different writing styles. In order to establish
    what these differences are, she uses multidimensional (MD) analysis (Biber 1988),
    in which the communicative functions of texts are described as variations of language,
    which again are derived from the occurrence patterns of linguistic features. Moessner
    analyses Boyle''s texts in relation to each other and to 17th and 18th century
    texts, and is able to conclude that Robert Boyle''s writing style was unexpected,
    dissimilar in his manner and science texts, and that his style deviated from the
    discourse practices of the 17th century, as evidenced by the 17th century texts
    in his corpus. Furthermore, Boyle was so influential that a century later, both
    medicine and the science discourse adopted Boyle'' particular narrative, abstract,
    and explicit writing style.


    Gjertud Stenbrenden''s work focuses on the Great Vowel Shift (GVS), and has recently
    shown her in her PhD thesis that the GVS in all probability started at an earlier
    date than has been hitherto asserted. In this article, she considers the spelling
    of diphthongisation of Middle English ū, making use of the linguistic atlases
    of early and late Middle English (LAME and LAEME). The spelling of ū was usually
    <u>, which means that when irregular spellings such as <u> and <ow> occur, they
    may indicate diphthongisation. The problem is however, that the digraphs were
    used by Anglo-Norman scribes to represent the monophthong /u/, as in French. Thus,'
  merge: -1
  pgno: 9
- img_proc: true
  md: '4 Kristin Bech & Gisle Andersen


    spellings are ambiguous. However, Stenbrenden indicates that irregular spellings
    must be assessed in relation to the entire orthographic system in which they occur,
    and when this is, a spelling such as <u> can be used as evidence for diphtongisation,
    i.e. vowel shift, in some cases. Stenbrenden’s careful study concludes that a
    few of these irregular spellings do indeed indicate that diphtongisation started
    as early as the mid-13th century, but that uncontroversial evidence is not to
    be had until the 15th century.


    Variation in space: Corpus studies of contemporary features of English


    Christopher Koch and Tobias Bernaisch are concerned with the varieties of English
    used on the Indian subcontinent, jointly referred to as South Asian English. Their
    paper focuses on the so-called “new detransitive constructions” (NDTs; cf. Hoffman
    and Mukherjee 2007), i.e. verbs which are attestable in the detransitive construction
    in New English but not in the present-day version of their historical input variety,
    British English. Verbs such as GIFT, BRIEF and INFORM are used in these varieties
    in the double-object construction (i.e. to get him a dream), which is derived
    from semantically-ological class of detransitive verbs such as GIVE in British
    English. The authors hypothesise that not NDTs will be attestable in South Asian
    varieties of English in which the English language is given firm constitutional
    recognition, i.e. Indian English, Pakistani English and Sri Lanka English, and
    that a lower number of NDTs occur in those varieties in which English is not or
    minimally rooted in the respective constitutions, as is the case in Bangladesh
    English, Maldivian English (SAVE) and Nepali English. Using data from the South
    Asian varieties of English, supplemented with searches using the Google Advanced
    Search Tool (GAST), the authors find at least partial support for this hypothesis
    by considering frequency and lexical diversity in the six South Asian varieties.
    They show that this occurs in all the varieties investigated, but that Indian
    English seems to have a special status, that it is only in this variety that NDTs
    can be attested with relatively high frequencies in newspapers as well in a wider
    range of textual samples.


    Also concerned with regional varieties of English, Xinue Yao and Peter Collins
    examine the perfect (PP) construction in the four varieties British, American,
    Australian and New Zealand English with regard to its distribution, register variation
    and functional properties. Distinguishing functionally between continuative, resultant
    and experimental perfects, the authors address the question of whether the various
    readings of the PP represent distinct semantic structures or different relations
    of a single meaning. They argue that theoretical questions of this kind ought
    to be illuminated by a detailed analysis of naturally occurring linguistic data,
    and that such analysis is not necessarily incompatible with the practice of appealing
    to one’s linguistic intuitions. Their data are drawn from the relevant components
    of the ICE corpus, supplemented with the Santa Barbara Corpus of Spoken American
    English. Their'
