  md: '# 192 Daniel Lees Fryer


    The concepts and terminology used in this paper follow the model of Martin and
    White (2005) and the theoretical framework of Halliday and Mattheiessen (2004),
    unless stated otherwise.


    # 4. Methodological considerations


    In a study such as this, it is worth acknowledging the challenges of annotating
    heteroglossic features the descriptors summarized in section 2. The linguistic
    resources identified here are polysemous, and categorization requires careful
    consideration of the co-text. For example, in (15), included signals ‘ertain’,
    but in (16) the proposition is a monoglossic bare assertion. This makes automated
    annotation difficult (at least without the use of relatively complex identification
    algorithms), and categorization needs to be considered in relation to the co-text.
    There are, of course, a number of ways to simplify this. In his predict of ATTITUDE,
    Kaltenbacher (2006: 274-275) suggests trying to predict a priori items for search;
    for analyzing a limited set of sample items in order to create a list of search
    items; or using automatically generated frequency lists among the most frequently
    occurring words. While a combination of these approaches might be fruitful, items
    that are low frequency and may be specific to the register or to individual texts
    could be missed (ibid.: 275). Therefore choose to annotate the corpus manually,
    which limited the size of the overall data set, but reduced the risk of missing
    potentially important, low-frequency items.


    +   (15) Secondary outcomes included death from any cause, the need for revascularization,
    hospitalization for unstable angina or heart failure, and complications related
    to diabetes. [’ertain’


    +   (16) Patients included in the relevant category of heart failure beginning
    with the date of the first occurrence of heart failure. ‘monoglossic’


    As Thompson and Hunston (2006: 3) note, “[o] aspect of [systemic-functional linguistics]
    that can appear unappealing [to corpus linguists] is the feeling that analyses
    have to be ‘shoehorned’ into categories.” In (17), for example, could potentially
    construct ‘ertain’ (≈ suggest) or ‘endorse’ (≈ show see section 3). Categorizing
    this item as constructing one or the other overlooks this polysemy. I therefore
    annotated the example as having the ability to construct both ‘ertain’ and ‘endorse’,
    at least “for the brief textual moment” (Martin and White 2005: 99), rather than
    selecting one or the other, or creating a new category. However, as (18) demonstrates,
    and as noted above, this does not presume that all instances of indicate encode
    either or both of these heteroglossic features.'
