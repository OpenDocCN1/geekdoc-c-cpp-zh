  md: 'The diphthongisation of ME ū 61


    # 6. Final notes on logic


    The relationship between eME  and õ may be considered when one attempts to date
    the early stages of the diphthongisation of ME , since the evidence for this diphthongisation
    is circumstantial at best. In the ''Great Vowel Shift'', the reflex of ME õ was
    raised to [u]; evidence for such raising is attested from the thirteenth century
    (Stenbender 2011). A true merger cannot be undone: if two phonemes merge, it is
    impossible for the word classes to be separated again at a later date on an etymologically
    correct basis, unless it is the result of a conscious effort on part of linguists
    and the entire speech community. Consequently, since the reflex of ME õ did not
    merge with that of ME , the phonetic reconstructions of the two must have remained
    distinct until now. Therefore, the diphthongisation of must have been roughly
    simultaneous with the rising of ME õ, which started in the thirteenth century.
    The much less evidence for the rising postulated in part by of the first scholars
    to recognise the consequences of the rising of /o/ to [u], for which he concluded
    it was ''probably completed during the fourteenth century at the latest'' (Wylde
    1936: 231), and since the reflexes of OE õ and õ did not merge, the diphthongisation
    of the ''full-blown'' [au] stage may well have been reached in the fifteenth century
    in eastern parts of the country (Wylde 1936: 2361).


    Most scholars now accept late <> and as evidence for advanced diphthongisation
    of the argument has been raised that cannot be used, because they are traditional
    spellings for etymological au, with the reflex of ME never merged. If this is
    accepted, such a view would have serious consequences: cannot be used for evidence
    of ME , since are traditional spellings for ME , with ME õ did not merge; cannot
    be used as evidence for rising of õ , since they are traditional spellings for
    ME , with ME õ did not merge; are. But clearly, there is a flaw in this argument:
    irregular spellings are just, they, irregular, and outside the scribe''s system,
    although they may be in a few cases, result from a conscious effort to ''write
    as I speak''. In words, irregular spellings may not represent any attempt on the
    scribe''s part to devise new spellings for changed sounds and at the same time
    make these innovative spellings fit with the rest of their orthographic system,
    that for instance traditional <ai> corresponds to the same sound as innovative
    <ai> for the vowel of the WIFE class. In connection to this, it is also worth
    asking what orthographic means were there to indicate /u:/ to [to] and [au] and
    [au], given the limitations of the Roman alphabet? One might expect <ow>, <eu>,
    and <aw>, which are all found in the ME sources. It is my contention, therefore,
