    First, however, we turn to the results recorded for TIME, which gives us an opportunity
    to study the development of AMCULT61 and BRCULT61 over the best part of the 20th
    century, albeit with the limits set by the fact that this is all from one and
    the AmE text category.


    Not surprisingly, the figures for AMCULT61 are invariably higher than the two.
    What is of interest is the variation over time for both AMCULT61 and BRCULT61.
    Both sets of terms can be seen to show a slight increase between the first two
    decades of this corpus, from the 1920s to the 1930s. Then AMCULT61 displays a
    very steep further growth in the 1940s. which is easily the most dramatic decline
    of the 20th century, with many parts of the world engulfed in the atrocities of
    the Second World War for the first half of the decade, it was only to be expected
    that hard values associated with AMCULT61, several of them directly related to
    the conduct of war, which would be particular in that decade. We see that the
    results recorded for AMCULT61 then begin a decline, which lasts right up to the
    2000s. And yet, in final decade of the TIME corpus the AMCULT61 figure is only
    slightly lower than for the first decade, the 1920s.


    The variation in figures for BRCULT61 is much less marked. Here the 1930s represent
    a high point but the subsequent decline is only moderate and not consistent from
    decade to decade. The recorded frequency rises over the last couple of decades,
    leaving the 1980s – as the decade with the lowest recorded frequency for the soft
    values associated with many of the terms making up BRCULT61.'
