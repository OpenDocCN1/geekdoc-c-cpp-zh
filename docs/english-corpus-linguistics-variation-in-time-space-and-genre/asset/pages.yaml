  md: '# Texturing a responsible corporate identity: A comparative analysis of Appraisal
    in BP’s and IKEA’s 2009 corporate social reports


    Matteo Fuoli


    Lund University


    # Abstract


    In response to a growing public demand for corporate accountability and social
    responsibility, large companies are investing increasing efforts in the communication
    of their responsible conduct. Through corporate social reports, they voluntarily
    account for the social and environmental effects of their operations and document
    their efforts to implement sustainability principles. This paper presents a comparative
    analysis of BP’s and IKEA’s 2009 corporate social reports. The analysis combines
    Appraisal theory and corpus-linguistic methods to identify and compare patterns
    of evaluative language and modality in the reports. The main goal of the analysis
    is to explore how, through these language resources, BP and IKEA construct their
    corporate identity and negotiate their relationship with their audience. The analysis
    reveals significant differences in the use of Appraisal resources between the
    two reports, which reflect broader differences in the relative emphasis the companies
    put on traits of their corporate persona.


    # 1. Introduction


    Recent years have witnessed a growing public concern over the impacts of firms’
    activities on the environment and society as a whole (Carroll and Shabana 2010).
    The resulting increased demand for corporate accountability and social responsibility
    “has evoked a number of textual responses” (Skulado 2005: 71) and has profoundly
    changed the ways companies communicate with their public. New forms of corporate
    ‘social’ reporting have emerged and novel genres of corporate discourse have gained
    prominence (Catenacco 2011; Skuludad 2002). Nowadays, it is common practice for
    large companies to release, on a yearly basis, a voluntary corporate social report,
    a document in which they account for the social and environmental effects of their
    operations and document their efforts to implement sustainability principles (Bebbington
    et al. 2008; Gray et al. 2001; KPMG 2011).


    Fairclough (1992: 8) argues that “[c]hanging discourse practices contribute to
    change in knowledge (including beliefs and common sense), social relations and
    social identities”. Drawing on Halliday’s multifunctional view of language (Halliday
    1978, 1994), the author develops an approach to discourse'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# 210 Matteo Fuoli


    analysis that accounts for how texts simultaneously construe reality – the ideational
    function, social relations – the relational function, and identities – the identity
    function (Fairclough 1992, 8). Previous research into the language of corporate
    social reports has tended to focus on their ideational function, namely how these
    texts construct and present a particular representation of the world. In spite
    of the acknowledged role of corporate social reports as a means for dialogue between
    organisations and their stakeholders (Gray et al. 1995), their interpersonal (identity
    and relational) functions, i.e. how these texts reporting companies discursively
    construct their identity and negotiate a relationship with their audience, have
    not, to my knowledge, been the subject of systematic investigation.


    With the aim to contribute to closing this research gap, the present paper employs
    Appraisal theory in a comparative analysis of interpersonal discourse semantics
    in BP’s and IKEA’s 2009 social reports. The analysis addresses the following questions:
    How do BP and IKEA portray themselves in their reports? What kind of relationship
    do they establish with their imagined interlocutors? The analysis combines corpus-based
    techniques for the quantification of Appraisal results in the reports with a discourse
    perspective on their interplay and communicative significance. In this respect,
    this paper may be seen as a contribution to the growing body of research that
    explores linguistic methods for the analysis of discourse (Aidel and Reppen 2008).


    The paper is organised as follows: section 2 presents a review of relevant discourse
    analysis research on corporate social reports, section 3 outlines Appraisal theory,
    section 4 describes the method adopted for the analysis, and sections 5 and 6
    report the results and provide some interpretive conclusions, respectively.


    # 2. Related work


    Several studies have analysed corporate social reports from a social constructionist
    perspective (Berger and Luckmann 1967), employing qualitative discourse analysis.
    Livesey (2002: 321) examines salient and rhetorical features of Shell’s first
    corporate social report. The author explores, in the wake of mounting public pressure
    after major environmental controversies, the company attempted to reshape its
    image through communication. Livesey (2002: 338) concludes that Shell’s new environmental
    discourse aimed to reconcile such controversies by embracing a conception of sustainable
    development which, indeed, failed to pose any real challenge to ‘business usual’.
    A similar conclusion is reached by Laine (2005, 2010), who employs an analytical
    approach to deconstruct the meaning of the term ‘sustainable development’ in the
    social discourses produced by Finnish companies. The results of his analysis show
    how the concept of sustainability is constructed as compatible with economic growth
    and generalised as an ideal solution to social and environmental problems which
    requires no major restructuring of the current economic paradigm. At the same
    time, however,'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Texturing a responsible corporate identity


    Laine (2005) notes that, despite the enthusiasm with which it appears to be endorsed
    by reporting companies, sustainability is often reduced in corporate reports to
    abstract and vague principles, with relatively little emphasis on the measures
    adopted to achieve it the results obtained. A similar point is made in Milne et
    al. (2005). In their account of the employment of the journey metaphor in the
    social reports of several New Zealand organisations, the authors note that, conceptualising
    sustainable development as a journey, the reporting companies avoid having to
    face the complex issue of identifying and describing corporate sustainability
    goals and strategies.


    Recently, corpus-linguistics tools have been used in quantitative analyses of
    corporate social reports. Lischinsky (2011) explores the business notion of sustainable
    development in a collection of both financial and corporate social reports issued
    by fifty Swedish corporations. By analysing collocational patterns for the stem
    sustain*, the author concludes, in line with the studies mentioned above, the
    business view of sustainability is frequently connected with profit and corporate
    prestige, and market objectives and proclaimed intentions are more prominent than
    concrete actions. Adopting a similar method, Malavasi (2011) compares different
    conceptualisations of corporate social responsibility in two corpora containing
    the social reports revealed by Nokia and Ericsson over a period of seven years.
    Through analysis of keywords and their collocational and phraseological patterns,
    the author identifies similarities and differences in the values exposed by the
    companies and the emphasis placed on the main areas of corporate social responsibility,
    namely the environment, society and economic performance. She observes that whereas
    firms show a common concern for the protection of the environment, stakeholder
    engagement and employee welfare, they appear to diverge in their priorities and
    the rhetorical strategies they adopt to demonstrate their ethical stance. The
    author deconstructs the rhetoric that varies how they appropriate and mould the
    concept of corporate social responsibility to promote themselves as corporate
    citizens.


    The studies reviewed mainly focus on the ideational function of corporate social
    reports, i.e., “the ways in which [these] texts sign the world and its processes,
    entities and relations”(Fairclough 1992: 64). Specific research into their interpersonal
    functions, the ways in which social identities and the relationships between discourse
    participants are discursive negotiated through these texts (Fairclough 1992: 64),
    is relatively sparse. Indeed, aspects connected with the interpersonal functions
    of corporate social reports have been considered in some studies. In their comparative
    analysis of the reports published by The Body Shop International and by the Royal
    Dutch/Shell Group, Livesey and Kearsney (2002: 246) note that “the report’s language
    was replete with descriptions of personal feeling such as ‘caring’, ‘wanting’,
    ‘striving’, ‘determination,’ and ‘pride’, and that ‘metaphors of the heart were
    employed to describe the corporation’ ‘corporate persona.’ Buhr and Reiter (2006)
    discuss the combination and mingling of environmental philosophies in the corporate
    social reports released by the mining company'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# 212 Matteo Fuoli


    Noranda, in relation to its aim to “generate a green identity of the company and
    legitimate the company with various publics” (Buhr and Reiter 2006: 10). In her
    genre analysis of a corpus of corporate social reports, Skulstad (2008) describes
    the rhetorical strategies employed in these texts to serve the aim of creating
    and projecting a, ‘green’ image of a company and contrasting unfavourable ‘externally-constructed’
    images. Along similar lines, Malavasi (2011: 209) underlines the twofold nature
    of corporate social reports, which can be considered as both information-giving
    and PR documents that are used to “build trust, enhance reputation and create
    goodwill with stakeholders”.


    While these studies highlight the importance of the interpersonal functions of
    corporate social reports, which fail to engage in a systematic, comprehensive
    analysis of these functions at the ‘discourse as text’ level, namely, at the microlevel
    of language forms and meanings (Fairclough 1992: 74). Appraisal theory, which
    is employed here in a comparative analysis of the BP and IKEA 2009 corporate social
    reports, provides a comprehensive and powerful analytical tool for the systematic
    analysis of interpersonal discourse semantics. The next section describes the
    Appraisal framework in more detail.


    # 3. Appraisal theory


    Appraisal theory has been defined as “a particular approach to exploring, describing
    and explaining the way language is used to evaluate, to adopt stances and relationships”
    (White 2001: 1). Appraisal theory originated as an extension of the theoretical
    framework of systemic functional linguistics, dealing specifically with ‘interpersonal
    meanings’ (Halliday 1994).


    According to the theory, these meanings are organised into different ‘systems’,
    which correspond to the functions they perform in discourse (see Figure 1). Attitude
    involves the linguistic resources for the expression of emotional dispositions,
    ethical judgements and evaluations; *Engagement* comprises the reports by which
    language users negotiate the argueability of their propositions; *Graduation*
    groups the linguistic means that are used to modulate the intensity of assessments.
    Each subsystem is further divided into different subcategories. As Hood (2004:
    74) summarises, a principle of delicacy applies to the different subsystems of
    Appraisal as to any system network within systemic functional linguistics. The
    movement from left to right across the networks indicates the passage from general
    to more specific analysis.'
