    many patients who had a good-prognosis signature and a good outcome. [‘pronounce’]


    The ‘justify’ category is not discussed in Martin and White (2005), but it is
    part of the system of heteroglossic engagement proposed by White (2003). Justification
    is typically encoded through connectives and conjunctions such as therefore, because,
    and since, as in (11). In this example, because signals that the immediately prior
    (in this case, monoglossic) proposition needs to be substantiated, the putative
    reader may find the claim in some way contentious and in, at the same time, limits
    the scope of dialogic alternatives by providing a specific reason or argument
    as to why this particular issue is of importance.


