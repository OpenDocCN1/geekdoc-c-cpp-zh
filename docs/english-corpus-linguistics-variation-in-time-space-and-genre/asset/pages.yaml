  md: '# Discourse communities and their writing styles


    It was assumed that disciplines are discourse communities. I challenged the view
    that in the 17th century medicine and science (in the sense of natural science)
    form one discipline, whose members produce texts with very similar linguistic
    profiles. This view is thus inappropriate was demonstrated by the MD analysis
    of a 17th century medical and a science corpus.


    Robert Boyle was introduced as an expert member of the medical and science discourse
    community and two hypotheses were derived from this fact, namely that the writing
    styles of medical and his science texts differed in the same way as the writing
    styles of other 17th century medical experts and scientists and that he followed
    the discourse practices of his colleagues in the two discourse communities. These
    hypotheses were tested on a 17th century corpus containing a corpus of Boyle''s
    medical texts, a corpus of Boyle''s science texts, a corpus of medical texts by
    other authors, and a corpus of science texts by other authors. The linguistic
    profiles from the MD analysis of this corpus supported neither hypothesis. Boyle''s
    personal writing style, which proved very similar in his medical and science texts
    and deviated from that of other medical experts and scientists, was explained
    as the of his authorial identity (Hyland 2009).


    Boyle''s high reputation among the medical and science discourse community of
    the 18th century gave rise to the hypothesis that it extended beyond his achievements
    in both disciplines to his writing styles, which would be admired and imitated.
    This hypothesis was tested on a corpus of medical and a corpus of 17th century
    corpus in addition to the corresponding Boyle corpuspora. The diachronic analysis
    of the science corpus yielded linguistic profiles which supported the hypothesis
    on two dimensions. The science discourse community of the 18th century adopted
    Boyle''s more narrative and more abstract writing style. The diachronic analysis
    of the medical corpus furnished linguistic profiles which even more supported
    the hypothesis. The medical discourse community of the 18th century adopted Boyle''s
    more narrative, more explicit, less persuasive, and more abstract writing style.


    Two conclusions can be drawn from these results. Interesting insights into the
    linguistic structure of medical and science texts can be expected, when future
    research medicine and science are treated as separate disciplines already in the
    17th century, and when the research focus is shifted from Boyle''s texts to his
    medical texts.'
