  md: '# Functional variation in the English present perfect: a cross-varietal study


    Xinyue Yao and Peter Collins

    The University of New South Wales


    Abstract

    This paper examines the distribution and function of the present perfect construction
    in contemporary British, American, Australian and New Zealand English. The data
    are mainly drawn from the International Corpus of English, representing four major
    registers: conversation, news, academic and fictional writing. In overall frequency
    terms, BrE and AmE were found at opposite ends of the scale, with AuE sharing
    more similarities with AmE, and NZE with BrE. Regional variation was shown to
    be strongest in news, where the frequency of the present perfect is also the highest
    irrespective of the variety. A qualitative analysis of a set of random samples
    revealed semantic indeterminacy between the categories of continuative, resultative
    and experiential perfects, lending support to the view that they represent fuzzy
    functional categories comprising both prototypical and non-prototypical members
    of the three categories were shown to be strikingly similar across varieties subject
    to regional variation, with the highest number of experiential perfects found
    in academic writing, and resultatives in news reportage, a pattern attributable
    to the semantic types of verbs commonly found in these registers. The analysis
    also uncovered atypical uses of the present perfect with past time adjuncts and
    in narrative contexts where the preterite or historical present would normally
    be the expected form.


    # 1. Introduction


    Recent discussions of the English present perfect construction (henceforth PP)
    tend to fall into two broad approaches: formal semantics and variationist (sociolinguistics).
    Within the former, there has been intensive debate on the question of whether
    the PP is a monomous or polysemous construction. Consider the three types of readings
    distinguished in McCawley (1971):


    +   (1) I have known him for eighteen years. (continuative)


    +   (2) We''ve had this argument many times. (experiential)


    +   (3) The persons responsible have been fired. (resultative)'
