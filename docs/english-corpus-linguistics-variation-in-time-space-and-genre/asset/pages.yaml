  md: '# 24 Christian Mair


    seen as reduced versions of a corpus with a that-clause, but as independent innovations
    in spoken syntax which did not make it standard and formal written usage. As in
    the related case illustrated in example (1) above, the reason is lack of full
    and explicit grammatical marking of main-clause and subordinate-clause status,
    which leads to the construction being considered syntactically incomplete and
    hence by the editorial standards governing competent writing.


    Beyond exploring the immediate phenomenon under study, the paper has aimed to
    formulate a few recommendations to put the diachronic study of spoken language
    on a sounder footing.


    First and most importantly, the study of the history of real speech in time should
    be a priority in corpus-linguistic research. It has been possible to record human
    voices for almost 150 years. From the first quarter of the 20th century onwards
    archives contain treasures which are widely dispersed and often unknown but would
    clearly reward the attention of corpus-linguists and historical linguists. I have
    referred to the WW1 Phonograph Kommission recordings as a case in point. If this
    resource and similar ones are identified, salvaged and developed as corpora, pioneering
    ventures such as the Newcastle Electronic Corpus of Tyneside English (NECTE) or
    the Older New Zealand Project could be complemented by data of similar quality
    and research potential for many other standard and non-standard varieties. The
    period before sound recording, systematic studies should describe the different
    ways in which the several supposedly speech-based genres are explored by historians
    of spoken English are like speech and in which they are not.


    For the early history of the construction studied here, literary representations
    of speech seemed closer to spoken language than the court records collected in
    the Old Bailey corpus. As regards the recent past, finite clause elements in clefts
    were not the features of spoken syntax to be dropped from transcriptions produced
    by non-linguists. Other features, on the other hand, may pattern differently,
    and no premature generalisations be drawn. Systematic investigations of other
    spoken constructions are required for comparison, and for a full assessment of
    the value that a particular type of “speech by proxy” for the reconstruction of
    the pre-history of spoken English.


    In all, the study of the history of spoken English remains a difficult and challenging
    enterprise, caught up in a paradox which we could pointedly formulate thus. For
    the recent past, the era of sound recording, we can hear the sounds, but we still
    have to “read” the voices through reconnecting the recordings to their sociolinguistic
    and cultural context. For the time before recording technology, we have to read
    the voices of the past literally, from the written sources, and therefore worry
    about precisely what it is that we “hear” without the sound.'
