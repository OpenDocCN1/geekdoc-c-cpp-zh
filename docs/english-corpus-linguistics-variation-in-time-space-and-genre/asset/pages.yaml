  md: '# How specific is English for Academic Purposes? A look at verbs

    in business, linguistics and medical research articles


    Natassia Schutz


    Centre for English Corpus Linguistics, Université catholique de Louvain


    # Abstract


    English for Academic Purposes vocabulary teaching has been the subject of much\debate.
    While some authors define the idea of general academic vocabulary,

    others highlight the specificity inherent in each discipline. This article takes
    the

    debate one step further by analyzing the distribution of all the academic verbs

    found in the three-million-word Louvain Corpus of Research Articles (LOCRA). aim
    is to distinguish the verbs which are shared across the three disciplines

    in the corpus (business, linguistics and medicine) from those which are specific
    to

    a particular discipline. Two vocabulary extraction methods are explored to

    extract the academic verbs, i.e. the keyness analysis (Scott 1997) and the analysis

    of relative frequencies. The results show that the combination of these two

    methods proves fruitful, as the analysis of relative frequencies brings out

    that were overlooked by the keyness method. The distributional analysis of the

    academic verbs shows that general academic verbs represent, in each discipline,

    much larger proportion than discipline-specific verbs, as they account for c.

    50% of the total number of academic verb types and over 54% of the total

    number of verb tokens. A qualitative examination of the general academic verbs

    identified in LOCRA shows how these verbs need to be presented in context

    to better describe their general academic uses and, in consequence, be more

    useful to learners.


    # 1. Introduction


    English for Academic Purposes (EAP) emerged, alongside English for

    Occupational Purposes (ESP), from the broader field of English for Specific

    Purposes (ESP). EAP refers to “the language research and instruction that focuses

    on the specific communicative needs and practices of particular groups in

    academic contexts” (Hyland and Hamp-Lions 2002: 2). As English has become

    “the leading language for the dissemination of academic knowledge”, EAP

    rapidly developed to become a major branch of ESP and, consequently, a highlyntopical
    research object (ibid: 1).


    Among the numerous studies that have been carried out on EAP, particular

    attention has been given to its common-core and discipline-specific features.
    This

    dinction is referred to as ‘English for General Academic Purposes’ (EGAP) and

    ‘English for Specific Academic Purposes’ (ESAP) (Blue 1988) (see Figure 1).'
