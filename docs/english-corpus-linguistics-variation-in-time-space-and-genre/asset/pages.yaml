  md: 'The events described in this text belong to three different time spheres: the
    speech time, a specific past time (a staff social), and the time before past time.
    Nevertheless they are subsumed under a common temporal viewpoint: a metaphorical
    ''now''. The distinction between the preterite, the past perfect and the PP is
    neutralized, with the PP used as the only verb form when a temporal contrast is
    made.


    # 4. Summary


    The study reported here, based on a set of tagged native English corpora, uncovered
    a significant degree of regional and register variation in the use of the PP.
    In overall frequency terms, BrE and AmE were found to lie at opposite ends of
    the scale, with AusE showing more similarities with AmE, and NZE with BrE. Regional
    variation was shown to be strongest in news reportage, a register with high PP
    frequency irrespective of the variety considered. It is also in this register
    that the frequency of the PP in AusE exhibits an unexpected resemblance to that
    in AmE.


    The qualitative analysis, employing a basic distinction between continuative,
    resultative and experiential PPs, revealing a striking similarity across the four
    varieties, with prototypical PPs being the most, followed by resultatives, and
    continuatives. What this may suggest that the essential functional properties
    of the PP are constant across English varieties, and the distributional difference
    is likely to be caused by speakers'' choice of verb forms in contexts where two
    or more options are possible (a likelihood that would warrant further investigation).
    On the other hand, the frequency of the three categories of PPs is subject to
    significant register variation. Experimental effects are most frequent in academic
    writing, and resultatives in news reportage, a finding which can be attributed
    to differences in the semantic types of the lexical verbs that typically occur
    in these registers.


    Our analysis also shows that the diagnostics commonly invoked in the literature
    for identifying the three categories of PP need further elaboration. Well-known
    factors as co-occurrence with temporal adjuncts and tense of the situation are
    merely parts of a complex set of contextual elements (both linguistic and extralingistic)
    that may influence the interpretation of the PP. Furthermore, we have noted a
    number of indeterminate cases where more than one reading is due to the vagueness
    of the temporal properties of the situation or the speaker''s focus, which is
    in turn complicated by a lack of conceptual rigor, showing that the borderline
    between the PP categories is not invariably clear-cut. Viewed in this light, the
    continuative, resultative and experiential categories should be seen not as manifestations
    of distinct semantic structures but as fuzzy conceptual categories comprising
    both prototypical and non-prototypical members.


    Finally, we have found occasional uses of the PP, most commonly with past time
    adjuncts, and in narrative contexts. Interestingly, we have identified instances
    of the PP in regional varieties other than AusE that resemble'
