    The choice of choosing between two very different companies is motivated by the
    aim to expose the relationship that exists between the particular environment
    in which a company operates and the discursive strategies deployed in the construction
    of a corporate identity Yet, while we can reasonably expect, in light of the differences
    outlined above, that BP''s and IKEA''s discursive strategies will be different,
    it is difficult to predict a priori exactly in which ways they will differ. The
    main aim of the analysis approach of this paper is, in sense, exploratory. to
    describe and understand the role of Appraisal in the context-specific discursive
    interaction between companies and the public, mediated via their social reports.


    The analysis presented in this paper is primarily quantitative and is limited
    to the Appraisal systems of Attitude and Engagement. Two distinct methods were
    employed for the analysis of these categories. The analysis of Attitude is based
    on the computer-aided manual annotation of the corpus. The annotation was performed
    on the row, segmented (‘tokenised’) texts imported into a spreadsheet document.
    The texts were automatically annotated with part-of-speech labels to facilitate
    the processing and analysis of results. Instances that were judged to explicitly
    and unproblematically carry a positive or negative Appraisal value marked and
    classified according to the guidelines and examples provided in Martin (2000)
    and Martin and White (2005) and based on coding lists in other studies that apply
    the Appraisal framework. When the coding was complete, annotated items were automatically
    retrieved through filters for the creation of frequency lists and statistical
    analysis.


