    Biber''s 1988 factor analysis yielded five factors which could be interpreted
    as dimensions of variation. He used the following labels:


    +   Dimension 1: Involved vs. Informational Production

    Dimension 2: Narrative vs. Non-Narrative Concerns

    Dimension 3: Explicit, vs. Situation-Dependent Reference

    Dimension 4: Overt Expression of Persuasion

    Dimension 5: Abstract vs. Non-Abstract Information.


    Taking over this descriptive framework in a diachronic study implies that the
    cooccurrence patterns of earlier texts allow the same interpretation. This assumption,
    which was made in the diachronic studies by Atkinson (1992, 1999), Biber and Finegan
    (1997) and González-Álvarez and Pérez-Guerra (1998), was at least partly supported
    by an MD analysis of 18th century texts (Biber 2001), which is based on a new
    factor analysis and in which cooccurrence patterns reflect the same production
    circumstances and communicative purposes as the first two cooccurrence patterns
    of the 1988 factor analysis of 20th century texts. This result justifies the practice
    adopted in these diachronic studies; I will follow their example in this paper.


    As in multivariate statistical methods, the cooccurrence patterns and consequently
    the dimensions of variation in MD analysis contain a variable number of linguistic
    features. Dimension 1 is always the dimension with the biggest number of features.
    The linguistic features which were counted for this study:


    +   - on dimension 1: present tense verb, first person pronoun, second person
    pronoun, be as a main verb, possibility modal (can, could, may, might);

    - on dimension 2: past tense verb, perfect verb, third person pronoun;

    - on dimension 3: attributive relative clause with relative marker in subject
    position, attributive relative clause with relative marker in object position,
    other attributive relative clause;

    - on dimension 4: finite conditional clause, necessity modal (should, ought),
    prediction modal (will, shall, would);

    - on dimension 5: passive, past participle construction as nominal postmodifier,
    finite adverbial clause other than conditional.


