    Table 6 and Figure 3 show that all the Asian varieties have lower percentages
    of the have + past participle construction than the BrE reference corpus, in both
    the spoken and written modes. With the exception of Indian English, all the Asian
    varieties have in common that the spoken mode shows a significantly higher proportion
    of alternative ways to express meaning than the written mode (p < 0.5 in HKE,
    SinE and PhilE) in combination with just, (n)ever and yet. In IndE, however, the
    difference between the spoken and the written modes did not render statistically
    significant results. The influence of mode, therefore, is confirmed for all the
    varieties examined apart from IndE.


    A transnational approach to the corpus reveals further differences between the
    geographical varieties. On the one hand, spoken HKE and SinE are the varieties
    using alternative forms most frequently, since nearly 20% of total cases are from
    categories other than the canonical present perfect and the synthetic preterite.
    On the other hand, PhilE uses alternative forms only in 1.4% of the times in spoken
    language, less frequent than in BrE, and it scores 0% in the written mode (like
    SinE). What characterizes PhilE is the overriding of the preterite form to express
    perfect meaning in spoken language in particular, a result that was expected since
    the input variety in PhilE is American English, where the preterite is especially
    frequent for the expression of this meaning (Miller 2000: 337; Hundt and Smith
    2009). As for IndE, it shows similar values to BrE, especially in the spoken mode.'
