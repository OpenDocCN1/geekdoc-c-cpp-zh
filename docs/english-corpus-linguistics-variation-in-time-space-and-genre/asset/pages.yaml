    # 5. Cultural terms predominant in AmE vs. BrE in 1961


    Leech and Fallon (1992) devote much of their attention to lexical items they find
    to differ significantly between Brown and LOB and which can be seen as indicators
    of cultural differences between the US and Britain. Here a few such terms will
    be pursued through the various corpora at the focus of attention in this article.
    The investigation will be based on the following terms:**⁴


    Terms more frequent in Brown, i.e. AmE 1961 (to be referred to as AMCULT61)


    +   - Politics and warfare: army, armed, communist, communism, enemy, war, warfare


    +   - Business and economic life: budget, business, corporation, input, management,
    marketing


    +   - Cultural activity: concert, drama¹⁵ orchestra


    +   - Other: coffee, sex, sexual, sexually, sexuality'
