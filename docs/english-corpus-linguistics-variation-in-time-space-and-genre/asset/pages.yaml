    Figure 7 reveals that by 1991/2 the gap between AmE and BrE had narrowed considerably,
    and from both sides: The ratio is distinctly higher than the Brown one, and the
    figure for FLOB lower than for LOB; the ratio remains higher on the American side,
    though. As far as the terms based on the two corpora from 1961 are concerned,
    this can be taken as a highly noteworthy indication of cultural convergence.


    Of course, the cultural indicators from 1961 may later have been replaced by other
    terms distinguishing between the US and Britain, but that is a question which
    will not be pursued in this article. Keeping our focus on the indicators from
    the 1961 material, we can conclude that towards the end of the 20th century the
    cultural difference remained between the US and Britain, but that difference became
    smaller.


    Indeed, underlying figures for individual terms reveal that in some cases the
    gap had not only narrowed, the distribution had even been reversed, i.e. some
    of the terms making AMCULT61 had then become more frequent in the BrE material
    (FLOB), and vice.


    The terms from BRCULT61 which had become more frequent in AmE in 1991/2 are: dividend,
    income, author, book.


    The terms from AMCULT61 which had become more frequent in BrE in 1991/2 are: army,
    warfare, input, marketing, concert, drama.


    By the early 1990s it is British speakers (or writers) who seem to be more concerned
    with armies and warfare, and indeed with some central notions to do with business
    and commerce. The frequencies of some terms denoting cultural activities have
    also been reversed.'
