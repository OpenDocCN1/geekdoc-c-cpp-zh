  md: '# Discourse communities and their writing styles


    Table 3: Structure and size of the 18th century control corpus

    | Medicine | Text | Cheshire | Tennent | Andree | Coe | Alexander | Size | total
    |

    |---|---|---|---|---|---|---|---||

    | Science | Size | 6,089 | 6,233 | 6,061 | 6,136 | 5,821 | | 30,340 |

    | | Text | Cotes | Baker | Hales | Shaw | Emerson | | 31,591 |

    | | Size | 6,134 | 6,205 | 6,410 | 6,115 | 6,727 | | 61,931 |


    The research method employed in this paper follows the principles of multidimensional
    analysis (MD analysis) established by Biber (1998) for 20th century English. It
    assumes that


    +   - texts are characterized not by one, but by a combination of several communicative
    functions;

    - these functions can be described as dimensions of variation;

    - the dimensions of variation can be derived from the cooccurrence patterns of
    linguistic features;

    - the cooccurrence patterns can be identified by a statistical factor analysis.


    The input for the factor analysis is the frequencies of those linguistic features
    which are assume to influence the linguistic and the functional profiles of the
    texts under consideration. The absolute frequencies are normalized to avoid skewing
    of the results by different text sizes, then they are standardized to avoid those
    features which stand a bigger chance than those of occurring frequently carry
    more weight than those with a smaller chance. Finally, the standardized frequencies
    of the linguistic features of each dimension of variation are summed up. These
    sums yield the text dimension scores. If several texts are considered together,
    their mean text dimension scores (mtds) are calculated by summing up their text
    dimension scores and dividing this by the number of texts.$4$ This method provides
    a quantitative measure for the comparison of texts or groups of texts on each
    dimension of variation.


    In the original of MD analysis, 67 linguistic features were identified. MD analysis
    of historical texts had to take into account that some linguistic features are
