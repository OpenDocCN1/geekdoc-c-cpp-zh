    # 5. Conclusion


    This article started off with the debate mainly centered on whether EAP vocabulary
    teaching should be general or specific to learners’ discipline. The study has
    attempted to contribute to this debate by shedding some light on the weight that
    general academic vocabulary represents compared to discipline-specific vocabulary.


    The results showed that the potential EGAP verbs identified in LOCRA represent
    a considerably large proportion in each sub-corpus in LOCRA, both in terms of
    proportion (out of the total number of academic verb types) and coverage. In each
    sub-corpus, the potential EGAP verbs account for about 50% of the total number
    of academic verb types and more than 54% of the total number of verb tokens. These
    findings therefore seem to support the idea of a general approach to academic
    vocabulary teaching as the EGAP verbs identified in this study represent a considerable
    proportion in each discipline.


    This, however, does not imply that ESAP verbs are unimportant. The results showed
    much less than EGAP verbs in terms of coverage (between 6% and 11%), they still
    represent an appreciable proportion of academic verb types used in each discipline
    (between 20% and 33%). Therefore, it should be up to EAP tutors to decide, according
    the type of learners they are faced with, whether these ESAP verbs are worth highlighted
    or whether they should be to the subject course.


    A qualitative analysis of the EGAP verbs identified in this study showed the downside
    of only taking verbs into account are not inherently academic but rather used
    in academic constructions or phrases (e.g. to carry out a study, to find a correlation,
    to gain insights, to receive funding or take into account). In addition, lists
    of single verbs are not very useful for EAP learners in context that causes problems
    (Granger and Paquet 2009b). It therefore seems essential to present these verbs
    with their collocational and lexico-grammatical preferences across disciplines.


    Although this study was only based on three different academic disciplines, medicine,
    in LOCRA. For instance, when compared to business and linguistics, appears to
    stand out as it is the discipline that uses EGAP and ESAP verbs the most. It shares
    very few academic verbs with the two other disciplines. Linguistics and business,
    on the other hand, show similar trends in the distribution of academic verbs and
    share a great number of academic verbs in addition to the EGAP verbs identified
    in this study. This suggests that disciplines show similar uses of academic vocabulary
    and could, therefore, be grouped together for teaching purposes. Further analyses
    based on a wide variety'
