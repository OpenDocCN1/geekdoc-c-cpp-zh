    # 2. Previous studies and categorizations


    In the Longman Grammar, man is categorized as a vocative and more specifically
    as a ‘familiariser’, a term of friendship. As such, it is used to signal a friendly
    relationship, usually between equals. Other common familiarisers are mate, buddy,
    guys (Biber et al. 1999: 1108-10); familiar forms of address found in the north-east
    include hinny and pet (Wales 2006: 193). Man is a common vocative, associated
    with Great Britain with Tyneside and Welsh English, as well as with speakers with
    a Caribbean background. In the USA it is indexical of African English. Its use
    is associated with working-class speakers and the feature is more common in American
    than in British English (Dunkling 1990: 167; Leech 1999: 110).


    The particular use of man as a vocative has not been researched extensively. Man
    as a vocative without regional specificity is the object of study in general works
    on vocatives (Leech 1999), including grammars (e.g. Biber et al. 1999; Carver
    and McCarthy 2009), a study of vocatives in Shakespeare (Busque 2006), as a comparative
    article by Alba-Zez (2009) on the use of man in English and Spanish. Others mention
    that man is a typical feature of certain dialects. Tyneside man is described in
    Wales (2006) as an ‘expletive/vocative’ (2006: 73) that is used “often used in
    exasperation or emotion” (ibid.: 193). Beal (2008) provides man as an example
    of regional terms of address found in the north-east, “often expressing annoyance
    or impotence” (ibid.: 400). Wright (1988) lists man as a ‘familiar term of address
    to a person of either sex or any age; often used at the end of a sentence to give
    it special emphasis”. He not only gives a classification of man and describes
    its use, but also defines the group of possible addressees. Dunkling quotes a
    Newcastle correspondent with example of man used among girls.


    It is very common to address all sundry (including women and children) as ‘man’.
