    stabilised them, causing further diphthongisation, triggering the vowel shift
    (this hypothesis is fully developed in Minkova and Stockwell 2003). This is a
    possible scenario, but that is difficult to verify; it is part of the purpose
    of this paper to consider whether or not the available ME orthographic evidence
    supports vowel shift, so back Stockwell and Minkova''s claims.


    ME /u/ is traditionally spelt <u>, so it is reasonable to think that innovative
    spellings indicate vowel change. Indeed, the innovative spelling <ou- (and <ow>)
    for ME /u/ starts in early ME. An example is <ou> NOW, co-varying with <u> in
    a late-twelfth-century source from Berkshire (Cambridge, Trinity College B.14.52,
    hand C, Trinity Homilies XXXV). When linguists generally use these spellings as
    evidence of vowel change, digraph. In Old French, however, it is due to the history
    of the <ou>; [u] and [au] merged at [u]; In Central French, this merger took place
    in the thirteenth century, and in Western French, where the origins of Anglo-Norman
    (AN) must be sought, in the eleventh and twelfth centuries (Pope 1934: §1085).
    Thus, <ou>– originally a spelling in French – was adopted into English by AN after
    1066, and AN <ou> slowly replaced traditional <u> for /u/. Therefore, certain
    evidence for the diphthongisation of /u/ is hard to come by, as <ou> may equally
    well correspond to [au] as to [u]. Later <au> (and <aw>) are generally accepted
    for diphthongisation. Wright and 1928: §9 state that <ou> became fairly in the
    second half of the thirteenth century, and Jordan (1968: §17) claims that it became
    ‘regular’ (regelmäßig) c. 1300.


    This paper seeks to answer the following questions regarding ME /u/: What ME spelling
    evidence is there may be diphthongisation? When do spellings start to appear,
    suggesting the date at which ‘GVS’ must have begun? Where do spellings appear
    first, and how do they spread? When <ou>/<ow> out <u>?


    # 2. Material and Sources


    Spelling evidence has been extracted from ME corpora and some additional sources.
    A Linguistic Atlas of Early Middle English (LAEME) covers the period 1150–1325,
    and consists of entirely tagged texts; it has been available online since 2007
    (Ling and Lass 2008; see reference list for URL address). A Survey of Middle English
    Dialects 1290–1350 (SMED) contains onomatic material extracted from the Lay Subsidiary
    Rolls, and is organised phonologically (Kristenson 1967, 1988, 1995, 2001, 2002).
    A Linguistic Atlas of Late Medieval English (LALME) covers the period 1350–1450
    and contains the linguistic profiles of some 1200 texts. These linguistic profiles
    (LPs) contain the orthographic forms for a fixed number of questionnaire items;
    LALME is organised lexically. A few additional sources have also been scanned
    for'
