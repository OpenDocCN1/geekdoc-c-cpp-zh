    # 4. Zooming in the potential EGAP verbs used in LOCRA


    A closer examination of the EGAP verb list identified in this study shows that
    a number of verbs relate to the core business of research, irrespective of the
    academic discipline, such as reporting information (e.g explain, find, observe,
    show), conducting analyses (e.g. analyze, calculate, hypothesize, investigate,
    measure, test), describing or manipulating data (e.g. collect, compare, explore,
    interpret, select) and describing results (e.characterize, demonstrate, indicate,
    occur, support, vary).


    Advocates of a discipline-specific approach to EAP might argue that, although
    these verbs are common to different academic disciplines, they will nevertheless
    show cross-disciplinary preferences and, consequently, semantic variation (Hyland
    and Tse 2007). If we look at how some of these EGAP verbs are used in context
    in LOCRA, it appears that some verbs, show phraseological reality and semantic
    nuances across disciplines. Nevertheless, in order to reconcile research findings
    and the reality of EAP teaching”, as pointed out by Granger and Paquet (2009a:
    101), it is essential to present learners with more general definitions as it
    is the only way that EAP tutors will be “to help L2 learners deal with the various
    uses of a verb that they come across” (ibid). That is why the *verb measure*,
    for example, should be described as referring to the “*action of determining the
    size, amount, level, etc. of something*” despite the fact that disciplines use
    different methods, data and criteria, as illustrated in examples 7 to 9.


    +   (7) LOCRA BUS previous research has adopted different indicators to measure
    firm performance as it relates to technology strategy.


    +   (8) LOCRA LING Session 4 assessed the retention of vocabulary by the same
    two instruments as were used to measure vocabulary gain in Session 3.'
