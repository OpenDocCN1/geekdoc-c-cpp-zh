  md: 'As its title suggests, this book is a selection of papers that use English
    corpora to study language variation along three dimensions – time, place and genre.
    In broad terms, the book aims to bridge the gap between corpus linguistics and
    sociolinguistics and to increase our knowledge of the characteristics of English
    language. It includes eleven papers which address a variety of research questions
    but with the commonality of a corpus-based methodology. Some of the contributions
    deal with language variation in time, either by looking into historical corpora
    of English or by adopting the method known as diachronic comparable corpus linguistics,
    thus illustrating how corpora can be used to illuminate either historical or recent
    developments of English. Other studies investigate variation in space by comparing
    different varieties of English, including some of the ''New Englishes'' such as
    the South Asian varieties of English. Finally, some of the papers deal with variation
    in genre, by looking into the use of language for specific purposes through the
    inspection of medical articles, social reports and academic writing.


    # Language

    &

    Computers


    ISBN 978-90-420-3679-6

