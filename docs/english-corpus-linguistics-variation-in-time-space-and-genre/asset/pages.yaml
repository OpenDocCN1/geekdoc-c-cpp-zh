    The first general-purpose corpus designed for the study of ongoing change in contemporary
    spoken English is DCPSE, the Diachronic Corpus of Present-Day English, which covers
    the period between the late 1950s and the early 1990s. As a small (c. 900,000
    words) corpus which reduces speech to orthographic transcription, it is particularly
    suitable for the study of morphosyntactic features of high frequency, such as
    the following type of variability:


    +   (3a) What I did to call the police. [to-infinitive]

    (3b) What I did was call the police. [unmarked infinitive]

    (3c) What I did I was called the police. [finite cleft]


    This is a specific sub-type of the wh-cleft (or "pseudo-cleft") construction,
    which Quirk et al. define as "essentially an SVC sentence with a nominal relative
    clause as subject or complement" (1985: 1387). In our example, the nominal relative
    or "cleft" clause (*what I did*) contains a form of the pro-verb da rather than
    other verb, and in (3a) and (3b) the clefted constituent is realised as a marked
    or unmarked infinitive clause. While recognised as in the two major reference
    grammars of present-day English (Quirk et al. 1985: 1387-1389, Huddleston and
    Pullum 2002: 1420-1423) and in Biber et al. (1999: 959-960). What reference grammars
    do not state that they are also subject to ongoing diachronic change, with 20th
    century showing a clear trend from the older (3a) to the historically recent variant
    (3b). This trend shows up very clearly in "real-time" analyses of the Brown family
    of corpus and the DCPSE (Mair 2012). A synchronous cross-variety comparison of
    ten sub-corpora of the International Corpus of English (MICE*) shows that many
    New Englishes represented in this corpus collection, all natively spoken varieties,
    are affected by this development.


    Note that in the analyses which follow, the category of pseudo-clefts is defined
    somewhat loosely than in the reference grammars and includes not only what-clefts,
    but also potentially qualifying quantifiers or ordinal numbers and adjectives
    as all, the only/first/next/last thing:


