    # 2.5 Text type variation


    The final variable to be examined here is the influence of text type on the choice
    of forms to express perfect meaning in constructions containing the adverbs, (n)ever
    and yet. Table 1 showed that mode, spoken vs written, is a powerful factor conditioning
    the variant selected. Figures 4 and 5 below set out differences between the various
    types of spoken and written discourses (see Tables II and III in the appendix
    for the numerical data).


    ![](img/6910650ad69df72c967df4c631af744d_181_0.png)


    Figure 4. Distribution of forms per text type in Asian Englishes


    The different text types were conflated into the general categories included in
    the corpus (see Table I in the appendix): ''scripted'' and ''unscripted'' within
    the spoken mode (the unscripted category including both private and public dialogue),
    and ''printed'' and ''non-printed'' within the written mode. The graph for Asian
    Englishes clearly shows a continuum from more to less conformity to what is established
    in grammars of English as regards the expression of perfect meaning. Perhaps surprisingly,
    it is the two types of spoken discourse that constitute the extremes in the continuum
    from most to distant with respect to the traditional form(s). ''Scripted spoken
    discourse'' (i.e. broadcast news and (non)broadcast talks) shows the highest percentage
    of present perfect forms and the lowest proportion of ''other'' forms. At the
    other end, ''unscripted spoken discourse'' (i.e. public and private dialogue,
    spontaneous commentaries, unscripted speeches, demonstrations and legal presentations),
    as might be expected, contain the lowest percentage of present perfect and the
    highest proportion of preterite and ''other'' forms. Between these extremes, we
    find written discourse, represented by ''printed writing'', a very heterogeneous
    category which contains academic writing as well as popular writing, and ''non-printed
    writing'' (i.e. student writings and letters). The former scores closer to scripted
    than the latter, as shown by the scarcity of ''other'' forms.'
