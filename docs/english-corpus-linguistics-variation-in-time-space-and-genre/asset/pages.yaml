    The forecast by the GCE is used as a persuasive argument in favour of the exploitation
    of Canada’s bituminous sands, as his comment reveals:


    (38) We believe there is enough supply to meet that demand affordably, through
    conventional and unconventional resources such as oil sands.


    Fairclough (2003) underlines the connection between prediction and social power,
