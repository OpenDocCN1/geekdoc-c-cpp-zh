  md: 'Although the changing fortunes of the few terms listed above not warrant any
    firm conclusions, our findings may perhaps be seen in the light of the fact that
    in 1991/2 Britain had just emerged from more than ten years of Thatcherism, strongly
    associated with market economies and hard-line military policies, while the US
    may have mellowed under presidents like James Carter, although it is difficult
    to tell what is the cause and what is the effect in these cases.


    On the Antipan side we notice that the ratios for both ACE and most place themselves
    between the American and British figures, the AusE result is a bit higher than
    for NZE, and higher also than for FLOB. The intermediate positions of ACE and
    WW fit well with the chronological perspective, as both corpora are made up of
    texts from 1986. The same time it may be noteworthy that the Australian result
    is somewhat closer to the British level, the New Zealand result however to the
    American level.


    If we turn to the right-hand side of Figure 7, we notice that there is now a consistent
    difference between the written and the spoken sections which the ICE corpora are
    divided into: The BRUTC61/AMCULT61 ratio is consistently higher for spoken language.
    In other words, the typically AmE texts from 1961 are consistently more frequent
    in the written sections of these corpora, compared with the spoken sections, where
    the typically BrE terms are more common. To some extent, AMCULT61 and BRUTC61
    can be said to represent ''hard'' vs. ''soft'' values, respectively. It is perhaps
    not surprising to find that such values predominate more in spoken language, compared
    with the harder values typical of many types of written language.


    No clear differences are detectable between the three national varieties represented
    by ICE, except that the speed between speech and writing is greatest in NZE and
    smallest in BrE, AusE taking an intermediate position in this respect.


    The really remarkable result from Figure 7 is that for the Santa Barbara Corpus,
    with BRUTC61/AMCULT61 ratio more than twice as high as any other. The underlying
    figures reveal that the relative frequency of BRUTC61 is about the same as the
    other corpora, whereas the frequency of AMCULT61 is much lower. We have seen the
    seemingly paradoxical situation that one of the American corpora displayed in
    Figure 7 shows a relative occurrence of AMCULT61 which is well half of any of
    the other corpora represented. To understand this, we need to bear in mind that
    the Santa Barbara Corpus consists only of spoken language, while AMCULT61 based
    based on written language, and we have seen that the recorded ratios are distinctly
    higher for speech.


    Even so, the particularly low AMCULT61 frequency recorded for the Santa Barbara
    Corpus remains remarkable. We have seen as evidence that the texts making up this
    corpus represent a variant of American culture where the ''hard'' economic and
    military values which can be associated with AMCULT61 are much less than in the
    other American material we have considered. We shall compare spoken and various
    types of written AmE further when we come to study results for COCA below.'
