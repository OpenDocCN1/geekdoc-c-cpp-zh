  md: '# New developments in corpus linguistics


    study shows that in distributional terms, AmE and BrE are furthest apart, that
    AusE is closer to AmE while NZE is closer to BrE. The difference can be seen to
    reflect a higher tolerance for informality in the AmE and AusE varieties than
    BrE and NZE, as seen through the relative higher frequency of the alternative
    preferential forms. Moreover, they show that the distribution of the various functional
    categories is clearly sensitive to genre, as experimental perfects are typically
    found in academic writing, while resultatives are common in news reportage.


    The starting point of Johan Elness'' article is the impression reported by Leech
    and Fallon (1992) that is a marked cultural difference between the US and British
    that emerges from their examination of lexical frequencies in the Brown and LOB
    corpus. Using a range of more recent corpora as a basis for a similar comparison,
    Elness tests the validity of the claim that the US is a more modern, militaristic
    and dynamic society, against which British is more concerned with ‘feminine’ values
    of family and emotional life. He inspects various features in British and American
    corpora, in particular the use of masculine versus feminine pronouns, the frequency
    of lexical verbs and the frequency of a set of “general cultural terms” found
    to be overrepresented in AmE or BrE in the corpora from 1961. The comparison with
    the 1961 data shows, although there is a continuing majority of the masculine
    pronouns, the balance becomes more even in recent corpora, a development which
    has progressed further in impromptu conversation. As regards the variety-based
    cultural terms, a clear tendency towards convergence is detected in the study,
    with differences gradually becoming smaller. Where possible, Elness also brings
    Australian and New Zealand English into the comparison. The two Antipodean varieties
    systematically place them somewhere between AmE and BrE, and they seem to be at
    the forefront in the development towards greater gender equality in the varieties
    of English.


    Kathrin Luckmann de Lopez article examines the use of the vocative man in Tyneside
    English. classifying man is problematic, because this element is restricted syntactically
    to final position, unlike vocatives which are normally in an utterance-early position,
    and man has a range of different functions, not all of which are normally associated
    with associates. She then goes on to consider the various functions of man, as
    the prototypical vocative function of summoning attention, the textual and interactional
    functions of man, and finds that man can indeed have all of these functions, but
    that the prototypical function is the least frequent, and the interpersonal functions,
    such as expressing solidarity, impoliteness, mock-impoliteness and softening,
    are the most frequent in her data. She also considers prosody, and shows that
    the use of man to a large extent coincides with the tone contours and the rise-fall.
    The pervasiveness of man in Tyneside English, along with its typically interpersonal
    functions and occurrence in localised prosodic tones, allows her to'
