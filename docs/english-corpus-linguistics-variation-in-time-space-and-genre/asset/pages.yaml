    The results set out in Figure 8 confirm the impression of a cultural convergence
    towards the end of the 20th century, here seen to continue into the first decade
    of the 21st century: In this American journal corpus the frequency of the typically
    American terms from 1961 goes down, that the typically British terms from the
    same year goes up in the last few decades.


    We shall allow ourselves a closer look at the TIME frequencies of three of the
    terms making AMUCT61 and BRU61.


    Figure 9 gives the recorded recorded for SEX (i.e., sex, sexes, sexual, sexuality),
    COMMUNISM (i.e., communism, communist, communists) – both from AMUCT61 and SOCIALISM
    (socialism, socialist, socialists) from BRUCT61.


    Of these three SEX – perhaps not surprisingly – comes across as by the most successful
    one, in the sense that it occurs from a very modest level in the 1920s, vastly
    outnumbered by both the other terms, to end up as the clear winner in the 2000s,
    several times as fast as the other terms. The recorded result is a convincing
    illustration and reminder of the steadily growing prominence of the topic of sex
    in the public domain, as in Western, not least American, culture, since the middle
    of the 20th century – which happens to be the time when the two Kinsey reports
    appeared.¹⁸ It may – or not – a coincidence that the figures recorded for SEX
    go down somewhat in decades dominated by conservative Republican administrations
