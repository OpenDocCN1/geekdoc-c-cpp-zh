  md: '# The diphthongisation of ME : the spelling evidence


    Gjertrud F. Stenbrenden


    University of Oslo


    # Abstract


    This article investigates the Middle English (ME) spelling evidence for the development
    of early Middle English /u/, which diphthongised in the so-called ‘Great Vowel
    Shift’. After 1066, the Anglo-Norman spellings <ou> and <ow> were gradually adopted
    instead of <u>, and as these digraph equally well correspond to diphthongised
    reflexes as monophthong vowels, certain evidence for diphthongisation is hard
    to come by, especially for the early stages. Fifteenth-century and later <au>
    and <aw> spellings are clear indications of advanced diphthongisation. This article
    makes use of the spellings contained in LAMME and LAEME, two linguistic atlases
    of localised Middle English material, examining the the vowel shift was much earlier
    than been assumed. When aberrant spellings are examined in the light of the entire
    orthographic systems in which they appear, it becomes clear which spellings may
    be used to support the early vowel shift hypothesis, and which must be discarded.


    # 1. Introduction


    The ‘ME ũ’ comprises the reflexes of Old English (OE) <u> and of OE uñ+g, but
    also of OE õ+g in some cases. Examples are OE hūs; ‘fugal’ ‘bird, fowl’; OE bāgan
    ‘to bow, bend’; plög ‘plough’, bōg ‘bough’. The diphthongisation of early ME /u/
    to [ou] > [au] is part of the ‘Great Vowel Shift’ (GVS), where the close vowels
    were diphthongised and the <u>, a centralised first element is now accepted as
    the most likely path, based on logic as well as the evidence from similar present-day
    changes to (Dobson 1968). Logic dictates that the diphthongised reflex of /u/
    did not merge with pre-existing /ou/, the first element cannot have followed a
    back path. When PDE /u/ diphthongises (in e.g. boot, moon), for instance in Cockney,
    Australian English, or American English, the first is clearly centralised (Sivertson
    1960; Mitchell and Delbridge 2001: 34).


    The ‘GVS’ is traditionally dated c. 1400–1750, although some scholars have postulated
    an earlier date for the incipient stages, notably Stockwell (1972, 1978, 1985)
    and Stockwell and Minkova (1988a, 1988b). Stockwell and Minkova link the diphthongisation
    of ȣ and ũ to the vocalisation of postvocal g after the close vowels in late OE,
    claiming that this vocalisation resulted in minimal diphthongs [ii] and [ou],
    rather than long monophthongs. The fact that the'
