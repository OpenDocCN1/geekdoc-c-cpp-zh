    written discourse, which leads us to conclude that they are not performance errors,
    but have already become productive forms and seem to become integrated into the
    paradigm of the expression of the perfect in these varieties (cf. Table 1). This
    is especially true for the base form, both on its own and in combination with
    the auxiliary (have + base form). The base form represents a strategy of phonological
    and morphological simplification, typical of language contact situations, which
    could also point to a grammatical change in progress in these varieties in particular
    (Miller 2006; Schneider 2007). Other factors have also been adduced to explain
    the success of the base form, the first of these being the influence of phonological
    nature: a study of the verbs which tend to appear in the base form (cf. Table
    2) shows a tendency toward consonant clusters in final position (e.g. parked would
    be avoided more frequently than sorted). This can be related to both of production
    and perception (cf. Filippura et al. 2009) and also to the influence of Chinese
    dialects, the isolating substrate of HKE (Cantonese) and SinE (Mandarin and Hokkien),
    where varieties base forms concentrate.Another factor lacking of the inflectional
    marker is the explicit expression of an adverb which would mark perfect meaning
    and make the inflectional marker redundant, in accordance with Miller’s (2000,
    2004) view that the expression of perfect meaning resides in the adverts and not
    in the verb, and also in accordance with the ongoing typological change of English
    from a synthetic to an analytic language (cf. Szmcsenyei and Kortmann 2009; Tagliamonte
    2009).


    Another important aspect is the clear influence of mode observed for both BrE
    and for AsEs. In BrEs, the spoken mode to some extent differs from what is established
    in grammars of English, the written mode conforms to it. In AsEs, the differences
    between spoken and written modes are very clear: the written mode parallels spoken
    BrE and diverges from what offers a much wider range of varieties. We find no
    statistically significant difference between written AsEs and spoken BrE, which
    inevitably brings to mind the fact that the input in these language-contact varieties
    is a spoken variety of English, which could have diffused (in Schneider 2000:
    211 sentence) to AsEs and be reflected in written discourse in these emerging
    varieties (Mesthrie 2008; Mesthrie and Bhatt 2008). One relevant exception in
    AsEs is Indian English: not only does it show values closer to British English,
    but also shows no significant difference in the use of varieties between the spoken
    and the written mode (cf. Table 6).


