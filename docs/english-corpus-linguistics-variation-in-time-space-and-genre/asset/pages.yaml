  md: 'More precisely, EGAP is “concerned with the general academic language [and]
    study skills” that are common across various disciplines whereas ESAP is “concerned
    with the language features [and activities] of particular academic disciplines
    or subjects” (Jordan 1989: 151).


    ![](img/6910650ad69df72c967df4c631af744d_244_0.png)


    Figure 1. English for General Academic Purposes vs. English for Specific Academic
    Purposes (Blue 1988)


    In the field of academic English, vocabulary teaching has been one of the main
    focuses of interest. However, it has also been the subject of much debate, as
    some authors defend the idea of a general academic vocabulary that cuts across
    disciplines (e.g. Coxheed 2000; Granger and Paquot 2009a) while others, as Hyland
    and Tse (2007), highlight the specificity inherent in each discipline. The advocates
    of a common-core approach to EAP teaching do not question the fact that different
    disciplines may show variation, but argue “that besides these discipline-specific
    features, remains remains teachable core” (Granger and Paquot 2009: 101; Coxheed
    2000). They further claim that the discipline-specific features of EAP can be
    learned in the content class (Hutchinson and Waters 1987; Spack 1988) or highlighted
    by EGAP teachers when necessary (Granger and Paquot 2009).


    The scholars favor a discipline-specific approach to EAP vocabulary teaching,
    on the other hand, question “the assumption that a single inventory can represent
    the vocabulary of academic discourse and be valuable to all students irrespective
    of their field of study” (Hyland and Tse 2007: 238). They argue that, “disciplines
    have different views of knowledge [and] research practices”, vocabulary will behave
    differently across disciplines (Hyland 2002; Dudley-Evans and 2000; Hyland and
    Hamp-Lyons 2002; Hyland 2006). As a result, they claim that “considering text,
    context, and use, [general] academic vocabulary becomes a chimera” (Hyland and
    Tse 2007: 250). However, as pointed out by Granger and Paquot (2006: 96), if general
    academic vocabulary teaching is a chimera, then “one can wonder which EAP tutors
    should teach to mixed groups of students”.


    To shed some light on this ongoing debate, it would be interesting to know the
    exact what EGAP and ESAP vocabulary represents in EAP. This will enable us, subsequently,
    to better assess the importance of the common-core uses of EGAP vocabulary. However,
    as previous studies have focused on the commonalities found across disciplines
    (e.g. Coxheed 2000; Nesi 2002; Paquot 2010) and the vocabulary used in a particular
    discipline (e.g. Agriculture: Martinez et al. 2009; Medicine: Wang et al. 2008;
