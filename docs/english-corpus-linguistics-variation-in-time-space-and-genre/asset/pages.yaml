  md: '# New developments in corpus linguistics and the study of

    language variation and change


    Kristin Bech and Gisle Andersen


    University of Oslo and NHH Norwegian School of Economics


    It is the task of the corpus users to evaluate whether the corpus

    is suitable for their research questions. All corpora are not

    suitable for all types of research questions.


    This mild admonition stems from Stig Johansson (2012: 54), in whose

    ICAME 32 in Oslo was organised, and it is a response to, or rather, a

    wholehearted agreement with, Meyer’s words of caution in his 2004 article ‘Can

    you really study linguistic variation in linguistic corpus?’. In article,

    Johansson writes about social and situational factors in textual distribution,
    and

    t close relation between the research question(s) and the interpretation of

    corpus data. He lamments the apparent gulf between corpus linguistics and

    sociolinguistics, as evidenced in the fact that the Handbook of language variation\and
    change (Chambers et al. 2002) only contained one article dealing with

    corpor. However, Stig Johansson, whose motto was jobba ‘soldier on’, was

    ot one prone to resignation, and his suggestions for the future include going

    beyond corpus linguistics to develop new methods and new theoretical

    frameworks for the study of language variation.


    Recent developments in corpus linguistics do, in fact, give reasons for

    optimism for the scholar looking to study language variation and change

    Andersen 2010). One important advantage is the availability of a new generation

    of comparable corpora, sometimes ‘snapshot corpora’ (Cllaridge 2008;

    Gabrielos et al, 2012), that use the same corpus and sampling frame for

    corpora recorded at different points in time. From the Brown family of corpora,

    compiled in 1961 and 1991, the methodology known as (short-term) ‘diachronic

    comparable corpus linguistics’ has emerged, which Leech et al. (2009)

    is probably the most substantial contribution to date. Elness’s study (this volume)

    gives an example of how research method can be used to study gender and

    cultural differences. Recent additions of new Brown family members, specifically

    t BLOB-1931 corpus (Leech 2012) and the BE06 corpus (Baker 2009), now

    allow for research that tracks changes in English language go beyond the

    original 30-year span in both directions. Similarly, this method has recently
    been

    applied within spoken language by the comparison of the COLT and

    LIC/MLE corpora (Torgersen et al. 2011; Andersson forthcoming) representing

    London adolescent speech. Two measures are crucial in diachronic comparable'
