- img_proc: true
  md: 'Natassia Schutz


    As mentioned earlier, I focus on the lexical verb lemmas occurring in LOCRA. In
    order to analyze both verb types and tokens, the three sub-corpora were lemmatized
    and POS-tagged with WMatrix (Rayson 2009) using the Constituent Likelihood Automatic
    Word-tagging System (CLAWS7) (Gardside and Smith 1997). As the target includes
    different tags for each verb form (e.g. VV for the base form or VVD for the past
    tense), a Perl program was applied to the CLAWS output in order to simplify these
    verb tags and conflate them into a single VV tag (cf. Granger and Paquet 2009a).


    # 2.2 Vocabulary extraction methods


    To identify the academic verbs used in LOCRA, I explore and combine two vocabulary
    extraction methods that have previously served as the basis for various lists:
    (1) the keyness method (Scott 1997) based on statistical analyses (e.g. Academic
    Keyword List, Paquet 2010; Transdisciplinary Scientific Lexicon, Drouin 2010)
    and (2) the total frequency analysis mainly based on the analysis of relative
    frequencies (e.g. General List, West 1957; University Word List, Xue and Nation
    1984; Academic Word List, Coxhead 2000). Sections 2.2.1 and 2.2.2 describe these
    two methods and the different types of results they yielded.


    # 2.2.1 The keyness analysis


    To identify the key verbs occurring in LOCRA, I replicate the methodology used
    in Granger and Paquet''s study of general academic verbs (2009a). However, while
    their study only focused on the common-core EAP key verbs, I use the same method
    to analyse all'' the key verbs occurring in LOCRA.


    The keyness analysis consists of extracting all the words that occur with "unusual
    frequency in a given text compared to a reference corpus" (Scott 2001: 236). In
    other words, the aim of this method is to generate a list of the words typical
    of a given corpus by identifying the words that are significantly more frequent
    in this specific corpus when compared to a reference corpus. In this paper, method
    used to identify the verbs that can be considered typical of academic English.
    With a "strongly contrasting reference corpus" (Tribble 2001: 396) of fiction
    writing, I compare the three sub-corpora of fiction v. the 1,000,000,000-word
    fiction sub-corpus of the Baby British National Corpus, on the grounds that typical
    EAP verbs would not occur out frequently in this reference corpus (Granger and
    Paquet 2009a).


    More concretely, each of the three sub-corpora was submitted to a keyword list
    for WordSmith Tools 5 (Scott 2008). This program generated a key list for each
    sub-corpus. The three lists were manually edited in order to create lists of key
    verbs. The resulting verb lists were cleaned up to delete the verbs that were
    erroneously tagged as verbs by WMatrix (e.g. gerundive or cytokine).'
