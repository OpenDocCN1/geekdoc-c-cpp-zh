    # 3. Proportion of personal pronouns used as subjects


    One thing is how many male vs. female references there are in the various corpora
    and corpus divisions. Another thing is what those references are used for.


    In an attempt to find out that in the corpora examined, I made a crude distinction
    between the subject form – he and she, respectively – and the two other forms
    combined – his/him and her/hers.


    In some cases the use of subject forms will be related to the expression of fairly
    straightforward agency, denoting the agent of the activity expressed by the verb.
    However, there are many other options. For one thing, the subject of passive clauses
    cannot generally be associated with agentivity, since in such constructions, if
    an agent is identified at all, it will rather expressed in a by phrase. Also,
    there are many other constructions where the subject cannot be associated with
    any agentive meaning.


    Instead, the proportion of subject forms can be seen as an indication of a much
    vaguer notion of activity, as is done by Kjellmer (1986). I shall prefer the even
    more open term ‘involvement measure’, intended to reflect the fact that subject
    referents can often be portrayed as more heavily involved in the activity described
    than the referents of other clause elements, without being unduly specific about
    the nature of this involvement.$^9$


    Some of the most striking features emerging from Figure 5 and Figure 6 are:'
