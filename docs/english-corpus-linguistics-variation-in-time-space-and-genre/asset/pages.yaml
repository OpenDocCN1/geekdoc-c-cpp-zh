    # 7. Concluding remarks


    The findings presented in this pilot study suggest a variety of heteroglossic
    engagement patterns across and within medical RAs, patterns that may be more easily
    discerned using a corpus-based approach than by the analysis of individuals texts
    or segments alone (see comments in Martin and White 2005: 260). These possible
    patterns and their relations with the rhetorical purposes of the medical RA need
    to be explored further, as do the effects of variations in the scope of heteroglossic
    features (see comments in section 4).


