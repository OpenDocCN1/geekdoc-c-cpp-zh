  md: '# How specific is English for Academic Purposes?


    Vongpumivitch et al. 2009), the respective weight of the commonalities and specificities
    of EAP unclear.


    This paper intends to tackle this debate further by exploring EGAP and ESAP vocabulary
    in three different academic disciplines (business, linguistics and medicine).
    I will focus on verbs because they play an important role in academic writing
    as they allow researchers to do various things that researchers do, namely refer
    to each other and “work with data in academic ways” (Nation 2001:18).


    This study will attempt to provide a broad overview of the distribution of EAP
    verbs by analyzing all the lexical verb lemmas in the three-million-word Corpus
    of Research Articles (LOCRA). As I will identify the lexical verbs as typical
    of academic English (referred to as academic verbs) that are shared across the
    three disciplines in the corpus vs. those that are specific to a particular discipline,
    my results will shed some light on the respective weight of EGAP and ESAP verbs
    in academic English.


    In section 2, I describe the corpus to investigate the use of lexical verbs in
    academic English and how I identify these academic verbs by combining two vocabulary
    extraction methods that have previously served as the basis for word lists: the
    statistically-based keyness analysis and the traditional analysis of relative
    frequencies. In section 3, the resulting academic verb list and the distribution
    of these verbs across and within the three disciplines in LOCRA are described.
    In section 4, I take a closer look at the EGAP verbs identified in LOCRA and how
    they should be presented in context to better describe their EGAP uses. Section
    5 contains concluding remarks.


    # 2. Method


    # 2.1 The data


    The corpus used in this study is a corpus currently under development at the Centre
    for English Corpus Linguistics (Université Catholique de Louvain): the Louvain
    Corpus of Research Articles. It currently totals 3,035,510 words and contains
    421 research articles from peer-reviewed top-rated journals in three different
    academic disciplines, i.e. business, linguistics and medicine (hereafter BUS,
    LING and MED) (c.f. Table 1).


    Table 1. The LOCRA corpus


    | Disciplines | Number of texts | Number of words |

    | Business | 116 | 1,053,479 |

    | Linguistics | 109 | 1,004,829 |

    | Medicine | 196 | 977,220 |

    | TOTAL | 421 | 3,035,510 |'
  merge: -1
