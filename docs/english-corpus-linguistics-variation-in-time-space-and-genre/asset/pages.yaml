    These are three typical examples of the alternative construction:


    +   (19) And you see how it''s really nice and caramelizing, and I didn''t put
    any extra oil or butter in, there''s enough fat from the steak. What I did was
    I put kosher salt. (COCA, CBS Early, 2007)


    +   (20) Well, what I did was I went and did my own checking among people, both
    who knew her and who were friendly to her and people who were not friendly to
    her. (COCA, In. Geraldo, 1994)


    +   (21) Yeah, I''m going to show you how to do that. Here is already the plain
    glass plate, what I''ve done is, I cut the image out of a calendar and didn''t
    put it on the top, what I did was, I flipped the over and glued it on the back,
    because you don''t want the image to show through. (COCA, NBC, TodaySat, 1998)


    Note, in addition to the one targeted by the search, example (21) contains another
    example of the construction (“what I''ve done is, I cut the image out of a calendar”).
    Taken together, the examples suggest that we can be optimistic about the syntactic
    realism of the transcribed broadcasts, which are the chief source of spoken language
    in COCA. This is noteworthy as these transcripts are not produced by linguistically
    trained personnel. One typical feature of spoken syntax is preserved better in
    these than in historical court transcripts (cf. Old Bailey) or fiction (LION).


    # 4. Conclusion


    The present paper has explored the history of a particular type of focussinging
    construction which is strongly associated with spoken English, namely selectional
    clefts of the we What I did was I called the police. In the absence of sufficient
    spoken data older than the mid 20th century recorded or transcribed – the research
    had to rely on the investigation of “speech by proxy” in selected speech-based
    written genres. The relevant findings show that finite clause complements are
    not recent innovations but can be continuously sparsely attested from the 17th
    century onwards. As regards their origin, they should not be'
