  md: 'The diphthongisation of ME ũ 59


    The final point is to consider the late vocalisation of the g in ug/ug, which
    according to Stockwell and Minkova destabilised the /u:/ and caused further diphthongisation,
    setting the ''GVS'' in motion. Spelling extracted from LAEME show that the vocalisation
    of g must have started in the twelfth century (cf. Table 6.4 in Stenbrenden 2011).
    However, the majority of spellings for eg. fugal FOWL still have a consonant after
    the stressed vowel. The retention of this consonant has any significance, it may
    be that it signals identity with the historical long monophthong/u/. In other
    words, Stockwell and Minkova may be right that the vocalisation of postvocal g
    never produced a monophthong, but a diphthong. On the other hand, there are also
    few unymological uses of consonants after ũ in LAEME sources (e.g. <foule> FOUL
    (in a Gloucestershire source to the last quarter of the thirteenth century, and
    in a Worcestershire text from the first half of the fourteenth century); NOW (in
    an early-fourteenth-century text from Norfolk). These seem to indicate that the
    reflexes of OE ug/ were pronounced the same as the reflex of OE ũ, but whether
    at [u:] or [ou] remains an open question. If the two reflexes had identical, the
    postvocal consonant could be used as a marker of length and be unemologically
    extended to all ũ. The material in SMED suggests strongly that postvocal g had
    been completely voiced by the beginning of the fourteenth century in most of the
    country (cf. Stenbrenden 2011, section 6.2.2).


    # 5. Conclusions


    # 5.1 When did the ‘Great Vowel Shift’ start?


    With regard to the date for the diphthongisation of eME  ũ, a handful of irregular
    spellings from early ME seem to indicate incipient diphthongisation from the thirteenth
    century onwards. However, uncontroversial spelling evidence is not to be had until
    the fifteenth century, when the ‘Welsh Hymn to the Virgin’ (mid-to-late fifteenth
    century) uses <aw> for ME ũ, clearly corresponding to a diphthong: the hymn is
    written in English, but according to Welsh orthography, according which <ow> indicates
    a diphthong (Dobson 1968: §160). LAME sources, likewise from the fifteenth century,
    use <au> or <aw>; so some of the authors of the Paston Leathers and Cely Papers
    (spanning the period 1440–88).


    The digraphs <a> and <and> indicate advanced diphthongisation, [ʌ] or [au], so
    the early stages may have been reached some time before the mid-fifteenth century,
    probably as before the mid-to-late thirteenth century. A similarly early date
    – the late thirteenth century has has established for the incipient stages of
    the changes to early ME ī, ē and ø also (Stenbrenden 2011). To be sure, early
    dates for the initial stages of the ‘Great Vowel Shift’ have been suggested by
    other scholars before, notably by Wyld (1936), Köeritzer (1954), Stockholm (e.g.)'
