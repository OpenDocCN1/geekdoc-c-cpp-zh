    Test 1 resulted in a chance-corrected coefficient of agreement of k = 0.51, interpreted
    as ''moderate'' according to Landis and Koch''s (1977) scale. Test 2 yielded a
    value of k = 0.62, which indicates a ''substantial'' level of agreement. The latter
    score, being the result of a more careful and in-depth annotator training, can
    be considered as a more trustworthy assessment of the level of inter-coder agreement
    that can be attained in the task considered.


    For the analysis of Engagement, two collections of potential markers were assembled
    adapting and integrating the lists of markers of certainty and doubt provided
    in Bifer and Fine (1989). The two lists were used to filter the texts through
    an automatic procedure which detects and prints the counts of markers. The markers
    were subsequently manually checked in the corpus to disambiguate their meaning
    and eliminate from the count those were not used in their subjective sense (Akkaya
    et al. 2009; Wiebe et al. 2005). Example (14) shows this ambiguity: that is, to
    express opinions or beliefs.


    +   (14) As the UN''s Food and Agriculture Organization has shown, the main causes
    of deforestation are not biofuels.


    +   (b) The energy quiz and facts how to save energy at home, at work and at play.


    While in the first example, show is used in its subjective sense of ''demonstrating'',
    proving to the information reported as highly reliable and frame it as a valid
    support to the following claim, in example (b) the same verb is used in its objective
    sense of ''display'', ''exhibit'', ''make visible'' and not as an Engagement device.


    The procedure for the analysis of Engagement described above significantly differs
    from the ''bottom up'' approach employed by Fryer (this volume), which is based
    on the computer-assisted manual annotation of Engagement resources. Indeed, as
    Hood suggests, "there is a trade-off in the choice of approach in any one study"
    (Hood 2004: 15). The main advantage of the ''top down'' approach employed here
    is that it is comparatively time-consuming and minimizes the risk of inconsistent
    or incomplete annotation by annotator''s fatigue. On the other hand, Fryer''s
    approach allows for a more graded and comprehensive analysis of Engagement, which
    includes unique and infrequent realisations which are not easily predicted in
    advance.'
