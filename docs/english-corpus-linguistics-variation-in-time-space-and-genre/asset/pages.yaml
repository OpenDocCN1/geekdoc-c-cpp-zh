    This may be seen as an indication that spoken language tends to portray the people
    referred to as more actively involved in the situations depicted than most kinds
    of written language. It may also reflect a difference in syntactic complexity:
    if it is assumed that spoken language is generalised by a simpler structure than
    many kinds of written language, that will in itself lead to higher ratios, since
    the subject constituent will remain even in many clauses with a simple structure,
    while there will be fewer constituents representing the other forms of the personal
    pronouns. These are really two sides of the same coin: A simpler structure means
