    # 6. Conclusion


    The analysis has revealed two substantially different approaches to the discursive
    texturing (Fairclough 2003) of a responsible corporate identity and contrasting
    ways of approaching the reports’ readership. While BP deploys interpersonal resources
    to portray itself as a reliable and authoritative expert, IKEA discloses itself
    as a caring and progressive corporation. Further, while BP establishes in discourse
    a detached, pragmatic relationship with its interlocutors, characterised by scarce
    emotional display and an emphasis on its technical expertise that conceals the
    company’ ‘humanity’, IKEA emphasises with the readers and seeks to bond with,
    establishing a common ground of shared values and optimism about the future. BP’s
    authoritative attitude can be interpreted as an attempt to elicit trust from its
    interlocutors by the company’s proclaimed competence, in plain words, “you can
    trust me because I know what I am doing”. By persistently emphasizing its technical
    knowledge and skills, making technical forecasts, and giving insider insights,
    BP constructs stakeholders. IKEA, on the other hand, adopts a reader-oriented
    stance, which can be summarised as ‘I understand your needs and I strive to constantly
    improve.’ By emphasizing its focus on progress, and its tenacity in concerns,
    IKEA constructs its relationship with its stakeholders as one of empathy, proximity
    and alignment. The company accommodates their concerns, implicitly recognising
    them as legitimate, and responds by communicating their adherence to the values
    of commitment, humility and transparency.


