  md: '# How specific is English for Academic Purposes? 255


    of disciplines should be conducted to better determine whether disciplines show
    similar trends and how they could be grouped together.


    As for the methodological considerations of this study, it has been shown that
    combining the keyness method with the analysis of frequencies proved fruitful
    as the analysis of relative frequencies picked up a number of academic verbs that
    were overlooked by the keyness analysis. By only extracting the verbs which are
    significantly more frequent in a general corpus compared to a reference corpus,
    the keyness method does not take into account a number of highly frequent verbs
    which can also have academic meanings and uses (e.g. gain insights and carry out
    a study in academic English us. gain weight or carry in fiction).


    However, I acknowledge that this study was mainly based on quantitative analyses
    and involved a limited number of academic disciplines. It therefore constitutes
    a first step in the clarification of the specificity debate. To better assess
    the weight that general academic vocabulary represents in academic English, it
    is necessary to replicate these analyses using a corpus of academic English containing
    a wider variety of disciplines and to further investigate how the potential EGAP
    verbs are used in context across academic disciplines. This type of analysis will
    make it possible to better distinguish the general academic verb patterns (e.g.
    support or require investigation) from those that are inherent in a particular
    discipline (e.g. provide care or require a treatment in MED). Therefore, pending
    further work in this area, the specificity debate remains open.


