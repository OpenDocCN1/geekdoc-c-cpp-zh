  md: '# 6 Kristin Beck & Gisle Andersen


    conclude that man is used as a marker of regional, working-class identity in the
    Tyneside area.


    Cristina Suárez-Gómez and Elena Seane investigate differences in the expression
    of meaning between British English on the one hand and East and South-East Asian
    Englishes (AsE) on the other. Using components of the ICE corpus, they perform
    an intervariational comparison of the Englishes of Hong Kong, Singapore, the Philippines
    and India. They are concerned with both the variation in expression of meaning,
    by means of the present perfect construction, the preterite, the base form of
    the verb, etc., as well as the semantic subtypes of perfect meaning, i.e. recent
    past, persistent situation, and experimental and resultant meanings. They analyse
    contexts in which the perfect is used in connection with the adverts just, ever,
    never and yet, and show that all Asian varieties have lower percentages of the
    canonical have + past particle than the Br reference corpus, and generally that
    the past mode shows a significantly higher proportion of alternative ways of expressing
    perfect meaning. The difference between AsE and Br is one of general frequency
    but also of formal characteristics, that AsE uses the preterite especially for
    the expression of recent past with just, while Br uses the preterite especially
    for the expression of experimental meaning with ever/never. Moreover, they observe
    in AsE a greater formal variability in the several alternatives which are not
    registered in Br or marginally used there. On this basis they conclude that Schneider
    (2007) holistic conception of the Asian varieties, which share a number of traits,
    such as the fact that choice of form for the expression of perfect meaning is
    determined by the adverb used and the meaning expressed.


    Variation in genre: Corpus studies of English for Specific Purposes


    Daniel Fryer''s contribution uses Appraisal Theory, a model of evaluate language
    based on the theory of systemic-functional grammar, and in particular the ENGAGEMENT
    system, to study the way in which writers of high-impact research articles engage
    and position themselves in relation to other voices in the same field. Fryer focuses
    on heteroglossic, i.e. engagement utterances that allow, for or challenge other
    voices in the discourse (as opposed to monoglossic utterances, i.e. assertions).
    He shows that, although authors use various engagement resources, the feature
    ‘entertain’, which comprises resources such as hedging, modality and evidentiality,
    is the most frequent one. After analysing the texts in even further detail, Fryer
    is able to show that not only are there differences across research article sections
    (Introduction, Methods, Results, Discussion) as concerns frequencies of heteroglossic
    features, there are also differences within sections.


    Appraisal Theory is also used by Matteo Fuoli to evaluate language in the sustainability
    reports of the companies BP and IKEA, more specifically the way in which they
    construct their corporate identity and establish'
