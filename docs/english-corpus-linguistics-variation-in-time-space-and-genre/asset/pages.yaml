    Table 1 sets out the 30 most frequent lexical verbs occurring immediately after
    he and she, respectively, in the BNC.¹¹ The verbs are listed in order of decreasing
    frequencies. As was expected, there is a great deal of overlap between the two
    lists. The chief reporting verb *said*, especially common in fictional and newspaper
    texts, both lists, and a few of the other verbs are also shared by the two lists.
    To facilitate comparison, bold print is used for the verbs from each list which
    are unique to that list or occur in a higher position than the other.


    If one looks for semantic features of the highlighted verbs, a striking difference
    of the forms occurring after she are ones which typically express a clear cognitive
    meaning: *felt, knew, thought, wanted, wants, realised* and *remembered* – a total
    of seven verbs – must be placed in this group. By contrast, only one of the verbs
    from the he list, *thinks*, can be classified as typically cognitive verb.


    On the other hand, the list of verbs occurring with he contains more items which
    often denote a doing with physical activity: *took, made, wrote, put*, also looked
    and stood. In the he list there are also verbs denoting motion: went, walked and
    goes. By themselves these differences might suggest that men are often portrayed
    as involved in physical activity and moving about, while women are more apt to
    be described as thinking or engaging in other mental activities. This difference'
