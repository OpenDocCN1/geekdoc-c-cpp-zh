    # 3. Material and methods


    Material was selected from five of the world’s leading general medical journals,
    chosen according to their impact-factor rankings in the 2009 Citations Report
    (Tomson Reuters 2010): the New England Journal of Medicine (impact 47.050), the
    Lancet (30.758), JAMA: Journal of the American Medical Association (28.899), the
    Annals of Internal Medicine (16.225), and the British Medical Journal (13.660).
    The 100 most highly cited original research articles (RAs) published within these
    five periods during the period 1990–2010 were selected, providing a corpus of
    approximately 700,000 words.¹⁰ This paper reports on a subsample of corpus: 23
    RAs, 164,000 words (see Appendix for details).


    The corpus was annotated for its heterogloss features according to the model of
    Martin and White (2005), by manual and semi-automated techniques, using UAM CorpusTool
    software¹ I read through each RA, and using the descriptors summarized in section
    2, identified and labeled the heterogloss features encoded in the text. Wordings
    were manually annotated, as illustrated in the screenshot of Figure 2. In this
    particular example, the highlighted word, may, is marked in the left column, under
    ‘Assigned,’ as ‘entertain’. When matching wordings were identified, the software
    automatically suggested tags. Before being approved, these suggestions were checked
    by examining the co-text, so as to avoid inappropriate annotations (e.g. Article
    accepted May 12, 2009). A predetermined list of feature realizations was not used.'
