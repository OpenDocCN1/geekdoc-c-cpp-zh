  md: '# Kristin Beck & Gisle Andersen


    corpus linguistics, notably time span and sampling points, and granularity is
    a function of the number of time points within a given time span. The time span
    may vary to suit particular research objectives, from centuries, as in the LAEME/LALME
    corpus by Steenbrenden (this volume), via the more typical 30-year span of the
    Brown family of corpora, to the much narrower time span of contemporary monitor
    corpora such as COCA (Davies 2009) and the Norwegian Newspaper Corpus (Andersen
    and Hofland 2012). In monitor corpora, the number of sampling points, and thereby
    the granularity, is generally much higher than in other corpora, and may even
    enable the day-to-day monitoring of lexical innovation and other features (Renof
    1993, 2007; Andersen and Hofland 2012).


    Further, more advanced statistical techniques add to the usefulness of the wide
    range of corpora resources for investigation. Although most studies rely on traditional
    means of testing the significance of frequency differences at different time points,
    methods as cluster analysis (Gries and Hilpert 2008), regression analysis (Millar
    2009) and frequency development analysis (Gabriatos et al 2012) offer innovative
    data-driven techniques for revealing fine-grained patterns and identifying stages
    in diachronic developments in which a particular language feature is present.
    Although more exploratory work is needed, these techniques have a potential for
    extending the extent of correlation between the variables of time and frequency
    with sociolinguistic variables.


    Moreover, we believe that corpus linguistics and sociolinguistics have a lot to
    gain from inspecting new data that have become online. This applies not only to
    large collections of written language as COHA, Google n-grams, newsswire archives
    etc., but also to new media such as video blogs and self-recordings on the internet.
    These may be valuable, especially perhaps to studies in pragmatics and discourse,
    but also to the study of phonology and prosody variation. It is reasonable to
    believe that these new data may at least complement, although not replace, data
    gathered through carefully designed elicitation tasks, sociolinguistic field work
    and interviews.


    Against this background, it is hoped that Johansson would have shared this optimism
    and be satisfied with research questions, selections of corpora and interpretations
    of data found in the eleven studies that make up the present volume. Some of them
    indeed bridge the gap between corpus linguistics and sociolinguistics, and are
    thus evidence of a development that Johansson wished to see. As the book title
    suggests, we have collected papers that use corpora to study variation among three
    dimensions– time, place and genre. The volume is accordingly divided into three
    sections. The first section contains three studies on variation in time, in. the
    history of English. The second section contains five studies that investigate
    variation in space, most of them by comparing particular varieties of English,
    including some “New Englishes” (Koch and Bernais this volume; Suárez-Gómez and
    Seoane this volume). In the third section are found three studies on genre, as
    represented by media articles, social reports and academic English.'
