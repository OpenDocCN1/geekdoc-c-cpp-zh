    spelling material; these are editions and articles offering irregular spellings
    for ME ӱ (Zachrisson 1913; Whitehall 1935; Hunt and Bensin 2001).

    Importantly, all the texts (MSS) are dated, albeit approximately in some cases,
    which means that it is possible to identify the dates at which innovative spellings
    start to appear, and to track changes in progress. Moreover, all the texts hold
    solid language, which has been localised in the majority of the cases — or less
    precisely within the medieval counties of England. Here, the localisation of the
    language is tentative in certain cases, or has not yet been attempted for many
    of the LAEME sources; spelling evidence from such localised sources cannot at
    present be used for my purposes, but it is hoped that in the future, as more texts
    are added to the LAEME Corpus of Tagged Texts, the FIT-technique will allow more
    certain localisation of the language of these sources also (for an explanation
    of the FIT-technique, see LALME, Vol. I). This enables the identification of the
    loci of change, and the subsequent spread of change, dialectally and geographically.


    # 3. Method


    All words with OE/ME ӱ in all three corpora have been examined, and irregular
    spellings have been extracted. However, isolated spellings may not reveal much
    about sound change, as they are part of a spelling system, which is generally
    idiosyncratic in ME. Thus, each irregular spelling needs to be assessed in the
    entire orthographic system in which it appears, and only then can a given innovative
    spelling be taken to indicate sound change with any certainty, or conversely,
    be discarded. Such closure of the individual scribe''s system may also reveal
    whether <ou> can in fact be used as evidence for vowel shift in some cases, as
    later we will demonstrate.


    As Kristensson did not systematically record the spellings for OE/ME ӱ (he notes
    only <>, <ou> and <ow> are found), SMED yields no potential vowel-shift spellings.
    For LAEME, all spellings for items with ME ӱ have been extracted, totalling over
    14,000 tokens. These have then been counted in dominant vs. secondary vs. minor
    spelling variants, according to LALME practice (i.e. a dominant variant is unmarked;
    a variant which occurs with a frequency of between one-third and two-thirds of
