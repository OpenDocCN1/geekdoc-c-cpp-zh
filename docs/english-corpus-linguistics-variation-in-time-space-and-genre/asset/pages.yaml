    superstratum language exists, since the data for PhilE are close to recent varieties
    in American English, that is, with higher proportion of proximities (Elsness 1997,
    2009; Hundt and Smith 2009). Influence from the substrate cannot be discarded,
    especially in light of the high incidence of base forms in SinE and HKE, possibly
    explained by the influence of the isolating nature of Mandarin and Hokkien for
