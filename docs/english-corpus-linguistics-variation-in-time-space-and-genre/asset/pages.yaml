    # 3.2 The distribution of LOCRA’s academic verbs


    In order to better understand what EGAP and ESAP verbs represent in LOCRA, the
    distribution of all the academic verbs identified in this paper have to be analyzed
    in two different ways. First, to distinguish the potential EGAP verbs (i.e. the
    verbs shared by the three disciplines and that potentially have similar uses across
    disciplines) from the ESAP verbs (i.e. the discipline-specific verbs), the academic
    verb lists need to be compared to identify which verbs occur in the three disciplines,
    which occur in two disciplines and which ones occur in only one discipline (section
    3.2.1). It is only after this general distributional analysis that the weight
    (i.e. the proportion of the total number of verb types and tokens) of EGAP and
    ESAP verbs represent in each discipline can be measured (section 3.2.2).'
