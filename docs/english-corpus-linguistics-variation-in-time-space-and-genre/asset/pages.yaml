    When it comes to the variation among the five text categories that this corpus
    is divided into, Fiction stands out as the category with the lowest ratios in
    all periods. The tendency noted when we looked at the gender distribution in the
    Brown family of corpora (cf. above, Figure 1) is thus confirmed. One reason can
