  md: '60 Gjertrud F. Steenbrenden


    1972, 1978, 1985, 2006), and Stockwell and Minkova (1988a, 1988b, 1990); however,
    their findings, particularly those of Wyld, remain curiously ignored. Whitehead
    (1935:67) concludes that ‘it is not clear what other symbol [than <au> could be
    used as an unconventional semisemphonetic spelling for the stages of the diphthongization
    of ũ that involved a back vowel as the first element of the diphthong’. He is
    therefore prepared to take them at face value as indicating advanced diphthongisation;
    then it is not difficult to confirm wholeheartedly (although it is on the whole
    more likely that the diphthong had a central first element, [æ] or [a], rather
    than a back one).


    # 5.2 Where did the ‘Great Vowel Shift’ start?


    Regarding the loci of change for the diphthongisation of ME, the following emerges.
    Relatively unconventional spells appear first in the West Midlands (Worcestershire,
    mid-thteenth century), then in OE (late or fourteenth century), and the East Riding
    of Yorkshire (early fourteenth century), then in East/Norfolk c. 1320–30 (Hunt
    and Binsenk 2001). Later <au> and <aw> appear in Wiltshire, Lancashire, Nottinghamshire,
    Norfolk, Essex, and possibly in Huntington (in the period 1350–1500). Thus, certainly
    the North-East Midlands, and possibly the South-West Midlands, as well as Lancashire
    and Yorkshire, stand out as loci of change. Interestingly, similar conclusions
    have been drawn with regard to the vowel shift of ME ī, æ and ð (Stenbrenden 2011).


    # 5.3 When do <a> and <ow> for ME ũ become regular?


    AN <au> and <ow> are recorded from early ME as minor spelling variants; they do
    not become regular until the mid-thteenth century, and not dominant until after
    1300 (cf. table 2). However, traditional <ū> lingers until late ME. Also, the
    abandonment of <ū> must be in connexion with the development of OE �, which was
    retained as [y:] in the West Midlands, and as spelt <�>, <ui>. The reason why
    was discontinued for [y:] is that OE y/� generally became ambiguous in terms of
    its sound correspondences (however, some of this ambiguity may be traced back
    to OE, since variant forms with <i> and <y> are found in OE for items such as
    <byrce ~ birce> BIRCH, <byrd ~ bird> BIRTH, <dysig ~ disig> FOOLISH). With the
    gradual adoption of <au> and <ow> for ũ, <u> could be used for retained front
    rounded [y:]].'
