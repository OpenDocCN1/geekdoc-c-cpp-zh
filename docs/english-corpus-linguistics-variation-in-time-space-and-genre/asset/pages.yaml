    Dialog explanation (see Figure 1) can be subcategorized according to whether the
    textual voice indicates that its position is but one of possible alternative positions
    in the discourse, allowing dialogic space for alternatives (‘entertain’), or whether
    the textual voice appears to dissociate itself from a particular proposal by ascribing
    it to some external source (‘attribute’) or by explicitly declining to take responsibility
    for the proposition (‘distance’).


    The ‘entertain’ category is typically realized by resources that are elsewhere
    dealt with the heads of modality, hedging, and evidentiality (e.g. Halliday and
    Mattheisen 2004: 143–150, 613–625; Hyland 1996; Chafe 1986), including modal Finites
    and Adjuncts (e. may., probably) and certain “evidentials” (e. seems, suggests,
    apparently) (see Martin and White 2005: 104-111). In (12), may encodes, from a
    dialogic perspective, the proposition as being one among a number of possible
    alternative propositions, for example that the ‘administration of activated protein
    C may not improve the outcome of severe sepsis.'
