    There are four main subtypes of ‘proclaim’ feature. Their categorization depends
    on whether the textual voice appears to limit the scope of dialogic alternatives
    by overtly agreeing with projected voices (‘concur’), by construing projected
    voices as correct, undeniable, or highly warrantable (‘endorse’), by explicit
    author intention (‘pronounce’), or by marking an utterance as contentious and
    in need of justification (‘justify’).


    The ‘concur’ feature is subcategorized as either ‘affirming’ or ‘conceding,’ with
    the former typically realized by locations such as course, naturally, and obviously,
    and the latter by wordings such as admitted and granted, often paired with ‘counter’
    and ‘deny’ resources. In (7), the comment Adjunct clearly constructs for the text
    audience that shows the reader’s view, affirming the validity of the proposition
    and thus limiting the scope for alternatives. In (8), the text counsels a reader
    who is actually or potentially resistant to the author’s position. This potential
    resistance is first acknowledged or validated by a concession, signaled by the
    comment Adjunct admitted, and is then countered, signaled by the conjunction but.


