    According to Wells (2006: 153), “a final vocative is usually accented but attached
    to the preceding IP [intonation phrase] as (part of) the tail”. Likewise, unfocused
    adverbs and adverbials, including final pragmatic markers, such as *know* and
    *then* and *sort of*, are not accented (Wells 2006: 158-9). We would expect final
    man to be accented regardless of the pragmatic function it fulfills.


    Although there is no one-to-one relation between tone and sentence type, there
    exists a notion of default tone. The neutral, expected final tone for statements,
    exclamations and commands in English is a fall, rises typically in yes-no questions
    and statement questions (Wells 2006: 15). The intonation patterns in Tyneside
    do not comply with the unmarked tone meanings for sentence types. “Anybody with
    a reasonable listening has always known that Tyneside [...] has its own special
    tone” (Cruttenden 1994: 159). What is important for the present study is the realization
    of the nucleus, because *man* occurs in the nuclear tail. Clear lexically stressed
    syllable in the intonation contour, with Received Pronunciation (RP), “there are
    many rise-falls and levels in the Tyneside data. The tone level is frequently
    preceded by a jump-up in pitch, i.e. is a high level” (ibid.; cf. Pellow and Jones
    (1978), “there is a rise-plateau intonation in declarative sentences” (Beal 2008:
    140). *Man* can occur in the tail of the *rise-plateau* in “the nuclear syllable
    is realized as a sustained level pitch produced with (crescendo loudness) then
