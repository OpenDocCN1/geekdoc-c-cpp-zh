  md: 'Heteroglossic engagement in medical research articles


    and Discussion, on the one hand, and between the Methods and Results, on the other.
    MacDonald (2002: 453), for example, states that, in medical research articles,
    “[[t]the Introduction and Discussion sections are the zones in which the writer(s)
    negotiate with their peers for ‘research space [...] for their findings,’ while
    in the ‘Methods and Results section, argumentation is encoded and the elider appears
    to assume he/she can take understanding of a range of shared meanings for granted.’
    However, as noted by Hyland (2005: 190), ‘the division of research papers into
    rhetorically simple and detached Methods and Results, and complex, subjective
    and author-centred Introductions and Discussions may be unwise. Even most rhetorically
    incongruent sentences reveal writers’ efforts to persuade their audience of claims,
    that stance and engagement are likely to figure, in different ways, as the research
    paper’


    Thirdly, there is not only variability in which features are construed, where
    and often, but also these features are encoded in the text. As the feature of
    ‘entertain’ shows (see Table 1), the choice of resources differs across RA sections
    and includes modal finites (e.g. may, might), modal Adjuncts (e.g. apparently),
    Predicates (e. include, require), conjunctions (e. if, whether), and nominal groups
    (e.g. confidence interval, hazard ratio) of differing function (Subject, Complement,
    part of Adjunct, or parenthetical addition). In the case of the Results section,
    the most common resource for representing ‘entertain’ is the mathematical construction
    p, accounting for over 30% of all encodings of ‘entertain’ in that section. P
    values express the chance of achieving a particular result observed if no real
    effect exist, and it is this that ‘entertain’, mathematically, the possibility
    of the effect being one of chance (see 26), and the potential moderating effect
    it has on the other monoglossic proposition). The other mathematical expressions
    listed in Table 1 all encode, in different ways, the notion of chance or probability,
    and are categorized as ‘entertain’.


    (26) The effect of pravastatin was greater among women than men (P = 0.05 for
    the interaction between the patient’s sex and treatment). [''entertain’, from
    Results]


    In dialogic contraction, ‘counter’ and ‘deny’ occurred with similar frequencies
    across the Methods, Results, and Discussion sections, often observed as pairings,
    and in example (27). However, in the Introduction, ‘counter’ was considerably
    more frequent than ‘deny’ (9.59/1000 words and 2.51/1000 words, respectively;
    see Figure 3). These ‘counter’ resources are often used to initiate Swales (1990:
    141, 154) refers to ‘establishing a niche,’ by indicating a gap in the current
    research territory. Hood (2010: 184), in an appraisal study of research article
    introductions, also notes that such resources are frequently encountered in academic
    warrants. ‘Counter’ signal a shift from alignment with the reader to misalignment,
    as the author creates space for his/her own study (ibid.). This pattern can be
    seen in (28).'
