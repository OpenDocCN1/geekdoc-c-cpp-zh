    # 6. Discussion


    Firstly, with regard to the above findings, it seems interesting that dialogic
    expansion and the ‘entertain’ feature should be so highly represented; of all
    heteroglossic features identified, 66.51% were of the ‘expand’ type and 53.80%
    were ‘entertain’. Could it be that the textual voices in medical MARs generally
    allow for, and open the dialogic space for alternative positions and voices in
    the discourse; that they entertain these alternative external positions rather
    than restrict their scope? In a sense, this interpretation might fit the general
    perception of (medical) science writing as cautious, or lacking assertion (e.g.
    Hyland 1996; Salager-Meyer 1992, 1994). On the other hand, it could be that the
    ‘entertain’ and ‘attribute’ features, traditionally associated with modality,
    hedging, evidentiality, and attribution (e.g. Halliday and Mattheiesen 2004: 143–150,
    613–625; Hyland 1996; Chafe 1986; Thomas and Hawes 1994, respectively), are more
    easily recognized (and annotated) for their dialogically expansive functionality
    than those features that constrain dialogic contraction, and that they are recorded
    as occurring often. The extent to which they are obviously debatable, and a detailed
    analysis of the variation in scope and gradability of these features might be
    fruitful (see Methodological\u2019dological considerations, section 4).


    Secondly, there appear to be distinctions and parallels between certain sections
    of the medical RA in terms of the construal of heteroglossic engagement. As noted
    above, in section 5, heteroglossic features were more common in the Introduction
    and Discussion (60 and 63 per 1000 words, respectively) than in the Methods and
    Results (34 and 38 per 1000 words, respectively). Does this mean, that the Introduction
    and Discussion sections generally invoke or allow for dialogic alternatives, while
    the Methods and Results tend to be more monologic? It seems to corroborate certain
    observations and claims in the literature (e.g. Adams 1984; Fryer 2012; Gosden
    1992; Salager-Meyer 1994; Swales 1990) and textbooks on academic writing (e.g.
    Swales and Feak 2004: 223) that there is a close rhetorical relationship between
    the Introduction'
