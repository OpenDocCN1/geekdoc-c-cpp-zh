  md: '# 14 Christian Mair


    For the recent historical period in which recorded sound is available, two partly
    compatible avenues of research are being explored. The majority of corpus linguists
    documenting change in the spoken language follow standard practice in the field
    by reducing speech to orthographic transcription. As examples, consider two flagship
    projects, namely the Diachronic Corpus of Present-Day English (DPCSE) and the
    Corpus of Contemporary American English (COCA). The advantages of this strategy
    are obvious. Orthographically transcribed language can be enabled, stored and
    searched easily in fairly large quantities. The price to pay is that certain issues
    which are central in the emergence of new constructions in the spoken language,
    such as the syntax-prosody interface, can be investigated only indirectly or not
    at all. There is circumstance evidence that even the most consistent orthographic
    transcriptions are subject to unacknowledged homogenising and standardising pressures
    (Moll 2007). A comparatively less trodden path is the compilation of audio corpora
    or multi-modal corpora aligning sound and transcription (see Andersen 2010 for
    a recent survey of such projects). In spite of the considerable lead, technological
    and logistical challenges, this is a path also worth taking.


    # 2. Real speech in real time: spoken English 1900 to the present


    Adopting a loose definition, we could argue that the corpus-based investigation
    of language change in real time is as old as the discipline of historical philology
    itself, for it is the method which Otto Jespersen, for example, applied when we
    compared, the increasing frequency of progressive forms in the diachronic corpus
    represented by successive English translations of the Bible (1909–49, IV: 177).
    Providing data for the study of change in real time was the motivation behind
    the compilation of two pioneering computer corpora of English, the Helsinki Corpus
    and ARCHER, A Representative Corpus of Historical English Registers. Real-time
    investigations in the narrowest sense possible when Brown and LOB, the standard
    synchronic reference corpus of British and American English (1961), were complemented
    by their 1990s (Frown and FLOB), 1930s (B-LOB [completed], “pre-Brown” and [ongoing])
    and 1900s versions (ongoing). Note, that none of these ventures involved genuine
    spoken data.


    The investigation of the real speech in real time has a very short tradition.
    There are some pioneering studies which restrict themselves to pronunciation and
    are not based on corpora in the usual sense of the term. Harrington, Thorthorpe
    and Watson (2005), for example, investigate various segmental phonetic changes
    in the Queen''s Christmas broadcasts between 1952 and 2002, while Price (2008)
    documents the changing pronunciations of Australian newsreaders. Pronunciation
    change in vernacular varieties of English is in focus in two sociolinguistically
    informed documentation projects, ONZE'
