    currently the database for Freiburg-based PhD project on “A real-time history
    of dialect and deinination in 20th-century England” (Holz in process³).


    In 1915 the Königliche Preußische Phonograph Kommission [Royal Prussian Phonographic
    Commission] was founded by a number of mostly Berlin-linguists who realised the
    presence of a large number of prisoners of war a unique opportunity to record
    speech and music from a population of very diverse linguistic and cultural background.
    The Angois Brandl (1855-1940) was an active member of this group and helped a
    large collection of folk songs and dialect recordings, of which were analysed
    by himself in a number of publications in the 1920s – rather innovative at the
    time – often included the recordings as shellac records (e.g. Berlin 1926-27).


    Owing to subsequent political events — World II and the partition of Germany in
    the Cold War were the most prominent ones — this valuable body of data was largely
    forgotten. Fortunately, most of the recordings, which part of the Berliner Lautarchiv,
    were digitised in the 1990s, though not in a specialist-linguistic project but
    as part of a wider project to see Berlin’s digital heritage (Ziegler 2000; Mahnhold
    2003, Lange 2010). Copies of 821 Berlin sound files were acquired by the British
    Library and incorporated into its sound archive collections under the heading
    “Lautarchiv British & Commonwealth Readings” (C1315). A small selection of these
    records has been made available for public listening by anyone⁴.


