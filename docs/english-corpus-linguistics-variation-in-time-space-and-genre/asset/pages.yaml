  md: '# Clause-final man in Tyneside English


    Kathrin Luckmann de Lopez


    University of Duisburg-Essen


    # Abstract


    This paper addresses i) the categorization of man as a vocative, ii) its pragmatic
    functions and iii) its ''macro function'' of indexing regional identity in Tyneside
    English. The results provide evidence that Tyneside man, in contrast to other
    vocatives, fulfils predominantly textual and interpersonal functions, challenging
    previous definitions of vocatives. In the data, man is restricted in its syntactic
    mobility, only occurring in the final position; it is highly frequent and mainly
    occurs within intonation patterns associated with Tyneside English. The vocative
    can be used by men and women to address individuals of either sex or (mixed or
    same-sex) groups. It can express working-class solidarity and ''Geerness''.


    # 1. Introduction


    Man is commonly categorized as ‘vocative’. Vocatives can appear in different positions
    (initial, medial, final) and essentially fulfil three pragmatic functions. They
    summon the attention of the addressee identify the intended recipient and they
    “establish or maintain a social relationship between the speaker and the attendee(s)”
    (Leech 1999: 108). Attracting attention appears to be a prime reason for vocative
    usage. As regards man, this function is especially evident when man occurs in
    initial or medial position. However, man occurs far more at the end of an utterance
    or clausal unit in the sample of Tyneside English that will be considered in this
    study.¹ In final position man fulfils predominantly textual, interactional and
    interpersonal functions (His only ambition is to be Fridays once again, man, (AWP
    1,7 00:45:40); All the guys were getting a shower before we bowling. You''re lying,
    man. (GS 2 00:14:20)). The TV series Auf Wiedersehen, Piet (AWP) and Geordie Shore
    (GS), which form the basis of the study, provide an accessible resource for the
    analysis of the pragmatic function of this feature. What makes Tyneside interesting
    and special is its frequently use and its occurrence in local intonation contours
    (rise plateau pattern and rise-falls) in statements, where most English dialects
    have a definitive fall. I will propose that man is a marker of regional identity
    for the Tyneside area.


    In this corpus-driven study of the pragmatic functions of the clause-final vocative
    man in Tyneside English will show how man is commonly used, compare this to how
    it presents itself in my data, and describe the positions it can and occur in.
    I will then examine to what extent the feature coincides with local intonation
    patterns. In the second part of this paper I will relate the findings'
