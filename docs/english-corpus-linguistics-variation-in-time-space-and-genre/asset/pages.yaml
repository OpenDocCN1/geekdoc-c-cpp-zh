  md: '# Texturing a responsible corporate identity


    # 213


    ![](img/6910650ad69df72c967df4c631af744d_219_0.png)


    Figure 1. An overview of Appraisal (adapted from Martin and White, 2005)


    Attitude is subdivided into three subcategories: Affect, which concerns the expression
    of feelings, emotions and states of mind; Judgement, which comprises positive
    and negative normative assessments of human behaviour; Appreciation, which involves
    the positive and negative evaluation of natural or semiotic phenomena, entities
    and processes. The distinction between these categories is semantic and can thus
    be realised through an open-ended set of leico-grammatical resources. Affect may
    be expressed through verbs (e.g. love/to hate), adverbs (e.g. happy/sady), adjectives
    (e.g. angry/ ) or nominalised expressions (e.g. joy/despair, confidence/insecurity
    ) (White 2001). Judgement, as noted by Martin (1995: 29) tends to be realised
    adjectively (e.g. unjust, fair-minded, skilled, incompetent, determined), although
    it can also be conveyed by nominalised forms (best behaviour, outstanding performance),
    and prepositional phrases (in order, as shown). Similar considerations apply to
