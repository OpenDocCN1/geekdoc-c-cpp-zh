    # 3. Conclusions


    A comparison between Asian Englishes and British English regards the expression
    of perfect meaning in constructions with just,(n)ever and yet reveal substantial
    differences. On the one hand, Asian Englishes use have + participle in signifying
    different proportions: only 55.5% of the verb phrases expressing perfect meaning
    in these contexts use the analytic have + participle form, as against 65.5% in
    BrE, and up to 34% the preterite, against 31.6% in BrE. As the use of the preterite
    is concerned, the difference between ASes and BrE lies not only in the general
    frequency of use but also, most importantly, in its distribution (cf. Tables 3
    and 4): AS ASes use the preterite especially for the expression of recent past
    with just, while BrE uses the preterite for the expression of experiential meaning
    with (n)ever.


    On the other hand, Asian Englishes record several alternative variants which are
    not registered in BrE or are only marginally used. Some of the new variants observed
    in the spoken mode in Asian Englishes have filtered into'
