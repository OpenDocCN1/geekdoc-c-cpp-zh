  md: 'Terms more frequent in LOB, i.e. BrE 1961 (to be referred to as BRCULT61)


    +   - Politics and warfare: disarmament, socialist, socialism

    - Business and economic life: bonus, dividend, income, pension

    - Cultural activity: author, book, read

    - Other: tea


    The terms listed under ‘Politics and warfare’ bear witness to the fact that 1961
    was the height of the Cold War, in which the US in particular was heavily involved.
    When it comes as no surprise to see that communist and communism are among the
    terms distinctly more frequent in the American material. In the British list these
    terms are matched by socialist and socialism, often used to refer to phenomena
    closer to home. It is typical that in the field of warfare the antithesis disarmament
    is the only term appearing in the British list. The terms under ‘Business and
    economic life’ illustrate ‘benefiting from wealth rather than creating it’ compared
    with AmE,¹⁶ and the terms under ‘Cultural activity’ may suggest that British life
    consisted mostly of armchair chairs, as against the more vigorous activities typical
    of the US. The terms placed under ‘Other’ confirm for one that in 1961 drinking
    habits stood conform to the cultural stereotypes as far as the choice between
    coffee and tea is concerned. As for the predominance of sex and related terms
    in the American material, this suggests that least Americans were more ready to
    address this topic in public.


    Figure 7 sets out the ratios between the combined frequencies of the cultural
    terms found in brE of 1961 (BRCULT61 vs. AMULT61) for the various corpora of the
    so-called Brown family and the ICE group.¹¹⁷ Figures are given for each of the
    Brown-family corpora as a whole, as no very consistent differences were detectable
    between, the fictional and informational components of those corpora. In the case
    of the ICE group, however, the BRCULT61/AMULT61 turned out to quite markedly between
    speech and writing, and separate figures are therefore given for basic division.


    As expected, the recorded ratios are well below 1 in most cases, i.e. the AMULT61
    terms found to be more frequent than the BRCULT61 terms, but then more terms were
    included in AMULT61. Our focus must be on the comparison between the various ratios
    which emerged from the investigation.


    If we concentrate on the concentration of AmE vs. BrE in 1961 and 1991/2 first,
    the four columns in the left in Figure 7, it will see that the AmE/Br difference
    was much greater in 1961 than a generation later: The Brown ratio of 0.40 is the
    lowest of the lot, and means that in the corpus the combined frequency of the
    AMULT61 terms is two and a half times that of the BRCULT61 terms; conversely,
    LOB displays the highest ratio of all them, with the rather special exception
    of the San Barbara Corpus. Of the marked difference between Brown and LOB is a
    predictable consequence of the fact that the cultural terms forming the basis
    for this comparison were selected precisely because they were overrepresented
    in Brown and LOB, respectively.'
