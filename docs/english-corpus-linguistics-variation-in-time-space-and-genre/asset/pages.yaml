  md: '# Texturing a responsible corporate identity


    Engagement is further subdivided into four main categories, as shown in figure
    2. Resources for dialogic contraction are classified under the headings of Dis
    and Proclaim. The former grouping includes negation and expressions of counter-expectation,
    while the latter comprises epistemic markers of certainty and expressions of endorsement
    of reported viewpoints. Resources for dialogic expansion are subdivided into the
    categories of Entertain, which includes epistemic markers of doubt and modals
    of possibility, and Attribute, i.e. windings for the neutral acknowledgment or
    the distancing from referred external voices. The fragments reported below exemplify
    these categories. The Engagement system articulates into further subcategories
    that are not considered here. For a more detailed description of the Engagement
    system, see Fryer (this volume) and Martin and White (2005).


