    Examples persistent-situation meaning are not included in this study, as the adverbs
    selected to identify perfect meaning do not occur persistentsituation meaning.
    Past perfect forms (as She had been before), which express actions taking in time
    “anterior to an intermediate time which is anterior to the time of speaking” (Huddleston
    and Pullman 2002: 140), fall out of the scope of this paper, since they both have
    a different form and a different meaning.


    We have used all the spoken and written material available for these varieties
    in the International Corpus of English (ICE). We are aware that native varieties
    of English do not conform absolutely to what is encoded in grammar and therefore
    a study like this needs a reference corpus (cf. Sharma 2001: 347). For this reason
    we analyzed the whole ICE-GB corpus for British English, and used it as a benchmark
    corpus. The sample comprises around five million words: one for each geographical
    variety, with 60% spoken and 40% written material (cf. Greenbaum 1996 for details
    on the composition of the corpus). Table I in the Appendix shows the texts contained
    in the sample.


    We retrieved examples using the AntConc 3.2.1 concordance program, which rendered
    a total of over 15,000 examples of just, ever, never and yet. After filtering
    them we obtained 2,044 examples, which we stored in an SPSS 15.0 database. The
    classification of examples into the different semantic categories relied heavily
    on the linguistic context. However, the semantic categorization was not always
    straightforward and in some cases examples were found. For this reason we coded
    examples separately, compared results and discussed differences in codification.'
