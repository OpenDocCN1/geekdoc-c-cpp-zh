  md: '# Gender, culture and language


    119


    # Ratios HE/SHE in TIME


    ![](img/6910650ad69df72c967df4c631af744d_125_0.png)


    Figure 3. Ratios between HE (*he, him, his*) and SHE (*she, her, hers*) in TIME


    The results for TIME can be seen to follow a very clear and consistent trend:
    The ratio increases by decade from the beginning in the 1920s until it peaks in
    the 1960s, with the sharpest increase recorded in the 1940s. Starting in the 1970s
    the ratio then falls back until it reaches a level in the 2000s which is less
    than half its peak level 40 years earlier. This very marked decrease coincides
    in time with the efforts of the Women’s Liberation movement but obviously reflects
    a much broader cultural shift in American society, and probably Western society
    generally. It is also noteworthy, however, that the ratio actually increased,
    and quite markedly too, from the earliest issues all the way up to the 1960s.
    Some of this increase can be explained by the run-up to the Second World War and
    then the actual war, and the general predominance of warfare. From this point
    of view the first couple of post-war decades emerge as a perhaps surprisingly
    conservative period, at least as far as reported in TIME are concerned.


    We shall turn to the BNC, which contains a variety of spoken as well as written
    language, which further provides detailed information about the texts included.
    In Figure 4 frequencies of HE and SHE are broken down according to the gender
    of the speaker/writer, for spoken and written texts separately.


    As can be seen, both male speakers and male writers produce a lot more masculine
    pronouns than feminine ones. Perhaps more surprisingly, female speakers also produce
    a majority of masculine pronouns, although here the balance is much more even.
    Only female writers are recorded with a majity of feminine pronouns, and even
    here that majority is only a slight one.'
