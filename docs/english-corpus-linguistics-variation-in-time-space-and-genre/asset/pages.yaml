    # 2. Modeling (heterogloss) engagement


    The model used in this study is developed by Martin and White (2005; White

    1998, 2003), based on the social-semiotic theory of systemic-functional grammar

    (e.g. Halliday 1978; Halliday and Matthiessen 2004) and inspired by the work of

    Bakhtin (1981) and Volosinin (1973). Martin and White’s (2005) ENGAGEMENT

    system is part of a wider tripartite system of APPRAISAL, a framework dealing

    t the resources of evaluative language, comprising ATTITUDE, ENGAGEMENT,

    and GRADUATION. Specifically, the ENGAGEMENT system accounts for the

    “locations with which provide the means for the authorial voice to position itself
    with

    respect to, and hence to ‘engage’, with the other voices and argumentative positions

    construed as being in play in the current communicative context” (ibid.: 94).
    For

    t purposes of this study, I focus on the features of what Martin and White

    (2005: 102) term ‘heteroglossic engagement,’ i.e utterances that allow,

    nor in some may challenge other voices or viewpoints in the discourse; do

    not include utterances of a ‘monoglossic’ nature, those in which no other

    reference is made to other voices or viewpoints (ibid.: 98–102).


    By example of, (1), below, is a heteroglossic utterance that constructs

    for the background of alternative propositions. The utterance is “but one

    am number of propositions available in the current communicative context"

    (ibid.: 105), that ‘full-thickness degrees of articular cartilage in the knee
    may

    not progress to osteoarthritis. In contrast, example (2) is monoglossic, a bare

    assertion. It does not invoke argumentative, at least not “for the brief

