  md: '# 92 Xinyue Yao and Peter Collins


    The continuative perfect in (1) expresses a situation prevailing throughout a
    time interval stretching from the past to the present. The experiential perfect
    in (2) expresses one or more situations of a given type are located within an
    up-to-the-present time interval. Unlike (1), the situation is understood to have
    terminated before the present. The resultative perfect in (3) denotes a situation
    which involves a direct present result, and the transition to the result is lexicalized
    in the meaning of the verb *fire*. It is different from (1) and (2) in that the
    speaker''s concern is with the result, as opposed to the internal properties of
    the situation. For some linguists, the differences represent distinct constructions,
    their differences arising from the inherent structural ambiguity of the PP (e.g.
    McCawley 1971; Michaelis 1994; Kiparsky 2002; Aitidrou et al. 2003). For example
    Michaelis (1994:113) comments, “[the PP] form is is polysemous: a single form
    has several meanings.” By the way that words have a single meaning, By contrast,
    other linguists analyze the PP as having a difference between the readings reflected
    in the kind of inference drawn by interlocutors on the semantics of the PP and
    other contextual elements (e.g. Fenn 1987; Klein 1992; Declerk 2006; Nishiyama
    and Koenig 2010).


    Variational studies of the PP, on the other hand, have mainly focused on documenting
    the regional variation in its users. A number of corpus-based studies (e.g. Elsness
    1997, 2009a, 2009b; Hundt and Smith 2009) have found that speakers of contemporary
    British English (BrE) tend to use the PP more frequently than speakers of American
    English (Am). The chief competitor of the PP, it is commonly suggested, the preterite
    tense. In an early study of what he calls ‘colloquial preterite’, Vanneck (1958)
    argues that the distinction between the PP and AmE is beginning to be lost in
    contemporary English. He observes Am speakers use the preterite in less formal,
    spoken contexts (as in (4a) and (5a)) where Bre speakers prefer the PP (as in
    (4b) and (5b)):


    +   (4) a. Did you have lunch already?

    b. Have you had lunch already?


    +   (5) a. You look worried. What happened?

    b. You look worried. What has happened?


    Vanneck''s observation is supported by Elsness (1997) corpus-based study, which
    found that compared to their American counterparts, BrE speakers have a greater
    preference for the PP in a number of contexts (e.g. with adverbials such as already
    and yet, and with temporal quantifiers as always and ever) where both the PP and
    the preterite are accepted as grammatical by native speakers. Elsness was also
    able to show that this British-American difference is not confined to spoken language.
    A more recent study by Hundt and Smith (2009) based on the tagged Brown frequency
    of corpora found that although frequencies of the PP remained stable between the
    early 1960s and the early'
