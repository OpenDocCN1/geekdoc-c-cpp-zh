    The system of Engagement groups together a wide range of lexico-grammatical resources
    that have been studied separately under such headings as evidentiality (Chafe
    and Nichols 1986), hedging (Hyland 1996) and modality (Hoye 1997; Palmer 2001).
    The particular perspective adopted by Appraisal theory over these resources is
    based on the notion of dialogism (Bakhtin 1981), according to which every proposition,
    in 요즘 written texts, references or anticipates the responses of imagined readers.
    Appraisal theory distinguishes between monoglossic and heterogloss propositions.
    The former are bare assertions, as:


    +   (4) SPARSAM low energy bulbs are a great alternative to traditional incandescent
    bulbs.


    where no alternative viewpoint is referenced. Heteroglossic propositions, on the
    other hand, are in which the writer''s engagement with alternative positions is
    explicitly signified by means of epistemic or modal markers. The resources for
    heteroglossic Engagement are broadly subdivided into that act to challenge or
    refine alternative viewpoints – dialogic contraction, and that do open the ‘dialogic
    space’ of the text (Martin and White 2005) to competing perspectives – dialogic
    expansion. This difference is illustrated in (5) and (6):


    +   (5) BP''s code of conduct and values demonstrate our commitment to integrity,
    ethical values and legal compliance. (Contract)


    +   (6) We''ve reviewed more than 20 technologies, some of which may become significant
    in the future. (Expand)


    Although both propositions are heterogloss, example (5) finds potentially disagreeing
    arguments by means of the verb demonstrate, whereas the modal may in example (6)
    frames the proposition as an hypothesis and thus exposed to dialogic confrontation.


