    The intravarietal differences between the spoken and written modes are all statistically
    significant, as are the differences between spoken Asian and spoken British English.
    However, the difference observed between the two written varieties, that is, written
    Asian and written English, is not statistically significant at the 5% level. Figure
    2 shows the proximity between written ASEs and spoken BrE. In contrast, spoken
    ASEs and written BrE represent the two extremes of a continuum of the number of
    variants used to express meaning with *just, never and yet*. One factor comes
    to mind when observing the similarity between written English and spoken BrE:
    that the input language for the emerging varieties is a spoken variety of (early)
    English (Mesthrie 2008; Mesthrie and Bhatt 2000). In other words, the trends detected
    today could be present in the only variety in contact with the substrate at colonization
    period, and these would have diffused to the Asian varieties and be perpetuated
    in written discourse (Schneider 2000: 211). Spoken Asian English, on the other
    hand, would drift away from this form.


    It is important to bear in mind that the spoken language is generally considered
    the most vernacular type of language as well as the locus for most changes in
    grammar (Miller 2006: 679, 689). For this reason, finding a higher number of variants
    (both type and kind) in this mode is expected. However, such variants can either
    performance and/or transcription errors (e.g. examples (11)-(13)) or established
    forms resulting from strategies of simplification (e.g. base form, (7)) typical
    of New English (Schneider 2007: 82), which may constitute potential changes in
    the language (Miller 2006: 689). As already mentioned, even though speakers in
    the corpus were educated through the medium of English, there are different ranges
    in their level of proficiency, which could be problematic for the analysis of
    spoken data; this problem is partly avoided in written material (Sharma 2001:
    349), and variants found in written language will probably be those who have undergone
