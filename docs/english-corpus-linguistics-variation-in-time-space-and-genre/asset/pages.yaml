    French gramarian Mason (1622) transcribes *how* as *haow*, which certainly suggests
    a pronunciation not far from our own. Diphthongs are always difficult to analyse
    exactly.


    Some of the spellings listed in Table 1 may still seem unremarkable at first glance.
    These are: <thowand> THOMAS ''the will of Sir John Dauntsye'' (Towbridge, Wiltshire
    Record Office, D1/2/5), dated 1390 and localised to Wiltshire by Michael Benskin
    (personal communication); <clow> On kl ''cloth'', <ow> OUT, <mow/<moth> MOUTH,
    and a range of similar spellings found in a collection of medical recipes which
    has been dated to c. 1320-1330, and which has been localised to Ely/West Norfolk
    (Hunt and Benskin 2001). Another similar spelling, <towen> TOWN, is found in LAEME,
    in the source text for the East Riding of Yorkshire and to the first part of the
    fourteenth century. Their value evidence lies in the fact that they appear to
    indicate a bicoric (or perhaps trimonic) nucleus; otherwise it is difficult to
    account for the unmetymical <| or <e the after. The above-listed spellings from
    Hunt and Benskin (2001) are, however, dismissed as ''decisively analogical spellings''
    (Hunt and Benskin 2001: 202) based on the fact that NOT < OE nath had developed
    new monosyllabic forms besides their disyllabic forms. The analogy that could
    not be spelled <nowit> and <nout> as well as <nout>, then OUT, traditionally spelled
    <out> or <out>, could also be spelled <owit> or <out>. This may be of course the
    rationale behind the many <owit(h> etc for me in the texts, but certainly seems
    possible that they might indicate a diphthong, since <nit> for not hardly implies
    <nit>(t) (with hiatus and [a:] < OE ā). If this is permitted, diphthongisation
    of the reflex m is indicated in Ely/West Norfolk as after 1320–30.'
