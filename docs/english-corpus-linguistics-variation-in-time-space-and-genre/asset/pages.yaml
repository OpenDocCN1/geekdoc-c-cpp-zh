    (9) LOCRA MED Total cholesterol levels were measured by using enzymatic reaction
    with peroxidase-phenol-4-aminophenazone indicator reaction.


    Next to these verbs a large number of verbs that, out of context, are not obviously
    relevant to EGAP and whose discourse functions are, as a result, unclear (e.g.
    act, carry, make, play, see or take). Interestingly, many of these verbs are high-frequency
    verbs that needed to be considered in context before deciding whether they work
    in this study. The results show that they are highly polysemous and have numerous
    academic uses in addition to the types typical of the reference course of fiction.


    This shows the downside of taking single words into account as the meaning and
    function of such polysemous verbs are best determined by the company they keep
    (cf. Sinclair 2004). It seems important to present these verbs in context, rather
    than simply listing them, as they are often used in delexicalized constructions
    or phrasal verbs (examples 10 to 12).


    +   (10) LOCRA BUS The results make an important contribution demonstrating how
    leaders gather information to make attributes.


    +   (11) LOCRA LING The study of reading strategies has been seen as a way of
    gaining insight into the nature of reading processes.


    +   (12) LOCRA MED Laparotomy was carried out on anesthetized TCRKO mice (24 weeks
    of age) to confirm the presence of severe colitis.


    Such a list of patterns of use will be considerably more useful to learners as
    it is mainly the use of academic verbs in context that poses a problem (Granger
    and Paquet 2009b). That is why it is essential to carry out further analyses in
    order to better determine how these verbs are used in academic English. The results
    of these analyses will enable us to draw a list of EGAP verb patterns and better
    distinguish the EGAP uses from those that are discipline-specific.


    In addition to identifying the EGAP collocational preferences of these academic
    verbs, these analyses will also enable the identification of the lexico-grammatical
    preferences of these verbs. A pilot-study of the high-frequency verbs in LOCRA
    has shown that the verb find, shares, in addition to the object supports, correlation
    or difference, a number of lexico-grammatical patterns across disciplines, as
    the passive structure ‘BE found to be’, as illustrated in examples 13 to 15 (Schutz
    2012).


    +   (13) LOCRA BUS Heterogeneity in the tenure of the TMT was found to be positively
    related to firm performance, strategic change, and the degree of international
    diversification.


    +   (14) LOCRA LING These two types of metaphors were found to be interspersed
    in their entire talk and discourse.'
