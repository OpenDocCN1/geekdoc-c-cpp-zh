  md: 'Discourse communities and their writing styles


    33


    The conflict between the requirement of discourse communities have common mechanisms
    of intercommunication and Boyle’s deviating writing styles will be solved with
    Hyland’s (2009) concept of authorial identity. Among the publications of two prominent
    allied linguist, Debbie Cameron and John Swales, he found remarkable differences
    between their writing styles. They differ in their use of the most frequent words,
    in their keywords, and in their multicluster clusters. Along the closed items,
    as is it figure prominently in the Cameron corpus, whereas I and my are high frequency
    items in the Swales corpus. On the basis of their writing Hyland convincingly
    established the authorial identities of the two linguists, namely “an assertive
    and combative identity” in the case of Debbie Cameron, and “an identity as a curious
    fellow professional” in the case of John Swales (Hyland 2009:50). Creating an
    authorial identity using the resources shared by the discourse community, exploiting
    them in an individual way. Hyland noted that this was first of all an option for
    the established figures in a discipline, whereas its novices were well advised
    to follow their discursive practices closely “to achieve credibility as readers
    and reputations as individuals” (Hyland 2009: 27).


    In this paper I will argue that Boyle used his position as a leading figure of
    seventeenth century science (cf. Hall 1965: 110-115) and as a recognised expert
    in contemporary medicine (cf. Hunter 1997: 326-330) to create an authorial identity
    for himself who allowed him to deviate from the discursive practices of both disciplines.
    The main features of Boyle’s authorial identity are his devotion to experiments
    and his love of precision. This characterization, which is solely based on the
    analysis of the linguistic properties of Boyle’s tests is perfectly in line with
    the conclusion arrived at by John Harwood (1994: 42) in his article about Boyle’s
    rhetoric: “by systematically cultivating a persona that included the attributes
    of ‘gentleman’, ‘layman’, and ‘virtuoso’, he [= Boyle] could justify his writing
    on theological topics (though not a divine) and on medical subjects (though not
    a physician)”.


    The last issue to be addressed is the relation between Boyle’s writing styles
    and those of 18th century representatives of the discursive science and medicine.
    This comparison was prompted by Boyle’s influence on 18th century science (Hall
    1965) and medicine (Kaplan 1993). The hypothesis to be tested is that Boyle anticipated
    aspects of the writing styles practiced in the discourse communities of 18th century
    science and medicine.


    In section 2, I will describe the data and the research method used in this paper.
    The main part (section 3) will cover the analysis of my data and a discussion
    of the results: a synchronous comparison of a set of Boyle’s medical and science
    texts with other 17th century medical experts and leading scientists (section
    3.1), a diachronic comparison of 17th and 18th century science including Boyle’s
    (section 3.2), and a diachronic comparison of 18th century medical texts including
    Boyle’s (section 3.3). In the last part (section 4) I will summarize the main
    findings of the study and draw some conclusions.'
