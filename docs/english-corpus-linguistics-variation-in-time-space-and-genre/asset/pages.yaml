  md: '# 178 Cristina Suárez-Gómez & Elena Seoane


    and Suárez-Gómez forthcoming. Nevertheless, our comparative analysis shows that,
    despite their external histories, the Asian varieties reinforce Schneider''s (2007)
    holistic approach and a number of traits, as the fact that choice of the form
    is determined by the adverb and the meaning expressed. Our corpus data show that
    in all varieties i) the perfect of recent past (with just) is only a minority
    construction, ii) the experiential perfect (with ever and never) is in strong
    competition with the simple past, and iii) the perfect construction is dominant
    – though not exclusively – only for the expression of resultative meaning with
    yet.


    Finally, together with mode, text type also seems to influence the variation along
    parameters such as degree of involvement and elaboration, although this issue
    calls for a multidimensional analysis which takes these and other parameters into
    consideration.


