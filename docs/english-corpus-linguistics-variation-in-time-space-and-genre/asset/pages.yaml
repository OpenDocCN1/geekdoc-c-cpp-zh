    Fairclough (2003) stresses the important role played by (epistemic) modality choices,
    the display of varying degrees of assertiveness or tentativeness in discourse,
    the process of identity construction. According to the author, “[m]odality is
    important in the texturing of identities, both personal (‘personalities’) and
    social, in the sense that what you commit yourself is a significant part of what
    you are” (Fairclough 2003:166). In discussion of the implications of modality
    for the construction of discursive identities, the author looks at the case of
    predictions. He argues that true claims about the future are a salient feature
    of the discourse of management gurus, politicians and governments. According to
    the author, these social groups “identify themselves in part through exerting
    [the] power of prediction” (Fairclough 2017:167). Surprisingly, predictions like
    those reported above tend to concentrate in the subsections where the Group Chief
    Executive is directly quoted as expert and strategic leader (34–35). In this perspective,
    the frequent technical forecasts in the BP report can be seen as an attempt to
    establish and assert the company’s authority on matters related to the future
    of the energy industry which, in turn, can translate into influence and control
    over making processes. A case in point is the controversy surrounding the exploitation
    of Canada’s oil sands, which been widely criticised for its severe environmental
    impact. When confronted with this issue, BP’s GCE reacts as follows:


    (37) Does the world need oil from the oil sands? We estimate that demand for energy
