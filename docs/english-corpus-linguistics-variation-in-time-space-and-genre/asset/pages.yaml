  md: 'New developments in corpus linguistics


    relationships with their readers. Fuoli analyses the linguistic resources connected
    with the ATTITUDE system, i.e. the resources for the expression of emotional dispositions,
    ethical judgements and evaluations, and the ENGAGEMENT system, i.e. the resources
    by which language users negotiate the arguability of their propositions. He shows
    that the interpersonal resources used by BP and IKEA differ, in BP portrays itself
    as a reliable and authoritative expert, seeking a detached pragmatic relationship
    with the reader and emphasizing the technological, to-be-trusted expertise, whereas
    IKEA comes as a caring and progressive company, seeking to align themselves with
    the readers in terms of shared values such as commitment, humility and transparency.


    The contribution of Natassia Schütz deals with Academic Purposes (EAP), a field
    in which vocabulary teaching has been the subject of much debate. The core of
    this debate is the question of whether teaching should be focused on general academic
    vocabulary (EGAP) or on vocabulary specific to each discipline (ESAP). In order
    to inform this choice, the paper evaluates the weight of EGAP and ESAP verbs in
    EAP. Schutz uses the Leuven Corpus of Research Articles (LORCA) and investigates
    the inventory of verbs in the disciplines of business, linguistics and medicine.
    In so, she employs two different vocabulary extraction methods, namely the statistically
    based keyness approach and a traditional analysis of relative frequency, as well
    as a combination of the two. The study is methodologically significant in that
    it illustrates the complementarity of the keyness analysis and the analysis of
    relative frequency, which retrieves a number of high-frequency verbs that also
    have typical EGAP uses that as a consequence account, as the meaning and function
    of polysemous verbs “are best determined by the company they keep (cf. Sinclair
    2004)”. The study shows that general verbs carry more weight than the discipline-specific
    ones and adds support to a general approach to academic vocabulary teaching, as
    the potential EGAP verbs represent a considerable proportion of EAP verbs across
    the three disciplines investigated.


    The editors would like to thank the contributors for respecting deadlines, for
    carefully considering and incorporating the comments of the reviewers in their
    articles, and for responding promptly to questions and requests from the editors.
    We are also very grateful to the reviewers, whose relevant comments enabled the
    authors to improve their articles.'
