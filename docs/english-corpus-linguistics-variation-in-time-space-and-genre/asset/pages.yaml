  md: 'What I did was call the police and I called the police, pairs such as The only
    thing I did was call the police and I called the police are fully equivalent in
    terms of truth value. However, they are comparable in their discourse function
    and in their impact on the information structure of the utterance. What is more,
    the “loose” variants of the construction (examples (3d) and (3e)) pre-date the
    core pseudo-clefts by around two centuries in terms of historical origin (Taugrott
    2008). This is, of course, a powerful argument for including them in a diachronic
    study such as this one.


    What we be concerned with in section 3 below the status of (3c) and (3f), which
    are almost exclusively attested in contemporary spoken data (and here hence absent
    from even such a resource as the Corpus of Historical American English (COHA).
    The existence of this option is recognised in Huddleston and Pullum (2002: 1422,
    n. 32), who point out “it is possible, in relatively informal style, for the value
    phrase to be a declarative clause: What they did they threw out and locked the
    door.” One explanation for the absence of this construction from written and formal
    styles (and its near absence from reference grammars of contemporary English)
    is that it might be a genuine innovation, originating in spontaneous speech, has
    not yet made it into or formal registers. Alternatively, it may not be a new construction
    at all, but a construction of old standing in the spoken language, being considered
    anachronistic, has not registered in our predominantly written and formal record
    of the English language. To answer this question, we can look at authentic speech
    pre-dating DCPSE, in the hope that there is sufficient data to help us trace the
    history of this construction in the first half of the 20th century. Beyond that
    time, we shall have to rely on speech-based genres. If the speech-like material
    from past ages provides continuous positive evidence for the use of the construction,
    we can take its existence in the spoken language for granted. If the evidence
    remains discontinuous or scant, the situation is more complex. Either the construction
    is really of recent historical origin, or it is among those which tend to be normalised
    and standardised automatically as part of the writing routine even in speech-based
    genres.


    As even this simple example chosen for illustration purposes like squaring the
    circle; it is impossible to meet the conflicting requirements of total authenticity
    (real speech speech-based writing) and time-depth (continuous coverage of the
    three or four centuries usually required for major syntactic changes to unfold
    rather the onehundred year window opened up by sound recording). Ideally, we would
    like:


