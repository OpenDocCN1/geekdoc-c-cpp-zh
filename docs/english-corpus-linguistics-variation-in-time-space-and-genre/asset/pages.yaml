    (albeit imaginary ones), while many non-fictional texts are more concerned with
    events in the public domain. Apparently, equality between the sexes has advanced
    further in the former than in the latter.


    It might have been expected that the Spoken section of COCA would similarly displayed
    a more equal gender distribution. That can be seen not to be the case. We need
    to bear in mind, however, that the Spoken category of COCA is a rather special
    one, that it is made up of texts from precisely the public domain – recordings
    from radio and television – which in this respect can be assumed to differ quite
    markedly from the typical use of spoken language in more private settings.


