    Besides the clear trend towards greater gender equality over time, a general tendency
    underlying these results seems to be that language representing everyday situations,
    which may be an apt description of fictional writing, displays the most even gender
    distribution. An intriguing question behind all our comparisons, and one which
    cannot easily be answered in a corpus investigation, is to what extent the recorded
    figures reflect real differences between the societies depicted: Do the societies
    differ, or merely the reporting of those societies in the texts examined? An additional
    problem for a corpus investigation is of course to what extent each corpus is
    representative of the kind of language it purports to represent, since even small
    differences in composition can have an unwanted, and uncontrollable, impact on
    any comparison across corpora.


    With these reservations in mind, we shall take a quick look at the HE/SHE ratios
    recorded in COCA and TIME. Both these corpora make it possible to trace any change
    over time.


