  md: '# Verb complementation in South Asian English(es): The range

    of frequency of “new” ditransitives


    Christopher Koch and Tobias Bernaisch


    Justus Liebig University Giessen


    # Abstract


    Resorting to the South Asian Varieties of English (SAVE) corpus comprising alectical

    English language data from Bangladesh, India, the Maldives, Nepal, Pakistan and
    Sri

    t present paper investigates verb complementation in the six respective South

    Asian varieties of English. The lexicographical focus is on “new” ditransitives

    (Hoffmann and Mukherjee 2007), verbs which are attested in the ditransitive

    construction in New English, but not in the present-day version of their historical
    input

    variety British English (e.g. to get him a dream). The study provides the first
    systematic

    analysis of “new” ditransitives (NDTs) across various South Asian English with

    frequency-oriented perspectives on their range and in newspaper language and

    the occurrence in variety-specific text material accessed via the Google Advanced

    Search Tool. In conjunction with in-depth analyses of selected NDTs each of the
    South Asian English

    NDTs are productive structural phenomena in each of the South Asian Englishes

    concern, although there are clear differences in their variety-specific frequency
    of

    occurrence.


    # 1. Introduction


    The caption “South Asian English” to refer to the collection of individual

    “South Asian Englishes” has repeatedly been subject to debate due to its implicit

    postulation of the South Asian Sprachraum as a homogenous entity in relation to

