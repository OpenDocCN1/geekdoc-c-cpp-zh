    # Tapered Sounds


    Tapered sounds can be defined as sounds that begin at one end of the volume scale
    and slowly rise (or fall) to the other end. For example, a rising tapered sound
    would begin quietly and gradually attain full volume. However, it doesn''t fall
    back to minimum volume, as does a soft sound. It remains at that high volume level.


    The simplest way to program a tapered sound is to use the volume control register,
    as you did when you created sounds. Although you can create tapered sounds using
    the attack, decay, and release registers, it becomes difficult at times, especially
    when you''re dealing with falling tapered sounds. You can produce a tapered sound
    by setting the attack and decay to a slow rate, then setting the level to a fast
    rate, but coordinating all three may be very complicated. It''s almost impossible
    to produce a falling tapered sound without some use of the volume control register.
    And no matter how hard you try, the sounds may not be just right. We''ll stick
    with the volume control register in the examples, to keep things as simple as
    possible.'
