  md: '# 2

    Music and the Sound Editor


    # Using the Editor


    When you first run the Sound Editor, there will be a short pause while the program
    initializes itself and sets up the arrays for the sound and graphics it uses.
    When the program has finished initializing, it displays a screen that is divided
    into two parts. The upper half of the screen looks a great deal like Table 2-2,
    where you wrote down the POKE values of various notes, the note length values,
    and the pause length values. The lower half of the screen shows two rows of keys.
    The top row displays the keys 1–7 (near the top left corner of the keyboard),
    and the lower row contains the keys Q–U (directly below the previous row).


    Notes of the scale. The notes of the scale are labeled above the keys. The top
    row is one octave lower than the bottom row. To show the difference between the
    two octaves, the higher keys (bottom row) are preceded by an up arrow (!). These
    arrows also appear in the table in the upper half of the screen as you enter notes
    so you''ll be able to determine what notes are being played. To hear a note play,
    press the corresponding key.


    Using the table. The table in the program is essentially the same table you used
    when you were writing the different values by hand. The biggest difference is
    that each of the values in this table is entered automatically each time you press
    a key on the musical keyboard. To help you use the table more effectively, let''s
    review each of the function headings.


    NOTE. When the program is first turned on, the NOTE is highlighted. This indicates
    that the computer is waiting for you to enter a note from the keyboard. This column
    will display the notes that you enter, and specify which octave it is using and
    the number of the entry. The entry numbers begin with 0. You can only enter a
    maximum of 99 notes.


    LOWER/UPPER. These columns show the actual POKE values entered into the pitch
    control registers. Press the 1 key, which represents a C note. You''ll see the
    values 195 and 16 listed in the LOWER and UPPER columns. By using this editor,
    you can avoid having to look up the POKE values for each note you want to play.


    LEN. The LEN column displays the length of the note being played. The value displayed
    in this column is the value


    59'
