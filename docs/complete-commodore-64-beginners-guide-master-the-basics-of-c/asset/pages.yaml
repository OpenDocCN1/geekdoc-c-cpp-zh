  md: '# SID: The Sound Interface Device


    Keep in mind that sustain refers only to a volume level, not to a function of
    time, as the other elements of a sound’s ADSR do. That’s why you need something
    like a delay loop in your routines; it’s the simplest way to control the time
    of the sustain-part of note.


    Turning the gate off is the last thing you''ll do in most of your sound routines.
    Once the note has played—having gone through its attack, decay, sustain, and release
    steps—you need to turn the gate off by POKEing the waveform control register with
    a value one less than when you selected the waveform and turned the gate off.
    If earlier POKEd location 54276 with 65 (to turn on the pulse waveform generator
    and enable the gate bit), now you''d POKE the same location with 64. This will
    turn off the gate, ending the sustain and bringing in the release section of the
    note’s envelope. As soon as the release finishes, the sound is completed.


    Once you understand the process you need to go through create sounds with the
    SID chip, you''re ready to produce your first note. Here’s a route that clears
    the sound control registers; sets the volume, ADSR, frequency, and waveform for
    note; enables the gate bit; keeps the note playing; and turns the gate bit off.
    It''s simple, but it’s a start.


    # Program 1-1. Simple Sound


    For mistake-proof program entry, be sure to read “Automatic Proofreader,” Appendix
    C.


    ```

    10 REM --- CLEAR SOUND REGISTERS --- :rem 251

    20 FOR R=54276 TO 54296:POKE,0:NEXT :rem 255

    30 REM - TURN ON VOLUME - :rem 95

    40 POKE 54296,15 :rem 47

    50 REM - INITIALIZE SPECIAL REGISTERS - :rem 78

    60 POKE 54277,0:POKE 54278,240:POKE 54275,8:rem 3

    70 REM - POKE TONE VALUES INTO VOICE 1 :rem 142

    80 POKE 54272,48:POKE 54273,28 :rem 55

    90 REM - ENABLE TONE REGISTER - :rem 233

    100 POKE 54275,65 :rem 95

    110 REM - PLAY TONE FOR 1 SECOND :rem 16

    120 FOR R=0 TO 1008:NEXT :rem 22

    130 REM - TURN SOUND REGISTER OFF :rem 228

    140 POKE 54276,64 :rem 98

    150 REM - TURN VOLUME OFF :rem 208

    160 POKE 54296,0 :rem 44

    ```'
  merge: -1
