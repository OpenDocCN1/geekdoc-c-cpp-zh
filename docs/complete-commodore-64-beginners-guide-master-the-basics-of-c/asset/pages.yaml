- img_proc: true
  md: '# CHAPTER


    # 5

    Putting It All Together


    By now you know how to create sounds and music on the Commodore 64. You''ve seen
    how simple sounds are made, how to create the exact effect you want, and even
    how to use the more advanced functions of the SID chip such as filtering, ring
    modulation, and synchronization. Along with the sound editors in Chapter 2, these
    techniques allow you to produce almost any sound or musical piece you can imagine.


    Unfortunately, there''s not much you can do with sound effects alone. Sure, they''re
    fun to create and listen to, but that''s probably not the reason why you wanted
    to learn to create sounds on your 64. Most programmers use sound, not as an end
    in itself, but as an integral part of larger programs. If you''ve used any commercial
    software, or typed in programs and games from magazines, you know how important
    sound is. Many times it''s not only an enhancement, it''s a vital part of the
    program. Sound provides the program with information, feedback, and entertainment.
    Without it, the program would seem dull. That''s especially true of game programs.
    Try playing your favorite arcade game with the sound turned off and you''ll see
    what I mean.


    You need a way (or preferably several ways) to add your sound effects and music
    to other, longer programs. It''s not just a matter of sticking them in the program
    wherever they seem to fit. To successfully insert sound and music routines in
    other programs, there are a number of things you need to know and keep in mind.
    That''s what this chapter will try to show you.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 5 Putting All Together


    Combinations and DATA

    This chapter explains several ways of combining sound with other programs on your
    Commodore 64. Most of the time you''ll want to put sound together with graphics,
    the pictures create on the screen. We''ll concentrate on mixing sound and graphics
    for that reason.


    We''ll cover several methods of combining sound with graphics. That will work
    best combining the two elements is often governed by the particular effect you''re
    trying to produce. Having a method available for several different situations
    will give you a wider variety to choose from when you begin to mix your sounds
    with your pictures.


    In addition to combining sound with graphics, you''ll also see how to enhance
    the sound editors in Chapter 2. By using a special DATA-making program, you''ll
    be able to convert the music produced by the editors into DATA statements that
    you can include in BASIC programs.


    Finally, we''ll use all to create a simple videogame that uses many of these techniques
    to show you a practical application of what you''ve read. By the time you''re
    finished with this chapter, you''ll be able to mix sounds and graphics with ease.


    # Mixing Sound and Graphics


    There are two major kinds of sounds that you''ll want to combine with pictures
    on the Commodore 64. These are:


    +   - Sounds produced as needed

    - Sounds produced all the time


    The reason to make this distinction is that the nature of the actual sound is
    generally not as important as when you want the sound played. For example, sounds
    that are produced all the time must be interwoven into the structure of the program;
    however, sounds that are needed intermittently can simply be played at the proper
    moment by inserting the routine (often called a subroutine) to play the sound
    and then returning to the program.


    # Sounds Produced as Needed


    Since sounds that interrupt the program as needed are generally easier to program,
    we''ll cover them first. These sounds are not heard the time, but are produced
    in


    162'
