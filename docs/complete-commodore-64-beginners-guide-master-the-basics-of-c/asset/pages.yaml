- img_proc: true
  md: '# Putting It All Together


    # Using What You''ve Learned


    Your Commodore 64 is important to you. If it wasn''t, you probably wouldn''t have
    bought it. You enjoy games on it and for home applications. It may even be an
    educational tool. But if you''re like many 64 users, you enjoy programming on
    it most of all.


    Now you''ve got another tool to use—sound and music. You''ve seen how simple sounds
    can be created, how sound editors can help you produce more elaborate sound effects,
    and even how to use some of the advanced functions of the SID chip.


    But you''re probably just beginning to use sound and music on your 64. Getting
    comfortable with this new tool takes time, and especially practice. Just like
    any other skill, you''ll get better as you spend time programming sound and music
    on your computer. But there are some things you can do that may help.


    Look at other programs published in magazines or books and if you can find how
    the programmer used sound and music. Oftentimes, someone else will think of a
    way to create or use sound that you haven''t thought of. On the other hand, you
    may look at a published program and wonder why the programmer used such an inefficient
    technique. Change the sound and music you see in other programs and see what effects
    you can create. You may end up with a better program or game than was originally
    published.


    Don''t be afraid to experiment. As long as you have a copy of your program on
    tape or disk, you can''t lose anything in trying. You may find an interesting
    sound by accident.


    Above all, listen to other programs and games, especially commercial software.
    You probably can''t change anything, but it may give you ideas of ways to use
    sound and music that you or I''ve considered.


    Sound is an important aspect of our lives that we often take for granted. It''s
    something like that in computer programming, too. Sound and music are sometimes
    secondary to other programming skills. It doesn''t have to be like that. With
    this book, the knowledge you now have, and your own imagination, you can make
    sound an important and impressive part of any program.


    202'
