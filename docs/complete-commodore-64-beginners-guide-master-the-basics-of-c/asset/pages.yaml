    This program uses a number of DATA statements containing the tone values for a
    musical scale. Each time a tone is to be played, a pair of values is READ from
    the DATA statements. These are the values used to POKE into the registers at locations
    54272 and 54273. Notice that there are an even number of values in the DATA statements
    beginning in line 180. If you group the numbers in pairs, you will see that the
