    # Soft Sounds


    While hard sounds are those that begin and end abruptly, soft sounds are those
    that rise slowly to their maximum volume, fall slowly to the sustain volume level,
    and then decrease gradually from the sustain level to minimum volume. In other
    words, the sound''s attack, decay, and release are set to high values, and thus
    slower rates. Illustrated, a soft sound might look like Figure 3-5.


