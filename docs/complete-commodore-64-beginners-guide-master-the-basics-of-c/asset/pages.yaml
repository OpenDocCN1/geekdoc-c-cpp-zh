- img_proc: true
  md: '# 1

    SID: The Sound Interface Device


    Let’s go through this short routine line by line to see how the sound is produced.
    Line 20 clears the 24 sound control registers, using a FOR-NEXT loop to POKE register
    with 0. The volume is turned on in line 40 and is set to its maximum value, 15.
    Line 60 initializes the ADSR registers, as well as the pulse width register. Attack
    and decay are both set to 0, indicating the fastest possible rate, by POKEing
    location 54276 with 0. By POKEing 240 into location 54278, you’re signaling the
    computer to use a high sustain level, and a low release rate. The sound will continue
    after the decay at a high volume, but will end quickly. Because you’re using the
    pulse waveform in runtime, you also need to set the pulse width register (location
    54275) for the address of voice 1, locations 54272 and 54273 in line 80. By looking
    at Table 1-3, you can see that these values will create an An in the fifth octave.
    Line 100 turns on the gate (by setting bit 0 to 1) and selects the waveform (setting
    bit 6). The value POKEd into this location is the total of these two bits’ values
    (1+6). See Table 1-1 for the bits set for these registers. A short delay loop
    keeps the note playing in line 120, and then the gate is disabled in line 140.
    The volume register is turned off in line 160 by POKEing 0 value into it.


    Don’t be discouraged if some of this is confusing to you. Although it may seem
    complicated, you’ll soon see how it fits together. But it’s nice to have a created
    sound, even if you’re not sure how it was done. It’s relatively simple to modify
    various registers to change the sound. For instance, by changing the values in
    the upper and/or lower pitch registers (54272 and 54273), you can change the tone
    played. Program 1-2 does.


    # Program 1-2. Modifying Upper/Lower Tones


    For mistake-proof program entry, be sure to read “Automatic Proofreader., Appendix
    C.


    ```

    10 REM --- CLEAR SOUND REGISTERS --- :rem 251

    20 REM FOR R=54272 TO 54296:POKER,0:NEXT :rem 25

    30 REM --- TURN ON VOLUME --- :rem 95

    40 POKE 54296,15 :rem 47

    50 REM --- INITIALIZE REGISTERS --- :rem 78

    60 POKE 54275,8:POKE 54277,0:POKE 54278,24 :rem 3

    70 REM --- GET TONE FROM TABLE --

    75 READ L,H: IF L=999 THEN RESTORE: GOTO 75 :rem 119

    ```


