    # Putting It All Together


    Now that you''ve seen how to program even the more advanced functions of the Commodore
    64''s SID chip, what can you do with them? How can you use the sound capabilities
    in your own programs, especially in the games you''d like to write? After all,
    that''s one of the pleasures of creating sound and music on the 64: using it to
    add a professional touch to your own programs and games. For some people, creating
    sound is its own reward, but for most of us, it''s only one portion of our programming
    techniques.


    How can you add sound to other programs? It''s not that difficult once you know
    how to create the sound routines and effects. It''s only a matter of making the
    pieces fit. Chapter 5 shows you how to put it all together.'
