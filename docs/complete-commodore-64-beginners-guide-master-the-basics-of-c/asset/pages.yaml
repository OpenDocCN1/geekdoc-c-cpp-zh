  md: '# Putting It All Together


    Once the music DATA, the sound registers, and the title screen are established,
    the program begins putting characters on the screen and playing notes. Storing
    characters in an array allows you to use a single line to print the various letters
    and symbols on the screen. Line 370 does this. As each character is played on
    the screen, the appropriate note plays. Lines 380–410 play the notes, using the
    values obtained from the DATA statements near the top of the program. Line 360
    actually READS the DATA, while line 380 POKES the upper and lower pitch values
    into the register.


    This program''s loops are similar to those in Program 5-7 in that the sound and
    picture are alternately updated to give the impression of happening simultaneously.


    Nonsynchronized music produces more casual effect than synchronized music. The
    idea is to produce a picture that runs at a rate which appears to be unrelated
    to the music. Since music is generally rhythmic, it will require a continuous
    clock while the program is running, it''s possible to use the same clock to trigger
    events on the screen. By doing this, it might seem that the sound and picture
    could be synchronized. However, by running the clock at a very fast rate and triggering
    at different times, the picture and sound can appear to be running at unrelated
    rates. Type in RUN Program 5-9 to hear and see this nonsynchronization.


