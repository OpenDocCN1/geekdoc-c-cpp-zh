    location can hold 255. To calculate the value for frequency available through
    the SID chip (0–3995 hertz) and split it into the two values you can use, RUN
    this short routine. Enter a frequency from 0 to 3995, and the upper (U) and lower
    (L) pitch values will display on the screen. The note will play, using the sawtooth
    waveform, until you press any key.


    # Program 4-1. Frequency Calculation


    ```

