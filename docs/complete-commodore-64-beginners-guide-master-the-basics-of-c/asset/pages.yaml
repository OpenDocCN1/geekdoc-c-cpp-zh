    # Additive Synthesis


    Creating relatively simple sound effects by using one voice or by switching rapidly
    between two voices is just one method of creating sounds on the Commodore 64.
    You have other techniques that can create some amazing sounds quite different
    from what you''ve heard so far. One such technique is called additive synthesis.


    Additive synthesis, although probably a new term to you, is really very simple.
    It takes sounds, usually produced by two voices on the 64, and brings them together
    to form a totally new sound. It adds sounds to create a unique synthesis'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# 4


    # Advanced Functions


    of the two. Both ring modulation and synchronization on the Commodore 64 are examples
    of additive synthesis.


    **Ring modulation.** Ring modulation is a form of additive synthesis that significantly
    changes the tone quality of two sounds. Sounds created with ring modulation do
    not retain their original pitches. Instead, the sums and remainders of the two
    frequencies are kept. For example, if the first sound vibrates at 500 vibrations
    per second (vps) and the second vibrates at 300 vps, then the ring modulated tone
    is a combination of the sum (800 vps) and the difference (200 vps). It would be
    a sound whose tone vibrates at 1000 vps.


    Most of the time, ring-modulated sounds are very different from the original tones.
    In fact, ring modulation can create some of the most interesting and unusual sounds
    possible on your computer. To use ring modulation on the 64, you have to set bit
    2 of the waveform control register (refer to Figure 4-3 for an illustration of
    one of the three registers), at the same time enabling the triangle waveform.
    To do this, just add 4 (bit 2''s value) to the value you''d normally POKE to turn
    on the gate bit and enable the triangle waveform. In other words, you''d POKE
    location 54276 with 21 for voice 1 (for the gate bit, 4 for ring modulation, and
    16 for the triangle waveform). Next, you have to select a frequency for voice
    3 by POKEing into number one of the two pitch control registers. That''s all you
    have to do with voice 3; you don''t have to set voice 3''s waveform, ADSR, or
    any other parameters.


    The effect of ring modulation is most apparent when the tones are mixed as they
    sweep the scales. You can do this in one of three ways. The first way, shown in
    Program 4-8, selects a frequency for the triangle waveform and sets the pitch
    registers to that frequency. Then voice 3''s frequency is rapidly changed by sweeping
    the possible values in the high pitch control register.


    # Program 4-8. Ring Modulation—Sweeping Voice 3


    For mistake-proof proof engine, be sure to read "Automatic Proofreader," Appendix
    C.


