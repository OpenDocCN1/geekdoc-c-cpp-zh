  md: '# 2

    Music and the Sound Editor


    # Figure 2-2. Flat Key Positions


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_89_0.png)


    SAVE music. To save a song that you have written on the sound editor, press the
    f3 key. You will then be asked if you wish to store the song on tape or disk.
    To save the song on tape, press T and hit RETURN. To store it on disk, press D,
    then press RETURN. The program will then ask you for the name you wish to store
    the song as. The name must be less than 16 characters long.


    After the song has been stored, the computer will return to the edit screen and
    will be ready to accept a new song.


    LOADING. To load a song that you have previously saved to disk or tape, press
    the f5 key. This will display a screen that is similar to the SAVE screen. By
    following the directions, you will be able to load a song from either disk or
    tape. After the tape or disk drive begins to run, the edit screen will reappear,
    and the stored notes will be played and displayed on the screen as they are read
    into memory.


    A few hints. If you are entering a large number of notes with the sound editor,
    there will be times when the last key you pressed will stay highlighted. If you
    press any of the note keys, or even one of the function keys, nothing will happen.
    The computer hasn''t locked up. There''s nothing wrong. The program is just taking
    some time to place all the values you''ve entered into the computer''s memory.
    Wait patiently for the highlighted key to return to its normal display. Then you
    can continue to add more notes, or play the song, or save it to tape or disk.
    If you press a key while the last key is high-


