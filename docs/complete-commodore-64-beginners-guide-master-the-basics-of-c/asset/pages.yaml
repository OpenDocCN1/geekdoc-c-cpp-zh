    With two methods of using the sound editors'' values available to you, it shouldn''t
    be difficult to append music to your own programs. Whatever technique you decide
    to use depends on the circumstances of your programming situation. Either one
    might work, or one might be easier than the other.


    Adding sound, even complex musical pieces, isn''t hard. And mixing sound with
    graphics is almost as easy. The last program in this chapter shows an example
    of how it all works together.


    # Sound Game


    To illustrate the way that some of the components of sound and animation can work
    together, here''s a simple game that uses many of the features we''ve covered.
    After you''ve typed it in run it, take a closer look at the program listing. You''re
    certain to find ways to use sound, or ways to modify the existing sounds, that
    I haven''t thought of. That''s half of the programming sound (or anything) on
    the Commodore 64. You can learn almost as much from experimenting with other people''s
    programs by writing your own.


