    Each voice is turned, one at a time, until all three are producing sound. This
    three-voice harmony creates the chord. As you can see from the program listing,
    once each voice is turned on, it continues to play until the gate bit is turned
    off in line 80. A sound will play indefinitely if the gate bit is never turned
    off. Take a look, too, at lines 65 and 70. Here the volume changes as the program
    nears its end. Although the volume control register was earlier set to 15, now
    it changes to 10, and gradually increases as the FOR-NEXT loop in line 65. It
    gives an interesting effect.


