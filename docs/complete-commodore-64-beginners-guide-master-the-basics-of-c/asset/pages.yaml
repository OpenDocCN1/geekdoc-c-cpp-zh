  md: '# Music and the Sound Editor


    Instead of the pitch values being READ from DATA statements, as in Program 2-3,
    this routine READs the values for variables T and TT. These are then used in delay
    loops found in lines 120 and 165. It is here that the length of the notes is established.
    T sets the length of the sustain portion of the note to 1/64 second. TT sets the
    length of the delay between notes. As you can see from looking over the DATA statement
    in line 180, the first three beats play just as long as the delay between the
    beats. The next three beats, however, play only one-sixteenth as long as the delay
    between them, for the loop runs from 0 to 128, instead of just 0 to 8.


    This method lets you adjust both the length of time and the length of the pause
    between notes. Notice, however, that the flexibility of changing pitches has been
    given up. Though this poses no major problems while creating the sound of a snare
    drum, this inflexibility can make a song somewhat cumbersome.


    To be able to manipulate both the rhythm and the pitch, you''ll need to read four
    different values from the DATA list for each note (or beat of the drum). In effect,
    what you are doing is combining aspects of Programs 2-3 and 2-4. Not only will
    values be READ from DATA for rhythm, but there will also be others READ for the
    pitch. Program 2-5 combines these methods.


    # Program 2-5. Pitches and Pauses in Yankee Doodle


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


