    overwrite sections when you put the two pieces together. The line numbers for
    the DATA statements also need to be higher than the last line of the program you''ll
    append. For example, if your program runs from line 100 to 5000, make sure the
    first DATA statement is higher than 5000. You''ll see why you have to do this
    in a bit. Remember that if you have a program that READs more than one set of
    DATA, the DATA needs to be in the same order as the READ statements. In other
    words, if the DATA statements which include the music values are at the end of
    the program (as they should be; see above), the line which READs those values
    should be the last statement in the program.


