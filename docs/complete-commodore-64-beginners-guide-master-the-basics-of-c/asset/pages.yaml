  md: '# C

    Appendix


    # The Automatic Proofreader


    Charles Brannon


    “The Automatic Proofreader” will help you type in program listings without typing
    mistakes. It is a short error-checking program that hides itself in memory. When
    activated, it lets you know immediately after typing a line from a program listing
    if you have made a mistake. Please read these instructions carefully before typing
    any programs in this book.


    # Preparing the Proofreader


    +   1. Using the listing below, type in the Proofreader. Be very careful when
    entering the DATA statements—don’t type an I instead of a 1, an O instead of a
    0, extra commas, etc.

    2. SAVE the Proofreader on tape or disk at least twice before running it for the
    first time. This is very important because the Proofreader erases part of itself
    when you first type RUN.

    3. After the Proofreader is saved, type RUN. It will check itself for typing errors
    in the DATA statements and warn you if there''s a mistake. Correct any errors
    and SAVE the corrected version. Keep a copy in a safe place—you’ll need it again
    and every time you enter a program from this book, COMPUTER’s Gazette, or COMPUTE
    magazine.

    4. When a correct version of the Proofreader is run, it activates itself. You
    are now ready to enter a program listing. If you press RUN/STOP–RESTORE, the Proofreader
    is disabled. To reactivate it, use just the command SYS 886 and RETURN.


    # Using the Proofreader


    All listings in this book have a checksum number appended to the end of each line—rem
    123. Don’t enter this statement when typing in a program. It is just for your
    information. The rem makes the number harmless if someone does type it in. It
    will, however, use up memory if you entered the rest of the line correctly, or
    it will confuse the Proofreader, even if you did.


    When you type a line from a program listing and press


    209'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# C

    Appendix


    RETURN, the Proofreader displays a number at the top of your screen. This checksum
    number must match the checksum in the printed listing. If it doesn''t, it means
    you typed the line differently than the way it is listed. Immediately recheck
    your typing. Remember, don''t type the rem statement with the checksum number;
    it is published only so you can check it against the number which appears on your
    screen.


    The Proofreader is not picky with spaces. It will not notice extra spaces or missing
    ones. This is for your convenience, since spacing is generally not important.
    But occasionally proper spacing is important, so be extra careful with spaces,
    since the Proofreader will catch practically everything else that can go wrong.


    There''s another thing to watch out for: If you enter the line by using abbreviations
    for commands, the checksum will not match. But there is a way to make the Proofreader
    check it. After entering the line, LIST it. It eliminates the abbreviations. Then
    move the cursor up to the line and press RETURN. It should now match the checksum.
    You can check whole groups of lines like this.


    # Special Tape SAVE Instructions


    When you''re done typing a listing, you must disable the Proofreader before Saving
    the program on tape. Disable the Proofreader by pressing RUN/STOP-RESTORE (hold
    down the RUN/STOP key and sharply hit the RESTORE key). This procedure is not
    necessary for disk SAVES, but you must disable the Proofreader this way before
    a tape SAVE.


    SAVE to tape erases the Proofreader from memory, so you''ll have to load and run
    it again if you want to type another listing. SAVE to disk does not erase the
    Proofreader.


    # Hidden Perils


    The Proofreader''s home in the 64 is not a safe haven. Since the cassette buffer
    is wiped out during tape operations, you need to disable the Proofreader with
    RUN/STOP-RESTORE before you save your program. This applies only to tape use.
    Disk users have nothing to worry about.


    Not so for 64 owners with tape drives. If you type a program in several settings?
    The next day, you come to your computer, load and run the Proofreader, then try
    to load the partially completed program so you can add to it. But


    210'
