    # Test Bit


    The test bit, bit 3 of each voice''s waveform control register, is a special bit
    that turns the output from the register off when it''s turned on by POKEing 8
    (value of bit 3) to the memory location. Ordinarily it''s used to test the Commodore
    64''s SID chips. However, it can be used for special sound functions because it
    produces a soft/off sound. To get a better idea of what this means, you''ll need
    to listen to a sound that is first turned on and off by the volume control. This
    produces a sound that clicks as it switches on or off. If you use the test instead,
    this clicking will be greatly reduced. To reduce it further, you can use the gate
    bit, turning that on and off rapidly to produce the sound. As we noted earlier,
    there are usually ways to program a sound effect on the 64.


    # Program 4-7. Test Bit On/Off


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


