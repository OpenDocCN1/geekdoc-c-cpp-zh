    **Creaky door.** When a door gets old, its hinges may become rusty. They crack
    and pop as they creak, and the faster the door moves, the faster the creaks sound.


    # Program 3-9. Creaky Door


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


    ```

    8 REM --- INITIALIZE REGISTERS --- :rem 46

    9 REM                               :rem 29

