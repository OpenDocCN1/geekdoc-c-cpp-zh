    Figure 1-10 shows a triangle waveform. Note that it''s symmetrical, with equal
    high and low portions. Unlike the pulse wave, however you can''t control the percentage
    of the high part of the wave to the low. A triangle waveform is always symmetrical.


    Sawtooth waves are not symmetrical. They rise slowly and fall abruptly. They begin
    like a triangle wave and end like a pulse wave. Figure 1-11 illustrates a sawtooth
    waveform.


    They produce the sharpest sound of waves available on the Commodore 64. By setting
    5 of the waveform control register, you can enable the sawtooth waveform.

