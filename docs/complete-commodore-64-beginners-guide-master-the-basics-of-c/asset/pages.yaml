    The sound없이 is identical to that in Program 5-2. It''s called in the same way,
    by PEEKing into the next location and seeing if there''s anything there. If there
    is, that a collision is about to happen, and the sound is played. The statements
    in line 61 check for collisions, no matter where they are on the screen, and access
    the sound effect if it''s needed. That line is rather involved, so let''s take
    a closer look at its logic. It''s important to our discussion of mixing sound
    and graphics, for this is the line that actually decides if sound should be played.


    If the location of the ball character (BL) contains 160, meaning the barrier character,
    or if the ball''s location is less than the left barrier''s location plus one,
    then the sound will play. That is expressed by the part of the line which reads
    PEEEK(BL)=160ORBL<LB+1. In other words, if the ball is moving to the left, it
    will “see” the barrier character as it tries to occupy the same location. If the
    ball character is in the location just to the right of the left barrier (LB+1)
    and is trying to move even further to the left (trying to make BL less than LB+1),
    it will also “see” the barrier. Either of those conditions, if true, will execute
    because the THEN portion of line 61 will execute. The part of the first statement
    which reads ORBL>RB–1 does the same thing, only when the ball is moving to the
    right and trying to go even further in that direction when it is next to the right
    barrier. If that exists, the program detects the right barrier and again calls
    for the bouncing sound to play.


    As you can see, the process of PEEKing and POKEing can be involved. Its versatility
    usually outweighs the complicated programming you have to go through, however.


