    # Using Your Filters


    To use filters on the Commodore 64, you need to do several things:


    +   1. First of all, you need to choose which voice you''re going to filter. The
    voice selection control consists of the lower three bits in location 54295. To
    filter voice 1, you''d POKE 54295 with 1; to filter voice 2, POKE 54295;2; and
    to filter voice 3, POKE 54295. To filter more than one voice, all you have to
    add the bit values and POKE the total into the location. Selecting voice 1 and
    voice 2, for instance, is done by POKEing 54295 with 3. Refer to Table 1-1, which
    shows the SID chip registers and memory locations.

    2. Choose your filter by POKEing the appropriate number into location 54296.

    3. Select the cutoff point by POKEing location 54293/or 54294 with the desired
    value. See the explanation above for that process.


    Now you''re ready to filter sounds on the 64. As a reference, these are the locations
    used on the 64 to enable and set parameters for filtering:


    | Cutoff Point (lower value) | 54293 bits 0-2 |

    | Cutoff Point (higher value) | 54294 bits 0-7 |

    | Voice 1 Filter Enable | 54295 bit 0 |

    | Voice 2 Filter Enable | 54295 bit 1 |

    | Voice 3 Filter Enable | 54295 bit 2 |

    | Low Pass Filter | 54296 bit 4 |

    | Band Pass Filter | 54296 bit 5 |

    | High Pass Filter | 54296 bit 6 |


