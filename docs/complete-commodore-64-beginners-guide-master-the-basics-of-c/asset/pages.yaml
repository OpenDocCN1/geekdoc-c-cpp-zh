    While you can slow the timing of a song by adding pauses, there is nothing you
    can add to speed up individual notes. To make a tune faster, you can do one of
    two things: begin with faster notes, using shorter rates of attack and decay,
    for example, decreasing the length of the sustain loop, or then add pauses to
    notes which require a longer length; or you can change the timing of the music
    as it is running by utilizing separate timing loops.


    # Pausing Techniques


    Several short programs can show how pausing and delays work. In this first example,
    the speed of the drumbeats is adjusted by maintaining a steady rhythm and adding
    pauses wherever necessary.


