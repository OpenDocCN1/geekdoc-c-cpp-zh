    The background sound you hear as the ship moves back and forth is created in lines
    76 and 77. Both the sound and the sprite movement take place in the same loop,
    so it seems as if they''re happening simultaneously. The variable MU is set to
    a value of 100 or 200 by line 76. Every third time the loop, MU switches from
    100 to 200, or from 200 to 100. Line 77 takes this value and into the high pitch
    control register for voice 3. What all this does is make the background sound
    alternate quickly between a high and low frequency producing the droning sound
    you hear.


    When you press the f1 key, the missile is launched. As it moves, it yet another
    sound. This is created in line 89 by simply turning on and off the noise waveform
    in voice 1. You don''t have to set ADSR or frequency values for this sound, because
    values are still stored in those control registers. Line 180, for instance, includes
    a pitch value for voice 1, and since the sound registers aren''t cleared in the
    middle of the program, the ADSR values initialized in lines 3 and 4 are still
    available. Leaving some registers with values can be convenient at times, but
    it may give you problems if they''ve been cleared when you''re trying to debug
    a program. Use the technique carefully.


    When the missile hits the ship, created by lines 220 and 222, plays. Using voice
    2 and the noise waveform, the sound plays for only a brief moment. As soon as
    the FOR-NEXT loop in line 222 completes, the sound falls off.


    When you''ve destroyed five ships, the game ends. Another piece of music plays,
    this time accessed from lines 2200–2250. All the Commodore 64''s voices are used.
    The DATA in lines 3005-3060 is READ in line 2205 and then POKED into the pitch
    control registers. A delay loop in line 2240 sets the length of each group of
    notes.


    As you can hear, the sounds fit well into the theme of the game. Explosions, movement
    sounds, and opening and closing music add much to the game''s "feel." It''s not
    a complicated, arcade-style game, but it''s not meant to be. The important thing
    to remember is that adding sound to movement and graphics doesn''t have to be
    difficult. Even the simplest sound and music make a program seem more professional,
    and more to use.'
