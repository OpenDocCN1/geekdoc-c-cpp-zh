    To hear this routine play music, you have to create a file with the Chord Editor,
    change it to a program file, and finally append it to. Of course, you''d replace
    the seven dummy values with your own set of DATA statements. Since the values
    will be in the proper format, all you have to do is to append the DATA statements
    to the end of this program, and you''ll hear the chord combinations.


    # POKEing Music into Memory


    There''s another method of using the music data to create sound, however. Instead
    of changing the music file produced by one of the two editors into a DATA program
    file, then appending the DATA statements to another program, you can POKE the
    values into the 64''s memory, and then once you''ve PEEKed those addresses, you
    can POKE the values back into the correct sound control registers. This method
    may not be apropriatate for every program you write that uses sound, but it is
    an interesting technique. It sounds harder than it is.


    You have to be careful where you place the music DATA, however. If you POKE it
    into an area of memory that is used'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Putting It Together


    by YOUR BASIC program, for example, it can be overwritten. A safe place for this
    DATA begins with location 49152. BASIC will never harm this area. Be aware, however,
    that many machine language programs and routines use 49152 as a starting point
    for placing values. If your program includes some machine language routines, make
    sure you''re not trying to use these locations for two purposes.


    Program 5-13 takes the music files you created with a sound editor and POKES the
    DATA into memory, starting at location 49152. You don''t have to change the music
    files to DATA program files. Nor do you have to actually append them to your program.
    The process is much simpler.


    First of all, type in the filename, and RUN Program 5-13. When it asks for you,
    supply it, making sure not to include theMUS extension. (As with the first method
    of using music files, this technique requires that they were originally created
    with the extension when you SAVE them using the sound editors.) The program will
    load the music and POKE the values into memory, beginning at location 49152. It
    will also display the last location used to store the values. You''ll need this
    number later. Without turning off the computer, LOAD the other program, the one
    that will actually play the music. We''ll see an example of this kind in a moment.
    First, here''s Program 5-13:


    # Program 5-13. POKEing Music


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


