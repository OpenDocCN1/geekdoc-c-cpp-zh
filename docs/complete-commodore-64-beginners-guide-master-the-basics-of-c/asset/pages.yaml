  md: '# SID: The Sound Interface Device


    60 POKE 54275,8:POKE 54277,9:POKE 54278,0


    Setting the sustain and release at a fast rate (0) and the decay to a longer rate
    (9). The sustain and release have both been set to 0 so that you can more easily
    hear the difference attack and decay make. Notice how the sound changes as you
    run this altered version. Lengthening the rate of the attack should be simple
    for you now. All you have to do is add 128 (which is 8*16) to the decay value
    of 9. The total is 137, which indicates a longer attack, as well as a long decay
    rate. Change line 60 again so that it reads:


    60 POKE 54275,8:POKE 54277,137:POKE 54278,0


    Setting the sustain and release of a note is done in the same way, by Poking from
    Table 1-2 to the appropriate register. All you have to remember is that the sustain
    indicates the volume level of the note''s sustain, while the release signals the
    rate at which a note falls from that level to volume 0. Experiment with the sound
    routine you''ve used so far, changing the sustain/release values POKED into location
    54278, the control register for voice 1. You''ll be amazed at the different sounds
    you can create just by changing that parameter.


    # Waveforms


    In addition to changing the frequency, volume, and ADSR of the notes you produce,
    the SID also allows you to produce different waveforms. The forms available are
    pulse waves (which we''ve been using in most of the examples), triangle waves,
    sawtooth waves, and noise. The control register for waveform selection in voice
    1 is found in location 54276. Changing the value POKED into that location changes
    the waveform used to produce the note.


    The pulse waves, which we''ve used in most of the examples, have all been symmetrical.
    (That''s sometimes called a square waveform.) That is, they rise, remain at the
    upper peak for a period of time, fall, and remain at the valley for exactly the
    same length of time before repeating. Figure 1-8 shows a symmetrical waveform.'
