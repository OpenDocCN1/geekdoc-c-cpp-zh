    # Tapered Pulse Waveforms


    As mentioned earlier, there are two different kinds of tapered

    sounds—those that rise and those that fall. Let''s look at rising

    tapered sounds sounds.


    **Accordion.** Most musical instruments produce sounds that\have a falling tapered
    sound. That''s because they produce

    sound by making some element vibrate. As the vibrations die

    down, the sound slowly tapers off.


    Accordions using vibrating elements. The elements are

    steel reeds. But because the accordion plays the reeds by

    pumping air across them, the sounds start slowly as the

    accordionist begins pushing the bellows together, and then

    gradually rise in volume.


    When the accordion stops pushing the bellows, the air

    st. Because the reeds are fairly rigid, they stop vibrating

    quickly, making the sound stop just as fast. Program 3-29

