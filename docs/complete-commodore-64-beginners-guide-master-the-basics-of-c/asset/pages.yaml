  md: '# SID: The Sound Interface Device


    Waveforms are selected by using one of the waveform selection bits in conjunction
    with the enable, gate, bit. Each voice on the 64 has its own register to select
    the waveform, as well as its own gate bit. For example, voice 1 uses the register
    at location 54276 for both waveform selection and enabling the wave. Refer to
    Table 1-1 for the other voices'' register addresses.


    The four waveforms are selected by setting the appropriate bit in the waveform
    control register. If you were to look at one of these registers (there are three
    of them—one for each of the Commodore 64''s three voices), you would find it''s
    made up of several control bits, each of which has a specific function. Figure
    1-5 shows the waveform control register for voice 1 at location 54276.


    # 1-5. Waveform Control Register


    | Bit | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Noise Wave Enable | Pulse Wave Enable | Sawtooth Wave Enable | Triangle Wave
    Enable | Test Bit | Ring Modulation. | Sync Bit | Enable Bit |


    In addition to having specific functions, each bit has a specific bit value. To
    turn that on, you simply POKE the appropriate bit value into the control register.
    Bit 4, which has a value of 16, will turn on the triangle waveform generator.
    Bit 5, with a value of 32, enables the sawtooth waveform, while bit 6 turns on
    the pulse waveform generator if its value of 64 is used. The last waveform, noise,
    is enabled by setting bit 7, which has a value of 128. For example, to enable
    the pulse waveform, you would POKE the register with 64. This will turn on the
    pulse waveform generator. However, to get any sound out of the SID, you must also
    turn on the gate bit (0). If you don''t, you won''t hear your sound. Every time
    you turn on a waveform bit, you should add 1 (the bit value of bit 0) to the value
    you select. Thus to turn on the pulse'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# SID: The Sound Interface Device


    wave generator and enable it, you would POKE the control register with 65. To
    turn it off, you would POKE the register with 64. (Remember that the gate bit''s
    value is 1; 65–1=64.)


    Pulse width must be set whenever you select the pulse waveform for any of the
    three voices. It''s controlled in much the same way as the pitch registers. With
    the pitch registers, there are two locations used for pulse width selection in
    each voice. Voice 1''s pulse width registers, for instance, are at addresses 52474
    and 52475. However, there are only four bits available in the second register,
    so the numbers stored in these locations define a binary number between 0 and
    4095. Just as in the pitch registers, the number represented by the two registers
    is equal to the lower value plus the upper value multiplied by 256. For example,
    if the lower register contains a 0, and the upper register an 8, the wave value
    would be:


    ```

    0 + (8 * 256) = 2048

    ```


    This number signifies the proportion of the wave that will be high. The above
    value would be exactly 50 percent (2048/4096=.50). Decreasing or increasing the
    number represented by the values in these registers will decrease or increase
    the proportion of the wave that is high and change the sound produced. If you
    used the following statement, for instance, the wave would be high only 25 percent
    of the time.


    POKE 52474,0:POKE 52475 A loop is usually added to a sound routine that lasts
    longer. You can force it to play indefinitely by simply not turning the gate bit
    off, or by turning the gate bit off manually, with a function key defined in the
    program. The easiest way to set the length of the note''s level is to use FOR-NEXT
    as a delay. This loop should be inserted between the time you set the waveform
    (and thus turn on the gate bit) and the time you turn the gate bit off. If you
    were using the pulse-waveform, and had already set the other sound parameters
    earlier in the routine, it could look like this:


    ```

    POKE 52476,65 Set pulse waveform and turn on gate bit

    T=0 TO 1000:NEXT

    ```


    ```

    Delay loop to play the sound for one

    second

    ```


    ```

    POKE 52476,64 Turn off gate bit

    ```


