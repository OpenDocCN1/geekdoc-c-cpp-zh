    The main difference between this routine and Program 1-3 is that we''ve used a
    FOR-NEXT loop in line 120 to adjust the volume each time the loop executes. Set
    up variable R, the volume begins at 15, and each time through the loop decreases
    by 1. The second FOR-NEXT loop in that is a line, so that you can hear the changes
    in volume more easily.


    As each notes, a different volume level is set. You can use this technique in
    your own routines to make a sound effect lively, fade away, then become loud again.
    As you can see, modifying the volume register on the 64 isn''t very hard, and
    can dramatically alter the sound you hear.'
