    You can use this program to calculate the pitch values for the two registers,
    at the same time hearing the note you''re selecting. If you compare the values
    displayed with those in Table 1-3, you''ll notice there are often small differences.
    If you ask for the pitch values of the frequency at 16 herz, for instance, you''ll
    see a high pitch register value of 1 and a low pitch register value of 6 on the
    screen. This is slightly different from the high value of 1 and the low value
    of 12 which shows in Table 1-3. Even though the low pitch register is different,
    the SID chip plays the bottom C note. The difference is just too short for you
    to hear but that note.


    Pulse width control registers. The frequency of a sound wave can be determined
    by measuring the time wave begins rising edge on one wave until it begins on the
    next. Figure 4-2 shows the rising and falling edges of one cycle of a pulse.


    As you can see from Figure 4-2, the wave has a falling edge between the two rising
    edges. In this figure, the falling edge is exactly in the middle of the wave.
    We call this a 50 percent pulse wave because the signal falls at the halfway'
