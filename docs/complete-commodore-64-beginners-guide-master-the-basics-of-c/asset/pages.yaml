  md: '# CHAPTER


    # 2

    Music and the Sound Editor


    Musical instruments produce unique sounds that are based on the design of the
    instrument. A clarinet sounds like a clarinet because it''s made from wood. The
    air pushed through it by the player moves between the reed and the mouthpiece,
    making the reed vibrate. As the player presses the keys, the air is forced through
    various holes, creating sounds. A trumpet sounds like a trumpet because it is
    made of brass. The player positions his lips and tongue to create sounds, and
    to stop and start them. The air blown into the mouthpiece passes past valves,
    varying distances through tubes, and eventually out its bell. It''s this process
    that makes the unique sound of the instrument.


    Unlike a musical instrument, the Commodore 64 does not produce sounds based on
    its mechanical design. It creates special sounds by manipulating tones using electronic
    circuits. Because of this, the 64 is not limited to producing only one type of
    sound. It can mimic almost any instrument by simply duplicating that instrument''s
    sound patterns. In addition, the 64 can even produce sounds that would be impossible
    for any normal musical instrument.


    Since the 64 makes sounds digitally (using numbers), the computer can also store
    the sounds so you can play them over and over, or mix them with other sounds at
    will. In a way, it''s like having a musical instrument and a recording device
    in one package.


    This chapter will show you how to use your 64 in just this way. You''ll see how
    to program music on the 64, how to use it as a musical instrument, and how to
    store and play that music back.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Music and the Sound Editor


    # Playing Notes


    Chapter 1 showed you how to create simple sounds using the SID chip in your 64.
    Most of those were more like sound effects than actual tunes. Producing more complicated
    routines isn''t difficult once you know how to turn the sound on, and how to set
    the various control registers in the SID chip. We''ll begin to do that in this
    chapter.


    You''ll remember the pitches on the Commodore 64 are defined by using two memory
    locations for each of the three available voices. Table 1-1 shows the specific
    control registers for each voice and their locations in memory. Placing values
    in these locations selects the frequency of the note. You''ve already seen how
    to do this in Chapter 1. Take a look at Program 1-2 for a moment. The READ statement
    in line 75 READ values from the DATA statements in lines 180 through 195. Every
    time through the loop, the program reads two from the list, a low and a high value.
    These values are then POKED into the pitch register to create the sound. Using
    this same program, you can play any tune you like by simply changing the values
    in the DATA statements. All you have to remember is that the values have to be
    paired: a low pitch value with a high pitch value. For example, if you replaced
    the DATA statements with a different set of values, you could create a tune like
    that that Program 1-2 plays. (If you''ve previously saved a copy of Program 1-2
    from Chapter 1, you can just replace lines 180-195 with those show in the listing
    below.)


    # Program 2-1. Yankee Doodle


    For-roke proof entry, be sure to read "Automatic Proofreader," Appendix C.


