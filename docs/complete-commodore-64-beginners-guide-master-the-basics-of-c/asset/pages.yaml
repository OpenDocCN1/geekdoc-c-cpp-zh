  md: '# # A Thousand Sounds


    One of the most powerful features of the Commodore 64 computer is its ability
    to create sound. Its SID chip, perhaps the most advanced sound creation device
    in any personal computer, can create natural and artificial sound effects, as
    well as "sing" in three-part harmony. But creating and controlling sound on the
    64 can be confusing, especially if you''re just starting out.


    COMPUTE!''s Beginner''s Guide to Commodore 64 shows how to use the impressive
    sound and music features of your computer. Whether you''re an experienced programmer
    or a beginner, you''ll find the clear and detailed explanations make it simple
    to produce sound and music on the 64. To help you compose your own music, we''ve
    included complete single-voice and chord editor programs that will turn your computer
    into a keyboard.


    +   * Learn how to change the sound envelope to produce just the sound or effect
    you want.

    * Dozens of example sound effects that you can type in and run, or use in your
    programs and games.

    * Change waveforms and create sound, from sirens to sawing wood.

    * Use ring modulation, synchronization, and resonance to produce unusual artificial
    sounds.

    * All terms are explained in an easy-to-follow glossary.

    * Figures, charts, and tables are included for quick reference.


    John Heilborn, author of the best-selling COMPUTE!''s Reference Guide to Commodore
    64 Graphics, returns with clear writing and complete explanations to help you
    understand and master sound programming. If you want to program sound for musical
    compositions, arcade-style games, or just for fun, everything you need to get
    you started is right here.'
  merge: -1
  pgno: 259
