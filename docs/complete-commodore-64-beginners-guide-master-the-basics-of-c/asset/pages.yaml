    # Hard Sounds Using Pulse Waves


    This combination of sound components produces the hardest sounds the Commodore
    64 can make. This is because the sounds start very quickly and the waveforms consist
    of very abrupt changes.


    If we take a simple, hard pulse waveform that is symmetrical (also called a square
    wave) and make it very short in duration, it produces a kind of clicking sound.
    Figure 3-2 shows this square wavef, while Program 3-6 demonstrates the sound effect.


    # Figure 3-2. Hard Pulse Waveform (Symmetrical)


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_116_0.png)


