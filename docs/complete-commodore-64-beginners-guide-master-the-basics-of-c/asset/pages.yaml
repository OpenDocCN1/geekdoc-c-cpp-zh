    # Hard Sounds Using Sawtooth Waves


    If you want to use a sawtooth waveform instead of the pulse waveform, you need
    to change the value POKED into location 54276 (for voice 1), 54283 (for voice
    2), or 54290 (for voice 3) from 65 to 33. When you listen to a pulse waveform
    and compare it to a sawtooth waveform, you''ll find the sawtooth waveform has
    a sharper sound. Again, that''s an aesthetic term, but it generally refers to
    a sound that is composed of higher frequencies. It has a higher, piercing sound
    to it. Let''s listen to an example. Type in and RUN Program 3-13.'
