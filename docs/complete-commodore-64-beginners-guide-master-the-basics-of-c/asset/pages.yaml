  md: '# 3

    Sound Effects


    Ticktock. By putting these clicks in pairs, using two different frequencies, you
    can produce the regular, ticking sound of a grandfather clock. Enter and RUN Program
    3-7 to hear the sound.


    # Program 3-7. Ticktock


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


    ```

    10 FOR R=54720 POKE 54296,POKER,Ø:rem 24

    20 POKE 54296,5 POKE 54277,240:rem 252

    30 POKE R=54275,8:POKE 54278,240:rem Ø

    40 POKE 54272,51:POKE 54273,90:rem 44

    50 POKE R=54276,64:POKE 54296,5:rem 7

    60 POKE R=54276,64:POKE 54296,Ø:rem 2

    70 FOR R=0 TO 400:NEXT:rem 189

    80 POKE 54272,47:POKE 54273,81:rem 53

    90 POKE 54276,65:POKE 54296,5:rem 11

    110 POKE 54276,64:POKE 54296,Ø:rem 46

    120 FOR R=0 TO 400:NEXT:rem 233

    130 GOTO 40:rem 49

    ```


    The sounds are short because the gate bit is turned on in one line, then turned
    off in the next line. There is no sustain delay loop between those two steps to
    keep the note playing at its sustain level. The other hard sounds you''ve seen,
    the attack, decay, and release have been set to their most rapid rates. The volume
    level is set to 5 when the gate bit is turned on (lines 50 and 90), and then set
    to 0 to turn it off completely (lines 60 and 110). You can eliminate those POKE
    statements which set the volume control register, the sound will be different.
    It won''t sound quite so much like a clock, but more like a beeping noise. Turning
    the sound on, then off, in rapid succession makes that sound you hear in this
    routine.


    You can create interesting sounds, using this routine, by changing a thing or
    two. For example, changing the FOR-NEXT loops in lines 70 and 120 (the loops create
    the pauses between the two clicking sounds) will produce a different sound. Changing
    other values, such as the pitch values in lines 40 and 80, will also make new
    sounds.


    Adding another section to the routine can give you the effect of an alarm going
    off the clock has been ticking for a short time. Add the following lines to Program
    3-7 and reRUN it. The clock will ticktick 16 times (indicated by the FOR X=0 TO
    15 in line 35) before the alarm goes off.


    90'
