  md: '# 2

    Music and the Sound Editor


    you would use in the sustain delay loop. To change this value, press the Cursor
    Right/Left key at the lower right corner of the keyboard. This will highlight
    the LEN column and will display the current timing value.


    By pressing the Cursor Up/Down key, you can increase or decrease this value in
    increments of 25. Pressing SHIFT and Cursor Up/Down increases the value; pressing
    the unSHIFTed Cursor Up/Down decreases the length value. The highest possible
    value is 975, and the lowest is 0.


    PAUSE. You can enter a pause as easily as you enter any note. Use the space bar
    to enter pauses between notes; the length of the pause will be the same as the
    present note length. To enter longer or shorter pauses, change the LEN value as
    you did earlier.


    When you enter pauses, you''ll see that a space is displayed in the note column,
    and zeros are displayed in the LOWER and UPPER columns.


    #. The # column shows the relative length of the notes entered. This is based
    on a unit of 25 as the basic increment of time. In other words, any note that
    has a length (LEN) of 25 will have a relative length of 1, a note that has a length
    (LEN) of 100 has a relative length of 4, and so on. This can help you determine
    the length to use in your notes if you are writing songs that have complex timing.


    Playing music back. To play back the notes you have entered at any point, all
    you need to do is press the f1 key. This will play all of the notes you have entered
    so far. You can use this function to check your timing, since the notes are played
    using the same timing and pauses you''ve entered.


    Modifying the music. To change any note that you''ve entered, you need to delete
    the old note and the new one as you would enter any new note. The display table
    shows you the last ten notes. To change a note, use the Cursor Up/Down key (either
    Shifted or unSHIFTed) when the NOTE is highlighted. By pressing the key correct
    number of times, you can position the note you want to delete at the bottom of
    the table in the upper half of the screen. Unfortunately, this will delete all
    of the notes from that entry number on. What you''re doing, in effect, is deleting
    all notes to that point. Once you press the Cursor Up/Down key as a delete, the
    note is gone for good. If you keep


