    Now you can move the barriers left and right by pressing the function keys (keys
    on the far right of the keyboard). The f1 key moves the left barrier to the right,
    while the f3 key moves it to the left. Pressing the f5 key moves the right barrier
    to the left, and the f7 key moves it to the right. If you press f3 or f5 enough
    times, the barrier will move to the line above or below, respectively. If you
    do this, the ball has to travel even further before it bounces off.


