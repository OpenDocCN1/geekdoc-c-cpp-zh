  md: '# 5 Putting All Together


    response to some action that occurs from within your program.


    The bouncing ball. To show this process of sound and graphics combination, let''s
    take a look at a simple program which calls for sound only at certain times. A
    crude game based on Pong, one of the first arcade games, this program creates
    two barriers and a single bouncing ball. While the ball is traveling between the
    two barriers, no sounds are needed. Each time the ball strikes a barrier, a bounce-style
    effect should be heard.


    This program produces a sound and reverses the ball''s direction after each count
    of 25. The whole process is cyclic. Since the ball will never do anything unexpected,
    you don''t need to concern yourself actually interrupting the program to produce
    the sounds; they simply planned ahead of time.


    # Program 5-1. Bouncing Ball


    ```

