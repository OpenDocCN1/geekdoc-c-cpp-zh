    # Subtractive Synthesis


    Subtractive synthesis, where sounds are manipulated by subtracting parts of a
    single sound, is another advanced function of the Commodore 64''s sound capabilities.
    Filters are the primary way of altering sounds with subtractive synthesis. There
    are three filters you can use when you create sounds and music on the 64: the
    low pass filter, the high pass filter, and the band pass filter.


    The filters on the SID chip are similar to filters used for other purposes, whether
    it''s filtering coffee or filtering oil. Some things, such as coffee and oil,
    are allowed to pass through, while others, such as grounds or dirt, are blocked
    out. Filters in your computer let parts of sounds pass through, but selectively
    blocks others. And unlike filters in other applications, you can determine what
    is passed through and what is blocked.


    The low pass filter is designed to remove the higher frequencies, allowing the
    lower frequencies to pass through. The high pass filter has the opposite effect—it
    removes the lower frequencies while letting the higher frequencies pass. The band
    pass filter allows a band or group of frequencies to pass through, while frequencies
    above and below the band are blocked.


