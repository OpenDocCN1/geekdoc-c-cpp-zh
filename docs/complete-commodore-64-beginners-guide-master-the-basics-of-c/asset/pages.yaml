    # More Advanced Sound Techniques


    You''ve seen how to create sounds using the SID chip on the Commodore 64. Hard
    sounds, soft sounds, and tapered sounds are just some of the styles of effects
    you''ve seen how to produce. But there''s more to the SID chip. There are such
    things ready to use. Such things as filters, ring modulation, and synchronization
    available to you. The advanced sound controls can add even more to the sounds
    and music you''d like to produce on your computer. The next chapter will show
    you how to use these controls as you create impressive sound effects and music.'
