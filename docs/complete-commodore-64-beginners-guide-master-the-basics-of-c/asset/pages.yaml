- img_proc: true
  md: '# C

    Appendix


    since the Proofreader is trying to hide the cassette buffer, we

    wiped out!


    What you need is a way to load the Proofreader after

    y''ve loaded the partial program. The problem is, a tape

    LOAD to the buffer destroys what''s supposed to load.


    After you''ve typed in and run the Proofreader, enter the

    following lines in direct mode (without a line number) exactly

    as shown:


    ```

    A="PROOFREADER.T": B$={10 SPACES}": FOR X=1

    TO 4: A=886 TO 1018: A=A+CHR(PEEK(X)): NEXT

    OPEN 1,1,1:CLOSE

    ```


    After you enter the last line, you will be asked to PRESS

    RECORD & PLAY on your cassette recorder. Put this program

    at the beginning of a new tape. This gives you a new way to

    load the Loader. Anytime you want to bring the Proof-

    reader into memory without disturbing anything else, put the

    cassette in the tape drive, rewind, and enter:


    ```

    OPEN1:CLOSE

    ```


    You now start the Proofreader by typing SYS 886. To

    test this, PRINT PEEK (886) should return the number 173. If

    it does not, repeat the steps above, making sure that A$

    ("PROOFREADER.T") contains 13 characters and that B$ con-

    10 spaces.


    You can now reload the Proofreader into memory when-

    ever LOAD or SAVE destroys it, restoring your personal typ-

    ing helper.


    Incidentally, you can protect the cassette buffer on

    tCommodore 64 with POKE 178,165. With this POKE, the 64

    will not wipe out the cassette buffer during tape LOADS and

    AVES.


    # Replace Original Proofreader


    If you typed in the original version of the Proofreader from

    the October 1983 issue of COMPUTER''s Gazette, you should

    replace it with the improved version below.


    # Automatic Proofreader


    ```

    100 PRINT{CLR}PLEASE WAIT...":FORI=886TO1018:READ

    A:CK=K+A:POKE,A:NEXT

    ```'
