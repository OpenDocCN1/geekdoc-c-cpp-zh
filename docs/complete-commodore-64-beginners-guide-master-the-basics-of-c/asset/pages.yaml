  md: '# Foreword


    Hidden inside your Commodore 64 are thousands of sounds and musical compositions.
    Ranging from arcade-quality sound effects to full-scale synthesized orchestrations,
    they can make your computer “sing” in ways you never thought possible. But unless
    you know how to unlock those sounds, they’ll stay hidden, deep within the 64’s
    SID chip.


    Until computers, you had to be a musician to create music, or a sound effects
    expert to produce natural and artificial sounds. But with a Commodore 64, you
    have a versatile machine that can imitate the delicate sound of a violin, or the
    crashing roar of an ocean. And it’s often just matter of a few POKEs and PEEKS.


    Finding out what to POKE and what to P can be difficult, especially if you’re
    just beginning to use sound on the 64. You have to know how to use the 64’s amazing
    SID chip, how to control its functions, and how to put it all together.


    COMPUTE!s Beginner’s Guide to Commodore 64 shows you how to use this computer’s
    powerful sound features to create just the sound you want. More importantly, the
    descriptions and explanations are clear and easy to follow. John Heilborn, noted
    Commodore author, shows you how to create simple sounds, and even how to utilize
    the SID chip’s advanced features, and even how to combine sound with graphics
    to enhance your programs and games. It doesn’t matter whether you’re an experienced
    programmer or just starting. This book will show you techniques to create your
    own sounds and music.


    +   * Use the volume control to create interesting effects.

    * Manipulate the sound envelope to produce sounds—from whistles to sirens to footsteps
    in the snow.

    * Compose three-part harmony.

    * Easily add sound to other programs.

    * Experiment with ring modulation, synchronization, and resonance.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'To make it all easier, you can type in and run two complete sound editors:


    +   - A One-Voice Sound Editor

    - A Chord Editor


    You can even create separate music files and, following a simple method, append
    them to your other programs and games. Without having to retype anything.


    With the help of COMPUTER!''s Beginner''s Guide to Commodore 64 Sound, you''ll
    quickly be creating your own sounds and music.'
