    # Timing and Rhythm


    Music isn''t just a collection of notes played in sequence. It''s also very much
    a matter of timing. When you play each note is as important as which you play.
    Whenever you program a song, you must be aware of both the notes and the timing
    of the music; otherwise, you won''t be able to duplicate the song accurately.


    The tune you just played after entering and running Program 2-1 has several pairs
    of 0''s in its DATA statements. The first pair you see is in line 185. The 0''s
    are placed there to provide pauses in the music. Without those pauses, the music
    would consist of bland notes with no rhythm. You can hear this by eliminating
    the 0''s, and the commas between'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 2

    Music and the Sound Editor


    them, from lines 185 and 190 in Program 2-1. There are four pairs altogether.
    After you''ve done that, RUN the program again and listen for the difference.
    The first part of the tune is recognizable, as it reaches the middle, it starting
    strange. The same notes are being played, but the timing and rhythm are off.


    By putting the pauses in different places in your music, you can change the whole
    feel of the song. Remember, one of the main differences in styles of music, such
    as jazz and rock, is rhythm.


    Program 2-2 uses the framework of Program 2-1, but the DATA statements have changed.
    Additional pairs acting as pauses have been placed in the lines. You can simply
    enter the new DATA statements into your saved version of Program 2-1 and rerun
    it. Although you''ll recognize the tune, it will be distorted by the pauses, slowing
    it down so that it sounds like a version you hear jack-in-the-box. Try it out.


