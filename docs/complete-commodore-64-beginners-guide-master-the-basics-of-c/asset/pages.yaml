    Now the attack is long (indicated by using a value of 208,

    which is 16*13), and the decay is very short (the decay

    is set to 0). Remember that the value you finally POKE into

    t attack/decay control register is a sum of the attack value

    (208) and the decay (0). The sound rises to its maximum vol-

    ume slowly, and falls rapidly to its sustain level (which has

    been set to volume 0 by POKEing location 54278 with 0).

    even softer sound can be created by manipulating the attack

    and decay rates that both are long. Changing line 40 again


    ```

    40 POKE 54277,172:POKE 54278,0

    ```


    If you look at Table 1-2 for a moment, you''ll see that

    ve set the attack to 10 (160) and the decay to 12 (12). Add-

    ing those values together gives you the total value of 172,

    which is what POKED in the control register.


    You can even change some of the earlier examples by

    POKEing new values in the attack/decay register for.

    instance, try replacing line 60 in Program 1-2 with this:


    26'
