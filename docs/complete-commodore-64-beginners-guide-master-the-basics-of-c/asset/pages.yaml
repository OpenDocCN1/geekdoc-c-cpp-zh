  md: '# Music and the Sound Editor


    Using the table. There are a few differences between the tables in the two editors.
    The first thing you may notice is that the column containing the notes is much
    wider than before. This is to accommodate the three notes that can be played at
    once. Additionally, two of the columns have been deleted. These are the PAUSE
    column and the # column. Pauses are now indicated by a break in the NOTE column
    (no note designated) and the 0''s in the LO/UP value columns.


    NOTE. When the program is first turned on, the NOTE heading is highlighted as
    just before, but now it''s three times as wide. This allows room for three notes
    to be displayed in the same column. When you enter the first note of a chord,
    that note is played, and the name of the note is displayed in this column. When
    the computer is waiting for you to enter another note from the keyboard, the first
    note continues to play. When you enter a second and a third note, this column
    shows the notes as you enter them.


    After the third note has been played, all three notes will be turned off. You
    must enter at least ten chords when you use this editor.


    LO/UP. Each of these three columns shows the actual POKE values being entered
    into the pitch control registers. This editor creates the values for you would
    need to POKE into the low and high pitch registers; all you need to copy them
    down as the notes are entered. Then you can place these values in the appropriate
    locations in your sound routine.


    LEN. The value shown in the LEN column is not exactly the same as it was in the
    Sound Editor. While the number shown is indeed the one that is used in the timing
    loop, the loop itself has been changed to directly reflect the relative length
    of the notes in the Chord Editor. To change this value, press the Cursor Right/Left
    key at the lower right corner of the keyboard. This will highlight the LEN column
    and will display the current timing value.


    Pressing the SHIFTED Cursor Up/Down increases the timing value, while using the
    unSHIFTED Cursor Up/Down decreases the value. However, the Chord Editor uses increments
    of one, allowing you higher timing resolution. The highest timing value available
    is 255 and the lowest is 0.


    #. Since the LEN value now represents the relative length of the tone, the # column
    is not needed, and has been deleted from this editor.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# 2

    Music and the Sound Editor


    **Modifying the music.** Just as with the Sound Editor, you can delete old chords
    and insert new ones. Using the SHIFTeed or uSHIFTed Cursor Up/Down key (when the
    NOTE column is highlighted), you can delete chords from the bottom of the table
    on up. As in the Sound Editor, what is actually happening as the screen scrolls
    is the chords are being erased. Remember that using this function deletes all
    of the notes from the bottom of the table up to the point where you stop pressing
    the Cursor Up/Down key. When you use the delete function, you''re also erasing
    chords, not just single notes. Otherwise, the music may be distorted.


    **Sharps and flats.** Placement and use of sharps and flats are the same with
    the Chord Editor as you saw in the Sound Editor earlier. Refer to Figures 2-1
    and 2-2 for the keys which select sharps and flats. The explanation of their use
    and display in the table was covered in the documentation for the Sound Editor.
    Take a look at that if you forgot how to access sharps and flats on the keyboard.


    **SAVE/Loading music.** The SAVE and LOAD functions have not been changed. The
    computer will ask you when you wish to save or load a song, and the music will
    be stored in exactly the same way. Since the Chord Editor saves three notes at
    a time, however, music stored on it will not be readable by the Sound Editor.
    Nor will music saved by the Sound Editor work with the Chord Editor.


    **Hints and tips.** Keep these things in mind as you''re using the Chord Editor.
    They''re almost identical to the hints listed under the Sound Editor explanation.
    If you''re entering a large number of notes, there will be times when the last
    note key you pressed will stay highlighted. If you press any of the note keys,
    or even one of the function keys, nothing will happen. Again, there''s nothing
    wrong. The program is just taking time to place all the values you entered into
    the computer''s memory. Wait for the highlighted key to return to its normal display.
    Then you can continue to add more chords, or play the song, or save it to tape
    or disk. It''s a good idea to avoid pressing keys while the program is storing
    values; otherwise, it will read the keyboard buffer and place as many notes in
    the song as the number of times you hit that key. You''ll have to delete these
    extras if that happens.


    If you want to delete a chord or chords, but still want a


    81'
