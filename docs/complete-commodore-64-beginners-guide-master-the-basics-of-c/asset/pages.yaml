- img_proc: true
  md: '# CHAPTER


    # 3

    # Sound Effects


    Up to now, you''ve been seeing how the features of the Commodore 64 SID chip operate
    and how to apply them to create simple sounds. Using the sound control registers,
    you''ve learned to set various memory locations with values, producing sound.
    The "Sound Editor" and "Chord Editor" in the previous chapter gave you tools to
    make that process easier.


    In this chapter we''ll explore methods of using the SID chip to manipulate sounds
    to make them imitate nature. You''ll be using only the functions discussed so
    far, so if you''ve read through the first two chapters, as well as the glossary
    in the Introduction, you''re ready to begin.


    We''ll look and listen to four different sound types: hard sounds, soft sounds,
    slowly rising tapered sounds, and slowly falling tapered sounds. We''ll examine
    a number of examples of how these sound types can be used to produce special sound
    effects, and how they can be combined to make entirely new sounds—sounds that
    nature cannot create, but by your computer


    # Hard Sounds


    Definitions sometimes have to be somewhat arbitrary. In order to separate the
    different kinds of sound effects, we''ll just do that. Let''s define hard sounds
    as those sounds that both begin and end abruptly. Another way of saying this would
    be to say they have rapid attack, decay, and release rates. The sounds climb to
    maximum volume quickly, fall to the sustain volume level as fast as possible,
    and drop from that volume rapidly. They may be short, as in Program 3-1, or long,
    as shown in Program 3-2. Type in and RUN these short routines to hear examples
    of the characteristics of a hard sound.


    85'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 3

    Sound Effects


    # Program 3-1. Short Beep


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


    ```

    10 FOR R=54272 TO 54296:POKER,Ø:NEXT      :rem 24

    20 POKE 54296,15                               :rem 45

    30 POKE 54275,8:POKE 54277,Ø:POKE 54278,240   :rem 0

    40 POKE 54272,47:POKE 54273,25                :rem 47

    50 POKE 54276,65                               :rem 51

    60 FOR R=0 TO 300:NEXT                          :rem 187

    70 POKE 54276,64:POKE 54296,Ø                    :rem 3

    ```


    # Program 3-2. Longer Beep


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


    ```

    10 FOR R=54272 TO 54296:POKER,Ø:NEXT      :rem 24

    20 POKE 54296,15                               :rem 45

    30 POKE 54275,8:POKE 54278,240   :rem 0

    40 POKE 54272,47:POKE 54273,25                :rem 47

    50 POKE 54276,65                               :rem 51

    60 FOR R=0 TO 1000:NEXT                         :rem 233

    70 POKE 54276,64:POKE 54296,Ø                    :rem 3

    ```


    You''ll notice that the only difference between these two programs is in line
    60, which is the sustain delay. Program 3-2 plays twice as long because its delay
    is longer. The attack/decay rate is set to the fastest possible in line 30 of
    both routines by POKing the attack/decay register (location 54277) with 0. The
    release is also set to the most rapid rate; POKing the sustain/control register
    (location 54278) sets the value to maximum (15*16=240), but the release is 0,
    indicating that the sound falls off quickly after the sustain.


    You can make hard sounds change volume in the middle of play, as Program 3-3 does.


    # Program 3-3. Down and Up Sounds


    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.


    ```

    10 FOR R=54272 TO 54296:POKER,Ø:NEXT      :rem 24

    20 POKE 54296,15                               :rem 45

    30 POKE 54275,8:POKE 54277,Ø:POKE 54278,240   :rem 0

    40 POKE 54272,47:POKE 54273,25                :rem 47

    50 POKE 54276,65                               :rem 51

    55 FOR T=0 TO 300:NEXT                          :rem 193

    60 FOR R=15 TO 1 STEP --3:POKE 54296,R:NEXT      :rem 74

    65 FOR R=1 TO 15 STEP .3:POKE 54296,R:NEXT      :rem 34

    70 POKE 54276,64:POKE 54296,Ø                    :rem 3

    ```


    86'
