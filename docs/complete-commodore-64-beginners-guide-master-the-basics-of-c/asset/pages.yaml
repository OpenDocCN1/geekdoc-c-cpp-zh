    Background music. Music is one of the most noticeable aspects of sound in many
    programs, especially in games. The type of music and its pace have an important
    effect on what the player plays the game. What would Pac-Man be without its background
    music score? When you''re creating graphics that move about the screen, music
    can add a professional touch to the display. It''s not necessary, but it will
    certainly enhance the program.


    Music played as background to animation can be synchronized to animation or it
    can play independently. Of course, it''s easier to create a musical piece that''s
    synchronized to the animation, because it requires no additional timing. All you
    need to do is change the notes each time you update the animation, much like we
    did in the helicopter demonstration.


    Synchronizing music and animation can be very effective because both become tightly
    interwoven. One easy way to do this is by simply marking time with the display
    as the music is played. Program 5-8 is a good example.


