    # Figure 1-3. Attack, Decay, Sustain, and Release


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_38_0.png)


    +   - **Attack.** A function of time, the *attack* of a note determines how quickly
    a sound reaches its selected volume. You can set the attack to last from two milliseconds
    to almost eight seconds. An attack rate of 0 means the sound begins at full volume.

    - **Decay.** *Decay* is also a function of time expired. After the initial attack,
    the volume decreases until it reaches the level specified by the sustain level.
    Decay indicates how long this process lasts. A fast rate drops the sustain quickly
    from the high point of its attack to the sustain, while a slow rate draws it out.

    - **Sustain.** *Sustain* is the only portion of the ADSR that is not time-oriented,
    sustain actually a volume setting. The value you select for this function determines
    the volume level reached after the decay. For instance, if the sustain is set
    at 12, the decay will drop the volume from level 15 to level 12. The note stays
    at this volume until you clear the gate bit. In other'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 1.

    SID: The Sound Interface Device


    words, you can sustain a note indefinitely simply by not clearing the gate bit.
    You can use the sustain setting to set different volume levels for each of the
    64''s three voices. Since the volume control at location 54296 is a master control,
    setting the volume for all voices, using the sustain is the easiest way to control
    volume when you''re creating sounds multiple.


    +   * Release. Yet another function of time, release is the final descent of the
    sound voice. Short release time drops the note off quickly, while a longer release
    time lengthens the fall of the note.


    The SID chip is able to control the ADSR separately for each voice by using two
    registers. For example, location 54277 controls attack and decay for voice 1,
    while location 54278 controls the sustain and release. All you have to do is put
    a value in the register(s) and the SID chip takes care of the rest.


    If you were to look at one of the ADSR control registers (there are actually six
    of them—two for each of the Commodore 64''s three voices), you would find the
    register broken into several individual control bits, each of which has a specific
    function. Figure 1-4 shows voice 1''s control register for attack and decay at
    location 54277.


    # Figure 1-4. Attack/Decay Control Register Decay Control Register


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_39_0.png)


    As you can see, the register is divided into two sections (bits 4–7; also called
    the high nibble) the upper section controls the length of the attack and the lower
    (bits 0–3; also called the low nibble) controls the length of the decay. Since
    there are only four bits in each nibble, the values you can use range from 0 to
    15. The decay, being the low nibble, will accept those numbers directly as values.
    To change the length of the decay, all you need to do is enter a value in the


    12'
