    60 POKE 54277,POKE 54248,240 :rem 47

    70 REM - GET TIMING FROM RHYTHM TABLE :rem 197

    75 READ L,H,T,TT:IF=999 THEN END :rem 159

    77 REM - POKE T VALUES INTO VOICE 1 :rem 149

    80 POKE 54272,L: POKE 54273,H :rem 245

    90 REM - ENABLE T REGISTER :rem 233

    100 POKE 54276,33 :rem 90

