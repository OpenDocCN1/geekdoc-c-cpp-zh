    Noise is the least waveform available on the 64. It generates random waves, creating
    a raspy, rough sound. It can be used for many different sound effects, and as
    a component in music. Depending on the frequencies you select, it can seem anything
    from a high hiss to a low rumbling sound. Often called white noise, it''s especially
    useful in game sound effects such as explosions, crowd rows, or sputtering engines.


    A noise waveform is certainly not symmetric, and it can appear in many forms,
    one of which is shown in Figure 1-12.


