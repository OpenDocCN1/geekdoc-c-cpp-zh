    5 REM INITIALIZE SOUND REGIST -- :rem Ø

    6 REM :rem 26

    10 FOR R=54272 TO 54296:POKER,Ø:NEXT :rem 24

    11 POKE 54296,15 :rem 45

    12 POKE 54277,:POKE 54278,240 :rem 44

    13 POKE 54273,21 :rem 39

    ```


