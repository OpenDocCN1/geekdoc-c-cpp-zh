    you''ll have a backup copy of the original version of the song

    ta tape or disk. If you liked the original better, you can just

    load it and go from there.


    As the Chord Editor is listed, it uses the pulse waveform,

    with attack and sustain set to 0, the sustain/release control

    register set with a value of 240. You can change the waveform

    used by altering lines 1010 and 4440 in the program. Just

    change the value POKEd into the three waveform control reg-

    isters, locations 54276, 54283, and 54290. You can even add

    an attack/decay value in lines 6, 7, and 8, where the program

    initializes control registers for the three voices.


    You now have two utilities in hand that will make it much

    easier to create single or multivoiced sounds on the Com-modore 64. You''ve even
    seen how to create harmony and dis-harmony. Now that you have a firm idea of how
    to create

    sound on the 64, what can you do with that knowledge?

    Of the most common uses of sound on this computer is creat-ing sound effects,
    both duplications of natural sounds and new

    artificial effects. That''s what the next chapter will cover—how

    to create sound effects. You''ll quickly have a small library of

    sound effects. And that''s not far from creating your own.


