    Bouncing sprites. Sprites, like characters, can be put anywhere on the screen.
    However, since sprites do not use screen memory locations for placement, you not
    need to PEEK to find them. Sprites can be detected in another way, which is actually
    easier to use than PEEKing and POKEing. By looking at two memory locations called
    sprite collision registers, which signal collisions between two sprites, or between
    a sprite and a character, you can tell if a sprite has bumped into something.
    You don''t really need to know how this works, since it''s a matter of sprite
    control, not sound. The important thing is that you can use the sprite collision
    registers to combine sound and graphics.


