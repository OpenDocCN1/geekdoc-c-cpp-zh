  md: '# Music and the Sound Editor


    pressing the key, you can erase your entire tune. Keep in mind as you use it.

    If you are beyond the tenth note in your song, the table will scroll backwards
    until it gets to the note you want to change. Remember that as the table scrolls
    backwards, what is really happening is that the notes are being erased.


    Sharps and flats. In addition to the 14 notes obtained by pressing the appropriate
    keys, there are 10 other notes (called sharps or flats) that can be accessed by
    pressing the SHIFT key and a note key together. Figure 2-1 shows the positions
    of the sharps on the keyboard.


    # Figure 2-1. Sharp Key Placement


    | C# | D# | F# | G# | A# |

    |---|---|---|---|--|

    | 1 | 2 | 3 | 4 | 5 |

    | 6 | 7 |


    | C# | D# | F# | G# | A# |

    |---|---|---|---|--|

    | Q | W | E | R | T |

    | U |


    Notice that the sharps are C#, D#, F#, G#, and A#. The notes E# and B# are not
    listed on this musical scale. This is because a sharp note is one that is half
    step higher than the note it follows, and a flat is one-half step down. Since
    the note F is half a step above E and the note B is half a step below C, there
    are no corresponding sharps or flats to display.


    Figure 2-2 shows the positions of the flats available on the keyboard. Comparing
    this figure with Figure 2-1, you''ll notice that the sharps and flats are accessed
    with the same keys. Remember that a sharp is a half step up, while a flat is a
    half step down. Thus Db is the same note as C#. When you select a flat, it will
    show in the table on the screen as a sharp. To determine the flats, refer to the
    figure below.'
