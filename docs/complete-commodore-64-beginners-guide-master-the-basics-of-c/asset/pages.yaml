    Line 60 may seem confusing. Actually, it''s the heart of the sound routine. It
    produces the values for the high and low pulse width registers POKEd in line 80.
    First of all, a NEXT loop, ranging from 0 to 4095, is established, with a STEP
    command of 8. The maximum number two-byte pulse width register can contain is
    4095. Each time the loop, the variable T increments by 8. H, the variable for
    the high pulse width register, is the integer of T divided by 256. L, the variable
    for the low pulse width register, is equal to T-(H*256). If T equals 256, for
    instance, H equals 1 and L equals 0. Note that since we''re dealing with pulse
