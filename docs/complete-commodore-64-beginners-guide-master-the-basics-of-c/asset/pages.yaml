  md: '# Music and the Sound Editor


    lighted, that note will be read into memory once the program hands control back
    to you. It''s a good idea to avoid pressing keys when the program is storing values;
    otherwise, it will read the keyboard buffer and place many notes in the song as
    the number of times you hit that key. You''ll have to delete these extra notes
    if that happens.


    If you want to delete a note or notes, but still want a copy of the song as it
    exists, be sure to tape or disk it. When the screen restore, you can delete notes
    and listen to the new tune. If you don''t like your alterations, at least you''ll
    have a backup copy of the original version of the song on tape or disk. If you
    liked the original better, you can just load it and go on from there.


    As the Sound Editor is listed, it uses the pulse waveform, with attack and sustain
    set to 0, the sustain/release register set with a value of 240. You can change
    the waveform by altering lines 1010 and 4440 in the program. Just change the value
    POKED into location 54276. Adding an attack/decay value in line 3, where the program
    initializes several registers, would also change the sound of the notes as you
    enter them, as well as when you play back the entire song.


    # Harmony and Disharmony


    To produce harmony in music, it''s necessary to play two or more notes at the
    same time. Fortunately, the 64 has the ability to play up to three notes simultaneously.
    Each of these three voices has a similar set of control registers, giving you
    three groups of seven registers each.


    Up to this point you''ve used only the first voice (control registers 54272–54278).
    The examples in the next section will use both voice 1 and voice 2 (registers
    54279–54285).


    Playing two notes at once. When two or more notes are played together, the tones
    blend and become more than they were individually. If the sound produced by the
    combined tones is pleasant, they are said to be in harmony. Program 2-7 demonstrates
    a harmonic sound.


    # Program 2-7. Harmonious Sounds


    ```

    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.

    1 REM *** MUSICAL NOTE DATA *** :rem 111

    2 REM :rem 22

    3 DATA 195,16,195,16,400,24,14,24,14,200,47,11,47,11,800 :rem 175

    ```'
