  md: '# CHAPTER


    # # 1

    SID:

    The Sound Interface Device


    The Commodore 64, like other computers, operates on numbers. It accepts numbers
    as input, and it produces numbers as output.


    Since the 64 outputs only numbers, you may wonder how it can make sounds, or even
    how it produces the video display (television picture) every time you turn it
    on. The answer is simple: The pictures and sound that the computer produces are
    numbers. The computer has memory locations that store the numbers that create
    the picture and sound. It then uses some special devices to convert those numbers
    into sound and pictures.


    There are two such devices which the 64 uses to convert numbers into sound and
    pictures. Pictures are processed with a device called the VIC-II chip, and sounds
    are created using the SID (Sound Interface Device) chip.


    The SID is capable of producing three voices at the same time and 65,536 different
    pitches within a full octave range. In addition to that, the SID allows you to
    control the actual shape of the sounds it produces using filtering and waveform
    control.


    It''s almost like having a music synthesizer built into the computer. Much more
    sophisticated and versatile than other computers'' sound-creating devices, the
    Commodore 64''s SID gives you an amazing range of choices when it comes to producing
    sounds and music. Because of that, it''s something more complicated creating sounds
    on the 64. You have to know how to access and manipulate the various control'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# SID: The Sound Interface Device


    registers of SID chip. It''s not difficult, really; it just takes some time to
    learn. But you''ll soon realize it''s worth that time, for you can make the Commodore
    64 "sing" in ways no other computer can duplicate.


    # Keeping the Registers Under Control


    The way you program the SID to produce sounds by putting different values (expressed
    as numbers) into its sound control registers. The sound control registers are
    many locations, which store the numbers used to produce sound on the 64. Table
    1-1 shows the name and function of each of the sound control registers, its location,
    and the bits that can be set to manipulate that register.


    # Table 1-1. The SID Sound Control Registers


    | Sound Register Function | Memory Address | Bit(s) |

    |---|---|---|

    | Voice 1 Pitch Value (lower value) | 54272 | 0–7 |

    | Voice 1 Pitch Value (upper value) | 54273 | 0–7 |

    | Voice 1 Pulse Width (lower value) | 54274 | 0–7 |

    | Voice 1 Pulse Width (upper value) | 54275 | 0–3 |

