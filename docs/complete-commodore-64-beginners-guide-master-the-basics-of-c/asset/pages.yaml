    Waveform control registers. The waveform register has eight separate functions
    (only five of we''ve used so far) that are enabled by turning appropriate bits
    on off. The bits and their functions are detailed in Figure 4-3.


    # Figure 4-3. Waveform Control Bits


    | Bit | 7 | 6 | 5 | 4 | 3 | 2 | 1 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Bit Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Noise Waveform | Pulse Waveform | Sawtooth Waveform | Triangle Waveform | Test
    Bit | Ring Modulation | Sync | Gate Bit |


    Remember to turn the sound on, you also need to set the gate bit (bit 0) by adding
    1 to the bit value for the waveform you''re selecting. When you choose a waveform,
    then, you always POKE a total value of the waveform enabling it, plus 1. For instance,
    enabling the waveform and turning the gate bit requires a total value of 129 POKed
    into location 54276 for voice 1. This might come in later in the chapter when
    the other functions of the three waveform control registers are explained.


