  md: '# 1

    SID: The Sound Interface Device


    The pitch registers control the frequency of the note or sound and consist of
    the first two memory locations of each voice. The numbers stored in these locations
    define a binary number between 0 and 65535. Each time the count in the first location
    (the lower register) reaches 256, the extra count is carried to the second location
    (upper register). The number represented in the two registers is equal to the
    lower value, plus the upper register multiplied by 256. For instance, if the lower
    register contains a 3, and the upper register contains a 10, the value represented
    would be:


    3 + (10 x 256) = 2563


    Most of the time you will be able to use the values in Table 1-3, simply POKing
    the first number into the low register and the second into the high register.
    If you wanted to create an A# from the first octave, for example, you would use
    voice something like this:


    POKE 54272,221:POKE 54273,1


    The low register (54272) POKEs the first pitch value, and the high register (54273)
    POKEs the second pitch value.


    Using the low and high registers for each of the Commodore 64''s voices, along
    with sweeping Table 1-3, you should be able to create almost any tone or frequency
    you want. Some applications, like sweeping the scales, are a bit more difficult,
    but that will be covered later in this chapter.


