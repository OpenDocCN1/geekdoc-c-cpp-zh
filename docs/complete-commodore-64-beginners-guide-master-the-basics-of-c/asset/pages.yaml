  md: '# 5

    Putting It Together


    # How to Append DATA


    As a handy reference, here are the steps you need to go through to turn the music
    files files created by your sound editors into sections of another program.


    +   1. LOAD and RUN Program 5-10. Specify filename (with-nout .MUS extension),
    starting line, and line increment.

    2. Let Program 5-10 display nine lines of DATA, then hit RUN/STOP.

    3. TYPE NEW. Cursor to first line, then hit RETURN. Repeat for all nine lines
    onscreen.

    4. SAVE nine lines as the program file.

    5. If you have more than nine lines of DATA, LOAD Pro-gram 5-10 again, using the
    same filename, starting line, and increment. Let the screen scroll until the next
    nine lines are displayed.

    6. TYPE NEW.

    7. LOAD DATA program file created in the fourth step, cursor to the first line
    displayed on screen, then RETURN. Repeat for all other lines onscreen.

    8. SAVE DATA program file again, using “@:filename",8 or “filename.1”.

    9. When all the DATA statements are in the program file, append it to your other
    program by LOading the first program and entering the four lines of direct mode
    commands.

    10. SAVE the appended version using SAVE and RE-PLACE or a new filename.


    # Putting the DATA to Work


    If the music DATA that you''re retrieving and appending to other programs was
    made using the One-Voice Sound Editor, the DATA is in the following order:


    +   • TONE (High Pitch Value)

    • TONE (Low Pitch Value)

    • LENGTH (Of Note)

    • LENGTH (Of Pause—if any)


    You have to have a way to play the music, however. You can either refer to the
    many examples earlier in this book that READ DATA to create sounds and music,
    or you can use a routine such as this one to READ the DATA statements and play
    them back.


