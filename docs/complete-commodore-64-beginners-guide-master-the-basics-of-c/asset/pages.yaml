    T, and the fourth TT. That''s why there are so many values in the DATA statements
    compared to previous examples. Although the list of numbers in the last six lines
    of the program may seem confusing, especially if you''re just starting to use
    sound on the 64, it is the simplest way to regulate a song''s rhythm, and at the
    same time able to produce specific notes.


    If that makes of numbers makes you think creating realistic music on the Commodore
    64 is impossible, don''t worry. There''s a way to create those numbers relatively
    painless. Using a sound editor, you can come up with the values you''ll need to
    hear almost any sound or musical piece you can think of. And just such an editor
    follows.


