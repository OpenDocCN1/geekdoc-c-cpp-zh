  md: '# Introduction


    # A Definition of Terms


    One of the most frustrating things new computer users face is the incredible number
    of new words that surround computers. While the new terminology provides the experienced
    computer user with a quick and precise way of communicating complex ideas, it''s
    often intimidating to novices. The unfamiliar words and their definitions can
    make it difficult for the beginning programmer to understand explanations. Without
    understanding, it''s hard to make leap from beginner to experienced user.


    It''s almost a classic Catch-22 situation: You cannot comprehend the meaning of
    the terms without first understanding the technology, but you cannot learn the
    technology without a thorough understanding of the terms. To make matters worse,
    this book uses terms that are peculiar to two totally different technologies:
    computers and sound.


    Most reference books have glossaries that define the terms used throughout the
    text. Usually, the glossary is at the end of the book and has a short description
    of each term. For our purposes, that is simply not enough. First, the glossary
    would be found at the wrong end of the book (you will be needing these terms before
    you read the book), and second, a glossary would not be sufficiently detailed.


    In reality, although this introduction is called "A Definition of Terms," it could
    more accurately be called "A Definition of Concepts," since every word is much
    more than just a word: It is the embodiment of an idea. The descriptions of terms
    presented here will be covered again in the text of the book. It can only be hoped
    by describing the terms and concepts first as individual ideas and then again
    in the context of the book, they will be more easily understood. After all, an
    understanding of sound on the Commodore 64 is what you''re looking for.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# The Terminology of Sound


    The term ADSR is actually a combination of the first letters of the words Attack,
    Decay, Sustain, and Release. They are the four parts of each sound the Commodore
    64 makes.


    Figure 1. ADSR Envelope


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_9_0.png)


    # Attack


    Attack is the first of the four phases of a sound. It is a description of the
    way that a sound begins. For example, a sound that has a fast attack is one that
    begins abruptly. Figure 2a shows a graph of a fast attack. A sound with a slow
    attack will begin quietly and gradually increase in volume. Take a look at Figure
    2b to see a diagram of a slow attack.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    # Figure 2. Attack Rates


    +   a. Fast Attack


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_10_0.png)


    +   b. Slow Attack


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_10_1.png)


    # Asymmetrical


    The term asymmetrical refers to anything which has been divided into unequal parts.
    In the case of the 64''s sound functions, we''ll use the term to describe pulse
    waves that are unevenly divided. This is done by programming the selected voice
    with a pulse width that is either more than or less 50 percent of the total wave.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction


    # Figure 3. Asymmetrical Pulse Wave


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_11_0.png)


    # Base Line


    Sound waves are created when something vibrates. As the vibrating object pushes
    out or up, it compresses the air around it. When it pulls in or down, it creates
    a very small vacuum. This process is called compression and rarefaction. You could
    think of it as similar to the ripples made when you throw a pebble into a pool
    of water. A number of these ripples, compressions and rarefactions, make up a
    sound wave. The sound''s frequency (the number of compressions and rarefactions
    per second) and the amplitude (the size of those compressions and rarefactions)
    may vary. When we represent a sound wave, the base line is the center line for
    waveform. It''s the position where there is no compression or rarefaction. Look
    at Figure 4 to see a sample sound wave graphed on its base line.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    # Figure 4. Base Line


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_12_0.png)


    # Band Pass Filter


    A band pass filter allows a selected portion of a sound''s frequencies to pass
    through, reducing the volume of any that that may be higher or lower than the
    selected cutoff frequency. Since sounds consist of more than one frequency, you''ll
    hear only a portion of the sound''s frequencies when a band pass filter is used.
    Figure 5 illustrates a band pass filter and its effect on a sound''s frequencies.


    # Figure 5. Band Pass Filtering


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_12_1.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Beats


    Two tones that are very close together, yet not exactly the same, will produce
    a background sound that rises and falls at a rate that varies as the two notes
    become closer together or farther apart. This background sound is called the beat.


    # Cycle


    Sound waves are complete units, each of which has a beginning and an end. One
    cycle of a sound wave is a measurement taken from any point on that sound wave
    to the exact same position on the next sound wave. Figure 6 shows one cycle of
    a square wave.


    # Figure 6. A Sound Cycle


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_13_0.png)


    The frequency of a sound can be determined by counting the number of sound waves
    (cycles) that occur in one second. The frequency is then represented by the expression:
    number of cycles counted Hz


    Note: Hertz (or Hz) is a measurement of frequency. One Hertz is equal to one cycle
    per second.


    xii'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    # Cutoff Point


    Cutoff point is simply the frequency which you have selected as the point where
    the filters begin to reject ranges of frequencies. The low pass, band pass, and
    high pass filters use this point to determine which frequencies to pass and which
    to reject.


    # Chords


    Any group of three or more notes which produce a harmonic sound can be called
    a chord. While there are mathematical formulas for determining the actual frequency
    values to use, the word harmony is essentially an aesthetic term. Thus, it''s
    probably better to simply listen to the notes together and determine those sounds
    you wish to make by experimentation.


    # Decay


    Decay is the part of a sound that follows the attack. It describes the drops in
    volume between the end of the attack phase and the beginning of the sustain phase
    of a sound. A quick decay causes the sound''s volume to drop much faster than
    the sustain level. A slow decay decreases the volume less rapidly to the sustain
    setting.


    # Figure 7. Decay


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    # Discord


    Any group of three or more notes which, when played, produce a disharmious sound.
    As is the case with chords, although there are mathematical formulas for determining
    the actual frequency values to avoid, discord is essentially an aesthetic term.
    Because of their applications, disharmonic sounds are better derived by experimentation.


    # Envelope


    In making sound on the 64, a sound envelope is a specific combination of the four
    waveform components (attack, decay, sustain, and release) as defined for any given
    sound. For example, a sound that begins slowly, drops quickly, maintains a long
    sustain and then slowly drops off to silence would have a waveform envelope like
    this:


    # Figure 8. Sound Envelope


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_15_0.png)


    # Filtering


    All filters, whether they are paper filters like the ones we use to make coffee
    or electronic ones like this one, have basically the same function. They selectively
    allow one kind of thing to pass through while blocking others. Coffee filters,
    for example, allow the water and any dissolved coffee to pass through them while
    they block the coffee grounds. Electronic filters allow selected frequencies to
    pass while rejecting or blocking others.


    xiv'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Flat


    A major musical scale consists of the music notes C, D, E, F, G, A, and B. However,
    between these notes there are half steps which are called sharps and flats. The
    flat notes are those which are a half step below the note from which they draw
    their name.


    # Frequency


    Sound is a series of vibrations conducted through the air. The frequency of a
    sound is determined by counting the number of times the sound vibrates within
    a set period of time (typically one second). Frequency is then represented by
    the expression:


    number of cycles counted Hz


    # Gate Bit


    The gate bit is the sound control that is normally used to turn the sound on and
    off. It is found in the same memory location as the waveform control bits (for
    pulse waves, triangle waves, and so on).


    # Hard Sounds


    An aesthetic term, it usually refers to sounds that begin and end abruptly, with
    dramatic changes in volume. Beeps, blips, and clicks can be considered hard sounds.


    # Harmony


    Harmony is an aesthetic description of the way a group of frequencies sounds.
    While the actual combination of frequencies that would be considered harmonious
    varies with taste, they can be calculated using mathematical formulas. However,
    since the actual sounds produced are always subject to opinion, it is best, at
    least in most of the applications in this book, to simply experiment with different
    sounds.


    # Hertz


    Hertz represents cycles per second and refers to the rate at which a vibrating
    object or function oscillates.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    # High Pass Filter


    The *high pass filter* in the Commodore 64 allows all frequencies above the selected
    cutoff point to pass while reducing the volume of all those frequencies below
    the selected cutoff. Figure 9 shows how this works.


    Figure 9. High Pass Filter


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_17_0.png)


    # Low Pass Filter


    The *low pass filter* in the 64 allows all frequencies below the selected cutoff
    frequency to pass, but reduces the volume of all frequencies above this cutoff.
    This function is the opposite of the high pass filter.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    # Figure 10. Low Pass Filter


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_18_0.png)


    # Lower Pitch Value


    The pitch produced by each of the three voices can be any of 65,536 different
    frequencies. To produce this number of tones, the 64 uses two separate memory
    locations, an upper pitch register and a lower pitch register. The value in the
    lower register is called the *lower pitch value*.


    # Noise


    Noise is one of the four different waveforms that can be produced using the Commodore
    64 computer. Depending on the selected frequency of the noise, it can sound like
    anything from a low rumble to a high-pitched hiss.


    # Octave


    An octave is the distance between two pitches which have a 2/1 ratio with each
    other. Our musical scale is built around this relationship. A major scale consists
    of the pitches from'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    one octave to the next. Table 1-3 in Chapter 1 shows the octaves and pitches within
    each octave available on the 64.


    # Peak


    Peak refers to that point or level which marks the highest part of a waveform.


    # Pulse Wave


    A pulse wave is one of the four basic waveforms the computer can produce. Pulse
    waves rise to a maximum displacement quickly, maintain that level for a set period,
    and then fall to minimum displacement. This gives pulse waves a very clear, full
    sound because they are always at one extreme or the other. The following figure
    shows a pulse wave.


    # Figure 11. Pulse Wave


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_19_0.png)


    # Pulse Width


    In the 64, pulse width refers to the relative proportion of time that the high
    and low parts of a pulse wave are at their farthest distance from a zero point.
    The pulse width refers to the proportion of the wave which is high. By using the
    pulse control register, you can program the pulse waves with widths from 0 percent
    to 100 percent in 4096 steps. The left side of Figure 12 shows a pulse width of
    10 percent, while the right side details a pulse width of 50 percent.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    # Figure 12. Pulse Width


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_20_0.png)


    # Release


    Release is the fourth and last part of a sound. It describes the way the sound
    finally shuts off. It behaves very much like decay. A fast release could be illustrated
    by an almost vertical line immediately after the sustain portion of the sound
    envelope (illustrated by release A in Figure 13), while a slower release could
    be shown by a more gradually falling line (shown as release B in Figure 13).


    # Figure 13. Release


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_20_1.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    # Resonance


    Resonance is a special effect that can be used much as a filter, modifying the
    sounds that are produced as they are played. Resonance emphasizes the cutoff point
    of a filtered sound. This function, along with synchronization and ring modulation,
    is used to modify the shape of the basic waves produced by the Commodore 64.


    # Ring Modulation


    Ring modulation is a special effect that can be used much as a filter, modifying
    the sounds that are produced as they are played. Synchronization, resonance, and
    this function are all used to modify the shape of the basic waves produced by
    the 64.


    # Sawtooth Wave


    The sawtooth wave is one of the four basic waveforms the 64 can produce. Sawtooth
    waves rise to maximum volume slowly, and then fall again to silence quickly. This
    quick drop in volume gives them a very sharp sound. Illustrated, a sawtooth waveform
    would look something like this:


    # Figure 14. Sawtooth Wave


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    # Sharp


    A major musical scale consists of the musical notes: C—D—E—F—G—A—B. However, between
    these notes there are half steps, which are called sharps and flats. The sharps
    are those a half step above the note from which they draw their name.


    # SID


    The term SID stands for Sound Interface Device. This is the name given to the
    sound synthesizer chip in the Commodore 64. It is the primary circuit used to
    produce the three voices (and all their effects) on the 64.


    # Soft Sounds


    Another aesthetic that refers to a subjective impression of a sound. Soft sounds
    are generally thought of as those which both rise and fall slowly in volume.


    # Sound Control Register


    The 64 uses 25 memory locations (addresses 54272 through 54296) to control most
    of the sound functions for its voices. The individual control functions are each
    operated through sound control registers, which are found in these memory locations.
    The registers can be manipulated by POKEing them. These are sometimes called write-only
    registers, since you can only POKE values into them, PEEK to see what value is
    presently there.


    # Sustain


    After a sound has completed its decay, the 64 begins the third cycle, sustain.
    This portion of the sound maintains a specified volume until the sustain is gated
    off (using the gate bit in that voice''s control register). Figure 15 illustrates
    a long sustain. Sustain is not a function of time, as are the other elements of
    a sound''s ADSR. It is a volume level. The length of the sustain portion is determined
    by other methods, usually a delay loop in a sound routine or program. In a graphical
    representation as Figure 15, however, shortening the horizontal line between the
    end of decay and the beginning of the release would illustrate a decrease in the
    sustain time.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    # Figure 15. Sustain


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_23_0.png)


    # Square Wave


    The term square wave refers to a pulse waveform that has been evenly divided between
    a high portion and a low portion. This is accomplished by programming the selected
    voice with a pulse width that is exactly 50 percent of the total wave. This produces
    the fullest and loudest sound. Sometimes this is called a symmetrical wave. Refer
    to the right-hand side of Figure 12 for an illustration of a square wave.


    # Synchronization (Sync)


    Synchronization is one of the special functions used to modify the shape of the
    basic waveforms (pulse waves, triangle waves, sawtooth waves, and noise). It''s
    produced by the logical AND of two voices.


    # Tapered Sounds


    Tapered, a subjective term, is used to describe sounds that rise slowly to maximum
    volume, or that fall gradually from maximum volume to minimum volume.


    # Test Bit


    The test bit is one of the control functions in the sound registers. It turns
    the sound off when the bit is turned on and then on again when the bit is off.
    Although this bit is normally used for special applications as testing the sound
    circuits, it can also be used to control the sound without manipulating any of
    the other sound parameters.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    # # Triangle Wave


    A triangle wave is one of the four basic waveforms the Commodore 64 can produce.
    Triangle waves rise to maximum positive displacement and then fall to minimum
    negative displacement slowly. They give them a very soft sound. The graphic illustration
    of a triangle waveform is quite simple, as you can see from Figure 16.


    Figure 16. Triangle Wave


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_24_0.png)


    # # Upper Pitches Value


    The pitches created by each of the computer''s three voices can be any of 65,536
    different frequencies. To produce this number of pitches, the 64 uses two separate
    memory locations, an upper pitch register and a lower pitch register. The value
    in the upper register is called the upper pitch value.


    # # Waveform


    Waveforms are graphic representations of sound. They show how quickly (or slowly)
    the sound waves rise and fall, and optionally, their frequency.


    You can use them to analyze the different waves so you can make better use of
    the different qualities of each sound type.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # Introduction


    # # Getting Comfortable


    You''ll be seeing these terms quite often in the rest of this reference guide.
    Although the short definitions here will certainly help in understanding the terminology
    of sound on the 64, oftentimes you can best comprehend sound functions by experimenting
    yourself. In the next five chapters, you''ll see numerous example programs showing
    how sound can be created and manipulated on the Commodore 64. Changing values
    and altering parameters in these example programs can be one of the best ways
    to see how sound works on your computer. It''s only a few steps from seeing how
    a routine creates sound, by modifying it slightly, to beginning to write such
    programs. Many people learn to program this way.


    Of course, this glossary of terms is available to you as you read through the
    rest of the book. You can turn back to this section and learn the term you''ve
    just come across, but don''t quite understand.


    Becoming comfortable with these terms is important, for the following chapters
    use them extensively. It''s a jargon, certainly, but it allows explanations to
    be simple, yet complete. Spend the time necessary getting to know these terms,
    and you''ll find the rest of this reference guide much easier to follow, and thus
    use.


    # # Typing in Programs From This Book


    Before you go on, it''s a good idea if you first read Appendices A, B, and C,
    all found in the back of this book. They''ll explain how to type in the programs
    listed in this guide and are especially helpful if you''re unfamiliar with COMPUTE!''s
    listing conventions, or if you''re just starting to use your Commodore 64.


    Appendix A, "A Beginner''s Guide to Typing Programs," and Appendix B, "How to
    Type In Programs," serve as an introduction to your 64''s editing functions and
    our listing conventions. Appendix C, "The Automatic Proofreader," includes a program
    which will make mistake-free entry of your listings simple and easy. It will be
    easier to enter the programs in this book if you first read the explanation and
    type in the Automatic Proofreader found in Appendix C.


    If you look at the programs in this book, you''ll see a REM'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    statement, preceded by a colon and followed by a number, at the end of each program
    line. For instance, you might see :rem 127. Do not type in this REM statement
    or the number as you enter the program. This is the checksum number generated
    by the Automatic Proofreader program. You''ll compare the number after the :rem
    with the number displayed on your screen. Using Automatic Proofreader, you can
