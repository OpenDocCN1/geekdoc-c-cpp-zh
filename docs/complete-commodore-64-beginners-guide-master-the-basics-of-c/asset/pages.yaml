  md: '# SID: The Sound Interface Device


    If you were using voice 1, for example, and wanted to use a pulse waveform, you
    would set bit 6 of location 54276 (by placing a value of 64 in address), as shown
    in the above table.


    Bits, bytes, and nibbles. The control registers listed in Table 1-1 are used to
    access all of the sound functions on the 64. To operate all but the last two registers,
    you use the BASIC command POKE. This allows you to change the values in the registers.
    The format of a POKE command is:


    ```

    POKE M,V

    ```


    where M is a number representing a memory location between 0 and 65535, and V
    is the value to be stored in that location. The number to be stored must be between
    0 and 255.


    To get a better idea of how this works, let''s store a number in memory:


    ```

    POKE 6000,76

    ```


    Now the location 6000 contains the value 76. If you want to read that memory location—in
    other words, see what value is presently there—you''ll need to use the BASIC counterpart
    of the POKE command, PEEK.


    ```

    PRINT PEEK (6000)

    ```


    PEEK is used to examine the contents of a memory location. You have to use the
    PRINT command along with the PEEK command so the computer will display the value
    found in location 6000. Without the PRINT command, the computer would not know
    what to do with the value it found. When you press RETURN, the computer should
    display the value stored, 76.


    By using this method of placing values as well as looking to see what value is
    currently in a memory location, you can store any number in any memory address
    that is available, as long as you use values between 0 and 255.


    The reason you''re restricted to using numbers between 0 and 255 is that the Commodore
    64 is an eight-bit computer. In other words, it can accept only numbers that are
    eight binary bits long.


    While it is not the purpose of this book to explain how binary numbers and the
    64''s memory registers work, it is important that you be able to use them. If
    you need a more detailed explanation of binary numbers than what follows,'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 1

    SID: The Sound Interface Device


    you should consult a book on beginning BASIC.

    Each memory location in the 64 can store one byte, which

    in turn is made up of eight bits (binary digits). The eight bits

    in each byte are numbered, starting with 0 on the far right,

    ending with 7 on the far left. A byte, then, would look

    something like this:


    # Figure 1-1. Byte’s Bits


    | Bit | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|-|

    | Byte | | | | | | | | |


    Each bit in this sample byte has its own individual value.

    If the bit is set (the bit has a 1 stored in it), that value is added

    to the rest of the on (another term for set) bits in the byte. If

    that bit has a 0 stored in instead, it’s said to be off, or not

    set. Then the value of that bit is 0. The bits’ values in a byte

    are given in the following table:


    # Figure 1-2. Bit Values


    | Bit | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|-|

    | Bit Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    Bit 0’s value when it’s set (a 1 is stored there) is 1. Bit 1’s

    value is 2 when it’s set, 2’s value is 4, and so on. You’ll

    notice that each succeeding bit as you move to the left has a

    value exactly double of the previous bit. As long as you

    can remember that, the values are easy to recall.

    Earlier, we said that the numbers placed in the 64’s mem-

    locations had to be between 0 and 255. Remember, that is

    the range of possible values on an eight-bit computer like the

    Commodore 64. But how are those numbers created? With the'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 1

    SID: The Sound Interface Device


    bit values in a byte, by setting (placing a 1 in that bit) some bits, and leaving
    other bits off (by placing a 0 in that bit). The total value of all set bits becomes
    the value stored in that memory location''s byte.


    For example, let''s look at the binary number 0:


    ```

    00000000

    ```


    This represents a single byte in the 64. All eight bits contain zeros. Not one
    of the bits has been set or is on. To show the binary number 1, you''d have to
    do set one bit, bit 0. Bit 0, you''ll recall, had a value of 1 when it was set.
    Binary number 1 would look like this:


    ```

    00000001

    ```


    Setting both 0 and bit 1 would give us a different value. All you have to do is
    add the bit values (see Figure 1-2) together for all the bits that have been set.
    1 (bit 0) + 2 (bit 1) = 3. Binary number 3 would thus look like:


    ```

    00000011

    ```


    Now look at the number 255 (as it is stored internally in the computer):


    ```

    11111111

    ```


    All the bits have been set by storing 1''s in them. Adding together all the bit
    values gives you a total of 255 (128+64+32+16+8+4+2+1=255). If you tried to add
    anything to this, the number would overflow, since all the bits are filled. That''s
    why you cannot save a number greater than 255 in any single memory location.


    (Of course, you can store larger numbers in the computer, but they are stored
    as several bytes which are then combined to make larger numbers.)


    Clearing the registers. Clearing the registers should be the first step in every
    sound routine you write. You do this because there is no way to determine what
    values are stored in any of the sound registers. They are sometimes called write-only
    registers, although you can write to (store numbers in) them, you cannot read
    them. In other words, PEEKing to these registers will not give you a correct value.
    All you''ll see displayed will be 0''s. You can try this yourself by entering
    the following one-line program and then typing RUN.


    8'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# SID: The Sound Interface Device


    ```

    10 FOR I=54272 TO 54296:PRINT PEEK(I):NEXT

    ```


    A column of 0s will show on the screen. Even if you enter a value to one of the
    registers by POKEing a value into it (such as POKE 54272,32), the above one-line
    program will still show that only 0 values are present.


    By clearing all of the registers (POKEing them with zeros), you make sure that
    you will not have any incorrect values in any of the sound registers. It''s a
    good habit to get into when you''re programming sound on the 64.


    # Making a Sound


    Although the process of making sound with the SID is some-complex, it does not
    have to be difficult. After you''ve cleared the sound registers (see the description
    earlier for that process), there are several steps you should follow when you
    create any sounds on the 64, even the simplest sound:


    **Volume.** The sound control register at location 5429 controls the volume, which
    has a range from 0 to 15. Before you set anything else, you should first set the
    sound volume. If you don''t, you won''t hearing anything when the sound is produced.


    **Attack, Decay, Sustain, and Release (ADSR).** The sixth and seventh control
    registers for each of the 64''s three voices (for example, locations 54277 and
    54278 for voice 1) determine the setting of the ADSR. Without placing values in
    these registers, the sound cannot be created. You also have to select a frequency
    or pitch for your sound or note. The first two registers for each voice control
    determine the highness or lowness of the pitch of the sound you produce. One register
    contains the lower pitch value, while the other contains the upper pitch value.
    Combined, they allow you to select any of 65,536 frequencies. Table 1-3 shows
    the actual numbers you need in order to produce a particular note (the lower and
    upper POKE values) and the frequency of that note.


    **Waveform and gate enabling.** There are four possible waveforms you can choose
    from the Commodore 64 by POKEing an appropriate value into the fifth register
    of each voice. Pulse waveforms can create a variety of sounds because other registers
    (called the pulse-width control registers) determine its shape. The triangle waveform
    produces a soft, almost subdued sound, while sawtooth waveforms create a sharper,'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# SID: The Sound Interface Device


    more twangy sound. The fourth waveform, noise, can vary from a high hiss to a
    low rumble. After selecting the waveform, however, you also have to turn the gate
    bit on, which is done simply by setting 0 in waveform control register to 1. If
    you don''t turn the gate bit on, you won''t hear the sound, no matter what waveform
    you choose.


    Loop to sustain the sound. If you want to hear the note for any length of time,
    you''ll need to insert a FOR-NEXT delay loop in the sound routine. This loop keeps
    the sound or note playing at the sustain volume for the amount of time you want.


    Gate bit disabling. Finally, to turn the sound off, you''ll disable the gate bit
    (found in the same register as the waveform control) by setting bit 0 to 0.


    Let''s take a look at each of these steps in turn, explaining what you must do
    in order to create a sound on the 64. Then we''ll actually create some sounds,
    modifying them by changing values in some of the control registers.


    The volume control on the 64 is handled through the first four bits of address
    54296. Values ranging from 0 to 15 can be POKEd in this location to set different
    levels of sound. A value of 0, however, means that the volume has been turned
    off. Since there''s only one register to control volume, all three voices will
    play at the same level. One way to get around that is to set the volume note by
    note. You''ll see how to do that in this chapter.


    Attack, Decay, Sustain, and Release (ADSR) are the names given to the four sections
    of the sound envelope. By altering the registers that control these functions,
    you can significantly change the sound produced by the 64. Look at Figure 1-3
    for an illustration of a sound envelope and the pattern of attack, decay, sustain,
    and release.


    To understand the ADSR of a sound, it''s probably easiest to think of what a sound,
    such as an explosion, is like. The sound begins quite loud, and dies down quickly;
    its volume rapidly increases, stays at that level for a moment or two, and then
    falls off dramatically. The explosion sound lasts only a few seconds. You can
    think of all this process of getting louder, eventually softer, as the ADSR of
    the note. Each sound, whether natural or artificial, has its own envelope made
    up of an


    10'
