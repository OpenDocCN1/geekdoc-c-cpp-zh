  md: '# 1

    SID: The Sound Interface Device


    The first tone produced by this routine is symmetrical, but the second tone is
    not. That’s because the pulse width is first set to 50 percent in line 60 by POKEing
    8 into the upper half of the two-byte pulse width register. Remember that the
    total value of the registers is the lower half value added to the upper half value
    multiplied by 256 (Lower value + Upper value * 256)). In this routine, only the
    upper register (location 54275) is used. Then, in line 126, the pulse width is
    changed, so that a value of 14 is POKEd into the upper register. That gives you
    a total of 3584 (14*256), or a pulse width of 87.5 percent. In other words, that
    percentage of the wave is high, or above the base line volume. If you graphed
    that second tone, it would look like this:


    # Figure 1-9. Asymmetrical Pulse Waveform


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_56_0.png)


    Triangle waves, as their name implies, look like the tops and bottoms of triangles,
    just as symmetrical pulse waves look like the tops and bottoms of squares. They
    are always symmetrical and produce a very soft, almost subdued sound. Setting
    bit 4 of the waveform control register turns on the triangle waveform generator.
    Normally, you’ll set both the triangle waveform and the gate bit by POKEing 17
    into the control register. Type in and RUN Program 1-7, which demonstrates a triangle
    waveform.


