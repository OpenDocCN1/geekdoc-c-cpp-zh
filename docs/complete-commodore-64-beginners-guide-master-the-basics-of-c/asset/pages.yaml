    register that is between 0 and 15 (decimal). The larger the number, the longer
    the decay.

    You also have a range of 0 to 15 available when it comes to setting an envelope''s
    attack rate. However, since it''s the high nyble, you have to do some multiplication.
    To obtain the number to enter, you need to multiply the attack value (0–15) by
    16, and POKE that total value into the register. To use both an attack and a decay
    at the same time, add the two values and POKE in the total. For instance, if you
    wanted an attack value of 8 and a decay of 9, you would figure the total like
    this:


    ```

    (8 × 16) + 9 = 137

    ```


    That''s the sustain and release set in the same way, only using the seventh register
    of each voice. The release rate is set by the low nyble (bits 0-3), using values
    from 0 to 15. The sustain level is set in the same way as attack, by multiplying
    the volume by 16. Adding the release and sustain values together and POKEing the
    total into the register set both functions.

    You can eliminate the multiplication necessary for the attack and sustain rates
    by referring to Table 1-2. It shows the values for decay and release as well.


