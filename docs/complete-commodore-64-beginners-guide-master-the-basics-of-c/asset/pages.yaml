    75 READ L,H: IF=999 RESTORE:GOTO 75

    77 REM POKE TONE VALUES INTO VOICE 1 :rem 119

    80 POKE 54272,L: POKE 54273,H          :rem 245

    90 REM      ENABLE REGISTER            :rem 233

    100 POKE 54276,6                       :rem 95

    105 REM      INCREMENT/TEST VOLUME CONTROL:rem 225

    110 V=V-I:IF V<0 THEN I=I*-1         :rem 164

    110 REM      PLAY TONE FOR 1/8 SECOND   :rem 119

    120 FOR R=0 TO NEXT:NEXT                  :rem 237

    130 REM      TURN SOUND REGISTER OFF  :rem 228

    140 POKE 54296,6                       :rem 98

    150 REM      TURN VOLUME OFF            :rem 208

    160 GOTO 75                             :rem 60

    165 POKE 54295,Ø                        :rem 49

    170 REM      TONE_TABLE               :rem 116

    180 DATA 195,16,194,17,208,18,23,19,30,21,95,22,1

    80,23,29,25,56,48,28,221               :rem 15

    190 DATA 29,16,31,13,34,164,31,221,29,48,155,

    26,29,25,180,23,95,22,30,21            :rem 204

    195 DATA 238,19,208,18,194,17,9999      :rem 83

    ```


    Much like the Program 1-2, this routine incorporates a volume control variable
    (V) and an incremental variable (I) to change the volume as the tones are played.
    27 initial-izes these values, and they are incremented in line 107. Instead of
    POKing a set value into 54296, in line 40 we are now POKEing the variable V instead.


    Using volume to change the nature of a sound can be done on a note-by-note basis.
    If, for example, you change the volume of a note as it''s played, you can create
    an entirely kind of sound. That''s what Program 1-4 does.'
