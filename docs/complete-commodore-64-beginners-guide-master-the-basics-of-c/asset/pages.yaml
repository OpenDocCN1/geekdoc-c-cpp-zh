    READ, the routine in line 75 RESTORES the DATA and starts again. To stop this
    routine, press the RUN/STOP and RESTORE keys at the same time.


    # Volume Adjustments


    In addition to changing the frequency of a tone, you can also change the volume
    (loudness) of a tone. The volume for sounds created by any of the 64''s three
    voices is controlled by the control register at location 54296. Values ranging
    from 0 to 15 can be POKED into this register to set the volume level. You can
    even POKE a variable, as V, into the register and change the sound within the
    routine. Program 1-3 does this.


