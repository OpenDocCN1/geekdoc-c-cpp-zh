    \ the volume falls in steps of .3,\nwhile it climbs in increments of .3 in line\
    \ 65.\n\nOften, hard sounds are most interesting when they're\nrepeated. Type\
    \ in and RUN Program 3-4 to have this effect.\n\n# Program 3-4. Repeater\n\nFor\
