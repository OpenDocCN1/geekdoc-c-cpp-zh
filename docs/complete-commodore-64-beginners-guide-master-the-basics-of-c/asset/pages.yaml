- img_proc: true
  md: '# Changing the ADSR


    We''ve already looked briefly at the ADSR of a sound envelope, and even explored
    the registers that control this important part of sound creation on the Commodore
    64. The previous example sound routines have included various rates for the attack,
    decay, release, as well as volume levels for the note''s sustain. But there are
    a few more things that should be pointed out about sound waves and their ADSRs.


    If you graphed the shape of a sound wave, it would look similar to Figure 1-6.
    A pure sound wave begins at a base level, indicated by zero in the graph, rises
    to its peak, and falls.


    # Figure 1-6. Pure Sound Wave


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_51_0.png)


    A cycle is measured from one point on the sound wave to the same position on the
    next sound wave. The number of cycles that occur each second is called the frequency.


    The volume of a note is determined by looking at how high or low the wave''s peaks
    and valleys. The higher the peaks and the lower the valleys, the louder the sound
    will be. Figure 1-7 shows a sound wave that begins loudly and becomes quiet as
    time goes on.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 1

    SID: The Sound Interface Device


    # Figure 1-7. Decreasing Sound


    ![](img/b7e54ff141dd3576dcf2195f763aacc2_52_0.png)


    In this sound wave, you could say that the attack is very fast and the decay is
    relatively slow. Remember that attack refers to the rate of time it takes the
    sound to reach maximum volume, and that decay is the rate of time it takes the
    sound to fall to its sustain level. The sound wave shown in Figure 1-7 starts
    loud, so its attack is set at a fast rate. On the other hand, it loses volume
    gradually; that its decay is set to a slower rate. All of this gives the feeling
    of a sound that can be called hard. To produce a softer sounding tone, you could
    reverse the attack and decay rates, producing a sound that has a slow attack and
    a fast decay.


    Program 1-5 creates a hard sound, one with a fast attack rate and a slow decay.
    Using voice 1, the attack/decay register at location 54277 is POKEd with a value
    of 10 in line 40. This sets attack at 0 (fast) and decay at 10 (relatively slow).
    See Table 1-2 for the values you can POKE into this register to allow for varying
    rates of attack and decay. Note that we''ve used a different waveform for this
    example. Unlike'
