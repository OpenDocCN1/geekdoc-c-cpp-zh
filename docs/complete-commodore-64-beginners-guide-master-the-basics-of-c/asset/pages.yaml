    5 POKEINT(CLR); F :rem 6

    10 PRINT IF A="FREQUENCY"; F :rem 214

    15 N=INT(F./06097) :rem 74

    20 U=INT(N/256) :rem 212

    30 L=N-(U*256) :rem 254

    40 PRINT "U=";U;"",L=";POKE 54272,L:POKE 54273,U; :rem 56

    27.33

    45 PRINT "2 DOWN \[WHT]PRESS ANY KEY TO RUN AGAIN :rem 81

    73"

    50 GETSA:IF A="$ THEN GOTO 50 :rem 50

    55 POKE 54276,32

    60 GOTO 10

