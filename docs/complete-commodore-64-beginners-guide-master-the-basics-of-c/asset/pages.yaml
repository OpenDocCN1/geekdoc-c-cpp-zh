- img_proc: true
  md: '# Music and the Sound Editor


    akin to a real instrument. A sound editor can give you that capability.

    A good sound editor should make it easy to enter notes.

    Although making the 64 play similar to something like a piano, for instance, is
    difficult, you should be able to press keys and hear the note you''ve selected.
    The pitch values for the low and high frequency control registers should display
    as you choose, and you should even be able to alter the length of the note''s
    volume, just as you did in earlier routines with FOR-NEXT plus. Entering pauses
    between notes should be simple. And you should be able to save your creations,
    as well as load previously composed pieces for possible revision. The simple sound
    editor follows, although not as complex as something might buy from a commercial
    software house, does meet all those criteria. It provides you with the tools that
    make the Commodore 64 easy to use as an instrument, and allows you to store your
    music, play it back, and even change its tune, tempo (speed), and overall characteristics.
    Once you''ve typed it and saved to tape or disk, you''ll be able to avoid much
    of the tedium of creating sound on the 64.


    # Program 2-6. One-Voice Sound Editor


    ```

    For mistake-proof program entry, be sure to read "Automatic Proofreader," Appendix
    C.

    1 REM ** INITIALIZE SOUND REGISTERS *** :rem 26

    2 REM :rem 22

    3 FOR R=54272 TO 54296:POKER,E:NEXT:POKE 54275,8:

    POKE 54276,240 :rem 243

    4 LE=100:I=1;BR=" = "PA=0;IC=0 :rem 63

    5 DIMCI(62),II(63),K(65),NO(99),LO(99),UP(99)

    LL(99),PA(99),LS(88) :rem 82

    6 K(16):K(18)=\D":K(21)=\E":K(22)=\H":K(2

    G5)=\G":K(28)=\A":K(31)=\B" :rem 1

    7 DIM D9$(999) :rem 185

    8 REM *** DEFINE MAXIMUM MUSIC KEYS *** :rem 181

    9 REM :rem 29

    10 CS=D(20)[3][RIGHT]=E3@{3}[4 LEFT]NG3

    EM3EMM(99)[6 LEFT]£{3I2 M{6 LEFT}

    EM3E3[5 LEFT]TM{D(95)[5 LEFT]S3 :rem 0

    11 K(33)=T(36):K(37)=\D#:K(24)=\E#:K(44)=\F"

    :K(50)=\G#:K(56)=\A" :rem 70

    12 K(63)="B" :rem 173

    13 K(17)=\C#":K(19)=\D#":K(23)=\F#":K(26)=\G#"

    :K(29)=\G#:K(35)=\T#"

    ```'
