    # Resonance


    The process of filtering is a subtractive one. In other words,

    you begin with a complete sound wave and then, by taking

    out various parts of it, produce a new kind of sound.

    Resonance is a process that adds to the sound wave,

    emphasizing those parts that are near to the cutoff frequency.

    When you use filters, try adding resonance. The change will

    be dramatic.


    To use resonance on the 64, you''ll need to set additional

    bits in location 54295. That location is also used to select the

    voices to be filtered, so if you want to use resonance,

