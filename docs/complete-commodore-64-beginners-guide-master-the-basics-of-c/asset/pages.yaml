  md: '# 5 Putting It Together


    To complete your creation of the program file SCALE, type SAVE"@0:SCALE",8 for
    disk or SAVE"SCALE.1" if you''re using a Datasette. You''ve got a program file
    called SCALE (or SCALE.1) which is a 15-line set of DATA statements.


    But you can''t use this program file on its own to produce music. You have to
    somehow append it to a longer program. This last step is easy, even though it
    involves a number of steps.


    First of all, LOAD the program you want to append the DATA statements to. Remember
    that your program''s highest line number should be lower than the lowest line
    number of the DATA program file. Then, in direct mode (with-out lines), enter
    the following commands, hitting RETURN after each line:


    ```

    POKE 43,PEEK(45)-2

    POKE 44,PEEK(46)

    LOAD"filename",8 (or just "filename" if using tape)

    POKE 44,8:POKE 43,1

    ```


    Substitute the name of your DATA program file for filename. Make sure the disk
    or tape that includes the DATA program file is in the drive or Datasette before
    you hit RETURN for the third line of commands. Enter the last two POKE commands.


    As long as the second program''s line numbers are higher than the highest line
    number of the first program, this method of appending programs will work. That''s
    why we use line numbers starting at 20000 for the DATA program file discussed
    earlier. After you''ve entered the above commands, SAVE the appended program to
    tape or disk. Your music DATA values are now part of your longer program or game.


    For instance, continuing with our example of SCALE, you would load the longer
    program (say "GAME", with line numbers from 1000 to 19000), then enter the first
    two lines of commands. The third line would read LOAD"SCALE",8 for disk, LOAD"SCALE.1"
    for tape. Once you''ve entered the last two POKES, you could save the appended
    program as "GAME.2", or something like that.'
