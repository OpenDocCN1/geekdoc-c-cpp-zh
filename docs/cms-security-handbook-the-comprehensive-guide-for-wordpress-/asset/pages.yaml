    # Post Install


    A module is available to assist you with your post-installation security. The
    module, called Security Review, will assist you in checking the site for issues
    and helping you correct your site’s profile.


    Figure 3-15 shows an example run on a test server.

    In this example, it has identified two trouble spots. Clicking on details in the
    first error yields a lot of information and some actions you can take, as shown
    in Figure 3-16.


    > **NOTE** Currently, this module is available for Drupal 6.x and 7.x, and you
    can download it at `http://drupal.org/project/security_review`.


    After you finish your installation, consider running this module to ensure that
