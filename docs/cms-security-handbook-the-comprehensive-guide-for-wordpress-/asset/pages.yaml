- pgno: 114
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_114_0.png)


    **Figure 3-15:** Drupal Security Review module


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_114_1.png)


    **Figure 3-16:** Detailed Actions needed


    # Permissions


    Permissions in this context are associated with the user roles. In Drupal 6, two
    roles are created, anonymous and authenticated. Drupal 7 has a third default role,
    administrator.


    However, you must observe some rules to maintain security. The Drupal roles are
    not difficult to understand. Answer a few basic rules:


    +   - Any right granted to the anonymous role is not inherited by the authenticated
    role.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '+   - Any right granted to the authenticated role is automatically shared by
    every user who belongs to that group.


    For example, if you assign a user authenticated backup duties (that is, you give
    that user permission to use the “Backup and Migrate” module), then everyone would
    automatically get the right to use that module. It’s likely that you would not
    want everyone to have that right. A better way to assign specific roles is to
    create a role specifically for backup (or other functions). Let’s walk through
    how to do this.


    Figure 3-17 shows an example of the default view of roles.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_115_0.png)


    **Figure 3-17:** Default Drupal 6 roles


    Suppose you want to add a role to handle the backup functions. To do this, go
    to the `www.YourSite/admin/user/roles` menu. Here, you click the “Add role” button,
    as shown in Figure 3-18.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_115_1.png)


    **Figure 3-18:** Adding a role in Drupal 6


    After you add the role, assign permissions to it by clicking the “edit permissions”
    option and assign the permissions, as shown in Figure 3-19.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_116_0.png)


    **Figure 3-19:** Assigning backup permissions


    You may have noted that, in this example, the backup user role has been restricted
    from having “delete backup files” privileges. You can choose any level of granularity
    you need for any role.


    The role of backup_user is now the only one with the capability to run the backup
    and restore functions. Had you given the authenticated user role the rights to
    use the “Backup and Migrate” module, then everyone with login capability could
    do backups, restores, and delete old backup files. In other words, this would
    introduce chaos.


    # ## Drupal 7


    Permissions are treated very similarly in Drupal 7, with the added benefit of
    an administrator role already being predefined, as shown in Figure 3-20. As you
    can see, with Drupal 7, you now have the capability to assign administrative tasks
    to an administrator role automatically.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_116_1.png)


    **Figure 3-20:** Default roles in Drupal 7'
  merge: -1
  img_proc: true
