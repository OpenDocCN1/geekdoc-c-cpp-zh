- pgno: 122
  md: '# ## Advanced Security After Installation


    As you have seen, many of the open source CMSs have a number of security add-ons
    available. Take the time to review all the tools available for your particular
    CMS to ensure you are safe.


    On the commercial front, one tool that does a good job of protecting the PHP-based
    CMSs against most attacks is *SecureLive* from *SecureLive.net*. It works with
    Joomla!, Drupal, and WordPress. It offers a number of very strong security features
    to help defend against hackers, and has a site report card to help you isolate
    other issues that could result in successful attacks.


    Other good security measures to consider deploying are *mod_security* and another
    open source product, *ConfigServer Firewall* (available from *www.configserver.com*).


    The key is to look at all your options (both Open Source and commercial) to ensure
    that you are not dependent on a *single* product, but rather can layer your defenses.


    # ## Cleanup and Verification Before Going Live


    As a general rule, you should ensure that any installation files have been removed,
    temporary accesses have been changed, and so on, before you go live. Following
    is a checklist of things to do before you go live:


    +   - Remove administrative access to any non-administrative personnel.

    +   - Make a clean backup of the **new and pristine** site.

    +   - Remove installation files (where appropriate).

    +   - Ensure that any temporary files are removed.

    +   - Double-check file and directory permissions.

    +   - Verify that your design specifications have been met before making a final
    payment to a third-party developer.

    +   - Record passwords (after you have changed them **all**) in a safe place.

    +   - Copy the database to a separate location.

    +   - Make a list of all third-party add-ons (that is, plug-ins, extensions, add-ons
    (Plone), themes, templates, and modules).

    +   - Double-check to ensure your CMS application is at the latest version before
    you launch.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Summary


    In this chapter, you learned about some of the business decisions involved with
    CMS selection that are often overlooked, decisions such as cost, supportability,
    and complexity. You learned about two different methods to set up a development
    environment, and how to do some planning on paper before you start.


    You learned about installation for all four CMSs covered in this book in the context
    of security, including a generic setup and some post-installation tips. You learned
    about some security tools (both free and commercial), and how to clean things
    up before you go live.


    Chapter 4 takes a look at how to review the security on your existing site, a
    process known as baselining.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# CHAPTER 4


    # Baselining Your Existing Website


    In any business operation, you certainly want to consider both man-made and natural
    disasters that could impact your IT functions. You should create a matrix to identify
    what threats exist in your operation, the level of impact they could have, and
    what the plan of action is. This is known as the *baseline*.


    In a phrase, this is an analysis of the impact statement to your business — that
    is, what the loss or reduction of availability of an IT system would have on your
    business. Out of this, you’ll be able to mix the risk management into your planning.


    A very simple example of a baseline report could involve the server environment
    for your office. You would be concerned about power, backups, and cooling. You
    should also be concerned about the uninterruptable power supply (UPS), whether
    you keep backups onsite or take them away, and the capability to cool the server
    in the summer if you lost air conditioning. Table 4-1 shows what the baseline
    report for these concerns would look like.


    **Table 4-1: Sample Baseline Report**


    | SERVER | CONCERNS | THREAT LEVEL AND RECOMMENDED ACTIONS |

    |---|---|---|

    | Primary server | Power | *Medium* — In the event of a power outage, the systems
    can run about 20 minutes on the battery-powered UPS. Ensure that the shutdown
    script runs properly when UPS switches to battery. |


    *Continued*'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Table 4-1 (continued)


    | SERVER | CONCERNS | THREAT LEVEL AND RECOMMENDED ACTIONS |

    |---|---|---|

    | Server Room | Cooling | *Critical* — In the event that air conditioning is not
    available in the summer, when it''s required, the server must be monitored for
    overheating. Future plans should include installing a spot cooler in the server
    room. |

    | Recovery | Backup tapes | *Low* — The tapes are stored in the server room. The
    new plan will be to keep a rotating set of tapes offsite for security. |


    This very simple example shows where some of the operational threats are for a
    system.


    This chapter shows you how to review the server and the CMS to make a determination
    of what threats exist in your site, and what mitigating factors you should employ.


    For example, you may find that you are running an older version of a CMS and cannot
    upgrade because your site''s CMS has some custom hacks (changes) made to it. The
    upgrade would cause those changes to go away. Yet, the version you are on is vulnerable,
    and you must update. In that situation, your mitigation would be a plan to move
    those changes to the new version of the CMS, test, document, and deploy. This
    might be an expensive solution, and would be time-consuming. By building your
    baseline, you''ll be able to see everything that must be updated.


    # Starting Your Baseline


    Baselining your site can yield quite a bit of valuable information. Some of that
    information will be useful to you on a regular basis. Following are some baseline
    items that are general to most sites:


    +   - *Inventory* — What is installed on your site and your server?

    +   - *Version control* — What are the versions of the installed extensions?

    +   - *Patches* — What needs to be updated?

    +   - *Security holes* — Do you have any software or settings (such as open ports)
    that may be a cause for security concern?

    +   - *Improvement of workflow* — In going through your site, do you see anything
    that is causing poor performance, such as an older (but not insecure) package
    installed on your CMS? Or do you have users with too much access?'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Determining this baseline gives you a good handle on what you are specifically
    dealing with in your site. You may have other questions and responses you want
    to add, depending on your site. The following sections take a closer look at a
    couple of items on that list.


    # Taking Inventory


    When you review your website, you may easily find third-party add-ons that you
    forgot about. Although they may be disabled on the site, they could be a point
    of attack. Alternatively, the add-on may have been installed with a valid software
    installation, but it is simply out of date and vulnerable. Either way, it’s during
    this inventory period that you can begin the baseline process by capturing all
    the data in a spreadsheet.


    At a minimum, you should capture the following information:


    +   - The version of the CMS you are currently running

    +   - Each third-party add-on that is installed on the system

    +   - Special configurations or setup instructions unique to your website

    +   - Distribution and version of the server’s operating system

    +   - Installed operating system modules such as PHP, MySQL, and so on

    +   - The version of Apache Server that is installed and running

    +   - Specifics about the skin of the CMS (themes, templates, portlets, and so
    on), including the version, the URL from where you obtained it, and so on


    Figure 4-1 shows a sample spreadsheet representing one means to input this type
    of data. By doing this, you can quickly check what should be updated or removed.
    Of course, you would add columns or rows to fit your particular environment.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_126_0.png)


    **Figure 4-1:** Sample inventory sheet'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# ## Documentation


    Documentation is very valuable. Having it will make your job easier.


    Use whatever tool works best for you when you create your baseline documentation.
    Define the format or tool you will use to capture documentation and stick with
    it. In other words, don’t change from one to another to another without good reasons.


    Your system has many areas to document. Based on your particular needs, you’ll
    know what those are. The following sections take a look at four areas that are
    fairly common to look at for your baseline.


    # ### CMS


    As mentioned, for your CMS, you should capture and record the installed components,
    extensions, modules, plug-ins, or add-ons. Capture the core CMS version information.
    Don’t forget that there are likely many settings that, if lost, would cause you
    concern. Document those settings in this report.


    Your last update should be noted as follows:


    +   - The name of the software or script

    +   - The installed version

    +   - The current version (the installed and current versions should be the same)

    +   - The date you updated it


    This information can help you when reaching out for technical assistance, planning
    upgrades to new versions, and in recovery.


    # ### Network


    Network documentation might include information for something as simple as a Wi-Fi
    router or cable modem provided by your ISP. It could be as complex as a router
    and switches.


    Although the following list will vary depending on your setup, these are some
    typical data points to capture:


    +   - Manufacturer of device

    +   - Firmware (BIOS) version

    +   - Software versions used to manage it

    +   - Telnet settings to connect to it

    +   - IP settings (internally facing and externally facing)

    +   - Subnet mask'
  merge: -1
  img_proc: true
- pgno: 128
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 129
  md: '# ### Desktops


    The data to capture for a desktop, notebook, mobile device, or other client-side
    machines is similar to what you would capture for a server.


    Ensure that the desktops and other machines have the latest updates and that virus
    scanners are enabled.


    Compile all your documentation into one system and then keep it updated. All this
    information will be something you will refer to in the other processes described
    in this book (such as disaster recovery). Make every effort to gather this data.


    # ## Knowing When to Run Your Baseline


    You''ll conduct your baseline review at two times or events:


    +   - The first is your initial baseline run, when you gather your data and get
    the site to a minimum safe standard. Doing a baseline at this time provides you
    with an initial starting snapshot.

    +   - The second is when any changes occur to your site. These may be updates
    via patching, installs (or removals) of third-party software, or recovery after
    you''ve been hacked. Doing a baseline after changes enables you to see their effects
    when compared to the initial baseline.


    # ## Identifying Areas of Trouble


    Trouble on your website and systems can occur in many forms. In this part of your
    baseline report, you identify weaknesses and correct them. This may be in an out-of-date
    extension or a misconfigured setting. The goal is to get the information captured
    and the problems removed.


    The areas of concern are the operating system (and add-ons), the CMS (and its
    add-ons), the server/hardware, and the network.


    # ## Checking the Operating System and Add-ons


    By and large, next to your CMS, the operating system is an area where you should
    focus a large amount of attention. If you are not managing the updates, or if
    your host is not, then chances are good your system will have some vulnerability
    that could affect you.


    Document the various installed applications and modules of your operating system,
    and record the information in your baseline report.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The following commands will enable you to determine the version numbers of
    the installed server modules MySQL, Apache, Java, PHP, Python, and the Linux Kernel:


    +   - *MySQL* — `mysql -v`

    +   - *Apache* — `httpd -v`

    +   - *Java* — `java -version`

    +   - *PHP* — `php -v`

    +   - *Python* — `python -v`

    +   - *Linux* — `cat /etc/*-rel*`


    > > **NOTE** Note that all of these commands require you to log in to the shell
    (SSH) on your server.


    The Linux command should work on many distributions. However, if it doesn’t work,
    the following commands will likely provide you the information you seek. These
    commands are broken down by Linux distribution:


    +   - *Red Hat* — `cat /etc/redhat-release` or `cat /etc/redhat_version`

    +   - *Fedora* — `cat /etc/fedora-release`

    +   - *CentOS* — `cat /etc/redhat-release`

    +   - *Slackware* — `cat /etc/slackware-release` or `cat /etc/slackware-version`

    +   - *Debian* — `cat /etc/debian_release` or `cat /etc/debian_version`

    +   - *Mandrake* — `cat /etc/mandrake-release`

    +   - *Sun JDS* — `cat /etc/sun-release`

    +   - *Solaris/Sparc* — `cat /etc/release`

    +   - *Gentoo* — `cat /etc/gentoo-release`

    +   - *Ubuntu* — `cat /etc/lsb-release`

    +   - *SUSE* — `cat /etc/SUSE-release`


    Again, after you obtain all of this version information, record it in your report,
    and install the current revisions of the software. Update accordingly.


    # ## Checking Third-Party Add-ons for Your CMS


    In terms of updating the internal components, the CMS itself may very well be
    the largest consumer of your time, after you are up and running. This section
    briefly examines each CMS spotlighted in this book to enable you to review installed
    third-party add-ons.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Your first important step is to remove any unneeded software from your CMS
    or server. This not only lowers the threat surface of your site, but will make
    maintaining it much easier.


    The following discussions examine some built-in tools for each CMS to identify
    what''s installed, and to verify whether it’s vulnerable or should be updated,
    starting with Joomla!.


    # Joomla!


    The Joomla! components, modules, and plug-ins all work the same way, as you can
    see in Figure 4-2. In most cases, the tool lists who the author is and the name
    of the author’s website. You can determine the core (that is, the native CMS)
    extensions versus those from a third party. The Author column contains “Joomla!
    Project” for the core extensions. These will be updated when you update Joomla!
    itself.


    | Component | Enabled | Version | Date | Author |

    |---|---|---|---|---|

    | Akeeba Backup | ✓ | 3.2.7 | Sep 2009 | Akeeba Project |

    | JCE | ✓ | 1.5.2 | 2010 | JCE Project |

    | K2 | ✓ | 1.5.0 | 19 November 2010 | JoomlaWorks |

    | Kunena | ✓ | 1.6.5 | September 2010 | Kunena Project |

    | SecureLive | ✓ | 6.2.0 | December 6, 2010 | SecureLive LLC |

    | X? | ✓ | 1.5.0 | April 2008 | Joomla Project |


    **Figure 4-2:** Joomla extension versions


    In your baseline report, list all the extensions and indicate what they are (plug-in,
    modules, components), as well as where the developer’s website is.


    > **NOTE** Some developers (such as Akeeba) offer an in-place upgrade, allowing
    you to update with ease. Noting these in your baseline report is important.


    The newest version of Joomla! (v1.6) has some features that allow for easy updating.
    For example, v1.6 allows for multiple extension installations in one package.
    This provides the capability to update a number of extensions with a single click.


    # Drupal


    Drupal has a great system for notification of updates. When a new core module
    or a contributed (that is, third-party) module is in need of an update for any
    reason, then the Drupal administrator report will let you know.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'On the Drupal site, shown in Figure 4-3, you see that Webform 6.x–3.4 is out
    of date. In fact, it states, “Security update required!”


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_132_0.png)


    **Figure 4-3:** Drupal update report


    To begin your baseline, first review the updates report and ensure that, at a
    minimum, you are up to the latest version. If you are not, take the time to update
    and record your findings in your baseline report.


    To find this report, log in to Drupal as the admin and visit the reports section
    at the following URL:


    ```

    ```

    http://Example.com/admin/reports/updates

    ```

    ```


    This provides you with a report of modules needing updating, as well as their
    version levels. Again, document your installed modules and their versions.


    The next step is to determine which of the installed modules you can remove because
    you are not using them or do not need them. To see the list, log in as the administrative
    user for your site, and visit the modules link as follows:


    ```

    ```

    http://www.Example.com/admin/build/modules

    ```

    ```


    Remove any modules that are not in use.


    Put this information into your baseline review spreadsheet. As you find updates
    or install new modules, update your baseline list accordingly.


    # ### Plone


    In the context of security, Plone is very solid. It has very few bug or security
    reports. However, performing a baseline on your Plone site add-ons and your version
    of Plone is important.'
  merge: -1
