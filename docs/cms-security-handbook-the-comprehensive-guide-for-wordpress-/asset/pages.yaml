- pgno: 82
  md: '> **NOTE** Not all merchants will interact with a QSA. For an up-to-date list
    of QSA personnel and companies, see www.pcisecuritystandards.org/pdfs/pci_qsa_list.pdf.


    All websites accepting payment by credit card are required to use an approved
    *scanning vendor* (ASV). This is a third-party company that has been certified
    to perform external vulnerability scans for merchants and service providers. The
    ASV will scan your website and your hosting server to determine what potential
    weaknesses exist. The ASV is typically contracted on an annual basis with fees
    based on services provided. Because the ASV is working from a standard, shop around
    and find the best deal. These vendors all must provide the same service.


    > **NOTE** You can find an up-to-date list of ASVs at pcisecuritystandards.org/pdfs/asv_report.html.


    The term *acquirers* refers to the bank or other financial entity with whom you,
    as a merchant, have a contractual relationship. Additionally, they may be a referred
    to as a *bank*, a *merchant bank*, a *processor*, or an *independent sales organization
    (ISO)*. They hold the ultimate responsibility for a merchant’s compliance. At
    the end of the day, you both bear the liability for non-compliance.


    You are considered a *merchant*. Merchants accepting payment over a scan terminal
    with a PIN pad may range from the dry cleaners all the way to an online e-commerce
    store.


    # Becoming PCI Certified


    Gaining PCI certification is not a simple matter. It involves several steps and
    is time-consuming. PCI compliance is required, and thus, it is very important.
    The importance comes in via financial penalties if you are breached and found
    to have been non-compliant at the time. The theft of cardholder data carries a
    large price — so be sure you stay compliant.


    > **WARNING** If you don’t have a reason to store credit card data, then don’t
    do it. Some hosting providers will store card data for you as part of their service.
    This shifts the risk from you to them.


    To help ease you into the PCI experience, let’s examine the moving parts that
    you must have in place (technically speaking) as a basic merchant.


    # Installing an SSL Certificate


    The most basic element of conducting an online credit card transaction is to purchase
    and install an SSL certificate. The SSL certificate ensures that a'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'session between the visitor and the server is encrypted. It does not mean that
    the information on the server is encrypted — only information from point A to
    point B. This prevents an eavesdropper from capturing the credit card or other
    information in flight. This is a huge source of confusion for consumers and business
    owners alike. Part of the confusion comes in the different price levels, levels
    of encryption, and other features of various certificate vendors. The SSL certificate
    is an annually renewable process, and must be installed by your host.


    # Testing by ASV


    The ASV will scan your website and server. To pass the certification requirements,
    your server and website must be up to date and “risk free.” “Risk free” means
    that the website is free from a certain category of risks.


    To achieve PCI compliance, you contract with an ASV to test your server. The ASV
    will provide you with either a passing certificate or a failure report. The failure
    report will detail the elements (such as open ports, out-of-date software, or
    other items) that are considered to be a threat. Provide your host with this report
    for remediation.


    After the host feels the threats have been mitigated, run the test again. This
    process is repeated until the website passes. This can be a frustrating process.
    If you find a host that is accustomed to dealing with PCI to start with, then
    this process will be much easier. Additionally, you must attest that the machines
    you use are in a secure facility — that is, proper controls have been put in place
    to physically guard the machine. This eliminates hosting an e-commerce site on
    your nephew’s home-built server in a basement.


    # Choosing a Shopping Cart


    Selling goods and services requires a shopping cart or other similar system. PCI
    requires that you use an approved shopping cart. These are referred to as validated
    payment applications by the PCI council. As of this writing, the PCI website listed
    377 approved vendors and 732 approved payment applications (last updated on July
    8, 2010). This can present a challenge to a new business owner. Who do you pick?


    Sadly, how to make this choice is often a “buyer beware” problem. The merchant
    providers expect that you understand all the fees and terminology. They may point
    you to “their” carts. This can lead to you paying more for a service than you
    should.


    Shop around until you find a merchant processor who will take the time to clearly
    explain the details. You should also find shopping carts that do what you need
    them to do. Because this is a book about CMSs such as Joomla!, Drupal, and Plone,
    you may want to look for carts that are both PCI compliant and work within those
    frameworks.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Let’s examine a few things to look for in a cart:


    +   - *Is it on the PCI-approved list for accepting payments?* — This question
    may not be a show-stopper, but you should still consult with your bank and find
    out.

    +   - *Does the cart have good reporting?* — As a merchant, having good reporting
    makes for knowing where you are in your business. Though not strictly a PCI function,
    having detailed reporting is a good idea.

    +   - *Does the cart have any added security features that might augment your
    PCI efforts?* — This can be any number of things, including an encrypted database,
    Captcha, and other spam deterrents.

    +   - *Does it offer download functions?* — Offering digital downloads means that
    your clients will be interacting with the cart to download. Ensuring that the
    download functions are vulnerability free will keep you on the right track with
    PCI.

    +   - *Is the cart easy to integrate with your site?* — You should find out how
    easy the shopping cart is to bolt on to your website. If it is difficult, then
    you may find an unexpected vulnerability lurking in your site.

    +   - *How often does the vendor update/upgrade the cart?* — This can involve
    an update of features, or more importantly, for vulnerabilities found. If the
    last update was years ago, look for another cart. Remember, the vendor should
    be there for you if you run into PCI trouble. A recent real-world example was
    a shopping site that, out of the blue, failed PCI compliance on the website. Tech
    support determined that it was a false positive. The ASV was able to ignore the
    failure because it did not pose a real threat. Without any support, this problem
    would have been impossible to discern quickly.


    # ## Storing Data Securely


    Storage of your data should be secure and safe. The idea is that if you store
    credit card data, specific steps surround it in terms of what you can store, how
    it should be stored, and more. If you are using a backup service, then *that service*
    must be PCI-compliant as well.


    # ## PCI Vulnerability Management Plan


    PCI requires that you have a vulnerability management program, which means that
    you must stay on top of vulnerabilities, and not wait until they are discovered
    in a scan. However, a vulnerability may occasionally be flagged by the ASV that
    is false (as shown in the earlier example) or has been fixed. This can be handled
    by what is called *compensating controls*, which are technologies or processes
    put in place to compensate for weaknesses. For example, good reasons'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'may exist as to why you fail a scan. Sometimes certain operating systems will
    patch a vulnerability, but not update the version number. The scan detects it
    as a vulnerable version. Your host should be able to provide documentation that
    shows you are “backported,” which means that the changes have been made to a software
    package, but the version is not updated. However, if the software has not been
    backported, you must patch it.


    # Avoiding Common ASV Testing Pitfalls


    You may encounter a number of problems when ASV testing, and mitigating them before
    you start the process will make things go much smoother. Here is a brief list
    of a few common issues:


    +   - Ports that are open and should be closed are a common problem in websites.
    This can be for any number of reasons, such as poor setup or being intentionally
    left open. In any case, the general rule is to close ports *not in use*. Although
    it’s a very general rule, it stands up to the test.

    +   - Having the OpenSSL be out-of-date or vulnerable on the server can also be
    a problem. In the Linux operating system, it is part of the SSL security. Updating
    it does not take long, but is often overlooked.

    +   - Because the SSL certificate must be renewed annually at a minimum, an expired
    SSL certificate will be flagged as non-compliant. Likewise a *self-signed* certificate
    is one you create and establish yourself. Although technically viable, it’s not
    acceptable for compliance.

    +   - Many means are available to block a vulnerability scan on your site. This
    is not a bad practice, because it prevents bad guys from looking for weaknesses.
    However, if your scanning company is being blocked, your site and server likely
    will fail to meet certification requirements.

    +   - Control panels (host side) that are out-of-date or not configured correctly
    can be a source of problems.

    +   - Web mail or control panel systems that are accessible from the Internet
    may require an additional SSL certificate.


    # After Certification


    Staying certified in PCI is not a one-time event. In fact, you must certify every
    quarter. This task is easily handled by a QSV who provides not only quarterly
    scanning, but on-demand scanning as well. You should scan every 30 days (or more
    often), and in the event you discover you are vulnerable, you can address it immediately.
    Staying on top of the scanning effort and catching problems as they are detected
    is important.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'You will likely have a training requirement for you and your staff to complete.
    This typically involves handling of the credit card data, refunds, disputes, and
    other items. What training you receive really depends on your merchant account
    provider. Check with the provider for specific training requirements for you and
    your staff.


    As a business, you want to grow and make a healthy profit while serving the needs
    of your customers. Staying on top of the PCI certification is a duty and an obligation.
    What this is really all about is preventing a breach of your security, and thus,
    the loss of credit card data.


    # DEALING WITH BREACHES


    Dealing with breaches is an unpleasant and costly event, one you do not want to
    experience. As a word of caution, each state in the U.S. has a different set of
    laws and penalties that govern the loss of consumer data. This book does not set
    out any legal advice. Check with your attorney to understand the regulations and
    laws you must comply with in the event your server is breached, and credit card
    or other consumer privacy data is stolen.


    Senators Tom Carper and Bob Bennett introduced the 2010 Data Security Act. This
    bill, if enacted, would affect any entity that maintains personal data of individuals,
    including financial institutions, retailers, and federal agencies. Along with
    this bill, two other bills were introduced. As a merchant, you would be very wise
    to keep apprised of these bills. Their status should be well-known by the time
    this book reaches your hands.


    > **NOTE** PCI compliance is generally good thing for all industries. It gives
    the merchant some protection, and it clearly provides the consumer some peace
    of mind. Many people, while afraid to swipe their card on a website, will have
    no problem at a gas pump or a brick-and-mortar merchant. Yet, without PCI, they
    are vulnerable in either area. Although this book is *not* a guide to PCI, the
    information has been presented to give you a bit of a taste and some guidance.
    Refer to the official PCI website at www.pcisecuritystandards.org for full guidance.


    # Domain Name System Servers


    The domain name system (DNS) is essentially the Internet’s telephone book. DNS
    is the map that browsers follow to reach websites and other computers on the Internet.
    Normally, you don’t have much worry about with DNS after it’s set up and running.
    The biggest concern you should have about DNS is maintaining the software on the
    machine and protecting it from attack.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'DNS is probably one of the most critical pieces of technology on the Internet.
    Without it, there simply would not be an Internet, only a collection of machines
    with little capability to communicate.


    This section dives into the shallow end of the DNS pool to help you learn about
    how it works, and how to protect it.


    # ## Understanding DNS


    Today’s Internet is vastly different, more complex, and more populated than the
    original implementation known as ARPANET (Advanced Research Projects Agency Network).


    Back in the day, computers would be connected point to point — in other words,
    they were connected directly to one another. ARPANET enabled the computers (early
    servers) to use a network to reach any of the other computers on the network.
    The scientists working on the system maintained a list called the host list. To
    connect, the systems would look at that list, and then discover the route. As
    the early Internet (formerly the ARPANET) grew, that list quickly became too large
    to manage. Out of that was born DNS.


    DNS is a distributed database of hosting information. In simple terms, it’s a
    giant version of the old host list. It maintains the path to all top-level domain
    (TLD) websites. The actual DNS servers themselves (known as the root servers)
    are maintained in Virginia. If any local DNS server has trouble locating a website
    for you, it can ask the root servers for the location.


    Your hosting account has a machine that serves as the local DNS. Its job is to
    keep track of your site (and others) at the host. If an attacker could fool the
    DNS server into thinking the attacker’s site was the destination for your domain,
    the hacker could take over your website.


    # ## Threats to DNS


    The DNS server is what makes our highly connected world work. It resolves the
    IP address of a server to the domain name, allowing visitors to type example.com
    rather than 10.100.10.8, which would be impossible to remember, and no fun at
    all. Because the DNS server (or name server) in a host represents websites to
    the “WWW” world, it stands to reason that maintaining and protecting it is as
    important as protecting your business or home from crime.


    Although there are likely several more threats to the DNS servers in your host,
    here are a few that could impact you:


    +   - DNS (name server) failure

    +   - Poorly maintained and unpatched DNS servers

    +   - DNS poisoning

    +   - Zone transfers'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# DNS (Name Server) Failure


    Most of the time, hosts ensure against failure of your DNS (or name server) by
    using multiple physical boxes. However, if you have DNS deployed on a single machine,
    think about how you will respond and react to a server failure.


    Using tools such as those found at www.dnsstuff.com, you can quickly determine
    whether the host has a redundant DNS server setup. Using a single server as the
    DNS exposes you to loss of that server. The effect would be your site disappearing.


    Find out from your hosting company what its plan is in case of DNS server failure.
    There have been cases where a single machine was configured for DNS. You can also
    look at online tools (such as the previously mentioned dnsstuff.com) for verification.
    You should see ns1.domainname.com and ns2.domainname.com as an example of multiple
    name servers. However, verify that they are not on the same physical machine.
    This is a very low-level concern, unless you are affiliated with an extremely
    small host.


    # Zone Transfers


    DNS servers exist to maintain both an internal and external mapping of networks,
    known as zones. The zone information about the IP addresses, machine names, and
    so on is extremely valuable to dedicated attackers. They can literally build a
    map of machines on the network. This gives them an effective edge in an attack.
    Today, although it’s not common, many badly configured servers do exist.


    Zone transfers are a means of gathering information about your infrastructure.
    The type of information that can be obtained is quite detailed if hackers can
    get in. The zone transfer is normally used to copy DNS data such as IP address,
    CNAME, name servers, and more across one or more DNS servers or backup files.
    When a zone transfer occurs, it provides all the information about the internal
    workings of your network in a text file — which is easily read by anyone.


    Preventing zone transfers is a matter of proper configuration of your firewall,
    DNS server, and ports, among other things.


    Figure 2-1 shows a list of ports on a test server. A high number of ports are
    in a state of “open” that should not be. However, in the case of a zone transfer,
    these open ports would give the attacker a place to start. Port 53 is “open” on
    this server. The attacker could potentially copy the zone files out from that
    port.


    The host should ensure that steps are taken to protect the DNS from unauthorized
    zone transfers. Following are a couple of items that you want to be aware of:


    +   - Close (depending on your DNS setup) port 53

    +   - If your host has “external” DNS servers and “internal” DNS servers, then
    port 53 should be closed. Internal DNS servers should forward their requests to
    the external server. They, in turn, should be configured to talk to the root servers.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_89_0.png)


    Figure 2-1: Ports open on a server


    # Lack of Patching DNS Servers


    One of the most (if not the most) popular DNS server software platforms is *Berkeley
    Internet Name Domain (BIND).* Like all other software systems, BIND will become
    vulnerable at some point in the future. Applying updates or patches (as you do
    with the rest of your software) is the best way to stay safe.


    As of this writing, a recent update to BIND v9 fixed a dangerous threat called
    *DNS poisoning* (discussed next). This is an example of why the host and you should
    keep up with patching.


    # DNS Poisoning


    One of the more nefarious means of attacking a website is to poison the information
    in the DNS server. Literally, this means the attacker forces the DNS server to
    accept incorrect information, and thus, the server gives out malicious or wrong
    website addresses instead of yours.


    On December 18, 2009, the microblogging service, Twitter.com, suffered a DNS server
    compromise by political activists. The hackers redirected all requests for Twitter
    to a web page on a server they controlled. They did not have to get to Twitter’s
    server to conduct this attack, only to the DNS servers.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'If you are being stalked by a really knowledgeable and determined attacker,
    the DNS server will be one of the prime targets. The DNS server is a terrific
    place to gather information about a network’s internal infrastructure, passwords,
    usernames, internal IP addresses, and much more. All of this information can be
    gained from an improperly configured DNS server. Think about it in the manner
    a criminal who might case an office before breaking in. The criminal wants to
    know where the alarms are, the exits, the cameras, and so forth. The dedicated
    attacker would view DNS in the same way.


    > **NOTE** To learn more about DNS, pick up the book *DNS and BIND, Fifth Edition*
    (Sebastopol, CA: O’Reilly, 2005) by Cricket Liu and Paul Albitz. It is one of
    the best references for DNS available.


    # Hosting Your Own Website Server


    Occasionally, you will hear about a person who is hosting a web server at home.
    As a small business, you may very well be based in a home office. Hosting a server
    at home may seem like a good idea, but it is not. You should drop that idea and
    find proper hosting.


    However, if you are a business with a technical staff, then hosting internally
    is a viable option. This brief section touches on the highlights of handling your
    own web server.


    # Getting Ready


    You first must determine what size of physical server you’ll need. If your website
    is a high-transaction store, then you’ll want to look at a fast-processing, low-latency
    drive system. If you are in a low-volume, but high-bandwidth consumption business
    (for example, a training video server), then having the proper network bandwidth
    is where you will focus your budget dollars.


    Determining your application stack, such as e-mail, web server, languages, and
    website software (for example, Joomla!, Drupal, Plone, or WordPress), will drive
    your hardware decision. Next up is the choice of operating systems. Although several
    are available, this book focuses on Linux primarily.


    Each of these decisions will change your cost model in some fashion. For example,
    Linux will cost less, because it is an open source choice versus going with a
    major company like Microsoft that has higher-priced commercially licensed choices.
    Price should not be the deciding factor. Rather, choosing the right tool for the
    right job is the correct decision.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "In the category of safety falls security and backups. The security of the network\
    \ will be handled by physical hardware such as a Cisco firewall or software firewalls,\
    \ as previously mentioned.\n\nWith the general framework laid out, let’s get started\
    \ learning about hosting your own web server.\n\n# Making Your Shopping List\n\
    \nMost low-end server hardware on the market today can accomplish what you need.\
    \ To achieve the minimum web server setup, you’ll want to look for the following\
    \ in a machine:\n\n+   - A single or dual-core CPU server\n+   - Dual network\
    \ interface cards (NICs)\n+   - RAID 1 capability with three drives (one serving\
    \ as a hot spare)\n+   - Dual power supplies\n+   - Backup software\n+   - CD-ROM\
    \ drive\n+   - 4 hour × 7 days a week × 365 days onsite service\n+   - Uninterruptible\
    \ power supply (UPS)\n\n> **REDUNDANT ARRAY OF INEXPENSIVE DISKS (RAID)**\n> \n\
    > RAID was invented many years ago, and has become standard in servers worldwide.\
    \ Different levels of RAID exist, starting from 0 and going to 5. RAID 5 is very\
    \ common in the enterprise world and is considered one of the safest. With RAID\
    \ 5, you can actually lose a single hard drive and not lose any data. RAID 1 is\
    \ also known as *mirroring*. With that configuration, you can lose a single drive\
    \ and it will continue to run. However, be sure to get that drive replaced as\
    \ soon as possible.\n\nThis list represents a fairly plain vanilla setup, and\
    \ should not be too much burden for your budget. However, perish the thought of\
    \ running internal mission-critical applications (such as accounting) on this\
    \ system. That is simply a bad idea. Keep the web server a web server.\n\nThe\
    \ next hardware components are the internal network and the Internet service brought\
    \ to you from the telephone or cable provider. This will be connected to a router\
    \ they provide to your internal network.\n\nYou’ll need to pick up a small managed\
    \ or unmanaged 10/100/1000 switch with proper connections to fit the router being\
    \ brought in. This switch connects all the machines in your office to the server,\
    \ and potentially, to the outside world."
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Note that this is a general description of your internal network, and does
    not necessarily represent a configuration that you should deploy. You must consider
    factors beyond the scope of this book for proper network configuration.


    When speaking to the Internet service provider (ISP) find out a few things such
    as its SLA, which spells out the penalties, responsibilities, and legal terms.
    Additionally, find out who is responsible for connection of the ISP’s equipment
    to your network. Most of the time, it will be you. If you do not have the in-house
    network expertise, then ask the ISP about the costs to connect it.


    # Choosing an Operating System


    Choosing the operating system to run on the web server can have a great impact
    on your operations and your budget. Your choice includes either Linux or Windows
    in this example.


    Each choice requires different skill sets of personnel to handle it. Each has
    a license choice such as open source versus commercially licensed apps. Table
    2-2 outlines a few points to help you make a decision about your operating system.


    **Table 2-2:** Considerations When Selecting an Operating System


    | COMPONENT | LINUX | WINDOWS |

    |---|---|---|

    | O/S | Free | Fee-based |

    | Web Server | Apache is free | IIS ships with server software |

    | Support | Fee-based and free | Fee-based and free |

    | E-mail | Postfix, Squirrel, Horde | Exchange |

    | Backup | Open source, commercial | Commercially available |

    | Extras/add-ons | Open source, free | Commercially available |

    | Security | Strong when configured | Strong when configured |


    As you can see, both operating systems sport equal functionality in the areas
    you are likely to need it.


    After you have made the decision about the operating system, setting up and configuring
    the machine, establishing the web server, and connecting to the outside world
    are your next steps.


    > > **NOTE** Choosing your CMS is independent of the hardware choices, and should
    not have a bearing on your decisions. The usage model of the CMS will be a bigger
    factor. An example is a high database transactions website that requires a machine
    that can support higher disk I/O to service the database requests.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# ## Ensuring Security


    Some of your security will be inherent in the network in the form of your firewall
    and other security-oriented hardware. Protecting your servers requires that you
    add on software to protect the following vulnerable areas:


    +   - Mail servers

    +   - Web servers

    +   - Web applications

    +   - Operating system

    +   - Virus prevention

    +   - Spam prevention

    +   - Physical protection of the machine and network


    Although more areas exist, these are some to pay particular attention to when
    hosting your own machine.


    # ## Patching


    Maintaining your own systems and network means that you must stay on top of patching
    on your site, server, switches, routers, and applications.


    Developing a schedule to check for and update your network will make it easier
    and keep you from falling behind. On Windows, many patches require restarting
    your machine. On Linux, while occurring less often, sometimes your server may
    require a restart after patching. The reason this is important to remember is
    that you will want to schedule that restart in off hours. Servers can take a few
    minutes to reboot and come back to a running state. During that time, your site
    will be offline.


    > > **NOTE** Chapter 7 covers patching in more detail.


    Consider strongly whether or not it’s worth it to you to bring hosting in house.
    Although the upside is that you have nearly unlimited freedom to do things the
    way you want, you also have the nearly unlimited chance to miss something very
    important because it probably isn’t your core business.


    # ## Summary


    In this chapter, you learned several important points about choosing the host
    that is right for you. The central idea is clearly to maintain a suitable level
    of security, stay within budget, and keep things easy to use and maintain. The'
  merge: -1
  img_proc: true
