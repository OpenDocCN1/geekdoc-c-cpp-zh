  md: '| EXAMPLE | DESCRIPTION | PARAMETERS |

    |---|---|---|

    | `-` | Special action flag | `C` = Compressed; `U` = Uncompressed; `T` = TAR
    compression; `-` = No action was taken |

    | `I` | Direction of transfer | `I` = Incoming (upload); `O` = Outgoing (download);
    `I` = Incomplete (didn''t work) |

    | `r` | Access mode | `a` = Anonymous; `r` = Real |

    | `admin@domain.com` | Name of user who logged in |  |

    | `FTP` | Service name (typically FTP) |  |

    | `1` | Authentication method | `0` = None, `1` = RFC931 |

    | `''*''` | Authenticated-user-ID |  |

    | `c` | Completion status | `C` = Complete; `I` = Incomplete |


    > **NOTE** You should review your FTP log files weekly to ensure that you are
    aware of what is going on. If you find entries in your logs that you know should
    not be there, then it’s time to take action. The type of entries you should look
    for are simple. If you know no one logged in, but some entries contradict that,
    then change passwords, and review your system for hacked or illegally uploaded
    files.


    # Using Tools to Assist in Log Analysis


    Now that you have a basic understanding of what you can expect to find in your
    log files, take a look at some tools that can help with the analysis of log files.


