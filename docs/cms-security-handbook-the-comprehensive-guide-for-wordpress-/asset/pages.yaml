    can then proceed to update the add-ins by following the instructions.


    After updating your plug-ins, record in your spreadsheet a list of your current
    (active and deactivated) plug-ins on the site. You can find that information by
    clicking the “All (number)” button in the Plugin section, as shown in Figure 4-6.


    Remove any unneeded plug-ins and document your remaining ones in your baseline
    report.'
