    # Status Codes


    Any time a web server serves up a request, it marks that request with a code to
    indicate what happened to that specific request. This is known as a status code.
    Status codes fall into five major classes and sub-classes. The major classes are
    all specific to certain classes of activities.


    # Apache Status Codes


    Table 8-2 can help you quickly read through your Apache logs and identify any
    issues you may be experiencing.


    **Table 8-2: Apache Web Server (httpd) Status Codes**


    | CLASS/ SUBCLASS | DEFINITION |

    |---|---|

    | **100 Series** | Informational messages instructing the client that the server
    has received the information and is continuing to service the request |

    | 101 | Continue |

    | 102 | Switching protocols |

    | **200 Series** | Success — all is well (meaning that the request was accepted
    and completed) |

    | 201 | OK |'
