- pgno: 51
  md: 'As shown in Figure 1-8, WiFiFoFum can create logs of access point locations
    as they are discovered. You can then view these logs directly on an iPhone’s map
    application, or e-mail them so that you can view them on your desktop or laptop.
    To view e-mailed logs, you can simply paste the link in the e-mail into the Google
    Maps site.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_51_0.png)


    Figure 1-8: WiFiFoFum logging mode


    > **WARNING** This tool may not be legal for all applications. It may also have
    specific restrictions on its use, based on where you are located. Consult with
    an attorney regarding the legality of using this tool if you have any concerns.


    Another means to check your premises is to see whether your site has been listed
    on www.wigle.net. This site provides a map of reported wireless access points
    found by people who reported them to the site. You can drill down to the street
    level on this map, as well as browse and search by various data points, as shown
    in Figure 1-9.


    Using the wigle.net website, you can verify whether your access point is listed.
    If you do find your wireless systems listed, you can request removal of them from
    the site’s database.'
