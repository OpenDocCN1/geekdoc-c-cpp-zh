- pgno: 177
  md: 'the perpetrators a high degree of anonymity. Tracking down the attackers is
    nearly impossible.


    How it works is the attacker sends an FTP PORT command to an FTP server that contains
    the IP address and port number of the machine (and service) being attacked. This
    file contains commands relevant to the service being attacked (SMTP, NNTP, and
    so on), instructing a third party to connect to the service. Hence, rather than
    connecting directly to the machine, it makes tracking down the perpetrator difficult,
    and can circumvent network address-based access restrictions.


    As an example, suppose that a client uploads a file containing SMTP commands to
    an FTP server. Then, using an appropriate PORT command, the client instructs the
    server to open a connection to a third machine’s SMTP port. Finally, the client
    instructs the server to transfer the uploaded file containing SMTP commands to
    the third machine. This may allow the client to forge mail on the third machine
    without making a direct connection.


    # **Privacy**


    FTP essentially sends everything unencrypted across a network. If you need to
    send information such as confidential files to a server, then you should use encryption.


    While the subject of encryption is beyond the scope of this book, you may wish
    to review www.pgp.com or www.file-encryption.net for examples of tools used for
    encryption. There are several different software packages and encryption methods
    available. It’s wise to carefully review the packages you choose before use. The
    first one listed here is a well-known commercial package.


    # **Protecting Usernames**


    One simple method to determine what usernames work, and what usernames do not
    work, is to simply deploy a bot. Standard FTP will return error code 530 after
    an attempt to provide a bad username. The rejection is what the bot will look
    for.


    When it receives that error code, the bot then obviously knows that the username
    is bad. If the username is good, the FTP server gives a response code of 331.
    If the bot gets a good username, then the attacker could try a brute force attack
    until it finds a password.


    Another strategy is to disable logins after “x” tries and block the IP address.
    Explore the options included with your FTP software to determine the best course
    for closing up this vulnerability.


    # **Common FTP Mistakes**


    Now take a look at a few common mistakes experienced with the use of FTP.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# ## Anonymous FTP


    One type of situation that has the potential to be abused is the anonymous login.
    What this means is that an FTP server set up in this fashion will accept any legitimate
    FTP connection with no or minimal authentication.


    An anonymous user can upload, download, or read any files available to it. Although
    FTP typically won’t allow you to access above a specific level, it will more than
    likely allow you access to the website itself.


    This would give the hacker the capability to upload a shell program, backdoor
    application, or viruses. Attackers often set up listeners on the server, which
    will allow them to eavesdrop on your activity. All in all, you should never allow
    an anonymous user on your FTP server.


    Ensure that you do not have anonymous users. Additionally, make sure each person
    authorized to use FTP has his or her own login credentials. This enables auditing
    of activity.


    # ## Weak Passwords


    Many FTP systems do not restrict the retrying of a connection multiple times.
    In that scenario, a malicious user could simply keep trying username and password
    combinations until a good one is found.


    Your action here is to ensure that your password is very difficult to guess. Although
    there’s no solid rule, here are a few tips:


    +   - Use a combination of uppercase and lowercase letters, as well as allowable
    punctuation.

    +   - If your password (no matter if it is uppercase or lowercase) is in a dictionary,
    or could be similar in spelling, do not use it.

    +   - Change your FTP passwords regularly. On a site with lots of FTP users and
    activity, you should change it every 30 days.


    # ## Misconception of Security


    Many people believe that FTP is safe and secure. One issue is the sharing of FTP
    credentials to upload files. This is less of a technical issue and more of a trust
    issue. That is, in trusting the person to whom you are giving the credentials,
    you are giving that person and that person’s machine access to your server. If
    the machine is compromised, that person could easily expose you to the malware.


    There was once a case where a site was severely hacked. The attacker came through
    the FTP server with legitimate credentials. After reviewing the logs and a lot
    of detective work, it turned out that a subcontractor had hired another subcontractor
    to assist him.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'The sub-contractor was running a Mac and believed (erroneously) that Macs would
    not get infected. It turned out that his Mac was indeed infected, and the hacker
    was listening via a backdoor application and simply obtained the credentials.


    After that, the hacker simply logged into the site. The security systems in place
    had no idea he was a bad guy because he had proper credentials. This is covered
    in greater detail in Chapter 8.


    The problems here were trust and lack of education: The trust was that the subcontractor
    shared the login, but should have obtained a specific login for himself and the
    sub-contractor. The sub-contractor was not up to speed on his knowledge of malware
    and backdoors as they related to the operating system he was using.


    This entire situation could have been averted.


    Another misconception is that the upload folder is secure. The misconception is
    that even if someone were to load something, the intruder could not get it to
    do anything.


    This is highly foolish in that even if the intruders couldn’t execute the uploaded
    material directly, they could entice someone else to. Even more disturbing, improperly
    set-up folders (directories) could allow the intruder’s access.


    FTP is a very old and very insecure protocol. It should never be turned on for
    any public-facing machine. In essence, if a server is on the Internet, it should
    not have FTP on it.


    > **NOTE** For a very detailed tutorial on FTP, see the guide to VSFTP (very secure
    FTP, included with Fedora) at www.linuxhomenetworking.com/wiki/index.php/Quick_HOWTO_-_Ch15_-_Linux_FTP_Server_Setup.


    # Exploring Alternative Versions of FTP


    Red Hat and Fedora are a couple of the more popular Linux platforms in use today.
    Red Hat and Fedora currently ship with a fairly secure FTP platform called VSFTP.
    Overall, if you are going to use an FTP application, then VSFTP is one of the
    better ones to use. Another reasonably secure (and popular) FTP server is Pure-FTPd.


    Both VSFTP and Pure-FTPd allow the use of SSL for passwords and user-names, thus
    helping to protect your sessions. SSL is used by many reputable firms, and is
    considered very strong.


    > **NOTE** If you are on a shared server, then you have no choice but to use FTP.
    If security is a concern, do not use a shared hosting situation.


    # Using VSFTP


    Fortunately, VSFTP has been written by a security researcher. Therefore, much
    of the normal concerns are gone, because it has been coded with the idea of eliminating
    many security issues.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'To install VSFTP (in Red Hat and Red Hat distributions of Linux), log in as
    root and enter this command:


    ```

    ```

    # yum install vsftpd

    ```

    ```


    To shut off VSFTP, log in as the root user, and, after ensuring that you have
    a recent backup, run the following commands to disable or remove VSFTP from your
    server:


    ```

    ```

    # chconfig vsftpd off

    # yum erase vsftpd

    ```

    ```


    While still in the VSFTP configuration file, update the banner located at /etc/banners/vsftpd.
    Be sure to add the appropriate warnings to the FTP user about your information
    security policy.


    Figure 5-14 shows an example from the guide for the Community Enterprise Operating
    System (CentOS), which is a Red Hat-derived distribution of Linux.


    ```

    ```

    220-Hello, %c

    220-All activity on ftp.example.com is logged.

    220-Inappropriate use will result in your access privileges being removed.

    ```

    ```


    **Figure 5-14: Example banner in VSFTP**


    Note the %c in the banner. When a user logs in, he or she will see the user information,
    including username, host, IP address, and potentially other information about
    the connection in place of that %c. The purpose of changing the banner is to help
    remind users that their actions are being recorded, and thus ward off potential
    harm.


    VSFTP defaults to allow anonymous access. Thus, if you do install it, you must
    edit the configuration file to remove anonymous access.


    > > **NOTE** A complete guide for CentOS on securing and configuring VSFTP is
    available at www.centos.org/docs/5/html/Deployment_Guide-en-US/ch-server.html.


    # ### Using Pure-FTPd


    Pure-FTPd is another good choice if you need to offer FTP servers.


    Installing Pure-FTPd includes many steps and a good number of options. Visit http://download.pureftpd.org/pub/pure-ftpd/doc/README
    to get the full instruction set.


    To uninstall Pure-FTPd, log in as root, and execute the following commands. (Be
    sure you have a recent backup.)'
  merge: -1
