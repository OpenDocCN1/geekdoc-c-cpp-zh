    # cPanel Settings for Log Rotation


    cPanel is a nearly ubiquitous tool in hosting these days. It’s one of the most
    popular applications for web server management. You can use cPanel to set up your
    archiving. Although it doesn’t offer the same robust features as logrotate, it
    will easily get the job done.


    Log into cPanel and locate the button titled Raw Log Manager. It should look like
    the icon shown in Figure 8-20. This button takes you to the Raw Log Manager screen
    shown in Figure 8-21.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_312_0.png)


    Figure 8-20: Access Raw Logs in cPanel


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_312_1.png)


    Figure 8-21: Log Rotate settings in cPanel


    Note that you should select the option to “Archive Logs in your home directory
    at the end of each state run.” Sometimes the default on hosts is for this'
