    +   - 416 Requested Range Not Satisfied — `HTTP_RANGE_NOT_SATISFIABLE`

    +   - 417 Expectation Failed — `HTTP_EXPECTATION_FAILED`

    +   - 418 I''m a teapot — `UNUSED`

