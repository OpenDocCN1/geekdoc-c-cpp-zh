- pgno: 199
  md: 'as good of a disaster plan as possible. In this chapter, you’ll learn about
    building your team, installing the proper backup software, and testing and improving
    your disaster plan. You’ll also learn about the additional odds and ends that
    tend to be missed, like e-mail systems, telephones, DNS, new equipment, and more.
    However, you must realize this single chapter is not meant to cover the entire
    gamut of *disaster planning*. It’s written as a guide to help you build a framework
    to respond to events.


    The chapter begins with a discussion of site and systems disaster planning.


    # Understanding Site and Systems Disaster Planning


    During a disaster, people tend to lose their ability to reason and process complex
    tasks. You can see this phenomenon in the behavior of most people during a severe
    tragedy or event. They generally have trouble understanding commands. Keep this
    principle in mind for your plan, and tailor your instructions so that they can
    be understood simply and easily.


    After a crisis passes the average person’s ability to think returns to the normal
    level and, thus, the person is able to mentally process. For more information
    on this topic, conduct an Internet search for Dr. Robert Chandler and review his
    work on emergency notification during a crisis. He has done extensive work on
    the subject, and you will find it valuable.


    The purpose of your plan is to prepare for what will be done during a crisis.
    To be fair, you cannot (nor should not) try to plan for every conceivable event.
    That’s a waste of time and energy. Rather, this plan should be one that covers
    outages and what you will do to restore service. This plan should be broken down
    into manageable categories.


    You may be a very small business with just a handful of people. Given that, understanding
    the *effective (not perceived)* capabilities of your staff is even more important.
    Operationally, be prepared to test your plan through drills. Using cloud solutions
    available today from many vendors, setting up a test scenario that will help prevent
    any interruption to your production systems is easy. Planning, training, and testing
    for you and your staff will help eliminate or mitigate many severe issues.


    To understand and develop a plan that will work, you must understand your business
    — the various technologies that are in it, and how they interact. While designing
    and developing your recovery plan, consider that you or your staff may not have
    worked through a major disaster or large-scale outage. The staff may very well
    regard the idea of a test or plan with some apprehension that could become a road
    block. Because of a lack of experience, a tendency may exist to underestimate
    the time or money needed to recover. Clearly, items will be missed if they are
    not documented in advance.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'As an example, you would need the following, at a minimum, to recover a basic
    Joomla! website:


    +   - The FTP (or SSH, SFTP) username and password

    +   - cPanel or Control systems login

    +   - Super user administrator control

    +   - Copies of extensions and the correct versions

    +   - An up-to-date copy of the database

    +   - Login for phpMyAdmin (if so equipped)

    +   - Access to the server (remote access)

    +   - Possibly htaccess passwords

    +   - Any settings for the server such as php.ini

    +   - Settings particular to the site


    This list is just for a Joomla! site. Think about a small business operation that
    has much more going on in addition to its Joomla! site.


    Asking employees to remember all these critical items is bad management. Assuming
    that the right person with all the required knowledge will be available on the
    day of disaster is foolish. Disasters have a tendency to not schedule themselves
    around your timeframe, or the presence of a specific staff member.


    # Defining a Disaster


    For the purposes of this discussion, a disaster will be considered anything that
    interrupts the IT systems in your business. What that can mean is that your site
    may be up, but perhaps a backhoe cuts the Internet connection coming into the
    building where your server is housed. Effectively, you are cut off from the world
    of the Internet. Following are some possible disasters that could plague your
    IT systems and operations:


    +   - Weather (such as tornadoes, hurricanes, snow, floods, extreme heat)

    +   - Hackers, viruses, Trojan horses, disgruntled employees

    +   - Hardware failures

    +   - Backhoes (as just described)

    +   - Legal actions that cause an immediate outage

    +   - Failure of supporting infrastructure such as e-mail, Domain Naming Service
    (DNS), Voice over IP (VoIP), or other telephony products

    +   - Distributed Denial of Service (DDOS)

    +   - Vulnerabilities that have yet to show themselves'
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   - Upgrades gone bad

    +   - Fire

    +   - Electrical outage

    +   - Sewage or plumbing problems


    As a small or medium-sized business owner, you may face any of these scenarios,
    or even a combination of them. Although you may be a single-person shop, you are
    not immune from any of these disasters. Your risk might be lower, but nonetheless
    the risk still exists.


    # Time Considerations


    In 1978, the University of Minnesota conducted a study to determine how long a
    business would survive if it experienced an outage. The results of the study were
    published in the “An Evaluation of Data Processing ‘Machine Room’ Loss and Recovery
    Strategies” working papers by D.O. Aasgard (et al) from the Management Information
    Systems Research Center (MISRC) (University of Minnesota: Minneapolis, 1978).
    What that study found is that the average survival period was two to six days.
    If a company suffered an outage and couldn’t recover in a week or more, then,
    in all likelihood, it would be out of business within a year.


    Clients of this author who have been hacked often ask, “When will it be up and
    running?” Or “How long will it take?” They need to be back online making money.
    In many cases, they did not have a recent backup, and in some cases, they had
    no backup at all. Of course, the sad news to those unfortunate clients is that
    it will take more time than they would like — to which, without fail, they groan
    and complain that this event is costing them money in terms of time.


    You should seriously consider how long it will be before you can activate your
    plan. For example, you would not activate your disaster recovery plan if your
    site momentarily went offline for, say, 5 minutes. Inversely, you would be foolish
    to not take action of some sort after, say, an hour. In this part of your plan,
    you’ll want an escalation plan. Consider in your plan what constitutes the need
    to activate it, who can activate it, and when.


    To expand on that idea, let’s use the example of a patched server that requires
    rebooting. That reboot is technically an outage or downtime. However, this event
    is one that is tolerable. You might consider this a business interruption, really
    an annoyance at best.


    Other business interruptions are not so tolerable. A client of this author recently
    experienced a long outage (about three hours). The root cause was a faulty circuit
    breaker at the client’s hosting facility. The result was a series of events that
    caused an outage at most of that hosting facility. Because this happened at a
    peak time, it was very unfortunate for the hosting company.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'The reason this is highlighted is to put into your mind the idea of a pre-determined
    time that you set before you declare a disaster. This is a solid time that cannot
    be moved. In your planning, if you have determined that three hours is the absolute
    longest time you can be out of service before you start emergency restorations,
    then that''s your time frame. When you have reached that time limit, no matter
    what, you must initiate your plan.


    Determining that time limit is a matter of conducting serious analysis of your
    infrastructure, systems, and operations. Review each piece and see what the impact
    would be financially and in terms of recovery time.


    Table 6-1 shows a few important areas from a fictional online company that conducts
    100 types of business online. The purpose of examining the areas in this way would
    be to help you evaluate where you could be impacted, as well as the financial
    costs associated with each. Using this as a metric, you will be able to see where
    you are vulnerable. Assigning to each area a predetermined time that you can reasonably
    be down before you activate your plan.


    # Table 6-1: Sample Business Impact Evaluation


    | SYSTEM | IMPACT | AREAS IMPACTED |

    |---|---|---|

    | Web server | Critical | Order entry, online presence, customer service |

    | ISP | Critical | Online customer service |

    | DNS | Critical | ISP has a fully redundant DNS |

    | Telephone systems | Medium | Customer service operations |

    | E-mail | Medium | High impact on operations, but an outside e-mail provider
    |

    | Printers | High | Packing slips (affects shipping and requires a backup to be
    in place) |


    As you will learn throughout this chapter, you must be conscious of what assets
    are important to your business, and what disasters can trigger implementation
    of the disaster recovery plan. If e-mail is vital because you deliver something
    electronic through it, then it is mission-critical. If e-mail is merely a secondary
    communications channel, then the trigger to activate an emergency plan would occur
    much later in the life of a disaster.


    # Cost Considerations


    Your disaster planning process (and possibly the activation of the plan) will
    have a financial component to it. Often, company management won''t approve the
    costs of a plan mainly because of not understanding the financial impact an outage
    will have.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'If you are the senior management, take the time to understand the legal and
    financial impacts that a serious outage could have. If you are tasked with selling
    this plan to the senior management, then your first step will be to build a case
    to justify it.


    When investigating the costs in terms of people, systems, software, and time,
    be as honest as you can. Don’t provide a lower number hoping to sell it. Do not
    put in a cushion to state in the plan that you have added “X” dollars to cover
    unforeseen costs. Past experience has shown that playing aboveboard beats begging
    for forgiveness later.


    If you are working with a third-party firm for disaster assistance, be sure to
    review all fees carefully. Ask whether there is a fee to activate your disaster
    plan (known as a deactivation fee). Add in any potential overtime or shift-differential
    pay that your employees may be paid.


    # Formulating Your Contingency Plan


    As you begin building your plan, realize that no specific style or method is *right*.
    What is *right* is what matters to you.


    For example, if you only have a small operation, having a solid and documented
    backup and recovery plan may be perfect. If you’re a medium-sized business that
    potentially has several servers, some switches, and possibly a dedicated Internet
    connection, you’ll have a larger and different plan.


    You might look around and find some templates to get you started on a disaster
    plan. However, keep in mind that really, no tools are out there that will fit
    your scenarios exactly.


    # Determining Responsibilities


    Table 6-2 provides a list of resources that may or may not apply to your situation.
    The people and departments you involve are based strictly on your company. Again,
    if you’re a small one- or two-person business, that’s a simple decision — you
    and the other person are the team. At a larger business, you may want to involve
    people from both internal and external groups.


    **Table 6-2: Groups and Responsibilities**


    | GROUP | RESPONSIBILITIES |

    |---|---|

    | IT group | First and foremost, the IT group’s task is to work through the restoration
    of services. If you have four people in this group, then someone will need to
    be tasked to develop the plan and lead this group. *Do not attempt to lead by
    consensus.* Put someone in charge, and give that person the responsibility and
    the authority to execute the plans. |'
  merge: -1
  img_proc: true
- pgno: 204
  md: '| GROUP | RESPONSIBILITIES |

    |---|---|

    | HR department | If you have an HR department, its involvement will be vital.
    That department may need to be involved in the hiring of the right person(s) to
    be brought in. The department may be responsible for providing employee telephone
    numbers, e-mail addresses, and so on. |

    | Senior management | If senior management is only you, then great! If not, then
    be sure you involve the senior management team at the inception of the plan. Buy-in
    by the team will make or break your plan. To some degree, senior management will
    have say in the recovery plan. They will need to sign off on the development road
    map of this plan, as well as set priorities for recovery. Of course, funding will
    likely come from the senior management team. |

    | Legal department | Consulting with your attorney or corporate legal department
    is also vital. They may know of specific considerations for your business or industry
    regarding compliance issues. The Legal department will be able to guide you on
    these matters. You may have a situation where outside counsel must be enlisted.
    Either way, legal considerations are part of the initial planning process. |

    | Outside vendors or partners | This can be hardware or software vendors. In some
    situations, it might be a food vendor. If you have a medium-sized staff and find
    yourself in a long outage, have the names of some 24-hour restaurants handy, because
    food is important during a crisis. Other vendors could be your hosting partner
    or co-location facility. |

    | Law enforcement | In today’s society, you may be faced with a disaster scenario
    that includes a bomb threat, a cyber-threat, or even a person or persons who could
    take your data center hostage. Although you hope this will never happen, being
    prepared for it is best. |

    | Local utilities | This could be as simple documenting the various utilities
    that you may need to contact, such as water, gas, electrical, or telephony providers.
    Where appropriate, consider contacting them regarding emergency procedures as
    they relate to your company’s needs. |

    | Your customer or user community | Because this book is all about Internet sites,
    you’re going to have customers one way or another. Involve them where appropriate.
    However, you do not need to give them your disaster recovery plans. What is needed
    is a plan for communicating with them during a disaster. |

    | State and local government emergency agencies | This will really have more value
    to a medium-sized business than a very small business. Where appropriate, coordinate
