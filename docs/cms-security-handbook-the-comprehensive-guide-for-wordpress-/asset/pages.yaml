- pgno: 235
  md: "There the similarities end. Plone is a very robust and powerful CMS. It also\
    \ requires a higher degree of technical skill for administration versus the other\
    \ CMSs in this book. The user side for content management is very friendly and\
    \ easy to use. However, administration is not as simple.\n\n# Requirements\n\n\
    Overall, if Zope is running after your install, then you have met all the requirements\
    \ you need to do a basic Plone backup. Scripts are available to automate the backup\
    \ and make it much easier than doing it manually. The main requirement you will\
    \ need is the capability to log in to your server via SSH and use the tar and\
    \ mv commands.\n\n# Configuration\n\nNo configuration is required for the simple\
    \ backup method described here.\n\n# Backups\n\nPlone stores its essential data\
    \ in a few files. The idea is to back up the following files:\n\n```\n```text\n\
    /var/filestorage/Data.fs\n/var/blobstorage\n/products\n```\n```\n\nIn essence,\
    \ you can probably just back up the /var/filestorage/Data.fs file, because it\
    \ should contain everything. The following steps describe the simplest method\
    \ for backing up Plone:\n\n+   1. Log in to your management console as follows:\n\
    +   \n+      `http://localhost:8080/manage`\n+   \n+   2. A login screen appears;\
    \ enter your username and password.\n+   \n+   3. After you are logged in, open\
    \ the Zope Management Console shown in Figure 6-15. This will allow you to view\
    \ the database status and other elements of your Plone site.\n+   \n+   4. To\
    \ reach the Database, click Control_Panel → Database. The Database Manager allows\
    \ you to view database status information. It also allows you to perform maintenance\
    \ tasks, such as database packing and cache management. For example, you might\
    \ see database information as follows:"
  merge: -1
