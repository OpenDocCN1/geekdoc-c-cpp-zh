  md: "WordPress users should visit http://perishablepress.com/press/tag/security/\
    \ to see various .htaccess samples. Joomla! users should visit http://snipt.net/nikosdion/the-master-htaccess/\
    \ to learn about specifics for using .htaccess to better secure Joomla! sites.\n\
    \n# ## Blocking IP Addresses\n\nFollowing is an example of blocking IP addresses\
    \ from visiting your site:\n\n```\n```apache\n<Limit GET POST PUT>\n  Order Allow,Deny\n\
    \  Allow from all\n  Deny from xxx.xxx.xxx.xxx\n  Deny from xxx.xxx.xxx.xxx\n\
    \  Deny from xxx.xxx.xxx.xxx\n  Deny from xxx.xxx.xxx.xxx\n  Deny from xxx.xxx.xxx.xxx\n\
    </Limit>\n```\n```\n\n# ## Blocking Bad Bots\n\nA class of malware that attacks\
    \ websites is bad bots. These malicious creatures either break in or gather information\
    \ used to break in. Blocking them is a regular and frequent task. Fortunately,\
    \ .htaccess provides a simple method to do it. For a good example to use to block\
    \ bad bots in .htaccess, see http://perishablepress.com/press/2010/06/09/2010-user-agent-blacklist\
    \ and copy down the directives from 2010 User-Agent Blacklist.\n\n# ## Protecting\
    \ a Specific File\n\nThe following example protects a specific file from all visitors\
    \ except your IP:\n\n```\n```apache\nBlock all visitors except your IP or IPs\n\
    <Limit GET POST>\n  Order Deny,Allow\n  Deny from all\n  Allow from first ip address\n\
    \  Allow from second ip address\n</Limit>\nErrorDocument 403 path/custom-message.html\n\
    <Files path/custom-message.html>\n  Order Allow,Deny\n  Allow from all\n</Files>\n\
    ```\n```\n\n# ## Requiring SSL on Your Site\n\nThe following example shows how\
    \ to require SSL on your site:\n\n```\n```apache\nSSLOptions +StrictRequire\n\
    ```\n```"
