- pgno: 238
  md: 'provide you with a complete solution. With it, you can back up and restore
    an entire Drupal site. You can store the backup on a remote FTP server or Amazon
    S3, or e-mail your backup.


    One particular feature that is especially useful is the capability to use AES
    encryption to protect your backup files.


    # Requirements


    The requirements for backup and restoration depend on the Drupal version you are
    using. The Files module requires the server to have PEAR and Archive_Tar installed.


    This method has been tested with MySQL and Apache. Other environments are not
    covered in this book.


