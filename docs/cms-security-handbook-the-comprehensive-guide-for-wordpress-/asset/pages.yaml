- pgno: 280
  md: '# Log Review


    Every day, millions of website owners read the newspaper, or get their news online.
    They watch the morning “talking heads” inform them about what happened in some
    part of the world. They consume the information that helps them feel informed.
    Sadly, 99.999 percent of the news they consume makes zero difference to them.


    Many website owners rarely (if ever) look at their systems or website logs. If
    they would do so, they would get a lot more beneficial information that could
    impact their day. If they would review the log files, they could see things such
    as disk space usage, bandwidth consumption, attempts to break in, errors on their
    sites, and much more.


    Log files are records of events for such software as operating systems, applications,
    content management systems, and blog software. Hardware systems such as servers
    also record logs. Logs are historical, and are critical to your site’s safety.
    Information you should be interested in includes details about visitors to your
    site, your system’s applications, and events that may be causing errors within
    the system.


    There are plenty of state and federal regulations for log retention, and there
    are potentially industry-related laws. Another reason for log retention is, in
    the event of a lawsuit, you may have a requirement to produce months of data.
    In all cases, check with your lawyer, because this is not legal advice.


    This chapter examines everything you need to know about these logs. That’s not
    to say that you’ll learn about everything you can know about them, but just the
    information you need.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The reason that you should care about logs is that they can warn you of impending
    problems, fraudulent activity, unauthorized activity, or hardware problems such
    as failing disk drives. If you manage a server, you’ll want to monitor the machine
    logs. Logs provide a view of activity on your site, allowing you to tweak your
    site to reach your goals.


    In short, logs are the history book for your servers and website.


    # Understanding the Need to Retain Logs


    From a legal perspective, retaining logs is more and more important to many businesses.
    In fact, the Payment Card Industry (PCI) Data Security Standard (DSS) dictates
    the need for a business to “track and monitor all access to network resources
    and cardholder data.” This means you must ensure that you track your visitors,
    as well as access to your servers and resources. You are required to ensure that
    the logs are safe from alteration. Consult with a PCI auditor for specific retention
    questions for log data.


    One benefit of maintaining good logging is the capability to track down what happened
    after a server or website is hacked.


    Here’s a real-world example from an FTP server’s log following an upload of an
    exploit via FTP on the server. (The source of the attack and some other data have
    been removed to protect the website’s identity.)


    ```

    ```text

    Admin [17/Sep/2010:04:23:44] "*STOR exp_imgownowar.c"

    Admin [17/Sep/2010:04:23:44] "*STOR pwnkernel.c"

    Admin [17/Sep/2010:04:23:45] "*STOR exp_chedbaary.c"

    Admin [17/Sep/2010:04:23:46] "*STOR exp_wunderbar.c"

    Admin [17/Sep/2010:04:23:47] "*STOR exp_therebel.c"

    Admin [17/Sep/2010:04:23:48] "*STOR exp_moosecock.c"

    Admin [17/Sep/2010:04:23:48] "*STOR exp_vmware.c"

    Admin [17/Sep/2010:04:23:49] "*STOR exp_framework.h" 226

    Admin [17/Sep/2010:04:23:49] "*STOR exp_run_null_exploits.sh"

    Admin [17/Sep/2010:04:23:50] "*STOR run_nonnull_exploits.sh"

    Admin [17/Sep/2010:04:23:51] "*STOR exp_paokara.c"

    Admin [17/Sep/2010:04:23:56] "*STOR exploit.c"

    Admin [17/Sep/2010:04:23:56] "*STOR funny.jpg"

    Admin [17/Sep/2010:04:23:57] "*STOR exp_powerglove.c"

    Admin [17/Sep/2010:04:23:57] "CWD /YourWebSite.com"

    Admin [17/Sep/2010:04:23:57] "*STOR exp_run_null_exploits.sh"

    ```

    ```


    This log shows that on September 17, the Admin logged into the server at 4:23
    AM (local to the server). The files loaded were exploit files meant to bypass
    several parts of Linux security. The problem is that the real administrator did
    not log in and upload these files.


    The attacker actually had comprised a different machine — one owned by a contract
    developer who was working on this site. By gaining access to his'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'machine, the attacker was able to grab the username and passwords, attack this
    website, and more.


    Had the logs not been kept, the administrator of the machine would not have been
    able to track down the source.


    A common mistake is not validating the security of a third-party developer’s machines
    or environment. In this case, the machine was a Mac, and the owner of the machine
    (the contractor) wrongly assumed that the machine and environment were safe because
    the developer was not using a PC. The developer was not running anti-virus software
    on the Mac.


    The best course of action in all cases is to set a minimum security standard that
    third parties must follow. Additionally, assignment of rights to the web server
    should be specific. That is, if you must provide a password and username, ensure
    that the information is unique to that individual. This practice will make tracking
    and auditing easier. Lastly, employ the principle of “least privileges” needed
    into your standard planning. If third parties don’t need access to everything,
    then do not allow it.


    Logs are important for many reasons, including the following:


    +   - Ensuring legal compliance, such as e-discovery (that is, the process of
    providing electronic records in a legal discovery)

    +   - Complying with Article 10 of the PCI DSS

    +   - Monitoring the access and activity of third parties

    +   - Ensuring that breaches have not occurred

    +   - Keeping tabs on suspected hacks

    +   - Watching your traffic for trends

    +   - Learning about malfunctions with your site, operating system, or hardware


    Throughout the remainder of this chapter, you will learn how to plan, manage,
    and act on information in your logs.


    # Planning for Your Logs


    Planning for logs might sound about as fun as going to the dentist. And, yes,
    sadly, sometimes log management can be painful. However, doing some planning can
    ease that pain. One great thing is that planning can occur at any time, even if
    you’ve been running your site for some time.


    Your plan should take into account such things as the retention time for logs,
    when to review (and who reviews) the logs, where you will store the logs, and,
    of course, how you respond to events.


    Most of the time, you can put your logs on auto-pilot with a good plan.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# ## Developing a Retention Policy


    There probably isn’t a good rule that says you must keep logs for “x” months.
    The amount of time you should keep logs around is very dependent on your business,
    industry, amount of traffic you receive, and other factors.


    The best way to determine how long to retain logs is to consider the following
    guidelines:


    +   - **Business and legal needs** — Your business may be one that has a legal
    requirement or a specified need for log retention. This could be that you’re an
    e-commerce-type business, or perhaps a medically oriented business. It could be
    that you want to track long-term traffic trends for marketing and search engine
    optimization (SEO). You will want to define the process used to destroy and retain
    log data, as well as which logs are to be kept. In this category, your specific
    needs will outweigh other factors.

    +   - **Size of logs** — Even an average site can quickly create very large access
    logs. According to Apache.org, 10,000 hits to a website can quickly write out
    a 1MB log file. This is okay, except when you are trying to review a large log
    file. If your logs are growing quickly every day, you may want to do a nightly
    archive, or set up a custom log rotation schedule directly on your server.

    +   - **Time** — In terms of days, weeks, or months, “time” is based on several
    factors that will be unique to your situation. One thought on this is that logs
    are nothing more than text files, which compress very well, so storing is not
    an issue. It’s more of a matter of do you need logs for more than three to six
    months? After a while, unless it’s a legal requirement or interesting reading,
    then logs become a filing burden.


    # ## Who Does What and When?


    Many of you probably have a small operation. If you only have a single-person
    company, then who does what is simple. It’s you. If you happen to have a staff
    of sorts, then it’s matter of delegation.


    The following guidelines are primarily built around business requirements, and
    not so much around technical requirements:


    +   - **Who do you trust to copy your log files offline?** Who do you trust to
    log in to your server? Determining who handles the logs is a matter of trust,
    because giving access to a server is 100 percent trust-based. This holds especially
    true if you are storing credit card data. The role of the log caretaker should
    be somewhat of an administrator’s function. If you have a site administrator,
    then you’ll likely assign this task to the administrator.

    +   - **What the caretaker does with the logs** is, again, very dependent on your
    business. You may want to perform a review of your logs and just delete'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'the archived (compressed) version. Your needs may include reviewing and archiving
    the log file, and then pulling it offline. If you have a policy of keeping only,
    say, the last three months of logs, your task would be to delete the fourth month.
    As you''ll see later in this chapter, you can automate some of this by using log
    rotation.


    ■ *How often* you perform log maintenance is also based on the needs of your business.
    Your Drupal site may warrant a daily log archive because of the amount of web
    traffic. Or, having the logs archived weekly (using log rotation) because of low
    traffic may be fine. The key is the size of the logs. If they are too big, they
    are difficult to manage; if they''re too small, then you''re dealing with busy
    work.


    # Determining Where to Store Logs


    Storage of your logs means two things: where and how.


    Where are you going to *geographically* store them? Will this area be in a file
    cabinet at your office or at your home? You probably will not need quick and immediate
    access to your previous log files, so storing at the office or in a box in the
    closet shouldn''t be a problem. Just consider when you would need the log files,
    and plan accordingly for retrieval. Be sure you take into account the media they
    are stored on and the environmental conditions.


    The *how* in this equation introduces an electronic question. What type of media
    will you use? Your options include leaving the files on the server, or making
    an offline copy onto some type of media.


    Although not likely to change, the media could be an issue. Media storage choices
    include CD-ROM, DVD, or USB key. You should not rely on paper copies.


    If you really do have a valid reason to keep your log files for a very long term,
    consider burning them to CD-ROM or DVD. The prices for read-writable DVD burners
    have dropped to near CD-ROM levels, so cost should not be a factor. Both of these
    types of media should be around for the duration of your lifetime.


    If you''re looking at short-term storage (three to four months), then an inexpensive
    USB key will suffice just fine. Long-term storage on a USB key is a big “no-no.”
    Among the many reasons for not using a USB key for long-term storage is the prime
    concern that data may be lost because of the loss or failure of the key. The wash,
    spin, and dry cycle when laundering your pants (as well as dangers of other everyday
    events) is a real-world concern for loss of the data.


    # Responding to an Incident


    The lines of the earlier FTP log example showed an unauthorized upload of files,
    which resulted in a defaced Joomla! site. Fortunately, the only real damage was
    that these hackers replaced the `index.php` file, which was easy to fix.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'The course of events following the telephone call from the client was to immediately
    download the logs and then remedy the damage.


    The response to the event was enhanced by looking through the log files and determining
    the path the bad guys took.


    The access logs did indeed show the bad guys were there, but nothing too odd showed
    up in the logs. However, activity in the FTP logs indicated that they had uploaded
    a lot of server-side attack code in addition to the defacement. The defacement
    was most likely meant as a distraction while the bad guys worked to launch the
    server-side code. However, the logs pointed to where they uploaded the code, so
    it was simple to remove the files and repair the damage.


    The next action was to determine how the bad guys obtained the username and password.
    Three people had access to the credentials. Two of the three people were able
    to quickly prove they were not the source. As it turned out, the third person
    had his sites hacked by the same people, and he had the credentials on his machine
    for the hacked website.


    You don’t need to be Sherlock Holmes to figure out that this third person was
    the source. He installed a virus scanner on his Mac and found he had several infected
    files and three Trojan horse viruses. Cleaning up the damage was routine from
    that point on.


    Thus, the response to this attack was simple:


    +   1. Change all passwords system-wide.

    +   2. Copy the log files.

    +   3. Clean up damage.

    +   4. Review the activity of the attackers in the logs.

    +   5. Double-check to ensure it is all gone.

    +   6. Find the original attack vector (in this case, the third-party contractor’s
    desktop) and remove it.

    +   7. Block the attackers’ IP address (optional).


    Had those logs been unavailable, the cleanup could have been accomplished, but
    how the bad guys got in would not have been revealed. This, of course, assumed
    that they didn’t break in by using some vulnerability on the server. To all the
    security systems involved, there was a genuine user.


    Logs are very valuable when responding to incidents. Note that in this real-world
    case, the review did not entail just a single log, but rather multiple log files.


    # Using Logs to Respond to Events


    When you hear “responding to an event,” it sounds like you’re sending an RSVP
    to a party indicating that you’ll be attending. In the context of this discussion,
    however, “responding to an event” could mean responding to a security event or
    an outage. In either case, you have a problem.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The steps outlined here represent a philosophy and not so much a hard-and-fast
    rule. However, they are built on the experience of dealing with hacked websites.


    This section may seem out of place given this chapter’s topic of hardening the
    server, but the inclusion is based on the fact that if there’s a break-in, it’s
    important to consider where you missed it.


    # Obtain the Evidence


    The first order of business is to obtain the log files. These will be all the
    log files on hand, including archived logs.


    Copy these to a USB key or to a separate system, such as a laptop. Be sure you
    have virus protection enabled to prevent anything from getting on to your machine.


    Specifically, copy the directory `/var/log`. This will contain several log files,
    including the following:


    +   - Boot logs

    +   - Cron logs

    +   - Mail logs

    +   - DMesg (for system start-up events)

    +   - Security logs

    +   - Xfer logs (which may be located elsewhere)


    It’s important to preserve these logs because they are a record of events. Navigate
    to your access logs, typically (but not always) located at `/usr/local/apache/logs`.
    This will house the following very important information:


    +   - Access logs for the server (not the website)

    +   - Error logs

    +   - SuExec logs

    +   - Your archive directory


    Once you have these, you should review them to see what is currently on the site.


    # Who Is Logged On


    Before moving on to cleanup, determine if there is anyone logged in to the server
    who should not be.


    Using the `netstat` command provides you with a great deal of information about
    the network subsystem. You’re interested in who is connected and who is logged
    in. The connected users are likely okay, but it’s good to make note of who they
    are.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'At the root prompt, type `netstat -a`. This will provide you with a great deal
    of connection information.


    Another (and simpler) method is to type the letter `w` at the command prompt as
    follows:


    ```

    ```

    # w

    ```

    ```


    This will display all *logged in* users. The difference between the two commands
    presented here is that `netstat` will show you vital information about other processes
    and services, where `w` shows you who is logged in and from where.


    If you are responding to an event and *do not* recognize the users who are *logged
    in*, terminate the user''s session using the `kill` command. You should then look
    at your user list and remove unauthorized users from it.


    If these users are logged in as *root*, you must immediately change your password
    to prevent them from logging back in.


    # ### What Services Are Running


    Another task is to determine *what* is running. For example, if you see a backdoor
    or virus programs running, you can terminate it.


    To see all the running services, enter the following command:


    ```

    ```

    # ps -all

    ```

    ```


    This will provide you with a huge list of services that are running. Unless you
    spend a lot of time on the Linux console, you may not recognize all of them.


    The purpose of running this command is to capture the resulting information for
    review. Use the following command to send the information to a text file:


    ```

    ```

    ps -all >> filename.txt

    ```

    ```


    This will write that information to the file you indicate in *filename.txt*. In
    this command, note that `All` is case-sensitive.


    This command provides you with a snapshot. To monitor the services for an ongoing
    period, use the following command:


    ```

    ```

    # top

    ```

    ```


    # ### Historical View


    If you believe your server has been hacked, getting a list of historical logins
    is vital.


    To do so, at the root (#) prompt, enter `last`. This will provide you with a list
    of who logged in, from where, and when. You''ll be able to determine if anyone
    else is logged in as well.


    A convenient way to do this is to use the following command:


    ```

    ```

    last >> filename.txt

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'This will write that list to the file you indicate in *filename.txt*. This
    enables you to review the information offline with a standard text editor.


    Next, enter the command `lastlog`. This lists all the service accounts on the
    system and when the service last logged in. Since all services have accounts,
    determining if the service logged in (or when) will tell you a lot. Again, you
    can use the following form to allow easy collection for review:


    ```

    lastlog > filename.txt

    ```


    For example, if a hacker has loaded a service and it logged in and ran, you’ll
    see this (in most cases) after running this command.


    For a quick view of the messages log file that contains the last few events (including
    logins, logouts, sessions, cPanel connections, FTP events, and more), use the
    following command:


    ```

    tail /var/log/messages

    ```


    This provides information that is helpful in the short time after a break-in or
    an event.


    Navigate to the /home/domain-name/access-logs folder on your server and make a
    copy of the access_logs file. This will help you determine what the perpetrator
    actually did while on the site.


    # Historical Attempts


    As an ongoing security effort, or after a breach, review the failed log-in attempts
    using the lastb command as follows:


    ```

    # lastb

    ```


    This command can produce a very large file, so piping it with >> is preferred.
    Following is a sanitized example of failed logins of a server. This break-in attempt
    came from Venezuela and was conducted by an automated tool given the time.


    ```

    snmp ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    gdm ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    gdm ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    webalizer ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    webalize ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    named ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    tomasi ssh:notty 190-xx-xx-24.dy Wed Feb 20 21:54 - 21:54

    tomasi ssh:notty 190-76-xx-24.dy Wed Feb 20 21:54 - 21:54

    candido ssh:notty 190-76-xx-24.dy Wed Feb 20 21:54 - 21:54

    ```


    If you find a huge number of break-in attempts, the best response is to block
    that IP address at your firewall.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# ## Response


    Once you have collected this wealth of information about your system, it’s time
    to go about the task of responding.


    To start, try to determine what has happened. For example, if your Joomla! site
    was defaced, then review the date and time of the file change. With this information
    in hand, open the access log files and locate that data and time range. As a starting
    point, you should review the time before it occurred as well.


    Following are proper responses:


    +   - Block any IP addresses that are continuously trying to log in (using the
    `lastb` command).

    +   - Review access logs for nefarious entries such as very odd URLs or scripts
    inserted in the URL.

    +   - Review date and time stamps on files to ensure that they haven’t changed
    without your knowledge.

    +   - If you have been breached, run a virus scan on your website folders and
    files. Verify the date and time stamp.

    +   - Run RKHunter at the command prompt to check for a rootkit virus using the
    command `# rkhunter -c`.

    +   - Check to ensure that permissions are correct.

    +   - Replace any code that has been compromised.


    If your server is attacked, and has a rootkit inserted above the website, it’s
    best to consider backing up data and re-imaging the machine instead of hunting
    for it. Some root kits will replace key files with their own. This makes it very
    difficult to tell without a code audit.


    Other rootkits can hide themselves from detection, or will leave a backdoor open
    for the hackers. This alone is one of the many good reasons for frequent and complete
    backups.


    # ## Using Standard Log Files


    Again, a log is a recording of historical events in a software application or
    hardware system. It tells you what has happened to your CMS or blog, site, or
    what someone did while there.


    Many logs are available to you, and the items they capture vary by what they monitor.
    Let’s review a few of the common log types:


    +   - *Apache access logs* — These are the primary files of record. They record
    all the activity for your website. Every time you browse a site such as `www.google.com`,
    you leave a wealth of information behind, and your'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'site is no different. You can tell what their operating system was, what resources
    they wanted, how long they stayed, and more.


    +   - **Error logs** — When something happens that should not happen to an application,
    to the CMS, or to other parts of the web server, an error is recorded. The error
    is recorded in the `error.log` file.

    +   - **FTP logs** — The FTP logs record all activity that occurred when a person
    connects to the FTP server on the server. This shows who logged in, what he uploaded
    or downloaded, and his success rate. More information may be available based on
    the different FTP servers.

    +   - **Application-specific logs** *(Drupal, Joomla!, WordPress, and Plone)*
    — Each of these has different means of recording information about what has happened.

    +   - **Mail log** — This is a very generic term for the logs that apply to your
    e-mail services. They are good for troubleshooting to see whether mail is going
    out or coming in, whether bounces have occurred, and other mail-related issues.
    In the event of a compromised mail server, any nefarious activity will be recorded.


    Most of these logs are common to every Linux, Apache, MySQL, and PHP (known as
    LAMP) server. The application-specific logs pertain directly to their own environments.


    With those basics in mind, take a look at an example of how an Apache log is built.


    # Anatomy of an Apache Web Server Log File


    Apache is an open source project dedicated to the development of a web server
    for UNIX, Linux, and Windows systems. In February 2010, Apache celebrated its
    fifteenth birthday. As of September 2010, according to `http://uptime.netcraft.com`,
    Apache had a commanding 57 percent share of the Internet market web server space.
    Apache has a wealth of features that make it one of the most popular web serving
    platforms on the market.


    Although Apache serves a host of needs, of interest for this discussion is its
    capability for logging activity on web servers. So, let’s learn a bit about the
    Apache log files.


    When a single “hit” occurs on a web server, a log entry is written. When the visitor’s
    web browser loads the requested page, it also requests and loads everything on
    that page.


    If a page consists of images (for example, a video with text), all of it must
    be loaded to complete the request. If the page has 10 items on it, then you’ll
    see 11 hits recorded for the request. After the web page and the 10 items it holds
    are loaded, the logging system records those 11 hits.'
  merge: -1
  img_proc: true
- pgno: 291
  md: "Keep in mind that the log entries on a busy site may be interspersed with other\
    \ log entries.\n\n# ## Understanding Log Formats\n\nApache logs are very flexible,\
    \ allowing you to configure the order of their entries. What they collect is extremely\
    \ customizable, which gives you the power to collect log entry data in a manner\
    \ that fits your needs. For most mere web server administrator mortals, the default\
    \ logging settings will suffice.\n\nFollowing are the three types of logging formats:\n\
    \n+   - *Common log format* — This is the default for Apache 2.2x. This format\
    \ is very common and easy to read. You'll see shortly that it has the basic information\
    \ about the transaction, such as IP address, date, time, and resource requested.\n\
    +   - *Combined log format* — This is identical to the common log format, but\
    \ offers two additional fields that track where the client came from, and what\
    \ the agent is. This could be the browser or a bot (such as Google bot).\n+  \
    \ - *Custom* — This entails building a custom log to meet your needs.\n\n> > **NOTE**\
    \ The custom log is out of the scope of this book. See http://httpd.apache.org/docs/current/mod/mod_log_config.html#customlog\
    \ to learn more about it.\n\n# ## Common Log Format\n\nThe common log format consists\
    \ of the following elements:\n\n```\n    LogFormat \"%h %l %u %t \\\"%r\\\" %>s\
    \ %b\"\n```\n\nEach of these placeholders is populated with data. Following are\
    \ descriptions of each of these placeholders:\n\n+   - `%h` — This field represents\
    \ the IP address of the client. For example, it could be the IP address of your\
    \ visitors, or a bot. By turning on `HostnameLookups` in your Apache configuration,\
    \ attempting to look up the name of the site (for example, `Google.com`) and populating\
    \ it in place of the IP address is possible. Typically, this practice is *not*\
    \ recommended because of the unnecessary load you'll place on your server.\n\n\
    > > **NOTE** Should your business requirements dictate the need for this practice,\
    \ consider using the logresolve directive instead. To learn more about logresolve,\
    \ see http://httpd.apache.org/docs/2.0/programs/logresolve.html."
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   - **%l** — This field commonly represents the RFC 1413 identity of the
    client, which is determined by `identd` on the client’s machine.


    > > **NOTE** Because this information is seldom reliable, the Apache log seldom
    includes it unless you''ve made a special configuration. If the information is
    not available, the field is populated with a hyphen. Thus, when you see a hyphen
    in the log entry, it means that the information requested is not available.


    +   - **%u** — This field shows the username if the login shows a `userID` of
    the person requesting the page (which, of course, requires a logged-in user).
    However, for the most part, you''ll likely see another hyphen in this field.


    +   - **%t** — This field indicates the date and time, as shown here:


    ```

    ```text

    [17/Sep/2010:08:10:00 -0600]

    ```

    ```


    The format is as follows:


    ```

    ```text

    [day/month/year:hour:minute:second zone]

    day = 2*digit

    month = 3*letter

    year = 4*digit

    hour = 2*digit

    minute = 2*digit

    second = 2*digit

    zone = (''+'' | ''-'') 4*digit

    ```

    ```


    +   - **%r** — This particular field in the log entry is very important. It gives
    you an idea as to what visitors are requesting from your site. Following is an
    example of information shown in this field:


    ```

    ```text

    "GET /filename.gif HTTP/1.0"

    ```

    ```


    The information inside the double quotation marks is the client’s request. This
    says that the client is using `GET` to connect to the website, and states that
    the client (the browser or the bot) is requesting the `filename.gif` file. It
    is using the `HTTP/1.0` protocol.


    +   - **%s** — This field shows a status code. For example, the entry 200 means
    that all is well. The server sends back a status code to the client to indicate
    what has happened. You will learn more about the specifics of status codes later
    in this chapter.


    +   - **%b** — The last part of the log entry, `%b`, indicates the size of the
    object returned to the client, not including the response headers. As mentioned,
    if no content was returned to the client, this value will be represented by a
    hyphen (`-`).'
