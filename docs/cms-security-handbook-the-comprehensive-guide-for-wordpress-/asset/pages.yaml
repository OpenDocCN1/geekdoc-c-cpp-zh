- pgno: 372
  md: 'state that the e-mail system is to be used for company business purposes only.
    As you will discover later in this chapter, many companies deem e-mail that is
    sent and received as company property. Be sure to consider that when drafting
    your acceptable use policy.


    # Unacceptable Use of Resources


    Unacceptable use of resources could be practically anything, because different
    companies have different views of what is and is not acceptable. However, it is
    the opposite of acceptable use. This section of your information security policy
    details what is clearly not up for negotiation.


    Define in this section of the policy the overview of what you will not accept
    (for example, racism, viewing or sending pornographic material, using company
    resources to run the employee’s own business, and so on).


    This section should tie back into the violations section of your policy.


    # Password Policy


    Define the password standards, the length of time between password changes, who
    the employee may give his or her passwords to, and why. You might consider adding
    to this a process or policy to guide the employee on procedures to follow in the
    event of a compromised password.


    # Software Installation


    Depending on the nature and size of your business, you may want to restrict any
    installation rights to your IT administrative staff. Write out the policy for
    installing software, such as “software may be requested through the change management
    process and will be installed by IT.”


    Spell out the policy on software licensing. That is, if software is licensed commercially,
    the company should have proof of that license before installation occurs.


    The goal of this part of the security policy is to prevent employees from attempting
    to install software they were given, downloaded, or brought in from another source.
    The installation of this software could open you up to legal or technical liabilities.


    # External Equipment/Installation


    You should have a general policy to prevent the installation of external devices
    such as wireless routers or switches or any other unauthorized devices. The'
