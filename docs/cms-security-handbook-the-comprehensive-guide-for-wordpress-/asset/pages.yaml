- pgno: 278
  md: '# Add-on Updates


    The third-party code and extensions to Plone are called add-ons. Like the core,
    each has a version specific set of instructions. For more information, see the
    following:


    +   - *Upgrading 2.5 to 3.0* — `http://plone.org/documentation/manual/upgrade-guide/version-2.5-3.0/products`

    +   - *Upgrading 3.x to 4.x* — `http://plone.org/documentation/manual/upgrade-guide/version/upgrading-plone-3.x-to-4.0/updating-add-on-products-for-plone-4.0`


    # Summary


    Now that you have completed this chapter, you are well versed on the process of
    patching.


    You learned quite a bit in this chapter, starting with the basic seven steps of
    a patching process and moving into the organizational and team-building process.
    You learned about testing your patches for safety, developing work instructions,
    and downloading patches safely. Readers who have remote administrators were introduced
    to the concept of standardizing patch deployments to them. The mark of a good
    organization versus a great organization is having good processes, and good processes
    start with documentation. Learning about how to document your updates wrapped
    up the team discussion.


    At some point, your site might be hacked, and, if so, you''ll be able to better
    deal with it using the guidelines presented in this chapter for patching after
    a breach.


    This chapter also provided some basic and general guidelines for patching each
    of the CMSs featured in this book.


    Chapter 8 discusses the very important topic of log review. In that chapter, you''ll
    learn about how to read logs for your site, server, and more. You will also learn
    how to use the logs to respond to various issues.'
