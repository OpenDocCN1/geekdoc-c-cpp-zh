- pgno: 323
  md: 'If you suspect or have proof that someone has gained physical access to the
    server(s), review the hardware logs on the machine for any sign of physical tampering.
    Ensure that no unwanted USB keys are attached to the server.


    > **NOTE** A recent breach of a U.S. military network was traced to a USB key
    with malware on it. You cannot be careful enough these days.


    If you''re sure your system was not physically tampered with, then proceeding
    to a check of the hardware logs is okay. However, as a matter of course, regularly
    performing a physical check of your machines is a good idea.


    # ## Network Logs


    You can obtain logs from several points in your network. They may be obtained
    from an *intrusion detection system*, which would tell you about attempts to break
    in. The *router* or *firewall* logs would keep you in the loop on many items.
    Generally, you want to copy logs for all devices in your network that may be impacted.
    Following is a partial list of events to look for:


    +   - Logins at unexpected times when things should be quiet (such as off hours)

    +   - Sudden jumps in bandwidth that are very out of the ordinary or unexpected
    (which could indicate someone is copying files down or up)

    +   - A sudden loss of services (which is an easy one, because your phone will
    quickly ring)

    +   - An increase (before, during, or after) of attempted logins from an unauthorized
    source

    +   - A list of login names at some point in time just before the hack (perhaps
    1 to 24 hours) to ensure that a login was not compromised


    Review the logs thoroughly to look for attacks or attempted attacks.


    # ## FTP Logs


    FTP logs show you who has logged in and out of the server, and with what username.
    If you find *your username* has been used, yet you know you didn''t give it out,
    then chances are that your desktop has been infected.


    > **NOTE** See Chapter 8 for an example FTP log.'
  merge: -1
  img_proc: true
