- pgno: 198
  md: '# CHAPTER

    6


    # Establishing a Workable

    Disaster Recovery Plan


    As you read the title of this chapter you might have thought, “Oh no. I don’t
    care about writing out a disaster recovery plan. After all, I am just a small
    business—not one with a large budget and lots of staff. Besides nothing has ever
    gone wrong.”


    If you don’t have a large budget, how will you pay for restoration of your site
    after a hacker breaks in? If the media rings your phone requesting a statement
    about your outage, what will you say? If you experience a significant problem
    like a fire, weather disaster, or earthquake, how will you be able to stay in
    business without a disaster recovery plan? If your hosting company has a severe
    outage, how will you take care of your clients?


    This chapter includes a mix of practical knowledge about how to back up various
    content management systems (CMSs). Also mixed in is some practical knowledge on
    how to build out a framework and documentation to manage the disaster.


    When you see a fire truck rushing to a scene of a fire, you don’t think about
    all the hours of drilling and training and preparing the firefighters put in.
    If you’re driving, you think about getting out of their way, and you’re glad it’s
    not you they are coming to see. To have a successful disaster recovery plan you
    need to drill, train, and learn with the same intensity as the firemen do for
    their jobs. When a disaster visits, you want to be able to respond.


    As a business owner, you have a moral responsibility to your employees, shareholders,
    families, and customers (and possibly your banker) to have'
