    # FTP Logs


    FTP is a useful tool for uploading and downloading information to your web-site.
    As part of your security measures, you should change your FTP password frequently.
    If possible, switch over to *Secure FTP (SFTP)* using a tool like WinSCP (`www.winscp.com`).


    FTP servers typically use the format known as XFERLOG. Although this is not universally
    true, it''s a safe bet that this is the case.


    A typical FTP log looks like this:


    ```

    Mon Sep 20 09:26:13 2010 2 192.168.1.1 3191

    /home/site/public_html/login.php a _ i r admin@domain.com ftp 1 * c

    ```


    Table 8-3 shows a breakdown of the typical XFERLOG format.


    # **Table 8-3:** XFERLOG Format


    | EXAMPLE | DESCRIPTION | PARAMETERS |

    |---|---|---|

    | Mon Sep 20 09:26:13 2010 | Current date and time when this occurred | |

    | 2 | Transfer time showing how long it took (in whole seconds) | |

    | 192.168.1.1 | IP address of remote host | |

    | 3191 | File size in bytes | |

    | /home/site/public_html/login.php | Filename (including directory) | |

    | A | Transfer type | A = ASCII; B = Binary |'
  merge: -1
  img_proc: true
