- pgno: 217
  md: 'Finally, you want some form of logging. Logging systems or software should
    include the date and time of the backup, who conducted it, what issues (if any)
    were encountered, what was backed up, and where the backup is located. Many other
    data points could be captured in this log that enable you to make that determination.
    As you draft your policy, be sure you don’t forget things such as e-mail that
    may be on your server as well. Don’t forget to review your discovery questions
    to ensure that you didn’t miss anything.


    In essence, your backup policy is to guide you and your staff in the handling
    and disposition of the data. It should be clear, concise, and easy to follow.


    In regard to specific hardware solutions, it all depends on your need and your
    budget.


    For a small business, a local Linear Tape Open (LTO) tape taken nightly or weekly
    and stored offsite might be sufficient. For example, you might want to review
    the BackupExec software for small business: (www.symantec.com/business/products/family.jsp?prid=backupexec).
    This would provide you with the logging needed and the capability to recover.


    When you grow into a medium-sized business, you want to “break the tape habit”
    by moving into an offsite replication or data-duplication solution. You might
    consider using a product such as the Dell EqualLogic storage system (www.equallogic.com)
    to create a local snapshot, and then replicate that to an offsite EqualLogic box.
    The replicated storage machine would then do a snapshot in the remote machine.
    This gives you multiple backups and a means of recovery.


    Additionally, in a medium-sized environment, you will likely be deploying some
    form of virtual computing (such as VMware) in that environment. Using a mix of
    the EqualLogic and the Quantum solution for virtual backups (www.quantum.com/Solutions/Virtualization/Index.aspx)
    would enable the logging and protection you need.


    > > **NOTE**  For more detailed information on the entirety of planning and implementing
    backups, see the book, *Implementing Backup and Recovery: The Readiness Guide
    for the Enterprise* by David Little and David Chapa (Indianapolis: Wiley, 2003).


    # Server-Side Backup and Restoration Methods


    The cPanel utility includes a great facility for backing up your web server. Incorporating
    this method into your plans is easy to do, and provides a full backup of your
    website. The downside to this tool is that it does a full backup, and the file
    can quickly grow in size. If that’s what you need, however, then there should
    be no problem. The size of the files could be large and take a little time to
    deal with during a download.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Another manual backup method is to use the command line (via Putty) to pull
    a copy of the database and the files separately. This has the advantage of speed
    and size, but the disadvantage of managing multiple file sets. First take a closer
    look at the cPanel method.


    # Using cPanel


    In many hosting situations the commercially available application cPanel is in
    use. This is one of the best website management tools around. It’s highly stable
    and easy to learn.


    The steps outlined here assume that cPanel is installed on your web host. The
    purpose of this discussion is to show you how to back up and restore using the
    cPanel system.


    To use cPanel, follow these steps:


    +   1. In cPanel, find the phpMyAdmin button and click it to open the phpMyAdmin
    administrator interface.


    +   2. Locate the database you want to export. In the example shown in Figure
    6-1, the chosen database is called watcher_cookbook. Click the Export button at
    the top of the screen to start the process.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_218_0.png)


    Figure 6-1: Selecting the database


    +   3. On the left side of the screen, click Select All to export the entire database.
    On the right side of the screen, click the checkboxes shown in Figure 6-2.


    The Comments checkbox under the heading, “Add custom comment into header (\n splits
    lines)” inserts the date and time information into all your table entries, as
    shown here. This is good for reviewing the correct database for a future restoration.


    ```

    ```sql

    -- Table structure for table ''backup_ios_sobi2_categories''


    --

    -- Creation: Dec 06, 2010 at 05:20 PM

    --

    -- Last update: Dec 06, 2010 at 05:20 PM

    ```

    ```'
