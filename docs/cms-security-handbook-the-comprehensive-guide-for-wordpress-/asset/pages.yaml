- pgno: 359
  md: '# Reducing Power Output of a WAP


    Many gadgets that people use every day are essentially radios (such as the car
    radio, satellite radio, cell phones, smartphones, Bluetooth system devices, and
    more). As you have learned in this chapter, your Wi-Fi router or WAP is a radio.


    Radio transmitters are measured in broadcast strength (that is, the amount of
    power they can output). It’s measured in milliwatts, watts, or megawatts (as is
    the case with your terrestrial car radio). The higher the power (or wattage),
    the farther the signal will travel. If your Wi-Fi signal can leave your premises
    through a window or other exit point, a directional antenna like the Yagi can
    gather up enough of the signal to use it.


    One feature that many modern routers support is reducing the power output. Sometimes
    this is marketed as a “green” approach, but, in reality, it really has nothing
    to do with the environment. The lower output reduces the strength of the wireless
    signal and, therefore, lowers the range it will travel with any effectiveness.
    Although this may fall into the “security by obscurity” category, this feature
    can be beneficial to safeguarding your wireless network.


    To determine whether your wireless router provides this capability, look for one
    of the following at your router’s admin setting:


    +   - RF POWER

    +   - TX POWER

    +   - Lower broadcast power


    These generic terms are often used by manufacturers to indicate the product provides
    the capability for you to reduce power output.


    > **NOTE** Be careful about manufacturers’ claims for some equipment. Some routers
    and WAPs may be marketed with the claim that they allow lowering of the power
    output, but you may discover that they do not. Check with the manufacturers’ websites
    to verify. Additionally, if the manufacturers offer any live sales assistance,
    you can pose the question via that method.


    If you have a high-output router, consider locating it as far into the center
    of your building as possible. Also, ensure that your transmission range is kept
    to a minimum. In other words, if you can walk across the street with your laptop
    computer in hand and connect to your wireless network, then the signal emanating
    from your wireless network is too strong.


    # Wireless Security Tools


    To better understand how to solve issues identified by your threat matrix, you
    should understand some of the tools available to the bad guys who want to'
