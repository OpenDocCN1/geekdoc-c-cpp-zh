- pgno: 318
  md: 'provides you with a secure method for connecting to your website. It has a
    great graphical interface, and eases the upload and download of files.


    +   - ■ Putty — This tool is used to connect to your server via a shell, and provides
    a command-line utility to your server. It is available from www.chiark.greenend.org.uk/~sgtatham/putty/download.html.


    # Clean Machine from Which to Work


    Having a clean machine from which to work is handy for downloading potentially
    infected files. If you do corrupt the machine, or infect it, you can easily re-image
    the hard disk and restore the machine to a clean state.


    # Hand Tools


    Having a screwdriver, pliers, nut-driver, and other essential tools for working
    directly on a server will make your life easier. This only applies if you have
    physical access to the machine.


    # Digital Camera


    This tool requirement is applicable only if you have access to the server. The
    purposes for the camera include snapping pictures of damage, recording the cable
    configuration, and many more uses.


    # Collecting the Information


    You should be aware that what follows is not a detailed method for collecting
    evidence for submission to a court of law. If you are planning on prosecuting
    an offender, you should immediately engage a professional forensics company to
    do proper collection of evidence. Do not attempt to change anything; contact a
    professional. The law requires very specific steps to gather, store, and transport
    digital evidence.


    Additionally, you may easily miss something that a professional would not. If
    you have any legal questions regarding this process, consult your attorney, because
    this book is not offering any legal advice.


    For the purposes of this discussion, collecting the information is solely for
    ensuring that the damage is repaired, and changing processes to prevent attacks
    in the future.


    Logs tell you a lot about what the hacker did or didn''t do. Likewise, the absence
    of logs could indicate the hacker erased them. To do so would require a higher
    level of privilege than a typical web application break-in.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '**NOTE** Not all problems in an operation are related to security. Some can
    be related to availability meaning that the asset (server) was not available,
    thus impacting the site.


    The server (hardware) logs would be of interest to you if you own your own equipment.
    Today’s server equipment can tell you a lot about how the machine is doing. Knowing
    that a potential memory failure exists on the horizon, or that a disk drive has
    degraded (starting to fail), will allow you to be proactive and replace the suspect
    component. For breach purposes, many manufacturers will record in BIOS or firmware
    whether a case has been opened.


    Make a copy of all the log files. Set those aside for now on a flash drive or
    CD-ROM. The purpose of the logs is to re-create a picture of what happened. You’ll
    learn more about that process shortly.


    Copying these logs is very important. Because logs could easily be located in
    non-standard places, you’ll learn more shortly about the generic means to copy
    them.


    Keep in mind a few rules about logs as you go through them:


    +   - If they are not being saved, then clearly you won’t be able to get them.

    +   - A compromised server could easily have its logs removed. If you choose not
    to use log rotation, you could run out of disk space, which could cause other
    problems.

    +   - Copying logs weekly or monthly, and deleting the old ones, should be fine.
    However, your company’s information security policy will supersede that practice.


    # System Logs


    Each CMS has a different approach to logging needs. Apache/Linux servers will
    write to the normal error log and access log locations.


    Each CMS provides different logging capabilities:


    +   - *Drupal* — Drupal has several functions (depending on the Drupal version
    and the logs you want to watch) to help you monitor logs. The three of interest
    are watchdog, dblog, and syslog. Using these (again, these are version-dependent),
    you can monitor the events recorded in your logs. You can always pull the logs
    manually from most web hosts. For example, you can view watchdog logs at Administer
    > Logs > Recent Log Entries (`admin/logs/watchdog`).

    +   - *Joomla Logging* — Most tools for Joomla! are designed for analyzing traffic
    to your site, and not necessarily for monitoring errors, and so on. To get detailed
    information for logging, reviewing the error.log file or the Apache logs directly
    is best.'
  merge: -1
  img_proc: true
- pgno: 320
