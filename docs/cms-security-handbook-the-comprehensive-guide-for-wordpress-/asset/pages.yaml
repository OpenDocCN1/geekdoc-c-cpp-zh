- pgno: 6
  md: '# About the Author


    Tom Canavan has enjoyed an extremely successful career in the technology sector
    for more than 24 years, working for companies such as Dell Computer and Texas
    Instruments. He has served in the roles of Director of IT, CIO, and many other
    valued and highly sought-after positions throughout his career. Having worked
    at all levels from field technician to senior management, he brings distilled
    knowledge and wisdom from the enterprise level down to the small and medium business
    world. Canavan has a degree in Robotics and Computer Numerical Control. His background
    includes many years in the computer hardware industry, and extensive experience
    in data center operations and the information security sector. Canavan has authored
    several books, and is a frequent public speaker on the topic of IT/information
    security. He is co-founder of Salusvalerting.com.


    # About the Technical Editor


    David A. Chapa is a Senior Analyst with the Enterprise Strategy Group, a research
    and strategic consulting firm. He has invested more than 25 years in the computer
    industry, focusing specifically on data protection, data disaster recovery, and
    business resumption practices. He has held several senior-level technical positions
    with companies such as Cheyenne Software, OpenVision, ADIC, Quantum, and NetApp.
    He has been a featured speaker at a variety of industry events covering various
    topics related to disaster recovery, compliance, and the use of disk, tape, and
    cloud for recovery and backup strategies. He is recognized worldwide as an authority
    on the subject of backup and recovery. Chapa is also a member of SNIA''s Data
    Protection and Capacity Optimization (DPCO) Committee, whose mission is to foster
    the growth and success of the storage market in the areas of data protection and
    capacity optimization technologies.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# # Acknowledgments


    For those who have never written a book, you never see the cast of many behind
    the author. While the writing belongs to the author, the quality of the writing
    is often enhanced by the team of people behind the author that make him or her
    look good. In my case, I believe I’m a decent writer, but with the editorial staff
    of Wiley, I look like a great writer. That “greatness” comes through the hard
    work and skill of the editors I had the honor to work with.


    I wish to thank my Project Editor, Kevin Shafer, and his team for helping me to
    produce what I hope to be a truly great work. I wish to thank Carol Long, my Executive
    Editor, for putting up with multiple delays, and for the opportunity to put my
    experience on paper and bring it to you. I especially would like to thank the
    Technical Editor, David Chapa, for his most excellent and challenging technical
    peer review of this work.


    Thanks to Jeff Star of perishablespress.com for his help with the art of .htaccess,
    and Doug Vann of dougvann.com for his valuable assistance with Drupal questions.


    Special thanks to my good friend Mark Turner of Walt-Disney Corporation, who inspired
    the original idea for this work some time ago.


    I thank my beautiful wife, Carol Ann, who has endured me writing yet another book
    and putting up with an unfinished remodel of our home during this time.


    In my 20-plus years in the technology industry, I have met and learned from so
    many people that I cannot begin to recall them all. Please know you are not forgotten.
    I appreciate your wisdom and guidance.


    And I wish to acknowledge and thank my Lord and Savior, Jesus Christ, who gave
    me the wisdom in this book and the ability to write it. Without Him I would not
    have ever embarked on this effort.


    Lastly, I wish to thank you, dear reader, for purchasing this book and reading
    it. I truly hope that you will find answers to questions about your security that
    will keep you safe and operational.'
  merge: -1
  img_proc: true
