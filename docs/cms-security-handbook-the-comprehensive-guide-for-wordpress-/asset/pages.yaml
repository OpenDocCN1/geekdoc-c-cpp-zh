- pgno: 403
  md: '# 1xx Series


    This class of status code indicates a provisional response, consisting only of
    the Status Line and optional headers, and is terminated by an empty line.

    Following are specific codes in this series:


    +   - 100 Continue — `HTTP_CONTINUE`

    +   - 101 Switching Protocols — `HTTP_SWITCHING_PROTOCOLS`

    +   - 102 Processing — `HTTP_PROCESSING`


    # 2xx Series


    This class of status code indicates the action was successfully received, understood,
    and accepted.

    Following are specific codes in this series:


    +   - 200 OK — `HTTP_OK`

    +   - 201 Created — `HTTP_CREATED`

    +   - 202 Accepted — `HTTP_ACCEPTED`

    +   - 203 Non-Authoritative Information — `HTTP_NON_AUTHORITATIVE`

    +   - 204 No Content — `HTTP_NO_CONTENT`

    +   - 205 Reset Content — `HTTP_RESET_CONTENT`

    +   - 206 Partial Content — `HTTP_PARTIAL_CONTENT`

    +   - 207 Multi-Status — `HTTP_MULTI_STATUS`


    # 3xx Series


    Codes in this series indicate that further action needs to be taken by the user-agent
    in order to fulfill the request. The action required may be carried out by the
    user-agent without interaction with the user if (and only if) the method used
    in the second request is GET or HEAD. A user-agent should not automatically redirect
    a request more than five times, because such redirections usually indicate an
    infinite loop.

    Following are specific codes in this series:


    +   - 300 Multiple Choices — `HTTP_MULTIPLE_CHOICES`

    +   - 301 Moved Permanently — `HTTP_MOVED_PERMANENTLY`

    +   - 302 Found — `HTTP_MOVED_TEMPORARILY`

    +   - 303 See Other — `HTTP_SEE_OTHER`

    +   - 304 Not Modified — `HTTP_NOT_MODIFIED`'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   - 305 Use Proxy — `HTTP_USE_PROXY`

    +   - 306 unused — `UNUSED`

    +   - 307 Temporary Redirect — `HTTP_TEMPORARY_REDIRECT`


    # 4xx Series


    Codes in this series indicate that the request contains bad syntax or cannot be
    fulfilled. The codes indicate a case where the client seems to have erred. Except
    when responding to a HEAD request, the server should include an entity containing
    an explanation of the error situation, and whether it is a temporary or permanent
    condition.


    Following are specific codes in this series:


    +   - 400 Bad Request — `HTTP_BAD_REQUEST`

    +   - 401 Authorization Required — `HTTP_UNAUTHORIZED`

    +   - 402 Payment Required — `HTTP_PAYMENT_REQUIRED`

    +   - 403 Forbidden — `HTTP_FORBIDDEN`

    +   - 404 Not Found — `HTTP_NOT_FOUND`

    +   - 405 Method Not Allowed — `HTTP_METHOD_NOT_ALLOWED`

    +   - 406 Not Acceptable — `HTTP_NOT_ACCEPTABLE`

