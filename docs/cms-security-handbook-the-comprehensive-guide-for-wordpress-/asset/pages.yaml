- pgno: 415
  md: '# Table B-2 *(continued)*


    | TERM | EXPLANATION |

    |---|---|

    | Contingency plan | Management policy and procedures written to maintain or restore
    business operations, including computer operations, possibly at an alternate location.
    |

    | Cookie | A piece of information supplied by a web server to a browser (along
    with a requested resource) for the browser to store temporarily and return to
    the server on any subsequent visits or requests. |

    | Countermeasures | Actions, devices, procedures, techniques, or other measures
    that reduce the vulnerability of an information system. |

    | Cross-Site Scripting (XSS) | An attack technique that involves attacker-supplied
    code sent into a user’s browser. Once there, the rogue code will execute as if
    the user were the one operating it. Overall, this event is disruptive for desktops.
    |

    | Data integrity | Data that has not been modified using unauthorized or unintended
    ways. |

    | Denial of Service (DoS) | The prevention of authorized access to resources or
    the delaying of time-critical operations. The time factor depends strictly on
    your tolerance for downtime. |

    | Dynamic Host Configuration Protocol (DHCP) | The protocol used to assign Internet
    Protocol (IP) addresses to all nodes on the network. |

    | Disaster Recovery Plan (DRP) | A written plan for returning your systems, software,
    and operations back to working or near working states following a disaster or
    loss. |

    | Exploit code | A program that allows attackers to automatically break into a
    system. |

    | False positive | A false report about malicious activity. |

    | Firewall | A gateway that limits access between networks in accordance with
    local security policy. |

    | Incident handling | The documented process to mitigate damage from an attack
    or loss. |

    | Least privilege | The security objective of granting users only the access they
    need to perform their official duties. |

    | Malicious code | Software or firmware intended to perform an unauthorized process
    that will have adverse impact on your systems or data. This could be a virus,
    worm, a Trojan horse, or any other code introduced for malicious reasons. |'
  merge: -1
  img_proc: true
- pgno: 416
  md: '| TERM | EXPLANATION |

    |---|---|

    | Non-repudiation | Assurance that the sender of information is provided with
    proof of delivery, and the recipient is provided with proof of the sender’s identity,
    so neither can later deny having processed the information. This is akin to a
    certified letter through the postal service. |

    | Nonce | A value used in security protocols that is never repeated with the same
    key. For example, challenges used in challenge-response authentication protocols
    generally must not be repeated until authentication keys are changed, or there
    is a possibility of a replay attack. Using a nonce as a challenge is a different
    requirement than a random challenge, because a nonce is not necessarily unpredictable.
    The use of a nonce is part of the Secure Sockets Layer or (SSL) transaction. |

    | Phishing | Tricking individuals into disclosing sensitive personal information
    through deceptive computer-based means. |

    | Port scanning | Using a program to remotely determine which ports on a system
    are open (for example, whether systems allow connections through those ports).
    See also “Scanning.” |

    | Public key | The public part of an asymmetric key pair that is typically used
    to verify signatures or encrypt data. It is a cryptographic key that is used with
    a public key cryptographic algorithm. The public key is uniquely associated with
    an entity and may be made public. In an asymmetric (public) cryptosystem, the
    public key is associated with a private key. The public key may be known by anyone
    and, depending on the algorithm, may be used to verify a digital signature that
    is signed by the corresponding private key, encrypt data that can be decrypted
    by the corresponding private key, or compute a piece of shared data. |

    | Public key certificate | A digital document issued and digitally signed by the
    private key of a Certification Authority (CA) that binds the name of a subscriber
    to a public key. The certificate indicates that the subscriber identified in the
    certificate has sole control and access to the private key. |

    | Remediation plan | A plan to remediate vulnerabilities in your infrastructure.
    This is done in lieu of a forthcoming fix (in most cases). |

    | Rootkit | A set of tools used by an attacker after gaining root-level access
    to a host to conceal the attacker’s activities on the host, and permit the attacker
    to maintain root-level access to the host through covert means. |'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Table B-2 *(continued)*


    | TERM | EXPLANATION |

    |---|---|

    | Salt | A non-secret value that is used in a cryptographic process, usually to
    ensure that the results of computations for one instance cannot be reused by an
    attacker. Random data of some form is gathered and added to the computational
    process. |

    | Scanning | The sending of packets or requests to another system to gain information
    to be used in a subsequent attack. |

    | Secure Sockets Layer (SSL) and Transport Layer Security (TLS) | Secure Sockets
    Layer (SSL) is a protocol developed by Netscape for transmitting private documents
    via the Internet. SSL works by using a public key to encrypt data that’s transferred
    over the SSL connection. Most web browsers support SSL, and many websites use
    the protocol to obtain confidential user information, such as credit card numbers.
    By convention, URLs that require an SSL connection start with `https` instead
    of `http`. TLS is an Internet standard based on SSL version 3.0. Only very minor
    differences exist between SSL and TLS. |

    | Spoofing | Sending a network packet that appears to come from a source other
    than its actual source. This involves the capability to receive a message by masquerading
    as the legitimate receiving destination, or masquerading as the sending machine
    and sending a message to a destination. |

    | SQL injection | An attack technique that exploits applications that have not
    checked for proper input. The attacker can supply SQL statements to the application
    and, if successful, the attacker can cause the instructions to be executed against
    the database. Note that this is a popular attack. |

    | Virtual Private Network (VPN) | A logical network that is established at the
    application layer of the Open Systems Interconnection (OSI) model, over an existing
    physical network, and typically does not include every node present on the physical
    network. |

    | Vulnerability | Weakness in an information system, system security procedures,
    internal controls, or implementation that could be exploited or triggered by a
    threat source. |

    | Vulnerability assessment | Formal description and evaluation of the vulnerabilities
    in an information system. |

    | Warez | A term widely used by hackers to denote illegally copied and distributed
    commercial software from which all copy protection has been removed. Warez software
    often contains viruses, Trojans, and other malicious code and, thus, is very risky
    to download and use (legal issues notwithstanding). |

    | Zombie | A program that is installed on a system to cause it to attack other
    systems. |'
  merge: -1
