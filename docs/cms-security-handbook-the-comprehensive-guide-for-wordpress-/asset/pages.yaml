- pgno: 143
  md: 'where you might not have a fix, and need a workaround. You can also keep a
    running record of past scans, allowing you to measure the security of the host.


    Take the time to learn more about Nessus and remember to ask for permission before
    scanning your servers.


    # ## Using Virus Scanning Tools


    Without a doubt, you should check the status of your system files using a quality
    virus scanner. Chapter 9 provides more detail on using a virus scanner to remove
    viruses from a hacked site.


    In the baseline, running the scanner will provide you with a clean bill of health.
    You''ll want to check the site files in the following directories:


    +   - Public_html (typically the name for the web directory)

    +   - Mail

    +   - Server files


    Additionally, you''ll want to ensure that you scan all your desktops or notebook
    computers that may connect to the site. This guarantees that you don''t have a
    virus hiding in the midst of your systems.


    # ## Remediating Problems


    The entire process of baselining is meant to find and eliminate issues that can
    and will impact your security. Remediation of any problems is very straightforward.
    In this step of the baselining process, you list and prioritize your issues, document
    the proposed fix, and lastly deploy it.


    # ## Categorizing and Prioritizing Issues


    As issues are identified through the baselining process, try to define them by
    criticality. This can provide a proper road map to correcting the issues.


    If you were to take the issues found by Nessus as described earlier, you might
    construct a spreadsheet like the one shown in Figure 4-12 to track and remedy
    the issues. Here, you can see that the spreadsheet is segmented by columns, allowing
    you to track the vulnerability, the risk factor, description of the vulnerability,
    and the recommended fix.


    You can quickly review your list of items and focus your time on the problems
    that matter most, and spend less time on those that matter least. As shown by
    the final entry in Figure 4-12, some issues are described by “No fix required.”
    You will want to track those anyway as part of the baseline. Although it’s not
    likely, a Low risk factor could become a Medium or High if a new exploit is discovered
    that can take advantage of it.'
  merge: -1
  img_proc: true
