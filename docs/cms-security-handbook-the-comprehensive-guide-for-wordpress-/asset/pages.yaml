- pgno: 183
  md: 'logging in with SSH is better than with FTP, you''ll want to add your users
    here. As a root, log in to the configuration file and add the usernames as follows:


    ```

    ```

    AllowUsers Username1 Username2

    ```

    ```


    This command tells SSH to only allow those users on the list to connect with proper
    credentials.


    When administering a machine, you should take care of business and then log off.
    Leaving an open connection is a bad idea. However, getting distracted by a co-worker
    or a phone call is simply part of life. Rather than living with the possibility
    of leaving a connection open for a long time, setting a time out is best.


    To limit the time a logged-in connection can remain idle, open the configuration
    file and locate the following files:


    ```

    ```

    ClientAliveInterval interval

    ClientAliveCountMax 3

    ```

    ```


    In the first line, ClientAliveInterval refers to the time (in seconds) that SSH
    will wait after not receiving any data before disconnection. Depending on your
    situation, replace the word interval with a number (in seconds). The second line,
    which defaults to 3, is the number of messages or attempts it will try before
    disconnecting. Thus, if you have the interval set to 15 seconds, a non-response
    from the SSH client (WinSCP, Putty, and so on) will disconnect in 45 seconds (15
    times 3). Set these for the times appropriate to your needs.


    SSH (via Putty) can allow you to log in directly as the super user. However, you
    should not do this as a matter of course. Rather, log in as your normal (non-super
    user username) and then escalate your privileges once in there. What that means
    is that once you log in with Putty, you should see a $ sign versus a # sign.


    Edit your configuration file as follows to disable root login (super user) on
    SSH:


    ```

    ```

    PermitRootLogin no

    ```

    ```


    This ensures that you cannot log in as root from SSH.


    The default is to not allow a username only. Rather, you must have a username
    and password. Check to ensure that the following line is set to no:


    ```

    ```

    PermitEmptyPasswords no

    ```

    ```


    SSH (and SFTP) by default runs on port 22. You can change this to almost any other
    port. In fact, although it''s not anywhere near foolproof, changing your port
    is a good idea. To do so edit the field in your configuration as follows:


    ```

    ```

    Port X

    ```

    ```


    Change X to the port number of choice.'
  merge: -1
  img_proc: true
