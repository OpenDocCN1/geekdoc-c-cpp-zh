- pgno: 97
  md: '+   - In the CMS of choice, do you understand the Access Control Lists (ACL)
    options? (This is important to control access to the site''s resources.)

    +   - Does the CMS provide adequate core tools, or are proper third-party add-ons
    available that you can use to solve your business problem?

    +   - Will the third-party add-ons cause any problems with each other?


    This chapter can help guide you through learning about each CMS and how to properly
    install it with proper security in mind. Let’s begin by looking at how to choose
    the appropriate CMS for your business application.


    # Choosing an Appropriate CMS for Your Needs


    You may not necessarily share that same passion for a particular software (or
    hardware) platform that seems to be the status quo of open source projects and
    their fans. Although acknowledging the passion that the developers and the community
    bring to each of these is good, the passion for your business should supersede
    that.


    You should view CMSs just as what they are — tools. Take a look at each CMS addressed
    in this book and choose the one that best helps you achieve your business goals.
    Making a list of the features and functions you need, as well as the skills you
    have to manage the solution, can help you with that choice. Each of the CMSs covered
    in this book can help you solve the goal of getting your business on the web.
    For that matter, a high school student could do the same thing by building an
    HTML page. But is that what you really want?


    The real key is what you want the platform to do for you. What business goal will
    it solve? Start there, and make the right business decisions for the project software
    you choose.


    # Making the Right Business Decisions


    The first business decision you must make is defining what your site is being
    built to do. Is it a corporate *brochure site*? Is it an *e-commerce* site? Will
    your solution need live customer service or chat capabilities? Identifying the
    purpose of your site will lead you to a number of other questions. Asking these
    questions first will guide your design choices.


    Secondly, you must consider the intangibles involved with this effort, both before
    and after it’s built. For example, if you have a technical staff, do they have
    the technical programming skills to support the site? Do you have a trusted technical
    developer who can work with the code, should it need it? What about the server
    operating system and associated moving parts?


    Three of the CMSs covered in this book (Joomla!, Drupal, and WordPress) are all
    written in PHP. Plone is written in a different language called Python.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'In most cases, choosing one or the other CMS will necessitate a developer with
    skills equal to the chosen CMS.


    You should also consider the ecosystem in which the CMS lives. Joomla!, Drupal,
    and WordPress enjoy a very large third-party development community. All three
    are easy enough to use.


    Plone has a much smaller market share and, hence, a smaller ecosystem of developers.
    What Plone lacks in market share, it makes up with a hearty, solid CMS and a spirited
    community. Plone has a much heavier technical requirement than the other three,
    and, as such, having a strong community backing is a good thing.


    Let’s take a look at a bit of background about each of the CMSs covered in this
    book.


    # ### Joomla!


    In the world of Open Source, when a group of developers wishes to redistribute
    code with their changes and likely a new name, it’s called a fork. Joomla! is
    one of the more successful forks of the open source project that was known as
    Mambo. Over the last several years, it has grown dramatically, and has become
    one of the most popular CMS platforms around. Joomla! has a very active ecosystem
    of third-party developers, many of which offer commercial products and support.


    By and large, you can use Joomla! for everything from simple websites all the
    way to collaboration websites.


    You can find practically any type of extension (as add-ons are known in Joomla!)
    for almost any need. The development community for templates (that is, skins that
    change the look) is very deep and wide, offering literally thousands of templates.
    The Joomla! extensions site (http://extensions.joomla.org) lists hundreds and
    hundreds of extensions covering a vast variety of categories. For example, in
    the e-commerce category, more than 20 third-party developers offer shopping carts
    alone.


    The Joomla! commercial development community is a very innovative group. One developer
    (www.corephp.com) even offers an extension that enables you to run almost any
    Drupal module on a Joomla! website.


    Joomla! is well-documented, and many published authors have written about the
    platform. It is considered medium-difficulty software for the beginner.


    # ### Drupal


    Drupal''s install base is nearly as large as Joomla!''s, but with a number of
    key differences. Drupal is considered to be more technically challenging than
    Joomla!. Unlike Joomla!, most Drupal modules (the term for Drupal add-ons) are
    free, rather than for sale. This represents a cultural difference between the
    Drupal and Joomla! communities.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Drupal is very robust and is being used in some very high-profile websites
    (such as www.whitehouse.gov). It enjoys an excellent third-party development community,
    and offers a host of module add-ons.


    In terms of complexity and technical challenge, Drupal just might rank above Joomla!.
    Drupal 7 seems to have eased a number of the challenges of previous versions by
    building in a number of modules in the core installation. Drupal 7 marks a great
    forward step toward easing some of the technical challenges for the average user.


    # **WordPress**


    WordPress is the most popular of all the CMSs in this book. It has the largest
    install base of all CMS platforms. WordPress began its life as blog software,
    but has moved into the CMS space.


    WordPress is the right choice if you need a company blog. It’s easy to use, with
    an intuitive interface conducive to writing blogs. The community offers several
    themes (the name for the skin of WordPress) for free, and many more are commercially
    available.


    *Plug-ins* (the WordPress term for add-ons) are abundant and, for the most part,
    free. Although e-commerce is possible with specific plug-ins on WordPress, you
    may find the other CMS platforms more suited to the task using other third-party
    add-ons.


    WordPress is very easy to install, and a fairly secure system. Many websites you
    visit are probably running on WordPress.


    # **Plone**


    Of the four CMSs discussed in this book, Plone is clearly the most technical to
    set up and manage, but it is as easy (or perhaps easier, in some ways) to add
    and manage content to it as WordPress or Drupal, both of which have a fairly robust
    and user-friendly means for adding content. This CMS appears in this book in an
    effort by the author to expand the horizons of the business community.


    Plone does not have as big of a community as the other three CMSs discussed in
    this book, but plone.org offers an abundance of *add-ons* (the Plone term for
    add-ons). You may also visit www.contentmanagementsoftware.info/plone/ for additional
    add-ons.


    Plone is built on top of the Zope framework, and works on many operating system
    platforms.


    # **Which CMS Offers the Best Security?**


    You’re reading this book, therefore, you’ve no doubt pondered the question, “What’s
    the best CMS from a security perspective?” The somewhat tongue-in-cheek'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'answer is that all CMSs are safe until you install them and put them online.
    The reality of this is that all the CMSs covered in this book can and do suffer
    from vulnerabilities from time to time.


    Since March 2009, salvusalerting.com has tracked a number of different applications
    and projects. What was discovered in looking back over nearly two years of data
    was that the CMS with the *fewest* vulnerabilities was Plone. The rest are all
    within a hundred or so vulnerabilities of each other. That does not mean that
    Plone is the most secure, and that Drupal or Joomla! or WordPress are vying for
    the distinction of “the CMS voted most likely to fail.” It simply means that Plone
    has the fewest number of published vulnerabilities.


    The development teams of all these CMSs take security very seriously. The area
    in which you should focus your research includes the third-party extensions developers.
    This is where you are more likely to run into security issues.


    # Four Factors to Consider from a Business Point of View


    Overall, you should use four key tenets to form your decision on which CMS to
    use. Consider these guiding principles as you move into the selection phase.


    +   - *Supportability* — Can you or your staff support it? Can you answer user
    questions? Do you know how to add content? From time to time, all of these CMSs
    will require updates, add-ons, and more.

    +   - *Viability* — Although these four CMSs are not really at risk of going away
    because of their following and installed base, the question still should be asked:
    Will the CMS of choice maintain bug fixes and patches? If any commercially available
    or open source software platform stops the support, are you prepared to migrate
    to a new platform, or continue to care for and feed the technical needs of the
    old system?

    +   - *Functionality* — In the core platform or with third-party add-ons, does
    the CMS you choose offer the functions you need? When you draw up your selection
    criteria on paper, create a spreadsheet and list the function or process you need
    it to support. Also list the core software or third-party add-ons to support the
    CMS.

    +   - *Security* — Although the four CMSs examined in this book do offer strong
    default levels of security, many other tools also offer enhanced levels of security.
    So, the security question to ask is what does the CMS and its third-party offerings
    have to protect your site from attacks?


    # Considering Development Costs


    Development costs can quickly get out of control, and then the security becomes
    relegated to a *nice-to-have* status.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'When you prepare to develop your site, or have a third-party developer handle
    this for you, approaching the entire effort holistically will yield better benefits.
    The site will be highly survivable in an attack if you plan upfront for security.


    Calculate the cost for backing up the system — including any utilities and time
    it will take you or your staff to use the necessary tools. If you want to include
    specific security functions or tools, define them upfront, or get the web developer
    to provide you with an accurate cost.


    Another cost you may consider budgeting for is a code audit in the event that
    you have software written by a third-party developer. What this amounts to is
    hiring another software developer (in addition to the primary developer) who will
    review the code. The items you may want the auditor to look at could be any number
    of things, but following are some key areas:


    +   - SQL injection vulnerabilities

    +   - Cross Site Scripting (XSS) vulnerabilities

    +   - Remote file inclusion vulnerabilities

    +   - Backdoors

    +   - Trojan code

    +   - Debug code


    For the most part, these areas should not be a real issue. But if a project is
    fully custom-written, then having a second pair of eyes on the code won’t hurt.


    # Considering Support


    Support is often overlooked or “underplanned.” Sadly, this often results in the
    “I need support and I need it now!” situation. When you choose a firm to hire
    for software development, take the time to understand its support policies for
    post sales. Here are some guiding questions:


    +   - Does it offer post-sale support?

    +   - If not, does it have a company it recommends?

    +   - If the firm makes modifications to the core CMS code, how is it documented?
    How will upgrades take place?

    +   - What are the costs associated with the firm’s support?

    +   - What warranties (if any) does it offer on its work?


    Assuming the software development firm does provide post-sale support, how are
    problems and questions handled? This often is done through a ticketing system,
    but not always. Finding out upfront is best.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Following are a few options to consider:


    +   - Few commercial firms offer *only* support, such as OpenSourceSupportDesk.com,
    which offers support of WordPress and Joomla!.

    +   - You may choose to run your WordPress site directly with www.WordPress.com,
    and it will manage the core software for you, thus relieving you of that burden.

    +   - If your site is built on Drupal, you may opt for www.drupalgardens.com,
    which offers support for updates and more.

    +   - Plone has a healthy community with more than 300 companies that offer some
    form of Plone support. Visit www.plone.net/providers for more information.


    Support is a multi-faceted issue, and keeping up with it can be costly. When you
    are in the CMS selection process, following are some support questions to consider:


    +   - How will you discover whether the CMS or an add-on has vulnerability?

    +   - How quickly does the CMS respond to security issues?

    +   - Does the add-on developer offer support? If so, what is the cost, and how
    quickly will the developer respond to problems?

    +   - Does the third party charge for updates?

    +   - What is the difficulty level of updating?

    +   - What security features are built in the *core* CMS?

    +   - What third-party security applications are available?


    # ## Building It Before You Build It


    It has been my experience that people tend to get wrapped up in the details of
    the look and feel of a site, instead of how it works. Although the look and feel
    is very important, you should spend time designing the workflow of the site and
    system first.


    For starters, here are some considerations about the functionality of your site:


    +   - Will the end users need to, or be required to, register?

    +   - Will the site automatically allow them to log in?

    +   - What information will the end users need to provide?

    +   - What will they do after they log in?'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - What is the lost password policy?

    +   - What features should the login have?

    +   - What permissions or access will the users get?

    +   - Will you have more than one administrator of the site?

    +   - What will these administrator roles be?


    As you can see, these are the detailed questions that do not involve the actual
    colors, pictures, or text on the site. They are designed to help you get the site
    workflow in place.


    A low-tech (but effective) method to approach site planning is to lay out the
    functions on index cards and then list the potential third-party extensions (add-ons)
    that can fulfill those functions. If you settle on an add-on, record the URL,
    support information, or telephone number on the index card for future reference.


    Additionally, take a look at the track record of the developer via the change
    logs to see a record of security fixes. If the developer has a lot of fixes, it
    could mean the company is proactive, and you may feel good about using that company.
    It could also mean that the company is not that good at coding. No good metric
    exists to depend on for this determination; it’s more of a matter of intuition.


    Use the paper method to run through a workflow. Verify the ACL for each resource,
    and run through any potential holes you might be creating.


    Lastly, you want to decide on paper what environment you will develop on — a server
    or your desktop. Let’s take a detailed look at both options.


    # Developing on a Server


    When you develop on a server, you will be accessing it either over your internal
    network or over the Internet. Protecting the development site from prying eyes
    is important. The easiest method to do this is to use the Apache .htaccess file.
    You can very easily set up a method to allow only authorized persons into the
    site.


    > **NOTE** Appendix A provides more detail on using the `.htaccess` file.


    The summary of the process is as follows:


    +   1. Create a password for your `.htpasswd` file.

    +   2. Save the `.htpasswd` file upload to a non-public portion of your server.
    In most cases, that is the directory above `public_html` . . .

    +   3. Write out a short bit of `.htaccess` code and place it in the root directory
    of your site that calls the password file and checks the given password against
    the stored version. The following is an example of the `.htaccess` code:


    ```

    AuthName "Restricted Area"

    AuthType Basic

    AuthUserFile /home/mysite/public_html/.htpasswd

    ```'
  merge: -1
  img_proc: true
- pgno: 104
  md: '```

    ```

    AuthGroupFile /dev/null

    require valid-user

    ```

    ```


    Anyone browsing to the site will see the screen shown in Figure 3-1.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_104_0.png)


    **NOTE** A good site is available that can assist you with everything you need
    to do to set up the password system via .htaccess. Visit the site http://tools.dynamicdrive.com/password
    to generate your password hash and to get the proper .htaccess code. You must
    provide some information about your particular setup for it to provide you the
    necessary code.


    # ## Developing on a Desktop


    The GNU/GPL tool called WAMP is a fully self-contained Windows desktop environment
    in which you can run Apache, MySQL, and PHP. For the most part, it will behave
    identically to a server.


    This tool enables testing, provides a development location, offers a safe environment
    to explore patches before going live, and more. This tool enables you to develop
    without having to be constantly connected to the Internet.


    Installation and configuration are very straightforward. This is a great way to
    safely explore and test extensions. If you use this method to develop, you can
    back up the finished site, and then upload it into production.


    **NOTE** You can obtain the software at www.wampserver.com.


    # ## Performing CMS Installations


    For the most part, the CMSs examined in this book all offer straightforward installations,
    and are well-documented. This section discusses generic installations, with special
    attention on security concerns. The first installation discussed is Joomla! 1.5,
    with a few notes about Joomla! 1.6. Next, you learn about installation of Drupal
    6.xx, and see a few comments about Drupal 7.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Plone instructions follow, using the latest (as of this writing) version of
    Plone available. Finally, you’ll learn about WordPress, which has the easiest
    installation of all.


    For Joomla!, Drupal, and WordPress, you need the following before you get started:


    +   - Working server (WAMP or Linux)

    +   - Apache

    +   - MySQL with a configured database

    +   - PHP (5.xx)

    +   - Your username, database name, and password for the database

    +   - FTP or SSH account with credentials


    In the case of Plone, you’ll need access to the server via Putty or other means.
    You can do most (if not all) of the installation at the command line.


    # Installing Joomla! 1.5


    Joomla! installations are usually straightforward and offer little trouble. The
    problems you may encounter will likely plague all the CMSs examined here, and
    that includes permissions, ownership issues, incorrect database settings, and
    so forth.


    After you download the compressed installation file, you must unzip (uncompress)
    it and upload it to your server’s web root directory (typically public_html).


    To commence the process, open a browser and visit the domain where Joomla! will
    be installed, such as http://www.YourDomain.com. This kicks off the installation
    routine.


    Like the other CMSs, Joomla! has the capability to support multiple languages.
    In the first screen, you choose the language the site will default to, as shown
    in Figure 3-2.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_105_0.png)


    **Figure 3-2:** Language choice'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The installation script will check the environment where you are attempting
    to install. If an issue exists, you will see the problem displayed in the confirmation
    screen shown in Figure 3-3, the next screen in the installation process.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_106_0.png)


    Figure 3-3: Pre-installation check


    As you can see in Figure 3-3, the Display Errors setting is actually On, but the
    recommended setting is that it be turned off. You can remedy this situation in
    your php.ini file. After you review this page, write down anything that needs
    correction (such as the Display Errors setting in this example) for later remediation.


    Click Next and the Joomla! license page appears. After you review the license
    terms, click Next to proceed to the Database Configuration screen shown in Figure
    3-4.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_106_1.png)


    Figure 3-4: Database Settings page'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The settings here are categorized as Basic and Advanced. In the Basic settings,
    enter the database connectivity and other settings, using the following as a guide:


    +   * Database Type — In this example, this is set for MySQL, which, for most
    people, will be the right choice.

    +   * Host Name — Most of the time, this is localhost, but for some web hosts
    you will have a specific server name.

    +   * User Name — This is the user specified for the database.

    +   * Password — The password for the database.

    +   * Database Name — This will be the name of the database you gave when you
    created it.


    Under the Advanced Settings, you see two radio buttons and a text box. Selecting
    the “Delete existing tables” option will wipe your database clean of any previous
    entries. If you are reinstalling and have not backed up your database, then select
    the second option, “Backup Old Tables.” This creates a database prefix of bak_.


    The Table Prefix in your database defaults to jos_. You may want to change this
    for “security-by-obscurity” reasons. Changing the Table Prefix won’t make you
    more secure, but it will lower the obvious profile. For now, leave it as the default
    of jos_ and click Next to continue.


    The built-in FTP layer allows specific File Transfer Protocol (FTP) functions
    within your Joomla! site, as shown in the next screen, displayed in Figure 3-5.
    Although opinions are mixed, the recommendation is to leave this disabled. If
    you want to enable it, you must provide the FTP authentication information. Click
    Next to continue.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_107_0.png)


    Figure 3-5: FTP Configuration page


    The next screen you see enables you to enter information about your site, as shown
    in Figure 3-6. Here you fill in your site name, proper e-mail address, and'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Choose a strong administrator password. Notice that the Your E-Mail option
    has the word `admin` in it. This is a default that appears in Joomla! 1.5. It
    does not change your actual superuser admin name.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_108_0.png)


    **Figure 3-6:** Naming your site


    In the lower portion of Figure 3-6, notice two other settings:


    +   - *Install Sample Data* — Selecting this option will populate your site with
    all types of menus, content, sections, and categories. This is a great way to
    learn how the system works, but might get in your way for a production site.

    +   - *Load Migration Scripts* — Select this option to migrate an old Joomla!
    1.x site to Joomla! 1.5.1. Migrations of 1.0 to 1.5 are beyond the scope of this
    book. Do not load the migration script.


    Click Next to continue.


    The final screen, shown in Figure 3-7, directs you to remove or rename the directory
    named `Installation`. You''ll need to FTP or SSH into your server or website to
    take care of removing this directory. You should simply delete the folder.


    From here, you can visit the site or log in as `admin`.


    One detail that will improve your security is to get rid of the default admin
    user. Follow these steps:


    +   1. Log in as admin.

    +   2. Create a new user.

    +   3. Escalate the privileges of the new user to super administrator.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   4. Save the change and log out.

    +   5. Log in again as the *new* super administrator you just created.

    +   6. Lower the former admin user privileges to a registered user.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_109_0.png)


    **Figure 3-7:** Joomla! Installation complete


    You’ve now removed the *default* admin user. What you have done is to remove the
    obvious admin as a target for a hacker. For example, changing it to K39F028 as
    the username would make an attacker’s attempt at a brute-force attack much more
    difficult, because the intruder wouldn’t know the username.


    # Installing Joomla! 1.6


    Joomla! 1.6 is the next generation of Joomla! For the most part, installation
    of version 1.6 is identical to version 1.5, except for the changes described in
    this section.


    As shown in Figure 3-8, the FTP Configuration screen now indicates the FTP layer
    is Optional.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_109_1.png)


    **Figure 3-8:** Joomla! 1.6 FTP Configuration screen


    Another difference is at this point in the process where, in the 1.5 installation,
    you name your site. In the version 1.6 installation, you’ll find a few new options.


    Advanced Settings is now up near the top of the screen, as shown in Figure 3-9,
    and contains the Meta Description and Meta Keywords options. For search engine-related
    activities, this location is highly valuable.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_110_0.png)


    Figure 3-9: Updated screen in Joomla! v1.6 installation


    Another change is the capability to change the admin username at installation
    time. As you learned earlier in the description of the 1.5 installation, changing
    the default admin username is an important security step. However, version 1.5
    installation does not offer a means to do so at the time of installation. Version
    1.6 has remedied that. This important step in security has been made part of the
    default version 1.6 installation routine. Be sure to rename the admin user to
    something other than admin.


    You will find the rest of the steps for installation are identical, or similar
    enough, to version 1.5 that you should not have any real surprises.


    As a final note on security, version 1.6 offers a new ACL system that allows you
    to grant or revoke access to content and extensions in a very granular fashion.
    Be sure you spend time understanding the ACL so that you do not create an inadvertent
    security issue.


    # Installing Drupal


    Drupal offers a mature and straightforward installation routine for the CMS. To
    begin, uncompress your Drupal installation files and copy them to the web root
    of your server using FTP or SSH. Browse to your domain and the installation should
    start automatically.


    The first screen you see (see Figure 3-10) allows you to select your language.
    For purposes of this discussion, choose English, but note that Drupal has the
    capability to install other languages.'
  merge: -1
