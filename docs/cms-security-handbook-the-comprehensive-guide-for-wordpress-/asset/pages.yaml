- pgno: 314
  md: '# CHAPTER 9


    # Hack Recovery


    When a server or website has been hacked, the impact of the dastardly deed is
    similar in nature to a criminal breaking and entering into your building. It has
    a tendency to leave you with an unsettled feeling that your security is bad, and
    that you are vulnerable to attack.


    Although a criminal breaking in to your building is not likely to leave behind
    a bug to listen in on your private conversations, a hacker might. A hacker has
    many reasons to break into a computer, and leaving behind something like a Trojan
    horse or keylogger to steal passwords is very common.


    Dealing with a hacked machine or website is a time-consuming and potentially frustrating
    venture. In cases such as a theft of credit card information, a hack can also
    be very costly. The level of frustration, and the cost associated with the hack,
    can vary, depending on the type of attack. Consider these examples:


    +   - In the event of a kiddie-scripter, who attacks and places some well-known
    malicious code on the server, dealing with the attack may simply be a matter of
    cleaning up the malware and patching the code used to get in.

    +   - The placement of a *rootkit* package on your server means you have a lot
    of work ahead of you getting rid of the virus and fixing the damage.

    +   - As time goes forward, your Joomla!, Drupal, Plone, or WordPress site may
    be targeted to become a zombie, a growing cyber threat.

    +   - As this chapter is being written, a new malware called *Stuxnet* has worked
    its way into the control systems for electrical generation facilities. This'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'new breed of virus is still being studied for its power. It is unlike almost
    anything seen before.


    +   - Another malware/bot known as Zeus is spreading around the world. For now,
    it would seem that Zeus is not a prelude to a widespread attack against the U.S.,
    but rather an organized criminal effort. Gaining access to a powerful server such
    as yours, and placing it at the disposal of a shadowy group of cyber-mercenaries
    or state-sponsored hackers, makes for a tempting target.


    All of these are *in addition* to the thousands of scripts in use today that are
    available to attack your site. However, the discussions in this book treat an
    attack as something that could be much more than a simple defacement. You should
    treat an attack very seriously, and, obviously, taking a hard stance against security
    weakness will make for better security of your site.


    When you are attacked, you should treat it as a hostile act against your server,
    and you should take all the necessary steps to stop it and prevent it from happening
    again in the future. Literally, the purpose of this book is to teach you how to
    integrate good *information security practices* into your daily business operations.


    This chapter introduces you to a framework to respond to attacks, collect evidence,
    teach you how to work toward closing holes in your security, and show you how
    to restore operations.


    # ## Activating Your Disaster Recovery Plan


    If you are attacked, the key feeling will be some form of panic. Take some advice
    culled from experience: Do not succumb to that panicked feeling. It will lead
    to more mistakes, bigger problems, and may cause you to overlook something.


    Chapter 6 covers the process of crafting your own disaster recovery plan. In the
    event of a hack on your website or systems, you will likely activate your plan.
    As you may recall, the implementation of your disaster recovery plan requires
    that you define the initial actions you will take after you determine there’s
    an issue.


    The issue typically is a disruption of some sort in your website or infrastructure
    operations. This can include an impending disaster. In the activation of your
    disaster recovery plan, you will notify your team and determine what the outage
    is. If the outage includes a portion of your site or the entire server, your plan
    should account for this.


    Let’s review your general initiation plan.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Why Activate Your Disaster Recovery Plan?


    The *why* behind activating your disaster recovery plan means that some emergency
    situation previously being defined by the plan you created has arisen. This reason
    could be any number of issues such as power failure, data loss, or, in this example,
    a cyber attack.


    # Who Should Activate the Plan?


    If you are a one-person operation, then *who* will determine that an emergency
    exists and declare the emergency will be you. In a larger operation (such as a
    small or medium-sized company), a documented chain of command is usually in place.
    When a disaster has been declared, the process should be followed to restore operations.


    Another tenet of this activation plan is a defined process to notify the affected
    personnel in the organization about the disaster. This is the point at which you
    roll out your communications plan.


    # How Do You Restore Operations?


    The *how* behind implementing the disaster recovery plan depends greatly on what
    the issue is. In the case of a cyber attack, your procedures should consider doing
    a full restore from known good backups.


    Now that you understand the basics of a disaster recovery plan, take a look at
    the specifics surrounding the recovery from a hack.


    > **WARNING** Depending on when you made your backup, the restored files may still
    be infected. Trust your backups, but certainly verify that they, too, have not
    been infected.


    # Tools for Successful Recovery


    As part of your recovery toolkit, you should keep a few things close by. Although
    you will use most of the tools examined in this section, some (such as a digital
    camera) may be highly optional.


    # Virus Scanner


    Without a doubt, you should be protecting your desktop machine with a good *virus
    scanner*. In some cases, the virus scanner may also check for viruses in your
    files. One preferred virus scanner is Kaspersky available from www.kaspersky.com.'
  merge: -1
  img_proc: true
