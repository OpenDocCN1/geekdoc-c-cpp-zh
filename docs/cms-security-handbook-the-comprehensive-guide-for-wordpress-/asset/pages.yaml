    e-commerce path. You also learned about hosting your own web server.


    Based on all this data, you are now armed with the knowledge you need to make
    a decision on where to host, what to look for, and what plan you should select.
    Chapter 3 examines how to prevent problems before they start through the proper
    installation of a CMS and the handling of post-installation security issues.'
