- pgno: 270
  md: 'space, this is a very mature feature, and many of the third-party developers
    do not do this. Akeeba presents a button when you open the extension for use,
    letting you know a backup is available. Clicking the button quickly downloads
    and updates the extension.


    Other extensions, however, allow you to go through the normal installation routine
    to update them. They will overwrite the old one.


    Most Joomla! extensions require you to uninstall the old version before installing
    the updated or patched version. Consult with the developer on specific instructions
    for each extension.


    # WordPress and Its Plug-ins


    Current versions of WordPress have a very mature means for updating your CMS and
    the plug-ins (that is, add-ons for WordPress). WordPress itself will tell you
    in the Dashboard when an update is available. If a new version becomes available,
    the message “You are using WordPress 3.0.4” indicates a new version out to the
    right of the message. To update, simply click the Update button and, within seconds,
    you have the latest version of WordPress.


    Plug-in updates and patches work in a similar fashion. You reach them by visiting
    the Dashboard and scrolling down on the right until you see the Plugins control
    panel, as shown in Figure 7-9.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_270_0.png)


    **Figure 7-9:** WordPress Plugins Control Panel


    In this figure, notice the “2” in a shaded circle next to the word “Plugins,”
    which indicates that two updates are available. Click Plugins to review and update,
    as shown in Figure 7-10.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_270_1.png)


    **Figure 7-10:** Dashboard shows two updates'
