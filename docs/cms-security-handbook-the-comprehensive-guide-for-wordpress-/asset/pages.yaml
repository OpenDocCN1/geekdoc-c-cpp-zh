- pgno: 205
  md: '# Table 6-2 *(continued)*


    | GROUP | RESPONSIBILITIES |

    |---|---|

    | **Your insurance agent** | If you are a business of any size, then you’ll have
    an insurance company. If you’re a small business, then consider the local disaster
    of a stolen laptop, or a laptop that has water spilled on it. How will you replace
    that equipment? Review your policy with your agent and, if possible, add coverage
    for your business machines. As a medium-sized business, you’ll have different
    insurance needs. In either case, involve your insurance agent in the initial planning
    process to determine whether the agent can help. Be sure you have documented what
    you will need to provide the insurance company. |

    | **Media and bloggers** | Today, CMS projects get a lot of media coverage. However,
    the media may not know the specifics of your CMS site beyond the fact that you
    are running, say, Drupal. They will, however, know whether your Drupal site fails
    (for whatever reason). They may write an article about it based on what they know.
    As part of your plan, prepare some type of media response. Remember that “the
    media” can be as simple as a single blogger with a large audience. One bad blog
    will stay cached on a lot of servers forever. Make sure you are guiding the reporter
    or blogger. The action item here is to be sure to find out who the reporters and
    bloggers in your industry are. Document how to contact them. Prepare a media kit
    in advance on a few different topics, and have a plan to discuss the issue of
    an outage as appropriate. Remember, probably nothing these days is considered
    “off the record.” What you say or send out will likely get out. Think carefully
    before the disaster. Dedicate a person to discuss the situation with the media.
    Then make sure everyone knows to point people in that point person’s direction.
    |

    | **Your landlord or building facilities people** | If you are renting office
    space (as so many of you may be), be sure you have contacted your landlord and/or
    building maintenance people. In the event that there’s a fire and you have all
    your office or server assets in the building, what will you do? How will you gain
    access again? What if a floor floods from a leaky toilet and gets into your data
    closet? The bottom line is to be sure to talk to landlords about their plans for
    the building. Also, be sure to ask about the proper emergency contact information.
    |


    # Mapping Your IT Assets


    As a small business, you obviously won’t face the myriad of challenges a larger
    business would face in the event of a disaster. A medium business with more moving
    parts and departments that are affected will have a greater challenge.


    With both models of business, you should develop a questionnaire to discover information
    you don’t know. For example, in a medium-sized business, the IT department may
    deem that the website itself has a higher priority for service'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'restoration than the accounting services. Your Accounting department and senior
    management may disagree. Obviously, these situations are when senior management
    becomes part of the decision-making process. If a disaster happens on the same
    day that payroll is due, the priority for the time spent restoring those systems
    will be much higher than the priority to restore your website.


    Start by determining all the players impacted by an outage, including your HR
    department, Accounting department, software developers (if you have them), your
    factory, your legal folks, your customer service folks, and so on. Draft a map
    against the IT services each department or business function (Accounts Payable,
    Customer Service, Ordering, and so on) has, and prioritize restoration of services
    to those departments. In other words, if you have a total loss of IT, which person
    or group gets attention first?


    If you are a small business, then prioritizing is a simpler task, but the decision
    will have higher impact because your website business may easily be your only
    access to that your clients have. For the small business, your plan most likely
    will revolve more around restoration of your website and your merchant account
    services. The need to sell, provide services to customers, and receive money is
    your lifeblood.


    First and foremost, in all cases of all businesses, your people are not expendable
    assets. They are your number one disaster priority. Map out how you will get your
    people (even if that’s just you) out of harm’s way. Make sure you have an egress
    and escape plan.


    Include in your IT assets any external locations for backups. This could be a
    home, another office, or a bank safety deposit box. Your mapping and questionnaire
    effort must discover all the settings, passwords, database names, and so on that
    would be involved in restoring operations.


    Table 6-3 shows some items to consider as you develop a questionnaire.


    # Table 6-3: Questionnaire Items


    | ITEM | DESCRIPTION | NOTES AND EXAMPLES |

    |---|---|---|

    | Technical Items | These include settings, passwords, copies of software, licenses,
    and so forth. | DNS settings. |

    |  |  | E-mail server settings and passwords. |

    |  |  | SSL Certificate vendor, password, or other information. |

    |  |  | Database names, passwords, paths, and version information. |

    |  |  | CMS version information, including a list of plug-in, add-ons, modules,
    or extensions. |'
