- pgno: 221
  md: 'can copy it out of the database dump using your favorite text editor. Then,
    click the SQL button in the phpMyAdmin page and paste in the database dump. Click
    Go and it should quickly reinsert that table into the database.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_221_0.png)


    Figure 6-5: Fully populated database


    # ## Using the Command Line Method


    Backing up the database using the command line is an advanced method, but is included
    here to ensure complete coverage.


    > **NOTE** The steps described here are for conducting the actual backup. Be sure
    that you try them into your particular process if you decide to use this method.


    In this example, you interact with the MySQL server and use a tool built into
    Linux known as tar to compress. The next few sections outline the steps you take
    in relation to the tasks they are performing.


    # ### Backing Up the Database


    You can manually back up the database, which in technical terms is known as *dumping*
    the database. You’ll need the MySQL username and password. Log in to your server
    using PuTTY or another command-line SSH tool.


    Next, log in to MySQL using the following command:


    ```

    ```bash

    [root@Chapter6-Centos ~]# mysql -u YourUserName -pYourPassword

    ```

    ```


    After you are logged on to the server, you use a command at the pound prompt (#)
    to dump your database. You will need to know the name of the database and you
    must choose a name for the backup file.


    In this example, suppose you have a database for your CMS called productiondb
    and you want to dump it out to backupdb.sql. The -p parameter in the following
    command specifies a password. However, because it is not included in the command,
    you will be prompted for it, as shown here:'
  merge: -1
  img_proc: true
- pgno: 222
  md: '```

    ```bash

    [root@Chapter6-Centos ~]# mysqldump -u root -p productiondb > backupdb.sql

    Enter password:

    ```

    ```


    If the database is very large, you can compress it using the tar command as follows:


    ```

    ```bash

    [root@Chapter6-Centos ~]# tar cvzf Dec2010.tar.gz backupdb.sql

    backupdb.sql

    [root@Chapter6-Centos ~]# ls -l

    total 208

    -rw-r--r-- 1 root root 87287 Dec  8 01:01 backupdb.sql

    -rw-r--r-- 1 root root 22983 Dec  8 01:14 Dec2010.tar.gz

    ```

    ```


    In the first part, you can see that tar was used to create a compressed archive
    file called Dec2010.tar.gz. Also, as you can see, the size is dramatically smaller,
    with the original weighing in at 87KB and the archived version only 22KB. Depending
    on the rate of change in your data, you may need to run this command daily or
    weekly. With cron, automating this task is possible.


    > > **NOTE** See http://dbperf.wordpress.com/2010/06/11/automate-mysql-dumps-using-linux-cron-job/
    for an easy method to set up your cron job.


    # ## Restoring the Database


    When it comes time to restore a database (also known as importing), use the following
    command:


    ```

    ```bash

    mysql -u root -ppassword database < backupname.sql

    ```

    ```


    In this example, notice the caret (<) is pointing to the left. This indicates
    import. A right-pointing caret indicates export. Following is an example of the
    command in use with the username of tom:


    ```

    ```bash

    [root@Chapter6-Centos ~]# mysql -u root -ptom productiondb < backupdb.sql

    ```

    ```


    > > **WARNING** This method is very advanced. If you are at all uncomfortable,
    do not use it. You can cause the accidental erasure of data. Additionally, be
    aware of the file you''re writing into. You may need to re-create a database and
    import your .sql file if you are not sure of the contents.


    # ## Compressing the Files


    After you have dumped your database files, you want to compress the directory
    or directories that hold your CMS website. Figure 6-6 shows a basic Joomla! website.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_223_0.png)


    **Figure 6-6:** Joomla! website directory listing


    You can see from the pwd (print working directory) command that the path to this
    site is `/root/CMSWebSite/Joomla`. If you wanted to compress this entire folder,
    you would use the following command:


    ```

    tar -cvf Dec-07-2010-backup.tar.gz /root/CMSWebSite/Joomla/*

    ```


    The following response shows that the command has done its job by creating an
    archive of the files:


    ```

    Dec  8 02:32 Dec-07-2010-backup.tar.gz

    ```


    One of the most common errors is not allowing for enough space. If this happens,
    simply change the directory up to a folder that has room, and run the command
    again as follows:


    ```

    /root/ -tar cvf archivename.tar.gz /path/to/your/site/

    ```


    This causes the archive to reside in the root folder. After both the database
    dump and the normal CMS files have been compressed, you can take one of two paths:


    +   - Simply copy both the files archive and the database backup archive (or file)
    down using FTP or an SSH connection, and keep them in a safe place.

    +   - Add the database `.sql` file to the files archive, thus keeping them together.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'You are strongly encouraged to follow the second path. Be sure to make a copy
    and store it offline.


    You can copy or move (mv) the database .sql file you dumped to the same directory
    as your files'' backup. The copy command works as follows:


    ```

    ```text

    cp file /path/to/new/location/

    ```

    ```


    As a simple example, suppose you wanted to copy a robots.txt file to a TMP directory.
    You would use the following command:


    ```

    ```text

    cp robots.txt tmp

    ```

    ```


    After you copy the database backup file to the desired location, use the following
    command to add it to the archive:


    ```

    ```text

    # tar -rvf Dec-07-2010-backup.tar.gz backupdb.sql

    ```

    ```


    The -x in rvf means to append.


    Next, execute the tar command to ensure that the files are intact and that the
    database file was added:


    ```

    ```text

    # tar -tvf Dec-07-2010-backup.tar.gz | more

    ```

    ```


    The -t in tvf means to list.

    The more command at the end will display the results on a screen-by-screen basis.

    This completes the capture and compression of the database and CMS files.

    This will work for all PHP-based CMSs discussed in this book running on Linux.
    The backing up of Plone is covered later in this chapter.


    # Restoring the Files


    If you must restore, you can do a full restore by using the database import instructions
    outlined previously in the “Using cPanel” section. Use tar to restore the files
    from the archives. You may have to copy or move them back into place.


    Following are commands that will assist you during restoration. To perform a full
    uncompressing of all files, use the following:


    ```

    ```text

    # tar -xvzf archive.tar.gz

    ```

    ```


    To extract only a specific file, use the following:


    ```

    ```text

    # tar -xvf archive.tar /path/to/file

    ```

    ```


    To extract a directory, use the following:


    ```

    ```text

    # tar -xvf archive.tar /path/to/dir/

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# CMS Backup and Restoration Methods


    As you have just seen, manually backing up and restoring is no walk in the park.
    So, now take a look at backup and restore methods that are some of the best of
    the class in their respective open source projects.


    The first section covers Joomla! and the tool Akeeba Backup.


    # Joomla! Backup and Restoration


    The Akeeba backup utility for Joomla! v1.5 and Joomla! v1.6 is available from
    www.akeebabackup.com. Formally known as JoomlaPack, this utility is offered in
    two versions — a free version and a professional version. They both work identically.
    The professional version offers a wealth of additional features such as offsite
    backups to Amazon, Rackspace, and more.


    Akeeba is capable of running a full restoration using its special .jpa format
    without your having to first install Joomla!. That means that you can restore
    or move a site simply using the archived .jpa file(s) and the utility known as
    Kickstart.


    The extension installs using the normal Joomla! installer, so let’s move on to
    configuration and operation. This section starts by describing features common
    to both versions, and then highlights the differences in the professional version.


    # Requirements


    Following are server-side requirements:


    +   - Joomla! 1.5.x or later in the 1.5.x or 1.6.x range. As of this writing,
    the latest version of Joomla! 1.5 is 1.5.22, and Joomla! 1.6.

    +   - PHP 5.1.3 or greater; 5.2.1 or later highly recommended.

    +   - Akeeba Backup will not work on PHP 4. PHP 5.2.4 and 5.2.5 are not supported
    because they contain grave bugs that will not allow Akeeba Backup to function
    properly.

    +   - MySQL 5.0 or greater is recommended for optimal performance. Even though
    Akeeba Backup may run on MySQL 4.1 or later, restoring the backup generated on
    such a host may be impossible. Thus, move to MySQL 5.0 or greater.

    +   - Minimum 16MB of PHP memory. However, 32MB to 64MB is recommended for optimal
    performance on large sites.

    +   - The PHP function opendir must be available.

    +   - Available free space or quota limit at about 75 percent to 80 percent of
    your site’s size.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '+   - The cURL PHP module must be installed on your server for FTP and cloud
    backup to work.


    Following are the supported browsers:


    +   - Internet Explorer 7 or greater

    +   - Firefox 2.0 or greater

    +   - Safari 3 or greater

    +   - Opera 9 or greater (Opera 10 highly recommended)

    +   - Google Chrome 3 or greater

    +   - Konqueror 3.5.9 or greater


    # Configuration


    Akeeba has a considerable number of options. It is one of the best documented
    open source packages available. As such, this discussion focuses on a subset of
    the application. For more information, you should read through the user''s guide.


    Follow the normal Joomla! process to install Akeeba. After installing it, click
    Components ➤ AkeebaBackup to begin configuration. The first time you use Akeeba,
    click the Configuration Wizard button to begin the wizard.


    The wizard examines your particular server settings and capabilities, and then,
    as shown in Figure 6-7, reports a best guess as to the settings.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_226_0.png)


    **Figure 6-7:** Akeeba Configuration Wizard


    Although the guess may not be the best match, it will be very close. If you need
    to manually adjust the settings for your particular situation, use the Configuration
    button, as shown in Figure 6-8.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_227_0.png)


    **Figure 6-8:** Configuration Controls


    Optionally, you may set up different profiles for your backups. Use the Profiles
    Management button as shown in Figure 6-8 to set up profiles for your needs. This
    is helpful for designing various types of backups such as “Full,” “Incremental,”
    or any other configuration that matches your needs. To set up a profile, click
    the Profiles button and click New. From there you can adjust the settings.


    In the configuration of both the free version and the professional version, you
    can exclude files and directories from being backed up. The professional version
    offers a wider array of options, including the following:


    +   - Files and Directories Exclusion

    +   - Database Tables Exclusions

    +   - Extension Filters

    +   - RegEx Files and Directories Exclusion

    +   - RegEx Database Tables Exclusion


    The free version is limited to the following exclusion choices:


    +   - Files and Directories Exclusion

    +   - Database Tables Exclusion


    To select any exclusions click the icon representing the type of exclusions you
    want to invoke.


    During regular use of Akeeba, you complete your configuration by selecting what
    you want it to do after you create the .jpa files, which is known as post processing.
    The professional version offers several options to choose from. As you can see
    in Figure 6-9, many of the large cloud storage providers are represented. The
    free version only offers “Send by Email” and “No post-processing” options.'
  merge: -1
