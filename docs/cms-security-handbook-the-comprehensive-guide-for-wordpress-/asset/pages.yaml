    # Backups


    Akeeba is a very point-and-click type application, which means that it is very
    easy to use and you can easily understand what is going on. To demonstrate this
    ease of use, let’s walk through the steps to conduct a new backup.


    Log in as the Super Administrator to your site and select Components ➤ Akeeba
    Backup. Click the Backup Now button.


    Part of your backup process (no matter what process you choose) should be to document
    the backup. As shown in Figure 6-10, Akeeba offers an editor window with each
    backup. Enter the relevant information such as date, time, and so on. Other options
    include administrative information or possibly the operator. All this will help
    identify the proper file to restore.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_228_1.png)


    **Figure 6-10:** Starting a new backup'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Akeeba will keep you well-informed of the progress of the backup by displaying
    the Backup Progress window. It''s important that you do not close this browser
    or browse away until the backup is complete. Otherwise, your backup will fail.


    When the backup completes, you should see a success message. If there are any
    issues, Akeeba will present a very visible error message. Consult the Akeeba documentation
    for the solution. If you cannot find the solution, visit the Akeeba website (www.akeebabackup.com)
    for assistance options.


    After resolving any issues, copy the backup files from your server for security
    and safety reasons. To do so, click the Administer Backup Files button. A dialog
    appears that shows all the backups on your server.


    Akeeba offers an option to download your files via the browser (HTTP protocol).
    The challenge with HTTP is that it can time out or lose part of the download.
    You’ll receive the following message to warn you:


    ```

    Downloading backup files through your browser can result

    under certain circumstances to corrupt or partial downloads

    and subsequent restoration failure


    Are you sure you want to continue?

    ```


    Instead, you should log in via SSH (or FTP) and download your files. For example,
    suppose you have set up an incremental profile. This profile has some directories
    you want to exclude. So, as shown in Figure 6-11, you can select the profile and
    start a backup. By using this profile, only specific directories that you choose
    will be backed up and saved.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_229_0.png)


    Figure 6-11: Using the Incremental profile


    # Cloud Storage


    As mentioned previously, Akeeba supports most of the current cloud storage providers.
    For example, suppose you want to select the Amazon S3 Data Processing engine.
    You can find that option by clicking the Configuration button in the Akeeba control
    Panel, as shown in Figure 6-8.'
  merge: -1
  img_proc: true
