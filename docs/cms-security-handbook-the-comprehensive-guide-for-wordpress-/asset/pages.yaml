- pgno: 368
  md: '# Information Security

    Policy and Awareness


    Your information security policy is a document that describes how you will deal
    with specific information security situations. This could define what the acceptable
    use of your e-mail system is, or it might dictate whether you can read employee
    e-mail. Today, a good information security policy will cover the gamut of information,
    such as e-mail, Instant Messaging (IM), backup storage, and acceptable use of
    company resources (meaning desktops, notebooks, servers, Internet connection,
    and so on).


    An information policy is built to guide the employee, as well as to protect you
    and your company from inadvertent problems. Often, the employee excuse of “we
    didn’t know” tends to work, and sadly, it forces you to document all of your policies.
    Although people tend to gloss over employee policies, the information policy document
    will serve to push the burden of responsibility back onto the employee or user
    community.


    Your information security policy should cover the responsibility of each person.
    The information policy also should cover license information (such as if you find
    pirated software, what to do), as well as what can or cannot be plugged into your
    network, such as an outside notebook or any other unauthorized device.


    Awareness also falls into the information security category. People are often
    unaware of what is going on around them. This is a “perfect storm” situation for
    a social engineer (that is, someone who uses specific social techniques to get
    past another person’s defenses). A classic social engineering technique is'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'to call someone in the company and fool him or her into helping the caller
    by providing a password. Unfortunately, this method works very well. Training
    your staff in proper phone screening can help to avoid this issue.


    This chapter covers two aspects of the information security spectrum. The first
    half of this chapter provides an in-depth view of the information security policy
    itself. Although you won’t find here a full written plan, the discussion can help
    guide you to developing your own. The second part of the chapter helps you to
    develop a strong defense against social-engineering techniques and takes a look
    at the situational awareness paradigm.


    # Establishing an Information Security Policy


    The information security policy can be a single document stating what is and is
    not acceptable concerning what information can be divulged to whom. It may also
    be a collection of policy documents. The purpose of the information security policy
    is to protect you and your business from harm caused by the actions of employees,
    contractors, customers, and others who violate the rules. Following are the particular
    policy areas examined in this section:


    +   - Overall information security policy

    +   - Internet use

    +   - Remote access

    +   - Acceptable e-mail use

    +   - Instant messaging

    +   - Social media network use


    Although this list of examined topics is not exhaustive, it’s meant to get you
    started on the proper path. This section covers a basic framework for your information
    security policy. Take the time to discuss the information presented in this chapter
    with your staff as it relates to your business and technical needs.


    To begin, let’s start with the overall information security policy.


    # General Information Security Policy


    The primary document you will create is the information security policy. This
    document is typically delivered to employees for acknowledgment and signature.
    Its scope covers the use of the company’s information resources.


    The policy should be updated from time to time as your technology needs change.
    It’s important that the employees read the policy document and acknowledge an
    understanding of its contents by signature.'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'This type of document typically covers the following areas:


    +   - Violations

    +   - Management’s responsibilities

    +   - Employee responsibilities

    +   - IT (or your technical staff) responsibilities

    +   - Acceptable use of resources

    +   - Unacceptable use of resources

    +   - Password policy

    +   - Software installation policy

    +   - External equipment/installation policy

    +   - Social networking policy


    Sections within the overall information security policy document tend to cover
    these areas, which represent many of the normal delicate areas in IT. However,
    keep in mind that, as your IT evolves with new technologies, your policy should
    also cover new technologies, cover new issues, and address various yet-to-be-determined
    threats.


    # Violations


    Make a clear definition statement for what will happen in the event of violations.
    This should cover whether disciplinary action will occur, and may even contain
    to what degree.


    An example statement may be written as follows:


    > “Violations of this information security policy may result in disciplinary action
    in accordance with company policy. The failure to observe and maintain the guidelines
    of this policy could result in the employee’s being subjected to disciplinary
    action up to and including immediate termination. The severity of the employee
    violation will dictate the level of disciplinary action. These violations include
    (but are not limited to) actions that result in liability or harm/loss to the
    company, or repeat violations of the policy.”


    Of course, you should draft your own statement of what will happen in the event
    of violations.


    # Management Responsibilities


    The roles of management should be spelled out to describe the expectation that
    you have for them in regard to this policy. For example, supervisors and managers
    should be responsible for reviewing the contents of this document'
