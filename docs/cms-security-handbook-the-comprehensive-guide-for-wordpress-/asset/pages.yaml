- pgno: 78
  md: 'Being able to restore can make the difference in keeping your website in business
    or going out of business. If a machine is confiscated by law enforcement because
    of illegal activity by a neighboring shared hosting website, or something as simple
    as a hard drive crash occurs, it doesn’t matter — you’re off the air.


    This introduces the “$64,000 question” for your host: Who is responsible for backing
    up and restoring the server? If you are responsible (per the host), then work
    that into your disaster-recovery planning. If the host is responsible, then plan
    for the host to fail at it. In essence, at the end of the day, it’s your data,
    and, thus, your responsibility, to ensure that you have a plan to restore. That
    plan can be in conjunction with the host, but plan it nonetheless.


    If the host is managing your backups, then find out how often the backups are
    run. In the case of Rochen.com, each plan includes a twice-daily backup with the
    capability to restore to any point in time. This type of backup-and-recovery process
    is what any business should demand.


    If your host doesn’t offer any backup-type services, don’t worry. In your disaster-recovery
    plan, you can build out the necessary processes.


    The frequency of your backups should reflect the rate of change in your data.
    If your data only changes once a week, then weekly backups should suffice. If
    your data changes more frequently, then a daily backup is in order. The bottom
    line is that if your host suddenly were not there, you would need the most recent
    copies of your data. Explore emergency plans in depth.


    The abuse factor from employees and external persons should be part of the host’s
    emergency processes. If an employee goes crazy and deletes whole servers, what
    is the plan? If you are hit with a Denial of Service (DoS) attack, then what is
    the host’s plan for action?


    > **NOTE** A Denial of Service (DoS) attack is the prevention of authorized access
    to resources or the delaying of time-critical operations. (“Time-critical” may
    be milliseconds or hours, depending upon the service provided.)


    The ultimate emergency planning item is if the host must evacuate the building,
    where will the people go? Does the host have staff in another location that can
    monitor the servers remotely? If not, what is the plan to regain control of the
    network? The “where will people work” question is one that is very often overlooked.


    Learn as much as you can about the host’s emergency planning processes. You will
    need to fill in the gaps where the host leaves off in order to protect your business.


    # Location of the Host’s Data Center


    You may wonder why the location of the host’s data center matters. After all,
    the Internet is everywhere! You should care because this location can have some
    wide-ranging implications.'
