- pgno: 194
  md: 'If you see numbers appearing below this line, you have a sniffer running. You
    might look for the following services running:


    +   - TCPDUMP

    +   - WireShark

    +   - TShark


    Finding and shutting down the sniffer is vital.


    > **WARNING** Be sure you understand the implications and legal ramifications
    of using WireShark in any PCI environment.


    # ## Securing SMTP


    *Simple Mail Transfer Protocol (SMTP)* is part of your solution for sending and
    receiving mail on your server. Many servers have an open-relay that allows bad
    guys to send spam through those servers to millions of people. If you are running
    an open-relay system, you may be delivering spam mail. If so, it won''t take you
    long to get blacklisted and in trouble.


    You can check whether you are in this situation by using a variety of methods.
    Take a look at a simple method to test your server.


    If you’re using a Windows machine, click Start ➤ Run, and then type CMD. A black
    box appears in which you can issue commands at the c:> prompt. Enter the following:


    ```

    telnet domain.com 25

    ```


    If port 25 is open, you’ll see the mail server greet you with something like this:


    ```

    220 domain.com ESMTP Sendmail 8.x.x.x/8.x.x.x; Dec 4, 2010 15:00:00

    ```


    This is a good thing if you want to send *forged* (fake) mail through your server.
    Even a basic kiddie scripter could take it from here by simply asking the mail
    server for help by typing “?”.


    At this point, if you were able to get the mail server to prompt you as shown,
    you’re already in bad shape. Filter port 25 (or whatever port your mail is on).
    Keep in mind that closing a port will stop mail from flowing.


    In the event that you absolutely do not need mail service on your server (that
    is, you have it elsewhere), then can remove the service by using yum. Two popular
    packages are available, and depending on the one you’re using, here are the commands:


    ```

    #yum erase sendmail

    # rpm --erase postfix

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'If you intend to leave mail on your server, PostFix is a very good choice for
    the mail server to run. It''s well-documented and maintained. One other suggestion
    is to move mail to port 587. Although it''s not a perfect fix, it keeps down some
    automated bots from attempting to connect and send mail.


    # Zone Transfers


    The scope of zone transfers and DNS can do and fill entire volumes. The security
    point pertinent to this chapter is that you must ensure that your Domain name
    servers are not set to allow zone transfers. Information derived from zone transfers
    is very important and can give a dedicated attacker a map of your network.


    The steps to take are to contact your host or your administrator and verify you
    are running the latest version of Bind 9. Also, ensure that your site will not
    allow the zone information (transfer) out.


    > **NOTE** Chapter 2 provides more information about zone transfers as a security
    threat.


    # Physically Securing Equipment


    Guarding your server from external assault is simple if it is in a locked cage
    at a co-location facility. However, if you have your server located on your premises,
    following are a few tips for physical security of the hardware:


    +   - If economically possible, put your server in a locking cage and restrict
    access to it.

    +   - If no cage is available, then place your server in a locked room (with proper
    cooling and fire safety protection).

    +   - Use a locking bezel (front cover), if available, on your hardware.

    +   - Use password protection for the console or startup if the server''s BIOS
    (firmware) offers it.

    +   - Disable unnecessary ports. These include things like unused serial or parallel
    ports, any FireWire ports, or unused NICs. Use caution when disabling USB ports,
    however, because they are often needed for mice and keyboards.


    For the most part, if a server is in a locked room, with access control for that
    room, then you should be fine.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Summary


    This chapter has covered a lot of ground. Reading through this chapter a couple
    of times to ensure that you have a full understanding of the information presented
    is a good idea.


    You learned about why and how you harden a server against attacks, which includes
    securing your Linux operating system and Apache web server. Other tasks that are
    often overlooked, but can be sources of trouble, include the open or closed ports,
    changing default passwords, and proper setup of FTP.


    You learned about the importance of reviewing your logs, and how to establish
    a method to archive them. You also learned how to set up SSL, as well as how to
    review and test your mail servers to be sure they are not sending spam.


    In Chapter 6, you''ll work through the concept of developing a disaster recovery
    plan for when things go wrong with your website. The chapter will take you through
    the planning, writing, and testing phases. You''ll finish up with a good framework
    to use when developing your own plan.'
  merge: -1
