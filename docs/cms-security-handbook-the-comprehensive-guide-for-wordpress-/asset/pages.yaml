    Table B-2 provides a list of common security terminology.


    # Table B-2: Security Terminology


    | TERM | EXPLANATION |

    |---|---|

    | Access Control Lists (ACLs) | An ACL is a database that tracks the resources
    a user (or a machine) has access to. If a user does not appear in the ACL, then
    the user won’t be granted access to the systems in question. |

    | Agent | A program used in distributed denial of service (DDoS) attacks that
    send malicious traffic to hosts based on the instructions of a handler. You might
    also see this called a zombie or bot. |

    | Audit trail | A record showing who has accessed your server during a given period
    of time. |

    | Availability | This means that you ensure timely and reliable access to your
    information systems. You might say a site has high availability if it is never
    down. |

    | Backup | A copy of files and programs made to facilitate recovery, if necessary.
    |

    | Baseline security | The minimum of security controls required for safeguarding
    your IT resources. |

    | Baselining | The monitoring of resources to determine typical utilization patterns
    so that significant deviations can be detected. |'
