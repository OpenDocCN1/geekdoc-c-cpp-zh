- pgno: 325
  md: 'sites where the site owner “helped” by cleaning up the damage, and yet they
    were immediately attacked again – which was worse the second time. By not noting
    exactly what was changed, the author was unable to discern the original attack
    point. That particular hacked site took more than a week to clean up. Had the
    site owner documented what had been done, it would have been a much shorter time.


    Before getting into the procedures for containment in these areas of vulnerability,
    first take a look at two types of hosting: *shared hosting* and *dedicated hosting*.
    The discussion of dedicated hosting also covers using a virtual private server
    (VPS) as a dedicated machine.


    # Shared Hosting Containment


    In shared hosting, the server could be breached, or your site could simply be
    breached. Many times, in shared hosting, you’ll likely see a code injection where
    the bad guys put in some malicious code to spread to other machines simply by
    a person browsing the website. Or, they may put in a command-and-control application
    such as a C99 or R57 program (known as a *remote access trojan (RAT)* or *Root
    Kit Shell*). The purpose of these evil gems is to use your machine for any number
    of purposes, including listening in on what you do.


    If you are unfortunate enough to be on a shared server that is penetrated, then
    your immediate options are to restore from a clean backup; or to manually remove
    the evil files. Your hosting provider can be of assistance by providing you with
    a list of files that are suspect or that contain viruses.


    To be prepared for this event, you should have in advance a clean and up-to-date
    backup. Your software should be up to date (patched) and you should be changing
    your passwords every 30 days. As you move into the containment phase, the following
    steps are commonly followed to address the aforementioned areas:


    +   1. Make an offline copy of your access logs.

    +   2. Isolate and remove the affected code as soon as possible.

    +   3. Change all passwords.

    +   4. Scan files on the server for viruses.


    If your site is attacked successfully again, then you may be dealing with a situation
    that requires you to think about moving web hosts. Sometimes the easiest method
    is to simply move to a new hosting company.


    # Dedicated Hosting Containment


    Containment and cleanup in a dedicated hosting environment is more time-consuming,
    but, you typically have a lot more access to the machine, which makes the task
    of cleaning and protecting the machine easier for you.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '**NOTE** The procedures outlined in this chapter are to be used when logged
    in as the **root** or **super user** level of your operating system. Take extreme
    caution and have a full backup before you start. Even if that means your backup
    is infected, you should still have a copy.


    If you have physical access to the machine in a dedicated hosting environment,
    removing its connection to the network will stop the flow of data to and from
    the attacker. In the situation where an attacker is using the environment to spam,
    then disconnecting the machine would certainly stop it.


    **WARNING** If you are intending to bring in law enforcement, then you should
    not make any changes to the environment, and take every step you can to freeze
    the data as is. In short, if you are going to take legal action, you must have
    a security professional gather all the evidence needed before continuing to restore
    operations. This way, it can be used in a legal case. From here forward, the rest
    of this chapter will be oriented to a non-pursuit of legal action. This book is
    not meant to replace or to be legal advice for you.


    Because most readers will not have access to the physical server, the procedures
    discussed throughout this chapter will deal solely with a server at a hosting
    facility. All the same rules apply for machines you can access.


    # ## Operating System Breach Containment


    For the CMS types addressed in this book, the operating system of the server will
    most likely be some distribution of Linux, UNIX, Sun Solaris, or Microsoft Windows.
    The operating system is the most prized of targets. By controlling the operating
    system, the bad guy can control the machine.


    In fact, in sophisticated attacks, whole portions of a server’s operating system
    may be altered, thus hiding the attack from the administrator. This is done through
    the replacement of specific functions in the operating system that might help
    you detect an attack.


    The very generic terms for an attack on the operating system is *rooted* or *owned*.
    Both terms mean that a hacker has gained control of the super user-level processes.


    The process a hacker follows is to basically look for or discover weaknesses in
    your system, and exploit them. Following are several areas that an attacker could
    use to reach a server:


    +   - Improper or out-of-date firewall configuration

    +   - An unpatched or out-of-date operating system

    +   - Unpatched software components

    +   - Rogue employees

    +   - Desktops or notebook computers connected to a server'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - An infected machine on the network

    +   - Physical access to a machine by a malicious person

    +   - Network-attached printers that may be used to assault servers either locally
    or remotely

    +   - Web, database, or network services that are misconfigured or out of date


    A breached server will exhibit odd behavior, such as unusually high loads on the
    machine, excessive bandwidth, many files open, or super users logged in that should
    not be. Other signs include software that should not be installed, or unexpected
    reboots. Many more symptoms could exhibit a server breach. In essence, if the
    machine is acting strangely, when it normally behaves, then you have a problem.


    One area to do a quick review on is the date and time stamp of files. Look to
    see whether any of the files or folders have recently changed. Although not a
    guarantee of whether a true hack has occurred, the chances are good that if you
    have been hacked, this area will note it for you.


    Data on a server or site that has been compromised is very often modified by the
    attacker. Check the FTP archives, directories for users, web pages, and so on
    for change.


    When you are trying to contain an operating system breach, consider the following:


    +   - Using Linux commands on the server

    +   - Updating the server

    +   - Using RKHunter

    +   - Checking for open ports


    # Using Linux Commands


    The intention of this book is not to teach you how to be a Linux operating system
    administrator. However, a couple of Linux commands are handy to know when dealing
    with an operating system breach. These are commonly available on most Linux distributions.


    The who command can tell you who is logged on to the machine. In its simplest
    form, typing the command who will reveal all the users who are logged in.


    When dealing with an operating system breach, the first thing you want to find
    out is who is on the machine. Log in into your server-using PuTTY or another SSH
    client (discussed earlier in this chapter), and then elevate your login to super
    user. At the # prompt, enter the who command, and you should see something similar
    to Figure 9-3.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_328_0.png)


    **Figure 9-3:** Example using the who command


    If you find an unauthorized user logged in, then you can take the necessary steps
    to log him out. Figure 9-3 shows an example of three different Internet providers
    (IP) addresses logged in as root. If any of those were bad guys, you would be
    able to take immediate action by terminating their connections and blocking the
    IP addresses.


    What you see here is the *Pseudo Terminal number (or PTY number)*, who they are
    logged in as, and what username was used. Most importantly, you see the IP address
    from where the person logged in. To locate your PTY, look at your IP address that
    you are using, and then you''ll know which one to terminate.


    To terminate or *kill* a PTY, find the number of the PTY with the command `ps
    -ef | grep "ssh"`, which will show you all the PID''s logged in using SSH. You''ll
    see something like the following:


    ```

    ```text

    [root@host ~]# ps -ef | grep "ssh"

    root       26188     1  0 01:08 ?        00:00:00 /usr/sbin/sshd

    root       29740 26188  0 14:29 ?        00:00:00 sshd: root@pts/0

    ```

    ```


    The number following root is the PID. Issue the command `kill -9 pid`, where pid
    is the number.


    If your distribution of Linux does not support the who command, consult the man
    pages.


    > **WARNING** Be sure you do not log authorized users out, such as your host.


    If you find that someone has illegally logged in, you''ll want to record that
    IP address.


    You''ll also want to review the load on your machine from time to time to keep
    a basic idea of the average load. If your server is hacked and is serving up IRC
    chats to the underground community, then you''ll see an increase in loads. The
    top command provides the capability to take a dynamic look at processor activity
    in real time. This command enables you to see processes, resources, memory consumption,
    and the user who initiated the activity.


    To find out your load, type `top` at the command prompt, as shown in Figure 9-4.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_329_0.png)


    **Figure 9-4:** top command showing the processes that are running


    In this case, you can see that the total load on the CPU is 0.3 percent, the free
    memory is 409,720 KB, and the machine has 62 total tasks running. Lastly, you
    can see that one user is logged in.


    If your site is extremely busy, you’ll see much higher loads. Again, this is not
    necessarily an indicator that your site is or isn’t being hacked, but it’s a data
    point to look at. Monitor your site’s performance regularly to gain an understanding
    of your particular traffic pattern.


    # Updating Your Server


    Updating your server may very well be a task your host has taken care of for you.
    Hosts such as Rochen.com handle the operating systems upgrades for you. Other
    hosts may handle it differently. If you are tasked with updating your operating
    system, then the update process is simple in most cases.


    At the command prompt type `yum update` (for RedHat/Fedora/CentOS distributions
    of Linux). This will grab most of the patches necessary to keep your server running
    optimally and securely.


    # Using RKHunter


    The next step is to check for the presence of a *rootkit*. RKHunter is a great
    tool for checking whether the system is compromised.


    Installing RKHunter is easy; simply type the following at the # command prompt:


    ```

    yum install rkhunter

    ```


    If it’s already installed, then you’ll get a message similar to the one shown
    in Figure 9-5.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_330_0.png)


    Figure 9-5: RKHunter already installed


    With Rkhunter installed, start it by entering the following command at the command
    prompt:


    ```

    rkhunter -c

    ```


    RKHunter performs a series of diagnostic checks, looking for known rootkit files,
    directories, malware, back doors, and suspicious processes. It scans your user
    accounts and looks for accounts that have the equivalent privileges of root or
    super user.


    > **NOTE** If you’re running Windows rather than Linux, you can get equivalent
    tools to handle those tasks from http://technet.microsoft.com/en-us/sysinternals/bb842062.aspx.
    Download the Sysinternals suite.


    If directories and processes are running that are atypical, RKhunter flags those
    and immediately lets you know. If RKhunter finds anything wrong, it displays the
    various checks in red (very noticeable). If you do find something, you may need
    to enlist the aid of your hosting company to help remove it.


    If all these tests are clean, then you’ll be greeted with a message similar to
    the one shown in Figure 9-6.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_330_1.png)


    Figure 9-6: RKHunter shows "all clear"'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Checking for Open Ports


    Another basic tryout you should perform is to see what ports are open. Rkhunter
    does check for open ports such as 6666 and 6667, which, unless you are running
    your own IRC (chat) service, should be closed. However, you should look beyond
    what RKhunter checks and review all the open ports.


    Type in the following at the command prompt:


    ```

    netstat -az | more

    ```


    This command instructs the server to show you all the open ports. The more command
    enables you to look at the long list of data more easily by providing a portion
    at a time, as shown in Figure 9-7.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_331_0.png)


    This is a basic connection to your machine. The *Local Address* that has been
    blurred out here is the server''s IP address. The *Foreign Address* is the browsing
    IP address. This, of course, is simply a basic look. What you don''t want to see
    is machines connecting to port 6667 or 6666, which would show up next to the IP
    address, such as `192.168.1.18:6667`. In that case, the action you would want
    to take is to close ports 6666 and 6667 (assuming they are open).


    An easier method to discovering open ports is to use NMAP to scan your system
    (with permission from the host or owner of the machine only) and determine what
    ports are open. Figure 9-8 shows a view of a server''s ports from NMAP. In this
    example, a variety of ports are open, but, in this case, all is well. If you were
    to see a system with hundreds of ports open, then you have a bigger problem.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_331_1.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Web Applications or Website Breach Containment


    After figuring out who caused the breach, the second step of attack containment
    is to get rid of the bad and malicious code. This can be a tedious process, depending
    on the level of attack. Fortunately, in the CMS space, most attacks are related
    to web applications, which means that the attack is on the CMS itself, or the
    extensions, modules, or plug-ins. This is a time-consuming, but easy, fix. Let’s
    use the popular Joomla! CMS as an example.


    Download the latest version of Joomla!. For example, if you’re running Joomla!
    version 1.5.xx, then download the latest version of 1.5.xx. If you are running
    production 1.6.xx, then download the latest version of version 1.6.xx. This ensures
    that any altered files have been fixed by overwriting them with clean copies.


    If you have a clean backup, then to contain the attack, you simply conduct the
    restoration, because this is the safest bet. *This assumes, of course, that you
    have a recent and clean backup.*


    If you do not have a backup, you should create one, even if this means backing
    up infected files. In some ways, having a dirty backup is much better than having
    no backup at all.


    Assuming you have not changed the core Joomla! files (or Drupal, Plone, or WordPress,
    if one of those is your CMS of choice), then unzip the downloaded file and upload
    over the current files. This has the effect of potentially wiping out a lot of
    bad code quickly.


    > **WARNING** If you have made any code changes to the stock files, then overwriting
    the files will wipe out those changes.


    Next, using a desktop that is protected by a *very* good virus scanning application
    (such as Kaspersky Internet Security, available at kaspersky.com), create a folder
    on your drive, or preferably on a flash drive that can be easily cleaned.


    > **NOTE** Copying files to your local machine has the potential of infecting
    your machine. Downloading to a machine that you don’t care about — one you could
    easily reformat and re-image — is best.


    Download your entire `public_html` or other `www` folder that contains your website.
    As these files are downloading, the virus scanner will scan each one for malicious
    code. The file will either be denied the download request, or will be quarantined.
    This is not meant to clean your server, but rather to locate the files that you
    will manually clean.


    Bear in mind, that as you download the files from your server, you likely will
    pull a virus down with it. However, a good virus scanner will stop the infected
    file as it is downloading. Thus, in most cases, you won’t really pull the virus'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'onto your machine. Instead, you will get a list of the file locations, making
    it easy to find them by hand.


    After the download completes, locate the report tool in your scanner and note
    the location of the suspect files. One word of caution is that many attacks paste
    garbage code or malware into .html, .js, and .txt files. These files may be critical
    to you and, thus, deleting them is out of the question. You''ll need to manually
    remove the malicious code.


    Using your FTP client, log in and remove the virus files you can get rid of such
    as rootkit files, banking phishing scam files, and other malware. Next you may
    need to work on the virus-infected files at the command line.


    Let''s say you are using a CentOS machine. You open the file by entering the following
    command:


    ```

    nano filename

    ```


    This opens the editor, as shown in Figure 9-9.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_333_0.png)


    This partial screenshot shows some code from Joomla!, and shows a partial list
    of controls. You would need to edit out the malicious code. If possible, use WinSCP
    to edit and reload the files. Then press Ctrl+O to save and Ctrl+X to exit.


    After cleanup, performing a second scan is a good idea, just in case.


    # ## FTP or Telnet Breach Containment


    Figure 9-10 shows an example of a remote computer connected to a server via FTP.
    Here you can see that the Local Address xxx.xxx.xxx.94:21 is connected to a foreign
    (remote computer) address on port 21. Port 21 is the default for FTP. (Note that
    the actual FTP addresses have been sanitized in this example.)


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_333_1.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'You can use this quick test to see whether the intruder has compromised your
    FTP username and password. If someone is logged in using FTP and no one is supposed
    to be, then a good chance exists that the bad guy has your FTP. Should you determine
    that a connection has been obtained, terminate the connection and change the FTP
    password. Scan the system and all your desktop/notebooks for viruses.


    # E-Mail Services Breach Containment


    Most everyone is familiar with *spam* or unwanted mail that delivers promises
    of riches, love, fame, and fortune. In fact, according to the MX Logic Threat
    Center (www.mxlogic.com/threat_center), more than 80 to 85 percent of e-mail sent
    is spam.


    In Chapter 2, you learned about an attacker using open relays as a means to send
    mail through your server. Or, the attacker can actually add an account to the
    server.


    You can pay attention to a number of symptoms when it comes to your machine’s
    behavior regarding spam:


    +   - **Odd return e-mail coming to you with your name on it** — Knowing you did
    not send the e-mail is a big indicator that someone or some process has been sending
    e-mail out from your web server.

    +   - **Remove from mailing list** — You might start receiving reports from unknown
    recipients asking you to “remove them” from your mailing list. This is an important
    clue, because you probably know who you send e-mail to on a regular basis. Some
    mail applications or sending services (such as MailChimp) will handle the “unsubscribes”
    for you. Receiving a slew of requests to remove people from your mailing list
    could indicate that mail has been sent from your system to unwanted recipients
    in some cases.

    +   - **Blocking IP addresses** — Many companies exist that help lower the spam
    threat by actively monitoring and blocking IP addresses that engage in spam as
    a business. If you’re notified by spam monitoring firms that your IP address has
    been blocked because of excessive spam, check your SENT mail logs first for evidence,
    then move up the food chain and locate the spam malware.

    +   - **Bounced and non-deliverable mail** — Lots of bounced messages and non-deliverable
    reports can mean a few things. One is that if you purchased a list of names, it’s
    likely that the list is not any good for use, and will get you blacklisted as
    a email sender. Buying a list is never a good idea; you should always build your
    own. If you did not purchase a mailing list and bounced e-mail is a new symptom,
    then start looking.


    If any of these symptoms occur, you may receive notification from your host that
    you have exceeded the amount of mail you can send per day. A sure sign'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'that this is happening is when your disk is filling up with spam mail quite
    quickly in the SENT or TEMP folders.


    These are signs that your mail server has likely been compromised, and you should
    take care of the problem immediately. In most Linux-based e-mail systems, the
    folders are accessible by the administrator. You can review your folders to see
    what is in them.


    Containing an e-mail breach involves following a number of steps, and lots of
    cleanup.


    # Step One: Check for Open Relay Servers


    The first step is to ensure that you are not running an open relay e-mail server.
    Quite a few sites can help you test for open relays on your server. If you have
    an open relay, contact your host or e-mail administrator for assistance. You may
    consider looking at commercial tools available on such sites as DNSSTUFF.COM to
    assist with your e-mail tests.


    # Step Two: Scan Your Ports


    Next, scan your ports using NMAP (from insecure.org). You should ensure that all
    the ports are closed that should be closed. Each server is different, so telling
    you what ports you should open or close beyond the normal 80, 443, 21, and 25
    is impossible. Contact your host or network administrator to assist with that.
    If you find a high number of ports open, then you may have been severely hacked
    with lots of embedded malware on the server.


    # Step Three: See Who Is Logging In


    To see who is logging in, you must first get to the shell using SSH. After you
    log on as the root user, type W at the # prompt to see who is logged in. If more
    than one root user is logged in, as shown in Figure 9-11, your server might have
    been compromised.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_335_0.png)


    Figure 9-11: Unauthorized logon


    In the example shown in Figure 9-11, the server was compromised and was sending
    out thousands of pharmacy spam e-mails a day. As shown in the figure, a quick
    check revealed that two root users were on.'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'Should you find yourself in this position, you must first terminate the unauthorized
    user’s session.


    To terminate the unauthorized session, you’ll need the *Process ID (PID)* of the
    user. To obtain the PID, enter the following command:


    ```

    ps -ef | grep <theusername> or ps -ef | grep sshd

    ```


    This gives you the PIDs of the real root user and the unknown user. Write down
    both PIDs so you don’t accidentally terminate the real root user.


    You then terminate a session as follows:


    ```

    kill -9 xxxxxx

    ```


    In this example, xxxxxx equals the user’s pid.


    Finally, change your password and block the unauthorized user’s IP address.


    # Step Four: Verify That Spam Is Gone


    Next, you must verify the spam e-mails have been removed. Because each e-mail
    system differs in the way it stores and processes a queue, you should consult
    the manual for your e-mail system. In general you’ll see something like what is
    shown in Figure 9-12.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_336_0.png)


    **Figure 9-12:** Typical e-mail subdirectory tree


    After you click into the mail queue shown in Figure 9-12, you may discover hundreds
    of e-mails, as shown in Figure 9-13.


    Figure 9-14 shows an example of spam that was retrieved from that example hacked
    e-mail server’s directory. The sce: field in this particular e-mail contained
    about 250 e-mail addresses. (Of course, much of the personal information has been
    wiped out of this screenshot for security and privacy reasons.)


    For starters, if you received an e-mail such as this, surely you would realize
    the United Nations is *not* inviting you to come to a summit. And, unless you
    are a spammer, and these are in your server’s sent mail box, then finding the'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'offending code or vulnerability is time-sensitive. The longer you take, the
    more mail that goes out, and the greater the chance that you’ll be blacklisted
    as a sender in many places.


    ![File listing showing spam being sent from a compromised server, with columns
    for Name, Date modified, Type, and Size.]


    **Figure 9-13:** Spam being sent from compromised server


    ```

    ![Example email header showing spam being sent, including Received, Message-ID,
    Date, Subject, From, Reply-To, and To fields.]

    ```


    **Figure 9-14:** Example spam being sent


    When you start getting a lot of returned mail like the one shown in Figure 9-14,
    you’ve been hacked. In this example, the Reply-To field is different than the
    un.org address. The actual purpose for sending these e-mails is actually unknown.


    # Step Five: Control the Damage


    The next step is to review the SENT directory to confirm whether mail has gone
    out. If so, then the damage is done. Clean out the current and pending-to-send
    queues, and scan for viruses.


    If your situation was that the spam was going out for a very long time, then you
    might be blacklisted as a sender by several organizations. One major place to
    check is SpamHaus.org. You can enter your IP address in the blocklist removal
    page. They provide a worldwide feed to several spam filtering appliances and'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'companies. If you make it onto their list, you might start getting a lot of
    legitimate mail blocked.


    Consider signing up for *e-mail* feedback loops if you send more than a few e-mails.
    For example, if you have a healthy-sized mailing list of customers, you want to
    ensure that you get through to them. You can Google *feedback loops e-mail* and
    find a list of feedback loop forms for major ISPs. Filling these out is pretty
    simple and easy. Here’s a list of a few large ISPs to get you started:


    +   - *AOL* — `http://postmaster.info.aol.com/Postmaster.FeedbackLoop.html`

    +   - *MSN/Hotmail* — `https://support.msn.com` (select Junk Email Partner Program)

    +   - *Yahoo!* — `http://feedbackloop.yahoo.net` (requires a Yahoo! ID to create
    or sign in to an account)

    +   - *BlueTie* — `http://feedback.bluetie.com`

    +   - *Comcast* — `http://postmaster.comcast.net/feedback-loop.aspx`

    +   - *Cox* — `http://fbl.cox.net/index.php`

    +   - *Hotmail* — `http://mail.live.com/mail/postmaster.aspx`

    +   - *USA.net* — `http://fbl.usa.net/`

    +   - *Earthlink* — E-mail your request to `fblrequest@abuse.earthlink.net` (e-mail
    request)

    +   - *RoadRunner* — `http://feedback.postmaster.rr.com` (or send an e-mail to
    `email-support@security.rr.com`)


    For Earthlink and RoadRunner, include the following in your request:


    +   - Your IP address(es) and mailing domain(s) you want to set up on the feedback
    loop

    +   - Your company’s contact information you want to use for the service, including
    name, e-mail, address, and phone number

    +   - The e-mail address you want feedback transactions sent to so that you may
    get the reports from recipients marking you as spam


    Other control measures include shutting off any type of mail services from your
    server (not always possible) if you are using an outside provider. This way, your
    mail server will not be compromised by the bad guys. For clarity, other means
    for sending mail exist, and this method is not exactly foolproof.


    One final point you should be aware of is to check your e-mail folder directory
    and user list from your control panel. If you see users who have been added that
    you do not know about, you may want to suspend the user in question.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Crisis Communication to the User Community


    During a crisis, a person''s comprehension level drops by several degrees. The
    need to communicate about a disaster in simple terms is important when conveying
    important information.


    Although you probably won’t be faced with a large population of people during
    a hacking event, you might face a lot of support calls or tickets. Learning to
    speak to these people on a lower comprehension level is vital. This is not to
    be confused with a drop in intelligence points, but rather means that you must
    understand that a sufficient distraction occurs in people’s minds during a disaster.
    Preparing your disaster plan ahead of time to include a communications or messaging
    protocol can help with smooth communications to all stakeholders throughout the
    life of an outage.


    # Planning Your Communications


    One way to help facilitate the restoration could be to put up a simple “maintenance”
    message, which will prevent unnecessary interruptions. Other items used to communicate
    may be scripts to be followed at a telephone call center. If you run a call center,
    putting up an *Inbound Voice Recording (IVR)* will help your clients understand
    that there’s a problem and they should be patient. You may have a forum or blog
    that you can use to provide updates to your community.


    With that said, the following three categories of communication are very important:


    +   - Announcement of the incident

    +   - Communications during the incident

    +   - Post-incident communications


    Prepare ahead of time what you will say. This does not mean you should prepare
    a script for each of the infinite possibilities that could occur. Rather, lay
    these scripts out in large blocks, such as outage of a server or defacement of
    a page. One way to generally categorize your scripts might be equipment failure
    and hacker attack. Of course, a power outage would result in the same client perception
    as a failing server. Think about the events in this manner.


    Understand what you *will plan* to say during a crisis. Although you won’t stick
    to the script verbatim, having a framework for discussion is vital.


    Plan communications for your external and internal clients after the crisis has
    passed.


    Here are a few areas to consider for communications:


    +   - Consider how you will reach your team, especially if team members are scattered
    all over the Internet'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - Gather telephone numbers

    +   - Plan a message for your employees, your clients, and for the media

    +   - Craft a message update plan that includes the frequency of communication
    (for example, hourly versus daily) and set the expectation in the initial message

    +   - Have a single point of contact

    +   - Plan for the post-event messages


    The point is keeping your employees calm, your clients feeling safe, and should
    the media become involved, having your message crisp and ready. Remember, if you
    say something to a reporter, it can show up in the paper. Also remember that the
    people experiencing the effects of the crisis will likely not absorb your message
    as quickly as you might like.


    # Review and Prevention


    After all is said and done, simply returning to normal operations and carrying
    on as if nothing happened is an invitation for further trouble. The After Action
    Report (AAR) is a report generated to collect all the issues and problems related
    to the event. The report includes the identification of problems, a proposal for
    solutions, and recommendations for execution of the proposed fixes. This can be
    in a template form such as the example presented shortly, or any other form. The
    key is to develop a means to collect information about what you’ve learned, and
    apply that information to update your processes.


    As an example, suppose a backup was not completed for several weeks, even though
    it was set to run automatically on a nightly basis. After a successful attack
    by a hacker has been properly defended, the AAR shown in Table 9-1 might be generated.


    **Table 9-1: After Action Report**


    | ISSUE/TASK | RECOMMENDATIONS | ACTIONS TO TAKE | OWNER | DUE DATE |

    |---|---|---|---|---|

    | Backup did not run successfully for three weeks, and notifications did not go
    out. | Update admin’s backup procedures to ensure that they are checked daily
    after the nightly run. | 1. Restore cron job. | John Schmitz | 4/8/2011 |


    *Continued*'
  merge: -1
  img_proc: true
- pgno: 341
  md: '**Table 9-1 (continued)**


    | ISSUE/TASK | RECOMMENDATIONS | ACTIONS TO TAKE | OWNER | DUE DATE |

    |---|---|---|---|---|

    | Root cause was that the cron job was removed and no procedure existed to notify
    admins. |  | 2. Update all handbooks.<br>3. Develop a hand-off process for admins
    so that they know who is checking the backups.<br>4. Document when the backups
    are occurring. |  |  |

    | Found several extensions and modules out of date on site. | Review and update
    extensions and check carefully to see whether a hacker was able to shut off cron
    in advance through one of these extensions. | 1. Review whether these items are
    still needed. If so, update. If not, remove.<br>2. Test the site as a user, ensuring
    that all software works after an upgrade.<br>3. Review cron logs compared to access
    logs. | Doug Hunt | 4/11/2011 |


    This example AAR looks at the situation that prevented the hacker''s victim from
    doing a restore. In turn, the victim was forced to do a manual rebuild of the
    site, costing the company time and money.


    Your AAR should be integrated into any declared disaster that occurs. This will
    ensure that lessons learned, problems found, and new systems or software are added
    to your disaster recovery plan.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '> **NOTE** One modicum of advice regarding an event like this in real life
    is that if you have more than one person, you’re a team. A larger team of three
    or more people will present a challenge in terms of egos. The key is simply this:
    If you or your team made a mistake (not being grossly negligent), then admit,
    accept it, and fix it. Many businesses make the mistake of running down the blame
    path. This does not fix anything.


    You can use a spreadsheet, notepaper, or large white boards to capture the AAR
    items by recording what has been learned, and how to apply that knowledge. An
    AAR is a powerful tool that you should add to your business processes toolkit
    as soon as possible.


    Preventing further problems is a matter of being proactive. As an example, if
    your patching processes are lax or non-existent, then you are clearly at risk.
    Consider prevention as a proactive matter.


    Although these points are made in one form or another throughout this book, here
    are some key points regarding prevention:


    +   - *Patch your systems* — This means all of them, not just your website. If
    you have any network equipment (such as wireless routers, routers, switches, servers,
    desktops, phones, and so on), then patch them. They can all become sources of
    infection or an attacker’s entry point.

    +   - *Review your website for unused plug-ins, modules, or extensions* — You
    might be surprised that you have installed many things you aren’t using. Although
    these unused items may not be a direct security issue today, if you forget about
    them, they become vulnerable, thus exposing you to unnecessary harm, and possibly
    leading to your business’s security being compromised.

    +   - *Review your log files on a regular basis* — Chapter 8 tells you all about
    logs. These logs can tell you quite a bit about what is going on, what should
    not be going on, and who’s doing it.

    +   - *Establish an information security policy and follow it* — Consider an information
    security policy (if you have employees) to prevent accidental infections. Chapter
    11 covers this topic in detail.

    +   - *Consider purchasing a PCI (Payment Card Industry) security scan, even if
    you do not have a PCI requirement* — This can tell you a lot about your server
    and your software. It’s typically low cost, and companies such as ControlScan.com
    can offer it to you at a reasonable rate.

    +   - *Get an offsite location that has either a fireproof safe or some other
    secure, dry storage that you can reach at all times* — This location is good for
    storing documents such as software licenses and backup media. It should be a place
    you can reach 24/7.

    +   - *Stay on top of vulnerability information* — Consider purchasing a subscription
    to SANSvulnerability.com (a company co-founded by the author). This company can
    handle the “keeping you informed” part of your job.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Prevention is no different than the bi-annual battery change in smoke detectors.
    You want to ensure that they are always working in the event that you need them.


    # Reporting Attack(s) to the ISP of Origin


    If you have a good set of log files, then reporting the attack is not only easy,
    it''s a very good idea. For example, imagine that your site is being attacked
    fairly frequently by a specific IP address. So far, the attacker has been unsuccessful,
    yet these attacks are eating up a lot of your resources because of checking, verifying,
    and reviewing the logs.


    Now, assume that you see the following from the log files:


    ```

    64.xxx.xxx.xxx - - [23/Jan/2011:01:15:49 -0400]

    "GET /?option=com_someExtension&Itemid=12&

    task=.../.../.../.../.../.../.../.../.../.../proc/self/environ%00

    HTTP/1.1" 410 296 www.yourdomain.com "-" libwww-perl/5.834 "-"

    ```


    This is an attempt to break into a Joomla! site by attacking a vulnerable and
    popular extension. In this case, the site had already upgraded this third-party
    extension because of a published vulnerability. Yet, the bad guy doesn''t know
    that, and continues to shake the virtual doorknob, hoping to get in. The action
    here is to block the IP address and report it.


    You have all the information you need to report the attempted attack. The steps
    are simple:


    +   1. Locate the ISP who provides the IP address (which, for this example, is
    shown as 64.xxx.xxx.xxx).

    +   2. Package up enough of the logs to make a case that you are being attacked.

    +   3. Write a polite e-mail to report the incident(s) to the ISP.


    # Locating the ISP of the Offending IP Address


    Visit your favorite WhoIs website to help you track down this information. One
    favorite is a professional toolsite called DNSSTUFF (www.dnsstuff.com). Another
    free site is http://tools.whois.net.


    Either of these alternative scans can provide you with the desired information.
    For the purposes of this discussion, both were used to verify that they provide
    the same results. For the offending ISP in the example presented earlier, both
    tools provide a full page of information on the origin of this IP address, based
    on the ISP. You are interested in two pieces of the information: the basics about
    the company (such as contact information) and the ISP''s netrange.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'The netrange confirms that this IP address (64.xxx.xxx.xxx) is in the range
    of this particular ISP, and, thus, you are reporting it to the correct provider.


    ```

    NetRange:       64.xxx.xxx.xxx - 64.xxx.xxx.xxx

    NameServer:     NS2.DOMAIN.COM

    NameServer:     NS1.DOMAIN.COM

    RegDate:        2008-04-10

    Updated:        2008-12-04

    RAbuseHandle:   technical contact

    RAbuseName:     Tech Admin

    RAbusePhone:    +1-800-555-1212

    RAbuseEmail:    abuse@Domain.com

    ```


    # Packaging Up the Logs


    One mistake you can make is to send your entire log file out to an ISP or host,
    who doesn''t have the time to read through it. Respect the ISP''s time and pull
    the specifics out of the logs. Following is an example of what to include:


    ```

    64.xxx.xxx.xxx - - [23/Jan/2011:01:15:49 -0400]

    "GET /?option=com_someExtension&Itemid=12&

    task=../../../../../../../../../../../../proc/self/environ%00

    HTTP/1.1" 410 296 www.yourdomain.com "-" "libwww-perl/5.834" "-"

    ```


    ```

    64.xxx.xxx.xxx - - [23/Jan/2011:01:27:49 -0400]

    "GET /?option=com_someExtension&Itemid=12&

    task=../../../../../../../../../../../../proc/self/environ%00

    HTTP/1.1" 410 296 www.yourdomain.com "-" "libwww-perl/5.834" "-"

    ```


    ```

    64.xxx.xxx.xxx - - [23/Jan/2011:05:18:49 -0400]

    "GET /?option=com_someExtension&Itemid=12&

    task=../../../../../../../../../../../../proc/self/environ%00

    HTTP/1.1" 410 296 www.yourdomain.com "-" "libwww-perl/5.834" "-"

    ```


    Notice three nearly identical entries in the previous log entries. The times varied,
    as if the attacker were trying to get lost in the logs.


    Be diligent and locate all the possible attacks in the log when reporting. It
    will strengthen your case with the ISP.


    # Reporting to the ISP


    The following is a good sample e-mail to send to the ISP or host:


    ```

    To: abuse@domain.com

    Sub: Abuse report originating from your netblock.

    ```'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Dear Sir (or Madam)


    We have been receiving a series of attacks on our web site from an IP address
    originating in your netblock. The log files are as follows:


    <Log files would go here>


    Please review and mitigate accordingly as we continue to receive attacks from
    this IP.


    I can be reached at [email address] or by telephone at [xxx-xxx-xxxx] between
    the hours of 8 am and 5 pm, CST.


    Sincerely,

    Admin Name


    A polite and brief letter will get you the response you need, and will enable
    the ISP to track down an infected machine. Many times, ISPs are unaware that a
    compromised machine is in the network and is attacking people.


    Another tip is that most hosting companies offer an abuse@domain.com (where domain.com
    is replaced with the actual hosting company). You can try that first, because
    it’s the quickest. If you get a bounced-back e-mail, a quick call or chat with
    the host’s Technical Support staff can often lead you to the proper e-mail address.


    This method usually has a very high degree of success in stopping the bad guy
    attacks. Occasionally, you’ll run into an ISP or host that simply doesn’t care,
    or feels that the attacks are not its issue. In that event, you may need to just
    block the IP address at the firewall.


    # Summary


    This chapter discusses several key items that you will need when you are hacked.
    The one key point you should remember is to not panic. Panic only leads to mistakes
    and errors.


    Be prepared in advance for an attack to happen. Make frequent backups of not only
    your site, database, and other files, but also of the log files.


    You learned about a few tools such as NMAP and NESSUS to assist you in discovering
    problems with your server.


    Lastly, having a current communications plan prepared in advance is well worth
    the time spent crafting it.


    You can be prepared and you can be successful in defending against an attack if
    you follow the steps in this chapter.


    Regarding attacks, one key area to ensure you’re defensible is your wireless communications.
    In Chapter 10, you will learn about defending, strengthening, and supporting wireless
    communications in your network securely.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Wireless Networks


    Imagine a scene where you see a car parked near your office on a regular basis.
    The occupant appears to be still and not really doing much. However, you see this
    same car and person in or around the same spot daily. You note he has a can of
    potato chips sitting on his dash. “Odd,” you think, and go on about your day.


    Soon, you are suddenly hacked out of nowhere. Your security is good, and you’re
    up to date on patching and virus scanning. You even have a strong key on your
    wireless device.


    You may have been a victim of a wireless hack via that can of potato chips. By
    using his laptop, some easily obtained software, and the potato chip can stuffed
    with an antenna in it, the bad guy maliciously gathered up your wireless router
    signals and was able to crack your Wi-Fi key.


    The potato chip can (or some variation on the design) houses a powerful antenna.
    This device is known as a “cantenna,” popular with wardrivers (those who drive
    around in vehicles in search of wireless networks). The chip can itself provides
    what is known as a waveguide. It allows the attacker to have a highly directional
    device. He can literally point it at your general location and gather the signals.
    This do-it-yourself antenna increases the range of Wi-Fi by miles in some cases.
    Countless websites are devoted to designing a cantenna, and a commercially available
    product known as the Cantenna is even available.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'The antenna inside is known as a Yagi antenna. The original design of this
    antenna (less the chip cap) was theorized in 1926 by Shintaro Uda and Hidetsugu
    Yagi of Tohoku Imperial University in Sendai, Japan. Their original intent was
    to transfer wireless energy using this antenna design. The use of a Yagi antenna
    today is widespread in everything from television reception all the way to military
    aircraft, and, of course, for sniffing distant Wi-Fi signals.


    Since Wi-Fi is a radio, nothing prevents it from broadcasting your corporate secrets
    outside of your home or office. Radio waves are stronger and can be transmitted
    farther than you might think. The wireless devices simply don’t have the antenna
    design to pick up the signal from great distances. The Wireless Access Point (WAP)
    does have the capability to transmit a long distance. This ubiquitous technology
    is finding its way into many applications and venues, primarily because of the
    ease of installation and low cost of implementation. Wireless technology has found
    its way into our telephones, printers, almost all notebook computers, and many
    desktops.


    With regard to wireless applications, the Yagi antenna has proven to be effective
    in capturing Wi-Fi transmissions from distances that you may not expect, thus
    providing an eavesdropper with the capability to pick up on your Wi-Fi radio signals
    from outside your physical premises.


    Other viable threats to your infrastructure include the use of Bluetooth devices
    that are susceptible to a whole array of bad things. You can remedy these potential
    threats to your security with a little common sense action.


    As you can see, wireless signals are a popular target for hackers who are attempting
    to break into your infrastructure. This chapter discusses how you can safeguard
    wireless communications in your environment.


    In this chapter, you’ll take a brief tour of a topic that fills volumes of books
    today. In this chapter, you’ll discover such things as *how to determine the need
    for wireless*. Many times, companies (and people) will deploy wireless for convenience.
    Taking into consideration a real need for it will reduce the chances of being
    hacked by possibly leading you to a decision not to deploy. If you have deployed
    or will deploy wireless, then understanding the threats and countermeasures to
    threats will ensure that you have removed (as much as possible) the “open door
    policy” for hackers.


    Using some common tools such as SSL in your CMS will help keep your inflict transmission
    secure and safe. This chapter introduces you to a few resources you may use to
    diminish the target on your CMS.


    And, finally, this chapter offers some thoughts on Bluetooth in terms of its threats
    and countermeasures to threats.


    > **NOTE** In the context of this discussion, *Wi-Fi* generally refers to the
    networking technology that utilizes radio waves to provide wireless network and
    Internet connections.'
  merge: -1
  img_proc: true
- pgno: 348
  md: <!-- no content -->
