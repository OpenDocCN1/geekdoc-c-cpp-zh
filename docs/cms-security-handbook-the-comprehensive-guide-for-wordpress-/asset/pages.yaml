    # Installing Nmap


    Nmap is available for Linux and Windows. Installation on your Linux server can
    be run from the command line with one of the two following commands:


    ```

    ```text

    # rpm Manager : rpm -vhU http://www.nmap.org/dist/<version>

    Yum install nmap

    ```

    ```


    > > **NOTE** You should be sure to run an update if you install from any source
    except directly from nmap.org.


    For full installation instructions, review the documentation at http://nmap.org/book/inst-linux.html#inst-rpm


    Another method to install and run Nmap is from a Windows desktop. Download the
    latest version from nmap.org and install as you would any other Windows application.


    > > **WARNING** Before reviewing some of Nmap’s more useful commands, be sure
    you understand that legal restrictions may vary by the location the server is
    in. In other words, scanning a server in a particular country or state may be
    a crime. Therefore, never use Nmap to scan a server you do not expressly have
    permissions to scan. It’s simply not a good idea, and could land you in trouble.


    # Using Nmap


    The version of Nmap discussed here is running with a graphical user interface
    (GUI), but the commands are identical for other setups. The GUI for Nmap looks
    like Figure 4-7 on startup.


    Here are some of the main features of this screen:


    +   - *Target* — This is the target server. It can be a domain name or IP address.

    +   - *Profile* — These are preconfigured settings that change the way Nmap scans
    the target.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '+   - **Command** — These are the actual commands that instruct Nmap how to
    scan. They follow (by default) the Profile. You can change those to fit your needs.

    +   - **Hosts and Services** — These are buttons that will show the results of
    the post-scan findings.

    +   - **Nmap Output** — The results are shown here in detail.

    +   - **Ports / Hosts** — This is a summary of the ports found, and their status,
    as well as a listing of the Hosts.

    +   - **Topology** — This is a visual representation of the hops to the target.

    +   - **Host Details** — This gives you a wealth of information about the host
    operating system.

    +   - **Scans** — This shows the historical scans you have run.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_139_0.png)


    **Figure 4-7:** Nmap GUI


    Figure 4-8 shows an example of a scan run on a server. It is a partial screenshot
    of the Nmap output, which indicates that this target server has a number of ports
    open, and that it is running Apache and CentOS. More interesting, it has clearly
    identified (and is correct) that Plone is installed and is running. You may also
    note that Nmap found some hardware devices along the way, and again, you can confirm
    the existence of the hardware.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_139_1.png)


    **Figure 4-8:** Partial Nmap output'
  merge: -1
