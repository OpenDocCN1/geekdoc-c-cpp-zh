- pgno: 22
  md: '# Introduction


    As a business owner, you are probably faced with hundreds of decisions that must
    be made weekly. Diving headlong into a technical effort might be scary. Diving
    into a security and operations effort is something you likely don’t know how to
    do.


    That’s where this book comes in. This book helps you fill in the blanks for often-overlooked
    operational and security aspects of your business that lead to security breaches,
    downtime, excessive financial costs, and more bad things that go bump in the night.


    This book is written in a very straightforward manner, and is oriented toward
    the owners of small and medium-sized businesses. You won’t need a degree in computer
    science to follow along. Rather, this book has been written for the average person
    who utilizes technology in his or her business.


    Business owners are often misled when it comes to technical and security matters
    because of a lack of knowledge. This is a handbook of distilled knowledge. It’s
    not meant to make you a technical expert. Rather this book has been geared toward
    business owners to help alleviate that lack of knowledge.


    Within these pages, you will find a number of valuable lessons:


    +   - Choosing proper hosting for your business

    +   - Choosing the *right* CMS to use for your business

    +   - Recovering when a hacker attacks your site

    +   - Reading your log files to spot and prevent trouble

    +   - Writing a simple (but effective) plan for disasters

    +   - Learning how, why, and when to patch your websites

    +   - Hardening the web server against attack'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - Writing an effective information security policy

    +   - Discovering how to *prevent* problems before they start


    This handbook is designed to help owners of small and medium-sized businesses
    run a more efficient IT group. It focuses on the more popular Content Management
    Systems (CMSs) in use today. These CMSs are all *open source*, meaning they are
    free to download, modify, and use. The dark side to open source applications is
    that clients often choose them for their low cost of implementation, but often
    fail to realize that “free” means freedom to change, modify, and use the code.
    “Free” does not mean free from vulnerabilities, hackers, or financial costs of
    support.


    For the tactical aspects of your server and your CMS, you’ll find this book to
    be packed with wisdom often reserved by specially trained technical staffers.


    This book can help to keep your web-enabled business running smoothly and safely
    — free from cyber thugs or random disasters that could take out your website.


    # Overview of the Book and Technology


    Today, cyber-crime has evolved from the typically introverted teenager stereotype
    into a billion-dollar crime business. Wherever there’s that much money, organized
    crime gets involved.


    Today’s average website is under constant assault, with many of those attacks
    resulting in great successes for the hackers. Likewise, the number of vulnerabilities
    continues to grow, but website owners practicing good patch management are not
    keeping pace.


    This book focuses on the open source CMSs that offer many free add-ons from developers.
    Often, the add-ons, the core CMSs, and even the web servers will become vulnerable
    or be misconfigured. This can lead to small or medium businesses being hacked,
    suffering the loss of customers through reputation damage and much more. This
    book addresses all the needs of the non-technical business owner to help you understand
    *why* you must shore up your CMS or web server defenses, and how to establish
    your information security policy.


    The following technologies are covered in this book:


    +   - Joomla!, Drupal, WordPress, and Plone CMSs

    +   - Linux security

    +   - Wireless security

    +   - Security tools such as Nessus, Nmap, and WireShark'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Following are operational topics covered in this book:


    +   - Choosing the right hosting company for your needs

    +   - Starting with the right CMS for your business needs

    +   - Building a baseline for your site

    +   - Establishing a password policy

    +   - Learning to read and use your web server logs

    +   - Establishing a disaster-recovery plan

    +   - Applying patches to keep your system up to date

    +   - Securing your wireless networks

    +   - Establishing an information security policy

    +   - Building information security awareness


    In essence, this book provides you with the tools to help you operate in a similar
    manner as a large enterprise IT shop.


    # ## How This Book Is Organized


    This book is written in a manner that weaves process with technical concepts.
    Each chapter builds a specific set of knowledge that bridges you into the next
    topic of discussion.


    Following is a brief synopsis of how this book is organized:


    +   - *Chapter 1, “Introduction to CMS Security and Operations”* — Planning and
    executing a good operational plan for your website and business will keep things
    moving smoothly. This chapter begins by introducing a number of the concepts that
    most business people don’t know and call ill-afford to misunderstand.

    +   - *Chapter 2, “Choosing the Right Hosting Company”* — Because of the many
    options available to you for hosting companies, choosing the right hosting company
    is important. This chapter teaches you how to identify the various types of hosting,
    the estimated costs, and the key issues with each type of hosting. Additionally,
    you’ll learn how to discuss proper security with the host to determine whether
    that host is right for your needs. You’ll also learn about accepting payments
    via your website, and the technologies involved.

    +   - *Chapter 3, “Preventing Problems Before They Start”* — Many business owners
    jump into building a website without proper consideration of'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'how their CMS or design choices will affect security. This chapter takes you
    through several decisions that must be made, starting with helping you choose
    the right CMS for your particular needs. You’ll review four key tenets related
    to choosing the right CMS. The rest of the chapter guides you through the cost
    and support decisions, as well as post-install tasks.


    +   - *Chapter 4, “Baselining Your Existing Website”* — If you have an existing
    website, determining where you stand is vital to your security. In this chapter,
    you’ll learn how to develop a baseline report that will provide not only a snapshot
    of your site’s security, but also a road map to guide you when updating and patching
    your site. If you are just now building your site, then capturing that baseline
    will help with proper documentation of the new site, as well as implementing strong
    cyber-safety measures.


    +   - *Chapter 5, “Hardening the Server Against Attack”* — This key chapter is
    a detailed look at how to protect your server against attack. There are many areas
    that can be easily strengthened on any server. These include protecting your FTP
    server, ports on the machine, operating system settings, and more. You’ll learn
    how to eliminate common problems and how to add a strong defensive layer to your
    web server.


    +   - *Chapter 6, “Establishing a Workable Disaster Recovery Plan”* — Things can
    (and will) eventually go wrong with your website or your server operation. Something
    will fail, and that’s when you need a recovery plan. In this chapter, you learn
    about building your team, instilling the proper backup software, developing your
    written disaster plan, and, of course, conducting proper testing. By the end of
    this chapter, you’ll have a framework on which to build and document your own
    plan.


    +   - *Chapter 7, “Patching Process”* — By its nature, software is forever being
    changed. New features are offered and new vulnerabilities are discovered on a
    regular basis. No matter the size of your operation, you’ll need to develop a
    patching plan. This teaches you how to implement the patching processes and how
    to craft proper documentation related to patching. You’ll additionally gain an
    understanding of why and when to patch your software.


    +   - *Chapter 8, “Log Review”* — Log files provide a historical record of activity
    on your site. The traffic, the activity, and the statuses of your site are all
    recorded dutifully in various log files. Learning how to read those log files
    will help keep you safe. This chapter familiarizes you with the Apache and FTP
    log files, and teaches you how to interpret them, as well as how to react to problems.
    This is one of the more important chapters in the book, because log files are
    often ignored, never captured, or are deleted — all without a single look at them.
    During or after an attack, the log files may be your very best source of information.
    Take the time to absorb all this chapter has to offer.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - *Chapter 9, “Hack Recovery”* — Websites are hacked every day. What’s
    worse is the loss of time, money, and reputation among your customers that you
    can suffer from such an event. In this chapter, you’ll learn a very hands-on approach
    to recovering from an attack. You’ll be introduced to the proper tools and procedures
    needed to restore your site’s operation after a devastating hack attack on your
    site.


    +   - *Chapter 10, “Wireless Networks”* — As more and more devices become enabled
    wirelessly, more and more attacks will find their way into your systems via wireless
    networks. Thus, vulnerabilities in wireless networks are being used as a means
    to attack CMS websites. This chapter provides a high-level examination of the
    concepts for managing security with wireless access in your building or office.
    You’ll learn about some tools to help track down rogue systems, and some information
    on securing wireless networks in your environment. This chapter also touches briefly
    on Bluetooth devices and security.


    +   - *Chapter 11, “Information Security Policy and Awareness”* — In this chapter,
    you learn about crafting a good information security policy for your business.
    This is a vital to protecting you and your clients, as well as your employees.
    In addition to the policy discussion, the subject of security awareness is also
    covered. Many social engineering attacks would fail if the person being manipulated
    were simply more aware.


    +   - *Appendix A, “Security Tools, Port Vulnerabilities, and Apache Tips”* —
    Available for free or for very low cost are literally hundreds of security tools.
    This appendix describes a few key tools with which everyone who runs a website
    or network should be familiar.


    +   - *Appendix B, “Acronyms and Terminology”* — The computer and technical industry
    runs on acronyms. Acronyms provide a means for techies to reference specific technologies
    or to communicate in a brief manner with each other. The average person who does
    not work every day in the technical sector might not be able to understand the
    normal “geek-speak.” This appendix provides a reference for a number of popular
    acronyms and common terminology.


    # Who Should Read This Book


    The intended audience for this book is for owners of a small to medium-sized business.
    The reader may have some technical experience, or none at all. This book is not
    intended for someone with a deep technical background.


    If you are the manager of a company, but not necessarily the technical person,
    you may benefit from reading the previous chapters and working with your technical
    staff to ensure that they review and read the entire book.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Overall, if you are a small business owner, you, too, will likely want to read
    the book in its entirety.


    # Tools You Will Need


    Following are a number of tools that you may find useful while reading this book:


    +   - *Putty* — This is an SSH client used to connect to servers.

    +   - *FileZilla* — This is an FTP client used to connect to websites and servers.

    +   - *WireShark* — This is a packet sniffer used for troubleshooting.

    +   - *Nmap* — This is a network mapping tool used for troubleshooting and for
    reconnaissance (among other things).

    +   - *Nessus* — This is a vulnerability scanner.

    +   - *Notepad ++* — This is a Windows-based text editor that has superior features
    to the default text editor.


    These tools are readily downloadable from the Internet for free. Some of them
    (such as Nessus) offer a professional support package.


    # Summary


    As you read through this book, keep in mind that, in terms of learning, technology
    is no different from your chosen profession. Non-technical people sometimes act
    as if becoming familiar with technology involves magic. It doesn’t, and in your
    line of work, you would likely be as impressive with your knowledge base.


    Don’t let technology be a frightening thing for you. Rather, realize that it is
    simply a tool like a hammer or a screwdriver. If you get lost while reading this
    book, take a few minutes to do an Internet search and read up on the topic that
    confuses you.


    After reading this book, you should have a base knowledge about CMS security,
    and be familiar with the tools that you need to make your site and your operations
    run smoothly and without interruption.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # Introduction to CMS Security and Operations


    As a business owner, you may face the struggle of spending money for things that
    your information technology (IT) personnel may request. After all, you''ve grown
    this business from an idea to where it is today. What could the request for more
    money possibly do for increasing sales? Why would you need a written policy, or
    to spend money and time writing and practicing for a disaster?


    If you are the IT person in that situation, you may not understand the pressures
    faced by senior management, or possibly you may not have spelled out your case.
    You may be faced with a limited budget, and unlimited projects from marketing.


    You may actually be wearing both hats, balancing the objectives of running the
    business, making sales, and reconciling the books. Thinking about site security
    will likely be low on your list.


    In all cases, you must clearly understand the objectives of your business. Specifically,
    if you are running one of the open source Content Management Systems (CMSs) such
    as Joomla!, Drupal, WordPress, or Plone, you may feel that the low cost of these
    systems means that you can get by without the added time and expense required
    to grant the IT person''s request.


    This book can assist you with preparing your business and your technical operations.
    For the manager, ensuring that your security is tight and safe from hackers is
    important. You do this via processes such as patching, using a backup site, and
    performing tasks such as log reviews. The technical person will gain knowledge
    built upon information presented throughout this book to enable a process framework
    that can be bolted on to most any business model.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'This chapter lays the groundwork for discussions throughout this book by helping
    you assess where your security needs may arise within your organization. You will
    learn about various types of security threats, how the bad guys try to penetrate
    your computer systems, how to prepare your workers for good security practices,
    and how to begin formalizing a disaster recovery plan. Later in this chapter,
    you will discover some of the key terms and concepts essential for understanding
    the information presented throughout this book.


    # Target Acquired


    Today’s website is not just an ordinary stop on the Internet. It is a target for
    hackers. The use of your server and site could serve as a jumping-off point to
    attack other sites. Compromised sites may be used to host *phishing* scams that
    house near-mirror copies of bank websites. They may be used to house *drive-by
    malware*, or to house Internet Relay Chat (IRC) communications channels, which
    is a form of instant messaging.


    As this chapter is being written, a current media report cites the capture of
    a portion of the *ZeuS* gang. This notorious criminal element has successfully
    gathered into its fold several hundred thousand machines. These “*zombies*” (as
    they are called) are fully under the control of the ZeuS criminals. Among other
    things, their aim is the theft of money. And they have been very successful at
    their goal.


    Another big name making recent news headlines is the worm known as *Stuxnet*.
    This highly sophisticated worm has been responsible for working its way into electrical
    generation systems in many countries. According to some reports, it has been found
    in Iran, China, and the United States. Stuxnet is a very advanced worm (or virus)
    and has proven to be very formidable.


    The challenge is that many systems on the Internet have weaknesses and vulnerabilities.
    These weaknesses often are the result of a default password or weak passwords
    guarding the door providing entry to websites.


    In addition to banks and utility companies, the small or medium business owner
    is also at great risk. As one of these owners, you probably have your hands full
    with growing and managing your business. You might have even had someone build
    your site for you. After all, why not? You may not be in the technology business,
    and keeping up with security may be over your head.


    Guarding your website and your data is not simply important. You have a moral
    imperative to do everything you can prevent the loss of your data. Loss of data
    can occur through poor operations such as not being prepared for a hard drive
    crash, or it could occur through a cyber-attack.


    This book may not prepare you for all contingencies, but it can help you develop
    a framework to deal with catastrophes ranging from the occasional outage of your
    CMS all the way through a full-blown disaster.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# ## Operational Considerations


    The operation of your site will vary greatly as determined by its usage model
    and the type of CMS you have. If you are running a small WordPress site that has
    little traffic and its crashing wouldn’t matter much, then, operationally, you
    have nothing to be concerned about. However, if you were running a large Joomla!
    or Drupal site that supports an active and profitable customer base, you are likely
    tweaking and caring for it regularly.


    The operations for your site will consist of many items, including the following:


    +   - **Disaster recovery and business continuity plan** — This represents the
    procedure and plan for how you will react to various types of problems that could
    hit your website or operations. This disaster and business continuity plan should
    contain all the elements needed for successful restoration and recovery of your
    web business and online systems.

    +   - **Backup and offsite storage of data** — Making a backup is clearly important.
    After you make a backup, the next step is to actually copy it to a local drive
    or media such as CD-ROM, DVD, or a USB drive. Other types of operations may require
    backup tapes. In all cases, making an offline copy of data from the server to
    a local machine or storage system is paramount.

    +   - **Patching** — This is the term used in the technology space to apply updates
    to software. The application of patches in a small organization is usually done
    periodically, and depends on your setup. A medium-sized business will have to
    manage the patching process more frequently because there will simply be more
    to keep up with.

    +   - **Setting up a test and development platform** — You will almost always
    need a test and development platform for your site. The “test and dev” environment
    is used to test patches, try new code, and design a new site that could be used
    as a mirror copy in an emergency.

    +   - **Log reviews** — Normally, all the traffic and activity on your site and
    server is recorded in a special file called a *log file*. Your normal administrative
    activities should include the review of the various log files. This task is not
    fun and is often ignored because of the mundane nature of it. Yet, a consistent
    and detailed review will yield any warning signs associated with oncoming attacks.
    Site issues such as bandwidth consumption, low disk space, and any other events
    that need your attention can be quickly dealt with.

    +   - **Taking action on log data** — Finding questionable entries in your log
    files is reason enough to take further action in review of your operations. This
    doesn''t mean that some kiddie-scripter in a cafe somewhere in the world attempting
    to break in warrants alarms. It does mean that a simple block'
  merge: -1
  img_proc: true
- pgno: 31
  md: "of the IP address is necessary if it becomes a nuisance. Another example is\
    \ if you see (via your logs) unauthorized access to your FTP site, indicating\
    \ you have a compromise on your hands. The actions in the logs will dictate and\
    \ warrant the proper actions needed.\n\n# Educating Your Employees and End Users\n\
    \nIf your business is a very small one-person operation, security awareness training\
    \ won’t be as difficult as it will be for a larger business. Just practice good\
    \ cyber security, and you should be fine. If yours is a “larger” small business\
    \ all the way to a medium-sized business, then you need to implement a program\
    \ to train and make your employees aware of cyber security.\n\nFor maximum impact,\
    \ ensure that your security awareness has the following elements:\n\n+   - *Information\
    \ security policy* — A good start is a well-developed IT security policy that\
    \ reflects your business needs measured against the known risks to your business.\
    \ For example, suppose your business uses an *instant messaging* (IM) program\
    \ to communicate with clients. If this IM application can accept or send files,\
    \ the risk is that something could be allowed in, or something such as confidential\
    \ documents could be allowed out. Weighing that IM application’s benefit against\
    \ the need to accept or send files would dictate your IM policy.\n+   \n+   -\
    \ *Make IT security everyone’s concern* — Ensure that your staff understands that\
    \ personal IT security is their responsibility. Ensuring that the employees understand\
    \ (and not just sign-off on) the policies and procedures should be the role of\
    \ management. Often, things such as ethical training or IT security are met with\
    \ passive disdain and eye-rolling by employees. However, IT security awareness\
    \ is something that an employer must take seriously, and ensure that the staff\
    \ does as well. Enforcing disciplinary action for non-compliance is one method\
    \ of ensuring compliance.\n+   \n+   - *Monitor* — Establish a process for monitoring\
    \ and reviewing the information security policies. No one should be exempt from\
    \ security awareness training. This means that it should become part of the company\
    \ culture, starting at the top. Management in any organization sets the tone.\
    \ Thus, managers from the top boss down should demonstrate proper IT security\
    \ behavior.\n\n# Raising Security Awareness\n\nAccording to www.dictionary.com,\
    \ being *aware* is having knowledge, being conscious, or being cognizant. It can\
    \ also mean being informed, alert, and knowledgeable. Awareness of potential security\
    \ risks is vital to the success of"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'any web-oriented business. This implies that programs should be designed to
    bring awareness to the threats and dangers of cyber-attacks to your employees
    and business partners.


    Educational efforts are more specific in nature than mere campaigns promoting
    employee awareness. Where awareness deals with potential threats, education should
    include elements that give the employees a means to support your security. The
    following sections take a look at a few proven ways to educate your employees
    about the security of your operation.


    # **Training on Information Security Policies**


    Training your staff on information security policies provides them with the actual
    nuts and bolts of what they can and cannot do. For example, if you prohibit browsing
    adult-related content sites, then state it in the policies.


    This training is your opportunity to have a frank discussion about online safety
    and how it relates to your policies. Discuss the penalties associated with violating
    the policies.


    # **Providing a Standard Protocol for Threat Reporting**


    In this day and age, terrorism can appear in many forms. Cyber-terrorism is likely
    in its infancy, but will not remain so for much longer. Because of the “nation
    states” nature of the Internet, an attack or threat may not originate from the
    place you think it has.


    Your staff should be aware of when to report events such as viruses being found
    on their desktops. They must know what the documented process is. There should
    be a documented process for lost or stolen computers that includes password changes,
    identifying the data that was stolen, and potential exposure of the company. For
    example, many larger companies have procedures for dealing with disasters related
    to weather, fire, floods, and even for reporting bomb-threats.


    Consider establishing a similar reporting process for cyber-threats.


    # **Ensuring E-mail Security**


    By far, e-mail is one of the most prominent places to introduce threats to your
    infrastructure. In fact, more than 80 percent of the e-mail that flows across
    the Internet today is spam. Much of that spam has the potential for harm.


    As of this writing, spam was circulating that informed recipients that the government
    had rejected their electronic tax payment. The spam looks very official and important.
    It directs recipients to a link that then collects all their information to complete
    the payment process. Of course, it is a scam used by hackers to steal personal
    information.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Amazingly, many people still fall for this advanced form of scam. Educate your
    employees on how to identify a link in an e-mail (for example, right-click it,
    copy the URL location, and paste it in a text editor such as Notepad). Most of
    the time, malware e-mail says one thing and directs the browser to another site
    altogether.


    # Applying Patches and Updates


    If your employees are responsible for doing any form of updates, ensure that they
    follow only instructions that you offer. Or, ensure that they are able to identify
    where the updates are coming from. Provide employees with a trusted, intranet,
    or verification program that will enable them to apply trusted patches.


    In essence, your education program should reinforce the lessons everyone learned
    as children: “Don’t talk to or get in a car with a stranger,” “Do not accept candy
    from a stranger,” and so forth.


    # Being Aware and Staying Safe


    As your program matures, be sure you institute an update program to educate and
    counter modern threats. Threats change on a frequent basis, and what exists today
    may not tomorrow. Threats tend to follow in complexity and level of power with
    the current level of technology.


    Employees should go through training on security very regularly (meaning more
    than once in their career).


    > **NOTE** For a good blueprint on setting up training, see “Building an Information
    Technology Security Awareness and Training Program” written by Mark Wilson and
    Joan Hash, and produced by the National Institute of Standards and Technology.
    You may find it at http://csrc.nist.gov/publications/nistpubs/800-50/NIST-SP800-50.pdf.


    # Looking at Your Site Through the Eyes of a Hacker


    In the book, *The Art of War* (New York: Oxford University Press, 1971), Sun Tzu
    writes about planning a military strike:


    > “The General who wins a battle makes many calculations in his temple before
    the battle is fought. The General who loses a battle makes few calculations beforehand.
    Thus do many calculations lead to victory, and a few calculations allow defeat.
    It is by attention to this one point that I can foresee who is likely to win or
    lose.”


    In essence, what he is saying is that the more a military planner knows about
    the potential situation, and has planned for it ahead of battle, the greater chance
    he’ll have in winning.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Hacking a website or gaining illegal access to a computer system requires the
    same planning effort. The stronger the target, the more planning it takes; the
    weaker it is, the less effort it takes.


    If you have a horribly unsecured website, then kiddie-scripters will gain and
    retain access of your site until you get rid of them. However, a well-secured
    site is a great deterrent to the average hacker.


    If they want in, good hackers will take great pains to learn about you and what
    weaknesses exist. Following *The Art of War*, the more a hacker knows before he
    or she attempts to break in, the better his or her chances of success. Inversely,
    the more you know about *your own security* and site, the better chances you''ll
    have of defending against the bad guys.


    Very good hackers are the kind you never knew were there. They are the digital
    equivalent of mist. They can enter, get what they need, and never leave tracks.
    Breaking into a secure site means that you must first gather intelligence on its
    operations. Knowing the defenses that are in place, the weaknesses that exist,
    where tracking systems are, and who can be compromised are all part of the planning.


    The start of intelligence gathering is often a passive activity — one not easily
    detected and that is done before any active probing of your network. The passive
    steps can divulge a lot of information needed to get in.


    Mapping out the elements of your network, your firewall, your CMS, and your applications
    are part of the pre-attack phase. Hackers finding a weakness in the previous stage
    can then penetrate your defenses, and secure their access by adding backdoors
    and wiping out their tracks.


    In the underground world of the Internet, bad guys are known as *blackhats*. Their
    tools are powerful and dangerous, and their skills are nearly without compare.


    An interestingly well-written and dangerous program is the *C99 Shell*. Written
    in PHP, this “blackhat” tool gives hackers a great deal of control over your server
    environment. After it is planted on a server, the bad guy can control files, change
    permissions, open up ports, eavesdrop, send e-mail, upload data, add an IRC application,
    or simply shut down and wipe your site. Figure 1-1 shows a partial image of the
    C99.php control program. This very powerful application can easily be used to
    conduct any number of malicious attacks on a site.


    The best means of defense is to look at your site through the eyes of your enemies.
    What you see, they will see, and you seeing it first is best.


    > > **WARNING** As you read through this discussion, remember that you must stay
    fully within the bounds of the law. Do not take any illegal actions. Moreover,
    do not use any of these techniques on computer systems or websites you do not
    have permission to touch. In other words, this is for your education, and not
    meant to arm you as a bad guy. If you do use any of the material presented here
    for illegal means, you do so at your own risk.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_35_0.png)


    Figure 1-1: Partial view of C99 Shell


    # ## Steps to Gaining Access to Your Site


    Now take a look at the basic steps a hacker might follow to gain the needed knowledge
    to attack your site.


    > > **WARNING**

    > >

    > > *As a caveat, understand that the information presented here is meant to show
    you how to defend yourself. You should not use any of what is outlined here for
    illegal access to any computer systems.*


    # ## Researching


    Attackers first want to know about your site — what server it''s on, the operating
    system, what applications are running, the specific versions, and so on. Knowledge
    about defense systems and intrusion detection will also help the bad guys evade
    getting caught. After they have all that, they can begin the work of researching
    for vulnerabilities.


    For example, if you are running a vulnerable piece of software, they will target
    it to get in.


    Attacks known as SQL injections could use a well-crafted SQL statement that could
    divulge the administrator user name and password, thus giving the attacker administrative
    access to your site.


    As an example of research, assume you have a website with a good web hosting company,
    and that you''re running some type of CMS site on a Linux server.


    If you were the attacker, you would first determine what software this site was
    running. You can do this passively or actively in a number of ways, including
    the following:


    +   - View the page source using the browser of the website. This would help you
    to learn what it''s running. Is it Joomla!, WordPress, Drupal, or Plone (or any
    number of other web systems)?'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   - Run the scanning tool Blind Elephant on the site to determine the type
    and version. (You''ll learn a bit more about Blind Elephant shortly.)

    +   - Attempt to gain access to the administrator portion of the CMS.

    +   - Write a note from a web e-mail account and praise the developer. Ask what
    the site was written in because you want to have such a nice site, too! This is
    an example of social engineering.

    +   - Use a Google search such as "Allinurl: Powered by Joomla!" and see what
    shows up.

    +   - Many CMSs will show a Favicon with their logo. This makes identification
    very simple.


    You can see that a number of methods are available to learn about the CMS running
    your site.


    Next, the attacker would want to learn about your company, what it does, and where
    your business is located to essentially build a profile about you. For this task,
    the attacker may consider the following tools:


    +   - **Google** — This tool can tell an attacker quite a bit about your company
    because a Google search may turn up press releases, news items, and other information.

    +   - **Domain Name System (DNS)** — The attacker could review DNS records to
    see who your technical contact is, telephone numbers (in some cases), physical
    address, and your net block. The attacker could also use a tool such as NSLOOKUP
    (which you will learn more about shortly) to learn about the DNS information of
    your website.

    +   - **Physical location** — If you have a physical building, an attacker might
    dig in the garbage can for tossed-out knowledge. This could include customer lists,
    internal memos, "media" (such as CDs), and more. If the attacker wants to gain
    access to your operations, he or she may pose as an insider via phone.


    Having access to all this and other tidbits of information such as employee names,
    products you make or sell, and more could allow the attacker to fool someone.


    # **Googling Away**


    Google is a great tool for everyday use to find information you need. It''s equally
    good for building a profile on a potential target. Let''s take a run at it and
    see what can be discovered.


    Suppose a hacker has decided to break into your site. First, the attacker needs
    to gather some information about the target. What could Google tell the bad guy?


    +   - **Your building address** — This is a great way to do some low-level reconnaissance
    of the employees, the perimeter, guards, and more. A dedicated'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'attacker could use this opportunity to do some *war driving*, which means the
    hacker sniffs the external building for wireless access points.


    +   - *Officers or managers of a company* — These employees are a favorite target
    of social engineers. Through these employees, the attacker can learn all about
    the upper management. In turn, hackers can use this information to fool other
    unsuspecting employees into assisting them.

    +   - *Positions you may be hiring for* — Through job postings, a would-be attacker
    can learn a lot about the infrastructure in place; languages, hardware, systems,
    and servers in use. The best course of action is to give as little information
    out as possible for employment ads beyond what will attract the right talent.
    Ensure that phone interviews are carefully handled so as not to reveal the inner
    workings of your office and IT operations.

    +   - *Potentially posting passwords on support forums* — Although this point
    may seem obvious, it’s surprising how often passwords get revealed in this manner.
    What’s more shocking is that if you know how to use Google, you can occasionally
    find lists of passwords in use. Of course, the best stopgap is not to publish
    or give out passwords and user IDs. The next-best defense is to institute a policy
    that requires changes to passwords on a regular and frequent basis. This ensures
    that if a password escapes into the wild, it will be changed soon.


    Employment ads for your company are a particularly vulnerable area. For example,
    suppose the hacker wanted to learn more about a fictitious company called *The
    Center for All Knowledge*. A search on a job board might yield something like
    the following:


    ```

    ```text

    The Center for All Knowledge, a nonprofit publisher, is seeking a Drupal

    Developer to work at its headquarters in Chicago, Ill.


    The Web Developer will help lead development and redevelopment of

    websites on the Drupal platform. Maintenance of existing websites

    on other platforms, such as Oracle, will also be required. This

    position reports to the CIO of the company.


    Required Qualifications:

    * Minimum 2 years experience developing in Drupal.

    * Strong PHP knowledge.

    * XML, CSS and Web Standards experience and knowledge

    * Demonstrated ability to produce code

    ```

    ```


    The attacker could submit a fake resume to this firm and discuss the job opportunity
    by phone with the employer. The attacker might even interview for the job personally.
    Or, the attacker may just add it to the data pile, knowing from this job posting
    that the company runs Drupal and has something with Oracle running.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'This information would enable the attacker to start down an easy path of locating
    weaknesses that may exist in Drupal sites. So far, nothing that has been done
    is illegal. It’s simply the act of gathering intelligence.


    # Using Google Hacking Tools (Dorks)


    Several years ago, security researcher Johnny Long set up an online database of
    cut-and-paste Google searches to reveal previously unknown information. According
    to his website, “Hackers for Charity” (www.hackersforcharity.org/ghdb/), these
    searches are called “googledorks,” or “dorks” for short — meaning “inept or foolish
    people as revealed by Google.”


    Many of these searches can reveal things like passwords. One such dork, people.lst,
    will sadly find many different “lists” of people. Although the intent was probably
    not to sell such lists roam the open Internet, the troubling fact of the matter
    is that they are there. The dorks on Long’s site are very out of date, but, surprisingly,
    many still yield results. Other sites and dorks have now sprung up.


    > **WARNING** Be cautious about these types of searches. You may find unpleasant
    or offensive content.


    Take the time to run various dorks to see whether your website shows up to ensure
    that you are not revealing sensitive information.


    # Footprinting


    After the hacker has gathered a wealth of details and developed a profile of your
    site, he or she will move to the footprinting phase. This is the phase where the
    attacker attempts to develop a map of your site, server, and network.


    As mentioned previously, the fictitious company, The Center for All Knowledge,
    is running a Drupal site or sites. Mapping out the company’s Drupal modules and
    versions is the first step in footprinting.


    Identifying your CMS is fairly easy, and today a few tools are available to help
    an attacker determine your site’s CMS.


    Blind Elephant (mentioned earlier) from Qualys makes this type of work very easy.
    This Python-based tool is known as a web application fingerprint. Blind Elephant
    attempts to discover the version of (known) web applications such as CMSs. Through
    comparisons of static files that exist at known locations, it can check to see
    what application you are running.


    This tool discovers the versions of the following:


    +   - Drupal

    +   - Joomla!

    +   - Liferay'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - Mediawiki

    +   - Moodle

    +   - MovableType

    +   - osCommerce

    +   - phpBB

    +   - phpMyAdmin

    +   - phpNuke

    +   - SPIP

    +   - WordPress


    In addition, it reveals more than a dozen plugins for Drupal and two dozen for
    WordPress. The obvious implication for this is easy identification of your CMS.


    Next, the hacker needs the web server version. Given Apache is by and large the
    most popular web server out there, a likely chance exists that the site is being
    run under Apache. But the attacker must verify that is the case, and identify
    the version.


    One quick method to do this is to send the web server a request for a bogus page.
    The attacker could type in a non-existent web page at a site to see what error
    results. For example, suppose that, at the browser, the attacker entered the following
    for a political website:


    ```

    http://www.domain.com/candidates.html

    ```


    The hacker would then receive back from the server the error message shown in
    Figure 1-2.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_39_0.png)


    **Figure 1-2:** Error showing web server version


    From the web server’s point of view, the request made is not a huge deal, and
    it’s certainly a valid request. The browser asked for the candidates.html page,
    and because it didn’t exist, the server could not produce the page. It gave the
    default error of Not Found and the other information.


    Notice that the hacker was not directed to a “404 page” offering other information
    — for example, another page that may contain helpful information such as links
    on the site. The web server did not even send the attacker to a page explaining
    that the information requested does not exist.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'The reason it is a troublesome message is that it shows the website’s Apache
    version. In this case, this site is running Apache/2.0.52 (Red Hat).


    Searching the Apache 2.0 branch (currently up to 2.0.63) changelog, the attacker
    can now see that 19 security patches are between this version the site is running
    and the current version. That’s 19 methods the hacker may use to attempt an attack,
    which includes the following:


    +   - Four Cross Site Scripting (XSS) vulnerabilities

    +   - Two buffer-related issues (potential buffer overflow)

    +   - Two Secure Socket Layer (SSL) vulnerabilities

    +   - Three specific memory-related errors

    +   - Various other security fixes


    As you can see, a quick search of the changelog was all that was needed to discover
    this information.


    Attackers also have at their disposal the diagnostic tools of the operating systems.
    Several exist, and the following are a few that tend to be universal:


    +   - *AngryIP* — This is a simple IP scanning tool. You can learn more at `www.angryip.org`.

    +   - *DIG (Linux)* — This tool helps you query DNS records. You can learn more
    at `www.linux.com/archive/feature/113992`.

    +   - *hPING* — hPING is a command-line-oriented TCP/IP packet assembler/analyzer.
    You can learn more at `www.hping.org`.

    +   - *NMAP* — This is a network mapping tool. You can learn more at `www.insecure.org`.

    +   - *NSLOOKUP (Windows, Linux)* — This is another DNS-related tool. You can
    learn more at `www.kloth.net/services/nslookup.php`.

    +   - *TraceRoute (or Tracert)* — This tool enables you to track the number of
    hops to a destination. Using this tool can enable mapping of a network. This tool
    is built into today’s operating systems. Windows users can reach it using the
    Start > Run > CMD option.


    Several vulnerability scanning tools are also available, such as Nessus from Tennable
    (`www.nessus.org/nessus/`).


    > **NOTE** None of these tools were written or are supported for the purposes
    of ill-gain or criminal activity. They are all used every day in very legitimate
    operations. That does not prevent a criminal from using them to learn about you.
    Knowing these tools yourself can give you a view that will help you defend your
    business.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Using NMAP for Nefarious Means


    Take a look at the use of the NMAP tool. Suppose a scan of an example website
    produced the results shown in Figure 1-3.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_41_0.png)


    **Figure 1-3:** Ports found on web server using NMAP


    This information is valuable to an attacker. Of course, the value will vary on
    what the hacker finds and what the planned attack might be. At a minimum, the
    attacker knows the following from this scan of the server:


    +   - Apache web server

    +   - MySQL (version 5.0.91)

    +   - Apache TomCat and Jserv

    +   - FTP and SSH

    +   - Various mail servers

    +   - Open port 53, which may be a problem if this DNS were to allow zone *transfers*
    (which you will learn about later in this chapter).


    As shown in Figure 1-4, NMAP has identified this server as having a 95 percent
    chance of being Linux 2.6.24, Gentoo distribution. As shown in Figure 1-5, the
    tool discovered several “probable” named devices.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_41_1.png)


    **Figure 1-4:** O/S identification using NMAP'
  merge: -1
  img_proc: true
- pgno: 42
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The route an attacker is likely to take is to scan the network using one of
    these tools, many of which are freely available. The purpose of this active scanning
    is to gather information about the system to see how it responds to the probes,
    and to gather what information the scan produces. Using tools such as AngryIP,
    NMAP, and others (all created for purposes of right and good), an attacker can
    effectively map out your network.


    Keep in mind, however, that a single scan by a tool such as NMAP could trigger
    various alarms at the server and its defense network. Bear this mind if you intend
    to test your servers.


    # Finding Subdomains


    Another way a bad guy might attempt to gain access to your site is to hunt for
    subdomains such as `http://subdomain.example.com`. The gathering of subdomain
    data can help an attacker form a better picture of your network. Often, attackers
    can gather this information using tools to search the DNS of the site. For example,
    sites such as `www.magic-net.info/dns-and-ip-tools.dnslookup` can provide a detailed
    map of your subdomains.


    If you find that your subdomains are showing up at these sites, and you do not
    want to be exposed, then you can use methods such as `.htaccess` to prevent access.
    Other means exist as well, but exploring those is beyond the scope of this book.


    # Enumeration


    The next step, *enumeration*, essentially entails putting all the gathered data
    into a map of some kind. The process of enumeration (or naming of the resources
    that have been found) is conducted just before an attack.


    Mapping through enumeration could show as much (or as little) of the network as
    the attacker can find, including items such as the firewall IP, intrusion-detection
    system (IDS), operating system, other IP addresses, and anything else the attacker
    may have found.


    # Attacking and Owning the Site


    If the attackers have found a weakness to exploit, and they are successful, then
    they will carry out their agenda. They may possibly leave a *back door* in place.
    This means that they can use the back door to get back in when they want very
    easily. This application is usually a small program that is buried on the system
    (such as the C99 Shell described earlier in this chapter). They may even replace
    critical applications on the server to evade detection.


    The purpose of the site attack may not always be to gain information. Attackers
    may use the attack to *deny service* (DOS attack), delete data, or deface the
    system.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # Wiping Out Their Tracks


    After attackers find a way into a site, the last typical activity is to wipe the
    activity logs. By doing so, they eradicate any paths that show they were there.


    > > **NOTE** Chapter 8 examines log files much deeper, but for now, it’s worth
    noting that a regular review of log files is a great way to catch the bad guys.
    Seeing an irregular gap of time missing from your logs is a bad sign.


    # # Examples of Threats


    When you think of Internet threats, viruses and possibly scams come to mind. And
    certainly those are part of it, but there are many more. Threats are becoming
    more and more sophisticated. These threats include variations on age-old scams,
    such as snake-oil salesmen or spies.


    Let’s examine a few of the more common ones.


    # # Social Engineering


    *Social engineering* techniques are used to gain unauthorized information or access
    from someone through social contact. This common ploy can be quite effective;
    after all, employees are supposed to be helpful to clients and customers. Although
    you certainly do not need to change your customer service policies to be less
    helpful, you should look to see where you could be exposed.


    Social engineering is one of the most common and effective means a hacker can
    use to gain entry to your site. It often plays out as a request for help, and
    through that request, the attacker can get the necessary information, get a virus
    into the system, or open a door. The possibilities are quite unlimited.


    # *Calling into Your Office*


    One easy-to-imagine scenario is for an attacker to call into the office of the
    CEO. The attacker would already have a lot of information about the CEO, including
    the officer’s background and other important data. When an executive assistant
    takes the call, the attacker would simply feign being transferred to the wrong
    extension, and ask the assistant to kindly transfer the call to technical support
    (or wherever the attacker may get the information needed).


    Internally, a very good possibility exists that the extension would show the call
    as being transferred from the CEO’s office. Or the attacker could say that he
    or she was sent from the CEO’s assistant — after all, who is going to call upstairs
    and ask?'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The rest is easy to imagine. The attacker requests information such as logins,
    passwords, and other secret information. This method doesn’t always work, but
    it has a great probability of working.


    Train your personnel on the latest in social engineering tactics, and ensure that
    they are empowered to request positive identification of the caller.


    # Sending in a Trusted Friend


    Sending a friend into your office posing as an unsolicited sales person can be
    a risky move if it goes wrong. It could cause a trust issue with your employees,
    or could have legal ramifications.


    However, if the ploy is orchestrated properly by a real attacker, it can give
    him or her a good deal of information about how your employees follow procedures.


    In a legitimate test, this type of penetration testing is done during “black-box”
    security testing to see whether the “tester” can gain access.


    The best way to conduct this type of operation is to engage a professional penetration
    testing company.


    # Using USB Keys


    During 2010, the news was filled with stories centering around all kinds of mischief
    and stupidity related to the misuse of USB keys. These small devices are relatively
    cheap and are capable of storing many gigabytes of information. A 4GB USB key,
    for example, could easily store a full operating system to boot a server and place
    a Trojan horse on a unit in short order.


    For example, imagine a scenario where an employee arrives for work, and finds
    a USB key that someone has apparently dropped in the parking lot. What a lucky
    day! A new USB key someone lost! Imagine further that if that same key had your
    logo on it, it would be all the more enticing. However, for this scenario, suppose
    that the “lost” key contained a powerful Trojan horse program meant to work its
    way in from behind the firewall, where it would not be far from getting into your
    systems.


    Although this scenario may sound like a fantasy event, it did happen, where someone
    scattered a lot of USB keys in a parking lot of a building. And, yes, they were
    infected.


    Another scenario might be when an employee has brought a key from home — for convenience
    and to do some work. His or her home desktop unit is not well-protected, and a
    virus is transferred over to the key. Again, a virus or Trojan sneaks past your
    defenses.


    The idea is not to discourage use of this wonderful technology. Rather, these
    scenarios should make you aware of the dangers. Here are a few suggestions to
    keep your infrastructure safe:


    +   - *Educate* — Bring your employees’ awareness up to par with the threat. Make
    sure they know the basic rules of using keys in the office environment.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'If an employee finds a key lying in a parking lot, it could be okay — or it
    might be filled with evil.


    +   - **Virus control** — Ensure that your desktop and servers (if you manage
    them) scan USB keys automatically, and not give the user operator the chance to
    decline a scan.

    +   - **Lock the USB ports** — Disabling the USB ports will lower the chances
    of infections reaching your network, or data escaping. However, this is becoming
    less and less possible because of the use of USB keyboards and mice requiring
    the port.


    # Indiscriminate Browsing or Instant Messaging


    Indiscriminate browsing and instant messaging are two vulnerabilities that can
    result in dangerous exposure of your internal systems. Although your IT policy
    should dictate what employees can or cannot do on the business network, employees
    do not always do as they are told.


    In the case of indiscriminate browsing, an employee may browse plenty of sites
    either intentionally or by accident. These websites could contain harmful malware
    or content that could put your site and network at risk.


    Instant messaging has been responsible for passing harmful code through to an
    unsuspecting employee in at least one well-known cyber-attack case that occurred
    in 2010.


    > **NOTE** For more information on this attack, see http://www.information-age.com/channels/security-and-continuity/news/1278213/worst-ever-pentagon-cyber-attack-came-from-usb-drive.shtml.


    The awareness you must bring to the table is echoed by the Department of Homeland
    Security’s latest campaign for cyber security — *Stop, Think, Click*. People are
    generally lured into a false sense of security and will click links that are designed
    to play on that. Get your employees to a level or sense of awareness about dangers
    to the network, your website, and company information.


    # External Media


    External media can include USB keys, CD-ROMS, DVDs, or even a mobile smartphone.
    All of these can represent threats to your system.


    Using something as simple as the Knoppix Linux kernel, a computer system could
    be booted on a USB key, potentially bypassing the security. Given that this kernel
    is small, fast, and easily obtained, combined with the very dense USB keys available,
    you have the perfect spy tool.


    Other media may be innocent enough, but could be virus-laden.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Your policy should be that no external media is allowed in without a solid
    defense in the form of virus scanning of it.


    # ## Vendors or External Clients/Customers as the Threat


    When a hapless salesperson comes into a company office, he or she may need to
    connect to the Internet. Keeping in mind that a vendor or salesperson would not
    necessarily knowingly transmit a virus, you don''t know what level of protection
    is installed on that “outsider” machine.


    Ensure that you provide either a special connection to the Internet that is firewalled
    away from your network, or do not allow these types of Internet connections. The
    awareness is for employees to follow your policies regarding plugging in computers
    to your network.


    # ## Reviewing Your Perimeter


    If you have a single website or a full brick-and-mortar operation, reviewing and
    securing your digital and physical perimeters will keep you safe. Knowing where
    you''re vulnerable (and to what it is vulnerable) is the first step in shoring
    up your defenses.


    You can use a few common defenses, such as strong passwords, frequent change of
    passwords, virus protection, firewalls, and other devices. Brick-and-mortar businesses
    may face an even greater challenge in the wireless space. As part of your perimeter
    review, checking and disabling rogue wireless access points reduces the chances
    of unauthorized activity on those devices.


    The following sections provide a good primer to get you started down the path
    of perimeter review.


    # ## Using Virus Protection


    What is your current virus scanner? Is it set for automatic scanning and updates?
    Have you renewed the licenses? Can it be disabled without a password? These are
    just a few of the common issues surrounding virus scanners.


    Depending on the configuration of the machine, scanning can take some time. This
    may lead to employees simply disabling it *for now* because they are *busy*. Locking
    down your virus scanners to run at specific times and removing the capability
    to easily disable it will keep your digital fence up.


    Periodically review the machines to ensure that nothing is in the quarantine.
    Should you have a rash of infections, then the possibility exists that something
    sneaked in through a USB key or other media.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Banning Passwords on Desks


    Believe it or not, a known practice in some office environments is to have passwords
    taped to monitors, under keyboards, and tucked away in desk drawers. Consider
    implementing random checks to ensure that your security is not compromised by
    a simple thing such as a sticky note with a password.


    People tend to write down passwords, because they are difficult to remember. Of
    course, having a paper copy defeats the purpose of having a difficult password.
    You should set a policy that prohibits writing down of passwords. If you’re in
    an office environment, periodically do a random look around to see whether passwords
    are taped to yellow sticky notes.


    # Enforcing a Password Complexity and Change Policy


    Passwords should be difficult, using a mix of numbers, letters, and symbols. The
    passwords should be comprised of a mix of non-repeating letters in both uppercase
    and lowercase letters. By all means, never use a word that’s in a dictionary.


    Passwords that are words appearing in a dictionary are subject to a particular
    attack known as a *dictionary attack*. The dictionary attack simply tries a password
    over and over using words from a dictionary. Many free and powerful tools are
    available on the Internet that enable an attacker to take this route.


    Passwords should be cycled in all systems at least every 30 days, and should never
    be reused in less than a year (if ever). If you are hacked, you should cycle all
    passwords immediately. If you have other systems connected to your network (such
    as a VoIP phone), then consider the passwords for the VoIP server as well.


    > > **NOTE**

    > >

    > > *At the end of the day, an attacker could enter your system or obtain passwords
    through rogue or misconfigured wireless routers. This style of attack was responsible
    for a large department store being penetrated between May and December 2006. The
    result of the attack was hundreds of thousands of consumer’s identities stolen
    and millions of dollars lost because of the attackers gaining access to sensitive
    data.*


    # Policing Open Wireless


    In an office environment, employees sometimes feel that they know better than
    IT. Sometimes employees feel that they need an “easy to access” wireless access
    point. Often, it is set up when policies and procedures are in place to route
    requests through the IT department. Small companies that grow large may implement
    policies that centralize the control of technology aspects, and those companies
    tend to run into these situations.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'A quick trip to the local electronics store to purchase one inexpensive wireless
    router and cable equips the rogue employee. Returning to the office and plugging
    it into your local area network (LAN) provides this employee with the desired
    “easy access” wireless access point. Believe it or not, this situation is not
    infrequent, and should be handled quickly and firmly.


    As part of your effort, defining your wireless policy upfront will help prevent
    this situation. Draft an IT policy that clearly outlines what an employee can
    and cannot do. Chapter 11 further discusses IT policies.


    As with the case of passwords that are written down, take the time to look for
    any wireless access points that should not be there.


    # Tools for Wireless Detection


    A low-cost laptop computer with a wireless card can be an easy wireless detection
    tool to check for rogue wireless systems. Installing a tool such as NetStumbler
    can enable you to record and identify the rogue systems and shut them down.


    If you have an iPhone or iPad, a very interesting tool is available from a company
    called dynamicallyloaded.com for those devices called WiFiFoFum. This powerful
    tool is a Wi-Fi scanner and locator tool that scans for 802.11 wireless (WiFi)
    networks and displays information about each network it detects. The scans results
    include the following:


    +   - Service Set Identifier (SSID)

    +   - Media Access Control (MAC) address

    +   - Received Signal Strength Identifier (RSSI)

    +   - The security mode of the access point

    +   - The available transmission rates


    Figure 1-6 shows how WiFiFoFum displays all the available networks, the channel
    ID, the SSID, and the RSSI of a local coffee shop and surrounding area. As you
    can see, it found 12 networks available.


    Figure 1-7 shows a WiFiFoFum radar view that provides a graphical representation
    of nearby WiFi access points. This screen shows the positions of the access points
    with the highest signal strength near the center. The identified access points
    that have lower signal strength are positioned on the periphery, providing an
    easy-to-use method to approximate the location of an access point.'
  merge: -1
  img_proc: true
