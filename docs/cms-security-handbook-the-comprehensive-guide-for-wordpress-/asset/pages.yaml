- pgno: 185
  md: '# Security Logs


    The security logs located at `/var/log/secure` contain any error messages from
    security events. These can include failed logins or abuse attempts. Reviewing
    these logs on a regular basis is important, because they will tell you about potential
    abuse.


    # Using cPanel


    cPanel is one of the most popular programs available for basic web server hosting
    control. Typically, most web hosts will keep logging off by default. In order
    to activate logging, you must log into your web hosting account by clicking the
    cPanel icon, shown in Figure 5-16. After you click the Raw Log Manager icon, you’ll
    see two checkboxes, as shown in Figure 5-17.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_185_0.png)


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_185_1.png)


    Click the two boxes if they are not selected. The first one will maintain a daily
    log for you. If it’s not selected, then it will wipe out log information from
    the previous 24 hours. This can be a tough situation if you’re tracking down an
    issue. The second checkbox will remove the previous 30 days of logs (for disk
    space conservation). If you must keep your logs intact, either uncheck the second
    checkbox, or copy the log files before they are erased.


    # Using logrotate


    As you’ll see in Chapter 8, you must rotate your log files, or in other words,
    archive them. This practice helps prevent the disk from filling up. Log information
    collects very quickly, and the files can get very large.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "Fortunately, as you just saw, with cPanel, you have a means to remove and archive\
    \ them. Although cPanel offers you an automated means, those who are not using\
    \ it will need another method.\n\nThe software responsible for this task is logrotate,\
    \ and it should be part of most Linux distributions. Figure 5-18 shows an example\
    \ of a typical logrotate file.\n\n![](img/8bd670d4939cf71dbd0c6123d1b834ff_186_0.png)\n\
    \n**Figure 5-18: logrotate script**\n\nBy default, this file should be set up\
    \ properly. However, to check it, open the file /etc/logrotate.d/syslog. After\
    \ it opens, you'll see something that resembles the following:\n\n```\n    /var/log/messages\
    \ /var/log/secure /var/log/maillog /var/log/spooler\n    /var/log/boot.log   \
    \ /var/log/cron {\n```\n\n(This will likely be a continuous line.)\n\nWhat that\
    \ file says is to rotate the messages, secure, maillog, spooler, boot, and cron\
    \ logs. By default, the logs are rotated (copied) weekly. The system will store\
    \ four archived copies of each log. Figure 5-19 shows an example of the syslog.conf\
    \ file itself.\n\n![](img/8bd670d4939cf71dbd0c6123d1b834ff_186_1.png)\n\n**Figure\
    \ 5-19: syslog.conf**"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Your action here is to check either your cPanel settings or review your log
    rotate configuration to ensure you are properly capturing logs.


    # ## Security of the Log Files


    Log files should all be owned by root and have a permission of either 644 or 600.
    Anything else is unacceptable.


    For each log file, enter the following. (Change the `logfile` in each case to
    match your log filename.)


    +   - `# touch logfile` — This ensures that the file actually exists by attempting
    to write to it.

    +   - `# chown root:root logfile` — This assigns the ownership of that file to
    root.

    +   - `# chmod 0600 logfile` — This changes the permissions to 600. (Again, it
    can be 644 to fit your needs if 600 doesn’t work.)


    # ## Using SSL


    Given that the Internet is nothing more than a group of networks tied together,
    you should have no reasonable expectation of privacy when traversing the World
    Wide Web. Rather, you should expect that somewhere along the way, prying eyes
    are looking at your data.


    *Secure Sockets Layer (SSL)* is essential in an e-commerce society. Without it,
    you could not conduct Internet financial transactions. In fact, current law requires
    SSL for online financial transactions. This provides a solid layer of protection
    for the transmission of the files. However, this does not guarantee that the files
    are safe after they are on the server.


    SSL lives in terms of the technology above the wire (your network connection)
    and below the application (think shopping cart). This gives it the capability
    to be the gatekeeper of the data that is being sent. In a perfect world, the application
    will entrust the data to the SSL *envelope*. This will be taken directly to the
    recipient, who is the only one who can unlock it.


    If you conduct any type of financial transactions (such as acceptance of credit
    cards) on your CMS, you must install SSL on your website. In fact, if you collect
    any type of information that could be gathered by eavesdropping on the network
    connection and used against someone, then you need to consider SSL.


    In this section, you’ll learn how SSL works, and see some use cases. How to purchase
    and install your certificate (from a high level) rounds out this topic discussion.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '> > **NOTE** For more information about SSL, see www.nurdletech.com/https.html,
    http://isc.sans.edu/diary.html?storyid=2163, www.hermann-uwe.de/security/articles/securing-apache-checklist,
    www.linuxplanet.com/linuxplanet/tutorials/6660/1/, and http://articles.slicehost.com/tags/security.


    # ## Understanding How SSL Works


    SSL is essentially a private conversation in an open environment. The entire SSL
    protocol (also known as TLS) uses what is known as a *shared secret* to establish
    a cryptographic tunnel between the client and the server.


    When a client requests a connection over port 443 (the SSL port), it sends the
    server some information about itself and its *public key*. Part of that information
    is the cryptographic methods it will support. The server and client each have
    a *public key*, which they exchange. After this happens, the server sends the
    client a copy of its password, encrypted with its *private key* and the customer''s
    *public key*. The client decrypts this and continues the transaction. This establishes
    a two-way trust with the server.


    That is not to say that a bad guy can''t have SSL. A hacker can indeed. What it
    means is that the certificate, if bad, should not verify if checked. And if the
    SSL certificate is not issued by a third party, the certificate will generate
    an error.


    # ## Understanding When to Use SSL


    As mentioned, you must use SSL for financial transactions. If you are a PCI-compliant
    merchant (meaning that you accept credit or debit cards for payment), then you
    are required to secure your website with an *SSL certificate* (among other requirements).


    > > **NOTE** If you only accept *PayPal* you may not need SSL. Review the *PayPal*
    requirements for up-to-date information and requirements. However, if you''re
    handling payments of any type, then running SSL is simply a good idea.


    If the user of your website (the client) has sensitive information to transmit,
    then sending it in the clear is a very bad idea. Enter SSL. Let''s use e-mail
    as an example to illustrate this point.


    When Alice wants to send Bob an e-mail, she crafts the note and sends it via her
    favorite e-mail client. Bob receives it when it reaches his e-mail server. This
    transaction occurs millions of times a day.


    What *really* happens is that Alice''s e-mail, which is text, is broken up into
    pieces and sent in *packets* to Bob. Then Bob''s e-mail server reassembles the
    packets in the proper order and sends them to his e-mail client.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'In order to get there reliably and in a timely fashion, the Internet may choose
    to send the packets over various routes.


    Now, suppose that Eve is a bad person who wants to gather information about Alice
    and Bob. She eavesdrops on their connection, and literally will be able to read
    every packet, thus enabling her to read the e-mail.


    If Alice and Bob were using SSL, however, the connection and data would be encrypted
    as it''s sent from Alice to Bob. So, although Eve may have other means of getting
    the data, this particular avenue would be removed.


    The same process applies if you are receiving information such as social security
    numbers, medical information, or even corporate trade secrets. If you connect
    to a server on the Internet without SSL, then someone, somewhere can read it.
    Thus, if you are really concerned about security, turn on SSL encryption.


    Following is a brief list of areas that would benefit from being protected from
    prying eyes. Indeed, some of these do require SSL.


    +   - E-commerce transactions

    +   - Medical records

    +   - Personal information such as social security numbers

    +   - Company trade secrets

    +   - Confidential communications

    +   - Job applications

    +   - Home mortgage applications

    +   - Credit card applications

    +   - Banking transactions


    Now that you have a good idea of the how SSL works, and why you need it, let’s
    look at how you obtain an SSL certificate.


    # Obtaining a Certificate


    Certificates come in various strengths and flavors. Each has its own benefits,
    but they all share the same purpose — that is, to secure data through encryption.


    The certificates can be obtained in a 128-bit or 256-bit strength. They can be
    a General (read, easy to get), or they can be the high-strength, extended validation
    type.


    Although both provide solid encryption, the 256-bit version is stronger because
    of its higher bit rate (the more bits, the stronger the encryption). There are
    more underlying technical tidbits that can make one certificate better than another,
    but overall, encryption is encryption.


    The extended validation certificate provides a green bar in the address bar of
    your browser’s website. In actuality, this is not doing anything for your security.
    This is a marketing effort to raise the visual awareness of the consumer.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The *padlock icon* in the lower right of your browser tells you that you are
    in a secure session. However, people weren’t looking for the padlock, plus a malicious
    site could “fake” that icon. However, if you don’t see `HTTPS:` in the address,
    then no matter what, you’re not secure.


    **NOTE** You can learn more about extended validation by visiting `http://thegreenaddressbar.com`.


    The key thing to remember about the extended validation certificate is that it
    requires a detailed background check, and it can take a number of days to receive
    it. Additionally, these certificates do cost more than the basic certificate.


    Overall, you should buy the “most” certificate you can afford. The higher-priced
    ones typically offer some type of monetary guarantee in the event of a break-in.
    You’ll have to read all the fine print to see what is right for your situation.


    Visiting any number of hosting companies such as GoDaddy, VeriSign, and others
    will enable you to purchase your SSL certificate quite easily.


    After you process all the requirements, you’ll be issued a certificate, which
    you can then install and activate on your website.


    # Creating Self-Sign Certificates


    The point of having a third-party issue a certificate is they have no vested interest
    (financial or otherwise) in your business. They stand to vouch for you digitally.
    They verify that the certificate being requested (its identity) is coming from
    the server they issued the certificate for. The rest is handled on your server.


    Installing and having a certificate on your server without paying for it to be
    issued is possible. Creating your own certificate and installing it on your server
    is known as *self-signing*. This practice is never recommended, except for testing
    situations.


    # Installing a Certificate


    For the most part, if you are in a hosting situation where you can take advantage
    of your host’s technical skills to install the certificate, then you may want
    to do that. Typically, you’ll depend on your host in 95 percent of the cases,
    and, quite frankly, it’s easier. If, however, you are managing your own hosting
    or want to go through the process, it’s fairly straightforward.


    The certificate installation comes in two parts. The first is the portion that
    lives at the issuer’s home, the person from whom you purchased the third-party
    certificate. The third party will issue you a certificate that, after you install
    it, becomes the *root certificate* to your site. Figure 5-20 shows an example
    of a root certificate.


    You can validate a site’s authenticity by right-clicking on the padlock icon.
    The information shown here is being pulled from the certificate issuer. The issuer
    is stating that the URL `https://www.salvusalerting.com` is indeed a'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'secured site, and that the information matches the issuer’s records. This helps
    eliminate phishing scans.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_191_0.png)


    **Figure 5-20:** SSL root certificate


    The second portion of the certificate is information you generate on your server,
    which is a combination of some software and some credential information. These
    two combined parts make up your SSL certificate.


    # Working with Your Hosting Company


    If you have managed support or a VPS situation, your host more than likely handles
    the certificate setup for you. Check whether the host requires that you purchase
    certificates from it, or allows you to shop around. In many cases, hosts will
    allow a third party to issue a certificate. That gives you a lot of options for
    choosing the best certificate for your budget and needs.


    # Installing an SSL Certificate Yourself


    If you are not using a host, you need to generate a SSL certificate for your server.
    Locate the method in your server setup that allows you to generate a certificate.
    Figure 5-21 shows an example using WHM.


    After it’s filled out, this particular form generates three different pieces of
    information, as shown in Figure 5-22. The resulting generated text file contains
    several sections. You’ll provide portions of that to the SSL certificate issuer.
    From this point, follow the specific directions provided by your certificate provider
    to complete the setup.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Generate a SSL Certificate & Signing Request


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_192_0.png)


    **Figure 5-21:** SSL certificate creation


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_192_1.png)


    **Figure 5-22:** Generated SSL certificate information'
