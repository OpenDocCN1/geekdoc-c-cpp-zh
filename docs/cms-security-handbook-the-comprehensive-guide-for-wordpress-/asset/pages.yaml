- pgno: 386
  md: '# Security Tools, Port Vulnerabilities, and Apache Tips


    This appendix examines a collection of tools, backdoor Trojan horse port listings,
    and tips for the Apache user.


    # Security Tools


    This section provides an overview of common security tools.


    # Nmap


    The GNU/GPL tool Network Mapper (Nmap) from `http://insecure.org` is one of the
    best security tools available today. It can operate on a single machine or on
    a very large network. It discovers what services are running and what operating
    system is being used. It also reveals a lot about a firewall or packet filters
    in place. In essence, it’s very effective in mapping your network. You should
    become familiar with this tool and learn to use it.


    > **WARNING** Never scan networks you do not own or have permission to scan. It
    can be considered a hostile act. In other words, use this tool for your administrative
    purposes only, and do not use it to hack or attack any other networks or servers.'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'After you install Nmap on Windows machines, it runs via the graphical user
    interface (GUI). To begin using Nmap, enter your host name or IP address in the
    Target box. Next, select the type of scan from the Profile drop-down.


    Using the drop-down box in the GUI, you may select from among popular combinations
    of scanning. These preconfigured options are only a handful of the many combinations.
    They represent many of the normal commands you’ll use. When you make a selection,
    a command is entered in the Command box. For example, if you select the Intense
    Scan option, the following command is entered:


    ```

    nmap -sS -sU -T4 -A -v -PE -PS22,25,80 -PA21,23,80,3389 domainname.com

    ```


    This command breaks down as follows:


    +   - `-sS/-sT/-sA/-sW/-sM` — TCP SYN/Connect()/ACK/Window/Maimon scans

    +   - `-sU` — UDP scan

    +   - `-T4 -T<0-5>` — Set timing template (higher number is faster).

    +   - `-A` — Enable OS detection, version detection, script scanning, and traceroute

    +   - `-v` — Increase verbosity level (use `-vv` or more for greater effect)

    +   - `-PE/PP/PM` — ICMP echo, timestamp, and netmask request discovery probes

    +   - `-PS/PA/PU/PY/portlist` — TCP SYN/ACK, UDP, or SCTP discovery to given ports
    (scans the ports)


    Following is a description of the other Profile options:


    +   - *Intense Scan plus UDP* — This produces the following command:


    ```

    -sS -sU -T4 -A -v -PE -PS22,25,80 -PA21,23,80,3389

    ```


    +   - *Intense Scan, all TCP ports* — This produces the following command:


    ```

    -p 1-65535 -T4 -A -v -PE -PS22,25,80 -PA21,23,80,3389

    ```


    +   - *Intense Scan, no ping* — This produces the following command:


    ```

    -T4 -A -v -PN

    ```


    +   - *Ping scan* — This produces the following command:


    ```

    -sP -PE -PA21,23,80,3389

    ```


    +   - *Quick scan* — This produces the following command:


    ```

    -T4 -F

    ```


    +   - *Quick scan plus* — This produces the following command:


    ```

    -sV -T4 -O -F --version-light

    ```


    +   - *Quick traceroute* — This produces the following command:


    ```

    -sP -PE -PS22,25,80 -PA21,23,80,3389 -PU -PO

    ```'
  merge: -1
  img_proc: true
- pgno: 388
  md: '+   - **Regular Scan** — This conducts a default Nmap scan

    +   - **Slow comprehensive scan** — This produces the following command:


    ```

    nmap -sS -sU -T4 -A -v -PE -PP -p PS21,22,23,25,80,113,31339

    -PA80,113,143,10042 -PO --script all

    ```


    > **NOTE** For more information on these options, see http://nmap.org/book/

    > docs/nmap-usage.txt.


    # Telnet


    Although Telnet should be removed from your server, it’s great as a testing tool
    and still the norm for connecting to specific types of network gear. Telnet is
    a very old protocol that allows you to connect to a machine and issue commands.
    By default, Telnet runs on port 23.


    To start using Telnet on a Windows machine, click Start » Accessories » Command
    Prompt. At the command prompt, type telnet. The TELNET> prompt appears.


    To Telnet to another machine, enter the following:


    ```

    machine name port

    ```


    Replace the machine name with the IP or hostname and the port number. Telnet can
    be used to connect and send e-mail on misconfigured servers. For example, the
    following command will attempt to connect you to the Mail Services:


    ```

    telnet machine name 25

    ```


    If you are successful in connecting, you can often send unauthorized e-mail through
    the server. This is also a means to check for open relays in your mail system.


    Following is a list of common parameters used with the Windows version of Telnet:


    +   - `c` — Close the connection.

    +   - `d` — Display operating parameters.

    +   - `o` — Connect to hostname (defaults to port 23).

    +   - `q` — Exit (quit) Telnet.

    +   - `set` — Set options (see `set ?` for more information).

    +   - `sen` — Send strings (commands) to server.

    +   - `st` — Print status information.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '+   - `-u` — Unset options.

    +   - `-? /h` — Help.


    # Netstat


    Netstat is a very valuable tool for troubleshooting and observing what is going
    on with your network. You can use this tool any time to view network connections,
    routing tables, the statistics of an interface, and more.


    Following are common options for Netstat:


    +   - `-a` — Displays all active Transmission Control Protocol (TCP) connections,
    as well as the TCP and User Datagram Protocol (UDP) ports on which the computer
    is listening.

    +   - `-e` — Displays Ethernet statistics, such as the number of bytes and packets
    sent and received. This parameter can be combined with `-s`.

    +   - `-i` — Displays network interfaces and their statistics.

    +   - `-n` — Displays active TCP connections. However, addresses and port numbers
    are expressed numerically, and no attempt is made to determine names.

    +   - `-o` — Shows which processes are using which sockets.

    +   - `-r` — Displays the contents of the IP routing table.

    +   - `-s` — Displays statistics by protocol. By default, statistics are shown
    for the TCP, UDP, Internet Control Message Protocol (ICMP), and IP protocols.
    If the IPv6 protocol for Windows XP is installed, statistics are shown for the
    TCP over IPv6, UDP over IPv6, ICMPv6, and IPv6 protocols. The `-p` parameter can
    be used to specify a set of protocols.

    +   - `-v` — Sets verbose mode.

    +   - `-V` (uppercase) — Displays the version information.

    +   - `-h` — Displays help.


    # WireShark


    WireShark is known as a *sniffer*. It listens in on the network connection and
    captures each packet. According to the website `www.wireshark.org/about.html`,
    “Wireshark is the world''s foremost network protocol analyzer. It lets you capture
    and interactively browse the traffic running on a computer network. It is the
    de facto (and often de jure) standard across many industries and educational institutions.”'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'You should become familiar with this powerful tool. It is an excellent tool
    for network and server administrators to use to troubleshoot issues.


    > **WARNING** Only use WireShark on a corporate network if you have permission.
    Never use this tool for any illegal or unethical tasks (such as capturing passwords).
    Only use it for the proper administrative needs.


    Currently, WireShark is available for the following platforms:


    +   - Windows Installer (32-bit)

    +   - Windows Installer (64-bit)

    +   - Windows U3 (32-bit)

    +   - Windows PortableApps (32-bit)

    +   - OS X 10.5 (Leopard) Intel 32-bit .dmg

    +   - OS X 10.6 (Snow Leopard) Intel 64-bit .dmg

    +   - OS X 10.5 (Leopard) PPC 32-bit .dmg


    After you download it, follow the installation instructions for your platform.
    For Windows, you must install WinPcap (included with the installer) or the captures
    will not work.


    The Windows installation is a fairly simple point-and-click process. Unless you
    have other reasons to do so, you should choose the defaults.


    On a Windows machine, you start WireShark by clicking its corresponding icon.
    Open the Capture > Interface selection from the toolbar. This will provide a list
    of installed network interface cards (NICs) on the machine. Your machine may have
    a wired NIC and a wireless NIC, and each will be listed. Choose the NIC from which
    you want to collect packets and click Start.


    As the collection process starts, you will see the collection window filling up
    with packets. These listings show the IP source, IP destination, protocol, and
    other information about the packet. Using this information can enable you to locate
    all kinds of problems on your network, such as bad NICs and illegal traffic (hackers).


    WireShark can capture many protocols that are used for various devices. For example,
    the most common packet you would be TCP/IP for your normal Internet traffic. Voice
    over IP (VoIP) would have a different protocol. Select or deselect the protocols
    for which you want to capture information.


    After you collect enough packets, you can review errors, warnings, and other information
    WireShark has found. Errors can indicate software or configuration issues. For
    example, if you''re troubleshooting a network storm, the noted errors can be used
    to track down the offending device. WireShark can also detect problems such as
    bad patch cables that could be causing network issues such as slow performance.'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'One very powerful feature is the capability to search for specific information.
    For example, you could search for all the traffic from a network that was bound
    to or from `mail.google.com`.


