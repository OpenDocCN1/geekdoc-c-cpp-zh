    |  |  | Modems |


    Also, take the time to read and understand the documentation that came with the
    hardware and software products. If it says something to the effect of “*here’s
    the current password,*” then you can be sure the password is a default. Be sure
    to check the *database, administrative interface*, and any other passwords that
    give you control over the CMS site. If they are not difficult to guess, then change
    them.


    One common factor in all the websites discussed in this book is that they run
    on the Linux operating system. The following section takes a closer look at the
    security of Linux.


    # ## Securely Configuring the Linux Operating System


    As you are aware, the primary focus of this book is to help small and medium-sized
    business owners who are running a CMS-enabled website to be more secure. Although
    entire books are written on this subject, the discussion in this section addresses
    only those areas that require the attention of those website'
  merge: -1
