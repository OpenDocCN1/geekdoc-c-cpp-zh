- pgno: 209
  md: '# Assessing Risks


    As part of your plan development, spend time looking at the risks associated with
    your specific technology. For example, if you do not run a virus prevention tool
    on your desktops (you should no matter what), a risk factor would be that you
    could easily transfer a virus to your website.


    Take into account all your critical systems, their inherent risks, and how they
    touch each other. Consider the impact to your business if your customer service
    staff is unable to assist clients. This non-tangible item can have a material
    effect on your finances.


    After you identify as many of the risks as you can, list the costs associated
    with removing each risk. For example, if you have six desktops, but none have
    virus scanning, what’s the “cost” to acquire and maintain virus scanning tools?
    If you have an e-mail server and do not protect it, what are the costs of adding
    protection to it?


    In the event that you have risks that cannot be eliminated, determine how you
    will lower the impact the risk will have. This might include using spare equipment,
    onsite backups, and more.


    Another threat is the business processes. An example mentioned previously was
    a vacationing critical staff member. Suppose that the staff member has left the
    country for that dream of visiting Australia. During that time, the staff member
    is unavailable, and your site crashes. Could you restore it? If not, that’s a
    risk, and should be mitigated with a properly documented and tested plan for site
    restoration.


    After you have identified the risks and eliminated the ones you can, your next
    step is to draft the objectives of your plan.


    # Establishing Plan Objectives


    Your objectives will become the cornerstone of your disaster recovery plan. Your
    plan will define what will be done, by whom, and the standards by which you want
    it conducted. That is, if you want it documented for auditing or legal means,
    then have the documentation drafted ahead of time. After your e-commerce site
    is hacked, don’t say in the midst of the crisis, “Did you collect the logs?”


    Define upfront what you need to have happen for a given scenario. Remember, though,
    “boiling the ocean” is a waste of time. The true secret to a good disaster recovery
    plan is to keep it simple.


    Lastly, your objectives should include a means and time (that is, a plan within
    a plan) to keep the disaster recovery guide up to date. Pick a time that’s appropriate
    for your business.


    # Determining Data Value


    One final piece of information you should gather is determining what the value
    of your data is—not overall, but specifically. Take the time to identify what'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'parts of your data sets are of a critical nature as opposed to nice to have
    (for example, frequently asked questions versus customer transactions).


    Classifying the value of your data drives your recovery objectives. In a small
    business, the value of the data will likely be in a monolithic stack, such as
    your entire website and data. In a medium business, value could take any number
    of directions.


    Having gathered all that information, it’s time to move to drafting your initial
    plan.


    # ## Drafting the Initial Plan


    As you have probably noted, the entire purpose of a disaster recovery plan is
    to shorten the time from when recovery starts to when it ends. As noted at the
    beginning of this chapter, a business that cannot recover in less than a week
    will likely be gone within a few years.


    To recap, the plan should include the following elements:


    +   - The first vital decision is “who” to not call. In other words, while the
    idea is to make the plan simple in terms of implementation, you don’t want the
    janitor or mailroom clerk to activate it. Make sure you know the entire list of
    people who can (or might have to) operate the plan. Build your notification list
    accordingly.

    +   - What are the objectives for this plan? Will it be simply to conduct a restore,
    or will it involve getting the staff to a temporary work location? Do you need
    to plan for an offsite or alternate location?

    +   - What situations will you declare to be a disaster and commence the operation?
    This can be a power outage, hardware crash, hackers attacking, and more.

    +   - Who is the person (or persons) who can declare a disaster?

    +   - What is the role of each staff member, and what are their skills? That is,
    if a specific person is in charge of database administration, that person must
    be part of the plan.

    +   - What actions will you take first? What actions will you take second, third,
    and so on? What specific actions do you take for each specific critical technology
    in your operation? This will guide you in your tactical actions.

    +   - How will staff be notified? Will you use Skype? Is it a phone call? Is it
    a text message? Define this in the plan, and define the order in phone calling
    (cell, home, work, and so on). Make a call list and indicate alternative numbers
    to be used. Define in your call plan what to do if the person cannot be reached.
    The purpose of a call list is to notify members of your company about the issue
    who are not directly involved in the recovery. They are, however, to be considered
    stakeholders, and thus will be impacted by any outage.'
  merge: -1
  img_proc: true
