    # ## Patching Security Holes


    Generally speaking, after you identify where your system is weak, then patching
    or removing the suspect code is the first step. The next step, of course, is to
    check to see that your settings have not changed from your last review. Your baseline
    report is a document you may refer to fairly often for this purpose.

    This is also a very good time for you to review your administrative users and
    remove any who may no longer need access.


    # ## Reporting Problems to the Hosting Company


    There are correct ways to report issues to your hosting company, and, of course,
    there are wrong ways. The wrong way is to give a weak explanation of the issues,
    such as “it doesn’t work.”


    You won’t get far with that method. The right way of communicating to a hosting
    company about remediating issues is to compile your data and follow the host’s
    procedures for submission.


    For example, suppose you suddenly see a set of ports open that previously were
    not. You would want to report this issue to the host as soon as possible. Your
    report should be something along this line:


    > > “Dear <host>

    > >

    > > We noted in our recent check on our server (date) that new ports (xxxx, yyyy,
    and zzzz) have been opened. Our last check (date) showed these to be closed. The
    configuration we need should have these closed.

    > >

    > > Please review our server and advise.”


    In this example, you can show the host dates with results, proving something has
    changed. This type of information helps the host track down the changes that occurred
    in your configuration fairly easily.


    The key to dealing with technical support is to be as detailed as possible. This
    helps the technical support staff help you. If you have a specific issue, provide'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'the staff with a means to duplicate it. If you receive a specific error message,\ninclude
    it.


    # Summary


    This chapter discussed the concept of a baseline report. This report helps you\nidentify
    where threats exist in your operation, and should contain a plan to\nmitigate
    them.


    The strength of the baseline report is in the use of it. In other words, if you\nuse
    it once and forget about it, then it has no value.


    You were introduced to a number of tools to help you identify security issues\non
    your site, and you learned how to identify the add-ons for your CMS.


    In Chapter 5, you will continue with the next step in the baselining process,\nwhich
    is hardening your server against attack. This process involves a more\nin-depth
    look at the systems, software, and processes used in your business.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# ## CHAPTER 5


    # # Hardening the Server

    # Against Attack


    “Hardening a server,” in generic terms, means “closing up vulnerabilities and
    holes in the server.” Weaknesses exist in all software and hardware platforms,
    and new weaknesses are discovered on a very regular basis.


    Servers are an asset both to you and to the bad guys. If the bad guys can gain
    control of your server, they can use it for their purposes. If that is an illegal
    purpose such as launching an attack against someone, then when the chips fall,
    you may be left holding the bag.


    According to the 2010 *Verizon Data Breach Investigations Report*, research conducted
    in conjunction with the United States Secret Service uncovered the following:


    > > “Verizon Business investigative experts found, as they did in the company’s
    prior data breach reports, that most breaches were considered avoidable if security
    basics had been followed. Only 4 percent of breaches assessed required difficult
    and expensive protective measures.”


    Note that only 4 percent of all the cases they reviewed needed difficult and expensive
    measures to break into the websites. That means that 96 percent of the cyber breaches
    could have been avoided by taking proper steps.


    The report further stated that “98 percent of all data breached came from servers.”
    This is a major source of banking phishing scams, identity theft, and other criminal
    activity.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '> **NOTE** You should spend some time reading the Verizon report because it’s
    very insightful. It has a lot of information to help you keep apprised of the
    state of security. You can learn more by downloading the whitepaper from verizonbusiness.com/go/2010databreachreport.


    This chapter provides a great deal of information about the process to secure
    your server, thus helping you to be in that 4 percent category, rather than the
    96 percent category. Many of the settings or features discussed in this chapter
    will not be available to you on a shared server. The host can confirm whether
    the steps described in this chapter have been taken. If you are running your own
    machine or have responsibility for a managed machine, then you’ll benefit greatly
    from reading this chapter.


    In this chapter, you’ll also learn about default passwords and how to spot them,
    how to secure your Linux operating system, how to deal with permissions on your
    server, how to secure Apache and PHP, and how to deal with Secure Sockets Layer
    (SSL).


    The first weak point to examine is the passwords on your system and software.


    # Ensuring Secure Passwords


    Passwords are the literal keys to your system. Break-ins occur for a variety reasons,
    but topping that list is weak passwords.


    Weak passwords are easy to guess or break, and malware and botnets frequently
    target passwords to gain access. They often use a brute-force method, which means
    they try password after password to find one that’s in a password dictionary or
    words in common use.


    You must perform a few important tasks to harden your server with regard to passwords.
    First, ensure that there are not any accounts with empty passwords — in other
    words, accounts without passwords. The following command can identify whether
    any exist.


    ```

    ```sh

    # awk -F: ''($2 == "") {print}'' /etc/shadow

    ```

    ```


    Figure 5-1 shows the result of running the command with an account on a server
    that does not have a password. A hash of the password should appear next to the
    user tom.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_147_0.png)


    **Figure 5-1:** Empty password found


    If you find any of these accounts, either assign a password to the user, or delete
    the user.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Shadow Password File


    A shadow password file stores the encrypted password (technically it''s encoded,
    not encrypted) for users. This file can only be read by the root user, which prevents
    the dictionary attack from being successful.


    The original implementation was built in 1987, after its author experienced a
    cyber break-in on a SCO XENIX operating system. It was ported over the years to
    various distributions of UNIX and Linux.


    This software is meant to store the passwords and not allow them to be stored
    in the passwd file. After a password is shadowed, then you''ll typically see an
    x or an * in the password field.


    Use the following command to scan your system and ensure that all the passwords
    themselves are in the shadow file and not in passwd:


    ```

    # awk -F: ''($2 != "x") {print}'' /etc/passwd

    ```


    When you run this command, it should not return any results. You should take the
    corrective action of manually removing passwords that appear in this file. The
    hashes for all user account passwords should be stored in the file /etc/shadow
    and never in /etc/passwd. The passwd file is readable by all users. If you find
    a user with a password (hash) showing in the results of this command, then removing
    and re-creating that user may be best.


    For the most part, you should not log in as root. You should log in as a normal
    user and then elevate your privileges to the root or super user. With that practice
    in mind, you want to ensure that root (the user) is the only user in the system
    with root privileges. To do this, issue the following command:


    ```

    # awk -F: ''($3 == "0") {print}'' /etc/passwd

    ```


    This command should only return one account, as follows:


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    If you note other users in this output, lower their administrative privileges.


    # Expiring Passwords


    In terms of managing security for your passwords, changing your passwords on a
    regular basis is a good practice. The frequency is solely your call, but a good
    frequency is every 30 to 60 days.


    With Linux, you can set passwords to automatically expire. Doing so forces users
    to change their passwords.


    With your information security policy, define the time limit and complexity for
    passwords. After you do, change them by following a simple process.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Using WinSCP (or other application), connect to your server and navigate to
    the `/etc` directory. Once there, locate a file called `login.defs`, as shown
    in Figure 5-2.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_149_0.png)


    **Figure 5-2:** Password aging default settings


    The settings are as follows:


    +   - `PASS_MAX_DAYS` — This sets the maximum number of days a password can live
    before changing it is required.

    +   - `PASS_MIN_DAYS (-m)` — This prevents the passwords from being changed for
    “x” days. This important measure is to prevent passwords from being changed frequently.

    +   - `PASS_MIN_LEN` — This assigns a minimum length to passwords.

    +   - `PASS_WARN_AGE (-w)` — This gives the user “x” days (as defined in this
    setting) to change his or her password. In other words, a value of 5 would give
    the user five days to change. After that, the password is expired, and the user
    will not be allowed to log back in.


    Change the settings in that file according to your particular information security
    policy. For example, if you want your passwords changed every 60 days, then change
    `PASS_MAX_DAYS 9999` to `PASS_MAX_DAYS 60`.


    If this server has been in use for a while, you’ll want to update your current
    users, using the following command:


    ```

    ```bash

    # chage -M 60 -m 7 -W 7 user

    ```

    ```


    Replace the numbers with your values, and user with the actual username.


    # Spotting Default Passwords


    Default passwords are basically a password that can be applied to a machine or
    to software in the manufacturing process. With software, this means you may buy
    some package that has a default password to a database. In hardware, this means
    that (typically) the administrative interface ships in the box with the same password
    over and over.'
  merge: -1
  img_proc: true
