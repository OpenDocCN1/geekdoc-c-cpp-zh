    | 443 | tcp | open | http | Apache httpd 2.2.3 ((CentOS)) |

    | 3306 | tcp | open | mysql | MySQL (unauthorized) |

    | 8080 | tcp | open | http | Zope 2.9.3 (Python 2.5; linux2; ZServer/1.1) |


    **Figure 4-9:** Ports found in scan


    As far as ports are concerned, all in all, this configuration is very safe. From
    Figure 4-9, you can confirm that Apache, CentOS, MySQL, and Zope (Plone) are running.
    However, this would be a shopping list for a bad guy.


    If your server were to have many open ports, as shown in Figure 4-10, then you
    would have a really big problem. Although the figure shows quite a few ports open,
    this is a very small sampling of all the ports that were actually open. Real-life
    situations such as misconfigured firewalls, hackers opening ports, or other potential
    misconfigurations could lead to a situation similar to what is shown in Figure
    4-10. Nmap would help you identify such an issue very quickly.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_140_0.png)


    **Figure 4-10:** Too many ports open


    As mentioned previously, the purpose of the baseline is to identify where you
    have trouble and enable you to take care of it. Using Nmap to identify holes in
    the network will help you plug them.


    You should use Nmap regularly just as a check on your server. However, running
    a slow-comprehensive scan from the preconfigured Profile settings will net a wealth
    of information.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Specifically, you want to see that you have no unexpected ports open, and,
    in fact, as few ports open as possible. Seeing what software is running is helpful,
    but later in this chapter, you''ll learn about using Nessus for that purpose.
    Although every configuration will vary, the following ports are what you typically
    see open on a properly configured server:


    +   - 21 — FTP (File Transfer Protocol)

    +   - 22 — SSH (the optional SecureShell client)

    +   - 25 — SMTP (usually shown as Filtered)

    +   - 53 — DOMAIN (DNS) (open or closed, depending on the host)

    +   - 80 — World Wide Web (WWW) services

    +   - 443 — SSL for your website

    +   - 3306 — MySQL (varies depending on host)


    If you determine what you have at the start, then checking them as you run future
    baselines is easier. In the future, you''ll be able to check to be sure the port
    settings are all the same.


    # ## Using the Nessus Tool


    Nessus is one of the most popular tools for vulnerability scanning. It''s a well-built
    product that is maintained with the latest vulnerability data.


    Nessus tests your website and server for several different vulnerabilities. It
    looks at the server-side software, looks for open ports, checks for backdoor applications,
    and much more. Some consider it to be one of the best tools in its class.


    > > **NOTE** Nessus offers a free (home) version and a professional version. For
    the free version, you''ll need to register and get a key. Visit http://nessus.org/download/
    for more information.


    # ### Setting Up and Running Nessus


    For the purposes of this discussion, suppose that Nessus is installed and running
    as a Windows desktop application. It has two components to it — a Server and a
    Client. The Nessus Server manager must be started before you run the Client. Additionally,
    you must update the plug-ins, which can be done automatically. These plug-ins
    are definitions of new threats and vulnerabilities that you need Nessus to check
    for.


    To start the Nessus console, click Start ➤ Nessus Client from your Windows machine.


    > > **WARNING** The Nessus Client uses your default browser to display. Your browser
    may identify the client as an untrusted website. This is not a problem. Simply
    accept the site into your browser and use it.'
  merge: -1
  img_proc: true
- pgno: 142
  md: <!-- no content -->
