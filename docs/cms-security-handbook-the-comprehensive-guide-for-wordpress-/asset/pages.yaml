    # # Considerations for Setting Up Alternative Web Hosts


    Today, the low cost of hosting providers enables you to have a “hot” standby available.
    As part of your disaster recovery plan, you may want to mirror your content over
    to an alternative site. Another use could be a development platform separate from
    your production site.


    Although many good reasons exist for having an alternative host, you should consider
    a number of things. Here are a few items to think through regarding the use of
    an alternative provider:


    +   - Does your business need to justify the added cost of pursuing an alternate
    provider? This will be not only a monthly or annual cost, but there is a hidden
    “people cost” as well.

    +   - Do you need the added or unnecessary complexity in your disaster plan?

    +   - Are you familiar with the different procedures between hosting companies?'
  merge: -1
  img_proc: true
- pgno: 245
  md: '+   - Have you thought through the DNS or IP considerations (such as the added
    time) for an alternate site?

    +   - When using mail services from your host, have you considered moving them
    over? Processes such as FTP or SSH should be clearly documented and tested to
    ensure they work.


    These are just a few of the things that you will need to think about, but there
    are many more.


    # Additional Considerations


    Before wrapping up this chapter, you must consider some loose ends that your disaster
    recovery plan should take into account. These are items that you may not think
    about, but are vital to your success.


    # E-mail System


    E-mail is the lifeblood of many companies today. In fact, it’s sometimes the only
    method you have to reach your clients. You might consider using an e-mail provider
    (such as Google Apps) to support your e-mail.


    In any case, be sure that you have a good, solid — that means tested — plan to
    migrate your e-mail and systems in the event your host goes dark.


    # Where Does Your DNS Live?


    While writing this chapter, the author received a phone call from a client whose
    hosting company literally shut its doors without warning. The customer service
    phone was gone, the primary site was gone, and the client was dead in the water.
    To make matters worse, the client did not have a backup of multiple sites, and
    the client’s e-mail was gone.


    This client had few options. On the encouraging side, however, the client’s DNS
    is at a very large hosting company. With that, she could quickly get e-mail flowing
    again at a minimum. The client was able to point her DNS to a new host, set up
    e-mail, and start the journey of rebuilding her sites.


    The moral of this story is that if her DNS had been living with the super low-cost
    hosting company, she would have been completely lost.


    Where does your DNS live? You should park your domains with a large and healthy
    registrar. This step, combined with your backups, will keep you safe from the
    nightmare of the hosting company going dark, and eliminating the phone lines issue
    that this client experienced.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'In your disaster plan, include an option for documenting your DNS, and some
    tested plans to move it if need be.


    # Planning for Lost, Damaged, or Dated Equipment


    Loss of equipment is typically an issue for any size of business. The loss of
    a system or mobile device with sensitive data on it can represent a form of a
    disaster. For example, if passwords and other authentication information are on
    the lost media, a malicious person could compromise your systems.


    Theft represents another avenue of loss that could be used to get your data.


    Loss of services to your systems can occur through a failed server component,
    loss of a hard drive (or drives), or through any other network systems, among
    other things.


    Dated equipment that has reached its end of life is a serious issue. If a problem
    or vulnerability is discovered in the BIOS (firmware) or the software drivers,
    for example, they may not be supported. That would mean you would have to buy
    new equipment. If you do not have it in your budget, you may be stuck using vulnerable
    equipment.


    # Local Equipment


    Your plan needs to account for the loss of data on equipment such as a notebook
    computer or mobile devices (such as smart phones). You must account for both backing
    up the data and protecting the equipment with either locking devices or disk-encryption
    (for mobile devices).


    Be sure you review what you would do if your building suffered from the *smoking
    hole* syndrome, which is a disaster that completely wipes out the building because
    of any number of horrific causes. Would your employees have a place to work? If
    so, would they have equipment to work with?


    These hard questions cannot be answered simply by saying that you would buy new
    equipment. Following are a few data points about local equipment you should keep
    in mind:


    +   - Operating systems license keys

    +   - Application source (installation disks) and licenses

    +   - Data on the drives

    +   - Replacement cost of equipment

    +   - Potential liabilities for specific industries


    Be sure you look around at your everyday IT equipment and include a plan for its
    disaster recovery.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# ## Summary


    This information-packed chapter discussed the need for a disaster recovery plan,
    no matter what the size of your business. All businesses are at risk if they cannot
    recover from a serious outage within a week.


    Developing a plan and a team, and testing your plan are tasks that will sharpen
    your skills and raise the likelihood you’ll recover from a disaster or serious
    outage.


    In this chapter, you learned about backup and restoration processes and tools
    for each CMS. You also learned about some loose-end items such as e-mail, local
    equipment, and DNS systems.


    You should spend considerable time on the disaster recovery topic and formulate
    your own plan to protect your business.


    With disaster recovery planning out of the way, Chapter 7 dives into a methodology
    for developing and running a successful patching process for your websites and
    systems.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# CHAPTER 7


    # Patching Process


    If you have used a Windows desktop, then you are already familiar with the idea
    of patching, which Microsoft refers to as an *update*. These updates download
    automatically (assuming you have set it up to do so) on a regular basis and then
    are applied. This helps keep the operating system at its safest level. The patching
    process is built into modern versions of Windows, giving Microsoft a great method
    to help all Windows users stay safe.


    Likewise, a similar process is built into distributions for Linux. For example,
    in CentOS, you use the yum command, which checks predetermined *repositories*
    for updates. If it finds them, it will ask you whether you want to download and
    apply them. Although this process can be automated, it’s often done manually.


    As you’ll see in this chapter, the process of patching a CMS does not necessarily
    work in the same manner. In fact, most of the time (with rare exception), you
    must conduct this process manually. The patching process consists of a methodology
    to monitor, test, apply, and document. The actual application of the patch is
    nearly the last step in the process.


    # Understanding the Patching Process


    If your business consists of more than one person, and you have the luxury of
    an IT staff, then equipping that team with a process like the one described in
    this chapter can make for smooth upgrades.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'This team should be organized around a process, rather than around a person.
    By doing so, you can quickly substitute for a person who is on vacation or who
    may not be available. The process described in this chapter is called the *patching
    process*. It follows seven general steps:


    +   1. Monitor information sources for patches, vulnerabilities, and updates.

    +   2. Back up your site and your database

    +   3. Download the patch. (If one does not exist, you must provide a workaround.)

    +   4. Test the patch to determine that it works and that it does not break anything
    in the process.

    +   5. Deploy the patch following the instructions specific to your operating
    system, CMS, or hardware device.

    +   6. Run another backup of the site and database after you patch.

    +   7. Document the work you conducted and then return to Step 1.


    As you can see, the patching process involves much more than just grabbing a patch
    from a website, applying it, and moving on to the next task.


    Another factor that may be pertinent in the patching process is what takes place
    after a successful patch application. Returning to the Microsoft Windows desktop
    example, if you download a patch and apply it to your desktop, it might require
    a reboot, which is not really a big deal for your basic user. However, a reboot
    of a server operating system can be a real problem, because rebooting a server
    is an event that can affect many, many people. A rebooted machine may have services
    that need to be manually restarted, or have specific settings that may change.
    So many things are involved with a reboot. Part of your process should be to document
    the server settings before reboot.


    # Understanding the Need for the Patching Process


    You may be thinking that you don’t necessarily need to patch, or that you don’t
    really have the time to go through the process. That is definitely the mindset
    of many site owners today. However, if you ignore patching, you are doing so at
    your own peril. That is not a lighthearted statement; it’s backed up by research.


    For example, in 2003, a worm was released on the Internet that swept literally
    around the world in a few short hours. Its target was Microsoft SQL Server. It
    attacked any SQL Server instance that did not have a specific patch. The issue
    was that the patch had been available for several months. Applying it would have
    neutralized the attack. The cost was incalculable, and the downtime was embarrassing.
    Companies (both large and small) were hit by this attack, crippling infrastructures,
    and stopping worldwide commerce. Numerous studies have been conducted using publicly
    available information that shows the act of patching would have stopped the bulk
    of attacks. One study published in'
  merge: -1
  img_proc: true
- pgno: 250
  md: '2000 written by Hilary K. Browne and William A. Arbaugh of the University of
    Maryland, and John McHugh and William L. Fithen of the Software Engineering Institute,
    was entitled, “A Trend Analysis of Exploitations.” In that study, the authors
    proposed a theory that states that after a patch is released, users who do not
    apply it are exposed to an excessive window of opportunity for attacks. Specifically,
    they noted the following:


    > > “The data we cited confirms the hypothesis in which the vast majority of exploits
    occur long after patches that would thwart them are available—demonstrating that
    poor administrative procedures are an enabling factor.”


    Note the part that says, “exploits occur long after patches that would thwart
    them are available.” In other words, most of the time, you could have prevented
    being hacked.


    Thus, you should patch to protect your site from exploits and attacks. This won’t
    remove the attempts, but it will lower the threat surface that enables the kiddie
    scripts and professional hackers from launching a successful attack against your
    site.


    Financially speaking, if you are hacked, then you are exposing yourself to undue
    burden of costs such as cleanup, loss of customer goodwill, as well as potential
    fines and levies. In some states in this country, certain types of data loss could
    be considered a crime.


    What about respect and credibility of your site? Today, a trust with your clients
    may only be established through your website. A publicized hack will likely become
    bigger in the eyes of the public than it really is. In other words, it could easily
    be blown out of proportion. The loss of customer respect could be great. That
    is not something you can simply buy back. Consumers are unlikely to share personal
    or financial details (such as credit card information) with a website that had
    been hacked and had information stolen. Keep this in mind as you read through
    the remainder of this book.


    Patching can prevent attacks on your systems and sites. It is part of a good set
    of administrative practices, and it can have a positive material and direct effect
    on your financial bottom line.


    Either the site administrator or an IT group is typically responsible for patching.
    The organizational requirements for this responsibility are straightforward, but
    are often ignored. The following sections take a look at organizational requirements
    and how you can implement them.


    # Organizational Requirements


    No matter the size of your company or your support staff, you will have specific
    requirements for the staff to ensure a smooth operation. This section looks at
    requirements for the medium to large organization, as well as the small one-person
    shop.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Medium to Large Organization


    In medium to larger organizations, organizational requirements for the patching
    process may involve outside parties (such as other company divisions) or clients
    (such as a telecom group). If a change occurs in the way things work, then your
    client base will be a downstream recipient of the changes. The changes applied
    might require a marketing person or training group in the event of a workflow
    change or new training requirements. Generally speaking, situations that require
    the interaction of marketing or training and patching are rare.


    The patching group should be given the task and authority to conduct the following
    activities:


    +   - Track down and document a system-wide inventory that includes servers, desktops,
    mobile computers, network equipment, firewalls, your CMS, and other corporate
    information resources.

    +   - While collecting the inventory, the group should have the skill to identify
    the operating system version and settings, drivers installed, firmware of machines,
    and any physical configurations.

    +   - The person or group should be required to track down and monitor for updates,
    patches, workarounds, and other issues that could impact your security. The members
    of this organization should be able to make some intuitive leaps in judgment to
    essentially connect the dots. This means that the organization should have a very
    good working knowledge of the infrastructure.

    +   - Optionally, your group should have a person or persons (either on staff,
    or perhaps a third party) to work with who understands and has coding skills for
    the programming language in your CMS.


    Your organization should have strong technical skills, good communication skills,
    and good documentation that is available to the team responsible for patching.
    As the manager, you should establish a well-defined escalation path within this
    organization to take care of issues and have someone the team can reach out to
    in the event of trouble.


    # Creating a Team


    This discussion assumes you have in place some form of a team. The idea of team
    creation could be one of staffing, but in this discussion, it’s more about organizing
    a team around the patching methodology.


    This team could be an ad hoc team that comes together for the purpose of upgrades
    and patching, or the team could be dedicated to the task. Unless you are a large
    enterprise company, your team will fall under the ad hoc umbrella. The team will
    adopt the patching process as a means to monitor and mitigate threats and vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Creating Patching Standards


    The first task that this team should do is to develop a patch standard. No standard
    is being proposed in this chapter, because each company’s implementation will
    vary in design. However, at a minimum, the standard should include the following:


    +   - A list of sites to monitor for patches

    +   - A method for testing the updates

    +   - A documented procedure to follow for backing up

    +   - A developed standard for documenting fixes


    The idea is to create a standardized workflow and procedure to facilitate updating
    and repairing your code. This does not have to be a long and wordy effort. It
    could be something as easy as a spreadsheet based on the template shown in Figure
    7-1.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_252_0.png)


    **Figure 7-1:** Sample documentation for patching procedure


    In this very simple spreadsheet, you see the technician has captured the domain,
    the current version of the CMS, and notes about the update.


    # Assessing Threats


    The team should take on the task of assigning priorities to incoming threats measured
    against the impact of the threats to the organization. For example, if you have
    a very important WordPress blog, and a vulnerability is found that would allow
    a successful attack to yield admin control, then that’s a critical priority.


    Even if you have a single website, it usually contains enough software that you
    should assign a threat level to the points of vulnerability that may affect your
    site. If you have a number of vulnerabilities, or a number of sites, assigning
    a priority to each vulnerability is the best approach to ensure that you work
    on solving the problems in order of priority.


    One good tool is to use a threat matrix for such situations.


    # Using a Threat Matrix


    The idea of the threat matrix is to give you a quick visual of where you might
    encounter security trouble. Your team should be in charge of preparing this matrix
    and should cross-train to ensure all members can use it.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Table 7-1 shows a sample to help you understand the concept.


    # Table 7-1: Sample Threat Matrix for yoursite.com


    | VULNERABILITY | TARGET | THREAT | VIABILITY | PATCH AVAILABLE | ACTION |

    |---|---|---|---|---|---|

    | Buffer overflow | Operating system | Critical | High | Yes | Patch as soon as
    possible |

    | SQL injection | Contact form | High | High | No | Edit code |

    | Information disclosure | CMS | Low | Low | No | Monitor until a patch is available
    |


    This matrix helps the team discover and prioritize what really matters in its
    setup. In this example, the operating system would be the first choice on which
    to focus attention. Following that would be the “Contact form.” As you see, there
    is not a patch for the “Contact form,” only vulnerability. In this example, the
    team could either disable the “Contact form,” or edit the code to fix it. As you
    can see in this example, the code correction would require a member of your team
    to have some coding skills.


    Developing this matrix can also help you to identify where you are weak in terms
    of resources. You may discover that you need a better developer, or other areas
    that need attention. You may find you’re very out of date on patching. And you’ll
    see where you could be hit by the bad guys, and the impact such an attack might
    have.


    # Single-Person Business


    As a sole proprietor or a small business, you clearly have other issues on your
    mind (such as cash flow, revenue, marketing, and other business needs). You may
    be limited on resources, and, thus, you can greatly benefit from a patching process.


    The challenge is that if you ignore the technical needs of your site, one hack
    getting through could easily disrupt your cash flow. Thus, the time and cost you
    put into developing this process will pay off in the long run. If you are hacked,
    the costs of recovering from the hack would greatly exceed the cost of prevention.


    On the flip side, as a small business, you likely do not have a great deal of
    the equipment and various software packages to keep track of. This makes your
    baseline report much easier to do and your threat matrix smaller than one used
    for a larger company.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'If you are a small business, the following is a quick list of the tasks and
    functions that can help you be a team of one:


    +   - Ensure that you have a complete (and frequent) backup.

    +   - Ensure that you remove all unneeded software from your website.

    +   - Apply all the available and necessary patches to your CMS and third-party
    add-ons. (If you have not done this in a while, you may have a long list of items.)

    +   - Create a spreadsheet to track your version and update information.

    +   - Contact your host to ensure that the server is properly updated.


    The last bullet point could be difficult if you do not know the right questions
    to ask. This is not an indictment of any hosting companies, but rather an observation
    about technical people in general. Typically, when asked, a technical person will
    provide a straightforward answer to a technology question. Suppose the question
    is, “Is my server safe?” The answer will likely be “yes.” That doesn’t make it
    so, but rather is the answer to the question you asked. The better question to
    ask is, “Does my CentOS operating system have all the most up-to-date patches
    applied?”


    Following are some areas that you want to address with your host to be sure you’re
    up to date:


    +   - If you’re running an Apache web server, your server may be running any number
    of versions. Take the time to find the version of your current system. After you
    do, review the change logs available from http://projects.apache.org/projects/http_server.html.

    +   - Find out whether operating system patches have been applied. (The distributions
    of Linux you might hear are Red Hat, CentOS, Gentoo, Debian, Ubuntu, mandrake,
    and others.)

    +   - What is the host’s policy on updates and patches?

    +   - Is MySQL Server up to date and running the most current patches?

    +   - Check with the host and find out the BIND (Berkeley Internet Domain Services)
    version that you’re on. It should be at a minimum of the 9.xx series and be patched.

    +   - Ensure that PHP is running version 5.xx. Note that version 4.xx has reached
    its end of life and should be updated. Many hosts are still running the 4.xx version.
    Note that some older PHP applications may fail on 5.xx. Test before upgrading.

    +   - Verify that your version of Python (for Plone users) is up to date and patched.


    Starting with a reputable host will ensure that many of these issues are already
    taken care of. Hosts such as GoDaddy.com, Rochen.com, WiredTree'
  merge: -1
  img_proc: true
- pgno: 255
  md: '.com and Rackspace, are some examples of hosts that are considered reputable,
    though this list is by no means exhaustive.


    # ## Security Metrics


    Author W. Edwards Deming has been considered by many to be the father of modern
    quality. He was an advocate of *processes* versus *quotas*.


    His background was in manufacturing quality, but his principles still apply.


    He advocated crafting a process and the proper measurement, and then fine-tuning
    the process to achieve better numbers. He was against the ideas of “mass inspection”
    and “quotas.” In this sense, a *quota* is pieces built per hour, or number of
    units inspected per hour.


    Deming pointed out that, in manufacturing, you cannot put quality into a product
    through the process of mass inspection. It must be designed from the start, and
    that includes a process to create it. Including metrics for the sake of having
    metrics might be impressive to upper management, but they mean nothing if they
    are not applied in an effort to improve. In his extensive work in the manufacturing
    space, Deming advocated consistency and improvement within statistical boundaries,
    not just the inclusion of numbers.


    Your infrastructure should be measured against a metric to determine the quality
    of your security. It should be a gauge of how safe your site is against attack.
    Note that the last sentence did not say “impervious to attack,” because that site
    doesn’t exist. Rather, there are degrees of safety, and the metrics examined next
    should help you reach a higher degree of safety.


    Deming advocated “*constantly and forever*” improving quality. With that goal
    in mind, take a look at security metrics you can use to make a difference in the
    security of your site.


    # ## Determining What to Measure


    Your first task is to decide what to measure. Will it be how quick a technical
    person answers a telephone? Or will it be how many days, weeks, or months it’s
    been since your site was hacked? Whatever the measurement, is defining it and
    measuring it will be your first task.


    Business leaders often think (correctly) that measuring everything you do is a
    great thing. Where they falter is in the idea of using this information as a punitive
    measure.


    For an example, consider the telephone technical support world. A typical technical
    support representative is required to answer calls in “x” seconds, and only spend
    a specific amount of time on the phone. However, putting technical support in
    the firing line of a poorly designed product with bad documentation is wrong.
    Why not ask why you are getting a certain volume of calls and'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'what you can improve to reduce that situation? What typically happens is that
    the technical support reps will miss statistical goals because they are buried
    or trying to help.


    What’s wrong with this picture is the technical support person is being held responsible
    for product design and education.


    In your security metrics, as you measure both employee performance and things
    such as uptime, review the process in detail by tracing through the steps. Discover
    the root cause for the issues. Don’t automatically accept the *“numbers are bad
    so the people are bad”* conclusion.


    A few things that are important to measure in security can be tied directly to
    processes. These may include response time to patches, number of times your site
    is hacked (hopefully never), costs such as license fees, and, of course, uptime.
    For the purposes of this discussion, you want to measure and record the metrics
    surrounding the following:


    +   - How susceptible is your system to attack?

    +   - What is your response time from the notification of an available patch to
    the fix?

    +   - What are the costs associated with each patch?


    The idea behind this is to find out whether you are vulnerable, how long you will
    be vulnerable on average (after patch release), and what each of the patches cost
    you. The following sections examine each of these facets in a bit more detail.


    # Susceptibility to Attack


    All sites are vulnerable to attack—some more, and some less. The idea behind measuring
    your susceptibility to attack is to lower your number. For the sake of this discussion,
    suppose a higher number means that you are more vulnerable, and that taking the
    steps to lower that number would make you safer.


    This number could actually be represented numerically in two ways. For example,
    you could simply state, “I have four critical patches to apply.” Or this number
    could be represented as a ratio, such as “I have 30 extensions (add-ons) on my
    site, and 15 are vulnerable to attack.” In that case, 15 divided by 30 gives you
    a 50 percent ratio.


    This example is a demonstration to help you calculate or devise your own metric.
    Determining how much of your software is vulnerable in your site can provide a
    metric to measure.


    # Response Time


    Today, metrics are used for “response time,” such as the foolish metric for on-time
    arrivals in the airline industry, or doctors being timed by insurance'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'companies on how long they sit with patients. The issue with these metrics
    is they are punitive in nature; they do not provide a means for quality improvement.


    In the response time category, you are interested in *reducing* the time from
    the notification to the fix. If you discover that many days are going by from
    the notification to the fix, then you have a problem in your process. Naturally,
    you want to design a process that guides the team in checking for and applying
    updates.


    For example, suppose that on Monday at 9:00 a.m. local time, your team becomes
    aware of a critical patch that, if not applied and a hacker were later to exploit
    the vulnerability, could cause you great harm. The proper course of action is
    naturally to take care of this task as soon as possible.


    A real-world example is the 2003 Slammer outbreak that impacted Windows Servers
    worldwide (see http://en.wikipedia.org/wiki/SQL_Slammer and www.cseweb.ucsd.edu/~savage/papers/IEEESP03.pdf)
    as well as airlines and ATM machines all over the globe. In fact, this particular
    virus spread itself worldwide within a few hours. The patch for it had been available
    from Microsoft for quite a while. Systems run by administrators who applied the
    patch before the outbreak were not infected. That’s the kind of response-time
    metric you don’t want to explain to your boss.


    The response time metric needs to measure the time of notification to the time
    of either patching or remediation of the fix. You want the time that elapses between
    notifications to fixes to be as short as possible.


    Include in the response time a period of time for emergency workarounds. Emergencies
    will happen, but not often. Tracking them is best so that you can either eliminate
    the emergencies as much as possible, or work to reduce the time.


    # Costs Associated with Each Patch


    Normally, costs associated with each patch are not tracked, except in cases of
    license fees or other costs associated with an upgrade. However, you may want
    to track this metric to capture the cost per patch. Following are some suggestions
    of things to track:


    +   - The amount of time spent to find the patch (in hours).

    +   - The amount of time spent by each employee to apply a patch. Include after-hours
    costs or overtime, because this is a real financial figure.

    +   - If the patch results in downtime, record the cost per hour.


    One example might be where a development firm does a shoddy job, and then charges
    for “fixes” in the name of updates to the code. Real-world cases have also existed
    where development firms charge for several hours for applying patches'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'that should only take 15 to 30 minutes to apply. This practice artificially
    drives up the cost. Even reputable technology services people or firms have spent
    and charged excessive time because the systems were not documented. You should
    track the time needed for all these tasks because they drive up cost.


    A final example would be a hosting company that does not proactively update and
    allows you to get hacked. You should measure this in terms of the costs of hosting
    (that is, not taking care of you), or the cost to mitigate the damage and loss
    of your time.


    Capture all the hard and soft costs, and measure the value your systems are providing
    you against the cost.


    # Eliminating Known Vulnerabilities from the Start


    As you begin your initial patching, refer to the baseline you created in Chapter
    4 and research your installation to ensure that your server and applications are
    up to current levels. If you have not patched in some time, you might be surprised
    at the amount of work you have ahead of you. You might even discover that your
    site has been hacked.


    The goal is to eliminate all the known vulnerabilities and start with a very secure
    infrastructure. Key areas to focus on are the applications, the CMS, the operating
    system, and, of course, your desktops. Don’t forget about those, because they
    will interact with and connect at some point to your website.


    # Monitoring for New Vulnerabilities


    The earlier-mentioned study conducted by Browne, Arbaugh, McHugh, and Fithen concluded
    that *after* a patch is released, the number of attacks continue to rise at a
    very measurable level. The frequency of attack doesn’t follow a nice, safe bell
    curve; rather, they are on a linear track upward.


    The reason for that the longer a patch (or vulnerability) is published, the more
    hackers find out about it, and the more attempts are made against sites, with
    hackers using the vulnerability as a launching point to attack. They gamble that
    you have not patched your gear, and they are usually right. Their attacks are
    very successful because of the sheer number of available targets. Remember, if
    you *apply* a patch, you have likely foiled the attacker’s efforts of launching
    a successful attack against you.


    Because new vulnerabilities are discovered every day by developers, researchers,
    and criminals, tracking and monitoring the vulnerabilities is important. This
    seemingly easy task can quickly become burdensome as the number of vulnerabilities
    you must keep up with increases.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Making a list of the developer''s websites and other *validated* resources
    is your step here.


    # Sources of Information Regarding Patches


    Literally hundreds of sources are available for patch and vulnerability information.
    As mentioned previously, keeping a list of the ones that matter to you is a best
    practice. The following is a short list to get you started:


    +   - The vendor of the software

    +   - The project (CMS) website

    +   - `http://nvd.nist.gov`

    +   - `http://www.owasp.org`

    +   - Commercially available services


    Feel free to review other sources beyond these, but be sure you trust the content
    and any code they distribute.


    # Commercial Services


    One service you may want to subscribe to is SalusAlerting (*www.salusalerting.com*).
    This service monitors and alerts subscribers about vulnerabilities, patches, and
    other security-related matters. (The author is a co-founder of SalusAlerting.)
    Another available commercial service is Qualys (*www.qualys.com*), which offers
    a host of vulnerability and security services.


    # Testing for Deployment


    Testing is necessary to ensure that the patch you were given actually works in
    your environment. In enterprise businesses, patches are usually put through a
    rigorous set of tests to ensure that they comply with company information policies.
    The IT staff must be sure the patches work with the company applications.


    Testing your patch may be as easy as merely determining whether it works, or it
    may be as complex as running a series of tests against it. The degree of testing
    depends on the patch and the environment.


    Although laying out specific processes for your environment in this book is difficult,
    following are some questions you should consider:


    +   - *Does the patch work?* — This is a yes/no question. Does it fix the issue
    in question? Does it break anything in your environment?

    +   - *What are the monetary costs of the patch?* — This is strictly the cost
    to acquire the update. Normally, no cost should be involved.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   - *What prerequisites are there for this patch?* — Find out whether you
    must uninstall the old code, reboot the machine, or have other code installed
    with it to make it work.

    +   - *Do you have the expertise in-house to apply the patch?* — Some patches
    may include Apache Web Server upgrades, PHP updates, MySQL updates, and other
    compiled environments. This could be a situation where some coding must take place.

    +   - *Will this patch result in procedural changes?* — Think about scenarios
    where backup/restores or other documented procedures will change.

    +   - *Will this patch result in a reboot?* — Most of the time, this should be
    “no.” However, if a patch requires the server to be rebooted before it can take
    effect, then a scheduled downtime is likely in order.

    +   - *What downstream clients (internal or external) may be affected?* — What
    will the impact be to the user community? Will workflows, new login procedures,
    passwords, or other processes change?

    +   - *What departments or organizations should you involve?* — This can include
    ancillary departments such as compliance, telecom, networking, or even outside
    vendors.

    +   - *What systems may be impacted?* — For example, will your patch change your
    PCI compliance status?

    +   - *Will this patch require a software developer or system administrator to
    update?* — This can be the case in instances such as PHP or Apache web server
    updates. Any time you have a compiled application, it involves more than just
    simply applying patches.


    Other questions that may arise will be specific to your environment. After you
    add any additional questions to this list, set out to write a set of procedures
    to test and answer these questions before you deploy the patch.


    # Obtaining Safe Patches


    Your methodology should take into account where the patches are coming from. A
    few cases have been documented in which a source was contaminated by a hacker,
    resulting in the distribution of hacked code.


    Plenty of cases have also occurred where download sites have been hacked, which
    may leave you with the impression that the download may not be safe. Fortunately,
    this occurrence is rare, but be sure to scan everything with a virus-scanning
    program either during or after the download.


    Some websites offer distribution of a patch that is not necessarily the vendor’s
    or developer’s site. These are referred to as mirror sites. They are usually very
    safe and should not present any problems.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Sites you should stay away from are sites that offer free download of commercially
    available products. These are known as *warez* (pronounced “wares”) sites, and
    are often tainted with a virus. Avoid these for a variety of reasons, including
    the potential trouble they may bring on if they also serve up adult content. So,
    in short, stay away from them.


    Always be certain that you are downloading the genuine article by visiting the
    developer’s site.


    Some developers offer a Message Digest 5 (MD5) hash that uniquely identifies that
    particular code. The hash is a string of alphanumeric characters that looks like
    `98d8ab5a01747009387c3f54db505e94`. Using any number of available MD5 tools, you
    can quickly check your version against its hash. If they don’t match, don’t use
    it. Download a new copy (and check again).


    # Deploying a Patch or Fix


    Deployment of a patch hopefully should be an easy and straightforward process.
    Although several ways exist to conduct the actual installation of the patch, following
    are some of the more popular means you might encounter:


    +   - Auto-update (as in Windows Update)

    +   - Updaters (such as yum in Linux)

    +   - Code with an install routine

    +   - Updater scripts (such as `update.php` in Drupal)

    +   - Recompilation of code (such as Apache)

    +   - Editing code (typically through a text editor, and possibly done by a software
    developer)


    You will find that the more mature products in the CMS space offer an installation-type
    routine. The less mature ones may offer code “fixes.” Documenting your preferred
    method of setup ahead of time should be part of your process.


    As an interesting example of software maturity, WordPress (3.0.x) offers the capability
    for a single-click update of the core CMS and the plug-ins. This makes a particular
    WordPress update very fast and painless. Get into the practice of conducting a
    backup before doing an auto-update of any code.


    In the case of compiled code (for example, Apache), it’s not a simple matter of
    updating the code with a patch. Updating Apache requires downloading the source
    and compiling the code on the machine. Take special care in these instances to
    preserve any configuration files, or you’ll wind up doing a restore to gather
    them back up.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Distributing a Patch to Your Administrators


    Plenty of small, medium, and large companies have more than one site or administrator.
    Your patch process should account for this situation if it exists in your environment.


    Patches should be tested and distributed from a central group to the remote or
    other administrators. This practice ensures uniformity and, of course, system-wide
    security.


    Establish as part of your process a means for the remote administrators to be
    notified of the patch, and how to report back on the application of it. This is
    a good example of how an online database could be used to collect the information.


    When you distribute the patch, include a set of work instructions on how to implement
    the update.


    In this organizational situation, you want everyone to follow a single set of
    instructions. Allowing remote admins to choose whether and when they patch is
    a recipe for trouble.


    # Documenting Your Patches


    In the early days of the author’s career, the PC “standard wars” were in full
    swing, and everyone was trying to make it to the top. His employer at the time
    had several wings of a massive industrial complex filled with mainframes and minicomputers.
    In the course of his job, whatever tasks he performed on the equipment in that
    environment were written down in a notebook. This notebook would stay with the
    equipment for others who came after him to know what he did.


    In the same way, you should find a way for documenting your patches. You should
    make a complete list of what you did in some form. The following are items you
    should capture:


    +   - **Date and time** — Always record the date and time the patch was deployed.


    +   - **What patch version was applied?** — This may be a number, a notation,
    or other means to identify it.


    +   - **What vulnerability or issue does this fix?** — This may be something along
    the lines of a SQL injection, XSS scripting error, or other non-security-related
    problems.


    +   - **Who applied the patch?** — This is the developer, technician, company,
    and so on. You want to be able to reach out to the person responsible for its
    implementation.


    +   - **What software or hardware system did you patch?** — This could be your
    CMS, a third-party add-on, a switch or router, and so on.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '+   - *Where was the patch obtained from?* — This should include the source
    of the patch or the developer.

    +   - *Any observations* — Did anything happen, such as errors or configuration
    changes?

    +   - *Was a backup conducted post patch?* This is a yes/no question.

    +   - *Dependencies* — This is a situation where you may need other patches or
    other software combined with this patch. Another dependency might be remembering
    if you must back out the patch. That is, if something breaks in the update, you’ll
    need to know the process to roll it back.

    +   - *Other* — Always provide a blank field for general issues.


    Once again, capture this information in a manner that works best for you.


    # Patching after a Security Breach


    Chapter 9 discusses in detail the topic of being hacked. This brief discussion
    of the topic is meant to introduce you to a number of concerns should you need
    to apply a patch after being hacked. Here you will learn about some often-overlooked
    issues after a hack.


    As mentioned earlier in this chapter, you are less likely to get hacked if you
    follow a timely patching routine, but it can still happen. There are times when
    you can do everything absolutely right and get hacked through an undisclosed vulnerability
    or a zero-day exploit. A *zero-day exploit* is an attack that seeks out an unpublished
    vulnerability. Usually, a hacker finds it and uses it for his or her gain to attack
    on wide scale. Often, the hacker will write an exploit and either sell it or deploy
    it. Fortunately, not many zero-day exploits and vulnerabilities occur. However,
    when they happen, they are devastating.


    More than likely, you will be faced with patching after you were hacked, because
    you didn’t patch, and thus were hacked. It’s plain and simple: *Not patching is
    a poor administrative practice, and it will make you a target.*


    # Issues and Concerns


    After you have been hacked, you must check a number of things. The list is long,
    but some areas of concern might be viruses, Trojan horses, Remote Administration
    Trojan horse applications (RATs), ports open that should be closed, data copied
    off to unauthorized persons, tampered code, eavesdropping tools, and more.'
  merge: -1
  img_proc: true
