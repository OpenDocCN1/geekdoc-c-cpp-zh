    | `copytruncate` | Truncates the original log file to zero size in place after
    creating a copy, instead of moving the old log file and optionally creating a
    new one. See the man pages for more information (for example, `man logrotate`
    when logged in a shell). |

    | `create (mode, owner, group)` | Immediately after rotation (before the `postrotate`
    script is run), the log file is created (with the same name as the log file just
    rotated). `mode` specifies the mode for the log file in octal. `owner` specifies
    the name of the user who will own the log file. `group` specifies the group the
    log file will belong to. Any of the log file attributes may be omitted, in which
    case, those attributes for the new file will use the same values as the original
    log file for the omitted attributes. This option can be disabled using the `nocreate`
    option. |

    | `daily` | Log files are rotated every day. |

    | `dateext` | Archives old versions of log files, adding a daily extension like
    `YYYYMMDD`, instead of simply adding a number. |

    | `dateformat format_string` | Specifies the extension for `dateext` using the
    notation similar to the `strftime` function. Only `%Y`, `%m`, `%d`, and `%s` options
    are allowed. The default value is `-%Y%m%d`. Also note that the character separating
    the log name from the extension is part of the `dateformat` string. |

    | `delaycompress` | Postpones compression of the previous log file to the next
    rotation cycle. |

    | `extension ext` | Log files are given the final extension `.ext` after rotation.
    If compression is used, the compression extension (normally `.gz`) appears after
    extension (`.ext`). |

    | `ifempty` | Rotate the log file even if it is empty, overriding the `notifempty`
    option (`ifempty` is the default). This means that an empty log will be treated
    the same as a log with content in it. |

    | `missingok` | If the log file is missing, go on to the next one without issuing
    an error message. See also `nomissingok`. |

    | `monthly` | Log files are rotated the first time `logrotate` is run in a month.
    (This is normally on the first day of the month.) |

    | `nocompress` | Old versions of log files are not compressed. |

    | `nocopy` | Do not copy the original log file and leave it in place. (This overrides
    the `copy` option.) |'
