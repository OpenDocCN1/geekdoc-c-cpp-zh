    In the setup screen that appears, you can select “Add-ons,” as shown in Figure
    4-4.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_133_0.png)


    **Figure 4-4:** Plone add-ons


    Record your list of add-ons in your spreadsheet, and then visit `http://plone.org/products`
    to verify that you are running the latest for your version of Plone. If you find
    that your add-ons are out of date, follow the developer’s instructions to update
    the add-on.


    Remove any unneeded add-ons and document the remaining packages.


    # WordPress


    Of all the CMSs examined in this book, WordPress is the easiest of all to use
    to identify and update your plug-ins.


    Log in to your WordPress site as the administrator, and locate Plugin on the toolbar
    on the left side. Click the Upgrade Available link and a list of plug-ins that
