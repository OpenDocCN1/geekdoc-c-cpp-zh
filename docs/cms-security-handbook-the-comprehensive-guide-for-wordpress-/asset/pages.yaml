- pgno: 152
  md: 'owners. The aim here is to give you a good framework, while addressing some
    common issues to help protect you.


    Securing your server entails more than making technical changes. It also involves
    taking into consideration a bit of strategy.


    Think about the value of your information. Is the information pertinent to an
    industrial company sector? Or is your company’s site dedicated to selling quilting
    supplies? Both are important. However, one may be a hacker’s target because of
    the value of the information contained on the server and potential credit card
    information, whereas the other may contain information of value to a competitor.


    Consider employing every possible measure to protect all of your company’s valuable
    information, including strong cryptography to protect the data. A hacker may be
    after credit card information you have or may want to use your server for disseminating
    spam. They may want to lurk on your site and sell their own wares.


    Identify for yourself where your company falls on that spectrum and keep it in
    mind as this discussion examines how to protect the Linux operating system. You
    can take some preventative measures that may be described as “low-hanging fruit.”
    These involve little effort, but pay off very well.


    Let’s begin with the login banner.


    # Changing the Login Banner


    The login banner is the message that the user sees upon a successful login. Often,
    by default, this message can tell you a lot about the underlying system, such
    as the version of the operating system and possibly more. A dedicated attacker
    can use this information to build a map of the systems to be used for an attack.


    Following are some ways to change the default login banner:


    +   - Dilute any information that could allow a malicious user to learn the details
    of the operating system and its version.

    +   - Change the technical message to a warning banner that this system is for
    authorized users only. This is to ward off any weak defense of someone saying,
    “I didn’t know I couldn’t log in because it didn’t say I couldn’t.” Although changing
    the login banner in this way offers no legal benefit, making the change is better
    than not.

    +   - Display the resources the person is allowed to use, or even news of the
    day, to help to reduce potential technical support calls.


    Let’s take a look at how to change that login banner message to something else.
    In effect, this produces the benefit of neutralizing any chance of a threat to
    you via information leakage.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'You''ll need a few things to get you started on this task:


    +   - Root access

    +   - A desk-side editor such as WinSCP (optional)

    +   - The message you want to use to replace the default login banner message


    > **NOTE** For the desk-side tool, if you are comfortable with one of the many
    editing tools such as vi in Linux, then feel free to use it. However, throughout
    this book, WinSCP is used in the examples because it is a highly valuable (and
    free) tool. You can download a copy from WinSCP.net.


    To change the login banner:


    +   1. Open your site with WinSCP (or your SFTP tool of choice) and navigate to
    the `/etc/issue` file. Right-click this file. An image similar to that shown in
    Figure 5-3 appears.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_153_0.png)


    **Figure 5-3:** Default issue file


    In this example, you see that the banner advertises at login the CentOS release
    5.5 final version of Linux. In addition, you can see the phrase `Kernel \r on
    an \m`. This indicates the release (\r) and the machine (\m).


    +   2. Determine what you want to display at login, and replace the default banner
    with it.


    +   3. After you make the change, save it and copy it back onto the machine.


    After you handle these preliminary tasks, you should ensure that you are running
    the latest versions of software. The utility called *yum* is what you can use
    for any required updates.


    # Using yum


    To update a Linux server, you can either upload the patches yourself, or pull
    them from a trusted source, known as a *repository*.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'In Red Hat Linux and other Red Hat distributions (such as CentOS and Fedora),
    the update command is `yum`. Another facility is called `RPM`. `yum` installs
    the software package you pick and other software that it may depend on. `RPM`
    installs only the software package you pick. For example, if you use `yum` to
    install Apache, you can be sure that you have pulled in the appropriate supporting
    files. Other versions of Linux will use different commands for updating.


    First take a more detailed look at `yum`, followed by some commands for Debian
    Linux.


    # **Basic yum Commands**


    This discussion will familiarize you with some commands that you will need as
    you work your way through this section. Note that the # (pound or hash sign) indicates
    the administrator prompts. You don’t need to include it in the use of the commands.


    Following are some commands you can use to install, remove, and update software
    packages with `yum`:


    +   - `# yum install package_name`

    +   - `# yum remove package_name`

    +   - `# yum update package_name`


    If you ever see a package running and are not sure what it is, you can use `yum`
    to help you identify the package in question, as shown here:


    ```

    ```

    # yum provides name of package

    ```

    ```


    Use the GROUP command appended to `yum` as shown here to get a list of items to
    be installed together.


    ```

    ```

    # yum grouplist list

    ```

    ```


    Type out the command `yum grouplist` to see all the groups that are installed
    and that are able to be installed. Table 5-2 shows an example of information returned
    by using this command.


    **Table 5-2: Results of Using yum grouplist**


    | INSTALLED GROUPS | AVAILABLE GROUPS |

    |---|---|

    | DNS Name Server | Administration Tools |

    | Development Libraries | Authoring and Publishing |

    | GNOME Software Development | Base |

    | Graphics | Beagle |


    *Continued*'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Table 5-2 (continued)


    | INSTALLED GROUPS | AVAILABLE GROUPS |

    |---|---|

    | Legacy Network Server | Cluster Storage |

    | Legacy Software Support | Clustering |

    | Mail Server | Development Tools |

    | Network Servers | Dialup Networking Support |

    | OpenOffice Enterprise Distribution | Editors |

    | System Tools | Emacs |

    | Text-based Internet | Engineering and Scientific |

    | Yum Utilities | FTP Server |


    yum is a quick way to find and install a package. Using the returned list shown
    in Table 5-2, you could install a new FTP server quite easily by using the following
    command:


    ```

    ```bash

    # yum groupinstall "FTP SERVER"

    ```

    ```


    You can cluster on one line a set of commands to install, as shown here:


    ```

    ```bash

    # yum install php-mysql php-devel php-gd php-mcrypt php-pgsql-memcache

    php-pspell php-snmp php-xmlrpc php-xml

    ```

    ```


    This command can install several items, such as MySQL Server and the PHP development
    tools. It is handy for setup purposes.


    # Updating the Server Using yum


    After you have updated your server, you are ready to begin the hardening process.
    You’ll need to log on as the super user. Remember, you’ll see the # prompt after
    you are logged in. Seeing $ means you are logged in as a regular user. The following
    examples involve using CentOS to demonstrate the use of yum.


    Suppose you wanted to check the system for potential updates. The quickest way
    to do this is to use the yum update command. This checks that your installed applications
    are up to date and issues a report. Figure 5-4 shows an example of a server needing
    an update.


    However, if you ran that command and no updates were needed, you would see something
    similar to Figure 5-5.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_156_0.png)


    Figure 5-4: Server needs updates


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_156_1.png)


    Figure 5-5: Server is up-to-date


    # The Debian Distribution


    Another popular distribution is Debian Linux, and its update/install/removal tool
    is called aptitude.


    This command works similarly to yum. Following are a few examples:


    +   - `# aptitude install package name`

    +   - `# aptitude reinstall package name`

    +   - `# aptitude remove package name`

    +   - `# aptitude remove --purge package name`


    Note that the last command in that list has `--purge` appended to it. This command
    removes the software package(s) and the installed files, essentially cleaning
    up the server.


    You can check the versions of all your installed software packages using the `-v`
    command option, as shown here:


    ```

    ```bash

    # aptitude -v install package name

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'To update an extension, you have a few options. Sometimes you may want to simply
    download, but not install a file. The `aptitude` command provides a switch for
    that as well, as shown here:


    ```

    ```bash

    # aptitude -d install package`name`

    ```

    ```


    Patching and updating your server and your CMS is important. If you''re running
    Debian, then you have different options:


    ```

    ```bash

    # aptitude update

    # aptitude upgrade

    # aptitude dist-upgrade

    ```

    ```


    These three commands differ as follows:


    +   - `update` refreshes the cache (that is, the local list of packages and their
    repositories).

    +   - `upgrade` installs a new version of the application. This is similar to
    RPM.

    +   - `dist-upgrade` installs the most current version of packages and may install
    additional packages. This is similar to yum.


    The files you update and the files you store are all governed by *permissions*.
    That is, they have specific permissions dictating who can do what with them. The
    next hardening task is to examine *file permissions*.


    # ## Setting File Permissions


    Files in Linux are given several attributes that correspond to specific groups,
    including the following:


    +   - Owner of the file

    +   - Groups (of people)

    +   - Public (that is, anyone who accesses the system from the outside)


    Each of these groups is allowed to do specific tasks or activities based on their
    permissions.


    # ### Permissions Represented as Octal Numbers


    Misconfigured file permissions are one of the biggest threats to a web server
    or to a CMS website. In fact, early on in the Joomla! world, permissions were
    a huge problem, but that problem has been reined in a bit over the last couple
    of years.


    The numerical notation for permissions is counted in the base 8 system known as
    *octal*. You would see octal counted in the following form:


    ```

    ```text

    0 1 2 3 4 5 6 7 10 11 12 13 14 15 16 17 20 21 22 23 24 25 26 ...

    ```

    ```


    This is because, in the octal system, there are only the numbers 0 through 7.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Permissions look like `644 filename.ext`. Following is what the three numbers
    mean:


    +   - The first number (in this case 6) represents the *owner* of the file. It
    states what he or she can do.

    +   - The second number (4) represents the *group* (users are members of groups)
    and what they can do.

    +   - The third number (4) represents the *public*, also known as world or global.


    You might see permissions represented in binary form as well. The following will
    help you cross reference:


    +   - Binary `000` — Octal 0

    +   - Binary `001` — Octal 1

    +   - Binary `010` — Octal 2

    +   - Binary `011` — Octal 3

    +   - Binary `100` — Octal 4

    +   - Binary `101` — Octal 5

    +   - Binary `110` — Octal 6

    +   - Binary `111` — Octal 7


    Following is how the permissions actually break down:


    +   - 0 — No permission

    +   - 1 — Execute (x)

    +   - 2 — Write (w)

    +   - 3 — Write and execute (wx)

    +   - 4 — Read (r)

    +   - 5 — Read and execute (rx)

    +   - 6 — Read and write (rw)

    +   - 7 — Read, write, and execute (rwx)


    Thus, if you see a file with `400` (or, in binary notation, `100 000 000`), that
    means only the owner (root) can read the file, and no one else has rights to read
    or execute it.


    > **NOTE** Seeing a file with `777` means the file has been (most likely incorrectly)
    granted full read, write, and execute permissions to everyone. This is a very
    bad security risk, and if your site has changed from normal settings to that setting,
    you have a problem.


    Now, take a look at the critical files for your passwords.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Critical Password Files


    The files in question are passwd, shadow, group, and gshadow. These files are
    owned by the root user (super user) and contain the passwords for various parts
    of the system.


    You must ensure that they are set up properly. In this case, work at the command
    line using the tool Putty. (You may download it from `http://www.chiark.greenend.org.uk/~sgtatham/putty/`.)


    +   1. Log in as super user (you’ll see the `#` prompt) and change directory to
    the `/etc` directory. Use the following command:


    ```

    cd /etc

    ```


    +   2. Type `ls passwd -l`, and you should see a screen similar to Figure 5-6
    appear.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_159_0.png)


    Note that the file is root and group is root. This is exactly what you want.


    +   3. Repeat these steps for the shadow, group, and gshadow files.


    > **NOTE** You may not have gshadow on your system.


    If you find that a file is owned by *anyone else*, then you most likely need to
    change it back to root. To do so, you use the chown command. chown instructs the
    Linux operating system to change ownership (thus, the name chown). Consider the
    following example:


    ```

    chown root:root passwd

    ```


    This command changes the ownership of the passwd file to root. Note, however,
    that the likelihood is slim that you’ll find the password files incorrectly set
    unless you’ve been hacked.


    > **NOTE** It’s worth noting that a better administrative position is to use groups
    to restrict access to your server’s resources. With groups, you can contain your
    users and what they do, and not worry about the files (as much). This same concept
    applies to your Joomla!, Drupal, Plone, or WordPress site. Restrict the access
    to the areas that the person actually needs.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# ## *World-Writeable*


    The next task for hardening the server is to locate all the world-writeable files.
    As you have likely surmised, this term means that anyone can write to a file,
    if they have access to the machine. This access is not a good thing, and should
    be curtailed. Finding all the world-writable files is a snap, and doing so can
    help you eliminate that particular attack surface.


    While logged in as the super user, execute the following command:


    ```

    ```shell

    # find disk-part -xdev -xtype f -perm -0002 -print

    ```

    ```


    This command provides a list of files that are world-writable. You should not
    see any output after you enter this command. If you have output from this command,
    a good possibility exists that you have something set wrong. Take the time to
    investigate the problem and take corrective action.


    If you find files that need correction, then use the following command to correct
    the situation:


    ```

    ```shell

    # chmod +t /dir (where /dir is the directory).

    ```

    ```


    Using the chmod command, you can change the permissions to what you need. Generally,
    setting files to 644 (octal) or to 444 (octal) on any CMS running on Linux is
    a good idea.


    > > **NOTE** If you are running Linux on a Windows server, consult a guide from
    Microsoft for specific steps to set permission and other security needs located
    at http://technet.microsoft.com/en-us/library/cc524539.aspx.


    # ## *Unauthorized SUID/SGID System Executable Files*


    If you have ever logged in as the super user (root) using the Secure Shell (SSH)
    protocol and uploaded files, you may have discovered that the files won’t run
    from your browser in most cases. This situation is caused by the file(s) being
    uploaded and owned by the root user. Thus, they carry a level of power within
    the system. Logging in as root can be a dangerous activity if the file is something
    that could wreak havoc on the machine.


    As the root or super user, systems such as Apache should not run files owned by
    root.


    Close cousins to this scenario are the SetUID and SetGID bits. These bits can
    cause some odd and hard-to-track-down security holes in your site. In essence,
    when these bits are set, they run or execute under the privileges of the owner
    of the file. Thus, if an ordinary user or a user in group executes a file owned
    by'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'root user, it will run as if the root user were logged in — again, not a scenario
    you want to see happen.


    Checking for these bits is essential, especially if you are not sure what the
    status of the server is.


    To check for them, execute the following command:


    ```

    # find disk-part -xdev \( -perm -4000 -o -perm -2000 \) -type f -print

    ```


    This command may provide you a number of files that need to be reset. If they
    have either of these bits set, these files will allow anyone to run the files
    as if he or she were the owner.


    Find and correct any you find. If you are not sure, consult with your administrator.


    # ## Orphan Files


    For many reasons, files can occasionally become orphaned, meaning that the file
    is no longer owned by a user. This may or may not represent a threat, but does
    indicate some kind of trouble is present. An orphan file may indicate that something
    has been installed improperly, or possibly that an attacker has been there.


    Use the following command to locate any orphan files:


    ```

    # find disk-part -xdev \( -nouser -o -nogroup \) -print

    ```


    If you find any orphan files, take the appropriate actions to assign it to a group
    or user. If the orphaned file is not needed, then delete it.


    # ## Reviewing Disk Access


    In most cases, disk access should not be a real issue, especially if you’re running
    on a managed host that has been properly configured. However, if you have set
    up your own server, consider the following tips:


    +   - Set up a partition for your users’ files. This practice keeps them separate
    from the rest of the files.

    +   - Set up a separate disk partition for the /tmp directory, which is the place
    to store large files such as cache, installation files, and other transient data.

    +   - Set up a separate logical volume (think c:) or partition for logging. This
    action keeps users from accidentally writing into the logs, or deleting them.


    # ## Disabling Unneeded Services


    In a stock system, you can probably turn off several services because they are
    not likely to be needed. In fact, these services can, in many cases, represent
    a significant threat.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'One of those common services is Telnet, which is a very old protocol. It has
    had several revisions that have helped shore up its security. However, it still
    represents a viable threat to your CMS and server. A review of the document at
    www.ietf.org/rfc/rfc3986.txt can give you a list of bad things that are associated
    with this protocol.


    Following are some services that you should remove:


    +   - Telnet

    +   - RSH Server

    +   - TFTP


    You can use the now-familiar yum command to easily deal with these services as
    follows:


    ```

    ```bash

    # yum erase telnet

    # yum erase rsh-server

    # yum erase rsh

    # yum erase tftp-server

    ```

    ```


    > **WARNING** Remember, although removing these services is important, be sure
    you aren’t using them. For example, removing Telnet may cause your FTP server
    to stop working.


    # ## Securing an Apache Server


    One area that all people who interact with your CMS website will touch is your
    web server software. The Apache httpd web server is the most popular of the web
    servers on the market, with more than 50 percent of the market share.


    Apache is a very well-maintained and developed system; generally it’s secure out
    of the box. However, this robust system offers many different configuration options
    and, hence, many opportunities to leave something amiss.


    Obviously, one of the first steps to securing an Apache server is to ensure that
    you use the latest version of Apache.


    Log in to your server via SSH using Putty and issue the command `httpd -v`. A
    screen similar to that shown in Figure 5-7 should appear. Consult the Apache.org
    website to determine whether you need to update your version of Apache.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_162_0.png)


    **Figure 5-7:** Apache version information'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The rest of this section examines how to configure Apache for secure use and
    operation.


    # Configuring Apache for Secure Operation


    An attacker who is more than a kiddie-scripter wants to gather as much information
    as possible. Given the likelihood you’re running Apache, that part of the hacker’s
    information gathering is out of the way. In that case, the next item the attacker
    wants to get is the version information about Apache, which means that you must
    restrict the information Apache gives out. Knowing your Apache version is a key
    source of information for an attacker.


    Open your Apache configuration on file located at `/etc/httpd/conf/httpd.conf`.
    Scroll through the directives and locate the information shown in Figure 5-8.


    ```

    ```text

    # These can be set in WHM under "Apache Global Configuration"

    TraceEnable Off

    ServerSignature Off

    ServerTokens Prod

    ```

    ```


    **Figure 5-8:** Restricting Apache information leakage


    In your configuration file, either modify those lines to match what is shown in
    Figure 5-8, or add them if they don’t exist. As you can see, this server is running
    Web Host Manager (WHM) and, thus, you can set these lines from the graphical user
    interface (GUI).


    The first line, `ServerSignature Off`, prevents Apache from displaying its version
    or error pages. The second line, `ServerTokens Prod`, causes any page headers
    to display the word Apache only. To be fair, this doesn’t really help security
    directly, but it does hide those critical version details.


    Search through your configuration file for the `HTTP Digest Authentication` module.
    It provides for encrypted authentication sessions. You might not have this entry
    in your configuration file, but if you do, you should remove it. The use of SSL
    is preferred.


    Look for the following line:


    ```

    ```text

    Load auth_digest_module modules/mod_auth_digest.so

    ```

    ```


    If you find it in your configuration file, comment it out by putting a # (pound
    sign) in front of it and save the file back to the server.


    *Lightweight Directory Access Protocol (LDAP)* support is provided through the
    use of a module from Apache. If you are using LDAP for authentication, then skip
    this step. Otherwise, look for the following two lines in your configuration file
    and comment them out:


    ```

    ```text

    LoadModule ldap_module modules/mod_ldap.so

    LoadModule authnz_ldap_module modules/mod_authnz_ldap.so

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: '*Server Side Includes (SSI)* is a means to dynamically generate web pages through
    insertion of server-side code. This is a very big security concern, and likely
    it''s not needed with your configuration.


    If the server is not configured properly, some of the concerns are that arbitrary
    code could be inserted and run on it. Additionally, it would be vulnerable in
    some instances to Cross-Site Scripting (XSS) vulnerabilities.


    Review your configuration file, comment out the following line, save to your server,
    and test your website:


    ```

    LoadModule include_module modules/mod_include.so

    ```


    If commenting out this line breaks your website or causes strange behavior, then
    uncomment it and review the Apache documentation regarding this module at http://httpd.apache.org/docs/2.2/mod/mod_include.html.


    *MIME Types* are a system of definitions of non-ASCII characters. Originally,
    this system was used to enable mail systems to receive non-text input. It has
    been expanded to browsers, among other systems.


    When a graphics element or other non-ASCII (non-HTML) element is sent to a browser,
    the browser attempts to identify and render the element. If the element cannot
    be rendered, then the mime_magic_module modules for Apache are a secondary line
    of defense to guard against opening restricted files. However, actual cases have
    been reported where mime_magic_module has been used, and it would not render information
    on one browser, but would on another. Removing it fixed this problem.


    Your setup will likely not need this. Find the following file reference, comment
    it out, and save the configuration file:


    ```

    LoadModule mime_magic_module modules/mod_mime_magic.so

    ```


    *WebDAV* is the extension to the HTTP protocol that provides the capability for
    collaboration of web content. However, this extension allows one too many people
    to edit and update documents on a website. You can think of WebDAV as an Internet-enabled
    file system much like your desktop has a file system.


    If your CMS does not need WebDAV, then you should disable it for security reasons.
    In the event that your server or CMS needs WebDAV functionality, take the necessary
    precautions to secure the server.


    Review the configuration file and comment out the following:


    ```

    LoadModule dav_module modules/mod_dav.so

    LoadModule dav_fs_module modules/mod_dav_fs.so

    ```


    Apache can provide *server activity status*, but this module introduces a number
    of vulnerabilities that would be valuable to an attacker. If this module is installed,
    but not needed, then comment it out as shown here:


    ```

    LoadModule status_module modules/mod_status.so

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'If loaded, the *Web Server Configuration Display* (`mod_info`) module will
    make all configuration files available, even down to the directory level (think
    `.htaccess`). The security threat to your site is that this module will “leak”
    information about configuration directives to other parts of Apache. This could
    include such things as system paths, usernames and passwords, databases installed,
    and more. Not running this module in a production environment such as an Internet-facing
    server is strongly recommended.


    Comment out the following line if it is found in the configuration file:


    ```

    LoadModule info_module modules/mod_info.so

    ```


    Part of a dedicated hacker’s effort will be to *enumerate* your website. In essence,
    that means that the hacker will attempt to find and name everything to map out
    the network and server. If installed, the `speling_module` module will attempt
    to find a *document* (that is, a resource such as a file) by comparing each document
    name in the requested directory against the requested document name without regard
    to case, and allowing up to one misspelling.


    This scenario is perfect for continuing to ping a site with requests and see what
    files show up. Disabling this module (if it’s installed) is recommended. Comment
    out the following line in your configuration file if found:


    ```

    LoadModule speling_module modules/mod_speling.so

    ```


    Using the capability of the directory translations module, an attacker could easily
    enumerate the web server’s users. Disable the following if it is found in your
    configuration file, unless it is absolutely needed:


    ```

    LoadModule userdir_module modules/mod_userdir.so

    ```


    If you are not using your Apache server as a *proxy server* (gateway) to other
    servers, then ensure that the following lines (if they exist) are commented out:


    ```

    LoadModule proxy_module modules/mod_proxy.so

    LoadModule proxy_balancer_module modules/mod_proxy_balancer.so

    LoadModule proxy_ftp_module modules/mod_proxy_ftp.so

    LoadModule proxy_http_module modules/mod_proxy_http.so

    LoadModule proxy_connect_module modules/mod_proxy_connect.so

    ```


    If you do not know what the proxy server is for, you likely do not need it. Having
    it on is very dangerous if the server is not fully secured.


    > **NOTE** For more information about directives in Apache configuration files,
    see http://httpd.apache.org/docs/2.2/mod/quickreference.html.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Disabling or Setting Up Proper Services


    Although each Apache configuration is very different, understanding what programs
    start at boot time is important. This knowledge can give you a very good picture
    of what programs you should enable or disable. You’ll likely have services similar
    to those shown in Figure 5-9, which shows the services that start up on this particular
    server.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_166_0.png)


    Take the time to check your server with the following command:


    ```

    ```bash

    # chkconfig --list | grep :on

    ```

    ```


    Investigate the services and, if you determine that you do not need one or more
    of them, disable the service using the following command:


    ```

    ```bash

    # chkconfig service off

    ```

    ```


    Replace the word service in that command with the service name, as shown here:


    ```

    ```bash

    # chkconfig pure-ftpd off

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'This command disables the FTP server from running at the next restart.


    # WHAT IS THAT SERVICE?


    Occasionally, you may see a service running that you are unsure of. This is not
    a cause for alarm, but you may want to investigate further. To learn what RPM
    package (installation package) the service came from, run the following command:


    ```

    ```bash

    $ rpm -qf /etc/init.d/servicename

    ```

    ```


    This reveals what package installed it. It could easily be a dependency for another
    service.


    You can also get a brief description of what the RPM package does by typing in
    the following command:


    ```

    ```bash

    $ rpm -qi rpmname

    ```

    ```


    Note that this command may not work on all distributions of Linux.


    The one service you should have turned on is ModSecurity. Let’s take a closer
    look at this very important module.


    # ModSecurity


    ModSecurity (available from www.modsecurity.org) is an open source Web Application
    Firewall (WAF). Its job is to protect the web application layer against a variety
    of attacks that target weaknesses in a CMS and other web applications. It does
    this with a variety of defenses, including monitoring of the HTTP (web) traffic,
    a flexible rules engine, and real-time analysis of your traffic.


    ModSecurity (or mod_security) works as a reverse proxy, and provides a virtual
    patch against attacks. Using this or another type of WAF is highly recommended.


    The installation of mod_security is quite simple using yum:


    ```

    ```bash

    # yum install mod_security

    ```

    ```


    The default configuration likely will work for you, but given its flexible rules
    engine, you have the option of deploying highly customized configurations on it.
    The deeper details are beyond the scope of this book. The following sources can
    provide more information:


    +   - *Mod Security Handbook* (London, Feisty Duck, Ltd., 2010), written by the
    principal developer of ModSecurity, Ivan Ristic. For more information, see www.feistyduck.com/books/modsecurity-handbook/index.html.

    +   - Another reference is a fairly well-documented guide to the installation
    of ModSecurity on Ubuntu, located at: www.thebitsource.com/infrastructure-operations/web-application/securing-apache-web-servers-modsecurity.'
  merge: -1
  img_proc: true
