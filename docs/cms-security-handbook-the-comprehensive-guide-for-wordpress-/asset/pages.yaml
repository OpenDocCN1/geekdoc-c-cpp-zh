- pgno: 237
  md: 'Run the following command:


    ```

    tar -cvf blobstorage.tar.gz blobstorage/.

    ```


    This archives the contents and directory structure of blobstorage.


    +   9. Change the directory to `/usr/local/Plone/zinstance`.


    +   10. Using the tar command, archive the Products directory as follows:


    ```

    tar -cvf products.tar.gz products/

    ```


    Suppose you have already copied all the tar files and the `Data.fs.old` to a directory
    called `PloneBackup`. Next, you tar all that into one file and copy it from your
    server by using the following command:


    ```

    tar -cvf BackupNameDate.tar.gz PloneBackup/

    ```


    This creates a full backup of the Plone site. Your final step for safety would
    be to copy that down using FTP or SSH (whichever is appropriate to your setup).
    Store that archive off of the server for restoration purposes.


    # Restoration


    If you need to restore, first shut down Plone using the following command to stop
    Plone from running:


    ```

    ./bin/plonectl stop

    ```


    Next, run the tar -xvf archive.tar file to extract the files. Overwrite the respective
    file locations with the backup data. You need to rename `Data.fs.old` to `Data.fs`
    for it to work on the live site.


    Following are some advanced resources to assist you in developing a more robust
    backup and restore process. Some of these address the capability to do incremental,
    full, and snapshot backups.


    +   - http://plone.org/documentation/kb/backup-plone

    +   - http://pypi.python.org/pypi/collective.recipe.backup#easy-zope-backup-restore-recipe-for-buildout

    +   - http://ingewib.sourceforge.net/Products/PloneMaintenance/


    # Drupal Backup and Restoration


    The Backup and Migrate module is an excellent choice for backup and restoration
    in Drupal. You can find it at drupal.org/project/backup_migrate.


    This particular module is very powerful and feature-rich. It was contributed to
    the Drupal community by Ronan Dowling of Gorton Studios. Using this module in
    combination with Drupal’s Backup and Migrate Files option will'
