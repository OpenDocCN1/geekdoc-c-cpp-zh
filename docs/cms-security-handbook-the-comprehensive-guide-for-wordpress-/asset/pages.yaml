  md: "# Updating the Drupal Core\n\nDrupal stores the pertinent parts of the site\
    \ that make your Drupal installation uniquely yours in the database and the sites\
    \ folder. To update the Drupal core, follow these steps:\n\n+   1. To begin, log\
    \ in and visit the reports section of your site. You can navigate there, or you\
    \ can simply type in the URL `www.yoursite.com/admin/reports/updates`. A screen\
    \ similar to that in Figure 7-13 appears. In this example, the Drupal core is\
    \ at version 6.19, and it’s reporting that a 6.20 version is available.\n\n![](img/8bd670d4939cf71dbd0c6123d1b834ff_272_0.png)\n\
    \n**Figure 7-13:** Available updates screen\n\n+   2. Click the Download button\
    \ in the lower right of the screen, which will download the latest version for\
    \ this release, and unzip the downloaded file onto your machine.\n+   \n+   3.\
    \ Navigate to `yoursite.com/admin/settings/site-maintenance`. Note that this is\
    \ in Online mode. Switch your site to Offline mode, as shown in Figure 7-14. Place\
    \ an appropriate message in the box, click the Off-Line radio button, and then\
    \ click Save Configuration at the bottom of the screen.\n+   \n+   4. Navigate\
    \ over to `yoursite.com/admin/build/themes` and enable a default theme such as\
    \ the Garland theme. You will reassign the theme after the upgrade.\n+   \n+ \
    \  5. The Drupal modules list will be the next area of focus. Navigate to `yoursite.com/admin/build/modules/list`.\
    \ There you’ll see listed all the installed modules, along with the core installed\
    \ modules. Make a list of the contributed modules, which are any modules that\
    \ are not part of the core."
