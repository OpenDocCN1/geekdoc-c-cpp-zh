  md: 'option to not be selected. With this box unchecked, only the last 24 hours
    of log files are saved.


    Also note that the Raw Log Manager example shown in Figure 8-21 lists previously
    archived logs for salusAlerting.com. Here you can click those and download them,
    review them, or just delete them.


    If you want only one month of logs, then select the option to "Remove the previous
    month''s archived logs from your home directory at the end of each month" (see
    Figure 8-21). This option deletes the old logs for you.


    Using cPanel or another type of hosting control may be far easier for you if you
    have a small web site than using logrotate. Additionally, if you do not have SSH
    access, you must depend on the hosting control system.


    # Summary


    Log files are the historical record of your site. Like other historical documents,
    they can have great value. This chapter explains the need for keeping logs. It
    also explores the common log format and combined log format.


    By reviewing an FTP log and a standard Apache log, you have the capability of
    keeping tabs on your traffic.


    Tools like SysHunt and AWStats are available to help you make sense of log files,
    as well as to find trends, keep tabs on potential attacks, and track bandwidth.


    Log rotation is a good means to keep your unwieldy logs under control. The three
    methods explored in this chapter were through WHM, manually crafting a logrotate
    configuration, and using cPanel for shared hosting.


    Always keep an eye on your logs and put a plan in place to copy them offline.
    In Chapter 9, you will learn about the ins and outs of recovering from a hacker
    attack. Within your server, you have a web server, e-mail, FTP, and more. Once
    an intruder breaks through to your site, your cleanup should be your top priority.
    Chapter 9 takes you on an in-depth tour of that process.'
