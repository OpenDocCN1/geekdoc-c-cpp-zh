- pgno: 52
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_52_0.png)


    **Figure 1-9:** Locating physical addresses on Wigle.net


    # How Will You Respond to an Incident?


    According to an August 2010 survey in *InformationWeek* magazine, 17 percent of
    those surveyed did not have a disaster-recovery plan. Businesses often cite that
    they do not have a plan for various reasons, such as *lack of resources*, or they
    find it too difficult. Other reasons given by these businesses include the fact
    that they were “not sure where to start,” “we’re too small,” or “we have backups.”
    You should have a disaster-recovery plan no matter what size your business is.
    If you’re a very small company, then, clearly, formulating a disaster-recovery
    plan should be easy.


    Of course, the types of potential disasters vary with different businesses. For
    example, you may feel that you are immune from natural disasters because your
    data center is safely tucked away from you. You may want to rethink that view.
    For example, you may think that earthquakes only occur on the West Coast, but
    you may be surprised to discover that, according to the U.S. Small Business Administration,
    earthquakes have also occurred in Mississippi, Missouri, Arkansas, Illinois, Tennessee,
    and South Carolina. Consider the impact to you if your data center were hit by
    an earthquake.


    Chapter 6 works through how to put together an entire disaster-recovery plan.
    However, in the context of this discussion on assessing your security risks, let’s
    take a look at some important preliminary questions you should answer.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# ## Does Your Plan Exist?


    "Does your plan exist?" is a simple “yes” or “no” question. Your plan can be something
    as simple as a set of steps on a yellow pad of paper. It can be as complex as
    a full-blown effort designed for a small to medium-sized business.


    If your plan does not exist, or rather if you have no plan at all, then developing
    one will take some time to complete. The plan should be comprehensive, yet easy
    enough to follow.


    The reason for the ease of use is twofold:


    +   - During a disaster, stress and other factors lower a human’s capacity for
    rational thought. Messaging is best done at lower reading levels that are easy
    to mentally understand.

    +   - In the event an untrained person must take the reins and follow the plan
    through, it should be clear.


    # ## Is the Plan Up to Date?


    Suppose you have some plan or even a full-blown plan. Check the dates to see when
    it was last updated. A good recovery plan should be updated every six months,
    and no more than year should pass between updates. The reason is that new threats
    arise all the time. Changes in your business, your systems, and your personnel
    are always in flux. Capturing those changes quarterly or semi-annually keeps a
    surprise away when you need the plan.


    Items you want to look for (also known as deltas) are things that can sneak up
    on you because they changed or were added without your knowledge. These include
    the following:


    +   - *New versions of an application suite* — Do you need or have the license
    keys for restoration?

    +   - *Updated operating systems on your desktops and server(s)* — Perhaps you
    haven’t changed the operating system in a while, and when you do, it changes the
    procedures. Capture these changes in your disaster-recovery documentation.

    +   - *Changes in support policies of an important piece of software* — Maybe
    the person or company who did the development has gone out of business. The great
    part about open source code is that you can bring a developer in to change and
    update your application stack. But again, when those changes are made, then update
    the documentation.


    Be careful of the downstream effect. An example is Joomla! 1.5 versus Joomla!
    1.6. These two versions share a lot of similar functionality, but keep in mind
    that the screens are different. The procedures for doing things are very different.'
  merge: -1
  img_proc: true
