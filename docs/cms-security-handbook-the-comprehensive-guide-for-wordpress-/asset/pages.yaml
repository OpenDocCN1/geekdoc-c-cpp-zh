- pgno: 55
  md: '# Summary


    Planning for and executing a good operational plan for your website and business
    will keep your business going. In this chapter, you learned about the various
    components that comprise small and medium business site operations. The importance
    of viewing yourself through the eyes of hackers can give you a sense of where
    you are weak.


    The various tools discussed (such as NMAP and traceroute) represent some of the
    many fine tools available to defend yourself.


    Disasters or outages do happen, even though your site may be at a very reputable
    host. Planning in advance for these events will keep you prepared for the day
    you need it.


    Chapter 2 guides you through how to choose a good hosting provider.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Choosing the Right

    Hosting Company


    Choosing the proper hosting for your website or business is akin to selecting
    a place to live. You may seek a certain part of town that has lots of entertainment,
    or specific services. You may wish for a quiet home on a nice parcel of land in
    the country. If you have school-aged children, you will likely want access to
    the best schools in the area.


    Each of these choices is as individual as you are, yet they share a key attribute
    that crosses all these boundaries. You want a place to live that is safe and secure.
    Safety in our residence is what we all want.


    This chapter provides an abundance of information that will enable you to make
    the right choice for your particular hosting needs. Making the right hosting choice
    for your website is vital. Your website or web application may be the only interaction
    a customer has with you. Making that good first impression is key to having a
    second interaction, a third one, and so on. Settling for a poor hosting company
    may result in downtime, hacked servers, or spotty service, which will result in
    loss of customer satisfaction.


    The goal of this chapter is to educate you with an insider’s view of hosting —
    the good and the not so good. Making you a smarter customer will ensure that you
    make the right choice for hosting.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# ## Types of Hosting Available


    To continue with the analogy of living arrangements, you have many different choices
    for where you want to live. You could rent an apartment, flat, or town-house,
    or you could buy a condominium or a house.


    Let''s compare different types of home choices to website hosting. Table 2-1 provides
    you with a metaphorical comparison for residences and website hosting. For example,
    shared hosting is like renting an apartment — you are not responsible for much,
    other than your own dwelling. Yet, a dedicated server is like owning a home —
    you must take care of it all.


    **Table 2-1: Simple Comparison of Residences and Hosting Equivalents**


    | RESIDENCE | WEBSITE HOSTING EQUIVALENT |

    | --- | --- |

    | Apartments (multifamily) | Shared hosting |

    | Condominium/Town homes | Virtual Private Server (VPS) |

    | Owning your own home | Dedicated server |

    | Spectacular time share | Cloud hosting (for example, Amazon) |


    This section begins with an overview of basic concepts, and then digs into some
    areas that sales web pages do not tell you about hosting companies. Various types
    of hosting are available to choose from, including the following:


    +   - Shared hosting

    +   - Virtual Private Server (VPS)

    +   - Dedicated server

    +   - Cloud hosting


    # ### Shared Hosting


    Today''s average server hardware has much more power than most users consume.
    *Shared hosting* spreads both the cost and the user load out over many clients
    in order to make it affordable. The hosting company can put more people on a single
    box, lowering its cost.


    With shared hosting, your website is being served off of a single server, along
    with many other web clients. Although many websites share the hardware, they live
    in their own *partitions* — much like an apartment unit.


    With a properly configured web server, one client cannot see any other clients
    on the system. The host will maintain the machine, the core operating system,
    and web server components. The site owner need only worry about running his or
    her business, and maintaining his or her site.'
  merge: -1
  img_proc: true
- pgno: 58
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The capacity of the machine will be used to measure out what you are allowed
    to consume. In other words, if you exceed a specific load limit on the machine,
    the host will ask you to purchase either more resources, or to move to a different
    plan.


    When you move to a VPS, you can expect a much higher per-month cost than shared
    hosting. You will need to have more technical skill to operate and maintain it
    than you would with shared hosting. The monthly costs typically start at $12.00
    per month and up.


    Following are some considerations to keep in mind for a VPS:


    +   - Monthly or annual costs will be higher.

    +   - The administrator will need more technical skill than is needed for shared
    hosting.

    +   - A crash or loss of the physical machine will likely will bring down your
    site. (However, some exceptions do apply.)

    +   - A VPS is generally more secure than common shared hosting.

    +   - You have the capability to configure the “virtual” machine in any manner
    you want.

    +   - A wide range of control panel choices is available.

    +   - The physical machine will be shared across many clients. Thus, resources
    will be allocated over a large pool of sites. However, it typically contains many
    fewer clients per machine than with shared hosting.

    +   - You have more memory, CPU, and disk space available.

    +   - Backup of your server and sites data will be your responsibility.


    # Dedicated Server


    The dedicated server in its most basic form is one you rent or buy, and place
    into a co-location facility. You can rent a dedicated machine from a hosting company
    as well. The dedicated server has the highest cost and highest maintenance requirement.
    However, this option is also the most flexible.


    The dedicated server means that you are the only one on the machine. You do not
    share the resources, nor do you have to worry about another site on the server
    being hacked and exposing you to attack. The dedicated box is one you should choose
    if you have a very busy site, or if you are concerned about security and uptime.


    Security for a VPS and dedicated server is typically comparable. In some situations,
    you might have slightly more control over the security of a dedicated server versus
    a VPS.


    You can expect to pay anywhere from $70.00 a month all the way to $500 to $600
    a month, depending on the provider and the configuration.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Following are some considerations to keep in mind for a dedicated server:


    +   - You will most likely be required to perform administrative tasks.

    +   - Use of a dedicated server requires a comprehensive disaster plan.

    +   - Typically, this is by far the most expensive of options.

    +   - A dedicated server can provide you with a great deal of computing power.

    +   - If you have purchased your machine, keep in mind that hardware ages, and
    must be replaced over time.


    # Cloud Hosting


    Cloud hosting is a popular technology model. It has been gaining a lot of press
    attention and seems very sexy. The basic concept is very much like a United States
    electrical grid, where many power companies provide electricity to the grid. As
    the consumer, you can consume as little or as much power as you need. You pay
    only for what you consume.


    This model has a lot of promise for sites that may experience uneven or spiky
    traffic. Retail sites at Christmas time see a lot of traffic spikes. With cloud
    hosting (such as that sold by Amazon or Rackspace Cloud), increasing the capacity
    on demand is simple — thus providing more resources to the web visitors.


    As with all technology, cloud hosting has a dark side. The biggest concern with
    cloud computing is security, with privacy of the data following very closely behind.


    > > **NOTE** If cloud computing is an area you are interested in using, review
    the **Cloud Security Alliance** guidance document at www.cloudsecurityalliance.org/.
    This security guide will help you get on the right track before you start.


    If you are choosing cloud hosting because it''s "hot" or it''s what the technical
    guy told you to buy, keep in mind the following considerations for cloud computing
    before buying:


    +   - Although not necessarily a new concept, cloud computing is new enough in
    this application that administrators are facing "old" problems as if they were
    new.

    +   - You should understand the billing model and rates before buying. Not understanding
    the individual costs might cause you to end up with a surprisingly large bill.

    +   - If you are handling or storing credit card data, be sure your cloud provider
    is able to prove compliance with Payment Card Industry (PCI) requirements.

    +   - Failures are no longer as big of a deal. A failed server in a cloud will
    not take down the whole grid.

    +   - Plan for data security — it is by far the biggest risk your business will
    face.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Security of Data in a Cloud


    Data must be secured when not in use. It has the potential to be moved (or stay
    in motion) in a cloud. You should determine how your cloud vendor does this. Here
    are some considerations:


    +   - If data is moved, it must be moved securely, and not intermixed with other
    client’s data.

    +   - Hackers can run with wild abandon through sites on a cloud if the cloud
    is not properly secured.

    +   - Ask your host how you can access and audit your logs.

    +   - Just because you are on a cloud doesn’t mean you are backed up. Data loss
    is still data loss. Be sure you have a documented means to restore data.

    +   - You should review and understand the contractual obligations from your cloud
    host provider. Carefully review areas such as uptime and the aforementioned privacy
    concerns in order to understand the obligations of each party.


    > **NOTE** For a detailed review of cloud computing, check out the book *Cloud
    Computing: Implementation, Management, and Security* (Boca Raton, FL: CRC Press,
    2010) by John Rittinghouse and James Ramez. Rittinghouse and Ransome are highly
    regarded experts in the field of security, and, in particular, the area of cloud
    computing security. Additionally, you may refer to, *Cloud Security: A Comprehensive
    Guide to Secure Cloud Computing*, by Ronald L. Krutz and Russell Dean Vines (Indianapolis:
    Wiley, 2010).


    # Selecting the Right Hosting Option


    Choosing a hosting provider and a plan can be a bewildering experience. You don’t
    want to buy too little or pay too much. Add in the fact that technological capabilities
    are always changing, often increasing potential while dropping costs, thus making
    your entry point a tough decision. You may be wondering what direction you should
    go, or even whether you are on the right path. The only constant with technology
    is that it’s always changing.


    Let’s take a look at how you can choose the right hosting for your situation.


    # Budget Considerations


    To be in business today most likely means that you need a website. Very few exceptions
    to that rule exist. Spending a few dollars or hundreds of millions of dollars
    a year on a website is a business and budget decision. As a business owner, you
    can have your site online for as little as $75 a year, including the'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'domain name and website. Establishing a budget is really driven by your business
    needs.


    The first part of your budget you may want to establish is *domain names*. Several
    top-level domains are available — .com, .org, .net, and even the new .co. Many
    more exist for various countries and specific applications such as .mobi.


    Determine how many top-level domains you need beyond your normal choice — such
    as example.org or example.mobi. Each of these carries with it an annual commitment
    cost of registration. Depending on your registrar, you may pay from $9.00 a year
    or more. Remember, this does not include any extras, such as private registration
    and other domain-related services.


    Of course, you’ll be hosting some or all of these, and the costs per month or
    year must be calculated in. You can get barebones hosting starting at $4.00 to
    $5.00 per month, or go for premium, affordably priced hosting at a company such
    as Rochen.com or LunarPages.com all the way up to a dedicated server, which can
    run you hundreds of dollars a month. Determining this cost is solely based on
    your requirements, and then you find a host that meets the requirements within
    your budget.


    Many software packages have annual license maintenance costs, which should be
    disclosed to you before you purchase any package. Although nothing is wrong with
    an annual software license, be sure that you understand what the license fee is
    for.


    Going hand in hand with license costs is support costs. Some hosts charge an extra
    fee for assistance on a dedicated box, outside of the hardware and base operating
    system install. This value-added service is never cheap.


    Choosing to physically own the hardware incurs not only the costs to acquire the
    machine, but the costs of repair as well. Factor in the warranty costs and the
    out-of-warranty costs of buying a machine. Include in that extra cabling, minor
    items (such as mounting it in a rack), and other miscellaneous items you’ll need.


    If you are conducting any type of e-commerce transactions, you’ll need to purchase
    an *SSL certificate*. This cost starts at just under $30 and increases from there.
    Renewing the certification has an annual cost.


    Developing a budget around an open source CMS such as Joomla! or Drupal can fool
    you into thinking that development for the CMS should be at or near zero. Do not
    mistake the fact that the framework is free with the costs to develop graphics,
    code, or setup of these platforms. The lure of open source is the capability to
    get inexpensively. Don’t fall into the trap of wanting an easy .com clone and
    setting it budget of $200. Believe it or not, that sort of nonsense is a rampant
    on freelance development sites.


    The costs of development include the expertise and the time it takes. After those
    costs are settled, and your project is complete with your site running, you’ll
    have a cost of maintaining the content. This maintenance can be done by an administrator-type
    person who makes the changes, or it can be a team. It all depends on your site.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The best way to keep these costs under control is to do lot of paper exercises
    in both function and form, as well as proposed content. The costs tend to rise
    if you suddenly find a project switching in mid-design. You can determine additional
    financial considerations by asking whether the changes in the future will be programming-based,
    or can be done some by other means. By identifying your goal, you’ll be more likely
    to stay within your financial boundaries.


    One other hidden charge you do not want to encounter is the maintenance of the
    code. Suppose that after testing, it seems fine, but after it’s in production,
    it has a few bugs that make it difficult to use. Set out in advance how those
    things are handled. Do not expect the developer to continue developing and fixing
    bugs forever.


    When putting together your technology budget, include items such as CD-ROMs and
    a CD burner to store your backup data. Or if you want to use Flash drives, then
    add that cost in. Factor in the cost for a fireproof safe, or a safety deposit
    box to store your data backups in.


    Surprise changes such as restoration of files may have a large price tag. Check
    with your hosting company to find out the cost for restoring a backup. You may
    be shocked at the cost and turnaround time for the hosting company to do a restoration.


    Other costs to consider are any fees that may creep in the mix, including various
    business services a host may offer, such as search engine optimizing (SEO) of
    your site, validation of your domain, and other value-added services.


    # Determining the Appropriate Server Size


    Most (if not all) hosting plans described here will suffice for many small to
    medium applications. However, as applications grow in power, and, hopefully, as
    your site grows in popularity, you must keep in mind a few sizing rules. The sizing
    of the application is complex, and will not necessarily be tied to the number
    of users, but rather the load that is required per user.


    Let’s begin this analysis by defining a few basic items common to any website/hosting
    platform.


    All computers use *random-access memory* (RAM), and servers tend to require more
    RAM because of the higher load they take on. Currently, RAM is measured in gigabytes
    (GB). Typically, the more RAM a system has, the better it performs.


    The analog to RAM is *hard drives*, which perform the long-term storage of data.
    The measuring stick for hard drives is *disk space*, and it will be listed as
    gigabytes, and soon you’ll see it listed in *terabytes* (TB). Note that 1,000GB
    equals 1TB.


    The CPU is the heart of any computer. It is the computer chip that is measured
    traditionally by speed. Today you see advertisements for dual, quad, or hex core
    CPUs. The designations indicate how many CPUs are present. Note that the speed
    and other technical specifications present. Taking these specs into account is
    important. For example, you may see “CPU: Intel Core 2 Quad — 2.50 GHz,”'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'which means that it has four CPUs working. This particular system would be
    a great workhorse.


    Although it’s not listed in most traditional hosting plans, redundancy is a consideration
    for performance and uptime. Many servers have a “dual-drive” mirrored system,
    which means that it utilizes two disk drives. If one fails, then the other has
    a copy of the data. Although that setup is perfect for safety, keep in mind that
    you are only reading and writing data (there’s lots of reading and writing that
    happens) to a single drive. Thus, if your site is a medium or heavy transaction
    site (such as a heavily trafficked forum site, or an e-commerce site that has
    many people writing data), you’ll incur a performance penalty while waiting on
    the drive to complete the writes to the disk. Stated quite simply, more hard drives
    working tend to cause the entire system to perform better.


    *Bandwidth* is a measure of the amount of data transfer to and from your server.
    For example, every time someone visits your home page, you consume a certain amount
    of bandwidth. That measure is calculated in a peak period using a measurement
    called the *95th Percentile*. This means that you can consume bandwidth as needed
    as long as you remain below an average “peak” level over the month.


    Now that the basics have been covered, take a look at some example scenarios and
    how to estimate them.


    > **NOTE 3** Cloud computing is not covered in these models.


    # Case 1: Light Website Traffic (Shared Hosting)


    Case 1 entails a small website acting as a placeholder for a business, consisting
    of approximately ten total pages. Traffic is light, around 200 to 250 visitors
    a month. In this example, the obvious choice would be the smallest shared hosting
    plan your web host offers. There is no need for more. This server can easily be
    offline for maintenance and not impact the business.


    This website would require an external backup. For the cost of this type of site,
    the host will not be handling the backup. However, the host will maintain the
    operating system and associated parts.


    As an administrator of a shared hosting website, you need a very basic understanding
    of hosting applications such cPanel or WHM and other control panel systems. You
    must have a light level of knowledge for setting up your database. Three of the
    four CMSs this book focuses on requires a database.


    Communications with the server are typically done through a protocol known as
    *file transfer protocol (FTP)*. Using an FTP client such as FileZilla will be
    a normal and possibly daily task.


    Backing up your site will rest squarely on your shoulders, with few exceptions.
    Learning to use the available backup tools from your host will save you on the
    day you need it.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Finally, you must learn the skill of patching your site and keeping it safe
    from hackers targeting any of the site’s weaknesses.


    # ## Case 2: Medium Website Traffic (VPS)


    For this example, this medium-trafficked site hosts a popular forum discussing
    hot political topics of the day. It hosts a fair amount of graphics and text.
    The site administrator will need to monitor the bandwidth to avoid overage charges.
    Traffic is 50,000 to 70,000 visitors a month. Security is a concern here because
    of the fact that the site was hacked on a shared hosting account when the business
    first started. The business also needs more control over the server environment.
    This site’s primary source of revenue is advertising displayed on the site. For
    this client, a VPS would be in order.


    With virtual systems, the bigger concern is the amount of RAM that is on the system,
    because most modern servers have more CPU power than they normally use. In a VPS
    or any virtual system, the more RAM you install on the physical server, the better
    it can perform. As a result, costs will be much higher than traditional shared
    hosting. This system will be equipped with 12GB to 16GB of RAM.


    The administrative skills needed on a VPS could be higher, depending on the hosting
    company of choice. For example, Rochen.com offers a great deal of support for
    its virtual server offering. Other hosting providers may offer the same, more,
    or less. Take this into consideration as you shop. Choosing a fully managed provider
    will take care of a lot of issues surrounding server management.


    If you are tasked with caring for your VPS, then the skill set should include
    the same as needed for shared hosting, as well as a few additional skills. These
    skills could include light management of your firewall, scripting for your mod_security
    or ConfigServer and firewall applications. You’ll need some command-line Linux
    skills (or the equivalent Windows skills), as well as knowledge of using the Secure
    Shell (SSH) protocol. This is a safer means to connect to your server than FTP.
    Tools such as PuTTY or WinSCP are two popular choices for SSH.


    Lastly, you’ll want to gain some knowledge of using phpMyAdmin to manage your
    databases. The time may come where you have to edit or change items in the database.
    This is the best method to do so, unless you are a database administrator and
    can use advanced command-line skills.


    The good news is that, with most VPS offerings, the technical support group is
    there to assist you.


    # ## Case 3: Heavy Website Traffic


    The example website for a heavy website traffic scenario is a revenue-generating
    site that distributes training videos on demand. This popular site'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'serves around 250,000 unique visitors a month. They consume more than 1TB to
    1.5TB of bandwidth a month. Given that the site runs 24 hours a day, 7 days a
    week, the business has little room for downtime, and it needs maximum performance.


    The optimal solution for this client would be a pair of machines, with one acting
    as the primary server. The other machine would be available for development, and
    would contain a copy of the first system. In the event of an outage, the second
    system would be put into action. One budgetary consideration here is that the
    host is doing minimal maintenance of this system.


    This solution requires a dedicated server and a trained administrator. Most hosting
    companies will assist with the software, but for a fee. This is based on the fact
    that, as a dedicated client, you are expected to know how to administer a server.
    The tasks at a high level are configuration and updating of the server, which
    sounds simple in a point-and-click world, but in a Linux world means that being
    able to perform several difficult tasks is required, including the installation
    and configuration of PHP, Ruby, Python, Perl, and various other compiler and software
    tools.


    Installation and configuration of your Apache web server, log file rotations,
    and various other features are not trivial tasks, nor is the setup of your MySQL
    database server. In most cases, these are handled at a command-line prompt using
    SSH.


    Security is an area the administrator of this machine would spend a great deal
    of time on. Setting up the various layers of protection requires a strong knowledge
    of the tools and, in some cases, scripting. Because your dedicated server may
    likely be running a Secure Sockets Layer (SSL) certificate, the administrator
    will need to configure and install the certificate.


    Having a dedicated machine usually implies a dedicated person with the proper
    skill set and trustworthiness to be operating at the innermost levels of your
    business operations.


    # Using Backups


    These generic work models have provided you with a view of each of the needed
    skills. One common task across all the models is the need to back up the data
    to an offsite location. That can be as simple as using a tape or CD-ROM. Or it
    could be a commercial solution such as www . AkeebaBackup . com that does the
    backup to an offsite cloud.


    In all cases, depending on the host, performance of the website during backups
    may be impacted. Find out how the host conducts backups and ask about the effect
    on the performance of your site. Remember, in all cases, it’s your data, and it’s
    your responsibility to ensure that it is backed up — no matter what.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # What to Look for in Web Host Security


    Choosing a hosting company does not typically require a multi-year agreement.
    Generally speaking, the fees for web hosting are charged on a monthly basis. Co-location
    might be an annual commitment, but typically, terms are included that allow you
    to break the agreement. Even so, choosing the wrong company for your hosting needs
    could be costly.


    This section examines a topic of growing importance—security. When selecting a
    host, you want to have a clear understanding of the finer points that are not
    typically considered. This discussion is broken down into the following topics:


    +   - Physical security

    +   - Cyber security

    +   - Environmental support


    Each of these shares common ground and can clearly have an impact on each other.


    # ## Physical Security


    The phrase *physical security* likely conjures up mental images of contract security
    guards on patrol, or the guard in the lobby of a business admitting visitors.
    The truth is that these are examples of the physical security of a hosting company,
    but there is much more to security in your hosting company.


    # ### Glass Windows


    Let’s start with the simple example of the building in which the host is located.
    Many areas could be a huge concern. If you tour a web host or co-location facility,
    make note of your surroundings. Does it have glass windows in the building allowing
    light, heat, and prying eyes into the data center?


    Of concern with glass in a data center would be things like the temperature of
    the building. Glass tends to let heat in via solar radiation. If your data center
    resides in the Southwest region of the United States, then it will be subjected
    to high temperatures during the long summer months. This can impact the cooling
    capacity of the building. The high temperatures would make the cooling systems
    work harder, costing more, and creating potentially more maintenance for the air-conditioning
    systems. Higher temperatures in the data center caused by the addition of an unwanted
    heat source is not a good alternative.


    Additional concerns abound regarding secrecy of data. In one real-world case,
    a private data center had windows. Located on the front of the rack was the username
    and password for a specific system, which was visible from the outside.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Civil unrest in a populated city is also a concern. The unrest could result
    in a brick, fire bomb, or other incendiary device being tossed through the glass
    windows into the data center.


    The forces of nature can also raise concerns. One threat that people in the Southwest
    and Midwest tend to live with is tornadoes. The building might be rated for a
    F5 tornado, but flying debris will break through the glass windows, potentially
    causing unnecessary damage to systems in the data center.


    One final minor consideration is the cost to upkeep the hosting company’s building.
    Windows leak air, get dirty, and get broken. All these things require maintenance,
    which is a cost. That cost is not absorbed by the hosting company, but rather
    trickles its way down to you.


    # Flooding


    Water in the forms of rivers or streams tends to be part of the reality of many
    landscapes. When water levels rise, the water occasionally gets into buildings
    — especially those built in a flood zone. Some areas are thought to flood only
    every 500 years, others every 100 years, and some when it rains for only a few
    days.


    Asking the hosting company about its building’s proximity to flooding areas is
    wise. If the company is located in a flood zone, ask when the last time the water
    approached, and ask how high it got. Check out the U.S. Government’s database
    on flood data at http://msc.fema.gov.


    # Signs


    People are often inundated with marketing messages, and building signs are no
    different. Although marketing may be vital to your success, advertising a data
    center with big splashy signs may not be the best idea. To be fair, a dedicated
    attacker will take the time to locate a facility, even if it’s a non-descript,
    concrete building. Making a security breach easier for the attacker by providing
    lots of signage pointing the way is not a great idea.


    # People


    Like any business, hosting facilities will admit a lot of visitors and guests
    for various reasons. Your due diligence should include an understanding of the
    types of controls put in place for monitoring visitors and guests.


    Entries are the only legitimate ingress and egress from a building. Controlling
    those is of primary importance to perimeter security. Find out what processes
    are in place for check-in and check-out to the building. Are they escorted? Do
    they require a government-issued photo ID? Will the photo ID be retained during
    their visits? Although low-tech, these types of controls are highly effective
    at deterring bad guys.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'One common means of entrance to a facility is what’s known as a *man trap*.
    A man trap is a dual-door room that typically requires a key to enter, and another
    key or permission to enter the main room. Literally, it traps you in this room.
    The idea is that, if you get into one door, the second one is locked. Most data
    centers operate some form of a man trap to help control the flow of traffic in
    and out of sensitive areas. Other technologies may include some form of biometric
    scanning.


    Patrolling guards are also a strong deterrent to crime. If you are headed toward
    a co-location facility, ask about how the company handles the monitoring of the
    data center floor, the perimeter, cameras, and so on. Some smaller facilities
    may be lightly staffed, with only a few guards having to watch the door, attend
    to unlocking cabinets, or attending to client needs. This is where adding in the
    strong authentication and deterrent systems comes in handy.


    Many cyber breaches occur from insiders who use their knowledge to attack the
    data in the servers. Insider attacks typically rank at or near the top of many
    breaches. As a client, you have the right (and duty to your company) to ask about
    criminal background checks. While a mistake in the past should not prohibit a
    person from obtaining work, it should be a factor in the employment. In other
    words, if an employee has a history of risky behavior, then no guarantee exists
    that the employee will not still be a risk. Find out what background checks are
    performed. If you have any doubt about the legal right to ask this question, check
    with your legal counsel.


    # Dumpster Diving and Social Engineering


    Employees (and people, in general) tend to leak information. One big area of concern
    is the disposal of private information on hard drives, paper, and CD-ROMs. These
    are great sources of information. If you are touring hosting facilities, make
    note of whether you see locking recycle or destruction bins for paper and CDs.
    The careless disposal of customer lists and account numbers has resulted in security
    breaches, theft, and more.


    If you are hosting with a company, feel free to ask how that company decommissions
    disk drives. If the drive cannot be repaired and completely wiped, then it should
    be sent to an authorized destruction facility where it will be ground up.


    One of the more simple ways to break into a company is through the front door
    during working hours. This does not mean “tailgating” in behind someone, which
    is an issue for sure. However, in this case, it means asking for information.
    As noted in Chapter 1, social engineering is one of the more powerful ways to
    gain knowledge about a company. Find out from your host about its training procedures
    for the prevention of social engineering intrusions.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Breach Response


    Hopefully, you won’t be the victim of a break-in at your data center or host.
    But it can happen, so ask your host what the procedures are for dealing with it.
    Discover in your discussions what the processes are for cleanup and ensuring that
    no criminal activity happened to your equipment or website.


    # Terrorists


    The world we live in today must grapple with terrorism. The challenge with terrorism
    is that it’s not dealt with swiftly, it tends to grow and change. Tactics shift,
    and terrorists tend to become bolder and more aggressive. Businesses of all types
    are probably working on (or amending existing) plans to account for this new threat.


    Hosting companies are a unique target because they may experience hacktivism or
    hacking for a political cause as a form of terrorist attack. The host may also
    be subjected to a physical assault such as a bomb threat. Asking about the host’s
    contingency plans is fair, but do not expect full disclosure. You mainly want
    to gain a sense of the host’s level of planning.


    # Access to Equipment


    In most (if not all) cases, physical access to machines should be limited. Inquire
    as to who has access to your equipment or the server your machine is on, when
    and why they have access, and how this access is granted. In a shared hosting
    situation, you have zero say as to how this is handled. In a co-location situation
    you should have 100 percent control over the access to the machine.


    # Water Detection


    Data centers typically have a raised floor with removable tiles composing the
    flooring. This gives access to underfloor cabling, power, and other supporting
    infrastructure needs. Occasionally, cooling is routed underfloor to the cabinets.
    In researching your host or co-location facility, ask about water-detection sensors
    under the raised floor. One broken water pipe could ruin your day. Rest assured
    that this safeguard is pretty typical for most modern installations.


    # Fire Suppression


    If a fire does occur, then putting it out as quickly as possible is clearly the
    only correct action. In your research, you may hear a few terms such as *pre-action*,
    *dry pipe*, and *wet pipe*, and, in some cases, you may hear Halon. All of these
    are'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'different types of fire extinguishing systems, and are governed by the local
    laws and jurisdictions of the townships in which the buildings are located.


    > > **NOTE** Note that Halon is likely not in use in any modern hosting facilities.


    # Emergency Procedures


    In an emergency, people, not your business, matter most. The websites, servers,
    data, and the building are secondary to human safety. In this regard, you want
    to have a high-level understanding of the procedures used to protect the people.


    After the threat has passed, then all the websites and servers should be the primary
    focus. Assuming that the emergency brought your sites down, then you’ll want an
    idea of the time that it will take (either hours or days) for service to be restored.
    Knowing this, you can measure your tolerance for downtime in your business against
    the projected time.


    Reasons for an emergency evacuation could be fire, flood, tornado, earthquake,
    bomb threat, hurricane, or other unforeseen activities.


    # Disaster Recovery and Business Continuity


    As mentioned previously, in a shared hosting model, you are most likely 100 percent
    responsible for your backups. This means that even if the server fails and the
    hosting company replaces it, to restore your data, you must have a backup. Do
    not expect the hosting company to spend time discussing its disaster plans with
    you if you’re paying $3.99 per month. Build your own disaster-recovery plan.


    If you are co-locating or buying a dedicated server, then learning more about
    your host’s disaster planning and business continuity plans are paramount. Chapter
    6 covers this topic in detail. However, here are a few questions to get you started
    in your business conversations:


    +   - Where is your backup facility?

    +   - How often do you test your disaster plan?

    +   - Are the procedures updated after the tests?

    +   - How will you communicate with the host in a disaster situation?

    +   - Who should you call during a declared disaster? Will this be an internal
    person, or an external disaster recovery provider?

    +   - Will the external company levy a disaster declaration fee?

    +   - When was the last disaster declared?

    +   - If an evacuation is necessary, where does your staff operate from?

    +   - What is the Service Level Agreement (SLA) of the hosting company? Many hosting
    companies do not offer a lot in the way of guaranteed uptime.'
  merge: -1
  img_proc: true
- pgno: 72
  md: <!-- no content -->
