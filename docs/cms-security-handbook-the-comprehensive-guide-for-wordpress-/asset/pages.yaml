    # Error Logs


    By far, error logs are your most important source for spotting trouble. The error
    log is where your web server will send all information such as diagnostic messages
    and error messages. If you’re troubleshooting your server, this is the prime location
    to review for problems. The error log usually provides detailed information about
    the error and where the error is occurring.


    If you’re configuring a brand-new server, then reviewing the error logs will help
    you through any start-up errors. If a site is hacked, you might see the error
    log file filling up quickly with PHP or application errors. Reviewing those errors
    will lead you to the source of trouble in most cases.


    The name and location of the error log file is set in the Apache configuration
    in the ErrorLog Directive. When running a Linux system, the name is typically
    error_log. This can vary by the distribution of Linux, but identifying it shouldn’t
    be difficult.


    Error logs are broken down into four parts as follows:


    ```

    [Date] [Severity of error] [IP Address of client] [error message]

    ```


    Following is an example:


    ```

    [02-Sep-2010 21:27:01] PHP Warning: PHP Startup: Unable to load dynamic

    library ''/usr/local/lib/php/extensions/no-debug-non-zts-20090626/

    pdo_sqlite.so'' - /usr/local/lib/php/extensions/no-debug-non-zts-20090626

    /pdo_sqlite.so: undefined symbol: sqlite3_libversion in Unknown on line 0

    ```


    This error indicates an issue with the pdo_sqlite.so service.


    # Access Logs


    Access logs are highly useful for marketing, security, and general knowledge about
    your site. Access logs are typically located (by default) at /usr/local/apache/domlogs.
    (However, your location may vary.) If you take a look at that directory, you should
    see something like what is shown in Figure 8-1.'
