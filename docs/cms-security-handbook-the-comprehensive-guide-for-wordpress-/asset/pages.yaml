    the test, look first at the plan. Do not immediately lay blame on the employees.
    Fix the problems, identify the holes, update the plan, and carry on. |

    | Procedures | You will capture specific items here such as login procedures and
    other task-oriented processes. | Specific technologies will have specific procedures.
    These could be any number of systems, such as DNS, web servers, e-mail, VoIP,
