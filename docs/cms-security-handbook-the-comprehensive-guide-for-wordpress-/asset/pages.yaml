    site to a 4.xx site, then the possibility is very high that your add-ons won’t
    work. You should need upgraded add-ons, updating them before you start the actual
    Plone update is best.


    Plone and Zope run on Python. Thus, you must ensure that your new version of Plone
    is compatible with the version of Python you are running. If it requires a new
    version, then you’ll need to bring Python up to the correct level. Additionally,
    you may need some new or updated Python libraries.


    Because Plone is built on Zope, and Zope runs on Python, you might see a pattern.
    The following is the order in which they should be upgraded:


    +   - Python before Zope

    +   - Zope before Plone

    +   - Plone last


    The good news is that *usually* Plone will update Zope using its installer. Again,
    read all the current materials before you upgrade, specifically the `readme.txt`
    and other types of files that come with Plone.


    > **NOTE**  The Plone version used throughout this book is v4.02, but the instructions
    for upgrading are general to almost all versions of Plone.


    # Updating the Core and Add-Ons


    In regard to updating the core, each version presents a slightly different method
    to update. The following is a list of resources for Plone to guide you, depending
