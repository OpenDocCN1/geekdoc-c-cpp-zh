  md: 'with their direct reports. Further, managers must put into place the standards
    and controls to ensure employee compliance with this policy.


    # **Employee Responsibilities**


    The employee responsibilities section of your security policy will be specific
    to your environment, but should include coverage of several common areas that
    span across companies.


    Many systems in IT are simply communications tools, of one form or another. Therefore,
    at all times, the employee must observe a sense of decorum and professional behavior
    in his or her use of the IT systems.


    This policy should state that the employee has full responsibility for any file
    (text, music/audio, video, and so on) that he or she sends or uses with the company’s
    computer and network systems.


    In today’s electronically oriented society, stressing to employees what copyrighted
    materials are important. Ensure that copyrighted material is not unlawfully sent
    out or distributed using company resources. The idea that sharing a digital resource
    or wrong often tends to escape some employees. Your company could be on the hook
    financially for such behavior.


    Be sure that the employee is fully aware of company policies regarding the security
    of information such as price lists, customer lists, road map information, or anything
    else deemed confidential by the company.


    # **IT/Technical Staff Responsibilities**


    Be sure to cover the basic scope of your IT or technical staff’s mission. This
    includes the setting of technical security standards, such as virus scanning,
    spam filtering, and so on. You should also spell out how IT is also responsible
    for providing assistance as needed to the employees with regard to technology.


    # **Acceptable Use of Resources**


    Define for your staff what you will deem acceptable use of company resources.
    For example, web browsing for company purposes should be fine, whereas you may
    not want employees spending time on an auction site for personal use. Alternatively,
    you may not care. It’s all a matter of what you deem as acceptable.


    You may also want to clarify for your staff the appropriate use of e-mail and
    other communications tools. Do you care if they send personal e-mails over the
    company e-mail systems? If not, then state it. If you do care, ensure that you'
