- pgno: 73
  md: '+   - *Access logs* — These files can often be unwieldy because of their size,
    especially on an Apache web server. The process used to keep them at a manageable
    size is called *log rotation*. The access logs record all activity on your website,
    and can be used to reconstruct activity from a specific IP address. You’ll learn
    more about the Apache logs in Chapter 8.

    +   - *Firewall logs* — These can encompass many forms, depending on the hardware
    or the application. For example, for the CSF firewall software, these logs maintain
    a list of recent attacks. Keeping an eye on these logs will make you aware of
    failed attempts to get in. Remember, a successful attempt may appear as normal
    traffic.

    +   - *Hardware logs* — If you own a dedicated machine, you may have access to
    the hardware logging of the server box, which will provide many valuable data
    points — things such as temperature of the machine, information about the CPUs,
    or the speed of the fans. These logs can even tell you whether a hard drive is
    getting close to failing. Today’s hardware logging is very powerful. For what
    it’s worth, do not expect to get this type of logging in a hosting model.


    # Spam, Virus Scanning, and Prevention


    Another security front you want your host to be on top of is spam filtering, virus
    scanning, and prevention. These tasks can be done in a number of ways, depending
    on the operating system, the hosting company, and more. In fact, some companies
    will filter and clean your inbound and outbound mail for you in flight. That means
    that as mail reaches your infrastructure, it has been cleaned of viruses and spam.
    This method may be well worth looking at. Have your host explain how it prevents
    infections from outside sources such as e-mail.


    Many hosting companies take a hard line against hacked websites. They really have
    no choice in the matter. One hacked website can infect many others, both in the
    network and out in the wild. Find out what your host’s plan is if you were to
    be attacked.


    # Patching for Weaknesses


    Weakness and vulnerabilities appear daily in all types of software and hardware
    systems. Using services such as Sal vusAlerting.com, you can stay apprised of
    new vulnerabilities in a timely fashion. After these vulnerabilities are out in
    the open, then the attacks start up. Your host should have a process and a plan
    to apply patches according to priority. Hackers keep an eye on released vulnerabilities
    as well, and they will try to break into your site through a variety of means.
    Do not give them an opening by not patching.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# VoIP


    The Voice Over IP (VoIP) protocol allows telephone calls to be made on the Internet.
    It is also a very big threat to any infrastructure if not configured properly.
    VoIP traffic can travel over the same networks that the data runs on. Tools exist
    today to launch malicious attacks on VoIP. Ask the host whether it uses VoIP,
    and how it segments this protocol off from the rest of the network traffic.


    # Web Servers


    Enough cannot be said about maintaining your web applications. Today, a significant
    number of attacks occur at the web application layer—literally, at the website.
    In terms of your hosts, ensure that the easy-to-install items it offers (such
    as Joomla! or WordPress) are up to date. Many hosts do not keep versions of these
    ready-to-install applications up to date.


    Ask the web host how it protects shared servers from your neighbors. If you recall,
    the shared server actually is many websites on a single physical machine. If a
    hacker breaks into a neighboring site, he or she could affect your site.


    # Environmental Support


    Humidity in the great outdoors can sometimes be aggravating in the summer. In
    data centers, keeping humidity levels around 45 percent to 55 percent to maintain
    a low static-electricity environment is important.


    # Network Redundancy


    In the hosting world, the terms pipe, power, and ping refer to bandwidth, electricity,
    and connectivity to the Internet, respectively. Unless you are dealing with a
    company that only leases a few boxes, or has a “single-cabinet” in an office that
    it calls “hosting,” these items should be set up in a redundant fashion.


    The network includes the pipe and ping portion of the data center. A sales representative
    should be able to easily articulate to you what systems are in place to offer
    network redundancy. You should hear a few common answers here, such as redundant
    telecom providers for the main Internet trunks. Other redundancy systems may be
    known as load balancers, which can serve to route a failed connection in the event
    of an issue. To add another layer, routers should be able to fail over or be taken
    out of service for updates and maintenance without impacting the overall service
    level of the network. Find out from your prospective hosting company what the
    standard operating procedures are to ensure network uptime.


    An example of a host that may not be able to provide you a very good uptime is
    one who offers a single connection (or backbone) to the Internet. If a backbo'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'cuts the fiber to the host’s location, or if the route fails, you are down
    until that connection can be restored.


    # Electrical Service


    Electrical service is something you are no doubt familiar with. You simply expect
    it to be there. In a huge consumer like a host, several data points must be considered
    that underlie the host’s capability to maintain electrical service. These include
    the following:


    +   - Multiple electrical providers to the building

    +   - An onsite generator that supports a full load for long periods of time

    +   - The capability to support single or multiple electrical feeds per cabinet

    +   - On-premise emergency battery power


    Larger data centers often are serviced by more than one electrical provider. The
    area of the country you are in will dictate the number of providers. This is important
    because of outages. You may recall the August 2003 Northeastern U.S. blackout
    and the rolling blackouts in California. Data centers without redundant electrical
    providers may not be your best choice.


    If you are considering working with a small hosting provider or data center, find
    out what the limits per rack for power (amperage) are per the local city codes.
    The purpose of discovering this information is to see whether enough electricity
    (power measured in amps) will be available for your needs. Limiting racks to a
    lower power availability keeps them from being fully utilized, thus causing *server
    sprawl*. Generally, this is something to avoid.


    Another consideration to ask about is emergency power. This can come in two forms:
    battery generated and diesel generators. Battery power can take the form of a
    small, in-rack, *uninterruptible power supply* (UPS), or a large battery cluster
    housed in the building. The generator is typically paired with the large battery
    cluster to provide power for the few minutes of time the generator takes to come
    on and power the building.


    When shopping for your host, ask how the host powers the building during a power
    outage. Be sure to check the *service-level agreement* (SLA) for specific terms
    that the host agrees to follow. Check the terms closely for how you are compensated,
    and how you might file a claim should the host not meet its uptime obligations.
    For example, does the guarantee spell out what power will be available for your
    server? Or will power only be available to critical systems, and are you expected
    to provide your own UPS to your server?


    It’s worth noting that this likely will not be something you would be concerned
    with on a low-cost, shared hosting provider. Other scenarios may mean that the
    hosting provider will power your equipment down during (or as part of) the outage.
    Again, in more modern facilities, this is not typically a problem.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Ask how long (measured in hours) the generator can power the facility in the
    event that electrical service is interrupted. In essence, if the generator has
    fuel, it should be able to run as long as it needs. In reality, this means it
    should be able to run until the local fuel storage is depleted. Many data centers
    and hosts have about 48 to 72 hours of fuel on site. This, of course, varies,
    and should not be used as a measure. Ask the hosting provider about the refueling
    process. Ask about guaranteed fuel delivery (sometimes known as *fuel contracts*,
    which means that the provider can get refueled, guaranteed in “X” hours).


    Find out about a generator test plan. Again, on average, the generator should
    be tested approximately every 30 days.


    Most modern data center facilities have some form of battery power. Hosting facilities,
    or co-location companies, most likely have a battery room, which is a room with
    huge batteries in it to power the building for a few minutes. If you tour a facility,
    ask to see it.


    # Technical Support


    In a time of crisis, good technical support is worth its weight in gold. Sadly,
    many technical companies skimp in this area. Companies such as **wiredtree.com**
    that excel in providing superior technical support are the kind to look for. Having
    said that, how do you know?


    When you ask a potential hosting provider, “Do you have good support?”, the answer
    will always be “Yes.” Putting the provider to the test by purchasing isn’t always
    the best approach. Fortunately, some methods are available that will help you
    reach the right answer.


    One popular method to find out about pricing, uptime, service, or whatever it
    is to ask around by networking with other business people. This is preferred over
    relying on reviews in a printed magazine or website. The business people you network
    with likely do not have any vested interest in the hosting company. Thus, you
    will get a honest answer in the form of their opinions based on experience.


    Of course, online reviews have value in the form of reader comments. Review comments
    on Twitter, Facebook, web host reviews, and other forms of non-printed media.
    This method can provide a dynamic, living model from which you may form your own
    opinion.


    One mistake to avoid is assuming that a company provides great support because
    it is huge. It seems that the bigger the company gets, the worse its support may
    get. Although that may be a bit of a blanket statement, take it as a metric. The
    bigger a company gets, the more the urge exists internally to cut costs. Services
    (which are sometimes viewed by the bean counters as not turning a profit) are
    often reduced, or even outsourced to countries that offer significant cost savings
    or other incentives. The company often ends up with a poor customer experience
    and a disenchanted client base. However, not all big companies get it wrong, just
    as not all small companies get it right. Just consider this as a metric to measure
    in your plans.'
  merge: -1
  img_proc: true
