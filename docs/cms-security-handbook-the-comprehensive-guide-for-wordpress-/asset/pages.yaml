- pgno: 170
  md: 'which is a tool that forces PHP scripts (like your CMS) to be executed with
    the permissions of their owners.


    suPHP is a great tool to use to ensure that you are running PHP in a very secure
    fashion. If you are using a managed virtual private server (VPS) or dedicated
    server at a hosting company, a quick telephone call to the support staff can help
    you establish if you are running it.


    The next method is to try to set folder permissions to 777. If you''re running
    suPHP, you''ll get a 500 Internal Error when you browse.


    # phpinfo


    PHP has a great method for examining the entirety of the settings. Using the phpinfo
    function provides a useful tool to have in your toolkit.


    The steps listed here to execute the phpinfo function are very easy to follow,
    and the end results are invaluable:


    +   1. Create a text file in the root directory and name it `phpinfo.php`. In
    that file, insert the following:

    +   2. Save the file and ensure that the permissions are set for 644.

    +   3. From your browser type the following:


    ```

    <?php phpinfo(); ?>

    ```


    ```

    http://www.yourdomain.com/phpinfo.php

    ```


    A lot of information about your server and its environmental settings appears.
    Near the top of the screen, you should see an entry that resembles Figure 5-10.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_170_0.png)


    Figure 5-10: suPHP installed


    If you see apache in place of the words CGI/FastCGI, then you likely do not have
    suPHP installed.


    PHP has many settings that can be tricky to catch. Fortunately, a free and open
    source tool is available that will give you a good evaluation of your settings,
    as discussed in the following section.


    # PhpSecInfo


    The PhpSecInfo tool, from a group of international experts in PHP security, the
    PHP Security Consortium (PHPSC), is built to evaluate your server’s setup and
    ensure that you have all the PHP holes closed. You can get the tool by visiting


    ```

    http://phpsec.org/projects/phpsecinfo/

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'When run on your server, this tool will test for a number of issues that could
    affect your security. Figure 5-11 shows an example of one such warning.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_171_0.png)


    **Figure 5-11:** Warning produced by PhpSecInfo tool


    This warning appears in red. The various warnings and errors are color-coded.
    This particular error is telling you that the `force_redirect` directive is disabled.
    Note the “More information” link on the lower right, which provides you with a
    detailed explanation of this warning.


    At the bottom of the report is the Test Results Summary, as shown in Figure 5-12.
    It states that 18 tests were run and 10 notices, meaning they need attention.
    It produced 2 items marked as severe.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_171_1.png)


    **Figure 5-12:** Test Results Summary


    You should run this tool regardless of how long your server has been in production.
    You might find that you have a number of holes. Be sure to run it after any upgrade,
    or after any incidents that occur.


    # php.ini


    When you’re using suPHP, you can find a file in the root of most websites called
    `php.ini`. This file allows you to issue commands to the PHP Interpreter. As was
    previously stated, you can use this file in place of the `/etc/php.ini` file.
    Check with your host to ensure the server is running suPHP.


    Using WinSCP, locate the `/etc/php.ini` file. If this file does not exist in this
    directory, it can and may exist in your `public_html` website directory.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Read through the `phpinfo.php` file and determine whether you need to update
    or change any settings for your particular situation. Items that may need to be
    adjusted are things like memory size, because the default in modern implementations
    of PHP is 128MB. This means that a script could ask for and use that much memory.
    Other settings, such as execution time, can help prevent your server from crashing
    if a PHP script has a bug and runs too long.


    In essence, you can fine-tune your PHP server through this helpful file. Make
    the following changes:


    +   - Turn off PHP error messages to external users. This prevents malicious users
    from exploiting possible vulnerabilities in code on your website. Add the following
    entry to your `php.ini` file:


    ```

    display_errors = Off

    ```


    +   - Prevent PHP scripts from running shells and other evils by inserting the
    following:


    ```

    safe_mode = On

    ```


    +   - Only allow access to executable files in an isolated directory by using
    the following:


    ```

    safe_mode_exec_dir = php-required-executables-path

    ```


    +   - Limit external access to PHP environment by inserting the following:


    ```

    safe_mode_allowed_env_vars = PHP_

    ```


    +   - PHP can provide a great deal of information to hackers through information
    leakage. Restricting PHP from giving out too much information is important, so
    insert this:


    ```

    expose_php = Off

    ```


    +   - Because you have suppressed the errors, you should log all errors with the
    following entry:


    ```

    log_errors = On

    ```


    +   - The `Register_Globals` directive has been rendered useless as of PHP 5.3.0.
    However, if you are running anything less than that version, you should set it
    as follows:


    ```

    register_globals = Off

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - POST is used to gather inputs from a form and submit them to the application.
    By minimizing the size of POST, you are lowering the risk of an evil payload being
    uploaded. This recommendation is just that, a recommendation. You should test
    it with your data set and needs. If you find it to be too restrictive, raise the
    size of the POST upload size and repeat the test. Minimize the allowed PHP POST
    size with the following:


    ```

    post_max_size = 2M

    ```


    +   - Ensure PHP redirects appropriately by inserting the following:


    ```

    cgi.force_redirect = 0

    ```


    +   - If you allow file uploading to your site, consider the maximum size of files
    you’ll accept. For example, if you are going to allow very large or very small
    files, you’ll need to adjust the directive. The default is 2MB. To change this
    size, set the following directive:


    ```

    upload_max_filesize = memory

    ```


    Change memory to a number in megabytes to match your needs. Remember that the
    larger the upload, the larger the evil payload that potentially could be uploaded.


    +   - Change the following to prevent uploads to your site:


    ```

    file_uploads = Off

    ```


    +   - Prevent file requests (such as attempts to open files) with the following:


    ```

    allow_url_fopen = Off

    ```


    > **NOTE** For a full list of all the directives of `php.ini`, see http://php.net/manual/en/ini.core.php.


    # Checking for Open Ports


    *Ports* in the vernacular of computing can refer to hardware ports such as serial
    or USB ports. It also can refer to software ports, which is the context used for
    this discussion.


    Figure 5-13 shows an example of a system with many ports open to the outside world.
    This screen indicates not only what ports are open, but also what services are
    being offered, as listed in the right-hand column.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/8bd670d4939cf71dbd0c6123d1b834ff_174_0.png)


    # Figure 5-13: Ports open to the outside world


    This information has been generated by the NMAP network mapping tool. As designated
    by NMAP, the term Open means that the application or service on this machine is
    listening for requests, and the term Filtered means that something (such as a
    firewall) is blocking the port. Note how the SMTP port is designated as Filtered,
    which means this server is blocking requests to it. Note that FTP is Open, meaning
    that it is ready to accept a connection.


    Closed (not shown) means that the port has no services running on it or it’s specifically
    closed. You can open closed ports at any time as needed.


    As you learned in Chapter 4, NMAP is a good tool to use to discover security holes
    in your website. The action here is to check whether any ports are open that should
    not be. Multiple reasons exist for ports to be open that are not necessarily the
    sign of hackers. However, at the end of the day, if ports are open that should
    not be, then you should investigate why and perhaps close them.


    Specific ports that are open can indicate that you’ve been hacked. Table 5-3 shows
    a short list of some ports that, if open, may be running one of the hacker tools
    listed next to it.


    # Table 5-3: Correlation Between Open Ports and Hacker Tools


    | PORT | HACKER TOOLS |\n|---:|---|\n| 6666 | Dark Connection Inside, NetBus worm
    |\n| 6667 | ScheduleAgent, Trinity, WinSatan |\n| 6669 | Host Control, Vampirе
    |\n| 6670 | BackWeb Server, Deep Throat, Foreplay or Reduced Foreplay, WinNuke
    Xteame |\n| 6711 | BackDoor-G, SubSeven, VP Killer |\n| 6712 | Funny Trojan, SubSeven
    |\n\n*Continued*'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Table 5-3 *(continued)*


    | PORT | HACKER TOOLS |

    |---:|---|

    | 6713 | SubSeven |

    | 6723 | Mstream |

    | 6771 | Deep Throat, Foreplay or Reduced Foreplay |

    | 6776 2000 | Cracks, BackDoor-G, SubSeven, VP Killer |


    **NOTE** Appendix A provides a good list of hacker tools and their associated
    ports.


    Using `iptables` or a firewall such as ConfigServer Security Firewall (www.configserver.com),
    you can close off or open up ports. As a general rule, you should use `iptables`
    to block everything, and then individually open ports you need (such as port 80
    for Internet access). This ensures that you don’t have a port open that you didn’t
    know about.


    If you find a port such as 6776 open, this could be one of many backdoor applications
    used by attackers. Use the NetStat tool to find out who is logged in and running
    applications. Additionally, be sure to kill the process for the backdoor. After
    that, go about cleaning it up — after you close the port.


    # Securing FTP Communications Ports


    *File Transfer Protocol (FTP)* is an old protocol. It was first drafted in April
    1971, well before web servers were even dreamed of. In fact, FTP is one of the
    most popular means to connect to web servers. It’s easy to use and simple to set
    up. FTP is also a least-favorite communications protocol among security experts.


    Many of the readers of this book most likely weren’t born yet when the FTP standard
    was drafted. And yet, many users depend on this protocol daily.


    The challenge with FTP is that everything is transmitted in *clear text*, meaning
    that anyone listening on the wire could easily gain your username and password.
    A Trojan horse on a PC could easily gain this information.


    As this chapter was written, one of the more popular FTP server software packages
    was discovered to have a nasty bug. The bug report from ProFTPD (http://bugs.proftpd.org/show_bug.cgi?id=3521
    November 7, 2010) stated the following:


    > > “This vulnerability allows remote attackers to execute arbitrary code on vulnerable
    installations of ProFTPD. Authentication is not required to exploit this vulnerability.”


    Further, the bug advisory also stated the following:'
  merge: -1
  img_proc: true
