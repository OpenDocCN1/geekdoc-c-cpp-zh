- pgno: 308
  md: "```\n~~~\n# RPM packages drop log rotation information into this directory\n\
    include /etc/logrotate.d\n\n# no packages own wtmp and btmp -- we'll rotate them\
    \ here\n/var/log/wtmp {\n    monthly\n    create 0664 root utmp\n        minsize\
    \ 1M\n    rotate 1\n}\n\n/var/log/btmp {\n    missingok\n    monthly\n    create\
    \ 0600 root utmp\n    rotate 1\n}\n# system-specific logs may also be configured\
    \ here.\n~~~\n```\n\nThis code instructs the system to wake up and rotate access\
    \ logs weekly, and to only keep a rolling four weeks of logs. Each week, it is\
    \ to compress the log file using the date as the suffix. Finally, the system is\
    \ to create a new log. The rest of the log configuration file instructions handle\
    \ the system's internal needs. The last line is in place to allow for other configuration\
    \ options:\n\n```\n~~~\n# system-specific logs may also be configured here.\n\
    ~~~\n```\n\n> > **NOTE** The # sign in the configuration indicates a comment.\
    \ The sign can appear anywhere in the file, as long as it's the first thing in\
    \ the line.\n\nFollowing is an alternate version of the configuration file (found\
    \ using man logrotate while logged in the shell of the server):\n\n```\n~~~\n\
    # sample logrotate configuration file\n\ncompress\n\n/var/log/messages {\n   \
    \ rotate 5\n    weekly\n    postrotate\n        /sbin/killall -HUP syslogd\n \
    \   endscript\n}\n\n\"/var/log/httpd/access.log\" /var/log/httpd/error.log {\n\
    \    rotate 5\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 309
  md: "```\n```\nmail admin@domain.com\nsize 100k\nsharedscripts\npostrotate\n   \
    \     /sbin/killall -HUP httpd\nendscript\n}\n```\n```\n\nIn this example, the\
    \ first command, *compress*, is global, and instructs logrotate to compress the\
    \ files when it rotates them. What follows are the instructions that tell logrotate\
    \ to go through five weekly rotations.\n\nUpon week six, it will delete the oldest\
    \ one. Additionally, after the log file has been rotated, but not before the compression,\
    \ it will run the command listed after the *postrotate*: `/sbin/killall -HUP syslogd`\
    \ command.\n\nImmediately after *endscript* is where the compression of the file\
    \ will occur.\n\nThe next section instructs the logrotate for both `/access.log`\
    \ and `error_log` to be rotated when they reach 100K in size. This particular\
    \ setup would e-mail the uncompressed (100K) versions of the logs to admin@domain.com\
    \ after five rotations. This way, you can keep a copy locally and “offsite” via\
    \ e-mail.\n\nThe *sharedscripts* command in the last portion of the file means\
    \ *postrotate* script will run only once for both files — not once for each log.\
    \ That way, it does its work through one pass.\n\n# # Manually Setting Up *logrotate*\
    \ Options\n\nA tremendous number of log options are available to you with logrotate.\
    \ Table 8-4 shows a few valuable ones pulled from the help documents.\n\n> **NOTE**\
    \ You can see all the commands by logging into your server via a shell and typing\
    \ **man logrotate**, which shows all the help options available.\n\n**Table 8-4:**\
    \ Logrotate Options\n\n| OPTION | DESCRIPTION |\n|---|---|\n| compress | Old versions\
    \ of log files are compressed with the gzip utility by default. |\n| compresscmd\
    \ | Specifies which compression utility to use to compress log files. The default\
    \ is gzip. |\n| uncompresscmd | Specifies which command to use to uncompress log\
    \ files. The default is gunzip. |\n| compressext | Specifies which extension to\
    \ use on compressed log files, if compression is used. |"
  merge: -1
