- pgno: 311
  md: '# Table 8-4 (continued)


    | OPTION | DESCRIPTION |

    |---|---|

    | `nocopytruncate` | Do not truncate the original log file in place after creating
    a copy. (This overrides the `copytruncate` option.) |

    | `nocreate` | New log files are not created. (This overrides the `create` option.)
    |

    | `nodelaycompress` | Do not postpone compression of the previous log file to
    the next rotation cycle. (This overrides the `delaycompress` option.) |

    | `nomissingok` | If a log file does not exist, issue an error. This is the default.
    |

    | `notifempty` | Do not rotate the log if it is empty. (This overrides the `ifempty`
    option.) |

    | `nosharedscripts` | Executes the prerotate and postrotate scripts for every
    rotated script. |

    | `noshred` | Do not use shred when deleting old log files. See also `shred`.
    |

    | `rotate count` | Log files are rotated `count` times before being removed or
    e-mailed to the address specified in a mail directive. If count is 0, old versions
    are removed rather than rotated. |

    | `sharedscripts` | Normally, prerotate and postrotate scripts are run for each
    log rotated, meaning that a single script may be run multiple times for log entries
    that match multiple files (such as the `/var/log/news/*` example).<br><br>If `sharedscripts`
    is specified, the scripts are only run once, no matter how many logs match the
    wildcard pattern. However, if none of the logs in the pattern require rotating,
    the scripts will not be run at all. If the scripts exit with error, the remaining
    actions will not be executed for any logs. (This option overrides the `nosharedscripts`
    option and implies a `create` option.) |

    | `shred` | Delete log files using `shred -u` instead of `unlink()`. This should
    ensure that logs are not readable after their scheduled deletion. This is off
    by default. See also `noshred`. |

    | `shredcycles count` | Asks GNU shred to overwrite log files `count` times before
    deletion. Without this option, the shred default will be used. |

    | `size`<br>`size[G/M/k]` | Log files are rotated when they grow bigger than size
    bytes. If size is followed by M, the size is assumed to be in megabytes. If the
    G suffix is used, the size is in gigabytes. If the k suffix is used, the size
    is in kilobytes. So, size 100, size 100k, size 100M, and size 1G are all valid.
    |'
