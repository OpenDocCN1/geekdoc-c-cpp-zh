- pgno: 133
  md: 'To discover all the Plone add-ons you have, log in to your Plone site as the
    admin. In the admin control panel (in the upper right), select Admin > Site Setup.
    Here is an example of a shortcut:


    ```

    http://Example.com:8080/plone/prefs_install_products_form

