- pgno: 265
  md: 'time back to when the rootkit was placed on there, unless you can remove it
    from your backups as well.


    # Viruses


    Generally speaking, viruses fall into a number of classifications. The ones in
    the context of this discussion are the kind that attempt to download onto a visitor’s
    computer via a browser.


    This type of attack is known as a drive-by-download. If this happens, you may
    have been a victim of a cross-site scripting (XSS) attack, or you have an extension
    (third-party add-on) that is vulnerable to a remote file injection.


    Clean up the virus code and patch. Then, check all your desktops because they
    are likely infected as well.


    # Code Tampering


    One particular strategy a hacker may take is to tamper with code to maintain control
    over the system. This attack is slightly different than planting malware onto
    a system. In the Linux operating system, you have a number of ways to determine
    what processes are running. The idea is that if you are troubleshooting your server,
    you could look at the running processes and kill any you don’t need, or start
    up ones you do need.


    An example of code tampering might be if a hacker can gain enough access to your
    system, and then replace the utilities that provide the process status. The idea
    is that the hacker’s version of the process monitor would hide any evil code the
    hacker may be running. Said a different way, run only what you need, and reduce
    the number of areas an attacker may seek out. A number of schools of thought exist
    on this topic. However, if a hacker has replaced key utilities on your server,
    then it’s time to reformat the disk and reinstall.


    # Monitoring for Unauthorized Changes


    If you want to monitor your system for unauthorized changes, install something
    like TripWire to the system (http://sourceforge.net/projects/tripwire), which
    will monitor your files and directories for changes. The best method is to start
    with a known good, clean system to ensure that no malware or replaced code is
    on it. TripWire (and other software packages that provide the same solution) will
    alert you to changes, allowing you to take a proactive stance.


    Next, let’s take a look at patching the various CMSs discussed in this book.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# # Patching a CMS


    In the final section of this chapter, you learn about the particulars of each
    CMS in terms of updates. Each one does it differently than another.


    > **NOTE** Because technology is always changing, referring to the most current
    documentation before updating your CMS is best. As of this writing, what is presented
    here are the most current methods as documented by the CMS projects. Each CMS
    is in active development, meaning that updates are likely available for either
    your CMS or the add-ons for it.


    # ## Joomla!


    Joomla! 1.5.xx does not offer a native means to update the CMS, but it''s a very
    simple task to do. The CMS development team offers two versions of updates, and
    you can choose the one that works best for you.


    # ### Minor Version Patches


    The minor version patch only updates the version from one dot release to the next.


    > **NOTE** To obtain the minor patch updates, visit `http://joomlacode.org/gf/project/joomla/files`.


    As you can see from Figure 7-2, the Joomla! code download is currently in development
    version 1.6, marked as beta. The figure also shows the Joomla! files.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_266_0.png)


    **Figure 7-2:** Joomla! minor version patch download'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The packages are available as a ZIP format or a GZ format. The first of the
    15 updates you see is for updating your version 1.5.15 site to version 1.5.22.
    If you notice further down, you could update from version 1.5.4 to 1.5.22. Each
    minor release always had an update like this to the current minor release.


    # Full Update Files


    Another update method is to simply copy all the files from the full installation
    package. You can find this package on the home page of Joomla.org, as shown in
    Figure 7-3.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_267_0.png)


    **Figure 7-3:** Download the latest Joomla!


    > **WARNING** Do not copy the Installation folder from the source file to your
    site for patching.


    # Conducting the Update


    You upload and apply both minor and full updates in the same fashion, as follows:


    +   1. Back up your site and database. For convenience, put the site into offline
    or maintenance mode, as shown in Figure 7-4.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_267_1.png)


    **Figure 7-4:** Putting Joomla! in maintenance mode


    +   2. In the administrator console, navigate to Global Configuration and switch
    SITE OFFLINE to Yes. This step shuts off access to the outside world while you
    update.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   3. Use FTP or SSH to upload all the files you unzip (except the `installation`
    folder) to the root of your Joomla! site. This is typically `public_html`. However,
    you may have a different root directory.

    +   4. When the upload completes, revisit the Global Configuration page and put
    the site back online.

    +   5. In the administration screen, check the upper-right portion of the screen
    to see the version of your site. It should match what you just uploaded.


    # Updating Extensions


    The term *extension* refers to a class of add-ons that are known as *plug-ins,
    modules,* and *components*, depending on your CMS. Each of these carries its own
    version and method. Let’s take a look at one of the easiest ways to determine
    your version information for your extensions:


    +   1. Log in to the administration screen and click Extensions > Install/Uninstall,
    as shown in Figure 7-5.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_268_0.png)


    +   2. Select Components to open and display the installed components. Figure
    7-6 shows an example of the components of an installed system. In this example,
    you can see the various components, their enabled status, and the version. Each
    tab follows the same format, allowing you an easy method to get the version information.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_268_1.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '3. Select the Install tab, as shown in Figure 7-7. Note the three methods:
    the Browse button and “Upload File & Install”; “Install from Directory”; and “Install
    from URL.” Choose the one most appropriate to your extension (typically the Browse
    button or “Upload File & Install”).


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_269_0.png)


    **Figure 7-7:** Installation of extensions and updates


    You can find most Joomla! third-party developers under the Plugins tab by looking
    under the column titled Author, as shown in Figure 7-8. Here you see an actual
    URL, or you can hover over the name to get further information. You’ll note some
    of the authors are listed as Joomla! Project. This is part of the core Joomla!
    installation, and that add-on would be updated by any CMS patch.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_269_1.png)


    **Figure 7-8:** Joomla! author contact information


    Some extensions (such as Akeeba Backup) provide a phone home type of feature where
    the extension will check in from time to time for an update. In the Joomla!'
  merge: -1
