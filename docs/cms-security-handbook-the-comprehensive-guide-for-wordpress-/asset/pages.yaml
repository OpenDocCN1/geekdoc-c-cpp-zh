    These suggestions are included for educational purposes only and, of course, if
    you have this much of a concern, then not using wireless is the best alternative.


    # ## Bluetooth Security Considerations


    Bluetooth is the technology that allows users to make hands-free calls, use a
    wireless mouse and keyboard, and annoy people by talking into thin air using earpieces.
    Bluetooth is a compact “data” radio. It operates on an unlicensed frequency, and
    transmits at a maximum distance of 100 meters (109 yards). Figure 10-1 shows a
    typical Bluetooth setup.


    ![](img/8bd670d4939cf71dbd0c6123d1b834ff_362_0.png)


    In Figure 10-1, you can see the mobile phone, personal digital assistant (PDA),
    and laptop computer all being “paired.” Many laptops today support both Wi-Fi
    and Bluetooth, primarily because they can be packaged in a single chip. This enables
    the manufacturers to offer the most options at the lowest cost to you.


    Bluetooth security has improved since its inception, and, for the most part, gone
    are the days of sitting on an airplane and using your laptop to connect to other
    laptops. This, of course, is rude, possibly illegal, and was a quite frequent
    practice in the early days of this standard.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'Like most technologies, however, flaws have been discovered that have driven
    the development of new standards. Given its special role in your network, Bluetooth
    poses a very large potential threat to your website security. If a dedicated attacker
    can use Bluetooth to gain access to your systems, desktops, or your network, then
    planting a virus to gain your passwords is a simple matter. Yet, despite the downsides,
    Bluetooth can be a useful technology, and can be an effective tool, if you implement
    proper safeguards.


    # Bluetooth Pervasiveness


    Today, hundreds of devices depend on the Bluetooth standard. A brief search on
    the Internet reveals devices that are built for the following applications:


    +   - Audio/visual

    +   - Personal computers

    +   - Mobile telephony

    +   - Automotive

    +   - Office equipment

    +   - Audio (as in stereo equipment)

    +   - Medical

    +   - Home


    Because this technology is so pervasive in our culture, the chances are good that
    you have it in your office. Again, the idea of this book is to prepare you for
    holistically protecting your CMS and infrastructure. You want to protect Bluetooth
    from any outside (non-authorized) activity at all costs. So, the following sections
    provide a look at a few security basics.


    # Bluetooth Threats


    If you include a dose of common sense when you use Bluetooth for your applications,
    you should have minimal problems. In fact, using Bluetooth offers major advantages.
    Yet, you must recognize and mitigate the risks. The technology and devices are
    susceptible to many of the same wireless threats that exist for WAPs.


    Wireless devices (including those with Wi-Fi and Bluetooth technologies) can be
    susceptible to a classic “man-in-the-middle” attack or message modification. Unauthorized
    use of these devices can introduce even more threats.


    Following are specific types of attacks identified by the National Institute of
    Standards and Technology (U.S. Commerce Department) in its guide to Bluetooth
    security:'
  merge: -1
  img_proc: true
- pgno: 364
  md: '+   - *Bluesnarfing* — Bluesnarfing enables attackers to gain access to a Bluetooth-enabled
    device by exploiting a firmware flaw in older devices. This attack forces a connection
    to a Bluetooth device, allowing access to data stored on the device, and even
    the device’s international mobile equipment identity (IMEI). The IMEI is a unique
    identifier for each device that an attacker could potentially use to route all
    incoming calls from the user’s device to the attacker’s device. Rerouting phone
    calls could be a prank, or a nasty event. Consider upgrading to the most modern
    Bluetooth devices for telephony applications.


    +   - *Bluejacking* — Bluejacking is an attack conducted on Bluetooth-enabled
    mobile devices, such as cellular telephones, smartphones, and PDAs. Bluejacking
    is initiated by an attacker sending unsolicited messages to a user of a Bluetooth-enabled
    device. The actual messages do not cause harm to the user’s device, but they are
    used to entice the user to respond in some fashion, or add the new contact to
    the device’s address book. This message-sending attack resembles spam and phishing
    attacks conducted against e-mail users. Bluejacking can cause harm when a user
    initiates a response to a bluejacking message that is sent with a harmful intent.


    +   - *Bluebugging* — Bluebugging exploits a security flaw in the firmware of
    some older Bluetooth devices to gain access to the device and its commands. This
    attack uses the commands of the device without informing the user, allowing the
    attacker to access data, place telephone calls, eavesdrop on telephone calls,
    send messages, and exploit other services or features offered by the device.


    +   - *Car Whisperer* — Car Whisperer is a software tool developed by European
    security researchers that exploits a key implementation issue in hands-free Bluetooth
    car kits installed in automobiles. The Car Whisperer software allows an attacker
    to send or receive audio from the car kit. An attacker could transmit audio to
    the car’s speakers, or receive audio (eavesdrop) from the microphone in the car.


    +   - *Denial of Service (DoS)* — Bluetooth is susceptible to DoS attacks. Impacts
    include making a device’s Bluetooth interface unusable and draining the mobile
    device’s battery. These types of attacks are not significant, because the proximity
    required for Bluetooth use can usually be easily averted by simply walking away.
    This is a low threat to you, and could be just considered an annoyance.


    +   - *Fuzzing attacks* — Bluetooth fuzzing attacks consist of sending malformed
    or otherwise non-standard data to a device’s Bluetooth radio, and observing how
    the device reacts. A device’s response being slowed or stopped by these attacks
    indicates that a serious vulnerability potentially exists in the protocol stack.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# Security Recommendations


    You do not need to drop your entire Bluetooth device inventory to safeguard your
    infrastructure. Rather, here are a few common-sense items to help you stay on
    track:


    +   - A well-formed information security policy (which you will learn more about
    in Chapter 11) is your friend. In that policy, define what devices and what type
    of information can be sent over Bluetooth. Remember, just because someone makes
    a Bluetooth-enabled coffee pot doesn’t mean you need to use it.

    +   - Consider discontinuing the use of any older Bluetooth devices. The reasons
    for this is that later (2008 and beyond) models are more secure and have better
    encryptions. For example, the original (Class One) Bluetooth radios have a 100
    milliwatt (mW) output. This means that anyone within 100 meters (109 yards) can
    pick up and attempt to attack the signal. Bear in mind that this is an estimate,
    because there are many other influential factors, such as the device itself, sun-spot
    activity, materials of the building, terrain, and much more. Don’t count on this
    number being one you can rely on in all situations.

    +   - Ensure that any Bluetooth device used is changed from its default settings.

    +   - If possible, turn down the power on the devices to reduce the transmission
    range.

    +   - Use a very strong PIN or password (device-dependent).

    +   - Set passwords on devices that have a Bluetooth connection in the event of
    loss or theft. In the event of loss or theft, users should decouple the device
    from the Bluetooth device.

    +   - Set up Bluetooth devices to be *non-discoverable*. This practice prevents
    attackers from mapping out your network through them, or knowing the names of
    the devices.

    +   - Your Bluetooth device likely supports some form of *link encryption*. Activate
    it, if it exists.

    +   - If you have no need for Bluetooth on a notebook computer, turn it off. This
    helps save battery life and may prevent a machine from being compromised.

    +   - If a Bluetooth device is not in use, it should be turned off. There is no
    reason to give someone a window of opportunity.


    Although you can use many other tactics, these should suffice for most organizations.'
  merge: -1
  img_proc: true
