- pgno: 234
  md: 'This plug-in tests your server setup for required and optional needs automatically.
    After the plug-in determines that all the required software is either enabled
    or installed, you are ready to go.


    # Configuration


    This tool has a number of available configuration options, including the following:


    +   - **AWS Access Key** — This is your Amazon S3 access key.

    +   - **AWS Secret Key** — This is your Amazon S3 secret key.

    +   - **S3 Bucket Name** — This is your storage folder on Amazon S3.

    +   - **Backup schedule** — Your options here are None, Daily, Weekly, or Monthly.
    This handles the automated scheduled backups for you.

    +   - **Parts of your blog to back up** — You can select all the checkboxes here
    for a full backup, or only some for a partial backup. The partial backup could
    be treated as an incremental backup.

    +   - **Delete backups older than one month** — You have a few options here to
    mix and match. These will be checked based on your needs and your available storage.


    # Backups


    After you have selected all the desired options, you can save your changes and
    return to blogging, or you can save changes and back up now. The latter choice
    will conduct a manual backup.


    # Restoration


    To conduct a restore, log in to wp-admin and locate the plug-in from the menu.
    Scroll down until you see the “Restore from a backup” tab. Click the tab.


    Your only choices are from which database to restore, and whether or not to change
    the database settings. After making your choices, click “Restore from backup”
    and you’re done.


    By early 2011, the next release of this tool will be available. According to the
    developers, it will have an updated interface and a file-by-file upload for very
    large sites.


    # Plone Backup and Restoration


    On the whole, Plone is a very different system than the other CMSs discussed in
