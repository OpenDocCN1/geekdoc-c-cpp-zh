    # Understanding Hardware Vulnerabilities


    Hardware has vulnerabilities just as software does. The biggest difference is
    that hardware vulnerabilities are less frequent. The most important vulnerabilities
    are often in the firmware or BIOS of the hardware, and the control systems (software)
    that ship with the hardware.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'With that in mind, the big hardware areas are networking gear (such as routers),
    Wi-Fi systems (and switches), and printers (of all types and all capabilities).
    Although you may not have access to some of these items (especially in a hosting
    situation), you may have printers or networking gear in your office.


    # Network Gear


    Networks deserve special consideration because they consist of hardware devices,
    usually have some form of software and firmware, and live at the heart of your
    system. They represent a prized target to a hacker.


    Check the networking devices such as Wi-Fi routers, switches, and so on, for default
    passwords and exposed settings. Record the correct settings in your baseline report.


    > **NOTE** Be sure to visit the manufacturer’s site to ensure that your drivers
    and firmware are up to date.


    Collect all the settings for your baseline spreadsheet, and check them from time
    to time. It’s difficult to provide a specific *frequency* for checking developer
    websites because vulnerabilities show up all the time. Two suggestions are either
    to set up a weekly time on your calendar to check all the websites, or subscribe
    to SalusAlerting.com.


    # Printers


    Today, many printer manufacturers include convenience options (such as mini-web
    servers) in the actual hardware. In fact, many printers today feature *wireless*
    connectivity.


    What a treasure-trove of fun this feature could be for a bored hacker. Browsing
    for printers, copiers, and other print devices is simple. Using Google, locating
    a string to identify printers that are open to the Internet is easy. After hackers
    find a printer, connecting to it is often just as easy.


    The problem is obvious — this wireless connectivity provides a way into your network.
    This is especially true if the software becomes vulnerable on the printer, and
    a hacker finds his or her way in.


    As a test, the author performed a Google search using a Google dork (a search
    string built to look for vulnerabilities) for a specific model of printer. This
    search resulted in 25 entries listed in Google that were exposed to the open Internet.
    A dedicated hacker could potentially gain access through those, and run wild in
    the network.


    Your baseline should determine the following information about any network-attached
    printers (including wireless systems):


    +   - Is it set up with the default username and password?'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   - Can it be seen from the open Internet? (A means to determine this is
    to attempt to browse to it from the outside world by using, for example, `http://ipaddress/`.)

    +   - Did you contact the manufacturer and determine whether updates are available?

    +   - Is the printer running the latest drivers?

    +   - Have you checked all the settings on the site?


    Ensure that you review all of your network-enabled and wireless printers. Record
    these printers in your baseline spreadsheet, and check the preceding information
    for them periodically.


    # Uncovering Hidden Dangers Through Vulnerability Scanning


    The server your site lives on is a very dynamic device, and the software on it
    ages. As this aging process happens, vulnerabilities might be discovered, new
    exploits might be written to attack it, or you may simply discover bugs in the
    code.


    All these issues can add up to hidden dangers in your site. Many tools are available
    to the administrator (and to the hackers) to help identify vulnerabilities. Following
    are some of the tools you may want to become familiar with.


    > > **WARNING**  Be sure you have permission of the owner of the server before
    using any of these tools.


    +   - *MetaSploit* (`http://www.metasploit.com`) is one of the most popular and
    most powerful tools available. This open source tool is used by penetration testers,
    who are security professionals hired to *break into* sites or discover weaknesses.

    +   - *Nikto2* (`http://cirt.net/nikto2`) is a web scanner that looks for weaknesses,
    outdated files, known vulnerabilities, and more. This is a quick and “noisy” tool.
    In other words, it’s not stealthy, but is powerful.

    +   - *Acunetix* (`http://www.acunetix.com`) is a commercial vulnerability scanner
    that checks the applications on your site for Cross-Site Scripting (XSS) errors.
    It checks for legal compliance, makes comparisons against the Google Hacking Database,
    tests for password-protected areas, and more.

    +   - *Burp* (`http://portswigger.net`) offers a free and commercial version of
    a web-scanning tool. One powerful feature is that it can sniff the traffic between
    the application and browser. This offers you a wealth of information about how
    the application is working.'
  merge: -1
  img_proc: true
