  md: '# CHAPTER 3. CONCURRENCY


    in another thread. Defining a precise memory model has several advantages:

    First, describing the behaviors that multithreaded programs are allowed to exhibit
    all kinds of compiler optimizations, even if such an optimization is not known
    or implemented by the time the memory model is defined. To remain consistent,
    the Java Language Specification requires an as-if semantics within thread boundaries
    that programmers are used from sequential programming. And, the specification
    committee wanted to guarantee a certain level of security, even if the program
    is insufficiently synchronized: The result of an unsynchronized field access is
    not defined in traditional programming languages, which might lead to reading
    an arbitrary value from memory (e.g. a stale value). The JMM defines a value to
    that in this thread before the read instruction may even be seen, in the case
    of race conditions.3


    Requiring that every processor in a shared-memory multiprocessor environment immediately
    sees what all the processors are doing is expensive in contemporary architectures,
    which only appear to adhere to the Von Neumann model. In practice, this requirement
    would abandon nearly all recent achievements in speeding up processors, like pipelining,
    caches or speculative execution. Therefore, all architectures use more or less
    relaxed notion of memory-coherence and require the operating system, compilers
    and sometimes even to insert special instructions (fences) to guarantee safe sharing
    of data. Java’s write once, run everywhere philosophy thus the definition of a
    common memory model, which is enforced by the JVM in terms of the program’s memory.


    The JMM describes, based on a program and a corresponding execution trace, whether
    the trace is a legal execution of the program. To this end, it validates for each
    read, the observed value follows certain rules. Implementations of the JMM need
    only make sure that the execution produces a result that can be derived from the
    rules in the JMM, but are free in all other details. In particular, all present
    and future compiler optimizations are legal, if they adhere to those rules.


    The actions of each thread in isolation must obey an as-if-serial semantics i.e
    all actions must execute in the same order as the thread’s statements are ordered
    in the program, with the additional restriction that the observed values of shared
    variables must adhere to the rest of the memory model. As-if-serial semantics
    does, however, not restrict optimizations that change a thread’s semantics but
    preserve that appearance (e.g. loop invariant code motion)


    In Java, all instance and static fields and arrays are stored in shared heap memory
    and are therefore affected by the memory model. In contrast, local variables in
    methods of formal method or exception handler parameters are not shared and thus
    need only adhere to intra-thread semantics. For the rest of the memory model,
    the term variable will denote a shared variable. Two


