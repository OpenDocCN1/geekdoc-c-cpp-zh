    # 2.1 Intraprocedural Dataflow Analysis


    Dataflow Analysis (DFA) is a major branch of program analysis. It answers questions
    of the form "Can a value computed at a certain statement flow to another statement?"
    For DFA it is custom to represent a program as a directed graph, where nodes are
    the statements or predicates of the program and the edges describe the control
    flow, ie possible execution sequences of the statements. The graph-based representation
    allows analysis of programs with structured and unstructured control flow, like
    goto''s or exception handling.


    Definition 2.1 (Control Flow Graph). A Control Flow Graph (CFG) is a directed
    graph G = (N, E, n_start, n_end, ν). N is the set of nodes representing statements
    and predicates which contains two distinct nodes n_start and n_end representing
    the beginning and termination of the program respectively. E is the set of control
    flows (n, m) ∈ E; also m may execute immediately after the execution of the statement
    represented by n. Therefore, START has no predecessors and END no successors.
    The total attribute function ν : E → (true, false) maps the edge to an attribute:
    Nodes representing a predicate have two successors where the edge to one node
    is attributed with true, the other with false in accordance with the predicate''s
    outcome. switch statements may have a variable number of successors where each
    edge is attributed with the integer value that the predicate variable must equal
    for control flowings to the edge''s target. All other edges are attributed with
    ε, the empty attribute. The functions pred and succ return for each node in the
    CFG its predecessors and successors, respectively.


    Example 2.1. Figure 2.1 shows an example program along its control flow graph.
    The nodes are represented with the line number of the corresponding statement.'
