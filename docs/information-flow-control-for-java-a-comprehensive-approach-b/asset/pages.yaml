    \ removed. For a given-slicing criterion C = (n, V), a tuple consisting of a statement\
    \ and a subset of the program's variables, such reduced program S is called a\
    \ reduced program slice if it fulfills its properties:\n\n+   1. S must be a valid\
    \ program, and\n\n+   2. whenever P halts for a given input, S halts for input,\
