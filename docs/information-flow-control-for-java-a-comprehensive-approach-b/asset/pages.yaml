    object.\²If one thread *t1* calls a (non-synchronization) method of the thread
    object *t2* (where *t2* corresponds to a thread executing in parallel to *t1*),
    this is nevertheless executed in *t1*''s thread of execution, thus will only interact
    with *t2*''s thread in terms of shared memory.'
