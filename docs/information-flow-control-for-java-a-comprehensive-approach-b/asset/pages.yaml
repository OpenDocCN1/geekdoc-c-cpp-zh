    # 6.4 Path Conditions


    For both static and dynamic path conditions presented in chapter 5, a prototype
    implementation has been integrated into the original framework [Rob05].


    We have implemented a prototype path generator for Java based on the existing
    implementation for C and the dependence graph generator for Java presented in
    chapter 2, and demonstrate the feasibility of our extensions with preliminary
    case studies. For the implementation, we concentrated on the new concepts and
    automatically benefited all constructs that share a common representation with
    C. For the prototype, the fine-grained Java SDG was adapted to interface with
    the C path condition generator. Thus the procedural object-oriented constructs
    are tackled by the dynamic dispatch — the most characteristic feature of object
    programming — according to equation (15). At the time of this writing, the precise
    conditions for instanceof and exceptions are not yet integrated and are approximated
    conservatively; the same is true for some other Java constructs. The precise formulae
    for these constructs will be integrated in the future. Still, all conditions presented
    in the evaluation (7) have been generated by the current prototype.


    The dynamic path conditions have also been integrated into the existing implementation.
    To control the dynamic trace data, the standard debugger gdb was leveraged. A
    debugger driver abstracts away from the debugger in use, so we may replace gdb
    by another debugger. The tracer offers a standard interface for controlling the
    execution. The breakpoints and data needed for control of the debugger is extracted
    from the fine-grained SDG. In the tracing phase, the program is executed statement
    by statement, and all required information is traced. From that, a dynamic slice
    is built that is generally more precise than the static slice.'
