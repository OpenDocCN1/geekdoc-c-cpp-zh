    # 4.9.3 Verification and IFC


    Amtof et al. [ABB06] present an intercultural flow-sensitive Hoare-like logic
    for information control in a rudimentary object-oriented language. Casts, type
    tests, visibility modifiers other than public, and exception handling are not
    considered. Only structured control flow is allowed.


    The Pacap case study [BCM07] verifies secure interaction of multiple Java-lets
    on one screen. They employ method checking to ensure a sufficient condition for
    their security policy, which is based on a lattice similar to noninterference
    without declassification. Implicit exceptions are modeled, but such unstructured
    control flow may lead to label creep (cef [SM03, Sect. 1 E]).


    Genain [GS05] defines an abstract interpretation of the CFG looking for information
    leaks. It can handle all bytecode instructions of single-threaded Java and conservatively
    handle implicit exceptions of bytecode instructions. The analysis is flow- and
    context-sensitive object but does not differentiate fields of different objects.
    They propose an object-insensitive solution for all fields of a given class. In
