    # Omission errors


    Dynamic slices can show that some influence took place or not. Sometimes one would
    like to know why an expected influence did not happen during program execution.
    In literature [AHKL93, GABF99, WR04] several approaches were proposed to enrich
    the dynamic slice with the "culpable" control predicates, i.e. those that triggered
    a branch to an execution on which the expected data dependence did not come into
    effect. But adding the predicates to the slice does not reveal what actually went
    wrong. Our approach returns the exact conditions for a data flow to happen. The
    static path condition augmented with the restrictive clause can be fed into a
    constraint solver to detect the contradictions between the variable trace and
    the values'
