    even if the body is dead code. Thus, semantic analysis postulated in [SS05] is
    violated. This is not in discrepancy with Theorem 4.1, but comes from analysis
    precision.


    Fortunately, SDGs today are in a package with other analyses developed for code
    optimization, such as interprocedural constant propagation, static single analysis
    form, symbolic evaluation, and dead code elimination. These powerful analyses
    are performed before SDG construction starts, and will eliminate a list of spurious
    flows. The easiest to exploit such analysis is by constructing the SDG from bytecode.
    For example, any optimizing compiler will delete the whole statement from machine
    code or bytecode, as it is dead code. Note that the bytecode must be considered
    the ultimate definition of the program’s meaning, and remaining flows in the bytecode
    – after all the sophisticated optimizations – must be taken the more seriously.


