  md: '# 5.4. DYNAMIC PATH CONDITIONS IN DEPENDENCE GRAPHS


    # ### Correctness of Dynamic Path Conditions


    Sometimes only fragments of a trace are available due to a "defective recorder"
    or intentionally to save memory. While fragmented traces are generally useless
    for dynamic slicing (see Section 5.4.1), they still hold valuable information
    for strengthening path conditions.


    ```

    $x = 0 \vee x = 1$$

    ```


    while the variable assignment states actually were


    ```

    $x = 0 \vee x = 2$$

    ```


    The restricted path condition


    ```

    $PC'' = (x > 1) \wedge (x = 0 \vee x = 1) \equiv false$$

    ```


    would be in contradiction to the actual program state (x = 2) and then definitely
    rules out data dependence where it may be possible.


    To avoid unsound path conditions, it is conservatively assumed that there is an
    additional unknown value $\perp$ for each variable representing the assignments
    which occurred but were not traced due to some memory. This measures yields a
    correctly restricted path condition as the fragmentation of the trace flows. For
    our example, the resulting path condition is


    ```

    $$(x > 1) \wedge (x = 0 \vee x = 1 \vee \perp) \\\equiv (x > 1 \wedge x = \perp)
    \equiv x > 1$$

    ```


    Only if the completeness of the trace (at least certain variables, see Section
    5.4.1) can be guaranteed, one may abandon this conservative measure (for those
    variables).


    It may seem using this trick one doesn''t gain any additional information of dynamic
    variable. To show the advantage of variable traces containing unknown values,
    consider the path PC(1,5) of Figure 5.1. With a fragmented variable forming the
    restrictive clause (x = 5 \vee x = \perp$) the improved path condition from 1
    to 5 will be:


    ```

    $PC(1,5) \equiv (n > 0 \vee n > 0) \wedge (x = 5 \vee x = \perp) \wedge (n = 3
    \vee n = \perp)$$$

    ```


    It is immediately clear that the traced variable x = 5 and n = 3 may trigger an
    influence from line 1 to line 5.


    This tiny example shows that while restrictive clauses cannot be used to evaluate
    a clause of the path condition to false, they may reveal input values that triggered
    an illegal information flow.


    149'
