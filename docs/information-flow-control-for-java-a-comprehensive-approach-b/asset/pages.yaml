    # Correctness of graph-based Slicing


    Horwitz et al. [HPR88] showed that PDGs (for a language including arrays) are
    adequate for representing a program''s execution behavior: if the PDGs of two
    programs are isomorphic, then for a given input either both programs diverge,
    or terminate with the same values for all variables. Backward intraprocedural
    slicing based on the PDG for a simple while language has been proved correct in
    [RY88]. Their Slice Theorem proves that for any initial state on which the program
    terminates, the program and its slice compute the same sequence of values for
    each element of the slice. This result was extended to the SDG by Brinkley et
    al. [BHR89] and to programs with heap-allocated storage (based on a LISP-style
    control operator) and pointers [PS91], in the spirit of [HPR89]. It is well-known
    that such an operator is sufficient to model complex heaps and even Java-like
    objects. Our extension of SDGs in section 2.5 is presented together with a correctness
    argument for interprocedural data dependencies parameter passing. Syntax-preserving
    slicing in the presence of unstructured control flow has been solved independently
    by Ball and Horwitz [BH93] and Choi and Ferrate [CF94]. Both solutions include
    a correctness proof. Harman and Danihani [HD98] extend the solution of Agrawal
    [Agr94] and present a correctness proof.


