  md: "# CHAPTER 4. INFORMATION FLOW CONTROL\n\n**Corollary 4.7** (Conservativity\
    \ of Declassification). Algorithm 7 is conservative, that is, without declassification\
    \ it reduces to standard noninterference.\n\nLet us finally point out a few special\
    \ situations. It is explicitly allowed to have two or more declassification on\
    \ one specific path, e. g. $x \to^* d_1 \to^* d_2 \to^* y$. But this only makes\
    \ sense if $P(d_1) \\leq R(d_2)$, otherwise no legal flow is possible on the path,\
    \ and $P(d_2) \\leq P(d_1)$, as the second declassification is redundant.\n\n\
    In case there are several declassifications on paths from $x$ to $y$, by example\
    \ $x \to^* d_1 \to^* y \to^* d_2 \to^* y, x \to^* d_3 \to^* y,\\dots$, it is possible\
    \ to approximate all these declassifications conservatively by introducing a new\
    \ declassification $R(d) = \bigsqcup R(d)$ and $P(d)$. Any flow legal through\
