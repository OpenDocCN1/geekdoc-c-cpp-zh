- pgno: 134
  md: '# Chapter 5


    # Path Conditions


    # 5.1 Introduction


    The previous chapter presented our precise approach for information flow control.
    But no matter how precise the information flow analysis is, it will always answer
    a binary question only — whether illegal flow between two program points is possible,
    or whether this is definitely not the case. It may even be able to track down
    the source point making trouble, but still lack to provide insight into the specific
    conditions of the security violation. In particular, information flow control
    mechanisms do not provide "counter examples", e.g. in the form of input values
    that make the security violation visible.


    This chapter will present two approaches to exactly that, based on the concept
    of a static path condition [Sn96, RS02, SRK06], which is a precise condition that
    needs to be satisfiable for information flow between two program points to be
    possible. Such a condition can be unsatisfiable, which means that the constraint
    solver finds the given information flow impossible and was a false positive in
    the original analysis, or simplifies the condition to input variable bindings
    that trigger that flow. This chapter extends this notion in two dimensions: First,
    the concept of a static path condition is extended to the object-oriented features
    of Java, which impose additional difficulties due to the dynamic nature of types
    through instanceof, dynamic dispatch and exceptions. However, our approach relies
    solely on static program analysis and thus allows generating precise conditions
    for illicit information flow, that say why this flow takes place, together with
    a set of input values that allow reproduction of that illicit flow.


    Second, a dynamic variant of path conditions is presented that combines traditional
    static path conditions with dynamic analyses like dynamic slicing and information
    collected by program instrumentation. Dynamic slicing yields significantly smaller
    sets of conditions than static slicing, therefore the dynamic path conditions
    allow a precise post-mortem analysis of a failed program run and might even be
    leveraged for analyzing how illicit information flow occurred, after prevention
    by a dynamic flow control mechanism.'
