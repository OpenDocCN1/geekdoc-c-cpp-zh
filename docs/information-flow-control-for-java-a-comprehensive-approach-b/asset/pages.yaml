    inserted when computing control dependence and ignored for other analyses.


    # Data Dependence


    Originally [FOW87], data dependence comprised several types of dependences like
    flow dependence, output dependence and anti-dependence, but for the purpose of
    slicing, usually only flow dependence is relevant. For that reason, the term data
    dependence is used interchangeably with flow dependence in that context. The intuition
    between a flow dependence $x \xrightarrow{def} y$ is that $x$ computes a value
    that may be used at node $y$ in some feasible execution. In some cases, a distinction
    between loop-carried and loop-independent dependences is made, representing if
    the dependence may or may not arise as a result of loop iterations. In the sequel,
    data dependence will stand for loop-carried or -independent flow dependence. In
