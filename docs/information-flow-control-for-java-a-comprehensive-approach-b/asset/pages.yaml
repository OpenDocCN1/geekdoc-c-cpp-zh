  md: '# Chapter 6


    # Implementation


    All the analyses described in this thesis have been implemented. Figure 6.1 shows
    the architecture of the Valsoft/Joana. This set of tools comprises several techniques
    for precise analysis of security properties. Other applications for the base techniques
    like slicing have been proposed in literature ([BG96, dL01, HH01, BH04, Kri05,
    MM07]) but are beyond the scope of this thesis. The components of this design
    are described in more detail in the following sections.


    # 6.1 Frontends


    Currently, SDGs are constructed for both C and Java code. We extended the commercial
    slicer system CodeSurfer [ART03] with a plugin that creates files compatible with
    our graph format. This approach complements the Valsoft SDG generator created
    previously in our group [Kri03a]. Adding a commercial product to our tool suite
    naturally makes it more mature, however, CodeSurfer is deemed unsound for very
    large programs [And08]. The challenge in extending CodeSurfer dependencies arises
    as slicing forms a basis for path conditions. Path conditions require a fine-grained
    SDG structure similar to an abstract syntax tree, but CodeSurfer supports only
    coarse-grained SDGs. Yet, CodeSurfer grants access to a control flow graph, which
    after postprocessing of its dependence graph gathers with the CFG yields.


    For Java, this thesis defines a precise representation of bytecode programs (chapter
    2), and our generator reflects this. It is based on the Horizon intermediate representation
    of bytecode, Fx compiler from MIT. This framework operates on SSA-based representation
    and inserts explicit checks at all instructions possibly throwing exceptions,
    that control flow due to implicit and explicit exceptions is conservatively modeled.
    From there, our tool generates fine-grained (for path conditions) and coarse-grained
    (for all other analyses) dependence graphs. First, a pointer analysis determines
    the call graph and points to relations, after that the dependence graph for each
    method is


