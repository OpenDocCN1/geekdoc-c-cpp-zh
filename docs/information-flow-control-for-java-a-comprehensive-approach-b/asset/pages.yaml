  md: '# CHAPTER 5. PATH CONDITIONS


    The dynamic slice is generally much smaller than the static slice and thus, a
    smaller set of statements has to be examined. If a statement in the slice is suspicious,
    a path condition can be computed between the suspicious and the fatal statement.
    Path condition generation is based on a chop between the suspicious and the fatal
    statement. The dynamic chop between these statements is again, generally much
    smaller than the static chop (chops the statements that participate in an influence
    from a source to a target statement). Thus, a dynamic chop contains a smaller
    number of paths between the two statements, leading to a less conservative path
    condition. Second, the observed values of program variables are transformed into
    additional logical constraints, which, when conjunctive, allow the precise reconstruction
    of path conditions.


    This dynamic path allows the precise reconstruction of the scenario that led to
    the fatal error (post-mortem analysis). If the dynamic path is unsatisfiable,
    there was definitely no influence between the statements even though the dynamic
    chop indicated otherwise. But if the path condition is satisfiable, it serves
    as a “witness” for the illegal flow: A constraint solver will resolve the path
    condition to input values which triggered the illegal flow. These input values
    can be given to the program again and the influence becomes once more. In case
    of safety violations, these input values serve as witnesses for the illegal behavior.


    # 5.4.1 Program Tracing


    Trace data, also known as a protocol of variable bindings and their de-uses, plays
