  md: '# 3.5. RELATED WORK


    # 3.5 Related Work


    Nanda [NR00] adapted this for programs where threads are interleaved with loops.
    This paper targets cobegin/coend thread spawning which allows an optimization
    that may improve precision but only allows a fixed number of threads. Thus, an
    adaptation to Java''s dynamic creation cannot be easily done.


    Chen and Xu [CX01a] propose another exponential execution, but by this algorithm,
    however, inter-thread dependencies from the same deficiencies, it too, was proposed
    [CYX+00] for Ada with a fixed number of threads and inlining of method calls accessing
    shared variables. Again this cannot be done for recursive programs. It remains
    unclear how Java version models which may be started an unbounded number of times.


    In [Kr03b], Krinke extended his approach to procedural programs. While this algorithm
    can still uses a fixed number of threads cannot be applied to Java.


    In her thesis [Nan01], Nanda, too, extended her approach to programs with method
    calls and fork-joining. All approaches using a fixed number of threads she duplicates
    a procedure for every thread Furthermore she presented a version of her two-phase
    algorithm which is context-sensitive and does not allow time travel


    A detailed discussion of Krinke [Kr03b] and Nanda''s [Nan01, NR00] precise algorithms
    can be done in [GH09]. The authors provide solutions to several shortcomings of
    the previous algorithms, most dramatically thread creation in loops. Krinke and
    Nanda did not fully support. In new optimization techniques, slicing remains expensive
    (in number of threads), and the experiments in [GH09] indicate that preventing
    time travel should only be applied as a post-processing step, when cheaper methods
    like the iterative two-phase slice fail at establishing a desired property.


    Zhao and Li [ZL04] present the concurrent dependence graph (CPDG), featuring the
