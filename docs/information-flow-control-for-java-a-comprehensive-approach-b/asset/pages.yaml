    # Third Party Code


    A problem known in static program analysis arises for dynamic analyses as well:
    Libraries (especially provided by a third party) usually do not provide source
    code nor the debugging information needed to collect tracing data. I.e. any side-effect
    produced by a library call does not generate the tracing information to produce
    correct dependencies. When the debugging information is extracted from the SDG
    that problem arises already during construction of the SDG. But even if one did
    not depend on a static dependence graph would face the same problem.


    A possible solution has been employed by static analysis designers for some years
    now: One writes stubs for those library methods and conservatively adds the summary
    dependencies at the invocation point.


    # Incomplete Traces


    Besides the problem of third party code, other reasons exist, why a trace could
    be incomplete: Either the tracer loses information, maybe by purpose or because
    of limitations of the tracing approach. But it depends on the whether of the traced
    data suffices to gain sound results. As mentioned at the beginning of this section,
    our goals are dynamic slicing re: chopping (cf. Section 5.4.2) and the refinement
    of conditions with dynamic variable data (cf. Section 5.4.3).


    Dynamic slicing does not depend on the actual values of variables but the def-use
    relations will most probably lead to false dependencies and incorrect dynamic
    slices. As an example consider Figure 5.8. In the left protocol line 10 depends
    on the definition in line 8, this entry has been missed in the protocol on the
    right. The dynamic slice will determine a dependence to line 3 then, which is
    incorrect.


