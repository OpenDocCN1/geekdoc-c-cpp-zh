    # Interprocedural Exceptions


    Java supports two types of exceptions: Unchecked and checked exceptions. The former
    are any subtype of RuntimeException with the main purpose of signaling a problem
    of bytecode interpretation. Most bytecode instructions involving object references
    and array access may example throw NullPointerExceptions or ArrayOutOfBoundsExceptions.
    Nearly every method in Java may throw an exception, and this special attention
    when modeling interprocedural exception handling. For each invocation site, our
    SDG contains two return nodes (one for the usual return value and one for an exception)
    and two successors: if one method terminates normally and the other by termination
    due to an exception [CPS+99]. Those two successors are dependent on the call site.
    However, the predicate of the call is not the result of the call but by the call
    site. In our SDG it corresponds to the term $exc \neq null$, where $exc$ is the
    variable that stores the caught exception. Therefore, the control dependencies
    can be viewed as the conditions which lead or do not lead to abrupt termination.^6
    In a conservative approximation, these conditions can be set to true, assuming
    both cases are feasible.


    A precise modeling retraces the conditions for abrupt termination to occur. This
    corresponds to the return value node for normal termination, and the exception
    node for abrupt termination, respectively. Considering Figure 5.7\figure:5.7 again,
    the print statement is only executed, if exceptionMethod terminates normally.
    As we have already seen, all exceptions in exceptionMethod are caught, so the
    print statement is executed, the PC for normal termination of exceptionMethod
    reduces to true.


    # 5.3.2 Concurrency


    Another important feature of Java, namely concurrency, has been addressed in previous
    work [SRK06] to generate conditions in the presence of concurrency: Interference
    dependence (inter-thread data dependence) can either be treated like usual data
    dependence. However, since interference is not transitive, this will result in
    only conservative executions. Alternatively, so-called threaded witness threads,
    are valid paths for path condition computation, which requires more expensive
    slicing and chopping algorithms. An evaluation of precise concurrent slicing algorithms
    can be found in Giffhorn and Hammer''s work [GH09].


