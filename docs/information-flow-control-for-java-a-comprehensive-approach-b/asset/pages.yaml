    # 2.3.3 Aliasing


    For our application program slicing points-to-relations is mainly required for
    aliasing. Two references are said to be aliased [HLW+91] if they point to the
    same memory cell. We distinguish two flavors of aliasing:


    Definition 2.15 (Aliasing). Two references are must-aliased, if they point to
    the same memory cell in every execution of the program; they may be-aliased, if
    they point to the same memory cell in some executions of the program.


    May-aliasing is needed when computing data dependences, where a dependence must
    be inserted if the two statements access the same memory cell. May-aliasing allows
    strong updates (i.e. insertion into the kill-set of an update) and thus reduces
    the number of spurious dependencies. However, aliasing is known to be statically
    undecidable [Ram94], so conservative approximations must be applied. In practice
    this means a subset of the must-aliases and these strong updates can be determined,
    some spurious dependencies remain in the dependency graph. And for-aliasing, one
    must find a superset of all definitive may-aliases, in order to get all possible
    data dependences.


    May-aliasing based on points-to-relations is easily determined, even that points-to
    and aliasing are sometimes used interchangeably.


    Definition 2.16 (May-aliasing). For two references [pointers] of p and q,

    may-alias(p,q) := (points-to(p) ∩ points-to(q) ≠ ∅)


    Little work can be found on must-aliasing, probably because points-to is already
    hard for realistic languages and often local reasoning is sufficient. Must-aliasing
    is hard to determine, as the points-to relation is already a conservative approximation
    (specifically due to flowsensitivity). One problem lies in the fact that each
    allocation site in the points-to stands for an equivalence class of dynamic allocations
    that are possible at runtime. For example, an allocation in a loop can create
    an unbounded number'
