  md: '# 2.3. POINTS-TO-ANALYSIS


    # 2.3.2 Inter-procedural Analysis and Dynamic Dispatch


    For inter-procedural analysis, the predominant implementation technique is graph
    cloning, i.e. one adds a points-to-graph for each procedure in each context. A
    method is the traditional calling context as [WL04]. Alternatively, for object-oriented
    languages the target of virtual method calls has been found effective as context
    [MRR02], which has been termed object-sensitive pointer analysis. Using calling
    for contexts is problematic in that it requires conservative approximations in
    recursion and often a computed call graph is needed, which hinders the fly computation.
    Therefore, using target objects as contexts is while more conservative for some
    cases practical, as no call graph is needed for computation and contexts not constructed
    in a complicated manner. Still, it has been efficient for many typical problems,
    like factory methods or containers, which context-insensitive analysis remains
    in too conservative way.


    Object-oriented languages like Java need points-to analysis, with the drawbacks
    that an additional analysis needs to be done in advance and that generated call
    graphs are typically relatively impressive. Alternatively, the call graph may
    be computed on the fly during points-to analysis. While this makes points-to considerably
    more complex, the generated call graph is accurate as the analysis itself, typically
    much precise than simple algorithms like class hierarchy (CHA) [DGC95] or more
    refined analyses like 0-CFA [GDC97], VTA [SHR00], Rapid Type Analysis (RTA) [BS96]
    and the CFA algorithm [TPU0].


    The algorithm to conservatively approximate dynamic binding on-the-fly during
    points-to analysis consists of [HBCC99, SS0b]:


    +   * Construct the initial points-to relations from assignments and statically
    dispatched method calls.


    +   * Propagate the points-to relations along the graph edges.


    +   * For each virtual call o(x1, ..., xn), determine the points-to(o) = {o1,
    ..., ok} in the current graph


    +   * Use static lookup to determine the call target $f_i$ of method $f_i(x1,
    ..., xn)$ and insert an edge from the call to its target $f_i$ in the call graph.


    +   * Connect the parameters and return value of the call to those of $f_i$ in
    the points-to graph, but only add an edge between the this-pointer of $f_i$ and
    $o_i$, instead of $o$. This last restriction guarantees points-to-relation is
    reached


    +   * Iterate until a fixed point of the points-to-relation is reached


    The high technical complexity of this algorithm – adaption of Lhoták [LH03] –
    when propagating points-to relations with a working algorithm, stems from the
    fact that the call targets $f_i$ usually have not yet been analyzed and need to
    be added to the points-to graph. This is even more true for call targets in $f_i$,
    which often need to be analyzed and added as well,'
