    # 5.4.2 Dynamic Slicing


    Dynamic slicing was introduced by Koret and Laski [KL88]. Dynamic slicing builds
    a dynamic dependence graph (DDG) from the real dependencies arising during program
    execution. Therefore, a dependence graph is usually considerably smaller than
    a static dependence graph, which has to rely on conservative approximations not
    to relinquish soundness.


    For illustration Figure 5.1 again. If the execution trace is 1,2,3,4,7,9 then
    the static slice of node 9 is the whole graph. The dynamic slice of 9 does, not
    contain the statements 1 and 5 as those did not contribute to the value of z in
    the given graph.


    Once a program trace has collected, dynamic slicing falls to two tasks: the preprocessing
    phase a dynamic dependence graph is generated by processing the collected data.
    In the slicing phase this graph is traversed to build the dynamic slice for the
    given slicing criterion.


    A naive approach to dynamic slicing would mark all statements encountered during
    program execution, reduce the static dependence graph to the corresponding nodes,
    and do static slicing on that graph. This approach is, however, imprecise which
    be illustrated on Figure 5.1: With the execution trace 1,2,3,4,7,9, the naive
    algorithm yields a dynamic slice that contains the whole graph. Node 5 had no
    effect on node 7, though, as the definition of b took place the use. So, nodes
    1 and 5 should not be in the dynamic slice.


    As a remedy, [AI90] proposed not to work on the static dependence graph but on
    the tracing protocol, which shows a linear program with all loops unrolled. From
    that the dynamic dependence graph needs to be computed. Its nodes usually represent
    basic blocks rather than single statements, which build the static variant. Dependencies
    point from a variable use to its last definition. It may be a bit confusing that
    dynamic edges are reversed compared to static edges. Dynamic (backward) slicing
    follows all edges starting from the slicing criterion:


    ```

    dB(y) = {x | y \to* x}

    ```'
