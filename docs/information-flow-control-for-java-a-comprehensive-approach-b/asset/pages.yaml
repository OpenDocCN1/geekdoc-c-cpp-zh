    #  4.1.1 Information Flow


    Information security has traditionally only considered the identity and origin
    of a software artifact and its user. An example is Bell and LaPadula [BL73, BL96]
    access control, which has become mandatory in all major operating systems. Other
    "classical" means include encryption, code signing, virus scanners, firewalls,
    automatic updates. However, all these means cannot assert security over the whole
    process of data (end-to-end security), but only check for violations at a point
    in the computation. The problem is that classical means only verify the identity
    and origin, but ignore the semantics of a piece of software. For an example, access
    control may only verify whether a user has the right to access certain public
    or confidential data. After releasing that data, it can no longer control if a
    program makes data public, because this would require the user to hope that a
    piece of software does not maliciously use its data, usually based on a company''s
    identity and reputation. However, in the past several have become public, even
    renown software producers have collected data on their users and send that back
    to their servers.


    As a remedy, based security can verify a security policy for a program''s information.
    An information flow policy defines the security requirements for a given system,
    rights and restrictions on how data may be used in a computation. The most desirable
    property is end-to-end security, where sensitive data is protected along the complete
    processing path [SRC84], e.g. from the file system (with access control), through
    data processing in a program, until it is finally presented to an authorized user.
    Since access control is integrated in all major operating systems, controlling
    the information flow during processing remains the grand challenge.


    #  4.1.2 Channels and Information Flow


    Lampson [Lam73] has identified three so called channels by which a program can
    transmit information to its environment: Legitimate channels are the declared
    formal outputs of the program, storage channels are other storage in the program''s
    non-local environment, and covert channels are any other means of transmitting
    information (i.e. not involving values in any of the system''s stores). A timing
    channel is an example of a covert channel where an attacker can retrieve information
    from measuring a program''s execution time. Timing channels have been successively
    exploited, e for RSA using the Chinese Remainder Theorem, to crack encryption
    in smart cards [Scho00].


    When it comes to transmitting information from a source to a channel, there are
    two major means for information flow:'
