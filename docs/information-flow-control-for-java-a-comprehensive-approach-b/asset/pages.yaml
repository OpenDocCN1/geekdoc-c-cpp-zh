- pgno: 12
  md: '# Zusammenfassung


    Trotz der derzeit Diskussion über Sicherheit in der Informatik können aktuelle
    Sicherheitstechniken zwar nur die Herkunft und Identität eines Software-Artefakte
    überprüfen. Die Semantik eines Artefakts wird nicht berücksichtigt, wodurch Trojanische
    Pferde, Würmer und andere Formen von bösartiger Software begünstigt. Doch die
    gegenwärtigen Netzwerke unserer Zeit werden diese Probleme umso gravierender.


    Informationskontrolle ist eine Technik, die die Sicherheit eines gegebenen Programms
    hinsichtlich einer Sicherheitspolitik überprüft. Im Gegensatz zu traditionellen
    Sicherheitstechnik berücksichtigt sie auch die Programmsemantik. Ein bekanntes
    Beispiel für eine Sicherheitspolitik, Nichtinterferenz, verlangt zum Beispiel,
    dass kleine Eingaben in öffentliche Ausgaben nicht einmal von geheimen Datenbank
    beeinflusst dürfen. Obwohl Informationsflüsse fließen, verwenden die eingesetzten
    Techniken einen sehr begrenzten Bereich der Forschung. Die Programanalyse nutzt
    hauptsächlich Typsysteme. Typsysteme öffnen die Tür für Programmanalyse als Form
    der Informationskontrolle, aber andere Techniken bieten höhere Präzision oder
    benötigen einen geringeren Annotationsaufwand, um die Sicherheitspolitik zu spezifizieren.


    Das sogenannte Program Slicing hat sich erwiesenmaßen stark mit Informationskontrolle
    und bietet mehrere Dimensionen, die Analysemöglichkeit erhöhen. Diese Arbeit implementiert
    ein präzises Modell von objektorientiertem Programmieren in einer klassischen
    Datenstruktur für Program Slicing, Systemhängigkeitsgraphen. Die Slicingalgorithmus
    wird dahingehend erweitert, dass sie präzise Informationskontrolle und, falls
    nötig, eine Möglichkeit zur Aufinhaltung der Information bietet. Pfadbindungen
    geben tiefere Einsicht, wie eine Anweisung eine andere beeinflussen kann. Sie
    ergeben somit Bedingungen für einen unstrukturierten Informationsfluss oder zeigen,
    dass ein vermuteter Fluss in Wirklichkeit möglich ist.


    Ob die präsentierte Analyse im Allgemeinen ist als ein Typsystem, zeigt eine Evaluation,
    die für die Sicherheit skaliert, deren Analyse wir beabsichtigen. Gleichzeitig
    reduziert dies der Aufwand deutlich, die Sicherheitspolitik zu spezifizieren.
    Das wichtigste Ergebnis dieser Arbeit ist allerdings, dass wir die erste Analyse
    bieten, die eine reale Programmiersprache zertifizieren kann: Unser System analysiert
    Java Bytecode in vollem Umfang.'
