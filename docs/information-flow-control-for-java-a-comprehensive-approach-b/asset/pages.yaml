    # Exploiting backward slices in type tests


    Path conditions for instanceof, described so far, are of limited practical, as
    they may contain types with no link to variable values (e.g. sel : B), and cannot
    serve as a witness. This section presents a new technique to transform such conditions
    into a form containing only program variables and values, which can be used to
    generate witnesses. The fundamental idea is to replace variables in runtime checks
    by their backward slice.


    The conditions in the last section contained of the form M_{CF}(e : γ) for some
    type γ, that are naturally type checks. Program slicing offers a means to replace
    these conditions with terms that only reference program variables. The term e
    : γ depends on the last definition of e and evaluate to true only if e has been
    assigned an instance of γ. The program dependence graph allows to resolve paths
    from which γ-allocations reach a data slice [BGS97], or more precisely, the statements
    in a thin slice [SFB07]. In a backward slice, only data dependencies and parameter
    edges are traversed, but control dependencies are not. This variant yields only
    those statements whose value may have an influence on the slicing criterion. The
    thin slice is even more restrictive, that it only computes value flow, i.e. those
    statements that define a value that is used at the criterion node, which is exactly
    what we are interested in.


    The following steps are to be taken to generate this refined path condition:


    +   1. Determine the basic path condition p according to Algorithm 10 in section
    5.3.2


    +   2. Compute the backward data slice or thin slice for the parameter e of the
    instanceof γ operator


    +   3. For each type in p extract the allocation sites of that type from the slice


    +   4. Concatenate the path conditions from the program''s start node to end of
    these allocation sites and from the instanceof expression with logical or


    +   5. Replace the dynamic type checks in the basic path condition with the term
    generated in the last step.'
