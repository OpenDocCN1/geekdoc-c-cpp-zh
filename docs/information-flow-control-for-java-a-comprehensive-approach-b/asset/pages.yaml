    # 4.6.1 Context-Sensitive Slicing


    To avoid such alarms, an approach based on context-sensitive slicing (see 2.2.2)
    must be used: not every SDG path is allowed in a slice, but only reachable paths.
    Realistic paths require that the actual parameter nodes to/a function, which are
    on the path, belong to the same call statement.¹³


