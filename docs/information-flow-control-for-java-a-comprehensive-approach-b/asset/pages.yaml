    # 4.7 Declassification


    IFC as described is far too simplistic because in some situations one might accept
    that information with a higher security level to a "lower" channel. instance,
    information may be published after statistical anonymization, secret data may
    be transferred over the Internet using encryption, and in electronic commerce
    needs to release secret data after its purchase. Declassification allows to lower
    the security level of incoming information as a means to relax the security policy.
    The password checking method presented earlier is another example: as passwords
    are encrypted, it does not matter information from the password table to the visible
    result, and hence a declassification to public at node 14 (where the illegal flow
    was discovered, section 4.5) is appropriate – a password-based authentication
    mechanism necessarily reveals something about the secret password.$^{17}$


    When allowing such exceptions to the basic security policy, one major concern
    is that exceptions might introduce unforeseen information release. Several approaches
    for a semantics of declassification were proposed, each focusing on certain aspects
    of "secure" declassification. The current state of the art describes four dimensions
    of declassification according to where, who, when and what can be declassified
    [SS05] from that, some basic principles are presented that can serve as "sanity
    checks" for semantic security policies allowing declassifications. These principles
    are 1. semantic consistency, which is basically invariance without semantics-preserving
    transformations; 2. conservatism, i.e. without declassification, security reduces
    to noninterference; 3. monotonicity of release, which states that adding declassification
    should not render a secure program insecure; 4. non-occlusion which requires that
    declassification operations cannot mask other information release.


    # 4.7.1 Declassification in SDGs


    We model declassification by specifying certain SDG nodes to be declassification
    nodes. Let $D \subseteq N$ be the set of declassification nodes. A declassification
    node $x \in D$ must have a required and a provided security level:


    ```

    $x \in D \Rightarrow (x \in dom(P) \cap dom(R)) \wedge (R(x) \geq P(x)) \quad
    (4.18)$

    ```


    Information revealing $x$ with a maximal security level $R(x)$ is lower (de-classified)
    to $P(x)$ (note that $R(x) \not\geq P(x)$ does not make any sense,


    > $^{17}$We all know that password crackers can exploit this approach in case
    weak passwords are used, hence just adding a declassification seems naive. Additional
    techniques to protect the table are needed.


