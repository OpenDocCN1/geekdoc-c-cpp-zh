  md: '# CHAPTER 5. PATH CONDITIONS


    # 5.4.4 Related Work


    Symbolic execution is a technique that executes a program with symbols instead
    of concrete values for the parameters. During execution, a predicate Φ (initially
    true) binds to constrain the values. When a branch is taken, the predicate is
    updated to reflect the condition for that branch. As it represents the conditions
    for the current path through the CFG, it is often called *path condition* as well,
    as it represents the condition for taking a specific path, it is more than an
    execution condition in our work. Today''s systems for symbolic execution are mainly
    based on theorem provers or model checkers. Theorem prover based systems like
    in ESC/Java [FLL02] require manual annotations to generate verification conditions,
    while our approach allows them fully automatically. Other systems rely on model
    checkers [DRH07] which are semi-automatic but can cope with state explosion. Most
    symbolic execution systems perform a per-method analysis only, while our approach
    automatically generates procedural conditions.


    Recent work by J has been using path slicing [JM05] as input towards the CFG and
    eliminates all the operations that are irrelevant towards the target location.
    The result is a condition for the reachability of the target location, its insufficiency
    is sufficient for the infeasibility of the path. The technique does not work on
    the PD but on the CFG only. It has shown effective for elimination of counterexamples
    provided by the model checker Blast. For our application this approach does not
    seem beneficial as to check each path on its own, which produces a necessary condition
    for all paths between two statements and share common subsets.


    Parametric slicing [FRT95] allows specification of constraints over the program''s
    input. A returning system generates program slice satisfying these constraints.
    Conditional program slicing [CCL08] is a similar technique that slices based on
    a first order logic formula on the input variables. The conditioned slice is on
    deleting statements while preserving the program''s behavior. Both differ from
    path conditions in that they do not determine input values but take them as input.
    In contrast, path conditions provide a logic formula that must be satisfied for
    an information to be feasible. Constraint solvers reduce this condition to input
    values that satisfy the formula.


    Boolean paths as presented in this work and in [Sne96, RS02, Bob05] cannot express
    temporal properties. For example, they cannot express that it is necessary for
    a flow loop condition that holds and later it no longer, such that the loop terminates.
    Boolean conditions become conservative when analyzing loops and conditions that
    involve loop variables. A recent approach by Lochbiler and Snelting [LS09] extends
    path conditions with temporal logic to circumvent these imprecisions. Witnesses
    are created by model checking instead of constraint solvers.


    Dynamic Analyses Correctly and efficiently collecting trace data is a nontrivial
    task. Several solutions have been proposed in literature:


