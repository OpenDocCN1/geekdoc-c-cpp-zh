  md: '# 3.1. THE JAVA MEMORY MODEL


    access (reads or writes) to the same variable are said to be *conflicting*, if
    at least one is a write. An *inter-thread action* is an action by one thread,
    that can be detected or directly influenced by another thread. The inter-thread
    actions include reads and writes to variables, locks and unlocks of monitors [Hoa74]
    as short-term scheduling means, and starting and joining of threads. Mid-term
    scheduling is provided via Bunch-Hansen style [BIH73] signal-and-continue [How76]
    notify/notifyAll.


    The JMM guarantees visibility of results between two inter-thread actions only
    if they are ordered by a partial ordering called *happens-before*. If two actions
    are not ordered by happens-before, the JVM may reorder them arbitrarily which
    allows compiler optimizations. Two conflicting accesses are said to form a data
    race (also, *race condition*), if they are not ordered by happens-before. A correctly
    synchronized program in Java exhibits no data races.


    Happens-before is defined by the rules [GJSB05, GPB06]:


    **Program order** defines that each action in a thread happens-before every action
    in that thread that follows in the program order.


    **Monitor lock** unlock on a monitor lock happens-before every subsequent lock
    on the same monitor.⁴


    **Volatile variable** A read to a volatile variable happens-before every subsequent
    read on that same variable.


    **Thread start** A call to `Thread.start` happens-before every action in the started


    thread.


    **Thread termination** Any action in a thread happens-before any other thread
    detects that the thread has terminated through `join` or `isAlive` of class


    Thread.


    **Interruption** A thread calling `interrupt` on another thread happens-before
    the interrupted thread detects the interrupt through an `InterruptedException`
    or is`isInterrupted` or interrupted.


    **Finalizer** The end of a constructor happens-before the start of a finalizer
    for that object.


    **Transitivity** Happens-before is transitive.

    The transitive rule with program order makes synchronization on the same variable
    possible a fence instruction, all actions in one thread before a lock release
    are visible in the other thread after its subsequent acquisition. The same holds
    for a write and a read of a volatile variable. However, if two threads synchronize
    on different locks, there is no happens-before relation and therefore no ordering
    required.


    > ⁴This rule includes wait/notify synchronization, due to the implicit unlocking
    of wait.'
