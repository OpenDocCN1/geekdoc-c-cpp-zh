  md: '# CHAPTER 4. INFORMATION FLOW CONTROL


    # ## 4.9.4 Static analysis for security


    Static analysis is often used for source code security analysis [CM04]. For example,
    information flow control is closely related to tainted variable analysis. There
    are even approaches like the one from Pistoa et al. [PFKS05] for slicing analysis
    and the one from Livshits and Lam [LL03, LL05] use IPSSA, a representation very
    similar to dependency graphs. However, these analyse only a trivial security level
    (tainted/untainted) with a trivial declassification (untaint) and could greatly
    benefit from our approach. Scholtz et al. [SZC08] present a static analysis that
    tracks user input on a data structure similar to a dependency graph. Like our
    analysis, it is defined as a dataflow analysis framework and reduce the constraint
    system using properties of SSA form. Again, this is targeted to bug tracking and
    taint analysis.


    Pistoia et al. [PCFY07] survey recent methods for static analysis of security
    problems. They focus on stack and role-based access control, information flow
    and API control. A unified access-control and integrity checker for information-based
    access control, an extension of Java''s stack-based access control mechanism has
    been proposed in [PS07]. They show that an implicit policy can be extracted from
    the access control policy, and that the access control enforces integrity policy.


    Another approach is to use path conditions (as sketched in section 4.8.3) in order
    to obtain more semantically convincing characterizations and context constraints
    for sound declassification. Our approach to declassification currently not offer
    per-checks of semantic properties as stipulated by SS05], but will rely on path
    conditions to provide necessary conditions for a declassification to take place.
    This approach falls into the category “how” declassification may occur, which
    has not yet been extensively researched.


    For multithreaded programs, PDGs need not only check for classic noninterference,
    but eventually for possible or probabilistic noninterference. Details of this
    novel technique will be presented by Giffhorn and Lochbihler [GL].'
