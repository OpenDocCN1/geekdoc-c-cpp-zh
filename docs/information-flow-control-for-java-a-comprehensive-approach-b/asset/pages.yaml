  md: '# CHAPTER 3. CONCURRENCY


    # 3.4.1 Iterative two-phase SummarySlicer


    A straightforward extension of two-phase slicing makes this algorithm correct
    for slicing cDGs. As a remedy, each an interference edge is traversed, its source
    node (i.e. the node in the other thread) is marked as an synthetic slicing criterion,
    which means that it will be processed in the first phase of the slicing algorithm,
    even if the target node of the interference edge was processed in the second phase.
    A highly optimized pseudocode for it is given in Algorithm 6. The iterative two-phase
    slicing traverses each node and edge in the SDG at most twice, and thus has the
    worst case complexity as the original phase slicing algorithm by Horwitz et al.
    [HH90]. Its running time can be minimized, if all nodes that are to be traversed
    in the first phase are removed from the worklist before those two phase, as nodes
    found in the first phase will not need to be checked again.


    Applied to the example program in Figure 3.6, it initializes its workload W to
    the print node. This node is also included into a M where it maps to true, meaning
    that it has been traversed in phase 1. It marks the nodes as Zhao''s algorithm,
    traversing the parameter edge to the return statement of it, the return node is
    marked with false to indicate phase 2. No more nodes in phase 1 are available,
    so this node is taken from the worklist. Itcom incoming edges the method header
    get for phase 2 and the assignment to a.x for phase 1, as it is reached via interference.
    So this assignment node comes next, and its header node set is included into the
    slice marked with phase 1. Now we may ascend into the calling method and mark.run
    for phase 2. All remaining nodes in the worklist do not change the slice or marking.
    So the slice for the print statement is the whole graph, as expected.


    Nanda had presented the first algorithm for iterative two-phase slicing consisting
    of two nested loops. Iterative two-phase slicing preserves context-sensitivity
    in each thread in isolation but breaks the calling contexts when crossing thread
    boundaries via interference dependence, but this is sound but not perfect.


    # 3.4.2 Time Travel


    Krinke [Tri98] first noticed that interference dependence is not transitive, in
    contrast to data dependence. With iterated two-phase slicing, it is possible to
    reenter a thread via interference that was previously left interference. However,
    as interference is determined without taking possible control flow into account,
    traversing interference several times may correspond to control flow that is impossible
    in any valid program execution. In practice, the node of reentrance must execute
    before the node that thread was previously left. Otherwise, this would correspond
    to a so-called "time travel" situation, where a value is dependent on a statement
    that will be executed in the future.


    > 10Provided all necessary dependence types are included.


