- pgno: 14
  md: '# # Abstract


    Despite the current discussion on security in computer science, current security
    mechanisms can only validate origin and identity of a software artifact. The semantics
    of an artifact are not taken into account, giving rise to all forms of trojan
    horses, worms and other malware. With the ubiquitity of networks in modern life,
    these problems become all the more serious.


    Information flow control is a technique to assert the security of a given program
    with respect to a security policy. In contrast to traditional security, it also
    takes the program semantics into account. The most prominent example is from secret
    input. While output of a program may not flow to public output; in fact, public
    output may not be influenced from secret input. Techniques for checking security
    policies only intensively researched in the last decade, leverage a very restricted
    part of program analysis technology, mostly type systems. While type systems were
    a successful door opener for program analysis as a means of information flow control,
    other techniques offer higher precision or lower annotation burden for specifying
    the security policy.


    A technique called program slicing has been shown closely connected to information
    flow control and offers many dimensions for improving analysis precision. This
    thesis presents a precise model for object-oriented programs in a classic data
    structure for slicing; the system dependence graph. It extends the algorithms
    for program slicing to allow for precise information control and provides a means
    to downgrade secure information, if necessary. Path conditions provide further
    insight into how one statements influence another. They may lead to conditions
    for illicit information flow, or may provide evidence that an assumed flow is
    impossible.


    While the presented analysis is clearly more expensive than type systems, an evaluation
    shows that our techniques scale well to the security kernels we have in mind.
    At the same time, the burden for specifying the security policy is reduced significantly.
    But most importantly, we offer the first security analysis that can certify programs
    written in a realistic programming language: Our system can analyze full Java
    bytecode.'
