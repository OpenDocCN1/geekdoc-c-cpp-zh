  md: '# 1.2. DIMENSIONS OF PROGRAM ANALYSIS


    gram. This holds even more for security analysis, where one wants to ensure that
    any security violation in the program is actually found.


    **Precision** requires that only those cases that satisfy the given property are
    reported. For security analyses, it means that there are no false alarms: any
    program condemned by the analysis must contain a security leak.


    **Scalability** demands that the analysis can handle realistic programs (e.g.
    100 kLOC), written in realistic languages (e.g. Java bytecode).


    **Practability** demands that the analysis is easy to use. This property concerns
    precision, as users are aware of excessive false positives; but it also entails
    little user interaction (i.e. a low number of program annotations), and understandable
    descriptions of the analysis results.


    Unfortunately, in consequence of the aforementioned undecidability result, any
    program analysis can only guarantee correctness or precision. Hence, correct algorithms
    are **conservative approximations**: The analysis is guaranteed to determine all
    cases that satisfy the given property, but the result will contain some spurious
    cases. These spurious cases do not satisfy the property and are often referred
    to as **false positives**. For purposes like testing or bug finding, one often
    trades off precision for scalability. In these applications it is more important
    to find the majority of the problems fast and to keep the false positive rate
    very low, as manual inspection is tedious. In contrast, this generally opts for
    correct analyses, which is paramount for security purposes. Although correctness
    prevails for our purposes, we must nonetheless optimize precision. The most prominent
    dimensions of precision in contemporary program analysis are presented in the
    next section. Note that precision also influences scalability: better precision
    means worse scalability; fast algorithms are not precise. Yet, this is only a
    rule of thumb: Sometimes increased precision removes excess overhead resulting
    from imprecision, which compensates for the increased complexity.


    # 1.2 Dimensions of Program Analysis


    Due to the conflicting requirements presented before, designing a program analysis
    always constitutes a trade-off between speed and precision. This section will
    discuss the major dimensions of precision of program analysis research. In the
    field of program analysis a large collection of techniques has been developed
    that the engineer can choose from a spectrum between imprecise/precise/expensive
    analysis algorithms; depending on the purpose of the analysis. In particular,
    the engineer can choose whether an analysis should respect:


    **Flow-sensitivity** An analysis is called flow-sensitive if it accounts for the
    control flow inside a method. Usually a separate solution is computed for each
    program point. Flow-insensitive analysis ignores the intra-procedural'
