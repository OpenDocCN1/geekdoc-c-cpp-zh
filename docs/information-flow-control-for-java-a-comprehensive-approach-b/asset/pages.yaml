    # 5.3 Static Path Conditions for Java


    In this section, we present the first path condition generator for Java which
    relies solely on static analysis. Naturally, the main problem in generalizing
    path conditions from procedural languages like C was the merging of object-oriented
    features such as dynamic dispatch and type checks.


    # 5.3.1 Overview


    Path conditions are generated according to all possible dependence paths from
    the source to the target point and a constraint solver reduces these conditions
    to input values that trigger information flow between these two points. Such input
    values have been named ''witnesses'' in [SRK06], and may be quite helpful e.g.
    in law suits concerning security violations. However, [SRK06] only defines path
    conditions for procedural languages. A naive integration of object-oriented constructs
    in path conditions suffers from these conditions containing dynamic type checks,
    which constraint solvers cannot simplify statically. This witnesses cannot be
    generated, rendering these path conditions only a first step towards realistic
    applications.


    This section presents a detailed study of object-oriented language constructs
    based on Java''s language specification, as well as solutions for integration
    into a path condition that contains only program variables and values. We start
    discussing dynamic type checks a instanceof and extend the solutions based on
    dynamic dispatch and exception handling. These checks can be approximated conservatively,
    or by using program slicing — transformed into a subcondition that no longer involves
    the program''s but but generate realistic path conditions for Java. These conditions
