- pgno: 160
  md: '# 5.4. DYNAMIC PATH CONDITIONS IN DEPENDENCE GRAPHS


    Venkatesh [Ven95] implemented a low level approach for tracing C programs. His
    prototype implementation called SLICE instruments the source code to write a program
    trace during execution. With this experience, the authors recommend object-code
    instrumentation for future implementations together with several reasons. Nonetheless,
    this implementation is faster than tracing with a traditional debugger.


    Zhang et al. [ZGZ03] follow a different low-level approach to create a program
    trace: the program is compiled with the Trimaran system, a compiler for the Explicitly
    Parallel Instrumentation Computing (EPIC). An interpreter takes the generated
    object-code and creates the program trace during execution. Since C programs are
    not properly instrumented, this approach is valid mostly for theoretical evaluations.


    All low-level approaches generally not slow down program execution as much as
    a debugger does. However, as our work is on the static dependence graph which
    must be mappable to source, these approaches do not suit our needs.


    Dynamic program slicing has been in active research for several years. Various
    approaches, either for dynamic slicing on their own, or with static elements have
    been proposed. To mention all of them would be out of scope of this work:


    Chen et al. [CX01b] describe a dynamic slicing algorithm that is based on a static
    SDG providing the information to set break points for the debugger. The static
    dependence graph is confined to the nodes and edges that have been visited to
    build the dynamic dependence graph. Slicing is done following all edges in graph.


    > Tip95 embarks on a different strategy: He uses the abstract syntax tree (AST)
    instead of a dependence graph and interprets the program. The approach is language
    independent but only available for the custom-built language ''L''.


    Zhang et al. proposed another way to reduce the amount of data that is stored
    in the program trace. They compute the dynamic slices during execution and store
    them in binary decision graphs (BDDs) [ZGZ04].


    Wang et al. [WRO04] propose a dynamic slicing technique for Java that compresses
    the trace on-the-fly and obtains two to three orders of magnitude compression
    algorithm. A lossless compression finds a high repetition pattern in the sequence
    of (memory and control) edges captured by the tracer. They also propose a dynamic
    slicing algorithm which operates directly on the compressed data and can save
    the uncompressing time. Such an algorithm may not only be suitable for languages
    with extensive pointer usage. We expect the repetition pattern for our variable
    trace to yield a similar compression rate. Since the slicing algorithm runs on
    the compressed data with no dynamic dependence graph used, multiple slicing requests
    requiring the trace multiple times at a significant time overhead.'
