    # 2.5.2 Interprocedural Analysis


    The previous section only determined side-effects up to method boundaries. The
    next step must determine these side-effects up to the graph level. This involves
    propagating side-effects all call sites and then again from the actual parameters
    if necessary. A fixed point iteration is required until all side-effects have
    been propagated to methods that transitively call them. Before going into the
    technical descriptions, we define the function to call sites such that Param(m,c)
    returns all locations that are passed to call method c which resides in method
    m. We assume temporary variables are leveraged when a complex expression is passed
    to c and in cases of parameterising. For example, the call f(x+y) is replaced
    by t = x+y; f(t), where t is a field. When c call method m'' then the function
    bind(m,c) -> Param(m'',c) returns the actual parameter of c that corresponds to
    the formal parameter of method m''. For convenience, we extend this to sets, where
    the set of actual parameters considering given set of parameters is returned as
    sets.


    Since the global GRef and GMod (defined in [Ban79,Muc97]), we can determine the
    side-effects of IRef_ and IMod_ (as defined in the detected method called at a
    call site according to the following definitions:


    ```

    CRef = {(m, c, t) | t ∈ bind_{m,c,m''}(GRef(m''))} (2.6)

    CMod = {(m, c, t) | t ∈ bind_{m,c,m''}(GMod(m''))} (2.7)

    ```


    For convenience, we define the curved versions CRef(m,c) = {t | (m, c, t) ∈ CRef}
    and CMod(m,c) = {t | (m, c, t) ∈ CMod}. Intuitively, CRef and CMod represent the
    set of side-effects IRef and IMod of the possibly called methods m'' at the call-site
    c, however with the formal names replaced'
