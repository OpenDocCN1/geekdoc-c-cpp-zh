    # Weak and Strong Path Conditions


    For a given chop between two statements $x, y$, one can usually define more than
    one path condition. Still, every instance is a necessary condition for information
    flow along the chop. To argue about quality, a partial order $\le$ is defined
    for the pair $(x, y)$


