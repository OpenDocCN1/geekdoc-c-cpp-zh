  md: '# 5.4. DYNAMIC PATH CONDITIONS IN DEPENDENCE GRAPHS


    # 5.4.3 Dynamic Path Conditions


    Refinement by Dynamic Chopping


    When constructing a path condition from a statement to another, all paths between
    these two statements are determined with a chop in the static dependence graph.
    As mentioned in Section 5.2.1, the accuracy of the path condition for the executed
    program can be increased if a dynamic chop is used instead. The dynamic dependence
    graph usually contains only the edges that actually place and thus this dynamic
    chop will yield a much smaller number of paths between these two statements.


    As an example, consider Figure 1. If the execution trace is 1,2,3,4,7,9 then the
    chop between 2 and 9 is 2,3,4,7,9. Statement 5 is never executed in this setting
    and thus be removed from the dynamic chop. A static chop would conservatively
    have to add it. With the dynamic chop one omits the paths 2,3,4,5,7,9 and 2,3,4,5,7,9
    in the path condition between 2 and 9.


    Although our path condition generator reuses partial information and thus half
    the number of paths does not yield 50% shorter path condition, this example also
    shows the impact of this refinement.


    # Refinement by Traced Values


    In order to strengthen a given path condition PC with runtime information, the
    trace is analyzed to retrieve the variable assignments. As the analyzed program
    went through a series of assignments during runtime, all of them have to be captured
    in a restrictive clause R. This clause, in turn, can be used to make path conditions
    stronger.


    First, the intersection V of variables used in the path condition PC and the trace
    T is determined:


    ```

    V = {v | v \in var(T) \intercap var(PC)}

    ```


    For each variable $v$ the values it carried during the trace are extracted, let
    $\beta(v)$ be the set of $w_i$ that $v$ has constrained:


    ```

    \beta(v) = (v = w_i) \vee (v = w_j) \vee \dots$

    ```


    Now the restrictive clause R can be described as the conjunction of all value
    sets:


    ```

    R = \bigwedge_{v_i \in V} \beta(v_i)

    ```


    In order to make the path condition PC stronger, the results from Section 5.2.1
    are used and both clauses are conjunctively combined


    ```

    PC'' = PC \wedge R

    ```


    yielding the stronger and thus more precise path condition PC''.


    Because of the SSA-like form, variables only match if their index numbers are
    the same, so that multiple assignments are handled. This makes mandatory'
