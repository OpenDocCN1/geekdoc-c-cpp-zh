  md: '# CHAPTER 2 DEPENDENCE GRAPHS AND SLICING FOR

    OBJECT-ORIENTED LANGUAGES


    # 2.2.1 Slicing in the PDG


    Lateern and Oppenstein [OO84] presented an alternative way of slicing: they reformulate
    slicing as a reachability analysis in a program representation called Program
    Dependence Graph (PDG) as defined by Ferrante et al. [FOW87]. In the PDG, slicing
    can be done in linear time with the number of statements, with a single backward-traversal
    of dependences between these statements (defined later). In contrast to the executable
    slices of Weiss''s algorithm, the PDG do not necessarily represent executable
    slices, i.e. the first property of a slice may be violated. The notion of a static
    slice with a PDG is rather the set of statements which directly or indirectly
    affect the slicing criterion. Thus the slice may not be syntactically correct,
    or may be missing, which changes the program semantics. To circumvent these restrictions,
    several extensions of slicing in PDGs were presented that also execute executable
    [BH93, CF94, Agr94, HD98, HLB96]


    The PDG is defined in terms of the control flow graph: it contains all the nodes
    of the CFG, Instead, nodes are connected by data and control dependences


    Control dependence exists between two statements, a statement directly controls
    the execution of the other statement. In structured programs, control dependence
    is equivalent to the nesting level of source code: Each statement is indented
    by the enclosing branch or loop point. In the presence of arbitrary control flow,
    control dependence is defined in terms of post-dominator [FOW87]. A node x in
    the CFG is post-dominated by y if all paths from x to END pass through y. Some
    definitions exclude the case that a node does postdominate itself


    # Definition 2.8 (Control Dependence). A node y is control dependent on node x
    (x→ y)


    +   * there exists a path p from x to y in the CFG, such that y post-dominates
    every node in p (except for x).,²

    * x is not post-dominated by y


    There is always an immediate post-dominator for each statement that has a post-dominator,
    i.e a post-dominator that does not dominate another post-dominator of the same
    statement. This can be depicted as a tree, where only the immediate post-dominator
    relation is depicted, post-dominance can be found by paths in the tree. As an
    example Figure 2.3, which shows the post-dominator tree (left) and the corresponding
    control dependence (sub)graph for the example program in Figure 2.2. For example,
    node 5 is immediately post-dominated by END. There is a control dependence 5 →cd
    7, as 7 can be avoided on the path from 5 to END, and 7 post-dominates all nodes
    on the path (5, 6, 7) except 5.


    > ²If post-dominance is not reflexive, then also for y


