  md: '# # Chapter 3


    # # Concurrency


    Both standard Java (JSE) and Java for embedded devices (J2ME) support several
    threads of execution at the same time, either virtually dispatched to a single
    processor or running concurrently on multiple multicore architectures. These threads
    share main memory, whereas the heap objects themselves. Threads in Java are integrated
    into the programming language itself, whereas languages need to include a multi-threading
    library that accesses native operating system routines. Therefore, threads in
    Java are much more system-independent than in other languages.


    As Java is an object-oriented language, each thread running in the Java VM is
    an object of the Thread class. There is no other way for a user to create a thread
    via a `Thread object` whose `start` method is invoked. In such a case, a new thread
    is spawned and the run method of this thread is executed. All threads share a
    single heap for objects of threads and their interactions consist of synchronous
    communication via shared variables (i.e., at least two threads share the reference
    to a heap memory).²


    Making threads independent of the base operating system required the definition
    of semantics for thread operations. Apart from that, the Java designers wanted
    to give compilers the ability to apply aggressive optimizations while at the same
    time giving programmers a kind of security. As a result, the `Java Memory Model
    (JMM)` was released on JSR-133 and incorporated into Java 1.5 [GSJB05].


    # ## 3.1 The New Java Memory Model


    A memory model answers the question on which conditions the value of a shared
    variable that has been previously (re)defined in another thread. With multicore
    having separate caches, it is no longer the case that one thread might ever, let
    alone immediately, the result of an operation


    > ¹In analogy to previous work, the term thread will mean a thread of execution
