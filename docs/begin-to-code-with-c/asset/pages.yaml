  md: "# Examining the Update method\n\nQuestion: What does the base.Update() method\
    \ call do?\n\nAnswer: It is often useful to call the method that is being overridden.\
    \ In this case, the Update method in FallingSprite can call the Update method\
    \ in MovingSprite to update the sprite position and add its own behaviors after\
    \ this has been performed.\n\nQuestion: Why does the method check to whether the\
    \ top of the sprite goes beyond the height of the viewport?\n\nAnswer: The Top\
    \ property of the sprite is the Y coordinate of the top line of the sprite. The\
    \ Y increases as we move down the screen. When the top of the sprite goes above\
    \ the viewport's height value, this means that the sprite has just gone beyond\
    \ the bottom of the viewport. At this point the sprite is no longer visible and\
    \ can be placed at the top of the screen again.\n\nQuestion: Why does the method\
    \ set the bottom of the sprite to 0 when it places it again at the top?\n\nAnswer:\
    \ Here, too, this is because the top of the screen has a Y coordinate of 0. We\
    \ want the sprite to move into view from the edge of the screen, which places\
    \ the sprite just above the top of the screen, ready to move down into view.\n\
    \n# Allowing methods to be overridden\n\nTo allow overriding to, we need to make\
    \ a tiny change to the MovingSprite parent class. We have to make the Update method\
    \ in the MovingSprite class a virtual method.\n\n```\npublic virtual void Update()\
    \ {\n    spriteValue.X = spriteValue.X + xSpeedValue;\n    spriteValue.Y = spriteValue.Y\
    \ + ySpeedValue;\n}\n```\n\nAdding the keyword virtual in front of the method\
    \ declaration makes it possible for a method in a child class to override that\
    \ and provide a different version of it. And that's what we want to do—we want\
    \ a sprite that moves, but must move in a particular way, and we have created\
    \ an Update behavior in a child class to get that form of movement."
  merge: -1
