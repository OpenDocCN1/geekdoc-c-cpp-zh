  md: "# Constructing structure values\n\nStructures can contain methods as well as\
    \ data members. This means structure types can contain code that will perform\
    \ tasks, and one of the tasks that it can perform is to set itself up.\n\nSo far\
    \ in our tuning-program, we are setting the values of structure variables “the\
    \ hard way.” A program needs to use three statements to create a new SongNote\
    \ and set its NotePitch and NoteDuration members:\n\n```\nSongNote note;\nnote.NotePitch\
    \ = 0;\nnote.NoteDuration = 0.4;\n```\n\nFortunately, C# provides a way of creating\
    \ a new structure object and setting its values at the same time. You do this\
    \ by giving the SongNote type a constructor method. A constructor is a method\
    \ that is itself a member of a structure. The constructor method for an object\
    \ has the same name as the object, in this case SongNote. An object can have lots\
    \ of different constructors, each of reflect a different way of setting the initial\
    \ values in structure.\n\n```\npublic struct SongNote\n{\n    public int NotePitch;\n\
    \    public double NoteDuration;\n\n    SongNote(int pitch, double duration)\n\
    \    {\n        NotePitch = pitch;\n        NoteDuration = duration;\n    }\n\
    }\n```\n\nThis constructor for the SongNote takes pitch and duration parameter\
    \ values and uses them to set up the members of the structure. We can use the\
    \ constructor when we create a new SongNote value:\n\n```\nSongNote note = new\
    \ SongNote(pitch: 0, duration: 0.4);\n```"
