  md: '# What you have learned


    In this chapter you have learned how to make gameplay using a program, and how
    even very simple game behaviors can create something fun and competitive to play.
    You have discovered how to get input into a game and use this to control the position
    of an object within a game environment. You have seen the importance of "clamping"
    to make sure objects stay within particular boundaries and how objects can be
    made by detecting when two of them interact. And you can now add sounds to make
    the gameplay even more enjoyable.


    You also discovered how to create and display text messages and use these as game
    objects in themselves. And you have investigated how computers generate random
    numbers and how these can be used in programs to create either random or predictable
    experiences for the game player.


    Here are some questions that you might want to ponder about game development.


    # Is this all about games?


    Absolutely not. To give just one example, the text manipulation that you saw in
    this chapter will serve you well in a lot of situations that have nothing to do
    with games. You could use this technique to display animated messages in any program.
    Users now expect animated behaviors in the user interface, and what you have learned
    provides a solid grounding in how a computer program can manipulate objects within
    a graphical environment. This is something you can build on if you create user
    interfaces with XAML (Extensible Application Markup Language), which I introduce
    in Chapter 16.


    # Does a game always have to look pretty?


    There is no doubt that artwork makes a game more enjoyable to play. But it is
    an undeniable fact that visuals alone do not make a game fun. The first computer
    games had the smallest possible number of graphical elements, and they were played
    by millions of people. And the history of computer games is littered with graphically
    beautiful creations that nobody liked because they weren''t very enjoyable.


    # How do I make a great game?


    My strong suggestions are to make something that works and then tinker with it.
    Always have a working version of your game for people to try, and listen carefully
    to their comments. Instead of waiting until you finish creating fifteen levels
    of game, get some people to play it when the first three are complete and then
    change the rest of the game in line with what they say. And don''t rely on opinions
    of your friends and family. They''re going to say they like your game because
    they like you. Your worst enemy has to concede that your game is quite fun to
    play, that''s when you know you have a winner on your hands. And keep trying.'
