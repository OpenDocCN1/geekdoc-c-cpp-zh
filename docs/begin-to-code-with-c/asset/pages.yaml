  md: "# Creating a video game\n\nToday we are going to start writing a game. To keep\
    \ things simple, we'll work in two dimensions—in other words, the objects in our\
    \ game will be flat. Xbox One games such as Halo provide, three-dimensional worlds\
    \ that players can explore and interact with. Our games will allow players only\
    \ to work with images on a flat screen.\n\nThis is not actually a game from a\
    \ gameplay perspective. Some of the most popular games, from Pong to Space Invaders\
    \ to Angry Birds, are two-dimensional. One of the lessons from this chapter will\
    \ be just how compelling a simple game can be.\n\nWe'll start by drawing some\
    \ game objects and getting them to move around and interact with one another.\
    \ We can then branch out into different forms of gameplay.\n\n# Games and game\
    \ engines\n\nA game engine is the program that sits underneath a computer game\
    \ and provides a platform for the game to use. Major game studios spending millions\
    \ the game engines that underpin their projects. The game engine is in charge\
    \ of drawing the display the player sees and updating the state of the objects\
    \ in the game. It performs drawing and update actions many times a second, giving\
    \ players an engaging experience.\n\nThere are many different game engines. For\
    \ our purposes, I'm going to use a tiny game engine that I created runs within\
    \ the Snaps framework. It's not the most powerful engine in the world, but it\
    \ will let you grasp the principles of game development. Once you've cut your\
    \ teeth with the Snaps engine, you can move on to other platforms. I'll give some\
    \ helpful hints about a framework you might like to use at the end of this chapter.\n\
    \nThe Snaps engine does not run at all. Instead, you turn it on when you want\
    \ to play a game. When the game engine starts, it makes the game screen (if requested)\
    \ and sets up the input devices that are to be used. Here is the Snaps method\
    \ to program start the game engine running:\n\n```\nusing SnapsLibrary;\n\npublic\
    \ class Ch12_01_EmptyGame\n{\n    public void StartProgram()\n```"
