    ```\n\nThere is a version of the pizza-picking program that uses storage in Ch10_07_PizzaPicker.\
    \ You can use this pattern to add data storage to many applications.\n\n# Fetching\
    \ data using XML\n\nJSON is a great way to convert complex objects into a simple\
    \ string of text. XML is another technology that is very popular for this type\
    \ of work. As noted above, XML is the abbreviation for Extensible Markup Language.\
    \ You can use XML to design a language that represents whatever data you want\
    \ to work with. Unlike JSON, which is just a lightweight way of representing the\
    \ contents of a class, XML can be used to create"
  merge: -1
  pgno: 353
- img_proc: true
  md: "structured XML documents. The design of a document can be expressed in an XML\
    \ schema, which formally expresses the information that the document must contain.\
    \ For example, the schema for the contact information in the Time Tracker system\
    \ could express the requirement that a name must be present but the case can be\
    \ omitted. The language of the World Wide Web—HTML, Hypertext Markup Language—is\
    \ actually based on the design of XML, and I could spend the rest of this book\
    \ explaining how to structure and format XML documents (but I really don't want\
    \ to do that).\n\nXML is used to encode lots of information that we can download\
    \ from the Internet. The XML schema we used for lots of news and blog sites is\
    \ known by the name RSS, which stands for Really Simple Syndication or Rich Site\
    \ Summary. Many information sites provide where it is called an RSS feed, which\
    \ is really a web address from which the XML-formatted data can be obtained.\n\
    \nThe RSS defines an object called channel that contains a number of items. You\
    \ can think of a channel as a list of items. Each item contains a number of members.\
    \ One member of item is title of the post, another is the case of description\
    \ contains the post itself. These items are strings.\n\nMy blog exports an RSS\
    \ feed that you can find at the address www.robmiles.com/?format=rss. If you point\
    \ your object at this URL, you will get a document that contains a large chunk\
    \ of XML. We can use the GetWebPageAs-String to fetch this text from my website:\n\
    \n```\nstring rssText = \nSnapsEngine.GetWebPageAsString(\"http://www.robmiles.com/?format=rss\"\
    );\n```\n\nThis statement creates a called rssText that contains the RSS feed\
    \ from my blog. What we do next is to convert this block of XML into an object\
    \ that we can work to extract elements and work with them. We need the XML equivalent\
    \ of the Newtonsoft library that we use to convert JSON strings.\n\nC# has a feature\
    \ named Integrated Query, LINQ (rhymes with \"think\"), which will do this job\
    \ for us. LINQ can be used for lots of jobs, but now we are going to use it to\
    \ convert a string of text into an XML element that our program can work with.\
    \ To get easy to add the LINQ namespace:\n\n```\nusing System.Xml.Linq;\n```"
