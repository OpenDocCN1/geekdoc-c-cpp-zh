    \ for this is that the Snaps framework's drawing routines work by adding dot objects\
    \ to the display. The display has a limited capacity for dots, and after 3,000\
    \ have been drawn, it starts to erase the older ones. This is purely a limitation\
    \ of the way I coded the framework.\n\n# Using the SetDrawingColor Snap to set\
    \ the drawing color\n\nAt the moment, the drawing is performed in the default\
    \ color (that rather boring gray). The Snaps library provide a method that you\
    \ can use to set the color to be used by all subsequent drawing operations. It\
    \ can be just like the SetBackgroundColor method that we've used before. You supply\
    \ the method with three arguments: the amount of red, green, and blue to be used\
