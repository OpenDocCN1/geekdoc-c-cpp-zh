    Ch05_10_WeekendAlarm


    There are several logical operators that you can use to combine logical values.


    | LOGICAL OPERATOR | NAME | BEHAVIOR |

    |---|---|--|

    | & | AND | Evaluates to true if the value to the left of the operator and the
    value on its right are true. |

    | && | "short circuit" AND | Evaluates to true if the value to the left of the
    operator and the value on its right are true. This operator does not evaluate
    the value on the right if the value is false. |

    | | | OR | Evaluates to true if the value to the left of the operator or the value
    on its right is true. |

    | || | "short circuit" OR | Evaluates to true if the value to the left of the
    operator or the value on its right is true. This operator does not evaluate the
    value on the right if the value is true. |

    | ^ | Exclusive OR | Evaluates to true if the value to the left of the operator
    or the value on its right is true, but it evaluates to false if they are both
    false. |


