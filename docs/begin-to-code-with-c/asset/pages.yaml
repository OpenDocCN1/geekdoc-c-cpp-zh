  md: "These two conditions are performed after the game has updated the position\
    \ of the paddle. They make sure that the paddle never leaves the viewport by resetting\
    \ the paddle's position to the edge of the viewport when it goes beyond it. This\
    \ is a common practice in video games. It is *clamping*. A value is clamped inside\
    \ a particular range and not allowed to go outside it.\n\n# Hitting the ball with\
    \ the paddle\n\nAt the moment, the ball and the paddle do not interact; the ball\
    \ just passes through the paddle. What we want is to produce a behavior that causes\
    \ the ball to bounce off the paddle when the two objects intersect. `ImageSprite`\
    \ class provides a method that can be used to check whether another sprite intersects\
