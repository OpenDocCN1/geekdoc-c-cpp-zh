  md: '# Sprite movement


    This code repays careful study and also raises some interesting questions.


    **Question:** Why does the sprite move down the screen when Y is increased?


    **Answer:** In computer graphics, the origin of the display (the point with the
    coordinate 0,0) is always the *top left* of the screen. This may have something
    to do with the way that hardware displays are mapped into memory from the top
    of the screen, but I must admit I''m not sure. For the purpose of this chapter,
    I think the answer to be “because it does,” and we just have to move on from this.


    **Question:** What happens if the program tries to draw an image off the screen
    area?


    **Answer:** The Windows management system doesn''t care if your program tries
    to draw something that is not on the screen. You can regard the screen as a viewport
    onto an large area that contains the objects being displayed. Windows will draw
    those parts of the objects that are visible through the viewport; anything else
    is clipped. One way to make an ImageSprite “disappear” is to move it off the area,
    but it is more efficient to use Hide, which stops the sprite from being drawn
    at all.


    **Question:** What would happen if we set one of the speed values to zero?


    **Answer:** The program expresses the ball is moving in terms of two values: how
    far across the screen to move, and how far down the screen to move. If one of
    these values is 0, it means there was no movement in that direction. For example,
    if YBall-Speed was 0, the ball would move horizontally but not vertically. If
    both speed values were 0, the ball would be stationary.


    **Question:** What would happen if we set one of the speed values to a negative
    number?


    **Answer:** Negative speeds are perfectly okay; they make the ball move in the
    opposite direction. On the X axis (left to right), a negative speed moves toward
    the left. In the Y axis (up and down), a negative speed moves the ball upward.


    # Making a bouncing sprite


    We now have movement, but it is not very useful movement. The ball travels down
    the viewport and then vanishes off the bottom. What would we like is for the ball
    to bounce off the bottom, top, and sides of the viewport.


    If the ball tries to go off the bottom of the screen'
