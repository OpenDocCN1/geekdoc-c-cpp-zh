  md: '# More than two dimensions


    If you ever need to represent a large number of tables, you can move up to a three-dimensional
    array. The best way to visualize this type of array is as a pile of pages, with
    one page for each week. The third dimension would be the number of the page containing
    the results for that week.


    The next statement shows how the 3-D array would be created. You need to add another
    comma to specify that the location of an element is specified by three index values.
    You need to give dimensions for each of these values when you create the array
    itself. The code here creates an array that can hold 50 weeks of data.


    ![](img/547210b145d9948b1613255cf1ee9fa4_229_0.png)


    If the customer wants to keep track of different weeks of data, you might think
    this would be a good time to use a three-dimensional array like this, but I''m
    not convinced. I think it would much more sensible to extend the two-dimensional
    array so that it can contain more columns:


    ```

    int[,] yearSales = new int[365, 10];

    ```


    This would create a two-dimensional array that can hold a set of readings for
    each day in the year.


    > PROGRAMMER''S POINT


    Keep your dimensions low


    In all my years of programming, I''ve never had to use anything more than three
    dimensions, and I only ever used three dimensions a couple of times (and one of
    those occasions was to create a 3-D Naughts and Crosses game).


    If you find having limits in your arrays, I would suggest that you are trying
    to do the wrong way and should step back from the problem and think about how
    your data fits together. Later in the book, you''ll see ways to build structures
    that contain a number of related data items. It is often much easier to make a
    one-dimensional array from such structures rather than move into multiple dimensions.


    The computer is quite happy to work in very large numbers of dimensions as it
    doesn''t run out of memory. However, I''ve found that the same can''t be said
    for programmers.'
