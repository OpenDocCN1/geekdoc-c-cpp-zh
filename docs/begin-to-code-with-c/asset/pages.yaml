  md: '# Error 1 Cannot implicitly convert type ''double'' to ''float''. An explicit
    conversion exists (are you missing a cast?)


    This is the same problem we had when we tried to put a double-precision value
    into an integer. If you think about it, the error makes perfect sense. Moving
    a double-precision result into a floating point variable may result in a loss
    of data because floating-point values aren''t held as precisely as double-precision
    ones.


    # PROGRAMMER''S POINT


    The compiler is on our side, really


    As you write more programs, you''ll get used to the compiler being fussy like
    this. The annoying thing is that in the case of our program, it doesn''t make
    any difference whether we use float or double. However, one day you find yourself
    writing programs that do rocket-guided calculations, where a tiny error in the
    results could result in a disaster. The compiler make sure that all programs are
    as safe as possible, and so the best thing you can do is just get better at dealing
    with these errors and try not to introduce them in the first place.


    # Converting types by casting


    We can solve the problem of mismatched number types by casting. You use a cast
    to explicitly inform the compiler that you are aware an action might lose data,
    but you know that it won''t affect the behavior of the program. Look at this line
    of code:


    ![](img/547210b145d9948b1613255cf1ee9fa4_116_0.png)


    I''ve wrapped the entire expression in parentheses and then used a cast to tell
    the compiler, "I don''t care what type of this value is. I want you to regard
    it as a floating-point value." The statement instructs the compiler to perform
    an explicit conversion and, if necessary, to discard some of the data in the result.


    Casting is strong magic. You can also use casting to convert from real numbers
    to integers:


    ```

    int tempCentigrade = (int) (tempFahrenheit - 32) / 1.8;

    ```'
