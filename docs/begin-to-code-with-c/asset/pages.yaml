    \ conventions in situations like so that code is easier to understand.\n\n# Managing\
    \ lots of contacts\n\nThe original Tiny Contacts manager stored details in local\
    \ storage on the device. This works fine for storing individual items, but the\
    \ lawyer wants to be able to manipulate contact information as a whole—she wants\
    \ the program to store the list of contacts by the amount of time she spends with\
