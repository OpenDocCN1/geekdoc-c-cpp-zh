  md: 'You could use a while loop to make a really annoying program. Here''s a program
    that repeatedly says “Rob will rule the world” until the user gets bored with
    it and stops it. Remember that in this context, true means a logical value that
    is always true.


    | while (True) | Logical expression controlling the loop. |

    | SnapsEngine.Speaking("Rob will rule the world");"); | Statement controlled by
    the loop. |"


    Or you could just easily write the following:


    ```

    while (1==1)

    SnapsEngine.Speaking("Rob will rule the world");

    ```


    This while loop will also run forever. The conditional expression that controls
    it is always true because 1 is equal to 1.


    In a C# program, you can put a block of statements everywhere you can put a single
    statement. If you want to repeat more than one inspiring message, you can use
    the while construction to repeat a block of statements. Here, both statements
    in the block will be repeated by the while loop:


    ```

    while (1==1)

    {

    SnapsEngine.Speaking("Rob will rule the world");

    SnapsEngine.Speaking("Oh yes he will");

    }

    ```


