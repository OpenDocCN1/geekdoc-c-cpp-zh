    # PROGRAMMER’S POINT


    # Program friendliness is usually a lack of unfriendliness


    Some software companies claim to produce user-friendly applications. I''ve always
    found this rather confusing because I''m not quite sure what it that they add
    to the software to make the program friendly. Having thought about this for a
    while, I''ve concluded that I''m not really sure what makes a program friendly,
    but I''m pretty sure what makes a program unfriendly. So if you want to make your
    programs friendly, my advice is to remove behaviors from your program that make
    it difficult to.


    The previous example is a case in point. From a programming point of view, displaying
    all the errors when we fail to create something is a good idea, but from a user''s
    point of view, they would prefer to have an error recognized much closer to the
    point that it was made.


    One of the things that you need to do with a new system is force yourself to do
    it with, or better, get your mom to test it for you. I frequently find that decisions
    made when I write code can make a program very hard to use in real life. I force
    myself to spend an hour or just using my new program to try and pick up eliminate
    errors. If I get other people to use the program, I get better feedback because
    they won''t know how the program works and make mistakes that I can''t imagine.
    Of course, it turns out that I often have to add more code—just like we had to
    add extra loops when we make a new contact. However, these changes make a huge
    difference to the experience of your user, and this will ultimately reflect in
    higher ratings and more sales.


