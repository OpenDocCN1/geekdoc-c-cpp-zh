    # PROGRAMMER’S POINT


    # Designing with methods


    Methods are a very useful part of the programmer''s toolkit and an important part
    of the development process. Once you have worked out what a customer wants the
    application to do, you can start thinking about how you are going to break down
    the program into methods. Often you find that as you write the code, you repeat
    a particular action. If you do this, you should consider taking that action and
    turning it into a method. There are two reasons why this is a good idea: it saves
    you writing the same code twice; if a fault is found in the code, you have to
    fix it in only one place.


    Programmers call this kind of change refactoring a program. Refactoring occurs
    during development because your understanding of your program will improve as
    you write it. You might think of a better name for a variable, for example, in
    which case you can use the refactoring tools in Visual Studio to rename the variable
    for you.


