- img_proc: true
  md: "I'm a strong believer in defensive programming, which is making sure that,\
    \ where appropriate, you take steps to ensure that your objects have some common\
    \ sense built. If I'm writing a computer game, I intend to be fairly relaxed about\
    \ the integrity of my objects. But the Time Tracker program is quite different.\
    \ Any corruption of the value of Contact-MinutesSpent in the contact information\
    \ could have a serious effect on the business of my customer, so I'm going to\
    \ be sure that I protect the integrity of the value to the best of my ability.\n\
    \nThe C# language lets you mark members of objects as public or private. I saw\
    \ this in Chapter 9, when we made the data elements of our notes private to protect\
    \ them from unwanted changes. You know that public means that code outside the\
    \ class can access the member. If the member of a class is marked private, code\
    \ outside the class is no longer accessible to it.\n\nHow you do this is as changing\
    \ the method modifier public to private:\n\n```\nclass Contact\n{\n    public\
    \ string contactName;\n    public string contactAddress;\n    public string contactPhone;\n\
    \    private int contactMinutesSpent;\n\n    public Contact(string name, string\
    \ address, string phone)\n    {\n        this.contactName = name;\n        this.contactAddress\
    \ = address;\n        this.contactPhone = phone;\n        this.contactMinutesSpent\
    \ = 0;\n    }\n}\n```\n\nOnce a member of a class has been made private, it can\
    \ be used only by code running inside the class.\n\n```\nContact secure = new\
    \ Contact(\"Rob\", \"Rob's House\", \"Rob's Phone\");\nsecure.contactMinutesSpent\
    \ = -99;\n```\n\nIf we try to compile these two statements with contactMinutesSpent\
    \ value marked private, the compiler will generate an error:"
