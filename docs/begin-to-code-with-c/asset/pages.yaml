- img_proc: true
  md: 'do for this. We''ve already used one library in this chapter. The List class
    was supplied as part of the C# library, and we''re using it to store all the customer
    information in the Time Tracker.


    The JSON library we want to use help the customer information was written by James
    Newton-King, a programmer from New Zealand who has achieved worldwide fame by
    writing some terribly useful software and sharing it with the world. Visual Studio
    contains a tool that you can use to obtain shared libraries like this (called
    NuGet), but the SnapDemo solution also includes the Newtonsoft library, for now
    we just have to include the namespace where the library is located:


    ```

    using Newtonsoft.Json;

    ```


    To store a single object, we can use the SerializeObject method provided by the
    JsonConvert class, which is part of the Newtonsoft library:


    ```

    Contact rob = new Contact(name: "Rob", address: "Rob''s House",

    phone: "Rob''s Phone");

    string json = JsonConvert.Serialize(rob);

    ```


    These statements create an object and then make a JSON string from it. We can
    store the string on our Windows computer or transfer it over the network to a
    machine. If we convert a JSON string back to an object, we can use a method that
    reverses this process:


    | Data type |

    | Input string |


    ```

    Contact recoveredContact = JsonConvert.DeserializeObject<Contact>(json);

    ```


    The DeserializeObject method is a generic method in it works for a particular
    type of object that is to be deserialized. In this case we want to deserialize
    a Contact object, so this type is added to the method call. The statement would
    create a Contact from the contents of the string json.


    You can experiment with the serializer and even try it out with strange names
    and addresses) by taking a look at an example in Ch10_05_JsonDemo.'
