  md: 'sing the first verse of the national anthem and then run fast as he can toward
    the exit,” the player would raise an objection.


    Unfortunately, a program is unaware of the sensibility of the data it is processing,
    in the same way that sausage machine is unaware of what meat is. Put a bicycle
    by a sausage machine, the machine will try to make sausage out of it. Put meaningless
    data into a computer, and it does meaningless things with it. As far as computers
    are concerned, data is just a pattern of signals coming in that has to be manipulated
    in some way to produce another pattern of signals. A computer program is the sequence
    of instructions that tell a computer what to do with the data coming in and what
    form the data will set out.


    Examples of typical data-processing applications include the following (and are
    shown in Figure 2-3):


    +   - **Mobile phone** A microcomputer in your phone takes signals from a radio
    and converts them into sound. At the same time, it takes signals from a microphone
    and makes them into patterns of bits that will be sent out from the radio.


    +   - **Car** A microcomputer in the engine takes information from sensors telling
    the current engine speed, and reads oxygen content of the air, setting of the
    accelerator, and so on and produces voltages that control the setting of the carburetor,
    and the timing of the spark plugs, to optimize the performance of the engine.


    +   - **Game console** A computer takes instructions from the controllers and
    uses them to manage the artificial world that it is creating for the person playing
    the game.


    | Inputs | Outputs |

    | --- | --- |

    | Radio Signals Touchpad | Sound Pictures |

    | | Mobile Phone |

    | Temperature Pressures Throttle | Fuel injector Ignition timings |

    | | Car |

    | Gamepad | Gameplay |


    ![](img/547210b145d9948b1613255cf1ee9fa4_49_0.png)


    **Figure 2-3** Many different devices use computers.'
