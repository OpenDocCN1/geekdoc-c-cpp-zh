  md: "# Using reference parameters to deliver results from a method call\n\nThe StoreContact\
    \ method will save a contact in local storage. The program also needs a FetchContact\
    \ method that will fetch the address and phone number for a contact. FetchContact\
    \ will have three parameters: the name of the contact to search for, the address\
    \ of that, and the phone number of that contact. An early version of such a method\
    \ might look like this:\n\n```\nvoid FetchContact(string name, string address,\
    \ string phone)\n{\n    address = SnapsEngine.FetchFromLocalStorage(itemName:\
    \ name + \":address\\);\n    phone = SnapsEngine.FetchFromLocalStorage(itemName:\
    \ name + \":phone\");\n}\n```\n\nThe method is given the name of the contact to\
    \ search for and sets the address and the phone number parameters to the address\
    \ and phone number fetched from local storage. A program might try to use the\
    \ FetchContact method like this:\n\n```\nstring contactAddress;\nstring contactPhone;\n\
    string name = SnapsEngine.ReadString(\"Enter contact name\");\nFetchContact(name,\
    \ address: contactAddress, phone: contactPhone);\n```\n\nThis code snippet uses\
    \ the ReadString method to get the contact name from the user and calls the FetchContact\
    \ method to get the address and phone number for that contact and sets them to\
    \ the values of the parameters contactAddress and contactPhone. Unfortunately,\
    \ this won't be updated by FetchContact. The reason is that in C#, each method\
    \ is passed by value. This means that when the FetchContact method is called,\
    \ it receives copies of the values of the name, contactAddress, and contactPhone\
    \ arguments and uses those copies in the method.\n\nBut the program must use parameters\
    \ in a different way. Rather than giving the FetchContact method the value of\
    \ a parameter variable, we want to give the method a reference to that variable."
  merge: -1
  pgno: 255
- img_proc: true
  md: "Humans use references all the time. When someone brings a cup of coffee, you\
    \ say something like \"Put it over there, please,\" pointing to a clear, flat\
    \ surface (which might be your mouse pad). In C# terms, a reference parameter\
    \ refers to a variable in the program. When the reference follows the variable\
    \ to which the reference indicates.\n\nWe can turn the address phone parameters\
    \ into reference parameters by adding ref in front of their name when the method\
    \ is declared:\n\n```\nvoid FetchContact(string, ref string address, ref string\
    \ phone)\n{\n    address = SnapsEngine.FetchFromLocalStorage(itemName: + \"address\"\
    );\n    phone = SnapsEngine.FetchFromLocalStorage(itemName: + \"phone\");\n}\n\
    ```\n\nWhen the code makes an assignment to the address and phone parameters,\
    \ this changes the value of the variable as given. When we make a call to FetchContact\
    \ method, we now have to pass references into the method call rather than the\
    \ values themselves. We do this by putting the keyword ref in front of the arguments\
    \ in call:\n\n```\nFetchContact(name: name, address: ref contactAddress, phone:\
    \ ref phone);\n```\n\nWhen FetchContact is called, it is passed references to\
    \ the address and phone variables. After the method completes, it will set the\
    \ address and phone variables to the values it loaded.\n\nCODE ANALYSIS\n\n# #\
    \ References and parameters\n\nThe use of references is one of the hardest things\
    \ to get your head around, let's consider some questions about it.\n\n**Question:**\
    \ If you look closely at the definition of FetchContact, you will notice that\
    \ only the address and phone parameters are reference parameters. Using the name\
    \ parameter to the FetchContact method is not a reference parameter?\n\n**Answer:**\
    \ The reason is that the method does not change the name of the contact it is\
    \ fetching. The method just needs the name to perform the search."
  merge: -1
  pgno: 256
- img_proc: true
  md: "**Question:** When should I use a reference parameter?\n**Answer:** You should\
    \ use a reference parameter only if you want to allow the method to make changes\
    \ to a variable. In the case of FetchContact, the method must find the address\
    \ and phone number and deliver those values to the caller, so it is appropriate\
    \ to use reference parameters.\n\n**Question:** Reference parameters seem a lot\
    \ more flexible than ones passed by value. Why can’t I use them all the time?\n\
    **Answer:** There’s no technical reason not. The C# compiler will not complain.\
    \ However, I use references only when I have to give the method slightly more\
    \ control over the variables passed as parameters. If by value, all that a method\
    \ can do is read that value. But if I pass the parameter by reference, the method\
    \ can change the value of that variable, and I might not want that to happen.\n\
    \n# Using out parameters\n\nA reference parameter lets a method have full access\
    \ to the parameter that is supplied. The designers of C# decided to define a slightly\
    \ more-grained level of control when using references. They added an out type\
    \ of parameter. A method must store a value in a parameter declared as an out\
    \ parameter.\n\nIf you think about it, there is no reason why the FetchContact\
    \ method should ever read the contents of the address and phone numbers when it\
    \ is being asked to. It is also very important that both the address and phone\
    \ numbers are set by the method. Flagging a parameter as an out parameter, which\
    \ is shown in the next code example, means the compiler will refuse to compile\
    \ the method if the parameter is not set. The compiler will also produce an error\
    \ if the method tries to read the contents of the variable.\n\n```\nvoid FetchContact(string\
    \ out string {\n    address = SnapsEngine.FetchStringFromLocalStorage(itemName:\"\
    addr\" + name);\n    phone = SnapsEngine.FetchStringFromLocalStorage(itemName:\"\
    phone\" + name);\n```\n\nWhen FetchContact is called, the arguments to call must\
    \ now be marked as out parameters from the method:\n\n```\nFetchContact(name:\
    \ name, address: out contactAddress, phone: out contactPhone);\n```"
  merge: -1
  pgno: 257
- img_proc: true
  md: 'When design methods and parameters, you should decide how the method is going
    to use the information that is being delivered to the method and choose whether
    to pass in the value or pass in a reference.


    # CODE ANALYSIS


    # Method headers


    Just to build your understanding of these parameter types and method headers,
    here are a few scenarios that you might like to consider.


    **Question:** I have written a method that will generate two integer dice throw
    for use in a board game. What kind of parameter should I use?


    **Answer:** Each of the two parameters should be out parameters, which can be
    set by the method when it itself will not return a value.


    ```

    void ThrowTwoDice(out int dice1, out int dice2)

    ```


    **Question:** How would I call ThrowTwoDice?


    **Answer:** When the program calls the method, it must provide out references
    to integer variables as parameters.


    ```

    int d1, d2;

    ThrowTwoDice(out d1, out d2);

    ```


    **Question:** I want to pass my age to a method that will then decide whether
    I am old enough to see a movie. What should the method header look like?


    **Answer:** The method only needs the value of my age, so I can pass the age as
    a value. The method could return a bool value that indicates whether I can see
    the movie or not:


    ```

    bool AllowedToSeeMovie(int age)

    ```'
