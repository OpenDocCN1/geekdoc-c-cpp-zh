  md: 'output values into a parameter, there is a variant of the reference parameter
    called an out parameter. Code in the body of the method can only write to an out
    parameter, and it must set a value in the parameter before the method completes.


    Here are some questions that you might like to ponder about the use of methods
    in programs:


    # Does using methods in a program slow the program down?


    Not normally. There is a certain amount of work required to create the call of
    a method and then return from it, this is not normally an issue. The benefits
    of methods far outweigh the performance issues.


    # Can I use methods to spread work around a group of programmers?


    Indeed you can. This is a very good reason to use methods. There are several ways
    that you can use methods to spread work around. One popular way is to write placehod
    methods and build the application from them. A placeholder method will have the
    correct parameters and return value, but the body will do very little. As the
    program is developed, programmers fill in and test each method in turn.


    # How do I come up with names for my methods?


    The best methods have names that are given in a verb-noun form. FetchContact is
    a good name for it. The first part indicates what it does, and the second part
    indicates what it works on. I find that thinking of method names (and variable
    names, for that matter) can be quite hard at times. The good news is that you
    can use Visual Studio (and other tools) to rename the methods in your program
    if you think of names for them later. This process is called refactoring, which
    is an important part of programming.'
