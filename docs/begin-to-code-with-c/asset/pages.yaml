  md: "Figure 10-7 shows how we could sort the information by using references. The\
    \ objects themselves never move. Instead, we have an array of references. Each\
    \ reference in the list refers to one object in memory, and during the sort we\
    \ only have to exchange the values of the references, which are much smaller and\
    \ easier to move around in memory than the objects that they refer to.\n\n![](img/547210b145d9948b1613255cf1ee9fa4_332_0.png)\n\
    \n**Figure 10-7** Sorting by using references.\n\nReferences get even more useful\
