  md: "# # The SnapsColor structure\n\nUp until now our graphics programs have manipulated\
    \ color as three values that represent the red, green, and blue intensity values.\
    \ However, it's often useful to be able to manipulate color as a single value,\
    \ and I created the SnapsColor structure to allow this:\n\n```\nnamespace SnapsLibrary\n\
    {\n    public struct SnapsColor\n    {\n        public byte RedValue;\n      \
    \  public byte GreenValue;\n        public byte BlueValue;\n\n        public SnapsColor(byte\
    \ red, byte green, byte blue)\n        {\n            RedValue = red;\n      \
    \      GreenValue = green;\n            BlueValue = blue;\n        }\n    }\n\
    }\n```\n\nThe SnapsColor structure contains three byte values: the intensity of\
    \ the red, green, and blue values that represent the color being stored. We can\
    \ construct new values by giving the amounts of each color:\n\n```\nSnapsColor\
    \ pink = new SnapsColor(red: 255, green: 192, blue: 203);\n```\n\nThe constructor\
    \ method for the SnapsColor structure accepts the red, green, and blue values\
    \ and then stores them in the object.\n\nThere are overloaded versions of all\
    \ the color-selection methods that accept a color structure rather than three\
    \ integer values. This would set the drawing color to pink:\n\n```\nSnapsEngine.SetDrawingColor(pink);\n\
    ```"
