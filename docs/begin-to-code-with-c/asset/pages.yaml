  md: "stop the program because it would not be sensible to continue and make an invalid\n\
    SongNote value.\n\nThe C keyword throw is used to throw an Exception object. The\
    \ exception can be\ngiven a message that has gone wrong.\n\n```\nthrow new Exception(\"\
    Invalid pitch value\");\n```\n\nAs the name implies, exceptions should be thrown\
    \ only in exceptional circumstances.\nIf a user enters invalid data, for example\
    \ an age of 1,000, this is not exceptional; it is\nmore likely that the user pressed\
    \ a key more times than he meant to. You have seen\nhow to deal with errors like\
    \ this; a program can use a loop to repeatedly ask for values\nuntil the user\
    \ enters is valid. However, if a constructor detects an invalid\ninput, there\
    \ is nothing it can do. The constructor must not allow a SongNote that con-\n\
    tains an invalid pitch value to be created.\n\n```\npublic SongNote(int pitch,\
    \ double duration)\n{\n  if (pitch < 0 || pitch > 12)\n    throw Exception(\"\
    Invalid pitch value\");\n\n  if (duration < 0.1 || duration > 1)\n    throw Exception(\"\
    Invalid duration value\");\n\n  NotePitch = pitch;\n  NoteDuration = duration;\n\
    }\n```\n\n| Test for invalid note. |\n| Throw exception if invalid. |\n| Test\
    \ for invalid duration. |\n| Throw exception if invalid. |\n\n| Statements that\
    \ set pitch value and duration. |\n\nThis version of SongNote constructor method\
    \ will refuse to create a SongNote that\nh an invalid pitch number or a duration\
    \ less than one-tenth of a second or greater\n1 second. If anyone tries to make\
    \ an invalid SongNote, they will find that their\nprogram is stopped by an exception.\
    \ I call this defensive programming. I try\nto make sure that my programs can't\
    \ be upset, by invalid inputs. I also try very\nhard to make sure that my programs\
    \ fail at the point the mistake is made rather than\nlater on. This program should\
    \ fail when it tries to create an invalid SongNote, not some\ntime when it tries\
    \ to play one. Later in the book you will discover how to catch\nand deal with\
    \ exceptions."
