    This is completely legal C# that is highly dangerous. It does nothing, repeatedly.
    You might think the computer would be clever enough to work out that the loop
    does nothing, and therefore ignore it, but this is unfortunately not the case.
    What would happen here is that the computer would try to run this code so fast
    as it can. If this code ran on a desktop PC, you would find that the processor
    usage would go up (and maybe the fans would start running after a few seconds).
    If this code ran on a mobile device, you would find that the case would warm up
    and the battery would start to drain quickly. It is interesting to note that this
    kind of code has actually been used to create "hand-warmer" apps for some mobile
    phones. These programs don''t actually do anything useful, but they make the phone
    get nice and warm to the touch, at least for a while, until the battery goes flat.


    As you learn to program, you will probably make this mistake a few times and create
    programs that never stop. Remember that in Visual Studio, you can use the stop
    button to end a program that gets stuck in this way.


