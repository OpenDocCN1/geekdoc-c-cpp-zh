  md: '# What''s special about the constructor method?


    **Question:** We''ve seen methods in objects before, but there''s something special
    about the constructor method for the SongNote structure. What''s special about
    it?


    **Answer:** It doesn''t have any return type. When we''ve considered methods,
    before we saw C# has a return value—for example, the GetNumber method returns
    an integer—or we use the void keyword to explain that a method does not return
    anything. The constructor doesn''t seem to have any information about the type
    of a result it might return. This is because the method doesn''t return anything.
    The constructor method is called automatically, just as an object is coming into
    existence. When the constructor is complete, the object has been created.


    # Invalid data in a constructor call


    The Snaps framework uses pitch numbers that range from 0 to 12. A pitch value
    outside range can''t be played. However, there''s nothing stopping a programmer
    from trying to construct a SongNote that contains invalid:


    ```

    SongNote note = new SongNote(pitch: -99, duration: 0.4);

    ```


    This creates a SongNote with a pitch value of -99, which is outside the range.
    If it is never played, it won''t work correctly. You might wonder why someone
    would try to create a invalid one. One reason is to attack the system. The word
    "hacker", once an honorable term describing someone who is good at making work,
    now also means someone who tries to break into computer systems. One way to break
    into a system is to use invalid inputs and see what happens. If the hacker is
    lucky, the program might crash or misbehave if it is given invalid data.


    To counter this, a constructor can check the values that are being used to set
    up the object, and it can reject any invalid values that it finds. The constructor
    can reject invalid values by throwing an exception.


    # Throwing exceptions in constructors


    You first encountered exceptions in Chapter 6 when you saw that if a program tries
    to access a nonexistent element in an array, an exception is thrown that prevents
    this. The constructor for the SongNote object is going to create and throw an
    exception to'
