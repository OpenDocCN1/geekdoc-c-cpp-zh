  md: "The C# compiler will not allow you to use a variable outside the block—the\
    \ scope—in which it is declared because as far as the compiler is concerned, the\
    \ variable does not exist at that point in the program. This is a very sensible\
    \ way to organize the use of variables. It makes programs clearer that a programmer\
    \ can declare variables closer to where they are being used. Also, if two programmers\
    \ are working on the same program and each of them want to use a variable named\
    \ count, they can do that, as long as they declare it in separate blocks of code.\
    \ (Discarding variables when they are not being used saves memory, although you\
    \ have plenty of memory to spare when you write programs these days.)\n\n![](img/547210b145d9948b1613255cf1ee9fa4_136_0.png)\n\
    \n```\nCODE ANALYSIS\n```\n\n# Considering variable scope\n\nTake a look at the\
    \ following statements:\n\n```\n{\n  int i=99;\n}\n{\n  int i = 100;\n}\n```\n\
    \n**Question:** How many variables are being used in the above snippet of code?\n\
