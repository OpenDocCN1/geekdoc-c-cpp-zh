    # # Running a program with Visual Studio


    Visual Studio is called an *integrated development environment* (or IDE). It''s
    a place where programmers can not only write their program code but also see their
    programs running. Let''s begin to know Visual Studio by running some of the sample
    applications created by the demo code you downloaded for this book.


    When you want to get control over a program, you tell Visual Studio to run it
    by using the run button, which is the button with the green arrowhead I''ve pointed
    to in **Figure 1-5** on the next page.'
