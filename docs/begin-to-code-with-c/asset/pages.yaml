    \n# Fortune teller\n\nThe ThrowDice method from the Snaps framework, which I introduced\
    \ in Chapter 4, can be used in if constructions to make programs that perform\
    \ in a way that appears random.\n\n```\nif (SnapsEngine.ThrowDice() < 4)\n   \
    \ SnapsEngine.SpeakString(\"You are going to meet a tall, attractive stranger\"\
    );\nelse\n    SnapsEngine.SpeakString(\"You are not going to meet anyone at all\"\
    );\n```\n\nThe if construction tests the value produced by a call to the ThrowDice\
    \ method. If the value returned by the method is less than 4 (in other words,\
