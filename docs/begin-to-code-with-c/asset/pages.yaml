  md: "+   • If the rocket is to the right, accelerate left.\n\n+   • If the rocket\
    \ is to the left, accelerate right.\n\nIf you are not sure what acceleration means,\
    \ and about the difference between acceleration and speed, then let's have a look\
    \ at some simple physics.\n\nThe speed of our alien is the distance it moves around\
    \ the game loop. Each time the alien updates, we add this speed value to the alien\
    \ position value to update it. Speed changes over time. If we drive for an hour\
    \ in a car carrying 60 miles per hour, we'll travel 60 miles.\n\nAcceleration\
    \ is the rate at which speed is changing. If we press the accelerator in our car,\
    \ our speeds up over time (the speed changes over time). We might say that our\
    \ car is traveling five miles per hour every 10 seconds. That would equate to\
    \ a \"60 minutes an hour\" time of 12 seconds.\n\nWe add an acceleration to the\
    \ speed of the chasing alien to make it move in the direction of the rocket. You\
    \ could say that we \"press the accelerator\" in the direction of the rocket.\
    \ The interesting thing is the way that acceleration makes possible for a player\
    \ to dodge the alien.\n\nThe game will use these acceleration values, and the\
    \ position of the rocket, when it updates during the game loop. There is also\
    \ a friction value that slows down the alien. Each time around the loop, we multiply\
    \ the speed of the alien by the friction value (which is less than 1) to dampen\
    \ the movement a bit. This is the Update we'll use.\n\n```\npublic override void\
    \ Update(){\n  if (AlienAlive){\n    if (targetValue.spriteValue.CenterX > spriteValue.CenterX)\n\
    \      xSpeedValue = xSpeedValue + xAccelerationValue;\n    else\n      xSpeedValue\
    \ = xSpeedValue - xAccelerationValue;\n\n    xSpeedValue = xSpeedValue * frictionValue;\n\
    \    spriteValue.X = spriteValue.X + xSpeedValue;\n\n    if (targetValue.spriteValue.CenterY\
    \ > spriteValue.CenterY)\n      ySpeedValue = ySpeedValue + yAccelerationValue;\n\
    \    else\n      ySpeedValue = ySpeedValue - yAccelerationValue;\n\n  ySpeedValue\
    \ = ySpeedValue * frictionValue;\n}\n```\n\n| Is the target on the right of the\
    \ chasing sprite? |\n If the target is on the right, accelerate right. |\n If\
