  md: '# Understanding the Boolean type


    You''ve seen C# provides different types, such as string and float, that you can
    use to represent data in a program. I like to think that you will forever associate
    the number of hairs on your head with numbers (integers) and the average length
    of your hair with real numbers (floating-point and double). Now it''s time to
    meet another type, the Boolean type. Unlike the numeric types, which provide a
    range of values, the Boolean type has only two possible values: true or false.


    # Declaring a Boolean variable


    A program can declare and assign a Boolean variable in the same way as for any
    other type of variable. The following statement declares a Boolean variable called
    It-TimeToGetUp (In my world, it seems like that it is always time to get up).
    Note that the designers of C# decided to shorten the program text slightly by
    giving the variable name bool.


    ```

    bool IsTimeToGetUp = true;

    ```


    In the highly unlikely event of ever being allowed to stay in bed, we could change
    the assignment to set the value to false:


    ```

    bool IsTimeToGetUp = false;

    ```


    # CODE ANALYSIS


    # Boolean values


    **Question:** What happens if I try to set a Boolean variable to a number rather
    than to true or false?


    **Answer:** I think we both know the answer to this one. The compiler enforces
    type rules on Boolean values as it does for all types. The keyword true in a C#
    program is actually a literal Boolean value that means true, just like the value
    12 is a literal integer that means the value 12.'
