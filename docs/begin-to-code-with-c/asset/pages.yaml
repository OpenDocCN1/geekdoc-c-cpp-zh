  md: "'Contact.contactMinutesSpent is inaccessible due to its protection level\n\n\
    This compilation error protects the MinutesSpent value being changed by code running\
    \ outside the Contact object. As the creator of the object, you now have complete\
    \ control over how and when this data member is used.\n\n# CODE ANALYSIS\n\n#\
    \ Protection inside objects\n\nQuestion: Why is it that the statement in the constructor\
    \ for the Contact object can set MinutesSpent, but the other statement can't?\n\
    \n```\npublic Contact(string name, string address, string phone)\n{\n    this.contactName\
    \ = name;\n    this.contactAddress = address;\n    this.contactPhone = phone;\n\
    \    this.contactMinutesSpent = 0;\n}\n```\n\n> This statement works fine.\n\n\
    > Create a Contact object in another part of the program.\n\n```\nContact secure\
    \ = new Contact(\"Rob\", \"Rob's House\", \"Rob's Phone\");\nsecure.contactMinutesSpent\
    \ = -99;\n```\n\n> This will not compile.\n\nAnswer: This is all about context.\
    \ Any piece of C# code will execute in a particular context. In the case of running\
    \ within the constructor method for the Contact object, this code runs inside\
    \ the context of the object is considered part of the object. The second statement\
    \ is running in a different context, perhaps inside the StartProgram method, which\
    \ is not inside the Contact class. Because the code is not running in the context\
    \ of the object, it is not allowed to access private members of that object.\n\
    \n# Providing Get and Set methods for private data\n\nWe have now protection around\
    \ the precious data stored in the MinutesSpent variable, but this level of protection\
    \ is too strong. There is no way that any code outside the Contact class can use\
    \ the value that is stored there. You can solve this\n\nCreating objects with\
    \ integrity 341"
