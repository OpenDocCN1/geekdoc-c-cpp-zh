    \ Our program can contain an array of contacts such as this:\n\n```\nContact[]\
    \ contacts = new Contact[100];\n```\n\nThis statement will create an array of\
    \ \"empty\" structures. When C# makes an empty variable, it sets numbers in the\
    \ structure to the value 0 and strings in the structure to a special value null.\
    \ We saw in Chapter 8 that the value null is in a way that a program can explicitly\
    \ represent the situation where a variable does not contain a value.\n\n```\n\
    bool storeContact(Contact contact)\n{\n    // work through each element in the\
    \ array using a for loop\n    for (int position = 0; position < contacts.Length;\
    \ position = position+1)\n    {\n        if (contacts[position].ContactName ==\
    \ null)\n            // If the name is null, this element is empty ...n    }\n\
    }\n```"
