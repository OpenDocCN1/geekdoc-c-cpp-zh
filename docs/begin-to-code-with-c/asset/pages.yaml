  md: '# Creating a player-controlled paddle


    At the end of Chapter 12, we had a ball sprite that could bounce around the screen.
    Now we''re going to add the player control that will be used to interact with
    the ball. I''ve provided a purple paddle that you can use to hit the ball. (You
    can find the image for this—paddle.png—in the Images folder in the BeginToWithCSharp
    project. You can also add an image of your own.)


    The following statements load the paddle sprite into the game and set it up. Its
    size is set to one-tenth of the width of the viewport, and the bottom of the paddle
    is placed 10 pixels from the bottom of the screen. **Figure 13-1** shows the paddle''s
    position.


    ```

    ImageSprite paddle = new ImageSprite("paddle.png");

    SnapsEngine.AddTo(paddle);

    double paddleWidth = SnapsEngine.GameViewportWidth / 10.0;

    paddle.ScaleWidth(paddleWidth);

    paddle.Bottom = SnapsEngine.GameViewportHeight - 10;

    paddle.CenterX = SnapsEngine.GameViewportWidth / 2;

    ```


