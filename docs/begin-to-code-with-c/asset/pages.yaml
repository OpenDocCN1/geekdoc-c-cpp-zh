  md: '# # Why is the ValidateName method static?


    You might not have spotted this, but the ValidateName method was marked as a static
    method. This means that it is a member of the Contact class, not part of an instance
    of the class.


    **Question:** Why is the ValidateName method static?


    **Answer:** To understand this design choice, you first need to be sure that you
    know what static means. static means a member of a class "always there". It is
    part of the class rather than an instance of a class. Methods such as AddMinutes
    can add some minutes to a particular instance of a class. However, the ValidateName
    behavior is not specific to any particular Contact, and it is very useful to use
    this method if you don''t have to acquiring the Contact instance it needs to build
    a new Contact and it would be very able to do this without having another Contact
    instance around to perform the validation.


    # # Managing the object construction process


    The pattern I just described can be to make sure that changes to the data in an
    object conform to the business rules required by the application. If the lawyer
    decides that only people with four-letter names are allowed to be stored, we can
    change the ValidateName to enforce this requirement. However, there is one other
    place we need to think about validation, and that is when objects are constructed:


    ```

    Contact badNews = new Contact(name:"", address:"", phone:"");

    ```


    The statement above would create a Contact value with completely empty name, address,
    and phone number members. This would be a bad thing and completely break all our
    business rules. The way to fix this is to use the validation behaviors in the
    constructor.'
