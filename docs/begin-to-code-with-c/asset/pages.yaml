  md: 'Behaviors in an object are expressed in the form of methods. A method is a
    piece of C# code that is given a name. A program can run the code in a method
    simply by giving the name of the method—this is known as calling the method. You
    are going to start calling methods that have already been written (by me), but
    later you will create methods of your own.


    This program''s class—Ch03_01_WelcomeProgram—has just a single behavior, method
    called StartProgram. The declaration public void StartProgram() marks the beginning
