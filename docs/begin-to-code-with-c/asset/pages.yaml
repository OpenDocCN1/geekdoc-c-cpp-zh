- img_proc: true
  md: '# Should we store the color values as an enumerated type?


    This is a good question. I think the answer is no. There are two reasons for this.
    The first is that there are lots of possible color values because there are many
    millions of ways of combining the possible values of red, green, and blue. There
    are a few particular colors that we might think of as special: for example, pure
    red, green, and blue, along with black and white. However, many other colors exist
    for which we don''t have specific names. The second reason why it would not be
    sensible to represent a color as an enumerated type is that you can regard a color
    value as being made up of red, green, and blue values, but an enumerated type
    holds only one value.


    # Do we have to use the switch construction in our programs?


    The switch construction is definitely useful, but you can write successful programs
    without using it. Programmers call this syntactic sugar. It''s something nice,
    but it doesn''t make possible anything that you couldn''t already do.'
