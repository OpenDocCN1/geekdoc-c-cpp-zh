  md: 'The preceding code shows a more secure version of the SongNote structure. The
    notePitch and noteDuration values have been made private, which means that only
    statements in methods that are members of the SongNote structure are able to use
    these variables. We have created a SongNote value, it is not possible for any
    program to change the value or duration of that note.


    ```

    SongNote note

    note.notePitch = 0;

    ```


    > This statement would not compile because notePitch is now private.


    # CODE ANALYSIS


    # Public and Private


    **Question:** Look closely at the code for the more secure and the original SongNote
    structures and you should notice something slightly different. What is different
    about the more secure version of SongNote?


    **Answer:** The two data members, notePitch and noteDuration, now have identifiers
    that start with a lowercase letter, for example, NotePitch and notePitch. This
    is a C# version that uses code to make properties easier to understand. If an
    identifier starts with an uppercase letter, the member is public and can be seen
    by code running outside the structure. If an identifier starts with a lowercase
    letter, it is private.


    **Question:** Can we make members private, too? What would happen if we made the
    Play method in SongNote private? Would this be a good idea?


    **Answer:** It is possible to make methods private. The effect of doing so is
    that the method can''t be called from code outside the structure. This would not
    be a sensible thing to do in the case of Play because it is used by code external
    to the structure. If Play were private, the external code would not be able to
    call it, and the note could not be played.


    # PROGRAMMER''S POINT

    Consider “active” and “passive” safety in your program design


    A data member of a class that is public can be regarded as a potential failure
    point. This is because you have no control over the value in that variable. Another
    program could change the value at any time. When you design a large program, you
    should decide how you are going to make sure that all the values the program works
    with are valid at all times.


    266 Chapter 9 Creating structured data types'
  merge: -1
