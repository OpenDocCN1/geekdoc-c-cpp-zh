  md: 'Professional programmers call this part of a program input sanitizing. It''s
    the process of making sure that the user types cannot be used to upset the proper
    behavior of the program. As a budding developer, you need to remember whenever
    you give the user a chance to type something into your program, you are giving
    them a chance to break it, and you should treat all inputs with a proper amount
    of suspicion.


    # Storing contact information in the cloud


    Your lawyer customer is very impressed with the contact manager application and
    promptly installs it on all her Windows devices. And then she notices a problem.
    She discovers that she wants to enter contact details on each device, and she
    finds that the details she wants are on a device she doesn''t have with her. What
    she wants is to synchronize contact details over all the Windows devices she owns.


    This sounds like a really tricky thing to do, and it is. But Fortunately, it''s
    also my favorite kind of problem—one that somebody else already solved. The Windows
    system provides what is called roaming storage. This is managed by the operating
    system in each Windows device. An amount of networked storage is linked to each
    Windows account, and each time the user of that account logs in to a Windows device,
    his or her roaming information is downloaded to machine from Microsoft server
    systems.


    This is a very good example of what is called the cloud. The Microsoft systems
    are somewhere "out there in the Internet," and the Windows operating system connects
    to them and makes the storage available to programs that run on Windows devices.


    To make an application storage in the cloud, you simply have to use different
    Snap methods to save and load the strings that make call the contact information.
    Rather than using `SaveStringToLocalStorage`, the program has to call `SaveStringToRoamingStorage`
    instead. There is a corresponding `FetchStringFromRoamingStorage` to retrieve
    the data.


    The roaming storage mechanism works very well. It can take a little while for
    the storage to synchronize, and if a mobile is not connected to the network, the
    synchronization can''t take place. There are also some limitations placed on the
    amount of data that can be stored in roaming storage. It is fine for a program
    to store a small amount of information, but as a small number of contacts or settings
    information, but this is not a good way to synchronize your music collection across
    multiple machines.


    This kind of storage is organized on a per-application basis, which means that
    if you create two applications, they will not be able to view the contents of
    each other''s storage. Your lawyer friend is a bit concerned about the security
    of the data that is held, but the data is sent securely between devices and the
    cloud.'
