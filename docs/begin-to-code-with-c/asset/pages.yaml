    # ## PROGRAMMER’S POINT


    Don’t be too clever


    Some people like to show how clever they are by doing cunning things with the
    setup, condition, and update statements, which can actually do things other than
    simple assignments, increments, and tests. Some programmers think they are clever
    if they can do all the work “inside” for part at the top and have an empty statement
    after it.


    I think these are too clever for their own good. There is rarely a need for such
    convoluted code. When you are writing programs, the two things that you should
    worry about are “How do I prove this?” and “How easy is this code to understand?”
    Complicated code does not help you do either of these things.


    # # Breaking out of loops


    Sometimes you’ll need your program to escape from a loop while you are in the
    middle of it—in other words, your program might decide that there is no point
    or going on and want to leave the loop and continue the program from the statement
    after it.


    You can do this with break statement, which is a command to the program to leave
    the loop immediately. Your program will usually make some of decision before quitting
    in this way. I find break statement useful when I need to provide a “get out of
    here” option in the middle of something.


