    # Working with logic\n\nWriting code that makes decisions like this is one of\
    \ the hardest parts of learning to program. It is like solving a logic puzzle,\
    \ because that is just what you're doing. The best advice I can give is to write\
    \ what you want the program to do and then work through it, converting that description\
    \ to a logical expression. For example: \"I want to pay overtime when the hours\
    \ worked are more than 40 or the day of the week is Saturday.\" Even after many\
    \ years of programming, I still resort to this technique sometimes. And once I've\
    \ written some code that I think will work, I test it by trying some values and\
    \ observing what the decision would do."
