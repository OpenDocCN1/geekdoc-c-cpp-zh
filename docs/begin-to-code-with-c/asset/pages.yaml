- img_proc: true
  md: '**Question:** Why do we need Boolean variables?


    **Answer:** If you think about it, we don''t really need Boolean variables. We
    could simply use an integer and a convention that 0 means false and any other
    value means true. However, we''ve have to rely on all programmers understanding
    the convention and using it correctly. If we were ever interested in storing only
    true or false (for example, I am handsome or not), then it makes sense to use
    a type that can represent just those two states. Another good reason to have Boolean
    variables is to perform logic in a program, which we be doing later in this chapter.


    **Question:** What are *true* and *false*?


    **Answer:** The words *true* and *false* are literal values in the program that
    mean true or false. You''ve seen literal values before. A program can contain
    the literal integer 1 or the literal string "Rob". If we use *false* in a program,
    the C# compiler regards it as a Boolean value that is false. The C# compiler will
    make sure that we assign these literals only to Boolean variables.


    # # Boolean expressions


    A Boolean variable can be assigned to any expression that returns a value that
    is true or false. As each day, I need to get up at 7 a.m. We can use a Boolean
    expression involving the hour of the current time to see if we need to get up:


    ```

    int hourValue = SnapEngine.GetHourValue();

    bool IsTimeToGetUp = hourValue > 6;

    ```


    The first statement creates an integer variable hourValue and sets it to the current
    hour of the time by using the Snaps method GetHourValue. The second statement
    sets the value of IsTimeToGetUp to the result of a Boolean expression that evaluates
    to true if hourValue is greater than 6.


    You can insert the inverse of any Boolean expression (converting true to false
    and vice versa) by using the ! (!) operator. This statement creates a Boolean
    variable called ICanStayInBed that holds the inverse of IsTimeToGetUp.


    ```

    bool ICanStayInBed = !IsTimeToGetUp;

    ```'
