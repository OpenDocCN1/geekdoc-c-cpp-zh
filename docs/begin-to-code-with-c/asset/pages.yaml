  md: '# What you will learn


    You now know enough about programming to be useful—and dangerous. If this book
    were teaching you how to drive, you would know how to steer the car, what were
    most of the pedals do, and how to start and stop, but you wouldn''t yet know the
    rules of the road—how to drive safely and economically with regard for other drivers.


    In this chapter, you are going to learn some "rules of the code" (sorry about
    that) that will allow you to create solutions that are more secure, robust, and
    flexible. You''ll discover how to use the features of C# that let you provide
    integrity to the objects that you use in your programs. You''ll also discover
    quite a few new C# features, including ones that let you create programs that
    can manipulate dates and times and store photographs.


