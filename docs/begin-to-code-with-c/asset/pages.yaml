  md: "# Creating objects with integrity\n\nIntegrity in a person is a prized quality.\
    \ We prefer it when people turn up when they say they are going to, remember that\
    \ they owe us five dollars, and generally tell us the truth. It's the same with\
    \ software objects. Programmers prefer objects that contain valid values—and not\
    \ suddenly that our bank balance has just become $8,388,607.\n\nThe designers\
    \ of C# also pride integrity in objects, and they provided some language features\
    \ that you can use to ensure that the classes and structures you can create be\
    \ made to behave with a degree of reliability. In this section, you'll find out\
    \ how these features can be used to make objects that always hold values that\
    \ make sense. We'll start by adding some integrity to the Time Tracker application.\n\
    \n# Protecting data held inside an object\n\nFor the Time Tracker application,\
    \ we needed to store four items about each contact: name, address, phone number,\
    \ and number of minutes the contact has spent with the lawyer. To meet these requirements,\
    \ we created a Contact object that contains a data member for each of these items.\
    \ The name, address, and phone number elements can be stored in strings. The number\
    \ of minutes spent with the contact is held in an integer, which is set to 0 when\
    \ the contact is created.\n\nEach time the lawyer spends time with a contact,\
    \ the number of minutes should be increased to reflect this. It is very important\
    \ to the lawyer that the minutes-spent value is correct at all times. If these\
    \ minutes are not properly recorded, it costs money. What happens in our program\
    \ when we run code as this?\n\n```\nusing SnapsLibrary;\nclass Ch11_01_PublicMenace\
    \ {\n    class Contact {\n        public string ContactName;\n        public string\
    \ ContactAddress;\n        public string ContactPhone;\n        public int ContactMinutesSpent;\n\
    \n        public Contact(string name, string address, string phone)\n    }\n}\n\
    ```"
  merge: -1
  pgno: 362
- img_proc: true
  md: "```\nthis.ContactName = name;\nthis.ContactAddress = address;\nthis.ContactPhone\
    \ = phone;\nthis.ContactMinutesSpent = 0;\n}\n}\n```\n\n```\npublic void StartProgram()\
    \ {\n    Contact insecure = new Contact(\"Rob\", \"Rob's House\", \"Rob's Phone\"\
    );\n    insecure.ContactMinutesSpent = -99;\n    SnapsEngine.DisplayString(\"\
    Minutes are \" + insecure.MinutesSpent);\n}\n```\n\nThis example demonstrates\
    \ a dangerous defect in our design. Up until now we have been marking all the\
    \ members of our objects as public. However, the fact that these elements are\
    \ public means that their contents can be made invalid easily.\n\nWhen this example\
    \ runs, it creates an instance of the Contact class and modifies the ContactMinutesSpent\
    \ member of that object:\n\nThe first statement simply creates a contact for Rob,\
    \ but the second statement does something daring. It sets the number of minutes\
    \ spent for the contact to ~99, which is obviously invalid. The problem is that\
    \ our solution \"know\" that it is possible to spend ~99 minutes with someone.\
    \ As we have seen, programs just follow the instructions that we give him, whether\
    \ the instructions are sensible or not.\n\n# PROGRAMMER'S POINT\n\nBuild common\
    \ sense into your objects\n\nYou might think that I'm worrying more than I should\
    \ about my objects. After all, nobody would be foolish to try to set the minutes-spent\
    \ value to ~99? Unfortunately, my experience is that people are known to do this\
    \ kind of thing. If you are working as part of a team, the objects you create\
    \ may be used by many programmers over time. Some of these programmers might use\
    \ the objects incorrectly. This can happen through ignorance of the way that the\
    \ objects work, but there is also the threat of malware, which is code written\
    \ specifically to find and exploit weaknesses in other programs."
