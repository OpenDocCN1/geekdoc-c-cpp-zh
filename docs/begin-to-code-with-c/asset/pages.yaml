  md: 'MovingSprite on its own is not very interesting, but it can serve as the basis
    for all the moving objects on the screen. MovingSprite object can move in any
    direction; you just have to set the respective speed values and it will move that
    way. But we also know that after a while, a MovingSprite object will move off
