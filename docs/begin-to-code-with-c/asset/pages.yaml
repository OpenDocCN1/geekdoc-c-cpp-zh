  md: '# When images go bad


    When your program changes the size of an image, the Windows graphics system will
    scale it to fit the size that you requested. Making an image smaller will result
    in some detail being lost, but the image quality will still be good. However,
    if you take a very small image and try to make it very large, you will notice
    that the image looks blurry, and you might start to see dots or other corruption
    of the picture. You can see this in the stretched ball in Figure 12-3, where the
    edges of the ball have "steps" in the original dots that make up the picture extended
    to fill the space.


    When I make a game, I try to be sure that my images are larger than they need
    to be so when I scale them to fit on the screen, I am always making them smaller.
    This way I can be sure that the items on the screen always look their best.


    ![](img/547210b145d9948b1613255cf1ee9fa4_408_0.png)


    # Get your images squeezing


    You can have a lot of fun changing the shape of images. You can use this technique
    to zoom in an image or make it shrink to nothing. If you change the size of the
    update value, you can make the image grow very slowly or flick up and down. Try
    this with some pictures of your own. You can quite a lot of fun "squishing" your
    family photos. Or at least, I.


    # Scaling a sprite


    We have seen the effect of getting the height and width of an image wrong, which
    makes it look squashed. We can use this to comic if we want. However, what we
    really want is some way to scale a sprite and preserve its shape. It turns out
    that ImageSprite provides methods that will do this for us. We can set the width
    or the height of a sprite, and the other dimension will be adjusted to keep the
    sprite looking sensible.


    The ScaleSpriteWidth sets the sprite''s width as requested and automatically adjusts
    the height so that the shape of the sprite is correct and does not appear stretched.
    The ScaleSpriteHeight method does the same for the height of the sprite.'
  merge: -1
