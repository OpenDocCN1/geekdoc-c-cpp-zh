    a field

    grass or a concrete floor—rather than a recognizable object, it is unlikely that
    the

    player will notice that the image is slightly distorted.


    # Positioning a sprite on the screen


    The ImageSprite class provides properties that can be used to manage the position
    of

    a sprite on the screen. These two statements place the ball at the top-left corner
    of the

    screen:


    ```

    ballSprite.X = 0;

    ballSprite.Y = 0;

    ```


    The X and Y give the position of the top-left corner of the sprite. In other

    words, if we draw with both X and Y set to 0, the ball is drawn at the top-left
    corner of

    page. Unless you specify otherwise, the X and Y positions of an ImageSprite

    set to 0 when it is created, which is why all the sprites we have drawn so far
    have been

    drawn to the top left.


    A program can place a sprite anywhere on the screen by changing the values of
    X and

    Y. As with the size of the sprite, the position of the sprite changes on the screen
    only

    when the DrawGamePage method runs.


    # Making a sprite move


    What we really want a game in which elements move around the screen. To

    do this, the game can make changes to a sprite''s position during the game loop..

    understand how this works, take a look at the following code.'
