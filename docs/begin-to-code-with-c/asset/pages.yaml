  md: 'objects so that we manage related data more easily. Now we are moving on to
    making objects based on other objects (class hierarchies), template objects (abstract
    classes), and object-based components.


    These are advanced programming and software design topics. You don''t need to
    understand them completely right away. You can create awesome programs without
    using a class hierarchy. However, if are are designing large and complex solutions
    made up of lots of different components, I''d strongly advise you to come back
    to the chapters in part of the book and look at the ways that we fit the elements
    in our game.


    # What you have learned


    In this chapter we completed the exploration of the object-oriented features in
    C#, using the game Space Rockets in Space as the vehicle. You discovered how one
    object in a program can send a message to another and how complex programs can
    be made from a collection of cooperating objects. You have seen that a message
    is really just a call with an agreed meaning and that an object can send messages
    in response to the one it receives. You have also investigated how objects can
    be given state, and that the state of an object sets the context in which incoming
    messages will be dealt with.


    Sometimes, the design process will identify need for objects to provide a certain
    set of behaviors in a manner appropriate to each specific object. You have seen
    how you use C# abstract classes to create "templates" that specify an abstract
    requirement for a particular behavior without specifying exactly how the behavior
    should work in each child of the abstract class.


    Interfaces take the idea of abstract classes even further. Abstract classes let
    us design templates that specify all objects in a class hierarchy must implement.
    Interfaces, in contrast, specify a set of behaviors that any class can implement.
    Classes can implement the interface and then be managed in terms of this ability.
    Put simply, abstract classes let us manage objects in terms of what they are,
    whereas interfaces let manage objects in terms of what they can do.


    Programming is turning into an exercise in organization, and we can start to break
    down very complicated systems into a set of objects that each play a particular
    part in the implementation. It turns out that you can do a lot of your program
    design work by stepping back from the keyboard and drawing some diagrams that
    show what each element of the solution needs to do.


    Here are some questions that you might want to ponder about software components.'
  merge: -1
  pgno: 495
- img_proc: true
  md: '# What is the difference between an object and a component?


    We started using objects as a way of gathering data values to make them easier
    to manage. We created objects to represent musical notes in a tune, contacts in
    an address book, and similar things. You discovered that you can make objects
    more useful by giving them behaviors that a musical note could play or or contact
    object could make sure that we stored a contact with a missing name. You move
    into components when objects start to cooperate to make a system work. In our
    video game, the alien sprite sends a message to the rocket when it causes damage,
    and then the rocket sends a message to the game if this means the rocket has been
    destroyed and the game has ended. As soon as you start to regard objects in terms
    of their abilities—rather than what they are—you are talking about software components.


    # Does using objects my programs run more slowly?


    Yes, but it doesn''t matter. One of the fundamental principles of computing is
    that there are lots of ways to write a program. Every program that is constructed
    using objects could be written as one enormous method. It would be hard to understand,
    and impossible to fix if it broke, but it would probably run faster than an object-based
    solution. The benefits of an object-based solution are so great in terms of ease
    of construction, ability to test, and ease of modification that they are definitely
    the best way to write large programs.


    # Do I know all I need to know about objects?


    I have been programming for a long time. For the first part of my programming
    career I used objects for the very simple reason that they hadn''t been invented.
    However, I found that I tended to structure my programs in an "object-ish" way,
    using libraries of softwares and data I grouped together to make objects of my
    own. I''ve been using objects for a long time, and I still don''t consider my
    knowledge complete. One of the wonderful things about learning to program is that
    if you are always learning. The notes in this part of the text give you plenty
    to think about when it comes to designing systems, but you will only learn more
    if you write more code and make a habit of looking at code written by other people.


    In Part 4, the final part of this book, you will take your programming skills
    and learn how to use them to make fullyfledged Universal Applications. You''ll
    move from the Snaps framework to the world of user interface design, where you
    can create any kind of application you like. You''ll also learn how modern applications
    are structured and even pick up some software engineering skills.


    The ebook for Part 4 is included in the companion content you can download from
    https://aka.ms/BeginCSharp/downloads.'
