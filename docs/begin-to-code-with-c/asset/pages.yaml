  md: '# Improve the Tiny Contacts app


    The Tiny Contacts application can be used as the basis of any application that
    needs to store and retrieve text. You could use it to store recipes or just as
    a general purpose notter. Here are some things you could do to make it even more
    interesting:


    +   - Improve the application so that users can edit the details of the contacts.
    A user could activate the edit behavior after he has viewed a contact.

    - Add a password to the program. You could even add a menu option to let the user
    set the password. The password could be stored along with the contact information.

    - Make the program speak the information as well as display it, or allow users
    to choose which form of output they want.

    - Change the program to use roaming storage so that contact information is synchronized
    across all your Windows devices.


    # Adding IntelliSense comments to your methods


    Modern software is rarely written by one person alone. One might write the first
    version of the code, but many other programmers follow in that person''s footsteps,
    adding features and tracking down bugs. As you''ve learned, comments add a huge
    value to a program. They make it easier for other programmers to understand how
    the code works.


    You can also add special comments to a code file that can be displayed by Visual
    Studio and greatly improve the experience of developers. The feature you use to
    do this is called IntelliSense. You may have already seen how IntelliSense can
    help you write a program. For example, when I was writing the TidyInput method,
    I could point to the name of a C# method, and a description of the method would
    appear, as shown in **Figure 8-6**. It turns out that it is really easy to add
    comments to methods to enable this behavior.'
