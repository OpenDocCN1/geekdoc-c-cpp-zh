  md: "brackets.\" Update this code so that the statements are preceded by an open\
    \ curly bracket ({ and followed by a closed curly bracket (}), and the program\
    \ will run. When you mark the start and end of parts of a program, you must always\
    \ use curly brackets. Parentheses are used for something else.\n\n# PROGRAMMER'S\
    \ POINT\n\n# A good programmer has to be deal with details\n\nHumans are incredibly\
    \ good at dealing with noise. We can pick out our name from background chatter\
    \ and recognize our mother in a sea of faces. Computer programs have to work hard\
    \ to extract meaning from data. The compiler will become confused by one tiny,\
    \ incorrect detail in a program. This means to become a great programmer, you'll\
    \ need to learn how to examine things in great detail, in some cases by character,\
    \ to discover what is wrong with them.\n\nThe best way to deal with mistakes like\
    \ this is, of course, not to make them in the first place. But because we are\
    \ human, this is impossible. Here are my tips for dealing with compilation errors:\n\
    \n+   1. Start from a program that compiles, or runs successfully. (Remember:\
    \ compilers take our high-level code and generate the machine code that enables\
    \ a compiler to perform the actions we want to perform. This is why a program\
    \ that runs successfully without errors compiles.) Visual Studio provides software\
    \ wizards that can be used to make a program that doesn't do but compile.\n2.\
    \ Compile often (in Visual Studio with the run button). If the number of changes\
    \ you have made since the last compilation is small, you can isolate the error\
    \ to just a few places.\n3. Look for the three classic compilation mistakes:\n\
    \   a. Missing something—for example, not putting a semicolon at the end of a\
    \ statement.\n   b. Using the wrong character—for example, using [ rather than\
    \ ].\n   c. Spelling incorrectly—for example, writing \"StartProgram\" rather\
    \ than \"Program\". In the world of C#, it matters whether you use capital letters\
    \ or lowercase letters.\n4. Don't expect the error to be where the compiler has\
    \ detected it. Some mistakes—for example, a missing curly bracket—may be detected\
    \ lines further down the program.\n5. Use the color highlighting to help you.\
    \ Words that are part of C# are shown in blue. Strings of text are red. If a word\
    \ is not the color you think it should be, you might have typed it incorrectly.\n\
    6. Fix all the errors that you can see, and then compile again. Sometimes the\
    \ compiler becomes confused and reports errors on lines that are sensible. Once\
    \ you have fixed all the errors you can see, compile again and see if that works."
