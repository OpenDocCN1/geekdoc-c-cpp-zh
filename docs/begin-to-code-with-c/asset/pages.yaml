  md: 'Here are some questions you might like to ponder types, variables, and expressions.


    # Are values held in the computer to unlimited accuracy?


    No. Each numeric type has a particular range (the highest and lowest values available)
    and precision (the number of significant digits). You can increase the accuracy
    of stored data by selecting a type that uses more bytes of memory to hold each
    value. For example, a `double` variable is held in 8 bytes, whereas a `float`
    variable is held in only 4.


    # Can I get more accuracy by using double-precision variables?


    This really depends on the accuracy of the numbers coming in. If you are measuring
    the length of your desk with a ruler and using that value in your program, it
    is unlikely that you could improve anything by using double precision, as the
    precision of the input value is not that great.


    # Does adding parentheses to an expression make the program faster?


    No. It might help the compiler make sense of your program, but it does not affect
    the speed at which the program actually runs.


    # Does the type of a variable really matter?


    If you try to store text in a location that has been created to store a number,
    this will obviously not work. But you can get worse problems if you use a numeric
    type that has an insufficient range for the value you want to put in it. For example,
    you might declare a type of `byte` (in an attempt to save memory) and then store
    the value 10,000 in that variable. This will not fit (the biggest value you can
    put in a byte is 255), and your program will do very strange things as a result.'
