- img_proc: true
  md: 'This is part of software of good quality. Car designers talk about "active"
    and "passive" safety. Active safety features (good brakes and steering) help prevent
    a driver from getting into trouble, (airbags and seat belts) help prevent a driver
    from being injured if there is trouble. Likewise, good software has active and
    passive elements. Private and public elements contribute to active safety—they
    make it harder for values in the program to be damaged by mistakes in the code.
    (You can''t corrupt the settings for a note in a song because the data members
    have been made private.) Exceptions in programs contribute to passive safety.
    If a program detects that it is dangerous to continue, it can throw an exception
    and fail in a managed way.


    # Making a drawing program with Snaps


