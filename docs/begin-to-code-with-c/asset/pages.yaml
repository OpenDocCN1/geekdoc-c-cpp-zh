  md: '# Add some comments


    You saw in Chapter 5 how to add comments to a program. Up until now in the Pizza
    Picker program, I haven''t added any comments to the code because the variable
    names are clear and the flow of the code is easy to follow. But we''ve arrived
    at a point where adding a comment would be a really good idea. Consider this statement:


    ```

    SnapsEngine.ClearTextDisplay();

    ```


    A programmer reading through the code might take a look at it and be a bit confused.
    What is the point of displaying nothing on the screen? Help other programmers
    understand the purpose of this statement by adding a comment. You might do something
    like this:


    ```

    // Clear the total display from the screen, ready for the more choices

    SnapsEngine.ClearTextDisplay();

    ```


    Now programmers can understand that you are clearing text from the screen to prepare
    for more choices.


    # Adding a while loop


    The Pizza Picker program now has the behaviors it needs to process a single button
    press and select a pizza topping for one person. However, the statements we wrote
    must be repeated for each person who wants to select a topping. We can achieve
    this by adding a loop construction to the program.


    The C# language provides several ways of creating loops. The first one we are
    going to look at is the while loop, which is constructed as shown in Figure 6-3.
    In a while loop, a statement is repeated while the condition specified by a logical
    expression is true.


    ![](img/547210b145d9948b1613255cf1ee9fa4_166_0.png)


    **Figure 6-3** The structure of a while loop.'
