  md: '# # Part 1


    # # Programming fundamentals


    Let''s begin traveling toward programming enlightenment. You''ll start by installing
    the programming tools you need. Next you''ll discover what a computer actually
    does and what a programming language is. You''ll also take your first small steps
    in using the C# language to tell a computer to do things for you, and you''ll
    find out how to work with Snaps, small helpers I''ve created for you to use in
    your first programs.


    The aim of Part 1 is to introduce you to fundamental elements of the C# programming
    language that are used by all programs. Then, in Part 2, you''ll look at how a
    modern programming language like C# builds on these programming fundamentals to
    make it easier to create applications.'
  merge: -1
  pgno: 25
