  md: '**Question:** What is the fault in the program?


    **Answer:** The fault is in line 9. We have seen this problem before. The logical
    expression used here is slightly different from the one used earlier. This expression
    says, "while age less than one and age is greater than 100". When you read it
    out, it sounds silly. How can a number be less than one and greater than 100?
