    has only one item being fed into it, but other methods might have lists of items.
    If you use the text of the program, the StartProgram method has been specified
    to accept an "empty" list of arguments, which means it doesn''t work on any items.
    The designers of the C# language have used different characters to define the
    limits of (or delimited) elements of the program. As we''ve seen, strings are
    delimited by double quotation marks. Lists of arguments are delimited by parentheses
    (). The contents of a class and the body of a method are delimited by curly brackets
    {}. As you might expect, the compiler is very careful to make sure the use of
    these delimiters "makes sense," and will reject any program that has mismatched
    delimiters.


