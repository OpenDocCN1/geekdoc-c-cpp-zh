    # # What you have learned


    In this chapter, you''ve taken some solid steps toward becoming a “professional”
    developer. You''ve seen how to use C# constructions to allow programs to manage
    access to elements and behaviors within objects. You have seen that by making
    data private and providing public set methods, you can create an object that will
    always hold valid content in the context of the business rules that apply to the
    program.


    You''ve also discovered C# properties, which make it very easy for others to have
    access to data managed by an object but also allow you to ensure that the data
    held inside the object has integrity. You''ve also taken a look at exceptions
    and how a program can deal with exceptions that are thrown as a program runs.


    You also built an entirely new application from scratch. In the Drawing Diary,
    you''ve explored the relationship between data held in objects and which is held
    in files on the host computer. It also shows how to break a fairly complex program
    into a set of small, easy to understand methods.


    Here are some questions that you might like to ponder:'
