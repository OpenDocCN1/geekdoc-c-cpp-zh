  md: '# What you will learn


    I''ve described a computer as a sausage machine, which accepts an input, does
    something with it, and then produces an output. This is a great way to start thinking
    about computers, but a computer actually does a lot more than that. Unlike a real-life
    sausage machine, which simply tries to create sausage from anything you put in
    it, a computer is able to respond to different inputs in different ways. In this
    chapter, you''ll discover how to make your programs respond to different inputs.
    You''ll also learn about the responsibility that comes with making the computer
    work in this way—you have to be sure that the decisions your programs make are
    sensible ones.


    With this information in hand, we''ll build an application that behaves according
    to the user''s selection. As we build this application, you''ll learn more about
    the logical expressions you can use to control a program. Then, at the end of
    the chapter, we''ll expand on your newfound programming skills by exploring how
    to incorporate images and sounds in your programs.


    +   - Understanding the Boolean type ...................................................................102

    - Using if constructions and operators ...................................................................104

    - Creating blocks of statements ...................................................................110

    - Creating complex conditions using logical operators ................................113

    - Adding comments to make a program clearer .................................................117

    - Funfair rides and programs .......................................................................119

    - Working with program assets .......................................................................127

    - What you have learned ................................................................................132


    ![](img/547210b145d9948b1613255cf1ee9fa4_125_0.png)'
