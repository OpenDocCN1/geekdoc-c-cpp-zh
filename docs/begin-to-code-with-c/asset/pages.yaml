    # CODE ANALYSIS


    # Using structure variables


    Structure variables are a new way of holding data. It is worth thinking about
    how they work in some detail.


    **Question:** What does the period character do in a statement myNote.NotePitch
    = 0?


    **Answer:** The period separates the name of the variable (myNote) from the name
    of the member (either NotePitch or NoteDuration in this case) of the variable
    of structure. This is how a program can access elements inside an object.


    **Question:** Is there anything special about members of a structure value?


    **Answer:** No. They can be used in the same way as variables of that type. In
    other words, a program can use the NoteDuration member of a SongNote value as
    a double-precision floating-point value.


    **Question:** What are the initial values of the members of a brand -new structure
    variable?


    **Answer:** The compiler will fail if a program tries to use a variable before
    it has been given a value. The following code will not compile:


    ```

    int newInt;

    int i = newInt;

    ```


    The error "Use of unassigned local variable "newint" would be produced because
    the program is trying to use the value of the variable before it has been assigned
    one. Structures behave in the same way. The initial values of all of the items
    they hold are set to "unsigned".


    ```

    SongNote newNote;

    int r = newNote.NotePitch;

    ```


    These statements would also fail to compile because the value of NotePitch in
    the newNote variable has not been assigned.


    **Question:** What happens when I assign one structure variable to another?


    Storing music notes by using a structure 251'
