  md: 'game developers the ability to make many different kinds of game objects, each
    of which has a behavior different from the others.


    Here are some questions that you can ponder about class design.


    # Do I have to design all of my class hierarchy before I start?


    Not necessarily. You should always attempt an initial design because this forces
    you to think about how the elements in your solution fit together, but as you
    build your program, you will get insights into how it should be structured. In
    many cases, it will be necessary to add new classes to a working system when new
    scenarios are identified during the lifetime of the project. One of the great
    benefits of an approach like this is how easy it is to insert new elements into
    the design.


    # Do I always need a class hierarchy?


    You need a class hierarchy if your program needs to manage a large number of related
    items. For example, if you are creating a tool that collects evidence from the
    scene of a crime, it would be very useful to make some kind of class hierarchy
    based on a parent class called *Evidence*, which would hold the date, time, and
    location where the evidence was collected. Underneath that you could have child
    classes that contain images, sounds, of samples collected, and so on. In that
    case you have a strong type of evidence that your system will want to collect.
    As technology advances, you might find different kinds of evidence that will need
    to be managed. These could be added as the system evolves.


    However, if your program is concerned with something that is going to remain fundamentally
    and there are not going to be different kinds of this item, you don''t need a
    class hierarchy. For example, if you write a program that plays cards, there is
    really going one kind of playing card. The card will have a set of properties
    that denote its color, suit, and value, and this will never need to be extended
    because the program will never have to deal with new kinds of playing cards.


    # Is it possible to make bad designs using class hierarchies?


    Oh, yes There are a few common mistakes. The first is to have a very wide class
    hierarchy. like *Car*, *SportsCar*, *PeopleCarrier*, *PickupTruck*, and so on.
    This breadth makes design very difficult. For example, is a sports utility vehicle
    (SUV) descended from *SportsCar* or *PeopleCarrier*? In this case, you really
    need only *CarType* in the *Car* object and you are good to go. But you''d probably
    have a *Truck* since trucks are very different from cars. When you are thinking
    about design, you need to consider whether the behavior of the class needs to
    be different for this particular type. If the answer is yes no—if you are just
    storing something about this particular instance of the class—then instead you
    can add a property that holds this information.'
  merge: -1
  pgno: 468
- img_proc: true
  md: 'Another mistake is to have a very deep class hierarchy. You create lots and
    lots of child classes "just in case" they might be useful. You might have Car,
    TwoWheelDrive-Car, FourWheelDrive, TwoWheelDriveConvertible, FourWheelConvertable,
    TwoWheelDriveSportsCar, and so on, all descending from each other. This makes
    the program slower because when it runs, it takes longer to find the overridden
    methods in the hierarchy. I try not to have more than three or four levels in
    my class designs.


    The final mistake is to bring things into the class hierarchy that really should
    not be there. You might think adding a new kind of car called HiredCar, which
    has the name and address of the person who hired the car stored inside the Car
    class. However, these items pollute the hierarchy by adding data to some class
    items that really should not be there. If you want to manage a car-hire business,
    you should work in terms of Hire objects that contain references to Car objects
    that are hired and Customer objects that hire them. The Car class should hold
    information directly relevant to cars and nothing else.'
