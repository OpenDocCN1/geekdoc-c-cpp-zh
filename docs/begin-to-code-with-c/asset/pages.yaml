- img_proc: true
  md: 'Note in Figure 10-8 I named the object ContactClass not classRob. I did this
    because the object instance does not have the identifier classRob; that instance
    is simply the one that classRob is connected to the moment. Which particular object
    reference refers to as the program runs. This happens, for example, when a program
    assigns a new value to a reference.


    # References and assignments


    Using references to manage objects change the behavior of the assignment operator—the
    operator that programs use to change the value of variables. Consider the following
    statement:


    ```

    ContactStruct s1;

    ContactStruct s2;

    s1.ContactName = "Rob";

    s2 = s1;

    s2.ContactName = "Jim";

    ```


    We regard the two variables (s1 and s2) as named boxes in memory, with each boxing
    a particular value. When we perform an assignment, the program copies the value
    from one box to the other. These statements would complete with two structures,
    one containing the name "Rob" and the other name "Jim".


    However, when the program starts using references, the situation changes.


    ```

    ContactClass c1 = new ContactClass();

    ContactClass c2 = new ContactClass();

    c1.ContactName = "Rob";

    c2 = c1;

    c2.ContactName = "Jim";

    ```


    This sequence of statements does exactly what we just saw do. However, these work
    with variables of type contactClass. At the end of the statements, we have an
    arrangement such as shown in Figure 10-9. Both of the tags are tied to the same
    object in memory, and the object originally assigned to c2 has nothing to do it
    at all. The name of c2 is now "Jim" because the final assignment overwrote the
    value of "Rob" that was set earlier.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '![](img/547210b145d9948b1613255cf1ee9fa4_336_0.png)


    **Figure 10-9** Assigning references.


    C# does not have a problem with programs that attach multiple reference tags to
    a single object. But they do have an effect on what happens when the program runs.


    When you work with references, you have to remember that the assignment operator
    now works in this way. Rather than moving data from one variable to another, it
    makes two references to the same object in memory. This is very useful if your
    program has good reason to do so this—for example, that two documents in a word
    processor can share a single dictionary—but it is also very confusing if you don''t
    plan for it.


    > ### PROGRAMMER’S POINT


    References are tricky but vital


    There is a trickiness with objects and references. There is no limit to the number
    of references that can be attached to a single instance, so you need to remember
    that changing the object that a reference refers to may well change that instance
    from the point of view of other objects. This is terribly useful, but as they
    say in the comic books, "With power comes great responsibility." Later on in this
    chapter we''ll take a closer look at how to use references.


    # Objects that have no references to them


    One situation we need to consider is when an object in memory can end up having
    nothing referring to it. We saw this in **Figure 10-9**, where the reference originally
    assigned to c2 ended up "hanging" in space, having nothing referring to it. As
    far as making use of data in the instance is concerned, it might as well not be
    there.


    The C# language implementation has a special class called the garbage collector
    that is given the job of finding such useless items and disposing of them. Note
    that the compiler will not stop us from writing code that releases references
    to objects; this all happens when the program runs, not when it is compiled.'
  merge: -1
  pgno: 336
- img_proc: true
  md: "You should also remember that you can get a similar effect when a reference\
    \ to an instance goes out of scope:\n\n```\n{n  ContactClass localVar;\n  localVar\
    \ = new ContactClass();\n}\n```\n\nThe variable localVar is local to the block.\
    \ When the program execution leaves the block, the local variable is discarded.\
    \ This means that the reference to the ContactClass is also removed, meaning another\
    \ job for the garbage collector.\n\n# PROGRAMMER’S POINT\n\nWhile it is sometimes\
    \ reasonable to release items you have no further use for, you must remember that\
    \ creating and disposing of objects takes up time. When I work with objects, I\
    \ worry how much creating and destroying I am doing. Just because the objects\
    \ are disposed of automatically doesn't mean you should abuse the facility. One\
    \ way to improve performance is to have a \"free list\" of objects that are not\
    \ currently in use. When the program needs a new object, it gets it from the list\
    \ rather than creating a new one from scratch. Unwanted objects are in the free\
    \ list rather than discarded. The Windows operating system itself makes use of\
    \ this programming trick to manage many of the objects that keep the system going.\n\
    \n# CODE ANALYSIS\n\n# Value types vs. reference types—First!\n\nGiven their confusing\
    \ nature, you might think that using references is a bad idea. They add complications\
    \ to your program that you'd rather not have. But in the great tradition of video\
    \ games, let's take a look at how value types and reference types can work together\
    \ to solve programming problems.\n\n# Value types\n\nA value type is the kind\
    \ of thing you'll find holding the height of a football player, the amount of\
    \ money you have in the bank, the color of a pixel, or the date you were born.\
    \ These are simple values that describe something. We never want to share these\
    \ objects. They just represent values that a program is interested in."
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Value types: Special skills


    +   - When assigned, all content of the value type is copied to the destination.

    - When you pass a value type into a method, the method is given a copy of the
    value and can''t mess with the original.

    - When a method returns a value type result, this is just a value and the user
    can''t mess with the original.


    # Value types: Weaknesses


    +   - It can be hard to move values around in memory. A very large structure (which
    will be managed by value) will take a lot of effort to copy it when it is moved
    from one location to another.

    - If you want to make a method that changes the content of a value type, you have
    to copy the contents of the value into the method when it is called and then copy
    the changed version back into your program afterward, which is slow.


    # Reference types


    A reference refers to things like your bank account details. It is useful when
    a program includes something that you don''t want to move around and you want
    programs to be able to share. This can be something that is effectively read-only—for
    example, the image file for a corporate logo that is used in lots of documents
    or a sound file that is played to alert a user. A reference can also refer to
    a large data object—for example, a huge customer account record—that you prefer
    not to move around in memory.


    # Reference types: Special skills


    +   - Changing a reference so that it refers to a different object is very quick
    and performed at the same speed regardless of the size of the object.

    - Using a reference to an object as a parameter is also very fast because only
    the location of the object is passed to the method.

    - Methods can return huge objects very quickly because they just have to return
    the reference.


    A program can contain multiple lists of object references that give different
    views of the data. For example, one list of bank accounts could be ordered by
    name, another by account balance.


    # Reference types: Weaknesses


    +   - Programmers need to be aware that creating a reference and creating the
    object that it is connected to are two different steps.'
