    # WHAT COULD GO WRONG


    # Missing fonts can make your games look silly


    A great way to make a game distinctive is to display game messages in an interesting
    font. But don''t make the mistake of thinking everyone has the same fonts available
    on their computer as you do. Programs like Microsoft Office and Adobe Photoshop
    add extra fonts when they are installed. Some players of your games might not
