  md: "• Programmers need to understand the effect of assigning one reference to another.\n\
    \n• If I give another program a reference to my object, I lose control of what\
    \ happens to that object. The other program can change that object in ways I might\
    \ not expect, which might lead to faults in my software that are hard to diagnose.\n\
    \n• To use references, we need some mechanism of tidying up objects that no longer\
    \ have references to them. This garbage collection can slow a program run or result\
    \ in unpredictable changes in performance as memory is tidied during program execution.\n\
    \n# Reference vs. value\n\nI'm making a Space Invader game. I've designed an object\
    \ that contains data of different types that I'm going to manage the game. Which\
    \ of the new types in the SpaceAlien class be value types and which should be\
    \ references?\n\n```\npublic class SpaceAlien {\n    public Coordinate Position;\
    \ // position of the alien on the screen\n    public Damage Damage; // damage\
    \ taken by the alien\n    public Sound KillSound; // sound made when alien is\
    \ killed\n    public Image Image; // image of the alien\n}\n```\n\n+   • Position\
    \ each alien will have its own position on the scene. There's no benefit in sharing\
    \ position values among aliens, so the Position type should be a value type, in\
    \ this case structure.\n\n+   • Damage each alien will have a Damage value that\
    \ tracks how many they've had and the number of hits it takes to kill the alien.\
    \ This should be a value type because each alien will have its own amount of damage.\n\
    \n+   • KillSound this is the sound that an alien will make when it is destroyed.\
    \ The sound information is quite a large amount of data. We might have up to 100\
    \ aliens on the screen and we don't want to store the sound information inside\
    \ each alien. Each KillSound will be a reference type. Each SpaceAlien will have\
    \ a variable that holds the sound that it makes when it is destroyed. This doesn't\
    \ mean that each alien must have the same kill sound, but if two aliens do the\
    \ same kill sound, this is stored only once in the game.\n\n+   • Image is the\
    \ image of the alien. Just like the sounds, there are only a few images that are\
    \ to be shared for all the aliens, so this should be a reference type, too.\n\n\
    The fight over the SpaceAlien ends as a draw, with two data members each."
