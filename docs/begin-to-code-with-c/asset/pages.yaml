  md: '# Stepping through program statements


    When a program is paused, you can tell Visual Studio to step through the program''s
    statements by using a set of buttons that control this activity. These buttons
    appear on the Visual Studio toolbar when the program is paused. I''ve identified
    them in Figure 6-8, along with the function key assigned to them. (You can press
    the function key instead of clicking the button.)


    +   - Step into method (F11)

    - Step over a method (F10)

    - Step over a method (Shift+F11)


    Figure 6-8 Use these buttons to step through a program in Visual Studio.


    If you select **Step into a method** or press F11 when the program is paused at
    a state- about to call a method, Visual Studio will open the file that contains
    that method and investigate the statements inside that method. Doing this is useful
    if you want to cover exactly what a method is in Chapter 8, but for now consider
    the `ReadInteger` method. It contains code that returns an integer. If we want
    to step through each statement in the `ReadInteger` we can press F11 to enter
    it. If you want to leave a method that you are stepping through and return to
    the one that called, you can use the **Step out of method** button (or hold Shift
    and Press F11).


    The most useful button at the moment is **Step over a method** (F10). This command
    lets you step through program and follow the path of execution. Each time you
    enter this command, Visual Studio performs one statement and then pauses the program.
    In our program, what happens when you perform a step depends on the value of age.
    If you entered a valid age (in the range 1 to 100), the loop will end and the
    program will move on to the call of `DisplayString`. If you entered an invalid
    age, the program will loop again.


    # Continuing the program


    When you start stepping through a program and run it normally, press the **Continue**
    button (or F5) to resume. The program will start at the next breakpoint reaches
    (if it finds). Visual Studio also has a breakpoint window that you can use to
    see the breakpoints you have created. You can display this window by going to
    the **Debug, Windows** menu in Visual Studio and selecting the **Breakpoints**
    option.'
