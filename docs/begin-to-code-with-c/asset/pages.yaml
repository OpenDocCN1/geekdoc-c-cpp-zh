  md: '# Invalid JSON strings


    You might wonder what happens if the string that is deserialized doesn''t contain
    valid JSON. In this situation, the DeserializeObject method does the only thing
    it can do, which is to throw an exception. Of, if the string was valid JSON, it
    is still possible that the content has no meaning—for example, the MinutesSpent
    value could be -10000. In the next chapter, we will take a look at how we can
    make sure that our objects are always sensible.


    # Storing and recovering lists


    It''s easy to store a single Contact item using JSON, but what about our list
    of contacts? Well, it turns out that JSON can take this in stride. The following
    statement makes a called using json, which contains all the contacts in the list.


    ```

    string json = JsonConvert.DeserializeObject(contacts);

    ```


    And here is how a JSON can contain multiple objects; they are stored as a comma-separated
    list of objects inside square brackets:


    ```

    [{"ContactName":"Rob","ContactAddress":"Rob''s house","ContactPhone":"Rob''s Phone","ContactMinutesSpent":0},{"ContactName":"Mary","ContactAddress":"Mary''s
    house","ContactPhone":"Mary''s Phone","ContactMinutesSpent":30},{"ContactName":"David","ContactAddress":"David''s
    house","ContactPhone":"David''s Phone","ContactMinutesSpent":60},{"ContactName":"Jenny","ContactAddress":"Jenny''s
    house","ContactPhone":"Jenny''s Phone","ContactMinutesSpent":90}]

    ```


    When the program wants to read back the collection, it can use the same method
    as before, except that the destination type is now a list of Contact objects rather
    than a single Contact:


    ```

    contacts = JsonConvert.DeserializeObject<List<Contact>>(json);

    ```'
