    # Declaring methods in classes


    **Question:** What is the difference between a behavior and a method?


    **Answer:** A behavior is an action that an object can perform. The method is
    the actual C# code that delivers behavior.


    **Question:** Can a class contain more than one method?


    **Answer:** Yes. A programmer decides how many behaviors a class should provide,
    and she writes a method for each one. The demo program we''ve been looking at
    has only one behavior: to start the moment. Later on we will create classes with
    many methods in them.


