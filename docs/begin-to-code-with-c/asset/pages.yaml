- img_proc: true
  md: 'The job of the programmer is to create a program as a sequence of instructions
    that describes the tasks to be performed. To solve a problem successfully, the
    programmer must not only write a good program but also make sure that the program
    actually does what the user wants. This means that a programmer can write any
    code, she will have to make sure she has a good understanding of exactly what
    is required. Talking to people and finding out what they want is a very valuable
    skill and worth acquiring if you want to be a successful programmer.


    To reinforce your understanding of the content, you might want to consider the
    following questions about computers, programs, and programming.


    # Would a computer “know” that it is nonsensical for someone to have an age -20?


    No. As far as the computer is concerned, the age is just a pattern of bits that
    represents a number. If we want a computer to reject ages that are negative, we
    have to actually build that into the program ourselves.


    # If the output from a program is the settings for the fuel-injection system on
    a car, is it the output data or information?


    As soon as something starts acting on data, I think it becomes information. Human
    being is not doing anything with these values, but they will cause the speed of
    the engine to change, which might well affect humans, so I reckon this makes this
    information rather than data.


    # Is the computer unintelligent because it can’t understand English?


    It is very hard to write something in English that is completely unambiguous.
    Large parts of the legal profession are built on precise interpretation of the
    meaning of texts and how they are applied in particular situations. Since we humans
    can’t agree on how to understand something, I don’t think it is fair to call a
    computer stupid because it can’t do either.


    # If I don’t know how to work out the answer, can I write a program to do it?


    No. You can put some statements together and see what happens when they run, but
    this is very unlikely to make what you want. It is rather like throwing a bunch
    of wheels, gears, and an engine against a wall and expecting them to land and
    form a working car. In fact, the best way to write a program is frequently to
    get away from the keyboard for a while and just think about what the program is
    supposed to do.'
  merge: -1
  pgno: 64
