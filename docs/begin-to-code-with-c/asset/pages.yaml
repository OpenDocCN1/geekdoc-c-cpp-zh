  md: '# What you will learn


    In this chapter, you''ll learn another step in how to control what a program does.
    Until now, we''ve written programs that run once and then stop when they''re complete.
    But you often need to make a program repeat a sequence of actions. For example,
    if a user enters an invalid value, you want the program to reject that value and
    repeat the sequence to ask for another value. To repeat a series of actions, programs
    use what''s known as a loop. In a video game, the "game loop" continuously reads
    the positions of the game controllers, updates the variables that reflect the
    status of the players and the game world, and then draws the game world on the
    screen. In this chapter, you''ll discover the C# constructions that you can use
    to create loops.


    +   Using a loop to make a pizza picker ............................................136

    Performing input validation with a while loop ...................................149

    Using Visual Studio to follow the execution of your programs ...................151

    Counting in a loop to make a times-tutor ........................................157

    Using a for loop construction ................................................................160

    Breaking out of loops .........................................................................163

    Going back to the top of a loop by using continue ...................................165

    Extra Snaps. .....................................................................................168

    What you have learned ........................................................................170


    ![](img/547210b145d9948b1613255cf1ee9fa4_159_0.png)'
