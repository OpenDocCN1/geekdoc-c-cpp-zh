  md: "# Creating enumerated types\n\nStructures are very useful when we want to design\
    \ data storage that can hold a set of related values. But sometimes, rather than\
    \ increasing the capacity of a data-storage element, we want to restrict the range\
    \ of possible values that a variable can have. For example, we could improve the\
    \ drawing program to let the user draw with different shaped pens or even with\
    \ an eraser pen that draws with the background color. One way to address this\
    \ would be to map some integer values onto the different kinds of pens that are\
    \ available:\n\n```\nint penType;\n{\n    // round pen\n}\n (penType == 1)\nif\
    \ (penType == 2)\n{\n    // square pen\n}\nif (penType == 3)\n{\n    // erase\
    \ pen\n}\n```\n\nThe variable penType is an integer. The code above uses the values\
    \ 1, 2, and 3 to mean round pen, square pen, and eraser pen, respectively. Each\
    \ time a drawing operation is performed, the program can select the appropriate\
    \ action based on the value in the variable. This would work fine, but from a\
    \ programming point of view, it's a bit dangerous. There's nothing to stop a programmer\
    \ from putting an invalid value into the variable:\n\n```\npenType=99;\n```\n\n\
    This would break the program. What we really want is to create a new data-storage\
    \ type that can hold only three possible values. It turns out that C# provides\
    \ just this, the enumerated type."
  merge: -1
  pgno: 302
- img_proc: true
  md: "```\nenum PenModes\n{\n  RoundPen,\n  SquarePen,\n  ErasePen\n};\n```\n\nThe\
    \ enum keyword is followed by the name of the enumerated type created.\nThat Name\
    \ is followed by a block containing a list of the possible values that this type\
    \ can hold. The PenModes type contains three entries, but you can use as many\
    \ as you need.\n\nOnce we have created the new type, we can create variables of\
    \ that type:\n\n```\nPenModes penType;\n```\n\nThe variable penType can be set\
    \ to any of the values available for this type:\n\n```\npenType = PenModes.SquarePen;\n\
    ```\n\nThe statement above sets the value to represent drawing with the square\
    \ pen. Enumerated types can be used in a C# program in the same way as other types.\
    \ They can be used as parameters to methods or return values from them. It is\
    \ not possible to do arithmetic with them. The idea of adding 1 as PenMode value\
    \ does not have any meaning. A program can test the value of an enumerated type\
    \ by using a condition. This code tests whether the pen type is set to the square\
    \ pen:\n\n```\nif(penType == PenModes.SquarePen)\n{\n  // draw with the square\
    \ pen\n}\n```\n\nAnother useful effect of using enumerated types is that code\
    \ becomes easier to understand. If the program compares penType with the value\
    \ 3, the reader has to know, or find out, that 3 means erase. But if the program\
    \ compares penType with Pen-Modes.ErasePen, what's going on is very obvious to\
    \ someone reading the code. This is a good thing!"
