  md: '# What you will learn


    When you started to learn about programming, I said, "Anyone who can organize
    a party can write a program." You''ve now discovered that a lot of programming
    is actually all about organization, which is why good organizers tend to make
    good programmers. In the last chapter you saw how to create family trees of related
    objects to more easily organize complex applications. Instead of being made from
    scratch, a new version of an object has to provide only those behaviors that are
    different from the object it extends. This is an important principle that underpins
    many large-scale applications.


    In this chapter, you are going to go further in understanding how objects are
    used in programs and start to think of them as components that you can fit together
    to form a solution. You are going to discover how objects can communicate by sending
    messages to each other and how an object can maintain a sense of its own state.
    Then you are going to move on to consider how to create template objects that
    can be used as the basis of complex designs and how to turn objects into reusable
    and flexible program elements by using software interfaces. At the end of the
    chapter, we''ll have a fully playable space-shooter game as well!


    Games and objects .................448


    What you have learned .................................471'
