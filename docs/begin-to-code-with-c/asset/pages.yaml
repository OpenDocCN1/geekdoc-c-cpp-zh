  md: "# Games and objects: Space Rockets in Space\n\nIn this section, we'll start\
    \ building a new type of space-shooter game—Space Rockets in Space. We will be\
    \ ambitious and aim to include a moving star field in the background, rockets,\
    \ kinds of attacking aliens, and all kinds of other things. This might sound like\
    \ a lot of work, but we'll have fun and learn some programming techniques from\
    \ doing it.\n\nAs you've learned, you can use objects to manage large and complicated\
    \ software projects. Because our new game may turn out to be larger and complicated,\
    \ we are going to use objects to make things a lot easier.\n\nSo far, we haven't\
    \ used objects in our game programs. In the Keep Up! game we created in Chapter\
    \ 12, the game elements—the ball and paddle—were managed as a collection of different\
    \ variables. As a quick review, the ball is managed in terms of the ImageSprite\
    \ and the X and Y speeds that control the movement of the ball:\n\n```\npublic\
    \ ImageSprite sprite;\npublic double xSpeed, yScale;\n```\n\nIf we wanted to put\
    \ 20 balls on the screen, the program would have to store 20 image sprites and\
    \ 20 of each of the speed values. These details would be hard to manage even if\
    \ we used lists of each element. Instead, we can keep these items together by\
    \ creating a class, which I've called MovingSprite, to contain them. The MovingSprite\
    \ class contains the image to draw (spriteValue) and the X and Y speed values\
    \ (xSpeed and yScale). You can think of a MovingSprite as a container that will\
    \ be used to move falling stars over the viewport. The intention is to use it\
    \ for aliens, rockets, and falling stars—we can use for any sprite that has movement.\n\
    \n```\npublic class MovingSprite {\n    public ImageSprite spriteValue;\n    public\
    \ double xSpeed, yScale;\n\n    public MovingSprite(ImageSprite sprite, double\
    \ xSpeed, double yScale) {\n        spriteValue = sprite;\n        xSpeed = xSpeed;\n\
    \        yScale = yScale;\n    }\n}\n```"
