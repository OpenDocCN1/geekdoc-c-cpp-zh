- img_proc: true
  md: 'Most reasonably complex devices created today contain data-processing components
    to optimize their performance, and some only exist because we can build in such
    capabilities. It is this world that you, as a beginning programmer, are moving.
    It is important to think of data processing as much more than working out the
    company payroll—calculating numbers and printing out results (the traditional
    uses of computers). As a software engineer, you will inevitably spend a great
    deal of your time fitting data-processing components into other devices to drive
    them. These embedded systems mean many people will be using computers even if
    they''re not aware of it!


    # PROGRAMMER’S POINT


    Software might be a matter of life and death


    You should also remember that seemingly innocuous programs can have life-threatening
    possibilities. For example, a doctor may use a spreadsheet that you have developed
    to calculate doses of drugs for patients. In such a case a defect in the program
    could result in harm. (Note that I don’t think doctors actually do this—but you
    never know.)


    # Making programs work


    Inside every computer is hardware—physical machinery, that is—that actually does
    the data processing I’ve been describing. This hardware is the central process-ing
    unit, or CPU. The programs that directly control the CPU, telling it what to do,
    are called machine code. Different kinds of CPUs have different designs of code,
    in the same way that humans communicate by many different languages.


    Machine code contains the individual steps that tell the CPU what to do. Simple
    operations—for example, adding one number to another—are performed by a sequence
    of machine-code instructions. To write machine code, you have to know exactly
    how the hardware works and what particular instructions it understands. To understand
    what this means, take a look at Figure 2-4, which shows part of a program that
    totals up what a customer buys at a supermarket. This program adds the price of
    item to the customer’s total bill.


    | High Level Program | Low Level Program |

    |---|--|

    | 1. Add the price of a can of beans to the bill. | 1. Fetch the bill value. |

    | | 2. Fetch the price of a can of beans |

    | | 3. Add the two values together. |

    | | 4. Put the value back. |


    **Figure 2-4** A single step in a high-level program is broken down by a low-level
    program.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'The instructions on the right are the lower-level instructions that the computer
    is actually able to perform. These describe the individual steps that the computer
    has to go through to perform the action, adding the price of an item to a bill.
    Writing low-level programs is rather tedious because an action, as you can see,
    needs to be broken down into a number of smaller ones.


    The good news, however, is that programmers over the years have thought about
    this and invented new languages that can be used to tell a CPU to do what. A program
    written in a high-level language doesn''t "higher level" than provide the individual
    machine-code steps required to perform a particular action. It just contains an
    instruction such as, "Add this number to another." A special program called a
    compiler takes this high-level program and generates the machine code required
    for the computer to be able to perform the task. After you have written your high-level
    program (in C#, for example), it will be compiled to produce the machine code
    that runs inside the computer.


    A useful side effect of using a high-level language is by changing the compiler
    you can generate machine-code programs for different hardware platforms. The C#
    programs you are going to write over the course of this book can be made to work
    on Windows, Android, and Apple devices because compilers are available that will
    convert the high-level statements into machine code for those devices. If anyone
    asks you which type of computer you are learning to program, you can correctly
    reply "All of them."


    # Programs as data processors


    **Figure 2-5** shows what every computer does. Data goes into the computer, which
    does something with it, and then data comes out of the computer. What the data
    takes and what the output means is entirely up to us, as is what the program does.


    ![](img/547210b145d9948b1613255cf1ee9fa4_51_0.png)


    **Figure 2-5** a computer as a data processor.


    As I quickly mentioned earlier, another way to think of a program is like a recipe,
    which is illustrated in **Figure 2-6**.'
