  md: '# Sometimes you get blindsided


    We use blindsided to mean something that happens that you just did not see coming—like
    a friend of mine who carefully made two copies of his files on two separate hard
    disks so he could be sure he would not lose any data if one of the disks failed.
    Unfortunately, this did not help him much when his computer, with both drives
    inside, was stolen.


    You can get blindsided in software projects when you suddenly discover that there
