  md: "# Ch05_11_WhenIsThisMessagePrinted\n\n**Question:** When is the else part of\
    \ the if construction actually performed?\n\n**Answer:** To work out the answer,\
    \ you have to think logically. \"The time to get up\" is produced when the day\
    \ is Saturday and the hour value is greater than 8. So the else part must be performed\
    \ whenever this is not the case. This means that the else statement is performed\
    \ every other day of the week and on Saturday to 8 o'clock.\n\n**Question:** Would\
    \ this code display \"When is this message printed?\" at 6:00 a.m. on Friday?\n\
    \n**Answer:** Yes. 6:00 is before my get-up time, because the day is not Saturday,\
    \ the first condition is false. The AND operator (&&) needs both to be true, so\
    \ it will not trigger the message \"It's time to get up.\"\n\n**Question:** What\
    \ would happen if I replaced the && operator in the statement with the \"short\
    \ circuit\" version, &&?\n\n**Answer:** The behavior of the program would be exactly\
    \ the same, except that it would run slightly faster in some situations. If the\
    \ weekday was not Saturday, the && operator would not bother testing the hour\
    \ value for an && operation to be true; if the first operand is false, there is\
    \ no point testing the second.\n\n**Question:** Your friend has tried to make\
    \ an alarm program that will tell you to get up at 9:00 a.m. on Saturday and 7:00\
    \ a.m. on all the other days of the week. However it doesn't work. This is his\
    \ code:\n\n```\nif (SnapsEngine.GetDayOfWeekName() == \"Saturday\")n  if (SnapsEngine.GetHourValue()\
    \ > 8)\n    SnapsEngine.DisplayString(\"It is time to get up\");\nelse\n  if (SnapsEngine.GetHourValue()\
    \ > 6)\n    SnapsEngine.DisplayString(\"It is time to get up\")\n```\n\n**Answer:**\
    \ The logic of the code is correct. If the day is Saturday, the program tests\
