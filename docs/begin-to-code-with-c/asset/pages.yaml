- img_proc: true
  md: 'to allow programmers to identify specific classes. The C# mechanism is called
    a namespace. When you create a class, you can place it in a particular namespace,
    and one namespace can contain another. When we look at creating namespaces later
    in the book.


    We can use the fully qualified name for the class, but this is tedious. Instead
    we can tell to look in a particular namespace for things it can''t find in our
    program. We do this by adding a using statement at the top of the program.


    ```

    using System.Collections.Generic;

    ```


    In effect, this statement, "if you can''t find something with a particular name,
    the namespace prefix System.Collections.Generic to the name and look again." Now
    we can write List in our program, and the compiler will automatically look for
    System.Collections.List. You saw this in Chapter 9 when we wanted to use the Exception
    object in System namespace.


    The statement that we creates an array. similar to the statement that a List is
    list of references, so all items in the list will be managed by reference.


    ![](img/547210b145d9948b1613255cf1ee9fa4_344_0.png)


    ```

    List<string> guestNames = new List<string>();

    ```


    When you create a List, you ask for a list of a particular type, in this case
    string. You can use the List to hold items of any C# type, including classes and
    structures that you create. The type of list that you want is given between the
    < and characters. If we want to store the contact information for the Time Tracker,
    we would write this:


    ```

    List<Contact> contacts = new List<Contact>();

    ```


    The construction is exactly the same, only the type of the list has been changed.


    When you create a list you don''t specify how many items the list will store.
    You can add elements to the end of the list at any time.'
