  md: '# Introduction


    I think that programming is the most creative thing you can learn how do. If you
    learn to paint, you can make pictures. If you learn the violin, you can make music.
    But if you learn to program, you can create experiences that are entirely new
    (and you can make pictures and music too if you want). Once you have started on
    the programming path, there''s no limit to where you can go. There are always
    new devices, technologies, and marketplaces where you can use your programming
    skills.


    You can think of this book as your first step on a journey to programming enlightenment.
    The best journeys are undertaken with a destination in mind, and this one is no
    different. I'' like to describe the destination as "usefulness." By the end of
    this book you won''t be the best programmer in the world (unless I retire, of
    course), but you will have enough skills and knowledge to write properly useful
    programs. And maybe you can have at least one of your programs available worldwide
    for download from the Microsoft Store.


    However, before we start off, I''d to issue a small word of warning. In the same
    way that a guide would tell you about the lions, tigers, and crocodiles that you
    might encounter if you went on a safari adventure, I must let you know that our
    journey might not be all smooth sailing. Programmers have to learn to think differently
    about problem solving a computer just doesn''t work the way that we do. Humans
    can do complex things rather slowly. Computers can do simple things really quickly.
    It is the job of the programmer to harness the simple abilities of the machine
    to solve complicated problems. This is what we are going to learn to do.


    The key to success as a programmer is pretty much the same as for lots of other
    endeavors. If you want to become a world-renowned violin player, you will have
    to practice it. The same is true for programming. You will have to spend quite
    a bit of time working on your programs to get code-writing skills. But the good
    news is that, just as a violin player enjoys making the instrument sing, making
    a computer do exactly what you want turns out to be a really satisfying experience.
    And it gets even more enjoyable when you see other people using programs that
    you have written and finding them useful and for to use.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# How this book fits together


    I''ve organized this book in four parts. Each part builds on the previous one
    with the aim of turning you into a successful programmer. We start off considering
    the low-level programming instructions that programs use to tell the computer
    what to do, and we finish by looking at professional software practices.


    # Part 1: Coding fundamentals


    The first part gets you started. It points you to where you will install and use
    the programming tools that you will need, and it introduces you to the fundamental
    elements of the C# programming language that are used by all programs.


    # Part 2: Advanced programming


    Part 2 describes the features of the C# programming language that are used to
    create more complex applications. It shows you how to break large programs into
    smaller elements and how you can create custom data types that reflect the specific
    problem being solved. You''ll also find out how programs can maintain data in
    storage when they are not running.


    # Part 3: Making games


    Making games is great fun. And it turns out that it is also a great way to learn
    how to use object-oriented programming techniques. In this part, you''ll build
    some playable games and at the same time learn the fundamentals of how to extend
    programming objects through inheritance and component-based software design.


    # Part 4: Creating applications


    Part 4 is where you find out how to createfledged user applications. You''ll discover
    how to design graphical user interfaces and how to connect program code to the
    elements on the display. You''ll also learn how modern applications are structured.
    Part 4 doesn''t appear in this printed'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'book but is available as an ebook, free to download from this book''s webpage
    at https://aka.ms/BeginCodeCsharp/downloads.


    # How you will learn


    In each chapter, I will tell you a bit more about programming. I''ll show you
    how to do something, and then I''ll invite you to make something of your own by
    using what you''ve learned. You''ll never be more than a page or away from doing
    something or making something unique and personal. In each chapter we will use
    Snaps, prebuilt bits of functionality that I''ll show you how to use. After that,
    it''s up to you to make something amazing!


    You can read the book straight through if you like, but you''ll learn more if
    you slow down and work with the practical parts along the way. This book can''t
    really teach you to program, any more than a book on bicycles can teach you to
    ride a bike. You have to put in the time and practice how to do it. But this book
    will give you the knowledge and confidence to try your hand at programming, and
    it will also be to help you if your programming doesn''t turn out as expected.
    Here are the elements in the book that will help you really learn, by doing!


    ![](img/547210b145d9948b1613255cf1ee9fa4_18_0.png)


    # MAKE SOMETHING HAPPEN


    Yes, the best way to learn things is by doing, you''ll find “Make Something Happen”
    elements throughout the text. These elements offer ways for you to practice your
    programming skills. Each of them starts with an example and then introduces some
    steps you can try on your own. Everything you create will run on a Windows PC,
    tablet, or phone. You can even publish your creations to the whole wide world
    via the Windows Store.


    ![](img/547210b145d9948b1613255cf1ee9fa4_18_1.png)


    # CODE ANALYSIS


    A great way to learn how to program is by looking at code written by other people
    and working out what it does (sometimes why it doesn''t do what it should). In
    this book''s “Code Analysis” challenges, you''ll use your deductive skills to
    figure out the behavior of a program, fix bugs, and suggest improvements.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# WHAT COULD GO WRONG


    If you don''t already know that programs can fail, you will learn this hard lesson
    very soon after you start your first program. To help you deal with this I''ve
    included "What Could Go Wrong" elements, which anticipate problems you might have
    and provide solutions to those problems. For example, when I introduce something
    new, I''ll spend some time considering how it can fail and what you need to worry
    about when you use the new feature.


    # PROGRAMMER''S POINTS


    I''ve spent a lot of my time teaching programming. But I''ve also written many
    programs and sold a few to paying customers. I learned some things the hard way
    that I really wish I''d known at the start. The aim of Programmer''s Points is
    to give you information up front so that you can start taking a professional view
    of software development as you learn how to do it.


    > Programmer''s Points cover a wide range of issues, from programming to philosophy.
    I''d strongly advise you to read and absorb these points carefully—they can save
    you a lot of time in the future!


    # Prs and Snaps


    Nobody builds programs from scratch any more. All software is built using pieces
    of software that have already been built. If one program wants to display text,
    make a sound, or play some video, it simply asks another program to do it. Every
    popular computer language is underpinned by a huge library of existing code, and
    one of the things that a programmer needs to understand is how to use these libraries
    and software written by other people.


    I''ve created the Snaps library specially for this book. It provides a set of
    functional behaviors that are easy to use and fit together. You will use the Snaps
    library in your first programs. Later in the book you''ll discover other libraries
    of functionality that you can use to build programs.


    Programs that use Snaps run inside the Snaps engine, which is a self-contained
    environment in which programs can speak messages, get input from a user, draw
    images, make sounds, and even find out what the weather is like.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'I''ll provide examples of how the Snaps work and then leave it up to you to
    see what you can come up with. The principle we''ll follow is this: "If you can''t
    use programming to impress your friends and family, what''s the point of it? I
    really hope you''ll come up with some impressive programs of your own and maybe
    even publish them for other people to enjoy.


    # PROGRAMMER''S POINT


    # Everything is built on someone else''s code


    It seems fitting that the first Programmer''s Point is about "creatively lazy"
    a good programmer can be. They''ll never write a program if they can find a way
    to use one that has already been written. (Why reinvent the wheel?) The Snaps
    I''ve provided are an example of this. You''ll take a look inside some of them
    later in the book and discover that they themselves make use of other libraries.


    # Software and hardware


    You''ll need a computer and some software to work with the programs in the book.
    I''m afraid I can''t provide you with a computer, but in the first chapter you
    will find out where you''ll get Visual Studio 2015 Community Edition, the free
    software you''ll use to create your programs. You''ll also learn where to download
    the Snaps library and the demonstration code we''ll examine and use.


    The computer you use must run the 64-bit version of the Windows 10 operating system.
    Here are the other requirements:


    +   - A 1 Ghz or faster processor, preferably an Intel i5 or better.

    - At least 4 gigabytes (GB) of memory (RAM), but preferably 8 GB or more.

    - The full Visual Studio 2015 Community installation takes about 8 GB of hard
    disk space.


    There are no special requirements for the graphics display, although a higher
