- img_proc: true
  md: "```\nstruct CupCake\n{\n    public string Name;\n    public string Ingredients;\n\
    \    public string Recipe;\n\n    public CupCake(string Name, string Ingredients,\
    \ string Recipe)\n    {\n        Name = Name;\n        Ingredients = Ingredients;\n\
    \        Recipe = Recipe;\n    }\n}\n```\n\n**Question:** The constructor method\
    \ above is supposed to use the values of parameters to set the data members inside\
    \ the CupCake value that is being created. Unfortunately, this code is not correct\
    \ and won't compile correctly. What's wrong?\n\n**Answer:** The parameters to\
    \ the constructor have the same names as the data members inside the structure.\
    \ This is legal C#. Within the constructor, the identifier Name means the parameter,\
    \ not the property of cupcake. This is called *hiding* because Name has been hidden\
    \ by the parameter with the same name.\n\nThere is nothing to stop a programmer\
    \ from \"hiding\" a member variable in this way. However, in the above, the result\
    \ is that the data members of the structure are not assigned by the constructor,\
    \ which means the compiler will refuse to compile the code. We can fix this by\
    \ using the this keyword to specifically identify the data members inside the\
    \ object as the target of the assignment.\n\n```\nstruct CupCake\n{\n    public\
    \ string Name;\n    public string Ingredients;\n    public string Recipe;\n\n\
    \    public CupCake(string Name, string Ingredients, string Recipe)\n    {\n \
    \       this.Name = Name;\n        this.Ingredients = Ingredients;\n        this.Recipe\
    \ = Recipe;\n    }\n}\n```\n\nCh10_02_CupCakeStructureWithThis"
