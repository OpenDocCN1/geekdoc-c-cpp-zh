  md: 'Comments help make your program much easier to understand. You will be very
    surprised to find how quickly you can forget how you got your program to work.
    Be generous with your comments, but you should not add too much detail. Remember
    that the person who is reading your program can be expected to know the C# language
    and doesn''t need everything explained to them:


    ```

    goatCount = goatCount + 1; // add one to goatCount

    ```


    This comment is simply insulting to the reader, I reckon. If you choose sensible
    names, you should find that quite a lot of your program will express what it does
    directly from the code itself. From now on, the sample code that you will see
    have what I consider an appropriate level of comments.


    # Funfair rides and programs


    Now that you know how to make decisions in your programs, you can start to make
    more useful software. Let''s say that your next-door neighbor is the owner of
    a theme park and has a job for you. Some rides at the theme park are restricted
    to people by age, and he needs to install controls around his funfair so that
    people can find out which rides are allowed to go. He needs some software for
    the computers, and he''s offering a season pass to the park if you can come up
    with the goods, which is a very tempting proposition. He tells you the following
    information about the rides:


    | RIDE NAME | MINIMUM AGE INFORMATION |

    | Scenic River Cruise | None |

    | Carnival Carousel | At least 3 years old |

    | Jungle Adventure Water Splash | At least 6 years old |

    | Downhill Mountain Run | At least 12 years old |

    | The Regurgator (super roller coaster) | Must be at least 12 years old and less
    than 70 |


    You discuss with him the design of the program. What he''d like for users to select
    the ride they want from a menu. The program will ask for the user''s age and display
    a message indicating whether they can go on the ride.


    To create this program, we''ll use a Snaps function that displays just the kind
    of menu required. It''s a method named SelectFromButtons.'
