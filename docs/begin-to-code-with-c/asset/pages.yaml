  md: "The constructor for the FallingSprite will be supplied with the information\
    \ that is needed to create a FallingSprite, and it will use this information to\
    \ construct the MovingSprite object that is based on. The MovingSprite needs to\
    \ know the X and Y speeds of movement. The FallingSprite needs to know the ImageSprite\
    \ that is being moved. This information can be fed to the constructor for the\
    \ FallingSprite object.\n\nThe following version of the FallingSprite class allows\
    \ the program to compile correctly. It contains a constructor that calls the constructor\
    \ of the parent class.\n\n```\npublic class FallingSprite : MovingSprite {\n \
    \   public FallingSprite(ImageSprite sprite, double xSpeed: 0, ySpeed:0) {\n \
    \       base(sprite, xSpeed, ySpeed);\n    }\n}\n```\n\nC# calls the parent of\
    \ its base class. The C# language provides a keyword, base, that you can use to\
    \ gain access to the constructor of the parent class. This is how we make the\
    \ cake in our baking analogy. The contents of the FallingSprite class (which is\
    \ presently empty) are empty if the program contains anything.\n\n# CODE ANALYSIS\n\
    \n# The base keyword and construction\n\n**Question:** We've not used the base\
    \ keyword before now, so it's worth considering some questions about it. When\
    \ the program runs, what happens when it reaches the base keyword?\n\n**Answer:**\
    \ When the program reaches the base part, it runs the constructor in the parent\
    \ class. In this case, FallingSprite extends MovingSprite, the MovingSprite constructor\
    \ runs and sets up the MovingSprite contents.\n\n**Question:** What do the arguments\
    \ mean in the call base(sprite: sprite, xSpeed: 0, ySpeed:ySpeed)?\n\n**Answer:**\
    \ Here, the call of the base constructor method (the one that makes the MovingSprite\
    \ that FallingSprite is based on) is giving the incoming sprite and ySpeed values.\
    \ Because the parameters have the same name in both the base and the parent constructors,\
    \ it looks like they are being passed into themselves, but the values are actually\
    \ being passed into the parent.\n\n424 Chapter 14 Games and object hierarchies"
