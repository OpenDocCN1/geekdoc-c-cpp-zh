  md: '# Games and objects


    The graphical elements for Space Rockets are a good start. The game has an object
    the player can control (the rocket) and attacking aliens. But to develop a complete
    game, we need to let players shoot alien, lives, and score points.


    We''ve already created a set of objects that represent the game sprites on the
    screen, as shown in Figure-15-1. Now we need to make these objects work together
    to create a complete game experience. We first need to add some consequences for
    when aliens catch up to the rocket. In our game, each time the rocket is hit by
    an alien, the rocket must lose one life. When the rocket has lost all its lives,
    the game is over. To do this, the first step is to discover how the alien and
    the rocket can be made to interact.


    ![](img/547210b145d9948b1613255cf1ee9fa4_472_0.png)


    **Figure 15-1** Space Rockets in Space.


    # Creating cooperating objects


    In the terms of video games, the rocket must "take damage" when it''s hit by an
    alien. From a programming point of view, you can think of this as an alien sprite
    sending a message to the rocket saying, "just i hit you." The rocket can then
    decide what effect this has.


    When I was learning to program, I was very confused by what it meant for one object
    to send a message to another. But it actually turns out to be very simple.


    +   - RocketSprite class will contain a method named TakeDamage.'
