  md: '# PROGRAMMER''S POINT


    It is useful to be able to “read” program code


    Over the years I''ve looked at a great many. Some programs were written by I wrote,
    and some were written by other people. Some programs were written by programming
    language that I know, while others were written in a language I''d never seen
    before.


    I''ve learned not to be distracted by the bits of the program I don''t understand
    yet to focus on the parts that make sense to me. You might not know what the public
    class of the program means, but the string inputText = SnapEngine.ReadString(“Enter
    something please”); should kind of make sense and leave you thinking what might
    be the program gets a string of text.


    Americans use the term “spelunking” to describe the hobby of exploring underground
    caves. The term is also used to describe the “hobby” of unfamiliar program code.
    You should try to get good at spelunking the programs in this book. You can start
    by looking for landmarks that you know and then work from those, refining your
    understanding of the program''s behaviors. For example, you know that somewhere
    in the program it performs an action for each character in the string. Knowing
    that, you should be able to work out where in the code this action happens.


    # What you have learned


    In this chapter you''ve learned a bit about how computers actually work and what
    programming is. You have discovered that a computer views the entire universe
    as patterns of ons and offs (1s and 0s), which represent the data the computer
    is working. The computers perform data processing by transforming one pattern
    of bits—into another pattern of bits—the output.


    When human beings take a look at the data output and act on it, the data becomes
    information. Computers are unaware of the meaning that we place on the patterns
    of bits that they process, which means that a computer will do things with data
    that make no sense.


    A program tells the computer what to do with the pattern of bits. The computer
    understands only very simple instructions, but programs compilers can take in
    a higher-level description of the actions that are required and produce the simple
    instructions for the computer to perform.'
