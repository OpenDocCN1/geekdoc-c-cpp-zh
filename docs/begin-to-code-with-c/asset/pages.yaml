  md: '# Interfaces


    **Question:** What do we mean by a list of interfaces?


    **Answer:** The sprites list, which contains references to all the sprites in
    our program, is now a list of ISprite interfaces. This looks a bit confusing because
    an interface is not a "thing", it is a collection of behaviors. However, this
    is exactly what we want. It is a bit like assembling a bunch of people who are
    all firefighters. We may have teachers, writers, artists, and beautians turning
    up, but as they implement the "fire-fighter" interface (which is, basically, turn
    up, save people, and put out the fire) we don''t care what they actually are.
    Remember, an interface provides a way of referring to an object based on what
    it can do, not what it actually is.


    **Question:** What if we try to make an interface refer to an object that doesn''t
    implement the interface?


    **Answer:** To go back to the firefighter example, you are asking what would happen
    if we asked someone not an interface to put out the fire. The answer is that the
    C# compiler keeps track of which classes implement interfaces, and it checks to
    make sure that when you try to use an interface reference that the thing the reference
    refers to actually has the required behaviors.


    **Question:** Can a class implement multiple interfaces?


    **Answer:** Yes it can. Just like a beautician can be a firefighter and also a
    juggler. Each interface that an object implements provides a different "view"
    of that object.


    **Question:** Why does the interface name begin with the letter i?


    **Answer:** It is a convention in C# programs that the name of an interface always
    starts with /. This is so that a programmer can easily tell an interface from
    a class. An interface is quite different from a class. An interface doesn''t actually
    tell the computer how to do something, instead, it gives a list of things class
    must do.


