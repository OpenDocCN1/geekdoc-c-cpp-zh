- img_proc: true
  md: "The Play method is part of the SongNote structure. In the same way that we\
    \ can access data members of a structure, a program can also call methods that\
    \ the structure contains:\n\n```\nforeach (SongNote note in tune) {\n  note.Play();\n\
    }\n```\n\nThis version of the song playback loop asks each note to play it by\
    \ calling the Play method inside the SongNote structure. This means that other\
    \ programmers can use the SongNote structure to play tunes without knowing the\
    \ note works. This is an extremely powerful feature.\n\n# PROGRAMMER'S POINT\n\
    \nSelf-contained objects are a good thing\n\nA coder using the SongNote structure\
    \ will know he has to specify a NotePitch and a NoteDuration to create a note,\
    \ but will not know how to use the PlayNote method in the Snaps framework to play\
    \ it. This is because the SongNote structure provides a Play method that takes\
    \ care of how the music is played. It is a bit like driving a car with an automatic\
    \ transmission to pedal the car to go faster. In the manual car, you have to know\
    \ how to select gears, when to shift gears, and so on. When designing the elements\
    \ that are going to make up a complex system, try to make each element self-contained\
    \ and as easy to use as possible.\n\n# Protecting values held in a structure\n\
    \nAs you've seen, the SongNote structure's values are public so that our program\
    \ can store data in the note. The public in front of the declarations of the NotePitch\
    \ and NoteDuration members mean that these members are visible to programs that\
    \ use the SongNote structure:"
