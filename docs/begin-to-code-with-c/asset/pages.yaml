- img_proc: true
  md: "```\n}\npublic void AddMinutes(int timeValue)\n{\n    contactMinutesSpent =\
    \ contactMinutesSpent + timeValue;\n}\n```\n\nNow all users of the Contact class\
    \ can add this. Our lawyer customer will like this feature a lot because it means\
    \ there is no way that a badly behaved customer can lose minutes that she has\
    \ spent with a contact.\n\nThis statement adds 30 minutes to the time spent with\
    \ Rob. This approach could be the basis of a more secure solution—the only way\
    \ to change the number of minutes spent is to call the method that adds it to:\n\
    \n```\nrob.AddMinutes(30);\n```\n\nUsing methods like this is a very popular programming\
    \ pattern. The data in the object (the values we really care about) is held in\
    \ members that's private. This means that the data items are not directly accessible\
    \ to code that's not running inside the object. However, the methods that control\
    \ access to the data are made public so that they can be used to change the data\
    \ and read the value back. Programmers love control, and this design pattern gives\
    \ them control when changes are being made to variables in the program.\n\n# Feeding\
    \ invalid values into a method\n\nThe `AddMinutes` method is a good start at managing\
    \ access to the minutes value, but it is not quite perfect.\n\n**Question:** What\
    \ would be the effect of the following statement?\n\n```\nrob.AddMinutes(-30);\n\
    ```\n\n**Answer:** This would add the value -30 to the minutes spent for rob,\
    \ which would reduce the minutes value by 30 (which might save rob some money)."
