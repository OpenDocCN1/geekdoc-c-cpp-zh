  md: '# # Building a place to work


    If you were a truck driver who spends many hours in the cab hauling goods across
    the country, you''d want a truck with a comfortable seat, a good view of the road,
    and controls that were light to use. It would also help if your truck had enough
    power to climb hills at a reasonable speed and was easy to handle on twisty mountainside
    roads.


    In the same way, I expect to spend any amount of time at a keyboard writing programs,
    you should have a decent place to work. If you can, find somewhere to set up a
    computer, a keyboard, and a screen then pull up a chair that you don''t mind spending
    a few hours sitting in.


    You don''t need a particularly fancy computer to write programs, but your machine
    will need a reasonable amount of memory and processor performance to handle the
    tools we''re going to use. I suggest that you find a Windows 10 device with an
    Intel i5 or equivalent processor, 4 gigabytes of memory, and 256 gigabytes of
    harddisk space. You can use smaller computers than this, but they can make the
    development process somewhat frustrating because they will take a while to update
    the program after you make any changes to it.


    One thing that is very important is that you **must have a computer that is running
    the 64-bit version of Windows 10**. Very small devices run a 32-bit version of
    Windows 10. This works for most applications, but it cannot be used to build Windows
    10 applications with Visual Studio, the tool we will be using.


    # # Getting the tools and demos


    All the tools we''re going to use are free to download and install. I find it
    astonishing and wonderful that such powerful software is available for everyone
    to use. The Visual Studio program makes it very easy to create applications and
    games. It even helps you make your programs for sale in the Windows Store.


    I strongly advise anyone starting to program that they take at least one of their
    programs to market. It''s lovely to think that software you have made is available
    in the Store to everyone.


    However, before you start sharing or selling your programming wares, you have
    to download and install the tools that will make this possible. Installation will
    take a little while, depending on how fast your network connection is. There will
    be a few occasions when you''ll just have to sit and wait until things are fetched
    from the Internet. While Visual Studio is downloading and installing, you''ll
    probably have enough time to tidy up and do a little housekeeping. One note, though:'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'it’s important to perform the actions in the order I give you. The good news
    is that you have to do it this installation only once for each computer that you
    want to use.


    The steps you follow to install Visual Studio change from time to time, and they
    might vary depending on whether you have a Microsoft account or other factors.
    Instead of including the detailed steps here, I’ve provided that information online
    (so I can update it whenever necessary).


    If you haven''t already downloaded the sample code and the other online content
    described in the "Downloads" section in this book’s introduction, go to the following
    website and download the files now:


    https://aka.ms/BeginCodeCSharp/downloads


    Open the file named GettingStarting.pdf, and follow the instructions it provides
    to install Visual Studio Community 2015 and extract and select the sample code
    and applications.


    Once you’ve finished the installation, just to make sure you’re ready to start,
    use File Explorer to open the folder with the code. You should see the files and
    begin with **1-1**. You’re now ready to open Visual Studio and begin with C#,
    which we’ll do in the next section!


    ![](img/547210b145d9948b1613255cf1ee9fa4_29_0.png)


    **Figure 1-1** The contents of the BeginToDoWithCSharp folder. You’ll start from
    here in just a moment.


    # Using the tools


    You’ve reached a significant point in the process of learning how to program.
    You’re about to open Visual Studio and start working with this book’s demo code.
    This is a bit like opening the front door of a new apartment or house or getting
    in a shiny new car you’ve bought.'
