    We don''t want to place the ball over the edge of the screen, so the range of
    possible positions is actually the width of the screen. We have the available
    width, we can calculate a random value by multiplying this by a random number
    between 0 and 1, which is what the NextDouble method provides. This gives us a
    starting position for the ball.


    There are lots of other places you could add some randomness. You could make the
    paddle start in a different position for each game, or you could add some randomness
    to the speeds of the paddle and the ball.


    # MAKE SOMETHING HAPPEN


    # Make a “mash up” of Keep Up!


    You can use the Keep Up! game as the starting point of a game of your own. The
    first step could be to change the images that the game uses and perhaps add a
    background picture. You could change the way that the ball and player interact
    so that the player can hit the ball in one direction or another depending on which
    part of the paddle hits. You could add a second ball that the paddle must avoid
    or lose the game if they touch. It could appear once the player has achieved a
    particular score. You could make the ball shrink as the game progresses, or it
    grow larger and have the player a life if the paddle hits the edge of the screen.
    You can change the speed of the paddle and the ball so that the paddle moves more
    slowly as the game progresses. You can take a look inside the Keep Up! code and
    find the secret of creating an impressive score (like the one in Figure 13-5).
    There are lots of things you can do to make the games yours.


