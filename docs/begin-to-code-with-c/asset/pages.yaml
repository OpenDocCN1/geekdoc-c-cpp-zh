  md: "# Making decisions with the switch construction\n\nOur drawing program could\
    \ use a sequence of if conditions to select the required drawing behavior, but\
    \ it turns out that C# has a much better way of using enumerated types when making\
    \ decisions. The enumerated value can be used in a switch condition:\n\n```\n\
