  md: "problem creating methods in the Contact class that are public and provide access\
    \ to the MinutesSpent value.\n\nThe following version of the Contact class contains\
    \ two methods, called Get-MinutesSpent and one called SetMinutesSpent. They manage\
    \ access to the data.\n\n```\nclass Contact {\n    public string ContactName;\n\
    \    public string ContactAddress;\n    public string ContactPhone;\n\n    private\
    \ int contactMinutesSpent;\n\n    public int GetMinutesSpent() // Method to get\
    \ the value.\n    {\n        return this.contactMinutesSpent;\n    }\n\n    public\
    \ void SetMinutesSpent(int newMinutesSpent) // Method to set the value.\n    {\n\
    \        this.contactMinutesSpent = newMinutesSpent;\n    }\n}\n```\n\nThe next\
    \ group of statements shows how the methods can be used. The program sequence\
    \ gets the number of minutes that Rob has spent with the lawyer, adds 10 to that\
    \ value, and stores the result back in the object. At no time is code outside\
    \ the Contact object able to interact directly with the contactMinutesSpent variable,\
    \ but it can call the public methods in the object that provides the access.\n\
    \n```\nContact moresecure = new Contact(\"Rob\", \"Rob's House\", \"Rob's Phone\"\
    ); // Get the value.\nint robsMinutes = moresecure.GetMinutesSpent(); // Add 10\
    \ minutes to the value\nrobsMinutes = robsMinutes + 10; // Set the value.\nmoresecure.SetMinutesSpent(robsMinutes);\n\
    ```\n\nAs it's written so far, however, the SetMinutesSpent method does not stop\
    \ a program from setting an invalid ContactMinutesSpent value. It simply copies\
    \ the value supplied as a parameter into the Contact object. However, we can change\
    \ the method so that it performs some validation:"
  merge: -1
  pgno: 366
- img_proc: true
  md: "```\npublic void SetMinutesSpent(int newMinutesSpent)\n{\n    if(newMinutesSpent\
    \ > 0)\n        // Only set a value that is greater than 0\n        this.contactMinutesSpent\
    \ = newMinutesSpent;\n}\n```\n\nThis version of SetMinutesSpent method ensures\
    \ that a Contact never contains a value of minutesSpent that is less than 0. If\
    \ a program tries to set a value that's less than 0, the new value will be ignored.\n\
    \n![](img/547210b145d9948b1613255cf1ee9fa4_367_0.png)\n\n# CODE ANALYSIS\n\n#\
    \ What happens if you leave off public and private?\n\nQuestion: A programmer\
    \ is forced to mark a member of a class as public or private. What happens if\
    \ you leave them out?\n\nAnswer: In C#, the default protection of class members\
    \ (that is, the protection that you get if you don't specify what you want) is\
    \ private.\n\n# Providing methods that reflect the use of an object\n\nProviding\
    \ set and set methods allows a programmer to control the changes that can be made\
    \ to the elements in an object. For the Time Tracker application, it is probably\
    \ more sensible to create a method that allows a program to add minutes to a contact\
    \ than it is to provide a set behavior that can be used to put a new value into\
    \ the minutes-spent value.\n\n```\npublic class Contact\n{\n    private int contactMinutesSpent;\n\
    \n    public int GetMinutesSpent()\n    {\n        return contactMinutesSpent;\n\
    \    }\n```\n\n* Creating objects with integrity 343"
