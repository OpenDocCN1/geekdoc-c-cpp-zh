- img_proc: true
  md: 'contain methods that allow a structure object to behave in a cohesive manner.
    For example, a musical structure can contain a method that can be used to make
    the note play itself. We''ve also taken a look at what graphical displays and
    user interfaces are created by computer programs in terms of how graphical objects
    are displayed on the screen and how a program can be made to respond to a user''s
    actions.


    You have discovered how to make new types—enumerated types—that have a limited
    number of particular values. You can use these in your programs to reduce program
    errors because you are ensuring the variable of an enumerated type cannot be a
    meaningless value. Finally, you''ve seen how to use the C# switch construction
    to select a particular option from a given range, and you''ve learned that switches
    work extremely well with enumerated types.


    Here are some questions to ponder about the topics in this chapter:


    # Does using structures in programs slow the program?


    We considered a similar question when looking at methods in Chapter 8. Structures
    are similar to methods in that they make it much easier to manage large programs
    with complex items of data. There is processor overhead in working structures,
    but I think this is better than all the effort to write a program without structured
    data.


    # When should I use private in a structure?


    Structures (and indeed objects) work best if they have total control over the
    data that is stored within them. When you write programs, you should be concerned
    about situations where your program starts to work with invalid data. We know
    that a program that contains invalid information will sound wrong when it tries
    to play those notes, so we make the data inside the notes private so that the
    data cannot be changed by program code outside the note. You can also create a
    constructor method that will not allow a note (or other data) to be created that
    contains invalid information. This means that a given note value is guaranteed
    to have integrity, and that there is no system that can create an invalid or corrupt
    an existing one.


    # Can structures contain other structures?


    Indeed they can. This can be the basis of very good design. A graphics application
    might have a need for a "dot" structure that contains the coordinate where the
    dot is to be drawn and the color of the dot. We could use values of color and
    coordinates inside the dot structure. This would make our program easier to write
    and also, because we would be using objects that had already been created and
    (we hope) ) tested, make the program more reliable.'
  merge: -1
