  md: '# # About the author


    ![](img/547210b145d9948b1613255cf1ee9fa4_510_0.png)


    **Rob Miles** has spent more than 30 years programming at the University of Hull
    in the United Kingdom. He’s a Microsoft MVP, with a passion for programming, C#,
    and creating new things. If he had any spare time, he''d spend it writing even
    more code. He loves making programs and then running them to see what happens.
    He reckons that programming is the most creative thing you can learn how to do.
    He also reckons that in a battle between us and the Martians, we''d win, because
    we''ve got Visual Studio and they don''t—and there isn''t anything better in the
    universe for building software.


    He claims to know a lot of really good jokes, but nobody has ever heard him tell
    one. If you want an insight into the Wacky World™ of Rob Miles, you can read his
    blog at www.robmiles.com and follow him on Twitter via @RobMiles.


