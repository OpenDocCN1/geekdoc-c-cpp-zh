  md: '# Reading in contact details


    NewContact method must get the contact''s details from the user, but it also needs
    to store these details for when the user searches for the contact later. The Snaps
    method ReadString can be used to read a single line of text, and a single line
    is for the name and phone number of the contact. For the address, however, we
    need to read multiple lines


    Fortunately, the Snaps library can ReadMultiReadLine method, which will read a
    string that contains more than one line. **Figure 0-3** earlier shows the display
    earlier when the method was called.


    ```

    string address = SnapsEngine.ReadMultiLine("Enter contact address");

    ```


    A user can press the Enter key to mark the end of each line of text as you type
    in an address. ReadMultiReadLine method returns a string that contains characters
    that mark the end of each line. To understand how this works, you have to learn
    a little more about how strings work in the C# program.


    # Strings and characters


    C# provides string to hold text. The C# language also provides a type named char,
    which can hold a single character.


    ```

    char ch = ''R'';

    ```


    The previous statement would create a character called ch, which contains the
    letter R. The compiler can tell that the value ''R'' is a character and not a
    string through the use of single quote quotation ('''') to identify the start
    and end of the value.


    You can think of a string as containing a collection of char values. The "Rob
    Miles" contains nine characters. Note that the space between "Rob" and "Miles"
    is also a character, even though nothing appears on the screen when it is displayed.


    Many of the characters can be held in a char for example letters, numbers, and
    punctuation—but some control characters, which are not visible but control the
    behavior of display. Individual lines of an address ReadMultiReadLine are separated
    from each other by two control characters. The first is a carriage return, which
    moves the display position back to the start of the line. The second control character
    is a line feed, which moves the display position down one line.'
