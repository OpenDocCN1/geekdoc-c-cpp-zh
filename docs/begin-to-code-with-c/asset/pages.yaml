    # The DateTime structure


    Lots of programs need to work with dates and times, so the designers of C# created
    a structure that can represent a particular day and time. month, year, hour, minute,
    and second properties that a program can use.


    ![](img/547210b145d9948b1613255cf1ee9fa4_383_0.png)


    # Structures vs. classes: Repeat


    Question: It''s important for you to understand the difference between a structure
    and a class and when each should be used. Why is the DateTime object a structure
    and not a class?


    Answer: A DateTime object always be manipulated in terms of its value, not as
    an object that is managed in references. A given DateTime value describes a unique
    point in time and will often be a property of another object—for example, the
    date and time of appointment or the date and when a photograph was taken. We don''t
    want these values to be managed by reference; they should be part of the object
    they are helping to describe. The designers of C# made DateTime structure to reflect
    this. When you make your own objects, you don''t need to think about this too.
    Don''t make everything a class. Think about how the values are going to be used.


    The DateTime structure lives in the System namespace. Whenever you want to use
    the structure, you can use the fully qualified name (System.DateTime), but it
    is simpler to include a using statement to tell the C# compiler that you want
    to use the System namespace:


