  md: '# From arrays to lists


    Arrays are great for storing a particular number of items. They are less useful
    when you don''t know how many items you want to store at the time the program
    is being built. For example, if you used an array to store the names of guests
    arriving at a party, you''d have to make the array really big. This statement
    creates an array that can store 100 strings:


    ```

    string [] guestNames = new string[100];

    ```


    This will work, right up to the point that guest number 100 arrives, at which
    point the array will run out of space and the program will fail. You could address
    this by making the upper limit really, really big:


    ```

    string [] guestNames = new string[100000];

    ```


    Now we have space for 100,000 guests. However, we might also waste memory by doing
    this, particularly if we have a lot of arrays in the program. What we would really
    like is an "elastic" array that can grow automatically.


    The designers of C# wanted one of these, too, so they created a class named List
    that will look after lists. A list is a collection of references to objects of
    a particular-type, and it can grow as required. List is one of many of helper
    classes that are provided to help manage collections of


    The full name of the List is System.Collections.Generic.List. This name is called
    a fully qualified name and provides a unique name for this particular class. Fully
    qualified names are useful they prevent confusion. If another programmer creates
    a class List (which is actually quite likely), that class cannot be confused with
    the one that is part of the system the class will have a different fully qualified
    name.


    We use a similar mechanism when we store files on our computer.


    ```

    c:\2015\jan\sales.txt

    c:\2015\Feb\sales.txt

    ```


    These files are both called sales.txt, but this does not cause a problem for the
    file system because they are stored in different folders. When we organize files,
    we use the complete path to specify a particular file. The C# language uses something
    similar'
  merge: -1
