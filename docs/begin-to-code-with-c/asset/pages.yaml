  md: 'Please don''t confuse testing with "that thing I''ve done to see whether the
    program looks like it works." In the case of the number-doubling machine in Mystery
    Program, I could put a few numbers in and see whether it generated results that
    look okay, but that''s not testing. That''s just seeing whether the program looks
    like it works.


    If I was serious about testing a program like this, I''d create a set of specific
    tests. I''d make the tests include very large and small numbers, as well as negative
    values and the value 0, and I formalize the tests so that they''ve been performed
    successfully the program is "signed off" as tested. If I were really clever, I''d
    create a program that did the testing for me. This program could find in many
    millions of values and check that each output is correct. Of course, if my tests
    never fed in the "pirate value" of 40, the program would be passed as tested but
    still have the potential to fail when it''s used. But as I said, tests prove only
    the existence of facts, not that aren''t any.


    The good news is that a combination of black-box and white-box testing can produce
    programs that are reliable enough. But please remember that proper tests are planned,
    managed, and documented and not just "this thing I did to see whether it works."


