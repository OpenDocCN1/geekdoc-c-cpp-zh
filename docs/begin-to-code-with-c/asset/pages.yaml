    # # Designing a class hierarchy


    Adding classes like LineAtien to our game is the basis of object-oriented design.
    We can reuse and customize existing program elements as the program develops.
    However, it is probably best to have a design before you start building your classes.
    **Figure 14-4** shows the design for the game we''ve been building.'
