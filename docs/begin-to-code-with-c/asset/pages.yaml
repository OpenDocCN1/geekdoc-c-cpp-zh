  md: '# Have an ice cream


    Your fame as a programmer is beginning to spread far and wide. Now the owner of
    a group of ice-cream stands comes to you and asks that you write a program to
    help her track sales. She has 10 ice-cream stands around the city, and each day
    they sell a different number of ice-cream treats. What she wants is quite simple—she
    wants to enter the values from each stand and then view the data in different
    ways: sorted from lowest to highest, sorted from highest to the lowest, the highest
    and the lowest numbers, the total number of sales, and the average sales value.
    She can use this information to help plan the location of her stands and reward
    the best sellers. If you get this right, you might be getting some free ice cream,
    so you agree to it.


    # PROGRAMMER’S POINT


    # Getting the specification right: Storyboarding


    It''s important to agree on a specification with customers. There are lots of
    ways that you can develop a specification. Find the best way is to sit down with
    your user and a large pad of paper as far away from the computer as you can—and
    draw up a "storyboard Storyboards are used in moviemaking to show everyone how
    the film will tell the story. Programs can have storyboards, too.


    Whereas a movie storyboard describes one sequence—the narrative of the film—the
    storyboard for a computer program has branches that show how the user follows
    paths through the application. For example: When the ice-cream sales program starts,
    it asks for 10 values, one after the other. It then moves to the menu screen.
    The menu has options to view data (lowest to highest, highest to lowest, and so
    on) and option to return to a new set of numbers. If the user selects High to
    Low, the program will show the sales numbers with the highest value first and
    provide a button the user can use to return to the menu. You list and describe
    all the other operations in this way as well.


    In a storyboard, you can also draw how the screens are supposed to look and agree
    with the customer what users must do from one screen to the next. You could even
    decide what color to use. Remember that one of the worst things is for the user
    to say, "I''m not that bothered about how it should work. I''ll leave that to
    you. I''m sure it will be fine." No won''t. Designing a program must be done by
    working with the customer. That way, you can ensure you are delivering exactly
    what is required. What''s more, doing the design like this means that when you
    start writing the program, you''ll know exactly what you need to do, the storyboard
    will tell you what happens first. And if there is anything the customer hasn''t
    thought of, will will likely be spotted as you build the storyboard. Building
    an understanding of how programs fit together can be a big help when you get to
    the point of creating them.


