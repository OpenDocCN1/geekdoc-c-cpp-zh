    \ ANALYSIS\n\n# Infinite loops\n\nAn infinite loop can be a bad thing for a program\
    \ to perform because it means that the program will never stop. However, we have\
    \ one in our program now, which probably deserves some discussion.\n\nQuestion:\
    \ When is an infinite loop a good thing?\n\n**Answer:** An infinite loop that\
    \ runs forever and doesn't have any way of exiting it. But for a game, this continuous\
    \ update process is actually what you want. When you are playing the game, you\
    \ want the display to be continuously updated. However, you don't need to worry\
    \ that this loop will run quickly and tie up the computer unnecessarily. The DrawGamePage\
