  md: "# Make some noise\n\nYou might go back at this point and add sound effects\
    \ to the programs that you have written. The egg-timer program would benefit from\
    \ an alarm sound, for example. If you can find some suitably eerie background\
    \ sounds, you could add these to the fortune-teller program.\n\n# Displaying image\
    \ content\n\nYou can also display images in your programs. You can display images\
    \ from the Internet and using files that are built into the application. The Snaps\
    \ library provides a method that will fetch and display images from either location.\
    \ Here is the form of the method that displays an image that is stored with an\
    \ application:\n\n```\nusing SnapsLibrary;\nclass Ch05_17_CityImage {\n    public\
    \ void StartProgram() {\n        string url = \"ms-app://Images/City.jpg\";\n\
    \        SnapsEngine.DisplayImageFromUrl(url);\n    }\n} Ch05_17_CityImage\n```\n\
    \n![](img/547210b145d9948b1613255cf1ee9fa4_153_0.png)\n\nI've called the string\
    \ variable that holds the name of the image url (short for resource locator).\
    \ You may have heard the term URL in context of webpages. For example, my world\
    \ famous (in my world) blog has URL http://www.miles.com. The first part of the\
    \ URL (the part before the // character sequence) is the scheme and describes\
    \ how to access it. The scheme \"ms-app\" means \"look in the content for this\
    \ asset.\\ The second part of the URL is the actual address of the resource, which\
    \ in this case is \"Images/City.jpg\". If you use Solution Explorer to look in\
    \ the Images folder, you will find that the folder contains a file named City.jpg.\
    \ If you want to add your own images to your applications, you can store them\
    \ in this folder and then display them using the DisplayImageFromUrl method."
