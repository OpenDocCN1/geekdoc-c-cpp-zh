  md: '# Make some games of your


    Now that you know how easy it is to add new game objects to a game, you can add
    sprites with different behaviors very easily. You could make a sprite that chases
    the player only when the player is close to the sprite or one that wakes up and
    starts chasing the player when they get too near. You can make sprites that change
    size during the game so that they slowly take over the screen and become more
    difficult to dodge as time goes. You could create a cowardly sprite that runs
    away from the player. (In this case, you might change the way the game works so
    that the aim of the game is for the player to catch things rather than avoid them.)
    You could make chasing sprites that bounce off the sides of the viewport or ones
    that "teleport" from one side to another. You can add randomness to the sprites
    to make them chase players only sometimes. There are lots of different kinds of
    behaviors to investigate.


    # What you have learned


    In this chapter you''ve learned how to create objects that underpin all the elements
    in a game. You have done this by creating a parent object that contains fundamental
    elements that all the game objects need and then child objects that extend this
    parent and provide more specific, less abstract behaviors. You have seen that
    by doing this, you can reduce the amount of code that you have to write to create
    a new type of game object—you can just focus on the difference between the parent
    and the child.


    You discovered that in this kind of class hierarchy, the child objects that extend
    the parent objects are actually based on a parent instance and that the parent
    instance must be created during the construction of the child class. You have
    also seen that a method that has been virtual in the parent can be overridden
    in the child class. The child can provide a version of the method that behaves
    in a way more specific to the role of the child. If it is useful, the child class
    can also make use of the method in the parent class by using the base keyword.


    In our game, we use the MovingSprite type as the parent class for all the sprites
    in the game that move. Underneath this parent are FallingSprite, RocketSprite,
    and a number of other types of moving sprites. The game, which contains all the
    game objects, manipulates the sprites as though they are all MovingSprites and
    is unaware of the customized behaviors of each. The status of a sprite is updated
    when the game calls the Update method on that sprite. Update is a virtual method
    that is overridden in the child class to provide behavior that is relevant to
    that sprite type. This gives'
