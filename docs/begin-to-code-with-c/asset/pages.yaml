  md: '# Class names and file names


    C# solution can be spread over a large number of separate program files. It is
    worth some thought to how this works.


    **Question**: Why do we have to change the name of the class when we have already
    changed the name of the file?


    **Answer**: To answer this question, you have to understand the difference between
    logical and physical names in a program. You can think of the names of the files
    that hold our programs as physical names because a file name is connected to an
    actual file that is stored on the computer. However, the names of the elements
    in a "logical" namespace are not tied to the physical file that holds the program''s
    text. They exist in a "logical" namespace that is defined by the programmer.


    When the C# compiler is compiling a program, it reads all the source files and
    builds up a list of all the items that are defined in the program. This is the
    logical namespace of the program. Each of the items in this logical namespace
    must have a unique name. If we create two items with the same name, the compiler
    will complain, and that is what happened when we copied the MyProgram.cs file.
    after copy, there were two classes with the name MyProgram. We fixed the problem
    by changing the name of one of the items to a new, unique name.


    **Question**: Does the name of a program''s source (the file name) and the name
    of a class (the logical name) in that source file have to match?


    **Answer**: No. It is not convenient to make the two names match because it can
    make it easier to find particular items, but the C# compiler does not enforce
    this.


    **Question**: What would have happened if the program already contained a class
    named Countdown and we added another one?


    **Answer**: You can probably guess what would happen. The compiler would complain
    because it doesn''t like having two items with the same name.


    By the ways, you prepared the CountdownAppWithCSharp application to run immediately
    when you clicked the run button? Whenever the BeginToCodeWithCSharp is run, Snap
    looks for a class named MyProgram and then calls the StartProgram method in that.
    This means that when you start the BeginToCodeWithCSharp application, it will
    run the original program: My-program.cs. You then use the Folder and Snaps apps
    to select other apps you want to run.


    You can follow this copy, paste, and revise each time you want to make a new application
    and add it to our Snaps environment. Or, now that you know-'
  merge: -1
