  md: "# Storing a contact in local storage\n\nWe need to store the address and phone\
    \ number for each contact listed in the contact app, and each stored item needs\
    \ a name to identify it. The program can use the name of the contact being stored\
    \ as an item name. The following statement shows how this works:\n\n```\nSnapsEngine.SaveToStringLocalStorage(itemName:\
    \ name + \"address\", itemValue: address);\n```\n\nRemember the name and address\
    \ of the contact have been entered by the user of the program, and this statement\
    \ is using the name of the contact to create the name of the stored item. If the\
    \ name entered is \"Rob\", then the address will be stored in the location called\
    \ \"Rob:address\".\n\nHere is the method that I created to save a contact. It's\
    \ given the name, address, and phone information to be stored. Note that the program\
    \ doesn't need to store the name of the contact; the user will enter the name\
    \ when they want to find the contact details. The name will be used to create\
    \ the item name that the system must find.\n\n```\nvoid StoreContact(string name,\
    \ string address, string phone) {\n    name = name.ToLower();\n    SnapsEngine.SaveToStringLocalStorage(itemName:\
    \ name + \"address\", itemValue: address);\n    SnapsEngine.SaveToStringLocalStorage(itemName:\
    \ name + \"phone\", itemValue: phone);\n}\n```\n\n# Loading contact details from\
    \ local storage\n\nWhen the user enters the name of the contact, the program can\
    \ construct the item to search for using that name. The following statement builds\
    \ up an item name to look for by adding \"address\" to the end of the name of\
