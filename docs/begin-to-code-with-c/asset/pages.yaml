  md: '# Adding sprite image to a game


    You can add an image to a Snaps application by dragging it from where it is stored
    on your PC to the Images folder in Visual Studio. This makes a copy of the image
    in the game. We did this in Chapter 3, when we added images to be displayed by
    using the Snaps method named DisplayImageFrom. **Figure 12-1** shows how Visual
    Studio lets you manage the image (ball.png) in the Images folder for the sample
    code for this book.


    ![](img/547210b145d9948b1613255cf1ee9fa4_403_0.png)


    **Figure 12-1** The ball image in the Images folder.


    If you hover your mouse over one of the images in the Images folder, Visual Studio
    will show you a thumbnail preview of the image in that file. I''ll be using this
    ball in my examples, but you can add images of your own to the games. This makes
    it a lot interesting and personal.


    > MAKE SOMETHING HAPPEN


    # Make a game image of your own


    You can add an image of your own to the game by dragging it into the Images folder
    of your Snaps Visual Studio project. The image can be a JPEG, GIF, or PNG image.
    I prefer to use PNG files because these files support transparency—in other words,
    part of a PNG image can be made to show another image behind them. You will see
    this when we start to use the ball in our games. The image of the ball is a rectangular
    picture, but only the round part of the ball obscures the image underneath.'
