  md: 'perform all the moving around of data each time we sort the contacts by name
    or by the minutes spent.


    In the case of the time-tracking program, this is not a huge problem because the
    contact structures are quite small and there are not very many of them to be sorted.
    But if we were working with large data items, perhaps medical records or bank
    accounts, this swapping process would be very slow, which would be a problem.
    Each time we wanted to reorder data—for example, on customer name rather than
    the amount of money in each account—the computer would have a lot of work to do.


    # Sorting and references


    What we want is a more efficient way of moving variable around in memory. To understand
    this problem, consider how money used to be managed on the Pacific Island of Yap.
    The currency on this island was once based on stones that were 12 feet high and
    weighed several hundred pounds each. The value of a "coin" in the Yap currency
    was directly related to the number of men who died in the arduous boat journey
    bringing the rock to the island. The bigger and harder a rock was to move, the
    more it was worth.


    When you paid someone with one of these stones, you didn''t actually pick it up
    and give it to them because the stone was too heavy. You said to them, "The stone
    by the road on top of the hill is now yours." In other words, the people on Yap
    used references to manage objects that they didn''t want to have to move. We can
    also use references in our programs.


    **Figure 10-6** shows what happens when the Bubble Sort algorithm swaps adjacent
    elements in an array until they are all in the right order. Remember that the
    program has to move a lot of data around during the sorting as the values "bubble"
    into their correct positions. When the sort has completed, the elements have been
    moved into order.


    ![](img/547210b145d9948b1613255cf1ee9fa4_331_0.png)


    **Figure 10-6** Sorting by moving objects structures'
