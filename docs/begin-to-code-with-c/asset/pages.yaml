    # # Storing data using JSON


    You have seen before that variables in programs hold their value only while the
    program is running. When the user stops the program, all its variables are discarded.
    The Tiny Contacts used local storage in Windows to store the strings of text that
    might update the contact information. But the Time Tracker has a list of objects.
    We need something that takes data we don''t know how to save—the list of contacts—and
    converts it to something we know how to save—as a string of text. It turns out
    that we have exactly this technology in our JSON serialization library from Newtonsoft.


    Serialization is a process that takes a collection of data and converts it to
    a sequence of items. This sequence can be stored or sent to another computer and
    deserialized to recover the data. It is a process that is used all over the Internet.
    The data used by the Snaps method that delivers weather information is sent over
    the Internet in the form of a serialized string. There are a markup of ways to
    perform serialization. Two popular ones are XML (Extensible Markup Language) and
    JSON (JavaScript Object Notation). We are going to use JSON in this chapter to
    look at an XML a little later.


    JSON is very popular as a way of moving information between websites and programs
    that run inside your browser. You can see how it works by taking a look at the
    output it produces. The following statement creates a new Contact instance:


    ```

    Contact = new Contact(name: "Rob", address: "Rob''s House", phone: "Rob''s Phone");

    ```


    If we convert this object into JSON, we get the following string:


    ```

    {"ContactName":"Rob","ContactAddress":"Rob''s House","ContactPhone":"Rob''s Phone","ContactMinutesSpent":0}

    ```'
