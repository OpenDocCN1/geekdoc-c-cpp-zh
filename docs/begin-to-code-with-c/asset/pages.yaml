    # # Types and errors


    Errors that occur when you convert one type to another are some of the hardest
    ones for a programmer to deal with. The intent of the program may be correct—there
    is, in fact, nothing wrong with what you are telling the computer to do—but the
    realization of the program (the statements that implement this intent) may result
    in data loss. The compiler will notice this and refuse to compile the program
    unless you explicitly take responsibility for the conversion.


    ![](img/547210b145d9948b1613255cf1ee9fa4_118_0.png)


    # # Type checking


    Sometimes, finding problems in programs involve a bit of detective work. You have
