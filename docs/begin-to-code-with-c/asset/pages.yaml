    # What you have learned


    In this chapter you have learned that programs use random access memory (RAM)
    to hold program data and code. RAM is a series of numbered locations, each of
    which stores one byte. You don''t need to worry where in memory your data is stored
    because C# allows you to create named variables that are managed automatically.


    Each variable is created with an identifier that is chosen by the programmer.
    The identifier should reflect the purpose of the variable. Variables can have
    values assigned to them, and can be used within expressions in a program. An expression
    is made up of operands (variables and literal values) and operators (like the
    plus and minus signs). Expressions can contain multiple operators and operands,
    and the order in which operators are applied is defined in C# so results tend
    to work out the way you would expect them. If a calculation is performed that
    will generate an invalid result—for example, dividing by 0—a program will fail
    at that point.


    A given variable is defined as being able to hold a particular type of data, like
