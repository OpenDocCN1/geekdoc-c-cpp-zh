    # CODE ANALYSIS


    # Games and sounds


    **Question:** Why do we need a special sound-effect method for games?

    **Answer:** I''ve created a special sound-effect method for games because it is
    possible that a game will try to play lots of sounds at once. This can have a
    bad effect on the way that programs use memory and can cause "stutter" when this
    memory is recovered as the program runs. The PlaySoundEffect method restricts
    the number of sound channels that a game uses by reusing sounds. This means that
    some sounds might not play to completion, but it ensures that the gameplay remains
    good.


