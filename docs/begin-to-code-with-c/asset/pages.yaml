  md: '# # Stopping a program running in Visual Studio


    After finish trying out of the apps, you need to stop the BeginToCode-WithCSharp
    application. You need to do this because Visual Studio will not let you change
    the contents of a program while it is still running. (Doing so would be like performing
    maintenance on a plane while it''s in the air) And yes, you''re about to do some
    coding to change a program!


    When you want to stop the program, you can simply close the window using the Close
    button (X) in the top-right corner, just like you would for any other application.
    However, Visual Studio also provides a button (pointed to in Figure 1-7) that
    you can use to stop a running program. You can use this in the unlikely event
    that your program gets "stuck" in some way


    ![](img/547210b145d9948b1613255cf1ee9fa4_34_0.png)


    **Figure 1-7** Use this to stop a program running in Visual Studio.


    # # Repeating an app


    You can use the **Run that app again** button to rerun the last app you ran. The
    name of that last app is remembered even if you shut down your computer and return
    to the **BeginToDoWithCSharp** solution at a later date.


    > WHAT COULD GO WRONG


    # # Getting “stuck” in an app


    Welcome to our first “What Could Go Wrong” sidebar. Here we look out for pitfalls
    that you might encounter as you work with the code. In this sidebar, we are going
    to consider how you can move between the sample applications.


    Some of the apps are simple demonstrations that run and then complete, allowing
    you to select and run another app from the main application''s navigation panels.
    Other apps are designed to run continuously, just like a “real” application. For
    example, you might have discovered earlier that there is no way to stop the Keep
    Up! game; the program was designed to run continuously.'
  merge: -1
