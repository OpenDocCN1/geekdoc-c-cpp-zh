  md: '# Run


    ![](img/547210b145d9948b1613255cf1ee9fa4_32_0.png)


    **Figure 1-5** Visual Studio''s run button starts the program you are working
    on.


    When you use the run button to start an application, Visual Studio actually does
    two things. First it creates the application from the components that are managed
    within the solution. After this process is called *building the application*.
    After the application has been built, Visual Studio then handles over control
    and lets it run. For our solution, the build process requires an Internet connection
    in order to work.


    Go ahead and press the run button to make the application run. Visual Studio displays
    the "Begin to Code with C#" window that''s shown in **Figure 1-6**. If you like,
    you can move this window around the screen, minimize it, and display it full screen
    by using the **Maximize** button (the square in the top-right corner).


    ![](img/547210b145d9948b1613255cf1ee9fa4_32_1.png)


    **Figure 1-6** The BeginToCodeWithSharp application is now running.


    The **BeginToCodeWithSharp** solution is an application I''ve created for you
    that lets you navigate the book''s sample applications. Programs, in other words,
    is included in the solution as a separate application, and by running the solution
    you can then choose a particular application to run. Some of the apps are fullyfledged
    applications that you could use (or even sell in the Windows Store), and others
    are simple demonstrations of specific programming points that we will look at
    together.'
