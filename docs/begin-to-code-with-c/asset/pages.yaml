  md: '# Is it sensible to assume that the customer measures everything in inches?


    It is never sensible to assume anything about a project. A successful programmer
    needs to make sure that everything he is doing is built on a solid understanding.
    Every assumption that you make increases the potential for disaster.


    # If the program does the wrong thing, is it my fault or the customer’s fault?


    It depends:


    +   - Specification right, program wrong: programmer’s fault

    - Specification wrong, program right: customer’s fault

    - Specification wrong, program wrong: everyone’s fault'
