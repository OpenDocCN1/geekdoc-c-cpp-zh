- img_proc: true
  md: 'to refer to instances of ContactClass. You can think of a reference being like
    a luggage-gage tag, in that it can be tied to a suitcase with a piece of rope
    or twine. If you have the tag, you can follow the rope to the object it is tied
    to.


    But when you create a reference, you don''t actually get one of the things that
    the reference can refer to. This compiler knows, so it displays an error, because
    the line


    ```

    classRob.ContactName = "Rob";

    ```


    is an attempt to find the object that is tied to the classRob and set the Contact-Name
    property to "Rob". But because it is not tied to anything (and the compiler knows),
    the program is not allowed to run. The compiler says, in effect, "You are trying
    to make a program reference that has not been set to refer to anything. Therefore,
    I am going to give you a ''variable undefined'' error."


    You solve this problem by creating an instance of the class and connecting a tag
    to it. You use a statement such as this to:


    ```

    ContactClass classRob;

    classRob = new ContactClass();

    classRob.Name = "Rob";

    ```


    The highlighted statement creates a new ContactClass instance that is referred
    to by the reference named classRob. This relationship is shown in Figure 10-8.


    ![](img/547210b145d9948b1613255cf1ee9fa4_334_0.png)


    Figure 10-8 Creating a new object.


    You have seen the new keyword. We used it to set up structure values by calling
    the constructor for the structure. What the new keyword creates an object, and
    an object is an instance of class. Let me repeat that on its own line.


    An object is an instance of a class.


    It is very important that you understand this.


    Remember from Chapter 3 that class definition provides the design of an object.
    The new keyword asks that the class information be used, like a blueprint, to
    actually make an object in the memory of your program, this object is the instance
    of the class.'
