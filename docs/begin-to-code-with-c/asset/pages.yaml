    \n**Figure 12-4** Scaled city photograph.\n\nThe formal term for the relationship\
    \ between the height and the width of an image is the *aspect ratio* of the image,\
    \ which is the ratio of the height and width of the picture. You see this term\
    \ used in discussions about video displays. A wide-screen video is usually displayed\
    \ with an aspect ratio of 16:9 (16 units wide to 9 units high), whereas an older\
    \ display, and some tablet PCs, have an aspect ratio of 4:3 (4 units wide to 3\
    \ units high). One of the challenges for game developers is to make sure that\
    \ their games work on displays of any size and shape.\n\nCreating a video game\
    \ 385"
