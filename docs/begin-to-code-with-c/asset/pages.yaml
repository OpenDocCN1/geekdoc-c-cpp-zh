    # Creating preset arrays


    You could use the music recorder to enter and play the notes of your favorite
    song, perhaps "Twinkle, Twinkle Little Star.". However, it would soon become tedious
    to enter all the values each time you wanted to hear the song. What you might
    like to do is create a preset array of notes for this song.


    In Chapter 7, you saw how to create preset arrays. The ice-cream sales program
    used a preset array that contained the names of each day of the week so it could
    convert a day number into the name of the day. We can also create a preset array
    of notes. This allows us to build data into our program. Many programs have data
    built into them. A game might have preset data that describes the various levels
    of the game; a conversion program could have the names of the different kinds
    of currency it works. A program can also create preset values. The twinkleTwinkle
    SongNote values is created here.


