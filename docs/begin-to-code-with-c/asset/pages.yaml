    # # Fiddle with the physics in the game


    If you look at the chasing alien code, you will find it uses acceleration values
    of 0.3 and a friction value of 0.99. You might find it fun to change these values
    (not by too much to start) and see what happens to the behavior of the alien as
    it goes after the player. For example, if you make the acceleration values bigger,
    the alien will chase more aggressively. You can create some interesting gameplay
    by adding two aliens for the player to avoid and giving them different physics
    settings to make the aliens behave differently.


    Another interesting addition would be to make one alien chase another. My chasing
    alien chases a rocket, but you could make another alien that follows aliens. If
    you add a number of these to the game, you can make a "snake" of aliens. If you
    make the first alien chase the player, you can develop some very interesting behaviors.'
