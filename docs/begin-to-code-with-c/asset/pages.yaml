  md: '# Make the "time to get up program" work with minutes


    You now know quite a bit about making programs that tell you when you need to
    get up. However, the programs we''ve made up to now have a serious limitation
    in that they work only with the hour value. See if you can make a version that
    will tell me to get up after 7:15 rather than after 7:00.


    **Hint:** You can tie yourself in knots by combining conditions that test the
    hour and the minute values and decide when to trigger the alarm. My strong advice
    is to make the clock work with the minute value only. You can calculate the minute
    of the day by multiplying the hour value by 60 and adding the time—for example,
    7:15 is (7*60) + 15 = 435 of the day. Using the "minute of the day" means that
    your tests become a lot simpler.


    # Adding comments to make a program clearer


    It is very important that you write programs in a way that makes it easy for people
    reading your code to understand what''s going on. You''ve seen that in choosing
    names for variables, you need to be sure that the name describes what the variable
    is being used for. You can also make programs clearer by adding explanatory comments,
    and as soon as you start directing your program to make decisions, you should
    add comments that explain what you are doing. You don''t write comments for the
    computer; you write comments for someone reading your program. You can also use
    comments to indicate the particular version of the program, when it was last modified
    and why, even if it was you.


    A single-line comment starts at the character sequence // and finishes at the
    end of that line, like this:


    ```

    string name;

    name = SnapEngine.ReadLine("What is your name?");

    string upperCaseName = name.ToUpper(); // Convert name to uppercase

    ```'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'You can add single-line comments to the end of a statement or on a line by
    themselves. In Visual Studio, comments are displayed in green to make them stand
    out.


    You can write a comment that spreads over several lines by enclosing your comment
    with /\* and /, like this:


    ```

    string name;

    name = SnapsEngine.ReadLine("What is your name?");

    string upperCaseName = name.ToUpper();

    /* Check the name to provide the personalized greeting;

    change "ROB8" to the name of the person you want to greet */

    if (upperCaseName == "ROB8") {

    // Personal greeting code goes here

    }

    ```


    ![](img/547210b145d9948b1613255cf1ee9fa4_142_0.png)


    The comment in this program makes it clear what the code does and how to work
    with it. When the compiler sees the sequence /* in a program, it ignores the text
    that follows the point where it sees /, which ends the comment. You can put comments
    anywhere in your program. The compiler will completely ignore them.


    Some people say that writing a program is a bit like writing a story. I''m not
    completely convinced that this is true, but I think that although a program is
    not a story as such, a good program has some of the characteristics of good literature:


    +   - It should be easy to read. At no point should a hapless reader be forced
    to backtrack or brush up on knowledge that the writer assumes is all. All the
    names in the text should impart meaning and be distinct from one another.


    +   - It should have good punctuation and grammar. The various components should
    be organized in a clear and consistent way.


    +   - It should look good on the page. A good program is well laid out. The different
    blocks of code should be indented, and statements should be spread over the page
    in a well-formed manner.


    +   - It should be clear who wrote a program and when it was last changed. If
    you wrote something good, you should put your name on it. If you change what you
    wrote, you should add information about the changes you made and why.


    Comments the programmer adds are a big part of a well-written program. A program
    without comments is bit like an airplane that has an autopilot but no windows:
    there is a chance that it might take you to the right place, but it will be very
    hard to tell where it is going from the inside.'
  merge: -1
  pgno: 142
