  md: 'To make this program work, we need a variable that can be used to store the
    name that the guest enters. A name is a string of text, so we need a variable
    that can hold a string.


    ![](img/547210b145d9948b1613255cf1ee9fa4_96_0.png)


    This code is a *declaration* to reserve space in memory for a variable that can
    store a string of text. The C# compiler understands that the word *string* is
    the beginning of the declaration. The word *string* is followed by the name of
    the variable to be created, in this case `guestName`.


    The name you use for a variable is called the *identifier* for that variable.
    The C# compiler makes sure you don''t declare two items that have the same identifier.
    It also enforces some rules for identifiers:


    +   - An identifier can contain letters, digits, and the underscore (_).

    - An identifier must start with a letter or an underscore.

    - You can''t use an identifier that matches any of the keywords that are built
    into C#. The word *string*, for example, is a keyword, so you can''t use *string*
    as an identifier. Each keyword has a specific meaning in the context of the programming
    language.


    ![](img/547210b145d9948b1613255cf1ee9fa4_96_1.png)


    # Identifiers


    **Question:** Would `myName` be a good identifier?

    **Answer:** No. It contains a sign, which is not allowed in an identifier. It
    would be okay to use `myName` or `my_name`.


    **Question:** Would `2ndInningsScore` be a good identifier?

    **Answer:** No. It starts with a number, which is not allowed.


    **Question:** Would `x29z` be a good identifier?

    **Answer:** Yes, this is a legal identifier—C# will not object to it. Even though
    it is valid, it is not meaningful. The identifier for a variable should indicate
    what it is used for, and this name doesn''t do that.


    **Question:** Would `textstring` be a good identifier?'
