  md: "![](img/547210b145d9948b1613255cf1ee9fa4_155_0.png)\n\nYou can change this\
    \ to a message image of your own by replacing the file named ImageNot-Found.png\
    \ in the Images folder in the BeginToCodeWithCSharp solution.\n\nThe `DisplayImage`\
    \ method returns a `bool` value that indicates whether it was able to display\
    \ the image that was requested. Here is the code.\n\n```\nbool displayedOK = SnapsEngine.DisplayImage(url);\n\
    if(displayedOK == false)\n{\n    SnapsEngine.DisplayString(\"Please check your\
    \ internet connection.\");\n}\n```\n\nIf the image is not displayed correctly,\
    \ the program displays a message prompting the user to check or her Internet connection.\
    \ This illustrates an important point about methods when you use them in C# programs:\
    \ a program does not have to use the result that a method returns. The `DisplayImage`\
    \ method always returns whether it worked or not, but the first times we used\
