    \ make its decision:\n\n```\nif (ride == \"Carnival Carousel\")n  if (ageInt >=\
    \ 3)\n    SnapsEngine.DisplayString(\"You can go on the ride.\")\n  else\n   \
    \ SnapsEngine.DisplayString(\"I'm sorry. You are too young.\")\n```\n\nThese conditions\
    \ work for the Carnival Carousel. The first (outer) if statement is used to determine\
    \ the ride selected. The inner if statement makes the appropriate decision based\
    \ on the age of the user.\n\nNow that you have code for the Carnival Carousel,\
    \ you can use it as the basis for the code that handles some of the other rides.\
    \ To make the program correctly for the Jungle Adventure Splash, you need to check\
    \ for a different ride name and confirm or reject the user based on a different\
    \ age value. Remember that for this, a visitor needs to be at least six years\
    \ old. You could check whether the visitor is older than five (ageInt > 5) or\
    \ use the greater-than-or-equal-to operator when you test for the value of ageInt.\n\
    \n```\nif (ride == \"Jungle Adventure Water Splash\")n  if (ageInt >= 6)\n   \
    \ SnapsEngine.DisplayString(\"You can go on the ride.\")\n  else\n    SnapsEngine.DisplayString(\"\
    I'm sorry. You are too young.\")\n```"
