  md: "# Virtual methods\n\nInheritance seems to have brought with it a lot of new\
    \ terms, and a couple of questions.\n\n**Question:** What happens when a method\
    \ is virtual?\n\n**Answer:** As far as users of the method are concerned, there\
    \ is no change to the way the method behaves. It works exactly the same. The difference\
    \ occurs when the program is running and the method is called a virtual method,\
    \ it will check to see whether there are any methods that might be overriding\
    \ this method before it runs.\n\n**Question:** Why can't we make all objects virtual\
    \ for maximum flexibility?\n\n**Answer:** You could make all your methods virtual\
    \ so that they can be overridden at any time by a child method. But there are\
    \ a couple of reasons why you might not want to do that. First, it takes a little\
    \ bit to call a virtual method because the system has to check for any overrides.\
    \ Second, and more important, there may be methods that you never want a child\
    \ class to override. For example, in a Bank class, you would want to be sure that\
    \ some methods, particularly those concerned with depositing and withdrawing funds,\
    \ could not be replaced in child classes. We don't want programmers adding their\
    \ own behaviors to methods as important as these.\n\nIf you run the sample program\
    \ in Ch14_02_SingleFallingStar, you will see a single star fall down the screen.\
    \ When it reaches the bottom of the screen, it is placed back at the top.\n\n\
