  md: '# Have fun with particle effects


    The moving star field is our first. "particle effect." which refers to a game
    element that is created from lots of small particles that have a particular lifetime
    and behavior. You can think of each star as a particle that is created at the
    top of the screen, falls down to the bottom, and is re-created at the top again.
    Many computer games use particle effects to produce things such as showers of
    particles, smoke trails, and even fire. The particles are created with a particular
    behavior, run through that behavior, and are then reset to go around again. You
    could create a moving star field of your own face if you have an ego big enough.


    You can also experiment with what are called "parallax effects." Put simply, this
    is what we experience when we are moving and objects close to us appear to move
    faster than those farther away. You can use a parallax effect to make a star field
    with stars of different sizes, where the larger stars move faster. This can provide
    a realistic effect of movement in dimensional space.


