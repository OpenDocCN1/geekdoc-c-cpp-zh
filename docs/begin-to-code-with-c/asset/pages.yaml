  md: '# Visual Studio projects and solutions


    As you''ll learn, Visual Studio organizes your programming work as projects and
    solutions. When you use Visual Studio to develop an app, an application, a website,
    a Web App, a script, a plug-in, or something else, you create a new project. A
    project is a set of resources (code files, images, and so on) that are used in
    the program you''re developing. When you create the project, Visual Studio also
    creates a solution and includes the project in that. A solution can contain a
    single project, but you can add additional projects to a solution when your program
    needs the resources another project contains. All the projects in a solution are
    combined by Visual Studio to the solution work.


    Visual Studio is automatically associated with solution files (.sln files) in
    the same way that a word processor is associated with a document file. This means
    that when you open the BeginToDoWithCSharp solution, selected in **Figure 1-2**,
    the Visual Studio environment and the solution opened automatically. Go ahead
    and open that solution (by double-clicking, it)


    ![](img/547210b145d9948b1613255cf1ee9fa4_30_0.png)


    **Figure 1-2** Open the solution by double-clicking the file.


    Visual Studio is a protective sort of program that doesn''t automatically trust
    projects that have been downloaded from the Internet, so it asks you to confirm
    that the projects in the solution are okay, as you can see in **Figure 1-3**.
    In this case the projects are fine (after all, if you want), select OK.


    ![](img/547210b145d9948b1613255cf1ee9fa4_30_1.png)


    **Figure 1-3** Visual Studio makes sure that you trust the file you''ve chosen
    to open.


    Chapter 1 Starting out'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Visual Studio provides Solution Explorer, a tool that you can use to browse
    the projects in a solution and to look at each of the files in the solution and
    its projects. Solution Explorer provides an organized view of your solutions and
    projects, so let''s start using it. **Figure 1-4** shows what you see when Visual
    Studio opens the **BeginCodeWithCSharp** solution. (Your display might look slightly
    different depending on what options you have installed.)


    ![](img/547210b145d9948b1613255cf1ee9fa4_31_0.png)


    **Figure 1-4** the main page in Visual Studio. Solution Explorer is at the top
    right of the page.


    The solution contains two projects. One is the **BeginCodeWithCSharp** project,
    and the other is the **Snaps** project, which contains a set of tools that are
    used by the sample applications. (The **Snaps** project provides facilities that
    can be used by any program, including ones that you will create. You''ll learn
