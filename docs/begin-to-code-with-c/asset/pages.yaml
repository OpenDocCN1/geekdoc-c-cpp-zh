  md: 'This cast is actually quite a dangerous one. It tells the compiler to convert
    a real number to an integer by discarding the fractional part. In other words,
    the value 0.999 would be converted to 0, losing a lot of data in the process.
    This is a better way to perform this conversion:


    ```

    int tempInCentigrade = (int)((tempInFahrenheit ~ 32) / 1.8) + 0.5);

    ```


    Adding 0.5 to the value before we cast it ensures that 0.999 is rounded up to
    1.


    # Using casting on operands in an expression


    Another way to fix the problem is to give the compiler more information about
    the values it is working with. If we tell it the value 1.8 is actually a floating-point
    value, it will generate a floating-point version of the expression. You can do
    this by a bit of cunning casting:


    ```

    float tempInCentigrade = (tempInFahrenheit - 32) / (Float) 1.8;

    ```


    Ch04_08_FloatCentigrade


    Now the value 1.8 has been cast to a floating-point value, leading to a floating-point
    result for the calculation.


    # Casting and program performance


    The type of a variable in an expression can have an effect on performance. This
    is worth exploring.


    **Question:** Casting the value of 1.8 to a floating-point value makes the program
    efficient. Why do you think this might be?


    **Answer:** If we cast the double-precision result of the calculation to a floating-point
    value, we are effectively performing a high-precision calculation and then working
    to discard some detail. It is much easier to just perform the calculation by using
    floating-point values and then not have to convert the value at all. In an ordinary
    program this might not make much difference, but it is the kind of issue programmers
    concerned with performance (for example, games developers) worry about a lot.'
