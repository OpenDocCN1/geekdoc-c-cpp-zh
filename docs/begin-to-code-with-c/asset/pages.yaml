    # CODE ANALYSIS


    # # If constructions


    **Question:** Does an if construction to have an else part?


    **Answer:** No. Including an else part is very useful sometimes, but it depends
    on the problem that the program is trying to solve.


    **Question:** Does the condition in an if construction control what the compiler
    does?


    **Answer:** Remember that the compiler is the tool that converts your C# program
    into machine code that can run on the computer. When the C# compiler compiles
    an if construction, it creates code that makes the decision and then runs the
    selected statement. The decision is made when the program runs, not when it is
    compiled.


    **Question:** What happens if a condition is never true?


    **Answer:** If a condition is never true, the statement controlled by the condition
    never gets to run. The compiler will give you the "Unreachable code detected"
    if it detects this situation.


    **Question:** Why is the statement underneath the if condition indent a few spaces?


    **Answer:** This statement doesn''t need to be indented. The C# compiler would
    be able to understand what we want the program to do even if we put everything
    on one line. The indentation is there to make the program easy to understand.
    It shows that the statement underneath the if construction is being controlled
    by the condition above it. Indenting code like this is a common practice that
    the behavior is baked into the Visual Studio editor at the end. In other words,
    when you type an if construction and then press the Enter key at the end of the
    condition part, Visual Studio automatically indents the next line.


    # # Relational operators


    The less-than operator (< ) is called a relational operator because it measures
    the relationship between two values. There are other relational operators you
    can use. The you choose depends on what you want the program to do.'
