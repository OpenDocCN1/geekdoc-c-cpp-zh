    # # What you have learned


    In this first chapter you''ve built yourself a place to work, installed the Visual
    Studio tools you''re going to use to write your programs, and taken a look at
    some of the sample applications provided with the book.


    You''ve discovered that Visual Studio is essentially a “word processor for programmers,”
    where programmers can create and test their software. You''ve also seen that Visual
    Studio uses solutions and projects to organize the resources and program code
    that are put together to make a modern application. And you have created your
    very first application by changing the messages program displays.


    To reinforce your understanding of this, you might want to consider the following
    questions about computers, programs, and programming.


    # ## What is the difference between a program and an application?


    When people talk about software, you will find the words program and application
    (or app) used interchangeably. When I talk about a program, I am describing some
    code that tells the computer to do. I regard an application as something larger
    and more developed. An application brings together program code and assets as
    images to make a complete experience for a user. A program can be as simple as
    a few lines of C#.


    # ## What is the difference between a project and a solution in Visual Studio?


    A solution is the outermost container. A solution can contain projects and is
    frequently used to create a complete application or product. A project can contain
    C# source files and is frequently a complete subcomponent of solution. For example,
    all the C# programs that make up the Snaps framework are packaged as a project—the
    Snaps project in the BeginToCodeWithCSharp solution—that can be used in any solution
    that needs to make use of Snaps resources. You''ll be using the resources in the
    Snaps project a lot as you begin to code your own applications in this book.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Why do we need a special language like C# to program a computer?


    My favorite answer to this question is the pair of sentences "Time flies like
    an arrow. Fruit flies like a banana." A human being can work out that the first
    one refers to something flying, whereas the second sentence is all about insects
    and what they have to lunch. A computer would have a horrible time getting the
    correct meaning from these two statements. The way humans use language is packed
    with ambiguity and confusion. Fortunately, we really powerful computers between
    our ears that are hard-wired for languages, and we spend all our early years programming
    them. By contrast, the poor computer has a very simple machine that works best
    when given hard and fast rules. A programming language contains a set of specific
    constructions that we can make the computer understand so that it can follow our
    instructions correctly.


    # Is Visual Studio the only way to write programs?


    No. There are a great tools that you can use to create software. Some are tied
    to one particular programming language, and others are more general purpose. Visual
    Studio is one of the best, however.


    # What do I do if I break the program?


    Some people worry that things they do with a program on the computer might "break"
    it in some way. I used to worry about this, but I''ve conquered this fear by making
    sure that whenever I do something I always have a way back. You are currently
    in that happy position. You know exactly how to put Visual Studio on a computer,
    and you are using a copy of the demo code that you extracted from the .zip folder
    downloaded. Even if something goes horribly wrong and you end up breaking a program
    so that it won''t work, you simply have to extract a clean copy of the demo code
    from the .zip folder and start again.'
