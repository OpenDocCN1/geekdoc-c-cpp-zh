    # Structures and classes


    We are approaching the most important part of this chapter, where you''ll learn
    the difference between structures (which we have been using for a while now) and
    classes (which you are about to discover how to use). Structure variables are
    managed by *value*, and class variables are managed by *reference*. In Chapter
    8 you save values and references in the context of method parameters; now you
    are going to explore in the context of object design.


    # Sorting and structures


    The updated time-tracking program is nearly finished. When you show it to the
    lawyer, she''s very impressed, but then she makes another request. She''d like
    to be able to see a summary list of her clients sorted in their names. From a
    programming perspective this is not a hard to do. We can use the Bubble Sort technique
    to perform the sort and compare the names of the contacts. However, you need to
    think hard about the effect that sorting has on the data.


    When you sort an array that contains values of structure variables, the computer
    has to do a lot of work. Here are the swaps that swap the content of two adjacent
    elements in the `contacts` array.


    ```

    // The elements are in the wrong order, need to swap them around

    Contact temp = contacts[i];

    contacts[i] = contacts[i + 1];

    contacts[i + 1] = temp;

    ```


    Each time one contact is assigned to another, the entire contents of that contact
    object are moved from one part of memory to another—and the program will'
