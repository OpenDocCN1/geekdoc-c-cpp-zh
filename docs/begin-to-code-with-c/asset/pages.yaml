  md: "# Big and little characters\n\nIf you tried to show off by using the Great\
    \ One program, you might have a problem, depending on how you type your name.\
    \ The equality test regards uppercase and lowercase characters as different; in\
    \ other words, if you enter the string \"ROB\", you will not get special treatment.\n\
    \nAs a way around this, you can ask any string to provide the uppercase version\
    \ of itself. A string value provides a ToUpper method that returns a version of\
    \ a string that has all the lowercase letters replaced by uppercase. You can use\
    \ the ToUpper method like this:\n\n```\nusing SnapsLibrary;\n\nclass Ch05_08_GreatOneUpperCase\n\
    {\n    public void StartProgram() // Variable that has the name of the user.\n\
    \    {\n        // Read the name entered by the user.\n        string name = SnapsEngine.ReadLine(\"\
    What is your name?\"); // Obtain an uppercase version of the name and assign to\
    \ the variable.\n        string userName = name.ToUpper();\n        if (upperName\
    \ == \"ROB\") // Compare the name with an uppercase version.\n            SnapsEngine.DisplayName(\"\
    Hello, Oh great one\"); // Display the message if the name matches.\n    }\n}\n\
    ```\n\nThis version of the program will work whether the user enters \"rob\",\
    \ \"Rob\", or \"ROB\". Whenever you write a program that accepts string input,\
    \ you need to decide how the program should behave if the user enters text that\
    \ is case sensitive. There is also a method called ToLower that you can use to\
    \ convert uppercase letters in a string to lowercase.\n\n# Creating blocks of\
    \ statements\n\nThe if condition controls the execution of a C# statement. Sometimes,\
    \ however you want to perform multiple statements if a condition is true. For\
    \ example, you could write an announcer program that asks for the user's name\
    \ and offers a personalized greeting in that person's favorite color. To do this,\
    \ a program needs to control multiple statements from a single condition."
