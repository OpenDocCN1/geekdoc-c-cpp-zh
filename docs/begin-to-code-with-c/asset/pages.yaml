  md: 'You could also make the program calculate how many pizzas of each type to order.
    If you work on the basis of one pizza for every two people, it is a simple calculation
    to convert the number of orders into the number of pizzas that are to be ordered.
    However, remember that it is not possible to order less than one pizza, and your
    program must behave sensibly if only one person in the group orders a particular
    type.


    You could also use speech output to make the program make choices people. By putting
    conditions in (by using `if` statements), you could make the program say things
    like, "So, will you all vegetarian pizza" or "Chicken wins" as the program is
    being used.


    Here are some other ideas to try:


    +   The fair ride age we created in Chapter 5 could benefit from a loop-structure.
    At the moment, the user has to run the program each time he wants to it. You could
    add a `while` loop so that the program repeatedly asks for selections and requests
    again.


    +   A neighbor of yours wants to open a diner for truck drivers. He is doing research
    on the traffic because he wants to know how many trucks pass his site each day.
    He wants a way of counting cars, vans, trucks, and bikes as they go, and to simply
