- img_proc: true
  md: 'Here are some points to ponder loops.


    # Do we really need loops?


    No. In theory, we could write every program by using a sequence of statements
    and conditions. Loops could be "unrolled" into sections of repeated code. A loop
    that performs an action 10 times could be replaced by 10 copies of the code in
    the loop. Doing without loops would make programs much larger, but it would work.


    # Are loops dangerous?


    In a way. An "unrolled" loop is guaranteed to run through completion. There is
    no way it can get stuck or execute the wrong number of times. However, you have
    seen several times if you get the end conditions wrong or update a counter incorrectly,
    you can have loops that get stuck looping forever or go around the wrong number
    of times. In other words, using loops in a program introduces the potential for
    new kinds of errors. It is interesting to note that in some critical programs,
    such as ones controlling aircraft or nuclear reactors, programmers sometimes avoid
    loops for just this reason.'
