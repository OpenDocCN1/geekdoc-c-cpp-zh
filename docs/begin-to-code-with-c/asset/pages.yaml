  md: "# Creating and declaring a structure\n\nA structure brings together a number\
    \ of separate data items. Each data item is called a field or member of the structure.\
    \ You design the composition of the structure, and the compiler can create variables\
    \ of the structure's type. In other words, making a structure adds a new data\
    \ type to your programs. We could create a SongNote structure like this to hold\
    \ information about one node in a song:\n\n```\npublic struct SongNote {\n   \
    \ public int NotePitch;\n    public double NoteDuration;\n}\n```\n\nYou've seen\
    \ the public modifier modify when you looked at methods in Chapter 8. Later in\
    \ this chapter, you'll see how the C# provides security for members of a structure\
    \ by declaring them as private. This lets a private protects objects and their\
    \ contents from code. You could use this structure to protect the NotePitch and\
    \ NoteDuration values, and could also make the SongNote structure itself only\
    \ in certain parts of your program. But for now, we're going to make everything\
    \ public.\n\nIt's important to remember that we have not stored any data to protect.\
    \ What we have done is tell the C compiler to make a SongNote structure when we\
    \ declare a variable of type. We do that by using a statement such as the following,\
    \ which creates a variable named myNote SongNote.\n\n```\nSongNote myNote;\n```\n\
    \nWhen the compiler creates the name of a type (for example, int string or Song-Note),\
    \ it goes off and lists it in the list of \"things I know how to make\" for instructions\
    \ on how to make this particular of variable. When the compiler instructs, in\
    \ the case of a SongNote variable, the compiler will reserve space for two values:\
    \ an integer NotePitch and a double NoteDuration. (The names of structures, like\
    \ other C elements, are sensitive. You'll get an error if you use songNote instead\
    \ of SongNote.)\n\nPrograms can extract the members of a structure variable and\
    \ as they would with any other variable of type. The following statements sets\
    \ up a SongNote variable that represents C (note number 0) being played for 0.4\
    \ seconds."
