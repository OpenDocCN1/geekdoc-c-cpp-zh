- img_proc: true
  md: '# Do we really need to protect data held in objects?


    It depends on the context of the program. If you are writing a trivial game or
    a program that you will ever use, you can probably dispense with data protection
    and make everything in your program public. However, if you are working with other
    programmers or creating something that will be used by other programmers, I think
    you should pay attention to the integrity of your program objects. In my experience,
    if someone does foolish with one of your software objects causes bad things to
    happen, it will be your fault if an application fails as a result. Saying "That
    was a silly thing to do" is not a valid defense in this situation.


    # Which are better, properties get and set methods?


    We know that we stop uncontrolled changes to the elements in an object by making
    the member data private. However, once we have done that, we now have to allow
    the outside world to access this data in some way; otherwise the data is useless.
    There are essentially two ways to provide this access. You can create get and
    set methods for the data or hide the data behind a public property. It is one
    of those subjects that have strong opinions about. I like using get and set methods
    because the set method can tell you why it didn''t like the value it was without
    having to throw an exception. However, I also like the use of properties.


    However, in a given solution, I''d be more concerned about consistency of approach
    (always using one or the other) rather the advantages or disadvantages of each.


    # What''s to stop someone from changing the contents of an object of ours when
    it is saved?


    This is a good question. A malicious programmer could change the minutesSpent
    value inside by changing the text in the JSON string when it is stored in local
    storage. There are, however, a couple of ways that a program can stop this from
    happening.


    The first way is to use some kind of encryption when you save the data. Encryption
    is a mechanical process that takes in data—for example, "Helloworld”—and converts
    to data that is harder to understand—for example "Ifmmpxmse". This is actually
    not very secure encryption because it replaces each letter by the next one in
    the alphabet. There are much better encryption technologies than this that you
    could use to make it harder for someone to corrupt your data. When a program reads
    it decrypts the information by reversing the encryption process and recovers the
    valid data.'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'The other way to deal with data corruption is to not perform any encoding,
    but to do something to detect when the data in an object has been changed. If
    we combine all the values in a Contact object in a particular way (for example,
    add all the character codes and data values and multiply by a few magic numbers
    on the way), we can generate a check code that is stored with the data. If anyone
    changes the contents of Contact, our program will notice because it recalculate
    the check value when it loads the data and see whether the value matches the stored
    one.


    If you think all this sounds like a game of cat and mouse, you are right. These
    games of encryption and data validation are being played out all over the world
    as network and computer designers battle hackers who are constantly trying to
    break and subvert the digital systems that so much of our lives are based on.
    It''s a fascinating field, and one which is a great place to get some very interesting
    (and well paid) work.'
  merge: -1
