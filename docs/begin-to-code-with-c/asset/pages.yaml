    # Ch12_07_FlickeringSprite


    When you run the program, the ball will flick between two positions on the screen.
    It''s not really moving—it''s just that your brain is fooled into thinking that
    it has been moving from one place to another. If we update the sprite more frequently,
    and we don''t move quite as far with each step, we can create the appearance of
    smooth movement. Here''s some code that shows how this would work:


    ```

    double XBallSpeed = 1;

    double YBallSpeed = 1;

    while (true)

    {

    ball.X = ball.X + XBallSpeed;

    ball.Y = ball.Y + YBallSpeed;

    SnapEngine.DrawGamePage();

    }

    ```


    > Set the speed across (X direction) and down (Y direction) the screen.


    > Loop forever.


    > Update the X and Y positions by the speed.


    > Draw the game on the screen.


    # Ch12_08_MovingSprite


    This is a classic game loop. The first two statements in the game loop update
    the ball position, and then the screen redraw. The loop repeats. If you run this
    program, you will see the ball move smoothly down the screen. You see this structure
    in just about every game you play.


    The ball moves steadily the pixel values are being increased by a ball-speed value
    of 1 each time the loop goes around. The DrawGamePage method has been told to
    draw new frames at a rate of 60 per second, so in one second, the ball moves more
    than half an inch over the screen (remember that there are 96 pixels in inch).
    If you want the ball to move twice as fast, you just have to change the values
    of xBallSpeed and yBallSpeed to 2.


