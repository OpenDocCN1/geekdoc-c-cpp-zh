  md: '# Working with program assets


    There is more to an application than just program code. Programs also often contain
    images and sounds. When the application is built, the images and sounds are incorporated
    into the program and can be referred by it. We can refer to images, sounds, and
    things like them as assets. Some applications contain additional kinds of assets.
    For example, a game might contain maps of the game area.


    # Asset management in Visual Studio


    You can manage the assets in your programs using Solution Explorer, the component
    in Visual Studio that we''ve been using to manage the C# source code we''ve written.
    Assets are added to a project in the same way as program code. You can also create
    folders that use to organize your program''s assets.


    Figure 5-4 shows some of the assets that have been added to the BeginWithSharp.
    The storage structure you see in Solution Explorer is mirrored in the folders
    and files on your computer that you may have noticed there is already a folder
    named Assets in the project. You could put assets in that folder, but it is reserved
    for specific program assets managed by Visual Studio, so it is better to create
    your own folders to store your assets.


    ![](img/547210b145d9948b1613255cf1ee9fa4_151_0.png)


    **Figure 5-4** Assets in a Visual Studio solution.'
  merge: -1
  pgno: 151
- img_proc: true
  md: "Each of the sound effects (beep.wav, ding.wav, and so on) are files that are\
    \ identified in the Visual Studio solution and stored in the SoundEffects folder\
    \ for your computer. When Visual Studio builds the application, it finds each\
    \ of these files and incorporates them into the application. You can then use\
    \ methods in the Library to use these assets in your programs. Let's start by\
    \ playing some sounds.\n\n# Playing sound assets\n\nComputer programs are greatly\
    \ improved by sound effects. Some simple ones are included in the BeginToCodeWithCSharp\
    \ solution. With PlaySoundEffect method, you provide a string that identifies\
    \ the sound to be played. The following statement causes the ding to be played:\n\
    \n```\nSnapsEngine.PlaySoundEffect(\"ding\");\n```\n\nYou can also use the \"\
    beep\", \"gameOver\", and \"lose\". If you use any other name to specify a sound\
    \ effect, the program will not make any sound. But you can add sound-effects from\
    \ files of your own if you want to. The PlaySoundEffect works with .wav and .mp3\
    \ files and looks in the SoundEffects folder for sounds to use. Just drag a sound\
    \ folder from the folder where it's stored on your computer to the SoundEffects\
    \ folder in the BeginToCodeWithCSharp Visual Studio solution. You can then use\
    \ the sound in your program by using the name of the asset file. Here's a small\
    \ program that lets you select a sound from the four built-in sound effects by\
    \ pressing a button. You could easily modify this to make a sound-effects application\
    \ of your own.\n\n```\nusing SnapsLibrary;\n```\n\n```\nclass Ch05_16_SoundEffects\n\
    {\n    public void StartProgram()\n    {\n        string effectName = SnapsEngine.SelectFrom4Buttons(\"\
    beep\", \"ding\", \"gameOver\", \"lose\");\n        SnapsEngine.PlaySoundEffect(effectName);\n\
    \    }\n}\n```"
