  md: "# Examining the preset tune\n\n**Question:** How does the foreach loop the\
    \ preset tune?\n\n**Answer:** A program uses foreach to work through each item\
    \ in an array. Around the loop, the variable note is set to the next successive\
    \ item in the twinkleTwin-kle array.\n\n**Question:** How would you add extra\
    \ notes to the tune?\n\n**Answer:** The program will automatically accommodate\
    \ extra notes if they are added to the program text.\n\n# Objects and responsibilities:\n\
    Making a SongNote play itself\n\nAt the moment, the program is using the SongNote\
    \ structure just as a way of bringing together the note and duration that describe\
    \ a note in a song. Users of the SongNote structure need to know how a SongNote\
    \ structure contains to use it. In other words, if I want to write a program that\
    \ plays songs, I need to know how the NotePitch and NoteDuration members of the\
    \ SongNote are used with the Snaps methods that play music.\n\nIt would be much\
    \ easier if we could just ask a SongNote value to play itself. It turns that you\
    \ can do this because structures can contain methods.\n\n```\npublic struct SongNote\n\
    {\n    public int NotePitch;\n    public double NoteDuration;\n\n    public void\
    \ Play()\n{\n    SnapsEngine.PlayNote(pitch:NotePitch, duration:NoteDuration);\n\
    }\n\n```"
