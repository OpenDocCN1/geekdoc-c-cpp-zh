    \n```\nContact rob = new Contact(name:\"Rob\", address:\"Rob's House\", phone:\"\
    Rob's Phone\");\n```\n\nIn the preceding code, the Name of the property referred\
    \ to by variable rob would be changed to \"I'm a chicken\" by the call of storeContact.\
    \ This would not happen if the Contact type was a structure because in that situation\
    \ the contents of rob would be passed into the call.\n\n**Question:** Which is\
    \ faster, a structure parameter or a class parameter?\n\n**Answer:** When a structure\
    \ is used as an argument to the method, the method receives a copy of the values\
    \ in the structure. In the case of a reference, the size of the argument is much\
    \ smaller, as it just has to tell the method location of the object in memory.\
    \ So it is much faster to pass classes into method calls."
