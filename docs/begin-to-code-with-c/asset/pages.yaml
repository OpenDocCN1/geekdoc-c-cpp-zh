  md: "This statement would result in a random-number generator that produces exactly\
    \ the same sequence of values each time it is used. This is a very useful facility.\
    \ I happen to know (because I've tried it) that if you use a seed of 1, in the\
    \ code above, the first throw of the dice will produce the value 2.\n\nSome computer\
    \ games use a technique known as procedural generation for parts of their game\
    \ worlds. For example, instead of having the game remember parts of the grass\
    \ are green and which parts are blue, a fixed sequence of random numbers is used,\
    \ which means that the ground looks the same each time the program runs, but the\
    \ amount of data storage required is minimal. I also used this technique to make\
    \ characters behave in a manner that repeats each time the game is played, which\
    \ lets the players make progress by learning what the characters do. If we used\
    \ a fixed seed for our random positioning, it would mean that the start positions\
    \ of the ball would follow the same sequence each time the game was played. This\
    \ might be a good thing to do because it encourages the players to practice the\
    \ game and learn the sequence.\n\n# # Generating a random ball start position\n\
    \nThe Keep Up! game contains a method named resetGame that sets everything up\
    \ for a new game.\n\n```\npublic void resetGame() {\n    lives = 3;\n    score\
