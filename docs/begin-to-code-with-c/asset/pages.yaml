    Ch05_18_DisplayImage


    Here you can see how to display an image held in my Flickr account. You can use
    a statement like this to incorporate pictures from the Internet in your programs
    (but remember that you must observe any copyright restrictions).


    The DisplayImage method can use most of the popular image file types, including
    the JPEG, PNG, GIF and TIFF files. Keep in mind if you add a large number of images
    to your program, it will become larger, because the images are stored as part
    of the application. One way to reduce the size of the application is to resize
    the images. Don''t use images directly from your digital camera. Resize them so
    that they are no more than 1500 or 50 pixels width. This would provide you with
    enough detail in almost all cases. The best program that I have found for resizing
    images (and doing lots more besides) is the free image-processing program called
    Paint.Net, which you can download from http://www.getpoint.net/index.html.


    ![](img/547210b145d9948b1613255cf1ee9fa4_154_0.png)


    # # Missing files


    The DisplayImageFromUrl method is prone to failure. It might not be able to load
    an image because the device the program is running on doesn''t have a network
    connection. Alternatively, the programmer might have missed the address of the
    image in the program. In these situations, the method will not be able to display
    a picture, which is a problem.


    However, the method has been written so that it will not stop the program; instead,
    it displays a placeholder image to the user that indicates something went wrong
    in fetching the image, as you can see here:'
