    # What you have learned


    In this chapter, you have learned how to create programs that contain statements
    that are repeated when the program runs. To learn this, you have worked with three
    different-loop constructions that are provided by C#.


    The first of these, the "while(condition) statement" construction, repeats the
    statement as long as the logical expression in the condition is true. If you simply
    put the Boolean value true as condition, the loop will never end. In some cases
    it is a reasonable thing to do because many programs (games, for example) contain
    behaviors that must be repeated while they run.


    The second loop, "do while condition," is very similar to the first one, with
    the important difference that the statement is performed at least once. In the
    "while(condition) statement" construction, the test that determines whether the
    loop repeats is performed at the start of the loop. This means that if the condition
    controlling the loop is false at the start, the loop code is never performed.
    In the second configuration, "do while condition," the test is performed *after*
    the code in the loop has been executed once. This configuration is useful in situations
    where you are reading a value and testing its validity.


    The third loop is completely different from the other. The "for(setup; test; update)
    statement" construction is designed for situations in which the programmer wants
    to manage a loop by setting up a counter of some kind, testing for it reaches
    its limit, and using a statement to update the counter. This configuration is
    especially useful in situations where a program must perform a particular number
    of times.


    The C# language also provides a way for a program to break out of a loop using
    the `break` keyword. This is useful if the program has reached a state where it
    is not meaningful for the loop to be repeated. And there is also the `continue`
    keyword, which causes a loop to continue from the start of the loop statements,
    once the end condition has been tested.'
